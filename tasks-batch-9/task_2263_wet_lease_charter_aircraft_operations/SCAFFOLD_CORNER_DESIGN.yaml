      - name: settlement_preview_is_a_pure_read_that_persists_nothing
        claim_type: Computed read
        grounds:
          - endpoints[GET /wetlease/utilization-periods/{periodId}/settlement-preview]
          - calculations.monthly_utilization_charge
          - calculations.reliability_shortfall_penalty
          - entities.UtilizationPeriod.fields.variant_applied
        distinguishing_aspect: |
          The preview is a projection with its OWN response shape - eleven named fields, none of them
          `status` or `version` - and it must not write anything: the period's version is identical
          before, between and after two previews, and variant_applied stays PROVISIONAL even though the
          preview evaluates the FINAL variant too. On an empty month the guarantee floor dominates, so
          both variants agree at 2,400,000 (5.0000 x 480000) with credited_hours 0.0000 and no
