        distinguishing_aspect: "A metric window is bound to the vendor's own footprint: a CA window on a US-only vendor is ERR_VENDOR_REGION_NOT_SERVED and leaves the vendor's health at its 100.00 no-rows default, while the identical US window is accepted with quality_index 100.00 because a 1500 ms startup sits below the 2000 ms target and contributes zero penalty."
