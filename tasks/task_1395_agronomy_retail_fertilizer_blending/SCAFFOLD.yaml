# =============================================================================
# PRD Benchmark Scaffold — Agronomy Retail & Fertilizer Blending
# =============================================================================

scenario: |
  Agronomy Retail & Fertilizer Blending (Nutrien Ag Solutions retail): soil test
  to recommendation conversion, custom blend formulation & blender scheduling,
  product inventory & seasonal prepay program, delivery/spreader-truck routing,
  nutrient management plan compliance, price risk & fall/spring positioning,
  credit terms & grower financing, environmental (setback/storage) permit

domain_name: agronomy-retail-blending
api_prefix: /agronomy

complexity_profile:
  primary_archetype: quota_allocation        # finite inventory lots, blender windows, truck tons competed for
  secondary_archetype: pricing_engine        # tiered rebates, prepay price locks, fall/spring price positioning
  complexity_layers:
    - optimistic_concurrency                 # OCC on GrowerAccount.version and BlendOrder.version
    - cascading_side_effects                 # batch completion -> lines -> order invoice -> credit ledger -> rebate
    - dual_variant_calculation               # BUILD vs MAINTENANCE rates; PROVISIONAL vs FINAL pricing; EXPOSURE vs BILLED credit
    - rate_threshold_triggers                # volume rebate tiers, N cap, storage capacity
  entity_topology: hybrid                    # grower->field->soiltest tree plus peer resources (products, blenders, trucks) cross-referenced
  state_machine_shape: parallel              # BlendOrder payment_status x fulfillment_status; cyclic machines on Recommendation / NMP / Permit
  relationship_patterns:
    - one_to_many
    - cross_aggregate                        # BlendOrder references Field, Recommendation, PrepayContract across aggregates
    - polymorphic: false
  role_model: peer_roles                     # seven peer roles with segregated resource ownership; Grower is entity-backed
  consistency_model: immediate               # all mutations and cascades atomic within the request

# Reusable role list (all authenticated roles may read)
x-roles:
  all: &all_roles [Grower, Agronomist, PlantOperator, LogisticsDispatcher, CreditManager, ComplianceOfficer, BranchAdmin]

# =============================================================================
# 1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: GrowerAccount
    parent: null
    common_fields: true
    fields:
      - { name: legal_name, type: string, source: input, description: "Grower legal business name" }
      - { name: credit_limit_cents, type: integer, source: input, description: "Maximum outstanding billed credit in cents; must be >= 0" }
      - { name: credit_used_cents, type: integer, source: computed, default: 0, description: "Ledger-derived billed outstanding = sum(INVOICE_POSTED) - sum(PAYMENT_RECEIVED) - sum(REBATE_CREDIT) for this grower" }
      - { name: prepay_balance_cents, type: integer, source: computed, default: 0, description: "Ledger-derived = sum(PREPAY_FUNDED) - sum(PREPAY_DRAWN) - sum(PREPAY_FORFEITED) - sum(PREPAY_REFUNDED) for this grower" }
      - { name: season_closed_tons, type: number, source: computed, default: 0, description: "Sum of tons_total over this grower's BlendOrders whose fulfillment_status == CLOSED" }
      - { name: credit_status, type: enum, source: system, default: ACTIVE, description: "ACTIVE | CREDIT_HOLD | SUSPENDED" }

  - name: Field
    parent: GrowerAccount
    common_fields: true
    fields:
      - { name: grower_id, type: string, source: system, description: "FK -> GrowerAccount.id; owning grower (from path)" }
      - { name: name, type: string, source: input, description: "Field name" }
      - { name: acres, type: number, source: input, description: "Field size in acres; must be > 0" }
      - { name: watershed_zone, type: enum, source: input, default: STANDARD, description: "STANDARD | PROTECTED | CRITICAL; drives phosphorus restriction" }

  - name: SoilTest
    parent: Field
    common_fields: true
    fields:
      - { name: field_id, type: string, source: system, description: "FK -> Field.id; sampled field (from path)" }
      - { name: lab_code, type: string, source: input, description: "Optional laboratory reference code", default: null }
      - { name: sampled_at, type: datetime, source: system, description: "Set when sampling recorded (logical clock)" }
      - { name: p_ppm, type: integer, source: input, description: "Soil phosphorus ppm (Bray-1), posted with lab results; null until RESULTED" }
      - { name: k_ppm, type: integer, source: input, description: "Soil potassium ppm, posted with lab results; null until RESULTED" }
      - { name: ph, type: number, source: input, description: "Soil pH, posted with lab results" }
      - { name: organic_matter_pct, type: number, source: input, description: "Optional organic matter %", default: null }
      - { name: status, type: enum, source: system, default: REQUESTED, description: "REQUESTED | SAMPLED | RESULTED" }

  - name: Recommendation
    parent: Field
    common_fields: true
    fields:
      - { name: soil_test_id, type: string, source: system, description: "FK -> SoilTest.id; source soil test (from path)" }
      - { name: field_id, type: string, source: system, description: "FK -> Field.id; denormalized from soil test for compliance joins" }
      - { name: crop, type: enum, source: input, description: "CORN | SOYBEAN | WHEAT" }
      - { name: yield_goal_bu_per_acre, type: integer, source: input, description: "Yield goal bushels per acre; > 0" }
      - { name: rate_variant, type: enum, source: input, description: "BUILD_RATE | MAINTENANCE_RATE; selects calculation variant" }
      - { name: previous_crop, type: enum, source: input, default: CORN, description: "CORN | SOYBEAN | WHEAT; SOYBEAN grants N credit" }
      - { name: manure_credit_n_lbs, type: integer, source: input, default: 0, description: "Manure N credit lbs/acre applied to N rate" }
      - { name: n_lbs_per_acre, type: integer, source: computed, description: "Recommended N lbs/acre per nutrient_recommendation_rates" }
      - { name: p2o5_lbs_per_acre, type: integer, source: computed, description: "Recommended P2O5 lbs/acre per nutrient_recommendation_rates" }
      - { name: k2o_lbs_per_acre, type: integer, source: computed, description: "Recommended K2O lbs/acre per nutrient_recommendation_rates" }
      - { name: valid_until, type: datetime, source: input, description: "Recommendation expiry instant; lazy transition to EXPIRED afterwards" }
      - { name: return_reason, type: string, source: system, description: "Reviewer note when returned to DRAFT", default: null }
      - { name: status, type: enum, source: system, default: DRAFT, description: "DRAFT | PENDING_REVIEW | APPROVED | SUPERSEDED | EXPIRED" }

  - name: NutrientManagementPlan
    parent: Field
    common_fields: true
    fields:
      - { name: field_id, type: string, source: system, description: "FK -> Field.id; planned field (from path)" }
      - { name: crop_year, type: integer, source: input, description: "Crop year the plan governs" }
      - { name: n_cap_lbs_per_acre, type: number, source: input, description: "Regulatory N cap lbs/acre for the field-year; > 0" }
      - { name: manure_credit_n_lbs, type: integer, source: input, default: 0, description: "Declared manure N credit lbs/acre" }
      - { name: previous_crop_credit_n_lbs, type: integer, source: input, default: 0, description: "Declared previous-crop N credit lbs/acre" }
      - { name: p_restriction_active, type: boolean, source: computed, default: false, description: "Computed at approve: true when field watershed_zone IN {PROTECTED, CRITICAL} AND latest RESULTED soil test p_ppm >= P_DRAWDOWN_PPM" }
      - { name: valid_from, type: datetime, source: input, description: "Plan validity start (inclusive)" }
      - { name: valid_to, type: datetime, source: input, description: "Plan validity end; lazy EXPIRED when now > valid_to" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "DRAFT | SUBMITTED | APPROVED | SUSPENDED | EXPIRED" }

  - name: EnvironmentalPermit
    parent: null
    common_fields: true
    fields:
      - { name: permit_type, type: enum, source: input, description: "FERTILIZER_STORAGE | BLENDER_SITE | ANHYDROUS_STORAGE" }
      - { name: site_code, type: string, source: input, description: "Retail site code the permit covers" }
      - { name: max_storage_tons, type: number, source: input, description: "Storage capacity cap; required for FERTILIZER_STORAGE, null otherwise", default: null }
      - { name: setback_ft, type: integer, source: input, description: "Required setback distance in feet from water/dwellings; > 0" }
      - { name: issued_at, type: datetime, source: system, description: "Set to logical clock at activation", default: null }
      - { name: expires_at, type: datetime, source: system, description: "Expiry instant supplied at activate/renew; lazy EXPIRED when now > expires_at", default: null }
      - { name: status, type: enum, source: system, default: APPLICATION, description: "APPLICATION | UNDER_INSPECTION | ACTIVE | EXPIRED | RENEWAL | REVOKED" }

  - name: Product
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Product name; unique" }
      - { name: analysis_n_pct, type: number, source: input, description: "Nitrogen analysis percent (e.g. 46 for urea); 0..100" }
      - { name: analysis_p2o5_pct, type: number, source: input, description: "P2O5 analysis percent; 0..100" }
      - { name: analysis_k2o_pct, type: number, source: input, description: "K2O analysis percent; 0..100" }
      - { name: form, type: enum, source: input, description: "DRY | LIQUID" }
      - { name: regulated_flag, type: boolean, source: input, default: false, description: "True for regulated products (e.g. anhydrous ammonia) requiring extra permit checks" }

  - name: PriceSheet
    parent: Product
    common_fields: true
    fields:
      - { name: product_id, type: string, source: system, description: "FK -> Product.id; priced product (from path)" }
      - { name: season, type: enum, source: input, description: "FALL | SPRING | SUMMER | IN_SEASON; fall/spring positioning tag" }
      - { name: price_per_ton_cents, type: integer, source: input, description: "Price per ton in cents; > 0" }
      - { name: effective_from, type: datetime, source: input, description: "Window start, inclusive (half-open window)" }
      - { name: effective_to, type: datetime, source: input, description: "Window end, exclusive (half-open window); must be > effective_from" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "DRAFT | PUBLISHED | EXPIRED" }

  - name: InventoryLot
    parent: Product
    common_fields: true
    fields:
      - { name: product_id, type: string, source: input, description: "FK -> Product.id; stocked product" }
      - { name: warehouse_code, type: string, source: input, description: "Storage location code at the retail site" }
      - { name: received_tons, type: number, source: input, description: "Tons received on this lot; > 0" }
      - { name: on_hand_tons, type: number, source: computed, description: "Initialized to received_tons; decremented by actual tons at batch completion" }
      - { name: reserved_tons, type: number, source: computed, default: 0, description: "Tons reserved by BOOKED/SCHEDULED orders (FIFO allocation)" }
      - { name: shipped_tons, type: number, source: computed, default: 0, description: "Tons converted to shipped at batch completion" }
      - { name: lot_cost_cents_per_ton, type: integer, source: input, description: "Cost basis cents per ton" }
      - { name: received_at, type: datetime, source: system, description: "Receipt instant (logical clock); FIFO sort key" }

  - name: PrepayProgram
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Program name (e.g. FALL-2026 PREPAY)" }
      - { name: season, type: enum, source: input, description: "FALL | SPRING" }
      - { name: enrollment_open_on, type: datetime, source: input, description: "Enrollment window start (inclusive)" }
      - { name: enrollment_close_on, type: datetime, source: input, description: "Enrollment window end (inclusive); lazy ENROLLMENT_CLOSED afterwards" }
      - { name: funding_deadline, type: datetime, source: input, description: "Last instant funding accepted (inclusive boundary)" }
      - { name: deposit_pct, type: number, source: input, description: "Required deposit fraction of contract value (e.g. 0.30)" }
      - { name: discount_pct, type: number, source: input, description: "Prepay discount fraction off the published price (e.g. 0.05)" }
      - { name: default_penalty_pct, type: number, source: input, description: "Fraction of funded amount forfeited on default" }
      - { name: status, type: enum, source: system, default: ENROLLMENT_OPEN, description: "ENROLLMENT_OPEN | ENROLLMENT_CLOSED | SETTLED" }

  - name: PrepayContract
    parent: GrowerAccount
    common_fields: true
    fields:
      - { name: grower_id, type: string, source: system, description: "FK -> GrowerAccount.id; contracting grower (from path)" }
      - { name: prepay_program_id, type: string, source: input, description: "FK -> PrepayProgram.id; governing program" }
      - { name: product_id, type: string, source: input, description: "FK -> Product.id; price-locked product" }
      - { name: committed_tons, type: number, source: input, description: "Committed tonnage; > 0" }
      - { name: unit_price_cents, type: integer, source: computed, description: "Locked unit price = round_half_up(current PUBLISHED sheet price x (1 - program.discount_pct))" }
      - { name: contract_value_cents, type: integer, source: computed, description: "= round_half_up(unit_price_cents x committed_tons)" }
      - { name: deposit_due_cents, type: integer, source: computed, description: "= round_half_up(contract_value_cents x program.deposit_pct)" }
      - { name: funded_cents, type: integer, source: system, default: 0, description: "Cumulative funded cents" }
      - { name: drawn_cents, type: integer, source: system, default: 0, description: "Cumulative cents drawn down by invoiced orders" }
      - { name: forfeited_cents, type: integer, source: system, default: 0, description: "Cents forfeited on default" }
      - { name: status, type: enum, source: system, default: SIGNED, description: "SIGNED | PARTIALLY_FUNDED | FUNDED | DEFAULTED | CLOSED_SETTLED | REFUNDED" }

  - name: BlendOrder
    parent: GrowerAccount
    common_fields: true
    fields:
      - { name: grower_id, type: string, source: system, description: "FK -> GrowerAccount.id; ordering grower (from path)" }
      - { name: field_id, type: string, source: input, description: "FK -> Field.id; application field; must belong to grower" }
      - { name: recommendation_id, type: string, source: input, description: "FK -> Recommendation.id; governing recommendation; must belong to same field" }
      - { name: prepay_contract_id, type: string, source: input, description: "FK -> PrepayContract.id; required when price_mode == PRICE_LOCKED, else null", default: null }
      - { name: acres, type: number, source: input, description: "Application acres; must equal field.acres" }
      - { name: price_mode, type: enum, source: input, description: "FLOATING | PRICE_LOCKED" }
      - { name: tons_total, type: number, source: computed, description: "Sum of line quantity_tons (target) before batching; replaced by actual tons at completion" }
      - { name: n_lbs_per_acre, type: number, source: computed, description: "Sum over lines of round_half_up(target_rate_lbs_per_acre x product.analysis_n_pct / 100, 3)" }
      - { name: provisional_total_cents, type: integer, source: computed, description: "Sum of per-line rounded provisional amounts (per-line-then-sum order pinned)" }
      - { name: final_total_cents, type: integer, source: computed, description: "Sum of per-line rounded final amounts at batch completion; null until then", default: null }
      - { name: rebate_cents, type: integer, source: computed, default: 0, description: "Seasonal volume rebate credited at invoicing" }
      - { name: invoiced_at, type: datetime, source: system, description: "Instant (logical clock) the invoice was posted at batch completion; null until then; waterfall sort key", default: null }
      - { name: fulfillment_status, type: enum, source: system, default: QUOTED, description: "QUOTED | BOOKED | SCHEDULED | BATCHED | LOADED | DELIVERED | APPLIED_CONFIRMED | CLOSED | CANCELLED" }
      - { name: payment_status, type: enum, source: system, default: UNPAID, description: "UNPAID | PREPAY_APPLIED | CREDIT_APPROVED | INVOICED | PAID | CANCELLED" }

  - name: BlendLine
    parent: BlendOrder
    common_fields: true
    fields:
      - { name: blend_order_id, type: string, source: system, description: "FK -> BlendOrder.id; owning order (from path)" }
      - { name: product_id, type: string, source: input, description: "FK -> Product.id; blend component product" }
      - { name: target_rate_lbs_per_acre, type: number, source: input, description: "Target product rate lbs/acre; > 0, max 1 decimal" }
      - { name: actual_rate_lbs_per_acre, type: number, source: system, description: "Scale-recorded actual rate at batch completion; null until then", default: null }
      - { name: quantity_tons, type: number, source: computed, description: "= round_half_up(target_rate_lbs_per_acre x order.acres / 2000, 3)" }
      - { name: actual_quantity_tons, type: number, source: computed, description: "= round_half_up(actual_rate_lbs_per_acre x order.acres / 2000, 3); null until completion", default: null }
      - { name: unit_price_cents, type: integer, source: computed, description: "Provisional price resolution at quote: PRICE_LOCKED line for contract product uses contract.unit_price_cents, else current PUBLISHED sheet price" }
      - { name: line_provisional_cents, type: integer, source: computed, description: "= round_half_up(quantity_tons x unit_price_cents)" }
      - { name: final_unit_price_cents, type: integer, source: computed, description: "Final price at completion: PRICE_LOCKED contract product -> contract.unit_price_cents; FLOATING -> current PUBLISHED sheet price at completion", default: null }
      - { name: line_final_cents, type: integer, source: computed, description: "= round_half_up(actual_quantity_tons x final_unit_price_cents)", default: null }
      - { name: variance_flag, type: boolean, source: computed, default: false, description: "True when |actual - target| / target > BATCH_VARIANCE_TOLERANCE_PCT" }

  - name: Blender
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Blender name" }
      - { name: site_code, type: string, source: input, description: "Retail site code; ties to BLENDER_SITE permit" }
      - { name: capacity_tons_per_hour, type: number, source: input, description: "Rated throughput tons/hour; > 0" }
      - { name: form_supported, type: enum, source: input, description: "DRY | LIQUID | BOTH" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE | OUT_OF_SERVICE" }

  - name: BlendBatch
    parent: BlendOrder
    common_fields: true
    fields:
      - { name: blend_order_id, type: string, source: system, description: "FK -> BlendOrder.id; batched order (from path)" }
      - { name: blender_id, type: string, source: input, description: "FK -> Blender.id; assigned blender" }
      - { name: scheduled_start, type: datetime, source: input, description: "Occupied window start (closed interval)" }
      - { name: scheduled_end, type: datetime, source: input, description: "Occupied window end (closed interval); must be > scheduled_start" }
      - { name: void_reason, type: string, source: system, description: "Reason when voided", default: null }
      - { name: status, type: enum, source: system, default: SCHEDULED, description: "SCHEDULED | IN_PROGRESS | COMPLETED | VOIDED" }

  - name: Truck
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Truck identifier" }
      - { name: capacity_tons, type: number, source: input, description: "Maximum payload tons; > 0" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE | OUT_OF_SERVICE" }

  - name: DeliveryRoute
    parent: null
    common_fields: true
    fields:
      - { name: truck_id, type: string, source: input, description: "FK -> Truck.id; assigned truck" }
      - { name: route_date, type: string, source: input, description: "Route date YYYY-MM-DD; at most one non-CANCELLED route per truck per date" }
      - { name: total_stop_tons, type: number, source: computed, default: 0, description: "Sum of stop_tons over PLANNED/DELIVERED stops" }
      - { name: status, type: enum, source: system, default: PLANNED, description: "PLANNED | DISPATCHED | COMPLETED | CANCELLED" }

  - name: DeliveryStop
    parent: DeliveryRoute
    common_fields: true
    fields:
      - { name: delivery_route_id, type: string, source: system, description: "FK -> DeliveryRoute.id; owning route (from path)" }
      - { name: blend_order_id, type: string, source: input, description: "FK -> BlendOrder.id; order being delivered; must be BATCHED" }
      - { name: sequence, type: integer, source: input, description: "Stop sequence within route; >= 1" }
      - { name: window_start, type: datetime, source: input, description: "Promised window start" }
      - { name: window_end, type: datetime, source: input, description: "Promised window end; must be > window_start" }
      - { name: stop_tons, type: number, source: computed, description: "Order tons_total snapshot at stop creation" }
      - { name: delivered_at, type: datetime, source: system, description: "Delivery instant (logical clock or explicit input)", default: null }
      - { name: status, type: enum, source: system, default: PLANNED, description: "PLANNED | DELIVERED | CANCELLED" }

  - name: CreditLedgerEntry
    parent: GrowerAccount
    common_fields: false
    fields:
      - { name: grower_id, type: string, source: system, description: "FK -> GrowerAccount.id; ledger owner (from path)" }
      - { name: entry_type, type: enum, source: system, description: "PREPAY_FUNDED | PREPAY_DRAWN | PREPAY_FORFEITED | PREPAY_REFUNDED | INVOICE_POSTED | PAYMENT_RECEIVED | REBATE_CREDIT" }
      - { name: amount_cents, type: integer, source: system, description: "Signed cents: funding/invoices positive, payments/rebates/draws/forfeits/refunds negative per balance convention" }
      - { name: reference_id, type: string, source: system, description: "Originating BlendOrder or PrepayContract id" }
      - { name: resulting_credit_used_cents, type: integer, source: computed, description: "Grower credit_used_cents immediately after this entry" }
      - { name: resulting_prepay_balance_cents, type: integer, source: computed, description: "Grower prepay_balance_cents immediately after this entry" }

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: GrowerAccount
    initial_state: ACTIVE   # credit_status dimension
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: CREDIT_HOLD
        trigger: "POST /agronomy/growers/{growerId}/credit-hold"
        actor: CreditManager
        preconditions:
          - "credit_status == ACTIVE (else ERR_INVALID_TRANSITION)"
        side_effects:
          - "increments GrowerAccount.version by 1"
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /agronomy/growers/{growerId}/suspend"
        actor: CreditManager
        preconditions:
          - "credit_status IN {ACTIVE, CREDIT_HOLD} (else ERR_INVALID_TRANSITION)"
        side_effects:
          - "increments GrowerAccount.version by 1"
      - from: CREDIT_HOLD
        to: SUSPENDED
        trigger: "POST /agronomy/growers/{growerId}/suspend"
        actor: CreditManager
        preconditions:
          - "credit_status IN {ACTIVE, CREDIT_HOLD}"
        side_effects:
          - "increments GrowerAccount.version by 1"
      - from: CREDIT_HOLD
        to: ACTIVE
        trigger: "POST /agronomy/growers/{growerId}/credit-release"
        actor: CreditManager
        preconditions:
          - "credit_status IN {CREDIT_HOLD, SUSPENDED} (else ERR_INVALID_TRANSITION)"
          - "credit_used_cents <= credit_limit_cents (else ERR_CREDIT_LIMIT_EXCEEDED)"
        side_effects:
          - "increments GrowerAccount.version by 1"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /agronomy/growers/{growerId}/credit-release"
        actor: CreditManager
        preconditions:
          - "credit_status IN {CREDIT_HOLD, SUSPENDED}"
          - "credit_used_cents <= credit_limit_cents"
        side_effects:
          - "increments GrowerAccount.version by 1"

  - entity: SoilTest
    initial_state: REQUESTED
    terminal_states: [RESULTED]
    transitions:
      - from: REQUESTED
        to: SAMPLED
        trigger: "POST /agronomy/soil-tests/{soilTestId}/record-sampling"
        actor: Agronomist
        preconditions:
          - "status == REQUESTED (else ERR_INVALID_TRANSITION)"
        side_effects:
          - "sampled_at = logical clock now (or input sampled_at when supplied)"
      - from: SAMPLED
        to: RESULTED
        trigger: "POST /agronomy/soil-tests/{soilTestId}/post-results"
        actor: Agronomist
        preconditions:
          - "status == SAMPLED (else ERR_INVALID_TRANSITION)"
        side_effects:
          - "p_ppm, k_ppm, ph, organic_matter_pct persisted; results immutable afterwards"

  - entity: Recommendation
    initial_state: DRAFT
    terminal_states: [SUPERSEDED, EXPIRED]
    transitions:
      - from: DRAFT
        to: PENDING_REVIEW
        trigger: "POST /agronomy/recommendations/{recommendationId}/submit"
        actor: Agronomist
        preconditions:
          - "status == DRAFT (else ERR_INVALID_TRANSITION)"
        side_effects: []
      - from: PENDING_REVIEW
        to: DRAFT
        trigger: "POST /agronomy/recommendations/{recommendationId}/return"
        actor: ComplianceOfficer
        preconditions:
          - "status == PENDING_REVIEW (else ERR_INVALID_TRANSITION)"
        side_effects:
          - "return_reason = input reason"
      - from: PENDING_REVIEW
        to: APPROVED
        trigger: "POST /agronomy/recommendations/{recommendationId}/approve"
        actor: ComplianceOfficer
        preconditions:
          - "status == PENDING_REVIEW (else ERR_INVALID_TRANSITION)"
        side_effects: []
      - from: APPROVED
        to: SUPERSEDED
        trigger: "POST /agronomy/recommendations/{recommendationId}/supersede"
        actor: Agronomist
        preconditions:
          - "status == APPROVED (else ERR_INVALID_TRANSITION)"
        side_effects:
          - "subsequent BlendOrder creation referencing this recommendation fails with ERR_RECOMMENDATION_SUPERSEDED"
      - from: APPROVED
        to: EXPIRED
        trigger: "system (lazy: evaluated whenever the recommendation is read or referenced and now > valid_until)"
        actor: system
        preconditions:
          - "now > valid_until"
        side_effects:
          - "subsequent BlendOrder creation fails with ERR_RECOMMENDATION_EXPIRED"

  - entity: NutrientManagementPlan
    initial_state: DRAFT
    terminal_states: [EXPIRED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /agronomy/nutrient-plans/{planId}/submit"
        actor: Agronomist
        preconditions:
          - "status == DRAFT (else ERR_INVALID_TRANSITION)"
        side_effects: []
      - from: SUBMITTED
        to: DRAFT
        trigger: "POST /agronomy/nutrient-plans/{planId}/return"
        actor: ComplianceOfficer
        preconditions:
          - "status == SUBMITTED (else ERR_INVALID_TRANSITION)"
        side_effects: []
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /agronomy/nutrient-plans/{planId}/approve"
        actor: ComplianceOfficer
        preconditions:
          - "status == SUBMITTED (else ERR_INVALID_TRANSITION)"
        side_effects:
          - "p_restriction_active = (field.watershed_zone IN {PROTECTED, CRITICAL}) AND (latest RESULTED SoilTest of field has p_ppm >= P_DRAWDOWN_PPM); false when no RESULTED soil test exists"
      - from: APPROVED
        to: SUSPENDED
        trigger: "POST /agronomy/nutrient-plans/{planId}/suspend"
        actor: ComplianceOfficer
        preconditions:
          - "status == APPROVED (else ERR_INVALID_TRANSITION)"
        side_effects:
          - "BlendOrder booking on this field now fails ERR_NMP_REQUIRED until reinstated"
      - from: SUSPENDED
        to: APPROVED
        trigger: "POST /agronomy/nutrient-plans/{planId}/reinstate"
        actor: ComplianceOfficer
        preconditions:
          - "status == SUSPENDED (else ERR_INVALID_TRANSITION)"
        side_effects: []
      - from: APPROVED
        to: EXPIRED
        trigger: "system (lazy: now > valid_to)"
        actor: system
        preconditions:
          - "now > valid_to"
        side_effects:
          - "BlendOrder booking on this field now fails ERR_NMP_REQUIRED"

  - entity: EnvironmentalPermit
    initial_state: APPLICATION
    terminal_states: [REVOKED]
    transitions:
      - from: APPLICATION
        to: UNDER_INSPECTION
        trigger: "POST /agronomy/environmental-permits/{permitId}/begin-inspection"
        actor: ComplianceOfficer
        preconditions:
          - "status == APPLICATION (else ERR_INVALID_TRANSITION)"
        side_effects: []
      - from: UNDER_INSPECTION
        to: ACTIVE
        trigger: "POST /agronomy/environmental-permits/{permitId}/activate"
        actor: ComplianceOfficer
        preconditions:
          - "status IN {UNDER_INSPECTION, RENEWAL} (else ERR_INVALID_TRANSITION)"
          - "expires_at input must be > logical clock now (else ERR_VALIDATION_FAILED)"
        side_effects:
          - "issued_at = logical clock now; expires_at = input"
      - from: RENEWAL
        to: ACTIVE
        trigger: "POST /agronomy/environmental-permits/{permitId}/activate"
        actor: ComplianceOfficer
        preconditions:
          - "status IN {UNDER_INSPECTION, RENEWAL}"
        side_effects:
          - "issued_at = logical clock now; expires_at = input"
      - from: ACTIVE
        to: EXPIRED
        trigger: "system (lazy: evaluated on every permit-gated operation and on read; now > expires_at)"
        actor: system
        preconditions:
          - "now > expires_at"
        side_effects:
          - "inventory receipts and batch scheduling gated by this permit now fail ERR_PERMIT_NOT_ACTIVE"
      - from: EXPIRED
        to: RENEWAL
        trigger: "POST /agronomy/environmental-permits/{permitId}/renew"
        actor: ComplianceOfficer
        preconditions:
          - "status == EXPIRED (else ERR_INVALID_TRANSITION)"
        side_effects: []
      - from: ACTIVE
        to: REVOKED
        trigger: "POST /agronomy/environmental-permits/{permitId}/revoke"
        actor: ComplianceOfficer
        preconditions:
          - "status == ACTIVE (else ERR_INVALID_TRANSITION)"
        side_effects:
          - "CASCADE hop 1 (permit -> blender): every Blender with site_code == permit.site_code AND status == ACTIVE -> OUT_OF_SERVICE"
          - "CASCADE hop 2 (blender -> batch): every BlendBatch with blender_id of a blender taken OUT_OF_SERVICE in hop 1 AND status == SCHEDULED -> VOIDED (void_reason = PERMIT_REVOKED)"
          - "CASCADE hop 3 (batch -> order): each BlendOrder whose batch was voided in hop 2: fulfillment_status SCHEDULED -> BOOKED"

  - entity: PriceSheet
    initial_state: DRAFT
    terminal_states: [EXPIRED]
    transitions:
      - from: DRAFT
        to: PUBLISHED
        trigger: "POST /agronomy/price-sheets/{priceSheetId}/publish"
        actor: BranchAdmin
        preconditions:
          - "status == DRAFT (else ERR_INVALID_TRANSITION)"
          - "half-open window [effective_from, effective_to) must not intersect any other PUBLISHED sheet for the same product (else ERR_PRICE_WINDOW_OVERLAP)"
        side_effects: []
      - from: PUBLISHED
        to: EXPIRED
        trigger: "POST /agronomy/price-sheets/{priceSheetId}/expire OR system (lazy: now >= effective_to)"
        actor: BranchAdmin
        preconditions:
          - "status == PUBLISHED for manual expire (else ERR_INVALID_TRANSITION)"
        side_effects:
          - "price resolution for this product now uses the next PUBLISHED sheet whose window contains now; if none, quoting/completion fails ERR_NO_CURRENT_PRICE"

  - entity: PrepayProgram
    initial_state: ENROLLMENT_OPEN
    terminal_states: [SETTLED]
    transitions:
      - from: ENROLLMENT_OPEN
        to: ENROLLMENT_CLOSED
        trigger: "POST /agronomy/prepay-programs/{programId}/close-enrollment OR system (lazy: now > enrollment_close_on)"
        actor: BranchAdmin
        preconditions:
          - "status == ENROLLMENT_OPEN for manual close (else ERR_INVALID_TRANSITION)"
        side_effects:
          - "new PrepayContract creation fails ERR_PROGRAM_NOT_ENROLLING"
      - from: ENROLLMENT_CLOSED
        to: SETTLED
        trigger: "POST /agronomy/prepay-programs/{programId}/settle"
        actor: BranchAdmin
        preconditions:
          - "status == ENROLLMENT_CLOSED (else ERR_INVALID_TRANSITION)"
          - "now > funding_deadline (else ERR_PREPAY_FUNDING_DEADLINE_PASSED is NOT raised here; settling early fails ERR_INVALID_TRANSITION with message 'funding window still open')"
        side_effects:
          - "CASCADE hop 1 (program -> contract): every PrepayContract of this program in SIGNED or PARTIALLY_FUNDED -> DEFAULTED"
          - "CASCADE hop 2 (contract -> grower ledger): per defaulted contract, forfeited = round_half_up(funded_cents x program.default_penalty_pct); append CreditLedgerEntry PREPAY_FORFEITED amount=-forfeited; grower.prepay_balance_cents -= forfeited; remainder (funded - forfeited) stays in prepay_balance_cents; increments GrowerAccount.version"
          - "CASCADE hop 3 (contract -> order): every BlendOrder with prepay_contract_id of a defaulted contract AND payment_status == PREPAY_APPLIED: payment_status -> UNPAID, price_mode -> FLOATING, fulfillment_status BOOKED -> QUOTED (inventory reservation released)"

  - entity: PrepayContract
    initial_state: SIGNED
    terminal_states: [DEFAULTED, CLOSED_SETTLED, REFUNDED]
    transitions:
      - from: SIGNED
        to: PARTIALLY_FUNDED
        trigger: "POST /agronomy/prepay-contracts/{contractId}/fund with 0 < cumulative funded_cents < contract_value_cents"
        actor: CreditManager
        preconditions:
          - "status IN {SIGNED, PARTIALLY_FUNDED} (else ERR_INVALID_TRANSITION)"
          - "now <= program.funding_deadline inclusive (else ERR_PREPAY_FUNDING_DEADLINE_PASSED)"
          - "funded_cents + amount_cents <= contract_value_cents (else ERR_PREPAY_OVERFUND)"
        side_effects:
          - "funded_cents += amount_cents; append CreditLedgerEntry PREPAY_FUNDED +amount; grower.prepay_balance_cents += amount_cents; increments GrowerAccount.version"
      - from: PARTIALLY_FUNDED
        to: FUNDED
        trigger: "POST /agronomy/prepay-contracts/{contractId}/fund when cumulative funded_cents >= contract_value_cents"
        actor: CreditManager
        preconditions:
          - "same as SIGNED -> PARTIALLY_FUNDED"
        side_effects:
          - "same ledger effects as funding above"
      - from: SIGNED
        to: FUNDED
        trigger: "POST /agronomy/prepay-contracts/{contractId}/fund when first funding reaches contract_value_cents"
        actor: CreditManager
        preconditions:
          - "same as SIGNED -> PARTIALLY_FUNDED"
        side_effects:
          - "same ledger effects as funding above"
      - from: SIGNED
        to: DEFAULTED
        trigger: "system (during POST /agronomy/prepay-programs/{programId}/settle when funded_cents < contract_value_cents)"
        actor: system
        preconditions:
          - "program settle sweep with now > funding_deadline"
        side_effects:
          - "forfeiture ledger entry + order reversal per PrepayProgram settle cascade"
      - from: PARTIALLY_FUNDED
        to: DEFAULTED
        trigger: "system (program settle sweep)"
        actor: system
        preconditions:
          - "program settle sweep with now > funding_deadline"
        side_effects:
          - "forfeiture ledger entry + order reversal per PrepayProgram settle cascade"
      - from: FUNDED
        to: CLOSED_SETTLED
        trigger: "system (automatic when drawn_cents == funded_cents after an invoicing drawdown)"
        actor: system
        preconditions:
          - "drawn_cents == funded_cents"
        side_effects: []
      - from: FUNDED
        to: REFUNDED
        trigger: "POST /agronomy/prepay-contracts/{contractId}/refund"
        actor: CreditManager
        preconditions:
          - "status IN {FUNDED, PARTIALLY_FUNDED} (else ERR_INVALID_TRANSITION)"
          - "no BlendOrder with prepay_contract_id == this contract AND payment_status NOT IN {PAID, CANCELLED} (else ERR_CONTRACT_IN_USE)"
        side_effects:
          - "refund_amount = funded_cents - drawn_cents; append CreditLedgerEntry PREPAY_REFUNDED amount=-refund_amount; grower.prepay_balance_cents -= refund_amount; increments GrowerAccount.version"
      - from: PARTIALLY_FUNDED
        to: REFUNDED
        trigger: "POST /agronomy/prepay-contracts/{contractId}/refund"
        actor: CreditManager
        preconditions:
          - "same as FUNDED -> REFUNDED"
        side_effects:
          - "same as FUNDED -> REFUNDED"

  - entity: BlendOrder
    initial_state: "fulfillment_status=QUOTED, payment_status=UNPAID (two independent state dimensions)"
    terminal_states: ["fulfillment_status IN {CLOSED, CANCELLED}", "payment_status IN {PAID, CANCELLED}"]
    transitions:
      # --- fulfillment dimension ---
      - from: "fulfillment QUOTED"
        to: "fulfillment BOOKED"
        trigger: "POST /agronomy/blend-orders/{orderId}/book"
        actor: "Grower (own orders only) | Agronomist"
        preconditions:
          - "fulfillment_status == QUOTED (else ERR_INVALID_TRANSITION)"
          - "grower.credit_status == ACTIVE (else ERR_GROWER_NOT_ORDERABLE)"
          - "an APPROVED, non-expired NutrientManagementPlan exists for (field_id, current crop year) (else ERR_NMP_REQUIRED)"
          - "cumulative N per acre across this field's non-cancelled booked-or-later orders + this order's n_lbs_per_acre <= plan.n_cap_lbs_per_acre (else ERR_NITROGEN_CAP_EXCEEDED)"
          - "if plan.p_restriction_active: no line product may have analysis_p2o5_pct > 0 (else ERR_PHOSPHORUS_RESTRICTED)"
          - "recommendation.status == APPROVED (else ERR_RECOMMENDATION_NOT_APPROVED) and recommendation not EXPIRED (else ERR_RECOMMENDATION_EXPIRED) and not SUPERSEDED (else ERR_RECOMMENDATION_SUPERSEDED)"
          - "if price_mode == PRICE_LOCKED: prepay contract FUNDED, same grower, product matches at least one line, funded_cents - drawn_cents > 0 (else ERR_PREPAY_CONTRACT_MISMATCH)"
          - "inventory: for each line, sum of lot available (on_hand - reserved) >= quantity_tons (else ERR_INSUFFICIENT_INVENTORY)"
          - "if price_mode == FLOATING: grower exposure_balance_cents + provisional_total_cents <= credit_limit_cents (else ERR_CREDIT_LIMIT_EXCEEDED)"
        side_effects:
          - "inventory reservation: FIFO over lots (received_at ASC, created_at ASC tie-break), reserved_tons += allocated per lot"
          - "payment_status UNPAID -> PREPAY_APPLIED when price_mode == PRICE_LOCKED, else UNPAID -> CREDIT_APPROVED"
          - "increments GrowerAccount.version by 1 (exposure posture changed)"
      - from: "fulfillment BOOKED"
        to: "fulfillment QUOTED"
        trigger: "POST /agronomy/blend-orders/{orderId}/requote"
        actor: "Grower | Agronomist"
        preconditions:
          - "fulfillment_status == BOOKED (else ERR_INVALID_TRANSITION)"
        side_effects:
          - "release all lot reservations for this order (reserved_tons -= allocated)"
          - "payment_status -> UNPAID (prepay commitment or credit approval released)"
          - "provisional pricing recomputed at current PUBLISHED prices (contract unit price retained for PRICE_LOCKED contract product)"
          - "increments GrowerAccount.version by 1"
      - from: "fulfillment BOOKED"
        to: "fulfillment SCHEDULED"
        trigger: "system (when a BlendBatch is created for this order via POST /agronomy/blend-orders/{orderId}/batches)"
        actor: system
        preconditions:
          - "payment_status IN {PREPAY_APPLIED, CREDIT_APPROVED} (cross-dimension gate; else ERR_INVALID_TRANSITION)"
        side_effects: []
      - from: "fulfillment SCHEDULED"
        to: "fulfillment BOOKED"
        trigger: "system (when the order's SCHEDULED batch is voided, including permit-revoke cascade)"
        actor: system
        preconditions: []
        side_effects:
          - "blender window released"
      - from: "fulfillment SCHEDULED"
        to: "fulfillment BATCHED"
        trigger: "system (during POST /agronomy/blend-batches/{batchId}/complete)"
        actor: system
        preconditions: []
        side_effects:
          - "CASCADE hop 1 (batch -> lines): each BlendLine actual_rate_lbs_per_acre set from completion actuals; actual_quantity_tons, final_unit_price_cents, line_final_cents, variance_flag computed"
          - "CASCADE hop 2 (lines -> order): final_total_cents = sum(line_final_cents); tons_total = sum(actual_quantity_tons); rebate_cents computed per seasonal_volume_rebate"
          - "CASCADE hop 3 (order -> inventory): reserved tons convert to shipped on the same FIFO lots: on_hand_tons -= actual_quantity_tons, reserved_tons -= reserved allocation, shipped_tons += actual_quantity_tons"
          - "CASCADE hop 3 (order -> grower credit/prepay): if payment_status == PREPAY_APPLIED: draw = min(contract funded - drawn, final_total); contract.drawn_cents += draw (CLOSED_SETTLED when fully drawn); ledger PREPAY_DRAWN -draw; remainder final_total - draw invoiced to credit when > 0. If payment_status == CREDIT_APPROVED: full final_total invoiced. Append INVOICE_POSTED +invoiced_amount and REBATE_CREDIT -rebate_cents ledger entries; grower.credit_used_cents and prepay_balance_cents recomputed; increments GrowerAccount.version"
          - "payment_status: PREPAY_APPLIED -> PAID when draw covers final_total entirely, else PREPAY_APPLIED -> INVOICED; CREDIT_APPROVED -> INVOICED"
      - from: "fulfillment BATCHED"
        to: "fulfillment LOADED"
        trigger: "system (when a DeliveryStop referencing this order is added to a PLANNED route)"
        actor: system
        preconditions: []
        side_effects: []
      - from: "fulfillment LOADED"
        to: "fulfillment DELIVERED"
        trigger: "system (when the DeliveryStop is completed)"
        actor: system
        preconditions: []
        side_effects: []
      - from: "fulfillment LOADED"
        to: "fulfillment BATCHED"
        trigger: "system (when the route is cancelled before dispatch)"
        actor: system
        preconditions: []
        side_effects: []
      - from: "fulfillment DELIVERED"
        to: "fulfillment APPLIED_CONFIRMED"
        trigger: "POST /agronomy/blend-orders/{orderId}/confirm-application"
        actor: "Grower (own orders only)"
        preconditions:
          - "fulfillment_status == DELIVERED (else ERR_INVALID_TRANSITION)"
        side_effects:
          - "if payment_status == PAID: fulfillment_status continues to CLOSED immediately (bubble-up)"
      - from: "fulfillment APPLIED_CONFIRMED"
        to: "fulfillment CLOSED"
        trigger: "system (when payment_status becomes PAID, or immediately at confirm when already PAID)"
        actor: system
        preconditions:
          - "payment_status == PAID"
        side_effects:
          - "grower.season_closed_tons += tons_total; increments GrowerAccount.version"
      - from: "fulfillment QUOTED"
        to: "fulfillment CANCELLED"
        trigger: "POST /agronomy/blend-orders/{orderId}/cancel"
        actor: "Grower | Agronomist"
        preconditions:
          - "fulfillment_status IN {QUOTED, BOOKED, SCHEDULED} (else ERR_INVALID_TRANSITION)"
        side_effects:
          - "payment_status -> CANCELLED"
      - from: "fulfillment BOOKED"
        to: "fulfillment CANCELLED"
        trigger: "POST /agronomy/blend-orders/{orderId}/cancel"
        actor: "Grower | Agronomist"
        preconditions:
          - "fulfillment_status IN {QUOTED, BOOKED, SCHEDULED}"
        side_effects:
          - "release all lot reservations (reserved_tons -= allocated)"
          - "payment_status -> CANCELLED; prepay commitment / credit exposure released"
          - "increments GrowerAccount.version by 1"
      - from: "fulfillment SCHEDULED"
        to: "fulfillment CANCELLED"
        trigger: "POST /agronomy/blend-orders/{orderId}/cancel"
        actor: "Grower | Agronomist"
        preconditions:
          - "fulfillment_status IN {QUOTED, BOOKED, SCHEDULED}"
        side_effects:
          - "the order's SCHEDULED batch -> VOIDED (void_reason = ORDER_CANCELLED); blender window released"
          - "release all lot reservations; payment_status -> CANCELLED"
          - "increments GrowerAccount.version by 1"
      # --- payment dimension ---
      - from: "payment UNPAID"
        to: "payment PREPAY_APPLIED"
        trigger: "system (during book, price_mode == PRICE_LOCKED)"
        actor: system
        preconditions: []
        side_effects: []
      - from: "payment UNPAID"
        to: "payment CREDIT_APPROVED"
        trigger: "system (during book, price_mode == FLOATING and credit check passed)"
        actor: system
        preconditions: []
        side_effects: []
      - from: "payment PREPAY_APPLIED"
        to: "payment PAID"
        trigger: "system (at batch completion when prepay draw covers final_total_cents)"
        actor: system
        preconditions: []
        side_effects: []
      - from: "payment PREPAY_APPLIED"
        to: "payment INVOICED"
        trigger: "system (at batch completion when draw < final_total_cents)"
        actor: system
        preconditions: []
        side_effects: []
      - from: "payment CREDIT_APPROVED"
        to: "payment INVOICED"
        trigger: "system (at batch completion)"
        actor: system
        preconditions: []
        side_effects: []
      - from: "payment INVOICED"
        to: "payment PAID"
        trigger: "system (payment waterfall fully covers this invoice, oldest invoice first)"
        actor: system
        preconditions: []
        side_effects:
          - "if fulfillment_status == APPLIED_CONFIRMED: fulfillment_status -> CLOSED (bubble-up) and season_closed_tons += tons_total"
      - from: "payment PREPAY_APPLIED"
        to: "payment UNPAID"
        trigger: "system (prepay contract DEFAULTED via program settle, or order requote)"
        actor: system
        preconditions: []
        side_effects: []
      - from: "payment CREDIT_APPROVED"
        to: "payment UNPAID"
        trigger: "system (order requote)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: BlendBatch
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, VOIDED]
    transitions:
      - from: SCHEDULED
        to: IN_PROGRESS
        trigger: "POST /agronomy/blend-batches/{batchId}/start"
        actor: PlantOperator
        preconditions:
          - "status == SCHEDULED (else ERR_INVALID_TRANSITION)"
          - "blender.status == ACTIVE (else ERR_BLENDER_OUT_OF_SERVICE)"
          - "an ACTIVE BLENDER_SITE permit exists for blender.site_code (else ERR_PERMIT_NOT_ACTIVE)"
        side_effects: []
      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "POST /agronomy/blend-batches/{batchId}/complete"
        actor: PlantOperator
        preconditions:
          - "status == IN_PROGRESS (else ERR_INVALID_TRANSITION)"
          - "actuals must cover every line of the order exactly once (else ERR_VALIDATION_FAILED)"
          - "per line: |actual - target| / target <= BATCH_VARIANCE_TOLERANCE_PCT inclusive (else ERR_BATCH_VARIANCE_EXCEEDED)"
          - "for FLOATING lines: a current PUBLISHED price sheet exists per product (else ERR_NO_CURRENT_PRICE)"
        side_effects:
          - "full batch-completion cascade per BlendOrder SCHEDULED -> BATCHED (lines -> order totals -> inventory -> credit/prepay ledger -> rebate)"
      - from: SCHEDULED
        to: VOIDED
        trigger: "POST /agronomy/blend-batches/{batchId}/void OR system (permit revoke cascade, order cancel cascade)"
        actor: PlantOperator
        preconditions:
          - "status == SCHEDULED for manual void (else ERR_INVALID_TRANSITION)"
        side_effects:
          - "order fulfillment_status SCHEDULED -> BOOKED; blender window released"

  - entity: DeliveryRoute
    initial_state: PLANNED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: PLANNED
        to: DISPATCHED
        trigger: "POST /agronomy/delivery-routes/{routeId}/dispatch"
        actor: LogisticsDispatcher
        preconditions:
          - "status == PLANNED (else ERR_INVALID_TRANSITION)"
          - "at least one PLANNED stop (else ERR_INVALID_TRANSITION)"
          - "truck.status == ACTIVE (else ERR_INVALID_TRANSITION)"
        side_effects: []
      - from: DISPATCHED
        to: COMPLETED
        trigger: "system (when all stops reach DELIVERED)"
        actor: system
        preconditions: []
        side_effects: []
      - from: PLANNED
        to: CANCELLED
        trigger: "POST /agronomy/delivery-routes/{routeId}/cancel"
        actor: LogisticsDispatcher
        preconditions:
          - "status == PLANNED (else ERR_INVALID_TRANSITION)"
        side_effects:
          - "all PLANNED stops -> CANCELLED; each stop's order fulfillment LOADED -> BATCHED"

  - entity: DeliveryStop
    initial_state: PLANNED
    terminal_states: [DELIVERED, CANCELLED]
    transitions:
      - from: PLANNED
        to: DELIVERED
        trigger: "POST /agronomy/delivery-stops/{stopId}/complete"
        actor: LogisticsDispatcher
        preconditions:
          - "status == PLANNED (else ERR_INVALID_TRANSITION)"
          - "owning route status == DISPATCHED (else ERR_INVALID_TRANSITION)"
        side_effects:
          - "delivered_at = logical clock now (or input delivered_at)"
          - "order fulfillment LOADED -> DELIVERED"
          - "if all sibling stops DELIVERED: route -> COMPLETED (bubble-up)"
      - from: PLANNED
        to: CANCELLED
        trigger: "system (route cancel cascade)"
        actor: system
        preconditions: []
        side_effects:
          - "order fulfillment LOADED -> BATCHED"

# =============================================================================
# 1.2.1 Concurrency Rules (OCC only)
# =============================================================================
concurrency_rules:
  - rule_id: prepay-contract-create-stale-grower
    parent_entity: GrowerAccount
    write_endpoint: "POST /agronomy/growers/{growerId}/prepay-contracts"
    occ_field: expected_grower_version
    description: |
      Creating a PrepayContract against a GrowerAccount whose version has advanced
      since the client last observed it is rejected. The client may hold a stale
      view of the grower's prepay posture because another accepted write (a prior
      contract creation, a funding, a credit transition) already bumped the
      grower version.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: blend-order-update-stale-order
    parent_entity: BlendOrder
    write_endpoint: "PATCH /agronomy/blend-orders/{orderId}"
    occ_field: expected_blend_order_version
    description: |
      Updating a QUOTED BlendOrder's lines/pricing inputs against an order whose
      version has advanced since the client last observed it is rejected. The
      client's view of the quoted totals is stale because another accepted write
      already recomputed them.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: nutrient_recommendation_rates
    trigger: "POST /agronomy/soil-tests/{soilTestId}/recommendations (at creation)"
    algorithm: threshold
    formula: |
      removal_p = P2O5_REMOVAL_LB_PER_BU * yield_goal_bu_per_acre
      removal_k = K2O_REMOVAL_LB_PER_BU * yield_goal_bu_per_acre
      if rate_variant == BUILD_RATE:
        p2o5_lbs = removal_p + max(0, P_CRITICAL_PPM - soil.p_ppm) * P_BUILD_LBS_PER_PPM
        k2o_lbs  = removal_k + max(0, K_CRITICAL_PPM - soil.k_ppm) * K_BUILD_LBS_PER_PPM
      else:  # MAINTENANCE_RATE
        p2o5_lbs = removal_p if soil.p_ppm < P_DRAWDOWN_PPM else 0
        k2o_lbs  = removal_k if soil.k_ppm < K_DRAWDOWN_PPM else 0
      n_lbs = N_LB_PER_BU * yield_goal_bu_per_acre
              - manure_credit_n_lbs
              - (PREV_SOYBEAN_N_CREDIT if previous_crop == SOYBEAN else 0)
      n_lbs = max(0, n_lbs)
      each of n_lbs_per_acre / p2o5_lbs_per_acre / k2o_lbs_per_acre = round_half_up(value, 0)
    input_set: "the single RESULTED SoilTest addressed by path; recommendation inputs crop, yield_goal_bu_per_acre, rate_variant, previous_crop, manure_credit_n_lbs"
    constants:
      P_CRITICAL_PPM: 20
      P_DRAWDOWN_PPM: 40
      P_BUILD_LBS_PER_PPM: 9
      P2O5_REMOVAL_LB_PER_BU: 0.37
      K_CRITICAL_PPM: 130
      K_DRAWDOWN_PPM: 170
      K_BUILD_LBS_PER_PPM: 4
      K2O_REMOVAL_LB_PER_BU: 0.27
      N_LB_PER_BU: 1.0
      PREV_SOYBEAN_N_CREDIT: 30
    precision: "integer lbs per acre, round_half_up"
    variants:
      - name: BUILD_RATE
        when: "rate_variant == BUILD_RATE"
        difference: "adds build component (critical_ppm - actual_ppm) x build factor on P and K; ignores drawdown cutoff"
      - name: MAINTENANCE_RATE
        when: "rate_variant == MAINTENANCE_RATE"
        difference: "no build component; rate drops to 0 when soil ppm >= drawdown threshold"

  - name: blend_formulation_solver
    trigger: "POST /agronomy/recommendations/{recommendationId}/formulation-preview"
    algorithm: constraint_propagation
    formula: |
      Given recommendation rates (N, P2O5, K2O lbs/acre) and a selected product list:
      1. P-source first: choose the selected product with the highest analysis_p2o5_pct > 0
         (tie-break: lowest created_at, i.e. earliest created). If P2O5 need > 0 and no
         such product exists -> infeasible (ERR_FORMULATION_UNSOLVABLE).
         p_rate = round_half_up(P2O5 / (analysis_p2o5_pct/100), 1)
      2. N credit contributed by the P-source: n_from_p = round_half_up(p_rate * analysis_n_pct/100, 3).
         If n_from_p > N need -> infeasible (ERR_FORMULATION_UNSOLVABLE).
      3. K-source: selected product with highest analysis_k2o_pct > 0 (same tie-break).
         If K2O need > 0 and none -> infeasible.
         k_rate = round_half_up(K2O / (analysis_k2o_pct/100), 1)
         (K-source N contribution likewise credited at 3 decimals.)
      4. Remaining N: rem_n = round_half_up(N - n_from_p - n_from_k, 3).
         If rem_n > 0: N-source = selected product with highest analysis_n_pct and
         analysis_p2o5_pct == 0 and analysis_k2o_pct == 0 (same tie-break); none -> infeasible.
         n_rate = round_half_up(rem_n / (analysis_n_pct/100), 1)
      Products with a computed rate of 0 are omitted from the returned lines.
    input_set: "Recommendation (status any) addressed by path; products enumerated in input product_ids (must exist)"
    constants: {}
    precision: "product rates 1 decimal round_half_up; intermediate N credits 3 decimals round_half_up"

  - name: blend_line_pricing
    trigger: "BlendOrder create / PATCH / requote (PROVISIONAL) and batch completion (FINAL)"
    algorithm: tiered_pricing
    formula: |
      Price resolution for a line:
      - PRICE_LOCKED order AND line.product_id == contract.product_id:
          unit = prepay_contract.unit_price_cents (both provisional and final)
      - otherwise PROVISIONAL: unit = price_per_ton_cents of the PUBLISHED PriceSheet
          for the product with effective_from <= now < effective_to (at quote time)
      - otherwise FINAL (at batch completion): unit = price_per_ton_cents of the
          PUBLISHED PriceSheet whose window contains the completion instant
      quantity: PROVISIONAL uses quantity_tons (target); FINAL uses actual_quantity_tons
      line amount = round_half_up(quantity_tons_or_actual x unit, 0) cents
    input_set: "the order's BlendLines; current PUBLISHED PriceSheets; linked PrepayContract when PRICE_LOCKED"
    constants: {}
    precision: "tons 3 decimals; cents integer round_half_up"
    variants:
      - name: PROVISIONAL
        when: "quote time (create / PATCH / requote)"
        difference: "target quantities; FLOATING lines priced at quote-time current sheet"
      - name: FINAL
        when: "batch completion"
        difference: "actual scale quantities; FLOATING lines re-priced at completion-time current sheet (may differ from provisional); PRICE_LOCKED contract-product lines stay at contract.unit_price_cents"

  - name: invoice_total_aggregation
    trigger: "BlendOrder create / PATCH / requote (provisional_total_cents) and batch completion (final_total_cents)"
    algorithm: aggregation
    formula: |
      PINNED ROUNDING ORDER (mode: per-line-then-sum):
      order_total_cents = sum over lines of round_half_up(line_quantity_tons x line_unit_price_cents, 0)
      Each line is rounded to whole cents FIRST; the total is the exact integer sum of
      rounded line amounts. (The alternative sum-then-round order is NOT used; it can
      differ by cents when multiple lines carry fractional cents.)
    input_set: "the order's BlendLines with resolved unit prices"
    constants: {}
    precision: "per-line integer cents round_half_up, then exact integer sum"

  - name: seasonal_volume_rebate
    trigger: "batch completion invoicing"
    algorithm: tiered_pricing
    formula: |
      PINNED EVALUATION ORDER (breaks the apparent circle tier<->total):
      1. tier_base_tons = grower.season_closed_tons (CLOSED orders only) + this order's tons_total (final actual tons)
      2. tier_pct = 0.00  if tier_base_tons <  REBATE_TIER1_MIN_TONS
                  0.02  if REBATE_TIER1_MIN_TONS <= tier_base_tons < REBATE_TIER2_MIN_TONS   (>= boundary: exactly 50.000 qualifies)
                  0.035 if tier_base_tons >= REBATE_TIER2_MIN_TONS
      3. rebate_cents = round_half_up(final_total_cents x tier_pct, 0)
      4. final_total_cents is NOT reduced by the rebate; the rebate is posted as a
         separate REBATE_CREDIT ledger entry and never feeds back into tier_base_tons.
      season_closed_tons increments only when an order reaches fulfillment CLOSED.
    input_set: "the invoiced BlendOrder; grower.season_closed_tons"
    constants:
      REBATE_TIER1_MIN_TONS: 50
      REBATE_TIER1_PCT: 0.02
      REBATE_TIER2_MIN_TONS: 150
      REBATE_TIER2_PCT: 0.035
    precision: "integer cents round_half_up"

  - name: inventory_position
    trigger: "lot receipt; order book (reserve); order requote/cancel (release); batch completion (convert to shipped); inventory-position read"
    algorithm: aggregation
    formula: |
      per lot: available_tons = on_hand_tons - reserved_tons
      per product: sums across all lots of the product.
      RESERVATION (at book): for each line, walk the product's lots ordered by
      received_at ASC, tie-break created_at ASC; take min(remaining_need, lot.available_tons)
      from each until the line's quantity_tons is fully allocated; insufficient total
      available -> ERR_INSUFFICIENT_INVENTORY and no partial reservation is kept.
      RELEASE (requote/cancel): subtract exactly the recorded allocation.
      CONVERT (batch completion): on the same lots in the same FIFO order,
      on_hand_tons -= actual_quantity_tons share, reserved_tons -= reserved allocation,
      shipped_tons += actual_quantity_tons share.
    input_set: "InventoryLots of the affected products (all statuses of orders considered through reserved_tons bookkeeping)"
    constants: {}
    precision: "tons 3 decimals"

  - name: credit_utilization
    trigger: "order book (gate), batch completion invoicing, payment posting, exposure read"
    algorithm: aggregation
    formula: |
      billed_balance_cents (== GrowerAccount.credit_used_cents)
        = sum(INVOICE_POSTED.amount_cents) - sum(PAYMENT_RECEIVED.|amount|) - sum(REBATE_CREDIT.|amount|)
          over the grower's CreditLedgerEntries
      booked_exposure_cents = sum(provisional_total_cents) over the grower's BlendOrders
          with fulfillment_status IN {BOOKED, SCHEDULED} and payment_status != CANCELLED
      exposure_balance_cents = billed_balance_cents + booked_exposure_cents
      Booking gate (FLOATING): exposure_balance_cents + new order provisional_total_cents
          <= credit_limit_cents   (<= boundary: exact equality admitted)
    input_set: "grower's CreditLedgerEntries; grower's BlendOrders in BOOKED/SCHEDULED"
    constants: {}
    precision: "integer cents"
    variants:
      - name: BILLED
        when: "credit_used_cents field, release precondition, overpayment check"
        difference: "only posted invoices minus payments/rebates; ignores unbilled booked orders"
      - name: EXPOSURE
        when: "booking gate and GET /agronomy/growers/{growerId}/exposure"
        difference: "billed plus provisional totals of BOOKED/SCHEDULED orders; same grower, same moment, different number whenever open booked orders exist"

  - name: prepay_pricing_and_settlement
    trigger: "prepay contract creation; funding; batch completion drawdown; program settle default"
    algorithm: waterfall_allocation
    formula: |
      at signing:  unit_price_cents     = round_half_up(current_sheet.price_per_ton_cents * (1 - program.discount_pct), 0)
                   contract_value_cents  = round_half_up(unit_price_cents * committed_tons, 0)
                   deposit_due_cents     = round_half_up(contract_value_cents * program.deposit_pct, 0)
      at funding:  funded_cents += amount; states SIGNED -> PARTIALLY_FUNDED -> FUNDED (>= contract_value_cents)
      at invoicing drawdown (PRICE_LOCKED orders first charge the contract):
                   draw = min(funded_cents - drawn_cents, order final_total_cents)
                   drawn_cents += draw; contract CLOSED_SETTLED when drawn == funded
                   remainder = final_total_cents - draw invoiced to credit when > 0
      at settle default (funded < value when now > funding_deadline):
                   forfeited_cents = round_half_up(funded_cents * program.default_penalty_pct, 0)
                   (funded - forfeited) remains in grower prepay_balance_cents
    input_set: "the PrepayContract; its PrepayProgram; the product's current PUBLISHED PriceSheet at signing"
    constants: {}
    precision: "integer cents round_half_up"

  - name: nitrogen_cap_tracking
    trigger: "order book (gate)"
    algorithm: threshold
    formula: |
      field_n_per_acre = sum over the field's BlendOrders with fulfillment_status IN
        {BOOKED, SCHEDULED, BATCHED, LOADED, DELIVERED, APPLIED_CONFIRMED, CLOSED}
        (i.e. excluding QUOTED and CANCELLED) of order.n_lbs_per_acre
      Gate: field_n_per_acre + new_order.n_lbs_per_acre <= plan.n_cap_lbs_per_acre
      Boundary: exact equality with the cap is ADMITTED (<=), any excess rejected.
      order.n_lbs_per_acre = sum over lines of round_half_up(rate * analysis_n_pct/100, 3)
    input_set: "the field's non-terminal, non-QUOTED BlendOrders; the APPROVED NutrientManagementPlan matching (field_id, current crop year)"
    constants: {}
    precision: "lbs per acre 3 decimals round_half_up"

  - name: payment_waterfall
    trigger: "POST /agronomy/growers/{growerId}/payments"
    algorithm: waterfall_allocation
    formula: |
      outstanding per order = final_total_cents - allocated payments so far
      Allocate the payment across the grower's BlendOrders with payment_status == INVOICED,
      ordered by invoiced_at ASC (completion instant), tie-break created_at ASC.
      Fill each invoice fully before the next. Each fully covered order: payment_status -> PAID
      (and CLOSED bubble-up when fulfillment == APPLIED_CONFIRMED).
      If payment amount exceeds total outstanding across all INVOICED orders
      -> reject whole payment ERR_OVERPAYMENT (no partial application).
      Ledger: single PAYMENT_RECEIVED entry amount = -payment; credit_used_cents recomputed.
    input_set: "grower's INVOICED BlendOrders"
    constants: {}
    precision: "integer cents"

  - name: blender_window_occupancy
    trigger: "POST /agronomy/blend-orders/{orderId}/batches (window acceptance)"
    algorithm: interval_merge
    formula: |
      Interval semantics: CLOSED occupation windows plus a mandatory cleanup buffer.
      A batch occupying [scheduled_start, scheduled_end] blocks the blender for
      [scheduled_start - CLEANUP_BUFFER_MINUTES, scheduled_end + CLEANUP_BUFFER_MINUTES].
      A new batch on the same blender is rejected (ERR_BLENDER_WINDOW_CONFLICT) when its
      own buffered window intersects any non-VOIDED batch's buffered window:
        new.start - buffer <  existing.end + buffer  AND
        new.end   + buffer >  existing.start - buffer
      Consequence: new.start == existing.end is REJECTED (buffer not honored);
      new.start == existing.end + buffer is ADMITTED (exact boundary).
      VOIDED batches free their windows; COMPLETED/IN_PROGRESS/SCHEDULED batches keep them.
    input_set: "BlendBatches of the addressed blender with status IN {SCHEDULED, IN_PROGRESS, COMPLETED}"
    constants:
      CLEANUP_BUFFER_MINUTES: 30
    precision: "instant comparison at whole-second granularity"

  - name: price_window_membership
    trigger: "price sheet publish (overlap gate); price resolution at quote/completion/signing"
    algorithm: interval_merge
    formula: |
      Interval semantics: HALF-OPEN windows [effective_from, effective_to).
      Publish gate: a new PUBLISHED sheet for product P is rejected
      (ERR_PRICE_WINDOW_OVERLAP) when its window intersects any other PUBLISHED sheet
      of P under half-open intersection:
        new.effective_from < existing.effective_to AND new.effective_to > existing.effective_from
      Consequence: new.effective_from == existing.effective_to is ADMITTED (touching windows).
      Resolution: the current price at instant t is the PUBLISHED sheet with
      effective_from <= t < effective_to; at most one can exist per product by the gate.
      None exists -> ERR_NO_CURRENT_PRICE at the pricing operation.
    input_set: "PriceSheets of the addressed product with status PUBLISHED (DRAFT sheets ignored by the gate; EXPIRED sheets never match)"
    constants: {}
    precision: "instant comparison at whole-second granularity"

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present; role value recognized"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all endpoints"
  - priority: 2
    category: auth
    check: "Role permitted for this operation per endpoint roles; for Grower-role calls on grower-scoped resources, X-User-ID must equal the owning grower's id"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: "all endpoints"
  - priority: 3
    category: existence
    check: "Path resource ids exist, validated left-to-right"
    error_id: ERR_RESOURCE_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints with path ids"
  - priority: 4
    category: existence
    check: "Request body shape: required fields present, enum members valid, numeric ranges respected (acres > 0, rates > 0, percents 0..100, end > start), unknown fields rejected, order acres must equal field.acres"
    error_id: ERR_VALIDATION_FAILED
    http_status: 400
    applies_to: "all endpoints with a request body"
  - priority: 5
    category: existence
    check: "Body-supplied FK references resolve: product_id, field_id, recommendation_id, prepay_program_id, prepay_contract_id, blender_id, truck_id, blend_order_id, product_ids in lines/actuals"
    error_id: ERR_RESOURCE_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints with a request body containing references"
  - priority: 6
    category: state
    check: "OCC: where an endpoint declares expected_<parent>_version, it must equal the parent entity's current version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /agronomy/growers/{growerId}/prepay-contracts; PATCH /agronomy/blend-orders/{orderId}"
  - priority: 7
    category: state
    check: "Target resource in a valid from-state for the requested transition (terminal lockdown, double-fire, route without stops, stop completion before dispatch, order not BOOKED at batch create, stop order not BATCHED, etc.)"
    error_id: ERR_INVALID_TRANSITION
    http_status: 409
    applies_to: "all transition/action endpoints"
  - priority: 8
    category: state
    check: "Grower credit_status == ACTIVE for new financial commitments (prepay contract signing, blend order creation, blend order booking)"
    error_id: ERR_GROWER_NOT_ORDERABLE
    http_status: 409
    applies_to: "POST /agronomy/growers/{growerId}/prepay-contracts; POST /agronomy/growers/{growerId}/blend-orders; POST /agronomy/blend-orders/{orderId}/book"
  - priority: 9
    category: state
    check: "Blender status == ACTIVE at batch creation and start; truck status == ACTIVE at dispatch"
    error_id: ERR_BLENDER_OUT_OF_SERVICE
    http_status: 409
    applies_to: "POST /agronomy/blend-orders/{orderId}/batches; POST /agronomy/blend-batches/{batchId}/start"
  - priority: 10
    category: business_safety
    check: "An APPROVED, non-expired NutrientManagementPlan exists for the order's (field_id, current crop year)"
    error_id: ERR_NMP_REQUIRED
    http_status: 422
    applies_to: "POST /agronomy/blend-orders/{orderId}/book"
  - priority: 11
    category: business_safety
    check: "nitrogen_cap_tracking: cumulative N per acre for the field-year + order N <= plan cap (equality admitted)"
    error_id: ERR_NITROGEN_CAP_EXCEEDED
    http_status: 422
    applies_to: "POST /agronomy/blend-orders/{orderId}/book"
  - priority: 12
    category: business_safety
    check: "When plan.p_restriction_active is true, no order line product may carry analysis_p2o5_pct > 0"
    error_id: ERR_PHOSPHORUS_RESTRICTED
    http_status: 422
    applies_to: "POST /agronomy/blend-orders/{orderId}/book"
  - priority: 13
    category: business_safety
    check: "Gated operation has an ACTIVE EnvironmentalPermit of the required type for the site: inventory receipts need FERTILIZER_STORAGE (plus ANHYDROUS_STORAGE for regulated products); batch create/start need BLENDER_SITE for the blender's site_code"
    error_id: ERR_PERMIT_NOT_ACTIVE
    http_status: 422
    applies_to: "POST /agronomy/inventory-lots; POST /agronomy/blend-orders/{orderId}/batches; POST /agronomy/blend-batches/{batchId}/start"
  - priority: 14
    category: business_safety
    check: "Storage capacity: after receipt, sum of on_hand_tons across all lots <= ACTIVE FERTILIZER_STORAGE permit.max_storage_tons (equality admitted)"
    error_id: ERR_STORAGE_CAPACITY_EXCEEDED
    http_status: 422
    applies_to: "POST /agronomy/inventory-lots"
  - priority: 15
    category: business_temporal
    check: "Price sheet publish: half-open window [effective_from, effective_to) must not intersect any other PUBLISHED sheet for the same product; touching windows (one's effective_to == other's effective_from) are ADMITTED"
    error_id: ERR_PRICE_WINDOW_OVERLAP
    http_status: 409
    applies_to: "POST /agronomy/price-sheets/{priceSheetId}/publish"
  - priority: 16
    category: business_temporal
    check: "Blender window conflict: new batch window plus CLEANUP_BUFFER_MINUTES on both sides must not intersect any non-VOIDED batch window on the same blender; a start exactly at prior end + buffer is ADMITTED"
    error_id: ERR_BLENDER_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /agronomy/blend-orders/{orderId}/batches"
  - priority: 17
    category: business_temporal
    check: "Prepay funding accepted only when now <= program.funding_deadline (deadline instant itself ADMITTED, one second past rejected)"
    error_id: ERR_PREPAY_FUNDING_DEADLINE_PASSED
    http_status: 409
    applies_to: "POST /agronomy/prepay-contracts/{contractId}/fund"
  - priority: 18
    category: business_temporal
    check: "A current PUBLISHED PriceSheet (effective_from <= now < effective_to) exists for every product being priced (order quote/requote/patch, prepay signing, FLOATING final at batch completion)"
    error_id: ERR_NO_CURRENT_PRICE
    http_status: 422
    applies_to: "POST /agronomy/growers/{growerId}/blend-orders; PATCH /agronomy/blend-orders/{orderId}; POST /agronomy/blend-orders/{orderId}/requote; POST /agronomy/growers/{growerId}/prepay-contracts; POST /agronomy/blend-batches/{batchId}/complete"
  - priority: 19
    category: business_temporal
    check: "Referenced recommendation not past valid_until (lazy EXPIRED evaluation)"
    error_id: ERR_RECOMMENDATION_EXPIRED
    http_status: 422
    applies_to: "POST /agronomy/growers/{growerId}/blend-orders; POST /agronomy/blend-orders/{orderId}/book"
  - priority: 20
    category: business_constraint
    check: "Formulation feasible per blend_formulation_solver (each positive nutrient need coverable; P-source N credit must not exceed N need)"
    error_id: ERR_FORMULATION_UNSOLVABLE
    http_status: 422
    applies_to: "POST /agronomy/recommendations/{recommendationId}/formulation-preview"
  - priority: 21
    category: business_constraint
    check: "Batch completion actuals within +/- BATCH_VARIANCE_TOLERANCE_PCT (5%) of target per line, inclusive boundary; actuals must cover each line exactly once"
    error_id: ERR_BATCH_VARIANCE_EXCEEDED
    http_status: 422
    applies_to: "POST /agronomy/blend-batches/{batchId}/complete"
  - priority: 22
    category: business_constraint
    check: "Truck capacity: route.total_stop_tons + new stop tons <= truck.capacity_tons (equality admitted)"
    error_id: ERR_TRUCK_CAPACITY_EXCEEDED
    http_status: 422
    applies_to: "POST /agronomy/delivery-routes/{routeId}/stops"
  - priority: 23
    category: business_constraint
    check: "At most one non-CANCELLED DeliveryRoute per truck per route_date"
    error_id: ERR_DUPLICATE_ROUTE_FOR_TRUCK_DATE
    http_status: 409
    applies_to: "POST /agronomy/delivery-routes"
  - priority: 24
    category: business_constraint
    check: "Inventory availability per line at booking: sum of lot available_tons for the product >= quantity_tons (FIFO allocation; equality admitted; zero remaining available afterwards is legal)"
    error_id: ERR_INSUFFICIENT_INVENTORY
    http_status: 422
    applies_to: "POST /agronomy/blend-orders/{orderId}/book"
  - priority: 25
    category: business_constraint
    check: "Blender form_supported covers every line product form (BOTH covers all)"
    error_id: ERR_BLENDER_FORM_MISMATCH
    http_status: 422
    applies_to: "POST /agronomy/blend-orders/{orderId}/batches"
  - priority: 26
    category: business_referential
    check: "Recommendation still in a pre-approval state (DRAFT or PENDING_REVIEW) at order creation and booking (SUPERSEDED handled at priority 28, EXPIRED at priority 19)"
    error_id: ERR_RECOMMENDATION_NOT_APPROVED
    http_status: 422
    applies_to: "POST /agronomy/growers/{growerId}/blend-orders; POST /agronomy/blend-orders/{orderId}/book"
  - priority: 27
    category: business_referential
    check: "recommendation.field_id == order.field_id and field.grower_id == path grower_id"
    error_id: ERR_RECOMMENDATION_FIELD_MISMATCH
    http_status: 422
    applies_to: "POST /agronomy/growers/{growerId}/blend-orders"
  - priority: 28
    category: business_referential
    check: "Referenced recommendation not SUPERSEDED"
    error_id: ERR_RECOMMENDATION_SUPERSEDED
    http_status: 422
    applies_to: "POST /agronomy/growers/{growerId}/blend-orders; POST /agronomy/blend-orders/{orderId}/book"
  - priority: 29
    category: business_referential
    check: "PRICE_LOCKED order: prepay contract belongs to same grower, status == FUNDED, contract product matches at least one line, funded_cents - drawn_cents > 0"
    error_id: ERR_PREPAY_CONTRACT_MISMATCH
    http_status: 422
    applies_to: "POST /agronomy/growers/{growerId}/blend-orders; POST /agronomy/blend-orders/{orderId}/book"
  - priority: 30
    category: business_referential
    check: "Prepay refund only when no BlendOrder references the contract with payment_status NOT IN {PAID, CANCELLED}"
    error_id: ERR_CONTRACT_IN_USE
    http_status: 409
    applies_to: "POST /agronomy/prepay-contracts/{contractId}/refund"
  - priority: 31
    category: business_referential
    check: "Prepay program in ENROLLMENT_OPEN and now within [enrollment_open_on, enrollment_close_on] at contract signing"
    error_id: ERR_PROGRAM_NOT_ENROLLING
    http_status: 409
    applies_to: "POST /agronomy/growers/{growerId}/prepay-contracts"
  - priority: 32
    category: business_fiscal
    check: "FLOATING booking: exposure_balance_cents + provisional_total_cents <= credit_limit_cents (equality admitted); credit-release precondition credit_used_cents <= credit_limit_cents"
    error_id: ERR_CREDIT_LIMIT_EXCEEDED
    http_status: 402
    applies_to: "POST /agronomy/blend-orders/{orderId}/book; POST /agronomy/growers/{growerId}/credit-release"
  - priority: 33
    category: business_fiscal
    check: "Payment amount <= total outstanding across the grower's INVOICED orders"
    error_id: ERR_OVERPAYMENT
    http_status: 422
    applies_to: "POST /agronomy/growers/{growerId}/payments"
  - priority: 34
    category: business_fiscal
    check: "Prepay funding: funded_cents + amount_cents <= contract_value_cents (equality admitted)"
    error_id: ERR_PREPAY_OVERFUND
    http_status: 422
    applies_to: "POST /agronomy/prepay-contracts/{contractId}/fund"

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- logical clock (test-driving) ---
  - method: POST
    path: "/agronomy/_clock/set_current_utc"
    description: "Sets the server's logical clock. STARTUP DEFAULT: before any set_current_utc call the logical clock reads exactly 2026-08-01T00:00:00Z and never falls back to wall-clock time. All deadlines, lazy expiries, price windows and received_at/invoiced_at stamps read this clock."
    roles: [BranchAdmin]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string }
    side_effects:
      - "lazy state re-evaluation (permits, price sheets, NMPs, recommendations, programs) occurs on next access against the new clock"

  # --- GrowerAccount ---
  - method: POST
    path: "/agronomy/growers"
    description: "Create a grower account"
    roles: [CreditManager, BranchAdmin]
    code: 201
    input: [legal_name, credit_limit_cents]
    output: GrowerAccount
    side_effects: ["credit_status = ACTIVE", "credit_used_cents = 0", "prepay_balance_cents = 0", "season_closed_tons = 0"]
  - method: GET
    path: "/agronomy/growers"
    description: "List grower accounts"
    roles: *all_roles
    code: 200
    input: ["credit_status?", "limit?", "offset?"]
    output: GrowerAccount[]
    side_effects: []
  - method: GET
    path: "/agronomy/growers/{growerId}"
    description: "Get a grower account (Grower role restricted to own id)"
    roles: *all_roles
    code: 200
    input: []
    output: GrowerAccount
    side_effects: []
  - method: PATCH
    path: "/agronomy/growers/{growerId}/credit-terms"
    description: "Update grower credit limit"
    roles: [CreditManager]
    code: 200
    input: [credit_limit_cents]
    output: GrowerAccount
    side_effects: ["increments GrowerAccount.version by 1"]
  - method: POST
    path: "/agronomy/growers/{growerId}/credit-hold"
    description: "Place grower on credit hold (ACTIVE -> CREDIT_HOLD)"
    roles: [CreditManager]
    code: 200
    input: []
    output: GrowerAccount
    side_effects: ["credit_status -> CREDIT_HOLD", "increments GrowerAccount.version by 1"]
  - method: POST
    path: "/agronomy/growers/{growerId}/suspend"
    description: "Suspend grower (ACTIVE|CREDIT_HOLD -> SUSPENDED)"
    roles: [CreditManager]
    code: 200
    input: []
    output: GrowerAccount
    side_effects: ["credit_status -> SUSPENDED", "increments GrowerAccount.version by 1"]
  - method: POST
    path: "/agronomy/growers/{growerId}/credit-release"
    description: "Release grower back to ACTIVE; blocked while credit_used exceeds limit"
    roles: [CreditManager]
    code: 200
    input: []
    output: GrowerAccount
    side_effects: ["credit_status -> ACTIVE", "increments GrowerAccount.version by 1"]
  - method: POST
    path: "/agronomy/growers/{growerId}/payments"
    description: "Record a grower payment; waterfall-allocates to INVOICED orders oldest first"
    roles: [CreditManager]
    code: 201
    input: [amount_cents]
    output: CreditLedgerEntry
    side_effects:
      - "payment_waterfall allocation; covered orders payment_status -> PAID (CLOSED bubble-up when APPLIED_CONFIRMED)"
      - "append CreditLedgerEntry PAYMENT_RECEIVED -amount_cents; recompute credit_used_cents; increments GrowerAccount.version by 1"
  - method: GET
    path: "/agronomy/growers/{id}/credit-ledger"
    description: "List the grower's append-only credit ledger entries (chronological)"
    roles: [Grower, CreditManager, BranchAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: CreditLedgerEntry[]
    side_effects: []
  - method: GET
    path: "/agronomy/growers/{growerId}/exposure"
    description: "Computed read of the grower's credit posture under both credit_utilization variants"
    roles: [Grower, CreditManager, BranchAdmin]
    code: 200
    input: []
    output: { billed_balance_cents: integer, booked_exposure_cents: integer, exposure_balance_cents: integer, credit_limit_cents: integer, available_credit_cents: integer }
    side_effects: []

