    instances:
      - name: animal_itinerary_rejects_legs_that_only_touch_at_an_endpoint
        grounds:
          - validations.priority_46
          - entities.FlightLeg.fields.scheduled_arrival_utc
          - errors.ERR_ANIMAL_ITINERARY_OVERLAP
        distinguishing_aspect: |
          CLOSED-interval resource: the animal itself. The inbound leg arrives at 15:00Z and the next leg
          departs at exactly 15:00Z, so the intervals share a single instant and that counts as an overlap.
          This is also the priority proof that the overlap check at 46 precedes the connection minimum at 47.
        test_recipe:
          setup:
            - "AN101 HKG->LAX 2026-09-10T02:00Z-15:00Z and AN401 LAX->JFK 2026-09-10T15:00Z-19:00Z, touching at 15:00Z"
