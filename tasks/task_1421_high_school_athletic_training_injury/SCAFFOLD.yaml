    input: [symptom_check_passed]
    output: ReturnToPlayProtocol
    side_effects: ["current_stage += 1", "stage_entered_at = now", "stage_history appended"]
  - method: POST
    path: "/rtp-protocols/{protocolId}/regress"
    description: "Symptom recurrence: back to stage 1 (cascades to injury and posture)"
    roles: [AthleticTrainer]
    code: 200
    input: ["notes?"]
    output: ReturnToPlayProtocol
    side_effects: ["current_stage = 1", "recurrence_count += 1", "injury -> UNDER_CARE", "athlete posture -> recompute (MEDICAL_HOLD path)", "GuardianNotification RTP_REGRESSION created"]
  - method: POST
    path: "/rtp-protocols/{protocolId}/clear"
    description: "Final clearance from stage 6 (authority per clearance_authority_required)"
    roles: [AthleticTrainer, Physician]
    code: 200
    input: [clearance_notes]
    output: ReturnToPlayProtocol
    side_effects: ["status -> CLEARED", "cleared_by_staff_id = X-User-ID", "injury -> RESOLVED", "athlete posture recompute", "GuardianNotification CLEARANCE_GRANTED created"]
  - method: POST
