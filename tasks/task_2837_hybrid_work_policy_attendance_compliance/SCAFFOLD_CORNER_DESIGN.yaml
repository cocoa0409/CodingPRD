              as: WorkplaceProgramOffice
              captures: { cyc_b: $.data.id }
            - call: "POST /teams"
              payload: { policy_cycle_id: "${cyc_a}", team_code: "T-A", expected_days_in_office_per_week: 3, core_collaboration_days: ["TUE", "WED", "THU"], headcount_planned: 12, signal_corroboration_required: false }
