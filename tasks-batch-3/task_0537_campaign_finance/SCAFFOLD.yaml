scenario: "Campaign Finance & Lobbyist Disclosure: committee/registrant registration, contribution & expenditure entry, contribution-limit & source-prohibition check, reporting-period filing & deadline, lobbyist activity & client, late-filing penalty, public-search disclosure, audit/amendment"
domain_name: campaign-finance-disclosure
api_prefix: /disclosure

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: ledger_reconciliation
  complexity_layers:
    - rate_threshold_triggers        # contribution limits, tiered late-filing penalty
    - cascading_side_effects         # late-file -> penalty -> committee totals -> solvency
    - dual_variant_calculation       # provisional vs final receipts; committed vs certified spend
    - optimistic_concurrency         # OCC on Committee.version for report create-with-supersede
    - scheduled_actions              # logical clock drives filing deadlines / lateness

  entity_topology: hybrid
  # Two parallel disclosure trees (campaign-finance committees, lobbying registrants)
  # sharing reporting-period / deadline / penalty semantics; several cross-aggregate FKs.

  state_machine_shape: parallel
  # Contribution carries two independent status dimensions (settlement x compliance-review);
  # Report is cyclic (FILED<->UNDER_AUDIT audit loop) plus a supersede branch on amendment.

  relationship_patterns:
    - one_to_many          # committee -> contributions/expenditures/reports; registrant -> clients/activities
    - self_referential     # Report.supersedes_report_id -> Report.id (amendment chain)
    - cross_aggregate      # Report.period_id -> ReportingPeriod; Activity.period_id -> LobbyingReportingPeriod

  role_model: peer_roles
  # Treasurer owns a Committee's finance surface; LobbyRegistrant owns a registrant's lobbying
  # surface; RegulatorAuditor is the opaque agency operator (approve/void/close/audit/waive);
  # PublicViewer is read-only public-search disclosure.

  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =====================================================================
# §1.1 Entity-Relationship Table
# =====================================================================
entities:
  - name: Committee
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: registered committee name
      - name: committee_type
        type: enum
        source: input
        description: kind of committee; gates source-prohibition and contribution-limit matrices
        constraints: "one of CANDIDATE, PAC, PARTY"
      - name: election_cycle
        type: string
        source: input
        description: cycle label the contribution-limit aggregate is keyed on (e.g. '2026')
      - name: jurisdiction
        type: string
        source: input
        description: filing jurisdiction code (e.g. 'CA')
      - name: treasurer_name
        type: string
        source: input
        description: responsible officer of record
      - name: status
        type: enum
        source: system
        description: lifecycle state
        default: PENDING
        constraints: "one of PENDING, ACTIVE, SUSPENDED, TERMINATED"
      - name: total_receipts_cents
        type: integer
        source: computed
        description: "sum of amount_cents over Contribution WHERE committee_id==self.id AND settlement_status IN {RECORDED, DEPOSITED}; recomputed on every contribution mutation"
        default: 0
      - name: total_disbursements_cents
        type: integer
        source: computed
        description: "sum of amount_cents over Expenditure WHERE committee_id==self.id; recomputed on expenditure create"
        default: 0
      - name: total_penalties_cents
        type: integer
        source: computed
        description: "sum of penalty_amount_cents over Report WHERE committee_id==self.id AND penalty_status==ASSESSED; recomputed on report file / penalty waive"
        default: 0
      - name: cash_on_hand_cents
        type: integer
        source: computed
        description: "evaluated as total_receipts_cents - total_disbursements_cents - total_penalties_cents in that pinned order (see calculations.committee_cash_on_hand)"
        default: 0
      - name: solvency_status
        type: enum
        source: computed
        description: "DEFICIT when cash_on_hand_cents < 0, else SOLVENT; recomputed whenever cash_on_hand_cents changes"
        default: SOLVENT
        constraints: "one of SOLVENT, DEFICIT"

  - name: Contribution
    parent: null
    common_fields: true
    fields:
      - name: committee_id
        type: string
        source: input
        description: "FK -> Committee.id; the recipient committee (from path)"
      - name: contributor_ref
        type: string
        source: input
        description: stable contributor identity key the per-cycle limit aggregate is grouped on
      - name: contributor_name
        type: string
        source: input
        description: display name of the source
      - name: contributor_type
        type: enum
        source: input
        description: source classification driving source-prohibition and limit selection
        constraints: "one of INDIVIDUAL, PAC, PARTY, CORPORATION, UNION, FOREIGN_NATIONAL"
      - name: amount_cents
        type: integer
        source: input
        description: contribution amount in integer cents; must be > 0
      - name: contribution_date
        type: datetime
        source: input
        description: date the contribution was received; used for reporting-window inclusion
      - name: matchable_amount_cents
        type: integer
        source: computed
        description: "min(amount_cents, MATCH_CAP_CENTS) when contributor_type==INDIVIDUAL else 0 (see calculations.report_matching_funds)"
        default: 0
      - name: settlement_status
        type: enum
        source: system
        description: money-settlement dimension (independent of review_status)
        default: RECORDED
        constraints: "one of RECORDED, DEPOSITED, REFUNDED, VOIDED"
      - name: review_status
        type: enum
        source: system
        description: compliance-review dimension (independent of settlement_status)
        default: UNREVIEWED
        constraints: "one of UNREVIEWED, FLAGGED, CLEARED"

  - name: Expenditure
    parent: null
    common_fields: false
    fields:
      - name: committee_id
        type: string
        source: input
        description: "FK -> Committee.id; the spending committee (from path)"
      - name: payee_name
        type: string
        source: input
        description: recipient of the disbursement
      - name: amount_cents
        type: integer
        source: input
        description: disbursement amount in integer cents; must be > 0
      - name: expenditure_date
        type: datetime
        source: input
        description: date of the disbursement
      - name: purpose
        type: string
        source: input
        description: stated purpose of the disbursement

  - name: ReportingPeriod
    parent: null
    common_fields: true
    fields:
      - name: jurisdiction
        type: string
        source: input
        description: jurisdiction the period governs
      - name: election_cycle
        type: string
        source: input
        description: cycle label; overlap uniqueness is scoped to (jurisdiction, election_cycle)
      - name: period_label
        type: string
        source: input
        description: human label (e.g. 'Q1-2026')
      - name: period_start
        type: datetime
        source: input
        description: inclusive window start; half-open interval [period_start, period_end)
      - name: period_end
        type: datetime
        source: input
        description: exclusive window end; half-open interval [period_start, period_end)
      - name: filing_deadline
        type: datetime
        source: input
        description: instant after which a filing for this period is late (strict >)
      - name: status
        type: enum
        source: system
        description: OPEN until the agency closes it; filing requires CLOSED
        default: OPEN
        constraints: "one of OPEN, CLOSED"

  - name: Report
    parent: null
    common_fields: true
    fields:
      - name: committee_id
        type: string
        source: input
        description: "FK -> Committee.id; the filing committee (from path)"
      - name: period_id
        type: string
        source: input
        description: "FK -> ReportingPeriod.id; the period this report covers"
      - name: supersedes_report_id
        type: string
        source: system
        description: "FK -> Report.id; set on an amendment to the report it supersedes; null on an original"
        default: null
      - name: amendment_seq
        type: integer
        source: system
        description: 0 for the original filing; increments by 1 per amendment in the chain
        default: 0
      - name: status
        type: enum
        source: system
        description: lifecycle; cyclic via audit loop, branch via supersede
        default: DRAFT
        constraints: "one of DRAFT, FILED, UNDER_AUDIT, SUPERSEDED"
      - name: total_receipts_cents
        type: integer
        source: computed
        description: "provisional when DRAFT (settlement_status IN {RECORDED,DEPOSITED}); final when FILED (settlement_status==DEPOSITED only) over contributions in the period window (see calculations.report_receipts_total)"
        default: 0
      - name: total_disbursements_cents
        type: integer
        source: computed
        description: "sum of Expenditure.amount_cents for committee where expenditure_date in [period_start, period_end)"
        default: 0
      - name: matching_funds_cents
        type: integer
        source: computed
        description: "per-line-item rounded public-match total (see calculations.report_matching_funds)"
        default: 0
      - name: filed_at
        type: datetime
        source: system
        description: logical-clock instant the report transitioned DRAFT->FILED; null until filed
        default: null
      - name: is_late
        type: boolean
        source: computed
        description: "true iff filed_at > period.filing_deadline (strict); pinned at file time"
        default: false
      - name: days_late
        type: integer
        source: computed
        description: "ceil((filed_at - filing_deadline) / 1 day) when is_late else 0"
        default: 0
      - name: penalty_status
        type: enum
        source: system
        description: NONE unless a late filing assessed a penalty; WAIVED by the agency
        default: NONE
        constraints: "one of NONE, ASSESSED, WAIVED"
      - name: penalty_amount_cents
        type: integer
        source: computed
        description: "tiered late-filing penalty pinned at file time (see calculations.late_filing_penalty); 0 unless penalty_status==ASSESSED"
        default: 0

  - name: LobbyingRegistrant
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: registrant (lobbying firm) name
      - name: registrant_contact
        type: string
        source: input
        description: contact of record
      - name: jurisdiction
        type: string
        source: input
        description: filing jurisdiction code
      - name: status
        type: enum
        source: system
        description: lifecycle
        default: ACTIVE
        constraints: "one of ACTIVE, TERMINATED"
      - name: total_committed_spend_cents
        type: integer
        source: computed
        description: "sum of amount_cents over LobbyingActivity WHERE registrant_id==self.id AND status==RECORDED (all periods) — provisional variant (see calculations.registrant_spend_totals)"
        default: 0
      - name: total_certified_spend_cents
        type: integer
        source: computed
        description: "sum of amount_cents over LobbyingActivity WHERE registrant_id==self.id AND status==RECORDED AND its period.status==CLOSED — certified variant (see calculations.registrant_spend_totals)"
        default: 0

  - name: Client
    parent: null
    common_fields: true
    fields:
      - name: registrant_id
        type: string
        source: input
        description: "FK -> LobbyingRegistrant.id; the retaining registrant (from path)"
      - name: client_name
        type: string
        source: input
        description: name of the lobbying client
      - name: status
        type: enum
        source: system
        description: lifecycle
        default: ACTIVE
        constraints: "one of ACTIVE, INACTIVE"

  - name: LobbyingReportingPeriod
    parent: null
    common_fields: true
    fields:
      - name: jurisdiction
        type: string
        source: input
        description: jurisdiction the lobbying period governs; overlap uniqueness scoped to jurisdiction
      - name: period_label
        type: string
        source: input
        description: human label (e.g. 'H1-2026')
      - name: period_start
        type: datetime
        source: input
        description: closed interval start [period_start, period_end] (adjacency counts as overlap)
      - name: period_end
        type: datetime
        source: input
        description: closed interval end [period_start, period_end] (adjacency counts as overlap)
      - name: filing_deadline
        type: datetime
        source: input
        description: instant after which a lobbying filing for this period is late
      - name: status
        type: enum
        source: system
        description: OPEN until the agency closes it; certification of spend requires CLOSED
        default: OPEN
        constraints: "one of OPEN, CLOSED"

  - name: LobbyingActivity
    parent: null
    common_fields: true
    fields:
      - name: registrant_id
        type: string
        source: input
        description: "FK -> LobbyingRegistrant.id; the reporting registrant (from path)"
      - name: client_id
        type: string
        source: input
        description: "FK -> Client.id; the client on whose behalf the activity occurred"
      - name: period_id
        type: string
        source: input
        description: "FK -> LobbyingReportingPeriod.id; the lobbying period the activity is disclosed under"
      - name: lobbyist_name
        type: string
        source: input
        description: individual lobbyist who performed the activity
      - name: subject
        type: string
        source: input
        description: subject / bill / topic lobbied
      - name: amount_cents
        type: integer
        source: input
        description: spend attributed to this activity in integer cents; must be > 0
      - name: activity_date
        type: datetime
        source: input
        description: date the activity occurred
      - name: status
        type: enum
        source: system
        description: lifecycle
        default: RECORDED
        constraints: "one of RECORDED, VOIDED"

# =====================================================================
# §1.2 State Machine Table
# =====================================================================
state_machines:
  - entity: Committee
    initial_state: PENDING
    terminal_states: [TERMINATED]
    transitions:
      - from: PENDING
        to: ACTIVE
        trigger: "POST /disclosure/committees/{id}/approve"
        actor: RegulatorAuditor
        preconditions: ["committee.status == PENDING"]
        side_effects: ["increments Committee.version by 1"]
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /disclosure/committees/{id}/suspend"
        actor: RegulatorAuditor
        preconditions: ["committee.status == ACTIVE"]
        side_effects: ["increments Committee.version by 1"]
      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /disclosure/committees/{id}/terminate"
        actor: Treasurer
        preconditions: ["committee.status == ACTIVE", "acting Treasurer owns this committee"]
        side_effects: ["increments Committee.version by 1"]
      - from: SUSPENDED
        to: TERMINATED
        trigger: "POST /disclosure/committees/{id}/terminate"
        actor: Treasurer
        preconditions: ["committee.status == SUSPENDED", "acting Treasurer owns this committee"]
        side_effects: ["increments Committee.version by 1"]

  - entity: Contribution
    initial_state: RECORDED
    terminal_states: [REFUNDED, VOIDED]
    note: >
      Two independent status dimensions on one row. settlement_status
      (RECORDED->DEPOSITED->REFUNDED, and RECORDED|DEPOSITED->VOIDED) evolves
      independently of review_status (UNREVIEWED->FLAGGED->CLEARED). Transitions
      below annotate which dimension each drives.
    transitions:
      - from: RECORDED
        to: DEPOSITED
        trigger: "POST /disclosure/contributions/{id}/deposit"
        actor: Treasurer
        preconditions: ["contribution.settlement_status == RECORDED", "acting Treasurer owns the parent committee"]
        side_effects:
          - "settlement_status -> DEPOSITED"
          - "Committee.total_receipts_cents unchanged (RECORDED and DEPOSITED both count toward receipts); increments Committee.version by 1"
      - from: DEPOSITED
        to: REFUNDED
        trigger: "POST /disclosure/contributions/{id}/refund"
        actor: Treasurer
        preconditions: ["contribution.settlement_status == DEPOSITED", "acting Treasurer owns the parent committee"]
        side_effects:
          - "settlement_status -> REFUNDED"
          - "hop1: Committee.total_receipts_cents recomputed downward (REFUNDED excluded)"
          - "hop2: Committee.cash_on_hand_cents recomputed from the new total_receipts_cents"
          - "hop3: Committee.solvency_status recomputed from the new cash_on_hand_cents"
          - "increments Committee.version by 1"
      - from: RECORDED
        to: VOIDED
        trigger: "POST /disclosure/contributions/{id}/void"
        actor: RegulatorAuditor
        preconditions: ["contribution.settlement_status IN {RECORDED, DEPOSITED}"]
        side_effects:
          - "settlement_status -> VOIDED"
          - "hop1: Committee.total_receipts_cents recomputed downward (VOIDED excluded)"
          - "hop2: Committee.cash_on_hand_cents recomputed from the new total_receipts_cents"
          - "hop3: Committee.solvency_status recomputed from the new cash_on_hand_cents"
          - "increments Committee.version by 1"
      - from: DEPOSITED
        to: VOIDED
        trigger: "POST /disclosure/contributions/{id}/void"
        actor: RegulatorAuditor
        preconditions: ["contribution.settlement_status IN {RECORDED, DEPOSITED}"]
        side_effects:
          - "settlement_status -> VOIDED"
          - "hop1: Committee.total_receipts_cents recomputed downward (VOIDED excluded)"
          - "hop2: Committee.cash_on_hand_cents recomputed from the new total_receipts_cents"
          - "hop3: Committee.solvency_status recomputed from the new cash_on_hand_cents"
          - "increments Committee.version by 1"
      - from: UNREVIEWED
        to: FLAGGED
        trigger: "POST /disclosure/contributions/{id}/flag"
        actor: RegulatorAuditor
        preconditions: ["contribution.review_status == UNREVIEWED"]
        side_effects: ["review_status -> FLAGGED (settlement_status untouched); increments Committee.version by 1"]
      - from: FLAGGED
        to: CLEARED
        trigger: "POST /disclosure/contributions/{id}/clear"
        actor: RegulatorAuditor
        preconditions: ["contribution.review_status == FLAGGED"]
        side_effects: ["review_status -> CLEARED (settlement_status untouched); increments Committee.version by 1"]

  - entity: Report
    initial_state: DRAFT
    terminal_states: [SUPERSEDED]
    note: >
      Cyclic (FILED->UNDER_AUDIT->FILED audit loop) plus a supersede branch:
      amending a FILED report creates a new DRAFT report and moves the old one
      to terminal SUPERSEDED.
    transitions:
      - from: DRAFT
        to: FILED
        trigger: "POST /disclosure/reports/{id}/file"
        actor: Treasurer
        preconditions:
          - "report.status == DRAFT"
          - "acting Treasurer owns the parent committee"
          - "ReportingPeriod(report.period_id).status == CLOSED"
        side_effects:
          - "recompute Report.total_receipts_cents in FINAL variant (DEPOSITED-only)"
          - "recompute Report.matching_funds_cents (per-line rounding)"
          - "set filed_at = current logical-clock instant; set is_late/days_late"
          - "hop1: when is_late, set penalty_status=ASSESSED and penalty_amount_cents=late_filing_penalty(...)"
          - "hop2: Committee.total_penalties_cents recomputed (+= this report's penalty) — caused by hop1"
          - "hop3: Committee.cash_on_hand_cents recomputed from new total_penalties_cents — caused by hop2"
          - "hop4: Committee.solvency_status recomputed from new cash_on_hand_cents — caused by hop3"
          - "increments Committee.version by 1"
      - from: FILED
        to: UNDER_AUDIT
        trigger: "POST /disclosure/reports/{id}/audit-open"
        actor: RegulatorAuditor
        preconditions: ["report.status == FILED"]
        side_effects: ["report.status -> UNDER_AUDIT"]
      - from: UNDER_AUDIT
        to: FILED
        trigger: "POST /disclosure/reports/{id}/audit-close"
        actor: RegulatorAuditor
        preconditions: ["report.status == UNDER_AUDIT"]
        side_effects: ["report.status -> FILED (audit loop closed with no finding)"]
      - from: FILED
        to: SUPERSEDED
        trigger: "POST /disclosure/reports/{id}/amend"
        actor: Treasurer
        preconditions: ["report.status == FILED", "acting Treasurer owns the parent committee"]
        side_effects:
          - "old report.status -> SUPERSEDED (terminal)"
          - "create a new Report in DRAFT with supersedes_report_id=old.id, amendment_seq=old.amendment_seq+1, same committee_id/period_id"
          - "increments Committee.version by 1"
        note: "the created amendment is discoverable via GET /disclosure/reports/{old_id}/revisions"

  - entity: ReportingPeriod
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: CLOSED
        trigger: "POST /disclosure/reporting-periods/{id}/close"
        actor: RegulatorAuditor
        preconditions: ["period.status == OPEN"]
        side_effects: ["increments ReportingPeriod.version by 1"]

  - entity: LobbyingReportingPeriod
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: CLOSED
        trigger: "POST /disclosure/lobbying-periods/{id}/close"
        actor: RegulatorAuditor
        preconditions: ["period.status == OPEN"]
        side_effects:
          - "increments LobbyingReportingPeriod.version by 1"
          - "hop1: every LobbyingRegistrant with RECORDED activities in this period recomputes total_certified_spend_cents (activities now certified)"

  - entity: LobbyingRegistrant
    initial_state: ACTIVE
    terminal_states: [TERMINATED]
    transitions:
      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /disclosure/registrants/{id}/terminate"
        actor: LobbyRegistrant
        preconditions: ["registrant.status == ACTIVE", "acting LobbyRegistrant owns this registrant"]
        side_effects: ["increments LobbyingRegistrant.version by 1"]

  - entity: Client
    initial_state: ACTIVE
    terminal_states: [INACTIVE]
    transitions:
      - from: ACTIVE
        to: INACTIVE
        trigger: "POST /disclosure/clients/{id}/deactivate"
        actor: LobbyRegistrant
        preconditions: ["client.status == ACTIVE", "acting LobbyRegistrant owns the parent registrant"]
        side_effects: ["increments Client.version by 1"]

  - entity: LobbyingActivity
    initial_state: RECORDED
    terminal_states: [VOIDED]
    transitions:
      - from: RECORDED
        to: VOIDED
        trigger: "POST /disclosure/activities/{id}/void"
        actor: LobbyRegistrant
        preconditions: ["activity.status == RECORDED", "acting LobbyRegistrant owns the parent registrant"]
        side_effects:
          - "status -> VOIDED"
          - "hop1: LobbyingRegistrant.total_committed_spend_cents recomputed downward (VOIDED excluded)"
          - "hop2: LobbyingRegistrant.total_certified_spend_cents recomputed downward if the activity's period was CLOSED"
          - "increments LobbyingRegistrant.version by 1"

# =====================================================================
# §1.2.1 Concurrency Rules
# =====================================================================
concurrency_rules:
  - rule_id: report-create-stale-committee
    parent_entity: Committee
    write_endpoint: "POST /disclosure/committees/{id}/reports"
    occ_field: "expected_committee_version"
    description: |
      Creating a Report for a (committee, period) supersedes any prior DRAFT
      report for that same period. A create whose expected_committee_version is
      behind the committee's current version is rejected: the stale view means
      another writer has already created (and superseded) a report or otherwise
      advanced the committee, so this writer's assumption about the committee's
      report set no longer holds.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =====================================================================
# §1.3 Calculation Rules Table
# =====================================================================
calculations:
  - name: contribution_limit_aggregate
    trigger: "on POST /disclosure/committees/{id}/contributions, before persisting"
    algorithm: aggregation
    formula: |
      prior = sum(c.amount_cents for c in Contribution
                  where c.committee_id == committee.id
                    and c.contributor_ref == req.contributor_ref
                    and c.settlement_status in {RECORDED, DEPOSITED})
      new_aggregate = prior + req.amount_cents
      limit = CONTRIBUTION_LIMIT_CENTS[req.contributor_type][committee.committee_type]
      reject with ERR_CONTRIBUTION_LIMIT_EXCEEDED iff new_aggregate > limit   # '>' strict; '==' allowed
    input_set: "same-committee, same-contributor_ref, same election_cycle; only settlement_status IN {RECORDED, DEPOSITED} count (REFUNDED/VOIDED excluded)"
    constants:
      CONTRIBUTION_LIMIT_CENTS:
        INDIVIDUAL: { CANDIDATE: 330000, PAC: 500000, PARTY: 4130000 }
        PAC:        { CANDIDATE: 500000, PAC: 500000, PARTY: 1500000 }
        PARTY:      { CANDIDATE: 500000, PAC: 500000, PARTY: 0 }
        CORPORATION:{ PAC: 500000 }
        UNION:      { PAC: 500000 }
        FOREIGN_NATIONAL: {}
    precision: "integer cents; no rounding"

  - name: report_receipts_total
    trigger: "provisional on POST /disclosure/committees/{id}/reports (DRAFT); final on POST /disclosure/reports/{id}/file"
    algorithm: aggregation
    formula: |
      window = contributions c where c.committee_id==report.committee_id
               and period.period_start <= c.contribution_date < period.period_end
      PROVISIONAL: sum(c.amount_cents for c in window if c.settlement_status in {RECORDED, DEPOSITED})
      FINAL:       sum(c.amount_cents for c in window if c.settlement_status == DEPOSITED)
    input_set: "contributions in the half-open period window; provisional includes RECORDED, final excludes anything not DEPOSITED"
    precision: "integer cents"
    variants:
      - name: provisional
        when: "report is DRAFT (at create)"
        difference: "counts RECORDED and DEPOSITED contributions optimistically"
      - name: final
        when: "report transitions DRAFT->FILED"
        difference: "counts only DEPOSITED contributions; RECORDED-but-not-deposited drop out, so final <= provisional"

  - name: report_matching_funds
    trigger: "computed alongside report_receipts_total on report create and on file"
    algorithm: weighted_scoring
    formula: |
      eligible = contributions c in the period window with c.matchable_amount_cents > 0
                 and (DRAFT: settlement_status in {RECORDED,DEPOSITED}; FILED: settlement_status==DEPOSITED)
      # PINNED ORDER: round EACH line item half-up to whole cents, THEN sum.
      matching_funds_cents = sum( round_half_up(c.matchable_amount_cents * MATCH_RATE) for c in eligible )
      # (NOT round_half_up(sum(matchable) * MATCH_RATE) — that sum-then-round order is explicitly rejected.)
    input_set: "individual matchable contributions in the window; matchable_amount_cents = min(amount_cents, MATCH_CAP_CENTS) for INDIVIDUAL sources"
    constants:
      MATCH_RATE: 0.3333333333333333   # one-third public match
      MATCH_CAP_CENTS: 20000
    precision: "round_half_up to whole cents PER LINE ITEM, then sum"

  - name: late_filing_penalty
    trigger: "on POST /disclosure/reports/{id}/file when is_late"
    algorithm: tiered_pricing
    formula: |
      # >=3 inputs interacting non-linearly: days_late, total_receipts tier -> per_day rate, base fee, cap via min()
      tier_rate = PER_DAY_RATE_CENTS[ tier_of(report.total_receipts_cents) ]
      raw = BASE_FEE_CENTS + tier_rate * report.days_late
      penalty_amount_cents = min(raw, MAX_PENALTY_CENTS)
      where tier_of(r) = SMALL if r <= 500000 ; MEDIUM if r <= 5000000 ; else LARGE
    input_set: "the just-filed report's FINAL total_receipts_cents and days_late"
    constants:
      BASE_FEE_CENTS: 2500
      PER_DAY_RATE_CENTS: { SMALL: 1000, MEDIUM: 5000, LARGE: 20000 }
      MAX_PENALTY_CENTS: 1000000
      SMALL_MAX_CENTS: 500000
      MEDIUM_MAX_CENTS: 5000000
    precision: "integer cents; no rounding"

  - name: committee_cash_on_hand
    trigger: "recomputed whenever total_receipts_cents, total_disbursements_cents, or total_penalties_cents changes"
    algorithm: aggregation
    formula: |
      # PINNED evaluation order resolves the receipts<->penalty circular look:
      #   1) total_receipts_cents  (from contributions)
      #   2) total_disbursements_cents (from expenditures)
      #   3) total_penalties_cents (penalties are keyed off report total_receipts tier, NOT cash_on_hand)
      #   4) cash_on_hand_cents = total_receipts_cents - total_disbursements_cents - total_penalties_cents
      #   5) solvency_status = DEFICIT if cash_on_hand_cents < 0 else SOLVENT
      cash_on_hand_cents = total_receipts_cents - total_disbursements_cents - total_penalties_cents
    input_set: "the committee's three derived totals in the pinned order above"
    precision: "integer cents; solvency threshold at 0 (< 0 is DEFICIT, == 0 is SOLVENT)"

  - name: registrant_spend_totals
    trigger: "recomputed on activity create/void and on lobbying-period close"
    algorithm: aggregation
    formula: |
      COMMITTED: sum(a.amount_cents for a in LobbyingActivity
                     where a.registrant_id==registrant.id and a.status==RECORDED)
      CERTIFIED: sum(a.amount_cents for a in LobbyingActivity
                     where a.registrant_id==registrant.id and a.status==RECORDED
                       and LobbyingReportingPeriod(a.period_id).status==CLOSED)
    input_set: "registrant's RECORDED activities; certified restricts to activities whose period is CLOSED"
    precision: "integer cents"
    variants:
      - name: committed
        when: "always maintained on total_committed_spend_cents"
        difference: "counts all RECORDED activities regardless of period status"
      - name: certified
        when: "always maintained on total_certified_spend_cents"
        difference: "counts only RECORDED activities in CLOSED periods; certified <= committed"

# =====================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =====================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and X-User-Role is a known role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "the role is permitted to perform this operation per §1.7"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "every path-referenced resource exists, validated left-to-right"
    error_id: "ERR_<RESOURCE>_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with path ids"

  - priority: 4
    category: auth
    check: "entity_backed actor owns the target resource (Treasurer X-User-ID == committee_id of the resource's committee; LobbyRegistrant X-User-ID == registrant_id of the resource's registrant)"
    error_id: ERR_FORBIDDEN_OWNER
    http_status: 403
    applies_to: "owner-scoped mutations (contribution/expenditure/report writes; client/activity writes)"

  - priority: 5
    category: business_constraint
    check: "required body fields present, correct types, enum members valid"
    error_id: ERR_VALIDATION
    http_status: 422
    applies_to: "all bodies"

  - priority: 6
    category: business_constraint
    check: "monetary amount_cents > 0 (contribution, expenditure, activity)"
    error_id: ERR_INVALID_AMOUNT
    http_status: 422
    applies_to: "POST contributions / expenditures / activities"

  - priority: 7
    category: state
    check: "OCC: expected_committee_version equals the committee's current version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /disclosure/committees/{id}/reports"

  - priority: 8
    category: state
    check: "target resource's own status permits the transition (report DRAFT to file; contribution RECORDED to deposit; etc.)"
    error_id: "ERR_<RESOURCE>_NOT_<STATE> (e.g. ERR_REPORT_NOT_DRAFT, ERR_CONTRIBUTION_NOT_RECORDED)"
    http_status: 409
    applies_to: "all state-transition endpoints"

  - priority: 9
    category: state
    check: "cross-entity state precondition: committee ACTIVE for contribution/expenditure/report create; client ACTIVE and registrant ACTIVE for activity create"
    error_id: "ERR_COMMITTEE_NOT_ACTIVE / ERR_CLIENT_NOT_ACTIVE / ERR_REGISTRANT_NOT_ACTIVE"
    http_status: 409
    applies_to: "POST contributions/expenditures/reports; POST activities"

  - priority: 10
    category: business_temporal
    check: "filing requires the covered ReportingPeriod.status == CLOSED"
    error_id: ERR_PERIOD_NOT_CLOSED
    http_status: 409
    applies_to: "POST /disclosure/reports/{id}/file"

  - priority: 11
    category: business_temporal
    check: "new reporting period does not conflict with an existing period in the same scope (CF: half-open overlap; lobbying: closed-interval overlap where adjacency conflicts)"
    error_id: "ERR_PERIOD_OVERLAP"
    http_status: 409
    applies_to: "POST /disclosure/reporting-periods ; POST /disclosure/lobbying-periods"

  - priority: 12
    category: business_temporal
    check: "new activity's [activity_date] does not fall inside another RECORDED activity's occupied window for the same (registrant, client) — closed-interval, activity_date-day granularity (see §1.8 resource_temporal_overlap.activity_same_client_day)"
    error_id: ERR_ACTIVITY_OVERLAP
    http_status: 409
    applies_to: "POST /disclosure/registrants/{id}/activities"

  - priority: 13
    category: business_safety
    check: "source not prohibited for this committee_type per PROHIBITED_SOURCES matrix"
    error_id: ERR_PROHIBITED_SOURCE
    http_status: 409
    applies_to: "POST /disclosure/committees/{id}/contributions"

  - priority: 14
    category: business_fiscal
    check: "per-contributor per-cycle aggregate would not exceed the limit (see calculations.contribution_limit_aggregate)"
    error_id: ERR_CONTRIBUTION_LIMIT_EXCEEDED
    http_status: 409
    applies_to: "POST /disclosure/committees/{id}/contributions"

# =====================================================================
# §1.5 API Endpoint Table
# =====================================================================
endpoints:
  # ---- logical clock (test-driving) ----
  - method: POST
    path: "/disclosure/_clock/set_current_utc"
    description: "Set the server's logical UTC clock. Startup default is 2026-05-01T00:00:00Z; the clock never falls back to wall-clock time. All deadline/lateness rules read this clock."
    roles: [RegulatorAuditor]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["logical clock set to to_iso8601"]

  # ---- Committee ----
  - method: POST
    path: "/disclosure/committees"
    description: "Register a committee (starts PENDING)."
    roles: [Treasurer]
    code: 201
    input: [name, committee_type, election_cycle, jurisdiction, treasurer_name]
    output: Committee
    side_effects: ["Committee created in PENDING with zeroed derived totals"]
  - method: GET
    path: "/disclosure/committees/{id}"
    description: "Fetch a committee (public disclosure)."
    roles: [Treasurer, RegulatorAuditor, LobbyRegistrant, PublicViewer]
    code: 200
    input: []
    output: Committee
    side_effects: []
  - method: GET
    path: "/disclosure/committees"
    description: "List/search committees (public disclosure)."
    roles: [Treasurer, RegulatorAuditor, LobbyRegistrant, PublicViewer]
    code: 200
    input: ["status?", "committee_type?", "jurisdiction?", "limit?", "offset?"]
    output: Committee[]
    side_effects: []
  - method: POST
    path: "/disclosure/committees/{id}/approve"
    description: "Agency approves a committee: PENDING -> ACTIVE."
    roles: [RegulatorAuditor]
    code: 200
    input: []
    output: Committee
    side_effects: ["status PENDING->ACTIVE", "increments Committee.version by 1"]
  - method: POST
    path: "/disclosure/committees/{id}/suspend"
    description: "Agency suspends an active committee: ACTIVE -> SUSPENDED."
    roles: [RegulatorAuditor]
    code: 200
    input: []
    output: Committee
    side_effects: ["status ACTIVE->SUSPENDED", "increments Committee.version by 1"]
  - method: POST
    path: "/disclosure/committees/{id}/terminate"
    description: "Treasurer terminates own committee (from ACTIVE or SUSPENDED)."
    roles: [Treasurer]
    code: 200
    input: []
    output: Committee
    side_effects: ["status -> TERMINATED", "increments Committee.version by 1"]

  # ---- Contribution ----
  - method: POST
    path: "/disclosure/committees/{id}/contributions"
    description: "Enter a contribution to a committee (owner Treasurer). Runs source-prohibition then contribution-limit checks."
    roles: [Treasurer]
    code: 201
    input: [contributor_ref, contributor_name, contributor_type, amount_cents, contribution_date]
    output: Contribution
    side_effects:
      - "Contribution created (settlement_status=RECORDED, review_status=UNREVIEWED)"
      - "matchable_amount_cents computed"
      - "Committee.total_receipts_cents / cash_on_hand_cents / solvency_status recomputed; increments Committee.version by 1"
  - method: GET
    path: "/disclosure/committees/{id}/contributions"
    description: "List contributions of a committee (reverse of Contribution.committee_id)."
    roles: [Treasurer, RegulatorAuditor, LobbyRegistrant, PublicViewer]
    code: 200
    input: ["settlement_status?", "review_status?", "limit?", "offset?"]
    output: Contribution[]
    side_effects: []
  - method: GET
    path: "/disclosure/contributions"
    description: "Public-search disclosure across contributions."
    roles: [Treasurer, RegulatorAuditor, LobbyRegistrant, PublicViewer]
    code: 200
    input: ["committee_id?", "contributor_ref?", "contributor_type?", "min_amount_cents?", "settlement_status?", "limit?", "offset?"]
    output: Contribution[]
    side_effects: []
  - method: GET
    path: "/disclosure/contributions/{id}"
    description: "Fetch one contribution."
    roles: [Treasurer, RegulatorAuditor, LobbyRegistrant, PublicViewer]
    code: 200
    input: []
    output: Contribution
    side_effects: []
  - method: POST
    path: "/disclosure/contributions/{id}/deposit"
    description: "Treasurer deposits a recorded contribution: RECORDED -> DEPOSITED."
    roles: [Treasurer]
    code: 200
    input: []
    output: Contribution
    side_effects: ["settlement_status RECORDED->DEPOSITED", "increments Committee.version by 1"]
  - method: POST
    path: "/disclosure/contributions/{id}/refund"
    description: "Treasurer refunds a deposited contribution: DEPOSITED -> REFUNDED (compensating cascade on committee totals)."
    roles: [Treasurer]
    code: 200
    input: []
    output: Contribution
    side_effects:
      - "settlement_status DEPOSITED->REFUNDED"
      - "Committee.total_receipts_cents -> cash_on_hand_cents -> solvency_status recomputed (cascade)"
      - "increments Committee.version by 1"
  - method: POST
    path: "/disclosure/contributions/{id}/void"
    description: "Agency voids a contribution (compliance): RECORDED|DEPOSITED -> VOIDED (compensating cascade)."
    roles: [RegulatorAuditor]
    code: 200
    input: []
    output: Contribution
    side_effects:
      - "settlement_status -> VOIDED"
      - "Committee.total_receipts_cents -> cash_on_hand_cents -> solvency_status recomputed (cascade)"
      - "increments Committee.version by 1"
  - method: POST
    path: "/disclosure/contributions/{id}/flag"
    description: "Agency flags a contribution for review: review_status UNREVIEWED -> FLAGGED (settlement dimension untouched)."
    roles: [RegulatorAuditor]
    code: 200
    input: []
    output: Contribution
    side_effects: ["review_status UNREVIEWED->FLAGGED", "increments Committee.version by 1"]
  - method: POST
    path: "/disclosure/contributions/{id}/clear"
    description: "Agency clears a flagged contribution: review_status FLAGGED -> CLEARED."
    roles: [RegulatorAuditor]
    code: 200
    input: []
    output: Contribution
    side_effects: ["review_status FLAGGED->CLEARED", "increments Committee.version by 1"]

  # ---- Expenditure ----
  - method: POST
    path: "/disclosure/committees/{id}/expenditures"
    description: "Enter an expenditure (owner Treasurer)."
    roles: [Treasurer]
    code: 201
    input: [payee_name, amount_cents, expenditure_date, purpose]
    output: Expenditure
    side_effects:
      - "Expenditure created"
      - "Committee.total_disbursements_cents / cash_on_hand_cents / solvency_status recomputed; increments Committee.version by 1"
  - method: GET
    path: "/disclosure/committees/{id}/expenditures"
    description: "List expenditures of a committee (reverse of Expenditure.committee_id)."
    roles: [Treasurer, RegulatorAuditor, LobbyRegistrant, PublicViewer]
    code: 200
    input: ["limit?", "offset?"]
    output: Expenditure[]
    side_effects: []

  # ---- ReportingPeriod ----
  - method: POST
    path: "/disclosure/reporting-periods"
