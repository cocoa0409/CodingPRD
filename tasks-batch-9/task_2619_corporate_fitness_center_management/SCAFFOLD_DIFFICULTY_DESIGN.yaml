  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:

      # ---------------------------------------------------------------- 1 / 2 --
      - name: session_start_blocked_while_its_room_is_restricted
        entity_pair: "ProgramSession <- FacilityRoom"
        grounds:
          - state_machines.ProgramSession.STAFFED_to_IN_PROGRESS
          - state_machines.FacilityRoom.OPEN_to_RESTRICTED
          - state_machines.FacilityRoom.RESTRICTED_to_OPEN
          - validations[priority 16].ERR_ROOM_NOT_OPEN
          - constants.ROOM_PASS_SCORE
          - endpoints[POST /facility-rooms/{id}/inspections]
        distinguishing_aspect: |
          ProgramSession's STAFFED -> IN_PROGRESS transition is legal or illegal
          purely because of a DIFFERENT entity's state: FacilityRoom.room_state.
          A failed inspection (cleanliness_score 78 < ROOM_PASS_SCORE, one
          deficiency) flips the room to RESTRICTED without touching the session,
          and START then returns 422 ERR_ROOM_NOT_OPEN; a passing re-inspection
          (score 90, zero deficiencies) flips the room back to OPEN and the very
          same START call now succeeds. The failed inspection is deliberately
          performed more than SESSION_LOCK_WINDOW_HOURS before the session, so the
          room cascade does NOT cancel it and the dependency stays observable.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; ACTIVE COST_PLUS contract, READY AED, Studio A OPEN."
            - "One ACTIVE offering with a session on 2026-08-05 12:00-12:55Z and a CONFIRMED LEAD assignment, so the session is STAFFED."
            - "While the clock is still 2026-08-01 (more than 24h before the session, so no CANCELLED_FACILITY cascade), a failed inspection puts Studio A into RESTRICTED."
            - "Clock then advanced to 2026-08-05T11:50:00Z, inside the start grace window."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: OperatorAdmin
            - call: "POST /client-contracts"
              payload: { client_name: "Northwind Manufacturing", site_code: "NWM-01", fee_structure: "COST_PLUS", staffing_model: "OPERATOR_EMPLOYED", budgeted_staff_fte: 3.5, participation_target_pct: 35, term_start_on: "2026-07-01", term_end_on: "2027-06-30", not_to_exceed_cents: 5000000 }
              as: OperatorAdmin
              captures: { c_id: $.data.id }
            - call: "POST /staff-members"
              payload: { contract_id: "${c_id}", full_name: "Dana Reed", role_type: "SITE_MANAGER", employment_type: "OPERATOR_EMPLOYED", hourly_cost_cents: 5200 }
              as: OperatorAdmin
              captures: { mgr_id: $.data.id }
            - call: "POST /staff-credentials"
              payload: { staff_member_id: "${mgr_id}", credential_type: "CPR_AED", issuer: "American Heart Association", credential_number: "AHA-771", expires_on: "2027-06-30" }
              as: OperatorAdmin
              captures: { mgr_cred_id: $.data.id }
            - call: "POST /staff-credentials/${mgr_cred_id}/verify"
              payload: { decision: "ACCEPT" }
              as: OperatorAdmin
            - call: "POST /client-contracts/${c_id}/submit"
              payload: {}
              as: OperatorAdmin
            - call: "POST /client-contracts/${c_id}/client-decision"
              payload: { decision: "APPROVE" }
              as: ClientSponsor
              as_user_id: "${c_id}"
            - call: "POST /facility-rooms"
              payload: { contract_id: "${c_id}", room_name: "Studio A", room_type: "STUDIO", max_occupancy: 30 }
              as: SiteManager
              as_user_id: "${mgr_id}"
              captures: { room_a_id: $.data.id }
            - call: "POST /facility-assets"
              payload: { contract_id: "${c_id}", room_id: "${room_a_id}", asset_type: "AED", asset_tag: "AED-01", pad_expiry_on: "2027-03-31", battery_expiry_on: "2027-03-31", last_inspection_on: "2026-07-20" }
              as: SiteManager
              as_user_id: "${mgr_id}"
              captures: { aed_id: $.data.id }
            - call: "POST /staff-members"
              payload: { contract_id: "${c_id}", full_name: "Ravi Patel", role_type: "GROUP_EX_INSTRUCTOR", employment_type: "OPERATOR_EMPLOYED", hourly_cost_cents: 4700 }
              as: OperatorAdmin
              captures: { inst1_id: $.data.id }
            - call: "POST /staff-credentials"
              payload: { staff_member_id: "${inst1_id}", credential_type: "GROUP_EX_CERT", issuer: "ACE", credential_number: "ACE-4410", expires_on: "2027-05-31" }
              as: OperatorAdmin
