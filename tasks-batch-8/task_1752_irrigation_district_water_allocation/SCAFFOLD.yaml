scenario: "Irrigation District Water Allocation & Turnout Scheduling (western irrigation district): water right & annual allocation per acre, order/turnout scheduling & rotation, ditch rider work order & measurement, over-allocation & carryover rules, assessment billing & lien for nonpayment, canal maintenance & shutdown windows, transfer/lease of allocation between users, drought curtailment priority"

domain_name: irrigation-water-allocation
api_prefix: /district

complexity_profile:
  primary_archetype: quota_allocation
  secondary_archetype: temporal_windowing
  complexity_layers:
    - derived_field_reconciliation
    - cascading_side_effects
    - optimistic_concurrency
    - rate_threshold_triggers
  entity_topology: flat
  state_machine_shape: branching
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: peer_roles
  consistency_model: immediate

# =============================================================================
# 1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: WaterAccount
    parent: null
    common_fields: true
    fields:
      - { name: holder_name, type: string, source: input, description: "Account holder name" }
      - { name: parcel_number, type: string, source: input, description: "Assessor parcel number served by this account" }
      - { name: irrigated_acres, type: number, source: input, description: "Irrigated acreage; must be > 0", constraints: "must be > 0" }
      - { name: water_right_priority_date, type: datetime, source: input, description: "Priority date of the account's water right; determines seniority class" }
      - { name: priority_class, type: enum, source: computed, description: "SENIOR if water_right_priority_date <= PRIORITY_CUT_DATE else JUNIOR", constraints: "SENIOR | JUNIOR" }
      - { name: status, type: enum, source: system, description: "ACTIVE | SUSPENDED (lien hold) | CLOSED (terminal)", default: ACTIVE, constraints: "ACTIVE | SUSPENDED | CLOSED" }

  - name: IrrigationSeason
    parent: null
    common_fields: true
    fields:
      - { name: year, type: integer, source: input, description: "Calendar year of the season; unique across seasons", constraints: "unique" }
      - { name: announced_af_per_acre, type: number, source: input, description: "Board-announced allocation in acre-feet per acre; must be > 0", constraints: "must be > 0" }
      - { name: carryover_cap_pct, type: number, source: input, description: "Max carryover into next season as percent of base entitlement (0-100)", constraints: "0 <= value <= 100" }
      - { name: billing_method, type: enum, source: input, description: "PER_ACRE bills acreage only; PER_AF_DELIVERED bills measured deliveries only", constraints: "PER_ACRE | PER_AF_DELIVERED" }
      - { name: assessment_rate_per_acre, type: number, source: input, description: "Assessment dollars per irrigated acre (PER_ACRE method)", constraints: ">= 0" }
      - { name: toll_tier1_cap_af, type: number, source: input, description: "Delivered acre-feet billed at tier-1 rate before tier-2 applies", constraints: ">= 0" }
      - { name: toll_tier1_rate_per_af, type: number, source: input, description: "Dollars per delivered acre-foot up to toll_tier1_cap_af", constraints: ">= 0" }
      - { name: toll_tier2_rate_per_af, type: number, source: input, description: "Dollars per delivered acre-foot above toll_tier1_cap_af", constraints: ">= 0" }
      - { name: overage_rate_per_af, type: number, source: input, description: "Dollars per over-delivered acre-foot above effective entitlement", constraints: ">= 0" }
      - { name: start_date, type: datetime, source: input, description: "Season start (must be < end_date)", constraints: "start_date < end_date" }
      - { name: end_date, type: datetime, source: input, description: "Season end" }
      - { name: status, type: enum, source: system, description: "DRAFT | ANNOUNCED | OPEN | CLOSED", default: DRAFT, constraints: "DRAFT | ANNOUNCED | OPEN | CLOSED" }

  - name: SeasonAllocation
    parent: null
    common_fields: true
    fields:
      - { name: water_account_id, type: string, source: input, description: "FK -> WaterAccount.id; one allocation per (account, season)" }
      - { name: season_id, type: string, source: input, description: "FK -> IrrigationSeason.id; one allocation per (account, season)" }
      - { name: base_entitlement_af, type: number, source: computed, description: "round(irrigated_acres * announced_af_per_acre, 2) at creation" }
      - { name: curtailed_entitlement_af, type: number, source: computed, description: "Null until drought effectuated; round(base_entitlement_af * (1 - class pct/100), 2)" }
      - { name: effective_entitlement_af, type: number, source: computed, description: "curtailed_entitlement_af while status CURTAILED, else base_entitlement_af" }
      - { name: carryover_in_af, type: number, source: computed, description: "Carryover from the account's most recent CLOSED prior-season allocation (min of settled unused and cap); 0 if none" }
      - { name: carryover_out_af, type: number, source: computed, description: "Set when the season closes: min(settled unused, round(base_entitlement_af * carryover_cap_pct/100, 2)); 0 if over-allocated at close" }
      - { name: transfers_in_af, type: number, source: computed, description: "Sum of quantity_af over POSTED TransferRequests with to_account_id = this account for this season" }
      - { name: transfers_out_af, type: number, source: computed, description: "Sum of quantity_af over POSTED TransferRequests with from_account_id = this account for this season" }
      - { name: delivered_af, type: number, source: computed, description: "Sum of measured_af over VERIFIED RiderWorkOrders of this allocation's DELIVERED orders" }
      - { name: committed_af, type: number, source: computed, description: "Sum of requested_quantity_af over this allocation's TurnoutOrders in {REQUESTED, SCHEDULED, FLOWING}" }
      - { name: available_af, type: number, source: computed, description: "effective_entitlement_af + carryover_in_af + transfers_in_af - transfers_out_af - delivered_af - committed_af" }
      - { name: over_allocated_af, type: number, source: computed, description: "max(0, delivered_af - (effective_entitlement_af + carryover_in_af + transfers_in_af - transfers_out_af))" }
      - { name: status, type: enum, source: system, description: "ACTIVE | CURTAILED (drought) | CLOSED (season closed)", default: ACTIVE, constraints: "ACTIVE | CURTAILED | CLOSED" }

  - name: TurnoutOrder
    parent: null
    common_fields: true
    fields:
      - { name: water_account_id, type: string, source: input, description: "FK -> WaterAccount.id; ordering account (WaterUser caller must own it)" }
      - { name: season_allocation_id, type: string, source: input, description: "FK -> SeasonAllocation.id; the ledger the order reserves against" }
      - { name: canal_reach_id, type: string, source: input, description: "FK -> CanalReach.id; reach serving the turnout" }
      - { name: requested_cfs, type: number, source: input, description: "Requested flow in cubic feet per second; must be > 0", constraints: "must be > 0" }
      - { name: requested_start_at, type: datetime, source: input, description: "Requested delivery window start (must be < requested_end_at)", constraints: "requested_start_at < requested_end_at" }
      - { name: requested_end_at, type: datetime, source: input, description: "Requested delivery window end" }
      - { name: requested_quantity_af, type: number, source: computed, description: "round(requested_cfs * window_hours * AF_PER_CFS_HOUR, 2)" }
      - { name: actual_delivered_af, type: number, source: system, description: "Null until DELIVERED; then equals the VERIFIED work order's measured_af" }
      - { name: over_delivered, type: boolean, source: computed, description: "True when actual_delivered_af > requested_quantity_af at delivery time", default: false }
      - { name: status, type: enum, source: system, description: "REQUESTED | SCHEDULED | FLOWING | DELIVERED | CANCELLED | REJECTED", default: REQUESTED, constraints: "REQUESTED | SCHEDULED | FLOWING | DELIVERED | CANCELLED | REJECTED" }

  - name: RiderWorkOrder
    parent: null
    common_fields: true
    fields:
      - { name: turnout_order_id, type: string, source: system, description: "FK -> TurnoutOrder.id; set at creation when the order is scheduled" }
      - { name: rider_user_id, type: string, source: input, description: "Opaque DitchRider operator id assigned to perform the measurement (from schedule call)" }
      - { name: measured_cfs, type: number, source: input, description: "Measured flow at the turnout; null until submitted; must be > 0 when submitted", constraints: "must be > 0 when submitted" }
      - { name: measured_hours, type: number, source: input, description: "Measured delivery duration in hours; null until submitted; must be > 0 when submitted", constraints: "must be > 0 when submitted" }
      - { name: measured_af, type: number, source: computed, description: "round(measured_cfs * measured_hours * AF_PER_CFS_HOUR, 2); null until submitted" }
      - { name: return_reason, type: string, source: input, description: "Reason recorded when a submitted measurement is returned for rework" }
      - { name: status, type: enum, source: system, description: "ASSIGNED | IN_PROGRESS | MEASUREMENT_SUBMITTED | VERIFIED | CANCELLED", default: ASSIGNED, constraints: "ASSIGNED | IN_PROGRESS | MEASUREMENT_SUBMITTED | VERIFIED | CANCELLED" }

  - name: AssessmentInvoice
    parent: null
    common_fields: true
    fields:
      - { name: water_account_id, type: string, source: input, description: "FK -> WaterAccount.id; one invoice per (account, season)" }
      - { name: season_id, type: string, source: input, description: "FK -> IrrigationSeason.id; one invoice per (account, season)" }
      - { name: billing_method_snapshot, type: enum, source: system, description: "Season's billing_method copied at creation: PER_ACRE | PER_AF_DELIVERED", constraints: "PER_ACRE | PER_AF_DELIVERED" }
      - { name: acreage_line_amount, type: number, source: computed, description: "PER_ACRE: round(irrigated_acres * assessment_rate_per_acre, 2); PER_AF_DELIVERED: 0.00" }
      - { name: toll_line_amount, type: number, source: computed, description: "PER_ACRE: 0.00; PER_AF_DELIVERED: round(tiered water toll on delivered_af incl. overage, 2)" }
      - { name: penalty_line_amount, type: number, source: computed, description: "0.00 until DELINQUENT; then round(LATE_PENALTY_PCT% * (acreage_line_amount + toll_line_amount), 2)", default: 0.00 }
      - { name: total_amount, type: number, source: computed, description: "Sum of the individually rounded line amounts (round per line, then sum)" }
      - { name: issued_at, type: datetime, source: system, description: "Logical-clock timestamp when issued; null while DRAFT" }
      - { name: due_date, type: datetime, source: input, description: "Payment due date supplied at issue time" }
      - { name: paid_at, type: datetime, source: system, description: "Logical-clock timestamp of payment; null until PAID" }
      - { name: status, type: enum, source: system, description: "DRAFT | ISSUED | DELINQUENT | LIEN_FILED | PAID", default: DRAFT, constraints: "DRAFT | ISSUED | DELINQUENT | LIEN_FILED | PAID" }

  - name: CanalReach
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Reach/lateral name" }
      - { name: max_capacity_cfs, type: number, source: input, description: "Maximum combined flow the reach can carry at any instant; must be > 0", constraints: "must be > 0" }
      - { name: status, type: enum, source: system, description: "IN_SERVICE | SHUTDOWN (while a maintenance window is ACTIVE)", default: IN_SERVICE, constraints: "IN_SERVICE | SHUTDOWN" }

  - name: MaintenanceWindow
    parent: null
    common_fields: true
    fields:
      - { name: canal_reach_id, type: string, source: input, description: "FK -> CanalReach.id; reach taken out of service" }
      - { name: start_at, type: datetime, source: input, description: "Shutdown start; half-open interval [start_at, end_at); must be < end_at", constraints: "start_at < end_at" }
      - { name: end_at, type: datetime, source: input, description: "Shutdown end; adjacent windows (start_at == prior end_at) are allowed" }
      - { name: reason, type: string, source: input, description: "Free-text maintenance reason" }
      - { name: status, type: enum, source: system, description: "PLANNED | ACTIVE | COMPLETED | CANCELLED", default: PLANNED, constraints: "PLANNED | ACTIVE | COMPLETED | CANCELLED" }

  - name: TransferRequest
    parent: null
    common_fields: true
    fields:
      - { name: from_account_id, type: string, source: input, description: "FK -> WaterAccount.id; source account (WaterUser caller must own it)" }
      - { name: to_account_id, type: string, source: input, description: "FK -> WaterAccount.id; destination account (must differ from source)", constraints: "to_account_id != from_account_id" }
      - { name: season_id, type: string, source: input, description: "FK -> IrrigationSeason.id; season the allocation moves within" }
      - { name: quantity_af, type: number, source: input, description: "Acre-feet to transfer; must be > 0", constraints: "must be > 0" }
      - { name: status, type: enum, source: system, description: "PENDING | APPROVED | POSTED | REJECTED | CANCELLED", default: PENDING, constraints: "PENDING | APPROVED | POSTED | REJECTED | CANCELLED" }

  - name: DroughtDeclaration
    parent: null
    common_fields: true
    fields:
      - { name: season_id, type: string, source: input, description: "FK -> IrrigationSeason.id; season under curtailment" }
      - { name: stage, type: enum, source: input, description: "Curtailment stage selecting the pinned percentage pair", constraints: "STAGE_1 | STAGE_2 | STAGE_3" }
      - { name: senior_curtailment_pct, type: number, source: system, description: "From stage constants: STAGE_1=0, STAGE_2=10, STAGE_3=25" }
      - { name: junior_curtailment_pct, type: number, source: system, description: "From stage constants: STAGE_1=15, STAGE_2=40, STAGE_3=75" }
      - { name: status, type: enum, source: system, description: "PROPOSED | EFFECTIVE | LIFTED", default: PROPOSED, constraints: "PROPOSED | EFFECTIVE | LIFTED" }

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: WaterAccount
    initial_state: ACTIVE
    terminal_states: [CLOSED]
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "system (side effect of POST /district/assessment-invoices/{id}/file-lien)"
        actor: system
        preconditions: []
        side_effects:
          - "Blocks new TurnoutOrders and TransferRequests involving this account (cross-entity gate)"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "system (side effect of paying a LIEN_FILED invoice when no other LIEN_FILED invoice remains for the account)"
        actor: system
        preconditions: []
        side_effects:
          - "Lien hold lifted; ordering and transfers permitted again"
      - from: ACTIVE
        to: CLOSED
        trigger: POST /district/water-accounts/{id}/close
        actor: DistrictAdmin
        preconditions:
          - "No TurnoutOrder of this account in {REQUESTED, SCHEDULED, FLOWING} (ERR_INVALID_ACCOUNT_STATE)"
          - "No TransferRequest of this account in {PENDING, APPROVED} (ERR_INVALID_ACCOUNT_STATE)"
        side_effects:
          - "increments WaterAccount.version by 1"
      - from: SUSPENDED
        to: CLOSED
        trigger: POST /district/water-accounts/{id}/close
        actor: DistrictAdmin
        preconditions:
          - "Same as ACTIVE -> CLOSED"
        side_effects:
          - "increments WaterAccount.version by 1"

  - entity: IrrigationSeason
    initial_state: DRAFT
    terminal_states: [CLOSED]
    transitions:
      - from: DRAFT
        to: ANNOUNCED
        trigger: POST /district/seasons/{id}/announce
        actor: DistrictAdmin
        preconditions: []
        side_effects: []
      - from: ANNOUNCED
        to: OPEN
        trigger: POST /district/seasons/{id}/open
        actor: DistrictAdmin
        preconditions: []
        side_effects: []
      - from: OPEN
        to: CLOSED
        trigger: POST /district/seasons/{id}/close
        actor: DistrictAdmin
        preconditions:
          - "No TurnoutOrder in this season is FLOWING (ERR_INVALID_SEASON_STATE)"
        side_effects:
          - "Every TurnoutOrder of the season in {REQUESTED, SCHEDULED} -> CANCELLED, releasing its requested_quantity_af from its SeasonAllocation.committed_af; each such order's non-terminal RiderWorkOrder -> CANCELLED"
          - "Every SeasonAllocation of the season -> CLOSED with carryover_out_af computed (see calc carryover_at_close)"
          - "increments IrrigationSeason.version by 1"

  - entity: SeasonAllocation
    initial_state: ACTIVE
    terminal_states: [CLOSED]
    transitions:
      - from: ACTIVE
        to: CURTAILED
        trigger: "system (side effect of POST /district/drought-declarations/{id}/effectuate)"
        actor: system
        preconditions: []
        side_effects:
          - "curtailed_entitlement_af recomputed per calc curtailed_entitlement; effective_entitlement_af switches to the curtailed value"
      - from: CURTAILED
        to: ACTIVE
        trigger: "system (side effect of POST /district/drought-declarations/{id}/lift)"
        actor: system
        preconditions: []
        side_effects:
          - "effective_entitlement_af restored to base_entitlement_af"
      - from: ACTIVE
        to: CLOSED
        trigger: "system (side effect of POST /district/seasons/{id}/close)"
        actor: system
        preconditions: []
        side_effects:
          - "carryover_out_af computed per calc carryover_at_close"
      - from: CURTAILED
        to: CLOSED
        trigger: "system (side effect of POST /district/seasons/{id}/close)"
        actor: system
        preconditions: []
        side_effects:
          - "carryover_out_af computed per calc carryover_at_close (against the curtailed effective entitlement)"

  - entity: TurnoutOrder
    initial_state: REQUESTED
    terminal_states: [DELIVERED, CANCELLED, REJECTED]
    transitions:
      - from: REQUESTED
        to: SCHEDULED
        trigger: POST /district/turnout-orders/{id}/schedule
        actor: DistrictAdmin
        preconditions:
          - "WaterAccount.status == ACTIVE (ERR_ACCOUNT_NOT_ACTIVE)"
          - "IrrigationSeason of the allocation is OPEN (ERR_SEASON_NOT_OPEN)"
          - "No PLANNED/ACTIVE MaintenanceWindow on canal_reach_id overlaps [requested_start_at, requested_end_at) (ERR_WINDOW_TIME_CONFLICT)"
          - "CanalReach aggregate capacity: at every instant of the window, sum of requested_cfs over this reach's other SCHEDULED/FLOWING orders overlapping that instant + this order's requested_cfs <= max_capacity_cfs (ERR_REACH_CAPACITY_EXCEEDED)"
          - "Account turnaround: no other non-terminal (REQUESTED/SCHEDULED/FLOWING) order of the same account overlaps, and the gap to every adjacent such order is >= TURNAROUND_MIN_GAP_HOURS (ERR_ORDER_TURNAROUND_CONFLICT)"
        side_effects:
          - "Creates RiderWorkOrder { turnout_order_id = this order, rider_user_id from input, status ASSIGNED }"
      - from: REQUESTED
        to: REJECTED
        trigger: POST /district/turnout-orders/{id}/reject
        actor: DistrictAdmin
        preconditions: []
        side_effects:
          - "requested_quantity_af released from SeasonAllocation.committed_af"
      - from: REQUESTED
        to: CANCELLED
        trigger: POST /district/turnout-orders/{id}/cancel
        actor: DistrictAdmin | WaterUser (owner)
        preconditions: []
        side_effects:
          - "requested_quantity_af released from SeasonAllocation.committed_af"
      - from: SCHEDULED
        to: CANCELLED
        trigger: POST /district/turnout-orders/{id}/cancel
        actor: DistrictAdmin | WaterUser (owner)
        preconditions: []
        side_effects:
          - "requested_quantity_af released from SeasonAllocation.committed_af"
          - "Linked RiderWorkOrder in {ASSIGNED, IN_PROGRESS} -> CANCELLED"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "system (maintenance-window activation, drought curtailment cascade, or season close)"
        actor: system
        preconditions: []
        side_effects:
          - "requested_quantity_af released from SeasonAllocation.committed_af"
          - "Linked RiderWorkOrder in {ASSIGNED, IN_PROGRESS} -> CANCELLED"
      - from: SCHEDULED
        to: FLOWING
        trigger: POST /district/turnout-orders/{id}/start
        actor: DitchRider (assigned rider of the linked work order)
        preconditions:
          - "Caller X-User-ID == linked RiderWorkOrder.rider_user_id (ERR_FORBIDDEN)"
          - "CanalReach.status == IN_SERVICE (ERR_INVALID_ORDER_STATE)"
          - "Logical clock within [requested_start_at, requested_end_at) (ERR_OUTSIDE_DELIVERY_WINDOW)"
        side_effects:
          - "Linked RiderWorkOrder ASSIGNED -> IN_PROGRESS"
      - from: FLOWING
        to: DELIVERED
        trigger: "system (side effect of POST /district/rider-work-orders/{id}/verify)"
        actor: system
        preconditions: []
        side_effects:
          - "actual_delivered_af := work order measured_af; over_delivered := (measured_af > requested_quantity_af)"
          - "SeasonAllocation.delivered_af += measured_af; SeasonAllocation.committed_af -= requested_quantity_af"

  - entity: RiderWorkOrder
    initial_state: ASSIGNED
    terminal_states: [VERIFIED, CANCELLED]
    transitions:
      - from: ASSIGNED
        to: IN_PROGRESS
        trigger: "system (side effect of POST /district/turnout-orders/{id}/start)"
        actor: system
        preconditions: []
        side_effects: []
      - from: IN_PROGRESS
        to: MEASUREMENT_SUBMITTED
        trigger: POST /district/rider-work-orders/{id}/submit-measurement
        actor: DitchRider (assignee)
        preconditions:
          - "Caller X-User-ID == rider_user_id (ERR_FORBIDDEN)"
        side_effects:
          - "measured_af computed and stored"
      - from: MEASUREMENT_SUBMITTED
        to: VERIFIED
        trigger: POST /district/rider-work-orders/{id}/verify
        actor: DistrictAdmin
        preconditions: []
        side_effects:
          - "TurnoutOrder FLOWING -> DELIVERED (posting measured_af to SeasonAllocation.delivered_af and releasing committed_af)"
      - from: MEASUREMENT_SUBMITTED
        to: IN_PROGRESS
        trigger: POST /district/rider-work-orders/{id}/return
        actor: DistrictAdmin
        preconditions: []
        side_effects:
          - "measured_cfs, measured_hours, measured_af cleared to null; return_reason stored; linked TurnoutOrder remains FLOWING"
      - from: ASSIGNED
        to: CANCELLED
        trigger: "system (order cancellation cascade)"
        actor: system
        preconditions: []
        side_effects: []
      - from: IN_PROGRESS
        to: CANCELLED
        trigger: "system (order cancellation cascade)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: AssessmentInvoice
    initial_state: DRAFT
    terminal_states: [PAID]
    transitions:
      - from: DRAFT
        to: ISSUED
        trigger: POST /district/assessment-invoices/{id}/issue
        actor: DistrictAdmin
        preconditions: []
        side_effects:
          - "issued_at := logical clock; due_date stored from input"
      - from: ISSUED
        to: DELINQUENT
        trigger: POST /district/seasons/{id}/run-delinquency-sweep (batch; flips every ISSUED invoice of the season whose clock > due_date + GRACE_DAYS, strict >)
        actor: DistrictAdmin
        preconditions: []
        side_effects:
          - "penalty_line_amount := round(LATE_PENALTY_PCT% * (acreage_line_amount + toll_line_amount), 2); total_amount recomputed as sum of rounded lines"
      - from: ISSUED
        to: PAID
        trigger: POST /district/assessment-invoices/{id}/pay
        actor: WaterUser (owner)
        preconditions:
          - "Caller X-User-ID == invoice.water_account_id (ERR_FORBIDDEN)"
        side_effects:
          - "paid_at := logical clock"
      - from: DELINQUENT
        to: PAID
        trigger: POST /district/assessment-invoices/{id}/pay
        actor: WaterUser (owner)
        preconditions:
          - "Caller X-User-ID == invoice.water_account_id (ERR_FORBIDDEN)"
        side_effects:
          - "paid_at := logical clock"
      - from: DELINQUENT
        to: LIEN_FILED
        trigger: POST /district/assessment-invoices/{id}/file-lien
        actor: DistrictAdmin
        preconditions: []
        side_effects:
          - "WaterAccount.status -> SUSPENDED; increments WaterAccount.version by 1"
      - from: LIEN_FILED
        to: PAID
        trigger: POST /district/assessment-invoices/{id}/pay
        actor: WaterUser (owner)
        preconditions:
          - "Caller X-User-ID == invoice.water_account_id (ERR_FORBIDDEN)"
        side_effects:
          - "paid_at := logical clock"
          - "Lien released: if no other LIEN_FILED invoice remains for the account, WaterAccount.status -> ACTIVE; increments WaterAccount.version by 1"

  - entity: CanalReach
    initial_state: IN_SERVICE
    terminal_states: []
    transitions:
      - from: IN_SERVICE
        to: SHUTDOWN
        trigger: "system (side effect of POST /district/maintenance-windows/{id}/activate)"
        actor: system
        preconditions: []
        side_effects: []
      - from: SHUTDOWN
        to: IN_SERVICE
        trigger: "system (side effect of POST /district/maintenance-windows/{id}/complete when no other ACTIVE window remains on the reach)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: MaintenanceWindow
    initial_state: PLANNED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: PLANNED
        to: ACTIVE
        trigger: POST /district/maintenance-windows/{id}/activate
        actor: DistrictAdmin
        preconditions:
          - "Logical clock within [start_at, end_at) (ERR_WINDOW_OUT_OF_PERIOD)"
        side_effects:
          - "CanalReach.status -> SHUTDOWN"
          - "Every SCHEDULED TurnoutOrder with canal_reach_id == this reach whose [requested_start_at, requested_end_at) overlaps the window -> CANCELLED (because the reach is SHUTDOWN); each cancellation releases requested_quantity_af from its SeasonAllocation.committed_af and cancels the order's non-terminal RiderWorkOrder"
      - from: ACTIVE
        to: COMPLETED
        trigger: POST /district/maintenance-windows/{id}/complete
        actor: DistrictAdmin
        preconditions: []
        side_effects:
          - "CanalReach.status -> IN_SERVICE if no other ACTIVE MaintenanceWindow exists on the reach"
      - from: PLANNED
        to: CANCELLED
        trigger: POST /district/maintenance-windows/{id}/cancel
        actor: DistrictAdmin
        preconditions: []
        side_effects: []

  - entity: TransferRequest
    initial_state: PENDING
    terminal_states: [POSTED, REJECTED, CANCELLED]
    transitions:
      - from: PENDING
        to: APPROVED
        trigger: POST /district/transfer-requests/{id}/approve
        actor: DistrictAdmin
        preconditions:
          - "Both accounts ACTIVE (ERR_ACCOUNT_NOT_ACTIVE)"
          - "Season OPEN (ERR_SEASON_NOT_OPEN)"
          - "No EFFECTIVE DroughtDeclaration on the season (ERR_TRANSFER_BLOCKED_DROUGHT)"
          - "Source allocation available_af >= quantity_af (ERR_INSUFFICIENT_ALLOCATION)"
        side_effects: []
      - from: APPROVED
        to: POSTED
        trigger: POST /district/transfer-requests/{id}/post
        actor: DistrictAdmin
        preconditions:
          - "Both accounts still ACTIVE (ERR_ACCOUNT_NOT_ACTIVE)"
          - "No EFFECTIVE DroughtDeclaration on the season (ERR_TRANSFER_BLOCKED_DROUGHT)"
          - "Source allocation available_af still >= quantity_af, re-evaluated at post time (ERR_INSUFFICIENT_ALLOCATION)"
        side_effects:
          - "Source SeasonAllocation.transfers_out_af += quantity_af; destination SeasonAllocation.transfers_in_af += quantity_af; increments both SeasonAllocation.version by 1"
      - from: PENDING
        to: REJECTED
        trigger: POST /district/transfer-requests/{id}/reject
        actor: DistrictAdmin
        preconditions: []
        side_effects: []
      - from: APPROVED
        to: REJECTED
        trigger: POST /district/transfer-requests/{id}/reject
        actor: DistrictAdmin
        preconditions: []
        side_effects: []
      - from: PENDING
        to: CANCELLED
        trigger: POST /district/transfer-requests/{id}/cancel
        actor: WaterUser (owner of from_account_id)
        preconditions:
          - "Caller X-User-ID == from_account_id (ERR_FORBIDDEN)"
        side_effects: []
      - from: APPROVED
        to: CANCELLED
        trigger: POST /district/transfer-requests/{id}/cancel
        actor: WaterUser (owner of from_account_id)
        preconditions:
          - "Caller X-User-ID == from_account_id (ERR_FORBIDDEN)"
        side_effects: []

  - entity: DroughtDeclaration
    initial_state: PROPOSED
    terminal_states: [LIFTED]
    transitions:
      - from: PROPOSED
        to: EFFECTIVE
        trigger: POST /district/drought-declarations/{id}/effectuate
        actor: DistrictAdmin
        preconditions:
          - "Season status == OPEN (ERR_SEASON_NOT_OPEN)"
          - "No other EFFECTIVE DroughtDeclaration exists on the season (ERR_INVALID_DROUGHT_STATE)"
        side_effects:
          - "Every SeasonAllocation of the season: curtailed_entitlement_af computed from priority_class, status -> CURTAILED"
          - "For each allocation whose committed_af now exceeds its recomputed available_af: cancel its TurnoutOrders in {REQUESTED, SCHEDULED} in descending requested_start_at order (tie-break: created_at DESC) until committed_af <= available_af; each cancelled order releases committed_af and cascades CANCELLED to its non-terminal RiderWorkOrder"
      - from: EFFECTIVE
        to: LIFTED
        trigger: POST /district/drought-declarations/{id}/lift
        actor: DistrictAdmin
        preconditions: []
        side_effects:
          - "Every CURTAILED SeasonAllocation of the season: effective_entitlement_af restored to base_entitlement_af, status -> ACTIVE; cancelled orders are NOT resurrected"

# =============================================================================
# 1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: order-create-stale-account
    parent_entity: WaterAccount
    write_endpoint: "POST /district/turnout-orders"
    occ_field: expected_water_account_version
    description: |
      Creating a TurnoutOrder against a WaterAccount whose version has advanced
      since the client last observed it is rejected. This captures the case where
      another writer has just created an order (which legitimately commits water
      under the available-balance rule) or a lien transition has touched the
      account, and the current writer's view of the account is therefore stale.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: transfer-create-stale-allocation
    parent_entity: SeasonAllocation
    write_endpoint: "POST /district/transfer-requests"
    occ_field: expected_source_allocation_version
    description: |
      Creating a TransferRequest against a source SeasonAllocation whose version
      has advanced since the client last observed it is rejected. This captures
      the case where another writer has just created a transfer or an order
      against the same allocation and the current writer's view of its
      committed/available balances is therefore stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: order_quantity
    trigger: "POST /district/turnout-orders (at creation)"
    algorithm: aggregation
    formula: |
      window_hours = (requested_end_at - requested_start_at) / 3600 seconds
      requested_quantity_af = round_half_up(requested_cfs * window_hours * AF_PER_CFS_HOUR, 2)
    input_set: "The single new TurnoutOrder's requested_cfs and requested window"
    constants:
      AF_PER_CFS_HOUR: 0.0826
    precision: "2 decimal places, round_half_up"

  - name: measured_delivery
    trigger: "POST /district/rider-work-orders/{id}/submit-measurement"
    algorithm: aggregation
    formula: |
      measured_af = round_half_up(measured_cfs * measured_hours * AF_PER_CFS_HOUR, 2)
    input_set: "The work order's submitted measured_cfs and measured_hours"
    constants:
      AF_PER_CFS_HOUR: 0.0826
    precision: "2 decimal places, round_half_up"

  - name: base_entitlement
    trigger: "POST /district/season-allocations (at creation)"
    algorithm: aggregation
    formula: |
      base_entitlement_af = round_half_up(WaterAccount.irrigated_acres * IrrigationSeason.announced_af_per_acre, 2)
    input_set: "The account's irrigated_acres and the season's announced_af_per_acre"
    constants: {}
    precision: "2 decimal places, round_half_up"

  - name: available_balance
    trigger: "Recomputed on every mutation touching the allocation (order create/cancel/reject/verify, transfer post, drought effectuate/lift, account acreage change)"
    algorithm: aggregation
    formula: |
      committed_af = sum of requested_quantity_af over the allocation's TurnoutOrders with status IN {REQUESTED, SCHEDULED, FLOWING}
      delivered_af = sum of measured_af over VERIFIED RiderWorkOrders of this allocation's DELIVERED orders
      available_af = effective_entitlement_af + carryover_in_af + transfers_in_af - transfers_out_af - delivered_af - committed_af
      over_allocated_af = max(0, delivered_af - (effective_entitlement_af + carryover_in_af + transfers_in_af - transfers_out_af))
    input_set: "Orders restricted to status IN {REQUESTED, SCHEDULED, FLOWING} for committed_af; only VERIFIED measurements count toward delivered_af"
    constants: {}
    precision: "2 decimal places, round_half_up"
    variants:
      - name: net_of_committed
        when: "Order creation, order scheduling, and transfer approval/posting balance checks"
        difference: "Subtracts committed_af (reserved but undelivered water) from the balance"
      - name: delivered_only
        when: "Carryover computation at season close (calc carryover_at_close)"
        difference: "Ignores committed_af entirely; unused water is entitlement net of measured deliveries only, so a season with a pending order reports a larger unused balance than the net_of_committed reading for identical data"

  - name: carryover_at_close
    trigger: "POST /district/seasons/{id}/close (per allocation) and POST /district/season-allocations (carryover_in_af of a new allocation, read from the prior CLOSED allocation)"
    algorithm: threshold
    formula: |
      settled_unused = max(0, effective_entitlement_af + carryover_in_af + transfers_in_af - transfers_out_af - delivered_af)
      cap = round_half_up(base_entitlement_af * IrrigationSeason.carryover_cap_pct / 100, 2)
      if delivered_af > (effective_entitlement_af + carryover_in_af + transfers_in_af - transfers_out_af):
          carryover_out_af = 0.00            # over-allocated accounts forfeit carryover
      else:
          carryover_out_af = min(settled_unused, cap)   # unused == cap yields exactly cap (inclusive)
    input_set: "The allocation being closed; for carryover_in_af, the account's allocation in the most recent CLOSED season (max year less than the new season's year); 0.00 when none exists"
    constants: {}
    precision: "2 decimal places, round_half_up"

  - name: curtailed_entitlement
    trigger: "POST /district/drought-declarations/{id}/effectuate"
    algorithm: constraint_propagation
    formula: |
      pct = junior_curtailment_pct if WaterAccount.priority_class == JUNIOR else senior_curtailment_pct
      curtailed_entitlement_af = round_half_up(base_entitlement_af * (1 - pct / 100), 2)
    input_set: "Every SeasonAllocation of the drought declaration's season; priority class derives from WaterAccount.water_right_priority_date vs PRIORITY_CUT_DATE"
    constants:
      PRIORITY_CUT_DATE: "1914-12-31"
      STAGE_1: { senior: 0, junior: 15 }
      STAGE_2: { senior: 10, junior: 40 }
      STAGE_3: { senior: 25, junior: 75 }
    precision: "2 decimal places, round_half_up"

  - name: water_toll
    trigger: "POST /district/assessment-invoices (when billing_method_snapshot == PER_AF_DELIVERED)"
    algorithm: tiered_pricing
    formula: |
      d = SeasonAllocation.delivered_af (season-to-date at invoice creation)
      entitled_pool = effective_entitlement_af + carryover_in_af + transfers_in_af - transfers_out_af
      tier1_af = min(d, toll_tier1_cap_af)
      tier2_af = max(0, d - toll_tier1_cap_af)
      over_af = max(0, d - entitled_pool)
      toll = toll_tier1_rate_per_af * tier1_af + toll_tier2_rate_per_af * tier2_af + overage_rate_per_af * over_af
      toll_line_amount = round_half_up(toll, 2)
    input_set: "The account's SeasonAllocation for the invoice's season (VERIFIED deliveries only); season toll rates and caps"
    constants: {}
    precision: "2 decimal places, round_half_up"

  - name: assessment_total
    trigger: "POST /district/assessment-invoices (creation) and delinquency sweep (penalty recompute)"
    algorithm: tiered_pricing
    formula: |
      if billing_method_snapshot == PER_ACRE:
          acreage_line_amount = round_half_up(irrigated_acres * assessment_rate_per_acre, 2)
          toll_line_amount = 0.00
      else:  # PER_AF_DELIVERED
          acreage_line_amount = 0.00
          toll_line_amount = water_toll result, rounded to cents
      # Rounding order is pinned: each line is rounded half-up to cents FIRST,
      # then penalty and total are computed from the ROUNDED lines.
      penalty_line_amount = round_half_up(LATE_PENALTY_PCT / 100 * (acreage_line_amount + toll_line_amount), 2) when DELINQUENT/LIEN_FILED else 0.00
      total_amount = acreage_line_amount + toll_line_amount + penalty_line_amount
    input_set: "The account and its SeasonAllocation for the season"
    constants:
      LATE_PENALTY_PCT: 10
    precision: "2 decimal places, round_half_up; round per line item, then sum"
    variants:
      - name: per_acre
        when: "Season billing_method == PER_ACRE"
        difference: "Bills irrigated acreage only; identical water usage data yields a different total than per_af_delivered"
      - name: per_af_delivered
        when: "Season billing_method == PER_AF_DELIVERED"
        difference: "Bills measured deliveries through the tiered toll only; identical acreage data yields a different total than per_acre"

  - name: delinquency_determination
    trigger: "POST /district/seasons/{id}/run-delinquency-sweep"
    algorithm: threshold
    formula: |
      for each AssessmentInvoice of the season with status == ISSUED:
          if logical_clock > due_date + GRACE_DAYS days:   # strictly greater; equality stays ISSUED
              flip to DELINQUENT and recompute penalty per assessment_total
    input_set: "ISSUED invoices of the season only (DRAFT/PAID/LIEN_FILED excluded)"
    constants:
      GRACE_DAYS: 10
    precision: "timestamps compared to the second"

  - name: turnaround_gap_check
    trigger: "POST /district/turnout-orders and POST /district/turnout-orders/{id}/schedule"
    algorithm: interval_merge
    formula: |
      for every other TurnoutOrder of the same account with status IN {REQUESTED, SCHEDULED, FLOWING}:
          reject if [new_start, new_end) overlaps [other_start, other_end)
          reject if the gap between the two windows is < TURNAROUND_MIN_GAP_HOURS hours
      # a gap of exactly TURNAROUND_MIN_GAP_HOURS hours is allowed (>= boundary)
    input_set: "Non-terminal orders of the same WaterAccount, across all reaches"
    constants:
      TURNAROUND_MIN_GAP_HOURS: 6
    precision: "intervals compared to the second"

  - name: window_overlap_check
    trigger: "POST /district/maintenance-windows"
    algorithm: interval_merge
    formula: |
      for every MaintenanceWindow on the same CanalReach with status IN {PLANNED, ACTIVE}:
          reject if [new_start_at, new_end_at) overlaps [existing_start_at, existing_end_at)
      # half-open semantics: new_start_at == existing_end_at (or vice versa) is adjacent, NOT overlap
    input_set: "PLANNED/ACTIVE windows of the same reach only (COMPLETED/CANCELLED ignored)"
    constants: {}
    precision: "intervals compared to the second"

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present; X-User-Role is a declared role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all
  - priority: 2
    category: existence
    check: "Request body shape: required fields present, types valid, enum values in range, numbers positive where constrained, end timestamps strictly after start timestamps"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all
  - priority: 3
    category: auth
    check: "Role permitted for the endpoint per §1.5 roles; ownership: WaterUser caller X-User-ID must equal the referenced account id (turnout-orders create/cancel, transfer create/cancel from_account_id, invoice pay); DitchRider caller X-User-ID must equal the work order's rider_user_id (start, submit-measurement)"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: all
  - priority: 4
    category: existence
    check: "Referenced resources exist: path ids left-to-right, then body FK fields in declared input order"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all
  - priority: 5
    category: state
    check: "OCC: expected_water_account_version == current WaterAccount.version on POST /district/turnout-orders; expected_source_allocation_version == current source SeasonAllocation.version on POST /district/transfer-requests"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: ["POST /district/turnout-orders", "POST /district/transfer-requests"]
  - priority: 6
    category: state
    check: "Target entity in a valid from-state for the transition; cross-entity: WaterAccount.status == ACTIVE for order create/schedule and transfer create/approve/post; IrrigationSeason OPEN for order create/schedule, transfer create/approve/post, drought effectuate (ANNOUNCED or OPEN for allocation creation); CanalReach IN_SERVICE for order start"
    error_id: ERR_ACCOUNT_NOT_ACTIVE | ERR_SEASON_NOT_OPEN | ERR_INVALID_*_STATE
    http_status: 409
    applies_to: all action endpoints
  - priority: 7
    category: business_safety
    check: "Drought freeze: no EFFECTIVE DroughtDeclaration on the season when creating/approving/posting a TransferRequest"
    error_id: ERR_TRANSFER_BLOCKED_DROUGHT
    http_status: 409
    applies_to: ["POST /district/transfer-requests", "POST /district/transfer-requests/{id}/approve", "POST /district/transfer-requests/{id}/post"]
  - priority: 8
    category: business_temporal
    check: "Temporal rules, checked in this sub-order: (a) order window vs PLANNED/ACTIVE MaintenanceWindows on the reach (ERR_WINDOW_TIME_CONFLICT); (b) account turnaround gap vs the account's non-terminal orders (ERR_ORDER_TURNAROUND_CONFLICT); (c) maintenance-window activation requires clock inside [start_at, end_at) (ERR_WINDOW_OUT_OF_PERIOD); (d) order start requires clock inside [requested_start_at, requested_end_at) (ERR_OUTSIDE_DELIVERY_WINDOW); (e) new window vs existing PLANNED/ACTIVE windows on the reach (ERR_WINDOW_OVERLAP)"
    error_id: ERR_WINDOW_TIME_CONFLICT | ERR_ORDER_TURNAROUND_CONFLICT | ERR_WINDOW_OUT_OF_PERIOD | ERR_OUTSIDE_DELIVERY_WINDOW | ERR_WINDOW_OVERLAP
    http_status: 422
    applies_to: ["POST /district/turnout-orders", "POST /district/turnout-orders/{id}/schedule", "POST /district/turnout-orders/{id}/start", "POST /district/maintenance-windows", "POST /district/maintenance-windows/{id}/activate"]
  - priority: 9
    category: business_constraint
    check: "Uniqueness: season year (ERR_DUPLICATE_SEASON_YEAR), one allocation per (account, season) (ERR_DUPLICATE_ALLOCATION), one invoice per (account, season) (ERR_DUPLICATE_INVOICE); reach aggregate capacity at every instant of a scheduling order's window (ERR_REACH_CAPACITY_EXCEEDED); transfer to_account_id != from_account_id is a shape rule under priority 2"
    error_id: ERR_DUPLICATE_SEASON_YEAR | ERR_DUPLICATE_ALLOCATION | ERR_DUPLICATE_INVOICE | ERR_REACH_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: ["POST /district/seasons", "POST /district/season-allocations", "POST /district/assessment-invoices", "POST /district/turnout-orders/{id}/schedule"]
  - priority: 10
    category: business_fiscal
    check: "Sufficient water: requested_quantity_af <= available_af on order creation (net_of_committed reading); quantity_af <= source available_af on transfer create/approve/post"
    error_id: ERR_INSUFFICIENT_ALLOCATION
    http_status: 422
    applies_to: ["POST /district/turnout-orders", "POST /district/transfer-requests", "POST /district/transfer-requests/{id}/approve", "POST /district/transfer-requests/{id}/post"]

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server's logical clock (test-driving). Startup default is exactly 2026-08-01T00:00:00Z before any call; the clock never falls back to wall-clock time."
    roles: [DistrictAdmin]
    code: 200
    input: [to_iso8601]
    output: { current_utc: datetime }
    side_effects: ["logical clock advanced to to_iso8601"]

  - method: POST
    path: "/district/water-accounts"
    description: "Create a water account (landowner/user) with its water-right priority date"
    roles: [DistrictAdmin]
    code: 201
    input: [holder_name, parcel_number, irrigated_acres, water_right_priority_date]
    output: WaterAccount
    side_effects: ["status := ACTIVE", "priority_class computed from priority date vs PRIORITY_CUT_DATE"]

  - method: GET
    path: "/district/water-accounts"
    description: "List water accounts"
    roles: [DistrictAdmin, WaterUser, DitchRider]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "WaterAccount[]"
    side_effects: []

  - method: GET
    path: "/district/water-accounts/{id}"
    description: "Get one water account"
    roles: [DistrictAdmin, WaterUser, DitchRider]
    code: 200
    input: []
    output: WaterAccount
    side_effects: []

  - method: POST
    path: "/district/water-accounts/{id}/close"
    description: "Close an account (ACTIVE/SUSPENDED -> CLOSED, terminal)"
    roles: [DistrictAdmin]
    code: 200
    input: []
    output: WaterAccount
    side_effects: ["status := CLOSED", "increments WaterAccount.version by 1"]

  - method: POST
    path: "/district/seasons"
    description: "Create an irrigation season with announced allocation and billing configuration"
    roles: [DistrictAdmin]
    code: 201
    input: [year, announced_af_per_acre, carryover_cap_pct, billing_method, assessment_rate_per_acre, toll_tier1_cap_af, toll_tier1_rate_per_af, toll_tier2_rate_per_af, overage_rate_per_af, start_date, end_date]
    output: IrrigationSeason
    side_effects: ["status := DRAFT"]

  - method: GET
    path: "/district/seasons"
    description: "List irrigation seasons"
    roles: [DistrictAdmin, WaterUser, DitchRider]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "IrrigationSeason[]"
    side_effects: []

  - method: GET
    path: "/district/seasons/{id}"
    description: "Get one irrigation season"
    roles: [DistrictAdmin, WaterUser, DitchRider]
    code: 200
    input: []
    output: IrrigationSeason
    side_effects: []

  - method: POST
    path: "/district/seasons/{id}/announce"
    description: "Announce the season allocation (DRAFT -> ANNOUNCED); allocations may be created from ANNOUNCED"
    roles: [DistrictAdmin]
    code: 200
    input: []
    output: IrrigationSeason
    side_effects: ["status := ANNOUNCED", "increments IrrigationSeason.version by 1"]

  - method: POST
    path: "/district/seasons/{id}/open"
    description: "Open the season for ordering (ANNOUNCED -> OPEN)"
    roles: [DistrictAdmin]
    code: 200
    input: []
    output: IrrigationSeason
    side_effects: ["status := OPEN", "increments IrrigationSeason.version by 1"]

  - method: POST
    path: "/district/seasons/{id}/close"
    description: "Close the season: cancels non-terminal orders and work orders, closes allocations with carryover_out_af"
    roles: [DistrictAdmin]
    code: 200
    input: []
    output: IrrigationSeason
    side_effects: ["non-terminal orders -> CANCELLED with committed_af release", "their work orders -> CANCELLED", "allocations -> CLOSED with carryover_out_af computed", "status := CLOSED", "increments IrrigationSeason.version by 1"]

  - method: POST
    path: "/district/seasons/{id}/run-delinquency-sweep"
    description: "Batch: flip ISSUED invoices of the season whose clock > due_date + GRACE_DAYS to DELINQUENT and apply the penalty line"
    roles: [DistrictAdmin]
    code: 200
    input: []
    output: { swept_count: integer, delinquent_invoice_ids: array }
    side_effects: ["qualifying invoices -> DELINQUENT with penalty_line_amount and total_amount recomputed"]

  - method: POST
    path: "/district/season-allocations"
    description: "Create a season allocation for an account; computes base entitlement and carryover_in_af from the most recent CLOSED prior-season allocation"
    roles: [DistrictAdmin]
    code: 201
    input: [water_account_id, season_id]
    output: SeasonAllocation
    side_effects: ["base_entitlement_af computed", "carryover_in_af computed (0.00 if no prior CLOSED allocation)", "status := ACTIVE"]

  - method: GET
    path: "/district/season-allocations"
    description: "List season allocations"
    roles: [DistrictAdmin, WaterUser, DitchRider]
    code: 200
    input: ["water_account_id?", "season_id?", "status?", "limit?", "offset?"]
    output: "SeasonAllocation[]"
    side_effects: []

  - method: GET
    path: "/district/season-allocations/{id}"
    description: "Get one season allocation"
    roles: [DistrictAdmin, WaterUser, DitchRider]
    code: 200
    input: []
    output: SeasonAllocation
    side_effects: []

  - method: POST
    path: "/district/turnout-orders"
    description: "Place a water order; computes requested_quantity_af and commits it against the allocation (OCC on the account)"
    roles: [WaterUser]
    code: 201
    input: [water_account_id, season_allocation_id, canal_reach_id, requested_cfs, requested_start_at, requested_end_at, expected_water_account_version]
    output: TurnoutOrder
    side_effects: ["requested_quantity_af computed", "SeasonAllocation.committed_af += requested_quantity_af", "increments WaterAccount.version by 1", "status := REQUESTED"]

  - method: GET
    path: "/district/turnout-orders"
    description: "List turnout orders"
    roles: [DistrictAdmin, WaterUser, DitchRider]
    code: 200
    input: ["water_account_id?", "season_allocation_id?", "canal_reach_id?", "status?", "limit?", "offset?"]
    output: "TurnoutOrder[]"
    side_effects: []

  - method: GET
    path: "/district/turnout-orders/{id}"
    description: "Get one turnout order"
    roles: [DistrictAdmin, WaterUser, DitchRider]
    code: 200
    input: []
    output: TurnoutOrder
    side_effects: []

  - method: POST
    path: "/district/turnout-orders/{id}/schedule"
    description: "Schedule a REQUESTED order onto the rotation; creates the ditch-rider work order"
    roles: [DistrictAdmin]
    code: 200
    input: [rider_user_id]
    output: TurnoutOrder
    side_effects: ["status := SCHEDULED", "RiderWorkOrder created ASSIGNED to rider_user_id"]

  - method: POST
    path: "/district/turnout-orders/{id}/reject"
    description: "Reject a REQUESTED order, releasing its committed water"
    roles: [DistrictAdmin]
    code: 200
    input: []
    output: TurnoutOrder
    side_effects: ["status := REJECTED", "SeasonAllocation.committed_af -= requested_quantity_af"]

  - method: POST
    path: "/district/turnout-orders/{id}/cancel"
    description: "Cancel a REQUESTED or SCHEDULED order, releasing committed water and cancelling its work order"
    roles: [DistrictAdmin, WaterUser]
    code: 200
    input: []
    output: TurnoutOrder
    side_effects: ["status := CANCELLED", "SeasonAllocation.committed_af -= requested_quantity_af", "linked non-terminal RiderWorkOrder -> CANCELLED"]

  - method: POST
    path: "/district/turnout-orders/{id}/start"
    description: "Assigned rider opens the turnout (SCHEDULED -> FLOWING); work order goes IN_PROGRESS"
    roles: [DitchRider]
    code: 200
    input: []
    output: TurnoutOrder
    side_effects: ["status := FLOWING", "linked RiderWorkOrder ASSIGNED -> IN_PROGRESS"]

  - method: GET
    path: "/district/rider-work-orders"
    description: "List rider work orders"
    roles: [DistrictAdmin, DitchRider]
    code: 200
    input: ["turnout_order_id?", "rider_user_id?", "status?", "limit?", "offset?"]
    output: "RiderWorkOrder[]"
    side_effects: []

  - method: GET
    path: "/district/rider-work-orders/{id}"
    description: "Get one rider work order"
    roles: [DistrictAdmin, DitchRider]
    code: 200
    input: []
    output: RiderWorkOrder
    side_effects: []

  - method: POST
    path: "/district/rider-work-orders/{id}/submit-measurement"
    description: "Assigned rider submits the turnout measurement (IN_PROGRESS -> MEASUREMENT_SUBMITTED)"
    roles: [DitchRider]
    code: 200
    input: [measured_cfs, measured_hours]
    output: RiderWorkOrder
    side_effects: ["measured_af computed and stored", "status := MEASUREMENT_SUBMITTED"]

  - method: POST
    path: "/district/rider-work-orders/{id}/verify"
    description: "District verifies a submitted measurement; delivers the order and posts measured water to the allocation"
    roles: [DistrictAdmin]
    code: 200
    input: []
    output: RiderWorkOrder
    side_effects: ["status := VERIFIED", "TurnoutOrder FLOWING -> DELIVERED with actual_delivered_af := measured_af", "SeasonAllocation.delivered_af += measured_af", "SeasonAllocation.committed_af -= requested_quantity_af"]

  - method: POST
    path: "/district/rider-work-orders/{id}/return"
    description: "Return a submitted measurement for rework (MEASUREMENT_SUBMITTED -> IN_PROGRESS); clears measured values"
    roles: [DistrictAdmin]
    code: 200
    input: [return_reason]
    output: RiderWorkOrder
    side_effects: ["status := ASSIGNED", "measured_cfs/measured_hours/measured_af cleared to null", "return_reason stored", "linked TurnoutOrder remains FLOWING"]

  - method: POST
    path: "/district/assessment-invoices"
    description: "Create the season's assessment invoice for an account (DRAFT) using the season's billing method"
    roles: [DistrictAdmin]
    code: 201
    input: [water_account_id, season_id]
    output: AssessmentInvoice
    side_effects: ["billing_method_snapshot copied from season", "acreage/toll lines computed per assessment_total", "status := DRAFT"]

  - method: GET
    path: "/district/assessment-invoices"
    description: "List assessment invoices"
    roles: [DistrictAdmin, WaterUser]
    code: 200
    input: ["water_account_id?", "season_id?", "status?", "limit?", "offset?"]
    output: "AssessmentInvoice[]"
    side_effects: []

  - method: GET
    path: "/district/assessment-invoices/{id}"
    description: "Get one assessment invoice"
    roles: [DistrictAdmin, WaterUser]
    code: 200
    input: []
    output: AssessmentInvoice
    side_effects: []

  - method: POST
    path: "/district/assessment-invoices/{id}/issue"
    description: "Issue a DRAFT invoice; stamps issued_at from the logical clock and stores due_date"
    roles: [DistrictAdmin]
    code: 200
    input: [due_date]
    output: AssessmentInvoice
    side_effects: ["status := ISSUED", "issued_at := logical clock", "due_date stored"]

  - method: POST
    path: "/district/assessment-invoices/{id}/pay"
    description: "Pay an invoice in full from ISSUED, DELINQUENT, or LIEN_FILED; paying a liened invoice releases the lien hold"
    roles: [WaterUser]
    code: 200
    input: []
    output: AssessmentInvoice
    side_effects: ["status := PAID", "paid_at := logical clock", "if prior status was LIEN_FILED and no other LIEN_FILED invoice remains for the account: WaterAccount.status -> ACTIVE and WaterAccount.version += 1"]

  - method: POST
    path: "/district/assessment-invoices/{id}/file-lien"
    description: "File a lien on a DELINQUENT invoice; suspends the account"
    roles: [DistrictAdmin]
    code: 200
    input: []
    output: AssessmentInvoice
    side_effects: ["status := LIEN_FILED", "WaterAccount.status -> SUSPENDED", "increments WaterAccount.version by 1"]

  - method: POST
    path: "/district/canal-reaches"
    description: "Create a canal reach with its maximum carrying capacity"
    roles: [DistrictAdmin]
    code: 201
    input: [name, max_capacity_cfs]
    output: CanalReach
    side_effects: ["status := IN_SERVICE"]

  - method: GET
    path: "/district/canal-reaches"
    description: "List canal reaches"
    roles: [DistrictAdmin, WaterUser, DitchRider]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "CanalReach[]"
    side_effects: []

  - method: GET
    path: "/district/canal-reaches/{id}"
    description: "Get one canal reach"
    roles: [DistrictAdmin, WaterUser, DitchRider]
    code: 200
    input: []
    output: CanalReach
    side_effects: []

  - method: POST
    path: "/district/maintenance-windows"
    description: "Plan a maintenance shutdown window on a reach; half-open overlap with PLANNED/ACTIVE windows on the same reach is rejected"
    roles: [DistrictAdmin]
    code: 201
    input: [canal_reach_id, start_at, end_at, "reason?"]
    output: MaintenanceWindow
    side_effects: ["status := PLANNED"]

  - method: GET
    path: "/district/maintenance-windows"
    description: "List maintenance windows"
    roles: [DistrictAdmin, WaterUser, DitchRider]
    code: 200
    input: ["canal_reach_id?", "status?", "limit?", "offset?"]
    output: "MaintenanceWindow[]"
    side_effects: []

  - method: GET
    path: "/district/maintenance-windows/{id}"
    description: "Get one maintenance window"
    roles: [DistrictAdmin, WaterUser, DitchRider]
    code: 200
    input: []
    output: MaintenanceWindow
    side_effects: []

  - method: POST
    path: "/district/maintenance-windows/{id}/activate"
    description: "Activate a PLANNED window (clock must be inside it); shuts the reach and cascade-cancels overlapping SCHEDULED orders and their work orders"
    roles: [DistrictAdmin]
    code: 200
    input: []
    output: MaintenanceWindow
    side_effects: ["status := ACTIVE", "CanalReach.status -> SHUTDOWN", "overlapping SCHEDULED orders on the reach -> CANCELLED with committed_af release", "their non-terminal RiderWorkOrders -> CANCELLED"]

  - method: POST
    path: "/district/maintenance-windows/{id}/complete"
    description: "Complete an ACTIVE window; returns the reach to service when no other ACTIVE window remains on it"
    roles: [DistrictAdmin]
    code: 200
    input: []
    output: MaintenanceWindow
    side_effects: ["status := COMPLETED", "CanalReach.status -> IN_SERVICE if no other ACTIVE window on the reach"]

  - method: POST
    path: "/district/maintenance-windows/{id}/cancel"
    description: "Cancel a PLANNED window"
    roles: [DistrictAdmin]
    code: 200
    input: []
    output: MaintenanceWindow
    side_effects: ["status := CANCELLED"]

  - method: POST
    path: "/district/transfer-requests"
    description: "Request a transfer/lease of allocation between two accounts in the same season (OCC on the source allocation)"
    roles: [WaterUser]
    code: 201
    input: [from_account_id, to_account_id, season_id, quantity_af, expected_source_allocation_version]
    output: TransferRequest
    side_effects: ["status := PENDING", "increments source SeasonAllocation.version by 1"]

  - method: GET
    path: "/district/transfer-requests"
    description: "List transfer requests"
    roles: [DistrictAdmin, WaterUser]
    code: 200
    input: ["from_account_id?", "to_account_id?", "season_id?", "status?", "limit?", "offset?"]
    output: "TransferRequest[]"
    side_effects: []

  - method: GET
    path: "/district/transfer-requests/{id}"
    description: "Get one transfer request"
    roles: [DistrictAdmin, WaterUser]
    code: 200
    input: []
    output: TransferRequest
    side_effects: []

  - method: POST
    path: "/district/transfer-requests/{id}/approve"
    description: "Approve a PENDING transfer after re-checking account states, drought freeze, and source balance"
    roles: [DistrictAdmin]
    code: 200
    input: []
    output: TransferRequest
    side_effects: ["status := APPROVED"]

  - method: POST
    path: "/district/transfer-requests/{id}/post"
    description: "Post an APPROVED transfer to both allocations' ledgers (re-checks balances at post time)"
    roles: [DistrictAdmin]
    code: 200
    input: []
    output: TransferRequest
    side_effects: ["status := POSTED", "source SeasonAllocation.transfers_out_af += quantity_af", "destination SeasonAllocation.transfers_in_af += quantity_af", "increments both SeasonAllocation.version by 1"]

  - method: POST
    path: "/district/transfer-requests/{id}/reject"
    description: "Reject a PENDING or APPROVED transfer"
    roles: [DistrictAdmin]
    code: 200
    input: []
    output: TransferRequest
    side_effects: ["status := REJECTED"]

  - method: POST
    path: "/district/transfer-requests/{id}/cancel"
    description: "Source-account owner cancels a PENDING or APPROVED transfer"
    roles: [WaterUser]
    code: 200
    input: []
    output: TransferRequest
    side_effects: ["status := CANCELLED"]

  - method: POST
    path: "/district/drought-declarations"
    description: "Propose a drought curtailment declaration for an OPEN season"
    roles: [DistrictAdmin]
    code: 201
    input: [season_id, stage]
    output: DroughtDeclaration
    side_effects: ["senior/junior curtailment percentages set from stage constants", "status := PROPOSED"]

  - method: GET
    path: "/district/drought-declarations"
    description: "List drought declarations"
    roles: [DistrictAdmin, WaterUser]
    code: 200
    input: ["season_id?", "status?", "limit?", "offset?"]
    output: "DroughtDeclaration[]"
    side_effects: []

  - method: GET
    path: "/district/drought-declarations/{id}"
    description: "Get one drought declaration"
    roles: [DistrictAdmin, WaterUser]
    code: 200
    input: []
    output: DroughtDeclaration
    side_effects: []

  - method: POST
    path: "/district/drought-declarations/{id}/effectuate"
    description: "Effectuate a PROPOSED declaration: curtails all season allocations and cascade-cancels over-committed orders latest-start first"
    roles: [DistrictAdmin]
    code: 200
    input: []
    output: DroughtDeclaration
    side_effects: ["status := EFFECTIVE", "allocations -> CURTAILED with curtailed_entitlement_af", "over-committed orders cancelled in descending requested_start_at (tie created_at DESC) until committed_af <= available_af", "cancelled orders' work orders -> CANCELLED"]

  - method: POST
    path: "/district/drought-declarations/{id}/lift"
    description: "Lift an EFFECTIVE declaration: restores full entitlements; cancelled orders stay cancelled"
    roles: [DistrictAdmin]
    code: 200
    input: []
    output: DroughtDeclaration
    side_effects: ["status := LIFTED", "CURTAILED allocations -> ACTIVE with effective_entitlement_af restored to base"]

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field, invalid type/enum value, non-positive number where constrained, or end timestamp not strictly after start timestamp" }
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "X-User-Role or X-User-ID header missing, or role not recognized" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Role not permitted for the endpoint, or ownership check failed (WaterUser not the account owner; DitchRider not the assignee)" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Referenced resource (path id or body FK) does not exist" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_*_version does not match the parent entity's current version (OCC)" }
  - { id: ERR_ACCOUNT_NOT_ACTIVE, http: 409, condition: "WaterAccount.status is SUSPENDED or CLOSED where ACTIVE is required (order create/schedule, transfer create/approve/post)" }
  - { id: ERR_SEASON_NOT_OPEN, http: 409, condition: "IrrigationSeason not in the required lifecycle state (OPEN for ordering/transfers/drought effectuation; ANNOUNCED or OPEN for allocation creation)" }
  - { id: ERR_INVALID_ACCOUNT_STATE, http: 409, condition: "Account close attempted with non-terminal orders or transfers" }
  - { id: ERR_INVALID_SEASON_STATE, http: 409, condition: "Season transition attempted from a wrong from-state (e.g., close with FLOWING orders, open from DRAFT)" }
  - { id: ERR_INVALID_ORDER_STATE, http: 409, condition: "TurnoutOrder transition attempted from a wrong from-state (e.g., schedule a non-REQUESTED order, start when reach SHUTDOWN, cancel a terminal order)" }
  - { id: ERR_INVALID_WORK_ORDER_STATE, http: 409, condition: "RiderWorkOrder transition attempted from a wrong from-state (e.g., submit before start, verify twice)" }
  - { id: ERR_INVALID_INVOICE_STATE, http: 409, condition: "AssessmentInvoice transition attempted from a wrong from-state (e.g., pay a DRAFT, file-lien on ISSUED, pay twice)" }
  - { id: ERR_INVALID_WINDOW_STATE, http: 409, condition: "MaintenanceWindow transition attempted from a wrong from-state (e.g., activate twice, complete a PLANNED window)" }
  - { id: ERR_INVALID_TRANSFER_STATE, http: 409, condition: "TransferRequest transition attempted from a wrong from-state (e.g., post a PENDING transfer, approve a POSTED one)" }
  - { id: ERR_INVALID_DROUGHT_STATE, http: 409, condition: "DroughtDeclaration transition attempted from a wrong from-state, or effectuate while another declaration is EFFECTIVE on the season" }
  - { id: ERR_TRANSFER_BLOCKED_DROUGHT, http: 409, condition: "Transfer create/approve/post while a DroughtDeclaration is EFFECTIVE on the season" }
  - { id: ERR_WINDOW_TIME_CONFLICT, http: 422, condition: "Order window overlaps a PLANNED/ACTIVE maintenance window on the same reach (create or schedule)" }
  - { id: ERR_ORDER_TURNAROUND_CONFLICT, http: 422, condition: "Order overlaps or sits within TURNAROUND_MIN_GAP_HOURS of another non-terminal order of the same account" }
  - { id: ERR_WINDOW_OUT_OF_PERIOD, http: 422, condition: "Maintenance-window activation attempted with the logical clock outside [start_at, end_at)" }
  - { id: ERR_OUTSIDE_DELIVERY_WINDOW, http: 422, condition: "Order start attempted with the logical clock outside [requested_start_at, requested_end_at)" }
  - { id: ERR_WINDOW_OVERLAP, http: 422, condition: "New maintenance window overlaps an existing PLANNED/ACTIVE window on the same reach (half-open; adjacency allowed)" }
  - { id: ERR_REACH_CAPACITY_EXCEEDED, http: 422, condition: "Scheduling would push instantaneous summed flow on the reach above max_capacity_cfs" }
  - { id: ERR_DUPLICATE_SEASON_YEAR, http: 409, condition: "A season with the same year already exists" }
  - { id: ERR_DUPLICATE_ALLOCATION, http: 409, condition: "A SeasonAllocation already exists for (water_account_id, season_id)" }
  - { id: ERR_DUPLICATE_INVOICE, http: 409, condition: "An AssessmentInvoice already exists for (water_account_id, season_id)" }
  - { id: ERR_INSUFFICIENT_ALLOCATION, http: 422, condition: "Requested quantity exceeds available_af (net of committed) at order creation, transfer create/approve/post" }

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: DistrictAdmin
    description: "District office staff; operates seasons, allocations, scheduling, billing, liens, canal maintenance, drought declarations, and transfer adjudication"
    identity: opaque
    exclusive_operations:
      - "create/close water accounts"
      - "create/announce/open/close seasons and run delinquency sweeps"
      - "create season allocations"
      - "schedule/reject turnout orders"
      - "verify or return rider measurements"
      - "create/issue/file-lien on assessment invoices"
      - "manage canal reaches and maintenance windows"
      - "approve/post/reject transfer requests"
      - "declare/effectuate/lift drought declarations"
      - "set the logical clock"
    shared_operations:
      - "read any resource via GET endpoints"
      - "cancel any non-terminal turnout order"

  - name: DitchRider
    description: "Field rider operating turnouts and recording measurements; X-User-ID is an operator id stored as RiderWorkOrder.rider_user_id"
    identity: opaque
    exclusive_operations:
      - "start a scheduled order (assigned work order only)"
      - "submit measurements on assigned work orders"
    shared_operations:
      - "read accounts, seasons, allocations, reaches, windows, and turnout orders via GET endpoints"
      - "list/read rider work orders"

  - name: WaterUser
    description: "Irrigator/landowner acting as their WaterAccount; X-User-ID equals the WaterAccount id"
    identity: "entity_backed:WaterAccount"
    exclusive_operations:
      - "place turnout orders on their own account"
      - "request allocation transfers from their own account"
      - "pay their own assessment invoices"
      - "cancel their own non-terminal orders and transfers"
    shared_operations:
      - "read accounts, seasons, allocations, reaches, windows, orders, transfers, and invoices via GET endpoints"
