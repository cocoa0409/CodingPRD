          assert:
            - "tot_c == 3 (N1, N2 closure_ready 2026-08-05 in NORTH; S1 in SOUTH; all inside [2026-08-01, 2026-09-01))"
            - "org_rate == 0.25 (nested: round(1/2,4)=0.5000, round(0/1,4)=0.0000, mean=0.2500)"
            - "pooled_rate == 0.3333 (reference variant: 1/3 pooled then rounded)"
            - "org_rate != pooled_rate — nested rounding order is load-bearing"

  # =====================================================================
  # Rule 3 — non_linear_state_machine
  # =====================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: case_dual_revert_loops
        grounds:
          - state_machines.HotlineCase.ASSIGNED_to_TRIAGED
          - state_machines.HotlineCase.DETERMINATION_REVIEW_to_UNDER_INVESTIGATION
          - state_machines.HotlineCase.UNDER_INVESTIGATION_to_DETERMINATION_REVIEW
        distinguishing_aspect: |
          HotlineCase is cyclic with two distinct revert loops: ASSIGNED -> TRIAGED on
          pre-activation release, and DETERMINATION_REVIEW -> UNDER_INVESTIGATION on
          review RETURN; the case completes CLOSURE_READY only after traversing both loops.
        test_recipe:
          setup:
            - "Staff: intake, off1, off2, inv; one case taken through: release loop, then a returned determination, then a fresh approved draft"
          setup_api_calls:
            - { call: "POST /hotline/staff-members", payload: { display_name: "Ingrid Intake", email: "intake@corp.example", department: "Ethics", capabilities: [INTAKE], max_active_cases: 5 }, as: EthicsPlatformAdmin, captures: { s_int: $.data.id } }
            - { call: "POST /hotline/staff-members", payload: { display_name: "Olivia Officer", email: "officer@corp.example", department: "Ethics", capabilities: [OFFICER], max_active_cases: 5 }, as: EthicsPlatformAdmin, captures: { s_off: $.data.id } }
            - { call: "POST /hotline/staff-members", payload: { display_name: "Oscar Officer", email: "officer2@corp.example", department: "Ethics", capabilities: [OFFICER], max_active_cases: 5 }, as: EthicsPlatformAdmin, captures: { s_off2: $.data.id } }
            - { call: "POST /hotline/staff-members", payload: { display_name: "Ian Vest", email: "investigator@corp.example", department: "Ops", capabilities: [INVESTIGATION], max_active_cases: 5 }, as: EthicsPlatformAdmin, captures: { s_inv: $.data.id } }
            - { call: "POST /hotline/cases", payload: { channel: WEB_PORTAL, category: FRAUD, description: "Allegation of expense fraud in Q2", region: NORTH, subject_employee_ids: [] }, as: HotlineReporter, as_user_id: "anon-l1", captures: { c1: $.data.id, key1: $.data.reporter_access_key } }
            - { call: "POST /hotline/cases/${c1}/triage", payload: { confirmed_category: FRAUD, subject_seniority: STAFF, financial_exposure_band: NONE, reporter_vulnerability: NONE, triage_decision: PROCEED }, as: IntakeSpecialist, as_user_id: "${s_int}", captures: { c1_v: $.data.version } }
            - { call: "POST /hotline/cases/${c1}/assignments", payload: { expected_case_version: "${c1_v}" }, as: IntakeSpecialist, as_user_id: "${s_int}", captures: { a1: $.data.id } }
            # loop 1: ASSIGNED -> TRIAGED via release (pre-activation)
            - { call: "POST /hotline/assignments/${a1}/release", as: ComplianceOfficer, as_user_id: "${s_off}" }
            - { call: "GET /hotline/cases/${c1}", as: ComplianceOfficer, as_user_id: "${s_off}", captures: { c1_v2: $.data.version, st_after_release: $.data.status } }
            - { call: "POST /hotline/cases/${c1}/assignments", payload: { expected_case_version: "${c1_v2}" }, as: IntakeSpecialist, as_user_id: "${s_int}", captures: { a2: $.data.id } }
            - { call: "POST /hotline/assignments/${a2}/screen", payload: { outcome: CLEAR }, as: IntakeSpecialist, as_user_id: "${s_int}" }
            - { call: "POST /hotline/assignments/${a2}/activate", as: ComplianceOfficer, as_user_id: "${s_off}" }
            - { call: "POST /hotline/interviews", payload: { case_id: "${c1}", interviewee_role: WITNESS, interviewee_identifier: "w-1", scheduled_start: "2026-08-03T10:00:00Z", scheduled_end: "2026-08-03T11:00:00Z" }, as: Investigator, as_user_id: "${s_inv}", captures: { iv1: $.data.id } }
            - { call: "POST /hotline/interviews/${iv1}/conclude", payload: { outcome: CONDUCTED, summary: "Interview conducted on site with the witness present throughout." }, as: Investigator, as_user_id: "${s_inv}" }
            - { call: "POST /hotline/evidence-items", payload: { case_id: "${c1}", evidence_type: DOCUMENT, description: "Expense report PDF export", checksum: "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa", captured_at: "2026-08-03T00:00:00Z" }, as: Investigator, as_user_id: "${s_inv}", captures: { ev1: $.data.id } }
            - { call: "POST /hotline/evidence-items/${ev1}/seal", as: IntakeSpecialist, as_user_id: "${s_int}" }
            - { call: "GET /hotline/cases/${c1}", as: ComplianceOfficer, as_user_id: "${s_off}", captures: { c1_v3: $.data.version } }
            - { call: "POST /hotline/cases/${c1}/determinations", payload: { finding: UNSUBSTANTIATED, rationale: "Evidence reviewed shows the allegation is not supported on the balance of proof.", expected_case_version: "${c1_v3}" }, as: Investigator, as_user_id: "${s_inv}", captures: { d1: $.data.id } }
            - { call: "POST /hotline/determinations/${d1}/submit", as: Investigator, as_user_id: "${s_inv}" }
            # loop 2: DETERMINATION_REVIEW -> UNDER_INVESTIGATION via RETURN
            - { call: "POST /hotline/determinations/${d1}/review", payload: { decision: RETURN, review_notes: "Needs more analysis." }, as: ComplianceOfficer, as_user_id: "${s_off}" }
            - { call: "GET /hotline/cases/${c1}", as: ComplianceOfficer, as_user_id: "${s_off}", captures: { c1_v4: $.data.version, st_after_return: $.data.status } }
            - { call: "POST /hotline/cases/${c1}/determinations", payload: { finding: UNSUBSTANTIATED, rationale: "Re-reviewed evidence confirms the allegation remains unsupported overall.", expected_case_version: "${c1_v4}" }, as: Investigator, as_user_id: "${s_inv}", captures: { d2: $.data.id } }
            - { call: "POST /hotline/determinations/${d2}/submit", as: Investigator, as_user_id: "${s_inv}" }
          trigger:
            - { call: "POST /hotline/determinations/${d2}/review", payload: { decision: APPROVE, review_notes: "Reviewed and accepted.", notice_summary: "Case closed with no findings disclosed." }, as: ComplianceOfficer, as_user_id: "${s_off2}", captures: { d2_st: $.data.status } }
          assert:
            - "st_after_release == TRIAGED (loop 1 traversed: TRIAGED -> ASSIGNED -> TRIAGED)"
            - "st_after_return == UNDER_INVESTIGATION (loop 2 traversed: DETERMINATION_REVIEW -> UNDER_INVESTIGATION)"
            - "d2_st == APPROVED and Determination.${d1}.status == RETURNED"
            - "HotlineCase.${c1}.status == CLOSURE_READY after the second approval"
            - "CaseStatusEvent log contains ASSIGNMENT_RELEASED and DETERMINATION_RETURNED rows"

      - name: remediation_overdue_extension_cycle
        grounds:
          - state_machines.RemediationAction.IN_PROGRESS_to_OVERDUE
          - state_machines.RemediationAction.OVERDUE_to_IN_PROGRESS
          - state_machines.RemediationAction.IN_PROGRESS_to_VERIFIED
        distinguishing_aspect: |
          RemediationAction is cyclic: IN_PROGRESS -> OVERDUE -> IN_PROGRESS can repeat;
          the loop is traversed twice (extension_count == 2) before VERIFIED terminates it
          and cascades the case to CLOSURE_READY.
        test_recipe:
          setup:
            - "Staff: intake, off1, off2, inv; SUBSTANTIATED case in REMEDIATION with one action (due 2026-08-10) approved to IN_PROGRESS"
          setup_api_calls:
            - { call: "POST /hotline/staff-members", payload: { display_name: "Ingrid Intake", email: "intake@corp.example", department: "Ethics", capabilities: [INTAKE], max_active_cases: 5 }, as: EthicsPlatformAdmin, captures: { s_int: $.data.id } }
            - { call: "POST /hotline/staff-members", payload: { display_name: "Olivia Officer", email: "officer@corp.example", department: "Ethics", capabilities: [OFFICER], max_active_cases: 5 }, as: EthicsPlatformAdmin, captures: { s_off: $.data.id } }
            - { call: "POST /hotline/staff-members", payload: { display_name: "Oscar Officer", email: "officer2@corp.example", department: "Ethics", capabilities: [OFFICER], max_active_cases: 5 }, as: EthicsPlatformAdmin, captures: { s_off2: $.data.id } }
            - { call: "POST /hotline/staff-members", payload: { display_name: "Ian Vest", email: "investigator@corp.example", department: "Ops", capabilities: [INVESTIGATION], max_active_cases: 5 }, as: EthicsPlatformAdmin, captures: { s_inv: $.data.id } }
            - { call: "POST /hotline/cases", payload: { channel: WEB_PORTAL, category: FRAUD, description: "Allegation of expense fraud in Q2", region: NORTH, subject_employee_ids: [] }, as: HotlineReporter, as_user_id: "anon-r1", captures: { c1: $.data.id } }
            - { call: "POST /hotline/cases/${c1}/triage", payload: { confirmed_category: FRAUD, subject_seniority: STAFF, financial_exposure_band: NONE, reporter_vulnerability: NONE, triage_decision: PROCEED }, as: IntakeSpecialist, as_user_id: "${s_int}", captures: { c1_v: $.data.version } }
            - { call: "POST /hotline/cases/${c1}/assignments", payload: { expected_case_version: "${c1_v}" }, as: IntakeSpecialist, as_user_id: "${s_int}", captures: { a1: $.data.id } }
            - { call: "POST /hotline/assignments/${a1}/screen", payload: { outcome: CLEAR }, as: IntakeSpecialist, as_user_id: "${s_int}" }
            - { call: "POST /hotline/assignments/${a1}/activate", as: ComplianceOfficer, as_user_id: "${s_off}" }
            - { call: "POST /hotline/interviews", payload: { case_id: "${c1}", interviewee_role: WITNESS, interviewee_identifier: "w-1", scheduled_start: "2026-08-03T10:00:00Z", scheduled_end: "2026-08-03T11:00:00Z" }, as: Investigator, as_user_id: "${s_inv}", captures: { iv1: $.data.id } }
            - { call: "POST /hotline/interviews/${iv1}/conclude", payload: { outcome: CONDUCTED, summary: "Interview conducted on site with the witness present throughout." }, as: Investigator, as_user_id: "${s_inv}" }
            - { call: "POST /hotline/evidence-items", payload: { case_id: "${c1}", evidence_type: DOCUMENT, description: "Expense report PDF export", checksum: "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa", captured_at: "2026-08-03T00:00:00Z" }, as: Investigator, as_user_id: "${s_inv}", captures: { ev1: $.data.id } }
            - { call: "POST /hotline/evidence-items/${ev1}/seal", as: IntakeSpecialist, as_user_id: "${s_int}" }
            - { call: "GET /hotline/cases/${c1}", as: ComplianceOfficer, as_user_id: "${s_off}", captures: { c1_v2: $.data.version } }
            - { call: "POST /hotline/cases/${c1}/determinations", payload: { finding: SUBSTANTIATED, rationale: "Evidence reviewed shows the policy violation is supported beyond reasonable doubt.", expected_case_version: "${c1_v2}" }, as: Investigator, as_user_id: "${s_inv}", captures: { d1: $.data.id } }
            - { call: "POST /hotline/determinations/${d1}/submit", as: Investigator, as_user_id: "${s_inv}" }
            - { call: "POST /hotline/determinations/${d1}/review", payload: { decision: APPROVE, review_notes: "Reviewed and accepted.", notice_summary: "Case closed; corrective actions completed." }, as: ComplianceOfficer, as_user_id: "${s_off2}" }
            - { call: "POST /hotline/determinations/${d1}/remediation-actions", payload: { action_type: TRAINING, owner_department: "Finance", description: "Refresh anti-fraud training", due_date: "2026-08-10T00:00:00Z" }, as: ComplianceOfficer, as_user_id: "${s_off}", captures: { ra1: $.data.id } }
            - { call: "POST /hotline/remediation-actions/${ra1}/decide", payload: { decision: APPROVE }, as: ComplianceOfficer, as_user_id: "${s_off2}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-11T00:00:00Z" }, as: EthicsPlatformAdmin }
            - { call: "POST /hotline/remediation-actions/${ra1}/extend", payload: { due_date: "2026-08-20T00:00:00Z" }, as: ComplianceOfficer, as_user_id: "${s_off}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-25T00:00:00Z" }, as: EthicsPlatformAdmin }
            - { call: "POST /hotline/remediation-actions/${ra1}/extend", payload: { due_date: "2026-09-01T00:00:00Z" }, as: ComplianceOfficer, as_user_id: "${s_off2}" }
          trigger:
            - { call: "POST /hotline/remediation-actions/${ra1}/verify", as: ComplianceOfficer, as_user_id: "${s_off2}", captures: { ra_st: $.data.status, ra_ext: $.data.extension_count } }
          assert:
            - "ra_st == VERIFIED after two OVERDUE -> IN_PROGRESS loops"
            - "ra_ext == 2 (cycle traversed twice)"
            - "HotlineCase.${c1}.status == CLOSURE_READY (last-open-action verification cascade)"
            - "GET /hotline/cases/${c1}/closure-notices returns exactly 1 notice with status SENT"

  # =====================================================================
  # Rule 4 — transitive_cascade
  # =====================================================================
  - rule_id: transitive_cascade
    instances:
      - name: retaliation_reopen_cascade_depth3
        grounds:
          - state_machines.HotlineCase.MONITORING_to_REOPENED
          - state_machines.MonitoringPlan.ACTIVE_to_SUSPENDED
          - state_machines.RetaliationFlag.OPEN_to_ESCALATED
          - calculations.retaliation_risk_score
        distinguishing_aspect: |
          Depth-3 cascade from POST /hotline/cases/{id}/retaliation-flags: flag insert
          (A) mutates case.retaliation_risk_score; the crossing itself drives
          case MONITORING -> REOPENED (B); the reopen suspends the MonitoringPlan (C);
          and the plan/case mutations append CaseStatusEvent rows (D) — each link caused
          by the previous, not by the original request.
        test_recipe:
          setup:
            - "Staff: intake, off1, off2, inv; one LOW-severity case fully closed into MONITORING with an ACTIVE MonitoringPlan (notice acknowledged by reporter)"
          setup_api_calls:
            - { call: "POST /hotline/staff-members", payload: { display_name: "Ingrid Intake", email: "intake@corp.example", department: "Ethics", capabilities: [INTAKE], max_active_cases: 5 }, as: EthicsPlatformAdmin, captures: { s_int: $.data.id } }
            - { call: "POST /hotline/staff-members", payload: { display_name: "Olivia Officer", email: "officer@corp.example", department: "Ethics", capabilities: [OFFICER], max_active_cases: 5 }, as: EthicsPlatformAdmin, captures: { s_off: $.data.id } }
            - { call: "POST /hotline/staff-members", payload: { display_name: "Oscar Officer", email: "officer2@corp.example", department: "Ethics", capabilities: [OFFICER], max_active_cases: 5 }, as: EthicsPlatformAdmin, captures: { s_off2: $.data.id } }
            - { call: "POST /hotline/staff-members", payload: { display_name: "Ian Vest", email: "investigator@corp.example", department: "Ops", capabilities: [INVESTIGATION], max_active_cases: 5 }, as: EthicsPlatformAdmin, captures: { s_inv: $.data.id } }
            - { call: "POST /hotline/cases", payload: { channel: WEB_PORTAL, category: OTHER, description: "Allegation of minor policy lapse", region: NORTH, subject_employee_ids: [] }, as: HotlineReporter, as_user_id: "anon-c1", captures: { c1: $.data.id, key1: $.data.reporter_access_key } }
            - { call: "POST /hotline/cases/${c1}/triage", payload: { confirmed_category: OTHER, subject_seniority: STAFF, financial_exposure_band: NONE, reporter_vulnerability: NONE, triage_decision: PROCEED }, as: IntakeSpecialist, as_user_id: "${s_int}", captures: { c1_v: $.data.version } }
            - { call: "POST /hotline/cases/${c1}/assignments", payload: { expected_case_version: "${c1_v}" }, as: IntakeSpecialist, as_user_id: "${s_int}", captures: { a1: $.data.id } }
            - { call: "POST /hotline/assignments/${a1}/screen", payload: { outcome: CLEAR }, as: IntakeSpecialist, as_user_id: "${s_int}" }
            - { call: "POST /hotline/assignments/${a1}/activate", as: ComplianceOfficer, as_user_id: "${s_off}" }
            - { call: "POST /hotline/interviews", payload: { case_id: "${c1}", interviewee_role: WITNESS, interviewee_identifier: "w-1", scheduled_start: "2026-08-03T10:00:00Z", scheduled_end: "2026-08-03T11:00:00Z" }, as: Investigator, as_user_id: "${s_inv}", captures: { iv1: $.data.id } }
            - { call: "POST /hotline/interviews/${iv1}/conclude", payload: { outcome: CONDUCTED, summary: "Interview conducted on site with the witness present throughout." }, as: Investigator, as_user_id: "${s_inv}" }
            - { call: "POST /hotline/evidence-items", payload: { case_id: "${c1}", evidence_type: DOCUMENT, description: "Policy acknowledgement form", checksum: "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa", captured_at: "2026-08-03T00:00:00Z" }, as: Investigator, as_user_id: "${s_inv}", captures: { ev1: $.data.id } }
            - { call: "POST /hotline/evidence-items/${ev1}/seal", as: IntakeSpecialist, as_user_id: "${s_int}" }
            - { call: "GET /hotline/cases/${c1}", as: ComplianceOfficer, as_user_id: "${s_off}", captures: { c1_v2: $.data.version } }
            - { call: "POST /hotline/cases/${c1}/determinations", payload: { finding: UNSUBSTANTIATED, rationale: "Evidence reviewed shows the allegation is not supported on the balance of proof.", expected_case_version: "${c1_v2}" }, as: Investigator, as_user_id: "${s_inv}", captures: { d1: $.data.id } }
            - { call: "POST /hotline/determinations/${d1}/submit", as: Investigator, as_user_id: "${s_inv}" }
            - { call: "POST /hotline/determinations/${d1}/review", payload: { decision: APPROVE, review_notes: "Reviewed and accepted.", notice_summary: "Case closed with no findings disclosed." }, as: ComplianceOfficer, as_user_id: "${s_off2}" }
            - { call: "GET /hotline/cases/${c1}/closure-notices", as: ComplianceOfficer, as_user_id: "${s_off}", captures: { n1: "$.data[0].id" } }
            - { call: "POST /hotline/closure-notices/${n1}/acknowledge", as: HotlineReporter, as_user_id: "${key1}" }
            - { call: "GET /hotline/cases/${c1}/monitoring-plans", as: ComplianceOfficer, as_user_id: "${s_off}", captures: { mp1: "$.data[0].id" } }
          trigger:
            - { call: "POST /hotline/cases/${c1}/retaliation-flags", payload: { reported_via: HR_SIGNAL, description: "Manager excluded reporter from meetings" }, as: ComplianceOfficer, as_user_id: "${s_off}", captures: { f1: $.data.id, f1_st: $.data.status } }
            - { call: "POST /hotline/cases/${c1}/retaliation-flags", payload: { reported_via: HR_SIGNAL, description: "Shift schedule cut after report" }, as: ComplianceOfficer, as_user_id: "${s_off}", captures: { f2: $.data.id, f2_st: $.data.status } }
          assert:
            - "after trigger[0]: f1_st == OPEN (score 2 < 4, no escalation)"
            - "after trigger[1]: RetaliationFlag.${f1}.status == ESCALATED and f2_st == ESCALATED (score 4 >= 4)"
            - "HotlineCase.${c1}.status == REOPENED; severity bumped LOW -> MEDIUM; reopen_count == 1; assigned_investigator_id is null"
            - "MonitoringPlan.${mp1}.status == SUSPENDED and next_check_in_due is null (link C caused by the reopen, not by the POST directly)"
            - "GET /hotline/cases/${c1}/case-status-events contains RETALIATION_ESCALATED and CASE_REOPENED rows (link D)"

      - name: remediation_verify_closure_notice_cascade
        grounds:
          - state_machines.HotlineCase.REMEDIATION_to_CLOSURE_READY
          - state_machines.RemediationAction.IN_PROGRESS_to_VERIFIED
          - entities.CaseClosureNotice.fields.status
        distinguishing_aspect: |
          Depth-2 cascade from a different trigger (POST /hotline/remediation-actions/{id}/verify):
          action VERIFIED (A) flips the case REMEDIATION -> CLOSURE_READY (B), and that case
          transition itself creates the CaseClosureNotice SENT (C) — not a parallel fan-out.
        test_recipe:
          setup:
            - "Staff: intake, off1, off2, inv; SUBSTANTIATED case in REMEDIATION with exactly one action in IN_PROGRESS"
          setup_api_calls:
            - { call: "POST /hotline/staff-members", payload: { display_name: "Ingrid Intake", email: "intake@corp.example", department: "Ethics", capabilities: [INTAKE], max_active_cases: 5 }, as: EthicsPlatformAdmin, captures: { s_int: $.data.id } }
            - { call: "POST /hotline/staff-members", payload: { display_name: "Olivia Officer", email: "officer@corp.example", department: "Ethics", capabilities: [OFFICER], max_active_cases: 5 }, as: EthicsPlatformAdmin, captures: { s_off: $.data.id } }
            - { call: "POST /hotline/staff-members", payload: { display_name: "Oscar Officer", email: "officer2@corp.example", department: "Ethics", capabilities: [OFFICER], max_active_cases: 5 }, as: EthicsPlatformAdmin, captures: { s_off2: $.data.id } }
            - { call: "POST /hotline/staff-members", payload: { display_name: "Ian Vest", email: "investigator@corp.example", department: "Ops", capabilities: [INVESTIGATION], max_active_cases: 5 }, as: EthicsPlatformAdmin, captures: { s_inv: $.data.id } }
            - { call: "POST /hotline/cases", payload: { channel: WEB_PORTAL, category: FRAUD, description: "Allegation of expense fraud in Q2", region: NORTH, subject_employee_ids: [] }, as: HotlineReporter, as_user_id: "anon-v1", captures: { c1: $.data.id } }
            - { call: "POST /hotline/cases/${c1}/triage", payload: { confirmed_category: FRAUD, subject_seniority: STAFF, financial_exposure_band: NONE, reporter_vulnerability: NONE, triage_decision: PROCEED }, as: IntakeSpecialist, as_user_id: "${s_int}", captures: { c1_v: $.data.version } }
            - { call: "POST /hotline/cases/${c1}/assignments", payload: { expected_case_version: "${c1_v}" }, as: IntakeSpecialist, as_user_id: "${s_int}", captures: { a1: $.data.id } }
            - { call: "POST /hotline/assignments/${a1}/screen", payload: { outcome: CLEAR }, as: IntakeSpecialist, as_user_id: "${s_int}" }
            - { call: "POST /hotline/assignments/${a1}/activate", as: ComplianceOfficer, as_user_id: "${s_off}" }
            - { call: "POST /hotline/interviews", payload: { case_id: "${c1}", interviewee_role: WITNESS, interviewee_identifier: "w-1", scheduled_start: "2026-08-03T10:00:00Z", scheduled_end: "2026-08-03T11:00:00Z" }, as: Investigator, as_user_id: "${s_inv}", captures: { iv1: $.data.id } }
            - { call: "POST /hotline/interviews/${iv1}/conclude", payload: { outcome: CONDUCTED, summary: "Interview conducted on site with the witness present throughout." }, as: Investigator, as_user_id: "${s_inv}" }
            - { call: "POST /hotline/evidence-items", payload: { case_id: "${c1}", evidence_type: DOCUMENT, description: "Expense report PDF export", checksum: "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa", captured_at: "2026-08-03T00:00:00Z" }, as: Investigator, as_user_id: "${s_inv}", captures: { ev1: $.data.id } }
            - { call: "POST /hotline/evidence-items/${ev1}/seal", as: IntakeSpecialist, as_user_id: "${s_int}" }
            - { call: "GET /hotline/cases/${c1}", as: ComplianceOfficer, as_user_id: "${s_off}", captures: { c1_v2: $.data.version } }
            - { call: "POST /hotline/cases/${c1}/determinations", payload: { finding: SUBSTANTIATED, rationale: "Evidence reviewed shows the policy violation is supported beyond reasonable doubt.", expected_case_version: "${c1_v2}" }, as: Investigator, as_user_id: "${s_inv}", captures: { d1: $.data.id } }
            - { call: "POST /hotline/determinations/${d1}/submit", as: Investigator, as_user_id: "${s_inv}" }
            - { call: "POST /hotline/determinations/${d1}/review", payload: { decision: APPROVE, review_notes: "Reviewed and accepted.", notice_summary: "Case closed; corrective actions completed." }, as: ComplianceOfficer, as_user_id: "${s_off2}" }
            - { call: "POST /hotline/determinations/${d1}/remediation-actions", payload: { action_type: POLICY_CHANGE, owner_department: "Finance", description: "Tighten expense approval policy", due_date: "2026-09-15T00:00:00Z" }, as: ComplianceOfficer, as_user_id: "${s_off}", captures: { ra1: $.data.id } }
            - { call: "POST /hotline/remediation-actions/${ra1}/decide", payload: { decision: APPROVE }, as: ComplianceOfficer, as_user_id: "${s_off2}" }
          trigger:
            - { call: "POST /hotline/remediation-actions/${ra1}/verify", as: ComplianceOfficer, as_user_id: "${s_off2}", captures: { ra_st: $.data.status } }
          assert:
            - "ra_st == VERIFIED (link A)"
            - "HotlineCase.${c1}.status == CLOSURE_READY and closure_ready_at == 2026-08-01T00:00:00Z (link B caused by A)"
            - "GET /hotline/cases/${c1}/closure-notices returns exactly 1 notice with status SENT and sent_at == 2026-08-01T00:00:00Z (link C caused by B)"
            - "GET /hotline/cases/${c1}/case-status-events contains a CLOSURE_READY row"

  # =====================================================================
  # Rule 5 — priority_pair_validation_conflict
  # =====================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: interview_create_state_vs_temporal_priority
        grounds:
          - validations[priority=8]
          - validations[priority=12]
          - errors[ERR_CASE_NOT_UNDER_INVESTIGATION]
          - errors[ERR_INTERVIEW_OVERLAP]
        distinguishing_aspect: |
          Category pair (state, business_temporal): the interview request violates both
          the case-state gate (case2 is ASSIGNED, not UNDER_INVESTIGATION) and the
          15-minute buffer against the same investigator's case1 interview; priority 8
          beats priority 12, so ERR_CASE_NOT_UNDER_INVESTIGATION is returned.
        test_recipe:
          setup:
            - "Staff: intake, off1, inv (max_active_cases 5)"
            - "case1 UNDER_INVESTIGATION assigned to inv with a SCHEDULED interview 2026-08-05T10:00:00Z-11:00:00Z"
            - "case2 TRIAGED then ASSIGNED via officer override to the same inv (PROPOSED; assigned_investigator_id == inv)"
          setup_api_calls:
            - { call: "POST /hotline/staff-members", payload: { display_name: "Ingrid Intake", email: "intake@corp.example", department: "Ethics", capabilities: [INTAKE], max_active_cases: 5 }, as: EthicsPlatformAdmin, captures: { s_int: $.data.id } }
            - { call: "POST /hotline/staff-members", payload: { display_name: "Olivia Officer", email: "officer@corp.example", department: "Ethics", capabilities: [OFFICER], max_active_cases: 5 }, as: EthicsPlatformAdmin, captures: { s_off: $.data.id } }
            - { call: "POST /hotline/staff-members", payload: { display_name: "Ian Vest", email: "investigator@corp.example", department: "Ops", capabilities: [INVESTIGATION], max_active_cases: 5 }, as: EthicsPlatformAdmin, captures: { s_inv: $.data.id } }
            - { call: "POST /hotline/cases", payload: { channel: WEB_PORTAL, category: FRAUD, description: "Allegation of expense fraud in Q2", region: NORTH, subject_employee_ids: [] }, as: HotlineReporter, as_user_id: "anon-p1", captures: { c1: $.data.id } }
            - { call: "POST /hotline/cases/${c1}/triage", payload: { confirmed_category: FRAUD, subject_seniority: STAFF, financial_exposure_band: NONE, reporter_vulnerability: NONE, triage_decision: PROCEED }, as: IntakeSpecialist, as_user_id: "${s_int}", captures: { c1_v: $.data.version } }
            - { call: "POST /hotline/cases/${c1}/assignments", payload: { expected_case_version: "${c1_v}", investigator_id: "${s_inv}", override_reason: "Primary investigator" }, as: ComplianceOfficer, as_user_id: "${s_off}", captures: { a1: $.data.id } }
            - { call: "POST /hotline/assignments/${a1}/screen", payload: { outcome: CLEAR }, as: IntakeSpecialist, as_user_id: "${s_int}" }
            - { call: "POST /hotline/assignments/${a1}/activate", as: ComplianceOfficer, as_user_id: "${s_off}" }
            - { call: "POST /hotline/interviews", payload: { case_id: "${c1}", interviewee_role: WITNESS, interviewee_identifier: "w-1", scheduled_start: "2026-08-05T10:00:00Z", scheduled_end: "2026-08-05T11:00:00Z" }, as: Investigator, as_user_id: "${s_inv}" }
            - { call: "POST /hotline/cases", payload: { channel: EMAIL, category: HARASSMENT, description: "Allegation of hostile workplace conduct", region: SOUTH, subject_employee_ids: [] }, as: HotlineReporter, as_user_id: "anon-p2", captures: { c2: $.data.id } }
            - { call: "POST /hotline/cases/${c2}/triage", payload: { confirmed_category: HARASSMENT, subject_seniority: MANAGER, financial_exposure_band: NONE, reporter_vulnerability: NONE, triage_decision: PROCEED }, as: IntakeSpecialist, as_user_id: "${s_int}", captures: { c2_v: $.data.version } }
            - { call: "POST /hotline/cases/${c2}/assignments", payload: { expected_case_version: "${c2_v}", investigator_id: "${s_inv}", override_reason: "Same subject cluster" }, as: ComplianceOfficer, as_user_id: "${s_off}", captures: { a2: $.data.id } }
          trigger:
            - { call: "POST /hotline/interviews", payload: { case_id: "${c2}", interviewee_role: SUBJECT, interviewee_identifier: "s-2", scheduled_start: "2026-08-05T10:30:00Z", scheduled_end: "2026-08-05T11:30:00Z" }, as: Investigator, as_user_id: "${s_inv}", captures: { err_id: "$.data.error_id" } }
          assert:
            - "err_id == ERR_CASE_NOT_UNDER_INVESTIGATION (state, priority 8) even though the 10:30 start also violates the 15-minute buffer against the 10:00-11:00 interview (business_temporal, priority 12)"
            - "no Interview row is created for case2 (GET /hotline/cases/${c2}/interviews returns empty array)"

      - name: assignment_freeze_vs_sod_priority
        grounds:
          - validations[priority=9]
          - validations[priority=10]
          - errors[ERR_LEGAL_HOLD_FREEZE]
          - errors[ERR_SOD_TRIAGER_INELIGIBLE]
        distinguishing_aspect: |
          Category pair (business_safety, business_constraint): an officer override naming
          the triager as investigator on a FROZEN case fails both the legal-hold freeze
          gate (priority 9) and the triager-SoD rule (priority 10); the freeze error wins.
        test_recipe:
          setup:
            - "Staff: intakeD with capabilities [INTAKE, INVESTIGATION] (so capability is NOT the failing rule), off1 (OFFICER)"
            - "Case TRIAGED by intakeD, then placed under an ACTIVE legal hold by off1 (posture FROZEN)"
          setup_api_calls:
            - { call: "POST /hotline/staff-members", payload: { display_name: "Dana Dual", email: "dual@corp.example", department: "Ethics", capabilities: [INTAKE, INVESTIGATION], max_active_cases: 5 }, as: EthicsPlatformAdmin, captures: { s_intd: $.data.id } }
            - { call: "POST /hotline/staff-members", payload: { display_name: "Olivia Officer", email: "officer@corp.example", department: "Ethics", capabilities: [OFFICER], max_active_cases: 5 }, as: EthicsPlatformAdmin, captures: { s_off: $.data.id } }
            - { call: "POST /hotline/cases", payload: { channel: WEB_PORTAL, category: FRAUD, description: "Allegation of expense fraud in Q2", region: NORTH, subject_employee_ids: [] }, as: HotlineReporter, as_user_id: "anon-f1", captures: { c1: $.data.id } }
            - { call: "POST /hotline/cases/${c1}/triage", payload: { confirmed_category: FRAUD, subject_seniority: STAFF, financial_exposure_band: NONE, reporter_vulnerability: NONE, triage_decision: PROCEED }, as: IntakeSpecialist, as_user_id: "${s_intd}" }
            - { call: "POST /hotline/legal-holds", payload: { case_id: "${c1}", start_at: "2026-08-10T00:00:00Z", end_at: "2026-08-20T00:00:00Z", reason: "Litigation review hold" }, as: ComplianceOfficer, as_user_id: "${s_off}", captures: { h1: $.data.id } }
            - { call: "GET /hotline/cases/${c1}", as: ComplianceOfficer, as_user_id: "${s_off}", captures: { c1_v: $.data.version, c1_posture: $.data.posture } }
          trigger:
            - { call: "POST /hotline/cases/${c1}/assignments", payload: { expected_case_version: "${c1_v}", investigator_id: "${s_intd}", override_reason: "Only qualified investigator" }, as: ComplianceOfficer, as_user_id: "${s_off}", captures: { err_id: "$.data.error_id" } }
          assert:
            - "c1_posture == FROZEN at trigger time"
            - "err_id == ERR_LEGAL_HOLD_FREEZE (business_safety, priority 9) even though investigator_id == triaged_by_id also violates ERR_SOD_TRIAGER_INELIGIBLE (business_constraint, priority 10)"
            - "no CaseAssignment created (GET /hotline/cases/${c1}/assignments returns empty array)"

  # =====================================================================
  # Rule 6 — boundary_precision_check
  # =====================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: capacity_boundary_at_max
        grounds:
          - calculations.routing_workload
          - entities.StaffMember.fields.max_active_cases
          - errors[ERR_INVESTIGATOR_CAPACITY_EXCEEDED]
        distinguishing_aspect: |
          Metric: active assignment count; endpoint: POST /hotline/assignments/{id}/activate.
          With max_active_cases == 1 and one ACTIVE assignment, the next activate is
          rejected — the gate is strict (active_case_count < max), so equality blocks.
        test_recipe:
          setup:
            - "Staff: intake, off1, invS (max_active_cases 1)"
            - "case1 activated to invS (active_case_count == 1 == max)"
            - "case2 ASSIGNED to invS via override and screened CLEAR (capacity is checked at activate, not at propose)"
          setup_api_calls:
            - { call: "POST /hotline/staff-members", payload: { display_name: "Ingrid Intake", email: "intake@corp.example", department: "Ethics", capabilities: [INTAKE], max_active_cases: 5 }, as: EthicsPlatformAdmin, captures: { s_int: $.data.id } }
            - { call: "POST /hotline/staff-members", payload: { display_name: "Olivia Officer", email: "officer@corp.example", department: "Ethics", capabilities: [OFFICER], max_active_cases: 5 }, as: EthicsPlatformAdmin, captures: { s_off: $.data.id } }
            - { call: "POST /hotline/staff-members", payload: { display_name: "Solo Vest", email: "solo@corp.example", department: "Ops", capabilities: [INVESTIGATION], max_active_cases: 1 }, as: EthicsPlatformAdmin, captures: { s_inv: $.data.id } }
            - { call: "POST /hotline/cases", payload: { channel: WEB_PORTAL, category: FRAUD, description: "Allegation of expense fraud in Q2", region: NORTH, subject_employee_ids: [] }, as: HotlineReporter, as_user_id: "anon-k1", captures: { c1: $.data.id } }
            - { call: "POST /hotline/cases/${c1}/triage", payload: { confirmed_category: FRAUD, subject_seniority: STAFF, financial_exposure_band: NONE, reporter_vulnerability: NONE, triage_decision: PROCEED }, as: IntakeSpecialist, as_user_id: "${s_int}", captures: { c1_v: $.data.version } }
            - { call: "POST /hotline/cases/${c1}/assignments", payload: { expected_case_version: "${c1_v}", investigator_id: "${s_inv}", override_reason: "Only investigator" }, as: ComplianceOfficer, as_user_id: "${s_off}", captures: { a1: $.data.id } }
            - { call: "POST /hotline/assignments/${a1}/screen", payload: { outcome: CLEAR }, as: IntakeSpecialist, as_user_id: "${s_int}" }
            - { call: "POST /hotline/assignments/${a1}/activate", as: ComplianceOfficer, as_user_id: "${s_off}" }
            - { call: "POST /hotline/cases", payload: { channel: EMAIL, category: SAFETY, description: "Allegation of unsafe warehouse practice", region: SOUTH, subject_employee_ids: [] }, as: HotlineReporter, as_user_id: "anon-k2", captures: { c2: $.data.id } }
            - { call: "POST /hotline/cases/${c2}/triage", payload: { confirmed_category: SAFETY, subject_seniority: STAFF, financial_exposure_band: NONE, reporter_vulnerability: NONE, triage_decision: PROCEED }, as: IntakeSpecialist, as_user_id: "${s_int}", captures: { c2_v: $.data.version } }
            - { call: "POST /hotline/cases/${c2}/assignments", payload: { expected_case_version: "${c2_v}", investigator_id: "${s_inv}", override_reason: "Override despite load" }, as: ComplianceOfficer, as_user_id: "${s_off}", captures: { a2: $.data.id } }
            - { call: "POST /hotline/assignments/${a2}/screen", payload: { outcome: CLEAR }, as: IntakeSpecialist, as_user_id: "${s_int}" }
          trigger:
            - { call: "POST /hotline/assignments/${a2}/activate", as: ComplianceOfficer, as_user_id: "${s_off}", captures: { err_id: "$.data.error_id" } }
          assert:
            - "err_id == ERR_INVESTIGATOR_CAPACITY_EXCEEDED (active_case_count 1 == max_active_cases 1; strict < comparison)"
            - "StaffMember.${s_inv}.active_case_count remains 1; CaseAssignment.${a2}.status remains CLEARED"

      - name: retaliation_threshold_three_vs_four
        grounds:
          - calculations.retaliation_risk_score
          - entities.HotlineCase.fields.retaliation_risk_score
          - state_machines.HotlineCase.MONITORING_to_REOPENED
        distinguishing_aspect: |
          Metric: rolling-window risk score; endpoint: POST /hotline/cases/{id}/retaliation-flags.
          MANUAL(1) + HR_SIGNAL(2) = 3 leaves the case in MONITORING; one more MANUAL(1)
          reaches exactly 4 and the >= threshold fires the escalation cascade.
        test_recipe:
          setup:
            - "Staff: intake, off1, off2, inv; LOW case closed into MONITORING (reporter acknowledged)"
          setup_api_calls:
            - { call: "POST /hotline/staff-members", payload: { display_name: "Ingrid Intake", email: "intake@corp.example", department: "Ethics", capabilities: [INTAKE], max_active_cases: 5 }, as: EthicsPlatformAdmin, captures: { s_int: $.data.id } }
            - { call: "POST /hotline/staff-members", payload: { display_name: "Olivia Officer", email: "officer@corp.example", department: "Ethics", capabilities: [OFFICER], max_active_cases: 5 }, as: EthicsPlatformAdmin, captures: { s_off: $.data.id } }
            - { call: "POST /hotline/staff-members", payload: { display_name: "Oscar Officer", email: "officer2@corp.example", department: "Ethics", capabilities: [OFFICER], max_active_cases: 5 }, as: EthicsPlatformAdmin, captures: { s_off2: $.data.id } }
            - { call: "POST /hotline/staff-members", payload: { display_name: "Ian Vest", email: "investigator@corp.example", department: "Ops", capabilities: [INVESTIGATION], max_active_cases: 5 }, as: EthicsPlatformAdmin, captures: { s_inv: $.data.id } }
            - { call: "POST /hotline/cases", payload: { channel: WEB_PORTAL, category: OTHER, description: "Allegation of minor policy lapse", region: NORTH, subject_employee_ids: [] }, as: HotlineReporter, as_user_id: "anon-t3", captures: { c1: $.data.id, key1: $.data.reporter_access_key } }
            - { call: "POST /hotline/cases/${c1}/triage", payload: { confirmed_category: OTHER, subject_seniority: STAFF, financial_exposure_band: NONE, reporter_vulnerability: NONE, triage_decision: PROCEED }, as: IntakeSpecialist, as_user_id: "${s_int}", captures: { c1_v: $.data.version } }
            - { call: "POST /hotline/cases/${c1}/assignments", payload: { expected_case_version: "${c1_v}" }, as: IntakeSpecialist, as_user_id: "${s_int}", captures: { a1: $.data.id } }
            - { call: "POST /hotline/assignments/${a1}/screen", payload: { outcome: CLEAR }, as: IntakeSpecialist, as_user_id: "${s_int}" }
            - { call: "POST /hotline/assignments/${a1}/activate", as: ComplianceOfficer, as_user_id: "${s_off}" }
            - { call: "POST /hotline/interviews", payload: { case_id: "${c1}", interviewee_role: WITNESS, interviewee_identifier: "w-1", scheduled_start: "2026-08-03T10:00:00Z", scheduled_end: "2026-08-03T11:00:00Z" }, as: Investigator, as_user_id: "${s_inv}", captures: { iv1: $.data.id } }
            - { call: "POST /hotline/interviews/${iv1}/conclude", payload: { outcome: CONDUCTED, summary: "Interview conducted on site with the witness present throughout." }, as: Investigator, as_user_id: "${s_inv}" }
            - { call: "POST /hotline/evidence-items", payload: { case_id: "${c1}", evidence_type: DOCUMENT, description: "Policy acknowledgement form", checksum: "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa", captured_at: "2026-08-03T00:00:00Z" }, as: Investigator, as_user_id: "${s_inv}", captures: { ev1: $.data.id } }
            - { call: "POST /hotline/evidence-items/${ev1}/seal", as: IntakeSpecialist, as_user_id: "${s_int}" }
            - { call: "GET /hotline/cases/${c1}", as: ComplianceOfficer, as_user_id: "${s_off}", captures: { c1_v2: $.data.version } }
            - { call: "POST /hotline/cases/${c1}/determinations", payload: { finding: UNSUBSTANTIATED, rationale: "Evidence reviewed shows the allegation is not supported on the balance of proof.", expected_case_version: "${c1_v2}" }, as: Investigator, as_user_id: "${s_inv}", captures: { d1: $.data.id } }
            - { call: "POST /hotline/determinations/${d1}/submit", as: Investigator, as_user_id: "${s_inv}" }
            - { call: "POST /hotline/determinations/${d1}/review", payload: { decision: APPROVE, review_notes: "Reviewed and accepted.", notice_summary: "Case closed with no findings disclosed." }, as: ComplianceOfficer, as_user_id: "${s_off2}" }
            - { call: "GET /hotline/cases/${c1}/closure-notices", as: ComplianceOfficer, as_user_id: "${s_off}", captures: { n1: "$.data[0].id" } }
            - { call: "POST /hotline/closure-notices/${n1}/acknowledge", as: HotlineReporter, as_user_id: "${key1}" }
          trigger:
            - { call: "POST /hotline/cases/${c1}/retaliation-flags", payload: { reported_via: MANUAL, description: "Anecdotal cold-shoulder signal" }, as: ComplianceOfficer, as_user_id: "${s_off}", captures: { f1: $.data.id } }
            - { call: "POST /hotline/cases/${c1}/retaliation-flags", payload: { reported_via: HR_SIGNAL, description: "Manager excluded reporter from meetings" }, as: ComplianceOfficer, as_user_id: "${s_off}", captures: { f2: $.data.id } }
            - { call: "GET /hotline/cases/${c1}", as: ComplianceOfficer, as_user_id: "${s_off}", captures: { st_mid: $.data.status, score_mid: $.data.retaliation_risk_score } }
            - { call: "POST /hotline/cases/${c1}/retaliation-flags", payload: { reported_via: MANUAL, description: "Performance review suddenly negative" }, as: ComplianceOfficer, as_user_id: "${s_off}", captures: { f3: $.data.id, f3_st: $.data.status } }
          assert:
            - "st_mid == MONITORING and score_mid == 3 (1 + 2; below threshold)"
            - "after the third flag: score reaches exactly 4 and f3_st == ESCALATED"
            - "HotlineCase.${c1}.status == REOPENED (threshold uses >=, so 4 fires)"

  # =====================================================================
  # Rule 7 — cross_entity_state_dependency
  # =====================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: interview_gated_by_case_state
        grounds:
          - state_machines.HotlineCase.ASSIGNED_to_UNDER_INVESTIGATION
          - errors[ERR_CASE_NOT_UNDER_INVESTIGATION]
          - entities.Interview.fields.case_id
        distinguishing_aspect: |
          Entity pair Interview -> HotlineCase: an interview can only be created while
          the parent case is UNDER_INVESTIGATION; on an ASSIGNED (cleared, not activated)
          case the create is rejected, and it succeeds immediately after activation.
        test_recipe:
          setup:
            - "Staff: intake, off1, inv; case ASSIGNED to inv with assignment CLEARED but not yet activated"
          setup_api_calls:
            - { call: "POST /hotline/staff-members", payload: { display_name: "Ingrid Intake", email: "intake@corp.example", department: "Ethics", capabilities: [INTAKE], max_active_cases: 5 }, as: EthicsPlatformAdmin, captures: { s_int: $.data.id } }
            - { call: "POST /hotline/staff-members", payload: { display_name: "Olivia Officer", email: "officer@corp.example", department: "Ethics", capabilities: [OFFICER], max_active_cases: 5 }, as: EthicsPlatformAdmin, captures: { s_off: $.data.id } }
            - { call: "POST /hotline/staff-members", payload: { display_name: "Ian Vest", email: "investigator@corp.example", department: "Ops", capabilities: [INVESTIGATION], max_active_cases: 5 }, as: EthicsPlatformAdmin, captures: { s_inv: $.data.id } }
