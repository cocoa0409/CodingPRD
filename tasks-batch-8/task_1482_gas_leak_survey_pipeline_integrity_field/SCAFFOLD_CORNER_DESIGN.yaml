  # =============================================================================
  # Section: errors — Table 6 claims: every catalog error triggerable. Only
  # errors not already triggered by another section's instances appear here as
  # full instances; §1.8-covered errors appear as excluded stubs.
  # =============================================================================
  - section: errors
    instances:
      - name: unauthenticated_missing_role_header
        claim_type: violation_to_error
        grounds:
          - validations[priority=1]
          - errors[ERR_UNAUTHENTICATED]
        distinguishing_aspect: "Priority-1 check: a request sent WITHOUT the X-User-Role header (the fixture strips the auth headers that 'as' would normally attach) is rejected 401 ERR_UNAUTHENTICATED before any other check."
        test_recipe:
          setup:
            - "Empty DB"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: IntegrityAnalyst
          trigger:
            - call: "POST /pipe-segments"
              payload: { segment_code: "SEG-AUTH", install_year: 2001, material: "STEEL", diameter_inches: 6.0, length_feet: 1000.0, operating_pressure_psi: 60.0, pressure_class: "DISTRIBUTION", is_high_consequence_area: false }
              as: IntegrityAnalyst
              captures: { err: $.data.error_id }
          assert:
            - "Request is dispatched with X-User-Role and X-User-ID headers REMOVED (overriding the as: identity)"
            - "err == ERR_UNAUTHENTICATED"
            - "HTTP status == 401"

      - name: segregation_of_duties_on_own_run_accept
        claim_type: violation_to_error
        grounds:
          - validations[priority=6]
          - errors[ERR_SEGREGATION_OF_DUTIES]
        distinguishing_aspect: "Segregation of duties on POST /survey-runs/{id}/accept: when the caller's X-User-ID equals SurveyRun.technician_id, accept fails 422 ERR_SEGREGATION_OF_DUTIES even though the role (IntegrityAnalyst) is permitted."
        test_recipe:
          setup:
            - "SUBMITTED run owned by technician FT-1; accept attempted with X-User-ID == FT-1's id"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: IntegrityAnalyst
            - call: "POST /field-technicians"
              payload: { employee_code: "FT-1", full_name: "Tech One", qualified_methods: ["WALKING"], home_region: "NORTH" }
