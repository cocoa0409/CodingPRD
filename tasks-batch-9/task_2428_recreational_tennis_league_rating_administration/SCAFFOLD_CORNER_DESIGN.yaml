            - "$.data.error_id == 'ERR_INVALID_STATE'"
            - "a follow-up GET /tennis/teams/${tma_id} returns $.data.status == 'DRAFT' and $.data.active_roster_size == 1"
            - "a follow-up GET /tennis/roster-spots/${rsa1_id} returns $.data.status == 'ACTIVE'"

