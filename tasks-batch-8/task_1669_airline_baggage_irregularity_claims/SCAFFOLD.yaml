scenario: |
  Airline Baggage Irregularity & Claims (airline baggage service office): mishandled bag report & world tracer file, tracing across interline carriers, delivery service dispatch & courier tracking, interim expense reimbursement policy, declared value & liability limit application, damaged bag repair vs replace depreciation, file closure & final claim payment, root-cause station reporting

domain_name: airline-baggage-claims
api_prefix: /baggage

complexity_profile:
  primary_archetype: workflow_orchestration
  secondary_archetype: ledger_reconciliation
  complexity_layers:
    - dual_variant_calculation
    - cascading_side_effects
    - optimistic_concurrency
    - scheduled_actions
  entity_topology: flat
  state_machine_shape: cyclic
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: peer_roles
  consistency_model: immediate

# =============================================================================
# Table 1: Entity-Relationship Table
# =============================================================================
entities:
  - name: Station
    parent: null
    common_fields: true
    fields:
      - { name: station_code, type: string, source: input, description: "IATA station code, unique (e.g. JFK)" }
      - { name: name, type: string, source: input, description: "Station display name" }
      - { name: bags_handled_total, type: integer, source: input, description: "Annualized bags handled at this station; denominator for mishandled rate; must be >= 0" }
      - { name: open_report_count, type: integer, source: computed, description: "Count of IrregularityReports filed at this station whose status is not CLOSED; +1 on report creation, -1 when report reaches CLOSED" }
      - { name: recovered_bag_count, type: integer, source: computed, description: "Count of TracingEvents with event_type=LOCATED recorded at this station" }
      - { name: mishandled_report_count, type: integer, source: computed, description: "Count of CLOSED IrregularityReports whose root_cause_station_id references this station" }

  - name: Carrier
    parent: null
    common_fields: true
    fields:
      - { name: carrier_code, type: string, source: input, description: "Airline designator code, unique (e.g. AA)" }
      - { name: name, type: string, source: input, description: "Carrier name" }
      - { name: is_interline_partner, type: boolean, source: input, description: "Whether this carrier is an interline partner whose tracing messages are accepted" }

  - name: CourierService
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Courier vendor name" }
      - { name: serves_station_ids, type: array, source: input, description: "FK -> Station.id (array); station ids this courier delivers from" }
      - { name: turnaround_buffer_minutes, type: integer, source: input, description: "Buffer applied on both sides of every dispatch window when checking conflicts; must be >= 0" }
      - { name: active_dispatch_count, type: integer, source: computed, description: "Count of DeliveryDispatches for this courier in status DISPATCHED or FAILED_ATTEMPT" }

  - name: RepairVendor
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Repair vendor name" }
      - { name: bench_capacity, type: integer, source: input, description: "Maximum concurrently open repair orders; must be >= 1" }
      - { name: occupied_bench_slots, type: integer, source: computed, description: "Count of RepairOrders at this vendor in status INTAKE, REPAIR_IN_PROGRESS, or REPLACEMENT_PENDING" }
      - { name: available_bench_slots, type: integer, source: computed, description: "bench_capacity - occupied_bench_slots" }

  - name: Passenger
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Passenger full name" }
      - { name: email, type: string, source: input, description: "Contact email, unique" }
      - { name: tier, type: enum, source: input, default: STANDARD, description: "STANDARD | PREMIUM | ELITE; drives interim expense daily cap for DOMESTIC reports" }

  - name: BagTag
    parent: null
    common_fields: true
    fields:
      - { name: tag_number, type: string, source: input, description: "10-digit bag tag number, unique across all bag tags" }
      - { name: passenger_id, type: string, source: input, description: "FK -> Passenger.id; the passenger who checked the bag" }
      - { name: routing_carrier_ids, type: array, source: input, description: "FK -> Carrier.id (array, ordered by travel sequence); the LAST element is the delivering carrier, which becomes the liable carrier on any report" }
      - { name: is_international, type: boolean, source: input, description: "Whether the routing crosses a country border; drives liability_regime on reports" }
      - { name: weight_kg, type: integer, source: input, description: "Checked weight in whole kilograms; must be >= 1" }
      - { name: declared_value_cents, type: integer, source: input, default: 0, description: "Excess value declared at check-in; must be <= 500000 (ERR_DECLARED_VALUE_EXCEEDS_MAX)" }
      - { name: status, type: enum, source: system, description: "CHECKED | MISHANDLED | IN_RECOVERY | DELIVERED | DELIVERED_DAMAGED | CLAIMED_LOST" }

  - name: IrregularityReport
    parent: null
    common_fields: true
    fields:
      - { name: report_reference, type: string, source: input, description: "WorldTracer file reference, unique (e.g. JFKAA00001)" }
      - { name: passenger_id, type: string, source: input, description: "FK -> Passenger.id; must equal the referenced bag tag's passenger_id" }
      - { name: bag_tag_id, type: string, source: input, description: "FK -> BagTag.id; at most one non-CLOSED report per bag tag" }
      - { name: station_id, type: string, source: input, description: "FK -> Station.id; the filing (baggage service office) station" }
      - { name: type, type: enum, source: input, description: "DELAYED | DAMAGED | PILFERED" }
      - { name: status, type: enum, source: system, description: "OPEN | TRACING | FOUND_PENDING_DELIVERY | DELIVERY_IN_PROGRESS | DELIVERED | DECLARED_LOST | DAMAGE_REVIEW | CLAIM_REVIEW | SETTLEMENT_OFFERED | SETTLEMENT_ACCEPTED | CLOSED" }
      - { name: opened_on, type: string, source: computed, description: "Date (YYYY-MM-DD) portion of created_at; start of the interim expense eligibility window" }
      - { name: delivered_on, type: string, source: system, description: "Date the bag was delivered; null until delivery; closes the expense eligibility window" }
      - { name: liability_regime, type: enum, source: computed, description: "MONTREAL if bag tag is_international else DOMESTIC" }
      - { name: liable_carrier_id, type: string, source: computed, description: "FK -> Carrier.id; last element of the bag tag's routing_carrier_ids (delivering carrier is liable)" }
      - { name: effective_cap_cents, type: integer, source: computed, description: "max(regime base cap, declared_value_cents); see liability_cap calculation" }
      - { name: contents_loss_cents, type: integer, source: system, description: "Declared contents loss recorded by assess-loss; null until assessed" }
      - { name: damage_repairable, type: boolean, source: system, description: "Recorded by assess-damage; null until assessed" }
      - { name: contents_damage_cents, type: integer, source: system, description: "Contents damage amount recorded by assess-damage; null until assessed" }
      - { name: repair_payout_cents, type: integer, source: system, default: 0, description: "Payout from the completed repair order; set when a repair order reaches a settled state" }
      - { name: root_cause, type: enum, source: input, description: "MISCONNECT | BAGROOM_ERROR | LOADING_ERROR | TAGGING_ERROR | SECURITY_HOLD; recorded at offer-settlement" }
      - { name: root_cause_station_id, type: string, source: input, description: "FK -> Station.id; station attributed with the root cause at offer-settlement" }
      - { name: settlement_offer_cents, type: integer, source: computed, description: "Computed at offer-settlement; see settlement_offer calculation" }
      - { name: amount_payable_cents, type: integer, source: computed, description: "settlement_offer_cents minus settlement_component_cents of ISSUED/PAID SettlementPayments; restored on void" }
      - { name: expenses_approved_unpaid_cents, type: integer, source: computed, description: "Sum of reimbursable_total_cents over ExpenseClaims in APPROVED or SETTLEMENT_EARMARKED status" }
      - { name: expenses_paid_cents, type: integer, source: computed, description: "Sum of reimbursable_total_cents over ExpenseClaims in PAID status" }

  - name: TracingEvent
    parent: null
    common_fields: false
    fields:
      - { name: report_id, type: string, source: input, description: "FK -> IrregularityReport.id; report this tracing message belongs to (from URL path)" }
      - { name: carrier_id, type: string, source: input, description: "FK -> Carrier.id; carrier that sent the tracing message" }
      - { name: station_id, type: string, source: input, description: "FK -> Station.id; station the message reports from" }
      - { name: event_type, type: enum, source: input, description: "FORWARDED | LOCATED | ON_HAND_AT_STATION | IN_TRANSIT_TO | DELIVERY_ARRANGED | MISSCAN_CORRECTED" }
      - { name: occurred_at, type: datetime, source: system, description: "Logical-clock timestamp when the event was recorded" }
      - { name: notes, type: string, source: input, description: "Free-text notes; optional", default: "" }

  - name: DeliveryDispatch
    parent: null
    common_fields: true
    fields:
      - { name: report_id, type: string, source: input, description: "FK -> IrregularityReport.id; report whose found bag is being delivered" }
      - { name: courier_service_id, type: string, source: input, description: "FK -> CourierService.id" }
      - { name: pickup_at, type: datetime, source: input, description: "Pickup window start (ISO8601); must be >= current logical clock time" }
      - { name: travel_minutes, type: integer, source: input, description: "Window length in minutes; dispatch window is [pickup_at, pickup_at + travel_minutes]; must be >= 1" }
      - { name: delivery_address, type: string, source: input, description: "Delivery destination address" }
      - { name: attempt_count, type: integer, source: system, default: 1, description: "Delivery attempt number; 1 at creation, +1 on each reschedule; failure at attempt_count >= 3 is permanent" }
      - { name: status, type: enum, source: system, description: "DISPATCHED | FAILED_ATTEMPT | DELIVERED | FAILED_PERMANENT" }

  - name: RepairOrder
    parent: null
    common_fields: true
    fields:
      - { name: report_id, type: string, source: input, description: "FK -> IrregularityReport.id; must be a DAMAGED report in DAMAGE_REVIEW with damage_repairable = true" }
      - { name: vendor_id, type: string, source: input, description: "FK -> RepairVendor.id" }
      - { name: intake_date, type: string, source: input, description: "Bench occupancy start date (YYYY-MM-DD); order occupies [intake_date, promised_date) half-open" }
      - { name: promised_date, type: string, source: input, description: "Promised completion date; must be strictly after intake_date (ERR_REPAIR_WINDOW_INVALID)" }
      - { name: purchase_price_cents, type: integer, source: input, description: "Original purchase price of the bag; must be >= 0" }
      - { name: purchase_date, type: string, source: input, description: "Original purchase date (YYYY-MM-DD); must be <= intake_date" }
      - { name: repair_estimate_cents, type: integer, source: input, description: "Vendor repair estimate; must be >= 0" }
      - { name: depreciated_value_cents, type: integer, source: computed, description: "Computed at decide; see depreciation_and_repair_decision" }
      - { name: decision, type: enum, source: computed, description: "REPAIR | REPLACE; null until decide; computed, never client-supplied" }
      - { name: payout_cents, type: integer, source: computed, description: "Set at complete: REPAIR -> min(repair_estimate_cents, depreciated_value_cents); REPLACE -> depreciated_value_cents" }
      - { name: status, type: enum, source: system, description: "INTAKE | REPAIR_IN_PROGRESS | REPLACEMENT_PENDING | REPAIR_SETTLED | REPLACE_SETTLED | CANCELLED" }

  - name: ExpenseClaim
    parent: null
    common_fields: true
    fields:
      - { name: report_id, type: string, source: input, description: "FK -> IrregularityReport.id; must be a DELAYED report in an expense-accepting status" }
      - { name: receipts, type: array, source: input, description: "Receipts: [{ incurred_on (YYYY-MM-DD), description, amount_minor (integer >= 1), currency_code (USD|EUR|JPY) }]; must be non-empty" }
      - { name: claimed_total_cents, type: integer, source: computed, description: "Sum over receipts of USD-converted amount (per-receipt round_half_up); pre-cap; validated <= 300000 at creation" }
      - { name: eligible_receipt_count, type: integer, source: computed, description: "Receipts with opened_on <= incurred_on <= min(delivered_on, opened_on + 5 days) (delivered_on treated as +infinity when null)" }
      - { name: reimbursable_total_cents, type: integer, source: computed, description: "Computed at adjudicate-APPROVE per expense_reimbursement; null while SUBMITTED; 0 path not used for REJECT" }
      - { name: decision_reason, type: string, source: system, description: "Reject reason recorded at adjudicate-REJECT; null otherwise" }
      - { name: status, type: enum, source: system, description: "SUBMITTED | APPROVED | SETTLEMENT_EARMARKED | PAID | REJECTED" }

  - name: SettlementPayment
    parent: null
    common_fields: true
    fields:
      - { name: report_id, type: string, source: system, description: "FK -> IrregularityReport.id; report being settled (from URL path)" }
      - { name: settlement_component_cents, type: integer, source: system, description: "Snapshot of report.amount_payable_cents at creation" }
      - { name: expense_component_cents, type: integer, source: system, description: "Sum of reimbursable_total_cents over the report's APPROVED expense claims at creation; those claims become SETTLEMENT_EARMARKED" }
      - { name: amount_cents, type: integer, source: computed, description: "settlement_component_cents + expense_component_cents" }
      - { name: status, type: enum, source: system, description: "ISSUED | PAID | VOIDED" }

# =============================================================================
# Table 2: State Machine Table
# =============================================================================
state_machines:
  - entity: BagTag
    initial_state: CHECKED
    terminal_states: [DELIVERED, DELIVERED_DAMAGED, CLAIMED_LOST]
    transitions:
      - from: CHECKED
        to: MISHANDLED
        trigger: "system (on IrregularityReport creation with type=DELAYED referencing this bag tag)"
        actor: system
        preconditions: []
        side_effects: []

      - from: CHECKED
        to: DELIVERED_DAMAGED
        trigger: "system (on IrregularityReport creation with type=DAMAGED or PILFERED referencing this bag tag)"
        actor: system
        preconditions: []
        side_effects: []

      - from: MISHANDLED
        to: IN_RECOVERY
        trigger: "system (when a TracingEvent with event_type=LOCATED is recorded on the report)"
        actor: system
        preconditions: []
        side_effects: []

      - from: IN_RECOVERY
        to: DELIVERED
        trigger: "system (when the report's DeliveryDispatch is marked delivered)"
        actor: system
        preconditions: []
        side_effects: []

      - from: MISHANDLED
        to: CLAIMED_LOST
        trigger: "system (when the report is swept to DECLARED_LOST by the tracing-timeout sweep)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: IrregularityReport
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: TRACING
        trigger: "system (immediately on creation when type=DELAYED)"
        actor: system
        preconditions: []
        side_effects:
          - "BagTag.status CHECKED -> MISHANDLED"
          - "Station(station_id).open_report_count += 1"

      - from: OPEN
        to: DAMAGE_REVIEW
        trigger: "system (immediately on creation when type=DAMAGED or PILFERED)"
        actor: system
        preconditions: []
        side_effects:
          - "BagTag.status CHECKED -> DELIVERED_DAMAGED"
          - "Station(station_id).open_report_count += 1"

      - from: TRACING
        to: FOUND_PENDING_DELIVERY
        trigger: "POST /baggage/reports/{id}/tracing-events with event_type=LOCATED"
        actor: BaggageServiceAgent
        preconditions:
          - "Report status == TRACING (ERR_REPORT_NOT_TRACING)"
        side_effects:
          - "TracingEvent row created (occurred_at = logical clock)"
          - "BagTag.status MISHANDLED -> IN_RECOVERY (this mutation itself triggers the next hop)"
          - "Station(TracingEvent.station_id).recovered_bag_count += 1 (caused by the LOCATED event recorded against that station)"

      - from: TRACING
        to: DECLARED_LOST
        trigger: "system (tracing-timeout sweep executed by POST /_clock/set_current_utc: current_utc >= report.created_at + 504 hours AND no LOCATED TracingEvent exists for the report)"
        actor: system
        preconditions: []
        side_effects:
          - "BagTag.status MISHANDLED -> CLAIMED_LOST"

      - from: FOUND_PENDING_DELIVERY
        to: DELIVERY_IN_PROGRESS
        trigger: "POST /baggage/dispatches"
        actor: BaggageServiceAgent
        preconditions:
          - "Report status == FOUND_PENDING_DELIVERY (ERR_REPORT_NOT_AWAITING_DELIVERY)"
          - "report.station_id in CourierService.serves_station_ids (ERR_COURIER_ZONE_MISMATCH)"
          - "pickup_at >= current logical clock (ERR_PICKUP_IN_PAST)"
          - "No dispatch window conflict for the courier (ERR_DISPATCH_WINDOW_CONFLICT)"
        side_effects:
          - "DeliveryDispatch created with status=DISPATCHED, attempt_count=1"
          - "CourierService.active_dispatch_count += 1"

      - from: DELIVERY_IN_PROGRESS
        to: DELIVERED
        trigger: "POST /baggage/dispatches/{id}/mark-delivered"
        actor: BaggageServiceAgent
        preconditions:
          - "Dispatch status == DISPATCHED (ERR_INVALID_STATE_TRANSITION)"
        side_effects:
          - "DeliveryDispatch.status -> DELIVERED"
          - "BagTag.status IN_RECOVERY -> DELIVERED (this mutation itself stamps the next field)"
          - "report.delivered_on = current logical clock date (closes expense eligibility window for future adjudications)"
          - "CourierService.active_dispatch_count -= 1"

      - from: DELIVERY_IN_PROGRESS
        to: FOUND_PENDING_DELIVERY
        trigger: "system (when the report's DeliveryDispatch reaches FAILED_PERMANENT)"
        actor: system
        preconditions: []
        side_effects:
          - "BagTag remains IN_RECOVERY; report can accept a new dispatch"

      - from: DELIVERED
        to: CLAIM_REVIEW
        trigger: "POST /baggage/reports/{id}/open-claim-review"
        actor: ClaimsAdjuster
        preconditions:
          - "Report status == DELIVERED (ERR_REPORT_NOT_DELIVERED)"
        side_effects: []

      - from: DECLARED_LOST
        to: CLAIM_REVIEW
        trigger: "POST /baggage/reports/{id}/assess-loss"
        actor: ClaimsAdjuster
        preconditions:
          - "Report status == DECLARED_LOST (ERR_REPORT_NOT_DECLARED_LOST)"
        side_effects:
          - "report.contents_loss_cents = input contents_loss_cents"

      - from: DAMAGE_REVIEW
        to: CLAIM_REVIEW
        trigger: "POST /baggage/reports/{id}/assess-damage with repairable=false"
        actor: ClaimsAdjuster
        preconditions:
          - "Report status == DAMAGE_REVIEW (ERR_REPORT_NOT_IN_DAMAGE_REVIEW)"
        side_effects:
          - "report.damage_repairable = false; report.contents_damage_cents = input (default 0)"

      - from: DAMAGE_REVIEW
        to: CLAIM_REVIEW
        trigger: "system (when a linked RepairOrder reaches REPAIR_SETTLED or REPLACE_SETTLED)"
        actor: system
        preconditions:
          - "Report status == DAMAGE_REVIEW"
        side_effects:
          - "report.repair_payout_cents = RepairOrder.payout_cents"
          - "All other RepairOrders of this report in INTAKE/REPAIR_IN_PROGRESS/REPLACEMENT_PENDING -> CANCELLED, releasing their vendor bench slots"

      - from: CLAIM_REVIEW
        to: SETTLEMENT_OFFERED
        trigger: "POST /baggage/reports/{id}/offer-settlement"
        actor: ClaimsAdjuster
        preconditions:
          - "Report status == CLAIM_REVIEW (ERR_REPORT_NOT_IN_CLAIM_REVIEW)"
        side_effects:
          - "Compute settlement_offer_cents per settlement_offer calculation"
          - "report.root_cause and root_cause_station_id recorded from input"
          - "report.amount_payable_cents = settlement_offer_cents"

      - from: SETTLEMENT_OFFERED
        to: SETTLEMENT_ACCEPTED
        trigger: "POST /baggage/reports/{id}/accept-settlement"
        actor: Passenger (owner)
        preconditions:
          - "Report status == SETTLEMENT_OFFERED (ERR_SETTLEMENT_NOT_OFFERED)"
          - "X-User-ID == report.passenger_id (ERR_NOT_RESOURCE_OWNER)"
        side_effects: []

      - from: SETTLEMENT_OFFERED
        to: CLAIM_REVIEW
        trigger: "POST /baggage/reports/{id}/reject-settlement"
        actor: Passenger (owner)
        preconditions:
          - "Report status == SETTLEMENT_OFFERED (ERR_SETTLEMENT_NOT_OFFERED)"
          - "X-User-ID == report.passenger_id (ERR_NOT_RESOURCE_OWNER)"
        side_effects:
          - "settlement_offer_cents, root_cause, root_cause_station_id cleared; amount_payable_cents reset to 0"

      - from: SETTLEMENT_ACCEPTED
        to: CLOSED
        trigger: "POST /baggage/settlement-payments/{id}/mark-paid"
        actor: ClaimsAdjuster
        preconditions:
          - "SettlementPayment status == ISSUED (ERR_INVALID_STATE_TRANSITION)"
        side_effects:
          - "SettlementPayment.status -> PAID"
          - "All SETTLEMENT_EARMARKED ExpenseClaims of the report -> PAID"
          - "report.expenses_paid_cents += payment.expense_component_cents; expenses_approved_unpaid_cents -= payment.expense_component_cents"
          - "Station(root_cause_station_id).mishandled_report_count += 1"
          - "Station(station_id).open_report_count -= 1"

  - entity: DeliveryDispatch
    initial_state: DISPATCHED
    terminal_states: [DELIVERED, FAILED_PERMANENT]
    transitions:
      - from: DISPATCHED
        to: DELIVERED
        trigger: "POST /baggage/dispatches/{id}/mark-delivered"
        actor: BaggageServiceAgent
        preconditions: []
        side_effects:
          - "Report DELIVERY_IN_PROGRESS -> DELIVERED (see IrregularityReport machine for the full cascade)"
          - "CourierService.active_dispatch_count -= 1"

      - from: DISPATCHED
        to: FAILED_ATTEMPT
        trigger: "POST /baggage/dispatches/{id}/mark-failed when attempt_count < 3"
        actor: BaggageServiceAgent
        preconditions: []
        side_effects: []

      - from: DISPATCHED
        to: FAILED_PERMANENT
        trigger: "POST /baggage/dispatches/{id}/mark-failed when attempt_count >= 3"
        actor: BaggageServiceAgent
        preconditions: []
        side_effects:
          - "Report DELIVERY_IN_PROGRESS -> FOUND_PENDING_DELIVERY"
          - "CourierService.active_dispatch_count -= 1"

      - from: FAILED_ATTEMPT
        to: DISPATCHED
        trigger: "POST /baggage/dispatches/{id}/reschedule"
        actor: BaggageServiceAgent
        preconditions:
          - "Dispatch status == FAILED_ATTEMPT (ERR_DISPATCH_NOT_RESCHEDULABLE)"
          - "new_pickup_at >= current logical clock (ERR_PICKUP_IN_PAST)"
          - "Window conflict re-validated excluding this dispatch's own window (ERR_DISPATCH_WINDOW_CONFLICT)"
        side_effects:
          - "attempt_count += 1; pickup_at = new_pickup_at"

  - entity: RepairOrder
    initial_state: INTAKE
    terminal_states: [REPAIR_SETTLED, REPLACE_SETTLED, CANCELLED]
    transitions:
      - from: INTAKE
        to: REPAIR_IN_PROGRESS
        trigger: "POST /baggage/repair-orders/{id}/decide when computed decision == REPAIR"
        actor: ClaimsAdjuster
        preconditions:
          - "Order status == INTAKE (ERR_INVALID_STATE_TRANSITION)"
        side_effects:
          - "depreciated_value_cents and decision=REPAIR computed and stored"

      - from: INTAKE
        to: REPLACEMENT_PENDING
        trigger: "POST /baggage/repair-orders/{id}/decide when computed decision == REPLACE"
        actor: ClaimsAdjuster
        preconditions:
          - "Order status == INTAKE (ERR_INVALID_STATE_TRANSITION)"
        side_effects:
          - "depreciated_value_cents and decision=REPLACE computed and stored"

      - from: REPAIR_IN_PROGRESS
        to: REPAIR_SETTLED
        trigger: "POST /baggage/repair-orders/{id}/complete"
        actor: ClaimsAdjuster
        preconditions: []
        side_effects:
          - "payout_cents = min(repair_estimate_cents, depreciated_value_cents)"
          - "RepairVendor.occupied_bench_slots -= 1 (available_bench_slots += 1)"
          - "Report DAMAGE_REVIEW -> CLAIM_REVIEW cascade (see IrregularityReport machine)"

      - from: REPLACEMENT_PENDING
        to: REPLACE_SETTLED
        trigger: "POST /baggage/repair-orders/{id}/complete"
        actor: ClaimsAdjuster
        preconditions: []
        side_effects:
          - "payout_cents = depreciated_value_cents"
          - "RepairVendor.occupied_bench_slots -= 1 (available_bench_slots += 1)"
          - "Report DAMAGE_REVIEW -> CLAIM_REVIEW cascade (see IrregularityReport machine)"

      - from: INTAKE
        to: CANCELLED
        trigger: "system (when the parent report leaves DAMAGE_REVIEW because another repair order settled)"
        actor: system
        preconditions: []
        side_effects:
          - "RepairVendor.occupied_bench_slots -= 1"

      - from: REPAIR_IN_PROGRESS
        to: CANCELLED
        trigger: "system (same as above)"
        actor: system
        preconditions: []
        side_effects:
          - "RepairVendor.occupied_bench_slots -= 1"

      - from: REPLACEMENT_PENDING
        to: CANCELLED
        trigger: "system (same as above)"
        actor: system
        preconditions: []
        side_effects:
          - "RepairVendor.occupied_bench_slots -= 1"

  - entity: ExpenseClaim
    initial_state: SUBMITTED
    terminal_states: [PAID, REJECTED]
    transitions:
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /baggage/expense-claims/{id}/adjudicate with decision=APPROVE"
        actor: ClaimsAdjuster
        preconditions:
          - "Claim status == SUBMITTED (ERR_INVALID_STATE_TRANSITION)"
        side_effects:
          - "reimbursable_total_cents computed per expense_reimbursement and stored"
          - "report.expenses_approved_unpaid_cents += reimbursable_total_cents"

      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /baggage/expense-claims/{id}/adjudicate with decision=REJECT"
        actor: ClaimsAdjuster
        preconditions:
          - "Claim status == SUBMITTED (ERR_INVALID_STATE_TRANSITION)"
        side_effects:
          - "decision_reason = input reject_reason"

      - from: APPROVED
        to: PAID
        trigger: "POST /baggage/expense-claims/{id}/pay (interim payment)"
        actor: ClaimsAdjuster
        preconditions:
          - "Claim status == APPROVED (ERR_CLAIM_NOT_PAYABLE)"
          - "Report status != CLOSED (ERR_INVALID_STATE_TRANSITION)"
        side_effects:
          - "report.expenses_approved_unpaid_cents -= reimbursable_total_cents"
          - "report.expenses_paid_cents += reimbursable_total_cents"

      - from: APPROVED
        to: SETTLEMENT_EARMARKED
        trigger: "system (when a SettlementPayment is created for the report; the claim is folded into expense_component_cents)"
        actor: system
        preconditions: []
        side_effects: []

      - from: SETTLEMENT_EARMARKED
        to: PAID
        trigger: "system (when the SettlementPayment is marked paid)"
        actor: system
        preconditions: []
        side_effects: []

      - from: SETTLEMENT_EARMARKED
        to: APPROVED
        trigger: "system (when the SettlementPayment is voided — compensation)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: SettlementPayment
    initial_state: ISSUED
    terminal_states: [PAID, VOIDED]
    transitions:
      - from: ISSUED
        to: PAID
        trigger: "POST /baggage/settlement-payments/{id}/mark-paid"
        actor: ClaimsAdjuster
        preconditions: []
        side_effects:
          - "Report SETTLEMENT_ACCEPTED -> CLOSED cascade (see IrregularityReport machine)"

      - from: ISSUED
        to: VOIDED
        trigger: "POST /baggage/settlement-payments/{id}/void"
        actor: ClaimsAdjuster
        preconditions: []
        side_effects:
          - "report.amount_payable_cents += settlement_component_cents (compensation restores payable)"
          - "All SETTLEMENT_EARMARKED ExpenseClaims of the report -> APPROVED (compensation)"
          - "Report remains SETTLEMENT_ACCEPTED; a superseding payment may be created with the fresh report version"

# =============================================================================
# 1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: settlement-create-stale-report
    parent_entity: IrregularityReport
    write_endpoint: "POST /baggage/reports/{id}/settlement-payments"
    occ_field: expected_report_version
    description: |
      Creating a SettlementPayment against an IrregularityReport whose version
      has advanced beyond the client's expected_report_version is rejected.
      This captures the case where another writer has just created a payment
      (or voided one, or re-offered a settlement after rejection) and the
      current writer's view of the report totals is therefore stale. Stated
      in OCC terms: stale version, rejected deterministically.
    error_id: ERR_STALE_REPORT_VERSION
    http_status: 412

# =============================================================================
# Table 3: Calculation Rules Table
# =============================================================================
calculations:
  - name: liability_cap
    trigger: "IrregularityReport creation (computed once, stored as effective_cap_cents)"
    algorithm: threshold
    formula: |
      if bag_tag.is_international:  base_cap_cents = MONTREAL_CAP_CENTS
      else:                          base_cap_cents = bag_tag.weight_kg * DOMESTIC_PER_KG_CENTS
      effective_cap_cents = max(base_cap_cents, bag_tag.declared_value_cents)
    input_set: "The report's bag tag (weight_kg, declared_value_cents, is_international)"
    constants:
      MONTREAL_CAP_CENTS: 170016
      DOMESTIC_PER_KG_CENTS: 2500
      DECLARED_VALUE_MAX_CENTS: 500000
    precision: "integer cents, no rounding"
    variants:
      - name: montreal_flat
        when: "bag_tag.is_international == true"
        difference: "Flat per-passenger cap of 170016 cents regardless of weight"
      - name: domestic_weight_based
        when: "bag_tag.is_international == false"
        difference: "Cap scales linearly with weight_kg (2500 cents/kg); same bag at 20kg yields 50000 vs 170016"

  - name: settlement_offer
    trigger: "POST /baggage/reports/{id}/offer-settlement (CLAIM_REVIEW -> SETTLEMENT_OFFERED)"
    algorithm: constraint_propagation
    formula: |
      # Evaluation order is pinned: (1) loss_basis by claim path, (2) cap, (3) min.
      if report entered CLAIM_REVIEW via DECLARED_LOST:
        loss_basis_cents = report.contents_loss_cents
      elif report.type == DAMAGED:
        loss_basis_cents = report.repair_payout_cents + (report.contents_damage_cents or 0)
      elif report.type == PILFERED:
        loss_basis_cents = report.contents_damage_cents or 0
      else:  # DELAYED delivered
        loss_basis_cents = 0
      settlement_offer_cents = min(report.effective_cap_cents, loss_basis_cents)
      report.amount_payable_cents = settlement_offer_cents
    input_set: "The single report in CLAIM_REVIEW; uses stored contents_loss_cents / repair_payout_cents / contents_damage_cents and effective_cap_cents"
    constants: {}
    precision: "integer cents, no rounding"

  - name: expense_reimbursement
    trigger: "POST /baggage/expense-claims/{id}/adjudicate with decision=APPROVE"
    algorithm: aggregation
    formula: |
      # Step 1 (shared): input-set filtering.
      window_end = min(report.delivered_on, report.opened_on + EXPENSE_WINDOW_DAYS days)
      eligible = receipts r where report.opened_on <= r.incurred_on <= window_end
      # Step 2 (shared): per-receipt FX conversion, ROUND PER RECEIPT THEN SUM.
      # Rounding order is pinned: convert each receipt to whole USD cents with
      # round_half_up FIRST, then sum. Sum-then-round is forbidden.
      converted(r) = r.amount_minor if r.currency_code == USD else round_half_up(r.amount_minor * FX_RATE[r.currency_code])
      # Step 3 (variant):
      DOMESTIC (report.liability_regime == DOMESTIC):
        group eligible receipts by incurred_on
        daily_total(d) = sum of converted(r) for r on day d
        daily_reimbursed(d) = min(daily_total(d), TIER_DAILY_CAP[passenger.tier])
        reimbursable_total_cents = sum over days of daily_reimbursed(d)
      MONTREAL (report.liability_regime == MONTREAL):
        pooled_total = sum of converted(r) over all eligible receipts
        reimbursable_total_cents = min(pooled_total, POOL_CAP_CENTS)
    input_set: "Receipts of the claim with incurred_on inside the eligibility window; receipts outside the window are excluded (not errors) and counted by eligible_receipt_count"
    constants:
      EXPENSE_WINDOW_DAYS: 5
      POOL_CAP_CENTS: 150000
      EXPENSE_CLAIM_MAX_CENTS: 300000
      FX_RATE: { USD: 1.0, EUR: 1.10, JPY: 0.0067 }
      TIER_DAILY_CAP: { STANDARD: 7500, PREMIUM: 10000, ELITE: 15000 }
    precision: "per-receipt conversion rounded to whole cents, round_half_up; sums are integer cents"
    variants:
      - name: domestic_per_day_cap
        when: "report.liability_regime == DOMESTIC"
        difference: "Each day's receipts are clipped at the passenger-tier daily cap before summing; a 20000-cent day yields 7500 for STANDARD"
      - name: montreal_pooled_cap
        when: "report.liability_regime == MONTREAL"
        difference: "All eligible receipts pool into one sum clipped only by the 150000-cent pool cap; the same receipts yield 23000 vs 10500"

  - name: depreciation_and_repair_decision
    trigger: "POST /baggage/repair-orders/{id}/decide"
    algorithm: decay_function
    formula: |
      years = number of full 365-day periods between purchase_date and intake_date (floor of day difference / 365)
      raw_value = purchase_price_cents * (1 - DEPRECIATION_RATE)^years
      depreciated_value_cents = max(round_half_up(raw_value), round_half_up(DEPRECIATION_FLOOR * purchase_price_cents))
      decision = REPAIR if repair_estimate_cents < REPLACE_THRESHOLD * depreciated_value_cents else REPLACE
      # at complete:
      payout_cents = min(repair_estimate_cents, depreciated_value_cents) if decision == REPAIR
                   = depreciated_value_cents if decision == REPLACE
    input_set: "The single repair order in INTAKE"
    constants:
      DEPRECIATION_RATE: 0.20
      DEPRECIATION_FLOOR: 0.10
      REPLACE_THRESHOLD: 0.75
    precision: "round_half_up to whole cents applied once at the end of raw_value; floor compared after rounding"

  - name: final_settlement_payment
    trigger: "POST /baggage/reports/{id}/settlement-payments"
    algorithm: aggregation
    formula: |
      settlement_component_cents = report.amount_payable_cents   # full unpaid settlement remainder
      earmarked = expense claims of report with status == APPROVED (all of them)
      expense_component_cents = sum of earmarked reimbursable_total_cents
      amount_cents = settlement_component_cents + expense_component_cents
      # Conservation invariant (money): for the report, at all times after offer-settlement,
      #   settlement_offer_cents == amount_payable_cents
      #     + sum(settlement_component_cents over payments with status in {ISSUED, PAID})
      #   (VOIDED payments contribute 0; void restores amount_payable_cents.)
    input_set: "The report in SETTLEMENT_ACCEPTED plus its APPROVED expense claims"
    constants: {}
    precision: "integer cents, no rounding"

  - name: station_irregularity_summary
    trigger: "GET /baggage/stations/{id}/irregularity-summary"
    algorithm: aggregation
    formula: |
      open_report_count: reports with station_id == station.id and status != CLOSED
      mishandled_report_count: reports with root_cause_station_id == station.id and status == CLOSED
      recovered_bag_count: TracingEvents with station_id == station.id and event_type == LOCATED
      by_root_cause: counts of those CLOSED attributed reports grouped by root_cause (zero-valued causes omitted)
      mishandled_rate_per_1000 = 0.0 if bags_handled_total == 0
                               else round_half_up(1000.0 * mishandled_report_count / bags_handled_total, 2 decimals)
    input_set: "Reports filtered by station_id / root_cause_station_id with explicit status filters; TracingEvents filtered by station_id and event_type=LOCATED; no time window"
    constants: {}
    precision: "rate: 2 decimal places, round_half_up"

# =============================================================================
# Table 4: Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers must be present and well-formed"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: "all"

  - priority: 2
    category: auth
    check: "Caller role must be listed in the endpoint's roles"
    error_id: ERR_FORBIDDEN_FOR_ROLE
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: auth
    check: "Ownership: for Passenger-scoped operations (expense claim creation, accept/reject settlement), X-User-ID must equal the report's passenger_id"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "POST /baggage/expense-claims, POST /baggage/reports/{id}/accept-settlement, POST /baggage/reports/{id}/reject-settlement"

  - priority: 4
    category: existence
    check: "Request body shape: required fields present, types correct, enum values valid, amounts non-negative, tag_number matches 10-digit format, receipts non-empty, no unknown/system-supplied fields"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all"

  - priority: 5
    category: existence
    check: "Path ids and body foreign keys (passenger_id, bag_tag_id, station_id, carrier ids in routing, courier_service_id, vendor_id, report_id, root_cause_station_id) must reference existing resources"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all resource endpoints"

  - priority: 6
    category: state
    check: "Target resource must be in the required state for the operation (machine-state check first; then OCC expected_report_version check on settlement payment creation)"
    error_id: "ERR_INVALID_STATE_TRANSITION | ERR_REPORT_NOT_TRACING | ERR_REPORT_NOT_AWAITING_DELIVERY | ERR_REPORT_NOT_ACCEPTING_EXPENSES | ERR_REPORT_NOT_DELIVERED | ERR_REPORT_NOT_DECLARED_LOST | ERR_REPORT_NOT_IN_DAMAGE_REVIEW | ERR_REPORT_NOT_IN_CLAIM_REVIEW | ERR_SETTLEMENT_NOT_OFFERED | ERR_SETTLEMENT_NOT_PAYABLE | ERR_DISPATCH_NOT_RESCHEDULABLE | ERR_CLAIM_NOT_PAYABLE | ERR_STALE_REPORT_VERSION"
    http_status: "409 (412 for ERR_STALE_REPORT_VERSION)"
    applies_to: "all state transition and guarded creation endpoints"

  - priority: 7
    category: business_referential
    check: "Cross-entity reference rules: bag tag belongs to passenger (ERR_BAG_PASSENGER_MISMATCH); at most one non-CLOSED report per bag tag (ERR_BAG_ALREADY_REPORTED); courier serves the report's filing station (ERR_COURIER_ZONE_MISMATCH); repair orders only for DAMAGED reports with damage_repairable=true (ERR_REPAIR_NOT_ALLOWED_FOR_TYPE); no SUBMITTED expense claims when creating a settlement payment (ERR_UNADJUDICATED_EXPENSE_CLAIMS)"
    error_id: "ERR_BAG_PASSENGER_MISMATCH | ERR_BAG_ALREADY_REPORTED | ERR_COURIER_ZONE_MISMATCH | ERR_REPAIR_NOT_ALLOWED_FOR_TYPE | ERR_UNADJUDICATED_EXPENSE_CLAIMS"
    http_status: 409
    applies_to: "report creation, dispatch creation, repair order creation, settlement payment creation"

  - priority: 8
    category: business_temporal
    check: "Temporal rules: pickup_at/new_pickup_at must not be before the current logical clock (ERR_PICKUP_IN_PAST); dispatch windows on the same courier must not conflict under buffer-expanded intervals (ERR_DISPATCH_WINDOW_CONFLICT); repair vendor bench capacity must not be exceeded on any day of [intake_date, promised_date) (ERR_VENDOR_CAPACITY_EXCEEDED)"
    error_id: "ERR_PICKUP_IN_PAST | ERR_DISPATCH_WINDOW_CONFLICT | ERR_VENDOR_CAPACITY_EXCEEDED"
    http_status: 409
    applies_to: "dispatch creation, dispatch reschedule, repair order creation"

  - priority: 9
    category: business_constraint
    check: "Uniqueness and structural constraints: tag_number unique (ERR_DUPLICATE_TAG_NUMBER); report_reference unique (ERR_DUPLICATE_REPORT_REFERENCE); at most one ISSUED settlement payment per report (ERR_ACTIVE_SETTLEMENT_PAYMENT_EXISTS); promised_date strictly after intake_date and purchase_date <= intake_date (ERR_REPAIR_WINDOW_INVALID)"
    error_id: "ERR_DUPLICATE_TAG_NUMBER | ERR_DUPLICATE_REPORT_REFERENCE | ERR_ACTIVE_SETTLEMENT_PAYMENT_EXISTS | ERR_REPAIR_WINDOW_INVALID"
    http_status: "409 (422 for ERR_REPAIR_WINDOW_INVALID)"
    applies_to: "bag tag creation, report creation, settlement payment creation, repair order creation"

  - priority: 10
    category: business_fiscal
    check: "Fiscal caps: declared_value_cents <= 500000 (ERR_DECLARED_VALUE_EXCEEDS_MAX); expense claim claimed_total_cents <= 300000 (ERR_EXPENSE_CLAIM_OVER_MAX)"
    error_id: "ERR_DECLARED_VALUE_EXCEEDS_MAX | ERR_EXPENSE_CLAIM_OVER_MAX"
    http_status: 422
    applies_to: "bag tag creation, expense claim creation"

# =============================================================================
# 1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# Table 5: API Endpoint Table
# =============================================================================
endpoints:
  # --- Logical clock (test-driving) ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the logical clock. Server startup default is exactly 2026-08-01T00:00:00Z (never wall-clock). Setting the clock executes the tracing-timeout sweep: TRACING reports with created_at + 504h <= new time and no LOCATED event become DECLARED_LOST (bag -> CLAIMED_LOST)."
    roles: [SystemAdmin]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string, swept_report_ids: "string[]" }
    side_effects: ["tracing-timeout sweep (reports -> DECLARED_LOST, bags -> CLAIMED_LOST)"]

  # --- Station ---
  - method: POST
    path: "/baggage/stations"
    description: "Create a station"
    roles: [SystemAdmin]
    code: 201
    input: [station_code, name, bags_handled_total]
    output: Station
    side_effects: ["computed counters initialized to 0"]

  - method: GET
    path: "/baggage/stations/{id}"
    description: "Get a station"
    roles: [SystemAdmin, BaggageServiceAgent, ClaimsAdjuster, Passenger]
    code: 200
    input: []
    output: Station
    side_effects: []

  - method: GET
    path: "/baggage/stations"
    description: "List stations (paginated)"
    roles: [SystemAdmin, BaggageServiceAgent, ClaimsAdjuster, Passenger]
    code: 200
    input: ["limit?", "offset?"]
    output: "Station[]"
    side_effects: []

  - method: GET
    path: "/baggage/stations/{id}/irregularity-summary"
    description: "Computed root-cause station report (counts by root_cause, recovered bags, mishandled rate per 1000)"
    roles: [SystemAdmin, BaggageServiceAgent, ClaimsAdjuster, Passenger]
    code: 200
    input: []
    output: { station_id: string, open_report_count: integer, mishandled_report_count: integer, recovered_bag_count: integer, by_root_cause: object, mishandled_rate_per_1000: number }
    side_effects: []

  # --- Carrier ---
  - method: POST
    path: "/baggage/carriers"
    description: "Register a carrier (own or interline partner)"
    roles: [SystemAdmin]
    code: 201
    input: [carrier_code, name, is_interline_partner]
    output: Carrier
    side_effects: []

  - method: GET
    path: "/baggage/carriers/{id}"
    description: "Get a carrier"
    roles: [SystemAdmin, BaggageServiceAgent, ClaimsAdjuster, Passenger]
    code: 200
    input: []
    output: Carrier
    side_effects: []

  # --- CourierService ---
  - method: POST
    path: "/baggage/courier-services"
    description: "Register a courier service with its served stations and turnaround buffer"
    roles: [SystemAdmin]
    code: 201
    input: [name, serves_station_ids, turnaround_buffer_minutes]
    output: CourierService
    side_effects: ["active_dispatch_count = 0"]

  - method: GET
    path: "/baggage/courier-services/{id}"
    description: "Get a courier service"
    roles: [SystemAdmin, BaggageServiceAgent, ClaimsAdjuster, Passenger]
    code: 200
    input: []
    output: CourierService
    side_effects: []

  - method: GET
    path: "/baggage/courier-services"
    description: "List courier services; serves_station_ids filter returns couriers whose served-station array contains the given station id"
    roles: [SystemAdmin, BaggageServiceAgent, ClaimsAdjuster, Passenger]
    code: 200
    input: ["serves_station_ids?", "limit?", "offset?"]
    output: "CourierService[]"
    side_effects: []

  # --- RepairVendor ---
  - method: POST
    path: "/baggage/repair-vendors"
    description: "Register a repair vendor with bench capacity"
    roles: [SystemAdmin]
    code: 201
    input: [name, bench_capacity]
    output: RepairVendor
    side_effects: ["occupied_bench_slots = 0, available_bench_slots = bench_capacity"]

  - method: GET
    path: "/baggage/repair-vendors/{id}"
    description: "Get a repair vendor"
    roles: [SystemAdmin, BaggageServiceAgent, ClaimsAdjuster, Passenger]
    code: 200
    input: []
    output: RepairVendor
    side_effects: []

  # --- Passenger ---
  - method: POST
    path: "/baggage/passengers"
    description: "Register a passenger"
    roles: [BaggageServiceAgent, SystemAdmin]
    code: 201
    input: [full_name, email, "tier?"]
    output: Passenger
    side_effects: ["tier defaults to STANDARD"]

  - method: GET
    path: "/baggage/passengers/{id}"
    description: "Get a passenger"
    roles: [SystemAdmin, BaggageServiceAgent, ClaimsAdjuster, Passenger]
    code: 200
    input: []
    output: Passenger
    side_effects: []

  # --- BagTag ---
  - method: POST
    path: "/baggage/bag-tags"
    description: "Check in a bag (creates the tag record)"
    roles: [BaggageServiceAgent]
    code: 201
    input: [tag_number, passenger_id, routing_carrier_ids, is_international, weight_kg, "declared_value_cents?"]
    output: BagTag
    side_effects: ["status=CHECKED", "declared_value_cents defaults to 0", "ERR_DECLARED_VALUE_EXCEEDS_MAX if > 500000", "ERR_DUPLICATE_TAG_NUMBER"]

  - method: GET
    path: "/baggage/bag-tags/{id}"
    description: "Get a bag tag"
    roles: [SystemAdmin, BaggageServiceAgent, ClaimsAdjuster, Passenger]
    code: 200
    input: []
    output: BagTag
    side_effects: []

  - method: GET
    path: "/baggage/bag-tags"
    description: "List bag tags; passenger_id filters by owner; routing_carrier_ids returns bags whose routing array contains the given carrier id"
    roles: [SystemAdmin, BaggageServiceAgent, ClaimsAdjuster, Passenger]
    code: 200
    input: ["passenger_id?", "routing_carrier_ids?", "limit?", "offset?"]
    output: "BagTag[]"
    side_effects: []

  # --- IrregularityReport ---
  - method: POST
    path: "/baggage/reports"
    description: "Open a mishandled-bag report (WorldTracer file). DELAYED auto-enters TRACING; DAMAGED/PILFERED auto-enter DAMAGE_REVIEW."
    roles: [BaggageServiceAgent]
    code: 201
    input: [report_reference, passenger_id, bag_tag_id, station_id, type]
    output: IrregularityReport
    side_effects:
      - "auto-transition OPEN -> TRACING or DAMAGE_REVIEW per type"
      - "BagTag CHECKED -> MISHANDLED (DELAYED) or DELIVERED_DAMAGED (DAMAGED/PILFERED)"
      - "Station.open_report_count += 1"
      - "liability_regime, liable_carrier_id, effective_cap_cents computed"
      - "ERR_BAG_PASSENGER_MISMATCH, ERR_BAG_ALREADY_REPORTED, ERR_DUPLICATE_REPORT_REFERENCE"

  - method: GET
    path: "/baggage/reports/{id}"
    description: "Get a report"
    roles: [SystemAdmin, BaggageServiceAgent, ClaimsAdjuster, Passenger]
    code: 200
    input: []
    output: IrregularityReport
    side_effects: []

  - method: GET
    path: "/baggage/reports"
    description: "List reports with filters"
    roles: [SystemAdmin, BaggageServiceAgent, ClaimsAdjuster, Passenger]
    code: 200
    input: ["station_id?", "passenger_id?", "bag_tag_id?", "liable_carrier_id?", "root_cause_station_id?", "status?", "limit?", "offset?"]
    output: "IrregularityReport[]"
    side_effects: []

  - method: POST
    path: "/baggage/reports/{id}/tracing-events"
    description: "Record a WorldTracer tracing message from a carrier; LOCATED triggers the recovery cascade"
    roles: [BaggageServiceAgent]
    code: 201
    input: [carrier_id, station_id, event_type, "occurred_at?", "notes?"]
    output: TracingEvent
    side_effects:
      - "event_type=LOCATED: report TRACING -> FOUND_PENDING_DELIVERY, bag MISHANDLED -> IN_RECOVERY, Station(event.station_id).recovered_bag_count += 1"
      - "ERR_REPORT_NOT_TRACING if report not in TRACING"

  - method: GET
    path: "/baggage/tracing-events/{id}"
    description: "Get a tracing event"
    roles: [SystemAdmin, BaggageServiceAgent, ClaimsAdjuster, Passenger]
    code: 200
    input: []
    output: TracingEvent
    side_effects: []

  - method: GET
    path: "/baggage/tracing-events"
    description: "List tracing events with filters"
    roles: [SystemAdmin, BaggageServiceAgent, ClaimsAdjuster, Passenger]
    code: 200
    input: ["report_id?", "carrier_id?", "station_id?", "event_type?", "limit?", "offset?"]
    output: "TracingEvent[]"
    side_effects: []

  - method: POST
    path: "/baggage/reports/{id}/assess-loss"
    description: "Adjuster records contents loss for a DECLARED_LOST report"
    roles: [ClaimsAdjuster]
    code: 200
    input: [contents_loss_cents]
    output: IrregularityReport
    side_effects: ["DECLARED_LOST -> CLAIM_REVIEW", "contents_loss_cents stored"]

  - method: POST
    path: "/baggage/reports/{id}/assess-damage"
    description: "Adjuster records damage assessment; repairable=false moves report to CLAIM_REVIEW"
    roles: [ClaimsAdjuster]
    code: 200
    input: [repairable, "contents_damage_cents?"]
    output: IrregularityReport
    side_effects: ["damage_repairable and contents_damage_cents (default 0) stored", "repairable=false: DAMAGE_REVIEW -> CLAIM_REVIEW"]

  - method: POST
    path: "/baggage/reports/{id}/open-claim-review"
    description: "Open claim review on a DELIVERED (recovered late) report"
    roles: [ClaimsAdjuster]
    code: 200
    input: []
    output: IrregularityReport
    side_effects: ["DELIVERED -> CLAIM_REVIEW"]

  - method: POST
    path: "/baggage/reports/{id}/offer-settlement"
    description: "Compute and offer the settlement; records root cause attribution"
    roles: [ClaimsAdjuster]
    code: 200
    input: [root_cause, root_cause_station_id]
    output: IrregularityReport
    side_effects: ["CLAIM_REVIEW -> SETTLEMENT_OFFERED", "settlement_offer_cents computed", "amount_payable_cents = settlement_offer_cents"]

  - method: POST
    path: "/baggage/reports/{id}/accept-settlement"
    description: "Passenger accepts the settlement offer"
    roles: [Passenger]
    code: 200
    input: []
    output: IrregularityReport
    side_effects: ["SETTLEMENT_OFFERED -> SETTLEMENT_ACCEPTED"]

  - method: POST
    path: "/baggage/reports/{id}/reject-settlement"
    description: "Passenger rejects the settlement offer; report returns to CLAIM_REVIEW for a revised offer"
    roles: [Passenger]
    code: 200
    input: []
    output: IrregularityReport
    side_effects: ["SETTLEMENT_OFFERED -> CLAIM_REVIEW", "offer fields cleared, amount_payable_cents reset to 0"]

  - method: POST
    path: "/baggage/reports/{id}/settlement-payments"
    description: "Create the final claim payment for an accepted settlement (OCC-guarded; supersedes a voided payment)"
    roles: [ClaimsAdjuster]
    code: 201
    input: [expected_report_version]
    output: SettlementPayment
    side_effects:
      - "SettlementPayment ISSUED with settlement/expense components per final_settlement_payment"
      - "APPROVED expense claims -> SETTLEMENT_EARMARKED"
      - "report.amount_payable_cents -= settlement_component_cents (to 0)"
      - "increments IrregularityReport.version by 1"
      - "ERR_STALE_REPORT_VERSION (412), ERR_UNADJUDICATED_EXPENSE_CLAIMS, ERR_ACTIVE_SETTLEMENT_PAYMENT_EXISTS"

  - method: GET
    path: "/baggage/settlement-payments/{id}"
    description: "Get a settlement payment"
    roles: [SystemAdmin, BaggageServiceAgent, ClaimsAdjuster, Passenger]
    code: 200
    input: []
    output: SettlementPayment
    side_effects: []

  - method: GET
    path: "/baggage/settlement-payments"
    description: "List settlement payments with filters"
    roles: [SystemAdmin, BaggageServiceAgent, ClaimsAdjuster, Passenger]
    code: 200
    input: ["report_id?", "status?", "limit?", "offset?"]
    output: "SettlementPayment[]"
    side_effects: []

  - method: POST
    path: "/baggage/settlement-payments/{id}/mark-paid"
    description: "Mark the final payment paid; closes the report file"
    roles: [ClaimsAdjuster]
    code: 200
    input: []
    output: SettlementPayment
    side_effects: ["ISSUED -> PAID", "report -> CLOSED", "earmarked claims -> PAID", "station counters updated (mishandled_report_count, open_report_count)"]

  - method: POST
    path: "/baggage/settlement-payments/{id}/void"
    description: "Void an unpaid issued payment (compensation restores report payable and claim states)"
    roles: [ClaimsAdjuster]
    code: 200
    input: []
    output: SettlementPayment
    side_effects: ["ISSUED -> VOIDED", "report.amount_payable_cents restored", "earmarked claims -> APPROVED", "increments IrregularityReport.version by 1"]

  # --- DeliveryDispatch ---
  - method: POST
    path: "/baggage/dispatches"
    description: "Dispatch a found bag to a courier for delivery"
    roles: [BaggageServiceAgent]
    code: 201
    input: [report_id, courier_service_id, pickup_at, travel_minutes, delivery_address]
    output: DeliveryDispatch
    side_effects: ["report FOUND_PENDING_DELIVERY -> DELIVERY_IN_PROGRESS", "courier.active_dispatch_count += 1", "attempt_count = 1"]

  - method: GET
    path: "/baggage/dispatches/{id}"
    description: "Get a dispatch"
    roles: [SystemAdmin, BaggageServiceAgent, ClaimsAdjuster, Passenger]
    code: 200
    input: []
    output: DeliveryDispatch
    side_effects: []

  - method: GET
    path: "/baggage/dispatches"
    description: "List dispatches with filters"
    roles: [SystemAdmin, BaggageServiceAgent, ClaimsAdjuster, Passenger]
    code: 200
    input: ["report_id?", "courier_service_id?", "status?", "limit?", "offset?"]
    output: "DeliveryDispatch[]"
    side_effects: []

  - method: POST
    path: "/baggage/dispatches/{id}/mark-delivered"
    description: "Courier confirmed delivery"
    roles: [BaggageServiceAgent]
    code: 200
    input: []
    output: DeliveryDispatch
    side_effects: ["DISPATCHED -> DELIVERED", "report -> DELIVERED", "bag -> DELIVERED", "delivered_on stamped", "courier.active_dispatch_count -= 1"]

  - method: POST
    path: "/baggage/dispatches/{id}/mark-failed"
    description: "Delivery attempt failed; attempt_count >= 3 makes the failure permanent and returns the report to FOUND_PENDING_DELIVERY"
    roles: [BaggageServiceAgent]
    code: 200
    input: []
    output: DeliveryDispatch
    side_effects: ["DISPATCHED -> FAILED_ATTEMPT or FAILED_PERMANENT", "on permanent: report -> FOUND_PENDING_DELIVERY, courier.active_dispatch_count -= 1"]

  - method: POST
    path: "/baggage/dispatches/{id}/reschedule"
    description: "Reschedule a failed delivery attempt with a new pickup window"
    roles: [BaggageServiceAgent]
    code: 200
    input: [new_pickup_at]
    output: DeliveryDispatch
    side_effects: ["FAILED_ATTEMPT -> DISPATCHED", "attempt_count += 1", "window conflict re-validated"]

  # --- RepairOrder ---
  - method: POST
    path: "/baggage/repair-orders"
    description: "Send a damaged bag to a repair vendor (occupies a bench slot for [intake_date, promised_date))"
    roles: [ClaimsAdjuster]
    code: 201
    input: [report_id, vendor_id, intake_date, promised_date, purchase_price_cents, purchase_date, repair_estimate_cents]
    output: RepairOrder
    side_effects: ["status=INTAKE", "vendor.occupied_bench_slots += 1 (available -= 1)", "ERR_VENDOR_CAPACITY_EXCEEDED, ERR_REPAIR_NOT_ALLOWED_FOR_TYPE"]

  - method: GET
    path: "/baggage/repair-orders/{id}"
    description: "Get a repair order"
    roles: [SystemAdmin, BaggageServiceAgent, ClaimsAdjuster, Passenger]
    code: 200
    input: []
    output: RepairOrder
    side_effects: []

  - method: GET
    path: "/baggage/repair-orders"
    description: "List repair orders with filters"
    roles: [SystemAdmin, BaggageServiceAgent, ClaimsAdjuster, Passenger]
    code: 200
    input: ["report_id?", "vendor_id?", "status?", "limit?", "offset?"]
    output: "RepairOrder[]"
    side_effects: []

  - method: POST
    path: "/baggage/repair-orders/{id}/decide"
    description: "Compute depreciation and the repair-vs-replace decision (system-computed, not client-chosen)"
    roles: [ClaimsAdjuster]
    code: 200
    input: []
    output: RepairOrder
    side_effects: ["INTAKE -> REPAIR_IN_PROGRESS or REPLACEMENT_PENDING", "depreciated_value_cents and decision stored"]

  - method: POST
    path: "/baggage/repair-orders/{id}/complete"
    description: "Settle the repair order; releases the bench slot and moves the report to CLAIM_REVIEW"
    roles: [ClaimsAdjuster]
    code: 200
    input: []
    output: RepairOrder
    side_effects: ["-> REPAIR_SETTLED or REPLACE_SETTLED", "payout_cents stored", "vendor slot released", "report DAMAGE_REVIEW -> CLAIM_REVIEW with repair_payout_cents", "sibling open repair orders -> CANCELLED"]

  # --- ExpenseClaim ---
  - method: POST
    path: "/baggage/expense-claims"
    description: "Passenger submits an interim expense claim with receipts"
    roles: [Passenger]
    code: 201
    input: [report_id, receipts]
    output: ExpenseClaim
    side_effects: ["status=SUBMITTED", "claimed_total_cents and eligible_receipt_count computed", "ERR_REPORT_NOT_ACCEPTING_EXPENSES, ERR_EXPENSE_CLAIM_OVER_MAX, ERR_NOT_RESOURCE_OWNER"]

  - method: GET
    path: "/baggage/expense-claims/{id}"
    description: "Get an expense claim"
    roles: [SystemAdmin, BaggageServiceAgent, ClaimsAdjuster, Passenger]
    code: 200
    input: []
    output: ExpenseClaim
    side_effects: []

  - method: GET
    path: "/baggage/expense-claims"
    description: "List expense claims with filters"
    roles: [SystemAdmin, BaggageServiceAgent, ClaimsAdjuster, Passenger]
    code: 200
    input: ["report_id?", "status?", "limit?", "offset?"]
    output: "ExpenseClaim[]"
    side_effects: []

  - method: POST
    path: "/baggage/expense-claims/{id}/adjudicate"
    description: "Adjuster approves (computes reimbursable_total_cents) or rejects the claim"
    roles: [ClaimsAdjuster]
    code: 200
    input: [decision, "reject_reason?"]
    output: ExpenseClaim
    side_effects: ["SUBMITTED -> APPROVED or REJECTED", "on APPROVE: reimbursable computed per expense_reimbursement; report.expenses_approved_unpaid_cents += amount"]

  - method: POST
    path: "/baggage/expense-claims/{id}/pay"
    description: "Pay an approved claim as an interim reimbursement while the file is open"
    roles: [ClaimsAdjuster]
    code: 200
    input: []
    output: ExpenseClaim
    side_effects: ["APPROVED -> PAID", "report expense totals updated"]

# =============================================================================
# Table 6: Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role header missing or malformed" }
  - { id: ERR_FORBIDDEN_FOR_ROLE, http: 403, condition: "Caller role not permitted for this endpoint" }
  - { id: ERR_NOT_RESOURCE_OWNER, http: 403, condition: "Passenger-scoped operation where X-User-ID != report.passenger_id" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field, bad type/enum/format, negative amount, empty receipts, or unknown/system-supplied field in payload" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path id or referenced foreign key does not exist" }
  - { id: ERR_INVALID_STATE_TRANSITION, http: 409, condition: "Generic wrong-state rejection for a transition not allowed from the current state (incl. terminal-state lockdown and repeated triggers)" }
  - { id: ERR_REPORT_NOT_TRACING, http: 409, condition: "Tracing event recorded on a report not in TRACING" }
  - { id: ERR_REPORT_NOT_AWAITING_DELIVERY, http: 409, condition: "Dispatch created for a report not in FOUND_PENDING_DELIVERY" }
  - { id: ERR_REPORT_NOT_ACCEPTING_EXPENSES, http: 409, condition: "Expense claim on a non-DELAYED report or a report outside TRACING/FOUND_PENDING_DELIVERY/DELIVERY_IN_PROGRESS/DELIVERED/DECLARED_LOST" }
  - { id: ERR_REPORT_NOT_DELIVERED, http: 409, condition: "open-claim-review on a report not in DELIVERED" }
  - { id: ERR_REPORT_NOT_DECLARED_LOST, http: 409, condition: "assess-loss on a report not in DECLARED_LOST" }
  - { id: ERR_REPORT_NOT_IN_DAMAGE_REVIEW, http: 409, condition: "assess-damage or repair-order creation on a report not in DAMAGE_REVIEW" }
  - { id: ERR_REPORT_NOT_IN_CLAIM_REVIEW, http: 409, condition: "offer-settlement on a report not in CLAIM_REVIEW" }
  - { id: ERR_SETTLEMENT_NOT_OFFERED, http: 409, condition: "accept/reject-settlement on a report not in SETTLEMENT_OFFERED" }
  - { id: ERR_SETTLEMENT_NOT_PAYABLE, http: 409, condition: "settlement payment creation on a report not in SETTLEMENT_ACCEPTED" }
  - { id: ERR_DISPATCH_NOT_RESCHEDULABLE, http: 409, condition: "reschedule on a dispatch not in FAILED_ATTEMPT" }
  - { id: ERR_CLAIM_NOT_PAYABLE, http: 409, condition: "pay on an expense claim not in APPROVED" }
  - { id: ERR_STALE_REPORT_VERSION, http: 412, condition: "expected_report_version does not match the report's current version (OCC)" }
  - { id: ERR_BAG_PASSENGER_MISMATCH, http: 409, condition: "Report passenger_id differs from the bag tag's passenger_id" }
  - { id: ERR_BAG_ALREADY_REPORTED, http: 409, condition: "Bag tag already has a non-CLOSED report" }
  - { id: ERR_COURIER_ZONE_MISMATCH, http: 409, condition: "Courier's serves_station_ids does not include the report's filing station" }
  - { id: ERR_REPAIR_NOT_ALLOWED_FOR_TYPE, http: 409, condition: "Repair order for a non-DAMAGED report or a report with damage_repairable != true" }
  - { id: ERR_UNADJUDICATED_EXPENSE_CLAIMS, http: 409, condition: "Settlement payment creation while the report has SUBMITTED expense claims" }
  - { id: ERR_PICKUP_IN_PAST, http: 409, condition: "pickup_at/new_pickup_at is before the current logical clock time" }
  - { id: ERR_DISPATCH_WINDOW_CONFLICT, http: 409, condition: "Dispatch window conflicts with another non-terminal dispatch on the same courier under buffer-expanded closed-interval semantics: conflict iff (new_start - buffer) < existing_end AND existing_start < (new_end + buffer); windows exactly buffer apart do NOT conflict" }
  - { id: ERR_VENDOR_CAPACITY_EXCEEDED, http: 409, condition: "Some day in [intake_date, promised_date) would have bench_capacity or more open repair orders at the vendor (half-open intervals: an order ending on day D does not overlap one starting on day D)" }
  - { id: ERR_DUPLICATE_TAG_NUMBER, http: 409, condition: "tag_number already exists" }
  - { id: ERR_DUPLICATE_REPORT_REFERENCE, http: 409, condition: "report_reference already exists" }
  - { id: ERR_ACTIVE_SETTLEMENT_PAYMENT_EXISTS, http: 409, condition: "Report already has a SettlementPayment in ISSUED status" }
  - { id: ERR_REPAIR_WINDOW_INVALID, http: 422, condition: "promised_date <= intake_date, or purchase_date > intake_date" }
  - { id: ERR_DECLARED_VALUE_EXCEEDS_MAX, http: 422, condition: "declared_value_cents > 500000" }
  - { id: ERR_EXPENSE_CLAIM_OVER_MAX, http: 422, condition: "claimed_total_cents > 300000" }

# =============================================================================
# Table 7: RBAC Matrix
# =============================================================================
roles:
  - name: SystemAdmin
    description: "Back-office administrator: owns configuration entities (stations, carriers, courier services, repair vendors) and the logical clock"
    identity: opaque
    exclusive_operations:
      - "POST /_clock/set_current_utc"
      - "POST /baggage/stations"
      - "POST /baggage/carriers"
      - "POST /baggage/courier-services"
      - "POST /baggage/repair-vendors"
    shared_operations:
      - "POST /baggage/passengers (with BaggageServiceAgent)"
      - "All GET endpoints (with all roles)"

  - name: BaggageServiceAgent
    description: "Front-line baggage service office agent: registers passengers, checks in bags, opens reports, records tracing messages, dispatches and tracks deliveries"
    identity: opaque
    exclusive_operations:
      - "POST /baggage/bag-tags"
      - "POST /baggage/reports"
      - "POST /baggage/reports/{id}/tracing-events"
      - "POST /baggage/dispatches"
      - "POST /baggage/dispatches/{id}/mark-delivered"
      - "POST /baggage/dispatches/{id}/mark-failed"
      - "POST /baggage/dispatches/{id}/reschedule"
    shared_operations:
      - "POST /baggage/passengers (with SystemAdmin)"
      - "All GET endpoints (with all roles)"

  - name: ClaimsAdjuster
    description: "Claims adjudicator: assesses loss/damage, drives repair orders, adjudicates and pays expense claims, computes and issues settlement payments"
    identity: opaque
    exclusive_operations:
      - "POST /baggage/reports/{id}/assess-loss"
      - "POST /baggage/reports/{id}/assess-damage"
      - "POST /baggage/reports/{id}/open-claim-review"
      - "POST /baggage/reports/{id}/offer-settlement"
      - "POST /baggage/reports/{id}/settlement-payments"
      - "POST /baggage/settlement-payments/{id}/mark-paid"
      - "POST /baggage/settlement-payments/{id}/void"
      - "POST /baggage/repair-orders"
      - "POST /baggage/repair-orders/{id}/decide"
      - "POST /baggage/repair-orders/{id}/complete"
      - "POST /baggage/expense-claims/{id}/adjudicate"
      - "POST /baggage/expense-claims/{id}/pay"
    shared_operations:
      - "All GET endpoints (with all roles)"

  - name: Passenger
    description: "The traveling claimant: submits interim expense claims and accepts or rejects settlement offers on their own reports"
    identity: "entity_backed:Passenger"
    exclusive_operations:
      - "POST /baggage/expense-claims"
      - "POST /baggage/reports/{id}/accept-settlement"
      - "POST /baggage/reports/{id}/reject-settlement"
    shared_operations:
      - "All GET endpoints (with all roles)"
