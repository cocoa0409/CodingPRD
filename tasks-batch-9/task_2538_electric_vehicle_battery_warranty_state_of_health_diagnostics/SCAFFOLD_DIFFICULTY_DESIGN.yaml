  - rule_id: boundary_precision_check
    instances:
      - name: retention_exactly_at_tier_threshold_qualifies_on_claim_filing
        metric: "retention_pct, a percentage carried to 2 decimals"
        endpoint: "POST /battery-warranty/warranty-claims"
        grounds:
          - validations[priority=61]
          - calculations.soh_retention
          - entities.SohAssessment.fields.retention_pct
