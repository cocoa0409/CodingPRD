          ClaimAdvocacy forks on a child entity's event (the first CessionDispute pushes it to
          DISPUTED), branches to one of two routes, and only rejoins at RESOLVED when the LAST
          RAISED dispute is resolved — a fork/join shape neither Quote (cycle, instance 1) nor
          Program (parallel dimensions, instance 2) has. Entering the arbitration branch also
