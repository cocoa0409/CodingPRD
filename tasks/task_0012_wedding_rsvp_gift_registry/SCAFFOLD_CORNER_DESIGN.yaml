          assert:
            - "p_replay_id == p_orig_id (same Purchase returned, no new row)."
            - "RegistryItem.${r_id}.fulfilled_quantity unchanged (==2) and version unchanged."

      - name: purchase_duplicate_key_conflicting_quantity_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=14]
          - errors[ERR_DUPLICATE_EXTERNAL_PURCHASE]
        distinguishing_aspect: |
          POSTing the SAME (platform_code, external_purchase_id) with a DIFFERENT
          quantity from the existing record is a true key conflict, not idempotent
          replay; returns 409 ERR_DUPLICATE_EXTERNAL_PURCHASE.
        test_recipe:
          setup:
            - "Wedding W_kc in RSVP_OPEN with RegistryItem R_kc and one Purchase P_kc on (STORE_A, KC1) with quantity=2."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-01-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /weddings"
              payload: { couple_user_id: "couple_kc", title: "KC Wedding", ceremony_at: "2027-06-01T18:00:00Z", rsvp_deadline_at: "2027-05-15T23:59:59Z" }
              as: Couple
              as_user_id: "couple_kc"
              captures: { w_id: $.data.id }
            - call: "POST /weddings/${w_id}/meal-options"
              payload: { code: "ADULT", label: "Adult", is_kids: false, max_servings: 10 }
              as: Couple
              as_user_id: "couple_kc"
            - call: "POST /weddings/${w_id}/open-rsvp"
              payload: {}
              as: Couple
              as_user_id: "couple_kc"
            - call: "POST /weddings/${w_id}/registry-items"
              payload: { sku: "PAN", title: "Pan", target_quantity: 5, unit_price_cents: 2000 }
              as: Couple
              as_user_id: "couple_kc"
              captures: { r_id: $.data.id }
            - call: "POST /registry-items/${r_id}/purchases"
              payload: { platform_code: "STORE_A", external_purchase_id: "KC1", purchaser_name: "Ken", quantity: 2, occurred_at: "2027-01-02T10:00:00Z" }
              as: PlatformIntegration
          trigger:
            - call: "POST /registry-items/${r_id}/purchases"
              payload: { platform_code: "STORE_A", external_purchase_id: "KC1", purchaser_name: "Ken", quantity: 3, occurred_at: "2027-01-02T10:00:00Z" }
              as: PlatformIntegration
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP status == 409; error_id == ERR_DUPLICATE_EXTERNAL_PURCHASE."

  # ---------------------------------------------------------------------------
  # Validations — stubs (already exercised by §1.8) and additional rows
  # ---------------------------------------------------------------------------
  - section: validations
    instances:
      - name: priority_conflict_state_vs_kids_meal
        claim_type: priority_ordering
        grounds:
          - validations[priority=5]
          - validations[priority=6]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / state_vs_kids_meal_pairing_priority
          rationale: "Asserted as the dual-failure scenario of the named §1.8 instance."

      - name: priority_conflict_plus_one_vs_meal_full
        claim_type: priority_ordering
        grounds:
          - validations[priority=8]
          - validations[priority=10]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / plus_one_referential_vs_meal_full_priority
          rationale: "Asserted as the dual-failure scenario of the named §1.8 instance."

      - name: rsvp_deadline_passed_for_guest_self
        claim_type: violation_to_error
        grounds:
          - validations[priority=13]
          - errors[ERR_RSVP_DEADLINE_PASSED]
        distinguishing_aspect: |
          GuestSelf attempts to RSVP after current_utc >= wedding.rsvp_deadline_at;
          rejected ERR_RSVP_DEADLINE_PASSED (409). Wedding.status may still be
          RSVP_OPEN (auto-close not yet fired).
        test_recipe:
          setup:
            - "Wedding W_dl with rsvp_deadline_at=2027-05-15T23:59:59Z, wedding.status==RSVP_OPEN. Guest G_self exists. Clock advanced past the deadline."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-01-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /weddings"
              payload: { couple_user_id: "couple_dl", title: "DL Wedding", ceremony_at: "2027-06-01T18:00:00Z", rsvp_deadline_at: "2027-05-15T23:59:59Z" }
              as: Couple
              as_user_id: "couple_dl"
              captures: { w_id: $.data.id }
            - call: "POST /weddings/${w_id}/meal-options"
              payload: { code: "ADULT", label: "Adult", is_kids: false, max_servings: 10 }
              as: Couple
              as_user_id: "couple_dl"
              captures: { meal_id: $.data.id }
            - call: "POST /weddings/${w_id}/guests"
              payload: { full_name: "DL", email: "dl@example.com" }
              as: Couple
              as_user_id: "couple_dl"
              captures: { g_id: $.data.id, g_tok: $.data.invitation_token }
            - call: "POST /weddings/${w_id}/open-rsvp"
              payload: {}
              as: Couple
              as_user_id: "couple_dl"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-05-16T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /guests/${g_id}/rsvp"
              payload: { attending: true, meal_option_id: "${meal_id}" }
              as: GuestSelf
              as_user_id: "${g_id}"
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP status == 409; error_id == ERR_RSVP_DEADLINE_PASSED."

      - name: cross_wedding_meal_reference_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=9]
          - errors[ERR_CROSS_WEDDING_REFERENCE]
        distinguishing_aspect: |
          Setting a Guest's meal_option_id to a MealOption that belongs to a DIFFERENT
          Wedding violates same-wedding referential integrity →
          ERR_CROSS_WEDDING_REFERENCE.
        test_recipe:
          setup:
            - "Two weddings W_a and W_b each with one MealOption. Guest G_a in W_a. Try to RSVP G_a with meal_option_id = M_b (belongs to W_b)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-01-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /weddings"
              payload: { couple_user_id: "couple_xwa", title: "XWA Wedding", ceremony_at: "2027-06-01T18:00:00Z", rsvp_deadline_at: "2027-05-15T23:59:59Z" }
              as: Couple
              as_user_id: "couple_xwa"
              captures: { w_a_id: $.data.id }
            - call: "POST /weddings"
              payload: { couple_user_id: "couple_xwb", title: "XWB Wedding", ceremony_at: "2027-06-01T18:00:00Z", rsvp_deadline_at: "2027-05-15T23:59:59Z" }
              as: Couple
              as_user_id: "couple_xwb"
              captures: { w_b_id: $.data.id }
            - call: "POST /weddings/${w_a_id}/meal-options"
              payload: { code: "A", label: "A meal", is_kids: false, max_servings: 10 }
              as: Couple
              as_user_id: "couple_xwa"
            - call: "POST /weddings/${w_b_id}/meal-options"
              payload: { code: "B", label: "B meal", is_kids: false, max_servings: 10 }
              as: Couple
              as_user_id: "couple_xwb"
              captures: { m_b_id: $.data.id }
            - call: "POST /weddings/${w_a_id}/guests"
              payload: { full_name: "Across", email: "across@example.com" }
              as: Couple
              as_user_id: "couple_xwa"
              captures: { g_a_id: $.data.id }
            - call: "POST /weddings/${w_a_id}/open-rsvp"
              payload: {}
              as: Couple
              as_user_id: "couple_xwa"
          trigger:
            - call: "POST /guests/${g_a_id}/rsvp"
              payload: { attending: true, meal_option_id: "${m_b_id}" }
              as: Couple
              as_user_id: "couple_xwa"
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP status == 422; error_id == ERR_CROSS_WEDDING_REFERENCE."

  # ---------------------------------------------------------------------------
  # Endpoints — pagination, listing, FK reverse-reachability
  # ---------------------------------------------------------------------------
  - section: endpoints
    instances:
      - name: list_guests_pagination_envelope
        claim_type: listing
        grounds:
          - endpoints[GET /weddings/{id}/guests]
        distinguishing_aspect: |
          GET /weddings/{id}/guests returns a paginated list envelope with
          total_count and has_more (per response_envelope §1.0).
        test_recipe:
          setup:
            - "Wedding W_pg with 3 guests already created."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-01-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /weddings"
              payload: { couple_user_id: "couple_pg", title: "PG Wedding", ceremony_at: "2027-06-01T18:00:00Z", rsvp_deadline_at: "2027-05-15T23:59:59Z" }
              as: Couple
              as_user_id: "couple_pg"
              captures: { w_id: $.data.id }
            - call: "POST /weddings/${w_id}/guests"
              payload: { full_name: "P1", email: "p1@example.com" }
              as: Couple
              as_user_id: "couple_pg"
            - call: "POST /weddings/${w_id}/guests"
              payload: { full_name: "P2", email: "p2@example.com" }
              as: Couple
              as_user_id: "couple_pg"
            - call: "POST /weddings/${w_id}/guests"
              payload: { full_name: "P3", email: "p3@example.com" }
              as: Couple
              as_user_id: "couple_pg"
          trigger:
            - call: "GET /weddings/${w_id}/guests"
              payload: { limit: 2, offset: 0 }
              as: Couple
              as_user_id: "couple_pg"
              captures: { list: $.data }
          assert:
            - "Response.response_type == 'array' and pagination meta is honoured (total_count >= 3, returned page length == 2, has_more == true)."

      - name: get_nonexistent_wedding_returns_404
        claim_type: not_found
        grounds:
          - endpoints[GET /weddings/{id}]
          - errors[ERR_NOT_FOUND]
        distinguishing_aspect: |
          GET /weddings/{id} with a UUID that does not exist returns 404
          ERR_NOT_FOUND.
        test_recipe:
          setup:
            - "Empty DB; no Wedding rows."
          setup_api_calls: []
          trigger:
            - call: "GET /weddings/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: Couple
              as_user_id: "couple_nf"
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP status == 404; error_id == ERR_NOT_FOUND."

  # ---------------------------------------------------------------------------
