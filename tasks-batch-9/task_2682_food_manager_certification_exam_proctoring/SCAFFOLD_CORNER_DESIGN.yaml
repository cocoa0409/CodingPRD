          Phase order is observable, not cosmetic: the same run holds one FILED registration that is BOTH past
          its posting deadline (phase 3's predicate) AND attached to a certificate expiring at this epoch
          (phase 2's predicate), and phase 2 must win — the row ends WITHDRAWN and
