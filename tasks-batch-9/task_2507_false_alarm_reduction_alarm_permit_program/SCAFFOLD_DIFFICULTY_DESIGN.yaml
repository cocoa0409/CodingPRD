            - call: "POST /false-alarm-program/_clock/set_current_utc"
              payload: {current_utc: "2026-01-10T00:00:00Z"}
              as: ProgramAdministrator
            - call: "POST /false-alarm-program/dispatch-requests"
              payload:
                alarm_system_id: "${sys3}"
                alarm_type: "BURGLARY"
                verification_method: "TWO_CALL_ECV"
                call_attempts:
                  - {site_contact_id: "${c1}", attempted_at: "2026-01-10T04:01:00Z", outcome: "NO_ANSWER"}
                  - {site_contact_id: "${c2}", attempted_at: "2026-01-10T04:03:00Z", outcome: "NO_ANSWER"}
                audio_video_evidence: false
