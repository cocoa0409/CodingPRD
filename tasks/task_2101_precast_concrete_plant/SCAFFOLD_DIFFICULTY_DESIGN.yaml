            - call: "POST /bed-runs/${run_id}/tension"
              payload: { strand_count: 24, strand_diameter_in: 0.500, measured_elongation_in: 35.500 }
              as: ProductionSupervisor
              as_user_id: "ps-carl"
            - call: "POST /bed-runs/${run_id}/cylinder-sets"
