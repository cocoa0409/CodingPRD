              as_user_id: "cs-1"
              captures: { do_id: $.data.id, do_clinical: $.data.clinical_status, do_review: $.data.review_status }
            - call: "GET /venues/${v_id}"
              payload: {}
              as: DiningServicesManager
              captures: { v_v1: $.data.version }
          trigger:
            - call: "POST /seating-reservations"
              payload: { resident_id: "${r_id}", venue_id: "${v_id}", service_date: "2026-08-11", meal_period: "LUNCH", seat_start_utc: "2026-08-11T12:00:00Z", party_size: 1, expected_venue_version: "${v_v1}" }
              as: DiningServicesManager
              captures: { blocked_error: $.data.error_id, blocked_message: $.data.message }
            - call: "POST /diet-orders/${do_id}/dietitian-review"
              payload: { decision: "APPROVE" }
              as: RegisteredDietitian
              as_user_id: "rd-1"
              captures: { do_clinical_after: $.data.clinical_status, do_review_after: $.data.review_status }
            - call: "GET /venues/${v_id}"
              payload: {}
              as: DiningServicesManager
