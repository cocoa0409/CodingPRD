          setup: ["Event in VA SITE_LOCKED; VERIFIED dental volunteer licensed in NC"]
          setup_api_calls:
            - call: "POST /sites"
              payload: { site_name: "School SP", site_type: "SCHOOL", state_code: "VA", square_footage: 8000, has_loading_dock: false, power_capacity_kw: 90.0, sterilization_capable: false }
