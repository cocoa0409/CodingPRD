              captures: { gap_id: $.data.0.id }
            - call: "GET /api/call-slots?program_id=${prog_id}&date=2026-09-08"
              as: SchedulerAdmin
              captures: { slot_id: $.data.0.id }
            - call: "POST /api/locum-requisitions"
              payload: { gap_id: "${gap_id}" }
              as: SchedulerAdmin
              captures: { req_id: $.data.id }
            - call: "POST /api/locum-requisitions/${req_id}/propose-candidate"
              payload: { candidate_physician_id: "${l1_id}" }
              as: SchedulerAdmin
            - call: "POST /api/locum-requisitions/${req_id}/begin-credentialing"
              as: CredentialingOfficer
            - call: "GET /api/credentialing-cases?requisition_id=${req_id}"
              as: CredentialingOfficer
              captures: { case_id: $.data.0.id }
            - call: "POST /api/credentialing-cases/${case_id}/complete-item"
              payload: { item: "license_verification" }
              as: CredentialingOfficer
            - call: "POST /api/credentialing-cases/${case_id}/complete-item"
              payload: { item: "malpractice_verification" }
              as: CredentialingOfficer
            - call: "POST /api/credentialing-cases/${case_id}/complete-item"
              payload: { item: "privileges_granting" }
              as: CredentialingOfficer
            - call: "POST /api/credentialing-cases/${case_id}/complete-item"
              payload: { item: "health_screening" }
              as: CredentialingOfficer
          trigger:
            - call: "POST /api/credentialing-cases/${case_id}/complete-item"
              payload: { item: "orientation" }
              as: CredentialingOfficer
              captures: { case_status: $.data.status }
            - call: "GET /api/locum-requisitions/${req_id}"
              as: SchedulerAdmin
