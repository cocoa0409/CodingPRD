            - "After the second status-change: HTTP 200 and Donor.${cc_id}.donor_status == \"ACTIVE\""
            - "Donor.${cc_id}.status_effective_date == \"2026-04-03T00:00:00.000Z\""
            - "Donor.${cc_id}.version == 4"
