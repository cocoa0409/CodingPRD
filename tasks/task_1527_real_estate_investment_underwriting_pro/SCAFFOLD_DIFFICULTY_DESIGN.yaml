scaffold_difficulty_design:
  # ===========================================================================
  # Rule 1: dual_variant_calc — two dual-variant calculations in DIFFERENT
  # entity domains.
  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: noi_year1_provisional_vs_final_concession_ordering
        grounds:
          - calculations.noi_year1
        distinguishing_aspect: |
          Same input data produces different NOI under provisional vs final
          variants because concessions are subtracted AFTER growth in the
          provisional variant and BEFORE growth in the final variant; the
          entity domain is a Scenario's computed year-1 NOI.
        test_recipe:
          setup:
            - "Deal D1 in UNDERWRITING with one Property P (units=100, rentable_sqft=100000, year_built=2005)"
            - "Property P has one RentRollPeriod (period_month=2026-06, occupied_units=92, total_units=100, GPR=10,000,000 cents, collected=9,200,000 cents, concessions=200,000 cents)"
            - "Property P has 5 OperatingExpense rows for period_year=2025: TAXES=12,000,000, INSURANCE=3,000,000, UTILITIES=4,800,000, REPAIRS=1,800,000, MANAGEMENT=3,600,000 (total 25,200,000 cents)"
            - "MarketAssumption A1 on D1 is_active=true with market_rent_growth_yr1_bps=250, steady=300, expense_growth_bps=200, exit_cap_rate_bps=550, hold_period_years=5, capex_per_unit_cents=500,000, lease_up_months=6"
            - "Scenario S_BASE on D1 (kind=BASE, occupancy_stress_pct=92) exists in DRAFT"
          setup_api_calls:
            - call: "POST /re-underwriting/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: Admin
            - call: "POST /re-underwriting/deals"
              payload: { deal_code: "D-DV1", deal_name: "DV Test", strategy: "VALUE_ADD", target_purchase_price_cents: 1000000000 }
              as: Analyst
              as_user_id: "u-analyst-1"
              captures: { deal_id: $.data.id, deal_v: $.data.version }
            - call: "POST /re-underwriting/deals/${deal_id}/properties"
              payload: { address_line: "1 Main St", market: "Austin, TX", property_type: "MULTIFAMILY", units: 100, rentable_sqft: 100000, year_built: 2005 }
              as: Analyst
              as_user_id: "u-analyst-1"
              captures: { prop_id: $.data.id }
            - call: "POST /re-underwriting/properties/${prop_id}/rent-roll"
              payload: { period_month: "2026-06", occupied_units: 92, total_units: 100, gross_potential_rent_cents: 10000000, collected_rent_cents: 9200000, concessions_cents: 200000, source_doc_ref: "rr-2026-06" }
              as: Analyst
              as_user_id: "u-analyst-1"
            - call: "POST /re-underwriting/properties/${prop_id}/operating-expenses"
              payload: { period_year: 2025, category: "TAXES", amount_cents: 12000000 }
              as: Analyst
              as_user_id: "u-analyst-1"
            - call: "POST /re-underwriting/properties/${prop_id}/operating-expenses"
              payload: { period_year: 2025, category: "INSURANCE", amount_cents: 3000000 }
              as: Analyst
              as_user_id: "u-analyst-1"
            - call: "POST /re-underwriting/properties/${prop_id}/operating-expenses"
              payload: { period_year: 2025, category: "UTILITIES", amount_cents: 4800000 }
              as: Analyst
              as_user_id: "u-analyst-1"
            - call: "POST /re-underwriting/properties/${prop_id}/operating-expenses"
              payload: { period_year: 2025, category: "REPAIRS", amount_cents: 1800000 }
              as: Analyst
              as_user_id: "u-analyst-1"
            - call: "POST /re-underwriting/properties/${prop_id}/operating-expenses"
              payload: { period_year: 2025, category: "MANAGEMENT", amount_cents: 3600000 }
              as: Analyst
              as_user_id: "u-analyst-1"
            - call: "POST /re-underwriting/deals/${deal_id}/assumptions"
              payload: { label: "Base", market_rent_growth_yr1_bps: 250, market_rent_growth_steady_bps: 300, expense_growth_bps: 200, exit_cap_rate_bps: 550, hold_period_years: 5, capex_per_unit_cents: 500000, lease_up_months: 6 }
              as: Analyst
              as_user_id: "u-analyst-1"
              captures: { assum_id: $.data.id }
            - call: "POST /re-underwriting/deals/${deal_id}/submit-underwriting"
              payload: {}
              as: Analyst
              as_user_id: "u-analyst-1"
              captures: { deal_v2: $.data.version }
            - call: "POST /re-underwriting/deals/${deal_id}/scenarios"
              payload: { scenario_kind: "BASE", assumption_id: "${assum_id}", occupancy_stress_pct: 92, expected_deal_version: "${deal_v2}" }
              as: Analyst
              as_user_id: "u-analyst-1"
              captures: { scen_id: $.data.id }
          trigger:
            - call: "POST /re-underwriting/scenarios/${scen_id}/compute"
              payload: {}
              as: Analyst
              as_user_id: "u-analyst-1"
              captures: { noi_prov: $.data.computed_noi_yr1_cents }
          assert:
            - "Scenario.${scen_id}.computed_noi_yr1_cents == 72275600 (provisional variant: concessions netted AFTER growth)"
            - "Scenario.${scen_id}.status == COMPUTED"
            - "Recompute under FINAL variant semantics (after IC pinning) yields 72412400 — a different value for identical inputs, demonstrating dual-variant divergence of 136800 cents"

      - name: debt_sizing_dscr_vs_ltv_binding
        grounds:
          - calculations.debt_size
        distinguishing_aspect: |
          Same scenario NOI produces different sized loans depending on whether
          the DSCR or the LTV constraint binds; the entity domain is a
          DebtSizing on a Scenario (different entity from noi_year1's
          Scenario.computed_* field). Two separate POSTs with different rate /
          min_dscr inputs land on different binding constraints.
        test_recipe:
          setup:
            - "Scenario S1 exists with computed_noi_yr1_cents = 72412400 and deal.target_purchase_price_cents = 1000000000"
          setup_api_calls:
            - call: "POST /re-underwriting/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: Admin
            - call: "POST /re-underwriting/deals"
              payload: { deal_code: "D-DEBT", deal_name: "Debt Test", strategy: "CORE_PLUS", target_purchase_price_cents: 1000000000 }
              as: Analyst
              as_user_id: "u-analyst-1"
              captures: { deal_id: $.data.id }
            - call: "POST /re-underwriting/deals/${deal_id}/properties"
              payload: { address_line: "1 Main St", market: "Austin, TX", property_type: "MULTIFAMILY", units: 100, rentable_sqft: 100000, year_built: 2005 }
              as: Analyst
              as_user_id: "u-analyst-1"
              captures: { prop_id: $.data.id }
            - call: "POST /re-underwriting/properties/${prop_id}/rent-roll"
              payload: { period_month: "2026-06", occupied_units: 92, total_units: 100, gross_potential_rent_cents: 10000000, collected_rent_cents: 9200000, concessions_cents: 200000, source_doc_ref: "rr" }
              as: Analyst
              as_user_id: "u-analyst-1"
            - call: "POST /re-underwriting/properties/${prop_id}/operating-expenses"
              payload: { period_year: 2025, category: "TAXES", amount_cents: 12000000 }
              as: Analyst
              as_user_id: "u-analyst-1"
            - call: "POST /re-underwriting/properties/${prop_id}/operating-expenses"
              payload: { period_year: 2025, category: "INSURANCE", amount_cents: 3000000 }
              as: Analyst
              as_user_id: "u-analyst-1"
            - call: "POST /re-underwriting/properties/${prop_id}/operating-expenses"
              payload: { period_year: 2025, category: "UTILITIES", amount_cents: 4800000 }
              as: Analyst
              as_user_id: "u-analyst-1"
            - call: "POST /re-underwriting/properties/${prop_id}/operating-expenses"
              payload: { period_year: 2025, category: "REPAIRS", amount_cents: 1800000 }
              as: Analyst
              as_user_id: "u-analyst-1"
            - call: "POST /re-underwriting/properties/${prop_id}/operating-expenses"
              payload: { period_year: 2025, category: "MANAGEMENT", amount_cents: 3600000 }
              as: Analyst
              as_user_id: "u-analyst-1"
            - call: "POST /re-underwriting/deals/${deal_id}/assumptions"
              payload: { label: "Base", market_rent_growth_yr1_bps: 250, market_rent_growth_steady_bps: 300, expense_growth_bps: 200, exit_cap_rate_bps: 550, hold_period_years: 5, capex_per_unit_cents: 500000, lease_up_months: 6 }
              as: Analyst
              as_user_id: "u-analyst-1"
              captures: { assum_id: $.data.id }
            - call: "POST /re-underwriting/deals/${deal_id}/submit-underwriting"
              payload: {}
              as: Analyst
              as_user_id: "u-analyst-1"
              captures: { deal_v2: $.data.version }
            - call: "POST /re-underwriting/deals/${deal_id}/scenarios"
              payload: { scenario_kind: "BASE", assumption_id: "${assum_id}", occupancy_stress_pct: 92, expected_deal_version: "${deal_v2}" }
              as: Analyst
              as_user_id: "u-analyst-1"
              captures: { scen_id: $.data.id }
            - call: "POST /re-underwriting/scenarios/${scen_id}/compute"
              payload: {}
              as: Analyst
              as_user_id: "u-analyst-1"
          trigger:
            # Case A: low rate / loose DSCR => LTV binds
            - call: "POST /re-underwriting/scenarios/${scen_id}/debt-sizing"
              payload: { interest_rate_bps: 550, amortization_years: 30, io_months: 12, min_dscr_pct: 125, max_ltv_pct: 65 }
              as: Analyst
              as_user_id: "u-analyst-1"
              captures: { ds_a: $.data.id, loan_a: $.data.loan_amount_cents }
            # Case B: high rate / tight DSCR => DSCR binds (rate=800 bps, min_dscr=150)
            - call: "POST /re-underwriting/scenarios/${scen_id}/debt-sizing"
              payload: { interest_rate_bps: 800, amortization_years: 25, io_months: 0, min_dscr_pct: 150, max_ltv_pct: 75 }
              as: Analyst
              as_user_id: "u-analyst-1"
              captures: { ds_b: $.data.id, loan_b: $.data.loan_amount_cents }
          assert:
            - "DebtSizing.${ds_a}.loan_amount_cents == 650000000 (LTV-bound: 0.65 * 1000000000)"
            - "DebtSizing.${ds_a}.sizing_constraint == LTV"
            - "DebtSizing.${ds_a}.ltv_at_size_pct == 65"
            - "DebtSizing.${ds_b}.sizing_constraint == DSCR (tighter DSCR from higher rate/min_dscr makes DSCR bind before LTV)"
            - "DebtSizing.${ds_b}.loan_amount_cents < DebtSizing.${ds_a}.loan_amount_cents"
            - "DebtSizing.${ds_b}.dscr_at_size_pct == 150 (DSCR binds at exactly the floor)"

  # ===========================================================================
  # Rule 2: combinatorial_formula — instances in DIFFERENT modes (a), (b), (c).
  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: noi_year1_three_input_conditional_branching
        grounds:
          - calculations.noi_year1
        distinguishing_aspect: |
          Mode (a) — formula with >= 3 inputs and non-linear interaction:
          occupancy_stress_pct (scenario field), market_rent_growth_yr1_bps
          (assumption field), and concessions_cents (rent-roll field) interact
          multiplicatively (occ_factor * (1 + growth)) and additively (minus
          concessions), and the provisional-vs-final branch on scenario state
          changes which side of the multiplication concessions lands on.
        test_recipe:
          setup:
            - "Scenario S_DOWNSIDE on D1 with occupancy_stress_pct=85, otherwise identical setup to noi_year1_provisional_vs_final_concession_ordering"
          setup_api_calls:
            - call: "POST /re-underwriting/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: Admin
            - call: "POST /re-underwriting/deals"
              payload: { deal_code: "D-COMB1", deal_name: "Combo 1", strategy: "VALUE_ADD", target_purchase_price_cents: 1000000000 }
              as: Analyst
              as_user_id: "u-analyst-1"
              captures: { deal_id: $.data.id }
            - call: "POST /re-underwriting/deals/${deal_id}/properties"
              payload: { address_line: "1 Main", market: "Austin", property_type: "MULTIFAMILY", units: 100, rentable_sqft: 100000, year_built: 2005 }
              as: Analyst
              as_user_id: "u-analyst-1"
              captures: { prop_id: $.data.id }
            - call: "POST /re-underwriting/properties/${prop_id}/rent-roll"
              payload: { period_month: "2026-06", occupied_units: 92, total_units: 100, gross_potential_rent_cents: 10000000, collected_rent_cents: 9200000, concessions_cents: 200000, source_doc_ref: "rr" }
              as: Analyst
              as_user_id: "u-analyst-1"
            - call: "POST /re-underwriting/properties/${prop_id}/operating-expenses"
              payload: { period_year: 2025, category: "TAXES", amount_cents: 12000000 }
              as: Analyst
              as_user_id: "u-analyst-1"
            - call: "POST /re-underwriting/properties/${prop_id}/operating-expenses"
              payload: { period_year: 2025, category: "INSURANCE", amount_cents: 3000000 }
              as: Analyst
              as_user_id: "u-analyst-1"
            - call: "POST /re-underwriting/properties/${prop_id}/operating-expenses"
              payload: { period_year: 2025, category: "UTILITIES", amount_cents: 4800000 }
              as: Analyst
              as_user_id: "u-analyst-1"
            - call: "POST /re-underwriting/properties/${prop_id}/operating-expenses"
              payload: { period_year: 2025, category: "REPAIRS", amount_cents: 1800000 }
              as: Analyst
              as_user_id: "u-analyst-1"
            - call: "POST /re-underwriting/properties/${prop_id}/operating-expenses"
              payload: { period_year: 2025, category: "MANAGEMENT", amount_cents: 3600000 }
              as: Analyst
              as_user_id: "u-analyst-1"
            - call: "POST /re-underwriting/deals/${deal_id}/assumptions"
              payload: { label: "Base", market_rent_growth_yr1_bps: 250, market_rent_growth_steady_bps: 300, expense_growth_bps: 200, exit_cap_rate_bps: 550, hold_period_years: 5, capex_per_unit_cents: 500000, lease_up_months: 6 }
              as: Analyst
              as_user_id: "u-analyst-1"
              captures: { assum_id: $.data.id }
            - call: "POST /re-underwriting/deals/${deal_id}/submit-underwriting"
              payload: {}
              as: Analyst
              as_user_id: "u-analyst-1"
              captures: { deal_v2: $.data.version }
            - call: "POST /re-underwriting/deals/${deal_id}/scenarios"
              payload: { scenario_kind: "DOWNSIDE", assumption_id: "${assum_id}", occupancy_stress_pct: 85, expected_deal_version: "${deal_v2}" }
              as: Analyst
              as_user_id: "u-analyst-1"
              captures: { scen_id: $.data.id }
          trigger:
            - call: "POST /re-underwriting/scenarios/${scen_id}/compute"
              payload: {}
              as: Analyst
              as_user_id: "u-analyst-1"
          assert:
            # EGI_prov = 120M * 0.85 * 1.025 - 2.4M = 104.55M - 2.4M = 102,150,000
            # opex = 25.2M*1.02 + 10M + 6*10M*0.15 = 25,704,000 + 10,000,000 + 9,000,000 = 44,704,000
            # NOI = 102,150,000 - 44,704,000 = 57,446,000
            - "Scenario.${scen_id}.computed_noi_yr1_cents == 57446000"
            - "An occupancy_stress_pct of 92 instead of 85 on the same inputs yields 72275600 (different branch of conditional logic); the multiplicative interaction (occ * growth) vs additive (minus concessions) is non-linear"

      - name: waterfall_tier_rounding_locked_per_tier
        grounds:
          - calculations.waterfall_split
        distinguishing_aspect: |
          Mode (b) — nested rounding where order matters: each waterfall tier
          (pref, tier1, tier2) rounds its LP/GP split to integer cents BEFORE
          the next tier is computed; if the scaffold instead summed raw and
          rounded only at the end, the resulting gp_promote_cents would differ
          by a few cents. The scaffold pins round_half_up per tier, locked in
          order.
        test_recipe:
          setup:
            - "Scenario S1 COMPUTED with computed_noi_yr1_cents = 72412400"
            - "Deal.target_purchase_price_cents = 1000000000, hold = 5"
          setup_api_calls:
            - call: "POST /re-underwriting/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: Admin
            - call: "POST /re-underwriting/deals"
              payload: { deal_code: "D-WF", deal_name: "WF Test", strategy: "CORE_PLUS", target_purchase_price_cents: 1000000000 }
              as: Analyst
              as_user_id: "u-analyst-1"
              captures: { deal_id: $.data.id }
            - call: "POST /re-underwriting/deals/${deal_id}/properties"
              payload: { address_line: "1 Main", market: "Austin", property_type: "MULTIFAMILY", units: 100, rentable_sqft: 100000, year_built: 2005 }
              as: Analyst
              as_user_id: "u-analyst-1"
              captures: { prop_id: $.data.id }
            - call: "POST /re-underwriting/properties/${prop_id}/rent-roll"
              payload: { period_month: "2026-06", occupied_units: 92, total_units: 100, gross_potential_rent_cents: 10000000, collected_rent_cents: 9200000, concessions_cents: 200000, source_doc_ref: "rr" }
              as: Analyst
              as_user_id: "u-analyst-1"
            - call: "POST /re-underwriting/properties/${prop_id}/operating-expenses"
              payload: { period_year: 2025, category: "TAXES", amount_cents: 12000000 }
              as: Analyst
              as_user_id: "u-analyst-1"
            - call: "POST /re-underwriting/properties/${prop_id}/operating-expenses"
              payload: { period_year: 2025, category: "INSURANCE", amount_cents: 3000000 }
              as: Analyst
              as_user_id: "u-analyst-1"
            - call: "POST /re-underwriting/properties/${prop_id}/operating-expenses"
              payload: { period_year: 2025, category: "UTILITIES", amount_cents: 4800000 }
              as: Analyst
              as_user_id: "u-analyst-1"
            - call: "POST /re-underwriting/properties/${prop_id}/operating-expenses"
              payload: { period_year: 2025, category: "REPAIRS", amount_cents: 1800000 }
              as: Analyst
              as_user_id: "u-analyst-1"
            - call: "POST /re-underwriting/properties/${prop_id}/operating-expenses"
              payload: { period_year: 2025, category: "MANAGEMENT", amount_cents: 3600000 }
              as: Analyst
              as_user_id: "u-analyst-1"
            - call: "POST /re-underwriting/deals/${deal_id}/assumptions"
              payload: { label: "Base", market_rent_growth_yr1_bps: 250, market_rent_growth_steady_bps: 300, expense_growth_bps: 200, exit_cap_rate_bps: 550, hold_period_years: 5, capex_per_unit_cents: 500000, lease_up_months: 6 }
              as: Analyst
              as_user_id: "u-analyst-1"
              captures: { assum_id: $.data.id }
            - call: "POST /re-underwriting/deals/${deal_id}/submit-underwriting"
              payload: {}
              as: Analyst
              as_user_id: "u-analyst-1"
              captures: { deal_v2: $.data.version }
            - call: "POST /re-underwriting/deals/${deal_id}/scenarios"
              payload: { scenario_kind: "BASE", assumption_id: "${assum_id}", occupancy_stress_pct: 92, expected_deal_version: "${deal_v2}" }
              as: Analyst
              as_user_id: "u-analyst-1"
              captures: { scen_id: $.data.id }
            - call: "POST /re-underwriting/scenarios/${scen_id}/compute"
              payload: {}
              as: Analyst
              as_user_id: "u-analyst-1"
          trigger:
            - call: "POST /re-underwriting/scenarios/${scen_id}/waterfall"
              payload: { pref_return_bps: 800, promote_tier1_bps: 2000, tier1_hurdle_bps: 1200, promote_tier2_bps: 3000 }
              as: Analyst
              as_user_id: "u-analyst-1"
              captures: { wf_id: $.data.id }
          assert:
            - "Waterfall.${wf_id}.lp_split_cents + Waterfall.${wf_id}.gp_split_cents == sum of total projected distributions (conservation of cash)"
            - "Waterfall.${wf_id}.gp_promote_cents == Waterfall.${wf_id}.gp_split_cents - 100000000 (GP equity share is 10% of $1B = $1M = 100000000 cents)"
            - "Per-tier rounding: each tier's gp_tier and lp_tier are round_half_up'd to integer cents BEFORE the next tier reads them, so gp_promote_cents differs from a sum-then-round implementation by >= 0 cents deterministically"

  # ===========================================================================
  # Rule 3: non_linear_state_machine — different entities with non-linear shape.
  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: deal_reopen_loop_underwriting_to_draft_and_back
        grounds:
          - state_machines.Deal.UNDERWRITING_to_DRAFT
          - state_machines.Deal.DRAFT_to_UNDERWRITING
        distinguishing_aspect: |
          Deal has a branching/cyclic shape: UNDERWRITING -> DRAFT -> UNDERWRITING
          (reopen loop) and UNDERWRITING -> IC_REVIEW -> REJECTED -> UNDERWRITING
          (revision cycle). This is NOT a linear pipeline. Different entity from
          the Scenario machine below.
        test_recipe:
          setup:
            - "Deal D1 in UNDERWRITING with Property + active MarketAssumption"
          setup_api_calls:
            - call: "POST /re-underwriting/deals"
              payload: { deal_code: "D-SM1", deal_name: "SM Test", strategy: "CORE", target_purchase_price_cents: 500000000 }
              as: Analyst
              as_user_id: "u-analyst-1"
              captures: { deal_id: $.data.id }
            - call: "POST /re-underwriting/deals/${deal_id}/properties"
              payload: { address_line: "5 Elm", market: "Denver", property_type: "OFFICE", units: 20, rentable_sqft: 50000, year_built: 2010 }
              as: Analyst
              as_user_id: "u-analyst-1"
            - call: "POST /re-underwriting/deals/${deal_id}/assumptions"
              payload: { label: "Base", market_rent_growth_yr1_bps: 200, market_rent_growth_steady_bps: 250, expense_growth_bps: 200, exit_cap_rate_bps: 600, hold_period_years: 7, capex_per_unit_cents: 250000, lease_up_months: 3 }
              as: Analyst
              as_user_id: "u-analyst-1"
            - call: "POST /re-underwriting/deals/${deal_id}/submit-underwriting"
              payload: {}
              as: Analyst
              as_user_id: "u-analyst-1"
          trigger:
            - call: "POST /re-underwriting/deals/${deal_id}/reopen"
              payload: {}
              as: Analyst
              as_user_id: "u-analyst-1"
              captures: { v_back: $.data.version }
            - call: "POST /re-underwriting/deals/${deal_id}/submit-underwriting"
              payload: {}
              as: Analyst
              as_user_id: "u-analyst-1"
          assert:
            - "After reopen: Deal.${deal_id}.status == DRAFT (looped back)"
            - "After second submit-underwriting: Deal.${deal_id}.status == UNDERWRITING (cycle completes)"
            - "Each transition increments version (version observed across the loop increases monotonically)"

      - name: scenario_supersede_cascade_from_deal_reopen
        grounds:
          - state_machines.Scenario.COMPUTED_to_SUPERSEDED
          - state_machines.Deal.UNDERWRITING_to_DRAFT
        distinguishing_aspect: |
          Scenario's COMPUTED -> SUPERSEDED is an automatic cascade triggered by
          a Deal reopen transition (cross-entity state machine interaction);
          the Scenario machine itself has only DRAFT->COMPUTED and
          COMPUTED->SUPERSEDED, but its SUPERSEDED entry point is reached via a
          cyclic parent-machine transition. Different entity from Deal above.
        test_recipe:
          setup:
            - "Deal D1 in UNDERWRITING with Property + active assumption + Scenario S1 already COMPUTED"
          setup_api_calls:
            - call: "POST /re-underwriting/deals"
