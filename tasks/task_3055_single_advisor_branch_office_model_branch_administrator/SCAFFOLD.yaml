  - method: GET
    path: /branch-office/training-programs/{id}
    description: Fetch one training program.
    roles: [HomeOfficeAdmin, Advisor]
    code: 200
    input: []
    output: TrainingProgram
    side_effects: []
  - method: GET
    path: /branch-office/training-programs
    description: List training programs; optional advisor_id filter.
    roles: [HomeOfficeAdmin]
    code: 200
    input: ["advisor_id?"]
    output: TrainingProgram[]
    side_effects: []
  - method: GET
    path: /branch-office/training-programs/{id}/evaluations
    description: List milestone evaluations of a program.
    roles: [HomeOfficeAdmin, Advisor]
    code: 200
    input: []
    output: MilestoneEvaluation[]
