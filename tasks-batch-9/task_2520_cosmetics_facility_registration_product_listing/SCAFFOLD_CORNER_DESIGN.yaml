            - "${rate} == 95.00 (provisional 95.00 selects the 0% tier, so the denominator stays 1000) and ${verdict} == \"EFFECTIVE\""
            - "${wd_status} == \"CLOSED_EFFECTIVE\" and ${checker} == \"OFF-2\""
            - "RecallAction ${ra_id}.status == \"CLOSED_EFFECTIVE\" and ProductListing ${lst_id}.open_recall_count == 0"

      - name: the_reviewer_who_screened_the_dossier_may_not_issue_the_full_decision
        claim_type: segregation_of_duties
        grounds:
          - segregation_rules.screening-reviewer-may-not-issue-full-decision
          - errors[ERR_SEGREGATION_OF_DUTIES]
          - state_machines.SafetySubstantiation.DEFICIENT_to_SUBMITTED
        distinguishing_aspect: |
          The second segregation rule runs along the review dimension and survives a revision cycle:
          RVW-1 issues the SCREENING decision on round 1, and after the firm resubmits, RVW-1 is barred
          from the FULL decision on round 2 (ERR_SEGREGATION_OF_DUTIES, 403) while RVW-2 may issue it.
          The bar follows the stored screening_reviewer_user_id across the state cycle.
        test_recipe:
          setup:
            - "one REGISTERED facility, one listing, one single-item dossier submitted for review"
          setup_api_calls:
            - call: "POST /cosmetics/facilities"
              payload: { facility_name: "Aster Labs Newark", owner_operator_name: "Aster Holdings LLC", facility_type: "MANUFACTURER", country_code: "US", state_or_province: "NJ" }
              as: FacilityRegistrant
              captures: { fac_id: $.data.id }
            - call: "POST /cosmetics/facilities/${fac_id}/submit-registration"
              payload: {}
              as: FacilityRegistrant
              as_user_id: "${fac_id}"
            - call: "POST /cosmetics/facilities/${fac_id}/registration-decision"
              payload: { decision: "APPROVE" }
              as: RegulatoryReviewer
              as_user_id: "RVW-1"
            - call: "POST /cosmetics/responsible-persons"
              payload: { legal_name: "Aster Brands Inc", us_address_line: "12 Market St, Newark NJ 07102", contact_phone: "+1-202-555-0110", contact_email: "safety@aster.example" }
              as: ResponsiblePersonAgent
              captures: { rp_id: $.data.id }
            - call: "POST /cosmetics/listings"
              payload: { facility_id: "${fac_id}", responsible_person_id: "${rp_id}", product_name: "Aster Blush Powder", category_code: "07A", product_form: "LEAVE_ON", label_contact_type: "ELECTRONIC_CONTACT", label_contact_value: "safety@aster.example" }
              as: ResponsiblePersonAgent
              as_user_id: "${rp_id}"
              captures: { lst_id: $.data.id }
            - call: "POST /cosmetics/listings/${lst_id}/substantiations"
              payload: { assessor_name: "Dr. Imani Ferro", assessment_basis: "PRODUCT_SPECIFIC" }
              as: ResponsiblePersonAgent
              as_user_id: "${rp_id}"
              captures: { sub_id: $.data.id }
            - call: "POST /cosmetics/substantiations/${sub_id}/review-items"
              payload: { evidence_type: "LITERATURE_REVIEW", reviewer_credential: "OTHER", citation: "Secondary literature digest, 2024" }
              as: ResponsiblePersonAgent
              as_user_id: "${rp_id}"
            - call: "POST /cosmetics/substantiations/${sub_id}/submit"
              payload: {}
              as: ResponsiblePersonAgent
              as_user_id: "${rp_id}"
          trigger:
            - call: "POST /cosmetics/substantiations/${sub_id}/review-decision"
              payload: { review_mode: "SCREENING" }
              as: RegulatoryReviewer
              as_user_id: "RVW-1"
              captures: { screen_score: $.data.adequacy_score, screen_status: $.data.status, screener: $.data.screening_reviewer_user_id }
            - call: "POST /cosmetics/substantiations/${sub_id}/submit"
              payload: {}
              as: ResponsiblePersonAgent
              as_user_id: "${rp_id}"
              captures: { round2: $.data.revision_round }
            - call: "POST /cosmetics/substantiations/${sub_id}/review-decision"
              payload: { review_mode: "FULL" }
              as: RegulatoryReviewer
              as_user_id: "RVW-1"
              captures: { err_sod: $.data.error_id }
            - call: "POST /cosmetics/substantiations/${sub_id}/review-decision"
              payload: { review_mode: "FULL" }
              as: RegulatoryReviewer
              as_user_id: "RVW-2"
              captures: { full_score: $.data.adequacy_score, full_status: $.data.status, fuller: $.data.full_reviewer_user_id }
          assert:
            - "${screen_score} == 5.00 (raw sum of the single LITERATURE_REVIEW item) and ${screen_status} == \"DEFICIENT\""
            - "${screener} == \"RVW-1\""
            - "${round2} == 2 — the resubmission increments the revision round and returns the dossier to SUBMITTED"
            - "${err_sod} == \"ERR_SEGREGATION_OF_DUTIES\" with HTTP 403 — the same reviewer cannot escalate its own screening"
            - "${full_score} == 5.00 and ${full_status} == \"DEFICIENT\" and ${fuller} == \"RVW-2\""
            - "the failed call left review_mode and full_reviewer_user_id untouched until RVW-2 acted"

  - section: complexity_layers
    instances:
      - name: second_ownership_filing_with_the_first_filings_version_is_rejected
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules.ownership-change-file-stale-facility
          - errors[ERR_STALE_FACILITY_VERSION]
          - validations[priority=17]
        distinguishing_aspect: |
          The OCC token is invalidated by a sibling write on the same parent: filing ownership change A
          bumps Facility.version, so filing change B with the version captured before A returns
          ERR_STALE_FACILITY_VERSION (412). Re-reading the facility and filing B with the fresh version
          succeeds, at which point A becomes SUPERSEDED — the guard is a real write-conflict detector, not
          a payload format check.
        test_recipe:
          setup:
            - "one REGISTERED facility whose version is captured immediately after approval"
          setup_api_calls:
            - call: "POST /cosmetics/facilities"
              payload: { facility_name: "Aster Labs Newark", owner_operator_name: "Aster Holdings LLC", facility_type: "MANUFACTURER", country_code: "US", state_or_province: "NJ" }
              as: FacilityRegistrant
              captures: { fac_id: $.data.id }
            - call: "POST /cosmetics/facilities/${fac_id}/submit-registration"
              payload: {}
              as: FacilityRegistrant
              as_user_id: "${fac_id}"
            - call: "POST /cosmetics/facilities/${fac_id}/registration-decision"
              payload: { decision: "APPROVE" }
              as: RegulatoryReviewer
              as_user_id: "RVW-1"
              captures: { v0: $.data.version }
          trigger:
            - call: "POST /cosmetics/facilities/${fac_id}/ownership-changes"
              payload: { new_owner_operator_name: "Brightline Beauty Holdings", change_effective_date: "2026-08-01", expected_facility_version: "${v0}" }
              as: FacilityRegistrant
              as_user_id: "${fac_id}"
              captures: { oc_a: $.data.id, oc_a_status: $.data.status, oc_a_deadline: $.data.filing_deadline_at }
            - call: "POST /cosmetics/facilities/${fac_id}/ownership-changes"
              payload: { new_owner_operator_name: "Halcyon Personal Care Group", change_effective_date: "2026-08-01", expected_facility_version: "${v0}" }
              as: FacilityRegistrant
              as_user_id: "${fac_id}"
              captures: { err_stale: $.data.error_id }
            - call: "GET /cosmetics/facilities/${fac_id}"
              payload: {}
              as: FacilityRegistrant
              as_user_id: "${fac_id}"
              captures: { v1: $.data.version }
            - call: "POST /cosmetics/facilities/${fac_id}/ownership-changes"
              payload: { new_owner_operator_name: "Halcyon Personal Care Group", change_effective_date: "2026-08-01", expected_facility_version: "${v1}" }
              as: FacilityRegistrant
              as_user_id: "${fac_id}"
              captures: { oc_b: $.data.id, oc_b_status: $.data.status }
          assert:
            - "${oc_a_status} == \"FILED\" and ${oc_a_deadline} == \"2026-09-30T23:59:59.999Z\" (change_effective_date + 60 days, end of day)"
            - "${err_stale} == \"ERR_STALE_FACILITY_VERSION\" with HTTP 412 — the token was consumed by filing A"
            - "${v1} == ${v0} + 1 — every accepted write increments the facility version exactly once"
            - "${oc_b_status} == \"FILED\" — the retry with the refreshed version succeeds"
            - "GET /cosmetics/facilities/${fac_id}/ownership-changes?status=SUPERSEDED returns exactly ${oc_a}"
            - "GET /cosmetics/facilities/${fac_id}/ownership-changes?status=FILED returns exactly ${oc_b}"
            - "Facility ${fac_id}.owner_operator_name is still \"Aster Holdings LLC\" — filing alone does not rename the owner"

      - name: second_withdrawal_with_the_first_withdrawals_version_is_rejected
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules.withdrawal-create-stale-recall
          - errors[ERR_STALE_RECALL_VERSION]
          - validations[priority=19]
        distinguishing_aspect: |
          The same guard on a different aggregate and a different occ_field: opening withdrawal round 1
          bumps RecallAction.version, so a round-2 creation replaying the accepted-plan version answers
          ERR_STALE_RECALL_VERSION (412) rather than silently forking a second live withdrawal. Only after
          a re-read does the superseding round open.
        test_recipe:
          setup:
            - "one REGISTERED facility, one listing, one recall whose plan OFF-1 accepted, version captured at that moment"
          setup_api_calls:
            - call: "POST /cosmetics/facilities"
              payload: { facility_name: "Aster Labs Newark", owner_operator_name: "Aster Holdings LLC", facility_type: "MANUFACTURER", country_code: "US", state_or_province: "NJ" }
              as: FacilityRegistrant
              captures: { fac_id: $.data.id }
            - call: "POST /cosmetics/facilities/${fac_id}/submit-registration"
              payload: {}
              as: FacilityRegistrant
              as_user_id: "${fac_id}"
            - call: "POST /cosmetics/facilities/${fac_id}/registration-decision"
              payload: { decision: "APPROVE" }
              as: RegulatoryReviewer
              as_user_id: "RVW-1"
            - call: "POST /cosmetics/responsible-persons"
              payload: { legal_name: "Aster Brands Inc", us_address_line: "12 Market St, Newark NJ 07102", contact_phone: "+1-202-555-0110", contact_email: "safety@aster.example" }
              as: ResponsiblePersonAgent
              captures: { rp_id: $.data.id }
            - call: "POST /cosmetics/listings"
              payload: { facility_id: "${fac_id}", responsible_person_id: "${rp_id}", product_name: "Aster Blush Powder", category_code: "07A", product_form: "LEAVE_ON", label_contact_type: "ELECTRONIC_CONTACT", label_contact_value: "safety@aster.example", lot_authorized_units: 5000 }
              as: ResponsiblePersonAgent
              as_user_id: "${rp_id}"
              captures: { lst_id: $.data.id }
            - call: "POST /cosmetics/listings/${lst_id}/recall-actions"
              payload: { initiation_basis: "MANDATORY_ORDER", hazard_class: "CLASS_I" }
              as: EnforcementOfficer
              as_user_id: "OFF-1"
              captures: { ra_id: $.data.id }
            - call: "POST /cosmetics/recall-actions/${ra_id}/plan"
              payload: { corrective_summary: "Retail-level retrieval", distribution_depth: "RETAIL" }
              as: ResponsiblePersonAgent
              as_user_id: "${rp_id}"
            - call: "POST /cosmetics/recall-actions/${ra_id}/plan-decision"
              payload: { decision: "ACCEPT" }
              as: EnforcementOfficer
              as_user_id: "OFF-1"
              captures: { ra_v0: $.data.version }
          trigger:
            - call: "POST /cosmetics/recall-actions/${ra_id}/withdrawals"
              payload: { scope_depth: "RETAIL", expected_recall_action_version: "${ra_v0}" }
              as: EnforcementOfficer
              as_user_id: "OFF-1"
              captures: { wd1: $.data.id, wd1_status: $.data.status }
            - call: "POST /cosmetics/recall-actions/${ra_id}/withdrawals"
              payload: { scope_depth: "CONSUMER", expected_recall_action_version: "${ra_v0}" }
              as: EnforcementOfficer
              as_user_id: "OFF-1"
              captures: { err_stale: $.data.error_id }
            - call: "GET /cosmetics/recall-actions/${ra_id}"
              payload: {}
              as: EnforcementOfficer
              as_user_id: "OFF-1"
              captures: { ra_v1: $.data.version }
            - call: "POST /cosmetics/recall-actions/${ra_id}/withdrawals"
              payload: { scope_depth: "CONSUMER", expected_recall_action_version: "${ra_v1}" }
              as: EnforcementOfficer
              as_user_id: "OFF-1"
              captures: { wd2: $.data.id, wd2_status: $.data.status }
          assert:
            - "${wd1_status} == \"INITIATED\" and RecallAction ${ra_id}.status moves to \"EXECUTING\" on the first withdrawal"
            - "${err_stale} == \"ERR_STALE_RECALL_VERSION\" with HTTP 412 — no second withdrawal is created"
            - "GET /cosmetics/recall-actions/${ra_id}/withdrawals returns exactly one row immediately after the rejected call"
            - "${ra_v1} == ${ra_v0} + 1"
            - "${wd2_status} == \"INITIATED\" and ${wd2} != ${wd1} — the superseding round opens only with the refreshed version, and GET /cosmetics/recall-actions/${ra_id}/withdrawals then returns two rows"

      - name: sweep_is_a_checkpoint_that_does_not_repeat_its_work_at_a_fixed_clock
        claim_type: ops_run_checkpoint
        grounds:
          - endpoints[POST /cosmetics/_ops/compliance-sweep]
          - state_machines.Facility.REGISTERED_to_RENEWAL_DUE
          - complexity_layers.ops_run_checkpoint
        distinguishing_aspect: |
          The idempotency claim with real work to do: at a clock inside the renewal window the first sweep
          reports renewal_due_facility_count 1 and moves the facility to RENEWAL_DUE, while the second
          sweep at the SAME clock reports 0 for every counter and leaves the facility (and its version)
          exactly where the first sweep left it — the checkpoint is per-clock-value, not per-call.
        test_recipe:
          setup:
            - "one facility approved at 2026-08-01 (period ends 2028-07-31), clock moved to 2028-05-02 — the first day of its renewal window"
          setup_api_calls:
            - call: "POST /cosmetics/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: SystemOperator
              as_user_id: "OPS-1"
            - call: "POST /cosmetics/facilities"
              payload: { facility_name: "Aster Labs Newark", owner_operator_name: "Aster Holdings LLC", facility_type: "MANUFACTURER", country_code: "US", state_or_province: "NJ" }
              as: FacilityRegistrant
              captures: { fac_id: $.data.id }
            - call: "POST /cosmetics/facilities/${fac_id}/submit-registration"
              payload: {}
              as: FacilityRegistrant
              as_user_id: "${fac_id}"
            - call: "POST /cosmetics/facilities/${fac_id}/registration-decision"
              payload: { decision: "APPROVE" }
              as: RegulatoryReviewer
              as_user_id: "RVW-1"
            - call: "POST /cosmetics/_clock/set_current_utc"
              payload: { current_utc: "2028-05-02T00:00:00Z" }
              as: SystemOperator
              as_user_id: "OPS-1"
          trigger:
            - call: "POST /cosmetics/_ops/compliance-sweep"
              payload: {}
              as: SystemOperator
              as_user_id: "OPS-1"
              captures: { due1: $.data.renewal_due_facility_count, lapsed1: $.data.lapsed_facility_count }
            - call: "GET /cosmetics/facilities/${fac_id}"
              payload: {}
              as: SystemOperator
              as_user_id: "OPS-1"
              captures: { status1: $.data.registration_status, v1: $.data.version }
            - call: "POST /cosmetics/_ops/compliance-sweep"
              payload: {}
              as: SystemOperator
              as_user_id: "OPS-1"
              captures: { due2: $.data.renewal_due_facility_count, lapsed2: $.data.lapsed_facility_count }
            - call: "GET /cosmetics/facilities/${fac_id}"
              payload: {}
              as: SystemOperator
              as_user_id: "OPS-1"
              captures: { status2: $.data.registration_status, v2: $.data.version }
          assert:
            - "${due1} == 1 and ${lapsed1} == 0 — the facility is inside its renewal window but not past grace"
            - "${status1} == \"RENEWAL_DUE\""
            - "${due2} == 0 and ${lapsed2} == 0 — the repeat sweep at the same clock claims no work"
            - "${status2} == \"RENEWAL_DUE\" and ${v2} == ${v1} — no second write occurred"
            - "GET /cosmetics/facilities/${fac_id}/ledger-entries?entry_type=SWEEP_TRANSITION returns exactly one row across both sweeps"

      - name: stale_listing_version_guards_the_designation_transfer
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules.transfer-designation-stale-listing
          - errors[ERR_STALE_LISTING_VERSION]
        excluded_because:
          difficulty_instance: stale_listing_version_outranks_same_person_transfer_target
          rationale: |
            The third concurrency rule is exercised by that §1.8 instance, which fires
            ERR_STALE_LISTING_VERSION (412) on a stale expected_listing_version and then succeeds with the
            refreshed one — the full OCC claim for this endpoint.

      - name: one_late_report_drives_a_four_hop_side_effect_chain
        claim_type: cascading_side_effects
        grounds:
          - state_machines.AdverseEvent.REPORT_DUE_to_REPORTED_LATE
          - calculations.facility_compliance_posture
        excluded_because:
          difficulty_instance: late_serious_report_cascades_points_posture_dossier_and_listing
          rationale: |
            That §1.8 transitive-cascade instance verifies the whole event -> points -> posture -> dossier
            revalidation -> listing chain end to end with the intermediate values pinned at each hop,
            which is exactly the multi-level cascade claim.

      - name: sweep_cascade_ordering_is_observable_across_four_entities
        claim_type: cascading_side_effects
        grounds:
          - endpoints[POST /cosmetics/_ops/compliance-sweep]
          - state_machines.Facility.RENEWAL_DUE_to_LAPSED
        excluded_because:
          difficulty_instance: sweep_lapse_cascades_posture_listing_designation_and_dormancy
          rationale: |
            The ordering sensitivity of the sweep's three steps and its four-entity fan-out (facility
            lapse -> listing suspension -> designation release -> person dormancy) are pinned by that
            §1.8 instance, including the counts each step must report.

      - name: both_adequacy_variants_run_over_one_dossier
        claim_type: dual_variant_calculation
        grounds:
          - calculations.substantiation_adequacy_score
          - complexity_layers.dual_variant_calculation
        excluded_because:
          difficulty_instance: substantiation_full_deficient_then_screening_adequate_on_one_dossier
          rationale: |
            That §1.8 dual-variant instance scores the identical item set under FULL and SCREENING on one
            dossier and pins the opposite verdicts plus the delta, which is the whole layer claim; the
            corner instances above touch only single-variant constants (the cap and the data-gap penalty).

  - section: errors
    instances:
      # Coverage map for the 56-code catalog (all codes are triggered somewhere across §1.8 and §1.9):
      #   401/403 family (ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_NOT_RESOURCE_OWNER,
      #     ERR_SEGREGATION_OF_DUTIES) -> rbac section + the unauthenticated instance below.
      #   404 family (10 *_NOT_FOUND codes) -> entities section (FACILITY, LISTING) + the multi-lookup
      #     instance below (RESPONSIBLE_PERSON, SUBSTANTIATION, ADVERSE_EVENT, INSPECTION, RECALL_ACTION,
      #     WITHDRAWAL, OWNERSHIP_CHANGE, DISTRIBUTION_RECORD) + endpoints bulk-action instance.
      #   400/422 shape family (ERR_INVALID_REQUEST, ERR_UNKNOWN_CATEGORY_CODE, ERR_INVALID_WINDOW_BOUNDS)
      #     -> entities + validations sections + the invalid-request instance below.
      #   412 OCC family (STALE FACILITY / LISTING / RECALL) -> complexity_layers section.
      #   state family (8 ERR_INVALID_*_STATE codes) -> state_machines section.
      #   domain family (the remaining 30 codes) -> calculations, validations and rbac sections, plus the
      #     §1.8 instances cited by this file's excluded_because stubs.
      - name: every_child_entity_lookup_is_reachable_as_not_found
        claim_type: error_triggerable
        grounds:
          - errors[ERR_RESPONSIBLE_PERSON_NOT_FOUND]
          - errors[ERR_SUBSTANTIATION_NOT_FOUND]
          - errors[ERR_ADVERSE_EVENT_NOT_FOUND]
          - errors[ERR_INSPECTION_NOT_FOUND]
          - errors[ERR_RECALL_ACTION_NOT_FOUND]
          - errors[ERR_WITHDRAWAL_NOT_FOUND]
          - errors[ERR_OWNERSHIP_CHANGE_NOT_FOUND]
          - errors[ERR_DISTRIBUTION_RECORD_NOT_FOUND]
        distinguishing_aspect: |
          Each aggregate root has its OWN 404 code, so a well-formed but unknown UUID must be answered
          with the code named for that entity rather than a generic not-found — and, for the nested
          inspection path, the parent facility exists while the child id does not, which must still yield
          ERR_INSPECTION_NOT_FOUND rather than ERR_FACILITY_NOT_FOUND.
        test_recipe:
          setup:
            - "one REGISTERED facility and one ResponsiblePerson so that every caller identity is real"
          setup_api_calls:
            - call: "POST /cosmetics/facilities"
              payload: { facility_name: "Aster Labs Newark", owner_operator_name: "Aster Holdings LLC", facility_type: "MANUFACTURER", country_code: "US", state_or_province: "NJ" }
              as: FacilityRegistrant
              captures: { fac_id: $.data.id }
            - call: "POST /cosmetics/facilities/${fac_id}/submit-registration"
              payload: {}
              as: FacilityRegistrant
              as_user_id: "${fac_id}"
            - call: "POST /cosmetics/facilities/${fac_id}/registration-decision"
              payload: { decision: "APPROVE" }
              as: RegulatoryReviewer
              as_user_id: "RVW-1"
            - call: "POST /cosmetics/responsible-persons"
              payload: { legal_name: "Aster Brands Inc", us_address_line: "12 Market St, Newark NJ 07102", contact_phone: "+1-202-555-0110", contact_email: "safety@aster.example" }
              as: ResponsiblePersonAgent
              captures: { rp_id: $.data.id }
          trigger:
            - call: "GET /cosmetics/responsible-persons/11111111-1111-4111-8111-111111111111"
              payload: {}
              as: RegulatoryReviewer
              as_user_id: "RVW-1"
              captures: { e_rp: $.data.error_id }
            - call: "GET /cosmetics/substantiations/22222222-2222-4222-8222-222222222222"
              payload: {}
              as: RegulatoryReviewer
              as_user_id: "RVW-1"
              captures: { e_sub: $.data.error_id }
            - call: "POST /cosmetics/adverse-events/33333333-3333-4333-8333-333333333333/report"
              payload: { report_narrative: "No such event" }
              as: ResponsiblePersonAgent
              as_user_id: "${rp_id}"
              captures: { e_ae: $.data.error_id }
            - call: "POST /cosmetics/facilities/${fac_id}/inspections/44444444-4444-4444-8444-444444444444/response"
              payload: { response_summary: "No such inspection" }
              as: FacilityRegistrant
              as_user_id: "${fac_id}"
              captures: { e_insp: $.data.error_id }
            - call: "GET /cosmetics/recall-actions/55555555-5555-4555-8555-555555555555"
              payload: {}
              as: EnforcementOfficer
              as_user_id: "OFF-1"
              captures: { e_ra: $.data.error_id }
            - call: "GET /cosmetics/withdrawals/66666666-6666-4666-8666-666666666666"
              payload: {}
              as: EnforcementOfficer
              as_user_id: "OFF-1"
              captures: { e_wd: $.data.error_id }
            - call: "POST /cosmetics/ownership-changes/77777777-7777-4777-8777-777777777777/decision"
              payload: { decision: "ACCEPT" }
              as: RegulatoryReviewer
              as_user_id: "RVW-1"
              captures: { e_oc: $.data.error_id }
            - call: "GET /cosmetics/distribution-records/88888888-8888-4888-8888-888888888888"
              payload: {}
              as: EnforcementOfficer
              as_user_id: "OFF-1"
              captures: { e_dr: $.data.error_id }
          assert:
            - "${e_rp} == \"ERR_RESPONSIBLE_PERSON_NOT_FOUND\" (404)"
            - "${e_sub} == \"ERR_SUBSTANTIATION_NOT_FOUND\" (404)"
            - "${e_ae} == \"ERR_ADVERSE_EVENT_NOT_FOUND\" (404)"
            - "${e_insp} == \"ERR_INSPECTION_NOT_FOUND\" (404) — the existing parent facility does not mask the missing child"
            - "${e_ra} == \"ERR_RECALL_ACTION_NOT_FOUND\" (404)"
            - "${e_wd} == \"ERR_WITHDRAWAL_NOT_FOUND\" (404)"
            - "${e_oc} == \"ERR_OWNERSHIP_CHANGE_NOT_FOUND\" (404)"
            - "${e_dr} == \"ERR_DISTRIBUTION_RECORD_NOT_FOUND\" (404)"
            - "every response body carries error_id and message and no entity was created or modified"

      - name: missing_user_header_is_unauthenticated_before_every_other_check
        claim_type: error_triggerable
        grounds:
          - errors[ERR_UNAUTHENTICATED]
          - validations[priority=1]
        distinguishing_aspect: |
          Priority 1 outranks everything: a request with no X-User-ID header answers ERR_UNAUTHENTICATED
          (401) even when the SAME request would also fail on role (priority 2), on a missing resource
          (priority 3) and on a malformed payload (priority 14) — so authentication cannot be inferred
          from any later error.
        test_recipe:
          setup:
            - "one REGISTERED facility"
          setup_api_calls:
            - call: "POST /cosmetics/facilities"
              payload: { facility_name: "Aster Labs Newark", owner_operator_name: "Aster Holdings LLC", facility_type: "MANUFACTURER", country_code: "US", state_or_province: "NJ" }
              as: FacilityRegistrant
              captures: { fac_id: $.data.id }
            - call: "POST /cosmetics/facilities/${fac_id}/submit-registration"
              payload: {}
              as: FacilityRegistrant
              as_user_id: "${fac_id}"
            - call: "POST /cosmetics/facilities/${fac_id}/registration-decision"
              payload: { decision: "APPROVE" }
              as: RegulatoryReviewer
              as_user_id: "RVW-1"
          trigger:
            - call: "GET /cosmetics/facilities/${fac_id}"
              payload: {}
              as: RegulatoryReviewer
              as_user_id: ""
              captures: { e_read: $.data.error_id }
            - call: "POST /cosmetics/facilities/99999999-9999-4999-8999-999999999999/registration-decision"
              payload: { decision: "NOT_A_DECISION" }
              as: RegulatoryReviewer
              as_user_id: ""
              captures: { e_stack: $.data.error_id }
          assert:
            - "the X-User-ID header is ABSENT on both trigger calls (an empty as_user_id denotes no identity)"
            - "${e_read} == \"ERR_UNAUTHENTICATED\" with HTTP 401"
            - "${e_stack} == \"ERR_UNAUTHENTICATED\" with HTTP 401 — not ERR_FACILITY_NOT_FOUND and not ERR_INVALID_REQUEST, even though both would apply"
            - "Facility ${fac_id}.registration_status is still \"REGISTERED\" — nothing was read or written"

      - name: malformed_payloads_all_collapse_to_invalid_request
        claim_type: error_triggerable
        grounds:
          - errors[ERR_INVALID_REQUEST]
          - validations[priority=14]
        distinguishing_aspect: |
          Three different shape failures on the same endpoint family — a missing required field, an
          out-of-enum value and a wrong scalar type — all answer ERR_INVALID_REQUEST (400) rather than
          leaking three separate codes, and each is decided before any domain rule of lower priority
          (the enum failure never reaches the category registry or the label-contact rules).
        test_recipe:
          setup:
            - "one REGISTERED facility and one ResponsiblePerson"
          setup_api_calls:
            - call: "POST /cosmetics/facilities"
              payload: { facility_name: "Aster Labs Newark", owner_operator_name: "Aster Holdings LLC", facility_type: "MANUFACTURER", country_code: "US", state_or_province: "NJ" }
              as: FacilityRegistrant
              captures: { fac_id: $.data.id }
            - call: "POST /cosmetics/facilities/${fac_id}/submit-registration"
              payload: {}
              as: FacilityRegistrant
              as_user_id: "${fac_id}"
            - call: "POST /cosmetics/facilities/${fac_id}/registration-decision"
              payload: { decision: "APPROVE" }
              as: RegulatoryReviewer
              as_user_id: "RVW-1"
            - call: "POST /cosmetics/responsible-persons"
              payload: { legal_name: "Aster Brands Inc", us_address_line: "12 Market St, Newark NJ 07102", contact_phone: "+1-202-555-0110", contact_email: "safety@aster.example" }
              as: ResponsiblePersonAgent
              captures: { rp_id: $.data.id }
          trigger:
            - call: "POST /cosmetics/listings"
              payload: { facility_id: "${fac_id}", responsible_person_id: "${rp_id}", category_code: "07A", product_form: "LEAVE_ON", label_contact_type: "ELECTRONIC_CONTACT", label_contact_value: "safety@aster.example" }
              as: ResponsiblePersonAgent
              as_user_id: "${rp_id}"
              captures: { e_missing: $.data.error_id }
            - call: "POST /cosmetics/facilities/${fac_id}/registration-decision"
              payload: { decision: "MAYBE_LATER" }
              as: RegulatoryReviewer
              as_user_id: "RVW-1"
              captures: { e_enum: $.data.error_id }
            - call: "POST /cosmetics/listings/${fac_id}/distribution-records"
              payload: { lot_code: "LOT-X", consignee_name: "Gulf Coast Retail Group", consignee_class: "RETAIL", ship_date: "2026-08-05T00:00:00Z", delivery_date: "2026-08-08T00:00:00Z", units_shipped: "a lot" }
              as: ResponsiblePersonAgent
              as_user_id: "${rp_id}"
              captures: { e_type: $.data.error_id }
          assert:
            - "${e_missing} == \"ERR_INVALID_REQUEST\" with HTTP 400 — product_name is required"
            - "${e_enum} == \"ERR_INVALID_REQUEST\" with HTTP 400 — the decision enum is checked at priority 14, so the facility stays REGISTERED"
            - "${e_type} == \"ERR_INVALID_REQUEST\" with HTTP 400 — a non-integer units_shipped is rejected before the listing id is even resolved"
            - "GET /cosmetics/listings?facility_id=${fac_id} is empty and GET /cosmetics/distribution-records?listing_id=${fac_id} is empty"

  - section: consistency_model
    instances:
      - name: the_late_report_response_already_carries_the_points_and_posture_it_caused
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - calculations.facility_serious_event_points
          - entities.ComplianceLedgerEntry
        distinguishing_aspect: |
          Under the immediate model no re-read is needed: the report response itself must already show
          report_status REPORTED_LATE, lateness_days 3 and event_points 6.50, and the very next reads —
          with no sweep and no delay in between — must show the facility at 6.50 points with its
          POINTS_CHANGE ledger entry already written. A denormalized field that lags by one request is a
          failure.
        test_recipe:
          setup:
            - "one REGISTERED facility, one consumer listing, one SERIOUS event received 2026-08-05 (deadline 2026-08-20T23:59:59.999Z), clock then moved to 2026-08-23T10:00:00Z"
          setup_api_calls:
            - call: "POST /cosmetics/facilities"
              payload: { facility_name: "Aster Labs Newark", owner_operator_name: "Aster Holdings LLC", facility_type: "MANUFACTURER", country_code: "US", state_or_province: "NJ" }
              as: FacilityRegistrant
              captures: { fac_id: $.data.id }
            - call: "POST /cosmetics/facilities/${fac_id}/submit-registration"
              payload: {}
              as: FacilityRegistrant
              as_user_id: "${fac_id}"
            - call: "POST /cosmetics/facilities/${fac_id}/registration-decision"
              payload: { decision: "APPROVE" }
              as: RegulatoryReviewer
              as_user_id: "RVW-1"
            - call: "POST /cosmetics/responsible-persons"
              payload: { legal_name: "Aster Brands Inc", us_address_line: "12 Market St, Newark NJ 07102", contact_phone: "+1-202-555-0110", contact_email: "safety@aster.example" }
              as: ResponsiblePersonAgent
              captures: { rp_id: $.data.id }
            - call: "POST /cosmetics/listings"
              payload: { facility_id: "${fac_id}", responsible_person_id: "${rp_id}", product_name: "Aster Blush Powder", category_code: "07A", product_form: "LEAVE_ON", label_contact_type: "ELECTRONIC_CONTACT", label_contact_value: "safety@aster.example" }
              as: ResponsiblePersonAgent
              as_user_id: "${rp_id}"
              captures: { lst_id: $.data.id }
            - call: "POST /cosmetics/_clock/set_current_utc"
              payload: { current_utc: "2026-08-05T08:00:00Z" }
              as: SystemOperator
              as_user_id: "OPS-1"
            - call: "POST /cosmetics/listings/${lst_id}/adverse-events"
              payload: { event_description: "Chemical burn requiring urgent care", received_at: "2026-08-05T00:00:00Z", seriousness: "SERIOUS", outcome_code: "HOSPITALIZATION" }
              as: ResponsiblePersonAgent
              as_user_id: "${rp_id}"
              captures: { ae_id: $.data.id, deadline: $.data.deadline_at }
            - call: "POST /cosmetics/_clock/set_current_utc"
              payload: { current_utc: "2026-08-23T10:00:00Z" }
              as: SystemOperator
              as_user_id: "OPS-1"
          trigger:
            - call: "POST /cosmetics/adverse-events/${ae_id}/report"
              payload: { report_narrative: "Filed after an internal review delay" }
              as: ResponsiblePersonAgent
              as_user_id: "${rp_id}"
              captures: { r_status: $.data.report_status, r_days: $.data.lateness_days, r_points: $.data.event_points, r_submitted: $.data.submitted_at }
            - call: "GET /cosmetics/facilities/${fac_id}"
              payload: {}
              as: RegulatoryReviewer
              as_user_id: "RVW-1"
              captures: { f_points: $.data.serious_event_points, f_posture: $.data.compliance_posture, f_open: $.data.open_serious_event_count }
            - call: "GET /cosmetics/facilities/${fac_id}/ledger-entries?entry_type=POINTS_CHANGE"
              payload: {}
              as: RegulatoryReviewer
              as_user_id: "RVW-1"
              captures: { l_type: "$.data[0].entry_type", l_subject: "$.data[0].subject_entity" }
          assert:
            - "${deadline} == \"2026-08-20T23:59:59.999Z\""
            - "${r_status} == \"REPORTED_LATE\", ${r_days} == 3 (ceil of 2 days 10:00:00.001) and ${r_points} == 6.50 (round(5 x 1.3 x 1.0, 2))"
            - "${r_submitted} == \"2026-08-23T10:00:00Z\" — the logical clock, returned in the same response"
            - "${f_points} == 6.50 in the very next read, with no sweep in between"
            - "${f_posture} == \"OPEN\" (6.50 < 10.00) and ${f_open} == 0 — the report closed the open-event counter immediately"
            - "${l_type} == \"POINTS_CHANGE\" and ${l_subject} == \"AdverseEvent\" — the ledger row is already visible"
            - "ProductListing ${lst_id}.marketable is still false in the same window — the report changed the facility, not the listing gate"
