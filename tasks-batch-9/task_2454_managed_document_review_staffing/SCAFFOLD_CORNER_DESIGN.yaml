            - "Reviewer A coded all 600 documents in 650 minutes and logged 2 privilege entries before submitting"
            - "the 60-document QC sample came back clean, so the batch is QC_PASSED"
            - "QCLead accepted both privilege entries, meeting the quota of max(2, ceil(2 * 0.20)) == 2"
