            - "GET /allocations filtered to CONFIRMED on 2026-06-08 returns 0 rows (invariant: occupancy unchanged from the pre-confirm baseline)"
      - name: invoice_reconcile_dispute_rereconcile_value_conserved
        grounds:
          - state_machines.Invoice.RECEIVED_to_RECONCILED
          - state_machines.Invoice.RECONCILED_to_DISPUTED
          - state_machines.Invoice.DISPUTED_to_RECONCILED
          - calculations.invoice_reconciliation
        distinguishing_aspect: |
          Conserved quantity = Invoice.reconciled_amount_cents. The forward action (reconcile)
          paired with its compensating loop (dispute then re-reconcile with NO intervening
          allocation mutations) MUST reproduce the identical reconciled_amount_cents and
          reconciled_room_nights — a dispute cycle alone cannot drift the money fields.
        test_recipe:
          setup:
            - "Station SNA (min_rest 8, transport 20), union FLIGHT_ATTENDANT min_rest 8"
            - "ACTIVE contract K13 at SNA (rate 10000, block 5)"
            - "two layovers Z1/Z2 (crew 4 each) booked for stays 2026-06-02/03, both confirmed and checked in"
            - "invoice INV4 billed 8 nights / 80000 cents, reconciled (amount 80000, variance 0.0)"
