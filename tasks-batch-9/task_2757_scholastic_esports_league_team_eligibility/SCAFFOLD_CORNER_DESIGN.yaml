      - name: computed_reads_expose_every_derived_field_without_recomputing_or_mutating
        claim_type: computed_read
        grounds:
          - endpoints[GET /matches]
          - endpoints[GET /matches/{matchId}]
          - endpoints[GET /teams]
          - endpoints[GET /seasons/{seasonId}]
          - calculations[seed_points]
          - calculations[tiebreak_seed_order]
          - calculations[match_point_award]
        distinguishing_aspect: |
          Reads must serve the values that were PINNED by the last write, and must not
          recompute, refresh or mutate anything: the same GET repeated twice returns
          byte-identical field values and leaves every version untouched. This is the only
          instance that reads the four derived Match fields (scheduled_end_at,
          dispute_deadline_at, winner_team_id, the awarded-points pair) together with the
          seeding trio on Team (seed_points, seed_position, seed_stale) and the season
          roll-ups they must agree with.
        test_recipe:
          setup:
            - "One district, one school, one CERTIFIED coach, an APPROVED title approval, a title on POOL-A with server_pool_capacity 2 and match_duration_minutes 60, and one season"
            - "Two teams with one ACTIVE STARTER slot each register, roster-lock and are promoted to COMPETING"
            - "Two matches are created; the first is forfeited by the away team; the season is then seeded on the default MATCH_POINT_BASIS"
            - "The logical clock is never moved, so every timestamp is derived from 2026-08-01T00:00:00.000Z"
          setup_api_calls:
            - call: "POST /districts"
              payload: { name: "Metro District", state_code: "CA" }
              as: LeagueAdmin
              captures: { d_id: $.data.id }
