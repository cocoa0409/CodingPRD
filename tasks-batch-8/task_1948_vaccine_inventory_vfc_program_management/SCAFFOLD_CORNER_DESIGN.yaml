# =============================================================================
# §1.9 Scaffold Corner Design — Coverage Index for Non-Difficulty Tests
# Task 1948: Vaccine Inventory & VFC Program Management
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  # Section: entities — creation, defaults, computed, system, FK
  # ===========================================================================
  - section: entities
    instances:
      - name: provider_site_creation_defaults_status_active
        claim_type: defaults
        grounds:
          - entities.ProviderSite
        distinguishing_aspect: "Omitting status on POST /provider-sites yields status=ACTIVE, excursion_count_open=0, accountability_balance_doses=0, private_lending_balance=0, version=1."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls:
            - call: "POST /provider-sites"
              payload: { site_name: "New Site", vfc_pin: "PIN-E-001" }
              as: ComplianceAuditor
              captures: { sid: $.data.id, st: $.data.status, ec: $.data.excursion_count_open, ab: $.data.accountability_balance_doses, plb: $.data.private_lending_balance, v: $.data.version }
          trigger: []
          assert:
            - "${st} == ACTIVE"
            - "${ec} == 0"
            - "${ab} == 0"
            - "${plb} == 0"
            - "${v} == 1"

      - name: provider_site_creation_missing_vfc_pin_returns_invalid_request
        claim_type: required_fields
        grounds:
          - entities.ProviderSite
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "POST /provider-sites without vfc_pin -> ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /provider-sites"
              payload: { site_name: "No PIN" }
              as: ComplianceAuditor
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_INVALID_REQUEST"

      - name: temperature_reading_immutable_no_version_field
        claim_type: immutability
        grounds:
          - entities.TemperatureReading
        distinguishing_aspect: "TemperatureReading has common_fields: false; no update endpoint exists; response has no version field."
        test_recipe:
          setup: ["Site + unit exist"]
          setup_api_calls:
            - call: "POST /provider-sites"
              payload: { site_name: "S", vfc_pin: "PIN-E-002" }
              as: ComplianceAuditor
              captures: { sid: $.data.id }
            - call: "POST /provider-sites/${sid}/storage-units"
              payload: { unit_label: "U", unit_kind: "REFRIGERATOR", min_temp_c: 2.0, max_temp_c: 8.0 }
              as: VaccineManager
              captures: { uid: $.data.id }
          trigger:
            - call: "POST /storage-units/${uid}/temperature-readings"
              payload: { recorded_at: "2026-08-01T08:00:00Z", temperature_c: 5.0 }
              as: VaccineManager
              captures: { rid: $.data.id }
          assert:
            - "Reading created; response contains id and created_at but no version/updated_at field (common_fields: false)"

      - name: storage_unit_fk_reverse_reachable_via_site
        claim_type: parent_relationships
        grounds:
          - entities.StorageUnit
        distinguishing_aspect: "GET /provider-sites/{id}/storage-units returns all units belonging to that site; FK reverse-reachability."
        test_recipe:
          setup: ["Site S; two units registered"]
          setup_api_calls:
            - call: "POST /provider-sites"
              payload: { site_name: "S", vfc_pin: "PIN-E-003" }
              as: ComplianceAuditor
              captures: { sid: $.data.id }
            - call: "POST /provider-sites/${sid}/storage-units"
              payload: { unit_label: "U1", unit_kind: "REFRIGERATOR", min_temp_c: 2.0, max_temp_c: 8.0 }
              as: VaccineManager
            - call: "POST /provider-sites/${sid}/storage-units"
              payload: { unit_label: "U2", unit_kind: "FREEZER", min_temp_c: -50.0, max_temp_c: -15.0 }
              as: VaccineManager
          trigger:
            - call: "GET /provider-sites/${sid}/storage-units"
              payload: {}
              as: VaccineManager
          assert:
            - "Response is StorageUnit[] with total_count == 2"

      - name: lot_creation_rejects_public_vfc_stock_type_manual_registration
        claim_type: creation
        grounds:
          - entities.Lot
          - endpoints
        distinguishing_aspect: "POST /provider-sites/{id}/lots with stock_type=PUBLIC_VFC is rejected; PUBLIC_VFC lots are created only via AllocationReceipt (segregation of stock-creation channel)."
        test_recipe:
          setup: ["Site S; unit U; product P"]
          setup_api_calls:
            - call: "POST /provider-sites"
              payload: { site_name: "S", vfc_pin: "PIN-E-004" }
              as: ComplianceAuditor
              captures: { sid: $.data.id }
            - call: "POST /provider-sites/${sid}/storage-units"
              payload: { unit_label: "U", unit_kind: "REFRIGERATOR", min_temp_c: 2.0, max_temp_c: 8.0 }
              as: VaccineManager
              captures: { uid: $.data.id }
            - call: "POST /vaccine-products"
              payload: { ndc_code: "00006-4681-00", display_name: "MMR II", presentation: "SINGLE_DOSE_VIAL", doses_per_container: 1, vfc_program_eligible: true, storage_requirement: "REFRIGERATED_2_8C" }
              as: ComplianceAuditor
              captures: { pid: $.data.id }
          trigger:
            - call: "POST /provider-sites/${sid}/lots"
              payload: { storage_unit_id: "${uid}", vaccine_product_id: "${pid}", lot_number: "L-PUB", stock_type: "PUBLIC_VFC", quantity_on_hand: 5, expires_on: "2027-06-30" }
              as: VaccineManager
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_INVALID_REQUEST"

      - name: patient_fk_reverse_reachable_via_screenings_list
        claim_type: parent_relationships
        grounds:
          - entities.EligibilityScreening
        distinguishing_aspect: "GET /patients/{id}/eligibility-screenings returns screenings of one patient; FK reverse-reachability for EligibilityScreening.patient_id."
        test_recipe:
          setup: ["Site S; patient pat; one screening"]
          setup_api_calls:
            - call: "POST /provider-sites"
              payload: { site_name: "S", vfc_pin: "PIN-E-005" }
              as: ComplianceAuditor
              captures: { sid: $.data.id }
            - call: "POST /provider-sites/${sid}/patients"
              payload: { full_name: "Pat", date_of_birth: "2020-01-15", insurance_category: "MEDICAID" }
              as: VaccineManager
              captures: { pat: $.data.id }
            - call: "POST /patients/${pat}/eligibility-screenings"
              payload: { screening_date: "2026-08-05", insurance_category_at_visit: "MEDICAID" }
              as: VaccineManager
          trigger:
            - call: "GET /patients/${pat}/eligibility-screenings"
              payload: {}
              as: VaccineManager
          assert:
            - "Response is EligibilityScreening[] with total_count == 1"

  # ===========================================================================
  # Section: state_machines — invalid-from, terminal lockdown, side-effects
  # ===========================================================================
  - section: state_machines
    instances:
      - name: vaccine_order_submit_from_submitted_returns_invalid_state
        claim_type: invalid_transition
        grounds:
          - state_machines.VaccineOrder
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "Submitting an order already in SUBMITTED state returns ERR_INVALID_STATE; no transitions exist from SUBMITTED to SUBMITTED."
        test_recipe:
          setup: ["Site S; unit U; product P; order O with one line, submitted"]
          setup_api_calls:
            - call: "POST /provider-sites"
              payload: { site_name: "S", vfc_pin: "PIN-SM-001" }
              as: ComplianceAuditor
              captures: { sid: $.data.id }
            - call: "POST /provider-sites/${sid}/storage-units"
              payload: { unit_label: "U", unit_kind: "REFRIGERATOR", min_temp_c: 2.0, max_temp_c: 8.0 }
              as: VaccineManager
              captures: { uid: $.data.id }
            - call: "POST /vaccine-products"
              payload: { ndc_code: "00006-4681-00", display_name: "MMR II", presentation: "SINGLE_DOSE_VIAL", doses_per_container: 1, vfc_program_eligible: true, storage_requirement: "REFRIGERATED_2_8C" }
              as: ComplianceAuditor
              captures: { pid: $.data.id }
            - call: "POST /provider-sites/${sid}/vaccine-orders"
              payload: { expected_vfc_doses: 5 }
              as: VaccineManager
              captures: { oid: $.data.id }
            - call: "POST /provider-sites/${sid}/vaccine-orders/${oid}/lines"
              payload: { vaccine_product_id: "${pid}", requested_doses: 5 }
              as: VaccineManager
            - call: "POST /provider-sites/${sid}/vaccine-orders/${oid}/submit"
              payload: {}
              as: VaccineManager
          trigger:
            - call: "POST /provider-sites/${sid}/vaccine-orders/${oid}/submit"
              payload: {}
              as: VaccineManager
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_INVALID_STATE"

      - name: provider_site_terminal_terminated_lockdown
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.ProviderSite
        distinguishing_aspect: "Once TERMINATED, suspend-ordering, reinstate-ordering, terminate all return ERR_INVALID_STATE; no further transitions possible."
        test_recipe:
          setup: ["Site S terminated (no open excursions, no open tickets, no open audits)"]
          setup_api_calls:
            - call: "POST /provider-sites"
              payload: { site_name: "S", vfc_pin: "PIN-SM-002" }
              as: ComplianceAuditor
              captures: { sid: $.data.id }
            - call: "POST /provider-sites/${sid}/terminate"
              payload: {}
              as: ComplianceAuditor
          trigger:
            - call: "POST /provider-sites/${sid}/suspend-ordering"
              payload: {}
              as: ComplianceAuditor
              captures: { err1: $.data.error_id }
            - call: "POST /provider-sites/${sid}/reinstate-ordering"
              payload: {}
              as: ComplianceAuditor
              captures: { err2: $.data.error_id }
            - call: "POST /provider-sites/${sid}/terminate"
              payload: {}
              as: ComplianceAuditor
              captures: { err3: $.data.error_id }
          assert:
            - "${err1} == ERR_INVALID_STATE"
            - "${err2} == ERR_INVALID_STATE"
            - "${err3} == ERR_INVALID_STATE"

      - name: temperature_excursion_begin_review_blocked_while_still_open
        claim_type: precondition_enforcement
        grounds:
          - state_machines.TemperatureExcursion
          - errors[ERR_EXCURSION_STILL_OPEN]
        distinguishing_aspect: "begin-review requires an in-range reading to have closed the excursion (closed_at non-null). Calling begin-review while excursion is still OPEN (no in-range reading yet) returns ERR_EXCURSION_STILL_OPEN."
        test_recipe:
          setup: ["Site S; unit U; lot L; excursion opened by one out-of-range reading (no in-range reading yet)"]
          setup_api_calls:
            - call: "POST /provider-sites"
              payload: { site_name: "S", vfc_pin: "PIN-SM-003" }
              as: ComplianceAuditor
              captures: { sid: $.data.id }
            - call: "POST /provider-sites/${sid}/storage-units"
              payload: { unit_label: "U", unit_kind: "REFRIGERATOR", min_temp_c: 2.0, max_temp_c: 8.0 }
              as: VaccineManager
              captures: { uid: $.data.id }
            - call: "POST /vaccine-products"
              payload: { ndc_code: "00006-4681-00", display_name: "MMR II", presentation: "SINGLE_DOSE_VIAL", doses_per_container: 1, vfc_program_eligible: true, storage_requirement: "REFRIGERATED_2_8C" }
              as: ComplianceAuditor
              captures: { pid: $.data.id }
            - call: "POST /provider-sites/${sid}/lots"
              payload: { storage_unit_id: "${uid}", vaccine_product_id: "${pid}", lot_number: "L1", stock_type: "PRIVATE", quantity_on_hand: 5, expires_on: "2027-06-30" }
              as: VaccineManager
            - call: "POST /storage-units/${uid}/temperature-readings"
              payload: { recorded_at: "2026-08-01T10:00:00Z", temperature_c: 12.0 }
              as: VaccineManager
            - call: "GET /storage-units/${uid}/excursions"
              payload: {}
              as: VaccineManager
              captures:
                exc: "$.data[0].id"
          trigger:
            - call: "POST /storage-units/${uid}/excursions/${exc}/begin-review"
              payload: {}
              as: VaccineManager
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_EXCURSION_STILL_OPEN"

      - name: audit_close_pass_blocked_by_accountability_gap
        claim_type: precondition_enforcement
        grounds:
          - state_machines.SiteVisitAudit
          - errors[ERR_ACCOUNTABILITY_GAP_UNRESOLVED]
          - validations[priority=19]
        distinguishing_aspect: "close-pass requires accountability_gap == on_hand_public_total. After administering 1 of 5 received doses with no wastage/transfer, gap=4 but on_hand=4 too — so create an unresolved case by making the on-hand differ (e.g., open borrow makes dose disappear from public stock without a corresponding receipt)."
        test_recipe:
          setup:
            - "Site S; unit U; product P; lot L_pub 5 doses"
            - "Patient pat, screening scr on 2026-08-05"
            - "1 dose administered from L_pub"
            - "SiteVisitAudit moved to FINDINGS_ISSUED"
            - "Artificially induce mismatch by recording a short-date transfer (SHIP) of 1 dose — this makes transferred_out=1, on_hand=3, gap=5-1-0-1=3 vs on_hand=3, matches; to force mismatch we instead leave an excursion OPEN on the unit (priority 20 fires first as ERR_OPEN_EXCURSION_EXISTS)"
          setup_api_calls:
            - call: "POST /provider-sites"
              payload: { site_name: "S", vfc_pin: "PIN-SM-004" }
              as: ComplianceAuditor
              captures: { sid: $.data.id }
            - call: "POST /provider-sites/${sid}/storage-units"
              payload: { unit_label: "U", unit_kind: "REFRIGERATOR", min_temp_c: 2.0, max_temp_c: 8.0 }
              as: VaccineManager
              captures: { uid: $.data.id }
            - call: "POST /vaccine-products"
              payload: { ndc_code: "00006-4681-00", display_name: "MMR II", presentation: "SINGLE_DOSE_VIAL", doses_per_container: 1, vfc_program_eligible: true, storage_requirement: "REFRIGERATED_2_8C" }
              as: ComplianceAuditor
              captures: { pid: $.data.id }
            - call: "POST /provider-sites/${sid}/vaccine-orders"
              payload: { expected_vfc_doses: 5 }
              as: VaccineManager
              captures: { oid: $.data.id }
            - call: "POST /provider-sites/${sid}/vaccine-orders/${oid}/lines"
              payload: { vaccine_product_id: "${pid}", requested_doses: 5 }
              as: VaccineManager
              captures: { olid: $.data.id }
            - call: "POST /provider-sites/${sid}/vaccine-orders/${oid}/submit"
              payload: {}
              as: VaccineManager
            - call: "GET /provider-sites/${sid}"
              payload: {}
              as: VaccineManager
              captures: { sv: $.data.version }
            - call: "POST /provider-sites/${sid}/vaccine-orders/${oid}/approve"
              payload: { approved_vfc_doses: 5, expected_provider_site_version: "${sv}" }
              as: StateProgramOfficer
            - call: "POST /provider-sites/${sid}/vaccine-orders/${oid}/allocation-receipts"
              payload: { order_line_id: "${olid}", storage_unit_id: "${uid}", lot_number: "L1", expires_on: "2027-06-30", quantity_doses: 5 }
              as: VaccineManager
            - call: "POST /provider-sites/${sid}/site-visit-audits"
              payload: { visit_date: "2026-08-10" }
              as: ComplianceAuditor
              captures: { aid: $.data.id }
            - call: "POST /provider-sites/${sid}/site-visit-audits/${aid}/begin"
              payload: {}
              as: ComplianceAuditor
            - call: "POST /storage-units/${uid}/temperature-readings"
              payload: { recorded_at: "2026-08-09T08:00:00Z", temperature_c: 12.0 }
              as: VaccineManager
            - call: "POST /provider-sites/${sid}/site-visit-audits/${aid}/issue-findings"
              payload: {}
              as: ComplianceAuditor
          trigger:
            - call: "POST /provider-sites/${sid}/site-visit-audits/${aid}/close-pass"
              payload: {}
              as: ComplianceAuditor
              captures: { err: $.data.error_id }
          assert:
            - "open excursion blocks close-pass with ERR_OPEN_EXCURSION_EXISTS (priority 20)"
            - "${err} == ERR_OPEN_EXCURSION_EXISTS"

      - name: dose_administration_terminal_submitted_lockdown
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.DoseAdministration
        distinguishing_aspect: "Once SUBMITTED, further submit-registry / mark-registry-rejected / reset-registry return ERR_INVALID_STATE."
        test_recipe:
          setup: ["Site S; unit U; product P; lot L 3 doses; patient pat; screening scr; dose D created and submitted"]
          setup_api_calls:
            - call: "POST /provider-sites"
              payload: { site_name: "S", vfc_pin: "PIN-SM-005" }
              as: ComplianceAuditor
              captures: { sid: $.data.id }
            - call: "POST /provider-sites/${sid}/storage-units"
              payload: { unit_label: "U", unit_kind: "REFRIGERATOR", min_temp_c: 2.0, max_temp_c: 8.0 }
              as: VaccineManager
              captures: { uid: $.data.id }
            - call: "POST /vaccine-products"
              payload: { ndc_code: "00006-4681-00", display_name: "MMR II", presentation: "SINGLE_DOSE_VIAL", doses_per_container: 1, vfc_program_eligible: true, storage_requirement: "REFRIGERATED_2_8C" }
              as: ComplianceAuditor
              captures: { pid: $.data.id }
            - call: "POST /provider-sites/${sid}/vaccine-orders"
              payload: { expected_vfc_doses: 3 }
              as: VaccineManager
              captures: { oid: $.data.id }
            - call: "POST /provider-sites/${sid}/vaccine-orders/${oid}/lines"
              payload: { vaccine_product_id: "${pid}", requested_doses: 3 }
              as: VaccineManager
              captures: { olid: $.data.id }
            - call: "POST /provider-sites/${sid}/vaccine-orders/${oid}/submit"
              payload: {}
              as: VaccineManager
            - call: "GET /provider-sites/${sid}"
              payload: {}
              as: VaccineManager
              captures: { sv: $.data.version }
            - call: "POST /provider-sites/${sid}/vaccine-orders/${oid}/approve"
              payload: { approved_vfc_doses: 3, expected_provider_site_version: "${sv}" }
              as: StateProgramOfficer
            - call: "POST /provider-sites/${sid}/vaccine-orders/${oid}/allocation-receipts"
              payload: { order_line_id: "${olid}", storage_unit_id: "${uid}", lot_number: "L1", expires_on: "2027-06-30", quantity_doses: 3 }
              as: VaccineManager
              captures: { lot: $.data.lot_id }
            - call: "POST /provider-sites/${sid}/patients"
              payload: { full_name: "P", date_of_birth: "2020-01-15", insurance_category: "MEDICAID" }
              as: VaccineManager
              captures: { pat: $.data.id }
            - call: "POST /patients/${pat}/eligibility-screenings"
              payload: { screening_date: "2026-08-05", insurance_category_at_visit: "MEDICAID" }
              as: VaccineManager
              captures: { scr: $.data.id }
            - call: "POST /provider-sites/${sid}/dose-administrations"
              payload: { patient_id: "${pat}", eligibility_screening_id: "${scr}", lot_id: "${lot}", administration_date: "2026-08-05" }
              as: VaccineManager
              captures: { dose: $.data.id }
            - call: "POST /provider-sites/${sid}/dose-administrations/${dose}/submit-registry"
              payload: {}
              as: VaccineManager
          trigger:
            - call: "POST /provider-sites/${sid}/dose-administrations/${dose}/submit-registry"
              payload: {}
              as: VaccineManager
              captures: { err1: $.data.error_id }
            - call: "POST /provider-sites/${sid}/dose-administrations/${dose}/mark-registry-rejected"
              payload: {}
              as: VaccineManager
              captures: { err2: $.data.error_id }
            - call: "POST /provider-sites/${sid}/dose-administrations/${dose}/reset-registry"
              payload: {}
              as: VaccineManager
              captures: { err3: $.data.error_id }
          assert:
            - "${err1} == ERR_INVALID_STATE"
            - "${err2} == ERR_INVALID_STATE"
            - "${err3} == ERR_INVALID_STATE"

      - name: excursion_resolve_viable_returns_lots_to_available
        claim_type: side_effect_execution
        grounds:
          - state_machines.TemperatureExcursion
          - state_machines.Lot
        distinguishing_aspect: "Resolving an excursion RESOLVED_VIABLE returns every QUARANTINED lot in the unit to AVAILABLE and clears the unit quarantine flag."
        test_recipe:
          setup: ["Site S; unit U; lots L1, L2; excursion opened then closed by in-range reading"]
          setup_api_calls:
            - call: "POST /provider-sites"
              payload: { site_name: "S", vfc_pin: "PIN-SM-006" }
              as: ComplianceAuditor
              captures: { sid: $.data.id }
            - call: "POST /provider-sites/${sid}/storage-units"
              payload: { unit_label: "U", unit_kind: "REFRIGERATOR", min_temp_c: 2.0, max_temp_c: 8.0 }
              as: VaccineManager
              captures: { uid: $.data.id }
            - call: "POST /vaccine-products"
              payload: { ndc_code: "00006-4681-00", display_name: "MMR II", presentation: "SINGLE_DOSE_VIAL", doses_per_container: 1, vfc_program_eligible: true, storage_requirement: "REFRIGERATED_2_8C" }
              as: ComplianceAuditor
              captures: { pid: $.data.id }
            - call: "POST /provider-sites/${sid}/lots"
              payload: { storage_unit_id: "${uid}", vaccine_product_id: "${pid}", lot_number: "L1", stock_type: "PRIVATE", quantity_on_hand: 5, expires_on: "2027-06-30" }
              as: VaccineManager
              captures: { l1: $.data.id }
            - call: "POST /provider-sites/${sid}/lots"
              payload: { storage_unit_id: "${uid}", vaccine_product_id: "${pid}", lot_number: "L2", stock_type: "PRIVATE", quantity_on_hand: 3, expires_on: "2027-06-30" }
              as: VaccineManager
              captures: { l2: $.data.id }
            - call: "POST /storage-units/${uid}/temperature-readings"
              payload: { recorded_at: "2026-08-01T10:00:00Z", temperature_c: 12.0 }
              as: VaccineManager
            - call: "POST /storage-units/${uid}/temperature-readings"
              payload: { recorded_at: "2026-08-01T11:00:00Z", temperature_c: 5.0 }
              as: VaccineManager
            - call: "GET /storage-units/${uid}/excursions"
              payload: {}
              as: VaccineManager
              captures:
                exc: "$.data[0].id"
            - call: "POST /storage-units/${uid}/excursions/${exc}/begin-review"
              payload: {}
              as: VaccineManager
          trigger:
            - call: "POST /storage-units/${uid}/excursions/${exc}/resolve-viable"
              payload: { resolution_notes: "OK per mfg guidance" }
              as: VaccineManager
            - call: "GET /lots/${l1}"
              payload: {}
              as: VaccineManager
              captures: { l1_st: $.data.status, l1_qty: $.data.quantity_on_hand }
            - call: "GET /lots/${l2}"
              payload: {}
              as: VaccineManager
              captures: { l2_st: $.data.status, l2_qty: $.data.quantity_on_hand }
            - call: "GET /storage-units/${uid}"
              payload: {}
              as: VaccineManager
              captures: { u_q: $.data.is_quarantined }
          assert:
            - "${l1_st} == AVAILABLE"
            - "${l2_st} == AVAILABLE"
            - "${l1_qty} == 5"
            - "${l2_qty} == 3"
            - "${u_q} == false"

      - name: borrow_ticket_void_blocked_after_partial_payback
        claim_type: invalid_transition
        grounds:
          - state_machines.BorrowTicket
          - errors[ERR_TICKET_HAS_PAYBACK]
        distinguishing_aspect: "Void requires paid_back_quantity == 0; after a partial payback the ticket is PARTIALLY_REPAID and void returns ERR_TICKET_HAS_PAYBACK (or ERR_INVALID_STATE)."
        test_recipe:
          setup: ["Site S; units U; product P; L_pub 10 PUBLIC; L_priv 8 PRIVATE; BT for 4 doses; one partial payback of 1"]
          setup_api_calls:
            - call: "POST /provider-sites"
              payload: { site_name: "S", vfc_pin: "PIN-SM-007" }
              as: ComplianceAuditor
              captures: { sid: $.data.id }
            - call: "POST /provider-sites/${sid}/storage-units"
