            - { call: "POST /volunteers", payload: { legal_name: "Cy Nakamura", email: "cy@krcr.example", role_track: "PROGRAMMER", seniority_start_date: "2023-01-01", committee_seat: true }, as: TrainingCoordinator, captures: { m2_id: "$.data.id" } }
            - { call: "POST /volunteers", payload: { legal_name: "Dee Okafor", email: "dee@krcr.example", role_track: "PROGRAMMER", seniority_start_date: "2023-01-01", committee_seat: true }, as: TrainingCoordinator, captures: { m3_id: "$.data.id" } }
            - { call: "POST /program-proposals", payload: { proposer_volunteer_id: "${host_id}", title: "Delta Sessions", format_code: "MUSIC", language_code: "EN", requested_daypart: "EVENING", requested_duration_minutes: 120 }, as: Volunteer, as_user_id: "${host_id}", captures: { proposal_id: "$.data.id" } }
            - { call: "POST /program-proposals/${proposal_id}/submit", as: Volunteer, as_user_id: "${host_id}" }
            - { call: "POST /program-proposals/${proposal_id}/open-review", as: ProgramDirector }
            - { call: "POST /program-proposals/${proposal_id}/votes", payload: { member_volunteer_id: "${m1_id}", format_fit_score: 4, diversity_score: 4, quality_score: 4, recommendation: "APPROVE", rationale: "Approve." }, as: CommitteeMember, as_user_id: "${m1_id}" }
            - { call: "POST /program-proposals/${proposal_id}/votes", payload: { member_volunteer_id: "${m2_id}", format_fit_score: 4, diversity_score: 4, quality_score: 4, recommendation: "APPROVE", rationale: "Approve." }, as: CommitteeMember, as_user_id: "${m2_id}" }
            - { call: "POST /program-proposals/${proposal_id}/votes", payload: { member_volunteer_id: "${m3_id}", format_fit_score: 4, diversity_score: 4, quality_score: 4, recommendation: "APPROVE", rationale: "Approve." }, as: CommitteeMember, as_user_id: "${m3_id}" }
            - { call: "GET /program-proposals/${proposal_id}", as: ProgramDirector, captures: { proposal_version: "$.data.version" } }
            - { call: "POST /program-proposals/${proposal_id}/decide", payload: { expected_proposal_version: "${proposal_version}" }, as: ProgramDirector }
            - { call: "GET /programs?proposal_id=${proposal_id}", as: ProgramDirector, captures: { program_id: "$.data[0].id" } }
            - { call: "POST /schedule-grids", payload: { season_code: "2026-FALL", effective_from: "2026-09-07T00:00:00Z", effective_to: "2026-12-27T23:59:00Z" }, as: ProgramDirector, captures: { grid_id: "$.data.id", grid_v1: "$.data.version" } }
            - { call: "POST /schedule-grids/${grid_id}/slot-assignments", payload: { expected_grid_version: "${grid_v1}", program_id: "${program_id}", day_of_week: 1, start_minute: 1200, duration_minutes: 120 }, as: ProgramDirector, captures: { slot_id: "$.data.id" } }
