  # =========================================================================
  # Rule 6 — Boundary-precision checks on different metrics/endpoints
  # =========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: renewal_cycle_due_exactly_at_seven_days
        grounds:
          - validations[priority=17]
          - state_machines.Subscription.ACTIVE_to_ACTIVE
          - entities.Subscription.fields.current_period_start
        distinguishing_aspect: "Boundary on the renewal-due metric at POST /charge-cycle: renewal is rejected at current_period_start+7d minus 1s (ERR_CYCLE_NOT_DUE) but succeeds at exactly current_period_start+7d (>= boundary, inclusive)."
        test_recipe:
          setup:
            - "Client in CA, intake cleared, subscription charged first cycle at period_start 2026-06-01T00:00:00Z (now ACTIVE)."
            - "Clock at exactly 2026-06-08T00:00:00Z (current_period_start + 7 days)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: BillingAdmin
            - call: "POST /clients"
              payload: { email: "p11@x.com", full_name: "P Eleven", state_code: "CA" }
              as: Client
              captures: { c_id: $.data.id }
            - call: "POST /clients/${c_id}/intake"
              payload: { presenting_concerns: ["ANXIETY"], severity_score: 3 }
              as: Client
              as_user_id: "${c_id}"
            - call: "POST /subscriptions"
              payload: { client_id: "${c_id}" }
              as: Client
              as_user_id: "${c_id}"
              captures: { sub_id: $.data.id }
            - call: "POST /subscriptions/${sub_id}/charge-cycle"
