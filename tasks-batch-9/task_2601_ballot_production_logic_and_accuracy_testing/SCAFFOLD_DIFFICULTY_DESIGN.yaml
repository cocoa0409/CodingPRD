      - name: bp_accountability_net_variance_exactly_at_tolerance
        grounds:
          - calculations.ballot_accountability_reconciliation
          - endpoints["GET /elections/{id}/accountability"]
          - endpoints["POST /elections/{id}/reconcile"]
        distinguishing_aspect: |
          Two readings of the same election straddle the tolerance edge by one ballot with floor()
          applied twice on the way there. First reading: gross 4000, credit floor(4000*25/10000) = 10,
          net 3990, accounted 3911, gross_variance 89, net_variance 79, tolerance
          floor(3990*200/10000) = floor(79.8) = 79 -> abs(79) <= 79 is BALANCED, exactly on the edge.
          After a third lot comes back the reading is gross exactly 5000 (still the SMALL 25 bp
          allowance because that tier key is <=), credit floor(12.5) = 12, net 4988, accounted 4888,
          gross_variance 112, net_variance 100, tolerance floor(99.76) = 99 -> 100 > 99 is
          OUT_OF_BALANCE, exactly one ballot over. Any implementation that rounds either tiered
          quantity instead of flooring (79.8 -> 80, 99.76 -> 100) flips both verdicts.
        test_recipe:
          setup:
            - "An election deployed with one style S-100, one precinct P-001 and one print job of 5000 ballots delivered as three lots: L-001 2000, L-002 2000, L-003 1000, each received in full and issued in full to P-001."
            - "A passing L&A session so the election can reach DEPLOYED, then POST /elections/{id}/close-polls so the election sits in POLLS_CLOSED."
            - "L-001 returned with voted 1900 / spoiled 30 / returned_unused 20 (accounted 1950) and L-002 returned with voted 1880 / spoiled 25 / returned_unused 56 (accounted 1961). L-003 is still ISSUED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { now: "2026-08-01T00:00:00Z" }
              as: ElectionsDirector
            - call: "POST /elections"
