      - name: stability_first_timepoint_moves_the_study_from_approved_to_in_progress
        claim_type: Valid Transition
        grounds:
          - state_machines.StabilityStudy.transitions.APPROVED_to_IN_PROGRESS
          - entities.StabilityStudy.fields.last_conforming_month
          - entities.TestResult.fields.recovery_pct
        distinguishing_aspect: "The APPROVED -> IN_PROGRESS hop is triggered by a TestResult on a third entity, not by an endpoint on the study, and it must both create the result with recovery_pct against baseline_value and advance the study — a one-sided implementation updates the study but leaves recovery_pct null."
        test_recipe:
          setup:
            - "Clock at 2026-09-01T00:00:00Z. One PLANNED ReagentLot SM-LOT-13 of IVD-SM-13 and one REAL_TIME StabilityStudy in chamber CH-S13 with planned_timepoints_months [0, 3, 6], baseline_value 100.0, protocol 2026-09-01 to 2027-03-01, protocol approved by qa-01."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /product-specifications"
              payload: { product_code: "IVD-SM-13", reference_material_code: "REF-SM13", required_material_codes: [], release_test_codes: ["ACTIVITY"], max_reference_bias_pct: 5.0, shelf_life_months_claim: 12, storage_condition: "TWO_TO_EIGHT_C", min_shelf_life_days_at_ship: 90 }
              as: RegulatoryAffairs
              as_user_id: "ra-01"
              captures: { ps_id: $.data.id }
            - call: "POST /reagent-lots"
              payload: { product_specification_id: "${ps_id}", lot_code: "SM-LOT-13", planned_units: 100 }
              as: ProductionOperator
              captures: { rl_id: $.data.id }
            - call: "POST /stability-studies"
              payload: { product_specification_id: "${ps_id}", reagent_lot_id: "${rl_id}", study_type: "REAL_TIME", chamber_code: "CH-S13", storage_temp_c: 5.0, protocol_start: "2026-09-01T00:00:00Z", protocol_end: "2027-03-01T00:00:00Z", planned_timepoints_months: [0, 3, 6], baseline_value: 100.0 }
              as: RegulatoryAffairs
              as_user_id: "ra-01"
              captures: { ss_id: $.data.id, ss_v1: $.data.version }
            - call: "POST /stability-studies/${ss_id}/approve-protocol"
              payload: {}
              as: QAReleaser
              as_user_id: "qa-01"
              captures: { ss_status: $.data.status, ss_by: $.data.protocol_approved_by_user_id, ss_v2: $.data.version }
          trigger:
            - call: "POST /test-results"
              payload: { subject_type: "STABILITY_TIMEPOINT", stability_study_id: "${ss_id}", month_index: 0, test_code: "ACTIVITY", measured_value: 98.0 }
              as: QCAnalyst
              as_user_id: "qc-01"
              captures: { tr_id: $.data.id, rec: $.data.recovery_pct }
            - call: "GET /stability-studies/${ss_id}"
              payload: {}
              as: RegulatoryAffairs
              captures: { status_after: $.data.status, count_after: $.data.timepoint_count, lcm_after: $.data.last_conforming_month, v_after: $.data.version }
            - call: "POST /test-results"
              payload: { subject_type: "STABILITY_TIMEPOINT", stability_study_id: "${ss_id}", month_index: 0, test_code: "ACTIVITY", measured_value: 97.0 }
              as: QCAnalyst
              as_user_id: "qc-01"
              captures: { err_dupe: $.data.error_id }
          assert:
            - "approve-protocol returned HTTP 200 with status APPROVED, protocol_approved_by_user_id qa-01, and version ${ss_v2} one greater than ${ss_v1}"
            - "the timepoint result is created with recovery_pct 98.00 == round(98.0 / 100.0 * 100, 2) and outcome PASS"
            - "the study is now IN_PROGRESS with timepoint_count 1 and last_conforming_month 0, because month 0 is recorded and 98.00 >= 90.00"
            - "the study version incremented again on the timepoint, since the hop declares its own version bump"
            - "repeating month_index 0 with the same test_code returns HTTP 409 ERR_DUPLICATE_TIMEPOINT and leaves timepoint_count at 1"

      - name: design_record_resubmission_supersedes_the_approved_predecessor
        claim_type: Side Effect Execution
        grounds:
          - state_machines.DesignControlRecord.transitions.APPROVED_to_SUPERSEDED
          - entities.ProductSpecification.fields.design_trace_complete
        distinguishing_aspect: "SUPERSEDED is reached only as a system cascade fired by creating a NEW record with the same product_specification_id, record_type AND document_ref; a record differing in any one of the three keys must coexist rather than supersede, and the parent's design_trace_complete must be re-derived after the swap."
        test_recipe:
          setup:
            - "One ProductSpecification IVD-SM-14 with an APPROVED DESIGN_INPUT DHF-IN-SM14 and an APPROVED DESIGN_OUTPUT DHF-OUT-SM14 tracing to it."
          setup_api_calls:
            - call: "POST /product-specifications"
              payload: { product_code: "IVD-SM-14", reference_material_code: "REF-SM14", required_material_codes: [], release_test_codes: ["ACTIVITY"], max_reference_bias_pct: 5.0, shelf_life_months_claim: 12, storage_condition: "TWO_TO_EIGHT_C", min_shelf_life_days_at_ship: 90 }
              as: RegulatoryAffairs
              as_user_id: "ra-01"
              captures: { ps_id: $.data.id, ps_v1: $.data.version }
            - call: "POST /design-control-records"
              payload: { product_specification_id: "${ps_id}", record_type: "DESIGN_INPUT", document_ref: "DHF-IN-SM14", expected_product_specification_version: "${ps_v1}" }
              as: RegulatoryAffairs
              as_user_id: "ra-01"
              captures: { dcr_in_id: $.data.id }
            - call: "POST /design-control-records/${dcr_in_id}/approve"
              payload: {}
              as: QAReleaser
              as_user_id: "qa-01"
            - call: "GET /product-specifications/${ps_id}"
              payload: {}
              as: RegulatoryAffairs
              captures: { ps_v2: $.data.version }
            - call: "POST /design-control-records"
              payload: { product_specification_id: "${ps_id}", record_type: "DESIGN_OUTPUT", document_ref: "DHF-OUT-SM14", traces_to_record_id: "${dcr_in_id}", expected_product_specification_version: "${ps_v2}" }
              as: RegulatoryAffairs
              as_user_id: "ra-01"
              captures: { dcr_out_id: $.data.id }
            - call: "POST /design-control-records/${dcr_out_id}/approve"
              payload: {}
              as: QAReleaser
              as_user_id: "qa-01"
              captures: { out_status: $.data.status }
            - call: "GET /product-specifications/${ps_id}"
              payload: {}
              as: RegulatoryAffairs
              captures: { ps_v3: $.data.version }
          trigger:
            - call: "POST /design-control-records"
              payload: { product_specification_id: "${ps_id}", record_type: "DESIGN_INPUT", document_ref: "DHF-IN-SM14", expected_product_specification_version: "${ps_v3}" }
              as: RegulatoryAffairs
              as_user_id: "ra-01"
              captures: { dcr_in2_id: $.data.id, in2_status: $.data.status, in2_depth: $.data.trace_depth }
            - call: "GET /design-control-records/${dcr_in_id}"
              payload: {}
              as: RegulatoryAffairs
              captures: { old_status: $.data.status, old_approved_at: $.data.approved_at }
            - call: "GET /product-specifications/${ps_id}"
              payload: {}
              as: RegulatoryAffairs
              captures: { trace_after: $.data.design_trace_complete, ps_v4: $.data.version }
            - call: "GET /design-control-records"
              payload: { product_specification_id: "${ps_id}", record_type: "DESIGN_INPUT" }
              as: RegulatoryAffairs
              captures: { first_ref: "$.data[0].document_ref" }
          assert:
            - "the resubmission returns HTTP 201 with status DRAFT and trace_depth 1"
            - "the original DHF-IN-SM14 record has flipped APPROVED -> SUPERSEDED while keeping its approved_by_user_id and approved_at — supersession is not an erasure"
            - "the DESIGN_OUTPUT record is untouched at APPROVED, since only the same-key record is superseded"
            - "the list of DESIGN_INPUT records for the product returns total_count 2 — both the superseded and the new draft remain addressable"
            - "the parent's design_trace_complete is false, because the depth-1 predecessor of the approved DESIGN_OUTPUT is no longer APPROVED, and the parent's version bumped from ${ps_v3} to ${ps_v4}"

      - name: distribution_order_bubbles_up_to_shipped_then_closed_as_its_allocations_finish
        claim_type: Side Effect Execution
        grounds:
