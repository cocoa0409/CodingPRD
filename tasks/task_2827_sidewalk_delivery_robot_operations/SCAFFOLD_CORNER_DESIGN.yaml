      - name: permit_state_is_reported_before_robot_eligibility
        claim_type: priority_ordering
        grounds:
          - "validations[priority=51]"
          - "validations[priority=81]"
          - "errors.ERR_ZONE_NOT_PERMITTED"
          - "errors.ERR_NO_ELIGIBLE_ROBOT"
        excluded_because:
          difficulty_instance: dispatch_into_restricted_zone_reports_permit_not_eligibility
          rationale: "that instance is built on a request that violates both rules at once and asserts the lower-priority error wins, then removes the permit violation to expose the second error."
      - name: clearance_is_reported_before_contiguity
        claim_type: priority_conflict
        grounds:
          - "validations[priority=65]"
          - "validations[priority=70]"
          - "errors.ERR_CLEARANCE_INSUFFICIENT"
          - "errors.ERR_ROUTE_NOT_CONTIGUOUS"
        excluded_because:
          difficulty_instance: route_plan_reports_clearance_before_contiguity
          rationale: "the same double-violation shape on POST /route-plans is already asserted there, including the single-violation control cases."
      - name: segregation_of_duties_is_reported_before_state
        claim_type: priority_ordering
        grounds:
          - "validations[priority=4]"
          - "validations[priority=50]"
          - "errors.ERR_SEGREGATION_OF_DUTIES"
          - "errors.ERR_INVALID_STATE_TRANSITION"
        excluded_because:
          difficulty_instance: incident_self_submit_reports_duties_before_state
          rationale: "that instance pins the authorisation-versus-state ordering on the incident endpoint, which is the only place both can fire on one call."
      - name: plan_validation_reflects_the_current_segment_status
        claim_type: cascading_validation
        grounds:
          - "validations[priority=56]"
          - "errors.ERR_SEGMENT_BLOCKED"
          - "state_machines.SidewalkSegment.APPROVED_to_BLOCKED"
        excluded_because:
          difficulty_instance: plan_validation_gated_by_segment_status
          rationale: "that instance already flips the segment status under a stationary DRAFT plan and asserts both the refusal and the acceptance after the closure is lifted."
  - section: endpoints
    instances:
      - name: success_and_error_envelopes_carry_the_declared_meta_shape
        claim_type: response_envelope
        grounds:
          - "response_envelope.success"
          - "response_envelope.error"
          - "common_fields_contract.fields"
          - "endpoints[POST /service-zones]"
          - "endpoints[GET /service-zones/{zone_id}]"
          - "errors.ERR_ZONE_NOT_FOUND"
        distinguishing_aspect: >-
          Every response of every layer is wrapped identically, and the wrapper is not the payload: a create
          returns response_type object with the four common fields inside data, a list returns response_type
          array with the four pagination fields, and a failure returns response_type error whose data holds
          error_id and message and no entity fields at all - so a handler that returns a bare row or that
          leaks entity fields onto an error is falsified.
        test_recipe:
          setup:
            - "logical clock at 2026-08-03T09:00:00.000Z"
            - "no ServiceZone rows exist yet"
            - "the payload below is a complete, valid zone provisioning body"
            - "the id 11111111-1111-4111-8111-111111111111 belongs to no row of any entity"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T09:00:00.000Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /service-zones"
              payload: { name: "Mission District", municipality_code: "SF", ordinance_min_clearance_cm: 90.0, ordinance_max_speed_cm_s: 160, operating_window_start_utc_hhmm: "0700", operating_window_end_utc_hhmm: "2100", max_concurrent_robots: 2, planning_haul_m: 800.0, planning_crossings: 2, remedy_budget_cents: 50000 }
              as: PlatformAdmin
              captures: { z: $.data.id }
            - call: "GET /service-zones/${z}"
              as: CustomerSupport
            - call: "GET /service-zones"
              as: CustomerSupport
            - call: "GET /service-zones/11111111-1111-4111-8111-111111111111"
              as: CustomerSupport
          assert:
            - "the create returns 201 with response_type == object"
            - "meta.api_request_id and meta.api_request_timestamp are both present on all four responses"
            - "the create response data carries id, created_at, updated_at and version, with version == 1 and created_at == updated_at == 2026-08-03T09:00:00.000Z"
            - "the create response data.permit_state == PROVISIONED and data.remedy_budget_remaining_cents == 50000"
            - "the single read returns 200 with response_type == object and data.version == 1, so a read does not bump the version"
            - "the listing returns 200 with response_type == array, data of length 1, and limit == 10, offset == 0, total_count == 1, has_more == false"
            - "the unknown-id read returns 404 with response_type == error"
            - "that error response data has exactly the keys error_id and message, with error_id == ERR_ZONE_NOT_FOUND and no id, version or permit_state key"
      - name: listing_filters_intersect_conjunctively
        claim_type: filtering
        grounds:
          - "endpoints[GET /sidewalk-segments]"
          - "entities.SidewalkSegment.fields.status"
          - "entities.SidewalkSegment.fields.segment_type"
        distinguishing_aspect: >-
          Several optional filters on one listing are combined with AND rather than OR and neither is
          ignored: of three segments in the zone only the APPROVED CROSSING matches both filters, while each
          filter alone matches two rows and the unfiltered listing matches three - so total_count is the
          size of the filtered set, not of the table.
        test_recipe:
          setup:
            - "logical clock at 2026-08-03T09:00:00.000Z"
            - "ServiceZone Z1 PROVISIONED with ordinance_min_clearance_cm 90.0 and max_crossing_risk 45.0"
            - "segment S1 is a WALKWAY, SURVEYED then APPROVED"
            - "segment S2 is a SIGNALIZED CROSSING, SURVEYED then APPROVED, adjacent to S1"
            - "segment S4 is a MIDBLOCK CROSSING, SURVEYED and deliberately left unapproved because its crossing_risk_score 46.6 exceeds the ceiling"
            - "no other zone exists, so zone_id cannot be the discriminating filter"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T09:00:00.000Z" }
              as: PlatformAdmin
            - call: "POST /service-zones"
              payload: { name: "Mission District", municipality_code: "SF", ordinance_min_clearance_cm: 90.0, ordinance_max_speed_cm_s: 160, operating_window_start_utc_hhmm: "0700", operating_window_end_utc_hhmm: "2100", max_concurrent_robots: 2, planning_haul_m: 800.0, planning_crossings: 2, remedy_budget_cents: 50000 }
              as: PlatformAdmin
