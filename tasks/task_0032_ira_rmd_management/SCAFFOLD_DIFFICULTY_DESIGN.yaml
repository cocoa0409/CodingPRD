scaffold_difficulty_design:

  # =========================================================================
  # Rule 1 — Dual-variant calculations across different entity domains
  # =========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: backdoor_roth_pro_rata_variant_divergence_on_conversion
        grounds:
          - calculations.backdoor_roth_pro_rata
          - state_machines.Conversion.INITIATED_to_COMPLETED
          - entities.Conversion.fields.taxable_amount_cents
          - entities.Conversion.fields.nontaxable_amount_cents
        distinguishing_aspect: |
          Same Conversion inputs (gross 200000, source pretax 0, source aftertax 200000)
          yield Conversion.taxable_amount_cents=0 under variant single_account_pro_rata
          but Conversion.taxable_amount_cents=150000 under variant aggregated_basis_pro_rata
          because a sibling Traditional account contributes 600000 of pretax basis into
          the aggregated pool. Operates on the Conversion entity (different entity domain
          from instance #2 which operates on AccountOwner via RMDSchedule).
        test_recipe:
          setup:
            - "Owner Alice (SINGLE, age 45 in 2026, AGI 12000000) with three TRADITIONAL accounts and one ROTH target"
            - "Sibling TRADITIONAL acct holds pretax 600000 (one CONFIRMED PRETAX contribution); source-A and source-B each hold aftertax 200000"
            - "Clock pinned at 2026-06-01T00:00:00Z"
          setup_api_calls:
            - call: "POST /ira/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlanAdministrator
            - call: "POST /ira/owners"
              payload: { full_name: "Alice", date_of_birth: "1981-03-10", tax_id_last4: "1234", filing_status: "SINGLE", modified_agi_cents: 12000000 }
              as: PlanAdministrator
              captures: { alice_id: $.data.id }
            - call: "POST /ira/accounts"
              payload: { owner_id: "${alice_id}", account_type: "TRADITIONAL" }
              as: PlanAdministrator
              captures: { sibling_id: $.data.id, sibling_v0: $.data.version }
            - call: "POST /ira/accounts"
              payload: { owner_id: "${alice_id}", account_type: "TRADITIONAL" }
              as: PlanAdministrator
              captures: { source_a_id: $.data.id, source_a_v0: $.data.version }
            - call: "POST /ira/accounts"
              payload: { owner_id: "${alice_id}", account_type: "TRADITIONAL" }
              as: PlanAdministrator
              captures: { source_b_id: $.data.id, source_b_v0: $.data.version }
            - call: "POST /ira/accounts"
              payload: { owner_id: "${alice_id}", account_type: "ROTH" }
              as: PlanAdministrator
              captures: { roth_id: $.data.id }
            - call: "POST /ira/contributions"
              payload: { account_id: "${sibling_id}", tax_year: 2026, amount_cents: 600000, contribution_kind: "PRETAX" }
              as: AccountOwner
              as_user_id: "${alice_id}"
              captures: { c_sib_id: $.data.id }
            - call: "POST /ira/contributions/${c_sib_id}/confirm"
              payload: { expected_account_version: "${sibling_v0}" }
              as: AccountOwner
              as_user_id: "${alice_id}"
            - call: "POST /ira/contributions"
              payload: { account_id: "${source_a_id}", tax_year: 2026, amount_cents: 200000, contribution_kind: "AFTERTAX" }
              as: AccountOwner
              as_user_id: "${alice_id}"
              captures: { c_a_id: $.data.id }
            - call: "POST /ira/contributions/${c_a_id}/confirm"
              payload: { expected_account_version: "${source_a_v0}" }
              as: AccountOwner
              as_user_id: "${alice_id}"
            - call: "POST /ira/contributions"
              payload: { account_id: "${source_b_id}", tax_year: 2026, amount_cents: 200000, contribution_kind: "AFTERTAX" }
              as: AccountOwner
              as_user_id: "${alice_id}"
              captures: { c_b_id: $.data.id }
            - call: "POST /ira/contributions/${c_b_id}/confirm"
              payload: { expected_account_version: "${source_b_v0}" }
              as: AccountOwner
              as_user_id: "${alice_id}"
            # Capture refreshed versions of source_a and source_b after their funding
            - call: "GET /ira/accounts/${source_a_id}"
              payload: {}
              as: AccountOwner
              as_user_id: "${alice_id}"
              captures: { source_a_v1: $.data.version }
            - call: "GET /ira/accounts/${source_b_id}"
              payload: {}
              as: AccountOwner
              as_user_id: "${alice_id}"
              captures: { source_b_v1: $.data.version }
            # Initiate Conversion A on source_a (default = single_account variant)
            - call: "POST /ira/conversions"
              payload: { source_account_id: "${source_a_id}", target_account_id: "${roth_id}", gross_amount_cents: 200000 }
              as: AccountOwner
              as_user_id: "${alice_id}"
              captures: { conv_a_id: $.data.id }
            - call: "GET /ira/accounts/${source_a_id}"
              payload: {}
              as: AccountOwner
              as_user_id: "${alice_id}"
              captures: { source_a_v2: $.data.version }
            - call: "POST /ira/conversions/${conv_a_id}/complete"
              payload: { expected_source_account_version: "${source_a_v2}" }
              as: AccountOwner
              as_user_id: "${alice_id}"
              captures: { conv_a_taxable: $.data.taxable_amount_cents, conv_a_nontaxable: $.data.nontaxable_amount_cents }
          trigger:
            - call: "POST /ira/conversions"
              payload: { source_account_id: "${source_b_id}", target_account_id: "${roth_id}", gross_amount_cents: 200000, aggregate_basis: true }
              as: AccountOwner
              as_user_id: "${alice_id}"
              captures: { conv_b_id: $.data.id }
            - call: "GET /ira/accounts/${source_b_id}"
              payload: {}
              as: AccountOwner
              as_user_id: "${alice_id}"
              captures: { source_b_v2: $.data.version }
            - call: "POST /ira/conversions/${conv_b_id}/complete"
              payload: { expected_source_account_version: "${source_b_v2}" }
              as: AccountOwner
              as_user_id: "${alice_id}"
              captures: { conv_b_taxable: $.data.taxable_amount_cents, conv_b_nontaxable: $.data.nontaxable_amount_cents }
          assert:
            - "Conversion.${conv_a_id}.taxable_amount_cents == 0"
            - "Conversion.${conv_a_id}.nontaxable_amount_cents == 200000"
            - "Conversion.${conv_b_id}.taxable_amount_cents == 150000"
            - "Conversion.${conv_b_id}.nontaxable_amount_cents == 50000"
            - "Conversion.${conv_a_id}.taxable_amount_cents != Conversion.${conv_b_id}.taxable_amount_cents"

      - name: rmd_amount_variant_divergence_on_account_owner
        grounds:
          - calculations.rmd_amount
          - entities.RMDSchedule.fields.required_amount_cents
          - entities.AccountOwner.fields.rmd_posture
          - state_machines.IRAAccount.ACTIVE_to_INHERITED
        distinguishing_aspect: |
          Same owner with the same single TRADITIONAL account holding cash 700000 cents
          yields RMDSchedule.required_amount_cents=26315 under variant
          living_owner_uniform_lifetime (Uniform Lifetime divisor 26.60 at age 73), but
          required_amount_cents=70000 (1/10 of inherited balance, year 1 of even-allocation
          schedule) once the owner is declared deceased and the variant switches to
          secure_10year_pace. Operates on AccountOwner / RMDSchedule (different entity
          domain from instance #1 which operates on Conversion).
        test_recipe:
          setup:
            - "Owner Bob (SINGLE, born 1953-01-15 → age 73 throughout 2026) with one TRADITIONAL account funded to cash 700000 cents"
            - "One ACTIVE BeneficiaryDesignation: nephew, NON_ELIGIBLE_INDIVIDUAL, percentage_bps=10000"
            - "Clock pinned at 2026-06-01T00:00:00Z; SystemClock.current_tax_year=2026"
            - "RMDSchedule_alive created BEFORE declare-deceased → variant_living"
            - "Declare-deceased fires cascade; RMDSchedule_inherited created AFTER → variant_secure"
          setup_api_calls:
            - call: "POST /ira/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlanAdministrator
            - call: "POST /ira/owners"
              payload: { full_name: "Bob", date_of_birth: "1953-01-15", tax_id_last4: "5678", filing_status: "SINGLE", modified_agi_cents: 5000000 }
              as: PlanAdministrator
              captures: { bob_id: $.data.id, bob_v0: $.data.version }
            - call: "POST /ira/accounts"
              payload: { owner_id: "${bob_id}", account_type: "TRADITIONAL" }
              as: PlanAdministrator
              captures: { bob_trad_id: $.data.id, bob_trad_v0: $.data.version }
            # Bob is 73, eligible for catch-up — cap = 750000+110000=860000. Seed 700000 PRETAX.
            - call: "POST /ira/contributions"
              payload: { account_id: "${bob_trad_id}", tax_year: 2026, amount_cents: 700000, contribution_kind: "PRETAX" }
              as: AccountOwner
              as_user_id: "${bob_id}"
              captures: { bob_c1_id: $.data.id }
            - call: "POST /ira/contributions/${bob_c1_id}/confirm"
              payload: { expected_account_version: "${bob_trad_v0}" }
              as: AccountOwner
              as_user_id: "${bob_id}"
            - call: "POST /ira/beneficiary-designations"
              payload: { account_id: "${bob_trad_id}", beneficiary_full_name: "Nephew Ned", relationship: "NON_ELIGIBLE_INDIVIDUAL", percentage_bps: 10000 }
              as: AccountOwner
              as_user_id: "${bob_id}"
              captures: { bene_id: $.data.id }
            - call: "POST /ira/beneficiary-designations/${bene_id}/activate"
              payload: {}
              as: AccountOwner
              as_user_id: "${bob_id}"
            # Variant 1: create RMDSchedule BEFORE declare-deceased → living_owner_uniform_lifetime
            - call: "POST /ira/rmd-schedules"
              payload: { owner_id: "${bob_id}", tax_year: 2026 }
              as: PlanAdministrator
              captures: { sched_alive_id: $.data.id, sched_alive_required: $.data.required_amount_cents }
            - call: "GET /ira/owners/${bob_id}"
              payload: {}
              as: PlanAdministrator
              captures: { bob_v1: $.data.version }
            - call: "POST /ira/owners/${bob_id}/declare-deceased"
              payload: { deceased_at: "2026-06-01T12:00:00Z", expected_owner_version: "${bob_v1}" }
              as: PlanAdministrator
          trigger:
            # Variant 2: create RMDSchedule AFTER declare-deceased → secure_10year_pace
            - call: "POST /ira/rmd-schedules"
              payload: { owner_id: "${bob_id}", tax_year: 2026 }
              as: PlanAdministrator
              captures: { sched_dead_id: $.data.id, sched_dead_required: $.data.required_amount_cents }
          assert:
            - "RMDSchedule.${sched_alive_id}.required_amount_cents == 26315"
            - "RMDSchedule.${sched_dead_id}.required_amount_cents == 70000"
            - "RMDSchedule.${sched_alive_id}.required_amount_cents != RMDSchedule.${sched_dead_id}.required_amount_cents"

  # =========================================================================
  # Rule 2 — Combinatorial formulas across different modes
  # =========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: roth_eligibility_three_input_phaseout_with_floor_to_1000
        grounds:
          - calculations.roth_eligibility
          - calculations.contribution_limit
          - validations[priority=11]
          - entities.AccountOwner.fields.modified_agi_cents
          - entities.AccountOwner.fields.filing_status
        distinguishing_aspect: |
          MODE (a): roth_eligibility takes ≥3 inputs (modified_agi_cents, filing_status,
          tax_year, headroom_cents derived from contribution_limit which itself depends
          on age) with non-linear interaction — a conditional branch on AGI vs floor/ceiling,
          then linear phase-out math inside the band, then floor-to-nearest-1000 cents.
          Concretely: SINGLE owner 2026 with AGI=16000000 → headroom 750000 reduced by
          factor (16000000-15400000)/1500000=0.4 → allowed=450000, already a multiple of
          1000, returns 450000. Distinct mode from instance #2 (pro-rata nested rounding).
        test_recipe:
          setup:
            - "Owner Carol (SINGLE, age 45 in 2026, AGI 16000000) with one ROTH account"
            - "Clock pinned at 2026-06-01"
            - "First ROTH contribution amount_cents=450000 confirms (right at the phase-out allowed)"
            - "Second ROTH contribution amount_cents=1 — confirming would push ytd to 450001 > headroom 450000 → ERR_CONTRIBUTION_CAP_EXCEEDED"
          setup_api_calls:
            - call: "POST /ira/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlanAdministrator
            - call: "POST /ira/owners"
              payload: { full_name: "Carol", date_of_birth: "1981-04-04", tax_id_last4: "9999", filing_status: "SINGLE", modified_agi_cents: 16000000 }
              as: PlanAdministrator
              captures: { carol_id: $.data.id }
            - call: "POST /ira/accounts"
              payload: { owner_id: "${carol_id}", account_type: "ROTH" }
              as: PlanAdministrator
              captures: { carol_roth_id: $.data.id, carol_roth_v0: $.data.version }
            - call: "POST /ira/contributions"
              payload: { account_id: "${carol_roth_id}", tax_year: 2026, amount_cents: 450000, contribution_kind: "ROTH" }
              as: AccountOwner
              as_user_id: "${carol_id}"
              captures: { c_pass_id: $.data.id }
            - call: "POST /ira/contributions/${c_pass_id}/confirm"
              payload: { expected_account_version: "${carol_roth_v0}" }
              as: AccountOwner
              as_user_id: "${carol_id}"
            - call: "GET /ira/accounts/${carol_roth_id}"
              payload: {}
              as: AccountOwner
              as_user_id: "${carol_id}"
              captures: { carol_roth_v1: $.data.version }
            - call: "POST /ira/contributions"
              payload: { account_id: "${carol_roth_id}", tax_year: 2026, amount_cents: 1, contribution_kind: "ROTH" }
              as: AccountOwner
              as_user_id: "${carol_id}"
              captures: { c_fail_id: $.data.id }
          trigger:
            - call: "POST /ira/contributions/${c_fail_id}/confirm"
              payload: { expected_account_version: "${carol_roth_v1}" }
              as: AccountOwner
              as_user_id: "${carol_id}"
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP status == 422"
            - "$.data.error_id == ERR_CONTRIBUTION_CAP_EXCEEDED"
            - "IRAAccount.${carol_roth_id}.ytd_contribution_cents == 450000"
            - "Contribution.${c_fail_id}.status == PENDING"

      - name: backdoor_roth_pro_rata_nested_rounding_order_on_conversion
        grounds:
          - calculations.backdoor_roth_pro_rata
          - calculations.form_1099_r
          - entities.Conversion.fields.taxable_amount_cents
          - state_machines.Conversion.INITIATED_to_COMPLETED
        distinguishing_aspect: |
          MODE (b): backdoor_roth_pro_rata pins the rounding order as SUM-THEN-DIVIDE
          (gross * aftertax_basis // total_basis), not divide-then-multiply. Concretely:
          with gross=200000, pretax=500000, aftertax=300000 the prescribed order yields
          nontaxable = 200000*300000 // 800000 = 75000, taxable = 125000. The opposite
          order (compute ratio aft/total then multiply: 300000/800000=0.375 then *200000,
          rounded per-step, yields 75000 in this case but DIVERGES on inputs where the
          ratio is non-terminating). The scaffold explicitly pins the sum-then-divide
          order in §1.3 formula. Different mode from instance #1 (which is mode (a)).
        test_recipe:
          setup:
            - "Owner Dave (SINGLE, age 45 in 2026, AGI 12000000) with one TRADITIONAL (source) and one ROTH (target)"
            - "Source account funded across two tax years to pretax 500000 + aftertax 300000 via ops-run year-rollover between funding rounds"
            - "Clock pinned at 2027-01-15"
          setup_api_calls:
            - call: "POST /ira/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlanAdministrator
            - call: "POST /ira/owners"
              payload: { full_name: "Dave", date_of_birth: "1981-07-22", tax_id_last4: "2222", filing_status: "SINGLE", modified_agi_cents: 12000000 }
              as: PlanAdministrator
              captures: { dave_id: $.data.id }
            - call: "POST /ira/accounts"
              payload: { owner_id: "${dave_id}", account_type: "TRADITIONAL" }
              as: PlanAdministrator
              captures: { dave_trad_id: $.data.id, dave_trad_v0: $.data.version }
            - call: "POST /ira/accounts"
              payload: { owner_id: "${dave_id}", account_type: "ROTH" }
              as: PlanAdministrator
              captures: { dave_roth_id: $.data.id }
            # Year 2026: fund pretax 500000 + aftertax 100000 (under 2026 cap 750000)
            - call: "POST /ira/contributions"
              payload: { account_id: "${dave_trad_id}", tax_year: 2026, amount_cents: 500000, contribution_kind: "PRETAX" }
              as: AccountOwner
              as_user_id: "${dave_id}"
              captures: { c1_id: $.data.id }
            - call: "POST /ira/contributions/${c1_id}/confirm"
              payload: { expected_account_version: "${dave_trad_v0}" }
              as: AccountOwner
              as_user_id: "${dave_id}"
            - call: "GET /ira/accounts/${dave_trad_id}"
              payload: {}
              as: AccountOwner
              as_user_id: "${dave_id}"
              captures: { dave_trad_v1: $.data.version }
            - call: "POST /ira/contributions"
              payload: { account_id: "${dave_trad_id}", tax_year: 2026, amount_cents: 100000, contribution_kind: "AFTERTAX" }
              as: AccountOwner
              as_user_id: "${dave_id}"
              captures: { c2_id: $.data.id }
            - call: "POST /ira/contributions/${c2_id}/confirm"
              payload: { expected_account_version: "${dave_trad_v1}" }
              as: AccountOwner
              as_user_id: "${dave_id}"
            # Roll year-over to 2027 to reset ytd
            - call: "POST /ira/_ops/advance-year-rollover"
              payload: { new_tax_year: 2027 }
              as: PlanAdministrator
            - call: "POST /ira/_clock/set_current_utc"
              payload: { to_iso8601: "2027-01-15T00:00:00Z" }
              as: PlanAdministrator
            # Year 2027: fund aftertax 200000 more (under 2027 cap; same constants apply, 750000)
            - call: "GET /ira/accounts/${dave_trad_id}"
              payload: {}
              as: AccountOwner
              as_user_id: "${dave_id}"
              captures: { dave_trad_v2: $.data.version }
            - call: "POST /ira/contributions"
              payload: { account_id: "${dave_trad_id}", tax_year: 2027, amount_cents: 200000, contribution_kind: "AFTERTAX" }
              as: AccountOwner
              as_user_id: "${dave_id}"
              captures: { c3_id: $.data.id }
            - call: "POST /ira/contributions/${c3_id}/confirm"
              payload: { expected_account_version: "${dave_trad_v2}" }
              as: AccountOwner
              as_user_id: "${dave_id}"
            # Now account has pretax=500000, aftertax=300000 (100000+200000)
            - call: "POST /ira/conversions"
              payload: { source_account_id: "${dave_trad_id}", target_account_id: "${dave_roth_id}", gross_amount_cents: 200000 }
              as: AccountOwner
              as_user_id: "${dave_id}"
              captures: { dave_conv_id: $.data.id }
            - call: "GET /ira/accounts/${dave_trad_id}"
              payload: {}
              as: AccountOwner
              as_user_id: "${dave_id}"
              captures: { dave_trad_v3: $.data.version }
          trigger:
            - call: "POST /ira/conversions/${dave_conv_id}/complete"
              payload: { expected_source_account_version: "${dave_trad_v3}" }
              as: AccountOwner
              as_user_id: "${dave_id}"
              captures: { conv_taxable: $.data.taxable_amount_cents, conv_nontaxable: $.data.nontaxable_amount_cents }
          assert:
            - "Conversion.${dave_conv_id}.taxable_amount_cents == 125000"
            - "Conversion.${dave_conv_id}.nontaxable_amount_cents == 75000"
            - "Conversion.${dave_conv_id}.status == COMPLETED"
            - "IRAAccount.${dave_trad_id}.cash_balance_cents == 600000"

  # =========================================================================
  # Rule 3 — Non-linear state-machine shape on different entities
  # =========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: ira_account_branching_freeze_and_unfreeze_revert_loop
        grounds:
          - state_machines.IRAAccount.ACTIVE_to_FROZEN
          - state_machines.IRAAccount.FROZEN_to_ACTIVE
          - state_machines.IRAAccount.ACTIVE_to_CONVERSION_IN_PROGRESS
          - entities.IRAAccount.fields.status
        distinguishing_aspect: |
          IRAAccount state machine is non-linear: from ACTIVE it BRANCHES to {FROZEN,
          CONVERSION_IN_PROGRESS, INHERITED, CLOSED} with divergent side-effect sets.
          The ACTIVE→FROZEN→ACTIVE loop is a true revert cycle (status reverts; only
          version and updated_at change). Different entity from instance #2 (IRAAccount
          vs RMDSchedule).
        test_recipe:
          setup:
            - "Owner Eve with one ACTIVE TRADITIONAL account; balance 0; no pending children"
            - "Clock at 2026-06-01"
          setup_api_calls:
            - call: "POST /ira/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlanAdministrator
            - call: "POST /ira/owners"
              payload: { full_name: "Eve", date_of_birth: "1981-05-05", tax_id_last4: "3333", filing_status: "SINGLE" }
              as: PlanAdministrator
              captures: { eve_id: $.data.id }
            - call: "POST /ira/accounts"
              payload: { owner_id: "${eve_id}", account_type: "TRADITIONAL" }
              as: PlanAdministrator
              captures: { eve_trad_id: $.data.id, eve_trad_v0: $.data.version }
          trigger:
            - call: "POST /ira/accounts/${eve_trad_id}/freeze"
              payload: { expected_account_version: "${eve_trad_v0}" }
              as: PlanAdministrator
              captures: { eve_trad_v1: $.data.version, post_freeze_status: $.data.status }
            - call: "POST /ira/accounts/${eve_trad_id}/unfreeze"
              payload: { expected_account_version: "${eve_trad_v1}" }
              as: PlanAdministrator
              captures: { eve_trad_v2: $.data.version, post_unfreeze_status: $.data.status }
          assert:
            - "post_freeze_status == FROZEN"
            - "post_unfreeze_status == ACTIVE"
            - "eve_trad_v1 == eve_trad_v0 + 1"
            - "eve_trad_v2 == eve_trad_v1 + 1"
            - "IRAAccount.${eve_trad_id}.cash_balance_cents == 0"

      - name: rmd_schedule_cyclic_open_delinquent_satisfied_loop
        grounds:
          - state_machines.RMDSchedule.OPEN_to_DELINQUENT
          - state_machines.RMDSchedule.DELINQUENT_to_SATISFIED
          - state_machines.RMDSchedule.OPEN_to_SATISFIED
          - entities.RMDSchedule.fields.status
          - entities.RMDSchedule.fields.satisfied_amount_cents
        distinguishing_aspect: |
          RMDSchedule has a CYCLIC shape: OPEN -> DELINQUENT (ops-run past deadline)
          -> SATISFIED (late cure via RMD-coded Distribution). This is not the linear
          OPEN -> SATISFIED pipeline; the cycle goes through a non-terminal failure
          posture and recovers. Different entity from instance #1 (RMDSchedule vs
          IRAAccount).
        test_recipe:
          setup:
            - "Owner Frank (age 73 throughout 2026) with one TRADITIONAL account funded to cash 700000 cents"
            - "RMDSchedule for tax_year=2026, required_amount_cents=26315, OPEN"
            - "Clock advanced past 2026-12-31 to 2027-01-15; ops-run year-rollover flips the schedule to DELINQUENT"
          setup_api_calls:
            - call: "POST /ira/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlanAdministrator
            - call: "POST /ira/owners"
              payload: { full_name: "Frank", date_of_birth: "1953-02-10", tax_id_last4: "4444", filing_status: "SINGLE" }
              as: PlanAdministrator
