        distinguishing_aspect: "A household of 12 would earn 4 * 11 = 44 raw household points, but HOUSEHOLD_POINT_CAP is 20, so with income_band MODERATE (10) and no other flags the score is exactly 30 rather than 54. Because 30 is far from the 100 ceiling, only the household cap can produce this number."
