  - rule_id: transitive_cascade
    instances:
      - name: sustained_challenge_four_hop_rescore_cascade
        grounds:
          - state_machines.Challenge.transitions.UNDER_REVIEW_to_SUSTAINED
          - state_machines.EligibleLocation.eligibility_state
          - state_machines.Application.transitions.SCORED_to_RESCORE_REQUIRED
          - calculations.program_scoring_posture
          - entities.GrantProgram.fields.scoring_posture
        distinguishing_aspect: |
          One determine call propagates four causally chained hops across four entity types, each
          hop caused only by the previous one: reclassifying L1 (hop 1) is what makes its
          CLAIMED_INELIGIBLE claim eligible and re-derives the application's cost basis (hop 2),
          which is what invalidates the FINAL ScoreSheet and pushes the application to
          RESCORE_REQUIRED (hop 3), which is what raises the program's stale_score_sheet_count and
          flips scoring_posture to RESTRICTED program-wide (hop 4).
