              as_user_id: "analyst-origin"
              captures: { pol_e: "$.data.id" }
            - call: "POST /agreements/${agr_e}/submit"
              payload: {}
              as: FinanceAnalyst
              as_user_id: "analyst-origin"
            - call: "POST /policies/${pol_e}/verifications"
              payload: { decision: "CONFIRMED" }
              as: Insurer
              as_user_id: "${insurer_1}"
            - call: "POST /policies/${pol_e}/verifications"
              payload: { decision: "CONFIRMED" }
              as: ProducerAgent
              as_user_id: "${agent_1}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /agreements/${agr_e}/activate"
              payload: {}
              as: FinanceAnalyst
              as_user_id: "analyst-origin"
              captures: { e_af0: "$.data.amount_financed_cents", e_fc0: "$.data.finance_charge_cents", e_top0: "$.data.total_of_payments_cents" }
            - call: "POST /policies/${pol_e}/endorsements"
