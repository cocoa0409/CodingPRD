          rationale: "Both variants asserted with literal windows in the named §1.8 instance."
      - name: report_variants_corner
        claim_type: variant_divergence
        grounds: [calculations.calc_seller_report_metrics]
        excluded_because:
          difficulty_instance: report_provisional_vs_final
          rationale: "Variant divergence asserted in the named §1.8 instance."

  # =============================================== From Table 4 (Validations)
  - section: validations
    instances:
      - name: create_listing_missing_auth_headers_unauthenticated
        claim_type: violation_to_error
        grounds: ["validations[priority=1]", "errors[ERR_UNAUTHENTICATED]"]
        distinguishing_aspect: "A call without X-User-Role/X-User-ID headers is rejected 401 ERR_UNAUTHENTICATED before any other check (priority 1)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /showing-desk/listings", payload: { seller_id: "8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", address: "1 NoAuth St", occupancy_type: "VACANT" }, captures: { err: $.data.error_id } }
          assert:
            - "HTTP 401 and error_id == ERR_UNAUTHENTICATED"
      - name: seller_create_showing_forbidden_role
        claim_type: violation_to_error
        grounds: ["validations[priority=3]", "errors[ERR_FORBIDDEN_ROLE]", roles]
        distinguishing_aspect: "Seller role calling the BuyerAgent-only create endpoint gets ERR_FORBIDDEN_ROLE (role check precedes existence/ownership)."
        test_recipe:
          setup: ["seller S exists"]
          setup_api_calls:
            - { call: "POST /showing-desk/sellers", payload: { full_name: "FR S", contact_email: "fr@x.com" }, as: PlatformAdmin, captures: { s_id: $.data.id } }
          trigger:
            - { call: "POST /showing-desk/showing-requests", payload: { listing_id: "8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", start_at: "2026-05-02T10:00:00Z", end_at: "2026-05-02T10:30:00Z" }, as: Seller, as_user_id: "${s_id}", captures: { err: $.data.error_id } }
          assert:
            - "HTTP 403 and error_id == ERR_FORBIDDEN_ROLE"
      - name: not_owner_seller_cannot_approve
        claim_type: violation_to_error
        grounds: ["validations[priority=5]", "errors[ERR_NOT_RESOURCE_OWNER]"]
        distinguishing_aspect: "A Seller whose id does not match listing.seller_id cannot approve the request: ERR_NOT_RESOURCE_OWNER."
        test_recipe:
          setup: ["seller S1 owns OCCUPIED listing L with a PENDING_APPROVAL request; seller S2 unrelated"]
          setup_api_calls:
            - { call: "POST /showing-desk/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /showing-desk/agents", payload: { full_name: "OW LA", license_number: "LIC-OW-LA", brokerage_name: "B1" }, as: Anonymous, captures: { la_id: $.data.id } }
            - { call: "POST /showing-desk/agents", payload: { full_name: "OW BA", license_number: "LIC-OW-BA", brokerage_name: "B2" }, as: Anonymous, captures: { ba_id: $.data.id } }
            - { call: "POST /showing-desk/agents/${ba_id}/verification-cases", payload: { license_document_ref: "doc-ow" }, as: BuyerAgent, as_user_id: "${ba_id}", captures: { case_id: $.data.id } }
            - { call: "POST /showing-desk/verification-cases/${case_id}/review", payload: { decision: "APPROVE" }, as: PlatformAdmin }
            - { call: "POST /showing-desk/sellers", payload: { full_name: "Owner", contact_email: "o1@x.com" }, as: PlatformAdmin, captures: { s1_id: $.data.id } }
            - { call: "POST /showing-desk/sellers", payload: { full_name: "Other", contact_email: "o2@x.com" }, as: PlatformAdmin, captures: { s2_id: $.data.id } }
            - { call: "POST /showing-desk/listings", payload: { seller_id: "${s1_id}", address: "29 Owner Ct", occupancy_type: "OCCUPIED" }, as: ListingAgent, as_user_id: "${la_id}", captures: { l_id: $.data.id } }
            - { call: "POST /showing-desk/showing-requests", payload: { listing_id: "${l_id}", start_at: "2026-05-02T10:00:00Z", end_at: "2026-05-02T10:30:00Z" }, as: BuyerAgent, as_user_id: "${ba_id}", captures: { r_id: $.data.id } }
          trigger:
