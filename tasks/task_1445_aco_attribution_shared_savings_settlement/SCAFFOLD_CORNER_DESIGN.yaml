  - section: endpoints
    instances:
      - name: list_endpoints_paginate_with_defaults
        claim_type: listing
        grounds: ["response_envelope"]
        distinguishing_aspect: "A list read with no pagination params applies the defaults limit=10, offset=0 and reports total_count/has_more consistently (3 items -> total_count 3, has_more false)."
        test_recipe:
          setup: ["OPEN period with three claims"]
          setup_api_calls:
            - { call: "POST /aco/agreement-periods", payload: { aco_tax_id: "ACO-N1", aco_name: "N1", performance_start_date: "2026-01-01", performance_end_date: "2026-12-31", track: "ONE_SIDED" }, as: AcoAdministrator, captures: { p1: $.data.id } }
            - { call: "POST /aco/beneficiaries", payload: { medicare_id: "MBI-N1", birth_year: 1980 }, as: AcoAdministrator, captures: { b1: $.data.id } }
            - { call: "POST /aco/agreement-periods/${p1}/open", payload: {}, as: AcoAdministrator }
            - { call: "POST /aco/claims", payload: { agreement_period_id: "${p1}", beneficiary_id: "${b1}", service_date: "2026-02-01", allowed_amount_cents: 100, claim_type: "PART_A" }, as: ClaimsProcessor }
            - { call: "POST /aco/claims", payload: { agreement_period_id: "${p1}", beneficiary_id: "${b1}", service_date: "2026-02-02", allowed_amount_cents: 200, claim_type: "PART_A" }, as: ClaimsProcessor }
            - { call: "POST /aco/claims", payload: { agreement_period_id: "${p1}", beneficiary_id: "${b1}", service_date: "2026-02-03", allowed_amount_cents: 300, claim_type: "PART_B" }, as: ClaimsProcessor }
          trigger:
            - { call: "GET /aco/claims?agreement_period_id=${p1}", as: ClaimsProcessor }
          assert:
            - "response envelope contains limit == 10, offset == 0, total_count == 3, has_more == false"
            - "response_type == 'array' and data has 3 items sorted created_at ASC"

      - name: attribution_records_reverse_reachable_by_period
        claim_type: cross_reference_link
        grounds: ["entities.AttributionRecord.fields.agreement_period_id"]
        distinguishing_aspect: "Cascade-created AttributionRecords (never returned by a creation response) are discoverable via the filtered list GET /aco/attribution-records?agreement_period_id=..."
        test_recipe:
