  # ---------------------------------------------------------------- hold amendments
  - method: POST
    path: /hold-amendments
    description: "Files a post-and-hold amendment matching a competitor's posted price on a posted item."
    roles: [FilingAgent]
    success_code: 201
    input: [amending_item_id, reference_item_id, new_case_price_cents, new_unit_price_cents, expected_schedule_version]
    output: HoldAmendment
    side_effects:
      - "increments the amending item's PriceSchedule.version by 1"

  - method: POST
    path: /hold-amendments/{id}/accept
    description: "Accepts a pending hold amendment and applies the amended prices."
    roles: [ComplianceOfficer]
    success_code: 200
    input: []
    output: HoldAmendment
    side_effects:
      - "captures the amending item's prior prices and applies the amended prices"
      - "recomputes every ACTIVE quantity discount tier of the item"
      - "recomputes every ACTIVE combination sale containing the item and voids those that fall below their minimum allowed price"
      - "increments PriceScheduleItem.version by 1"

  - method: POST
    path: /hold-amendments/{id}/reject
    description: "Rejects a pending hold amendment and counts it against the filing wholesaler."
    roles: [ComplianceOfficer]
    success_code: 200
    input: [rejection_reason]
    output: HoldAmendment
    side_effects:
      - "increments the filing wholesaler's frivolous_amendment_count by 1"
      - "accrues the program's frivolous amendment penalty once the count reaches 3"
      - "increments Wholesaler.version by 1"

  - method: POST
    path: /hold-amendments/{id}/revoke
    description: "Revokes an accepted hold amendment, restoring the item's prior prices and reversing every derived effect."
    roles: [ComplianceOfficer]
    success_code: 200
    input: [revocation_reason]
    output: HoldAmendment
    side_effects:
      - "restores the amending item's prior prices and decrements amendment_count by 1"
      - "recomputes every ACTIVE quantity discount tier of the item"
      - "returns combination sales voided by the amendment to ACTIVE when they again satisfy their minimum allowed price"
      - "increments PriceScheduleItem.version by 1"

  - method: GET
    path: /hold-amendments/{id}
    description: "Retrieves one hold amendment."
    roles: [ComplianceOfficer, FilingAgent, CertifyingOfficer]
    success_code: 200
    input: []
    output: HoldAmendment
    side_effects: []

  - method: GET
    path: /hold-amendments
    description: "Lists hold amendments."
    roles: [ComplianceOfficer, FilingAgent, CertifyingOfficer]
    success_code: 200
    input: ["amending_item_id?", "reference_item_id?", "status?", "limit?", "offset?"]
    output: HoldAmendment[]
    side_effects: []

