            - "data.error_id == ERR_STALE_CONTRACT_VERSION"
            - "AuthorStatement.${s2_id}.status == DRAFT (finalize rejected)"

      - name: version_increments_on_each_mutation
        claim_type: optimistic_concurrency
        grounds: ["entities.Contract.fields.version", "state_machines.Contract.DRAFT_to_ACTIVE"]
        distinguishing_aspect: "Contract.version starts at 1 on create and increments by 1 on activate (to 2); the create and activate are distinct mutations."
