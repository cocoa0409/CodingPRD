          assert:
            - "The three setup heats were all accepted, so Wave.${wave_w3_id}.capacity == 60 and its release_status == SCHEDULED"
            - "The first trigger call returns 409 with error_id ERR_CORRAL_WINDOW_CONFLICT (60 + 60 + 60 + 60 == 240 > 200)"
            - "The second trigger call returns 201 with the identical capacity 60, because W1 has rolled out of the window and only W2 and W3 still count (60 + 60 + 60 == 180)"
            - "Wave.${wave_w5_id}.scheduled_start_utc == 2026-09-12T08:06:00Z"
