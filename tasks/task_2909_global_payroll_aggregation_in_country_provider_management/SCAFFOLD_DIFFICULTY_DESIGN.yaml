  - rule_id: priority_pair_validation_conflict
    instances:
      - name: funding_release_state_error_precedes_fiscal_cap_error
        grounds:
          - validations.funding-release-bank-verified
          - validations.funding-release-daily-cap
          - entities.LocalBankAccount.fields.status
          - entities.LocalBankAccount.fields.daily_cap_minor
          - errors.ERR_BANK_ACCOUNT_NOT_VERIFIED
        distinguishing_aspect: |
          Category pair is state (priority 30) against fiscal (priority 60): the release
          simultaneously targets a PENDING_VERIFICATION bank account and asks for 8650000
          against a daily cap of 1000000, and the response must be
          ERR_BANK_ACCOUNT_NOT_VERIFIED (409), never ERR_FUNDING_CAP_EXCEEDED. Both
          conditions are independently sufficient to reject.
        test_recipe:
          setup:
            - "CountryProfile DE, Provider EuroPay GmbH, ACTIVE Engagement for DE"
            - "PayrollCycle 2026-08 in RESULTS_APPROVED with requested_local_minor 8650000"
            - "LocalBankAccount DE-ACC-CAP left in PENDING_VERIFICATION with daily_cap_minor 1000000, far below the requested amount"
            - "a FundingInstruction created and APPROVED by treas-01 against that account"
            - "the release is attempted by treas-02, so the dual-authorization rule at priority 15 is satisfied and cannot mask the pair under test"
          setup_api_calls:
            - call: "POST /payroll/country-profiles"
              payload: { country_code: "DE", local_currency: "EUR", data_residency_region: "EU", statutory_filing_deadline_days: 10, materiality_pct: 5.00, materiality_floor_minor: 100000, penalty_daily_rate_minor: 15000, required_filing_types: ["INCOME_TAX_WITHHOLDING", "SOCIAL_INSURANCE"], local_holidays: ["2026-09-25"] }
