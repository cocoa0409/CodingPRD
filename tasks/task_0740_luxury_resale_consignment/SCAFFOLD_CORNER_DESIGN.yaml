# =============================================================================
# §1.9 Scaffold Corner Design (breadth coverage of non-difficulty claims)
# Sections/claim_types follow references/claim-extraction-guide.md.
# Every setup_api_calls chain is empty-DB reachable via §1.5; all ${var} bound.
# =============================================================================
scaffold_corner_design:

  - section: entities
    instances:
      - name: seller_creation_sets_defaults
        claim_type: creation
        grounds:
          - entities.Seller.fields.tier
          - entities.Seller.fields.status
          - entities.Seller.fields.pending_payout_cents
        distinguishing_aspect: "POST /consignment/sellers returns status ACTIVE, tier STANDARD, all ledgers 0, version 1 on a brand-new seller."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls:
            - { call: "POST /consignment/sellers", payload: { display_name: "S1", email: "s1@x.com" }, as: OpsAdmin, captures: { seller_id: "$.data.id" } }
          trigger:
            - { call: "GET /consignment/sellers/${seller_id}", payload: {}, as: OpsAdmin }
          assert:
            - "Seller.${seller_id}.status == ACTIVE"
            - "Seller.${seller_id}.tier == STANDARD"
            - "Seller.${seller_id}.lifetime_net_sales_cents == 0"
            - "Seller.${seller_id}.pending_payout_cents == 0"
            - "Seller.${seller_id}.version == 1"

      - name: item_create_missing_required_category_returns_validation
        claim_type: required_fields
        grounds:
          - entities.ConsignmentItem.fields.category
          - errors[ERR_VALIDATION]
        distinguishing_aspect: "POST /consignment/items without the required category field returns ERR_VALIDATION (400)."
        test_recipe:
          setup: ["A registered seller."]
          setup_api_calls:
            - { call: "POST /consignment/sellers", payload: { display_name: "S1", email: "s1@x.com" }, as: OpsAdmin, captures: { seller_id: "$.data.id" } }
          trigger:
            - { call: "POST /consignment/items", payload: { seller_id: "${seller_id}", brand: "X", title: "NoCat", declared_value_cents: 100000, intake_channel: "DROP_OFF" }, as: Seller, as_user_id: "${seller_id}", captures: { err: "$.data.error_id" } }
          assert:
            - "response.data.error_id == ERR_VALIDATION"
            - "http_status == 400"

      - name: get_nonexistent_listing_returns_not_found
        claim_type: not_found
        grounds:
          - entities.Listing
          - errors[ERR_LISTING_NOT_FOUND]
        distinguishing_aspect: "GET /consignment/listings/{id} with a non-existent UUID returns ERR_LISTING_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - { call: "GET /consignment/listings/00000000-0000-0000-0000-000000000000", payload: {}, as: OpsAdmin, captures: { err: "$.data.error_id" } }
          assert:
            - "response.data.error_id == ERR_LISTING_NOT_FOUND"
            - "http_status == 404"

      - name: item_dropoff_created_in_received_state
        claim_type: defaults
        grounds:
          - entities.ConsignmentItem.fields.intake_channel
          - entities.ConsignmentItem.fields.status
        distinguishing_aspect: "Creating an item with intake_channel DROP_OFF returns status RECEIVED immediately (no pickup needed)."
        test_recipe:
          setup: ["A registered seller."]
          setup_api_calls:
            - { call: "POST /consignment/sellers", payload: { display_name: "S1", email: "s1@x.com" }, as: OpsAdmin, captures: { seller_id: "$.data.id" } }
          trigger:
            - { call: "POST /consignment/items", payload: { seller_id: "${seller_id}", category: "HANDBAGS", brand: "X", title: "Drop", declared_value_cents: 100000, intake_channel: "DROP_OFF" }, as: Seller, as_user_id: "${seller_id}", captures: { item_id: "$.data.id" } }
          assert:
            - "ConsignmentItem.${item_id}.status == RECEIVED"

      - name: authenticate_sets_computed_listable_true
        claim_type: computed_fields
        grounds:
          - entities.ConsignmentItem.fields.listable
          - entities.ConsignmentItem.fields.authenticity_verdict
        distinguishing_aspect: "Authenticating a RECEIVED item AUTHENTIC grade A sets status AUTHENTICATED and computed listable true (grade A >= min C)."
        test_recipe:
          setup: ["HANDBAGS policy (listable_min C), a RECEIVED drop-off item."]
          setup_api_calls:
            - { call: "POST /consignment/category-policies", payload: { category: "HANDBAGS", base_commission_pct: 0.20, buyer_fee_pct: 0.10, buyer_fee_flat_cents: 500, return_window_days: 14, min_offer_pct: 0.70, listable_min_condition_grade: "C", pickup_insurance_cap_cents: 5000000 }, as: OpsAdmin }
            - { call: "POST /consignment/sellers", payload: { display_name: "S1", email: "s1@x.com" }, as: OpsAdmin, captures: { seller_id: "$.data.id" } }
            - { call: "POST /consignment/items", payload: { seller_id: "${seller_id}", category: "HANDBAGS", brand: "X", title: "Auth", declared_value_cents: 100000, intake_channel: "DROP_OFF" }, as: Seller, as_user_id: "${seller_id}", captures: { item_id: "$.data.id" } }
          trigger:
            - { call: "POST /consignment/items/${item_id}/authenticate", payload: { verdict: "AUTHENTIC", condition_grade: "A" }, as: Authenticator }
          assert:
            - "ConsignmentItem.${item_id}.status == AUTHENTICATED"
            - "ConsignmentItem.${item_id}.authenticity_verdict == AUTHENTIC"
            - "ConsignmentItem.${item_id}.listable == true"

  - section: state_machines
    instances:
      - name: authenticate_already_authenticated_returns_invalid_state
        claim_type: idempotency
        grounds:
          - state_machines.ConsignmentItem.RECEIVED_to_AUTHENTICATED
          - errors[ERR_ITEM_INVALID_STATE]
        distinguishing_aspect: "A second authenticate on an already-AUTHENTICATED item is rejected ERR_ITEM_INVALID_STATE (only RECEIVED items may be authenticated)."
        test_recipe:
          setup: ["HANDBAGS policy; a drop-off item already authenticated AUTHENTIC A."]
          setup_api_calls:
            - { call: "POST /consignment/category-policies", payload: { category: "HANDBAGS", base_commission_pct: 0.20, buyer_fee_pct: 0.10, buyer_fee_flat_cents: 500, return_window_days: 14, min_offer_pct: 0.70, listable_min_condition_grade: "C", pickup_insurance_cap_cents: 5000000 }, as: OpsAdmin }
            - { call: "POST /consignment/sellers", payload: { display_name: "S1", email: "s1@x.com" }, as: OpsAdmin, captures: { seller_id: "$.data.id" } }
            - { call: "POST /consignment/items", payload: { seller_id: "${seller_id}", category: "HANDBAGS", brand: "X", title: "Twice", declared_value_cents: 100000, intake_channel: "DROP_OFF" }, as: Seller, as_user_id: "${seller_id}", captures: { item_id: "$.data.id" } }
            - { call: "POST /consignment/items/${item_id}/authenticate", payload: { verdict: "AUTHENTIC", condition_grade: "A" }, as: Authenticator }
          trigger:
            - { call: "POST /consignment/items/${item_id}/authenticate", payload: { verdict: "AUTHENTIC", condition_grade: "B" }, as: Authenticator, captures: { err: "$.data.error_id" } }
          assert:
            - "response.data.error_id == ERR_ITEM_INVALID_STATE"
            - "http_status == 409"

      - name: resolve_terminal_dispute_returns_invalid_state
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.Dispute.FILED_to_RESOLVED_SELLER
          - errors[ERR_DISPUTE_INVALID_STATE]
        distinguishing_aspect: "Resolving a dispute already RESOLVED_SELLER is rejected ERR_DISPUTE_INVALID_STATE (terminal lockdown)."
        test_recipe:
          setup: ["HANDBAGS delivered sale with a FILED dispute already resolved SELLER."]
          setup_api_calls:
            - { call: "POST /consignment/category-policies", payload: { category: "HANDBAGS", base_commission_pct: 0.20, buyer_fee_pct: 0.10, buyer_fee_flat_cents: 500, return_window_days: 14, min_offer_pct: 0.70, listable_min_condition_grade: "C", pickup_insurance_cap_cents: 5000000 }, as: OpsAdmin }
            - { call: "POST /consignment/sellers", payload: { display_name: "S1", email: "s1@x.com" }, as: OpsAdmin, captures: { seller_id: "$.data.id" } }
            - { call: "POST /consignment/buyers", payload: { display_name: "B1", email: "b1@x.com" }, as: OpsAdmin, captures: { buyer_id: "$.data.id" } }
            - { call: "POST /consignment/items", payload: { seller_id: "${seller_id}", category: "HANDBAGS", brand: "X", title: "D", declared_value_cents: 180000, intake_channel: "DROP_OFF" }, as: Seller, as_user_id: "${seller_id}", captures: { item_id: "$.data.id" } }
            - { call: "POST /consignment/items/${item_id}/authenticate", payload: { verdict: "AUTHENTIC", condition_grade: "A" }, as: Authenticator }
            - { call: "POST /consignment/listings", payload: { item_id: "${item_id}", list_price_cents: 180000 }, as: Seller, as_user_id: "${seller_id}", captures: { listing_id: "$.data.id" } }
            - { call: "POST /consignment/listings/${listing_id}/publish", payload: {}, as: Seller, as_user_id: "${seller_id}" }
            - { call: "POST /consignment/sales", payload: { listing_id: "${listing_id}", buyer_id: "${buyer_id}" }, as: Buyer, as_user_id: "${buyer_id}", captures: { sale_id: "$.data.id" } }
            - { call: "POST /consignment/sales/${sale_id}/capture-payment", payload: {}, as: Buyer, as_user_id: "${buyer_id}" }
            - { call: "POST /consignment/sales/${sale_id}/ship", payload: {}, as: Seller, as_user_id: "${seller_id}" }
            - { call: "POST /consignment/sales/${sale_id}/confirm-delivery", payload: {}, as: Buyer, as_user_id: "${buyer_id}" }
            - { call: "POST /consignment/disputes", payload: { sale_id: "${sale_id}", type: "CONDITION", reason: "minor" }, as: Buyer, as_user_id: "${buyer_id}", captures: { dispute_id: "$.data.id" } }
            - { call: "POST /consignment/disputes/${dispute_id}/resolve", payload: { outcome: "SELLER" }, as: OpsAdmin }
          trigger:
            - { call: "POST /consignment/disputes/${dispute_id}/resolve", payload: { outcome: "BUYER" }, as: OpsAdmin, captures: { err: "$.data.error_id" } }
          assert:
            - "response.data.error_id == ERR_DISPUTE_INVALID_STATE"
            - "http_status == 409"

      - name: capture_payment_twice_returns_invalid_state
        claim_type: idempotency
        grounds:
          - state_machines.Sale.PENDING_to_CAPTURED
          - errors[ERR_SALE_PAYMENT_INVALID_STATE]
        distinguishing_aspect: "Capturing payment on an already-CAPTURED sale is rejected ERR_SALE_PAYMENT_INVALID_STATE."
        test_recipe:
          setup: ["HANDBAGS direct-buy sale with payment already CAPTURED."]
          setup_api_calls:
            - { call: "POST /consignment/category-policies", payload: { category: "HANDBAGS", base_commission_pct: 0.20, buyer_fee_pct: 0.10, buyer_fee_flat_cents: 500, return_window_days: 14, min_offer_pct: 0.70, listable_min_condition_grade: "C", pickup_insurance_cap_cents: 5000000 }, as: OpsAdmin }
            - { call: "POST /consignment/sellers", payload: { display_name: "S1", email: "s1@x.com" }, as: OpsAdmin, captures: { seller_id: "$.data.id" } }
            - { call: "POST /consignment/buyers", payload: { display_name: "B1", email: "b1@x.com" }, as: OpsAdmin, captures: { buyer_id: "$.data.id" } }
            - { call: "POST /consignment/items", payload: { seller_id: "${seller_id}", category: "HANDBAGS", brand: "X", title: "C", declared_value_cents: 180000, intake_channel: "DROP_OFF" }, as: Seller, as_user_id: "${seller_id}", captures: { item_id: "$.data.id" } }
            - { call: "POST /consignment/items/${item_id}/authenticate", payload: { verdict: "AUTHENTIC", condition_grade: "A" }, as: Authenticator }
            - { call: "POST /consignment/listings", payload: { item_id: "${item_id}", list_price_cents: 180000 }, as: Seller, as_user_id: "${seller_id}", captures: { listing_id: "$.data.id" } }
            - { call: "POST /consignment/listings/${listing_id}/publish", payload: {}, as: Seller, as_user_id: "${seller_id}" }
            - { call: "POST /consignment/sales", payload: { listing_id: "${listing_id}", buyer_id: "${buyer_id}" }, as: Buyer, as_user_id: "${buyer_id}", captures: { sale_id: "$.data.id" } }
            - { call: "POST /consignment/sales/${sale_id}/capture-payment", payload: {}, as: Buyer, as_user_id: "${buyer_id}" }
          trigger:
            - { call: "POST /consignment/sales/${sale_id}/capture-payment", payload: {}, as: Buyer, as_user_id: "${buyer_id}", captures: { err: "$.data.error_id" } }
          assert:
            - "response.data.error_id == ERR_SALE_PAYMENT_INVALID_STATE"
            - "http_status == 409"

      - name: counter_expired_offer_returns_invalid_state
        claim_type: invalid_transitions
        grounds:
          - state_machines.Offer.PENDING_to_COUNTERED
          - entities.Offer.fields.expires_at
          - errors[ERR_OFFER_INVALID_STATE]
        distinguishing_aspect: "An offer created at 2026-03-01 expires after OFFER_TTL_HOURS (72h = 2026-03-04T00:00:00Z); countering it at 2026-03-05 is rejected ERR_OFFER_INVALID_STATE (lazily EXPIRED)."
        test_recipe:
          setup: ["HANDBAGS listing published at 200000, buyer offer 150000 at clock 2026-03-01; clock advanced to 2026-03-05."]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-03-01T00:00:00Z" }, as: OpsAdmin }
            - { call: "POST /consignment/category-policies", payload: { category: "HANDBAGS", base_commission_pct: 0.20, buyer_fee_pct: 0.10, buyer_fee_flat_cents: 500, return_window_days: 14, min_offer_pct: 0.70, listable_min_condition_grade: "C", pickup_insurance_cap_cents: 5000000 }, as: OpsAdmin }
            - { call: "POST /consignment/sellers", payload: { display_name: "S1", email: "s1@x.com" }, as: OpsAdmin, captures: { seller_id: "$.data.id" } }
            - { call: "POST /consignment/buyers", payload: { display_name: "B1", email: "b1@x.com" }, as: OpsAdmin, captures: { buyer_id: "$.data.id" } }
            - { call: "POST /consignment/items", payload: { seller_id: "${seller_id}", category: "HANDBAGS", brand: "X", title: "E", declared_value_cents: 200000, intake_channel: "DROP_OFF" }, as: Seller, as_user_id: "${seller_id}", captures: { item_id: "$.data.id" } }
            - { call: "POST /consignment/items/${item_id}/authenticate", payload: { verdict: "AUTHENTIC", condition_grade: "A" }, as: Authenticator }
            - { call: "POST /consignment/listings", payload: { item_id: "${item_id}", list_price_cents: 200000 }, as: Seller, as_user_id: "${seller_id}", captures: { listing_id: "$.data.id" } }
            - { call: "POST /consignment/listings/${listing_id}/publish", payload: {}, as: Seller, as_user_id: "${seller_id}", captures: { lv: "$.data.version" } }
            - { call: "POST /consignment/offers", payload: { listing_id: "${listing_id}", buyer_id: "${buyer_id}", amount_cents: 150000, expected_listing_version: "${lv}" }, as: Buyer, as_user_id: "${buyer_id}", captures: { offer_id: "$.data.id" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-03-05T00:00:00Z" }, as: OpsAdmin }
          trigger:
            - { call: "POST /consignment/offers/${offer_id}/counter", payload: { counter_amount_cents: 175000 }, as: Seller, as_user_id: "${seller_id}", captures: { err: "$.data.error_id" } }
          assert:
            - "response.data.error_id == ERR_OFFER_INVALID_STATE"
            - "http_status == 409"

      - name: vehicle_adjacent_window_allowed_no_buffer
        claim_type: valid_transition
        grounds:
          - state_machines.PickupAppointment.SCHEDULED_to_COMPLETED
          - entities.PickupAppointment.fields.vehicle_id
        distinguishing_aspect: "A pickup on vehicle V1 at [11:00,12:00) immediately after V1's prior [10:00,11:00) is ACCEPTED (status SCHEDULED) — vehicle uses strict half-open with NO buffer, so exact adjacency is allowed."
        test_recipe:
          setup: ["HANDBAGS; concierges C1,C2; vehicle V1; two PICKUP items within cap; a prior pickup on C1+V1 [2026-03-05T10:00,11:00)."]
          setup_api_calls:
            - { call: "POST /consignment/category-policies", payload: { category: "HANDBAGS", base_commission_pct: 0.20, buyer_fee_pct: 0.10, buyer_fee_flat_cents: 500, return_window_days: 14, min_offer_pct: 0.70, listable_min_condition_grade: "C", pickup_insurance_cap_cents: 5000000 }, as: OpsAdmin }
            - { call: "POST /consignment/sellers", payload: { display_name: "S1", email: "s1@x.com" }, as: OpsAdmin, captures: { seller_id: "$.data.id" } }
            - { call: "POST /consignment/concierges", payload: { name: "C1", region: "NYC" }, as: OpsAdmin, captures: { c1: "$.data.id" } }
            - { call: "POST /consignment/concierges", payload: { name: "C2", region: "NYC" }, as: OpsAdmin, captures: { c2: "$.data.id" } }
            - { call: "POST /consignment/vehicles", payload: { plate: "V1" }, as: OpsAdmin, captures: { v1: "$.data.id" } }
            - { call: "POST /consignment/items", payload: { seller_id: "${seller_id}", category: "HANDBAGS", brand: "A", title: "First", declared_value_cents: 100000, intake_channel: "PICKUP" }, as: Seller, as_user_id: "${seller_id}", captures: { item1: "$.data.id" } }
            - { call: "POST /consignment/pickups", payload: { item_id: "${item1}", concierge_id: "${c1}", vehicle_id: "${v1}", window_start: "2026-03-05T10:00:00Z", window_end: "2026-03-05T11:00:00Z" }, as: Seller, as_user_id: "${seller_id}" }
            - { call: "POST /consignment/items", payload: { seller_id: "${seller_id}", category: "HANDBAGS", brand: "B", title: "Second", declared_value_cents: 100000, intake_channel: "PICKUP" }, as: Seller, as_user_id: "${seller_id}", captures: { item2: "$.data.id" } }
          trigger:
            - { call: "POST /consignment/pickups", payload: { item_id: "${item2}", concierge_id: "${c2}", vehicle_id: "${v1}", window_start: "2026-03-05T11:00:00Z", window_end: "2026-03-05T12:00:00Z" }, as: Seller, as_user_id: "${seller_id}", captures: { appt_id: "$.data.id" } }
          assert:
            - "PickupAppointment.${appt_id}.status == SCHEDULED"

      - name: release_held_payout_returns_not_releasable
        claim_type: invalid_transitions
        grounds:
          - state_machines.Payout.SCHEDULED_to_HELD
          - errors[ERR_PAYOUT_NOT_RELEASABLE]
        distinguishing_aspect: "A payout moved to HELD by a FILED dispute cannot be released; POST release returns ERR_PAYOUT_NOT_RELEASABLE (payout not SCHEDULED)."
        test_recipe:
          setup: ["HANDBAGS delivered sale (payout SCHEDULED) with a FILED dispute (payout now HELD)."]
          setup_api_calls:
            - { call: "POST /consignment/category-policies", payload: { category: "HANDBAGS", base_commission_pct: 0.20, buyer_fee_pct: 0.10, buyer_fee_flat_cents: 500, return_window_days: 14, min_offer_pct: 0.70, listable_min_condition_grade: "C", pickup_insurance_cap_cents: 5000000 }, as: OpsAdmin }
            - { call: "POST /consignment/sellers", payload: { display_name: "S1", email: "s1@x.com" }, as: OpsAdmin, captures: { seller_id: "$.data.id" } }
            - { call: "POST /consignment/buyers", payload: { display_name: "B1", email: "b1@x.com" }, as: OpsAdmin, captures: { buyer_id: "$.data.id" } }
            - { call: "POST /consignment/items", payload: { seller_id: "${seller_id}", category: "HANDBAGS", brand: "X", title: "H", declared_value_cents: 180000, intake_channel: "DROP_OFF" }, as: Seller, as_user_id: "${seller_id}", captures: { item_id: "$.data.id" } }
            - { call: "POST /consignment/items/${item_id}/authenticate", payload: { verdict: "AUTHENTIC", condition_grade: "A" }, as: Authenticator }
            - { call: "POST /consignment/listings", payload: { item_id: "${item_id}", list_price_cents: 180000 }, as: Seller, as_user_id: "${seller_id}", captures: { listing_id: "$.data.id" } }
            - { call: "POST /consignment/listings/${listing_id}/publish", payload: {}, as: Seller, as_user_id: "${seller_id}" }
            - { call: "POST /consignment/sales", payload: { listing_id: "${listing_id}", buyer_id: "${buyer_id}" }, as: Buyer, as_user_id: "${buyer_id}", captures: { sale_id: "$.data.id" } }
            - { call: "POST /consignment/sales/${sale_id}/capture-payment", payload: {}, as: Buyer, as_user_id: "${buyer_id}" }
            - { call: "POST /consignment/sales/${sale_id}/ship", payload: {}, as: Seller, as_user_id: "${seller_id}" }
            - { call: "POST /consignment/sales/${sale_id}/confirm-delivery", payload: {}, as: Buyer, as_user_id: "${buyer_id}" }
            - { call: "POST /consignment/disputes", payload: { sale_id: "${sale_id}", type: "AUTHENTICITY", reason: "hold it" }, as: Buyer, as_user_id: "${buyer_id}" }
            - { call: "GET /consignment/sales/${sale_id}/payouts", payload: {}, as: OpsAdmin, captures: { payout_id: "$.data[0].id" } }
          trigger:
            - { call: "POST /consignment/payouts/${payout_id}/release", payload: {}, as: OpsAdmin, captures: { err: "$.data.error_id" } }
          assert:
            - "response.data.error_id == ERR_PAYOUT_NOT_RELEASABLE"
            - "http_status == 409"

  - section: calculations
    instances:
      - name: tier_stays_standard_one_below_premier_threshold
        claim_type: correct_result
        grounds:
          - calculations.seller_tier
          - entities.Seller.fields.tier
          - entities.Seller.fields.lifetime_net_sales_cents
        distinguishing_aspect: "A payout release landing lifetime_net_sales_cents at 999999 (one below PREMIER_THRESHOLD 1000000) keeps tier STANDARD — the threshold is >= inclusive, so 999999 does not upgrade."
        test_recipe:
          setup: ["HANDBAGS; STANDARD seller; direct-buy at 1249999 (commission round(249999.8)=250000 -> net 999999); delivered 2026-03-10; clock 2026-03-25."]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-03-01T00:00:00Z" }, as: OpsAdmin }
            - { call: "POST /consignment/category-policies", payload: { category: "HANDBAGS", base_commission_pct: 0.20, buyer_fee_pct: 0.10, buyer_fee_flat_cents: 500, return_window_days: 14, min_offer_pct: 0.70, listable_min_condition_grade: "C", pickup_insurance_cap_cents: 5000000 }, as: OpsAdmin }
            - { call: "POST /consignment/sellers", payload: { display_name: "S1", email: "s1@x.com" }, as: OpsAdmin, captures: { seller_id: "$.data.id" } }
            - { call: "POST /consignment/buyers", payload: { display_name: "B1", email: "b1@x.com" }, as: OpsAdmin, captures: { buyer_id: "$.data.id" } }
            - { call: "POST /consignment/items", payload: { seller_id: "${seller_id}", category: "HANDBAGS", brand: "Hermes", title: "Kelly32", declared_value_cents: 1249999, intake_channel: "DROP_OFF" }, as: Seller, as_user_id: "${seller_id}", captures: { item_id: "$.data.id" } }
            - { call: "POST /consignment/items/${item_id}/authenticate", payload: { verdict: "AUTHENTIC", condition_grade: "A" }, as: Authenticator }
            - { call: "POST /consignment/listings", payload: { item_id: "${item_id}", list_price_cents: 1249999 }, as: Seller, as_user_id: "${seller_id}", captures: { listing_id: "$.data.id" } }
