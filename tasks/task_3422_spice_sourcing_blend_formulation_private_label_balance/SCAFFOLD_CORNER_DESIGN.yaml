          - state_machines.RecallCase.recall_initiate
        distinguishing_aspect: "Initiating a recall whose suspect lot never entered any batch is legal: scope freezes to an empty set ([] , 0 kg) and the case still reaches INITIATED — no error on empty scope."
        test_recipe:
          setup: ["supplier S; one lot L never blended (RECEIVED)"]
          setup_api_calls:
