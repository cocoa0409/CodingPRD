# =============================================================================
# PRD Benchmark Scaffold — task_3145_dental_benefit_plan_administration_fee_tiers_predetermination
# Delta Dental-style plan administration with network participation tiers,
# provider fee filing, predetermination with clinical review, frequency/age
# limitation rules, alternate benefit provision (ABP), missing tooth clause,
# waiting period tracking, annual maximum / deductible accumulation, dual
# coverage coordination of benefits (COB), and claim attachment requirements.
# =============================================================================

scenario: |
  Dental Benefit Plan Administration, Fee Tiers & Predetermination (Delta Dental):
  network participation tiers with different allowed fee schedules and member
  cost share by tier, provider fee filing and allowed amount determination with
  periodic schedule updates, predetermination requests for major treatment with
  clinical review and benefit estimation before treatment, frequency and age
  limitation rules for cleanings, radiographs, sealants and replacements,
  alternate benefit provisions paying the lesser-cost treatment with patient
  responsibility for the difference, missing tooth, waiting period and annual
  maximum accumulation tracking, coordination of benefits across dual dental
  coverage, claim attachment requirements for radiographs and narratives

domain_name: dental-benefit-administration
api_prefix: /dental

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: pricing_engine
  complexity_layers:
    - dual_variant_calculation
    - cascading_side_effects
    - rate_threshold_triggers
    - derived_field_reconciliation
    - optimistic_concurrency

  entity_topology: hybrid
  state_machine_shape: branching
  relationship_patterns:
    - one_to_many
    - cross_aggregate
    - many_to_many
  role_model: segregation_of_duties
  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Plan
    parent: null
    common_fields: true
    fields:
      - { name: plan_code, type: string, source: input, description: "Globally unique human-readable plan code (e.g. DD-PRIME-100)" }
      - { name: plan_year_start_month, type: integer, source: input, description: "Month (1-12) when the plan year rolls over" }
      - { name: annual_maximum_cents, type: integer, source: input, description: "Per-member per-plan-year benefit cap in cents; 0 means uncapped is NOT allowed" }
      - { name: deductible_cents, type: integer, source: input, description: "Per-member per-plan-year deductible in cents" }
      - { name: deductible_applies_preventive, type: boolean, source: input, description: "Whether the deductible is charged against preventive-category lines" }
      - { name: preventive_coinsurance_pct, type: integer, source: input, description: "Plan pays this percent of allowed amount for preventive services (0-100)" }
      - { name: basic_coinsurance_pct, type: integer, source: input, description: "Plan pays this percent of allowed amount for basic services (0-100)" }
      - { name: major_coinsurance_pct, type: integer, source: input, description: "Plan pays this percent of allowed amount for major services (0-100)" }
      - { name: basic_waiting_months, type: integer, source: input, description: "Months from subscriber effective date before basic-category services are eligible" }
      - { name: major_waiting_months, type: integer, source: input, description: "Months from subscriber effective date before major-category services are eligible" }
      - { name: missing_tooth_clause_active, type: boolean, source: input, description: "If true, replacement of a tooth lost before the member effective date is denied" }
      - { name: abp_enabled, type: boolean, source: input, description: "If true, alternate benefit provision applies to ABP-flagged procedures" }
      - { name: status, type: enum, source: system, description: "DRAFT | ACTIVE | SUSPENDED | RETIRED" }

  - name: Provider
    parent: null
    common_fields: true
    fields:
      - { name: npi, type: string, source: input, description: "National Provider Identifier (10 digits)" }
      - { name: legal_name, type: string, source: input, description: "Practice legal name" }
      - { name: tier, type: enum, source: input, description: "PREMIER | PPO | OUT_OF_NETWORK — drives which fee schedule applies" }
      - { name: license_state, type: string, source: input, description: "Two-letter state of primary licensure" }
      - { name: contracted_on, type: datetime, source: input, description: "Date provider joined the network; tier is honored from this date forward" }
      - { name: status, type: enum, source: system, description: "ACTIVE | TERMINATED" }

  - name: FeeSchedule
    parent: null
    common_fields: true
    fields:
      - { name: tier, type: enum, source: input, description: "PREMIER | PPO | OUT_OF_NETWORK — which network tier this schedule applies to" }
      - { name: effective_from, type: datetime, source: input, description: "Schedule applies to claims with service_date >= this timestamp" }
      - { name: effective_to, type: datetime, source: input, description: "Exclusive end of applicability; null means open-ended" }
      - { name: status, type: enum, source: system, description: "PENDING | ACTIVE | SUPERSEDED | RETIRED" }

  - name: FeeScheduleEntry
    parent: FeeSchedule
    common_fields: true
    fields:
      - { name: fee_schedule_id, type: string, source: system, description: "FK -> FeeSchedule.id; owning schedule" }
      - { name: cdt_code, type: string, source: input, description: "CDT procedure code (e.g. D0120, D2740)" }
      - { name: allowed_cents, type: integer, source: input, description: "Allowed amount for this code under this schedule, in cents" }
      - { name: category, type: enum, source: input, description: "PREVENTIVE | BASIC | MAJOR — drives coinsurance bucket and waiting period" }
      - { name: requires_attachment, type: boolean, source: input, description: "True if claim lines for this code must carry at least one ClaimAttachment" }
      - { name: abp_alternative_cdt, type: string, source: input, description: "When non-empty and plan.abp_enabled, ABP re-prices the line at the alternate code's allowed amount; patient pays the difference" }

  - name: Subscriber
    parent: Plan
    common_fields: true
    fields:
      - { name: plan_id, type: string, source: system, description: "FK -> Plan.id; owning plan" }
      - { name: member_id, type: string, source: input, description: "Unique external member identifier (e.g. subscriber SSN-derived id)" }
      - { name: full_name, type: string, source: input, description: "Subscriber full legal name" }
      - { name: date_of_birth, type: datetime, source: input, description: "Subscriber DOB (used for age-limitation rules)" }
      - { name: effective_date, type: datetime, source: input, description: "Coverage effective date — waiting periods, missing-tooth clause, COB primacy all anchor here" }
      - { name: cob_priority, type: enum, source: input, description: "PRIMARY | SECONDARY | NONE — declares this plan's position in dual coverage" }
      - { name: other_plan_external_id, type: string, source: input, description: "Opaque identifier of the OTHER carrier's plan when cob_priority=SECONDARY; empty otherwise" }
      - { name: status, type: enum, source: system, description: "ACTIVE | TERMINATED" }

  - name: Dependent
    parent: Subscriber
    common_fields: true
    fields:
      - { name: subscriber_id, type: string, source: system, description: "FK -> Subscriber.id; owning subscriber" }
      - { name: full_name, type: string, source: input, description: "Dependent legal name" }
      - { name: date_of_birth, type: datetime, source: input, description: "Dependent DOB — drives age limitation for sealants/fluoride" }
      - { name: relationship, type: enum, source: input, description: "SPOUSE | CHILD | DOMESTIC_PARTNER" }
      - { name: status, type: enum, source: system, description: "ACTIVE | TERMINATED" }

  - name: LimitationRule
    parent: Plan
    common_fields: true
    fields:
      - { name: plan_id, type: string, source: system, description: "FK -> Plan.id; owning plan" }
      - { name: cdt_code, type: string, source: input, description: "Code this rule governs (may be a category wildcard like 'D1*' for radiograph series)" }
      - { name: rule_kind, type: enum, source: input, description: "FREQUENCY | AGE_MAX | AGE_MIN | REPLACEMENT_INTERVAL | MISSING_TOOTH" }
      - { name: window_months, type: integer, source: input, description: "Rolling window in months over which frequency/replacement counts apply (0 = not used by this rule_kind)" }
      - { name: max_occurrences, type: integer, source: input, description: "Max allowed occurrences within window_months (0 = not used by this rule_kind)" }
      - { name: age_years_min, type: integer, source: input, description: "For AGE_MIN: minimum age in whole years as of service_date (0 = not used)" }
      - { name: age_years_max, type: integer, source: input, description: "For AGE_MAX: maximum age in whole years as of service_date (0 = not used)" }
      - { name: status, type: enum, source: system, description: "ACTIVE | RETIRED" }

  - name: Predetermination
    parent: Subscriber
    common_fields: true
    fields:
      - { name: subscriber_id, type: string, source: system, description: "FK -> Subscriber.id; whose benefit is being estimated" }
      - { name: dependent_id, type: string, source: input, description: "FK -> Dependent.id; null when the patient is the subscriber" }
      - { name: provider_id, type: string, source: input, description: "FK -> Provider.id; rendering provider (drives tier lookup)" }
      - { name: cdt_code, type: string, source: input, description: "Code under review" }
      - { name: submitted_amount_cents, type: integer, source: input, description: "Provider's billed charge for this procedure" }
      - { name: planned_service_date, type: datetime, source: input, description: "Planned treatment date — used to resolve which FeeSchedule applies" }
      - { name: clinical_reviewer_id, type: string, source: input, description: "Opaque id of the ClinicalReviewer once assigned; empty until UNDER_REVIEW" }
      - { name: estimated_allowed_cents, type: integer, source: computed, description: "Allowed amount the plan WOULD pay against, per the schedule active at planned_service_date" }
      - { name: estimated_plan_pay_cents, type: integer, source: computed, description: "Plan share after coinsurance, deductible and remaining annual maximum" }
      - { name: estimated_patient_pay_cents, type: integer, source: computed, description: "Member responsibility = estimated_allowed - estimated_plan_pay, plus ABP uplift when applicable" }
      - { name: abp_applied, type: boolean, source: computed, description: "True when ABP re-priced this predetermination" }
      - { name: version_pin_fee_schedule_id, type: string, source: system, description: "FK -> FeeSchedule.id; the schedule version PINNED at approval — later schedule changes do NOT re-price this predetermination" }
      - { name: expires_on, type: datetime, source: system, description: "Approval + PREDETERMINATION_VALIDITY_DAYS; an expired APPROVED predetermination no longer pins pricing for matching claims" }
      - { name: status, type: enum, source: system, description: "SUBMITTED | UNDER_REVIEW | APPROVED | DENIED | WITHDRAWN | EXPIRED" }

  - name: Claim
    parent: Subscriber
    common_fields: true
    fields:
      - { name: subscriber_id, type: string, source: system, description: "FK -> Subscriber.id; primary enrollee whose plan adjudicates" }
      - { name: dependent_id, type: string, source: input, description: "FK -> Dependent.id; null when patient is subscriber" }
      - { name: provider_id, type: string, source: input, description: "FK -> Provider.id; rendering provider" }
      - { name: predetermination_id, type: string, source: input, description: "FK -> Predetermination.id; null unless a matching APPROVED predetermination pins pricing" }
      - { name: service_date, type: datetime, source: input, description: "Date of service — anchors waiting-period, age, frequency, schedule-resolution" }
      - { name: received_date, type: datetime, source: input, description: "Date claim was received; used to reject stale claims (> CLAIM_TIMELY_FILING_DAYS after service)" }
      - { name: total_submitted_cents, type: integer, source: computed, description: "Sum of ClaimLine.submitted_amount_cents across this claim's lines" }
      - { name: total_allowed_cents, type: integer, source: computed, description: "Sum of ClaimLine.allowed_cents after pricing each line" }
      - { name: total_plan_pay_cents, type: integer, source: computed, description: "Sum of ClaimLine.plan_pay_cents after adjudication" }
      - { name: total_patient_pay_cents, type: integer, source: computed, description: "Sum of ClaimLine.patient_pay_cents" }
      - { name: cob_other_plan_paid_cents, type: integer, source: input, default: 0, description: "When subscriber.cob_priority=SECONDARY, what the primary carrier already paid (cents); 0 otherwise" }
      - { name: cob_secondary_payment_cents, type: integer, source: computed, description: "When this plan is SECONDARY: min(remaining patient responsibility after primary, what this plan would have paid as primary). 0 otherwise." }
      - { name: tooth_missing_prior_to_coverage, type: object, source: input, description: "Map of tooth_number -> boolean attesting the tooth was missing before the member's effective_date; consumed by the MISSING_TOOTH limitation rule" }
      - { name: status, type: enum, source: system, description: "RECEIVED | PENDED_ATTACHMENTS | PENDED_REVIEW | ADJUDICATED | PAID | DENIED | VOID" }

  - name: ClaimLine
    parent: Claim
    common_fields: true
    fields:
      - { name: claim_id, type: string, source: system, description: "FK -> Claim.id; owning claim" }
      - { name: line_number, type: integer, source: input, description: "1-based line sequence within the claim; unique per claim" }
      - { name: cdt_code, type: string, source: input, description: "CDT code being billed" }
      - { name: tooth_number, type: string, source: input, description: "FDI/Universal tooth number when code is tooth-specific; empty for non-tooth codes" }
      - { name: submitted_amount_cents, type: integer, source: input, description: "Provider's billed charge on this line" }
      - { name: category, type: enum, source: computed, description: "PREVENTIVE | BASIC | MAJOR — copied from FeeScheduleEntry at pricing time" }
      - { name: allowed_cents, type: integer, source: computed, description: "Allowed amount for this line per the resolved fee schedule (post-ABP if applicable)" }
      - { name: abp_applied, type: boolean, source: computed, description: "True when ABP dropped this line to the alternate code's allowed amount" }
      - { name: abp_patient_difference_cents, type: integer, source: computed, description: "When ABP applied: submitted-based original allowance minus ABP allowance; patient owes this in addition to normal cost share" }
      - { name: deductible_applied_cents, type: integer, source: computed, description: "Portion of allowed_cents charged to the member's deductible" }
      - { name: coinsurance_plan_cents, type: integer, source: computed, description: "Plan share of allowed after deductible, BEFORE annual-maximum cap" }
      - { name: plan_pay_cents, type: integer, source: computed, description: "Final plan payment on this line after deductible + coinsurance + annual max cap + COB reduction" }
      - { name: patient_pay_cents, type: integer, source: computed, description: "Member responsibility = allowed - plan_pay, plus ABP difference" }
      - { name: denial_code, type: enum, source: system, description: "NULL | WAITING_PERIOD | FREQUENCY | AGE_LIMIT | MISSING_TOOTH | TIMELY_FILING | ATTACHMENT_MISSING | NO_COVERAGE — set when line denied" }
      - { name: status, type: enum, source: system, description: "PENDING | PRICED | PAYABLE | DENIED" }

  - name: ClaimAttachment
    parent: Claim
    common_fields: false
    fields:
      - { name: claim_id, type: string, source: system, description: "FK -> Claim.id; owning claim" }
      - { name: claim_line_id, type: string, source: input, description: "FK -> ClaimLine.id; the line this attachment supports (must belong to claim_id)" }
      - { name: attachment_kind, type: enum, source: input, description: "RADIOGRAPH | NARRATIVE | PERIO_CHART | PHOTO" }
      - { name: blob_ref, type: string, source: input, description: "Opaque storage reference (tests use arbitrary strings)" }
      - { name: transmitted_on, type: datetime, source: system, description: "Server-stamped upload time" }

  - name: BenefitAccumulator
    parent: Subscriber
    common_fields: true
    fields:
      - { name: subscriber_id, type: string, source: system, description: "FK -> Subscriber.id; whose accumulator" }
      - { name: dependent_id, type: string, source: system, description: "FK -> Dependent.id; null when accumulating for the subscriber. Deductible and annual max track per-PATIENT." }
      - { name: plan_year_key, type: string, source: system, description: "Plan-year bucket key, e.g. '2026-2027' derived from plan.plan_year_start_month and service_date" }
      - { name: deductible_met_cents, type: integer, source: computed, description: "Cumulative deductible absorbed in this plan year" }
      - { name: annual_max_used_cents, type: integer, source: computed, description: "Cumulative plan payments in this plan year against the annual maximum" }
      - { name: version, type: integer, source: system, description: "OCC version — every adjudication that touches the accumulator bumps it" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Plan
    initial_state: DRAFT
    terminal_states: [RETIRED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /dental/plans/{id}/activate"
        actor: PlanAdmin
        preconditions:
          - "All monetary and coinsurance fields must be present and non-negative"
          - "No other ACTIVE plan with the same plan_code"
        side_effects:
          - "Plan becomes referenceable by Subscriber creation"

      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /dental/plans/{id}/suspend"
        actor: PlanAdmin
        preconditions:
          - "Plan is ACTIVE"
        side_effects:
          - "New Subscriber creation blocked for this plan (ERR_PLAN_NOT_ACTIVE)"
          - "Existing claims in ADJUDICATED but not PAID remain payable"

      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /dental/plans/{id}/activate"
        actor: PlanAdmin
        preconditions: []
        side_effects: []

      - from: ACTIVE
        to: RETIRED
        trigger: "POST /dental/plans/{id}/retire"
        actor: PlanAdmin
        preconditions:
          - "No Subscriber with status=ACTIVE on this plan"
        side_effects:
          - "Plan becomes read-only; existing claims can still transition to PAID/VOID"

  - entity: Provider
    initial_state: ACTIVE
    terminal_states: [TERMINATED]
    transitions:
      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /dental/providers/{id}/terminate"
        actor: NetworkManager
        preconditions:
          - "Provider has no Predetermination in UNDER_REVIEW and no Claim in PENDED_REVIEW"
        side_effects:
          - "Future claims with this provider_id rejected with ERR_PROVIDER_TERMINATED"

  - entity: FeeSchedule
    initial_state: PENDING
    terminal_states: [SUPERSEDED, RETIRED]
    transitions:
      - from: PENDING
        to: ACTIVE
        trigger: "POST /dental/fee-schedules/{id}/activate"
        actor: NetworkManager
        preconditions:
          - "If another ACTIVE FeeSchedule for the same tier has a window overlapping the new one AND existing.effective_from > new.effective_from (retroactive insertion), reject ERR_SCHEDULE_OVERLAP"
          - "If another ACTIVE FeeSchedule for the same tier overlaps with existing.effective_from <= new.effective_from: allowed — the existing schedule's window is truncated"
        side_effects:
          - "Each overlapping ACTIVE FeeSchedule for the same tier with effective_from <= new.effective_from has its effective_to set to new.effective_from (window truncated; status stays ACTIVE) — this mutation is cascade link 1"
          - "That truncation (or the new activation when no prior schedule exists) triggers recompute of every Predetermination in UNDER_REVIEW whose rendering provider's tier matches: estimated_* fields refresh against the schedule now governing planned_service_date — cascade link 2"
          - "Each recomputed Predetermination has version incremented — cascade link 3"

      - from: ACTIVE
        to: SUPERSEDED
        trigger: "POST /dental/fee-schedules/{id}/retire"
        actor: NetworkManager
        preconditions: []
        side_effects:
          - "Schedule stops being used for newly priced claims"
          - "Predeterminations APPROVED with version_pin_fee_schedule_id == this schedule keep their pinned pricing (pin survives supersession)"
        note: "SUPERSEDED is reached via retire; window truncation on successor activation does NOT change status"

      - from: PENDING
        to: RETIRED
        trigger: "POST /dental/fee-schedules/{id}/retire"
        actor: NetworkManager
        preconditions: []
        side_effects: []

      - from: ACTIVE
        to: RETIRED
        trigger: "POST /dental/fee-schedules/{id}/retire"
        actor: NetworkManager
        preconditions:
          - "No Claim in PENDED_ATTACHMENTS or PENDED_REVIEW was priced against this schedule"
        side_effects: []

  - entity: Subscriber
    initial_state: ACTIVE
    terminal_states: [TERMINATED]
    transitions:
      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /dental/subscribers/{id}/terminate"
        actor: PlanAdmin
        preconditions:
          - "No Claim in RECEIVED/PENDED_ATTACHMENTS/PENDED_REVIEW/ADJUDICATED (must be PAID, DENIED, or VOID first)"
        side_effects:
          - "All Dependents of this subscriber transition ACTIVE → TERMINATED"
          - "All Predeterminations of this subscriber in SUBMITTED or UNDER_REVIEW transition to WITHDRAWN"

  - entity: Predetermination
    initial_state: SUBMITTED
    terminal_states: [APPROVED, DENIED, WITHDRAWN, EXPIRED]
    transitions:
      - from: SUBMITTED
        to: UNDER_REVIEW
        trigger: "POST /dental/predeterminations/{id}/assign"
        actor: ClinicalReviewer
        preconditions:
          - "clinical_reviewer_id payload must equal X-User-ID (segregation of duties: reviewer self-assigns)"
          - "Subscriber.status == ACTIVE"
        side_effects:
          - "Predetermination.clinical_reviewer_id = X-User-ID"
          - "Recompute estimated_allowed_cents/estimated_plan_pay_cents/estimated_patient_pay_cents using the FeeSchedule ACTIVE for the rendering provider's tier at planned_service_date"

      - from: UNDER_REVIEW
        to: APPROVED
        trigger: "POST /dental/predeterminations/{id}/approve"
        actor: ClinicalReviewer
        preconditions:
          - "X-User-ID must equal Predetermination.clinical_reviewer_id"
          - "expected_predetermination_version must match current version (OCC)"
          - "estimated_plan_pay_cents must not exceed the plan's remaining annual maximum for the patient (ERR_ANNUAL_MAX_EXCEEDED)"
        side_effects:
          - "Pin version_pin_fee_schedule_id to the FeeSchedule used for the final estimate"
          - "Set expires_on = logical clock + PREDETERMINATION_VALIDITY_DAYS"
          - "Lock estimated_* fields"

      - from: UNDER_REVIEW
        to: DENIED
        trigger: "POST /dental/predeterminations/{id}/deny"
        actor: ClinicalReviewer
        preconditions:
          - "X-User-ID must equal Predetermination.clinical_reviewer_id"
        side_effects: []

      - from: UNDER_REVIEW
        to: UNDER_REVIEW
        trigger: "POST /dental/predeterminations/{id}/reassign"
        actor: ClinicalReviewer
        preconditions:
          - "New reviewer id must differ from current clinical_reviewer_id"
        side_effects:
          - "Recompute estimated_* against currently ACTIVE schedule (do not pin yet)"

      - from: SUBMITTED
        to: WITHDRAWN
        trigger: "POST /dental/predeterminations/{id}/withdraw"
        actor: Member
        preconditions:
          - "X-User-ID == subscriber_id OR X-User-ID is the subscriber that owns this predetermination"
        side_effects: []

      - from: UNDER_REVIEW
        to: WITHDRAWN
        trigger: "POST /dental/predeterminations/{id}/withdraw"
        actor: Member
        preconditions: []
        side_effects: []

      - from: APPROVED
        to: EXPIRED
        trigger: "system (lazy transition on read or when a claim references this predetermination after expires_on)"
        actor: system
        preconditions:
          - "logical clock > expires_on"
        side_effects:
          - "Pricing pin released — claims referencing this predetermination_id now resolve the schedule by service_date normally"

  - entity: Claim
    initial_state: RECEIVED
    terminal_states: [PAID, DENIED, VOID]
    transitions:
      - from: RECEIVED
        to: PENDED_ATTACHMENTS
        trigger: "system (auto during POST /dental/claims when any line's FeeScheduleEntry.requires_attachment=true and no matching ClaimAttachment exists)"
        actor: system
        preconditions: []
        side_effects:
          - "ClaimLines for attachment-requiring codes stay in PENDING"

      - from: RECEIVED
        to: PENDED_REVIEW
        trigger: "system (auto during POST /dental/claims when subscriber.cob_priority == SECONDARY)"
        actor: system
        preconditions: []
        side_effects: []

      - from: RECEIVED
        to: ADJUDICATED
        trigger: "system (auto during POST /dental/claims when neither attachment-pend nor COB-pend applies)"
        actor: system
        preconditions: []
        side_effects:
          - "Run the per-line adjudication pipeline: price → ABP → waiting period → frequency/age/replacement/missing-tooth → deductible → coinsurance → annual max cap → COB"
          - "Each ClaimLine transitions PENDING → PAYABLE or PENDING → DENIED with denial_code set"
          - "BenefitAccumulator for the patient/plan_year is created or updated: deductible_met_cents += sum(line.deductible_applied_cents); annual_max_used_cents += sum(line.plan_pay_cents); version increments"

      - from: PENDED_ATTACHMENTS
        to: PENDED_REVIEW
        trigger: "POST /dental/claims/{id}/attachments (when this is the LAST missing attachment AND subscriber is SECONDARY)"
        actor: Provider
        preconditions:
          - "Claim currently PENDED_ATTACHMENTS"
          - "Subscriber.cob_priority == SECONDARY"
        side_effects:
          - "Re-evaluate attachment completeness — if now complete, transition"

      - from: PENDED_ATTACHMENTS
        to: ADJUDICATED
        trigger: "POST /dental/claims/{id}/attachments (when this is the LAST missing attachment AND subscriber is PRIMARY or NONE)"
        actor: Provider
        preconditions:
          - "Claim currently PENDED_ATTACHMENTS"
          - "Subscriber.cob_priority != SECONDARY"
        side_effects:
          - "Run the full adjudication pipeline as in RECEIVED → ADJUDICATED"

      - from: PENDED_REVIEW
        to: ADJUDICATED
        trigger: "POST /dental/claims/{id}/cob-confirm"
        actor: ClaimsExaminer
        preconditions:
          - "Claim is PENDED_REVIEW"
          - "cob_other_plan_paid_cents on the claim has been populated (>= 0)"
        side_effects:
          - "Run the adjudication pipeline including the COB waterfall"

      - from: ADJUDICATED
        to: PAID
        trigger: "POST /dental/claims/{id}/pay"
        actor: ClaimsExaminer
        preconditions:
          - "All ClaimLines are in PAYABLE or DENIED (none in PENDING)"
          - "At least one ClaimLine is PAYABLE"
        side_effects:
          - "Claim totals become immutable; BenefitAccumulator update is finalized"

      - from: ADJUDICATED
        to: DENIED
        trigger: "system (auto when all ClaimLines are DENIED after adjudication)"
        actor: system
        preconditions: []
        side_effects:
          - "No accumulator changes for this claim"

      - from: ADJUDICATED
        to: VOID
        trigger: "POST /dental/claims/{id}/void"
        actor: ClaimsExaminer
        preconditions:
          - "Claim is ADJUDICATED (not yet PAID)"
        side_effects:
          - "Reverse BenefitAccumulator: deductible_met_cents -= sum(line.deductible_applied_cents); annual_max_used_cents -= sum(line.plan_pay_cents); accumulator.version increments"

      - from: PAID
        to: VOID
        trigger: "POST /dental/claims/{id}/void"
        actor: ClaimsExaminer
        preconditions:
          - "Logical clock <= Claim.updated_at + VOID_WINDOW_DAYS (= 30)"
        side_effects:
          - "Reverse BenefitAccumulator as in ADJUDICATED → VOID"
        note: "Voiding a PAID claim is permitted only within 30 days of payment"

  - entity: ClaimLine
    initial_state: PENDING
    terminal_states: [PAYABLE, DENIED]
    transitions:
      - from: PENDING
        to: PRICED
        trigger: "system (during claim adjudication, step 1)"
        actor: system
        preconditions: []
        side_effects:
          - "allowed_cents set per schedule + ABP"
        note: "PRICED is a transient sub-state during adjudication; lines leave PRICED within the same adjudication pass."

      - from: PRICED
        to: PAYABLE
        trigger: "system (during claim adjudication, after limitation & accumulator checks pass)"
        actor: system
        preconditions: []
        side_effects:
          - "plan_pay_cents / patient_pay_cents / deductible_applied_cents committed"

      - from: PRICED
        to: DENIED
        trigger: "system (during claim adjudication, when any limitation rule fires)"
        actor: system
        preconditions: []
        side_effects:
          - "denial_code set (WAITING_PERIOD | FREQUENCY | AGE_LIMIT | MISSING_TOOTH | TIMELY_FILING | ATTACHMENT_MISSING | NO_COVERAGE)"
          - "plan_pay_cents = 0, patient_pay_cents = submitted_amount_cents"

  - entity: Dependent
    initial_state: ACTIVE
    terminal_states: [TERMINATED]
    transitions:
      - from: ACTIVE
        to: TERMINATED
        trigger: "system (cascade from Subscriber terminate) OR POST /dental/dependents/{id}/terminate"
        actor: PlanAdmin
        preconditions: []
        side_effects: []

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: predet-approve-stale-version
    parent_entity: Predetermination
    write_endpoint: "POST /dental/predeterminations/{id}/approve"
    occ_field: "expected_predetermination_version"
    description: |
      Approving a Predetermination whose version has advanced since the client
      last observed it is rejected. Captures the case where a reassign or
      recompute has legitimately refreshed the estimate and the current
      approver's view of the estimate is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: claim-void-stale-version
    parent_entity: Claim
    write_endpoint: "POST /dental/claims/{id}/void"
    occ_field: "expected_claim_version"
    description: |
      Voiding a Claim whose version has advanced since the client last
      observed it is rejected. Captures the case where another examiner has
      just transitioned the claim (e.g. PAID) since the voiding client last
      read it.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: allowed_amount_resolution
    description: "Pick the FeeScheduleEntry that prices a ClaimLine / Predetermination"
    trigger: "step 1 of claim adjudication AND predetermination assign/reassign"
    algorithm: forward_looking
    formula: |
      tier = provider.tier  # at the moment of pricing
      schedule = the FeeSchedule s where s.tier == tier
                                  AND s.status == ACTIVE
                                  AND s.effective_from <= anchor_date
                                  AND (s.effective_to IS NULL OR anchor_date < s.effective_to)
      anchor_date = Claim.service_date for claims; Predetermination.planned_service_date for predeterminations.
      IF claim.predetermination_id references an APPROVED, non-EXPIRED Predetermination:
          schedule_override = Predetermination.version_pin_fee_schedule_id
          schedule = the FeeSchedule with id == schedule_override (regardless of current ACTIVE)
      entry = the FeeScheduleEntry e where e.fee_schedule_id == schedule.id AND e.cdt_code == line.cdt_code
      base_allowed = min(line.submitted_amount_cents, entry.allowed_cents)
      IF plan.abp_enabled AND entry.abp_alternative_cdt != "":
          alt_entry = the FeeScheduleEntry in schedule with cdt_code == entry.abp_alternative_cdt
          abp_allowed = min(line.submitted_amount_cents, alt_entry.allowed_cents)
          IF abp_allowed < base_allowed:
              abp_applied = true
              abp_patient_difference_cents = base_allowed - abp_allowed
              allowed_cents = abp_allowed
          ELSE:
              allowed_cents = base_allowed
      ELSE:
          allowed_cents = base_allowed
      If no ACTIVE schedule contains the anchor for the provider's tier, claim submission
      fails with ERR_NO_FEE_SCHEDULE (predetermination assign fails the same way).
    input_set: "Provider, ACTIVE FeeSchedules for that tier, FeeScheduleEntry rows matching cdt_code, optional pinning Predetermination"
    constants:
      ABP_DISABLED_DIFFERENCE: 0
    precision: "integer cents, no rounding"
    variants:
      - name: pinned_by_predetermination
        when: "claim.predetermination_id is set and the Predetermination is APPROVED and not EXPIRED"
        difference: "Uses Predetermination.version_pin_fee_schedule_id regardless of which schedule is currently ACTIVE; produces a different allowed amount whenever the schedule has been superseded since approval"
      - name: free_by_service_date
        when: "no pin applies"
        difference: "Resolves schedule by service_date lookup at the time of adjudication; produces the schedule-current allowed amount"

  - name: patient_cost_share
    description: "Per-line member responsibility after deductible, coinsurance, annual max"
    trigger: "step 6 of claim adjudication AND predetermination estimate recompute"
    algorithm: tiered_pricing
    formula: |
      # Per ClaimLine with allowed_cents priced and category resolved.
      # accumulator = BenefitAccumulator for (patient, plan_year_key(service_date))
      # Evaluated in CLAIM LINE ORDER (line_number ASC) — order matters because
      # the deductible and annual max draw down sequentially.
      bucket_pct = plan.preventive_coinsurance_pct / basic_coinsurance_pct / major_coinsurance_pct
                   chosen by line.category
      # (a) DEDUCTIBLE
      IF line.category == PREVENTIVE AND plan.deductible_applies_preventive == false:
          line_deductible = 0
      ELSE:
          deductible_remaining = plan.deductible_cents - accumulator.deductible_met_cents
          line_deductible = min(allowed_cents, max(0, deductible_remaining))
      # (b) COINSURANCE
      coinsurance_base = allowed_cents - line_deductible
      coinsurance_plan_cents = floor(coinsurance_base * bucket_pct / 100)   # floor, NOT round
      # (c) ANNUAL MAX
      max_remaining = plan.annual_maximum_cents - accumulator.annual_max_used_cents
      plan_pay_before_cob = min(coinsurance_plan_cents, max(0, max_remaining))
      # (d) COB
      IF subscriber.cob_priority == SECONDARY:
          primary_paid = claim.cob_other_plan_paid_cents
          secondary_cap = allowed_cents - primary_paid - line_deductible
          plan_pay_cents = max(0, min(plan_pay_before_cob, secondary_cap))
          cob_secondary_payment_cents = plan_pay_cents
      ELSE:
          plan_pay_cents = plan_pay_before_cob
          cob_secondary_payment_cents = 0
      # (e) PATIENT
      patient_pay_cents = allowed_cents - plan_pay_cents + abp_patient_difference_cents
      # accumulator updates (per line, in order)
      accumulator.deductible_met_cents  += line_deductible
      accumulator.annual_max_used_cents += plan_pay_cents
      # NOTE: in the predetermination variant the accumulator is NOT mutated —
      # estimates only.
    input_set: "Plan, Subscriber (cob_priority), Claim.cob_other_plan_paid_cents, ClaimLine list sorted by line_number ASC, BenefitAccumulator for the patient"
    constants:
      COINSURANCE_ROUNDING: floor
    precision: "integer cents; coinsurance uses floor, not round_half_up"
    variants:
      - name: estimate_variant
        when: "predetermination recompute"
        difference: "Same arithmetic, but the accumulator is read-only — the estimate is what WOULD be paid given the CURRENT accumulator, and no accumulator mutation happens"
      - name: adjudication_variant
        when: "claim adjudication"
        difference: "Mutates accumulator in line_number ASC order; later lines on the same claim observe earlier lines' draws"

  - name: annual_max_accumulator
    description: "Plan-year bucketed running totals with VOID compensation"
    trigger: "claim adjudication (increment) AND claim void (decrement)"
    algorithm: aggregation
    formula: |
      plan_year_key(service_date, plan):
          anchor_month = plan.plan_year_start_month
          year_a = service_date.year  IF service_date.month >= anchor_month ELSE service_date.year - 1
          year_b = year_a + 1
          return f"{year_a}-{year_b}"
      accumulator key = (subscriber_id, dependent_id_or_null, plan_year_key)
      IF no BenefitAccumulator exists for the key: create with deductible_met_cents=0, annual_max_used_cents=0, version=1
      ADJUDICATION: deductible_met_cents += sum(line.deductible_applied_cents) for PAYABLE lines
                    annual_max_used_cents  += sum(line.plan_pay_cents) for PAYABLE lines
      VOID:         deductible_met_cents -= sum(line.deductible_applied_cents) for PAYABLE lines on the voided claim
                    annual_max_used_cents  -= sum(line.plan_pay_cents) for PAYABLE lines on the voided claim
      INVARIANT: after every transition, 0 <= deductible_met_cents <= plan.deductible_cents
                                          0 <= annual_max_used_cents  <= plan.annual_maximum_cents
    input_set: "BenefitAccumulator keyed by (subscriber, dependent, plan_year), ClaimLine rows in PAYABLE on this claim"
    constants: {}
    precision: "integer cents"

  - name: limitation_rule_evaluation
    description: "FREQUENCY / AGE_MAX / AGE_MIN / REPLACEMENT_INTERVAL / MISSING_TOOTH per line"
    trigger: "step 4 of claim adjudication AND predetermination approve"
    algorithm: chronological
    formula: |
      For each LimitationRule on the plan matching line.cdt_code (exact match OR wildcard like 'D1*'):
        IF rule_kind == FREQUENCY:
            # count prior PAID or PAYABLE claim lines for the SAME patient with the SAME cdt_code
            # whose service_date is in [service_date - rule.window_months, service_date]
            window_start = service_date - rule.window_months months
            prior = count of ClaimLine L where L.patient == line.patient
                                          AND L.cdt_code == line.cdt_code
                                          AND L.status IN {PAYABLE}            # only paid-history counts
                                          AND L.claim.status == PAID
                                          AND window_start <= L.claim.service_date <= service_date
            IF prior + 1 > rule.max_occurrences: deny with FREQUENCY
        IF rule_kind == AGE_MAX:
            age = whole_years_between(patient.date_of_birth, service_date)
            IF age > rule.age_years_max: deny with AGE_LIMIT
        IF rule_kind == AGE_MIN:
            age = whole_years_between(patient.date_of_birth, service_date)
            IF age < rule.age_years_min: deny with AGE_LIMIT
        IF rule_kind == REPLACEMENT_INTERVAL:
            prior = most recent PAID claim line for the SAME patient and SAME tooth_number
                    with a code in the same MAJOR category, ordered by service_date DESC
                    tie-break created_at ASC
            IF prior exists AND service_date - prior.service_date < rule.window_months months:
                deny with FREQUENCY
        IF rule_kind == MISSING_TOOTH:
            IF plan.missing_tooth_clause_active AND line.tooth_number non-empty:
                # tooth lost before coverage: heuristic — member attests via Claim payload field
                # tooth_missing_prior_to_coverage (boolean) on the line's parent Claim
                IF claim.tooth_missing_prior_to_coverage[tooth_number] == true:
                    deny with MISSING_TOOTH
      # AGE computations use whole years — a member is 17 until their 18th birthday.
      # Frequency windows are INCLUSIVE on both ends.
      # When multiple rules fire on one line, the FIRST rule encountered in plan-declared
      # LimitationRule.created_at ASC order wins (sets denial_code).
    input_set: "Plan LimitationRules, patient's PAID claim history, plan.missing_tooth_clause_active"
    constants: {}
    precision: "calendar months; whole years; no rounding"

  - name: waiting_period_gate
    description: "Per-category waiting period from subscriber.effective_date"
    trigger: "step 3 of claim adjudication AND predetermination approve precondition"
    algorithm: threshold
    formula: |
      wait_months = plan.basic_waiting_months IF line.category == BASIC
                    plan.major_waiting_months IF line.category == MAJOR
                    0 IF line.category == PREVENTIVE
      earliest_eligible_date = subscriber.effective_date + wait_months calendar months
      # Boundary: a service ON earliest_eligible_date is ELIGIBLE (>=, not >).
      IF service_date < earliest_eligible_date: deny with WAITING_PERIOD
    input_set: "Subscriber.effective_date, Plan waiting fields, line.category, line.service_date"
    constants: {}
    precision: "calendar month arithmetic; boundary is INCLUSIVE"

  - name: cob_waterfall
    description: "Secondary-carrier payment under dual coverage"
    trigger: "step 7 of claim adjudication when subscriber.cob_priority == SECONDARY"
    algorithm: waterfall_allocation
    formula: |
      # Compute what this plan would have paid as primary (per patient_cost_share).
      hypothetical_primary_pay = result of patient_cost_share with cob_priority treated as PRIMARY
      # Secondary payment is bounded above by the patient responsibility REMAINING
      # after the primary carrier paid.
      patient_resp_after_primary = allowed_cents - claim.cob_other_plan_paid_cents
      plan_pay_cents = max(0, min(hypothetical_primary_pay, patient_resp_after_primary))
      # Boundary: if primary paid MORE than this plan's allowed amount, plan_pay_cents == 0.
      # Boundary: if primary paid 0, plan_pay_cents == hypothetical_primary_pay.
    input_set: "ClaimLine priced amounts, claim.cob_other_plan_paid_cents"
    constants: {}
    precision: "integer cents"

  - name: predetermination_estimate
    description: "Forward-looking estimate at approve time, with pin-on-approve"
    trigger: "Predetermination UNDER_REVIEW → APPROVED AND assign-time recompute"
    algorithm: forward_looking
    formula: |
      # Estimate mirrors patient_cost_share(adjudication_variant) BUT:
      #   - accumulator is read-only (no mutation)
      #   - deductible_met_cents/annual_max_used_cents are read AT THIS MOMENT
      #   - waiting period is evaluated against planned_service_date
      #   - limitation rules evaluate against planned_service_date and CURRENT paid history
      # At APPROVE time, version_pin_fee_schedule_id is locked.
      # estimate_plan_pay uses the plan_year containing planned_service_date.
    input_set: "Predetermination, Subscriber, Provider, ACTIVE FeeSchedule at planned_service_date, current accumulator"
    constants:
      PREDETERMINATION_VALIDITY_DAYS: 90
    precision: "integer cents"
    variants:
      - name: estimate_at_assign
        when: "Predetermination transitions SUBMITTED → UNDER_REVIEW"
        difference: "Uses the FeeSchedule ACTIVE right now; not yet pinned"
      - name: estimate_at_approve
        when: "Predetermination transitions UNDER_REVIEW → APPROVED"
        difference: "Re-runs the estimate against CURRENT state and pins the schedule id; the pinned id is what matching claims will use even after the schedule is superseded"

# =============================================================================
# §1.4 Validation Rules Table (Ordered by Priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are present and X-User-Role is a known role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"

  - priority: 2
    category: auth
    check: "X-User-Role is permitted to call this endpoint per §1.7"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all"

  - priority: 2.5
    category: auth
    check: "Ownership: Member callers must act on their own subscriber_id (X-User-ID == Subscriber.id or the owning subscriber of dependent_id); Provider callers must file claims/predeterminations/attachments with provider_id == X-User-ID"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: ["POST /dental/predeterminations", "POST /dental/claims", "POST /dental/claims/{id}/attachments", "POST /dental/predeterminations/{id}/withdraw"]

  - priority: 3
    category: existence
    check: "Path-parameter ids resolve to an existing entity of the path's type; each entity type returns its dedicated 404 code (ERR_PLAN_NOT_FOUND for /dental/plans/{id}, ERR_PROVIDER_NOT_FOUND for /dental/providers/{id}, ERR_SUBSCRIBER_NOT_FOUND for /dental/subscribers/{id}, ERR_DEPENDENT_NOT_FOUND for /dental/dependents/{id}, ERR_CLAIM_NOT_FOUND for /dental/claims/{id}, ERR_PREDETERMINATION_NOT_FOUND for /dental/predeterminations/{id}, ERR_FEE_SCHEDULE_NOT_FOUND for /dental/fee-schedules/{id})"
    error_id: ERR_PLAN_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints with path ids"

  - priority: 4
    category: existence
    check: "Body FK references (plan_id, subscriber_id, dependent_id, provider_id, predetermination_id, claim_line_id in payloads) resolve to existing entities"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "endpoints taking FK ids in the request body"

  - priority: 4.5
    category: existence
    check: "Required request fields are present with the correct types and enum membership before any state or business rule runs"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all"

  - priority: 5
    category: state
    check: "Target entity is in a state from which the requested transition is declared in §1.2"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all action endpoints"

  - priority: 6
    category: state
    check: "Plan must be ACTIVE for subscriber creation and claim submission"
    error_id: ERR_PLAN_NOT_ACTIVE
    http_status: 409
    applies_to: ["POST /dental/subscribers", "POST /dental/claims"]

  - priority: 7
    category: state
    check: "Provider must be ACTIVE (not TERMINATED) for new claims and predeterminations"
    error_id: ERR_PROVIDER_TERMINATED
    http_status: 409
    applies_to: ["POST /dental/claims", "POST /dental/predeterminations"]

  - priority: 8
    category: business_temporal
    check: "Claim received_date must be within CLAIM_TIMELY_FILING_DAYS (= 365) of service_date: received_date > service_date + 365 days rejects; received_date == service_date + 365 days is timely"
    error_id: ERR_TIMELY_FILING
    http_status: 422
    applies_to: ["POST /dental/claims"]

  - priority: 9
    category: business_temporal
    check: "Predetermination planned_service_date must be on-or-after the logical clock (no retroactive estimates)"
    error_id: ERR_RETROACTIVE_PREDETERMINATION
    http_status: 422
    applies_to: ["POST /dental/predeterminations"]

  - priority: 10
    category: business_referential
    check: "Claim.dependent_id must belong to Claim.subscriber_id; ClaimAttachment.claim_line_id must belong to the same claim; Predetermination.dependent_id must belong to Predetermination.subscriber_id"
    error_id: ERR_CROSS_REFERENCE_MISMATCH
    http_status: 422
    applies_to: ["POST /dental/claims", "POST /dental/claims/{id}/attachments", "POST /dental/predeterminations"]

  - priority: 11
    category: business_referential
    check: "Subscriber.cob_priority=SECONDARY requires other_plan_external_id non-empty; cob_priority!=SECONDARY requires it empty"
    error_id: ERR_COB_CONFIG_INVALID
    http_status: 422
    applies_to: ["POST /dental/subscribers"]

  - priority: 11.5
    category: business_referential
    check: "An ACTIVE FeeSchedule covering the rendering provider's tier at the anchor date exists AND contains a FeeScheduleEntry for every cdt_code being priced"
    error_id: ERR_NO_FEE_SCHEDULE
    http_status: 422
    applies_to: ["POST /dental/claims", "POST /dental/predeterminations/{id}/assign", "POST /dental/predeterminations/{id}/reassign", "POST /dental/predeterminations/{id}/approve"]

  - priority: 12
    category: business_constraint
    check: "FeeSchedule activation: an overlapping ACTIVE schedule for the same tier whose effective_from is strictly later than the new schedule's effective_from (retroactive insertion) is rejected; overlapping with effective_from <= new.effective_from is allowed and truncates the existing window"
    error_id: ERR_SCHEDULE_OVERLAP
    http_status: 409
    applies_to: ["POST /dental/fee-schedules/{id}/activate"]

  - priority: 13
    category: business_constraint
    check: "Provider terminate blocked while provider has open Predeterminations or Claims in PENDED_REVIEW"
    error_id: ERR_PROVIDER_BUSY
    http_status: 409
    applies_to: ["POST /dental/providers/{id}/terminate"]

  - priority: 14
    category: business_safety
    check: "Segregation of duties: Predetermination approve/deny X-User-ID must equal the predetermination's current clinical_reviewer_id; assign and reassign require X-User-ID == payload clinical_reviewer_id; reassign additionally requires the new reviewer differ from the current clinical_reviewer_id"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: ["POST /dental/predeterminations/{id}/assign", "POST /dental/predeterminations/{id}/approve", "POST /dental/predeterminations/{id}/deny", "POST /dental/predeterminations/{id}/reassign"]

  - priority: 15
    category: business_safety
    check: "ClaimAttachment blob_ref and attachment_kind are required and attachment_kind must be a declared enum member"
    error_id: ERR_INVALID_ATTACHMENT
    http_status: 400
    applies_to: ["POST /dental/claims/{id}/attachments"]

  - priority: 16
    category: business_fiscal
    check: "Coinsurance percentages must lie in [0,100]; annual_maximum_cents and deductible_cents must be non-negative"
    error_id: ERR_INVALID_PLAN_CONFIG
    http_status: 422
    applies_to: ["POST /dental/plans"]

  - priority: 17
    category: business_fiscal
    check: "Predetermination estimated_plan_pay_cents must not exceed plan.annual_maximum_cents - current accumulator.annual_max_used_cents (cap warning, not a denial)"
    error_id: ERR_ANNUAL_MAX_EXCEEDED
    http_status: 422
    applies_to: ["POST /dental/predeterminations/{id}/approve"]
    note: "Fires only when the cap is exceeded even before any coinsurance — the approve itself is rejected so a clinician cannot promise payment the plan cannot deliver."

  - priority: 18
    category: business_constraint
    check: "OCC: expected_<parent>_version must match the parent's current version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: ["POST /dental/predeterminations/{id}/approve", "POST /dental/claims/{id}/void"]

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- clock (test-driving) ---
  - method: POST
    path: "/dental/_clock/set_current_utc"
    description: "Test-driving logical clock setter. Before any call, the logical clock reads exactly 2026-09-01T00:00:00Z and never falls back to wall-clock."
    roles: [PlanAdmin]
    code: 200
    input: [to_iso8601]
    output: { now: string }
    side_effects: ["Logical clock advance drives Predetermination EXPIRED lazy transitions and waiting-period arithmetic"]

  # --- plans ---
  - method: POST
    path: "/dental/plans"
    description: "Create a plan in DRAFT"
    roles: [PlanAdmin]
    code: 201
    input: [plan_code, plan_year_start_month, annual_maximum_cents, deductible_cents, deductible_applies_preventive, preventive_coinsurance_pct, basic_coinsurance_pct, major_coinsurance_pct, basic_waiting_months, major_waiting_months, missing_tooth_clause_active, abp_enabled]
    output: Plan
    side_effects: []
  - method: GET
    path: "/dental/plans"
    description: "List plans"
    roles: [PlanAdmin, NetworkManager, ClaimsExaminer, ClinicalReviewer, Member, Provider]
    code: 200
    input: ["status?", "plan_code?", "limit?", "offset?"]
    output: Plan[]
    side_effects: []
  - method: GET
    path: "/dental/plans/{id}"
    description: "Get one plan"
    roles: [PlanAdmin, NetworkManager, ClaimsExaminer, ClinicalReviewer, Member, Provider]
    code: 200
    input: []
    output: Plan
    side_effects: []
  - method: POST
    path: "/dental/plans/{id}/activate"
    description: "Activate or un-suspend a plan"
    roles: [PlanAdmin]
    code: 200
    input: []
    output: Plan
    side_effects: ["Plan DRAFT → ACTIVE or SUSPENDED → ACTIVE"]
  - method: POST
    path: "/dental/plans/{id}/suspend"
    description: "Suspend a plan"
    roles: [PlanAdmin]
    code: 200
    input: []
    output: Plan
    side_effects: ["Plan ACTIVE → SUSPENDED"]
  - method: POST
    path: "/dental/plans/{id}/retire"
    description: "Retire a plan"
    roles: [PlanAdmin]
    code: 200
    input: []
    output: Plan
    side_effects: ["Plan ACTIVE → RETIRED"]

  # --- providers ---
  - method: POST
    path: "/dental/providers"
    description: "Create a provider"
    roles: [NetworkManager]
    code: 201
    input: [npi, legal_name, tier, license_state, contracted_on]
    output: Provider
    side_effects: []
  - method: GET
    path: "/dental/providers"
    description: "List providers"
    roles: [PlanAdmin, NetworkManager, ClaimsExaminer, ClinicalReviewer, Member, Provider]
    code: 200
    input: ["tier?", "status?", "limit?", "offset?"]
    output: Provider[]
    side_effects: []
  - method: GET
    path: "/dental/providers/{id}"
    description: "Get one provider"
    roles: [PlanAdmin, NetworkManager, ClaimsExaminer, ClinicalReviewer, Member, Provider]
    code: 200
    input: []
    output: Provider
    side_effects: []
  - method: POST
    path: "/dental/providers/{id}/terminate"
    description: "Terminate a provider"
    roles: [NetworkManager]
    code: 200
    input: []
    output: Provider
    side_effects: ["Provider ACTIVE → TERMINATED; blocks future claims"]

  # --- fee schedules ---
  - method: POST
    path: "/dental/fee-schedules"
    description: "Create a fee schedule in PENDING with entries"
    roles: [NetworkManager]
    code: 201
    input: [tier, effective_from, "effective_to?", entries]
    output: FeeSchedule
    side_effects: ["FeeScheduleEntry rows created for each element of entries[]"]
  - method: GET
    path: "/dental/fee-schedules"
    description: "List fee schedules"
    roles: [PlanAdmin, NetworkManager, ClaimsExaminer, ClinicalReviewer]
    code: 200
    input: ["tier?", "status?", "limit?", "offset?"]
    output: FeeSchedule[]
    side_effects: []
  - method: GET
    path: "/dental/fee-schedules/{id}"
    description: "Get one fee schedule"
    roles: [PlanAdmin, NetworkManager, ClaimsExaminer, ClinicalReviewer]
    code: 200
    input: []
    output: FeeSchedule
    side_effects: []
  - method: GET
    path: "/dental/fee-schedules/{id}/entries"
    description: "List entries of one fee schedule"
    roles: [PlanAdmin, NetworkManager, ClaimsExaminer, ClinicalReviewer]
    code: 200
    input: ["cdt_code?", "limit?", "offset?"]
    output: FeeScheduleEntry[]
    side_effects: []
  - method: POST
    path: "/dental/fee-schedules/{id}/activate"
    description: "Activate a fee schedule (may supersede same-tier overlapping ACTIVE)"
    roles: [NetworkManager]
    code: 200
    input: []
    output: FeeSchedule
    side_effects: ["PENDING → ACTIVE; overlapping ACTIVE for same tier → SUPERSEDED; UNDER_REVIEW Predeterminations on same tier recompute"]
  - method: POST
    path: "/dental/fee-schedules/{id}/retire"
    description: "Retire a schedule"
    roles: [NetworkManager]
    code: 200
    input: []
    output: FeeSchedule
    side_effects: ["PENDING → RETIRED or ACTIVE → RETIRED"]

  # --- limitation rules ---
  - method: POST
    path: "/dental/plans/{id}/limitation-rules"
    description: "Attach a LimitationRule to a plan"
    roles: [PlanAdmin]
    code: 201
    input: [cdt_code, rule_kind, window_months, max_occurrences, age_years_min, age_years_max]
    output: LimitationRule
    side_effects: []
  - method: GET
    path: "/dental/plans/{id}/limitation-rules"
    description: "List a plan's limitation rules"
    roles: [PlanAdmin, NetworkManager, ClaimsExaminer, ClinicalReviewer]
    code: 200
    input: ["rule_kind?", "cdt_code?", "limit?", "offset?"]
    output: LimitationRule[]
    side_effects: []
  - method: GET
    path: "/dental/limitation-rules/{id}"
    description: "Get one limitation rule"
    roles: [PlanAdmin, NetworkManager, ClaimsExaminer, ClinicalReviewer]
    code: 200
    input: []
    output: LimitationRule
    side_effects: []

  # --- subscribers / dependents ---
  - method: POST
    path: "/dental/subscribers"
    description: "Enroll a subscriber on an ACTIVE plan"
    roles: [PlanAdmin]
    code: 201
    input: [plan_id, member_id, full_name, date_of_birth, effective_date, cob_priority, "other_plan_external_id?"]
    output: Subscriber
    side_effects: ["Creates a BenefitAccumulator placeholder (lazily materialized on first adjudication)"]
  - method: GET
    path: "/dental/subscribers"
    description: "List subscribers"
    roles: [PlanAdmin, NetworkManager, ClaimsExaminer, ClinicalReviewer, Member]
    code: 200
    input: ["plan_id?", "status?", "limit?", "offset?"]
    output: Subscriber[]
    side_effects: []
  - method: GET
    path: "/dental/subscribers/{id}"
    description: "Get one subscriber"
    roles: [PlanAdmin, NetworkManager, ClaimsExaminer, ClinicalReviewer, Member]
    code: 200
    input: []
    output: Subscriber
    side_effects: []
  - method: POST
    path: "/dental/subscribers/{id}/terminate"
    description: "Terminate a subscriber; cascades to dependents and open predeterminations"
    roles: [PlanAdmin]
    code: 200
    input: []
    output: Subscriber
    side_effects: ["Dependents → TERMINATED; SUBMITTED/UNDER_REVIEW Predeterminations → WITHDRAWN"]
  - method: POST
    path: "/dental/subscribers/{id}/dependents"
    description: "Add a dependent"
    roles: [PlanAdmin]
    code: 201
    input: [full_name, date_of_birth, relationship]
    output: Dependent
    side_effects: []
  - method: GET
    path: "/dental/subscribers/{id}/dependents"
    description: "List a subscriber's dependents"
    roles: [PlanAdmin, NetworkManager, ClaimsExaminer, ClinicalReviewer, Member]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: Dependent[]
    side_effects: []
  - method: GET
    path: "/dental/dependents/{id}"
    description: "Get one dependent"
    roles: [PlanAdmin, NetworkManager, ClaimsExaminer, ClinicalReviewer, Member]
    code: 200
    input: []
    output: Dependent
    side_effects: []
  - method: POST
    path: "/dental/dependents/{id}/terminate"
    description: "Terminate one dependent"
    roles: [PlanAdmin]
    code: 200
    input: []
    output: Dependent
    side_effects: ["Dependent ACTIVE → TERMINATED"]

  # --- accumulators ---
  - method: GET
    path: "/dental/subscribers/{id}/accumulators"
    description: "List BenefitAccumulators for a subscriber (per dependent, per plan_year)"
    roles: [PlanAdmin, ClaimsExaminer, ClinicalReviewer, Member]
    code: 200
    input: ["dependent_id?", "plan_year_key?", "limit?", "offset?"]
    output: BenefitAccumulator[]
    side_effects: []
  - method: GET
    path: "/dental/dependents/{id}/accumulators"
    description: "List BenefitAccumulators for a dependent"
    roles: [PlanAdmin, ClaimsExaminer, ClinicalReviewer, Member]
    code: 200
    input: ["plan_year_key?", "limit?", "offset?"]
    output: BenefitAccumulator[]
    side_effects: []

  # --- predeterminations ---
  - method: POST
    path: "/dental/predeterminations"
    description: "Submit a predetermination"
    roles: [Member, Provider]
    code: 201
    input: [subscriber_id, "dependent_id?", provider_id, cdt_code, submitted_amount_cents, planned_service_date]
    output: Predetermination
    side_effects: []
  - method: GET
    path: "/dental/predeterminations"
    description: "List predeterminations"
    roles: [PlanAdmin, NetworkManager, ClaimsExaminer, ClinicalReviewer, Member, Provider]
    code: 200
    input: ["subscriber_id?", "dependent_id?", "provider_id?", "status?", "cdt_code?", "version_pin_fee_schedule_id?", "limit?", "offset?"]
    output: Predetermination[]
    side_effects: []
  - method: GET
    path: "/dental/predeterminations/{id}"
    description: "Get one predetermination (lazy EXPIRED transition may apply)"
    roles: [PlanAdmin, NetworkManager, ClaimsExaminer, ClinicalReviewer, Member, Provider]
    code: 200
    input: []
    output: Predetermination
    side_effects: ["APPROVED → EXPIRED if clock > expires_on"]
  - method: POST
    path: "/dental/predeterminations/{id}/assign"
    description: "ClinicalReviewer self-assigns and computes the estimate"
    roles: [ClinicalReviewer]
    code: 200
    input: [clinical_reviewer_id]
    output: Predetermination
    side_effects: ["SUBMITTED → UNDER_REVIEW; estimate computed against currently ACTIVE schedule"]
  - method: POST
    path: "/dental/predeterminations/{id}/reassign"
    description: "Reassign to a different reviewer; recomputes estimate"
    roles: [ClinicalReviewer]
    code: 200
    input: [clinical_reviewer_id]
    output: Predetermination
    side_effects: ["UNDER_REVIEW stays; clinical_reviewer_id swaps; estimate recomputed"]
  - method: POST
    path: "/dental/predeterminations/{id}/approve"
    description: "Approve with pinned schedule and validity window"
    roles: [ClinicalReviewer]
    code: 200
    input: [expected_predetermination_version]
    output: Predetermination
    side_effects: ["UNDER_REVIEW → APPROVED; pin version_pin_fee_schedule_id; set expires_on"]
  - method: POST
    path: "/dental/predeterminations/{id}/deny"
    description: "Deny the predetermination"
    roles: [ClinicalReviewer]
    code: 200
    input: []
    output: Predetermination
    side_effects: ["UNDER_REVIEW → DENIED"]
  - method: POST
    path: "/dental/predeterminations/{id}/withdraw"
    description: "Member withdraws an open predetermination"
    roles: [Member]
    code: 200
    input: []
    output: Predetermination
    side_effects: ["SUBMITTED|UNDER_REVIEW → WITHDRAWN"]

  # --- claims ---
  - method: POST
    path: "/dental/claims"
    description: "Submit a claim with lines; auto-adjudicates or pends per attachments and COB"
    roles: [Provider, ClaimsExaminer]
    code: 201
    input: [subscriber_id, "dependent_id?", provider_id, "predetermination_id?", service_date, received_date, "cob_other_plan_paid_cents?", lines, "tooth_missing_prior_to_coverage?"]
    output: Claim
    side_effects:
      - "ClaimLine rows created in PENDING"
      - "Auto-transition RECEIVED → PENDED_ATTACHMENTS or PENDED_REVIEW or ADJUDICATED"
      - "If ADJUDICATED: lines priced, accumulator mutated, claim totals computed"
  - method: GET
    path: "/dental/claims"
    description: "List claims"
    roles: [PlanAdmin, NetworkManager, ClaimsExaminer, ClinicalReviewer, Member, Provider]
    code: 200
    input: ["subscriber_id?", "dependent_id?", "provider_id?", "status?", "predetermination_id?", "limit?", "offset?"]
    output: Claim[]
    side_effects: []
  - method: GET
    path: "/dental/claims/{id}"
    description: "Get one claim"
    roles: [PlanAdmin, NetworkManager, ClaimsExaminer, ClinicalReviewer, Member, Provider]
    code: 200
    input: []
    output: Claim
    side_effects: []
  - method: GET
    path: "/dental/claims/{id}/lines"
    description: "List claim lines"
    roles: [PlanAdmin, NetworkManager, ClaimsExaminer, ClinicalReviewer, Member, Provider]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: ClaimLine[]
    side_effects: []
  - method: GET
    path: "/dental/claim-lines/{id}"
    description: "Get one claim line"
    roles: [PlanAdmin, NetworkManager, ClaimsExaminer, ClinicalReviewer, Member, Provider]
    code: 200
    input: []
    output: ClaimLine
    side_effects: []
  - method: GET
    path: "/dental/claim-lines/{id}/attachments"
    description: "List attachments linked to one claim line"
    roles: [PlanAdmin, NetworkManager, ClaimsExaminer, ClinicalReviewer, Member, Provider]
    code: 200
    input: ["limit?", "offset?"]
    output: ClaimAttachment[]
    side_effects: []
  - method: POST
    path: "/dental/claims/{id}/attachments"
    description: "Upload an attachment for a claim line; may complete the attachment set and trigger adjudication"
    roles: [Provider]
    code: 201
    input: [claim_line_id, attachment_kind, blob_ref]
    output: ClaimAttachment
    side_effects: ["If claim was PENDED_ATTACHMENTS and now complete: PENDED_ATTACHMENTS → ADJUDICATED or PENDED_REVIEW"]
  - method: GET
    path: "/dental/claims/{id}/attachments"
    description: "List attachments for a claim"
    roles: [PlanAdmin, NetworkManager, ClaimsExaminer, ClinicalReviewer, Member, Provider]
    code: 200
    input: ["claim_line_id?", "limit?", "offset?"]
    output: ClaimAttachment[]
    side_effects: []
  - method: POST
    path: "/dental/claims/{id}/cob-confirm"
    description: "Examiner confirms COB inputs and triggers adjudication of a PENDED_REVIEW claim"
    roles: [ClaimsExaminer]
    code: 200
    input: [cob_other_plan_paid_cents]
    output: Claim
    side_effects: ["PENDED_REVIEW → ADJUDICATED; COB waterfall runs"]
  - method: POST
    path: "/dental/claims/{id}/pay"
    description: "Mark an adjudicated claim as PAID"
    roles: [ClaimsExaminer]
    code: 200
    input: []
    output: Claim
    side_effects: ["ADJUDICATED → PAID"]
  - method: POST
    path: "/dental/claims/{id}/void"
    description: "Void an ADJUDICATED or PAID claim (within VOID_WINDOW_DAYS for PAID); reverses the accumulator"
    roles: [ClaimsExaminer]
    code: 200
    input: [expected_claim_version]
    output: Claim
    side_effects: ["ADJUDICATED|PAID → VOID; BenefitAccumulator decremented; accumulator.version incremented"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED,          http: 401, condition: "Missing or malformed X-User-Role / X-User-ID" }
  - { id: ERR_UNAUTHORIZED,             http: 403, condition: "Role not permitted on this endpoint" }
  - { id: ERR_SEGREGATION_OF_DUTIES,    http: 403, condition: "Reviewer cannot approve their own un-assigned predetermination, or approve as a different user than clinical_reviewer_id, or reassign to themselves" }
  - { id: ERR_NOT_FOUND,                http: 404, condition: "Generic FK or path reference does not resolve" }
  - { id: ERR_PLAN_NOT_FOUND,           http: 404, condition: "Plan id does not exist" }
  - { id: ERR_PROVIDER_NOT_FOUND,       http: 404, condition: "Provider id does not exist" }
  - { id: ERR_SUBSCRIBER_NOT_FOUND,     http: 404, condition: "Subscriber id does not exist" }
  - { id: ERR_DEPENDENT_NOT_FOUND,      http: 404, condition: "Dependent id does not exist" }
  - { id: ERR_CLAIM_NOT_FOUND,          http: 404, condition: "Claim id does not exist" }
  - { id: ERR_PREDETERMINATION_NOT_FOUND, http: 404, condition: "Predetermination id does not exist" }
  - { id: ERR_FEE_SCHEDULE_NOT_FOUND,   http: 404, condition: "FeeSchedule id does not exist" }
  - { id: ERR_INVALID_STATE,            http: 409, condition: "Requested transition not declared from the entity's current state" }
  - { id: ERR_PLAN_NOT_ACTIVE,          http: 409, condition: "Plan is not ACTIVE (DRAFT, SUSPENDED, or RETIRED) — subscriber creation and claim submission blocked" }
  - { id: ERR_PROVIDER_TERMINATED,      http: 409, condition: "Provider is TERMINATED — cannot file new claims or predeterminations" }
  - { id: ERR_PROVIDER_BUSY,            http: 409, condition: "Provider terminate blocked by open Predeterminations or PENDED_REVIEW Claims" }
  - { id: ERR_SCHEDULE_OVERLAP,         http: 409, condition: "FeeSchedule activation would create overlapping ACTIVE windows for the same tier" }
  - { id: ERR_TIMELY_FILING,            http: 422, condition: "received_date > service_date + CLAIM_TIMELY_FILING_DAYS" }
  - { id: ERR_RETROACTIVE_PREDETERMINATION, http: 422, condition: "planned_service_date is before the logical clock" }
  - { id: ERR_CROSS_REFERENCE_MISMATCH, http: 422, condition: "Dependent not owned by subscriber, or attachment references a line on a different claim" }
  - { id: ERR_COB_CONFIG_INVALID,       http: 422, condition: "cob_priority=SECONDARY without other_plan_external_id, or vice versa" }
  - { id: ERR_INVALID_PLAN_CONFIG,      http: 422, condition: "Coinsurance pct outside [0,100], or negative annual_maximum_cents/deductible_cents" }
  - { id: ERR_ANNUAL_MAX_EXCEEDED,      http: 422, condition: "Approving this predetermination would exceed remaining annual maximum even before coinsurance" }
  - { id: ERR_INVALID_ATTACHMENT,       http: 400, condition: "Missing blob_ref/attachment_kind or attachment_kind outside declared enum" }
  - { id: ERR_INVALID_REQUEST,          http: 400, condition: "Generic input shape error (missing required field, wrong type)" }
  - { id: ERR_NO_FEE_SCHEDULE,          http: 422, condition: "No ACTIVE FeeSchedule covers the provider's tier at the anchor date (claim service_date or predetermination planned_service_date), or the schedule lacks an entry for the cdt_code" }
  - { id: ERR_STALE_VERSION,            http: 412, condition: "expected_<parent>_version does not match the parent's current version (OCC)" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: PlanAdmin
    description: "Carrier-side plan administrator; manages plans, subscribers, dependents, limitation rules"
    identity: opaque
    exclusive_operations:
      - "POST /dental/plans, /dental/plans/{id}/activate|suspend|retire"
      - "POST /dental/plans/{id}/limitation-rules"
      - "POST /dental/subscribers, /dental/subscribers/{id}/terminate"
      - "POST /dental/subscribers/{id}/dependents"
      - "POST /dental/_clock/set_current_utc"
    shared_operations:
      - "GET on plans, providers, fee-schedules, limitation-rules, subscribers, dependents, accumulators, predeterminations, claims, attachments, lines"

  - name: NetworkManager
    description: "Carrier-side network/fee-schedule administrator"
    identity: opaque
    exclusive_operations:
      - "POST /dental/providers, /dental/providers/{id}/terminate"
      - "POST /dental/fee-schedules, /dental/fee-schedules/{id}/activate|retire"
    shared_operations:
      - "GET on plans, providers, fee-schedules, limitation-rules, subscribers, dependents, predeterminations, claims"

  - name: ClinicalReviewer
    description: "Dental consultant who reviews predeterminations; X-User-ID is the reviewer opaque id stored on Predetermination.clinical_reviewer_id"
    identity: opaque
    exclusive_operations:
      - "POST /dental/predeterminations/{id}/assign|reassign|approve|deny"
    shared_operations:
      - "GET on plans, providers, fee-schedules, limitation-rules, subscribers, dependents, accumulators, predeterminations, claims, lines, attachments"

  - name: ClaimsExaminer
    description: "Claims adjudication operator; confirms COB, pays, voids"
    identity: opaque
    exclusive_operations:
      - "POST /dental/claims/{id}/cob-confirm"
      - "POST /dental/claims/{id}/pay"
      - "POST /dental/claims/{id}/void"
    shared_operations:
      - "POST /dental/claims (examiner can file on behalf of a provider)"
      - "GET on all entity collections"

  - name: Member
    description: "Subscriber self-service; X-User-ID equals Subscriber.id"
    identity: entity_backed:Subscriber
    exclusive_operations:
      - "POST /dental/predeterminations/{id}/withdraw"
    shared_operations:
      - "POST /dental/predeterminations (self or own dependents only)"
      - "GET on own subscriber, own dependents, own accumulators, own predeterminations, own claims/lines/attachments"

  - name: Provider
    description: "Dental practice; X-User-ID equals Provider.id"
    identity: entity_backed:Provider
    exclusive_operations:
      - "POST /dental/claims/{id}/attachments"
    shared_operations:
      - "POST /dental/claims (provider_id must equal X-User-ID)"
      - "POST /dental/predeterminations (provider_id must equal X-User-ID)"
      - "GET on own claims, own predeterminations, plans, fee-schedule visibility"
