  - rule_id: non_linear_state_machine
    instances:
      - name: property_seasonal_and_occupancy_axes_evolve_independently
        grounds:
          - state_machines.Property.OPEN_to_CLOSING
          - state_machines.Property.CLOSING_to_OPEN
          - state_machines.Property.VACANT_to_OWNER_IN_RESIDENCE
          - entities.Property.fields.seasonal_state
          - entities.Property.fields.occupancy_state
          - validations[priority=42]
        distinguishing_aspect: |
          Parallel state dimensions on the Property entity: the seasonal axis completes a full
          OPEN -> CLOSING -> OPEN cycle while the occupancy axis stays VACANT, and the
          occupancy move to OWNER_IN_RESIDENCE is legal only in the COMBINATION seasonal_state
          IN {OPEN, OPENING}, so the same occupancy request fails at CLOSING and succeeds
          after the close is aborted.
        test_recipe:
          setup:
            - "One Z2 Property with seasonal_state OPEN and occupancy_state VACANT."
            - "Two SCHEDULED ROUTINE_WATCH visits exist so the occupancy side effect is observable."
          setup_api_calls:
            - call: "POST /property-care/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /property-care/owners"
              payload: { full_name: "Gus Snowbird", email: "gus@example.com", phone: "+15550106", primary_residence_state: "PA" }
              as: PlatformAdmin
              captures: { owner_id: $.data.id }
            - call: "POST /property-care/properties"
              payload: { owner_id: "${owner_id}", label: "Dune Retreat", address_line: "6 Dune Dr", state_code: "FL", travel_distance_miles: 18.0 }
              as: PlatformAdmin
              captures: { prop_id: $.data.id }
            - call: "POST /property-care/service-plans"
              payload: { tier: "STANDARD", monthly_fee_cents: 19986, included_visit_units: 4, covered_visit_types: ["ROUTINE_WATCH"] }
              as: PlatformAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /property-care/subscriptions"
              payload: { property_id: "${prop_id}", service_plan_id: "${plan_id}", started_on: "2026-06-01T00:00:00Z" }
              as: AccountManager
              captures: { sub_id: $.data.id }
            - call: "POST /property-care/subscriptions/${sub_id}/activate"
              payload: {}
              as: AccountManager
            - call: "POST /property-care/checklist-templates"
              payload: { visit_type: "ROUTINE_WATCH", version_label: "2026.1", item_codes: ["EXT_WALK"], critical_item_codes: [] }
              as: PlatformAdmin
              captures: { tmpl_id: $.data.id }
            - call: "POST /property-care/visits"
              payload: { property_id: "${prop_id}", checklist_template_id: "${tmpl_id}", visit_type: "ROUTINE_WATCH", trigger_source: "SCHEDULED", scheduled_start_at: "2026-06-10T13:00:00Z", scheduled_end_at: "2026-06-10T15:00:00Z" }
              as: Dispatcher
              captures: { v1_id: $.data.id }
            - call: "POST /property-care/visits"
              payload: { property_id: "${prop_id}", checklist_template_id: "${tmpl_id}", visit_type: "ROUTINE_WATCH", trigger_source: "SCHEDULED", scheduled_start_at: "2026-06-17T13:00:00Z", scheduled_end_at: "2026-06-17T15:00:00Z" }
              as: Dispatcher
              captures: { v2_id: $.data.id }
            - call: "POST /property-care/properties/${prop_id}/seasonal-transitions"
              payload: { action: "BEGIN_CLOSE" }
              as: Dispatcher
              captures: { seasonal_after_close: $.data.seasonal_state, occ_after_close: $.data.occupancy_state }
          trigger:
            - call: "POST /property-care/properties/${prop_id}/seasonal-transitions"
              payload: { action: "ABORT_CLOSE" }
              as: Dispatcher
            - call: "POST /property-care/properties/${prop_id}/occupancy-transitions"
              payload: { to_state: "OWNER_IN_RESIDENCE" }
              as: Owner
              as_user_id: "${owner_id}"
          assert:
            - "immediately after BEGIN_CLOSE, Property.${prop_id}.seasonal_state == CLOSING and Property.${prop_id}.occupancy_state == VACANT"
            - "after ABORT_CLOSE, Property.${prop_id}.seasonal_state == OPEN"
            - "after the occupancy transition, Property.${prop_id}.occupancy_state == OWNER_IN_RESIDENCE and Property.${prop_id}.seasonal_state == OPEN"
            - "Visit.${v1_id}.status == DEFERRED and Visit.${v1_id}.defer_reason == OWNER_IN_RESIDENCE"
            - "Visit.${v2_id}.status == DEFERRED and Visit.${v2_id}.defer_reason == OWNER_IN_RESIDENCE"
            - "Visit.${v1_id}.deferral_count == 1"

      - name: winterization_record_reentrant_partial_loop_and_reopen
        grounds:
          - state_machines.WinterizationRecord.NOT_STARTED_to_PARTIAL
          - state_machines.WinterizationRecord.PARTIAL_to_PARTIAL
          - state_machines.WinterizationRecord.PARTIAL_to_COMPLETE
          - state_machines.WinterizationRecord.COMPLETE_to_REOPENED
          - state_machines.WinterizationRecord.REOPENED_to_PARTIAL
          - calculations.winterization_completeness
        distinguishing_aspect: |
          A re-entrant self-loop on a DIFFERENT entity from the parallel-axis instance: the
          WinterizationRecord returns to PARTIAL on every intermediate step, a THERMOSTAT_SET
          at 49 degrees is recorded yet does NOT advance completed_step_count (leaving the
          record at 50.0 percent), and the COMPLETE -> REOPENED -> PARTIAL return path drives
          completeness back to 0.0 and then up again.
        test_recipe:
          setup:
            - "One Z2 Property with an open WinterizationRecord in status NOT_STARTED."
          setup_api_calls:
            - call: "POST /property-care/_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /property-care/owners"
              payload: { full_name: "Hal Snowbird", email: "hal@example.com", phone: "+15550107", primary_residence_state: "MA" }
              as: PlatformAdmin
              captures: { owner_id: $.data.id }
            - call: "POST /property-care/properties"
              payload: { owner_id: "${owner_id}", label: "Lakeside Lodge", address_line: "8 Birch Rd", state_code: "FL", travel_distance_miles: 8.0 }
              as: PlatformAdmin
              captures: { prop_id: $.data.id }
            - call: "POST /property-care/properties/${prop_id}/winterization-records"
              payload: {}
              as: Dispatcher
              captures: { wr_id: $.data.id }
            - call: "POST /property-care/winterization-records/${wr_id}/steps"
              payload: { step_code: "WATER_SHUTOFF" }
              as: FieldTech
              captures: { pct_1: $.data.completeness_pct, st_1: $.data.status }
            - call: "POST /property-care/winterization-records/${wr_id}/steps"
              payload: { step_code: "LINES_DRAINED" }
              as: FieldTech
              captures: { pct_2: $.data.completeness_pct }
            - call: "POST /property-care/winterization-records/${wr_id}/steps"
              payload: { step_code: "THERMOSTAT_SET", thermostat_f: 49 }
              as: FieldTech
              captures: { pct_3: $.data.completeness_pct }
            - call: "POST /property-care/winterization-records/${wr_id}/steps"
              payload: { step_code: "THERMOSTAT_SET", thermostat_f: 55 }
              as: FieldTech
              captures: { pct_4: $.data.completeness_pct }
            - call: "POST /property-care/winterization-records/${wr_id}/steps"
              payload: { step_code: "VALVE_TAGGED" }
              as: FieldTech
              captures: { pct_5: $.data.completeness_pct, st_5: $.data.status }
          trigger:
            - call: "POST /property-care/winterization-records/${wr_id}/reopen"
              payload: { reopen_reason: "FREEZE_ALARM" }
              as: Dispatcher
              captures: { pct_reopened: $.data.completeness_pct }
            - call: "POST /property-care/winterization-records/${wr_id}/steps"
              payload: { step_code: "WATER_SHUTOFF" }
              as: FieldTech
              captures: { pct_after_reopen: $.data.completeness_pct, st_after_reopen: $.data.status }
          assert:
            - "after step 1 WinterizationRecord.${wr_id}.status == PARTIAL and completeness_pct == 25.0"
            - "after step 2 WinterizationRecord.${wr_id}.completeness_pct == 50.0"
            - "after the THERMOSTAT_SET at 49 WinterizationRecord.${wr_id}.completeness_pct == 50.0 and thermostat_set_f == 49"
            - "after the THERMOSTAT_SET at 55 WinterizationRecord.${wr_id}.completeness_pct == 75.0"
            - "after VALVE_TAGGED WinterizationRecord.${wr_id}.status == COMPLETE and completeness_pct == 100.0"
            - "after reopen WinterizationRecord.${wr_id}.status == REOPENED, completeness_pct == 0.0, thermostat_set_f == null, completed_at == null"
            - "after the post-reopen step WinterizationRecord.${wr_id}.status == PARTIAL and completeness_pct == 25.0"
            - "Property.${prop_id}.winterization_completeness_pct == 25.0"

      - name: storm_event_warning_to_watch_bidirectional_downgrade
        grounds:
          - state_machines.StormEvent.WATCH_to_WARNING
          - state_machines.StormEvent.WARNING_to_WATCH
          - entities.StormEvent.fields.downgrade_count
          - entities.StormEvent.fields.derived_tier
          - calculations.storm_advisory_tier
        distinguishing_aspect: |
          A bidirectional transition pair on a third entity: WATCH -> WARNING -> WATCH ->
          WARNING is legal and increments downgrade_count exactly once, while derived_tier
          stays IMMINENT throughout because it is a pure function of the clock and the
          landfall ETA and is never rewritten by an operator downgrade.
        test_recipe:
          setup:
            - "A StormEvent named Hurricane Echo for FL with landfall_eta_at 2026-06-05T00:00:00Z."
            - "The logical clock sits at 2026-06-04T20:00:00Z, exactly 4 hours out, so derived_tier is IMMINENT."
          setup_api_calls:
            - call: "POST /property-care/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-04T20:00:00Z" }
              as: PlatformAdmin
            - call: "POST /property-care/storm-events"
              payload: { name: "Hurricane Echo", region_state_code: "FL", landfall_eta_at: "2026-06-05T00:00:00Z" }
              as: StormCoordinator
              captures: { storm_id: $.data.id, tier_at_create: $.data.derived_tier }
            - call: "POST /property-care/storm-events/${storm_id}/advisory"
              payload: { to_status: "WATCH" }
              as: StormCoordinator
            - call: "POST /property-care/storm-events/${storm_id}/advisory"
              payload: { to_status: "WARNING" }
              as: StormCoordinator
          trigger:
            - call: "POST /property-care/storm-events/${storm_id}/advisory"
              payload: { to_status: "WATCH" }
              as: StormCoordinator
              captures: { downgrades: $.data.downgrade_count, status_after_downgrade: $.data.status }
            - call: "POST /property-care/storm-events/${storm_id}/advisory"
              payload: { to_status: "WARNING" }
              as: StormCoordinator
              captures: { status_after_reupgrade: $.data.status }
          assert:
            - "StormEvent.${storm_id}.derived_tier == IMMINENT at every step"
            - "after the downgrade StormEvent.${storm_id}.status == WATCH and downgrade_count == 1"
            - "after the re-upgrade StormEvent.${storm_id}.status == WARNING and downgrade_count == 1"
            - "StormEvent.${storm_id}.landfall_recorded_at == null"

  - rule_id: transitive_cascade
    instances:
      - name: storm_assess_completion_depth_eight_cascade_to_grant_invalidation
        grounds:
          - state_machines.Visit.IN_PROGRESS_to_COMPLETED
          - state_machines.Finding.TRIAGED_to_WORK_ORDERED
          - state_machines.WorkOrder.PENDING_APPROVAL_to_APPROVED
          - state_machines.WorkOrder.APPROVED_to_DISPATCHED
          - state_machines.AccessGrant.ACTIVE_to_INVALIDATED
          - calculations.key_selection
          - calculations.vendor_selection
          - calculations.key_return_deadline
          - entities.KeyAsset.fields.code_rotation_count
          - entities.AccessGrant.fields.rotation_index_at_grant
        distinguishing_aspect: |
          One trigger propagates through EIGHT causally chained entity mutations, each caused
          by the previous one: Visit COMPLETED -> Finding created -> WorkOrder created and
          auto-approved -> VendorAssignment offered -> KeyIssuance created -> AccessGrant
          created -> KeyAsset code rotated to index 2 -> the pre-existing ACTIVE grant at
