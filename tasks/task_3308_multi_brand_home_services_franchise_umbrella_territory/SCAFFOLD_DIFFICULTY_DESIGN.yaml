  # ===========================================================================
  # Rule 7 — cross-entity state dependencies across DIFFERENT entity pairs
  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:

      - name: renewal_activation_blocked_by_open_remediation_on_audit
        grounds:
          - state_machines.FranchiseAgreement.RENEWAL_PENDING_to_ACTIVE
          - errors.ERR_OPEN_REMEDIATION
          - state_machines.BrandStandardsAudit.CONDUCTED_to_PUBLISHED
          - entities.FranchiseAgreement.fields.open_remediation_count
        distinguishing_aspect: "The FranchiseAgreement to BrandStandardsAudit pair: RENEWAL_PENDING to ACTIVE is refused while ANY audit on that agreement holds an open remediation_status, and becomes allowed the instant the last one resolves."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Agreement A1 on brand MS is ACTIVE, expires_on 2026-10-01T00:00:00Z, so renew is inside the 90-day window."
            - "Audit AU1 (MYSTERY_SHOP, raw_score 80.0, critical 1) has been published with outcome FAIL, leaving the agreement's open_remediation_count 1 and standards_status REMEDIATION_REQUIRED."
            - "The agreement has been moved to RENEWAL_PENDING."
          setup_api_calls:
            - *c_clock
            - *c_ms_brand
            - *c_fr_ms
            - *c_ter_ms
