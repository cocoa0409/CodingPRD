  - rule_id: cross_entity_state_dependency
    instances:

      - name: offer_submission_gated_on_hardship_package_state
        grounds:
          - validations[priority=61]
          - errors[ERR_HARDSHIP_NOT_ACCEPTED]
          - state_machines.Offer.DRAFT_to_SUBMITTED
          - state_machines.HardshipPackage.SUBMITTED_to_ACCEPTED
        distinguishing_aspect: |
          Entity pair (Offer -> HardshipPackage): the Offer's DRAFT -> SUBMITTED
          transition is legal only while the case's HardshipPackage sits in
          ACCEPTED. With the package in SUBMITTED the identical call is refused
          with ERR_HARDSHIP_NOT_ACCEPTED, and it succeeds unchanged the moment
          the package is accepted.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-24T00:00:00Z."
            - "One GSE ShortSaleCase whose HardshipPackage is SUBMITTED but not yet decided (negotiation_status PACKAGE_REVIEW, documentation_status DOC_COMPLETE)."
            - "One ACTIVE Listing listed_at 2026-08-05, so days_on_market is 19."
            - "One DRAFT Offer at 24500041."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "adm-900"
