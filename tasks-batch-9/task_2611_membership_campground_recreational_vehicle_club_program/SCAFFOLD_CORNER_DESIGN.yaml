              captures: { tr_gen2_id: "$.data.id" }
            - call: "POST /transfer-requests/${tr_gen2_id}/decision"
              payload: { decision: "APPROVE" }
              as: ClubAdmin
              as_user_id: "clubadmin-hq-1"
              captures: { mem_gen2_id: "$.data.successor_membership_id" }
            - call: "GET /memberships/${mem_gen2_id}"
              as: ClubAdmin
              captures: { mem_gen2_version: "$.data.version", mem_gen2_count: "$.data.transfer_count", mem_gen2_tenure: "$.data.tenure_origin_at", mem_gen2_status: "$.data.membership_status" }
            - call: "POST /transfer-requests"
              payload: { membership_id: "${mem_gen2_id}", to_member_id: "${member_od_id}", transfer_type: "GIFT", expected_membership_version: "${mem_gen2_version}" }
              as: Member
              as_user_id: "${member_pr_id}"
              captures: { transfer_limit_error_id: "$.data.error_id" }
            - call: "GET /memberships/${mem_gen2_id}"
              as: ClubAdmin
              captures: { mem_gen2_status_after: "$.data.membership_status", mem_gen2_version_after: "$.data.version" }
            - call: "GET /transfer-requests"
              payload: { membership_id: "${mem_gen2_id}" }
              as: ClubAdmin
          assert:
            - "The original membership starts with transfer_count 0 and its tenure_origin_at is the 2026-08-01 purchase instant"
            - "First approval mints a successor with transfer_count 1, transferred_from_membership_id equal to the original membership id, and tenure_origin_at identical to the original — tenure travels with the chain"
            - "Second approval mints a successor with transfer_count 2 and the same inherited tenure_origin_at; its membership_status is ACTIVE"
            - "Third submission: HTTP 422 with error_id ERR_TRANSFER_LIMIT_REACHED, since transfer_count 2 is not < MAX_TRANSFERS_PER_CHAIN 2 — the limit binds on the third attempt, not the second"
            - "The second successor is still ACTIVE (it was never frozen to TRANSFER_PENDING) and its version is unchanged by the refused submission"
            - "GET /transfer-requests filtered to the second successor returns total_count 0 — no SUBMITTED row was persisted for the refused attempt"
      - name: grace_dues_may_still_book_but_may_neither_submit_nor_have_a_transfer_decided
        claim_type: error_triggerable
        grounds:
          - validations[priority=42]
          - errors[ERR_DUES_NOT_CURRENT]
          - state_machines.Membership
          - calculations.dues_late_fee
        distinguishing_aspect: "The asymmetry inside priority 42 is the whole point: dues_status GRACE is good enough to book a stay but not good enough to submit a transfer, and not good enough to have an already-SUBMITTED transfer decided, so the same status yields a 201 and two 409s. The GRACE membership is still ACTIVE, which is what keeps ERR_MEMBERSHIP_NOT_ACTIVE from shadowing the dues error."
        test_recipe:
          setup:
            - "Two CLASSIC memberships bought at clock 2026-08-01, each with one OPEN invoice of 45360 due 2026-08-31 (base 42000 + 8% assessment 3360, no loyalty credit at tenure 0)"
            - "The second membership submits a GIFT transfer while its dues are still CURRENT, so it sits in TRANSFER_PENDING with a SUBMITTED request when the sweep runs"
            - "The clock then moves to 2026-09-10 — 10 days past due, inside GRACE and short of the 30-day DELINQUENT threshold — and the delinquency run pushes both memberships to GRACE without suspending either"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ClubAdmin
            - call: "POST /membership-tiers"
              payload: { code: "CLASSIC", name: "Classic Class", tier_rank: 1, upfront_cost_cents: 795000, annual_dues_cents: 42000, entitlement_nights_class_a: 0, entitlement_nights_class_b: 10, entitlement_nights_class_c: 18, annual_total_night_cap: 24, advance_window_days: 60, max_consecutive_stay_nights: 14, min_out_nights_between_stays: 3, affiliate_access_enabled: false, resale_allowed: false, transfer_fee_cents: 60000 }
              as: ClubAdmin
              captures: { tier_cls_id: "$.data.id" }
            - call: "POST /members"
              payload: { full_name: "Dana Whitlock", email: "dana.whitlock@example.com" }
              as: ClubAdmin
              captures: { member_dw_id: "$.data.id" }
            - call: "POST /members"
              payload: { full_name: "Priya Raman", email: "priya.raman@example.com" }
              as: ClubAdmin
              captures: { member_pr_id: "$.data.id" }
            - call: "POST /members"
              payload: { full_name: "Nathan Boyle", email: "nathan.boyle@example.com" }
              as: ClubAdmin
              captures: { member_nb_id: "$.data.id" }
            - call: "POST /memberships"
              payload: { member_id: "${member_dw_id}", tier_id: "${tier_cls_id}", upfront_paid_cents: 795000 }
              as: ClubAdmin
              captures: { mem_dw_id: "$.data.id" }
            - call: "POST /memberships"
              payload: { member_id: "${member_pr_id}", tier_id: "${tier_cls_id}", upfront_paid_cents: 795000 }
              as: ClubAdmin
              captures: { mem_pr_id: "$.data.id", mem_pr_version: "$.data.version" }
            - call: "POST /transfer-requests"
              payload: { membership_id: "${mem_pr_id}", to_member_id: "${member_nb_id}", transfer_type: "GIFT", expected_membership_version: "${mem_pr_version}" }
              as: Member
              as_user_id: "${member_pr_id}"
              captures: { tr_pr_id: "$.data.id", tr_pr_status: "$.data.status" }
            - call: "POST /parks"
              payload: { name: "Harvest Ridge Campground", park_class: "CLASS_B", total_sites: 30, member_allocation_pct: 60, season_open_date: "2026-01-05", season_close_date: "2026-12-20" }
              as: ClubAdmin
              captures: { park_hr_id: "$.data.id" }
            - call: "POST /parks/${park_hr_id}/season-openings"
              as: ParkManager
              as_user_id: "${park_hr_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-10T00:00:00Z" }
              as: ClubAdmin
            - call: "POST /ops/dues-delinquency-run"
              as: ClubAdmin
            - call: "GET /memberships/${mem_dw_id}"
              as: ClubAdmin
              captures: { mem_dw_dues_grace: "$.data.dues_status", mem_dw_status_grace: "$.data.membership_status", mem_dw_balance_grace: "$.data.dues_balance_cents", mem_dw_version_grace: "$.data.version" }
            - call: "GET /memberships/${mem_pr_id}"
              as: ClubAdmin
              captures: { mem_pr_dues_grace: "$.data.dues_status", mem_pr_status_grace: "$.data.membership_status" }
            - call: "GET /memberships/${mem_dw_id}/dues-invoices"
              as: ClubAdmin
              captures: { inv_dw_id: "$.data[0].id", inv_dw_status_pastdue: "$.data[0].status", inv_dw_amount: "$.data[0].amount_cents", inv_dw_late_fee: "$.data[0].late_fee_cents" }
          trigger:
            - call: "POST /transfer-requests"
              payload: { membership_id: "${mem_dw_id}", to_member_id: "${member_nb_id}", transfer_type: "GIFT", expected_membership_version: "${mem_dw_version_grace}" }
              as: Member
              as_user_id: "${member_dw_id}"
              captures: { grace_submit_error_id: "$.data.error_id" }
            - call: "POST /transfer-requests/${tr_pr_id}/decision"
              payload: { decision: "APPROVE" }
              as: ClubAdmin
              as_user_id: "clubadmin-hq-1"
              captures: { grace_decision_error_id: "$.data.error_id" }
            - call: "POST /reservations"
              payload: { park_id: "${park_hr_id}", membership_id: "${mem_dw_id}", arrival_date: "2026-09-20", scheduled_departure_date: "2026-09-22" }
              as: Member
              as_user_id: "${member_dw_id}"
              captures: { grace_res_id: "$.data.id", grace_res_status: "$.data.status" }
            - call: "POST /reservations/${grace_res_id}/cancellation"
              as: Member
              as_user_id: "${member_dw_id}"
              captures: { grace_res_status_cancelled: "$.data.status" }
            - call: "POST /dues-invoices/${inv_dw_id}/payments"
              payload: { amount_cents: 46040 }
              as: Member
              as_user_id: "${member_dw_id}"
              captures: { inv_dw_status_paid: "$.data.status" }
            - call: "GET /memberships/${mem_dw_id}"
              as: ClubAdmin
              captures: { mem_dw_dues_after_pay: "$.data.dues_status", mem_dw_balance_after_pay: "$.data.dues_balance_cents", mem_dw_version_after_pay: "$.data.version" }
            - call: "POST /transfer-requests"
              payload: { membership_id: "${mem_dw_id}", to_member_id: "${member_nb_id}", transfer_type: "GIFT", expected_membership_version: "${mem_dw_version_after_pay}" }
              as: Member
              as_user_id: "${member_dw_id}"
              captures: { current_submit_status: "$.data.status", current_submit_fee: "$.data.transfer_fee_cents" }
            - call: "GET /transfer-requests/${tr_pr_id}"
              as: ClubAdmin
              captures: { tr_pr_status_after: "$.data.status", tr_pr_successor_after: "$.data.successor_membership_id" }
          assert:
            - "After the sweep both memberships report dues_status GRACE: 10 days past due is >= DUES_GRACE_START_DAYS 1 and < DUES_DELINQUENT_DAYS 30, so neither is suspended — the first is still ACTIVE and the second is still TRANSFER_PENDING"
            - "The swept invoice is PAST_DUE with amount_cents 45360 and late_fee_cents 680: months_late = ceil(10 / 30) = 1 and round_half_up(45360 x 0.015 x 1) = round_half_up(680.4) = 680, so dues_balance_cents is 46040"
            - "Submitting a transfer on the GRACE membership: HTTP 409 with error_id ERR_DUES_NOT_CURRENT — GRACE is not CURRENT, and the membership is ACTIVE so ERR_MEMBERSHIP_NOT_ACTIVE cannot be the answer"
            - "Deciding the already-SUBMITTED transfer of the other GRACE membership: HTTP 409 with error_id ERR_DUES_NOT_CURRENT — the dues test is re-applied at decision time, not only at submission time, even though the request was legally submitted while dues were CURRENT"
            - "Booking a CLASS_B stay on the same GRACE membership: HTTP 201 with status CONFIRMED — bookings accept dues_status IN {CURRENT, GRACE}, so the identical status passes here and fails for transfers"
            - "After the reservation is cancelled and the invoice is paid in full for exactly 46040 (base plus late fee, so priority 47 is satisfied), the invoice is PAID, dues_status returns GRACE -> CURRENT and dues_balance_cents is 0"
            - "Re-submitting the transfer with the refreshed version now succeeds: HTTP 201 with status SUBMITTED and transfer_fee_cents 30000, i.e. round_half_up(60000 x 0.50) for a GIFT with no resale surcharge, confirming the earlier refusal was the dues state and nothing else"
            - "The other membership's request is still SUBMITTED with successor_membership_id null — the refused decision left it decidable once its own dues are cured"
  - section: rbac
    instances:
      - name: identity_and_role_gates_outrank_existence_and_domain_rules
        claim_type: other_role_exclusive_operations_denied
        grounds:
          - validations[priority=1]
          - validations[priority=2]
          - errors[ERR_UNAUTHENTICATED]
          - errors[ERR_UNAUTHORIZED]
          - roles[Member]
          - roles[ParkManager]
          - roles[ClubAdmin]
          - roles[ComplianceOfficer]
          - roles[TransientGuest]
        distinguishing_aspect: "Every role is pushed at another role's exclusive operation, including ClubAdmin at a ParkManager-only endpoint, which proves the model is peer roles and not a hierarchy where headquarters can do everything. Two of the probes address fabricated ids so the 403 also proves that authorization at priority 2 outranks existence at priorities 13 and 14 — a 404 there would leak the id space to unauthorized callers."
        test_recipe:
          setup:
            - "One CLASS_C park opened for the season, one CLASSIC membership and one member, all created by ClubAdmin; the transfer-decision and exception-decision probes deliberately address ids that do not exist"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ClubAdmin
            - call: "POST /membership-tiers"
              payload: { code: "CLASSIC", name: "Classic Class", tier_rank: 1, upfront_cost_cents: 795000, annual_dues_cents: 42000, entitlement_nights_class_a: 0, entitlement_nights_class_b: 10, entitlement_nights_class_c: 18, annual_total_night_cap: 24, advance_window_days: 60, max_consecutive_stay_nights: 14, min_out_nights_between_stays: 3, affiliate_access_enabled: false, resale_allowed: false, transfer_fee_cents: 60000 }
              as: ClubAdmin
              captures: { tier_cls_id: "$.data.id" }
            - call: "POST /members"
              payload: { full_name: "Dana Whitlock", email: "dana.whitlock@example.com" }
              as: ClubAdmin
              captures: { member_dw_id: "$.data.id" }
            - call: "POST /memberships"
              payload: { member_id: "${member_dw_id}", tier_id: "${tier_cls_id}", upfront_paid_cents: 795000 }
              as: ClubAdmin
              captures: { mem_dw_id: "$.data.id" }
            - call: "POST /parks"
              payload: { name: "Sable Creek Campground", park_class: "CLASS_C", total_sites: 30, member_allocation_pct: 60, season_open_date: "2026-01-05", season_close_date: "2026-12-20" }
              as: ClubAdmin
              captures: { park_sc_id: "$.data.id" }
            - call: "POST /parks/${park_sc_id}/season-openings"
              as: ParkManager
              as_user_id: "${park_sc_id}"
              captures: { park_sc_status: "$.data.park_status" }
          trigger:
            - call: "POST /reservations"
              payload: { park_id: "${park_sc_id}", membership_id: "${mem_dw_id}", arrival_date: "2026-08-20", scheduled_departure_date: "2026-08-22" }
              as: Member
              as_user_id: ""
              captures: { missing_identity_error_id: "$.data.error_id" }
            - call: "POST /reservations"
              payload: { park_id: "${park_sc_id}", membership_id: "${mem_dw_id}", arrival_date: "2026-08-20", scheduled_departure_date: "2026-08-22" }
              as: ComplianceOfficer
              captures: { compliance_booking_error_id: "$.data.error_id" }
            - call: "POST /transient-reservations"
              payload: { park_id: "${park_sc_id}", guest_name: "Dana Whitlock", arrival_date: "2026-08-20", scheduled_departure_date: "2026-08-22" }
              as: Member
              as_user_id: "${member_dw_id}"
              captures: { member_transient_error_id: "$.data.error_id" }
            - call: "POST /memberships"
              payload: { member_id: "${member_dw_id}", tier_id: "${tier_cls_id}", upfront_paid_cents: 795000 }
              as: TransientGuest
              captures: { guest_membership_error_id: "$.data.error_id" }
            - call: "POST /maintenance-windows"
              payload: { park_id: "${park_sc_id}", start_date: "2026-10-05", end_date: "2026-10-09", work_type: "ROUTINE" }
              as: ClubAdmin
              captures: { admin_window_error_id: "$.data.error_id" }
            - call: "POST /transfer-requests/tr_00000000-0000-0000-0000-000000000000/decision"
              payload: { decision: "APPROVE" }
              as: ParkManager
              as_user_id: "${park_sc_id}"
              captures: { manager_decision_error_id: "$.data.error_id" }
            - call: "POST /occupancy-exceptions/oe_00000000-0000-0000-0000-000000000000/decision"
              payload: { decision: "GRANT", granted_run_nights: 20 }
              as: Member
              as_user_id: "${member_dw_id}"
              captures: { member_exception_error_id: "$.data.error_id" }
            - call: "POST /transient-reservations"
              payload: { park_id: "${park_sc_id}", guest_name: "Owen Deleon", arrival_date: "2026-08-20", scheduled_departure_date: "2026-08-22" }
              as: TransientGuest
              captures: { guest_transient_status: "$.data.status" }
            - call: "POST /maintenance-windows"
              payload: { park_id: "${park_sc_id}", start_date: "2026-10-05", end_date: "2026-10-09", work_type: "ROUTINE" }
              as: ParkManager
              as_user_id: "${park_sc_id}"
              captures: { manager_window_status: "$.data.status" }
          assert:
            - "Booking with the X-User-ID header omitted: HTTP 401 with error_id ERR_UNAUTHENTICATED — priority 1 demands both X-User-Role and X-User-ID before anything else is read, so the body is never validated"
            - "ComplianceOfficer booking a member stay: HTTP 403 ERR_UNAUTHORIZED — POST /reservations is exclusive to Member"
            - "Member booking a transient stay: HTTP 403 ERR_UNAUTHORIZED — POST /transient-reservations is exclusive to TransientGuest, so a member cannot buy public inventory even for itself"
            - "TransientGuest selling a membership: HTTP 403 ERR_UNAUTHORIZED — POST /memberships is exclusive to ClubAdmin"
            - "ClubAdmin scheduling a maintenance window: HTTP 403 ERR_UNAUTHORIZED — POST /maintenance-windows is exclusive to ParkManager, so headquarters is NOT a superset of the park operator; these are peer roles"
            - "ParkManager deciding a transfer request: HTTP 403 ERR_UNAUTHORIZED and NOT 404, even though the request id is fabricated — priority 2 precedes the priority-13/14 existence checks"
            - "Member deciding an occupancy exception: HTTP 403 ERR_UNAUTHORIZED and NOT 404 for the same reason; the decision is exclusive to ComplianceOfficer"
            - "Positive controls: the same transient booking as TransientGuest returns HTTP 201 CONFIRMED and the same window as the owning ParkManager returns HTTP 201 SCHEDULED, so each refusal above was the role and nothing about the request itself"
      - name: a_member_cannot_read_or_move_another_members_resources
