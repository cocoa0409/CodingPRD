            - call: "POST /batches"
              payload: { batch_code: "B-15001", recipe_id: "${rec_id}", scoby_culture_id: "${sc_id}", vessel_id: "${v_id}", pitched_liters: 400.0, planned_f2_days: 3, f2_added_sugar_g_per_l: 4 }
              as: ProductionOperator
              captures: { b_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
