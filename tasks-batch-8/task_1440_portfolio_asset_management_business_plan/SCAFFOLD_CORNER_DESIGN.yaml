        claim_type: role_exclusive_denial
        grounds: [roles.Lender, endpoints.POST /api/business-plans]
        distinguishing_aspect: "Lender's exclusive surface is waive/acknowledge only; plan creation is AssetManager's."
        test_recipe:
          setup: ["BASE"]
          setup_api_calls:
            - { call: "POST /api/portfolios", payload: { name: "P1" }, as: PortfolioDirector, captures: { p1: $.data.id } }
            - { call: "POST /api/property-managers", payload: { firm_name: "PM Co", contact_email: "pm@x.com" }, as: PortfolioDirector, captures: { pm1: $.data.id } }
            - { call: "POST /api/assets", payload: { portfolio_id: "${p1}", property_manager_id: "${pm1}", name: "A1", address: "1 Main St", asset_class: "OFFICE", net_rentable_sqft: 100000, acquisition_price_cents: 800000000, acquisition_date: "2024-06-15", hold_period_years: 5 }, as: PortfolioDirector, captures: { a1: $.data.id, a1_v: $.data.version } }
          trigger:
            - { call: "POST /api/business-plans", payload: { asset_id: "${a1}", fiscal_year: 2027, expected_asset_version: "${a1_v}" }, as: Lender, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_FORBIDDEN_FOR_ROLE (403)"

