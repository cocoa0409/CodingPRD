            - "third call: HTTP 200 and OrderPeriod.${op_id}.status == OPEN with allotment_run_count still 0"

      - name: official_statement_drafting_loop_terminates_at_the_round_bound
        claim_type: cyclic
        grounds:
          - state_machines.OfficialStatement.IN_REVIEW_to_REVISION_REQUESTED
          - calculations_constants.MAX_DRAFT_ROUNDS
        distinguishing_aspect: |
          The DRAFTING -> IN_REVIEW -> REVISION_REQUESTED -> DRAFTING cycle must be walkable
          and must terminate at MAX_DRAFT_ROUNDS with ERR_REVISION_LIMIT_EXCEEDED.
        excluded_because:
          difficulty_instance: official_statement_revision_cycle_bounded
          rationale: |
            That difficulty instance already walks the cycle to draft_round 4 and asserts the
            422 ERR_REVISION_LIMIT_EXCEEDED on the fourth request-revision, plus the unchanged
            draft_round after the refusal. Re-testing the loop here would duplicate it exactly.

      - name: reopening_a_closed_period_reverses_every_allotment_side_effect
        claim_type: compensation
        grounds:
          - state_machines.OrderPeriod.CLOSED_to_OPEN
          - state_machines.Order.allotment_outcome_to_PENDING
        distinguishing_aspect: |
          reopen is the compensating action for close: every allotment must fall back to 0,
          every tranche must return to fully unsold, and the deal-level totals and takedown
          credits must reconcile with no drift.
        excluded_because:
          difficulty_instance: order_period_reopen_conserves_tranche_par
          rationale: |
            That difficulty instance runs the full four-order waterfall, closes, reopens and
            asserts par_allotted_usd + par_unsold_usd == principal_amount_usd on every tranche
            before and after, plus the reset of every Order to PENDING with par_allotted_usd 0
            and the recomputed takedown credits. Nothing is left to add.

      - name: enhancement_withdrawal_cascades_only_to_referencing_sections
        claim_type: conditional_cascade
        grounds:
          - state_machines.CreditEnhancement.COMMITTED_to_WITHDRAWN
          - entities.OfficialStatementSection.fields.references_credit_enhancement
        distinguishing_aspect: |
          Hop 4 of the withdrawal must demote only APPROVED sections whose
          references_credit_enhancement is true, leaving unrelated APPROVED sections alone.
        excluded_because:
          difficulty_instance: enhancement_withdrawal_four_hop_cascade
          rationale: |
            That difficulty instance already asserts the selective demotion (the referencing
            section moves to NEEDS_REVISION with approved_by_user_id null while the
            non-referencing sections stay APPROVED) as hop 4 of the same withdrawal, together
            with the recomputed mandatory_sections_approved and disclosure_clearance.

  # ===========================================================================
  # SECTION 3 - CALCULATIONS
  # ===========================================================================
  - section: calculations
    instances:

      - name: tranche_reoffering_price_rounds_each_variant_to_three_decimals
        claim_type: precision
        grounds:
          - calculations.tranche_reoffering_price.precision
          - calculations.tranche_reoffering_price.constants
        distinguishing_aspect: |
          Each variant is rounded to 3 decimals ROUND_HALF_UP INDEPENDENTLY, before the
          yield-to-worst comparison, and the stored reoffering_price_pct is the rounded figure,
          not a re-rounded full-precision one. Three tranches created in one deal pin the
          rounding: 106.058 (20 periods, coupon 5.000, yield 4.250), the pair 113.678 / 108.176
          (40 periods, yield 4.000, callable at 100.000 after 20 periods) and 109.522 (the same
          tranche called at 102.000). Truncation instead of half-up, or 2-decimal storage, moves
          every one of these.
        test_recipe:
          setup:
            - "A DRAFT deal dated 2026-08-01 so that 2036-08-01 is exactly 20 semiannual periods out and 2046-08-01 is exactly 40."
          setup_api_calls:
            - call: "POST /bond-offerings/firms"
              payload: { name: "Beta Municipal Advisors", firm_type: "MUNICIPAL_ADVISOR", msrb_registration_id: "MA0001" }
              as: ComplianceOfficer
              captures: { ma_firm_id: $.data.id }
            - call: "POST /bond-offerings/issuers"
              payload: { name: "City of Fairhaven", state_code: "OH", entity_type: "CITY" }
              as: ComplianceOfficer
              captures: { issuer_id: $.data.id }
            - call: "POST /bond-offerings/deals"
              payload: { issuer_id: "${issuer_id}", series_designation: "Series 2026A", tax_status: "TAX_EXEMPT", dated_date: "2026-08-01T00:00:00.000Z", expected_par_amount_usd: 15000000, municipal_advisor_firm_id: "${ma_firm_id}" }
              as: MunicipalAdvisor
              as_user_id: "${ma_firm_id}"
              captures: { deal_id: $.data.id }
          trigger:
            - call: "POST /bond-offerings/deals/${deal_id}/maturity-tranches"
              payload: { sequence_number: 1, maturity_date: "2036-08-01T00:00:00.000Z", principal_amount_usd: 5000000, coupon_rate_pct: 5.000, yield_pct: 4.250 }
              as: MunicipalAdvisor
              as_user_id: "${ma_firm_id}"
              captures: { t1_id: $.data.id }
            - call: "POST /bond-offerings/deals/${deal_id}/maturity-tranches"
              payload: { sequence_number: 2, maturity_date: "2046-08-01T00:00:00.000Z", principal_amount_usd: 5000000, coupon_rate_pct: 5.000, yield_pct: 4.000, is_callable: true, first_call_date: "2036-08-01T00:00:00.000Z", call_price_pct: 100.000 }
              as: MunicipalAdvisor
              as_user_id: "${ma_firm_id}"
              captures: { t2_id: $.data.id }
            - call: "POST /bond-offerings/deals/${deal_id}/maturity-tranches"
              payload: { sequence_number: 3, maturity_date: "2046-08-01T00:00:00.000Z", principal_amount_usd: 5000000, coupon_rate_pct: 5.000, yield_pct: 4.000, is_callable: true, first_call_date: "2036-08-01T00:00:00.000Z", call_price_pct: 102.000 }
              as: MunicipalAdvisor
              as_user_id: "${ma_firm_id}"
              captures: { t3_id: $.data.id }
          assert:
            - "all three: HTTP 201"
            - "MaturityTranche.${t1_id}.periods_to_maturity == 20, periods_to_call == null"
            - "MaturityTranche.${t1_id}.price_to_maturity_pct == 106.058 and price_to_call_pct == null"
            - "MaturityTranche.${t1_id}.reoffering_price_pct == 106.058 with exactly 3 decimal places"
            - "MaturityTranche.${t2_id}.periods_to_maturity == 40 and periods_to_call == 20"
            - "MaturityTranche.${t2_id}.price_to_maturity_pct == 113.678 and price_to_call_pct == 108.176"
            - "MaturityTranche.${t3_id}.price_to_call_pct == 109.522 and reoffering_price_pct == 109.522"

      - name: closing_an_empty_order_book_allots_nothing
        claim_type: waterfall_allocation
        grounds:
          - calculations.order_allotment_waterfall.worked_examples[no orders]
          - state_machines.OrderPeriod.OPEN_to_CLOSED
        distinguishing_aspect: |
          The degenerate waterfall input: closing with zero candidates must still count as a
          run (allotment_run_count 1, which is what pricing later requires) while leaving every
          tranche fully unsold and allotted_order_count 0. An implementation that guards the
          waterfall with 'if there are orders' and skips the run counter silently blocks pricing;
          one that divides by tier_demand crashes on the empty tier.
        test_recipe:
          setup:
            - "A COMPETITIVE deal of 10,000,000 with two tranches has an OPEN institutional order period and no orders at all."
            - "The logical clock stands at 2026-08-05T14:00:00.000Z."
          setup_api_calls:
            - call: "POST /bond-offerings/firms"
              payload: { name: "Beta Municipal Advisors", firm_type: "MUNICIPAL_ADVISOR", msrb_registration_id: "MA0001" }
              as: ComplianceOfficer
              captures: { ma_firm_id: $.data.id }
            - call: "POST /bond-offerings/firms"
              payload: { name: "Alpha Underwriting", firm_type: "UNDERWRITER", msrb_registration_id: "AU0001" }
              as: ComplianceOfficer
              captures: { uw_firm_id: $.data.id }
            - call: "POST /bond-offerings/issuers"
              payload: { name: "City of Fairhaven", state_code: "OH", entity_type: "CITY" }
              as: ComplianceOfficer
