              payload: { action: "ANNOUNCE" }
              as: MarketingCoordinator
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: HousingDeveloper
            - call: "POST /campaigns/${c}/transition"
              payload: { action: "OPEN" }
              as: HousingDeveloper
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-30T00:00:00Z" }
              as: HousingDeveloper
            - call: "POST /campaigns/${c}/transition"
              payload: { action: "CLOSE" }
              as: HousingDeveloper
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-05T00:00:00Z" }
              as: HousingDeveloper
            - call: "POST /applicants"
              payload: { full_name: "Ivy I", email: "i@x.com" }
              as: Anonymous
              captures: { ap: $.data.id }
          trigger:
            - call: "POST /applications"
              payload: { applicant_id: "${ap}", campaign_id: "${c}", household_size: 2, self_reported_annual_income_cents: 3000000 }
              as: Applicant
              as_user_id: "${ap}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_CAMPAIGN_NOT_OPEN (state, priority 6) — NOT ERR_APPLICATION_WINDOW_CLOSED (temporal, priority 8), though both conditions hold"
            - "no Application row is created for (${ap}, ${c})"

      - name: certify_segregated_and_over_income_safety_beats_fiscal
        grounds:
          - validations[priority=7]
          - validations[priority=11]
          - errors[ERR_SEGREGATION_OF_DUTIES]
          - errors[ERR_OVER_INCOME]
        distinguishing_aspect: |
          Category pair (business_safety vs business_fiscal) — disjoint from the state/temporal
          pair: the CERTIFY caller's X-User-ID previously EXECUTED this campaign's lottery
          (segregation violation) AND the documented income 6000000 exceeds the 4000000 limit
          (fiscal violation); priority 7 beats 11, so ERR_SEGREGATION_OF_DUTIES wins.
        test_recipe:
          setup:
            - "VERIFIED application hh=2 on a campaign whose lottery was SEALED+EXECUTED+PUBLISHED by X-User-ID 'shared-1'; AmiLimit(hh=2, AMI_50) = 4000000; certification at DOCS_RECEIVED with one SALARY source 500000 cents x 12 = 6000000 (over limit)"
