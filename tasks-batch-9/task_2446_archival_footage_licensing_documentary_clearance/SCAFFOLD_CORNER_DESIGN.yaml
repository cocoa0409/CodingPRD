      - name: approval_transition_without_approval_rights_rejected
        claim_type: precondition_enforcement
        grounds:
          - state_machines.SubjectRelease.transitions.SIGNED_to_APPROVAL_GRANTED
          - validations[priority=30]
          - errors.ERR_NO_APPROVAL_RIGHTS
        distinguishing_aspect: "A release signed with approval_rights NONE reaches SIGNED normally but must refuse BOTH approval outcomes; the guard is on the release's own configuration rather than on any other entity, and the default value of approval_rights is what makes it fire."
        test_recipe:
          setup: ["A production in CLEARANCE with one SIGNED SubjectRelease created without an approval_rights value (declared default NONE) and no asset_id."]
          setup_api_calls:
