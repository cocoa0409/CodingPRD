            - call: "POST /ipa/delegation-agreements/${agr_v5a}/state"
              payload: { to_state: "ACTIVE" }
              as: IpaAdmin
            - call: "POST /ipa/delegation-agreements"
              payload: { payer_name: "Corner Mismatch B Health", payer_tax_id: "94-3000064", delegation_scope: "FULL_RISK", base_pmpm_cents: 20000, reconciliation_method: "ROSTER_SNAPSHOT", ibnr_method: "COMPLETION_FACTOR", ibnr_completion_factor_bps: 8000, target_claims_pmpm_cents: 15000, professional_pool_share_bps: 6000, institutional_pool_share_bps: 4000, quality_withhold_bps: 700, stop_loss_attachment_cents: 5000000, reinsurance_recovery_bps: 9000, max_panel_size: 5 }
              as: IpaAdmin
              captures: { agr_v5b: "$.data.id" }
            - call: "POST /ipa/delegation-agreements/${agr_v5b}/state"
              payload: { to_state: "ACTIVE" }
              as: IpaAdmin
            - call: "POST /ipa/delegation-agreements/${agr_v5a}/physicians"
              payload: { npi: "4900000001", full_name: "Dr Mismatch Home", specialty: "FAMILY_MEDICINE" }
              as: NetworkManager
              captures: { p_v5a: "$.data.id" }
            - call: "POST /ipa/physicians/${p_v5a}/state"
              payload: { to_state: "CREDENTIALED" }
              as: NetworkManager
            - call: "POST /ipa/physicians/${p_v5a}/state"
              payload: { to_state: "ACTIVE" }
              as: NetworkManager
            - call: "POST /ipa/delegation-agreements/${agr_v5b}/physicians"
              payload: { npi: "4900000002", full_name: "Dr Mismatch Foreign", specialty: "FAMILY_MEDICINE" }
              as: NetworkManager
              captures: { p_v5b: "$.data.id" }
            - call: "POST /ipa/physicians/${p_v5b}/state"
              payload: { to_state: "CREDENTIALED" }
              as: NetworkManager
            - call: "POST /ipa/physicians/${p_v5b}/state"
              payload: { to_state: "ACTIVE" }
              as: NetworkManager
            - call: "POST /ipa/delegation-agreements/${agr_v5a}/enrollees"
              payload: { external_member_id: "V5-0001", age_band: "ADULT", benefit_tier: "HMO", risk_score_bps: 10000, coverage_start_date: "2026-01-01T00:00:00Z" }
              as: IpaAdmin
              captures: { e_v5: "$.data.id", e_v5_v: "$.data.version" }
          trigger:
            - call: "POST /ipa/member-assignments"
              payload: { enrollee_id: "${e_v5}", physician_id: "${p_v5b}", effective_date: "2026-08-01T00:00:00Z", assignment_source: "MANUAL", expected_enrollee_version: "${e_v5_v}" }
              as: NetworkManager
              captures: { mismatch_error: "$.data.error_id" }
            - call: "POST /ipa/member-assignments"
              payload: { enrollee_id: "${e_v5}", physician_id: "${p_v5a}", effective_date: "2026-08-01T00:00:00Z", assignment_source: "MANUAL", expected_enrollee_version: "${e_v5_v}" }
              as: NetworkManager
              captures: { ok_assignment: "$.data.id", ok_status: "$.data.status" }
          assert:
            - "call 1 returns HTTP 422 with ${mismatch_error} == \"ERR_AGREEMENT_MISMATCH\" — both parents exist, so neither ERR_ENROLLEE_NOT_FOUND nor ERR_PHYSICIAN_NOT_FOUND applies"
            - "PhysicianMember.${p_v5b}.panel_size == 0 and DelegationAgreement.${agr_v5b}.total_assigned_members == 0 after the rejection"
            - "call 2 returns HTTP 201 with ${ok_status} == \"ACTIVE\" and MemberAssignment.${ok_assignment}.physician_id == ${p_v5a}"
            - "${e_v5_v} is still accepted on call 2 — the rejected call 1 must not have incremented Enrollee.version"
            - "PhysicianMember.${p_v5a}.panel_size == 1 and DelegationAgreement.${agr_v5a}.total_assigned_members == 1"

      - name: pool_settled_before_settlement_due_date_returns_422_then_allowed_after
        claim_type: temporal_validation
        grounds:
          - validations.priority_17_ERR_SETTLEMENT_WINDOW_NOT_OPEN
          - state_machines.RiskPool.SETTLEMENT_PROPOSED_to_SETTLED
          - calculations.pool_settlement_waterfall
        distinguishing_aspect: |
          settlement_due_date is derived as pool_year_end plus
          SETTLEMENT_LAG_DAYS[PROFESSIONAL] = 180 days, i.e.
          2026-12-31T23:59:59Z + 180d = 2027-06-29T23:59:59Z. At clock
          2027-06-29T00:00:00Z the pool is fully proposed and otherwise legal, yet
          SETTLED must be refused with ERR_SETTLEMENT_WINDOW_NOT_OPEN; advancing
          the clock to 2027-06-30T00:00:00Z with no other change must let the
          identical request through and fire the withhold settlement side
          effects. An implementation that uses the 270-day institutional lag, or
          that compares against pool_year_end itself, gets the boundary wrong.
