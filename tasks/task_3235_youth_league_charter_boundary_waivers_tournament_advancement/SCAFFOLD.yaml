errors:
- id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
  http: 400
  condition: X-User-ID or X-User-Role header missing or invalid
- id: ERR_INSUFFICIENT_PERMISSIONS
  http: 403
  condition: Role not permitted for this operation
- id: ERR_INVALID_REQUEST
  http: 400
  condition: Missing required field, type mismatch, invalid enum, valid_until <= valid_from, tie score at finalize, target_division_id present/absent contrary to waiver_type, or duplicate non-REJECTED renewal
    for the same (league, season_year)
- id: ERR_LEAGUE_NOT_FOUND
  http: 404
  condition: leagueId does not exist
- id: ERR_DIVISION_NOT_FOUND
  http: 404
  condition: divisionId does not exist within the league
- id: ERR_PLAYER_NOT_FOUND
  http: 404
  condition: playerId does not exist within the league
- id: ERR_RENEWAL_NOT_FOUND
  http: 404
  condition: renewalId does not exist within the league
- id: ERR_WAIVER_NOT_FOUND
  http: 404
  condition: waiverId does not exist within the league
- id: ERR_VOLUNTEER_NOT_FOUND
  http: 404
  condition: volunteerId does not exist within the league
- id: ERR_SCREENING_NOT_FOUND
  http: 404
  condition: screeningId does not exist within the volunteer
- id: ERR_ROSTER_NOT_FOUND
  http: 404
  condition: rosterId does not exist within the league
- id: ERR_ENTRY_NOT_FOUND
  http: 404
  condition: entryId does not exist
- id: ERR_GAME_NOT_FOUND
  http: 404
  condition: gameId does not exist within the entry
- id: ERR_PROTEST_NOT_FOUND
  http: 404
  condition: protestId does not exist within the game
- id: ERR_LEAGUE_NOT_CHARTERED
  http: 409
  condition: Operation requires league charter_status CHARTERED (league is PROVISIONAL or SUSPENDED)
- id: ERR_RENEWAL_NOT_PENDING
  http: 409
  condition: decide requires renewal status SUBMITTED
- id: ERR_PLAYER_NOT_VERIFIABLE
  http: 409
  condition: verify-eligibility requires eligibility_status PENDING or INELIGIBLE
- id: ERR_PLAYER_NOT_ELIGIBLE
  http: 409
  condition: Operation requires player eligibility_status ELIGIBLE (selection, roster submit, revoke-eligibility)
- id: ERR_WAIVER_NOT_PENDING
  http: 409
  condition: decide APPROVE/DENY requires waiver PENDING; REVOKE requires APPROVED
- id: ERR_SCREENING_NOT_ADJUDICATABLE
  http: 409
  condition: adjudicate requires screening status SUBMITTED
- id: ERR_ROSTER_NOT_OPEN
  http: 409
  condition: selections require roster status OPEN or RECALLED (rejected when SUBMITTED or LOCKED)
- id: ERR_ROSTER_NOT_SUBMITTED
  http: 409
  condition: tournament entry creation requires roster status SUBMITTED
- id: ERR_ENTRY_NOT_ACTIVE
  http: 409
  condition: Operation requires entry status ACTIVE (games, advance; also opponent entry must be ACTIVE)
- id: ERR_GAME_NOT_IN_PROGRESS
  http: 409
  condition: 'Operation requires the game to accept play actions: appearances require SCHEDULED or IN_PROGRESS, finalize requires IN_PROGRESS'
- id: ERR_PROTEST_NOT_OPEN
  http: 409
  condition: resolve requires a FILED protest on a game with protest_status OPEN; advance requires no game with protest_status OPEN
- id: ERR_DUPLICATE_OPEN_PROTEST
  http: 409
  condition: A protest may only be filed while the game's protest_status is NONE
- id: ERR_AGE_DIVISION_MISMATCH
  http: 422
  condition: Player has no assigned division (league_age outside every standard range) and no approved waiver supplying one
- id: ERR_OUTSIDE_BOUNDARY
  http: 422
  condition: Neither residence nor school is within the league boundary and no APPROVED RESIDENCY_BOUNDARY waiver covers the current date
- id: ERR_NO_ELIGIBILITY_DOCUMENT
  http: 422
  condition: Missing BIRTH_CERTIFICATE or the residency-basis document (RESIDENCE_PROOF / SCHOOL_ENROLLMENT)
- id: ERR_DOCUMENT_EXPIRED
  http: 422
  condition: RESIDENCE_PROOF or SCHOOL_ENROLLMENT issued more than 365 days before the verification date
- id: ERR_REGISTRATION_WINDOW_CLOSED
  http: 422
  condition: verify-eligibility outside [season-01-01, season-04-30]
- id: ERR_RENEWAL_WINDOW_CLOSED
  http: 422
  condition: Renewal submission outside the ON_TIME and LATE windows for the requested season_year
- id: ERR_WAIVER_OVERLAP
  http: 409
  condition: Another APPROVED waiver for the same player and waiver_type has a half-open window intersecting this one
- id: ERR_SCREENING_WINDOW_INCOMPLETE
  http: 422
  condition: Screening [valid_from, valid_through] does not fully contain the season window [season-03-01, season-10-31]
- id: ERR_DISQUALIFYING_OFFENSE
  http: 422
  condition: adjudicate APPROVE attempted on a screening whose offense_category is VIOLENT_FELONY, SEXUAL_OFFENSE, or CHILD_ABUSE
- id: ERR_INSURANCE_NOT_ACTIVE
  http: 409
  condition: No ACTIVE InsuranceCertificate of the league contains the required window (season window for charter approval; clock date for game finalize)
- id: ERR_LATE_FEE_UNPAID
  http: 402
  condition: APPROVE of a LATE renewal without late_fee_paid true
- id: ERR_PITCH_COUNT_EXCEEDED
  http: 422
  condition: Effective pitch count exceeds the player's division pitch maximum
- id: ERR_REST_REQUIREMENT_VIOLATION
  http: 409
  condition: Clock date is before the player's latest eligible_again_on
- id: ERR_ROSTER_BELOW_MINIMUM
  http: 422
  condition: Roster submit with roster_size < 3
- id: ERR_ROSTER_ABOVE_MAXIMUM
  http: 422
  condition: Selection add would push roster_size above 5
- id: ERR_PARTICIPATION_THRESHOLD_NOT_MET
  http: 422
  condition: Player participation_pct < 60.00 at selection add or roster submit
- id: ERR_PLAYER_DIVISION_MISMATCH
  http: 422
  condition: Selected player's division_id differs from the roster's division_id
- id: ERR_PLAYER_NOT_ON_ROSTER
  http: 422
  condition: Pitching appearance player holds no ACTIVE selection on the entry's roster
- id: ERR_ADVANCEMENT_PREREQUISITE_NOT_MET
  http: 409
  condition: Non-DISTRICT entry without an ADVANCED entry at the preceding level, or advance without a FINAL WIN / with losses at the limit
- id: ERR_ALREADY_HIGHEST_LEVEL
  http: 409
  condition: advance attempted on a REGIONAL entry
- id: ERR_STALE_VERSION
  http: 412
  condition: expected_league_version or expected_game_version does not match the parent's current version
roles:
- name: DistrictAdministrator
  description: 'District-level authority: charters leagues, decides renewals and waivers, adjudicates screenings, records insurance, operates the logical clock'
  identity: opaque
  exclusive_operations:
  - POST /leagues
  - POST /leagues/{leagueId}/charter-renewals/{renewalId}/decide
  - POST /leagues/{leagueId}/boundary-waivers/{waiverId}/decide
  - POST /leagues/{leagueId}/volunteers/{volunteerId}/screenings/{screeningId}/adjudicate
  - POST /leagues/{leagueId}/insurance-certificates
  - POST /_clock/set_current_utc
  shared_operations:
  - all GET endpoints
- name: LeagueAdministrator
  description: 'Local league operator: renewals, division team counts, player registration and eligibility, waiver requests, volunteers, screenings, all-star rosters'
  identity: opaque
  exclusive_operations:
  - POST /leagues/{leagueId}/charter-renewals
  - PATCH /leagues/{leagueId}/divisions/{divisionId}
  - POST /leagues/{leagueId}/players
  - POST /leagues/{leagueId}/players/{playerId}/eligibility-documents
  - POST /leagues/{leagueId}/players/{playerId}/verify-eligibility
  - POST /leagues/{leagueId}/players/{playerId}/revoke-eligibility
  - POST /leagues/{leagueId}/boundary-waivers
  - POST /leagues/{leagueId}/volunteers
  - POST /leagues/{leagueId}/volunteers/{volunteerId}/screenings
  - POST /leagues/{leagueId}/all-star-rosters
  - POST /leagues/{leagueId}/all-star-rosters/{rosterId}/selections
  - POST /leagues/{leagueId}/all-star-rosters/{rosterId}/submit
  shared_operations:
  - all GET endpoints
- name: TournamentDirector
  description: 'Tournament authority: entries, games, finalization, protests, advancement'
  identity: opaque
  exclusive_operations:
  - POST /leagues/{leagueId}/tournament-entries
  - POST /tournament-entries/{entryId}/games
  - POST /tournament-entries/{entryId}/games/{gameId}/finalize
  - POST /tournament-entries/{entryId}/games/{gameId}/protests
  - POST /tournament-entries/{entryId}/games/{gameId}/protests/{protestId}/resolve
  - POST /tournament-entries/{entryId}/advance
