            - { call: "POST /millwork/orders", payload: { project_id: "${proj_id}", order_code: "O-A8", species: "OAK", profile_code: "PR-1", finish_system: "STAIN", sheen_target: "SATIN", hardware_prep_mode: "INSTALLER_PREP", fire_rating_required: "NONE" }, as: Estimator, captures: { ord_a: $.data.id } }
            - { call: "POST /millwork/openings", payload: { order_id: "${ord_a}", opening_no: "1", width_in: 36, height_in: 84, fire_rating: "NONE", required_on_site_date: "2026-10-01" }, as: Estimator }
            - { call: "PUT /millwork/orders/${ord_a}/status", payload: { target_status: "CONFIGURED" }, as: Estimator }
