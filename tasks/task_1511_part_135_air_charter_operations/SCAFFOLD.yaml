# =============================================================================
# Part 135 Air Charter Operations — benchmark seed tables (v1)
# =============================================================================

scenario: |
  Part 135 Air Charter Operations (Part 135 charter operator): trip request quoting by aircraft category & positioning legs, crew duty/rest legality check, aircraft availability & maintenance conflict, passenger manifest & TSA program screening, fuel stop & international permit, cancellation/weather policy & refund tier, owner-aircraft revenue share, FAA operations specification compliance

domain_name: part-135-air-charter
api_prefix: /charter

# =============================================================================
# Complexity Profile
# =============================================================================
complexity_profile:
  primary_archetype: temporal_windowing
  secondary_archetype: compliance_audit
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - scheduled_actions
  entity_topology: flat
  state_machine_shape: cyclic
  relationship_patterns: [one_to_many, cross_aggregate, polymorphic]
  role_model: peer_roles
  consistency_model: immediate
  difficulty_target: expert_plus
  entity_count: 15
  endpoint_count: 61
  error_code_count: 54
  state_machine_count: 9

# =============================================================================
# §1.1 Entity-Relationship Table (flat topology; all links are FK references)
# =============================================================================
entities:
  - name: AircraftOwner
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Owner legal name" }
      - { name: contact_email, type: string, source: input, description: "Owner contact email" }
      - { name: revenue_share_pct, type: number, source: input, description: "Owner percentage of gross charter revenue, 0..100" }
      - { name: guarantee_cents_per_block_min, type: integer, source: input, default: 0, description: "Owner minimum guarantee per logged block minute; 0 = no guarantee (STANDARD variant)" }

  - name: Aircraft
    parent: null
    common_fields: true
    fields:
      - { name: owner_id, type: string, source: input, description: "FK -> AircraftOwner.id; owner of this tail" }
      - { name: tail_number, type: string, source: input, description: "Registration tail number, unique" }
      - { name: category, type: enum, source: input, description: "TURBOPROP | LIGHT_JET | MIDSIZE_JET | HEAVY_JET" }
      - { name: home_base_icao, type: string, source: input, description: "Home base ICAO code" }
      - { name: seats, type: integer, source: input, description: "Certified passenger seats" }
      - { name: hourly_rate_cents, type: integer, source: input, description: "Actual-billing hourly rate for final price" }
      - { name: on_ops_spec, type: boolean, source: input, description: "Whether tail is listed on the operator's FAA operations specifications" }
      - { name: initial_airframe_minutes, type: integer, source: input, description: "Airframe minutes already flown when the tail is registered" }
      - { name: total_airframe_minutes, type: integer, source: computed, description: "initial_airframe_minutes + sum of actual_block_minutes over all FlightLogs for trips where this aircraft held the CONFIRMED assignment" }
      - { name: next_check_due_minutes, type: integer, source: input, description: "Airframe minutes at which the next 100h inspection is due" }
      - { name: status, type: enum, source: system, description: "AVAILABLE | IN_TRIP | MAINTENANCE_HOLD | GROUNDED" }

  - name: CrewMember
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Crew member name" }
      - { name: base_icao, type: string, source: input, description: "Home base ICAO code" }
      - { name: qualified_categories, type: array, source: input, description: "Array of aircraft category enums the crew member is type-qualified for" }
      - { name: status, type: enum, source: system, description: "ACTIVE | SUSPENDED; set ACTIVE on create, changed via PATCH" }

  - name: TripRequest
    parent: null
    common_fields: true
    fields:
      - { name: customer_name, type: string, source: input, description: "Charter customer name" }
      - { name: customer_email, type: string, source: input, description: "Charter customer email" }
      - { name: requested_category, type: enum, source: input, description: "TURBOPROP | LIGHT_JET | MIDSIZE_JET | HEAVY_JET" }
      - { name: origin_icao, type: string, source: input, description: "Departure airport ICAO" }
      - { name: destination_icao, type: string, source: input, description: "Arrival airport ICAO" }
      - { name: departure_at, type: datetime, source: input, description: "Planned departure (first leg), ISO8601 UTC" }
      - { name: passenger_count, type: integer, source: input, description: "Planned passenger count" }
      - { name: international, type: boolean, source: input, description: "Whether the trip crosses an international boundary" }
      - { name: status, type: enum, source: system, description: "QUOTE_DRAFT | QUOTED | BOOKED | DISPATCHED | COMPLETED | CANCELLED | EXPIRED" }
      - { name: payment_posture, type: enum, source: computed, description: "Parallel axis: UNPAID | DEPOSIT_PAID | PAID_IN_FULL | REFUNDED_PARTIAL | REFUNDED_FULL; derived from Payments vs quoted_total_cents" }
      - { name: quoted_total_cents, type: integer, source: computed, description: "Quote total from quote_price calculation; null until QUOTED" }
      - { name: deposit_required_cents, type: integer, source: computed, description: "round_half_up(quoted_total_cents * 0.25); null until QUOTED" }
      - { name: quote_valid_until, type: datetime, source: system, description: "quoted-at clock time + 48h; null until QUOTED" }
      - { name: collected_cents, type: integer, source: computed, description: "sum POSTED DEPOSIT+BALANCE minus sum POSTED REFUND" }
      - { name: final_total_cents, type: integer, source: computed, description: "Final price from final_price calculation; null until COMPLETED" }
      - { name: cancellation_reason, type: enum, source: system, description: "CUSTOMER | WEATHER | OPS; null unless CANCELLED" }
      - { name: cancellation_fee_cents, type: integer, source: computed, description: "Retained fee at cancellation; null unless CANCELLED" }
      - { name: refund_cents, type: integer, source: computed, description: "Refund issued at cancellation; null unless CANCELLED" }

  - name: QuoteLeg
    parent: null
    common_fields: true
    fields:
      - { name: trip_request_id, type: string, source: input, description: "FK -> TripRequest.id; owning trip" }
      - { name: seq_no, type: integer, source: input, description: "Leg sequence number within the trip, ascending" }
      - { name: leg_type, type: enum, source: input, description: "REVENUE | POSITIONING" }
      - { name: origin_icao, type: string, source: input, description: "Leg origin ICAO" }
      - { name: destination_icao, type: string, source: input, description: "Leg destination ICAO" }
      - { name: block_minutes, type: integer, source: input, description: "Planned block minutes, > 0" }
      - { name: fuel_stop, type: boolean, source: input, default: false, description: "Whether this leg includes a fuel stop surcharge" }

  - name: AircraftAssignment
    parent: null
    common_fields: true
    fields:
      - { name: trip_request_id, type: string, source: input, description: "FK -> TripRequest.id; assigned trip" }
      - { name: aircraft_id, type: string, source: input, description: "FK -> Aircraft.id; assigned tail" }
      - { name: status, type: enum, source: system, description: "TENTATIVE | CONFIRMED | RELEASED" }
      - { name: occupied_start_at, type: datetime, source: computed, description: "trip.departure_at - 45 min turnaround buffer" }
      - { name: occupied_end_at, type: datetime, source: computed, description: "trip.departure_at + sum(legs.block_minutes) + 45 min turnaround buffer; half-open interval end" }

  - name: CrewAssignment
    parent: null
    common_fields: true
    fields:
      - { name: trip_request_id, type: string, source: input, description: "FK -> TripRequest.id; assigned trip" }
      - { name: crew_member_id, type: string, source: input, description: "FK -> CrewMember.id; assigned crew member" }
      - { name: duty_role, type: enum, source: input, description: "PIC | SIC" }
      - { name: status, type: enum, source: system, description: "PROPOSED | VETTED | FLAGGED_ILLEGAL | RELEASED" }
      - { name: planned_duty_minutes, type: integer, source: computed, description: "sum(trip legs block_minutes) + 60 min report/debrief" }
      - { name: duty_legal, type: boolean, source: computed, description: "planned_duty_minutes <= 840; null until vetted" }
      - { name: rest_legal, type: boolean, source: computed, description: "every gap to another VETTED assignment of the same crew member >= 600 min; null until vetted" }
      - { name: vetted_at, type: datetime, source: system, description: "Clock time of last vet; null until vetted" }

  - name: MaintenanceWindow
    parent: null
    common_fields: true
    fields:
      - { name: aircraft_id, type: string, source: input, description: "FK -> Aircraft.id; tail under maintenance" }
      - { name: window_type, type: enum, source: input, description: "INSPECTION_100H | ANNUAL | AOG_REPAIR" }
      - { name: starts_at, type: datetime, source: input, description: "Window start, ISO8601 UTC; closed interval start" }
      - { name: ends_at, type: datetime, source: input, description: "Window end, ISO8601 UTC; closed interval end, must be > starts_at" }
      - { name: status, type: enum, source: system, description: "PLANNED | ACTIVE | COMPLETED | CANCELLED" }

  - name: Passenger
    parent: null
    common_fields: true
    fields:
      - { name: trip_request_id, type: string, source: input, description: "FK -> TripRequest.id; manifest trip" }
      - { name: full_name, type: string, source: input, description: "Passenger full legal name" }
      - { name: date_of_birth, type: string, source: input, description: "Passenger date of birth, ISO8601 date" }
      - { name: tsa_status, type: enum, source: system, description: "PENDING | CLEARED | DENIED | EXPIRED" }
      - { name: screened_at, type: datetime, source: system, description: "Clock time of last screening decision; null until screened" }

  - name: OverflightPermit
    parent: null
    common_fields: true
    fields:
      - { name: trip_request_id, type: string, source: input, description: "FK -> TripRequest.id; trip requiring the permit" }
      - { name: country_code, type: string, source: input, description: "Two-letter country code of the permit authority" }
      - { name: permit_type, type: enum, source: input, description: "OVERFLIGHT | LANDING" }
      - { name: required, type: boolean, source: input, default: true, description: "Whether dispatch is gated on this permit being GRANTED" }
      - { name: status, type: enum, source: system, description: "REQUESTED | GRANTED | DENIED | EXPIRED" }
      - { name: decided_at, type: datetime, source: system, description: "Clock time of grant/deny decision; null until decided" }

  - name: Payment
    parent: null
    common_fields: false
    fields:
      - { name: trip_request_id, type: string, source: input, description: "FK -> TripRequest.id; trip being paid" }
      - { name: payment_type, type: enum, source: input, description: "DEPOSIT | BALANCE | REFUND" }
      - { name: amount_cents, type: integer, source: input, description: "Payment amount in cents, > 0" }
      - { name: status, type: enum, source: system, description: "POSTED (immutable; only value)" }

  - name: FlightLog
    parent: null
    common_fields: false
    fields:
      - { name: trip_request_id, type: string, source: input, description: "FK -> TripRequest.id; flown trip" }
      - { name: quote_leg_id, type: string, source: input, description: "FK -> QuoteLeg.id; leg actually flown" }
      - { name: actual_block_minutes, type: integer, source: input, description: "Actual block minutes flown, > 0" }
      - { name: departed_at, type: datetime, source: input, description: "Actual departure, ISO8601 UTC" }
      - { name: arrived_at, type: datetime, source: input, description: "Actual arrival, ISO8601 UTC, must be > departed_at" }
      - { name: recorded_by_crew_id, type: string, source: system, description: "CrewMember.id taken from X-User-ID of the recording CrewMember (must be the trip's VETTED PIC)" }

  - name: OwnerStatement
    parent: null
    common_fields: true
    fields:
      - { name: owner_id, type: string, source: system, description: "FK -> AircraftOwner.id; statement recipient (owner of the CONFIRMED assignment's aircraft)" }
      - { name: trip_request_id, type: string, source: system, description: "FK -> TripRequest.id; completed trip being settled" }
      - { name: gross_cents, type: integer, source: computed, description: "trip.final_total_cents at completion" }
      - { name: standard_share_cents, type: integer, source: computed, description: "round_half_up(gross_cents * owner.revenue_share_pct / 100)" }
      - { name: guarantee_floor_cents, type: integer, source: computed, description: "owner.guarantee_cents_per_block_min * sum(actual_block_minutes over the trip's FlightLogs)" }
      - { name: owner_share_cents, type: integer, source: computed, description: "max(standard_share_cents, guarantee_floor_cents)" }
      - { name: operator_retained_cents, type: integer, source: computed, description: "gross_cents - owner_share_cents (residual; may go negative when the guarantee binds)" }
      - { name: status, type: enum, source: system, description: "DRAFT | ISSUED" }
      - { name: issued_at, type: datetime, source: system, description: "Clock time of issuance; null until ISSUED" }

  - name: ComplianceFinding
    parent: null
    common_fields: true
    fields:
      - { name: subject_type, type: enum, source: input, description: "AIRCRAFT | CREW_MEMBER | TRIP_REQUEST; selects which entity collection subject_id belongs to (polymorphic reference, resolved with subject_id)" }
      - { name: subject_id, type: string, source: input, description: "Polymorphic subject id interpreted via subject_type; not a fixed foreign key" }
      - { name: finding_code, type: string, source: input, description: "Finding code, e.g. OPSPEC-A001" }
      - { name: grounding, type: boolean, source: input, description: "When true and subject is an Aircraft, blocks dispatch and return-to-service while OPEN" }
      - { name: notes, type: string, source: input, description: "Free-text notes" }
      - { name: status, type: enum, source: system, description: "OPEN | RESOLVED" }
      - { name: resolved_at, type: datetime, source: system, description: "Clock time of resolution; null until RESOLVED" }

  - name: WeatherAdvisory
    parent: null
    common_fields: false
    fields:
      - { name: station_icao, type: string, source: input, description: "ICAO station the advisory covers" }
      - { name: severity, type: enum, source: input, description: "SIGMET | CONVECTIVE | WINTER | OTHER" }
      - { name: starts_at, type: datetime, source: input, description: "Advisory effective start, ISO8601 UTC; closed interval" }
      - { name: ends_at, type: datetime, source: input, description: "Advisory effective end, ISO8601 UTC; closed interval, must be > starts_at" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Aircraft
    initial_state: AVAILABLE
    terminal_states: []
    transitions:
      - from: AVAILABLE
        to: IN_TRIP
        trigger: "POST /charter/trip-requests/{id}/dispatch with a CONFIRMED AircraftAssignment on this aircraft"
        actor: DispatchManager
        preconditions:
          - "TripRequest.status == BOOKED and all dispatch gates pass (see TripRequest BOOKED->DISPATCHED)"
        side_effects:
          - "Aircraft.status -> IN_TRIP"
      - from: IN_TRIP
        to: AVAILABLE
        trigger: "system (final leg FlightLog posted: all QuoteLegs of the trip have a FlightLog)"
        actor: system
        preconditions:
          - "total_airframe_minutes < next_check_due_minutes after accumulating the logged minutes"
          - "no MaintenanceWindow with status == ACTIVE on this aircraft"
        side_effects:
          - "Aircraft.status -> AVAILABLE"
      - from: IN_TRIP
        to: MAINTENANCE_HOLD
        trigger: "system (final leg FlightLog posted and total_airframe_minutes >= next_check_due_minutes, or an ACTIVE MaintenanceWindow exists)"
        actor: system
        preconditions:
          - "total_airframe_minutes >= next_check_due_minutes OR an ACTIVE MaintenanceWindow exists on this aircraft"
        side_effects:
          - "Aircraft.status -> MAINTENANCE_HOLD"
          - "Every AircraftAssignment on this aircraft with status == TENTATIVE -> RELEASED (cascade depth-3 link of the flight-log chain: FlightLog -> TripRequest COMPLETED -> Aircraft MAINTENANCE_HOLD -> TENTATIVE assignments RELEASED)"
      - from: AVAILABLE
        to: MAINTENANCE_HOLD
        trigger: "system (POST /charter/_clock/set_current_utc activates a PLANNED MaintenanceWindow whose starts_at <= now)"
        actor: system
        preconditions:
          - "Aircraft not IN_TRIP"
        side_effects:
          - "Aircraft.status -> MAINTENANCE_HOLD"
      - from: MAINTENANCE_HOLD
        to: AVAILABLE
        trigger: "POST /charter/maintenance-windows/{id}/complete on the last ACTIVE window"
        actor: MaintenanceController
        preconditions:
          - "No other MaintenanceWindow with status == ACTIVE on this aircraft"
          - "total_airframe_minutes < next_check_due_minutes after any check-due update"
        side_effects:
          - "Aircraft.status -> AVAILABLE"
      - from: [AVAILABLE, MAINTENANCE_HOLD]
        to: GROUNDED
        trigger: "POST /charter/aircraft/{id}/ground"
        actor: ComplianceOfficer
        preconditions:
          - "Aircraft.status in {AVAILABLE, MAINTENANCE_HOLD} (ERR_INVALID_STATE otherwise)"
        side_effects:
          - "Aircraft.status -> GROUNDED"
          - "Every AircraftAssignment on this aircraft with status in {TENTATIVE, CONFIRMED} -> RELEASED (cascade link 2)"
          - "Every TripRequest whose CONFIRMED assignment was just released and whose status == BOOKED -> QUOTED (cascade link 3; a new aircraft must be confirmed before dispatch)"
      - from: GROUNDED
        to: AVAILABLE
        trigger: "POST /charter/aircraft/{id}/return-to-service"
        actor: ComplianceOfficer
        preconditions:
          - "Aircraft.status == GROUNDED (ERR_AIRCRAFT_NOT_GROUNDED otherwise)"
          - "No ComplianceFinding with subject_type == AIRCRAFT, subject_id == this aircraft, grounding == true, status == OPEN (ERR_GROUNDING_FINDING_OPEN)"
        side_effects:
          - "Aircraft.status -> AVAILABLE"

  - entity: TripRequest
    initial_state: QUOTE_DRAFT
    terminal_states: [COMPLETED, CANCELLED, EXPIRED]
    note: "status evolves on the booking axis; payment_posture is a parallel derived axis (UNPAID -> DEPOSIT_PAID -> PAID_IN_FULL, then REFUNDED_PARTIAL | REFUNDED_FULL on cancellation) driven solely by Payment rows and never directly set."
    transitions:
      - from: QUOTE_DRAFT
        to: QUOTED
        trigger: "POST /charter/trip-requests/{id}/quote"
        actor: SalesAgent
        preconditions:
          - "TripRequest.status == QUOTE_DRAFT (ERR_TRIP_NOT_QUOTE_DRAFT)"
          - "At least one QuoteLeg exists for the trip (ERR_INVALID_REQUEST)"
        side_effects:
          - "Run quote_price calculation; set quoted_total_cents, deposit_required_cents"
          - "quote_valid_until = current clock + 48h"
          - "Every TENTATIVE AircraftAssignment on this trip: occupied_start_at/occupied_end_at recomputed from the current legs (itinerary may have changed while QUOTE_DRAFT)"
          - "TripRequest.version incremented"
      - from: QUOTED
        to: QUOTE_DRAFT
        trigger: "POST /charter/trip-requests/{id}/requote"
        actor: SalesAgent
        preconditions:
          - "TripRequest.status == QUOTED (ERR_TRIP_NOT_QUOTED)"
          - "expected_trip_request_version == current TripRequest.version (ERR_STALE_VERSION)"
        side_effects:
          - "quoted_total_cents, deposit_required_cents, quote_valid_until cleared to null"
          - "CrewAssignments on this trip in {VETTED, FLAGGED_ILLEGAL} -> PROPOSED; duty_legal, rest_legal, vetted_at cleared (re-vet loop)"
          - "TripRequest.version incremented"
      - from: QUOTED
        to: BOOKED
        trigger: "POST /charter/trip-requests/{id}/book"
        actor: SalesAgent
        preconditions:
          - "TripRequest.status == QUOTED (ERR_TRIP_NOT_QUOTED)"
          - "current clock <= quote_valid_until (otherwise the clock-set auto-transition has already moved the trip to EXPIRED)"
          - "deposit_cents >= deposit_required_cents (ERR_DEPOSIT_INSUFFICIENT)"
        side_effects:
          - "Payment {payment_type: DEPOSIT, amount_cents: deposit_cents, status: POSTED} created"
          - "payment_posture recomputed (DEPOSIT_PAID, or PAID_IN_FULL if deposit covers the whole quote)"
          - "TripRequest.version incremented"
      - from: BOOKED
        to: DISPATCHED
        trigger: "POST /charter/trip-requests/{id}/dispatch"
        actor: DispatchManager
        preconditions:
          - "TripRequest.status == BOOKED (ERR_TRIP_NOT_BOOKED)"
          - "Exactly one AircraftAssignment with status == CONFIRMED exists for the trip (ERR_NO_CONFIRMED_ASSIGNMENT)"
          - "Crew: at least one CrewAssignment duty_role == PIC with status == VETTED and duty_legal && rest_legal; if the assigned aircraft category == HEAVY_JET, also at least one VETTED legal SIC (ERR_CREW_NOT_VETTED)"
          - "count(Passenger rows of the trip) == passenger_count (ERR_PASSENGER_MANIFEST_INCOMPLETE)"
          - "Every Passenger has tsa_status == CLEARED (ERR_TSA_NOT_CLEARED)"
          - "If international == true: at least one OverflightPermit exists and every required == true permit has status == GRANTED (ERR_PERMIT_NOT_GRANTED)"
          - "aircraft.total_airframe_minutes + sum(legs.block_minutes) <= aircraft.next_check_due_minutes (ERR_CHECK_HOURS_EXCEEDED)"
          - "No OPEN grounding ComplianceFinding on the assigned aircraft (ERR_GROUNDING_FINDING_OPEN)"
          - "collected_cents >= quoted_total_cents (ERR_BALANCE_NOT_SETTLED)"
        side_effects:
          - "TripRequest.status -> DISPATCHED"
          - "Assigned aircraft: AVAILABLE -> IN_TRIP"
          - "TripRequest.version incremented"
      - from: DISPATCHED
        to: COMPLETED
        trigger: "system (final leg FlightLog posted)"
        actor: system
        preconditions:
          - "Every QuoteLeg of the trip has exactly one FlightLog"
        side_effects:
          - "Run final_price calculation; set final_total_cents"
          - "Aircraft.status resolved (IN_TRIP -> AVAILABLE or MAINTENANCE_HOLD; on MAINTENANCE_HOLD, TENTATIVE assignments on that aircraft -> RELEASED)"
          - "OwnerStatement created in DRAFT for the aircraft's owner via owner_statement calculation"
          - "CrewAssignments on this trip in {PROPOSED, VETTED, FLAGGED_ILLEGAL} -> RELEASED"
      - from: [QUOTE_DRAFT, QUOTED, BOOKED, DISPATCHED]
        to: CANCELLED
        trigger: "POST /charter/trip-requests/{id}/cancel"
        actor: SalesAgent
        preconditions:
          - "TripRequest.status in {QUOTE_DRAFT, QUOTED, BOOKED} for reason == CUSTOMER; DISPATCHED additionally allowed for reason in {WEATHER, OPS} (ERR_TRIP_NOT_CANCELLABLE otherwise)"
          - "reason == WEATHER requires a WeatherAdvisory whose station_icao in {origin_icao, destination_icao} and starts_at <= departure_at <= ends_at (ERR_NO_ACTIVE_WEATHER_ADVISORY)"
        side_effects:
          - "Run cancellation_refund calculation; set cancellation_reason, cancellation_fee_cents, refund_cents"
          - "If refund_cents > 0: Payment {payment_type: REFUND, amount_cents: refund_cents, status: POSTED} created"
          - "AircraftAssignments in {TENTATIVE, CONFIRMED} -> RELEASED (link 1)"
          - "If the released assignment was CONFIRMED and the aircraft was IN_TRIP (post-dispatch cancel): aircraft -> AVAILABLE unless an ACTIVE MaintenanceWindow exists, in which case MAINTENANCE_HOLD (link 2)"
          - "CrewAssignments in {PROPOSED, VETTED, FLAGGED_ILLEGAL} -> RELEASED"
          - "payment_posture recomputed (REFUNDED_FULL when fee == 0 and refund > 0; REFUNDED_PARTIAL when fee > 0 and refund > 0; unchanged when refund == 0)"
      - from: QUOTED
        to: EXPIRED
        trigger: "system (POST /charter/_clock/set_current_utc advances the clock beyond quote_valid_until)"
        actor: system
        preconditions:
          - "TripRequest.status == QUOTED and now > quote_valid_until"
        side_effects:
          - "TripRequest.status -> EXPIRED"
          - "TripRequest.version incremented"

  - entity: AircraftAssignment
    initial_state: TENTATIVE
    terminal_states: [RELEASED]
    transitions:
      - from: TENTATIVE
        to: CONFIRMED
        trigger: "POST /charter/aircraft-assignments/{id}/confirm"
        actor: DispatchManager
        preconditions:
          - "AircraftAssignment.status == TENTATIVE (ERR_ASSIGNMENT_NOT_TENTATIVE)"
          - "TripRequest.status == BOOKED (ERR_TRIP_NOT_BOOKED)"
          - "Aircraft.status == AVAILABLE (ERR_AIRCRAFT_NOT_AVAILABLE)"
          - "Aircraft.on_ops_spec == true (ERR_AIRCRAFT_NOT_ON_OPS_SPEC)"
          - "No other CONFIRMED AircraftAssignment on the same aircraft whose half-open occupied interval [occupied_start_at, occupied_end_at) intersects this one (ERR_AIRCRAFT_SCHEDULE_CONFLICT)"
          - "No MaintenanceWindow on the same aircraft with status in {PLANNED, ACTIVE} whose closed interval [starts_at, ends_at] intersects the raw flight interval [departure_at, departure_at + sum(block_minutes)] — touching endpoints count as intersection (ERR_MAINTENANCE_CONFLICT)"
          - "Aircraft.category == TripRequest.requested_category (ERR_CATEGORY_MISMATCH)"
        side_effects:
          - "AircraftAssignment.status -> CONFIRMED"
      - from: [TENTATIVE, CONFIRMED]
        to: RELEASED
        trigger: "POST /charter/aircraft-assignments/{id}/release, or system (supersede by a new assignment on the same trip, trip cancel, trip completion cascade, aircraft ground cascade, maintenance-hold cascade)"
        actor: "DispatchManager or system"
        preconditions:
          - "AircraftAssignment.status in {TENTATIVE, CONFIRMED} (ERR_ASSIGNMENT_ALREADY_RELEASED)"
        side_effects:
          - "AircraftAssignment.status -> RELEASED"
          - "System-triggered releases from ground cascade additionally revert the trip BOOKED -> QUOTED (see Aircraft ground)"

  - entity: CrewAssignment
    initial_state: PROPOSED
    terminal_states: [RELEASED]
    transitions:
      - from: PROPOSED
        to: VETTED
        trigger: "POST /charter/crew-assignments/{id}/vet (legality passes)"
        actor: DispatchManager
        preconditions:
          - "CrewAssignment.status == PROPOSED (ERR_CREW_ASSIGNMENT_NOT_PROPOSED)"
          - "CrewMember.status == ACTIVE (ERR_INVALID_STATE)"
        side_effects:
          - "Run crew_duty_legality calculation; set planned_duty_minutes, duty_legal, rest_legal, vetted_at"
          - "duty_legal && rest_legal -> status VETTED"
      - from: PROPOSED
        to: FLAGGED_ILLEGAL
        trigger: "POST /charter/crew-assignments/{id}/vet (legality fails)"
        actor: DispatchManager
        preconditions:
          - "CrewAssignment.status == PROPOSED"
          - "CrewMember.status == ACTIVE"
        side_effects:
          - "Run crew_duty_legality; set planned_duty_minutes, duty_legal, rest_legal, vetted_at"
          - "NOT (duty_legal && rest_legal) -> status FLAGGED_ILLEGAL"
      - from: [VETTED, FLAGGED_ILLEGAL]
        to: PROPOSED
        trigger: "system (QuoteLeg added or deleted on the trip, or trip requoted — itinerary changed)"
        actor: system
        preconditions: []
        side_effects:
          - "CrewAssignment.status -> PROPOSED; duty_legal, rest_legal, vetted_at cleared"
      - from: [PROPOSED, VETTED, FLAGGED_ILLEGAL]
        to: RELEASED
        trigger: "system (trip cancelled or completed)"
        actor: system
        preconditions: []
        side_effects:
          - "CrewAssignment.status -> RELEASED"

  - entity: MaintenanceWindow
    initial_state: PLANNED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: PLANNED
        to: ACTIVE
        trigger: "system (POST /charter/_clock/set_current_utc: starts_at <= now)"
        actor: system
        preconditions:
          - "Aircraft.status != IN_TRIP (activation is skipped while the tail is flying; re-evaluated on the next clock-set)"
        side_effects:
          - "MaintenanceWindow.status -> ACTIVE"
          - "Aircraft AVAILABLE -> MAINTENANCE_HOLD"
      - from: ACTIVE
        to: COMPLETED
        trigger: "POST /charter/maintenance-windows/{id}/complete"
        actor: MaintenanceController
        preconditions:
          - "MaintenanceWindow.status == ACTIVE (ERR_WINDOW_NOT_COMPLETABLE)"
        side_effects:
          - "MaintenanceWindow.status -> COMPLETED"
          - "If window_type == INSPECTION_100H: aircraft.next_check_due_minutes = aircraft.total_airframe_minutes + 6000"
          - "If no other ACTIVE windows on the aircraft and total_airframe_minutes < next_check_due_minutes: aircraft MAINTENANCE_HOLD -> AVAILABLE"
      - from: PLANNED
        to: CANCELLED
        trigger: "POST /charter/maintenance-windows/{id}/cancel"
        actor: MaintenanceController
        preconditions:
          - "MaintenanceWindow.status == PLANNED (ERR_INVALID_STATE otherwise)"
        side_effects:
          - "MaintenanceWindow.status -> CANCELLED"

  - entity: Passenger
    initial_state: PENDING
    terminal_states: [DENIED]
    note: "Machine field is tsa_status."
    transitions:
      - from: [PENDING, EXPIRED]
        to: CLEARED
        trigger: "POST /charter/passengers/{id}/screen with outcome == CLEARED"
        actor: ComplianceOfficer
        preconditions:
          - "Passenger.tsa_status in {PENDING, EXPIRED} (ERR_PASSENGER_NOT_SCREENABLE)"
        side_effects:
          - "tsa_status -> CLEARED; screened_at = current clock"
      - from: [PENDING, EXPIRED]
        to: DENIED
        trigger: "POST /charter/passengers/{id}/screen with outcome == DENIED"
        actor: ComplianceOfficer
        preconditions:
          - "Passenger.tsa_status in {PENDING, EXPIRED}"
        side_effects:
          - "tsa_status -> DENIED; screened_at = current clock"
      - from: CLEARED
        to: EXPIRED
        trigger: "system (POST /charter/_clock/set_current_utc: now > screened_at + 72h)"
        actor: system
        preconditions: []
        side_effects:
          - "tsa_status -> EXPIRED"

  - entity: OverflightPermit
    initial_state: REQUESTED
    terminal_states: [DENIED, EXPIRED]
    transitions:
      - from: REQUESTED
        to: GRANTED
        trigger: "POST /charter/overflight-permits/{id}/decide with decision == GRANTED"
        actor: ComplianceOfficer
        preconditions:
          - "OverflightPermit.status == REQUESTED (ERR_PERMIT_NOT_DECIDABLE)"
        side_effects:
          - "status -> GRANTED; decided_at = current clock"
      - from: REQUESTED
        to: DENIED
        trigger: "POST /charter/overflight-permits/{id}/decide with decision == DENIED"
        actor: ComplianceOfficer
        preconditions:
          - "OverflightPermit.status == REQUESTED"
        side_effects:
          - "status -> DENIED; decided_at = current clock"
      - from: GRANTED
        to: EXPIRED
        trigger: "system (POST /charter/_clock/set_current_utc: now > decided_at + 30 days)"
        actor: system
        preconditions: []
        side_effects:
          - "status -> EXPIRED"

  - entity: OwnerStatement
    initial_state: DRAFT
    terminal_states: [ISSUED]
    transitions:
      - from: DRAFT
        to: ISSUED
        trigger: "POST /charter/owner-statements/{id}/issue"
        actor: OpsAdmin
        preconditions:
          - "OwnerStatement.status == DRAFT (ERR_STATEMENT_NOT_DRAFT)"
        side_effects:
          - "status -> ISSUED; issued_at = current clock"

  - entity: ComplianceFinding
    initial_state: OPEN
    terminal_states: [RESOLVED]
    transitions:
      - from: OPEN
        to: RESOLVED
        trigger: "POST /charter/compliance-findings/{id}/resolve"
        actor: ComplianceOfficer
        preconditions:
          - "ComplianceFinding.status == OPEN (ERR_FINDING_ALREADY_RESOLVED)"
        side_effects:
          - "status -> RESOLVED; resolved_at = current clock"

# =============================================================================
# §1.2.1 Concurrency Rules (OCC only)
# =============================================================================
concurrency_rules:
  - rule_id: requote-stale-trip-version
    parent_entity: TripRequest
    write_endpoint: "POST /charter/trip-requests/{id}/requote"
    occ_field: expected_trip_request_version
    description: |
      Requoting a TripRequest whose version has advanced since the client last
      observed it is rejected. Another writer may have rebooked, requoted, or
      re-priced the trip; the current writer's quoted snapshot is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: assignment-create-stale-trip-version
    parent_entity: TripRequest
    write_endpoint: "POST /charter/aircraft-assignments"
    occ_field: expected_trip_request_version
    description: |
      Creating an AircraftAssignment against a TripRequest whose version has
      advanced since the client last observed it is rejected. Creating an
      assignment legitimately supersedes (releases) any prior TENTATIVE
      assignment on the trip, so a writer acting on an old version of the trip
      must be turned away.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: quote_price
    trigger: "POST /charter/trip-requests/{id}/quote"
    algorithm: tiered_pricing
    formula: |
      Rates are the published category rate card (constants), NOT any aircraft's
      hourly_rate_cents (no aircraft is assigned at quote time).
      Rounding order is pinned: round each leg charge to whole cents FIRST
      (round_half_up), then sum. Do not sum raw amounts and round once.
        per leg, in seq_no order:
          base = block_minutes * CATEGORY_RATE_CENTS_PER_HOUR[requested_category] / 60
          if leg_type == POSITIONING: base = base * 0.6
          leg_charge = round_half_up(base)
        legs_total = sum(leg_charge)
        volume_discount = 0
        if legs_total >= 5000000: volume_discount = round_half_up(legs_total * 0.10)
        elif legs_total >= 2000000: volume_discount = round_half_up(legs_total * 0.05)
        fuel_surcharge = round_half_up((legs_total - volume_discount) * 0.08)
        Evaluation order pinned: legs_total -> volume_discount tier -> fuel_surcharge
        on the DISCOUNTED amount -> total. Computing the surcharge on the
        pre-discount legs_total is a different (wrong) number.
        stop_fees = 15000 * count(legs with fuel_stop == true)
        intl_fee = 250000 if trip.international else 0
        quoted_total_cents = legs_total - volume_discount + fuel_surcharge + stop_fees + intl_fee
        deposit_required_cents = round_half_up(quoted_total_cents * 0.25)
        quote_valid_until = current clock + 48h
    input_set: "All QuoteLegs of the trip (any seq_no), evaluated in seq_no ASC order"
    constants:
      CATEGORY_RATE_CENTS_PER_HOUR: { TURBOPROP: 150000, LIGHT_JET: 250000, MIDSIZE_JET: 400000, HEAVY_JET: 650000 }
      POSITIONING_RATE_FACTOR: 0.6
      DISCOUNT_TIER1_THRESHOLD_CENTS: 2000000
      DISCOUNT_TIER1_PCT: 0.05
      DISCOUNT_TIER2_THRESHOLD_CENTS: 5000000
      DISCOUNT_TIER2_PCT: 0.10
      FUEL_SURCHARGE_PCT: 0.08
      FUEL_STOP_FEE_CENTS: 15000
      INTL_FEE_CENTS: 250000
      DEPOSIT_PCT: 0.25
      QUOTE_VALIDITY_HOURS: 48
    precision: "integer cents, round_half_up per leg charge and per fee step"

  - name: final_price
    trigger: "system (final leg FlightLog posted; trip DISPATCHED -> COMPLETED)"
    algorithm: aggregation
    formula: |
      Uses the CONFIRMED assignment aircraft's hourly_rate_cents (actual tail
      rate), NOT the category rate card. No volume discount, no fuel surcharge
      on final. Per leg, in seq_no order:
        if leg_type == REVENUE:
          billed_minutes = max(FlightLog.actual_block_minutes, 60)
          leg_charge = round_half_up(billed_minutes * aircraft.hourly_rate_cents / 60)
        if leg_type == POSITIONING:
          billed_minutes = QuoteLeg.block_minutes (planned, regardless of actual)
          leg_charge = round_half_up(billed_minutes * aircraft.hourly_rate_cents * 0.6 / 60)
      legs_total_final = sum(leg_charge)   (round per leg first, then sum — same pinned order as quote_price)
      stop_fees = 15000 * count(legs with fuel_stop == true)
      intl_fee = 250000 if trip.international else 0
      final_total_cents = legs_total_final + stop_fees + intl_fee
    input_set: "All QuoteLegs of the trip joined to their FlightLog (exactly one per leg at completion)"
    constants:
      MIN_BILLED_REVENUE_LEG_MINUTES: 60
      POSITIONING_RATE_FACTOR: 0.6
      FUEL_STOP_FEE_CENTS: 15000
      INTL_FEE_CENTS: 250000
    precision: "integer cents, round_half_up per leg"
    variants:
      - name: QUOTED_VARIANT
        when: "TripRequest in QUOTED..DISPATCHED — quote_price on planned minutes with the category rate card, discount and surcharge applied"
        difference: "Produces quoted_total_cents; differs from final whenever actual minutes differ from planned, the aircraft hourly rate differs from the rate card, the 60-minute minimum bites, or discount/surcharge do not apply to final"
      - name: FINAL_VARIANT
        when: "TripRequest COMPLETED — final_price on logged actuals with the aircraft rate"
        difference: "Produces final_total_cents; no volume discount, no fuel surcharge, minimum 60 billed minutes per revenue leg, positioning billed at planned minutes"

  - name: cancellation_refund
    trigger: "POST /charter/trip-requests/{id}/cancel"
    algorithm: threshold
    formula: |
      collected = trip.collected_cents (sum POSTED DEPOSIT+BALANCE minus REFUND, pre-cancel)
      hours_before = (trip.departure_at - current clock) in hours (fractional allowed)
      if reason in {WEATHER, OPS}: fee_pct = 0
      elif hours_before >= 72: fee_pct = 0.10
      elif hours_before >= 24: fee_pct = 0.50
      else: fee_pct = 1.00
      cancellation_fee_cents = round_half_up(collected * fee_pct)
      refund_cents = collected - cancellation_fee_cents
      Boundary precision: exactly 72.0h before -> 10% tier (>=); exactly 24.0h -> 50% tier.
      Inputs with non-linear interaction: hours_before (tiers), reason (waiver),
      collected (base). Refund is computed on COLLECTED, not on quoted_total.
    input_set: "The trip, its POSTED Payments, and (for WEATHER) WeatherAdvisories on origin/destination stations"
    constants:
      TIER_FULL_REFUND_HOURS: 72
      TIER_HALF_REFUND_HOURS: 24
      FEE_PCT_TIER1: 0.10
      FEE_PCT_TIER2: 0.50
      FEE_PCT_TIER3: 1.00
    precision: "integer cents, round_half_up on the fee"

  - name: crew_duty_legality
    trigger: "POST /charter/crew-assignments/{id}/vet"
    algorithm: threshold
    formula: |
      planned_duty_minutes = sum(block_minutes over the trip's QuoteLegs) + 60
      duty_legal = planned_duty_minutes <= 840   (exactly 840 is legal)
      duty interval of a trip = [departure_at - 30min, departure_at + sum(block_minutes) + 30min]
      rest_legal = for every OTHER CrewAssignment of the same crew_member_id with
        status == VETTED: the gap between the two duty intervals is >= 600 minutes
        on both sides (gap = max(0, later.start - earlier.end); exactly 600 is legal)
      (intervals that overlap have gap 0 and therefore violate rest)
    input_set: "The candidate CrewAssignment's trip legs, and all other VETTED CrewAssignments of the same crew member with their trip legs"
    constants:
      DUTY_MAX_MINUTES: 840
      REST_MIN_MINUTES: 600
      REPORT_DEBRIEF_MINUTES: 60
      REPORT_MINUTES: 30
      DEBRIEF_MINUTES: 30

  - name: check_hours_projection
    trigger: "POST /charter/trip-requests/{id}/dispatch"
    algorithm: forward_looking
    formula: |
      projected = aircraft.total_airframe_minutes + sum(block_minutes over the trip's QuoteLegs)
      dispatch legal iff projected <= aircraft.next_check_due_minutes
      (equality is legal; one minute over -> ERR_CHECK_HOURS_EXCEEDED)
    input_set: "The CONFIRMED assignment's aircraft and the trip's QuoteLegs"

  - name: payment_posture
    trigger: "Payment created (book, manual BALANCE, or cancel-time REFUND)"
    algorithm: aggregation
    formula: |
      gross_collected = sum(amount_cents of POSTED DEPOSIT+BALANCE)
      net_collected = gross_collected - sum(amount_cents of POSTED REFUND)
      if trip.status == CANCELLED:
        refund_cents > 0 and cancellation_fee_cents == 0 -> REFUNDED_FULL
        refund_cents > 0 and cancellation_fee_cents > 0 -> REFUNDED_PARTIAL
        refund_cents == 0 -> posture unchanged from pre-cancel value
      else:
        net_collected == 0 -> UNPAID
        net_collected < quoted_total_cents -> DEPOSIT_PAID
        net_collected >= quoted_total_cents -> PAID_IN_FULL
      TripRequest.collected_cents = net_collected (recomputed on the same trigger)
    input_set: "POSTED Payments of the trip only"

  - name: owner_statement
    trigger: "system (trip DISPATCHED -> COMPLETED)"
    algorithm: aggregation
    formula: |
      owner = the CONFIRMED assignment's aircraft.owner_id
      gross_cents = trip.final_total_cents
      logged_minutes = sum(actual_block_minutes over the trip's FlightLogs)   (revenue AND positioning legs)
      Evaluation order pinned (circular-looking unless pinned):
        1) gross_cents from final price
        2) standard_share_cents = round_half_up(gross_cents * owner.revenue_share_pct / 100)
        3) guarantee_floor_cents = owner.guarantee_cents_per_block_min * logged_minutes
        4) owner_share_cents = max(standard_share_cents, guarantee_floor_cents)
        5) operator_retained_cents = gross_cents - owner_share_cents  (residual; negative allowed)
      Conservation: owner_share_cents + operator_retained_cents == gross_cents, always.
    input_set: "The completed TripRequest, its CONFIRMED AircraftAssignment's Aircraft and AircraftOwner, and all FlightLogs of the trip"
    precision: "integer cents, round_half_up on the standard share"
    variants:
      - name: STANDARD
        when: "owner.guarantee_cents_per_block_min == 0"
        difference: "owner_share_cents == standard_share_cents"
      - name: GUARANTEED
        when: "owner.guarantee_cents_per_block_min > 0 and the floor exceeds the standard share"
        difference: "owner_share_cents == guarantee_floor_cents > standard_share_cents; identical trip economics yield a different payout than STANDARD"

  - name: time_based_expiry
    trigger: "POST /charter/_clock/set_current_utc"
    algorithm: threshold
    formula: |
      On every clock advance, in this order:
        1) TripRequest: status == QUOTED and now > quote_valid_until -> EXPIRED
        2) Passenger: tsa_status == CLEARED and now > screened_at + 72h -> EXPIRED
        3) OverflightPermit: status == GRANTED and now > decided_at + 30 days -> EXPIRED
        4) MaintenanceWindow: status == PLANNED and starts_at <= now and aircraft not IN_TRIP -> ACTIVE (and aircraft AVAILABLE -> MAINTENANCE_HOLD)
    input_set: "All non-terminal TripRequests, Passengers, OverflightPermits, and PLANNED MaintenanceWindows"
    constants:
      TSA_VALIDITY_HOURS: 72
      PERMIT_VALIDITY_DAYS: 30

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present and role is a declared role"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT
    http_status: 400
    applies_to: all
  - priority: 2
    category: auth
    check: "Role is permitted for this endpoint; for entity_backed roles, X-User-ID ownership: CrewMember recording a FlightLog must be the trip's VETTED PIC (crew_member_id of a VETTED PIC CrewAssignment on that trip); AircraftOwner reading statements must equal the owner id"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: all
  - priority: 3
    category: existence
    check: "Request body shape: required fields present, enum values valid, integer amounts > 0 where required (block_minutes, amount_cents, actual_block_minutes, seats)"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all
  - priority: 4
    category: existence
    check: "Time ranges coherent: ends_at > starts_at (MaintenanceWindow, WeatherAdvisory); arrived_at > departed_at (FlightLog)"
    error_id: ERR_INVALID_TIME_RANGE
    http_status: 400
    applies_to: "POST /charter/maintenance-windows, POST /charter/weather-advisories, POST /charter/flight-logs"
  - priority: 5
    category: existence
    check: "Resource ids in path and FK fields in body exist, validated left-to-right; ComplianceFinding subject_id must exist in the collection named by subject_type"
    error_id: "ERR_{RESOURCE}_NOT_FOUND"
    http_status: 404
    applies_to: all resource endpoints
  - priority: 6
    category: state
    check: "OCC: on endpoints declaring expected_trip_request_version (requote, aircraft-assignment create), the supplied version must equal TripRequest.version — evaluated BEFORE the state preconditions of priority 7"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /charter/trip-requests/{id}/requote, POST /charter/aircraft-assignments"
  - priority: 7
    category: state
    check: "Target resource in a valid state for the requested transition (trip QUOTE_DRAFT/QUOTED/BOOKED per endpoint; assignment TENTATIVE for confirm and TENTATIVE|CONFIRMED for release; crew assignment PROPOSED for vet and crew member ACTIVE; window ACTIVE for complete and PLANNED for cancel; passenger PENDING|EXPIRED for screen; permit REQUESTED for decide; statement DRAFT for issue; finding OPEN for resolve; aircraft AVAILABLE for confirm, GROUNDABLE for ground, GROUNDED for return-to-service; exactly one CONFIRMED assignment exists for dispatch)"
    error_id: "ERR_TRIP_NOT_QUOTE_DRAFT | ERR_TRIP_NOT_QUOTED | ERR_TRIP_NOT_BOOKED | ERR_TRIP_NOT_CANCELLABLE | ERR_INVALID_STATE | ERR_AIRCRAFT_NOT_AVAILABLE | ERR_AIRCRAFT_NOT_GROUNDED | ERR_ASSIGNMENT_NOT_TENTATIVE | ERR_ASSIGNMENT_ALREADY_RELEASED | ERR_CREW_ASSIGNMENT_NOT_PROPOSED | ERR_WINDOW_NOT_COMPLETABLE | ERR_PASSENGER_NOT_SCREENABLE | ERR_PERMIT_NOT_DECIDABLE | ERR_STATEMENT_NOT_DRAFT | ERR_FINDING_ALREADY_RESOLVED | ERR_NO_CONFIRMED_ASSIGNMENT"
    http_status: 409
    applies_to: "state transition endpoints"
  - priority: 8
    category: business_safety
    check: "FAA/TSA compliance gates. At aircraft-assignment confirm: on_ops_spec (ERR_AIRCRAFT_NOT_ON_OPS_SPEC). At crew-assignment create: crew qualified for requested_category (ERR_CREW_NOT_TYPE_QUALIFIED). At dispatch, in this sub-order: crew vetted legal (ERR_CREW_NOT_VETTED), manifest count == passenger_count (ERR_PASSENGER_MANIFEST_INCOMPLETE), all passengers CLEARED (ERR_TSA_NOT_CLEARED), international permits GRANTED (ERR_PERMIT_NOT_GRANTED), check-hours projection (ERR_CHECK_HOURS_EXCEEDED), no OPEN grounding finding on the aircraft (ERR_GROUNDING_FINDING_OPEN). At return-to-service: no OPEN grounding finding (ERR_GROUNDING_FINDING_OPEN)."
    error_id: "ERR_AIRCRAFT_NOT_ON_OPS_SPEC | ERR_CREW_NOT_TYPE_QUALIFIED | ERR_CREW_NOT_VETTED | ERR_PASSENGER_MANIFEST_INCOMPLETE | ERR_TSA_NOT_CLEARED | ERR_PERMIT_NOT_GRANTED | ERR_CHECK_HOURS_EXCEEDED | ERR_GROUNDING_FINDING_OPEN"
    http_status: 422
    applies_to: "POST /charter/aircraft-assignments/{id}/confirm, POST /charter/crew-assignments, POST /charter/trip-requests/{id}/dispatch, POST /charter/aircraft/{id}/return-to-service"
  - priority: 9
    category: business_temporal
    check: "Interval conflicts. Confirm: buffered half-open occupied interval must not intersect another CONFIRMED assignment on the same aircraft (ERR_AIRCRAFT_SCHEDULE_CONFLICT), and the raw closed flight interval must not intersect any PLANNED/ACTIVE MaintenanceWindow — touching endpoints count (ERR_MAINTENANCE_CONFLICT). Maintenance-window create: same closed-interval rule vs CONFIRMED assignments (ERR_MAINTENANCE_CONFLICT) and vs other PLANNED/ACTIVE windows on the same aircraft (ERR_WINDOW_OVERLAP). Cancel with reason WEATHER requires a covering WeatherAdvisory (ERR_NO_ACTIVE_WEATHER_ADVISORY)."
    error_id: "ERR_AIRCRAFT_SCHEDULE_CONFLICT | ERR_MAINTENANCE_CONFLICT | ERR_WINDOW_OVERLAP | ERR_NO_ACTIVE_WEATHER_ADVISORY"
    http_status: 409
    applies_to: "POST /charter/aircraft-assignments/{id}/confirm, POST /charter/maintenance-windows, POST /charter/trip-requests/{id}/cancel"
  - priority: 10
    category: business_referential
    check: "Cross-reference consistency: aircraft.category == trip.requested_category at confirm (ERR_CATEGORY_MISMATCH); FlightLog.quote_leg_id belongs to FlightLog.trip_request_id (ERR_LEG_TRIP_MISMATCH); no second FlightLog for the same leg (ERR_DUPLICATE_FLIGHT_LOG); no second permit with same trip+country_code+permit_type in {REQUESTED, GRANTED} (ERR_DUPLICATE_PERMIT)"
    error_id: "ERR_CATEGORY_MISMATCH | ERR_LEG_TRIP_MISMATCH | ERR_DUPLICATE_FLIGHT_LOG | ERR_DUPLICATE_PERMIT"
    http_status: 422
    applies_to: "POST /charter/aircraft-assignments/{id}/confirm, POST /charter/flight-logs, POST /charter/overflight-permits"
  - priority: 11
    category: business_fiscal
    check: "Money gates, last: book deposit_cents >= deposit_required_cents (ERR_DEPOSIT_INSUFFICIENT); manual Payment must be BALANCE on a BOOKED|DISPATCHED trip (ERR_PAYMENT_STATE_INVALID) and must not exceed quoted_total_cents - collected_cents (ERR_OVERPAYMENT); dispatch requires collected_cents >= quoted_total_cents (ERR_BALANCE_NOT_SETTLED)"
    error_id: "ERR_DEPOSIT_INSUFFICIENT | ERR_PAYMENT_STATE_INVALID | ERR_OVERPAYMENT | ERR_BALANCE_NOT_SETTLED"
    http_status: 402
    applies_to: "POST /charter/trip-requests/{id}/book, POST /charter/payments, POST /charter/trip-requests/{id}/dispatch"

# =============================================================================
# §1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- AircraftOwner ---
  - { method: POST, path: "/charter/aircraft-owners", description: "Register an aircraft owner", roles: [OpsAdmin], code: 201, input: [name, contact_email, revenue_share_pct, "guarantee_cents_per_block_min?"], output: AircraftOwner, side_effects: ["guarantee_cents_per_block_min defaults to 0"] }
  - { method: GET, path: "/charter/aircraft-owners", description: "List aircraft owners", roles: [OpsAdmin, SalesAgent, DispatchManager, MaintenanceController, ComplianceOfficer, AircraftOwner, CrewMember], code: 200, input: ["limit?", "offset?"], output: "AircraftOwner[]", side_effects: [] }
  - { method: GET, path: "/charter/aircraft-owners/{id}", description: "Get an aircraft owner", roles: [OpsAdmin, SalesAgent, DispatchManager, MaintenanceController, ComplianceOfficer, AircraftOwner, CrewMember], code: 200, input: [], output: AircraftOwner, side_effects: [] }

  # --- Aircraft ---
  - { method: POST, path: "/charter/aircraft", description: "Register an aircraft tail", roles: [OpsAdmin], code: 201, input: [owner_id, tail_number, category, home_base_icao, seats, hourly_rate_cents, on_ops_spec, initial_airframe_minutes, next_check_due_minutes], output: Aircraft, side_effects: ["status = AVAILABLE", "total_airframe_minutes initialized to initial_airframe_minutes"] }
  - { method: GET, path: "/charter/aircraft", description: "List aircraft with optional filters", roles: [OpsAdmin, SalesAgent, DispatchManager, MaintenanceController, ComplianceOfficer, AircraftOwner, CrewMember], code: 200, input: ["limit?", "offset?", "owner_id?", "category?", "status?"], output: "Aircraft[]", side_effects: [] }
  - { method: GET, path: "/charter/aircraft/{id}", description: "Get an aircraft", roles: [OpsAdmin, SalesAgent, DispatchManager, MaintenanceController, ComplianceOfficer, AircraftOwner, CrewMember], code: 200, input: [], output: Aircraft, side_effects: [] }
  - { method: POST, path: "/charter/aircraft/{id}/ground", description: "Ground an aircraft (compliance)", roles: [ComplianceOfficer], code: 200, input: [], output: Aircraft, side_effects: ["status -> GROUNDED", "TENTATIVE/CONFIRMED assignments -> RELEASED", "affected BOOKED trips -> QUOTED"] }
  - { method: POST, path: "/charter/aircraft/{id}/return-to-service", description: "Return a grounded aircraft to service", roles: [ComplianceOfficer], code: 200, input: [], output: Aircraft, side_effects: ["status -> AVAILABLE (requires no OPEN grounding findings)"] }

  # --- CrewMember ---
  - { method: POST, path: "/charter/crew-members", description: "Register a crew member", roles: [OpsAdmin], code: 201, input: [name, base_icao, qualified_categories], output: CrewMember, side_effects: ["status = ACTIVE"] }
  - { method: GET, path: "/charter/crew-members", description: "List crew members", roles: [OpsAdmin, SalesAgent, DispatchManager, MaintenanceController, ComplianceOfficer, AircraftOwner, CrewMember], code: 200, input: ["limit?", "offset?", "status?"], output: "CrewMember[]", side_effects: [] }
  - { method: GET, path: "/charter/crew-members/{id}", description: "Get a crew member", roles: [OpsAdmin, SalesAgent, DispatchManager, MaintenanceController, ComplianceOfficer, AircraftOwner, CrewMember], code: 200, input: [], output: CrewMember, side_effects: [] }
  - { method: PATCH, path: "/charter/crew-members/{id}", description: "Suspend or reactivate a crew member", roles: [OpsAdmin], code: 200, input: [status], output: CrewMember, side_effects: ["status -> ACTIVE | SUSPENDED"] }

  # --- TripRequest ---
  - { method: POST, path: "/charter/trip-requests", description: "Create a trip request (QUOTE_DRAFT)", roles: [SalesAgent], code: 201, input: [customer_name, customer_email, requested_category, origin_icao, destination_icao, departure_at, passenger_count, international], output: TripRequest, side_effects: ["status = QUOTE_DRAFT", "payment_posture = UNPAID"] }
  - { method: GET, path: "/charter/trip-requests", description: "List trip requests", roles: [OpsAdmin, SalesAgent, DispatchManager, MaintenanceController, ComplianceOfficer, AircraftOwner, CrewMember], code: 200, input: ["limit?", "offset?", "status?"], output: "TripRequest[]", side_effects: [] }
  - { method: GET, path: "/charter/trip-requests/{id}", description: "Get a trip request", roles: [OpsAdmin, SalesAgent, DispatchManager, MaintenanceController, ComplianceOfficer, AircraftOwner, CrewMember], code: 200, input: [], output: TripRequest, side_effects: [] }
  - { method: POST, path: "/charter/trip-requests/{id}/quote", description: "Price the trip and move to QUOTED", roles: [SalesAgent], code: 200, input: [], output: TripRequest, side_effects: ["runs quote_price", "sets quoted_total_cents, deposit_required_cents, quote_valid_until", "increments TripRequest.version by 1"] }
  - { method: POST, path: "/charter/trip-requests/{id}/requote", description: "Return a QUOTED trip to QUOTE_DRAFT for re-pricing (OCC)", roles: [SalesAgent], code: 200, input: [expected_trip_request_version], output: TripRequest, side_effects: ["clears quoted fields", "VETTED/FLAGGED_ILLEGAL crew assignments -> PROPOSED", "increments TripRequest.version by 1"] }
  - { method: POST, path: "/charter/trip-requests/{id}/book", description: "Book a QUOTED trip with a deposit", roles: [SalesAgent], code: 200, input: [deposit_cents], output: TripRequest, side_effects: ["creates DEPOSIT Payment (POSTED)", "payment_posture recomputed", "increments TripRequest.version by 1"] }
  - { method: POST, path: "/charter/trip-requests/{id}/cancel", description: "Cancel a trip with tiered refund policy", roles: [SalesAgent], code: 200, input: [reason], output: TripRequest, side_effects: ["runs cancellation_refund", "creates REFUND Payment when refund > 0", "assignments and crew assignments -> RELEASED", "aircraft IN_TRIP -> AVAILABLE/MAINTENANCE_HOLD on post-dispatch cancel", "increments TripRequest.version by 1"] }
  - { method: POST, path: "/charter/trip-requests/{id}/dispatch", description: "Dispatch a BOOKED trip (all compliance gates)", roles: [DispatchManager], code: 200, input: [], output: TripRequest, side_effects: ["status -> DISPATCHED", "aircraft AVAILABLE -> IN_TRIP", "increments TripRequest.version by 1"] }

  # --- QuoteLeg ---
  - { method: POST, path: "/charter/quote-legs", description: "Add a leg to a QUOTE_DRAFT trip", roles: [SalesAgent], code: 201, input: [trip_request_id, seq_no, leg_type, origin_icao, destination_icao, block_minutes, "fuel_stop?"], output: QuoteLeg, side_effects: ["trip must be QUOTE_DRAFT (ERR_TRIP_NOT_QUOTE_DRAFT)", "VETTED/FLAGGED_ILLEGAL crew assignments on the trip -> PROPOSED"] }
  - { method: GET, path: "/charter/quote-legs/{id}", description: "Get a quote leg", roles: [OpsAdmin, SalesAgent, DispatchManager, MaintenanceController, ComplianceOfficer, AircraftOwner, CrewMember], code: 200, input: [], output: QuoteLeg, side_effects: [] }
  - { method: GET, path: "/charter/trip-requests/{id}/quote-legs", description: "List legs of a trip", roles: [OpsAdmin, SalesAgent, DispatchManager, MaintenanceController, ComplianceOfficer, AircraftOwner, CrewMember], code: 200, input: ["limit?", "offset?"], output: "QuoteLeg[]", side_effects: [] }
  - { method: DELETE, path: "/charter/quote-legs/{id}", description: "Remove a leg from a QUOTE_DRAFT trip", roles: [SalesAgent], code: 204, input: [], output: null, side_effects: ["trip must be QUOTE_DRAFT (ERR_TRIP_NOT_QUOTE_DRAFT)", "VETTED/FLAGGED_ILLEGAL crew assignments on the trip -> PROPOSED"] }

  # --- AircraftAssignment ---
  - { method: POST, path: "/charter/aircraft-assignments", description: "Assign an aircraft to a QUOTED or BOOKED trip (OCC; supersedes prior TENTATIVE)", roles: [DispatchManager], code: 201, input: [trip_request_id, aircraft_id, expected_trip_request_version], output: AircraftAssignment, side_effects: ["status = TENTATIVE", "prior TENTATIVE assignment on the trip -> RELEASED", "occupied_start_at/occupied_end_at computed with 45-minute buffer", "increments TripRequest.version by 1"] }
  - { method: GET, path: "/charter/aircraft-assignments", description: "List aircraft assignments with optional filters", roles: [OpsAdmin, SalesAgent, DispatchManager, MaintenanceController, ComplianceOfficer, AircraftOwner, CrewMember], code: 200, input: ["limit?", "offset?", "trip_request_id?", "aircraft_id?", "status?"], output: "AircraftAssignment[]", side_effects: [] }
  - { method: GET, path: "/charter/aircraft-assignments/{id}", description: "Get an aircraft assignment", roles: [OpsAdmin, SalesAgent, DispatchManager, MaintenanceController, ComplianceOfficer, AircraftOwner, CrewMember], code: 200, input: [], output: AircraftAssignment, side_effects: [] }
  - { method: POST, path: "/charter/aircraft-assignments/{id}/confirm", description: "Confirm a TENTATIVE assignment (all availability/overlap gates)", roles: [DispatchManager], code: 200, input: [], output: AircraftAssignment, side_effects: ["status -> CONFIRMED"] }
  - { method: POST, path: "/charter/aircraft-assignments/{id}/release", description: "Release a TENTATIVE or CONFIRMED assignment", roles: [DispatchManager], code: 200, input: [], output: AircraftAssignment, side_effects: ["status -> RELEASED"] }

  # --- CrewAssignment ---
  - { method: POST, path: "/charter/crew-assignments", description: "Assign crew to a QUOTED or BOOKED trip", roles: [DispatchManager], code: 201, input: [trip_request_id, crew_member_id, duty_role], output: CrewAssignment, side_effects: ["status = PROPOSED", "crew must be ACTIVE and type-qualified for requested_category"] }
  - { method: GET, path: "/charter/crew-assignments", description: "List crew assignments with optional filters", roles: [OpsAdmin, SalesAgent, DispatchManager, MaintenanceController, ComplianceOfficer, AircraftOwner, CrewMember], code: 200, input: ["limit?", "offset?", "trip_request_id?", "crew_member_id?", "status?"], output: "CrewAssignment[]", side_effects: [] }
  - { method: GET, path: "/charter/crew-assignments/{id}", description: "Get a crew assignment", roles: [OpsAdmin, SalesAgent, DispatchManager, MaintenanceController, ComplianceOfficer, AircraftOwner, CrewMember], code: 200, input: [], output: CrewAssignment, side_effects: [] }
  - { method: POST, path: "/charter/crew-assignments/{id}/vet", description: "Run duty/rest legality on a PROPOSED crew assignment", roles: [DispatchManager], code: 200, input: [], output: CrewAssignment, side_effects: ["runs crew_duty_legality", "status -> VETTED or FLAGGED_ILLEGAL"] }

  # --- MaintenanceWindow ---
  - { method: POST, path: "/charter/maintenance-windows", description: "Schedule a maintenance window", roles: [MaintenanceController], code: 201, input: [aircraft_id, window_type, starts_at, ends_at], output: MaintenanceWindow, side_effects: ["status = PLANNED", "closed-interval conflict checks vs windows and CONFIRMED assignments"] }
  - { method: GET, path: "/charter/aircraft/{id}/maintenance-windows", description: "List maintenance windows of an aircraft", roles: [OpsAdmin, SalesAgent, DispatchManager, MaintenanceController, ComplianceOfficer, AircraftOwner, CrewMember], code: 200, input: ["limit?", "offset?"], output: "MaintenanceWindow[]", side_effects: [] }
  - { method: GET, path: "/charter/maintenance-windows/{id}", description: "Get a maintenance window", roles: [OpsAdmin, SalesAgent, DispatchManager, MaintenanceController, ComplianceOfficer, AircraftOwner, CrewMember], code: 200, input: [], output: MaintenanceWindow, side_effects: [] }
  - { method: POST, path: "/charter/maintenance-windows/{id}/complete", description: "Complete an ACTIVE window", roles: [MaintenanceController], code: 200, input: [], output: MaintenanceWindow, side_effects: ["status -> COMPLETED", "INSPECTION_100H: next_check_due_minutes = total_airframe_minutes + 6000", "aircraft MAINTENANCE_HOLD -> AVAILABLE when clear"] }
  - { method: POST, path: "/charter/maintenance-windows/{id}/cancel", description: "Cancel a PLANNED window", roles: [MaintenanceController], code: 200, input: [], output: MaintenanceWindow, side_effects: ["status -> CANCELLED"] }

  # --- Passenger ---
  - { method: POST, path: "/charter/passengers", description: "Add a passenger to a QUOTED or BOOKED trip manifest", roles: [SalesAgent], code: 201, input: [trip_request_id, full_name, date_of_birth], output: Passenger, side_effects: ["tsa_status = PENDING"] }
  - { method: GET, path: "/charter/trip-requests/{id}/passengers", description: "List manifest of a trip", roles: [OpsAdmin, SalesAgent, DispatchManager, MaintenanceController, ComplianceOfficer, AircraftOwner, CrewMember], code: 200, input: ["limit?", "offset?"], output: "Passenger[]", side_effects: [] }
  - { method: GET, path: "/charter/passengers/{id}", description: "Get a passenger", roles: [OpsAdmin, SalesAgent, DispatchManager, MaintenanceController, ComplianceOfficer, AircraftOwner, CrewMember], code: 200, input: [], output: Passenger, side_effects: [] }
  - { method: POST, path: "/charter/passengers/{id}/screen", description: "TSA program screening decision", roles: [ComplianceOfficer], code: 200, input: [outcome], output: Passenger, side_effects: ["tsa_status -> CLEARED | DENIED", "screened_at = current clock"] }

  # --- OverflightPermit ---
  - { method: POST, path: "/charter/overflight-permits", description: "Request an overflight/landing permit", roles: [SalesAgent], code: 201, input: [trip_request_id, country_code, permit_type, "required?"], output: OverflightPermit, side_effects: ["status = REQUESTED", "duplicate check on trip+country+type"] }
  - { method: GET, path: "/charter/trip-requests/{id}/overflight-permits", description: "List permits of a trip", roles: [OpsAdmin, SalesAgent, DispatchManager, MaintenanceController, ComplianceOfficer, AircraftOwner, CrewMember], code: 200, input: ["limit?", "offset?"], output: "OverflightPermit[]", side_effects: [] }
  - { method: GET, path: "/charter/overflight-permits/{id}", description: "Get a permit", roles: [OpsAdmin, SalesAgent, DispatchManager, MaintenanceController, ComplianceOfficer, AircraftOwner, CrewMember], code: 200, input: [], output: OverflightPermit, side_effects: [] }
  - { method: POST, path: "/charter/overflight-permits/{id}/decide", description: "Grant or deny a REQUESTED permit", roles: [ComplianceOfficer], code: 200, input: [decision], output: OverflightPermit, side_effects: ["status -> GRANTED | DENIED", "decided_at = current clock"] }

  # --- Payment ---
  - { method: POST, path: "/charter/payments", description: "Post a manual BALANCE payment (DEPOSIT via book, REFUND via cancel only)", roles: [SalesAgent], code: 201, input: [trip_request_id, payment_type, amount_cents], output: Payment, side_effects: ["payment_posture recomputed", "collected_cents recomputed"] }
  - { method: GET, path: "/charter/trip-requests/{id}/payments", description: "List payments of a trip", roles: [OpsAdmin, SalesAgent, DispatchManager, MaintenanceController, ComplianceOfficer, AircraftOwner, CrewMember], code: 200, input: ["limit?", "offset?"], output: "Payment[]", side_effects: [] }

  # --- FlightLog ---
  - { method: POST, path: "/charter/flight-logs", description: "Record actual block times for a flown leg (PIC only)", roles: [CrewMember], code: 201, input: [trip_request_id, quote_leg_id, actual_block_minutes, departed_at, arrived_at], output: FlightLog, side_effects: ["aircraft.total_airframe_minutes += actual_block_minutes", "when all legs logged: trip -> COMPLETED, final_price runs, OwnerStatement DRAFT created, aircraft status resolved, crew assignments RELEASED"] }
  - { method: GET, path: "/charter/flight-logs", description: "List flight logs with optional filters", roles: [OpsAdmin, SalesAgent, DispatchManager, MaintenanceController, ComplianceOfficer, AircraftOwner, CrewMember], code: 200, input: ["limit?", "offset?", "trip_request_id?", "quote_leg_id?"], output: "FlightLog[]", side_effects: [] }
  - { method: GET, path: "/charter/flight-logs/{id}", description: "Get a flight log", roles: [OpsAdmin, SalesAgent, DispatchManager, MaintenanceController, ComplianceOfficer, AircraftOwner, CrewMember], code: 200, input: [], output: FlightLog, side_effects: [] }

  # --- OwnerStatement ---
  - { method: GET, path: "/charter/aircraft-owners/{id}/owner-statements", description: "List statements of an owner (owner may read own only)", roles: [OpsAdmin, AircraftOwner], code: 200, input: ["limit?", "offset?"], output: "OwnerStatement[]", side_effects: [] }
  - { method: GET, path: "/charter/trip-requests/{id}/owner-statements", description: "List statements generated by a trip (0 or 1 row)", roles: [OpsAdmin, SalesAgent, DispatchManager, MaintenanceController, ComplianceOfficer, AircraftOwner, CrewMember], code: 200, input: ["limit?", "offset?"], output: "OwnerStatement[]", side_effects: [] }
  - { method: POST, path: "/charter/owner-statements/{id}/issue", description: "Issue a DRAFT statement", roles: [OpsAdmin], code: 200, input: [], output: OwnerStatement, side_effects: ["status -> ISSUED", "issued_at = current clock"] }

  # --- ComplianceFinding ---
  - { method: POST, path: "/charter/compliance-findings", description: "File an FAA ops-spec compliance finding", roles: [ComplianceOfficer], code: 201, input: [subject_type, subject_id, finding_code, grounding, "notes?"], output: ComplianceFinding, side_effects: ["status = OPEN", "subject must exist in the collection named by subject_type"] }
  - { method: GET, path: "/charter/compliance-findings", description: "List findings with optional filters", roles: [OpsAdmin, SalesAgent, DispatchManager, MaintenanceController, ComplianceOfficer, AircraftOwner, CrewMember], code: 200, input: ["limit?", "offset?", "subject_type?", "subject_id?", "status?"], output: "ComplianceFinding[]", side_effects: [] }
  - { method: GET, path: "/charter/compliance-findings/{id}", description: "Get a finding", roles: [OpsAdmin, SalesAgent, DispatchManager, MaintenanceController, ComplianceOfficer, AircraftOwner, CrewMember], code: 200, input: [], output: ComplianceFinding, side_effects: [] }
  - { method: POST, path: "/charter/compliance-findings/{id}/resolve", description: "Resolve an OPEN finding", roles: [ComplianceOfficer], code: 200, input: [], output: ComplianceFinding, side_effects: ["status -> RESOLVED", "resolved_at = current clock"] }

  # --- WeatherAdvisory ---
  - { method: POST, path: "/charter/weather-advisories", description: "Publish a weather advisory", roles: [DispatchManager], code: 201, input: [station_icao, severity, starts_at, ends_at], output: WeatherAdvisory, side_effects: [] }
  - { method: GET, path: "/charter/weather-advisories", description: "List weather advisories", roles: [OpsAdmin, SalesAgent, DispatchManager, MaintenanceController, ComplianceOfficer, AircraftOwner, CrewMember], code: 200, input: ["limit?", "offset?", "station_icao?"], output: "WeatherAdvisory[]", side_effects: [] }

  # --- Test-driving clock ---
  - { method: POST, path: "/charter/_clock/set_current_utc", description: "Set the logical clock. Before any call, the logical clock reads exactly 2026-08-01T00:00:00Z and never falls back to wall-clock time.", roles: [OpsAdmin], code: 200, input: [to_iso8601], output: null, side_effects: ["runs time_based_expiry sweep in pinned order: trips -> passengers -> permits -> maintenance windows"] }

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT, http: 400, condition: "X-User-ID or X-User-Role header missing or role unknown" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Role not permitted, or entity-backed ownership check failed (non-PIC crew recording a log; owner reading another owner's statements)" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field, invalid enum value, or non-positive amount/minutes" }
  - { id: ERR_INVALID_TIME_RANGE, http: 400, condition: "ends_at <= starts_at, or arrived_at <= departed_at" }
  - { id: ERR_AIRCRAFT_OWNER_NOT_FOUND, http: 404, condition: "AircraftOwner id does not exist" }
  - { id: ERR_AIRCRAFT_NOT_FOUND, http: 404, condition: "Aircraft id does not exist" }
  - { id: ERR_CREW_MEMBER_NOT_FOUND, http: 404, condition: "CrewMember id does not exist" }
  - { id: ERR_TRIP_REQUEST_NOT_FOUND, http: 404, condition: "TripRequest id does not exist" }
  - { id: ERR_QUOTE_LEG_NOT_FOUND, http: 404, condition: "QuoteLeg id does not exist" }
  - { id: ERR_AIRCRAFT_ASSIGNMENT_NOT_FOUND, http: 404, condition: "AircraftAssignment id does not exist" }
  - { id: ERR_CREW_ASSIGNMENT_NOT_FOUND, http: 404, condition: "CrewAssignment id does not exist" }
  - { id: ERR_MAINTENANCE_WINDOW_NOT_FOUND, http: 404, condition: "MaintenanceWindow id does not exist" }
  - { id: ERR_PASSENGER_NOT_FOUND, http: 404, condition: "Passenger id does not exist" }
  - { id: ERR_OVERFLIGHT_PERMIT_NOT_FOUND, http: 404, condition: "OverflightPermit id does not exist" }
  - { id: ERR_FLIGHT_LOG_NOT_FOUND, http: 404, condition: "FlightLog id does not exist" }
  - { id: ERR_OWNER_STATEMENT_NOT_FOUND, http: 404, condition: "OwnerStatement id does not exist" }
  - { id: ERR_COMPLIANCE_FINDING_NOT_FOUND, http: 404, condition: "ComplianceFinding id does not exist" }
  - { id: ERR_TRIP_NOT_QUOTE_DRAFT, http: 409, condition: "quote / leg add / leg delete requires trip in QUOTE_DRAFT" }
  - { id: ERR_TRIP_NOT_QUOTED, http: 409, condition: "book / requote requires trip in QUOTED" }
  - { id: ERR_TRIP_NOT_BOOKED, http: 409, condition: "dispatch requires trip in BOOKED; assignment confirm requires trip in BOOKED" }
  - { id: ERR_TRIP_NOT_CANCELLABLE, http: 409, condition: "cancel from COMPLETED, CANCELLED, or EXPIRED; or CUSTOMER cancel from DISPATCHED" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Generic state precondition failure (ground from IN_TRIP/GROUNDED, vet with SUSPENDED crew, window cancel from ACTIVE, passenger create on non-QUOTED/BOOKED trip, assignment create on non-QUOTED/BOOKED trip, flight log on non-DISPATCHED trip)" }
  - { id: ERR_NO_CONFIRMED_ASSIGNMENT, http: 409, condition: "Dispatch requires exactly one CONFIRMED AircraftAssignment" }
  - { id: ERR_AIRCRAFT_NOT_AVAILABLE, http: 409, condition: "Assignment confirm requires aircraft AVAILABLE" }
  - { id: ERR_AIRCRAFT_NOT_GROUNDED, http: 409, condition: "return-to-service requires aircraft GROUNDED" }
  - { id: ERR_ASSIGNMENT_NOT_TENTATIVE, http: 409, condition: "confirm requires assignment TENTATIVE" }
  - { id: ERR_ASSIGNMENT_ALREADY_RELEASED, http: 409, condition: "release requires assignment TENTATIVE or CONFIRMED" }
  - { id: ERR_CREW_ASSIGNMENT_NOT_PROPOSED, http: 409, condition: "vet requires crew assignment PROPOSED" }
  - { id: ERR_WINDOW_NOT_COMPLETABLE, http: 409, condition: "complete requires window ACTIVE" }
  - { id: ERR_PASSENGER_NOT_SCREENABLE, http: 409, condition: "screen requires passenger PENDING or EXPIRED" }
  - { id: ERR_PERMIT_NOT_DECIDABLE, http: 409, condition: "decide requires permit REQUESTED" }
  - { id: ERR_STATEMENT_NOT_DRAFT, http: 409, condition: "issue requires statement DRAFT" }
  - { id: ERR_FINDING_ALREADY_RESOLVED, http: 409, condition: "resolve requires finding OPEN" }
  - { id: ERR_AIRCRAFT_NOT_ON_OPS_SPEC, http: 422, condition: "Confirm requires the tail listed on FAA operations specifications" }
  - { id: ERR_CREW_NOT_TYPE_QUALIFIED, http: 422, condition: "Crew member's qualified_categories must contain the trip's requested_category" }
  - { id: ERR_CREW_NOT_VETTED, http: 422, condition: "Dispatch requires a VETTED legal PIC (and SIC for HEAVY_JET)" }
  - { id: ERR_TSA_NOT_CLEARED, http: 422, condition: "Dispatch requires every passenger tsa_status == CLEARED" }
  - { id: ERR_PASSENGER_MANIFEST_INCOMPLETE, http: 422, condition: "Dispatch requires manifest count == passenger_count" }
  - { id: ERR_PERMIT_NOT_GRANTED, http: 422, condition: "International dispatch requires all required permits GRANTED" }
  - { id: ERR_CHECK_HOURS_EXCEEDED, http: 422, condition: "Projected airframe minutes exceed next_check_due_minutes" }
  - { id: ERR_GROUNDING_FINDING_OPEN, http: 422, condition: "OPEN grounding ComplianceFinding blocks dispatch / return-to-service" }
  - { id: ERR_AIRCRAFT_SCHEDULE_CONFLICT, http: 409, condition: "Buffered half-open occupied interval intersects another CONFIRMED assignment on the same aircraft" }
  - { id: ERR_MAINTENANCE_CONFLICT, http: 409, condition: "Closed flight interval intersects a PLANNED/ACTIVE MaintenanceWindow (touching counts)" }
  - { id: ERR_WINDOW_OVERLAP, http: 409, condition: "Closed window interval intersects another PLANNED/ACTIVE window on the same aircraft" }
  - { id: ERR_NO_ACTIVE_WEATHER_ADVISORY, http: 409, condition: "WEATHER cancel requires a covering advisory on origin or destination at departure_at" }
  - { id: ERR_CATEGORY_MISMATCH, http: 422, condition: "Assigned aircraft category differs from requested_category" }
  - { id: ERR_LEG_TRIP_MISMATCH, http: 422, condition: "FlightLog leg does not belong to the given trip" }
  - { id: ERR_DUPLICATE_FLIGHT_LOG, http: 422, condition: "Leg already has a FlightLog" }
  - { id: ERR_DUPLICATE_PERMIT, http: 422, condition: "Same trip+country_code+permit_type already REQUESTED or GRANTED" }
  - { id: ERR_DEPOSIT_INSUFFICIENT, http: 402, condition: "deposit_cents < deposit_required_cents at book" }
  - { id: ERR_BALANCE_NOT_SETTLED, http: 402, condition: "collected_cents < quoted_total_cents at dispatch" }
  - { id: ERR_OVERPAYMENT, http: 402, condition: "BALANCE payment exceeds quoted_total_cents - collected_cents" }
  - { id: ERR_PAYMENT_STATE_INVALID, http: 402, condition: "Manual DEPOSIT/REFUND via POST /charter/payments, or BALANCE on a trip not BOOKED/DISPATCHED" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_trip_request_version does not match the trip's current version (OCC)" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: OpsAdmin
    description: "Platform operator administrator; registry management, statement issuance, logical clock"
    identity: opaque
    exclusive_operations:
      - "POST /charter/aircraft-owners"
      - "POST /charter/aircraft"
      - "POST /charter/crew-members"
      - "PATCH /charter/crew-members/{id}"
      - "POST /charter/owner-statements/{id}/issue"
      - "POST /charter/_clock/set_current_utc"
    shared_operations: ["all GET endpoints"]
  - name: SalesAgent
    description: "Charter sales desk; quoting, booking, cancellation, manifests, permits, payments"
    identity: opaque
    exclusive_operations:
      - "POST /charter/trip-requests"
      - "POST /charter/quote-legs"
      - "DELETE /charter/quote-legs/{id}"
      - "POST /charter/trip-requests/{id}/quote"
      - "POST /charter/trip-requests/{id}/requote"
      - "POST /charter/trip-requests/{id}/book"
      - "POST /charter/trip-requests/{id}/cancel"
      - "POST /charter/passengers"
      - "POST /charter/overflight-permits"
      - "POST /charter/payments"
    shared_operations: ["all GET endpoints"]
  - name: DispatchManager
    description: "Director of operations delegate; aircraft/crew assignment, vetting, dispatch, weather advisories"
    identity: opaque
    exclusive_operations:
      - "POST /charter/aircraft-assignments"
      - "POST /charter/aircraft-assignments/{id}/confirm"
      - "POST /charter/aircraft-assignments/{id}/release"
      - "POST /charter/crew-assignments"
      - "POST /charter/crew-assignments/{id}/vet"
      - "POST /charter/trip-requests/{id}/dispatch"
      - "POST /charter/weather-advisories"
    shared_operations: ["all GET endpoints"]
  - name: MaintenanceController
    description: "Maintenance control; maintenance window lifecycle"
    identity: opaque
    exclusive_operations:
      - "POST /charter/maintenance-windows"
      - "POST /charter/maintenance-windows/{id}/complete"
      - "POST /charter/maintenance-windows/{id}/cancel"
    shared_operations: ["all GET endpoints"]
  - name: ComplianceOfficer
    description: "Compliance and security; TSA screening, permit decisions, findings, grounding"
    identity: opaque
    exclusive_operations:
      - "POST /charter/passengers/{id}/screen"
      - "POST /charter/overflight-permits/{id}/decide"
      - "POST /charter/compliance-findings"
      - "POST /charter/compliance-findings/{id}/resolve"
      - "POST /charter/aircraft/{id}/ground"
      - "POST /charter/aircraft/{id}/return-to-service"
    shared_operations: ["all GET endpoints"]
  - name: AircraftOwner
    description: "Aircraft owner reading own revenue-share statements"
    identity: "entity_backed:AircraftOwner"
    exclusive_operations: []
    shared_operations:
      - "GET /charter/aircraft-owners/{id}/owner-statements (only when X-User-ID == the owner id in the path; otherwise ERR_FORBIDDEN)"
      - "all GET endpoints"
  - name: CrewMember
    description: "Flight crew; the trip's VETTED PIC records flight logs"
    identity: "entity_backed:CrewMember"
    exclusive_operations:
      - "POST /charter/flight-logs (X-User-ID must equal the crew_member_id of a VETTED PIC CrewAssignment on the trip; otherwise ERR_FORBIDDEN)"
    shared_operations: ["all GET endpoints"]
