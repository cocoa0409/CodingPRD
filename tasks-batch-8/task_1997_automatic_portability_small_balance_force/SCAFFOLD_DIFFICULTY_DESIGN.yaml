            - { call: "POST /safe-harbor-iras/${ira}/transfers", payload: { expected_ira_version: "${ira_v1}" }, as: ProviderOps, captures: { tr1: $.data.id } }
            - { call: "POST /transfers/${tr1}/record-response", payload: { outcome: "REJECTED", rejection_reason: "account mismatch" }, as: ProviderOps }
            - { call: "POST /safe-harbor-iras/${ira}/match-searches", payload: { new_plan_id: "${plan_y}", new_recordkeeper_id: "${rk_b}", employment_start_date: "2026-08-10", ssn_exact: true, name_similarity: 0.90, dob_match: true }, as: ProviderOps }
