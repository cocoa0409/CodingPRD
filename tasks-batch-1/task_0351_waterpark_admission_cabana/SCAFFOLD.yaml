scenario: "Waterpark Admission & Cabana: day ticket & season pass, capacity/timed entry, cabana/locker rental, height/wristband band, group & resident pricing, weather/rain-check policy, season-pass freeze, food/beverage combo"
domain_name: waterpark-admission-cabana
api_prefix: /

complexity_profile:
  primary_archetype: quota_allocation
  secondary_archetype: pricing_engine
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
    - derived_field_reconciliation

  entity_topology: hybrid
  # Park is a hierarchical root for EntryWindow / Cabana / Locker inventory;
  # Order, Admission, CabanaRental, LockerRental, RainCheck are flat peers
  # joined by FK references (a CabanaRental references Park, Order, EntryWindow).

  state_machine_shape: parallel
  # Order carries two independent dimensions: payment_status × fulfillment_status.
  # Admission carries a cyclic freeze loop (ACTIVE -> FROZEN -> ACTIVE).
  # EntryWindow is posture-gated (OPEN/RESTRICTED/CLOSED/RAINED_OUT) and gates
  # all CabanaRental + check-in operations beneath it.

  relationship_patterns:
    - one_to_many        # Park -> EntryWindow, Park -> Cabana, Order -> Admission
    - cross_aggregate    # CabanaRental references both Order and EntryWindow
    - polymorphic        # RainCheck.source_ref can point at an Admission or a CabanaRental

  role_model: peer_roles
  # Guest owns own Orders/Admissions; GateAgent performs check-in + band issue;
  # ParkManager configures inventory/pricing and runs weather + epoch ops;
  # FinanceClerk performs refunds / rain-check settlement.

  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# ============================================================================
# §1.1 Entity-Relationship Table
# ============================================================================
entities:

  - name: Park
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: display name of the waterpark
      - name: timezone
        type: string
        source: input
        description: IANA timezone for window scheduling (informational)
        default: "America/New_York"
      - name: total_gate_capacity
        type: integer
        source: input
        description: maximum guests admittable park-wide across all open windows
        constraints: ">= 1"
      - name: weather_status
        type: enum
        source: computed
        description: |
          Park-wide weather posture, recomputed by POST /parks/{id}/weather.
          CLEAR while no advisory; STORM_WATCH suspends new cabana sales but
          keeps check-in open; RAINED_OUT closes the gate and arms rain-check
          eligibility for the day. Initialized to CLEAR.
        default: CLEAR
        constraints: "enum: CLEAR, STORM_WATCH, RAINED_OUT"
      - name: resident_zip_prefixes
        type: array
        source: input
        description: list of ZIP prefixes (strings) granting resident pricing
        default: []
      - name: open_window_count
        type: integer
        source: computed
        description: |
          Count of EntryWindow children whose status == OPEN. Recomputed on
          every EntryWindow status change. Derived-field reconciliation target.
        default: 0
      - name: rain_check_value_cents
        type: integer
        source: input
        description: flat credit value of one issued RainCheck voucher, in cents
        default: 0
        constraints: ">= 0"

  - name: PricingPolicy
    parent: null
    common_fields: true
    fields:
      - name: park_id
        type: string
        source: input
        description: "FK -> Park.id; the park this policy prices"
      - name: product_type
        type: enum
        source: input
        description: which admission product this row prices
        constraints: "enum: DAY_TICKET, SEASON_PASS"
      - name: base_price_cents
        type: integer
        source: input
        description: base admission price in cents before any adjustment
        constraints: ">= 0"
      - name: resident_discount_pct
        type: number
        source: input
        description: fractional discount for resident guests, e.g. 0.20 == 20% off
        default: 0
        constraints: "0 <= x <= 0.90"
      - name: group_threshold
        type: integer
        source: input
        description: party size at or above which the group rate applies
        default: 10
        constraints: ">= 2"
      - name: group_discount_pct
        type: number
        source: input
        description: fractional discount applied to each ticket once group_threshold is met
        default: 0
        constraints: "0 <= x <= 0.90"
      - name: combo_price_cents
        type: integer
        source: input
        description: surcharge in cents added per food_beverage_combo opt-in ticket
        default: 0
        constraints: ">= 0"
      - name: active
        type: boolean
        source: computed
        description: |
          true while this is the live policy for (park_id, product_type).
          Superseding a policy via POST /pricing-policies sets the prior row
          active=false. Only an active policy may price an Order.
        default: true

  - name: EntryWindow
    parent: Park
    common_fields: true
    fields:
      - name: park_id
        type: string
        source: input
        description: "FK -> Park.id; the owning park"
      - name: starts_at
        type: datetime
        source: input
        description: timed-entry window start (inclusive), ISO 8601 UTC
      - name: ends_at
        type: datetime
        source: input
        description: timed-entry window end (exclusive), ISO 8601 UTC
      - name: window_capacity
        type: integer
        source: input
        description: max admissions assignable to this window
        constraints: ">= 1"
      - name: reserved_count
        type: integer
        source: computed
        description: |
          admissions held against this window in CONFIRMED state but not yet
          checked in. Incremented on admission confirmation, decremented on
          check-in (moves to admitted_count) or release.
        default: 0
      - name: admitted_count
        type: integer
        source: computed
        description: admissions checked in through the gate against this window
        default: 0
      - name: status
        type: enum
        source: computed
        description: |
          OPEN accepts new admission assignment and check-in; RESTRICTED keeps
          existing reservations valid but blocks new assignment; CLOSED is
          terminal-ish (no assignment, no check-in); RAINED_OUT is reached only
          via park weather RAINED_OUT and arms rain-check issuance for held
          admissions. Initialized OPEN.
        default: OPEN
        constraints: "enum: OPEN, RESTRICTED, CLOSED, RAINED_OUT"

  - name: Cabana
    parent: Park
    common_fields: true
    fields:
      - name: park_id
        type: string
        source: input
        description: "FK -> Park.id; the owning park"
      - name: label
        type: string
        source: input
        description: physical cabana label, e.g. "C-12"
      - name: tier
        type: enum
        source: input
        description: cabana tier governing daily rate
        constraints: "enum: STANDARD, PREMIUM, CABANA_SUITE"
      - name: daily_rate_cents
        type: integer
        source: input
        description: rental price in cents for a full-day cabana booking
        constraints: ">= 0"
      - name: turnover_buffer_minutes
        type: integer
        source: input
        description: |
          minutes of mandatory cleaning gap that must separate two rentals of
          THIS cabana; a new rental whose start falls within this buffer of a
          prior rental's end is rejected as an overlap.
        default: 30
        constraints: ">= 0"

  - name: Locker
    parent: Park
    common_fields: true
    fields:
      - name: park_id
        type: string
        source: input
        description: "FK -> Park.id; the owning park"
      - name: bank_code
        type: string
        source: input
        description: locker bank identifier
      - name: hourly_rate_cents
        type: integer
        source: input
        description: rental price in cents per started hour of locker use
        constraints: ">= 0"

  - name: Guest
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: guest legal name
      - name: email
        type: string
        source: input
        description: contact email (unique per park is NOT required)
      - name: zip_code
        type: string
        source: input
        description: residential ZIP used to evaluate resident pricing eligibility
      - name: height_cm
        type: integer
        source: input
        description: guest height in centimeters, used for wristband band color
        constraints: ">= 0"
      - name: wallet_credit_cents
        type: integer
        source: computed
        description: |
          accumulated refund / rain-check credit balance in cents. Credited by
          refunds and rain-check settlements; never minted on input.
        default: 0

  - name: Order
    parent: null
    common_fields: true
    fields:
      - name: park_id
        type: string
        source: input
        description: "FK -> Park.id; the park the order is purchased against"
      - name: guest_id
        type: string
        source: input
        description: "FK -> Guest.id; the purchasing guest (also the party leader)"
      - name: product_type
        type: enum
        source: input
        description: admission product purchased for the whole party
        constraints: "enum: DAY_TICKET, SEASON_PASS"
      - name: party_size
        type: integer
        source: input
        description: number of admissions to mint when the order is fulfilled
        constraints: ">= 1"
      - name: food_beverage_combo
        type: boolean
        source: input
        description: whether each ticket in the party includes the F&B combo surcharge
        default: false
      - name: resident_rate_applied
        type: boolean
        source: computed
        description: |
          whether resident pricing was applied at quote time; true iff the
          guest's zip_code begins with one of Park.resident_zip_prefixes.
        default: false
      - name: group_rate_applied
        type: boolean
        source: computed
        description: true iff party_size >= active PricingPolicy.group_threshold
        default: false
      - name: subtotal_cents
        type: integer
        source: computed
        description: per-ticket price after discounts and combo, times party_size
        default: 0
      - name: total_cents
        type: integer
        source: computed
        description: final charge in cents after wallet credit is applied
        default: 0
      - name: wallet_credit_used_cents
        type: integer
        source: computed
        description: amount of guest wallet credit consumed by this order
        default: 0
      - name: payment_status
        type: enum
        source: computed
        description: |
          Independent payment dimension. PENDING -> PAID (POST .../pay) or
          PENDING -> VOID (cancel before pay). PAID -> REFUNDED on full refund.
          Initialized PENDING.
        default: PENDING
        constraints: "enum: PENDING, PAID, VOID, REFUNDED"
      - name: fulfillment_status
        type: enum
        source: computed
        description: |
          Independent fulfillment dimension. UNFULFILLED -> FULFILLED (admissions
          minted, only allowed once payment_status == PAID) -> CANCELLED. Initialized
          UNFULFILLED.
        default: UNFULFILLED
        constraints: "enum: UNFULFILLED, FULFILLED, CANCELLED"

  - name: Admission
    parent: null
    common_fields: true
    fields:
      - name: order_id
        type: string
        source: input
        description: "FK -> Order.id; the order that minted this admission"
      - name: park_id
        type: string
        source: input
        description: "FK -> Park.id; the park this admission grants entry to"
      - name: guest_id
        type: string
        source: input
        description: "FK -> Guest.id; nullable until check-in binds a named guest"
      - name: entry_window_id
        type: string
        source: input
        description: "FK -> EntryWindow.id; window this admission is assigned to (null until assigned)"
      - name: product_type
        type: enum
        source: input
        description: copied from the parent Order at mint time
        constraints: "enum: DAY_TICKET, SEASON_PASS"
      - name: ticket_price_cents
        type: integer
        source: computed
        description: the per-ticket price charged for this admission (from the order calc)
        default: 0
      - name: status
        type: enum
        source: computed
        description: |
          Day-ticket / season-pass lifecycle with a freeze cycle. ISSUED ->
          CONFIRMED (assigned to a window) -> CHECKED_IN (passed the gate).
          SEASON_PASS only: ACTIVE-equivalent CONFIRMED -> FROZEN -> CONFIRMED
          (freeze/unfreeze loop). Any non-terminal -> RAINED_OUT (window rained
          out) or -> CANCELLED. Initialized ISSUED.
        default: ISSUED
        constraints: "enum: ISSUED, CONFIRMED, CHECKED_IN, FROZEN, RAINED_OUT, CANCELLED"
      - name: freeze_days_used
        type: integer
        source: computed
        description: |
          SEASON_PASS only: cumulative days the pass has spent FROZEN, summed
          across every freeze episode. A freeze that would push this past
          MAX_FREEZE_DAYS is rejected.
        default: 0
      - name: frozen_at
        type: datetime
        source: computed
        description: clock time the current freeze episode began (null while not FROZEN)
      - name: band_color
        type: enum
        source: computed
        description: |
          wristband band assigned at check-in from guest height_cm. null until
          CHECKED_IN.
        constraints: "enum: GREEN, YELLOW, RED, null"

  - name: CabanaRental
    parent: null
    common_fields: true
    fields:
      - name: cabana_id
        type: string
        source: input
        description: "FK -> Cabana.id; the rented cabana"
      - name: order_id
        type: string
        source: input
        description: "FK -> Order.id; the order this rental is billed under"
      - name: park_id
        type: string
        source: input
        description: "FK -> Park.id; convenience copy of the cabana's park"
      - name: entry_window_id
        type: string
        source: input
        description: "FK -> EntryWindow.id; the window during which the cabana is held"
      - name: starts_at
        type: datetime
        source: input
        description: rental start (inclusive), ISO 8601 UTC
      - name: ends_at
        type: datetime
        source: input
        description: rental end (exclusive), ISO 8601 UTC
      - name: price_cents
        type: integer
        source: computed
        description: charged rental price (cabana daily_rate_cents at booking time)
        default: 0
      - name: status
        type: enum
        source: computed
        description: |
          HELD (capacity reserved) -> CONFIRMED (order paid) -> CANCELLED or
          -> RAINED_OUT (park rained out). Initialized HELD.
        default: HELD
        constraints: "enum: HELD, CONFIRMED, CANCELLED, RAINED_OUT"

  - name: LockerRental
    parent: null
    common_fields: false
    fields:
      - name: locker_id
        type: string
        source: input
        description: "FK -> Locker.id; the rented locker"
      - name: order_id
        type: string
        source: input
        description: "FK -> Order.id; the order this rental is billed under"
      - name: starts_at
        type: datetime
        source: input
        description: rental start (inclusive), ISO 8601 UTC
      - name: ends_at
        type: datetime
        source: input
        description: rental end (exclusive), ISO 8601 UTC
      - name: hours_billed
        type: integer
        source: computed
        description: ceil((ends_at - starts_at) / 1 hour); each started hour billed
        default: 0
      - name: price_cents
        type: integer
        source: computed
        description: hours_billed * Locker.hourly_rate_cents
        default: 0

  - name: RainCheck
    parent: null
    common_fields: true
    fields:
      - name: park_id
        type: string
        source: input
        description: "FK -> Park.id; the park that issued the voucher"
      - name: guest_id
        type: string
        source: input
        description: "FK -> Guest.id; the voucher holder"
      - name: source_kind
        type: enum
        source: input
        description: polymorphic discriminator for source_ref_id
        constraints: "enum: ADMISSION, CABANA_RENTAL"
      - name: source_ref_id
        type: string
        source: input
        description: |
          id of the rained-out Admission or CabanaRental that justified this
          voucher; resolved against source_kind. Not a single-target FK.
      - name: value_cents
        type: integer
        source: computed
        description: credit value, set from Park.rain_check_value_cents at issuance
        default: 0
      - name: status
        type: enum
        source: computed
        description: |
          ISSUED -> SETTLED (value credited to guest wallet) or ISSUED -> EXPIRED.
          Initialized ISSUED.
        default: ISSUED
        constraints: "enum: ISSUED, SETTLED, EXPIRED"

  - name: ClockState
    parent: null
    common_fields: false
    fields:
      - name: current_utc
        type: datetime
        source: system
        description: |
          server's notion of "now", set by POST /_clock/set_current_utc. All
          freeze-day accounting and window comparisons read this, never the
          wall clock. Single mutable row.

# ============================================================================
# §1.2 State Machine Table
# ============================================================================
state_machines:

  # ---- Order: PARALLEL dimensions (payment_status × fulfillment_status) ----
  - entity: Order
    initial_state: "payment_status=PENDING, fulfillment_status=UNFULFILLED"
    terminal_states: ["payment_status=VOID", "payment_status=REFUNDED & fulfillment_status=CANCELLED"]
    transitions:
      - from: "payment_status=PENDING"
        to: "payment_status=PAID"
        trigger: "POST /orders/{id}/pay"
        actor: Guest
        preconditions:
          - "Order.payment_status == PENDING"
          - "active PricingPolicy exists for (park_id, product_type)"
        side_effects:
          - "run quote_order calc: set subtotal_cents, total_cents, wallet_credit_used_cents, resident_rate_applied, group_rate_applied"
          - "debit Guest.wallet_credit_cents by wallet_credit_used_cents"
          - "increments Order.version by 1"
        note: "payment dimension only; fulfillment stays UNFULFILLED"
      - from: "payment_status=PENDING"
        to: "payment_status=VOID"
        trigger: "POST /orders/{id}/cancel"
        actor: Guest
        preconditions:
          - "Order.payment_status == PENDING"
        side_effects:
          - "release any HELD CabanaRental under this order (HELD -> CANCELLED), decrement EntryWindow.reserved_count for each"
          - "increments Order.version by 1"
      - from: "payment_status=PAID & fulfillment_status=UNFULFILLED"
        to: "fulfillment_status=FULFILLED"
        trigger: "POST /orders/{id}/fulfill"
        actor: Guest
        preconditions:
          - "Order.payment_status == PAID"
          - "Order.fulfillment_status == UNFULFILLED"
        side_effects:
          - "mint party_size Admission rows in ISSUED status, each ticket_price_cents = subtotal_cents / party_size"
          - "promote each HELD CabanaRental under this order to CONFIRMED"
          - "increments Order.version by 1"
      - from: "payment_status=PAID"
        to: "payment_status=REFUNDED & fulfillment_status=CANCELLED"
        trigger: "POST /orders/{id}/refund"
        actor: FinanceClerk
        preconditions:
          - "Order.payment_status == PAID"
          - "no Admission under this order is CHECKED_IN"
        side_effects:
          - "credit Guest.wallet_credit_cents by total_cents (compensating invariant: wallet conserved against original debit + charge)"
          - "cascade: every non-terminal Admission under this order -> CANCELLED; each CANCELLED admission with a CONFIRMED window decrements EntryWindow.reserved_count by 1"
          - "cascade: every CONFIRMED/HELD CabanaRental under this order -> CANCELLED, decrement EntryWindow.reserved_count"
          - "increments Order.version by 1"
        note: "depth-3 cascade: refund -> admission cancel -> window reserved_count decrement"

  # ---- Admission: freeze CYCLE (CONFIRMED -> FROZEN -> CONFIRMED) ----
  - entity: Admission
    initial_state: ISSUED
    terminal_states: [CANCELLED, RAINED_OUT]
    transitions:
      - from: ISSUED
        to: CONFIRMED
        trigger: "POST /admissions/{id}/assign-window"
        actor: Guest
        preconditions:
          - "Admission.status == ISSUED"
          - "Admission.order.fulfillment_status == FULFILLED"
          - "target EntryWindow.status == OPEN"
          - "EntryWindow.reserved_count + EntryWindow.admitted_count < EntryWindow.window_capacity"
        side_effects:
          - "set Admission.entry_window_id"
          - "increment EntryWindow.reserved_count by 1"
        note: "cross-entity guard on EntryWindow.status == OPEN"
      - from: CONFIRMED
        to: CHECKED_IN
        trigger: "POST /admissions/{id}/check-in"
        actor: GateAgent
        preconditions:
          - "Admission.status == CONFIRMED"
          - "EntryWindow.status == OPEN"
          - "ClockState.current_utc within [window.starts_at, window.ends_at)"
          - "a guest_id is bound on the admission"
        side_effects:
          - "run band_color_assignment: set band_color from guest.height_cm"
          - "decrement EntryWindow.reserved_count by 1, increment EntryWindow.admitted_count by 1"
        note: "half-open window interval; equals starts_at admits, equals ends_at rejects"
      - from: CONFIRMED
        to: FROZEN
        trigger: "POST /admissions/{id}/freeze"
        actor: Guest
        preconditions:
          - "Admission.status == CONFIRMED"
          - "Admission.product_type == SEASON_PASS"
          - "Admission.freeze_days_used < MAX_FREEZE_DAYS"
        side_effects:
          - "set frozen_at = ClockState.current_utc"
          - "decrement EntryWindow.reserved_count by 1 (held capacity released while frozen)"
        note: "DAY_TICKET freeze is rejected with ERR_FREEZE_NOT_ALLOWED"
      - from: FROZEN
        to: CONFIRMED
        trigger: "POST /admissions/{id}/unfreeze"
        actor: Guest
        preconditions:
          - "Admission.status == FROZEN"
          - "EntryWindow.status IN {OPEN, RESTRICTED}"
          - "EntryWindow.reserved_count + EntryWindow.admitted_count < EntryWindow.window_capacity"
        side_effects:
          - "add freeze_elapsed_days (ceil days from frozen_at to current_utc) to freeze_days_used"
          - "clear frozen_at"
          - "increment EntryWindow.reserved_count by 1 (re-acquire capacity)"
        note: "cycle: returns to CONFIRMED; freeze_days_used accumulates across episodes"
      - from: ISSUED
        to: CANCELLED
        trigger: "POST /orders/{id}/refund (cascade) or POST /admissions/{id}/cancel"
        actor: system
        preconditions:
          - "Admission.status IN {ISSUED, CONFIRMED, FROZEN}"
        side_effects:
          - "if was CONFIRMED, decrement EntryWindow.reserved_count by 1"
      - from: CONFIRMED
        to: RAINED_OUT
        trigger: "POST /entry-windows/{id}/rain-out (cascade from park weather)"
        actor: system
        preconditions:
          - "EntryWindow.status == RAINED_OUT"
          - "Admission.status IN {CONFIRMED, FROZEN}"
        side_effects:
          - "decrement EntryWindow.reserved_count by 1"
          - "issue one RainCheck (source_kind=ADMISSION) to the admission's guest if guest_id bound"
        note: "depth-3 cascade origin: weather -> window rain-out -> admission rain-out -> rain-check issuance"

  # ---- CabanaRental: HELD -> CONFIRMED -> {CANCELLED, RAINED_OUT} ----
  - entity: CabanaRental
    initial_state: HELD
    terminal_states: [CANCELLED, RAINED_OUT]
    transitions:
      - from: HELD
        to: CONFIRMED
        trigger: "POST /orders/{id}/fulfill (cascade)"
        actor: system
        preconditions:
          - "CabanaRental.status == HELD"
          - "Order.payment_status == PAID"
        side_effects:
          - "no capacity change (capacity already held at HELD)"
      - from: HELD
        to: CANCELLED
        trigger: "POST /cabana-rentals/{id}/cancel or order cancel/refund cascade"
        actor: Guest
        preconditions:
          - "CabanaRental.status IN {HELD, CONFIRMED}"
        side_effects:
          - "decrement EntryWindow.reserved_count by 1"
      - from: CONFIRMED
        to: RAINED_OUT
        trigger: "POST /entry-windows/{id}/rain-out (cascade)"
        actor: system
        preconditions:
          - "EntryWindow.status == RAINED_OUT"
          - "CabanaRental.status IN {HELD, CONFIRMED}"
        side_effects:
          - "decrement EntryWindow.reserved_count by 1"
          - "issue one RainCheck (source_kind=CABANA_RENTAL) to the order's guest"
        note: "second branch of the weather cascade, distinct interval semantics from admissions"

  # ---- EntryWindow: posture gate OPEN -> RESTRICTED -> CLOSED, plus RAINED_OUT ----
  - entity: EntryWindow
    initial_state: OPEN
    terminal_states: [CLOSED, RAINED_OUT]
    transitions:
      - from: OPEN
        to: RESTRICTED
        trigger: "POST /entry-windows/{id}/restrict"
        actor: ParkManager
        preconditions:
          - "EntryWindow.status == OPEN"
        side_effects:
          - "recompute Park.open_window_count (decrement)"
        note: "existing reservations valid; new assignment blocked"
      - from: RESTRICTED
        to: OPEN
        trigger: "POST /entry-windows/{id}/reopen"
        actor: ParkManager
        preconditions:
          - "EntryWindow.status == RESTRICTED"
        side_effects:
          - "recompute Park.open_window_count (increment)"
      - from: OPEN
        to: CLOSED
        trigger: "POST /entry-windows/{id}/close"
        actor: ParkManager
        preconditions:
          - "EntryWindow.status IN {OPEN, RESTRICTED}"
          - "EntryWindow.admitted_count == EntryWindow.reserved_count == 0 OR force flag set"
        side_effects:
          - "recompute Park.open_window_count if was OPEN"
      - from: OPEN
        to: RAINED_OUT
        trigger: "POST /entry-windows/{id}/rain-out"
        actor: system
        preconditions:
          - "Park.weather_status == RAINED_OUT"
          - "EntryWindow.status IN {OPEN, RESTRICTED}"
        side_effects:
          - "cascade: every CONFIRMED/FROZEN Admission on this window -> RAINED_OUT (each issues a RainCheck)"
          - "cascade: every CONFIRMED/HELD CabanaRental on this window -> RAINED_OUT (each issues a RainCheck)"
          - "set reserved_count = 0"
          - "recompute Park.open_window_count if was OPEN"
        note: "fan-out trigger feeding two distinct depth-3 cascades"

  # ---- RainCheck: ISSUED -> {SETTLED, EXPIRED} ----
  - entity: RainCheck
    initial_state: ISSUED
    terminal_states: [SETTLED, EXPIRED]
    transitions:
      - from: ISSUED
        to: SETTLED
        trigger: "POST /rain-checks/{id}/settle"
        actor: FinanceClerk
        preconditions:
          - "RainCheck.status == ISSUED"
        side_effects:
          - "credit Guest.wallet_credit_cents by value_cents (compensating invariant on wallet vs gate revenue)"
      - from: ISSUED
        to: EXPIRED
        trigger: "POST /rain-checks/{id}/expire"
        actor: ParkManager
        preconditions:
          - "RainCheck.status == ISSUED"
        side_effects:
          - "no wallet credit"

# ============================================================================
# §1.2.1 Concurrency Rules (OCC on parent.version only)
# ============================================================================
concurrency_rules:
  - rule_id: cabana-rent-stale-window
    parent_entity: EntryWindow
    write_endpoint: "POST /cabana-rentals"
    occ_field: "expected_entry_window_version"
    description: |
      Creating a CabanaRental holds capacity on the named EntryWindow. If the
      window's version has advanced since the client last observed it — because
      another rental was just created (legitimately consuming a slot under the
      same capacity pool) or the window was restricted/rained-out — the create
      is rejected as operating on a stale view of the window. The new rental
      would otherwise legitimately succeed against the window the client thinks
      it saw, so this is a true create-with-supersede race resolved by version
      check, not a state precondition.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: assign-window-stale-window
    parent_entity: EntryWindow
    write_endpoint: "POST /admissions/{id}/assign-window"
    occ_field: "expected_entry_window_version"
    description: |
      Assigning an Admission to an EntryWindow consumes a capacity slot. When
      the window's version has advanced since the client read it (another
      assignment or rental took a slot), the assignment is rejected on the
      stale view rather than over-committing the pool. A fresh read would let
      the same assignment succeed, so this is a genuine supersede race.
    error_id: ERR_STALE_VERSION
    http_status: 412

# ============================================================================
# §1.3 Calculation Rules Table
# ============================================================================
calculations:

  - name: quote_order
    trigger: "POST /orders/{id}/pay"
    algorithm: tiered_pricing
    formula: |
      policy = active PricingPolicy for (Order.park_id, Order.product_type)
      base = policy.base_price_cents
      # resident eligibility: guest.zip_code startswith any Park.resident_zip_prefixes entry
      resident_rate_applied = any(guest.zip_code.startswith(p) for p in Park.resident_zip_prefixes)
      group_rate_applied    = (Order.party_size >= policy.group_threshold)
      # DISCOUNTS ARE NOT STACKED MULTIPLICATIVELY. The engine selects the SINGLE
      # most favorable discount: effective_pct = max(resident_pct_if_eligible,
      # group_pct_if_eligible). Pin: take max, not product.
      resident_pct = policy.resident_discount_pct if resident_rate_applied else 0
      group_pct    = policy.group_discount_pct    if group_rate_applied    else 0
      effective_pct = max(resident_pct, group_pct)
      # PER-TICKET ROUNDING ORDER IS PINNED: round the discounted base to whole
      # cents PER TICKET first, THEN add the (already-integer) combo surcharge,
      # THEN multiply by party_size. ("round per line item, then sum.")
      discounted_per_ticket = round_half_up(base * (1 - effective_pct))   # whole cents
      combo_add = policy.combo_price_cents if Order.food_beverage_combo else 0
      per_ticket = discounted_per_ticket + combo_add
      subtotal_cents = per_ticket * Order.party_size
      # wallet credit applied AFTER subtotal, capped at subtotal and at balance
      wallet_credit_used_cents = min(Guest.wallet_credit_cents, subtotal_cents)
      total_cents = subtotal_cents - wallet_credit_used_cents
    input_set: "the single active PricingPolicy row; the purchasing Guest; the Park"
    constants:
      ROUNDING: round_half_up
    precision: "integer cents, round_half_up at the per-ticket step only"
    variants:
      - name: standard_party
        when: "party_size < group_threshold"
        difference: "group_pct = 0; effective_pct = resident_pct (or 0)"
      - name: group_party
        when: "party_size >= group_threshold"
        difference: "group_pct active; effective_pct = max(resident_pct, group_pct), NOT additive"

  - name: cabana_rental_overlap_charge
    trigger: "POST /cabana-rentals"
    algorithm: interval_merge
    formula: |
      # Flat daily rate per rental regardless of sub-day duration.
      price_cents = Cabana.daily_rate_cents
      # OVERLAP CHECK (rejection, not charge): a new rental on cabana C is rejected
      # if its [starts_at, ends_at) collides with ANY non-terminal rental R on C
      # AFTER expanding R by the cabana's turnover_buffer_minutes on the END side:
      #   blocked = new.starts_at < (R.ends_at + buffer) AND new.ends_at > R.starts_at
      # Adjacency exactly at (R.ends_at + buffer) is allowed (half-open + buffer).
    input_set: "all CabanaRental rows on the same cabana_id whose status IN {HELD, CONFIRMED}"
    constants:
      BUFFER_SOURCE: Cabana.turnover_buffer_minutes
    precision: "integer cents"
    variants:
      - name: same_window_pool
        when: "rental shares an entry_window_id with an existing rental"
        difference: "also counts against EntryWindow capacity pool, not just cabana time-overlap"

  - name: locker_rental_charge
    trigger: "POST /locker-rentals"
    algorithm: threshold
    formula: |
      duration_hours = (ends_at - starts_at) / 3600 seconds
      hours_billed = ceil(duration_hours)   # each STARTED hour bills a full hour
      # boundary: exactly 60 minutes -> 1 hour; 61 minutes -> 2 hours; 0 minutes rejected
      price_cents = hours_billed * Locker.hourly_rate_cents
    input_set: "the single LockerRental being created"
    constants:
      SECONDS_PER_HOUR: 3600
    precision: "integer cents; ceil on hours"

  - name: freeze_days_accounting
    trigger: "POST /admissions/{id}/unfreeze"
    algorithm: aggregation
    formula: |
      # ceil-days elapsed in THIS freeze episode, added to the running total.
      elapsed_seconds = current_utc - frozen_at
      episode_days = ceil(elapsed_seconds / 86400)   # any partial day counts as a full day
      freeze_days_used = freeze_days_used + episode_days
      # the freeze TRANSITION (not unfreeze) enforces the cap on entry:
      #   freeze rejected if current freeze_days_used >= MAX_FREEZE_DAYS
      # so the running total is the conserved/accumulated quantity across episodes.
    input_set: "the single Admission; ClockState.current_utc; the prior freeze_days_used"
    constants:
      MAX_FREEZE_DAYS: 30
      SECONDS_PER_DAY: 86400
    precision: "integer days, ceil per episode"
    variants:
      - name: first_episode
        when: "freeze_days_used was 0 before this episode"
        difference: "running total == this episode's episode_days"
      - name: subsequent_episode
        when: "freeze_days_used > 0 before this episode"
        difference: "running total accumulates; cap evaluated against the running total at the NEXT freeze, not at unfreeze"

  - name: band_color_assignment
    trigger: "POST /admissions/{id}/check-in"
    algorithm: threshold
    formula: |
      h = guest.height_cm
      if   h >= GREEN_MIN_CM:  band_color = GREEN     # all attractions
      elif h >= YELLOW_MIN_CM: band_color = YELLOW    # most attractions
      else:                    band_color = RED       # kiddie area only
      # boundary precision: h == YELLOW_MIN_CM -> YELLOW (>=), h == GREEN_MIN_CM -> GREEN
    input_set: "the checked-in guest's height_cm"
    constants:
      GREEN_MIN_CM: 122
      YELLOW_MIN_CM: 107
    precision: "exact integer comparison, >= at each band floor"

# ============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# ============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and well-formed"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "acting role is permitted to perform this operation per §1.7"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: all

  - priority: 3
    category: auth
    check: "for Guest-owned resources, X-User-ID equals the resource's guest_id"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "guest-scoped order/admission mutations"

  - priority: 4
    category: existence
    check: "every path/body id resolves to a live resource, validated left-to-right"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all

  - priority: 5
    category: business_constraint
    check: "request body conforms to schema; required fields present, enums valid, numbers in range"
    error_id: ERR_INVALID_REQUEST
    http_status: 422
    applies_to: all

  - priority: 6
    category: state
    check: "target resource is in a state from which this transition is defined"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints"

  - priority: 7
    category: state
    check: "OCC: expected_entry_window_version matches EntryWindow.version on capacity writes"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /cabana-rentals, POST /admissions/{id}/assign-window"

  - priority: 8
    category: business_safety
    check: "check-in requires a bound guest_id and the guest's height yields a band; band gates entry"
    error_id: ERR_GUEST_NOT_BOUND
    http_status: 409
    applies_to: "POST /admissions/{id}/check-in"

  - priority: 9
    category: business_temporal
    check: "check-in clock must fall within [window.starts_at, window.ends_at); cabana rental interval must be valid (starts_at < ends_at) and not collide with a buffered prior rental on the same cabana"
    error_id: ERR_WINDOW_TIME_VIOLATION
    http_status: 409
    applies_to: "POST /admissions/{id}/check-in"

  - priority: 10
    category: business_temporal
    check: "new cabana rental interval [starts_at, ends_at) collides with a buffered non-terminal rental on the same cabana"
    error_id: ERR_CABANA_OVERLAP
    http_status: 409
    applies_to: "POST /cabana-rentals"

  - priority: 11
    category: business_safety
    check: "season-pass-only operations (freeze/unfreeze) rejected for DAY_TICKET admissions"
    error_id: ERR_FREEZE_NOT_ALLOWED
    http_status: 409
    applies_to: "POST /admissions/{id}/freeze, POST /admissions/{id}/unfreeze"

  - priority: 12
    category: business_constraint
    check: "a freeze that would carry freeze_days_used to MAX_FREEZE_DAYS or beyond is rejected"
    error_id: ERR_FREEZE_LIMIT_REACHED
    http_status: 409
    applies_to: "POST /admissions/{id}/freeze"

  - priority: 13
    category: business_referential
    check: "admission may be fulfilled only from a PAID order; window assignment only after FULFILLED"
    error_id: ERR_ORDER_NOT_PAID
    http_status: 409
    applies_to: "POST /orders/{id}/fulfill, POST /admissions/{id}/assign-window"

  - priority: 14
    category: business_constraint
    check: "new cabana sales blocked while Park.weather_status == STORM_WATCH or RAINED_OUT"
    error_id: ERR_WEATHER_HOLD
    http_status: 409
    applies_to: "POST /cabana-rentals"

  - priority: 15
    category: business_fiscal
    check: "assignment/unfreeze rejected when window reserved_count + admitted_count would exceed window_capacity"
    error_id: ERR_WINDOW_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /admissions/{id}/assign-window, POST /admissions/{id}/unfreeze, POST /cabana-rentals"

  - priority: 16
    category: business_fiscal
    check: "refund rejected if any admission under the order is CHECKED_IN (consumed value)"
    error_id: ERR_ALREADY_CONSUMED
    http_status: 409
    applies_to: "POST /orders/{id}/refund"

# ============================================================================
# §1.5 API Endpoint Table
# ============================================================================
endpoints:

  # ---- Park ----
  - method: POST
    path: "/parks"
    description: "create a park"
    roles: [ParkManager]
    code: 201
    input: [name, "timezone?", total_gate_capacity, "resident_zip_prefixes?", "rain_check_value_cents?"]
    output: Park
    side_effects: ["weather_status initialized CLEAR; open_window_count = 0"]

  - method: GET
    path: "/parks/{id}"
    description: "fetch a park"
    roles: [ParkManager, GateAgent, FinanceClerk, Guest]
    code: 200
    input: []
    output: Park
    side_effects: []

  - method: GET
    path: "/parks"
    description: "list parks (paginated)"
    roles: [ParkManager, GateAgent, FinanceClerk, Guest]
    code: 200
    input: ["limit?", "offset?"]
    output: Park[]
    side_effects: []

  - method: POST
    path: "/parks/{id}/weather"
    description: "set park weather posture; RAINED_OUT arms window rain-out"
    roles: [ParkManager]
    code: 200
    input: [weather_status]
    output: Park
    side_effects: ["recompute weather_status; STORM_WATCH/RAINED_OUT block new cabana sales"]

  # ---- PricingPolicy ----
  - method: POST
    path: "/pricing-policies"
    description: "create/supersede the active pricing policy for (park, product_type)"
    roles: [ParkManager]
    code: 201
    input: [park_id, product_type, base_price_cents, "resident_discount_pct?", "group_threshold?", "group_discount_pct?", "combo_price_cents?"]
    output: PricingPolicy
    side_effects: ["set prior active policy for same (park_id, product_type) to active=false"]

  - method: GET
    path: "/pricing-policies"
    description: "list pricing policies; filter by park_id (reverse-reachability for PricingPolicy.park_id) and product_type"
    roles: [ParkManager, Guest]
    code: 200
    input: ["park_id?", "product_type?", "active?", "limit?", "offset?"]
    output: PricingPolicy[]
    side_effects: []

  - method: GET
    path: "/pricing-policies/{id}"
    description: "fetch a pricing policy"
    roles: [ParkManager, Guest]
    code: 200
    input: []
    output: PricingPolicy
    side_effects: []

  # ---- EntryWindow ----
  - method: POST
    path: "/parks/{id}/entry-windows"
    description: "create a timed-entry window under a park"
    roles: [ParkManager]
    code: 201
    input: [starts_at, ends_at, window_capacity]
    output: EntryWindow
    side_effects: ["status OPEN; recompute Park.open_window_count"]

  - method: GET
    path: "/parks/{id}/entry-windows"
    description: "list a park's entry windows (reverse-reachability for EntryWindow.park_id)"
    roles: [ParkManager, GateAgent, Guest]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: EntryWindow[]
    side_effects: []

  - method: GET
    path: "/entry-windows/{id}"
    description: "fetch an entry window"
    roles: [ParkManager, GateAgent, Guest]
    code: 200
    input: []
    output: EntryWindow
    side_effects: []

  - method: POST
    path: "/entry-windows/{id}/restrict"
    description: "restrict a window: keep reservations, block new assignment"
    roles: [ParkManager]
    code: 200
    input: []
    output: EntryWindow
    side_effects: ["status OPEN->RESTRICTED; recompute Park.open_window_count"]

  - method: POST
    path: "/entry-windows/{id}/reopen"
    description: "reopen a restricted window"
    roles: [ParkManager]
    code: 200
    input: []
    output: EntryWindow
    side_effects: ["status RESTRICTED->OPEN; recompute Park.open_window_count"]

  - method: POST
    path: "/entry-windows/{id}/close"
    description: "close a window"
    roles: [ParkManager]
    code: 200
    input: ["force?"]
    output: EntryWindow
    side_effects: ["status -> CLOSED; recompute Park.open_window_count"]

  - method: POST
    path: "/entry-windows/{id}/rain-out"
    description: "rain out a window; cascades to admissions and cabana rentals"
    roles: [ParkManager]
    code: 200
    input: []
    output: EntryWindow
    side_effects: ["cascade admissions/cabana-rentals -> RAINED_OUT; issue rain-checks; reserved_count=0"]

  # ---- Cabana / Locker inventory ----
  - method: POST
    path: "/parks/{id}/cabanas"
    description: "create a cabana under a park"
    roles: [ParkManager]
    code: 201
    input: [label, tier, daily_rate_cents, "turnover_buffer_minutes?"]
    output: Cabana
    side_effects: []

  - method: GET
    path: "/parks/{id}/cabanas"
    description: "list a park's cabanas (reverse-reachability for Cabana.park_id)"
    roles: [ParkManager, Guest]
    code: 200
    input: ["tier?", "limit?", "offset?"]
    output: Cabana[]
    side_effects: []

  - method: GET
    path: "/cabanas/{id}"
    description: "fetch a cabana"
    roles: [ParkManager, Guest]
    code: 200
    input: []
    output: Cabana
    side_effects: []

  - method: POST
    path: "/parks/{id}/lockers"
    description: "create a locker under a park"
    roles: [ParkManager]
    code: 201
    input: [bank_code, hourly_rate_cents]
    output: Locker
    side_effects: []

  - method: GET
    path: "/parks/{id}/lockers"
    description: "list a park's lockers (reverse-reachability for Locker.park_id)"
    roles: [ParkManager, Guest]
    code: 200
    input: ["limit?", "offset?"]
    output: Locker[]
    side_effects: []

  - method: GET
    path: "/lockers/{id}"
    description: "fetch a locker"
    roles: [ParkManager, Guest]
    code: 200
    input: []
    output: Locker
    side_effects: []

  # ---- Guest ----
  - method: POST
    path: "/guests"
    description: "register a guest"
    roles: [Guest, ParkManager]
    code: 201
    input: [full_name, email, zip_code, height_cm]
    output: Guest
    side_effects: ["wallet_credit_cents = 0"]

  - method: GET
    path: "/guests/{id}"
    description: "fetch a guest"
    roles: [Guest, ParkManager, GateAgent, FinanceClerk]
    code: 200
    input: []
    output: Guest
    side_effects: []

  # ---- Order lifecycle ----
  - method: POST
    path: "/orders"
    description: "create an order (PENDING/UNFULFILLED)"
    roles: [Guest]
    code: 201
    input: [park_id, guest_id, product_type, party_size, "food_beverage_combo?"]
    output: Order
    side_effects: ["payment_status PENDING; fulfillment_status UNFULFILLED"]

  - method: GET
    path: "/orders/{id}"
    description: "fetch an order"
    roles: [Guest, FinanceClerk, ParkManager]
    code: 200
    input: []
    output: Order
    side_effects: []

  - method: GET
    path: "/orders"
    description: "list orders; filter by guest_id (reverse-reachability for Order.guest_id) and park_id (Order.park_id)"
    roles: [Guest, FinanceClerk, ParkManager]
    code: 200
    input: ["guest_id?", "park_id?", "payment_status?", "limit?", "offset?"]
    output: Order[]
    side_effects: []

  - method: POST
    path: "/orders/{id}/pay"
    description: "pay an order; runs quote_order; debits wallet credit"
    roles: [Guest]
    code: 200
    input: []
    output: Order
    side_effects: ["quote_order; payment_status PENDING->PAID; debit Guest.wallet_credit_cents; increments Order.version by 1"]

  - method: POST
    path: "/orders/{id}/cancel"
    description: "cancel an unpaid order"
    roles: [Guest]
    code: 200
    input: []
    output: Order
    side_effects: ["payment_status PENDING->VOID; release HELD cabana rentals; increments Order.version by 1"]

  - method: POST
    path: "/orders/{id}/fulfill"
    description: "fulfill a paid order: mint admissions, confirm cabana rentals"
    roles: [Guest]
    code: 200
    input: []
    output: Order
    side_effects: ["mint party_size Admission rows; HELD cabana rentals -> CONFIRMED; fulfillment_status -> FULFILLED; increments Order.version by 1"]

  - method: POST
    path: "/orders/{id}/refund"
    description: "refund a paid order; cascade-cancel admissions and rentals"
    roles: [FinanceClerk]
    code: 200
    input: []
    output: Order
    side_effects: ["credit Guest.wallet_credit_cents by total_cents; cascade admissions/rentals -> CANCELLED; decrement EntryWindow.reserved_count; increments Order.version by 1"]

  - method: GET
    path: "/orders/{id}/admissions"
    description: "list admissions minted by an order (reverse-reachability for Admission.order_id)"
    roles: [Guest, FinanceClerk, ParkManager, GateAgent]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: Admission[]
    side_effects: []

  - method: GET
    path: "/orders/{id}/cabana-rentals"
    description: "list cabana rentals under an order (reverse-reachability for CabanaRental.order_id)"
    roles: [Guest, FinanceClerk, ParkManager]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: CabanaRental[]
    side_effects: []

  - method: GET
    path: "/orders/{id}/locker-rentals"
    description: "list locker rentals under an order (reverse-reachability for LockerRental.order_id)"
    roles: [Guest, FinanceClerk, ParkManager]
    code: 200
    input: ["limit?", "offset?"]
    output: LockerRental[]
    side_effects: []

  # ---- Admission lifecycle ----
  - method: GET
    path: "/admissions/{id}"
    description: "fetch an admission"
    roles: [Guest, GateAgent, ParkManager, FinanceClerk]
    code: 200
    input: []
    output: Admission
    side_effects: []

  - method: GET
    path: "/admissions"
    description: "list admissions; filter by entry_window_id (reverse-reachability for Admission.entry_window_id), guest_id, park_id"
    roles: [Guest, GateAgent, ParkManager, FinanceClerk]
    code: 200
    input: ["entry_window_id?", "guest_id?", "park_id?", "status?", "limit?", "offset?"]
    output: Admission[]
    side_effects: []

  - method: POST
    path: "/admissions/{id}/bind-guest"
    description: "bind a named guest to an admission (sets guest_id) before check-in"
    roles: [Guest, GateAgent]
    code: 200
    input: [guest_id]
    output: Admission
    side_effects: ["set Admission.guest_id"]

  - method: POST
    path: "/admissions/{id}/assign-window"
    description: "assign an ISSUED admission to an entry window (capacity write, OCC-guarded)"
    roles: [Guest]
    code: 200
    input: [entry_window_id, expected_entry_window_version]
    output: Admission
    side_effects: ["status ISSUED->CONFIRMED; increment EntryWindow.reserved_count; increments EntryWindow.version by 1"]

  - method: POST
    path: "/admissions/{id}/check-in"
    description: "gate check-in; assigns wristband band color"
    roles: [GateAgent]
    code: 200
    input: []
    output: Admission
    side_effects: ["band_color_assignment; status CONFIRMED->CHECKED_IN; reserved_count--; admitted_count++"]

  - method: POST
    path: "/admissions/{id}/freeze"
    description: "freeze a season pass (SEASON_PASS only)"
    roles: [Guest]
    code: 200
    input: []
    output: Admission
    side_effects: ["status CONFIRMED->FROZEN; set frozen_at; release window capacity (reserved_count--)"]

  - method: POST
    path: "/admissions/{id}/unfreeze"
    description: "unfreeze a season pass; accumulates freeze_days_used (capacity write)"
    roles: [Guest]
    code: 200
    input: []
    output: Admission
    side_effects: ["freeze_days_accounting; status FROZEN->CONFIRMED; clear frozen_at; reserved_count++"]

  - method: POST
    path: "/admissions/{id}/cancel"
    description: "cancel a non-terminal admission"
    roles: [Guest, ParkManager]
    code: 200
    input: []
    output: Admission
    side_effects: ["status -> CANCELLED; if was CONFIRMED, decrement EntryWindow.reserved_count"]

  # ---- Cabana / Locker rentals ----
  - method: POST
    path: "/cabana-rentals"
    description: "rent a cabana for a window (capacity + time-overlap checked, OCC-guarded)"
    roles: [Guest]
    code: 201
    input: [cabana_id, order_id, entry_window_id, starts_at, ends_at, expected_entry_window_version]
    output: CabanaRental
    side_effects: ["status HELD; price_cents = Cabana.daily_rate_cents; increment EntryWindow.reserved_count; increments EntryWindow.version by 1"]

  - method: GET
    path: "/cabana-rentals/{id}"
    description: "fetch a cabana rental"
    roles: [Guest, ParkManager, FinanceClerk]
    code: 200
    input: []
    output: CabanaRental
    side_effects: []

  - method: GET
    path: "/cabana-rentals"
    description: "list cabana rentals; filter by park_id (reverse-reachability for CabanaRental.park_id), entry_window_id (CabanaRental.entry_window_id), cabana_id, order_id"
    roles: [Guest, ParkManager, FinanceClerk]
    code: 200
    input: ["park_id?", "entry_window_id?", "cabana_id?", "order_id?", "status?", "limit?", "offset?"]
    output: CabanaRental[]
    side_effects: []

  - method: GET
    path: "/cabanas/{id}/cabana-rentals"
    description: "list rentals on a cabana (reverse-reachability for CabanaRental.cabana_id)"
    roles: [Guest, ParkManager]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: CabanaRental[]
    side_effects: []

  - method: POST
    path: "/cabana-rentals/{id}/cancel"
    description: "cancel a cabana rental; releases capacity"
    roles: [Guest, ParkManager]
    code: 200
    input: []
    output: CabanaRental
    side_effects: ["status -> CANCELLED; decrement EntryWindow.reserved_count"]

  - method: POST
    path: "/locker-rentals"
    description: "rent a locker (priced by ceil hours)"
    roles: [Guest]
    code: 201
    input: [locker_id, order_id, starts_at, ends_at]
    output: LockerRental
    side_effects: ["locker_rental_charge: hours_billed, price_cents"]

  - method: GET
    path: "/locker-rentals/{id}"
    description: "fetch a locker rental"
    roles: [Guest, ParkManager, FinanceClerk]
    code: 200
    input: []
    output: LockerRental
    side_effects: []

  - method: GET
    path: "/lockers/{id}/locker-rentals"
    description: "list rentals on a locker (reverse-reachability for LockerRental.locker_id)"
    roles: [Guest, ParkManager]
    code: 200
    input: ["limit?", "offset?"]
    output: LockerRental[]
    side_effects: []

  # ---- RainCheck ----
  - method: GET
    path: "/rain-checks/{id}"
    description: "fetch a rain-check voucher"
    roles: [Guest, FinanceClerk, ParkManager]
    code: 200
    input: []
    output: RainCheck
    side_effects: []

  - method: GET
    path: "/rain-checks"
    description: "list rain-checks; filter by guest_id (reverse-reachability for RainCheck.guest_id) and park_id (RainCheck.park_id)"
    roles: [Guest, FinanceClerk, ParkManager]
    code: 200
    input: ["guest_id?", "park_id?", "status?", "limit?", "offset?"]
    output: RainCheck[]
    side_effects: []

  - method: POST
    path: "/rain-checks/{id}/settle"
    description: "settle a rain-check: credit guest wallet"
    roles: [FinanceClerk]
    code: 200
    input: []
    output: RainCheck
    side_effects: ["status ISSUED->SETTLED; credit Guest.wallet_credit_cents by value_cents"]

  - method: POST
    path: "/rain-checks/{id}/expire"
    description: "expire a rain-check without crediting"
    roles: [ParkManager]
    code: 200
    input: []
    output: RainCheck
    side_effects: ["status ISSUED->EXPIRED"]

  # ---- Test-driving clock ----
  - method: POST
    path: "/_clock/set_current_utc"
    description: "set server clock for window/freeze comparisons (test-driving)"
    roles: [ParkManager]
    code: 200
    input: [to_iso8601]
    output: ClockState
    side_effects: ["ClockState.current_utc = to_iso8601"]

# ============================================================================
# §1.6 Error Code Catalog
# ============================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "missing or malformed X-User-Role / X-User-ID headers"
  - id: ERR_FORBIDDEN_ROLE
    http: 403
    condition: "acting role not permitted for this operation"
  - id: ERR_NOT_RESOURCE_OWNER
    http: 403
    condition: "Guest acting on an order/admission whose guest_id is not their X-User-ID"
  - id: ERR_NOT_FOUND
    http: 404
    condition: "referenced park/window/order/admission/cabana/locker/guest/rain-check does not exist"
  - id: ERR_INVALID_REQUEST
    http: 422
    condition: "missing required field, bad enum, out-of-range number, starts_at >= ends_at"
  - id: ERR_INVALID_STATE
    http: 409
    condition: "transition not defined from the resource's current state"
  - id: ERR_STALE_VERSION
    http: 412
    condition: "expected_entry_window_version does not match EntryWindow.version"
  - id: ERR_GUEST_NOT_BOUND
    http: 409
    condition: "check-in attempted on an admission with no bound guest_id"
  - id: ERR_WINDOW_TIME_VIOLATION
    http: 409
    condition: "check-in clock outside [window.starts_at, window.ends_at)"
  - id: ERR_CABANA_OVERLAP
    http: 409
    condition: "new cabana rental interval collides with a buffered non-terminal rental on the same cabana"
  - id: ERR_FREEZE_NOT_ALLOWED
    http: 409
    condition: "freeze/unfreeze attempted on a DAY_TICKET admission"
  - id: ERR_FREEZE_LIMIT_REACHED
    http: 409
    condition: "freeze would carry freeze_days_used to MAX_FREEZE_DAYS or beyond"
  - id: ERR_ORDER_NOT_PAID
    http: 409
    condition: "fulfill or window-assignment attempted before order is PAID/FULFILLED"
  - id: ERR_WEATHER_HOLD
    http: 409
    condition: "new cabana sale attempted while Park.weather_status is STORM_WATCH or RAINED_OUT"
  - id: ERR_WINDOW_CAPACITY_EXCEEDED
    http: 409
    condition: "window assignment/unfreeze/rental would push reserved+admitted beyond window_capacity"
  - id: ERR_ALREADY_CONSUMED
    http: 409
    condition: "refund attempted while an admission under the order is CHECKED_IN"
  - id: ERR_RAINCHECK_NOT_ISSUED
    http: 409
    condition: "settle/expire attempted on a rain-check not in ISSUED status"
  - id: ERR_NO_ACTIVE_POLICY
    http: 409
    condition: "pay attempted with no active PricingPolicy for (park_id, product_type)"
  - id: ERR_PAGINATION_INVALID
    http: 422
    condition: "limit/offset out of bounds (limit 1..100, offset >= 0)"
  - id: ERR_WINDOW_NOT_OPEN
    http: 409
    condition: "assignment/check-in attempted against a window not in OPEN status"

# ============================================================================
# §1.7 RBAC Matrix
# ============================================================================
roles:
  - name: Guest
    description: "a paying visitor who buys orders, manages own admissions/rentals"
    identity: "entity_backed:Guest"
    exclusive_operations:
      - "POST /orders"
      - "POST /orders/{id}/pay"
      - "POST /orders/{id}/cancel"
      - "POST /orders/{id}/fulfill"
      - "POST /admissions/{id}/assign-window"
      - "POST /admissions/{id}/freeze"
      - "POST /admissions/{id}/unfreeze"
      - "POST /cabana-rentals"
      - "POST /locker-rentals"
    shared_operations:
      - "POST /guests"
      - "POST /admissions/{id}/bind-guest"
      - "POST /admissions/{id}/cancel"
      - "POST /cabana-rentals/{id}/cancel"
      - "GET (own orders, admissions, rentals, rain-checks, parks, windows, cabanas, lockers, pricing-policies)"

  - name: GateAgent
    description: "staffs the gate; binds guests and checks admissions in"
    identity: "opaque"
    exclusive_operations:
      - "POST /admissions/{id}/check-in"
    shared_operations:
      - "POST /admissions/{id}/bind-guest"
      - "GET (admissions, windows, parks, guests)"

  - name: ParkManager
    description: "configures parks, windows, inventory, pricing; runs weather and window ops"
    identity: "opaque"
    exclusive_operations:
      - "POST /parks"
      - "POST /parks/{id}/weather"
      - "POST /pricing-policies"
      - "POST /parks/{id}/entry-windows"
      - "POST /entry-windows/{id}/restrict"
      - "POST /entry-windows/{id}/reopen"
      - "POST /entry-windows/{id}/close"
      - "POST /entry-windows/{id}/rain-out"
      - "POST /parks/{id}/cabanas"
      - "POST /parks/{id}/lockers"
      - "POST /rain-checks/{id}/expire"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "POST /guests"
      - "POST /admissions/{id}/cancel"
      - "POST /cabana-rentals/{id}/cancel"
      - "GET (all read endpoints)"

  - name: FinanceClerk
    description: "handles refunds and rain-check settlement"
    identity: "opaque"
    exclusive_operations:
      - "POST /orders/{id}/refund"
      - "POST /rain-checks/{id}/settle"
    shared_operations:
      - "GET (orders, admissions, rentals, rain-checks, guests)"
