        grounds:
          - validations.priority_23
          - errors.ERR_SHIPMENT_WINDOW_OVERLAP
          - calculations.ship_cadence_days
          - entities.Shipment.fields.scheduled_ship_date
          - endpoints.POST_subscriptions_id_shipments
        distinguishing_aspect: |
          Resource = the Subscription's cadence timeline, with the OPPOSITE interval
          semantics to the Unit rule: HALF-OPEN [start, start + cadence) and NO buffer at
          all, so exact adjacency is LEGAL. With shipment #1 on 2026-08-05 and
          ship_cadence_days 75, the date 2026-10-18 is refused and 2026-10-19 — a gap of zero
