      - name: posthumous_waiting_constant_sets_eligible_from_year
        claim_type: constants_applied
        grounds:
          - calculations.career_eligibility_assessment.constants.POSTHUMOUS_WAITING_YEARS
          - entities.Candidacy.fields.eligible_from_year
          - validations[priority=47]
        distinguishing_aspect: |
          The POSTHUMOUS pathway ignores rule.waiting_period_years (declared as 5 here) and applies
          the POSTHUMOUS_WAITING_YEARS constant to max(retirement_year 2020, death_year 2025):
          eligible_from_year = 2025 + 1 = 2026, so the nomination into the 2026 cycle is accepted at
          exactly the boundary.
        test_recipe:
          setup:
            - "EligibilityRule (PLAYER, POSTHUMOUS) with waiting_period_years 5 (deliberately unused by the posthumous branch)."
            - "VoterBloc WRITERS with CREDENTIALED elector e1."
            - "Deceased candidate: retirement_year 2020, death_year 2025, 12 seasons, metric 2500."
            - "Cycle 2026 BASEBALL in NOMINATIONS_OPEN."
          setup_api_calls:
            - call: "POST /eligibility-rules"
              payload: { category: "PLAYER", pathway: "POSTHUMOUS", waiting_period_years: 5, min_career_seasons: 10, min_career_metric: 2000, max_ballot_appearances: 3, election_threshold_pct: 0.75, carryover_min_pct: 0.05, runoff_floor_pct: 0.25 }
              as: ElectionAdministrator
              as_user_id: "admin-1"
            - call: "POST /voter-blocs"
              payload: { bloc_code: "WRITERS", name: "Baseball Writers", seat_cap: 4, min_participation_pct: 0.50 }
