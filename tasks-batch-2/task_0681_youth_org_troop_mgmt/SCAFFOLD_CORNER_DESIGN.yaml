# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Youth Organization & Troop Management — Expert
# Breadth probe over claim-extraction-guide sections; §1.8 instances stubbed out.
# =============================================================================
scaffold_corner_design:

  # =================================================================== Entities
  - section: entities
    instances:
      - name: create_council_returns_201_with_defaults
        claim_type: Creation
        grounds: [entities.Council.fields.name, endpoints]
        distinguishing_aspect: "POST /councils with all required fields returns 201; fund_cash_cents and fund_liability_cents default to 0."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /councils"
              payload: { name: "C1", charter_fee_cents: 30000, youth_dues_cents: 12000, adult_dues_cents: 4500, program_year: 2026 }
              as: CouncilRegistrar
              captures: { cid: $.data.id }
          assert:
            - "Council.${cid}.fund_cash_cents == 0"
            - "Council.${cid}.fund_liability_cents == 0"

      - name: get_member_not_found_returns_404
        claim_type: Not Found
        grounds: [entities.Member, "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET /members/{non-existent uuid} returns ERR_NOT_FOUND with HTTP 404."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /members/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: CouncilRegistrar
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_NOT_FOUND"

      - name: create_troop_missing_unit_number_returns_invalid_request
        claim_type: Required Fields
        grounds: [entities.Troop.fields.unit_number, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /councils/{id}/troops without unit_number returns ERR_INVALID_REQUEST (422)."
        test_recipe:
          setup: ["A council exists."]
          setup_api_calls:
            - call: "POST /councils"
              payload: { name: "C2", charter_fee_cents: 30000, youth_dues_cents: 12000, adult_dues_cents: 4500, program_year: 2026 }
              as: CouncilRegistrar
              captures: { cid: $.data.id }
          trigger:
            - call: "POST /councils/${cid}/troops"
              payload: { program_type: "SCOUTS" }
              as: CouncilRegistrar
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_REQUEST"

      - name: duplicate_unit_number_within_council_rejected
        claim_type: Type Constraints
        grounds: [entities.Troop.fields.unit_number, "errors[ERR_DUPLICATE_UNIT_NUMBER]"]
        distinguishing_aspect: "A second troop with the same unit_number in the same council returns ERR_DUPLICATE_UNIT_NUMBER (409)."
        test_recipe:
          setup: ["A council with troop unit_number U-A."]
          setup_api_calls:
            - call: "POST /councils"
              payload: { name: "C3", charter_fee_cents: 30000, youth_dues_cents: 12000, adult_dues_cents: 4500, program_year: 2026 }
              as: CouncilRegistrar
              captures: { cid: $.data.id }
            - call: "POST /councils/${cid}/troops"
              payload: { unit_number: "U-A", program_type: "SCOUTS" }
              as: CouncilRegistrar
          trigger:
            - call: "POST /councils/${cid}/troops"
              payload: { unit_number: "U-A", program_type: "CUB" }
              as: CouncilRegistrar
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_DUPLICATE_UNIT_NUMBER"

      - name: invalid_member_type_enum_rejected
        claim_type: Type Constraints
        grounds: [entities.Member.fields.member_type, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /troops/{id}/members with member_type=GROWNUP (not in YOUTH|ADULT) returns ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["A troop exists."]
          setup_api_calls:
            - call: "POST /councils"
              payload: { name: "C4", charter_fee_cents: 30000, youth_dues_cents: 12000, adult_dues_cents: 4500, program_year: 2026 }
              as: CouncilRegistrar
              captures: { cid: $.data.id }
            - call: "POST /councils/${cid}/troops"
              payload: { unit_number: "U-B", program_type: "SCOUTS" }
              as: CouncilRegistrar
              captures: { tid: $.data.id }
          trigger:
            - call: "POST /troops/${tid}/members"
              payload: { member_type: "GROWNUP", full_name: "X", birthdate: "2010-01-01" }
              as: TroopLeader
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_REQUEST"

      - name: member_id_and_system_fields_ignored_on_input
        claim_type: System Fields
        grounds: [entities.Member, entities.Member.fields.registration_status]
        distinguishing_aspect: "Newly created member starts registration_status=PENDING and rank=SCOUT regardless of any client-supplied values."
        test_recipe:
          setup: ["A troop exists."]
          setup_api_calls:
            - call: "POST /councils"
              payload: { name: "C5", charter_fee_cents: 30000, youth_dues_cents: 12000, adult_dues_cents: 4500, program_year: 2026 }
              as: CouncilRegistrar
              captures: { cid: $.data.id }
            - call: "POST /councils/${cid}/troops"
              payload: { unit_number: "U-C", program_type: "SCOUTS" }
              as: CouncilRegistrar
              captures: { tid: $.data.id }
          trigger:
            - call: "POST /troops/${tid}/members"
              payload: { member_type: "YOUTH", full_name: "Newbie", birthdate: "2014-02-02" }
              as: TroopLeader
              captures: { mid: $.data.id }
          assert:
            - "Member.${mid}.registration_status == PENDING"
            - "Member.${mid}.rank == SCOUT"

      - name: computed_council_fund_balance_after_payment
        claim_type: Computed Fields
        grounds: [entities.Troop.fields.dues_account_cents, calculations.council_fund_balances]
        distinguishing_aspect: "After a 12000-cent payment, the troop's dues_account_cents recomputes to 12000 (TROOP_DUES credit)."
        test_recipe:
          setup: ["A PENDING youth with an OPEN dues invoice of 12000."]
          setup_api_calls:
            - call: "POST /councils"
              payload: { name: "C6", charter_fee_cents: 30000, youth_dues_cents: 12000, adult_dues_cents: 4500, program_year: 2026 }
              as: CouncilRegistrar
              captures: { cid: $.data.id }
            - call: "POST /councils/${cid}/troops"
              payload: { unit_number: "U-D", program_type: "SCOUTS" }
              as: CouncilRegistrar
              captures: { tid: $.data.id }
            - call: "POST /troops/${tid}/members"
              payload: { member_type: "YOUTH", full_name: "Pay Youth", birthdate: "2014-02-02" }
              as: TroopLeader
              captures: { mid: $.data.id }
            - call: "POST /members/${mid}/dues-invoices"
              payload: { issued_on: "2026-01-01" }
              as: CouncilRegistrar
              captures: { inv: $.data.id }
          trigger:
            - call: "POST /payments"
              payload: { invoice_id: "${inv}", member_id: "${mid}", amount_cents: 12000 }
              as: CouncilRegistrar
          assert:
            - "Troop.${tid}.dues_account_cents == 12000"

      - name: list_members_paginated_envelope
        claim_type: Listing
        grounds: [entities.Member, endpoints]
        distinguishing_aspect: "GET /members?troop_id=... returns response_type=array with total_count and has_more pagination fields."
        test_recipe:
          setup: ["A troop with one member."]
          setup_api_calls:
            - call: "POST /councils"
              payload: { name: "C7", charter_fee_cents: 30000, youth_dues_cents: 12000, adult_dues_cents: 4500, program_year: 2026 }
              as: CouncilRegistrar
              captures: { cid: $.data.id }
            - call: "POST /councils/${cid}/troops"
              payload: { unit_number: "U-E", program_type: "SCOUTS" }
              as: CouncilRegistrar
              captures: { tid: $.data.id }
            - call: "POST /troops/${tid}/members"
              payload: { member_type: "YOUTH", full_name: "L Youth", birthdate: "2014-02-02" }
              as: TroopLeader
          trigger:
            - call: "GET /members"
              payload: { troop_id: "${tid}" }
              as: CouncilRegistrar
          assert:
            - "meta.total_count == 1"
            - "meta.has_more == false"

  # =================================================================== State machines
  - section: state_machines
    instances:
      - name: suspend_already_dropped_member_invalid_state
        claim_type: Invalid Transitions
        grounds: [state_machines.Member.REGISTERED_to_SUSPENDED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Suspending a DROPPED member returns ERR_INVALID_STATE; no transition from DROPPED."
        test_recipe:
          setup: ["A member dropped from PENDING."]
          setup_api_calls:
            - call: "POST /councils"
              payload: { name: "S1", charter_fee_cents: 30000, youth_dues_cents: 12000, adult_dues_cents: 4500, program_year: 2026 }
              as: CouncilRegistrar
              captures: { cid: $.data.id }
            - call: "POST /councils/${cid}/troops"
              payload: { unit_number: "S-1", program_type: "SCOUTS" }
              as: CouncilRegistrar
              captures: { tid: $.data.id }
            - call: "POST /troops/${tid}/members"
              payload: { member_type: "YOUTH", full_name: "D Youth", birthdate: "2014-02-02" }
              as: TroopLeader
              captures: { mid: $.data.id }
            - call: "POST /members/${mid}/drop"
              payload: {}
              as: TroopLeader
          trigger:
            - call: "POST /members/${mid}/suspend"
              payload: {}
              as: TroopLeader
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_STATE"
            - "Member.${mid}.registration_status == DROPPED"

      - name: drop_member_voids_open_invoices
        claim_type: Side Effect Execution
        grounds: [state_machines.Member.REGISTERED_to_DROPPED, entities.DuesInvoice.fields.status]
        distinguishing_aspect: "Dropping a member transitions all its OPEN DuesInvoice rows to VOID."
        test_recipe:
          setup: ["A PENDING youth with one OPEN dues invoice (not paid)."]
          setup_api_calls:
            - call: "POST /councils"
              payload: { name: "S2", charter_fee_cents: 30000, youth_dues_cents: 12000, adult_dues_cents: 4500, program_year: 2026 }
              as: CouncilRegistrar
              captures: { cid: $.data.id }
            - call: "POST /councils/${cid}/troops"
              payload: { unit_number: "S-2", program_type: "SCOUTS" }
              as: CouncilRegistrar
              captures: { tid: $.data.id }
            - call: "POST /troops/${tid}/members"
              payload: { member_type: "YOUTH", full_name: "V Youth", birthdate: "2014-02-02" }
              as: TroopLeader
              captures: { mid: $.data.id }
            - call: "POST /members/${mid}/dues-invoices"
              payload: { issued_on: "2026-01-01" }
              as: CouncilRegistrar
              captures: { inv: $.data.id }
          trigger:
            - call: "POST /members/${mid}/drop"
              payload: {}
              as: TroopLeader
          assert:
            - "Member.${mid}.registration_status == DROPPED"
            - "DuesInvoice.${inv}.status == VOID"

      - name: member_initial_state_pending
        claim_type: Initial State
        grounds: [state_machines.Member, entities.Member.fields.registration_status]
        excluded_because:
          difficulty_instance: transitive_cascade / payment_paid_registered_troop_posture_depth3
          rationale: "PENDING initial state is the precondition exercised before the cascade flips it to REGISTERED."

      - name: bgcheck_resolve_before_start_invalid_state
        claim_type: Invalid Transitions
        grounds: [state_machines.LeaderCredential.PENDING_to_CLEARED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Resolving a bgcheck still in NOT_STARTED (never started) returns ERR_INVALID_STATE."
        test_recipe:
          setup: ["An ADULT member with a fresh LeaderCredential (bgcheck NOT_STARTED)."]
          setup_api_calls:
            - call: "POST /councils"
              payload: { name: "S3", charter_fee_cents: 30000, youth_dues_cents: 12000, adult_dues_cents: 4500, program_year: 2026 }
              as: CouncilRegistrar
              captures: { cid: $.data.id }
            - call: "POST /councils/${cid}/troops"
              payload: { unit_number: "S-3", program_type: "SCOUTS" }
              as: CouncilRegistrar
              captures: { tid: $.data.id }
            - call: "POST /troops/${tid}/members"
              payload: { member_type: "ADULT", full_name: "Adult L", birthdate: "1980-01-01" }
              as: TroopLeader
              captures: { mid: $.data.id }
            - call: "POST /members/${mid}/leader-credentials"
              payload: { requested_by_user_id: "leader-bob" }
              as: TroopLeader
              captures: { lc: $.data.id }
          trigger:
            - call: "POST /leader-credentials/${lc}/resolve-bgcheck"
              payload: { outcome: "CLEAR" }
              as: CouncilRegistrar
              as_user_id: "registrar-amy"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_STATE"

      - name: fundraiser_terminal_closed_no_further_go_live
        claim_type: Terminal State Lockdown
        grounds: [state_machines.Fundraiser.LIVE_to_CLOSED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "go-live on a CLOSED fundraiser returns ERR_INVALID_STATE (CLOSED is terminal)."
        test_recipe:
          setup: ["A fundraiser taken LIVE then CLOSED."]
          setup_api_calls:
            - call: "POST /councils"
              payload: { name: "S4", charter_fee_cents: 30000, youth_dues_cents: 12000, adult_dues_cents: 4500, program_year: 2026 }
              as: CouncilRegistrar
              captures: { cid: $.data.id }
            - call: "POST /councils/${cid}/fundraisers"
              payload: { product: "COOKIES", unit_price_cents: 500, unit_cost_cents: 200, total_inventory_units: 100 }
              as: CouncilRegistrar
              captures: { fr: $.data.id }
            - call: "POST /fundraisers/${fr}/go-live"
              payload: {}
              as: CouncilRegistrar
            - call: "POST /fundraisers/${fr}/close"
              payload: {}
              as: CouncilRegistrar
          trigger:
            - call: "POST /fundraisers/${fr}/go-live"
              payload: {}
              as: CouncilRegistrar
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_STATE"

      - name: fundraiser_close_cancels_placed_and_reverses_commission
        claim_type: Side Effect Execution
        grounds: [state_machines.Fundraiser.LIVE_to_CLOSED, state_machines.FundraiserOrder.PLACED_to_CANCELLED, entities.Troop.fields.dues_account_cents]
        distinguishing_aspect: "Closing a fundraiser cancels its PLACED orders and reverses their commissions; troop dues_account_cents returns to 0."
        test_recipe:
          setup: ["LIVE fundraiser with one PLACED 150u order (commission 12500); troop dues_account_cents=12500."]
          setup_api_calls:
            - call: "POST /councils"
              payload: { name: "S5", charter_fee_cents: 30000, youth_dues_cents: 12000, adult_dues_cents: 4500, program_year: 2026 }
              as: CouncilRegistrar
              captures: { cid: $.data.id }
            - call: "POST /councils/${cid}/troops"
              payload: { unit_number: "S-5", program_type: "SCOUTS" }
              as: CouncilRegistrar
              captures: { tid: $.data.id }
            - call: "POST /troops/${tid}/members"
              payload: { member_type: "YOUTH", full_name: "Seller", birthdate: "2013-03-03" }
              as: TroopLeader
              captures: { sid: $.data.id }
            - call: "POST /councils/${cid}/fundraisers"
              payload: { product: "COOKIES", unit_price_cents: 500, unit_cost_cents: 200, total_inventory_units: 1000 }
              as: CouncilRegistrar
              captures: { fr: $.data.id }
            - call: "POST /fundraisers/${fr}/go-live"
              payload: {}
              as: CouncilRegistrar
              captures: { frv: $.data.version }
            - call: "POST /fundraiser-orders"
              payload: { fundraiser_id: "${fr}", troop_id: "${tid}", seller_member_id: "${sid}", units: 150, expected_fundraiser_version: "${frv}" }
              as: TroopLeader
              captures: { oid: $.data.id }
          trigger:
            - call: "POST /fundraisers/${fr}/close"
              payload: {}
              as: CouncilRegistrar
          assert:
            - "Fundraiser.${fr}.status == CLOSED"
            - "FundraiserOrder.${oid}.status == CANCELLED"
            - "Troop.${tid}.dues_account_cents == 0"

      - name: cyclic_advancement_loop_covered
        claim_type: Valid Transition
        grounds: [state_machines.Advancement.RETURNED_to_SUBMITTED]
        excluded_because:
          difficulty_instance: non_linear_state_machine / advancement_submitted_returned_resubmit_cycle
          rationale: "The RETURNED->SUBMITTED->APPROVED loop is the body of the named §1.8 cyclic instance."

      - name: event_cancel_cascade_covered
        claim_type: Side Effect Execution
        grounds: [state_machines.Event.OPEN_to_CANCELLED]
        excluded_because:
          difficulty_instance: transitive_cascade / event_cancel_cascades_registration_and_count_depth2
          rationale: "Event-cancel cascade to registrations and confirmed_count is the named §1.8 cascade."

  # =================================================================== Calculations
  - section: calculations
    instances:
      - name: commission_tier_boundary_exactly_100_units
        claim_type: Correct Result
        grounds: [calculations.fundraiser_troop_commission]
        distinguishing_aspect: "An order of exactly TIER1_MAX=100 units at 500c earns only RATE1: 100*500*0.15 = 7500 commission."
        test_recipe:
          setup: ["LIVE fundraiser unit_price_cents=500, inventory 1000."]
          setup_api_calls:
            - call: "POST /councils"
              payload: { name: "K1", charter_fee_cents: 30000, youth_dues_cents: 12000, adult_dues_cents: 4500, program_year: 2026 }
              as: CouncilRegistrar
              captures: { cid: $.data.id }
            - call: "POST /councils/${cid}/troops"
              payload: { unit_number: "K-1", program_type: "SCOUTS" }
              as: CouncilRegistrar
              captures: { tid: $.data.id }
            - call: "POST /troops/${tid}/members"
              payload: { member_type: "YOUTH", full_name: "Seller", birthdate: "2013-03-03" }
              as: TroopLeader
              captures: { sid: $.data.id }
            - call: "POST /councils/${cid}/fundraisers"
              payload: { product: "COOKIES", unit_price_cents: 500, unit_cost_cents: 200, total_inventory_units: 1000 }
              as: CouncilRegistrar
              captures: { fr: $.data.id }
            - call: "POST /fundraisers/${fr}/go-live"
              payload: {}
              as: CouncilRegistrar
              captures: { frv: $.data.version }
          trigger:
            - call: "POST /fundraiser-orders"
              payload: { fundraiser_id: "${fr}", troop_id: "${tid}", seller_member_id: "${sid}", units: 100, expected_fundraiser_version: "${frv}" }
              as: TroopLeader
              captures: { oid: $.data.id }
          assert:
            - "FundraiserOrder.${oid}.troop_commission_cents == 7500"
            - "FundraiserOrder.${oid}.gross_cents == 50000"

      - name: fill_order_posts_cash_and_liability_ledger
        claim_type: Correct Result
        grounds: [state_machines.FundraiserOrder.PLACED_to_FILLED, calculations.council_fund_balances, entities.Council.fields.fund_liability_cents]
        distinguishing_aspect: "Filling a 150u@500 order with unit_cost 200 posts +75000 to COUNCIL_CASH and +30000 to PRODUCT_LIABILITY."
        test_recipe:
          setup: ["LIVE fundraiser unit_price_cents=500, unit_cost_cents=200; one PLACED 150u order."]
          setup_api_calls:
            - call: "POST /councils"
              payload: { name: "K2", charter_fee_cents: 30000, youth_dues_cents: 12000, adult_dues_cents: 4500, program_year: 2026 }
              as: CouncilRegistrar
              captures: { cid: $.data.id }
            - call: "POST /councils/${cid}/troops"
              payload: { unit_number: "K-2", program_type: "SCOUTS" }
              as: CouncilRegistrar
              captures: { tid: $.data.id }
            - call: "POST /troops/${tid}/members"
              payload: { member_type: "YOUTH", full_name: "Seller", birthdate: "2013-03-03" }
              as: TroopLeader
              captures: { sid: $.data.id }
            - call: "POST /councils/${cid}/fundraisers"
              payload: { product: "COOKIES", unit_price_cents: 500, unit_cost_cents: 200, total_inventory_units: 1000 }
              as: CouncilRegistrar
              captures: { fr: $.data.id }
            - call: "POST /fundraisers/${fr}/go-live"
              payload: {}
              as: CouncilRegistrar
              captures: { frv: $.data.version }
            - call: "POST /fundraiser-orders"
              payload: { fundraiser_id: "${fr}", troop_id: "${tid}", seller_member_id: "${sid}", units: 150, expected_fundraiser_version: "${frv}" }
              as: TroopLeader
              captures: { oid: $.data.id }
          trigger:
            - call: "POST /fundraiser-orders/${oid}/fill"
              payload: {}
              as: TroopLeader
          assert:
            - "Council.${cid}.fund_cash_cents == 75000"
            - "Council.${cid}.fund_liability_cents == 30000"

      - name: completion_pct_recomputed_on_sign
        claim_type: Correct Result
        grounds: [entities.Advancement.fields.completion_pct, entities.Advancement.fields.requirements_signed]
        distinguishing_aspect: "Signing 1 of 4 requirements sets completion_pct to 25.0."
        test_recipe:
          setup: ["A member with a 4-requirement advancement in DRAFT."]
          setup_api_calls:
            - call: "POST /councils"
              payload: { name: "K3", charter_fee_cents: 30000, youth_dues_cents: 12000, adult_dues_cents: 4500, program_year: 2026 }
              as: CouncilRegistrar
              captures: { cid: $.data.id }
            - call: "POST /councils/${cid}/troops"
              payload: { unit_number: "K-3", program_type: "SCOUTS" }
              as: CouncilRegistrar
              captures: { tid: $.data.id }
            - call: "POST /troops/${tid}/members"
              payload: { member_type: "YOUTH", full_name: "Adv Y", birthdate: "2013-03-03" }
              as: TroopLeader
              captures: { mid: $.data.id }
            - call: "POST /members/${mid}/advancements"
              payload: { kind: "BADGE", target: "FIRST_AID", requirements_total: 4, badge_code: "FA-01" }
              as: TroopLeader
              captures: { aid: $.data.id }
          trigger:
            - call: "POST /advancements/${aid}/sign-requirement"
              payload: {}
              as: TroopLeader
          assert:
            - "Advancement.${aid}.requirements_signed == 1"
            - "Advancement.${aid}.completion_pct == 25.0"

      - name: dues_variant_youth_vs_adult_covered
        claim_type: Variant Divergence
        grounds: [calculations.dues_proration]
        excluded_because:
          difficulty_instance: dual_variant_calc / dues_proration_youth_vs_adult_rate
          rationale: "Youth vs adult divergence is the named §1.8 dual-variant instance."

      - name: full_dues_threshold_boundary_covered
        claim_type: Constants Applied
        grounds: [calculations.dues_proration]
        excluded_because:
          difficulty_instance: boundary_precision_check / dues_full_months_threshold_boundary
          rationale: "FULL_DUES_MONTHS>=9 boundary is the named §1.8 boundary instance."

  # =================================================================== Validations
  - section: validations
    instances:
      - name: overpayment_rejected
        claim_type: Violation → Error
        grounds: ["validations[priority=18]", "errors[ERR_OVERPAYMENT]"]
        distinguishing_aspect: "A payment exceeding the invoice amount_cents returns ERR_OVERPAYMENT (409); cumulative POSTED cannot exceed invoice."
        test_recipe:
          setup: ["A youth with an OPEN dues invoice of 12000 (full dues, issued Jan)."]
          setup_api_calls:
            - call: "POST /councils"
