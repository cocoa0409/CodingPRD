  - rule_id: boundary_precision_check
    instances:
      - name: final_score_exactly_at_cut_passes_one_below_fails
        grounds:
          - calculations.scaled_score
          - calculations.effective_cut_score
          - entities.ScoreReport.fields.pass_flag
          - endpoints[POST /score-reports/{id}/finalization]
        distinguishing_aspect: |
          Metric: the integer scaled score against effective_cut_score, on the finalization endpoint.
          pass_flag uses `>=`, so 56 of 80 -> exactly 70 == the cut MUST pass, while 55 of 80 ->
          68.75 -> round_half_up 69 (one point below) MUST fail. The pair pins both the comparison
          operator and the rounding mode: truncation would turn 68.75 into 68 and a `>` comparison
          would fail the exact-boundary candidate.
        test_recipe:
          setup:
            - "Baseline jurisdiction TX-TRAVIS (min_passing_score_override null, so the effective cut is the form's national_cut_score 70) / provider 500000 / EN form / 2-seat site / REGISTERED proctor."
            - "A 2-unit EXAM_ONLY batch (7524), one code per candidate; candidate C1 sits 09:00-11:00 and submits 56 correct at clock 2026-09-10T08:45:00Z; candidate C2 sits 11:15-13:15 and submits 55 correct at clock 2026-09-10T11:10:00Z."
            - "Both ScoreReports are left PROVISIONAL (C1 provisional_scaled_score 70, C2 69) so the finalization calls are the triggers."
