          assert:
            - "assignment landed on center A (only A runs the desired trade)"
            - "enrolling into center B's program: error_id == ERR_CENTER_MISMATCH"

      - name: enroll_without_assignment_rejected
        claim_type: cross_entity_validation
        grounds: ["validations[priority=17]", "errors[ERR_APPLICANT_NOT_ELIGIBLE]"]
        distinguishing_aspect: "Eligibility alone does not unlock enrollment: an ELIGIBLE applicant who never went through center assignment (assignment_status still NONE) is rejected with ERR_APPLICANT_NOT_ELIGIBLE."
        test_recipe:
