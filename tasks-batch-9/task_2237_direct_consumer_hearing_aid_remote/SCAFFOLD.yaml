scenario: "2237. Direct-to-Consumer Hearing Aid & Remote Fitting (Eargo): self-administered hearing screening and candidacy determination for over-the-counter devices, referral triggers to a licensed provider on red-flag findings, remote programming session scheduling with a hearing professional, trial period with return and restocking policy by state, insurance and flexible-spending reimbursement documentation, device fit exchange across dome and tip sizes, repair, loss-and-damage warranty claims, subscription care plan and firmware update campaigns"
domain_name: "dtc-hearing-aid-remote-fitting"
api_prefix: "/hearing-care"

# ---------------------------------------------------------------------------
# Step 0 — Complexity profile selection reasoning (applied, not decorative)
#
# The scenario's hardest coupling is regulatory: an OTC device may only be sold
# and kept when (a) a self-administered screening produced no mandatory-referral
# red flag, (b) the purchaser's state permits OTC sale and telehealth fitting,
# and (c) the state's own trial/restocking arithmetic is honored at refund time.
# That makes COMPLIANCE / AUDIT the primary archetype: every forward action is
# gated by a regulatory predicate and every money movement must be reconstructible.
# Restocking-vs-refund settlement, insurance/FSA waterfall and care-plan cycle
# charges layer a genuine PRICING ENGINE on top (secondary archetype) — the same
# returned device yields two different refunds depending on which state policy
# variant applies, and the arithmetic is rounding-order sensitive.
#
# Difficulty is pushed deliberately ABOVE the §0.4 Expert band on every
# structural axis (20 entities, 16 state-machine entries across 15 entities,
# 4 OCC races, 16 calculations, 65 validations, 127 endpoints, 65 error codes,
# 9 roles) while keeping the surface
# internally consistent: each added entity earns its place by participating in a
# cascade, a cross-entity gate, or a conserved-quantity invariant, per §0.4's
# "density not volume" instruction. Nothing here is a standalone CRUD table.
# ---------------------------------------------------------------------------

complexity_profile:
  difficulty_level: "beyond_expert (structural dimensions at or above the top of the §0.4 Expert band)"
  primary_archetype: compliance_audit
  secondary_archetype: pricing_engine
  complexity_layers:
    - optimistic_concurrency        # OCC on TrialPeriod / DeviceOrder / CarePlanSubscription / Device version
    - cascading_side_effects        # 4-hop return settlement cascade, 4-hop medical-hold cascade
    - dual_variant_calculation      # FLAT_PCT vs PRORATED_DAILY restocking; PROVISIONAL vs PROVIDER_ADJUSTED candidacy
    - version_pinning_on_approval   # StatePolicy version pinned onto DeviceOrder at checkout
    - selector_policy               # firmware cohort selection, referral provider selection
  entity_topology: graph
  entity_topology_note: |
    Deliberately NOT hierarchical. Patient, DeviceOrder, Device, TrialPeriod,
    Provider, CarePlanSubscription and FirmwareCampaign are peers linked by
    foreign keys; FirmwareRollout is a junction (Campaign x Device); StatePolicy
    is referenced from three different aggregates (Patient, DeviceOrder,
    ReturnAuthorization) and is version-pinned by one of them; RedFlagFinding
    points back at the ProviderReferral that cleared it, closing a cycle
    ScreeningSession -> RedFlagFinding -> ProviderReferral -> ScreeningSession.
  state_machine_shape: parallel
  state_machine_shape_note: |
    DeviceOrder carries two independent state dimensions on one row
    (payment_status x fulfillment_status). Patient, ProviderReferral,
    RemoteFittingSession, ReimbursementClaim, CarePlanSubscription and
    FirmwareCampaign are cyclic (re-screen, reschedule, info-request/appeal,
    past-due recovery, pause/resume). WarrantyClaim and RepairOrder are
    branching fork-join with divergent side-effect sets per branch. No machine
    in this scaffold is a bare linear pipeline.
  relationship_patterns:
    - one_to_many          # Patient -> ScreeningSession, DeviceOrder -> FitExchange
    - many_to_many         # FirmwareCampaign <-> Device via FirmwareRollout
    - self_referential     # ScreeningSession.supersedes_session_id, ReimbursementClaim.appeal_of_claim_id
    - cross_aggregate      # RepairOrder gates ReturnAuthorization; Subscription gates FirmwareRollout
    - polymorphic          # ReimbursementClaim.subject_kind in {DEVICE_ORDER, REPAIR_ORDER, CARE_PLAN}
  role_model: segregation_of_duties
  role_model_note: |
    Blended with peer_roles and a single hierarchical_override role. The acting
    ComplianceOfficer that files a medical-clearance override MUST NOT be the
    ComplianceOfficer that approves it; the ReimbursementSpecialist that submits
    a claim MUST NOT be the one that approves payment; a Provider may not clear
    a referral triggered by a screening the same Provider invalidated.
  consistency_model: immediate
  consistency_model_note: |
    All cascades run inside the triggering request. Derived fields
    (Patient.candidacy_risk_score, Provider.booked_minutes_today,
    DeviceOrder.total_cents, TrialPeriod.days_used, InventoryPool counters)
    are recomputed synchronously by the transition that dirties them.

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =========================================================================
# 1.1 Entity-Relationship Table  (20 entities)
# =========================================================================
entities:

  - name: StatePolicy
    parent: null
    common_fields: true
    kind: configuration
    fields:
      - name: state_code
        type: string
        source: input
        description: "Two-letter US state code the policy governs"
        constraints: "uppercase, exactly 2 chars, globally unique"
      - name: otc_sales_permitted
        type: boolean
        source: input
        description: "Whether over-the-counter self-fit devices may be sold to residents"
        default: true
      - name: telehealth_fitting_permitted
        type: boolean
        source: input
        description: "Whether a remote programming session may be conducted by an out-of-state provider"
        default: true
      - name: min_age_years
        type: integer
        source: input
        description: "Minimum purchaser age for OTC candidacy"
        default: 18
      - name: trial_period_days
        type: integer
        source: input
        description: "Statutory minimum trial length in days, pinned onto DeviceOrder at checkout"
        constraints: ">= 30, <= 90"
      - name: restocking_fee_mode
        type: enum
        source: input
        description: "Which restocking variant applies to returns by residents of this state"
        constraints: "one of FLAT_PCT | PRORATED_DAILY | PROHIBITED"
      - name: restocking_fee_pct
        type: number
        source: input
        description: "Fraction of device subtotal retained when restocking_fee_mode == FLAT_PCT"
        default: 0
        constraints: "0 <= value <= 0.20, 4 decimal places"
      - name: restocking_daily_rate_cents
        type: integer
        source: input
        description: "Cents retained per counted trial day when restocking_fee_mode == PRORATED_DAILY"
        default: 0
        constraints: ">= 0"
      - name: restocking_fee_cap_cents
        type: integer
        source: input
        description: "Absolute cap on restocking retained from any single return"
        default: 0
        constraints: ">= 0"
      - name: shipping_refundable
        type: boolean
        source: input
        description: "Whether outbound shipping is refunded on a trial return"
        default: false
      - name: referral_validity_days
        type: integer
        source: input
        description: "Days a licensed-provider clearance remains valid before ProviderReferral expires"
        default: 180
      - name: waiver_required
        type: boolean
        source: input
        description: "Whether the patient must acknowledge a medical-evaluation waiver before ordering"
        default: false
      - name: max_loss_damage_claims
        type: integer
        source: input
        description: "Lifetime cap on approved loss-and-damage warranty claims per Device"
        default: 2
        constraints: ">= 0"
      - name: is_retired
        type: boolean
        source: system
        description: "Soft-delete flag; retired policies remain queryable and remain pinned on existing orders"
        default: false

  - name: Patient
    parent: null
    common_fields: true
    kind: resource
    fields:
      - name: state_policy_id
        type: string
        source: input
        description: "FK -> StatePolicy.id; residence policy governing this patient's candidacy and returns"
      - name: state_code
        type: string
        source: computed
        description: "Denormalized copy of StatePolicy.state_code, refreshed whenever state_policy_id changes"
      - name: email
        type: string
        source: input
        description: "Login/contact address"
        constraints: "globally unique, case-insensitive"
      - name: full_name
        type: string
        source: input
        description: "Patient legal name"
      - name: age_years
        type: integer
        source: input
        description: "Self-declared age at registration"
        constraints: ">= 0, <= 120"
      - name: status
        type: enum
        source: system
        description: "Candidacy lifecycle state (see state_machines.Patient)"
        default: REGISTERED
        constraints: "one of REGISTERED | SCREENING_IN_PROGRESS | CANDIDATE_APPROVED | REFERRAL_REQUIRED | PROVIDER_CLEARED | MEDICALLY_DISQUALIFIED | DEACTIVATED"
      - name: waiver_acknowledged_at
        type: datetime
        source: system
        description: "When the patient acknowledged the medical-evaluation waiver; null when never acknowledged"
      - name: candidacy_risk_score
        type: number
        source: computed
        description: "Output of calculations.candidacy_risk_score for the latest non-invalidated ScreeningSession"
        default: 0
        constraints: "0.0 <= value <= 100.0, 1 decimal place"
      - name: candidacy_risk_variant
        type: enum
        source: computed
        description: "Which candidacy_risk_score variant produced candidacy_risk_score"
        default: PROVISIONAL_SELF_REPORTED
        constraints: "one of PROVISIONAL_SELF_REPORTED | PROVIDER_ADJUSTED"
      - name: candidacy_risk_band
        type: enum
        source: computed
        description: "Band derived from candidacy_risk_score thresholds in calculations.candidacy_risk_score"
        default: LOW
        constraints: "one of LOW | MODERATE | HIGH"
      - name: advisory_weight_total
        type: number
        source: computed
        description: "Sum of RedFlagFinding.weight where severity == ADVISORY and cleared_by_referral_id IS NULL, over the latest non-invalidated ScreeningSession"
        default: 0
        constraints: "1 decimal place"
      - name: open_mandatory_flag_count
        type: integer
        source: computed
        description: "Count of RedFlagFinding rows with severity == MANDATORY_REFERRAL and cleared_by_referral_id IS NULL across all ScreeningSession rows whose status != INVALIDATED"
        default: 0
      - name: lifetime_return_count
        type: integer
        source: computed
        description: "Count of ReturnAuthorization rows for this patient with status == REFUND_SETTLED"
        default: 0
      - name: screening_attempt_count
        type: integer
        source: computed
        description: "Count of ScreeningSession rows for this patient with status IN {SCORED, INVALIDATED}"
        default: 0
      - name: deactivated_at
        type: datetime
        source: system
        description: "Set when status becomes DEACTIVATED; null otherwise"

  - name: ScreeningSession
    parent: Patient
    common_fields: true
    kind: resource
    fields:
      - name: patient_id
        type: string
        source: input
        description: "FK -> Patient.id; owner of this self-administered screening"
      - name: supersedes_session_id
        type: string
        source: input
        description: "FK -> ScreeningSession.id; the earlier session this retake replaces (self-referential); null for a first attempt"
      - name: status
        type: enum
        source: system
        description: "See state_machines.ScreeningSession"
        default: DRAFT
        constraints: "one of DRAFT | IN_PROGRESS | SUBMITTED | SCORED | INVALIDATED"
      - name: attempt_ordinal
        type: integer
        source: computed
        description: "1 + count of prior ScreeningSession rows for the same patient_id ordered by created_at ASC"
        constraints: ">= 1"
      - name: pure_tone_avg_db
        type: number
        source: input
        description: "Self-administered four-frequency pure-tone average in dB HL"
        constraints: "0 <= value <= 120, 1 decimal place"
      - name: asymmetry_db
        type: number
        source: input
        description: "Absolute left/right pure-tone difference in dB, used for unilateral red-flag detection"
        constraints: "0 <= value <= 120, 1 decimal place"
      - name: self_reported_difficulty_score
        type: integer
        source: input
        description: "Questionnaire score, higher means more perceived difficulty"
        constraints: "0 <= value <= 40"
      - name: speech_in_noise_pct
        type: number
        source: input
        description: "Percent words correct on the in-app speech-in-noise task"
        constraints: "0 <= value <= 100, 1 decimal place"
      - name: symptom_codes
        type: array
        source: input
        description: "Declared symptom codes from the questionnaire; each maps to a RedFlagFinding.code"
        default: []
      - name: screening_outcome
        type: enum
        source: computed
        description: "Output of calculations.red_flag_referral_trigger, written when status becomes SCORED"
        default: PENDING
        constraints: "one of PENDING | PASS | ADVISORY_PASS | RED_FLAG"
      - name: submitted_at
        type: datetime
        source: system
        description: "Logical-clock instant the patient submitted the session"
      - name: scored_at
        type: datetime
        source: system
        description: "Logical-clock instant scoring completed"
      - name: invalidated_reason
        type: enum
        source: system
        description: "Why the session was invalidated; null while status != INVALIDATED"
        constraints: "one of SUPERSEDED | DATA_QUALITY | PROVIDER_OVERRIDE"

  - name: RedFlagFinding
    parent: ScreeningSession
    common_fields: false
    kind: event
    fields:
      - name: screening_session_id
        type: string
        source: input
        description: "FK -> ScreeningSession.id; the session that produced this finding"
      - name: cleared_by_referral_id
        type: string
        source: system
        description: "FK -> ProviderReferral.id; the referral whose CLEARED outcome retired this finding; null while open"
      - name: code
        type: enum
        source: system
        description: "Finding code derived from symptom_codes and screening measurements"
        constraints: "one of SUDDEN_UNILATERAL_LOSS | ACTIVE_DRAINAGE | EAR_PAIN | VERTIGO | VISIBLE_DEFORMITY | UNILATERAL_TINNITUS | IMPACTED_CERUMEN | AGE_BELOW_MINIMUM | SEVERE_LOSS_THRESHOLD"
      - name: severity
        type: enum
        source: system
        description: "MANDATORY_REFERRAL forces a licensed-provider referral; ADVISORY contributes weight only"
        constraints: "one of ADVISORY | MANDATORY_REFERRAL"
      - name: weight
        type: number
        source: system
        description: "Advisory weight contributed to Patient.advisory_weight_total; MANDATORY_REFERRAL findings carry weight 0"
        constraints: "0 <= value <= 3.0, 1 decimal place"
      - name: detected_at
        type: datetime
        source: system
        description: "Logical-clock instant the finding was emitted during scoring"

  - name: Provider
    parent: null
    common_fields: true
    kind: resource
    fields:
      - name: provider_type
        type: enum
        source: input
        description: "TELECARE_FITTER conducts remote programming; LICENSED_AUDIOLOGIST additionally clears referrals"
        constraints: "one of TELECARE_FITTER | LICENSED_AUDIOLOGIST"
      - name: npi
        type: string
        source: input
        description: "National provider identifier"
        constraints: "globally unique, 10 digits"
      - name: full_name
        type: string
        source: input
        description: "Provider display name"
      - name: licensed_state_codes
        type: array
        source: input
        description: "State codes this provider is licensed in; matched against Patient.state_code"
        constraints: "non-empty array of 2-char uppercase codes"
      - name: status
        type: enum
        source: system
        description: "Availability lifecycle; only ACTIVE providers may take new bookings"
        default: ACTIVE
        constraints: "one of ACTIVE | SUSPENDED | OFFBOARDED"
      - name: daily_capacity_minutes
        type: integer
        source: input
        description: "Maximum bookable minutes on any single UTC calendar date"
        constraints: "> 0, <= 600"
      - name: buffer_minutes
        type: integer
        source: input
        description: "Mandatory gap enforced on both sides of every booked session"
        default: 10
        constraints: ">= 0, <= 60"
      - name: booked_minutes_on_focus_date
        type: integer
        source: computed
        description: "Output of calculations.provider_daily_capacity for the UTC date of the most recent booking attempt"
        default: 0
      - name: utilization_pct
        type: number
        source: computed
        description: "100 * booked_minutes_on_focus_date / daily_capacity_minutes, 1 decimal place, round_half_up"
        default: 0
      - name: completed_session_count
        type: integer
        source: computed
        description: "Count of RemoteFittingSession rows for this provider with status == COMPLETED"
        default: 0

  - name: ProviderReferral
    parent: null
    common_fields: true
    kind: resource
    fields:
      - name: patient_id
        type: string
        source: input
        description: "FK -> Patient.id; referred patient"
      - name: triggering_screening_session_id
        type: string
        source: input
        description: "FK -> ScreeningSession.id; the SCORED session whose findings forced this referral"
      - name: provider_id
        type: string
        source: system
        description: "FK -> Provider.id; LICENSED_AUDIOLOGIST selected by calculations.referral_provider_selection; null while status == OPEN"
      - name: status
        type: enum
        source: system
        description: "See state_machines.ProviderReferral"
        default: OPEN
        constraints: "one of OPEN | SCHEDULED | EVALUATED | CLEARED | NOT_CLEARED | EXPIRED | WITHDRAWN"
      - name: reason_codes
        type: array
        source: system
        description: "RedFlagFinding.code values that triggered the referral, ordered by finding detected_at ASC"
      - name: issued_at
        type: datetime
        source: system
        description: "Logical-clock instant the referral was opened"
      - name: expires_at
        type: datetime
        source: computed
        description: "issued_at + Patient's StatePolicy.referral_validity_days days, computed at issue time"
      - name: reschedule_count
        type: integer
        source: computed
        description: "Number of times this referral cycled SCHEDULED -> OPEN"
        default: 0
      - name: clearance_outcome
        type: enum
        source: system
        description: "Licensed provider's determination recorded at EVALUATED"
        default: PENDING
        constraints: "one of PENDING | CLEARED | NOT_CLEARED"
      - name: clearance_note
        type: string
        source: input
        description: "Free-text provider note captured with the determination"
      - name: cleared_finding_count
        type: integer
        source: computed
        description: "Count of RedFlagFinding rows whose cleared_by_referral_id == this referral id"
        default: 0

  - name: RemoteFittingSession
    parent: null
    common_fields: true
    kind: resource
    fields:
      - name: patient_id
        type: string
        source: input
        description: "FK -> Patient.id; patient being fitted or evaluated"
      - name: provider_id
        type: string
        source: input
        description: "FK -> Provider.id; hearing professional conducting the session"
      - name: device_order_id
        type: string
        source: input
        description: "FK -> DeviceOrder.id; order whose device is being programmed; null for REFERRAL_EVALUATION sessions"
      - name: provider_referral_id
        type: string
        source: input
        description: "FK -> ProviderReferral.id; referral this evaluation satisfies; null for non-evaluation session types"
      - name: session_type
        type: enum
        source: input
        description: "Purpose of the booking"
        constraints: "one of INITIAL_FIT | FOLLOW_UP | REFERRAL_EVALUATION | TROUBLESHOOT"
      - name: status
        type: enum
        source: system
        description: "See state_machines.RemoteFittingSession"
        default: REQUESTED
        constraints: "one of REQUESTED | SCHEDULED | IN_PROGRESS | COMPLETED | NO_SHOW | CANCELLED"
      - name: scheduled_start_utc
        type: datetime
        source: input
        description: "Half-open interval start; occupancy is [start, end) widened by Provider.buffer_minutes on both sides"
      - name: scheduled_end_utc
        type: datetime
        source: input
        description: "Half-open interval end, exclusive"
      - name: duration_minutes
        type: integer
        source: computed
        description: "Whole minutes between scheduled_start_utc and scheduled_end_utc"
        constraints: ">= 15, <= 120"
      - name: programming_profile
        type: string
        source: input
        description: "Programming preset applied at completion, e.g. 'MILD_SLOPING_V3'"
      - name: no_show_charged_cents
        type: integer
        source: computed
        description: "Late-cancel or no-show fee charged to the CarePlanSubscription, 0 when waived"
        default: 0
      - name: completed_at
        type: datetime
        source: system
        description: "Logical-clock instant the session was completed"

  - name: DeviceOrder
    parent: null
    common_fields: true
    kind: resource
    fields:
      - name: patient_id
        type: string
        source: input
        description: "FK -> Patient.id; purchaser"
      - name: state_policy_id
        type: string
        source: system
        description: "FK -> StatePolicy.id; policy pinned at checkout from the patient's state_policy_id, never re-resolved later"
      - name: pinned_state_policy_version
        type: integer
        source: system
        description: "StatePolicy.version observed at checkout; later policy edits do not retroactively change this order"
      - name: pinned_trial_days
        type: integer
        source: system
        description: "Copy of StatePolicy.trial_period_days at checkout"
      - name: pinned_restocking_mode
        type: enum
        source: system
        description: "Copy of StatePolicy.restocking_fee_mode at checkout; drives which restocking variant settles the return"
        constraints: "one of FLAT_PCT | PRORATED_DAILY | PROHIBITED"
      - name: payment_status
        type: enum
        source: system
        description: "First independent state dimension (see state_machines.DeviceOrder, dimension payment_status)"
        default: PENDING_AUTH
        constraints: "one of PENDING_AUTH | AUTHORIZED | CAPTURED | PARTIALLY_REFUNDED | REFUNDED | AUTH_FAILED | VOIDED"
      - name: fulfillment_status
        type: enum
        source: system
        description: "Second independent state dimension (see state_machines.DeviceOrder, dimension fulfillment_status)"
        default: PENDING_FIT_CONFIRM
        constraints: "one of PENDING_FIT_CONFIRM | READY_TO_SHIP | SHIPPED | DELIVERED | MEDICAL_HOLD | RETURN_IN_TRANSIT | RETURNED | CANCELLED"
      - name: model
        type: enum
        source: input
        description: "Device model ordered"
        constraints: "one of NEO | LINK | FLEX"
      - name: dome_size
        type: enum
        source: input
        description: "Currently shipped dome size; mutated by a COMPLETED FitExchange"
        constraints: "one of S | M | L | XL"
      - name: tip_type
        type: enum
        source: input
        description: "Currently shipped tip type; mutated by a COMPLETED FitExchange"
        constraints: "one of OPEN | CLOSED | POWER"
      - name: list_price_cents
        type: integer
        source: input
        description: "Pre-discount device price"
        constraints: "> 0"
      - name: discount_cents
        type: integer
        source: input
        description: "Promotional discount applied at checkout"
        default: 0
        constraints: ">= 0, <= list_price_cents"
      - name: accessory_subtotal_cents
        type: integer
        source: input
        description: "Sum of chargeable accessories (chargers, extra dome kits) on the order"
        default: 0
        constraints: ">= 0"
      - name: shipping_cents
        type: integer
        source: input
        description: "Outbound shipping charged at checkout"
        default: 1495
        constraints: ">= 0"
      - name: tax_cents
        type: integer
        source: computed
        description: "Output of calculations.order_total_composition, step 3"
        default: 0
      - name: total_cents
        type: integer
        source: computed
        description: "Output of calculations.order_total_composition, step 4"
        default: 0
      - name: captured_cents
        type: integer
        source: computed
        description: "Cumulative amount captured from the payment instrument"
        default: 0
      - name: refunded_cents
        type: integer
        source: computed
        description: "Cumulative amount refunded across all settled ReturnAuthorization rows for this order"
        default: 0
      - name: retained_cents
        type: integer
        source: computed
        description: "Cumulative amount lawfully retained (restocking + non-refundable shipping); invariant: captured_cents == refunded_cents + retained_cents + open_balance_cents"
        default: 0
      - name: open_balance_cents
        type: integer
        source: computed
        description: "captured_cents - refunded_cents - retained_cents; the amount still attributable to a kept device"
        default: 0
      - name: delivered_at
        type: datetime
        source: system
        description: "Logical-clock instant fulfillment_status became DELIVERED"
      - name: medical_hold_reason
        type: enum
        source: system
        description: "Why fulfillment was frozen; null unless fulfillment_status == MEDICAL_HOLD"
        constraints: "one of MANDATORY_RED_FLAG | POLICY_OTC_PROHIBITED | WAIVER_MISSING"

  - name: Device
    parent: null
    common_fields: true
    kind: resource
    fields:
      - name: serial_number
        type: string
        source: input
        description: "Manufacturer serial"
        constraints: "globally unique"
      - name: device_order_id
        type: string
        source: system
        description: "FK -> DeviceOrder.id; order this unit was assigned to; null while IN_STOCK"
      - name: model
        type: enum
        source: input
        description: "Hardware model"
        constraints: "one of NEO | LINK | FLEX"
      - name: firmware_version
        type: string
        source: system
        description: "Currently installed firmware, e.g. '4.2.1'"
        default: "4.0.0"
      - name: status
        type: enum
        source: system
        description: "Physical custody state, mutated only as a side effect of other machines' transitions"
        default: IN_STOCK
        constraints: "one of IN_STOCK | ASSIGNED | WITH_PATIENT | IN_REPAIR | REPLACED | LOST | RETIRED"
      - name: shipped_at
        type: datetime
        source: system
        description: "Logical-clock instant this unit left the warehouse"
      - name: warranty_expires_at
        type: datetime
        source: computed
        description: "shipped_at + 730 days; null while never shipped"
      - name: age_months_at_last_claim
        type: integer
        source: computed
        description: "Whole months between shipped_at and the logical clock at the most recent WarrantyClaim triage"
        default: 0
      - name: loss_damage_claims_approved
        type: integer
        source: computed
        description: "Count of WarrantyClaim rows for this device with status IN {APPROVED_REPLACEMENT, FULFILLED} and claim_kind IN {LOSS, DAMAGE}"
        default: 0
      - name: replaced_by_device_id
        type: string
        source: system
        description: "FK -> Device.id; replacement unit issued by an approved loss/damage claim (self-referential); null otherwise"

  - name: TrialPeriod
    parent: null
    common_fields: true
    kind: resource
    fields:
      - name: device_order_id
        type: string
        source: system
        description: "FK -> DeviceOrder.id; the delivered order under trial"
      - name: patient_id
        type: string
        source: system
        description: "FK -> Patient.id; denormalized from the order for return-history counting"
      - name: status
        type: enum
        source: system
        description: "See state_machines.TrialPeriod"
        default: ACTIVE
        constraints: "one of ACTIVE | PAUSED | RETURN_INITIATED | RETURN_SETTLED | EXPIRED_KEPT | VOIDED"
      - name: started_at
        type: datetime
        source: system
        description: "Logical-clock instant the order was DELIVERED; day counting starts here"
      - name: nominal_end_utc
        type: datetime
        source: computed
        description: "started_at + DeviceOrder.pinned_trial_days days, unadjusted for pauses"
      - name: effective_end_utc
        type: datetime
        source: computed
        description: "nominal_end_utc + paused_days + extension_days_granted days; the deadline that actually gates a return"
      - name: pause_intervals
        type: array
        source: system
        description: "Closed intervals [pause_start_utc, pause_end_utc] during which day counting is suspended; endpoints may touch but must not overlap"
        default: []
      - name: paused_days
        type: integer
        source: computed
        description: "Output of calculations.trial_days_used, component 2"
        default: 0
      - name: days_used
        type: integer
        source: computed
        description: "Output of calculations.trial_days_used, component 3; drives PRORATED_DAILY restocking"
        default: 0
      - name: extension_days_granted
        type: integer
        source: system
        description: "Goodwill extension days added by CareOpsAgent"
        default: 0
        constraints: "0 <= value <= 30"

  - name: ReturnAuthorization
    parent: TrialPeriod
    common_fields: true
    kind: resource
    fields:
      - name: trial_period_id
        type: string
        source: input
        description: "FK -> TrialPeriod.id; the trial being terminated by this return"
      - name: rma_code
        type: string
        source: system
        description: "Human-facing return code"
        constraints: "globally unique"
      - name: status
        type: enum
        source: system
        description: "See state_machines.ReturnAuthorization"
        default: ISSUED
        constraints: "one of ISSUED | IN_TRANSIT | RECEIVED | INSPECTED | REFUND_SETTLED | EXPIRED | VOIDED"
      - name: days_used_at_issue
        type: integer
        source: computed
        description: "Snapshot of TrialPeriod.days_used at issue time; the restocking arithmetic uses this snapshot, not the live value"
        default: 0
      - name: restocking_variant
        type: enum
        source: computed
        description: "Which variant of calculations.return_refund_settlement was applied"
        default: WAIVED
        constraints: "one of FLAT_PCT | PRORATED_DAILY | WAIVED"
      - name: inspection_grade
        type: enum
        source: input
        description: "Warehouse inspection result recorded at INSPECTED"
        constraints: "one of RESELLABLE | REFURBISHABLE | DAMAGED"
      - name: restocking_fee_cents
        type: integer
        source: computed
        description: "Output of calculations.return_refund_settlement, step 5"
        default: 0
      - name: non_refundable_shipping_cents
        type: integer
        source: computed
        description: "Output of calculations.return_refund_settlement, step 6"
        default: 0
      - name: refund_amount_cents
        type: integer
        source: computed
        description: "Output of calculations.return_refund_settlement, step 7; invariant: refund_amount_cents + restocking_fee_cents + non_refundable_shipping_cents == DeviceOrder.captured_cents when the whole order is returned"
        default: 0
      - name: received_at
        type: datetime
        source: system
        description: "Logical-clock instant the warehouse received the unit"
      - name: settled_at
        type: datetime
        source: system
        description: "Logical-clock instant the refund settled"
      - name: return_deadline_utc
        type: datetime
        source: computed
        description: "issue instant + 14 days; the unit must be received by then or the authorization EXPIREs"

  - name: FitExchange
    parent: DeviceOrder
    common_fields: true
    kind: resource
    fields:
      - name: device_order_id
        type: string
        source: input
        description: "FK -> DeviceOrder.id; order whose dome/tip configuration is being changed"
      - name: from_inventory_pool_id
        type: string
        source: system
        description: "FK -> InventoryPool.id; pool the outgoing configuration is credited back to on completion"
      - name: to_inventory_pool_id
        type: string
        source: system
        description: "FK -> InventoryPool.id; pool the incoming configuration is reserved from at request time"
      - name: to_dome_size
        type: enum
        source: input
        description: "Requested dome size"
        constraints: "one of S | M | L | XL"
      - name: to_tip_type
        type: enum
        source: input
        description: "Requested tip type"
        constraints: "one of OPEN | CLOSED | POWER"
      - name: status
        type: enum
        source: system
        description: "See state_machines.FitExchange"
        default: REQUESTED
        constraints: "one of REQUESTED | RESERVED | SHIPPED | COMPLETED | REJECTED | CANCELLED"
      - name: exchange_ordinal
        type: integer
        source: computed
        description: "1 + count of prior FitExchange rows for the same device_order_id with status IN {COMPLETED, SHIPPED}, ordered by created_at ASC"
        constraints: ">= 1"
      - name: exchange_fee_cents
        type: integer
        source: computed
        description: "Output of calculations.fit_exchange_fee; first two exchanges are free, later ones are charged"
        default: 0
      - name: rejection_reason
        type: enum
        source: system
        description: "Why the exchange was rejected; null unless status == REJECTED"
        constraints: "one of POOL_DEPLETED | SAME_CONFIGURATION | TRIAL_NOT_ACTIVE"

  - name: InventoryPool
    parent: null
    common_fields: true
    kind: resource
    fields:
      - name: sku
        type: string
        source: input
        description: "Dome/tip SKU key, formatted '<MODEL>-<DOME>-<TIP>'"
        constraints: "globally unique"
      - name: model
        type: enum
        source: input
        description: "Device model the SKU fits"
        constraints: "one of NEO | LINK | FLEX"
      - name: dome_size
        type: enum
        source: input
        description: "Dome size represented by this pool"
        constraints: "one of S | M | L | XL"
      - name: tip_type
        type: enum
        source: input
        description: "Tip type represented by this pool"
        constraints: "one of OPEN | CLOSED | POWER"
      - name: on_hand_units
        type: integer
        source: computed
        description: "Unreserved units physically available"
        default: 0
        constraints: ">= 0"
      - name: reserved_units
        type: integer
        source: computed
        description: "Units held by FitExchange rows with status IN {RESERVED, SHIPPED}"
        default: 0
        constraints: ">= 0"
      - name: dispatched_units
        type: integer
        source: computed
        description: "Units delivered to patients through COMPLETED exchanges; invariant: on_hand_units + reserved_units + dispatched_units == total_units_received"
        default: 0
      - name: total_units_received
        type: integer
        source: computed
        description: "Cumulative units ever added by restock operations; the conserved quantity for the inventory invariant"
        default: 0
      - name: is_discontinued
        type: boolean
        source: system
        description: "Soft-delete flag; discontinued pools reject new reservations but remain queryable"
        default: false

  - name: RepairOrder
    parent: null
    common_fields: true
    kind: resource
    fields:
      - name: device_id
        type: string
        source: input
        description: "FK -> Device.id; unit sent in for repair"
      - name: patient_id
        type: string
        source: system
        description: "FK -> Patient.id; denormalized owner at intake"
      - name: care_plan_subscription_id
        type: string
        source: system
        description: "FK -> CarePlanSubscription.id; plan that absorbs SLA credits; null when the patient has no plan"
      - name: status
        type: enum
        source: system
        description: "See state_machines.RepairOrder"
        default: KIT_REQUESTED
        constraints: "one of KIT_REQUESTED | KIT_SENT | RECEIVED | IN_REPAIR | REPAIRED | UNREPAIRABLE | RETURNED_TO_PATIENT | ESCALATED_TO_WARRANTY | CANCELLED"
      - name: fault_code
        type: enum
        source: input
