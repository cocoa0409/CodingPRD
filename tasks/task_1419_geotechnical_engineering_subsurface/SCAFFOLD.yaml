  - { method: POST, path: "/geo/foundation-analyses/{id}/transition", description: "Drive the analysis machine (VERIFIED incl. self-loop refresh)", roles: [SeniorEngineer], code: 200, input: [to], output: FoundationAnalysis, side_effects: ["final bearing/settlement computed; supersedes other VERIFIED analyses"] }
  - { method: POST, path: "/geo/projects/{id}/reports", description: "Create a report revision (DRAFT) under a REPORT_REVIEW project", roles: [SeniorEngineer], code: 201, input: [], output: Report, side_effects: ["revision_no assigned as max+1", "prepared_by_user_id recorded from X-User-ID"] }
  - { method: GET, path: "/geo/reports/{id}", description: "Fetch a report", roles: [FirmAdmin, ProjectManager, SeniorEngineer, PrincipalEngineer, ClientRep], code: 200, input: [], output: Report, side_effects: [] }
  - { method: GET, path: "/geo/reports", description: "List reports; filter project_id", roles: [FirmAdmin, ProjectManager, SeniorEngineer, PrincipalEngineer, ClientRep], code: 200, input: ["project_id?", "limit?", "offset?"], output: "Report[]", side_effects: [] }
  - { method: POST, path: "/geo/reports/{id}/transition", description: "Drive the report review machine (TECH_REVIEW / PE_REVIEW / DRAFT)", roles: [SeniorEngineer, ProjectManager, PrincipalEngineer], code: 200, input: [to], output: Report, side_effects: ["per Report state machine"] }
  - { method: POST, path: "/geo/reports/{id}/issue", description: "PE seals and issues a PE_REVIEW report (OCC + segregation of duties)", roles: [PrincipalEngineer], code: 200, input: [expected_report_version], output: Report, side_effects: ["sealed_by/sealed_at set", "prior ISSUED report SUPERSEDED", "increments Report.version by 1"] }
  - { method: POST, path: "/geo/projects/{id}/observation-visits", description: "Schedule a construction-phase observation visit", roles: [ProjectManager], code: 201, input: [visit_date], output: ObservationVisit, side_effects: [] }
  - { method: GET, path: "/geo/observation-visits/{id}", description: "Fetch a visit", roles: [FirmAdmin, ProjectManager, StaffEngineer, SeniorEngineer], code: 200, input: [], output: ObservationVisit, side_effects: [] }
  - { method: GET, path: "/geo/observation-visits", description: "List visits; filter project_id", roles: [FirmAdmin, ProjectManager, StaffEngineer, SeniorEngineer], code: 200, input: ["project_id?", "limit?", "offset?"], output: "ObservationVisit[]", side_effects: [] }
  - { method: POST, path: "/geo/observation-visits/{id}/transition", description: "Drive the visit machine (PERFORMED / FINDINGS_FILED / CLOSED)", roles: [StaffEngineer, ProjectManager], code: 200, input: [to, "findings?", "observed_bearing_psf?"], output: ObservationVisit, side_effects: ["DIFFERING findings auto-creates a SUBMITTED claim (link 1)"] }
  - { method: POST, path: "/geo/projects/{id}/claims", description: "File a changed-condition (differing site condition) claim; baseline bearing snapshot taken at creation", roles: [ProjectManager, ClientRep], code: 201, input: [claimed_amount_cents, basis_text, "observation_visit_id?"], output: ChangedConditionClaim, side_effects: ["baseline_bearing_psf snapshot from VERIFIED analysis"] }
  - { method: GET, path: "/geo/claims/{id}", description: "Fetch a claim incl. both quantum variants", roles: [FirmAdmin, ProjectManager, SeniorEngineer, ClientRep], code: 200, input: [], output: ChangedConditionClaim, side_effects: [] }
  - { method: GET, path: "/geo/claims", description: "List claims; filters project_id and/or observation_visit_id", roles: [FirmAdmin, ProjectManager, SeniorEngineer, ClientRep], code: 200, input: ["project_id?", "observation_visit_id?", "limit?", "offset?"], output: "ChangedConditionClaim[]", side_effects: [] }
  - { method: POST, path: "/geo/claims/{id}/transition", description: "Drive the claim machine (UNDER_REVIEW / SUBSTANTIATED / REBUTTED / SETTLED)", roles: [SeniorEngineer, ProjectManager], code: 200, input: [to, "awarded_amount_cents?"], output: ChangedConditionClaim, side_effects: ["quanta computed at UNDER_REVIEW; project exposure and posture recomputed"] }
  - { method: POST, path: "/geo/projects/{id}/exploration-authorizations", description: "Propose an additional exploration authorization", roles: [ProjectManager], code: 201, input: [authorized_amount_cents, extra_boring_count], output: ExplorationAuthorization, side_effects: [] }
  - { method: GET, path: "/geo/exploration-authorizations/{id}", description: "Fetch an authorization", roles: [FirmAdmin, ProjectManager, ClientRep], code: 200, input: [], output: ExplorationAuthorization, side_effects: [] }
  - { method: GET, path: "/geo/exploration-authorizations", description: "List authorizations; filter project_id", roles: [FirmAdmin, ProjectManager, ClientRep], code: 200, input: ["project_id?", "limit?", "offset?"], output: "ExplorationAuthorization[]", side_effects: [] }
  - { method: POST, path: "/geo/exploration-authorizations/{id}/transition", description: "ClientRep approves/revokes (OCC-guarded on Project.version)", roles: [ClientRep], code: 200, input: [to, expected_project_version], output: ExplorationAuthorization, side_effects: ["project.additional_committed_cents adjusted; increments Project.version by 1"] }
  - { method: POST, path: "/geo/_clock/set_current_utc", description: "Test-driving endpoint: set the logical clock. Server default before any call is exactly 2026-08-01T00:00:00Z and MUST NOT fall back to wall-clock. Advancing the clock triggers clearance EXPIRED sweeps.", roles: [FirmAdmin], code: 200, input: [to_iso8601], output: null, side_effects: ["clearances past expires_on transition to EXPIRED"] }

errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing/invalid X-User-Role or X-User-ID" }
  - { id: ERR_FORBIDDEN_ROLE, http: 403, condition: "Role not permitted for this endpoint, or entity-backed ownership check failed" }
  - { id: ERR_RESOURCE_NOT_FOUND, http: 404, condition: "Path id does not exist (validated left-to-right)" }
  - { id: ERR_VALIDATION, http: 400, condition: "Malformed body: missing required field, bad enum, out-of-range number" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Current state does not permit the requested transition" }
  - { id: ERR_PROJECT_STATE_FORBIDS, http: 409, condition: "Project (or parent) in a state that forbids this child operation" }
  - { id: ERR_RIG_NOT_MOBILIZED, http: 409, condition: "Drilling requires a MOBILIZED rig assignment owned by the acting subcontractor" }
  - { id: ERR_SAMPLE_NOT_IN_LAB, http: 409, condition: "Test authorization requires sample custody LAB_RECEIVED" }
  - { id: ERR_ANALYSIS_NOT_VERIFIED, http: 409, condition: "No VERIFIED FoundationAnalysis (or no accepted strength test) where required" }
  - { id: ERR_ANALYSIS_DATA_STALE, http: 409, condition: "VERIFIED analysis has data_status STALE; refresh required before issue/verify" }
  - { id: ERR_REPORT_NOT_ISSUABLE, http: 409, condition: "Project cannot advance to ISSUED because no report is ISSUED" }
  - { id: ERR_CLAIM_STATE_FORBIDS, http: 409, condition: "Open claims block project close, or claim state forbids the transition" }
  - { id: ERR_ORDER_STATE_FORBIDS, http: 409, condition: "Non-ACCEPTED lab orders block REPORT_REVIEW or report issue" }
  - { id: ERR_CLEARANCE_MISSING, http: 409, condition: "Required utility clearance ticket absent" }
  - { id: ERR_CLEARANCE_EXPIRED, http: 409, condition: "Clearance expired: current logical time strictly after expires_on" }
  - { id: ERR_POSTURE_FROZEN, http: 409, condition: "Project posture FROZEN (utility conflict) blocks field operations" }
  - { id: ERR_PLAN_ALREADY_ACTIVE, http: 409, condition: "Another boring plan of the project is APPROVED or LOCKED" }
  - { id: ERR_PLAN_NOT_EDITABLE, http: 409, condition: "Direct boring creation attempted on a LOCKED or SUPERSEDED plan" }
  - { id: ERR_RIG_DOUBLE_BOOKED, http: 409, condition: "Rig window overlaps an existing SCHEDULED/MOBILIZED assignment of the same subcontractor (half-open intervals)" }
  - { id: ERR_STANDING_SUSPENDED, http: 409, condition: "Subcontractor standing is SUSPENDED" }
  - { id: ERR_LAB_CAPACITY_EXCEEDED, http: 409, condition: "LAB_MAX_IN_TEST=6 orders already IN_TEST" }
  - { id: ERR_RERUN_LIMIT, http: 409, condition: "rerun_count already at RERUN_MAX=2" }
  - { id: ERR_SOD_PE_IS_PREPARER, http: 409, condition: "Issuing PE is the report preparer (segregation of duties)" }
  - { id: ERR_DUPLICATE_TICKET, http: 409, condition: "ticket_number already filed for this boring, or license_no already registered" }
  - { id: ERR_INVALID_WINDOW, http: 422, condition: "window_end not strictly after window_start" }
  - { id: ERR_VISIT_DATE_FUTURE, http: 422, condition: "Visit cannot be performed before its scheduled visit_date" }
  - { id: ERR_SAMPLE_PROJECT_MISMATCH, http: 422, condition: "Sample belongs to a different project than the lab test order" }
  - { id: ERR_VISIT_PROJECT_MISMATCH, http: 422, condition: "Observation visit belongs to a different project than the claim" }
  - { id: ERR_OFFSET_PARENT_NOT_REFUSED, http: 422, condition: "Offset boring parent is not in REFUSED" }
  - { id: ERR_AUTH_CAP_EXCEEDED, http: 422, condition: "Approval would push additional_committed_cents above additional_auth_cap_cents" }
  - { id: ERR_EXTRA_BORINGS_EXHAUSTED, http: 422, condition: "No APPROVED authorization with remaining extra borings for an over-plan offset" }
  - { id: ERR_CLAIM_AMOUNT_INVALID, http: 422, condition: "Manually filed claim amount must be >= 1 cent" }
  - { id: ERR_APPEAL_LIMIT, http: 409, condition: "appeal_count already at APPEAL_MAX=1" }
  - { id: ERR_STALE_PROJECT_VERSION, http: 412, condition: "expected_project_version does not match Project.version (OCC)" }
  - { id: ERR_STALE_REPORT_VERSION, http: 412, condition: "expected_report_version does not match Report.version (OCC)" }

roles:
  - name: FirmAdmin
    description: "Firm operations administrator; manages clients, subcontractors, and the test clock"
    identity: opaque
    exclusive_operations: ["create clients", "create projects", "register/suspend subcontractors", "advance the logical clock"]
    shared_operations: ["read any resource"]
  - name: ClientRep
    description: "Client representative; authorizes and pays for additional exploration, confirms construction start, files claims"
    identity: "entity_backed:Client"
    exclusive_operations: ["approve/revoke exploration authorizations (own projects)", "advance own project ISSUED -> CONSTRUCTION_SUPPORT"]
    shared_operations: ["file claims", "read own projects, reports, authorizations"]
  - name: ProjectManager
    description: "Firm project manager; owns scope approval, scheduling, and commercial settlement"
    identity: opaque
    exclusive_operations: ["approve boring plans", "create rig assignments", "schedule observation visits", "settle claims", "abandon borings", "propose exploration authorizations", "drive most project transitions"]
    shared_operations: ["file claims", "mark utility conflicts", "read any resource"]
  - name: StaffEngineer
    description: "Staff engineer; drafts boring plans, files clearances, closes boring logs, performs visits"
    identity: opaque
    exclusive_operations: ["create boring plans and borings", "create offset borings", "file and clear utility tickets", "close boring logs", "perform visits and file findings"]
    shared_operations: ["read any resource"]
  - name: FieldGeologist
    description: "Field geologist; logs borings and collects/ships samples"
    identity: opaque
    exclusive_operations: ["log samples", "mark borings LOGGED", "ship samples", "report samples lost"]
    shared_operations: ["read borings and samples"]
  - name: DrillingSub
    description: "Drilling subcontractor portal user; mobilizes rigs and reports drilling progress/refusal"
    identity: "entity_backed:Subcontractor"
    exclusive_operations: ["mobilize/demobilize own rig assignments", "report DRILLED or REFUSED on own borings"]
    shared_operations: ["read own assignments and borings"]
  - name: LabManager
    description: "Laboratory manager; authorizes test orders and dispositions results"
    identity: opaque
    exclusive_operations: ["create lab test orders", "authorize orders", "accept or reject submitted results", "archive samples"]
    shared_operations: ["read samples, orders, results"]
  - name: LabTechnician
    description: "Lab technician; runs tests and submits results"
    identity: opaque
    exclusive_operations: ["receive samples into lab", "start tests", "submit results", "request reruns"]
    shared_operations: ["read samples, orders, results"]
  - name: SeniorEngineer
    description: "Senior engineer; performs analysis, drafts reports, evaluates claims"
    identity: opaque
    exclusive_operations: ["create/verify foundation analyses", "create and submit reports", "review claims (under-review/substantiate/rebut/appeal-entry)"]
    shared_operations: ["advance project LAB_ANALYSIS -> REPORT_REVIEW", "read any resource"]
  - name: PrincipalEngineer
    description: "Licensed PE; seals reports; cannot seal a report they prepared (segregation of duties)"
    identity: opaque
    exclusive_operations: ["issue reports (PE seal)", "return reports from PE_REVIEW to DRAFT", "reopen project analysis from REPORT_REVIEW"]
    shared_operations: ["read any resource"]
