scaffold_corner_design:

  # =========================================================================
  # Section: entities
  # =========================================================================
  - section: entities
    instances:
      # ----- Funder ---------------------------------------------------------
      - name: funder_creation_happy_path_returns_201_and_full_body
        claim_type: creation
        grounds:
          - entities.Funder
          - endpoints[POST /funders]
        distinguishing_aspect: "POST /funders with all required fields returns 201 and a body with server-minted id/version/created_at plus every input field echoed back."
        test_recipe:
          setup:
            - "clock 2026-06-01T00:00:00Z"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /funders"
              payload: { name: "Rainbow Trust", fiscal_year_start_month: 7, grant_cents_total: 50000000, reporting_currency: "USD" }
              as: PlatformAdmin
              captures: { f_id: $.data.id, f_grant_remaining: $.data.grant_cents_remaining, f_version: $.data.version }
          assert:
            - "HTTP status == 201"
            - "Funder.${f_id}.grant_cents_remaining == 50000000 (equals grant_cents_total at creation)"
            - "Funder.${f_id}.version == 1 (server-initialised)"
            - "Funder.${f_id}.name == 'Rainbow Trust'"

      - name: funder_get_by_id_not_found_returns_err_funder_not_found
        claim_type: not_found
        grounds:
          - errors[ERR_FUNDER_NOT_FOUND]
          - validations[priority=3]
        distinguishing_aspect: "GET /funders/{id} on a non-existent UUID returns ERR_FUNDER_NOT_FOUND / 404."
        test_recipe:
          setup:
            - "clock 2026-06-01T00:00:00Z; no Funders created"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "GET /funders/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: PlatformAdmin
              captures: { err_id: $.data.error_id }
          assert:
            - "error_id == ERR_FUNDER_NOT_FOUND"
            - "HTTP status == 404"

      # ----- Provider -------------------------------------------------------
      - name: provider_creation_missing_languages_supported_returns_invalid_request
        claim_type: required_fields
        grounds:
          - errors[ERR_INVALID_REQUEST]
          - endpoints[POST /providers]
        distinguishing_aspect: "POST /providers without languages_supported (declared required in §1.5 input) returns ERR_INVALID_REQUEST / 400."
        test_recipe:
          setup:
            - "clock 2026-06-01T00:00:00Z"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /providers"
              payload: { legal_name: "MissingLang Inc", location_lat: 40.0, location_lng: -74.0, accessibility_features: ["WHEELCHAIR"] }
              as: PlatformAdmin
              captures: { err_id: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_REQUEST"
            - "HTTP status == 400"

      # ----- Program computed fields ---------------------------------------
      - name: program_created_with_computed_defaults
        claim_type: defaults
        grounds:
          - entities.Program.fields.capacity_slots_taken
          - entities.Program.fields.intake_posture
          - entities.Program.fields.funder_reporting_posture
        distinguishing_aspect: "New Program initialises capacity_slots_taken=0, intake_posture=OPEN, funder_reporting_posture=OPEN even though caller does not supply these fields."
        test_recipe:
          setup:
            - "clock 2026-06-01T00:00:00Z"
            - "Funder F_new, Provider P_new exist"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /funders"
              payload: { name: "F_new", fiscal_year_start_month: 7, grant_cents_total: 100000000, reporting_currency: "USD" }
              as: PlatformAdmin
              captures: { f_new_id: $.data.id }
            - call: "POST /providers"
              payload: { legal_name: "P_new", location_lat: 40.0, location_lng: -74.0, accessibility_features: ["WHEELCHAIR"], languages_supported: ["EN"] }
              as: PlatformAdmin
              captures: { p_new_id: $.data.id }
          trigger:
            - call: "POST /programs"
              payload: { provider_id: "${p_new_id}", funder_id: "${f_new_id}", category: "FOOD", eligibility_income_max_cents: 500000, eligibility_age_min: 18, eligibility_age_max: 65, unit_cost_cents: 10000, capacity_slots_total: 5 }
              as: PlatformAdmin
              captures: { p_id: $.data.id, taken: $.data.capacity_slots_taken, intake_p: $.data.intake_posture, report_p: $.data.funder_reporting_posture }
          assert:
            - "Program.${p_id}.capacity_slots_taken == 0"
            - "Program.${p_id}.intake_posture == OPEN"
            - "Program.${p_id}.funder_reporting_posture == OPEN"

      # ----- Enum constraint on client language ----------------------------
      - name: client_creation_invalid_preferred_language_enum_rejected
        claim_type: type_constraints
        grounds:
          - entities.Client.fields.preferred_language
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "POST /clients with preferred_language outside [EN, ES, FR, ZH, VI, AR] returns ERR_INVALID_REQUEST / 400."
        test_recipe:
          setup:
            - "clock 2026-06-01T00:00:00Z"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /clients"
              payload: { full_name: "Bad Lang", date_of_birth: "1996-01-15", monthly_income_cents: 400000, home_lat: 40.0, home_lng: -74.0, preferred_language: "KLINGON", accessibility_needs: [] }
              as: Caseworker
              captures: { err_id: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_REQUEST"
            - "HTTP status == 400"

      - name: funder_report_creation_returns_no_version_field_since_common_fields_false
        claim_type: system_fields
        grounds:
          - entities.FunderReport
        distinguishing_aspect: "FunderReport (common_fields: false) response body exposes system-minted id and created_at but no version and no updated_at, per §1.1 common_fields semantics."
        test_recipe:
          setup:
            - "clock 2026-06-01T00:00:00Z"
            - "Funder F_fr exists"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /funders"
              payload: { name: "F_fr", fiscal_year_start_month: 7, grant_cents_total: 100000000, reporting_currency: "USD" }
              as: PlatformAdmin
              captures: { f_fr_id: $.data.id }
          trigger:
            - call: "POST /funders/${f_fr_id}/reports"
              payload: { reporting_period_start: "2026-05-01T00:00:00Z", reporting_period_end: "2026-07-01T00:00:00Z", rounding_variant: "SUM_THEN_ROUND" }
              as: PlatformAdmin
              captures: { rpt_id: $.data.id, rpt_total: $.data.total_disbursement_cents }
          assert:
            - "FunderReport.${rpt_id}.total_disbursement_cents == 0 (no outcomes exist in window)"
            - "FunderReport.${rpt_id}.total_referrals == 0"
            - "FunderReport.${rpt_id}.total_completions == 0"
            - "The response body contains id and created_at but NOT version and NOT updated_at (common_fields: false semantics)"

  # =========================================================================
  # Section: state_machines
  # =========================================================================
  - section: state_machines
    instances:
      - name: intake_created_starts_in_draft
        claim_type: initial_state
        grounds:
          - state_machines.Intake
          - endpoints[POST /clients/{id}/intakes]
        distinguishing_aspect: "A newly created Intake has status == DRAFT (Intake state machine initial_state)."
        test_recipe:
          setup:
            - "clock 2026-06-01T00:00:00Z; Client C_new exists"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /clients"
              payload: { full_name: "InitCli", date_of_birth: "1996-01-15", monthly_income_cents: 400000, home_lat: 40.0, home_lng: -74.0, preferred_language: "EN", accessibility_needs: [] }
              as: Caseworker
              captures: { c_init_id: $.data.id }
          trigger:
            - call: "POST /clients/${c_init_id}/intakes"
              payload: { presenting_needs: ["FOOD"], urgency: "ROUTINE", household_size: 1, disability_flag: false }
              as: Caseworker
              captures: { i_init_id: $.data.id, i_init_status: $.data.status }
          assert:
            - "Intake.${i_init_id}.status == DRAFT"
            - "Intake.${i_init_id}.version == 1"

      - name: intake_screen_from_screened_returns_invalid_state
        claim_type: invalid_transition
        grounds:
          - state_machines.Intake.DRAFT_to_SCREENED
          - validations[priority=13]
          - errors[ERR_INTAKE_NOT_DRAFT]
        distinguishing_aspect: "POST /intakes/{id}/screen when intake.status == SCREENED returns ERR_INTAKE_NOT_DRAFT / 409 (idempotent screen is not allowed)."
        test_recipe:
          setup:
            - "clock 2026-06-01T00:00:00Z; Intake I already SCREENED"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /clients"
              payload: { full_name: "Idem", date_of_birth: "1996-01-15", monthly_income_cents: 400000, home_lat: 40.0, home_lng: -74.0, preferred_language: "EN", accessibility_needs: [] }
              as: Caseworker
              captures: { c_idem_id: $.data.id }
            - call: "POST /clients/${c_idem_id}/intakes"
              payload: { presenting_needs: ["FOOD"], urgency: "ROUTINE", household_size: 1, disability_flag: false }
              as: Caseworker
              captures: { i_idem_id: $.data.id }
            - call: "POST /intakes/${i_idem_id}/screen"
              payload: {}
              as: Caseworker
          trigger:
            - call: "POST /intakes/${i_idem_id}/screen"
              payload: {}
              as: Caseworker
              captures: { err_id: $.data.error_id }
          assert:
            - "error_id == ERR_INTAKE_NOT_DRAFT"
            - "HTTP status == 409"

      - name: referral_decline_from_accepted_returns_invalid_state
        claim_type: invalid_transition
        grounds:
          - state_machines.Referral.PROPOSED_to_DECLINED
          - validations[priority=15]
          - errors[ERR_REFERRAL_INVALID_STATE]
        distinguishing_aspect: "POST /referrals/{id}/decline when referral.status == ACCEPTED returns ERR_REFERRAL_INVALID_STATE / 409 — decline is legal only from PROPOSED."
        test_recipe:
          setup:
            - "Referral R accepted (status == ACCEPTED)"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /funders"
              payload: { name: "F_r_i", fiscal_year_start_month: 7, grant_cents_total: 100000000, reporting_currency: "USD" }
              as: PlatformAdmin
              captures: { f_ri_id: $.data.id }
            - call: "POST /providers"
              payload: { legal_name: "P_ri", location_lat: 40.0, location_lng: -74.0, accessibility_features: ["WHEELCHAIR"], languages_supported: ["EN"] }
              as: PlatformAdmin
              captures: { p_ri_id: $.data.id }
            - call: "POST /programs"
              payload: { provider_id: "${p_ri_id}", funder_id: "${f_ri_id}", category: "FOOD", eligibility_income_max_cents: 500000, eligibility_age_min: 18, eligibility_age_max: 65, unit_cost_cents: 10000, capacity_slots_total: 5 }
              as: PlatformAdmin
              captures: { prog_ri_id: $.data.id }
            - call: "POST /clients"
              payload: { full_name: "R", date_of_birth: "1996-01-15", monthly_income_cents: 400000, home_lat: 40.0, home_lng: -74.0, preferred_language: "EN", accessibility_needs: [] }
              as: Caseworker
              captures: { c_ri_id: $.data.id }
            - call: "POST /clients/${c_ri_id}/intakes"
              payload: { presenting_needs: ["FOOD"], urgency: "ROUTINE", household_size: 1, disability_flag: false }
              as: Caseworker
              captures: { i_ri_id: $.data.id }
            - call: "POST /intakes/${i_ri_id}/screen"
              payload: {}
              as: Caseworker
            - call: "POST /clients/${c_ri_id}/consent-grants"
              payload: { provider_id: "${p_ri_id}", scope: "BASIC_CONTACT" }
              as: Client
              as_user_id: "${c_ri_id}"
              captures: { cg_ri_id: $.data.id }
            - call: "POST /intakes/${i_ri_id}/referrals"
              payload: { program_id: "${prog_ri_id}", consent_grant_id: "${cg_ri_id}", transport_mode: "CAR" }
              as: Caseworker
              captures: { r_ri_id: $.data.id }
            - call: "POST /referrals/${r_ri_id}/accept"
              payload: {}
              as: ProviderStaff
              as_user_id: "${p_ri_id}"
          trigger:
            - call: "POST /referrals/${r_ri_id}/decline"
              payload: {}
              as: ProviderStaff
              as_user_id: "${p_ri_id}"
              captures: { err_id: $.data.error_id }
          assert:
            - "error_id == ERR_REFERRAL_INVALID_STATE"
            - "HTTP status == 409"

      - name: consent_grant_revoke_twice_returns_already_terminal
        claim_type: idempotency_error
        grounds:
          - state_machines.ConsentGrant.GRANTED_to_REVOKED
          - errors[ERR_CONSENT_ALREADY_TERMINAL]
          - validations[priority=16]
        distinguishing_aspect: "POST /consent-grants/{id}/revoke on an already-REVOKED consent fails with ERR_CONSENT_ALREADY_TERMINAL (terminal state lockdown)."
        test_recipe:
          setup:
            - "ConsentGrant CG revoked once"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /providers"
              payload: { legal_name: "P_rev", location_lat: 40.0, location_lng: -74.0, accessibility_features: ["WHEELCHAIR"], languages_supported: ["EN"] }
              as: PlatformAdmin
              captures: { p_rev_id: $.data.id }
            - call: "POST /clients"
              payload: { full_name: "RevCli", date_of_birth: "1996-01-15", monthly_income_cents: 400000, home_lat: 40.0, home_lng: -74.0, preferred_language: "EN", accessibility_needs: [] }
              as: Caseworker
              captures: { c_rev_id: $.data.id }
            - call: "POST /clients/${c_rev_id}/consent-grants"
              payload: { provider_id: "${p_rev_id}", scope: "BASIC_CONTACT" }
              as: Client
              as_user_id: "${c_rev_id}"
              captures: { cg_rev_id: $.data.id }
            - call: "POST /consent-grants/${cg_rev_id}/revoke"
              payload: {}
              as: Client
              as_user_id: "${c_rev_id}"
          trigger:
            - call: "POST /consent-grants/${cg_rev_id}/revoke"
              payload: {}
              as: Client
              as_user_id: "${c_rev_id}"
              captures: { err_id: $.data.error_id }
          assert:
            - "error_id == ERR_CONSENT_ALREADY_TERMINAL"
            - "HTTP status == 409"

      - name: intake_bubble_up_close_when_all_referrals_terminal
        claim_type: side_effect_bubble_up
        grounds:
          - state_machines.Intake.SCREENED_to_CLOSED
          - state_machines.Referral.PROPOSED_to_DECLINED
        distinguishing_aspect: "When the only Referral tied to a SCREENED Intake transitions to a terminal state (DECLINED), Intake auto-transitions SCREENED → CLOSED (bubble-up)."
        test_recipe:
          setup:
            - "One SCREENED intake with a single PROPOSED referral"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /funders"
              payload: { name: "F_bu", fiscal_year_start_month: 7, grant_cents_total: 100000000, reporting_currency: "USD" }
              as: PlatformAdmin
              captures: { f_bu_id: $.data.id }
            - call: "POST /providers"
              payload: { legal_name: "P_bu", location_lat: 40.0, location_lng: -74.0, accessibility_features: ["WHEELCHAIR"], languages_supported: ["EN"] }
              as: PlatformAdmin
              captures: { p_bu_id: $.data.id }
            - call: "POST /programs"
              payload: { provider_id: "${p_bu_id}", funder_id: "${f_bu_id}", category: "FOOD", eligibility_income_max_cents: 500000, eligibility_age_min: 18, eligibility_age_max: 65, unit_cost_cents: 10000, capacity_slots_total: 5 }
              as: PlatformAdmin
              captures: { prog_bu_id: $.data.id }
            - call: "POST /clients"
              payload: { full_name: "BuCli", date_of_birth: "1996-01-15", monthly_income_cents: 400000, home_lat: 40.0, home_lng: -74.0, preferred_language: "EN", accessibility_needs: [] }
              as: Caseworker
              captures: { c_bu_id: $.data.id }
            - call: "POST /clients/${c_bu_id}/intakes"
              payload: { presenting_needs: ["FOOD"], urgency: "ROUTINE", household_size: 1, disability_flag: false }
              as: Caseworker
              captures: { i_bu_id: $.data.id }
            - call: "POST /intakes/${i_bu_id}/screen"
              payload: {}
              as: Caseworker
            - call: "POST /clients/${c_bu_id}/consent-grants"
              payload: { provider_id: "${p_bu_id}", scope: "BASIC_CONTACT" }
              as: Client
              as_user_id: "${c_bu_id}"
              captures: { cg_bu_id: $.data.id }
            - call: "POST /intakes/${i_bu_id}/referrals"
              payload: { program_id: "${prog_bu_id}", consent_grant_id: "${cg_bu_id}", transport_mode: "CAR" }
              as: Caseworker
              captures: { r_bu_id: $.data.id }
          trigger:
            - call: "POST /referrals/${r_bu_id}/decline"
              payload: {}
              as: ProviderStaff
              as_user_id: "${p_bu_id}"
            - call: "GET /intakes/${i_bu_id}"
              payload: {}
              as: Caseworker
              captures: { i_bu_status: $.data.status }
          assert:
            - "Referral.${r_bu_id}.status == DECLINED"
            - "Intake.${i_bu_id}.status == CLOSED (bubble-up transition fired because every referral tied to this intake is now terminal)"

      - name: consent_expiry_via_clock_advance_does_not_cascade_withdraw
        claim_type: side_effect_conditional
        grounds:
          - state_machines.ConsentGrant.GRANTED_to_EXPIRED
          - state_machines.Referral
        distinguishing_aspect: "System transition GRANTED → EXPIRED (clock crossing expires_at) does NOT cascade WITHDRAWN onto Referrals — only user REVOKE cascades (branching side-effect sets on the two divergent transitions)."
        test_recipe:
          setup:
            - "Referral R exists in PROPOSED under Consent CG in GRANTED"
            - "Clock is initially 2026-06-01T00:00:00Z (Consent will expire at 2026-08-30T00:00:00Z)"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /funders"
              payload: { name: "F_exp", fiscal_year_start_month: 7, grant_cents_total: 100000000, reporting_currency: "USD" }
              as: PlatformAdmin
              captures: { f_exp_id: $.data.id }
            - call: "POST /providers"
              payload: { legal_name: "P_exp", location_lat: 40.0, location_lng: -74.0, accessibility_features: ["WHEELCHAIR"], languages_supported: ["EN"] }
              as: PlatformAdmin
              captures: { p_exp_id: $.data.id }
            - call: "POST /programs"
              payload: { provider_id: "${p_exp_id}", funder_id: "${f_exp_id}", category: "FOOD", eligibility_income_max_cents: 500000, eligibility_age_min: 18, eligibility_age_max: 65, unit_cost_cents: 10000, capacity_slots_total: 5 }
              as: PlatformAdmin
              captures: { prog_exp_id: $.data.id }
            - call: "POST /clients"
              payload: { full_name: "ExpCli", date_of_birth: "1996-01-15", monthly_income_cents: 400000, home_lat: 40.0, home_lng: -74.0, preferred_language: "EN", accessibility_needs: [] }
              as: Caseworker
              captures: { c_exp_id: $.data.id }
            - call: "POST /clients/${c_exp_id}/intakes"
              payload: { presenting_needs: ["FOOD"], urgency: "ROUTINE", household_size: 1, disability_flag: false }
              as: Caseworker
              captures: { i_exp_id: $.data.id }
            - call: "POST /intakes/${i_exp_id}/screen"
              payload: {}
              as: Caseworker
            - call: "POST /clients/${c_exp_id}/consent-grants"
              payload: { provider_id: "${p_exp_id}", scope: "BASIC_CONTACT" }
              as: Client
              as_user_id: "${c_exp_id}"
              captures: { cg_exp_id: $.data.id }
            - call: "POST /intakes/${i_exp_id}/referrals"
              payload: { program_id: "${prog_exp_id}", consent_grant_id: "${cg_exp_id}", transport_mode: "CAR" }
              as: Caseworker
              captures: { r_exp_id: $.data.id }
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "GET /consent-grants/${cg_exp_id}"
              payload: {}
              as: Caseworker
              captures: { cg_status: $.data.status }
            - call: "GET /referrals/${r_exp_id}"
              payload: {}
              as: Caseworker
              captures: { r_status: $.data.status }
          assert:
            - "ConsentGrant.${cg_exp_id}.status == EXPIRED (system transition on clock advance)"
            - "Referral.${r_exp_id}.status == PROPOSED (NOT WITHDRAWN — EXPIRED does not cascade, only REVOKE does)"

      # ------ Reference to §1.8 for the OCC race + cyclic revision -------
      - name: intake_cyclic_revision_screen_reopen_screen
        claim_type: cyclic_state_shape
        grounds:
          - state_machines.Intake.SCREENED_to_DRAFT
        excluded_because:
          difficulty_instance: intake_draft_screened_draft_revision_cycle
          rationale: "Rule 3 instance 1 already exercises the DRAFT ↔ SCREENED cycle."

  # =========================================================================
  # Section: calculations
  # =========================================================================
  - section: calculations
    instances:
      - name: travel_burden_naive_less_than_routed_variant_delta
        claim_type: variant_divergence
        grounds:
          - calculations.travel_burden_minutes
          - entities.Referral.fields.travel_burden_naive_min
          - entities.Referral.fields.travel_burden_routed_min
        distinguishing_aspect: "For the same origin/destination and transport_mode, travel_burden_routed_min is strictly greater than travel_burden_naive_min by exactly the WINDING_FACTOR ratio (1.35)."
        test_recipe:
          setup:
            - "Client home (40.10, -74.05); Provider (40.00, -74.00); transport_mode=CAR"
            - "|dLat|+|dLng| = 0.10 + 0.05 = 0.15 degrees → 0.15 * 111 = 16.65 km"
            - "naive: 16.65 / 40 * 60 = 24.975 min → round_half_up 2dp = 24.98"
            - "routed: 16.65 * 1.35 / 40 * 60 = 33.716... min → round_half_up 2dp = 33.72"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
