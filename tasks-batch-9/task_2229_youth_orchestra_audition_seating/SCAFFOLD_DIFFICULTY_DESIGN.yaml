              as: RegistrarStaff
              captures: { m1_id: "$.data.id" }
            - call: "POST /panelists"
              payload: { display_name: "Panel One", instrument_expertise: "VIOLIN" }
              as: ArtisticDirector
              captures: { p1_id: "$.data.id" }
            - call: "POST /panelists"
              payload: { display_name: "Panel Two", instrument_expertise: "VIOLIN" }
              as: ArtisticDirector
              captures: { p2_id: "$.data.id" }
            - call: "POST /panelists"
              payload: { display_name: "Panel Three", instrument_expertise: "VIOLIN" }
              as: ArtisticDirector
              captures: { p3_id: "$.data.id" }
            - call: "POST /seasons/${season_id}/advance-status"
              payload: { to_status: "AUDITIONS_OPEN" }
              as: ArtisticDirector
            - call: "POST /audition-slots"
              payload: { season_id: "${season_id}", room_code: "R1", start_at: "2026-08-12T10:00:00Z", end_at: "2026-08-12T10:30:00Z", panelist_ids: ["${p1_id}", "${p2_id}", "${p3_id}"], instrument_focus: "VIOLIN", quorum_required: 3, capacity: 4 }
              as: RegistrarStaff
              captures: { slot_id: "$.data.id" }
            - call: "POST /auditions"
              payload: { member_id: "${m1_id}", season_id: "${season_id}", declared_program: "Bruch Concerto mvt I", excerpt_ids: ["EX1"], scale_attested: true }
              as: Guardian
              as_user_id: "${m1_id}"
              captures: { a1_id: "$.data.id" }
            - call: "POST /auditions/${a1_id}/schedule"
              payload: { slot_id: "${slot_id}" }
              as: RegistrarStaff
            - call: "POST /auditions/${a1_id}/panel-scores"
              payload: { panelist_id: "${p1_id}", tone_score: 22, rhythm_score: 20, intonation_score: 21, sight_reading_score: 18 }
              as: Panelist
              as_user_id: "${p1_id}"
            - call: "POST /auditions/${a1_id}/panel-scores"
              payload: { panelist_id: "${p2_id}", tone_score: 22, rhythm_score: 20, intonation_score: 21, sight_reading_score: 18 }
              as: Panelist
              as_user_id: "${p2_id}"
            - call: "POST /auditions/${a1_id}/panel-scores"
              payload: { panelist_id: "${p3_id}", tone_score: 22, rhythm_score: 20, intonation_score: 21, sight_reading_score: 18 }
              as: Panelist
              as_user_id: "${p3_id}"
            - call: "POST /auditions/${a1_id}/adjudicate"
              payload: {}
              as: ArtisticDirector
            - call: "POST /seasons/${season_id}/advance-status"
              payload: { to_status: "PLACEMENT" }
              as: ArtisticDirector
            - call: "GET /ensembles/${ens_id}"
              as: ArtisticDirector
              captures: { ens_v: "$.data.version" }
            - call: "POST /placements"
              payload: { audition_id: "${a1_id}", ensemble_id: "${ens_id}", offer_kind: "OFFER", expected_ensemble_version: "${ens_v}", offer_expires_at: "2026-08-25T00:00:00Z" }
              as: ArtisticDirector
              captures: { pl1_id: "$.data.id" }
            - call: "POST /placements/${pl1_id}/accept"
              payload: { instrument_loan_requested: false }
              as: Guardian
              as_user_id: "${m1_id}"
            - call: "GET /tuition-accounts?member_id=${m1_id}"
              as: FinanceOfficer
              captures: { acct1_id: "$.data[0].id" }
          trigger:
            - call: "POST /tuition-accounts/${acct1_id}/finalize-assessment"
              payload: {}
              as: FinanceOfficer
              as_user_id: "officer-fin-1"
          assert:
            - "Before the trigger: TuitionAccount.${acct1_id}.assessment_variant == PRELIMINARY, assessed_cents == 123223, sibling_discount_cents == 0, loyalty_credit_cents == 0"
            - "After the trigger: TuitionAccount.${acct1_id}.assessment_variant == FINAL"
            - "TuitionAccount.${acct1_id}.sibling_discount_cents == 12322"
            - "TuitionAccount.${acct1_id}.loyalty_credit_cents == 1848"
            - "TuitionAccount.${acct1_id}.assessed_cents == 109053"
            - "TuitionAccount.${acct1_id}.balance_cents == 109053"
            - "TuitionAccount.${acct1_id}.billing_status == CURRENT"
            - "The two variants differ by exactly 14170 cents on identical member data"

  # =========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: aid_grant_triple_min_with_floor_branch
        grounds:
          - calculations.aid_award_waterfall
          - calculations.aid_need_score
          - entities.TuitionAccount.fields.aid_awarded_cents
          - entities.TuitionAccount.fields.aid_denial_reason
          - entities.Season.fields.aid_available_cents
          - validations[priority=52]
        distinguishing_aspect: |
          Mode (a): grant = min(aid_requested_cents, per_member_ceiling,
          remaining) is a three-input nested min, and the MIN_AWARD_CENTS floor
          is a conditional branch on the clamped result that deliberately does
          NOT consume budget - so applicant 3 is funded from money applicant 2
          was denied. Non-linear because the outcome of each account depends on
          the branch taken by every earlier account.
        test_recipe:
          setup:
            - "Season with aid_budget_cents 40000, so per_member_ceiling = round_half_up(40000 * 0.30) = 12000."
            - "Three seated PHILHARMONIC members whose aid_need_scores are 49, 31 and 13, all UNDER_REVIEW, requesting 12000 / 3000 / 12000 cents."
            - "The reviewing officer (officer-review-1) is a different X-User-ID from the awarding officer (officer-award-2)."
