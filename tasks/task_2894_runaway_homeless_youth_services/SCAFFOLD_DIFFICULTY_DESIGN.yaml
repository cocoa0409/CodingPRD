  - rule_id: non_linear_state_machine
    instances:
      - name: reunification_case_mediation_cycle_bounded_at_three_rounds
        grounds:
          - state_machines.ReunificationCase
          - entities.ReunificationCase.fields.mediation_round
          - entities.ReunificationCase.fields.max_mediation_rounds
          - entities.MediationSession.fields.round_number
          - validations[priority=36]
          - validations[priority=29]
          - errors.ERR_MEDIATION_ROUNDS_EXHAUSTED
        distinguishing_aspect: |
          ReunificationCase is the cyclic entity: OPENED -> MEDIATION_SCHEDULED -> MEDIATION_HELD ->
          MEDIATION_SCHEDULED is a genuine loop back to a previously occupied state, and the loop is
          bounded by a counter rather than by a terminal state, so the fourth scheduling attempt is
          rejected with ERR_MEDIATION_ROUNDS_EXHAUSTED while the case remains in the non-terminal
          MEDIATION_HELD state and stays open to home-assessment. Each lap is additionally gated by
          the 72-hour cooldown measured from the previous session's held_at, so the loop cannot be
          traversed instantaneously.
        test_recipe:
          setup:
            - "youth Mia Alvarez created at the default logical clock 2026-08-01T00:00:00Z with no admissions, so Youth.risk_posture is OPEN and validations priority 20 passes"
            - "one ReunificationCase in status OPENED with mediation_round 0 and max_mediation_rounds 3"
            - "three complete schedule-then-record laps are driven at 2026-08-03T15:00:00Z, 2026-08-07T15:00:00Z and 2026-08-11T15:00:00Z, each session window starting after the previous held_at plus 72 hours"
