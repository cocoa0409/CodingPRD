  - rule_id: resource_temporal_overlap
    instances:
      - name: appraisal_coverage_window_half_open_adjacency_and_release_on_rejection
        grounds:
          - validations[priority=18]
          - state_machines.Appraisal.ORDERED_to_RECEIVED
          - state_machines.Appraisal.RECEIVED_to_REJECTED
          - entities.Appraisal.fields.coverage_end_date
          - errors.ERR_APPRAISAL_WINDOW_OVERLAP
        distinguishing_aspect: |
          Resource = the loan's valuation timeline; interval semantics = HALF-OPEN
          [as_of_date, as_of_date + valuation_valid_months). Adjacency is therefore LEGAL: a window
          that starts exactly on the incumbent's coverage_end_date is accepted, while a window
          starting one day earlier is refused. Two further wrinkles are exercised in the same
          instance: an ACCEPTED appraisal whose window has already elapsed relative to the logical
          clock STILL occupies that window (expiry is not release), and a RECEIVED appraisal that was
          later REJECTED releases its window entirely, so a later appraisal may overlap it freely.
          Occupancy is thus a function of status IN {RECEIVED, ACCEPTED}, never of the clock.
        test_recipe:
          setup:
            - "Clock at the default 2026-08-01T00:00:00Z during build-out."
            - "Loan A in SPECIAL_SERVICING under a trust with a 40,000,000.00 controlling class balance."
            - "Appraisal 1: UPDATE, valuation_valid_months 12, RECEIVED as of 2026-08-01 then ACCEPTED, so it occupies [2026-08-01, 2027-08-01)."
            - "Appraisal R: UPDATE, valuation_valid_months 12, RECEIVED as of 2027-09-01 (window [2027-09-01, 2028-09-01), disjoint from appraisal 1) and then REJECTED, which releases that window."
            - "Appraisal 2: UPDATE, ordered_on 2027-06-01, valuation_valid_months 12, left in ORDERED so the same row can be probed twice."
            - "The clock is then moved to 2027-08-01T00:00:00Z, at which point appraisal 1 is expired but still ACCEPTED."
          setup_api_calls:
            - call: "POST /special-servicing/trusts"
              payload: { deal_name: "CMBS 2026-W1", closing_date: "2026-01-15T00:00:00Z", original_controlling_class_balance_usd: 40000000 }
              as: PlatformAdmin
              as_user_id: "admin-001"
              captures: { trust_id: "$.data.id" }
            - call: "POST /special-servicing/loans"
              payload: { trust_id: "${trust_id}", loan_number: "L-W01", original_balance_usd: 12000000, current_principal_balance_usd: 10000000, note_rate_pct: 6.0, monthly_debt_service_usd: 65000, maturity_date: "2029-06-01T00:00:00Z", securitization_value_usd: 15000000 }
              as: MasterServicer
              as_user_id: "ms-001"
              captures: { loan_id: "$.data.id" }
            - call: "POST /special-servicing/transfer-events"
              payload: { loan_id: "${loan_id}", event_code: "BANKRUPTCY", occurred_on: "2026-07-01T00:00:00Z", evidence_note: "chapter 11 petition" }
              as: MasterServicer
              as_user_id: "ms-001"
            - call: "POST /special-servicing/loans/${loan_id}/servicing-status"
              payload: { to_status: "SPECIAL_SERVICING" }
              as: MasterServicer
              as_user_id: "ms-001"
            - call: "POST /special-servicing/appraisals"
              payload: { loan_id: "${loan_id}", appraisal_type: "UPDATE", ordered_on: "2026-08-01T00:00:00Z", appraiser_firm: "Acme Valuation", valuation_valid_months: 12 }
              as: SpecialServicerAssetManager
              as_user_id: "amgr-001"
              captures: { appraisal_1_id: "$.data.id" }
            - call: "POST /special-servicing/appraisals/${appraisal_1_id}/status"
              payload: { to_status: "RECEIVED", value_usd: 9000000, as_of_date: "2026-08-01T00:00:00Z" }
              as: SpecialServicerAssetManager
              as_user_id: "amgr-001"
              captures: { a1_start: "$.data.coverage_start_date", a1_end: "$.data.coverage_end_date" }
            - call: "POST /special-servicing/appraisals/${appraisal_1_id}/status"
              payload: { to_status: "ACCEPTED" }
              as: SpecialServicerAssetManager
              as_user_id: "amgr-002"
            - call: "POST /special-servicing/appraisals"
              payload: { loan_id: "${loan_id}", appraisal_type: "UPDATE", ordered_on: "2026-08-01T00:00:00Z", appraiser_firm: "Beta Valuation", valuation_valid_months: 12 }
              as: SpecialServicerAssetManager
              as_user_id: "amgr-001"
              captures: { appraisal_r_id: "$.data.id" }
            - call: "POST /special-servicing/appraisals/${appraisal_r_id}/status"
              payload: { to_status: "RECEIVED", value_usd: 8800000, as_of_date: "2027-09-01T00:00:00Z" }
              as: SpecialServicerAssetManager
              as_user_id: "amgr-001"
              captures: { ar_start: "$.data.coverage_start_date", ar_end: "$.data.coverage_end_date" }
            - call: "POST /special-servicing/appraisals/${appraisal_r_id}/status"
              payload: { to_status: "REJECTED", rejection_reason: "comparable set rejected by the special servicer" }
              as: SpecialServicerAssetManager
              as_user_id: "amgr-002"
            - call: "POST /special-servicing/appraisals"
              payload: { loan_id: "${loan_id}", appraisal_type: "UPDATE", ordered_on: "2027-06-01T00:00:00Z", appraiser_firm: "Gamma Valuation", valuation_valid_months: 12 }
              as: SpecialServicerAssetManager
              as_user_id: "amgr-001"
              captures: { appraisal_2_id: "$.data.id" }
            - call: "POST /special-servicing/_clock/set_current_utc"
              payload: { current_utc: "2027-08-01T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "admin-001"
          trigger:
            - call: "POST /special-servicing/appraisals/${appraisal_2_id}/status"
              payload: { to_status: "RECEIVED", value_usd: 8500000, as_of_date: "2027-07-31T00:00:00Z" }
              as: SpecialServicerAssetManager
              as_user_id: "amgr-001"
              captures: { overlap_error: "$.data.error_id" }
            - call: "GET /special-servicing/appraisals/${appraisal_2_id}"
              as: SpecialServicerAssetManager
              as_user_id: "amgr-001"
              captures: { a2_status_after_refusal: "$.data.status" }
            - call: "POST /special-servicing/appraisals/${appraisal_2_id}/status"
              payload: { to_status: "RECEIVED", value_usd: 8500000, as_of_date: "2027-08-01T00:00:00Z" }
              as: SpecialServicerAssetManager
              as_user_id: "amgr-001"
              captures: { a2_start: "$.data.coverage_start_date", a2_end: "$.data.coverage_end_date", a2_received_on: "$.data.received_on" }
          assert:
            - "Appraisal.${appraisal_1_id}: coverage_start_date 2026-08-01T00:00:00Z, coverage_end_date 2027-08-01T00:00:00Z, status ACCEPTED"
            - "Appraisal.${appraisal_r_id}: coverage_start_date 2027-09-01T00:00:00Z, coverage_end_date 2028-09-01T00:00:00Z, status REJECTED"
            - "Probe 1 (as_of_date 2027-07-31) returns HTTP 409 with error_id ERR_APPRAISAL_WINDOW_OVERLAP — the single day 2027-07-31 lies in both half-open windows"
            - "After the refusal Appraisal.${appraisal_2_id}.status is still ORDERED with value_usd, as_of_date, coverage_start_date and coverage_end_date all null and version unchanged"
            - "Probe 2 (as_of_date 2027-08-01) returns HTTP 200 with status RECEIVED, coverage_start_date 2027-08-01T00:00:00Z, coverage_end_date 2028-08-01T00:00:00Z and received_on 2027-08-01T00:00:00Z"
            - "Probe 2 succeeded even though its window [2027-08-01, 2028-08-01) overlaps the REJECTED appraisal R's window — rejection released the reservation"
            - "Probe 2 also succeeded even though appraisal 1 is stale at the clock: an expired ACCEPTED appraisal still blocks any window that reaches back before 2027-08-01"
            - "No AppraisalReduction was created by either probe, because ARA creation hangs off ACCEPTED and not RECEIVED"

      - name: lease_term_closed_interval_adjacency_rejected_and_scoped_by_suite
        grounds:
          - validations[priority=17]
          - state_machines.BorrowerRequest.CONSULTATION_PENDING_to_APPROVED
          - entities.BorrowerRequest.fields.lease_commencement_date
          - errors.ERR_LEASE_TERM_OVERLAP
        distinguishing_aspect: |
          Different resource and the opposite interval convention from the appraisal instance. The
          resource is the tuple (loan_id, suite_code) — physical occupancy of one suite — and the
          lease term [lease_commencement_date, lease_expiration_date] is CLOSED, so adjacency is
          ILLEGAL: a new term commencing exactly on the incumbent's expiration date shares that one
          day and is refused, while commencing one day later is accepted. The same shared date on a
          DIFFERENT suite of the same loan is accepted, proving the reservation is keyed on the pair
          and not on the loan. Contention is evaluated only at the moment of approval and only
          against status == APPROVED rows, so the refused request sitting in CONSULTATION_PENDING
          reserves nothing.
        test_recipe:
          setup:
            - "Clock at the default 2026-08-01T00:00:00Z throughout, so every consultation response lands inside its window."
            - "Loan L in SPECIAL_SERVICING under a trust with a 40,000,000.00 controlling class balance (control_status CONTROLLING, so every consultation carries CONSENT_RIGHT)."
            - "A fresh ACCEPTED UPDATE appraisal as of 2026-08-01 so RECOMMENDED is reachable for every request."
            - "LEASE_APPROVAL request R1 on suite S-300 for [2027-01-01, 2031-12-31] is carried all the way to APPROVED."
            - "Requests R2 (suite S-300, [2031-12-31, 2036-12-31]), R3 (suite S-300, [2032-01-01, 2036-12-31]) and R4 (suite S-400, [2031-12-31, 2036-12-31]) are each carried to CONSULTATION_PENDING with a CONSENTED consultation, leaving only the approval call to probe."
            - "Every request posts the LEASE_APPROVAL deposit floor of exactly 5,000.00 and an analysis of 9,100,000.00 with versus 9,000,000.00 without, i.e. a margin of 100,000.00 against a required margin of 50,000.00."
          setup_api_calls:
            - call: "POST /special-servicing/trusts"
              payload: { deal_name: "CMBS 2026-L1", closing_date: "2026-01-15T00:00:00Z", original_controlling_class_balance_usd: 40000000 }
