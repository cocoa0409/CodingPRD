  - section: cross_cutting_complexity_layers
    instances:
      - name: occ_budget_create_rejects_the_stale_association_and_the_refreshed_retry_succeeds
        claim_type: optimistic_concurrency
        grounds:
          - complexity_profile.concurrency_rules[budget-create-stale-association]
          - errors[ERR_STALE_ASSOCIATION_VERSION]
          - validations[priority 8]
        distinguishing_aspect: "The token is a version, not a timestamp: a PATCH that only touches reserve_balance_cents still bumps Association.version, so the pre-PATCH token yields 412 ERR_STALE_ASSOCIATION_VERSION on POST /associations/{id}/budgets while re-reading and resending the same body succeeds — and every write increments the version by exactly 1."
        test_recipe:
          setup:
            - "An association with one unit; the client captured version V0, then a PATCH bumped it to V1."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              as: CommunityManager
              payload: { current_utc: "2026-08-01T00:00:00Z" }
            - call: "POST /associations"
              as: CommunityManager
              payload: { legal_name: "Harbor Point Condominium Association" }
              captures: { assoc: "$.data.id", v_create: "$.data.version" }
            - call: "POST /associations/${assoc}/owners"
              as: CommunityManager
              payload: { full_name: "Owen Pratt", email: "owen@example.com" }
              captures: { owner1: "$.data.id" }
            - call: "POST /associations/${assoc}/units"
              as: CommunityManager
              payload: { current_owner_id: "${owner1}", unit_label: "101", interest_bp: 10000, heated_sqft: 1000 }
              captures: { unit1: "$.data.id" }
            - call: "GET /associations/${assoc}"
              as: CommunityManager
              captures: { stale_v: "$.data.version" }
            - call: "PATCH /associations/${assoc}"
              as: CommunityManager
              payload: { reserve_balance_cents: 3500000 }
              captures: { fresh_v: "$.data.version" }
          trigger:
            - call: "POST /associations/${assoc}/budgets"
              as: CommunityManager
              payload: { fiscal_year: 2026, operating_total_cents: 12000000, reserve_contribution_cents: 1200000, expected_association_version: "${stale_v}" }
              captures: { err: "$.data.error_id" }
          assert:
            - "HTTP 412"
            - "data.error_id == \"ERR_STALE_ASSOCIATION_VERSION\""
            - "GET /budgets with association_id=${assoc} returns total_count == 0"
            - "${fresh_v} == ${stale_v} + 1, and the unit creation had already advanced the version above ${v_create} — every write increments by exactly 1"
            - "resending the identical body with expected_association_version ${fresh_v} returns HTTP 201 in status \"DRAFT\" with assessment_total_cents == 0"

      - name: occ_unit_version_advances_when_a_rival_certificate_request_supersedes_the_first
        claim_type: optimistic_concurrency
        grounds:
          - complexity_profile.concurrency_rules[resale-cert-create-stale-unit]
          - errors[ERR_STALE_UNIT_VERSION]
          - state_machines.ResaleCertificate.transitions.REQUESTED_to_VOIDED
        distinguishing_aspect: "The rival-writer scenario the OCC rule exists for: agent B's fresh request voids agent A's REQUESTED certificate AND bumps Unit.version, so agent A's follow-on request with the version it read before B is 412 — the void is what invalidates the token, no ledger movement is needed."
        test_recipe:
          setup:
            - "One 10000 bp unit; agent A captured the unit version and filed a request; agent B then filed a second request from a freshly read version."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              as: CommunityManager
              payload: { current_utc: "2026-08-01T00:00:00Z" }
            - call: "POST /associations"
              as: CommunityManager
              payload: { legal_name: "Harbor Point Condominium Association" }
              captures: { assoc: "$.data.id" }
            - call: "POST /associations/${assoc}/owners"
              as: CommunityManager
              payload: { full_name: "Owen Pratt", email: "owen@example.com" }
              captures: { owner1: "$.data.id" }
            - call: "POST /associations/${assoc}/units"
              as: CommunityManager
              payload: { current_owner_id: "${owner1}", unit_label: "101", interest_bp: 10000, heated_sqft: 1000 }
              captures: { unit1: "$.data.id" }
            - call: "GET /units/${unit1}"
              as: TitleAgent
              captures: { v_a: "$.data.version" }
            - call: "POST /units/${unit1}/resale-certificates"
              as: TitleAgent
              payload: { closing_date: "2026-10-05T00:00:00Z", requesting_agent_id: "33333333-3333-4333-8333-333333333333", expected_unit_version: "${v_a}" }
              captures: { cert_a: "$.data.id" }
            - call: "GET /units/${unit1}"
              as: TitleAgent
              captures: { v_b: "$.data.version" }
            - call: "POST /units/${unit1}/resale-certificates"
              as: TitleAgent
              payload: { closing_date: "2026-10-12T00:00:00Z", requesting_agent_id: "44444444-4444-4444-8444-444444444444", expected_unit_version: "${v_b}" }
              captures: { cert_b: "$.data.id" }
          trigger:
            - call: "POST /units/${unit1}/resale-certificates"
              as: TitleAgent
              payload: { closing_date: "2026-10-19T00:00:00Z", requesting_agent_id: "33333333-3333-4333-8333-333333333333", expected_unit_version: "${v_b}" }
              captures: { err: "$.data.error_id" }
          assert:
            - "HTTP 412"
            - "data.error_id == \"ERR_STALE_UNIT_VERSION\""
            - "GET /resale-certificates with unit_id=${unit1} returns total_count == 2: ${cert_a} \"VOIDED\" and ${cert_b} \"REQUESTED\""
            - "the voided ${cert_a} carries requires_reissue == true and no fee row exists yet for either request (GET /ledger-entries with unit_id=${unit1} returns total_count == 0)"
            - "re-reading GET /units/${unit1} and resending with that version returns HTTP 201, which in turn voids ${cert_b}"

      - name: occ_work_order_create_reads_committed_cents_through_the_contract_version
        claim_type: optimistic_concurrency
        grounds:
          - complexity_profile.concurrency_rules[work-order-create-stale-contract]
          - errors[ERR_STALE_CONTRACT_VERSION]
          - calculations.contract_encumbrance
        distinguishing_aspect: "Encumbrance and OCC are coupled: the first order moves committed_cents 0 -> 600000 and bumps the contract version, so a second order sized from the pre-encumbrance view is 412 ERR_STALE_CONTRACT_VERSION rather than a cap error — the retry with the fresh version then succeeds at committed 900000 of the 1000000 cap."
