          difference is the incoming event's start time: against a 255-minute window the planned
          355-minute turnaround loses first and the answer is ERR_TURNAROUND_WINDOW_INSUFFICIENT
          (priority 74), while against a 735-minute window the temporal rule is satisfied and the
          very same crew figure finally surfaces as ERR_CREW_CAP_EXCEEDED (priority 80) — and the
