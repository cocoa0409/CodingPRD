  - rule_id: cascading_side_effects
    instances:

      - name: cascade_complete_treatment_fans_out_to_three_targets
        grounds:
          - state_machines.Enrollment.ACTIVE_TREATMENT_to_SURVIVORSHIP
          - state_machines.SiblingSupportService.ACTIVE_to_COMPLETED
          - entities.ClinicalProtocol.fields.enrolled_count
          - entities.Enrollment.fields.status
        distinguishing_aspect: "The terminal treatment action fans out to three separate targets in one request: the enrollment closes, a sibling service auto-completes, and a derived counter on the protocol drops, none of them through a second request."
        test_recipe:
