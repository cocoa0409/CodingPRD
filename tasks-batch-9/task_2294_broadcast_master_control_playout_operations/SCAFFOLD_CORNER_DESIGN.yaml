      - name: repeated_calls_are_not_idempotent_and_are_rejected_by_state
        claim_type: Idempotency
        grounds: "§1.2 PlaylistItem (no CUED -> CUED edge), EmergencyOverride (no ACTIVE_CRAWL -> ACTIVE_CRAWL edge), NetworkFeedWindow (no JOINED -> JOINED edge), RegulatoryNotification (refiling a FILED row); §1.4 priority 43 (equal clock value refused)"
        distinguishing_aspect: "None of the action endpoints are replay-safe: an identical second call must fail with the machine's own invalid-state error rather than silently returning the first result, and even the clock refuses an equal value. This separates 'idempotent by design' implementations from the specified strict state machines."
