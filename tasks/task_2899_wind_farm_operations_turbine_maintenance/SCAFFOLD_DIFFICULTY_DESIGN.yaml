              as_user_id: "planner-1"
              captures: { err_lower: $.data.error_id }
            - call: "POST /wind-ops/component-replacements/${r_id}/reserve-crane"
              payload: { crane_mobilization_id: "${c_home_id}" }
              as: MaintenancePlanner
              as_user_id: "planner-1"
          assert:
            - "the first call returns HTTP 422 with ${err_pair} == ERR_LIFT_WIND_LIMIT_EXCEEDED, not ERR_CRANE_FARM_MISMATCH, even though both rules are violated"
            - "the second call returns HTTP 422 with ${err_lower} == ERR_CRANE_FARM_MISMATCH, the only surviving breach once the window is five dates long"
            - "the third call returns HTTP 200 and ComponentReplacement.${r_id}.state == CRANE_RESERVED with crane_mobilization_id ${c_home_id}"
            - "CraneMobilization.${c_short_id}.state and CraneMobilization.${c_long_id}.state are both still REQUESTED with reserved_replacement_count 0, proving neither rejected call mutated a crane"
            - "CraneMobilization.${c_home_id}.state == MOBILIZED with lift_days 2, standby_days 0, billable_days 2, subtotal_cents 8480000, volume_credit_cents 254400 and total_crane_cost_cents 8225600"
      - name: settlement_creation_peels_state_43_then_temporal_60_then_fiscal_74
        grounds:
          - validations[priority=43]
          - validations[priority=60]
          - validations[priority=74]
          - errors.ERR_AGREEMENT_IN_SETTLEMENT
