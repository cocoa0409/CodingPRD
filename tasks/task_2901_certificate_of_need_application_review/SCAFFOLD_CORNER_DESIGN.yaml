              captures: { formula_id: $.data.id }
            - call: "POST /batching-cycles"
              payload: { hsa_id: "${hsa_id}", formula_id: "${formula_id}", service_type: "ACUTE_CARE_BEDS", loi_deadline_at: "2026-08-10T00:00:00Z", application_deadline_at: "2026-08-20T00:00:00Z", comment_period_closes_at: "2026-08-25T00:00:00Z", intervention_deadline_at: "2026-08-28T00:00:00Z", completeness_deadline_at: "2026-09-05T00:00:00Z", decision_deadline_at: "2026-09-30T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { cycle_id: $.data.id, v_created: $.data.version }
            - call: "POST /batching-cycles/${cycle_id}/recompute-need"
              payload: {}
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { v_after_first: $.data.version, unmet_first: $.data.unmet_bed_need_at_open }
          trigger:
            - call: "POST /batching-cycles/${cycle_id}/recompute-need"
              payload: {}
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { v_after_second: $.data.version, unmet_second: $.data.unmet_bed_need_at_open, pin_after: $.data.pinned_formula_version }
          assert:
            - "${v_created} == 1"
            - "${unmet_first} == 19 and ${v_after_first} == 2"
            - "HTTP status == 200"
            - "${unmet_second} == 19 and ${pin_after} == 1"
            - "${v_after_second} == 3 (one bump per call, values unchanged)"
            - "BatchingCycle.${cycle_id}.projected_patient_days == 27375.0000"
            - "BatchingCycle.${cycle_id}.required_beds_final == 89"
            - "BatchingCycle.${cycle_id}.unallocated_bed_need == 19"

