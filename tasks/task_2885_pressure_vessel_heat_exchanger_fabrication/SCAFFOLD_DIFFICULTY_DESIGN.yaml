              payload: {}
              as: QCInspector
              as_user_id: "${qc1_id}"
            - call: "GET /vessel-jobs/${job_id}"
              payload: {}
              as: ShopAdmin
              captures: { count_after_close: $.data.nonconformance_open_count, status_after_close: $.data.status, pct_after_close: $.data.weld_completion_pct }
          assert:
            - "Forward action: the REJECT opens exactly one Nonconformance with ncr_number NCR-J-2885-18-001, source NDE_REJECT, severity MAJOR (joint_category B) and disposition OPEN, taking the job to NDE_HOLD with nonconformance_open_count 1 and weld_completion_pct 0.00"
            - "Count is conserved across the disposition: ${count_after_disposition} == 1 — REPAIR is still a member of {OPEN, REPAIR, USE_AS_IS}, so moving between open states must not change the count"
            - "The repair joint is created with ${wr_generation} == 1 and ${wr_pct} == 100 (repair joints are always fully examined regardless of the parent's rt_extent_declared), inheriting joint_category B, joint_type BUTT, thickness_in 1.5000 and both part ids from ${w1_id}"
            - "Creating and welding the repair joint does NOT change the count: it is still 1 while the job stays NDE_HOLD, even though the job's joint population grew from 1 to 2 — the ledger that is allowed to grow is distinguished from the one that is conserved"
            - "Accepting the repair examination cascades ProductionWeld.${w1_id}.nde_status from REJECTED to ACCEPTED, so ${pct_before_close} == 100.00 with BOTH joints counted, while ${count_before_close} == 1 — the count is released by the close, not by the examination"
            - "Compensating action: after the close ${count_after_close} == 0 and ${status_after_close} == FABRICATION, exactly the state the job held before the rejection — no drift, and the job does not skip ahead to TESTING"
            - "${pct_after_close} == 100.00 is unchanged by the close, and Nonconformance.${ncr_id}.disposition == CLOSED with closed_at set"
            - "The audit trail is preserved rather than rewritten: NDEExam.${ex1_id}.result is still REJECT, ProductionWeld.${wr_id}.repair_of_weld_id == ${w1_id}, and GET /nonconformances?job_id=${job_id} still returns exactly 1 row"
