            - call: "POST /fountain-network/placement-agreements/${ag}/recall-decision"
              payload: { outcome: "RECALL" }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { eid: $.data.error_id }
          assert:
            - "HTTP status == 422"
            - "${eid} == ERR_RECALL_NOT_PERMITTED"
            - "PlacementAgreement.${ag}.recall_exposure_cents == 480000"
            - "PlacementAgreement.${ag}.status == SHORTFALL_REVIEW"
            - "PlacementAgreement.${ag}.recall_decided_by_user_id == null"
            - "DispenserUnit.${du}.status == IN_SERVICE"

      - name: err_term_not_elapsed_before_the_term_end_date
        claim_type: error_triggerable
        grounds:
          - errors[ERR_TERM_NOT_ELAPSED]
          - validations[priority 22]
          - endpoints[POST /fountain-network/placement-agreements/{id}/close-term]
        distinguishing_aspect: "The clock at 2026-08-01 is short of the 2027-01-01 term end, so close-term is 409 ERR_TERM_NOT_ELAPSED and the agreement stays ACTIVE at version 2 rather than expiring early."
        test_recipe:
          setup:
            - "One ACTIVE agreement whose term_end_date is 2027-01-01 while the clock reads 2026-08-01."
          setup_api_calls:
            - call: "POST /fountain-network/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: NetworkAdmin
            - call: "POST /fountain-network/outlets"
              payload: { name: "Riverside Diner", account_code: "OUT-1001", region_code: "R-WEST" }
              as: NetworkAdmin
              captures: { o: $.data.id, ov: $.data.version }
            - call: "POST /fountain-network/placement-agreements"
              payload: { outlet_id: "${o}", term_start_date: "2026-01-01T00:00:00Z", term_end_date: "2027-01-01T00:00:00Z", annual_commitment_gallons: 8000, equipment_value_cents: 480000, expected_outlet_version: "${ov}" }
              as: NetworkAdmin
              captures: { ag: $.data.id }
            - call: "POST /fountain-network/dispenser-units"
              payload: { outlet_id: "${o}", agreement_id: "${ag}", serial_number: "SN-9001", model_code: "FREESTYLE_9100", installed_at: "2025-11-01T00:00:00Z" }
              as: NetworkAdmin
              captures: { du: $.data.id }
            - call: "POST /fountain-network/placement-agreements/${ag}/activate"
              payload: {}
              as: NetworkAdmin
          trigger:
            - call: "POST /fountain-network/placement-agreements/${ag}/close-term"
              payload: {}
              as: NetworkAdmin
              captures: { eid: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "${eid} == ERR_TERM_NOT_ELAPSED"
            - "PlacementAgreement.${ag}.status == ACTIVE"
            - "PlacementAgreement.${ag}.version == 2"
            - "Outlet.${o}.status == ACTIVE"

      - name: err_part_not_on_van_for_an_unstocked_part_sku
        claim_type: error_triggerable
        grounds:
          - errors[ERR_PART_NOT_ON_VAN]
          - validations[priority 25]
          - endpoints[POST /fountain-network/service-calls/{id}/dispatch]
        distinguishing_aspect: "Priority 25 keys on the (van_code, part_sku) pair, not on the part alone: VAN-7 carries PUMP_ASSY_12 but a dispatch reserving GASKET_KIT_04 returns 404 ERR_PART_NOT_ON_VAN, and the call stays OPEN with no van assigned."
        test_recipe:
          setup:
            - "VAN-7 stocked only with PUMP_ASSY_12 (5 units) and one OPEN service call."
          setup_api_calls:
            - call: "POST /fountain-network/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: NetworkAdmin
            - call: "POST /fountain-network/outlets"
              payload: { name: "Riverside Diner", account_code: "OUT-1001", region_code: "R-WEST" }
              as: NetworkAdmin
              captures: { o: $.data.id, ov: $.data.version }
            - call: "POST /fountain-network/placement-agreements"
              payload: { outlet_id: "${o}", term_start_date: "2026-01-01T00:00:00Z", term_end_date: "2027-01-01T00:00:00Z", annual_commitment_gallons: 8000, equipment_value_cents: 480000, expected_outlet_version: "${ov}" }
              as: NetworkAdmin
              captures: { ag: $.data.id }
            - call: "POST /fountain-network/dispenser-units"
              payload: { outlet_id: "${o}", agreement_id: "${ag}", serial_number: "SN-9001", model_code: "FREESTYLE_9100", installed_at: "2025-11-01T00:00:00Z" }
              as: NetworkAdmin
              captures: { du: $.data.id }
            - call: "POST /fountain-network/placement-agreements/${ag}/activate"
              payload: {}
              as: NetworkAdmin
            - call: "POST /fountain-network/van-part-stocks"
              payload: { van_code: "VAN-7", part_sku: "PUMP_ASSY_12", on_van_units: 5 }
              as: NetworkAdmin
              captures: { vp: $.data.id }
            - call: "POST /fountain-network/service-calls"
              payload: { dispenser_unit_id: "${du}", reported_at: "2026-08-01T00:00:00Z", symptom_code: "CO2_LOW" }
              as: NetworkAdmin
              captures: { sc: $.data.id }
          trigger:
            - call: "POST /fountain-network/service-calls/${sc}/dispatch"
              payload: { van_code: "VAN-7", scheduled_window_start: "2026-08-02T09:00:00Z", scheduled_window_end: "2026-08-02T11:00:00Z", part_sku: "GASKET_KIT_04", part_units: 1 }
              as: ServiceTechnician
              as_user_id: "tech-1"
              captures: { eid: $.data.error_id }
          assert:
            - "HTTP status == 404"
            - "${eid} == ERR_PART_NOT_ON_VAN"
            - "ServiceCall.${sc}.status == OPEN"
            - "ServiceCall.${sc}.van_code == null"
            - "ServiceCall.${sc}.reserved_part_stock_id == null"
            - "VanPartStock.${vp}.on_van_units == 5"
            - "VanPartStock.${vp}.reserved_units == 0"

      - name: err_unauthenticated_outranks_the_malformed_body
        claim_type: error_triggerable
        grounds:
          - errors[ERR_UNAUTHENTICATED]
          - validations[priority 1]
          - validations[priority 3]
        distinguishing_aspect: "The create body is also malformed (account_code and region_code are missing), yet the answer is 401 ERR_UNAUTHENTICATED rather than 400 ERR_INVALID_REQUEST, because priority 1 is evaluated before any body parsing."
        test_recipe:
          setup:
            - "One existing outlet; the trigger request is sent with no X-User-Role and no X-User-ID header at all."
          setup_api_calls:
            - call: "POST /fountain-network/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: NetworkAdmin
            - call: "POST /fountain-network/outlets"
              payload: { name: "Riverside Diner", account_code: "OUT-1001", region_code: "R-WEST" }
              as: NetworkAdmin
              captures: { o: $.data.id }
          trigger:
            - call: "POST /fountain-network/outlets"
              payload: { name: "Ghost Diner" }
              captures: { eid: $.data.error_id }
          assert:
            - "HTTP status == 401"
            - "${eid} == ERR_UNAUTHENTICATED"
            - "Outlet.${o}.account_code == \"OUT-1001\""
            - "Outlet.${o}.version == 1"

      - name: err_invalid_request_when_the_pagination_limit_exceeds_the_cap
        claim_type: error_triggerable
        grounds:
          - errors[ERR_INVALID_REQUEST]
          - validations[priority 3]
          - endpoints[GET /fountain-network/outlets]
        distinguishing_aspect: "limit is bounded to 1..100, so limit=101 on an authorised listing is 400 ERR_INVALID_REQUEST rather than a silently clamped page of 100."
        test_recipe:
          setup:
            - "One outlet exists so the listing would otherwise return a row."
          setup_api_calls:
            - call: "POST /fountain-network/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: NetworkAdmin
            - call: "POST /fountain-network/outlets"
              payload: { name: "Riverside Diner", account_code: "OUT-1001", region_code: "R-WEST" }
              as: NetworkAdmin
              captures: { o: $.data.id }
          trigger:
            - call: "GET /fountain-network/outlets?limit=101"
              as: NetworkAdmin
              captures: { eid: $.data.error_id }
          assert:
            - "HTTP status == 400"
            - "${eid} == ERR_INVALID_REQUEST"
            - "Outlet.${o}.version == 1"

  # ==========================================================================
  # §1.9 / rbac — six roles, role_model segregation_of_duties, OutletManager
  # identity entity_backed:Outlet. One denial per role's exclusive surface,
  # the four priority-6 ownership corners, and both X-User-ID separations in
  # their refused AND their permitted form.
  # ==========================================================================
  - section: rbac
    instances:

      - name: rbac_supply_planner_denied_registering_a_supply_item
        claim_type: others_exclusive_operations_denied
        grounds:
          - rbac[NetworkAdmin].exclusive_operations
          - validations[priority 2]
          - errors[ERR_UNAUTHORIZED]
        distinguishing_aspect: "SupplyPlanner owns forecasting and allocation but not the SKU catalogue: creating a SupplyItem is 403 ERR_UNAUTHORIZED even though the same role legally consumes that SKU one call later."
        test_recipe:
          setup:
            - "Empty catalogue; only the clock is pinned."
          setup_api_calls:
            - call: "POST /fountain-network/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: NetworkAdmin
          trigger:
            - call: "POST /fountain-network/supply-items"
              payload: { sku_code: "SKU-COLA", brand_name: "Cola Classic", supply_form: "BAG_IN_BOX", case_pack_units: 4, ounces_per_unit: 2000, national_allocation_units: 100 }
              as: SupplyPlanner
              captures: { eid: $.data.error_id }
          assert:
            - "HTTP status == 403"
            - "${eid} == ERR_UNAUTHORIZED"

      - name: rbac_route_driver_denied_planning_a_replenishment_route
        claim_type: others_exclusive_operations_denied
        grounds:
          - rbac[SupplyPlanner].exclusive_operations
          - validations[priority 2]
          - errors[ERR_UNAUTHORIZED]
        distinguishing_aspect: "RouteDriver executes routes stop by stop but cannot create one: POST /replenishment-routes is 403 ERR_UNAUTHORIZED for the driver role."
        test_recipe:
          setup:
            - "No routes exist."
          setup_api_calls:
            - call: "POST /fountain-network/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: NetworkAdmin
          trigger:
            - call: "POST /fountain-network/replenishment-routes"
              payload: { route_code: "RT-01", depot_region_code: "R-WEST", service_date: "2026-08-03T00:00:00Z", van_code: "VAN-7", capacity_units: 60 }
              as: RouteDriver
              captures: { eid: $.data.error_id }
          assert:
            - "HTTP status == 403"
            - "${eid} == ERR_UNAUTHORIZED"

      - name: rbac_network_admin_denied_arriving_at_a_route_stop
        claim_type: others_exclusive_operations_denied
        grounds:
          - rbac[RouteDriver].exclusive_operations
          - validations[priority 2]
          - validations[priority 9]
        distinguishing_aspect: "The route is still PLANNED, so the driver-only arrive call would also fail the priority-9 state check; the answer is nevertheless 403 ERR_UNAUTHORIZED, proving role evaluation precedes state evaluation, and the stop stays PENDING."
        test_recipe:
          setup:
            - "PLANNED route RT-01 with one PENDING stop at sequence_index 1."
          setup_api_calls:
            - call: "POST /fountain-network/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: NetworkAdmin
            - call: "POST /fountain-network/outlets"
              payload: { name: "Riverside Diner", account_code: "OUT-1001", region_code: "R-WEST" }
              as: NetworkAdmin
              captures: { o: $.data.id }
            - call: "POST /fountain-network/replenishment-routes"
              payload: { route_code: "RT-01", depot_region_code: "R-WEST", service_date: "2026-08-03T00:00:00Z", van_code: "VAN-7", capacity_units: 60 }
              as: SupplyPlanner
              captures: { rt: $.data.id, rtv: $.data.version }
            - call: "POST /fountain-network/replenishment-routes/${rt}/stops"
              payload: { outlet_id: "${o}", sequence_index: 1, window_start: "2026-08-03T09:00:00Z", window_end: "2026-08-03T10:00:00Z", expected_route_version: "${rtv}" }
              as: SupplyPlanner
              captures: { st: $.data.id }
          trigger:
            - call: "POST /fountain-network/route-stops/${st}/arrive"
              payload: {}
              as: NetworkAdmin
              captures: { eid: $.data.error_id }
          assert:
            - "HTTP status == 403"
            - "${eid} == ERR_UNAUTHORIZED"
            - "RouteStop.${st}.status == PENDING"
            - "RouteStop.${st}.version == 1"

      - name: rbac_compliance_officer_denied_dispatching_a_service_call
        claim_type: others_exclusive_operations_denied
        grounds:
          - rbac[ServiceTechnician].exclusive_operations
          - validations[priority 2]
          - errors[ERR_UNAUTHORIZED]
        distinguishing_aspect: "ComplianceOfficer may read the call and owns waivers and recall decisions, but dispatching it is technician-only: 403 ERR_UNAUTHORIZED and the call stays OPEN with no van assigned."
        test_recipe:
          setup:
            - "One OPEN service call on an IN_SERVICE unit."
          setup_api_calls:
            - call: "POST /fountain-network/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: NetworkAdmin
            - call: "POST /fountain-network/outlets"
              payload: { name: "Riverside Diner", account_code: "OUT-1001", region_code: "R-WEST" }
              as: NetworkAdmin
              captures: { o: $.data.id, ov: $.data.version }
            - call: "POST /fountain-network/placement-agreements"
              payload: { outlet_id: "${o}", term_start_date: "2026-01-01T00:00:00Z", term_end_date: "2027-01-01T00:00:00Z", annual_commitment_gallons: 8000, equipment_value_cents: 480000, expected_outlet_version: "${ov}" }
              as: NetworkAdmin
              captures: { ag: $.data.id }
            - call: "POST /fountain-network/dispenser-units"
              payload: { outlet_id: "${o}", agreement_id: "${ag}", serial_number: "SN-9001", model_code: "FREESTYLE_9100", installed_at: "2025-11-01T00:00:00Z" }
              as: NetworkAdmin
              captures: { du: $.data.id }
            - call: "POST /fountain-network/placement-agreements/${ag}/activate"
              payload: {}
              as: NetworkAdmin
            - call: "POST /fountain-network/service-calls"
              payload: { dispenser_unit_id: "${du}", reported_at: "2026-08-01T00:00:00Z", symptom_code: "LEAK" }
              as: NetworkAdmin
              captures: { sc: $.data.id }
          trigger:
            - call: "POST /fountain-network/service-calls/${sc}/dispatch"
              payload: { van_code: "VAN-7", scheduled_window_start: "2026-08-02T09:00:00Z", scheduled_window_end: "2026-08-02T11:00:00Z" }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { eid: $.data.error_id }
          assert:
            - "HTTP status == 403"
            - "${eid} == ERR_UNAUTHORIZED"
            - "ServiceCall.${sc}.status == OPEN"
            - "ServiceCall.${sc}.van_code == null"
            - "ServiceCall.${sc}.version == 1"

      - name: rbac_service_technician_denied_placing_a_compliance_hold
        claim_type: others_exclusive_operations_denied
        grounds:
          - rbac[ComplianceOfficer].exclusive_operations
          - validations[priority 2]
          - endpoints[POST /fountain-network/outlets/{id}/compliance-hold]
        distinguishing_aspect: "The technician may put a single unit on SERVICE_HOLD but not the whole outlet on compliance hold: 403 ERR_UNAUTHORIZED leaves open_compliance_hold_count 0 and the posture OPEN."
        test_recipe:
          setup:
            - "One ACTIVE outlet with posture OPEN and both counters 0."
          setup_api_calls:
            - call: "POST /fountain-network/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: NetworkAdmin
            - call: "POST /fountain-network/outlets"
              payload: { name: "Riverside Diner", account_code: "OUT-1001", region_code: "R-WEST" }
              as: NetworkAdmin
              captures: { o: $.data.id }
          trigger:
            - call: "POST /fountain-network/outlets/${o}/compliance-hold"
              payload: { action: "PLACE", hold_reason_code: "SANITATION_LAPSE" }
              as: ServiceTechnician
              as_user_id: "tech-1"
              captures: { eid: $.data.error_id }
          assert:
            - "HTTP status == 403"
            - "${eid} == ERR_UNAUTHORIZED"
            - "Outlet.${o}.open_compliance_hold_count == 0"
            - "Outlet.${o}.last_hold_placed_by_user_id == null"
            - "Outlet.${o}.service_posture == OPEN"
            - "Outlet.${o}.version == 1"

      - name: rbac_supply_planner_denied_acknowledging_a_position_alert
        claim_type: others_exclusive_operations_denied
        grounds:
          - rbac[OutletManager].exclusive_operations
          - validations[priority 2]
          - endpoints[POST /fountain-network/supply-positions/{id}/acknowledge-alert]
        distinguishing_aspect: "acknowledge-alert is the OutletManager's single exclusive write; the SupplyPlanner who created the position is still 403 ERR_UNAUTHORIZED and alert_acknowledged_by_user_id stays null."
        test_recipe:
          setup:
            - "One position for (OUT-1001, SKU-COLA) with on_hand_units 2."
          setup_api_calls:
            - call: "POST /fountain-network/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: NetworkAdmin
            - call: "POST /fountain-network/outlets"
              payload: { name: "Riverside Diner", account_code: "OUT-1001", region_code: "R-WEST" }
              as: NetworkAdmin
              captures: { o: $.data.id }
            - call: "POST /fountain-network/supply-items"
              payload: { sku_code: "SKU-COLA", brand_name: "Cola Classic", supply_form: "BAG_IN_BOX", case_pack_units: 4, ounces_per_unit: 2000, national_allocation_units: 100 }
              as: NetworkAdmin
              captures: { si: $.data.id }
            - call: "POST /fountain-network/supply-positions"
              payload: { outlet_id: "${o}", supply_item_id: "${si}", on_hand_units: 2 }
              as: SupplyPlanner
              captures: { sp: $.data.id }
          trigger:
            - call: "POST /fountain-network/supply-positions/${sp}/acknowledge-alert"
              payload: {}
              as: SupplyPlanner
              captures: { eid: $.data.error_id }
          assert:
            - "HTTP status == 403"
            - "${eid} == ERR_UNAUTHORIZED"
            - "OutletSupplyPosition.${sp}.alert_acknowledged_by_user_id == null"
            - "OutletSupplyPosition.${sp}.version == 1"

      - name: rbac_outlet_manager_acknowledges_its_own_position_alert
        claim_type: own_operations_allowed
        grounds:
          - rbac[OutletManager].identity
          - endpoints[POST /fountain-network/supply-positions/{id}/acknowledge-alert]
          - validations[priority 6]
        distinguishing_aspect: "With X-User-ID equal to the position's outlet_id the acknowledgement succeeds: alert_acknowledged_by_user_id becomes that outlet id and the position version goes 1 -> 2, which is the positive half of the priority-6 ownership rule."
        test_recipe:
          setup:
            - "One position for (OUT-1001, SKU-COLA); the acting OutletManager's X-User-ID is that outlet's id."
          setup_api_calls:
            - call: "POST /fountain-network/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: NetworkAdmin
            - call: "POST /fountain-network/outlets"
              payload: { name: "Riverside Diner", account_code: "OUT-1001", region_code: "R-WEST" }
              as: NetworkAdmin
              captures: { o: $.data.id }
            - call: "POST /fountain-network/supply-items"
              payload: { sku_code: "SKU-COLA", brand_name: "Cola Classic", supply_form: "BAG_IN_BOX", case_pack_units: 4, ounces_per_unit: 2000, national_allocation_units: 100 }
              as: NetworkAdmin
              captures: { si: $.data.id }
            - call: "POST /fountain-network/supply-positions"
              payload: { outlet_id: "${o}", supply_item_id: "${si}", on_hand_units: 2 }
              as: SupplyPlanner
              captures: { sp: $.data.id }
          trigger:
            - call: "POST /fountain-network/supply-positions/${sp}/acknowledge-alert"
              payload: {}
              as: OutletManager
              as_user_id: "${o}"
          assert:
            - "HTTP status == 200"
            - "OutletSupplyPosition.${sp}.alert_acknowledged_by_user_id == \"${o}\""
            - "OutletSupplyPosition.${sp}.version == 2"
            - "OutletSupplyPosition.${sp}.on_hand_units == 2"

      - name: rbac_outlet_manager_denied_acknowledging_another_outlets_position
        claim_type: others_exclusive_operations_denied
        grounds:
          - validations[priority 6]
          - errors[ERR_OUTLET_OWNERSHIP_REQUIRED]
          - rbac[OutletManager].identity
        distinguishing_aspect: "The role is correct and the position exists, but X-User-ID resolves to a different outlet, so the answer is 403 ERR_OUTLET_OWNERSHIP_REQUIRED (not ERR_UNAUTHORIZED) and the acknowledgement is not recorded."
        test_recipe:
          setup:
            - "Two outlets; the position belongs to OUT-1001 while the acting manager's X-User-ID is the id of OUT-1002."
          setup_api_calls:
            - call: "POST /fountain-network/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: NetworkAdmin
            - call: "POST /fountain-network/outlets"
              payload: { name: "Riverside Diner", account_code: "OUT-1001", region_code: "R-WEST" }
              as: NetworkAdmin
              captures: { o: $.data.id }
            - call: "POST /fountain-network/outlets"
              payload: { name: "Eastside Grill", account_code: "OUT-1002", region_code: "R-EAST" }
              as: NetworkAdmin
              captures: { o2: $.data.id }
            - call: "POST /fountain-network/supply-items"
              payload: { sku_code: "SKU-COLA", brand_name: "Cola Classic", supply_form: "BAG_IN_BOX", case_pack_units: 4, ounces_per_unit: 2000, national_allocation_units: 100 }
              as: NetworkAdmin
              captures: { si: $.data.id }
            - call: "POST /fountain-network/supply-positions"
              payload: { outlet_id: "${o}", supply_item_id: "${si}", on_hand_units: 2 }
              as: SupplyPlanner
              captures: { sp: $.data.id }
          trigger:
            - call: "POST /fountain-network/supply-positions/${sp}/acknowledge-alert"
              payload: {}
              as: OutletManager
              as_user_id: "${o2}"
              captures: { eid: $.data.error_id }
          assert:
            - "HTTP status == 403"
            - "${eid} == ERR_OUTLET_OWNERSHIP_REQUIRED"
            - "OutletSupplyPosition.${sp}.alert_acknowledged_by_user_id == null"
            - "OutletSupplyPosition.${sp}.version == 1"

      - name: rbac_outlet_manager_denied_reading_another_outlets_brand_mix_report
        claim_type: others_exclusive_operations_denied
        grounds:
          - validations[priority 6]
          - errors[ERR_OUTLET_OWNERSHIP_REQUIRED]
          - endpoints[GET /fountain-network/outlets/{id}/brand-mix-report]
        distinguishing_aspect: "The ownership rule also guards a pure read: an OutletManager whose X-User-ID is OUT-1002 cannot pull OUT-1001's brand-mix report, so no report body is returned at all."
        test_recipe:
          setup:
            - "Two outlets and no telemetry; the manager acts with the id of the wrong outlet."
          setup_api_calls:
            - call: "POST /fountain-network/_clock/set_current_utc"
