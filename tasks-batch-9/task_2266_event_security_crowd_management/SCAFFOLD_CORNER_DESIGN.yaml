      No transition in this §1.2 is declared idempotent, and APPROVE is the one action where a retry would be most tempting to swallow because it is also a cascade trigger: replaying it must be REJECTED rather than re-run, and the claim is that neither the assessment version, the approver of record, nor the cascaded event version moves on the replay.
