            - { call: "POST /properties/${lot1}/secure-ashore", payload: { storage_site_id: "${site_id}" }, as: SalvageMaster, as_user_id: "sm-01" }
            - { call: "POST /properties/${lot1}/survey", payload: { verified_value_cents: 5000000 }, as: MarineSurveyor, as_user_id: "surveyor-02" }
            - { call: "POST /properties/${lot1}/verify-value", payload: {}, as: OperationsDirector, as_user_id: "opsdir-01" }
          trigger:
            - { call: "POST /properties/${lot1}/dispose", payload: { method: SCRAP, tonnes: 25 }, as: SalvageMaster, as_user_id: "sm-01", captures: { ic1: $.data.in_custody_tonnes, cu1: $.data.custody_status } }
            - { call: "POST /properties/${lot1}/dispose", payload: { method: SCRAP, tonnes: 40 }, as: SalvageMaster, as_user_id: "sm-01", captures: { ic2: $.data.in_custody_tonnes, cu2: $.data.custody_status } }
            - { call: "POST /properties/${lot1}/dispose", payload: { method: SCRAP, tonnes: 35 }, as: SalvageMaster, as_user_id: "sm-01", captures: { ic3: $.data.in_custody_tonnes, cu3: $.data.custody_status } }
          assert:
            - "After 25t: disposed_tonnes == 25 and in_custody_tonnes == 75 and custody_status == SECURED_ASHORE (partial — not terminal)"
            - "After 40t: disposed_tonnes == 65 and in_custody_tonnes == 35 and custody_status == SECURED_ASHORE"
            - "After 35t: disposed_tonnes == 100 and in_custody_tonnes == 0 and custody_status == DISPOSED (zeroing call's method wins)"
            - "Invariant at every step: quantity_tonnes 100 == redelivered_tonnes + sold_tonnes + disposed_tonnes + in_custody_tonnes"
