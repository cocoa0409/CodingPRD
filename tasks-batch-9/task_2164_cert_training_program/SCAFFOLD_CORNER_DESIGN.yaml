          - validations[priority=20]
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: |
          Invalid-transition claim: CANCELLED is terminal for ClassSession, so a second cancel finds no declared (CANCELLED, CANCELLED) edge and returns 409 ERR_INVALID_STATE with no further side effects.
