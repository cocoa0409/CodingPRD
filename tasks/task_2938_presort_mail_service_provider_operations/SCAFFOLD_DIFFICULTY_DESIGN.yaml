            - call: "POST /commingle-batches/${batch_id}/members"
              payload: { mail_job_id: "${job_a_id}" }
              as: PresortOperator
            - call: "POST /commingle-batches/${batch_id}/members"
              payload: { mail_job_id: "${job_b_id}" }
