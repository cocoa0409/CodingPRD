    path: "/catalog/licensing-deals/{deal_id}"
    description: "Read a LicensingDeal"
    roles: [CatalogAdmin, CatalogAnalyst]
    code: 200
    input: ["compensation_view?"]
    output: LicensingDeal
    side_effects: ["payable_compensation_cents recomputed; compensation_view defaults to LEDGER and may be asked for as STATEMENT to expose the per-month share variant"]

  - method: GET
    path: "/catalog/licensing-deals"
    description: "List LicensingDeals, optionally filtered by publisher, title or status"
    roles: [CatalogAdmin, CatalogAnalyst]
    code: 200
    input: ["publisher_id?", "title_id?", "status?", "limit?", "offset?"]
    output: "LicensingDeal[]"
    side_effects: []

  - method: POST
    path: "/catalog/licensing-deals/{deal_id}/sign"
    description: "Sign a DRAFT LicensingDeal; optimistic concurrency on the licensing Title"
    roles: [CatalogAdmin]
    code: 200
    input: [expected_title_version]
    output: LicensingDeal
    side_effects:
      - "status becomes SIGNED"
      - "signed_at set to the logical clock"
      - "compensation_floor_cents recomputed"
      - "payable_compensation_cents recomputed"
      - "Publisher.lifetime_licensing_cost_cents recomputed"
      - "Publisher.deal_count recomputed"
      - "increments Title.version by 1"

  - method: POST
    path: "/catalog/licensing-deals/{deal_id}/renew"
    description: "Extend the term of an EXPIRING deal before its end date, reverting REMOVING entries to ADDED"
    roles: [CatalogAdmin]
    code: 200
    input: [renew_term_end_date]
    output: LicensingDeal
    side_effects:
      - "term_end_date extended and removal_effective_date recomputed as term_end_date - 2 days"
      - "every CatalogEntry of this deal with status REMOVING reverts to ADDED"
      - "compensation_floor_cents recomputed; Publisher.lifetime_licensing_cost_cents recomputed"

  # --- CatalogEntry ---
  - method: POST
    path: "/catalog/catalog-entries"
