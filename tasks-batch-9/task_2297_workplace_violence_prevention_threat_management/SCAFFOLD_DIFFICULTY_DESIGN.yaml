    instances:
      - name: escort_double_booking_blocked_by_thirty_minute_symmetric_buffer
        grounds:
          - validations[priority=46]
          - errors[ERR_ESCORT_DOUBLE_BOOKED]
          - entities.CaseAction.fields.escort_employee_id
          - entities.Employee.fields.escort_committed_minutes
          - endpoints[POST /case-actions]
        distinguishing_aspect: |
          Interval semantics: a symmetric 30-minute travel buffer on the Employee resource. The
          stored escort [08:00, 12:00) occupies the buffered interval [07:30, 12:30), so a request at
          [12:20, 14:00) is rejected even though the raw intervals are disjoint, while a request at
          [13:00, 14:00) is accepted because its buffered interval [12:30, 14:30) only touches the
