            - call: "POST /scheduling/review-capacity-windows"
              payload: { reviewer_staff_id: "${m1_id}", week_start_date: "2026-08-03", review_capacity_hours: 10.00 }
              as: FirmAdmin
          assert:
            - "first trigger: HTTP 422 and ${err_id} == 'ERR_NOT_WEEK_START'"
            - "second trigger: HTTP 201 with week_start_date == '2026-08-03', committed_review_hours == 0.00, remaining_review_hours == 10.00"

