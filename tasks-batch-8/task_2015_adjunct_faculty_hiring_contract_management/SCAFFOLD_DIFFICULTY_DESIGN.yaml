            - call: "POST /adjunct-hr/sections"
              payload: { department_id: "${dept_id}", term_code: "2026FA", course_code: "ECO-201", section_code: "01", weekly_contact_hours: 3.0, credit_hours: 3, enrollment: 30, min_enrollment: 5 }
              as: DepartmentChair
              captures: { sec_b: $.data.id }
            - call: "GET /adjunct-hr/faculty/${faculty_id}"
