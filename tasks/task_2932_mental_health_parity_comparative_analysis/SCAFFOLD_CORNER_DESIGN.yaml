            - call: "POST /parity/plan-years/${py_id}/classifications"
              payload: { benefit_category: "PRESCRIPTION_DRUGS", network_tier: "NOT_APPLICABLE", measurement_period_start: "2026-01-01", measurement_period_end: "2026-06-30", mh_su_benefits_covered: false }
