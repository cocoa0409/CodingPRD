  # ===========================================================================
  - section: roles
    instances:

      - name: ahj_authority_for_other_jurisdiction_cannot_decide_returns_forbidden
        claim_type: violation_to_error
        grounds:
          - roles.AHJAuthority
          - validations[priority=3]
          - errors[ERR_FORBIDDEN]
        distinguishing_aspect: "The AHJAuthority role is entity-backed by Jurisdiction: an AHJ acting under jurisdiction E's id cannot decide acceptance for an installation whose site jurisdiction is D — 403 ERR_FORBIDDEN."
        test_recipe:
          setup: ["Clock at 2026-09-01. Jurisdictions J-E and J-DIR; field evaluation (site J-DIR) evaluated PASS."]
          setup_api_calls:
            - *c_clock
            - *c_std
            - *c_mfr
            - *c_jur_e
            - *c_jur_dir
            - *c_fe
            - call: "POST /certification/field-evaluations/${fe_id}/evaluate"
              payload: { outcome: "PASS" }
              as: TestEngineer
              as_user_id: "eng-1"
          trigger:
            - call: "POST /certification/field-evaluations/${fe_id}/decide-acceptance"
              payload: { decision: "ACCEPT" }
              as: AHJAuthority
              as_user_id: "${jur_e}"
              captures: { err_id: $.data.error_id }
          assert:
            - "response status 403 and error_id == ERR_FORBIDDEN"
            - "FieldEvaluation.${fe_id}.acceptance_status == PENDING (no decision recorded)"

      - name: manufacturer_rep_cannot_suspend_certification_returns_unauthorized
        claim_type: violation_to_error
        grounds:
          - roles.ComplianceOfficer
          - errors[ERR_UNAUTHORIZED_ROLE]
        distinguishing_aspect: "Suspension is exclusive to ComplianceOfficer; the certified manufacturer itself cannot suspend its own certification — 403 ERR_UNAUTHORIZED_ROLE."
        test_recipe:
          setup: ["Clock at 2026-09-01. Canonical certified setup."]
          setup_api_calls:
            - *c_clock
            - *c_std
            - *c_mfr
            - *c_fac
            - *c_proj
            - *c_cr
            - *c_samp1
            - *c_acc1
            - *c_res1
            - *c_res2
            - *c_decide
            - *c_getcert
          trigger:
            - call: "POST /certification/certifications/${cert_id}/suspend"
              payload: { reason: "Self-suspension attempt" }
              as: ManufacturerRep
              as_user_id: "${mfr_id}"
              captures: { err_id: $.data.error_id }
          assert:
            - "response status 403 and error_id == ERR_UNAUTHORIZED_ROLE"
            - "Certification.${cert_id}.status == ACTIVE (untouched)"

  # ===========================================================================
  - section: cross_cutting_complexity_layers
    instances:

      - name: occ_stale_project_version_on_construction_record_returns_412
        claim_type: occ_stale_version
        grounds:
          - concurrency_rules[construction-record-supersede-stale-project]
          - errors[ERR_STALE_VERSION]
        distinguishing_aspect: "After CR revision 1 bumps the project version to 2, a second create carrying the stale expected_project_version 1 is 412 ERR_STALE_VERSION; replaying with the freshly observed version 2 succeeds and freezes revision 2."
        test_recipe:
          setup: ["Clock at 2026-09-01. Canonical project (version 1 at creation); construction-record revision 1 created with the correct version."]
          setup_api_calls:
            - *c_clock
            - *c_std
            - *c_mfr
            - *c_fac
            - *c_proj
            - *c_cr
            - call: "GET /certification/projects/${proj_id}"
              payload: {}
              as: ComplianceOfficer
              captures: { proj_v2: $.data.version }
          trigger:
            - call: "POST /certification/projects/${proj_id}/construction-records"
              payload: { components: [{ slot: "enclosure", component_name: "BayBlend FR3010", material: "PC/ABS", part_number: "BB-FR3010", rating: "V-0" }, { slot: "power_supply", component_name: "MeanWell RS-35", material: "n/a", part_number: "MW-RS-35", rating: "100-240VAC" }], expected_project_version: "${proj_v}" }
              as: ManufacturerRep
              as_user_id: "${mfr_id}"
              captures: { err_id: $.data.error_id }
            - call: "POST /certification/projects/${proj_id}/construction-records"
              payload: { components: [{ slot: "enclosure", component_name: "BayBlend FR3010", material: "PC/ABS", part_number: "BB-FR3010", rating: "V-0" }, { slot: "power_supply", component_name: "MeanWell RS-35", material: "n/a", part_number: "MW-RS-35", rating: "100-240VAC" }], expected_project_version: "${proj_v2}" }
              as: ManufacturerRep
              as_user_id: "${mfr_id}"
              captures: { cr2_id: $.data.id }
          assert:
            - "the stale call (${proj_v} == 1 while project.version == 2) -> 412 and error_id == ERR_STALE_VERSION"
            - "the replay with ${proj_v2} == 2 -> 201; ConstructionRecord.${cr2_id}.revision_no == 2 and status == FROZEN"
            - "CertificationProject.${proj_id}.version == 3 after the successful create (each mutation bumps by exactly 1)"
            - "revision 1 is SUPERSEDED in the construction-records list"

      - name: occ_stale_certification_version_checked_before_state_returns_412
        claim_type: occ_stale_version
        grounds:
          - concurrency_rules[substitution-implement-stale-certification]
          - validations[priority=5]
          - errors[ERR_STALE_VERSION]
        distinguishing_aspect: "OCC (priority 5) runs before state checks (priority 6): implementing with a stale expected_certification_version against a SUSPENDED certification returns 412 ERR_STALE_VERSION, not ERR_CERTIFICATION_NOT_ACTIVE."
        test_recipe:
          setup: ["Clock at 2026-09-01. Canonical certified setup; substitution created and APPROVED; certification then suspended (version 1 -> 2)."]
          setup_api_calls:
            - *c_clock
            - *c_std
            - *c_mfr
            - *c_fac
            - *c_proj
            - *c_cr
            - *c_samp1
            - *c_acc1
            - *c_res1
            - *c_res2
            - *c_decide
            - *c_getcert
            - call: "POST /certification/certifications/${cert_id}/substitution-requests"
              payload: { slot: "power_supply", proposed_component: { component_name: "MeanWell RS-25-PRO", material: "n/a", part_number: "MW-RS-25-PRO", rating: "100-240VAC" }, rationale: "Original PSU discontinued" }
              as: ManufacturerRep
              as_user_id: "${mfr_id}"
              captures: { sub_id: $.data.id }
            - call: "POST /certification/substitution-requests/${sub_id}/decide"
              payload: { outcome: "APPROVE" }
              as: CertificationReviewer
              as_user_id: "rev-1"
            - call: "POST /certification/certifications/${cert_id}/suspend"
              payload: { reason: "Surveillance hold" }
              as: ComplianceOfficer
          trigger:
            - call: "POST /certification/substitution-requests/${sub_id}/implement"
              payload: { expected_certification_version: "${cert_v}" }
              as: ManufacturerRep
              as_user_id: "${mfr_id}"
              captures: { err_id: $.data.error_id }
          assert:
            - "error_id == ERR_STALE_VERSION with http status 412 (${cert_v} == 1 while certification.version == 2 after the suspend)"
            - "the certification is also SUSPENDED, so this proves the OCC check precedes the state check"
            - "SubstitutionRequest.${sub_id}.status == APPROVED (unchanged)"

  # ===========================================================================
  - section: consistency_model
    instances:

