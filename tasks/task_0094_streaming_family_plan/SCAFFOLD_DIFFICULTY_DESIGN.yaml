  # =====================================================================
  # Rule 9 — Compensating-action invariants across different conserved quantities
  # =====================================================================
  - rule_id: compensating_invariant
    instances:
      - name: invite_hold_release_conserves_wallet_money
        grounds:
          - state_machines.Invite.PENDING_to_DECLINED
          - entities.Invite.fields.hold_amount_cents
          - entities.Account.fields.wallet_credit_cents
        distinguishing_aspect: "Conserved quantity = MONEY (Account.wallet_credit_cents): send (debit hold) followed by its compensating decline (release hold) leaves wallet_credit_cents exactly equal to the pre-send balance; invariant pinned as wallet_after_decline == wallet_before_send."
        test_recipe:
          setup:
            - "ACTIVE account with wallet 10000; send one invite (debits the per-seat hold), then decline it."
          setup_api_calls:
            - call: "POST /subscription-plans"
              payload: { tier: "PREMIUM", monthly_fee_cents: 1000, max_profiles: 6, concurrent_stream_cap: 4, max_registered_devices: 8, download_quota_per_profile: 10, ad_free: true, hd_offline_allowed: true }
              as: PlatformAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /accounts"
              payload: { plan_id: "${plan_id}", owner_email: "owner17@x.com", billing_anchor_day: 1, initial_credit_cents: 10000 }
              as: AccountOwner
              captures: { acct_id: $.data.id }
            - call: "POST /invites"
              payload: { account_id: "${acct_id}", invitee_email: "c@x.com" }
              as: AccountOwner
              as_user_id: "${acct_id}"
              captures: { inv_id: $.data.id, tok: $.data.token, hold: $.data.hold_amount_cents }
          trigger:
            - call: "POST /invites/${inv_id}/decline"
              payload: { token: "${tok}" }
              as: Anonymous
            - call: "GET /accounts/${acct_id}"
              as: AccountOwner
              as_user_id: "${acct_id}"
              captures: { wallet_after: $.data.wallet_credit_cents }
          assert:
            - "Account.${acct_id}.wallet_credit_cents == 10000  # send debit fully reversed by decline release"

      - name: download_delete_conserves_profile_quota_slots
        grounds:
          - state_machines.Download.READY_to_DELETED
          - entities.SubscriptionPlan.fields.download_quota_per_profile
          - validations[priority=16]
        distinguishing_aspect: "Conserved quantity = QUOTA SLOTS (count of {DOWNLOADING,READY} Downloads per Profile): a create (consume one slot) paired with its compensating delete (free one slot) returns the profile's used-slot count to its pre-create value, proven by re-running create to the cap an equal number of times."
        test_recipe:
          setup:
            - "Plan download_quota_per_profile=2; profile creates two downloads (full), deletes one, then creates one more."
          setup_api_calls:
            - call: "POST /subscription-plans"
              payload: { tier: "AD_FREE", monthly_fee_cents: 800, max_profiles: 4, concurrent_stream_cap: 2, max_registered_devices: 4, download_quota_per_profile: 2, ad_free: true, hd_offline_allowed: false }
              as: PlatformAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /titles"
              payload: { name: "A", maturity_rating: "G", runtime_minutes: 40, downloadable: true, license_size_mb: 250 }
              as: PlatformAdmin
              captures: { ta: $.data.id }
            - call: "POST /titles"
              payload: { name: "B", maturity_rating: "G", runtime_minutes: 40, downloadable: true, license_size_mb: 250 }
              as: PlatformAdmin
              captures: { tb: $.data.id }
            - call: "POST /titles"
              payload: { name: "C", maturity_rating: "G", runtime_minutes: 40, downloadable: true, license_size_mb: 250 }
              as: PlatformAdmin
              captures: { tc: $.data.id }
            - call: "POST /accounts"
              payload: { plan_id: "${plan_id}", owner_email: "owner18@x.com", billing_anchor_day: 1, initial_credit_cents: 0 }
              as: AccountOwner
              captures: { acct_id: $.data.id }
            - call: "POST /profiles"
              payload: { account_id: "${acct_id}", display_name: "P", kind: "ADULT" }
              as: AccountOwner
              as_user_id: "${acct_id}"
              captures: { prof_id: $.data.id }
            - call: "POST /devices"
              payload: { account_id: "${acct_id}", device_label: "Tab", platform: "TABLET", supports_hd: false }
              as: AccountOwner
              as_user_id: "${acct_id}"
              captures: { dev_id: $.data.id }
            - call: "POST /downloads"
              payload: { profile_id: "${prof_id}", device_id: "${dev_id}", title_id: "${ta}", quality: "SD" }
              as: ProfileUser
              as_user_id: "${prof_id}"
              captures: { dl_a: $.data.id }
            - call: "POST /downloads"
              payload: { profile_id: "${prof_id}", device_id: "${dev_id}", title_id: "${tb}", quality: "SD" }
              as: ProfileUser
              as_user_id: "${prof_id}"
              captures: { dl_b: $.data.id }
          trigger:
            - call: "DELETE /downloads/${dl_a}"
              as: ProfileUser
              as_user_id: "${prof_id}"
            - call: "POST /downloads"
              payload: { profile_id: "${prof_id}", device_id: "${dev_id}", title_id: "${tc}", quality: "SD" }
              as: ProfileUser
              as_user_id: "${prof_id}"
              captures: { dl_c_status: $.data.status }
          assert:
            - "Download.${dl_a}.status == DELETED"
            - "the third create succeeds (201, status DOWNLOADING)  # freed slot restored the used-count to exactly its pre-create value"
