  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_beats_fiscal_on_reserve_terminal_departure
        grounds:
          - validations[priority=18]
          - validations[priority=21]
          - errors[ERR_DEPARTURE_NOT_BOOKABLE]
          - errors[ERR_SEAT_CAPACITY_EXCEEDED]
        distinguishing_aspect: |
          A reserve on a CANCELLED_OPS departure with party_size exceeding remaining seats violates both the
          state precondition (priority 18 / category state) and the fiscal capacity check (priority 21 /
          category business_fiscal). The state error ERR_DEPARTURE_NOT_BOOKABLE wins over
          ERR_SEAT_CAPACITY_EXCEEDED — a state-vs-business_fiscal category pair, distinct from the
          business_safety-vs-business_fiscal pair in the sibling instance.
