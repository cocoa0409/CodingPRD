  # =========================================================================
  # Rule 5 — Validation priority conflicts across different error-category pairs
  # =========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: session_not_open_beats_authorization_incomplete
        grounds:
          - validations[priority=6]
          - validations[priority=8]
          - errors[ERR_SESSION_NOT_OPEN]
          - errors[ERR_AUTHORIZATION_INCOMPLETE]
        distinguishing_aspect: |
          Error-category pair (state vs business_safety): a child with NO approved authorization
          forms enrolls into an offering whose Session is CLOSED — both checks fail, but priority 6
          (state, ERR_SESSION_NOT_OPEN) outranks priority 8 (business_safety, ERR_AUTHORIZATION_INCOMPLETE).
        test_recipe:
          setup:
            - "A CAMP session that was OPENed then CLOSED; one offering; a child with an emergency contact but NO approved authorization forms."
