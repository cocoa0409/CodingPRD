          trigger:
            - { call: "POST /api/v1/tariff-rates", payload: { rate_case_id: "${rc}", customer_class_id: "${cls_com}", label: "COM 2027", proposed_customer_charge_cents: 1462, proposed_tiers: [ { up_to_kwh: null, rate_mills: 1100 } ], effective_start: "2027-01-01T00:00:00Z", effective_end: "2028-01-01T00:00:00Z" }, as: UtilityFiler, captures: { t1: $.data.id } }
            - { call: "POST /api/v1/tariff-rates", payload: { rate_case_id: "${rc}", customer_class_id: "${cls_com}", label: "COM 2028", proposed_customer_charge_cents: 1462, proposed_tiers: [ { up_to_kwh: null, rate_mills: 1100 } ], effective_start: "2028-01-01T00:00:00Z", effective_end: "2029-01-01T00:00:00Z" }, as: UtilityFiler, captures: { t2: $.data.id } }
            - { call: "POST /api/v1/tariff-rates", payload: { rate_case_id: "${rc}", customer_class_id: "${cls_com}", label: "COM straddler", proposed_customer_charge_cents: 1462, proposed_tiers: [ { up_to_kwh: null, rate_mills: 1100 } ], effective_start: "2027-06-01T00:00:00Z", effective_end: "2028-06-01T00:00:00Z" }, as: UtilityFiler, captures: { err: $.data.error_id } }
          assert:
            - "T1 (2027) and T2 (2028) both created (201): touching endpoints [2028-01-01) == [start) are disjoint under half-open semantics"
            - "T3: ${err} == ERR_TARIFF_WINDOW_OVERLAP (interior intersection with T1)"
            - "GET /api/v1/tariff-rates?rate_case_id=${rc}&status=PROPOSED returns exactly 2 rows (${t1}, ${t2})"

      - name: deferral_incurrence_closed_interval_touch_is_conflict
        grounds:
          - validations[priority=8]
          - errors[ERR_DEFERRAL_OVERLAPS_TEST_YEAR]
          - entities.RegulatoryAsset.fields.incurrence_start
          - entities.RegulatoryAsset.fields.incurrence_end
        distinguishing_aspect: |
          Resource = RateCase test-year calendar; interval semantics = CLOSED
          [incurrence_start, incurrence_end] vs CLOSED [test_year_start,
          test_year_end], where sharing a single DAY is an intersection.
          [2025-12-31, 2026-01-15] overlaps the test year on exactly
          2025-12-31 and is rejected — the opposite treatment from the
          half-open tariff windows where an endpoint touch is allowed.
          Different resource entity AND different interval semantics from the
          tariff instance.
        test_recipe:
          setup:
            - "Case DRAFT with test year [2025-01-01, 2025-12-31]"
          setup_api_calls:
            - { call: "POST /api/v1/rate-cases", payload: { case_number: "UR-2026-104", utility_name: "Cascade Power & Light", test_year_start: "2025-01-01T00:00:00Z", test_year_end: "2025-12-31T00:00:00Z", return_on_rate_base_bp: 750, proposed_revenue_requirement_cents: 1897500000, allocation_method: "COINCIDENT_PEAK" }, as: UtilityFiler, captures: { rc: $.data.id } }
          trigger:
            - { call: "POST /api/v1/regulatory-assets", payload: { rate_case_id: "${rc}", asset_name: "Storm restoration deferral", principal_cents: 10000001, incurrence_start: "2024-06-01T00:00:00Z", incurrence_end: "2024-12-31T00:00:00Z", amortization_months: 4 }, as: UtilityFiler, captures: { ra_ok: $.data.id, ra_ok_base: $.data.monthly_base_cents, ra_ok_final: $.data.final_month_cents } }
            - { call: "POST /api/v1/regulatory-assets", payload: { rate_case_id: "${rc}", asset_name: "Winter storm Uri deferral", principal_cents: 5000000, incurrence_start: "2025-12-31T00:00:00Z", incurrence_end: "2026-01-15T00:00:00Z", amortization_months: 5 }, as: UtilityFiler, captures: { err: $.data.error_id } }
          assert:
            - "2024 asset created (201): ${ra_ok_base} == 2500000, ${ra_ok_final} == 2500001 — incurrence window ends the day before the test year begins, so no shared day exists"
            - "2025-12-31-touching asset: ${err} == ERR_DEFERRAL_OVERLAPS_TEST_YEAR — exactly one shared calendar day (2025-12-31) is an intersection under closed-interval semantics"

  # ===========================================================================
  # Rule 9 — Compensating-action invariants across different conserved quantities
  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: adjustment_propose_withdraw_conserves_adjusted_amount
        grounds:
          - calculations.adjusted_test_year_amount
          - state_machines.Adjustment.PROPOSED_to_WITHDRAWN
          - entities.TestYearEntry.fields.adjusted_amount_cents
        distinguishing_aspect: |
          Conserved quantity = test-year adjusted amount: for every entry,
          adjusted_amount_cents == booked_amount_cents + sum(amount_cents over
          adjustments in {PROPOSED, VERIFIED, DISPUTED, ACCEPTED}) at ALL
          times. Forward action propose(A2 = +10,000,000) raises E1 from
          1,050,000,000 to 1,060,000,000; the compensating withdraw(A2)
          returns it to exactly 1,050,000,000 — no drift, because WITHDRAWN
          rows are excluded from the aggregation.
        test_recipe:
          setup:
            - "Case DRAFT; E1 (booked 1,000,000,000) SUBMITTED with A1 +50,000,000 already VERIFIED (adjusted 1,050,000,000)"
          setup_api_calls:
            - { call: "POST /api/v1/rate-cases", payload: { case_number: "UR-2026-104", utility_name: "Cascade Power & Light", test_year_start: "2025-01-01T00:00:00Z", test_year_end: "2025-12-31T00:00:00Z", return_on_rate_base_bp: 750, proposed_revenue_requirement_cents: 1897500000, allocation_method: "COINCIDENT_PEAK" }, as: UtilityFiler, captures: { rc: $.data.id } }
            - { call: "POST /api/v1/test-year-entries", payload: { rate_case_id: "${rc}", account_code: "900", category: "O_AND_M", booked_amount_cents: 1000000000 }, as: UtilityFiler, captures: { e1: $.data.id } }
            - { call: "POST /api/v1/test-year-entries/${e1}/submit", payload: {}, as: UtilityFiler }
            - { call: "POST /api/v1/adjustments", payload: { rate_case_id: "${rc}", test_year_entry_id: "${e1}", amount_cents: 50000000, reason: "Annualize pension cost" }, as: UtilityFiler, as_user_id: "uf_alice", captures: { a1: $.data.id } }
            - { call: "POST /api/v1/adjustments/${a1}/verify", payload: {}, as: UtilityFiler, as_user_id: "uf_bob" }
          trigger:
            - { call: "POST /api/v1/adjustments", payload: { rate_case_id: "${rc}", test_year_entry_id: "${e1}", amount_cents: 10000000, reason: "Normalize storm O&M" }, as: UtilityFiler, as_user_id: "uf_alice", captures: { a2: $.data.id } }
            - { call: "GET /api/v1/test-year-entries/${e1}", payload: {}, as: UtilityFiler, captures: { adj_mid: $.data.adjusted_amount_cents } }
            - { call: "POST /api/v1/adjustments/${a2}/withdraw", payload: {}, as: UtilityFiler, as_user_id: "uf_alice" }
            - { call: "GET /api/v1/test-year-entries/${e1}", payload: {}, as: UtilityFiler, captures: { adj_end: $.data.adjusted_amount_cents } }
          assert:
            - "Setup invariant: adjusted_amount_cents == 1050000000 == 1000000000 + 50000000 (VERIFIED A1 counts)"
            - "After propose A2: ${adj_mid} == 1060000000 (PROPOSED counts)"
            - "After withdraw A2: ${adj_end} == 1050000000 exactly — forward + compensating action leave the conserved quantity unchanged"
            - "Adjustment.${a2}.status == WITHDRAWN"

      - name: amortization_post_reverse_conserves_principal_coverage
        grounds:
          - calculations.amortization_schedule
          - state_machines.AmortizationEntry.PENDING_to_POSTED
          - state_machines.AmortizationEntry.POSTED_to_REVERSED
          - entities.RegulatoryAsset.fields.amortized_to_date_cents
        distinguishing_aspect: |
          Conserved quantity = amortization coverage of the asset (different
          conserved quantity from the test-year adjusted amount above):
          amortized_to_date_cents + sum(amount_cents over PENDING entries) ==
          principal_cents at ALL times. Forward post(entry 1) moves 2,500,000
          from PENDING to POSTED (coverage preserved: 2,500,000 + 7,500,001 ==
          10,000,001); compensating reverse(entry 1) restores 0 + 10,000,001
          == 10,000,001. The invariant holds across the FULLY_AMORTIZED <->
          AMORTIZING flip as well.
        test_recipe:
          setup:
            - "Canonical case in RATES_IMPLEMENTED with RA1 (10,000,001 over 4 months) AMORTIZING and four PENDING entries"
          setup_api_calls:
            - { call: "POST /api/v1/rate-cases", payload: { case_number: "UR-2026-104", utility_name: "Cascade Power & Light", test_year_start: "2025-01-01T00:00:00Z", test_year_end: "2025-12-31T00:00:00Z", return_on_rate_base_bp: 750, proposed_revenue_requirement_cents: 1897500000, allocation_method: "COINCIDENT_PEAK" }, as: UtilityFiler, captures: { rc: $.data.id } }
            - { call: "POST /api/v1/test-year-entries", payload: { rate_case_id: "${rc}", account_code: "900", category: "O_AND_M", booked_amount_cents: 1000000000 }, as: UtilityFiler, captures: { e1: $.data.id } }
            - { call: "POST /api/v1/test-year-entries", payload: { rate_case_id: "${rc}", account_code: "901", category: "DEPRECIATION", booked_amount_cents: 400000000 }, as: UtilityFiler, captures: { e2: $.data.id } }
            - { call: "POST /api/v1/test-year-entries", payload: { rate_case_id: "${rc}", account_code: "902", category: "TAXES", booked_amount_cents: 200000000 }, as: UtilityFiler, captures: { e3: $.data.id } }
            - { call: "POST /api/v1/adjustments", payload: { rate_case_id: "${rc}", test_year_entry_id: "${e1}", amount_cents: 50000000, reason: "Annualize pension cost" }, as: UtilityFiler, as_user_id: "uf_alice", captures: { a1: $.data.id } }
            - { call: "POST /api/v1/adjustments/${a1}/verify", payload: {}, as: UtilityFiler, as_user_id: "uf_bob" }
            - { call: "POST /api/v1/test-year-entries/${e1}/submit", payload: {}, as: UtilityFiler }
            - { call: "POST /api/v1/test-year-entries/${e1}/lock", payload: {}, as: UtilityFiler }
            - { call: "POST /api/v1/test-year-entries/${e2}/submit", payload: {}, as: UtilityFiler }
            - { call: "POST /api/v1/test-year-entries/${e2}/lock", payload: {}, as: UtilityFiler }
