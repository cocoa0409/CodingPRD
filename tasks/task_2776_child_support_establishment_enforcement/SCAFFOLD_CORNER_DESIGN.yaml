              as: CaseWorker
              captures: { order_id: "$.data.id" }
          trigger:
            - call: "POST /child-support/orders/00000000-0000-4000-8000-000000000000/charges"
              payload: { charge_type: "CURRENT_SUPPORT", period_start_date: "2026-08-01", period_end_date: "2026-09-01", due_date: "2026-08-15", amount_cents: 75000 }
              as: FinanceOfficer
              captures: { e_nf: "$.data.error_id" }
            - call: "POST /child-support/orders/${order_id}/charges"
              payload: { charge_type: "CURRENT_SUPPORT", period_start_date: "2026-08-01", period_end_date: "2026-09-01", due_date: "2026-08-15", amount_cents: 75000 }
              as: FinanceOfficer
              captures: { e_draft: "$.data.error_id" }
            - call: "POST /child-support/orders/${order_id}/guideline-calculation"
              payload: {}
              as: CaseWorker
              captures: { guideline: "$.data.guideline_monthly_cents" }
            - call: "POST /child-support/orders/${order_id}/charges"
              payload: { charge_type: "CURRENT_SUPPORT", period_start_date: "2026-08-01", period_end_date: "2026-09-01", due_date: "2026-08-15", amount_cents: 75000 }
              as: FinanceOfficer
              captures: { e_calc: "$.data.error_id" }
            - call: "POST /child-support/orders/${order_id}/entry"
              payload: {}
              as: SupervisingAttorney
              captures: { monthly: "$.data.monthly_obligation_cents" }
            - call: "POST /child-support/orders/${order_id}/charges"
              payload: { charge_type: "CURRENT_SUPPORT", period_start_date: "2026-08-01", period_end_date: "2026-09-01", due_date: "2026-08-15" }
              as: FinanceOfficer
              captures: { ok_id: "$.data.id", ok_order: "$.data.order_id", ok_case: "$.data.case_id", ok_amt: "$.data.amount_cents" }
          assert:
            - "${e_nf} == ERR_ORDER_NOT_FOUND with HTTP 404  # priority 6 runs before priority 10, so a bad path id never reaches the state check"
            - "${e_draft} == ERR_INVALID_ORDER_STATUS with HTTP 409  # charges may only be posted against an entered order"
            - "${guideline} == 75000  # combined 500000 -> band 2 rate 0.25 -> basic 125000; ratio 300000/500000 = 0.6000; share 75000; reserve 300000-113200 = 186800 does not bind"
            - "${e_calc} == ERR_INVALID_ORDER_STATUS with HTTP 409  # CALCULATED is still not ENTERED"
            - "${monthly} == 75000"
            - "the final POST returns 201 with ${ok_order} == ${order_id} and ${ok_case} == ${case_id} — the grandparent link is denormalised onto the charge"
            - "${ok_amt} == 75000  # amount_cents omitted, so it defaults to order.monthly_obligation_cents"

      - name: case_body_foreign_keys_are_resolved_then_role_and_flag_checked
        claim_type: flat
        grounds:
          - "complexity_profile.entity_topology"
          - "endpoints[POST /child-support/cases]"
          - "validations[priority 8]"
          - "validations[priority 14]"
          - "validations[priority 15]"
          - "errors[ERR_REFERENCED_ENTITY_NOT_FOUND]"
          - "errors[ERR_PARTY_ROLE_MISMATCH]"
          - "errors[ERR_TANF_FLAG_MISMATCH]"
        distinguishing_aspect: >
          The flat topology's cross-references are checked in the declared priority
          order on one endpoint: an absent custodial_party_id gives
          ERR_REFERENCED_ENTITY_NOT_FOUND 404 at priority 8, two real ids in the
          wrong role slots give ERR_PARTY_ROLE_MISMATCH 422 at priority 14, and a
          case_type/tanf_assistance disagreement gives ERR_TANF_FLAG_MISMATCH 422 at
          priority 15 in either direction.
        test_recipe:
          setup:
            - "One CUSTODIAL_PARTY and one NONCUSTODIAL_PARTY participant exist; the NCP is LOCATED."
            - "The uuid 00000000-0000-4000-8000-000000000000 is never minted. No case exists yet."
          setup_api_calls:
            - call: "POST /child-support/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /child-support/participants"
              payload: { role_type: "CUSTODIAL_PARTY", full_name: "Dana Ruiz", ssn_last4: "2525", residence_state_code: "MN", monthly_gross_income_cents: 200000, income_verification_source: "VERIFIED_WAGE_RECORD" }
              as: CaseWorker
              captures: { cp_id: "$.data.id" }
            - call: "POST /child-support/participants"
              payload: { role_type: "NONCUSTODIAL_PARTY", full_name: "Alex Ruiz", ssn_last4: "2626", residence_state_code: "MN", monthly_gross_income_cents: 300000, income_verification_source: "VERIFIED_WAGE_RECORD", supports_second_family: false, has_valid_drivers_license: true }
              as: CaseWorker
              captures: { ncp_id: "$.data.id" }
            - call: "POST /child-support/participants/${ncp_id}/locate-results"
              payload: { locate_outcome: "LOCATED" }
              as: CaseWorker
          trigger:
            - call: "POST /child-support/cases"
              payload: { case_type: "DIRECT_APPLICATION", custodial_party_id: "00000000-0000-4000-8000-000000000000", noncustodial_party_id: "${ncp_id}", child_count: 2, tanf_assistance: false }
              as: CaseWorker
              captures: { e_fk: "$.data.error_id" }
            - call: "POST /child-support/cases"
              payload: { case_type: "DIRECT_APPLICATION", custodial_party_id: "${ncp_id}", noncustodial_party_id: "${cp_id}", child_count: 2, tanf_assistance: false }
              as: CaseWorker
              captures: { e_swap: "$.data.error_id" }
            - call: "POST /child-support/cases"
              payload: { case_type: "DIRECT_APPLICATION", custodial_party_id: "${cp_id}", noncustodial_party_id: "${cp_id}", child_count: 2, tanf_assistance: false }
              as: CaseWorker
              captures: { e_same: "$.data.error_id" }
            - call: "POST /child-support/cases"
              payload: { case_type: "DIRECT_APPLICATION", custodial_party_id: "${cp_id}", noncustodial_party_id: "${ncp_id}", child_count: 2, tanf_assistance: true }
              as: CaseWorker
              captures: { e_flag_true: "$.data.error_id" }
            - call: "POST /child-support/cases"
              payload: { case_type: "PA_REFERRAL", custodial_party_id: "${cp_id}", noncustodial_party_id: "${ncp_id}", child_count: 2, tanf_assistance: false }
              as: CaseWorker
              captures: { e_flag_false: "$.data.error_id" }
            - call: "POST /child-support/cases"
              payload: { case_type: "PA_REFERRAL", custodial_party_id: "${cp_id}", noncustodial_party_id: "${ncp_id}", child_count: 2, tanf_assistance: true }
              as: CaseWorker
              captures: { ok_case: "$.data.id", ok_cp: "$.data.custodial_party_id", ok_ncp: "$.data.noncustodial_party_id", ok_asg: "$.data.assigned_arrears_cents" }
          assert:
            - "${e_fk} == ERR_REFERENCED_ENTITY_NOT_FOUND with HTTP 404"
            - "${e_swap} == ERR_PARTY_ROLE_MISMATCH with HTTP 422  # both ids resolve, so priority 8 passes and priority 14 fires"
            - "${e_same} == ERR_PARTY_ROLE_MISMATCH with HTTP 422  # the two ids must differ"
            - "${e_flag_true} == ERR_TANF_FLAG_MISMATCH with HTTP 422"
            - "${e_flag_false} == ERR_TANF_FLAG_MISMATCH with HTTP 422  # the rule is an equivalence, not a one-way implication"
            - "the final call returns 201 with ${ok_cp} == ${cp_id} and ${ok_ncp} == ${ncp_id} and ${ok_asg} == 0"
            - "GET /child-support/cases returns total_count == 1"

  # ====================================================================
  # Table 2 — State Machines, its parallel state_machine_shape row, and the
  # side-effect pattern rows.
  # ====================================================================
  - section: state_machines
    instances:

      - name: voluntary_acknowledgment_establishes_only_after_the_deadline_passes
        claim_type: valid_transition
        grounds:
          - "state_machines.PaternityAction"
          - "state_machines.SupportCase.case_status"
          - "endpoints[POST /child-support/cases/{case_id}/paternity-actions]"
          - "endpoints[POST /child-support/paternity-actions/{paternity_action_id}/acknowledgment]"
          - "endpoints[POST /child-support/_clock/set_current_utc]"
        distinguishing_aspect: >
          The AOP_SIGNED -> ESTABLISHED transition fires only when the clock is
          STRICTLY past rescission_deadline_at: at exactly 2026-09-30T00:00:00Z the
          action is still AOP_SIGNED, and one day later it is ESTABLISHED with
          established_method VOLUNTARY_ACKNOWLEDGMENT while the case moves
          PATERNITY_PENDING -> ORDER_ESTABLISHMENT.
        test_recipe:
          setup:
            - "DIRECT_APPLICATION case, NCP LOCATED, good_cause_claim false."
            - "A VOLUNTARY_ACKNOWLEDGMENT PaternityAction signed at 2026-08-01T00:00:00Z, so rescission_deadline_at is 2026-09-30T00:00:00Z (aop_signed_at + 60 days)."
            - "The case sits in PATERNITY_PENDING."
          setup_api_calls:
            - call: "POST /child-support/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /child-support/participants"
              payload: { role_type: "CUSTODIAL_PARTY", full_name: "Dana Ruiz", ssn_last4: "2727", residence_state_code: "MN", monthly_gross_income_cents: 200000, income_verification_source: "VERIFIED_WAGE_RECORD" }
              as: CaseWorker
              captures: { cp_id: "$.data.id" }
            - call: "POST /child-support/participants"
              payload: { role_type: "NONCUSTODIAL_PARTY", full_name: "Alex Ruiz", ssn_last4: "2828", residence_state_code: "MN", monthly_gross_income_cents: 300000, income_verification_source: "VERIFIED_WAGE_RECORD", supports_second_family: false, has_valid_drivers_license: true }
              as: CaseWorker
              captures: { ncp_id: "$.data.id" }
            - call: "POST /child-support/participants/${ncp_id}/locate-results"
              payload: { locate_outcome: "LOCATED" }
              as: CaseWorker
            - call: "POST /child-support/cases"
              payload: { case_type: "DIRECT_APPLICATION", custodial_party_id: "${cp_id}", noncustodial_party_id: "${ncp_id}", child_count: 2, tanf_assistance: false, good_cause_claim: false }
              as: CaseWorker
              captures: { case_id: "$.data.id" }
            - call: "POST /child-support/cases/${case_id}/paternity-actions"
              payload: { method: "VOLUNTARY_ACKNOWLEDGMENT" }
              as: CaseWorker
              captures: { pa_id: "$.data.id" }
            - call: "POST /child-support/paternity-actions/${pa_id}/acknowledgment"
              payload: { notary_verified: true, signed_by_participant_id: "${ncp_id}" }
              as: CaseWorker
              captures: { pa_id_deadline: "$.data.rescission_deadline_at" }
          trigger:
            - call: "GET /child-support/paternity-actions/${pa_id}"
              as: CaseWorker
              captures: { s0: "$.data.status", signed: "$.data.aop_signed_at", nv: "$.data.notary_verified" }
            - call: "GET /child-support/cases/${case_id}"
              as: CaseWorker
              captures: { cs0: "$.data.case_status" }
            - call: "POST /child-support/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-30T00:00:00Z" }
              as: ProgramAdmin
            - call: "GET /child-support/paternity-actions/${pa_id}"
              as: CaseWorker
              captures: { s1: "$.data.status" }
            - call: "GET /child-support/cases/${case_id}"
              as: CaseWorker
              captures: { cs1: "$.data.case_status" }
            - call: "POST /child-support/_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "GET /child-support/paternity-actions/${pa_id}"
              as: CaseWorker
              captures: { s2: "$.data.status", em: "$.data.established_method", est: "$.data.established_at", liable: "$.data.genetic_cost_liable_party", gcost: "$.data.genetic_cost_cents" }
            - call: "GET /child-support/cases/${case_id}"
              as: CaseWorker
              captures: { cs2: "$.data.case_status" }
          assert:
            - "${s0} == AOP_SIGNED, ${signed} == 2026-08-01T00:00:00Z, ${nv} == true"
            - "${pa_id_deadline} == 2026-09-30T00:00:00Z  # aop_signed_at 2026-08-01 + 60 days"
            - "${cs0} == PATERNITY_PENDING"
            - "${s1} == AOP_SIGNED  # the clock equals the deadline; the transition needs strictly past"
            - "${cs1} == PATERNITY_PENDING"
            - "${s2} == ESTABLISHED and ${em} == VOLUNTARY_ACKNOWLEDGMENT and ${est} == 2026-10-01T00:00:00Z"
            - "${liable} == NONE and ${gcost} == 0  # no genetic testing happened on the voluntary path"
            - "${cs2} == ORDER_ESTABLISHMENT"

      - name: rescission_after_the_sixty_day_window_is_refused
        claim_type: precondition_enforcement
        grounds:
          - "state_machines.PaternityAction"
          - "endpoints[POST /child-support/paternity-actions/{paternity_action_id}/rescission]"
          - "validations[priority 10]"
          - "validations[priority 18]"
          - "errors[ERR_RESCISSION_WINDOW_CLOSED]"
        distinguishing_aspect: >
          Two acknowledgments signed on the same day take opposite outcomes purely
          on when the rescission arrives: the one rescinded at 2026-09-15 (inside
          the 60-day window) reaches AOP_RESCINDED, while the one left alone until
          2026-10-01 has auto-established and answers the identical request with
          ERR_RESCISSION_WINDOW_CLOSED 409 rather than the generic status error.
        test_recipe:
          setup:
            - "Two DIRECT_APPLICATION cases, each with its own CP/NCP pair, both NCPs LOCATED."
            - "Both cases carry a VOLUNTARY_ACKNOWLEDGMENT action signed 2026-08-01T00:00:00Z with rescission_deadline_at 2026-09-30T00:00:00Z."
            - "Case B's action was rescinded at 2026-09-15 and re-executed is not yet attempted; case A's action was left untouched."
            - "The clock is then moved to 2026-10-01T00:00:00Z, which establishes case A's action only — case B's is AOP_RESCINDED and unaffected."
