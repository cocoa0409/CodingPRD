      - name: the_accuracy_review_must_be_fresher_than_the_last_legal_review
        claim_type: Error Triggerable
        grounds:
          - errors.ERR_ACCURACY_REVIEW_MISSING
          - errors.ERR_REVISION_LIMIT_EXCEEDED
          - constants.MAX_REVISION_ROUNDS
          - state_machines.CampaignCommunication.transitions.REVISION_REQUIRED_to_PENDING_LEGAL_REVIEW
        distinguishing_aspect: |
          Two facets of one gate. Before any accuracy review the submission is refused outright; after a
          REQUEST_REVISION the stored accuracy_reviewed_at is stale relative to the review instant, so the
          identical resubmission is refused with the same error until a fresh accuracy review is recorded.
          Three revision rounds are permitted and the fourth resubmission fails with
          ERR_REVISION_LIMIT_EXCEEDED, not with the accuracy error - the accuracy review that precedes it is
          fresh.
