scaffold_difficulty_design:

  # =========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: promised_ship_date_estimated_vs_scheduled_surge
        grounds:
          - calculations.promised_ship_date
          - state_machines.Order.pay_UNPAID_to_PAID
          - entities.Order.promised_ship_date
          - entities.SurgeWindow.turnaround_extra_days
        distinguishing_aspect: |
          The estimated variant (quote) ignores surge and returns 2026-06-13, while the scheduled variant
          (persisted at pay inside a surge window with +4 days) returns 2026-06-17 for identical order line
          inputs — dual-variant on the Order date domain.
        test_recipe:
          setup:
            - "Clock at 2026-06-05T00:00:00Z, inside a PHOTOBOOK surge window [2026-06-01,2026-06-10) adding 4 production days."
            - "Approved PHOTOBOOK project (base_unit_price 1000, production_days 3) owned by the customer, with a shipping address."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-05T00:00:00Z" }
              as: CatalogAdmin
            - call: "POST /surge-windows"
              payload: { name: "Summer", starts_at: "2026-06-01T00:00:00Z", ends_at: "2026-06-10T00:00:00Z", turnaround_extra_days: 4, capacity_per_day: 100, product_type_scope: "PHOTOBOOK" }
              as: CatalogAdmin
            - call: "POST /customers"
              payload: { email: "c@x.com", full_name: "C" }
              as: CatalogAdmin
              captures: { cust: $.data.id }
            - call: "POST /customers/${cust}/addresses"
              payload: { recipient_name: "C", line1: "1 A St", city: "SF", region: "CA", postal_code: "94101", country: "US" }
              as: Customer
              as_user_id: "${cust}"
              captures: { addr: $.data.id }
            - call: "POST /templates"
              payload: { product_type: "PHOTOBOOK", name: "Book", surface_count: 20, base_unit_price_cents: 1000, production_days: 3, allowed_finishes: ["MATTE","GLOSSY"], min_photos: 2, max_photos: 50 }
              as: CatalogAdmin
              captures: { tmpl: $.data.id }
            - call: "POST /projects"
              payload: { customer_id: "${cust}", template_id: "${tmpl}", title: "P" }
              as: Customer
              as_user_id: "${cust}"
              captures: { proj: $.data.id }
            - call: "POST /projects/${proj}/photos"
              payload: { filename: "a.jpg", width_px: 3000, height_px: 2000, dpi: 300 }
              as: Customer
              as_user_id: "${cust}"
            - call: "POST /projects/${proj}/photos"
              payload: { filename: "b.jpg", width_px: 3000, height_px: 2000, dpi: 300 }
              as: Customer
              as_user_id: "${cust}"
            - call: "POST /projects/${proj}/autolayout"
              payload: {}
              as: Customer
              as_user_id: "${cust}"
            - call: "GET /projects/${proj}"
              payload: {}
              as: Customer
              as_user_id: "${cust}"
              captures: { pv: $.data.version }
            - call: "POST /projects/${proj}/proofs"
              payload: { expected_project_version: "${pv}" }
              as: Customer
              as_user_id: "${cust}"
              captures: { proof: $.data.id }
            - call: "POST /proofs/${proof}/approve"
              payload: {}
              as: Customer
              as_user_id: "${cust}"
          trigger:
            - call: "POST /projects/${proj}/quote"
              payload: { quantity: 10, finish: "MATTE", ship_method: "STANDARD" }
              as: Customer
              as_user_id: "${cust}"
              captures: { q_promised: $.data.promised_ship_date }
            - call: "POST /orders"
              payload: { project_id: "${proj}", quantity: 10, finish: "MATTE", ship_method: "STANDARD", ship_address_id: "${addr}", payment_method: "CARD" }
              as: Customer
              as_user_id: "${cust}"
              captures: { order: $.data.id }
            - call: "POST /orders/${order}/pay"
              payload: {}
              as: Customer
              as_user_id: "${cust}"
              captures: { o_promised: $.data.promised_ship_date }
          assert:
            - "quote.promised_ship_date == \"2026-06-13\" (estimated variant, surge ignored)"
            - "Order.${order}.promised_ship_date == \"2026-06-17\" (scheduled variant, +4 surge days)"

      - name: refund_wallet_vs_cash_valuation
        grounds:
          - calculations.refund_amount
          - state_machines.Order.cancel_PAID_to_REFUNDED
          - entities.Customer.store_credit_cents
          - entities.Order.refund_cents
        distinguishing_aspect: |
          For two orders with identical line (paid_cents 10299), WALLET cancellation refunds the full 10299 to
          store credit while CARD cancellation refunds 9349 (10299 minus a 950 restocking fee) — dual-variant on
          the Customer/refund money domain, a different entity domain than the promised-date variant on Order.
        test_recipe:
          setup:
            - "One approved PHOTOBOOK project; two orders (A and B), each quantity 10 MATTE STANDARD, both paid by CARD (paid_cents 10299)."
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "c@x.com", full_name: "C" }
              as: CatalogAdmin
              captures: { cust: $.data.id }
            - call: "POST /customers/${cust}/addresses"
              payload: { recipient_name: "C", line1: "1 A St", city: "SF", region: "CA", postal_code: "94101", country: "US" }
              as: Customer
              as_user_id: "${cust}"
              captures: { addr: $.data.id }
            - call: "POST /templates"
              payload: { product_type: "PHOTOBOOK", name: "Book", surface_count: 20, base_unit_price_cents: 1000, production_days: 3, allowed_finishes: ["MATTE"], min_photos: 2, max_photos: 50 }
              as: CatalogAdmin
              captures: { tmpl: $.data.id }
            - call: "POST /projects"
              payload: { customer_id: "${cust}", template_id: "${tmpl}", title: "P" }
              as: Customer
              as_user_id: "${cust}"
              captures: { proj: $.data.id }
            - call: "POST /projects/${proj}/photos"
              payload: { filename: "a.jpg", width_px: 3000, height_px: 2000, dpi: 300 }
              as: Customer
              as_user_id: "${cust}"
            - call: "POST /projects/${proj}/photos"
              payload: { filename: "b.jpg", width_px: 3000, height_px: 2000, dpi: 300 }
              as: Customer
              as_user_id: "${cust}"
            - call: "POST /projects/${proj}/autolayout"
              payload: {}
              as: Customer
              as_user_id: "${cust}"
            - call: "GET /projects/${proj}"
              payload: {}
              as: Customer
              as_user_id: "${cust}"
              captures: { pv: $.data.version }
            - call: "POST /projects/${proj}/proofs"
              payload: { expected_project_version: "${pv}" }
              as: Customer
              as_user_id: "${cust}"
              captures: { proof: $.data.id }
            - call: "POST /proofs/${proof}/approve"
              payload: {}
              as: Customer
              as_user_id: "${cust}"
            - call: "POST /orders"
              payload: { project_id: "${proj}", quantity: 10, finish: "MATTE", ship_method: "STANDARD", ship_address_id: "${addr}", payment_method: "CARD" }
              as: Customer
              as_user_id: "${cust}"
              captures: { orderA: $.data.id }
            - call: "POST /orders/${orderA}/pay"
              payload: {}
              as: Customer
              as_user_id: "${cust}"
            - call: "POST /orders"
              payload: { project_id: "${proj}", quantity: 10, finish: "MATTE", ship_method: "STANDARD", ship_address_id: "${addr}", payment_method: "CARD" }
              as: Customer
              as_user_id: "${cust}"
              captures: { orderB: $.data.id }
            - call: "POST /orders/${orderB}/pay"
              payload: {}
              as: Customer
              as_user_id: "${cust}"
          trigger:
            - call: "POST /orders/${orderA}/cancel"
              payload: { refund_destination: "WALLET" }
              as: Customer
              as_user_id: "${cust}"
            - call: "POST /orders/${orderB}/cancel"
              payload: { refund_destination: "CARD" }
              as: Customer
              as_user_id: "${cust}"
          assert:
            - "Order.${orderA}.refund_cents == 10299 (wallet variant, full paid_cents)"
            - "Order.${orderB}.refund_cents == 9349 (cash variant, paid_cents 10299 - 950 restocking)"
            - "Customer.${cust}.store_credit_cents == 10299 (only the WALLET refund credited store credit)"

  # =========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: line_subtotal_tiered_finish_quantity_mode_a
        grounds:
          - calculations.line_subtotal
          - entities.Order.unit_price_cents
          - entities.Order.subtotal_cents
        distinguishing_aspect: |
          Mode (a): a >=3-input non-linear formula — base_unit_price(1000) + finish surcharge(GLOSSY 300) = unit 1300,
          times quantity 10 = 13000, times a quantity-selected tier rate (0.05) rounded = 650 discount => subtotal 12350.
          The tier is selected by a threshold branch on quantity, not a flat multiplier.
        test_recipe:
          setup:
            - "A DRAFT project on a template with base_unit_price 1000 and finishes including GLOSSY (quote needs no approval)."
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "c@x.com", full_name: "C" }
              as: CatalogAdmin
              captures: { cust: $.data.id }
            - call: "POST /templates"
              payload: { product_type: "PHOTOBOOK", name: "Book", surface_count: 20, base_unit_price_cents: 1000, production_days: 3, allowed_finishes: ["MATTE","GLOSSY"], min_photos: 2, max_photos: 50 }
              as: CatalogAdmin
              captures: { tmpl: $.data.id }
            - call: "POST /projects"
              payload: { customer_id: "${cust}", template_id: "${tmpl}", title: "P" }
              as: Customer
              as_user_id: "${cust}"
              captures: { proj: $.data.id }
          trigger:
            - call: "POST /projects/${proj}/quote"
              payload: { quantity: 10, finish: "GLOSSY", ship_method: "STANDARD" }
              as: Customer
              as_user_id: "${cust}"
              captures: { u: $.data.unit_price_cents, s: $.data.subtotal_cents }
          assert:
            - "quote.unit_price_cents == 1300"
            - "quote.subtotal_cents == 12350"

      - name: promo_discount_round_per_promo_then_sum_mode_b
        grounds:
          - calculations.promo_discount
          - entities.Order.discount_cents
          - validations[priority=13]
        distinguishing_aspect: |
          Mode (b): nested rounding order is pinned to round-per-promo-then-sum. Two 7% promos on subtotal 333 give
          round(23.31)+round(23.31)=23+23=46, whereas sum-then-round would give round(46.62)=47. The scaffold pins 46.
        test_recipe:
          setup:
            - "A DRAFT project on a template with base_unit_price 333; two stackable PERCENT-7 promos with min_subtotal 0."
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "c@x.com", full_name: "C" }
              as: CatalogAdmin
              captures: { cust: $.data.id }
            - call: "POST /templates"
              payload: { product_type: "CARD", name: "Card", surface_count: 1, base_unit_price_cents: 333, production_days: 1, allowed_finishes: ["MATTE"], min_photos: 1, max_photos: 4 }
              as: CatalogAdmin
              captures: { tmpl: $.data.id }
            - call: "POST /promotions"
              payload: { code: "SEVENA", kind: "PERCENT", value: 7, min_subtotal_cents: 0, stackable: true, per_customer_limit: 5 }
              as: CatalogAdmin
            - call: "POST /promotions"
              payload: { code: "SEVENB", kind: "PERCENT", value: 7, min_subtotal_cents: 0, stackable: true, per_customer_limit: 5 }
              as: CatalogAdmin
            - call: "POST /projects"
              payload: { customer_id: "${cust}", template_id: "${tmpl}", title: "P" }
              as: Customer
              as_user_id: "${cust}"
              captures: { proj: $.data.id }
          trigger:
            - call: "POST /projects/${proj}/quote"
              payload: { quantity: 1, finish: "MATTE", ship_method: "STANDARD", promo_codes: ["SEVENA","SEVENB"] }
              as: Customer
              as_user_id: "${cust}"
              captures: { d: $.data.discount_cents, s: $.data.subtotal_cents }
          assert:
            - "quote.subtotal_cents == 333"
            - "quote.discount_cents == 46 (round-per-promo-then-sum; NOT 47)"

  # =========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: project_revision_cycle_in_proof_back_to_draft
        grounds:
          - state_machines.Project.IN_PROOF_to_DRAFT
          - state_machines.Proof.GENERATED_to_CHANGES_REQUESTED
          - entities.Project.state
          - entities.Photo.status
        distinguishing_aspect: |
          Requesting changes on a GENERATED proof drives the project along the back-edge IN_PROOF -> DRAFT (a cycle,
          not a forward pipeline) and unlocks placed photos (PLACED -> UPLOADED) on the Project entity.
        test_recipe:
          setup:
            - "A project in IN_PROOF with a GENERATED proof (2 placed photos)."
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "c@x.com", full_name: "C" }
              as: CatalogAdmin
              captures: { cust: $.data.id }
            - call: "POST /templates"
              payload: { product_type: "PHOTOBOOK", name: "Book", surface_count: 20, base_unit_price_cents: 1000, production_days: 3, allowed_finishes: ["MATTE"], min_photos: 2, max_photos: 50 }
              as: CatalogAdmin
              captures: { tmpl: $.data.id }
            - call: "POST /projects"
              payload: { customer_id: "${cust}", template_id: "${tmpl}", title: "P" }
              as: Customer
              as_user_id: "${cust}"
              captures: { proj: $.data.id }
            - call: "POST /projects/${proj}/photos"
              payload: { filename: "a.jpg", width_px: 3000, height_px: 2000, dpi: 300 }
              as: Customer
              as_user_id: "${cust}"
            - call: "POST /projects/${proj}/photos"
              payload: { filename: "b.jpg", width_px: 3000, height_px: 2000, dpi: 300 }
              as: Customer
              as_user_id: "${cust}"
            - call: "POST /projects/${proj}/autolayout"
              payload: {}
              as: Customer
              as_user_id: "${cust}"
            - call: "GET /projects/${proj}"
              payload: {}
              as: Customer
              as_user_id: "${cust}"
              captures: { pv: $.data.version }
            - call: "POST /projects/${proj}/proofs"
              payload: { expected_project_version: "${pv}" }
              as: Customer
              as_user_id: "${cust}"
              captures: { proof: $.data.id }
          trigger:
            - call: "POST /proofs/${proof}/request-changes"
              payload: { note: "fix cover" }
              as: Customer
              as_user_id: "${cust}"
          assert:
            - "Proof.${proof}.state == CHANGES_REQUESTED"
            - "Project.${proj}.state == DRAFT (cycle back-edge from IN_PROOF)"
            - "every Photo of ${proj} has status == UPLOADED (unlocked)"

      - name: order_parallel_payment_fulfillment_axes
        grounds:
          - state_machines.Order.pay_UNPAID_to_PAID
          - state_machines.Order.ship_advance_IN_PRODUCTION_to_SHIPPED
          - entities.Order.payment_status
          - entities.Order.fulfillment_status
        distinguishing_aspect: |
          The Order carries two independent status axes: after payment the payment_status stays PAID while the
          fulfillment_status advances independently NEW->IN_PRODUCTION->SHIPPED->DELIVERED, ending PAID x DELIVERED.
        test_recipe:
          setup:
            - "A paid order whose ProductionJob is advanced to DONE, then a shipment created and advanced to DELIVERED."
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "c@x.com", full_name: "C" }
              as: CatalogAdmin
              captures: { cust: $.data.id }
            - call: "POST /customers/${cust}/addresses"
              payload: { recipient_name: "C", line1: "1 A St", city: "SF", region: "CA", postal_code: "94101", country: "US" }
              as: Customer
              as_user_id: "${cust}"
              captures: { addr: $.data.id }
            - call: "POST /templates"
              payload: { product_type: "PHOTOBOOK", name: "Book", surface_count: 20, base_unit_price_cents: 1000, production_days: 3, allowed_finishes: ["MATTE"], min_photos: 2, max_photos: 50 }
              as: CatalogAdmin
              captures: { tmpl: $.data.id }
            - call: "POST /projects"
              payload: { customer_id: "${cust}", template_id: "${tmpl}", title: "P" }
              as: Customer
              as_user_id: "${cust}"
              captures: { proj: $.data.id }
            - call: "POST /projects/${proj}/photos"
              payload: { filename: "a.jpg", width_px: 3000, height_px: 2000, dpi: 300 }
              as: Customer
              as_user_id: "${cust}"
            - call: "POST /projects/${proj}/photos"
              payload: { filename: "b.jpg", width_px: 3000, height_px: 2000, dpi: 300 }
              as: Customer
              as_user_id: "${cust}"
            - call: "POST /projects/${proj}/autolayout"
              payload: {}
              as: Customer
              as_user_id: "${cust}"
            - call: "GET /projects/${proj}"
              payload: {}
              as: Customer
              as_user_id: "${cust}"
              captures: { pv: $.data.version }
            - call: "POST /projects/${proj}/proofs"
              payload: { expected_project_version: "${pv}" }
              as: Customer
              as_user_id: "${cust}"
              captures: { proof: $.data.id }
            - call: "POST /proofs/${proof}/approve"
              payload: {}
              as: Customer
              as_user_id: "${cust}"
            - call: "POST /orders"
              payload: { project_id: "${proj}", quantity: 5, finish: "MATTE", ship_method: "STANDARD", ship_address_id: "${addr}", payment_method: "CARD" }
              as: Customer
              as_user_id: "${cust}"
              captures: { order: $.data.id }
            - call: "POST /orders/${order}/pay"
              payload: {}
              as: Customer
              as_user_id: "${cust}"
            - call: "GET /orders/${order}/production-job"
              payload: {}
              as: ProductionOperator
              captures: { job: "$.data[0].id" }
            - call: "POST /production-jobs/${job}/advance"
              payload: {}
              as: ProductionOperator
            - call: "POST /production-jobs/${job}/advance"
              payload: {}
              as: ProductionOperator
            - call: "POST /production-jobs/${job}/advance"
              payload: {}
              as: ProductionOperator
            - call: "POST /orders/${order}/shipments"
              payload: { address_id: "${addr}", carrier: "UPS", method: "STANDARD" }
              as: ProductionOperator
              captures: { ship: $.data.id }
            - call: "POST /shipments/${ship}/advance"
              payload: {}
              as: ProductionOperator
          trigger:
            - call: "POST /shipments/${ship}/advance"
              payload: {}
              as: ProductionOperator
          assert:
            - "Order.${order}.fulfillment_status == DELIVERED"
            - "Order.${order}.payment_status == PAID (payment axis unchanged across all fulfillment advances)"

  # =========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: proof_approve_cascade_project_photo_lock
        grounds:
          - state_machines.Proof.GENERATED_to_APPROVED
          - state_machines.Project.IN_PROOF_to_APPROVED
          - entities.Project.state
          - entities.Photo.status
        distinguishing_aspect: |
          Depth-3 transitive cascade triggered by proof approval: Proof->APPROVED causes Project->APPROVED, which
          in turn causes every placed Photo->LOCKED. Each hop is caused by the prior hop, not by the trigger directly.
        test_recipe:
          setup:
            - "A project in IN_PROOF with a GENERATED current proof and 2 PLACED photos."
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "c@x.com", full_name: "C" }
              as: CatalogAdmin
              captures: { cust: $.data.id }
            - call: "POST /templates"
              payload: { product_type: "PHOTOBOOK", name: "Book", surface_count: 20, base_unit_price_cents: 1000, production_days: 3, allowed_finishes: ["MATTE"], min_photos: 2, max_photos: 50 }
              as: CatalogAdmin
              captures: { tmpl: $.data.id }
            - call: "POST /projects"
              payload: { customer_id: "${cust}", template_id: "${tmpl}", title: "P" }
              as: Customer
              as_user_id: "${cust}"
              captures: { proj: $.data.id }
            - call: "POST /projects/${proj}/photos"
              payload: { filename: "a.jpg", width_px: 3000, height_px: 2000, dpi: 300 }
              as: Customer
              as_user_id: "${cust}"
            - call: "POST /projects/${proj}/photos"
              payload: { filename: "b.jpg", width_px: 3000, height_px: 2000, dpi: 300 }
              as: Customer
              as_user_id: "${cust}"
            - call: "POST /projects/${proj}/autolayout"
              payload: {}
              as: Customer
              as_user_id: "${cust}"
            - call: "GET /projects/${proj}"
              payload: {}
              as: Customer
              as_user_id: "${cust}"
              captures: { pv: $.data.version }
            - call: "POST /projects/${proj}/proofs"
              payload: { expected_project_version: "${pv}" }
              as: Customer
              as_user_id: "${cust}"
              captures: { proof: $.data.id }
          trigger:
            - call: "POST /proofs/${proof}/approve"
              payload: {}
              as: Customer
              as_user_id: "${cust}"
          assert:
            - "Proof.${proof}.state == APPROVED"
            - "Project.${proj}.state == APPROVED"
            - "every Photo of ${proj} has status == LOCKED"

      - name: cancel_cascade_order_job_shipment_void
        grounds:
          - state_machines.Order.cancel_fulfillment_to_CANCELLED
          - state_machines.ProductionJob.to_CANCELLED
          - state_machines.Shipment.to_VOID
          - entities.Shipment.state
        distinguishing_aspect: |
          Depth-3 transitive cascade triggered by order cancel: Order fulfillment->CANCELLED cancels the DONE
          ProductionJob, and the job cancellation in turn voids the order's LABEL_CREATED Shipment (Order->Job->Shipment),
          a different propagation pattern and trigger than the proof-approve cascade.
        test_recipe:
          setup:
            - "A paid order whose job is DONE and which already has a LABEL_CREATED shipment; the order is still IN_PRODUCTION (cancellable)."
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "c@x.com", full_name: "C" }
              as: CatalogAdmin
              captures: { cust: $.data.id }
            - call: "POST /customers/${cust}/addresses"
              payload: { recipient_name: "C", line1: "1 A St", city: "SF", region: "CA", postal_code: "94101", country: "US" }
              as: Customer
              as_user_id: "${cust}"
              captures: { addr: $.data.id }
            - call: "POST /templates"
              payload: { product_type: "PHOTOBOOK", name: "Book", surface_count: 20, base_unit_price_cents: 1000, production_days: 3, allowed_finishes: ["MATTE"], min_photos: 2, max_photos: 50 }
              as: CatalogAdmin
              captures: { tmpl: $.data.id }
            - call: "POST /projects"
              payload: { customer_id: "${cust}", template_id: "${tmpl}", title: "P" }
              as: Customer
              as_user_id: "${cust}"
              captures: { proj: $.data.id }
            - call: "POST /projects/${proj}/photos"
              payload: { filename: "a.jpg", width_px: 3000, height_px: 2000, dpi: 300 }
              as: Customer
              as_user_id: "${cust}"
            - call: "POST /projects/${proj}/photos"
              payload: { filename: "b.jpg", width_px: 3000, height_px: 2000, dpi: 300 }
              as: Customer
              as_user_id: "${cust}"
            - call: "POST /projects/${proj}/autolayout"
              payload: {}
              as: Customer
              as_user_id: "${cust}"
            - call: "GET /projects/${proj}"
              payload: {}
              as: Customer
              as_user_id: "${cust}"
              captures: { pv: $.data.version }
            - call: "POST /projects/${proj}/proofs"
              payload: { expected_project_version: "${pv}" }
              as: Customer
              as_user_id: "${cust}"
              captures: { proof: $.data.id }
            - call: "POST /proofs/${proof}/approve"
              payload: {}
              as: Customer
              as_user_id: "${cust}"
            - call: "POST /orders"
              payload: { project_id: "${proj}", quantity: 5, finish: "MATTE", ship_method: "STANDARD", ship_address_id: "${addr}", payment_method: "CARD" }
              as: Customer
