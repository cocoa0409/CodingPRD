            - "Subscription.${sub_id}.pause_resumes_on == null"
      - name: scheduled_credit_expiry_on_clock_advance
        claim_type: scheduled_actions
        grounds:
          - entities.SessionCredit.fields.expires_on
          - endpoints
        distinguishing_aspect: "Advancing the clock past a credit's expires_on (period_end + 28 days = 2026-07-06) flips the unused AVAILABLE credit to EXPIRED."
        test_recipe:
          setup:
            - "Client in CA, one PAID cycle at period_start 2026-06-01 granting 1 AVAILABLE credit (expires 2026-07-06)."
