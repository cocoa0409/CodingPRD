scenario: |
  Generate task harder than expert level!

  2559. Branch Network Optimization & Consolidation (retail bank distribution strategy): branch
  performance scoring on deposits, transaction volume, digital adoption and profitability, trade
  area demographics and competitor density analysis, consolidation candidate identification with
  deposit retention modeling, regulatory branch closure notice requirements and community impact
  assessment, staff redeployment, severance and customer transition communications, lease
  disposition, owned property sale and ATM retention decisions, post-consolidation deposit runoff
  tracking against forecast, new-market de novo branch siting and ramp targets
domain_name: branch-network-optimization
api_prefix: /distribution

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: ledger_reconciliation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - selector_policy

  entity_topology: flat
  # Peer entities joined by explicit FK fields; no entity is nested inside another in any URL
  # path except read-only sub-resource listings. Branch.absorbing_branch_id makes the Branch
  # table self-referential; DepositObservation is polymorphic across ConsolidationCase and
  # DeNovoSitePlan.

  state_machine_shape: cyclic
  # ConsolidationCase cycles SUBMITTED -> RETURNED -> DRAFT -> SUBMITTED (bounded at 3 returns)
  # and branches SUBMITTED -> {APPROVED | RETURNED | REJECTED} from one decision endpoint;
  # StaffDisposition carries two independent state axes (disposition_state x notification_state);
  # PropertyDisposition forks on tenure_class and joins at DISPOSED.

  relationship_patterns:
    - one_to_many
    - self_referential      # Branch.absorbing_branch_id -> Branch.id
    - polymorphic           # DepositObservation.subject_type selects which FK is populated
    - cross_aggregate       # ConsolidationCase side effects mutate MarketArea ledger fields

  role_model: segregation_of_duties
  # The NetworkStrategist who authored a ConsolidationCase may never decide it; the
  # ConsolidationApprover may never author or revise one; regulatory filings belong exclusively
  # to ComplianceOfficer.

  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

entities:
  - name: MarketArea
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: trade area display name
        constraints: 1..120 chars, unique per region_code
      - name: region_code
        type: string
        source: input
        description: bank distribution region code
        constraints: matches ^[A-Z]{2}-[0-9]{2}$
      - name: population
        type: integer
        source: input
        description: trade area resident population
        constraints: ">= 1000"
      - name: median_household_income_cents
        type: integer
        source: input
        description: trade area median household income in cents
        constraints: ">= 0"
      - name: deposit_market_total_cents
        type: integer
        source: input
        description: total addressable deposit market in the trade area, in cents
        constraints: ">= 0"
      - name: competitor_branch_count
        type: integer
        source: input
        description: number of rival-bank branches inside the trade area
        constraints: ">= 0"
      - name: household_growth_pct_bps
        type: integer
        source: input
        description: projected 5-year household growth, in basis points (180 = 1.80%)
        constraints: "-2000..5000"
      - name: digital_penetration_bps
        type: integer
        source: input
        description: share of trade-area households using digital banking, in basis points
        constraints: 0..10000
      - name: competitor_density_index
        type: integer
        source: computed
        description: "rival branches per 100k residents; calculations.competitor_density_index"
      - name: own_branch_count
        type: integer
        source: computed
        description: "count of Branch rows in this market with status IN {ACTIVE, UNDER_REVIEW, CLOSURE_SCHEDULED, DE_NOVO_RAMPING}"
      - name: branch_density_per_100k
        type: integer
        source: computed
        description: "(own_branch_count + competitor_branch_count) per 100k residents; calculations.market_saturation_tier"
      - name: saturation_tier
        type: enum
        source: computed
        description: "market saturation classification driving de novo siting and community impact"
        constraints: OVER_BRANCHED | SATURATED | UNDER_BRANCHED
      - name: absorbed_deposits_cents
        type: integer
        source: computed
        description: cumulative deposits transferred into surviving branches of this market by executed closures
        default: 0
      - name: cumulative_runoff_deposits_cents
        type: integer
        source: computed
        description: cumulative deposits forecast to leave the bank at closure execution; the market-level runoff ledger
        default: 0
      - name: flagged_case_count
        type: integer
        source: computed
        description: count of ConsolidationCase rows in this market whose governance_flag == SAVINGS_WATCH
        default: 0
      - name: remediation_case_count
        type: integer
        source: computed
        description: count of ConsolidationCase rows in this market whose monitoring_posture == REMEDIATION
        default: 0
      - name: de_novo_hold
        type: boolean
        source: computed
        description: true while remediation_case_count >= 1; blocks de novo openings in this market
        default: false

  - name: Branch
    parent: null
    common_fields: true
    fields:
      - name: market_area_id
        type: string
        source: input
        description: "FK -> MarketArea.id; the trade area this branch sits in"
      - name: branch_code
        type: string
        source: input
        description: operating code
        constraints: matches ^[A-Z]{2}-[0-9]{3}$, globally unique
      - name: branch_type
        type: enum
        source: input
        description: physical format
        constraints: FULL_SERVICE | LIMITED_SERVICE | DRIVE_UP
      - name: tenure_class
        type: enum
        source: input
        description: premises ownership form
        constraints: LEASED | OWNED
      - name: status
        type: enum
        source: system
        description: lifecycle state (state_machines.Branch)
        default: ACTIVE
        constraints: ACTIVE | UNDER_REVIEW | CLOSURE_SCHEDULED | CLOSED | DE_NOVO_RAMPING
      - name: deposit_balance_cents
        type: integer
        source: input
        description: current deposit balance on book, in cents
        constraints: ">= 0"
      - name: monthly_transaction_count
        type: integer
        source: input
        description: teller plus drive-up transactions per month
        constraints: ">= 0"
      - name: digital_adoption_bps
        type: integer
        source: input
        description: share of this branch's households active in digital channels, in basis points
        constraints: 0..10000
      - name: annual_noninterest_expense_cents
        type: integer
        source: input
        description: annual operating expense of the branch, in cents
        constraints: ">= 0"
      - name: annual_revenue_cents
        type: integer
        source: input
        description: annual revenue attributed to the branch, in cents
        constraints: ">= 0"
      - name: fte_count
        type: integer
        source: input
        description: staffed full-time equivalents currently assigned to the branch
        constraints: ">= 0"
      - name: atm_count
        type: integer
        source: input
        description: ATMs installed at the branch
        constraints: ">= 0"
      - name: opened_on
        type: string
        source: input
        description: ISO 8601 date (YYYY-MM-DD) the branch opened
      - name: scoring_variant
        type: enum
        source: input
        description: variant used when the branch's stored performance_score_bps is refreshed
        default: TRAILING_BLEND
        constraints: POINT_IN_TIME | TRAILING_BLEND
      - name: onboarding_capacity_households_per_day
        type: integer
        source: input
        description: households this branch can onboard per calendar day during a transition wave
        default: 40
        constraints: ">= 1"
      - name: absorbing_branch_id
        type: string
        source: system
        description: "FK -> Branch.id; set on a CLOSED branch to the surviving branch that absorbed its deposits; null otherwise"
      - name: performance_score_bps
        type: integer
        source: computed
        description: "composite performance score in basis points under scoring_variant; calculations.branch_performance_score"
      - name: performance_band
        type: enum
        source: computed
        description: band derived from performance_score_bps
        constraints: CORE | STABLE | WATCH | CONSOLIDATION_CANDIDATE | UNSCORED
      - name: snapshot_count
        type: integer
        source: computed
        description: number of PerformanceSnapshot rows recorded for this branch
        default: 0
      - name: pre_close_deposits_cents
        type: integer
        source: system
        description: deposit_balance_cents stamped at the moment closure execution debited this branch; null before execution
      - name: pre_close_fte_count
        type: integer
        source: system
        description: fte_count stamped at the moment closure execution zeroed this branch's staffing; restored verbatim by unwind-closure, null before execution
      - name: transferred_in_deposits_cents
        type: integer
        source: computed
        description: cumulative deposits absorbed by this branch from executed closures
        default: 0

  - name: PerformanceSnapshot
    parent: null
    common_fields: false
    fields:
      - name: branch_id
        type: string
        source: input
        description: "FK -> Branch.id; the scored branch"
      - name: period_label
        type: string
        source: input
        description: reporting period label, e.g. 2026-Q2
        constraints: 1..20 chars, unique per branch_id
      - name: period_end_date
        type: string
        source: input
        description: ISO 8601 date (YYYY-MM-DD) closing the reporting period
      - name: deposits_cents
        type: integer
        source: input
        description: average deposits during the period, in cents
        constraints: ">= 0"
      - name: transaction_count
        type: integer
        source: input
        description: monthly average transaction count during the period
        constraints: ">= 0"
      - name: digital_active_bps
        type: integer
        source: input
        description: digital-active household share during the period, in basis points
        constraints: 0..10000
      - name: revenue_cents
        type: integer
        source: input
        description: revenue recognized in the period, annualized, in cents
        constraints: ">= 0"
      - name: noninterest_expense_cents
        type: integer
        source: input
        description: noninterest expense in the period, annualized, in cents
        constraints: ">= 0"
      - name: composite_score_bps
        type: integer
        source: computed
        description: "this snapshot's four-factor composite in basis points; calculations.branch_performance_score step 1"
      - name: band
        type: enum
        source: computed
        description: band of composite_score_bps for this single snapshot
        constraints: CORE | STABLE | WATCH | CONSOLIDATION_CANDIDATE

  - name: ConsolidationCase
    parent: null
    common_fields: true
    fields:
      - name: closing_branch_id
        type: string
        source: input
        description: "FK -> Branch.id; the consolidation candidate proposed for closure"
      - name: receiving_branch_id
        type: string
        source: input
        description: "FK -> Branch.id; the surviving branch that absorbs deposits and staff; when omitted on create the server selects it per calculations.receiving_branch_selector"
      - name: rationale_code
        type: enum
        source: input
        description: business reason recorded on the case
        constraints: LOW_PERFORMANCE | LEASE_EXPIRY | MARKET_OVERLAP | DIGITAL_MIGRATION
      - name: planned_closure_date
        type: string
        source: input
        description: ISO 8601 date (YYYY-MM-DD) the branch is planned to stop serving customers
      - name: retention_model_variant
        type: enum
        source: input
        description: variant used when the case's forecast fields are refreshed from its ACTIVE RetentionForecast
        default: DISTANCE_DECAY
        constraints: DISTANCE_DECAY | SEGMENT_MIX
      - name: status
        type: enum
        source: system
        description: lifecycle state (state_machines.ConsolidationCase)
        default: DRAFT
        constraints: DRAFT | SUBMITTED | RETURNED | REJECTED | SUPERSEDED | APPROVED | NOTICE_FILED | CLOSURE_EXECUTED | POST_CLOSE_MONITORING | CLOSED_OUT | UNWOUND
      - name: created_by_user_id
        type: string
        source: system
        description: X-User-ID of the NetworkStrategist who created the case; the segregation-of-duties subject
      - name: decided_by_user_id
        type: string
        source: system
        description: X-User-ID of the ConsolidationApprover who last decided the case; null before the first decision
      - name: returned_count
        type: integer
        source: computed
        description: number of times this case has been RETURNED; capped by REVISION_LIMIT (3)
        default: 0
      - name: forecast_retention_bps
        type: integer
        source: computed
        description: "retention rate of the ACTIVE RetentionForecast; calculations.deposit_retention_forecast"
      - name: forecast_retained_deposits_cents
        type: integer
        source: computed
        description: deposits projected to stay with the bank after closure, in cents
        default: 0
      - name: forecast_runoff_cents
        type: integer
        source: computed
        description: deposits projected to leave the bank after closure, in cents
        default: 0
      - name: severance_pool_cents
        type: integer
        source: computed
        description: "sum of severance_amount_cents over this case's SEVERANCE dispositions; calculations.severance_pool"
        default: 0
      - name: gross_annual_savings_cents
        type: integer
        source: computed
        description: "savings before transition incentives; calculations.net_consolidation_savings step 4"
        default: 0
      - name: transition_incentive_rate_bps
        type: integer
        source: computed
        description: "incentive rate selected from the gross savings tier; calculations.net_consolidation_savings step 5"
        default: 0
      - name: transition_incentive_cents
        type: integer
        source: computed
        description: retention incentive paid on retained deposits, in cents
        default: 0
      - name: net_annual_savings_cents
        type: integer
        source: computed
        description: "gross_annual_savings_cents minus transition_incentive_cents; calculations.net_consolidation_savings step 7"
        default: 0
      - name: governance_flag
        type: enum
        source: computed
        description: set to SAVINGS_WATCH when net_annual_savings_cents falls below SAVINGS_FLOOR_CENTS after approval
        default: NONE
        constraints: NONE | SAVINGS_WATCH
      - name: impact_tier
        type: enum
        source: computed
        description: impact_tier mirrored from the case's non-SUPERSEDED CommunityImpactAssessment; UNASSESSED before the first assessment
        default: UNASSESSED
        constraints: UNASSESSED | LOW | MODERATE | HIGH
      - name: notice_required_days
        type: integer
        source: computed
        description: "regulatory lead days a closure notice must observe; calculations.closure_notice_lead_days"
        default: 0
      - name: pre_close_deposits_cents
        type: integer
        source: system
        description: closing branch deposit_balance_cents stamped at closure execution; the runoff-tracking baseline
      - name: executed_on
        type: string
        source: system
        description: ISO 8601 date the closure was executed, read from the logical clock
      - name: monitoring_posture
        type: enum
        source: computed
        description: post-closure deposit runoff posture, an axis independent of status
        default: NOT_STARTED
        constraints: NOT_STARTED | ON_TRACK | REMEDIATION | RESOLVED
      - name: last_observed_month_index
        type: integer
        source: computed
        description: highest month_index of a DepositObservation recorded against this case
        default: 0
      - name: cumulative_variance_bps
        type: integer
        source: computed
        description: "variance_bps of the latest DepositObservation; calculations.runoff_variance"
        default: 0
      - name: severed_fte_count
        type: integer
        source: computed
        description: count of this case's StaffDisposition rows with disposition_state == SEVERED
        default: 0
      - name: redeployed_fte_count
        type: integer
        source: computed
        description: count of this case's StaffDisposition rows with disposition_state IN {OFFER_ACCEPTED, COMPLETED}
        default: 0
      - name: pending_disposition_count
        type: integer
        source: computed
        description: count of this case's StaffDisposition rows with disposition_state == PROPOSED
        default: 0

  - name: RetentionForecast
    parent: null
    common_fields: true
    fields:
      - name: consolidation_case_id
        type: string
        source: input
        description: "FK -> ConsolidationCase.id; the case being modeled"
      - name: model_variant
        type: enum
        source: input
        description: retention model applied
        constraints: DISTANCE_DECAY | SEGMENT_MIX
      - name: distance_miles
        type: number
        source: input
        description: driving distance from the closing branch to the receiving branch, one decimal place
        constraints: 0.0..60.0
      - name: retail_share_bps
        type: integer
        source: input
        description: share of closing-branch deposits held by retail households, in basis points
        constraints: 0..10000
      - name: small_business_share_bps
        type: integer
        source: input
        description: share held by small-business customers, in basis points
        constraints: 0..10000
      - name: wealth_share_bps
        type: integer
        source: input
        description: share held by wealth customers, in basis points
        constraints: 0..10000; the three shares MUST sum to exactly 10000
      - name: baseline_deposits_cents
        type: integer
        source: system
        description: closing branch deposit_balance_cents copied at forecast creation
      - name: digital_adoption_bps
        type: integer
        source: system
        description: closing branch digital_adoption_bps copied at forecast creation
      - name: retention_bps
        type: integer
        source: computed
        description: "modeled retention rate in basis points; calculations.deposit_retention_forecast"
      - name: retained_deposits_cents
        type: integer
        source: computed
        description: baseline_deposits_cents times retention_bps, rounded half up
      - name: runoff_cents
        type: integer
        source: computed
        description: baseline_deposits_cents minus retained_deposits_cents
      - name: status
        type: enum
        source: system
        description: ACTIVE while this is the case's governing forecast; SUPERSEDED once a newer forecast is created
        default: ACTIVE
        constraints: ACTIVE | SUPERSEDED

  - name: CommunityImpactAssessment
    parent: null
    common_fields: true
    fields:
      - name: consolidation_case_id
        type: string
        source: input
        description: "FK -> ConsolidationCase.id; the case assessed"
      - name: lmi_tract
        type: boolean
        source: input
        description: true when the closing branch sits in a low-or-moderate-income census tract
      - name: distance_to_nearest_remaining_miles
        type: number
        source: input
        description: miles from the closing branch to the nearest remaining bank branch, one decimal place
        constraints: 0.0..60.0
      - name: alternative_access_count
        type: integer
        source: input
        description: count of alternative access points (offsite ATMs, partner sites) inside 2 miles
        constraints: 0..20
      - name: senior_household_pct_bps
        type: integer
        source: input
        description: share of trade-area households headed by a person over 65, in basis points
        constraints: 0..10000
      - name: public_transit_access
        type: boolean
        source: input
        description: true when a fixed-route transit stop serves the closing branch
      - name: market_saturation_tier_at_assessment
        type: enum
        source: system
        description: MarketArea.saturation_tier copied at assessment creation; the conditional input of the impact formula
        constraints: OVER_BRANCHED | SATURATED | UNDER_BRANCHED
      - name: impact_score
        type: integer
        source: computed
        description: "0..100 community impact score; calculations.community_impact_score"
      - name: impact_tier
        type: enum
        source: computed
        description: tier derived from impact_score
        constraints: LOW | MODERATE | HIGH
      - name: requires_public_comment
        type: boolean
        source: computed
        description: true when impact_tier == HIGH or lmi_tract == true
      - name: notice_required_days
        type: integer
        source: computed
        description: "lead days the closure notice must observe; calculations.closure_notice_lead_days"
      - name: status
        type: enum
        source: system
        description: assessment lifecycle (state_machines.CommunityImpactAssessment)
        default: DRAFT
        constraints: DRAFT | FINALIZED | REOPENED | SUPERSEDED
      - name: finalized_on
        type: string
        source: system
        description: ISO 8601 date the assessment was last finalized, read from the logical clock

  - name: ClosureNotice
    parent: null
    common_fields: true
    fields:
      - name: consolidation_case_id
        type: string
        source: input
        description: "FK -> ConsolidationCase.id; the case whose closure is noticed"
      - name: notice_type
        type: enum
        source: input
        description: filing channel
        constraints: REGULATOR | CUSTOMER | LOBBY_POSTING
      - name: filed_on
        type: string
        source: system
        description: ISO 8601 date the notice was filed, read from the logical clock
      - name: effective_closure_date
        type: string
        source: input
        description: ISO 8601 date (YYYY-MM-DD) on which the branch may stop serving customers
      - name: required_lead_days
        type: integer
        source: computed
        description: ConsolidationCase.notice_required_days copied at filing; the value the filing was validated against
      - name: lead_days
        type: integer
        source: computed
        description: calendar days from filed_on to effective_closure_date, inclusive of neither endpoint
      - name: buffer_end_date
        type: string
        source: computed
        description: "effective_closure_date plus NOTICE_BUFFER_DAYS; the end of this notice's market occupation interval"
      - name: status
        type: enum
        source: system
        description: notice lifecycle (state_machines.ClosureNotice)
        default: FILED
        constraints: FILED | EFFECTIVE | WITHDRAWN
      - name: withdrawn_reason_code
        type: enum
        source: input
        description: reason recorded when the notice is withdrawn; null while status != WITHDRAWN
        constraints: REGULATOR_OBJECTION | PLAN_REVISION | COMMUNITY_PROTEST

  - name: StaffDisposition
    parent: null
    common_fields: true
    fields:
      - name: consolidation_case_id
        type: string
        source: input
        description: "FK -> ConsolidationCase.id; the case funding this disposition"
      - name: source_branch_id
        type: string
        source: system
        description: "FK -> Branch.id; copied from the case's closing_branch_id at creation"
      - name: target_branch_id
        type: string
        source: input
        description: "FK -> Branch.id; receiving branch for a REDEPLOYMENT; null for SEVERANCE"
      - name: employee_ref
        type: string
        source: input
        description: opaque HR reference for the employee
        constraints: 1..40 chars, unique per consolidation_case_id
      - name: role_title
        type: string
        source: input
        description: job title at the closing branch
      - name: tenure_months
        type: integer
        source: input
        description: completed months of service
        constraints: ">= 0"
      - name: annual_salary_cents
        type: integer
        source: input
        description: annual base salary in cents
        constraints: ">= 0"
      - name: proposed_disposition
        type: enum
        source: input
        description: intended outcome for the employee
        constraints: REDEPLOYMENT | SEVERANCE
      - name: disposition_state
        type: enum
        source: system
        description: outcome axis (state_machines.StaffDisposition, dimension A)
        default: PROPOSED
        constraints: PROPOSED | OFFER_ACCEPTED | SEVERED | COMPLETED
      - name: notification_state
        type: enum
        source: system
        description: WARN notification axis (state_machines.StaffDisposition, dimension B), independent of disposition_state
        default: PENDING
        constraints: PENDING | NOTIFIED
      - name: notified_on
        type: string
        source: system
        description: ISO 8601 date the WARN notice was delivered, read from the logical clock
      - name: service_years
        type: integer
        source: computed
        description: floor(tenure_months / 12)
      - name: severance_weeks
        type: integer
        source: computed
        description: "weeks of pay awarded; calculations.severance_pool step 2"
      - name: weekly_pay_cents
        type: integer
        source: computed
        description: "annual_salary_cents / 52 rounded half up to whole cents; calculations.severance_pool step 3"
      - name: severance_amount_cents
        type: integer
        source: computed
        description: "severance_weeks * weekly_pay_cents + OUTPLACEMENT_STIPEND_CENTS; 0 for REDEPLOYMENT rows"
      - name: severed_on
        type: string
        source: system
        description: ISO 8601 date the employee was severed, read from the logical clock

  - name: PropertyDisposition
    parent: null
    common_fields: true
    fields:
      - name: branch_id
        type: string
        source: input
        description: "FK -> Branch.id; the premises being disposed"
      - name: consolidation_case_id
        type: string
        source: input
        description: "FK -> ConsolidationCase.id; the case that triggered the disposition"
      - name: tenure_class
        type: enum
        source: system
        description: copied from Branch.tenure_class at creation; selects the LEASE or OWNED fork
        constraints: LEASED | OWNED
      - name: monthly_rent_cents
        type: integer
        source: input
        description: contract rent per month; required when tenure_class == LEASED
        constraints: ">= 0"
      - name: lease_end_date
        type: string
        source: input
        description: ISO 8601 date the lease expires; required when tenure_class == LEASED
      - name: buyout_offer_cents
        type: integer
        source: input
        description: landlord lease-buyout ask, in cents; required when tenure_class == LEASED
        constraints: ">= 0"
      - name: book_value_cents
        type: integer
        source: input
        description: carrying value of owned premises, in cents; required when tenure_class == OWNED
        constraints: ">= 0"
      - name: list_price_cents
        type: integer
        source: input
        description: asking price for owned premises, in cents; required when tenure_class == OWNED
        constraints: ">= 0"
      - name: atm_disposition
        type: enum
        source: input
        description: fate of the branch ATM fleet after closure
        constraints: RETAIN_OFFSITE | RELOCATE | DECOMMISSION
      - name: atm_monthly_cost_cents
        type: integer
        source: input
        description: monthly cost of keeping the ATM fleet in place, in cents
        constraints: ">= 0"
      - name: atm_monthly_surcharge_revenue_cents
        type: integer
        source: input
        description: monthly surcharge and interchange revenue from the ATM fleet, in cents
        constraints: ">= 0"
      - name: atm_breakeven_met
        type: boolean
        source: computed
        description: "true when the ATM fleet clears the retention margin threshold; calculations.atm_retention_decision"
      - name: atm_decision_final
        type: enum
        source: computed
        description: "server-adjudicated ATM outcome; RETAIN_OFFSITE is downgraded to DECOMMISSION when atm_breakeven_met is false"
        constraints: RETAIN_OFFSITE | RELOCATE | DECOMMISSION
      - name: status
        type: enum
        source: system
        description: disposition lifecycle (state_machines.PropertyDisposition)
        default: PENDING
        constraints: PENDING | MARKETED | ASSIGNMENT_PENDING | SALE_PENDING | HOLDOVER | DISPOSED
      - name: marketing_started_on
        type: string
        source: system
        description: ISO 8601 date the premises entered MARKETED, read from the logical clock
      - name: counterparty_ref
        type: string
        source: input
        description: assignee or buyer reference recorded at contract
      - name: agreed_amount_cents
        type: integer
        source: input
        description: contracted assignment consideration (LEASED) or sale price (OWNED), in cents
        constraints: ">= 0"
      - name: selling_costs_cents
        type: integer
        source: input
        description: brokerage and legal costs of the transaction, in cents
        constraints: ">= 0"
      - name: annual_carry_cents
        type: integer
        source: computed
        description: "annual carrying cost charged against case savings while the premises are undisposed; calculations.property_carry_cost"
        default: 0
      - name: net_disposition_cents
        type: integer
        source: computed
        description: "one-time proceeds (positive) or exit cost (negative) at settlement; calculations.property_disposition_net"
        default: 0
      - name: settled_on
        type: string
        source: system
        description: ISO 8601 date the disposition settled, read from the logical clock

  - name: CustomerTransitionCampaign
    parent: null
    common_fields: true
    fields:
      - name: consolidation_case_id
        type: string
        source: input
        description: "FK -> ConsolidationCase.id; the case whose customers are being transitioned"
      - name: receiving_branch_id
        type: string
        source: system
        description: "FK -> Branch.id; copied from the case's receiving_branch_id at creation; the resource whose wave calendar is occupied"
      - name: wave_start_date
        type: string
        source: input
        description: ISO 8601 date (YYYY-MM-DD) the onboarding wave starts; interval start, inclusive
      - name: wave_end_date
        type: string
        source: input
        description: ISO 8601 date (YYYY-MM-DD) the onboarding wave ends; interval end, EXCLUSIVE
      - name: inbound_household_count
        type: integer
        source: input
        description: households to be onboarded at the receiving branch during the wave
        constraints: ">= 1"
      - name: channel_mix
        type: enum
        source: input
        description: communication channels used for the wave
        constraints: LETTER_ONLY | LETTER_EMAIL | FULL_OMNI
      - name: wave_days
        type: integer
        source: computed
        description: wave_end_date minus wave_start_date in calendar days (half-open interval length)
      - name: daily_onboarding_load
        type: integer
        source: computed
        description: "inbound_household_count divided by wave_days, rounded half up; the per-day load charged to the receiving branch"
      - name: status
        type: enum
        source: system
        description: campaign lifecycle (state_machines.CustomerTransitionCampaign)
        default: PLANNED
        constraints: PLANNED | LAUNCHED | COMPLETED | CANCELLED
      - name: launched_on
        type: string
        source: system
        description: ISO 8601 date the campaign launched, read from the logical clock

  - name: DeNovoSitePlan
    parent: null
    common_fields: true
    fields:
      - name: market_area_id
        type: string
        source: input
        description: "FK -> MarketArea.id; the trade area under consideration"
      - name: opened_branch_id
        type: string
        source: system
        description: "FK -> Branch.id; set when the plan opens its branch; null before opening"
      - name: site_label
        type: string
        source: input
        description: site display name
        constraints: 1..80 chars
      - name: proposed_branch_code
        type: string
        source: input
        description: branch_code minted for the branch this plan opens
        constraints: matches ^[A-Z]{2}-[0-9]{3}$, globally unique across Branch.branch_code
      - name: target_year1_deposits_cents
        type: integer
        source: input
        description: year-one deposit target used as the ramp curve terminal value, in cents
        constraints: ">= 1"
      - name: capex_budget_cents
        type: integer
        source: input
        description: build-out capital budget, in cents
        constraints: ">= 0"
      - name: site_score
        type: integer
        source: computed
        description: "0..100 siting score from trade area demographics and competitor density; calculations.de_novo_site_score"
      - name: status
        type: enum
        source: system
        description: plan lifecycle (state_machines.DeNovoSitePlan)
        default: SITE_IDENTIFIED
        constraints: SITE_IDENTIFIED | REJECTED | APPROVED | HELD | OPENED | RAMP_TRACKING | RAMP_MET | RAMP_REMEDIATION
      - name: opened_on
        type: string
        source: system
        description: ISO 8601 date the de novo branch opened, read from the logical clock
      - name: ramp_month_index
        type: integer
        source: computed
        description: highest month_index of a DepositObservation recorded against this plan
        default: 0
      - name: ramp_attainment_bps
        type: integer
        source: computed
        description: "observed deposits over cumulative ramp target, in basis points; calculations.de_novo_ramp_attainment"
        default: 0
      - name: ramp_status
        type: enum
        source: computed
        description: ramp verdict derived from ramp_attainment_bps
        default: UNTRACKED
        constraints: UNTRACKED | ON_TRACK | BEHIND | AT_RISK | MET

  - name: DepositObservation
    parent: null
    common_fields: false
    fields:
      - name: subject_type
        type: enum
        source: input
        description: selects which foreign key is populated on this observation
        constraints: CONSOLIDATION_CASE | DE_NOVO_PLAN
      - name: consolidation_case_id
        type: string
        source: input
        description: "FK -> ConsolidationCase.id; required when subject_type == CONSOLIDATION_CASE, otherwise MUST be absent"
      - name: de_novo_plan_id
        type: string
        source: input
        description: "FK -> DeNovoSitePlan.id; required when subject_type == DE_NOVO_PLAN, otherwise MUST be absent"
      - name: month_index
        type: integer
        source: input
        description: months elapsed since closure execution or de novo opening
        constraints: 1..12; MUST be strictly greater than the subject's last recorded month index
      - name: observed_deposits_cents
        type: integer
        source: input
        description: deposits actually on book for the tracked population at month_index, in cents
        constraints: ">= 0"
      - name: forecast_deposits_cents
        type: integer
        source: computed
        description: "modeled deposits at month_index; calculations.runoff_variance step 2 (cases) or calculations.de_novo_ramp_attainment step 1 (plans)"
      - name: variance_bps
        type: integer
        source: computed
        description: "signed variance of observed against forecast, in basis points; negative means worse than forecast"
      - name: breach
        type: boolean
        source: computed
        description: true when variance_bps <= RUNOFF_BREACH_BPS (cases) or ramp attainment is below RAMP_AT_RISK_BPS (plans)
      - name: observed_on
        type: string
        source: system
        description: ISO 8601 date the observation was recorded, read from the logical clock

state_machines:
  - entity: Branch
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: UNDER_REVIEW
        trigger: "POST /distribution/consolidation-cases naming this branch as closing_branch_id"
        actor: system
        preconditions:
          - "branch.status == ACTIVE"
          - "no ConsolidationCase with closing_branch_id == branch.id has status IN {SUBMITTED, APPROVED, NOTICE_FILED, CLOSURE_EXECUTED, POST_CLOSE_MONITORING}"
          - "request expected_branch_version == branch.version"
        side_effects:
          - "increments Branch.version by 1"
          - "every ConsolidationCase with closing_branch_id == branch.id and status == DRAFT transitions to SUPERSEDED, and each such case's ACTIVE RetentionForecast transitions to SUPERSEDED and its DRAFT/FINALIZED/REOPENED CommunityImpactAssessment transitions to SUPERSEDED"
        note: "UNDER_REVIEW still counts toward MarketArea.own_branch_count, so saturation_tier does not move here."
      - from: UNDER_REVIEW
        to: ACTIVE
        trigger: "POST /distribution/consolidation-cases/{caseId}/decision with decision == REJECT"
        actor: system
        preconditions:
          - "the rejected case is the only case with closing_branch_id == branch.id in status IN {SUBMITTED, APPROVED, NOTICE_FILED}"
        side_effects:
          - "increments Branch.version by 1"
          - "case ACTIVE RetentionForecast transitions to SUPERSEDED; case CommunityImpactAssessment transitions to SUPERSEDED"
      - from: UNDER_REVIEW
        to: CLOSURE_SCHEDULED
        trigger: "POST /distribution/closure-notices with notice_type == REGULATOR for a case whose closing_branch_id == branch.id"
        actor: system
        preconditions:
          - "case.status == APPROVED"
        side_effects:
          - "increments Branch.version by 1"
      - from: CLOSURE_SCHEDULED
        to: UNDER_REVIEW
        trigger: "POST /distribution/closure-notices/{noticeId}/withdraw"
        actor: system
        preconditions:
          - "the withdrawn notice has notice_type == REGULATOR and status IN {FILED, EFFECTIVE}"
        side_effects:
          - "increments Branch.version by 1"
      - from: CLOSURE_SCHEDULED
        to: CLOSED
        trigger: "POST /distribution/consolidation-cases/{caseId}/execute-closure"
        actor: system
        preconditions:
          - "case.status == NOTICE_FILED"
        side_effects:
          - "Branch.pre_close_deposits_cents = Branch.deposit_balance_cents; Branch.deposit_balance_cents = 0"
          - "Branch.absorbing_branch_id = case.receiving_branch_id"
          - "Branch.pre_close_fte_count = Branch.fte_count; Branch.fte_count = 0"
          - "increments Branch.version by 1"
          - "CASCADE hop 2: because this branch is now CLOSED, every PropertyDisposition with branch_id == branch.id and status == PENDING transitions to MARKETED"
      - from: CLOSED
        to: ACTIVE
        trigger: "POST /distribution/consolidation-cases/{caseId}/unwind-closure"
        actor: system
        preconditions:
          - "case.status == CLOSURE_EXECUTED"
          - "case.last_observed_month_index == 0"
        side_effects:
          - "Branch.deposit_balance_cents = Branch.pre_close_deposits_cents; Branch.pre_close_deposits_cents = null"
          - "Branch.fte_count = Branch.pre_close_fte_count; Branch.pre_close_fte_count = null"
          - "Branch.absorbing_branch_id = null"
          - "increments Branch.version by 1"
      - from: ACTIVE
        to: DE_NOVO_RAMPING
        trigger: "POST /distribution/de-novo-plans/{planId}/open (same request that mints this branch)"
        actor: system
        preconditions:
          - "plan.status == APPROVED"
          - "MarketArea.de_novo_hold == false"
        side_effects:
          - "MarketArea.own_branch_count += 1 and MarketArea.branch_density_per_100k / saturation_tier are recomputed"
          - "increments Branch.version by 1"
      - from: DE_NOVO_RAMPING
        to: ACTIVE
        trigger: "POST /distribution/deposit-observations that drives plan.ramp_status to MET"
        actor: system
        preconditions:
          - "observation.month_index == 12"
          - "plan.ramp_attainment_bps >= RAMP_MET_BPS"
        side_effects:
          - "increments Branch.version by 1"

  - entity: ConsolidationCase
    initial_state: DRAFT
    terminal_states: [REJECTED, SUPERSEDED, UNWOUND, CLOSED_OUT]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /distribution/consolidation-cases/{caseId}/submit"
        actor: NetworkStrategist
        preconditions:
          - "case.receiving_branch_id is not null"
          - "Branch(case.receiving_branch_id).status == ACTIVE"
          - "case has exactly one RetentionForecast with status == ACTIVE"
          - "X-User-ID == case.created_by_user_id"
        side_effects:
          - "recomputes case.severance_pool_cents (calculations.severance_pool)"
          - "recomputes case.gross_annual_savings_cents, transition_incentive_rate_bps, transition_incentive_cents, net_annual_savings_cents (calculations.net_consolidation_savings)"
          - "increments ConsolidationCase.version by 1"
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /distribution/consolidation-cases/{caseId}/decision with decision == APPROVE"
        actor: ConsolidationApprover
        preconditions:
          - "X-User-ID != case.created_by_user_id (segregation of duties)"
          - "case.net_annual_savings_cents >= SAVINGS_FLOOR_CENTS"
          - "request expected_case_version == case.version"
        side_effects:
          - "case.decided_by_user_id = X-User-ID"
          - "increments ConsolidationCase.version by 1"
      - from: SUBMITTED
        to: RETURNED
        trigger: "POST /distribution/consolidation-cases/{caseId}/decision with decision == RETURN"
        actor: ConsolidationApprover
        preconditions:
          - "X-User-ID != case.created_by_user_id (segregation of duties)"
          - "case.returned_count < REVISION_LIMIT (3)"
          - "request expected_case_version == case.version"
        side_effects:
          - "case.returned_count += 1"
          - "case.decided_by_user_id = X-User-ID"
          - "increments ConsolidationCase.version by 1"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /distribution/consolidation-cases/{caseId}/decision with decision == REJECT"
        actor: ConsolidationApprover
        preconditions:
          - "X-User-ID != case.created_by_user_id (segregation of duties)"
          - "request expected_case_version == case.version"
        side_effects:
          - "Branch(case.closing_branch_id) transitions UNDER_REVIEW -> ACTIVE"
          - "case ACTIVE RetentionForecast transitions to SUPERSEDED"
          - "case CommunityImpactAssessment in status IN {DRAFT, FINALIZED, REOPENED} transitions to SUPERSEDED, and case.impact_tier resets to UNASSESSED with case.notice_required_days reset to 0"
          - "increments ConsolidationCase.version by 1"
      - from: RETURNED
        to: DRAFT
        trigger: "POST /distribution/consolidation-cases/{caseId}/revise"
        actor: NetworkStrategist
        preconditions:
          - "X-User-ID == case.created_by_user_id"
          - "when receiving_branch_id is supplied, Branch(receiving_branch_id).status == ACTIVE and receiving_branch_id != case.closing_branch_id"
        side_effects:
          - "applies supplied planned_closure_date and/or receiving_branch_id"
          - "increments ConsolidationCase.version by 1"
        note: "The DRAFT -> SUBMITTED -> RETURNED -> DRAFT cycle may run at most REVISION_LIMIT (3) times."
      - from: APPROVED
        to: NOTICE_FILED
        trigger: "POST /distribution/closure-notices with notice_type == REGULATOR"
        actor: ComplianceOfficer
        preconditions:
          - "the case's non-SUPERSEDED CommunityImpactAssessment exists and has status == FINALIZED"
          - "(effective_closure_date - clock_today) in calendar days >= case.notice_required_days"
          - "case.planned_closure_date >= effective_closure_date"
          - "no other ClosureNotice with notice_type == REGULATOR and status IN {FILED, EFFECTIVE} in the same MarketArea has an occupation interval that collides with [filed_on, effective_closure_date + NOTICE_BUFFER_DAYS] (calculations.notice_market_window_conflict)"
        side_effects:
          - "Branch(case.closing_branch_id) transitions UNDER_REVIEW -> CLOSURE_SCHEDULED"
          - "increments ConsolidationCase.version by 1"
      - from: NOTICE_FILED
        to: APPROVED
        trigger: "POST /distribution/closure-notices/{noticeId}/withdraw"
        actor: ComplianceOfficer
        preconditions:
          - "notice.notice_type == REGULATOR and notice.status IN {FILED, EFFECTIVE}"
          - "case.status == NOTICE_FILED"
        side_effects:
          - "notice.status = WITHDRAWN"
          - "Branch(case.closing_branch_id) transitions CLOSURE_SCHEDULED -> UNDER_REVIEW"
          - "the case's CommunityImpactAssessment transitions FINALIZED -> REOPENED"
          - "every CustomerTransitionCampaign of this case with status IN {PLANNED, LAUNCHED} transitions to CANCELLED"
          - "increments ConsolidationCase.version by 1"
      - from: NOTICE_FILED
        to: CLOSURE_EXECUTED
        trigger: "POST /distribution/consolidation-cases/{caseId}/execute-closure"
        actor: ComplianceOfficer
        preconditions:
          - "the case's REGULATOR ClosureNotice has status IN {FILED, EFFECTIVE} and clock_today >= notice.effective_closure_date"
          - "Branch(case.receiving_branch_id).status == ACTIVE"
          - "the case has at least one CustomerTransitionCampaign with status == LAUNCHED"
          - "case.pending_disposition_count == 0"
          - "at least one PropertyDisposition exists with branch_id == case.closing_branch_id"
        side_effects:
          - "case.pre_close_deposits_cents = Branch(closing).deposit_balance_cents; case.executed_on = clock_today"
          - "CASCADE hop 1: Branch(closing) transitions CLOSURE_SCHEDULED -> CLOSED (its deposit_balance_cents is zeroed and pre_close_deposits_cents stamped)"
          - "Branch(receiving).deposit_balance_cents += case.forecast_retained_deposits_cents; Branch(receiving).transferred_in_deposits_cents += case.forecast_retained_deposits_cents; increments Branch(receiving).version by 1"
          - "MarketArea.absorbed_deposits_cents += case.forecast_retained_deposits_cents; MarketArea.cumulative_runoff_deposits_cents += case.forecast_runoff_cents"
          - "every StaffDisposition of this case with disposition_state == OFFER_ACCEPTED transitions to COMPLETED"
          - "every CustomerTransitionCampaign of this case with status == LAUNCHED transitions to COMPLETED"
          - "CASCADE hop 2 (inside the Branch(closing) -> CLOSED transition): each PENDING PropertyDisposition of the closing branch transitions to MARKETED and stamps marketing_started_on"
          - "CASCADE hop 3: because that PropertyDisposition entered MARKETED, its annual_carry_cents is recomputed with MARKETING_CARRY_ANNUAL_CENTS included, which forces recomputation of case.gross_annual_savings_cents, transition_incentive_rate_bps, transition_incentive_cents and net_annual_savings_cents"
          - "CASCADE hop 4: because the recomputed case.net_annual_savings_cents < SAVINGS_FLOOR_CENTS, case.governance_flag = SAVINGS_WATCH and MarketArea.flagged_case_count += 1"
          - "increments ConsolidationCase.version by 1"
      - from: CLOSURE_EXECUTED
        to: POST_CLOSE_MONITORING
        trigger: "POST /distribution/deposit-observations with subject_type == CONSOLIDATION_CASE for this case"
        actor: system
        preconditions:
          - "observation.month_index > case.last_observed_month_index"
        side_effects:
          - "case.last_observed_month_index = observation.month_index; case.cumulative_variance_bps = observation.variance_bps"
          - "CASCADE hop 1: case.monitoring_posture = ON_TRACK when observation.variance_bps > RUNOFF_BREACH_BPS, otherwise REMEDIATION (calculations.runoff_variance)"
          - "CASCADE hop 2: when case.monitoring_posture enters REMEDIATION in this request, MarketArea.remediation_case_count += 1; when it leaves REMEDIATION for RESOLVED, MarketArea.remediation_case_count -= 1"
          - "CASCADE hop 3: MarketArea.de_novo_hold is re-derived as (remediation_case_count >= 1) in the same request"
          - "CASCADE hop 4: when de_novo_hold flips false -> true, every DeNovoSitePlan of that market in status APPROVED transitions to HELD; when it flips true -> false, every HELD plan returns to APPROVED"
          - "increments ConsolidationCase.version by 1"
      - from: CLOSURE_EXECUTED
        to: UNWOUND
        trigger: "POST /distribution/consolidation-cases/{caseId}/unwind-closure"
        actor: ComplianceOfficer
        preconditions:
          - "case.last_observed_month_index == 0"
          - "clock_today <= case.executed_on + UNWIND_WINDOW_DAYS (30)"
        side_effects:
          - "Branch(closing) transitions CLOSED -> ACTIVE and its deposit_balance_cents is restored from pre_close_deposits_cents"
          - "Branch(receiving).deposit_balance_cents -= case.forecast_retained_deposits_cents; Branch(receiving).transferred_in_deposits_cents -= case.forecast_retained_deposits_cents"
          - "MarketArea.absorbed_deposits_cents -= case.forecast_retained_deposits_cents; MarketArea.cumulative_runoff_deposits_cents -= case.forecast_runoff_cents"
          - "the case's REGULATOR ClosureNotice transitions to WITHDRAWN"
          - "every MARKETED PropertyDisposition of the closing branch reverts to PENDING, its annual_carry_cents is recomputed without MARKETING_CARRY_ANNUAL_CENTS, and marketing_started_on is cleared"
          - "when case.governance_flag == SAVINGS_WATCH it resets to NONE and MarketArea.flagged_case_count -= 1"
          - "increments ConsolidationCase.version by 1"
      - from: POST_CLOSE_MONITORING
        to: CLOSED_OUT
        trigger: "POST /distribution/consolidation-cases/{caseId}/close-out"
        actor: NetworkOpsAdmin
        preconditions:
          - "case.last_observed_month_index >= MONITORING_MONTHS (12)"
          - "case.monitoring_posture IN {ON_TRACK, RESOLVED}"
        side_effects:
          - "increments ConsolidationCase.version by 1"

  - entity: StaffDisposition
    initial_state: PROPOSED
    terminal_states: [SEVERED, COMPLETED]
    transitions:
      - from: PROPOSED
        to: OFFER_ACCEPTED
        trigger: "POST /distribution/staff-dispositions/{dispositionId}/accept"
        actor: HRPartner
        preconditions:
          - "disposition.proposed_disposition == REDEPLOYMENT"
          - "disposition.notification_state == NOTIFIED"
          - "disposition.target_branch_id is not null and Branch(target_branch_id).status == ACTIVE"
          - "case.status IN {APPROVED, NOTICE_FILED}"
        side_effects:
          - "Branch(source_branch_id).fte_count -= 1 and increments that Branch.version by 1"
          - "Branch(target_branch_id).fte_count += 1 and increments that Branch.version by 1"
          - "case.redeployed_fte_count += 1; case.pending_disposition_count -= 1; increments ConsolidationCase.version by 1"
          - "increments StaffDisposition.version by 1"
      - from: OFFER_ACCEPTED
        to: PROPOSED
        trigger: "POST /distribution/staff-dispositions/{dispositionId}/rescind"
        actor: HRPartner
        preconditions:
          - "case.status IN {APPROVED, NOTICE_FILED}"
        side_effects:
          - "Branch(source_branch_id).fte_count += 1 and increments that Branch.version by 1"
          - "Branch(target_branch_id).fte_count -= 1 and increments that Branch.version by 1"
          - "case.redeployed_fte_count -= 1; case.pending_disposition_count += 1; increments ConsolidationCase.version by 1"
          - "increments StaffDisposition.version by 1"
        note: "Exact inverse of the accept transition; the network headcount invariant of calculations.headcount_conservation_invariant must hold across the pair."
      - from: PROPOSED
        to: SEVERED
        trigger: "POST /distribution/staff-dispositions/{dispositionId}/sever"
        actor: HRPartner
        preconditions:
          - "disposition.proposed_disposition == SEVERANCE"
          - "disposition.notification_state == NOTIFIED"
          - "clock_today >= disposition.notified_on + WARN_NOTICE_DAYS (60)"
          - "case.status IN {APPROVED, NOTICE_FILED}"
        side_effects:
          - "disposition.severed_on = clock_today"
          - "Branch(source_branch_id).fte_count -= 1 and increments that Branch.version by 1"
          - "case.severed_fte_count += 1; case.pending_disposition_count -= 1; increments ConsolidationCase.version by 1"
          - "increments StaffDisposition.version by 1"
      - from: OFFER_ACCEPTED
        to: COMPLETED
        trigger: "POST /distribution/consolidation-cases/{caseId}/execute-closure"
        actor: system
        preconditions:
          - "case.status transitions NOTICE_FILED -> CLOSURE_EXECUTED"
        side_effects:
          - "case.redeployed_fte_count is unchanged (COMPLETED is counted alongside OFFER_ACCEPTED)"
          - "increments StaffDisposition.version by 1"
      - from: PENDING
        to: NOTIFIED
        trigger: "POST /distribution/staff-dispositions/{dispositionId}/notify"
        actor: HRPartner
        preconditions:
          - "disposition.notification_state == PENDING"
          - "case.status IN {APPROVED, NOTICE_FILED}"
        side_effects:
          - "disposition.notified_on = clock_today"
          - "increments StaffDisposition.version by 1"
        note: "DIMENSION B (notification_state). This axis is independent of disposition_state: notify is legal while disposition_state is PROPOSED or OFFER_ACCEPTED and never changes disposition_state."

  - entity: PropertyDisposition
    initial_state: PENDING
    terminal_states: [DISPOSED]
    transitions:
      - from: PENDING
        to: MARKETED
        trigger: "POST /distribution/consolidation-cases/{caseId}/execute-closure (system cascade through Branch -> CLOSED)"
        actor: system
        preconditions:
          - "Branch(branch_id).status becomes CLOSED in this request"
        side_effects:
          - "marketing_started_on = clock_today"
          - "annual_carry_cents recomputed with MARKETING_CARRY_ANNUAL_CENTS added (calculations.property_carry_cost)"
          - "increments PropertyDisposition.version by 1"
      - from: MARKETED
        to: HOLDOVER
        trigger: "POST /_clock/set_current_utc advancing the clock past lease_end_date"
        actor: system
        preconditions:
          - "tenure_class == LEASED"
          - "status == MARKETED"
          - "lease_end_date < new clock date"
        side_effects:
          - "annual_carry_cents recomputed with HOLDOVER_PREMIUM_BPS applied to rent (calculations.property_carry_cost)"
          - "case.gross_annual_savings_cents / transition_incentive_* / net_annual_savings_cents recomputed"
          - "increments PropertyDisposition.version by 1"
      - from: MARKETED
        to: ASSIGNMENT_PENDING
        trigger: "POST /distribution/property-dispositions/{dispositionId}/contract"
        actor: RealEstateManager
        preconditions:
          - "tenure_class == LEASED"
          - "case.status IN {NOTICE_FILED, CLOSURE_EXECUTED, POST_CLOSE_MONITORING}"
        side_effects:
          - "records counterparty_ref, agreed_amount_cents, selling_costs_cents"
          - "increments PropertyDisposition.version by 1"
        note: "LEASE fork of the diamond."
      - from: HOLDOVER
        to: ASSIGNMENT_PENDING
        trigger: "POST /distribution/property-dispositions/{dispositionId}/contract"
        actor: RealEstateManager
        preconditions:
          - "tenure_class == LEASED"
          - "case.status IN {NOTICE_FILED, CLOSURE_EXECUTED, POST_CLOSE_MONITORING}"
        side_effects:
          - "records counterparty_ref, agreed_amount_cents, selling_costs_cents"
          - "increments PropertyDisposition.version by 1"
      - from: MARKETED
        to: SALE_PENDING
        trigger: "POST /distribution/property-dispositions/{dispositionId}/contract"
        actor: RealEstateManager
        preconditions:
          - "tenure_class == OWNED"
          - "case.status IN {NOTICE_FILED, CLOSURE_EXECUTED, POST_CLOSE_MONITORING}"
        side_effects:
          - "records counterparty_ref, agreed_amount_cents, selling_costs_cents"
          - "increments PropertyDisposition.version by 1"
        note: "OWNED fork of the diamond; the two forks carry different settlement arithmetic."
      - from: ASSIGNMENT_PENDING
        to: DISPOSED
        trigger: "POST /distribution/property-dispositions/{dispositionId}/settle"
        actor: RealEstateManager
        preconditions:
          - "status == ASSIGNMENT_PENDING"
        side_effects:
          - "settled_on = clock_today"
          - "net_disposition_cents = LEASE branch of calculations.property_disposition_net"
          - "annual_carry_cents = 0 and case savings fields recomputed"
          - "increments PropertyDisposition.version by 1"
      - from: SALE_PENDING
        to: DISPOSED
        trigger: "POST /distribution/property-dispositions/{dispositionId}/settle"
        actor: RealEstateManager
        preconditions:
          - "status == SALE_PENDING"
        side_effects:
          - "settled_on = clock_today"
          - "net_disposition_cents = OWNED branch of calculations.property_disposition_net"
          - "annual_carry_cents = 0 and case savings fields recomputed"
          - "increments PropertyDisposition.version by 1"
        note: "Join point: both forks converge on DISPOSED with different net_disposition_cents arithmetic."
      - from: MARKETED
        to: PENDING
        trigger: "POST /distribution/consolidation-cases/{caseId}/unwind-closure"
        actor: system
        preconditions:
          - "case.status == CLOSURE_EXECUTED"
        side_effects:
          - "marketing_started_on cleared; annual_carry_cents recomputed without MARKETING_CARRY_ANNUAL_CENTS"
          - "increments PropertyDisposition.version by 1"

  - entity: ClosureNotice
    initial_state: FILED
    terminal_states: [WITHDRAWN]
    transitions:
      - from: FILED
        to: EFFECTIVE
        trigger: "POST /_clock/set_current_utc advancing the clock to or past effective_closure_date"
        actor: system
        preconditions:
          - "status == FILED"
          - "effective_closure_date <= new clock date"
        side_effects:
          - "increments ClosureNotice.version by 1"
      - from: FILED
        to: WITHDRAWN
        trigger: "POST /distribution/closure-notices/{noticeId}/withdraw"
        actor: ComplianceOfficer
        preconditions:
          - "case.status == NOTICE_FILED"
        side_effects:
          - "case transitions NOTICE_FILED -> APPROVED with its documented cascade"
          - "increments ClosureNotice.version by 1"
      - from: EFFECTIVE
        to: WITHDRAWN
        trigger: "POST /distribution/closure-notices/{noticeId}/withdraw"
        actor: ComplianceOfficer
        preconditions:
          - "case.status == NOTICE_FILED"
        side_effects:
          - "case transitions NOTICE_FILED -> APPROVED with its documented cascade"
          - "increments ClosureNotice.version by 1"

  - entity: CommunityImpactAssessment
    initial_state: DRAFT
    terminal_states: [SUPERSEDED]
    transitions:
      - from: DRAFT
        to: FINALIZED
        trigger: "POST /distribution/impact-assessments/{assessmentId}/finalize"
        actor: ComplianceOfficer
        preconditions:
          - "case.status IN {DRAFT, SUBMITTED, APPROVED}"
        side_effects:
          - "finalized_on = clock_today"
          - "case.impact_tier = assessment.impact_tier; case.notice_required_days = assessment.notice_required_days; increments ConsolidationCase.version by 1"
          - "increments CommunityImpactAssessment.version by 1"
      - from: FINALIZED
        to: REOPENED
        trigger: "POST /distribution/closure-notices/{noticeId}/withdraw"
        actor: system
        preconditions:
          - "case.status == NOTICE_FILED"
        side_effects:
          - "increments CommunityImpactAssessment.version by 1"
      - from: REOPENED
        to: FINALIZED
        trigger: "POST /distribution/impact-assessments/{assessmentId}/finalize"
        actor: ComplianceOfficer
        preconditions:
          - "case.status == APPROVED"
        side_effects:
          - "finalized_on = clock_today"
          - "case.impact_tier and case.notice_required_days refreshed; increments ConsolidationCase.version by 1"
          - "increments CommunityImpactAssessment.version by 1"
        note: "Revision cycle FINALIZED -> REOPENED -> FINALIZED, unbounded."
      - from: DRAFT
        to: SUPERSEDED
        trigger: "POST /distribution/consolidation-cases/{caseId}/impact-assessments (a newer assessment for the same case) or decision == REJECT"
        actor: system
        preconditions:
          - "a non-SUPERSEDED assessment already exists for the case"
        side_effects:
          - "increments CommunityImpactAssessment.version by 1"
      - from: FINALIZED
        to: SUPERSEDED
        trigger: "POST /distribution/consolidation-cases/{caseId}/impact-assessments (a newer assessment for the same case) or decision == REJECT"
        actor: system
        preconditions:
          - "case.status != NOTICE_FILED"
        side_effects:
          - "case.impact_tier resets to UNASSESSED and case.notice_required_days resets to 0 until a newer assessment is finalized"
          - "increments CommunityImpactAssessment.version by 1"
      - from: REOPENED
        to: SUPERSEDED
        trigger: "POST /distribution/consolidation-cases/{caseId}/impact-assessments (a newer assessment for the same case)"
        actor: system
        preconditions:
          - "case.status IN {APPROVED, SUBMITTED, DRAFT}"
        side_effects:
          - "increments CommunityImpactAssessment.version by 1"

  - entity: CustomerTransitionCampaign
    initial_state: PLANNED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: PLANNED
        to: LAUNCHED
        trigger: "POST /distribution/transition-campaigns/{campaignId}/launch"
        actor: ComplianceOfficer
        preconditions:
          - "case.status == NOTICE_FILED"
          - "clock_today < campaign.wave_start_date"
          - "campaign.wave_start_date >= the case's REGULATOR notice.filed_on + CAMPAIGN_LEAD_DAYS (14)"
        side_effects:
          - "launched_on = clock_today"
          - "increments CustomerTransitionCampaign.version by 1"
      - from: LAUNCHED
        to: COMPLETED
        trigger: "POST /distribution/consolidation-cases/{caseId}/execute-closure"
        actor: system
        preconditions:
          - "case.status transitions NOTICE_FILED -> CLOSURE_EXECUTED"
        side_effects:
          - "increments CustomerTransitionCampaign.version by 1"
      - from: PLANNED
        to: CANCELLED
        trigger: "POST /distribution/closure-notices/{noticeId}/withdraw"
        actor: system
        preconditions:
          - "case.status == NOTICE_FILED"
        side_effects:
          - "the campaign's wave interval is released from Branch(receiving_branch_id)'s wave calendar"
          - "increments CustomerTransitionCampaign.version by 1"
      - from: LAUNCHED
        to: CANCELLED
        trigger: "POST /distribution/closure-notices/{noticeId}/withdraw"
        actor: system
        preconditions:
          - "case.status == NOTICE_FILED"
        side_effects:
          - "the campaign's wave interval is released from Branch(receiving_branch_id)'s wave calendar"
          - "increments CustomerTransitionCampaign.version by 1"

  - entity: DeNovoSitePlan
    initial_state: SITE_IDENTIFIED
    terminal_states: [REJECTED, RAMP_MET]
    transitions:
      - from: SITE_IDENTIFIED
        to: APPROVED
        trigger: "POST /distribution/de-novo-plans/{planId}/decision with decision == APPROVE"
        actor: ConsolidationApprover
        preconditions:
          - "plan.site_score >= SITE_SCORE_MIN"
          - "MarketArea.saturation_tier != OVER_BRANCHED"
          - "MarketArea.de_novo_hold == false"
        side_effects:
          - "increments DeNovoSitePlan.version by 1"
      - from: SITE_IDENTIFIED
        to: REJECTED
        trigger: "POST /distribution/de-novo-plans/{planId}/decision with decision == REJECT"
        actor: ConsolidationApprover
        preconditions: []
        side_effects:
          - "increments DeNovoSitePlan.version by 1"
      - from: APPROVED
        to: HELD
        trigger: "POST /distribution/deposit-observations that flips the market's de_novo_hold to true"
        actor: system
        preconditions:
          - "MarketArea.de_novo_hold transitions false -> true in this request"
        side_effects:
          - "increments DeNovoSitePlan.version by 1"
        note: "CASCADE hop 3 of the runoff-breach chain."
      - from: HELD
        to: APPROVED
        trigger: "POST /distribution/deposit-observations that flips the market's de_novo_hold to false"
        actor: system
        preconditions:
          - "MarketArea.remediation_case_count reaches 0 in this request"
        side_effects:
          - "increments DeNovoSitePlan.version by 1"
      - from: APPROVED
        to: OPENED
        trigger: "POST /distribution/de-novo-plans/{planId}/open"
        actor: NetworkStrategist
        preconditions:
          - "MarketArea.de_novo_hold == false"
          - "proposed_branch_code is not used by any Branch"
        side_effects:
          - "mints a Branch in this market with branch_code = proposed_branch_code, deposit_balance_cents = 0, fte_count = 0, then transitions it ACTIVE -> DE_NOVO_RAMPING"
          - "plan.opened_branch_id = the new Branch.id; plan.opened_on = clock_today"
          - "MarketArea.own_branch_count += 1 with branch_density_per_100k and saturation_tier recomputed"
          - "increments DeNovoSitePlan.version by 1"
      - from: OPENED
        to: RAMP_TRACKING
        trigger: "POST /distribution/deposit-observations with subject_type == DE_NOVO_PLAN"
        actor: system
        preconditions:
          - "observation.month_index > plan.ramp_month_index"
        side_effects:
          - "plan.ramp_month_index, ramp_attainment_bps and ramp_status refreshed (calculations.de_novo_ramp_attainment)"
          - "increments DeNovoSitePlan.version by 1"
      - from: RAMP_TRACKING
        to: RAMP_REMEDIATION
        trigger: "POST /distribution/deposit-observations with subject_type == DE_NOVO_PLAN"
        actor: system
        preconditions:
          - "plan.ramp_attainment_bps < RAMP_AT_RISK_BPS after refresh"
        side_effects:
          - "plan.ramp_status = AT_RISK"
          - "increments DeNovoSitePlan.version by 1"
      - from: RAMP_REMEDIATION
        to: RAMP_TRACKING
        trigger: "POST /distribution/deposit-observations with subject_type == DE_NOVO_PLAN"
        actor: system
        preconditions:
          - "plan.ramp_attainment_bps >= RAMP_AT_RISK_BPS after refresh"
        side_effects:
          - "increments DeNovoSitePlan.version by 1"
      - from: RAMP_TRACKING
        to: RAMP_MET
        trigger: "POST /distribution/deposit-observations with subject_type == DE_NOVO_PLAN and month_index == 12"
        actor: system
        preconditions:
          - "plan.ramp_attainment_bps >= RAMP_MET_BPS after refresh"
        side_effects:
          - "plan.ramp_status = MET"
          - "Branch(plan.opened_branch_id) transitions DE_NOVO_RAMPING -> ACTIVE"
          - "increments DeNovoSitePlan.version by 1"

concurrency_rules:
  - rule_id: case-create-stale-branch
    parent_entity: Branch
    write_endpoint: "POST /distribution/consolidation-cases"
    occ_field: "expected_branch_version"
    description: |
      Creating a ConsolidationCase against a closing Branch whose version has advanced since the
      client last observed it is rejected with a stale-version error. This captures the case where
      an earlier create already produced a DRAFT case for the same branch (which the product allows
      a newer case to supersede under state_machines.Branch ACTIVE -> UNDER_REVIEW), so the current
      writer's view of the branch — including its status and its outstanding case set — is stale.
    error_id: ERR_STALE_BRANCH_VERSION
    http_status: 412
  - rule_id: forecast-create-stale-case
    parent_entity: ConsolidationCase
    write_endpoint: "POST /distribution/retention-forecasts"
    occ_field: "expected_case_version"
    description: |
      Creating a RetentionForecast against a ConsolidationCase whose version has advanced since the
      client last observed it is rejected with a stale-version error. A new forecast legitimately
      supersedes the case's prior ACTIVE forecast and rewrites the case's retention and savings
      fields, so a writer holding an out-of-date case version would silently overwrite a newer model.
    error_id: ERR_STALE_CASE_VERSION
    http_status: 412

calculations:
  - name: competitor_density_index
    trigger: "on POST /distribution/market-areas (creation of the MarketArea)"
    algorithm: aggregation
    formula: |
      competitor_density_index = round_half_up(competitor_branch_count * 100000 / population)
    input_set: "the MarketArea row's own input fields only"
    constants: {}
    precision: "integer basis of rival branches per 100k residents, round_half_up"

  - name: market_saturation_tier
    trigger: "on POST /distribution/market-areas, on POST /distribution/branches, and on every Branch.status transition into or out of {ACTIVE, UNDER_REVIEW, CLOSURE_SCHEDULED, DE_NOVO_RAMPING}"
    algorithm: threshold
    formula: |
      own_branch_count = count(Branch WHERE market_area_id == market.id
                               AND status IN {ACTIVE, UNDER_REVIEW, CLOSURE_SCHEDULED, DE_NOVO_RAMPING})
      branch_density_per_100k = round_half_up((own_branch_count + competitor_branch_count) * 100000 / population)
      saturation_tier = OVER_BRANCHED   if branch_density_per_100k >= OVER_BRANCHED_MIN
                      = SATURATED       if SATURATED_MIN <= branch_density_per_100k < OVER_BRANCHED_MIN
                      = UNDER_BRANCHED  if branch_density_per_100k < SATURATED_MIN
    input_set: "Branch rows of this market whose status is in the four listed values; CLOSED branches are excluded"
    constants:
      OVER_BRANCHED_MIN: 30
      SATURATED_MIN: 15
    precision: "integer density, round_half_up; boundaries are inclusive at the lower edge (>=)"

  - name: branch_performance_score
    trigger: "on POST /distribution/branches/{branchId}/performance-snapshots (refreshes Branch.performance_score_bps and Branch.performance_band under Branch.scoring_variant) and on GET /distribution/branches/{branchId}/performance-score (computes the requested variant without persisting)"
    algorithm: weighted_scoring
    formula: |
      STEP 1 — per-snapshot composite (persisted on PerformanceSnapshot.composite_score_bps):
        deposit_factor      = min(10000, round_half_up(deposits_cents * 10000 / DEPOSIT_TARGET_CENTS))
        transaction_factor  = min(10000, round_half_up(transaction_count * 10000 / TXN_TARGET))
        digital_factor      = min(10000, digital_active_bps)
        efficiency_ratio_bps = 20000 if revenue_cents == 0
                               else round_half_up(noninterest_expense_cents * 10000 / revenue_cents)
        profitability_factor = max(0, min(10000,
              round_half_up((EFFICIENCY_CEILING_BPS - efficiency_ratio_bps) * 10000
                            / (EFFICIENCY_CEILING_BPS - EFFICIENCY_FLOOR_BPS))))
        composite_score_bps = round_half_up((W_DEPOSIT * deposit_factor + W_TXN * transaction_factor
                              + W_DIGITAL * digital_factor + W_PROFIT * profitability_factor) / 10000)
      STEP 2 — variant selection over the branch's snapshot history:
        ordered = PerformanceSnapshot WHERE branch_id == branch.id
                  ORDER BY period_end_date DESC, created_at DESC
        POINT_IN_TIME : performance_score_bps = ordered[0].composite_score_bps
        TRAILING_BLEND: take ordered[0..2] (up to three), weights = TRAILING_WEIGHTS_BPS prefix
                        [5000, 3000, 2000] truncated to the number available and renormalized:
                        w_i = TRAILING_WEIGHTS_BPS[i]; W = sum(w_i over available i)
                        performance_score_bps = round_half_up(
                            sum(w_i * ordered[i].composite_score_bps) / W)
                        Each ordered[i].composite_score_bps is ALREADY rounded (STEP 1); the blend
                        rounds exactly once more. No other rounding order is permitted.
        With zero snapshots both variants are undefined: Branch.performance_band == UNSCORED,
        Branch.performance_score_bps == null, and GET .../performance-score returns
        ERR_NO_PERFORMANCE_HISTORY.
      STEP 3 — band:
        performance_band = CORE                     if performance_score_bps >= BAND_CORE_MIN
                         = STABLE                   if BAND_STABLE_MIN <= score < BAND_CORE_MIN
                         = WATCH                    if BAND_WATCH_MIN <= score < BAND_STABLE_MIN
                         = CONSOLIDATION_CANDIDATE  if score < BAND_WATCH_MIN
    input_set: "every PerformanceSnapshot of the branch; snapshots are immutable and never excluded"
    constants:
      DEPOSIT_TARGET_CENTS: 12000000000
      TXN_TARGET: 9000
      EFFICIENCY_CEILING_BPS: 9000
      EFFICIENCY_FLOOR_BPS: 5000
      W_DEPOSIT: 3500
      W_TXN: 2000
      W_DIGITAL: 1500
      W_PROFIT: 3000
      TRAILING_WEIGHTS_BPS: [5000, 3000, 2000]
      BAND_CORE_MIN: 7000
      BAND_STABLE_MIN: 4000
      BAND_WATCH_MIN: 2000
    precision: "all factors and composites are whole basis points, round_half_up at each named rounding step"
    variants:
      - name: POINT_IN_TIME
        when: "Branch.scoring_variant == POINT_IN_TIME, or GET .../performance-score?scoring_variant=POINT_IN_TIME"
        difference: "uses only the most recent snapshot; ignores the two prior periods entirely"
      - name: TRAILING_BLEND
        when: "Branch.scoring_variant == TRAILING_BLEND (default), or GET .../performance-score?scoring_variant=TRAILING_BLEND"
        difference: "blends the three most recent snapshot composites at 50/30/20; for identical snapshot histories this yields a different score, and can yield a different performance_band, than POINT_IN_TIME"

  - name: receiving_branch_selector
    trigger: "on POST /distribution/consolidation-cases when receiving_branch_id is omitted from the request body"
    algorithm: weighted_scoring
    formula: |
      candidates = Branch WHERE market_area_id == closing.market_area_id
                   AND id != closing.id
                   AND status == ACTIVE
                   AND branch_type IN {FULL_SERVICE, LIMITED_SERVICE}
                   AND deposit_balance_cents >= closing.deposit_balance_cents * ABSORB_RATIO_BPS / 10000
      rank_key   = (deposit_balance_cents DESC, monthly_transaction_count DESC, created_at ASC)
      selected   = first row under rank_key
      empty candidate set -> the request fails with ERR_NO_ELIGIBLE_RECEIVING_BRANCH
    input_set: "ACTIVE peer branches of the same MarketArea with at least ABSORB_RATIO_BPS of the closing branch's deposits; UNDER_REVIEW, CLOSURE_SCHEDULED, CLOSED and DE_NOVO_RAMPING branches are never candidates"
    constants:
      ABSORB_RATIO_BPS: 5000
    precision: "exact integer comparisons; the final tie-break is created_at ASC (never id)"

  - name: deposit_retention_forecast
    trigger: "on POST /distribution/retention-forecasts (writes the forecast row and refreshes ConsolidationCase.forecast_retention_bps / forecast_retained_deposits_cents / forecast_runoff_cents)"
    algorithm: forward_looking
    formula: |
      baseline = Branch(case.closing_branch_id).deposit_balance_cents   (copied to baseline_deposits_cents)
      g        = Branch(case.closing_branch_id).digital_adoption_bps    (copied to digital_adoption_bps)

      VARIANT DISTANCE_DECAY:
        decay_bps      = DECAY_PER_MILE_BPS * max(0, floor(distance_miles) - 1)
        base_retention = max(RETENTION_FLOOR_BPS, DECAY_BASE_BPS - decay_bps)
        digital_uplift = min(DIGITAL_UPLIFT_CAP_BPS, round_half_up(g * DIGITAL_UPLIFT_SHARE_BPS / 10000))
        retention_bps  = min(RETENTION_CEILING_BPS, base_retention + digital_uplift)

      VARIANT SEGMENT_MIX:
        mix_bps        = round_half_up((retail_share_bps * RETAIL_RETENTION_BPS
                                      + small_business_share_bps * SMALL_BUSINESS_RETENTION_BPS
                                      + wealth_share_bps * WEALTH_RETENTION_BPS) / 10000)
        distance_penalty_bps = min(SEGMENT_PENALTY_CAP_BPS,
                                   SEGMENT_PENALTY_PER_MILE_BPS * max(0, ceil(distance_miles) - 1))
        retention_bps  = min(RETENTION_CEILING_BPS,
                             round_half_up(mix_bps * (10000 - distance_penalty_bps) / 10000))

      retained_deposits_cents = round_half_up(baseline * retention_bps / 10000)
      runoff_cents            = baseline - retained_deposits_cents        (exact complement, no rounding)
      case.forecast_retention_bps          = retention_bps
      case.forecast_retained_deposits_cents = retained_deposits_cents
      case.forecast_runoff_cents            = runoff_cents
    input_set: "the single ACTIVE RetentionForecast of the case; SUPERSEDED forecasts never feed case fields"
    constants:
      DECAY_BASE_BPS: 9200
      DECAY_PER_MILE_BPS: 400
      RETENTION_FLOOR_BPS: 5000
      RETENTION_CEILING_BPS: 9800
      DIGITAL_UPLIFT_SHARE_BPS: 1500
      DIGITAL_UPLIFT_CAP_BPS: 800
      RETAIL_RETENTION_BPS: 8200
      SMALL_BUSINESS_RETENTION_BPS: 7000
      WEALTH_RETENTION_BPS: 9100
      SEGMENT_PENALTY_PER_MILE_BPS: 250
      SEGMENT_PENALTY_CAP_BPS: 2500
    precision: "whole basis points and whole cents, round_half_up; runoff is the exact complement of retained so deposits are conserved"
    variants:
      - name: DISTANCE_DECAY
        when: "model_variant == DISTANCE_DECAY"
        difference: "distance is consumed with floor(); digital adoption adds an additive uplift; segment mix is ignored"
      - name: SEGMENT_MIX
        when: "model_variant == SEGMENT_MIX"
        difference: "distance is consumed with ceil() as a multiplicative penalty on a segment-weighted base; digital adoption is ignored. For identical inputs the two variants return different retention_bps and different retained_deposits_cents"

  - name: severance_pool
    trigger: "on POST /distribution/staff-dispositions (per-row severance_amount_cents) and on POST /distribution/consolidation-cases/{caseId}/submit and every StaffDisposition transition (case.severance_pool_cents)"
    algorithm: aggregation
    formula: |
      PER ROW (SEVERANCE only; REDEPLOYMENT rows get severance_weeks = 0, weekly_pay_cents = 0,
      severance_amount_cents = 0):
        service_years    = floor(tenure_months / 12)
        severance_weeks  = min(SEVERANCE_WEEKS_CAP, max(SEVERANCE_WEEKS_FLOOR, 2 * service_years))
        weekly_pay_cents = round_half_up(annual_salary_cents / 52)          <-- ROUND HERE, FIRST
        severance_amount_cents = severance_weeks * weekly_pay_cents + OUTPLACEMENT_STIPEND_CENTS

      POOL:
        case.severance_pool_cents = sum(severance_amount_cents
              over StaffDisposition WHERE consolidation_case_id == case.id
              AND proposed_disposition == SEVERANCE
              AND disposition_state IN {PROPOSED, SEVERED})

      PINNED ROUNDING ORDER: round each employee's weekly pay to whole cents FIRST, multiply by that
      employee's weeks, then sum across employees (round-then-sum). Summing annual salaries first and
      dividing the aggregate by 52 (sum-then-round) is explicitly NOT the rule and produces a
      different pool; implementations must reproduce the round-then-sum result.
    input_set: "SEVERANCE dispositions of the case in disposition_state PROPOSED or SEVERED; REDEPLOYMENT rows and rows whose disposition_state is OFFER_ACCEPTED or COMPLETED contribute 0"
    constants:
      SEVERANCE_WEEKS_FLOOR: 4
      SEVERANCE_WEEKS_CAP: 26
      OUTPLACEMENT_STIPEND_CENTS: 120000
    precision: "whole cents, round_half_up, applied once per employee at the weekly-pay step"

  - name: net_consolidation_savings
    trigger: "on POST /distribution/consolidation-cases/{caseId}/submit, on POST /distribution/retention-forecasts, and on every PropertyDisposition status transition that changes annual_carry_cents"
    algorithm: constraint_propagation
    formula: |
      EVALUATION ORDER IS PINNED — steps run exactly once, top to bottom, with no iteration:
        1. expense_avoided_cents = Branch(case.closing_branch_id).annual_noninterest_expense_cents
        2. revenue_attrition_cents = round_half_up(case.forecast_runoff_cents * DEPOSIT_SPREAD_BPS / 10000)
        3. property_carry_cents = sum(annual_carry_cents over PropertyDisposition
                                      WHERE consolidation_case_id == case.id)
        4. gross_annual_savings_cents = expense_avoided_cents - revenue_attrition_cents - property_carry_cents
        5. transition_incentive_rate_bps =
               INCENTIVE_RATE_HIGH_BPS if gross_annual_savings_cents >= INCENTIVE_TIER_HIGH_CENTS
               INCENTIVE_RATE_MID_BPS  if INCENTIVE_TIER_MID_CENTS <= gross_annual_savings_cents
                                            < INCENTIVE_TIER_HIGH_CENTS
               INCENTIVE_RATE_LOW_BPS  if gross_annual_savings_cents < INCENTIVE_TIER_MID_CENTS
        6. transition_incentive_cents = round_half_up(case.forecast_retained_deposits_cents
                                        * transition_incentive_rate_bps / 10000)
        7. net_annual_savings_cents = gross_annual_savings_cents - transition_incentive_cents

      The tier in step 5 is selected from the step-4 GROSS value and is never re-derived from the
      step-7 NET value, even though net is the figure the governance floor is tested against. The
      dependency looks circular (incentive depends on savings tier; savings depend on incentive)
      and is resolved solely by this pinned order.
    input_set: "the case's closing Branch, its ACTIVE RetentionForecast fields already mirrored onto the case, and every PropertyDisposition of the case regardless of status"
    constants:
      DEPOSIT_SPREAD_BPS: 225
      INCENTIVE_TIER_HIGH_CENTS: 100000000
      INCENTIVE_TIER_MID_CENTS: 40000000
      INCENTIVE_RATE_HIGH_BPS: 12
      INCENTIVE_RATE_MID_BPS: 18
      INCENTIVE_RATE_LOW_BPS: 25
      SAVINGS_FLOOR_CENTS: 15000000
    precision: "whole cents, round_half_up at steps 2 and 6 only"

  - name: property_carry_cost
    trigger: "on POST /distribution/property-dispositions and on every PropertyDisposition status transition"
    algorithm: threshold
    formula: |
      base = 0                                    if status == DISPOSED
           = 12 * monthly_rent_cents              if tenure_class == LEASED and status != DISPOSED
           = OWNED_CARRY_ANNUAL_CENTS             if tenure_class == OWNED and status != DISPOSED
      holdover_premium = round_half_up(base * HOLDOVER_PREMIUM_BPS / 10000) if status == HOLDOVER else 0
      marketing = MARKETING_CARRY_ANNUAL_CENTS if status IN {MARKETED, HOLDOVER, ASSIGNMENT_PENDING, SALE_PENDING} else 0
      annual_carry_cents = base + holdover_premium + marketing
    input_set: "the PropertyDisposition row's own fields and current status"
    constants:
      OWNED_CARRY_ANNUAL_CENTS: 1800000
      MARKETING_CARRY_ANNUAL_CENTS: 2400000
      HOLDOVER_PREMIUM_BPS: 5000
    precision: "whole cents, round_half_up"

  - name: property_disposition_net
    trigger: "on POST /distribution/property-dispositions/{dispositionId}/settle"
    algorithm: aggregation
    formula: |
      LEASE FORK   (tenure_class == LEASED, from ASSIGNMENT_PENDING):
        net_disposition_cents = agreed_amount_cents - buyout_offer_cents - selling_costs_cents
      OWNED FORK   (tenure_class == OWNED, from SALE_PENDING):
        net_disposition_cents = agreed_amount_cents - selling_costs_cents - book_value_cents
      The value is signed: negative means the exit cost the bank absorbs.
    input_set: "the single PropertyDisposition row being settled"
    constants: {}
    precision: "whole cents, exact integer arithmetic (no rounding)"

  - name: atm_retention_decision
    trigger: "on POST /distribution/property-dispositions (evaluates atm_breakeven_met and atm_decision_final)"
    algorithm: threshold
    formula: |
      annual_atm_margin_cents = 12 * (atm_monthly_surcharge_revenue_cents - atm_monthly_cost_cents)
      atm_breakeven_met = (annual_atm_margin_cents >= ATM_RETENTION_MARGIN_FLOOR_CENTS)
      atm_decision_final = DECOMMISSION  if atm_disposition == RETAIN_OFFSITE and atm_breakeven_met == false
                         = atm_disposition otherwise
    input_set: "the PropertyDisposition row's own ATM fields"
    constants:
      ATM_RETENTION_MARGIN_FLOOR_CENTS: 600000
    precision: "exact integer arithmetic; the threshold is inclusive (>=), so an annual margin of exactly 600000 retains the fleet"

  - name: community_impact_score
    trigger: "on POST /distribution/consolidation-cases/{caseId}/impact-assessments"
    algorithm: weighted_scoring
    formula: |
      lmi_component      = LMI_POINTS if lmi_tract == true else 0
      distance_component = min(DISTANCE_CAP, round_half_up(distance_to_nearest_remaining_miles * DISTANCE_POINTS_PER_MILE))
      senior_component   = min(SENIOR_CAP, floor(senior_household_pct_bps / SENIOR_BPS_PER_POINT))
      access_relief      = min(ACCESS_RELIEF_CAP, ACCESS_RELIEF_PER_POINT * alternative_access_count)
      transit_relief     = TRANSIT_RELIEF if public_transit_access == true else 0
      tier_adjust        = UNDER_BRANCHED_ADJUST if market_saturation_tier_at_assessment == UNDER_BRANCHED
                         = OVER_BRANCHED_ADJUST  if market_saturation_tier_at_assessment == OVER_BRANCHED
                         = 0                     if market_saturation_tier_at_assessment == SATURATED
      impact_score = min(100, max(0, BASE_POINTS + lmi_component + distance_component + senior_component
                                     + tier_adjust - access_relief - transit_relief))
      impact_tier  = HIGH     if impact_score >= TIER_HIGH_MIN
                   = MODERATE if TIER_MODERATE_MIN <= impact_score < TIER_HIGH_MIN
                   = LOW      if impact_score < TIER_MODERATE_MIN
      requires_public_comment = (impact_tier == HIGH) or (lmi_tract == true)
    input_set: "the assessment's own input fields plus market_saturation_tier_at_assessment copied from the closing branch's MarketArea at creation"
    constants:
      BASE_POINTS: 20
      LMI_POINTS: 25
      DISTANCE_POINTS_PER_MILE: 6
      DISTANCE_CAP: 30
      SENIOR_BPS_PER_POINT: 800
      SENIOR_CAP: 15
      ACCESS_RELIEF_PER_POINT: 5
      ACCESS_RELIEF_CAP: 20
      TRANSIT_RELIEF: 3
      UNDER_BRANCHED_ADJUST: 10
      OVER_BRANCHED_ADJUST: -5
      TIER_HIGH_MIN: 60
      TIER_MODERATE_MIN: 35
    precision: "integer points, round_half_up on the distance component only; nested min/max clamps are applied in the written order"

  - name: closure_notice_lead_days
    trigger: "on POST /distribution/consolidation-cases/{caseId}/impact-assessments (writes assessment.notice_required_days) and mirrored onto ConsolidationCase.notice_required_days when the assessment is FINALIZED"
    algorithm: threshold
    formula: |
      base = NOTICE_HIGH_TIER_DAYS if impact_tier == HIGH else NOTICE_BASE_DAYS
      lmi_extension = LMI_EXTENSION_DAYS
                      if (lmi_tract == true and distance_to_nearest_remaining_miles >= LMI_DISTANCE_THRESHOLD_MILES)
                      else 0
      notice_required_days = min(NOTICE_CAP_DAYS, base + lmi_extension)
    input_set: "the assessment row being created and its computed impact_tier"
    constants:
      NOTICE_BASE_DAYS: 90
      NOTICE_HIGH_TIER_DAYS: 120
      LMI_EXTENSION_DAYS: 30
      LMI_DISTANCE_THRESHOLD_MILES: 5.0
      NOTICE_CAP_DAYS: 180
    precision: "whole calendar days; the distance threshold is INCLUSIVE (>=), so exactly 5.0 miles adds the extension and 4.9 miles does not"

  - name: notice_market_window_conflict
    trigger: "on POST /distribution/closure-notices with notice_type == REGULATOR"
    algorithm: interval_merge
    formula: |
      new_interval      = [filed_on, effective_closure_date + NOTICE_BUFFER_DAYS]     (CLOSED at both ends)
      existing_interval = [other.filed_on, other.effective_closure_date + NOTICE_BUFFER_DAYS]
      candidate set     = ClosureNotice WHERE notice_type == REGULATOR
                          AND status IN {FILED, EFFECTIVE}
                          AND Branch(case.closing_branch_id).market_area_id == the new notice's market
                          AND id != new notice
      conflict <=> new_interval.start <= existing_interval.end
                   AND existing_interval.start <= new_interval.end
      Because both intervals are CLOSED, touching endpoints collide: a new filing whose start date
      equals an existing interval's buffered end date IS a conflict. Conflict -> ERR_NOTICE_WINDOW_CONFLICT.
    input_set: "REGULATOR notices in status FILED or EFFECTIVE whose case's closing branch shares the MarketArea; WITHDRAWN notices are ignored"
    constants:
      NOTICE_BUFFER_DAYS: 30
    precision: "whole calendar dates; closed-interval overlap including the 30-day regulatory cooling buffer on the end of each interval"

  - name: campaign_wave_capacity_conflict
    trigger: "on POST /distribution/transition-campaigns"
    algorithm: interval_merge
    formula: |
      wave_days            = (wave_end_date - wave_start_date) in calendar days
      daily_onboarding_load = round_half_up(inbound_household_count / wave_days)
      new_interval         = [wave_start_date, wave_end_date)                (HALF-OPEN)
      candidate set        = CustomerTransitionCampaign WHERE receiving_branch_id == this receiving branch
                             AND status IN {PLANNED, LAUNCHED}
      overlap(a, b) <=> a.start < b.end AND b.start < a.end          (touching endpoints DO NOT collide)
      For every calendar day d in the new interval:
        load(d) = daily_onboarding_load of the new campaign
                + sum(daily_onboarding_load of every candidate campaign whose half-open interval contains d)
      conflict <=> max over d of load(d) > Branch(receiving).onboarding_capacity_households_per_day
      Conflict -> ERR_ABSORPTION_CAPACITY_EXCEEDED. Two campaigns may share the receiving branch and
      even overlap in time, provided their summed daily load never exceeds capacity on any single day.
    input_set: "PLANNED and LAUNCHED campaigns on the same receiving branch; COMPLETED and CANCELLED campaigns release their interval"
    constants: {}
    precision: "whole households per day, round_half_up on daily_onboarding_load; half-open interval arithmetic with aggregate per-day capacity"

  - name: runoff_variance
    trigger: "on POST /distribution/deposit-observations with subject_type == CONSOLIDATION_CASE"
    algorithm: chronological
    formula: |
      1. cum_weight_bps(k) = sum(RUNOFF_CURVE_BPS[1..k])
      2. forecast_deposits_cents(k) = case.pre_close_deposits_cents
                                      - round_half_up(case.forecast_runoff_cents * cum_weight_bps(k) / 10000)
      3. variance_bps = round_half_up((observed_deposits_cents - forecast_deposits_cents(k)) * 10000
                                      / forecast_deposits_cents(k))
      4. breach = (variance_bps <= RUNOFF_BREACH_BPS)
      5. case.last_observed_month_index = k; case.cumulative_variance_bps = variance_bps
         case.monitoring_posture = REMEDIATION if breach
                                 = RESOLVED    if case.monitoring_posture == REMEDIATION
                                                  and variance_bps >= RUNOFF_RESOLVE_BPS
                                 = ON_TRACK    otherwise
      Observations must arrive in strictly increasing month_index order (k > case.last_observed_month_index),
      otherwise ERR_OBSERVATION_OUT_OF_SEQUENCE. Only the highest-k observation drives posture; earlier
      observations are never re-read.
    input_set: "the case's pre_close_deposits_cents and forecast_runoff_cents stamped at execution, plus the single observation being recorded"
    constants:
      RUNOFF_CURVE_BPS: [2500, 2000, 1500, 1000, 800, 600, 500, 400, 300, 200, 100, 100]
      RUNOFF_BREACH_BPS: -300
      RUNOFF_RESOLVE_BPS: -150
    precision: "whole cents and whole basis points, round_half_up; the breach threshold is INCLUSIVE (<=), so exactly -300 bps breaches and -299 bps does not"

  - name: de_novo_site_score
    trigger: "on POST /distribution/de-novo-plans"
    algorithm: weighted_scoring
    formula: |
      growth_factor   = min(100, round_half_up(market.household_growth_pct_bps / GROWTH_BPS_PER_POINT))
      income_factor   = min(100, round_half_up(market.median_household_income_cents / INCOME_CENTS_PER_POINT))
      opportunity_raw = market.deposit_market_total_cents / (market.competitor_branch_count + 1)
      opportunity_factor = min(100, round_half_up(opportunity_raw * 100 / DEPOSIT_PER_BRANCH_TARGET_CENTS))
      competition_factor = min(100, round_half_up(market.competitor_density_index * COMPETITION_POINTS_PER_INDEX))
      site_score = round_half_up((W_GROWTH * growth_factor + W_INCOME * income_factor
                    + W_OPPORTUNITY * opportunity_factor + W_COMPETITION * (100 - competition_factor)) / 10000)
      PINNED ROUNDING ORDER: round each factor to whole points FIRST, then weight and round once.
    input_set: "the MarketArea row named by market_area_id at the moment the plan is created"
    constants:
      GROWTH_BPS_PER_POINT: 5
      INCOME_CENTS_PER_POINT: 120000
      DEPOSIT_PER_BRANCH_TARGET_CENTS: 15000000000
      COMPETITION_POINTS_PER_INDEX: 4
      W_GROWTH: 3000
      W_INCOME: 2500
      W_OPPORTUNITY: 2500
      W_COMPETITION: 2000
      SITE_SCORE_MIN: 55
    precision: "integer points, round_half_up at each factor and once on the weighted blend"

  - name: de_novo_ramp_attainment
    trigger: "on POST /distribution/deposit-observations with subject_type == DE_NOVO_PLAN"
    algorithm: threshold
    formula: |
      1. cum_target_cents(k) = round_half_up(plan.target_year1_deposits_cents * k * k / 144)
      2. forecast_deposits_cents = cum_target_cents(k)
      3. ramp_attainment_bps = round_half_up(observed_deposits_cents * 10000 / cum_target_cents(k))
      4. variance_bps = ramp_attainment_bps - 10000
      5. ramp_status = MET       if k == 12 and ramp_attainment_bps >= RAMP_MET_BPS
                     = AT_RISK   if ramp_attainment_bps < RAMP_AT_RISK_BPS
                     = ON_TRACK  if ramp_attainment_bps >= 10000
                     = BEHIND    otherwise
      6. breach = (ramp_attainment_bps < RAMP_AT_RISK_BPS)
      month_index must be strictly greater than plan.ramp_month_index, else ERR_OBSERVATION_OUT_OF_SEQUENCE.
    input_set: "the plan's target_year1_deposits_cents and the single observation being recorded"
    constants:
      RAMP_MET_BPS: 9000
      RAMP_AT_RISK_BPS: 7000
    precision: "whole cents and whole basis points, round_half_up; the quadratic ramp curve reaches exactly the target at k == 12"

  - name: deposit_conservation_invariant
    trigger: "asserted after POST /distribution/consolidation-cases/{caseId}/execute-closure and again after POST /distribution/consolidation-cases/{caseId}/unwind-closure"
    algorithm: aggregation
    formula: |
      network_deposits_cents(market) =
          sum(Branch.deposit_balance_cents WHERE market_area_id == market.id
              AND status IN {ACTIVE, UNDER_REVIEW, CLOSURE_SCHEDULED, CLOSED, DE_NOVO_RAMPING})
        + market.cumulative_runoff_deposits_cents
      INVARIANT: network_deposits_cents(market) is identical before execute-closure and after the
      matching unwind-closure. Execution moves forecast_retained_deposits_cents from the closing
      branch to the receiving branch and forecast_runoff_cents from the closing branch into the
      market runoff ledger; unwind moves exactly those two amounts back. Zero drift is permitted.
    input_set: "every Branch of the market including CLOSED ones, plus the market runoff ledger field"
    constants: {}
    precision: "exact whole cents; no rounding occurs in the transfer, so the invariant is exact"

  - name: headcount_conservation_invariant
    trigger: "asserted after POST /distribution/staff-dispositions/{dispositionId}/accept and again after the matching POST /distribution/staff-dispositions/{dispositionId}/rescind"
    algorithm: aggregation
    formula: |
      network_headcount(case) = Branch(case.closing_branch_id).fte_count
                              + Branch(case.receiving_branch_id).fte_count
                              + case.severed_fte_count
      INVARIANT: network_headcount(case) is identical before accept and after the matching rescind, and
      case.redeployed_fte_count + case.pending_disposition_count is also identical across the pair.
      Accept debits the source branch and credits the target branch; rescind reverses exactly those two
      moves. Zero drift is permitted in either quantity.
    input_set: "the case's closing and receiving branches plus the case's disposition counters"
    constants: {}
    precision: "exact integer headcount; a conserved quantity distinct in kind from the deposit ledger invariant"

validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are both present and X-User-Role is one of the seven declared roles"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all
  - priority: 2
    category: auth
    check: "the acting role appears in the endpoint's roles list in section 1.5"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: all
  - priority: 3
    category: auth
    check: "on POST /distribution/consolidation-cases/{caseId}/decision, X-User-ID != case.created_by_user_id (segregation of duties)"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /distribution/consolidation-cases/{caseId}/decision"
  - priority: 4
    category: auth
    check: "on strategist-owned case operations (submit, revise), X-User-ID == case.created_by_user_id"
    error_id: ERR_CASE_AUTHOR_REQUIRED
    http_status: 403
    applies_to: "POST /distribution/consolidation-cases/{caseId}/submit, POST /distribution/consolidation-cases/{caseId}/revise"
  - priority: 5
    category: auth
    check: "when X-User-Role == BranchManager, X-User-ID equals the branch_id of the branch in the path"
    error_id: ERR_BRANCH_OWNERSHIP_REQUIRED
    http_status: 403
    applies_to: "POST /distribution/branches/{branchId}/performance-snapshots, GET /distribution/branches/{branchId}/performance-score"
  - priority: 6
    category: existence
    check: "request body and query fields are well formed: required fields present, enums in range, integers within declared constraints, dates ISO 8601, distance and mileage numbers with at most one decimal place, pagination limit in 1..100"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all
  - priority: 7
    category: existence
    check: "every id in the path resolves, validated left to right"
    error_id: ERR_RESOURCE_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints with path parameters"
  - priority: 8
    category: existence
    check: "every foreign key supplied in the body resolves: market_area_id, closing_branch_id, receiving_branch_id, target_branch_id, consolidation_case_id, de_novo_plan_id"
    error_id: ERR_REFERENCED_RESOURCE_NOT_FOUND
    http_status: 404
    applies_to: "POST /distribution/branches, POST /distribution/consolidation-cases, POST /distribution/consolidation-cases/{caseId}/revise, POST /distribution/retention-forecasts, POST /distribution/staff-dispositions, POST /distribution/property-dispositions, POST /distribution/transition-campaigns, POST /distribution/de-novo-plans, POST /distribution/deposit-observations"
  - priority: 9
    category: state
    check: "expected_branch_version equals Branch.version on case creation"
    error_id: ERR_STALE_BRANCH_VERSION
    http_status: 412
    applies_to: "POST /distribution/consolidation-cases"
  - priority: 10
    category: state
    check: "expected_case_version equals ConsolidationCase.version on forecast creation and on case decision"
    error_id: ERR_STALE_CASE_VERSION
    http_status: 412
    applies_to: "POST /distribution/retention-forecasts, POST /distribution/consolidation-cases/{caseId}/decision"
  - priority: 11
    category: state
    check: "the ConsolidationCase is in the from-state the requested transition declares in state_machines.ConsolidationCase"
    error_id: ERR_CASE_STATE_INVALID
    http_status: 409
    applies_to: "POST /distribution/consolidation-cases/{caseId}/submit, POST /distribution/consolidation-cases/{caseId}/decision, POST /distribution/consolidation-cases/{caseId}/revise, POST /distribution/consolidation-cases/{caseId}/execute-closure, POST /distribution/consolidation-cases/{caseId}/unwind-closure, POST /distribution/consolidation-cases/{caseId}/close-out, POST /distribution/closure-notices, POST /distribution/transition-campaigns/{campaignId}/launch"
  - priority: 12
    category: state
    check: "the closing branch has no ConsolidationCase in status SUBMITTED, APPROVED, NOTICE_FILED, CLOSURE_EXECUTED or POST_CLOSE_MONITORING; this outranks the plain not-ACTIVE check at priority 31 so the more specific open-case diagnosis is returned"
    error_id: ERR_BRANCH_HAS_OPEN_CASE
    http_status: 409
    applies_to: "POST /distribution/consolidation-cases"
  - priority: 13
    category: state
    check: "the ClosureNotice is in status FILED or EFFECTIVE for withdrawal and for closure execution"
    error_id: ERR_NOTICE_NOT_OPEN
    http_status: 409
    applies_to: "POST /distribution/closure-notices/{noticeId}/withdraw, POST /distribution/consolidation-cases/{caseId}/execute-closure"
  - priority: 14
    category: state
    check: "the StaffDisposition is in the from-state (and notification_state) the requested transition declares"
    error_id: ERR_DISPOSITION_STATE_INVALID
    http_status: 409
    applies_to: "POST /distribution/staff-dispositions/{dispositionId}/notify, POST /distribution/staff-dispositions/{dispositionId}/accept, POST /distribution/staff-dispositions/{dispositionId}/rescind, POST /distribution/staff-dispositions/{dispositionId}/sever"
  - priority: 15
    category: state
    check: "the PropertyDisposition is in a from-state the requested transition declares and the fork matches tenure_class"
    error_id: ERR_PROPERTY_STATE_INVALID
    http_status: 409
    applies_to: "POST /distribution/property-dispositions/{dispositionId}/contract, POST /distribution/property-dispositions/{dispositionId}/settle"
  - priority: 16
    category: state
    check: "the CommunityImpactAssessment is in status DRAFT or REOPENED when finalized"
    error_id: ERR_ASSESSMENT_STATE_INVALID
    http_status: 409
    applies_to: "POST /distribution/impact-assessments/{assessmentId}/finalize"
  - priority: 17
    category: state
    check: "the CustomerTransitionCampaign is in status PLANNED when launched"
    error_id: ERR_CAMPAIGN_STATE_INVALID
    http_status: 409
    applies_to: "POST /distribution/transition-campaigns/{campaignId}/launch"
  - priority: 18
    category: state
    check: "the DeNovoSitePlan is in the from-state the requested transition declares"
    error_id: ERR_PLAN_STATE_INVALID
    http_status: 409
    applies_to: "POST /distribution/de-novo-plans/{planId}/decision, POST /distribution/de-novo-plans/{planId}/open"
  - priority: 19
    category: state
    check: "the receiving Branch referenced by the case has status == ACTIVE at submit, at redeployment acceptance and at closure execution"
    error_id: ERR_RECEIVING_BRANCH_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /distribution/consolidation-cases/{caseId}/submit, POST /distribution/consolidation-cases/{caseId}/execute-closure, POST /distribution/staff-dispositions/{dispositionId}/accept"
  - priority: 20
    category: business_safety
    check: "the case's non-SUPERSEDED CommunityImpactAssessment exists and has status == FINALIZED before a REGULATOR closure notice may be filed"
    error_id: ERR_IMPACT_ASSESSMENT_NOT_FINALIZED
    http_status: 409
    applies_to: "POST /distribution/closure-notices"
  - priority: 21
    category: business_safety
    check: "(effective_closure_date - clock_today) in calendar days >= case.notice_required_days"
    error_id: ERR_NOTICE_PERIOD_INSUFFICIENT
    http_status: 422
    applies_to: "POST /distribution/closure-notices"
  - priority: 22
    category: business_safety
    check: "clock_today >= the REGULATOR notice's effective_closure_date before the closure may be executed"
    error_id: ERR_NOTICE_PERIOD_NOT_ELAPSED
    http_status: 409
    applies_to: "POST /distribution/consolidation-cases/{caseId}/execute-closure"
  - priority: 23
    category: business_safety
    check: "clock_today >= disposition.notified_on + WARN_NOTICE_DAYS (60) before an employee may be severed"
    error_id: ERR_WARN_PERIOD_NOT_ELAPSED
    http_status: 409
    applies_to: "POST /distribution/staff-dispositions/{dispositionId}/sever"
  - priority: 24
    category: business_safety
    check: "the case has at least one CustomerTransitionCampaign in status LAUNCHED before the closure may be executed"
    error_id: ERR_TRANSITION_CAMPAIGN_NOT_LAUNCHED
    http_status: 409
    applies_to: "POST /distribution/consolidation-cases/{caseId}/execute-closure"
  - priority: 25
    category: business_temporal
    check: "the new REGULATOR notice's closed occupation interval does not collide with another FILED or EFFECTIVE REGULATOR notice in the same MarketArea (calculations.notice_market_window_conflict)"
    error_id: ERR_NOTICE_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /distribution/closure-notices"
  - priority: 26
    category: business_temporal
    check: "effective_closure_date <= case.planned_closure_date"
    error_id: ERR_PLANNED_DATE_BEFORE_EFFECTIVE
    http_status: 422
    applies_to: "POST /distribution/closure-notices"
  - priority: 27
    category: business_temporal
    check: "wave_start_date < wave_end_date, and at launch clock_today < wave_start_date and wave_start_date >= the case's REGULATOR notice.filed_on + CAMPAIGN_LEAD_DAYS (14)"
    error_id: ERR_CAMPAIGN_LEAD_TIME_INSUFFICIENT
    http_status: 422
    applies_to: "POST /distribution/transition-campaigns, POST /distribution/transition-campaigns/{campaignId}/launch"
  - priority: 28
    category: business_temporal
    check: "clock_today <= case.executed_on + UNWIND_WINDOW_DAYS (30) and case.last_observed_month_index == 0"
    error_id: ERR_UNWIND_WINDOW_CLOSED
    http_status: 409
    applies_to: "POST /distribution/consolidation-cases/{caseId}/unwind-closure"
  - priority: 29
    category: business_temporal
    check: "observation.month_index > the subject's last recorded month index"
    error_id: ERR_OBSERVATION_OUT_OF_SEQUENCE
    http_status: 409
    applies_to: "POST /distribution/deposit-observations"
  - priority: 30
    category: business_constraint
    check: "no day inside the new wave's half-open interval exceeds the receiving branch's onboarding_capacity_households_per_day once every PLANNED or LAUNCHED campaign on that branch is summed (calculations.campaign_wave_capacity_conflict)"
    error_id: ERR_ABSORPTION_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /distribution/transition-campaigns"
  - priority: 31
    category: business_constraint
    check: "the closing Branch named on case creation has status == ACTIVE; reachable whenever the branch is non-ACTIVE without an open case (UNDER_REVIEW under another DRAFT case, DE_NOVO_RAMPING, or CLOSED after CLOSED_OUT)"
    error_id: ERR_BRANCH_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /distribution/consolidation-cases"
  - priority: 32
    category: business_constraint
    check: "receiving_branch_id != closing_branch_id and, when supplied, the receiving branch belongs to the closing branch's MarketArea"
    error_id: ERR_RECEIVING_BRANCH_INVALID
    http_status: 422
    applies_to: "POST /distribution/consolidation-cases, POST /distribution/consolidation-cases/{caseId}/revise"
  - priority: 33
    category: business_constraint
    check: "branch_code (and proposed_branch_code at de novo opening) is unique across all Branch rows; MarketArea name is unique per region_code; PerformanceSnapshot period_label is unique per branch; StaffDisposition employee_ref is unique per case; at most one PropertyDisposition exists per (branch_id, consolidation_case_id) pair"
    error_id: ERR_DUPLICATE_KEY
    http_status: 409
    applies_to: "POST /distribution/market-areas, POST /distribution/branches, POST /distribution/branches/{branchId}/performance-snapshots, POST /distribution/staff-dispositions, POST /distribution/property-dispositions, POST /distribution/de-novo-plans/{planId}/open"
  - priority: 34
    category: business_constraint
    check: "retail_share_bps + small_business_share_bps + wealth_share_bps == 10000"
    error_id: ERR_SEGMENT_MIX_INVALID
    http_status: 422
    applies_to: "POST /distribution/retention-forecasts"
  - priority: 35
    category: business_constraint
    check: "case.returned_count < REVISION_LIMIT (3) when the decision is RETURN"
    error_id: ERR_REVISION_LIMIT_EXCEEDED
    http_status: 409
    applies_to: "POST /distribution/consolidation-cases/{caseId}/decision"
  - priority: 36
    category: business_constraint
    check: "exactly the FK matching subject_type is supplied: consolidation_case_id for CONSOLIDATION_CASE, de_novo_plan_id for DE_NOVO_PLAN; the other MUST be absent, and the subject must be in a trackable state (case.status IN {CLOSURE_EXECUTED, POST_CLOSE_MONITORING}; plan.status IN {OPENED, RAMP_TRACKING, RAMP_REMEDIATION})"
    error_id: ERR_OBSERVATION_SUBJECT_MISMATCH
    http_status: 422
    applies_to: "POST /distribution/deposit-observations"
  - priority: 37
    category: business_constraint
    check: "plan.site_score >= SITE_SCORE_MIN when the decision is APPROVE"
    error_id: ERR_SITE_SCORE_BELOW_MINIMUM
    http_status: 422
    applies_to: "POST /distribution/de-novo-plans/{planId}/decision"
  - priority: 38
    category: business_constraint
    check: "MarketArea.saturation_tier != OVER_BRANCHED when a de novo plan is approved"
    error_id: ERR_MARKET_OVER_BRANCHED
    http_status: 409
    applies_to: "POST /distribution/de-novo-plans/{planId}/decision"
  - priority: 39
    category: business_constraint
    check: "MarketArea.de_novo_hold == false when a de novo plan is approved or opened"
    error_id: ERR_MARKET_DE_NOVO_HOLD
    http_status: 409
    applies_to: "POST /distribution/de-novo-plans/{planId}/decision, POST /distribution/de-novo-plans/{planId}/open"
  - priority: 40
    category: business_referential
    check: "the case has exactly one RetentionForecast with status == ACTIVE before submission"
    error_id: ERR_RETENTION_FORECAST_MISSING
    http_status: 409
    applies_to: "POST /distribution/consolidation-cases/{caseId}/submit"
  - priority: 41
    category: business_referential
    check: "at least one PropertyDisposition exists for the closing branch before the closure may be executed"
    error_id: ERR_PROPERTY_DISPOSITION_MISSING
    http_status: 409
    applies_to: "POST /distribution/consolidation-cases/{caseId}/execute-closure"
  - priority: 42
    category: business_referential
    check: "case.pending_disposition_count == 0 before the closure may be executed"
    error_id: ERR_STAFF_DISPOSITIONS_PENDING
    http_status: 409
    applies_to: "POST /distribution/consolidation-cases/{caseId}/execute-closure"
  - priority: 43
    category: business_referential
    check: "when receiving_branch_id is omitted, calculations.receiving_branch_selector yields a non-empty candidate set"
    error_id: ERR_NO_ELIGIBLE_RECEIVING_BRANCH
    http_status: 422
    applies_to: "POST /distribution/consolidation-cases"
  - priority: 44
    category: business_referential
    check: "the branch has at least one PerformanceSnapshot before a performance score can be returned"
    error_id: ERR_NO_PERFORMANCE_HISTORY
    http_status: 409
    applies_to: "GET /distribution/branches/{branchId}/performance-score"
  - priority: 45
    category: business_referential
    check: "a REDEPLOYMENT disposition supplies target_branch_id and a SEVERANCE disposition omits it"
    error_id: ERR_DISPOSITION_TARGET_INVALID
    http_status: 422
    applies_to: "POST /distribution/staff-dispositions, POST /distribution/staff-dispositions/{dispositionId}/accept"
  - priority: 46
    category: business_fiscal
    check: "case.net_annual_savings_cents >= SAVINGS_FLOOR_CENTS when the decision is APPROVE"
    error_id: ERR_SAVINGS_BELOW_FLOOR
    http_status: 422
    applies_to: "POST /distribution/consolidation-cases/{caseId}/decision"
  - priority: 47
    category: business_fiscal
    check: "case.last_observed_month_index >= MONITORING_MONTHS (12) and case.monitoring_posture IN {ON_TRACK, RESOLVED} before close-out"
    error_id: ERR_MONITORING_INCOMPLETE
    http_status: 409
    applies_to: "POST /distribution/consolidation-cases/{caseId}/close-out"
  - priority: 48
    category: business_fiscal
    check: "LEASED premises supply monthly_rent_cents, lease_end_date and buyout_offer_cents; OWNED premises supply book_value_cents and list_price_cents"
    error_id: ERR_PROPERTY_TERMS_INCOMPLETE
    http_status: 422
    applies_to: "POST /distribution/property-dispositions"

endpoints:
  - method: POST
    path: "/distribution/market-areas"
    description: "Register a trade area with demographics and competitor density"
    roles: [NetworkStrategist, NetworkOpsAdmin]
    code: 201
    input: [name, region_code, population, median_household_income_cents, deposit_market_total_cents, competitor_branch_count, household_growth_pct_bps, digital_penetration_bps]
    output: MarketArea
    side_effects: ["computes competitor_density_index", "computes own_branch_count = 0, branch_density_per_100k and saturation_tier (calculations.market_saturation_tier)"]
  - method: GET
    path: "/distribution/market-areas/{marketAreaId}"
    description: "Read one trade area including its runoff ledger and de novo hold flag"
    roles: [NetworkStrategist, ConsolidationApprover, ComplianceOfficer, HRPartner, RealEstateManager, NetworkOpsAdmin, BranchManager]
    code: 200
    input: []
    output: MarketArea
    side_effects: []
  - method: GET
    path: "/distribution/market-areas"
    description: "List trade areas with pagination and filters"
    roles: [NetworkStrategist, ConsolidationApprover, ComplianceOfficer, HRPartner, RealEstateManager, NetworkOpsAdmin, BranchManager]
    code: 200
    input: ["region_code?", "saturation_tier?", "limit?", "offset?"]
    output: MarketArea[]
    side_effects: []
  - method: POST
    path: "/distribution/branches"
    description: "Open a branch record in a trade area"
    roles: [NetworkStrategist, NetworkOpsAdmin]
    code: 201
    input: ["market_area_id", "branch_code", "branch_type", "tenure_class", "deposit_balance_cents", "monthly_transaction_count", "digital_adoption_bps", "annual_noninterest_expense_cents", "annual_revenue_cents", "fte_count", "atm_count", "opened_on", "scoring_variant?", "onboarding_capacity_households_per_day?"]
    output: Branch
    side_effects: ["status = ACTIVE, performance_band = UNSCORED, snapshot_count = 0", "MarketArea.own_branch_count += 1 with branch_density_per_100k and saturation_tier recomputed"]
  - method: GET
    path: "/distribution/branches/{branchId}"
    description: "Read one branch including computed score, band and absorbed deposits"
    roles: [NetworkStrategist, ConsolidationApprover, ComplianceOfficer, HRPartner, RealEstateManager, NetworkOpsAdmin, BranchManager]
    code: 200
    input: []
    output: Branch
    side_effects: []
  - method: GET
    path: "/distribution/branches"
    description: "List branches filtered by market, absorbing branch, status or band"
    roles: [NetworkStrategist, ConsolidationApprover, ComplianceOfficer, HRPartner, RealEstateManager, NetworkOpsAdmin, BranchManager]
    code: 200
    input: ["market_area_id?", "absorbing_branch_id?", "status?", "performance_band?", "limit?", "offset?"]
    output: Branch[]
    side_effects: []
  - method: POST
    path: "/distribution/branches/{branchId}/performance-snapshots"
    description: "Record an immutable performance period for a branch"
    roles: [NetworkStrategist, BranchManager]
    code: 201
    input: [period_label, period_end_date, deposits_cents, transaction_count, digital_active_bps, revenue_cents, noninterest_expense_cents]
    output: PerformanceSnapshot
    side_effects: ["computes composite_score_bps and band (calculations.branch_performance_score step 1)", "Branch.snapshot_count += 1", "refreshes Branch.performance_score_bps and Branch.performance_band under Branch.scoring_variant", "increments Branch.version by 1"]
  - method: GET
    path: "/distribution/branches/{branchId}/performance-snapshots"
    description: "List the performance history of a branch, newest period first"
    roles: [NetworkStrategist, ConsolidationApprover, ComplianceOfficer, NetworkOpsAdmin, BranchManager]
    code: 200
    input: ["limit?", "offset?"]
    output: PerformanceSnapshot[]
    side_effects: []
  - method: GET
    path: "/distribution/performance-snapshots/{snapshotId}"
    description: "Read one performance snapshot including its composite score and band"
    roles: [NetworkStrategist, ConsolidationApprover, ComplianceOfficer, NetworkOpsAdmin, BranchManager]
    code: 200
    input: []
    output: PerformanceSnapshot
    side_effects: []
  - method: GET
    path: "/distribution/performance-snapshots"
    description: "List performance snapshots across the network, filtered by branch or band"
    roles: [NetworkStrategist, ConsolidationApprover, ComplianceOfficer, NetworkOpsAdmin, BranchManager]
    code: 200
    input: ["branch_id?", "band?", "limit?", "offset?"]
    output: PerformanceSnapshot[]
    side_effects: []
  - method: GET
    path: "/distribution/branches/{branchId}/performance-score"
    description: "Compute a branch performance score under an explicitly requested variant without persisting it"
    roles: [NetworkStrategist, ConsolidationApprover, NetworkOpsAdmin, BranchManager]
    code: 200
    input: ["scoring_variant?"]
    output: "{ branch_id: string, scoring_variant: string, performance_score_bps: integer, performance_band: string, contributing_snapshot_count: integer }"
    side_effects: ["none; the branch row is not mutated"]
  - method: POST
    path: "/distribution/consolidation-cases"
    description: "Open a consolidation case against a closing branch; when receiving_branch_id is omitted the server selects it per calculations.receiving_branch_selector"
    roles: [NetworkStrategist]
    code: 201
    input: ["closing_branch_id", "receiving_branch_id?", "rationale_code", "planned_closure_date", "retention_model_variant?", "expected_branch_version"]
    output: ConsolidationCase
    side_effects: ["status = DRAFT, created_by_user_id = X-User-ID", "Branch(closing) transitions ACTIVE -> UNDER_REVIEW and increments Branch.version by 1", "every prior DRAFT case on the same closing branch transitions to SUPERSEDED together with its ACTIVE forecast and non-SUPERSEDED assessment"]
  - method: GET
    path: "/distribution/consolidation-cases/{caseId}"
    description: "Read one consolidation case with all computed forecast, savings and monitoring fields"
    roles: [NetworkStrategist, ConsolidationApprover, ComplianceOfficer, HRPartner, RealEstateManager, NetworkOpsAdmin, BranchManager]
    code: 200
    input: []
    output: ConsolidationCase
    side_effects: []
  - method: GET
    path: "/distribution/consolidation-cases"
    description: "List consolidation cases filtered by closing branch, receiving branch, status or monitoring posture"
    roles: [NetworkStrategist, ConsolidationApprover, ComplianceOfficer, HRPartner, RealEstateManager, NetworkOpsAdmin, BranchManager]
    code: 200
    input: ["closing_branch_id?", "receiving_branch_id?", "status?", "monitoring_posture?", "limit?", "offset?"]
    output: ConsolidationCase[]
    side_effects: []
  - method: POST
    path: "/distribution/consolidation-cases/{caseId}/submit"
    description: "Submit a DRAFT case for approval"
    roles: [NetworkStrategist]
    code: 200
    input: []
    output: ConsolidationCase
    side_effects: ["status DRAFT -> SUBMITTED", "recomputes severance_pool_cents (calculations.severance_pool)", "recomputes gross_annual_savings_cents, transition_incentive_rate_bps, transition_incentive_cents, net_annual_savings_cents (calculations.net_consolidation_savings)", "increments ConsolidationCase.version by 1"]
  - method: POST
    path: "/distribution/consolidation-cases/{caseId}/decision"
    description: "Record the approver's branching decision on a SUBMITTED case: APPROVE, RETURN or REJECT"
    roles: [ConsolidationApprover]
    code: 200
    input: ["decision", "reason_code?", "expected_case_version"]
    output: ConsolidationCase
    side_effects: ["APPROVE: status -> APPROVED, decided_by_user_id set", "RETURN: status -> RETURNED and returned_count += 1", "REJECT: status -> REJECTED, closing branch UNDER_REVIEW -> ACTIVE, ACTIVE forecast -> SUPERSEDED, assessment -> SUPERSEDED with case.impact_tier reset to UNASSESSED and notice_required_days reset to 0", "increments ConsolidationCase.version by 1"]
  - method: POST
    path: "/distribution/consolidation-cases/{caseId}/revise"
    description: "Return a RETURNED case to DRAFT, optionally editing the planned closure date or receiving branch"
    roles: [NetworkStrategist]
    code: 200
    input: ["planned_closure_date?", "receiving_branch_id?"]
    output: ConsolidationCase
    side_effects: ["status RETURNED -> DRAFT", "applies the supplied fields", "increments ConsolidationCase.version by 1"]
  - method: POST
    path: "/distribution/consolidation-cases/{caseId}/execute-closure"
    description: "Execute the branch closure once the regulatory notice period has elapsed; drives the four-hop closure cascade"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: ConsolidationCase
    side_effects: ["status NOTICE_FILED -> CLOSURE_EXECUTED with the full cascade documented in state_machines.ConsolidationCase", "increments ConsolidationCase.version by 1"]
  - method: POST
    path: "/distribution/consolidation-cases/{caseId}/unwind-closure"
    description: "Rescind an executed closure inside the unwind window, reversing every deposit movement"
    roles: [ComplianceOfficer]
    code: 200
    input: [rescission_reason_code]
    output: ConsolidationCase
    side_effects: ["status CLOSURE_EXECUTED -> UNWOUND with every deposit ledger movement reversed (calculations.deposit_conservation_invariant)", "increments ConsolidationCase.version by 1"]
  - method: POST
    path: "/distribution/consolidation-cases/{caseId}/close-out"
    description: "Close out a monitored case after the full monitoring horizon"
    roles: [NetworkOpsAdmin]
    code: 200
    input: []
    output: ConsolidationCase
    side_effects: ["status POST_CLOSE_MONITORING -> CLOSED_OUT", "increments ConsolidationCase.version by 1"]
  - method: POST
    path: "/distribution/retention-forecasts"
    description: "Model deposit retention for a case under one of the two retention variants; supersedes the case's prior ACTIVE forecast"
    roles: [NetworkStrategist]
    code: 201
    input: [consolidation_case_id, model_variant, distance_miles, retail_share_bps, small_business_share_bps, wealth_share_bps, expected_case_version]
    output: RetentionForecast
    side_effects: ["copies baseline_deposits_cents and digital_adoption_bps from the closing branch", "computes retention_bps, retained_deposits_cents, runoff_cents (calculations.deposit_retention_forecast)", "the case's prior ACTIVE forecast transitions to SUPERSEDED", "refreshes case.forecast_retention_bps / forecast_retained_deposits_cents / forecast_runoff_cents and recomputes the savings chain", "increments ConsolidationCase.version by 1"]
  - method: GET
    path: "/distribution/consolidation-cases/{caseId}/retention-forecasts"
    description: "List the retention forecasts of a case, newest first"
    roles: [NetworkStrategist, ConsolidationApprover, ComplianceOfficer, NetworkOpsAdmin]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: RetentionForecast[]
    side_effects: []
  - method: GET
    path: "/distribution/retention-forecasts/{forecastId}"
    description: "Read one retention forecast including its variant inputs and retained/runoff split"
    roles: [NetworkStrategist, ConsolidationApprover, ComplianceOfficer, NetworkOpsAdmin]
    code: 200
    input: []
    output: RetentionForecast
    side_effects: []
  - method: GET
    path: "/distribution/retention-forecasts"
    description: "List retention forecasts across cases, filtered by case, variant or status"
    roles: [NetworkStrategist, ConsolidationApprover, ComplianceOfficer, NetworkOpsAdmin]
    code: 200
    input: ["consolidation_case_id?", "model_variant?", "status?", "limit?", "offset?"]
    output: RetentionForecast[]
    side_effects: []
  - method: POST
    path: "/distribution/consolidation-cases/{caseId}/impact-assessments"
    description: "Assess community impact of a proposed closure; computes the impact tier and the regulatory notice lead days"
    roles: [ComplianceOfficer]
    code: 201
    input: [lmi_tract, distance_to_nearest_remaining_miles, alternative_access_count, senior_household_pct_bps, public_transit_access]
    output: CommunityImpactAssessment
    side_effects: ["copies market_saturation_tier_at_assessment from the closing branch's MarketArea", "computes impact_score, impact_tier, requires_public_comment (calculations.community_impact_score) and notice_required_days (calculations.closure_notice_lead_days)", "any prior non-SUPERSEDED assessment of the case transitions to SUPERSEDED"]
  - method: GET
    path: "/distribution/consolidation-cases/{caseId}/impact-assessments"
    description: "List the community impact assessments of a case, newest first"
    roles: [NetworkStrategist, ConsolidationApprover, ComplianceOfficer, NetworkOpsAdmin]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: CommunityImpactAssessment[]
    side_effects: []
  - method: GET
    path: "/distribution/impact-assessments/{assessmentId}"
    description: "Read one community impact assessment including its score, tier and required notice days"
    roles: [NetworkStrategist, ConsolidationApprover, ComplianceOfficer, NetworkOpsAdmin]
    code: 200
    input: []
    output: CommunityImpactAssessment
    side_effects: []
  - method: GET
    path: "/distribution/impact-assessments"
    description: "List community impact assessments across cases, filtered by case, tier or status"
    roles: [NetworkStrategist, ConsolidationApprover, ComplianceOfficer, NetworkOpsAdmin]
    code: 200
    input: ["consolidation_case_id?", "impact_tier?", "status?", "limit?", "offset?"]
    output: CommunityImpactAssessment[]
    side_effects: []
  - method: POST
    path: "/distribution/impact-assessments/{assessmentId}/finalize"
    description: "Finalize (or re-finalize after reopening) a community impact assessment and mirror its tier and lead days onto the case"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: CommunityImpactAssessment
    side_effects: ["status DRAFT|REOPENED -> FINALIZED, finalized_on stamped", "case.impact_tier and case.notice_required_days refreshed; increments ConsolidationCase.version by 1"]
  - method: POST
    path: "/distribution/closure-notices"
    description: "File a regulatory, customer or lobby-posting closure notice for an APPROVED case"
    roles: [ComplianceOfficer]
    code: 201
    input: [consolidation_case_id, notice_type, effective_closure_date]
    output: ClosureNotice
    side_effects: ["filed_on = current logical date, required_lead_days copied from case.notice_required_days, lead_days computed as effective_closure_date - filed_on in whole days", "buffer_end_date = effective_closure_date + notice_market_window_conflict.constants.NOTICE_BUFFER_DAYS", "status = FILED", "when notice_type == REGULATOR the case transitions APPROVED -> NOTICE_FILED and increments ConsolidationCase.version by 1"]
  - method: GET
    path: "/distribution/consolidation-cases/{caseId}/closure-notices"
    description: "List the closure notices filed for a case, newest first"
    roles: [NetworkStrategist, ConsolidationApprover, ComplianceOfficer, NetworkOpsAdmin]
    code: 200
    input: ["notice_type?", "status?", "limit?", "offset?"]
    output: ClosureNotice[]
    side_effects: []
  - method: GET
    path: "/distribution/closure-notices/{noticeId}"
    description: "Read one closure notice including its lead days and buffered window end"
    roles: [NetworkStrategist, ConsolidationApprover, ComplianceOfficer, NetworkOpsAdmin]
    code: 200
    input: []
    output: ClosureNotice
    side_effects: []
  - method: GET
    path: "/distribution/closure-notices"
    description: "List closure notices across cases, filtered by case, type or status"
    roles: [NetworkStrategist, ConsolidationApprover, ComplianceOfficer, NetworkOpsAdmin]
    code: 200
    input: ["consolidation_case_id?", "notice_type?", "status?", "limit?", "offset?"]
    output: ClosureNotice[]
    side_effects: []
  - method: POST
    path: "/distribution/closure-notices/{noticeId}/withdraw"
    description: "Withdraw a filed or effective closure notice, releasing its market notice window"
    roles: [ComplianceOfficer]
    code: 200
    input: [withdrawn_reason_code]
    output: ClosureNotice
    side_effects: ["status FILED|EFFECTIVE -> WITHDRAWN", "when notice_type == REGULATOR the case transitions NOTICE_FILED -> APPROVED and increments ConsolidationCase.version by 1"]
  - method: POST
    path: "/distribution/staff-dispositions"
    description: "Propose a redeployment or severance for one employee of the closing branch"
    roles: [HRPartner]
    code: 201
    input: ["consolidation_case_id", "employee_ref", "role_title", "tenure_months", "annual_salary_cents", "proposed_disposition", "target_branch_id?"]
    output: StaffDisposition
    side_effects: ["source_branch_id copied from case.closing_branch_id", "disposition_state = PROPOSED, notification_state = PENDING", "computes service_years, severance_weeks, weekly_pay_cents and severance_amount_cents (calculations.severance_pool step 1)", "recomputes case.severance_pool_cents and the savings chain; case.pending_disposition_count += 1", "increments ConsolidationCase.version by 1"]
  - method: GET
    path: "/distribution/staff-dispositions/{dispositionId}"
    description: "Read one staff disposition including both of its independent state dimensions"
    roles: [NetworkStrategist, ConsolidationApprover, ComplianceOfficer, HRPartner, NetworkOpsAdmin, BranchManager]
    code: 200
    input: []
    output: StaffDisposition
    side_effects: []
  - method: GET
    path: "/distribution/staff-dispositions"
    description: "List staff dispositions filtered by case, source branch, target branch or either state dimension"
    roles: [NetworkStrategist, ConsolidationApprover, ComplianceOfficer, HRPartner, NetworkOpsAdmin, BranchManager]
    code: 200
    input: ["consolidation_case_id?", "source_branch_id?", "target_branch_id?", "disposition_state?", "notification_state?", "limit?", "offset?"]
    output: StaffDisposition[]
    side_effects: []
  - method: POST
    path: "/distribution/staff-dispositions/{dispositionId}/notify"
    description: "Record employee notification; moves only the notification dimension"
    roles: [HRPartner]
    code: 200
    input: []
    output: StaffDisposition
    side_effects: ["notification_state PENDING -> NOTIFIED, notified_on stamped", "disposition_state is unchanged"]
  - method: POST
    path: "/distribution/staff-dispositions/{dispositionId}/accept"
    description: "Record acceptance of a redeployment offer; moves FTE from the closing branch to the target branch"
    roles: [HRPartner]
    code: 200
    input: []
    output: StaffDisposition
    side_effects: ["disposition_state PROPOSED -> OFFER_ACCEPTED", "Branch(source).fte_count -= 1 and Branch(target).fte_count += 1 (calculations.headcount_conservation_invariant); increments both Branch.version values by 1", "case.redeployed_fte_count += 1 and case.pending_disposition_count -= 1"]
  - method: POST
    path: "/distribution/staff-dispositions/{dispositionId}/rescind"
    description: "Rescind an accepted redeployment offer, reversing the headcount movement exactly"
    roles: [HRPartner]
    code: 200
    input: [rescind_reason_code]
    output: StaffDisposition
    side_effects: ["disposition_state OFFER_ACCEPTED -> PROPOSED", "Branch(source).fte_count += 1 and Branch(target).fte_count -= 1, restoring the pre-acceptance counts exactly", "case.redeployed_fte_count -= 1 and case.pending_disposition_count += 1"]
  - method: POST
    path: "/distribution/staff-dispositions/{dispositionId}/sever"
    description: "Execute a severance for a notified employee after the notice period"
    roles: [HRPartner]
    code: 200
    input: []
    output: StaffDisposition
    side_effects: ["disposition_state PROPOSED -> SEVERED, severed_on stamped", "Branch(source).fte_count -= 1; increments Branch.version by 1", "case.severed_fte_count += 1 and case.pending_disposition_count -= 1"]
  - method: POST
    path: "/distribution/property-dispositions"
    description: "Open the real-estate and ATM disposition plan for the closing branch of a case"
    roles: [RealEstateManager]
    code: 201
    input: ["branch_id", "consolidation_case_id", "atm_disposition", "atm_monthly_cost_cents", "atm_monthly_surcharge_revenue_cents", "monthly_rent_cents?", "lease_end_date?", "buyout_offer_cents?", "book_value_cents?", "list_price_cents?"]
    output: PropertyDisposition
    side_effects: ["tenure_class copied from the branch", "computes annual_carry_cents (calculations.property_carry_cost) and atm_breakeven_met (calculations.atm_retention_decision)", "status = PENDING, atm_decision_final adjudicated from atm_disposition and atm_breakeven_met (calculations.atm_retention_decision)", "recomputes the case savings chain and increments ConsolidationCase.version by 1"]
  - method: GET
    path: "/distribution/property-dispositions/{dispositionId}"
    description: "Read one property disposition including carry cost and ATM breakeven outcome"
    roles: [NetworkStrategist, ConsolidationApprover, ComplianceOfficer, RealEstateManager, NetworkOpsAdmin, BranchManager]
    code: 200
    input: []
    output: PropertyDisposition
    side_effects: []
  - method: GET
    path: "/distribution/property-dispositions"
    description: "List property dispositions filtered by branch, case or status"
    roles: [NetworkStrategist, ConsolidationApprover, ComplianceOfficer, RealEstateManager, NetworkOpsAdmin, BranchManager]
    code: 200
    input: ["branch_id?", "consolidation_case_id?", "status?", "atm_disposition?", "limit?", "offset?"]
    output: PropertyDisposition[]
    side_effects: []
  - method: POST
    path: "/distribution/property-dispositions/{dispositionId}/contract"
    description: "Record an executed lease assignment or sale contract on a marketed property"
    roles: [RealEstateManager]
    code: 200
    input: [counterparty_ref, agreed_amount_cents, selling_costs_cents]
    output: PropertyDisposition
    side_effects: ["status MARKETED|HOLDOVER -> ASSIGNMENT_PENDING for LEASED or SALE_PENDING for OWNED", "atm_decision_final is locked and is never re-adjudicated after this transition"]
  - method: POST
    path: "/distribution/property-dispositions/{dispositionId}/settle"
    description: "Settle a contracted disposition; both tenure forks join on DISPOSED"
    roles: [RealEstateManager]
    code: 200
    input: []
    output: PropertyDisposition
    side_effects: ["status ASSIGNMENT_PENDING|SALE_PENDING -> DISPOSED, settled_on stamped", "computes net_disposition_cents (calculations.property_disposition_net)", "recomputes the case savings chain and increments ConsolidationCase.version by 1"]
  - method: POST
    path: "/distribution/transition-campaigns"
    description: "Plan a customer transition wave onto the receiving branch"
    roles: [ComplianceOfficer]
    code: 201
    input: [consolidation_case_id, wave_start_date, wave_end_date, inbound_household_count, channel_mix]
    output: CustomerTransitionCampaign
    side_effects: ["receiving_branch_id copied from case.receiving_branch_id", "computes wave_days and daily_onboarding_load (calculations.campaign_wave_capacity_conflict)", "status = PLANNED"]
  - method: GET
    path: "/distribution/transition-campaigns/{campaignId}"
    description: "Read one transition campaign including its computed daily onboarding load"
    roles: [NetworkStrategist, ConsolidationApprover, ComplianceOfficer, NetworkOpsAdmin, BranchManager]
    code: 200
    input: []
    output: CustomerTransitionCampaign
    side_effects: []
  - method: GET
    path: "/distribution/transition-campaigns"
    description: "List transition campaigns filtered by case, receiving branch or status"
    roles: [NetworkStrategist, ConsolidationApprover, ComplianceOfficer, NetworkOpsAdmin, BranchManager]
    code: 200
    input: ["consolidation_case_id?", "receiving_branch_id?", "status?", "limit?", "offset?"]
    output: CustomerTransitionCampaign[]
    side_effects: []
  - method: POST
    path: "/distribution/transition-campaigns/{campaignId}/launch"
    description: "Launch a planned transition wave"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: CustomerTransitionCampaign
    side_effects: ["status PLANNED -> LAUNCHED, launched_on stamped"]
  - method: POST
    path: "/distribution/de-novo-plans"
    description: "Score and record a de novo branch site in a trade area"
    roles: [NetworkStrategist]
    code: 201
    input: [market_area_id, site_label, proposed_branch_code, target_year1_deposits_cents, capex_budget_cents]
    output: DeNovoSitePlan
    side_effects: ["computes site_score (calculations.de_novo_site_score)", "status = SITE_IDENTIFIED, ramp_status = UNTRACKED"]
  - method: GET
    path: "/distribution/de-novo-plans/{planId}"
    description: "Read one de novo site plan including ramp attainment"
    roles: [NetworkStrategist, ConsolidationApprover, ComplianceOfficer, NetworkOpsAdmin, BranchManager]
    code: 200
    input: []
    output: DeNovoSitePlan
    side_effects: []
  - method: GET
    path: "/distribution/de-novo-plans"
    description: "List de novo site plans filtered by market, opened branch or status"
    roles: [NetworkStrategist, ConsolidationApprover, ComplianceOfficer, NetworkOpsAdmin, BranchManager]
    code: 200
    input: ["market_area_id?", "opened_branch_id?", "status?", "ramp_status?", "limit?", "offset?"]
    output: DeNovoSitePlan[]
    side_effects: []
  - method: POST
    path: "/distribution/de-novo-plans/{planId}/decision"
    description: "Record the approver's branching decision on an identified site: APPROVE or REJECT"
    roles: [ConsolidationApprover]
    code: 200
    input: ["decision", "reason_code?"]
    output: DeNovoSitePlan
    side_effects: ["APPROVE: status SITE_IDENTIFIED -> APPROVED", "REJECT: status SITE_IDENTIFIED -> REJECTED"]
  - method: POST
    path: "/distribution/de-novo-plans/{planId}/open"
    description: "Open the approved de novo site as a live branch and begin ramp tracking"
    roles: [NetworkStrategist]
    code: 200
    input: ["branch_type", "tenure_class", "onboarding_capacity_households_per_day?"]
    output: DeNovoSitePlan
    side_effects: ["status APPROVED -> OPENED then RAMP_TRACKING, opened_on stamped, ramp_month_index = 0, ramp_status = ON_TRACK", "mints a Branch in the plan's market area with branch_code = proposed_branch_code, status = DE_NOVO_RAMPING, deposit_balance_cents = 0, fte_count = 0, atm_count = 1, performance_band = UNSCORED; opened_branch_id is set to it", "MarketArea.own_branch_count += 1 with branch_density_per_100k and saturation_tier recomputed"]
  - method: POST
    path: "/distribution/deposit-observations"
    description: "Post a monthly observed-deposit reading against forecast for a monitored case or a ramping de novo site"
    roles: [NetworkOpsAdmin, NetworkStrategist]
    code: 201
    input: ["subject_type", "month_index", "observed_deposits_cents", "consolidation_case_id?", "de_novo_plan_id?"]
    output: DepositObservation
    side_effects: ["CONSOLIDATION_CASE: computes forecast_deposits_cents, variance_bps and breach (calculations.runoff_variance) and drives case.monitoring_posture plus the market remediation cascade", "DE_NOVO_PLAN: computes forecast_deposits_cents, variance_bps and breach (calculations.de_novo_ramp_attainment) and drives plan.ramp_status and plan.status"]
  - method: GET
    path: "/distribution/deposit-observations/{observationId}"
    description: "Read one deposit observation with its variance against forecast"
    roles: [NetworkStrategist, ConsolidationApprover, ComplianceOfficer, NetworkOpsAdmin, BranchManager]
    code: 200
    input: []
    output: DepositObservation
    side_effects: []
  - method: GET
    path: "/distribution/deposit-observations"
    description: "List deposit observations for a case or a de novo plan in month order"
    roles: [NetworkStrategist, ConsolidationApprover, ComplianceOfficer, NetworkOpsAdmin, BranchManager]
    code: 200
    input: ["subject_type?", "consolidation_case_id?", "de_novo_plan_id?", "breach?", "limit?", "offset?"]
    output: DepositObservation[]
    side_effects: []
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Test-driving endpoint: set the server's logical current UTC instant. The logical clock defaults to 2026-08-01T00:00:00Z when it has never been set. Exists because notice-period elapse, unwind windows and lease holdover are all clock-driven and are otherwise unreachable within a test run."
    roles: [NetworkOpsAdmin]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string, notices_made_effective: integer, properties_moved_to_holdover: integer }"
    side_effects: ["every ClosureNotice in FILED whose effective_closure_date <= the new logical date transitions to EFFECTIVE", "every LEASED PropertyDisposition in MARKETED whose lease_end_date < the new logical date transitions to HOLDOVER with annual_carry_cents recomputed and the case savings chain refreshed"]

errors:
  - error_id: ERR_UNAUTHENTICATED
    http: 401
    condition: "The X-User-ID header is absent or empty on any endpoint"
  - error_id: ERR_FORBIDDEN_ROLE
    http: 403
    condition: "The caller's role is not listed in the endpoint's roles"
  - error_id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "A ConsolidationApprover calls POST /distribution/consolidation-cases/{caseId}/decision on a case whose created_by_user_id equals the caller's X-User-ID"
  - error_id: ERR_CASE_AUTHOR_REQUIRED
    http: 403
    condition: "A NetworkStrategist calls submit or revise on a case whose created_by_user_id is a different user"
  - error_id: ERR_BRANCH_OWNERSHIP_REQUIRED
    http: 403
    condition: "A BranchManager acts on a Branch whose id is not the branch bound to the caller's identity"
  - error_id: ERR_INVALID_REQUEST
    http: 400
    condition: "A required input field is missing, has the wrong type, violates a declared numeric range, or is not a member of the declared enum"
  - error_id: ERR_RESOURCE_NOT_FOUND
    http: 404
    condition: "A path-parameter id does not resolve to a stored entity"
  - error_id: ERR_REFERENCED_RESOURCE_NOT_FOUND
    http: 404
    condition: "A foreign-key field in the request body does not resolve to a stored entity"
  - error_id: ERR_STALE_BRANCH_VERSION
    http: 412
    condition: "expected_branch_version does not equal the current Branch.version on POST /distribution/consolidation-cases"
  - error_id: ERR_STALE_CASE_VERSION
    http: 412
    condition: "expected_case_version does not equal the current ConsolidationCase.version on POST /distribution/retention-forecasts or POST /distribution/consolidation-cases/{caseId}/decision"
  - error_id: ERR_CASE_STATE_INVALID
    http: 409
    condition: "The ConsolidationCase is not in a status from which the requested operation is defined in state_machines.ConsolidationCase"
  - error_id: ERR_BRANCH_NOT_ACTIVE
    http: 409
    condition: "The closing branch of a new case is not in status ACTIVE and has no open case (it is UNDER_REVIEW under another DRAFT case, DE_NOVO_RAMPING, or CLOSED)"
  - error_id: ERR_NOTICE_NOT_OPEN
    http: 409
    condition: "A withdraw is requested on a ClosureNotice already in status WITHDRAWN"
  - error_id: ERR_DISPOSITION_STATE_INVALID
    http: 409
    condition: "The StaffDisposition is not in the disposition_state or notification_state required by the requested operation"
  - error_id: ERR_PROPERTY_STATE_INVALID
    http: 409
    condition: "The PropertyDisposition is not in a status from which the requested contract or settle operation is defined"
  - error_id: ERR_ASSESSMENT_STATE_INVALID
    http: 409
    condition: "A finalize is requested on a CommunityImpactAssessment already in status FINALIZED or in status SUPERSEDED"
  - error_id: ERR_CAMPAIGN_STATE_INVALID
    http: 409
    condition: "A launch is requested on a CustomerTransitionCampaign not in status PLANNED"
  - error_id: ERR_PLAN_STATE_INVALID
    http: 409
    condition: "The DeNovoSitePlan is not in a status from which the requested decision or open operation is defined"
  - error_id: ERR_RECEIVING_BRANCH_NOT_ACTIVE
    http: 409
    condition: "The receiving branch of a case is not in status ACTIVE at the moment of case creation, submit or execute-closure"
  - error_id: ERR_IMPACT_ASSESSMENT_NOT_FINALIZED
    http: 409
    condition: "A REGULATOR closure notice is filed for a case that has no CommunityImpactAssessment in status FINALIZED"
  - error_id: ERR_NOTICE_PERIOD_INSUFFICIENT
    http: 422
    condition: "effective_closure_date - filed_on in whole days is less than case.notice_required_days"
  - error_id: ERR_NOTICE_PERIOD_NOT_ELAPSED
    http: 409
    condition: "execute-closure is requested before the case's REGULATOR notice has reached status EFFECTIVE"
  - error_id: ERR_WARN_PERIOD_NOT_ELAPSED
    http: 409
    condition: "sever is requested on a StaffDisposition whose notified_on is fewer than 60 whole days before the current logical date"
  - error_id: ERR_TRANSITION_CAMPAIGN_NOT_LAUNCHED
    http: 409
    condition: "execute-closure is requested for a case that has no CustomerTransitionCampaign in status LAUNCHED"
  - error_id: ERR_NOTICE_WINDOW_CONFLICT
    http: 409
    condition: "A new REGULATOR notice's [filed_on, buffer_end_date] window touches or overlaps that of another non-WITHDRAWN REGULATOR notice for a closing branch in the same MarketArea"
  - error_id: ERR_PLANNED_DATE_BEFORE_EFFECTIVE
    http: 422
    condition: "case.planned_closure_date is strictly earlier than the effective_closure_date of the REGULATOR notice being filed"
  - error_id: ERR_CAMPAIGN_LEAD_TIME_INSUFFICIENT
    http: 422
    condition: "at creation wave_end_date is not strictly after wave_start_date; at launch clock_today >= wave_start_date, or wave_start_date is earlier than the case REGULATOR notice.filed_on + CAMPAIGN_LEAD_DAYS (14)"
  - error_id: ERR_UNWIND_WINDOW_CLOSED
    http: 409
    condition: "unwind-closure is requested more than 30 whole days after case.executed_on"
  - error_id: ERR_OBSERVATION_OUT_OF_SEQUENCE
    http: 409
    condition: "month_index is not strictly greater than the subject's last_observed_month_index (case) or ramp_month_index (plan)"
  - error_id: ERR_ABSORPTION_CAPACITY_EXCEEDED
    http: 409
    condition: "The aggregate daily onboarding load of all overlapping non-CANCELLED campaigns on the receiving branch exceeds Branch.onboarding_capacity_households_per_day"
  - error_id: ERR_BRANCH_HAS_OPEN_CASE
    http: 409
    condition: "A new case is opened against a closing branch that already has a case in SUBMITTED, APPROVED, NOTICE_FILED, CLOSURE_EXECUTED or POST_CLOSE_MONITORING"
  - error_id: ERR_RECEIVING_BRANCH_INVALID
    http: 422
    condition: "receiving_branch_id equals closing_branch_id, or the named receiving branch belongs to a different MarketArea than the closing branch (the ABSORB_RATIO_BPS floor filters selector candidates only and never rejects an explicitly named receiving branch)"
  - error_id: ERR_DUPLICATE_KEY
    http: 409
    condition: "branch_code is not unique across branches, or a PerformanceSnapshot repeats a period_label for the same branch, or a PropertyDisposition already exists for the branch and case pair, or an employee_ref repeats within a case"
  - error_id: ERR_SEGMENT_MIX_INVALID
    http: 422
    condition: "retail_share_bps + small_business_share_bps + wealth_share_bps does not equal exactly 10000"
  - error_id: ERR_REVISION_LIMIT_EXCEEDED
    http: 409
    condition: "a RETURN decision is requested on a case whose returned_count has already reached REVISION_LIMIT (3)"
  - error_id: ERR_OBSERVATION_SUBJECT_MISMATCH
    http: 422
    condition: "subject_type does not agree with which of consolidation_case_id / de_novo_plan_id was supplied, or both or neither were supplied"
  - error_id: ERR_SITE_SCORE_BELOW_MINIMUM
    http: 422
    condition: "An APPROVE decision is requested on a DeNovoSitePlan whose site_score is below SITE_SCORE_MIN"
  - error_id: ERR_MARKET_OVER_BRANCHED
    http: 409
    condition: "An APPROVE decision is requested on a DeNovoSitePlan whose MarketArea.saturation_tier is OVER_BRANCHED"
  - error_id: ERR_MARKET_DE_NOVO_HOLD
    http: 409
    condition: "An APPROVE or open is requested on a DeNovoSitePlan whose MarketArea.de_novo_hold is true"
  - error_id: ERR_RETENTION_FORECAST_MISSING
    http: 409
    condition: "submit is requested on a case with no RetentionForecast in status ACTIVE"
  - error_id: ERR_PROPERTY_DISPOSITION_MISSING
    http: 409
    condition: "execute-closure is requested for a case whose closing branch has no PropertyDisposition"
  - error_id: ERR_STAFF_DISPOSITIONS_PENDING
    http: 409
    condition: "execute-closure is requested while case.pending_disposition_count is greater than zero"
  - error_id: ERR_NO_ELIGIBLE_RECEIVING_BRANCH
    http: 422
    condition: "receiving_branch_id was omitted and calculations.receiving_branch_selector finds no eligible branch"
  - error_id: ERR_NO_PERFORMANCE_HISTORY
    http: 409
    condition: "GET /distribution/branches/{branchId}/performance-score is requested for a branch whose snapshot_count == 0"
  - error_id: ERR_DISPOSITION_TARGET_INVALID
    http: 422
    condition: "proposed_disposition is REDEPLOYMENT and target_branch_id is absent, or equals source_branch_id, or proposed_disposition is SEVERANCE and target_branch_id was supplied"
  - error_id: ERR_SAVINGS_BELOW_FLOOR
    http: 422
    condition: "submit is requested on a case whose recomputed net_annual_savings_cents is below SAVINGS_FLOOR_CENTS"
  - error_id: ERR_MONITORING_INCOMPLETE
    http: 409
    condition: "close-out is requested on a case whose last_observed_month_index is below 12 or whose monitoring_posture is REMEDIATION"
  - error_id: ERR_PROPERTY_TERMS_INCOMPLETE
    http: 422
    condition: "tenure_class is LEASED and monthly_rent_cents or lease_end_date is absent, or tenure_class is OWNED and book_value_cents or list_price_cents is absent"

roles:
  - role: NetworkStrategist
    identity: opaque
    exclusive_operations:
      - "POST /distribution/consolidation-cases"
      - "POST /distribution/consolidation-cases/{caseId}/submit"
      - "POST /distribution/consolidation-cases/{caseId}/revise"
      - "POST /distribution/retention-forecasts"
      - "POST /distribution/de-novo-plans"
      - "POST /distribution/de-novo-plans/{planId}/open"
    shared_operations:
      - "POST /distribution/market-areas"
      - "POST /distribution/branches"
      - "POST /distribution/branches/{branchId}/performance-snapshots"
      - "POST /distribution/deposit-observations"
      - "GET /distribution/branches/{branchId}/performance-score"
      - "all GET endpoints"
  - role: ConsolidationApprover
    identity: opaque
    exclusive_operations:
      - "POST /distribution/consolidation-cases/{caseId}/decision"
      - "POST /distribution/de-novo-plans/{planId}/decision"
    shared_operations:
      - "GET /distribution/branches/{branchId}/performance-score"
      - "all GET endpoints"
  - role: ComplianceOfficer
    identity: opaque
    exclusive_operations:
      - "POST /distribution/consolidation-cases/{caseId}/impact-assessments"
      - "POST /distribution/impact-assessments/{assessmentId}/finalize"
      - "POST /distribution/closure-notices"
      - "POST /distribution/closure-notices/{noticeId}/withdraw"
      - "POST /distribution/transition-campaigns"
      - "POST /distribution/transition-campaigns/{campaignId}/launch"
      - "POST /distribution/consolidation-cases/{caseId}/execute-closure"
      - "POST /distribution/consolidation-cases/{caseId}/unwind-closure"
    shared_operations:
      - "all GET endpoints"
  - role: HRPartner
    identity: opaque
    exclusive_operations:
      - "POST /distribution/staff-dispositions"
      - "POST /distribution/staff-dispositions/{dispositionId}/notify"
      - "POST /distribution/staff-dispositions/{dispositionId}/accept"
      - "POST /distribution/staff-dispositions/{dispositionId}/rescind"
      - "POST /distribution/staff-dispositions/{dispositionId}/sever"
    shared_operations:
      - "GET /distribution/staff-dispositions"
      - "GET /distribution/staff-dispositions/{dispositionId}"
      - "GET /distribution/market-areas"
      - "GET /distribution/market-areas/{marketAreaId}"
      - "GET /distribution/branches"
      - "GET /distribution/branches/{branchId}"
      - "GET /distribution/consolidation-cases"
      - "GET /distribution/consolidation-cases/{caseId}"
  - role: RealEstateManager
    identity: opaque
    exclusive_operations:
      - "POST /distribution/property-dispositions"
      - "POST /distribution/property-dispositions/{dispositionId}/contract"
      - "POST /distribution/property-dispositions/{dispositionId}/settle"
    shared_operations:
      - "GET /distribution/property-dispositions"
      - "GET /distribution/property-dispositions/{dispositionId}"
      - "GET /distribution/market-areas"
      - "GET /distribution/market-areas/{marketAreaId}"
      - "GET /distribution/branches"
      - "GET /distribution/branches/{branchId}"
      - "GET /distribution/consolidation-cases"
      - "GET /distribution/consolidation-cases/{caseId}"
  - role: BranchManager
    identity: "entity_backed:Branch"
    exclusive_operations: []
    shared_operations:
      - "POST /distribution/branches/{branchId}/performance-snapshots (own branch only)"
      - "GET /distribution/branches/{branchId}/performance-score (own branch only)"
      - "GET /distribution/branches/{branchId}/performance-snapshots (own branch only)"
      - "all other GET endpoints"
  - role: NetworkOpsAdmin
    identity: opaque
    exclusive_operations:
      - "POST /distribution/consolidation-cases/{caseId}/close-out"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "POST /distribution/market-areas"
      - "POST /distribution/branches"
      - "POST /distribution/deposit-observations"
      - "GET /distribution/branches/{branchId}/performance-score"
      - "all GET endpoints"
