scaffold_difficulty_design:
  # =================================================================
  # Rule 1 — dual_variant_calc (different entity domains)
  # =================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: tax_withholding_flat_vs_aggregate
        grounds:
          - calculations.tax_withholding
          - entities.TaxProfile.fields.withholding_method
          - entities.BonusMilestone.fields.withholding_cents
        distinguishing_aspect: |
          Payroll domain: identical 45000-cent HIRE milestones for two
          employees produce different withholding under the FLAT variant
          (9900) than under the AGGREGATE bracket variant (6750), proving two
          valid algorithms diverge on the BonusMilestone/TaxProfile domain.
        test_recipe:
          setup:
            - "Default policy ACTIVE (tiers default; IC base 150000, hire_pct 30)"
            - "Employee A with VERIFIED FLAT tax profile; employee B with VERIFIED AGGREGATE tax profile"
            - "Each has a hired referral on an IC requisition (HIRE milestone 45000 EARNED)"
          setup_api_calls:
            - call: "POST /erp/policy-versions"
              payload: { effective_from: "2026-01-01T00:00:00Z" }
              as: TalentAdmin
              captures: { pol_id: $.data.id }
            - call: "POST /erp/policy-versions/${pol_id}/activate"
              as: TalentAdmin
            - call: "POST /erp/employees"
              payload: { employee_number: "E900", full_name: "Rec Ru", email: "rec@corp.com", department: "TALENT", job_level: "IC", is_recruiter: true, hire_date: "2026-01-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { rec_id: $.data.id }
            - call: "POST /erp/employees"
              payload: { employee_number: "E901", full_name: "Hm Ha", email: "hm@corp.com", department: "PRODUCT", job_level: "MANAGER", hire_date: "2026-01-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { hm_id: $.data.id }
            - call: "POST /erp/employees"
              payload: { employee_number: "E101", full_name: "Ann A", email: "anna@corp.com", department: "ENGINEERING", job_level: "IC", hire_date: "2026-01-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { emp_a: $.data.id }
            - call: "POST /erp/employees"
              payload: { employee_number: "E102", full_name: "Bob B", email: "bob@corp.com", department: "ENGINEERING", job_level: "IC", hire_date: "2026-01-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { emp_b: $.data.id }
            - call: "POST /erp/job-requisitions"
              payload: { req_number: "REQ-IC-1", title: "Engineer", department: "ENGINEERING", level: "IC", openings: 5 }
              as: TalentAdmin
              captures: { req_id: $.data.id }
            - call: "POST /erp/job-requisitions/${req_id}/open"
              as: TalentAdmin
            - call: "PUT /erp/employees/${emp_a}/tax-profile"
              payload: { filing_status: "SINGLE", withholding_method: "FLAT" }
              as: Employee
              as_user_id: "${emp_a}"
            - call: "POST /erp/employees/${emp_a}/tax-profile/verify"
              as: PayrollProcessor
            - call: "PUT /erp/employees/${emp_b}/tax-profile"
              payload: { filing_status: "SINGLE", withholding_method: "AGGREGATE" }
              as: Employee
              as_user_id: "${emp_b}"
            - call: "POST /erp/employees/${emp_b}/tax-profile/verify"
              as: PayrollProcessor
            - call: "POST /erp/referrals"
              payload: { referrer_id: "${emp_a}", job_requisition_id: "${req_id}", candidate_email: "ca@x.com", candidate_full_name: "C A" }
              as: Employee
              as_user_id: "${emp_a}"
              captures: { ref_a: $.data.id }
            - call: "POST /erp/referrals"
              payload: { referrer_id: "${emp_b}", job_requisition_id: "${req_id}", candidate_email: "cb@x.com", candidate_full_name: "C B" }
              as: Employee
              as_user_id: "${emp_b}"
              captures: { ref_b: $.data.id }
            - call: "POST /erp/referrals/${ref_a}/review"
              as: Recruiter
              as_user_id: "${rec_id}"
            - call: "POST /erp/referrals/${ref_a}/qualify"
              as: Recruiter
              as_user_id: "${rec_id}"
            - call: "POST /erp/referrals/${ref_a}/advance"
              payload: { to_state: "SCREENING" }
              as: Recruiter
              as_user_id: "${rec_id}"
            - call: "POST /erp/referrals/${ref_a}/advance"
              payload: { to_state: "INTERVIEWING" }
              as: Recruiter
              as_user_id: "${rec_id}"
            - call: "POST /erp/referrals/${ref_a}/advance"
              payload: { to_state: "OFFER_EXTENDED" }
              as: HiringManager
              as_user_id: "${hm_id}"
            - call: "POST /erp/referrals/${ref_a}/hire"
              payload: { hire_date: "2026-08-01T00:00:00Z" }
              as: HiringManager
              as_user_id: "${hm_id}"
            - call: "POST /erp/referrals/${ref_b}/review"
              as: Recruiter
              as_user_id: "${rec_id}"
            - call: "POST /erp/referrals/${ref_b}/qualify"
              as: Recruiter
              as_user_id: "${rec_id}"
            - call: "POST /erp/referrals/${ref_b}/advance"
              payload: { to_state: "SCREENING" }
              as: Recruiter
              as_user_id: "${rec_id}"
            - call: "POST /erp/referrals/${ref_b}/advance"
              payload: { to_state: "INTERVIEWING" }
              as: Recruiter
              as_user_id: "${rec_id}"
            - call: "POST /erp/referrals/${ref_b}/advance"
              payload: { to_state: "OFFER_EXTENDED" }
              as: HiringManager
              as_user_id: "${hm_id}"
            - call: "POST /erp/referrals/${ref_b}/hire"
              payload: { hire_date: "2026-08-01T00:00:00Z" }
              as: HiringManager
              as_user_id: "${hm_id}"
            - call: "GET /erp/milestones"
              payload: { referral_id: "${ref_a}", kind: "HIRE" }
              as: PayrollProcessor
              captures: { ms_a: "$.data[0].id" }
            - call: "GET /erp/milestones"
              payload: { referral_id: "${ref_b}", kind: "HIRE" }
              as: PayrollProcessor
              captures: { ms_b: "$.data[0].id" }
          trigger:
            - call: "POST /erp/milestones/${ms_a}/approve"
              as: PayrollProcessor
            - call: "POST /erp/milestones/${ms_b}/approve"
              as: PayrollProcessor
          assert:
            - "BonusMilestone.${ms_a}.amount_cents == 45000"
            - "BonusMilestone.${ms_a}.withholding_cents == 9900 (FLAT: round(45000 * 2200/10000))"
            - "BonusMilestone.${ms_a}.net_cents == 35100"
            - "BonusMilestone.${ms_b}.amount_cents == 45000"
            - "BonusMilestone.${ms_b}.withholding_cents == 6750 (AGGREGATE: bracket_tax(45000) - bracket_tax(0) = 6750 - 0)"
            - "BonusMilestone.${ms_b}.net_cents == 38250"
            - "BonusMilestone.${ms_a}.withholding_cents != BonusMilestone.${ms_b}.withholding_cents"

      - name: source_quality_raw_vs_adjusted
        grounds:
          - calculations.source_quality
          - "endpoints[GET /erp/analytics/source-quality]"
        distinguishing_aspect: |
          Analytics domain (distinct from the payroll domain of
          tax_withholding_flat_vs_aggregate): for a group with 1 submission and
          0 hires, hire_rate_raw is 0.0 while the Beta-smoothed
          hire_rate_adjusted is (0+5)/(1+10) = 0.454545 — same rows, two
          divergent metrics.
        test_recipe:
          setup:
            - "Default policy ACTIVE; eligible IC referrer; OPEN IC requisition"
            - "One referral submitted then rejected (reason OTHER)"
          setup_api_calls:
            - call: "POST /erp/policy-versions"
              payload: { effective_from: "2026-01-01T00:00:00Z" }
              as: TalentAdmin
              captures: { pol_id: $.data.id }
            - call: "POST /erp/policy-versions/${pol_id}/activate"
              as: TalentAdmin
            - call: "POST /erp/employees"
              payload: { employee_number: "E900", full_name: "Rec Ru", email: "rec@corp.com", department: "TALENT", job_level: "IC", is_recruiter: true, hire_date: "2026-01-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { rec_id: $.data.id }
            - call: "POST /erp/employees"
              payload: { employee_number: "E101", full_name: "Ann A", email: "anna@corp.com", department: "ENGINEERING", job_level: "IC", hire_date: "2026-01-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { emp_a: $.data.id }
            - call: "POST /erp/job-requisitions"
              payload: { req_number: "REQ-IC-1", title: "Engineer", department: "ENGINEERING", level: "IC" }
              as: TalentAdmin
              captures: { req_id: $.data.id }
            - call: "POST /erp/job-requisitions/${req_id}/open"
              as: TalentAdmin
            - call: "POST /erp/referrals"
              payload: { referrer_id: "${emp_a}", job_requisition_id: "${req_id}", candidate_email: "ca@x.com", candidate_full_name: "C A" }
              as: Employee
              as_user_id: "${emp_a}"
              captures: { ref_a: $.data.id }
            - call: "POST /erp/referrals/${ref_a}/review"
              as: Recruiter
              as_user_id: "${rec_id}"
            - call: "POST /erp/referrals/${ref_a}/reject"
              payload: { reason_code: "OTHER" }
              as: Recruiter
              as_user_id: "${rec_id}"
          trigger:
            - call: "GET /erp/analytics/source-quality"
              payload: { group_by: "REFERRER_LEVEL" }
              as: TalentAdmin
          assert:
            - "Exactly one group (IC) is returned"
            - "group.submissions == 1 and group.hires == 0 and group.retention_met == 0"
            - "group.hire_rate_raw == 0.0"
            - "group.hire_rate_adjusted == 0.454545 ((0+5)/(1+10) rounded half-up to 6dp)"
            - "group.hire_rate_raw != group.hire_rate_adjusted"
            - "group.low_confidence == true (submissions 1 < 10)"
            - "group.total_bonus_paid_cents == 0"

      - name: annual_cap_provisional_vs_committed
        grounds:
          - calculations.annual_cap_accumulators
          - entities.Employee.fields.annual_provisional_cents
          - entities.Employee.fields.annual_committed_cents
        distinguishing_aspect: |
          Employee fiscal domain (distinct from payroll withholding and
          analytics): with one 45000-cent milestone merely EARNED, the
          provisional accumulator counts it (45000) while the committed
          accumulator excludes it (0); only after approve does committed catch
          up (45000).
        test_recipe:
          setup:
            - "Default policy ACTIVE; referrer with VERIFIED FLAT tax profile"
            - "Referral hired on IC requisition; HIRE milestone 45000 EARNED (not yet approved)"
          setup_api_calls:
            - call: "POST /erp/policy-versions"
              payload: { effective_from: "2026-01-01T00:00:00Z" }
              as: TalentAdmin
              captures: { pol_id: $.data.id }
            - call: "POST /erp/policy-versions/${pol_id}/activate"
              as: TalentAdmin
            - call: "POST /erp/employees"
              payload: { employee_number: "E900", full_name: "Rec Ru", email: "rec@corp.com", department: "TALENT", job_level: "IC", is_recruiter: true, hire_date: "2026-01-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { rec_id: $.data.id }
            - call: "POST /erp/employees"
              payload: { employee_number: "E901", full_name: "Hm Ha", email: "hm@corp.com", department: "PRODUCT", job_level: "MANAGER", hire_date: "2026-01-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { hm_id: $.data.id }
            - call: "POST /erp/employees"
              payload: { employee_number: "E101", full_name: "Ann A", email: "anna@corp.com", department: "ENGINEERING", job_level: "IC", hire_date: "2026-01-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { emp_a: $.data.id }
            - call: "POST /erp/job-requisitions"
              payload: { req_number: "REQ-IC-1", title: "Engineer", department: "ENGINEERING", level: "IC" }
              as: TalentAdmin
              captures: { req_id: $.data.id }
            - call: "POST /erp/job-requisitions/${req_id}/open"
              as: TalentAdmin
            - call: "PUT /erp/employees/${emp_a}/tax-profile"
              payload: { filing_status: "SINGLE", withholding_method: "FLAT" }
              as: Employee
              as_user_id: "${emp_a}"
            - call: "POST /erp/employees/${emp_a}/tax-profile/verify"
              as: PayrollProcessor
            - call: "POST /erp/referrals"
              payload: { referrer_id: "${emp_a}", job_requisition_id: "${req_id}", candidate_email: "ca@x.com", candidate_full_name: "C A" }
              as: Employee
              as_user_id: "${emp_a}"
              captures: { ref_a: $.data.id }
            - call: "POST /erp/referrals/${ref_a}/review"
              as: Recruiter
              as_user_id: "${rec_id}"
            - call: "POST /erp/referrals/${ref_a}/qualify"
              as: Recruiter
              as_user_id: "${rec_id}"
            - call: "POST /erp/referrals/${ref_a}/advance"
              payload: { to_state: "SCREENING" }
              as: Recruiter
              as_user_id: "${rec_id}"
            - call: "POST /erp/referrals/${ref_a}/advance"
              payload: { to_state: "INTERVIEWING" }
              as: Recruiter
              as_user_id: "${rec_id}"
            - call: "POST /erp/referrals/${ref_a}/advance"
              payload: { to_state: "OFFER_EXTENDED" }
              as: HiringManager
              as_user_id: "${hm_id}"
            - call: "POST /erp/referrals/${ref_a}/hire"
              payload: { hire_date: "2026-08-01T00:00:00Z" }
              as: HiringManager
              as_user_id: "${hm_id}"
            - call: "GET /erp/employees/${emp_a}"
              as: PayrollProcessor
              captures: { prov_pre: $.data.annual_provisional_cents, comm_pre: $.data.annual_committed_cents }
            - call: "GET /erp/milestones"
              payload: { referral_id: "${ref_a}", kind: "HIRE" }
              as: PayrollProcessor
              captures: { ms_a: "$.data[0].id" }
          trigger:
            - call: "POST /erp/milestones/${ms_a}/approve"
              as: PayrollProcessor
            - call: "GET /erp/employees/${emp_a}"
              as: PayrollProcessor
              captures: { prov_post: $.data.annual_provisional_cents, comm_post: $.data.annual_committed_cents }
          assert:
            - "provisional before approve == 45000 (EARNED included)"
            - "committed before approve == 0 (EARNED excluded)"
            - "provisional after approve == 45000"
            - "committed after approve == 45000"
            - "The two variants diverge exactly while the milestone sits in EARNED"

  # =================================================================
  # Rule 2 — combinatorial_formula (different modes a/b/c)
  # =================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: bonus_quote_multi_input_tiered
        grounds:
          - calculations.bonus_quote
          - entities.Referral.fields.bonus_total_cents
        distinguishing_aspect: |
          Mode (a) — >=3 inputs with non-linear interaction: tier table
          selection (SENIOR -> 300000), campaign multiplier branch (1.5x) plus
          flat add-on (50000), nested min() against campaign remaining budget
          and the annual provisional cap. Result 500000 differs from both the
          bare tier (300000) and the uncapped sum.
        test_recipe:
          setup:
            - "Default policy ACTIVE; OPEN SENIOR requisition in ENGINEERING"
            - "ACTIVE campaign on the requisition: multiplier 15000 bps, flat add-on 50000, budget 1000000, window covering 2026-08-01"
            - "Eligible IC referrer in ENGINEERING (not excluded: IC non-recruiter)"
          setup_api_calls:
            - call: "POST /erp/policy-versions"
              payload: { effective_from: "2026-01-01T00:00:00Z" }
              as: TalentAdmin
              captures: { pol_id: $.data.id }
            - call: "POST /erp/policy-versions/${pol_id}/activate"
              as: TalentAdmin
            - call: "POST /erp/employees"
              payload: { employee_number: "E101", full_name: "Ann A", email: "anna@corp.com", department: "ENGINEERING", job_level: "IC", hire_date: "2026-01-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { emp_a: $.data.id }
            - call: "POST /erp/job-requisitions"
              payload: { req_number: "REQ-SR-1", title: "Sr Engineer", department: "ENGINEERING", level: "SENIOR", hard_to_fill: true }
              as: TalentAdmin
              captures: { req_id: $.data.id }
            - call: "POST /erp/job-requisitions/${req_id}/open"
              as: TalentAdmin
            - call: "POST /erp/campaigns"
              payload: { name: "Q3 push", job_requisition_id: "${req_id}", multiplier_bps: 15000, flat_addon_cents: 50000, window_start: "2026-07-01T00:00:00Z", window_end: "2026-09-30T00:00:00Z", budget_cents: 1000000 }
              as: TalentAdmin
              captures: { camp_id: $.data.id }
            - call: "POST /erp/campaigns/${camp_id}/activate"
              as: TalentAdmin
          trigger:
            - call: "POST /erp/referrals"
              payload: { referrer_id: "${emp_a}", job_requisition_id: "${req_id}", candidate_email: "ca@x.com", candidate_full_name: "C A" }
              as: Employee
              as_user_id: "${emp_a}"
              captures: { ref_a: $.data.id, base: $.data.bonus_base_cents, uplift: $.data.campaign_uplift_cents, total: $.data.bonus_total_cents, camp: $.data.campaign_id }
          assert:
            - "bonus_base_cents == 300000 (tier_senior_cents)"
            - "campaign_uplift_cents == 200000 (round(300000*15000/10000) - 300000 + 50000 = 200000, under remaining budget)"
            - "bonus_total_cents == 500000 (min(300000 + 200000, 2000000 - 0))"
            - "campaign_id == ${camp_id}"
            - "Campaign.${camp_id}.reserved_cents == 200000 and payouts_count == 1"

      - name: milestone_split_rounding_order
        grounds:
          - calculations.milestone_split
          - entities.BonusMilestone.fields.amount_cents
        distinguishing_aspect: |
          Mode (b) — nested rounding where order matters: with an odd gross of
          275001 the pinned order rounds the HIRE leg first (82500) and lets
          RETENTION absorb the remainder (192501); rounding the other leg
          first would shift one cent. hire + retention == gross exactly.
        test_recipe:
          setup:
            - "Default policy ACTIVE (hire_pct 30); OPEN IC requisition"
            - "ACTIVE campaign: multiplier 15000, flat_addon 50001 (odd), budget 1000000 -> gross 275001"
            - "Eligible IC referrer"
          setup_api_calls:
            - call: "POST /erp/policy-versions"
              payload: { effective_from: "2026-01-01T00:00:00Z" }
              as: TalentAdmin
              captures: { pol_id: $.data.id }
            - call: "POST /erp/policy-versions/${pol_id}/activate"
              as: TalentAdmin
            - call: "POST /erp/employees"
              payload: { employee_number: "E900", full_name: "Rec Ru", email: "rec@corp.com", department: "TALENT", job_level: "IC", is_recruiter: true, hire_date: "2026-01-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { rec_id: $.data.id }
            - call: "POST /erp/employees"
              payload: { employee_number: "E901", full_name: "Hm Ha", email: "hm@corp.com", department: "PRODUCT", job_level: "MANAGER", hire_date: "2026-01-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { hm_id: $.data.id }
            - call: "POST /erp/employees"
              payload: { employee_number: "E101", full_name: "Ann A", email: "anna@corp.com", department: "ENGINEERING", job_level: "IC", hire_date: "2026-01-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { emp_a: $.data.id }
            - call: "POST /erp/job-requisitions"
              payload: { req_number: "REQ-IC-1", title: "Engineer", department: "ENGINEERING", level: "IC" }
              as: TalentAdmin
              captures: { req_id: $.data.id }
            - call: "POST /erp/job-requisitions/${req_id}/open"
              as: TalentAdmin
            - call: "POST /erp/campaigns"
              payload: { name: "odd addon", job_requisition_id: "${req_id}", multiplier_bps: 15000, flat_addon_cents: 50001, window_start: "2026-07-01T00:00:00Z", window_end: "2026-09-30T00:00:00Z", budget_cents: 1000000 }
              as: TalentAdmin
              captures: { camp_id: $.data.id }
            - call: "POST /erp/campaigns/${camp_id}/activate"
              as: TalentAdmin
            - call: "POST /erp/referrals"
              payload: { referrer_id: "${emp_a}", job_requisition_id: "${req_id}", candidate_email: "ca@x.com", candidate_full_name: "C A" }
              as: Employee
              as_user_id: "${emp_a}"
              captures: { ref_a: $.data.id }
            - call: "POST /erp/referrals/${ref_a}/review"
              as: Recruiter
              as_user_id: "${rec_id}"
            - call: "POST /erp/referrals/${ref_a}/qualify"
              as: Recruiter
              as_user_id: "${rec_id}"
            - call: "POST /erp/referrals/${ref_a}/advance"
              payload: { to_state: "SCREENING" }
              as: Recruiter
              as_user_id: "${rec_id}"
            - call: "POST /erp/referrals/${ref_a}/advance"
              payload: { to_state: "INTERVIEWING" }
              as: Recruiter
              as_user_id: "${rec_id}"
            - call: "POST /erp/referrals/${ref_a}/advance"
              payload: { to_state: "OFFER_EXTENDED" }
              as: HiringManager
              as_user_id: "${hm_id}"
            - call: "POST /erp/referrals/${ref_a}/hire"
              payload: { hire_date: "2026-08-01T00:00:00Z" }
              as: HiringManager
              as_user_id: "${hm_id}"
          trigger:
            - call: "GET /erp/referrals/${ref_a}/milestones"
              as: PayrollProcessor
          assert:
            - "Referral.${ref_a}.bonus_base_cents == 150000"
            - "Referral.${ref_a}.campaign_uplift_cents == 125001 (225000 - 150000 + 50001)"
            - "Referral.${ref_a}.bonus_total_cents == 275001"
            - "HIRE milestone amount_cents == 82500 (round_half_up(275001 * 30/100) = round(82500.3))"
            - "RETENTION milestone amount_cents == 192501 (275001 - 82500, remainder absorbs the 0.3 fraction)"
            - "HIRE + RETENTION == 275001 exactly (no cent lost or duplicated)"

      - name: bonus_quote_evaluation_order_cap_clip
        grounds:
          - calculations.bonus_quote
          - calculations.annual_cap_accumulators
        distinguishing_aspect: |
          Mode (c) — circular-looking dependency resolved by pinned order:
          campaign uplift is computed first (125000), then the total is
          clipped by the provisional cap remaining (55000 after a prior 45000
          EARNED milestone against a 100000 cap). Evaluating the cap before
          the uplift would yield a different gross.
        test_recipe:
          setup:
            - "Policy ACTIVE with annual_cap_cents 100000 (all else default)"
            - "Referrer already holds a 45000-cent EARNED HIRE milestone this calendar year"
            - "Second OPEN IC requisition with ACTIVE campaign (15000 bps, 50000 flat, budget 1000000)"
          setup_api_calls:
            - call: "POST /erp/policy-versions"
              payload: { effective_from: "2026-01-01T00:00:00Z", annual_cap_cents: 100000 }
              as: TalentAdmin
              captures: { pol_id: $.data.id }
            - call: "POST /erp/policy-versions/${pol_id}/activate"
              as: TalentAdmin
            - call: "POST /erp/employees"
              payload: { employee_number: "E900", full_name: "Rec Ru", email: "rec@corp.com", department: "TALENT", job_level: "IC", is_recruiter: true, hire_date: "2026-01-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { rec_id: $.data.id }
            - call: "POST /erp/employees"
