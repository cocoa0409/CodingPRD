              payload: { basis: "DATE_OF_DEATH", expected_estate_version: "${est_v}" }
              as: Fiduciary
              as_user_id: "${fid1_id}"
              captures: { run_id: $.data.id }
            - call: "POST /valuation-runs/${run_id}/transitions"
              payload: { action: "FINALIZE", finalization_note: "inventory complete" }
