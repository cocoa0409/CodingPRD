      - call: POST /markets
        payload:
          zip_code: '73301'
          state_code: TX
          base_lead_price_cents: 10000
        as: PlatformAdmin
        captures:
          mkt6: $.data.id
          mkt6_v: $.data.version
      - call: POST /brokerages
        payload:
