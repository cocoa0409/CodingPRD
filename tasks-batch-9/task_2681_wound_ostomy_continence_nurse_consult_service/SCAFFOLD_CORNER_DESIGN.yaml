            - call: "POST /patients"
              payload: { mrn: "MRN-AA1", unit_id: "${u1_id}", admitted_at: "2026-07-30T00:00:00Z" }
              as: UnitCharge
              as_user_id: "${u1_id}"
              captures: { p1_id: "$.data.id" }
