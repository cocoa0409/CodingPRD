scaffold_corner_design:
  - section: entities
    instances:
      - name: create_item_applies_declared_defaults_and_initial_derived_state
        claim_type: Defaults
        grounds:
          - entities.Item.fields.quantity
          - entities.Item.fields.lifecycle_state
          - entities.Item.fields.evidence_tier
          - entities.Item.fields.coverage_mode
          - endpoints.POST /vault/items
        distinguishing_aspect: "Omitting quantity, serial_number and both price fields yields quantity 1, lifecycle_state DRAFT, evidence_tier NONE, valuation_state UNVALUED, effective_value_basis NONE, coverage_mode BLANKET and version 1."
        test_recipe:
          setup:
            - "A GENERAL CategorySchedule and a PLUS household with one room; the logical clock has never been set."
          setup_api_calls:
            - call: "POST /vault/category-schedules"
              payload: { category: "GENERAL", useful_life_months: 120, annual_depreciation_pct: 8.0, salvage_floor_pct: 20.0, blanket_sublimit_cents: 900000, appraisal_scope: "GENERAL", serial_required: false }
              as: PlatformAdmin
            - call: "POST /vault/members"
              payload: { email: "c1@example.com", full_name: "Corner One" }
              as: Anonymous
              captures: { owner_id: $.data.id }
            - call: "POST /vault/households"
              payload: { name: "Corner House 1", address_label: "1 Corner St" }
              as: Homeowner
              as_user_id: "${owner_id}"
              captures: { hh_id: $.data.id }
            - call: "POST /vault/subscriptions"
              payload: { household_id: "${hh_id}", tier: "PLUS" }
              as: Homeowner
              as_user_id: "${owner_id}"
            - call: "POST /vault/rooms"
              payload: { household_id: "${hh_id}", name: "Hall", floor_label: "1" }
              as: Homeowner
              as_user_id: "${owner_id}"
              captures: { room_id: $.data.id }
          trigger:
            - call: "POST /vault/items"
              payload: { household_id: "${hh_id}", room_id: "${room_id}", name: "Plain Chair", category: "GENERAL", acquired_at: "2025-01-01T00:00:00Z" }
              as: Homeowner
              as_user_id: "${owner_id}"
              captures: { it_id: $.data.id }
          assert:
            - "the create returns HTTP 201"
            - "Item.${it_id}.quantity == 1"
            - "Item.${it_id}.lifecycle_state == DRAFT"
            - "Item.${it_id}.evidence_tier == NONE"
            - "Item.${it_id}.valuation_state == UNVALUED"
            - "Item.${it_id}.effective_value_basis == NONE"
            - "Item.${it_id}.effective_value_cents == 0"
            - "Item.${it_id}.coverage_mode == BLANKET"
            - "Item.${it_id}.version == 1"
            - "Item.${it_id}.created_at == 2026-05-01T00:00:00.000Z"

      - name: get_item_with_unknown_id_returns_item_not_found
        claim_type: Not Found
        grounds:
          - validations[priority=5]
          - errors[ERR_ITEM_NOT_FOUND]
          - endpoints.GET /vault/items/{item_id}
        distinguishing_aspect: "A syntactically valid but unknown UUID in the item path returns ERR_ITEM_NOT_FOUND with HTTP 404, not the generic ERR_REFERENCE_NOT_FOUND."
        test_recipe:
          setup:
            - "A registered owner with a household; no item with the queried id exists."
          setup_api_calls:
            - call: "POST /vault/members"
              payload: { email: "c2@example.com", full_name: "Corner Two" }
              as: Anonymous
              captures: { owner_id: $.data.id }
            - call: "POST /vault/households"
              payload: { name: "Corner House 2", address_label: "2 Corner St" }
              as: Homeowner
              as_user_id: "${owner_id}"
          trigger:
            - call: "GET /vault/items/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: Homeowner
              as_user_id: "${owner_id}"
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_ITEM_NOT_FOUND"
            - "the response HTTP status is 404"
            - "the response envelope response_type == error"

      - name: list_items_returns_pagination_envelope_fields
        claim_type: Listing
        grounds:
          - endpoints.GET /vault/items
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
        distinguishing_aspect: "GET /vault/items with limit=2 and offset=0 over three items returns exactly 2 rows with total_count 3 and has_more true; offset=2 returns 1 row with has_more false."
        test_recipe:
          setup:
            - "A PLUS household with one room holding three DRAFT items."
          setup_api_calls:
            - call: "POST /vault/category-schedules"
              payload: { category: "GENERAL", useful_life_months: 120, annual_depreciation_pct: 8.0, salvage_floor_pct: 20.0, blanket_sublimit_cents: 900000, appraisal_scope: "GENERAL", serial_required: false }
              as: PlatformAdmin
            - call: "POST /vault/members"
              payload: { email: "c3@example.com", full_name: "Corner Three" }
              as: Anonymous
              captures: { owner_id: $.data.id }
            - call: "POST /vault/households"
              payload: { name: "Corner House 3", address_label: "3 Corner St" }
              as: Homeowner
              as_user_id: "${owner_id}"
              captures: { hh_id: $.data.id }
            - call: "POST /vault/subscriptions"
              payload: { household_id: "${hh_id}", tier: "PLUS" }
              as: Homeowner
              as_user_id: "${owner_id}"
            - call: "POST /vault/rooms"
              payload: { household_id: "${hh_id}", name: "Store", floor_label: "0" }
              as: Homeowner
              as_user_id: "${owner_id}"
              captures: { room_id: $.data.id }
            - call: "POST /vault/items"
              payload: { household_id: "${hh_id}", room_id: "${room_id}", name: "P1", category: "GENERAL", acquired_at: "2025-01-01T00:00:00Z" }
              as: Homeowner
              as_user_id: "${owner_id}"
            - call: "POST /vault/items"
              payload: { household_id: "${hh_id}", room_id: "${room_id}", name: "P2", category: "GENERAL", acquired_at: "2025-01-02T00:00:00Z" }
              as: Homeowner
              as_user_id: "${owner_id}"
            - call: "POST /vault/items"
              payload: { household_id: "${hh_id}", room_id: "${room_id}", name: "P3", category: "GENERAL", acquired_at: "2025-01-03T00:00:00Z" }
              as: Homeowner
              as_user_id: "${owner_id}"
          trigger:
            - call: "GET /vault/items"
              payload: { household_id: "${hh_id}", limit: 2, offset: 0 }
              as: Homeowner
              as_user_id: "${owner_id}"
            - call: "GET /vault/items"
              payload: { household_id: "${hh_id}", limit: 2, offset: 2 }
              as: Homeowner
              as_user_id: "${owner_id}"
          assert:
            - "the first response data array length == 2"
            - "the first response meta/pagination total_count == 3 and has_more == true"
            - "the second response data array length == 1"
            - "the second response has_more == false"

      - name: create_item_missing_required_field_returns_invalid_request
        claim_type: Required Fields
        grounds:
          - validations[priority=3]
          - errors[ERR_INVALID_REQUEST]
          - endpoints.POST /vault/items
        distinguishing_aspect: "Omitting the required acquired_at field returns ERR_INVALID_REQUEST with HTTP 400 and creates no Item row."
        test_recipe:
          setup:
            - "A PLUS household with a room and a GENERAL category schedule."
          setup_api_calls:
            - call: "POST /vault/category-schedules"
              payload: { category: "GENERAL", useful_life_months: 120, annual_depreciation_pct: 8.0, salvage_floor_pct: 20.0, blanket_sublimit_cents: 900000, appraisal_scope: "GENERAL", serial_required: false }
              as: PlatformAdmin
            - call: "POST /vault/members"
              payload: { email: "c4@example.com", full_name: "Corner Four" }
              as: Anonymous
              captures: { owner_id: $.data.id }
            - call: "POST /vault/households"
              payload: { name: "Corner House 4", address_label: "4 Corner St" }
              as: Homeowner
              as_user_id: "${owner_id}"
              captures: { hh_id: $.data.id }
            - call: "POST /vault/subscriptions"
              payload: { household_id: "${hh_id}", tier: "PLUS" }
              as: Homeowner
              as_user_id: "${owner_id}"
            - call: "POST /vault/rooms"
              payload: { household_id: "${hh_id}", name: "Pantry", floor_label: "0" }
              as: Homeowner
              as_user_id: "${owner_id}"
              captures: { room_id: $.data.id }
          trigger:
            - call: "POST /vault/items"
              payload: { household_id: "${hh_id}", room_id: "${room_id}", name: "No Date Item", category: "GENERAL" }
              as: Homeowner
              as_user_id: "${owner_id}"
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_INVALID_REQUEST"
            - "the response HTTP status is 400"
            - "GET /vault/items?household_id=${hh_id} returns an empty array"

      - name: system_and_computed_fields_on_item_ignore_client_supplied_values
        claim_type: System Fields
        grounds:
          - entities.Item.fields.declared_value_cents
          - entities.Item.fields.lifecycle_state
          - entities.Item.fields.evidence_tier
          - endpoints.POST /vault/items
        distinguishing_aspect: "POST /vault/items declares no lifecycle_state, declared_value_cents or evidence_tier in its input list, so a request carrying them is rejected at ladder rung 3 rather than silently honouring them."
        test_recipe:
          setup:
            - "A PLUS household with a room and a GENERAL category schedule."
          setup_api_calls:
            - call: "POST /vault/category-schedules"
              payload: { category: "GENERAL", useful_life_months: 120, annual_depreciation_pct: 8.0, salvage_floor_pct: 20.0, blanket_sublimit_cents: 900000, appraisal_scope: "GENERAL", serial_required: false }
              as: PlatformAdmin
            - call: "POST /vault/members"
              payload: { email: "c5@example.com", full_name: "Corner Five" }
              as: Anonymous
              captures: { owner_id: $.data.id }
            - call: "POST /vault/households"
              payload: { name: "Corner House 5", address_label: "5 Corner St" }
              as: Homeowner
              as_user_id: "${owner_id}"
              captures: { hh_id: $.data.id }
            - call: "POST /vault/subscriptions"
              payload: { household_id: "${hh_id}", tier: "PLUS" }
              as: Homeowner
              as_user_id: "${owner_id}"
            - call: "POST /vault/rooms"
              payload: { household_id: "${hh_id}", name: "Loft", floor_label: "3" }
              as: Homeowner
              as_user_id: "${owner_id}"
              captures: { room_id: $.data.id }
          trigger:
            - call: "POST /vault/items"
              payload: { household_id: "${hh_id}", room_id: "${room_id}", name: "Sneaky Item", category: "GENERAL", acquired_at: "2025-01-01T00:00:00Z", lifecycle_state: "CATALOGED", declared_value_cents: 999999 }
              as: Homeowner
              as_user_id: "${owner_id}"
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_INVALID_REQUEST"
            - "the response HTTP status is 400"
            - "GET /vault/items?household_id=${hh_id} returns an empty array"

      - name: package_line_is_immutable_and_exposes_no_version_field
        claim_type: Immutability
        grounds:
          - entities.PackageLine
          - endpoints.GET /vault/package-lines/{package_line_id}
          - endpoints.GET /vault/package-lines
        distinguishing_aspect: "PackageLine declares common_fields false, so a fetched line carries id and created_at but no updated_at and no version, and the API exposes no PATCH or DELETE for it."
        test_recipe:
          setup:
            - "A PLUS household with one CATALOGED GENERAL item and a GENERATED package holding exactly one line."
          setup_api_calls:
            - call: "POST /vault/category-schedules"
              payload: { category: "GENERAL", useful_life_months: 120, annual_depreciation_pct: 8.0, salvage_floor_pct: 20.0, blanket_sublimit_cents: 900000, appraisal_scope: "GENERAL", serial_required: false }
              as: PlatformAdmin
            - call: "POST /vault/members"
              payload: { email: "c6@example.com", full_name: "Corner Six" }
              as: Anonymous
              captures: { owner_id: $.data.id }
            - call: "POST /vault/households"
              payload: { name: "Corner House 6", address_label: "6 Corner St" }
              as: Homeowner
              as_user_id: "${owner_id}"
              captures: { hh_id: $.data.id }
            - call: "POST /vault/subscriptions"
              payload: { household_id: "${hh_id}", tier: "PLUS" }
              as: Homeowner
              as_user_id: "${owner_id}"
            - call: "POST /vault/rooms"
              payload: { household_id: "${hh_id}", name: "Study", floor_label: "1" }
              as: Homeowner
              as_user_id: "${owner_id}"
              captures: { room_id: $.data.id }
            - call: "POST /vault/items"
              payload: { household_id: "${hh_id}", room_id: "${room_id}", name: "Desk", category: "GENERAL", acquired_at: "2025-01-01T00:00:00Z" }
              as: Homeowner
              as_user_id: "${owner_id}"
              captures: { it_id: $.data.id }
            - call: "POST /vault/items/${it_id}/assets"
              payload: { asset_kind: "PHOTO", byte_size: 9000, checksum: "sha-c6", captured_at: "2026-05-01T00:00:00Z" }
              as: Homeowner
              as_user_id: "${owner_id}"
            - call: "POST /vault/items/${it_id}/declare-value"
              payload: { declared_value_cents: 150000 }
              as: Homeowner
              as_user_id: "${owner_id}"
            - call: "POST /vault/policies"
              payload: { household_id: "${hh_id}", carrier_name: "Northwind Mutual", policy_number: "NW-C6", deductible_cents: 0, scheduled_allowance_cents: 0, effective_from: "2026-05-01T00:00:00Z" }
              as: Homeowner
              as_user_id: "${owner_id}"
              captures: { pol_id: $.data.id }
            - call: "POST /vault/packages"
              payload: { household_id: "${hh_id}", policy_id: "${pol_id}" }
              as: Homeowner
              as_user_id: "${owner_id}"
              captures: { pkg_id: $.data.id }
            - call: "GET /vault/households/${hh_id}"
              payload: {}
              as: Homeowner
              as_user_id: "${owner_id}"
              captures: { hh_v: $.data.version }
            - call: "POST /vault/packages/${pkg_id}/generate"
              payload: { expected_household_version: "${hh_v}" }
              as: Homeowner
              as_user_id: "${owner_id}"
          trigger:
            - call: "GET /vault/package-lines"
              payload: { package_id: "${pkg_id}" }
              as: Homeowner
              as_user_id: "${owner_id}"
              captures: { line_id: "$.data[0].id" }
          assert:
            - "the list returns exactly 1 row"
            - "the row exposes id and created_at"
            - "the row exposes no version field and no updated_at field"
            - "PackageLine.${line_id}.snapshot_effective_value_cents == 150000"
            - "PackageLine.${line_id}.snapshot_effective_value_basis == DECLARED"
            - "PackageLine.${line_id}.snapshot_evidence_tier == PHOTO_ONLY"
            - "PackageLine.${line_id}.stale == false"

      - name: member_self_registration_defaults_to_owner_and_null_household
        claim_type: Defaults
        grounds:
          - entities.Member.fields.member_role
          - entities.Member.fields.household_id
          - endpoints.POST /vault/members
        distinguishing_aspect: "Registering with household_id omitted produces member_role OWNER and household_id null; POST /vault/households then binds the same member to the new household."
        test_recipe:
          setup:
            - "Empty database with the logical clock pinned at its default instant."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /vault/members"
              payload: { email: "c7@example.com", full_name: "Corner Seven" }
              as: Anonymous
              captures: { owner_id: $.data.id }
            - call: "POST /vault/households"
              payload: { name: "Corner House 7", address_label: "7 Corner St" }
              as: Homeowner
              as_user_id: "${owner_id}"
              captures: { hh_id: $.data.id }
          assert:
            - "immediately after registration Member.${owner_id}.member_role == OWNER"
            - "immediately after registration Member.${owner_id}.household_id == null"
            - "after the household create Member.${owner_id}.household_id == ${hh_id}"
            - "Household.${hh_id}.write_gate_state == OPEN"
            - "Household.${hh_id}.item_count == 0"
            - "GET /vault/members?household_id=${hh_id} returns exactly 1 row"

      - name: duplicate_member_email_is_rejected
        claim_type: Type Constraints
        grounds:
          - entities.Member.fields.email
          - validations[priority=3]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "Member.email is unique platform-wide; a second registration with the same address returns ERR_INVALID_REQUEST at ladder rung 3."
        test_recipe:
          setup:
            - "One member already registered with c8@example.com."
          setup_api_calls:
            - call: "POST /vault/members"
              payload: { email: "c8@example.com", full_name: "Corner Eight" }
              as: Anonymous
          trigger:
            - call: "POST /vault/members"
              payload: { email: "c8@example.com", full_name: "Corner Eight Again" }
              as: Anonymous
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_INVALID_REQUEST"
            - "the response HTTP status is 400"

      - name: get_household_with_unknown_id_returns_household_not_found
        claim_type: Not Found
        grounds:
          - validations[priority=5]
          - errors[ERR_HOUSEHOLD_NOT_FOUND]
          - endpoints.GET /vault/households/{household_id}
        distinguishing_aspect: "A missing household in the path yields the domain-specific ERR_HOUSEHOLD_NOT_FOUND, distinct from ERR_ITEM_NOT_FOUND and ERR_REFERENCE_NOT_FOUND."
        test_recipe:
          setup:
            - "A registered member; no household with the queried id exists."
          setup_api_calls:
            - call: "POST /vault/members"
              payload: { email: "c9@example.com", full_name: "Corner Nine" }
              as: Anonymous
              captures: { owner_id: $.data.id }
          trigger:
            - call: "GET /vault/households/11111111-1111-4111-8111-111111111111"
              payload: {}
              as: Homeowner
              as_user_id: "${owner_id}"
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_HOUSEHOLD_NOT_FOUND"
            - "the response HTTP status is 404"

      - name: body_foreign_key_to_missing_room_returns_reference_not_found
        claim_type: Parent Relationships
        grounds:
          - validations[priority=6]
          - errors[ERR_REFERENCE_NOT_FOUND]
          - entities.Item.fields.room_id
        distinguishing_aspect: "A body-level room_id that resolves to nothing returns ERR_REFERENCE_NOT_FOUND at rung 6, a different error from the path-level rung-5 not-founds."
        test_recipe:
          setup:
            - "A PLUS household with a GENERAL category schedule and no rooms."
          setup_api_calls:
            - call: "POST /vault/category-schedules"
              payload: { category: "GENERAL", useful_life_months: 120, annual_depreciation_pct: 8.0, salvage_floor_pct: 20.0, blanket_sublimit_cents: 900000, appraisal_scope: "GENERAL", serial_required: false }
              as: PlatformAdmin
            - call: "POST /vault/members"
              payload: { email: "c10@example.com", full_name: "Corner Ten" }
              as: Anonymous
              captures: { owner_id: $.data.id }
            - call: "POST /vault/households"
              payload: { name: "Corner House 10", address_label: "10 Corner St" }
              as: Homeowner
              as_user_id: "${owner_id}"
              captures: { hh_id: $.data.id }
            - call: "POST /vault/subscriptions"
              payload: { household_id: "${hh_id}", tier: "PLUS" }
              as: Homeowner
              as_user_id: "${owner_id}"
          trigger:
            - call: "POST /vault/items"
              payload: { household_id: "${hh_id}", room_id: "22222222-2222-4222-8222-222222222222", name: "Orphan", category: "GENERAL", acquired_at: "2025-01-01T00:00:00Z" }
              as: Homeowner
              as_user_id: "${owner_id}"
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_REFERENCE_NOT_FOUND"
            - "the response HTTP status is 404"
            - "Household.${hh_id}.item_count == 0"

  - section: state_machines
    instances:
      - name: withdraw_an_already_withdrawn_claim_returns_already_terminal
        claim_type: Terminal State Lockdown
        grounds:
          - state_machines.LossClaim.status.OPEN_to_WITHDRAWN
          - validations[priority=13]
          - errors[ERR_ALREADY_TERMINAL]
        distinguishing_aspect: "WITHDRAWN is a terminal state of the LossClaim axis, so a second withdraw returns ERR_ALREADY_TERMINAL (409) rather than ERR_INVALID_STATE, proving rung 13 fires before rung 14."
        test_recipe:
          setup:
            - "A PLUS household with one CATALOGED GENERAL item, a GENERATED package, and a claim already driven to WITHDRAWN."
          setup_api_calls:
            - call: "POST /vault/category-schedules"
              payload: { category: "GENERAL", useful_life_months: 120, annual_depreciation_pct: 8.0, salvage_floor_pct: 20.0, blanket_sublimit_cents: 900000, appraisal_scope: "GENERAL", serial_required: false }
              as: PlatformAdmin
            - call: "POST /vault/members"
              payload: { email: "c11@example.com", full_name: "Corner Eleven" }
              as: Anonymous
              captures: { owner_id: $.data.id }
            - call: "POST /vault/households"
              payload: { name: "Corner House 11", address_label: "11 Corner St" }
              as: Homeowner
              as_user_id: "${owner_id}"
              captures: { hh_id: $.data.id }
            - call: "POST /vault/subscriptions"
              payload: { household_id: "${hh_id}", tier: "PLUS" }
              as: Homeowner
              as_user_id: "${owner_id}"
            - call: "POST /vault/rooms"
              payload: { household_id: "${hh_id}", name: "Room X", floor_label: "1" }
              as: Homeowner
              as_user_id: "${owner_id}"
              captures: { room_id: $.data.id }
            - call: "POST /vault/items"
              payload: { household_id: "${hh_id}", room_id: "${room_id}", name: "Bureau", category: "GENERAL", acquired_at: "2025-01-01T00:00:00Z" }
              as: Homeowner
              as_user_id: "${owner_id}"
              captures: { it_id: $.data.id }
            - call: "POST /vault/items/${it_id}/assets"
              payload: { asset_kind: "PHOTO", byte_size: 9000, checksum: "sha-c11", captured_at: "2026-05-01T00:00:00Z" }
              as: Homeowner
              as_user_id: "${owner_id}"
            - call: "POST /vault/items/${it_id}/declare-value"
              payload: { declared_value_cents: 100000 }
              as: Homeowner
              as_user_id: "${owner_id}"
            - call: "POST /vault/policies"
              payload: { household_id: "${hh_id}", carrier_name: "Northwind Mutual", policy_number: "NW-C11", deductible_cents: 0, scheduled_allowance_cents: 0, effective_from: "2026-05-01T00:00:00Z" }
              as: Homeowner
              as_user_id: "${owner_id}"
              captures: { pol_id: $.data.id }
            - call: "POST /vault/packages"
              payload: { household_id: "${hh_id}", policy_id: "${pol_id}" }
              as: Homeowner
              as_user_id: "${owner_id}"
              captures: { pkg_id: $.data.id }
            - call: "GET /vault/households/${hh_id}"
              payload: {}
              as: Homeowner
              as_user_id: "${owner_id}"
              captures: { hh_v: $.data.version }
            - call: "POST /vault/packages/${pkg_id}/generate"
              payload: { expected_household_version: "${hh_v}" }
              as: Homeowner
              as_user_id: "${owner_id}"
            - call: "POST /vault/claims"
