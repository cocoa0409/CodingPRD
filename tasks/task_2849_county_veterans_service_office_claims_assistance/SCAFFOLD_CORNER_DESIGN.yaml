            - "DischargeDocument.${doc}.verified_at == null"
            - "DischargeDocument.${doc}.discrepancy_reason == null"
            - "DischargeDocument.${doc}.version == 1"
            - "${dds} == PENDING_VERIFICATION"
            - "${vet_v} == 2"
            - "Veteran.${vet}.character_of_service == null"

      - name: corner_revoked_accreditation_accepts_no_further_transitions
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.Representative.terminal_states
          - validations[priority=40]
          - errors[ERR_INVALID_STATE_TRANSITION]
        distinguishing_aspect: "REVOKED is the only terminal state of the Representative machine, so ACTIVATE, LAPSE, RENEW and a second REVOKE against a revoked row all return ERR_INVALID_STATE_TRANSITION (409) and the revocation_reason recorded at revocation time is preserved."
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z."
            - "rep_a activated and then REVOKED with reason FRAUD_FINDING; the row is at version 3."
          setup_api_calls:
            - call: "POST /cvso/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /cvso/representatives"
              payload: { full_name: "Dana Reyes", accreditation_number: "ACC-2849-401", accreditation_type: "COUNTY_CVSO", accreditation_expires_on: "2029-12-31" }
              as: SystemAdmin
              captures: { rep_a: $.data.id }
            - call: "POST /cvso/representatives/${rep_a}/accreditation"
              payload: { action: "ACTIVATE" }
              as: SystemAdmin
            - call: "POST /cvso/representatives/${rep_a}/accreditation"
              payload: { action: "REVOKE", reason: "FRAUD_FINDING" }
              as: SystemAdmin
          trigger:
            - call: "POST /cvso/representatives/${rep_a}/accreditation"
              payload: { action: "ACTIVATE" }
              as: SystemAdmin
              captures: { err_activate: $.data.error_id }
            - call: "POST /cvso/representatives/${rep_a}/accreditation"
              payload: { action: "LAPSE" }
              as: SystemAdmin
              captures: { err_lapse: $.data.error_id }
            - call: "POST /cvso/representatives/${rep_a}/accreditation"
              payload: { action: "REVOKE", reason: "SECOND_ATTEMPT" }
              as: SystemAdmin
              captures: { err_revoke: $.data.error_id }
          assert:
            - "${err_activate} == ERR_INVALID_STATE_TRANSITION"
            - "${err_lapse} == ERR_INVALID_STATE_TRANSITION"
            - "${err_revoke} == ERR_INVALID_STATE_TRANSITION"
            - "HTTP status of all three trigger calls == 409"
            - "Representative.${rep_a}.accreditation_status == REVOKED"
            - "Representative.${rep_a}.revocation_reason == FRAUD_FINDING"
            - "Representative.${rep_a}.version == 3"

      - name: corner_second_activate_on_the_same_representative_is_refused
        claim_type: idempotency
        grounds:
          - state_machines.Representative[PENDING->ACTIVE]
          - validations[priority=40]
        distinguishing_aspect: "ACTIVATE is not idempotent: the first call returns 200 with version 2, and repeating the identical request returns ERR_INVALID_STATE_TRANSITION (409) without incrementing version to 3."
        test_recipe:
          setup:
