              captures: { man1_id: $.data.id }
            - call: "POST /service-locations/${loc_id}/scrap-manifests"
              payload: { hauler_permit_number: "HP-4030B", hauler_capacity_lbs: 1000 }
              as: ComplianceOfficer
              as_user_id: "officer-signer"
              captures: { man2_id: $.data.id }
            - call: "POST /scrap-manifests/${man1_id}/lines"
