          Two independent backdating guards live in one rule: the successor must start strictly
          after the incumbent (equal dates are refused, not treated as a replacement), and it must
          not reach back over a work_date that has already been billed. A date after the billed
          charge is accepted and truncates the incumbent window instead of overlapping it.
