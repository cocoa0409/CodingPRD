              captures: { err: $.data.error_id }
          assert:
            - "trigger response error_id == ERR_COMPONENT_SHORTAGE (409)"
            - "Component.${comp_id}.allocated_qty == 2"
            - "Component.${comp_id}.available_qty == 1"

      # ---- due-date feasibility window: business-day buffer on Order (different interval semantics) ----
      - name: due_date_buffer_window_rejects_infeasible
        grounds:
          - calculations.rush_tier
          - validations[priority=7]
          - state_machines.Order.DRAFT_to_PRICED
        distinguishing_aspect: |
          Different interval semantics = a half-open BUFFER window on the Order's due date (business days from
          today): a due date yielding business_days < rush_min_business_days is rejected ERR_DUE_DATE_INFEASIBLE,
          treating adjacency to 'today' as a minimum-lead buffer rather than aggregate capacity.
        test_recipe:
          setup:
            - "RushPolicy rush_min_business_days=2. Clock Mon 2026-06-15. Due 2026-06-16 (Tue) -> business_days=1 < 2."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
