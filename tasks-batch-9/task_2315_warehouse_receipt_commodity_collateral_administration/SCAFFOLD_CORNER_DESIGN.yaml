            - "CollateralLien.${lien_p_id}.perfected_at == 2026-08-20T09:00:00Z"
            - "CollateralLien.${lien_p_id}.advance_limit_cents == 290482"
            - "CollateralLien.${lien_p_id}.margin_status == SUFFICIENT"
