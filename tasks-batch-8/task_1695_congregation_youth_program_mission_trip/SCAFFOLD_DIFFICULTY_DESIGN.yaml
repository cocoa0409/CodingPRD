  - rule_id: non_linear_state_machine
    instances:
      - name: consent_form_reject_resubmit_cycle
        grounds:
          - state_machines.ConsentForm.SUBMITTED_to_REJECTED
          - state_machines.ConsentForm.REJECTED_to_SUBMITTED
          - state_machines.ConsentForm.SUBMITTED_to_VERIFIED
        distinguishing_aspect: |
          ConsentForm is CYCLIC (SUBMITTED -> REJECTED -> SUBMITTED -> VERIFIED),
          unlike any linear pipeline: the same row loops, clearing rejection_reason
          and bumping version each lap, and while REJECTED it does not satisfy the
          registration's submit gate.
        test_recipe:
          setup:
            - "Trip Alpha REGISTRATION_OPEN; reg1 DRAFT with PARENTAL_CONSENT + CONDUCT_AGREEMENT already VERIFIED; MEDICAL_RELEASE submitted then REJECTED"
          setup_api_calls:
            - { call: "POST /youth-ministry/programs", payload: {name: "Youth 2026", ministry_year: "2026-2027", scholarship_fund_total_cents: 0, code_of_conduct_text: "CoC", discipline_policy_text: "DP"}, as: ProgramDirector, captures: {prog_id: $.data.id} }
            - { call: "POST /youth-ministry/trips", payload: {program_id: "${prog_id}", name: "Alpha", destination_name: "Lima", destination_type: "INTERNATIONAL", start_date: "2027-06-15", end_date: "2027-06-25", capacity_youth: 30, base_cost_cents: 200000, deposit_cents: 50000, chaperone_ratio: 5, registration_open_at: "2026-08-01T00:00:00Z", registration_close_at: "2026-12-01T00:00:00Z", deposit_due_at: "2027-01-15T00:00:00Z", final_payment_due_at: "2027-05-01T00:00:00Z", emergency_protocol_text: "Protocol"}, as: ProgramDirector, captures: {trip_id: $.data.id} }
            - { call: "POST /youth-ministry/trips/${trip_id}/open-registration", as: ProgramDirector }
            - { call: "POST /youth-ministry/participants", payload: {program_id: "${prog_id}", family_key: "fam-1", first_name: "P", last_name: "One", birth_date: "2011-01-01", grade: 10, annual_income_bracket: "BAND_B", household_size: 3}, as: Guardian, as_user_id: "guardian-1", captures: {p1_id: $.data.id} }
            - { call: "POST /youth-ministry/registrations", payload: {trip_id: "${trip_id}", participant_id: "${p1_id}", insurance_tier: "INTERNATIONAL", fundraising_goal_cents: 0}, as: Guardian, as_user_id: "guardian-1", captures: {reg_id: $.data.id} }
            - { call: "POST /youth-ministry/registrations/${reg_id}/consent-forms", payload: {form_type: "PARENTAL_CONSENT", signed_by_name: "G", signed_at: "2026-08-02T10:00:00Z"}, as: Guardian, as_user_id: "guardian-1", captures: {cfa: $.data.id} }
