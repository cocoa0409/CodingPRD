  # =======================================================================
  - rule_id: cross_entity_state_dependency
    mechanism: |
      Three writes are each gated on the STATE OF A DIFFERENT ENTITY that the
      request body never mentions, and each pair is disjoint:
        (1) ReductionTarget activation reads BaselinePeriod.status;
        (2) DiversionConsignment dispatch reads Hauler.status;
        (3) CorporateRollup publication reads the DataQualityFinding rows of every
            in-scope site.
      Each instance issues the blocked call, moves ONLY the other entity, and
      re-issues the identical call, which must now succeed — so the difference is
      provably the foreign entity's state and nothing about the request.
    instances:

      - name: target_activation_requires_certified_baseline_period
        grounds: "§1.4 validations[priority=65] ERR_BASELINE_NOT_CERTIFIED; §1.2 state_machines.ReductionTarget.PROPOSED_to_ACTIVE precondition on BaselinePeriod.status; §1.3 calculations.reduction_attainment."
        distinguishing_aspect: "Pair (ReductionTarget -> BaselinePeriod). The gating entity is the target's own declared parent-by-FK, and the gate is on a NON-TERMINAL intermediate state: SUBMITTED is not enough, only CERTIFIED opens the transition, so an implementation that merely checks 'the baseline has frozen metrics' passes when it should fail — the SUBMITTED period already carries all six frozen numbers."
        test_recipe:
          setup: |
            Site with one PREP station and FT_PREP. June baseline data: shift 2026-06-10 AM
            meals_served 1000, CLOSED, with 3000 g captured. July performance: shift 2026-07-10 AM
            meals_served 1000, CLOSED, with 2700 g captured. The baseline period
            2026-06-01..2026-06-30 is SUBMITTED but deliberately NOT certified, and an ABSOLUTE
            target for 2026-07-01..2026-07-31 with target_reduction_pct 10.00 is created in
            PROPOSED.
          setup_api_calls:
            - call: "POST /sites"
              payload: { name: "Harbor Kitchen", site_code: "HK-01", region_code: "NE" }
              as: PlatformAdmin
              as_user_id: "pa-1"
              captures: { site_id: "$.data.id" }
            - call: "POST /tracking-stations"
              payload: { site_id: "${site_id}", station_code: "PREP-1", station_kind: "PREP", calibration_due_at: "2027-01-01T00:00:00Z", capture_lock_seconds: 30 }
              as: PlatformAdmin
              as_user_id: "pa-1"
              captures: { station_id: "$.data.id" }
            - call: "POST /food-types"
              payload: { name: "Braised Chicken Portion", category: "PREPARED", default_cost_per_kg_cents: 640, donation_eligible: true, animal_feed_eligible: true, compostable: true, donation_shelf_life_hours: 24 }
              as: PlatformAdmin
              as_user_id: "pa-1"
              captures: { food_type_id: "$.data.id" }
            - call: "POST /shifts"
              payload: { site_id: "${site_id}", shift_date: "2026-06-10", shift_code: "AM", meals_served: 1000 }
              as: ShiftLead
              as_user_id: "sl-1"
              captures: { june_shift: "$.data.id" }
            - call: "POST /waste-entries"
              payload: { station_id: "${station_id}", shift_id: "${june_shift}", food_type_id: "${food_type_id}", weight_grams: 2000, loss_reason: "TRIM", captured_at: "2026-06-10T10:00:00Z" }
              as: KitchenStaff
              as_user_id: "ks-1"
            - call: "POST /waste-entries"
              payload: { station_id: "${station_id}", shift_id: "${june_shift}", food_type_id: "${food_type_id}", weight_grams: 1000, loss_reason: "TRIM", captured_at: "2026-06-10T10:05:00Z" }
              as: KitchenStaff
              as_user_id: "ks-1"
            - call: "POST /shifts/${june_shift}/close"
              payload: {}
              as: ShiftLead
              as_user_id: "sl-1"
            - call: "POST /shifts"
              payload: { site_id: "${site_id}", shift_date: "2026-07-10", shift_code: "AM", meals_served: 1000 }
              as: ShiftLead
              as_user_id: "sl-1"
              captures: { july_shift: "$.data.id" }
            - call: "POST /waste-entries"
              payload: { station_id: "${station_id}", shift_id: "${july_shift}", food_type_id: "${food_type_id}", weight_grams: 2700, loss_reason: "TRIM", captured_at: "2026-07-10T10:00:00Z" }
              as: KitchenStaff
              as_user_id: "ks-1"
            - call: "POST /shifts/${july_shift}/close"
              payload: {}
              as: ShiftLead
              as_user_id: "sl-1"
            - call: "POST /baseline-periods"
              payload: { site_id: "${site_id}", start_date: "2026-06-01", end_date: "2026-06-30" }
              as: SiteSustainabilityManager
              as_user_id: "${site_id}"
              captures: { period_id: "$.data.id" }
            - call: "POST /baseline-periods/${period_id}/submit"
              payload: {}
              as: SiteSustainabilityManager
              as_user_id: "${site_id}"
            - call: "GET /sites/${site_id}"
              payload: {}
              as: SiteSustainabilityManager
              as_user_id: "${site_id}"
              captures: { site_v: "$.data.version" }
            - call: "POST /reduction-targets"
              payload: { site_id: "${site_id}", baseline_period_id: "${period_id}", basis: "ABSOLUTE", target_reduction_pct: 10.00, window_start: "2026-07-01", window_end: "2026-07-31", expected_site_version: "${site_v}" }
              as: CorporateSustainabilityLead
              as_user_id: "csl-1"
              captures: { target_id: "$.data.id" }
          trigger:
            - call: "POST /reduction-targets/${target_id}/activate"
              payload: {}
              as: CorporateSustainabilityLead
              as_user_id: "csl-1"
              captures: { blocked_error: "$.data.error_id" }
            - call: "POST /baseline-periods/${period_id}/certify"
              payload: {}
              as: CorporateSustainabilityLead
              as_user_id: "csl-1"
            - call: "POST /reduction-targets/${target_id}/activate"
              payload: {}
              as: CorporateSustainabilityLead
              as_user_id: "csl-1"
          assert:
            - "The submitted period already carries baseline_entry_count 2, baseline_waste_grams 3000, baseline_waste_kg 3.000, baseline_meals_served 1000, baseline_intensity_kg_per_1k_meals 3.000 and baseline_cost_cents 1920, so the block is not caused by missing metrics."
            - "The FIRST trigger call returns 409 with error_id ERR_BASELINE_NOT_CERTIFIED, and GET /reduction-targets/${target_id} still returns status PROPOSED with activated_at == null and attainment_state == BEHIND (its default)."
            - "The SECOND trigger call moves ONLY the baseline period: it returns status CERTIFIED with certified_at 2026-08-01T00:00:00Z and the six metrics unchanged. The target is untouched by this call."
            - "The THIRD trigger call is byte-identical to the first and now succeeds: status ACTIVE, activated_at 2026-08-01T00:00:00Z, performance_waste_grams 2700, performance_meals_served 1000, performance_intensity_kg_per_1k_meals 2.700, absolute_reduction_pct 10.00, effective_reduction_pct 10.00."
            - "attainment_state == ACHIEVED_PENDING on the third call because min_diversion_rate_pct defaulted to 0.0 and Site.diversion_rate_pct (null) is read as 0.00, so the floor is met with nothing diverted."
            - "intensity_reduction_pct == 10.00 as well on this fixture (3.000 -> 2.700), but it does not decide anything because basis is ABSOLUTE."

      - name: consignment_dispatch_requires_approved_hauler_while_staging_does_not
        grounds: "§1.4 validations[priority=65] ERR_HAULER_NOT_APPROVED; §1.2 state_machines.DiversionConsignment.logistics.STAGED_to_DISPATCHED precondition on Hauler.status; §1.2 state_machines.Hauler PENDING_to_APPROVED."
        distinguishing_aspect: "Pair (DiversionConsignment -> Hauler), a peer-aggregate dependency rather than a parent one. The instance additionally pins WHERE the gate is: the same PENDING hauler permits creation AND staging and only blocks dispatch, so an implementation that checks hauler approval at consignment creation (the intuitive place) fails the staging assertion even though it would pass the dispatch assertion."
        test_recipe:
          setup: |
            Site, PREP station, FT_PREP, one OPEN shift 2026-06-10 AM meals_served 1000 and one
            1000 g capture. Hauler H1 is created and left in PENDING. A COMPOST consignment is
            created against the PENDING hauler, given one line, and staged — all of which must be
            permitted.
          setup_api_calls:
            - call: "POST /sites"
              payload: { name: "Harbor Kitchen", site_code: "HK-01", region_code: "NE" }
              as: PlatformAdmin
              as_user_id: "pa-1"
              captures: { site_id: "$.data.id" }
            - call: "POST /tracking-stations"
              payload: { site_id: "${site_id}", station_code: "PREP-1", station_kind: "PREP", calibration_due_at: "2027-01-01T00:00:00Z", capture_lock_seconds: 30 }
              as: PlatformAdmin
              as_user_id: "pa-1"
              captures: { station_id: "$.data.id" }
            - call: "POST /food-types"
              payload: { name: "Braised Chicken Portion", category: "PREPARED", default_cost_per_kg_cents: 640, donation_eligible: true, animal_feed_eligible: true, compostable: true, donation_shelf_life_hours: 24 }
              as: PlatformAdmin
              as_user_id: "pa-1"
              captures: { food_type_id: "$.data.id" }
            - call: "POST /haulers"
              payload: { name: "Green Loop Compost", channels: ["COMPOST"], rate_cents_per_tonne: 52000, stop_fee_cents: 1800, capacity_kg_per_pickup: 500, max_concurrent_pickups: 1 }
              as: PlatformAdmin
              as_user_id: "pa-1"
              captures: { hauler_id: "$.data.id" }
            - call: "POST /shifts"
