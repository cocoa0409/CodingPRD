              payload: { legal_name: "Ava Reyes", domicile_state_code: "CA" }
              as: RightsAdministrator
              captures: { t_id: $.data.id }
          trigger:
            - call: "GET /estate-authorities/11111111-1111-4111-8111-111111111111"
              payload: {}
              as: RightsAdministrator
            - call: "GET /generated-performances/22222222-2222-4222-8222-222222222222"
              payload: {}
              as: RightsAdministrator
            - call: "GET /usage-licenses/33333333-3333-4333-8333-333333333333"
              payload: {}
              as: RightsAdministrator
            - call: "GET /infringement-cases/44444444-4444-4444-8444-444444444444"
              payload: {}
              as: RightsAdministrator
            - call: "GET /compensation-entries/55555555-5555-4555-8555-555555555555"
              payload: {}
              as: RightsAdministrator
            - call: "GET /talents/66666666-6666-4666-8666-666666666666"
              payload: {}
              as: RightsAdministrator
          assert:
            - "trigger call 1 -> 404 ERR_ESTATE_AUTHORITY_NOT_FOUND; call 2 -> 404 ERR_GENERATED_PERFORMANCE_NOT_FOUND; call 3 -> 404 ERR_USAGE_LICENSE_NOT_FOUND"
            - "trigger call 4 -> 404 ERR_INFRINGEMENT_CASE_NOT_FOUND; call 5 -> 404 ERR_COMPENSATION_ENTRY_NOT_FOUND; call 6 -> 404 ERR_TALENT_NOT_FOUND"
            - "every response carries response_type == \"error\", a meta.api_request_id, and data.error_id plus a human message — the envelope shape does not change for errors"
            - "GET /talents/${t_id} still returns 200, proving the 404s are per-row misses and not a broken route"

      - name: missing_state_law_profile_blocks_talent_and_case_creation
        claim_type: error_triggerable
        grounds: [validations.priority_20, errors.ERR_STATE_LAW_PROFILE_MISSING]
        distinguishing_aspect: >-
          The profile lookup happens on two different fields: a talent's domicile_state_code and a
          case's detected_state_code. Both are probed with WY, for which no profile exists, so an
          implementation that only guards the domicile path is caught by the case path.
        test_recipe:
          setup:
            - "CA profile only — no WY profile is ever created"
            - "One CA talent"
          setup_api_calls:
            - call: "POST /state-law-profiles"
              payload: { state_code: "CA", postmortem_rights_years: 70, postmortem_requires_registration: true, biometric_retention_max_days: 3650, deletion_grace_days: 30, removal_window_days: 14, disclosure_required_advertising: true, disclosure_required_entertainment: true, min_disclosure_rank_advertising: 3, min_disclosure_rank_entertainment: 2 }
              as: RightsAdministrator
            - call: "POST /talents"
              payload: { legal_name: "Ava Reyes", domicile_state_code: "CA" }
              as: RightsAdministrator
              captures: { t_id: $.data.id }
          trigger:
            - call: "POST /talents"
              payload: { legal_name: "Wyatt Boone", domicile_state_code: "WY" }
              as: RightsAdministrator
            - call: "POST /infringement-cases"
              payload: { talent_id: "${t_id}", detection_source: "MANUAL_REPORT", suspect_url: "https://pirate.example/wy", detected_channel: "ADVERTISING", detected_state_code: "WY", detected_view_count: 5000, match_confidence: 0.600 }
              as: ComplianceOfficer
              as_user_id: "co-001"
            - call: "POST /infringement-cases"
              payload: { talent_id: "${t_id}", detection_source: "MANUAL_REPORT", suspect_url: "https://pirate.example/ca", detected_channel: "ADVERTISING", detected_state_code: "CA", detected_view_count: 5000, match_confidence: 0.600 }
              as: ComplianceOfficer
              as_user_id: "co-001"
          assert:
            - "trigger call 1 -> 422 with data.error_id == \"ERR_STATE_LAW_PROFILE_MISSING\" and GET /talents returns total_count == 1 — no orphan talent was written"
            - "trigger call 2 -> 422 with the same error_id: the use-state profile is required even though the talent's own domicile profile exists"
            - "trigger call 3 -> 201 with severity_score == 0.4051: 0.60*0.600 = 0.36, plus 0.25*(5000/10000000) = 0.000125, plus 0.15*0.30 = 0.045, giving 0.405125 which round_half_up to 4dp makes 0.4051"
            - "the accepted case reports enforceable_under_use_state == true and use_state_rights_until == null, since the talent is LIVING"

      - name: repeat_death_record_and_repeat_purge_are_state_errors
        claim_type: error_triggerable
        grounds: [validations.priority_32, validations.priority_36]
