              payload: {}
              as: TransactionManager
              as_user_id: tm-001
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-01T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: admin-001
            - call: "GET /msr/purchase-agreements/${pa_id}"
              payload: {}
              as: ComplianceOfficer
              as_user_id: co-002
              captures: { pa_v1: "$.data.version", elig: "$.data.holdback_release_eligible_at", ret0: "$.data.holdback_retained_cents" }
          trigger:
            - call: "POST /msr/purchase-agreements/${pa_id}/holdback-releases"
              payload: { expected_purchase_agreement_version: "${pa_v1}" }
              as: ComplianceOfficer
              as_user_id: co-002
              captures: { pa_v2: "$.data.version", rel1: "$.data.holdback_released_cents", ret1: "$.data.holdback_retained_cents", st1: "$.data.status" }
            - call: "POST /msr/purchase-agreements/${pa_id}/holdback-releases"
              payload: { expected_purchase_agreement_version: "${pa_v1}" }
              as: ComplianceOfficer
              as_user_id: co-002
              captures: { err_stale: "$.data.error_id" }
            - call: "POST /msr/purchase-agreements/${pa_id}/holdback-releases"
              payload: { expected_purchase_agreement_version: "${pa_v2}" }
              as: ComplianceOfficer
              as_user_id: co-002
              captures: { err_exh: "$.data.error_id" }
          assert:
            - "${elig} == 2026-10-01 (transfer_date 2026-09-01 plus 30 days) and ${ret0} == 28320"
            - "the first release is 200: ${rel1} == 28320, ${ret1} == 0, ${st1} == HOLDBACK_RELEASED and ${pa_v2} is one greater than ${pa_v1}"
            - "the replay with the consumed token is 412 with ${err_stale} == ERR_STALE_AGREEMENT_VERSION"
            - "the same replay with the CURRENT token is 409 with ${err_exh} == ERR_HOLDBACK_EXHAUSTED — the balance objection surfaces only once the token is right"
            - "holdback_released_cents is still 28320 after both refusals, so neither attempt double-paid"
            - "the same call one day earlier (clock 2026-09-30) with a correct token is 409 ERR_HOLDBACK_NOT_ELIGIBLE at priority 43, which also sits below the token check"

      - name: rate_curve_cascade_layer_is_covered_by_the_four_level_chain
        claim_type: cascading_side_effects
        grounds:
          - complexity_profile.complexity_layers
          - state_machines.RateCurveSnapshot
          - state_machines.ValuationRun
        excluded_because:
          difficulty_instance: transitive_cascade / rate_curve_publication_cascades_four_levels_to_lapsed_bid
          rationale: "The layer's N-level and ordering-sensitivity claims are exactly that difficulty instance: one curve publication walks snapshot -> valuation run -> bid package -> bid, and its recipe already asserts the depth, the per-level statuses and the non-propagation into the awarded branch."

      - name: completion_cascade_layer_is_covered_by_the_bubble_up_chain
        claim_type: cascading_side_effects
        grounds:
          - complexity_profile.complexity_layers
          - state_machines.ServicingTransfer
          - state_machines.ServicingPortfolio
        excluded_because:
          difficulty_instance: transitive_cascade / transfer_completion_cascades_loans_portfolio_and_open_hedge
          rationale: "The partial-failure and bubble-up halves of the layer are covered there: completion rewrites every non-terminal loan, re-derives the portfolio and closes the open hedge position, and the recipe asserts a terminal loan is left untouched."

      - name: dual_variant_layer_is_covered_by_the_valuation_method_split
        claim_type: dual_variant_calculation
        grounds:
          - complexity_profile.complexity_layers
          - calculations.msr_fair_value.variants
        excluded_because:
          difficulty_instance: dual_variant_calc / msr_fair_value_static_versus_oas_shock_weighted
          rationale: "Both variants and the signed delta between them on identical inputs are asserted in that instance, which is the layer's entire claim set for this scaffold."

      - name: rate_threshold_layer_is_covered_by_the_tier_boundary
        claim_type: rate_threshold_triggers
        grounds:
          - complexity_profile.complexity_layers
          - calculations.complaint_concentration_release.constants
        excluded_because:
          difficulty_instance: boundary_precision_check / complaint_ratio_exactly_at_tier_one_upper_bound_releases_in_full
          rationale: "The instantaneous threshold is tested at the 25.00 percent boundary and one case either side of it there; the cumulative half (the remediation cap) is asserted in the same recipe."

  - section: consistency_model
    instances:

      - name: every_derived_value_is_visible_in_the_response_that_caused_it
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - response_envelope
          - endpoints[POST /msr/bid-packages/{id}/award].side_effects
        distinguishing_aspect: "The scaffold is immediate-consistency, so the write response itself must already carry the computed economics AND the cascade must already be observable on the OTHER entities in the very next read, with no settling step and no second call to trigger recomputation."
        test_recipe:
          setup: ["Fixture T has one bid on a published package, ready to be awarded."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
