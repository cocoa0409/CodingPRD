            - "GET /homesites filtered by phase_id ${ph} reports total_count == 2"

      - name: a_predecessor_phase_from_another_community_is_rejected
        claim_type: cross_entity_validation
        grounds:
          - validations.priority_63_invalid_phase_predecessor
          - entities.Phase.fields.predecessor_phase_id
          - errors.ERR_INVALID_PHASE_PREDECESSOR
        distinguishing_aspect: |
          predecessor_phase_id must resolve (priority 32) *and* belong to the same Community, so naming a
          real phase that lives in a different community is a 409 ERR_INVALID_PHASE_PREDECESSOR rather
          than a 404 — the identity exists, the relationship is illegal. The same request pointed at a
          sibling phase in its own community is accepted.
        test_recipe:
          setup:
            - "Two platted communities 'Kilnbrook' and 'Lanternhill'; Kilnbrook already owns one HOUSING phase."
          setup_api_calls:
            - call: "POST /communities"
              payload: { name: "Kilnbrook", market_code: "NC-RAL", total_planned_units: 6, product_mix: { DETACHED: 6, COTTAGE: 0, TOWNHOME: 0 }, single_ownership_covenant: true, concession_budget_cents: 1000000, facility_commitment_cents: 20000000, maintenance_tech_headcount: 2 }
