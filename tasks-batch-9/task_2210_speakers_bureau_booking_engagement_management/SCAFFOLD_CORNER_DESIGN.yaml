              as: BookingAgent
              as_user_id: "agent-01"
              captures: { inq: $.data.id }
            - call: "POST /inquiries/${inq}/qualify"
              payload: { outcome: "QUALIFY" }
              as: BookingAgent
              as_user_id: "agent-01"
              captures: { inq_v: $.data.version }
            - call: "POST /inquiries/${inq}/proposals"
              payload: { expected_inquiry_version: "${inq_v}", valid_until_utc: "2026-09-20T00:00:00Z" }
              as: BookingAgent
              as_user_id: "agent-01"
              captures: { pr: $.data.id }
          trigger:
            - call: "POST /inquiries/${inq}/qualify"
              payload: { outcome: "QUALIFY" }
              as: Client
              as_user_id: "${cl}"
              captures: { e1: $.data.error_id }
            - call: "POST /proposal-options"
              payload: { proposal_id: "${pr}", speaker_id: "${sp}", quoted_fee_cents: 1275000, rank_no: 1 }
              as: Client
              as_user_id: "${cl}"
              captures: { e2: $.data.error_id }
            - call: "POST /speakers"
              payload: { full_name: "Self Serve", topics: ["AI_STRATEGY"], fee_floor_cents: 100, fee_ceiling_cents: 200, travel_class: "ECONOMY" }
              as: Client
              as_user_id: "${cl}"
              captures: { e3: $.data.error_id }
          assert:
            - "all three attempts return 403 with data.error_id == ERR_UNAUTHORIZED"
            - "ERR_UNAUTHORIZED is decided before any state or ownership check, so the inquiry's own state is irrelevant"
            - "nothing is created or mutated: the proposal still has options_count 0 and the roster still holds exactly one speaker"

