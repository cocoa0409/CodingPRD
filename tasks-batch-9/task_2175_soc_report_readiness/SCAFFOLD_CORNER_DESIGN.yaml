  - section: consistency_model
    instances:
      - name: corner_derived_posture_is_visible_immediately_in_the_same_request_cycle
        claim_type: immediate
        grounds: ["calculations.gap_debt_points", "calculations.engagement_gap_posture", "entities.Engagement.fields.gap_posture"]
        distinguishing_aspect: "The consistency model is immediate: the POST /soc/gaps response itself reports the stored gap, and a GET issued straight afterwards already shows gap_debt_points 23.00 and gap_posture FROZEN with no intervening ops-run or re-read required."
        test_recipe:
          setup:
            - "Engagement 'Instant' in SCOPING with gap_posture OPEN and gap_debt_points 0.00."
          setup_api_calls:
            - call: "POST /soc/engagements"
              payload: { client_name: "Instant", report_type: "SOC_2_TYPE_2", observation_period_start: "2026-09-01T00:00:00.000Z", observation_period_end: "2026-11-30T00:00:00.000Z", required_criteria_categories: ["SECURITY"] }
              as: ComplianceLead
              as_user_id: "cl-1"
              captures: { eng: $.data.id }
            - call: "GET /soc/engagements/${eng}"
              payload: {}
              as: ComplianceLead
              as_user_id: "cl-1"
              captures: { posture_pre: $.data.gap_posture, debt_pre: $.data.gap_debt_points }
          trigger:
            - call: "POST /soc/gaps"
              payload: { engagement_id: "${eng}", severity: "CRITICAL", description: "No incident response capability" }
              as: ComplianceLead
              as_user_id: "cl-1"
              captures: { g: $.data.id, g_debt: $.data.debt_points }
            - call: "GET /soc/engagements/${eng}"
              payload: {}
              as: ComplianceLead
              as_user_id: "cl-1"
              captures: { posture_post: $.data.gap_posture, debt_post: $.data.gap_debt_points, base_post: $.data.base_debt_points }
          assert:
            - "${posture_pre} == OPEN"
            - "${debt_pre} == 0.00"
            - "${g_debt} == 20"
            - "${base_post} == 20"
            - "${debt_post} == 23.00"
            - "${posture_post} == FROZEN"
            - "Gap.${g}.source == MANUAL"
            - "Gap.${g}.status == OPEN"
