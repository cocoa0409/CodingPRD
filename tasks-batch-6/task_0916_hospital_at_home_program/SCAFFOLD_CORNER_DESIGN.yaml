      - name: cold_chain_excursion_of_30_minutes_delivers_and_31_minutes_is_rejected
        claim_type: violation_to_error
        grounds:
          - "validations[priority=21]"
          - "errors[ERR_COLD_CHAIN_EXCURSION]"
          - entities.DeliveryOrder.fields.last_excursion_minutes
        distinguishing_aspect: "COLD_CHAIN_MAX_EXCURSION_MINUTES is an at-or-below bound on two non-controlled cold-chain orders: 30 minutes delivers, 31 minutes rejects with ERR_COLD_CHAIN_EXCURSION and leaves the order OUT_FOR_DELIVERY."
        test_recipe:
          setup:
            - "One ACTIVE CMS_WAIVER episode with two non-controlled cold-chain MEDICATION orders of 1.0 kg, both AUTHORIZED and OUT_FOR_DELIVERY."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T08:00:00Z" }
