              as: QualityEngineer
              captures: { e_missing: $.data.error_id }
            - call: "POST /toolworks/test-runs"
              payload: { lot_id: "${lot_id}", test_type: "HARDNESS", specimen_count: 2, chamber_id: "${chamber_id}", window_start: "2026-08-03T08:00:00Z", window_end: "2026-08-03T09:00:00Z" }
