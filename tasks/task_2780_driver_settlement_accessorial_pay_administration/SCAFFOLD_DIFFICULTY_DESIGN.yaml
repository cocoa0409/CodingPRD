          A true CYCLE: DENIED is not terminal, so the walk OPEN -> UNDER_REVIEW -> DENIED -> OPEN
          -> UNDER_REVIEW -> UPHELD returns to two already-visited states, and each pass increments
          reopen_count, meaning the second visit to OPEN is not equivalent to the first - the third
