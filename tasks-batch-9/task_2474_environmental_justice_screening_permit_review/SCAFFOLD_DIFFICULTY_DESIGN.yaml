          The blocking dependency lives in a Venue - a different sibling entity from the
          assessment case: an OPEN plan and a legal in-window slot are not enough,
          because a venue whose status is DECOMMISSIONED refuses the booking with
          ERR_VENUE_DECOMMISSIONED (409) and leaves booked_meeting_count at 0, while the
          identical request against an ACTIVE venue books and sets accessibility_verified.
