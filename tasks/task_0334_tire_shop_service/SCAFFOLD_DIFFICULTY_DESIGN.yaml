              as: ServiceAdvisor
              captures: { veh_id: $.data.id }
            - call: "POST /tire-models"
              payload: { brand: "YOKOHAMA", model_name: "GEOLANDAR", size_token: "225/65R17", load_index: 102, speed_rating: "H", unit_price_cents: 12000, mileage_warranty_miles: 60000, original_tread_32nds: 11, stock_qty: 8 }
              as: InventoryManager
              captures: { tm_id: $.data.id }
            - call: "POST /fitment-rules"
              payload: { vehicle_id: "${veh_id}", tire_model_id: "${tm_id}", fitment_grade: "OE_EXACT" }
              as: InventoryManager
            - call: "POST /work-orders"
              payload: { customer_id: "${cust_id}", vehicle_id: "${veh_id}" }
              as: ServiceAdvisor
              captures: { wo_id: $.data.id, wo_v0: $.data.version }
            - call: "POST /work-orders/${wo_id}/lines"
              payload: { line_type: "TIRE", tire_model_id: "${tm_id}", quantity: 4, road_hazard_opted: false, expected_work_order_version: "${wo_v0}" }
              as: ServiceAdvisor
              captures: { line_id: $.data.id, wo_v1: $.data.version }
            - call: "POST /work-orders/${wo_id}/approve"
              payload: { expected_work_order_version: "${wo_v1}" }
              as: ServiceAdvisor
            - call: "POST /mileage-claims"
