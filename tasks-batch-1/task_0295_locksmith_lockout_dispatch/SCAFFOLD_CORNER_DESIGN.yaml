            - "response.data.error_id == ERR_BAY_NOT_OPEN"

  # ===========================================================================
  - section: rbac
    instances:
      - name: technician_cannot_intake_job
        claim_type: rbac_denial
        grounds:
          - roles.Technician
          - roles.Dispatcher
          - errors[ERR_FORBIDDEN_ROLE]
        distinguishing_aspect: "A Technician calling POST /service-jobs (Dispatcher-exclusive) is denied with 403 ERR_FORBIDDEN_ROLE."
        test_recipe:
          setup:
            - "Empty DB."
          setup_api_calls: []
          trigger:
            - call: "POST /service-jobs"
              payload: { customer_name: "C", customer_user_id: "cust-c", service_type: "LOCKOUT", service_address: "A St", requested_at_minute: 600 }
              as: Technician
              as_user_id: "tech-any"
              captures: { errrb: $.data.error_id }
          assert:
            - "response.status == 403"
            - "response.data.error_id == ERR_FORBIDDEN_ROLE"

      - name: customer_not_owner_cannot_approve_quote
        claim_type: rbac_denial
        grounds:
          - roles.Customer
          - validations[priority=4]
          - errors[ERR_NOT_JOB_OWNER]
        distinguishing_aspect: "A Customer whose X-User-ID != ServiceJob.customer_user_id approving a SUBMITTED quote is denied with 403 ERR_NOT_JOB_OWNER (ownership, not mere role)."
        test_recipe:
          setup:
            - "Job (owner cust-own) ON_SITE with a SUBMITTED quote; a different customer acts."
          setup_api_calls:
            - call: "POST /technicians"
              payload: { full_name: "To", certified_for: ["REKEY"], base_travel_minutes: 20 }
              as: Dispatcher
              captures: { techo: $.data.id }
            - call: "POST /service-jobs"
              payload: { customer_name: "Co", customer_user_id: "cust-own", service_type: "REKEY", service_address: "O St", requested_at_minute: 600 }
              as: Dispatcher
              captures: { jobo: $.data.id }
            - call: "POST /service-jobs/${jobo}/dispatches"
              payload: { technician_id: "${techo}", eta_start_minute: 605, eta_end_minute: 650 }
              as: Dispatcher
              captures: { dispo: $.data.id }
            - call: "POST /dispatches/${dispo}/depart"
              payload: {}
              as: Technician
              as_user_id: "${techo}"
            - call: "POST /dispatches/${dispo}/arrive"
              payload: { arrived_at_minute: 640 }
              as: Technician
              as_user_id: "${techo}"
            - call: "POST /service-jobs/${jobo}/quotes"
              payload: { labor_hours: 1.0, part_lines: [] }
              as: Technician
              as_user_id: "${techo}"
              captures: { quoteo: $.data.id }
            - call: "POST /quotes/${quoteo}/submit"
              payload: {}
              as: Technician
              as_user_id: "${techo}"
          trigger:
            - call: "POST /quotes/${quoteo}/approve"
              payload: {}
              as: Customer
              as_user_id: "cust-intruder"
              captures: { erro: $.data.error_id }
          assert:
            - "response.status == 403"
            - "response.data.error_id == ERR_NOT_JOB_OWNER"
            - "OnSiteQuote.${quoteo}.status == SUBMITTED"

      - name: missing_auth_context_rejected
        claim_type: rbac_denial
        grounds:
          - validations[priority=1]
          - errors[ERR_MISSING_AUTH_CONTEXT]
        distinguishing_aspect: "A request with no X-User-Role/X-User-ID headers is rejected with 401 ERR_MISSING_AUTH_CONTEXT before any role check."
        test_recipe:
          setup:
            - "Empty DB; request sent with no auth headers."
          setup_api_calls: []
          trigger:
            - call: "GET /service-jobs"
              payload: {}
              as: Anonymous
              captures: { errau: $.data.error_id }
          assert:
            - "response.status == 401"
            - "response.data.error_id == ERR_MISSING_AUTH_CONTEXT"

  # ===========================================================================
  - section: cross_cutting_complexity_layers
    instances:
      - name: occ_stale_lockpart_version_excluded
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[reservation-create-stale-lockpart]
          - errors[ERR_STALE_LOCKPART_VERSION]
        distinguishing_aspect: "A reservation create carrying a stale expected_lockpart_version is rejected with 412 ERR_STALE_LOCKPART_VERSION."
        test_recipe:
          setup:
            - "LockPart units_total=5 created (version 1). First reservation qty 2 succeeds and bumps version to 2."
            - "A second reservation create still carrying the version-1 value is stale."
          setup_api_calls:
            - call: "POST /lock-parts"
              payload: { sku: "PIN-OCC", units_total: 5 }
              as: InventoryManager
              captures: { lpo: $.data.id, lpov1: $.data.version }
            - call: "POST /technicians"
              payload: { full_name: "Toc", certified_for: ["REKEY"], base_travel_minutes: 20 }
              as: Dispatcher
              captures: { techoc: $.data.id }
            - call: "POST /service-jobs"
              payload: { customer_name: "Coc", customer_user_id: "cust-oc", service_type: "REKEY", service_address: "OC St", requested_at_minute: 600 }
              as: Dispatcher
              captures: { joboc: $.data.id }
            - call: "POST /service-jobs/${joboc}/dispatches"
              payload: { technician_id: "${techoc}", eta_start_minute: 605, eta_end_minute: 650 }
              as: Dispatcher
              captures: { dispoc: $.data.id }
            - call: "POST /dispatches/${dispoc}/depart"
              payload: {}
              as: Technician
              as_user_id: "${techoc}"
            - call: "POST /dispatches/${dispoc}/arrive"
              payload: { arrived_at_minute: 640 }
              as: Technician
              as_user_id: "${techoc}"
            - call: "POST /service-jobs/${joboc}/quotes"
              payload: { labor_hours: 1.0, part_lines: [] }
              as: Technician
              as_user_id: "${techoc}"
              captures: { quoteoc: $.data.id }
            - call: "POST /part-reservations"
              payload: { on_site_quote_id: "${quoteoc}", lock_part_id: "${lpo}", quantity: 2, expected_lockpart_version: "${lpov1}" }
              as: Technician
              as_user_id: "${techoc}"
              captures: { resvoc: $.data.id }
          trigger:
            - call: "POST /part-reservations"
              payload: { on_site_quote_id: "${quoteoc}", lock_part_id: "${lpo}", quantity: 1, expected_lockpart_version: "${lpov1}" }
              as: Technician
              as_user_id: "${techoc}"
              captures: { erroc: $.data.error_id }
          assert:
            - "response.status == 412"
            - "response.data.error_id == ERR_STALE_LOCKPART_VERSION"

      - name: occ_version_increments_on_reservation
        claim_type: optimistic_concurrency
        grounds:
          - entities.LockPart.fields.version
          - endpoints.POST_/part-reservations
        distinguishing_aspect: "A successful reservation increments LockPart.version by exactly 1 (from 1 to 2), giving the next OCC check something to fail against."
        test_recipe:
          setup:
            - "LockPart units_total=5 (version 1); job ON_SITE with a DRAFTED quote."
          setup_api_calls:
            - call: "POST /lock-parts"
              payload: { sku: "PIN-VI", units_total: 5 }
              as: InventoryManager
              captures: { lpvi: $.data.id, lpviv: $.data.version }
            - call: "POST /technicians"
              payload: { full_name: "Tvi", certified_for: ["REKEY"], base_travel_minutes: 20 }
              as: Dispatcher
              captures: { techvi: $.data.id }
            - call: "POST /service-jobs"
              payload: { customer_name: "Cvi", customer_user_id: "cust-vi", service_type: "REKEY", service_address: "VI St", requested_at_minute: 600 }
              as: Dispatcher
              captures: { jobvi: $.data.id }
            - call: "POST /service-jobs/${jobvi}/dispatches"
              payload: { technician_id: "${techvi}", eta_start_minute: 605, eta_end_minute: 650 }
              as: Dispatcher
              captures: { dispvi: $.data.id }
            - call: "POST /dispatches/${dispvi}/depart"
              payload: {}
              as: Technician
              as_user_id: "${techvi}"
            - call: "POST /dispatches/${dispvi}/arrive"
              payload: { arrived_at_minute: 640 }
              as: Technician
              as_user_id: "${techvi}"
            - call: "POST /service-jobs/${jobvi}/quotes"
              payload: { labor_hours: 1.0, part_lines: [] }
              as: Technician
              as_user_id: "${techvi}"
              captures: { quotevi: $.data.id }
            - call: "POST /part-reservations"
              payload: { on_site_quote_id: "${quotevi}", lock_part_id: "${lpvi}", quantity: 1, expected_lockpart_version: "${lpviv}" }
              as: Technician
              as_user_id: "${techvi}"
          trigger:
            - call: "GET /lock-parts/${lpvi}"
              payload: {}
              as: InventoryManager
              captures: { lpviv2: $.data.version }
          assert:
            - "LockPart.${lpvi}.version == 2"
            - "LockPart.${lpvi}.units_available == 4"
            - "LockPart.${lpvi}.units_reserved == 1"

      - name: cascade_job_cancel_releases_inventory_excluded
        claim_type: cascading_side_effects
        grounds:
          - state_machines.PartReservation.RESERVED_to_RELEASED
        excluded_because:
          difficulty_instance: transitive_cascade / job_cancel_cascades_quote_reservation_lockpart_depth3
          rationale: "The job-cancel -> quote-void -> reservation-release -> inventory-restock cascade is asserted end-to-end by the named §1.8 instance."

