# =============================================================================
# Task 0571 — racquet-club — §1.8 Scaffold Difficulty Design (Test Targeting Index)
# 9 Difficulty Rules x 2 instances = 18 instances.
# Every setup_api_calls / trigger call resolves to a §1.5 endpoint; payloads are
# literals except server-minted values referenced via ${captures}. Clock default
# is 2026-05-01T00:00:00Z.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: dv_reservation_provisional_vs_final_charge
        grounds:
          - calculations.reservation_charge
          - state_machines.Reservation.CHECKED_IN_to_COMPLETED
          - entities.Reservation.fields.provisional_fee_cents
          - entities.Reservation.fields.final_fee_cents
          - entities.Member.fields.account_balance_cents
        distinguishing_aspect: |
          On the Reservation domain, the provisional charge (guest_count=1 -> 2500) and the
          final charge (actual_guest_count=2 -> 4000) diverge by exactly one guest fee (1500),
          and only that delta is posted to the member ledger.
        test_recipe:
          setup:
            - "PREMIER plan (guest_fee_cents 1500), one INDOOR court (rate 4000, ball machine fee 1000), one member with an ACTIVE subscription holding 8 credits."
          setup_api_calls:
            - call: "POST /racquet/membership-plans"
              payload: { name: "Premier", tier: "PREMIER", monthly_fee_cents: 5000, monthly_court_credits: 8, peak_access: true, guest_fee_cents: 1500, freeze_limit: 2 }
              as: FrontDesk
              captures: { plan_id: "$.data.id" }
            - call: "POST /racquet/courts"
              payload: { name: "Indoor 1", surface: "HARD", location_type: "INDOOR", hourly_rate_cents: 4000, has_ball_machine: true, ball_machine_fee_cents: 1000 }
              as: FrontDesk
              captures: { court_id: "$.data.id" }
            - call: "POST /racquet/members"
              payload: { full_name: "Ann Base", email: "ann@x.com" }
              as: FrontDesk
              captures: { member_id: "$.data.id" }
            - call: "POST /racquet/subscriptions"
              payload: { member_id: "${member_id}", plan_id: "${plan_id}" }
              as: FrontDesk
              captures: { sub_id: "$.data.id" }
          trigger:
            - call: "POST /racquet/reservations"
              payload: { court_id: "${court_id}", member_id: "${member_id}", start_time: "2026-05-05T10:00:00Z", end_time: "2026-05-05T11:00:00Z", guest_count: 1, uses_ball_machine: true }
              as: FrontDesk
              captures: { res_id: "$.data.id", prov: "$.data.provisional_fee_cents" }
            - call: "POST /racquet/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-05T10:00:00Z" }
              as: FrontDesk
            - call: "POST /racquet/reservations/${res_id}/check-in"
              payload: { actual_guest_count: 2 }
              as: FrontDesk
            - call: "POST /racquet/reservations/${res_id}/complete"
              payload: {}
              as: FrontDesk
              captures: { fin: "$.data.final_fee_cents" }
          assert:
            - "Reservation.${res_id}.provisional_fee_cents == 2500"
            - "Reservation.${res_id}.final_fee_cents == 4000"
            - "Reservation.${res_id}.credits_used == 1"
            - "Member.${member_id}.account_balance_cents == 4000"

      - name: dv_subscription_forward_vs_chronological_period_cost
        grounds:
          - calculations.subscription_period_cost
          - calculations.subscription_proration
          - state_machines.Subscription.ACTIVE_to_FROZEN
          - entities.Subscription.fields.estimated_period_fee_cents
          - entities.Member.fields.account_balance_cents
        distinguishing_aspect: |
          On the Subscription domain, the forward-looking estimate (5000, full month) and the
          chronological actual charged at renewal (3340, prorated for a 10-day freeze) diverge
          by 1660; the estimate is only projected while the chronological figure is billed.
        test_recipe:
          setup:
            - "PREMIER plan (monthly_fee_cents 5000), a member, and an ACTIVE subscription opened at the default clock (period 2026-05-01..2026-05-31)."
          setup_api_calls:
            - call: "POST /racquet/membership-plans"
              payload: { name: "Premier", tier: "PREMIER", monthly_fee_cents: 5000, monthly_court_credits: 8, peak_access: true, guest_fee_cents: 1500, freeze_limit: 2 }
              as: FrontDesk
              captures: { plan_id: "$.data.id" }
            - call: "POST /racquet/members"
              payload: { full_name: "Bo Freeze", email: "bo@x.com" }
              as: FrontDesk
              captures: { member_id: "$.data.id" }
            - call: "POST /racquet/subscriptions"
              payload: { member_id: "${member_id}", plan_id: "${plan_id}" }
              as: FrontDesk
              captures: { sub_id: "$.data.id", est: "$.data.estimated_period_fee_cents" }
          trigger:
            - call: "POST /racquet/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-21T00:00:00Z" }
              as: FrontDesk
            - call: "POST /racquet/subscriptions/${sub_id}/freeze"
              payload: {}
              as: FrontDesk
            - call: "POST /racquet/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-31T00:00:00Z" }
              as: FrontDesk
            - call: "POST /racquet/subscriptions/${sub_id}/renew"
              payload: {}
              as: FrontDesk
          assert:
            - "Subscription.${sub_id}.estimated_period_fee_cents == 5000"
            - "Member.${member_id}.account_balance_cents == 3340"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: combo_reservation_charge_peak_nonlinear
        grounds:
          - calculations.reservation_charge
          - entities.Reservation.fields.is_peak
          - entities.Reservation.fields.provisional_fee_cents
          - entities.Court.fields.ball_machine_fee_cents
        distinguishing_aspect: |
          Mode (a): >=3 inputs (2h duration, peak flag, zero-credit plan, ball machine) combine
          non-linearly — a ceil(0.25) peak surcharge on the pre-surcharge base plus a nested
          credit-vs-cash branch — yielding provisional_fee_cents == 11000.
        test_recipe:
          setup:
            - "BASIC plan (0 credits), one court (rate 4000, ball machine fee 1000), a member with an ACTIVE BASIC subscription so every booking is cash."
          setup_api_calls:
            - call: "POST /racquet/membership-plans"
              payload: { name: "Basic", tier: "BASIC", monthly_fee_cents: 3000, monthly_court_credits: 0, peak_access: true, guest_fee_cents: 2000, freeze_limit: 1 }
              as: FrontDesk
              captures: { plan_id: "$.data.id" }
            - call: "POST /racquet/courts"
              payload: { name: "Indoor 1", surface: "HARD", location_type: "INDOOR", hourly_rate_cents: 4000, has_ball_machine: true, ball_machine_fee_cents: 1000 }
              as: FrontDesk
              captures: { court_id: "$.data.id" }
            - call: "POST /racquet/members"
              payload: { full_name: "Cy Cash", email: "cy@x.com" }
              as: FrontDesk
              captures: { member_id: "$.data.id" }
            - call: "POST /racquet/subscriptions"
              payload: { member_id: "${member_id}", plan_id: "${plan_id}" }
              as: FrontDesk
              captures: { sub_id: "$.data.id" }
          trigger:
            - call: "POST /racquet/reservations"
              payload: { court_id: "${court_id}", member_id: "${member_id}", start_time: "2026-05-05T18:00:00Z", end_time: "2026-05-05T20:00:00Z", guest_count: 0, uses_ball_machine: true }
              as: FrontDesk
              captures: { res_id: "$.data.id" }
          assert:
            - "Reservation.${res_id}.is_peak == true"
            - "Reservation.${res_id}.credits_used == 0"
            - "Reservation.${res_id}.provisional_fee_cents == 11000"

      - name: combo_subscription_proration_perday_rounding
        grounds:
          - calculations.subscription_proration
          - state_machines.Subscription.ACTIVE_to_FROZEN
          - state_machines.Subscription.ACTIVE_to_ACTIVE
          - entities.Member.fields.account_balance_cents
        distinguishing_aspect: |
          Mode (b): the pinned per-active-day round_half_up-then-sum (167 x 15 = 2505) diverges
          from sum-then-round (round(166.6667 x 15) = 2500); a 15-day freeze surfaces the
          5-cent rounding-order gap on the Subscription.
        test_recipe:
          setup:
            - "PREMIER plan (monthly_fee_cents 5000, 30-day period 2026-05-01..2026-05-31), a member, ACTIVE subscription; freeze effective 2026-05-16 leaves 15 active days."
          setup_api_calls:
            - call: "POST /racquet/membership-plans"
              payload: { name: "Premier", tier: "PREMIER", monthly_fee_cents: 5000, monthly_court_credits: 8, peak_access: true, guest_fee_cents: 1500, freeze_limit: 2 }
              as: FrontDesk
              captures: { plan_id: "$.data.id" }
            - call: "POST /racquet/members"
              payload: { full_name: "Di Prorate", email: "di@x.com" }
              as: FrontDesk
              captures: { member_id: "$.data.id" }
            - call: "POST /racquet/subscriptions"
              payload: { member_id: "${member_id}", plan_id: "${plan_id}" }
              as: FrontDesk
              captures: { sub_id: "$.data.id" }
          trigger:
            - call: "POST /racquet/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-16T00:00:00Z" }
              as: FrontDesk
            - call: "POST /racquet/subscriptions/${sub_id}/freeze"
              payload: {}
              as: FrontDesk
            - call: "POST /racquet/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-31T00:00:00Z" }
              as: FrontDesk
            - call: "POST /racquet/subscriptions/${sub_id}/renew"
              payload: {}
              as: FrontDesk
          assert:
            - "Member.${member_id}.account_balance_cents == 2505"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: nlsm_subscription_freeze_unfreeze_cycle
        grounds:
          - state_machines.Subscription.ACTIVE_to_FROZEN
          - state_machines.Subscription.FROZEN_to_ACTIVE
          - entities.Subscription.fields.freeze_count
          - entities.Subscription.fields.status
        distinguishing_aspect: |
          Subscription is cyclic: ACTIVE -> FROZEN -> ACTIVE returns to the origin state while
          freeze_count is retained at 1 (monotonic), a non-linear shape distinct from any A->B->C
          pipeline.
        test_recipe:
          setup:
            - "PREMIER plan, member, ACTIVE subscription with freeze_count 0."
          setup_api_calls:
            - call: "POST /racquet/membership-plans"
              payload: { name: "Premier", tier: "PREMIER", monthly_fee_cents: 5000, monthly_court_credits: 8, peak_access: true, guest_fee_cents: 1500, freeze_limit: 2 }
              as: FrontDesk
              captures: { plan_id: "$.data.id" }
            - call: "POST /racquet/members"
              payload: { full_name: "Ed Cycle", email: "ed@x.com" }
              as: FrontDesk
              captures: { member_id: "$.data.id" }
            - call: "POST /racquet/subscriptions"
              payload: { member_id: "${member_id}", plan_id: "${plan_id}" }
              as: FrontDesk
              captures: { sub_id: "$.data.id" }
          trigger:
            - call: "POST /racquet/subscriptions/${sub_id}/freeze"
              payload: {}
              as: FrontDesk
            - call: "POST /racquet/subscriptions/${sub_id}/unfreeze"
              payload: {}
              as: FrontDesk
          assert:
            - "Subscription.${sub_id}.status == ACTIVE"
            - "Subscription.${sub_id}.freeze_count == 1"
            - "Subscription.${sub_id}.frozen_at == null"

      - name: nlsm_reservation_booked_fork_cancel_vs_noshow
        grounds:
          - state_machines.Reservation.BOOKED_to_CANCELLED
          - state_machines.Reservation.BOOKED_to_NO_SHOW
          - entities.Member.fields.no_show_strikes
          - entities.Subscription.fields.court_credits_remaining
        distinguishing_aspect: |
          Reservation branches from BOOKED into two terminals with divergent side effects —
          CANCELLED restores the credit and adds no strike, while NO_SHOW retains the credit
          deduction and adds a strike — on a different entity than the Subscription cycle.
        test_recipe:
          setup:
            - "PREMIER plan (8 credits), a court, a member with ACTIVE subscription, and two off-peak 1-hour credit reservations R1 (05-05T10:00) and R2 (05-05T12:00)."
          setup_api_calls:
            - call: "POST /racquet/membership-plans"
              payload: { name: "Premier", tier: "PREMIER", monthly_fee_cents: 5000, monthly_court_credits: 8, peak_access: true, guest_fee_cents: 1500, freeze_limit: 2 }
              as: FrontDesk
              captures: { plan_id: "$.data.id" }
            - call: "POST /racquet/courts"
              payload: { name: "Indoor 1", surface: "HARD", location_type: "INDOOR", hourly_rate_cents: 4000, has_ball_machine: false, ball_machine_fee_cents: 0 }
              as: FrontDesk
              captures: { court_id: "$.data.id" }
            - call: "POST /racquet/members"
              payload: { full_name: "Fi Fork", email: "fi@x.com" }
              as: FrontDesk
              captures: { member_id: "$.data.id" }
            - call: "POST /racquet/subscriptions"
              payload: { member_id: "${member_id}", plan_id: "${plan_id}" }
              as: FrontDesk
              captures: { sub_id: "$.data.id" }
            - call: "POST /racquet/reservations"
              payload: { court_id: "${court_id}", member_id: "${member_id}", start_time: "2026-05-05T10:00:00Z", end_time: "2026-05-05T11:00:00Z" }
              as: FrontDesk
              captures: { r1_id: "$.data.id" }
            - call: "POST /racquet/reservations"
              payload: { court_id: "${court_id}", member_id: "${member_id}", start_time: "2026-05-05T12:00:00Z", end_time: "2026-05-05T13:00:00Z" }
              as: FrontDesk
              captures: { r2_id: "$.data.id" }
          trigger:
            - call: "POST /racquet/reservations/${r1_id}/cancel"
              payload: {}
              as: FrontDesk
            - call: "POST /racquet/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-05T12:16:00Z" }
              as: FrontDesk
            - call: "POST /racquet/reservations/${r2_id}/mark-no-show"
              payload: {}
              as: FrontDesk
          assert:
            - "Reservation.${r1_id}.status == CANCELLED"
            - "Reservation.${r2_id}.status == NO_SHOW"
            - "Member.${member_id}.no_show_strikes == 1"
            - "Subscription.${sub_id}.court_credits_remaining == 7"

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: cascade_noshow_strike_suspend_freeze_depth3
        grounds:
          - state_machines.Reservation.BOOKED_to_NO_SHOW
          - state_machines.Member.ACTIVE_to_SUSPENDED
          - state_machines.Subscription.ACTIVE_to_FROZEN
          - entities.Member.fields.no_show_strikes
        distinguishing_aspect: |
          A depth-3 chain triggered by mark-no-show: NO_SHOW increments Member.no_show_strikes to 3
          (hop1), the >=3 crossing transitions Member ACTIVE->SUSPENDED (hop2), which freezes the
          member's Subscription ACTIVE->FROZEN (hop3); each hop is caused by the prior.
        test_recipe:
          setup:
            - "A member with an ACTIVE subscription and no_show_strikes already 2, produced by two prior no-shows; a third booked reservation R_c at 05-02T10:00 is pending."
          setup_api_calls:
            - call: "POST /racquet/membership-plans"
              payload: { name: "Premier", tier: "PREMIER", monthly_fee_cents: 5000, monthly_court_credits: 8, peak_access: true, guest_fee_cents: 1500, freeze_limit: 2 }
              as: FrontDesk
              captures: { plan_id: "$.data.id" }
            - call: "POST /racquet/courts"
              payload: { name: "Indoor 1", surface: "HARD", location_type: "INDOOR", hourly_rate_cents: 4000, has_ball_machine: false, ball_machine_fee_cents: 0 }
              as: FrontDesk
              captures: { court_id: "$.data.id" }
            - call: "POST /racquet/members"
              payload: { full_name: "Gil Strike", email: "gil@x.com" }
              as: FrontDesk
              captures: { member_id: "$.data.id" }
            - call: "POST /racquet/subscriptions"
              payload: { member_id: "${member_id}", plan_id: "${plan_id}" }
              as: FrontDesk
              captures: { sub_id: "$.data.id" }
            - call: "POST /racquet/reservations"
              payload: { court_id: "${court_id}", member_id: "${member_id}", start_time: "2026-05-02T08:00:00Z", end_time: "2026-05-02T09:00:00Z" }
              as: FrontDesk
              captures: { ra_id: "$.data.id" }
            - call: "POST /racquet/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-02T08:16:00Z" }
              as: FrontDesk
            - call: "POST /racquet/reservations/${ra_id}/mark-no-show"
              payload: {}
              as: FrontDesk
            - call: "POST /racquet/reservations"
              payload: { court_id: "${court_id}", member_id: "${member_id}", start_time: "2026-05-02T09:00:00Z", end_time: "2026-05-02T10:00:00Z" }
              as: FrontDesk
              captures: { rb_id: "$.data.id" }
            - call: "POST /racquet/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-02T09:16:00Z" }
              as: FrontDesk
            - call: "POST /racquet/reservations/${rb_id}/mark-no-show"
              payload: {}
              as: FrontDesk
            - call: "POST /racquet/reservations"
              payload: { court_id: "${court_id}", member_id: "${member_id}", start_time: "2026-05-02T10:00:00Z", end_time: "2026-05-02T11:00:00Z" }
              as: FrontDesk
              captures: { rc_id: "$.data.id" }
            - call: "POST /racquet/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-02T10:16:00Z" }
              as: FrontDesk
          trigger:
            - call: "POST /racquet/reservations/${rc_id}/mark-no-show"
              payload: {}
              as: FrontDesk
          assert:
            - "Member.${member_id}.no_show_strikes == 3"
            - "Member.${member_id}.status == SUSPENDED"
            - "Subscription.${sub_id}.status == FROZEN"

      - name: cascade_court_maintenance_cancel_credit_refund_depth2
        grounds:
          - state_machines.Court.AVAILABLE_to_MAINTENANCE
          - state_machines.Reservation.BOOKED_to_CANCELLED
          - calculations.subscription_court_credits
          - entities.Subscription.fields.court_credits_remaining
        distinguishing_aspect: |
          A depth-2 chain from a different trigger (court maintenance): Court AVAILABLE->MAINTENANCE
          cancels the future BOOKED reservation (hop1), whose cancellation restores the consumed
          court credit (hop2), returning court_credits_remaining to 8.
        test_recipe:
          setup:
            - "PREMIER plan (8 credits), a court, a member with ACTIVE subscription, and one future credit reservation R (05-06T10:00) leaving 7 credits."
          setup_api_calls:
            - call: "POST /racquet/membership-plans"
              payload: { name: "Premier", tier: "PREMIER", monthly_fee_cents: 5000, monthly_court_credits: 8, peak_access: true, guest_fee_cents: 1500, freeze_limit: 2 }
              as: FrontDesk
              captures: { plan_id: "$.data.id" }
            - call: "POST /racquet/courts"
              payload: { name: "Indoor 1", surface: "HARD", location_type: "INDOOR", hourly_rate_cents: 4000, has_ball_machine: false, ball_machine_fee_cents: 0 }
              as: FrontDesk
              captures: { court_id: "$.data.id" }
            - call: "POST /racquet/members"
              payload: { full_name: "Hal Maint", email: "hal@x.com" }
              as: FrontDesk
              captures: { member_id: "$.data.id" }
            - call: "POST /racquet/subscriptions"
              payload: { member_id: "${member_id}", plan_id: "${plan_id}" }
              as: FrontDesk
              captures: { sub_id: "$.data.id" }
            - call: "POST /racquet/reservations"
              payload: { court_id: "${court_id}", member_id: "${member_id}", start_time: "2026-05-06T10:00:00Z", end_time: "2026-05-06T11:00:00Z" }
              as: FrontDesk
              captures: { res_id: "$.data.id" }
          trigger:
            - call: "POST /racquet/courts/${court_id}/maintenance"
              payload: {}
              as: FrontDesk
          assert:
            - "Court.${court_id}.status == MAINTENANCE"
            - "Reservation.${res_id}.status == CANCELLED"
            - "Subscription.${sub_id}.court_credits_remaining == 8"

  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: conflict_referential_court_beats_fiscal_balance
        grounds:
          - validations[priority=7]
          - validations[priority=10]
          - errors[ERR_COURT_NOT_AVAILABLE]
          - errors[ERR_BALANCE_LIMIT_EXCEEDED]
        distinguishing_aspect: |
          business_referential (court not AVAILABLE, priority 7) outranks business_fiscal
          (balance 25000 > 20000 limit, priority 10); the booking returns ERR_COURT_NOT_AVAILABLE,
          not ERR_BALANCE_LIMIT_EXCEEDED.
        test_recipe:
          setup:
            - "A member whose account_balance_cents is 25000 (from a 25000 stringing job) and a court moved to MAINTENANCE, so a booking violates both the referential and fiscal rules."
          setup_api_calls:
            - call: "POST /racquet/membership-plans"
              payload: { name: "Premier", tier: "PREMIER", monthly_fee_cents: 5000, monthly_court_credits: 8, peak_access: true, guest_fee_cents: 1500, freeze_limit: 2 }
              as: FrontDesk
              captures: { plan_id: "$.data.id" }
            - call: "POST /racquet/courts"
              payload: { name: "Indoor 1", surface: "HARD", location_type: "INDOOR", hourly_rate_cents: 4000, has_ball_machine: false, ball_machine_fee_cents: 0 }
              as: FrontDesk
              captures: { court_id: "$.data.id" }
            - call: "POST /racquet/members"
              payload: { full_name: "Ivy Debt", email: "ivy@x.com" }
              as: FrontDesk
              captures: { member_id: "$.data.id" }
            - call: "POST /racquet/subscriptions"
              payload: { member_id: "${member_id}", plan_id: "${plan_id}" }
              as: FrontDesk
              captures: { sub_id: "$.data.id" }
            - call: "POST /racquet/stringing-jobs"
              payload: { member_id: "${member_id}", racquet_label: "Pro Staff", string_type: "Poly", tension: 55, price_cents: 25000 }
              as: FrontDesk
              captures: { job_id: "$.data.id" }
            - call: "POST /racquet/courts/${court_id}/maintenance"
              payload: {}
              as: FrontDesk
          trigger:
            - call: "POST /racquet/reservations"
              payload: { court_id: "${court_id}", member_id: "${member_id}", start_time: "2026-05-07T10:00:00Z", end_time: "2026-05-07T11:00:00Z" }
              as: FrontDesk
              captures: { err: "$.data.error_id" }
          assert:
            - "response.data.error_id == ERR_COURT_NOT_AVAILABLE"
            - "Member.${member_id}.account_balance_cents == 25000"

      - name: conflict_temporal_overlap_beats_duplicate_constraint
        grounds:
          - validations[priority=8]
          - validations[priority=9]
          - errors[ERR_COURT_TIME_CONFLICT]
          - errors[ERR_DUPLICATE_RESERVATION]
        distinguishing_aspect: |
          business_temporal (court overlap, priority 8) outranks business_constraint (duplicate
          same member+court+start_time, priority 9); re-booking the identical slot returns
          ERR_COURT_TIME_CONFLICT, a different category pair than the referential/fiscal conflict.
        test_recipe:
          setup:
            - "PREMIER member with ACTIVE subscription who already holds a BOOKED reservation R1 on a court for 05-07T10:00..11:00."
          setup_api_calls:
            - call: "POST /racquet/membership-plans"
