            - "the 0.4000 liquidation returns 200 with reserve_status == \"PARTIALLY_LIQUIDATED\" and status STILL \"SHIPPED\": reserve_liquidated_cents == 54000 == round_half_up(135000 * 0.4000), reserve_held_cents == 81000, and reserve_initial_cents == 135000 is unchanged"
            - "void-liquidation returns 200 with reserve_status back to \"HELD\", reserve_held_cents == 135000, reserve_liquidated_cents == 0 and status STILL \"SHIPPED\" — the compensating edge on the reserve axis does not disturb the fulfilment axis"
            - "the 1.0000 liquidation returns 200 with reserve_status == \"LIQUIDATED\" AND status == \"RECONCILED\": this is the one declared coupling between the axes, and reserve_held_cents == 0 with reserve_liquidated_cents == 135000"
            - "the final void-liquidation returns 200 with reserve_status back to \"HELD\" AND status back to \"SHIPPED\": the coupling is symmetric, so RECONCILED is not a trap state while a void is still possible"
            - "every one of the five calls incremented version by exactly 1, and run_v_returns, run_v_partial, run_v_void and run_v_full are strictly increasing"

