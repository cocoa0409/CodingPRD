      - call: POST /aquarium/exhibits
        payload: {exhibit_code: EX-COLD-2, name: Kelp Forest, habitat_type: COLD_MARINE, life_support_system_id: '${lss_id}', display_volume_liters: 120000, bioload_capacity_units: 100}
        as: CuratorOfCollections
        captures: {ex_b: $.data.id, exb_v1: $.data.version}
      - call: POST /aquarium/exhibits
        payload: {exhibit_code: EX-COLD-3, name: Rocky Shore, habitat_type: COLD_MARINE, life_support_system_id: '${lss2_id}', display_volume_liters: 120000, bioload_capacity_units: 100}
        as: CuratorOfCollections
        captures: {ex_c: $.data.id, exc_v1: $.data.version}
      trigger:
      - call: POST /aquarium/life-support-systems/${lss_id}/water-quality-readings
        payload: {taken_at: '2026-08-01T00:00:00Z', temperature_c: 13.6, salinity_ppt: 33.0, ph: 8.1, dissolved_oxygen_mg_l: 7.4, ammonia_mg_l: 0.01, nitrite_mg_l: 0.02}
        as: AquaristTechnician
      - call: GET /aquarium/exhibits
        payload: {posture: RESTRICTED, limit: 10}
        as: CuratorOfCollections
      - call: GET /aquarium/exhibits
        payload: {posture: OPEN, limit: 10}
        as: CuratorOfCollections
      - call: GET /aquarium/life-support-systems/${lss_id}/exhibits
        payload: {posture: RESTRICTED, limit: 10}
        as: CuratorOfCollections
      assert:
      - the RESTRICTED list returns total_count == 2 containing ${ex_a} and ${ex_b}
      - the OPEN list returns total_count == 1 containing ${ex_c} — the second plant is still NORMAL
      - the plant sub-resource link returns the same two RESTRICTED exhibits
      - each listed element carries posture, last_posture_reason == LSS_WARNING, occupied_bioload_units == 0.00 and bioload_utilization_pct == 0.00
      - each mutated exhibit's version == 2 while ${ex_c}.version == 1
  - name: endpoint_quarantine_review_reads_extension_days_only_for_the_extend_outcome
    claim_type: Conditional action
    grounds:
    - §1.5 POST /aquarium/quarantine-cases/{id}/reviews (outcome, extension_days?, reason?)
    - §1.2 QuarantineCase ACTIVE -> EXTENDED (extension_days between 1 and 30)
    - §1.2 QuarantineCase EXTENDED -> ACTIVE (RESUME)
    - §1.6 ERR_VALIDATION (422, out-of-range number)
    - §1.1 QuarantineCase.extension_count / total_extension_days / projected_release_at
    distinguishing_aspect: 'extension_days is optional in the §1.5 input list but load-bearing for exactly one outcome: 31 is out of range and rejected, 7 moves projected_release_at from 2026-08-31 to 2026-09-07, and the subsequent RESUME ignores the field entirely without shifting the date back.'
    test_recipe:
      setup:
