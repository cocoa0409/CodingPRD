              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { rsvc_id: $.data.id }
            - call: "POST /health-centers/${rhc_id}/board-members"
              payload: { seat_number: 1, seat_type: "NON_PATIENT", expertise_category: "LEGAL", term_start: "2026-01-01T00:00:00Z", term_end: "2028-12-31T00:00:00Z" }
              as: ComplianceOfficer
              as_user_id: "co-ridge"
              captures: { rchair_id: $.data.id }
            - call: "POST /health-centers/${rhc_id}/fee-schedules"
              payload: { fpg_year: 2026, effective_start: "2026-01-01T00:00:00Z", effective_end: "2027-01-01T00:00:00Z", nominal_fee_cents: 2500 }
              as: ComplianceOfficer
              as_user_id: "co-ridge"
              captures: { rfs_id: $.data.id }
            - call: "POST /fee-schedules/${rfs_id}/discount-tiers"
              payload: { tier_label: "NOMINAL_FULL", fpg_min_pct: 0, fpg_max_pct: 100, discount_kind: "NOMINAL", sort_order: 1 }
              as: ComplianceOfficer
              as_user_id: "co-ridge"
              captures: { rt1_id: $.data.id }
            - call: "POST /fee-schedules/${rfs_id}/discount-tiers"
              payload: { tier_label: "FULL_CHARGE", fpg_min_pct: 100, discount_kind: "NONE", sort_order: 2 }
              as: ComplianceOfficer
              as_user_id: "co-ridge"
              captures: { rt2_id: $.data.id }
            - call: "GET /health-centers/${rhc_id}"
              payload: {}
              as: BoardChair
              as_user_id: "${rchair_id}"
