              payload: { building_allocation_id: "${alloc_id}", subject_type: "STUDENT", student_id: "${s1_id}", expected_vendor_app_version: "${va_stale}" }
              as: IdentityAdmin
              as_user_id: "ia-001"
          assert:
            - "the malformed + stale request returns HTTP 400 with data.error_id == ERR_INVALID_REQUEST"
            - "the well-formed + stale request returns HTTP 412 with data.error_id == ERR_STALE_VENDOR_APP_VERSION"
            - "no AppAccount exists: GET /rostering/app-accounts?building_allocation_id=${alloc_id} returns total_count 0 and BuildingAllocation ${alloc_id}.consumed_seats == 0"

      - name: term_date_order_rejected
        claim_type: Violation → Error
        grounds:
          - validations[priority=27]
          - errors[ERR_TERM_DATE_ORDER]
        distinguishing_aspect: "Priority 27 is an intra-row ordering rule (start_date <= add_drop_cutoff_date <= end_date) that fires on shapes which are individually legal dates: a cutoff after end_date and a cutoff before start_date both yield ERR_TERM_DATE_ORDER (422), while the equality case start_date == add_drop_cutoff_date is accepted."
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; no Term rows yet (Term is district-wide, not per building)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { now: "2026-08-01T00:00:00Z" }
              as: RosterOperator
              as_user_id: "ro-001"
          trigger:
            - call: "POST /rostering/terms"
              payload: { name: "Bad Cutoff Late", school_year: 2026, start_date: "2026-08-10", end_date: "2026-12-18", add_drop_cutoff_date: "2026-12-25", instructional_days: 85 }
              as: RosterOperator
              as_user_id: "ro-001"
              captures: { err: "$.data.error_id" }
            - call: "POST /rostering/terms"
              payload: { name: "Bad Cutoff Early", school_year: 2026, start_date: "2026-08-10", end_date: "2026-12-18", add_drop_cutoff_date: "2026-08-01", instructional_days: 85 }
              as: RosterOperator
              as_user_id: "ro-001"
            - call: "POST /rostering/terms"
              payload: { name: "Cutoff On Start", school_year: 2026, start_date: "2026-08-10", end_date: "2026-12-18", add_drop_cutoff_date: "2026-08-10", instructional_days: 85 }
              as: RosterOperator
              as_user_id: "ro-001"
              captures: { term_ok_id: $.data.id }
          assert:
            - "the cutoff-after-end_date request returns HTTP 422 with data.error_id == ERR_TERM_DATE_ORDER"
            - "the cutoff-before-start_date request returns HTTP 422 with data.error_id == ERR_TERM_DATE_ORDER"
            - "the cutoff-equals-start_date request returns HTTP 201 with state == PLANNED — the chain is inclusive at both ends"
            - "GET /rostering/terms returns total_count 1 — neither rejected request persisted a row"

      - name: building_allocation_patch_stays_inside_license_and_above_consumed
        claim_type: Violation → Error
        grounds:
          - validations[priority=42]
          - validations[priority=43]
          - errors[ERR_ALLOCATION_EXCEEDS_LICENSE]
          - errors[ERR_ALLOCATION_BELOW_CONSUMED]
        distinguishing_aspect: "The two PATCH bounds squeeze from opposite directions on one row: with total_seats 4 split 2/2 and one seat consumed in Northside, raising Northside to 3 breaks the district sum (ERR_ALLOCATION_EXCEEDS_LICENSE 409) and lowering it to 0 strands the live account (ERR_ALLOCATION_BELOW_CONSUMED 409), while the single legal value 1 succeeds and returns the freed seat to the district pool."
        test_recipe:
          setup:
            - "Clock at 2026-08-20T00:00:00Z; ACTIVE Northside and Southmeadow ELEMENTARY buildings with one ENROLLED student each; ACTIVE Term Fall 2026."
            - "One ACTIVE PER_STUDENT licence total_seats 4 price 1000 PROPORTIONAL_HEADCOUNT overage BLOCK: both allocations hold 2 seats."
            - "One AppAccount provisioned for the Northside student, so that allocation reports consumed_seats 1."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { now: "2026-08-01T00:00:00Z" }
              as: RosterOperator
              as_user_id: "ro-001"
            - call: "POST /rostering/schools"
              payload: { name: "Northside Elementary", sis_school_id: "SCH-NE", building_code: "NE", grade_band: "ELEMENTARY" }
              as: RosterOperator
              as_user_id: "ro-001"
              captures: { sch_ne_id: $.data.id }
            - call: "POST /rostering/schools"
              payload: { name: "Southmeadow Elementary", sis_school_id: "SCH-SM", building_code: "SM", grade_band: "ELEMENTARY" }
              as: RosterOperator
              as_user_id: "ro-001"
              captures: { sch_sm_id: $.data.id }
            - call: "POST /rostering/terms"
              payload: { name: "Fall 2026", school_year: 2026, start_date: "2026-08-10", end_date: "2026-12-18", add_drop_cutoff_date: "2026-09-15", instructional_days: 85, archive_retention_days: 90 }
              as: RosterOperator
              as_user_id: "ro-001"
              captures: { term_id: $.data.id }
            - call: "POST /rostering/terms/${term_id}/activate"
              payload: {}
              as: RosterOperator
              as_user_id: "ro-001"
            - call: "POST /rostering/students"
              payload: { school_id: "${sch_ne_id}", sis_student_id: "STU-2001", first_name: "Alex", last_name: "Nakamura", grade_level: 4, date_of_birth: "2016-05-04" }
              as: RosterOperator
              as_user_id: "ro-001"
              captures: { s1_id: $.data.id }
            - call: "POST /rostering/students"
              payload: { school_id: "${sch_sm_id}", sis_student_id: "STU-2003", first_name: "Lena", last_name: "Sorensen", grade_level: 5, date_of_birth: "2015-09-30" }
              as: RosterOperator
              as_user_id: "ro-001"
              captures: { s3_id: $.data.id }
            - call: "POST /rostering/vendor-apps"
              payload: { name: "MathBlast", vendor_code: "MBX", term_id: "${term_id}", rostering_standard: "ONEROSTER_REST_1P2", identifier_strategy: "SIS_ID", username_domain: "apps.district.k12", grade_band_scope: ["ELEMENTARY"], seat_model: "PER_STUDENT", allocation_policy: "PROPORTIONAL_HEADCOUNT", overage_policy: "BLOCK", total_seats: 4, price_per_seat_cents: 1000 }
              as: VendorIntegrationManager
              as_user_id: "vim-001"
              captures: { va_id: $.data.id }
            - call: "POST /rostering/vendor-apps/${va_id}/activate-license"
              payload: {}
              as: DataGovernanceOfficer
              as_user_id: "dgo-001"
            - call: "GET /rostering/building-allocations"
              payload: { vendor_app_id: "${va_id}", school_id: "${sch_ne_id}" }
              as: IdentityAdmin
              as_user_id: "ia-001"
              captures: { alloc_ne_id: "$.data[0].id" }
            - call: "POST /_clock/set_current_utc"
              payload: { now: "2026-08-20T00:00:00Z" }
              as: RosterOperator
              as_user_id: "ro-001"
            - call: "GET /rostering/vendor-apps/${va_id}"
              payload: {}
              as: IdentityAdmin
              as_user_id: "ia-001"
              captures: { va_v2: $.data.version }
            - call: "POST /rostering/app-accounts"
              payload: { building_allocation_id: "${alloc_ne_id}", subject_type: "STUDENT", student_id: "${s1_id}", expected_vendor_app_version: "${va_v2}" }
              as: IdentityAdmin
              as_user_id: "ia-001"
              captures: { a1_id: $.data.id }
            - call: "GET /rostering/vendor-apps/${va_id}"
              payload: {}
              as: DataGovernanceOfficer
              as_user_id: "dgo-001"
              captures: { va_v3: $.data.version }
          trigger:
            - call: "PATCH /rostering/building-allocations/${alloc_ne_id}"
              payload: { allocated_seats: 3, expected_vendor_app_version: "${va_v3}" }
              as: DataGovernanceOfficer
              as_user_id: "dgo-001"
              captures: { err: "$.data.error_id" }
            - call: "PATCH /rostering/building-allocations/${alloc_ne_id}"
              payload: { allocated_seats: 0, expected_vendor_app_version: "${va_v3}" }
              as: DataGovernanceOfficer
              as_user_id: "dgo-001"
            - call: "PATCH /rostering/building-allocations/${alloc_ne_id}"
              payload: { allocated_seats: 1, expected_vendor_app_version: "${va_v3}" }
              as: DataGovernanceOfficer
              as_user_id: "dgo-001"
          assert:
            - "raising to 3 returns HTTP 409 with data.error_id == ERR_ALLOCATION_EXCEEDS_LICENSE (3 + 2 > total_seats 4)"
            - "lowering to 0 returns HTTP 409 with data.error_id == ERR_ALLOCATION_BELOW_CONSUMED (consumed_seats is 1)"
            - "setting 1 returns HTTP 200 with allocated_seats == 1, consumed_seats == 1 and free_seats == 0"
            - "VendorApp ${va_id}.allocated_seats_total == 3 and unallocated_seats == 1 after the successful PATCH"
            - "the two rejected PATCHes left version at ${va_v3}; only the successful one advanced it"

      - name: priority_state_beats_fiscal_on_provisioning
        claim_type: Priority Ordering
        grounds:
          - validations[priority=14]
          - validations[priority=44]
        distinguishing_aspect: "A provisioning request that is simultaneously blocked by a non-ACTIVE licence (tier D) and by an exhausted building allocation (tier I) must answer with the state error, never the seat error."
        excluded_because:
          difficulty_instance: state_beats_fiscal_on_app_account_create
          rationale: "§1.8 already builds the exact double-violation fixture (SUSPENDED licence with zero free seats) and asserts ERR_VENDOR_APP_NOT_ACTIVE over ERR_BUILDING_ALLOCATION_EXHAUSTED, including the mirror case where only the fiscal rule is violated."

      - name: priority_temporal_beats_constraint_on_add
        claim_type: Priority Ordering
        grounds:
          - validations[priority=29]
          - validations[priority=39]
        distinguishing_aspect: "An enrollment whose effective date is outside the term AND whose section is already full must surface the temporal error, not the capacity error."
        excluded_because:
          difficulty_instance: temporal_beats_constraint_on_enrollment_create
          rationale: "§1.8 pins this pair with a max_seats-full section plus an out-of-term date and asserts ERR_EFFECTIVE_DATE_OUT_OF_TERM ahead of ERR_SECTION_AT_CAPACITY, plus the isolated-violation controls."

      - name: student_schedule_conflict_half_open_boundary
        claim_type: Violation → Error
        grounds:
          - validations[priority=31]
          - errors[ERR_STUDENT_SCHEDULE_CONFLICT]
        distinguishing_aspect: "Two enrollments in the same period on a shared meeting day collide only when their half-open date intervals overlap; a drop date equal to the next add date must NOT collide."
        excluded_because:
          difficulty_instance: student_period_overlap_half_open_dates
          rationale: "§1.8 tests the touching-endpoints boundary in both directions (equal dates pass, one-day overlap fails) on the same student and period, which is the whole content of this claim."

      - name: teacher_period_conflict_buffer_boundary
        claim_type: Violation → Error
        grounds:
          - validations[priority=32]
          - errors[ERR_TEACHER_PERIOD_CONFLICT]
        distinguishing_aspect: "The teacher rule differs from the student rule twice over: a CLOSED date interval and a +/-1 period buffer, so adjacent periods and touching dates both collide."
        excluded_because:
          difficulty_instance: teacher_buffered_period_overlap_closed_interval
          rationale: "§1.8 already contrasts period_index +/-1 (rejected) against +/-2 (accepted) and the closed-interval touching date against the student rule's half-open behaviour."

  # ===========================================================================
  # SECTION 5 — endpoints  (§1.5, 41 endpoints)
  # ===========================================================================
  - section: endpoints
    instances:
      - name: standard_crud_school_create_read_update_list
        claim_type: Standard CRUD
        grounds:
          - "endpoints[POST /rostering/schools]"
          - "endpoints[GET /rostering/schools/{school_id}]"
          - "endpoints[PATCH /rostering/schools/{school_id}]"
          - "endpoints[GET /rostering/schools]"
        distinguishing_aspect: "The full CRUD quartet on the one entity that has no parent: creation stamps ACTIVE with a zero headcount, PATCH amends only the supplied policy keys and bumps version, and closing the building moves it between the two status-filtered list views without deleting it (there is no DELETE)."
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; no School rows."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { now: "2026-08-01T00:00:00Z" }
              as: RosterOperator
              as_user_id: "ro-001"
          trigger:
            - call: "POST /rostering/schools"
              payload: { name: "Northside Elementary", sis_school_id: "SCH-NE", building_code: "NE", grade_band: "ELEMENTARY", min_password_length: 10, temp_password_ttl_hours: 48 }
              as: RosterOperator
              as_user_id: "ro-001"
              captures: { sch_id: $.data.id }
            - call: "GET /rostering/schools/${sch_id}"
              payload: {}
              as: BuildingLicenseAdmin
              as_user_id: "${sch_id}"
            - call: "PATCH /rostering/schools/${sch_id}"
              payload: { min_password_length: 12, password_lockout_threshold: 3 }
              as: DataGovernanceOfficer
              as_user_id: "dgo-001"
            - call: "PATCH /rostering/schools/${sch_id}"
              payload: { status: "CLOSED" }
              as: RosterOperator
              as_user_id: "ro-001"
            - call: "GET /rostering/schools"
              payload: { status: "ACTIVE" }
              as: RosterOperator
              as_user_id: "ro-001"
            - call: "GET /rostering/schools"
              payload: { status: "CLOSED", limit: 10, offset: 0 }
              as: RosterOperator
              as_user_id: "ro-001"
          assert:
            - "creation returns HTTP 201 with status == ACTIVE, enrolled_student_count == 0, min_password_length == 10, temp_password_ttl_hours == 48 and the un-supplied policy keys at their district defaults (password_requires_mixed_case true, password_max_age_days 180, password_lockout_threshold 5)"
            - "the read returns HTTP 200 with exactly the stored row, version == 1"
            - "the policy PATCH returns HTTP 200 with min_password_length == 12, password_lockout_threshold == 3, temp_password_ttl_hours still 48 (unsupplied keys untouched) and version == 2"
            - "the status PATCH returns HTTP 200 with status == CLOSED and version == 3"
            - "GET /rostering/schools?status=ACTIVE returns total_count 0; GET /rostering/schools?status=CLOSED returns total_count 1 with has_more false — closure is a status change, not a delete"

      - name: action_endpoint_record_usage_accumulates_and_keeps_latest_activity_date
