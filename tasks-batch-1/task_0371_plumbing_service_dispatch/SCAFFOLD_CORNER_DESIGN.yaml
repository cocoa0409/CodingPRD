  # =========================================================================
  # Section 8 — Cross-Cutting Complexity Layers
  # =========================================================================
  - section: cross_cutting_complexity_layers
    instances:

      - name: occ_stale_job_version_on_estimate_create
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[estimate-create-stale-job]", "errors[ERR_STALE_JOB_VERSION]"]
        distinguishing_aspect: "After creating one estimate (job.version advances), a second estimate-create carrying the now-stale expected_job_version returns ERR_STALE_JOB_VERSION (412)."
        test_recipe:
          setup: ["A job is ON_SITE; the client observed job.version before creating the first estimate."]
          setup_api_calls:
            - call: "POST /plumbing/customers"
              payload: { name: "Cust OCC", service_address: "25 A St", credit_limit_cents: 100000 }
              as: OfficeManager
              captures: { cust_id: $.data.id }
            - call: "POST /plumbing/technicians"
              payload: { name: "Tech OCC", skill_level: 3 }
              as: OfficeManager
              captures: { tech_id: $.data.id }
            - call: "POST /plumbing/service-jobs"
              payload: { customer_id: "${cust_id}", category: "LEAK" }
              as: Dispatcher
              captures: { job_id: $.data.id, job_v0: $.data.version }
            - call: "POST /plumbing/dispatch-assignments"
              payload: { job_id: "${job_id}", technician_id: "${tech_id}", window_start: "2026-06-15T10:00:00.000Z", window_end: "2026-06-15T12:00:00.000Z", eta: "2026-06-15T10:15:00.000Z", expected_job_version: "${job_v0}" }
              as: Dispatcher
              captures: { asg_id: $.data.id }
            - call: "POST /plumbing/dispatch-assignments/${asg_id}/confirm"
              payload: {}
              as: Dispatcher
            - call: "POST /plumbing/dispatch-assignments/${asg_id}/depart"
              payload: {}
              as: Technician
              as_user_id: "${tech_id}"
            - call: "POST /plumbing/dispatch-assignments/${asg_id}/arrive"
              payload: {}
              as: Technician
              as_user_id: "${tech_id}"
            - call: "GET /plumbing/service-jobs/${job_id}"
              payload: {}
              as: Technician
              as_user_id: "${tech_id}"
              captures: { job_v_onsite: $.data.version }
            - call: "POST /plumbing/service-jobs/${job_id}/estimates"
              payload: { expected_job_version: "${job_v_onsite}" }
              as: Technician
              as_user_id: "${tech_id}"
              captures: { est1_id: $.data.id }
          trigger:
            - call: "POST /plumbing/service-jobs/${job_id}/estimates"
              payload: { expected_job_version: "${job_v_onsite}" }
              as: Technician
              as_user_id: "${tech_id}"
              captures: { err: $.data.error_id }
          assert:
            - "second estimate-create response status code == 412"
            - "second estimate-create response data.error_id == ERR_STALE_JOB_VERSION"

      - name: occ_correct_job_version_succeeds_and_increments
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[dispatch-create-stale-job]", entities.ServiceJob.fields.version]
        distinguishing_aspect: "Creating a dispatch assignment with the current expected_job_version succeeds (201) and increments ServiceJob.version by 1 (from 1 to 2)."
        test_recipe:
          setup: ["A freshly created RECEIVED job (version 1) and a technician."]
          setup_api_calls:
            - call: "POST /plumbing/customers"
              payload: { name: "Cust OK", service_address: "26 A St", credit_limit_cents: 100000 }
              as: OfficeManager
              captures: { cust_id: $.data.id }
            - call: "POST /plumbing/technicians"
              payload: { name: "Tech OK", skill_level: 3 }
              as: OfficeManager
              captures: { tech_id: $.data.id }
            - call: "POST /plumbing/service-jobs"
              payload: { customer_id: "${cust_id}", category: "LEAK" }
              as: Dispatcher
              captures: { job_id: $.data.id, job_v0: $.data.version }
          trigger:
            - call: "POST /plumbing/dispatch-assignments"
              payload: { job_id: "${job_id}", technician_id: "${tech_id}", window_start: "2026-06-15T10:00:00.000Z", window_end: "2026-06-15T12:00:00.000Z", eta: "2026-06-15T10:15:00.000Z", expected_job_version: "${job_v0}" }
              as: Dispatcher
              captures: { asg_id: $.data.id }
            - call: "GET /plumbing/service-jobs/${job_id}"
              payload: {}
              as: Dispatcher
              captures: { v_after: $.data.version }
          assert:
            - "dispatch create response status code == 201"
            - "ServiceJob.${job_id}.version == 2"

      - name: derived_field_needs_restock_recomputed_on_restock
        claim_type: derived_field_reconciliation
        grounds: [entities.TruckStock.fields.needs_restock, entities.TruckStock.fields.quantity]
        distinguishing_aspect: "Creating a TruckStock row with quantity 2 and reorder_point 2 sets needs_restock=true (quantity<=reorder_point); the derived flag is computed on write."
        test_recipe:
          setup: ["A technician and a part exist."]
          setup_api_calls:
            - call: "POST /plumbing/parts"
              payload: { sku: "DR-1", name: "Washer", list_price_cents: 50 }
              as: OfficeManager
              captures: { part_id: $.data.id }
            - call: "POST /plumbing/technicians"
              payload: { name: "Tech DR", skill_level: 2 }
              as: OfficeManager
              captures: { tech_id: $.data.id }
          trigger:
            - call: "POST /plumbing/truck-stock"
              payload: { technician_id: "${tech_id}", part_id: "${part_id}", quantity: 2, reorder_point: 2 }
              as: OfficeManager
              captures: { nr: $.data.needs_restock }
            - call: "GET /plumbing/technicians/${tech_id}"
              payload: {}
              as: OfficeManager
              captures: { trs: $.data.needs_restock_skus }
          assert:
            - "TruckStock.needs_restock == true"
            - "Technician.${tech_id}.needs_restock_skus == 1"

      - name: cascade_consume_already_covered
        claim_type: cascading_side_effects
        grounds: [state_machines.ServiceJob.IN_PROGRESS_to_COMPLETED]
        excluded_because:
          difficulty_instance: transitive_cascade / complete_cascades_estimate_then_truckstock_then_technician_depth3
          rationale: "The end-to-end completion cascade (estimate->stock->technician) is asserted by the named §1.8 instance."

