  # =========================================================================
  # Rule 6 — boundary_precision_check
  #   instance 1: numeric threshold on the local-minute axis (POST /orders/{id}/submit)
  #   instance 2: empty-collection / zero-count edge (POST /delivery-attempts/{id}/handover)
  # =========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: restricted_hours_window_end_minute_is_exclusive_to_the_minute
        grounds:
          - calculations.delivery_permissibility_evaluation
          - entities.RestrictionPolicy.fields.delivery_window_end_minute
          - validations[priority=60]
          - errors.ERR_OUTSIDE_RESTRICTED_HOURS
        distinguishing_aspect: |
          Metric 1 — a numeric threshold crossing on the local-minute axis, with `<` versus
          `<=` as the whole question. With utc_offset_minutes -240 and the half-open window
          [600, 1320), a scheduled instant of 2026-08-21T02:00:00Z is local minute 1320 and
          MUST be rejected, while 2026-08-21T01:59:00Z is local minute 1319 and MUST be
          accepted. One minute of arithmetic separates a 422 from a 200. Reached through
          POST /orders/{id}/submit.
        test_recipe:
          setup:
            - "logical clock at 2026-08-20T12:00:00Z"
            - "jurisdiction US-NY with utc_offset_minutes -240 and an ALCOHOL policy whose window is [600, 1320)"
            - "customer attested and MATCH-pre-verified"
            - "order_edge (3xWINE-A) scheduled 2026-08-21T02:00:00Z, whose local minute is exactly 1320"
            - "order_inside (3xWINE-A) scheduled 2026-08-21T01:59:00Z, whose local minute is 1319"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-20T12:00:00Z" }
              as: PlatformAdmin
            - call: "POST /jurisdictions"
              payload: { code: "US-NY", name: "New York", dry_status: "WET", utc_offset_minutes: -240 }
              as: PlatformAdmin
              captures: { j_ny: $.data.id }
            - call: "POST /restriction-policies"
              payload: { jurisdiction_id: "${j_ny}", restriction_type: "ALCOHOL", permissibility: "PERMITTED", min_age_years: 21, delivery_window_start_minute: 600, delivery_window_end_minute: 1320, unit_scale_factor: 1.15, max_units_per_order: 6.97, rolling_window_days: 30, max_units_per_window: 40.00, acceptable_document_types: ["DRIVERS_LICENSE", "PASSPORT", "STATE_ID"], requires_scan: true, effective_from: "2026-08-01", effective_to: "2026-08-31" }
              as: PlatformAdmin
              captures: { pol_ny: $.data.id }
            - call: "POST /products"
              payload: { sku: "WINE-A", name: "Cabernet 750ml", restriction_type: "ALCOHOL", restricted_units_per_item: 1.50, list_price_cents: 6800 }
              as: PlatformAdmin
              captures: { prod_a: $.data.id }
            - call: "POST /customers"
              payload: { full_name: "Ada Lin", email: "ada@example.com", jurisdiction_id: "${j_ny}" }
              as: PlatformAdmin
              captures: { cust: $.data.id }
            - call: "POST /customers/${cust}/age-attestation"
              payload: { attested_dob: "2000-03-15", attestation_channel: "WEB_CHECKBOX" }
              as: Customer
              as_user_id: "${cust}"
              captures: { cust_v: $.data.version }
            - call: "POST /customers/${cust}/identity-checks"
              payload: { expected_customer_version: "${cust_v}", provider: "STATE_DMV_GATEWAY", provided_dob: "2000-03-15", source_dob: "2000-03-15", source_signals: [{ source_type: "GOVERNMENT_ID_DB", matched: true }, { source_type: "CREDIT_BUREAU", matched: true }, { source_type: "WATCHLIST_NEGATIVE", matched: true }], validity_days: 90 }
              as: PlatformAdmin
              captures: { idc: $.data.id }
            - call: "POST /delivery-partners"
              payload: { legal_name: "Empire Last Mile", contract_tier: "STANDARD", license_reference: "NY-DEL-0001" }
              as: PlatformAdmin
              captures: { partner: $.data.id }
            - call: "POST /orders"
              payload: { customer_id: "${cust}", delivery_jurisdiction_id: "${j_ny}", delivery_partner_id: "${partner}", scheduled_delivery_at: "2026-08-21T02:00:00Z", delivery_fee_cents: 600 }
              as: Customer
              as_user_id: "${cust}"
              captures: { order_edge: $.data.id }
            - call: "POST /orders/${order_edge}/lines"
              payload: { product_id: "${prod_a}", quantity: 3 }
              as: Customer
              as_user_id: "${cust}"
            - call: "POST /orders"
              payload: { customer_id: "${cust}", delivery_jurisdiction_id: "${j_ny}", delivery_partner_id: "${partner}", scheduled_delivery_at: "2026-08-21T01:59:00Z", delivery_fee_cents: 600 }
              as: Customer
              as_user_id: "${cust}"
              captures: { order_inside: $.data.id }
            - call: "POST /orders/${order_inside}/lines"
              payload: { product_id: "${prod_a}", quantity: 3 }
              as: Customer
              as_user_id: "${cust}"
          trigger:
            - call: "POST /orders/${order_edge}/submit"
              payload: {}
              as: Customer
              as_user_id: "${cust}"
              captures: { err_edge: $.data.error_id }
            - call: "POST /orders/${order_inside}/submit"
              payload: {}
              as: Customer
              as_user_id: "${cust}"
          assert:
            - "the first trigger call returns 422 and ${err_edge} == ERR_OUTSIDE_RESTRICTED_HOURS, because local minute 1320 is not < 1320"
            - "Order.${order_edge}.fulfillment_state == CREATED and Order.${order_edge}.compliance_state == DRAFT_UNVERIFIED"
            - "the second trigger call returns 200"
            - "Order.${order_inside}.compliance_state == PREVERIFIED"
            - "Order.${order_inside}.fulfillment_state == SUBMITTED"
            - "Order.${order_inside}.provisional_restricted_units == 5.18"

      - name: empty_restriction_set_order_hands_over_with_zero_units_and_no_credit
        grounds:
          - state_machines.Order.compliance_state.DRAFT_UNVERIFIED_to_AUTO_CLEARED
          - state_machines.DeliveryAttempt.INITIATED_to_HANDED_OVER
          - entities.Order.fields.restriction_types
          - entities.Courier.fields.compliant_handover_count
          - calculations.order_restricted_unit_exposure
        distinguishing_aspect: |
          Metric 2 — an EMPTY-COLLECTION / zero-count edge rather than a numeric threshold,
          and reached through a different endpoint (POST /delivery-attempts/{id}/handover
          instead of submit). Every line on the order has restriction_type NONE, so
          restriction_types == [], applied_policy_ids == [] and the whole compliance
          apparatus is bypassed: the order auto-clears, the door needs no ID check, and the
          empty aggregate must yield final_restricted_units == 0.00. Critically the
          handover earns NO compliance credit — compliant_handover_count stays 0 — so the
          zero case is not silently treated as a compliant restricted delivery.
        test_recipe:
          setup:
            - "logical clock at 2026-08-20T12:00:00Z"
            - "jurisdiction US-NY with NO restriction policy at all, proving the empty set never consults policy resolution"
            - "product GROCERY-D with restriction_type NONE and restricted_units_per_item 0.00"
            - "customer with NO age attestation and NO identity check"
            - "partner OPEN, courier holding one ACTIVE ALCOHOL certification so that certification_state == CERTIFIED and compliant_handover_count == 0"
            - "order (4xGROCERY-D at 500 cents, delivery_fee_cents 0) submitted, dispatched, with an INITIATED attempt and both mandatory captures already stored"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-20T12:00:00Z" }
              as: PlatformAdmin
            - call: "POST /jurisdictions"
              payload: { code: "US-NY", name: "New York", dry_status: "WET", utc_offset_minutes: -240 }
              as: PlatformAdmin
              captures: { j_ny: $.data.id }
            - call: "POST /products"
              payload: { sku: "GROCERY-D", name: "Oat Milk 1L", restriction_type: "NONE", restricted_units_per_item: 0.00, list_price_cents: 500 }
              as: PlatformAdmin
              captures: { prod_d: $.data.id }
            - call: "POST /customers"
              payload: { full_name: "Ben Ito", email: "ben@example.com", jurisdiction_id: "${j_ny}" }
              as: PlatformAdmin
              captures: { cust: $.data.id }
            - call: "POST /delivery-partners"
              payload: { legal_name: "Empire Last Mile", contract_tier: "STANDARD", license_reference: "NY-DEL-0001" }
              as: PlatformAdmin
              captures: { partner: $.data.id }
            - call: "POST /couriers"
              payload: { delivery_partner_id: "${partner}", full_name: "Dana Reyes", hired_at: "2026-05-01" }
              as: PartnerManager
              as_user_id: "${partner}"
              captures: { courier: $.data.id }
            - call: "POST /courier-certifications"
              payload: { courier_id: "${courier}", restriction_type: "ALCOHOL", training_score: 92, training_completed_at: "2026-07-15", valid_days: 365 }
              as: PartnerManager
              as_user_id: "${partner}"
              captures: { cert: $.data.id }
            - call: "POST /orders"
              payload: { customer_id: "${cust}", delivery_jurisdiction_id: "${j_ny}", delivery_partner_id: "${partner}", scheduled_delivery_at: "2026-08-21T04:00:00Z", delivery_fee_cents: 0 }
              as: Customer
              as_user_id: "${cust}"
              captures: { order: $.data.id }
            - call: "POST /orders/${order}/lines"
              payload: { product_id: "${prod_d}", quantity: 4 }
              as: Customer
              as_user_id: "${cust}"
              captures: { line_d: $.data.id }
            - call: "POST /orders/${order}/submit"
              payload: {}
              as: Customer
              as_user_id: "${cust}"
            - call: "POST /orders/${order}/dispatch"
              payload: {}
              as: PartnerManager
              as_user_id: "${partner}"
            - call: "POST /delivery-attempts"
              payload: { order_id: "${order}", courier_id: "${courier}", started_at: "2026-08-21T04:00:00Z" }
              as: Courier
              as_user_id: "${courier}"
              captures: { att: $.data.id }
            - call: "POST /delivery-attempts/${att}/captures"
              payload: { kind: "SIGNATURE", content_hash: "1111111111111111111111111111111111111111111111111111111111111111", captured_at: "2026-08-21T04:05:00Z" }
              as: Courier
              as_user_id: "${courier}"
            - call: "POST /delivery-attempts/${att}/captures"
              payload: { kind: "PHOTO_HANDOFF", content_hash: "2222222222222222222222222222222222222222222222222222222222222222", captured_at: "2026-08-21T04:06:00Z" }
              as: Courier
              as_user_id: "${courier}"
          trigger:
            - call: "POST /delivery-attempts/${att}/handover"
              payload: { recipient_name: "Ben Ito" }
              as: Courier
              as_user_id: "${courier}"
          assert:
            - "Order.${order}.restriction_types == []"
            - "Order.${order}.applied_policy_ids == []"
            - "Order.${order}.compliance_state == AUTO_CLEARED"
            - "Order.${order}.provisional_restricted_units == 0.00"
            - "Order.${order}.item_subtotal_cents == 2000 and Order.${order}.charged_cents == 2000"
            - "the trigger call returns 200 and DeliveryAttempt.${att}.state == HANDED_OVER"
            - "Order.${order}.fulfillment_state == DELIVERED"
            - "Order.${order}.final_restricted_units == 0.00"
            - "DeliveryAttempt.${att}.id_check_compliant == false"
            - "Courier.${courier}.compliant_handover_count == 0"
            - "Courier.${courier}.compliance_score == 100.00, because an empty-restriction handover earns no bonus"
            - "OrderLine.${line_d}.line_restricted_units == 0.00"

