            - "Agreement float_size_kegs 4 at 2200, activated 2026-08-01; order of 2 kegs allocated and dispatched; BOTH kegs FILLed at 12:00Z and 13:00Z, i.e. before any uphold, because the first uphold puts the brewer in PROBATION and a suspended float refuses further FILL scans."
            - "Two assessments, each created by one analyst and resolved UPHELD by the other, so priority 26 clause (a) never blocks the setup. After both upholds the trailing loss rate is 2 upheld / 2 fills = 10000 bp, so the brewer is in PROBATION with status_reason LOSS_RATE_THRESHOLD."
