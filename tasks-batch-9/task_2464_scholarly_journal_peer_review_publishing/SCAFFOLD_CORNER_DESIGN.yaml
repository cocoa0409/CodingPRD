      - name: journal_standard_crud_create_read_list_and_patch
        claim_type: standard_crud
        grounds:
          - endpoints[POST /journals]
          - endpoints[GET /journals/{id}]
          - endpoints[GET /journals]
          - endpoints[PATCH /journals/{id}]
        distinguishing_aspect: |
          The four standard journal routes agree with each other: the id returned by POST is readable at
          GET /journals/{id}, appears in the GET /journals collection, and a PATCH of two configuration
          fields is visible on the next read while every unpatched field and every counter keeps its
          creation value.
        test_recipe:
          setup:
            - "No journals exist before the create call."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
          trigger:
            - call: "POST /journals"
              payload: { name: "Journal of CRUD", subject_areas: ["ONCOLOGY", "CARDIOLOGY"], max_page_count: 24 }
              as: SystemAdmin
              captures: { j_id: $.data.id }
            - call: "GET /journals/${j_id}"
              as: SystemAdmin
            - call: "GET /journals"
              as: SystemAdmin
            - call: "PATCH /journals/${j_id}"
              payload: { max_page_count: 18, reminder_cadence_days: 5 }
              as: SystemAdmin
            - call: "GET /journals/${j_id}"
              as: SystemAdmin
          assert:
            - "all four calls succeed (201 on create, 200 on the reads and the patch)"
            - "GET /journals returns exactly 1 row whose id == ${j_id}"
            - "the first GET /journals/${j_id} shows max_page_count 24 and reminder_cadence_days 7"
            - "the second GET /journals/${j_id} shows max_page_count 18 and reminder_cadence_days 5"
            - "Journal.${j_id}.name == Journal of CRUD"
            - "Journal.${j_id}.subject_areas == [ONCOLOGY, CARDIOLOGY]"
            - "Journal.${j_id}.doi_prefix == 10.5555"
            - "Journal.${j_id}.min_completed_reviews_for_decision == 2"
            - "Journal.${j_id}.manuscript_intake_count == 0"
            - "Journal.${j_id}.apc_receivable_cents == 0"

