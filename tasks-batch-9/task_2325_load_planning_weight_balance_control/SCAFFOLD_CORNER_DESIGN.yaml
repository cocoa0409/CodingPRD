          setup:
            - "Fixture FX-A computed (base_payload_kg 6100.00, underload_kg 14080.00, index_tow 87.26); the plan version is captured, then a 100 kg gate-checked bag is absorbed into H1, taking planned_payload_kg to 6200.00 and index_tow to 86.48."
