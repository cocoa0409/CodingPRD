# =============================================================================
# SCAFFOLD_CORNER_DESIGN.yaml — task 1656 (Manufacturer's Rep Agency)
# §1.9 Coverage Index for Non-Difficulty Tests: enumerative breadth over every
# §1.1–§1.7 claim not already probed by SCAFFOLD_DIFFICULTY_DESIGN.yaml.
# Sections/claim_types follow references/claim-extraction-guide.md.
# "BASE" below = the canonical fixture described in the difficulty file header.
# =============================================================================

scaffold_corner_design:

  # ---------------------------------------------------------------------------
  # Section: entities
  # ---------------------------------------------------------------------------
  - section: entities
    instances:
      - name: principal_creation_applies_defaults
        claim_type: defaults
        grounds: ["entities.Principal.fields.notice_period_days", "entities.Principal.fields.status", "entities.Principal.fields.credited_ytd_sales_cents"]
        distinguishing_aspect: "Creating a principal without notice_period_days applies default 90; status ACTIVE; credited_ytd 0; ytd_year == 2026 (clock default year)."
        test_recipe:
          setup: ["empty DB; clock untouched (default 2026-08-01T00:00:00Z)"]
          setup_api_calls: []
          trigger:
            - call: "POST /rep-agency/principals"
              payload: { name: "P1", annual_quota_cents: 10000000 }
              as: AgencyAdmin
              captures: { p1: $.data.id, nd: $.data.notice_period_days, yy: $.data.ytd_year }
          assert:
            - "Principal.${p1}.notice_period_days == 90 (default applied)"
            - "Principal.${p1}.status == ACTIVE and version == 1"
            - "Principal.${p1}.credited_ytd_sales_cents == 0 and ytd_year == 2026"
            - "termination_notice_issued_at and termination_effective_at are null"

      - name: principal_missing_required_field_rejected
        claim_type: required_fields
        grounds: ["entities.Principal.fields.annual_quota_cents", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "Omitting the required input annual_quota_cents is rejected with ERR_INVALID_REQUEST (400) before any persistence."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /rep-agency/principals"
              payload: { name: "P1" }
              as: AgencyAdmin
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_REQUEST, http 400"

      - name: order_get_not_found_returns_404
        claim_type: not_found
        grounds: ["errors[ERR_NOT_FOUND]", "validations[priority=3]"]
        distinguishing_aspect: "GET on a well-formed but nonexistent order id returns ERR_NOT_FOUND (404), not a 500 or empty envelope."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /rep-agency/orders/11111111-1111-1111-1111-111111111111"
              as: AgencyAdmin
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_NOT_FOUND, http 404"

      - name: rep_territory_overlap_rejected
        claim_type: type_constraints
        grounds: ["entities.Rep.fields.territory_codes", "errors[ERR_TERRITORY_COVERAGE_CONFLICT]"]
        distinguishing_aspect: "A second ACTIVE rep whose territory_codes intersect an existing rep's (CA shared) is rejected; a disjoint set succeeds."
        test_recipe:
          setup: ["rep R1 covering [CA, OR] exists"]
          setup_api_calls:
            - call: "POST /rep-agency/reps"
              payload: { display_name: "R1", territory_codes: ["CA", "OR"] }
              as: AgencyAdmin
              captures: { r1: $.data.id }
          trigger:
            - call: "POST /rep-agency/reps"
              payload: { display_name: "R2", territory_codes: ["CA", "NV"] }
              as: AgencyAdmin
              captures: { err: $.data.error_id }
            - call: "POST /rep-agency/reps"
              payload: { display_name: "R3", territory_codes: ["NV"] }
              as: AgencyAdmin
              captures: { r3: $.data.id }
          assert:
            - "overlapping create -> error_id == ERR_TERRITORY_COVERAGE_CONFLICT (409)"
            - "disjoint create succeeds and Rep.${r3}.status == ACTIVE"

      - name: order_creation_initializes_computed_line_fields
        claim_type: computed_fields
        grounds: ["entities.Order.fields.lines", "entities.Order.fields.fulfillment_status", "entities.Order.fields.commission_status"]
        distinguishing_aspect: "At creation every order line carries shipped_qty 0, returned_qty 0, applied_rate_bp null, commission_cents null, protected_registration_id null; header states PLACED / ATTRIBUTED."
        test_recipe:
          setup: ["BASE principal/agreement/schedule/reps/customer"]
          setup_api_calls:
            - call: "POST /rep-agency/principals"
              payload: { name: "P1", annual_quota_cents: 10000000, notice_period_days: 90 }
              as: AgencyAdmin
              captures: { p1: $.data.id, p1_v: $.data.version }
            - call: "POST /rep-agency/principals/${p1}/agreements"
              payload: { territory_codes: ["CA", "OR", "WA"], effective_start: "2026-01-01T00:00:00Z" }
              as: AgencyAdmin
              captures: { a1: $.data.id }
            - call: "POST /rep-agency/agreements/${a1}/activate"
              payload: {}
              as: AgencyAdmin
            - call: "POST /rep-agency/principals/${p1}/rate-schedules"
              payload: { family_rates: [{ family_code: "CONNECTORS", base_rate_bp: 1000 }], attainment_tiers: [{ min_attainment_bp: 0, multiplier_bp: 10000 }], expected_principal_version: "${p1_v}" }
              as: AgencyAdmin
            - call: "POST /rep-agency/reps"
              payload: { display_name: "R1", territory_codes: ["CA", "OR"] }
              as: AgencyAdmin
              captures: { r1: $.data.id }
            - call: "POST /rep-agency/reps"
              payload: { display_name: "R2", territory_codes: ["WA"] }
              as: AgencyAdmin
              captures: { r2: $.data.id }
            - call: "POST /rep-agency/customers"
              payload: { name: "C1", spec_territory_code: "CA", ship_to_territory_code: "WA" }
              as: AgencyAdmin
              captures: { c1: $.data.id }
          trigger:
            - call: "POST /rep-agency/orders"
              payload: { customer_id: "${c1}", principal_id: "${p1}", external_order_ref: "PO-1", placed_at: "2026-08-01T00:00:00Z", lines: [{ line_id: "L1", family_code: "CONNECTORS", quantity: 5, unit_price_cents: 5000 }] }
              as: AgencyAdmin
              captures: { o1: $.data.id, fs: $.data.fulfillment_status, cs: $.data.commission_status }
          assert:
            - "fulfillment_status == PLACED and commission_status == ATTRIBUTED on creation"
            - "line L1: shipped_qty == 0, returned_qty == 0, applied_rate_bp is null, commission_cents is null, protected_registration_id is null"
            - "shipped_at / invoiced_at / paid_at are null; version == 1"

      - name: customer_creation_persists_territory_pair
        claim_type: creation
        grounds: ["entities.Customer.fields.spec_territory_code", "entities.Customer.fields.ship_to_territory_code"]
        distinguishing_aspect: "POST /rep-agency/customers persists spec and ship-to territories verbatim and returns 201 with the full record."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /rep-agency/customers"
              payload: { name: "C1", spec_territory_code: "CA", ship_to_territory_code: "WA" }
              as: AgencyAdmin
              captures: { c1: $.data.id }
          assert:
            - "Customer.${c1}.spec_territory_code == CA and ship_to_territory_code == WA"
            - "http 201; id is a server-minted UUID"

  # ---------------------------------------------------------------------------
  # Section: state_machines
  # ---------------------------------------------------------------------------
  - section: state_machines
    instances:
      - name: order_invoice_before_ship_rejected
        claim_type: invalid_transition
        grounds: ["state_machines.Order.PLACED_to_SHIPPED", "state_machines.Order.SHIPPED_to_INVOICED", "errors[ERR_INVALID_STATE_TRANSITION]"]
        distinguishing_aspect: "Invoice is only declared from SHIPPED; invoicing a PLACED order is rejected and leaves fulfillment/commission states untouched."
        test_recipe:
          setup: ["BASE; order PO-1 created (PLACED) but never shipped"]
          setup_api_calls:
            - call: "POST /rep-agency/principals"
              payload: { name: "P1", annual_quota_cents: 10000000, notice_period_days: 90 }
              as: AgencyAdmin
              captures: { p1: $.data.id, p1_v: $.data.version }
            - call: "POST /rep-agency/principals/${p1}/agreements"
              payload: { territory_codes: ["CA", "OR", "WA"], effective_start: "2026-01-01T00:00:00Z" }
              as: AgencyAdmin
              captures: { a1: $.data.id }
            - call: "POST /rep-agency/agreements/${a1}/activate"
              payload: {}
              as: AgencyAdmin
            - call: "POST /rep-agency/principals/${p1}/rate-schedules"
              payload: { family_rates: [{ family_code: "CONNECTORS", base_rate_bp: 1000 }], attainment_tiers: [{ min_attainment_bp: 0, multiplier_bp: 10000 }], expected_principal_version: "${p1_v}" }
              as: AgencyAdmin
            - call: "POST /rep-agency/reps"
              payload: { display_name: "R1", territory_codes: ["CA", "OR"] }
              as: AgencyAdmin
              captures: { r1: $.data.id }
            - call: "POST /rep-agency/reps"
              payload: { display_name: "R2", territory_codes: ["WA"] }
              as: AgencyAdmin
              captures: { r2: $.data.id }
            - call: "POST /rep-agency/customers"
              payload: { name: "C1", spec_territory_code: "CA", ship_to_territory_code: "WA" }
              as: AgencyAdmin
              captures: { c1: $.data.id }
            - call: "POST /rep-agency/orders"
              payload: { customer_id: "${c1}", principal_id: "${p1}", external_order_ref: "PO-1", placed_at: "2026-08-01T00:00:00Z", lines: [{ line_id: "L1", family_code: "CONNECTORS", quantity: 5, unit_price_cents: 5000 }] }
              as: AgencyAdmin
              captures: { o1: $.data.id }
          trigger:
            - call: "POST /rep-agency/orders/${o1}/invoice"
              payload: {}
              as: PrincipalOps
              as_user_id: "${p1}"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE_TRANSITION (invoice requires SHIPPED)"
            - "Order.${o1}.fulfillment_status still PLACED; commission_status still ATTRIBUTED; no CommissionEntry exists for ${o1}"

      - name: cancelled_order_terminal_lockdown
        claim_type: terminal_state_lockdown
        grounds: ["state_machines.Order.PLACED_to_CANCELLED"]
        distinguishing_aspect: "CANCELLED is terminal: ship/invoice on a cancelled order are rejected with ERR_INVALID_STATE_TRANSITION and produce no side effects."
        test_recipe:
          setup: ["BASE; order PO-1 PLACED then cancelled"]
          setup_api_calls:
            - call: "POST /rep-agency/principals"
              payload: { name: "P1", annual_quota_cents: 10000000, notice_period_days: 90 }
              as: AgencyAdmin
              captures: { p1: $.data.id, p1_v: $.data.version }
            - call: "POST /rep-agency/principals/${p1}/agreements"
              payload: { territory_codes: ["CA", "OR", "WA"], effective_start: "2026-01-01T00:00:00Z" }
              as: AgencyAdmin
              captures: { a1: $.data.id }
            - call: "POST /rep-agency/agreements/${a1}/activate"
              payload: {}
              as: AgencyAdmin
            - call: "POST /rep-agency/principals/${p1}/rate-schedules"
              payload: { family_rates: [{ family_code: "CONNECTORS", base_rate_bp: 1000 }], attainment_tiers: [{ min_attainment_bp: 0, multiplier_bp: 10000 }], expected_principal_version: "${p1_v}" }
              as: AgencyAdmin
            - call: "POST /rep-agency/reps"
              payload: { display_name: "R1", territory_codes: ["CA", "OR"] }
              as: AgencyAdmin
              captures: { r1: $.data.id }
            - call: "POST /rep-agency/reps"
              payload: { display_name: "R2", territory_codes: ["WA"] }
              as: AgencyAdmin
              captures: { r2: $.data.id }
            - call: "POST /rep-agency/customers"
              payload: { name: "C1", spec_territory_code: "CA", ship_to_territory_code: "WA" }
              as: AgencyAdmin
              captures: { c1: $.data.id }
            - call: "POST /rep-agency/orders"
              payload: { customer_id: "${c1}", principal_id: "${p1}", external_order_ref: "PO-1", placed_at: "2026-08-01T00:00:00Z", lines: [{ line_id: "L1", family_code: "CONNECTORS", quantity: 5, unit_price_cents: 5000 }] }
              as: AgencyAdmin
              captures: { o1: $.data.id }
            - call: "POST /rep-agency/orders/${o1}/cancel"
              payload: {}
              as: AgencyAdmin
          trigger:
            - call: "POST /rep-agency/orders/${o1}/ship"
              payload: {}
              as: PrincipalOps
              as_user_id: "${p1}"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE_TRANSITION (terminal lockdown)"
            - "Order.${o1}.fulfillment_status == CANCELLED and commission_status == CLOSED"

      - name: rma_rejected_then_receive_rejected
        claim_type: terminal_state_lockdown
        grounds: ["state_machines.ReturnAuthorization.REQUESTED_to_REJECTED"]
        distinguishing_aspect: "REJECTED is terminal for an RMA: a later receive call is rejected ERR_INVALID_STATE_TRANSITION and posts no chargeback entries."
        test_recipe:
          setup: ["BASE; O1 shipped+invoiced (L1 CONNECTORS 100x5000); RMA qty 10 created then REJECTED by principal"]
          setup_api_calls:
            - call: "POST /rep-agency/principals"
              payload: { name: "P1", annual_quota_cents: 10000000, notice_period_days: 90 }
              as: AgencyAdmin
              captures: { p1: $.data.id, p1_v: $.data.version }
            - call: "POST /rep-agency/principals/${p1}/agreements"
              payload: { territory_codes: ["CA", "OR", "WA"], effective_start: "2026-01-01T00:00:00Z" }
              as: AgencyAdmin
              captures: { a1: $.data.id }
            - call: "POST /rep-agency/agreements/${a1}/activate"
              payload: {}
              as: AgencyAdmin
            - call: "POST /rep-agency/principals/${p1}/rate-schedules"
              payload: { family_rates: [{ family_code: "CONNECTORS", base_rate_bp: 1000 }], attainment_tiers: [{ min_attainment_bp: 0, multiplier_bp: 10000 }], expected_principal_version: "${p1_v}" }
              as: AgencyAdmin
            - call: "POST /rep-agency/reps"
              payload: { display_name: "R1", territory_codes: ["CA", "OR"] }
              as: AgencyAdmin
              captures: { r1: $.data.id }
            - call: "POST /rep-agency/reps"
              payload: { display_name: "R2", territory_codes: ["WA"] }
              as: AgencyAdmin
              captures: { r2: $.data.id }
            - call: "POST /rep-agency/customers"
              payload: { name: "C1", spec_territory_code: "CA", ship_to_territory_code: "WA" }
              as: AgencyAdmin
              captures: { c1: $.data.id }
            - call: "POST /rep-agency/orders"
              payload: { customer_id: "${c1}", principal_id: "${p1}", external_order_ref: "PO-1", placed_at: "2026-08-01T00:00:00Z", lines: [{ line_id: "L1", family_code: "CONNECTORS", quantity: 100, unit_price_cents: 5000 }] }
              as: AgencyAdmin
              captures: { o1: $.data.id }
            - call: "POST /rep-agency/orders/${o1}/ship"
              payload: {}
              as: PrincipalOps
              as_user_id: "${p1}"
            - call: "POST /rep-agency/orders/${o1}/invoice"
              payload: {}
              as: PrincipalOps
              as_user_id: "${p1}"
            - call: "POST /rep-agency/rmas"
              payload: { order_id: "${o1}", lines: [{ line_id: "L1", qty: 10 }] }
              as: AgencyAdmin
              captures: { rma1: $.data.id }
            - call: "POST /rep-agency/rmas/${rma1}/reject"
              payload: {}
              as: PrincipalOps
              as_user_id: "${p1}"
          trigger:
            - call: "POST /rep-agency/rmas/${rma1}/receive"
              payload: {}
              as: PrincipalOps
              as_user_id: "${p1}"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE_TRANSITION"
            - "no CHARGEBACK CommissionEntry exists for order ${o1}; rep balances unchanged (R1 50,000 x 0.6 = 30,000)"

      - name: settled_statement_terminal_lockdown
        claim_type: terminal_state_lockdown
        grounds: ["state_machines.CommissionStatement.IN_RECONCILIATION_to_SETTLED"]
        distinguishing_aspect: "SETTLED is terminal: disputing a line of a settled statement is rejected ERR_INVALID_STATE_TRANSITION."
        test_recipe:
          setup: ["BASE; O1 invoiced (58,000c expected: R1 34,800 / R2 23,200 — single line L1 CONNECTORS 100x5000 at 1000bp = 50,000 plus L2 CABLES 50x2000 at 800bp = 8,000)"]
          setup_api_calls:
            - call: "POST /rep-agency/principals"
              payload: { name: "P1", annual_quota_cents: 10000000, notice_period_days: 90 }
              as: AgencyAdmin
              captures: { p1: $.data.id, p1_v: $.data.version }
            - call: "POST /rep-agency/principals/${p1}/agreements"
              payload: { territory_codes: ["CA", "OR", "WA"], effective_start: "2026-01-01T00:00:00Z", specify_share_bp: 6000 }
              as: AgencyAdmin
              captures: { a1: $.data.id }
            - call: "POST /rep-agency/agreements/${a1}/activate"
              payload: {}
              as: AgencyAdmin
            - call: "POST /rep-agency/principals/${p1}/rate-schedules"
              payload: { family_rates: [{ family_code: "CONNECTORS", base_rate_bp: 1000 }, { family_code: "CABLES", base_rate_bp: 800 }], attainment_tiers: [{ min_attainment_bp: 0, multiplier_bp: 10000 }], registration_bonus_bp: 200, expected_principal_version: "${p1_v}" }
              as: AgencyAdmin
            - call: "POST /rep-agency/reps"
              payload: { display_name: "R1", territory_codes: ["CA", "OR"] }
              as: AgencyAdmin
              captures: { r1: $.data.id }
            - call: "POST /rep-agency/reps"
              payload: { display_name: "R2", territory_codes: ["WA"] }
              as: AgencyAdmin
              captures: { r2: $.data.id }
            - call: "POST /rep-agency/customers"
              payload: { name: "C1", spec_territory_code: "CA", ship_to_territory_code: "WA" }
              as: AgencyAdmin
              captures: { c1: $.data.id }
            - call: "POST /rep-agency/orders"
              payload: { customer_id: "${c1}", principal_id: "${p1}", external_order_ref: "PO-1", placed_at: "2026-08-01T00:00:00Z", lines: [{ line_id: "L1", family_code: "CONNECTORS", quantity: 100, unit_price_cents: 5000 }, { line_id: "L2", family_code: "CABLES", quantity: 50, unit_price_cents: 2000 }] }
              as: AgencyAdmin
              captures: { o1: $.data.id }
            - call: "POST /rep-agency/orders/${o1}/ship"
              payload: {}
              as: PrincipalOps
              as_user_id: "${p1}"
            - call: "POST /rep-agency/orders/${o1}/invoice"
              payload: {}
              as: PrincipalOps
              as_user_id: "${p1}"
            - call: "POST /rep-agency/statements"
              payload: { principal_id: "${p1}", period_label: "2026-08", lines: [{ line_id: "S1", external_order_ref: "PO-1", amount_cents: 58000 }] }
              as: PrincipalOps
              as_user_id: "${p1}"
              captures: { st1: $.data.id }
            - call: "POST /rep-agency/statements/${st1}/start_reconciliation"
              payload: {}
              as: AgencyAdmin
            - call: "POST /rep-agency/statements/${st1}/settle"
              payload: {}
              as: AgencyAdmin
          trigger:
            - call: "POST /rep-agency/statements/${st1}/lines/S1/dispute"
              payload: { reason: "too late" }
              as: AgencyAdmin
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE_TRANSITION (SETTLED is terminal)"
            - "CommissionStatement.${st1}.status still SETTLED"

      - name: checkout_on_converted_unit_rejected
        claim_type: invalid_transition
        grounds: ["state_machines.SampleUnit.CHECKED_OUT_to_CONVERTED", "validations[priority=5]"]
        distinguishing_aspect: "A CONVERTED unit never returns to stock: checkout on it fails with ERR_INVALID_STATE_TRANSITION (unit state gate at priority 5 precedes the window rule)."
        test_recipe:
          setup: ["principal P1; rep R1 [CA]; unit U1 checked out then converted at 2026-08-02 (1 day -> 0 months -> full 80,000c charge)"]
          setup_api_calls:
            - call: "POST /rep-agency/principals"
              payload: { name: "P1", annual_quota_cents: 10000000 }
              as: AgencyAdmin
              captures: { p1: $.data.id }
            - call: "POST /rep-agency/reps"
              payload: { display_name: "R1", territory_codes: ["CA"] }
              as: AgencyAdmin
              captures: { r1: $.data.id }
            - call: "POST /rep-agency/sample-units"
              payload: { principal_id: "${p1}", serial_number: "S-1", family_code: "CONNECTORS", value_cents: 80000 }
              as: PrincipalOps
              as_user_id: "${p1}"
              captures: { u1: $.data.id }
            - call: "POST /rep-agency/sample-checkouts"
              payload: { sample_unit_id: "${u1}" }
              as: Rep
              as_user_id: "${r1}"
              captures: { co1: $.data.id }
            - call: "POST /rep-agency/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-02T00:00:00Z" }
              as: AgencyAdmin
            - call: "POST /rep-agency/sample-checkouts/${co1}/convert"
              payload: {}
              as: Rep
              as_user_id: "${r1}"
              captures: { chg: $.data.charge_cents }
          trigger:
            - call: "POST /rep-agency/sample-checkouts"
              payload: { sample_unit_id: "${u1}" }
              as: Rep
              as_user_id: "${r1}"
              captures: { err: $.data.error_id }
          assert:
            - "convert charged the full list: charge_cents == 80000 (0 months started -> factor 10000bp)"
            - "second checkout rejected: error_id == ERR_INVALID_STATE_TRANSITION"
            - "SampleUnit.${u1}.status remains CONVERTED"

      - name: fulfillment_and_commission_dimensions_independent
        claim_type: valid_transition
        grounds: ["state_machines.Order.SHIPPED_to_INVOICED", "state_machines.Order.INVOICED_to_PAID", "entities.Order.fields.commission_status"]
        distinguishing_aspect: "Order carries two parallel state dimensions: mark_paid moves fulfillment INVOICED->PAID while commission_status stays ACCRUED (only statement settle moves it to SETTLED)."
        test_recipe:
          setup: ["BASE; O1 shipped + invoiced (fulfillment INVOICED, commission ACCRUED)"]
          setup_api_calls:
            - call: "POST /rep-agency/principals"
              payload: { name: "P1", annual_quota_cents: 10000000 }
              as: AgencyAdmin
              captures: { p1: $.data.id, p1_v: $.data.version }
            - call: "POST /rep-agency/principals/${p1}/agreements"
              payload: { territory_codes: ["CA", "OR", "WA"], effective_start: "2026-01-01T00:00:00Z", specify_share_bp: 6000 }
              as: AgencyAdmin
              captures: { a1: $.data.id }
            - call: "POST /rep-agency/agreements/${a1}/activate"
              payload: {}
              as: AgencyAdmin
            - call: "POST /rep-agency/principals/${p1}/rate-schedules"
              payload: { family_rates: [{ family_code: "CONNECTORS", base_rate_bp: 1000 }], attainment_tiers: [{ min_attainment_bp: 0, multiplier_bp: 10000 }], expected_principal_version: "${p1_v}" }
              as: AgencyAdmin
            - call: "POST /rep-agency/reps"
              payload: { display_name: "R1", territory_codes: ["CA", "OR"] }
              as: AgencyAdmin
              captures: { r1: $.data.id }
            - call: "POST /rep-agency/reps"
              payload: { display_name: "R2", territory_codes: ["WA"] }
              as: AgencyAdmin
              captures: { r2: $.data.id }
            - call: "POST /rep-agency/customers"
              payload: { name: "C1", spec_territory_code: "CA", ship_to_territory_code: "WA" }
              as: AgencyAdmin
              captures: { c1: $.data.id }
            - call: "POST /rep-agency/orders"
              payload: { customer_id: "${c1}", principal_id: "${p1}", external_order_ref: "PO-1", placed_at: "2026-08-01T00:00:00Z", lines: [{ line_id: "L1", family_code: "CONNECTORS", quantity: 10, unit_price_cents: 5000 }] }
              as: AgencyAdmin
