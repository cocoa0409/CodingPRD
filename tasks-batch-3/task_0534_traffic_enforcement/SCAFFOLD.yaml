# =============================================================================
# task_0534_traffic_enforcement — Automated Traffic Enforcement seed tables (v1)
# Difficulty: Expert
# =============================================================================

scenario: |
  Automated Traffic Enforcement (Red-Light/Speed Camera): violation capture &
  evidence review, registered-owner lookup & notice, fine + admin-fee schedule,
  online evidence portal & contest, hearing/adjudication, payment & late
  escalation, vendor revenue share & audit, calibration/certification log

domain_name: traffic-enforcement
api_prefix: ""

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# Complexity Profile
# =============================================================================
complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: multi_party_negotiation   # hearing/adjudication + contest
  complexity_layers:
    - dual_variant_calculation      # fine schedule: statutory-tier vs adjudicated-reduced
    - cascading_side_effects        # citation void cascades to notice/fine/revenue-share
    - rate_threshold_triggers       # late escalation at day boundaries; repeat-offender surcharge
    - scheduled_actions             # response-deadline expiry, hearing scheduling (logical clock)

  entity_topology: flat            # peer entities linked by FK, not deep URL nesting
  state_machine_shape: branching   # citation forks review->contest->hearing->closed with revert loops
  relationship_patterns:
    - one_to_many        # Program has many Cameras/Citations; Citation has many Payments
    - flat_with_references
    - cross_aggregate    # Citation references RegisteredOwner, CalibrationRecord, VendorContract

  role_model: segregation_of_duties  # capture reviewer != adjudicator; vendor cannot review
  consistency_model: immediate

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Program
    parent: null
    common_fields: true
    fields:
      - { name: jurisdiction_name, type: string, source: input, description: "Enforcement jurisdiction name" }
      - { name: base_red_light_fine_cents, type: integer, source: input, description: "Statutory base fine for red-light violation" }
      - { name: base_speed_fine_cents, type: integer, source: input, description: "Statutory base fine for a speed violation at the lowest band" }
      - { name: admin_fee_cents, type: integer, source: input, description: "Flat administrative fee added to every issued citation" }
      - { name: late_fee_cents, type: integer, source: input, description: "Flat late penalty applied when a citation escalates past a deadline stage" }
      - { name: response_window_days, type: integer, source: input, default: 30, description: "Days from notice issuance until DUE, before late escalation begins" }
      - { name: repeat_offender_window_days, type: integer, source: input, default: 365, description: "Lookback window that defines a repeat offense for the same owner" }
      - { name: repeat_offender_surcharge_pct, type: number, source: input, default: 0.5, description: "Fractional surcharge on base fine for a repeat offense, e.g. 0.5 = +50%" }

  - name: Camera
    parent: Program
    common_fields: true
    fields:
      - { name: program_id, type: string, source: system, description: "FK -> Program.id" }
      - { name: intersection_code, type: string, source: input, description: "Human-readable intersection/site code, unique per Program while status != DECOMMISSIONED" }
      - { name: camera_type, type: enum, source: input, description: "RED_LIGHT | SPEED" }
      - { name: speed_limit_mph, type: integer, source: input, required: false, description: "Posted speed limit; required when camera_type=SPEED, must be null for RED_LIGHT" }
      - { name: status, type: enum, source: system, description: "ACTIVE | SUSPENDED | DECOMMISSIONED; capture only allowed while ACTIVE with a current certification" }
      - { name: certified_until_clock, type: datetime, source: computed, description: "Latest CalibrationRecord.valid_until_utc for a PASS on this camera; null if never certified" }

  - name: CalibrationRecord
    parent: Camera
    common_fields: false
    fields:
      - { name: camera_id, type: string, source: system, description: "FK -> Camera.id" }
      - { name: performed_at_utc, type: datetime, source: input, description: "When the calibration/certification was performed" }
      - { name: valid_until_utc, type: datetime, source: input, description: "Certification expiry; must be strictly after performed_at_utc" }
      - { name: technician_ref, type: string, source: input, description: "Certifying technician reference id" }
      - { name: result, type: enum, source: input, description: "PASS | FAIL" }
      - { name: notes, type: string, source: input, required: false, description: "Free-text calibration notes" }

  - name: RegisteredOwner
    parent: Program
    common_fields: true
    fields:
      - { name: program_id, type: string, source: system, description: "FK -> Program.id" }
      - { name: plate_number, type: string, source: input, description: "License plate, unique per Program" }
      - { name: full_name, type: string, source: input, description: "Registered owner legal name" }
      - { name: mailing_address, type: string, source: input, description: "Mailing address for notices" }
      - { name: portal_access_pin, type: string, source: system, description: "Server-minted PIN owner uses to authenticate in the evidence portal" }

  - name: Citation
    parent: Program
    common_fields: true
    fields:
      - { name: program_id, type: string, source: system, description: "FK -> Program.id" }
      - { name: camera_id, type: string, source: input, description: "FK -> Camera.id; camera that captured the event" }
      - { name: registered_owner_id, type: string, source: system, description: "FK -> RegisteredOwner.id; resolved during owner lookup, null until CITED" }
      - { name: captured_plate_number, type: string, source: input, description: "Plate string read at capture time, used for owner lookup" }
      - { name: event_at_utc, type: datetime, source: input, description: "Timestamp of the captured violation event" }
      - { name: measured_speed_mph, type: integer, source: input, required: false, description: "Recorded speed for SPEED cameras; null for RED_LIGHT" }
      - { name: status, type: enum, source: system, description: "PENDING_REVIEW | REJECTED | CITED | CONTESTED | HEARING_SCHEDULED | ADJUDICATED_UPHELD | ADJUDICATED_DISMISSED | PAID | DELINQUENT | VOID" }
      - { name: notice_issued_at_utc, type: datetime, source: computed, description: "Clock time when notice was issued (transition to CITED); null before" }
      - { name: due_at_utc, type: datetime, source: computed, description: "= notice_issued_at_utc + Program.response_window_days; null before CITED" }
      - { name: escalation_stage, type: enum, source: computed, description: "NONE | DELINQUENT; NONE until the escalation sweep moves a past-deadline citation to DELINQUENT" }
      - { name: assessed_amount_cents, type: integer, source: computed, description: "Statutory amount owed at citation time = base fine (+repeat surcharge) + admin_fee; excludes late fees" }
      - { name: adjudicated_amount_cents, type: integer, source: computed, description: "Final amount owed after adjudication or escalation; null until an amount-fixing transition fires" }
      - { name: amount_paid_cents, type: integer, source: computed, default: 0, description: "Sum of CLEARED Payment.amount_cents against this citation" }
      - { name: review_officer_ref, type: string, source: system, required: false, description: "X-User-ID of ReviewOfficer who approved/rejected; null before review" }

  - name: Contest
    parent: Citation
    common_fields: true
    fields:
      - { name: citation_id, type: string, source: system, description: "FK -> Citation.id" }
      - { name: submitted_by_owner_id, type: string, source: system, description: "FK -> RegisteredOwner.id who filed the contest" }
      - { name: ground, type: enum, source: input, description: "NOT_THE_DRIVER | PLATE_MISREAD | SIGNAL_MALFUNCTION | CALIBRATION_LAPSED | EMERGENCY" }
      - { name: statement, type: string, source: input, description: "Owner's written statement" }
      - { name: status, type: enum, source: system, description: "SUBMITTED | SCHEDULED | UPHELD | DISMISSED | WITHDRAWN" }

  - name: Hearing
    parent: Contest
    common_fields: true
    fields:
      - { name: contest_id, type: string, source: system, description: "FK -> Contest.id" }
      - { name: citation_id, type: string, source: system, description: "FK -> Citation.id" }
      - { name: scheduled_at_utc, type: datetime, source: input, description: "Scheduled hearing time; must be strictly in the future relative to the logical clock" }
      - { name: adjudicator_ref, type: string, source: system, description: "X-User-ID of the Adjudicator assigned; must differ from the citation's review_officer_ref" }
      - { name: outcome, type: enum, source: system, required: false, description: "UPHELD | DISMISSED | REDUCED; null until ruled" }
      - { name: reduced_amount_cents, type: integer, source: input, required: false, description: "Adjudicator-set reduced fine (excludes admin_fee), required only when outcome=REDUCED" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | RULED | ADJOURNED" }

  - name: Payment
    parent: Citation
    common_fields: true
    fields:
      - { name: citation_id, type: string, source: system, description: "FK -> Citation.id" }
      - { name: amount_cents, type: integer, source: input, description: "Amount tendered on this payment" }
      - { name: method, type: enum, source: input, description: "CARD | CHECK | CASH" }
      - { name: status, type: enum, source: system, description: "INITIATED | CLEARED | FAILED | REVERSED" }

  - name: VendorContract
    parent: Program
    common_fields: true
    fields:
      - { name: program_id, type: string, source: system, description: "FK -> Program.id" }
      - { name: vendor_name, type: string, source: input, description: "Camera vendor name" }
      - { name: revenue_share_pct, type: number, source: input, description: "Vendor's fraction of net collected fine revenue, 0..1; applies to fine portion only, never admin/late fees" }
      - { name: monthly_cap_cents, type: integer, source: input, required: false, description: "Optional cap on vendor share accrued per program; null = uncapped" }
      - { name: accrued_vendor_share_cents, type: integer, source: computed, default: 0, description: "Running vendor share accrued from CLEARED payments minus reversals; never below 0" }
      - { name: status, type: enum, source: system, description: "ACTIVE | TERMINATED" }

  - name: NoticeRecord
    parent: Citation
    common_fields: false
    # Append-only audit log entry. One is emitted per notice-generating event on a citation
    # (issuance on CITED, and one on each escalation step). Never mutated after creation.
    fields:
      - { name: citation_id, type: string, source: system, description: "FK -> Citation.id" }
      - { name: registered_owner_id, type: string, source: system, description: "FK -> RegisteredOwner.id; the owner the notice was mailed to at issuance time" }
      - { name: notice_type, type: enum, source: system, description: "INITIAL | DELINQUENT; INITIAL on CITED, DELINQUENT emitted by the escalation sweep" }
      - { name: issued_at_clock, type: datetime, source: system, description: "Logical clock instant at which this notice was generated" }
      - { name: amount_owed_snapshot_cents, type: integer, source: system, description: "amount_owed_total at the instant the notice was generated (immutable snapshot)" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Camera
    initial_state: ACTIVE
    terminal_states: [DECOMMISSIONED]
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /cameras/{id}/suspend"
        actor: ProgramAdmin
        preconditions: ["camera.status == ACTIVE"]
        side_effects: ["camera.status = SUSPENDED"]
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /cameras/{id}/reactivate"
        actor: ProgramAdmin
        preconditions: ["camera.status == SUSPENDED"]
        side_effects: ["camera.status = ACTIVE"]
      - from: ACTIVE
        to: DECOMMISSIONED
        trigger: "POST /cameras/{id}/decommission"
        actor: ProgramAdmin
        preconditions: ["camera.status == ACTIVE"]
        side_effects: ["camera.status = DECOMMISSIONED"]
      - from: SUSPENDED
        to: DECOMMISSIONED
        trigger: "POST /cameras/{id}/decommission"
        actor: ProgramAdmin
        preconditions: ["camera.status == SUSPENDED"]
        side_effects: ["camera.status = DECOMMISSIONED"]

  - entity: Citation
    initial_state: PENDING_REVIEW
    terminal_states: [REJECTED, PAID, ADJUDICATED_DISMISSED, VOID]
    transitions:
      - from: PENDING_REVIEW
        to: REJECTED
        trigger: "POST /citations/{id}/review with decision=REJECT"
        actor: ReviewOfficer
        preconditions:
          - "citation.status == PENDING_REVIEW"
        side_effects:
          - "citation.review_officer_ref = X-User-ID"
          - "no notice issued; no owner lookup performed"

      - from: PENDING_REVIEW
        to: CITED
        trigger: "POST /citations/{id}/review with decision=APPROVE"
        actor: ReviewOfficer
        preconditions:
          - "citation.status == PENDING_REVIEW"
          - "the capturing Camera had a PASS CalibrationRecord whose valid_until_utc > citation.event_at_utc (cross-entity: Camera calibration coverage at event time)"
          - "a RegisteredOwner exists in this Program with plate_number == citation.captured_plate_number (owner lookup must resolve)"
        side_effects:
          - "citation.review_officer_ref = X-User-ID"
          - "citation.registered_owner_id = matched RegisteredOwner.id (owner lookup)"
          - "citation.notice_issued_at_utc = current logical clock (notice issued)"
          - "citation.due_at_utc = notice_issued_at_utc + Program.response_window_days"
          - "citation.assessed_amount_cents computed via fine_schedule_statutory calc"
          - "citation.adjudicated_amount_cents = assessed_amount_cents (starting owed amount)"
          - "citation.escalation_stage = NONE"
          - "append a NoticeRecord{notice_type=INITIAL, registered_owner_id, issued_at_clock=now, amount_owed_snapshot_cents=assessed_amount_cents} (audit log)"

      - from: CITED
        to: PAID
        trigger: "POST /citations/{id}/payments then payment clears"
        actor: system
        preconditions:
          - "citation.status IN {CITED}"
          - "cumulative CLEARED payments >= amount_owed_total (adjudicated_amount_cents + late fees per escalation_stage)"
        side_effects:
          - "citation.status = PAID"
          - "citation.amount_paid_cents recomputed"
          - "vendor share accrued via vendor_revenue_share calc (cascade to VendorContract.accrued_vendor_share_cents)"

      - from: CITED
        to: CONTESTED
        trigger: "POST /citations/{id}/contests"
        actor: RegisteredOwner
        preconditions:
          - "citation.status == CITED"
          - "current logical clock <= citation.due_at_utc (contest before deadline; note escalation may still be NONE)"
        side_effects:
          - "citation.status = CONTESTED"
          - "a Contest is created in SUBMITTED"

      - from: CONTESTED
        to: HEARING_SCHEDULED
        trigger: "POST /contests/{id}/hearings"
        actor: ProgramAdmin
        preconditions:
          - "citation.status == CONTESTED"
          - "the Contest is in SUBMITTED"
        side_effects:
          - "citation.status = HEARING_SCHEDULED"
          - "Contest.status = SCHEDULED"
          - "a Hearing is created in SCHEDULED with adjudicator_ref != citation.review_officer_ref (segregation of duties)"

      - from: HEARING_SCHEDULED
        to: ADJUDICATED_UPHELD
        trigger: "POST /hearings/{hid}/rule with outcome=UPHELD"
        actor: Adjudicator
        preconditions:
          - "citation.status == HEARING_SCHEDULED"
          - "Hearing.status == SCHEDULED"
          - "current logical clock >= Hearing.scheduled_at_utc (hearing has occurred)"
        side_effects:
          - "citation.status = ADJUDICATED_UPHELD"
          - "Hearing.status = RULED; Hearing.outcome = UPHELD; Contest.status = DISMISSED"
          - "citation.adjudicated_amount_cents = citation.assessed_amount_cents (fine stands unchanged)"

      - from: HEARING_SCHEDULED
        to: ADJUDICATED_UPHELD
        trigger: "POST /hearings/{hid}/rule with outcome=REDUCED"
        actor: Adjudicator
        preconditions:
          - "citation.status == HEARING_SCHEDULED"
          - "Hearing.status == SCHEDULED"
          - "current logical clock >= Hearing.scheduled_at_utc"
          - "Hearing.reduced_amount_cents is present and 0 < reduced_amount_cents < citation.assessed_amount_cents - Program.admin_fee_cents"
        side_effects:
          - "citation.status = ADJUDICATED_UPHELD (liable, but at reduced amount)"
          - "Hearing.status = RULED; Hearing.outcome = REDUCED; Contest.status = DISMISSED"
          - "citation.adjudicated_amount_cents recomputed via fine_schedule_adjudicated calc = reduced_amount_cents + admin_fee_cents"

      - from: HEARING_SCHEDULED
        to: ADJUDICATED_DISMISSED
        trigger: "POST /hearings/{hid}/rule with outcome=DISMISSED"
        actor: Adjudicator
        preconditions:
          - "citation.status == HEARING_SCHEDULED"
          - "Hearing.status == SCHEDULED"
          - "current logical clock >= Hearing.scheduled_at_utc"
        side_effects:
          - "citation.status = ADJUDICATED_DISMISSED (terminal)"
          - "Hearing.status = RULED; Hearing.outcome = DISMISSED; Contest.status = UPHELD"
          - "citation.adjudicated_amount_cents = 0; escalation_stage = NONE (compensating: owner owes nothing)"

      - from: ADJUDICATED_UPHELD
        to: PAID
        trigger: "POST /citations/{id}/payments then payment clears"
        actor: system
        preconditions:
          - "citation.status == ADJUDICATED_UPHELD"
          - "cumulative CLEARED payments >= amount_owed_total"
        side_effects:
          - "citation.status = PAID"
          - "citation.amount_paid_cents recomputed"
          - "vendor share accrued via vendor_revenue_share calc (cascade to VendorContract)"

      - from: CITED
        to: DELINQUENT
        trigger: "POST /_escalation/sweep (system, once past deadline)"
        actor: system
        preconditions:
          - "citation.status == CITED"
          - "current logical clock > citation.due_at_utc + Program.response_window_days (past the delinquency deadline = due + one more window)"
        side_effects:
          - "citation.status = DELINQUENT"
          - "citation.escalation_stage = DELINQUENT"
          - "citation.adjudicated_amount_cents unchanged; a late fee applies to amount_owed_total via escalation"
          - "append a NoticeRecord{notice_type=DELINQUENT, registered_owner_id, issued_at_clock=now, amount_owed_snapshot_cents=amount_owed_total} (audit log)"

      - from: ADJUDICATED_UPHELD
        to: DELINQUENT
        trigger: "POST /_escalation/sweep (system, once past deadline)"
        actor: system
        preconditions:
          - "citation.status == ADJUDICATED_UPHELD"
          - "current logical clock > citation.due_at_utc + Program.response_window_days"
        side_effects:
          - "citation.status = DELINQUENT"
          - "citation.escalation_stage = DELINQUENT"
          - "append a NoticeRecord{notice_type=DELINQUENT, registered_owner_id, issued_at_clock=now, amount_owed_snapshot_cents=amount_owed_total} (audit log)"

      - from: DELINQUENT
        to: PAID
        trigger: "POST /citations/{id}/payments then payment clears"
        actor: system
        preconditions:
          - "citation.status == DELINQUENT"
          - "cumulative CLEARED payments >= amount_owed_total (adjudicated_amount_cents + late_fee_cents)"
        side_effects:
          - "citation.status = PAID"
          - "vendor share accrued via vendor_revenue_share calc (fine portion only; late fee excluded)"

      - from: CITED
        to: VOID
        trigger: "POST /citations/{id}/void"
        actor: ProgramAdmin
        preconditions:
          - "citation.status IN {PENDING_REVIEW, CITED, DELINQUENT}"
          - "no CLEARED payment exists against this citation"
        side_effects:
          - "citation.status = VOID"
          - "citation.adjudicated_amount_cents = 0"
          - "cascade: any SUBMITTED/SCHEDULED Contest -> WITHDRAWN; any SCHEDULED Hearing -> ADJOURNED (void cascade)"

  - entity: Contest
    initial_state: SUBMITTED
    terminal_states: [UPHELD, DISMISSED, WITHDRAWN]
    transitions:
      - from: SUBMITTED
        to: SCHEDULED
        trigger: "POST /contests/{id}/hearings"
        actor: ProgramAdmin
        preconditions: ["contest.status == SUBMITTED", "citation.status == CONTESTED"]
        side_effects: ["contest.status = SCHEDULED (see Citation CONTESTED->HEARING_SCHEDULED)"]
      - from: SCHEDULED
        to: UPHELD
        trigger: "POST /hearings/{hid}/rule with outcome=DISMISSED (contest upheld = citation dismissed)"
        actor: Adjudicator
        preconditions: ["contest.status == SCHEDULED"]
        side_effects: ["contest.status = UPHELD (bubbles from hearing ruling)"]
      - from: SCHEDULED
        to: DISMISSED
        trigger: "POST /hearings/{hid}/rule with outcome IN {UPHELD, REDUCED}"
        actor: Adjudicator
        preconditions: ["contest.status == SCHEDULED"]
        side_effects: ["contest.status = DISMISSED (bubbles from hearing ruling)"]
      - from: SUBMITTED
        to: WITHDRAWN
        trigger: "citation VOID cascade"
        actor: system
        preconditions: ["contest.status IN {SUBMITTED, SCHEDULED}"]
        side_effects: ["contest.status = WITHDRAWN"]

  - entity: Hearing
    initial_state: SCHEDULED
    terminal_states: [RULED]
    transitions:
      - from: SCHEDULED
        to: RULED
        trigger: "POST /hearings/{hid}/rule"
        actor: Adjudicator
        preconditions:
          - "hearing.status == SCHEDULED"
          - "adjudicator_ref (X-User-ID) != citation.review_officer_ref (segregation of duties)"
          - "current logical clock >= hearing.scheduled_at_utc"
        side_effects:
          - "hearing.status = RULED; hearing.outcome set (see Citation ruling transitions)"
      - from: SCHEDULED
        to: ADJOURNED
        trigger: "citation VOID cascade"
        actor: system
        preconditions: ["hearing.status == SCHEDULED"]
        side_effects: ["hearing.status = ADJOURNED"]

  - entity: Payment
    initial_state: INITIATED
    terminal_states: [CLEARED, FAILED, REVERSED]
    transitions:
      - from: INITIATED
        to: CLEARED
        trigger: "POST /_payments/settle with outcome=CLEARED"
        actor: system
        preconditions: ["payment.status == INITIATED"]
        side_effects:
          - "payment.status = CLEARED"
          - "citation.amount_paid_cents recomputed"
          - "if cumulative CLEARED >= amount_owed_total, citation -> PAID and vendor share accrues"
      - from: INITIATED
        to: FAILED
        trigger: "POST /_payments/settle with outcome=FAILED"
        actor: system
        preconditions: ["payment.status == INITIATED"]
        side_effects: ["payment.status = FAILED"]
      - from: CLEARED
        to: REVERSED
        trigger: "POST /payments/{id}/reverse"
        actor: ProgramAdmin
        preconditions: ["payment.status == CLEARED"]
        side_effects:
          - "payment.status = REVERSED"
          - "citation.amount_paid_cents recomputed (decreased)"
          - "compensation cascade: if citation was PAID, revert citation to prior owed state (ADJUDICATED_UPHELD if it had a ruling, else CITED) and de-accrue vendor share (VendorContract.accrued_vendor_share_cents decreased by the same share that was accrued)"

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: contest-create-stale-citation
    parent_entity: Citation
    write_endpoint: "POST /citations/{id}/contests"
    occ_field: "expected_citation_version"
    description: |
      Filing a Contest against a Citation whose version has advanced since the
      client last observed it is rejected on a stale-version check. This captures
      the case where the citation has already moved out of CITED (e.g., a review
      re-decision or an escalation sweep bumped its version and state) and the
      contesting owner's view is stale. A fresh contest on the same citation is
      legitimate product behavior until the citation leaves CITED, so this is a
      true stale-version conflict rather than a plain state precondition.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: hearing-rule-stale-hearing
    parent_entity: Hearing
    write_endpoint: "POST /hearings/{hid}/rule"
    occ_field: "expected_hearing_version"
    description: |
      Ruling on a Hearing whose version has advanced since the adjudicator last
      observed it is rejected on a stale-version check. This captures the case
      where the hearing was adjourned by a citation-void cascade (bumping its
      version) after the adjudicator loaded it, so the adjudicator's view is
      stale. Ruling is otherwise legitimate on a SCHEDULED hearing, so this is a
      true stale-version conflict.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: fine_schedule_statutory
    trigger: "Citation PENDING_REVIEW -> CITED (review APPROVE)"
    algorithm: threshold
    formula: |
      # Base fine depends on camera_type; SPEED uses tiered bands over (measured_speed - speed_limit).
      if camera.camera_type == RED_LIGHT:
          base = program.base_red_light_fine_cents
      else:  # SPEED
          over = citation.measured_speed_mph - camera.speed_limit_mph   # over > 0 guaranteed by validation
          # Tiered multiplier on program.base_speed_fine_cents (marginal band selection, not marginal-sum):
          if over <= 10:   band_mult = 1.0
          elif over <= 20: band_mult = 1.5   # 11..20 mph over
          else:            band_mult = 2.5   # 21+ mph over
          base = round_half_up(program.base_speed_fine_cents * band_mult)
      # Repeat-offender surcharge: count prior citations for the SAME registered_owner_id in this
      # Program with status IN {CITED, CONTESTED, HEARING_SCHEDULED, ADJUDICATED_UPHELD, PAID, DELINQUENT}
      # whose notice_issued_at_utc is within repeat_offender_window_days BEFORE this citation's
      # notice time (half-open: (now - window, now]). If count >= 1 -> repeat offense.
      if prior_count >= 1:
          base = round_half_up(base * (1 + program.repeat_offender_surcharge_pct))
      assessed = base + program.admin_fee_cents
      return assessed
    input_set: "Prior citations of the same registered_owner_id in-Program, statuses listed above, within repeat_offender_window_days measured from this citation's notice_issued_at_utc (half-open lower bound, inclusive upper bound)."
    constants:
      SPEED_BAND_1_MULT: 1.0
      SPEED_BAND_2_MULT: 1.5
      SPEED_BAND_3_MULT: 2.5
    precision: "cents integer; round_half_up when applying band multiplier and surcharge, each rounding applied independently in the order shown (band multiply-and-round, THEN surcharge multiply-and-round), never combined"
    variants: []

  - name: fine_schedule_adjudicated
    trigger: "Hearing rule with outcome=REDUCED (Citation HEARING_SCHEDULED -> ADJUDICATED_UPHELD)"
    algorithm: aggregation
    formula: |
      # Adjudicator sets a reduced FINE (excludes admin fee). Final owed re-adds admin fee.
      adjudicated = hearing.reduced_amount_cents + program.admin_fee_cents
      # No repeat surcharge re-applied; adjudicator's number is authoritative for the fine portion.
      return adjudicated
    input_set: "Single Hearing.reduced_amount_cents plus Program.admin_fee_cents; the pre-adjudication statutory surcharge is discarded."
    constants: {}
    precision: "cents integer; no rounding needed (integer addition)"
    variants:
      - name: statutory_at_issue
        when: "Citation reaches CITED, or hearing outcome UPHELD"
        difference: "adjudicated_amount_cents = assessed_amount_cents (statutory, includes surcharge)"
      - name: reduced_at_adjudication
        when: "hearing outcome REDUCED"
        difference: "adjudicated_amount_cents = reduced_amount_cents + admin_fee_cents; surcharge dropped -> strictly less than statutory for identical inputs"

  - name: amount_owed_total
    trigger: "Any payment settlement, escalation sweep, or citation read"
    algorithm: aggregation
    formula: |
      # Total the owner must pay to reach PAID, given current escalation.
      owed = citation.adjudicated_amount_cents
      if citation.escalation_stage == DELINQUENT:
          owed = owed + program.late_fee_cents          # single flat late penalty, applied once at the DELINQUENT stage
      # ADJUDICATED_DISMISSED / VOID have adjudicated_amount_cents == 0 -> owed 0
      return owed
    input_set: "Single citation's adjudicated_amount_cents plus at most one Program.late_fee_cents depending on escalation_stage."
    constants: {}
    precision: "cents integer"
    variants: []

  - name: vendor_revenue_share
    trigger: "Citation -> PAID (payment clears to full owed) and reversed on payment REVERSED compensation"
    algorithm: aggregation
    formula: |
      # Vendor share applies ONLY to the fine portion actually collected, never to admin_fee or late_fee.
      fine_portion = citation.adjudicated_amount_cents - program.admin_fee_cents   # >= 0
      raw_share = round_half_up(fine_portion * vendor_contract.revenue_share_pct)
      # Apply monthly_cap_cents if set: accrual cannot push accrued_vendor_share_cents above the cap.
      if vendor_contract.monthly_cap_cents is not None:
          headroom = max(0, vendor_contract.monthly_cap_cents - vendor_contract.accrued_vendor_share_cents)
          share = min(raw_share, headroom)
      else:
          share = raw_share
      # On PAID: accrued += share. On payment REVERSED that de-PAIDs the citation:
      # accrued -= (the exact share previously accrued for this citation), floored at 0.
      return share
    input_set: "One ACTIVE VendorContract of the citation's Program (a Program has exactly one ACTIVE VendorContract at a time; the most recently created ACTIVE one by created_at ASC if a stale ACTIVE exists). Fine portion = adjudicated_amount_cents - admin_fee_cents."
    constants: {}
    precision: "cents integer; round_half_up on the pct multiply; cap and floor applied after rounding"
    variants: []

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and X-User-Role is a known role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all except owner-portal endpoints which use portal PIN auth"

  - priority: 2
    category: auth
    check: "Owner-portal endpoints require a valid registered_owner_id + portal_access_pin match"
    error_id: ERR_PORTAL_AUTH_FAILED
    http_status: 401
    applies_to: "POST /citations/{id}/contests, GET /portal/citations, portal evidence reads"

  - priority: 3
    category: authz
    check: "Acting role is permitted for the operation per §1.7"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "all"

  - priority: 4
    category: authz
    check: "Segregation of duties: Adjudicator ruling a hearing must have X-User-ID != citation.review_officer_ref"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /hearings/{hid}/rule, POST /contests/{id}/hearings (adjudicator assignment)"

  - priority: 5
    category: existence
    check: "All path-referenced resources exist (Program, then Camera/Citation/Contest/Hearing/Payment), validated left-to-right"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all"

  - priority: 6
    category: existence
    check: "Body-referenced FK targets exist and belong to the same Program (camera_id on citation create; registered owner lookup target)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "POST /citations"

  - priority: 7
    category: state
    check: "Target resource is in a state where the requested transition is defined (per §1.2)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints"

  - priority: 8
    category: state
    check: "OCC: expected_<parent>_version matches current parent version on guarded writes"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST .../contests, POST .../hearings/{hid}/rule"

  - priority: 9
    category: business_safety
    check: "Review APPROVE requires the capturing Camera to have PASS calibration coverage at event time (a PASS CalibrationRecord with valid_until_utc > citation.event_at_utc and performed_at_utc <= event_at_utc)"
    error_id: ERR_CALIBRATION_LAPSED
    http_status: 422
    applies_to: "POST /citations/{id}/review (decision=APPROVE)"

  - priority: 10
    category: business_safety
    check: "Citation capture only permitted when Camera.status == ACTIVE at event handling; SPEED citation requires measured_speed_mph strictly greater than camera.speed_limit_mph"
    error_id: ERR_NO_VIOLATION
    http_status: 422
    applies_to: "POST /citations"

  - priority: 11
    category: business_referential
    check: "Owner lookup must resolve: a RegisteredOwner with plate_number == captured_plate_number must exist in this Program before a citation can be APPROVED/CITED"
    error_id: ERR_OWNER_LOOKUP_FAILED
    http_status: 422
    applies_to: "POST /citations/{id}/review (decision=APPROVE)"

  - priority: 12
    category: business_temporal
    check: "Contest must be filed on or before citation.due_at_utc (logical clock <= due_at_utc)"
    error_id: ERR_CONTEST_WINDOW_CLOSED
    http_status: 422
    applies_to: "POST /citations/{id}/contests"

  - priority: 13
    category: business_temporal
    check: "Hearing.scheduled_at_utc must be strictly after the current logical clock at scheduling time; ruling requires clock >= scheduled_at_utc"
    error_id: ERR_HEARING_TIME_INVALID
    http_status: 422
    applies_to: "POST /contests/{id}/hearings, POST /hearings/{hid}/rule"

  - priority: 14
    category: business_constraint
    check: "outcome=REDUCED requires reduced_amount_cents present and 0 < reduced_amount_cents < (assessed_amount_cents - admin_fee_cents)"
    error_id: ERR_INVALID_REDUCTION
    http_status: 422
    applies_to: "POST /hearings/{hid}/rule"

  - priority: 15
    category: business_constraint
    check: "SPEED camera requires speed_limit_mph present and > 0; RED_LIGHT camera requires speed_limit_mph absent/null; CalibrationRecord.valid_until_utc must be strictly after performed_at_utc"
    error_id: ERR_INVALID_REQUEST
    http_status: 422
    applies_to: "POST /cameras, POST /cameras/{id}/calibrations"

  - priority: 16
    category: business_constraint
    check: "intersection_code unique per Program among cameras with status != DECOMMISSIONED; plate_number unique per Program among RegisteredOwners"
    error_id: ERR_DUPLICATE
    http_status: 409
    applies_to: "POST /cameras, POST /owners"

  - priority: 17
    category: business_fiscal
    check: "Payment amount_cents must be > 0; payment cannot be initiated against a citation that owes 0 (VOID / ADJUDICATED_DISMISSED / already PAID)"
    error_id: ERR_NOTHING_OWED
    http_status: 422
    applies_to: "POST /citations/{id}/payments"

  - priority: 18
    category: business_fiscal
    check: "Void rejected when a CLEARED payment exists against the citation"
    error_id: ERR_PAYMENT_EXISTS
    http_status: 409
    applies_to: "POST /citations/{id}/void"

  - priority: 19
    category: business_referential
    check: "Body missing a required input field, or a required-field constraint (type/enum) violated"
    error_id: ERR_INVALID_REQUEST
    http_status: 422
    applies_to: "all create/action endpoints"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---- Program ----
  - { method: POST, path: "/programs", description: "Create an enforcement program", roles: [SystemAdmin], code: 201, input: [jurisdiction_name, base_red_light_fine_cents, base_speed_fine_cents, admin_fee_cents, late_fee_cents, "response_window_days?", "repeat_offender_window_days?", "repeat_offender_surcharge_pct?"], output: Program, side_effects: [] }
  - { method: GET, path: "/programs/{pid}", description: "Get a program", roles: [SystemAdmin, ProgramAdmin, ReviewOfficer, Adjudicator, Auditor], code: 200, input: [], output: Program, side_effects: [] }
  - { method: GET, path: "/programs", description: "List programs (paginated)", roles: [SystemAdmin, Auditor], code: 200, input: ["limit?", "offset?"], output: "Program[]", side_effects: [] }

  # ---- Camera ----
  - { method: POST, path: "/cameras", description: "Register a camera under a program", roles: [ProgramAdmin], code: 201, input: [program_id, intersection_code, camera_type, "speed_limit_mph?"], output: Camera, side_effects: ["camera.status = ACTIVE"] }
  - { method: GET, path: "/cameras/{id}", description: "Get a camera", roles: [ProgramAdmin, ReviewOfficer, Auditor], code: 200, input: [], output: Camera, side_effects: [] }
  - { method: GET, path: "/cameras", description: "List cameras, filterable by program (reverse-reachability for Camera.program_id)", roles: [ProgramAdmin, ReviewOfficer, Auditor], code: 200, input: ["program_id?", "camera_type?", "status?", "limit?", "offset?"], output: "Camera[]", side_effects: [] }
  - { method: POST, path: "/cameras/{id}/suspend", description: "Suspend a camera", roles: [ProgramAdmin], code: 200, input: [], output: Camera, side_effects: ["camera.status = SUSPENDED"] }
  - { method: POST, path: "/cameras/{id}/reactivate", description: "Reactivate a suspended camera", roles: [ProgramAdmin], code: 200, input: [], output: Camera, side_effects: ["camera.status = ACTIVE"] }
  - { method: POST, path: "/cameras/{id}/decommission", description: "Decommission a camera", roles: [ProgramAdmin], code: 200, input: [], output: Camera, side_effects: ["camera.status = DECOMMISSIONED"] }

  # ---- CalibrationRecord ----
  - { method: POST, path: "/cameras/{id}/calibrations", description: "Log a calibration/certification record", roles: [ProgramAdmin], code: 201, input: [performed_at_utc, valid_until_utc, technician_ref, result, "notes?"], output: CalibrationRecord, side_effects: ["camera.certified_until_clock recomputed to latest PASS valid_until_utc"] }
  - { method: GET, path: "/cameras/{id}/calibrations", description: "List calibration records for a camera (reverse-reachability for CalibrationRecord.camera_id)", roles: [ProgramAdmin, ReviewOfficer, Auditor], code: 200, input: ["result?", "limit?", "offset?"], output: "CalibrationRecord[]", side_effects: [] }

  # ---- RegisteredOwner ----
  - { method: POST, path: "/owners", description: "Register a plate owner under a program (mints portal_access_pin)", roles: [ProgramAdmin], code: 201, input: [program_id, plate_number, full_name, mailing_address], output: RegisteredOwner, side_effects: ["owner.portal_access_pin minted"] }
  - { method: GET, path: "/owners/{id}", description: "Get a registered owner", roles: [ProgramAdmin, Auditor], code: 200, input: [], output: RegisteredOwner, side_effects: [] }
  - { method: GET, path: "/owners", description: "List/search registered owners, filterable by program (reverse-reachability for RegisteredOwner.program_id)", roles: [ProgramAdmin, Auditor], code: 200, input: ["program_id?", "plate_number?", "limit?", "offset?"], output: "RegisteredOwner[]", side_effects: [] }

  # ---- Citation ----
  - { method: POST, path: "/citations", description: "Capture a violation event under a program (creates citation in PENDING_REVIEW)", roles: [ReviewOfficer, ProgramAdmin], code: 201, input: [program_id, camera_id, captured_plate_number, event_at_utc, "measured_speed_mph?"], output: Citation, side_effects: ["citation.status = PENDING_REVIEW"] }
  - { method: GET, path: "/citations/{id}", description: "Get a citation (computed amount_owed_total surfaced)", roles: [ProgramAdmin, ReviewOfficer, Adjudicator, Auditor], code: 200, input: [], output: Citation, side_effects: [] }
  - { method: GET, path: "/citations", description: "List citations, filterable (reverse-reachability for Citation.program_id, camera_id, registered_owner_id)", roles: [ProgramAdmin, ReviewOfficer, Adjudicator, Auditor], code: 200, input: ["program_id?", "camera_id?", "registered_owner_id?", "status?", "limit?", "offset?"], output: "Citation[]", side_effects: [] }
  - { method: POST, path: "/citations/{id}/review", description: "Review officer approves or rejects a pending citation (owner lookup + notice on APPROVE)", roles: [ReviewOfficer], code: 200, input: [decision], output: Citation, side_effects: ["APPROVE: owner lookup, notice issued, assessed_amount computed, status=CITED", "REJECT: status=REJECTED"] }
  - { method: POST, path: "/citations/{id}/void", description: "Void a citation (cascades to contest/hearing)", roles: [ProgramAdmin], code: 200, input: [], output: Citation, side_effects: ["status=VOID", "adjudicated_amount_cents=0", "cascade contests->WITHDRAWN, hearings->ADJOURNED"] }

  # ---- Contest (owner portal + admin) ----
  - { method: POST, path: "/citations/{id}/contests", description: "Registered owner files a contest via portal (OCC-guarded on citation)", roles: [RegisteredOwner], code: 201, input: [registered_owner_id, portal_access_pin, ground, statement, expected_citation_version], output: Contest, side_effects: ["citation.status=CONTESTED", "increments Citation.version by 1", "Contest created SUBMITTED"] }
  - { method: GET, path: "/citations/{id}/contests", description: "List contests of a citation (reverse-reachability for Contest.citation_id)", roles: [ProgramAdmin, Adjudicator, Auditor], code: 200, input: ["status?", "limit?", "offset?"], output: "Contest[]", side_effects: [] }
  - { method: GET, path: "/contests/{id}", description: "Get a contest", roles: [ProgramAdmin, Adjudicator, Auditor], code: 200, input: [], output: Contest, side_effects: [] }
  - { method: GET, path: "/owners/{id}/contests", description: "List contests filed by an owner (reverse-reachability for Contest.submitted_by_owner_id)", roles: [ProgramAdmin, Auditor], code: 200, input: ["status?", "limit?", "offset?"], output: "Contest[]", side_effects: [] }

  # ---- Hearing ----
  - { method: POST, path: "/contests/{id}/hearings", description: "Schedule a hearing and assign an adjudicator (SoD enforced)", roles: [ProgramAdmin], code: 201, input: [scheduled_at_utc, adjudicator_ref], output: Hearing, side_effects: ["citation.status=HEARING_SCHEDULED", "contest.status=SCHEDULED", "Hearing created SCHEDULED"] }
  - { method: GET, path: "/contests/{id}/hearings", description: "List hearings for a contest (reverse-reachability for Hearing.contest_id)", roles: [ProgramAdmin, Adjudicator, Auditor], code: 200, input: ["status?", "limit?", "offset?"], output: "Hearing[]", side_effects: [] }
  - { method: GET, path: "/hearings/{hid}", description: "Get a hearing", roles: [ProgramAdmin, Adjudicator, Auditor], code: 200, input: [], output: Hearing, side_effects: [] }
  - { method: GET, path: "/citations/{id}/hearings", description: "List hearings for a citation (reverse-reachability for Hearing.citation_id)", roles: [ProgramAdmin, Adjudicator, Auditor], code: 200, input: ["status?", "limit?", "offset?"], output: "Hearing[]", side_effects: [] }
  - { method: POST, path: "/hearings/{hid}/rule", description: "Adjudicator rules on a hearing (OCC-guarded on hearing)", roles: [Adjudicator], code: 200, input: [outcome, "reduced_amount_cents?", expected_hearing_version], output: Hearing, side_effects: ["hearing.status=RULED", "increments Hearing.version by 1", "citation adjudication + amount recompute", "contest resolution"] }

  # ---- Payment ----
  - { method: POST, path: "/citations/{id}/payments", description: "Initiate a payment against a citation", roles: [ProgramAdmin, RegisteredOwner], code: 201, input: [amount_cents, method, "registered_owner_id?", "portal_access_pin?"], output: Payment, side_effects: ["Payment created INITIATED"] }
  - { method: GET, path: "/citations/{id}/payments", description: "List payments for a citation (reverse-reachability for Payment.citation_id)", roles: [ProgramAdmin, Auditor, RegisteredOwner], code: 200, input: ["status?", "limit?", "offset?"], output: "Payment[]", side_effects: [] }
  - { method: POST, path: "/payments/{id}/reverse", description: "Reverse a cleared payment (compensation cascade)", roles: [ProgramAdmin], code: 200, input: [], output: Payment, side_effects: ["payment.status=REVERSED", "citation de-PAID compensation", "vendor share de-accrued"] }

  # ---- VendorContract ----
  - { method: POST, path: "/vendor-contracts", description: "Create a vendor contract under a program (revenue share)", roles: [ProgramAdmin], code: 201, input: [program_id, vendor_name, revenue_share_pct, "monthly_cap_cents?"], output: VendorContract, side_effects: ["status=ACTIVE"] }
  - { method: GET, path: "/vendor-contracts", description: "List vendor contracts, filterable by program (reverse-reachability for VendorContract.program_id)", roles: [ProgramAdmin, Auditor], code: 200, input: ["program_id?", "status?", "limit?", "offset?"], output: "VendorContract[]", side_effects: [] }
  - { method: GET, path: "/vendor-contracts/{id}", description: "Get a vendor contract (accrued_vendor_share_cents surfaced for audit)", roles: [ProgramAdmin, Auditor], code: 200, input: [], output: VendorContract, side_effects: [] }
  - { method: POST, path: "/vendor-contracts/{id}/terminate", description: "Terminate a vendor contract", roles: [ProgramAdmin], code: 200, input: [], output: VendorContract, side_effects: ["status=TERMINATED"] }

  # ---- NoticeRecord (append-only audit log) ----
  - { method: GET, path: "/citations/{id}/notices", description: "List notice/audit records for a citation (reverse-reachability for NoticeRecord.citation_id)", roles: [ProgramAdmin, Auditor], code: 200, input: ["notice_type?", "limit?", "offset?"], output: "NoticeRecord[]", side_effects: [] }
  - { method: GET, path: "/owners/{id}/notices", description: "List notice/audit records mailed to an owner (reverse-reachability for NoticeRecord.registered_owner_id)", roles: [ProgramAdmin, Auditor], code: 200, input: ["notice_type?", "limit?", "offset?"], output: "NoticeRecord[]", side_effects: [] }

  # ---- Owner portal reads ----
  - { method: GET, path: "/portal/citations", description: "Owner views own citations + evidence via portal PIN auth", roles: [RegisteredOwner], code: 200, input: [registered_owner_id, portal_access_pin, "status?", "limit?", "offset?"], output: "Citation[]", side_effects: [] }

  # ---- Test-driving endpoints (logical clock, payment settlement, escalation sweep) ----
  - { method: POST, path: "/_clock/set_current_utc", description: "Set the server logical clock. Startup default is 2026-05-01T00:00:00Z; before any set call the clock reads exactly this default and never falls back to wall-clock.", roles: [SystemAdmin], code: 200, input: [to_iso8601], output: null, side_effects: ["logical clock set"] }
  - { method: POST, path: "/_payments/settle", description: "Settle an initiated payment to CLEARED or FAILED (simulates processor callback)", roles: [SystemAdmin], code: 200, input: [payment_id, outcome], output: Payment, side_effects: ["payment.status=CLEARED|FAILED", "on CLEARED to full owed: citation->PAID + vendor share accrues"] }
  - { method: POST, path: "/_escalation/sweep", description: "Advance escalation for all citations past their delinquency deadline relative to the logical clock", roles: [SystemAdmin], code: 200, input: ["program_id?"], output: null, side_effects: ["CITED/ADJUDICATED_UPHELD past due+response_window_days -> DELINQUENT (late fee enters amount_owed_total; DELINQUENT NoticeRecord appended)"] }

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing/unknown X-User-Role or X-User-ID on a role-guarded endpoint" }
  - { id: ERR_PORTAL_AUTH_FAILED, http: 401, condition: "Owner-portal call with wrong registered_owner_id / portal_access_pin pair" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Role not permitted for the operation per RBAC" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "Adjudicator ruling/assigned equals the citation's review_officer_ref" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path or body-referenced resource does not exist or is outside the Program" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Requested transition not defined from the resource's current state" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_<parent>_version does not match current parent version" }
  - { id: ERR_DUPLICATE, http: 409, condition: "intersection_code (non-decommissioned) or plate_number uniqueness violated within Program" }
  - { id: ERR_PAYMENT_EXISTS, http: 409, condition: "Void attempted while a CLEARED payment exists on the citation" }
  - { id: ERR_CALIBRATION_LAPSED, http: 422, condition: "Review APPROVE without PASS calibration coverage at citation.event_at_utc" }
  - { id: ERR_NO_VIOLATION, http: 422, condition: "Capture on non-ACTIVE camera, or SPEED capture with measured_speed_mph <= speed_limit_mph" }
  - { id: ERR_OWNER_LOOKUP_FAILED, http: 422, condition: "No RegisteredOwner with matching plate_number in Program at review APPROVE" }
  - { id: ERR_CONTEST_WINDOW_CLOSED, http: 422, condition: "Contest filed after citation.due_at_utc" }
  - { id: ERR_HEARING_TIME_INVALID, http: 422, condition: "Hearing scheduled not strictly in the future, or ruled before scheduled_at_utc" }
  - { id: ERR_INVALID_REDUCTION, http: 422, condition: "outcome=REDUCED with missing/out-of-range reduced_amount_cents" }
  - { id: ERR_NOTHING_OWED, http: 422, condition: "Payment against a citation that owes 0, or amount_cents <= 0" }
  - { id: ERR_INVALID_REQUEST, http: 422, condition: "Missing required field or invalid type/enum/constraint (incl. camera speed_limit rule, calibration date order)" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: SystemAdmin
    description: "Platform operator; creates programs and drives test/simulation endpoints (clock, payment settle, escalation sweep)."
    identity: "opaque"
    exclusive_operations:
      - "POST /programs"
      - "POST /_clock/set_current_utc"
      - "POST /_payments/settle"
      - "POST /_escalation/sweep"
    shared_operations:
      - "GET /programs"
      - "GET /programs/{pid}"

  - name: ProgramAdmin
    description: "Runs a jurisdiction's program: cameras, calibrations, owners, hearing scheduling, void, payment reversal, vendor contracts."
    identity: "opaque"
    exclusive_operations:
      - "POST /cameras and lifecycle (suspend/reactivate/decommission)"
      - "POST /cameras/{id}/calibrations"
      - "POST /owners"
      - "POST /citations/{id}/void"
      - "POST /contests/{id}/hearings"
      - "POST /payments/{id}/reverse"
      - "POST /vendor-contracts and terminate"
    shared_operations:
      - "POST /citations (capture, shared with ReviewOfficer)"
      - "POST /citations/{id}/payments (shared with RegisteredOwner)"
      - "GET reads on program resources"

  - name: ReviewOfficer
    description: "Reviews captured evidence; approves (issues notice) or rejects citations. Cannot later adjudicate the same citation (SoD)."
    identity: "opaque"
    exclusive_operations:
      - "POST /citations/{id}/review"
    shared_operations:
      - "POST /citations (capture)"
      - "GET reads on cameras/citations/calibrations"

  - name: Adjudicator
    description: "Rules on hearings. Segregation of duties: cannot rule a citation they reviewed."
    identity: "opaque"
    exclusive_operations:
      - "POST /hearings/{hid}/rule"
    shared_operations:
      - "GET reads on citations/contests/hearings"

  - name: RegisteredOwner
    description: "Vehicle owner; authenticates via portal PIN. Files contests, pays fines, views own citations/evidence."
    identity: "entity_backed:RegisteredOwner"
    exclusive_operations:
      - "POST /citations/{id}/contests"
      - "GET /portal/citations"
    shared_operations:
      - "POST /citations/{id}/payments (shared with ProgramAdmin)"
      - "GET /citations/{id}/payments (own)"

  - name: Auditor
    description: "Read-only oversight of the entire program including vendor revenue share accrual."
