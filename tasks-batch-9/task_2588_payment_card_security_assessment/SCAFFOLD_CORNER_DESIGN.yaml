            - "The first attest returns HTTP 422 with ${err_signature} == ERR_ATTESTATION_SIGNATURE_MISMATCH; RocReport.${roc_id}.status stays QA_APPROVED, attesting_assessor_id and attested_at stay null"
            - "ScanCycle.${cycle_id}.status == PASSING with effective_high_finding_count == 0, so Engagement.${eng_id}.quarterly_scan_compliant == true and ERR_NO_PASSING_SCAN never fires"
            - "The second attest returns HTTP 200: status == ATTESTED, attestation_signature_name == 'Dana Reyes', attesting_assessor_id == ${lead_id}, attested_at == 2026-08-01T00:00:00Z"
            - "After the second attest Engagement.${eng_id}.status == ATTESTED, attested_at == 2026-08-01T00:00:00Z and posture == FROZEN"
            - "The submission returns HTTP 200: RocReport.${roc_id}.status == SUBMITTED, submitted_to == ACQUIRER, submission_reference == 'FCB-2026-00841'"
            - "After the submission Engagement.${eng_id}.status == SUBMITTED and reassessment_due_date == 2027-08-01 (clock date plus 365 days)"
            - "The first reassessment-plan call returns HTTP 422 with ${err_year} == ERR_INVALID_REASSESSMENT_YEAR (2028 is not assessment_year + 1) and leaves next_assessment_start_date null"
            - "The second reassessment-plan call returns HTTP 200: Engagement.${eng_id}.status == REASSESSMENT_PLANNED and next_assessment_start_date == 2027-06-01"
            - "RocReport.${roc_id}.compliance_result == COMPLIANT with as_found_compliance_percentage == 100.00, as_attested_compliance_percentage == 100.00 and revision_count == 0"

      - name: validation_stale_version_outranks_the_budget_ceiling
        claim_type: Priority Ordering
        grounds:
          - validations[priority=10]
          - validations[priority=14]
        excluded_because:
          difficulty_instance: stale_engagement_version_412_beats_budget_exceeded_422
          rationale: "That §1.8 instance violates the priority-10 OCC rule and the priority-14 budget ceiling in one request and asserts the 412 wins, then repairs only the version to show the 422 underneath."

      - name: validation_independence_outranks_lapsed_certification
        claim_type: Priority Ordering
        grounds:
          - validations[priority=11]
          - validations[priority=12]
        excluded_because:
          difficulty_instance: independence_violation_beats_lapsed_certification_on_qa_review
          rationale: "That instance makes the QA reviewer both an evidence collector and certification-lapsed on the same qa-review call and asserts ERR_INDEPENDENCE_VIOLATION, then clears independence to expose ERR_ASSESSOR_CERTIFICATION_EXPIRED."

  # ---------------------------------------------------------------------------
  # Section 5 — Endpoints (Table 6 claim types)
  # ---------------------------------------------------------------------------
  - section: endpoints
    instances:

      - name: endpoint_patch_assessor_is_a_partial_update_that_reprojects_certification
        claim_type: Standard CRUD
        grounds:
          - endpoints[PATCH /assessors/{id}]
          - entities.Assessor.fields.certification_status
          - entities.Assessor.fields.version
        distinguishing_aspect: "Every input on this endpoint is optional, so the update must be genuinely partial: a body carrying only certification_expires_at must leave full_name, email, qa_qualified and status untouched while re-deriving certification_status against the clock and bumping version by exactly 1. An implementation that treats absent keys as null blanks the record."
        test_recipe:
          setup:
            - "Assessor Kim Vance exists with email kim.vance@qsa.example, certification_expires_at 2027-06-30T00:00:00Z, qa_qualified true, status ACTIVE and version 1; the clock stands at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /assessors"
              payload: { full_name: "Kim Vance", email: "kim.vance@qsa.example", certification_expires_at: "2027-06-30T00:00:00Z", qa_qualified: true }
              as: PlatformAdmin
              captures: { qa_id: $.data.id, qa_v1: $.data.version }
          trigger:
            - call: "PATCH /assessors/${qa_id}"
              payload: { certification_expires_at: "2026-07-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { qa_v2: $.data.version }
            - call: "PATCH /assessors/${qa_id}"
              payload: { status: "SUSPENDED" }
              as: PlatformAdmin
              captures: { qa_v3: $.data.version }
            - call: "GET /assessors/${qa_id}"
              payload: {}
              as: PlatformAdmin
          assert:
            - "The first PATCH returns HTTP 200 with certification_expires_at == 2026-07-01T00:00:00Z and certification_status == EXPIRED (the new date precedes the 2026-08-01 clock)"
            - "After the first PATCH full_name is still 'Kim Vance', email is still 'kim.vance@qsa.example', qa_qualified is still true and status is still ACTIVE"
            - "${qa_v2} == ${qa_v1} + 1 and ${qa_v3} == ${qa_v2} + 1 - one increment per accepted PATCH"
            - "The second PATCH sets status == SUSPENDED and leaves certification_expires_at == 2026-07-01T00:00:00Z and certification_status == EXPIRED"
            - "The final GET returns the same row: id == ${qa_id}, version == ${qa_v3}, status == SUSPENDED, certification_status == EXPIRED"
            - "GET /assessors?status=SUSPENDED returns total_count 1 and GET /assessors?certification_status=EXPIRED returns total_count 1"
            - "GET /assessors?qa_qualified=true still returns this row - the two PATCH bodies never mentioned qa_qualified"

