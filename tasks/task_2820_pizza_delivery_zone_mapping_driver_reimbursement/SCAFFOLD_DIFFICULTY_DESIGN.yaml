  - rule_id: compensating_invariant
    instances:

      - name: safe_drop_void_restores_the_cash_conservation_identity
        grounds:
          - calculations.driver_cash_position
          - entities.Driver.fields.cash_on_hand_cents
          - state_machines.SafeDrop.RECORDED_to_VOIDED
          - entities.Store.fields.cash_collected_total_cents
          - entities.Store.fields.safe_deposit_total_cents
          - endpoints.GET_store_cash_reconciliation
        distinguishing_aspect: |
          The invariant is cash_collected_total_cents == safe_deposit_total_cents
          + sum(Driver.cash_on_hand_cents), and it must hold at THREE successive
          checkpoints with the money in three different places: on the driver
          after the door (2900 / 0 / 2900), in the safe after the drop
          (2900 / 2900 / 0), and back on the driver after the void
          (2900 / 0 / 2900). The void is the compensating action: it must reverse
          the drop's effect on BOTH aggregates without disturbing
          cash_collected_total_cents, which is derived from delivered stops and
          must never move. An implementation that decrements collections on the
          void, or that leaves the voided drop inside safe_deposit_total_cents,
          breaks the identity.
        test_recipe:
          setup:
            - "A store with cash_limit_cents 5000 and the ceiling-40 zone model, one IN_ZONE address at grid 3.00 miles, a CAR cost model and one QUALIFIED insured CAR driver."
            - "A CASH order of total 2900 delivered on a one-stop dispatch at 12:36:00Z, so the driver holds 2900 and the safe holds 0."
