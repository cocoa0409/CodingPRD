  - section: endpoints
    instances:
      - name: the_applicant_read_recomputes_every_conduct_mirror_from_a_mixed_event_stream
        claim_type: computed_read
        grounds:
          - endpoints.GET_/applicants/{id}
          - calculations.no_show_ratio_pct
          - entities.Applicant.fields.scheduled_trip_count_90d
          - endpoints.POST_/trip-events/{id}/excuse
        distinguishing_aspect: "GET /applicants/{id} is a pure computed read over five events of five different types: only NO_SHOW and LATE_CANCEL score (2 + 1 == 3 points, 2 chargeable misses) while COMPLETED, CANCEL_IN_ADVANCE and AGENCY_FAULT_NO_SHOW score zero yet still count in the denominator (5), giving 40.0 percent; excusing the NO_SHOW re-derives every mirror in one step to 1 point, 1 miss, an unchanged denominator of 5 and 20.0 percent."
        test_recipe:
          setup:
            - "clock 2026-08-01T00:00:00Z; one applicant with five trip events dated 2026-07-05..2026-07-09 (all inside the 2026-05-05..2026-08-01 conduct window)"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: AccessibilityOfficeAdmin
            - call: "POST /applicants"
              payload: { full_name: "Rosa Delacroix", date_of_birth: "1978-08-08", residence_zone: "IN_SERVICE_AREA", mobility_aid: "NONE" }
              as: IntakeClerk
              captures: { rider_id: $.data.id }
            - call: "POST /trip-events"
              payload: { applicant_id: "${rider_id}", trip_date: "2026-07-05", event_type: "NO_SHOW" }
              as: ConductOfficer
              as_user_id: "co-1"
              captures: { ev_noshow: $.data.id, noshow_points: $.data.points_assessed }
            - call: "POST /trip-events"
              payload: { applicant_id: "${rider_id}", trip_date: "2026-07-06", event_type: "LATE_CANCEL" }
              as: ConductOfficer
              as_user_id: "co-1"
              captures: { late_points: $.data.points_assessed }
            - call: "POST /trip-events"
              payload: { applicant_id: "${rider_id}", trip_date: "2026-07-07", event_type: "COMPLETED" }
              as: ConductOfficer
              as_user_id: "co-1"
            - call: "POST /trip-events"
              payload: { applicant_id: "${rider_id}", trip_date: "2026-07-08", event_type: "CANCEL_IN_ADVANCE" }
              as: ConductOfficer
              as_user_id: "co-1"
            - call: "POST /trip-events"
              payload: { applicant_id: "${rider_id}", trip_date: "2026-07-09", event_type: "AGENCY_FAULT_NO_SHOW" }
              as: ConductOfficer
              as_user_id: "co-1"
              captures: { agency_points: $.data.points_assessed }
          trigger:
            - call: "GET /applicants/${rider_id}"
              payload: {}
              as: ConductOfficer
              captures: { pts: $.data.no_show_points_event_basis, misses: $.data.chargeable_miss_count_90d, sched: $.data.scheduled_trip_count_90d, ratio: $.data.no_show_ratio_pct, svc: $.data.service_status }
            - call: "POST /trip-events/${ev_noshow}/excuse"
