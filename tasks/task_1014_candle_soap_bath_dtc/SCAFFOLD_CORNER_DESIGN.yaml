# =============================================================================
# 1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Task 1014 — breadth probe over §1.1–§1.7 beyond the nine Difficulty Rules.
# =============================================================================
scaffold_corner_design:

  # ---------------------------------------------------------------------------
  - section: entities
    instances:
      - name: product_create_returns_201_with_fields
        claim_type: creation
        grounds: [entities.Product, endpoints]
        distinguishing_aspect: "POST /products with all required fields returns 201 and echoes product_type, collection_name, scent_family, title plus a server-minted id."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - { call: "POST /products", payload: { product_type: "BATH_BOMB", collection_name: "Spa", scent_family: "FLORAL", title: "Rose Bomb" }, as: MerchOps, captures: { p1: "$.data.id" } }
          assert:
            - "response HTTP status == 201"
            - "Product.${p1}.product_type == BATH_BOMB"
            - "Product.${p1}.version == 1"

      - name: sku_requires_safety_label_computed
        claim_type: computed_fields
        grounds: [entities.Sku.fields.requires_safety_label, entities.Product.fields.product_type]
        distinguishing_aspect: "requires_safety_label is computed true for a CANDLE parent and false for a SOAP parent; any client-supplied value is ignored."
        test_recipe:
          setup: ["One CANDLE product and one SOAP product."]
          setup_api_calls:
            - { call: "POST /products", payload: { product_type: "CANDLE", collection_name: "Wax", scent_family: "WOODY", title: "Candle" }, as: MerchOps, captures: { pc: "$.data.id" } }
            - { call: "POST /products", payload: { product_type: "SOAP", collection_name: "Bar", scent_family: "CITRUS", title: "Soap" }, as: MerchOps, captures: { ps: "$.data.id" } }
            - { call: "POST /products/${pc}/skus", payload: { size: "MEDIUM", scent: "Amber", list_price_cents: 3000 }, as: MerchOps, captures: { sc: "$.data.id" } }
            - { call: "POST /products/${ps}/skus", payload: { size: "SMALL", scent: "Lemon", list_price_cents: 900 }, as: MerchOps, captures: { ss: "$.data.id" } }
          trigger:
            - { call: "GET /skus/${sc}", payload: {}, as: MerchOps }
            - { call: "GET /skus/${ss}", payload: {}, as: MerchOps }
          assert:
            - "Sku.${sc}.requires_safety_label == true"
            - "Sku.${ss}.requires_safety_label == false"

      - name: order_type_defaults_retail
        claim_type: defaults
        grounds: [entities.Order.fields.order_type]
        distinguishing_aspect: "Omitting order_type on order creation applies the default RETAIL."
        test_recipe:
          setup: ["One customer."]
          setup_api_calls:
            - { call: "POST /customers", payload: { email: "def@x.com", full_name: "Def" }, as: PlatformAdmin, captures: { c1: "$.data.id" } }
          trigger:
            - { call: "POST /customers/${c1}/orders", payload: {}, as: Customer, as_user_id: "${c1}", captures: { o1: "$.data.id" } }
          assert:
            - "response HTTP status == 201"
            - "Order.${o1}.order_type == RETAIL"

      - name: get_order_nonexistent_returns_not_found
        claim_type: not_found
        grounds: [endpoints, "errors[ERR_ORDER_NOT_FOUND]"]
        distinguishing_aspect: "GET /orders/{id} with a non-existent UUID returns ERR_ORDER_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - { call: "GET /orders/00000000-0000-4000-8000-000000000000", payload: {}, as: MerchOps, captures: { err: "$.data.error_id" } }
          assert:
            - "response HTTP status == 404"
            - "error_id == ERR_ORDER_NOT_FOUND"

      - name: create_sku_missing_required_list_price
        claim_type: required_fields
        grounds: [entities.Sku.fields.list_price_cents, "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "POST /products/{id}/skus without list_price_cents returns ERR_VALIDATION (400)."
        test_recipe:
          setup: ["One product."]
          setup_api_calls:
            - { call: "POST /products", payload: { product_type: "SOAP", collection_name: "Req", scent_family: "CITRUS", title: "Req" }, as: MerchOps, captures: { p1: "$.data.id" } }
          trigger:
            - { call: "POST /products/${p1}/skus", payload: { size: "SMALL", scent: "Lime" }, as: MerchOps, captures: { err: "$.data.error_id" } }
          assert:
            - "response HTTP status == 400"
            - "error_id == ERR_VALIDATION"

      - name: list_skus_by_product_reverse_lookup
        claim_type: listing
        grounds: [entities.Sku.fields.product_id, endpoints]
        distinguishing_aspect: "GET /skus?product_id returns only that product's skus as an array with pagination metadata (reverse lookup for Sku.product_id)."
        test_recipe:
          setup: ["One product with two skus."]
          setup_api_calls:
            - { call: "POST /products", payload: { product_type: "SOAP", collection_name: "Lst", scent_family: "CITRUS", title: "Lst" }, as: MerchOps, captures: { p1: "$.data.id" } }
            - { call: "POST /products/${p1}/skus", payload: { size: "SMALL", scent: "A", list_price_cents: 500 }, as: MerchOps }
            - { call: "POST /products/${p1}/skus", payload: { size: "LARGE", scent: "B", list_price_cents: 700 }, as: MerchOps }
          trigger:
            - { call: "GET /skus", payload: { product_id: "${p1}" }, as: MerchOps }
          assert:
            - "response HTTP status == 200"
            - "data is an array of length 2; total_count == 2; has_more == false"

  # ---------------------------------------------------------------------------
  - section: state_machines
    instances:
      - name: batch_label_then_release_valid
        claim_type: valid_transition
        grounds: [state_machines.Batch.CREATED_to_LABELED, state_machines.Batch.LABELED_to_RELEASED]
        distinguishing_aspect: "A CREATED batch labels (is_safety_labeled true, status LABELED) then releases (status RELEASED)."
        test_recipe:
          setup: ["A soap sku with a CREATED batch."]
          setup_api_calls:
            - { call: "POST /products", payload: { product_type: "SOAP", collection_name: "Vt", scent_family: "WOODY", title: "Vt" }, as: MerchOps, captures: { p1: "$.data.id" } }
            - { call: "POST /products/${p1}/skus", payload: { size: "MEDIUM", scent: "Vt", list_price_cents: 1000 }, as: MerchOps, captures: { s1: "$.data.id" } }
            - { call: "POST /skus/${s1}/batches", payload: { quantity_produced: 10, line_code: "VL1", cure_starts_at: "2026-06-01T00:00:00Z", cure_ends_at: "2026-06-05T00:00:00Z" }, as: MerchOps, captures: { b1: "$.data.id" } }
          trigger:
            - { call: "POST /batches/${b1}/label", payload: {}, as: MerchOps }
            - { call: "POST /batches/${b1}/release", payload: {}, as: MerchOps }
          assert:
            - "Batch.${b1}.is_safety_labeled == true"
            - "Batch.${b1}.status == RELEASED"

      - name: release_recalled_batch_invalid
        claim_type: invalid_transitions
        grounds: [state_machines.Batch.RELEASED_to_RECALLED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Releasing a RECALLED (terminal) batch returns ERR_INVALID_STATE; no state change."
        test_recipe:
          setup: ["A released batch that is then recalled (no lines)."]
          setup_api_calls:
            - { call: "POST /products", payload: { product_type: "SOAP", collection_name: "Rc", scent_family: "WOODY", title: "Rc" }, as: MerchOps, captures: { p1: "$.data.id" } }
            - { call: "POST /products/${p1}/skus", payload: { size: "MEDIUM", scent: "Rc", list_price_cents: 1000 }, as: MerchOps, captures: { s1: "$.data.id" } }
            - { call: "POST /skus/${s1}/batches", payload: { quantity_produced: 10, line_code: "RCL", cure_starts_at: "2026-06-01T00:00:00Z", cure_ends_at: "2026-06-05T00:00:00Z" }, as: MerchOps, captures: { b1: "$.data.id" } }
            - { call: "POST /batches/${b1}/release", payload: {}, as: MerchOps }
            - { call: "POST /batches/${b1}/recall", payload: {}, as: MerchOps }
          trigger:
            - { call: "POST /batches/${b1}/release", payload: {}, as: MerchOps, captures: { err: "$.data.error_id" } }
          assert:
            - "response HTTP status == 409"
            - "error_id == ERR_INVALID_STATE"
            - "Batch.${b1}.status == RECALLED"

      - name: label_already_labeled_batch_idempotency
        claim_type: idempotency
        grounds: [state_machines.Batch.CREATED_to_LABELED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Labeling a batch already in LABELED (second label) returns ERR_INVALID_STATE; precondition status==CREATED fails."
        test_recipe:
          setup: ["A LABELED batch."]
          setup_api_calls:
            - { call: "POST /products", payload: { product_type: "CANDLE", collection_name: "Id", scent_family: "WOODY", title: "Id" }, as: MerchOps, captures: { p1: "$.data.id" } }
            - { call: "POST /products/${p1}/skus", payload: { size: "MEDIUM", scent: "Id", list_price_cents: 2000 }, as: MerchOps, captures: { s1: "$.data.id" } }
            - { call: "POST /skus/${s1}/batches", payload: { quantity_produced: 10, line_code: "IDL", cure_starts_at: "2026-06-01T00:00:00Z", cure_ends_at: "2026-06-05T00:00:00Z" }, as: MerchOps, captures: { b1: "$.data.id" } }
            - { call: "POST /batches/${b1}/label", payload: {}, as: MerchOps }
          trigger:
            - { call: "POST /batches/${b1}/label", payload: {}, as: MerchOps, captures: { err: "$.data.error_id" } }
          assert:
            - "response HTTP status == 409"
            - "error_id == ERR_INVALID_STATE"

      - name: cancel_cancelled_subscription_terminal_lockdown
        claim_type: terminal_state_lockdown
        grounds: [state_machines.Subscription.ACTIVE_to_CANCELLED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Cancelling an already-CANCELLED (terminal) subscription returns ERR_INVALID_STATE."
        test_recipe:
          setup: ["A customer with a CANCELLED subscription."]
          setup_api_calls:
            - { call: "POST /products", payload: { product_type: "SOAP", collection_name: "Tl", scent_family: "CITRUS", title: "Tl" }, as: MerchOps, captures: { p1: "$.data.id" } }
            - { call: "POST /products/${p1}/skus", payload: { size: "SMALL", scent: "Tl", list_price_cents: 900 }, as: MerchOps, captures: { s1: "$.data.id" } }
            - { call: "POST /customers", payload: { email: "tl@x.com", full_name: "Tl" }, as: PlatformAdmin, captures: { c1: "$.data.id" } }
            - { call: "POST /customers/${c1}/subscriptions", payload: { sku_id: "${s1}", quantity: 2, cadence_days: 30 }, as: Customer, as_user_id: "${c1}", captures: { sub: "$.data.id" } }
            - { call: "POST /subscriptions/${sub}/cancel", payload: {}, as: Customer, as_user_id: "${c1}" }
          trigger:
            - { call: "POST /subscriptions/${sub}/cancel", payload: {}, as: Customer, as_user_id: "${c1}", captures: { err: "$.data.error_id" } }
          assert:
            - "response HTTP status == 409"
            - "error_id == ERR_INVALID_STATE"

      - name: drop_status_live_within_window_auto_transition
        claim_type: side_effect_execution
        grounds: [state_machines.Drop.SCHEDULED_to_LIVE, entities.Drop.fields.status]
        distinguishing_aspect: "A drop with window [2026-07-05,2026-07-10) reads SCHEDULED at clock 2026-07-01 and LIVE at clock 2026-07-07 (clock-driven auto-transition)."
        test_recipe:
          setup: ["A drop scheduled for 2026-07-05..2026-07-10 with one non-exclusive listing."]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-07-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /products", payload: { product_type: "SOAP", collection_name: "Dw", scent_family: "CITRUS", title: "Dw" }, as: MerchOps, captures: { p1: "$.data.id" } }
            - { call: "POST /products/${p1}/skus", payload: { size: "SMALL", scent: "Dw", list_price_cents: 1000 }, as: MerchOps, captures: { s1: "$.data.id" } }
            - { call: "POST /drops", payload: { season: "SUMMER_2026", title: "Win", starts_at: "2026-07-05T00:00:00Z", ends_at: "2026-07-10T00:00:00Z", listings: [{ sku_id: "${s1}", drop_price_cents: 900, is_exclusive: false }] }, as: MerchOps, captures: { d1: "$.data.id" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-07-07T00:00:00Z" }, as: PlatformAdmin }
          trigger:
            - { call: "GET /drops/${d1}", payload: {}, as: MerchOps }
          assert:
            - "Drop.${d1}.status == LIVE"

      - name: return_request_requires_delivered_order
        claim_type: precondition_enforcement
        grounds: [state_machines.Return.REQUESTED_to_APPROVED, "errors[ERR_ORDER_NOT_DELIVERED]"]
        distinguishing_aspect: "Requesting a return on an order that is ALLOCATED (paid, not yet DELIVERED) returns ERR_ORDER_NOT_DELIVERED."
        test_recipe:
          setup: ["Customer with a checked-out (ALLOCATED, not delivered) order."]
          setup_api_calls:
            - { call: "POST /products", payload: { product_type: "SOAP", collection_name: "Rd", scent_family: "CITRUS", title: "Rd" }, as: MerchOps, captures: { p1: "$.data.id" } }
            - { call: "POST /products/${p1}/skus", payload: { size: "SMALL", scent: "Rd", list_price_cents: 1000 }, as: MerchOps, captures: { s1: "$.data.id" } }
            - { call: "POST /skus/${s1}/batches", payload: { quantity_produced: 10, line_code: "RDL", cure_starts_at: "2026-06-01T00:00:00Z", cure_ends_at: "2026-06-05T00:00:00Z" }, as: MerchOps, captures: { b1: "$.data.id" } }
            - { call: "POST /batches/${b1}/release", payload: {}, as: MerchOps }
            - { call: "POST /customers", payload: { email: "rd@x.com", full_name: "Rd" }, as: PlatformAdmin, captures: { c1: "$.data.id" } }
            - { call: "POST /customers/${c1}/orders", payload: { order_type: "RETAIL" }, as: Customer, as_user_id: "${c1}", captures: { o1: "$.data.id" } }
            - { call: "POST /orders/${o1}/lines", payload: { sku_id: "${s1}", batch_id: "${b1}", quantity: 1 }, as: Customer, as_user_id: "${c1}" }
            - { call: "GET /orders/${o1}", payload: {}, as: Customer, as_user_id: "${c1}", captures: { ov: "$.data.version" } }
            - { call: "POST /orders/${o1}/checkout", payload: { expected_order_version: "${ov}" }, as: Customer, as_user_id: "${c1}" }
          trigger:
            - { call: "POST /orders/${o1}/returns", payload: { reason: "too soon" }, as: Customer, as_user_id: "${c1}", captures: { err: "$.data.error_id" } }
          assert:
            - "response HTTP status == 409"
            - "error_id == ERR_ORDER_NOT_DELIVERED"

      - name: add_line_to_checked_out_order_not_editable
        claim_type: invalid_transitions
        grounds: ["errors[ERR_ORDER_NOT_EDITABLE]", entities.Order.fields.fulfillment_status]
        distinguishing_aspect: "Adding a line to an order whose fulfillment_status is ALLOCATED (already checked out) returns ERR_ORDER_NOT_EDITABLE."
        test_recipe:
          setup: ["Customer with a checked-out order (one line already)."]
          setup_api_calls:
            - { call: "POST /products", payload: { product_type: "SOAP", collection_name: "Ne", scent_family: "CITRUS", title: "Ne" }, as: MerchOps, captures: { p1: "$.data.id" } }
            - { call: "POST /products/${p1}/skus", payload: { size: "SMALL", scent: "Ne", list_price_cents: 1000 }, as: MerchOps, captures: { s1: "$.data.id" } }
            - { call: "POST /skus/${s1}/batches", payload: { quantity_produced: 20, line_code: "NEL", cure_starts_at: "2026-06-01T00:00:00Z", cure_ends_at: "2026-06-05T00:00:00Z" }, as: MerchOps, captures: { b1: "$.data.id" } }
            - { call: "POST /batches/${b1}/release", payload: {}, as: MerchOps }
            - { call: "POST /customers", payload: { email: "ne@x.com", full_name: "Ne" }, as: PlatformAdmin, captures: { c1: "$.data.id" } }
            - { call: "POST /customers/${c1}/orders", payload: { order_type: "RETAIL" }, as: Customer, as_user_id: "${c1}", captures: { o1: "$.data.id" } }
            - { call: "POST /orders/${o1}/lines", payload: { sku_id: "${s1}", batch_id: "${b1}", quantity: 1 }, as: Customer, as_user_id: "${c1}" }
            - { call: "GET /orders/${o1}", payload: {}, as: Customer, as_user_id: "${c1}", captures: { ov: "$.data.version" } }
            - { call: "POST /orders/${o1}/checkout", payload: { expected_order_version: "${ov}" }, as: Customer, as_user_id: "${c1}" }
          trigger:
            - { call: "POST /orders/${o1}/lines", payload: { sku_id: "${s1}", batch_id: "${b1}", quantity: 1 }, as: Customer, as_user_id: "${c1}", captures: { err: "$.data.error_id" } }
          assert:
            - "response HTTP status == 409"
            - "error_id == ERR_ORDER_NOT_EDITABLE"

  # ---------------------------------------------------------------------------
  - section: calculations
    instances:
      - name: loyalty_tier_silver_lower_boundary_500
        claim_type: constants_applied
        grounds: [calculations.loyalty_tier, entities.Customer.fields.loyalty_tier]
        distinguishing_aspect: "A balance of exactly 500 yields SILVER (lower bound inclusive, >=), distinguishing 499 (BRONZE) from 500 (SILVER)."
        test_recipe:
          setup: ["A customer granted exactly 500 points."]
          setup_api_calls:
            - { call: "POST /customers", payload: { email: "si@x.com", full_name: "Si" }, as: PlatformAdmin, captures: { c1: "$.data.id" } }
            - { call: "POST /customers/${c1}/loyalty-grant", payload: { points: 500 }, as: PlatformAdmin }
          trigger:
            - { call: "GET /customers/${c1}", payload: {}, as: PlatformAdmin }
          assert:
            - "Customer.${c1}.loyalty_points_balance == 500"
            - "Customer.${c1}.loyalty_tier == SILVER"

      - name: free_ship_threshold_exact_boundary_5000
        claim_type: correct_result
        grounds: [calculations.order_final_pricing, entities.Order.fields.shipping_fee_cents]
        distinguishing_aspect: "A BRONZE RETAIL order with discounted_subtotal exactly 5000 (no discount) gets free shipping (shipping_fee_cents 0, final 5000), pinning the >= FREE_SHIP_THRESHOLD_CENTS boundary."
        test_recipe:
          setup: ["BRONZE customer, soap sku list 5000, released batch, order one line qty 1 (subtotal 5000)."]
          setup_api_calls:
            - { call: "POST /products", payload: { product_type: "SOAP", collection_name: "Fs", scent_family: "CITRUS", title: "Fs" }, as: MerchOps, captures: { p1: "$.data.id" } }
            - { call: "POST /products/${p1}/skus", payload: { size: "LARGE", scent: "Fs", list_price_cents: 5000 }, as: MerchOps, captures: { s1: "$.data.id" } }
            - { call: "POST /skus/${s1}/batches", payload: { quantity_produced: 10, line_code: "FSL", cure_starts_at: "2026-06-01T00:00:00Z", cure_ends_at: "2026-06-05T00:00:00Z" }, as: MerchOps, captures: { b1: "$.data.id" } }
            - { call: "POST /batches/${b1}/release", payload: {}, as: MerchOps }
            - { call: "POST /customers", payload: { email: "fs@x.com", full_name: "Fs" }, as: PlatformAdmin, captures: { c1: "$.data.id" } }
            - { call: "POST /customers/${c1}/orders", payload: { order_type: "RETAIL" }, as: Customer, as_user_id: "${c1}", captures: { o1: "$.data.id" } }
            - { call: "POST /orders/${o1}/lines", payload: { sku_id: "${s1}", batch_id: "${b1}", quantity: 1 }, as: Customer, as_user_id: "${c1}" }
            - { call: "GET /orders/${o1}", payload: {}, as: Customer, as_user_id: "${c1}", captures: { ov: "$.data.version" } }
          trigger:
            - { call: "POST /orders/${o1}/checkout", payload: { expected_order_version: "${ov}" }, as: Customer, as_user_id: "${c1}" }
          assert:
            - "Order.${o1}.discount_cents == 0"
            - "Order.${o1}.shipping_fee_cents == 0"
            - "Order.${o1}.final_total_cents == 5000"

      - name: renewal_selector_picks_earliest_batch
        claim_type: input_set_filtering
        grounds: [calculations.renewal_batch_selector, entities.Batch.fields.quantity_reserved]
        distinguishing_aspect: "With two eligible RELEASED batches, renewal reserves from the earliest-created batch (created_at ASC), leaving the later batch untouched — no id-based selection."
        test_recipe:
          setup: ["Clock 2026-07-01. Soap sku with two released batches b1 (created first) and b2 (created second), each qty 100 on distinct lines. Subscription qty 5, due at 2026-07-31; clock advanced to 2026-08-01."]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-07-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /products", payload: { product_type: "SOAP", collection_name: "Sel", scent_family: "CITRUS", title: "Sel" }, as: MerchOps, captures: { p1: "$.data.id" } }
            - { call: "POST /products/${p1}/skus", payload: { size: "SMALL", scent: "Sel", list_price_cents: 1000 }, as: MerchOps, captures: { s1: "$.data.id" } }
            - { call: "POST /skus/${s1}/batches", payload: { quantity_produced: 100, line_code: "SEL1", cure_starts_at: "2026-06-01T00:00:00Z", cure_ends_at: "2026-06-05T00:00:00Z" }, as: MerchOps, captures: { b1: "$.data.id" } }
            - { call: "POST /skus/${s1}/batches", payload: { quantity_produced: 100, line_code: "SEL2", cure_starts_at: "2026-06-01T00:00:00Z", cure_ends_at: "2026-06-05T00:00:00Z" }, as: MerchOps, captures: { b2: "$.data.id" } }
            - { call: "POST /batches/${b1}/release", payload: {}, as: MerchOps }
            - { call: "POST /batches/${b2}/release", payload: {}, as: MerchOps }
            - { call: "POST /customers", payload: { email: "sel@x.com", full_name: "Sel" }, as: PlatformAdmin, captures: { c1: "$.data.id" } }
            - { call: "POST /customers/${c1}/subscriptions", payload: { sku_id: "${s1}", quantity: 5, cadence_days: 30 }, as: Customer, as_user_id: "${c1}", captures: { sub: "$.data.id" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: PlatformAdmin }
          trigger:
            - { call: "POST /subscriptions/${sub}/renew", payload: {}, as: MerchOps }
          assert:
            - "Batch.${b1}.quantity_reserved == 5"
            - "Batch.${b2}.quantity_reserved == 0"

      - name: renew_no_eligible_batch_fallback
        claim_type: correct_result
        grounds: [calculations.renewal_batch_selector, "errors[ERR_NO_ELIGIBLE_BATCH]"]
        distinguishing_aspect: "When no RELEASED batch has quantity_available >= subscription.quantity, renewal fails with ERR_NO_ELIGIBLE_BATCH and does not advance next_renewal_at/renewal_count."
        test_recipe:
          setup: ["Clock 2026-07-01. Soap sku with a released batch of only 3 units. Subscription qty 5, due at 2026-08-01."]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-07-01T00:00:00Z" }, as: PlatformAdmin }
