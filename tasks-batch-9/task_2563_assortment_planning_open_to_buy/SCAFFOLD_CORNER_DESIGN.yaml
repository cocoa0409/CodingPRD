              payload: {}
              as: CategoryBuyer
              as_user_id: "buyer-1"
              captures: { mult_vc: $.data.effective_overlay_multiplier_bps, st_vc: $.data.sell_through_bps }
            - call: "POST /otb/localization-overlays/${ov_dem}/activate"
              payload: {}
              as: PlanningDirector
              as_user_id: "director-1"
            - call: "GET /otb/assortment-items/${item_id}"
              payload: {}
              as: CategoryBuyer
              as_user_id: "buyer-1"
