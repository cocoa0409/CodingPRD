          The five CycleMain reviews are chosen so score_spread lands on exactly 2.50, the
          value of SPREAD_REOPEN_THRESHOLD. The transition says "> threshold", so the round
          must NOT reopen and the applications must reach SCORED; a `>=` comparison flips both
          outcomes. The 2.60 sibling in
