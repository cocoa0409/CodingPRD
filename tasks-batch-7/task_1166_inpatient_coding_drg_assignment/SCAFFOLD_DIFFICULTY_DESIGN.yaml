            - { call: "POST /patient-accounts", payload: { mrn: "MRN-BP2B", admit_at: "2026-04-20T08:00:00Z", patient_class: "INPATIENT", financial_class: "MEDICARE", total_charges_cents: 900000 }, as: CodingManager, captures: { acct2: $.data.id } }
