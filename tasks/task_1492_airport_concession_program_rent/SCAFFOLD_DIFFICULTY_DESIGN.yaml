scaffold_difficulty_design:
  # =====================================================================
  # Rule 1 — dual_variant_calc (different entity domains)
  # =====================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: settlement_provisional_vs_final_true_up
        grounds:
          - calculations.annual_rent_settlement
          - entities.RentSettlement.fields.variant_used
        distinguishing_aspect: |
          Same lease, same three ACCEPTED reports, same MAG: the PROVISIONAL variant
          (ACCRUING recalculate) projects the 9 unreported months at MAG/12 and yields
          amount_due_cents 1,470,000, while the FINAL variant (invoice) counts only
          ACCEPTED reports and yields amount_due_cents 1,200,000 — two valid
          interpretations of identical data diverging by 270,000 cents on RentSettlement.
        test_recipe:
          setup:
            - "ACTIVE lease (MAG 1,200,000; 8%/10% tiers, breakpoint 500,000; term 2026-01-01..2030-12-31)"
            - "Settlement for 2026 exists (ACCRUING)"
            - "Reports 2026-01..2026-03, gross 2,000,000 each, ACCEPTED; no other reports"
          setup_api_calls:
            - { call: "POST /concessions/tenants", payload: { legal_name: "SkyEats LLC", contact_email: "ops@skyeats.com", acdbe_certified: true }, as: AirportAdmin, captures: { t1: $.data.id } }
            - { call: "POST /concessions/leases", payload: { tenant_id: "${t1}", premises_code: "A1", category: "FOOD", term_start_date: "2026-01-01", term_end_date: "2030-12-31", mag_annual_cents: 1200000, pct_rate_below_bp: 800, pct_breakpoint_cents: 500000, pct_rate_above_bp: 1000, acdbe_goal_bp: 2000, ti_allowance_cents: 500000, buildout_deadline: "2026-09-30", min_spe_cents: 1000 }, as: AirportAdmin, captures: { l1: $.data.id } }
            - { call: "POST /concessions/leases/${l1}/transition", payload: { action: "ACTIVATE" }, as: AirportAdmin }
            - { call: "POST /concessions/settlements", payload: { lease_id: "${l1}", period_year: 2026 }, as: AirportAdmin, captures: { s1: $.data.id } }
            - { call: "POST /concessions/sales-reports", payload: { lease_id: "${l1}", period_month: "2026-01", gross_sales_cents: 2000000 }, as: Tenant, as_user_id: "${t1}", captures: { r1: $.data.id } }
            - { call: "POST /concessions/sales-reports/${r1}/transition", payload: { action: "SUBMIT" }, as: Tenant, as_user_id: "${t1}" }
            - { call: "POST /concessions/sales-reports/${r1}/transition", payload: { action: "ACCEPT" }, as: ConcessionAnalyst }
            - { call: "POST /concessions/sales-reports", payload: { lease_id: "${l1}", period_month: "2026-02", gross_sales_cents: 2000000 }, as: Tenant, as_user_id: "${t1}", captures: { r2: $.data.id } }
            - { call: "POST /concessions/sales-reports/${r2}/transition", payload: { action: "SUBMIT" }, as: Tenant, as_user_id: "${t1}" }
            - { call: "POST /concessions/sales-reports/${r2}/transition", payload: { action: "ACCEPT" }, as: ConcessionAnalyst }
            - { call: "POST /concessions/sales-reports", payload: { lease_id: "${l1}", period_month: "2026-03", gross_sales_cents: 2000000 }, as: Tenant, as_user_id: "${t1}", captures: { r3: $.data.id } }
            - { call: "POST /concessions/sales-reports/${r3}/transition", payload: { action: "SUBMIT" }, as: Tenant, as_user_id: "${t1}" }
            - { call: "POST /concessions/sales-reports/${r3}/transition", payload: { action: "ACCEPT" }, as: ConcessionAnalyst }
          trigger:
            - { call: "POST /concessions/settlements/${s1}/recalculate", payload: {}, as: ConcessionAnalyst, captures: { prov_pct: $.data.percentage_due_cents, prov_due: $.data.amount_due_cents, prov_trueup: $.data.true_up_due_cents, prov_variant: $.data.variant_used } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2027-01-15T00:00:00Z" }, as: AirportAdmin }
            - { call: "POST /concessions/settlements/${s1}/invoice", payload: {}, as: ConcessionAnalyst, captures: { fin_pct: $.data.percentage_due_cents, fin_due: $.data.amount_due_cents, fin_trueup: $.data.true_up_due_cents, fin_variant: $.data.variant_used } }
          assert:
            - "prov_variant == PROVISIONAL"
            - "prov_pct == 1470000   # 3*190,000 accepted + 9*100,000 projected"
            - "prov_trueup == 270000"
            - "prov_due == 1470000"
            - "fin_variant == FINAL"
            - "fin_pct == 570000    # only the 3 ACCEPTED reports"
            - "fin_trueup == 0"
            - "fin_due == 1200000"

      - name: spe_ttm_vs_ytd_divergence
        grounds:
          - calculations.sales_per_enplanement
          - entities.Lease.fields.min_spe_cents
        distinguishing_aspect: |
          Same accepted sales and snapshots: the TTM variant (window 2025-08..2026-07
          anchored at the latest report month) includes the weak 2025-12 month and yields
          spe_ttm_cents 289, while the YTD variant (2026 calendar year) excludes it and
          yields spe_ytd_cents 480 — a Lease-performance dual variant, a different entity
          domain from RentSettlement.
        test_recipe:
          setup:
            - "ACTIVE lease with min_spe_cents 1000"
            - "ACCEPTED reports: 2025-12 gross 100,000; 2026-06 gross 300,000; 2026-07 gross 900,000"
            - "Enplanement snapshots: 2025-12 = 200,000; 2026-06 = 100,000; 2026-07 = 150,000"
            - "Logical clock at startup default 2026-08-01T00:00:00Z (never set)"
          setup_api_calls:
            - { call: "POST /concessions/tenants", payload: { legal_name: "SkyEats LLC", contact_email: "ops@skyeats.com" }, as: AirportAdmin, captures: { t1: $.data.id } }
            - { call: "POST /concessions/leases", payload: { tenant_id: "${t1}", premises_code: "A1", category: "FOOD", term_start_date: "2025-11-01", term_end_date: "2030-12-31", mag_annual_cents: 1200000, pct_rate_below_bp: 800, pct_breakpoint_cents: 500000, pct_rate_above_bp: 1000, acdbe_goal_bp: 2000, ti_allowance_cents: 500000, buildout_deadline: "2026-09-30", min_spe_cents: 1000 }, as: AirportAdmin, captures: { l1: $.data.id } }
            - { call: "POST /concessions/leases/${l1}/transition", payload: { action: "ACTIVATE" }, as: AirportAdmin }
            - { call: "POST /concessions/sales-reports", payload: { lease_id: "${l1}", period_month: "2025-12", gross_sales_cents: 100000 }, as: Tenant, as_user_id: "${t1}", captures: { r0: $.data.id } }
            - { call: "POST /concessions/sales-reports/${r0}/transition", payload: { action: "SUBMIT" }, as: Tenant, as_user_id: "${t1}" }
            - { call: "POST /concessions/sales-reports/${r0}/transition", payload: { action: "ACCEPT" }, as: ConcessionAnalyst }
            - { call: "POST /concessions/sales-reports", payload: { lease_id: "${l1}", period_month: "2026-06", gross_sales_cents: 300000 }, as: Tenant, as_user_id: "${t1}", captures: { r1: $.data.id } }
            - { call: "POST /concessions/sales-reports/${r1}/transition", payload: { action: "SUBMIT" }, as: Tenant, as_user_id: "${t1}" }
            - { call: "POST /concessions/sales-reports/${r1}/transition", payload: { action: "ACCEPT" }, as: ConcessionAnalyst }
            - { call: "POST /concessions/sales-reports", payload: { lease_id: "${l1}", period_month: "2026-07", gross_sales_cents: 900000 }, as: Tenant, as_user_id: "${t1}", captures: { r2: $.data.id } }
            - { call: "POST /concessions/sales-reports/${r2}/transition", payload: { action: "SUBMIT" }, as: Tenant, as_user_id: "${t1}" }
            - { call: "POST /concessions/sales-reports/${r2}/transition", payload: { action: "ACCEPT" }, as: ConcessionAnalyst }
            - { call: "POST /concessions/enplanement-snapshots", payload: { month: "2025-12", enplanements: 200000 }, as: AirportAdmin }
            - { call: "POST /concessions/enplanement-snapshots", payload: { month: "2026-06", enplanements: 100000 }, as: AirportAdmin }
            - { call: "POST /concessions/enplanement-snapshots", payload: { month: "2026-07", enplanements: 150000 }, as: AirportAdmin }
          trigger:
            - { call: "GET /concessions/leases/${l1}/performance", payload: {}, as: ConcessionAnalyst, captures: { ttm: $.data.spe_ttm_cents, ytd: $.data.spe_ytd_cents, sales_ttm: $.data.sales_ttm_cents, enpl_ttm: $.data.enplanements_ttm, outcome: $.data.review_outcome } }
          assert:
            - "sales_ttm == 1300000"
            - "enpl_ttm == 450000"
            - "ttm == 289   # round_half_up(130,000,000/450,000)"
            - "ytd == 480   # 120,000,000/250,000"
            - "outcome == UNDERPERFORMING   # 289 < min_spe_cents 1000"

  # =====================================================================
  # Rule 2 — combinatorial_formula (different modes)
  # =====================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: settlement_proration_nested_max
        grounds:
          - calculations.annual_rent_settlement
          - entities.Lease.fields.term_start_date
        distinguishing_aspect: |
          Mode (a): >=3 inputs with non-linear interaction — day-level MAG proration
          (partial first month April 2026: weight 8 + round(16/30,4) = 8.5333 -> mag_due
          853,330), tiered percentage rent on a single 20,000,000-cent month (1,990,000),
          and the nested max(0, pct - mag) true-up branch (1,136,670) — pinned evaluation
          order makes the value well-defined.
        test_recipe:
          setup:
            - "Lease term starts mid-month: 2026-04-15..2030-12-31; MAG 1,200,000; tiers 8%/10%, breakpoint 500,000"
            - "Settlement 2026; single ACCEPTED report 2026-05 gross 20,000,000"
          setup_api_calls:
            - { call: "POST /concessions/tenants", payload: { legal_name: "SkyEats LLC", contact_email: "ops@skyeats.com" }, as: AirportAdmin, captures: { t1: $.data.id } }
            - { call: "POST /concessions/leases", payload: { tenant_id: "${t1}", premises_code: "A1", category: "FOOD", term_start_date: "2026-04-15", term_end_date: "2030-12-31", mag_annual_cents: 1200000, pct_rate_below_bp: 800, pct_breakpoint_cents: 500000, pct_rate_above_bp: 1000, acdbe_goal_bp: 2000, ti_allowance_cents: 500000, buildout_deadline: "2026-09-30", min_spe_cents: 1000 }, as: AirportAdmin, captures: { l1: $.data.id } }
            - { call: "POST /concessions/leases/${l1}/transition", payload: { action: "ACTIVATE" }, as: AirportAdmin }
            - { call: "POST /concessions/settlements", payload: { lease_id: "${l1}", period_year: 2026 }, as: AirportAdmin, captures: { s1: $.data.id } }
            - { call: "POST /concessions/sales-reports", payload: { lease_id: "${l1}", period_month: "2026-05", gross_sales_cents: 20000000 }, as: Tenant, as_user_id: "${t1}", captures: { r1: $.data.id } }
            - { call: "POST /concessions/sales-reports/${r1}/transition", payload: { action: "SUBMIT" }, as: Tenant, as_user_id: "${t1}" }
            - { call: "POST /concessions/sales-reports/${r1}/transition", payload: { action: "ACCEPT" }, as: ConcessionAnalyst }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2027-01-15T00:00:00Z" }, as: AirportAdmin }
          trigger:
            - { call: "POST /concessions/settlements/${s1}/invoice", payload: {}, as: ConcessionAnalyst, captures: { mag: $.data.mag_due_cents, pct: $.data.percentage_due_cents, trueup: $.data.true_up_due_cents, due: $.data.amount_due_cents } }
          assert:
            - "mag == 853330    # round_half_up(1,200,000 * 8.5333 / 12)"
            - "pct == 1990000   # 500,000*8% + 19,500,000*10%"
            - "trueup == 1136670"
            - "due == 1990000"

      - name: hours_penalty_per_event_ceil_then_sum
        grounds:
          - calculations.policy_violation_penalty
          - entities.PolicyViolation.fields.penalty_cents
        distinguishing_aspect: |
          Mode (b) nested rounding order: two OPERATING_HOURS violations of 30 shortfall
          minutes each are rounded per event (ceil(30/60)=1h -> 25,000 cents each) and then
          summed (50,000); the alternative order (sum 60 minutes, then ceil -> 25,000) is
          explicitly rejected by the pinned per-event rule — different cents.
        test_recipe:
          setup:
            - "ACTIVE lease"
          setup_api_calls:
            - { call: "POST /concessions/tenants", payload: { legal_name: "SkyEats LLC", contact_email: "ops@skyeats.com" }, as: AirportAdmin, captures: { t1: $.data.id } }
            - { call: "POST /concessions/leases", payload: { tenant_id: "${t1}", premises_code: "A1", category: "FOOD", term_start_date: "2026-01-01", term_end_date: "2030-12-31", mag_annual_cents: 1200000, pct_rate_below_bp: 800, pct_breakpoint_cents: 500000, pct_rate_above_bp: 1000, acdbe_goal_bp: 2000, ti_allowance_cents: 500000, buildout_deadline: "2026-09-30", min_spe_cents: 1000 }, as: AirportAdmin, captures: { l1: $.data.id } }
            - { call: "POST /concessions/leases/${l1}/transition", payload: { action: "ACTIVATE" }, as: AirportAdmin }
          trigger:
            - { call: "POST /concessions/violations", payload: { lease_id: "${l1}", kind: "OPERATING_HOURS", observed_date: "2026-08-03", shortfall_minutes: 30 }, as: ConcessionAnalyst, captures: { v1: $.data.id, p1: $.data.penalty_cents } }
            - { call: "POST /concessions/violations", payload: { lease_id: "${l1}", kind: "OPERATING_HOURS", observed_date: "2026-08-10", shortfall_minutes: 30 }, as: ConcessionAnalyst, captures: { v2: $.data.id, p2: $.data.penalty_cents } }
          assert:
            - "p1 == 25000   # ceil(30/60) * 25,000"
            - "p2 == 25000"
            - "p1 + p2 == 50000   # per-event rounding; sum-then-ceil would give 25000"

  # =====================================================================
  # Rule 3 — non_linear_state_machine (different entities)
  # =====================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: lease_default_cure_cycle
        grounds:
          - state_machines.Lease.ACTIVE_to_DEFAULTED
          - state_machines.Lease.DEFAULTED_to_ACTIVE
        distinguishing_aspect: |
          Lease cycles ACTIVE -> DEFAULTED -> ACTIVE -> DEFAULTED: the cure transition
          returns the entity to a prior state and the loop is repeatable, on entity Lease.
        test_recipe:
          setup: ["ACTIVE lease"]
          setup_api_calls:
            - { call: "POST /concessions/tenants", payload: { legal_name: "SkyEats LLC", contact_email: "ops@skyeats.com" }, as: AirportAdmin, captures: { t1: $.data.id } }
            - { call: "POST /concessions/leases", payload: { tenant_id: "${t1}", premises_code: "A1", category: "FOOD", term_start_date: "2026-01-01", term_end_date: "2030-12-31", mag_annual_cents: 1200000, pct_rate_below_bp: 800, pct_breakpoint_cents: 500000, pct_rate_above_bp: 1000, acdbe_goal_bp: 2000, ti_allowance_cents: 500000, buildout_deadline: "2026-09-30", min_spe_cents: 1000 }, as: AirportAdmin, captures: { l1: $.data.id } }
            - { call: "POST /concessions/leases/${l1}/transition", payload: { action: "ACTIVATE" }, as: AirportAdmin }
          trigger:
            - { call: "POST /concessions/leases/${l1}/transition", payload: { action: "DECLARE_DEFAULT", reason: "NONPAYMENT" }, as: AirportAdmin, captures: { st1: $.data.status, rs1: $.data.default_reason } }
            - { call: "POST /concessions/leases/${l1}/transition", payload: { action: "CURE_DEFAULT" }, as: AirportAdmin, captures: { st2: $.data.status, rs2: $.data.default_reason } }
            - { call: "POST /concessions/leases/${l1}/transition", payload: { action: "DECLARE_DEFAULT", reason: "HOURS_SHORTFALL" }, as: AirportAdmin, captures: { st3: $.data.status } }
          assert:
            - "st1 == DEFAULTED and rs1 == NONPAYMENT"
            - "st2 == ACTIVE and rs2 == null"
            - "st3 == DEFAULTED   # cycle is repeatable"

      - name: sales_report_dispute_resubmit_cycle
        grounds:
          - state_machines.SalesReport.SUBMITTED_to_DISPUTED
          - state_machines.SalesReport.DISPUTED_to_SUBMITTED
        distinguishing_aspect: |
          SalesReport loops SUBMITTED -> DISPUTED -> (PATCH) -> SUBMITTED on entity
          SalesReport — a revision cycle on a different entity than the Lease default loop.
        test_recipe:
          setup: ["ACTIVE lease; one DRAFT report for 2026-03 with gross 500,000"]
          setup_api_calls:
            - { call: "POST /concessions/tenants", payload: { legal_name: "SkyEats LLC", contact_email: "ops@skyeats.com" }, as: AirportAdmin, captures: { t1: $.data.id } }
            - { call: "POST /concessions/leases", payload: { tenant_id: "${t1}", premises_code: "A1", category: "FOOD", term_start_date: "2026-01-01", term_end_date: "2030-12-31", mag_annual_cents: 1200000, pct_rate_below_bp: 800, pct_breakpoint_cents: 500000, pct_rate_above_bp: 1000, acdbe_goal_bp: 2000, ti_allowance_cents: 500000, buildout_deadline: "2026-09-30", min_spe_cents: 1000 }, as: AirportAdmin, captures: { l1: $.data.id } }
            - { call: "POST /concessions/leases/${l1}/transition", payload: { action: "ACTIVATE" }, as: AirportAdmin }
            - { call: "POST /concessions/sales-reports", payload: { lease_id: "${l1}", period_month: "2026-03", gross_sales_cents: 500000 }, as: Tenant, as_user_id: "${t1}", captures: { r1: $.data.id } }
          trigger:
            - { call: "POST /concessions/sales-reports/${r1}/transition", payload: { action: "SUBMIT" }, as: Tenant, as_user_id: "${t1}", captures: { st1: $.data.status } }
            - { call: "POST /concessions/sales-reports/${r1}/transition", payload: { action: "DISPUTE" }, as: ConcessionAnalyst, captures: { st2: $.data.status } }
            - { call: "PATCH /concessions/sales-reports/${r1}", payload: { gross_sales_cents: 550000 }, as: Tenant, as_user_id: "${t1}", captures: { gross: $.data.gross_sales_cents, st3: $.data.status } }
            - { call: "POST /concessions/sales-reports/${r1}/transition", payload: { action: "SUBMIT" }, as: Tenant, as_user_id: "${t1}", captures: { st4: $.data.status } }
          assert:
            - "st1 == SUBMITTED"
            - "st2 == DISPUTED"
            - "gross == 550000 and st3 == DISPUTED   # PATCH revises in place"
            - "st4 == SUBMITTED   # loop closed"

  # =====================================================================
  # Rule 4 — transitive_cascade (different triggers, depths 3 and 2)
  # =====================================================================
  - rule_id: transitive_cascade
    instances:
      - name: audit_findings_restate_reports_cascade
        grounds:
          - state_machines.SalesReport.ACCEPTED_to_ADJUSTED
          - state_machines.RentSettlement.PAID_to_PARTIALLY_PAID
          - calculations.arrears_reconciliation
        distinguishing_aspect: |
          Depth-3 cascade from POST /audits/{id}/issue-findings: finding -> SalesReport
          ACCEPTED->ADJUSTED (link 1) -> RentSettlement recalculated, PAID reopens to
          PARTIALLY_PAID with new balance (link 2) -> Lease.arrears_cents recomputed to
          900,000 (link 3); each hop is caused by the previous hop.
        test_recipe:
          setup:
            - "ACTIVE lease; settlement 2026 INVOICED then fully PAID (amount_due 1,200,000 = MAG only)"
            - "Reports 2026-01 and 2026-02 gross 600,000 each, ACCEPTED (pct 50,000 each)"
            - "Audit case OPENED covering 2026-01..2026-02"
          setup_api_calls:
            - { call: "POST /concessions/tenants", payload: { legal_name: "SkyEats LLC", contact_email: "ops@skyeats.com" }, as: AirportAdmin, captures: { t1: $.data.id } }
            - { call: "POST /concessions/leases", payload: { tenant_id: "${t1}", premises_code: "A1", category: "FOOD", term_start_date: "2026-01-01", term_end_date: "2030-12-31", mag_annual_cents: 1200000, pct_rate_below_bp: 800, pct_breakpoint_cents: 500000, pct_rate_above_bp: 1000, acdbe_goal_bp: 2000, ti_allowance_cents: 500000, buildout_deadline: "2026-09-30", min_spe_cents: 1000 }, as: AirportAdmin, captures: { l1: $.data.id } }
            - { call: "POST /concessions/leases/${l1}/transition", payload: { action: "ACTIVATE" }, as: AirportAdmin }
            - { call: "POST /concessions/settlements", payload: { lease_id: "${l1}", period_year: 2026 }, as: AirportAdmin, captures: { s1: $.data.id } }
            - { call: "POST /concessions/sales-reports", payload: { lease_id: "${l1}", period_month: "2026-01", gross_sales_cents: 600000 }, as: Tenant, as_user_id: "${t1}", captures: { r1: $.data.id } }
            - { call: "POST /concessions/sales-reports/${r1}/transition", payload: { action: "SUBMIT" }, as: Tenant, as_user_id: "${t1}" }
            - { call: "POST /concessions/sales-reports/${r1}/transition", payload: { action: "ACCEPT" }, as: ConcessionAnalyst }
            - { call: "POST /concessions/sales-reports", payload: { lease_id: "${l1}", period_month: "2026-02", gross_sales_cents: 600000 }, as: Tenant, as_user_id: "${t1}", captures: { r2: $.data.id } }
            - { call: "POST /concessions/sales-reports/${r2}/transition", payload: { action: "SUBMIT" }, as: Tenant, as_user_id: "${t1}" }
            - { call: "POST /concessions/sales-reports/${r2}/transition", payload: { action: "ACCEPT" }, as: ConcessionAnalyst }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2027-01-15T00:00:00Z" }, as: AirportAdmin }
            - { call: "POST /concessions/settlements/${s1}/invoice", payload: {}, as: ConcessionAnalyst }
            - { call: "POST /concessions/settlements/${s1}/payments", payload: { amount_cents: 1200000, method: "ACH" }, as: Tenant, as_user_id: "${t1}" }
            - { call: "POST /concessions/audits", payload: { lease_id: "${l1}", period_start_month: "2026-01", period_end_month: "2026-02" }, as: Auditor, captures: { a1: $.data.id } }
          trigger:
            - { call: "POST /concessions/audits/${a1}/issue-findings", payload: { findings: [ { sales_report_id: "${r1}", restated_gross_sales_cents: 20600000 } ] }, as: Auditor, captures: { understatement: $.data.understatement_cents } }
            - { call: "GET /concessions/sales-reports/${r1}", payload: {}, as: ConcessionAnalyst, captures: { rstat: $.data.status, restated: $.data.restated_gross_sales_cents } }
            - { call: "GET /concessions/settlements/${s1}", payload: {}, as: ConcessionAnalyst, captures: { sstat: $.data.status, spct: $.data.percentage_due_cents, strueup: $.data.true_up_due_cents, sdue: $.data.amount_due_cents, spaid: $.data.amount_paid_cents, sbal: $.data.balance_due_cents } }
            - { call: "GET /concessions/leases/${l1}", payload: {}, as: ConcessionAnalyst, captures: { arrears: $.data.arrears_cents } }
          assert:
            - "rstat == ADJUSTED and restated == 20600000"
            - "understatement == 20000000   # 20,600,000 - 600,000"
            - "spct == 2100000   # 2,050,000 restated Jan + 50,000 Feb"
            - "strueup == 900000 and sdue == 2100000"
            - "spaid == 1200000 and sbal == 900000"
            - "sstat == PARTIALLY_PAID   # reopened from PAID"
            - "arrears == 900000"

      - name: lease_termination_cancels_draws
        grounds:
          - state_machines.Lease.ACTIVE_to_TERMINATED
          - state_machines.TIDraw.APPROVED_to_CANCELLED
          - calculations.ti_allowance_reconciliation
        distinguishing_aspect: |
          Depth-2 cascade from a different trigger (POST /leases/{id}/transition
          TERMINATE): termination -> APPROVED TIDraw CANCELLED (link 1) ->
          lease.ti_remaining_cents recomputed from 200,000 back to 300,000 (link 2).
        test_recipe:
          setup:
            - "ACTIVE lease, ti_allowance 500,000"
            - "Draw D1 amount 100,000 APPROVED; draw D2 amount 200,000 APPROVED then DISBURSED"
            - "ti_remaining_cents == 200,000 before termination"
          setup_api_calls:
            - { call: "POST /concessions/tenants", payload: { legal_name: "SkyEats LLC", contact_email: "ops@skyeats.com" }, as: AirportAdmin, captures: { t1: $.data.id } }
            - { call: "POST /concessions/leases", payload: { tenant_id: "${t1}", premises_code: "A1", category: "FOOD", term_start_date: "2026-01-01", term_end_date: "2030-12-31", mag_annual_cents: 1200000, pct_rate_below_bp: 800, pct_breakpoint_cents: 500000, pct_rate_above_bp: 1000, acdbe_goal_bp: 2000, ti_allowance_cents: 500000, buildout_deadline: "2026-09-30", min_spe_cents: 1000 }, as: AirportAdmin, captures: { l1: $.data.id } }
            - { call: "POST /concessions/leases/${l1}/transition", payload: { action: "ACTIVATE" }, as: AirportAdmin }
            - { call: "POST /concessions/ti-draws", payload: { lease_id: "${l1}", amount_cents: 100000, milestone: "DESIGN" }, as: Tenant, as_user_id: "${t1}", captures: { d1: $.data.id } }
            - { call: "POST /concessions/ti-draws/${d1}/transition", payload: { action: "APPROVE" }, as: AirportAdmin }
            - { call: "POST /concessions/ti-draws", payload: { lease_id: "${l1}", amount_cents: 200000, milestone: "CONSTRUCTION" }, as: Tenant, as_user_id: "${t1}", captures: { d2: $.data.id } }
            - { call: "POST /concessions/ti-draws/${d2}/transition", payload: { action: "APPROVE" }, as: AirportAdmin }
            - { call: "POST /concessions/ti-draws/${d2}/transition", payload: { action: "DISBURSE" }, as: AirportAdmin }
          trigger:
            - { call: "POST /concessions/leases/${l1}/transition", payload: { action: "TERMINATE" }, as: AirportAdmin, captures: { lstat: $.data.status } }
            - { call: "GET /concessions/ti-draws/${d1}", payload: {}, as: AirportAdmin, captures: { d1stat: $.data.status } }
            - { call: "GET /concessions/ti-draws/${d2}", payload: {}, as: AirportAdmin, captures: { d2stat: $.data.status } }
            - { call: "GET /concessions/leases/${l1}", payload: {}, as: AirportAdmin, captures: { remaining: $.data.ti_remaining_cents } }
          assert:
            - "lstat == TERMINATED"
            - "d1stat == CANCELLED   # link 1: non-terminal draw cancelled"
            - "d2stat == DISBURSED   # terminal draw untouched"
            - "remaining == 300000   # link 2: 500,000 - 200,000 disbursed"

  # =====================================================================
  # Rule 5 — priority_pair_validation_conflict (different category pairs)
  # =====================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: report_patch_state_beats_fiscal
        grounds:
          - validations[priority=9]
          - validations[priority=30]
        distinguishing_aspect: |
          Category pair state vs business_fiscal: PATCHing a SUBMITTED report with a
          negative gross_sales_cents violates both ERR_REPORT_NOT_EDITABLE (priority 9)
          and ERR_INVALID_AMOUNT (priority 30); the state error must win.
        test_recipe:
          setup: ["ACTIVE lease; report 2026-03 SUBMITTED"]
          setup_api_calls:
            - { call: "POST /concessions/tenants", payload: { legal_name: "SkyEats LLC", contact_email: "ops@skyeats.com" }, as: AirportAdmin, captures: { t1: $.data.id } }
            - { call: "POST /concessions/leases", payload: { tenant_id: "${t1}", premises_code: "A1", category: "FOOD", term_start_date: "2026-01-01", term_end_date: "2030-12-31", mag_annual_cents: 1200000, pct_rate_below_bp: 800, pct_breakpoint_cents: 500000, pct_rate_above_bp: 1000, acdbe_goal_bp: 2000, ti_allowance_cents: 500000, buildout_deadline: "2026-09-30", min_spe_cents: 1000 }, as: AirportAdmin, captures: { l1: $.data.id } }
            - { call: "POST /concessions/leases/${l1}/transition", payload: { action: "ACTIVATE" }, as: AirportAdmin }
            - { call: "POST /concessions/sales-reports", payload: { lease_id: "${l1}", period_month: "2026-03", gross_sales_cents: 500000 }, as: Tenant, as_user_id: "${t1}", captures: { r1: $.data.id } }
            - { call: "POST /concessions/sales-reports/${r1}/transition", payload: { action: "SUBMIT" }, as: Tenant, as_user_id: "${t1}" }
          trigger:
            - { call: "PATCH /concessions/sales-reports/${r1}", payload: { gross_sales_cents: -1 }, as: Tenant, as_user_id: "${t1}", captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_REPORT_NOT_EDITABLE   # state (pri 9) beats business_fiscal (pri 30)"

      - name: ti_draw_temporal_beats_fiscal
        grounds:
          - validations[priority=25]
          - validations[priority=32]
        distinguishing_aspect: |
          Category pair business_temporal vs business_fiscal: a TI draw that is both
          past the buildout deadline AND above the remaining allowance must return
          ERR_BUILDOUT_WINDOW_CLOSED (priority 25), not ERR_TI_ALLOWANCE_EXCEEDED
          (priority 32) — a different category pair than state-vs-fiscal.
        test_recipe:
          setup: ["ACTIVE lease; logical clock moved past buildout_deadline 2026-09-30"]
          setup_api_calls:
            - { call: "POST /concessions/tenants", payload: { legal_name: "SkyEats LLC", contact_email: "ops@skyeats.com" }, as: AirportAdmin, captures: { t1: $.data.id } }
            - { call: "POST /concessions/leases", payload: { tenant_id: "${t1}", premises_code: "A1", category: "FOOD", term_start_date: "2026-01-01", term_end_date: "2030-12-31", mag_annual_cents: 1200000, pct_rate_below_bp: 800, pct_breakpoint_cents: 500000, pct_rate_above_bp: 1000, acdbe_goal_bp: 2000, ti_allowance_cents: 500000, buildout_deadline: "2026-09-30", min_spe_cents: 1000 }, as: AirportAdmin, captures: { l1: $.data.id } }
            - { call: "POST /concessions/leases/${l1}/transition", payload: { action: "ACTIVATE" }, as: AirportAdmin }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-10-15T00:00:00Z" }, as: AirportAdmin }
          trigger:
            - { call: "POST /concessions/ti-draws", payload: { lease_id: "${l1}", amount_cents: 600000, milestone: "DESIGN" }, as: Tenant, as_user_id: "${t1}", captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_BUILDOUT_WINDOW_CLOSED   # temporal (pri 25) beats fiscal (pri 32); 600,000 > 500,000 remaining is masked"

  # =====================================================================
  # Rule 6 — boundary_precision_check (different metrics/endpoints)
  # =====================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: true_up_zero_when_percentage_equals_mag
        grounds:
          - calculations.annual_rent_settlement
          - entities.RentSettlement.fields.true_up_due_cents
        distinguishing_aspect: |
          Money boundary on POST /settlements/{id}/invoice: percentage_due exactly equal
          to mag_due (1,200,000 == 1,200,000) yields true_up_due_cents 0 — the true-up
          triggers only on strictly-greater (>), not >=.
        test_recipe:
          setup:
            - "ACTIVE lease; settlement 2026; single ACCEPTED report 2026-05 gross 12,100,000 (pct = 40,000 + 11,600,000*10% = 1,200,000 == MAG)"
            - "Clock moved to 2027-01-15 so the year is closed"
          setup_api_calls:
            - { call: "POST /concessions/tenants", payload: { legal_name: "SkyEats LLC", contact_email: "ops@skyeats.com" }, as: AirportAdmin, captures: { t1: $.data.id } }
            - { call: "POST /concessions/leases", payload: { tenant_id: "${t1}", premises_code: "A1", category: "FOOD", term_start_date: "2026-01-01", term_end_date: "2030-12-31", mag_annual_cents: 1200000, pct_rate_below_bp: 800, pct_breakpoint_cents: 500000, pct_rate_above_bp: 1000, acdbe_goal_bp: 2000, ti_allowance_cents: 500000, buildout_deadline: "2026-09-30", min_spe_cents: 1000 }, as: AirportAdmin, captures: { l1: $.data.id } }
            - { call: "POST /concessions/leases/${l1}/transition", payload: { action: "ACTIVATE" }, as: AirportAdmin }
            - { call: "POST /concessions/settlements", payload: { lease_id: "${l1}", period_year: 2026 }, as: AirportAdmin, captures: { s1: $.data.id } }
            - { call: "POST /concessions/sales-reports", payload: { lease_id: "${l1}", period_month: "2026-05", gross_sales_cents: 12100000 }, as: Tenant, as_user_id: "${t1}", captures: { r1: $.data.id } }
            - { call: "POST /concessions/sales-reports/${r1}/transition", payload: { action: "SUBMIT" }, as: Tenant, as_user_id: "${t1}" }
            - { call: "POST /concessions/sales-reports/${r1}/transition", payload: { action: "ACCEPT" }, as: ConcessionAnalyst }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2027-01-15T00:00:00Z" }, as: AirportAdmin }
          trigger:
            - { call: "POST /concessions/settlements/${s1}/invoice", payload: {}, as: ConcessionAnalyst, captures: { pct: $.data.percentage_due_cents, mag: $.data.mag_due_cents, trueup: $.data.true_up_due_cents, due: $.data.amount_due_cents } }
          assert:
            - "pct == 1200000 and mag == 1200000"
            - "trueup == 0   # equality is NOT a true-up"
            - "due == 1200000"

      - name: acdbe_attainment_exactly_at_goal
        grounds:
          - calculations.acdbe_attainment
          - entities.ACDBEReview.fields.attainment_bp
        distinguishing_aspect: |
          Ratio boundary on POST /acdbe-reviews/{id}/evaluate: attainment exactly equal
          to the goal (2000 bp == 2000 bp) is COMPLIANT because the rule is >= — a
          different metric (basis-point ratio) and endpoint than the rent true-up.
        test_recipe:
          setup:
            - "ACTIVE lease with acdbe_goal_bp 2000; one ACCEPTED report 2026-04 gross 1,000,000"
            - "ACDBE review for 2026 SCHEDULED"
          setup_api_calls:
            - { call: "POST /concessions/tenants", payload: { legal_name: "SkyEats LLC", contact_email: "ops@skyeats.com" }, as: AirportAdmin, captures: { t1: $.data.id } }
            - { call: "POST /concessions/leases", payload: { tenant_id: "${t1}", premises_code: "A1", category: "FOOD", term_start_date: "2026-01-01", term_end_date: "2030-12-31", mag_annual_cents: 1200000, pct_rate_below_bp: 800, pct_breakpoint_cents: 500000, pct_rate_above_bp: 1000, acdbe_goal_bp: 2000, ti_allowance_cents: 500000, buildout_deadline: "2026-09-30", min_spe_cents: 1000 }, as: AirportAdmin, captures: { l1: $.data.id } }
            - { call: "POST /concessions/leases/${l1}/transition", payload: { action: "ACTIVATE" }, as: AirportAdmin }
            - { call: "POST /concessions/sales-reports", payload: { lease_id: "${l1}", period_month: "2026-04", gross_sales_cents: 1000000 }, as: Tenant, as_user_id: "${t1}", captures: { r1: $.data.id } }
            - { call: "POST /concessions/sales-reports/${r1}/transition", payload: { action: "SUBMIT" }, as: Tenant, as_user_id: "${t1}" }
            - { call: "POST /concessions/sales-reports/${r1}/transition", payload: { action: "ACCEPT" }, as: ConcessionAnalyst }
            - { call: "POST /concessions/acdbe-reviews", payload: { lease_id: "${l1}", period_year: 2026 }, as: ConcessionAnalyst, captures: { rv: $.data.id } }
          trigger:
            - { call: "POST /concessions/acdbe-reviews/${rv}/evaluate", payload: { certified_revenue_cents: 200000 }, as: ConcessionAnalyst, captures: { att: $.data.attainment_bp, stat: $.data.status, tot: $.data.total_gross_cents } }
          assert:
            - "tot == 1000000"
            - "att == 2000   # exactly the goal"
            - "stat == COMPLIANT   # >= attains"

  # =====================================================================
  # Rule 7 — cross_entity_state_dependency (different entity pairs)
  # =====================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: report_submit_requires_active_lease
        grounds:
          - state_machines.SalesReport.DRAFT_to_SUBMITTED
          - validations[priority=6]
        distinguishing_aspect: |
          Pair SalesReport -> Lease: SUBMIT is rejected with ERR_LEASE_NOT_ACTIVE while
          the lease is DRAFT, even though the report itself is in a submittable state.
        test_recipe:
          setup: ["Lease created but never ACTIVATEd (still DRAFT); DRAFT report exists"]
          setup_api_calls:
            - { call: "POST /concessions/tenants", payload: { legal_name: "SkyEats LLC", contact_email: "ops@skyeats.com" }, as: AirportAdmin, captures: { t1: $.data.id } }
            - { call: "POST /concessions/leases", payload: { tenant_id: "${t1}", premises_code: "A1", category: "FOOD", term_start_date: "2026-01-01", term_end_date: "2030-12-31", mag_annual_cents: 1200000, pct_rate_below_bp: 800, pct_breakpoint_cents: 500000, pct_rate_above_bp: 1000, acdbe_goal_bp: 2000, ti_allowance_cents: 500000, buildout_deadline: "2026-09-30", min_spe_cents: 1000 }, as: AirportAdmin, captures: { l1: $.data.id } }
            - { call: "POST /concessions/sales-reports", payload: { lease_id: "${l1}", period_month: "2026-03", gross_sales_cents: 100000 }, as: Tenant, as_user_id: "${t1}", captures: { r1: $.data.id } }
          trigger:
            - { call: "POST /concessions/sales-reports/${r1}/transition", payload: { action: "SUBMIT" }, as: Tenant, as_user_id: "${t1}", captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_LEASE_NOT_ACTIVE"

      - name: payment_requires_payable_settlement
        grounds:
          - state_machines.RentSettlement
          - validations[priority=11]
        distinguishing_aspect: |
          Pair Payment -> RentSettlement: posting a payment against an ACCRUING
          settlement is rejected with ERR_SETTLEMENT_NOT_PAYABLE — a different entity
          pair than SalesReport -> Lease.
        test_recipe:
          setup: ["ACTIVE lease; settlement 2026 exists and is still ACCRUING (never invoiced)"]
          setup_api_calls:
            - { call: "POST /concessions/tenants", payload: { legal_name: "SkyEats LLC", contact_email: "ops@skyeats.com" }, as: AirportAdmin, captures: { t1: $.data.id } }
            - { call: "POST /concessions/leases", payload: { tenant_id: "${t1}", premises_code: "A1", category: "FOOD", term_start_date: "2026-01-01", term_end_date: "2030-12-31", mag_annual_cents: 1200000, pct_rate_below_bp: 800, pct_breakpoint_cents: 500000, pct_rate_above_bp: 1000, acdbe_goal_bp: 2000, ti_allowance_cents: 500000, buildout_deadline: "2026-09-30", min_spe_cents: 1000 }, as: AirportAdmin, captures: { l1: $.data.id } }
            - { call: "POST /concessions/leases/${l1}/transition", payload: { action: "ACTIVATE" }, as: AirportAdmin }
            - { call: "POST /concessions/settlements", payload: { lease_id: "${l1}", period_year: 2026 }, as: AirportAdmin, captures: { s1: $.data.id } }
          trigger:
            - { call: "POST /concessions/settlements/${s1}/payments", payload: { amount_cents: 100000, method: "ACH" }, as: Tenant, as_user_id: "${t1}", captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_SETTLEMENT_NOT_PAYABLE"

  # =====================================================================
  # Rule 8 — resource_temporal_overlap (different interval semantics)
  # =====================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: premises_term_overlap_half_open
        grounds:
          - validations[priority=21]
          - entities.Lease.fields.premises_code
        distinguishing_aspect: |
          Half-open [start, end) semantics on resource premises_code: a new lease whose
          term_start equals the incumbent's term_end_date is adjacent and ALLOWED
          (201), while one day earlier (2030-12-30) overlaps and is rejected
          (ERR_PREMISES_TERM_OVERLAP).
        test_recipe:
          setup: ["Tenant; lease on premises B2, term 2026-01-01..2030-12-31, ACTIVE"]
          setup_api_calls:
            - { call: "POST /concessions/tenants", payload: { legal_name: "SkyEats LLC", contact_email: "ops@skyeats.com" }, as: AirportAdmin, captures: { t1: $.data.id } }
            - { call: "POST /concessions/leases", payload: { tenant_id: "${t1}", premises_code: "B2", category: "RETAIL", term_start_date: "2026-01-01", term_end_date: "2030-12-31", mag_annual_cents: 1200000, pct_rate_below_bp: 800, pct_breakpoint_cents: 500000, pct_rate_above_bp: 1000, acdbe_goal_bp: 2000, ti_allowance_cents: 500000, buildout_deadline: "2026-09-30", min_spe_cents: 1000 }, as: AirportAdmin, captures: { l1: $.data.id } }
            - { call: "POST /concessions/leases/${l1}/transition", payload: { action: "ACTIVATE" }, as: AirportAdmin }
          trigger:
            - { call: "POST /concessions/leases", payload: { tenant_id: "${t1}", premises_code: "B2", category: "RETAIL", term_start_date: "2030-12-30", term_end_date: "2035-12-31", mag_annual_cents: 1200000, pct_rate_below_bp: 800, pct_breakpoint_cents: 500000, pct_rate_above_bp: 1000, acdbe_goal_bp: 2000, ti_allowance_cents: 500000, buildout_deadline: "2031-09-30", min_spe_cents: 1000 }, as: AirportAdmin, captures: { err: $.data.error_id } }
            - { call: "POST /concessions/leases", payload: { tenant_id: "${t1}", premises_code: "B2", category: "RETAIL", term_start_date: "2030-12-31", term_end_date: "2035-12-31", mag_annual_cents: 1200000, pct_rate_below_bp: 800, pct_breakpoint_cents: 500000, pct_rate_above_bp: 1000, acdbe_goal_bp: 2000, ti_allowance_cents: 500000, buildout_deadline: "2031-09-30", min_spe_cents: 1000 }, as: AirportAdmin, captures: { l2stat: $.data.status } }
          assert:
            - "err == ERR_PREMISES_TERM_OVERLAP   # 2030-12-30 < incumbent end"
            - "l2stat == DRAFT   # adjacency allowed: start == incumbent end"

      - name: waiver_buffer_gap_rule
        grounds:
          - validations[priority=26]
          - entities.OperatingHoursWaiver.fields.closure_start_date
        distinguishing_aspect: |
          Buffer-gap semantics on resource lease-closure-calendar: two APPROVED waivers
          of the same lease must be separated by >= 14 days — a gap of 5 days is rejected
          (ERR_WAIVER_BUFFER_VIOLATION) while exactly 14 days is allowed; unlike the
          half-open premises rule, mere adjacency is NOT enough — a different interval
          semantic on a different resource.
        test_recipe:
          setup: ["ACTIVE lease; waiver W1 2026-10-01..2026-10-05 APPROVED; waiver W2 2026-10-10..2026-10-12 REQUESTED; waiver W3 2026-10-19..2026-10-20 REQUESTED"]
          setup_api_calls:
            - { call: "POST /concessions/tenants", payload: { legal_name: "SkyEats LLC", contact_email: "ops@skyeats.com" }, as: AirportAdmin, captures: { t1: $.data.id } }
            - { call: "POST /concessions/leases", payload: { tenant_id: "${t1}", premises_code: "A1", category: "FOOD", term_start_date: "2026-01-01", term_end_date: "2030-12-31", mag_annual_cents: 1200000, pct_rate_below_bp: 800, pct_breakpoint_cents: 500000, pct_rate_above_bp: 1000, acdbe_goal_bp: 2000, ti_allowance_cents: 500000, buildout_deadline: "2026-09-30", min_spe_cents: 1000 }, as: AirportAdmin, captures: { l1: $.data.id } }
            - { call: "POST /concessions/leases/${l1}/transition", payload: { action: "ACTIVATE" }, as: AirportAdmin }
            - { call: "POST /concessions/waivers", payload: { lease_id: "${l1}", closure_start_date: "2026-10-01", closure_end_date: "2026-10-05", reason: "renovation" }, as: Tenant, as_user_id: "${t1}", captures: { w1: $.data.id } }
            - { call: "POST /concessions/waivers/${w1}/transition", payload: { action: "APPROVE" }, as: AirportAdmin }
            - { call: "POST /concessions/waivers", payload: { lease_id: "${l1}", closure_start_date: "2026-10-10", closure_end_date: "2026-10-12", reason: "deep clean" }, as: Tenant, as_user_id: "${t1}", captures: { w2: $.data.id } }
            - { call: "POST /concessions/waivers", payload: { lease_id: "${l1}", closure_start_date: "2026-10-19", closure_end_date: "2026-10-20", reason: "equipment swap" }, as: Tenant, as_user_id: "${t1}", captures: { w3: $.data.id } }
          trigger:
            - { call: "POST /concessions/waivers/${w2}/transition", payload: { action: "APPROVE" }, as: AirportAdmin, captures: { err: $.data.error_id } }
            - { call: "POST /concessions/waivers/${w3}/transition", payload: { action: "APPROVE" }, as: AirportAdmin, captures: { w3stat: $.data.status } }
          assert:
            - "err == ERR_WAIVER_BUFFER_VIOLATION   # gap 2026-10-05 -> 2026-10-10 is 5 days < 14"
            - "w3stat == APPROVED   # gap 14 days >= 14 allowed"

  # =====================================================================
  # Rule 9 — compensating_invariant (different conserved quantities)
  # =====================================================================
  - rule_id: compensating_invariant
    instances:
      - name: ti_approve_cancel_conserves_allowance
        grounds:
          - calculations.ti_allowance_reconciliation
          - state_machines.TIDraw.APPROVED_to_CANCELLED
        distinguishing_aspect: |
          Conserved quantity: TI allowance dollars. Invariant disbursed + approved_pending
          + ti_remaining_cents == ti_allowance_cents (500,000): APPROVE moves 100,000 into
          the reserve (remaining 400,000) and the compensating CANCEL restores remaining
          to exactly 500,000 with zero drift.
        test_recipe:
          setup: ["ACTIVE lease, ti_allowance 500,000; draw D1 100,000 REQUESTED"]
          setup_api_calls:
            - { call: "POST /concessions/tenants", payload: { legal_name: "SkyEats LLC", contact_email: "ops@skyeats.com" }, as: AirportAdmin, captures: { t1: $.data.id } }
            - { call: "POST /concessions/leases", payload: { tenant_id: "${t1}", premises_code: "A1", category: "FOOD", term_start_date: "2026-01-01", term_end_date: "2030-12-31", mag_annual_cents: 1200000, pct_rate_below_bp: 800, pct_breakpoint_cents: 500000, pct_rate_above_bp: 1000, acdbe_goal_bp: 2000, ti_allowance_cents: 500000, buildout_deadline: "2026-09-30", min_spe_cents: 1000 }, as: AirportAdmin, captures: { l1: $.data.id, rem_pre: $.data.ti_remaining_cents } }
            - { call: "POST /concessions/leases/${l1}/transition", payload: { action: "ACTIVATE" }, as: AirportAdmin }
            - { call: "POST /concessions/ti-draws", payload: { lease_id: "${l1}", amount_cents: 100000, milestone: "DESIGN" }, as: Tenant, as_user_id: "${t1}", captures: { d1: $.data.id } }
            - { call: "POST /concessions/ti-draws/${d1}/transition", payload: { action: "APPROVE" }, as: AirportAdmin }
            - { call: "GET /concessions/leases/${l1}", payload: {}, as: AirportAdmin, captures: { rem_mid: $.data.ti_remaining_cents } }
          trigger:
            - { call: "POST /concessions/ti-draws/${d1}/transition", payload: { action: "CANCEL" }, as: Tenant, as_user_id: "${t1}", captures: { dstat: $.data.status } }
            - { call: "GET /concessions/leases/${l1}", payload: {}, as: AirportAdmin, captures: { rem_post: $.data.ti_remaining_cents } }
          assert:
            - "rem_pre == 500000"
            - "rem_mid == 400000   # reserve held"
            - "dstat == CANCELLED"
            - "rem_post == 500000   # invariant: disbursed(0) + approved(0) + remaining == 500,000"

      - name: payment_post_void_conserves_ledger
        grounds:
          - calculations.annual_rent_settlement
          - state_machines.Payment.POSTED_to_VOIDED
        distinguishing_aspect: |
          Conserved quantity: settlement ledger cents. Invariant amount_paid_cents +
          balance_due_cents == amount_due_cents: POST 300,000 then VOID returns
          amount_paid to 0 and balance_due to exactly amount_due (1,200,000) with status
          back to INVOICED — a different conserved quantity (rent ledger vs TI allowance).
        test_recipe:
          setup:
            - "ACTIVE lease; settlement 2026 INVOICED with amount_due 1,200,000 (no reports; FINAL variant)"
            - "Payment P1 of 300,000 POSTED (status PARTIALLY_PAID)"
          setup_api_calls:
            - { call: "POST /concessions/tenants", payload: { legal_name: "SkyEats LLC", contact_email: "ops@skyeats.com" }, as: AirportAdmin, captures: { t1: $.data.id } }
            - { call: "POST /concessions/leases", payload: { tenant_id: "${t1}", premises_code: "A1", category: "FOOD", term_start_date: "2026-01-01", term_end_date: "2030-12-31", mag_annual_cents: 1200000, pct_rate_below_bp: 800, pct_breakpoint_cents: 500000, pct_rate_above_bp: 1000, acdbe_goal_bp: 2000, ti_allowance_cents: 500000, buildout_deadline: "2026-09-30", min_spe_cents: 1000 }, as: AirportAdmin, captures: { l1: $.data.id } }
            - { call: "POST /concessions/leases/${l1}/transition", payload: { action: "ACTIVATE" }, as: AirportAdmin }
            - { call: "POST /concessions/settlements", payload: { lease_id: "${l1}", period_year: 2026 }, as: AirportAdmin, captures: { s1: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2027-01-15T00:00:00Z" }, as: AirportAdmin }
            - { call: "POST /concessions/settlements/${s1}/invoice", payload: {}, as: ConcessionAnalyst, captures: { due: $.data.amount_due_cents } }
            - { call: "POST /concessions/settlements/${s1}/payments", payload: { amount_cents: 300000, method: "ACH" }, as: Tenant, as_user_id: "${t1}", captures: { p1: $.data.id } }
          trigger:
            - { call: "POST /concessions/payments/${p1}/void", payload: {}, as: ConcessionAnalyst, captures: { pstat: $.data.status } }
            - { call: "GET /concessions/settlements/${s1}", payload: {}, as: ConcessionAnalyst, captures: { paid: $.data.amount_paid_cents, bal: $.data.balance_due_cents, sstat: $.data.status } }
          assert:
            - "due == 1200000"
            - "pstat == VOIDED"
            - "paid == 0 and bal == 1200000"
            - "sstat == INVOICED   # void re-derives status"
            - "paid + bal == due   # ledger conserved across post+void"
