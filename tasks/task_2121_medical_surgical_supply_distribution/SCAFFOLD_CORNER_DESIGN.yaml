            - "after WITHDRAW: SubstitutionRequest.${sub_id}.status == WITHDRAWN and OrderLine.${line_id}.line_status == CANCELLED"
            - "${err2} == ERR_ORDER_LINE_STATE_INVALID with HTTP 409 - a CANCELLED line accepts no new substitution request"

