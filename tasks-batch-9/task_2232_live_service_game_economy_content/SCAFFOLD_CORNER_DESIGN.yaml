              as: EconomyDesigner
              as_user_id: "u_designer_1"
              captures: { offer_id: $.data.id }
            - call: "POST /offers/${offer_id}/submit"
              payload: {}
              as: EconomyDesigner
              as_user_id: "u_designer_1"
          trigger:
            - call: "POST /offers"
              payload: { season_id: "${season_id}", offer_type: "BUNDLE", sku: "CP_PACK", price_tier: "T1", list_price_minor: 900, line_items: [{ sku: "CP_COINS", base_price_minor: 900, declared_value_minor: 1200, granted_currency_code: "SOFT_COIN", granted_amount_minor: 1200 }], window_start: "2026-08-01T00:00:00Z", window_end: "2026-08-20T00:00:00Z" }
              as: ContentProducer
              as_user_id: "u_producer_1"
              captures: { e1: $.data.error_id }
            - call: "POST /offers/${offer_id}/review"
              payload: { decision: "APPROVE" }
              as: EconomyDesigner
              as_user_id: "u_designer_1"
              captures: { e2: $.data.error_id }
            - call: "POST /offers/${offer_id}/review"
