      - name: opening_a_service_appointment_from_a_no_action_triage_is_refused
        claim_type: violation_to_error
        grounds:
          - errors[ERR_TRIAGE_NO_SERVICE_REQUIRED]
          - state_machines.ServiceAppointment.initial_state
          - calculations.service_triage_outcome
        distinguishing_aspect: "A LOW driveable fault on a vehicle with no prior report resolves to MOBILE_REQUIRED, so this corner needs a REPEAT report on the same fault code, which short-circuits to NO_ACTION and makes the appointment call fail 409 with ERR_TRIAGE_NO_SERVICE_REQUIRED."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z; a delivered vehicle whose first report is LOW and driveable, with no earlier report carrying the same fault code."
          setup_api_calls:
            - *c_clock
