            - { call: "POST /safety/contractor-orgs", payload: { name: "Acme Erectors", contact_email: "safety@acme.example", emr: 0.80, trir: 2.0, safety_audit_pct: 100, insurance_cert_expires_on: "2026-12-15" }, as: EHSAdmin, captures: { c_id: $.data.id } }
