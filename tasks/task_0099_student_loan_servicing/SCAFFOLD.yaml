scenario: |
  Federal Student Loan Servicing System: Loan types (Direct Subsidized/Unsubsidized/PLUS),
  Income-Driven Repayment plans (IBR/PAYE/SAVE), PSLF (Public Service Loan Forgiveness),
  grace periods/deferment/forbearance, default collections, veteran loan forgiveness.

domain_name: "fed-student-loan-servicing"
api_prefix: "/borrowers"

complexity_profile:
  primary_archetype: "compliance_audit"
  secondary_archetype: "ledger_reconciliation"
  complexity_layers:
    - "dual_variant_calculation"
    - "cascading_side_effects"
    - "rate_threshold_triggers"
    - "scheduled_deferred_actions"
    - "derived_field_reconciliation"
  entity_topology: "hybrid"
  state_machine_shape: "branching"
  relationship_patterns:
    - "one_to_many"
    - "many_to_many"
    - "cross_aggregate"
  role_model: "segregation_of_duties"
  consistency_model: "immediate"

# =============================================================================
# §1.0 Response Envelope (VERBATIM)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Borrower
    parent: null
    common_fields: true
    fields:
      - name: ssn_last4
        type: string
        source: input
        description: "Last four digits of SSN, used for identity confirmation."
        constraints: "Exactly 4 numeric characters."
      - name: full_name
        type: string
        source: input
        description: "Borrower legal name."
      - name: family_size
        type: integer
        source: input
        description: "Household size used for IDR poverty-guideline calculations."
        default: 1
        constraints: "Integer >= 1."
      - name: state_code
        type: string
        source: input
        description: "Two-letter US state code; controls poverty-guideline table (48 contiguous vs AK vs HI)."
        constraints: "Enum of US state codes."
      - name: adjusted_gross_income_cents
        type: integer
        source: input
        description: "Most recently certified AGI in cents."
        default: 0
        constraints: "Non-negative integer."
      - name: agi_certified_at
        type: datetime
        source: input
        description: "Timestamp when borrower last certified AGI."
        default: null
      - name: veteran_status
        type: enum
        source: input
        description: "Borrower veteran category for veteran-loan-forgiveness eligibility."
        default: NONE
        constraints: "Enum {NONE, VETERAN, TPD_VETERAN} where TPD_VETERAN = total and permanent VA disability rating."
      - name: aggregate_principal_balance_cents
        type: integer
        source: computed
        description: "Sum of Loan.principal_balance_cents across this borrower's non-terminal loans."
        default: 0
      - name: aggregate_interest_balance_cents
        type: integer
        source: computed
        description: "Sum of Loan.accrued_interest_cents across this borrower's non-terminal loans."
        default: 0

  - name: Loan
    parent: Borrower
    common_fields: true
    fields:
      - name: borrower_id
        type: string
        source: input
        description: "Owning Borrower.id."
      - name: loan_type
        type: enum
        source: input
        description: "Federal loan product."
        constraints: "Enum {DIRECT_SUBSIDIZED, DIRECT_UNSUBSIDIZED, DIRECT_PLUS}."
      - name: original_principal_cents
        type: integer
        source: input
        description: "Disbursed principal in cents."
        constraints: "Positive integer."
      - name: principal_balance_cents
        type: integer
        source: computed
        description: "Current outstanding principal in cents."
      - name: accrued_interest_cents
        type: integer
        source: computed
        description: "Unpaid interest accrued and not yet capitalized."
        default: 0
      - name: capitalized_interest_cents
        type: integer
        source: computed
        description: "Total interest historically capitalized into principal."
        default: 0
      - name: interest_rate_bps
        type: integer
        source: input
        description: "Annual interest rate in basis points (1bps = 0.01%)."
        constraints: "Positive integer <= 2000."
      - name: disbursement_date
        type: datetime
        source: input
        description: "Date loan was disbursed; starts in-school or grace clock."
      - name: status
        type: enum
        source: computed
        description: "Loan lifecycle state (see §1.2)."
        default: IN_SCHOOL
        constraints: "Enum {IN_SCHOOL, GRACE, REPAYMENT, DEFERMENT, FORBEARANCE, DELINQUENT, DEFAULT, REHABILITATION, PAID_OFF, DISCHARGED}."
      - name: status_entered_at
        type: datetime
        source: computed
        description: "Timestamp of last transition into current status; used for grace/default clocks."
      - name: last_accrual_at
        type: datetime
        source: computed
        description: "Last instant interest accrual was advanced to."
      - name: last_payment_due_at
        type: datetime
        source: computed
        description: "Due date of the most recent scheduled installment."
        default: null
      - name: days_past_due
        type: integer
        source: computed
        description: "Days since last_payment_due_at without sufficient payment."
        default: 0
      - name: qualifying_pslf_payment_count
        type: integer
        source: computed
        description: "Number of PSLF-qualifying payments credited to this loan."
        default: 0

  - name: RepaymentPlan
    parent: Borrower
    common_fields: true
    fields:
      - name: borrower_id
        type: string
        source: input
        description: "Owning Borrower.id."
      - name: plan_type
        type: enum
        source: input
        description: "Plan family."
        constraints: "Enum {STANDARD_10, IBR, PAYE, SAVE}."
      - name: status
        type: enum
        source: computed
        description: "Plan lifecycle."
        default: PENDING
        constraints: "Enum {PENDING, ACTIVE, SUPERSEDED, TERMINATED}."
      - name: effective_from
        type: datetime
        source: computed
        description: "Timestamp plan became active."
        default: null
      - name: certified_agi_cents
        type: integer
        source: computed
        description: "AGI snapshot captured at plan activation (IDR only)."
        default: 0
      - name: certified_family_size
        type: integer
        source: computed
        description: "Family size snapshot captured at plan activation (IDR only)."
        default: 0
      - name: monthly_payment_cents
        type: integer
        source: computed
        description: "Currently scheduled monthly installment in cents."
        default: 0
      - name: recertification_due_at
        type: datetime
        source: computed
        description: "Date by which next AGI/family recertification is required (IDR only)."
        default: null
      - name: included_loan_ids
        type: array
        source: input
        description: "Loan ids enrolled under this plan."

  - name: Payment
    parent: Borrower
    common_fields: false
    fields:
      - name: borrower_id
        type: string
        source: input
        description: "Owning Borrower.id."
      - name: amount_cents
        type: integer
        source: input
        description: "Payment amount in cents."
        constraints: "Positive integer."
      - name: received_at
        type: datetime
        source: input
        description: "Timestamp payment was received (defaults to current clock)."
      - name: source
        type: enum
        source: input
        description: "Payment source."
        default: BORROWER
        constraints: "Enum {BORROWER, EMPLOYER, ADMINISTRATIVE_WAGE_GARNISHMENT, TREASURY_OFFSET}."
      - name: pslf_qualifying
        type: boolean
        source: computed
        description: "True iff this payment counts toward PSLF (see §1.3 pslf_qualification_check)."
        default: false
      - name: allocations
        type: array
        source: computed
        description: "Per-loan breakdown {loan_id, fees_cents, interest_cents, principal_cents}."
        default: []

  - name: EmploymentCertification
    parent: Borrower
    common_fields: true
    fields:
      - name: borrower_id
        type: string
        source: input
        description: "Owning Borrower.id."
      - name: employer_name
        type: string
        source: input
        description: "Employer legal name."
      - name: employer_type
        type: enum
        source: input
        description: "Public-service eligibility class."
        constraints: "Enum {GOVERNMENT, NONPROFIT_501C3, OTHER_NONPROFIT_QUALIFYING, PRIVATE_NON_QUALIFYING}."
      - name: period_start
        type: datetime
        source: input
        description: "Employment period start (inclusive)."
      - name: period_end
        type: datetime
        source: input
        description: "Employment period end (inclusive)."
      - name: status
        type: enum
        source: computed
        description: "Certification lifecycle."
        default: SUBMITTED
        constraints: "Enum {SUBMITTED, APPROVED, REJECTED}."
      - name: reviewed_by
        type: string
        source: computed
        description: "ServicerCertifier user id who approved/rejected."
        default: null
      - name: rejection_reason
        type: string
        source: computed
        description: "Free-text reason when status=REJECTED."
        default: null

  - name: HardshipRequest
    parent: Borrower
    common_fields: true
    fields:
      - name: borrower_id
        type: string
        source: input
        description: "Owning Borrower.id."
      - name: kind
        type: enum
        source: input
        description: "Hardship category."
        constraints: "Enum {DEFERMENT_IN_SCHOOL, DEFERMENT_UNEMPLOYMENT, DEFERMENT_ECONOMIC_HARDSHIP, DEFERMENT_MILITARY, FORBEARANCE_GENERAL, FORBEARANCE_MANDATORY}."
      - name: requested_from
        type: datetime
        source: input
        description: "Start date of the requested period."
      - name: requested_to
        type: datetime
        source: input
        description: "End date of the requested period."
      - name: cumulative_forbearance_days_at_request
        type: integer
        source: computed
        description: "Borrower's total cumulative FORBEARANCE_GENERAL days at submission (used by validation 36-month cap)."
        default: 0
      - name: status
        type: enum
        source: computed
        description: "Request lifecycle."
        default: SUBMITTED
        constraints: "Enum {SUBMITTED, APPROVED, REJECTED, CANCELLED}."
      - name: applied_loan_ids
        type: array
        source: input
        description: "Subset of borrower loans this hardship applies to."

  - name: DischargeApplication
    parent: Borrower
    common_fields: true
    fields:
      - name: borrower_id
        type: string
        source: input
        description: "Owning Borrower.id."
      - name: program
        type: enum
        source: input
        description: "Discharge program."
        constraints: "Enum {PSLF, VETERAN_TPD}."
      - name: status
        type: enum
        source: computed
        description: "Application lifecycle."
        default: SUBMITTED
        constraints: "Enum {SUBMITTED, UNDER_REVIEW, APPROVED, REJECTED}."
      - name: approved_loan_ids
        type: array
        source: computed
        description: "Loan ids actually discharged (set at approval)."
        default: []
      - name: discharged_principal_cents
        type: integer
        source: computed
        description: "Sum of principal_balance_cents at approval across approved_loan_ids."
        default: 0
      - name: discharged_interest_cents
        type: integer
        source: computed
        description: "Sum of accrued_interest_cents at approval across approved_loan_ids."
        default: 0
      - name: reviewed_by
        type: string
        source: computed
        description: "ServicerApprover user id (must differ from any ServicerCertifier on supporting evidence)."
        default: null

  - name: CollectionsAction
    parent: Borrower
    common_fields: false
    fields:
      - name: borrower_id
        type: string
        source: input
        description: "Owning Borrower.id."
      - name: loan_id
        type: string
        source: input
        description: "Target loan."
      - name: kind
        type: enum
        source: input
        description: "Collections action category."
        constraints: "Enum {DEFAULT_DECLARATION, REHAB_AGREEMENT_OPEN, REHAB_PAYMENT_RECORDED, REHAB_COMPLETED, WAGE_GARNISHMENT_ORDER, TREASURY_OFFSET_APPLIED}."
      - name: amount_cents
        type: integer
        source: input
        description: "Action monetary amount (0 for non-financial actions)."
        default: 0
      - name: occurred_at
        type: datetime
        source: input
        description: "Effective timestamp."
      - name: recorded_by
        type: string
        source: computed
        description: "CollectionsOfficer user id."

  - name: ClockState
    parent: null
    common_fields: false
    fields:
      - name: now
        type: datetime
        source: system
        description: "Server-controlled simulation clock for tests; advanced via /_clock/advance."
        default: "2025-01-01T00:00:00.000Z"

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Loan
    initial_state: IN_SCHOOL
    terminal_states: [PAID_OFF, DISCHARGED]
    transitions:
      - from: IN_SCHOOL
        to: GRACE
        trigger: "POST /borrowers/{bid}/loans/{lid}/separate"
        actor: ServicerAdmin
        preconditions:
          - "Loan.status == IN_SCHOOL"
        side_effects:
          - "Set Loan.status_entered_at = now; Loan.last_accrual_at = now"
          - "For DIRECT_UNSUBSIDIZED and DIRECT_PLUS only: interest continues accruing (will appear in accrued_interest_cents on next /_clock/advance)"
          - "For DIRECT_SUBSIDIZED: interest does NOT accrue in GRACE (subsidy_eligible window)"
      - from: GRACE
        to: REPAYMENT
        trigger: "system: /_clock/advance crosses status_entered_at + GRACE_DAYS (180)"
        actor: system
        preconditions:
          - "now >= status_entered_at + 180 days"
        side_effects:
          - "Set Loan.last_payment_due_at = first day of month >= now"
          - "Capitalize accrued_interest_cents on DIRECT_UNSUBSIDIZED & DIRECT_PLUS (principal_balance_cents += accrued_interest_cents; capitalized_interest_cents += accrued_interest_cents; accrued_interest_cents = 0)"
      - from: IN_SCHOOL
        to: REPAYMENT
        trigger: "POST /borrowers/{bid}/loans/{lid}/separate with skip_grace=true (PLUS only)"
        actor: ServicerAdmin
        preconditions:
          - "Loan.loan_type == DIRECT_PLUS"
        side_effects:
          - "Capitalize accrued_interest_cents on PLUS"
          - "Set Loan.last_payment_due_at = first day of month >= now"
      - from: REPAYMENT
        to: DELINQUENT
        trigger: "system: /_clock/advance with days_past_due >= 1 (computed nightly)"
        actor: system
        preconditions:
          - "now > last_payment_due_at AND monthly installment unpaid"
        side_effects:
          - "Loan.days_past_due = floor((now - last_payment_due_at).days)"
      - from: DELINQUENT
        to: REPAYMENT
        trigger: "POST /borrowers/{bid}/payments cures past-due installments"
        actor: Borrower
        preconditions:
          - "Payment allocation brings days_past_due back to 0"
        side_effects:
          - "Loan.days_past_due = 0; Loan.last_payment_due_at advances by N months covered"
      - from: DELINQUENT
        to: DEFAULT
        trigger: "system: /_clock/advance crosses days_past_due >= 270 (federal definition)"
        actor: system
        preconditions:
          - "Loan.days_past_due >= 270"
          - "Loan.status == DELINQUENT"
        side_effects:
          - "Capitalize accrued_interest_cents into principal_balance_cents on this loan"
          - "Append CollectionsAction(kind=DEFAULT_DECLARATION, amount_cents=0)"
          - "Cancel any ACTIVE RepaymentPlan whose included_loan_ids contains this loan (cascade: plan.status -> TERMINATED)"
          - "Borrower's other loans referenced by the same terminated plan move to REPAYMENT with last_payment_due_at = first day of month >= now (cross-aggregate cascade depth 3: Loan->Plan->sibling Loans)"
      - from: DEFAULT
        to: REHABILITATION
        trigger: "POST /borrowers/{bid}/loans/{lid}/collections {kind: REHAB_AGREEMENT_OPEN}"
        actor: CollectionsOfficer
        preconditions:
          - "Loan.status == DEFAULT"
          - "No prior REHAB_COMPLETED action exists for this loan (one rehab per lifetime)"
        side_effects:
          - "Loan.status_entered_at = now (resets rehab clock)"
      - from: REHABILITATION
        to: REPAYMENT
        trigger: "system: /_clock/advance after 9 qualifying REHAB_PAYMENT_RECORDED actions within 10 consecutive months"
        actor: system
        preconditions:
          - "count(REHAB_PAYMENT_RECORDED in last 10 months) >= 9"
        side_effects:
          - "Append CollectionsAction(kind=REHAB_COMPLETED)"
          - "Reverse default flag (compensating action): clear days_past_due to 0; remove DEFAULT_DECLARATION from active collections set"
          - "Conserved invariant: principal_balance_cents + accrued_interest_cents + lifetime_paid_cents unchanged across the rehab cycle (REHAB_PAYMENT_RECORDED amounts are applied as Payments via §1.3 payment_allocation_waterfall, so totals reconcile)"
      - from: REPAYMENT
        to: DEFERMENT
        trigger: "PATCH /borrowers/{bid}/hardship-requests/{rid} {status: APPROVED} where kind starts with DEFERMENT_"
        actor: ServicerCertifier
        preconditions:
          - "HardshipRequest.kind in DEFERMENT_* set"
          - "Loan.id in HardshipRequest.applied_loan_ids"
        side_effects:
          - "Loan.status_entered_at = now"
          - "For DIRECT_SUBSIDIZED: interest accrual paused (subsidy applies); for UNSUBSIDIZED/PLUS: continues to accrue"
      - from: REPAYMENT
        to: FORBEARANCE
        trigger: "PATCH /borrowers/{bid}/hardship-requests/{rid} {status: APPROVED} where kind starts with FORBEARANCE_"
        actor: ServicerCertifier
        preconditions:
          - "HardshipRequest.kind in FORBEARANCE_* set"
          - "Loan.id in HardshipRequest.applied_loan_ids"
        side_effects:
          - "Loan.status_entered_at = now"
          - "Interest continues to accrue on ALL loan types during forbearance"
      - from: DELINQUENT
        to: FORBEARANCE
        trigger: "PATCH /borrowers/{bid}/hardship-requests/{rid} {status: APPROVED} where kind = FORBEARANCE_*"
        actor: ServicerCertifier
        preconditions:
          - "Loan.status == DELINQUENT"
          - "HardshipRequest.kind in FORBEARANCE_* set"
        side_effects:
          - "Loan.days_past_due = 0 (forbearance cures delinquency)"
          - "Loan.status_entered_at = now"
      - from: DEFERMENT
        to: REPAYMENT
        trigger: "system: /_clock/advance crosses HardshipRequest.requested_to"
        actor: system
        preconditions:
          - "now >= HardshipRequest.requested_to"
        side_effects:
          - "Capitalize accrued_interest_cents on UNSUBSIDIZED & PLUS; SUBSIDIZED keeps zero accrued (subsidy)"
          - "Loan.last_payment_due_at = first day of month >= now"
      - from: FORBEARANCE
        to: REPAYMENT
        trigger: "system: /_clock/advance crosses HardshipRequest.requested_to"
        actor: system
        preconditions:
          - "now >= HardshipRequest.requested_to"
        side_effects:
          - "Capitalize accrued_interest_cents on ALL loan types"
          - "Loan.last_payment_due_at = first day of month >= now"
      - from: REPAYMENT
        to: PAID_OFF
        trigger: "POST /borrowers/{bid}/payments brings principal_balance_cents + accrued_interest_cents to 0"
        actor: Borrower
        preconditions:
          - "post-allocation principal_balance_cents == 0 AND accrued_interest_cents == 0"
        side_effects:
          - "Loan.status = PAID_OFF; status_entered_at = now"
      - from: REPAYMENT
        to: DISCHARGED
        trigger: "PATCH /borrowers/{bid}/discharge-applications/{aid} {status: APPROVED} (PSLF or VETERAN_TPD)"
        actor: ServicerApprover
        preconditions:
          - "DischargeApplication.status == UNDER_REVIEW"
          - "Loan.id in DischargeApplication.approved_loan_ids"
          - "For PSLF: §1.3 pslf_qualification_check produces qualifying_pslf_payment_count >= 120 across approved_loan_ids"
          - "For VETERAN_TPD: Borrower.veteran_status == TPD_VETERAN"
        side_effects:
          - "Loan.principal_balance_cents = 0; accrued_interest_cents = 0"
          - "Loan.status = DISCHARGED; status_entered_at = now"
      - from: DELINQUENT
        to: DISCHARGED
        trigger: "PATCH /borrowers/{bid}/discharge-applications/{aid} {status: APPROVED} VETERAN_TPD only"
        actor: ServicerApprover
        preconditions:
          - "Borrower.veteran_status == TPD_VETERAN"
          - "DischargeApplication.program == VETERAN_TPD"
        side_effects:
          - "Same as REPAYMENT->DISCHARGED above"
      - from: FORBEARANCE
        to: DISCHARGED
        trigger: "PATCH /borrowers/{bid}/discharge-applications/{aid} {status: APPROVED} VETERAN_TPD only"
        actor: ServicerApprover
        preconditions:
          - "Borrower.veteran_status == TPD_VETERAN"
        side_effects:
          - "Same as REPAYMENT->DISCHARGED above"

  - entity: RepaymentPlan
    initial_state: PENDING
    terminal_states: [SUPERSEDED, TERMINATED]
    transitions:
      - from: PENDING
        to: ACTIVE
        trigger: "POST /borrowers/{bid}/plans/{pid}/activate"
        actor: Borrower
        preconditions:
          - "All included_loan_ids belong to Borrower and Loan.status in {REPAYMENT, GRACE}"
          - "For IDR plans: Borrower.adjusted_gross_income_cents present and Borrower.agi_certified_at within last 365 days"
          - "No DEFAULT loan in included_loan_ids"
        side_effects:
          - "If borrower has another ACTIVE plan whose included_loan_ids overlap, cascade: that other plan transitions ACTIVE->SUPERSEDED (parallel-state-machine cascade depth 2: Plan A activation -> Plan B SUPERSEDED -> recompute Plan B's loans' monthly_payment_cents via included plan)"
          - "RepaymentPlan.effective_from = now"
          - "Snapshot certified_agi_cents and certified_family_size from Borrower (for IDR only; STANDARD_10 sets both to 0)"
          - "Compute monthly_payment_cents via §1.3 monthly_payment_calc"
          - "Set recertification_due_at = now + 365 days for IDR; null for STANDARD_10"
      - from: ACTIVE
        to: SUPERSEDED
        trigger: "POST /borrowers/{bid}/plans/{pid}/activate on a different overlapping plan"
        actor: system
        preconditions:
          - "Another ACTIVE plan overlaps on included_loan_ids"
        side_effects:
          - "RepaymentPlan.status = SUPERSEDED"
      - from: ACTIVE
        to: TERMINATED
        trigger: "system: cascade from Loan DELINQUENT->DEFAULT"
        actor: system
        preconditions:
          - "Some Loan in included_loan_ids transitions to DEFAULT"
        side_effects:
          - "RepaymentPlan.status = TERMINATED"
          - "All non-defaulted loans previously included move to REPAYMENT at standard 10-year amortization (depth-3 cascade origin)"
      - from: PENDING
        to: TERMINATED
        trigger: "DELETE /borrowers/{bid}/plans/{pid}"
        actor: Borrower
        preconditions: ["RepaymentPlan.status == PENDING"]
        side_effects: []

  - entity: HardshipRequest
    initial_state: SUBMITTED
    terminal_states: [APPROVED, REJECTED, CANCELLED]
    transitions:
      - from: SUBMITTED
        to: APPROVED
        trigger: "PATCH /borrowers/{bid}/hardship-requests/{rid} {status: APPROVED}"
        actor: ServicerCertifier
        preconditions:
          - "Cumulative FORBEARANCE_GENERAL days across borrower's history + (requested_to - requested_from).days <= 1095 (36 months)"
          - "For DEFERMENT_IN_SCHOOL: Loan.loan_type != DIRECT_PLUS for parent PLUS borrowers (only on subsidized/unsubsidized)"
          - "No applied_loan_ids in DEFAULT"
        side_effects:
          - "Each applied loan transitions per §1.2 Loan state machine"
      - from: SUBMITTED
        to: REJECTED
        trigger: "PATCH /borrowers/{bid}/hardship-requests/{rid} {status: REJECTED}"
        actor: ServicerCertifier
        preconditions: ["HardshipRequest.status == SUBMITTED"]
        side_effects:
          - "rejection_reason recorded"
      - from: SUBMITTED
        to: CANCELLED
        trigger: "DELETE /borrowers/{bid}/hardship-requests/{rid}"
        actor: Borrower
        preconditions: ["HardshipRequest.status == SUBMITTED"]
        side_effects: []

  - entity: DischargeApplication
    initial_state: SUBMITTED
    terminal_states: [APPROVED, REJECTED]
    transitions:
      - from: SUBMITTED
        to: UNDER_REVIEW
        trigger: "PATCH /borrowers/{bid}/discharge-applications/{aid} {status: UNDER_REVIEW}"
        actor: ServicerCertifier
        preconditions:
          - "DischargeApplication.status == SUBMITTED"
          - "For PSLF: at least one EmploymentCertification.status == APPROVED exists for this borrower"
        side_effects: []
      - from: UNDER_REVIEW
        to: APPROVED
        trigger: "PATCH /borrowers/{bid}/discharge-applications/{aid} {status: APPROVED, approved_loan_ids: [...]}"
        actor: ServicerApprover
        preconditions:
          - "ServicerApprover.id != any EmploymentCertification.reviewed_by referenced by this borrower's APPROVED certifications (segregation of duties)"
          - "Every approved_loan_ids belongs to borrower and Loan.status in {REPAYMENT, DELINQUENT, FORBEARANCE} (DEFAULT loans require rehab first; PAID_OFF/DISCHARGED ineligible)"
          - "For PSLF: §1.3 pslf_qualification_check qualifying_pslf_payment_count >= 120 for each approved loan"
          - "For VETERAN_TPD: Borrower.veteran_status == TPD_VETERAN"
        side_effects:
          - "Each approved loan transitions to DISCHARGED (depth-2 cascade: DischargeApplication.APPROVED -> Loan.DISCHARGED -> Borrower.aggregate_principal_balance_cents recomputed)"
          - "discharged_principal_cents = sum of principal_balance_cents pre-discharge"
          - "discharged_interest_cents = sum of accrued_interest_cents pre-discharge"
      - from: UNDER_REVIEW
        to: REJECTED
        trigger: "PATCH /borrowers/{bid}/discharge-applications/{aid} {status: REJECTED}"
        actor: ServicerApprover
        preconditions: ["DischargeApplication.status == UNDER_REVIEW"]
        side_effects: []
      - from: SUBMITTED
        to: REJECTED
        trigger: "PATCH /borrowers/{bid}/discharge-applications/{aid} {status: REJECTED}"
        actor: ServicerCertifier
        preconditions: ["DischargeApplication.status == SUBMITTED"]
        side_effects: []

  - entity: EmploymentCertification
    initial_state: SUBMITTED
    terminal_states: [APPROVED, REJECTED]
    transitions:
      - from: SUBMITTED
        to: APPROVED
        trigger: "PATCH /borrowers/{bid}/employment-certifications/{cid} {status: APPROVED}"
        actor: ServicerCertifier
        preconditions:
          - "employer_type in {GOVERNMENT, NONPROFIT_501C3, OTHER_NONPROFIT_QUALIFYING}"
          - "period_start < period_end"
        side_effects:
          - "Set reviewed_by = X-User-ID"
          - "Trigger §1.3 pslf_qualification_check across all REPAYMENT Loans (recount qualifying_pslf_payment_count over Payments whose received_at falls in any APPROVED certification window)"
      - from: SUBMITTED
        to: REJECTED
        trigger: "PATCH /borrowers/{bid}/employment-certifications/{cid} {status: REJECTED}"
        actor: ServicerCertifier
        preconditions: ["EmploymentCertification.status == SUBMITTED"]
        side_effects:
          - "Set rejection_reason"

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - scenario: "Two activate calls on different overlapping plans for the same borrower race"
    guarantee: "At most one plan ends ACTIVE for any loan_id; second activation rejected"
    error_id: ERR_PLAN_CONFLICT
    http_status: 409
    serialization: "First-writer-wins on RepaymentPlan.effective_from per included loan_id"

  - scenario: "Borrower payment and system default declaration race on a 270-day delinquent loan"
    guarantee: "If payment cures days_past_due first, default declaration is skipped; if default declaration commits first, the incoming payment is allocated against the DEFAULT loan and does NOT auto-rehab"
    error_id: ERR_INVALID_STATE
    http_status: 409
    serialization: "First-writer-wins on Loan.status field"

  - scenario: "Two ServicerApprovers approve the same discharge application simultaneously"
    guarantee: "Exactly one approval wins; the loser sees the application already APPROVED"
    error_id: ERR_INVALID_STATE
    http_status: 409
    serialization: "First-writer-wins on DischargeApplication.status"

  - scenario: "Hardship request approval and a separate payment that cures delinquency race"
    guarantee: "Whichever commits first sets Loan.status; the loser's transition becomes a no-op or is rejected if its preconditions no longer hold"
    error_id: ERR_INVALID_STATE
    http_status: 409
    serialization: "First-writer-wins on Loan.status"

  - scenario: "Two PATCH calls update the same hardship request"
    guarantee: "OCC: stale version rejected"
    error_id: ERR_VERSION_CONFLICT
    http_status: 409
    serialization: "Compare-and-swap on HardshipRequest.version"

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: monthly_payment_calc
    trigger: "RepaymentPlan PENDING -> ACTIVE transition"
    algorithm: "tiered_pricing"
    formula: |
      # Inputs come from the active plan's loan set and the borrower snapshot.
      pool_principal = sum(Loan.principal_balance_cents + Loan.accrued_interest_cents
                           for loan in plan.included_loan_ids
                           where Loan.status in {REPAYMENT, GRACE})
      weighted_rate_bps = sum(Loan.interest_rate_bps * (Loan.principal_balance_cents + Loan.accrued_interest_cents))
                       / max(pool_principal, 1)

      if plan.plan_type == STANDARD_10:
        # Standard fully-amortizing 10-year level payment.
        n = 120
        r = weighted_rate_bps / 10000 / 12
        # Pin: per-loan accrued interest is INCLUDED in pool_principal BEFORE amortization (rounding order: amortize the pool, then round to cents at the end).
        if r == 0: payment = pool_principal / n
        else:      payment = pool_principal * r * (1+r)**n / ((1+r)**n - 1)
        monthly_payment_cents = round_half_up(payment, 0)
      else:
        # IDR family — use discretionary income.
        poverty_line_cents = poverty_table[borrower.state_code][borrower.family_size]
        discretionary = max(0, borrower.adjusted_gross_income_cents - IDR_MULTIPLIER[plan.plan_type] * poverty_line_cents)
        annual_payment = discretionary * IDR_FRACTION[plan.plan_type]
        monthly_payment_cents = round_half_up(annual_payment / 12, 0)
        # SAVE has a 0-payment floor when discretionary == 0; IBR/PAYE have a $5 minimum (500 cents) if pool_principal > 0.
        if plan.plan_type in {IBR, PAYE} and monthly_payment_cents == 0 and pool_principal > 0:
          monthly_payment_cents = 500
    input_set: |
      Borrower (current snapshot), loans in included_loan_ids whose status in {REPAYMENT, GRACE}.
      Excludes DEFAULT, DEFERMENT, FORBEARANCE, PAID_OFF, DISCHARGED loans.
    constants:
      IDR_MULTIPLIER: { IBR: 1.50, PAYE: 1.50, SAVE: 2.25 }
      IDR_FRACTION: { IBR: 0.15, PAYE: 0.10, SAVE: 0.05 }
      # 2024 federal poverty guidelines (annual, cents). Two regions: 48 contiguous+DC, AK, HI.
      POVERTY_GUIDELINES_CENTS:
        "48_DC":
          1: 1506000   # $15,060
          2: 2034000
          3: 2562000
          4: 3090000
          5: 3618000
        "AK":
          1: 1882000
          2: 2542000
          3: 3202000
          4: 3862000
          5: 4522000
        "HI":
          1: 1732000
          2: 2340000
          3: 2948000
          4: 3556000
          5: 4164000
    precision: "Final monthly_payment_cents in integer cents, round_half_up. Pool aggregation in cents (no fractional cents during summation)."
    variants:
      - name: standard_10
        when: "plan_type == STANDARD_10"
        difference: "Level-payment amortization over 120 months using weighted average rate."
      - name: idr_save
        when: "plan_type == SAVE"
        difference: "5% of discretionary income; poverty multiplier 225%; no IBR/PAYE $5 floor — true $0 allowed."

  - name: interest_accrual_simulation
    trigger: "POST /_clock/advance"
    algorithm: "chronological"
    formula: |
      # For each Loan with status in {GRACE, REPAYMENT, DELINQUENT, DEFERMENT, FORBEARANCE, REHABILITATION}:
      delta_days = (new_now - loan.last_accrual_at).total_days_floor()
      # Subsidy filter: if loan.loan_type == DIRECT_SUBSIDIZED AND loan.status in {GRACE, DEFERMENT_IN_SCHOOL_OR_UNEMPLOYMENT_OR_ECON_HARDSHIP_OR_MILITARY}: accrual = 0
      # Otherwise daily accrual:
      daily_rate = loan.interest_rate_bps / 10000 / 365
      accrued_cents = round_half_up(loan.principal_balance_cents * daily_rate * delta_days, 0)
      # ROUNDING ORDER (pinned): round per loan per /_clock/advance call (NOT per-day, NOT after summing across loans).
      loan.accrued_interest_cents += accrued_cents
      loan.last_accrual_at = new_now
      # Auto-default check on Loan in DELINQUENT: if days_past_due >= 270 -> trigger §1.2 DELINQUENT->DEFAULT (capitalize accrued first).
    input_set: |
      All Loans whose status is in the accruing set. SUBSIDIZED in GRACE/DEFERMENT excluded.
    constants:
      DAYS_PER_YEAR: 365
      DEFAULT_THRESHOLD_DAYS: 270
      GRACE_DAYS: 180
    precision: "Per-loan, per-call round_half_up to integer cents."
    variants:
      - name: simple_daily
        when: "default mode"
        difference: "Pure simple interest on current principal_balance_cents."

  - name: payment_allocation_waterfall
    trigger: "POST /borrowers/{bid}/payments"
    algorithm: "waterfall_allocation"
    formula: |
      # Step 1: order loans by interest_rate_bps DESC, tie-break by disbursement_date ASC, tie-break #2 by Loan.id lex ASC.
      # Step 2: For each loan in that order, allocate in this pinned per-loan order:
      #   (a) outstanding late fees (none in this scaffold — skip; placeholder 0)
      #   (b) accrued_interest_cents
      #   (c) principal_balance_cents
      # Step 3: If amount_cents remains after all loans, refund excess as Payment.allocations[].refund_cents on the highest-priority loan.
      # ROUNDING: allocations stored as integer cents; no fractional cents created (the input amount_cents is already integer).
      # For loans in DEFAULT: PSLF qualifying check is forced false even if amount >= scheduled installment.
    input_set: |
      Borrower's non-terminal loans (excluding PAID_OFF and DISCHARGED).
    constants:
      ORDER_PRIORITY: "interest_rate_bps DESC, disbursement_date ASC, Loan.id ASC"
    precision: "Integer cents."
    variants:
      - name: standard
        when: "Payment.source == BORROWER or EMPLOYER"
        difference: "Allocate per priority order across all non-terminal loans."
      - name: targeted_garnishment
        when: "Payment.source in {ADMINISTRATIVE_WAGE_GARNISHMENT, TREASURY_OFFSET}"
        difference: "Allocate only to loans in DEFAULT, same internal priority order. Loans not in DEFAULT receive 0."

  - name: pslf_qualification_check
    trigger: "EmploymentCertification APPROVED OR DischargeApplication UNDER_REVIEW->APPROVED"
    algorithm: "projection"
    formula: |
      # Replay the borrower's Payment history and recompute qualifying_pslf_payment_count per loan.
      qualifying = 0
      for each Payment p in borrower's payments ordered by received_at ASC:
        # An EmploymentCertification window covers p iff some APPROVED cert has
        # period_start <= p.received_at <= period_end (INCLUSIVE on both ends).
        covered = exists APPROVED cert covering p.received_at
        for each allocation a in p.allocations:
          loan = Loan[a.loan_id]
          # PSLF eligibility:
          #   1. loan.loan_type in {DIRECT_SUBSIDIZED, DIRECT_UNSUBSIDIZED, DIRECT_PLUS}
          #   2. The Payment.received_at falls within an APPROVED EmploymentCertification window
          #   3. The borrower had an ACTIVE RepaymentPlan of type {IBR, PAYE, SAVE, STANDARD_10} at Payment.received_at
          #   4. a.principal_cents + a.interest_cents >= scheduled_monthly_payment for that loan/plan at that time (full payment)
          #   5. Loan.status at Payment.received_at NOT in {DEFAULT, DELINQUENT}
          if all five hold: increment loan.qualifying_pslf_payment_count by 1.
      # NOTE on rounding order (combinatorial mode b): the "full payment" check sums (interest+principal) PER LOAN ALLOCATION, then compares
      # to scheduled_monthly_payment per-loan share = round_half_up(plan.monthly_payment_cents * loan_pool_share, 0).
      # This is "share-then-round". The alternative "sum-then-round" of plan.monthly_payment_cents across loans would shift counts; the
      # pinned order is per-loan rounded share.
    input_set: |
      All borrower Payments with received_at <= now. Excludes Payments allocated solely to DEFAULT loans. Counts each (Payment, Loan) allocation once.
    constants:
      PSLF_QUALIFYING_THRESHOLD: 120
    precision: "Integer counts."
    variants:
      - name: certification_recount
        when: "EmploymentCertification.status PENDING->APPROVED"
        difference: "Recount full history; new approved window may retroactively qualify prior payments."
      - name: discharge_audit
        when: "DischargeApplication UNDER_REVIEW->APPROVED"
        difference: "Same algorithm, but result is also stored in DischargeApplication.approved_loan_ids = loans whose count >= 120."

  - name: veteran_tpd_eligibility
    trigger: "PATCH /borrowers/{bid}/discharge-applications/{aid} {status: UNDER_REVIEW or APPROVED} with program=VETERAN_TPD"
    algorithm: "threshold"
    formula: |
      eligible = (Borrower.veteran_status == TPD_VETERAN)
      if eligible:
        approved_loan_ids = [loan.id for loan in Borrower.loans
                              if loan.status in {REPAYMENT, DELINQUENT, FORBEARANCE, DEFERMENT}]
        discharged_principal_cents = sum(loan.principal_balance_cents for those loans)
        discharged_interest_cents = sum(loan.accrued_interest_cents for those loans)
      else:
        application status -> REJECTED with ERR_VETERAN_INELIGIBLE
    input_set: |
      Borrower record + all Loans of borrower (independent of PSLF state).
    constants:
      ELIGIBLE_VETERAN_STATUS: TPD_VETERAN
    precision: "N/A boolean + aggregated cents."
    variants:
      - name: standard
        when: "default"
        difference: "Single-step boolean gate; ignores employment certifications."

  - name: idr_recertification_drift_score
    trigger: "GET /borrowers/{bid}/risk-score"
    algorithm: "weighted_scoring"
    formula: |
      # Customer-domain risk score (separate from cost-accounting calcs above).
      # NON-LINEAR: combines three independent inputs with nested min/max.
      days_since_agi_cert = (now - Borrower.agi_certified_at).days if agi_certified_at else 9999
      days_overdue_recert = max(0, days_since_agi_cert - 365)  # only counts after due date
      delinquency_score = min(100, Borrower's max Loan.days_past_due)
      forbearance_burden = min(100, cumulative_forbearance_days_used / 1095 * 100)  # /36 months
      idr_risk = max(0, min(100,
                           0.5 * delinquency_score
                         + 0.3 * forbearance_burden
                         + 0.2 * min(100, days_overdue_recert / 365 * 100)))
      # PINNED EVALUATION ORDER (mode (c)): compute the three subscores FIRST (each independently clamped to [0,100]),
      # THEN take the weighted sum, THEN clamp again to [0,100]. The naive alternative (weighted sum then clamp once)
      # gives different results when subscores exceed 100 individually.
      round_half_up to integer.
    input_set: |
      Borrower's Loans and HardshipRequests (APPROVED) at /_clock now.
    constants:
      RECERT_PERIOD_DAYS: 365
      FORBEARANCE_CAP_DAYS: 1095
    precision: "Integer 0-100."
    variants:
      - name: live
        when: "borrower has at least one ACTIVE IDR plan"
        difference: "Uses IDR plan's certified_agi_cents and recertification_due_at to recompute idr-specific drift."

  - name: collections_aging_summary
    trigger: "GET /borrowers/{bid}/collections-summary"
    algorithm: "aggregation"
    formula: |
      # Aggregation over CollectionsAction:
      total_garnished = sum(amount_cents where kind == WAGE_GARNISHMENT_ORDER and occurred_at in [start, end])
      total_offset = sum(amount_cents where kind == TREASURY_OFFSET_APPLIED and occurred_at in [start, end])
      # Window: closed [start, end] (both inclusive). Tie-break: occurred_at ASC, then CollectionsAction implicit insertion order.
      rehab_payments_last_10mo = count(kind == REHAB_PAYMENT_RECORDED with occurred_at >= now - 304 days)
    input_set: |
      All CollectionsAction rows for the borrower, filtered by [start, end] inclusive window.
    constants:
      REHAB_WINDOW_DAYS: 304   # ~10 months
      REHAB_REQUIRED_PAYMENTS: 9
    precision: "Integer cents and integer counts."
    variants:
      - name: total
        when: "default"
        difference: "Lifetime aggregate."

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers must be present and non-empty"
    error_id: ERR_AUTH_REQUIRED
    http_status: 401
    applies_to: "all except GET /_health"

  - priority: 2
    category: auth
    check: "X-User-Role must be one of the declared roles; X-User-ID must reference a valid identity per §1.7"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: auth
    check: "Acting role permitted for this endpoint per §1.7 RBAC"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "all"

  - priority: 4
    category: existence
    check: "{borrower_id} path parameter exists"
    error_id: ERR_BORROWER_NOT_FOUND
    http_status: 404
    applies_to: "all /borrowers/{borrower_id}/* routes"

  - priority: 5
    category: existence
    check: "{loan_id} / {plan_id} / {request_id} / {application_id} / {certification_id} exists and belongs to borrower"
    error_id: ERR_RESOURCE_NOT_FOUND
    http_status: 404
    applies_to: "nested routes"

  - priority: 6
    category: existence
    check: "All foreign keys in request body (e.g., included_loan_ids, applied_loan_ids, approved_loan_ids) reference existing loans owned by this borrower"
    error_id: ERR_LOAN_NOT_FOUND
    http_status: 404
    applies_to: "POST/PATCH /plans, /hardship-requests, /discharge-applications"

  - priority: 7
    category: state
    check: "Target resource in correct status for requested transition per §1.2"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-mutating endpoints"

  - priority: 8
    category: business_safety
    check: "Segregation of duties: ServicerApprover approving a DischargeApplication MUST NOT equal any ServicerCertifier that approved one of the supporting EmploymentCertifications"
    error_id: ERR_SOD_VIOLATION
    http_status: 403
    applies_to: "PATCH /borrowers/{bid}/discharge-applications/{aid} {status: APPROVED}"

  - priority: 9
    category: business_safety
    check: "Veteran TPD discharge applied only when Borrower.veteran_status == TPD_VETERAN"
    error_id: ERR_VETERAN_INELIGIBLE
    http_status: 422
    applies_to: "PATCH /discharge-applications {program: VETERAN_TPD, status: APPROVED}"

  - priority: 10
    category: business_referential
    check: "DischargeApplication.program == PSLF requires at least one APPROVED EmploymentCertification with overlapping period before status -> UNDER_REVIEW"
    error_id: ERR_PSLF_NO_EMPLOYMENT_EVIDENCE
    http_status: 422
    applies_to: "PATCH /discharge-applications {program: PSLF, status: UNDER_REVIEW}"

  - priority: 11
    category: business_referential
    check: "For PSLF APPROVE: §1.3 pslf_qualification_check qualifying count >= 120 for each loan in approved_loan_ids"
    error_id: ERR_PSLF_INSUFFICIENT_PAYMENTS
    http_status: 422
    applies_to: "PATCH /discharge-applications {program: PSLF, status: APPROVED}"

  - priority: 12
    category: business_temporal
    check: "HardshipRequest.requested_from < HardshipRequest.requested_to AND requested_from >= now"
    error_id: ERR_BAD_DATE_WINDOW
    http_status: 400
    applies_to: "POST /hardship-requests"

  - priority: 13
    category: business_temporal
    check: "FORBEARANCE_GENERAL cumulative cap: borrower's lifetime FORBEARANCE_GENERAL days + requested window days must be <= 1095"
    error_id: ERR_FORBEARANCE_CAP_EXCEEDED
    http_status: 422
    applies_to: "PATCH /hardship-requests {status: APPROVED} where kind==FORBEARANCE_GENERAL"

  - priority: 14
    category: business_temporal
    check: "EmploymentCertification.period_start < EmploymentCertification.period_end"
    error_id: ERR_BAD_DATE_WINDOW
    http_status: 400
    applies_to: "POST /employment-certifications"

  - priority: 15
    category: business_referential
    check: "RepaymentPlan.included_loan_ids must not be empty AND each loan must be in {REPAYMENT, GRACE}; no DEFAULT loans allowed"
    error_id: ERR_PLAN_LOAN_INELIGIBLE
    http_status: 422
    applies_to: "POST /plans, POST /plans/{pid}/activate"

  - priority: 16
    category: business_referential
    check: "IDR plan activation requires Borrower.agi_certified_at within the last 365 days at activation time"
    error_id: ERR_AGI_NOT_CERTIFIED
    http_status: 422
    applies_to: "POST /plans/{pid}/activate when plan_type in {IBR, PAYE, SAVE}"

  - priority: 17
    category: business_constraint
    check: "A borrower may have at most one ACTIVE RepaymentPlan covering any given loan_id at any point in time"
    error_id: ERR_PLAN_CONFLICT
    http_status: 409
    applies_to: "POST /plans/{pid}/activate"

  - priority: 18
    category: business_constraint
    check: "REHAB_AGREEMENT_OPEN: borrower has never had a REHAB_COMPLETED action on this loan before (one rehab per loan lifetime)"
    error_id: ERR_REHAB_ALREADY_USED
    http_status: 422
    applies_to: "POST /collections {kind: REHAB_AGREEMENT_OPEN}"

  - priority: 19
    category: business_constraint
    check: "DEFERMENT_IN_SCHOOL not allowed on DIRECT_PLUS loans (statutory restriction)"
    error_id: ERR_PLUS_INELIGIBLE_FOR_IN_SCHOOL
    http_status: 422
    applies_to: "PATCH /hardship-requests {status: APPROVED} where kind==DEFERMENT_IN_SCHOOL and any applied loan is DIRECT_PLUS"

  - priority: 20
    category: business_fiscal
    check: "Payment.amount_cents > 0"
    error_id: ERR_AMOUNT_INVALID
    http_status: 400
    applies_to: "POST /payments"

  - priority: 21
    category: business_fiscal
    check: "OCC: Provided version (if any) matches current entity version; if absent, default to optimistic"
    error_id: ERR_VERSION_CONFLICT
    http_status: 409
    applies_to: "PATCH endpoints"

  - priority: 22
    category: business_constraint
    check: "Pagination params: limit in [1,100], offset >= 0"
    error_id: ERR_PAGINATION_INVALID
    http_status: 400
    applies_to: "all GET list endpoints"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # Test fixtures
  - method: POST
    path: "/_clock/advance"
    description: "Advance the simulation clock to the given ISO instant; triggers chronological interest_accrual_simulation and any time-gated transitions (GRACE->REPAYMENT after 180d, DELINQUENT->DEFAULT after 270d, DEFERMENT/FORBEARANCE auto-exit on requested_to, REHAB->REPAYMENT after 9 qualifying payments in 10 months)."
    roles: [ServicerAdmin, SystemTest]
    code: 200
    input: ["to"]
    output: ClockState
    side_effects:
      - "Recompute interest_accrual_simulation for every Loan in the accruing set"
      - "Auto-trigger §1.2 system transitions"
      - "Recompute Loan.days_past_due"

  # Borrower CRUD
  - method: POST
    path: "/borrowers"
    description: "Create a borrower record"
    roles: [ServicerAdmin]
    code: 201
    input: ["full_name", "ssn_last4", "family_size", "state_code", "adjusted_gross_income_cents?", "agi_certified_at?", "veteran_status?"]
    output: Borrower
    side_effects: []

  - method: GET
    path: "/borrowers/{borrower_id}"
    description: "Fetch borrower with computed aggregates"
    roles: [ServicerAdmin, ServicerCertifier, ServicerApprover, CollectionsOfficer, Borrower]
    code: 200
    input: []
    output: Borrower
    side_effects: []

  - method: PATCH
    path: "/borrowers/{borrower_id}"
    description: "Update borrower demographics or AGI; updating AGI bumps agi_certified_at"
    roles: [ServicerAdmin, Borrower]
    code: 200
    input: ["family_size?", "state_code?", "adjusted_gross_income_cents?", "veteran_status?", "version?"]
    output: Borrower
    side_effects:
      - "If adjusted_gross_income_cents changed, set agi_certified_at = now"

  - method: GET
    path: "/borrowers"
    description: "List borrowers (paginated)"
    roles: [ServicerAdmin]
    code: 200
    input: ["limit?", "offset?", "veteran_status?"]
    output: Borrower[]
    side_effects: []

  # Loans
  - method: POST
    path: "/borrowers/{borrower_id}/loans"
    description: "Originate a loan for the borrower (initial status IN_SCHOOL)"
    roles: [ServicerAdmin]
    code: 201
    input: ["loan_type", "original_principal_cents", "interest_rate_bps", "disbursement_date"]
    output: Loan
    side_effects:
      - "Set principal_balance_cents = original_principal_cents; status = IN_SCHOOL; status_entered_at = now; last_accrual_at = now"

  - method: GET
    path: "/borrowers/{borrower_id}/loans/{loan_id}"
    description: "Get loan details with current balances"
    roles: [ServicerAdmin, ServicerCertifier, ServicerApprover, CollectionsOfficer, Borrower]
    code: 200
    input: []
    output: Loan
    side_effects: []

  - method: GET
    path: "/borrowers/{borrower_id}/loans"
    description: "List borrower's loans"
    roles: [ServicerAdmin, ServicerCertifier, ServicerApprover, CollectionsOfficer, Borrower]
    code: 200
    input: ["limit?", "offset?", "status?"]
    output: Loan[]
    side_effects: []

  - method: POST
    path: "/borrowers/{borrower_id}/loans/{loan_id}/separate"
    description: "Mark loan as separated from school: IN_SCHOOL -> GRACE (or REPAYMENT if PLUS with skip_grace)"
    roles: [ServicerAdmin]
    code: 200
    input: ["skip_grace?"]
    output: Loan
    side_effects: ["See §1.2 Loan IN_SCHOOL transitions"]

  - method: POST
    path: "/borrowers/{borrower_id}/loans/{loan_id}/collections"
    description: "Append a CollectionsAction; some kinds trigger Loan state transitions per §1.2"
    roles: [CollectionsOfficer]
    code: 201
    input: ["kind", "amount_cents?", "occurred_at?"]
    output: CollectionsAction
    side_effects:
      - "REHAB_AGREEMENT_OPEN: Loan DEFAULT -> REHABILITATION"
      - "REHAB_PAYMENT_RECORDED: record toward rehab counter"
      - "WAGE_GARNISHMENT_ORDER/TREASURY_OFFSET_APPLIED: create implicit Payment with source matching kind"

  # Payments
  - method: POST
    path: "/borrowers/{borrower_id}/payments"
    description: "Record a payment and run §1.3 payment_allocation_waterfall; may transition loans to PAID_OFF, REPAYMENT (from DELINQUENT), or be allocated to DEFAULT loans for garnishment/offset sources"
    roles: [Borrower, ServicerAdmin, CollectionsOfficer]
    code: 201
    input: ["amount_cents", "source?", "received_at?"]
    output: Payment
    side_effects:
      - "Allocate per §1.3 waterfall"
      - "Update each affected Loan.principal_balance_cents and accrued_interest_cents"
      - "Possibly Loan DELINQUENT->REPAYMENT or REPAYMENT->PAID_OFF"
      - "If after allocation any loan reaches 0 balance, set status=PAID_OFF"
      - "Set Payment.pslf_qualifying via §1.3 pslf_qualification_check live"

  - method: GET
    path: "/borrowers/{borrower_id}/payments"
    description: "List payments (paginated)"
    roles: [Borrower, ServicerAdmin, CollectionsOfficer]
    code: 200
    input: ["limit?", "offset?", "source?"]
    output: Payment[]
    side_effects: []

  - method: GET
    path: "/borrowers/{borrower_id}/payments/{payment_id}"
    description: "Get payment with allocations"
    roles: [Borrower, ServicerAdmin, CollectionsOfficer]
    code: 200
    input: []
    output: Payment
    side_effects: []

  # Repayment plans
  - method: POST
    path: "/borrowers/{borrower_id}/plans"
    description: "Create a draft repayment plan (status=PENDING)"
    roles: [Borrower, ServicerAdmin]
    code: 201
    input: ["plan_type", "included_loan_ids"]
    output: RepaymentPlan
    side_effects: []

  - method: POST
    path: "/borrowers/{borrower_id}/plans/{plan_id}/activate"
    description: "Activate a plan; computes monthly_payment_cents via §1.3 monthly_payment_calc; supersedes overlapping plans"
    roles: [Borrower, ServicerAdmin]
    code: 200
    input: []
    output: RepaymentPlan
    side_effects:
      - "See §1.2 RepaymentPlan PENDING -> ACTIVE"

  - method: GET
    path: "/borrowers/{borrower_id}/plans"
    description: "List borrower's plans"
    roles: [Borrower, ServicerAdmin, ServicerCertifier]
    code: 200
    input: ["limit?", "offset?", "status?"]
    output: RepaymentPlan[]
    side_effects: []

  - method: GET
    path: "/borrowers/{borrower_id}/plans/{plan_id}"
    description: "Get plan with current monthly_payment_cents and recertification_due_at"
    roles: [Borrower, ServicerAdmin, ServicerCertifier]
    code: 200
    input: []
    output: RepaymentPlan
    side_effects: []

  - method: DELETE
    path: "/borrowers/{borrower_id}/plans/{plan_id}"
    description: "Cancel a PENDING plan (PENDING -> TERMINATED)"
    roles: [Borrower, ServicerAdmin]
    code: 200
    input: []
    output: RepaymentPlan
    side_effects: []

  # Hardship requests
  - method: POST
    path: "/borrowers/{borrower_id}/hardship-requests"
    description: "Submit a deferment or forbearance request"
    roles: [Borrower, ServicerAdmin]
    code: 201
    input: ["kind", "requested_from", "requested_to", "applied_loan_ids"]
    output: HardshipRequest
    side_effects:
      - "Snapshot cumulative_forbearance_days_at_request from borrower's history"

  - method: PATCH
    path: "/borrowers/{borrower_id}/hardship-requests/{request_id}"
    description: "Approve or reject a hardship request"
    roles: [ServicerCertifier]
    code: 200
    input: ["status", "rejection_reason?", "version?"]
    output: HardshipRequest
    side_effects: ["See §1.2 HardshipRequest and Loan transitions"]

  - method: GET
    path: "/borrowers/{borrower_id}/hardship-requests"
    description: "List hardship requests"
    roles: [Borrower, ServicerAdmin, ServicerCertifier]
    code: 200
    input: ["limit?", "offset?", "status?", "kind?"]
    output: HardshipRequest[]
    side_effects: []

  - method: DELETE
    path: "/borrowers/{borrower_id}/hardship-requests/{request_id}"
    description: "Cancel a SUBMITTED hardship request (SUBMITTED -> CANCELLED)"
    roles: [Borrower]
    code: 200
    input: []
    output: HardshipRequest
    side_effects: []

  # Discharge applications (PSLF & Veteran TPD)
  - method: POST
    path: "/borrowers/{borrower_id}/discharge-applications"
    description: "Submit a discharge application"
    roles: [Borrower, ServicerAdmin]
    code: 201
    input: ["program"]
    output: DischargeApplication
    side_effects: []

  - method: PATCH
    path: "/borrowers/{borrower_id}/discharge-applications/{application_id}"
    description: "Move discharge application through review states. ServicerCertifier may UNDER_REVIEW or reject SUBMITTED; ServicerApprover may APPROVE or REJECT under review."
    roles: [ServicerCertifier, ServicerApprover]
    code: 200
    input: ["status", "approved_loan_ids?", "version?"]
    output: DischargeApplication
    side_effects: ["See §1.2 DischargeApplication and Loan transitions"]

  - method: GET
    path: "/borrowers/{borrower_id}/discharge-applications"
    description: "List discharge applications"
    roles: [Borrower, ServicerAdmin, ServicerCertifier, ServicerApprover]
    code: 200
    input: ["limit?", "offset?", "program?", "status?"]
    output: DischargeApplication[]
    side_effects: []

  # Employment certifications
  - method: POST
    path: "/borrowers/{borrower_id}/employment-certifications"
    description: "Submit an employment certification record"
    roles: [Borrower, ServicerAdmin]
    code: 201
    input: ["employer_name", "employer_type", "period_start", "period_end"]
    output: EmploymentCertification
    side_effects: []

  - method: PATCH
    path: "/borrowers/{borrower_id}/employment-certifications/{certification_id}"
    description: "Approve or reject employment certification"
    roles: [ServicerCertifier]
    code: 200
    input: ["status", "rejection_reason?", "version?"]
    output: EmploymentCertification
    side_effects:
      - "On APPROVED: re-run §1.3 pslf_qualification_check; may retroactively bump qualifying_pslf_payment_count"

  - method: GET
    path: "/borrowers/{borrower_id}/employment-certifications"
    description: "List employment certifications"
    roles: [Borrower, ServicerAdmin, ServicerCertifier, ServicerApprover]
    code: 200
    input: ["limit?", "offset?", "status?"]
    output: EmploymentCertification[]
    side_effects: []

  # Computed reads
  - method: GET
    path: "/borrowers/{borrower_id}/risk-score"
    description: "Return §1.3 idr_recertification_drift_score"
    roles: [ServicerAdmin, ServicerCertifier, CollectionsOfficer]
    code: 200
    input: []
    output: object
    side_effects: []

  - method: GET
    path: "/borrowers/{borrower_id}/collections-summary"
    description: "Return §1.3 collections_aging_summary for a [start,end] window"
    roles: [CollectionsOfficer, ServicerAdmin]
    code: 200
    input: ["start?", "end?"]
    output: object
    side_effects: []

  - method: GET
    path: "/_health"
    description: "Liveness probe"
    roles: [SystemTest, ServicerAdmin, ServicerCertifier, ServicerApprover, CollectionsOfficer, Borrower]
    code: 200
    input: []
    output: object
    side_effects: []

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_AUTH_REQUIRED
    http: 401
    condition: "Missing or empty X-User-Role or X-User-ID header"
  - id: ERR_FORBIDDEN
    http: 403
    condition: "Role not authorized for this endpoint (or unknown role)"
  - id: ERR_BORROWER_NOT_FOUND
    http: 404
    condition: "{borrower_id} does not exist"
  - id: ERR_RESOURCE_NOT_FOUND
    http: 404
    condition: "Sub-resource id does not exist or does not belong to borrower"
  - id: ERR_LOAN_NOT_FOUND
    http: 404
    condition: "Referenced loan_id in request body does not exist or belongs to a different borrower"
  - id: ERR_INVALID_STATE
    http: 409
    condition: "Requested transition not permitted from the resource's current status"
  - id: ERR_VERSION_CONFLICT
    http: 409
    condition: "Stale optimistic-concurrency version on PATCH"
  - id: ERR_PLAN_CONFLICT
    http: 409
    condition: "Activating a plan whose included_loan_ids overlap with another ACTIVE plan for the same borrower (race) OR validation 17 fails"
  - id: ERR_PLAN_LOAN_INELIGIBLE
    http: 422
    condition: "included_loan_ids empty or contains loans not in {REPAYMENT, GRACE}, or contains DEFAULT loans"
  - id: ERR_AGI_NOT_CERTIFIED
    http: 422
    condition: "IDR plan activation without AGI certified within the last 365 days"
  - id: ERR_SOD_VIOLATION
    http: 403
    condition: "Segregation of duties: approver also acted as certifier on the supporting evidence"
  - id: ERR_VETERAN_INELIGIBLE
    http: 422
    condition: "VETERAN_TPD discharge requested but Borrower.veteran_status != TPD_VETERAN"
  - id: ERR_PSLF_NO_EMPLOYMENT_EVIDENCE
    http: 422
    condition: "PSLF discharge moved to UNDER_REVIEW without any APPROVED EmploymentCertification"
  - id: ERR_PSLF_INSUFFICIENT_PAYMENTS
    http: 422
    condition: "PSLF discharge approval attempted but qualifying_pslf_payment_count < 120 for some approved loan"
  - id: ERR_BAD_DATE_WINDOW
    http: 400
    condition: "End <= Start in a date window, or window is in the past (for hardship requests)"
  - id: ERR_FORBEARANCE_CAP_EXCEEDED
    http: 422
    condition: "Lifetime FORBEARANCE_GENERAL days + requested window > 1095 days"
  - id: ERR_PLUS_INELIGIBLE_FOR_IN_SCHOOL
    http: 422
    condition: "DEFERMENT_IN_SCHOOL requested on a DIRECT_PLUS loan"
  - id: ERR_REHAB_ALREADY_USED
    http: 422
    condition: "REHAB_AGREEMENT_OPEN requested on a loan that already has a REHAB_COMPLETED CollectionsAction"
  - id: ERR_AMOUNT_INVALID
    http: 400
    condition: "Payment amount <= 0 or non-integer cents"
  - id: ERR_PAGINATION_INVALID
    http: 400
    condition: "limit outside [1,100] or offset < 0"

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: ServicerAdmin
    description: "Operator who originates loans, configures borrowers, and runs administrative actions"
    identity: "opaque"
    exclusive_operations:
      - "POST /borrowers"
      - "POST /borrowers/{bid}/loans"
      - "POST /borrowers/{bid}/loans/{lid}/separate"
      - "POST /_clock/advance"
    shared_operations:
      - "PATCH /borrowers/{bid}"
      - "POST /borrowers/{bid}/payments"
      - "POST /borrowers/{bid}/plans (+ /activate, DELETE)"
      - "POST /borrowers/{bid}/hardship-requests"
      - "POST /borrowers/{bid}/discharge-applications"
      - "POST /borrowers/{bid}/employment-certifications"
      - "GET reads"

  - name: ServicerCertifier
    description: "Operator who certifies hardship requests, employment certifications, and forwards discharge applications to review"
    identity: "opaque"
    exclusive_operations:
      - "PATCH /borrowers/{bid}/hardship-requests/{rid} {status: APPROVED|REJECTED}"
      - "PATCH /borrowers/{bid}/employment-certifications/{cid} {status: APPROVED|REJECTED}"
      - "PATCH /borrowers/{bid}/discharge-applications/{aid} {status: UNDER_REVIEW|REJECTED-from-SUBMITTED}"
    shared_operations:
      - "GET reads"

  - name: ServicerApprover
    description: "Operator who approves or rejects discharge applications under review; cannot also have certified the supporting employment evidence (segregation of duties)"
    identity: "opaque"
    exclusive_operations:
      - "PATCH /borrowers/{bid}/discharge-applications/{aid} {status: APPROVED|REJECTED-from-UNDER_REVIEW}"
    shared_operations:
      - "GET reads"

  - name: CollectionsOfficer
    description: "Operator who records collections actions, garnishments, and rehab payments"
    identity: "opaque"
    exclusive_operations:
      - "POST /borrowers/{bid}/loans/{lid}/collections"
    shared_operations:
      - "POST /borrowers/{bid}/payments (source in {ADMINISTRATIVE_WAGE_GARNISHMENT, TREASURY_OFFSET})"
      - "GET reads"

  - name: Borrower
    description: "End user; identity backed by the Borrower entity"
    identity: "entity_backed:Borrower"
    exclusive_operations:
      - "DELETE /borrowers/{bid}/plans/{pid}"
      - "DELETE /borrowers/{bid}/hardship-requests/{rid}"
    shared_operations:
      - "PATCH /borrowers/{bid} (self)"
      - "POST /borrowers/{bid}/payments (source=BORROWER)"
      - "POST /borrowers/{bid}/plans (+ /activate)"
      - "POST /borrowers/{bid}/hardship-requests"
      - "POST /borrowers/{bid}/discharge-applications"
      - "POST /borrowers/{bid}/employment-certifications"
      - "GET reads of own resources"

  - name: SystemTest
    description: "Reserved role used by test fixtures to advance the simulation clock and probe health"
    identity: "opaque"
    exclusive_operations: []
    shared_operations:
      - "POST /_clock/advance"
      - "GET /_health"
