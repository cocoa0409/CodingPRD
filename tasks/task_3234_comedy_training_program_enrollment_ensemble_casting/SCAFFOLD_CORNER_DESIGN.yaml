  # ===========================================================================
  # Endpoints — special patterns
  # ===========================================================================
  - section: endpoints
    instances:

      - name: clock_set_endpoint_advances_logical_time
        claim_type: Action endpoint
        grounds:
          - endpoints.POST_/_clock/set_current_utc
        distinguishing_aspect: "Server default clock is 2026-09-01T00:00:00Z; setting clock updates the value returned by time-dependent transitions."
        test_recipe:
          setup: ["Empty database; default clock."]
          setup_api_calls: []
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2027-06-15T12:00:00Z" }
              as: ProgramDirector
          assert:
            - "the response status is 200"
            - "the response data.current_utc == \"2027-06-15T12:00:00Z\""

      - name: cohort_admit_over_capacity_rejected
        claim_type: Conditional action
        grounds:
          - errors.ERR_COHORT_OVER_CAPACITY
          - endpoints.POST_/cohort-programs/{cohortId}/admit
        distinguishing_aspect: "Cohort with cohort_size=1 rejects a second admit."
        test_recipe:
          setup:
            - "Cohort size=1 in AUDITIONING. Two evaluated auditions for two students, both with L3 credit."
          setup_api_calls:
            - *c_clock
            - *c_lvl
            - *c_lvl2
            - &c_lvl3_r
              call: "POST /curriculum-levels"
              payload: { code: "L3R", title: "Level 3R", track: "IMPROV", sequence_index: 2, requires_level_code: "L2", allows_placement_bypass: true }
              as: ProgramDirector
              captures: { c_lvl3r_id: $.data.id }
            - *c_term
            - *c_stu
            - *c_stu2
            - &c_coh
              call: "POST /cohort-programs"
              payload: { kind: "CONSERVATORY", track: "IMPROV", term_id: "${c_term_id}", cohort_size: 1, requires_audition: true, min_track_level_code: "L3R" }
              as: ProgramDirector
              captures: { c_coh_id: $.data.id }
            - call: "POST /cohort-programs/${c_coh_id}/begin-auditions"
              payload: {}
              as: ProgramDirector
            # Grant placement for both students to L3R
            - &c_pe_a
              call: "POST /placement-evaluations"
              payload: { student_id: "${c_sid}", target_level_id: "${c_lvl3r_id}", track: "IMPROV", prior_institution: "UCB", portfolio_score: 0 }
              as: PlacementOfficer
              captures: { c_pe_a_id: $.data.id }
            - &c_pe_b
              call: "POST /placement-evaluations"
              payload: { student_id: "${c_s2_id}", target_level_id: "${c_lvl3r_id}", track: "IMPROV", prior_institution: "UCB", portfolio_score: 0 }
              as: PlacementOfficer
              captures: { c_pe_b_id: $.data.id }
            - call: "POST /placement-evaluations/${c_pe_a_id}/begin-review"
              payload: {}
              as: PlacementOfficer
            - call: "POST /placement-evaluations/${c_pe_a_id}/grant"
              payload: {}
              as: PlacementOfficer
            - call: "POST /placement-evaluations/${c_pe_b_id}/begin-review"
              payload: {}
              as: PlacementOfficer
            - call: "POST /placement-evaluations/${c_pe_b_id}/grant"
              payload: {}
              as: PlacementOfficer
            - &c_aud_coh_a
              call: "POST /auditions"
              payload: { student_id: "${c_sid}", target_kind: "COHORT", cohort_program_id: "${c_coh_id}", rubric_scores: { scene_work: 9, characters: 9, musicality: 9, game: 9 } }
              as: CastingDirector
              captures: { c_aud_coh_a_id: $.data.id }
            - &c_aud_coh_b
              call: "POST /auditions"
              payload: { student_id: "${c_s2_id}", target_kind: "COHORT", cohort_program_id: "${c_coh_id}", rubric_scores: { scene_work: 9, characters: 9, musicality: 9, game: 9 } }
              as: CastingDirector
              captures: { c_aud_coh_b_id: $.data.id }
            - call: "POST /auditions/${c_aud_coh_a_id}/evaluate"
              payload: {}
              as: CastingDirector
            - call: "POST /auditions/${c_aud_coh_b_id}/evaluate"
              payload: {}
              as: CastingDirector
            - call: "POST /cohort-programs/${c_coh_id}/admit"
              payload: { audition_id: "${c_aud_coh_a_id}" }
              as: ProgramDirector
          trigger:
            - call: "POST /cohort-programs/${c_coh_id}/admit"
              payload: { audition_id: "${c_aud_coh_b_id}" }
              as: ProgramDirector
              captures: { err_cap: $.data.error_id }
          assert:
            - "the response status is 422"
            - "error_id == ERR_COHORT_OVER_CAPACITY"
            - "CohortProgram.${c_coh_id}.admitted_count == 1"

  # ===========================================================================
  # Errors — every error triggerable
  # ===========================================================================
  - section: errors
    instances:

      - name: error_stale_version_on_enrollment_create
        claim_type: violation_to_error
        grounds:
          - concurrency_rules[enrollment-create-stale-section]
          - errors.ERR_STALE_VERSION
        distinguishing_aspect: "OCC: after a successful enrollment bumps section version, a second enrollment carrying the stale expected_section_version is rejected with 412 ERR_STALE_VERSION."
        test_recipe:
          setup: ["Section open, version V observed, then a successful enrollment bumps version."]
          setup_api_calls:
            - *c_clock
            - *c_lvl
            - *c_term
            - *c_instr
            - call: "POST /terms/${c_term_id}/open-scheduling"
              payload: {}
              as: ProgramDirector
            - *c_sec_a
            - call: "POST /terms/${c_term_id}/open-enrollment"
              payload: {}
              as: ProgramDirector
            - *c_stu
            - *c_stu2
            # First enrollment succeeds, bumping section.version
            - call: "POST /enrollments"
              payload: { student_id: "${c_sid}", section_id: "${c_sec_a_id}", expected_section_version: "${c_sec_a_v}" }
              as: Registrar
          trigger:
            - call: "POST /enrollments"
              payload: { student_id: "${c_s2_id}", section_id: "${c_sec_a_id}", expected_section_version: "${c_sec_a_v}" }
              as: Registrar
              captures: { err_stale: $.data.error_id }
          assert:
            - "the response status is 412"
            - "error_id == ERR_STALE_VERSION"

      - name: error_stale_version_on_cast_lock
        claim_type: violation_to_error
        grounds:
          - concurrency_rules[cast-lock-stale-ensemble]
          - errors.ERR_STALE_VERSION
        distinguishing_aspect: "OCC on EnsembleCast.lock-cast: stale expected_cast_version → 412 ERR_STALE_VERSION."
        test_recipe:
          setup: ["Cast in CASTING with full principal/understudy, version V observed, then a /cast call bumps version."]
          setup_api_calls:
            - *c_clock
            - *c_vs
            - &c_cast2
              call: "POST /ensemble-casts"
              payload: { revue_title: "R2", venue_slot_id: "${c_vs_id}", cast_size: 1, understudy_slots: 0, source_policy: "OPEN_CALL" }
              as: CastingDirector
              captures: { c_cast2_id: $.data.id }
            - *c_stu
            - &c_aud_for_cast
              call: "POST /auditions"
              payload: { student_id: "${c_sid}", target_kind: "ENSEMBLE", ensemble_cast_id: "${c_cast2_id}", rubric_scores: { scene_work: 9, characters: 9, musicality: 9, game: 9 } }
              as: CastingDirector
            - call: "POST /ensemble-casts/${c_cast2_id}/open-casting"
              payload: {}
              as: CastingDirector
            - &c_cast_v_pre
              call: "GET /ensemble-casts/${c_cast2_id}"
              payload: {}
              as: CastingDirector
              captures: { c_cast_v_pre: $.data.version }
            # First /cast call fills the principal slot and bumps the version
            - &c_aud_for_cast_id
              call: "GET /auditions"
              payload: { ensemble_cast_id: "${c_cast2_id}", outcome: "SCHEDULED" }
              as: CastingDirector
              captures: { c_aud_fc_id: "$.data[0].id" }
            - call: "POST /auditions/${c_aud_fc_id}/evaluate"
              payload: {}
              as: CastingDirector
            - call: "POST /ensemble-casts/${c_cast2_id}/cast"
              payload: {}
              as: CastingDirector
          trigger:
            - call: "POST /ensemble-casts/${c_cast2_id}/lock-cast"
              payload: { expected_cast_version: "${c_cast_v_pre}" }
              as: CastingDirector
              captures: { err_stale2: $.data.error_id }
          assert:
            - "the response status is 412"
            - "error_id == ERR_STALE_VERSION"

      - name: error_invoice_overpayment
        claim_type: violation_to_error
        grounds:
          - errors.ERR_INVOICE_OVERPAYMENT
        distinguishing_aspect: "A payment exceeding amount_due_cents is rejected."
        test_recipe:
          setup: ["Invoice with amount_due_cents=10000."]
          setup_api_calls:
            - *c_clock
            - *c_lvl
            - *c_term
            - *c_instr
            - call: "POST /terms/${c_term_id}/open-scheduling"
              payload: {}
              as: ProgramDirector
            - *c_sec_a
            - call: "POST /terms/${c_term_id}/open-enrollment"
              payload: {}
              as: ProgramDirector
            - *c_stu
            - call: "POST /enrollments"
              payload: { student_id: "${c_sid}", section_id: "${c_sec_a_id}", expected_section_version: "${c_sec_a_v}" }
              as: Registrar
              captures: { c_enr_ov_id: $.data.id }
            - &c_inv_ov_list
              call: "GET /tuition-invoices"
              payload: { enrollment_id: "${c_enr_ov_id}" }
              as: FinanceOfficer
              captures: { c_inv_ov_id: "$.data[0].id" }
          trigger:
            - call: "POST /tuition-invoices/${c_inv_ov_id}/pay"
              payload: { amount_cents: 10001 }
              as: FinanceOfficer
              captures: { err_ov: $.data.error_id }
          assert:
            - "the response status is 422"
            - "error_id == ERR_INVOICE_OVERPAYMENT"

      - name: error_grades_incomplete_on_showcase_stage
        claim_type: violation_to_error
        grounds:
          - errors.ERR_GRADES_INCOMPLETE
        distinguishing_aspect: "Staging a showcase with grade_by_enrollment missing a performer → 422 ERR_GRADES_INCOMPLETE."
        test_recipe:
          setup: ["Showcase SCHEDULED with two performers; grade map only covers one."]
          setup_api_calls:
            - *c_clock
            - &c_lvl_sw
              call: "POST /curriculum-levels"
              payload: { code: "L1W", title: "Level 1 W", track: "IMPROV", sequence_index: 0, showcase_required: true }
              as: ProgramDirector
              captures: { c_lvl_sw_id: $.data.id }
            - *c_term
            - *c_instr
            - call: "POST /terms/${c_term_id}/open-scheduling"
              payload: {}
              as: ProgramDirector
            - &c_sec_sw
              call: "POST /sections"
              payload: { term_id: "${c_term_id}", level_id: "${c_lvl_sw_id}", instructor_id: "${c_instr_id}", capacity: 2, tuition_cents: 10000, weekly_hours: 3 }
              as: ProgramDirector
              captures: { c_sec_sw_id: $.data.id, c_sec_sw_v: $.data.version }
            - call: "POST /terms/${c_term_id}/open-enrollment"
              payload: {}
              as: ProgramDirector
            - *c_stu
            - *c_stu2
            - &c_enr_sw1
              call: "POST /enrollments"
              payload: { student_id: "${c_sid}", section_id: "${c_sec_sw_id}", expected_section_version: "${c_sec_sw_v}" }
              as: Registrar
              captures: { c_enr_sw1_id: $.data.id }
            - &c_sec_sw_v2
              call: "GET /sections/${c_sec_sw_id}"
              payload: {}
              as: Registrar
              captures: { c_sec_sw_v2: $.data.version }
            - &c_enr_sw2
              call: "POST /enrollments"
              payload: { student_id: "${c_s2_id}", section_id: "${c_sec_sw_id}", expected_section_version: "${c_sec_sw_v2}" }
              as: Registrar
              captures: { c_enr_sw2_id: $.data.id }
            - call: "POST /enrollments/${c_enr_sw1_id}/confirm"
              payload: {}
              as: Registrar
            - call: "POST /enrollments/${c_enr_sw2_id}/confirm"
              payload: {}
              as: Registrar
            - call: "POST /terms/${c_term_id}/start-session"
              payload: {}
              as: ProgramDirector
            - call: "POST /terms/${c_term_id}/close"
              payload: {}
              as: ProgramDirector
            - *c_vs
            - &c_sc_gi
              call: "POST /showcases"
              payload: { level_id: "${c_lvl_sw_id}", term_id: "${c_term_id}", venue_slot_id: "${c_vs_id}", performer_enrollment_ids: ["${c_enr_sw1_id}", "${c_enr_sw2_id}"] }
              as: ProgramDirector
              captures: { c_sc_gi_id: $.data.id }
            - call: "POST /showcases/${c_sc_gi_id}/schedule"
              payload: {}
              as: ProgramDirector
          trigger:
            - call: "POST /showcases/${c_sc_gi_id}/stage"
              payload: { grade_by_enrollment: { "${c_enr_sw1_id}": "PASS" } }
              as: ProgramDirector
              captures: { err_gi: $.data.error_id }
          assert:
            - "the response status is 422"
            - "error_id == ERR_GRADES_INCOMPLETE"

      - name: error_unauthorized_role_student_cannot_create_level
        claim_type: violation_to_error
        grounds:
          - validations.priority_2_auth
          - errors.ERR_UNAUTHORIZED_ROLE
        distinguishing_aspect: "Student role cannot create CurriculumLevel (ProgramDirector-exclusive)."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls: []
          trigger:
            - call: "POST /curriculum-levels"
              payload: { code: "LX", title: "Bad", track: "IMPROV", sequence_index: 0 }
              as: Student
              captures: { err_unauth: $.data.error_id }
          assert:
            - "the response status is 403"
            - "error_id == ERR_UNAUTHORIZED_ROLE"

      - name: error_section_full_on_confirm_after_capacity_reached
        claim_type: violation_to_error
        grounds:
          - errors.ERR_SECTION_FULL
        excluded_because:
          difficulty_instance: boundary_precision_check / section_capacity_boundary_full_at_exactly_capacity
          rationale: "Asserted as the failure path of the named §1.8 instance."

      - name: error_prerequisite_not_met_on_enroll
        claim_type: violation_to_error
        grounds:
          - errors.ERR_PREREQUISITE_NOT_MET
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / prerequisite_vs_section_full_enroll_blocks
