            - call: "POST /stewardship/dot-snapshots"
              payload: { hospital_id: "${h_id}", period_label: "2026-07", patient_days: 100 }
              as: InfectionPreventionist
              as_user_id: "${ip_id}"
              captures: { snap_id: $.data.id }
            - call: "POST /stewardship/dot-snapshots/${snap_id}/finalize"
              payload: {}
              as: InfectionPreventionist
              as_user_id: "${ip_id}"
            - call: "POST /stewardship/regulatory-reports"
              payload: { hospital_id: "${h_id}", report_type: "NHSN_AUR", period_label: "2026-07", dot_snapshot_id: "${snap_id}" }
              as: InfectionPreventionist
              as_user_id: "${ip_id}"
              captures: { r1_id: $.data.id }
            - call: "POST /stewardship/regulatory-reports/${r1_id}/submit"
              payload: {}
              as: InfectionPreventionist
              as_user_id: "${ip_id}"
            - call: "POST /stewardship/regulatory-reports"
              payload: { hospital_id: "${h_id}", report_type: "NHSN_AUR", period_label: "2026-07", dot_snapshot_id: "${snap_id}" }
              as: InfectionPreventionist
              as_user_id: "${ip_id}"
              captures: { r2_id: $.data.id }
            - call: "POST /stewardship/regulatory-reports/${r2_id}/submit"
              payload: {}
              as: InfectionPreventionist
              as_user_id: "${ip_id}"
              captures: { err2: $.data.error_id }
          assert:
            - "R1 submission succeeds; GET R1 payload_json contains dot_per_1000_pd_calendar 0.00 and patient_days 100"
            - "R2 submission fails with ERR_REPORT_ALREADY_SUBMITTED (uniqueness on hospital+type+period)"
            - "err2 == ERR_REPORT_ALREADY_SUBMITTED"

  # ===========================================================================
  # Section: validations — violation->error for rules not covered by §1.8
  # ===========================================================================
  - section: validations
    instances:
      - name: duplicate_active_order_rejected
        claim_type: violation_to_error
        grounds:
          - "validations[priority=25]"
          - "errors[ERR_DUPLICATE_ACTIVE_ORDER]"
        distinguishing_aspect: "Second order for same patient + same antimicrobial while first is non-terminal -> ERR_DUPLICATE_ACTIVE_ORDER."
        test_recipe:
          setup: ["H; MD; P; drug D; existing ACTIVE order for P+D"]
          setup_api_calls:
            - call: "POST /stewardship/hospitals"
              payload: { name: "H", nhsn_facility_id: "NHSN-1" }
              as: StewardshipAdmin
              captures: { h_id: $.data.id }
            - call: "POST /stewardship/practitioners"
              payload: { hospital_id: "${h_id}", full_name: "Dr MD", license_no: "L-MD-1", discipline: "PHYSICIAN" }
              as: StewardshipAdmin
              captures: { md_id: $.data.id }
            - call: "POST /stewardship/patient-cases"
              payload: { hospital_id: "${h_id}", mrn: "MRN-1", admitted_at: "2026-08-01T00:00:00Z", ward: "4W", weight_kg: 70, renal_function_crcl: 90 }
              as: AttendingPhysician
              as_user_id: "${md_id}"
              captures: { p_id: $.data.id }
            - call: "POST /stewardship/antimicrobials"
              payload: { hospital_id: "${h_id}", drug_name: "CEFTRIAXONE", drug_class: "CEPHALOSPORIN", is_restricted: false, has_po_form: false }
              as: StewardshipAdmin
              captures: { drug_id: $.data.id }
            - call: "POST /stewardship/antibiotic-orders"
              payload: { patient_case_id: "${p_id}", antimicrobial_id: "${drug_id}", prescriber_id: "${md_id}", route: "IV", dose_mg: 1000, frequency_per_day: 1, indication: "EMPIRIC" }
              as: AttendingPhysician
              as_user_id: "${md_id}"
          trigger:
            - call: "POST /stewardship/antibiotic-orders"
              payload: { patient_case_id: "${p_id}", antimicrobial_id: "${drug_id}", prescriber_id: "${md_id}", route: "IV", dose_mg: 2000, frequency_per_day: 2, indication: "EMPIRIC" }
              as: AttendingPhysician
              as_user_id: "${md_id}"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_DUPLICATE_ACTIVE_ORDER"

      - name: restricted_order_cap_enforced
        claim_type: violation_to_error
        grounds:
          - "validations[priority=26]"
          - "errors[ERR_RESTRICTED_ORDER_CAP]"
        distinguishing_aspect: "Third concurrent restricted order for the same patient -> ERR_RESTRICTED_ORDER_CAP (cap 2)."
        test_recipe:
          setup: ["H; MD; P; three restricted drugs R1 R2 R3; two PENDING restricted orders exist"]
          setup_api_calls:
            - call: "POST /stewardship/hospitals"
              payload: { name: "H", nhsn_facility_id: "NHSN-1" }
              as: StewardshipAdmin
              captures: { h_id: $.data.id }
