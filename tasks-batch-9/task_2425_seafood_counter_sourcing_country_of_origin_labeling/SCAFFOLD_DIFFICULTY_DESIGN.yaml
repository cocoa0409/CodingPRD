            - "hop 4: AdvertisedItem.${item_id}.status == RETRACTED and AdvertisedItem.${item_id}.retract_reason == LABEL_WITHDRAWN"
            - "exactly 1 ComplianceViolation exists for Counter.${counter_id} with category == COOL_MISSING and points == 4"
            - "0 ShrinkEvent rows exist for SupplierLot.${lot_id}"
            - "Counter.${counter_id}.open_excursion_count == 1 and Counter.${counter_id}.violation_points == 4 and Counter.${counter_id}.posture == RESTRICTED"
            - "SupplierLot.${lot_id}.remaining_weight_kg == 20.000"

  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: settle_chargeback_state_beats_fiscal_amount_mismatch
        grounds:
          - validations[priority=24]
          - validations[priority=54]
          - state_machines.SupplierLot.chargeback_status.ASSESSED_to_SETTLED
          - errors.ERR_CHARGEBACK_STATE_INVALID
          - errors.ERR_SETTLEMENT_AMOUNT_MISMATCH
        distinguishing_aspect: |
          Pair 1 crosses the `state` category (priority 24, ERR_CHARGEBACK_STATE_INVALID)
          against the `business_fiscal` category (priority 54,
          ERR_SETTLEMENT_AMOUNT_MISMATCH): a settlement of 500 cents against a lot whose
          chargeback_status is still NONE violates both rows, and only the state row may be
          reported.
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T08:00:00Z"
            - "SupplierLot of Atlantic Cod, intake_status CASED in slot 1, chargeback_status NONE, chargeback_assessed_cents 0"
            - "Supplier with chargeback_outstanding_cents 0, so a 500-cent payment also violates the amount-match rule"
          setup_api_calls:
            - call: "POST /seafood-ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T08:00:00Z" }
              as: ChainAdmin
            - call: "POST /seafood-ops/counters"
              payload: { store_number: "4120", department_name: "Seafood Service Counter", case_slot_count: 6 }
              as: ChainAdmin
              captures: { counter_id: $.data.id }
            - call: "POST /seafood-ops/suppliers"
              payload: { name: "Gulf Bay Dealers", permit_number: "PERMIT-8801" }
              as: ChainAdmin
              captures: { supplier_id: $.data.id }
            - call: "POST /seafood-ops/species"
              payload: { market_name: "Atlantic Cod", scientific_name: "Gadus morhua", acceptable_market_names: ["Atlantic Cod", "Cod"], simp_covered: false, high_risk_substitution: false, sustainability_program_eligible: true }
              as: ChainAdmin
              captures: { cod_id: $.data.id }
            - call: "POST /seafood-ops/lots"
              payload: { counter_id: "${counter_id}", supplier_id: "${supplier_id}", species_id: "${cod_id}", lot_code: "COD-0801-A", harvest_method: "WILD_LONGLINE", production_method: "WILD", origin_country_code: "US", previously_frozen: false, fresh_claim: true, received_weight_kg: 20.000, unit_cost_cents_per_kg: 1700, retail_price_cents_per_kg: 2450, cooked_retail_price_cents_per_kg: 2600 }
              as: SeafoodManager
              as_user_id: "${counter_id}"
              captures: { lot_id: $.data.id }
            - call: "POST /seafood-ops/lots/${lot_id}/case"
              payload: { case_slot: 1 }
              as: SeafoodManager
              as_user_id: "${counter_id}"
          trigger:
            - call: "POST /seafood-ops/lots/${lot_id}/settle-chargeback"
              payload: { payment_amount_cents: 500 }
              as: SupplierRep
              as_user_id: "${supplier_id}"
              captures: { err: $.data.error_id }
          assert:
            - "trigger returns HTTP 409 with $.data.error_id == ERR_CHARGEBACK_STATE_INVALID"
            - "$.data.error_id != ERR_SETTLEMENT_AMOUNT_MISMATCH"
            - "SupplierLot.${lot_id}.chargeback_status == NONE"
            - "Supplier.${supplier_id}.chargeback_settled_cents == 0"
            - "Supplier.${supplier_id}.chargeback_outstanding_cents == 0"

      - name: case_label_publish_safety_beats_referential_certification
        grounds:
          - validations[priority=36]
          - validations[priority=41]
          - errors.ERR_OPEN_EXCURSION_BLOCKS
          - errors.ERR_CLAIM_NOT_SUBSTANTIATED
          - calculations.cold_chain_exposure
        distinguishing_aspect: |
          Pair 2 crosses a different category pair from pair 1 - `business_safety`
          (priority 36, ERR_OPEN_EXCURSION_BLOCKS) against `business_referential`
          (priority 41, ERR_CLAIM_NOT_SUBSTANTIATED) - and the open excursion sits in an
          EMPTY slot 2 so no state precondition on the slot-1 lot can mask the conflict,
          while the single open excursion leaves the counter only RESTRICTED, which does not
          gate case-label publication.
        test_recipe:
          setup:
            - "logical clock advanced to 2026-08-01T14:00:00Z"
            - "SupplierLot of Atlantic Cod, intake_status CASED in slot 1, no CaseLabel yet"
            - "SustainabilityCertification for the same counter, supplier and species, reviewed REJECT so its status is REVOKED, validity window 2026-07-01 to 2026-12-01 (so the expiry rule at priority 42 does not fire)"
            - "one OPEN ColdChainExcursion on slot 2, which holds no lot; Counter posture RESTRICTED, open_excursion_count 1"
          setup_api_calls:
            - call: "POST /seafood-ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T08:00:00Z" }
              as: ChainAdmin
            - call: "POST /seafood-ops/counters"
              payload: { store_number: "4120", department_name: "Seafood Service Counter", case_slot_count: 6 }
