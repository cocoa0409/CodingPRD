      - name: request_missing_x_user_id_header_rejected
        claim_type: error_triggerable
        grounds: [validations.priority_1, errors.ERR_UNAUTHENTICATED, errors.ERR_ROLE_NOT_PERMITTED]
        distinguishing_aspect: "Priority 1 outranks priority 2 and priority 3: an absent identity header must produce 401 even on a read whose path id does not exist and whose role would have been rejected anyway, while an unrecognised role name yields 403 rather than 401."
        test_recipe:
          setup:
            - "One property exists so that a legitimate authenticated read can be contrasted against the unauthenticated ones."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramOperator
            - call: "POST /properties"
              payload: { name: "Cedar Ridge", state_code: "TX", billing_mode: "PM_BILLED", benefit_tier: "PLUS", damage_waiver_enabled: true, aqg_enabled: true, credit_limit_cents: 5000000 }
              as: ProgramOperator
              captures: { prop_id: "$.data.id" }
          trigger:
            - call: "GET /properties/${prop_id}"
              payload: {}
              as: "<no X-User-ID header>"
              captures: { e_no_id: "$.data.error_id" }
            - call: "GET /properties/${prop_id}"
              payload: {}
              as: "<no X-User-Role header>"
              captures: { e_no_role: "$.data.error_id" }
            - call: "GET /properties/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: "<no X-User-ID header>"
              captures: { e_no_id_unknown: "$.data.error_id" }
            - call: "GET /properties/${prop_id}"
              payload: {}
              as: "Warehouse"
              as_user_id: "wh-001"
              captures: { e_bad_role: "$.data.error_id" }
          assert:
            - "${e_no_id} == ERR_UNAUTHENTICATED with HTTP 401"
            - "${e_no_role} == ERR_UNAUTHENTICATED with HTTP 401"
            - "${e_no_id_unknown} == ERR_UNAUTHENTICATED with HTTP 401 — priority 1 fires before the priority 3 existence lookup, so it is NOT ERR_PROPERTY_NOT_FOUND"
            - "${e_bad_role} == ERR_ROLE_NOT_PERMITTED with HTTP 403, because an unrecognised role name is an authorisation failure and not an authentication one"
            - "no state changed: Property.${prop_id}.version is still 1"

