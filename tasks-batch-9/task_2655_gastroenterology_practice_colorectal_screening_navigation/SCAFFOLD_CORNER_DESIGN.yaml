              as: Endoscopist
              as_user_id: "${endo_id}"
              captures: { eid3: $.data.error_id }
            - call: "POST /screening-episodes/${ep_id}/surveillance-recommendations"
              payload: { pathology_report_id: "${rep_id}", override_interval_months: 40, override_reason: "PATIENT_PREFERENCE", expected_episode_version: "${ep_v}" }
              as: Endoscopist
              as_user_id: "${endo2_id}"
              captures: { sr_id: $.data.id, sr_comp: $.data.computed_interval_months, sr_assigned: $.data.assigned_interval_months, sr_basis: $.data.basis, sr_due: $.data.next_due_date, sr_att: $.data.attesting_endoscopist_id }
          assert:
            - "${base_ivl} == 84 - the guideline recommendation from the finalize cascade"
            - "the first call returns HTTP 422 with ${eid1} == ERR_OVERRIDE_OUT_OF_RANGE, not ERR_SEGREGATION_OF_DUTIES, even though the caller is the performing endoscopist"
            - "the second call returns HTTP 422 with ${eid2} == ERR_OVERRIDE_OUT_OF_RANGE - abs(6 - 84) == 78 exceeds MAX_OVERRIDE_DELTA_MONTHS 48"
            - "the third call returns HTTP 403 with ${eid3} == ERR_SEGREGATION_OF_DUTIES - 40 is in range and abs(40 - 84) == 44 <= 48"
            - "the fourth call returns HTTP 201 with ${sr_comp} == 84, ${sr_assigned} == 40, ${sr_basis} == OVERRIDE_ATTESTED and ${sr_due} == 2030-01-15"
            - "${sr_att} == ${endo2_id}"
