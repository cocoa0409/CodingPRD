            - "captured err == ERR_OPPORTUNITY_UNAVAILABLE"

  # ===========================================================================
  # Section: calculations
  # ===========================================================================
  - section: calculations
    instances:
      - name: budget_remaining_after_proposal_submit
        claim_type: correct_result
        grounds: [calculations.brief_budget_remaining]
        distinguishing_aspect: "Aggregation input-set filter: a DRAFT proposal's fee is held in remaining budget (100000 - 60000 = 40000) while REJECTED/WITHDRAWN would be excluded."
        test_recipe:
          setup: ["Brand, OPEN brief budget 100000; series, episode, opportunity; proposal fee 60000 (guaranteed 10, rate 2000) created"]
          setup_api_calls:
            - { call: "POST /brands", payload: { name: "FizzCo", category: "BEVERAGE" }, as: AgencyAdmin, captures: { b_id: $.data.id } }
            - { call: "POST /brands/${b_id}/briefs", payload: { title: "T", objective: "O", budget_cents: 100000 }, as: BrandRep, as_user_id: "${b_id}", captures: { br_id: $.data.id } }
            - { call: "POST /briefs/${br_id}/submit", as: BrandRep, as_user_id: "${b_id}" }
            - { call: "POST /series", payload: { name: "Night Shift", network_name: "NBN", clearance_policy: "STANDARD" }, as: AgencyAdmin, captures: { s_id: $.data.id } }
            - { call: "POST /series/${s_id}/episodes", payload: { episode_number: 1, runtime_seconds: 1200, air_date: "2026-06-01T20:00:00Z" }, as: ProductionRep, as_user_id: "prod-1", captures: { ep_id: $.data.id } }
