  - name: event_version_increments_on_each_mutation
    claim_type: occ_version_increment
    grounds:
    - entities.Event
    - concurrency_rules[event-patch-stale-version]
    distinguishing_aspect: 'Event.version starts at 1 and increments by exactly 1 per mutation: after open-registration it reads 2, after a subsequent agreement create it reads 3.'
