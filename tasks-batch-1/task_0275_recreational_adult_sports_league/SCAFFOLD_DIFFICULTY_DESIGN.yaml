  - rule_id: priority_pair_validation_conflict
    instances:
      - name: season_phase_beats_capacity_on_team_register
        grounds:
          - validations[priority=6]
          - validations[priority=12]
          - errors[ERR_SEASON_PHASE]
          - errors[ERR_CAPACITY_EXCEEDED]
        distinguishing_aspect: >
          Registering a team while the season is not OPEN AND the division is already at
          team_capacity violates both p6 (state, ERR_SEASON_PHASE) and p12
          (business_constraint, ERR_CAPACITY_EXCEEDED); the lower-priority-number p6 wins.
          Pair = {state, business_constraint}.
        test_recipe:
          setup:
            - "Season created (DRAFT, never opened); a division with team_capacity=1 already CONFIRMED-full from an earlier OPEN window that has since been re-DRAFTED is not possible, so we use a DRAFT season where registration is simply not OPEN."
            - "Because Team create requires OPEN, the season-phase check fires before capacity is even evaluated."
          setup_api_calls:
            - call: "POST /seasons"
              payload: { name: "PP Season", sport: "SOCCER", registration_opens_at: "2026-08-01T00:00:00Z", registration_closes_at: "2026-09-01T00:00:00Z", refund_full_cutoff_at: "2026-09-10T00:00:00Z" }
