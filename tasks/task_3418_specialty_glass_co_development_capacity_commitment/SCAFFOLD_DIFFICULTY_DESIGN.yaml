            - { call: "POST /glass/programs/${p_id}/execute-nda", payload: { nda_reference: "NDA-002" }, as: ProgramManager }
            - { call: "POST /glass/compositions", payload: { program_id: "${p_id}", composition_code: "GX-200", complexity_multiplier: 1.0 }, as: ProgramManager, captures: { cx_id: $.data.id } }
            - { call: "POST /glass/qual-cycles", payload: { composition_id: "${cx_id}", test_plan_ref: "TP-2" }, as: ProgramManager, captures: { q_id: $.data.id } }
            - { call: "POST /glass/qual-cycles/${q_id}/begin-testing", as: DeviceMaker, as_user_id: "${m_id}" }
            - { call: "POST /glass/qual-cycles/${q_id}/record-result", payload: { outcome: "PASSED" }, as: DeviceMaker, as_user_id: "${m_id}" }
            - { call: "POST /glass/programs/${p_id}/begin-qualification", payload: { design_freeze_date: "2027-03-01T00:00:00Z" }, as: ProgramManager }
            - { call: "POST /glass/programs/${p_id}/freeze-design", as: ProgramManager }
            - { call: "POST /glass/compositions/${cx_id}/lock", as: ProgramManager }
            - { call: "POST /glass/licenses", payload: { device_maker_id: "${m_id}", program_id: "${p_id}", market: "AUTOMOTIVE", effective_date: "2027-01-01T00:00:00Z", expiry_date: "2028-12-31T00:00:00Z" }, as: LegalCounsel, captures: { lic1_id: $.data.id } }
            - { call: "POST /glass/_clock/set_current_utc", payload: { to_iso8601: "2027-01-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /glass/licenses/${lic1_id}/activate", as: LegalCounsel }
            - { call: "POST /glass/licenses", payload: { device_maker_id: "${m_id}", program_id: "${p_id}", market: "AUTOMOTIVE", effective_date: "2028-12-31T00:00:00Z", expiry_date: "2030-12-30T00:00:00Z" }, as: LegalCounsel, captures: { lic2_id: $.data.id } }
          trigger:
            - { call: "POST /glass/_clock/set_current_utc", payload: { to_iso8601: "2028-12-31T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /glass/licenses/${lic2_id}/activate", as: LegalCounsel, captures: { err: $.data.error_id } }
            - { call: "POST /glass/licenses", payload: { device_maker_id: "${m_id}", program_id: "${p_id}", market: "AUTOMOTIVE", effective_date: "2029-01-01T00:00:00Z", expiry_date: "2030-12-31T00:00:00Z" }, as: LegalCounsel, captures: { lic3_id: $.data.id } }
            - { call: "POST /glass/_clock/set_current_utc", payload: { to_iso8601: "2029-01-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /glass/licenses/${lic3_id}/activate", as: LegalCounsel, captures: { lic3_status: $.data.license_status } }
          assert:
            - "L2 activate: error_id == ERR_LICENSE_TERM_OVERLAP with http 422 (L1's inclusive expiry 2028-12-31 touches L2's inclusive start)"
