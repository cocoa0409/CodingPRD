              payload: { org_name: "Member NVOCC Co", org_type: "NVOCC" }
              as: CommissionAdmin
              captures: { cn_id: $.data.id }
          trigger:
            - call: "POST /fmc/carrier-agreements"
              payload: { agreement_number: "AG-BAD-1", agreement_type: "VESSEL_SHARING", member_carrier_ids: ["${ca_id}"] }
              as: CarrierRep
              as_user_id: "${ca_id}"
              captures: { err_single: $.data.error_id }
            - call: "POST /fmc/carrier-agreements"
              payload: { agreement_number: "AG-BAD-2", agreement_type: "VESSEL_SHARING", member_carrier_ids: ["${ca_id}", "${cn_id}"] }
              as: CarrierRep
              as_user_id: "${ca_id}"
              captures: { err_type: $.data.error_id }
            - call: "POST /fmc/carrier-agreements"
