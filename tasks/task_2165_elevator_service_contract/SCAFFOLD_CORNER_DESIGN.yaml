  # ===========================================================================
  - section: endpoints
    instances:

      - name: default_logical_clock_reads_the_fixed_startup_instant
        claim_type: Computed read
        grounds:
          - endpoints[POST /elevator-program/_clock/set_current_utc]
          - entities.Callback.fields.reported_at
        distinguishing_aspect: "Before any set_current_utc call the server clock is exactly 2026-08-01T00:00:00Z and never real wall-clock time: a callback created first stamps reported_at at that instant, and the first clock call then reports current_utc 2026-09-01T00:00:00.000Z."
        test_recipe:
          setup: ["Empty database; no clock call has been made."]
          setup_api_calls:
            - call: "POST /elevator-program/contracts"
              payload: { building_name: "Ep One", building_address: "1 Ep St", jurisdiction_code: "NY-NYC", fire_district_code: "FD-07", building_manager_user_id: "bm-e1", contractor_user_id: "sc-e1", scope_type: "FULL_MAINTENANCE", penalty_schedule: "SCHEDULE_A", monthly_base_fee_cents: 400000, callback_response_minutes: 60, entrapment_response_minutes: 30, term_start_date: "2026-01-01", term_end_date: "2027-12-31" }
              as: ProgramAdministrator
              as_user_id: "pa-1"
              captures: { ep1_id: $.data.id, ep1_created: $.data.created_at }
            - call: "POST /elevator-program/contracts/${ep1_id}/activate"
              payload: {}
              as: ProgramAdministrator
              as_user_id: "pa-1"
            - call: "POST /elevator-program/cars"
              payload: { contract_id: "${ep1_id}", car_code: "CAR-E1", car_type: "TRACTION", capacity_lbs: 3000 }
              as: ProgramAdministrator
              as_user_id: "pa-1"
              captures: { car_e1: $.data.id }
          trigger:
            - call: "POST /elevator-program/callbacks"
              payload: { car_id: "${car_e1}", callback_type: "NUISANCE", out_of_service: false }
              as: BuildingManager
              as_user_id: "bm-e1"
              captures: { cb_e1: $.data.id, cb_e1_at: $.data.reported_at }
            - call: "POST /elevator-program/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: ProgramAdministrator
              as_user_id: "pa-1"
              captures: { ep1_now: $.data.current_utc }
          assert:
            - "${cb_e1_at} == \"2026-08-01T00:00:00.000Z\""
            - "${ep1_created} == \"2026-08-01T00:00:00.000Z\""
            - "${ep1_now} == \"2026-09-01T00:00:00.000Z\""
            - "Callback.${cb_e1}.status == \"REPORTED\""

