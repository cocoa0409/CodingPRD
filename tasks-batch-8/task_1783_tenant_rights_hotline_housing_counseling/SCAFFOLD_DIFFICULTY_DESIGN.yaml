            - { call: "POST /hotline/scripts", payload: { jurisdiction_id: "${jur}", issue_category: "EVICTION", version_no: 1, body: "script v1" }, as: Counselor, as_user_id: "${auth}", captures: { scr1: $.data.id } }
            - { call: "POST /hotline/scripts/${scr1}/state", payload: { to_status: "IN_REVIEW" }, as: Counselor, as_user_id: "${auth}" }
            - { call: "POST /hotline/scripts/${scr1}/state", payload: { to_status: "PUBLISHED", effective_from: "2026-08-01T00:00:00Z" }, as: Counselor, as_user_id: "${rev}" }
            - { call: "POST /hotline/counselors", payload: { display_name: "Worker W", languages: ["en"], certified_jurisdiction_codes: ["CA"], certified_categories: ["EVICTION"], certification_expires_at: "2027-01-01T00:00:00Z", is_script_reviewer: false }, as: AgencyAdmin, captures: { wk: $.data.id } }
            - { call: "POST /hotline/counselors/${wk}/training-certifications", payload: { script_id: "${scr1}", score: 90 }, as: HotlineSupervisor }
            - { call: "POST /hotline/callers", payload: { alias: "caller-1", phone: "+15550001", preferred_language: "en", channel: "PHONE", is_anonymous: false }, as: Anonymous, captures: { cal: $.data.id, cal_v0: $.data.version } }
            - { call: "POST /hotline/legal-aid-orgs", payload: { name: "LegalAid X", covered_jurisdiction_codes: ["CA"], accepted_categories: ["EVICTION"], weekly_capacity: 1 }, as: AgencyAdmin, captures: { org: $.data.id } }
            - { call: "POST /hotline/sessions", payload: { caller_id: "${cal}", jurisdiction_id: "${jur}", issue_category: "EVICTION" }, as: Anonymous, captures: { sess: $.data.id } }
            - { call: "POST /hotline/sessions/${sess}/state", payload: { to_status: "ASSIGNED", counselor_id: "${wk}" }, as: Counselor, as_user_id: "${wk}" }
            - { call: "POST /hotline/sessions/${sess}/state", payload: { to_status: "ACTIVE" }, as: Counselor, as_user_id: "${wk}" }
            - { call: "POST /hotline/cases", payload: { caller_id: "${cal}", opened_from_session_id: "${sess}", jurisdiction_id: "${jur}", issue_category: "EVICTION" }, as: Counselor, as_user_id: "${wk}", captures: { case: $.data.id } }
            - { call: "POST /hotline/cases/${case}/state", payload: { to_status: "IN_PROGRESS" }, as: Counselor, as_user_id: "${wk}", captures: { case_v: $.data.version } }
            - { call: "POST /hotline/callers/${cal}/consents", payload: { consent_type: "LEGAL_AID_RELEASE", expected_caller_version: "${cal_v0}" }, as: Caller, as_user_id: "${cal}", captures: { cons: $.data.id } }
            - { call: "POST /hotline/cases/${case}/referrals", payload: { referral_type: "LEGAL_AID", legal_aid_org_id: "${org}", expected_case_version: "${case_v}" }, as: Counselor, as_user_id: "${wk}", captures: { ref1: $.data.id } }
            - { call: "GET /hotline/cases/${case}", as: Counselor, as_user_id: "${wk}", captures: { case_v2: $.data.version } }
            - { call: "POST /hotline/cases/${case}/referrals", payload: { referral_type: "LEGAL_AID", legal_aid_org_id: "${org}", expected_case_version: "${case_v2}" }, as: Counselor, as_user_id: "${wk}", captures: { ref2: $.data.id } }
          trigger:
            - { call: "POST /hotline/referrals/${ref1}/state", payload: { to_status: "DISPATCHED" }, as: Counselor, as_user_id: "${wk}", captures: { r1st: $.data.status } }
            - { call: "POST /hotline/referrals/${ref2}/state", payload: { to_status: "DISPATCHED" }, as: Counselor, as_user_id: "${wk}", captures: { err: $.data.error_id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T00:00:00Z" }, as: AgencyAdmin }
            - { call: "POST /hotline/referrals/${ref2}/state", payload: { to_status: "DISPATCHED" }, as: Counselor, as_user_id: "${wk}", captures: { r2st: $.data.status } }
            - { call: "GET /hotline/legal-aid-orgs/${org}", as: Counselor, as_user_id: "${wk}", captures: { reserved: $.data.current_week_reserved } }
          assert:
            - "R1 dispatched in W1: status DISPATCHED; R2 same-week dispatch rejected: error_id == ERR_ORG_CAPACITY_FULL (W1 reserved 1 >= capacity 1)"
