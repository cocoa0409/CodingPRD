  # ===========================================================================
  # Rule 4 — Transitive cascade chains from different triggers
  # ===========================================================================
  - rule_id: transitive_cascade
    instances:

      - name: license_expiry_cascades_to_site_suspension_and_request_cancellation
        grounds:
          - state_machines.License.VERIFIED_to_EXPIRED
          - state_machines.RecipientSite.QUALIFIED_to_SUSPENDED
          - state_machines.AllocationRequest.SUBMITTED_to_CANCELLED
          - state_machines.AllocationLine.RESERVED_to_RELEASED
          - calculations.site_active_license_count
        distinguishing_aspect: |
          Trigger is a logical-clock advance (License expiry sweep). Chain
          depth 3: License VERIFIED -> EXPIRED, which recomputes
          RecipientSite.active_license_count -> 0 and forces the site
          QUALIFIED -> SUSPENDED, which in turn cancels each open
          AllocationRequest and releases each RESERVED AllocationLine, which
          finally mutates ProductLot.quantity_committed. Depth 4 overall,
          distinct trigger from the recall cascade.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z."
            - "Donor D, RELEASABLE lot L quantity 100."
            - "Site S QUALIFIED holding exactly one VERIFIED license expiring 2026-09-15T00:00:00Z."
            - "SUBMITTED AllocationRequest R1 on S (no decision yet)."
            - "UNDER_REVIEW AllocationRequest R2 on S with a FINALIZED decision and one RESERVED line of quantity 10 against L."
          setup_api_calls:
            - call: "POST /medicine-relief/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /medicine-relief/donors"
              payload: { legal_name: "D", country_code: "US", tax_id: "T" }
              as: PlatformAdmin
              captures: { donor_id: $.data.id }
            - call: "POST /medicine-relief/lots"
              payload: { donor_id: "${donor_id}", ndc_code: "N1", product_name: "P", product_class: "STANDARD", dosage_form: "TABLET", unit_of_measure: "UNIT", quantity_received: 100, expiration_date: "2027-06-30T00:00:00Z", storage_temp_min_c: 15, storage_temp_max_c: 25, restricted_use_conditions: [], unit_acquisition_value_usd: 1.00, unit_wholesale_value_usd: 1.50 }
              as: QAPharmacist
              captures: { lot_id: $.data.id }
            - call: "POST /medicine-relief/lots/${lot_id}/release"
              payload: {}
              as: QAPharmacist
            - call: "POST /medicine-relief/sites"
              payload: { organization_name: "Expiry Clinic", site_type: "FREE_CLINIC", country_code: "US", cold_storage_capacity_l: 100, has_dea_registration: false, monthly_patient_volume: 100, underserved_index: 0.5 }
              as: ComplianceOfficer
              captures: { site_id: $.data.id }
            - call: "POST /medicine-relief/licenses"
              payload: { site_id: "${site_id}", license_type: "PHARMACY", issuing_authority: "TX BoP", license_number: "L-EXP-1", expires_on: "2026-09-15T00:00:00Z" }
              as: ComplianceOfficer
              captures: { lic_id: $.data.id }
            - call: "POST /medicine-relief/licenses/${lic_id}/verify"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /medicine-relief/sites/${site_id}/qualify"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /medicine-relief/allocation-requests"
              payload: { site_id: "${site_id}", ndc_code: "N1", quantity_requested: 20, justification_text: "r" }
              as: SiteCoordinator
              as_user_id: "${site_id}"
              captures: { req1_id: $.data.id }
            - call: "POST /medicine-relief/allocation-requests"
              payload: { site_id: "${site_id}", ndc_code: "N1", quantity_requested: 10, justification_text: "r" }
              as: SiteCoordinator
              as_user_id: "${site_id}"
              captures: { req2_id: $.data.id }
            - call: "POST /medicine-relief/allocation-requests/${req2_id}/begin-review"
              payload: {}
              as: AllocationOfficer
            - call: "GET /medicine-relief/allocation-requests/${req2_id}"
              payload: {}
              as: AllocationOfficer
              captures: { req2_v: $.data.version }
            - call: "POST /medicine-relief/allocation-decisions"
              payload: { request_id: "${req2_id}", rationale: "r", lines: [{ lot_id: "${lot_id}", quantity: 10 }] }
              as: AllocationOfficer
              captures: { dec_id: $.data.id }
            - call: "POST /medicine-relief/allocation-decisions/${dec_id}/finalize"
              payload: { expected_request_version: "${req2_v}" }
              as: AllocationOfficer
          trigger:
            - call: "POST /medicine-relief/_clock/set_current_utc"
              payload: { current_utc: "2026-09-16T00:00:00Z" }
              as: PlatformAdmin
          assert:
            - "License.${lic_id}.verification_status == EXPIRED"
            - "RecipientSite.${site_id}.active_license_count == 0"
            - "RecipientSite.${site_id}.qualification_status == SUSPENDED"
            - "AllocationRequest.${req1_id}.status == CANCELLED"
            - "AllocationLine for decision ${dec_id} transitioned RESERVED -> RELEASED"
            - "ProductLot.${lot_id}.quantity_committed == 0"
            - "ProductLot.${lot_id}.quantity_available == 100"

