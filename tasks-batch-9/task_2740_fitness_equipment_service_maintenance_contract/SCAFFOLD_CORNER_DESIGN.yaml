      - name: draft_contract_refuses_every_trigger_except_activate
        claim_type: invalid_transitions
        grounds:
          - state_machines[ServiceContract].transitions
          - validations[priority=21]
          - errors.ERR_CONTRACT_INVALID_STATE
        distinguishing_aspect: "From DRAFT the only declared trigger is activate; suspend, reinstate and renewal-quote issuance are all 409 ERR_CONTRACT_INVALID_STATE, and the renewal-quote attempt is refused on state grounds even though its expected_contract_version is correct (so the 412 gate is not what fired)."
        test_recipe:
          setup:
            - "Clock 2026-08-15T08:00:00Z; club NORTH with one unit and a DRAFT GOLD/FULL contract at version 1."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-15T08:00:00Z" }, as: ContractAdministrator }
            - { call: "POST /fleetcare/clubs", payload: { name: "Northside Fitness", region_code: "NORTH" }, as: ContractAdministrator, captures: { club_id: "$.data.id" } }
            - { call: "POST /fleetcare/equipment-models", payload: { manufacturer: "Pacemaster", model_code: "TM-900", category: "TREADMILL", model_year: 2019, pm_interval_hours: 250, expected_service_life_hours: 20000, base_annual_service_cents: 120000 }, as: ContractAdministrator, captures: { model_id: "$.data.id" } }
            - { call: "POST /fleetcare/equipment", payload: { club_id: "${club_id}", model_id: "${model_id}", serial_number: "SN-DR-1", install_date: "2024-03-01", initial_usage_hours: 500 }, as: ContractAdministrator, captures: { e1_id: "$.data.id" } }
            - { call: "POST /fleetcare/contracts", payload: { club_id: "${club_id}", coverage_tier: "GOLD", parts_inclusion: "FULL", pm_visits_per_year: 4, annual_base_cents: 140000, initial_parts_allowance_cents: 500000, term_start_date: "2026-01-01", term_end_date: "2026-12-31" }, as: ContractAdministrator, captures: { c_id: "$.data.id", c_ver: "$.data.version" } }
          trigger:
            - { call: "POST /fleetcare/contracts/${c_id}/suspend", payload: { reason: "TOO_EARLY" }, as: ContractAdministrator, captures: { err_susp: "$.data.error_id" } }
            - { call: "POST /fleetcare/contracts/${c_id}/reinstate", as: ContractAdministrator, captures: { err_rein: "$.data.error_id" } }
            - { call: "POST /fleetcare/contracts/${c_id}/renewal-quotes", payload: { expected_contract_version: "${c_ver}" }, as: ContractAdministrator, captures: { err_quote: "$.data.error_id" } }
          assert:
            - "${err_susp} == 'ERR_CONTRACT_INVALID_STATE' with HTTP 409"
            - "${err_rein} == 'ERR_CONTRACT_INVALID_STATE' with HTTP 409"
            - "${err_quote} == 'ERR_CONTRACT_INVALID_STATE' with HTTP 409 (not ERR_STALE_CONTRACT_VERSION)"
            - "ServiceContract.${c_id}.status == 'DRAFT' and version == 1 (no failed attempt bumped the version)"
            - "no RenewalQuote row exists"

