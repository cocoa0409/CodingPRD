        distinguishing_aspect: |
          A TAKEN attestation is not a refusal: it moves the hold to VIOLATED, empties the order's
          hold_release_at because VIOLATED holds leave the maximum, and still takes the order to READY -
          so the order looks schedulable while ERR_MED_HOLD_VIOLATED blocks every session. The only exit
          is the READY -> MED_HOLD_ISSUED loop: a replacement hold for the same class supersedes the
          violated one and must itself be attested WITHHELD before testing may proceed.
        test_recipe:
          setup:
            - "logical clock starts at 2026-08-01T06:00:00Z and the daily quality program runs then"
            - "order ORD-1 declares current_medication_classes [SABA] and is SUBMITTED"
            - "the SABA hold is instructed at 06:00 and the patient admits having taken the inhaler"
          setup_api_calls:
            - call: "POST /pft-lab/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T06:00:00Z" }
              as: LabManager
