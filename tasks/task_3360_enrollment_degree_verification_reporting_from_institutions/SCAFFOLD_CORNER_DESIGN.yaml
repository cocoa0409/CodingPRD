      - name: period_field_date_ordering_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=38]
          - errors[ERR_VALIDATION]
        distinguishing_aspect: "Field-ordering rules on the reporting calendar: term_end == term_start violates term_end > term_start, and submission_opens_at == submission_due_at violates opens < due — both 400 ERR_VALIDATION."
        test_recipe:
          setup:
            - "One institution exists"
          setup_api_calls:
            - { call: "POST /institutions", payload: { name: "State University", ope_id: "00123400", users: [ { email: "sub@su.edu", role: "SUBMITTER" } ] }, as: ClearinghouseOps, captures: { inst_id: "$.data.id" } }
          trigger:
