              as: QualityManager
              captures: { f1: $.data.id }
            - call: "POST /evaluation-forms"
              payload: { name: "No Compliance", version_label: "2026.08", auto_fail_policy: "ZERO_TOTAL", min_compliance_item_score: 3, behaviors: [ { code: "GREET", label: "Greeting", weight_pct: 50.00, compliance_critical: false, auto_fail_on_violation: false, max_points: 5, allows_not_applicable: false, guidance_text: "Use the branded greeting." }, { code: "RESOLVE", label: "Resolution", weight_pct: 50.00, compliance_critical: false, auto_fail_on_violation: false, max_points: 5, allows_not_applicable: false, guidance_text: "Resolve or set a next step." } ] }
