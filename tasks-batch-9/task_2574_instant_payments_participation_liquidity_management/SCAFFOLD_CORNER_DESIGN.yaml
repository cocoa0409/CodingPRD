# =============================================================================
# 1.9 Scaffold Corner Design - breadth coverage index for task 2574
# Instant Payments Participation & Liquidity Management
#
# Every `section:` value below is one of the nine sections of
# references/claim-extraction-guide.md and every `claim_type:` value is a row of
# that section's table. Corners already asserted by SCAFFOLD_DIFFICULTY_DESIGN.yaml
# are emitted as `excluded_because:` stubs naming the covering §1.8 instance.
#
# Error-catalog coverage (§1.6, 60 ids) - every id is triggered by at least one
# instance in this file or in SCAFFOLD_DIFFICULTY_DESIGN.yaml:
#   auth/RBAC: ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_PARTICIPANT_SCOPE_VIOLATION,
#     ERR_FRAUD_SEGREGATION_OF_DUTIES, ERR_ALERT_SEGREGATION_OF_DUTIES  -> section rbac
#   existence: the ten ERR_*_NOT_FOUND ids, ERR_INVALID_REQUEST,
#     ERR_INVALID_THRESHOLD_ORDERING, ERR_INVALID_INTERVAL -> sections entities / validations
#   OCC: ERR_STALE_POSITION_VERSION, ERR_STALE_PARTICIPANT_VERSION -> section cross_cutting_complexity_layers
#   state: ERR_INVALID_STATE_TRANSITION, ERR_PARTICIPANT_NOT_LIVE, ERR_PARTICIPANT_OFFLINE,
#     ERR_PARTICIPANT_SEND_FROZEN, ERR_FRAUD_REVIEW_NOT_ASSIGNED, ERR_TRANSFER_NOT_SETTLED,
#     ERR_TRANSFER_IRREVOCABLE, ERR_ALERT_NOT_ACKNOWLEDGEABLE, ERR_CYCLE_NOT_OPEN,
#     ERR_CYCLE_NOT_RECONCILABLE, ERR_VARIANCE_UNRESOLVED -> sections state_machines / validations
#   business: the remaining safety, referential, temporal, uniqueness, constraint and
#     fiscal ids -> section validations
# =============================================================================
scaffold_corner_design:
  - section: entities
    instances:
      - name: participant_create_applies_defaults_and_system_fields
        claim_type: Creation
        grounds:
          - entities.Participant
          - endpoints[POST /participants]
          - entities.Participant.fields.participation_model
          - entities.Participant.fields.enrollment_status
        distinguishing_aspect: "Creating a participant with only the three required fields returns 201 with participation_model defaulted to RECEIVE_ONLY, enrollment_status DRAFT, operational_posture NORMAL and version 1 - the safest model is the default, and no enrollment step is implied by creation."
        test_recipe:
          setup:
            - "The database is empty and the logical clock is set to 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: NetworkOperator
              as_user_id: "netops-01"
          trigger:
            - call: "POST /participants"
              payload: { legal_name: "Alpha National Bank", routing_number: "021000021", settlement_agent_reference: "SA-ALPHA-01" }
              as: NetworkOperator
              as_user_id: "netops-01"
              captures: { pa_id: $.data.id }
          assert:
            - "The response is HTTP 201 with the §1.0 envelope: success == true, data non-null, error_id == null"
            - "Participant.${pa_id}.participation_model == RECEIVE_ONLY (the declared default when the field is omitted)"
            - "Participant.${pa_id}.enrollment_status == DRAFT and operational_posture == NORMAL"
            - "Participant.${pa_id}.version == 1 and id is a UUID with no type prefix"
            - "Participant.${pa_id}.go_live_business_date == null, certification_round == 0 and suspension_reason == null"

      - name: participant_retrieval_returns_stored_row
        claim_type: Retrieval
        grounds:
          - endpoints[GET /participants/{id}]
          - entities.Participant
        distinguishing_aspect: "GET returns exactly what was stored, including the explicitly supplied participation_model rather than the default, so the read path is not re-deriving input fields."
        test_recipe:
          setup:
            - "One participant exists, created with participation_model RECEIVE_AND_REQUEST_FOR_PAYMENT at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: NetworkOperator
              as_user_id: "netops-01"
            - call: "POST /participants"
              payload: { legal_name: "Beta Trust Bank", routing_number: "021000089", settlement_agent_reference: "SA-BETA-01", participation_model: "RECEIVE_AND_REQUEST_FOR_PAYMENT" }
              as: NetworkOperator
              as_user_id: "netops-01"
              captures: { pb_id: $.data.id }
          trigger:
            - call: "GET /participants/${pb_id}"
              payload: {}
              as: LiquidityOfficer
              as_user_id: "liq-01"
          assert:
            - "The response is HTTP 200 with success == true"
            - "Participant.${pb_id}.legal_name == 'Beta Trust Bank', routing_number == '021000089' and settlement_agent_reference == 'SA-BETA-01'"
            - "Participant.${pb_id}.participation_model == RECEIVE_AND_REQUEST_FOR_PAYMENT (the supplied value, not the default)"
            - "Participant.${pb_id}.enrollment_status == DRAFT and version == 1"

      - name: participant_position_accounts_listing_returns_envelope
        claim_type: Listing
        grounds:
          - endpoints[GET /participants/{id}/position-accounts]
          - response_envelope
          - entities.PrefundedPositionAccount
        distinguishing_aspect: "The sub-resource list returns a data array plus the declared list metadata, and it is scoped to the parent participant - a second participant's account never appears in the first participant's listing."
        test_recipe:
          setup:
            - "Two participants exist, each with exactly one prefunded position account: Alpha with 1,200,000,000 cents and Beta with 500,000,000 cents."
            - "The clock is 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: NetworkOperator
              as_user_id: "netops-01"
            - call: "POST /participants"
              payload: { legal_name: "Alpha National Bank", routing_number: "021000021", settlement_agent_reference: "SA-ALPHA-01", participation_model: "SEND_AND_RECEIVE" }
              as: NetworkOperator
              as_user_id: "netops-01"
              captures: { pa_id: $.data.id }
            - call: "POST /position-accounts"
              payload: { participant_id: "${pa_id}", opening_balance_cents: 1200000000, warning_threshold_cents: 1100000000, critical_threshold_cents: 1000000000, floor_cents: 200000000 }
              as: LiquidityOfficer
              as_user_id: "liq-01"
              captures: { acct_id: $.data.id }
            - call: "POST /participants"
              payload: { legal_name: "Beta Trust Bank", routing_number: "021000089", settlement_agent_reference: "SA-BETA-01", participation_model: "SEND_AND_RECEIVE" }
              as: NetworkOperator
              as_user_id: "netops-01"
              captures: { pb_id: $.data.id }
            - call: "POST /position-accounts"
              payload: { participant_id: "${pb_id}", opening_balance_cents: 500000000, warning_threshold_cents: 300000000, critical_threshold_cents: 200000000, floor_cents: 100000000 }
              as: LiquidityOfficer
              as_user_id: "liq-01"
          trigger:
            - call: "GET /participants/${pa_id}/position-accounts"
              payload: {}
              as: LiquidityOfficer
              as_user_id: "liq-01"
              captures: { listed_acct_id: "$.data[0].id" }
          assert:
            - "The response is HTTP 200 with success == true and data as an array of length 1"
            - "${listed_acct_id} == ${acct_id}: Beta's account is absent from Alpha's listing"
            - "The listed row carries opening_balance_cents == 1200000000, current_balance_cents == 1200000000, reserved_cents == 0, available_cents == 1200000000 and alert_tier == GREEN"

      - name: credit_transfer_unknown_id_not_found
        claim_type: Not Found
        grounds:
          - endpoints[GET /credit-transfers/{id}]
          - errors[ERR_CREDIT_TRANSFER_NOT_FOUND]
          - validations[priority=33]
        distinguishing_aspect: "A well-formed but unknown UUID yields the entity-specific 404 error id rather than a generic 400 or an empty 200 body, and the envelope carries success == false with a null data field."
        test_recipe:
          setup:
            - "The database contains no CreditTransfer rows; the clock is 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: NetworkOperator
              as_user_id: "netops-01"
          trigger:
            - call: "GET /credit-transfers/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: NetworkOperator
              as_user_id: "netops-01"
              captures: { err: $.data.error_id }
          assert:
            - "The response is HTTP 404 with success == false and data == null"
            - "${err} == ERR_CREDIT_TRANSFER_NOT_FOUND"

      - name: position_account_missing_required_floor_cents_rejected
        claim_type: Required Fields
        grounds:
          - endpoints[POST /position-accounts]
          - validations[priority=45]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "floor_cents has source input and no default, so omitting it is a 400 ERR_INVALID_REQUEST rather than a silently zeroed floor - a zero floor would let every later transfer drain the position."
        test_recipe:
          setup:
            - "One participant exists in DRAFT; the clock is 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: NetworkOperator
              as_user_id: "netops-01"
            - call: "POST /participants"
              payload: { legal_name: "Alpha National Bank", routing_number: "021000021", settlement_agent_reference: "SA-ALPHA-01", participation_model: "SEND_AND_RECEIVE" }
              as: NetworkOperator
              as_user_id: "netops-01"
              captures: { pa_id: $.data.id }
          trigger:
            - call: "POST /position-accounts"
              payload: { participant_id: "${pa_id}", opening_balance_cents: 1200000000, warning_threshold_cents: 1100000000, critical_threshold_cents: 1000000000 }
              as: LiquidityOfficer
              as_user_id: "liq-01"
              captures: { err: $.data.error_id }
          assert:
            - "The response is HTTP 400 and ${err} == ERR_INVALID_REQUEST"
            - "Zero PrefundedPositionAccount rows exist for participant ${pa_id}"

      - name: customer_account_invalid_enum_segment_rejected
        claim_type: Type Constraints
        grounds:
          - entities.CustomerAccount.fields.segment
          - validations[priority=45]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "segment is closed over exactly four values; a plausible-but-undeclared value such as GOVERNMENT is refused at the existence tier (400) before any policy lookup, so the caller never sees ERR_NO_GOVERNING_SEGMENT_POLICY for a typo."
        test_recipe:
          setup:
            - "Alpha National Bank is LIVE with a prefunded position account of 1,200,000,000 cents."
            - "The clock is 2026-08-03T13:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T13:00:00Z" }
              as: NetworkOperator
              as_user_id: "netops-01"
            - call: "POST /participants"
              payload: { legal_name: "Alpha National Bank", routing_number: "021000021", settlement_agent_reference: "SA-ALPHA-01", participation_model: "SEND_AND_RECEIVE" }
              as: NetworkOperator
              as_user_id: "netops-01"
              captures: { pa_id: $.data.id }
            - call: "POST /position-accounts"
              payload: { participant_id: "${pa_id}", opening_balance_cents: 1200000000, warning_threshold_cents: 1100000000, critical_threshold_cents: 1000000000, floor_cents: 200000000 }
              as: LiquidityOfficer
              as_user_id: "liq-01"
            - call: "POST /participants/${pa_id}/attestation"
              payload: { attestation_document_reference: "ATT-ALPHA-2026-08" }
              as: ParticipantAdmin
              as_user_id: "${pa_id}"
            - call: "POST /participants/${pa_id}/certification-window"
              payload: { certification_test_suite_version: "CERT-2026.2" }
              as: NetworkOperator
              as_user_id: "netops-01"
            - call: "POST /participants/${pa_id}/certification-results"
              payload: { outcome: "PASS" }
              as: NetworkOperator
              as_user_id: "netops-01"
            - call: "POST /participants/${pa_id}/activation"
              payload: { go_live_business_date: "2026-08-03" }
              as: NetworkOperator
              as_user_id: "netops-01"
          trigger:
            - call: "POST /customer-accounts"
              payload: { participant_id: "${pa_id}", segment: "GOVERNMENT", account_reference: "CUST-ALPHA-0009", fraud_risk_baseline: 20 }
              as: ParticipantAdmin
              as_user_id: "${pa_id}"
              captures: { err: $.data.error_id }
          assert:
            - "The response is HTTP 400 and ${err} == ERR_INVALID_REQUEST"
            - "Zero CustomerAccount rows exist"
            - "The error is NOT ERR_NO_GOVERNING_SEGMENT_POLICY: enum validation at priority 45 precedes every business_referential check"

      - name: position_account_computed_balances_input_ignored
        claim_type: Computed Fields
        grounds:
          - entities.PrefundedPositionAccount.fields.current_balance_cents
          - entities.PrefundedPositionAccount.fields.reserved_cents
          - entities.PrefundedPositionAccount.fields.available_cents
          - calculations.position_balance_and_availability
        distinguishing_aspect: "current_balance_cents, reserved_cents, available_cents and alert_tier are computed; supplied values for them are ignored rather than stored, so the row that comes back is derived from opening_balance_cents and the (empty) ledger, not from the payload."
        test_recipe:
          setup:
            - "One participant exists in DRAFT; the clock is 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: NetworkOperator
              as_user_id: "netops-01"
            - call: "POST /participants"
              payload: { legal_name: "Alpha National Bank", routing_number: "021000021", settlement_agent_reference: "SA-ALPHA-01", participation_model: "SEND_AND_RECEIVE" }
              as: NetworkOperator
              as_user_id: "netops-01"
              captures: { pa_id: $.data.id }
          trigger:
            - call: "POST /position-accounts"
              payload: { participant_id: "${pa_id}", opening_balance_cents: 1200000000, warning_threshold_cents: 1100000000, critical_threshold_cents: 1000000000, floor_cents: 200000000, current_balance_cents: 999, reserved_cents: 777, available_cents: 555, alert_tier: "BREACH", last_ledger_sequence_no: 42 }
              as: LiquidityOfficer
              as_user_id: "liq-01"
              captures: { acct_id: $.data.id }
          assert:
            - "The response is HTTP 201"
            - "PrefundedPositionAccount.${acct_id}.current_balance_cents == 1200000000, not 999"
            - "PrefundedPositionAccount.${acct_id}.reserved_cents == 0 and available_cents == 1200000000, not 777 and 555"
            - "PrefundedPositionAccount.${acct_id}.alert_tier == GREEN, not BREACH"
            - "PrefundedPositionAccount.${acct_id}.last_ledger_sequence_no == 0, not 42"
            - "Participant.${pa_id}.operational_posture == NORMAL"

      - name: ledger_entry_immutable_carries_no_version
        claim_type: Immutability
        grounds:
          - entities.LiquidityLedgerEntry
          - endpoints[POST /position-accounts/{id}/ledger-adjustments]
          - endpoints[GET /position-accounts/{id}/ledger-entries]
        distinguishing_aspect: "LiquidityLedgerEntry declares common_fields false, so its rows carry id and created_at only - no version, no updated_at - and §1.5 exposes no update or delete route for them; corrections must be new signed entries, which is what makes the ledger identity in the §1.8 compensating-invariant instances checkable."
        test_recipe:
          setup:
            - "Alpha National Bank has a prefunded position account of 1,200,000,000 cents and no ledger entries yet."
            - "The clock is 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: NetworkOperator
              as_user_id: "netops-01"
            - call: "POST /participants"
              payload: { legal_name: "Alpha National Bank", routing_number: "021000021", settlement_agent_reference: "SA-ALPHA-01", participation_model: "SEND_AND_RECEIVE" }
              as: NetworkOperator
              as_user_id: "netops-01"
              captures: { pa_id: $.data.id }
            - call: "POST /position-accounts"
              payload: { participant_id: "${pa_id}", opening_balance_cents: 1200000000, warning_threshold_cents: 1100000000, critical_threshold_cents: 1000000000, floor_cents: 200000000 }
              as: LiquidityOfficer
              as_user_id: "liq-01"
              captures: { acct_id: $.data.id }
          trigger:
            - call: "POST /position-accounts/${acct_id}/ledger-adjustments"
              payload: { entry_type: "FUNDING_CREDIT", magnitude_cents: 100000000, reference: "Morning prefunding top-up" }
              as: LiquidityOfficer
              as_user_id: "liq-01"
              captures: { le_id: $.data.id }
          assert:
            - "The response is HTTP 201 and the entry carries id and created_at but no version and no updated_at field"
            - "LiquidityLedgerEntry.${le_id}.entry_type == FUNDING_CREDIT, amount_cents == 100000000, balance_after_cents == 1300000000, sequence_no == 1 and business_date == 2026-08-01"
            - "PrefundedPositionAccount.${acct_id}.current_balance_cents == 1300000000, alert_tier == GREEN and last_ledger_sequence_no == 1"
            - "§1.5 declares no PATCH or DELETE route on /position-accounts/{id}/ledger-entries, so the entry can only be offset by a further signed entry"

      - name: credit_transfer_with_unknown_customer_account_id_not_found
        claim_type: Parent Relationships
        grounds:
          - entities.CreditTransfer.fields.customer_account_id
          - errors[ERR_CUSTOMER_ACCOUNT_NOT_FOUND]
          - validations[priority=41]
          - complexity_profile.entity_topology
        distinguishing_aspect: "In a flat topology every foreign key in the body is resolved before any business rule runs: an unknown customer_account_id is a 404 on that entity even though the participant, the position account version and the amount are all valid, and no CreditTransfer row is left behind."
        test_recipe:
          setup:
            - "Alpha National Bank is LIVE with a position account of 1,200,000,000 cents, a CORPORATE segment policy effective from 2026-08-01T00:00:00Z, and settlement cycle 2026-08-03 OPEN."
            - "No CustomerAccount rows exist at all."
            - "The clock is 2026-08-03T13:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T13:00:00Z" }
              as: NetworkOperator
              as_user_id: "netops-01"
            - call: "POST /participants"
              payload: { legal_name: "Alpha National Bank", routing_number: "021000021", settlement_agent_reference: "SA-ALPHA-01", participation_model: "SEND_AND_RECEIVE" }
              as: NetworkOperator
              as_user_id: "netops-01"
              captures: { pa_id: $.data.id }
            - call: "POST /position-accounts"
              payload: { participant_id: "${pa_id}", opening_balance_cents: 1200000000, warning_threshold_cents: 1100000000, critical_threshold_cents: 1000000000, floor_cents: 200000000 }
              as: LiquidityOfficer
              as_user_id: "liq-01"
              captures: { acct_id: $.data.id }
            - call: "POST /participants/${pa_id}/attestation"
              payload: { attestation_document_reference: "ATT-ALPHA-2026-08" }
              as: ParticipantAdmin
              as_user_id: "${pa_id}"
            - call: "POST /participants/${pa_id}/certification-window"
              payload: { certification_test_suite_version: "CERT-2026.2" }
              as: NetworkOperator
              as_user_id: "netops-01"
            - call: "POST /participants/${pa_id}/certification-results"
              payload: { outcome: "PASS" }
              as: NetworkOperator
              as_user_id: "netops-01"
            - call: "POST /participants/${pa_id}/activation"
              payload: { go_live_business_date: "2026-08-03" }
              as: NetworkOperator
              as_user_id: "netops-01"
              captures: { pa_v: $.data.version }
            - call: "POST /segment-policies"
              payload: { participant_id: "${pa_id}", segment: "CORPORATE", per_transaction_limit_cents: 250000000, daily_aggregate_limit_cents: 500000000, rolling_window_count_limit: 5, rolling_window_amount_limit_cents: 400000000, effective_from: "2026-08-01T00:00:00Z", expected_participant_version: "${pa_v}" }
              as: ParticipantAdmin
              as_user_id: "${pa_id}"
            - call: "POST /settlement-cycles"
              payload: { business_date: "2026-08-03" }
              as: NetworkOperator
              as_user_id: "netops-01"
            - call: "GET /position-accounts/${acct_id}"
              payload: {}
              as: PaymentOperator
              as_user_id: "ops-alpha-01"
              captures: { acct_v1: $.data.version }
          trigger:
            - call: "POST /credit-transfers"
              payload: { originator_participant_id: "${pa_id}", customer_account_id: "00000000-0000-4000-8000-000000000000", receiver_routing_number: "021000089", amount_cents: 100000000, expected_position_account_version: "${acct_v1}" }
              as: PaymentOperator
              as_user_id: "ops-alpha-01"
              captures: { err: $.data.error_id }
          assert:
            - "The response is HTTP 404 and ${err} == ERR_CUSTOMER_ACCOUNT_NOT_FOUND"
            - "Zero CreditTransfer rows exist"
            - "PrefundedPositionAccount.${acct_id}.version == ${acct_v1} and reserved_cents == 0 (the refused create bumped nothing)"

      - name: participant_unknown_id_not_found
        claim_type: Not Found
        grounds:
          - validations[priority=30]
          - errors[ERR_PARTICIPANT_NOT_FOUND]
          - endpoints[GET /participants/{id}]
        distinguishing_aspect: "The path-level participant resolution (priority 30) is a distinct rule from the body-level resolution (priority 40) and both raise ERR_PARTICIPANT_NOT_FOUND; a GET against an unknown but well-formed UUID is a 404, never a 400."
        test_recipe:
          setup:
            - "The database contains no Participant rows; the clock is 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: NetworkOperator
              as_user_id: "netops-01"
          trigger:
            - call: "GET /participants/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: NetworkOperator
              as_user_id: "netops-01"
              captures: { err: $.data.error_id }
          assert:
            - "The response is HTTP 404 with success == false and data == null"
            - "${err} == ERR_PARTICIPANT_NOT_FOUND"

      - name: position_account_unknown_id_not_found
        claim_type: Not Found
        grounds:
          - validations[priority=31]
          - errors[ERR_POSITION_ACCOUNT_NOT_FOUND]
          - endpoints[GET /position-accounts/{id}]
        distinguishing_aspect: "Every /position-accounts/{id} sub-path shares one resolution rule, so the read of an unknown account is a 404 with the account-specific error id rather than an empty projection or ledger list."
        test_recipe:
          setup:
            - "The database contains no PrefundedPositionAccount rows; the clock is 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: NetworkOperator
              as_user_id: "netops-01"
          trigger:
            - call: "GET /position-accounts/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: LiquidityOfficer
              as_user_id: "liq-01"
              captures: { err: $.data.error_id }
          assert:
            - "The response is HTTP 404 and ${err} == ERR_POSITION_ACCOUNT_NOT_FOUND"
            - "GET /position-accounts/00000000-0000-4000-8000-000000000000/ledger-entries and /alerts and /liquidity-projection all return the same 404 error id"

      - name: liquidity_alert_unknown_id_not_found
        claim_type: Not Found
        grounds:
          - validations[priority=32]
          - errors[ERR_LIQUIDITY_ALERT_NOT_FOUND]
          - endpoints[POST /liquidity-alerts/{id}/acknowledgement]
        distinguishing_aspect: "The alert is reachable only through its acknowledgement action and the parent account listing, so the 404 for an unknown alert is raised by the action endpoint itself, ahead of the acknowledgeable-state and segregation-of-duties rules."
        test_recipe:
          setup:
            - "The database contains no LiquidityAlert rows; the clock is 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: NetworkOperator
              as_user_id: "netops-01"
          trigger:
            - call: "POST /liquidity-alerts/00000000-0000-4000-8000-000000000000/acknowledgement"
              payload: { remediation_plan: "Funding request raised with treasury." }
