            - "order O2 is still status OPEN with allocated_units 0: a rejected allocation persists nothing"

      - name: bridging_decision_rejects_approval_while_the_paired_data_is_still_missing
        claim_type: Violation → Error
        grounds:
          - validations.priority_125_ERR_PAIRED_DATA_MISSING
          - errors.ERR_PAIRED_DATA_MISSING
          - calculations.bridging_equivalence
