          rationale: "That instance reads back every fee_breakdown key against pre-computed cents, which is exactly the derived-read claim for the athlete row."

  - section: errors
    instances:

      - name: corner_error_every_remaining_entity_reports_its_own_not_found
        claim_type: Not Found
        grounds:
          - validations[priority=14]
          - errors[ERR_SESSION_SLOT_NOT_FOUND]
          - errors[ERR_QUALIFYING_RESULT_NOT_FOUND]
          - errors[ERR_SPORT_ENTRY_NOT_FOUND]
          - errors[ERR_MEDICAL_SCREENING_NOT_FOUND]
          - errors[ERR_PERSONNEL_NOT_FOUND]
          - errors[ERR_PERSONNEL_ASSIGNMENT_NOT_FOUND]
          - errors[ERR_ACCOMMODATION_BLOCK_NOT_FOUND]
          - errors[ERR_VILLAGE_STAY_NOT_FOUND]
          - errors[ERR_SPONSORSHIP_COMMITMENT_NOT_FOUND]
        distinguishing_aspect: "Triggerability audit for the nine path-scoped not-found codes that no other instance reaches: each single-row GET on a syntactically valid but unknown UUID answers HTTP 404 with the code named after its own entity, so no endpoint falls back to a generic not-found code and none of them answers 200 with an empty body."
