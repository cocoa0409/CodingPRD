          setup: ["QUEUED order O-CC1 (v1) with allocation A1 (v2); version v2 captured; allocation A2 added (v3)"]
          setup_api_calls:
            - { call: "POST /material-lots", payload: { lot_code: "L-CC1", resin_type: PETG, gauge_mm: 1.500, cleanliness_grade_required: INDUSTRIAL, quantity_kg: 10.000, unit_cost_per_kg: 10.00 }, as: MaterialsPlanner, captures: { lot_id: $.data.id } }
            - { call: "POST /cleanliness-certificates", payload: { subject_type: MATERIAL_LOT, subject_id: "${lot_id}", grade: INDUSTRIAL, issued_at: "2026-04-01T00:00:00Z", expires_at: "2026-09-01T00:00:00Z", cert_body: "LabA" }, as: QualityInspector }
            - { call: "POST /tools", payload: { tool_code: "T-CC1", part_number: "P-CC1", tool_type: FORM_MOLD, min_gauge_mm: 1.000, max_gauge_mm: 3.000, cleanliness_grade: INDUSTRIAL, prototype_cost: 1000.00 }, as: ToolingEngineer, captures: { tool_id: $.data.id } }
            - { call: "POST /tools/${tool_id}/complete-prototype", as: ToolingEngineer }
            - { call: "POST /packaging-specs", payload: { spec_code: "S-CC1", spec_type: STOCK, cleanliness_grade: INDUSTRIAL, per_pack_cost: 0.30 }, as: PackagingEngineer, captures: { spec_id: $.data.id } }
            - { call: "POST /production-orders", payload: { order_code: "O-CC1", part_number: "P-CC1", resin_type: PETG, ordered_qty: 100, required_gauge_mm: 1.500, cleanliness_grade: INDUSTRIAL, spec_nominal_wall_mm: 1.300, spec_min_wall_mm: 1.230, nominal_part_weight_kg: 0.050, std_cycle_time_s: 30, std_machine_rate_per_hour: 55.00, tool_id: "${tool_id}", packaging_spec_id: "${spec_id}", is_prototype_order: true }, as: ProductionScheduler, captures: { order_id: $.data.id } }
            - { call: "POST /material-allocations", payload: { production_order_id: "${order_id}", source_type: VIRGIN_LOT, lot_id: "${lot_id}", qty_kg: 3.000 }, as: ProductionScheduler }
            - { call: "GET /production-orders/${order_id}", as: Any, captures: { o_ver_stale: $.data.version } }
            - { call: "POST /material-allocations", payload: { production_order_id: "${order_id}", source_type: VIRGIN_LOT, lot_id: "${lot_id}", qty_kg: 2.900 }, as: ProductionScheduler }
          trigger:
            - { call: "POST /production-orders/${order_id}/stage", payload: { expected_production_order_version: "${o_ver_stale}" }, as: ProductionScheduler, captures: { err: $.data.error_id } }
            - { call: "GET /production-orders/${order_id}", as: Any, captures: { o_ver_fresh: $.data.version } }
            - { call: "POST /production-orders/${order_id}/stage", payload: { expected_production_order_version: "${o_ver_fresh}" }, as: ProductionScheduler, captures: { st: $.data.schedule_status } }
          assert:
            - "Stale stage (expected v2, actual v3) rejected: error == ERR_STALE_VERSION with HTTP 412 (captured ${err})"
            - "Fresh stage (v3 == ${o_ver_fresh}) succeeds: schedule_status == STAGED (captured ${st})"
      - name: scrap_certify_lifecycle_and_batch_auto_advance
        claim_type: cascading_side_effects
        grounds: ["state_machines.ScrapRecord.PENDING_to_CERTIFIED", "state_machines.RegrindBatch.ACCEPTING_to_PENDING_CERT", "errors[ERR_INVALID_SCRAP_STATE]"]
        distinguishing_aspect: "Certifying a scrap record both flips the record PENDING -> CERTIFIED and advances the batch ACCEPTING -> PENDING_CERT at exactly accumulated == target (1.000 >= 1.000); the terminal scrap record then rejects further certify attempts."
        test_recipe:
          setup: ["donor order produced 1.000kg scrap; batch RB-CC2 (PETG, target 1.000kg) ACCEPTING"]
          setup_api_calls:
            - { call: "POST /material-lots", payload: { lot_code: "L-CC2", resin_type: PETG, gauge_mm: 1.500, cleanliness_grade_required: INDUSTRIAL, quantity_kg: 10.000, unit_cost_per_kg: 10.00 }, as: MaterialsPlanner, captures: { lot_id: $.data.id } }
            - { call: "POST /cleanliness-certificates", payload: { subject_type: MATERIAL_LOT, subject_id: "${lot_id}", grade: INDUSTRIAL, issued_at: "2026-04-01T00:00:00Z", expires_at: "2026-09-01T00:00:00Z", cert_body: "LabA" }, as: QualityInspector }
            - { call: "POST /tools", payload: { tool_code: "T-CC2", part_number: "P-CC2", tool_type: FORM_MOLD, min_gauge_mm: 1.000, max_gauge_mm: 3.000, cleanliness_grade: INDUSTRIAL, prototype_cost: 1000.00 }, as: ToolingEngineer, captures: { tool_id: $.data.id } }
            - { call: "POST /tools/${tool_id}/complete-prototype", as: ToolingEngineer }
            - { call: "POST /packaging-specs", payload: { spec_code: "S-CC2", spec_type: STOCK, cleanliness_grade: INDUSTRIAL, per_pack_cost: 0.30 }, as: PackagingEngineer, captures: { spec_id: $.data.id } }
            - { call: "POST /machine-resources", payload: { resource_code: "ST-CC2", resource_type: FORMING_STATION, cleanliness_grade: INDUSTRIAL, machine_rate_per_hour: 55.00 }, as: ProductionScheduler, captures: { station_id: $.data.id } }
            - { call: "POST /production-orders", payload: { order_code: "O-CC2", part_number: "P-CC2", resin_type: PETG, ordered_qty: 100, required_gauge_mm: 1.500, cleanliness_grade: INDUSTRIAL, spec_nominal_wall_mm: 1.300, spec_min_wall_mm: 1.230, nominal_part_weight_kg: 0.050, std_cycle_time_s: 30, std_machine_rate_per_hour: 55.00, tool_id: "${tool_id}", packaging_spec_id: "${spec_id}", is_prototype_order: true }, as: ProductionScheduler, captures: { order_id: $.data.id } }
            - { call: "POST /material-allocations", payload: { production_order_id: "${order_id}", source_type: VIRGIN_LOT, lot_id: "${lot_id}", qty_kg: 5.900 }, as: ProductionScheduler }
            - { call: "GET /production-orders/${order_id}", as: Any, captures: { o_ver: $.data.version } }
            - { call: "POST /production-orders/${order_id}/stage", payload: { expected_production_order_version: "${o_ver}" }, as: ProductionScheduler }
            - { call: "POST /forming-runs", payload: { production_order_id: "${order_id}", station_id: "${station_id}", planned_start: "2026-05-02T10:00:00Z", planned_end: "2026-05-02T10:30:00Z", oven_temp_c: 180.0, cycle_time_s: 30, shots_planned: 10 }, as: ProductionScheduler, captures: { run_id: $.data.id } }
            - { call: "POST /forming-runs/${run_id}/complete", payload: { shots_completed: 10, scrap_weight_kg: 1.000, actual_end: "2026-05-02T10:30:00Z" }, as: ProductionScheduler }
            - { call: "GET /scrap-records", payload: { forming_run_id: "${run_id}" }, as: Any, captures: { scrap_id: "$.data[0].id" } }
            - { call: "POST /regrind-batches", payload: { batch_code: "RB-CC2", resin_type: PETG, source_grade: INDUSTRIAL, target_kg: 1.000 }, as: MaterialsPlanner, as_user_id: planner-1, captures: { rb_id: $.data.id } }
          trigger:
            - { call: "POST /scrap-records/${scrap_id}/certify", payload: { regrind_batch_id: "${rb_id}", decision: CERTIFY }, as: MaterialsPlanner, captures: { scrap_st: $.data.status } }
            - { call: "GET /regrind-batches/${rb_id}", as: Any, captures: { batch_st: $.data.status, batch_acc: $.data.accumulated_kg } }
            - { call: "POST /scrap-records/${scrap_id}/certify", payload: { regrind_batch_id: "${rb_id}", decision: CERTIFY }, as: MaterialsPlanner, captures: { err: $.data.error_id } }
          assert:
            - "ScrapRecord.${scrap_id}.status == CERTIFIED (captured ${scrap_st})"
            - "RegrindBatch.${rb_id}.status == PENDING_CERT with accumulated_kg == 1.000 (captured ${batch_st} / ${batch_acc}) — auto-advance at exact target"
            - "Re-certify rejected: error == ERR_INVALID_SCRAP_STATE (captured ${err})"
      - name: resume_rejected_when_review_allocation_unrecoverable
        claim_type: cascading_side_effects
        grounds: ["state_machines.ProductionOrder(schedule_status).ON_HOLD_to_RUNNING", "state_machines.MaterialAllocation.REVIEW_to_RESERVED", "errors[ERR_ALLOCATION_REVIEW_FAILED]"]
        distinguishing_aspect: "Resume re-validates REVIEW allocations against live source state: when the source lot has since been BLOCKED, re-validation fails with ERR_ALLOCATION_REVIEW_FAILED and the order stays ON_HOLD — the hold is not released until the plan is repaired."
        test_recipe:
          setup: ["order O-CC3 RUNNING with 5.900kg RESERVED; tool revised (order -> ON_HOLD, allocation -> REVIEW); source lot then BLOCKED"]
          setup_api_calls:
            - { call: "POST /material-lots", payload: { lot_code: "L-CC3", resin_type: PETG, gauge_mm: 1.500, cleanliness_grade_required: INDUSTRIAL, quantity_kg: 10.000, unit_cost_per_kg: 10.00 }, as: MaterialsPlanner, captures: { lot_id: $.data.id } }
            - { call: "POST /cleanliness-certificates", payload: { subject_type: MATERIAL_LOT, subject_id: "${lot_id}", grade: INDUSTRIAL, issued_at: "2026-04-01T00:00:00Z", expires_at: "2026-09-01T00:00:00Z", cert_body: "LabA" }, as: QualityInspector }
            - { call: "POST /tools", payload: { tool_code: "T-CC3", part_number: "P-CC3", tool_type: FORM_MOLD, min_gauge_mm: 1.000, max_gauge_mm: 3.000, cleanliness_grade: INDUSTRIAL, prototype_cost: 1000.00 }, as: ToolingEngineer, captures: { tool_id: $.data.id } }
            - { call: "POST /tools/${tool_id}/complete-prototype", as: ToolingEngineer }
            - { call: "POST /tools/${tool_id}/submit-qualification", as: ToolingEngineer }
            - { call: "POST /cleanliness-certificates", payload: { subject_type: TOOL, subject_id: "${tool_id}", grade: INDUSTRIAL, issued_at: "2026-04-01T00:00:00Z", expires_at: "2026-09-01T00:00:00Z", cert_body: "LabA" }, as: QualityInspector }
            - { call: "POST /tools/${tool_id}/approve-production", payload: { production_cost: 8000.00, rated_lifetime_shots: 80000 }, as: ToolingEngineer }
            - { call: "POST /packaging-specs", payload: { spec_code: "S-CC3", spec_type: STOCK, cleanliness_grade: INDUSTRIAL, per_pack_cost: 0.30 }, as: PackagingEngineer, captures: { spec_id: $.data.id } }
            - { call: "POST /machine-resources", payload: { resource_code: "ST-CC3", resource_type: FORMING_STATION, cleanliness_grade: INDUSTRIAL, machine_rate_per_hour: 55.00 }, as: ProductionScheduler, captures: { station_id: $.data.id } }
            - { call: "POST /production-orders", payload: { order_code: "O-CC3", part_number: "P-CC3", resin_type: PETG, ordered_qty: 100, required_gauge_mm: 1.500, cleanliness_grade: INDUSTRIAL, spec_nominal_wall_mm: 1.300, spec_min_wall_mm: 1.230, nominal_part_weight_kg: 0.050, std_cycle_time_s: 30, std_machine_rate_per_hour: 55.00, tool_id: "${tool_id}", packaging_spec_id: "${spec_id}", is_prototype_order: false }, as: ProductionScheduler, captures: { order_id: $.data.id } }
            - { call: "POST /material-allocations", payload: { production_order_id: "${order_id}", source_type: VIRGIN_LOT, lot_id: "${lot_id}", qty_kg: 5.900 }, as: ProductionScheduler, captures: { alloc_id: $.data.id } }
            - { call: "GET /production-orders/${order_id}", as: Any, captures: { o_ver: $.data.version } }
            - { call: "POST /production-orders/${order_id}/stage", payload: { expected_production_order_version: "${o_ver}" }, as: ProductionScheduler }
            - { call: "POST /forming-runs", payload: { production_order_id: "${order_id}", station_id: "${station_id}", planned_start: "2026-05-02T10:00:00Z", planned_end: "2026-05-02T10:30:00Z", oven_temp_c: 180.0, cycle_time_s: 30, shots_planned: 10 }, as: ProductionScheduler }
            - { call: "POST /tools/${tool_id}/revise", as: ToolingEngineer }
            - { call: "POST /material-lots/${lot_id}/block", as: MaterialsPlanner }
          trigger:
            - { call: "POST /production-orders/${order_id}/resume", as: ProductionScheduler, captures: { err: $.data.error_id } }
            - { call: "GET /production-orders/${order_id}", as: Any, captures: { sched: $.data.schedule_status } }
            - { call: "GET /material-allocations/${alloc_id}", as: Any, captures: { alloc_st: $.data.status } }
          assert:
            - "error_id == ERR_ALLOCATION_REVIEW_FAILED (captured ${err}) — lot BLOCKED so REVIEW allocation cannot re-validate"
            - "ProductionOrder.${order_id}.schedule_status == ON_HOLD (captured ${sched}) — hold not released"
            - "MaterialAllocation.${alloc_id}.status == REVIEW (captured ${alloc_st})"
      - name: derived_available_kg_reconciliation
        claim_type: derived_field_reconciliation
        grounds: ["entities.MaterialLot.fields.available_kg"]
        excluded_because:
          difficulty_instance: "compensating_invariant / lot_mass_allocate_release_conservation"
          rationale: "available_kg is asserted after allocate (6.000) and after release (10.000) — reconciliation on both mutation directions is covered there."
      - name: version_pinning_at_production_approval
        claim_type: version_pinning_on_approval
        grounds: ["entities.Tool.fields.qualified_drawing_revision"]
        excluded_because:
          difficulty_instance: "non_linear_state_machine / tool_revision_cycle_requalification"
          rationale: "qualified_drawing_revision pinned 1 then re-pinned 2 across the revision cycle is asserted there."
      - name: provisional_final_variant_layer
        claim_type: dual_variant_calculation
        grounds: ["calculations.order_cost"]
        excluded_because:
          difficulty_instance: "dual_variant_calc / order_cost_provisional_vs_final_divergence"
          rationale: "Both variants and their delta are asserted as literals there."
      - name: run_completion_cascade_layer
        claim_type: cascading_side_effects
        grounds: ["state_machines.ProductionOrder(schedule_status).RUNNING_to_COMPLETED"]
        excluded_because:
          difficulty_instance: "transitive_cascade / run_complete_depth3_completion_cascade"
          rationale: "The full run->order->allocation->lot chain is asserted hop-by-hop there."
  # -------------------------------------------------------------------------
  - section: consistency_model
    instances:
      - name: immediate_read_after_write_consistency
        claim_type: immediate_consistency
        grounds: ["complexity_profile.consistency_model"]
        distinguishing_aspect: "Immediate consistency: a GET issued after a create returns every input field verbatim plus system fields — no eventual-convergence window."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls:
            - { call: "POST /machine-resources", payload: { resource_code: "ST-CM1", resource_type: FORMING_STATION, cleanliness_grade: FOOD, machine_rate_per_hour: 62.50 }, as: ProductionScheduler, captures: { res_id: $.data.id } }
          trigger:
            - { call: "GET /machine-resources/${res_id}", as: Any, captures: { code: $.data.resource_code, typ: $.data.resource_type, grade: $.data.cleanliness_grade, rate: $.data.machine_rate_per_hour } }
          assert:
            - "GET returns resource_code == 'ST-CM1', resource_type == FORMING_STATION, cleanliness_grade == FOOD, machine_rate_per_hour == 62.50 (captured ${code} / ${typ} / ${grade} / ${rate})"
