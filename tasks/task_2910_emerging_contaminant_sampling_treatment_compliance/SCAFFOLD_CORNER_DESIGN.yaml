# =============================================================================
# §1.9 Scaffold Corner Design — Coverage Index for Non-Difficulty Tests
# Task 2910 — Emerging Contaminant Sampling & Treatment Compliance
# =============================================================================
# Breadth probe. Every section/claim_type pair below comes from
# references/claim-extraction-guide.md walked against SCAFFOLD.yaml §1.1–§1.7;
# no categories are invented. Where §1.8 already asserts a corner, the row is an
# `excluded_because:` stub naming the exact §1.8 instance.
#
# Conventions are identical to SCAFFOLD_DIFFICULTY_DESIGN.yaml: the logical clock
# starts at 2026-08-01T00:00:00.000Z, a LaboratoryManager's X-User-ID is the
# Laboratory's own id, and EntryPoint "EPTDS-01" at population 45000 always
# derives served_account_count 18000, annual_billed_kgal 1080000 and
# baseline_annual_revenue_cents 1026000000.
#
# Rows deliberately skipped as non-applicable to this scaffold:
#   * Entities / Immutability — all 13 entities declare `common_fields: true`.
#   * State machines / Bubble up — no parent state is derived from a set of
#     children reaching terminal states; CapitalProject.funding_status is derived
#     from FundingApplication rows and is covered under parallel dimensions.
#   * Calculations / forward_looking, topological, projection, decay_function,
#     interval_merge, constraint_propagation — no §1.3 rule uses those
#     algorithm_types.
#   * Endpoints / Bulk action — §1.5 declares no bulk endpoint.
#   * Complexity layers / soft_delete, idempotency, bulk_operations,
#     scheduled_actions, multi_tenancy, conditional_feature_flags — not in
#     complexity_profile.complexity_layers.
#   * Consistency / eventual, saga — consistency_model is `immediate`.

scaffold_corner_design:

  # ===========================================================================
  # Guide section 1 — Entities
  # ===========================================================================
  - section: entities
    instances:

      - name: contaminant_creation_returns_the_full_declared_field_set
        claim_type: creation
        grounds:
          - entities.Contaminant
          - endpoints[POST /contaminants]
          - response_envelope.success
        distinguishing_aspect: "Every §1.1 Contaminant field is present in the 201 body with the submitted values, version starts at 1, and the success envelope carries meta.api_request_id plus response_type object."
        test_recipe:
          setup:
            - "Empty database. No contaminant exists yet."
          setup_api_calls: []
          trigger:
            - call: "POST /contaminants"
              payload: { code: "PFOA", mcl_ng_per_l: 4.00, trigger_level_ng_per_l: 2.00, required_mrl_ng_per_l: 2.00, hazard_index_member: true, hbwc_ng_per_l: 10.0, notification_tier: "TIER_1" }
              as: UtilityAdmin
              captures: { c_id: "$.data.id" }
          assert:
            - "HTTP status is 201"
            - "response_type == \"object\" and meta.api_request_id is present"
            - "Contaminant.${c_id}.code == PFOA"
            - "Contaminant.${c_id}.mcl_ng_per_l == 4.00"
            - "Contaminant.${c_id}.trigger_level_ng_per_l == 2.00"
            - "Contaminant.${c_id}.required_mrl_ng_per_l == 2.00"
            - "Contaminant.${c_id}.hazard_index_member == true"
            - "Contaminant.${c_id}.hbwc_ng_per_l == 10.0"
            - "Contaminant.${c_id}.notification_tier == TIER_1"
            - "Contaminant.${c_id}.version == 1"
            - "Contaminant.${c_id}.created_at is an ISO-8601 UTC instant with exactly 3 fractional digits"

      - name: contaminant_optional_inputs_fall_back_to_declared_defaults
        claim_type: defaults
        grounds:
          - entities.Contaminant.fields.hazard_index_member
          - entities.Contaminant.fields.hbwc_ng_per_l
          - entities.Contaminant.fields.notification_tier
          - endpoints[POST /contaminants]
        distinguishing_aspect: "With all three optional inputs omitted, hazard_index_member is false, hbwc_ng_per_l is null and notification_tier is TIER_2 — the declared defaults, not nulls across the board."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "POST /contaminants"
              payload: { code: "PFBS", mcl_ng_per_l: 6.00, trigger_level_ng_per_l: 3.00, required_mrl_ng_per_l: 2.00 }
              as: UtilityAdmin
              captures: { c_id: "$.data.id" }
          assert:
            - "HTTP status is 201"
            - "Contaminant.${c_id}.hazard_index_member == false"
            - "Contaminant.${c_id}.hbwc_ng_per_l == null"
            - "Contaminant.${c_id}.notification_tier == TIER_2"
            - "Contaminant.${c_id}.mcl_ng_per_l == 6.00"
            - "Contaminant.${c_id}.version == 1"

      - name: entry_point_creation_seeds_the_derived_billing_and_posture_fields
        claim_type: computed_fields
        grounds:
          - entities.EntryPoint.fields.served_account_count
          - entities.EntryPoint.fields.annual_billed_kgal
          - entities.EntryPoint.fields.baseline_annual_revenue_cents
          - global_constants.PERSONS_PER_ACCOUNT
          - global_constants.KGAL_PER_ACCOUNT_PER_YEAR
          - global_constants.BASE_RATE_CENTS_PER_KGAL
          - endpoints[POST /entry-points]
        distinguishing_aspect: "population_served 45000 is the only billing input: 45000 / 2.5 = 18000 accounts, 18000 * 60 = 1080000 kgal, 1080000 * 950 = 1026000000 cents, and every counter/posture field starts at its declared zero value."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "POST /entry-points"
              payload: { label: "EPTDS-01", source_type: "GROUNDWATER", population_served: 45000 }
              as: UtilityAdmin
              captures: { ep_id: "$.data.id" }
          assert:
            - "HTTP status is 201"
            - "EntryPoint.${ep_id}.served_account_count == 18000"
            - "EntryPoint.${ep_id}.annual_billed_kgal == 1080000"
            - "EntryPoint.${ep_id}.baseline_annual_revenue_cents == 1026000000"
            - "EntryPoint.${ep_id}.monitoring_status == INITIAL"
            - "EntryPoint.${ep_id}.requested_monitoring_status == null"
            - "EntryPoint.${ep_id}.compliance_posture == COMPLIANT"
            - "EntryPoint.${ep_id}.treatment_status == NONE"
            - "EntryPoint.${ep_id}.max_compliance_ratio == 0.0"
            - "EntryPoint.${ep_id}.hazard_index == 0.00"
            - "EntryPoint.${ep_id}.accepted_result_count == 0"
            - "EntryPoint.${ep_id}.consecutive_qualifying_quarters == 0"
            - "EntryPoint.${ep_id}.consecutive_invalidated_samples == 0"
            - "EntryPoint.${ep_id}.open_violation_count == 0"
            - "EntryPoint.${ep_id}.version == 1"

      - name: entry_point_missing_population_served_returns_invalid_request
        claim_type: required_fields
        grounds:
          - validations[priority=6]
          - errors.ERR_INVALID_REQUEST
          - endpoints[POST /entry-points]
        distinguishing_aspect: "population_served has source input with no default, so omitting it is a shape violation at priority 6 (422 ERR_INVALID_REQUEST) and no EntryPoint row is created."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "POST /entry-points"
              payload: { label: "EPTDS-01", source_type: "GROUNDWATER" }
              as: UtilityAdmin
              captures: { err_id: "$.data.error_id" }
          assert:
            - "HTTP status is 422"
            - "error_id == ERR_INVALID_REQUEST"
            - "response_type == \"error\" and data.message is a non-empty string"
            - "GET /entry-points returns total_count 0"

      - name: laboratory_retrieval_returns_every_stored_certification_field
        claim_type: retrieval
        grounds:
          - entities.Laboratory
          - endpoints[GET /laboratories/{id}]
        distinguishing_aspect: "GET /laboratories/{id} echoes the stored certification exactly, including the certified_methods array order and the default daily_analysis_capacity of 3 when the optional input is omitted."
        test_recipe:
          setup:
            - "One Laboratory created with two certified methods and no daily_analysis_capacity supplied."
          setup_api_calls:
            - call: "POST /laboratories"
              payload: { name: "Northgate Analytical", certification_id: "CERT-001", certified_methods: ["METHOD_533", "METHOD_1633"], lowest_achievable_dl_ng_per_l: 1.00, certification_expires_on: "2027-12-31T00:00:00.000Z" }
              as: UtilityAdmin
              captures: { lab_id: "$.data.id" }
          trigger:
            - call: "GET /laboratories/${lab_id}"
              payload: {}
              as: ComplianceOfficer
          assert:
            - "HTTP status is 200"
            - "Laboratory.${lab_id}.name == \"Northgate Analytical\""
            - "Laboratory.${lab_id}.certification_id == \"CERT-001\""
            - "Laboratory.${lab_id}.certified_methods == [\"METHOD_533\", \"METHOD_1633\"]"
            - "Laboratory.${lab_id}.lowest_achievable_dl_ng_per_l == 1.00"
            - "Laboratory.${lab_id}.certification_expires_on == \"2027-12-31T00:00:00.000Z\""
            - "Laboratory.${lab_id}.daily_analysis_capacity == 3"
            - "Laboratory.${lab_id}.version == 1"

      - name: entry_point_get_with_an_unknown_id_returns_not_found
        claim_type: not_found
        grounds:
          - validations[priority=5]
          - errors.ERR_ENTRY_POINT_NOT_FOUND
          - endpoints[GET /entry-points/{id}]
        distinguishing_aspect: "A syntactically valid UUID that matches no row resolves priority 5 to the referenced entity's own 404 code, ERR_ENTRY_POINT_NOT_FOUND, not a generic not-found."
        test_recipe:
          setup:
            - "Empty database — no entry point has ever been created."
          setup_api_calls: []
          trigger:
            - call: "GET /entry-points/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: ComplianceOfficer
              captures: { err_id: "$.data.error_id" }
          assert:
            - "HTTP status is 404"
            - "error_id == ERR_ENTRY_POINT_NOT_FOUND"
            - "response_type == \"error\""

      - name: sample_listing_paginates_and_reports_total_count_and_has_more
        claim_type: listing
        grounds:
          - endpoints[GET /samples]
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
        distinguishing_aspect: "Three COLLECTED samples at one entry point paginate as 2 + 1 with total_count 3 in both pages and has_more flipping true then false; the array response carries response_type array."
        test_recipe:
          setup:
            - "Contaminant PFOA and EntryPoint EPTDS-01."
            - "Three samples collected in three distinct monitoring periods, none shipped."
          setup_api_calls:
            - call: "POST /contaminants"
              payload: { code: "PFOA", mcl_ng_per_l: 4.00, trigger_level_ng_per_l: 2.00, required_mrl_ng_per_l: 2.00 }
              as: UtilityAdmin
              captures: { pfoa_id: "$.data.id" }
            - call: "POST /entry-points"
              payload: { label: "EPTDS-01", source_type: "GROUNDWATER", population_served: 45000 }
              as: UtilityAdmin
              captures: { ep_id: "$.data.id" }
            - call: "POST /samples"
              payload: { entry_point_id: "${ep_id}", panel_contaminant_ids: ["${pfoa_id}"], monitoring_period: "2025Q4", collected_at: "2025-11-14T08:00:00.000Z", protocol: "LOW_FLOW_GRAB", ptfe_free_kit: true, field_blank_included: true, preservative_lot: "LOT-A" }
              as: SamplingTechnician
              captures: { s1_id: "$.data.id" }
            - call: "POST /samples"
              payload: { entry_point_id: "${ep_id}", panel_contaminant_ids: ["${pfoa_id}"], monitoring_period: "2026Q1", collected_at: "2026-02-13T08:00:00.000Z", protocol: "LOW_FLOW_GRAB", ptfe_free_kit: true, field_blank_included: true, preservative_lot: "LOT-B" }
              as: SamplingTechnician
              captures: { s2_id: "$.data.id" }
            - call: "POST /samples"
              payload: { entry_point_id: "${ep_id}", panel_contaminant_ids: ["${pfoa_id}"], monitoring_period: "2026Q2", collected_at: "2026-05-15T08:00:00.000Z", protocol: "LOW_FLOW_GRAB", ptfe_free_kit: true, field_blank_included: true, preservative_lot: "LOT-C" }
              as: SamplingTechnician
              captures: { s3_id: "$.data.id" }
          trigger:
            - call: "GET /samples?entry_point_id=${ep_id}&limit=2&offset=0"
              payload: {}
              as: ComplianceOfficer
            - call: "GET /samples?entry_point_id=${ep_id}&limit=2&offset=2"
              payload: {}
              as: ComplianceOfficer
          assert:
            - "Both calls return HTTP 200 with response_type == \"array\""
            - "First call: exactly 2 rows, total_count == 3, has_more == true, limit == 2, offset == 0"
            - "Second call: exactly 1 row, total_count == 3, has_more == false, limit == 2, offset == 2"
            - "The three ids returned across both pages are exactly ${s1_id}, ${s2_id} and ${s3_id} with no duplicates"
            - "Every returned row has status == COLLECTED"

      - name: lab_result_client_supplied_system_values_are_ignored_input
        claim_type: system_fields
        grounds:
          - entities.LabResult.fields.status
          - entities.LabResult.fields.laboratory_id
          - endpoints[POST /lab-results]
        distinguishing_aspect: "id, created_at, version and status are system-sourced: supplying them in the body changes nothing — the server mints its own id, sets version 1 and status SUBMITTED, and laboratory_id is taken from the authenticated laboratory rather than the body."
        test_recipe:
          setup:
            - "Contaminant PFOA, Laboratory certified for METHOD_533 with capacity 5, EntryPoint EPTDS-01."
            - "One 2026Q2 sample collected 2026-05-15T08:00:00.000Z, shipped and received clean, so it is RECEIVED."
          setup_api_calls:
            - call: "POST /contaminants"
              payload: { code: "PFOA", mcl_ng_per_l: 4.00, trigger_level_ng_per_l: 2.00, required_mrl_ng_per_l: 2.00 }
              as: UtilityAdmin
              captures: { pfoa_id: "$.data.id" }
            - call: "POST /laboratories"
              payload: { name: "Northgate Analytical", certification_id: "CERT-001", certified_methods: ["METHOD_533"], lowest_achievable_dl_ng_per_l: 1.00, certification_expires_on: "2027-12-31T00:00:00.000Z", daily_analysis_capacity: 5 }
              as: UtilityAdmin
              captures: { lab_id: "$.data.id" }
            - call: "POST /entry-points"
              payload: { label: "EPTDS-01", source_type: "GROUNDWATER", population_served: 45000 }
              as: UtilityAdmin
              captures: { ep_id: "$.data.id" }
            - call: "POST /samples"
              payload: { entry_point_id: "${ep_id}", panel_contaminant_ids: ["${pfoa_id}"], monitoring_period: "2026Q2", collected_at: "2026-05-15T08:00:00.000Z", protocol: "LOW_FLOW_GRAB", ptfe_free_kit: true, field_blank_included: true, preservative_lot: "LOT-SYS" }
              as: SamplingTechnician
              captures: { s_id: "$.data.id" }
            - call: "POST /samples/${s_id}/ship"
              payload: { laboratory_id: "${lab_id}" }
              as: SamplingTechnician
            - call: "POST /samples/${s_id}/receive"
              payload: { chain_of_custody_intact: true, field_blank_result_ng_per_l: 0.50 }
              as: LaboratoryManager
              as_user_id: "${lab_id}"
          trigger:
            - call: "POST /lab-results"
              payload: { sample_id: "${s_id}", contaminant_id: "${pfoa_id}", method: "METHOD_533", reported_ng_per_l: 3.00, detection_limit_ng_per_l: 1.00, analyzed_at: "2026-05-20T08:00:00.000Z", id: "11111111-1111-4111-8111-111111111111", version: 99, status: "ACCEPTED", laboratory_id: "22222222-2222-4222-8222-222222222222", compliance_value_ng_per_l: 0.01 }
              as: LaboratoryManager
              as_user_id: "${lab_id}"
              captures: { r_id: "$.data.id" }
          assert:
            - "HTTP status is 201"
            - "${r_id} != \"11111111-1111-4111-8111-111111111111\""
            - "LabResult.${r_id}.version == 1"
            - "LabResult.${r_id}.status == SUBMITTED"
            - "LabResult.${r_id}.laboratory_id == ${lab_id}"
            - "LabResult.${r_id}.compliance_value_ng_per_l == 3.00"
            - "LabResult.${r_id}.censored == false"
            - "EntryPoint.${ep_id}.accepted_result_count == 0"

      - name: sample_protocol_outside_the_declared_enum_is_rejected
        claim_type: type_constraints
        grounds:
          - entities.Sample.fields.protocol
          - validations[priority=6]
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: "protocol is constrained to the declared enum; an out-of-enum token is a priority-6 shape failure (422 ERR_INVALID_REQUEST) even though every other field in the body is valid and the entry point accepts samples."
        test_recipe:
          setup:
            - "Contaminant PFOA and EntryPoint EPTDS-01, monitoring_status INITIAL."
          setup_api_calls:
            - call: "POST /contaminants"
              payload: { code: "PFOA", mcl_ng_per_l: 4.00, trigger_level_ng_per_l: 2.00, required_mrl_ng_per_l: 2.00 }
              as: UtilityAdmin
              captures: { pfoa_id: "$.data.id" }
            - call: "POST /entry-points"
              payload: { label: "EPTDS-01", source_type: "GROUNDWATER", population_served: 45000 }
              as: UtilityAdmin
              captures: { ep_id: "$.data.id" }
          trigger:
            - call: "POST /samples"
              payload: { entry_point_id: "${ep_id}", panel_contaminant_ids: ["${pfoa_id}"], monitoring_period: "2026Q2", collected_at: "2026-05-15T08:00:00.000Z", protocol: "SCOOP_BUCKET", ptfe_free_kit: true, field_blank_included: true, preservative_lot: "LOT-BADENUM" }
              as: SamplingTechnician
              captures: { err_id: "$.data.error_id" }
          assert:
            - "HTTP status is 422"
            - "error_id == ERR_INVALID_REQUEST"
            - "GET /samples?entry_point_id=${ep_id} returns total_count 0"

      - name: lab_result_with_an_unresolvable_sample_id_returns_not_found
        claim_type: parent_relationships
        grounds:
          - validations[priority=8]
          - errors.ERR_SAMPLE_NOT_FOUND
          - entities.LabResult.parent
        distinguishing_aspect: "A body foreign key that resolves to nothing is priority 8, which returns the referenced entity's 404 (ERR_SAMPLE_NOT_FOUND) and outranks the state check at priority 34 — there is no sample whose state could be read."
        test_recipe:
          setup:
            - "Contaminant PFOA and a Laboratory certified for METHOD_533; no Sample exists."
          setup_api_calls:
            - call: "POST /contaminants"
              payload: { code: "PFOA", mcl_ng_per_l: 4.00, trigger_level_ng_per_l: 2.00, required_mrl_ng_per_l: 2.00 }
              as: UtilityAdmin
              captures: { pfoa_id: "$.data.id" }
            - call: "POST /laboratories"
              payload: { name: "Northgate Analytical", certification_id: "CERT-001", certified_methods: ["METHOD_533"], lowest_achievable_dl_ng_per_l: 1.00, certification_expires_on: "2027-12-31T00:00:00.000Z", daily_analysis_capacity: 5 }
              as: UtilityAdmin
              captures: { lab_id: "$.data.id" }
          trigger:
            - call: "POST /lab-results"
              payload: { sample_id: "33333333-3333-4333-8333-333333333333", contaminant_id: "${pfoa_id}", method: "METHOD_533", reported_ng_per_l: 3.00, detection_limit_ng_per_l: 1.00, analyzed_at: "2026-05-20T08:00:00.000Z" }
              as: LaboratoryManager
              as_user_id: "${lab_id}"
              captures: { err_id: "$.data.error_id" }
          assert:
            - "HTTP status is 404"
            - "error_id == ERR_SAMPLE_NOT_FOUND"
            - "error_id != ERR_SAMPLE_NOT_RECEIVED"
            - "GET /lab-results?laboratory_id=${lab_id} returns total_count 0"

      - name: lab_result_inherits_the_flat_topology_links_of_its_sample
        claim_type: parent_relationships
        grounds:
          - complexity_profile.entity_topology
          - entities.LabResult.fields.laboratory_id
          - entities.LabResult.fields.sample_id
          - entities.Sample.fields.assigned_laboratory_id
        distinguishing_aspect: "entity_topology is flat, so referential integrity is the whole story: the created LabResult's sample_id, contaminant_id and laboratory_id all resolve, and laboratory_id equals the sample's assigned_laboratory_id rather than being independently supplied."
        test_recipe:
          setup:
            - "Contaminant PFOA, Laboratory certified for METHOD_533 with capacity 5, EntryPoint EPTDS-01."
            - "One 2026Q2 sample shipped to that laboratory and received clean."
          setup_api_calls:
            - call: "POST /contaminants"
              payload: { code: "PFOA", mcl_ng_per_l: 4.00, trigger_level_ng_per_l: 2.00, required_mrl_ng_per_l: 2.00 }
              as: UtilityAdmin
              captures: { pfoa_id: "$.data.id" }
            - call: "POST /laboratories"
              payload: { name: "Northgate Analytical", certification_id: "CERT-001", certified_methods: ["METHOD_533"], lowest_achievable_dl_ng_per_l: 1.00, certification_expires_on: "2027-12-31T00:00:00.000Z", daily_analysis_capacity: 5 }
              as: UtilityAdmin
              captures: { lab_id: "$.data.id" }
            - call: "POST /entry-points"
              payload: { label: "EPTDS-01", source_type: "GROUNDWATER", population_served: 45000 }
              as: UtilityAdmin
              captures: { ep_id: "$.data.id" }
            - call: "POST /samples"
              payload: { entry_point_id: "${ep_id}", panel_contaminant_ids: ["${pfoa_id}"], monitoring_period: "2026Q2", collected_at: "2026-05-15T08:00:00.000Z", protocol: "LOW_FLOW_GRAB", ptfe_free_kit: true, field_blank_included: true, preservative_lot: "LOT-FK" }
              as: SamplingTechnician
              captures: { s_id: "$.data.id" }
            - call: "POST /samples/${s_id}/ship"
              payload: { laboratory_id: "${lab_id}" }
              as: SamplingTechnician
            - call: "POST /samples/${s_id}/receive"
              payload: { chain_of_custody_intact: true, field_blank_result_ng_per_l: 0.50 }
              as: LaboratoryManager
              as_user_id: "${lab_id}"
          trigger:
            - call: "POST /lab-results"
              payload: { sample_id: "${s_id}", contaminant_id: "${pfoa_id}", method: "METHOD_533", reported_ng_per_l: 3.00, detection_limit_ng_per_l: 1.00, analyzed_at: "2026-05-20T08:00:00.000Z" }
              as: LaboratoryManager
              as_user_id: "${lab_id}"
              captures: { r_id: "$.data.id" }
          assert:
            - "HTTP status is 201"
            - "LabResult.${r_id}.sample_id == ${s_id}"
            - "LabResult.${r_id}.contaminant_id == ${pfoa_id}"
            - "LabResult.${r_id}.laboratory_id == ${lab_id}"
            - "Sample.${s_id}.assigned_laboratory_id == ${lab_id}"
            - "GET /lab-results?sample_id=${s_id} returns total_count 1 and that row's id == ${r_id}"
            - "GET /samples?assigned_laboratory_id=${lab_id} returns total_count 1 and that row's id == ${s_id}"

  # ===========================================================================
  # Guide section 2 — State machines
  # ===========================================================================
  - section: state_machines
    instances:

      - name: shipping_a_collected_sample_records_the_assignment_and_the_clock
        claim_type: valid_transition
        grounds:
          - state_machines.Sample.transitions.COLLECTED_to_IN_TRANSIT
          - endpoints[POST /samples/{id}/ship]
        distinguishing_aspect: "The happy-path leg of a linear custody transition: status becomes IN_TRANSIT, assigned_laboratory_id is written from the body and shipped_at is the logical clock, not the collection instant."
        test_recipe:
          setup:
            - "Contaminant PFOA, one Laboratory, EntryPoint EPTDS-01, one COLLECTED 2026Q2 sample."
            - "The logical clock is untouched, so it reads 2026-08-01T00:00:00.000Z."
          setup_api_calls:
            - call: "POST /contaminants"
              payload: { code: "PFOA", mcl_ng_per_l: 4.00, trigger_level_ng_per_l: 2.00, required_mrl_ng_per_l: 2.00 }
              as: UtilityAdmin
              captures: { pfoa_id: "$.data.id" }
            - call: "POST /laboratories"
