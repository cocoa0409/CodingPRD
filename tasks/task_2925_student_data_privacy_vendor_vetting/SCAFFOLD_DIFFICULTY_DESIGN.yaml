  - rule_id: priority_pair_validation_conflict
    instances:

      - name: review_open_state_gate_beats_analyst_capacity
        grounds:
          - validations[priority=10]
          - validations[priority=42]
          - errors[ERR_REQUEST_NOT_TRIAGED]
          - errors[ERR_ANALYST_CAPACITY_EXCEEDED]
          - calculations.analyst_allocated_minutes
        distinguishing_aspect: |
          One call violates BOTH the priority-10 state gate (the source request is
          still SUBMITTED, never triaged) and the priority-42 fiscal gate
          (estimated_minutes 600 against a 100-minute analyst). The ladder must
          return ERR_REQUEST_NOT_TRIAGED, not ERR_ANALYST_CAPACITY_EXCEEDED. The
          second half of the instance removes only the state violation and re-runs
          the identical body, proving the capacity check was reachable all along
          and that the first answer was an ordering decision, not a missing check.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; one vendor, one application, one teacher."
            - "Analyst AN1: SENIOR, review_capacity_minutes 100, allocated_review_minutes 0."
