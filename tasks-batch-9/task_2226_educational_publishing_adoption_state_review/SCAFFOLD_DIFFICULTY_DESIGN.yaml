            - "PublicComment.${cm2_id}.status == ESCALATED"
            - "PublicComment.${cm3_id}.status == ESCALATED"
            - "Submission.${sub_id}.unresolved_critical_count == 3"
            - "Submission.${sub_id}.overdue_response_count == 3"
            - "Submission.${sub_id}.compliance_score == 40"
            - "Submission.${sub_id}.adoption_blocked == true"
            - "PresentationSlot.${slot_id}.status == CANCELLED"
            - "CommitteePanel.${pnl_id}.reserved_minutes == 0"
            - "Submission.${sub_id}.review_status == FILED"
            - "AdoptionCycle.${cyc_id}.scheduled_submission_count == 0"

  # ===========================================================================
  # Rule 5 - validation priority conflicts across different category pairs
  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: cycle_phase_state_outranks_prohibited_content_on_file
        grounds:
          - validations[priority=30]
          - validations[priority=33]
          - errors[ERR_CYCLE_NOT_OPEN_FOR_SUBMISSION]
          - errors[ERR_PROHIBITED_CONTENT_PRESENT]
        distinguishing_aspect: |
          Category pair state (priority 30) vs business_safety (priority 33): the submission both
          sits in a SCHEDULED cycle and still carries the state's prohibited tag OUTDATED_MAP, and the
          server returns ERR_CYCLE_NOT_OPEN_FOR_SUBMISSION (409), never ERR_PROHIBITED_CONTENT_PRESENT.
        test_recipe:
          setup:
            - "State WA is OPEN_TERRITORY, prohibits OUTDATED_MAP and sets min_verified_coverage_pct 50.00 with sampling_copies_required 0"
            - "Title WA-SS-6 is ACTIVE with content_tags [CIVIC_DUTY, OUTDATED_MAP], so prohibited_hit_count is 1"
            - "Cycle 2027 has never been advanced, so its status is still SCHEDULED even though the clock (2026-09-15) sits inside its submission window"
            - "The submission is DRAFT with one MASTERY correlation entry"
          setup_api_calls:
            - call: "POST /state-profiles"
              payload: { state_code: "WA", adoption_model: "OPEN_TERRITORY", sampling_copies_required: 0, min_verified_coverage_pct: 50.00, prohibited_content_tags: ["OUTDATED_MAP"] }
              as: PlatformAdmin
              captures: { st_wa_id: $.data.id }
            - call: "POST /state-profiles/${st_wa_id}/standards"
              payload: { subject: "SOCIAL_STUDIES", standard_code: "WA.SS.6.1", grade_low: 6, grade_high: 6, weight: 3 }
              as: StateAdoptionOfficer
              as_user_id: "${st_wa_id}"
            - call: "POST /adoption-cycles"
              payload: { state_id: "${st_wa_id}", subject: "SOCIAL_STUDIES", cycle_year: 2027, submission_open_at: "2026-09-01T00:00:00Z", submission_deadline_at: "2026-10-01T00:00:00Z", committee_review_at: "2026-10-15T00:00:00Z", public_comment_start_at: "2026-11-01T00:00:00Z", public_comment_end_at: "2026-11-15T00:00:00Z", adoption_decision_at: "2026-12-01T00:00:00Z", contract_term_years: 6 }
              as: StateAdoptionOfficer
              as_user_id: "${st_wa_id}"
              captures: { cyc_id: $.data.id }
            - call: "POST /titles"
              payload: { isbn_base: "9780000001501", subject: "SOCIAL_STUDIES", grade_low: 6, grade_high: 6, copyright_year: 2026, content_tags: ["CIVIC_DUTY", "OUTDATED_MAP"], page_count: 310, signature_page_capacity: 384, list_price_cents: 8900 }
              as: PublisherEditor
              captures: { ttl_id: $.data.id }
            - call: "POST /titles/${ttl_id}/release"
              payload: {}
              as: PublisherEditor
            - call: "POST /submissions"
              payload: { cycle_id: "${cyc_id}", title_id: "${ttl_id}" }
              as: PublisherEditor
              captures: { sub_id: $.data.id }
            - call: "POST /submissions/${sub_id}/correlations"
              payload: { standard_code: "WA.SS.6.1", depth_level: "MASTERY", page_reference: "pp. 44-70", evidence_citation: "Chapter 2 develops and assesses the standard to mastery." }
              as: PublisherEditor
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-15T00:00:00Z" }
