      # ---- corners already owned by the depth probe (§1.8) ----
      - name: permit_two_dimensions_advance_on_disjoint_triggers
        claim_type: parallel_state_dimensions
        grounds:
          - complexity_profile.state_machine_shape
          - state_machines.Permit.administrative_status
          - state_machines.Permit.compliance_status
        excluded_because:
          difficulty_instance: permit_parallel_dimensions_independent
          rationale: |
            The §1.8 instance already drives the pair through (ISSUED, COMPLIANT) -> (ACTIVE, PROBATION)
            -> (ACTIVE, COMPLIANT) and asserts that a compliance move does not touch administrative_status
            and vice versa. A corner-level repeat would assert the same combined-state matrix with less
            depth.

      - name: operating_plan_revision_cycle_repeats_then_terminates
        claim_type: cyclic_loop_bound
        grounds:
          - state_machines.OperatingPlan.note
          - state_machines.OperatingPlan.transitions[UNDER_REVIEW->REVISION_REQUESTED]
          - validations[ERR_REVISION_LIMIT_EXCEEDED]
        excluded_because:
          difficulty_instance: operating_plan_revision_loop_bounded_at_two
          rationale: |
            The §1.8 instance walks the SUBMITTED -> UNDER_REVIEW -> REVISION_REQUESTED cycle twice,
            proves revision_round accumulates across resubmissions, and shows the third request failing
            with ERR_REVISION_LIMIT_EXCEEDED while the plan stays UNDER_REVIEW and therefore still
            approvable. Every cyclic-shape claim for this machine is contained there.

      - name: screen_fork_selects_between_two_divergent_side_effect_sets
        claim_type: branching_fork
        grounds:
          - state_machines.PermitApplication.transitions[CAPACITY_SCREENED->DIRECT_AWARD_PENDING]
          - state_machines.PermitApplication.transitions[CAPACITY_SCREENED->PROSPECTUS_QUEUED]
          - calculations.prospectus_requirement_determination
        excluded_because:
          difficulty_instance: application_screen_fork_renewal_priority_versus_prospectus
          rationale: |
            The §1.8 instance already contrasts both forks in one fixture, including the RENEWAL branch
            whose null latest_performance_rating routes to PROSPECTUS even with capacity to spare. The
            DIRECT branch's side-effect set is verified here by
            direct_screen_writes_every_declared_side_effect_in_one_request, so nothing is left uncovered.

      - name: guide_lapse_cascade_revokes_authorizations_and_re_derives_compliance
        claim_type: conditional_cascade
        grounds:
          - state_machines.Guide.transitions[QUALIFIED->LAPSED]
          - endpoints.POST /osup/_ops/run-daily-compliance-sweep
        excluded_because:
          difficulty_instance: sweep_guide_lapse_authorization_ratio_cascade
          rationale: |
            The §1.8 instance runs the sweep with one expiring and one current certificate and checks the
            conditional cascade end to end — only the lapsed guide's authorizations are revoked, with
            reason GUIDE_LAPSED, and only the permit whose recomputed capacity fell below party_size_max
            is re-derived. The corner probe would re-run the same sweep with fewer rows.

      - name: suspension_cascade_reaches_the_outfitter_status
        claim_type: cascade_down
        grounds:
          - state_machines.Permit.administrative_status.transitions[ACTIVE->SUSPENDED]
          - calculations.noncompliance_point_accumulation
          - calculations.outfitter_status_derivation
        excluded_because:
          difficulty_instance: noncompliance_points_suspension_cascade_depth_five
          rationale: |
            The §1.8 instance already verifies all five hops of the deepest cascade in the scaffold
            (action -> points -> compliance NONCOMPLIANT -> administrative SUSPENDED -> guide roster
            revoked -> outfitter status re-derived) with pinned intermediate values at each hop.

      - name: withdraw_compensates_the_screen_hold_without_drift
        claim_type: compensation
        grounds:
          - state_machines.PermitApplication.transitions[DIRECT_AWARD_PENDING->WITHDRAWN]
          - calculations.allocatable_service_day_conservation
        excluded_because:
          difficulty_instance: service_day_conservation_across_hold_and_release
          rationale: |
            The §1.8 conservation instance walks hold, release and re-hold across screen, withdraw, deny
            and issuance while asserting allocatable == committed + pending + available after every step,
            which strictly contains the single-compensation corner claim.

      - name: amend_resyncs_the_fee_ledger_on_the_permit
        claim_type: ledger_sync
        grounds:
          - state_machines.TripUseReport.transitions[ACCEPTED->SUPERSEDED]
          - state_machines.FeeAssessment.transitions[PAID->PROVISIONAL]
          - calculations.fee_obligation_conservation
        excluded_because:
          difficulty_instance: fee_money_identity_across_amend_and_reversal
          rationale: |
            The §1.8 instance already reconciles assessed_fee_cents, paid_to_date_cents,
            balance_due_cents and credit_balance_cents across an amendment that reverts a PAID assessment
            to PROVISIONAL, which is the ledger-sync claim in its strongest form.

      - name: activation_is_guarded_by_a_cross_entity_plan_state
        claim_type: guarded_transition
        grounds:
          - state_machines.Permit.administrative_status.transitions[ISSUED->ACTIVE]
          - validations[ERR_OPERATING_PLAN_NOT_APPROVED]
        excluded_because:
          difficulty_instance: permit_activation_gated_by_operating_plan_status
          rationale: |
            The §1.8 instance walks the plan through DRAFT, SUBMITTED, UNDER_REVIEW and APPROVED, and
            attempts activation at each step, so the cross-entity guard is already characterised at every
            value of the guarding state rather than at just one.

  # ===========================================================================
  # §1.3 Calculation Rules  (16 rules; algorithm types threshold, aggregation,
  # tiered_pricing, weighted_scoring, constraint_propagation; two rules carry
  # `variants`)
  # ===========================================================================
  - section: calculations
    instances:

      - name: availability_full_recompute_matches_the_pinned_aggregate_over_a_mixed_pool
        claim_type: correct_result
        grounds:
          - calculations.use_area_service_day_availability
          - calculations.allocatable_service_day_conservation
          - calculations.needs_assessment_allocation_recomputation
          - endpoints.GET /osup/use-areas/{id}/allocation-summary
        distinguishing_aspect: |
          One area carrying an issued permit, a screened application, a merely submitted application
          and a withdrawn-after-screening application at the same time. Every term of the aggregate
          is non-zero and non-equal, so a transposed committed/pending pair or an incremental counter
          that forgot the withdrawal is visible in the four numbers, and demand_ratio lands on a
          repeating decimal (350/900) that pins the 4-place round_half_up.
        test_recipe:
          setup:
            - "BRW-01 with allocatable 900 (1000 total, 100 reserved) and a PUBLISHED 2027 assessment for 900 days"
            - "Alpine files four applications: 200 days (issued as a permit), 150 days (screened, still holding), 100 days (submitted only) and 50 days (screened then withdrawn)"
          setup_api_calls:
            - call: "POST /osup/_clock/set_current_utc"
              payload: { to_iso8601: "2027-01-05T00:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /osup/use-areas"
              payload: { area_code: "BRW-01", name: "Bear River Wilderness", total_allocated_service_days: 1000, season_year: 2027, season_open_date: "2027-05-15", season_close_date: "2027-09-30", party_size_max: 12, max_clients_per_guide: 8, reserved_admin_service_days: 100, min_liability_coverage_cents: 100000000 }
              as: ProgramAdministrator
              captures: { ua_id: "$.data.id" }
            - call: "POST /osup/use-areas/${ua_id}/needs-assessments"
              payload: { assessment_year: 2027, public_need_finding: "NEED_EXISTS", determined_capacity_service_days: 900, allocated_service_days: 0 }
              as: PermitSpecialist
              captures: { na_id: "$.data.id" }
            - call: "POST /osup/needs-assessments/${na_id}/publish"
              payload: {}
              as: AuthorizedOfficer
            - call: "POST /osup/outfitters"
              payload: { legal_name: "Alpine Outfitters LLC", ein: "410000001", contact_email: "ops@alpine.example", prequalification_insurance_verified: true }
              as: PermitSpecialist
              captures: { oa_id: "$.data.id" }
            - call: "POST /osup/permit-applications"
              payload: { outfitter_id: "${oa_id}", use_area_id: "${ua_id}", application_type: "NEW", season_year: 2027, requested_service_days: 200, proposed_activity_type: "RIVER_FLOAT", narrative: "Float A." }
              as: PermitSpecialist
              captures: { app_a: "$.data.id" }
            - call: "POST /osup/permit-applications/${app_a}/submit"
              payload: {}
              as: OutfitterRepresentative
              as_user_id: "${oa_id}"
            - call: "POST /osup/permit-applications/${app_a}/screen"
              payload: {}
              as: PermitSpecialist
            - call: "POST /osup/permit-applications/${app_a}/issue-permit"
              payload: { term_start_date: "2027-01-01", term_end_date: "2029-12-31", indemnification_acknowledged: true }
              as: AuthorizedOfficer
              captures: { p_id: "$.data.id" }
            - call: "POST /osup/permit-applications"
              payload: { outfitter_id: "${oa_id}", use_area_id: "${ua_id}", application_type: "NEW", season_year: 2027, requested_service_days: 150, proposed_activity_type: "FISHING", narrative: "Float B." }
              as: PermitSpecialist
              captures: { app_b: "$.data.id" }
            - call: "POST /osup/permit-applications/${app_b}/submit"
              payload: {}
              as: OutfitterRepresentative
              as_user_id: "${oa_id}"
            - call: "POST /osup/permit-applications/${app_b}/screen"
              payload: {}
              as: PermitSpecialist
            - call: "POST /osup/permit-applications"
              payload: { outfitter_id: "${oa_id}", use_area_id: "${ua_id}", application_type: "NEW", season_year: 2027, requested_service_days: 100, proposed_activity_type: "HUNTING", narrative: "Float C." }
              as: PermitSpecialist
              captures: { app_c: "$.data.id" }
            - call: "POST /osup/permit-applications/${app_c}/submit"
              payload: {}
              as: OutfitterRepresentative
              as_user_id: "${oa_id}"
            - call: "POST /osup/permit-applications"
              payload: { outfitter_id: "${oa_id}", use_area_id: "${ua_id}", application_type: "NEW", season_year: 2027, requested_service_days: 50, proposed_activity_type: "PACK_STOCK", narrative: "Float D." }
              as: PermitSpecialist
              captures: { app_d: "$.data.id" }
            - call: "POST /osup/permit-applications/${app_d}/submit"
              payload: {}
              as: OutfitterRepresentative
              as_user_id: "${oa_id}"
            - call: "POST /osup/permit-applications/${app_d}/screen"
              payload: {}
              as: PermitSpecialist
            - call: "POST /osup/permit-applications/${app_d}/withdraw"
              payload: {}
              as: OutfitterRepresentative
              as_user_id: "${oa_id}"
          trigger:
            - call: "GET /osup/use-areas/${ua_id}/allocation-summary"
              payload: {}
              as: PermitSpecialist
            - call: "GET /osup/use-areas/${ua_id}"
              payload: {}
              as: PermitSpecialist
            - call: "GET /osup/use-areas/${ua_id}/needs-assessments"
              payload: { assessment_year: 2027 }
              as: PermitSpecialist
          assert:
            - "the summary reads allocatable_service_days 900, committed_service_days 200, pending_service_days 150, available_service_days 550"
            - "committed counts ONLY the ISSUED permit's 200 authorized days; pending counts ONLY ${app_b} (DIRECT_AWARD_PENDING) — ${app_c} is SUBMITTED and ${app_d} is WITHDRAWN, and neither holds a day"
            - "demand_ratio == 0.3889: (200 + 150) / 900 = 0.38888... rounded half-up to 4 places, and allocation_posture == OPEN because available > 0 and 0.3889 < 0.8"
            - "the conservation identity holds exactly: 900 == 200 + 150 + 550"
            - "GET /osup/use-areas/${ua_id} returns the same four stored figures as the recomputing summary endpoint — the stored fields are not allowed to drift from the from-scratch recompute"
            - "the PUBLISHED assessment reads allocated_service_days 350, unallocated_service_days 550 (900 - 350) and prospectus_required false"

      - name: noncompliance_points_count_only_open_actions_inside_the_rolling_window
        claim_type: input_set_filtering
        grounds:
          - calculations.noncompliance_point_accumulation
          - calculations.permit_compliance_derivation
          - endpoints.POST /osup/_ops/run-daily-compliance-sweep
        distinguishing_aspect: |
          Two independent filters on the same aggregate: the status filter (ISSUED, APPEALED and
          UPHELD count; CURED and RESCINDED contribute zero — and APPEALED still counts, so filing an
          appeal buys no relief) and the 1095-day rolling window whose lower bound is INCLUSIVE. The
          window is probed by moving the logical clock to exactly 1095 days after the action's
          created_at (still counted) and then one day further (dropped), with a sweep to force the
          recompute. The tail also shows the OR-branch of the derivation: at zero points the permit is
          still PROBATION because insurance_current is false.
        test_recipe:
          setup:
            - "a 200-day permit ${p_id} whose term runs to 2031-12-31 so the later clock moves cannot expire it"
            - "three actions issued by officer-1 on 2027-01-05: MINOR/WARNING ${a1}, MODERATE/WARNING ${a2}, MAJOR/SUSPENSION ${a3} — 2 + 5 + 10 = 17 points"
          setup_api_calls:
            - call: "POST /osup/_clock/set_current_utc"
              payload: { to_iso8601: "2027-01-05T00:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /osup/use-areas"
              payload: { area_code: "BRW-01", name: "Bear River Wilderness", total_allocated_service_days: 1000, season_year: 2027, season_open_date: "2027-05-15", season_close_date: "2027-09-30", party_size_max: 12, max_clients_per_guide: 8, reserved_admin_service_days: 100, min_liability_coverage_cents: 100000000 }
              as: ProgramAdministrator
              captures: { ua_id: "$.data.id" }
            - call: "POST /osup/use-areas/${ua_id}/needs-assessments"
              payload: { assessment_year: 2027, public_need_finding: "NEED_EXISTS", determined_capacity_service_days: 900, allocated_service_days: 0 }
              as: PermitSpecialist
              captures: { na_id: "$.data.id" }
            - call: "POST /osup/needs-assessments/${na_id}/publish"
              payload: {}
              as: AuthorizedOfficer
            - call: "POST /osup/outfitters"
              payload: { legal_name: "Alpine Outfitters LLC", ein: "410000001", contact_email: "ops@alpine.example", prequalification_insurance_verified: true }
              as: PermitSpecialist
              captures: { oa_id: "$.data.id" }
            - call: "POST /osup/permit-applications"
              payload: { outfitter_id: "${oa_id}", use_area_id: "${ua_id}", application_type: "NEW", season_year: 2027, requested_service_days: 200, proposed_activity_type: "RIVER_FLOAT", narrative: "Guided day floats." }
              as: PermitSpecialist
              captures: { app_id: "$.data.id" }
            - call: "POST /osup/permit-applications/${app_id}/submit"
              payload: {}
              as: OutfitterRepresentative
              as_user_id: "${oa_id}"
            - call: "POST /osup/permit-applications/${app_id}/screen"
              payload: {}
              as: PermitSpecialist
            - call: "POST /osup/permit-applications/${app_id}/issue-permit"
              payload: { term_start_date: "2027-01-01", term_end_date: "2031-12-31", indemnification_acknowledged: true }
              as: AuthorizedOfficer
              captures: { p_id: "$.data.id" }
            - call: "POST /osup/permits/${p_id}/noncompliance-actions"
              payload: { severity: "MINOR", action_type: "WARNING", cited_provision: "36 CFR 251.56(a) sanitation", cure_deadline_date: "2027-03-01" }
              as: AuthorizedOfficer
              as_user_id: "officer-1"
              captures: { a1: "$.data.id" }
            - call: "POST /osup/permits/${p_id}/noncompliance-actions"
              payload: { severity: "MODERATE", action_type: "WARNING", cited_provision: "36 CFR 251.56(c) stock", cure_deadline_date: "2027-03-01" }
              as: AuthorizedOfficer
              as_user_id: "officer-1"
              captures: { a2: "$.data.id" }
            - call: "POST /osup/permits/${p_id}/noncompliance-actions"
              payload: { severity: "MAJOR", action_type: "SUSPENSION", cited_provision: "36 CFR 251.60(a) resource damage", cure_deadline_date: "2027-03-01" }
              as: AuthorizedOfficer
              as_user_id: "officer-1"
              captures: { a3: "$.data.id" }
            - call: "GET /osup/permits/${p_id}"
              payload: {}
              as: PermitSpecialist
          trigger:
            - call: "POST /osup/noncompliance-actions/${a2}/cure"
              payload: { corrective_summary: "Stock tie-lines relocated 200 feet from the water." }
              as: OutfitterRepresentative
              as_user_id: "${oa_id}"
            - call: "POST /osup/noncompliance-actions/${a3}/appeal"
              payload: { appeal_basis: "Damage predates the permit term." }
              as: OutfitterRepresentative
              as_user_id: "${oa_id}"
            - call: "GET /osup/permits/${p_id}"
              payload: {}
              as: PermitSpecialist
            - call: "POST /osup/noncompliance-actions/${a3}/decide-appeal"
              payload: { decision: "RESCINDED" }
              as: AuthorizedOfficer
              as_user_id: "officer-2"
            - call: "GET /osup/permits/${p_id}"
              payload: {}
              as: PermitSpecialist
            - call: "POST /osup/_clock/set_current_utc"
              payload: { to_iso8601: "2030-01-04T00:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /osup/_ops/run-daily-compliance-sweep"
              payload: {}
              as: ProgramAdministrator
            - call: "GET /osup/permits/${p_id}"
              payload: {}
              as: PermitSpecialist
            - call: "POST /osup/_clock/set_current_utc"
              payload: { to_iso8601: "2030-01-05T00:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /osup/_ops/run-daily-compliance-sweep"
              payload: {}
              as: ProgramAdministrator
            - call: "GET /osup/permits/${p_id}"
              payload: {}
              as: PermitSpecialist
            - call: "GET /osup/permits/${p_id}/noncompliance-actions"
              payload: {}
              as: PermitSpecialist
          assert:
            - "the setup's final read shows open_noncompliance_points 17 (2 + 5 + 10) and compliance_status NONCOMPLIANT, while administrative_status is still ISSUED — the auto-suspension propagation fires only from ACTIVE"
            - "after the cure of ${a2}: open_noncompliance_points 12 — a CURED action contributes 0 — and compliance_status is still NONCOMPLIANT because 12 >= 12"
            - "after the appeal of ${a3} the third read still shows 12: APPEALED is inside the counted status set, so appealing changes nothing"
            - "after decide-appeal RESCINDED: open_noncompliance_points 2 and compliance_status PROBATION — below 12, but the insurance_current == false branch keeps it off COMPLIANT"
            - "at clock 2030-01-04, exactly 1095 days after ${a1}.created_at, the sweep leaves open_noncompliance_points at 2: the window lower bound is INCLUSIVE"
            - "at clock 2030-01-05 the same sweep drops ${a1} out of the window: open_noncompliance_points 0, yet compliance_status is STILL PROBATION on the insurance branch alone"
            - "both sweeps report certificates_expired 0, bonds_expired 0, guides_lapsed 0, permits_expired 0, authorizations_revoked 0, permits_suspended 0 — the permit's term runs to 2031-12-31"
            - "the action listing returns three rows: ${a1} ISSUED, ${a2} CURED, ${a3} RESCINDED — the rows survive; only their contribution to the sum changes"

      - name: bond_requirement_clamps_at_the_floor_and_the_ceiling_constants
        claim_type: constants_applied
        grounds:
          - calculations.required_financial_assurance
          - entities.Bond.required_amount_cents
          - endpoints.POST /osup/permits/{id}/bonds
        distinguishing_aspect: |
          Three permits chosen so the same formula takes all three of its paths at once: 40 days
          (raw 200000, clamped UP by BOND_FLOOR_CENTS to 250000), 200 days (raw 1000000, inside the
          band) and 1200 days (raw 6000000, clamped DOWN by BOND_CEILING_CENTS to 5000000). The
          >= comparison is probed at exact equality, and a superseding bond proves the ACTIVE-only
          input set while the superseded row keeps its frozen requirement.
        test_recipe:
          setup:
            - "BRW-01 (allocatable 900) and WIL-02 (allocatable 2000), each with a PUBLISHED 2027 assessment"
            - "three outfitters hold one permit each: Alpine 200 days on BRW-01, Birch 40 days on BRW-01, Cedar 1200 days on WIL-02"
