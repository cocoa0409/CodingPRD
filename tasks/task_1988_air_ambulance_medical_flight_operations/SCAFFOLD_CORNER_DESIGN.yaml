            - { call: "POST /air-ambulance/mission-requests", payload: { patient_id: "${pat_id}", transport_class: "EMERGENCY_SCENE", origin_facility: "Scene", destination_facility: "County General", reported_cardio: 8, reported_resp: 6, reported_neuro: 5, reported_interventions: 3, onset_iso: "2026-07-31T14:00:00Z" }, as: Dispatcher, captures: { req_id: "$.data.id" } }
            - { call: "POST /air-ambulance/mission-requests/${req_id}/triage", payload: { verified_cardio: 8, verified_resp: 6, verified_neuro: 5, verified_interventions: 3 }, as: MedicalDirector }
            - { call: "POST /air-ambulance/mission-requests/${req_id}/accept", payload: { aircraft_id: "${ac_id}", crew: [{ crew_member_id: "${pilot_id}", role_in_mission: "PILOT" }, { crew_member_id: "${nurse_id}", role_in_mission: "NURSE" }], estimated_loaded_miles: 40, planned_launch_iso: "2026-08-01T06:00:00Z", planned_duration_min: 120 }, as: Dispatcher, captures: { m_id: "$.data.id", m_v: "$.data.version" } }
            - { call: "POST /air-ambulance/weather-assessments", payload: { mission_id: "${m_id}", ceiling_ft: 1000, visibility_sm: 5.0, wind_kt: 10, precip: "NONE", day_night: "DAY", terrain: "FLAT", expected_mission_version: "${m_v}" }, as: FlightCrew, as_user_id: "${pilot_id}" }
            - { call: "POST /air-ambulance/missions/${m_id}/advance", payload: { to_state: "LAUNCHED" }, as: FlightCrew, as_user_id: "${pilot_id}" }
            - { call: "POST /air-ambulance/missions/${m_id}/advance", payload: { to_state: "AT_PATIENT" }, as: FlightCrew, as_user_id: "${pilot_id}" }
            - { call: "POST /air-ambulance/missions/${m_id}/advance", payload: { to_state: "IN_TRANSIT" }, as: FlightCrew, as_user_id: "${pilot_id}" }
            - { call: "POST /air-ambulance/missions/${m_id}/advance", payload: { to_state: "AT_DESTINATION" }, as: FlightCrew, as_user_id: "${pilot_id}" }
            - { call: "POST /air-ambulance/missions/${m_id}/advance", payload: { to_state: "COMPLETED" }, as: FlightCrew, as_user_id: "${pilot_id}" }
            - { call: "POST /air-ambulance/patient-care-reports", payload: { mission_id: "${m_id}", author_crew_id: "${pilot_id}", vitals_summary: "stable", interventions_summary: "none", meds_summary: "none" }, as: FlightCrew, as_user_id: "${pilot_id}", captures: { pcr_id: "$.data.id" } }
            - { call: "POST /air-ambulance/patient-care-reports/${pcr_id}/submit", as: FlightCrew, as_user_id: "${pilot_id}" }
            - { call: "POST /air-ambulance/patient-care-reports/${pcr_id}/qa-review", payload: { outcome: "FLAGGED", deficiency_points: 3 }, as: QaReviewer, as_user_id: "qa-officer-6" }
            - { call: "GET /air-ambulance/patient-care-reports/${pcr_id}", as: FlightCrew, as_user_id: "${pilot_id}", captures: { pcr_v: "$.data.version" } }
          trigger:
            - { call: "POST /air-ambulance/patient-care-reports/${pcr_id}/amend", payload: { expected_patient_care_report_version: "${pcr_v}", vitals_summary: "corrected vitals" }, as: FlightCrew, as_user_id: "${pilot_id}", captures: { v_after: "$.data.version", st_after: "$.data.status" } }
            - { call: "POST /air-ambulance/patient-care-reports/${pcr_id}/amend", payload: { expected_patient_care_report_version: "${pcr_v}", meds_summary: "second stale amend" }, as: FlightCrew, as_user_id: "${pilot_id}", captures: { err: "$.data.error_id" } }
          assert:
            - "st_after == AMENDED and v_after == pcr_v + 1 (first amend succeeded)"
            - "err == ERR_STALE_VERSION (412): second amend replayed the now-stale observed version"
            - "CrewMember.${pilot_id}.deficiency_points_90d == 3 (below the 15 threshold: no remediation hold)"
      - name: mission_request_list_status_filter
        claim_type: pagination_filtering
        grounds: [endpoints.list_mission_requests, entities.MissionRequest.fields.status]
        distinguishing_aspect: "Filter + pagination interact: with one TRIAGED and one RECEIVED request, ?status=TRIAGED returns total_count 1 (the triaged row) and ?status=RECEIVED returns total_count 1 (the other row)."
        test_recipe:
          setup: ["Two mission requests for one patient; exactly one triaged"]
          setup_api_calls:
            - { call: "POST /air-ambulance/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: OpsAdmin }
            - { call: "POST /air-ambulance/patients", payload: { full_name: "Filter Test", date_of_birth: "1991-01-01", weight_kg: 70 }, as: Dispatcher, captures: { pat_id: "$.data.id" } }
            - { call: "POST /air-ambulance/mission-requests", payload: { patient_id: "${pat_id}", transport_class: "EMERGENCY_SCENE", origin_facility: "Scene A", destination_facility: "County General", reported_cardio: 1, reported_resp: 1, reported_neuro: 1, reported_interventions: 1, onset_iso: "2026-07-31T20:00:00Z" }, as: Dispatcher, captures: { req_a: "$.data.id" } }
            - { call: "POST /air-ambulance/mission-requests", payload: { patient_id: "${pat_id}", transport_class: "EMERGENCY_SCENE", origin_facility: "Scene B", destination_facility: "County General", reported_cardio: 2, reported_resp: 2, reported_neuro: 2, reported_interventions: 2, onset_iso: "2026-07-31T20:00:00Z" }, as: Dispatcher, captures: { req_b: "$.data.id" } }
            - { call: "POST /air-ambulance/mission-requests/${req_a}/triage", payload: { verified_cardio: 1, verified_resp: 1, verified_neuro: 1, verified_interventions: 1 }, as: MedicalDirector }
          trigger:
            - { call: "GET /air-ambulance/mission-requests?status=TRIAGED", as: Dispatcher }
            - { call: "GET /air-ambulance/mission-requests?status=RECEIVED", as: Dispatcher }
          assert:
            - "TRIAGED filter: total_count == 1 and the single row id == ${req_a}"
            - "RECEIVED filter: total_count == 1 and the single row id == ${req_b}"
      - name: abort_release_cascade_covered
        claim_type: cascading_side_effects
        grounds: [state_machines.Mission.LAUNCHED_to_ABORTED]
        excluded_because:
          difficulty_instance: "transitive_cascade / abort_cascade_leg_bed_release"
          rationale: "The layer's chain (aircraft release, leg cancellation, bed release) is asserted hop-by-hop there."
      - name: qa_threshold_cascade_covered
        claim_type: rate_threshold_triggers
        grounds: [calculations.qa_deficiency_cascade]
        excluded_because:
          difficulty_instance: "transitive_cascade / qa_flag_cascade_remediation_release"
          rationale: "The 15-point cumulative threshold crossing and its two downstream hops are asserted there."
      - name: dual_variant_layer_covered
        claim_type: dual_variant_calculation
        grounds: [calculations.mission_transport_charge, calculations.patient_acuity_score]
        excluded_because:
          difficulty_instance: "dual_variant_calc / invoice_provisional_vs_final_totals"
          rationale: "Both variants of the billing-domain calculation and (via acuity_triage_vs_acceptance_score_divergence) the clinical-domain pair are asserted in §1.8."

  # ================================================== Section: consistency_model
  - section: consistency_model
    instances:
      - name: writes_immediately_visible_on_reread
        claim_type: immediate_consistency
        grounds: [complexity_profile.consistency_model]
        distinguishing_aspect: "Immediate consistency: an aircraft created (AVAILABLE, v1) reads back identically, and a PUT to MAINTENANCE is fully visible (status + version 2) in both the write response and a subsequent GET in the same chain — no lag, no stale read."
        test_recipe:
          setup: ["Base exists"]
          setup_api_calls:
            - { call: "POST /air-ambulance/bases", payload: { name: "Base A", region: "SW-US" }, as: OpsAdmin, captures: { base_id: "$.data.id" } }
          trigger:
            - { call: "POST /air-ambulance/aircraft", payload: { base_id: "${base_id}", tail_number: "N900IC", aircraft_class: "FIXED_WING", medical_config: "ALS_CAPABLE" }, as: OpsAdmin, captures: { ac_id: "$.data.id", s1: "$.data.status", v1: "$.data.version" } }
            - { call: "GET /air-ambulance/aircraft/${ac_id}", as: OpsAdmin, captures: { s2: "$.data.status" } }
            - { call: "PUT /air-ambulance/aircraft/${ac_id}", payload: { status: "MAINTENANCE" }, as: OpsAdmin, captures: { s3: "$.data.status", v2: "$.data.version" } }
            - { call: "GET /air-ambulance/aircraft/${ac_id}", as: Dispatcher, captures: { s4: "$.data.status", v4: "$.data.version" } }
          assert:
            - "s1 == AVAILABLE and v1 == 1 and s2 == AVAILABLE (create visible on immediate reread)"
            - "s3 == MAINTENANCE and v2 == 2 (mutation visible in its own response)"
            - "s4 == MAINTENANCE and v4 == 2 (reread by a different role sees the same committed state)"
