              as: IACommander
              as_user_id: "${cmdr_id}"
            - call: "GET /disciplines"
              payload: { allegation_id: "${a1_id}" }
              as: IACommander
              as_user_id: "${cmdr_id}"
              captures: { d1_id: "$.data[0].id" }
            - call: "POST /disciplines/${d1_id}/impose"
              payload: { effective_date: "2026-08-10T00:00:00Z", aggravator_count: 1, mitigator_count: 0 }
              as: IACommander
              as_user_id: "${cmdr_id}"
            - call: "GET /disciplines/${d1_id}"
              payload: {}
              as: IACommander
              as_user_id: "${cmdr_id}"
          assert:
            - "call 1: HTTP 200 with Allegation.${a1_id}.disposition == SUSTAINED, support_pct 60.00 carried the standard, preponderance_met == true, disposed_at == 2026-08-05T09:00:00Z and prior_sustained_count_at_disposition == 0"
            - "after call 1: the created Discipline has status PROPOSED, offense_class B copied from the allegation, presumptive_prior_tier == 0, presumptive_days == 10, final_days == null and effective_days == 0"
            - "after call 1: Officer.${subj_id}.imposed_suspension_days_total == 0 and employment_status == ACTIVE - a proposed discipline charges nothing to the ledger"
            - "call 3: HTTP 200 with Discipline.${d1_id}.status == IMPOSED, final_prior_tier == 0, final_days == 15 (base 10 plus one aggravator at 5 days, no mitigation credit) and effective_days == 15"
            - "call 4: presumptive_days is still 10 - the historical proposal is never rewritten by the FINAL variant"
            - "Discipline.${d1_id}.imposed_at == 2026-08-05T09:00:00Z and appeal_deadline_at == 2026-08-20T09:00:00Z"
            - "Officer.${subj_id}.imposed_suspension_days_total == 15 (the ledger equals the sum of effective_days, not presumptive_days and not their sum)"
            - "Officer.${subj_id}.employment_status == SUSPENDED and suspension_end_date == 2026-08-25T00:00:00Z (effective_date plus final_days)"

      - name: excluded_calc_input_set_filtering_window_and_decay_edges
        claim_type: Input Set Filtering
        grounds:
          - calculations.eis_composite_score
        distinguishing_aspect: |
          Which activity events enter the rolling window, and which of them are halved by decay,
          is exactly the boundary case the difficulty instance walks at 180, 181, 364 and 365
          days, including the half-open left edge that drops an event exactly WINDOW_DAYS old.
        excluded_because:
          difficulty_instance: "boundary_precision_check / eis_decay_and_window_edges_at_one_hundred_eighty_and_three_hundred_sixty_five_days"
          rationale: |
            That instance already pins the excluded, decayed and undecayed sets with dated events
            on both sides of each edge; a second filtering probe would restate it with different
            names and no additional discrimination.

      - name: excluded_calc_precision_support_pct_rounding
        claim_type: Precision
        grounds:
          - calculations.preponderance_evaluation
        distinguishing_aspect: |
          The only place in this domain where a rounded value and its raw ratio disagree about a
          decision is support_pct at 50.005, where ROUND_HALF_UP produces 50.00 and the strict
          greater-than then fails.
        excluded_because:
          difficulty_instance: "boundary_precision_check / preponderance_decided_on_the_rounded_support_pct_not_the_raw_ratio"
          rationale: |
            That instance asserts the rounded value, the rejected SUSTAINED disposition and the
            accepted NOT_SUSTAINED disposition for the same weights; the corner precision claim
            has no residue left to test.

      - name: excluded_calc_aggregation_room_occupancy_count
        claim_type: aggregation
        grounds:
          - calculations.room_capacity_overlap
        distinguishing_aspect: |
          The only counting aggregate with an interesting empty and boundary behaviour is the
          room occupancy count over half-open intervals, where a booking that ends exactly when
          another begins must not be counted.
        excluded_because:
          difficulty_instance: "resource_temporal_overlap / room_capacity_counts_half_open_overlaps_and_admits_back_to_back_bookings"
          rationale: |
            That instance already covers the zero-overlap case, the at-capacity case and the
            over-capacity rejection against the same room.

      - name: excluded_calc_tiered_pricing_mitigation_rate_tiers
        claim_type: tiered_pricing
        grounds:
          - calculations.discipline_matrix
        distinguishing_aspect: |
          The mitigation percentage tiers are selected from the post-aggravator subtotal, so the
          tier boundaries at 10, 30 and 60 days are only observable when the aggravators have
          already moved the subtotal across a boundary.
        excluded_because:
          difficulty_instance: "combinatorial_formula / mitigation_rate_selected_from_post_aggravator_subtotal"
          rationale: |
            That instance sits on the 30-day tier edge from both sides and shows the tier moving
            when a single aggravator is added, which is the whole tiered-boundary claim.

      - name: excluded_calc_interval_merge_officer_rest_buffer
        claim_type: interval_merge
        grounds:
          - calculations.officer_interview_buffer_overlap
        distinguishing_aspect: |
          The buffer widens each session by 60 minutes on both sides and compares with closed
          intervals, so a 60-minute gap is a conflict and a 61-minute gap is not.
        excluded_because:
          difficulty_instance: "resource_temporal_overlap / officer_rest_buffer_treats_a_sixty_minute_gap_as_overlap_on_both_sides"
          rationale: |
            That instance probes the buffer on both sides of the existing session and at the
            exact 60-minute gap, which subsumes any merge-boundary corner probe.

      - name: excluded_calc_weighted_scoring_five_factor_composite
        claim_type: weighted_scoring
        grounds:
          - calculations.eis_composite_score
        distinguishing_aspect: |
          The composite score multiplies base weight, severity multiplier, decay and assignment
          multiplier and then adds an indicator bonus, so the weighting claim is really a claim
          about the order of those five factors.
        excluded_because:
          difficulty_instance: "combinatorial_formula / eis_five_factor_score_assignment_multiplier_and_indicator_bonus"
          rationale: |
            That instance holds the event set constant while varying the assignment type and the
            indicator count, which pins the weights far more sharply than a single-score probe.

      - name: excluded_calc_waterfall_allocation_back_pay_stages
        claim_type: waterfall_allocation
        grounds:
          - calculations.reinstatement_back_pay
        distinguishing_aspect: |
          Back pay allocates gross pay per pay period, then subtracts interim earnings, then
          applies interest to the net, and the three stages cannot be reordered without changing
          the award.
        excluded_because:
          difficulty_instance: "combinatorial_formula / back_pay_per_period_rounding_then_offset_then_interest"
          rationale: |
            That instance already asserts the per-period rounding residue, the offset and the
            interest on the net, which is the entire allocation ladder.

      - name: excluded_calc_variant_divergence_rolling_versus_peer
        claim_type: Variant Divergence
        grounds:
          - calculations.eis_composite_score
        distinguishing_aspect: |
          The two EIS variants disagree on the same event set because the peer-relative variant
          drops the assignment multiplier and the indicator bonus and divides by a peer mean.
        excluded_because:
          difficulty_instance: "dual_variant_calc / eis_rolling_window_versus_peer_relative_score"
          rationale: |
            That instance reads both variants for one officer and asserts that they disagree on
            score and on band, plus the empty-pool fallback.

      - name: excluded_calc_variant_selection_presumptive_versus_final
        claim_type: Variant Selection
        grounds:
          - calculations.discipline_matrix
        distinguishing_aspect: |
          Which variant runs is decided by the endpoint: disposition computes PRESUMPTIVE and
          imposition computes FINAL with a different reference instant and a narrower prior set.
        excluded_because:
          difficulty_instance: "dual_variant_calc / presumptive_versus_final_discipline_matrix_prior_tier"
          rationale: |
            That instance drives both endpoints for one officer whose prior drops out of the
            FINAL set, so the selection rule is asserted from both sides.

  # =========================================================================
  # Guide section 4 - Validations (§1.6, 75 rules on a 13-priority ladder)
  # =========================================================================
  - section: validations
    instances:
      - name: a_reused_badge_number_is_refused_and_leaves_the_roster_unchanged
        claim_type: "Violation → Error"
        grounds:
          - validations[priority=12]
          - errors.ERR_BADGE_NUMBER_DUPLICATE
          - endpoints["POST /officers"]
          - entities.Officer.fields.badge_number
        distinguishing_aspect: |
          badge_number uniqueness is a whole-table constraint rather than a field format rule, so
          the second write must be refused with ERR_BADGE_NUMBER_DUPLICATE (409) rather than the
          schema error, and the refusal must be a no-op: the roster still holds exactly one
          officer, and a badge differing by a single character is accepted immediately afterwards.
        test_recipe:
          setup:
            - "The logical clock stands at 2026-08-01T00:00:00Z."
            - "One PATROL_DIVISION unit exists holding Officer Vance with badge_number PN-501."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /units"
              payload: { name: "Patrol North", unit_role: "PATROL_DIVISION", command_code: "PN", peer_group_code: "PG_NORTH", sworn_headcount: 60, intake_enabled: true }
              as: SystemAdmin
              captures: { patrol_unit_id: $.data.id }
            - call: "POST /officers"
              payload: { unit_id: "${patrol_unit_id}", badge_number: "PN-501", full_name: "Officer Vance", rank: "OFFICER", assignment_type: "PATROL", annual_salary_cents: 9100013, demographic_code: "DG_C", hire_date: "2019-09-16T00:00:00Z" }
              as: SystemAdmin
              captures: { subj_id: $.data.id }
          trigger:
            - call: "POST /officers"
              payload: { unit_id: "${patrol_unit_id}", badge_number: "PN-501", full_name: "Officer Winters", rank: "OFFICER", assignment_type: "PATROL", annual_salary_cents: 9000000, demographic_code: "DG_A", hire_date: "2021-03-01T00:00:00Z" }
              as: SystemAdmin
              captures: { err_dup: "$.data.error_id" }
            - call: "GET /officers"
              payload: { unit_id: "${patrol_unit_id}", limit: 10, offset: 0 }
              as: SystemAdmin
            - call: "POST /officers"
              payload: { unit_id: "${patrol_unit_id}", badge_number: "PN-502", full_name: "Officer Winters", rank: "OFFICER", assignment_type: "PATROL", annual_salary_cents: 9000000, demographic_code: "DG_A", hire_date: "2021-03-01T00:00:00Z" }
              as: SystemAdmin
              captures: { winters_id: $.data.id }
          assert:
            - "call 1: HTTP 409 with ${err_dup} == ERR_BADGE_NUMBER_DUPLICATE"
            - "call 2: HTTP 200 with total_count == 1 and the only row is ${subj_id} - the refused write created nothing"
