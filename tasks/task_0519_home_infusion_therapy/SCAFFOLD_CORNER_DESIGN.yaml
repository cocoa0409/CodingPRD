              payload: {}
              as: IntakeCoordinator
            - call: "POST /infusion-orders"
              payload: { referral_id: "${ref_id}", drug_id: "${drug_id}", route: "IV", daily_dose_mg: 1000, frequency_per_day: 1, start_date: "2026-06-10T00:00:00Z", scheduled_days: 5 }
              as: Pharmacist
              captures: { order_id: $.data.id }
