  - section: consistency_model
    instances:
      - name: enrollment_computed_fields_visible_same_request
        claim_type: immediate
        grounds: [entities.Enrollment.fields.initial_charge_cents]
        distinguishing_aspect: "The POST /enrollments response already carries computed list_price_cents/discount_cents/initial_charge_cents (immediate consistency)."
        excluded_because:
          difficulty_instance: checkout_charge_percent_coupon_mode_a
          rationale: "Immediate visibility of the computed checkout fields in the enrollment response is asserted by the named §1.8 combinatorial instance."
