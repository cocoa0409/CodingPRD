            - { call: "POST /household-payroll/pay-runs/${pr2_id}/finalize", as: PayrollAdmin }
          trigger:
            - { call: "GET /household-payroll/pay-runs/${pr1_id}/paychecks", as: PayrollAdmin, captures: { w1c1_net: "$.data[0].net_pay_cents", w2c1_net: "$.data[1].net_pay_cents", w3c1_net: "$.data[2].net_pay_cents", w3c1_lines: "$.data[2].withholding_lines" } }
