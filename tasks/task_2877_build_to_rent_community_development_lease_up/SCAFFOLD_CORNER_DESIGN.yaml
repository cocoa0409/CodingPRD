      - name: a_household_cannot_read_another_households_lease
        claim_type: peer_role_isolation
        grounds:
          - validations.priority_22_ownership_violation
          - roles.Household
          - errors.ERR_OWNERSHIP_VIOLATION
        distinguishing_aspect: |
          Household is the only entity-backed identity, so its reads are scoped by X-User-ID rather than by
          endpoint: the same GET is a 200 for the owner and a 403 ERR_OWNERSHIP_VIOLATION for the
          neighbour, and the isolation covers the household record itself as well as the lease. It is
          ERR_OWNERSHIP_VIOLATION, not ERR_UNAUTHORIZED, because the role is allowed on the endpoint.
        test_recipe:
          setup:
            - "Community 'Oakmere' in LEASE_UP with two released homes, two households and one DRAFT lease each."
