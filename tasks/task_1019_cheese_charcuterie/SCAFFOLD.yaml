# =============================================================================
# SCAFFOLD.yaml — Cheese & Charcuterie Shop (task_1019)
# Difficulty: Expert
# §1.0–§1.7 (no scaffold_difficulty_design / scaffold_corner_design keys here)
# =============================================================================

scenario: |
  1019. Cheese & Charcuterie Shop: SKU & cut/wheel & weight pricing, board/catering
  order, cave/aging & rotation, sampling & pairing, subscription & gift,
  wholesale/restaurant, allergen/labeling, shrink

domain_name: cheese-charcuterie
api_prefix: /api

# =============================================================================
# Complexity Profile
# =============================================================================
complexity_profile:
  primary_archetype: pricing_engine
  secondary_archetype: quota_allocation
  complexity_layers:
    - dual_variant_calculation      # provisional (nominal weight) vs final (actual cut weight); projected vs actual shrink
    - cascading_side_effects        # fulfill -> line -> lot debit -> lot DEPLETED -> cave.used_g
    - ops_run_checkpoint            # cave rotation advances aging epoch, applies shrink, promotes/discards
    - optimistic_concurrency        # OCC on Lot.version for lot allocation

  entity_topology: flat
  # Peer collections under a single /api prefix, linked by foreign keys; no
  # nested ownership in URL paths.

  state_machine_shape: parallel
  # Order carries two independent state axes (fulfillment_status x payment_status);
  # Subscription carries a cycle (ACTIVE <-> PAUSED).

  relationship_patterns:
    - one_to_many                   # Cave->Lot, Order->OrderLine, Customer->Order/Subscription
    - cross_aggregate               # OrderLine->Lot, OrderLine->Board, Subscription->Board

  role_model: peer_roles
  # ShopManager owns inventory/config, CounterStaff owns order/tasting operations,
  # WholesaleCustomer (entity_backed) owns its own orders and subscriptions.

  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Customer
    parent: null
    common_fields: true
    fields:
      - { name: account_type, type: enum, source: input, description: "RETAIL | WHOLESALE_RESTAURANT", constraints: "one of {RETAIL, WHOLESALE_RESTAURANT}" }
      - { name: name, type: string, source: input, description: "Customer or restaurant account name" }
      - { name: region_code, type: string, source: input, description: "Two-letter region code, e.g. CA, NY (affects nothing structurally but recorded on labels)" }
      - { name: wholesale_tier, type: enum, source: input, description: "NONE | BRONZE | SILVER | GOLD (metadata for WHOLESALE_RESTAURANT accounts)", default: "NONE", constraints: "one of {NONE, BRONZE, SILVER, GOLD}" }
      - { name: credit_limit_cents, type: integer, source: input, description: "Wholesale credit ceiling, informational", default: 0 }
      - { name: store_credit_cents, type: integer, source: input, description: "Prepaid store-credit balance in cents; set at create, debited on STORE_CREDIT payment, credited back on refund", default: 0, constraints: ">= 0" }
      - { name: status, type: enum, source: system, description: "ACTIVE | DELINQUENT | CLOSED; initial ACTIVE", constraints: "one of {ACTIVE, DELINQUENT, CLOSED}" }

  - name: Product
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "SKU display name" }
      - { name: category, type: enum, source: input, description: "CHEESE | CHARCUTERIE", constraints: "one of {CHEESE, CHARCUTERIE}" }
      - { name: milk_type, type: enum, source: input, description: "COW | GOAT | SHEEP | BUFFALO | NONE (NONE for charcuterie)", constraints: "one of {COW, GOAT, SHEEP, BUFFALO, NONE}" }
      - { name: pasteurized, type: boolean, source: input, description: "false => raw-milk product subject to legal minimum aging" }
      - { name: form, type: enum, source: input, description: "WHEEL | WEDGE | BLOCK | WHOLE_MUSCLE | SLICED", constraints: "one of {WHEEL, WEDGE, BLOCK, WHOLE_MUSCLE, SLICED}" }
      - { name: pricing_mode, type: enum, source: input, description: "BY_WEIGHT | BY_UNIT", constraints: "one of {BY_WEIGHT, BY_UNIT}" }
      - { name: price_per_kg_cents, type: integer, source: input, description: "Price per kilogram in cents; required when pricing_mode=BY_WEIGHT", default: 0 }
      - { name: unit_price_cents, type: integer, source: input, description: "Price per unit in cents; required when pricing_mode=BY_UNIT", default: 0 }
      - { name: allergens, type: array, source: input, description: "List of allergen tokens, e.g. [MILK], [MILK,NUTS], [PORK]", default: [] }
      - { name: min_aging_days, type: integer, source: input, description: "Product's own minimum aging before a lot becomes READY", default: 0, constraints: ">= 0" }
      - { name: target_aging_days, type: integer, source: input, description: "Target aging horizon used for projected shrink", default: 0, constraints: ">= 0" }
      - { name: shrink_pct_per_day, type: number, source: input, description: "Fractional daily moisture-loss rate, e.g. 0.001 = 0.1%/day", default: 0, constraints: ">= 0" }

  - name: Cave
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Aging cave name" }
      - { name: temp_c, type: number, source: input, description: "Set-point temperature in Celsius" }
      - { name: humidity_pct, type: number, source: input, description: "Set-point relative humidity percent" }
      - { name: capacity_g, type: integer, source: input, description: "Total weight capacity of the cave in grams", constraints: "> 0" }
      - { name: used_g, type: integer, source: computed, description: "Sum of current_weight_g over lots in this cave whose status IN {AGING, READY}" }
      - { name: available_g, type: integer, source: computed, description: "capacity_g - used_g; never negative" }

  - name: Lot
    parent: null
    common_fields: true
    fields:
      - { name: product_id, type: string, source: input, description: "FK -> Product.id" }
      - { name: cave_id, type: string, source: input, description: "FK -> Cave.id" }
      - { name: received_weight_g, type: integer, source: input, description: "Weight received into inventory in grams", constraints: "> 0" }
      - { name: current_weight_g, type: integer, source: computed, description: "Physical remaining weight = received - cumulative_shrink_g - consumed_weight_g" }
      - { name: reserved_weight_g, type: integer, source: computed, description: "Sum of requested_weight_g over OrderLines that reference this lot on a non-terminal, non-fulfilled order" }
      - { name: available_weight_g, type: integer, source: computed, description: "current_weight_g - reserved_weight_g; never negative" }
      - { name: consumed_weight_g, type: integer, source: computed, description: "Sum of actual_cut_weight_g over FULFILLED lines drawn from this lot" }
      - { name: cumulative_shrink_g, type: integer, source: computed, description: "Accumulated moisture loss applied by rotation runs" }
      - { name: projected_ready_weight_g, type: integer, source: computed, description: "One-shot projection at receive: round(received_weight_g * (1 - shrink_pct_per_day * product.target_aging_days))" }
      - { name: aging_start_date, type: datetime, source: system, description: "Logical clock instant at which the lot was received; basis for aging_days" }
      - { name: last_aged_days, type: integer, source: system, description: "aging_days value at the most recent rotation run; used to compute per-run shrink delta", default: 0 }
      - { name: aging_days, type: integer, source: computed, description: "floor((clock_now - aging_start_date) / 1 day)" }
      - { name: status, type: enum, source: system, description: "AGING | READY | DEPLETED | DISCARDED; initial AGING", constraints: "one of {AGING, READY, DEPLETED, DISCARDED}" }

  - name: Order
    parent: null
    common_fields: true
    fields:
      - { name: order_type, type: enum, source: input, description: "RETAIL | BOARD | CATERING | WHOLESALE", constraints: "one of {RETAIL, BOARD, CATERING, WHOLESALE}" }
      - { name: customer_id, type: string, source: input, description: "FK -> Customer.id" }
      - { name: prep_station_id, type: string, source: input, description: "FK -> PrepStation.id; required for CATERING, null otherwise", default: null }
      - { name: prep_window_start, type: datetime, source: input, description: "Catering prep window start (inclusive); null for non-CATERING", default: null }
      - { name: prep_window_end, type: datetime, source: input, description: "Catering prep window end (exclusive); null for non-CATERING", default: null }
      - { name: event_date, type: datetime, source: input, description: "Catering event date; informational", default: null }
      - { name: billable_weight_g, type: integer, source: computed, description: "Sum of billable weight over BY_WEIGHT product lines; drives wholesale volume-discount tier" }
      - { name: subtotal_cents, type: integer, source: computed, description: "Sum of line prices (provisional until FULFILLED, final at/after FULFILLED)" }
      - { name: discount_cents, type: integer, source: computed, description: "Wholesale volume discount; 0 for non-WHOLESALE" }
      - { name: delivery_fee_cents, type: integer, source: computed, description: "DELIVERY_FEE_CENTS for CATERING, else 0" }
      - { name: total_cents, type: integer, source: computed, description: "subtotal_cents - discount_cents + delivery_fee_cents" }
      - { name: fulfillment_status, type: enum, source: system, description: "DRAFT | SUBMITTED | FULFILLED | CANCELLED | RETURNED; initial DRAFT", constraints: "one of {DRAFT, SUBMITTED, FULFILLED, CANCELLED, RETURNED}" }
      - { name: payment_status, type: enum, source: system, description: "UNPAID | PAID | REFUNDED; initial UNPAID (independent of fulfillment_status)", constraints: "one of {UNPAID, PAID, REFUNDED}" }
      - { name: payment_method, type: enum, source: system, description: "NONE | STORE_CREDIT | EXTERNAL; initial NONE", default: "NONE", constraints: "one of {NONE, STORE_CREDIT, EXTERNAL}" }
      - { name: store_credit_applied_cents, type: integer, source: computed, description: "Amount debited from the customer's store_credit_cents at payment; credited back on refund", default: 0 }

  - name: OrderLine
    parent: null
    common_fields: true
    fields:
      - { name: order_id, type: string, source: system, description: "FK -> Order.id (taken from the path at creation)" }
      - { name: line_type, type: enum, source: input, description: "PRODUCT | BOARD", constraints: "one of {PRODUCT, BOARD}" }
      - { name: product_id, type: string, source: input, description: "FK -> Product.id; required for PRODUCT lines, null for BOARD lines", default: null }
      - { name: board_id, type: string, source: input, description: "FK -> Board.id; required for BOARD lines, null for PRODUCT lines", default: null }
      - { name: lot_id, type: string, source: system, description: "FK -> Lot.id; null until the line is allocated to a lot", default: null }
      - { name: requested_weight_g, type: integer, source: input, description: "Requested weight in grams for a BY_WEIGHT product line", default: 0 }
      - { name: requested_qty, type: integer, source: input, description: "Requested unit count for a BY_UNIT product line", default: 0 }
      - { name: actual_cut_weight_g, type: integer, source: input, description: "Actual cut weight recorded at fulfillment; drives final price for BY_WEIGHT lines", default: 0 }
      - { name: reserved_weight_g, type: integer, source: computed, description: "Weight reserved on the allocated lot (equals requested_weight_g while allocated and not yet fulfilled/released)" }
      - { name: provisional_price_cents, type: integer, source: computed, description: "Price computed at line add / quote time from nominal inputs" }
      - { name: final_price_cents, type: integer, source: computed, description: "Price computed at fulfillment from actual_cut_weight_g; equals provisional_price_cents until fulfillment" }

  - name: Board
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Board / platter name" }
      - { name: components, type: array, source: input, description: "List of {product_id, portion_g} objects composing the board" }
      - { name: pairing_notes, type: string, source: input, description: "Free-text beverage / accompaniment pairing suggestion", default: null }
      - { name: assembly_fee_cents, type: integer, source: computed, description: "Fixed BOARD_ASSEMBLY_FEE_CENTS added to component sum" }
      - { name: base_price_cents, type: integer, source: computed, description: "Sum over components of round(portion_g/1000 * product.price_per_kg_cents) [round per component, then sum], plus assembly_fee_cents" }

  - name: Subscription
    parent: null
    common_fields: true
    fields:
      - { name: customer_id, type: string, source: input, description: "FK -> Customer.id (the billing account / owner)" }
      - { name: board_id, type: string, source: input, description: "FK -> Board.id (the board shipped each cycle)" }
      - { name: tier, type: enum, source: input, description: "CLASSIC | PREMIUM", constraints: "one of {CLASSIC, PREMIUM}" }
      - { name: cadence_days, type: integer, source: input, description: "Days between shipments", default: 30, constraints: "> 0" }
      - { name: monthly_price_cents, type: integer, source: input, description: "Charge per cycle in cents", constraints: "> 0" }
      - { name: is_gift, type: boolean, source: input, description: "true => gift subscription with a named recipient", default: false }
      - { name: gift_recipient_email, type: string, source: input, description: "Recipient email when is_gift=true", default: null }
      - { name: status, type: enum, source: system, description: "ACTIVE | PAUSED | CANCELLED; initial ACTIVE", constraints: "one of {ACTIVE, PAUSED, CANCELLED}" }
      - { name: next_ship_date, type: datetime, source: computed, description: "Clock-at-create + cadence_days; advanced by cadence_days on resume from pause" }

  - name: PrepStation
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Catering prep station / workbench name" }

  - name: TastingRoom
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Tasting / sampling room name" }
      - { name: seat_capacity, type: integer, source: input, description: "Maximum aggregate seats occupied by time-overlapping events", constraints: "> 0" }
      - { name: buffer_minutes, type: integer, source: input, description: "Required clean-down gap between two non-overlapping events in the same room", default: 30, constraints: ">= 0" }

  - name: TastingEvent
    parent: null
    common_fields: true
    fields:
      - { name: tasting_room_id, type: string, source: input, description: "FK -> TastingRoom.id" }
      - { name: customer_id, type: string, source: input, description: "FK -> Customer.id (host account; must be ACTIVE to book)" }
      - { name: start_at, type: datetime, source: input, description: "Event start (inclusive)" }
      - { name: end_at, type: datetime, source: input, description: "Event end (exclusive)" }
      - { name: seats, type: integer, source: input, description: "Seats requested for this event", constraints: "> 0" }
      - { name: pairing_product_ids, type: array, source: input, description: "Products featured/paired in the tasting", default: [] }
      - { name: status, type: enum, source: system, description: "SCHEDULED | CANCELLED; initial SCHEDULED", constraints: "one of {SCHEDULED, CANCELLED}" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Lot
    field: status
    initial_state: AGING
    terminal_states: [DEPLETED, DISCARDED]
    note: "AGING set at receive with aging_start_date = clock_now."
    transitions:
      - from: AGING
        to: READY
        trigger: "POST /api/caves/{cave_id}/rotate (system, during a rotation run)"
        actor: ShopManager
        preconditions:
          - "aging_days >= product.min_aging_days (boundary is inclusive: exactly min_aging_days flips READY)"
          - "cumulative_shrink_g < received_weight_g * LOT_MAX_SHRINK_PCT"
        side_effects:
          - "Applies per-run shrink: shrink_g = round(current_weight_g * product.shrink_pct_per_day * (aging_days - last_aged_days)); current_weight_g -= shrink_g; cumulative_shrink_g += shrink_g; last_aged_days = aging_days"
          - "Recomputes Cave.used_g and Cave.available_g"
      - from: AGING
        to: DISCARDED
        trigger: "POST /api/caves/{cave_id}/rotate (system) or POST /api/lots/{lot_id}/discard (manual)"
        actor: ShopManager
        preconditions:
          - "Rotation: cumulative_shrink_g >= received_weight_g * LOT_MAX_SHRINK_PCT after applying the run's shrink; OR manual discard"
        side_effects:
          - "Lot leaves inventory; Cave.used_g and Cave.available_g recomputed (this lot no longer counted)"
      - from: READY
        to: DISCARDED
        trigger: "POST /api/caves/{cave_id}/rotate (system) or POST /api/lots/{lot_id}/discard (manual)"
        actor: ShopManager
        preconditions:
          - "Rotation: cumulative_shrink_g >= received_weight_g * LOT_MAX_SHRINK_PCT; OR manual discard"
          - "reserved_weight_g == 0 for manual discard (cannot discard a lot with live reservations)"
        side_effects:
          - "Lot leaves inventory; Cave.used_g and Cave.available_g recomputed"
      - from: READY
        to: DEPLETED
        trigger: "POST /api/orders/{order_id}/fulfill (system, when consumption drains the lot)"
        actor: CounterStaff
        preconditions:
          - "available_weight_g reaches 0 after fulfillment consumption"
        side_effects:
          - "Lot marked DEPLETED; Cave.used_g and Cave.available_g recomputed"

  - entity: Order
    field: fulfillment_status
    initial_state: DRAFT
    terminal_states: [CANCELLED, RETURNED]
    note: "Independent of payment_status (see the payment machine below)."
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /api/orders/{order_id}/submit"
        actor: CounterStaff
        preconditions:
          - "Order has >= 1 line (empty order rejected: ERR_EMPTY_ORDER)"
          - "Every BY_WEIGHT PRODUCT line is allocated to a lot (lot_id != null)"
          - "business_safety: no allocated lot of an unpasteurized product has aging_days < RAW_MILK_MIN_LEGAL_AGING_DAYS"
          - "business_temporal (CATERING): prep window does not collide with another live catering order on the same PrepStation"
          - "business_fiscal (WHOLESALE): subtotal_cents >= WHOLESALE_MIN_ORDER_CENTS"
        side_effects:
          - "Recomputes billable_weight_g, subtotal_cents, discount_cents, delivery_fee_cents, total_cents"
      - from: SUBMITTED
        to: FULFILLED
        trigger: "POST /api/orders/{order_id}/fulfill"
        actor: CounterStaff
        preconditions:
          - "payment_status == PAID (cross-axis precondition)"
          - "Every BY_WEIGHT PRODUCT line has actual_cut_weight_g recorded (supplied in the fulfill payload)"
        side_effects:
          - "For each PRODUCT line: final_price_cents recomputed from actual_cut_weight_g; lot.consumed_weight_g += actual_cut_weight_g; lot.current_weight_g -= actual_cut_weight_g; line reservation released"
          - "Cascade: a lot whose available_weight_g reaches 0 transitions READY->DEPLETED; Cave.used_g recomputed"
          - "subtotal_cents/total_cents recomputed from final line prices"
      - from: [DRAFT, SUBMITTED]
        to: CANCELLED
        trigger: "POST /api/orders/{order_id}/cancel"
        actor: CounterStaff
        preconditions: []
        side_effects:
          - "Releases every line reservation (lot.reserved_weight_g recomputed, lot.available_weight_g restored)"
          - "If payment_status == PAID: refund via the payment machine (PAID->REFUNDED); STORE_CREDIT refunds credit the customer's store_credit_cents by store_credit_applied_cents"
      - from: FULFILLED
        to: RETURNED
        trigger: "POST /api/orders/{order_id}/return"
        actor: CounterStaff
        preconditions:
          - "payment_status == PAID"
        side_effects:
          - "For each PRODUCT line: lot.consumed_weight_g -= actual_cut_weight_g; lot.current_weight_g += actual_cut_weight_g (stock returned); a DEPLETED lot reverts to READY if it regains available weight"
          - "Refund via the payment machine (PAID->REFUNDED); STORE_CREDIT refunds credit store_credit_cents by store_credit_applied_cents"
          - "Cave.used_g recomputed"

  - entity: Order
    field: payment_status
    initial_state: UNPAID
    terminal_states: [REFUNDED]
    note: "Second, independent state axis on Order; evolves separately from fulfillment_status."
    transitions:
      - from: UNPAID
        to: PAID
        trigger: "POST /api/orders/{order_id}/pay"
        actor: CounterStaff
        preconditions:
          - "fulfillment_status == SUBMITTED (must be submitted before payment)"
          - "If payment_method == STORE_CREDIT: customer.store_credit_cents >= total_cents (else ERR_INSUFFICIENT_STORE_CREDIT)"
        side_effects:
          - "payment_method recorded; for STORE_CREDIT: customer.store_credit_cents -= total_cents; store_credit_applied_cents = total_cents"
      - from: PAID
        to: REFUNDED
        trigger: "POST /api/orders/{order_id}/cancel or POST /api/orders/{order_id}/return (system, when a paid order is cancelled or returned)"
        actor: CounterStaff
        preconditions: []
        side_effects:
          - "For STORE_CREDIT: customer.store_credit_cents += store_credit_applied_cents (money conservation)"

  - entity: Subscription
    field: status
    initial_state: ACTIVE
    terminal_states: [CANCELLED]
    note: "Cyclic: ACTIVE <-> PAUSED may repeat any number of times."
    transitions:
      - from: ACTIVE
        to: PAUSED
        trigger: "POST /api/subscriptions/{subscription_id}/pause"
        actor: WholesaleCustomer
        preconditions: []
        side_effects: []
      - from: PAUSED
        to: ACTIVE
        trigger: "POST /api/subscriptions/{subscription_id}/resume"
        actor: WholesaleCustomer
        preconditions: []
        side_effects:
          - "next_ship_date advanced by cadence_days"
      - from: [ACTIVE, PAUSED]
        to: CANCELLED
        trigger: "POST /api/subscriptions/{subscription_id}/cancel"
        actor: WholesaleCustomer
        preconditions: []
        side_effects: []

  - entity: Customer
    field: status
    initial_state: ACTIVE
    terminal_states: [CLOSED]
    transitions:
      - from: ACTIVE
        to: DELINQUENT
        trigger: "POST /api/customers/{customer_id}/set-status with status=DELINQUENT"
        actor: ShopManager
        preconditions: []
        side_effects:
          - "Customer can no longer host tasting events (cross-entity precondition on TastingEvent create)"
      - from: DELINQUENT
        to: ACTIVE
        trigger: "POST /api/customers/{customer_id}/set-status with status=ACTIVE"
        actor: ShopManager
        preconditions: []
        side_effects: []
      - from: [ACTIVE, DELINQUENT]
        to: CLOSED
        trigger: "POST /api/customers/{customer_id}/set-status with status=CLOSED"
        actor: ShopManager
        preconditions: []
        side_effects: []

  - entity: TastingEvent
    field: status
    initial_state: SCHEDULED
    terminal_states: [CANCELLED]
    transitions:
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /api/tasting-events/{event_id}/cancel"
        actor: CounterStaff
        preconditions: []
        side_effects:
          - "Frees the event's room occupancy (its seats and buffer no longer constrain later bookings)"

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: lot-allocate-stale-version
    parent_entity: Lot
    write_endpoint: "POST /api/order-lines/{line_id}/allocate"
    occ_field: "expected_lot_version"
    description: |
      Allocating an OrderLine to a Lot whose version has advanced since the
      client last observed it is rejected. A prior allocation against the same
      lot legitimately reserved weight and advanced Lot.version; a subsequent
      allocation still carrying the client's earlier expected_lot_version is
      operating on a stale view of remaining availability and is rejected with
      ERR_STALE_LOT_VERSION (412). Two strictly sequential allocate calls
      reproduce this deterministically.
    error_id: ERR_STALE_LOT_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: line_price
    trigger: "line add (POST /api/orders/{order_id}/lines) => provisional; order fulfill (POST /api/orders/{order_id}/fulfill) => final"
    algorithm: tiered_pricing
    formula: |
      For a PRODUCT line of a BY_WEIGHT product:
        price(w) = round_half_up(w / 1000 * product.price_per_kg_cents)   # cents
      For a PRODUCT line of a BY_UNIT product:
        price = requested_qty * product.unit_price_cents
      For a BOARD line:
        price = Board.base_price_cents (see board_price)
    input_set: "A single OrderLine; weight w depends on the variant."
    precision: "round_half_up to whole cents"
    variants:
      - name: provisional
        when: "at line add / quote, before fulfillment"
        difference: "BY_WEIGHT uses w = requested_weight_g (nominal); writes provisional_price_cents (and final_price_cents mirrors it until fulfillment)"
      - name: final
        when: "at fulfillment"
        difference: "BY_WEIGHT uses w = actual_cut_weight_g (the real cut recorded at pack/fulfill); writes final_price_cents, which may differ from provisional_price_cents"

  - name: order_totals
    trigger: "order submit and order fulfill; recomputed whenever lines change while DRAFT"
    algorithm: tiered_pricing
    formula: |
      # Evaluation order is fixed and must be followed exactly:
      1. billable_weight_g = sum(requested_weight_g for BY_WEIGHT PRODUCT lines)   # (actual_cut_weight_g after FULFILLED)
      2. subtotal_cents    = sum(line price for all lines)  # provisional before FULFILLED, final at/after FULFILLED
      3. discount_pct = WHOLESALE tier over billable_weight_g (0 for non-WHOLESALE orders):
           billable_weight_g <  5000            -> 0.00
           5000 <= billable_weight_g < 20000    -> 0.08
           billable_weight_g >= 20000           -> 0.15
      4. discount_cents = min(round_half_up(subtotal_cents * discount_pct), MAX_WHOLESALE_DISCOUNT_CENTS)
      5. delivery_fee_cents = DELIVERY_FEE_CENTS if order_type == CATERING else 0
      6. total_cents = subtotal_cents - discount_cents + delivery_fee_cents
    input_set: "All OrderLines on the order; tier keyed on billable_weight_g; discount only for order_type=WHOLESALE."
    constants:
      WHOLESALE_TIER_1_WEIGHT_G: 5000
      WHOLESALE_TIER_2_WEIGHT_G: 20000
      WHOLESALE_TIER_1_PCT: 0.08
      WHOLESALE_TIER_2_PCT: 0.15
      MAX_WHOLESALE_DISCOUNT_CENTS: 50000
      DELIVERY_FEE_CENTS: 2500
    precision: "round_half_up to whole cents; discount computed on the whole-cent subtotal (step 2 before step 4)"

  - name: board_price
    trigger: "board create (POST /api/boards)"
    algorithm: aggregation
    formula: |
      # Rounding order is fixed: round EACH component to cents FIRST, then sum.
      components_sum = 0
      for c in components:
        p = Product(c.product_id)
        components_sum += round_half_up(c.portion_g / 1000 * p.price_per_kg_cents)
      base_price_cents = components_sum + BOARD_ASSEMBLY_FEE_CENTS
    input_set: "The board's component list; each component's product must be BY_WEIGHT."
    constants:
      BOARD_ASSEMBLY_FEE_CENTS: 1500
    precision: "round_half_up per component, then integer sum (round-per-line, NOT sum-then-round)"

  - name: lot_shrink
    trigger: "receive (projected, one-shot) and each rotation run (actual, chronological)"
    algorithm: decay_function
    formula: |
      # Two valid interpretations of the same daily shrink rate diverge:
      projected_ready_weight_g = round_half_up(received_weight_g * (1 - shrink_pct_per_day * product.target_aging_days))   # one-shot, on the ORIGINAL received weight
      # actual (per rotation run):
      shrink_g = round_half_up(current_weight_g * shrink_pct_per_day * (aging_days - last_aged_days))  # on the CURRENT (already-shrunk) weight
      current_weight_g    -= shrink_g
      cumulative_shrink_g += shrink_g
      last_aged_days       = aging_days
    input_set: "One lot; projected uses target_aging_days on received weight; actual accumulates per-run deltas on the diminishing current weight."
    constants:
      LOT_MAX_SHRINK_PCT: 0.35
    precision: "round_half_up to whole grams"
    variants:
      - name: projected
        when: "computed once at receive"
        difference: "linear on the original received_weight_g across the full target_aging_days horizon"
      - name: actual
        when: "accumulated across rotation runs"
        difference: "each run shrinks the current (already reduced) weight, so the realized weight diverges from the projection"

  - name: cave_usage
    trigger: "lot receive, rotation run, lot discard, order fulfill/return"
    algorithm: aggregation
    formula: |
      used_g = sum(current_weight_g for Lot in cave where status IN {AGING, READY})
      available_g = max(0, capacity_g - used_g)
    input_set: "Lots in the cave with status in {AGING, READY}; DEPLETED and DISCARDED lots excluded."
    precision: "integer grams"

  - name: order_allergen_label
    trigger: "GET /api/orders/{order_id}/label"
    algorithm: aggregation
    formula: |
      allergens = sorted(set union of Product.allergens over all lines' products,
                         and over every component product of any BOARD line)
      contains_raw_milk = any product on the order (line product or board component) has pasteurized == false
    input_set: "All lines on the order; for BOARD lines, the board's component products."
    precision: "set union; deterministic sorted output"

  - name: lot_weight_ledger
    trigger: "invariant maintained across fulfill and return"
    algorithm: aggregation
    formula: |
      # Conserved quantity (physical weight, grams). Holds at all times:
      received_weight_g == current_weight_g + consumed_weight_g + cumulative_shrink_g
      # Compensating pair: FULFILL moves reserved weight into consumed (current down);
      # RETURN moves it back (current up, consumed down). With no rotation run between
      # the pair, (current_weight_g + consumed_weight_g) is unchanged by fulfill+return.
    input_set: "A single lot across a fulfill then return of the same order line."
    precision: "integer grams"

  - name: store_credit_ledger
    trigger: "invariant maintained across pay(STORE_CREDIT) and refund"
    algorithm: aggregation
    formula: |
      # Conserved quantity (money, cents). For a customer paying by STORE_CREDIT:
      store_credit_cents_after_pay    = store_credit_cents_before - order.total_cents
      store_credit_cents_after_refund = store_credit_cents_after_pay + order.store_credit_applied_cents
      # A pay followed by its compensating refund (cancel or return) leaves
      # store_credit_cents equal to its pre-payment value.
    input_set: "One customer, one order paid via STORE_CREDIT, then refunded."
    precision: "integer cents"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and X-User-Role is a known role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"

  - priority: 2
    category: auth
    check: "Role authorized for this operation; for WholesaleCustomer, X-User-ID matches the target resource's customer_id (ownership)"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: existence
    check: "Path ids and body foreign keys resolve to existing resources (validated left-to-right)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all"

  - priority: 4
    category: business_constraint
    check: "Request body well-formed: required fields present, enums valid, types correct"
    error_id: ERR_VALIDATION
    http_status: 400
    applies_to: "all writes"

  - priority: 5
    category: business_constraint
    check: "Product pricing config coherent: BY_WEIGHT requires price_per_kg_cents > 0 and unit_price_cents == 0; BY_UNIT requires unit_price_cents > 0 and price_per_kg_cents == 0"
    error_id: ERR_INVALID_PRICING_CONFIG
    http_status: 422
    applies_to: "POST /api/products"

  - priority: 6
    category: state
    check: "Target resource in a valid state for the transition (e.g., add/allocate line requires Order DRAFT; pay requires SUBMITTED+UNPAID; fulfill requires SUBMITTED+PAID; return requires FULFILLED; subscription pause/resume/cancel from valid state)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "state-transition endpoints"

  - priority: 7
    category: state
    check: "Adding or allocating an order line requires the order's fulfillment_status == DRAFT"
    error_id: ERR_ORDER_NOT_DRAFT
    http_status: 409
    applies_to: "POST /api/orders/{order_id}/lines, POST /api/order-lines/{line_id}/allocate"

  - priority: 8
    category: business_referential
    check: "Cross-entity state: allocating a line requires the referenced Lot.status == READY"
    error_id: ERR_LOT_NOT_READY
    http_status: 409
    applies_to: "POST /api/order-lines/{line_id}/allocate"

  - priority: 9
    category: business_referential
    check: "Cross-entity state: hosting a tasting event requires the referenced Customer.status == ACTIVE"
    error_id: ERR_CUSTOMER_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /api/tasting-events"

  - priority: 10
    category: business_safety
    check: "No allocated lot of an unpasteurized (raw-milk) product has aging_days < RAW_MILK_MIN_LEGAL_AGING_DAYS (60)"
    error_id: ERR_RAW_MILK_AGING
    http_status: 422
    applies_to: "POST /api/orders/{order_id}/submit, POST /api/orders/{order_id}/fulfill"

  - priority: 11
    category: business_temporal
    check: "CATERING prep window [prep_window_start, prep_window_end) does not overlap another live catering order (fulfillment_status IN {DRAFT, SUBMITTED, FULFILLED}) on the same PrepStation; half-open, adjacency (end == other.start) allowed; single occupancy"
    error_id: ERR_PREP_STATION_CONFLICT
    http_status: 409
    applies_to: "POST /api/orders (CATERING), POST /api/orders/{order_id}/submit"

  - priority: 12
    category: business_temporal
    check: "TastingEvent booking respects the room's buffer: two SCHEDULED events in the same room that do NOT overlap in time must be separated by gap >= buffer_minutes"
    error_id: ERR_TASTING_ROOM_CONFLICT
    http_status: 409
    applies_to: "POST /api/tasting-events"

  - priority: 13
    category: business_constraint
    check: "TastingEvent aggregate seats: for the set of SCHEDULED events whose [start_at, end_at) intervals overlap this one, sum(seats) + this.seats <= room.seat_capacity"
    error_id: ERR_TASTING_SEATS_EXCEEDED
    http_status: 409
    applies_to: "POST /api/tasting-events"

  - priority: 14
    category: business_constraint
    check: "Receiving a lot must not push Cave.used_g above capacity_g (received_weight_g <= cave.available_g)"
    error_id: ERR_CAVE_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /api/lots"

  - priority: 15
    category: business_constraint
    check: "Allocating a line requires lot.available_weight_g >= line.requested_weight_g"
    error_id: ERR_INSUFFICIENT_LOT_WEIGHT
    http_status: 409
    applies_to: "POST /api/order-lines/{line_id}/allocate"

  - priority: 16
    category: business_constraint
    check: "An order must have >= 1 line to be submitted (empty-collection boundary)"
    error_id: ERR_EMPTY_ORDER
    http_status: 422
    applies_to: "POST /api/orders/{order_id}/submit"

  - priority: 17
    category: business_fiscal
    check: "WHOLESALE order subtotal_cents >= WHOLESALE_MIN_ORDER_CENTS (10000) at submit"
    error_id: ERR_WHOLESALE_MIN_ORDER
    http_status: 422
    applies_to: "POST /api/orders/{order_id}/submit"

  - priority: 18
    category: business_fiscal
    check: "STORE_CREDIT payment requires customer.store_credit_cents >= order.total_cents"
    error_id: ERR_INSUFFICIENT_STORE_CREDIT
    http_status: 402
    applies_to: "POST /api/orders/{order_id}/pay"

  - priority: 19
    category: state
    check: "OCC: allocate carries expected_lot_version equal to the lot's current version (stale value rejected)"
    error_id: ERR_STALE_LOT_VERSION
    http_status: 412
    applies_to: "POST /api/order-lines/{line_id}/allocate"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Logical clock (test-driving) ---
  - method: POST
    path: "/api/_clock/set_current_utc"
    description: "Set the server logical clock. Startup default is 2026-07-01T00:00:00Z; before any set call the clock reads exactly this default and never falls back to wall-clock time."
    roles: [ShopManager]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["Logical clock advanced/reset to to_iso8601; affects lot aging_days and booking window comparisons"]

  # --- Customers ---
  - method: POST
    path: "/api/customers"
    description: "Create a customer / wholesale account"
    roles: [ShopManager]
    code: 201
    input: [account_type, name, region_code, "wholesale_tier?", "credit_limit_cents?", "store_credit_cents?"]
    output: Customer
    side_effects: ["status=ACTIVE"]
  - method: GET
    path: "/api/customers/{customer_id}"
    description: "Get a customer"
    roles: [ShopManager, CounterStaff, WholesaleCustomer]
    code: 200
    input: []
    output: Customer
    side_effects: []
  - method: POST
    path: "/api/customers/{customer_id}/set-status"
    description: "Set customer status (ACTIVE/DELINQUENT/CLOSED)"
    roles: [ShopManager]
    code: 200
    input: [status]
    output: Customer
    side_effects: ["Customer.status transitions per the Customer state machine"]

  # --- Products ---
  - method: POST
    path: "/api/products"
    description: "Create a product SKU"
    roles: [ShopManager]
    code: 201
    input: [name, category, milk_type, pasteurized, form, pricing_mode, "price_per_kg_cents?", "unit_price_cents?", "allergens?", "min_aging_days?", "target_aging_days?", "shrink_pct_per_day?"]
    output: Product
    side_effects: ["Pricing config validated (ERR_INVALID_PRICING_CONFIG)"]
  - method: GET
    path: "/api/products/{product_id}"
    description: "Get a product"
    roles: [ShopManager, CounterStaff, WholesaleCustomer]
    code: 200
    input: []
    output: Product
    side_effects: []

  # --- Caves ---
  - method: POST
    path: "/api/caves"
    description: "Create an aging cave"
    roles: [ShopManager]
    code: 201
    input: [name, temp_c, humidity_pct, capacity_g]
    output: Cave
    side_effects: ["used_g=0, available_g=capacity_g"]
  - method: GET
    path: "/api/caves/{cave_id}"
    description: "Get a cave with computed usage"
    roles: [ShopManager, CounterStaff]
    code: 200
    input: []
    output: Cave
    side_effects: []
  - method: POST
    path: "/api/caves/{cave_id}/rotate"
    description: "Run a rotation on the cave: advance aging, apply per-run shrink, promote AGING->READY at min_aging_days, discard over-shrunk lots, recompute usage. Ops-run checkpoint."
    roles: [ShopManager]
    code: 200
    input: []
    output: Cave
    side_effects:
      - "For each AGING/READY lot: apply lot_shrink actual variant; update current_weight_g, cumulative_shrink_g, last_aged_days"
      - "AGING lot with aging_days >= product.min_aging_days -> READY"
      - "Lot with cumulative_shrink_g >= received_weight_g * LOT_MAX_SHRINK_PCT -> DISCARDED"
      - "Recompute Cave.used_g and Cave.available_g"

  # --- Lots ---
  - method: POST
    path: "/api/lots"
    description: "Receive a lot into a cave (status AGING)"
    roles: [ShopManager]
    code: 201
    input: [product_id, cave_id, received_weight_g]
    output: Lot
    side_effects:
      - "status=AGING; aging_start_date=clock_now; current_weight_g=received_weight_g; cumulative_shrink_g=0; last_aged_days=0"
      - "projected_ready_weight_g computed (lot_shrink projected variant)"
      - "Cave.used_g/available_g recomputed (ERR_CAVE_CAPACITY_EXCEEDED if over capacity)"
  - method: GET
    path: "/api/lots/{lot_id}"
    description: "Get a lot with computed weights and aging_days"
    roles: [ShopManager, CounterStaff, WholesaleCustomer]
    code: 200
    input: []
    output: Lot
    side_effects: []
  - method: GET
    path: "/api/lots"
    description: "List lots, optionally filtered by product, cave, or status"
    roles: [ShopManager, CounterStaff, WholesaleCustomer]
    code: 200
    input: ["product_id?", "cave_id?", "status?", "limit?", "offset?"]
    output: Lot[]
    side_effects: []
  - method: POST
    path: "/api/lots/{lot_id}/discard"
    description: "Manually discard a lot (spoilage/shrink)"
    roles: [ShopManager]
    code: 200
    input: ["reason?"]
    output: Lot
    side_effects: ["status=DISCARDED (requires reserved_weight_g==0); Cave.used_g recomputed"]

  # --- Orders ---
  - method: POST
    path: "/api/orders"
    description: "Create an order (DRAFT/UNPAID). CATERING orders supply prep station + window and are overlap-checked immediately."
    roles: [CounterStaff, WholesaleCustomer]
    code: 201
    input: [order_type, customer_id, "prep_station_id?", "prep_window_start?", "prep_window_end?", "event_date?"]
    output: Order
    side_effects:
      - "fulfillment_status=DRAFT, payment_status=UNPAID, payment_method=NONE, all money fields 0"
      - "CATERING: ERR_PREP_STATION_CONFLICT if prep window overlaps a live catering order on the same PrepStation"
  - method: GET
    path: "/api/orders/{order_id}"
    description: "Get an order with computed totals"
    roles: [ShopManager, CounterStaff, WholesaleCustomer]
    code: 200
    input: []
    output: Order
    side_effects: []
  - method: GET
    path: "/api/orders"
    description: "List orders, optionally filtered by customer, prep station, type, or fulfillment status"
    roles: [ShopManager, CounterStaff, WholesaleCustomer]
    code: 200
    input: ["customer_id?", "prep_station_id?", "order_type?", "fulfillment_status?", "limit?", "offset?"]
    output: Order[]
    side_effects: []
  - method: POST
    path: "/api/orders/{order_id}/lines"
    description: "Add a line to a DRAFT order (PRODUCT or BOARD); computes provisional price"
    roles: [CounterStaff, WholesaleCustomer]
    code: 201
    input: [line_type, "product_id?", "board_id?", "requested_weight_g?", "requested_qty?"]
    output: OrderLine
    side_effects:
      - "Requires order DRAFT (ERR_ORDER_NOT_DRAFT)"
      - "provisional_price_cents and final_price_cents computed (line_price provisional)"
      - "Order subtotal/total recomputed"
  - method: POST
    path: "/api/order-lines/{line_id}/allocate"
    description: "Allocate a PRODUCT line to a READY lot, reserving requested_weight_g. OCC on Lot.version."
    roles: [CounterStaff]
    code: 200
    input: [lot_id, expected_lot_version]
    output: OrderLine
    side_effects:
      - "Requires order DRAFT (ERR_ORDER_NOT_DRAFT), Lot READY (ERR_LOT_NOT_READY), lot.available_weight_g >= requested_weight_g (ERR_INSUFFICIENT_LOT_WEIGHT)"
      - "expected_lot_version must equal Lot.version (else ERR_STALE_LOT_VERSION)"
      - "Sets line.lot_id, line.reserved_weight_g=requested_weight_g; lot.reserved_weight_g/available_weight_g recomputed"
      - "increments Lot.version by 1"
  - method: GET
    path: "/api/order-lines/{line_id}"
    description: "Get an order line"
    roles: [ShopManager, CounterStaff, WholesaleCustomer]
    code: 200
    input: []
    output: OrderLine
    side_effects: []
  - method: GET
    path: "/api/order-lines"
    description: "List order lines, optionally filtered by order, product, lot, or board"
    roles: [ShopManager, CounterStaff, WholesaleCustomer]
    code: 200
    input: ["order_id?", "product_id?", "lot_id?", "board_id?", "limit?", "offset?"]
    output: OrderLine[]
    side_effects: []
  - method: POST
    path: "/api/orders/{order_id}/submit"
    description: "Submit a DRAFT order (validates completeness, safety, temporal, fiscal). DRAFT->SUBMITTED."
    roles: [CounterStaff, WholesaleCustomer]
    code: 200
    input: []
    output: Order
    side_effects:
      - "Validations in priority order: ERR_EMPTY_ORDER, unallocated weight lines (ERR_INVALID_STATE), ERR_RAW_MILK_AGING, ERR_PREP_STATION_CONFLICT, ERR_WHOLESALE_MIN_ORDER"
      - "Recomputes order_totals (billable_weight_g, subtotal, discount, delivery, total)"
  - method: POST
    path: "/api/orders/{order_id}/pay"
    description: "Pay a SUBMITTED+UNPAID order. UNPAID->PAID."
    roles: [CounterStaff, WholesaleCustomer]
    code: 200
    input: [payment_method]
    output: Order
    side_effects:
      - "Requires SUBMITTED (ERR_INVALID_STATE) and UNPAID (ERR_ALREADY_PAID)"
      - "STORE_CREDIT: requires customer.store_credit_cents >= total_cents (ERR_INSUFFICIENT_STORE_CREDIT); debits store_credit_cents; sets store_credit_applied_cents"
  - method: POST
    path: "/api/orders/{order_id}/fulfill"
    description: "Fulfill a SUBMITTED+PAID order, recording actual cut weights. SUBMITTED->FULFILLED. Consumes lot weight (cascade)."
    roles: [CounterStaff]
    code: 200
    input: [line_actuals]
    output: Order
    side_effects:
      - "Requires SUBMITTED (ERR_INVALID_STATE), PAID (ERR_ORDER_NOT_PAID); re-checks raw-milk legality (ERR_RAW_MILK_AGING)"
      - "Per PRODUCT line: final_price recomputed from actual_cut_weight_g; lot.consumed_weight_g += actual; lot.current_weight_g -= actual; reservation released"
      - "Cascade: lot available_weight_g reaching 0 -> READY->DEPLETED; Cave.used_g recomputed; order totals recomputed from final prices"
  - method: POST
    path: "/api/orders/{order_id}/cancel"
    description: "Cancel a DRAFT or SUBMITTED order. -> CANCELLED. Releases reservations; refunds if PAID."
    roles: [CounterStaff, WholesaleCustomer]
    code: 200
    input: []
    output: Order
    side_effects:
      - "Releases every line reservation (lot.reserved_weight_g/available_weight_g recomputed)"
      - "If PAID: payment_status PAID->REFUNDED; STORE_CREDIT credits customer.store_credit_cents by store_credit_applied_cents"
  - method: POST
    path: "/api/orders/{order_id}/return"
    description: "Return a FULFILLED order. FULFILLED->RETURNED. Returns consumed stock to lots; refunds."
    roles: [CounterStaff]
    code: 200
    input: []
    output: Order
    side_effects:
      - "Requires FULFILLED (ERR_ORDER_NOT_FULFILLED) and PAID"
      - "Per PRODUCT line: lot.consumed_weight_g -= actual_cut_weight_g; lot.current_weight_g += actual_cut_weight_g; DEPLETED lot -> READY if it regains weight"
      - "payment_status PAID->REFUNDED; STORE_CREDIT credits store_credit_cents by store_credit_applied_cents; Cave.used_g recomputed"
  - method: GET
    path: "/api/orders/{order_id}/label"
    description: "Computed allergen/label read for the order (allergen union + raw-milk warning)"
    roles: [ShopManager, CounterStaff, WholesaleCustomer]
    code: 200
    input: []
    output: "{ order_id: string, allergens: string[], contains_raw_milk: boolean, line_count: integer }"
    side_effects: []

  # --- Boards ---
  - method: POST
    path: "/api/boards"
    description: "Create a curated board (component list); computes base_price (per-component rounding)"
    roles: [ShopManager]
    code: 201
    input: [name, components, "pairing_notes?"]
    output: Board
    side_effects: ["assembly_fee_cents=BOARD_ASSEMBLY_FEE_CENTS; base_price_cents computed (board_price)"]
  - method: GET
    path: "/api/boards/{board_id}"
    description: "Get a board with computed base_price"
    roles: [ShopManager, CounterStaff, WholesaleCustomer]
    code: 200
    input: []
    output: Board
    side_effects: []

  # --- Subscriptions ---
  - method: POST
    path: "/api/subscriptions"
    description: "Create a subscription (cheese club / gift). status ACTIVE."
    roles: [CounterStaff, WholesaleCustomer]
    code: 201
    input: [customer_id, board_id, tier, monthly_price_cents, "cadence_days?", "is_gift?", "gift_recipient_email?"]
    output: Subscription
    side_effects: ["status=ACTIVE; next_ship_date=clock_now + cadence_days"]
  - method: GET
    path: "/api/subscriptions/{subscription_id}"
    description: "Get a subscription"
    roles: [ShopManager, CounterStaff, WholesaleCustomer]
    code: 200
    input: []
    output: Subscription
    side_effects: []
  - method: GET
    path: "/api/subscriptions"
    description: "List subscriptions, optionally filtered by customer, board, or status"
    roles: [ShopManager, CounterStaff, WholesaleCustomer]
    code: 200
    input: ["customer_id?", "board_id?", "status?", "limit?", "offset?"]
    output: Subscription[]
    side_effects: []
  - method: POST
    path: "/api/subscriptions/{subscription_id}/pause"
    description: "Pause an ACTIVE subscription. ACTIVE->PAUSED."
    roles: [CounterStaff, WholesaleCustomer]
    code: 200
    input: []
    output: Subscription
    side_effects: ["Requires ACTIVE (ERR_SUBSCRIPTION_INVALID_STATE)"]
  - method: POST
    path: "/api/subscriptions/{subscription_id}/resume"
    description: "Resume a PAUSED subscription. PAUSED->ACTIVE."
    roles: [CounterStaff, WholesaleCustomer]
    code: 200
    input: []
    output: Subscription
    side_effects: ["Requires PAUSED (ERR_SUBSCRIPTION_INVALID_STATE); next_ship_date advanced by cadence_days"]
  - method: POST
    path: "/api/subscriptions/{subscription_id}/cancel"
    description: "Cancel a subscription. ACTIVE/PAUSED->CANCELLED."
    roles: [CounterStaff, WholesaleCustomer]
    code: 200
    input: []
    output: Subscription
    side_effects: ["Requires non-terminal (ERR_SUBSCRIPTION_INVALID_STATE)"]

  # --- Prep stations ---
  - method: POST
    path: "/api/prep-stations"
    description: "Create a catering prep station"
    roles: [ShopManager]
    code: 201
    input: [name]
    output: PrepStation
    side_effects: []
  - method: GET
    path: "/api/prep-stations/{prep_station_id}"
    description: "Get a prep station"
    roles: [ShopManager, CounterStaff]
    code: 200
    input: []
    output: PrepStation
    side_effects: []

  # --- Tasting rooms & events ---
  - method: POST
    path: "/api/tasting-rooms"
    description: "Create a tasting room"
    roles: [ShopManager]
    code: 201
    input: [name, seat_capacity, "buffer_minutes?"]
    output: TastingRoom
    side_effects: []
  - method: GET
    path: "/api/tasting-rooms/{tasting_room_id}"
    description: "Get a tasting room"
    roles: [ShopManager, CounterStaff]
    code: 200
    input: []
    output: TastingRoom
    side_effects: []
  - method: POST
    path: "/api/tasting-events"
    description: "Book a tasting/sampling event. Enforces customer ACTIVE, room buffer, and aggregate seats."
    roles: [CounterStaff]
    code: 201
    input: [tasting_room_id, customer_id, start_at, end_at, seats, "pairing_product_ids?"]
    output: TastingEvent
    side_effects:
      - "Requires Customer.status==ACTIVE (ERR_CUSTOMER_NOT_ACTIVE)"
      - "ERR_TASTING_ROOM_CONFLICT if a non-overlapping same-room event is within buffer_minutes"
      - "ERR_TASTING_SEATS_EXCEEDED if overlapping events' seats + this.seats > seat_capacity"
      - "status=SCHEDULED"
  - method: GET
    path: "/api/tasting-events/{event_id}"
    description: "Get a tasting event"
    roles: [ShopManager, CounterStaff, WholesaleCustomer]
    code: 200
    input: []
    output: TastingEvent
    side_effects: []
  - method: GET
    path: "/api/tasting-events"
    description: "List tasting events, optionally filtered by room or customer"
    roles: [ShopManager, CounterStaff, WholesaleCustomer]
    code: 200
    input: ["tasting_room_id?", "customer_id?", "limit?", "offset?"]
    output: TastingEvent[]
    side_effects: []
  - method: POST
    path: "/api/tasting-events/{event_id}/cancel"
    description: "Cancel a scheduled tasting event. SCHEDULED->CANCELLED."
    roles: [CounterStaff]
    code: 200
    input: []
    output: TastingEvent
    side_effects: ["Requires SCHEDULED (ERR_INVALID_STATE); frees room occupancy"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing/invalid auth headers or unknown role" }
  - { id: ERR_UNAUTHORIZED, http: 403, condition: "Role not permitted, or WholesaleCustomer acting on a resource it does not own" }
  - { id: ERR_VALIDATION, http: 400, condition: "Malformed body: missing required field, bad enum, wrong type" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path id or body foreign key does not resolve" }
  - { id: ERR_INVALID_PRICING_CONFIG, http: 422, condition: "Product pricing_mode inconsistent with price_per_kg_cents/unit_price_cents" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Transition attempted from a state that does not permit it" }
  - { id: ERR_ORDER_NOT_DRAFT, http: 409, condition: "Add/allocate line on an order whose fulfillment_status != DRAFT" }
  - { id: ERR_ALREADY_PAID, http: 409, condition: "Pay an order whose payment_status != UNPAID" }
  - { id: ERR_ORDER_NOT_PAID, http: 409, condition: "Fulfill an order whose payment_status != PAID" }
  - { id: ERR_ORDER_NOT_FULFILLED, http: 409, condition: "Return an order whose fulfillment_status != FULFILLED" }
  - { id: ERR_SUBSCRIPTION_INVALID_STATE, http: 409, condition: "Pause/resume/cancel a subscription from an incompatible state" }
  - { id: ERR_LOT_NOT_READY, http: 409, condition: "Allocate a line to a Lot whose status != READY" }
  - { id: ERR_STALE_LOT_VERSION, http: 412, condition: "allocate expected_lot_version != Lot.version" }
  - { id: ERR_INSUFFICIENT_LOT_WEIGHT, http: 409, condition: "Allocate requests more weight than lot.available_weight_g" }
  - { id: ERR_CAVE_CAPACITY_EXCEEDED, http: 409, condition: "Received lot weight exceeds cave available capacity" }
  - { id: ERR_RAW_MILK_AGING, http: 422, condition: "An allocated lot of an unpasteurized product has aging_days < 60 at submit/fulfill" }
  - { id: ERR_EMPTY_ORDER, http: 422, condition: "Submit an order with zero lines" }
  - { id: ERR_WHOLESALE_MIN_ORDER, http: 422, condition: "WHOLESALE order subtotal below WHOLESALE_MIN_ORDER_CENTS at submit" }
  - { id: ERR_INSUFFICIENT_STORE_CREDIT, http: 402, condition: "STORE_CREDIT payment exceeds customer.store_credit_cents" }
  - { id: ERR_PREP_STATION_CONFLICT, http: 409, condition: "Catering prep window overlaps another live catering order on the same prep station" }
  - { id: ERR_TASTING_ROOM_CONFLICT, http: 409, condition: "A non-overlapping same-room tasting event is within buffer_minutes" }
  - { id: ERR_TASTING_SEATS_EXCEEDED, http: 409, condition: "Overlapping tasting events' aggregate seats exceed room seat_capacity" }
  - { id: ERR_CUSTOMER_NOT_ACTIVE, http: 409, condition: "Hosting a tasting event requires Customer.status == ACTIVE" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: ShopManager
    description: "Back-of-house operator: manages products, caves, lots, rotation runs, boards, prep stations, tasting rooms, and customer accounts."
    identity: "opaque"
    exclusive_operations:
      - "POST /api/customers"
      - "POST /api/customers/{customer_id}/set-status"
      - "POST /api/products"
      - "POST /api/caves"
      - "POST /api/caves/{cave_id}/rotate"
      - "POST /api/lots"
      - "POST /api/lots/{lot_id}/discard"
      - "POST /api/boards"
      - "POST /api/prep-stations"
      - "POST /api/tasting-rooms"
    shared_operations:
      - "GET reads across customers, products, caves, lots, orders, order-lines, boards, subscriptions, prep-stations, tasting-rooms, tasting-events"

  - name: CounterStaff
    description: "Front-of-house operator: builds and fulfills retail/board/catering orders, allocates lots, books tasting events."
    identity: "opaque"
    exclusive_operations:
      - "POST /api/order-lines/{line_id}/allocate"
      - "POST /api/orders/{order_id}/fulfill"
      - "POST /api/orders/{order_id}/return"
      - "POST /api/tasting-events"
      - "POST /api/tasting-events/{event_id}/cancel"
    shared_operations:
      - "POST /api/orders (RETAIL/BOARD/CATERING)"
      - "POST /api/orders/{order_id}/lines, submit, pay, cancel"
      - "POST /api/subscriptions and subscription pause/resume/cancel"
      - "GET reads across all collections"

  - name: WholesaleCustomer
    description: "Self-service wholesale/restaurant account acting on its own orders and subscriptions. X-User-ID equals the Customer.id it acts as."
    identity: "entity_backed:Customer"
    exclusive_operations: []
    shared_operations:
      - "POST /api/orders (WHOLESALE, own customer_id only)"
      - "POST /api/orders/{order_id}/lines, submit, pay, cancel (own orders only)"
      - "POST /api/subscriptions and pause/resume/cancel (own subscriptions only)"
      - "GET reads of its own orders, order-lines, subscriptions, lots, products, boards"
