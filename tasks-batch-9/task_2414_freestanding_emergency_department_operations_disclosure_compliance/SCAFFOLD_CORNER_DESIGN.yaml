    distinguishing_aspect: A freshly created facility starts in compliance_posture RESTRICTED (not OPEN) because current_published_template_id is null and signage_attestation_status is PENDING, and it blocks registration with ERR_NO_PUBLISHED_DISCLOSURE.
    test_recipe:
      setup:
      - Empty database
      - Logical clock at 2026-08-01T08:00:00Z
      - One facility created, nothing else
      setup_api_calls:
      - call: POST /_clock/set_current_utc
