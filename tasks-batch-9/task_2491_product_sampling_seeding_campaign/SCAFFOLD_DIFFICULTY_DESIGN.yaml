        grounds:
          - validations[priority=11]
          - validations[priority=33]
          - errors[ERR_CAMPAIGN_NOT_ACCEPTING_ENROLLMENTS]
          - errors[ERR_CAMPAIGN_BUDGET_EXHAUSTED]
          - endpoints[POST /sample-shipments]
        distinguishing_aspect: |
          Error-category pair STATE (priority 11) versus BUSINESS_FISCAL (priority 33) on
          POST /sample-shipments. Both rules are violated by one request: the campaign is SUSPENDED
          (so allocation is not permitted at all) and budget_available_cents is 100 while the shipment
          would commit 754. A cheapest-check-first implementation returns the fiscal error; the ladder
          demands the state error.
        test_recipe:
          setup:
            - "One campaign with budget_total_cents 100, three ACTIVE kit lines (kit assembly cost 454) and a center whose freight is 300, so the shipment would commit 754 cents against 100 available."
            - "One screened non-holdout enrollment in obligation NONE and one PLANNED wave with ample capacity, so no higher-priority rule than 11 is violated."
            - "The campaign has been SUSPENDED by moderator MOD_A after activation, so priority 11 is violated as well."
