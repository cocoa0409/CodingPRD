          pins round-per-leg-then-sum and this instance asserts the pinned value.
        test_recipe:
          setup:
            - "Same COMPLETED WHEELCHAIR round-trip will-call setup as claimed_forward_vs_encounter_chronological_diverge."
            - "Outbound odometer 10.4mi dwell 0; return odometer 9.8mi billable dwell 15min."
