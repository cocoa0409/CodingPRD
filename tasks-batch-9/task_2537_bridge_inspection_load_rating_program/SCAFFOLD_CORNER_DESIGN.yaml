          assert:
            - "Both scour-evaluation creates returned 201 with status DRAFT and derived_scour_status LOW_RISK (scour_code 5 falls in the 4..6 band) - the licence is not checked at creation"
            - "Ulla's finalize returns 422 with data.error_id == ERR_RATING_ENGINEER_NOT_LICENSED"
            - "Paul's finalize returns 422 with the same error_id: load_rating_engineer_licensed true with pe_license_number null does not satisfy the gate"
            - "After both refusals ScourEvaluation.${se_ulla_id}.status is still DRAFT with finalized_at null, and Bridge.${br_id}.scour_status is still NOT_EVALUATED with version 1"
