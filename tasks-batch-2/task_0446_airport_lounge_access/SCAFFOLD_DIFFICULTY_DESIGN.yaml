            - call: "POST /eligibility-cards"
              payload: { member_id: "${m_id}", card_status: "BASIC", fare_class: "ECONOMY", valid_until: "2027-01-01T00:00:00Z" }
              as: NetworkAdmin
            - call: "POST /visits"
              payload: { member_id: "${m_id}", lounge_id: "${l_id}", guest_count: 0, expected_lounge_version: "${l_v0}" }
              as: NetworkAdmin
              captures: { v_id: $.data.id }
            - call: "POST /visits/${v_id}/check-in"
              payload: {}
              as: LoungeAgent
              as_user_id: "${l_id}"
          trigger:
            - call: "POST /visits/${v_id}/complete"
              payload: {}
              as: LoungeAgent
              as_user_id: "${l_id}"
            - call: "GET /settlements?visit_id=${v_id}"
              payload: {}
              as: NetworkAdmin
              captures: { s_status: "$.data[0].status", s_amount: "$.data[0].amount_cents" }
            - call: "GET /lounges/${l_id}"
              payload: {}
              as: NetworkAdmin
              captures: { l_balance: $.data.settlement_balance_cents }
          assert:
            - "Settlement for ${v_id}: status == PAYABLE, amount_cents == 1200 (link1)"
            - "Lounge.${l_id}.settlement_balance_cents == 1200 (link2: balance recomputed from the new PAYABLE settlement)"

  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: ppvc_not_eligible_beats_member_suspended
        grounds:
          - validations[priority=7]
          - validations[priority=8]
          - errors[ERR_NOT_ELIGIBLE]
        distinguishing_aspect: |
          business_constraint (p7 ERR_NOT_ELIGIBLE) vs state (p8 ERR_MEMBER_SUSPENDED): a SUSPENDED member whose
          ACTIVE card is also below the plan minimum on an ECONOMY fare gets ERR_NOT_ELIGIBLE (lower priority wins).
        test_recipe:
          setup:
            - "Plan min_card_status GOLD. Member first holds a GOLD card and accrues 3 NO_SHOW strikes (held then expired+swept) -> standing SUSPENDED."
            - "A new SILVER ECONOMY card is then issued, replacing GOLD as active -> the member is now BOTH suspended (p8) and ineligible (p7, SILVER < GOLD, fare ECONOMY)."
          setup_api_calls:
            - call: "POST /membership-plans"
              payload: { tier: "PRESTIGE_PLUS", included_visits_per_year: 50, included_guest_visits_per_year: 5, overage_charge_cents: 5000, guest_charge_cents: 2500, min_card_status: "GOLD", annual_fee_cents: 0 }
              as: NetworkAdmin
              captures: { plan_id: $.data.id }
