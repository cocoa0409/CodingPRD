scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: certification_provisional_vs_final_score
        grounds:
          - calculations.compliance_score
          - state_machines.CertificationCycle.REMEDIATION_to_CLOSED_PASSED
          - entities.CertificationCycle.fields.provisional_score
          - entities.CertificationCycle.fields.final_score
        distinguishing_aspect: |
          Entity domain: certification review. Two valid readings of "the compliance
          score" diverge on identical component scores (80/70/60): the provisional
          read at FINDINGS_ISSUED is 71.5, while the final read after a REMEDIATION
          round adds REMEDIATION_BONUS_CAP (10) to the lowest component (financial
          60 -> 70) and re-weights to 74.0.
        test_recipe:
          setup:
            - "GoverningBody APPLIED with an OPEN CertificationCycle whose findings (80/70/60) were issued at the default logical clock 2026-09-01T00:00:00Z"
          setup_api_calls:
            - call: "POST /api/governing-bodies"
              payload: { name: "US Swim Federation", sport_code: "SWIM", funding_budget_cents: 5000000, sport_science_pool_hours: 100 }
              as: CommitteeAdmin
              captures: { gb_id: $.data.id }
            - call: "POST /api/governing-bodies/${gb_id}/certification-cycles"
              payload: { window_start: "2026-09-01T00:00:00Z", window_end: "2026-12-01T00:00:00Z" }
              as: CommitteeAdmin
              captures: { cyc_id: $.data.id }
            - call: "POST /api/certification-cycles/${cyc_id}/transitions"
              payload: { to_state: "OPEN" }
              as: CertificationAuditor
              as_user_id: "aud-1"
            - call: "POST /api/certification-cycles/${cyc_id}/transitions"
              payload: { to_state: "FINDINGS_ISSUED", governance_score: 80, athlete_rep_score: 70, financial_score: 60 }
              as: CertificationAuditor
              as_user_id: "aud-1"
              captures: { prov: $.data.provisional_score }
            - call: "POST /api/certification-cycles/${cyc_id}/transitions"
              payload: { to_state: "REMEDIATION" }
              as: CertificationAuditor
              as_user_id: "aud-1"
          trigger:
            - call: "POST /api/certification-cycles/${cyc_id}/transitions"
              payload: { to_state: "CLOSED_PASSED" }
              as: CertificationAuditor
              as_user_id: "aud-2"
              captures: { final: $.data.final_score, cyc_status: $.data.status }
            - call: "GET /api/governing-bodies/${gb_id}"
              as: CommitteeAdmin
              captures: { gb_status: $.data.status, gb_certified_at: $.data.certified_at }
          assert:
            - "provisional read ${prov} == 71.5"
            - "final read ${final} == 74.0 (financial 60 + bonus 10 -> 70; 0.40*80 + 0.35*70 + 0.25*70 = 32.0 + 24.5 + 17.5)"
            - "${final} != ${prov} — identical inputs, two sanctioned variants, different results"
            - "cycle status == CLOSED_PASSED"
            - "GoverningBody ${gb_id} status == CERTIFIED and certified_at == 2026-09-01T00:00:00Z (default clock, cascade from close)"

      - name: funding_trailing_vs_season_points
        grounds:
          - calculations.funding_points
          - calculations.tier_assignment
          - entities.FundingAgreement.fields.points_method
        distinguishing_aspect: |
          Entity domain: athlete funding (distinct from certification). Two sanctioned
          window semantics over the SAME five verified results diverge: TRAILING_365
          (anchor 2027-03-01, 0.5 decay past 180 days) totals 128.25 -> TIER_A stipend
          300000, while CALENDAR_SEASON (2027 year-to-date, no decay) totals 60.0 ->
          TIER_B stipend 200000.
        test_recipe:
          setup:
            - "CERTIFIED GoverningBody"
            - "two ELIGIBLE athletes P and Q, each with the SAME five VERIFIED results: 1st/A 2027-02-01, 2nd/C 2026-11-01, 3rd/B 2026-08-15, 1st/C 2026-03-01 (exactly 365 days before anchor), 2nd/A 2026-02-28 (366 days, outside)"
            - "logical clock set to 2027-03-01T00:00:00Z before offers are created"
          setup_api_calls:
            - call: "POST /api/governing-bodies"
              payload: { name: "US Rowing", sport_code: "ROWI", funding_budget_cents: 8000000, sport_science_pool_hours: 100 }
              as: CommitteeAdmin
              captures: { gb_id: $.data.id }
            - call: "POST /api/governing-bodies/${gb_id}/certification-cycles"
              payload: { window_start: "2026-09-01T00:00:00Z", window_end: "2026-12-01T00:00:00Z" }
              as: CommitteeAdmin
              captures: { cyc_id: $.data.id }
            - call: "POST /api/certification-cycles/${cyc_id}/transitions"
              payload: { to_state: "OPEN" }
              as: CertificationAuditor
              as_user_id: "aud-1"
            - call: "POST /api/certification-cycles/${cyc_id}/transitions"
              payload: { to_state: "FINDINGS_ISSUED", governance_score: 90, athlete_rep_score: 88, financial_score: 92 }
              as: CertificationAuditor
              as_user_id: "aud-1"
            - call: "POST /api/certification-cycles/${cyc_id}/transitions"
              payload: { to_state: "CLOSED_PASSED" }
              as: CertificationAuditor
              as_user_id: "aud-2"
            - call: "POST /api/athletes"
              payload: { governing_body_id: "${gb_id}", full_name: "Pat Lane", date_of_birth: "1998-05-05", team_sport: false }
              as: CommitteeAdmin
              captures: { p_id: $.data.id }
            - call: "POST /api/athletes/${p_id}/transitions"
              payload: { to_state: "SCREENING_CLEARED" }
              as: SafeSportOfficer
            - call: "POST /api/athletes/${p_id}/transitions"
              payload: { to_state: "TRAINING_CURRENT" }
              as: SafeSportOfficer
            - call: "POST /api/athletes/${p_id}/transitions"
              payload: { to_state: "ELIGIBLE" }
              as: SafeSportOfficer
            - call: "POST /api/athletes/${p_id}/results"
              payload: { event_name: "Winter Nationals", event_grade: "A", placing: 1, event_date: "2027-02-01T00:00:00Z" }
              as: Athlete
              as_user_id: "${p_id}"
              captures: { p_r1: $.data.id }
            - call: "POST /api/results/${p_r1}/transitions"
              payload: { to_state: "VERIFIED" }
