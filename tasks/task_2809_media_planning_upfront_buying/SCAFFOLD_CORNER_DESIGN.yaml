# §1.9 Scaffold Corner Design - breadth coverage index for
# task_2809_media_planning_upfront_buying. One walk of
# references/claim-extraction-guide.md against SCAFFOLD.yaml §1.1-§1.7: every
# instance below grounds in elements already declared there, and every
# setup_api_calls chain is composable from §1.5 starting from an empty database.
# Corners already asserted by SCAFFOLD_DIFFICULTY_DESIGN.yaml appear as
# excluded_because stubs with no test_recipe.
#
# Shared fixture conventions (identical to §1.8):
#   * the logical clock starts at its declared default 2026-08-01T00:00:00Z and
#     is only ever moved forward with POST /_clock/set_current_utc
#   * opaque agency identities are pinned as "planner-01", "buyer-01",
#     "controller-01" and "controller-02"
#   * entity_backed roles always send as_user_id equal to the owning
#     Seller.id / Advertiser.id
#   * the recurring base fixture is: one BEVERAGE advertiser, one seller, one
#     APPROVED 2026Q4 campaign (10,000,000 cent budget, single 100.00 percent
#     LINEAR_TV allocation), one PUBLISHED 10,000,000 impression PRIME avail at
#     2200 cents, and a buy guaranteeing 1,000,000 impressions at 2200 cents
#     (net 2,200,000 / commission rate 0.0700 / commission 154,000 /
#     gross 2,354,000)
scaffold_corner_design:
  - section: entities
    instances:
      - name: advertiser_creation_returns_envelope_and_declared_fields
        claim_type: Creation
        grounds:
          - entities.Advertiser
          - endpoints[POST /upfront/advertisers]
          - response_envelope.success
        distinguishing_aspect: |
          A creation response must carry the §1.0 success envelope (meta.api_request_id,
          meta.api_request_timestamp, response_type object) around a data object whose
          system fields are server-initialised - credit_status ACTIVE, late_payment_count
          0, outstanding_receivable_cents 0 and version 1 - not echoes of the request.
        test_recipe:
          setup:
            - "an empty database; no other row of any kind exists"
          setup_api_calls: []
          trigger:
            - call: "POST /upfront/advertisers"
              payload: { name: "Northwind Retail", category_code: "RETAIL", credit_limit_cents: 250000000, payment_terms_days: 45, sequential_liability_enabled: false }
              as: AgencyController
              as_user_id: "controller-01"
              captures: { adv_id: $.data.id }
          assert:
            - "the response status is 201 and response_type == 'object'"
            - "meta.api_request_id is present and meta.api_request_timestamp is an ISO-8601 UTC instant"
            - "data.name == 'Northwind Retail' and data.category_code == 'RETAIL'"
            - "data.credit_limit_cents == 250000000 and data.payment_terms_days == 45"
            - "data.sequential_liability_enabled == false"
            - "data.credit_status == 'ACTIVE' and data.late_payment_count == 0"
            - "data.outstanding_receivable_cents == 0"
            - "data.version == 1 and data.created_at == data.updated_at"
            - "data.id is a bare UUID with no type prefix"
      - name: campaign_retrieval_returns_the_stored_plan_objective
        claim_type: Retrieval
        grounds:
          - entities.Campaign
          - endpoints[GET /upfront/campaigns/{campaignId}]
        distinguishing_aspect: |
          A fresh campaign must read back its stored objective inputs AND the initialised
          rollups declared in §1.1: unallocated_budget_cents and uncommitted_budget_cents
          both equal total_budget_cents while allocated_budget_cents, committed_gross_cents
          and planned_impressions_total are 0 - a read that returns nulls for the computed
          fields fails.
        test_recipe:
          setup:
            - "one BEVERAGE advertiser and one campaign with a 10,000,000 cent budget and no allocations"
          setup_api_calls:
            - call: "POST /upfront/advertisers"
              payload: { name: "Cascadia Beverage", category_code: "BEVERAGE", credit_limit_cents: 500000000, payment_terms_days: 30, sequential_liability_enabled: true }
              as: AgencyController
              as_user_id: "controller-01"
              captures: { adv_id: $.data.id }
            - call: "POST /upfront/campaigns"
              payload: { advertiser_id: "${adv_id}", name: "Q4 Linear Base", target_demo: "A25-54", universe_thousands: 120000, reach_goal_pct: 60.0, frequency_goal: 4.0, total_budget_cents: 10000000, flight_start: "2026-11-01T00:00:00Z", flight_end: "2026-12-31T23:59:59Z", fiscal_quarter: "2026Q4" }
              as: AgencyPlanner
              as_user_id: "planner-01"
              captures: { c_id: $.data.id }
          trigger:
            - call: "GET /upfront/campaigns/${c_id}"
              payload: {}
              as: AgencyPlanner
              as_user_id: "planner-01"
          assert:
            - "the response status is 200 and response_type == 'object'"
            - "data.advertiser_id == ${adv_id} and data.target_demo == 'A25-54'"
            - "data.universe_thousands == 120000 and data.reach_goal_pct == 60.0 and data.frequency_goal == 4.0"
            - "data.total_budget_cents == 10000000 and data.fiscal_quarter == '2026Q4'"
            - "data.plan_status == 'DRAFT' and data.funding_status == 'UNFUNDED' and data.plan_posture == 'WITHIN_PLAN'"
            - "data.funded_cents == 0 and data.allocated_budget_cents == 0"
            - "data.unallocated_budget_cents == 10000000 and data.uncommitted_budget_cents == 10000000"
            - "data.committed_gross_cents == 0 and data.planned_impressions_total == 0 and data.planned_grp_total == 0.00"
            - "data.version == 1"

      - name: campaign_listing_paginates_with_total_count_and_has_more
        claim_type: Listing
        grounds:
          - endpoints[GET /upfront/campaigns]
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
        distinguishing_aspect: |
          With three campaigns stored, limit=2 must return exactly 2 rows with
          total_count 3 and has_more true, and offset=2 must return the single remaining
          row with has_more false - total_count reports the unpaginated match count, not
          the page size.
        test_recipe:
          setup:
            - "one advertiser and three campaigns, all for that advertiser"
          setup_api_calls:
            - call: "POST /upfront/advertisers"
              payload: { name: "Cascadia Beverage", category_code: "BEVERAGE", credit_limit_cents: 500000000, payment_terms_days: 30, sequential_liability_enabled: true }
              as: AgencyController
              as_user_id: "controller-01"
              captures: { adv_id: $.data.id }
            - call: "POST /upfront/campaigns"
              payload: { advertiser_id: "${adv_id}", name: "Q4 Linear Base", target_demo: "A25-54", universe_thousands: 120000, reach_goal_pct: 60.0, frequency_goal: 4.0, total_budget_cents: 10000000, flight_start: "2026-11-01T00:00:00Z", flight_end: "2026-12-31T23:59:59Z", fiscal_quarter: "2026Q4" }
              as: AgencyPlanner
              as_user_id: "planner-01"
              captures: { c_id: $.data.id }
            - call: "POST /upfront/campaigns"
              payload: { advertiser_id: "${adv_id}", name: "Q1 Scatter Base", target_demo: "A18-49", universe_thousands: 100000, reach_goal_pct: 40.0, frequency_goal: 3.0, total_budget_cents: 20000000, flight_start: "2027-01-01T00:00:00Z", flight_end: "2027-03-31T23:59:59Z", fiscal_quarter: "2027Q1" }
              as: AgencyPlanner
              as_user_id: "planner-01"
              captures: { c2_id: $.data.id }
            - call: "POST /upfront/campaigns"
              payload: { advertiser_id: "${adv_id}", name: "Q2 Digital Base", target_demo: "A18-49", universe_thousands: 100000, reach_goal_pct: 35.0, frequency_goal: 3.0, total_budget_cents: 30000000, flight_start: "2027-04-01T00:00:00Z", flight_end: "2027-06-30T23:59:59Z", fiscal_quarter: "2027Q2" }
              as: AgencyPlanner
              as_user_id: "planner-01"
              captures: { c3_id: $.data.id }
          trigger:
            - call: "GET /upfront/campaigns?limit=2&offset=0"
              payload: {}
              as: AgencyPlanner
              as_user_id: "planner-01"
            - call: "GET /upfront/campaigns?limit=2&offset=2"
              payload: {}
              as: AgencyPlanner
              as_user_id: "planner-01"
          assert:
            - "the first response status is 200 and response_type == 'array'"
            - "the first response carries exactly 2 items with limit == 2, offset == 0, total_count == 3, has_more == true"
            - "the second response carries exactly 1 item with limit == 2, offset == 2, total_count == 3, has_more == false"
            - "the union of the two pages is exactly the three created campaign ids with no repeats"

      - name: buy_read_with_an_unknown_id_returns_buy_not_found
        claim_type: Not Found
        grounds:
          - endpoints[GET /upfront/buys/{buyId}]
          - errors.ERR_BUY_NOT_FOUND
          - validations[priority 4]
        distinguishing_aspect: |
          A syntactically valid UUID that resolves to no row must produce the buy-specific
          404 ERR_BUY_NOT_FOUND from §1.4 priority 4, not a generic 404 or an empty 200.
        test_recipe:
          setup:
            - "an empty database"
          setup_api_calls: []
          trigger:
            - call: "GET /upfront/buys/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: AgencyBuyer
              as_user_id: "buyer-01"
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 404 and response_type == 'error'"
            - "data.error_id == 'ERR_BUY_NOT_FOUND'"
            - "data.message is a non-empty string"

      - name: campaign_creation_without_target_demo_is_rejected
        claim_type: Required Fields
        grounds:
          - entities.Campaign.fields.target_demo
          - endpoints[POST /upfront/campaigns]
          - validations[priority 3]
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: |
          target_demo is source input with no default, so omitting it must fail at §1.4
          priority 3 with 400 ERR_INVALID_REQUEST rather than storing a null demo label
          that would silently break the FINAL delivery variant.
        test_recipe:
          setup:
            - "one advertiser exists so the FK in the rejected request would otherwise resolve"
          setup_api_calls:
            - call: "POST /upfront/advertisers"
              payload: { name: "Cascadia Beverage", category_code: "BEVERAGE", credit_limit_cents: 500000000, payment_terms_days: 30, sequential_liability_enabled: true }
              as: AgencyController
              as_user_id: "controller-01"
              captures: { adv_id: $.data.id }
          trigger:
            - call: "POST /upfront/campaigns"
              payload: { advertiser_id: "${adv_id}", name: "No Demo", universe_thousands: 120000, reach_goal_pct: 60.0, frequency_goal: 4.0, total_budget_cents: 10000000, flight_start: "2026-11-01T00:00:00Z", flight_end: "2026-12-31T23:59:59Z", fiscal_quarter: "2026Q4" }
              as: AgencyPlanner
              as_user_id: "planner-01"
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 400 and data.error_id == 'ERR_INVALID_REQUEST'"
            - "GET /upfront/campaigns returns total_count == 0 - nothing was stored"

      - name: defaults_apply_when_optional_inputs_are_omitted
        claim_type: Defaults
        grounds:
          - entities.Advertiser.fields.payment_terms_days
          - entities.Advertiser.fields.sequential_liability_enabled
          - entities.InventoryForecast.fields.exclusivity_mode
          - entities.Negotiation.fields.guarantee_pct
          - entities.Negotiation.fields.make_good_provision
          - entities.Negotiation.fields.option_pct_ceiling
        distinguishing_aspect: |
          Three different entities carry declared defaults on optional inputs; omitting
          payment_terms_days, sequential_liability_enabled, exclusivity_mode,
          guarantee_pct, make_good_provision and option_pct_ceiling must yield 30, true,
          SHARED, 100, MAKE_GOOD_UNITS and 25 - never null and never 0.
        test_recipe:
          setup:
            - "an advertiser, a seller, a campaign with one allocation, and an avail, each created with every optional input omitted"
          setup_api_calls:
            - call: "POST /upfront/advertisers"
              payload: { name: "Default Terms Co", category_code: "TELECOM", credit_limit_cents: 100000000 }
              as: AgencyController
              as_user_id: "controller-01"
              captures: { adv_id: $.data.id }
            - call: "POST /upfront/sellers"
              payload: { name: "Harbor Broadcasting", platform_types: ["LINEAR", "CTV", "DIGITAL"], make_good_capacity_impressions: 50000000 }
              as: AgencyController
              as_user_id: "controller-01"
              captures: { sel_id: $.data.id }
            - call: "POST /upfront/campaigns"
              payload: { advertiser_id: "${adv_id}", name: "Q4 Linear Base", target_demo: "A25-54", universe_thousands: 120000, reach_goal_pct: 60.0, frequency_goal: 4.0, total_budget_cents: 10000000, flight_start: "2026-11-01T00:00:00Z", flight_end: "2026-12-31T23:59:59Z", fiscal_quarter: "2026Q4" }
              as: AgencyPlanner
              as_user_id: "planner-01"
              captures: { c_id: $.data.id }
            - call: "POST /upfront/channel-allocations"
              payload: { campaign_id: "${c_id}", channel: "LINEAR_TV", allocation_pct: 100.00, planned_cpm_cents: 2000, planned_market: "UPFRONT", primary_daypart: "PRIME" }
              as: AgencyPlanner
              as_user_id: "planner-01"
              captures: { al_id: $.data.id }
            - call: "POST /upfront/inventory-forecasts"
              payload: { seller_id: "${sel_id}", market: "UPFRONT", fiscal_quarter: "2026Q4", daypart: "PRIME", program: "Harbor Nightly", platform: "LINEAR", window_start: "2026-11-01T00:00:00Z", window_end: "2026-12-31T23:59:59Z", total_impressions: 10000000, forecast_cpm_cents: 2200 }
              as: SellerRep
              as_user_id: "${sel_id}"
              captures: { f_id: $.data.id }
          trigger:
            - call: "POST /upfront/negotiations"
              payload: { campaign_id: "${c_id}", seller_id: "${sel_id}", channel_allocation_id: "${al_id}", market: "UPFRONT", channel: "LINEAR_TV", requested_impressions: 1000000, opening_cpm_cents: 2000 }
              as: AgencyBuyer
              as_user_id: "buyer-01"
              captures: { n_id: $.data.id }
          assert:
            - "the negotiation response status is 201"
            - "data.guarantee_pct == 100 and data.make_good_provision == 'MAKE_GOOD_UNITS' and data.option_pct_ceiling == 25"
            - "Advertiser.${adv_id}.payment_terms_days == 30 and Advertiser.${adv_id}.sequential_liability_enabled == true"
            - "InventoryForecast.${f_id}.exclusivity_mode == 'SHARED'"

      - name: channel_allocation_computed_fields_derive_from_budget_and_band
        claim_type: Computed Fields
        grounds:
          - entities.ChannelAllocation.fields.allocated_cents
          - entities.ChannelAllocation.fields.effective_planned_cpm_cents
          - entities.ChannelAllocation.fields.planned_impressions
          - entities.ChannelAllocation.fields.planned_grp
          - entities.ChannelAllocation.fields.planned_frequency
          - calculations.planned_delivery_projection
        distinguishing_aspect: |
          Every money and delivery figure on a new allocation is derived, never supplied:
          100.00 percent of a 10,000,000 cent budget is 10,000,000 allocated cents, a 2000
          cent planned CPM at UPFRONT (1.00) and PRIME (1.20) becomes an effective 2400,
          and that yields exactly 4,166,666 planned impressions, 3.47 GRP and 0.06
          planned frequency - a reading that skips the daypart index would report 5,000,000
          impressions instead.
        test_recipe:
          setup:
            - "one advertiser and one DRAFT campaign with a 10,000,000 cent budget and a 120,000 thousand universe"
          setup_api_calls:
            - call: "POST /upfront/advertisers"
              payload: { name: "Cascadia Beverage", category_code: "BEVERAGE", credit_limit_cents: 500000000, payment_terms_days: 30, sequential_liability_enabled: true }
              as: AgencyController
              as_user_id: "controller-01"
              captures: { adv_id: $.data.id }
            - call: "POST /upfront/campaigns"
              payload: { advertiser_id: "${adv_id}", name: "Q4 Linear Base", target_demo: "A25-54", universe_thousands: 120000, reach_goal_pct: 60.0, frequency_goal: 4.0, total_budget_cents: 10000000, flight_start: "2026-11-01T00:00:00Z", flight_end: "2026-12-31T23:59:59Z", fiscal_quarter: "2026Q4" }
              as: AgencyPlanner
              as_user_id: "planner-01"
              captures: { c_id: $.data.id }
          trigger:
            - call: "POST /upfront/channel-allocations"
              payload: { campaign_id: "${c_id}", channel: "LINEAR_TV", allocation_pct: 100.00, planned_cpm_cents: 2000, planned_market: "UPFRONT", primary_daypart: "PRIME" }
              as: AgencyPlanner
              as_user_id: "planner-01"
              captures: { al_id: $.data.id }
            - call: "GET /upfront/campaigns/${c_id}"
              payload: {}
              as: AgencyPlanner
              as_user_id: "planner-01"
          assert:
            - "the allocation response status is 201"
            - "ChannelAllocation.${al_id}.allocated_cents == 10000000"
            - "ChannelAllocation.${al_id}.effective_planned_cpm_cents == 2400"
            - "ChannelAllocation.${al_id}.planned_impressions == 4166666"
            - "ChannelAllocation.${al_id}.planned_grp == 3.47"
            - "ChannelAllocation.${al_id}.planned_frequency == 0.06"
            - "ChannelAllocation.${al_id}.committed_cents == 0 and ChannelAllocation.${al_id}.posture == 'WITHIN_PLAN' and ChannelAllocation.${al_id}.status == 'DRAFT'"
            - "Campaign.${c_id}.allocated_budget_cents == 10000000 and Campaign.${c_id}.unallocated_budget_cents == 0"
            - "Campaign.${c_id}.planned_impressions_total == 4166666 and Campaign.${c_id}.planned_grp_total == 3.47"
            - "Campaign.${c_id}.version == 2"

      - name: seller_system_fields_are_server_minted
        claim_type: System Fields
        grounds:
          - entities.Seller
          - entities.Seller.fields.open_make_good_impressions
          - entities.Seller.fields.scheduled_make_good_impressions
          - endpoints[POST /upfront/sellers]
        distinguishing_aspect: |
          id, created_at, updated_at and version are minted by the server on a
          common_fields entity and both make-good exposure rollups start at 0 even though
          neither appears in the endpoint's input list.
        test_recipe:
          setup:
            - "an empty database"
          setup_api_calls: []
          trigger:
            - call: "POST /upfront/sellers"
              payload: { name: "Harbor Broadcasting", platform_types: ["LINEAR", "CTV", "DIGITAL"], make_good_capacity_impressions: 50000000 }
              as: AgencyController
              as_user_id: "controller-01"
              captures: { sel_id: $.data.id }
          assert:
            - "the response status is 201 and response_type == 'object'"
            - "data.name == 'Harbor Broadcasting' and data.platform_types == ['LINEAR', 'CTV', 'DIGITAL']"
            - "data.make_good_capacity_impressions == 50000000"
            - "data.open_make_good_impressions == 0 and data.scheduled_make_good_impressions == 0"
            - "data.version == 1 and data.created_at == data.updated_at"
            - "data.id is a bare UUID with no type prefix"

      - name: forecast_creation_with_an_undeclared_platform_is_rejected
        claim_type: Type Constraints
        grounds:
          - entities.InventoryForecast.fields.platform
          - validations[priority 3]
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: |
          platform is a closed enum of LINEAR, CTV, DIGITAL, AUDIO; SATELLITE must be
          refused at §1.4 priority 3 with 400 ERR_INVALID_REQUEST before any avail row is
          written, so the seller's forecast list stays empty.
        test_recipe:
          setup:
            - "one seller exists"
          setup_api_calls:
            - call: "POST /upfront/sellers"
              payload: { name: "Harbor Broadcasting", platform_types: ["LINEAR", "CTV", "DIGITAL"], make_good_capacity_impressions: 50000000 }
              as: AgencyController
              as_user_id: "controller-01"
              captures: { sel_id: $.data.id }
          trigger:
            - call: "POST /upfront/inventory-forecasts"
              payload: { seller_id: "${sel_id}", market: "UPFRONT", fiscal_quarter: "2026Q4", daypart: "PRIME", program: "Harbor Nightly", platform: "SATELLITE", window_start: "2026-11-01T00:00:00Z", window_end: "2026-12-31T23:59:59Z", total_impressions: 10000000, forecast_cpm_cents: 2200 }
              as: SellerRep
              as_user_id: "${sel_id}"
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 400 and data.error_id == 'ERR_INVALID_REQUEST'"
            - "GET /upfront/inventory-forecasts?seller_id=${sel_id} returns total_count == 0"

      - name: rights_exercise_row_is_immutable_and_carries_no_version
        claim_type: Immutability
        grounds:
          - entities.RightsExercise
          - endpoints[POST /upfront/rights-exercises]
          - endpoints[GET /upfront/rights-exercises/{rightsExerciseId}]
        distinguishing_aspect: |
          RightsExercise is declared common_fields false, so the append-only record exposes
          id and created_at but no version and no updated_at, and there is no endpoint that
          can change it; the mutable consequences land on the Buy instead
          (guaranteed_impressions 1,100,000 and gross_cost_cents 2,589,400).
        test_recipe:
          setup:
            - "the base fixture through negotiation acceptance: a PENDING_PLACEMENT buy guaranteeing 1,000,000 impressions at 2200 cents with option_pct_ceiling 25"
            - "the logical clock is still 2026-08-01T00:00:00Z, well before the option window close of 2026-09-17T00:00:00Z"
          setup_api_calls:
            - call: "POST /upfront/advertisers"
              payload: { name: "Cascadia Beverage", category_code: "BEVERAGE", credit_limit_cents: 500000000, payment_terms_days: 30, sequential_liability_enabled: true }
              as: AgencyController
              as_user_id: "controller-01"
              captures: { adv_id: $.data.id }
            - call: "POST /upfront/sellers"
              payload: { name: "Harbor Broadcasting", platform_types: ["LINEAR", "CTV", "DIGITAL"], make_good_capacity_impressions: 50000000 }
              as: AgencyController
              as_user_id: "controller-01"
              captures: { sel_id: $.data.id }
            - call: "POST /upfront/campaigns"
              payload: { advertiser_id: "${adv_id}", name: "Q4 Linear Base", target_demo: "A25-54", universe_thousands: 120000, reach_goal_pct: 60.0, frequency_goal: 4.0, total_budget_cents: 10000000, flight_start: "2026-11-01T00:00:00Z", flight_end: "2026-12-31T23:59:59Z", fiscal_quarter: "2026Q4" }
              as: AgencyPlanner
              as_user_id: "planner-01"
              captures: { c_id: $.data.id }
            - call: "POST /upfront/channel-allocations"
              payload: { campaign_id: "${c_id}", channel: "LINEAR_TV", allocation_pct: 100.00, planned_cpm_cents: 2000, planned_market: "UPFRONT", primary_daypart: "PRIME" }
              as: AgencyPlanner
              as_user_id: "planner-01"
              captures: { al_id: $.data.id }
            - call: "POST /upfront/campaigns/${c_id}/submit-plan"
              payload: {}
              as: AgencyPlanner
              as_user_id: "planner-01"
            - call: "POST /upfront/campaigns/${c_id}/approve-plan"
              payload: {}
              as: AdvertiserClient
              as_user_id: "${adv_id}"
            - call: "POST /upfront/inventory-forecasts"
              payload: { seller_id: "${sel_id}", market: "UPFRONT", fiscal_quarter: "2026Q4", daypart: "PRIME", program: "Harbor Nightly", platform: "LINEAR", window_start: "2026-11-01T00:00:00Z", window_end: "2026-12-31T23:59:59Z", total_impressions: 10000000, forecast_cpm_cents: 2200, exclusivity_mode: "SHARED" }
              as: SellerRep
              as_user_id: "${sel_id}"
              captures: { f_id: $.data.id }
            - call: "POST /upfront/inventory-forecasts/${f_id}/publish"
              payload: {}
              as: SellerRep
              as_user_id: "${sel_id}"
            - call: "POST /upfront/negotiations"
              payload: { campaign_id: "${c_id}", seller_id: "${sel_id}", channel_allocation_id: "${al_id}", market: "UPFRONT", channel: "LINEAR_TV", requested_impressions: 1000000, opening_cpm_cents: 2000, guarantee_pct: 100, make_good_provision: "MAKE_GOOD_UNITS", option_pct_ceiling: 25 }
              as: AgencyBuyer
              as_user_id: "buyer-01"
              captures: { n_id: $.data.id, n_v1: $.data.version }
