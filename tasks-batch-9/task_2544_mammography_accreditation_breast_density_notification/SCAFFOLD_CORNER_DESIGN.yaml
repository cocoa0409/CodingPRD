# =============================================================================
# §1.9 Scaffold Corner Design — mammography-accreditation-density-notification
#
# Breadth probe over §1.1–§1.7, walked section-by-section against
# references/claim-extraction-guide.md. §1.8 (SCAFFOLD_DIFFICULTY_DESIGN.yaml)
# is the depth probe; anything the guide's tables surface that §1.8 already
# nails is emitted here as an `excluded_because:` stub naming the covering
# §1.8 instance.
#
# Fixture conventions (identical to §1.8 so the two files compose):
#   * The logical clock is pinned to 2026-08-01T00:00:00Z as the first call of
#     every instance; every other instant is written as a literal relative to it.
#   * CT policy — STATE_ENHANCED_ALL, reading-grade ceiling 10, lay-summary
#     deadline 21 days, COVERAGE_NO_COST_SHARING, waiver 5000 cents,
#     followup 60 / report 30 / urgent 7 / ce_grace 90 days.
#   * MA policy — STATE_DENSE_ONLY, grade 6, deadline 14 days,
#     COVERAGE_WITH_COST_SHARING, waiver 5000 cents, same day counts.
#   * RI policy — identical to MA except waiver 15000 cents; used only where a
#     de-minimis patient share has to be absorbed by the facility.
#   * NV policy — FEDERAL_ONLY, grade 8, deadline 30 days, mandate NONE; used
#     only where the state imposes no supplemental-coverage requirement.
#   * Opaque-role actors use the stable ids "coord-1" (AccreditationCoordinator),
#     "qa-1" (QualityAssuranceOfficer), "reviewer-1" (AccreditationBodyReviewer)
#     and "inspector-1" (FdaInspector); entity-backed roles pass the captured
#     Personnel id as as_user_id.
#   * Base staff are QUALIFIED at creation: physicist 25h/3 exams (>= 20/1),
#     technologist 45h/30 exams (>= 40/25), radiologist 65h/260 exams (>= 60/240).
#   * A freshly created single-unit facility sits at compliance_posture
#     CONDITIONAL because MammographyUnit.survey_compliance defaults to OVERDUE.
#   * YAML anchors are declared on their first use and aliased afterwards.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:

      - name: state_policy_creation_echoes_every_declared_field
        claim_type: creation
        grounds:
          - entities.StatePolicy.fields.state_code
          - entities.StatePolicy.fields.density_notice_rule
          - entities.StatePolicy.fields.supplemental_coverage_mandate
        distinguishing_aspect: "POST /state-policies with every optional field supplied returns 201 and echoes all eleven input fields plus the system id/created_at/updated_at/version, with no field silently coerced."
        test_recipe:
          setup:
            - "Empty database; the logical clock is pinned to 2026-08-01T00:00:00Z."
          setup_api_calls:
            - &c_clock
              call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: AccreditationCoordinator
              as_user_id: "coord-1"
          trigger:
            - call: "POST /state-policies"
              payload: { state_code: "CT", density_notice_rule: "STATE_ENHANCED_ALL", lay_summary_max_reading_grade: 10, lay_summary_deadline_days: 21, supplemental_coverage_mandate: "COVERAGE_NO_COST_SHARING", required_notice_codes: ["CT-DENS-1", "CT-SUPP-2"], supplemental_cost_share_waiver_threshold_cents: 5000, followup_grace_days: 60, report_turnaround_days: 30, urgent_report_turnaround_days: 7, ce_grace_days: 90 }
              as: AccreditationBodyReviewer
              as_user_id: "reviewer-1"
              captures: { cr_pol_id: $.data.id }
          assert:
            - "HTTP status == 201"
            - "StatePolicy.${cr_pol_id}.state_code == \"CT\" and density_notice_rule == STATE_ENHANCED_ALL"
            - "StatePolicy.${cr_pol_id}.lay_summary_max_reading_grade == 10 and lay_summary_deadline_days == 21"
            - "StatePolicy.${cr_pol_id}.supplemental_coverage_mandate == COVERAGE_NO_COST_SHARING"
            - "StatePolicy.${cr_pol_id}.required_notice_codes == [\"CT-DENS-1\", \"CT-SUPP-2\"] in declared order"
            - "StatePolicy.${cr_pol_id}.supplemental_cost_share_waiver_threshold_cents == 5000"
            - "StatePolicy.${cr_pol_id}.followup_grace_days == 60, report_turnaround_days == 30, urgent_report_turnaround_days == 7, ce_grace_days == 90"
            - "StatePolicy.${cr_pol_id}.version == 1 and id, created_at, updated_at are all non-null"
            - "The response envelope carries meta.api_request_id, meta.api_request_timestamp and response_type == \"object\""

      - name: facility_and_audit_cycle_defaults_applied_when_optional_inputs_are_omitted
        claim_type: defaults
        grounds:
          - entities.Facility.fields.supplemental_concurrent_capacity
          - entities.Facility.fields.compliance_posture
          - entities.RadiologistAuditCycle.fields.followup_window_days
        distinguishing_aspect: "Omitting supplemental_concurrent_capacity yields the declared default 2 (not null and not 1), and omitting followup_window_days on an audit cycle yields 365; a facility with no units is COMPLIANT, so the CONDITIONAL posture of later instances is provably unit-driven."
        test_recipe:
          setup:
            - "Clock pinned to 2026-08-01T00:00:00Z; a CT policy exists."
            - "A facility created WITHOUT supplemental_concurrent_capacity and with no units at all."
            - "One INTERPRETING_PHYSICIAN at that facility."
          setup_api_calls:
            - *c_clock
            - &c_pol_ct
              call: "POST /state-policies"
              payload: { state_code: "CT", density_notice_rule: "STATE_ENHANCED_ALL", lay_summary_max_reading_grade: 10, lay_summary_deadline_days: 21, supplemental_coverage_mandate: "COVERAGE_NO_COST_SHARING", required_notice_codes: ["CT-DENS-1", "CT-SUPP-2"], supplemental_cost_share_waiver_threshold_cents: 5000, followup_grace_days: 60, report_turnaround_days: 30, urgent_report_turnaround_days: 7, ce_grace_days: 90 }
              as: AccreditationBodyReviewer
              as_user_id: "reviewer-1"
              captures: { pol_ct_id: $.data.id }
            - call: "POST /facilities"
              payload: { name: "Default Harbor Imaging", state_policy_id: "${pol_ct_id}", accreditation_body: "ACR" }
              as: AccreditationCoordinator
              as_user_id: "coord-1"
              captures: { def_fac_id: $.data.id }
            - &c_rad_named
              call: "POST /facilities/${def_fac_id}/personnel"
              payload: { full_name: "Rosa Radiologist", role_type: "INTERPRETING_PHYSICIAN", initial_qualification_on: "2024-03-01T00:00:00Z", initial_training_hours: 65, initial_read_volume: 260, modality_certifications: ["DM_2D", "DBT_3D"] }
              as: AccreditationCoordinator
              as_user_id: "coord-1"
              captures: { def_rad_id: $.data.id }
          trigger:
            - call: "POST /personnel/${def_rad_id}/audit-cycles"
              payload: { period_start: "2026-01-01T00:00:00Z", period_end: "2026-07-01T00:00:00Z" }
              as: QualityAssuranceOfficer
              as_user_id: "qa-1"
              captures: { def_cyc_id: $.data.id }
          assert:
            - "Facility.${def_fac_id}.supplemental_concurrent_capacity == 2"
            - "Facility.${def_fac_id}.compliance_posture == COMPLIANT (no units, no inspections, no deficient staff)"
            - "Facility.${def_fac_id}.total_funded_cents == 0, prepaid_credit_cents == 0, fee_held_cents == 0, fee_consumed_cents == 0"
            - "Facility.${def_fac_id}.open_notice_obligations == 0 and last_compliance_run_at == null"
            - "RadiologistAuditCycle.${def_cyc_id}.followup_window_days == 365"
            - "RadiologistAuditCycle.${def_cyc_id}.status == OPEN and variant_at_close == null"
            - "RadiologistAuditCycle.${def_cyc_id}.screening_exam_count == null and recall_rate_pct == null and ppv_pct == null (metrics stay null until the cycle is closed)"

      - name: unit_retrieval_returns_the_stored_row_and_its_system_fields
        claim_type: retrieval
        grounds:
          - entities.MammographyUnit.fields.model_serial
          - entities.MammographyUnit.fields.accreditation_status
          - entities.MammographyUnit.fields.survey_compliance
        distinguishing_aspect: "GET /units/{id} returns exactly the values POST /facilities/{id}/units stored, with server-generated id/created_at/updated_at/version and no client control over accreditation_status."
        test_recipe:
          setup:
            - "Clock pinned to 2026-08-01T00:00:00Z; CT policy; one facility; one DBT_3D unit."
          setup_api_calls:
            - *c_clock
            - *c_pol_ct
            - &c_fac
              call: "POST /facilities"
              payload: { name: "Harbor Breast Center", state_policy_id: "${pol_ct_id}", accreditation_body: "ACR", supplemental_concurrent_capacity: 2 }
              as: AccreditationCoordinator
              as_user_id: "coord-1"
              captures: { fac_id: $.data.id }
            - &c_unit
              call: "POST /facilities/${fac_id}/units"
              payload: { manufacturer: "Hologic", model_serial: "SEL-9001", modality: "DBT_3D", accreditation_expires_on: "2027-06-30T00:00:00Z" }
              as: AccreditationCoordinator
              as_user_id: "coord-1"
              captures: { unit_id: $.data.id }
          trigger:
            - call: "GET /units/${unit_id}"
              payload: {}
              as: FdaInspector
              as_user_id: "inspector-1"
          assert:
            - "HTTP status == 200"
            - "MammographyUnit.${unit_id}.facility_id == ${fac_id} and manufacturer == \"Hologic\" and model_serial == \"SEL-9001\""
            - "MammographyUnit.${unit_id}.modality == DBT_3D and accreditation_expires_on == \"2027-06-30T00:00:00Z\""
            - "MammographyUnit.${unit_id}.accreditation_status == PROVISIONAL and operational_state == IN_SERVICE"
            - "MammographyUnit.${unit_id}.survey_compliance == OVERDUE and reaccreditation_attempts_remaining == 3"
            - "MammographyUnit.${unit_id}.version == 1, id non-null, created_at == \"2026-08-01T00:00:00Z\""

      - name: exam_listing_paginates_with_total_count_and_has_more
        claim_type: listing
        grounds:
          - entities.Exam.fields.report_status
          - entities.Facility.fields.compliance_posture
        distinguishing_aspect: "GET /exams with limit 2 and offset 0 over three exams returns 2 rows with total_count 3 and has_more true; offset 2 returns the final row with has_more false, and the report_status filter narrows the same list to the interpreted subset."
        test_recipe:
          setup:
            - "Clock pinned to 2026-08-01T00:00:00Z; CT policy; one facility; one DBT_3D unit; qualified staff."
            - "Three SCREENING exams on that unit, of which the first two are interpreted and the third is left AWAITING_INTERPRETATION."
          setup_api_calls:
            - *c_clock
            - *c_pol_ct
            - *c_fac
            - *c_unit
            - &c_phys
              call: "POST /facilities/${fac_id}/personnel"
              payload: { full_name: "Pia Physicist", role_type: "MEDICAL_PHYSICIST", initial_qualification_on: "2024-01-15T00:00:00Z", initial_training_hours: 25, initial_read_volume: 3, modality_certifications: ["DM_2D", "DBT_3D"] }
              as: AccreditationCoordinator
              as_user_id: "coord-1"
              captures: { phys_id: $.data.id }
            - &c_tech
              call: "POST /facilities/${fac_id}/personnel"
              payload: { full_name: "Tomas Tech", role_type: "TECHNOLOGIST", initial_qualification_on: "2024-02-01T00:00:00Z", initial_training_hours: 45, initial_read_volume: 30, modality_certifications: ["DM_2D", "DBT_3D"] }
              as: AccreditationCoordinator
              as_user_id: "coord-1"
              captures: { tech_id: $.data.id }
            - &c_rad
              call: "POST /facilities/${fac_id}/personnel"
              payload: { full_name: "Rosa Radiologist", role_type: "INTERPRETING_PHYSICIAN", initial_qualification_on: "2024-03-01T00:00:00Z", initial_training_hours: 65, initial_read_volume: 260, modality_certifications: ["DM_2D", "DBT_3D"] }
              as: AccreditationCoordinator
              as_user_id: "coord-1"
              captures: { rad_id: $.data.id }
            - call: "POST /exams"
              payload: { unit_id: "${unit_id}", technologist_id: "${tech_id}", patient_ref: "PT-1001", patient_state_code: "CT", exam_type: "SCREENING", performed_at: "2026-07-20T00:00:00Z", original_image_count: 4 }
              as: Technologist
              as_user_id: "${tech_id}"
              captures: { pg_e1_id: $.data.id }
            - call: "POST /exams/${pg_e1_id}/interpret"
              payload: { birads_assessment: 1, density_category: "B" }
              as: InterpretingPhysician
              as_user_id: "${rad_id}"
            - call: "POST /exams"
              payload: { unit_id: "${unit_id}", technologist_id: "${tech_id}", patient_ref: "PT-1002", patient_state_code: "CT", exam_type: "SCREENING", performed_at: "2026-07-21T00:00:00Z", original_image_count: 4 }
              as: Technologist
              as_user_id: "${tech_id}"
              captures: { pg_e2_id: $.data.id }
            - call: "POST /exams/${pg_e2_id}/interpret"
              payload: { birads_assessment: 2, density_category: "C" }
              as: InterpretingPhysician
              as_user_id: "${rad_id}"
            - call: "POST /exams"
              payload: { unit_id: "${unit_id}", technologist_id: "${tech_id}", patient_ref: "PT-1003", patient_state_code: "CT", exam_type: "SCREENING", performed_at: "2026-07-22T00:00:00Z", original_image_count: 4 }
              as: Technologist
              as_user_id: "${tech_id}"
              captures: { pg_e3_id: $.data.id }
          trigger:
            - call: "GET /exams"
              payload: { unit_id: "${unit_id}", limit: 2, offset: 0 }
              as: AccreditationCoordinator
              as_user_id: "coord-1"
            - call: "GET /exams"
              payload: { unit_id: "${unit_id}", limit: 2, offset: 2 }
              as: AccreditationCoordinator
              as_user_id: "coord-1"
            - call: "GET /exams"
              payload: { unit_id: "${unit_id}", report_status: "AWAITING_INTERPRETATION" }
              as: AccreditationCoordinator
              as_user_id: "coord-1"
          assert:
            - "First page — response_type == \"array\", 2 rows returned, total_count == 3, has_more == true, limit == 2, offset == 0"
            - "Second page — 1 row returned, total_count == 3, has_more == false, offset == 2"
            - "Filtered read — 1 row returned whose id == ${pg_e3_id}, total_count == 1, has_more == false"
            - "The two pages together contain ${pg_e1_id}, ${pg_e2_id} and ${pg_e3_id} exactly once each"

      - name: get_unit_with_an_unknown_id_returns_not_found
        claim_type: not_found
        grounds:
          - validations[priority=10]
          - errors[ERR_UNIT_NOT_FOUND]
        distinguishing_aspect: "A GET against a syntactically valid but unpersisted unit id returns 404 ERR_UNIT_NOT_FOUND, not 200 with a null body and not ERR_FACILITY_NOT_FOUND."
        test_recipe:
          setup:
            - "Clock pinned to 2026-08-01T00:00:00Z; CT policy; one facility; one unit that is NOT the id being requested."
          setup_api_calls:
            - *c_clock
            - *c_pol_ct
            - *c_fac
            - *c_unit
          trigger:
            - call: "GET /units/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: AccreditationCoordinator
              as_user_id: "coord-1"
              captures: { nf_err: $.data.error_id }
          assert:
            - "HTTP status == 404"
            - "error_id == \"ERR_UNIT_NOT_FOUND\""
            - "GET /facilities/${fac_id}/units still returns total_count == 1"

      - name: exam_creation_missing_required_patient_state_code_is_rejected
        claim_type: required_fields
        grounds:
          - validations[priority=20]
          - errors[ERR_INVALID_REQUEST]
          - entities.Exam.fields.patient_state_code
        distinguishing_aspect: "Omitting the required patient_state_code returns 400 ERR_INVALID_REQUEST and creates no Exam row; the field has source input with no default, so it cannot be silently backfilled from the facility's home state."
        test_recipe:
          setup:
            - "Clock pinned to 2026-08-01T00:00:00Z; CT policy; one facility; one DBT_3D unit; qualified staff."
          setup_api_calls:
            - *c_clock
            - *c_pol_ct
            - *c_fac
            - *c_unit
            - *c_phys
            - *c_tech
            - *c_rad
          trigger:
            - call: "POST /exams"
              payload: { unit_id: "${unit_id}", technologist_id: "${tech_id}", patient_ref: "PT-1101", exam_type: "SCREENING", performed_at: "2026-07-20T00:00:00Z", original_image_count: 4 }
              as: Technologist
              as_user_id: "${tech_id}"
              captures: { req_err: $.data.error_id }
          assert:
            - "HTTP status == 400"
            - "error_id == \"ERR_INVALID_REQUEST\""
            - "GET /exams?unit_id=${unit_id} returns total_count == 0"
            - "MammographyUnit.${unit_id}.total_images_acquired == 0"

      - name: unit_modality_rejects_an_unknown_enum_value_and_a_bad_state_code_is_rejected
        claim_type: type_constraints
        grounds:
          - validations[priority=20]
          - errors[ERR_INVALID_REQUEST]
          - entities.MammographyUnit.fields.modality
          - entities.StatePolicy.fields.state_code
        distinguishing_aspect: "modality accepts only DM_2D or DBT_3D — the near-miss value \"DBT\" is refused with 400 — and state_code must be exactly two uppercase letters, so \"Ct\" is refused; both refusals persist nothing."
        test_recipe:
          setup:
            - "Clock pinned to 2026-08-01T00:00:00Z; CT policy; one facility with no units."
          setup_api_calls:
            - *c_clock
            - *c_pol_ct
            - *c_fac
          trigger:
            - call: "POST /facilities/${fac_id}/units"
              payload: { manufacturer: "Hologic", model_serial: "SEL-BAD", modality: "DBT", accreditation_expires_on: "2027-06-30T00:00:00Z" }
              as: AccreditationCoordinator
              as_user_id: "coord-1"
              captures: { enum_err: $.data.error_id }
            - call: "POST /state-policies"
              payload: { state_code: "Ct", density_notice_rule: "FEDERAL_ONLY", lay_summary_max_reading_grade: 8, lay_summary_deadline_days: 30, supplemental_coverage_mandate: "NONE" }
              as: AccreditationBodyReviewer
              as_user_id: "reviewer-1"
              captures: { code_err: $.data.error_id }
          assert:
            - "Both calls — HTTP status == 400 and error_id == \"ERR_INVALID_REQUEST\""
            - "GET /facilities/${fac_id}/units returns total_count == 0"
            - "GET /state-policies/${pol_ct_id} still resolves and remains the only policy row"

      - name: qualification_credit_is_immutable_and_carries_no_version_field
        claim_type: immutability
        grounds:
          - entities.QualificationCredit.fields.credit_type
          - entities.QualificationCredit.fields.awarded_on
        distinguishing_aspect: "QualificationCredit is declared common_fields false: the create response and the sub-resource list expose personnel_id, credit_type, ce_hours, exam_count, modality, awarded_on and source_note but NO version and NO updated_at, and §1.5 declares no update or delete endpoint for it."
        test_recipe:
          setup:
            - "Clock pinned to 2026-08-01T00:00:00Z; CT policy; one facility; one DBT_3D unit; qualified staff."
          setup_api_calls:
            - *c_clock
            - *c_pol_ct
            - *c_fac
            - *c_unit
            - *c_phys
            - *c_tech
            - *c_rad
          trigger:
            - call: "POST /personnel/${tech_id}/credits"
              payload: { credit_type: "CATEGORY_1_CE", awarded_on: "2026-01-01T00:00:00Z", ce_hours: 15, source_note: "DBT refresher" }
              as: AccreditationCoordinator
              as_user_id: "coord-1"
              captures: { imm_credit_id: $.data.id }
            - call: "GET /personnel/${tech_id}/credits"
              payload: { credit_type: "CATEGORY_1_CE" }
              as: AccreditationCoordinator
              as_user_id: "coord-1"
          assert:
            - "HTTP status == 201 and QualificationCredit.${imm_credit_id}.personnel_id == ${tech_id}"
            - "QualificationCredit.${imm_credit_id}.credit_type == CATEGORY_1_CE, ce_hours == 15, awarded_on == \"2026-01-01T00:00:00Z\""
            - "QualificationCredit.${imm_credit_id}.exam_count == null and modality == null"
            - "The credit payload exposes no version field and no updated_at field"
            - "GET /personnel/${tech_id}/credits with credit_type CATEGORY_1_CE returns total_count == 1"
            - "GET /personnel/${tech_id}/credits with credit_type READ_VOLUME returns total_count == 0"

      - name: personnel_creation_under_an_unknown_facility_returns_not_found
        claim_type: parent_relationships
        grounds:
          - validations[priority=10]
          - errors[ERR_FACILITY_NOT_FOUND]
          - entities.Personnel.fields.facility_id
        distinguishing_aspect: "Personnel declares Facility as its parent, so a create under an unpersisted facility id returns 404 ERR_FACILITY_NOT_FOUND from the path check at priority 10 — never ERR_PERSONNEL_NOT_FOUND and never a 201 with a dangling facility_id."
        test_recipe:
          setup:
            - "Clock pinned to 2026-08-01T00:00:00Z; CT policy; one real facility that is NOT the id being addressed."
          setup_api_calls:
            - *c_clock
            - *c_pol_ct
            - *c_fac
          trigger:
            - call: "POST /facilities/00000000-0000-4000-8000-0000000000ff/personnel"
              payload: { full_name: "Nadia Nobody", role_type: "TECHNOLOGIST", initial_qualification_on: "2024-02-01T00:00:00Z", initial_training_hours: 45, initial_read_volume: 30 }
              as: AccreditationCoordinator
              as_user_id: "coord-1"
              captures: { parent_err: $.data.error_id }
          assert:
            - "HTTP status == 404"
            - "error_id == \"ERR_FACILITY_NOT_FOUND\""
            - "GET /facilities/${fac_id}/personnel returns total_count == 0 — nothing was attached to the real facility either"

      - name: one_exam_can_be_cited_by_two_successive_packets_many_to_many
        claim_type: parent_relationships
        grounds:
          - entities.ClinicalImageReviewSubmission.fields.exam_ids
          - state_machines.ClinicalImageReviewSubmission.status.SUBMITTED_to_WITHDRAWN
          - calculations.fee_escrow_ledger
        distinguishing_aspect: "entity_topology is graph: the exam_ids junction is many-to-many, so the same two exams may be cited by a withdrawn packet and then again by a fresh packet, and both submissions list both exam ids while each exam remains a single row."
        test_recipe:
          setup:
            - "Clock pinned to 2026-08-01T00:00:00Z; CT policy; funded facility (1000000 cents); one DBT_3D unit; qualified staff."
            - "Two interpreted exams on that unit."
            - "A first packet citing both exams is submitted and then withdrawn, restoring the escrow and the attempt."
          setup_api_calls:
            - *c_clock
            - *c_pol_ct
            - *c_fac
            - *c_unit
            - *c_phys
            - *c_tech
            - *c_rad
            - &c_fund
              call: "POST /facilities/${fac_id}/funding-deposits"
              payload: { amount_cents: 1000000, memo: "Accreditation application fees" }
              as: AccreditationCoordinator
              as_user_id: "coord-1"
            - &c_two_exams_a
              call: "POST /exams"
              payload: { unit_id: "${unit_id}", technologist_id: "${tech_id}", patient_ref: "PT-1201", patient_state_code: "CT", exam_type: "SCREENING", performed_at: "2026-07-20T00:00:00Z", original_image_count: 4 }
              as: Technologist
              as_user_id: "${tech_id}"
              captures: { pk_a_id: $.data.id }
            - &c_two_exams_a_read
              call: "POST /exams/${pk_a_id}/interpret"
              payload: { birads_assessment: 1, density_category: "B" }
              as: InterpretingPhysician
              as_user_id: "${rad_id}"
            - &c_two_exams_b
              call: "POST /exams"
              payload: { unit_id: "${unit_id}", technologist_id: "${tech_id}", patient_ref: "PT-1202", patient_state_code: "CT", exam_type: "SCREENING", performed_at: "2026-07-21T00:00:00Z", original_image_count: 4 }
              as: Technologist
              as_user_id: "${tech_id}"
              captures: { pk_b_id: $.data.id }
            - &c_two_exams_b_read
              call: "POST /exams/${pk_b_id}/interpret"
              payload: { birads_assessment: 1, density_category: "B" }
              as: InterpretingPhysician
              as_user_id: "${rad_id}"
            - call: "GET /units/${unit_id}"
              payload: {}
              as: AccreditationCoordinator
              as_user_id: "coord-1"
              captures: { pk_u_v1: $.data.version }
            - call: "POST /units/${unit_id}/clinical-image-reviews"
              payload: { exam_ids: ["${pk_a_id}", "${pk_b_id}"], expected_unit_version: "${pk_u_v1}", reviewer_note: "First packet" }
              as: AccreditationCoordinator
              as_user_id: "coord-1"
              captures: { pk_sub1_id: $.data.id }
            - call: "GET /units/${unit_id}"
              payload: {}
              as: AccreditationCoordinator
              as_user_id: "coord-1"
              captures: { pk_u_v2: $.data.version }
            - call: "POST /clinical-image-reviews/${pk_sub1_id}/withdraw"
              payload: { expected_unit_version: "${pk_u_v2}", withdrawal_reason: "Rebuilding the packet" }
              as: AccreditationCoordinator
              as_user_id: "coord-1"
            - call: "GET /units/${unit_id}"
              payload: {}
              as: AccreditationCoordinator
              as_user_id: "coord-1"
              captures: { pk_u_v3: $.data.version }
          trigger:
            - call: "POST /units/${unit_id}/clinical-image-reviews"
              payload: { exam_ids: ["${pk_a_id}", "${pk_b_id}"], expected_unit_version: "${pk_u_v3}", reviewer_note: "Second packet citing the same two exams" }
              as: AccreditationCoordinator
              as_user_id: "coord-1"
              captures: { pk_sub2_id: $.data.id }
          assert:
            - "HTTP status == 201"
            - "ClinicalImageReviewSubmission.${pk_sub2_id}.exam_ids contains exactly ${pk_a_id} and ${pk_b_id}"
            - "ClinicalImageReviewSubmission.${pk_sub2_id}.attempt_number == 1 and status == SUBMITTED"
            - "ClinicalImageReviewSubmission.${pk_sub1_id}.status == WITHDRAWN and still lists the same two exam ids"
            - "GET /exams?unit_id=${unit_id} returns total_count == 2 — the junction did not duplicate either exam"
            - "GET /units/${unit_id}/clinical-image-reviews returns total_count == 2"
            - "MammographyUnit.${unit_id}.reaccreditation_attempts_remaining == 2"
            - "Facility.${fac_id}.prepaid_credit_cents == 750000, fee_held_cents == 250000, fee_consumed_cents == 0"

      - name: unit_repeat_rate_computed_fields_are_server_derived
        claim_type: computed_fields
        grounds:
          - entities.MammographyUnit.fields.image_based_repeat_rate_pct
        excluded_because:
          difficulty_instance: boundary_precision_check / unit_repeat_rates_are_null_on_an_empty_ledger_and_zero_once_imaged
          rationale: "That instance reads the derived repeat-rate fields on an empty ledger and again after the first acquisition, pinning both the null and the 0.00 forms; the create payload has no repeat-rate input to ignore."

      - name: audit_cycle_metric_fields_are_computed_at_close
        claim_type: computed_fields
        grounds:
          - entities.RadiologistAuditCycle.fields.ppv_pct
        excluded_because:
          difficulty_instance: dual_variant_calc / ppv1_versus_ppv3_variant_divergence_on_radiologist_audit_cycle
          rationale: "That instance computes every audit metric field from pinned exam data under both variants, so the computed-field claim is already asserted with literals."

  # ===========================================================================
  - section: state_machines
    instances:

      - name: new_unit_and_new_personnel_start_in_their_declared_initial_states
        claim_type: initial_state
        grounds:
          - entities.MammographyUnit.fields.accreditation_status
          - entities.MammographyUnit.fields.operational_state
          - entities.MammographyUnit.fields.survey_compliance
          - entities.Personnel.fields.ce_status
          - calculations.facility_compliance_posture
        distinguishing_aspect: "A newly created unit is PROVISIONAL / IN_SERVICE / survey_compliance OVERDUE and a newly created qualified technologist is QUALIFIED / COMPLIANT; because survey_compliance defaults to OVERDUE the owning facility's posture is CONDITIONAL and not COMPLIANT the instant the first unit is added."
        test_recipe:
          setup:
            - "Clock pinned to 2026-08-01T00:00:00Z; CT policy; one facility with no units yet."
          setup_api_calls:
            - *c_clock
            - *c_pol_ct
            - *c_fac
          trigger:
            - call: "POST /facilities/${fac_id}/units"
              payload: { manufacturer: "Hologic", model_serial: "SEL-9001", modality: "DBT_3D", accreditation_expires_on: "2027-06-30T00:00:00Z" }
              as: AccreditationCoordinator
              as_user_id: "coord-1"
              captures: { init_unit_id: $.data.id }
            - call: "POST /facilities/${fac_id}/personnel"
              payload: { full_name: "Tomas Tech", role_type: "TECHNOLOGIST", initial_qualification_on: "2024-02-01T00:00:00Z", initial_training_hours: 45, initial_read_volume: 30, modality_certifications: ["DM_2D", "DBT_3D"] }
              as: AccreditationCoordinator
              as_user_id: "coord-1"
              captures: { init_tech_id: $.data.id }
            - call: "GET /facilities/${fac_id}"
              payload: {}
              as: AccreditationCoordinator
              as_user_id: "coord-1"
          assert:
            - "MammographyUnit.${init_unit_id}.accreditation_status == PROVISIONAL"
            - "MammographyUnit.${init_unit_id}.operational_state == IN_SERVICE"
            - "MammographyUnit.${init_unit_id}.survey_compliance == OVERDUE and last_passed_survey_end == null"
            - "MammographyUnit.${init_unit_id}.reaccreditation_attempts_remaining == 3"
            - "Personnel.${init_tech_id}.qualification_status == QUALIFIED (45 >= 40 initial hours and 30 >= 25 initial exams)"
            - "Personnel.${init_tech_id}.ce_status == COMPLIANT and ce_deadline_at == null and last_qualification_review_at == null"
            - "Facility.${fac_id}.compliance_posture == CONDITIONAL — driven solely by the unit's OVERDUE survey_compliance"

      - name: remediating_a_draft_survey_is_rejected_as_an_invalid_transition
        claim_type: invalid_transitions
        grounds:
          - validations[priority=40]
          - errors[ERR_SURVEY_NOT_DECIDABLE]
          - state_machines.PhysicistSurvey.status.DRAFT_to_PASSED
        distinguishing_aspect: "Remediation is declared only from FAILED_ACTION_REQUIRED, so calling it on a DRAFT survey returns 409 ERR_SURVEY_NOT_DECIDABLE and leaves remediation_attempts at 0 — the measurements in the rejected payload are never evaluated even though they would have passed."
        test_recipe:
          setup:
            - "Clock pinned to 2026-08-01T00:00:00Z; CT policy; one facility; one DBT_3D unit; qualified staff."
            - "One DRAFT ANNUAL survey on the unit that has never been submitted."
          setup_api_calls:
            - *c_clock
            - *c_pol_ct
            - *c_fac
            - *c_unit
            - *c_phys
            - *c_tech
            - *c_rad
            - &c_draft_survey
              call: "POST /units/${unit_id}/physicist-surveys"
              payload: { survey_type: "ANNUAL", effective_start: "2026-07-01T00:00:00Z", effective_end: "2027-07-01T00:00:00Z" }
              as: MedicalPhysicist
              as_user_id: "${phys_id}"
              captures: { draft_survey_id: $.data.id }
          trigger:
            - call: "POST /physicist-surveys/${draft_survey_id}/remediate"
              payload: { phantom_score: 7.0, mean_glandular_dose_mgy: 2.00, outcome_note: "Remediation attempted before any decision existed" }
              as: AccreditationCoordinator
              as_user_id: "coord-1"
              captures: { rem_err: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "error_id == \"ERR_SURVEY_NOT_DECIDABLE\""
            - "PhysicistSurvey.${draft_survey_id}.status == DRAFT and remediation_attempts == 0 and decided_at == null"
            - "PhysicistSurvey.${draft_survey_id}.phantom_score == null and mean_glandular_dose_mgy == null"
            - "MammographyUnit.${unit_id}.survey_compliance == OVERDUE"

      - name: sending_the_same_letter_twice_is_rejected
        claim_type: idempotency
        grounds:
          - validations[priority=40]
          - errors[ERR_LETTER_NOT_SENDABLE]
          - state_machines.NotificationLetter.status.QUEUED_to_SENT
        distinguishing_aspect: "The send action is declared only from QUEUED, so the second send returns 409 ERR_LETTER_NOT_SENDABLE and does not re-stamp sent_at or bump the letter version a second time."
        test_recipe:
          setup:
            - "Clock pinned to 2026-08-01T00:00:00Z; CT policy; one facility; one DBT_3D unit; qualified staff."
            - "One SCREENING exam interpreted BI-RADS 1 with density B and one QUEUED notification letter for it."
          setup_api_calls:
            - *c_clock
            - *c_pol_ct
            - *c_fac
            - *c_unit
            - *c_phys
            - *c_tech
            - *c_rad
            - *c_two_exams_a
            - *c_two_exams_a_read
            - call: "GET /exams/${pk_a_id}"
              payload: {}
              as: AccreditationCoordinator
              as_user_id: "coord-1"
              captures: { idem_exam_v: $.data.version }
            - call: "POST /exams/${pk_a_id}/notification-letters"
              payload: { expected_exam_version: "${idem_exam_v}", dispatch_channel: "MAIL" }
              as: AccreditationCoordinator
              as_user_id: "coord-1"
              captures: { idem_letter_id: $.data.id }
          trigger:
            - call: "POST /notification-letters/${idem_letter_id}/send"
              payload: {}
              as: AccreditationCoordinator
              as_user_id: "coord-1"
            - call: "POST /notification-letters/${idem_letter_id}/send"
              payload: {}
              as: AccreditationCoordinator
              as_user_id: "coord-1"
              captures: { send_err: $.data.error_id }
          assert:
            - "First send — HTTP status == 200, NotificationLetter.${idem_letter_id}.status == SENT and sent_at == \"2026-08-01T00:00:00Z\""
            - "First send — Exam.${pk_a_id}.notification_status == SENT"
            - "Second send — HTTP status == 409 and error_id == \"ERR_LETTER_NOT_SENDABLE\""
            - "NotificationLetter.${idem_letter_id}.status is still SENT and sent_at is still \"2026-08-01T00:00:00Z\""
            - "GET /exams/${pk_a_id}/notification-letters returns total_count == 1"

      - name: closing_an_already_closed_inspection_is_rejected
        claim_type: idempotency
        grounds:
          - validations[priority=40]
          - errors[ERR_INSPECTION_ALREADY_CLOSED]
          - state_machines.AnnualInspection.status.CORRECTIVE_ACTION_REQUIRED_to_CLOSED
          - calculations.facility_compliance_posture
        distinguishing_aspect: "CLOSED is the terminal state of AnnualInspection, so the second close returns 409 ERR_INSPECTION_ALREADY_CLOSED; the LEVEL_2 finding's contribution to the CONDITIONAL posture is released exactly once."
        test_recipe:
          setup:
            - "Clock pinned to 2026-08-01T00:00:00Z; CT policy; one facility; one DBT_3D unit; qualified staff."
            - "One LEVEL_2 inspection dated 2026-07-28, recorded straight into CORRECTIVE_ACTION_REQUIRED."
          setup_api_calls:
            - *c_clock
            - *c_pol_ct
            - *c_fac
            - *c_unit
            - *c_phys
            - *c_tech
            - *c_rad
            - call: "POST /facilities/${fac_id}/inspections"
              payload: { inspection_date: "2026-07-28T00:00:00Z", inspector_findings_level: "LEVEL_2", finding_codes: ["900.12(d)(1)"] }
              as: FdaInspector
              as_user_id: "inspector-1"
              captures: { lv2_insp_id: $.data.id }
          trigger:
            - call: "POST /inspections/${lv2_insp_id}/close"
              payload: { closure_note: "QC binder corrected" }
              as: FdaInspector
              as_user_id: "inspector-1"
            - call: "POST /inspections/${lv2_insp_id}/close"
              payload: { closure_note: "Duplicate closure" }
              as: FdaInspector
              as_user_id: "inspector-1"
              captures: { close_err: $.data.error_id }
          assert:
            - "Before the first close — AnnualInspection.${lv2_insp_id}.status == CORRECTIVE_ACTION_REQUIRED"
            - "First close — HTTP status == 200 and AnnualInspection.${lv2_insp_id}.status == CLOSED"
            - "Second close — HTTP status == 409 and error_id == \"ERR_INSPECTION_ALREADY_CLOSED\""
            - "AnnualInspection.${lv2_insp_id}.status is still CLOSED"
            - "Facility.${fac_id}.compliance_posture == CONDITIONAL (still driven by the unit's OVERDUE survey_compliance, no longer by the finding)"

      - name: denied_final_packet_suspends_the_unit_and_locks_every_further_action
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.ClinicalImageReviewSubmission.status.SUBMITTED_to_DENIED_FINAL
          - state_machines.MammographyUnit.accreditation_status.PROVISIONAL_to_SUSPENDED
          - validations[priority=41]
          - validations[priority=43]
          - validations[priority=53]
          - errors[ERR_REACCREDITATION_ATTEMPTS_EXHAUSTED]
          - errors[ERR_UNIT_NOT_IN_SERVICE]
          - errors[ERR_UNIT_ACCREDITATION_SUSPENDED]
          - calculations.fee_escrow_ledger
        distinguishing_aspect: "SUSPENDED is the terminal accreditation state: after the third attempt is denied the unit accepts no further packet (409 ERR_REACCREDITATION_ATTEMPTS_EXHAUSTED, because the empty attempt budget is checked at priority 43 ahead of the suspension guard at priority 53) and no further exam (409 ERR_UNIT_NOT_IN_SERVICE, because priority 41 outranks priority 53 on POST /exams). A repair that was open before the denial can no longer be closed out either — restore returns 409 ERR_UNIT_ACCREDITATION_SUSPENDED, which is the one endpoint where priority 53 is actually the first guard reached. The last escrowed fee has been consumed rather than refunded."
        test_recipe:
          setup:
            - "Clock pinned to 2026-08-01T00:00:00Z; CT policy; facility funded with 1000000 cents; one DBT_3D unit; qualified staff."
            - "Two interpreted exams on the unit."
            - "One MINOR DISPLAY equipment failure (non-qualifying, so the unit stays IN_SERVICE) is left OPEN before the denial."
            - "Three successive packets citing those exams have been filed, so reaccreditation_attempts_remaining is 0 and the third submission is SUBMITTED with attempt_number 3."
          setup_api_calls:
            - *c_clock
            - *c_pol_ct
            - *c_fac
            - *c_unit
            - *c_phys
            - *c_tech
            - *c_rad
            - *c_fund
            - *c_two_exams_a
            - *c_two_exams_a_read
            - *c_two_exams_b
            - *c_two_exams_b_read
            - call: "POST /units/${unit_id}/equipment-failures"
              payload: { failure_code: "DISPLAY", severity: "MINOR", detected_at: "2026-07-30T00:00:00Z" }
              as: AccreditationCoordinator
              as_user_id: "coord-1"
              captures: { dn_fail_id: $.data.id }
            - call: "GET /units/${unit_id}"
              payload: {}
              as: AccreditationCoordinator
              as_user_id: "coord-1"
              captures: { dn_u_v1: $.data.version }
            - call: "POST /units/${unit_id}/clinical-image-reviews"
              payload: { exam_ids: ["${pk_a_id}", "${pk_b_id}"], expected_unit_version: "${dn_u_v1}", reviewer_note: "Attempt 1" }
              as: AccreditationCoordinator
              as_user_id: "coord-1"
              captures: { dn_sub_id: $.data.id }
            - call: "POST /clinical-image-reviews/${dn_sub_id}/review"
              payload: { decision: "REVISION_REQUIRED", deficiency_categories: ["POSITIONING"], reviewer_note: "Attempt 1 deficient" }
              as: AccreditationBodyReviewer
              as_user_id: "reviewer-1"
            - call: "GET /units/${unit_id}"
              payload: {}
              as: AccreditationCoordinator
              as_user_id: "coord-1"
              captures: { dn_u_v2: $.data.version }
            - call: "POST /clinical-image-reviews/${dn_sub_id}/resubmit"
              payload: { exam_ids: ["${pk_a_id}", "${pk_b_id}"], expected_unit_version: "${dn_u_v2}", reviewer_note: "Attempt 2" }
              as: AccreditationCoordinator
              as_user_id: "coord-1"
            - call: "POST /clinical-image-reviews/${dn_sub_id}/review"
              payload: { decision: "REVISION_REQUIRED", deficiency_categories: ["POSITIONING"], reviewer_note: "Attempt 2 deficient" }
              as: AccreditationBodyReviewer
              as_user_id: "reviewer-1"
            - call: "GET /units/${unit_id}"
              payload: {}
              as: AccreditationCoordinator
              as_user_id: "coord-1"
              captures: { dn_u_v3: $.data.version }
            - call: "POST /clinical-image-reviews/${dn_sub_id}/resubmit"
              payload: { exam_ids: ["${pk_a_id}", "${pk_b_id}"], expected_unit_version: "${dn_u_v3}", reviewer_note: "Attempt 3" }
              as: AccreditationCoordinator
              as_user_id: "coord-1"
          trigger:
            - call: "POST /clinical-image-reviews/${dn_sub_id}/review"
              payload: { decision: "REVISION_REQUIRED", deficiency_categories: ["POSITIONING", "COMPRESSION"], reviewer_note: "Attempt 3 deficient — no attempts remain" }
              as: AccreditationBodyReviewer
              as_user_id: "reviewer-1"
            - call: "GET /units/${unit_id}"
              payload: {}
              as: AccreditationCoordinator
              as_user_id: "coord-1"
              captures: { dn_u_v4: $.data.version }
            - call: "POST /units/${unit_id}/clinical-image-reviews"
              payload: { exam_ids: ["${pk_a_id}", "${pk_b_id}"], expected_unit_version: "${dn_u_v4}", reviewer_note: "Packet filed after the denial" }
              as: AccreditationCoordinator
              as_user_id: "coord-1"
              captures: { dn_pkt_err: $.data.error_id }
            - call: "POST /exams"
              payload: { unit_id: "${unit_id}", technologist_id: "${tech_id}", patient_ref: "PT-1299", patient_state_code: "CT", exam_type: "SCREENING", performed_at: "2026-07-31T00:00:00Z", original_image_count: 4 }
              as: Technologist
              as_user_id: "${tech_id}"
              captures: { dn_exam_err: $.data.error_id }
            - call: "POST /equipment-failures/${dn_fail_id}/restore"
              payload: { repair_note: "Monitor replaced after the denial" }
              as: AccreditationCoordinator
              as_user_id: "coord-1"
              captures: { dn_restore_err: $.data.error_id }
          assert:
            - "Before the denial — MammographyUnit.${unit_id}.reaccreditation_attempts_remaining == 0 and ClinicalImageReviewSubmission.${dn_sub_id}.attempt_number == 3"
            - "The denial — ClinicalImageReviewSubmission.${dn_sub_id}.status == DENIED_FINAL, review_decision == REVISION_REQUIRED, reviewed_at == \"2026-08-01T00:00:00Z\", fee_held_cents == 0"
            - "MammographyUnit.${unit_id}.accreditation_status == SUSPENDED and operational_state == OUT_OF_SERVICE"
            - "Facility.${fac_id}.compliance_posture == SUSPENDED"
            - "Facility.${fac_id}.prepaid_credit_cents == 250000, fee_held_cents == 0, fee_consumed_cents == 750000, total_funded_cents == 1000000"
            - "New packet — HTTP status == 409 and error_id == \"ERR_REACCREDITATION_ATTEMPTS_EXHAUSTED\" (priority 43 is reached before priority 53)"
            - "New exam — HTTP status == 409 and error_id == \"ERR_UNIT_NOT_IN_SERVICE\" (priority 41 is reached before priority 53)"
            - "Restore of the pre-existing OPEN failure — HTTP status == 409 and ${dn_restore_err} == \"ERR_UNIT_ACCREDITATION_SUSPENDED\""
            - "EquipmentFailureEvent.${dn_fail_id}.status is still OPEN with resolved_at null, and MammographyUnit.${unit_id}.operational_state is still OUT_OF_SERVICE"
            - "GET /units/${unit_id}/clinical-image-reviews returns total_count == 1"

      - name: undeliverable_letter_is_superseded_by_the_reissued_letter
        claim_type: side_effect_execution
        grounds:
          - state_machines.NotificationLetter.status.SENT_to_UNDELIVERABLE
          - state_machines.NotificationLetter.status.UNDELIVERABLE_to_SUPERSEDED
          - state_machines.Exam.notification_status.SENT_to_PENDING
          - calculations.notification_requirement_selection
        distinguishing_aspect: "Marking a SENT letter undeliverable pushes Exam.notification_status back to PENDING, and the reissued letter carries supersedes_letter_id pointing at the undeliverable one while that one moves to SUPERSEDED — a bubble-up plus cross-entity side-effect pair that fires in the reissue request itself."
        test_recipe:
          setup:
            - "Clock pinned to 2026-08-01T00:00:00Z; CT policy; one facility; one DBT_3D unit; qualified staff."
            - "One SCREENING exam interpreted BI-RADS 1 with density B, whose first letter has been generated and sent."
          setup_api_calls:
            - *c_clock
            - *c_pol_ct
            - *c_fac
            - *c_unit
            - *c_phys
            - *c_tech
            - *c_rad
            - *c_two_exams_a
            - *c_two_exams_a_read
            - call: "GET /exams/${pk_a_id}"
              payload: {}
              as: AccreditationCoordinator
              as_user_id: "coord-1"
              captures: { und_exam_v1: $.data.version }
            - call: "POST /exams/${pk_a_id}/notification-letters"
              payload: { expected_exam_version: "${und_exam_v1}", dispatch_channel: "MAIL" }
              as: AccreditationCoordinator
              as_user_id: "coord-1"
              captures: { und_letter1_id: $.data.id }
            - call: "POST /notification-letters/${und_letter1_id}/send"
              payload: {}
              as: AccreditationCoordinator
              as_user_id: "coord-1"
          trigger:
            - call: "POST /notification-letters/${und_letter1_id}/mark-undeliverable"
              payload: { undeliverable_reason: "Returned by the postal service — addressee moved" }
              as: AccreditationCoordinator
              as_user_id: "coord-1"
            - call: "GET /exams/${pk_a_id}"
              payload: {}
              as: AccreditationCoordinator
              as_user_id: "coord-1"
              captures: { und_exam_v2: $.data.version }
            - call: "POST /exams/${pk_a_id}/notification-letters"
              payload: { expected_exam_version: "${und_exam_v2}", dispatch_channel: "PORTAL" }
              as: AccreditationCoordinator
              as_user_id: "coord-1"
              captures: { und_letter2_id: $.data.id }
          assert:
            - "After mark-undeliverable — NotificationLetter.${und_letter1_id}.status == UNDELIVERABLE and undeliverable_reason is stored"
            - "After mark-undeliverable — Exam.${pk_a_id}.notification_status == PENDING"
            - "After the reissue — NotificationLetter.${und_letter1_id}.status == SUPERSEDED"
            - "NotificationLetter.${und_letter2_id}.status == QUEUED and supersedes_letter_id == ${und_letter1_id}"
            - "NotificationLetter.${und_letter2_id}.dispatch_channel == PORTAL and letter_type == LAY_SUMMARY and density_statement_code == FDA_NOT_DENSE"
            - "NotificationLetter.${und_letter2_id}.required_notice_codes == [\"FDA-LAY-SUMMARY\", \"FDA-NOT-DENSE\"] (density B is not dense, so the CT state codes are not layered in even under STATE_ENHANCED_ALL — the letter_type test is the density test, not the rule test)"
            - "Exam.${pk_a_id}.notification_status == GENERATED"
            - "GET /notification-letters?exam_id=${pk_a_id} returns total_count == 2"

      - name: a_third_failing_survey_remediation_reaches_failed_final
        claim_type: valid_transition
        grounds:
          - state_machines.PhysicistSurvey.status.FAILED_ACTION_REQUIRED_to_FAILED_ACTION_REQUIRED
          - state_machines.PhysicistSurvey.status.FAILED_ACTION_REQUIRED_to_FAILED_FINAL
          - calculations.survey_pass_determination
        distinguishing_aspect: "The remediation loop terminates on the declared attempt budget: the first failing remediation self-loops with remediation_attempts 1, the second lands in the terminal FAILED_FINAL with remediation_attempts 2, and only that terminal failure pulls the unit out of service unconditionally."
        test_recipe:
          setup:
            - "Clock pinned to 2026-08-01T00:00:00Z; CT policy; one facility; one DBT_3D unit; qualified staff."
            - "One ANNUAL survey submitted with a failing phantom score and no critical deficiency codes, so it sits in FAILED_ACTION_REQUIRED with remediation_attempts 0 and the unit stays IN_SERVICE."
          setup_api_calls:
            - *c_clock
            - *c_pol_ct
            - *c_fac
            - *c_unit
            - *c_phys
            - *c_tech
            - *c_rad
            - *c_draft_survey
            - call: "POST /physicist-surveys/${draft_survey_id}/submit"
              payload: { phantom_score: 5.5, mean_glandular_dose_mgy: 2.80, outcome_note: "Phantom score below the minimum" }
              as: MedicalPhysicist
              as_user_id: "${phys_id}"
          trigger:
            - call: "POST /physicist-surveys/${draft_survey_id}/remediate"
              payload: { phantom_score: 5.7, mean_glandular_dose_mgy: 2.80, outcome_note: "First remediation still short" }
              as: AccreditationCoordinator
              as_user_id: "coord-1"
            - call: "POST /physicist-surveys/${draft_survey_id}/remediate"
              payload: { phantom_score: 5.9, mean_glandular_dose_mgy: 2.80, outcome_note: "Second remediation still short" }
              as: AccreditationCoordinator
              as_user_id: "coord-1"
          assert:
            - "After the submission — PhysicistSurvey.${draft_survey_id}.status == FAILED_ACTION_REQUIRED, remediation_attempts == 0, and MammographyUnit.${unit_id}.operational_state == IN_SERVICE"
            - "After the first remediation — status is still FAILED_ACTION_REQUIRED and remediation_attempts == 1"
            - "After the first remediation — MammographyUnit.${unit_id}.operational_state == IN_SERVICE"
            - "After the second remediation — PhysicistSurvey.${draft_survey_id}.status == FAILED_FINAL and remediation_attempts == 2"
            - "PhysicistSurvey.${draft_survey_id}.decided_at == \"2026-08-01T00:00:00Z\" and phantom_score == 5.9"
            - "MammographyUnit.${unit_id}.operational_state == OUT_OF_SERVICE and survey_compliance == FAILED"
            - "MammographyUnit.${unit_id}.accreditation_status == PROBATION"
            - "Facility.${fac_id}.compliance_posture == SUSPENDED (an OUT_OF_SERVICE unit whose accreditation_status is PROBATION is a level-1 predicate)"

      - name: recording_a_second_pathology_outcome_is_rejected
        claim_type: idempotency
        grounds:
          - validations[priority=40]
          - errors[ERR_OUTCOME_ALREADY_RECORDED]
          - entities.Exam.fields.pathology_result
        distinguishing_aspect: "The outcome action is declared once per exam: the second POST /exams/{id}/outcome returns 409 ERR_OUTCOME_ALREADY_RECORDED and cannot flip a MALIGNANT result to BENIGN, so audit denominators cannot be rewritten after the fact."
        test_recipe:
          setup:
            - "Clock pinned to 2026-08-01T00:00:00Z; CT policy; one facility; one DBT_3D unit; qualified staff."
            - "One SCREENING exam interpreted BI-RADS 0 with density C, with a biopsy outcome of MALIGNANT already recorded by the quality assurance officer."
          setup_api_calls:
            - *c_clock
            - *c_pol_ct
            - *c_fac
            - *c_unit
            - *c_phys
            - *c_tech
            - *c_rad
            - call: "POST /exams"
              payload: { unit_id: "${unit_id}", technologist_id: "${tech_id}", patient_ref: "PT-1301", patient_state_code: "CT", exam_type: "SCREENING", performed_at: "2026-07-15T00:00:00Z", original_image_count: 4 }
              as: Technologist
              as_user_id: "${tech_id}"
              captures: { out_exam_id: $.data.id }
            - call: "POST /exams/${out_exam_id}/interpret"
              payload: { birads_assessment: 0, density_category: "C" }
              as: InterpretingPhysician
              as_user_id: "${rad_id}"
            - call: "POST /exams/${out_exam_id}/outcome"
              payload: { biopsy_performed: true, pathology_result: "MALIGNANT" }
              as: QualityAssuranceOfficer
              as_user_id: "qa-1"
          trigger:
            - call: "POST /exams/${out_exam_id}/outcome"
              payload: { biopsy_performed: true, pathology_result: "BENIGN" }
              as: QualityAssuranceOfficer
              as_user_id: "qa-1"
              captures: { out_err: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "error_id == \"ERR_OUTCOME_ALREADY_RECORDED\""
            - "Exam.${out_exam_id}.pathology_result == MALIGNANT and biopsy_performed == true"
            - "Exam.${out_exam_id}.recall_flag == true (SCREENING with BI-RADS 0)"

      - name: expired_grace_moves_personnel_to_deficient_and_lapses_the_qualification
        claim_type: side_effect_execution
        grounds:
          - state_machines.Personnel.ce_status.GRACE_to_DEFICIENT
          - state_machines.Personnel.qualification_status.QUALIFIED_to_LAPSED
          - calculations.ce_and_volume_compliance
          - calculations.facility_compliance_posture
        distinguishing_aspect: "Crossing ce_deadline_at is what couples the two otherwise independent Personnel dimensions: the review at 2026-10-31 moves ce_status GRACE -> DEFICIENT and, as a side effect of exactly that step, qualification_status QUALIFIED -> LAPSED, which then drives the facility posture to CONDITIONAL."
        test_recipe:
          setup:
            - "Clock pinned to 2026-08-01T00:00:00Z; CT policy (ce_grace_days 90); one facility; one DBT_3D unit; qualified staff."
            - "The technologist has no QualificationCredit rows at all, and one qualification review at 2026-08-01 has already moved ce_status to GRACE with ce_deadline_at 2026-10-30T00:00:00Z."
            - "The clock is then moved to 2026-10-31T00:00:00Z, one day past that deadline."
          setup_api_calls:
            - *c_clock
            - *c_pol_ct
            - *c_fac
            - *c_unit
            - *c_phys
            - *c_tech
            - *c_rad
            - call: "POST /personnel/${tech_id}/qualification-reviews"
              payload: { review_note: "First continuing-education review" }
              as: AccreditationCoordinator
              as_user_id: "coord-1"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-10-31T00:00:00Z" }
              as: AccreditationCoordinator
              as_user_id: "coord-1"
          trigger:
            - call: "POST /personnel/${tech_id}/qualification-reviews"
              payload: { review_note: "Grace period has expired" }
              as: AccreditationCoordinator
              as_user_id: "coord-1"
          assert:
            - "Before the trigger — Personnel.${tech_id}.ce_status == GRACE, ce_deadline_at == \"2026-10-30T00:00:00Z\", qualification_status == QUALIFIED"
            - "Personnel.${tech_id}.ce_status == DEFICIENT"
            - "Personnel.${tech_id}.qualification_status == LAPSED"
            - "Personnel.${tech_id}.ce_hours_36mo == 0.00 and volume_credit_24mo == 0"
            - "Personnel.${tech_id}.last_qualification_review_at == \"2026-10-31T00:00:00Z\""
            - "Facility.${fac_id}.compliance_posture == CONDITIONAL"

      - name: survey_failure_cascade_reaches_external_follow_up
        claim_type: side_effect_execution
        grounds:
          - state_machines.PhysicistSurvey.status.DRAFT_to_FAILED_ACTION_REQUIRED
        excluded_because:
          difficulty_instance: transitive_cascade / failing_survey_cascades_five_levels_to_external_followup
          rationale: "That instance replays all five cascade levels of the failing survey decision end to end with literal asserts at each level."

      - name: exam_parallel_state_dimensions_move_independently
        claim_type: parallel
        grounds:
          - state_machines.Exam.report_status.INTERPRETED_FINAL_to_AMENDED
        excluded_because:
          difficulty_instance: non_linear_state_machine / exam_three_parallel_dimensions_hold_three_different_values
          rationale: "That instance pins report_status, notification_status and follow_up_status at three different values after one amendment, which is exactly the parallel-shape claim."

      - name: withdrawal_reverses_every_submission_side_effect
        claim_type: compensation
        grounds:
          - state_machines.ClinicalImageReviewSubmission.status.SUBMITTED_to_WITHDRAWN
        excluded_because:
          difficulty_instance: compensating_invariant / submission_withdrawal_restores_the_fee_ledger_identity_without_drift
          rationale: "That instance asserts the full before/after ledger identity and the restored attempt counter, so no side effect of the withdrawal is left unverified."

      - name: restore_is_guarded_by_a_cross_entity_precondition
        claim_type: precondition_enforcement
        grounds:
          - state_machines.EquipmentFailureEvent.status.OPEN_to_REPAIR_VERIFIED
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / unit_restore_blocked_until_a_post_repair_survey_passes
          rationale: "That instance drives the restore both before and after the qualifying POST_REPAIR survey exists, asserting the 409 and then the success."

  # ===========================================================================
  - section: calculations
    instances:

      - name: patient_state_policy_outranks_the_facility_home_state_policy
        claim_type: rule_selection
        grounds:
          - calculations.governing_policy_resolution
          - calculations.notification_requirement_selection
        distinguishing_aspect: "Two exams on the same unit are notified under two different policies purely because of patient_state_code: the MA patient's letter is built from MA's grade 6 / 14-day ceilings and MA's notice code, while the CT patient's letter is built from CT's ceilings clamped by the federal floor (grade min(10, 8) == 8, deadline min(21, 30) == 21) — proof that the facility's home policy is only the fallback."
        test_recipe:
          setup:
            - "Clock pinned to 2026-08-01T00:00:00Z; both the CT and MA policies exist; the facility's home policy is CT."
            - "One DBT_3D unit and qualified staff; two SCREENING exams performed 2026-07-20, one with patient_state_code MA and one with CT, both interpreted BI-RADS 1 with density C."
          setup_api_calls:
            - *c_clock
            - *c_pol_ct
            - &c_pol_ma
              call: "POST /state-policies"
              payload: { state_code: "MA", density_notice_rule: "STATE_DENSE_ONLY", lay_summary_max_reading_grade: 6, lay_summary_deadline_days: 14, supplemental_coverage_mandate: "COVERAGE_WITH_COST_SHARING", required_notice_codes: ["MA-DENSE-NOTICE"], supplemental_cost_share_waiver_threshold_cents: 5000, followup_grace_days: 60, report_turnaround_days: 30, urgent_report_turnaround_days: 7, ce_grace_days: 90 }
              as: AccreditationBodyReviewer
              as_user_id: "reviewer-1"
              captures: { pol_ma_id: $.data.id }
            - *c_fac
            - *c_unit
            - *c_phys
            - *c_tech
            - *c_rad
            - call: "POST /exams"
              payload: { unit_id: "${unit_id}", technologist_id: "${tech_id}", patient_ref: "PT-MA-1", patient_state_code: "MA", exam_type: "SCREENING", performed_at: "2026-07-20T00:00:00Z", original_image_count: 4 }
              as: Technologist
              as_user_id: "${tech_id}"
              captures: { gp_ma_exam_id: $.data.id }
            - call: "POST /exams/${gp_ma_exam_id}/interpret"
              payload: { birads_assessment: 1, density_category: "C" }
              as: InterpretingPhysician
              as_user_id: "${rad_id}"
              captures: { gp_ma_exam_v: $.data.version }
            - call: "POST /exams"
              payload: { unit_id: "${unit_id}", technologist_id: "${tech_id}", patient_ref: "PT-CT-1", patient_state_code: "CT", exam_type: "SCREENING", performed_at: "2026-07-20T00:00:00Z", original_image_count: 4 }
              as: Technologist
              as_user_id: "${tech_id}"
              captures: { gp_ct_exam_id: $.data.id }
            - call: "POST /exams/${gp_ct_exam_id}/interpret"
              payload: { birads_assessment: 1, density_category: "C" }
              as: InterpretingPhysician
              as_user_id: "${rad_id}"
              captures: { gp_ct_exam_v: $.data.version }
          trigger:
            - call: "POST /exams/${gp_ma_exam_id}/notification-letters"
              payload: { expected_exam_version: "${gp_ma_exam_v}", dispatch_channel: "MAIL" }
              as: AccreditationCoordinator
              as_user_id: "coord-1"
              captures: { gp_ma_letter_id: $.data.id }
            - call: "POST /exams/${gp_ct_exam_id}/notification-letters"
              payload: { expected_exam_version: "${gp_ct_exam_v}", dispatch_channel: "MAIL" }
              as: AccreditationCoordinator
              as_user_id: "coord-1"
              captures: { gp_ct_letter_id: $.data.id }
          assert:
            - "MA letter — governing_state_code == \"MA\" (the patient's state, not the facility's CT)"
            - "MA letter — reading_grade_level == 6 and deadline_at == \"2026-08-15T00:00:00Z\" (14 days, the state ceiling being tighter than the federal 30)"
            - "MA letter — letter_type == COMBINED and density_statement_code == FDA_DENSE (STATE_DENSE_ONLY plus a dense category)"
            - "MA letter — required_notice_codes == [\"FDA-LAY-SUMMARY\", \"FDA-DENSE\", \"MA-DENSE-NOTICE\"]"
            - "CT letter — governing_state_code == \"CT\", reading_grade_level == 8 (CT's grade 10 is clamped down to the federal ceiling), deadline_at == \"2026-08-22T00:00:00Z\""
            - "CT letter — letter_type == COMBINED and required_notice_codes == [\"FDA-LAY-SUMMARY\", \"FDA-DENSE\", \"CT-DENS-1\", \"CT-SUPP-2\"]"
            - "Exam.${gp_ma_exam_id}.notification_deadline_at == \"2026-08-15T00:00:00Z\" and Exam.${gp_ct_exam_id}.notification_deadline_at == \"2026-08-22T00:00:00Z\""

      - name: metrics_preview_defaults_to_ppv1_and_does_not_lock_the_cycle
        claim_type: variant_selection
        grounds:
          - calculations.radiologist_audit_metrics
          - entities.RadiologistAuditCycle.fields.variant_at_close
        distinguishing_aspect: "GET /audit-cycles/{id}/metrics with the variant query parameter omitted answers under PPV1_SCREENING and echoes that choice in the response body, while leaving the cycle OPEN with variant_at_close and every metric column still null — the preview is a pure read."
        test_recipe:
          setup:
            - "Clock pinned to 2026-08-01T00:00:00Z; CT policy; one facility; one DBT_3D unit; qualified staff."
            - "One OPEN audit cycle for the radiologist covering 2026-01-01 to 2026-07-01 with the default 365-day follow-up window."
            - "One SCREENING exam performed 2026-03-10, interpreted BI-RADS 0 with density C, biopsied with a MALIGNANT result."
          setup_api_calls:
            - *c_clock
            - *c_pol_ct
            - *c_fac
            - *c_unit
            - *c_phys
            - *c_tech
            - *c_rad
            - call: "POST /exams"
              payload: { unit_id: "${unit_id}", technologist_id: "${tech_id}", patient_ref: "PT-VS-1", patient_state_code: "CT", exam_type: "SCREENING", performed_at: "2026-03-10T00:00:00Z", original_image_count: 4 }
              as: Technologist
              as_user_id: "${tech_id}"
              captures: { vs_exam_id: $.data.id }
            - call: "POST /exams/${vs_exam_id}/interpret"
              payload: { birads_assessment: 0, density_category: "C" }
              as: InterpretingPhysician
              as_user_id: "${rad_id}"
            - call: "POST /exams/${vs_exam_id}/outcome"
              payload: { biopsy_performed: true, pathology_result: "MALIGNANT" }
              as: QualityAssuranceOfficer
              as_user_id: "qa-1"
            - &c_cycle
              call: "POST /personnel/${rad_id}/audit-cycles"
              payload: { period_start: "2026-01-01T00:00:00Z", period_end: "2026-07-01T00:00:00Z" }
              as: QualityAssuranceOfficer
              as_user_id: "qa-1"
              captures: { cycle_id: $.data.id }
          trigger:
            - call: "GET /audit-cycles/${cycle_id}/metrics"
              payload: {}
              as: QualityAssuranceOfficer
              as_user_id: "qa-1"
            - call: "GET /audit-cycles/${cycle_id}"
              payload: {}
              as: QualityAssuranceOfficer
              as_user_id: "qa-1"
          assert:
            - "Metrics response — variant == \"PPV1_SCREENING\""
            - "Metrics response — screening_exam_count == 1, recall_count == 1, recall_rate_pct == 100.00"
            - "Metrics response — biopsy_count == 1, cancer_count == 1, excluded_exam_count == 0, ppv_pct == 100.00"
            - "Metrics response — abnormal_interpretation_flag == true (100.00 is outside the closed band 5.00..12.00)"
            - "RadiologistAuditCycle.${cycle_id}.status == OPEN, variant_at_close == null, locked_at == null"
            - "RadiologistAuditCycle.${cycle_id}.screening_exam_count == null, recall_rate_pct == null, ppv_pct == null (the preview writes nothing)"
            - "RadiologistAuditCycle.${cycle_id}.followup_window_days == 365"

      - name: audit_metrics_exclude_diagnostic_unread_and_period_end_exams
        claim_type: input_set_filtering
        grounds:
          - calculations.radiologist_audit_metrics
        distinguishing_aspect: "Four exams are deliberately outside the in-scope set for four different reasons — DIAGNOSTIC type, report_status AWAITING_INTERPRETATION, performed_at exactly at the half-open period_end, and a different radiologist — so the pooled recall rate is 1/2 == 50.00 rather than 1/3, 2/4 or anything derived from the full ledger."
        test_recipe:
          setup:
            - "Clock pinned to 2026-08-01T00:00:00Z; CT policy; one facility; one DBT_3D unit; qualified staff plus a second INTERPRETING_PHYSICIAN."
            - "Exams for the primary radiologist: (a) SCREENING 2026-03-10 BI-RADS 0 density C biopsied MALIGNANT — in scope and recalled; (b) SCREENING 2026-05-01 BI-RADS 1 density B — in scope, not recalled; (c) DIAGNOSTIC 2026-04-01 BI-RADS 0 — out of scope by type; (d) SCREENING performed exactly at 2026-07-01T00:00:00Z BI-RADS 0 density C — out of scope by the half-open right edge; (e) SCREENING 2026-06-01 left uninterpreted — out of scope by report_status."
            - "One further SCREENING exam 2026-04-15 BI-RADS 0 density C read by the second radiologist — out of scope by attribution."
            - "One OPEN audit cycle for the primary radiologist covering 2026-01-01 to 2026-07-01."
          setup_api_calls:
            - *c_clock
            - *c_pol_ct
            - *c_fac
            - *c_unit
            - *c_phys
            - *c_tech
            - *c_rad
            - call: "POST /facilities/${fac_id}/personnel"
              payload: { full_name: "Rex Reader", role_type: "INTERPRETING_PHYSICIAN", initial_qualification_on: "2024-04-01T00:00:00Z", initial_training_hours: 70, initial_read_volume: 300, modality_certifications: ["DM_2D", "DBT_3D"] }
              as: AccreditationCoordinator
              as_user_id: "coord-1"
              captures: { rad2_id: $.data.id }
            - call: "POST /exams"
              payload: { unit_id: "${unit_id}", technologist_id: "${tech_id}", patient_ref: "PT-IS-A", patient_state_code: "CT", exam_type: "SCREENING", performed_at: "2026-03-10T00:00:00Z", original_image_count: 4 }
              as: Technologist
              as_user_id: "${tech_id}"
              captures: { is_a_id: $.data.id }
            - call: "POST /exams/${is_a_id}/interpret"
              payload: { birads_assessment: 0, density_category: "C" }
              as: InterpretingPhysician
              as_user_id: "${rad_id}"
            - call: "POST /exams/${is_a_id}/outcome"
              payload: { biopsy_performed: true, pathology_result: "MALIGNANT" }
              as: QualityAssuranceOfficer
              as_user_id: "qa-1"
            - call: "POST /exams"
              payload: { unit_id: "${unit_id}", technologist_id: "${tech_id}", patient_ref: "PT-IS-B", patient_state_code: "CT", exam_type: "SCREENING", performed_at: "2026-05-01T00:00:00Z", original_image_count: 4 }
              as: Technologist
              as_user_id: "${tech_id}"
              captures: { is_b_id: $.data.id }
            - call: "POST /exams/${is_b_id}/interpret"
              payload: { birads_assessment: 1, density_category: "B" }
              as: InterpretingPhysician
              as_user_id: "${rad_id}"
            - call: "POST /exams"
              payload: { unit_id: "${unit_id}", technologist_id: "${tech_id}", patient_ref: "PT-IS-C", patient_state_code: "CT", exam_type: "DIAGNOSTIC", performed_at: "2026-04-01T00:00:00Z", original_image_count: 6 }
              as: Technologist
              as_user_id: "${tech_id}"
              captures: { is_c_id: $.data.id }
            - call: "POST /exams/${is_c_id}/interpret"
              payload: { birads_assessment: 0 }
              as: InterpretingPhysician
              as_user_id: "${rad_id}"
            - call: "POST /exams/${is_c_id}/outcome"
              payload: { biopsy_performed: true, pathology_result: "MALIGNANT" }
              as: QualityAssuranceOfficer
              as_user_id: "qa-1"
            - call: "POST /exams"
              payload: { unit_id: "${unit_id}", technologist_id: "${tech_id}", patient_ref: "PT-IS-D", patient_state_code: "CT", exam_type: "SCREENING", performed_at: "2026-07-01T00:00:00Z", original_image_count: 4 }
              as: Technologist
              as_user_id: "${tech_id}"
              captures: { is_d_id: $.data.id }
            - call: "POST /exams/${is_d_id}/interpret"
              payload: { birads_assessment: 0, density_category: "C" }
              as: InterpretingPhysician
              as_user_id: "${rad_id}"
            - call: "POST /exams"
              payload: { unit_id: "${unit_id}", technologist_id: "${tech_id}", patient_ref: "PT-IS-E", patient_state_code: "CT", exam_type: "SCREENING", performed_at: "2026-06-01T00:00:00Z", original_image_count: 4 }
              as: Technologist
              as_user_id: "${tech_id}"
              captures: { is_e_id: $.data.id }
            - call: "POST /exams"
              payload: { unit_id: "${unit_id}", technologist_id: "${tech_id}", patient_ref: "PT-IS-F", patient_state_code: "CT", exam_type: "SCREENING", performed_at: "2026-04-15T00:00:00Z", original_image_count: 4 }
              as: Technologist
              as_user_id: "${tech_id}"
              captures: { is_f_id: $.data.id }
            - call: "POST /exams/${is_f_id}/interpret"
              payload: { birads_assessment: 0, density_category: "C" }
              as: InterpretingPhysician
              as_user_id: "${rad2_id}"
            - *c_cycle
          trigger:
            - call: "GET /audit-cycles/${cycle_id}/metrics"
              payload: { variant: "PPV1_SCREENING" }
              as: QualityAssuranceOfficer
              as_user_id: "qa-1"
          assert:
            - "screening_exam_count == 2 (only exams a and b are in scope)"
            - "recall_count == 1 and recall_rate_pct == 50.00"
            - "biopsy_count == 1, cancer_count == 1, ppv_pct == 100.00, excluded_exam_count == 0"
            - "abnormal_interpretation_flag == true"
            - "Exam.${is_e_id}.report_status == AWAITING_INTERPRETATION and interpreting_physician_id == null (never attributed, so never counted)"
            - "Exam.${is_d_id}.recall_flag == true yet it is excluded, proving performed_at == period_end falls outside the half-open period"
            - "Exam.${is_c_id}.recall_flag == true and pathology_result == MALIGNANT yet it is excluded, proving the DIAGNOSTIC filter runs before the PPV denominator"

      - name: survey_window_length_constant_rejects_397_days_and_accepts_396
        claim_type: constants_applied
        grounds:
          - calculations.survey_window_exclusivity
          - validations[priority=61]
          - errors[ERR_SURVEY_WINDOW_INVALID]
        distinguishing_aspect: "MAX_SURVEY_WINDOW_DAYS is exactly 396: the window 2026-07-01 to 2027-08-02 is 397 days and is rejected with 422 ERR_SURVEY_WINDOW_INVALID, while the same start with 2027-08-01 is exactly 396 days and is accepted — a one-day shift flips the outcome and no survey row is left behind by the rejected call."
        test_recipe:
          setup:
            - "Clock pinned to 2026-08-01T00:00:00Z; CT policy; one facility; one DBT_3D unit; qualified staff; the unit has no surveys."
          setup_api_calls:
            - *c_clock
            - *c_pol_ct
            - *c_fac
            - *c_unit
            - *c_phys
            - *c_tech
            - *c_rad
          trigger:
            - call: "POST /units/${unit_id}/physicist-surveys"
              payload: { survey_type: "ANNUAL", effective_start: "2026-07-01T00:00:00Z", effective_end: "2027-08-02T00:00:00Z" }
              as: MedicalPhysicist
              as_user_id: "${phys_id}"
              captures: { win_err: $.data.error_id }
