scenario: |
  Theme Park Dining Reservation (Disney ADR): park session, restaurant 60-day
  reservation window, Character Dining, allergy meal, Dining Plan credit
  deduction, no-show fee, Lightning Lane add-on.

domain_name: "theme-park-dining-adr"
api_prefix: "/v1"

complexity_profile:
  primary_archetype: temporal_windowing
  secondary_archetype: quota_allocation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - rate_threshold_triggers
    - scheduled_actions
  entity_topology: flat
  state_machine_shape: branching
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: peer_roles
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — EMIT VERBATIM)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Guest
    parent: null
    common_fields: true
    fields:
      - name: email
        type: string
        source: input
        description: Guest email (lowercase, RFC 5322 form)
        constraints: "unique across Guest"
      - name: full_name
        type: string
        source: input
        description: Display name of the guest
      - name: home_timezone
        type: string
        source: input
        description: IANA TZ name (e.g., America/New_York); only used for guest UI display, NOT for window arithmetic
      - name: no_show_strike_count
        type: integer
        source: computed
        description: Lifetime count of Reservation transitions into NO_SHOW for this guest; recomputed by Reservation NO_SHOW transition side effect
        default: 0
      - name: status
        type: enum
        source: system
        description: Account status
        constraints: "values ∈ {ACTIVE, SUSPENDED}; starts ACTIVE; SUSPENDED set when no_show_strike_count >= 5 (see calc no_show_strike_suspend)"
        default: ACTIVE

  - name: Restaurant
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: Restaurant display name
      - name: park_code
        type: enum
        source: input
        description: Owning park identifier
        constraints: "values ∈ {MAGIC_KINGDOM, EPCOT, ANIMAL_KINGDOM, HOLLYWOOD_STUDIOS}"
      - name: capacity_per_slot
        type: integer
        source: input
        description: Max party-seats per 30-minute slot
        constraints: "1..400"
      - name: slot_minutes
        type: integer
        source: input
        description: Fixed length of a reservation slot in minutes
        default: 30
        constraints: "exactly 30; no other values supported in v1"
      - name: is_character_dining
        type: boolean
        source: input
        description: Whether this restaurant hosts Character Dining (changes credit cost and no-show fee surcharge)
        default: false
      - name: dining_plan_credit_cost
        type: integer
        source: input
        description: Number of Table-Service credits charged per reservation seat at this restaurant
        constraints: "1..3"
      - name: no_show_base_fee_cents
        type: integer
        source: input
        description: Base per-seat no-show fee charged when a reservation transitions to NO_SHOW
        constraints: ">= 0"
      - name: opening_local_time
        type: string
        source: input
        description: First seating time of day in resort wall-clock (HH:MM, 24h)
      - name: closing_local_time
        type: string
        source: input
        description: Last seating time of day in resort wall-clock (HH:MM, 24h, exclusive upper bound for slot start)

  - name: ParkSession
    parent: null
    common_fields: true
    fields:
      - name: guest_id
        type: string
        source: input
        description: FK -> Guest.id; one ParkSession per (guest, visit_date)
      - name: park_code
        type: enum
        source: input
        description: Which park admission ticket grants
        constraints: "values ∈ {MAGIC_KINGDOM, EPCOT, ANIMAL_KINGDOM, HOLLYWOOD_STUDIOS}"
      - name: visit_date
        type: string
        source: input
        description: "Calendar date (YYYY-MM-DD) of the visit in resort timezone (America/New_York)"
      - name: status
        type: enum
        source: system
        description: Session lifecycle (see §1.2 ParkSession state machine)
        constraints: "values ∈ {NOT_STARTED, ACTIVE, CLOSED, CANCELLED}"
        default: NOT_STARTED
      - name: activated_at
        type: datetime
        source: system
        description: Server-stamped time the guest tapped into the park (NOT_STARTED -> ACTIVE)
        default: null
      - name: closed_at
        type: datetime
        source: system
        description: Server-stamped time of CLOSED transition (manual close or end-of-day)
        default: null

  - name: DiningPlan
    parent: null
    common_fields: true
    fields:
      - name: guest_id
        type: string
        source: input
        description: FK -> Guest.id; one ACTIVE plan per guest at a time
      - name: tier
        type: enum
        source: input
        description: Plan tier (drives starting credit balances)
        constraints: "values ∈ {STANDARD, PLUS, DELUXE}"
      - name: table_service_credits_initial
        type: integer
        source: input
        description: Starting Table-Service credits when plan created
        constraints: ">= 0"
      - name: table_service_credits_remaining
        type: integer
        source: computed
        description: Current Table-Service credit balance (provisional reservations hold credits; check-in finalizes)
        default: 0
      - name: table_service_credits_held
        type: integer
        source: computed
        description: Sum of credits provisionally held by reservations in {PENDING, CONFIRMED} for this plan; updated by Reservation transitions
        default: 0
      - name: valid_from
        type: datetime
        source: input
        description: "Inclusive UTC start of plan validity"
      - name: valid_until
        type: datetime
        source: input
        description: "Exclusive UTC end of plan validity"
      - name: status
        type: enum
        source: system
        description: Plan lifecycle
        constraints: "values ∈ {ACTIVE, EXPIRED, REVOKED}; defaults ACTIVE on creation"
        default: ACTIVE

  - name: Reservation
    parent: null
    common_fields: true
    fields:
      - name: guest_id
        type: string
        source: input
        description: FK -> Guest.id; the booking guest
      - name: restaurant_id
        type: string
        source: input
        description: FK -> Restaurant.id; the restaurant being booked
      - name: park_session_id
        type: string
        source: input
        description: FK -> ParkSession.id; the guest's park session for visit_date; required and MUST be in {NOT_STARTED, ACTIVE} at booking time
      - name: dining_plan_id
        type: string
        source: input
        description: FK -> DiningPlan.id; the plan whose credits will be held/debited; required
      - name: slot_start_utc
        type: datetime
        source: input
        description: "Inclusive UTC start of the 30-minute slot (slot length pinned by Restaurant.slot_minutes)"
      - name: slot_end_utc
        type: datetime
        source: computed
        description: "Exclusive UTC end of slot = slot_start_utc + Restaurant.slot_minutes"
      - name: party_size
        type: integer
        source: input
        description: Number of seats; debit and fee multiply by this
        constraints: "1..12"
      - name: credits_debited
        type: integer
        source: computed
        description: "Credits actually finalized (set by calculation dining_plan_credit_debit at CONFIRMED -> CHECKED_IN); 0 until check-in"
        default: 0
      - name: credits_held
        type: integer
        source: computed
        description: "Credits provisionally held while in {PENDING, CONFIRMED} (set by calculation dining_plan_credit_debit provisional variant)"
        default: 0
      - name: status
        type: enum
        source: system
        description: Reservation lifecycle (see §1.2 Reservation state machine)
        constraints: "values ∈ {PENDING, CONFIRMED, CHECKED_IN, SEATED, COMPLETED, CANCELLED, NO_SHOW}"
        default: PENDING
      - name: confirmed_at
        type: datetime
        source: system
        description: Time of PENDING -> CONFIRMED
        default: null
      - name: checked_in_at
        type: datetime
        source: system
        description: Time of CONFIRMED -> CHECKED_IN
        default: null
      - name: no_show_assessed_at
        type: datetime
        source: system
        description: Time of CONFIRMED -> NO_SHOW (auto by no-show ops-run or manual mark)
        default: null

  - name: AllergyMeal
    parent: null
    common_fields: true
    fields:
      - name: reservation_id
        type: string
        source: input
        description: FK -> Reservation.id; one AllergyMeal per Reservation
      - name: allergen_codes
        type: array
        source: input
        description: "Array of allergen tags; values ∈ {PEANUT, TREE_NUT, GLUTEN, DAIRY, EGG, SHELLFISH, SOY}; non-empty"
      - name: notes
        type: string
        source: input
        description: Free-text instructions for the chef
        default: ""
      - name: status
        type: enum
        source: system
        description: Allergy meal lifecycle (see §1.2 AllergyMeal state machine)
        constraints: "values ∈ {REQUESTED, ACKNOWLEDGED, PREPARED, SERVED, DECLINED}"
        default: REQUESTED
      - name: declined_reason
        type: string
        source: system
        description: Filled by Restaurant on DECLINED transition (revert side effect)
        default: null

  - name: LightningLaneAddOn
    parent: null
    common_fields: true
    fields:
      - name: reservation_id
        type: string
        source: input
        description: FK -> Reservation.id; one LightningLaneAddOn per Reservation
      - name: tier
        type: enum
        source: input
        description: Add-on tier (drives pricing)
        constraints: "values ∈ {SINGLE_PASS, MULTI_PASS}"
      - name: fee_cents
        type: integer
        source: computed
        description: "Final fee at allocation time (see calculation lightning_lane_addon_fee)"
        default: 0
      - name: status
        type: enum
        source: system
        description: Add-on lifecycle (see §1.2 LightningLaneAddOn state machine)
        constraints: "values ∈ {REQUESTED, ALLOCATED, REDEEMED, EXPIRED, CANCELLED}"
        default: REQUESTED
      - name: allocated_at
        type: datetime
        source: system
        description: Time of REQUESTED -> ALLOCATED
        default: null
      - name: redemption_window_end_utc
        type: datetime
        source: computed
        description: "Set on ALLOCATED = Reservation.slot_end_utc + 60 minutes; EXPIRED auto-transition triggered when clock passes this and status == ALLOCATED"
        default: null

  - name: NoShowFeeAssessment
    parent: null
    common_fields: false
    fields:
      - name: reservation_id
        type: string
        source: system
        description: FK -> Reservation.id; one assessment per NO_SHOW transition (1:1, append-only)
      - name: guest_id
        type: string
        source: system
        description: FK -> Guest.id; denormalized from Reservation for query
      - name: base_amount_cents
        type: integer
        source: system
        description: "Restaurant.no_show_base_fee_cents * Reservation.party_size at time of assessment"
      - name: character_surcharge_cents
        type: integer
        source: system
        description: "Surcharge component (see calculation no_show_fee_amount)"
      - name: repeat_offender_multiplier
        type: number
        source: system
        description: "Multiplier applied to base+surcharge per calculation no_show_fee_amount"
      - name: total_amount_cents
        type: integer
        source: system
        description: "Final fee = round_half_up((base_amount_cents + character_surcharge_cents) * repeat_offender_multiplier)"
      - name: assessed_at
        type: datetime
        source: system
        description: "UTC timestamp the assessment was created (same instant as Reservation.no_show_assessed_at)"

  - name: CreditLedgerEntry
    parent: null
    common_fields: false
    fields:
      - name: dining_plan_id
        type: string
        source: system
        description: FK -> DiningPlan.id; the plan whose credits moved
      - name: reservation_id
        type: string
        source: system
        description: FK -> Reservation.id; the reservation that caused the movement
      - name: entry_type
        type: enum
        source: system
        description: "Movement kind; values ∈ {HOLD, RELEASE, DEBIT, REFUND}"
      - name: credits_delta
        type: integer
        source: system
        description: "Signed credit change (positive HOLD/DEBIT decreases remaining, negative RELEASE/REFUND increases remaining); precision: integer credits"
      - name: posted_at
        type: datetime
        source: system
        description: UTC stamp at the moment the underlying Reservation transition committed

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Reservation
    initial_state: PENDING
    terminal_states: [COMPLETED, CANCELLED, NO_SHOW]
    transitions:
      - from: PENDING
        to: CONFIRMED
        trigger: "POST /reservations/{id}/confirm"
        actor: Guest
        preconditions:
          - "Reservation.status == PENDING"
          - "DiningPlan.status == ACTIVE AND DiningPlan covers Reservation.slot_start_utc (valid_from <= slot_start_utc < valid_until)"
          - "DiningPlan.table_service_credits_remaining - DiningPlan.table_service_credits_held >= Restaurant.dining_plan_credit_cost * party_size"
          - "ParkSession.status IN {NOT_STARTED, ACTIVE}"
          - "Guest.status == ACTIVE"
        side_effects:
          - "Set Reservation.credits_held = Restaurant.dining_plan_credit_cost * party_size (calculation dining_plan_credit_debit, provisional variant)"
          - "Increment DiningPlan.table_service_credits_held by credits_held"
          - "Append CreditLedgerEntry(entry_type=HOLD, credits_delta=+credits_held)"
          - "Set Reservation.confirmed_at = now()"

      - from: CONFIRMED
        to: CHECKED_IN
        trigger: "POST /reservations/{id}/check-in"
        actor: Guest
        preconditions:
          - "Reservation.status == CONFIRMED"
          - "current UTC time is within [Reservation.slot_start_utc - 15 minutes, Reservation.slot_end_utc] (15-min grace before)"
          - "ParkSession.status == ACTIVE"
        side_effects:
          - "Set Reservation.credits_debited = Restaurant.dining_plan_credit_cost * party_size (calculation dining_plan_credit_debit, final variant)"
          - "Decrement DiningPlan.table_service_credits_held by Reservation.credits_held"
          - "Decrement DiningPlan.table_service_credits_remaining by Reservation.credits_debited"
          - "Append CreditLedgerEntry(entry_type=DEBIT, credits_delta=+credits_debited)"
          - "Set Reservation.checked_in_at = now()"

      - from: CHECKED_IN
        to: SEATED
        trigger: "POST /reservations/{id}/seat"
        actor: Restaurant
        preconditions:
          - "Reservation.status == CHECKED_IN"
        side_effects:
          - "If AllergyMeal exists and AllergyMeal.status == REQUESTED, auto-transition AllergyMeal to ACKNOWLEDGED (cascade hop 1 of allergy_meal_cascade)"
          - "Set Reservation.updated_at = now()"

      - from: SEATED
        to: COMPLETED
        trigger: "POST /reservations/{id}/complete"
        actor: Restaurant
        preconditions:
          - "Reservation.status == SEATED"
        side_effects:
          - "If AllergyMeal exists and AllergyMeal.status == PREPARED, auto-transition AllergyMeal to SERVED (cascade hop 2 of allergy_meal_cascade)"
          - "If LightningLaneAddOn exists and status == ALLOCATED and current time <= redemption_window_end_utc, mark LightningLaneAddOn.status = REDEEMED"
          - "Set Reservation.updated_at = now()"

      - from: PENDING
        to: CANCELLED
        trigger: "POST /reservations/{id}/cancel"
        actor: Guest
        preconditions:
          - "Reservation.status == PENDING"
          - "expected_reservation_version matches Reservation.version (OCC)"
        side_effects:
          - "Set Reservation.status = CANCELLED"

      - from: CONFIRMED
        to: CANCELLED
        trigger: "POST /reservations/{id}/cancel"
        actor: Guest
        preconditions:
          - "Reservation.status == CONFIRMED"
          - "current UTC time < Reservation.slot_start_utc - 2 hours (free-cancel window)"
          - "expected_reservation_version matches Reservation.version (OCC)"
        side_effects:
          - "Decrement DiningPlan.table_service_credits_held by Reservation.credits_held (cascade hop: plan released)"
          - "Append CreditLedgerEntry(entry_type=RELEASE, credits_delta=-Reservation.credits_held)"
          - "If LightningLaneAddOn exists and status IN {REQUESTED, ALLOCATED}, set LightningLaneAddOn.status = CANCELLED (cascade hop: add-on cancelled)"
          - "Reservation.credits_held = 0"

      - from: CONFIRMED
        to: NO_SHOW
        trigger: "POST /_ops/no-show-sweep OR POST /reservations/{id}/mark-no-show"
        actor: system
        preconditions:
          - "Reservation.status == CONFIRMED"
          - "current UTC time > Reservation.slot_end_utc (grace fully elapsed)"
        side_effects:
          - "Increment Guest.no_show_strike_count by 1 (cascade hop 1 — guest)"
          - "If Guest.no_show_strike_count >= 5 after increment, set Guest.status = SUSPENDED (cascade hop 2 — guest account)"
          - "Create NoShowFeeAssessment per calculation no_show_fee_amount (cascade hop alt — fee ledger)"
          - "Decrement DiningPlan.table_service_credits_held by Reservation.credits_held"
          - "Append CreditLedgerEntry(entry_type=RELEASE, credits_delta=-Reservation.credits_held)"
          - "If AllergyMeal exists and AllergyMeal.status IN {REQUESTED, ACKNOWLEDGED}, set AllergyMeal.status = DECLINED with declined_reason='RESERVATION_NO_SHOW'"
          - "Reservation.credits_held = 0; set Reservation.no_show_assessed_at = now()"

  - entity: ParkSession
    initial_state: NOT_STARTED
    terminal_states: [CLOSED, CANCELLED]
    transitions:
      - from: NOT_STARTED
        to: ACTIVE
        trigger: "POST /park-sessions/{id}/activate"
        actor: Guest
        preconditions:
          - "ParkSession.status == NOT_STARTED"
          - "current UTC date (resort timezone projection) equals ParkSession.visit_date"
        side_effects:
          - "Set ParkSession.activated_at = now()"

      - from: ACTIVE
        to: CLOSED
        trigger: "POST /park-sessions/{id}/close"
        actor: Guest
        preconditions:
          - "ParkSession.status == ACTIVE"
        side_effects:
          - "Set ParkSession.closed_at = now()"

      - from: NOT_STARTED
        to: CANCELLED
        trigger: "POST /park-sessions/{id}/cancel"
        actor: Guest
        preconditions:
          - "ParkSession.status == NOT_STARTED"
        side_effects:
          - "Set ParkSession.closed_at = now()"
          - "Cascade hop 1: for every Reservation R with R.park_session_id = self.id and R.status IN {PENDING, CONFIRMED}, set R.status = CANCELLED (cascade-cancel). For each such R: if R.status was CONFIRMED, release R.credits_held back to DiningPlan (mirroring the CONFIRMED -> CANCELLED side effects) and append CreditLedgerEntry(RELEASE)."
          - "Cascade hop 2 (caused by hop 1): for every Reservation R newly CANCELLED above, if a LightningLaneAddOn LL exists for R with LL.status IN {REQUESTED, ALLOCATED}, set LL.status = CANCELLED. This second hop is triggered by the Reservation status change in hop 1, not by the original ParkSession.cancel."

  - entity: LightningLaneAddOn
    initial_state: REQUESTED
    terminal_states: [REDEEMED, EXPIRED, CANCELLED]
    transitions:
      - from: REQUESTED
        to: ALLOCATED
        trigger: "POST /lightning-lane-addons/{id}/allocate"
        actor: Guest
        preconditions:
          - "LightningLaneAddOn.status == REQUESTED"
          - "Reservation.status == CONFIRMED"
        side_effects:
          - "Set LightningLaneAddOn.fee_cents per calculation lightning_lane_addon_fee"
          - "Set LightningLaneAddOn.allocated_at = now()"
          - "Set LightningLaneAddOn.redemption_window_end_utc = Reservation.slot_end_utc + 60 minutes"

      - from: ALLOCATED
        to: REDEEMED
        trigger: "system (Reservation.SEATED -> COMPLETED cascade) OR POST /lightning-lane-addons/{id}/redeem"
        actor: system
        preconditions:
          - "LightningLaneAddOn.status == ALLOCATED"
          - "current UTC time <= LightningLaneAddOn.redemption_window_end_utc"
        side_effects:
          - "Set LightningLaneAddOn.updated_at = now()"

      - from: ALLOCATED
        to: EXPIRED
        trigger: "POST /_ops/lightning-lane-expiry-sweep"
        actor: system
        preconditions:
          - "LightningLaneAddOn.status == ALLOCATED"
          - "current UTC time > LightningLaneAddOn.redemption_window_end_utc"
        side_effects:
          - "Set LightningLaneAddOn.updated_at = now()"

      - from: REQUESTED
        to: CANCELLED
        trigger: "POST /lightning-lane-addons/{id}/cancel"
        actor: Guest
        preconditions:
          - "LightningLaneAddOn.status == REQUESTED"
        side_effects:
          - "Set LightningLaneAddOn.updated_at = now()"

  - entity: AllergyMeal
    initial_state: REQUESTED
    terminal_states: [SERVED, DECLINED]
    transitions:
      - from: REQUESTED
        to: ACKNOWLEDGED
        trigger: "POST /allergy-meals/{id}/acknowledge OR cascade from Reservation CHECKED_IN -> SEATED"
        actor: Restaurant
        preconditions:
          - "AllergyMeal.status == REQUESTED"
          - "Reservation.status IN {CONFIRMED, CHECKED_IN, SEATED}"
        side_effects:
          - "Set AllergyMeal.updated_at = now()"

      - from: ACKNOWLEDGED
        to: PREPARED
        trigger: "POST /allergy-meals/{id}/prepare"
        actor: Restaurant
        preconditions:
          - "AllergyMeal.status == ACKNOWLEDGED"
          - "Reservation.status == SEATED"
        side_effects:
          - "Set AllergyMeal.updated_at = now()"

      - from: PREPARED
        to: SERVED
        trigger: "POST /allergy-meals/{id}/serve OR cascade from Reservation SEATED -> COMPLETED"
        actor: Restaurant
        preconditions:
          - "AllergyMeal.status == PREPARED"
          - "Reservation.status IN {SEATED, COMPLETED}"
        side_effects:
          - "Set AllergyMeal.updated_at = now()"

      - from: ACKNOWLEDGED
        to: REQUESTED
        trigger: "POST /allergy-meals/{id}/revert-to-requested"
        actor: Restaurant
        preconditions:
          - "AllergyMeal.status == ACKNOWLEDGED"
          - "Reservation.status IN {CONFIRMED, CHECKED_IN}"
        side_effects:
          - "Set AllergyMeal.updated_at = now()"
        note: "Revert loop: kitchen may bounce the request back to REQUESTED to amend allergens"

      - from: REQUESTED
        to: DECLINED
        trigger: "POST /allergy-meals/{id}/decline"
        actor: Restaurant
        preconditions:
          - "AllergyMeal.status == REQUESTED"
          - "decline_reason is provided"
        side_effects:
          - "Set AllergyMeal.declined_reason = body.reason"

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: reservation-cancel-stale-version
    parent_entity: Reservation
    write_endpoint: "POST /reservations/{id}/cancel"
    occ_field: "expected_reservation_version"
    description: |
      Cancelling a Reservation whose version has advanced since the client last
      observed it is rejected. The race is: client reads version=N, in the
      meantime the kitchen or no-show sweep already mutated the reservation
      (e.g., NO_SHOW or auto cascade), and the client's stale-view cancel
      MUST NOT silently overwrite that newer terminal state.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: lightning-lane-allocate-stale-reservation-version
    parent_entity: Reservation
    write_endpoint: "POST /lightning-lane-addons/{id}/allocate"
    occ_field: "expected_reservation_version"
    description: |
      Allocating a Lightning Lane add-on against a Reservation whose version
      has advanced since the client last observed it is rejected. This guards
      the case where the reservation was cancelled or transitioned out of
      CONFIRMED between the client's read and this allocation request.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: dining_plan_credit_debit
    trigger: "Reservation PENDING -> CONFIRMED (provisional) AND Reservation CONFIRMED -> CHECKED_IN (final)"
    algorithm: aggregation
    formula: |
      provisional (at CONFIRM):
        credits_held = Restaurant.dining_plan_credit_cost * Reservation.party_size
        DiningPlan.table_service_credits_held += credits_held
      final (at CHECK_IN):
        credits_debited = Restaurant.dining_plan_credit_cost * Reservation.party_size_effective
        # party_size_effective uses the CURRENT Reservation.party_size at check-in,
        # which MAY differ from the booking-time party_size if a party-size patch
        # was applied (see POST /reservations/{id}/party-size). The variant
        # difference is exactly: provisional uses party_size at CONFIRM time,
        # final uses party_size at CHECK_IN time.
        DiningPlan.table_service_credits_held -= Reservation.credits_held
        DiningPlan.table_service_credits_remaining -= credits_debited
        # If credits_debited != credits_held, the delta is recorded as the second
        # CreditLedgerEntry (DEBIT with the actual finalized amount).
    input_set: "Reservation (status transitioning in this call), Restaurant.dining_plan_credit_cost, DiningPlan.table_service_credits_remaining and _held; excludes Reservations in CANCELLED, NO_SHOW, COMPLETED"
    constants: {}
    precision: "integer credits (no rounding)"
    variants:
      - name: provisional
        when: "at PENDING -> CONFIRMED"
        difference: "Uses party_size at the moment of CONFIRM; debits the held bucket; reversible via cancel"
      - name: final
        when: "at CONFIRMED -> CHECKED_IN"
        difference: "Uses party_size at the moment of CHECK_IN (may be lower if party_size was reduced); debits remaining and clears held; non-reversible"

  - name: no_show_fee_amount
    trigger: "Reservation CONFIRMED -> NO_SHOW"
    algorithm: tiered_pricing
    formula: |
      # Inputs (≥3): Restaurant.no_show_base_fee_cents, Restaurant.is_character_dining,
      # Reservation.party_size, Guest.no_show_strike_count.
      #
      # Evaluation order (PINNED — case-b PER-SEAT rounding):
      #   1. character_surcharge_per_seat = is_character_dining ? CHARACTER_SURCHARGE_PER_SEAT_CENTS : 0
      #   2. per_seat_pre_multiplier      = no_show_base_fee_cents + character_surcharge_per_seat
      #   3. strike_after                 = Guest.no_show_strike_count + 1  # this NO_SHOW counts
      #   4. tier multiplier selection (branch on Guest state):
      #        if strike_after <= REPEAT_OFFENDER_THRESHOLD:        repeat_offender_multiplier = 1.0
      #        elif strike_after <= REPEAT_OFFENDER_MAX:            repeat_offender_multiplier = REPEAT_OFFENDER_MULTIPLIER_TIER2
      #        else:                                                 repeat_offender_multiplier = REPEAT_OFFENDER_MULTIPLIER_TIER3
      #   5. per_seat_rounded_cents       = round_half_up(per_seat_pre_multiplier * repeat_offender_multiplier)   # FIRST round — per seat
      #   6. total_amount_cents           = per_seat_rounded_cents * Reservation.party_size                        # integer multiply, no further rounding
      #
      # Also computed and persisted on the NoShowFeeAssessment for transparency:
      #   base_amount_cents          = no_show_base_fee_cents * party_size
      #   character_surcharge_cents  = character_surcharge_per_seat * party_size
      #   repeat_offender_multiplier (decimal stored verbatim)
      #
      # ALTERNATIVE order (FORBIDDEN — produces different cents whenever per-seat fee has
      # a sub-cent fraction and party_size >= 2):
      #   total_alt = round_half_up((no_show_base_fee_cents + character_surcharge_per_seat) * party_size * multiplier)
      #
      # Concrete divergence example: base=2750, non-char, strike_after=2 (tier2 = 1.075),
      # party_size=2:
      #   per_seat_decimal = 2750 * 1.075 = 2956.25
      #   PINNED:    round_half_up(2956.25) = 2956; total = 2956 * 2 = 5912
      #   FORBIDDEN: round_half_up(2750 * 2 * 1.075) = round_half_up(5912.5) = 5913
    input_set: "Single Reservation (the one transitioning), its Restaurant, its Guest (with INCREMENTED strike count for this call)"
    constants:
      CHARACTER_SURCHARGE_PER_SEAT_CENTS: 1000
      REPEAT_OFFENDER_THRESHOLD: 1        # strike_after 1 -> tier1 (×1.0)
      REPEAT_OFFENDER_MAX: 3              # strike_after 2..3 -> tier2; 4+ -> tier3
      REPEAT_OFFENDER_MULTIPLIER_TIER2: 1.075
      REPEAT_OFFENDER_MULTIPLIER_TIER3: 1.250
    precision: "round_half_up to integer cents, applied exactly ONCE — on per_seat_rounded_cents; party_size multiply is integer arithmetic"

  - name: reservation_window_open_at
    trigger: "POST /reservations (validation pre-check)"
    algorithm: chronological
    formula: |
      # Window opens exactly 60 calendar days prior to the visit_date at
      # 06:00:00 resort wall-clock (America/New_York). The resort timezone
      # offset varies (EST vs EDT) so the UTC instant of window_open shifts
      # across DST boundaries.
      visit_local_midnight = datetime(visit_date.year, visit_date.month, visit_date.day, 6, 0, 0, tzinfo='America/New_York')
      window_open_utc = visit_local_midnight - timedelta(days=60)
      # converted to UTC for comparison with current UTC
      # Booking is allowed iff current_utc >= window_open_utc
      # Booking is rejected with ERR_OUTSIDE_BOOKING_WINDOW if current_utc < window_open_utc
      # Booking is also rejected (ERR_PAST_DINING_DATE) if visit_date is before current_utc.date() in resort timezone
    input_set: "Reservation candidate (slot_start_utc), ParkSession.visit_date"
    constants:
      LEAD_DAYS: 60
      DAILY_OPEN_LOCAL_HHMM: "06:00"
      RESORT_TZ: "America/New_York"
    precision: "second precision; visit_date arithmetic is by calendar day in resort timezone"

  - name: lightning_lane_addon_fee
    trigger: "LightningLaneAddOn REQUESTED -> ALLOCATED"
    algorithm: tiered_pricing
    formula: |
      # Inputs (≥3): Restaurant.is_character_dining, Restaurant.park_code,
      # LightningLaneAddOn.tier, Reservation.party_size.
      #
      # Evaluation order (PINNED — case-b nested rounding):
      #   1. base                        = BASE_CENTS[tier]                                  # tier lookup
      #   2. character_uplift            = is_character_dining ? CHARACTER_UPLIFT_CENTS : 0  # branch on entity state
      #   3. components_per_seat_decimal = (base + character_uplift) * PARK_MULT[park_code]  # may be fractional cents
      #   4. per_seat_rounded_cents      = round_half_up(components_per_seat_decimal)        # FIRST round — per seat
      #   5. fee_cents                   = per_seat_rounded_cents * Reservation.party_size   # integer multiply, no further rounding
      #
      # ALTERNATIVE order (FORBIDDEN — produces different cents for party_size >= 2 whenever
      # components_per_seat_decimal has a non-zero sub-cent fraction):
      #   fee_cents_alt = round_half_up((base + character_uplift) * PARK_MULT[park_code] * party_size)
      #
      # The two orderings diverge by up to (party_size - 1) cents per booking — e.g., a
      # MAGIC_KINGDOM SINGLE_PASS with character_uplift, party_size = 4:
      #   per_seat_decimal = (1500 + 500) * 1.175 = 2350.0          → already integer, no divergence
      # whereas a MULTI_PASS EPCOT non-character party_size=3 with PARK_MULT 1.075:
      #   per_seat_decimal = 2500 * 1.075 = 2687.5
      #   PINNED:    round_half_up(2687.5) = 2688; fee = 2688 * 3 = 8064
      #   FORBIDDEN: round_half_up(2687.5 * 3) = round_half_up(8062.5) = 8063
      # The PINNED order is the only correct answer.
    input_set: "Restaurant (park_code, is_character_dining), LightningLaneAddOn (tier), Reservation (party_size at allocation moment)"
    constants:
      BASE_CENTS:
        SINGLE_PASS: 1500
        MULTI_PASS: 2500
      PARK_MULT:
        MAGIC_KINGDOM: 1.175
        EPCOT: 1.075
        ANIMAL_KINGDOM: 1.000
        HOLLYWOOD_STUDIOS: 1.100
      CHARACTER_UPLIFT_CENTS: 500
    precision: "round_half_up to integer cents; rounding is applied exactly ONCE — on per_seat_rounded_cents (step 4); party_size multiply (step 5) is integer arithmetic with no further rounding"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and well-formed"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"

  - priority: 2
    category: auth
    check: "Role is permitted to invoke this endpoint per §1.7 RBAC"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: existence
    check: "Path-templated resource ids resolve, left-to-right"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all GETs and any endpoint with {id} in path"

  - priority: 4
    category: existence
    check: "Body-referenced foreign keys (guest_id, restaurant_id, park_session_id, dining_plan_id, reservation_id) resolve"
    error_id: ERR_FK_NOT_FOUND
    http_status: 404
    applies_to: "POST /reservations, POST /allergy-meals, POST /lightning-lane-addons"

  - priority: 5
    category: state
    check: "Target resource is in a state where this transition is valid (per §1.2)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all transition endpoints"

  - priority: 6
    category: state
    check: "OCC: when expected_<parent>_version is required (§1.2.1), it equals the parent's current version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /reservations/{id}/cancel, POST /lightning-lane-addons/{id}/allocate"

  - priority: 7
    category: business_safety
    check: "Guest.status == ACTIVE (suspended guests cannot create new reservations or LL add-ons)"
    error_id: ERR_GUEST_SUSPENDED
    http_status: 403
    applies_to: "POST /reservations, POST /lightning-lane-addons"

  - priority: 8
    category: business_safety
    check: "AllergyMeal allergen_codes is non-empty and every value ∈ allowed set"
    error_id: ERR_INVALID_ALLERGEN
    http_status: 422
    applies_to: "POST /allergy-meals"

  - priority: 9
    category: business_temporal
    check: "Reservation booking time is within the 60-day window per calculation reservation_window_open_at (current_utc >= window_open_utc)"
    error_id: ERR_OUTSIDE_BOOKING_WINDOW
    http_status: 422
    applies_to: "POST /reservations"

  - priority: 10
    category: business_temporal
    check: "Reservation visit_date (and slot_start_utc) is not in the past relative to current_utc in resort timezone"
    error_id: ERR_PAST_DINING_DATE
    http_status: 422
    applies_to: "POST /reservations"

  - priority: 11
    category: business_temporal
    check: "Reservation.slot_start_utc, projected to resort wall-clock, is in [Restaurant.opening_local_time, Restaurant.closing_local_time)"
    error_id: ERR_SLOT_OUTSIDE_HOURS
    http_status: 422
    applies_to: "POST /reservations"

  - priority: 12
    category: business_constraint
    check: "Reservation.slot_start_utc aligns to a 30-minute boundary from Restaurant.opening_local_time (no off-grid slots)"
    error_id: ERR_SLOT_MISALIGNED
    http_status: 422
    applies_to: "POST /reservations"

  - priority: 13
    category: business_constraint
    check: "Restaurant slot capacity not exceeded: sum(party_size of existing Reservations at this restaurant whose [slot_start_utc, slot_end_utc) overlaps the candidate AND status IN {PENDING, CONFIRMED, CHECKED_IN, SEATED}) + candidate party_size <= Restaurant.capacity_per_slot"
    error_id: ERR_SLOT_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /reservations"

  - priority: 14
    category: business_constraint
    check: "Per guest, no other Reservation in status IN {PENDING, CONFIRMED, CHECKED_IN, SEATED} whose [slot_start_utc - 60min, slot_end_utc + 60min] half-open buffer overlaps the candidate's [slot_start_utc, slot_end_utc) (one dining slot per 60-minute padded window across all parks)"
    error_id: ERR_GUEST_DOUBLE_BOOKING
    http_status: 409
    applies_to: "POST /reservations"

  - priority: 15
    category: business_referential
    check: "park_session_id refers to a ParkSession with status IN {NOT_STARTED, ACTIVE} AND park_code == Restaurant.park_code AND visit_date == resort-date(slot_start_utc)"
    error_id: ERR_PARK_SESSION_MISMATCH
    http_status: 409
    applies_to: "POST /reservations"

  - priority: 16
    category: business_fiscal
    check: "DiningPlan has enough credits: table_service_credits_remaining - table_service_credits_held >= Restaurant.dining_plan_credit_cost * party_size"
    error_id: ERR_INSUFFICIENT_CREDITS
    http_status: 422
    applies_to: "POST /reservations/{id}/confirm"

  - priority: 17
    category: business_fiscal
    check: "DiningPlan.status == ACTIVE AND DiningPlan covers slot_start_utc (valid_from <= slot_start_utc < valid_until)"
    error_id: ERR_PLAN_NOT_COVERING
    http_status: 409
    applies_to: "POST /reservations/{id}/confirm"

  - priority: 18
    category: business_constraint
    check: "Only one AllergyMeal per Reservation; only one LightningLaneAddOn per Reservation"
    error_id: ERR_ADDON_ALREADY_EXISTS
    http_status: 409
    applies_to: "POST /allergy-meals, POST /lightning-lane-addons"

  - priority: 19
    category: business_constraint
    check: "POST /reservations/{id}/party-size: new party_size must not exceed remaining slot capacity at restaurant and must not deplete (held+remaining) credit budget"
    error_id: ERR_PARTY_SIZE_PATCH_INFEASIBLE
    http_status: 422
    applies_to: "POST /reservations/{id}/party-size"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---- Guests ----
  - method: POST
    path: "/v1/guests"
    description: "Register a guest account"
    roles: [PlatformAdmin]
    code: 201
    input: [email, full_name, home_timezone]
    output: Guest
    side_effects: ["Initialize status=ACTIVE, no_show_strike_count=0"]

  - method: GET
    path: "/v1/guests/{id}"
    description: "Get guest by id"
    roles: [PlatformAdmin, Guest]
    code: 200
    input: []
    output: Guest
    side_effects: []

  # ---- Restaurants ----
  - method: POST
    path: "/v1/restaurants"
    description: "Register a restaurant"
    roles: [PlatformAdmin]
    code: 201
    input: ["name", "park_code", "capacity_per_slot", "slot_minutes?", "is_character_dining?", "dining_plan_credit_cost", "no_show_base_fee_cents", "opening_local_time", "closing_local_time"]
    output: Restaurant
    side_effects: []

  - method: GET
    path: "/v1/restaurants/{id}"
    description: "Get a restaurant"
    roles: [PlatformAdmin, Guest, Restaurant]
    code: 200
    input: []
    output: Restaurant
    side_effects: []

  - method: GET
    path: "/v1/restaurants"
    description: "List restaurants (supports filter by park_code)"
    roles: [PlatformAdmin, Guest, Restaurant]
    code: 200
    input: ["park_code?", "limit?", "offset?"]
    output: Restaurant[]
    side_effects: []

  # ---- ParkSessions ----
  - method: POST
    path: "/v1/park-sessions"
    description: "Create a ParkSession for a guest on a visit_date"
    roles: [Guest, PlatformAdmin]
    code: 201
    input: [guest_id, park_code, visit_date]
    output: ParkSession
    side_effects: ["status=NOT_STARTED"]

  - method: GET
    path: "/v1/park-sessions/{id}"
    description: "Get park session"
    roles: [PlatformAdmin, Guest]
    code: 200
    input: []
    output: ParkSession
    side_effects: []

  - method: GET
    path: "/v1/park-sessions"
    description: "List park sessions, optionally filtered by guest_id"
    roles: [PlatformAdmin, Guest]
    code: 200
    input: ["guest_id?", "limit?", "offset?"]
    output: ParkSession[]
    side_effects: []

  - method: POST
    path: "/v1/park-sessions/{id}/activate"
    description: "Activate the session when the guest taps into the park (NOT_STARTED -> ACTIVE)"
    roles: [Guest]
    code: 200
    input: []
    output: ParkSession
    side_effects: ["Set activated_at"]

  - method: POST
    path: "/v1/park-sessions/{id}/close"
    description: "Close an active session (ACTIVE -> CLOSED)"
    roles: [Guest]
    code: 200
    input: []
    output: ParkSession
    side_effects: ["Set closed_at"]

  - method: POST
    path: "/v1/park-sessions/{id}/cancel"
    description: "Cancel a NOT_STARTED session; cascades CANCELLED to all PENDING Reservations on it"
    roles: [Guest]
    code: 200
    input: []
    output: ParkSession
    side_effects: ["Cascade CANCELLED to PENDING reservations referencing this session"]

  # ---- DiningPlans ----
  - method: POST
    path: "/v1/dining-plans"
    description: "Issue a Dining Plan for a guest"
    roles: [PlatformAdmin]
    code: 201
    input: [guest_id, tier, table_service_credits_initial, valid_from, valid_until]
    output: DiningPlan
    side_effects: ["Initialize remaining = initial, held = 0, status=ACTIVE"]

  - method: GET
    path: "/v1/dining-plans/{id}"
    description: "Get dining plan"
    roles: [PlatformAdmin, Guest]
    code: 200
    input: []
    output: DiningPlan
    side_effects: []

  - method: GET
    path: "/v1/dining-plans"
    description: "List dining plans, optionally filtered by guest_id"
    roles: [PlatformAdmin, Guest]
    code: 200
    input: ["guest_id?", "limit?", "offset?"]
    output: DiningPlan[]
    side_effects: []

  # ---- Reservations ----
  - method: POST
    path: "/v1/reservations"
    description: "Create a PENDING reservation (booking)"
    roles: [Guest]
    code: 201
    input: [guest_id, restaurant_id, park_session_id, dining_plan_id, slot_start_utc, party_size]
    output: Reservation
    side_effects: ["Compute slot_end_utc; run all validations 7..15"]

  - method: GET
    path: "/v1/reservations/{id}"
    description: "Get a reservation"
    roles: [PlatformAdmin, Guest, Restaurant]
    code: 200
    input: []
    output: Reservation
    side_effects: []

  - method: GET
    path: "/v1/reservations"
    description: "List reservations, filtered by guest_id, restaurant_id, park_session_id, or dining_plan_id"
    roles: [PlatformAdmin, Guest, Restaurant]
    code: 200
    input: ["guest_id?", "restaurant_id?", "park_session_id?", "dining_plan_id?", "status?", "limit?", "offset?"]
    output: Reservation[]
    side_effects: []

  - method: POST
    path: "/v1/reservations/{id}/confirm"
    description: "PENDING -> CONFIRMED; holds DiningPlan credits"
    roles: [Guest]
    code: 200
    input: []
    output: Reservation
    side_effects: ["Hold credits per calculation dining_plan_credit_debit (provisional); append CreditLedgerEntry(HOLD)"]

  - method: POST
    path: "/v1/reservations/{id}/cancel"
    description: "Cancel a PENDING or CONFIRMED reservation (free-cancel window applies to CONFIRMED). OCC-guarded."
    roles: [Guest]
    code: 200
    input: [expected_reservation_version]
    output: Reservation
    side_effects: ["Release held credits if any; cascade CANCELLED to LightningLaneAddOn if REQUESTED/ALLOCATED; append CreditLedgerEntry(RELEASE); increments Reservation.version by 1"]

  - method: POST
    path: "/v1/reservations/{id}/check-in"
    description: "CONFIRMED -> CHECKED_IN; finalizes credit debit"
    roles: [Guest]
    code: 200
    input: []
    output: Reservation
    side_effects: ["Debit credits per calculation dining_plan_credit_debit (final); append CreditLedgerEntry(DEBIT)"]

  - method: POST
    path: "/v1/reservations/{id}/seat"
    description: "CHECKED_IN -> SEATED; cascades AllergyMeal REQUESTED -> ACKNOWLEDGED"
    roles: [Restaurant]
    code: 200
    input: []
    output: Reservation
    side_effects: ["Cascade AllergyMeal status if applicable"]

  - method: POST
    path: "/v1/reservations/{id}/complete"
    description: "SEATED -> COMPLETED; cascades AllergyMeal PREPARED -> SERVED and LightningLaneAddOn ALLOCATED -> REDEEMED"
    roles: [Restaurant]
    code: 200
    input: []
    output: Reservation
    side_effects: ["Cascade dependent entities"]

  - method: POST
    path: "/v1/reservations/{id}/mark-no-show"
    description: "Manual CONFIRMED -> NO_SHOW (cast member or platform admin); same side effects as ops-sweep"
    roles: [Restaurant, PlatformAdmin]
    code: 200
    input: []
    output: Reservation
    side_effects: ["Increment Guest.no_show_strike_count; suspend Guest if >=5; create NoShowFeeAssessment per no_show_fee_amount; release held credits; cascade AllergyMeal to DECLINED if applicable"]

  - method: POST
    path: "/v1/reservations/{id}/party-size"
    description: "Patch party_size on a PENDING or CONFIRMED reservation; re-validates slot capacity and credit budget"
    roles: [Guest]
    code: 200
    input: [party_size]
    output: Reservation
    side_effects: ["Recompute credits_held if status==CONFIRMED (provisional variant); adjust DiningPlan.table_service_credits_held; append CreditLedgerEntry(HOLD/RELEASE) for delta"]

  # ---- AllergyMeals ----
  - method: POST
    path: "/v1/allergy-meals"
    description: "Attach an allergy meal request to a reservation"
    roles: [Guest]
    code: 201
    input: ["reservation_id", "allergen_codes", "notes?"]
    output: AllergyMeal
    side_effects: ["Initialize status=REQUESTED"]

  - method: GET
    path: "/v1/allergy-meals/{id}"
    description: "Get allergy meal"
    roles: [PlatformAdmin, Guest, Restaurant]
    code: 200
    input: []
    output: AllergyMeal
    side_effects: []

  - method: GET
    path: "/v1/allergy-meals"
    description: "List allergy meals, filtered by reservation_id"
    roles: [PlatformAdmin, Guest, Restaurant]
    code: 200
    input: ["reservation_id?", "limit?", "offset?"]
    output: AllergyMeal[]
    side_effects: []

  - method: POST
    path: "/v1/allergy-meals/{id}/acknowledge"
    description: "REQUESTED -> ACKNOWLEDGED (kitchen ack)"
    roles: [Restaurant]
    code: 200
    input: []
    output: AllergyMeal
    side_effects: []

  - method: POST
    path: "/v1/allergy-meals/{id}/prepare"
    description: "ACKNOWLEDGED -> PREPARED"
    roles: [Restaurant]
    code: 200
    input: []
    output: AllergyMeal
    side_effects: []

  - method: POST
    path: "/v1/allergy-meals/{id}/serve"
    description: "PREPARED -> SERVED"
    roles: [Restaurant]
    code: 200
    input: []
    output: AllergyMeal
    side_effects: []

  - method: POST
    path: "/v1/allergy-meals/{id}/revert-to-requested"
    description: "ACKNOWLEDGED -> REQUESTED (revert loop)"
    roles: [Restaurant]
    code: 200
    input: []
    output: AllergyMeal
    side_effects: []

  - method: POST
    path: "/v1/allergy-meals/{id}/decline"
    description: "REQUESTED -> DECLINED (kitchen cannot accommodate)"
    roles: [Restaurant]
    code: 200
    input: [reason]
    output: AllergyMeal
    side_effects: ["Set declined_reason"]

  # ---- Lightning Lane Add-ons ----
  - method: POST
    path: "/v1/lightning-lane-addons"
    description: "Request a Lightning Lane add-on for a Reservation"
    roles: [Guest]
    code: 201
    input: [reservation_id, tier]
    output: LightningLaneAddOn
    side_effects: ["Initialize status=REQUESTED"]

  - method: GET
    path: "/v1/lightning-lane-addons/{id}"
    description: "Get add-on"
    roles: [PlatformAdmin, Guest]
    code: 200
    input: []
    output: LightningLaneAddOn
    side_effects: []

  - method: GET
    path: "/v1/lightning-lane-addons"
    description: "List add-ons, filtered by reservation_id"
    roles: [PlatformAdmin, Guest]
    code: 200
    input: ["reservation_id?", "limit?", "offset?"]
    output: LightningLaneAddOn[]
    side_effects: []

  - method: POST
    path: "/v1/lightning-lane-addons/{id}/allocate"
    description: "REQUESTED -> ALLOCATED; computes fee_cents per lightning_lane_addon_fee; OCC on Reservation.version"
    roles: [Guest]
    code: 200
    input: [expected_reservation_version]
    output: LightningLaneAddOn
    side_effects: ["Set fee_cents; set redemption_window_end_utc; increments Reservation.version by 1"]

  - method: POST
    path: "/v1/lightning-lane-addons/{id}/redeem"
    description: "ALLOCATED -> REDEEMED (manual fast-path; also auto on Reservation COMPLETED)"
    roles: [Guest, Restaurant]
    code: 200
    input: []
    output: LightningLaneAddOn
    side_effects: []

  - method: POST
    path: "/v1/lightning-lane-addons/{id}/cancel"
    description: "REQUESTED -> CANCELLED"
    roles: [Guest]
    code: 200
    input: []
    output: LightningLaneAddOn
    side_effects: []

  # ---- No-show fee assessments & credit ledger (read-only views) ----
  - method: GET
    path: "/v1/no-show-fee-assessments/{id}"
    description: "Get a single no-show fee assessment"
    roles: [PlatformAdmin, Guest]
    code: 200
    input: []
    output: NoShowFeeAssessment
    side_effects: []

  - method: GET
    path: "/v1/no-show-fee-assessments"
    description: "List no-show fee assessments, filtered by guest_id or reservation_id"
    roles: [PlatformAdmin, Guest]
    code: 200
    input: ["guest_id?", "reservation_id?", "limit?", "offset?"]
    output: NoShowFeeAssessment[]
    side_effects: []

  - method: GET
    path: "/v1/credit-ledger-entries/{id}"
    description: "Get a single credit ledger entry"
    roles: [PlatformAdmin, Guest]
    code: 200
    input: []
    output: CreditLedgerEntry
    side_effects: []

  - method: GET
    path: "/v1/credit-ledger-entries"
    description: "List credit ledger entries, filtered by dining_plan_id or reservation_id"
    roles: [PlatformAdmin, Guest]
    code: 200
    input: ["dining_plan_id?", "reservation_id?", "limit?", "offset?"]
    output: CreditLedgerEntry[]
    side_effects: []

  # ---- Ops / test-driving endpoints ----
  - method: POST
    path: "/v1/_clock/set_current_utc"
    description: "Set the server's virtual current UTC instant (test-driving; PRD describes as operator-tool)"
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: datetime }"
    side_effects: ["All subsequent time-based logic (window checks, no-show sweep, LL expiry) uses this clock"]

  - method: POST
    path: "/v1/_ops/no-show-sweep"
    description: "Run no-show sweep: every CONFIRMED reservation with slot_end_utc < current_utc transitions to NO_SHOW"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: "{ swept_count: integer, swept_reservation_ids: string[] }"
    side_effects: ["Per swept reservation: trigger CONFIRMED -> NO_SHOW (with full cascade)"]

  - method: POST
    path: "/v1/_ops/lightning-lane-expiry-sweep"
    description: "Expire add-ons whose redemption_window_end_utc has passed while status==ALLOCATED"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: "{ expired_count: integer, expired_addon_ids: string[] }"
    side_effects: ["ALLOCATED -> EXPIRED for each"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header missing/invalid"
  - id: ERR_FORBIDDEN
    http: 403
    condition: "Role not permitted to invoke this endpoint, OR role mismatch on resource ownership"
  - id: ERR_NOT_FOUND
    http: 404
    condition: "Path resource id does not resolve"
  - id: ERR_FK_NOT_FOUND
    http: 404
    condition: "Body-referenced foreign key does not resolve"
  - id: ERR_INVALID_STATE
    http: 409
    condition: "Target resource not in a valid state for this transition"
  - id: ERR_STALE_VERSION
    http: 412
    condition: "expected_<parent>_version does not match parent.version (OCC failure)"
  - id: ERR_GUEST_SUSPENDED
    http: 403
    condition: "Guest.status == SUSPENDED while attempting reservation/LL operations"
  - id: ERR_INVALID_ALLERGEN
    http: 422
    condition: "AllergyMeal.allergen_codes is empty or contains a non-allowed value"
  - id: ERR_OUTSIDE_BOOKING_WINDOW
    http: 422
    condition: "Booking attempted before reservation_window_open_at"
  - id: ERR_PAST_DINING_DATE
    http: 422
    condition: "Booking visit_date or slot is in the past in resort timezone"
  - id: ERR_SLOT_OUTSIDE_HOURS
    http: 422
    condition: "slot_start_utc projects to wall-clock outside [opening_local_time, closing_local_time)"
  - id: ERR_SLOT_MISALIGNED
    http: 422
    condition: "slot_start_utc not on a 30-minute grid from opening_local_time"
  - id: ERR_SLOT_CAPACITY_EXCEEDED
    http: 409
    condition: "Sum of overlapping reservation seats + candidate party_size > Restaurant.capacity_per_slot"
  - id: ERR_GUEST_DOUBLE_BOOKING
    http: 409
    condition: "Guest already has an overlapping (within 60-min buffer) reservation in non-terminal state"
  - id: ERR_PARK_SESSION_MISMATCH
    http: 409
    condition: "park_session_id mismatches restaurant.park_code or visit_date, or not in {NOT_STARTED, ACTIVE}"
  - id: ERR_INSUFFICIENT_CREDITS
    http: 422
    condition: "DiningPlan free credits (remaining - held) < dining_plan_credit_cost * party_size"
  - id: ERR_PLAN_NOT_COVERING
    http: 409
    condition: "DiningPlan not ACTIVE or does not cover slot_start_utc"
  - id: ERR_ADDON_ALREADY_EXISTS
    http: 409
    condition: "An AllergyMeal or LightningLaneAddOn already exists for this Reservation"
  - id: ERR_PARTY_SIZE_PATCH_INFEASIBLE
    http: 422
    condition: "Party-size patch would exceed slot capacity or credit budget"
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "Required body field missing, enum out of range, or type invalid"

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Guest
    description: "End-user theme park guest making and managing their own reservations"
    identity: "entity_backed:Guest"
    exclusive_operations:
      - "POST /v1/reservations (must own guest_id)"
      - "POST /v1/reservations/{id}/confirm (must own reservation)"
      - "POST /v1/reservations/{id}/check-in"
      - "POST /v1/reservations/{id}/cancel"
      - "POST /v1/reservations/{id}/party-size"
      - "POST /v1/park-sessions/{id}/activate"
      - "POST /v1/park-sessions/{id}/close"
      - "POST /v1/park-sessions/{id}/cancel"
      - "POST /v1/allergy-meals (must own underlying reservation)"
      - "POST /v1/lightning-lane-addons (must own underlying reservation)"
      - "POST /v1/lightning-lane-addons/{id}/allocate"
      - "POST /v1/lightning-lane-addons/{id}/cancel"
    shared_operations:
      - "GET /v1/restaurants, /v1/restaurants/{id}"
      - "GET /v1/reservations, /v1/reservations/{id} (own only)"
      - "GET /v1/dining-plans, /v1/dining-plans/{id} (own only)"
      - "GET /v1/park-sessions, /v1/park-sessions/{id} (own only)"
      - "GET /v1/allergy-meals, /v1/allergy-meals/{id} (own only)"
      - "GET /v1/lightning-lane-addons, /v1/lightning-lane-addons/{id} (own only)"
      - "GET /v1/guests/{id} (own only)"
      - "GET /v1/no-show-fee-assessments, /v1/no-show-fee-assessments/{id} (own only)"
      - "GET /v1/credit-ledger-entries (own only)"
      - "POST /v1/park-sessions (must own guest_id)"
      - "POST /v1/lightning-lane-addons/{id}/redeem"

  - name: Restaurant
    description: "Restaurant cast member operating the dining floor — seats guests, manages allergy meals"
    identity: "entity_backed:Restaurant"
    exclusive_operations:
      - "POST /v1/reservations/{id}/seat"
      - "POST /v1/reservations/{id}/complete"
      - "POST /v1/allergy-meals/{id}/acknowledge"
      - "POST /v1/allergy-meals/{id}/prepare"
      - "POST /v1/allergy-meals/{id}/serve"
      - "POST /v1/allergy-meals/{id}/revert-to-requested"
      - "POST /v1/allergy-meals/{id}/decline"
    shared_operations:
      - "POST /v1/reservations/{id}/mark-no-show"
      - "POST /v1/lightning-lane-addons/{id}/redeem"
      - "GET /v1/restaurants, /v1/restaurants/{id}"
      - "GET /v1/reservations, /v1/reservations/{id} (only at own restaurant)"
      - "GET /v1/allergy-meals, /v1/allergy-meals/{id} (only at own restaurant)"

  - name: PlatformAdmin
    description: "Operator who provisions guests, restaurants, plans, and drives ops sweeps & clock"
    identity: "opaque"
    exclusive_operations:
      - "POST /v1/guests"
      - "POST /v1/restaurants"
      - "POST /v1/dining-plans"
      - "POST /v1/_clock/set_current_utc"
      - "POST /v1/_ops/no-show-sweep"
      - "POST /v1/_ops/lightning-lane-expiry-sweep"
    shared_operations:
      - "POST /v1/reservations/{id}/mark-no-show"
      - "POST /v1/park-sessions (on behalf of guest)"
      - "GET /v1/guests/{id}"
      - "GET /v1/restaurants, /v1/restaurants/{id}"
      - "GET /v1/reservations, /v1/reservations/{id}"
      - "GET /v1/dining-plans, /v1/dining-plans/{id}"
      - "GET /v1/park-sessions, /v1/park-sessions/{id}"
      - "GET /v1/allergy-meals, /v1/allergy-meals/{id}"
      - "GET /v1/lightning-lane-addons, /v1/lightning-lane-addons/{id}"
      - "GET /v1/no-show-fee-assessments, /v1/no-show-fee-assessments/{id}"
      - "GET /v1/credit-ledger-entries"
