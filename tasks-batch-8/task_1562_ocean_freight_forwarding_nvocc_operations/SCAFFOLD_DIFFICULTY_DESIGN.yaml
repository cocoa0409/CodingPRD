# =============================================================================
# SCAFFOLD_DIFFICULTY_DESIGN.yaml — §1.8 Test Targeting Index
# Ocean Freight Forwarding & NVOCC Operations
# 9 rules x >=2 instances = 23 instances total
# =============================================================================
scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: demurrage_provisional_vs_final_divergence
        grounds:
          - calculations.demurrage_detention_charge
          - state_machines.ContainerAssignment.LOADED_to_DISCHARGED
          - state_machines.ContainerAssignment.DISCHARGED_to_GATED_OUT
          - state_machines.ContainerAssignment.GATED_OUT_to_EMPTY_RETURNED
          - entities.ContainerAssignment.fields.provisional_demurrage_cents
          - entities.ContainerAssignment.fields.demurrage_charge_cents
        distinguishing_aspect: |
          Same timestamps prefix, two variants: while the assignment is still
          DISCHARGED the provisional variant closes open intervals at the logical
          clock (2 chargeable days -> 30000 cents), while the final variant uses
          the real gate-out/return events (5 demurrage + 3 detention days ->
          141000 cents). Entity domain: ContainerAssignment (time-charge domain).
        test_recipe:
          setup:
            - "FCL booking (1x40HC, 18000kg/50cbm, CONTRACT rate 185000) DOCUMENTATION_CLEARED and LOADED on voyage EG101 (etd 2026-09-01, eta 2026-09-21)"
            - "Voyage departed at 2026-09-01T00:00:00Z and arrived at 2026-09-21T12:00:00Z; assignment DISCHARGED with discharged_at 2026-09-21T12:00:00Z"
            - "Contract free time: demurrage_free_days 4, detention_free_days 3; tiers (1-3:15000),(4-7:30000),(8+:60000); detention 12000/day"
          setup_api_calls:
            - { call: "POST /freight/shippers", payload: { legal_name: "ACME DUAL", credit_limit_cents: 100000000, credit_terms: "NET_30" }, as: OperationsManager, captures: { s: $.data.id } }
            - { call: "POST /freight/tariffs", payload: { tariff_code: "T-FCL-1", origin_port: "CNSHA", destination_port: "USLAX", commodity_type: "GENERAL", mode: "FCL", container_type: "40HC", rate_per_unit_cents: 185000, effective_from: "2026-08-01T00:00:00Z", effective_to: "2027-01-01T00:00:00Z" }, as: ComplianceOfficer, as_user_id: "co_1", captures: { t: $.data.id } }
            - { call: "POST /freight/tariffs/${t}/publish", payload: {}, as: ComplianceOfficer, as_user_id: "co_2" }
            - { call: "POST /freight/carrier-contracts", payload: { contract_number: "CARR-1", carrier_name: "MAERSK", service_lane: "CNSHA-USLAX", container_rates: [ { container_type: "40HC", rate_cents: 120000 } ], demurrage_free_days: 4, detention_free_days: 3, demurrage_tiers: [ { from_day: 1, to_day: 3, per_diem_cents: 15000 }, { from_day: 4, to_day: 7, per_diem_cents: 30000 }, { from_day: 8, to_day: null, per_diem_cents: 60000 } ], detention_per_diem_cents: 12000, service_start: "2026-01-01T00:00:00Z", service_end: "2026-12-31T00:00:00Z" }, as: OperationsManager, captures: { c: $.data.id } }
            - { call: "POST /freight/carrier-contracts/${c}/activate", payload: {}, as: OperationsManager }
            - { call: "POST /freight/voyages", payload: { vessel_name: "EVER GIVEN", voyage_number: "EG101", carrier_contract_id: "${c}", origin_port: "CNSHA", destination_port: "USLAX", etd: "2026-09-01T00:00:00Z", eta: "2026-09-21T00:00:00Z" }, as: OperationsManager, captures: { v: $.data.id } }
            - { call: "POST /freight/voyages/${v}/open-for-booking", payload: {}, as: OperationsManager }
            - { call: "POST /freight/bookings", payload: { voyage_id: "${v}", tariff_id: "${t}", rate_source: "CONTRACT", mode: "FCL", container_type: "40HC", container_count: 1, commodity_type: "GENERAL", gross_weight_kg: 18000, volume_cbm: 50.0, terms: "COLLECT" }, as: Shipper, as_user_id: "${s}", captures: { b: $.data.id } }
            - { call: "POST /freight/bookings/${b}/confirm", payload: {}, as: BookingCoordinator }
            - { call: "POST /freight/surety-bonds", payload: { bond_number: "BOND-1", surety_company: "SURETYCO", coverage_amount_cents: 7500000, effective_from: "2026-01-01T00:00:00Z", effective_to: "2027-01-01T00:00:00Z" }, as: ComplianceOfficer, captures: { bd: $.data.id } }
            - { call: "POST /freight/surety-bonds/${bd}/activate", payload: {}, as: ComplianceOfficer }
            - { call: "POST /freight/bill-of-lading", payload: { booking_id: "${b}", bl_type: "HOUSE", release_mode: "SEAWAY" }, as: DocumentationOfficer, as_user_id: "doc_1", captures: { bl: $.data.id } }
            - { call: "POST /freight/bill-of-lading/${bl}/issue", payload: {}, as: DocumentationOfficer, as_user_id: "doc_1" }
            - { call: "POST /freight/compliance-filings", payload: { booking_id: "${b}", filing_type: "ISF" }, as: ComplianceOfficer, captures: { f1: $.data.id } }
            - { call: "POST /freight/compliance-filings", payload: { booking_id: "${b}", filing_type: "AMS" }, as: ComplianceOfficer, captures: { f2: $.data.id } }
            - { call: "POST /freight/compliance-filings/${f1}/submit", payload: {}, as: ComplianceOfficer }
            - { call: "POST /freight/compliance-filings/${f1}/record-response", payload: { outcome: "ACCEPTED" }, as: ComplianceOfficer }
            - { call: "POST /freight/compliance-filings/${f2}/submit", payload: {}, as: ComplianceOfficer }
            - { call: "POST /freight/compliance-filings/${f2}/record-response", payload: { outcome: "ACCEPTED" }, as: ComplianceOfficer }
            - { call: "POST /freight/container-assignments", payload: { booking_id: "${b}", container_number: "MSKU1234567", stuffed_weight_kg: 18000, stuffed_volume_cbm: 50.0 }, as: BookingCoordinator, captures: { a: $.data.id } }
            - { call: "POST /freight/container-assignments/${a}/gate-in", payload: {}, as: BookingCoordinator }
            - { call: "POST /freight/_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: OperationsManager }
            - { call: "POST /freight/voyages/${v}/depart", payload: {}, as: OperationsManager }
            - { call: "POST /freight/_clock/set_current_utc", payload: { to_iso8601: "2026-09-21T12:00:00Z" }, as: OperationsManager }
            - { call: "POST /freight/voyages/${v}/arrive", payload: {}, as: OperationsManager }
            - { call: "POST /freight/_clock/set_current_utc", payload: { to_iso8601: "2026-09-27T12:00:00Z" }, as: OperationsManager }
          trigger:
            - { call: "GET /freight/container-assignments/${a}", payload: {}, as: Any, captures: { prov_dem: $.data.provisional_demurrage_cents, prov_det: $.data.provisional_detention_cents } }
            - { call: "POST /freight/_clock/set_current_utc", payload: { to_iso8601: "2026-09-30T12:00:00Z" }, as: OperationsManager }
            - { call: "POST /freight/container-assignments/${a}/gate-out", payload: {}, as: BookingCoordinator, captures: { fin_dem: $.data.demurrage_charge_cents, fin_dem_days: $.data.demurrage_days } }
            - { call: "POST /freight/_clock/set_current_utc", payload: { to_iso8601: "2026-10-06T12:00:00Z" }, as: OperationsManager }
            - { call: "POST /freight/container-assignments/${a}/empty-return", payload: {}, as: BookingCoordinator, captures: { fin_det: $.data.detention_charge_cents, fin_det_days: $.data.detention_days } }
            - { call: "GET /freight/invoices", payload: { booking_id: "${b}", invoice_type: "DEMURRAGE_DETENTION" }, as: Any, captures: { dd_total: "$.data[0].total_cents" } }
          assert:
            - "provisional read at 2026-09-27T12:00:00Z: ContainerAssignment.${a}.provisional_demurrage_cents == 30000 (6 full days - 4 free = 2 days @ 15000)"
            - "provisional read at 2026-09-27T12:00:00Z: ContainerAssignment.${a}.provisional_detention_cents == 0 (not yet gated out)"
            - "final at gate-out 2026-09-30: ContainerAssignment.${a}.demurrage_days == 5 and demurrage_charge_cents == 105000 (3x15000 + 2x30000)"
            - "final at empty-return 2026-10-06: ContainerAssignment.${a}.detention_days == 3 and detention_charge_cents == 36000 (3x12000)"
            - "auto-created DEMURRAGE_DETENTION invoice total_cents == 141000 (105000 + 36000)"
            - "provisional (30000) != final demurrage (105000) for the same discharged_at prefix"

      - name: credit_exposure_posted_vs_forward_divergence
        grounds:
          - calculations.credit_exposure
          - entities.Shipper.fields.credit_exposure_posted_cents
          - entities.Shipper.fields.credit_exposure_forward_cents
          - state_machines.Booking.QUOTED_to_CONFIRMED
        distinguishing_aspect: |
          Same shipper, same instant: posted variant counts only ISSUED/
          PARTIALLY_PAID invoice balances (0 here), forward variant adds the
          unbilled estimate of the CONFIRMED booking (77400). Entity domain:
          Shipper (credit-risk domain) — distinct from ContainerAssignment.
        test_recipe:
          setup:
            - "Shipper (limit 100000000, NET_30) with one CONFIRMED LCL booking (4000kg/6cbm, CONTRACT tariff 9500/RT min 20000) and no invoices"
          setup_api_calls:
            - { call: "POST /freight/shippers", payload: { legal_name: "ACME EXPO", credit_limit_cents: 100000000, credit_terms: "NET_30" }, as: OperationsManager, captures: { s: $.data.id } }
            - { call: "POST /freight/tariffs", payload: { tariff_code: "T-LCL-1", origin_port: "CNSHA", destination_port: "USLAX", commodity_type: "GENERAL", mode: "LCL", rate_per_unit_cents: 9500, minimum_charge_cents: 20000, effective_from: "2026-08-01T00:00:00Z", effective_to: "2027-01-01T00:00:00Z" }, as: ComplianceOfficer, as_user_id: "co_1", captures: { t: $.data.id } }
            - { call: "POST /freight/tariffs/${t}/publish", payload: {}, as: ComplianceOfficer, as_user_id: "co_2" }
            - { call: "POST /freight/carrier-contracts", payload: { contract_number: "CARR-1", carrier_name: "MAERSK", service_lane: "CNSHA-USLAX", container_rates: [ { container_type: "40HC", rate_cents: 120000 } ], demurrage_free_days: 4, detention_free_days: 3, demurrage_tiers: [ { from_day: 1, to_day: 3, per_diem_cents: 15000 }, { from_day: 4, to_day: 7, per_diem_cents: 30000 }, { from_day: 8, to_day: null, per_diem_cents: 60000 } ], detention_per_diem_cents: 12000, service_start: "2026-01-01T00:00:00Z", service_end: "2026-12-31T00:00:00Z" }, as: OperationsManager, captures: { c: $.data.id } }
            - { call: "POST /freight/carrier-contracts/${c}/activate", payload: {}, as: OperationsManager }
            - { call: "POST /freight/voyages", payload: { vessel_name: "EVER GIVEN", voyage_number: "EG101", carrier_contract_id: "${c}", origin_port: "CNSHA", destination_port: "USLAX", etd: "2026-09-01T00:00:00Z", eta: "2026-09-21T00:00:00Z" }, as: OperationsManager, captures: { v: $.data.id } }
            - { call: "POST /freight/voyages/${v}/open-for-booking", payload: {}, as: OperationsManager }
            - { call: "POST /freight/bookings", payload: { voyage_id: "${v}", tariff_id: "${t}", rate_source: "CONTRACT", mode: "LCL", commodity_type: "GENERAL", gross_weight_kg: 4000, volume_cbm: 6.0, terms: "PREPAID" }, as: Shipper, as_user_id: "${s}", captures: { b: $.data.id } }
            - { call: "POST /freight/bookings/${b}/confirm", payload: {}, as: BookingCoordinator }
          trigger:
            - { call: "GET /freight/shippers/${s}", payload: {}, as: Any, captures: { posted: $.data.credit_exposure_posted_cents, forward: $.data.credit_exposure_forward_cents } }
          assert:
            - "Shipper.${s}.credit_exposure_posted_cents == 0 (no ISSUED/PARTIALLY_PAID invoices)"
            - "Shipper.${s}.credit_exposure_forward_cents == 77400 (unbilled estimate of the CONFIRMED booking: base 57000 + BAF 5700 + THC 7200 + DOC 7500)"
            - "forward (77400) > posted (0): the two variants disagree for identical invoice state"

      - name: contract_vs_spot_rate_freight_divergence
        grounds:
          - calculations.ocean_freight_charge
          - entities.Booking.fields.rate_source
          - entities.Booking.fields.estimated_freight_cents
        distinguishing_aspect: |
          Identical cargo, voyage, and tariff: rate_source CONTRACT sells at the
          tariff rate 9500/RT (77400 total), rate_source SPOT sells at the agreed
          8000/RT (67500 total). Entity domain: Booking (sell-side revenue) —
          a third domain distinct from ContainerAssignment and Shipper.
        test_recipe:
          setup:
            - "Shipper, published LCL tariff 9500/RT min 20000, active contract, voyage BOOKING_OPEN"
            - "Two identical LCL bookings (4000kg/6cbm) differing only in rate_source"
          setup_api_calls:
            - { call: "POST /freight/shippers", payload: { legal_name: "ACME RATE", credit_limit_cents: 100000000, credit_terms: "NET_30" }, as: OperationsManager, captures: { s: $.data.id } }
            - { call: "POST /freight/tariffs", payload: { tariff_code: "T-LCL-1", origin_port: "CNSHA", destination_port: "USLAX", commodity_type: "GENERAL", mode: "LCL", rate_per_unit_cents: 9500, minimum_charge_cents: 20000, effective_from: "2026-08-01T00:00:00Z", effective_to: "2027-01-01T00:00:00Z" }, as: ComplianceOfficer, as_user_id: "co_1", captures: { t: $.data.id } }
            - { call: "POST /freight/tariffs/${t}/publish", payload: {}, as: ComplianceOfficer, as_user_id: "co_2" }
            - { call: "POST /freight/carrier-contracts", payload: { contract_number: "CARR-1", carrier_name: "MAERSK", service_lane: "CNSHA-USLAX", container_rates: [ { container_type: "40HC", rate_cents: 120000 } ], demurrage_free_days: 4, detention_free_days: 3, demurrage_tiers: [ { from_day: 1, to_day: 3, per_diem_cents: 15000 }, { from_day: 4, to_day: 7, per_diem_cents: 30000 }, { from_day: 8, to_day: null, per_diem_cents: 60000 } ], detention_per_diem_cents: 12000, service_start: "2026-01-01T00:00:00Z", service_end: "2026-12-31T00:00:00Z" }, as: OperationsManager, captures: { c: $.data.id } }
            - { call: "POST /freight/carrier-contracts/${c}/activate", payload: {}, as: OperationsManager }
            - { call: "POST /freight/voyages", payload: { vessel_name: "EVER GIVEN", voyage_number: "EG101", carrier_contract_id: "${c}", origin_port: "CNSHA", destination_port: "USLAX", etd: "2026-09-01T00:00:00Z", eta: "2026-09-21T00:00:00Z" }, as: OperationsManager, captures: { v: $.data.id } }
            - { call: "POST /freight/voyages/${v}/open-for-booking", payload: {}, as: OperationsManager }
            - { call: "POST /freight/bookings", payload: { voyage_id: "${v}", tariff_id: "${t}", rate_source: "CONTRACT", mode: "LCL", commodity_type: "GENERAL", gross_weight_kg: 4000, volume_cbm: 6.0, terms: "PREPAID" }, as: Shipper, as_user_id: "${s}", captures: { b_contract: $.data.id, est_contract: $.data.estimated_freight_cents } }
            - { call: "POST /freight/bookings", payload: { voyage_id: "${v}", tariff_id: "${t}", rate_source: "SPOT", spot_rate_per_unit_cents: 8000, mode: "LCL", commodity_type: "GENERAL", gross_weight_kg: 4000, volume_cbm: 6.0, terms: "PREPAID" }, as: Shipper, as_user_id: "${s}", captures: { b_spot: $.data.id, est_spot: $.data.estimated_freight_cents } }
          trigger:
            - { call: "GET /freight/bookings/${b_contract}", payload: {}, as: Any }
            - { call: "GET /freight/bookings/${b_spot}", payload: {}, as: Any }
          assert:
            - "Booking.${b_contract}.estimated_freight_cents == 77400 (6.0 RT x 9500 = 57000 base; + BAF 5700 + THC 7200 + DOC 7500)"
            - "Booking.${b_spot}.estimated_freight_cents == 67500 (6.0 RT x 8000 = 48000 base; + BAF 4800 + THC 7200 + DOC 7500)"
            - "est_contract - est_spot == 9900 for byte-identical cargo"

  - rule_id: combinatorial_formula
    instances:
      - name: ocean_freight_lcl_wm_rule_minimum_floor_mode_a
        grounds:
          - calculations.ocean_freight_charge
          - calculations.chargeable_weight_revenue_tons
          - entities.Booking.fields.chargeable_weight_rt
        distinguishing_aspect: |
          Mode (a) — >=3 inputs with non-linear interaction: the W/M max()
          (4000kg -> 4.0 RT loses to 6.0 cbm -> 6.0 RT), the LCL minimum-charge
          floor max(57000, 20000), the mode branch (LCL vs FCL THC formula),
          and the dual rate source. Asserts pin the exact composed result 77400.
        test_recipe:
          setup:
            - "Shipper, published LCL tariff 9500/RT min 20000, active contract, voyage BOOKING_OPEN"
          setup_api_calls:
            - { call: "POST /freight/shippers", payload: { legal_name: "ACME WM", credit_limit_cents: 100000000 }, as: OperationsManager, captures: { s: $.data.id } }
            - { call: "POST /freight/tariffs", payload: { tariff_code: "T-LCL-1", origin_port: "CNSHA", destination_port: "USLAX", commodity_type: "GENERAL", mode: "LCL", rate_per_unit_cents: 9500, minimum_charge_cents: 20000, effective_from: "2026-08-01T00:00:00Z", effective_to: "2027-01-01T00:00:00Z" }, as: ComplianceOfficer, as_user_id: "co_1", captures: { t: $.data.id } }
            - { call: "POST /freight/tariffs/${t}/publish", payload: {}, as: ComplianceOfficer, as_user_id: "co_2" }
            - { call: "POST /freight/carrier-contracts", payload: { contract_number: "CARR-1", carrier_name: "MAERSK", service_lane: "CNSHA-USLAX", container_rates: [ { container_type: "40HC", rate_cents: 120000 } ], demurrage_free_days: 4, detention_free_days: 3, demurrage_tiers: [ { from_day: 1, to_day: 3, per_diem_cents: 15000 }, { from_day: 4, to_day: 7, per_diem_cents: 30000 }, { from_day: 8, to_day: null, per_diem_cents: 60000 } ], detention_per_diem_cents: 12000, service_start: "2026-01-01T00:00:00Z", service_end: "2026-12-31T00:00:00Z" }, as: OperationsManager, captures: { c: $.data.id } }
            - { call: "POST /freight/carrier-contracts/${c}/activate", payload: {}, as: OperationsManager }
            - { call: "POST /freight/voyages", payload: { vessel_name: "EVER GIVEN", voyage_number: "EG101", carrier_contract_id: "${c}", origin_port: "CNSHA", destination_port: "USLAX", etd: "2026-09-01T00:00:00Z", eta: "2026-09-21T00:00:00Z" }, as: OperationsManager, captures: { v: $.data.id } }
            - { call: "POST /freight/voyages/${v}/open-for-booking", payload: {}, as: OperationsManager }
          trigger:
            - { call: "POST /freight/bookings", payload: { voyage_id: "${v}", tariff_id: "${t}", rate_source: "CONTRACT", mode: "LCL", commodity_type: "GENERAL", gross_weight_kg: 4000, volume_cbm: 6.0, terms: "PREPAID" }, as: Shipper, as_user_id: "${s}", captures: { b: $.data.id, rt: $.data.chargeable_weight_rt, est: $.data.estimated_freight_cents } }
          assert:
            - "Booking.${b}.chargeable_weight_rt == 6.0 (volume 6.0 cbm beats weight 4000kg/1000 = 4.0 under W/M)"
            - "Booking.${b}.estimated_freight_cents == 77400"
            - "decomposition: base = max(6.0 x 9500, 20000) = 57000; BAF = round(57000 x 0.10) = 5700; THC = 6.0 x 1200 = 7200; DOC = 7500; total 77400"

      - name: invoice_per_line_rounding_order_mode_b
        grounds:
          - calculations.invoice_total
          - entities.Invoice.fields.lines
          - entities.Invoice.fields.total_cents
          - concurrency_rules[invoice-adjustment-stale-version]
        distinguishing_aspect: |
          Mode (b) — nested rounding where order matters: two adjustment lines of
          quantity 0.5 x 2999 cents. Pinned order (round each line, then sum)
          yields 1500 + 1500 = 3000; the forbidden order (sum raw then round)
          yields round(2999.0) = 2999. The 1-cent divergence is the assertion.
        test_recipe:
          setup:
            - "CONFIRMED LCL booking (estimate 77400) with its FREIGHT invoice created (DRAFT, version 1, total 77400)"
          setup_api_calls:
            - { call: "POST /freight/shippers", payload: { legal_name: "ACME RND", credit_limit_cents: 100000000 }, as: OperationsManager, captures: { s: $.data.id } }
            - { call: "POST /freight/tariffs", payload: { tariff_code: "T-LCL-1", origin_port: "CNSHA", destination_port: "USLAX", commodity_type: "GENERAL", mode: "LCL", rate_per_unit_cents: 9500, minimum_charge_cents: 20000, effective_from: "2026-08-01T00:00:00Z", effective_to: "2027-01-01T00:00:00Z" }, as: ComplianceOfficer, as_user_id: "co_1", captures: { t: $.data.id } }
            - { call: "POST /freight/tariffs/${t}/publish", payload: {}, as: ComplianceOfficer, as_user_id: "co_2" }
            - { call: "POST /freight/carrier-contracts", payload: { contract_number: "CARR-1", carrier_name: "MAERSK", service_lane: "CNSHA-USLAX", container_rates: [ { container_type: "40HC", rate_cents: 120000 } ], demurrage_free_days: 4, detention_free_days: 3, demurrage_tiers: [ { from_day: 1, to_day: 3, per_diem_cents: 15000 }, { from_day: 4, to_day: 7, per_diem_cents: 30000 }, { from_day: 8, to_day: null, per_diem_cents: 60000 } ], detention_per_diem_cents: 12000, service_start: "2026-01-01T00:00:00Z", service_end: "2026-12-31T00:00:00Z" }, as: OperationsManager, captures: { c: $.data.id } }
            - { call: "POST /freight/carrier-contracts/${c}/activate", payload: {}, as: OperationsManager }
            - { call: "POST /freight/voyages", payload: { vessel_name: "EVER GIVEN", voyage_number: "EG101", carrier_contract_id: "${c}", origin_port: "CNSHA", destination_port: "USLAX", etd: "2026-09-01T00:00:00Z", eta: "2026-09-21T00:00:00Z" }, as: OperationsManager, captures: { v: $.data.id } }
            - { call: "POST /freight/voyages/${v}/open-for-booking", payload: {}, as: OperationsManager }
            - { call: "POST /freight/bookings", payload: { voyage_id: "${v}", tariff_id: "${t}", rate_source: "CONTRACT", mode: "LCL", commodity_type: "GENERAL", gross_weight_kg: 4000, volume_cbm: 6.0, terms: "PREPAID" }, as: Shipper, as_user_id: "${s}", captures: { b: $.data.id } }
            - { call: "POST /freight/bookings/${b}/confirm", payload: {}, as: BookingCoordinator }
            - { call: "POST /freight/invoices", payload: { booking_id: "${b}", invoice_type: "FREIGHT" }, as: FinanceController, captures: { inv: $.data.id, inv_v: $.data.version, inv_total: $.data.total_cents } }
          trigger:
            - { call: "POST /freight/invoices/${inv}/adjustments", payload: { description: "SURCH-1", quantity: 0.5, unit_rate_cents: 2999, expected_invoice_version: "${inv_v}" }, as: FinanceController, captures: { inv_v2: $.data.version, total_after_1: $.data.total_cents } }
            - { call: "POST /freight/invoices/${inv}/adjustments", payload: { description: "SURCH-2", quantity: 0.5, unit_rate_cents: 2999, expected_invoice_version: "${inv_v2}" }, as: FinanceController, captures: { total_after_2: $.data.total_cents } }
          assert:
            - "Invoice.${inv} initial total_cents == 77400"
            - "after first adjustment: total_cents == 78900 (77400 + round_half_up(0.5 x 2999) = 77400 + 1500)"
            - "after second adjustment: total_cents == 80400, NOT 80399 (sum-then-round would give 77400 + round(2999.0) = 80399)"
            - "Invoice.${inv}.version == 3 after both adjustments (OCC field bumped per write)"

      - name: insured_value_premium_pinned_evaluation_order_mode_c
        grounds:
          - calculations.insured_value_premium
          - entities.CargoInsurancePolicy.fields.insured_value_cents
          - entities.CargoInsurancePolicy.fields.premium_cents
          - entities.CargoInsurancePolicy.fields.freight_base_cents
        distinguishing_aspect: |
          Mode (c) — circular-looking dependency with pinned evaluation order:
          chargeable weight -> freight BASE (excludes BAF/THC/DOC) -> insured =
          (cargo + base) x 1.10 -> premium = max(floor, insured x rate); the
          premium later feeds invoice totals and credit exposure but never feeds
          back into this computation. Asserts pin base 57000, insured 5562700,
          premium 33376.
        test_recipe:
          setup:
            - "CONFIRMED LCL booking: 4000kg/6cbm CONTRACT 9500/RT -> freight base 57000 (BAF/THC/DOC excluded from base)"
          setup_api_calls:
            - { call: "POST /freight/shippers", payload: { legal_name: "ACME INS", credit_limit_cents: 100000000 }, as: OperationsManager, captures: { s: $.data.id } }
            - { call: "POST /freight/tariffs", payload: { tariff_code: "T-LCL-1", origin_port: "CNSHA", destination_port: "USLAX", commodity_type: "GENERAL", mode: "LCL", rate_per_unit_cents: 9500, minimum_charge_cents: 20000, effective_from: "2026-08-01T00:00:00Z", effective_to: "2027-01-01T00:00:00Z" }, as: ComplianceOfficer, as_user_id: "co_1", captures: { t: $.data.id } }
            - { call: "POST /freight/tariffs/${t}/publish", payload: {}, as: ComplianceOfficer, as_user_id: "co_2" }
            - { call: "POST /freight/carrier-contracts", payload: { contract_number: "CARR-1", carrier_name: "MAERSK", service_lane: "CNSHA-USLAX", container_rates: [ { container_type: "40HC", rate_cents: 120000 } ], demurrage_free_days: 4, detention_free_days: 3, demurrage_tiers: [ { from_day: 1, to_day: 3, per_diem_cents: 15000 }, { from_day: 4, to_day: 7, per_diem_cents: 30000 }, { from_day: 8, to_day: null, per_diem_cents: 60000 } ], detention_per_diem_cents: 12000, service_start: "2026-01-01T00:00:00Z", service_end: "2026-12-31T00:00:00Z" }, as: OperationsManager, captures: { c: $.data.id } }
            - { call: "POST /freight/carrier-contracts/${c}/activate", payload: {}, as: OperationsManager }
            - { call: "POST /freight/voyages", payload: { vessel_name: "EVER GIVEN", voyage_number: "EG101", carrier_contract_id: "${c}", origin_port: "CNSHA", destination_port: "USLAX", etd: "2026-09-01T00:00:00Z", eta: "2026-09-21T00:00:00Z" }, as: OperationsManager, captures: { v: $.data.id } }
            - { call: "POST /freight/voyages/${v}/open-for-booking", payload: {}, as: OperationsManager }
            - { call: "POST /freight/bookings", payload: { voyage_id: "${v}", tariff_id: "${t}", rate_source: "CONTRACT", mode: "LCL", commodity_type: "GENERAL", gross_weight_kg: 4000, volume_cbm: 6.0, terms: "PREPAID" }, as: Shipper, as_user_id: "${s}", captures: { b: $.data.id } }
            - { call: "POST /freight/bookings/${b}/confirm", payload: {}, as: BookingCoordinator }
          trigger:
            - { call: "POST /freight/insurance-policies", payload: { booking_id: "${b}", coverage_type: "ALL_RISK", cargo_value_cents: 5000000 }, as: BookingCoordinator, captures: { p: $.data.id, base: $.data.freight_base_cents, insured: $.data.insured_value_cents, premium: $.data.premium_cents } }
          assert:
            - "CargoInsurancePolicy.${p}.freight_base_cents == 57000 (ocean freight base only; BAF/THC/DOC excluded by pinned order)"
            - "CargoInsurancePolicy.${p}.insured_value_cents == 5562700 (round_half_up((5000000 + 57000) x 1.10))"
            - "CargoInsurancePolicy.${p}.premium_cents == 33376 (max(2500, round_half_up(5562700 x 0.006)) = round_half_up(33376.2))"
            - "CargoInsurancePolicy.${p}.status == QUOTED"

  - rule_id: non_linear_state_machine
    instances:
      - name: bill_of_lading_amendment_cycle_with_booking_revert
        grounds:
          - state_machines.BillOfLading.ISSUED_to_AMENDMENT_PENDING
          - state_machines.BillOfLading.AMENDMENT_PENDING_to_DRAFT
          - state_machines.BillOfLading.DRAFT_to_ISSUED
          - state_machines.Booking.CONFIRMED_to_DOCUMENTATION_CLEARED
        distinguishing_aspect: |
          Cyclic machine on BillOfLading: DRAFT -> ISSUED -> AMENDMENT_PENDING
          -> DRAFT -> ISSUED. The cycle is not free-spinning: reissue reverts a
          DOCUMENTATION_CLEARED booking back to CONFIRMED, and re-issue restores
          it, proving the compound doc-clearance gate re-evaluates on each pass.
