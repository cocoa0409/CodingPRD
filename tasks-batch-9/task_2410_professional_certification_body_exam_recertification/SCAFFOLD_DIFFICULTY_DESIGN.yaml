            - "ExamRegistration.${reg_id}.seat_status is still SCHEDULED, so the candidate legitimately holds two seats once they are far enough apart"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:

      - name: seat_ledger_returns_to_zero_after_cancellation_and_the_freed_seat_is_reclaimable
        grounds:
          - state_machines.ExamRegistration.SCHEDULED_to_UNSCHEDULED
          - calculations.session_seat_occupancy
          - validations[priority=46]
          - errors.ERR_SESSION_FULL
          - concurrency_rules.schedule-seat-stale-session
          - entities.ExamSession.computed_fields.seats_reserved
          - entities.ExamRegistration.fields.session_ends_at
        distinguishing_aspect: |
          seats_reserved is a derived ledger that must be exactly compensated, not merely
          decremented: on a seat_capacity 1 session the first schedule takes it to 1 and FULL,
          a rival is refused ERR_SESSION_FULL, and cancel-schedule must bring it back to
          precisely 0 / OPEN — after which the rival's schedule succeeds and the ledger reads
          exactly 1 again, never 2 and never -1. The session's version increments on each
          accepted mutation and NOT on the refused one, so each schedule needs a freshly read
          expected_session_version while session_ends_at survives the cancellation for
          retake-wait arithmetic.
        test_recipe:
          setup:
            - "One ACTIVE programme CPX (form_length 1, domain_specs [{D1, 100, min_operational_items 1}], psychometric_stat_basis POOLED, min_panelists 1, panel_trim_count 0, audit_every_nth 7) with one OPERATIONAL item and one PUBLISHED form."
