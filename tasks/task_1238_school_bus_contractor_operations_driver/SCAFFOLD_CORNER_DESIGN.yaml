          assert:
            - "${err} == ERR_FORBIDDEN_ROLE"
            - "HTTP status 403"
      - name: award_contract_wrong_district_returns_forbidden
        claim_type: violation_to_error
        grounds:
          - validations[priority=5]
          - "errors[ERR_FORBIDDEN_OWNERSHIP]"
        distinguishing_aspect: "DistrictAdmin of district X cannot award a contract belonging to district Y — entity-backed identity (X-User-ID == district id) mismatch -> ERR_FORBIDDEN_OWNERSHIP."
        test_recipe:
          setup: ["districts X and Y; contract on Y in SUBMITTED"]
          setup_api_calls:
            - { call: "POST /busops/districts", payload: { name: "D-VAL4X", region_fuel_index_code: "WEST", credit_limit_cents: 5000000, billing_dispute_window_days: 30 }, as: SystemAdmin, captures: { dx: $.data.id } }
            - { call: "POST /busops/districts", payload: { name: "D-VAL4Y", region_fuel_index_code: "WEST", credit_limit_cents: 5000000, billing_dispute_window_days: 30 }, as: SystemAdmin, captures: { dy: $.data.id } }
            - { call: "POST /busops/contracts", payload: { district_id: "${dy}", bid_reference: "BID-V4", daily_rate_per_bus_cents: 50000, school_days_per_year: 180, fuel_base_price_cents: 400, penalty_mode: "FLAT_PER_ROUTE", shortage_penalty_flat_cents: 15000, shortage_penalty_per_student_minute_cents: 25, assumed_minutes_per_missed_route: 45, monthly_cap_cents: 10000000, charter_hourly_rate_cents: 12000, charter_per_mile_cents: 250, start_date: "2026-01-01", end_date: "2026-12-31" }, as: ContractorOps, captures: { c_id: $.data.id } }
            - { call: "POST /busops/contracts/${c_id}/submit", payload: {}, as: ContractorOps }
