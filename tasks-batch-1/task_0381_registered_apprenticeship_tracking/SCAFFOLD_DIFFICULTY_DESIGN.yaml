  - rule_id: non_linear_state_machine
    instances:
      - name: agreement_suspend_reinstate_cycle_and_branch
        grounds:
          - state_machines.ApprenticeAgreement.ACTIVE_to_SUSPENDED
          - state_machines.ApprenticeAgreement.SUSPENDED_to_ACTIVE
          - state_machines.ApprenticeAgreement.ACTIVE_to_CANCELLED
        distinguishing_aspect: |
          ApprenticeAgreement is non-linear: ACTIVE->SUSPENDED->ACTIVE is a revision cycle, and
          from ACTIVE it can branch to either COMPLETED or CANCELLED. Re-entering ACTIVE via
          reinstate must be observable (status ACTIVE again after a round trip).
        test_recipe:
          setup:
            - "ACTIVE agreement AGR under an ACTIVE HOURS_BASED program with a QUALIFIED journeyworker."
          setup_api_calls:
            - call: "POST /apprenticeship/sponsors"
              payload: { legal_name: "Cycle Co", ein: "55-5555555", contact_email: "y@x.test" }
              as: Sponsor
              captures: { s_id: $.data.id }
            - call: "POST /apprenticeship/journeyworkers"
              payload: { sponsor_id: "${s_id}", full_name: "JW1" }
              as: Sponsor
              as_user_id: "${s_id}"
              captures: { jw_id: $.data.id }
            - call: "POST /apprenticeship/journeyworkers/${jw_id}/qualify"
              payload: {}
