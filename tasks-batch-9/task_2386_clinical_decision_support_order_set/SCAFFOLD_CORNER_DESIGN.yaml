            - "the codes in call order are ERR_CLINICIAN_NOT_FOUND, ERR_CONTENT_REQUEST_NOT_FOUND, ERR_ALERT_NOT_FOUND, ERR_BURDEN_WINDOW_NOT_FOUND, ERR_REVIEW_ASSIGNMENT_NOT_FOUND, ERR_VENDOR_RELEASE_NOT_FOUND, ERR_VENDOR_RULE_DELTA_NOT_FOUND, ERR_DOWNTIME_EVENT_NOT_FOUND, ERR_ADHERENCE_MEASUREMENT_NOT_FOUND, ERR_ANNUAL_REVIEW_TASK_NOT_FOUND"
            - "the burden-window call resolves the existing alert first and still reports the window as the missing resource"
            - "no entity is created or mutated: GET /cds/alerts/${alert_id} still shows version 1 and review_state DRAFT"

      - name: error_missing_x_user_id_header_returns_unauthenticated
        claim_type: error_triggerable
        grounds:
          - errors.ERR_UNAUTHENTICATED
          - validations[priority=1]
        distinguishing_aspect: "Authentication is checked at priority 1, ahead of everything else, so a call with no X-User-ID header returns ERR_UNAUTHENTICATED (401) even when its body is also malformed and its target does not exist."
        test_recipe:
          setup:
            - "An empty database; no principal header is sent."
          setup_api_calls:
            - call: POST /_clock/set_current_utc
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
          trigger:
            - call: POST /cds/content-requests
              payload: {}
              as: none
          assert:
            - "HTTP 401 with error_id ERR_UNAUTHENTICATED"
            - "the response is NOT ERR_INVALID_REQUEST even though the body is missing every required field"
            - "GET /cds/content-requests as SystemAdmin returns total_count == 0"

      - name: error_role_header_without_the_declared_role_is_rejected
        claim_type: error_triggerable
        grounds:
          - errors.ERR_ROLE_IDENTITY_MISMATCH
          - validations[priority=3]
        distinguishing_aspect: "A caller whose X-User-ID names a real clinician that lacks the acting role in authorized_roles is refused with ERR_ROLE_IDENTITY_MISMATCH (403), which is distinct from the ERR_UNAUTHORIZED returned when the role itself is not permitted on the endpoint."
        test_recipe:
          setup:
            - "A clinician holding only PeerReviewer who attempts to act as CommitteeChair."
          setup_api_calls:
            - call: POST /_clock/set_current_utc
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
            - call: POST /cds/clinicians
              payload: { full_name: "Ada Sponsor MD", npi: "1000000001", specialty: "CARDIOLOGY", credential: "MD", authorized_roles: ["ClinicalSponsor"] }
              as: SystemAdmin
              captures: { sponsor_id: $.data.id }
            - call: POST /cds/clinicians
              payload: { full_name: "Rita Reviewer MD", npi: "1000000011", specialty: "INTERNAL_MEDICINE", credential: "MD", authorized_roles: ["PeerReviewer"] }
              as: SystemAdmin
              captures: { rev_id: $.data.id }
            - call: POST /cds/content-requests
              payload: { title: "Triage target", request_type: "ORDER_SET", clinical_domain: "CARDIOLOGY", urgency: "ROUTINE", evidence_grade: "B", clinical_sponsor_id: "${sponsor_id}", evidence_citations: [{ citation: "Guideline A", peer_reviewed: true }, { citation: "Guideline B", peer_reviewed: true }] }
              as: ClinicalSponsor
              as_user_id: "${sponsor_id}"
              captures: { cr_id: $.data.id }
          trigger:
            - call: POST /cds/content-requests/${cr_id}/triage
              payload: { decision: "ACCEPT", triage_note: "Not my role" }
              as: CommitteeChair
              as_user_id: "${rev_id}"
          assert:
            - "HTTP 403 with error_id ERR_ROLE_IDENTITY_MISMATCH"
            - "GET /cds/content-requests/${cr_id} still shows status == INTAKE_SUBMITTED and version 1"

      - name: error_unauthorized_role_on_a_restricted_endpoint
        claim_type: error_triggerable
        grounds:
          - errors.ERR_UNAUTHORIZED
        excluded_because:
          difficulty_instance: non_linear_state_machine / non_linear_vendor_release_fork_join_divergent_side_effects
          rationale: "That instance asserts the same role and payload that activated the FAST_TRACK arm receives ERR_UNAUTHORIZED (403) on the CLINICAL_REVIEW arm."

      - name: error_zero_length_downtime_window_is_rejected
        claim_type: error_triggerable
        grounds:
          - errors.ERR_INVALID_WINDOW_BOUNDS
          - validations[priority=7]
        distinguishing_aspect: "window_end equal to window_start is a zero-length interval and is refused with ERR_INVALID_WINDOW_BOUNDS (422); the rule demands strict inequality rather than merely non-inversion."
        test_recipe:
          setup:
            - "An empty database; the SystemAdmin schedules a degenerate downtime window."
          setup_api_calls:
            - call: POST /_clock/set_current_utc
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
          trigger:
            - call: POST /cds/downtime-events
              payload: { scope: "SYSTEM_WIDE", mode: "READ_ONLY", window_start: "2026-08-10T02:00:00Z", window_end: "2026-08-10T02:00:00Z", planned: true, reason: "Zero length by mistake" }
              as: SystemAdmin
            - call: POST /cds/downtime-events
              payload: { scope: "SYSTEM_WIDE", mode: "READ_ONLY", window_start: "2026-08-10T04:00:00Z", window_end: "2026-08-10T02:00:00Z", planned: true, reason: "Inverted by mistake" }
              as: SystemAdmin
          assert:
            - "both calls return HTTP 422 with error_id ERR_INVALID_WINDOW_BOUNDS"
            - "GET /cds/downtime-events as SystemAdmin returns total_count == 0"

      - name: error_publish_and_activate_before_approval_are_rejected
