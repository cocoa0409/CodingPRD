      - name: region_code
        type: string
        source: input
        required: true
        description: "Operating region code the center and its mobile vans cover"
      - name: state_code
        type: string
        source: input
        required: true
        description: "Two-letter US state the center sits in"
        constraints: "2 uppercase letters"
      - name: bay_count
        type: integer
        source: input
        required: true
        description: "Number of service bays (descriptive capacity of the fixed site)"
        constraints: ">= 1"

  - name: MobileVan
    parent: null
    common_fields: true
    fields:
