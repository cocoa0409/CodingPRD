    roles: [PrintOperationsDirector]
    code: 201
    input: [name, per_copy_revenue_cents, daily_route_cost_ceiling_cents, weighted_demand_units, print_edition_per_week, "publication_deadline_utc?", "on_time_margin_minutes?", "guaranteed_floor_copies?", "single_copy_market_rule?"]
    output: PrintMarket
    side_effects: ["status initialized to active; frequency_change_status initialized to none", "§1.3 newsroom_allocation_share recomputed for the region"]

  - method: GET
    path: "/regional-news-ops/regions/{id}/print-markets"
    description: "List a region's print markets"
    roles: [PrintOperationsDirector, NewsroomOperationsManager, Auditor, PlatformAdmin]
    code: 200
