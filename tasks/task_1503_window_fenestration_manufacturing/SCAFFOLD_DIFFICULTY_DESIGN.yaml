            - { call: "GET /fenestration/order-lines/${line}/ig-units", as: ProductionLead, captures: { g0: $.data.0.status, g1: $.data.1.status } }
            - { call: "GET /fenestration/production-waves/${wave}", as: ProductionLead, captures: { w_alloc: $.data.allocated_units, w_status: $.data.status } }
