# =============================================================================
# Task 1192: Auto Glass Claim Network Administration
# 1.8 Scaffold Difficulty Design (Test Targeting Index)
# Harder-than-expert calibration: 3 instances per rule (27 instances total).
# Every instance grounds in SCAFFOLD.yaml sections 1.1-1.7; all setup chains
# are ordered section-1.5 endpoint calls from empty-DB.
# =============================================================================

scaffold_difficulty_design:

  # ===========================================================================
  # Rule 1 - dual_variant_calc (instances on DIFFERENT entity domains)
  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: deductible_provisional_vs_final_on_claim
        grounds:
          - calculations.deductible_determination
          - entities.Claim.fields.provisional_customer_responsibility_cents
          - entities.Claim.fields.customer_responsibility_cents
          - entities.Claim.fields.oem_upcharge_cents
        distinguishing_aspect: |
          Claim-domain dual variant: provisional (intake estimate basis, no OEM
          upcharge) vs final (audited-line basis plus 25% OEM upcharge, capped at
          approved_total_cents) produce different customer responsibility for the
          same claim; the entity domain is Claim settlement, distinct from the
          GlassShop audit-score domain used by the sibling instances.
        test_recipe:
          setup:
            - "FL regulation: zero_deductible_windshield=false, max_deductible_cents=null, glass_sales_tax_rate_bp=0"
            - "Policyholder with ACTIVE COMPREHENSIVE policy, deductible_cents=50000, oem_endorsement=false"
            - "PLATINUM shop serving ZIP prefix 336, mobile_capable=false, adas_certified=false"
            - "Catalog: OEM windshield NAGS 120000; AFTERMARKET windshield NAGS 100000"
            - "Claim (WINDSHIELD, FL, est 200000) verified, routed, accepted, scheduled IN_SHOP, completed; invoice submitted and APPROVED in full"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: NetworkAdmin
            - call: "POST /state-regulations"
              payload: { state_code: "FL", zero_deductible_windshield: false, glass_sales_tax_rate_bp: 0 }
              as: NetworkAdmin
            - call: "POST /policyholders"
              payload: { full_name: "Pat Fl", email: "pat.fl@x.com", phone: "555-0101", state_code: "FL" }
              as: NetworkAdmin
              captures: { ph_id: $.data.id }
            - call: "POST /policies"
              payload: { policyholder_id: "${ph_id}", policy_number: "PN-FL-1", state_code: "FL", coverage_type: "COMPREHENSIVE", deductible_cents: 50000, oem_endorsement: false, effective_start_date: "2026-01-01", effective_end_date: "2027-01-01" }
              as: NetworkAdmin
              captures: { pol_id: $.data.id }
            - call: "POST /glass-shops"
              payload: { shop_name: "Plat Glass", state_code: "FL", service_zip_prefixes: ["336"], mobile_capable: false, adas_certified: false, oem_certified: true, agreement_tier: "PLATINUM", bay_count: 2, mobile_unit_count: 0, operating_minutes_per_day: 480 }
              as: NetworkAdmin
              captures: { shop_id: $.data.id }
            - call: "POST /part-catalog-entries"
              payload: { part_number: "OEM-WS-1", part_description: "OEM windshield", part_category: "WINDSHIELD", part_origin: "OEM", nags_list_price_cents: 120000 }
              as: NetworkAdmin
              captures: { part_oem_id: $.data.id }
            - call: "POST /part-catalog-entries"
              payload: { part_number: "AM-WS-1", part_description: "Aftermarket windshield", part_category: "WINDSHIELD", part_origin: "AFTERMARKET", nags_list_price_cents: 100000 }
              as: NetworkAdmin
              captures: { part_am_id: $.data.id }
            - call: "POST /claims"
              payload: { policy_id: "${pol_id}", incident_state_code: "FL", service_zip_code: "33601", part_category: "WINDSHIELD", loss_date: "2026-04-15", description: "cracked windshield", requires_adas_calibration: false, estimated_repair_cost_cents: 200000 }
              as: Policyholder
              as_user_id: "${ph_id}"
              captures: { claim_id: $.data.id, provisional_at_intake: $.data.provisional_customer_responsibility_cents, claim_v1: $.data.version }
            - call: "POST /claims/${claim_id}/choice-disclosures"
              payload: { disclosure_channel: "PORTAL", shop_solicited: false, informed_of_network_options: true }
              as: Policyholder
              as_user_id: "${ph_id}"
            - call: "POST /claims/${claim_id}/verify-coverage"
              payload: { verification_notes: "ok" }
              as: ClaimAdjuster
              captures: { claim_v2: $.data.version }
            - call: "POST /claims/${claim_id}/routing-decisions"
              payload: { expected_claim_version: "${claim_v2}" }
              as: ClaimAdjuster
              captures: { wo_id: $.data.id }
            - call: "POST /work-orders/${wo_id}/accept"
              payload: {}
              as: ShopOperator
              as_user_id: "${shop_id}"
              captures: { wo_v2: $.data.version }
            - call: "POST /work-orders/${wo_id}/schedule"
              payload: { service_mode: "IN_SHOP", scheduled_start: "2026-05-02T10:00:00Z", scheduled_end: "2026-05-02T12:00:00Z", expected_work_order_version: "${wo_v2}" }
              as: ShopOperator
              as_user_id: "${shop_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-02T13:00:00Z" }
              as: NetworkAdmin
            - call: "POST /work-orders/${wo_id}/complete"
              payload: {}
              as: ShopOperator
              as_user_id: "${shop_id}"
            - call: "POST /work-orders/${wo_id}/invoices"
              payload: { line_items: [ { part_catalog_entry_id: "${part_oem_id}", line_type: "PART", quantity: 1, origin_claimed: "OEM", unit_price_cents: 120000 }, { part_catalog_entry_id: "${part_am_id}", line_type: "PART", quantity: 1, origin_claimed: "AFTERMARKET", unit_price_cents: 75000 } ] }
              as: ShopOperator
              as_user_id: "${shop_id}"
              captures: { inv_id: $.data.id }
            - call: "POST /invoices/${inv_id}/submit"
              payload: {}
              as: ShopOperator
              as_user_id: "${shop_id}"
          trigger:
            - call: "POST /invoices/${inv_id}/audit-decisions"
              payload: { action: "APPROVE", adjustment_lines: [ { line_index: 0, approved_amount_cents: 120000, approved_origin: "OEM" }, { line_index: 1, approved_amount_cents: 75000, approved_origin: "AFTERMARKET" } ] }
              as: NetworkAuditor
          assert:
            - "Claim.${claim_id}.provisional_customer_responsibility_cents == 50000 (min(50000 deductible, 200000 estimate) at intake)"
            - "Claim.${claim_id}.deductible_applied_cents == 50000"
            - "Claim.${claim_id}.oem_upcharge_cents == 30000 (round_half_up(120000 x 0.25) on the approved OEM line)"
            - "Claim.${claim_id}.customer_responsibility_cents == 80000 (min(195000, 50000 + 30000))"
            - "Claim.${claim_id}.insurer_payment_cents == 115000 (195000 - 80000)"
            - "Invoice.${inv_id}.approved_total_cents == 195000 and Invoice.${inv_id}.adjustment_total_cents == 0"

      - name: shop_score_rolling_ema_vs_period_close_mean
        grounds:
          - calculations.shop_network_score
          - entities.GlassShop.fields.rolling_audit_score
          - entities.GlassShop.fields.period_close_audit_score
        distinguishing_aspect: |
          GlassShop-domain dual variant: the rolling EMA (order-sensitive, alpha 0.3)
          and the period-close arithmetic mean (order-insensitive) diverge on the
          same audit history; entity domain is GlassShop scoring, distinct from
          Claim settlement.
        test_recipe:
          setup:
            - "FL regulation (zero_deductible=false, tax 0 bp)"
            - "Policyholder + ACTIVE COMPREHENSIVE policy (deductible 50000, no OEM endorsement)"
            - "STANDARD shop S (bay_count 2, 480 min/day) serving 336; catalog AFTERMARKET windshield NAGS 100000"
            - "Two completed claims/invoices for shop S: invoice A submitted 95000 approved 95000 (event score 100); invoice B submitted 95000 approved 76000 (adjustment 19000 -> event score 80)"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: NetworkAdmin
            - call: "POST /state-regulations"
              payload: { state_code: "FL", zero_deductible_windshield: false, glass_sales_tax_rate_bp: 0 }
              as: NetworkAdmin
            - call: "POST /policyholders"
              payload: { full_name: "Pat Score", email: "pat.score@x.com", phone: "555-0102", state_code: "FL" }
              as: NetworkAdmin
              captures: { ph_id: $.data.id }
            - call: "POST /policies"
              payload: { policyholder_id: "${ph_id}", policy_number: "PN-SC-1", state_code: "FL", coverage_type: "COMPREHENSIVE", deductible_cents: 50000, oem_endorsement: false, effective_start_date: "2026-01-01", effective_end_date: "2027-01-01" }
              as: NetworkAdmin
              captures: { pol_id: $.data.id }
            - call: "POST /glass-shops"
              payload: { shop_name: "Std Glass", state_code: "FL", service_zip_prefixes: ["336"], mobile_capable: false, adas_certified: false, oem_certified: false, agreement_tier: "STANDARD", bay_count: 2, mobile_unit_count: 0, operating_minutes_per_day: 480 }
              as: NetworkAdmin
              captures: { shop_id: $.data.id }
            - call: "POST /part-catalog-entries"
              payload: { part_number: "AM-WS-1", part_description: "Aftermarket windshield", part_category: "WINDSHIELD", part_origin: "AFTERMARKET", nags_list_price_cents: 100000 }
              as: NetworkAdmin
              captures: { part_am_id: $.data.id }
            # --- claim/invoice A: full approval (event 100) ---
            - call: "POST /claims"
              payload: { policy_id: "${pol_id}", incident_state_code: "FL", service_zip_code: "33601", part_category: "WINDSHIELD", loss_date: "2026-04-10", description: "claim A", requires_adas_calibration: false, estimated_repair_cost_cents: 95000 }
              as: Policyholder
              as_user_id: "${ph_id}"
              captures: { claim_a: $.data.id }
            - call: "POST /claims/${claim_a}/choice-disclosures"
              payload: { disclosure_channel: "PHONE", shop_solicited: false, informed_of_network_options: true }
              as: Policyholder
              as_user_id: "${ph_id}"
            - call: "POST /claims/${claim_a}/verify-coverage"
              payload: {}
              as: ClaimAdjuster
              captures: { claim_a_v2: $.data.version }
            - call: "POST /claims/${claim_a}/routing-decisions"
              payload: { expected_claim_version: "${claim_a_v2}" }
              as: ClaimAdjuster
              captures: { wo_a: $.data.id }
            - call: "POST /work-orders/${wo_a}/accept"
              payload: {}
              as: ShopOperator
              as_user_id: "${shop_id}"
              captures: { wo_a_v2: $.data.version }
            - call: "POST /work-orders/${wo_a}/schedule"
              payload: { service_mode: "IN_SHOP", scheduled_start: "2026-05-02T09:00:00Z", scheduled_end: "2026-05-02T10:00:00Z", expected_work_order_version: "${wo_a_v2}" }
              as: ShopOperator
              as_user_id: "${shop_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-02T11:00:00Z" }
              as: NetworkAdmin
            - call: "POST /work-orders/${wo_a}/complete"
              payload: {}
              as: ShopOperator
              as_user_id: "${shop_id}"
            - call: "POST /work-orders/${wo_a}/invoices"
              payload: { line_items: [ { part_catalog_entry_id: "${part_am_id}", line_type: "PART", quantity: 1, origin_claimed: "AFTERMARKET", unit_price_cents: 95000 } ] }
              as: ShopOperator
              as_user_id: "${shop_id}"
              captures: { inv_a: $.data.id }
            - call: "POST /invoices/${inv_a}/submit"
              payload: {}
              as: ShopOperator
              as_user_id: "${shop_id}"
            - call: "POST /invoices/${inv_a}/audit-decisions"
              payload: { action: "APPROVE", adjustment_lines: [ { line_index: 0, approved_amount_cents: 95000, approved_origin: "AFTERMARKET" } ] }
              as: NetworkAuditor
            # --- claim/invoice B: partial approval (event 80) ---
            - call: "POST /claims"
              payload: { policy_id: "${pol_id}", incident_state_code: "FL", service_zip_code: "33601", part_category: "WINDSHIELD", loss_date: "2026-04-20", description: "claim B", requires_adas_calibration: false, estimated_repair_cost_cents: 95000 }
              as: Policyholder
              as_user_id: "${ph_id}"
              captures: { claim_b: $.data.id }
            - call: "POST /claims/${claim_b}/choice-disclosures"
              payload: { disclosure_channel: "PHONE", shop_solicited: false, informed_of_network_options: true }
              as: Policyholder
              as_user_id: "${ph_id}"
            - call: "POST /claims/${claim_b}/verify-coverage"
              payload: {}
              as: ClaimAdjuster
              captures: { claim_b_v2: $.data.version }
            - call: "POST /claims/${claim_b}/routing-decisions"
              payload: { expected_claim_version: "${claim_b_v2}" }
              as: ClaimAdjuster
              captures: { wo_b: $.data.id }
            - call: "POST /work-orders/${wo_b}/accept"
              payload: {}
              as: ShopOperator
              as_user_id: "${shop_id}"
              captures: { wo_b_v2: $.data.version }
            - call: "POST /work-orders/${wo_b}/schedule"
              payload: { service_mode: "IN_SHOP", scheduled_start: "2026-05-03T09:00:00Z", scheduled_end: "2026-05-03T10:00:00Z", expected_work_order_version: "${wo_b_v2}" }
              as: ShopOperator
              as_user_id: "${shop_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-03T11:00:00Z" }
              as: NetworkAdmin
            - call: "POST /work-orders/${wo_b}/complete"
              payload: {}
              as: ShopOperator
              as_user_id: "${shop_id}"
            - call: "POST /work-orders/${wo_b}/invoices"
              payload: { line_items: [ { part_catalog_entry_id: "${part_am_id}", line_type: "PART", quantity: 1, origin_claimed: "AFTERMARKET", unit_price_cents: 95000 } ] }
              as: ShopOperator
              as_user_id: "${shop_id}"
              captures: { inv_b: $.data.id }
            - call: "POST /invoices/${inv_b}/submit"
              payload: {}
              as: ShopOperator
              as_user_id: "${shop_id}"
          trigger:
            - call: "POST /invoices/${inv_b}/audit-decisions"
              payload: { action: "APPROVE", adjustment_lines: [ { line_index: 0, approved_amount_cents: 76000, approved_origin: "AFTERMARKET" } ] }
              as: NetworkAuditor
            - call: "GET /glass-shops/${shop_id}"
              as: NetworkAdmin
          assert:
            - "Invoice.${inv_b}.submitted_total_cents == 95000 and Invoice.${inv_b}.approved_total_cents == 76000 and Invoice.${inv_b}.adjustment_total_cents == 19000"
            - "GlassShop.${shop_id}.rolling_audit_score == 94.0 (round_half_up(0.7 x 100 + 0.3 x 80) after the 100 event left rolling at 100)"
            - "GlassShop.${shop_id}.period_close_audit_score == 90.0 (arithmetic mean of event scores 100 and 80)"
            - "GlassShop.${shop_id}.rolling_audit_score != GlassShop.${shop_id}.period_close_audit_score"

      - name: deductible_zero_state_provisional_vs_final_zero_deductible
        grounds:
          - calculations.deductible_determination
          - entities.StateRegulation.fields.zero_deductible_windshield
          - entities.Claim.fields.deductible_applied_cents
        distinguishing_aspect: |
          Claim-domain dual variant under the FL zero-deductible rule: provisional
          and final variants agree on the deductible basis (0) but diverge on
          customer responsibility once the final variant adds the OEM upcharge; the
          variant switch is gated on StateRegulation config, exercising the
          deductible_determination zero_deductible_applies branch rather than the
          estimate-vs-audit divergence of the sibling Claim instance.
        test_recipe:
          setup:
            - "FL regulation: zero_deductible_windshield=true, glass_sales_tax_rate_bp=0"
            - "Policyholder with ACTIVE COMPREHENSIVE policy, deductible_cents=50000, oem_endorsement=false"
            - "STANDARD shop serving 336; catalog OEM windshield NAGS 120000"
            - "Claim (WINDSHIELD, FL, est 90000) verified, routed, scheduled IN_SHOP, completed; OEM invoice submitted and APPROVED"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: NetworkAdmin
            - call: "POST /state-regulations"
              payload: { state_code: "FL", zero_deductible_windshield: true, glass_sales_tax_rate_bp: 0 }
              as: NetworkAdmin
            - call: "POST /policyholders"
              payload: { full_name: "Zero Ded", email: "zero@x.com", phone: "555-0103", state_code: "FL" }
              as: NetworkAdmin
              captures: { ph_id: $.data.id }
            - call: "POST /policies"
              payload: { policyholder_id: "${ph_id}", policy_number: "PN-ZD-1", state_code: "FL", coverage_type: "COMPREHENSIVE", deductible_cents: 50000, oem_endorsement: false, effective_start_date: "2026-01-01", effective_end_date: "2027-01-01" }
              as: NetworkAdmin
              captures: { pol_id: $.data.id }
            - call: "POST /glass-shops"
              payload: { shop_name: "Zero Shop", state_code: "FL", service_zip_prefixes: ["336"], mobile_capable: false, adas_certified: false, oem_certified: true, agreement_tier: "STANDARD", bay_count: 1, mobile_unit_count: 0, operating_minutes_per_day: 480 }
              as: NetworkAdmin
              captures: { shop_id: $.data.id }
            - call: "POST /part-catalog-entries"
              payload: { part_number: "OEM-WS-1", part_description: "OEM windshield", part_category: "WINDSHIELD", part_origin: "OEM", nags_list_price_cents: 120000 }
              as: NetworkAdmin
              captures: { part_oem_id: $.data.id }
            - call: "POST /claims"
              payload: { policy_id: "${pol_id}", incident_state_code: "FL", service_zip_code: "33601", part_category: "WINDSHIELD", loss_date: "2026-04-15", description: "zero-ded claim", requires_adas_calibration: false, estimated_repair_cost_cents: 90000 }
              as: Policyholder
              as_user_id: "${ph_id}"
              captures: { claim_id: $.data.id, provisional_at_intake: $.data.provisional_customer_responsibility_cents }
            - call: "POST /claims/${claim_id}/choice-disclosures"
              payload: { disclosure_channel: "PORTAL", shop_solicited: false, informed_of_network_options: true }
              as: Policyholder
              as_user_id: "${ph_id}"
            - call: "POST /claims/${claim_id}/verify-coverage"
              payload: {}
              as: ClaimAdjuster
              captures: { claim_v2: $.data.version }
            - call: "POST /claims/${claim_id}/routing-decisions"
              payload: { expected_claim_version: "${claim_v2}" }
              as: ClaimAdjuster
              captures: { wo_id: $.data.id }
            - call: "POST /work-orders/${wo_id}/accept"
              payload: {}
              as: ShopOperator
              as_user_id: "${shop_id}"
              captures: { wo_v2: $.data.version }
            - call: "POST /work-orders/${wo_id}/schedule"
              payload: { service_mode: "IN_SHOP", scheduled_start: "2026-05-02T10:00:00Z", scheduled_end: "2026-05-02T11:00:00Z", expected_work_order_version: "${wo_v2}" }
              as: ShopOperator
              as_user_id: "${shop_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-02T12:00:00Z" }
              as: NetworkAdmin
            - call: "POST /work-orders/${wo_id}/complete"
              payload: {}
              as: ShopOperator
              as_user_id: "${shop_id}"
            - call: "POST /work-orders/${wo_id}/invoices"
              payload: { line_items: [ { part_catalog_entry_id: "${part_oem_id}", line_type: "PART", quantity: 1, origin_claimed: "OEM", unit_price_cents: 120000 } ] }
              as: ShopOperator
              as_user_id: "${shop_id}"
              captures: { inv_id: $.data.id }
            - call: "POST /invoices/${inv_id}/submit"
              payload: {}
              as: ShopOperator
              as_user_id: "${shop_id}"
          trigger:
            - call: "POST /invoices/${inv_id}/audit-decisions"
              payload: { action: "APPROVE", adjustment_lines: [ { line_index: 0, approved_amount_cents: 120000, approved_origin: "OEM" } ] }
              as: NetworkAuditor
          assert:
            - "Claim.${claim_id}.provisional_customer_responsibility_cents == 0 (zero-deductible state, WINDSHIELD, COMPREHENSIVE)"
            - "Claim.${claim_id}.deductible_applied_cents == 0"
            - "Claim.${claim_id}.oem_upcharge_cents == 30000"
            - "Claim.${claim_id}.customer_responsibility_cents == 30000 (final variant adds upcharge despite zero deductible)"
            - "Claim.${claim_id}.insurer_payment_cents == 90000 (120000 - 30000)"

  # ===========================================================================
  # Rule 2 - combinatorial_formula (instances in DIFFERENT modes a/b/c)
  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: invoice_line_pricing_tier_origin_mode_a
        grounds:
          - calculations.invoice_line_pricing
          - entities.InvoiceLineItem.fields.agreement_unit_price_cents
          - entities.GlassShop.fields.agreement_tier
        distinguishing_aspect: |
          Mode (a) combinatorial: agreement price is a >=3-input non-linear
          selection over line_type x part_origin x agreement_tier (OEM multiplier
          1.00 exemption, MOBILE_FEE flat 5000 exemption, MATERIALS flat-base tier
          product); pinned on a PLATINUM shop with four line types in one invoice.
        test_recipe:
          setup:
            - "KY regulation: zero_deductible_windshield=true, glass_sales_tax_rate_bp=600"
            - "Policyholder with ACTIVE COMPREHENSIVE policy (deductible 50000), MOBILE claim requiring no ADAS"
            - "PLATINUM shop, mobile_capable=true, serving 402; catalog: OEM windshield 120000, AFTERMARKET windshield 100000, CALIBRATION AFTERMARKET entry 30000"
            - "Claim verified, routed, accepted, scheduled MOBILE, completed; invoice created DRAFT with 4 lines"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: NetworkAdmin
            - call: "POST /state-regulations"
              payload: { state_code: "KY", zero_deductible_windshield: true, glass_sales_tax_rate_bp: 600 }
              as: NetworkAdmin
            - call: "POST /policyholders"
              payload: { full_name: "Ky Mobile", email: "ky.m@x.com", phone: "555-0201", state_code: "KY" }
              as: NetworkAdmin
              captures: { ph_id: $.data.id }
            - call: "POST /policies"
              payload: { policyholder_id: "${ph_id}", policy_number: "PN-KY-1", state_code: "KY", coverage_type: "COMPREHENSIVE", deductible_cents: 50000, oem_endorsement: false, effective_start_date: "2026-01-01", effective_end_date: "2027-01-01" }
              as: NetworkAdmin
              captures: { pol_id: $.data.id }
            - call: "POST /glass-shops"
              payload: { shop_name: "Plat Mobile", state_code: "KY", service_zip_prefixes: ["402"], mobile_capable: true, adas_certified: false, oem_certified: true, agreement_tier: "PLATINUM", bay_count: 1, mobile_unit_count: 2, operating_minutes_per_day: 480 }
              as: NetworkAdmin
              captures: { shop_id: $.data.id }
            - call: "POST /part-catalog-entries"
              payload: { part_number: "OEM-WS-1", part_description: "OEM windshield", part_category: "WINDSHIELD", part_origin: "OEM", nags_list_price_cents: 120000 }
              as: NetworkAdmin
              captures: { part_oem_id: $.data.id }
            - call: "POST /part-catalog-entries"
              payload: { part_number: "AM-WS-1", part_description: "AM windshield", part_category: "WINDSHIELD", part_origin: "AFTERMARKET", nags_list_price_cents: 100000 }
              as: NetworkAdmin
              captures: { part_am_id: $.data.id }
            - call: "POST /claims"
