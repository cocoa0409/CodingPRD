# =============================================================================
# PRD Benchmark Seed Tables — Electric Motor Manufacturing
# §1.0–§1.7. Difficulty design (§1.8) lives in SCAFFOLD_DIFFICULTY_DESIGN.yaml;
# corner design (§1.9) lives in SCAFFOLD_CORNER_DESIGN.yaml.
# =============================================================================

scenario: |
  2935. Electric Motor Manufacturing (electric motor manufacturer): design engineering across
  efficiency classes with lamination, winding and rotor design tradeoffs, stator winding operations
  with insulation systems, varnish impregnation and surge testing, rotor casting or fabrication with
  balance and air gap control, assembly with bearing installation, shaft tolerance and lubrication
  specification, performance testing with efficiency verification to regulatory minimums and
  nameplate certification, custom and engineered motors with special mounting, environment and duty
  requirements, distributor stocking programs and made-to-order lead times, warranty failure analysis
  distinguishing application misuse from manufacturing defect

domain_name: electric-motor-manufacturing
api_prefix: ""

# -----------------------------------------------------------------------------
# §1.0 Response Envelope (FIXED — verbatim)
# -----------------------------------------------------------------------------
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# -----------------------------------------------------------------------------
# §0.1–§0.3 Complexity Profile
# -----------------------------------------------------------------------------
complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: workflow_orchestration
  complexity_layers:
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
    - optimistic_concurrency

  entity_topology: flat
  entity_topology_note: |
    Thirteen peer collections linked by foreign keys only; no entity is nested inside another
    entity's URL path. Every child is created by POSTing a flat collection with its parent ids in
    the request body, and every child is discovered through a filtered list endpoint.

  state_machine_shape: branching
  state_machine_shape_note: |
    RotorBuild forks PLANNED -> {CAST_POURED | BARS_BRAZED} with divergent side-effect sets and
    joins at MACHINED. MotorDesign is cyclic (IN_REVIEW -> DRAFT -> IN_REVIEW; RELEASED ->
    REVISION_OPEN -> IN_REVIEW -> RELEASED). WorkOrder carries two independent state dimensions
    (build_status x certification_status), and the certification dimension itself cycles
    (CERTIFIED -> SUSPENDED -> CERTIFIED). WarrantyClaim cycles through adjudication and dispute.

  relationship_patterns:
    - one_to_many
    - self_referential      # MotorDesign.supersedes_design_id -> MotorDesign.id
    - cross_aggregate       # Nameplate -> RegulatoryStandard; StatorBuild -> CuringOven

  role_model: segregation_of_duties
  role_model_note: |
    Three enforced separations, each keyed on X-User-ID: (1) the DesignReviewer who approves a
    MotorDesign MUST NOT be the DesignEngineer who created it; (2) the TestEngineer who runs the
    surge test on a StatorBuild MUST NOT be the BuildTechnician who wound it; (3) the
    QualityCertifier who issues a Nameplate MUST NOT be the TestEngineer who recorded the
    PerformanceTest it certifies.

  consistency_model: immediate

difficulty_level: expert

# -----------------------------------------------------------------------------
# §1.1 Entity-Relationship Table
# -----------------------------------------------------------------------------
entities:
  - name: MotorDesign
    parent: null
    common_fields: true
    entity_kind: resource
    fields:
      - name: model_code
        type: string
        source: input
        description: Manufacturer model code, unique across all MotorDesign rows.
        constraints: "1-40 chars; unique (case-sensitive) over all MotorDesign rows"
      - name: frame_size
        type: string
        source: input
        description: IEC frame designation such as 132M.
        constraints: "1-16 chars"
      - name: poles
        type: integer
        source: input
        description: Number of stator poles; fixes synchronous speed.
        constraints: "one of {2, 4, 6, 8}"
      - name: rated_output_kw
        type: number
        source: input
        description: Nameplate mechanical output rating in kW.
        constraints: "4.0 <= rated_output_kw <= 15.0, 1 decimal place"
      - name: rated_voltage_v
        type: integer
        source: input
        description: Rated line voltage used to derive the surge test level.
        constraints: "one of {230, 400, 460, 690}"
      - name: target_efficiency_class
        type: enum
        source: input
        description: Efficiency class the design is intended to be released against.
        constraints: "one of {IE2, IE3, IE4, IE5}"
      - name: lamination_grade
        type: enum
        source: input
        description: Electrical steel grade of the stator/rotor lamination stack.
        constraints: "one of {M400_50A, M330_35A, M270_35A, M235_35A}"
      - name: lamination_stack_length_mm
        type: integer
        source: input
        description: Axial length of the lamination stack in mm.
        constraints: "120 <= lamination_stack_length_mm <= 260"
      - name: winding_copper_kg
        type: number
        source: input
        description: Mass of magnet wire in the stator winding, kg.
        constraints: "6.0 <= winding_copper_kg <= 30.0, 1 decimal place"
      - name: winding_type
        type: enum
        source: input
        description: Stator winding layout.
        constraints: "one of {CONCENTRIC, LAP}"
      - name: insulation_class
        type: enum
        source: input
        description: Thermal insulation class of the winding insulation system.
        constraints: "one of {B, F, H}"
      - name: stator_bore_id_mm
        type: number
        source: input
        description: Finished stator bore inner diameter in mm; one half of the air-gap geometry.
        constraints: "80.000 <= stator_bore_id_mm <= 260.000, 3 decimal places"
      - name: design_air_gap_mm
        type: number
        source: input
        description: Nominal radial air gap in mm.
        constraints: "0.200 <= design_air_gap_mm <= 1.500, 3 decimal places"
      - name: air_gap_tolerance_mm
        type: number
        source: input
        description: Permitted absolute deviation of the measured air gap from design_air_gap_mm.
        constraints: "0.010 <= air_gap_tolerance_mm <= 0.200, 3 decimal places"
      - name: rotor_construction
        type: enum
        source: input
        description: Rotor cage construction route.
        constraints: "one of {DIE_CAST_ALUMINUM, FABRICATED_COPPER}"
      - name: rotor_bar_count
        type: integer
        source: input
        description: Number of rotor cage bars; checked against the brazed-bar branch.
        constraints: "24 <= rotor_bar_count <= 48"
      - name: shaft_diameter_mm
        type: number
        source: input
        description: Nominal shaft journal diameter at the drive-end bearing seat, mm.
        constraints: "20.000 <= shaft_diameter_mm <= 90.000, 3 decimal places"
      - name: shaft_tolerance_class
        type: enum
        source: input
        description: ISO shaft fit class governing the permitted journal deviation band.
        constraints: "one of {k6, m6, j6}"
      - name: bearing_spec_de
        type: string
        source: input
        description: Drive-end bearing designation.
        constraints: "1-24 chars"
      - name: bearing_spec_nde
        type: string
        source: input
        description: Non-drive-end bearing designation.
        constraints: "1-24 chars"
      - name: lubrication_spec
        type: enum
        source: input
        description: Lubrication regime specified for the bearing system.
        constraints: "one of {GREASE_LIFETIME, GREASE_REGREASABLE, OIL_MIST}"
      - name: duty_type
        type: enum
        source: input
        description: IEC duty classification; also fixes the starts-per-hour reference used in warranty scoring.
        constraints: "one of {S1, S2, S3}"
      - name: enclosure
        type: enum
        source: input
        description: Ingress protection rating of the enclosure.
        constraints: "one of {IP55, IP65, IP66}"
      - name: mounting
        type: enum
        source: input
        description: Mounting arrangement.
        constraints: "one of {B3, B5, B35, V1}"
      - name: supersedes_design_id
        type: string
        source: input
        description: "FK -> MotorDesign.id; optional self-reference to the design this one replaces. When present the referenced design MUST be in status RELEASED, REVISION_OPEN or OBSOLETE."
        default: null
      - name: status
        type: enum
        source: system
        description: Design lifecycle state.
        default: DRAFT
        constraints: "one of {DRAFT, IN_REVIEW, RELEASED, REVISION_OPEN, OBSOLETE}"
      - name: revision_index
        type: integer
        source: system
        description: Increments by 1 on every REQUEST_CHANGES decision and on every open-revision.
        default: 0
      - name: review_round
        type: integer
        source: system
        description: Number of completed review rounds; bounded by MAX_REVIEW_ROUNDS.
        default: 0
      - name: created_by_user_id
        type: string
        source: system
        description: X-User-ID of the DesignEngineer that created the design; one side of the design-approval separation.
      - name: released_by_user_id
        type: string
        source: system
        description: X-User-ID of the DesignReviewer that approved the most recent release.
        default: null
      - name: released_at
        type: datetime
        source: system
        description: Logical-clock instant of the most recent DRAFT/REVISION_OPEN -> RELEASED transition.
        default: null
      - name: total_predicted_loss_w
        type: number
        source: computed
        description: Sum of the five per-component predicted losses, each rounded to 0.1 W before summation (calc design_predicted_efficiency).
      - name: predicted_efficiency_pct
        type: number
        source: computed
        description: Design-estimate efficiency from the loss model, 2 decimal places (calc design_predicted_efficiency, variant design_estimate).
      - name: guaranteed_efficiency_pct
        type: number
        source: computed
        description: Declarable efficiency after the IEC tolerance derate, 2 decimal places (calc design_predicted_efficiency, variant guaranteed_declared).
      - name: design_estimate_class
        type: enum
        source: computed
        description: Efficiency class implied by predicted_efficiency_pct (no tolerance derate).
        constraints: "one of {BELOW_IE2, IE2, IE3, IE4, IE5}"
      - name: predicted_class
        type: enum
        source: computed
        description: Efficiency class implied by guaranteed_efficiency_pct; the value gated against target_efficiency_class at release.
        constraints: "one of {BELOW_IE2, IE2, IE3, IE4, IE5}"

  - name: RegulatoryStandard
    parent: null
    common_fields: false
    entity_kind: configuration
    fields:
      - name: standard_code
        type: string
        source: input
        description: Standard designation, e.g. IEC_60034_30_1.
        constraints: "1-40 chars"
      - name: jurisdiction
        type: enum
        source: input
        description: Regulatory jurisdiction the row applies to.
        constraints: "one of {EU, US, CN}"
      - name: efficiency_class
        type: enum
        source: input
        description: Efficiency class the minimum belongs to.
        constraints: "one of {IE2, IE3, IE4, IE5}"
      - name: poles
        type: integer
        source: input
        description: Pole count the row applies to.
        constraints: "one of {2, 4, 6, 8}"
      - name: rated_output_kw_min
        type: number
        source: input
        description: Inclusive lower bound of the output band the row covers.
        constraints: "> 0, 1 decimal place"
      - name: rated_output_kw_max
        type: number
        source: input
        description: Inclusive upper bound of the output band the row covers.
        constraints: ">= rated_output_kw_min, 1 decimal place"
      - name: minimum_efficiency_pct
        type: number
        source: input
        description: Minimum measured efficiency a motor in this band must reach to be nameplated.
        constraints: "50.00 <= minimum_efficiency_pct <= 99.99, 2 decimal places"
      - name: effective_from
        type: string
        source: input
        description: ISO 8601 calendar date (YYYY-MM-DD) from which the row is in force; the selector's ranking key.
      - name: tolerance_pct
        type: number
        source: input
        description: Informational tolerance band published with the standard; recorded but never subtracted from minimum_efficiency_pct.
        default: 0.00

  - name: Distributor
    parent: null
    common_fields: true
    entity_kind: resource
    fields:
      - name: name
        type: string
        source: input
        description: Distributor legal name.
        constraints: "1-80 chars"
      - name: tier
        type: enum
        source: input
        description: Stocking-program tier; sets the lead-time reduction.
        constraints: "one of {PLATINUM, GOLD, SILVER}"
      - name: jurisdiction
        type: enum
        source: input
        description: Primary jurisdiction of the distributor.
        constraints: "one of {EU, US, CN}"
      - name: stocking_program_enrolled
        type: boolean
        source: input
        description: True when the distributor holds a stocking agreement; STOCK_REPLENISH orders require it.
        default: false
      - name: committed_annual_units
        type: integer
        source: input
        description: Total units the distributor has committed to for the year; the conserved allowance pool.
        default: 0
        constraints: "0 <= committed_annual_units <= 100000"
      - name: stock_buffer_units
        type: integer
        source: input
        description: Units held in buffer stock; a STOCK_REPLENISH quantity strictly above this adds the shortfall lead-time penalty.
        default: 0
      - name: units_outstanding
        type: integer
        source: computed
        description: Sum of CustomerOrder.quantity over this distributor's orders with status IN {CONFIRMED, IN_PRODUCTION} (calc distributor_allowance_ledger).
        default: 0
      - name: stock_allowance_remaining_units
        type: integer
        source: computed
        description: committed_annual_units - units_outstanding (calc distributor_allowance_ledger).
        default: 0
      - name: warranty_credit_balance_cents
        type: integer
        source: computed
        description: Sum of WarrantyClaim.warranty_credit_cents over this distributor's claims with credit_posted == true (calc warranty_credit_ledger).
        default: 0
      - name: open_presumed_defect_count
        type: integer
        source: computed
        description: Count of this distributor's WarrantyClaim rows with defect_presumption_applied == true AND status IN {SUBMITTED, UNDER_ANALYSIS}.
        default: 0

  - name: CustomerOrder
    parent: null
    common_fields: true
    entity_kind: resource
    fields:
      - name: distributor_id
        type: string
        source: input
        description: "FK -> Distributor.id; the ordering distributor. When X-User-Role is Distributor this MUST equal X-User-ID."
      - name: design_id
        type: string
        source: input
        description: "FK -> MotorDesign.id; the motor design ordered."
      - name: order_type
        type: enum
        source: input
        description: Commercial order channel; sets the lead-time base.
        constraints: "one of {STOCK_REPLENISH, MADE_TO_ORDER, ENGINEERED_SPECIAL}"
      - name: quantity
        type: integer
        source: input
        description: Number of motors ordered.
        constraints: "1 <= quantity <= 5000"
      - name: requested_ship_date
        type: string
        source: input
        description: ISO 8601 calendar date (YYYY-MM-DD) the distributor asks to ship by.
      - name: jurisdiction
        type: enum
        source: input
        description: Destination jurisdiction; drives the certification lead-time adder and the nameplate standard selector.
        constraints: "one of {EU, US, CN}"
      - name: special_requirements
        type: object
        source: input
        description: Engineered-motor requirement flags; recognised keys are non_standard_mounting, hazardous_environment, non_standard_duty, marine_certification, each a boolean.
        default: {}
      - name: status
        type: enum
        source: system
        description: Commercial order lifecycle state.
        default: DRAFT
        constraints: "one of {DRAFT, CONFIRMED, IN_PRODUCTION, FULFILLED, CANCELLED}"
      - name: promised_lead_time_days
        type: integer
        source: computed
        description: Lead time in calendar days from calc order_lead_time; recomputed on confirm.
        default: null
      - name: promised_ship_date
        type: string
        source: computed
        description: Logical-clock date at confirm plus promised_lead_time_days calendar days (calc order_lead_time).
        default: null
      - name: confirmed_at
        type: datetime
        source: system
        description: Logical-clock instant of the DRAFT -> CONFIRMED transition.
        default: null

  - name: WorkOrder
    parent: null
    common_fields: true
    entity_kind: resource
    fields:
      - name: order_id
        type: string
        source: input
        description: "FK -> CustomerOrder.id; the commercial order this production order fulfils."
      - name: design_id
        type: string
        source: input
        description: "FK -> MotorDesign.id; the released design pinned at work-order creation. MUST equal CustomerOrder.design_id."
      - name: unit_count
        type: integer
        source: input
        description: Units built under this work order.
        constraints: "1 <= unit_count <= 5000"
      - name: pinned_design_revision_index
        type: integer
        source: system
        description: MotorDesign.revision_index captured at creation; a later revision makes design_pin_stale true.
      - name: build_status
        type: enum
        source: system
        description: Physical build dimension of the work order state; evolves independently of certification_status.
        default: RELEASED
        constraints: "one of {RELEASED, SUBASSEMBLIES_DONE, ASSEMBLED, TESTED, SHIPPED, CANCELLED}"
      - name: certification_status
        type: enum
        source: system
        description: Regulatory certification dimension of the work order state; evolves independently of build_status and may cycle CERTIFIED -> SUSPENDED -> CERTIFIED.
        default: PENDING
        constraints: "one of {PENDING, CERTIFIED, SUSPENDED}"
      - name: design_pin_stale
        type: boolean
        source: system
        description: Set true when the pinned MotorDesign leaves RELEASED via open-revision.
        default: false
      - name: rework_reject_count
        type: integer
        source: system
        description: Number of StatorBuild or RotorBuild rows on this work order dispositioned REJECTED; drives the rework surcharge.
        default: 0
      - name: direct_cost_cents
        type: integer
        source: computed
        description: Material plus labour cost before overhead (calc work_order_cost).
      - name: overhead_band
        type: enum
        source: computed
        description: Overhead band selected from direct_cost_cents alone (calc work_order_cost).
        constraints: "one of {STANDARD, COMPLEX, ENGINEERED}"
      - name: overhead_cents
        type: integer
        source: computed
        description: direct_cost_cents times the band rate, rounded to whole cents (calc work_order_cost).
      - name: standard_cost_cents
        type: integer
        source: computed
        description: direct_cost_cents + overhead_cents (calc work_order_cost).
      - name: actual_cost_cents
        type: integer
        source: computed
        description: standard_cost_cents plus the rework surcharge for rework_reject_count (calc work_order_cost).
      - name: cost_variance_cents
        type: integer
        source: computed
        description: actual_cost_cents - standard_cost_cents (calc work_order_cost).
      - name: shipped_at
        type: datetime
        source: system
        description: Logical-clock instant of the TESTED -> SHIPPED transition.
        default: null

  - name: StatorBuild
    parent: null
    common_fields: true
    entity_kind: resource
    fields:
      - name: work_order_id
        type: string
        source: input
        description: "FK -> WorkOrder.id; the work order this stator belongs to."
      - name: insulation_system
        type: enum
        source: input
        description: Slot and phase insulation system applied to the winding.
        constraints: "one of {CLASS_B_POLYESTER, CLASS_F_POLYESTERIMIDE, CLASS_H_POLYAMIDEIMIDE}"
      - name: slot_fill_pct
        type: number
        source: input
        description: Copper slot fill as a percentage of usable slot area.
        constraints: "2 decimal places; accepted range MIN_SLOT_FILL_PCT..MAX_SLOT_FILL_PCT inclusive"
      - name: winder_user_id
        type: string
        source: system
        description: X-User-ID of the BuildTechnician that wound the stator; one side of the surge-test separation.
      - name: oven_id
        type: string
        source: system
        description: "FK -> CuringOven.id; set by the impregnate transition, null while status is WOUND."
        default: null
      - name: impregnation_window_start
        type: datetime
        source: system
        description: Inclusive start of the oven occupancy window booked by impregnate.
        default: null
      - name: impregnation_window_end
        type: datetime
        source: system
        description: Inclusive end of the oven occupancy window booked by impregnate.
        default: null
      - name: impregnation_minutes
        type: integer
        source: computed
        description: Whole minutes between impregnation_window_start and impregnation_window_end; the unit of the oven booked-minutes invariant.
        default: null
      - name: varnish_process
        type: enum
        source: system
        description: Varnish impregnation process applied.
        default: null
        constraints: "one of {DIP_BAKE, VPI, TRICKLE}"
      - name: varnish_cycles
        type: integer
        source: system
        description: Number of impregnation cycles applied; extra cycles raise the dielectric capability.
        default: null
        constraints: "1 <= varnish_cycles <= 6"
      - name: cure_temp_c
        type: number
        source: system
        description: Cure temperature requested for the oven window.
        default: null
      - name: required_surge_kv
        type: number
        source: computed
        description: Surge level the winding must withstand, from rated_voltage_v and insulation_class (calc stator_surge_envelope).
      - name: achieved_capability_kv
        type: number
        source: computed
        description: Dielectric capability after varnish process and cycle bonus (calc stator_surge_envelope); null before impregnation.
        default: null
      - name: surge_test_kv
        type: number
        source: system
        description: Surge voltage actually applied during the surge test, kV.
        default: null
      - name: insulation_margin_kv
        type: number
        source: computed
        description: surge_test_kv - required_surge_kv, 2 decimal places (calc stator_surge_envelope).
        default: null
      - name: surge_test_result
        type: enum
        source: computed
        description: Set to PASS when the applied level is within capability and the margin is non-negative. Both failure modes are rejected by validation before any state change, so a stored StatorBuild never carries FAIL.
        default: null
        constraints: "one of {PASS, FAIL}"
      - name: surge_tester_user_id
        type: string
        source: system
        description: X-User-ID of the TestEngineer that ran the surge test.
        default: null
      - name: status
        type: enum
        source: system
        description: Stator build lifecycle state.
        default: WOUND
        constraints: "one of {WOUND, IMPREGNATED, SURGE_TESTED, ACCEPTED, REJECTED, SCRAPPED}"

  - name: RotorBuild
    parent: null
    common_fields: true
    entity_kind: resource
    fields:
      - name: work_order_id
        type: string
        source: input
        description: "FK -> WorkOrder.id; the work order this rotor belongs to."
      - name: construction
        type: enum
        source: computed
        description: Copied from the work order's MotorDesign.rotor_construction at creation; decides which fork of the state machine is legal.
        constraints: "one of {DIE_CAST_ALUMINUM, FABRICATED_COPPER}"
      - name: rotor_tech_user_id
        type: string
        source: system
        description: X-User-ID of the BuildTechnician that created the rotor build.
      - name: melt_temp_c
        type: number
        source: system
        description: Aluminium melt temperature recorded on the die-cast fork only.
        default: null
      - name: die_preheat_c
        type: number
        source: system
        description: Die preheat temperature recorded on the die-cast fork only.
        default: null
      - name: braze_alloy
        type: string
        source: system
        description: Braze filler alloy recorded on the fabricated-copper fork only.
        default: null
      - name: bar_count
        type: integer
        source: system
        description: Copper bars brazed, recorded on the fabricated-copper fork only; MUST equal MotorDesign.rotor_bar_count.
        default: null
      - name: cage_conductivity_ratio
        type: number
        source: computed
        description: Cage conductivity relative to copper, set by the fork taken (calc rotor_cage_properties).
        default: null
      - name: slip_penalty_pct
        type: number
        source: computed
        description: Slip penalty attributed to the cage route, set by the fork taken (calc rotor_cage_properties).
        default: null
      - name: rotor_process_cost_cents
        type: integer
        source: computed
        description: Per-unit cage process cost attributed by the fork taken (calc rotor_cage_properties).
        default: null
      - name: measured_rotor_od_mm
        type: number
        source: system
        description: Finished rotor outer diameter measured after machining, mm.
        default: null
      - name: rotor_mass_kg
        type: number
        source: system
        description: Finished rotor mass used for the balance limit, kg.
        default: null
      - name: measured_air_gap_mm
        type: number
        source: computed
        description: (MotorDesign.stator_bore_id_mm - measured_rotor_od_mm) / 2, 3 decimal places (calc rotor_air_gap).
        default: null
      - name: air_gap_deviation_mm
        type: number
        source: computed
        description: measured_air_gap_mm - MotorDesign.design_air_gap_mm, 3 decimal places (calc rotor_air_gap).
        default: null
      - name: permissible_unbalance_g_mm
        type: number
        source: computed
        description: ISO balance-grade limit from balance_grade, rotor_mass_kg and pole count (calc rotor_balance_limit).
        default: null
      - name: balance_grade
        type: enum
        source: system
        description: Balance quality grade the rotor was balanced to.
        default: null
        constraints: "one of {G1_0, G2_5, G6_3}"
      - name: initial_unbalance_g_mm
        type: number
        source: system
        description: Unbalance measured before correction, g*mm.
        default: null
      - name: residual_unbalance_g_mm
        type: number
        source: system
        description: Unbalance remaining after correction, g*mm; gated against permissible_unbalance_g_mm.
        default: null
      - name: status
        type: enum
        source: system
        description: Rotor build lifecycle state; the two fork states are mutually exclusive.
        default: PLANNED
        constraints: "one of {PLANNED, CAST_POURED, BARS_BRAZED, MACHINED, ACCEPTED, REJECTED, SCRAPPED}"

  - name: AssemblyRecord
    parent: null
    common_fields: true
    entity_kind: resource
    fields:
      - name: work_order_id
        type: string
        source: input
        description: "FK -> WorkOrder.id; the work order assembled."
      - name: stator_build_id
        type: string
        source: input
        description: "FK -> StatorBuild.id; MUST be a StatorBuild on the same work order in status ACCEPTED."
      - name: rotor_build_id
        type: string
        source: input
        description: "FK -> RotorBuild.id; MUST be a RotorBuild on the same work order in status ACCEPTED."
      - name: de_bearing_lot
        type: string
        source: input
        description: Drive-end bearing lot identifier as installed.
        constraints: "1-32 chars"
      - name: nde_bearing_lot
        type: string
        source: input
        description: Non-drive-end bearing lot identifier as installed.
        constraints: "1-32 chars"
      - name: bearing_install_method
        type: enum
        source: input
        description: Method used to mount the bearings on the shaft.
        constraints: "one of {INDUCTION_HEAT, PRESS, OIL_BATH}"
      - name: shaft_measured_diameter_mm
        type: number
        source: input
        description: Measured drive-end journal diameter, mm.
        constraints: "3 decimal places"
      - name: grease_fill_pct
        type: number
        source: input
        description: Grease fill as a percentage of free bearing volume.
        constraints: "2 decimal places; band depends on MotorDesign.lubrication_spec"
      - name: shaft_fit_deviation_um
        type: integer
        source: computed
        description: (shaft_measured_diameter_mm - MotorDesign.shaft_diameter_mm) * 1000 rounded to whole micrometres (calc assembly_shaft_fit).
      - name: lubrication_spec_applied
        type: enum
        source: computed
        description: Copied from MotorDesign.lubrication_spec at creation; the band used to validate grease_fill_pct.
        constraints: "one of {GREASE_LIFETIME, GREASE_REGREASABLE, OIL_MIST}"
      - name: assembler_user_id
        type: string
        source: system
        description: X-User-ID of the TestEngineer that recorded the assembly.
      - name: status
        type: enum
        source: system
        description: Assembly record state.
        default: BUILT
        constraints: "one of {BUILT, SCRAPPED}"

  - name: PerformanceTest
    parent: null
    common_fields: true
    entity_kind: resource
    fields:
      - name: work_order_id
        type: string
        source: input
        description: "FK -> WorkOrder.id; the assembled work order under test."
      - name: test_cell_id
        type: string
        source: input
        description: "FK -> TestCell.id; the dynamometer cell reserved for the window."
      - name: window_start
        type: datetime
        source: input
        description: Inclusive start of the half-open test-cell window.
      - name: window_end
        type: datetime
        source: input
        description: Exclusive end of the half-open test-cell window.
      - name: dyno_draw_kw
        type: number
        source: input
        description: Electrical draw the test reserves in the cell, kW; summed against TestCell.max_concurrent_kw.
        constraints: "0.1 <= dyno_draw_kw <= 500.0, 1 decimal place"
      - name: test_method
        type: enum
        source: input
        description: Efficiency determination method; selects the calc variant.
        constraints: "one of {IEC_60034_2_1_SUMMATION, IEEE_112_B_DYNAMOMETER}"
      - name: status
        type: enum
        source: system
        description: Test lifecycle state.
        default: SCHEDULED
        constraints: "one of {SCHEDULED, COMPLETED, SUPERSEDED}"
      - name: requires_requalification
        type: boolean
        source: system
        description: Set true when the work order's pinned design leaves RELEASED while this test is still SCHEDULED; blocks recording.
        default: false
      - name: input_power_kw
        type: number
        source: system
        description: Electrical input power recorded at test, kW.
        default: null
      - name: output_power_kw
        type: number
        source: system
        description: Mechanical output power recorded at test, kW.
        default: null
      - name: stator_loss_w
        type: number
        source: system
        description: Raw stator winding loss recorded at test, W.
        default: null
      - name: rotor_loss_w
        type: number
        source: system
        description: Rotor loss recorded at test, W.
        default: null
      - name: core_loss_w
        type: number
        source: system
        description: Core loss recorded at test, W.
        default: null
      - name: friction_windage_w
        type: number
        source: system
        description: Friction and windage loss recorded at test, W.
        default: null
      - name: ambient_temp_c
        type: number
        source: system
        description: Ambient temperature at test, degrees C; drives the stator loss temperature correction.
        default: null
      - name: stator_loss_corrected_w
        type: number
        source: computed
        description: Temperature-corrected stator loss rounded to 0.1 W (calc test_measured_efficiency).
        default: null
      - name: stray_load_loss_w
        type: number
        source: computed
        description: Stray load loss as a fixed fraction of input power, rounded to 0.1 W (calc test_measured_efficiency).
        default: null
      - name: total_loss_w
        type: number
        source: computed
        description: Sum of the five per-component losses AFTER each is rounded to 0.1 W (calc test_measured_efficiency).
        default: null
      - name: measured_efficiency_pct
        type: number
        source: computed
        description: Measured efficiency, 2 decimal places, from the variant selected by test_method (calc test_measured_efficiency).
        default: null
      - name: achieved_class
        type: enum
        source: computed
        description: Efficiency class implied by measured_efficiency_pct with no tolerance derate.
        default: null
        constraints: "one of {BELOW_IE2, IE2, IE3, IE4, IE5}"
      - name: test_engineer_user_id
        type: string
        source: system
        description: X-User-ID of the TestEngineer that recorded the measurements; one side of the certification separation.
        default: null
      - name: recorded_at
        type: datetime
        source: system
        description: Logical-clock instant of the SCHEDULED -> COMPLETED transition.
        default: null

  - name: Nameplate
    parent: null
    common_fields: true
    entity_kind: resource
    fields:
      - name: work_order_id
        type: string
        source: input
        description: "FK -> WorkOrder.id; the work order being certified."
      - name: performance_test_id
        type: string
        source: input
        description: "FK -> PerformanceTest.id; MUST be a COMPLETED test on the same work order."
      - name: jurisdiction
        type: enum
        source: input
        description: Jurisdiction the nameplate is certified for; MUST equal the CustomerOrder.jurisdiction of the work order's order.
        constraints: "one of {EU, US, CN}"
      - name: standard_id
        type: string
        source: computed
        description: "FK -> RegulatoryStandard.id; the row chosen by the regulatory_standard_selector calc."
      - name: minimum_efficiency_pct_applied
        type: number
        source: computed
        description: minimum_efficiency_pct of the selected RegulatoryStandard, copied at issue time.
      - name: stamped_efficiency_pct
        type: number
        source: computed
        description: PerformanceTest.measured_efficiency_pct copied onto the nameplate.
      - name: stamped_class
        type: enum
        source: computed
        description: PerformanceTest.achieved_class copied onto the nameplate.
        constraints: "one of {IE2, IE3, IE4, IE5}"
      - name: certifier_user_id
        type: string
        source: system
        description: X-User-ID of the QualityCertifier that issued the nameplate.
      - name: issued_at
        type: datetime
        source: system
        description: Logical-clock instant of issue; the pro-rata origin for warranty credit.
      - name: revoked_at
        type: datetime
        source: system
        description: Logical-clock instant of revocation.
        default: null
      - name: revocation_reason
        type: string
        source: system
        description: Free-text reason recorded at revocation.
        default: null
      - name: status
        type: enum
        source: system
        description: Nameplate certificate state.
        default: ISSUED
        constraints: "one of {ISSUED, REVOKED}"

  - name: WarrantyClaim
    parent: null
    common_fields: true
    entity_kind: resource
    fields:
      - name: work_order_id
        type: string
        source: input
        description: "FK -> WorkOrder.id; the shipped work order the failed motor came from."
      - name: distributor_id
        type: string
        source: input
        description: "FK -> Distributor.id; the claiming distributor. MUST equal X-User-ID when X-User-Role is Distributor and MUST equal the work order's CustomerOrder.distributor_id."
      - name: failure_mode
        type: enum
        source: input
        description: Reported failure mode.
        constraints: "one of {BEARING_FAILURE, WINDING_SHORT, ROTOR_BAR_CRACK, SHAFT_FRACTURE, INSULATION_BREAKDOWN}"
      - name: operating_hours
        type: integer
        source: input
        description: Reported operating hours at failure.
        constraints: "0 <= operating_hours <= 200000"
      - name: measured_load_pct
        type: number
        source: input
        description: Reported steady-state load as a percentage of rating.
        constraints: "1 decimal place"
      - name: measured_ambient_c
        type: number
        source: input
        description: Reported ambient temperature at the installation, degrees C.
        constraints: "1 decimal place"
      - name: measured_voltage_unbalance_pct
        type: number
        source: input
        description: Reported supply voltage unbalance, percent.
        constraints: "1 decimal place"
      - name: measured_starts_per_hour
        type: integer
        source: input
        description: Reported starts per hour at the installation.
        constraints: "0 <= measured_starts_per_hour <= 500"
      - name: claimed_parts_cents
        type: integer
        source: input
        description: Parts amount claimed, cents.
        constraints: ">= 0"
      - name: claimed_labor_cents
        type: integer
        source: input
        description: Labour amount claimed, cents.
        constraints: ">= 0"
      - name: claimed_freight_cents
        type: integer
        source: input
        description: Freight amount claimed, cents.
        constraints: ">= 0"
      - name: reported_at
        type: datetime
        source: system
        description: Logical-clock instant at claim submission; the pro-rata endpoint for warranty credit.
      - name: analysis_basis
        type: enum
        source: system
        description: Basis of the most recent adjudication; selects the misuse-index variant.
        default: null
        constraints: "one of {FIELD_DATA, TEARDOWN}"
      - name: teardown_defect_evidence_pct
        type: number
        source: system
        description: Laboratory teardown evidence of manufacturing defect, percent; required for the TEARDOWN basis.
        default: null
      - name: misuse_index
        type: number
        source: computed
        description: Weighted application-misuse index, 4 decimal places (calc warranty_misuse_index).
        default: null
      - name: adjudication
        type: enum
        source: computed
        description: Adjudication implied by misuse_index against MISUSE_THRESHOLD (calc warranty_misuse_index).
        default: null
        constraints: "one of {DEFECT_CONFIRMED, MISUSE_DETERMINED}"
      - name: claim_unit_standard_cost_cents
        type: integer
        source: computed
        description: WorkOrder.standard_cost_cents divided by WorkOrder.unit_count, rounded to whole cents (calc warranty_credit_waterfall).
        default: null
      - name: warranty_credit_cents
        type: integer
        source: computed
        description: Credit granted by the waterfall allocation; 0 whenever adjudication is MISUSE_DETERMINED (calc warranty_credit_waterfall).
        default: 0
      - name: credit_posted
        type: boolean
        source: system
        description: True while warranty_credit_cents is counted in Distributor.warranty_credit_balance_cents.
        default: false
      - name: defect_presumption_applied
        type: boolean
        source: system
        description: Set true by the nameplate-revocation cascade; forces the TEARDOWN analysis basis.
        default: false
      - name: dispute_round
        type: integer
        source: system
        description: Number of distributor disputes raised; bounded by MAX_DISPUTE_ROUNDS.
        default: 0
      - name: status
        type: enum
        source: system
        description: Claim lifecycle state.
        default: SUBMITTED
        constraints: "one of {SUBMITTED, UNDER_ANALYSIS, DEFECT_CONFIRMED, MISUSE_DETERMINED, CLOSED}"

  - name: CuringOven
    parent: null
    common_fields: true
    entity_kind: resource
    fields:
      - name: oven_code
        type: string
        source: input
        description: Oven identifier on the plant floor.
        constraints: "1-24 chars; unique over all CuringOven rows"
      - name: max_temp_c
        type: number
        source: input
        description: Maximum cure temperature the oven supports, degrees C.
        constraints: "60.0 <= max_temp_c <= 300.0, 1 decimal place"
      - name: cooldown_buffer_minutes
        type: integer
        source: input
        description: Minutes of mandatory cooldown that extend every booked window's trailing edge for conflict purposes.
        constraints: "0 <= cooldown_buffer_minutes <= 240"
      - name: status
        type: enum
        source: input
        description: Oven availability.
        default: AVAILABLE
        constraints: "one of {AVAILABLE, MAINTENANCE}"
      - name: booked_minutes
        type: integer
        source: computed
        description: Sum of impregnation_minutes over StatorBuild rows with this oven_id and status IN {IMPREGNATED, SURGE_TESTED, ACCEPTED} (calc oven_booked_minutes_ledger).
        default: 0

  - name: TestCell
    parent: null
    common_fields: true
    entity_kind: resource
    fields:
      - name: cell_code
        type: string
        source: input
        description: Dynamometer cell identifier.
        constraints: "1-24 chars; unique over all TestCell rows"
      - name: max_concurrent_kw
        type: number
        source: input
        description: Aggregate electrical draw the cell can supply to concurrently scheduled tests, kW.
        constraints: "1.0 <= max_concurrent_kw <= 2000.0, 1 decimal place"
      - name: status
        type: enum
        source: input
        description: Cell availability.
        default: AVAILABLE
        constraints: "one of {AVAILABLE, MAINTENANCE}"
      - name: peak_reserved_kw
        type: number
        source: computed
        description: Largest instantaneous sum of dyno_draw_kw over SCHEDULED PerformanceTest windows on this cell, 1 decimal place (calc test_cell_capacity_ledger).
        default: 0.0

# -----------------------------------------------------------------------------
# §1.2 State Machine Table
# -----------------------------------------------------------------------------
state_machines:
  - entity: MotorDesign
    shape: cyclic
    initial_state: DRAFT
    terminal_states: [OBSOLETE]
    transitions:
      - from: DRAFT
        to: IN_REVIEW
        trigger: "POST /motor-designs/{id}/submit-review"
        actor: DesignEngineer
        preconditions:
          - "MotorDesign.status == DRAFT"
          - "X-User-ID == MotorDesign.created_by_user_id"
        side_effects:
          - "recompute total_predicted_loss_w, predicted_efficiency_pct, guaranteed_efficiency_pct, design_estimate_class and predicted_class per calc design_predicted_efficiency"
          - "increments MotorDesign.version by 1"
        note: "Re-submitting after REQUEST_CHANGES re-runs the loss model against the edited field set."
      - from: REVISION_OPEN
        to: IN_REVIEW
        trigger: "POST /motor-designs/{id}/submit-review"
        actor: DesignEngineer
        preconditions:
          - "MotorDesign.status == REVISION_OPEN"
          - "X-User-ID == MotorDesign.created_by_user_id"
        side_effects:
          - "recompute all calc design_predicted_efficiency outputs"
          - "increments MotorDesign.version by 1"
        note: "Closes the RELEASED -> REVISION_OPEN -> IN_REVIEW -> RELEASED cycle."
      - from: IN_REVIEW
        to: DRAFT
        trigger: "POST /motor-designs/{id}/review-decision with decision REQUEST_CHANGES"
        actor: DesignReviewer
        preconditions:
          - "MotorDesign.status == IN_REVIEW"
          - "X-User-ID != MotorDesign.created_by_user_id (design-approval separation)"
          - "MotorDesign.review_round < MAX_REVIEW_ROUNDS"
        side_effects:
          - "sets MotorDesign.revision_index = revision_index + 1"
          - "sets MotorDesign.review_round = review_round + 1"
          - "increments MotorDesign.version by 1"
        note: "The revision loop; the round counter bounds it."
      - from: IN_REVIEW
        to: RELEASED
        trigger: "POST /motor-designs/{id}/review-decision with decision APPROVE"
        actor: DesignReviewer
        preconditions:
          - "MotorDesign.status == IN_REVIEW"
          - "X-User-ID != MotorDesign.created_by_user_id (design-approval separation)"
          - "MotorDesign.review_round < MAX_REVIEW_ROUNDS"
          - "class_ordinal(MotorDesign.predicted_class) >= class_ordinal(MotorDesign.target_efficiency_class)"
        side_effects:
          - "sets MotorDesign.review_round = review_round + 1"
          - "sets MotorDesign.released_at = logical clock now"
          - "sets MotorDesign.released_by_user_id = X-User-ID"
          - "increments MotorDesign.version by 1"
      - from: IN_REVIEW
        to: OBSOLETE
        trigger: "POST /motor-designs/{id}/review-decision with decision OBSOLETE"
        actor: DesignReviewer
        preconditions:
          - "MotorDesign.status == IN_REVIEW"
          - "X-User-ID != MotorDesign.created_by_user_id (design-approval separation)"
        side_effects:
          - "sets MotorDesign.review_round = review_round + 1"
          - "increments MotorDesign.version by 1"
        note: "Terminal. A design in OBSOLETE can never back a new CustomerOrder or WorkOrder."
      - from: RELEASED
        to: REVISION_OPEN
        trigger: "POST /motor-designs/{id}/open-revision"
        actor: DesignEngineer
        preconditions:
          - "MotorDesign.status == RELEASED"
          - "X-User-ID == MotorDesign.created_by_user_id"
        side_effects:
          - "sets MotorDesign.revision_index = revision_index + 1"
          - "CASCADE hop 1: every WorkOrder with design_id == MotorDesign.id and build_status IN {RELEASED, SUBASSEMBLIES_DONE, ASSEMBLED, TESTED} sets design_pin_stale = true and increments its own version by 1, in created_at ASC order"
          - "CASCADE hop 2: caused by hop 1 — for each WorkOrder whose design_pin_stale just became true, every PerformanceTest with that work_order_id and status == SCHEDULED sets requires_requalification = true and increments its own version by 1, in created_at ASC order"
          - "increments MotorDesign.version by 1"

  - entity: CustomerOrder
    shape: branching
    initial_state: DRAFT
    terminal_states: [FULFILLED, CANCELLED]
    transitions:
      - from: DRAFT
        to: CONFIRMED
        trigger: "POST /customer-orders/{id}/confirm"
        actor: ProductionPlanner
        preconditions:
          - "CustomerOrder.status == DRAFT"
          - "MotorDesign(design_id).status == RELEASED"
          - "order_type != STOCK_REPLENISH OR Distributor.stocking_program_enrolled == true"
          - "promised_ship_date (recomputed now) <= requested_ship_date"
          - "quantity <= Distributor.stock_allowance_remaining_units"
        side_effects:
          - "recompute promised_lead_time_days and promised_ship_date per calc order_lead_time using the logical clock date"
          - "sets CustomerOrder.confirmed_at = logical clock now"
          - "Distributor.units_outstanding += quantity; Distributor.stock_allowance_remaining_units -= quantity (calc distributor_allowance_ledger)"
          - "increments Distributor.version by 1"
          - "increments CustomerOrder.version by 1"
      - from: CONFIRMED
        to: IN_PRODUCTION
        trigger: "system event: a WorkOrder is created against this order (POST /work-orders)"
        actor: system
        preconditions:
          - "CustomerOrder.status == CONFIRMED"
        side_effects:
          - "increments CustomerOrder.version by 1"
      - from: IN_PRODUCTION
        to: FULFILLED
        trigger: "system event: the order's WorkOrder reaches build_status SHIPPED (POST /work-orders/{id}/ship)"
        actor: system
        preconditions:
          - "CustomerOrder.status == IN_PRODUCTION"
        side_effects:
          - "Distributor.units_outstanding -= quantity; Distributor.stock_allowance_remaining_units += quantity (calc distributor_allowance_ledger)"
          - "increments Distributor.version by 1"
          - "increments CustomerOrder.version by 1"
      - from: DRAFT
        to: CANCELLED
        trigger: "POST /customer-orders/{id}/cancel"
        actor: ProductionPlanner
        preconditions:
          - "CustomerOrder.status == DRAFT"
        side_effects:
          - "increments CustomerOrder.version by 1"
        note: "No allowance was ever debited from a DRAFT order, so nothing is credited back."
      - from: CONFIRMED
        to: CANCELLED
        trigger: "POST /customer-orders/{id}/cancel"
        actor: ProductionPlanner
        preconditions:
          - "CustomerOrder.status == CONFIRMED"
        side_effects:
          - "Distributor.units_outstanding -= quantity; Distributor.stock_allowance_remaining_units += quantity (calc distributor_allowance_ledger)"
          - "increments Distributor.version by 1"
          - "increments CustomerOrder.version by 1"
      - from: IN_PRODUCTION
        to: CANCELLED
        trigger: "POST /customer-orders/{id}/cancel"
        actor: ProductionPlanner
        preconditions:
          - "CustomerOrder.status == IN_PRODUCTION"
        side_effects:
          - "Distributor.units_outstanding -= quantity; Distributor.stock_allowance_remaining_units += quantity (calc distributor_allowance_ledger); increments Distributor.version by 1"
          - "CASCADE hop 1: every WorkOrder with order_id == CustomerOrder.id and build_status NOT IN {SHIPPED, CANCELLED} moves build_status to CANCELLED and increments its own version by 1, in created_at ASC order"
          - "CASCADE hop 2: caused by hop 1 — for each WorkOrder that just moved to CANCELLED, every StatorBuild with that work_order_id and status NOT IN {REJECTED, SCRAPPED} moves to SCRAPPED, and every RotorBuild with that work_order_id and status NOT IN {REJECTED, SCRAPPED} moves to SCRAPPED, and every AssemblyRecord with that work_order_id and status == BUILT moves to SCRAPPED; each increments its own version by 1, in created_at ASC order per collection (StatorBuild, then RotorBuild, then AssemblyRecord)"
          - "CASCADE hop 3: caused by hop 2 — for each StatorBuild that just moved to SCRAPPED and had a non-null oven_id, CuringOven(oven_id).booked_minutes is recomputed per calc oven_booked_minutes_ledger (the scrapped build leaves the counted status set) and that oven's version is incremented by 1"
          - "increments CustomerOrder.version by 1"
        note: "Depth-4 transitive cascade: CustomerOrder -> WorkOrder -> StatorBuild -> CuringOven."

  - entity: WorkOrder
    shape: parallel
    initial_state: "build_status=RELEASED, certification_status=PENDING"
    terminal_states: [SHIPPED, CANCELLED]
    dimension_note: |
      build_status and certification_status are independent axes on the same row. build_status is
      driven by shop-floor events; certification_status is driven by nameplate issue/revoke and may
      cycle PENDING -> CERTIFIED -> SUSPENDED -> CERTIFIED without build_status changing at all.
    transitions:
      - from: "build_status=RELEASED"
        to: "build_status=SUBASSEMBLIES_DONE"
        trigger: "system event: the disposition that makes both a StatorBuild and a RotorBuild on this work order ACCEPTED (POST /stator-builds/{id}/disposition or POST /rotor-builds/{id}/balance-disposition)"
        actor: system
        preconditions:
          - "WorkOrder.build_status == RELEASED"
          - "at least one StatorBuild with this work_order_id has status == ACCEPTED"
          - "at least one RotorBuild with this work_order_id has status == ACCEPTED"
        side_effects:
          - "increments WorkOrder.version by 1"
        note: "Fork-join point: the two subassembly branches converge here and the order in which they complete does not matter."
      - from: "build_status=SUBASSEMBLIES_DONE"
        to: "build_status=ASSEMBLED"
        trigger: "system event: POST /assembly-records creates the AssemblyRecord for this work order"
        actor: system
        preconditions:
          - "WorkOrder.build_status == SUBASSEMBLIES_DONE"
        side_effects:
          - "increments WorkOrder.version by 1"
      - from: "build_status=ASSEMBLED"
        to: "build_status=TESTED"
        trigger: "system event: POST /performance-tests/{id}/record completes a PerformanceTest on this work order"
        actor: system
        preconditions:
          - "WorkOrder.build_status == ASSEMBLED"
        side_effects:
          - "increments WorkOrder.version by 1"
      - from: "build_status=TESTED"
        to: "build_status=SHIPPED"
        trigger: "POST /work-orders/{id}/ship"
        actor: ProductionPlanner
        preconditions:
          - "WorkOrder.build_status == TESTED"
          - "WorkOrder.certification_status == CERTIFIED"
        side_effects:
          - "sets WorkOrder.shipped_at = logical clock now"
          - "CustomerOrder(order_id) moves IN_PRODUCTION -> FULFILLED with its own allowance credit-back side effects"
          - "increments WorkOrder.version by 1"
        note: "Guarded across dimensions: a TESTED work order whose certification_status is PENDING or SUSPENDED cannot ship."
      - from: "build_status IN {RELEASED, SUBASSEMBLIES_DONE, ASSEMBLED, TESTED}"
        to: "build_status=CANCELLED"
        trigger: "system event: the order's CustomerOrder is cancelled (POST /customer-orders/{id}/cancel)"
        actor: system
        preconditions:
          - "WorkOrder.build_status NOT IN {SHIPPED, CANCELLED}"
        side_effects:
          - "propagates the SCRAPPED cascade to StatorBuild, RotorBuild and AssemblyRecord rows as described on the CustomerOrder IN_PRODUCTION -> CANCELLED transition"
          - "increments WorkOrder.version by 1"
      - from: "certification_status=PENDING"
        to: "certification_status=CERTIFIED"
        trigger: "system event: POST /nameplates issues a Nameplate for this work order"
        actor: system
        preconditions:
          - "WorkOrder.certification_status == PENDING"
          - "WorkOrder.build_status == TESTED"
        side_effects:
          - "increments WorkOrder.version by 1"
      - from: "certification_status=CERTIFIED"
        to: "certification_status=SUSPENDED"
        trigger: "system event: POST /nameplates/{id}/revoke revokes the work order's ISSUED Nameplate"
        actor: system
        preconditions:
          - "WorkOrder.certification_status == CERTIFIED"
        side_effects:
          - "CASCADE hop 2 of the revocation chain: caused by this suspension — every WarrantyClaim with this work_order_id and status IN {SUBMITTED, UNDER_ANALYSIS} sets defect_presumption_applied = true and increments its own version by 1, in created_at ASC order"
          - "CASCADE hop 3: caused by hop 2 — for each Distributor owning a claim whose defect_presumption_applied just became true, open_presumed_defect_count is recomputed and that Distributor's version is incremented by 1"
          - "increments WorkOrder.version by 1"
      - from: "certification_status=SUSPENDED"
        to: "certification_status=CERTIFIED"
        trigger: "system event: POST /nameplates issues a replacement Nameplate for this work order"
        actor: system
        preconditions:
          - "WorkOrder.certification_status == SUSPENDED"
          - "WorkOrder.build_status == TESTED"
        side_effects:
          - "increments WorkOrder.version by 1"
        note: "Closes the certification cycle CERTIFIED -> SUSPENDED -> CERTIFIED with build_status untouched."

  - entity: StatorBuild
    shape: linear
    initial_state: WOUND
    terminal_states: [ACCEPTED, REJECTED, SCRAPPED]
    transitions:
      - from: WOUND
        to: IMPREGNATED
        trigger: "POST /stator-builds/{id}/impregnate"
        actor: BuildTechnician
        preconditions:
          - "StatorBuild.status == WOUND"
          - "CuringOven(oven_id).status == AVAILABLE"
          - "cure_temp_c <= CuringOven.max_temp_c"
          - "impregnation_window_end > impregnation_window_start"
          - "no other StatorBuild on this oven with status IN {IMPREGNATED, SURGE_TESTED, ACCEPTED} conflicts under the buffered closed-interval rule (validation priority 80)"
        side_effects:
          - "sets oven_id, impregnation_window_start, impregnation_window_end, varnish_process, varnish_cycles, cure_temp_c"
          - "sets impregnation_minutes = whole minutes between window start and end"
          - "sets achieved_capability_kv per calc stator_surge_envelope"
          - "CuringOven.booked_minutes recomputed per calc oven_booked_minutes_ledger; increments CuringOven.version by 1"
          - "increments StatorBuild.version by 1"
      - from: IMPREGNATED
        to: SURGE_TESTED
        trigger: "POST /stator-builds/{id}/surge-test"
        actor: TestEngineer
        preconditions:
          - "StatorBuild.status == IMPREGNATED"
          - "X-User-ID != StatorBuild.winder_user_id (surge-test separation)"
          - "surge_test_kv <= StatorBuild.achieved_capability_kv"
          - "surge_test_kv - required_surge_kv >= 0.00"
        side_effects:
          - "sets surge_test_kv, surge_tester_user_id"
          - "sets insulation_margin_kv per calc stator_surge_envelope and surge_test_result = PASS"
          - "increments StatorBuild.version by 1"
      - from: SURGE_TESTED
        to: ACCEPTED
        trigger: "POST /stator-builds/{id}/disposition with disposition ACCEPTED"
        actor: TestEngineer
        preconditions:
          - "StatorBuild.status == SURGE_TESTED"
          - "StatorBuild.surge_test_result == PASS"
        side_effects:
          - "if a RotorBuild on the same work order is already ACCEPTED, WorkOrder.build_status moves RELEASED -> SUBASSEMBLIES_DONE"
          - "increments StatorBuild.version by 1"
      - from: "status IN {WOUND, IMPREGNATED, SURGE_TESTED}"
        to: REJECTED
        trigger: "POST /stator-builds/{id}/disposition with disposition REJECTED"
        actor: TestEngineer
        preconditions:
          - "StatorBuild.status IN {WOUND, IMPREGNATED, SURGE_TESTED}"
        side_effects:
          - "if oven_id is non-null, CuringOven.booked_minutes recomputed per calc oven_booked_minutes_ledger (the rejected build leaves the counted status set) and CuringOven.version incremented by 1 — the compensating half of the oven booked-minutes invariant"
          - "WorkOrder.rework_reject_count += 1; WorkOrder.actual_cost_cents and cost_variance_cents recomputed per calc work_order_cost; increments WorkOrder.version by 1"
          - "increments StatorBuild.version by 1"
      - from: "status IN {WOUND, IMPREGNATED, SURGE_TESTED}"
        to: SCRAPPED
        trigger: "system event: the work order is cancelled by the CustomerOrder cancel cascade"
        actor: system
        preconditions:
          - "StatorBuild.status NOT IN {REJECTED, SCRAPPED}"
        side_effects:
          - "if oven_id is non-null, CuringOven.booked_minutes recomputed per calc oven_booked_minutes_ledger and CuringOven.version incremented by 1"
          - "increments StatorBuild.version by 1"
        note: "Scrapping does NOT increment rework_reject_count — a cancelled order is not a rework event."

  - entity: RotorBuild
    shape: branching
    initial_state: PLANNED
    terminal_states: [ACCEPTED, REJECTED, SCRAPPED]
    transitions:
      - from: PLANNED
        to: CAST_POURED
        trigger: "POST /rotor-builds/{id}/form-cage with cage_method DIE_CAST"
        actor: BuildTechnician
        preconditions:
          - "RotorBuild.status == PLANNED"
          - "RotorBuild.construction == DIE_CAST_ALUMINUM"
          - "melt_temp_c and die_preheat_c are present; braze_alloy and bar_count are absent"
        side_effects:
          - "sets melt_temp_c, die_preheat_c"
          - "sets cage_conductivity_ratio = CAGE_CONDUCTIVITY_RATIO.DIE_CAST_ALUMINUM, slip_penalty_pct = SLIP_PENALTY_PCT.DIE_CAST_ALUMINUM, rotor_process_cost_cents = ROTOR_PROCESS_COST_CENTS.DIE_CAST_ALUMINUM per calc rotor_cage_properties"
          - "increments RotorBuild.version by 1"
        note: "Fork branch A. Divergent side-effect set: melt/preheat fields written, cage properties take the aluminium triple."
      - from: PLANNED
        to: BARS_BRAZED
        trigger: "POST /rotor-builds/{id}/form-cage with cage_method BRAZED_BAR"
        actor: BuildTechnician
        preconditions:
          - "RotorBuild.status == PLANNED"
          - "RotorBuild.construction == FABRICATED_COPPER"
          - "braze_alloy and bar_count are present; melt_temp_c and die_preheat_c are absent"
          - "bar_count == MotorDesign(WorkOrder.design_id).rotor_bar_count"
        side_effects:
          - "sets braze_alloy, bar_count"
          - "sets cage_conductivity_ratio = CAGE_CONDUCTIVITY_RATIO.FABRICATED_COPPER, slip_penalty_pct = SLIP_PENALTY_PCT.FABRICATED_COPPER, rotor_process_cost_cents = ROTOR_PROCESS_COST_CENTS.FABRICATED_COPPER per calc rotor_cage_properties"
          - "increments RotorBuild.version by 1"
        note: "Fork branch B. Divergent side-effect set: braze/bar fields written, cage properties take the copper triple, plus the bar-count cross-check that branch A does not perform."
      - from: "status IN {CAST_POURED, BARS_BRAZED}"
        to: MACHINED
        trigger: "POST /rotor-builds/{id}/machine"
        actor: BuildTechnician
        preconditions:
          - "RotorBuild.status IN {CAST_POURED, BARS_BRAZED}"
          - "abs(air_gap_deviation_mm computed from measured_rotor_od_mm) <= MotorDesign.air_gap_tolerance_mm"
        side_effects:
          - "sets measured_rotor_od_mm, rotor_mass_kg"
          - "sets measured_air_gap_mm and air_gap_deviation_mm per calc rotor_air_gap"
          - "increments RotorBuild.version by 1"
        note: "Join point: both forks converge here with identical downstream behaviour."
      - from: MACHINED
        to: ACCEPTED
        trigger: "POST /rotor-builds/{id}/balance-disposition with disposition ACCEPTED"
        actor: TestEngineer
        preconditions:
          - "RotorBuild.status == MACHINED"
          - "residual_unbalance_g_mm <= permissible_unbalance_g_mm computed per calc rotor_balance_limit"
        side_effects:
          - "sets balance_grade, initial_unbalance_g_mm, residual_unbalance_g_mm, permissible_unbalance_g_mm"
          - "if a StatorBuild on the same work order is already ACCEPTED, WorkOrder.build_status moves RELEASED -> SUBASSEMBLIES_DONE"
          - "increments RotorBuild.version by 1"
      - from: MACHINED
        to: REJECTED
        trigger: "POST /rotor-builds/{id}/balance-disposition with disposition REJECTED"
        actor: TestEngineer
        preconditions:
          - "RotorBuild.status == MACHINED"
        side_effects:
          - "sets balance_grade, initial_unbalance_g_mm, residual_unbalance_g_mm, permissible_unbalance_g_mm"
          - "WorkOrder.rework_reject_count += 1; WorkOrder.actual_cost_cents and cost_variance_cents recomputed per calc work_order_cost; increments WorkOrder.version by 1"
          - "increments RotorBuild.version by 1"
      - from: "status IN {PLANNED, CAST_POURED, BARS_BRAZED, MACHINED}"
        to: SCRAPPED
        trigger: "system event: the work order is cancelled by the CustomerOrder cancel cascade"
        actor: system
        preconditions:
          - "RotorBuild.status NOT IN {REJECTED, SCRAPPED}"
        side_effects:
          - "increments RotorBuild.version by 1"

  - entity: AssemblyRecord
    shape: linear
    initial_state: BUILT
    terminal_states: [SCRAPPED]
    transitions:
      - from: BUILT
        to: SCRAPPED
        trigger: "system event: the work order is cancelled by the CustomerOrder cancel cascade"
        actor: system
        preconditions:
          - "AssemblyRecord.status == BUILT"
        side_effects:
          - "increments AssemblyRecord.version by 1"

  - entity: PerformanceTest
    shape: branching
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, SUPERSEDED]
    transitions:
      - from: SCHEDULED
        to: COMPLETED
        trigger: "POST /performance-tests/{id}/record"
        actor: TestEngineer
        preconditions:
          - "PerformanceTest.status == SCHEDULED"
          - "PerformanceTest.requires_requalification == false"
          - "logical clock now >= PerformanceTest.window_start"
        side_effects:
          - "sets input_power_kw, output_power_kw, stator_loss_w, rotor_loss_w, core_loss_w, friction_windage_w, ambient_temp_c, test_engineer_user_id, recorded_at"
          - "sets stator_loss_corrected_w, stray_load_loss_w, total_loss_w, measured_efficiency_pct, achieved_class per calc test_measured_efficiency using the variant selected by test_method"
          - "TestCell.peak_reserved_kw recomputed per calc test_cell_capacity_ledger; increments TestCell.version by 1"
          - "WorkOrder.build_status moves ASSEMBLED -> TESTED; increments WorkOrder.version by 1"
          - "increments PerformanceTest.version by 1"
      - from: SCHEDULED
        to: SUPERSEDED
        trigger: "system event: a new PerformanceTest is scheduled for the same work order (POST /performance-tests)"
        actor: system
        preconditions:
          - "PerformanceTest.status == SCHEDULED"
        side_effects:
          - "TestCell.peak_reserved_kw recomputed per calc test_cell_capacity_ledger (the superseded test releases its draw); increments TestCell.version by 1"
          - "increments PerformanceTest.version by 1"
        note: "A re-test legitimately supersedes the prior schedule; this is why POST /performance-tests carries the WorkOrder OCC guard."

  - entity: Nameplate
    shape: linear
    initial_state: ISSUED
    terminal_states: [REVOKED]
    transitions:
      - from: ISSUED
        to: REVOKED
        trigger: "POST /nameplates/{id}/revoke"
        actor: QualityCertifier
        preconditions:
          - "Nameplate.status == ISSUED"
        side_effects:
          - "sets revoked_at = logical clock now and revocation_reason"
          - "CASCADE hop 1: WorkOrder(work_order_id).certification_status moves CERTIFIED -> SUSPENDED and its version is incremented by 1"
          - "CASCADE hop 2 and hop 3 follow from hop 1 as declared on the WorkOrder certification transition (WarrantyClaim.defect_presumption_applied, then Distributor.open_presumed_defect_count)"
          - "increments Nameplate.version by 1"

  - entity: WarrantyClaim
    shape: cyclic
    initial_state: SUBMITTED
    terminal_states: [CLOSED]
    transitions:
      - from: "status IN {SUBMITTED, UNDER_ANALYSIS}"
        to: DEFECT_CONFIRMED
        trigger: "POST /warranty-claims/{id}/analyze producing misuse_index < MISUSE_THRESHOLD"
        actor: ComplianceOfficer
        preconditions:
          - "WarrantyClaim.status IN {SUBMITTED, UNDER_ANALYSIS}"
          - "analysis_basis == TEARDOWN requires teardown_defect_evidence_pct present"
          - "WarrantyClaim.defect_presumption_applied == false OR analysis_basis == TEARDOWN"
        side_effects:
          - "sets analysis_basis, teardown_defect_evidence_pct, misuse_index and adjudication = DEFECT_CONFIRMED per calc warranty_misuse_index"
          - "sets claim_unit_standard_cost_cents and warranty_credit_cents per calc warranty_credit_waterfall"
          - "sets credit_posted = true"
          - "Distributor.warranty_credit_balance_cents recomputed per calc warranty_credit_ledger; increments Distributor.version by 1"
          - "increments WarrantyClaim.version by 1"
      - from: "status IN {SUBMITTED, UNDER_ANALYSIS}"
        to: MISUSE_DETERMINED
        trigger: "POST /warranty-claims/{id}/analyze producing misuse_index >= MISUSE_THRESHOLD"
        actor: ComplianceOfficer
        preconditions:
          - "WarrantyClaim.status IN {SUBMITTED, UNDER_ANALYSIS}"
          - "analysis_basis == TEARDOWN requires teardown_defect_evidence_pct present"
          - "WarrantyClaim.defect_presumption_applied == false OR analysis_basis == TEARDOWN"
        side_effects:
          - "sets analysis_basis, teardown_defect_evidence_pct, misuse_index and adjudication = MISUSE_DETERMINED per calc warranty_misuse_index"
          - "sets warranty_credit_cents = 0 and credit_posted = false"
          - "Distributor.warranty_credit_balance_cents recomputed per calc warranty_credit_ledger; increments Distributor.version by 1"
          - "increments WarrantyClaim.version by 1"
      - from: "status IN {DEFECT_CONFIRMED, MISUSE_DETERMINED}"
        to: UNDER_ANALYSIS
        trigger: "POST /warranty-claims/{id}/dispute"
        actor: Distributor
        preconditions:
          - "WarrantyClaim.status IN {DEFECT_CONFIRMED, MISUSE_DETERMINED}"
          - "X-User-ID == WarrantyClaim.distributor_id"
          - "WarrantyClaim.dispute_round < MAX_DISPUTE_ROUNDS"
        side_effects:
          - "sets dispute_round = dispute_round + 1"
          - "sets credit_posted = false and warranty_credit_cents = 0 and adjudication = null and misuse_index = null — the compensating half of the warranty-credit invariant"
          - "Distributor.warranty_credit_balance_cents recomputed per calc warranty_credit_ledger; increments Distributor.version by 1"
          - "increments WarrantyClaim.version by 1"
        note: "The cycle: analyze -> adjudicated -> dispute -> UNDER_ANALYSIS -> analyze again."
      - from: "status IN {DEFECT_CONFIRMED, MISUSE_DETERMINED}"
        to: CLOSED
        trigger: "POST /warranty-claims/{id}/close"
        actor: ComplianceOfficer
        preconditions:
          - "WarrantyClaim.status IN {DEFECT_CONFIRMED, MISUSE_DETERMINED}"
        side_effects:
          - "credit_posted and warranty_credit_cents are frozen at their current values"
          - "increments WarrantyClaim.version by 1"
        note: "Terminal; no further dispute or analysis is possible."

# -----------------------------------------------------------------------------
# §1.2.1 Concurrency Rules (OCC on the parent's `version` — the only mechanism)
# -----------------------------------------------------------------------------
concurrency_rules:
  - rule_id: work-order-create-stale-design
    parent_entity: MotorDesign
    write_endpoint: "POST /work-orders"
    occ_field: "expected_design_version"
    description: |
      Creating a WorkOrder pins the MotorDesign revision and mutates the design row (the design's
      version advances on every work-order pin). A create whose expected_design_version is older
      than the design's current version is rejected: the caller's view of the design predates
      another writer's successful pin, even though the design is still RELEASED and the create
      would otherwise be legitimate.
    error_id: ERR_STALE_DESIGN_VERSION
    http_status: 412
  - rule_id: performance-test-schedule-stale-work-order
    parent_entity: WorkOrder
    write_endpoint: "POST /performance-tests"
    occ_field: "expected_work_order_version"
    description: |
      Scheduling a PerformanceTest supersedes any PerformanceTest already SCHEDULED on the same
      WorkOrder, which is a legitimate re-test, and advances the work order's version. A schedule
      request carrying an expected_work_order_version older than the work order's current version
      is rejected, because the caller has not observed the schedule it would be superseding.
    error_id: ERR_STALE_WORK_ORDER_VERSION
    http_status: 412

# -----------------------------------------------------------------------------
# §1.3 Calculation Rules
# -----------------------------------------------------------------------------
calculations:
  - name: design_predicted_efficiency
    trigger: "On POST /motor-designs and on every POST /motor-designs/{id}/submit-review, recomputed from the design's current field set."
    algorithm: weighted_scoring
    formula: |
      P_out_w                = rated_output_kw * 1000
      base_loss_w            = P_out_w * BASE_LOSS_FRACTION[poles]

      core_loss_w            = round_half_up(base_loss_w * SHARE_CORE  * LAMINATION_FACTOR[lamination_grade]
                                             * (STACK_REF_MM / lamination_stack_length_mm), 1)
      copper_loss_w          = round_half_up(base_loss_w * SHARE_COPPER * WINDING_FACTOR[winding_type]
                                             * (COPPER_REF_KG / winding_copper_kg), 1)
      rotor_loss_w           = round_half_up(base_loss_w * SHARE_ROTOR  * ROTOR_FACTOR[rotor_construction], 1)
      friction_windage_w     = round_half_up(base_loss_w * SHARE_FRICTION_WINDAGE, 1)
      stray_loss_w           = round_half_up(base_loss_w * SHARE_STRAY, 1)

      # PINNED ORDER: each component is rounded to 0.1 W FIRST, then the five
      # rounded components are summed. Summing raw products and rounding once
      # at the end is a DIFFERENT, WRONG answer.
      total_predicted_loss_w = core_loss_w + copper_loss_w + rotor_loss_w
                               + friction_windage_w + stray_loss_w

      predicted_efficiency_pct  = round_half_up(100 * P_out_w / (P_out_w + total_predicted_loss_w), 2)
      guaranteed_efficiency_pct = round_half_up(100 - (100 - predicted_efficiency_pct)
                                                * (1 + TOLERANCE_COEFF), 2)

      design_estimate_class = highest IE class C in [IE2, IE3, IE4, IE5] with
                              DESIGN_CLASS_FLOOR_PCT[C][poles] <= predicted_efficiency_pct,
                              else BELOW_IE2
      predicted_class       = highest IE class C in [IE2, IE3, IE4, IE5] with
                              DESIGN_CLASS_FLOOR_PCT[C][poles] <= guaranteed_efficiency_pct,
                              else BELOW_IE2
    input_set: "The single MotorDesign row being created or re-submitted. No other rows participate."
    constants:
      BASE_LOSS_FRACTION: { 2: 0.070, 4: 0.060, 6: 0.075, 8: 0.090 }
      LAMINATION_FACTOR: { M400_50A: 1.30, M330_35A: 1.12, M270_35A: 1.00, M235_35A: 0.92 }
      WINDING_FACTOR: { CONCENTRIC: 1.06, LAP: 1.00 }
      ROTOR_FACTOR: { DIE_CAST_ALUMINUM: 1.15, FABRICATED_COPPER: 0.88 }
      STACK_REF_MM: 180
      COPPER_REF_KG: 12.0
      SHARE_CORE: 0.30
      SHARE_COPPER: 0.35
      SHARE_ROTOR: 0.20
      SHARE_FRICTION_WINDAGE: 0.10
      SHARE_STRAY: 0.05
      TOLERANCE_COEFF: 0.15
      DESIGN_CLASS_FLOOR_PCT:
        IE2: { 2: 89.60, 4: 90.40, 6: 89.80, 8: 88.60 }
        IE3: { 2: 91.40, 4: 92.10, 6: 91.60, 8: 90.50 }
        IE4: { 2: 93.00, 4: 93.60, 6: 93.10, 8: 92.20 }
        IE5: { 2: 94.30, 4: 94.80, 6: 94.40, 8: 93.60 }
    precision: "Component losses 1 decimal place; efficiencies 2 decimal places; ROUND_HALF_UP throughout. Class floors are compared with >= (a value exactly equal to a floor attains that class)."
    variants:
      - name: design_estimate
        when: "Reported as design_estimate_class; the raw model output with no manufacturing tolerance applied."
        difference: "Classifies predicted_efficiency_pct directly."
      - name: guaranteed_declared
        when: "Reported as predicted_class; the value the design may be released and nameplated against."
        difference: "Classifies guaranteed_efficiency_pct = 100 - (100 - predicted) * 1.15, i.e. the loss figure is inflated by TOLERANCE_COEFF before classification. For identical inputs the two variants can land on different IE classes (e.g. predicted 93.99 -> IE4 by estimate, guaranteed 93.09 -> IE3), and only the guaranteed variant gates release."
    note: "Combinatorial: the loss total depends on poles x lamination_grade x winding_type x rotor_construction x stack length x copper mass, so no single factor determines the class."

  - name: work_order_cost
    trigger: "On POST /work-orders (initial standard and actual cost), and recomputed whenever WorkOrder.rework_reject_count changes (a StatorBuild or RotorBuild rejection)."
    algorithm: tiered_pricing
    formula: |
      copper_cents      = round_half_up(design.winding_copper_kg * MATERIAL_COST_PER_KG_COPPER_CENTS, 0)
      lamination_cents  = design.lamination_stack_length_mm * LAM_COST_PER_MM_CENTS[design.lamination_grade]
      rotor_cents       = ROTOR_PROCESS_COST_CENTS[design.rotor_construction]
      per_unit_direct_cost_cents = copper_cents + lamination_cents + rotor_cents + LABOR_COST_CENTS_PER_UNIT

      direct_cost_cents = per_unit_direct_cost_cents * WorkOrder.unit_count

      # The band is selected from direct_cost_cents ONLY. Overhead is NOT part of
      # the band input, even though overhead is added to reach the standard cost.
      # (Looks circular; is not.)
      overhead_band = ENGINEERED if direct_cost_cents >= ENGINEERED_BAND_MIN_CENTS
                      else COMPLEX if direct_cost_cents >= COMPLEX_BAND_MIN_CENTS
                      else STANDARD

      overhead_cents      = round_half_up(direct_cost_cents * OVERHEAD_RATE_BY_BAND[overhead_band], 0)
      standard_cost_cents = direct_cost_cents + overhead_cents
      actual_cost_cents   = standard_cost_cents
                            + WorkOrder.rework_reject_count * REWORK_SURCHARGE_CENTS_PER_REJECT
      cost_variance_cents = actual_cost_cents - standard_cost_cents
      # unit_standard_cost_cents is DERIVED ON READ, not stored on WorkOrder; it is
      # surfaced by GET /work-orders/{id}/cost-summary and pinned onto a WarrantyClaim
      # at analysis time as claim_unit_standard_cost_cents.
      unit_standard_cost_cents = round_half_up(standard_cost_cents / WorkOrder.unit_count, 0)
    input_set: "The WorkOrder row plus the MotorDesign row pinned at creation (design fields are read from the pinned design, never re-read after a design revision). rework_reject_count counts StatorBuild and RotorBuild rows on this work order that reached REJECTED; rows that reached SCRAPPED are excluded."
    constants:
      MATERIAL_COST_PER_KG_COPPER_CENTS: 1150
      LAM_COST_PER_MM_CENTS: { M400_50A: 420, M330_35A: 510, M270_35A: 640, M235_35A: 780 }
      ROTOR_PROCESS_COST_CENTS: { DIE_CAST_ALUMINUM: 18000, FABRICATED_COPPER: 47500 }
      LABOR_COST_CENTS_PER_UNIT: 26000
      COMPLEX_BAND_MIN_CENTS: 1500000
      ENGINEERED_BAND_MIN_CENTS: 4000000
      OVERHEAD_RATE_BY_BAND: { STANDARD: 0.22, COMPLEX: 0.31, ENGINEERED: 0.44 }
      REWORK_SURCHARGE_CENTS_PER_REJECT: 62500
    precision: "Integer cents throughout; ROUND_HALF_UP on the copper, overhead and unit-cost divisions. Band thresholds are inclusive lower bounds (>=): direct_cost_cents == 1500000 is COMPLEX, 1499999 is STANDARD."

  - name: order_lead_time
    trigger: "On POST /customer-orders (provisional) and recomputed on POST /customer-orders/{id}/confirm (binding), always from the current logical clock date."
    algorithm: threshold
    formula: |
      base_days = BASE_LEAD_DAYS[order_type]

      # Special-requirement adders are summed in this fixed key order:
      #   non_standard_mounting, hazardous_environment, non_standard_duty, marine_certification
      special_days = sum(SPECIAL_ADDER_DAYS[k] for k in the fixed order above
                         if CustomerOrder.special_requirements[k] == true)
      # An unrecognised key in special_requirements contributes nothing; an absent
      # recognised key is treated as false.

      # Threshold: strict > on the distributor's stocking buffer, and only for
      # stock-replenishment orders.
      shortfall_days = STOCK_BUFFER_SHORTFALL_ADDER_DAYS
                       if order_type == STOCK_REPLENISH and quantity > Distributor.stock_buffer_units
                       else 0

      cert_days = JURISDICTION_CERT_ADDER_DAYS[CustomerOrder.jurisdiction]

      promised_lead_time_days = max(MIN_LEAD_DAYS,
                                    base_days + special_days + shortfall_days + cert_days
                                    - TIER_LEAD_REDUCTION_DAYS[Distributor.tier])

      promised_ship_date = (date portion of the logical clock now) + promised_lead_time_days days
    input_set: "The CustomerOrder row and its Distributor row. The MotorDesign contributes nothing to lead time."
    constants:
      BASE_LEAD_DAYS: { STOCK_REPLENISH: 5, MADE_TO_ORDER: 28, ENGINEERED_SPECIAL: 56 }
      TIER_LEAD_REDUCTION_DAYS: { PLATINUM: 4, GOLD: 2, SILVER: 0 }
      SPECIAL_ADDER_DAYS: { non_standard_mounting: 7, hazardous_environment: 14, non_standard_duty: 5, marine_certification: 21 }
      JURISDICTION_CERT_ADDER_DAYS: { EU: 3, US: 5, CN: 9 }
      STOCK_BUFFER_SHORTFALL_ADDER_DAYS: 11
      MIN_LEAD_DAYS: 3
    precision: "Whole days; the floor clamp at MIN_LEAD_DAYS is applied last, after every adder and the tier reduction. Dates are calendar dates in UTC with no weekend or holiday skipping."

  - name: stator_surge_envelope
    trigger: "required_surge_kv is set on POST /stator-builds; achieved_capability_kv is set on POST /stator-builds/{id}/impregnate; insulation_margin_kv is set on POST /stator-builds/{id}/surge-test."
    algorithm: threshold
    formula: |
      thermal_class         = INSULATION_SYSTEM_CLASS[StatorBuild.insulation_system]
      # thermal_class MUST equal design.insulation_class (validation priority 43,
      # ERR_INSULATION_SYSTEM_MISMATCH), so the two are interchangeable on a valid row.
      required_surge_kv     = round_half_up((SURGE_MULTIPLIER * design.rated_voltage_v + SURGE_BASE_V)
                                            * INSULATION_CLASS_FACTOR[thermal_class] / 1000, 2)

      cycle_bonus           = min(MAX_CYCLE_BONUS,
                                  CYCLE_BONUS_PER_EXTRA_CYCLE * max(0, varnish_cycles - 1))
      achieved_capability_kv = round_half_up(required_surge_kv
                                             * VARNISH_PROCESS_FACTOR[varnish_process]
                                             * (1 + cycle_bonus), 2)

      insulation_margin_kv  = round_half_up(surge_test_kv - required_surge_kv, 2)

      surge_test_result = PASS iff surge_test_kv <= achieved_capability_kv
                                   and insulation_margin_kv >= 0.00
      # surge_test_kv > achieved_capability_kv  -> ERR_SURGE_OVERSTRESS  (destructive test)
      # insulation_margin_kv < 0.00             -> ERR_SURGE_MARGIN_NEGATIVE (under-test)
    input_set: "The StatorBuild row plus the MotorDesign pinned on its WorkOrder. slot_fill_pct is validated at creation against [MIN_SLOT_FILL_PCT, MAX_SLOT_FILL_PCT] inclusive but does not enter the surge formula."
    constants:
      SURGE_BASE_V: 1000
      SURGE_MULTIPLIER: 2.0
      INSULATION_SYSTEM_CLASS: { CLASS_B_POLYESTER: B, CLASS_F_POLYESTERIMIDE: F, CLASS_H_POLYAMIDEIMIDE: H }
      INSULATION_CLASS_FACTOR: { B: 1.00, F: 1.15, H: 1.30 }
      VARNISH_PROCESS_FACTOR: { DIP_BAKE: 1.00, TRICKLE: 1.05, VPI: 1.20 }
      CYCLE_BONUS_PER_EXTRA_CYCLE: 0.04
      MAX_CYCLE_BONUS: 0.12
      MIN_SLOT_FILL_PCT: 78.00
      MAX_SLOT_FILL_PCT: 86.00
    precision: "2 decimal places, ROUND_HALF_UP. Both surge gates are inclusive at the boundary: surge_test_kv exactly equal to achieved_capability_kv passes, and insulation_margin_kv of exactly 0.00 passes."

  - name: rotor_cage_properties
    trigger: "On POST /rotor-builds/{id}/form-cage, selected by RotorBuild.construction."
    algorithm: constraint_propagation
    formula: |
      cage_conductivity_ratio  = CAGE_CONDUCTIVITY_RATIO[construction]
      slip_penalty_pct         = SLIP_PENALTY_PCT[construction]
      rotor_process_cost_cents = ROTOR_PROCESS_COST_CENTS[construction]
    input_set: "The single RotorBuild row; construction is inherited from the pinned MotorDesign at RotorBuild creation and is immutable thereafter."
    constants:
      CAGE_CONDUCTIVITY_RATIO: { DIE_CAST_ALUMINUM: 0.62, FABRICATED_COPPER: 1.00 }
      SLIP_PENALTY_PCT: { DIE_CAST_ALUMINUM: 1.8, FABRICATED_COPPER: 0.6 }
      ROTOR_PROCESS_COST_CENTS: { DIE_CAST_ALUMINUM: 18000, FABRICATED_COPPER: 47500 }
    precision: "cage_conductivity_ratio 2 decimal places; slip_penalty_pct 1 decimal place; cost in integer cents. Values are table lookups, not derived arithmetic."

  - name: rotor_air_gap
    trigger: "On POST /rotor-builds/{id}/machine."
    algorithm: threshold
    formula: |
      measured_air_gap_mm  = round_half_up((design.stator_bore_id_mm - measured_rotor_od_mm) / 2, 3)
      air_gap_deviation_mm = round_half_up(measured_air_gap_mm - design.design_air_gap_mm, 3)
      accepted iff abs(air_gap_deviation_mm) <= design.air_gap_tolerance_mm
      # otherwise ERR_AIR_GAP_OUT_OF_TOLERANCE
    input_set: "The RotorBuild row plus the MotorDesign pinned on its WorkOrder."
    constants: {}
    precision: "3 decimal places, ROUND_HALF_UP. The tolerance comparison is inclusive: a deviation whose absolute value exactly equals air_gap_tolerance_mm is accepted; one thousandth beyond is rejected."

  - name: rotor_balance_limit
    trigger: "On POST /rotor-builds/{id}/balance-disposition."
    algorithm: threshold
    formula: |
      sync_speed_rpm             = SYNC_SPEED_RPM_BY_POLES[design.poles]
      permissible_unbalance_g_mm = round_half_up(BALANCE_CONSTANT
                                                 * BALANCE_GRADE_MM_PER_S[balance_grade]
                                                 * rotor_mass_kg / sync_speed_rpm, 1)
      accepted iff residual_unbalance_g_mm <= permissible_unbalance_g_mm
      # otherwise ERR_UNBALANCE_EXCEEDS_GRADE_LIMIT
    input_set: "The RotorBuild row (rotor_mass_kg captured at machining, residual_unbalance_g_mm supplied at disposition) plus design.poles from the pinned MotorDesign."
    constants:
      BALANCE_CONSTANT: 9549
      BALANCE_GRADE_MM_PER_S: { G1_0: 1.0, G2_5: 2.5, G6_3: 6.3 }
      SYNC_SPEED_RPM_BY_POLES: { 2: 3000, 4: 1500, 6: 1000, 8: 750 }
    precision: "1 decimal place, ROUND_HALF_UP. Inclusive at the limit: residual exactly equal to permissible is accepted."

  - name: assembly_shaft_fit
    trigger: "On POST /assembly-records."
    algorithm: threshold
    formula: |
      shaft_fit_deviation_um = round_half_up((shaft_measured_diameter_mm - design.shaft_diameter_mm) * 1000, 0)
      accepted iff SHAFT_FIT_LIMITS_UM[design.shaft_tolerance_class].min
                   <= shaft_fit_deviation_um
                   <= SHAFT_FIT_LIMITS_UM[design.shaft_tolerance_class].max
      # otherwise ERR_SHAFT_FIT_OUT_OF_TOLERANCE

      lubrication grease fill check:
      lubrication_spec_applied = design.lubrication_spec   (copied at creation)
      accepted iff GREASE_FILL_PCT_RANGE[lubrication_spec_applied].min
                   <= grease_fill_pct
                   <= GREASE_FILL_PCT_RANGE[lubrication_spec_applied].max
      # otherwise ERR_LUBRICATION_FILL_OUT_OF_RANGE
    input_set: "The AssemblyRecord payload plus design.shaft_diameter_mm, design.shaft_tolerance_class and design.lubrication_spec from the pinned MotorDesign."
    constants:
      SHAFT_FIT_LIMITS_UM:
        k6: { min: 2, max: 18 }
        m6: { min: 7, max: 25 }
        j6: { min: -5, max: 11 }
      GREASE_FILL_PCT_RANGE:
        GREASE_LIFETIME: { min: 30, max: 40 }
        GREASE_REGREASABLE: { min: 40, max: 60 }
        OIL_MIST: { min: 0, max: 0 }
    precision: "Deviation in whole micrometres, ROUND_HALF_UP; both bounds inclusive. grease_fill_pct compared to 1 decimal place with both bounds inclusive; an OIL_MIST assembly must report exactly 0.0."

  - name: test_measured_efficiency
    trigger: "On POST /performance-tests/{id}/record, using the variant named by PerformanceTest.test_method."
    algorithm: weighted_scoring
    formula: |
      P_in_w = input_power_kw * 1000

      stator_loss_corrected_w = round_half_up(stator_loss_w
                                 * (1 + TEMP_CORRECTION_PER_C
                                        * max(0, ambient_temp_c - AMBIENT_REF_C)), 1)
      stray_load_loss_w       = round_half_up(P_in_w * STRAY_LOAD_FRACTION_OF_INPUT, 1)

      # PINNED ORDER: components are rounded to 0.1 W first, then summed.
      total_loss_w = stator_loss_corrected_w + rotor_loss_w + core_loss_w
                     + friction_windage_w + stray_load_loss_w

      variant SUMMATION (test_method == IEC_60034_2_1_SUMMATION):
        measured_efficiency_pct = round_half_up(100 * (P_in_w - total_loss_w) / P_in_w, 2)
      variant DIRECT (test_method == IEEE_112_B_DYNAMOMETER):
        measured_efficiency_pct = round_half_up(100 * output_power_kw / input_power_kw, 2)

      achieved_class = highest IE class C in [IE2, IE3, IE4, IE5] with
                       DESIGN_CLASS_FLOOR_PCT[C][design.poles] <= measured_efficiency_pct,
                       else BELOW_IE2

      Nameplate gate: measured_efficiency_pct >= RegulatoryStandard.minimum_efficiency_pct
      # otherwise ERR_EFFICIENCY_BELOW_REGULATORY_MINIMUM
    input_set: "The single PerformanceTest row plus design.poles from the MotorDesign pinned on the WorkOrder. Tests in status SUPERSEDED never contribute to any nameplate."
    constants:
      STRAY_LOAD_FRACTION_OF_INPUT: 0.005
      TEMP_CORRECTION_PER_C: 0.0035
      AMBIENT_REF_C: 25.0
      DESIGN_CLASS_FLOOR_PCT:
        IE2: { 2: 89.60, 4: 90.40, 6: 89.80, 8: 88.60 }
        IE3: { 2: 91.40, 4: 92.10, 6: 91.60, 8: 90.50 }
        IE4: { 2: 93.00, 4: 93.60, 6: 93.10, 8: 92.20 }
        IE5: { 2: 94.30, 4: 94.80, 6: 94.40, 8: 93.60 }
    precision: "Loss components 1 decimal place; efficiency 2 decimal places; ROUND_HALF_UP. The temperature correction is one-sided: an ambient at or below AMBIENT_REF_C applies no correction (never a credit)."
    variants:
      - name: SUMMATION
        when: "test_method == IEC_60034_2_1_SUMMATION (loss-summation determination): efficiency is derived from the itemised loss budget."
        difference: "Uses total_loss_w against input power, so ambient temperature and the stray-load fraction change the answer. Sensitive to every loss field."
      - name: DIRECT
        when: "test_method == IEEE_112_B_DYNAMOMETER (direct input/output dynamometer measurement)."
        difference: "Ignores every loss field, ambient temperature and the stray-load fraction entirely: purely output_power_kw / input_power_kw. For identical measured data the two variants diverge, and the divergence grows with ambient temperature — the same test bench numbers can land on different achieved_class values and on opposite sides of a regulatory minimum."

  - name: regulatory_standard_selector
    trigger: "On POST /nameplates, to select the RegulatoryStandard the nameplate is certified against. standard_id is never supplied by the caller; it is always resolved by this selector."
    algorithm: chronological
    formula: |
      eligible = every RegulatoryStandard S with
                   S.jurisdiction == Nameplate.jurisdiction
                   and S.poles == design.poles
                   and S.rated_output_kw_min <= design.rated_output_kw <= S.rated_output_kw_max
                   and S.effective_from <= (date portion of logical clock now)

      ranking:   effective_from DESC (the most recently effective standard governs)
      tie-break: created_at ASC (the earliest-registered row of that effective date wins;
                                 `id` is NEVER consulted)
      empty set: no fallback standard is invented -> ERR_NO_APPLICABLE_STANDARD (422)
    input_set: "All RegulatoryStandard rows; RegulatoryStandard is immutable (common_fields: false) so the candidate pool only ever grows."
    constants: {}
    precision: "Range bounds inclusive on both ends; effective_from compared as a calendar date with <=."

  - name: warranty_misuse_index
    trigger: "On POST /warranty-claims/{id}/analyze, using the variant named by the request's analysis_basis."
    algorithm: weighted_scoring
    formula: |
      s_overload = clamp01((measured_load_pct - OVERLOAD_REF_PCT) / OVERLOAD_SPAN_PCT)
      s_thermal  = clamp01((measured_ambient_c - AMBIENT_REF_C) / AMBIENT_SPAN_C)
      s_voltage  = clamp01((measured_voltage_unbalance_pct - VOLTAGE_UNBALANCE_REF_PCT)
                           / VOLTAGE_UNBALANCE_SPAN_PCT)
      s_starts   = clamp01((measured_starts_per_hour - STARTS_PER_HOUR_REF[design.duty_type])
                           / STARTS_PER_HOUR_REF[design.duty_type])
      clamp01(x) = min(1, max(0, x))

      variant FIELD_DATA:
        misuse_index = round_half_up(W_FIELD_OVERLOAD * s_overload + W_FIELD_THERMAL * s_thermal
                                     + W_FIELD_VOLTAGE * s_voltage + W_FIELD_STARTS * s_starts, 4)

      variant TEARDOWN:
        misuse_index = round_half_up(W_TEARDOWN_OVERLOAD * s_overload + W_TEARDOWN_THERMAL * s_thermal
                                     + W_TEARDOWN_VOLTAGE * s_voltage + W_TEARDOWN_STARTS * s_starts
                                     + W_TEARDOWN_EVIDENCE * (1 - teardown_defect_evidence_pct / 100), 4)

      adjudication = MISUSE_DETERMINED if misuse_index >= MISUSE_THRESHOLD
                     else DEFECT_CONFIRMED
    input_set: "The single WarrantyClaim row plus design.duty_type from the MotorDesign pinned on the claim's WorkOrder."
    constants:
      OVERLOAD_REF_PCT: 100.0
      OVERLOAD_SPAN_PCT: 40
      AMBIENT_REF_C: 40.0
      AMBIENT_SPAN_C: 25
      VOLTAGE_UNBALANCE_REF_PCT: 1.0
      VOLTAGE_UNBALANCE_SPAN_PCT: 3
      STARTS_PER_HOUR_REF: { S1: 6, S2: 12, S3: 30 }
      W_FIELD_OVERLOAD: 0.34
      W_FIELD_THERMAL: 0.26
      W_FIELD_VOLTAGE: 0.22
      W_FIELD_STARTS: 0.18
      W_TEARDOWN_OVERLOAD: 0.20
      W_TEARDOWN_THERMAL: 0.18
      W_TEARDOWN_VOLTAGE: 0.14
      W_TEARDOWN_STARTS: 0.10
      W_TEARDOWN_EVIDENCE: 0.38
      MISUSE_THRESHOLD: 0.50
    precision: "Sub-scores are clamped to [0, 1] and carried at full precision; only the final index is rounded to 4 decimal places, ROUND_HALF_UP. The threshold is inclusive (>=): an index of exactly 0.5000 is MISUSE_DETERMINED."
    variants:
      - name: FIELD_DATA
        when: "analysis_basis == FIELD_DATA — adjudicated from the distributor's reported application data alone; teardown_defect_evidence_pct MUST be absent."
        difference: "Four application weights summing to 1.00; no physical evidence term. A hard-run application scores high and is adjudicated MISUSE_DETERMINED."
      - name: TEARDOWN
        when: "analysis_basis == TEARDOWN — the failed motor has been dismantled; teardown_defect_evidence_pct is REQUIRED (ERR_TEARDOWN_EVIDENCE_REQUIRED if missing)."
        difference: "The four application weights are cut to 0.62 total and a 0.38-weighted evidence term is added that REWARDS defect evidence (1 - evidence/100). Identical application data therefore adjudicates the opposite way once strong physical evidence is present: FIELD_DATA 0.6460 -> MISUSE_DETERMINED becomes TEARDOWN 0.4367 -> DEFECT_CONFIRMED at 90% evidence."

  - name: warranty_credit_waterfall
    trigger: "On POST /warranty-claims/{id}/analyze when the adjudication resolves to DEFECT_CONFIRMED."
    algorithm: waterfall_allocation
    formula: |
      claim_unit_standard_cost_cents = round_half_up(WorkOrder.standard_cost_cents
                                                     / WorkOrder.unit_count, 0)
                                       (pinned onto the claim at analysis time)

      # Service age is measured in COMPLETE calendar months from the work order's
      # shipped_at date to the logical clock date at analysis time. A work order that
      # has not shipped yields a service age of 0.
      service_age_months = number of whole calendar months m such that
                           (date of WorkOrder.shipped_at) + m months <= (date of logical clock now)

      pro_rata_factor = max(0, (PRO_RATA_MONTHS - min(service_age_months, PRO_RATA_MONTHS))
                               / PRO_RATA_MONTHS)
      credit_ceiling_cents = round_half_up(claim_unit_standard_cost_cents
                                           * CREDIT_CEILING_FRACTION * pro_rata_factor, 0)

      remaining = credit_ceiling_cents
      # Buckets are filled in this fixed order; each bucket is capped
      # independently AND by whatever remains of the ceiling.
      parts_granted_cents   = min(claimed_parts_cents,
                                  round_half_up(claim_unit_standard_cost_cents * PARTS_CAP_FRACTION, 0),
                                  remaining); remaining -= parts_granted_cents
      labor_granted_cents   = min(claimed_labor_cents,   LABOR_CAP_CENTS,   remaining); remaining -= labor_granted_cents
      freight_granted_cents = min(claimed_freight_cents, FREIGHT_CAP_CENTS, remaining); remaining -= freight_granted_cents

      warranty_credit_cents = parts_granted_cents + labor_granted_cents + freight_granted_cents
      # Any `remaining` left over is FORFEITED, never redistributed backwards.
    input_set: "The WarrantyClaim row plus the WorkOrder's standard_cost_cents and unit_count, and the work order's shipped_at date against the logical clock."
    constants:
      PRO_RATA_MONTHS: 60
      CREDIT_CEILING_FRACTION: 0.85
      PARTS_CAP_FRACTION: 0.60
      LABOR_CAP_CENTS: 45000
      FREIGHT_CAP_CENTS: 18000
    precision: "Integer cents, ROUND_HALF_UP on the ceiling and parts-cap divisions. A claim at or beyond PRO_RATA_MONTHS yields a pro_rata_factor of 0 and therefore a credit of exactly 0."

  - name: oven_booked_minutes_ledger
    trigger: "Recomputed whenever a StatorBuild on the oven is impregnated, rejected, or scrapped."
    algorithm: aggregation
    formula: |
      CuringOven.booked_minutes = sum(SB.impregnation_minutes
                                      for SB in StatorBuild
                                      where SB.oven_id == oven.id
                                        and SB.status IN {IMPREGNATED, SURGE_TESTED, ACCEPTED})

      INVARIANT (compensating): after any sequence of impregnate / reject / scrap operations,
      CuringOven.booked_minutes equals exactly this sum. A build that leaves the counted status
      set (REJECTED or SCRAPPED) releases its minutes in full — the debit and the credit are the
      same integer, so the ledger returns to its prior value with no drift.
    input_set: "StatorBuild rows with a non-null oven_id and status IN {IMPREGNATED, SURGE_TESTED, ACCEPTED}. Rows in WOUND (never booked), REJECTED or SCRAPPED are excluded."
    constants: {}
    precision: "Whole minutes; impregnation_minutes is the integer minute count between impregnation_window_start and impregnation_window_end."

  - name: oven_window_conflict
    trigger: "On POST /stator-builds/{id}/impregnate, before any booking side effect is applied."
    algorithm: interval_merge
    formula: |
      For each existing StatorBuild E on the same oven with status IN {IMPREGNATED, SURGE_TESTED, ACCEPTED}:
        effective_end(E) = E.impregnation_window_end + CuringOven.cooldown_buffer_minutes minutes
        conflict iff requested_start < effective_end(E)
                     and E.impregnation_window_start < requested_end
      Any conflict -> ERR_OVEN_WINDOW_CONFLICT (409)
    input_set: "StatorBuild rows on the same oven_id in status IN {IMPREGNATED, SURGE_TESTED, ACCEPTED}."
    constants: {}
    precision: |
      Half-open comparison against the buffered end: a new window whose start equals the previous
      window's end PLUS the full cooldown buffer does NOT conflict, while a start one minute
      earlier does. Windows are closed intervals in the sense that a zero-length gap to the raw
      end is always a conflict whenever cooldown_buffer_minutes > 0.

  - name: test_cell_capacity_ledger
    trigger: "On POST /performance-tests (capacity check plus reservation) and recomputed when a PerformanceTest is recorded or superseded."
    algorithm: aggregation
    formula: |
      For a requested window [window_start, window_end) and requested draw D = dyno_draw_kw on TestCell C:
        overlapping = every PerformanceTest P with P.test_cell_id == C.id
                      and P.status IN {SCHEDULED, COMPLETED}
                      and P.window_start < requested_end
                      and requested_start < P.window_end
        aggregate_kw = round_half_up(sum(P.dyno_draw_kw for P in overlapping) + D, 1)
        aggregate_kw > C.max_concurrent_kw -> ERR_TEST_CELL_CAPACITY_EXCEEDED (409)

      TestCell.peak_reserved_kw = the maximum aggregate_kw over every instant covered by
                                  PerformanceTest rows on this cell in status IN {SCHEDULED, COMPLETED},
                                  rounded to 1 decimal place; 0.0 when no such rows exist.
    input_set: "PerformanceTest rows on the same test_cell_id in status IN {SCHEDULED, COMPLETED}. Rows in SUPERSEDED release their draw."
    constants: {}
    precision: "1 decimal place, ROUND_HALF_UP. Half-open intervals: a window starting exactly when another ends does not overlap. The capacity gate is inclusive — an aggregate exactly equal to max_concurrent_kw is allowed, and 0.1 kW beyond is rejected."

  - name: distributor_allowance_ledger
    trigger: "Recomputed on order confirm, order cancel, and order fulfilment."
    algorithm: aggregation
    formula: |
      Distributor.units_outstanding = sum(O.quantity for O in CustomerOrder
                                          where O.distributor_id == distributor.id
                                            and O.status IN {CONFIRMED, IN_PRODUCTION})
      Distributor.stock_allowance_remaining_units = Distributor.committed_annual_units
                                                    - Distributor.units_outstanding

      INVARIANT (compensating): units_outstanding + stock_allowance_remaining_units ==
      committed_annual_units at all times. Confirming debits the allowance; cancelling or
      fulfilling credits back exactly the same quantity, so no drift accumulates across any
      confirm/cancel/confirm sequence.
    input_set: "CustomerOrder rows for this distributor in status IN {CONFIRMED, IN_PRODUCTION}. DRAFT, CANCELLED and FULFILLED orders are excluded."
    constants: {}
    precision: "Whole units. The confirm-time gate is inclusive: quantity exactly equal to stock_allowance_remaining_units is allowed; one unit more raises ERR_STOCK_ALLOWANCE_EXCEEDED (422)."

  - name: warranty_credit_ledger
    trigger: "Recomputed on warranty-claim analyze, dispute, and close."
    algorithm: aggregation
    formula: |
      Distributor.warranty_credit_balance_cents = sum(W.warranty_credit_cents for W in WarrantyClaim
                                                      where W.distributor_id == distributor.id
                                                        and W.credit_posted == true)
      Distributor.open_presumed_defect_count = count(W for W in WarrantyClaim
                                                     where W.distributor_id == distributor.id
                                                       and W.defect_presumption_applied == true
                                                       and W.status IN {SUBMITTED, UNDER_ANALYSIS})

      INVARIANT (compensating): a dispute clears credit_posted and zeroes warranty_credit_cents,
      so the balance drops by exactly the amount the prior analysis posted. Re-analysing the same
      claim posts the freshly computed amount, and the balance always equals the sum over
      credit_posted claims — never the running total of every adjudication ever made.
    input_set: "WarrantyClaim rows for this distributor; only credit_posted == true rows contribute to the balance, and only non-terminal presumption-flagged rows contribute to the presumed-defect count."
    constants: {}
    precision: "Integer cents; whole counts."

# -----------------------------------------------------------------------------
# §1.4 Validation Rules (evaluated in ascending priority; the FIRST violated
#      rule decides the response, and no side effect of the request is applied)
# -----------------------------------------------------------------------------
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers are both present and non-empty; X-User-Role names a role declared in §1.7."
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "The role in X-User-Role appears in the target endpoint's roles list."
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: auth
    check: "Row ownership, keyed on X-User-ID: (a) when X-User-Role is Distributor, X-User-ID equals the distributor_id of the CustomerOrder or WarrantyClaim being read or acted on, and equals the distributor_id supplied when creating one; (b) on submit-review and open-revision, X-User-ID equals MotorDesign.created_by_user_id — only the authoring engineer may advance or revise their own design."
    error_id: ERR_NOT_OWNER
    http_status: 403
    applies_to: "POST /customer-orders, GET /customer-orders, GET /customer-orders/{id}, POST /warranty-claims, GET /warranty-claims, GET /warranty-claims/{id}, POST /warranty-claims/{id}/dispute, POST /motor-designs/{id}/submit-review, POST /motor-designs/{id}/open-revision"
  - priority: 4
    category: auth
    check: |
      Segregation of duties, keyed on X-User-ID:
        (a) review-decision: X-User-ID != MotorDesign.created_by_user_id
        (b) surge-test: X-User-ID != StatorBuild.winder_user_id
        (c) nameplate issue: X-User-ID != PerformanceTest.test_engineer_user_id
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /motor-designs/{id}/review-decision, POST /stator-builds/{id}/surge-test, POST /nameplates"
  - priority: 10
    category: business_constraint
    check: |
      Request body schema: required fields present; types correct; enum values within the declared
      set; numeric values within the declared range and decimal width; ISO 8601 datetimes with
      three fractional digits and a Z suffix; calendar dates as YYYY-MM-DD; any interval field pair
      satisfies end > start (impregnation_window_end > impregnation_window_start,
      window_end > window_start); pagination limit in [1, 100] and offset >= 0.
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all"
  - priority: 20
    category: existence
    check: "Every resource named by a path parameter exists, validated left to right."
    error_id: "ERR_DESIGN_NOT_FOUND | ERR_ORDER_NOT_FOUND | ERR_WORK_ORDER_NOT_FOUND | ERR_SUBASSEMBLY_NOT_FOUND | ERR_ASSEMBLY_RECORD_NOT_FOUND | ERR_PERFORMANCE_TEST_NOT_FOUND | ERR_NAMEPLATE_NOT_FOUND | ERR_WARRANTY_CLAIM_NOT_FOUND | ERR_DISTRIBUTOR_NOT_FOUND | ERR_OVEN_NOT_FOUND | ERR_TEST_CELL_NOT_FOUND | ERR_STANDARD_NOT_FOUND"
    http_status: 404
    applies_to: "every endpoint with a {id} path parameter"
  - priority: 22
    category: existence
    check: "Every foreign key supplied in a request body resolves to an existing row: design_id, order_id, distributor_id, work_order_id, stator_build_id, rotor_build_id, oven_id, test_cell_id, performance_test_id, supersedes_design_id."
    error_id: "ERR_DESIGN_NOT_FOUND | ERR_ORDER_NOT_FOUND | ERR_DISTRIBUTOR_NOT_FOUND | ERR_WORK_ORDER_NOT_FOUND | ERR_SUBASSEMBLY_NOT_FOUND | ERR_OVEN_NOT_FOUND | ERR_TEST_CELL_NOT_FOUND | ERR_PERFORMANCE_TEST_NOT_FOUND"
    http_status: 404
    applies_to: "POST /motor-designs, POST /customer-orders, POST /work-orders, POST /stator-builds, POST /stator-builds/{id}/impregnate, POST /rotor-builds, POST /assembly-records, POST /performance-tests, POST /nameplates, POST /warranty-claims"
  - priority: 24
    category: business_constraint
    check: "model_code is not already used by another MotorDesign row (case-sensitive equality over all rows, including OBSOLETE ones)."
    error_id: ERR_DUPLICATE_MODEL_CODE
    http_status: 409
    applies_to: "POST /motor-designs"
  - priority: 26
    category: state
    check: "A CuringOven or TestCell referenced for a booking is in status AVAILABLE, not MAINTENANCE."
    error_id: ERR_RESOURCE_IN_MAINTENANCE
    http_status: 409
    applies_to: "POST /stator-builds/{id}/impregnate, POST /performance-tests"
  - priority: 30
    category: state
    check: "MotorDesign.status permits the requested transition (submit-review from DRAFT or REVISION_OPEN; review-decision from IN_REVIEW; open-revision from RELEASED)."
    error_id: ERR_INVALID_DESIGN_STATE
    http_status: 409
    applies_to: "POST /motor-designs/{id}/submit-review, POST /motor-designs/{id}/review-decision, POST /motor-designs/{id}/open-revision"
  - priority: 31
    category: state
    check: "CustomerOrder.status permits the requested transition (confirm from DRAFT; cancel from DRAFT, CONFIRMED or IN_PRODUCTION) and a work order may only be opened against a CONFIRMED or IN_PRODUCTION order."
    error_id: ERR_INVALID_ORDER_STATE
    http_status: 409
    applies_to: "POST /customer-orders/{id}/confirm, POST /customer-orders/{id}/cancel, POST /work-orders"
  - priority: 32
    category: state
    check: "WorkOrder.build_status permits the requested operation (stator/rotor build creation from RELEASED; assembly-record creation from SUBASSEMBLIES_DONE; performance-test scheduling from ASSEMBLED; nameplate issue from TESTED; ship from TESTED)."
    error_id: ERR_INVALID_WORK_ORDER_STATE
    http_status: 409
    applies_to: "POST /stator-builds, POST /rotor-builds, POST /assembly-records, POST /performance-tests, POST /nameplates, POST /work-orders/{id}/ship"
  - priority: 33
    category: state
    check: "StatorBuild.status or RotorBuild.status permits the requested transition (impregnate from WOUND; surge-test from IMPREGNATED; disposition from WOUND, IMPREGNATED or SURGE_TESTED; form-cage from PLANNED; machine from CAST_POURED or BARS_BRAZED; balance-disposition from MACHINED)."
    error_id: ERR_INVALID_SUBASSEMBLY_STATE
    http_status: 409
    applies_to: "POST /stator-builds/{id}/impregnate, POST /stator-builds/{id}/surge-test, POST /stator-builds/{id}/disposition, POST /rotor-builds/{id}/form-cage, POST /rotor-builds/{id}/machine, POST /rotor-builds/{id}/balance-disposition"
  - priority: 34
    category: state
    check: "PerformanceTest.status is SCHEDULED when recording results, and a nameplate may only cite a PerformanceTest in status COMPLETED (never SCHEDULED or SUPERSEDED)."
    error_id: ERR_INVALID_PERFORMANCE_TEST_STATE
    http_status: 409
    applies_to: "POST /performance-tests/{id}/record, POST /nameplates"
  - priority: 35
    category: state
    check: "Nameplate.status is ISSUED when revoking."
    error_id: ERR_INVALID_NAMEPLATE_STATE
    http_status: 409
    applies_to: "POST /nameplates/{id}/revoke"
  - priority: 36
    category: state
    check: "WarrantyClaim.status permits the requested transition (analyze from SUBMITTED or UNDER_ANALYSIS; dispute and close from DEFECT_CONFIRMED or MISUSE_DETERMINED; nothing from CLOSED)."
    error_id: ERR_INVALID_CLAIM_STATE
    http_status: 409
    applies_to: "POST /warranty-claims/{id}/analyze, POST /warranty-claims/{id}/dispute, POST /warranty-claims/{id}/close"
  - priority: 38
    category: state
    check: "PerformanceTest.requires_requalification is false; a test flagged by a design revision must be superseded by a freshly scheduled test rather than recorded."
    error_id: ERR_REQUALIFICATION_REQUIRED
    http_status: 409
    applies_to: "POST /performance-tests/{id}/record"
  - priority: 40
    category: business_referential
    check: "MotorDesign(design_id).status == RELEASED at the moment of order confirmation and of work-order creation."
    error_id: ERR_DESIGN_NOT_RELEASED
    http_status: 409
    applies_to: "POST /customer-orders/{id}/confirm, POST /work-orders"
  - priority: 41
    category: business_referential
    check: "An order with order_type == STOCK_REPLENISH may only be confirmed when Distributor.stocking_program_enrolled == true."
    error_id: ERR_STOCKING_PROGRAM_NOT_ENROLLED
    http_status: 409
    applies_to: "POST /customer-orders/{id}/confirm"
  - priority: 42
    category: business_referential
    check: "The cage_method matches RotorBuild.construction: DIE_CAST requires DIE_CAST_ALUMINUM with melt_temp_c and die_preheat_c and without braze_alloy or bar_count; BRAZED_BAR requires FABRICATED_COPPER with braze_alloy and bar_count and without melt_temp_c or die_preheat_c."
    error_id: ERR_ROTOR_CONSTRUCTION_MISMATCH
    http_status: 409
    applies_to: "POST /rotor-builds/{id}/form-cage"
  - priority: 43
    category: business_referential
    check: "INSULATION_SYSTEM_CLASS[StatorBuild.insulation_system] equals MotorDesign.insulation_class of the pinned design."
    error_id: ERR_INSULATION_SYSTEM_MISMATCH
    http_status: 409
    applies_to: "POST /stator-builds"
  - priority: 44
    category: business_referential
    check: "bar_count equals MotorDesign.rotor_bar_count of the pinned design (checked only on the BRAZED_BAR fork)."
    error_id: ERR_ROTOR_BAR_COUNT_MISMATCH
    http_status: 409
    applies_to: "POST /rotor-builds/{id}/form-cage"
  - priority: 45
    category: business_referential
    check: "Nameplate.jurisdiction equals the jurisdiction of the CustomerOrder that owns the nameplate's WorkOrder."
    error_id: ERR_JURISDICTION_MISMATCH
    http_status: 409
    applies_to: "POST /nameplates"
  - priority: 46
    category: state
    check: "expected_design_version equals MotorDesign.version at the moment the work order is created (§1.2.1 work-order-create-stale-design)."
    error_id: ERR_STALE_DESIGN_VERSION
    http_status: 412
    applies_to: "POST /work-orders"
  - priority: 47
    category: state
    check: "expected_work_order_version equals WorkOrder.version at the moment the performance test is scheduled (§1.2.1 performance-test-schedule-stale-work-order)."
    error_id: ERR_STALE_WORK_ORDER_VERSION
    http_status: 412
    applies_to: "POST /performance-tests"
  - priority: 50
    category: business_referential
    check: "The referenced StatorBuild and RotorBuild both belong to the same work order and are both in status ACCEPTED."
    error_id: ERR_SUBASSEMBLY_NOT_ACCEPTED
    http_status: 409
    applies_to: "POST /assembly-records"
  - priority: 52
    category: business_constraint
    check: "The work order has no other StatorBuild (respectively RotorBuild) in a non-terminal or ACCEPTED status — at most one live subassembly of each kind per work order; a REJECTED or SCRAPPED predecessor may be replaced."
    error_id: ERR_DUPLICATE_ACTIVE_SUBASSEMBLY
    http_status: 409
    applies_to: "POST /stator-builds, POST /rotor-builds"
  - priority: 54
    category: business_constraint
    check: "analysis_basis == TEARDOWN requires teardown_defect_evidence_pct in [0.0, 100.0]; analysis_basis == FIELD_DATA requires it to be absent; and a claim whose defect_presumption_applied is true may only be analysed with analysis_basis == TEARDOWN (field telemetry alone can no longer rebut a revoked certification)."
    error_id: ERR_TEARDOWN_EVIDENCE_REQUIRED
    http_status: 422
    applies_to: "POST /warranty-claims/{id}/analyze"
  - priority: 56
    category: business_temporal
    check: "The logical clock is at or after PerformanceTest.window_start when results are recorded."
    error_id: ERR_TEST_WINDOW_NOT_STARTED
    http_status: 409
    applies_to: "POST /performance-tests/{id}/record"
  - priority: 60
    category: business_safety
    check: "slot_fill_pct is within [MIN_SLOT_FILL_PCT, MAX_SLOT_FILL_PCT] = [78.00, 86.00] inclusive."
    error_id: ERR_SLOT_FILL_OUT_OF_RANGE
    http_status: 422
    applies_to: "POST /stator-builds"
  - priority: 61
    category: business_safety
    check: "cure_temp_c <= CuringOven.max_temp_c."
    error_id: ERR_CURE_TEMP_EXCEEDS_OVEN_LIMIT
    http_status: 422
    applies_to: "POST /stator-builds/{id}/impregnate"
  - priority: 62
    category: business_safety
    check: "surge_test_kv <= StatorBuild.achieved_capability_kv — an applied level beyond the impregnated capability would destroy the winding."
    error_id: ERR_SURGE_OVERSTRESS
    http_status: 422
    applies_to: "POST /stator-builds/{id}/surge-test"
  - priority: 63
    category: business_safety
    check: "surge_test_kv - required_surge_kv >= 0.00 — an applied level below the required envelope does not qualify the insulation system."
    error_id: ERR_SURGE_MARGIN_NEGATIVE
    http_status: 422
    applies_to: "POST /stator-builds/{id}/surge-test"
  - priority: 64
    category: business_safety
    check: "abs(air_gap_deviation_mm) <= MotorDesign.air_gap_tolerance_mm."
    error_id: ERR_AIR_GAP_OUT_OF_TOLERANCE
    http_status: 422
    applies_to: "POST /rotor-builds/{id}/machine"
  - priority: 65
    category: business_safety
    check: "residual_unbalance_g_mm <= permissible_unbalance_g_mm for the requested balance_grade (only when disposition is ACCEPTED)."
    error_id: ERR_UNBALANCE_EXCEEDS_GRADE_LIMIT
    http_status: 422
    applies_to: "POST /rotor-builds/{id}/balance-disposition"
  - priority: 66
    category: business_safety
    check: "shaft_fit_deviation_um is inside SHAFT_FIT_LIMITS_UM[MotorDesign.shaft_tolerance_class], both bounds inclusive."
    error_id: ERR_SHAFT_FIT_OUT_OF_TOLERANCE
    http_status: 422
    applies_to: "POST /assembly-records"
  - priority: 67
    category: business_safety
    check: "grease_fill_pct is inside GREASE_FILL_PCT_RANGE[MotorDesign.lubrication_spec], both bounds inclusive."
    error_id: ERR_LUBRICATION_FILL_OUT_OF_RANGE
    http_status: 422
    applies_to: "POST /assembly-records"
  - priority: 68
    category: business_safety
    check: "On APPROVE, class_ordinal(MotorDesign.predicted_class) >= class_ordinal(MotorDesign.target_efficiency_class), where the ordinal ranks BELOW_IE2 < IE2 < IE3 < IE4 < IE5."
    error_id: ERR_DESIGN_CLASS_SHORTFALL
    http_status: 422
    applies_to: "POST /motor-designs/{id}/review-decision"
  - priority: 69
    category: business_safety
    check: "The regulatory_standard_selector eligibility set for the nameplate's jurisdiction, poles, output range and effective date is non-empty."
    error_id: ERR_NO_APPLICABLE_STANDARD
    http_status: 422
    applies_to: "POST /nameplates"
  - priority: 70
    category: business_safety
    check: "PerformanceTest.measured_efficiency_pct >= RegulatoryStandard.minimum_efficiency_pct of the selected standard."
    error_id: ERR_EFFICIENCY_BELOW_REGULATORY_MINIMUM
    http_status: 422
    applies_to: "POST /nameplates"
  - priority: 71
    category: business_safety
    check: "WorkOrder.certification_status == CERTIFIED — a TESTED work order whose nameplate has been revoked (SUSPENDED) or never issued (PENDING) must not leave the plant."
    error_id: ERR_NAMEPLATE_NOT_CERTIFIED
    http_status: 409
    applies_to: "POST /work-orders/{id}/ship"
  - priority: 80
    category: business_temporal
    check: "The requested impregnation window does not overlap any live booking on the same oven once the oven's cooldown_buffer_minutes is appended to each existing window (calc oven_window_conflict)."
    error_id: ERR_OVEN_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /stator-builds/{id}/impregnate"
  - priority: 81
    category: business_constraint
    check: "The aggregate dyno draw of overlapping SCHEDULED and COMPLETED tests on the cell, plus the requested dyno_draw_kw, does not exceed TestCell.max_concurrent_kw (calc test_cell_capacity_ledger)."
    error_id: ERR_TEST_CELL_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /performance-tests"
  - priority: 82
    category: business_constraint
    check: "MotorDesign.review_round < MAX_REVIEW_ROUNDS (3) on a review decision, and WarrantyClaim.dispute_round < MAX_DISPUTE_ROUNDS (2) on a dispute."
    error_id: ERR_ROUND_LIMIT_EXCEEDED
    http_status: 422
    applies_to: "POST /motor-designs/{id}/review-decision, POST /warranty-claims/{id}/dispute"
  - priority: 90
    category: business_temporal
    check: "The recomputed promised_ship_date is on or before CustomerOrder.requested_ship_date."
    error_id: ERR_SHIP_DATE_UNACHIEVABLE
    http_status: 422
    applies_to: "POST /customer-orders/{id}/confirm"
  - priority: 91
    category: business_fiscal
    check: "CustomerOrder.quantity <= Distributor.stock_allowance_remaining_units at the moment of confirmation (inclusive)."
    error_id: ERR_STOCK_ALLOWANCE_EXCEEDED
    http_status: 422
    applies_to: "POST /customer-orders/{id}/confirm"

# -----------------------------------------------------------------------------
# §1.5 API Endpoint Table
# -----------------------------------------------------------------------------
endpoints:
  # ---- test-driving endpoint -------------------------------------------------
  - method: POST
    path: "/_clock/set_current_utc"
    description: |
      Sets the server's logical UTC clock, which every deadline, window, effective-date and
      service-age rule reads. The server starts with the logical clock fixed at exactly
      2026-08-01T00:00:00Z; before any call to this endpoint the clock reads that default and
      MUST NOT fall back to real wall-clock time. Setting the clock never rewrites stored rows.
    roles: [PlantAdmin]
    code: 200
    input: [current_utc]
    output: null
    side_effects:
      - "sets the logical clock used by order_lead_time, regulatory_standard_selector, oven_window_conflict, test_cell_capacity_ledger, warranty_credit_waterfall and every *_at system field"

  # ---- reference data -------------------------------------------------------
  - method: POST
    path: "/regulatory-standards"
    description: "Registers an immutable regulatory efficiency minimum for a jurisdiction, pole count and output range."
    roles: [PlantAdmin]
    code: 201
    input: [standard_code, jurisdiction, efficiency_class, poles, rated_output_kw_min, rated_output_kw_max, minimum_efficiency_pct, effective_from, "tolerance_pct?"]
    output: RegulatoryStandard
    side_effects:
      - "enlarges the candidate pool of calc regulatory_standard_selector"
  - method: GET
    path: "/regulatory-standards/{id}"
    description: "Reads one regulatory standard."
    roles: [QualityCertifier, ComplianceOfficer, DesignEngineer, DesignReviewer, PlantAdmin]
    code: 200
    input: []
    output: RegulatoryStandard
    side_effects: []
  - method: GET
    path: "/regulatory-standards"
    description: "Lists regulatory standards, newest effective_from first."
    roles: [QualityCertifier, ComplianceOfficer, DesignEngineer, DesignReviewer, PlantAdmin]
    code: 200
    input: ["jurisdiction?", "poles?", "efficiency_class?", "limit?", "offset?"]
    output: RegulatoryStandard[]
    side_effects: []

  - method: POST
    path: "/distributors"
    description: "Registers a distributor and its stocking-program allowance."
    roles: [PlantAdmin]
    code: 201
    input: [name, tier, jurisdiction, "stocking_program_enrolled?", "committed_annual_units?", "stock_buffer_units?"]
    output: Distributor
    side_effects:
      - "sets units_outstanding = 0 and stock_allowance_remaining_units = committed_annual_units per calc distributor_allowance_ledger"
      - "sets warranty_credit_balance_cents = 0 and open_presumed_defect_count = 0"
  - method: GET
    path: "/distributors/{id}"
    description: "Reads one distributor, including its live allowance and warranty-credit ledgers."
    roles: [ProductionPlanner, ComplianceOfficer, PlantAdmin]
    code: 200
    input: []
    output: Distributor
    side_effects: []
  - method: GET
    path: "/distributors"
    description: "Lists distributors."
    roles: [ProductionPlanner, ComplianceOfficer, PlantAdmin]
    code: 200
    input: ["tier?", "jurisdiction?", "stocking_program_enrolled?", "limit?", "offset?"]
    output: Distributor[]
    side_effects: []

  - method: POST
    path: "/curing-ovens"
    description: "Registers a varnish curing oven with its temperature ceiling and cooldown buffer."
    roles: [PlantAdmin]
    code: 201
    input: [oven_code, max_temp_c, cooldown_buffer_minutes, "status?"]
    output: CuringOven
    side_effects:
      - "sets booked_minutes = 0"
  - method: GET
    path: "/curing-ovens/{id}"
    description: "Reads one curing oven, including its booked_minutes ledger."
    roles: [BuildTechnician, ProductionPlanner, PlantAdmin]
    code: 200
    input: []
    output: CuringOven
    side_effects: []
  - method: GET
    path: "/curing-ovens"
    description: "Lists curing ovens."
    roles: [BuildTechnician, ProductionPlanner, PlantAdmin]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: CuringOven[]
    side_effects: []

  - method: POST
    path: "/test-cells"
    description: "Registers a dynamometer test cell with its concurrent-power ceiling."
    roles: [PlantAdmin]
    code: 201
    input: [cell_code, max_concurrent_kw, "status?"]
    output: TestCell
    side_effects:
      - "sets peak_reserved_kw = 0.0"
  - method: GET
    path: "/test-cells/{id}"
    description: "Reads one test cell, including its peak_reserved_kw ledger."
    roles: [TestEngineer, ProductionPlanner, PlantAdmin]
    code: 200
    input: []
    output: TestCell
    side_effects: []
  - method: GET
    path: "/test-cells"
    description: "Lists dynamometer test cells."
    roles: [TestEngineer, ProductionPlanner, PlantAdmin]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: TestCell[]
    side_effects: []

  # ---- design engineering ---------------------------------------------------
  - method: POST
    path: "/motor-designs"
    description: "Creates a motor design in DRAFT and runs the loss model against the submitted geometry and materials."
    roles: [DesignEngineer]
    code: 201
    input: [model_code, frame_size, poles, rated_output_kw, rated_voltage_v, target_efficiency_class, lamination_grade, lamination_stack_length_mm, winding_copper_kg, winding_type, insulation_class, stator_bore_id_mm, design_air_gap_mm, air_gap_tolerance_mm, rotor_construction, rotor_bar_count, shaft_diameter_mm, shaft_tolerance_class, bearing_spec_de, bearing_spec_nde, lubrication_spec, duty_type, enclosure, mounting, "supersedes_design_id?"]
    output: MotorDesign
    side_effects:
      - "sets status = DRAFT, revision_index = 0, review_round = 0"
      - "sets created_by_user_id = X-User-ID"
      - "computes total_predicted_loss_w, predicted_efficiency_pct, guaranteed_efficiency_pct, design_estimate_class and predicted_class per calc design_predicted_efficiency"
  - method: GET
    path: "/motor-designs/{id}"
    description: "Reads one motor design with both efficiency variants and both class verdicts."
    roles: [DesignEngineer, DesignReviewer, ProductionPlanner, QualityCertifier, ComplianceOfficer, PlantAdmin]
    code: 200
    input: []
    output: MotorDesign
    side_effects: []
  - method: GET
    path: "/motor-designs"
    description: "Lists motor designs; supports finding the successors of a superseded design."
    roles: [DesignEngineer, DesignReviewer, ProductionPlanner, QualityCertifier, ComplianceOfficer, PlantAdmin]
    code: 200
    input: ["status?", "target_efficiency_class?", "predicted_class?", "supersedes_design_id?", "limit?", "offset?"]
    output: MotorDesign[]
    side_effects: []
  - method: POST
    path: "/motor-designs/{id}/submit-review"
    description: "Submits a DRAFT or REVISION_OPEN design for review, re-running the loss model first."
    roles: [DesignEngineer]
    code: 200
    input: []
    output: MotorDesign
    side_effects:
      - "recomputes every calc design_predicted_efficiency output"
      - "moves MotorDesign.status to IN_REVIEW"
      - "increments MotorDesign.version by 1"
  - method: POST
    path: "/motor-designs/{id}/review-decision"
    description: "Records the reviewer's decision on an IN_REVIEW design: APPROVE releases it, REQUEST_CHANGES sends it back to DRAFT, OBSOLETE retires it."
    roles: [DesignReviewer]
    code: 200
    input: [decision, "review_notes?"]
    output: MotorDesign
    side_effects:
      - "enforces the design-approval separation against created_by_user_id"
      - "increments MotorDesign.review_round by 1"
      - "on APPROVE: gates predicted_class against target_efficiency_class, sets status = RELEASED, released_by_user_id and released_at"
      - "on REQUEST_CHANGES: increments revision_index by 1 and sets status = DRAFT"
      - "on OBSOLETE: sets status = OBSOLETE"
      - "increments MotorDesign.version by 1"
  - method: POST
    path: "/motor-designs/{id}/open-revision"
    description: "Reopens a RELEASED design for revision and marks every work order pinned to it, plus their scheduled tests, as needing requalification."
    roles: [DesignEngineer]
    code: 200
    input: [revision_reason]
    output: MotorDesign
    side_effects:
      - "sets status = REVISION_OPEN and increments revision_index by 1"
      - "cascade hop 1: sets design_pin_stale = true on every WorkOrder pinned to this design in build_status RELEASED, SUBASSEMBLIES_DONE, ASSEMBLED or TESTED"
      - "cascade hop 2: sets requires_requalification = true on every SCHEDULED PerformanceTest of those work orders"
      - "increments MotorDesign.version by 1"

  # ---- commercial orders ----------------------------------------------------
  - method: POST
    path: "/customer-orders"
    description: "Opens a DRAFT customer order for a distributor against a design, with a provisional lead time."
    roles: [ProductionPlanner, Distributor]
    code: 201
    input: [distributor_id, design_id, order_type, quantity, requested_ship_date, jurisdiction, "special_requirements?"]
    output: CustomerOrder
    side_effects:
      - "sets status = DRAFT"
      - "computes provisional promised_lead_time_days and promised_ship_date per calc order_lead_time from the logical clock date"
  - method: GET
    path: "/customer-orders/{id}"
    description: "Reads one customer order."
    roles: [ProductionPlanner, Distributor, ComplianceOfficer, PlantAdmin]
    code: 200
    input: []
    output: CustomerOrder
    side_effects: []
  - method: GET
    path: "/customer-orders"
    description: "Lists customer orders, filterable by distributor and by design."
    roles: [ProductionPlanner, Distributor, ComplianceOfficer, PlantAdmin]
    code: 200
    input: ["distributor_id?", "design_id?", "status?", "order_type?", "limit?", "offset?"]
    output: CustomerOrder[]
    side_effects: []
  - method: POST
    path: "/customer-orders/{id}/confirm"
    description: "Confirms a DRAFT order: rebinds the lead time, checks the promised date against the requested date, and debits the distributor's stocking allowance."
    roles: [ProductionPlanner]
    code: 200
    input: []
    output: CustomerOrder
    side_effects:
      - "recomputes promised_lead_time_days and promised_ship_date per calc order_lead_time"
      - "sets status = CONFIRMED and confirmed_at"
      - "debits Distributor.units_outstanding and stock_allowance_remaining_units per calc distributor_allowance_ledger; increments Distributor.version by 1"
      - "increments CustomerOrder.version by 1"
  - method: POST
    path: "/customer-orders/{id}/cancel"
    description: "Cancels an order and cascades the cancellation through its work orders, subassemblies and oven bookings."
    roles: [ProductionPlanner]
    code: 200
    input: [cancellation_reason]
    output: CustomerOrder
    side_effects:
      - "sets status = CANCELLED"
      - "credits back Distributor.units_outstanding and stock_allowance_remaining_units when the order had been confirmed; increments Distributor.version by 1"
      - "cascade hop 1: moves every non-terminal WorkOrder of this order to build_status CANCELLED"
      - "cascade hop 2: moves their non-terminal StatorBuild, RotorBuild and AssemblyRecord rows to SCRAPPED"
      - "cascade hop 3: recomputes CuringOven.booked_minutes for every oven that held a scrapped stator build, per calc oven_booked_minutes_ledger"
      - "increments CustomerOrder.version by 1"

  # ---- work orders ----------------------------------------------------------
  - method: POST
    path: "/work-orders"
    description: "Opens a work order against a CONFIRMED order, pinning the design revision under an optimistic-concurrency guard and costing the build."
    roles: [ProductionPlanner]
    code: 201
    input: [order_id, design_id, unit_count, expected_design_version]
    output: WorkOrder
    side_effects:
      - "rejects the request with ERR_STALE_DESIGN_VERSION (412) unless expected_design_version equals MotorDesign.version (§1.2.1 work-order-create-stale-design)"
      - "sets build_status = RELEASED, certification_status = PENDING, design_pin_stale = false, rework_reject_count = 0"
      - "sets pinned_design_revision_index = MotorDesign.revision_index"
      - "computes direct_cost_cents, overhead_band, overhead_cents, standard_cost_cents, actual_cost_cents and cost_variance_cents per calc work_order_cost"
      - "moves the CustomerOrder from CONFIRMED to IN_PRODUCTION when it is still CONFIRMED; increments CustomerOrder.version by 1"
      - "increments MotorDesign.version by 1"
  - method: GET
    path: "/work-orders/{id}"
    description: "Reads one work order with both state dimensions and its cost roll-up."
    roles: [ProductionPlanner, BuildTechnician, TestEngineer, QualityCertifier, ComplianceOfficer, PlantAdmin]
    code: 200
    input: []
    output: WorkOrder
    side_effects: []
  - method: GET
    path: "/work-orders"
    description: "Lists work orders, filterable by order, design and either state dimension."
    roles: [ProductionPlanner, BuildTechnician, TestEngineer, QualityCertifier, ComplianceOfficer, PlantAdmin]
    code: 200
    input: ["order_id?", "design_id?", "build_status?", "certification_status?", "design_pin_stale?", "limit?", "offset?"]
    output: WorkOrder[]
    side_effects: []
  - method: GET
    path: "/work-orders/{id}/cost-summary"
    description: "Derived cost read-out for one work order: per-unit direct cost, band, overhead, standard and actual cost, variance, and the per-unit standard cost used by warranty credits."
    roles: [ProductionPlanner, ComplianceOfficer, QualityCertifier, PlantAdmin]
    code: 200
    input: []
    output: "{ work_order_id: uuid, unit_count: integer, per_unit_direct_cost_cents: integer, direct_cost_cents: integer, overhead_band: enum, overhead_cents: integer, standard_cost_cents: integer, actual_cost_cents: integer, cost_variance_cents: integer, rework_reject_count: integer, unit_standard_cost_cents: integer }"
    side_effects: []
  - method: POST
    path: "/work-orders/{id}/ship"
    description: "Ships a TESTED work order, which requires a live nameplate certification, and fulfils the customer order."
    roles: [ProductionPlanner]
    code: 200
    input: []
    output: WorkOrder
    side_effects:
      - "requires certification_status == CERTIFIED across the two state dimensions"
      - "sets build_status = SHIPPED and shipped_at"
      - "moves the CustomerOrder from IN_PRODUCTION to FULFILLED and credits back Distributor.units_outstanding and stock_allowance_remaining_units per calc distributor_allowance_ledger; increments CustomerOrder.version and Distributor.version by 1"
      - "increments WorkOrder.version by 1"

  # ---- stator winding, impregnation and surge testing ------------------------
  - method: POST
    path: "/stator-builds"
    description: "Records a wound stator for a released work order and fixes the surge level the insulation system must withstand."
    roles: [BuildTechnician]
    code: 201
    input: [work_order_id, insulation_system, slot_fill_pct]
    output: StatorBuild
    side_effects:
      - "sets status = WOUND and winder_user_id = X-User-ID"
      - "computes required_surge_kv per calc stator_surge_envelope"
      - "increments WorkOrder.version by 1"
  - method: GET
    path: "/stator-builds/{id}"
    description: "Reads one stator build with its impregnation booking and surge results."
    roles: [BuildTechnician, TestEngineer, QualityCertifier, ProductionPlanner, PlantAdmin]
    code: 200
    input: []
    output: StatorBuild
    side_effects: []
  - method: GET
    path: "/stator-builds"
    description: "Lists stator builds, filterable by work order and by the oven that holds their impregnation booking."
    roles: [BuildTechnician, TestEngineer, QualityCertifier, ProductionPlanner, PlantAdmin]
    code: 200
    input: ["work_order_id?", "oven_id?", "status?", "varnish_process?", "limit?", "offset?"]
    output: StatorBuild[]
    side_effects: []
  - method: POST
    path: "/stator-builds/{id}/impregnate"
    description: "Books a varnish impregnation window on a curing oven and records the process, raising the winding's surge capability."
    roles: [BuildTechnician]
    code: 200
    input: [oven_id, impregnation_window_start, impregnation_window_end, varnish_process, varnish_cycles, cure_temp_c]
    output: StatorBuild
    side_effects:
      - "enforces the buffered oven window check per calc oven_window_conflict"
      - "sets oven_id, the window pair, varnish_process, varnish_cycles, cure_temp_c and impregnation_minutes"
      - "computes achieved_capability_kv per calc stator_surge_envelope"
      - "sets status = IMPREGNATED"
      - "recomputes CuringOven.booked_minutes per calc oven_booked_minutes_ledger; increments CuringOven.version by 1"
      - "increments StatorBuild.version by 1"
  - method: POST
    path: "/stator-builds/{id}/surge-test"
    description: "Applies a surge test to an impregnated stator; the tester must not be the winder."
    roles: [TestEngineer]
    code: 200
    input: [surge_test_kv]
    output: StatorBuild
    side_effects:
      - "enforces the surge-test separation against winder_user_id"
      - "rejects an applied level above achieved_capability_kv (ERR_SURGE_OVERSTRESS) or below required_surge_kv (ERR_SURGE_MARGIN_NEGATIVE)"
      - "sets surge_test_kv, surge_tester_user_id, insulation_margin_kv and surge_test_result = PASS per calc stator_surge_envelope"
      - "sets status = SURGE_TESTED"
      - "increments StatorBuild.version by 1"
  - method: POST
    path: "/stator-builds/{id}/disposition"
    description: "Accepts a surge-tested stator or rejects a stator at any pre-terminal stage, releasing its oven minutes and surcharging the work order."
    roles: [TestEngineer]
    code: 200
    input: [disposition, "disposition_notes?"]
    output: StatorBuild
    side_effects:
      - "on ACCEPTED: sets status = ACCEPTED and, when a RotorBuild of the same work order is already ACCEPTED, moves WorkOrder.build_status from RELEASED to SUBASSEMBLIES_DONE"
      - "on REJECTED: sets status = REJECTED, recomputes CuringOven.booked_minutes per calc oven_booked_minutes_ledger and increments CuringOven.version by 1"
      - "on REJECTED: increments WorkOrder.rework_reject_count by 1 and recomputes actual_cost_cents and cost_variance_cents per calc work_order_cost"
      - "increments WorkOrder.version by 1 and StatorBuild.version by 1"

  # ---- rotor casting or fabrication -----------------------------------------
  - method: POST
    path: "/rotor-builds"
    description: "Opens a rotor build for a released work order, inheriting the cage construction route from the pinned design."
    roles: [BuildTechnician]
    code: 201
    input: [work_order_id]
    output: RotorBuild
    side_effects:
      - "sets status = PLANNED and rotor_tech_user_id = X-User-ID"
      - "copies construction from MotorDesign.rotor_construction of the pinned design"
      - "increments WorkOrder.version by 1"
  - method: GET
    path: "/rotor-builds/{id}"
    description: "Reads one rotor build with its cage, air-gap and balance results."
    roles: [BuildTechnician, TestEngineer, QualityCertifier, ProductionPlanner, PlantAdmin]
    code: 200
    input: []
    output: RotorBuild
    side_effects: []
  - method: GET
    path: "/rotor-builds"
    description: "Lists rotor builds, filterable by work order, construction route and state."
    roles: [BuildTechnician, TestEngineer, QualityCertifier, ProductionPlanner, PlantAdmin]
    code: 200
    input: ["work_order_id?", "construction?", "status?", "balance_grade?", "limit?", "offset?"]
    output: RotorBuild[]
    side_effects: []
  - method: POST
    path: "/rotor-builds/{id}/form-cage"
    description: "Forms the rotor cage on the fork the design dictates: die-casting aluminium or brazing copper bars, each with its own required payload and its own cage property set."
    roles: [BuildTechnician]
    code: 200
    input: [cage_method, "melt_temp_c?", "die_preheat_c?", "braze_alloy?", "bar_count?"]
    output: RotorBuild
    side_effects:
      - "on DIE_CAST: requires construction == DIE_CAST_ALUMINUM, stores melt_temp_c and die_preheat_c, sets status = CAST_POURED"
      - "on BRAZED_BAR: requires construction == FABRICATED_COPPER and bar_count == MotorDesign.rotor_bar_count, stores braze_alloy and bar_count, sets status = BARS_BRAZED"
      - "sets cage_conductivity_ratio, slip_penalty_pct and rotor_process_cost_cents per calc rotor_cage_properties"
      - "increments RotorBuild.version by 1"
  - method: POST
    path: "/rotor-builds/{id}/machine"
    description: "Records the finished rotor outer diameter and mass, deriving the air gap against the stator bore and gating it on the design tolerance."
    roles: [BuildTechnician]
    code: 200
    input: [measured_rotor_od_mm, rotor_mass_kg]
    output: RotorBuild
    side_effects:
      - "computes measured_air_gap_mm and air_gap_deviation_mm per calc rotor_air_gap and rejects an out-of-tolerance deviation"
      - "sets status = MACHINED"
      - "increments RotorBuild.version by 1"
  - method: POST
    path: "/rotor-builds/{id}/balance-disposition"
    description: "Balances a machined rotor to a quality grade and accepts or rejects it against the permissible residual unbalance."
    roles: [TestEngineer]
    code: 200
    input: [disposition, balance_grade, initial_unbalance_g_mm, residual_unbalance_g_mm]
    output: RotorBuild
    side_effects:
      - "computes permissible_unbalance_g_mm per calc rotor_balance_limit"
      - "on ACCEPTED: requires residual_unbalance_g_mm <= permissible_unbalance_g_mm, sets status = ACCEPTED and, when a StatorBuild of the same work order is already ACCEPTED, moves WorkOrder.build_status from RELEASED to SUBASSEMBLIES_DONE"
      - "on REJECTED: sets status = REJECTED, increments WorkOrder.rework_reject_count by 1 and recomputes actual_cost_cents and cost_variance_cents per calc work_order_cost"
      - "increments WorkOrder.version by 1 and RotorBuild.version by 1"

  # ---- assembly -------------------------------------------------------------
  - method: POST
    path: "/assembly-records"
    description: "Assembles an accepted stator and rotor into a motor, checking the shaft journal fit and the lubrication fill."
    roles: [BuildTechnician]
    code: 201
    input: [work_order_id, stator_build_id, rotor_build_id, de_bearing_lot, nde_bearing_lot, bearing_install_method, shaft_measured_diameter_mm, grease_fill_pct]
    output: AssemblyRecord
    side_effects:
      - "requires both referenced subassemblies to belong to this work order and to be ACCEPTED"
      - "copies lubrication_spec_applied from MotorDesign.lubrication_spec and computes shaft_fit_deviation_um per calc assembly_shaft_fit"
      - "sets status = BUILT and assembler_user_id = X-User-ID"
      - "moves WorkOrder.build_status from SUBASSEMBLIES_DONE to ASSEMBLED; increments WorkOrder.version by 1"
  - method: GET
    path: "/assembly-records/{id}"
    description: "Reads one assembly record."
    roles: [BuildTechnician, TestEngineer, QualityCertifier, ProductionPlanner, PlantAdmin]
    code: 200
    input: []
    output: AssemblyRecord
    side_effects: []
  - method: GET
    path: "/assembly-records"
    description: "Lists assembly records, filterable by work order and by either subassembly."
    roles: [BuildTechnician, TestEngineer, QualityCertifier, ProductionPlanner, PlantAdmin]
    code: 200
    input: ["work_order_id?", "stator_build_id?", "rotor_build_id?", "status?", "limit?", "offset?"]
    output: AssemblyRecord[]
    side_effects: []

  # ---- performance testing --------------------------------------------------
  - method: POST
    path: "/performance-tests"
    description: "Schedules an efficiency verification on a dynamometer cell for an assembled work order, superseding any test already scheduled on it, under an optimistic-concurrency guard."
    roles: [TestEngineer]
    code: 201
    input: [work_order_id, test_cell_id, window_start, window_end, dyno_draw_kw, test_method, expected_work_order_version]
    output: PerformanceTest
    side_effects:
      - "rejects the request with ERR_STALE_WORK_ORDER_VERSION (412) unless expected_work_order_version equals WorkOrder.version (§1.2.1 performance-test-schedule-stale-work-order)"
      - "enforces the aggregate cell capacity check per calc test_cell_capacity_ledger"
      - "moves any SCHEDULED PerformanceTest of the same work order to SUPERSEDED and increments its version by 1"
      - "sets status = SCHEDULED and requires_requalification = false"
      - "recomputes TestCell.peak_reserved_kw per calc test_cell_capacity_ledger; increments TestCell.version by 1"
      - "increments WorkOrder.version by 1"
  - method: GET
    path: "/performance-tests/{id}"
    description: "Reads one performance test with its loss breakdown, measured efficiency and achieved class."
    roles: [TestEngineer, QualityCertifier, ComplianceOfficer, ProductionPlanner, PlantAdmin]
    code: 200
    input: []
    output: PerformanceTest
    side_effects: []
  - method: GET
    path: "/performance-tests"
    description: "Lists performance tests, filterable by work order and by test cell."
    roles: [TestEngineer, QualityCertifier, ComplianceOfficer, ProductionPlanner, PlantAdmin]
    code: 200
    input: ["work_order_id?", "test_cell_id?", "status?", "test_method?", "requires_requalification?", "limit?", "offset?"]
    output: PerformanceTest[]
    side_effects: []
  - method: POST
    path: "/performance-tests/{id}/record"
    description: "Records the bench measurements and determines the efficiency by the test's declared method."
    roles: [TestEngineer]
    code: 200
    input: [input_power_kw, output_power_kw, stator_loss_w, rotor_loss_w, core_loss_w, friction_windage_w, ambient_temp_c]
    output: PerformanceTest
    side_effects:
      - "requires the logical clock to have reached window_start and requires_requalification == false"
      - "stores the measurements, test_engineer_user_id and recorded_at"
      - "computes stator_loss_corrected_w, stray_load_loss_w, total_loss_w, measured_efficiency_pct and achieved_class per calc test_measured_efficiency using the variant named by test_method"
      - "sets status = COMPLETED"
      - "recomputes TestCell.peak_reserved_kw per calc test_cell_capacity_ledger; increments TestCell.version by 1"
      - "moves WorkOrder.build_status from ASSEMBLED to TESTED; increments WorkOrder.version by 1"

  # ---- nameplate certification ----------------------------------------------
  - method: POST
    path: "/nameplates"
    description: "Issues a nameplate certificate against the governing regulatory standard for the destination jurisdiction; the certifier must not be the test engineer."
    roles: [QualityCertifier]
    code: 201
    input: [work_order_id, performance_test_id, jurisdiction]
    output: Nameplate
    side_effects:
      - "enforces the certification separation against PerformanceTest.test_engineer_user_id"
      - "resolves standard_id per calc regulatory_standard_selector and copies minimum_efficiency_pct_applied from it"
      - "gates measured_efficiency_pct against the standard's minimum"
      - "copies stamped_efficiency_pct and stamped_class from the cited COMPLETED PerformanceTest"
      - "sets status = ISSUED, certifier_user_id = X-User-ID and issued_at"
      - "moves WorkOrder.certification_status to CERTIFIED from PENDING or SUSPENDED; increments WorkOrder.version by 1"
  - method: GET
    path: "/nameplates/{id}"
    description: "Reads one nameplate certificate."
    roles: [QualityCertifier, ComplianceOfficer, ProductionPlanner, Distributor, PlantAdmin]
    code: 200
    input: []
    output: Nameplate
    side_effects: []
  - method: GET
    path: "/nameplates"
    description: "Lists nameplate certificates, filterable by work order, cited test and governing standard."
    roles: [QualityCertifier, ComplianceOfficer, ProductionPlanner, Distributor, PlantAdmin]
    code: 200
    input: ["work_order_id?", "performance_test_id?", "standard_id?", "status?", "jurisdiction?", "limit?", "offset?"]
    output: Nameplate[]
    side_effects: []
  - method: POST
    path: "/nameplates/{id}/revoke"
    description: "Revokes an issued nameplate, suspending the work order's certification and presuming defect on that motor's open warranty claims."
    roles: [QualityCertifier]
    code: 200
    input: [revocation_reason]
    output: Nameplate
    side_effects:
      - "sets status = REVOKED, revoked_at and revocation_reason"
      - "cascade hop 1: moves WorkOrder.certification_status from CERTIFIED to SUSPENDED; increments WorkOrder.version by 1"
      - "cascade hop 2: sets defect_presumption_applied = true on every WarrantyClaim of that work order in status SUBMITTED or UNDER_ANALYSIS"
      - "cascade hop 3: recomputes Distributor.open_presumed_defect_count for every distributor owning such a claim per calc warranty_credit_ledger"
      - "increments Nameplate.version by 1"

  # ---- warranty -------------------------------------------------------------
  - method: POST
    path: "/warranty-claims"
    description: "Files a warranty claim against a shipped motor with the reported application conditions and claimed costs."
    roles: [Distributor, ComplianceOfficer]
    code: 201
    input: [work_order_id, distributor_id, failure_mode, operating_hours, measured_load_pct, measured_ambient_c, measured_voltage_unbalance_pct, measured_starts_per_hour, claimed_parts_cents, claimed_labor_cents, claimed_freight_cents]
    output: WarrantyClaim
    side_effects:
      - "sets status = SUBMITTED, reported_at, dispute_round = 0, credit_posted = false, warranty_credit_cents = 0 and defect_presumption_applied = false"
  - method: GET
    path: "/warranty-claims/{id}"
    description: "Reads one warranty claim with its adjudication and credit."
    roles: [ComplianceOfficer, Distributor, QualityCertifier, PlantAdmin]
    code: 200
    input: []
    output: WarrantyClaim
    side_effects: []
  - method: GET
    path: "/warranty-claims"
    description: "Lists warranty claims, filterable by work order and by distributor."
    roles: [ComplianceOfficer, Distributor, QualityCertifier, PlantAdmin]
    code: 200
    input: ["work_order_id?", "distributor_id?", "status?", "failure_mode?", "defect_presumption_applied?", "limit?", "offset?"]
    output: WarrantyClaim[]
    side_effects: []
  - method: POST
    path: "/warranty-claims/{id}/analyze"
    description: "Adjudicates a claim as manufacturing defect or application misuse on either the reported field data or a physical teardown, and posts the credit when defect is confirmed."
    roles: [ComplianceOfficer]
    code: 200
    input: [analysis_basis, "teardown_defect_evidence_pct?"]
    output: WarrantyClaim
    side_effects:
      - "computes misuse_index and adjudication per calc warranty_misuse_index using the variant named by analysis_basis"
      - "on DEFECT_CONFIRMED: pins claim_unit_standard_cost_cents, computes warranty_credit_cents per calc warranty_credit_waterfall and sets credit_posted = true"
      - "on MISUSE_DETERMINED: sets warranty_credit_cents = 0 and credit_posted = false"
      - "sets status to the adjudication value"
      - "recomputes Distributor.warranty_credit_balance_cents per calc warranty_credit_ledger; increments Distributor.version by 1"
      - "increments WarrantyClaim.version by 1"
  - method: POST
    path: "/warranty-claims/{id}/dispute"
    description: "Lets the owning distributor dispute an adjudication, which reverses any posted credit and reopens the analysis, up to the dispute-round limit."
    roles: [Distributor]
    code: 200
    input: [dispute_reason]
    output: WarrantyClaim
    side_effects:
      - "requires X-User-ID to equal the claim's distributor_id"
      - "increments dispute_round by 1 and enforces MAX_DISPUTE_ROUNDS"
      - "clears adjudication and misuse_index, sets warranty_credit_cents = 0 and credit_posted = false"
      - "sets status = UNDER_ANALYSIS"
      - "recomputes Distributor.warranty_credit_balance_cents per calc warranty_credit_ledger; increments Distributor.version by 1"
      - "increments WarrantyClaim.version by 1"
  - method: POST
    path: "/warranty-claims/{id}/close"
    description: "Closes an adjudicated claim, freezing its credit permanently."
    roles: [ComplianceOfficer]
    code: 200
    input: ["closure_notes?"]
    output: WarrantyClaim
    side_effects:
      - "sets status = CLOSED"
      - "recomputes Distributor.open_presumed_defect_count per calc warranty_credit_ledger; increments Distributor.version by 1"
      - "increments WarrantyClaim.version by 1"

# -----------------------------------------------------------------------------
# §1.6 Error Code Catalog
# -----------------------------------------------------------------------------
errors:
  # --- authentication and authorization
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-ID or X-User-Role missing, empty, or naming a role not declared in §1.7."
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "The caller's role is not listed on the target endpoint."
  - id: ERR_NOT_OWNER
    http: 403
    condition: "A Distributor caller acts on a CustomerOrder or WarrantyClaim whose distributor_id is not the caller's X-User-ID, or a DesignEngineer submits or revises a MotorDesign they did not author."
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "The caller is the design's author on review-decision, the stator's winder on surge-test, or the test's engineer on nameplate issue."
  # --- request validity
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "Missing required field, wrong type, enum value outside the declared set, numeric value outside the declared range or decimal width, malformed timestamp or date, interval whose end is not strictly after its start, or pagination limit/offset out of bounds."
  # --- existence
  - id: ERR_DESIGN_NOT_FOUND
    http: 404
    condition: "No MotorDesign with the given id (path {id}, design_id, or supersedes_design_id)."
  - id: ERR_ORDER_NOT_FOUND
    http: 404
    condition: "No CustomerOrder with the given id (path {id} or order_id)."
  - id: ERR_WORK_ORDER_NOT_FOUND
    http: 404
    condition: "No WorkOrder with the given id (path {id} or work_order_id)."
  - id: ERR_SUBASSEMBLY_NOT_FOUND
    http: 404
    condition: "No StatorBuild or RotorBuild with the given id (path {id}, stator_build_id, or rotor_build_id)."
  - id: ERR_ASSEMBLY_RECORD_NOT_FOUND
    http: 404
    condition: "No AssemblyRecord with the given id."
  - id: ERR_PERFORMANCE_TEST_NOT_FOUND
    http: 404
    condition: "No PerformanceTest with the given id (path {id} or performance_test_id)."
  - id: ERR_NAMEPLATE_NOT_FOUND
    http: 404
    condition: "No Nameplate with the given id."
  - id: ERR_WARRANTY_CLAIM_NOT_FOUND
    http: 404
    condition: "No WarrantyClaim with the given id."
  - id: ERR_DISTRIBUTOR_NOT_FOUND
    http: 404
    condition: "No Distributor with the given id (path {id} or distributor_id)."
  - id: ERR_OVEN_NOT_FOUND
    http: 404
    condition: "No CuringOven with the given id (path {id} or oven_id)."
  - id: ERR_TEST_CELL_NOT_FOUND
    http: 404
    condition: "No TestCell with the given id (path {id} or test_cell_id)."
  - id: ERR_STANDARD_NOT_FOUND
    http: 404
    condition: "No RegulatoryStandard with the given id."
  # --- uniqueness and resource availability
  - id: ERR_DUPLICATE_MODEL_CODE
    http: 409
    condition: "Another MotorDesign already uses the submitted model_code."
  - id: ERR_RESOURCE_IN_MAINTENANCE
    http: 409
    condition: "The referenced CuringOven or TestCell is in status MAINTENANCE rather than AVAILABLE."
  - id: ERR_DUPLICATE_ACTIVE_SUBASSEMBLY
    http: 409
    condition: "The work order already has a StatorBuild (or RotorBuild) that is neither REJECTED nor SCRAPPED."
  # --- state preconditions
  - id: ERR_INVALID_DESIGN_STATE
    http: 409
    condition: "MotorDesign.status does not permit the requested transition."
  - id: ERR_INVALID_ORDER_STATE
    http: 409
    condition: "CustomerOrder.status does not permit the requested transition, or a work order is opened against an order that is not CONFIRMED or IN_PRODUCTION."
  - id: ERR_INVALID_WORK_ORDER_STATE
    http: 409
    condition: "WorkOrder.build_status does not permit the requested operation."
  - id: ERR_INVALID_SUBASSEMBLY_STATE
    http: 409
    condition: "StatorBuild.status or RotorBuild.status does not permit the requested transition."
  - id: ERR_INVALID_PERFORMANCE_TEST_STATE
    http: 409
    condition: "The performance test is not SCHEDULED when recording, or a nameplate cites a test that is not COMPLETED."
  - id: ERR_INVALID_NAMEPLATE_STATE
    http: 409
    condition: "The nameplate is not ISSUED when revoking."
  - id: ERR_INVALID_CLAIM_STATE
    http: 409
    condition: "WarrantyClaim.status does not permit analyze, dispute or close."
  - id: ERR_REQUALIFICATION_REQUIRED
    http: 409
    condition: "The performance test carries requires_requalification = true after a design revision and must be superseded rather than recorded."
  # --- optimistic concurrency
  - id: ERR_STALE_DESIGN_VERSION
    http: 412
    condition: "expected_design_version does not equal the MotorDesign's current version (§1.2.1 work-order-create-stale-design)."
  - id: ERR_STALE_WORK_ORDER_VERSION
    http: 412
    condition: "expected_work_order_version does not equal the WorkOrder's current version (§1.2.1 performance-test-schedule-stale-work-order)."
  # --- cross-entity referential rules
  - id: ERR_DESIGN_NOT_RELEASED
    http: 409
    condition: "The design backing an order confirmation or a work order is not in status RELEASED."
  - id: ERR_STOCKING_PROGRAM_NOT_ENROLLED
    http: 409
    condition: "A STOCK_REPLENISH order is confirmed for a distributor with stocking_program_enrolled = false."
  - id: ERR_ROTOR_CONSTRUCTION_MISMATCH
    http: 409
    condition: "The requested cage_method does not match RotorBuild.construction, or the fork-specific payload fields are missing or foreign to that fork."
  - id: ERR_INSULATION_SYSTEM_MISMATCH
    http: 409
    condition: "The stator's insulation_system maps to a thermal class other than the pinned design's insulation_class."
  - id: ERR_ROTOR_BAR_COUNT_MISMATCH
    http: 409
    condition: "bar_count on the brazed-bar fork does not equal the pinned design's rotor_bar_count."
  - id: ERR_JURISDICTION_MISMATCH
    http: 409
    condition: "The nameplate's jurisdiction differs from the jurisdiction of the customer order behind the work order."
  - id: ERR_SUBASSEMBLY_NOT_ACCEPTED
    http: 409
    condition: "An assembly record cites a stator or rotor build that belongs to another work order or is not in status ACCEPTED."
  - id: ERR_NAMEPLATE_NOT_CERTIFIED
    http: 409
    condition: "A TESTED work order is shipped while certification_status is PENDING or SUSPENDED."
  # --- safety, compliance and metrology limits
  - id: ERR_SLOT_FILL_OUT_OF_RANGE
    http: 422
    condition: "slot_fill_pct is below 78.00 or above 86.00."
  - id: ERR_CURE_TEMP_EXCEEDS_OVEN_LIMIT
    http: 422
    condition: "cure_temp_c exceeds the curing oven's max_temp_c."
  - id: ERR_SURGE_OVERSTRESS
    http: 422
    condition: "surge_test_kv exceeds the stator's achieved_capability_kv."
  - id: ERR_SURGE_MARGIN_NEGATIVE
    http: 422
    condition: "surge_test_kv is below required_surge_kv, so insulation_margin_kv would be negative."
  - id: ERR_AIR_GAP_OUT_OF_TOLERANCE
    http: 422
    condition: "The absolute air_gap_deviation_mm exceeds the design's air_gap_tolerance_mm."
  - id: ERR_UNBALANCE_EXCEEDS_GRADE_LIMIT
    http: 422
    condition: "residual_unbalance_g_mm exceeds permissible_unbalance_g_mm for the requested balance grade on an ACCEPTED disposition."
  - id: ERR_SHAFT_FIT_OUT_OF_TOLERANCE
    http: 422
    condition: "shaft_fit_deviation_um falls outside the ISO band for the design's shaft_tolerance_class."
  - id: ERR_LUBRICATION_FILL_OUT_OF_RANGE
    http: 422
    condition: "grease_fill_pct falls outside the range required by the design's lubrication_spec."
  - id: ERR_DESIGN_CLASS_SHORTFALL
    http: 422
    condition: "On APPROVE, the design's guaranteed predicted_class ranks below its target_efficiency_class."
  - id: ERR_NO_APPLICABLE_STANDARD
    http: 422
    condition: "No RegulatoryStandard is eligible for the nameplate's jurisdiction, the design's poles and output, and the current effective date."
  - id: ERR_EFFICIENCY_BELOW_REGULATORY_MINIMUM
    http: 422
    condition: "The cited test's measured_efficiency_pct is below the selected standard's minimum_efficiency_pct."
  - id: ERR_TEARDOWN_EVIDENCE_REQUIRED
    http: 422
    condition: "analysis_basis is TEARDOWN without teardown_defect_evidence_pct, or FIELD_DATA with it supplied, or FIELD_DATA on a claim whose defect_presumption_applied is true."
  # --- temporal, capacity and quota rules
  - id: ERR_TEST_WINDOW_NOT_STARTED
    http: 409
    condition: "Results are recorded before the logical clock reaches the test's window_start."
  - id: ERR_OVEN_WINDOW_CONFLICT
    http: 409
    condition: "The requested impregnation window overlaps a live booking on the same oven once that booking's cooldown buffer is applied."
  - id: ERR_TEST_CELL_CAPACITY_EXCEEDED
    http: 409
    condition: "The aggregate dyno draw of overlapping tests on the cell plus the requested draw exceeds the cell's max_concurrent_kw."
  - id: ERR_ROUND_LIMIT_EXCEEDED
    http: 422
    condition: "A review decision is attempted at review_round 3 or above, or a dispute at dispute_round 2 or above."
  - id: ERR_SHIP_DATE_UNACHIEVABLE
    http: 422
    condition: "The recomputed promised_ship_date falls after the order's requested_ship_date."
  - id: ERR_STOCK_ALLOWANCE_EXCEEDED
    http: 422
    condition: "The order quantity exceeds the distributor's stock_allowance_remaining_units at confirmation."

# -----------------------------------------------------------------------------
# §1.7 RBAC Matrix
# -----------------------------------------------------------------------------
roles:
  - name: DesignEngineer
    description: "Authors motor designs, submits them for review, and reopens released designs for revision."
    identity: "opaque"
    exclusive_operations:
      - "POST /motor-designs"
      - "POST /motor-designs/{id}/submit-review"
      - "POST /motor-designs/{id}/open-revision"
    shared_operations:
      - "GET /motor-designs/{id}"
      - "GET /motor-designs"
      - "GET /regulatory-standards/{id}"
      - "GET /regulatory-standards"
    note: "Stored as MotorDesign.created_by_user_id; the design-approval separation compares that value to the reviewer's X-User-ID."
  - name: DesignReviewer
    description: "Adjudicates designs under review: releases, returns for changes, or retires them."
    identity: "opaque"
    exclusive_operations:
      - "POST /motor-designs/{id}/review-decision"
    shared_operations:
      - "GET /motor-designs/{id}"
      - "GET /motor-designs"
      - "GET /regulatory-standards/{id}"
      - "GET /regulatory-standards"
    note: "MUST NOT be the same X-User-ID as the design's created_by_user_id."
  - name: ProductionPlanner
    description: "Owns the commercial order book and the work-order schedule: confirms and cancels orders, opens work orders, and ships finished motors."
    identity: "opaque"
    exclusive_operations:
      - "POST /customer-orders/{id}/confirm"
      - "POST /customer-orders/{id}/cancel"
      - "POST /work-orders"
      - "POST /work-orders/{id}/ship"
    shared_operations:
      - "POST /customer-orders"
      - "GET /customer-orders/{id}"
      - "GET /customer-orders"
      - "GET /motor-designs/{id}"
      - "GET /motor-designs"
      - "GET /work-orders/{id}"
      - "GET /work-orders"
      - "GET /work-orders/{id}/cost-summary"
      - "GET /stator-builds/{id}"
      - "GET /stator-builds"
      - "GET /rotor-builds/{id}"
      - "GET /rotor-builds"
      - "GET /assembly-records/{id}"
      - "GET /assembly-records"
      - "GET /performance-tests/{id}"
      - "GET /performance-tests"
      - "GET /nameplates/{id}"
      - "GET /nameplates"
      - "GET /distributors/{id}"
      - "GET /distributors"
      - "GET /curing-ovens/{id}"
      - "GET /curing-ovens"
      - "GET /test-cells/{id}"
      - "GET /test-cells"
  - name: BuildTechnician
    description: "Runs the shop floor: winds stators, books impregnation, forms and machines rotors, and assembles motors."
    identity: "opaque"
    exclusive_operations:
      - "POST /stator-builds"
      - "POST /stator-builds/{id}/impregnate"
      - "POST /rotor-builds"
      - "POST /rotor-builds/{id}/form-cage"
      - "POST /rotor-builds/{id}/machine"
      - "POST /assembly-records"
    shared_operations:
      - "GET /work-orders/{id}"
      - "GET /work-orders"
      - "GET /stator-builds/{id}"
      - "GET /stator-builds"
      - "GET /rotor-builds/{id}"
      - "GET /rotor-builds"
      - "GET /assembly-records/{id}"
      - "GET /assembly-records"
      - "GET /curing-ovens/{id}"
      - "GET /curing-ovens"
    note: "Stored as StatorBuild.winder_user_id, RotorBuild.rotor_tech_user_id and AssemblyRecord.assembler_user_id; the surge-test separation compares winder_user_id to the tester's X-User-ID."
  - name: TestEngineer
    description: "Runs surge tests, dispositions subassemblies, schedules dynamometer tests and records efficiency measurements."
    identity: "opaque"
    exclusive_operations:
      - "POST /stator-builds/{id}/surge-test"
      - "POST /stator-builds/{id}/disposition"
      - "POST /rotor-builds/{id}/balance-disposition"
      - "POST /performance-tests"
      - "POST /performance-tests/{id}/record"
    shared_operations:
