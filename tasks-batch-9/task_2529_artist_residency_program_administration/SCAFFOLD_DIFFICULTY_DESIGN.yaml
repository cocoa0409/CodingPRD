            - "pre-state: Cycle.status == 'SLATE_LOCKED', slots_filled_count == 1, the application is 'OFFERED' with final_panel_score 80.00 and scored_panelist_count 2; PanelAssignment pa3 is still 'ASSIGNED' with panelist_total_100 null"
            - "the PanelAssignment side of the guard is entirely healthy: pa3.status 'ASSIGNED' is a legal source for scoring under P24, its Panelist is 'ACTIVE' under P25, and the acting X-User-ID equals pa3.panelist_id under P15"
            - "the first trigger returns 409 with error_id == 'ERR_CYCLE_STAGE_INVALID' - the block comes from the PARENT Cycle's stage, not from anything on the assignment"
            - "pa3 remains 'ASSIGNED' with all four score fields null and an unchanged version; the application's final_panel_score stays 80.00 and scored_panelist_count stays 2, so the rejected score never leaked into the aggregate"
            - "the second trigger shows the freeze is stage-wide rather than score-specific: declare-conflict on the same assignment also returns 409 'ERR_CYCLE_STAGE_INVALID', because P18 names scoring AND conflict declaration as PANEL_REVIEW-only"
            - "the failure is permanent, unlike instance 1: Cycle PANEL_REVIEW -> SLATE_LOCKED is one-way, so there is no call sequence that re-opens scoring for this cycle"
            - "positive control on the same data: issuing pa3's scores BEFORE lock-slate succeeds, moving scored_panelist_count to 3 and provisional_screening_score to round_half_up((80.00+80.00+90.00)/3, 2) == 83.33 - which confirms the payload itself was always valid"
            - "the acting user is checked before the stage only for authorisation: a DIFFERENT panelist sending the same payload gets 403 'ERR_UNAUTHORIZED' from P15, ahead of P18, so the recipe uses p3 to isolate the cross-entity guard"

      - name: final_disbursement_payment_gated_on_breached_obligations
        grounds: "§1.4 P65 ERR_OBLIGATIONS_OUTSTANDING (business_constraint, 422, 'Residency.obligations_breached_count == 0 before the highest-period_index disbursement of a residency may be paid'); §1.2 Residency IN_RESIDENCE -> COMPLETED side effect breaching PENDING obligations; §1.3 calculations.obligation_provisioning"
        distinguishing_aspect: |
          Entity pair StipendDisbursement <- Obligation. A third pair, and the only one where the
          blocking entity is a COLLECTION whose members are created by a different endpoint entirely
          and whose state changes as a SIDE EFFECT of a third entity's transition. The final
          disbursement is SCHEDULED, in order (every lower period_index has been paid), paid by a
          segregated officer and on a non-suspended residency, so all five other settlement rules
          pass. It fails because completing the residency flipped four PENDING obligations to
          BREACHED. The guard is also POSITIONAL: the same recipe pays period_index 1..3 without
          complaint, and only the highest period_index consults the obligation ledger.
        test_recipe:
          setup: |
            CHAIN-SHORT: an invited 8-week SCULPT residency for a US applicant, scheduled from
            2026-11-02 (session_end_date 2026-12-27). Scheduling provisions 4 obligations - one each
            of OPEN_STUDIO, EXHIBITION and ARTIST_TALK plus floor(8/4) == 2 COMMUNITY_WORKSHOP - all
            PENDING with due_date 2026-12-27, so obligations_required_total is 5. FinanceOfficer
            fin-01 generates the schedule at the cycle rate (4 x 140000) and fin-02 pays periods
            1..3. Trainings are recorded, the clock is moved to 2026-11-02 for CHECK_IN and then to
            2026-12-27 for COMPLETE, which breaches all four unmet obligations.
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-01"
            - call: "POST /cycles"
              payload: { code: "CY-2027", open_at: "2026-08-01T00:00:00Z", close_at: "2026-09-30T00:00:00Z",
                         application_fee_cents: 5000, panel_quorum: 2, cohort_target_size: 10,
                         alumni_reserve_pct: 0.25, stipend_pool_cents: 20000000, slate_min_score: 60.00,
                         stipend_weekly_rate_cents: 70000, session_length_options_weeks: [4, 5, 8, 9] }
              as: ProgramAdmin
              as_user_id: "admin-01"
              captures: { cyc: "$.data.id" }
            - call: "POST /disciplines"
              payload: { cycle_id: "${cyc}", code: "SCULPT", name: "Sculpture", portfolio_min_items: 1,
                         portfolio_max_items: 6, required_media_types: ["IMAGE"], requires_hazmat_review: false,
                         cohort_min_slots: 1, cohort_max_slots: 6, required_capability_tags: ["WELDING"],
                         required_ventilation_class: "LOCAL" }
              as: ProgramAdmin
              as_user_id: "admin-01"
              captures: { disc: "$.data.id" }
            - call: "POST /applicants"
              payload: { full_name: "Ada Rivet", email: "ada.rivet@example.org",
                         affiliation_org: "North Shore Collective", citizenship_country: "US",
                         treaty_country: false, declared_annual_income_cents: 2000000 }
              as: ProgramAdmin
              as_user_id: "admin-01"
              captures: { art: "$.data.id" }
            - call: "POST /cycles/${cyc}/stage"
              payload: { to_status: "OPEN" }
              as: ProgramAdmin
              as_user_id: "admin-01"
            - call: "POST /residencies"
              payload: { cycle_id: "${cyc}", applicant_id: "${art}", discipline_id: "${disc}" }
              as: ProgramAdmin
              as_user_id: "admin-01"
              captures: { res: "$.data.id" }
            - call: "POST /residencies/${res}/schedule"
              payload: { session_start_date: "2026-11-02", session_length_weeks: 8 }
              as: ProgramAdmin
              as_user_id: "admin-01"
              captures: { res_v: "$.data.version" }
            - call: "POST /residencies/${res}/stipend-schedule"
              payload: { expected_residency_version: "${res_v}" }
              as: FinanceOfficer
              as_user_id: "fin-01"
            - call: "GET /stipend-disbursements"
              payload: {}
              as: FinanceOfficer
              as_user_id: "fin-02"
              captures: { d1: "$.data[0].id", d2: "$.data[1].id", d3: "$.data[2].id", d4: "$.data[3].id" }
            - call: "POST /residencies/${res}/trainings"
              payload: { training_type: "SAFETY_ORIENTATION" }
              as: FacilitiesManager
              as_user_id: "fac-01"
            - call: "POST /residencies/${res}/trainings"
              payload: { training_type: "EQUIPMENT_WELDING" }
              as: FacilitiesManager
              as_user_id: "fac-01"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-11-02T09:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-01"
            - call: "POST /residencies/${res}/lifecycle"
              payload: { action: "CHECK_IN" }
              as: ProgramAdmin
              as_user_id: "admin-01"
            - call: "POST /stipend-disbursements/${d1}/settlement"
              payload: { action: "PAY", paid_on_date: "2026-11-16" }
              as: FinanceOfficer
              as_user_id: "fin-02"
            - call: "POST /stipend-disbursements/${d2}/settlement"
              payload: { action: "PAY", paid_on_date: "2026-11-30" }
              as: FinanceOfficer
              as_user_id: "fin-02"
            - call: "POST /stipend-disbursements/${d3}/settlement"
              payload: { action: "PAY", paid_on_date: "2026-12-14" }
              as: FinanceOfficer
              as_user_id: "fin-02"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-12-27T18:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-01"
            - call: "POST /residencies/${res}/lifecycle"
              payload: { action: "COMPLETE" }
              as: ProgramAdmin
              as_user_id: "admin-01"
          trigger:
            - call: "POST /stipend-disbursements/${d4}/settlement"
              payload: { action: "PAY", paid_on_date: "2026-12-28" }
              as: FinanceOfficer
              as_user_id: "fin-02"
              captures: { err: "$.data.error_id" }
          assert:
            - "obligations provisioned by POST /residencies/{id}/schedule: exactly 4 rows - OPEN_STUDIO 1, EXHIBITION 1, ARTIST_TALK 1 and COMMUNITY_WORKSHOP floor(8/4) == 2 - all PENDING with due_date '2026-12-27', giving obligations_required_total == 5"
            - "COMPLETE flips all four to 'BREACHED' as a SIDE EFFECT (completed_count 0 < required_count for each), so Residency.obligations_breached_count == 4 and status == 'COMPLETED'"
            - "the DISBURSEMENT side of the guard is fully satisfied: d4.status == 'SCHEDULED' (P26 passes), every lower period_index is 'PAID' so P50 passes, the payer fin-02 is not the scheduler fin-01 so P59 passes, and compliance_status == 'CLEARED' so P35 passes"
            - "the trigger returns 422 with error_id == 'ERR_OBLIGATIONS_OUTSTANDING' - the block lives entirely in the Obligation collection"
            - "d4 stays 'SCHEDULED' with withholding_cents 0 and net_cents 0; Residency.stipend_paid_gross_cents stays 420000 (3 x 140000) and withholding_to_date_cents stays 0 for the W9 resident"
            - "the guard is POSITIONAL, which is why the three earlier PAY calls in setup succeeded even though the obligations were PENDING at the time: P65 consults the obligation ledger only for the highest-period_index row"
            - "resolution path: POST /obligations/{id}/progress on each breached row to record completion, or a ProgramAdmin waiver, drives obligations_breached_count back to 0, after which the IDENTICAL d4 PAY call returns 200 with net_cents 140000 and stipend_paid_gross_cents 560000"
            - "counter-case proving the dependency direction: if COMPLETE is never issued the obligations stay 'PENDING' rather than 'BREACHED', obligations_breached_count is 0, and paying d4 succeeds - so it is the Obligation STATE and not their mere existence that gates the payment"

  # ===================================================================================
  # RULE 8 - resource_temporal_overlap
  # Differentiation: three DIFFERENT interval semantics on DIFFERENT resource entities.
  #   1. Studio (single-occupancy)  CLOSED interval + STUDIO_TURNAROUND_DAYS buffer -> P46
  #   2. HousingUnit               HALF-OPEN interval, adjacency ALLOWED, no buffer  -> P47
  #   3. Studio (shared)           AGGREGATE per-day headcount, each overlap legal   -> P68
  # Instances 1 and 3 share the resource TYPE but are governed by mutually exclusive rules
  # (max_concurrent_residents == 1 vs > 1) and use genuinely different arithmetic: pairwise
  # buffered overlap vs a per-day concurrency census.
  # ===================================================================================
  - rule_id: resource_temporal_overlap
    instances:

      - name: studio_single_occupancy_closed_interval_plus_turnaround_buffer
        grounds: "§1.3 calculations.studio_auto_selection interval predicate (closed interval extended by STUDIO_TURNAROUND_DAYS 2) and its worked_example; §1.4 P46 ERR_STUDIO_INTERVAL_CONFLICT (business_temporal, 409, scoped to Studio.max_concurrent_residents == 1); §1.5 POST /studio-assignments"
        distinguishing_aspect: |
          CLOSED interval PLUS a 2-day turnaround buffer, on a single-occupancy Studio. Both
          endpoints of an existing window are occupied, and the buffer extends the blocked range two
          days past end_date for cleaning and equipment reset. So the blocked range for an assignment
          ending 2026-12-27 runs through 2026-12-29 and a request starting 2026-12-29 is rejected
          while 2026-12-30 is accepted. Three readings are refuted at once: half-open (which would
          admit 2026-12-28), closed-without-buffer (which would admit 2026-12-28) and
          closed-with-a-1-day-buffer (which would admit 2026-12-29).
        test_recipe:
          setup: |
            CHAIN-SHORT: one cycle, two applicants, two invited 8-week/4-week SCULPT residencies.
            Residency A runs 2026-11-02 .. 2026-12-27 (8 weeks) and holds studio S-01 for its whole
            session. S-01 is SINGLE-OCCUPANCY (max_concurrent_residents 1) with capability_tags
            ["WELDING","KILN"] and ventilation_class LOCAL. Residency B is a 4-week residency
            starting 2026-12-28, so its session runs 2026-12-28 .. 2027-01-24 and any window inside
            it is legal under P45.
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-01"
            - call: "POST /cycles"
              payload: { code: "CY-2027", open_at: "2026-08-01T00:00:00Z", close_at: "2026-09-30T00:00:00Z",
                         application_fee_cents: 5000, panel_quorum: 2, cohort_target_size: 10,
                         alumni_reserve_pct: 0.25, stipend_pool_cents: 20000000, slate_min_score: 60.00,
                         stipend_weekly_rate_cents: 70000, session_length_options_weeks: [4, 5, 8, 9] }
              as: ProgramAdmin
              as_user_id: "admin-01"
              captures: { cyc: "$.data.id" }
            - call: "POST /disciplines"
              payload: { cycle_id: "${cyc}", code: "SCULPT", name: "Sculpture", portfolio_min_items: 1,
                         portfolio_max_items: 6, required_media_types: ["IMAGE"], requires_hazmat_review: false,
                         cohort_min_slots: 1, cohort_max_slots: 6, required_capability_tags: ["WELDING"],
                         required_ventilation_class: "LOCAL" }
              as: ProgramAdmin
              as_user_id: "admin-01"
              captures: { disc: "$.data.id" }
            - call: "POST /applicants"
              payload: { full_name: "Ada Rivet", email: "ada.rivet@example.org",
                         affiliation_org: "North Shore Collective", citizenship_country: "US",
                         treaty_country: false, declared_annual_income_cents: 2000000 }
              as: ProgramAdmin
              as_user_id: "admin-01"
              captures: { art1: "$.data.id" }
            - call: "POST /applicants"
              payload: { full_name: "Kell Osei", email: "kell.osei@example.org",
                         affiliation_org: "Press Room East", citizenship_country: "US",
                         treaty_country: false, declared_annual_income_cents: 2200000 }
              as: ProgramAdmin
              as_user_id: "admin-01"
              captures: { art2: "$.data.id" }
            - call: "POST /cycles/${cyc}/stage"
              payload: { to_status: "OPEN" }
              as: ProgramAdmin
              as_user_id: "admin-01"
            - call: "POST /studios"
              payload: { code: "S-01", capability_tags: ["WELDING", "KILN"], ventilation_class: "LOCAL",
                         max_concurrent_residents: 1, status: "AVAILABLE" }
              as: FacilitiesManager
              as_user_id: "fac-01"
              captures: { studio: "$.data.id" }
            - call: "POST /residencies"
              payload: { cycle_id: "${cyc}", applicant_id: "${art1}", discipline_id: "${disc}" }
              as: ProgramAdmin
              as_user_id: "admin-01"
              captures: { resA: "$.data.id" }
            - call: "POST /residencies"
              payload: { cycle_id: "${cyc}", applicant_id: "${art2}", discipline_id: "${disc}" }
              as: ProgramAdmin
              as_user_id: "admin-01"
              captures: { resB: "$.data.id" }
            - call: "POST /residencies/${resA}/schedule"
              payload: { session_start_date: "2026-11-02", session_length_weeks: 8 }
              as: ProgramAdmin
              as_user_id: "admin-01"
              captures: { resA_v: "$.data.version" }
            - call: "POST /residencies/${resB}/schedule"
              payload: { session_start_date: "2026-12-28", session_length_weeks: 4 }
              as: ProgramAdmin
              as_user_id: "admin-01"
              captures: { resB_v: "$.data.version" }
            - call: "POST /studio-assignments"
              payload: { residency_id: "${resA}", studio_id: "${studio}", start_date: "2026-11-02",
                         end_date: "2026-12-27", expected_residency_version: "${resA_v}" }
              as: FacilitiesManager
              as_user_id: "fac-01"
              captures: { saA: "$.data.id" }
          trigger:
            - call: "POST /studio-assignments"
              payload: { residency_id: "${resB}", studio_id: "${studio}", start_date: "2026-12-29",
                         end_date: "2027-01-20", expected_residency_version: "${resB_v}" }
              as: FacilitiesManager
              as_user_id: "fac-01"
              captures: { err_buffer: "$.data.error_id" }
            - call: "POST /studio-assignments"
              payload: { residency_id: "${resB}", studio_id: "${studio}", start_date: "2026-12-30",
                         end_date: "2027-01-20", expected_residency_version: "${resB_v}" }
              as: FacilitiesManager
              as_user_id: "fac-01"
              captures: { saB: "$.data.id" }
          assert:
            - "pre-state: S-01 max_concurrent_residents == 1; assignment A is ACTIVE for 2026-11-02 .. 2026-12-27 with occupied_days == 56 (closed interval: 2026-12-27 minus 2026-11-02 plus 1); Studio.reserved_resident_days == 56, active_assignment_count == 1"
            - "residency B's session runs 2026-12-28 .. 2027-01-24 (2026-12-28 plus 27 days), so both requested windows sit inside it and P45 never fires"
            - "the FIRST trigger (start 2026-12-29) returns 409 with error_id == 'ERR_STUDIO_INTERVAL_CONFLICT': A's blocked range is [2026-11-02, 2026-12-27 + 2 days] == [2026-11-02, 2026-12-29] and the request touches its final day"
            - "the SECOND trigger (start 2026-12-30, one day later) returns 201 - the buffer is exactly STUDIO_TURNAROUND_DAYS == 2 days wide, not 1 and not 3"
            - "the accepted assignment has occupied_days == 22 (2026-12-30 and 12-31, plus 2027-01-01 through 01-20, closed interval) and selection_mode == 'EXPLICIT'"
            - "Studio.reserved_resident_days == 78 (56 + 22) and active_assignment_count == 2 after the successful call, even though the studio is single-occupancy - the headcount limit applies per DAY, and the two windows are disjoint"
            - "the closed-interval reading is what makes 2026-12-27 A's last occupied day: a half-open reading would free 2026-12-27 and, with the same 2-day buffer, would admit a request starting 2026-12-29"
            - "the buffer is symmetric in the predicate: a request ENDING 2026-10-31 (two days before A starts) is also rejected, because the predicate adds the buffer to the requested end as well as to the incumbent end"
            - "Residency B's version had to be captured from its own schedule call; the failed first attempt does NOT bump it, which is why the same ${resB_v} token is still valid for the second attempt"
            - "residency A's assignment is untouched by either call: still ACTIVE with occupied_days 56"

      - name: housing_half_open_interval_permits_adjacent_check_in
        grounds: "§1.3 calculations.housing_occupancy (HALF-OPEN interval, 'adjacency is NOT a conflict', no turnaround buffer) and its worked_example; §1.4 P47 ERR_HOUSING_INTERVAL_CONFLICT (business_temporal, 409); §1.5 POST /housing-assignments"
        distinguishing_aspect: |
          HALF-OPEN interval on a DIFFERENT resource entity (HousingUnit) with the OPPOSITE boundary
          verdict. A bed is occupied for NIGHTS, so an assignment 2026-11-02 .. 2026-12-28 owns the
          nights of 11-02 through 12-27 and the 12-28 night is free: one resident checking out on
          date D and another checking in on date D share nothing. And unlike studios there is no
          turnaround buffer, so the very next day after the last occupied night is bookable. The
          same calendar relationship that is ILLEGAL in instance 1 is LEGAL here, which is exactly
          why a single shared "does this overlap?" helper cannot serve both resources.
        test_recipe:
          setup: |
            CHAIN-SHORT: one cycle, two applicants, two invited SCULPT residencies. Residency A runs
            8 weeks from 2026-11-02 (session_end_date 2026-12-27) and holds the single bed of
            housing unit H-01 over the half-open interval 2026-11-02 .. 2026-12-28, i.e. every night
            of the session including the last. H-01 has bed_count 1 and meal_plan_included false, so
            capacity is the binding resource and no meal-plan rule interferes. Residency B is a
            4-week residency starting 2026-12-20, so its session runs 2026-12-20 .. 2027-01-16 and a
            check_out_date of 2027-01-17 is legal under P45's session_end_date + 1 day allowance.
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-01"
            - call: "POST /cycles"
              payload: { code: "CY-2027", open_at: "2026-08-01T00:00:00Z", close_at: "2026-09-30T00:00:00Z",
                         application_fee_cents: 5000, panel_quorum: 2, cohort_target_size: 10,
                         alumni_reserve_pct: 0.25, stipend_pool_cents: 20000000, slate_min_score: 60.00,
