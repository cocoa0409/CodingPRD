            - call: "POST /dealers"
              payload: { dealer_code: "D-NV", dealer_name: "Silver State Bus", licensed_state_codes: ["NV"], training_capacity_per_month: 6 }
              as: ContractsAdmin
              as_user_id: "contracts-01"
              captures: { dealer_nv_id: $.data.id }
            - call: "POST /dealers/${dealer_tx_id}/legacy-fleet-records"
              payload: { bus_model_id: "${model_c_id}", propulsion_package_id: "${pkg_dsl_id}", spec_profile_id: "${tx_id}", vin: "1TXDSL0000000901", delivered_at: "2026-05-10" }
              as: ContractsAdmin
              as_user_id: "contracts-01"
              captures: { unit_id: $.data.id }
            - call: "POST /recall-campaigns"
              payload: { campaign_code: "RC-DSL-01", affected_bus_model_id: "${model_c_id}", affected_propulsion_type: "DIESEL", defect_category: "BRAKE", build_window_start: "2026-01-01", build_window_end: "2026-07-31", kits_per_unit: 1, total_kits: 4 }
              as: ComplianceOfficer
