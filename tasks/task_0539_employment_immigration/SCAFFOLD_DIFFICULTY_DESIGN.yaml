              as: EmployerAgent
              as_user_id: "${emp_id}"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_STATE (state priority 7 beats referential priority 8)"
            - "H1BPetition.${pet_id}.status == DENIED (unchanged)"

  - rule_id: boundary_precision_check
    instances:
      - name: lca_wage_exactly_equal_prevailing_certifies
        grounds:
          - validations[priority=13]
          - state_machines.LCA.DRAFT_to_CERTIFIED
        distinguishing_aspect: |
          offered_wage_cents == prevailing_wage_cents (10000000 == 10000000) passes the
          inclusive >= wage floor and certifies; one cent below would be ERR_WAGE_BELOW_PREVAILING.
          Metric = wage cents; endpoint = LCA certify.
        test_recipe:
          setup:
            - "A DRAFT LCA with offered_wage_cents == prevailing_wage_cents == 10000000."
          setup_api_calls:
            - call: "POST /employers"
              payload: { fein: "121212121", legal_name: "Kappa Co", employee_count: 7 }
