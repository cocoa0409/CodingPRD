  # ---------------------------------------------------------------------------
  - section: consistency_model
    instances:
      - name: mutations_visible_immediately_in_same_and_next_read
        claim_type: immediate
        grounds: ["complexity_profile.consistency_model"]
        distinguishing_aspect: "Immediate consistency: the transition response itself carries the new state and a subsequent GET agrees (no eventual lag anywhere outside documented computed-on-read fields)."
        test_recipe:
          setup: ["Venue ACTIVE"]
          setup_api_calls:
            - { call: "POST /surveillance/venues", payload: { venue_code: "NYSE", name: "New York Stock Exchange", venue_type: "EXCHANGE" }, as: ComplianceAdmin, captures: { v_id: "$.data.id", v_s1: "$.data.status" } }
          trigger:
            - { call: "POST /surveillance/venues/${v_id}/transition", payload: { to_status: "SUSPENDED" }, as: ComplianceAdmin, captures: { v_s2: "$.data.status" } }
            - { call: "GET /surveillance/venues/${v_id}", payload: {}, as: ComplianceAdmin, captures: { v_s3: "$.data.status" } }
          assert:
            - "Create response: ${v_s1} == ACTIVE; transition response: ${v_s2} == SUSPENDED; re-read: ${v_s3} == SUSPENDED"
