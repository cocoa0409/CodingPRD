scaffold_difficulty_design:

  # =========================================================================
  # Rule 1 — dual_variant_calc
  # =========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: order_fee_provisional_vs_final_diverge_when_schedule_window_rolls
        grounds:
          - calculations.fee_quote_provisional
          - calculations.fee_quote_final
          - state_machines.TranscriptOrder.payment_status.AUTHORIZED_to_CAPTURED
          - entities.TranscriptOrder.fields.quoted_fee_cents
          - entities.TranscriptOrder.fields.final_fee_cents
        distinguishing_aspect: |
          Both calculations run the SAME tiered-pricing formula over the SAME
          OrderLineItems, but provisional pins the FeeSchedule at submitted_at
          while final re-prices against the schedule effective at the capture
          clock. When a new FeeSchedule window rolls between submit and capture,
          the two variants produce different cent values on the TranscriptOrder
          (order/accounting domain).
        test_recipe:
          setup:
            - "Student s1 exists; no holds"
            - "FeeSchedule FS1 active with official_base_cents=1000, effective 2026-07-01..2026-08-15"
            - "FeeSchedule FS2 active with official_base_cents=1200, effective 2026-08-15..open"
            - "Order o1 for s1, OFFICIAL, 1x ELECTRONIC_NETWORK line, submitted at 2026-08-10T10:00:00Z (FS1 window)"
            - "IdentityVerification for o1 VERIFIED before submit"
            - "Payment p1 authorized against o1 with amount_cents == quoted_fee_cents (1000)"
            - "Clock advanced to 2026-08-16T10:00:00Z (FS2 window) BEFORE capture"
          setup_api_calls:
            - call: "POST /registrar/_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: RegistrarAdmin
            - call: "POST /registrar/fee-schedules"
              payload:
                code: "FS-2026A"
                official_base_cents: 1000
                unofficial_base_cents: 500
                paper_surcharge_cents: 200
                pickup_surcharge_cents: 100
                rush_flat_cents: 1500
                rush_multiplier_bp: 15000
                volume_tiers: [{ min_copies: 5, discount_bp: 1000 }]
                effective_from: "2026-07-01T00:00:00Z"
                effective_to: "2026-08-15T00:00:00Z"
                active: true
              as: RegistrarAdmin
            - call: "POST /registrar/fee-schedules"
              payload:
                code: "FS-2026B"
                official_base_cents: 1200
                unofficial_base_cents: 600
                paper_surcharge_cents: 200
                pickup_surcharge_cents: 100
                rush_flat_cents: 1500
                rush_multiplier_bp: 15000
                volume_tiers: [{ min_copies: 5, discount_bp: 1000 }]
                effective_from: "2026-08-15T00:00:00Z"
                active: true
              as: RegistrarAdmin
              captures: { fs_b_id: $.data.id }
            - call: "POST /registrar/students"
              payload:
                student_number: "S1000001"
                full_name: "Alice Zhang"
                date_of_birth: "2000-01-15"
                email: "alice@example.edu"
              as: RegistrarAdmin
              captures: { student_id: $.data.id }
            - call: "POST /registrar/recipients"
              payload:
                kind: "ELECTRONIC_NETWORK"
                display_name: "State U Admissions"
                network_code: "NET-STATE-U"
              as: RegistrarAdmin
              captures: { recip_id: $.data.id }
            - call: "POST /registrar/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T10:00:00Z" }
              as: RegistrarAdmin
            - call: "POST /registrar/orders"
              payload:
                student_id: "${student_id}"
                order_kind: "OFFICIAL"
                rush_requested: false
              as: Student
              as_user_id: "${student_id}"
              captures: { order_id: $.data.id, order_v0: $.data.version }
            - call: "POST /registrar/orders/${order_id}/line-items"
              payload:
                recipient_id: "${recip_id}"
                delivery_kind: "ELECTRONIC_NETWORK"
                quantity: 1
                expected_order_version: "${order_v0}"
              as: Student
              as_user_id: "${student_id}"
              captures: { order_v1: $.data.version }
            - call: "POST /registrar/identity-verifications"
              payload:
                student_id: "${student_id}"
                order_id: "${order_id}"
                method: "SSN_DOB"
              as: Student
              as_user_id: "${student_id}"
              captures: { idv_id: $.data.id, idv_token: $.data.verification_token }
            - call: "POST /registrar/identity-verifications/${idv_id}/confirm"
              payload: { verification_token: "${idv_token}" }
              as: Student
              as_user_id: "${student_id}"
            - call: "POST /registrar/orders/${order_id}/submit"
              payload: { expected_order_version: "${order_v1}" }
              as: Student
              as_user_id: "${student_id}"
              captures: { order_v2: $.data.version, quoted_at_submit: $.data.quoted_fee_cents }
            - call: "POST /registrar/payments"
              payload:
                order_id: "${order_id}"
                idempotency_key: "pay-key-001"
              as: Student
              as_user_id: "${student_id}"
              captures: { payment_id: $.data.id }
            - call: "POST /registrar/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-16T10:00:00Z" }
              as: RegistrarAdmin
          trigger:
            - call: "POST /registrar/payments/${payment_id}/capture"
              payload: {}
              as: RegistrarOperator
              captures: { captured_cents: $.data.captured_cents }
          assert:
            - "TranscriptOrder.${order_id}.quoted_fee_cents == 1000"
            - "TranscriptOrder.${order_id}.final_fee_cents == 1200"
            - "Payment.${payment_id}.amount_cents == 1200 (reconciled at capture)"
            - "Payment.${payment_id}.captured_cents == 1200"
            - "quoted_fee_cents != final_fee_cents (provisional vs final variants diverge)"

      - name: verification_fee_archived_vs_non_archived_subject_diverge
        grounds:
          - calculations.verification_fee
          - state_machines.VerificationRequest.CONSENT_CHECK_to_APPROVED
          - entities.VerificationRequest.fields.fee_cents
          - entities.Student.fields.archived_record_flag
        distinguishing_aspect: |
          Same verification_fee formula, same scope (DEGREE_ONLY), evaluated for
          two VerificationRequest rows that differ ONLY in subject_student.
          archived_record_flag — one subject has archived_record_flag=true, the
          other false. The ARCHIVE_SURCHARGE_CENTS=1500 addend is conditional on
          the subject entity's flag, so the two runs of the same rule produce
          different fee_cents. Entity domain: VerificationRequest (distinct from
          the TranscriptOrder fee domain of the sibling instance).
        test_recipe:
          setup:
            - "Student s_a with archived_record_flag=false"
            - "Student s_b with archived_record_flag=true"
            - "VerificationRequest vr_a against s_a, scope=DEGREE_ONLY, in CONSENT_CHECK with valid ACTIVE ConsentGrant"
            - "VerificationRequest vr_b against s_b, scope=DEGREE_ONLY, in CONSENT_CHECK with valid ACTIVE ConsentGrant"
          setup_api_calls:
            - call: "POST /registrar/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: RegistrarAdmin
            - call: "POST /registrar/students"
              payload:
                student_number: "S2000001"
                full_name: "Bob Smith"
                date_of_birth: "1999-05-20"
                email: "bob@example.edu"
                archived_record_flag: false
              as: RegistrarAdmin
              captures: { student_a: $.data.id }
            - call: "POST /registrar/students"
              payload:
                student_number: "S2000002"
                full_name: "Carol Jones"
                date_of_birth: "1975-03-11"
                email: "carol@example.edu"
                archived_record_flag: true
              as: RegistrarAdmin
              captures: { student_b: $.data.id }
            - call: "POST /registrar/consent-grants"
              payload:
                student_id: "${student_a}"
                grantee_name: "Employer Inc"
                scope: "DEGREE_ONLY"
                expires_at: "2027-08-01T00:00:00Z"
              as: Student
              as_user_id: "${student_a}"
              captures: { grant_a: $.data.id }
            - call: "POST /registrar/consent-grants"
              payload:
                student_id: "${student_b}"
                grantee_name: "Employer Inc"
                scope: "DEGREE_ONLY"
                expires_at: "2027-08-01T00:00:00Z"
              as: Student
              as_user_id: "${student_b}"
              captures: { grant_b: $.data.id }
            - call: "POST /registrar/verification-requests"
              payload:
                requester_name: "Employer Inc"
                subject_student_id: "${student_a}"
                scope: "DEGREE_ONLY"
                consent_grant_id: "${grant_a}"
              as: VerificationRequester
              captures: { vr_a: $.data.id }
            - call: "POST /registrar/verification-requests"
              payload:
                requester_name: "Employer Inc"
                subject_student_id: "${student_b}"
                scope: "DEGREE_ONLY"
                consent_grant_id: "${grant_b}"
              as: VerificationRequester
              captures: { vr_b: $.data.id }
            - call: "POST /registrar/verification-requests/${vr_a}/begin-review"
              payload: {}
              as: RegistrarReviewer
            - call: "POST /registrar/verification-requests/${vr_b}/begin-review"
              payload: {}
              as: RegistrarReviewer
          trigger:
            - call: "POST /registrar/verification-requests/${vr_a}/approve"
              payload: {}
              as: RegistrarReviewer
              captures: { fee_a: $.data.fee_cents }
            - call: "POST /registrar/verification-requests/${vr_b}/approve"
              payload: {}
              as: RegistrarReviewer
              captures: { fee_b: $.data.fee_cents }
          assert:
            - "VerificationRequest.${vr_a}.fee_cents == 800"
            - "VerificationRequest.${vr_b}.fee_cents == 2300"
            - "fee_a != fee_b (same formula, divergent variants driven by subject flag)"

  # =========================================================================
  # Rule 2 — combinatorial_formula (different modes a/b/c)
  # =========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: fee_quote_per_line_rounding_then_sum
        grounds:
          - calculations.fee_quote_provisional
          - entities.OrderLineItem.fields.unit_price_cents
          - entities.TranscriptOrder.fields.quoted_fee_cents
        distinguishing_aspect: |
          Mode (b) — nested rounding where order matters. The scaffold pins
          per-line rounding BEFORE summing: round_half_up(line_base) per
          OrderLineItem, then sum. An implementation that sums raw fractional
          cents and rounds once at the end would produce a different total
          whenever surcharges interact with quantity. The setup deliberately
          uses a paper_surcharge_cents whose per-line product lands on an exact
          integer when rounded per-line but would differ under sum-then-round.
        test_recipe:
          setup:
            - "FeeSchedule FS: official_base=999, paper_surcharge=201 (per-line: 1200 exactly)"
            - "Order OFFICIAL with two PAPER_MAIL lines, quantity=1 each"
            - "Submit at 2026-08-10T10:00:00Z; no rush"
          setup_api_calls:
            - call: "POST /registrar/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: RegistrarAdmin
            - call: "POST /registrar/fee-schedules"
              payload:
                code: "FS-ROUND"
                official_base_cents: 999
                unofficial_base_cents: 499
                paper_surcharge_cents: 201
                pickup_surcharge_cents: 100
                rush_flat_cents: 1500
                rush_multiplier_bp: 15000
                volume_tiers: []
                effective_from: "2026-08-01T00:00:00Z"
                active: true
              as: RegistrarAdmin
            - call: "POST /registrar/students"
              payload:
                student_number: "S3000001"
                full_name: "Dave Lee"
                date_of_birth: "2001-04-01"
                email: "dave@example.edu"
              as: RegistrarAdmin
              captures: { student_id: $.data.id }
            - call: "POST /registrar/recipients"
              payload:
                kind: "PAPER_MAIL"
                display_name: "Home"
                postal_address: "1 Main St, Springfield"
              as: RegistrarAdmin
              captures: { recip_id: $.data.id }
            - call: "POST /registrar/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T10:00:00Z" }
              as: RegistrarAdmin
            - call: "POST /registrar/orders"
              payload:
                student_id: "${student_id}"
                order_kind: "OFFICIAL"
                rush_requested: false
              as: Student
              as_user_id: "${student_id}"
              captures: { order_id: $.data.id, order_v0: $.data.version }
            - call: "POST /registrar/orders/${order_id}/line-items"
              payload:
                recipient_id: "${recip_id}"
                delivery_kind: "PAPER_MAIL"
                quantity: 1
                expected_order_version: "${order_v0}"
              as: Student
              as_user_id: "${student_id}"
              captures: { line_a: $.data.id, order_v1: $.data.version, unit_a: $.data.unit_price_cents }
            - call: "POST /registrar/orders/${order_id}/line-items"
              payload:
                recipient_id: "${recip_id}"
                delivery_kind: "PAPER_MAIL"
                quantity: 1
                expected_order_version: "${order_v1}"
              as: Student
              as_user_id: "${student_id}"
              captures: { line_b: $.data.id, order_v2: $.data.version, unit_b: $.data.unit_price_cents }
            - call: "POST /registrar/identity-verifications"
              payload:
                student_id: "${student_id}"
                order_id: "${order_id}"
                method: "SSN_DOB"
              as: Student
              as_user_id: "${student_id}"
              captures: { idv_id: $.data.id, idv_token: $.data.verification_token }
            - call: "POST /registrar/identity-verifications/${idv_id}/confirm"
              payload: { verification_token: "${idv_token}" }
              as: Student
              as_user_id: "${student_id}"
          trigger:
            - call: "POST /registrar/orders/${order_id}/submit"
              payload: { expected_order_version: "${order_v2}" }
              as: Student
              as_user_id: "${student_id}"
              captures: { quoted: $.data.quoted_fee_cents }
          assert:
            - "OrderLineItem.${line_a}.unit_price_cents == 1200"
            - "OrderLineItem.${line_b}.unit_price_cents == 1200"
            - "TranscriptOrder.${order_id}.quoted_fee_cents == 2400"

      - name: fee_quote_rush_cutoff_volume_tier_and_rush_multiplier_combined
        grounds:
          - calculations.fee_quote_provisional
          - calculations.rush_qualification
          - entities.FeeSchedule.fields.volume_tiers
          - entities.FeeSchedule.fields.rush_multiplier_bp
        distinguishing_aspect: |
          Mode (a) — a formula with >=3 inputs and non-linear interaction:
          tiered volume discount (conditional branch on total_copies) nested
          with a rush multiplier (1.5x) and rush flat fee (additive AFTER the
          multiplier), in the pinned order (discount -> rush multiplier -> rush
          flat). Inputs: quantity, base_cents, discount_bp, multiplier_bp,
          flat_cents. Order of operations is load-bearing.
        test_recipe:
          setup:
            - "FeeSchedule FS: official_base=1000, volume tier >=5 copies discount_bp=1000 (10%), rush_multiplier_bp=15000 (1.5x), rush_flat_cents=1500"
            - "Order OFFICIAL with 1 ELECTRONIC_NETWORK line, quantity=5 (hits tier exactly)"
            - "Submitted 2026-08-10 (Monday) 10:00 local — rush qualified"
          setup_api_calls:
            - call: "POST /registrar/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: RegistrarAdmin
            - call: "POST /registrar/fee-schedules"
              payload:
                code: "FS-COMB"
                official_base_cents: 1000
                unofficial_base_cents: 500
                paper_surcharge_cents: 200
                pickup_surcharge_cents: 100
                rush_flat_cents: 1500
                rush_multiplier_bp: 15000
                volume_tiers: [{ min_copies: 5, discount_bp: 1000 }]
                effective_from: "2026-08-01T00:00:00Z"
                active: true
              as: RegistrarAdmin
            - call: "POST /registrar/students"
              payload:
                student_number: "S3000002"
                full_name: "Eve Park"
                date_of_birth: "2002-07-12"
                email: "eve@example.edu"
              as: RegistrarAdmin
              captures: { student_id: $.data.id }
            - call: "POST /registrar/recipients"
              payload:
                kind: "ELECTRONIC_NETWORK"
                display_name: "State U"
                network_code: "NET-STATE-U"
              as: RegistrarAdmin
              captures: { recip_id: $.data.id }
            # 2026-08-10 is a Monday
            - call: "POST /registrar/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T10:00:00Z" }
              as: RegistrarAdmin
            - call: "POST /registrar/orders"
              payload:
                student_id: "${student_id}"
                order_kind: "OFFICIAL"
                rush_requested: true
              as: Student
              as_user_id: "${student_id}"
              captures: { order_id: $.data.id, order_v0: $.data.version }
            - call: "POST /registrar/orders/${order_id}/line-items"
              payload:
                recipient_id: "${recip_id}"
                delivery_kind: "ELECTRONIC_NETWORK"
                quantity: 5
                expected_order_version: "${order_v0}"
              as: Student
              as_user_id: "${student_id}"
              captures: { order_v1: $.data.version }
            - call: "POST /registrar/identity-verifications"
              payload:
                student_id: "${student_id}"
                order_id: "${order_id}"
                method: "SSN_DOB"
              as: Student
              as_user_id: "${student_id}"
              captures: { idv_id: $.data.id, idv_token: $.data.verification_token }
            - call: "POST /registrar/identity-verifications/${idv_id}/confirm"
              payload: { verification_token: "${idv_token}" }
              as: Student
              as_user_id: "${student_id}"
          trigger:
            - call: "POST /registrar/orders/${order_id}/submit"
              payload: { expected_order_version: "${order_v1}" }
              as: Student
              as_user_id: "${student_id}"
              captures: { quoted: $.data.quoted_fee_cents, rush_q: $.data.rush_qualified }
          assert:
            # subtotal = 1000*5 = 5000
            # volume discount: 5000 * (1 - 0.10) = 4500
            # rush multiplier: 4500 * 1.5 = 6750
            # rush flat: 6750 + 1500 = 8250
            - "TranscriptOrder.${order_id}.rush_qualified == true"
            - "TranscriptOrder.${order_id}.quoted_fee_cents == 8250"

  # =========================================================================
  # Rule 3 — non_linear_state_machine (different entities)
  # =========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: order_parallel_payment_and_fulfillment_dimensions
        grounds:
          - state_machines.TranscriptOrder
          - state_machines.TranscriptOrder.payment_status
          - entities.TranscriptOrder.fields.fulfillment_status
          - entities.TranscriptOrder.fields.payment_status
        distinguishing_aspect: |
          TranscriptOrder carries TWO independent parallel state dimensions on
          the same row (fulfillment_status x payment_status). fulfillment can
          sit at READY_TO_FULFILL while payment is still UNPAID; payment can
          advance to CAPTURED while fulfillment is at HOLD_CHECK. The two
          dimensions only join at guarded transitions (e.g. dispatch requires
          payment_status IN {CAPTURED, WAIVED}).
        test_recipe:
          setup:
            - "Order o1 READY_TO_FULFILL but payment_status still UNPAID"
            - "IdentityVerification VERIFIED; no holds"
          setup_api_calls:
            - call: "POST /registrar/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: RegistrarAdmin
            - call: "POST /registrar/fee-schedules"
              payload:
                code: "FS-PAR"
                official_base_cents: 1000
                unofficial_base_cents: 500
                paper_surcharge_cents: 200
                pickup_surcharge_cents: 100
                rush_flat_cents: 1500
                rush_multiplier_bp: 15000
                volume_tiers: []
                effective_from: "2026-08-01T00:00:00Z"
                active: true
              as: RegistrarAdmin
            - call: "POST /registrar/students"
              payload:
                student_number: "S4000001"
                full_name: "Frank White"
                date_of_birth: "2000-11-05"
                email: "frank@example.edu"
              as: RegistrarAdmin
              captures: { student_id: $.data.id }
            - call: "POST /registrar/recipients"
              payload:
                kind: "EMAIL_PDF"
                display_name: "Self Email"
                email_address: "frank@example.edu"
              as: RegistrarAdmin
              captures: { recip_id: $.data.id }
            - call: "POST /registrar/orders"
              payload:
                student_id: "${student_id}"
                order_kind: "OFFICIAL"
                rush_requested: false
              as: Student
              as_user_id: "${student_id}"
              captures: { order_id: $.data.id, order_v0: $.data.version }
            - call: "POST /registrar/orders/${order_id}/line-items"
              payload:
                recipient_id: "${recip_id}"
                delivery_kind: "EMAIL_PDF"
                quantity: 1
                expected_order_version: "${order_v0}"
              as: Student
              as_user_id: "${student_id}"
              captures: { order_v1: $.data.version, line_id: $.data.id }
            - call: "POST /registrar/identity-verifications"
              payload:
                student_id: "${student_id}"
                order_id: "${order_id}"
                method: "SSN_DOB"
              as: Student
              as_user_id: "${student_id}"
              captures: { idv_id: $.data.id, idv_token: $.data.verification_token }
            - call: "POST /registrar/identity-verifications/${idv_id}/confirm"
              payload: { verification_token: "${idv_token}" }
              as: Student
              as_user_id: "${student_id}"
            - call: "POST /registrar/orders/${order_id}/submit"
              payload: { expected_order_version: "${order_v1}" }
              as: Student
              as_user_id: "${student_id}"
          trigger:
            - call: "POST /registrar/line-items/${line_id}/dispatch"
              payload: {}
              as: RegistrarOperator
              captures: { err: $.data.error_id }
          assert:
            - "Trigger fails with ERR_INVALID_STATE (payment_status UNPAID, dispatch requires CAPTURED|WAIVED)"
            - "err == ERR_INVALID_STATE"
            - "TranscriptOrder.${order_id}.fulfillment_status == READY_TO_FULFILL"
            - "TranscriptOrder.${order_id}.payment_status == UNPAID"

      - name: clearinghouse_batch_failed_to_open_resweep_cycle
        grounds:
          - state_machines.ClearinghouseReportBatch
          - entities.ClearinghouseReportBatch.fields.status
        distinguishing_aspect: |
          ClearinghouseReportBatch exhibits a cyclic shape: TRANSMITTED ->
          FAILED releases membership so the same items are re-swept into a NEW
          OPEN batch -> that batch is LOCKED -> TRANSMITTED again. The cycle
          terminates only when a TRANSMITTED batch reaches ACKED. This is a
          different entity from TranscriptOrder's parallel-dimension shape.
        test_recipe:
          setup:
            - "One DELIVERED order o1 in period [2026-08-01, 2026-09-01)"
            - "Batch b1 created for that period sweeps o1; b1 LOCKED -> TRANSMITTED"
            - "b1 marked FAILED"
            - "New batch b2 created for the same period — o1 must be re-swept"
          setup_api_calls:
            - call: "POST /registrar/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: RegistrarAdmin
            - call: "POST /registrar/fee-schedules"
              payload:
                code: "FS-CH"
                official_base_cents: 1000
                unofficial_base_cents: 500
                paper_surcharge_cents: 200
                pickup_surcharge_cents: 100
                rush_flat_cents: 1500
                rush_multiplier_bp: 15000
                volume_tiers: []
                effective_from: "2026-08-01T00:00:00Z"
                active: true
              as: RegistrarAdmin
            - call: "POST /registrar/students"
              payload:
                student_number: "S4000002"
                full_name: "Gina Hall"
