              captures: { lic_id: $.data.id }
            - call: "POST /pharmacies/${ph_id}/licenses/${lic_id}/verification"
              payload: {}
              as: PharmacyOps
            - call: "POST /patients"
              payload: { full_name: "Ada Reyes", email: "ada@example.com", home_state_code: "CA" }
              as: PharmacyOps
              captures: { pat_id: $.data.id }
            - call: "POST /prescribers"
              payload: { prescriber_name: "Dr. Lin", npi: "1407001234", license_state_code: "CA" }
              as: PharmacyOps
              captures: { prs_id: $.data.id }
            - call: "POST /prescriptions"
              payload: { patient_id: "${pat_id}", prescriber_id: "${prs_id}", drug_id: "${d_id}", ship_state_code: "CA", total_refills_authorized: 1 }
              as: PharmacyOps
              captures: { rx_id: $.data.id }
            - call: "POST /prescriptions/${rx_id}/intake-requests"
              payload: { packaged_quantity: 100 }
              as: PharmacyOps
              captures: { rq_id: $.data.id }
            - call: "POST /prescription-requests/${rq_id}/review"
              payload: {}
              as: Pharmacist
            - call: "POST /prescription-requests/${rq_id}/acceptance"
              payload: {}
