  - section: calculations
    instances:
      - name: rebate_ranking_uses_uncapped_amount_but_stores_capped
        claim_type: correct_result
        grounds:
          - calculations.rebate_qualification
          - entities.CertificationDossier.fields.qualified_program_codes
          - entities.MachineModel.fields.rebate_amount_cents
        distinguishing_aspect: "Two programs qualify at once and the winner pays LESS than the loser would: UTIL-B-RICH wins on uncapped 170000 but its cap 70000 binds, while the runner-up UTIL-A-BIG would have paid its full 90000. Ranking on the capped amount, or picking max(payable), gives 90000 and is wrong."
        test_recipe:
          setup:
            - "Two ACTIVE rebate programs on DIFFERENT utility codes (so the one-clear-day window rule cannot fire), both covering 2026-08-01"
            - "UTIL-A-BIG: base 60000, bonus 5000 per 10 lb, min_capacity 40, cap 90000"
            - "UTIL-B-RICH: base 50000, bonus 20000 per 10 lb, min_capacity 40, cap 70000"
            - "Model OPL-100-A, ON_PREMISES, 100 lb, with an IN_REVIEW dossier measuring water 1.05 / kWh 0.40"
          setup_api_calls:
            - call: "POST /clm/rebate-programs"
              payload: { program_code: "UTIL-A-BIG", utility_code: "UTIL-A", program_class: "COMBINED", eligible_product_lines: ["ON_PREMISES"], max_water_gal_per_cwt: 1.10, max_kwh_per_cwt: 0.45, min_capacity_rating_lb: 40, rebate_base_cents: 60000, capacity_bonus_cents_per_10lb: 5000, rebate_cap_cents: 90000, effective_from: "2026-07-01T00:00:00Z", effective_to: "2026-12-31T00:00:00Z" }
              as: ComplianceOfficer
              as_user_id: "u-co-01"
            - call: "POST /clm/rebate-programs"
              payload: { program_code: "UTIL-B-RICH", utility_code: "UTIL-B", program_class: "COMBINED", eligible_product_lines: ["ON_PREMISES"], max_water_gal_per_cwt: 1.10, max_kwh_per_cwt: 0.45, min_capacity_rating_lb: 40, rebate_base_cents: 50000, capacity_bonus_cents_per_10lb: 20000, rebate_cap_cents: 70000, effective_from: "2026-06-01T00:00:00Z", effective_to: "2026-09-30T00:00:00Z" }
              as: ComplianceOfficer
              as_user_id: "u-co-01"
            - call: "POST /clm/machine-models"
              payload: { model_code: "OPL-100-A", product_line: "ON_PREMISES", capacity_rating_lb: 100, rated_water_gal_per_cwt: 1.05, rated_kwh_per_cwt: 0.42, drum_alloy_grade: "AISI_304", payment_module_options: [], list_price_cents: 1650000 }
              as: ProductEngineer
              as_user_id: "u-pe-01"
              captures: { m1: $.data.id }
            - call: "POST /clm/machine-models/${m1}/certification-dossiers"
              payload: { measured_water_gal_per_cwt: 1.05, measured_kwh_per_cwt: 0.40, test_cycle_count: 120 }
              as: ComplianceOfficer
              as_user_id: "u-prep-01"
              captures: { d1: $.data.id }
            - call: "POST /clm/certification-dossiers/${d1}/reviews"
              payload: { dimension: "ENERGY", decision: "APPROVE" }
              as: ComplianceOfficer
              as_user_id: "u-rev-e"
          trigger:
            - call: "POST /clm/certification-dossiers/${d1}/reviews"
              payload: { dimension: "WATER", decision: "APPROVE" }
              as: ComplianceOfficer
              as_user_id: "u-rev-w"
          assert:
            - "the trigger returns HTTP 200 and CertificationDossier.${d1}.dossier_state == CERTIFIED"
            - "CertificationDossier.${d1}.certified_at == 2026-08-01T00:00:00Z"
            - "CertificationDossier.${d1}.qualified_program_codes == [UTIL-A-BIG, UTIL-B-RICH] (every qualifier, sorted by code)"
            - "CertificationDossier.${d1}.rebate_amount_cents == 70000"
            - "MachineModel.${m1}.rebate_program_codes == [UTIL-A-BIG, UTIL-B-RICH]"
            - "MachineModel.${m1}.rebate_amount_cents == 70000 (NOT 90000 and NOT 170000)"
            - "MachineModel.${m1}.certification_state == CERTIFIED"

      - name: part_stock_projection_low_boundary_is_inclusive
        claim_type: projection
        grounds:
          - calculations.part_stock_projection
          - entities.ServicePart.fields.stock_state
          - endpoints[POST /clm/service-parts/{id}/stock-adjustments]
        distinguishing_aspect: "Walking on_hand_qty 0 -> 3 -> 2 -> 0 pins all three projected states in one chain, and the LOW boundary is inclusive: on_hand_qty exactly equal to reorder_point_qty 2 is LOW, not IN_STOCK."
        test_recipe:
          setup: ["ServicePart BRG-2040 with reorder_point_qty 2 and no stock"]
          setup_api_calls:
            - call: "POST /clm/service-parts"
              payload: { part_number: "BRG-2040", component_class: "BEARING", fits_product_lines: ["ON_PREMISES", "VENDED"], fits_min_capacity_lb: 20, fits_max_capacity_lb: 80, rated_duty_cycles: 30000, warranty_months: 36, unit_price_cents: 42000, requires_cert_scope: "DIAGNOSTICS_TOOL", reorder_point_qty: 2 }
              as: ProductEngineer
              as_user_id: "u-pe-01"
              captures: { p1: $.data.id }
          trigger:
            - call: "POST /clm/service-parts/${p1}/stock-adjustments"
              payload: { delta_qty: 3, reason: "RECEIPT" }
              as: PlantManager
              as_user_id: "u-pm-01"
            - call: "POST /clm/service-parts/${p1}/stock-adjustments"
              payload: { delta_qty: -1, reason: "CYCLE_COUNT" }
              as: PlantManager
              as_user_id: "u-pm-01"
            - call: "POST /clm/service-parts/${p1}/stock-adjustments"
              payload: { delta_qty: -2, reason: "CYCLE_COUNT" }
              as: PlantManager
              as_user_id: "u-pm-01"
              captures: { v3: $.data.version }
          assert:
            - "before the trigger ServicePart.${p1}.on_hand_qty == 0 and stock_state == BACKORDERED"
            - "after the first trigger call on_hand_qty == 3 and stock_state == IN_STOCK"
            - "after the second trigger call on_hand_qty == 2 and stock_state == LOW (2 <= reorder_point_qty 2)"
            - "after the third trigger call on_hand_qty == 0 and stock_state == BACKORDERED"
            - "ServicePart.${p1}.reserved_qty == 0 throughout (adjustments never touch reservations)"
            - "${v3} == 4"

