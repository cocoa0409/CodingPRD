      - name: core_credit_face_value_versus_graded_settlement
        claim_type: variant_divergence
        excluded_because:
          difficulty_instance: "dual_variant_calc / core_credit_provisional_hold_vs_final_settlement_diverge"
          rationale: |
            That §1.8 instance already runs both variants of
            core_return_credit_settlement over one order and pins the divergence
            between the ungraded provisional hold and the condition-graded,
            lateness-decayed final figure.

      - name: core_settlement_reconciles_the_provisional_hold_into_the_ledger
        claim_type: reconciliation
        excluded_because:
          difficulty_instance: "dual_variant_calc / core_credit_provisional_hold_vs_final_settlement_diverge"
          rationale: |
            The provisional -> final switch and the resulting split of the face
            value across core_credit_settled_cents and core_credit_forfeited_cents
            are asserted in that same instance, so a separate reconciliation recipe
            would only restate it.

      - name: provider_score_variant_selection_by_endpoint_parameter
        claim_type: variant_selection
        excluded_because:
          difficulty_instance: "dual_variant_calc / provider_compliance_score_rolling_attested_vs_live_recompute_split_bands"
          rationale: |
            Variant selection for provider_compliance_score (default rolling
            attested figure versus variant=LIVE_RECOMPUTE) and the resulting band
            split are the whole point of that §1.8 instance.

      - name: safety_stock_tier_is_read_from_the_unpadded_projection
        claim_type: threshold
        excluded_because:
          difficulty_instance: "combinatorial_formula / demand_forecast_pins_safety_stock_tier_to_prepad_projection"
          rationale: |
            The tier-selection threshold of long_tail_demand_forecast, including
            the trap of re-tiering the padded figure, is pinned there with the
            586-versus-545 discrimination.

      - name: forecast_ignores_orders_outside_the_trailing_window
        claim_type: input_set_filtering
        excluded_because:
          difficulty_instance: "boundary_precision_check / demand_forecast_empty_trailing_window_yields_zero_recommended_stock"
          rationale: |
            The half-open trailing-window filter and its degenerate all-zero result
            are covered by that §1.8 boundary instance.

      - name: volume_multiplier_boundary_at_ten_units
        claim_type: tiered_pricing
        excluded_because:
          difficulty_instance: "boundary_precision_check / volume_discount_tier_applies_at_exactly_ten_units"
          rationale: |
            The >= 10 volume-tier boundary of parts_order_pricing is tested at 9,
            10 and 11 units there.

      - name: line_totals_are_rounded_once_each_before_the_subtotal
        claim_type: precision
        excluded_because:
          difficulty_instance: "combinatorial_formula / order_pricing_rounds_each_line_once_before_summing_subtotal"
          rationale: |
            The single-rounding-per-line rule and the wrong alternatives (rounding
            the unit first, or summing unrounded values) are discriminated there
            across two lines.

      - name: core_liability_identity_survives_a_cancellation
        claim_type: aggregation
        excluded_because:
          difficulty_instance: "compensating_invariant / order_cancellation_restores_the_core_liability_ledger_identity"
          rationale: |
            calculations.core_liability_conservation is asserted before and after a
            cancel in that instance, including the symmetric decrement of
            core_face_value_committed_cents.

      - name: training_credit_identity_survives_a_void
        claim_type: aggregation
        excluded_because:
          difficulty_instance: "compensating_invariant / certification_void_restores_the_provider_training_credit_identity"
          rationale: |
            calculations.training_credit_conservation across a certification void
            (balance restored, credits_consumed zeroed) is exactly that instance.

  # ---------------------------------------------------------------------------
  # 4. VALIDATIONS  (globally ordered rules of §1.4)
  # ---------------------------------------------------------------------------
  - section: validations
    instances:
      - name: authorization_layer_returns_forbidden_role_before_invalid_request
        claim_type: priority_ordering
        grounds:
          - validations[priority=5]
          - validations[priority=6]
          - validations[priority=8]
          - validations[priority=10]
        distinguishing_aspect: |
          The same malformed part-catalog POST yields four different codes
          depending only on which header layer is broken, proving the global order
          5 < 6 < 8 < 10 rather than a per-request "worst error wins" heuristic.
        test_recipe:
          setup:
            - "No domain data is required; a single RegionalComplianceProfile exists so the fixture is non-empty."
          setup_api_calls:
            - call: "POST /repair-program/compliance-profiles"
              payload: { region_code: "US-CA", min_parts_availability_years: 7, min_documentation_years: 7, requires_public_manual: false, max_documentation_fee_cents: 2000, allows_pairing_restriction: true, self_service_mandate_tier: "MANDATE_FULL" }
              as: ProgramAdmin
              as_user_id: "u_admin_1"
          trigger:
            - call: "POST /repair-program/part-catalog-items"
              payload: { part_class: "COMPONENT" }
              as: "Auditor (an unrecognised X-Role value)"
              as_user_id: "u_admin_1"
              captures: { e1: $.data.error_id }
            - call: "POST /repair-program/part-catalog-items"
              payload: { part_class: "COMPONENT" }
              as: SelfRepairCustomer
              captures: { e2: $.data.error_id }
            - call: "POST /repair-program/part-catalog-items"
              payload: { part_class: "COMPONENT" }
              as: SelfRepairCustomer
              as_user_id: "u_cust_1"
              captures: { e3: $.data.error_id }
            - call: "POST /repair-program/part-catalog-items"
              payload: { sku: "SKU-V01-A", part_class: "COMPONENT", safety_class: "UNRESTRICTED", list_price_cents: 1000, core_return_required: false, unit_price_cents: 10 }
              as: ProgramAdmin
              as_user_id: "u_admin_1"
              captures: { e4: $.data.error_id }
          assert:
            - "${e1} == ERR_UNAUTHORIZED with HTTP 401 — the unknown role is caught at priority 5 even though the body is also malformed"
            - "${e2} == ERR_MISSING_USER_ID with HTTP 400 — priority 6 beats the role check at 8"
            - "${e3} == ERR_FORBIDDEN_ROLE with HTTP 403 — priority 8 beats the structural check at 10"
            - "${e3} != ERR_INVALID_REQUEST"
            - "${e4} == ERR_INVALID_REQUEST with HTTP 400 — the unknown field unit_price_cents (a computed field of PartCatalogItem) is rejected, not silently dropped"
            - "no PartCatalogItem row exists after the four calls"

      - name: assessment_with_two_broken_references_returns_model_not_found_before_region_profile
        claim_type: cross_entity
        grounds:
          - validations[priority=20]
          - validations[priority=22]
          - endpoints[POST /repair-program/eligibility-assessments]
        distinguishing_aspect: |
          Reference resolution is itself ordered: the generic entity lookups at
          priority 20 run left to right (model before part) and both precede the
          region-profile lookup at 22, so a request with every reference broken
          reports ERR_MODEL_NOT_FOUND.
        test_recipe:
          setup:
            - "Profile US-CA; model CRX-V02 (TIER_A); part SKU-V02-A in DRAFT — publication state is irrelevant because all three calls fail before the eligibility calculation runs."
          setup_api_calls:
            - call: "POST /repair-program/compliance-profiles"
              payload: { region_code: "US-CA", min_parts_availability_years: 7, min_documentation_years: 7, requires_public_manual: false, max_documentation_fee_cents: 2000, allows_pairing_restriction: true, self_service_mandate_tier: "MANDATE_FULL" }
              as: ProgramAdmin
              as_user_id: "u_admin_1"
            - call: "POST /repair-program/product-models"
              payload: { model_code: "CRX-V02", product_family: "CRX", market_release_date: "2024-01-01T00:00:00Z", repairability_tier: "TIER_A_SELF_SERVICE" }
              as: ProgramAdmin
              as_user_id: "u_admin_1"
              captures: { model_id: $.data.id }
            - call: "POST /repair-program/part-catalog-items"
              payload: { sku: "SKU-V02-A", part_class: "COMPONENT", safety_class: "UNRESTRICTED", list_price_cents: 1000, core_return_required: false }
              as: ProgramAdmin
              as_user_id: "u_admin_1"
              captures: { part_id: $.data.id }
          trigger:
            - call: "POST /repair-program/eligibility-assessments"
              payload: { model_id: "11111111-1111-4111-8111-111111111111", part_id: "22222222-2222-4222-8222-222222222222", region_code: "US-ZZ", requester_class: "SELF_REPAIR_CONSUMER" }
              as: SelfRepairCustomer
              as_user_id: "u_cust_1"
              captures: { e1: $.data.error_id }
            - call: "POST /repair-program/eligibility-assessments"
              payload: { model_id: "${model_id}", part_id: "22222222-2222-4222-8222-222222222222", region_code: "US-ZZ", requester_class: "SELF_REPAIR_CONSUMER" }
              as: SelfRepairCustomer
              as_user_id: "u_cust_1"
              captures: { e2: $.data.error_id }
            - call: "POST /repair-program/eligibility-assessments"
              payload: { model_id: "${model_id}", part_id: "${part_id}", region_code: "US-ZZ", requester_class: "SELF_REPAIR_CONSUMER" }
              as: SelfRepairCustomer
              as_user_id: "u_cust_1"
              captures: { e3: $.data.error_id }
          assert:
            - "${e1} == ERR_MODEL_NOT_FOUND with HTTP 404"
            - "${e2} == ERR_PART_NOT_FOUND with HTTP 404"
            - "${e3} == ERR_REGION_PROFILE_NOT_FOUND with HTTP 404 — reached only once both entity references resolve"
            - "${e3} != ERR_INVALID_REQUEST — an unknown region_code is a referential failure, not a structural one"
            - "no EligibilityAssessment row exists after the three calls"

