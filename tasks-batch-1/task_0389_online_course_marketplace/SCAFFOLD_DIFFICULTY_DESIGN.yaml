# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Online Course Marketplace — 9 rules x 2 instances = 18 instances.
# Every grounds[] resolves to SCAFFOLD.yaml §1.1–§1.7. Every setup_api_calls /
# trigger call resolves to a §1.5 endpoint; every ${var} is bound by an earlier
# captures: block. Formula-derived asserts are pre-computed literals.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: pricing_single_vs_bundle_allocation_diverge
        grounds:
          - calculations.enrollment_pricing
          - entities.Enrollment.fields.gross_price_cents
          - entities.Enrollment.fields.instructor_share_cents
        distinguishing_aspect: |
          Same three member courses (list prices 5000/3000/2000) priced as a flat 7333c
          bundle allocate to gross 3666/2200/1467 (largest-remainder), whereas enrolling
          each course at list price would charge 5000/3000/2000 — the bundle variant and
          the single-course variant produce different per-course gross for identical
          inputs on the Enrollment monetary domain.
        test_recipe:
          setup:
            - "Instructor revenue_share_pct=0.50; three PUBLISHED courses C1=5000c, C2=3000c, C3=2000c each with one published lesson; one bundle over {C1,C2,C3} priced 7333c; one learner."
          setup_api_calls:
            - call: "POST /instructors"
              payload: { display_name: "Inst A", email: "insta@x.com", revenue_share_pct: 0.50 }
              as: Anonymous
              captures: { inst_id: $.data.id }
            - call: "POST /learners"
              payload: { full_name: "Lee", email: "lee@x.com" }
              as: Anonymous
              captures: { learner_id: $.data.id }
            - call: "POST /courses"
              payload: { instructor_id: "${inst_id}", title: "C1", list_price_cents: 5000 }
              as: Instructor
              as_user_id: "${inst_id}"
              captures: { c1_id: $.data.id }
            - call: "POST /lessons"
              payload: { course_id: "${c1_id}", title: "L1", order_index: 1 }
              as: Instructor
              as_user_id: "${inst_id}"
            - call: "POST /courses/${c1_id}/publish"
              payload: {}
              as: Instructor
              as_user_id: "${inst_id}"
            - call: "POST /courses"
              payload: { instructor_id: "${inst_id}", title: "C2", list_price_cents: 3000 }
              as: Instructor
              as_user_id: "${inst_id}"
              captures: { c2_id: $.data.id }
            - call: "POST /lessons"
              payload: { course_id: "${c2_id}", title: "L1", order_index: 1 }
              as: Instructor
              as_user_id: "${inst_id}"
            - call: "POST /courses/${c2_id}/publish"
              payload: {}
              as: Instructor
              as_user_id: "${inst_id}"
            - call: "POST /courses"
              payload: { instructor_id: "${inst_id}", title: "C3", list_price_cents: 2000 }
              as: Instructor
              as_user_id: "${inst_id}"
              captures: { c3_id: $.data.id }
            - call: "POST /lessons"
              payload: { course_id: "${c3_id}", title: "L1", order_index: 1 }
              as: Instructor
              as_user_id: "${inst_id}"
            - call: "POST /courses/${c3_id}/publish"
              payload: {}
              as: Instructor
              as_user_id: "${inst_id}"
            - call: "POST /bundles"
              payload: { instructor_id: "${inst_id}", title: "Trio", course_ids: ["${c1_id}", "${c2_id}", "${c3_id}"], bundle_price_cents: 7333, promo_starts_at: "2026-01-01T00:00:00Z", promo_ends_at: "2026-12-31T00:00:00Z" }
              as: Instructor
              as_user_id: "${inst_id}"
              captures: { bundle_id: $.data.id, bundle_v: $.data.version }
          trigger:
            - call: "POST /bundles/${bundle_id}/enroll"
              payload: { learner_id: "${learner_id}", expected_bundle_version: "${bundle_v}" }
              as: Learner
              as_user_id: "${learner_id}"
              captures: { enr0: "$.data[0].gross_price_cents", enr1: "$.data[1].gross_price_cents", enr2: "$.data[2].gross_price_cents" }
          assert:
            - "response data is an array of 3 Enrollment objects"
            - "the three gross_price_cents values are exactly {3666, 2200, 1467} and sum to 7333 (bundle_allocation variant)"
            - "the C1 member Enrollment.gross_price_cents == 3666, NOT 5000 (single_course list price)"
            - "the C1 member Enrollment.instructor_share_cents == 1833"

      - name: course_score_weighted_vs_simple_average_diverge
        grounds:
          - calculations.course_weighted_score
          - entities.Enrollment.fields.weighted_score_pct
          - entities.Certificate.fields.final_score_pct
        distinguishing_aspect: |
          With graded lessons L1(weight3,score0.9), L2(weight1,score0.6), L3(weight1,score1.0)
          the weighted_gate gives 0.86 while the simple_average_transcript gives 0.8333 for
          the identical completion data — divergent academic-score variant, a different
          entity domain (course/enrollment scoring) from the pricing dual-variant.
        test_recipe:
          setup:
            - "PUBLISHED course passing_score_pct=0.70, completion_threshold_pct=1.00, with three graded published lessons L1(weight3,q10), L2(weight1,q10), L3(weight1,q5); learner ACTIVE-enrolled."
          setup_api_calls:
            - call: "POST /instructors"
              payload: { display_name: "Inst B", email: "instb@x.com", revenue_share_pct: 0.50 }
              as: Anonymous
              captures: { inst_id: $.data.id }
            - call: "POST /learners"
              payload: { full_name: "Mara", email: "mara@x.com" }
              as: Anonymous
              captures: { learner_id: $.data.id }
            - call: "POST /courses"
              payload: { instructor_id: "${inst_id}", title: "Graded", list_price_cents: 0, passing_score_pct: 0.70, completion_threshold_pct: 1.00 }
              as: Instructor
              as_user_id: "${inst_id}"
              captures: { course_id: $.data.id }
            - call: "POST /lessons"
              payload: { course_id: "${course_id}", title: "L1", order_index: 1, is_graded: true, quiz_weight: 3, question_count: 10 }
              as: Instructor
              as_user_id: "${inst_id}"
              captures: { l1_id: $.data.id }
            - call: "POST /lessons"
              payload: { course_id: "${course_id}", title: "L2", order_index: 2, is_graded: true, quiz_weight: 1, question_count: 10 }
              as: Instructor
              as_user_id: "${inst_id}"
              captures: { l2_id: $.data.id }
            - call: "POST /lessons"
              payload: { course_id: "${course_id}", title: "L3", order_index: 3, is_graded: true, quiz_weight: 1, question_count: 5 }
              as: Instructor
              as_user_id: "${inst_id}"
              captures: { l3_id: $.data.id }
            - call: "POST /courses/${course_id}/publish"
              payload: {}
              as: Instructor
              as_user_id: "${inst_id}"
            - call: "POST /courses/${course_id}/enroll"
              payload: { learner_id: "${learner_id}" }
              as: Learner
              as_user_id: "${learner_id}"
              captures: { enr_id: $.data.id }
            - call: "POST /lesson-completions"
              payload: { enrollment_id: "${enr_id}", lesson_id: "${l1_id}", correct_answers: 9 }
              as: Learner
              as_user_id: "${learner_id}"
            - call: "POST /lesson-completions"
              payload: { enrollment_id: "${enr_id}", lesson_id: "${l2_id}", correct_answers: 6 }
              as: Learner
              as_user_id: "${learner_id}"
            - call: "POST /lesson-completions"
              payload: { enrollment_id: "${enr_id}", lesson_id: "${l3_id}", correct_answers: 5 }
              as: Learner
              as_user_id: "${learner_id}"
          trigger:
            - call: "GET /enrollments/${enr_id}/certificate"
              payload: {}
              as: Learner
              as_user_id: "${learner_id}"
              captures: { cert_score: "$.data[0].final_score_pct" }
          assert:
            - "Enrollment.${enr_id}.weighted_score_pct == 0.86 (weighted_gate: (0.9*3 + 0.6*1 + 1.0*1)/5)"
            - "Certificate.final_score_pct snapshots Enrollment.weighted_score_pct == 0.86"
            - "the simple_average_transcript of completed graded lessons (0.9+0.6+1.0)/3 == 0.8333 differs from the weighted 0.86"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: single_course_coupon_branch_minmax_round_mode_a
        grounds:
          - calculations.enrollment_pricing
          - validations[priority=11]
          - entities.Enrollment.fields.gross_price_cents
        distinguishing_aspect: |
          Mode (a): gross depends on >=3 inputs (list_price, discount_type, discount_value)
          with a conditional branch on discount_type and nested min/max and a round —
          PERCENT path rounds base*value/100 (round_half_up) while FLAT path takes
          min(value, base); non-linear interaction of inputs.
        test_recipe:
          setup:
            - "PUBLISHED course list_price 10000c by an instructor with revenue_share_pct 0.50; an ACTIVE PERCENT coupon discount_value=25 for that course; a learner."
          setup_api_calls:
            - call: "POST /instructors"
              payload: { display_name: "Inst C", email: "instc@x.com", revenue_share_pct: 0.50 }
              as: Anonymous
              captures: { inst_id: $.data.id }
            - call: "POST /learners"
              payload: { full_name: "Nik", email: "nik@x.com" }
              as: Anonymous
              captures: { learner_id: $.data.id }
            - call: "POST /courses"
              payload: { instructor_id: "${inst_id}", title: "Priced", list_price_cents: 10000 }
              as: Instructor
              as_user_id: "${inst_id}"
              captures: { course_id: $.data.id }
            - call: "POST /lessons"
              payload: { course_id: "${course_id}", title: "L1", order_index: 1 }
              as: Instructor
              as_user_id: "${inst_id}"
            - call: "POST /courses/${course_id}/publish"
              payload: {}
              as: Instructor
              as_user_id: "${inst_id}"
            - call: "POST /coupons"
              payload: { instructor_id: "${inst_id}", course_id: "${course_id}", code: "SAVE25", discount_type: "PERCENT", discount_value: 25, max_redemptions: 100, valid_from: "2026-01-01T00:00:00Z", valid_until: "2027-01-01T00:00:00Z" }
              as: Instructor
              as_user_id: "${inst_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /courses/${course_id}/enroll"
              payload: { learner_id: "${learner_id}", coupon_code: "SAVE25" }
              as: Learner
              as_user_id: "${learner_id}"
              captures: { enr_id: $.data.id }
          assert:
            - "Enrollment.${enr_id}.gross_price_cents == 7500 (10000 - round_half_up(10000*25/100)=2500)"
            - "Enrollment.${enr_id}.instructor_share_cents == 3750 (round_half_up(7500*0.50))"
            - "Enrollment.${enr_id}.platform_fee_cents == 3750"

      - name: bundle_largest_remainder_round_then_distribute_mode_b
        grounds:
          - calculations.enrollment_pricing
          - entities.Bundle.fields.bundle_price_cents
          - entities.Enrollment.fields.gross_price_cents
        distinguishing_aspect: |
          Mode (b): nested rounding where order matters. Flooring each raw share THEN
          distributing the leftover cents to the largest fractional parts yields
          {3666,2200,1467}; naive per-share round_half_up would give {3667,2200,1467}
          summing to 7334 != 7333. The scaffold pins floor-then-distribute order.
        test_recipe:
          setup:
            - "Three PUBLISHED courses list 5000/3000/2000; bundle priced 7333c over all three (raw shares 3666.5/2199.9/1466.6); learner."
          setup_api_calls:
            - call: "POST /instructors"
              payload: { display_name: "Inst D", email: "instd@x.com", revenue_share_pct: 0.50 }
              as: Anonymous
              captures: { inst_id: $.data.id }
            - call: "POST /learners"
              payload: { full_name: "Ola", email: "ola@x.com" }
              as: Anonymous
              captures: { learner_id: $.data.id }
            - call: "POST /courses"
              payload: { instructor_id: "${inst_id}", title: "B1", list_price_cents: 5000 }
              as: Instructor
              as_user_id: "${inst_id}"
              captures: { c1_id: $.data.id }
            - call: "POST /lessons"
              payload: { course_id: "${c1_id}", title: "L1", order_index: 1 }
              as: Instructor
              as_user_id: "${inst_id}"
            - call: "POST /courses/${c1_id}/publish"
              payload: {}
              as: Instructor
              as_user_id: "${inst_id}"
            - call: "POST /courses"
              payload: { instructor_id: "${inst_id}", title: "B2", list_price_cents: 3000 }
              as: Instructor
              as_user_id: "${inst_id}"
              captures: { c2_id: $.data.id }
            - call: "POST /lessons"
              payload: { course_id: "${c2_id}", title: "L1", order_index: 1 }
              as: Instructor
              as_user_id: "${inst_id}"
            - call: "POST /courses/${c2_id}/publish"
              payload: {}
              as: Instructor
              as_user_id: "${inst_id}"
            - call: "POST /courses"
              payload: { instructor_id: "${inst_id}", title: "B3", list_price_cents: 2000 }
              as: Instructor
              as_user_id: "${inst_id}"
              captures: { c3_id: $.data.id }
            - call: "POST /lessons"
              payload: { course_id: "${c3_id}", title: "L1", order_index: 1 }
              as: Instructor
              as_user_id: "${inst_id}"
            - call: "POST /courses/${c3_id}/publish"
              payload: {}
              as: Instructor
              as_user_id: "${inst_id}"
            - call: "POST /bundles"
              payload: { instructor_id: "${inst_id}", title: "RemTrio", course_ids: ["${c1_id}", "${c2_id}", "${c3_id}"], bundle_price_cents: 7333, promo_starts_at: "2026-01-01T00:00:00Z", promo_ends_at: "2026-12-31T00:00:00Z" }
              as: Instructor
              as_user_id: "${inst_id}"
              captures: { bundle_id: $.data.id, bundle_v: $.data.version }
          trigger:
            - call: "POST /bundles/${bundle_id}/enroll"
              payload: { learner_id: "${learner_id}", expected_bundle_version: "${bundle_v}" }
              as: Learner
              as_user_id: "${learner_id}"
              captures: { g0: "$.data[0].gross_price_cents" }
          assert:
            - "the C1 member gross_price_cents == 3666 (floor of 3666.5, did NOT receive a remainder cent)"
            - "the C2 member gross_price_cents == 2200 (floor 2199 + 1 remainder; frac 0.9 largest)"
            - "the C3 member gross_price_cents == 1467 (floor 1466 + 1 remainder; frac 0.6 second-largest)"
            - "the three gross values sum to exactly 7333 == bundle_price_cents"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: enrollment_branch_fork_completed_vs_refunded
        grounds:
          - state_machines.Enrollment.ACTIVE_to_COMPLETED
          - state_machines.Enrollment.ACTIVE_to_REFUNDED
          - state_machines.Enrollment.ACTIVE_to_EXPIRED
        distinguishing_aspect: |
          Enrollment ACTIVE forks to three divergent terminal branches with different
          side-effect sets: COMPLETED issues a Certificate + awards CEU; REFUNDED credits
          wallet + claws back revenue; EXPIRED flips ledger PENDING->AVAILABLE. Branching
          fork-join shape on the Enrollment entity.
        test_recipe:
          setup:
            - "Two ACTIVE enrollments of the same learner: E_done in a single-lesson non-graded PUBLISHED course (completion_threshold 1.00), E_ref in another single-lesson PUBLISHED course (refund_window 30 days), clock at 2026-06-01."
          setup_api_calls:
            - call: "POST /instructors"
              payload: { display_name: "Inst E", email: "inste@x.com", revenue_share_pct: 0.50 }
              as: Anonymous
              captures: { inst_id: $.data.id }
            - call: "POST /learners"
              payload: { full_name: "Pim", email: "pim@x.com" }
              as: Anonymous
              captures: { learner_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /courses"
              payload: { instructor_id: "${inst_id}", title: "Done", list_price_cents: 1000, completion_threshold_pct: 1.00 }
              as: Instructor
              as_user_id: "${inst_id}"
              captures: { cdone_id: $.data.id }
            - call: "POST /lessons"
              payload: { course_id: "${cdone_id}", title: "L1", order_index: 1 }
              as: Instructor
              as_user_id: "${inst_id}"
              captures: { ld_id: $.data.id }
            - call: "POST /courses/${cdone_id}/publish"
              payload: {}
              as: Instructor
              as_user_id: "${inst_id}"
            - call: "POST /courses/${cdone_id}/enroll"
              payload: { learner_id: "${learner_id}" }
              as: Learner
              as_user_id: "${learner_id}"
              captures: { edone_id: $.data.id }
            - call: "POST /courses"
              payload: { instructor_id: "${inst_id}", title: "RefTarget", list_price_cents: 4000, refund_window_days: 30 }
              as: Instructor
              as_user_id: "${inst_id}"
              captures: { cref_id: $.data.id }
            - call: "POST /lessons"
              payload: { course_id: "${cref_id}", title: "L1", order_index: 1 }
              as: Instructor
              as_user_id: "${inst_id}"
            - call: "POST /courses/${cref_id}/publish"
              payload: {}
              as: Instructor
              as_user_id: "${inst_id}"
            - call: "POST /courses/${cref_id}/enroll"
              payload: { learner_id: "${learner_id}" }
              as: Learner
              as_user_id: "${learner_id}"
              captures: { eref_id: $.data.id }
          trigger:
            - call: "POST /lesson-completions"
              payload: { enrollment_id: "${edone_id}", lesson_id: "${ld_id}" }
              as: Learner
              as_user_id: "${learner_id}"
            - call: "POST /enrollments/${eref_id}/refund"
              payload: {}
              as: Learner
              as_user_id: "${learner_id}"
          assert:
            - "Enrollment.${edone_id}.status == COMPLETED with a Certificate child issued"
            - "Enrollment.${eref_id}.status == REFUNDED with Learner.wallet_credit_cents == 4000"
            - "the COMPLETED branch did NOT credit the wallet; the REFUNDED branch did NOT issue a certificate"

      - name: coupon_cycle_active_exhausted_active
        grounds:
          - state_machines.Coupon.ACTIVE_to_EXHAUSTED
          - state_machines.Coupon.EXHAUSTED_to_ACTIVE
          - entities.Coupon.fields.redeemed_count
        distinguishing_aspect: |
          Coupon has a true cycle ACTIVE->EXHAUSTED->ACTIVE: a redemption that hits
          max_redemptions=1 exhausts it, and refunding that enrollment returns it to
          ACTIVE. Cyclic shape on the Coupon entity, distinct from the Enrollment branch.
        test_recipe:
          setup:
            - "PUBLISHED course; ACTIVE coupon max_redemptions=1; clock 2026-06-01; learner enrolls redeeming the coupon (-> EXHAUSTED)."
          setup_api_calls:
            - call: "POST /instructors"
              payload: { display_name: "Inst F", email: "instf@x.com", revenue_share_pct: 0.50 }
              as: Anonymous
              captures: { inst_id: $.data.id }
            - call: "POST /learners"
              payload: { full_name: "Quin", email: "quin@x.com" }
              as: Anonymous
              captures: { learner_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /courses"
              payload: { instructor_id: "${inst_id}", title: "Cyc", list_price_cents: 5000, refund_window_days: 30 }
              as: Instructor
              as_user_id: "${inst_id}"
              captures: { course_id: $.data.id }
            - call: "POST /lessons"
              payload: { course_id: "${course_id}", title: "L1", order_index: 1 }
              as: Instructor
              as_user_id: "${inst_id}"
            - call: "POST /courses/${course_id}/publish"
              payload: {}
              as: Instructor
              as_user_id: "${inst_id}"
            - call: "POST /coupons"
              payload: { instructor_id: "${inst_id}", course_id: "${course_id}", code: "ONE", discount_type: "FLAT", discount_value: 1000, max_redemptions: 1, valid_from: "2026-01-01T00:00:00Z", valid_until: "2027-01-01T00:00:00Z" }
              as: Instructor
              as_user_id: "${inst_id}"
              captures: { coupon_id: $.data.id }
            - call: "POST /courses/${course_id}/enroll"
              payload: { learner_id: "${learner_id}", coupon_code: "ONE" }
              as: Learner
              as_user_id: "${learner_id}"
              captures: { enr_id: $.data.id }
          trigger:
            - call: "POST /enrollments/${enr_id}/refund"
              payload: {}
              as: Learner
              as_user_id: "${learner_id}"
            - call: "GET /coupons/${coupon_id}"
              payload: {}
              as: Instructor
              as_user_id: "${inst_id}"
              captures: { coupon_status: $.data.status, coupon_redeemed: $.data.redeemed_count }
          assert:
            - "after enroll the coupon was EXHAUSTED with redeemed_count == 1"
            - "after refund Coupon.${coupon_id}.status == ACTIVE again (EXHAUSTED->ACTIVE)"
            - "after refund Coupon.${coupon_id}.redeemed_count == 0"

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: refund_cascade_clawback_to_ledger_to_balances_depth3
        grounds:
          - state_machines.Enrollment.ACTIVE_to_REFUNDED
          - entities.RevenueLedgerEntry.fields.status
          - entities.Instructor.fields.lifetime_earned_cents
          - calculations.instructor_balances
        distinguishing_aspect: |
          Depth-3 transitive chain from POST /refund: (A) Enrollment ACTIVE->REFUNDED
          causes (B) the SALE ledger entry to flip PENDING->CLAWED_BACK, and B's new
          ledger state causes (C) instructor_balances to recompute pending_balance to 0
          and lifetime_earned to 0. Each hop is caused by the previous, not by the action.
        test_recipe:
          setup:
            - "Instructor revenue_share_pct=0.50; PUBLISHED course list 4000c; learner ACTIVE-enrolled (instructor_share 2000c written PENDING); clock 2026-06-01 inside refund window."
          setup_api_calls:
            - call: "POST /instructors"
              payload: { display_name: "Inst G", email: "instg@x.com", revenue_share_pct: 0.50 }
              as: Anonymous
              captures: { inst_id: $.data.id }
            - call: "POST /learners"
              payload: { full_name: "Rae", email: "rae@x.com" }
              as: Anonymous
              captures: { learner_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /courses"
              payload: { instructor_id: "${inst_id}", title: "Claw", list_price_cents: 4000, refund_window_days: 30 }
              as: Instructor
              as_user_id: "${inst_id}"
              captures: { course_id: $.data.id }
            - call: "POST /lessons"
              payload: { course_id: "${course_id}", title: "L1", order_index: 1 }
              as: Instructor
              as_user_id: "${inst_id}"
            - call: "POST /courses/${course_id}/publish"
              payload: {}
              as: Instructor
              as_user_id: "${inst_id}"
            - call: "POST /courses/${course_id}/enroll"
              payload: { learner_id: "${learner_id}" }
              as: Learner
              as_user_id: "${learner_id}"
