# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# task_3076_mortgage_backed_security_pooling_issuer_approval
# =============================================================================
scaffold_corner_design:

  - section: entities
    instances:
      - name: application_create_returns_defaults_and_computed_requirement
        claim_type: Creation
        grounds:
          - entities.IssuerApplication
          - endpoints.POST_/issuer-applications
        distinguishing_aspect: "Creating an application with the required fields returns 201 with status DRAFT, version 1, system id/created_at/updated_at, unused_credit_lines_cents defaulted to 0, and net_worth_requirement_cents computed server-side."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls: []
          trigger:
            - call: "POST /issuer-applications"
              payload: { legal_name: "Default Check Lending", net_worth_cents: 400000000, liquid_assets_cents: 5000000, origination_experience_months: 36, branch_count: 2, annual_origination_volume_cents: 1000000000 }
              as: ApplicantOfficer
              as_user_id: "officer-dc"
              captures: { app_id: $.data.id }
          assert:
            - "IssuerApplication.${app_id}.status == DRAFT and version == 1"
            - "unused_credit_lines_cents == 0 (default applied when omitted)"
            - "net_worth_requirement_cents == 275000000 (max(250000000 + (2-1)*25000000, floor(1000000000*10/10000)=100000000))"
            - "response carries non-null id, created_at, updated_at and meta.api_request_id"

      - name: pool_get_returns_computed_aggregate_fields
        claim_type: Computed Fields
        grounds:
          - entities.Pool.fields.aggregate_principal_cents
          - entities.Pool.fields.delinquency_rate_bps
          - endpoints.GET_/pools/{id}
        distinguishing_aspect: "A DRAFT pool's computed fields reflect its loans: aggregate_principal_cents == sum of loan principals (2400000), delinquency_rate_bps == 0 with no delinquent loans; client-supplied values for computed fields are ignored on create."
        test_recipe:
          setup:
            - "Issuer ACTIVE; pool DRAFT with two loans of 1200000 cents each."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-03T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /issuer-applications"
              payload: { legal_name: "Computed Fields Lending", net_worth_cents: 900000000, liquid_assets_cents: 3000000, origination_experience_months: 40, branch_count: 1, annual_origination_volume_cents: 3000000000 }
              as: ApplicantOfficer
              as_user_id: "officer-cf"
              captures: { app_id: $.data.id }
            - call: "POST /issuer-applications/${app_id}/submit"
              payload: {}
              as: ApplicantOfficer
              as_user_id: "officer-cf"
            - call: "POST /issuer-applications/${app_id}/review"
              payload: {}
              as: AgencyReviewer
              as_user_id: "reviewer-1"
            - call: "POST /issuer-applications/${app_id}/approve"
              payload: {}
              as: AgencyReviewer
              as_user_id: "reviewer-1"
            - call: "GET /issuer-applications/${app_id}"
              payload: {}
              as: AgencyReviewer
              captures: { iss_id: $.data.approved_issuer_id }
            - call: "GET /issuers/${iss_id}"
              payload: {}
              as: PlatformAdmin
              captures: { iss_v: $.data.version }
            - call: "POST /document-custodians"
              payload: { firm_name: "TrustVault Custody" }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /custodian-engagements"
              payload: { custodian_id: "${cust_id}", issuer_id: "${iss_id}", window_start: "2026-01-01", window_end: "2027-01-01" }
              as: IssuerOfficer
              as_user_id: "${iss_id}"
            - call: "POST /pools"
              payload: { issuer_id: "${iss_id}", custodian_id: "${cust_id}", pool_type: "SINGLE_FAMILY", term_months: 360, note_rate_bps: 700, expected_issuer_version: "${iss_v}" }
              as: IssuerOfficer
              as_user_id: "${iss_id}"
              captures: { pool_id: $.data.id }
            - call: "POST /loans"
              payload: { pool_id: "${pool_id}", principal_balance_cents: 1200000, note_rate_bps: 800, government_insurance: "FHA", escrow_monthly_cents: 20000 }
              as: IssuerOfficer
              as_user_id: "${iss_id}"
            - call: "POST /loans"
              payload: { pool_id: "${pool_id}", principal_balance_cents: 1200000, note_rate_bps: 810, government_insurance: "VA", escrow_monthly_cents: 20000 }
              as: IssuerOfficer
              as_user_id: "${iss_id}"
          trigger:
            - call: "GET /pools/${pool_id}"
              payload: {}
              as: PlatformAdmin
              captures: { agg: $.data.aggregate_principal_cents, rate: $.data.delinquency_rate_bps }
          assert:
            - "Pool.${pool_id}.aggregate_principal_cents == 2400000"
            - "Pool.${pool_id}.delinquency_rate_bps == 0"
            - "Pool.${pool_id}.status == DRAFT (initial state)"

      - name: account_transaction_immutable_no_version_field
        claim_type: Immutability
        grounds:
          - entities.AccountTransaction
        distinguishing_aspect: "AccountTransaction is common_fields:false: it carries id and created_at but no version or updated_at, and no update/delete endpoint exists for it."
        test_recipe:
          setup:
            - "Issuer ACTIVE with P_AND_I account."
          setup_api_calls:
            - call: "POST /issuer-applications"
              payload: { legal_name: "Immutable Ledger Lending", net_worth_cents: 900000000, liquid_assets_cents: 3000000, origination_experience_months: 40, branch_count: 1, annual_origination_volume_cents: 3000000000 }
              as: ApplicantOfficer
              as_user_id: "officer-im"
              captures: { app_id: $.data.id }
            - call: "POST /issuer-applications/${app_id}/submit"
              payload: {}
              as: ApplicantOfficer
              as_user_id: "officer-im"
            - call: "POST /issuer-applications/${app_id}/review"
              payload: {}
              as: AgencyReviewer
              as_user_id: "reviewer-1"
            - call: "POST /issuer-applications/${app_id}/approve"
              payload: {}
              as: AgencyReviewer
              as_user_id: "reviewer-1"
            - call: "GET /issuer-applications/${app_id}"
              payload: {}
              as: AgencyReviewer
              captures: { iss_id: $.data.approved_issuer_id }
            - call: "POST /custodial-accounts"
              payload: { issuer_id: "${iss_id}", account_type: "P_AND_I" }
              as: IssuerOfficer
              as_user_id: "${iss_id}"
              captures: { acct_id: $.data.id }
          trigger:
            - call: "POST /custodial-accounts/${acct_id}/transactions"
              payload: { component: "PRINCIPAL", amount_cents: 5000 }
              as: IssuerOfficer
              as_user_id: "${iss_id}"
              captures: { tx_id: $.data.id }
          assert:
            - "AccountTransaction.${tx_id} has id and created_at but NO version field and NO updated_at field"
            - "AccountTransaction.direction == DEPOSIT (system-set) and component == PRINCIPAL"

      - name: pool_get_not_found_returns_404
        claim_type: Not Found
        grounds:
          - errors[ERR_POOL_NOT_FOUND]
        distinguishing_aspect: "GET /pools/{id} with a well-formed but unknown UUID returns 404 ERR_POOL_NOT_FOUND, not a 400 or empty object."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls: []
          trigger:
            - call: "GET /pools/11111111-2222-3333-4444-555555555555"
              payload: {}
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response status 404 and error_id == ERR_POOL_NOT_FOUND"

      - name: list_endpoint_pagination_envelope
        claim_type: Listing
        grounds:
          - response_envelope
          - endpoints.GET_/issuer-applications
        distinguishing_aspect: "GET /issuer-applications returns response_type array with pagination fields limit/offset/total_count/has_more; defaults limit 10 offset 0."
        test_recipe:
          setup: ["Two applications exist."]
          setup_api_calls:
            - call: "POST /issuer-applications"
              payload: { legal_name: "Page One Lending", net_worth_cents: 400000000, liquid_assets_cents: 5000000, origination_experience_months: 36, branch_count: 1, annual_origination_volume_cents: 1000000000 }
              as: ApplicantOfficer
              as_user_id: "officer-pg1"
            - call: "POST /issuer-applications"
              payload: { legal_name: "Page Two Lending", net_worth_cents: 400000000, liquid_assets_cents: 5000000, origination_experience_months: 36, branch_count: 1, annual_origination_volume_cents: 1000000000 }
              as: ApplicantOfficer
              as_user_id: "officer-pg2"
          trigger:
            - call: "GET /issuer-applications"
              payload: { limit: 1, offset: 0 }
              as: PlatformAdmin
          assert:
            - "response_type == array and data contains exactly 1 application"
            - "pagination block reports limit == 1, offset == 0, total_count == 2, has_more == true"

  - section: state_machines
    instances:
      - name: application_submit_from_submitted_returns_invalid_state
        claim_type: invalid_transition
        grounds:
          - state_machines.IssuerApplication
          - errors[ERR_APPLICATION_INVALID_STATE]
        distinguishing_aspect: "Submitting an already-SUBMITTED application fails with ERR_APPLICATION_INVALID_STATE and no state change occurs."
        test_recipe:
          setup: ["Application SUBMITTED."]
          setup_api_calls:
            - call: "POST /issuer-applications"
              payload: { legal_name: "Twice Submit Lending", net_worth_cents: 400000000, liquid_assets_cents: 5000000, origination_experience_months: 36, branch_count: 1, annual_origination_volume_cents: 1000000000 }
              as: ApplicantOfficer
              as_user_id: "officer-ts"
              captures: { app_id: $.data.id }
            - call: "POST /issuer-applications/${app_id}/submit"
              payload: {}
              as: ApplicantOfficer
              as_user_id: "officer-ts"
          trigger:
            - call: "POST /issuer-applications/${app_id}/submit"
              payload: {}
              as: ApplicantOfficer
              as_user_id: "officer-ts"
              captures: { err: $.data.error_id }
          assert:
            - "second submit returns 409 ERR_APPLICATION_INVALID_STATE"
            - "IssuerApplication.${app_id}.status remains SUBMITTED and version == 2"

      - name: loan_terminal_paid_off_lockdown
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.Loan
          - errors[ERR_LOAN_INVALID_STATE]
        distinguishing_aspect: "From PAID_OFF, every further delinquency-status call is rejected — the terminal state has no outgoing transitions."
        test_recipe:
          setup:
            - "Issuer ACTIVE; pool DRAFT with one loan moved to PAID_OFF."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-03T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /issuer-applications"
              payload: { legal_name: "Terminal Lending", net_worth_cents: 900000000, liquid_assets_cents: 3000000, origination_experience_months: 40, branch_count: 1, annual_origination_volume_cents: 3000000000 }
              as: ApplicantOfficer
              as_user_id: "officer-tl"
              captures: { app_id: $.data.id }
            - call: "POST /issuer-applications/${app_id}/submit"
              payload: {}
              as: ApplicantOfficer
              as_user_id: "officer-tl"
            - call: "POST /issuer-applications/${app_id}/review"
              payload: {}
              as: AgencyReviewer
              as_user_id: "reviewer-1"
            - call: "POST /issuer-applications/${app_id}/approve"
              payload: {}
              as: AgencyReviewer
              as_user_id: "reviewer-1"
            - call: "GET /issuer-applications/${app_id}"
              payload: {}
              as: AgencyReviewer
              captures: { iss_id: $.data.approved_issuer_id }
            - call: "GET /issuers/${iss_id}"
              payload: {}
              as: PlatformAdmin
              captures: { iss_v: $.data.version }
            - call: "POST /document-custodians"
              payload: { firm_name: "TrustVault Custody" }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /custodian-engagements"
              payload: { custodian_id: "${cust_id}", issuer_id: "${iss_id}", window_start: "2026-01-01", window_end: "2027-01-01" }
              as: IssuerOfficer
              as_user_id: "${iss_id}"
            - call: "POST /pools"
              payload: { issuer_id: "${iss_id}", custodian_id: "${cust_id}", pool_type: "SINGLE_FAMILY", term_months: 360, note_rate_bps: 700, expected_issuer_version: "${iss_v}" }
              as: IssuerOfficer
              as_user_id: "${iss_id}"
              captures: { pool_id: $.data.id }
            - call: "POST /loans"
              payload: { pool_id: "${pool_id}", principal_balance_cents: 1200000, note_rate_bps: 800, government_insurance: "FHA", escrow_monthly_cents: 20000 }
              as: IssuerOfficer
              as_user_id: "${iss_id}"
              captures: { loan_id: $.data.id }
            - call: "POST /loans/${loan_id}/delinquency-status"
              payload: { to_status: "PAID_OFF" }
              as: IssuerOfficer
              as_user_id: "${iss_id}"
          trigger:
            - call: "POST /loans/${loan_id}/delinquency-status"
              payload: { to_status: "DELINQ_30" }
              as: IssuerOfficer
              as_user_id: "${iss_id}"
              captures: { err: $.data.error_id }
          assert:
            - "returns 409 ERR_LOAN_INVALID_STATE; Loan.${loan_id}.status remains PAID_OFF"
            - "Pool.${pool_id}.aggregate_principal_cents == 0 (paid-off loan excluded)"

      - name: pool_activate_side_effect_creates_draft_report
        claim_type: side_effect_execution
        grounds:
          - state_machines.Pool.CERTIFIED_to_LIVE
        distinguishing_aspect: "Pool activation's declared side effect creates exactly one InvestorReport in DRAFT for the current clock month with computed scheduled/actual/advance fields."
        test_recipe:
          setup:
            - "Issuer ACTIVE; pool CERTIFIED with one loan 1200000 cents at note 800 bps, pool note 700 bps; clock 2026-09-03."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-03T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /issuer-applications"
              payload: { legal_name: "Side Effect Lending", net_worth_cents: 900000000, liquid_assets_cents: 3000000, origination_experience_months: 40, branch_count: 1, annual_origination_volume_cents: 3000000000 }
              as: ApplicantOfficer
              as_user_id: "officer-se"
              captures: { app_id: $.data.id }
            - call: "POST /issuer-applications/${app_id}/submit"
              payload: {}
              as: ApplicantOfficer
              as_user_id: "officer-se"
            - call: "POST /issuer-applications/${app_id}/review"
              payload: {}
              as: AgencyReviewer
              as_user_id: "reviewer-1"
            - call: "POST /issuer-applications/${app_id}/approve"
              payload: {}
              as: AgencyReviewer
              as_user_id: "reviewer-1"
            - call: "GET /issuer-applications/${app_id}"
              payload: {}
              as: AgencyReviewer
              captures: { iss_id: $.data.approved_issuer_id }
            - call: "GET /issuers/${iss_id}"
              payload: {}
              as: PlatformAdmin
              captures: { iss_v: $.data.version }
            - call: "POST /document-custodians"
              payload: { firm_name: "TrustVault Custody" }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /custodian-engagements"
              payload: { custodian_id: "${cust_id}", issuer_id: "${iss_id}", window_start: "2026-01-01", window_end: "2027-01-01" }
              as: IssuerOfficer
              as_user_id: "${iss_id}"
            - call: "POST /pools"
              payload: { issuer_id: "${iss_id}", custodian_id: "${cust_id}", pool_type: "SINGLE_FAMILY", term_months: 360, note_rate_bps: 700, expected_issuer_version: "${iss_v}" }
              as: IssuerOfficer
              as_user_id: "${iss_id}"
              captures: { pool_id: $.data.id }
            - call: "POST /loans"
              payload: { pool_id: "${pool_id}", principal_balance_cents: 1200000, note_rate_bps: 800, government_insurance: "FHA", escrow_monthly_cents: 20000 }
              as: IssuerOfficer
              as_user_id: "${iss_id}"
            - call: "POST /pools/${pool_id}/assemble"
              payload: {}
              as: IssuerOfficer
              as_user_id: "${iss_id}"
            - call: "POST /pools/${pool_id}/certifications"
              payload: { decision: "CERTIFIED" }
              as: DocumentCustodian
              as_user_id: "${cust_id}"
          trigger:
            - call: "POST /pools/${pool_id}/activate"
              payload: {}
              as: IssuerOfficer
              as_user_id: "${iss_id}"
            - call: "GET /investor-reports"
              payload: { pool_id: "${pool_id}" }
              as: PlatformAdmin
              captures: { rep_id: "$.data[0].id", rep_status: "$.data[0].status", rep_month: "$.data[0].period_month", rep_sched: "$.data[0].scheduled_payment_cents" }
          assert:
            - "Pool.${pool_id}.status == LIVE"
            - "exactly one InvestorReport exists for the pool: period_month == 2026-09, status == DRAFT"
            - "report scheduled_payment_cents == 700 (floor(1200000*700/10000/12)) and actual_collected_cents == 700 (collection_rate 10000 bps), advance_required_cents == 0"

      - name: engagement_end_transition
        claim_type: valid_transition
        grounds:
          - state_machines.CustodianEngagement
        distinguishing_aspect: "Ending an ACTIVE engagement moves it to ENDED; a second end is rejected with ERR_ENGAGEMENT_INVALID_STATE."
        test_recipe:
          setup: ["Issuer ACTIVE; engagement ACTIVE."]
          setup_api_calls:
            - call: "POST /issuer-applications"
              payload: { legal_name: "Engagement Lending", net_worth_cents: 900000000, liquid_assets_cents: 3000000, origination_experience_months: 40, branch_count: 1, annual_origination_volume_cents: 3000000000 }
              as: ApplicantOfficer
              as_user_id: "officer-eng"
              captures: { app_id: $.data.id }
            - call: "POST /issuer-applications/${app_id}/submit"
              payload: {}
              as: ApplicantOfficer
              as_user_id: "officer-eng"
            - call: "POST /issuer-applications/${app_id}/review"
              payload: {}
              as: AgencyReviewer
              as_user_id: "reviewer-1"
            - call: "POST /issuer-applications/${app_id}/approve"
              payload: {}
              as: AgencyReviewer
              as_user_id: "reviewer-1"
            - call: "GET /issuer-applications/${app_id}"
              payload: {}
              as: AgencyReviewer
              captures: { iss_id: $.data.approved_issuer_id }
            - call: "POST /document-custodians"
              payload: { firm_name: "TrustVault Custody" }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /custodian-engagements"
              payload: { custodian_id: "${cust_id}", issuer_id: "${iss_id}", window_start: "2026-01-01", window_end: "2027-01-01" }
              as: IssuerOfficer
              as_user_id: "${iss_id}"
              captures: { eng_id: $.data.id }
          trigger:
            - call: "POST /custodian-engagements/${eng_id}/end"
              payload: {}
              as: IssuerOfficer
              as_user_id: "${iss_id}"
            - call: "POST /custodian-engagements/${eng_id}/end"
              payload: {}
              as: IssuerOfficer
              as_user_id: "${iss_id}"
              captures: { err: $.data.error_id }
          assert:
            - "first end: CustodianEngagement.${eng_id}.status == ENDED"
            - "second end returns 409 ERR_ENGAGEMENT_INVALID_STATE"

  - section: calculations
    instances:
      - name: escrow_split_remainder_to_insurance
        claim_type: correct_result
        grounds:
          - calculations.escrow_split
        distinguishing_aspect: "An odd ESCROW deposit of 1001 cents splits floor(1001*0.6)=600 to tax and 401 to insurance — the pinned remainder-to-insurance rule is observable in tax_split_cents and insurance_split_cents and in the T_AND_I component balances."
        test_recipe:
          setup: ["Issuer ACTIVE with T_AND_I account."]
          setup_api_calls:
            - call: "POST /issuer-applications"
              payload: { legal_name: "Escrow Lending", net_worth_cents: 900000000, liquid_assets_cents: 3000000, origination_experience_months: 40, branch_count: 1, annual_origination_volume_cents: 3000000000 }
              as: ApplicantOfficer
              as_user_id: "officer-esc"
              captures: { app_id: $.data.id }
            - call: "POST /issuer-applications/${app_id}/submit"
              payload: {}
              as: ApplicantOfficer
              as_user_id: "officer-esc"
            - call: "POST /issuer-applications/${app_id}/review"
              payload: {}
              as: AgencyReviewer
              as_user_id: "reviewer-1"
            - call: "POST /issuer-applications/${app_id}/approve"
              payload: {}
              as: AgencyReviewer
              as_user_id: "reviewer-1"
            - call: "GET /issuer-applications/${app_id}"
              payload: {}
              as: AgencyReviewer
              captures: { iss_id: $.data.approved_issuer_id }
            - call: "POST /custodial-accounts"
              payload: { issuer_id: "${iss_id}", account_type: "T_AND_I" }
              as: IssuerOfficer
              as_user_id: "${iss_id}"
              captures: { acct_id: $.data.id }
          trigger:
            - call: "POST /custodial-accounts/${acct_id}/transactions"
              payload: { component: "ESCROW", amount_cents: 1001 }
              as: IssuerOfficer
              as_user_id: "${iss_id}"
              captures: { tx_id: $.data.id, tax_split: $.data.tax_split_cents, ins_split: $.data.insurance_split_cents }
          assert:
            - "AccountTransaction.${tx_id}.tax_split_cents == 600 and insurance_split_cents == 401"
            - "CustodialAccount.${acct_id}.tax_balance_cents == 600, insurance_balance_cents == 401, balance_cents == 1001"

      - name: pool_composition_loan_count_threshold
        claim_type: correct_result
        grounds:
          - calculations.pool_composition_check
        distinguishing_aspect: "SINGLE_FAMILY allows exactly 3 loans: assembling with 3 loans and aggregate >= minimum succeeds; a 4th loan makes assemble fail with ERR_POOL_LOAN_COUNT_EXCEEDED."
        test_recipe:
          setup:
            - "Issuer ACTIVE; pool DRAFT with 3 loans of 40000000 cents each (aggregate 120000000)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-03T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /issuer-applications"
              payload: { legal_name: "Composition Lending", net_worth_cents: 900000000, liquid_assets_cents: 3000000, origination_experience_months: 40, branch_count: 1, annual_origination_volume_cents: 3000000000 }
              as: ApplicantOfficer
              as_user_id: "officer-comp"
              captures: { app_id: $.data.id }
            - call: "POST /issuer-applications/${app_id}/submit"
              payload: {}
              as: ApplicantOfficer
              as_user_id: "officer-comp"
            - call: "POST /issuer-applications/${app_id}/review"
              payload: {}
              as: AgencyReviewer
              as_user_id: "reviewer-1"
            - call: "POST /issuer-applications/${app_id}/approve"
              payload: {}
              as: AgencyReviewer
              as_user_id: "reviewer-1"
            - call: "GET /issuer-applications/${app_id}"
              payload: {}
              as: AgencyReviewer
              captures: { iss_id: $.data.approved_issuer_id }
            - call: "GET /issuers/${iss_id}"
              payload: {}
              as: PlatformAdmin
              captures: { iss_v: $.data.version }
            - call: "POST /document-custodians"
              payload: { firm_name: "TrustVault Custody" }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /custodian-engagements"
              payload: { custodian_id: "${cust_id}", issuer_id: "${iss_id}", window_start: "2026-01-01", window_end: "2027-01-01" }
              as: IssuerOfficer
              as_user_id: "${iss_id}"
            - call: "POST /pools"
