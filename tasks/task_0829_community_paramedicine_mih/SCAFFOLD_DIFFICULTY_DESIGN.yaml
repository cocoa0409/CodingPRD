            - "PilotProgram.${prog_id}.available_budget_cents == 1000000"
            - "committed_spend_cents + available_budget_cents == 1000000 (budget_cap invariant)"

      - name: enrollment_slot_consume_release_conserves_cap
        grounds:
          - state_machines.Referral.SCREENED_to_ACCEPTED
          - state_machines.Enrollment.ACTIVE_to_DISCHARGED
          - entities.PilotProgram.fields.active_enrollment_count
          - entities.PilotProgram.fields.remaining_slots
        distinguishing_aspect: |
          Conserved quantity = enrollment slots (count): active_enrollment_count +
          remaining_slots == enrollment_cap (2) always; accept consumes a slot and the
          compensating discharge restores active to 0 and remaining to 2.
        test_recipe:
          setup:
            - "Program cap=2; one referral accepted (active_enrollment_count 1, remaining_slots 1)."
          setup_api_calls:
            - call: "POST /mih/payers"
              payload: { name: "BlueMIH", payer_type: "MEDICAID" }
              as: ProgramAdmin
              captures: { payer_id: $.data.id }
            - call: "POST /mih/programs"
              payload: { name: "P17", payer_id: "${payer_id}", budget_cap_cents: 1000000, enrollment_cap: 2, per_visit_rate_cents: 15000, per_telehealth_rate_cents: 8000, diversion_bonus_cents: 50000, readmission_penalty_cents: 30000, diversion_target_max_ed_visits: 1, avg_ed_cost_cents: 124700, diversion_credit_pct: 0.855, start_date: "2026-01-01T00:00:00Z", end_date: "2027-01-01T00:00:00Z" }
              as: ProgramAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /mih/providers"
              payload: { full_name: "Coord", provider_type: "COORDINATOR", npi: "1000000171" }
              as: ProgramAdmin
              captures: { coord_id: $.data.id }
            - call: "POST /mih/patients"
              payload: { full_name: "Pat R", date_of_birth: "1974-01-01", baseline_ed_visits_12mo: 4, chronic_conditions_count: 1 }
              as: CareCoordinator
              as_user_id: "${coord_id}"
              captures: { pat_id: $.data.id }
            - call: "POST /mih/referrals"
              payload: { patient_id: "${pat_id}", program_id: "${prog_id}", referring_source: "ED" }
              as: CareCoordinator
              as_user_id: "${coord_id}"
              captures: { ref_id: $.data.id }
            - call: "POST /mih/referrals/${ref_id}/screen"
              payload: {}
              as: CareCoordinator
              as_user_id: "${coord_id}"
            - call: "POST /mih/referrals/${ref_id}/accept"
              payload: {}
              as: CareCoordinator
              as_user_id: "${coord_id}"
              captures: { enr_id: $.data.id }
          trigger:
            - call: "POST /mih/enrollments/${enr_id}/discharge"
              payload: {}
              as: CareCoordinator
              as_user_id: "${coord_id}"
          assert:
            - "PilotProgram.${prog_id}.active_enrollment_count == 0"
            - "PilotProgram.${prog_id}.remaining_slots == 2"
            - "active_enrollment_count + remaining_slots == 2 (enrollment_cap invariant)"
