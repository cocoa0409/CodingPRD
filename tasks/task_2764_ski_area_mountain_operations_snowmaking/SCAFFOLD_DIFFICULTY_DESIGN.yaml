      - name: empty_reading_set_yields_zero_base_depth_on_opening_decision
        grounds:
          - calculations.terrain_base_depth
          - validations[priority=25]
          - errors[ERR_BASE_DEPTH_INSUFFICIENT]
          - entities.TerrainArea.fields.base_depth_in
          - entities.TerrainArea.fields.base_depth_stake_count
          - entities.SnowDepthReading.fields.measured_at
        distinguishing_aspect: |
          A different metric and a different endpoint from the wet-bulb edge: the boundary here is the
          CARDINALITY of the input set as seen through the 48 hour BASE_DEPTH_LOOKBACK_HOURS window, reached
          through POST /mountain-ops/terrain-areas/{id}/opening-decision. The area's only reading is taken at
          2026-08-01T00:00:00Z and the clock is then moved to 2026-08-04T00:00:00Z, exactly 72 hours later,
          so the window is empty, base_depth_in collapses to 0.0 with base_depth_stake_count 0 and the
          opening decision fails on an area that is still in READY. A fresh 36.0 in reading on a second stake
          then proves the filter both ways: the correct answer is 36.0 over one stake, while an implementation
          that ignores the lookback window reports the mean of two stakes, 38.0.
        test_recipe:
          setup:
            - "Open-mountain bootstrap with the final opening decision omitted, so terrain area T1 is READY, lift L1 is OPEN and the day plan is PUBLISHED_PARTIAL."
            - "T1 carries exactly one stake reading: S1 40.0 in measured_at 2026-08-01T00:00:00Z, and min_open_base_depth_in is 30."
            - "The logical clock is then set to 2026-08-04T00:00:00Z, 72 hours after the reading and well outside the 48 hour lookback window."
            - "Priority 26 (groom currency) and priority 32 (lift inspection validity) are also violated at that clock, so the assertion pins the priority ladder as well as the empty-set boundary."
