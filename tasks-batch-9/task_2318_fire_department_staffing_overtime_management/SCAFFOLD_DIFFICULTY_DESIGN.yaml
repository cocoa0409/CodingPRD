              payload: { duty_shift_id: "${sh56b}", firefighter_id: "${ff56a}", apparatus_id: "${eng56}", assignment_type: "CALLBACK", seat_certification: "NONE", scheduled_hours: 24, expected_duty_shift_version: "${sh56b_v}" }
              as: CompanyOfficer
              as_user_id: "${ff56a}"
              captures: { asg56b: "$.data.id" }
            - call: "POST /fire-ops/shift-assignments"
              payload: { duty_shift_id: "${sh56a}", firefighter_id: "${ff56a}", apparatus_id: "${eng56}", assignment_type: "CALLBACK", seat_certification: "NONE", scheduled_hours: 12, expected_duty_shift_version: "${sh56a_v1}" }
              as: CompanyOfficer
              as_user_id: "${ff56a}"
              captures: { err56: "$.data.error_id" }
          assert:
            - "ADJACENT CASE: HTTP 201 — the 2026-08-12 seat starts exactly when the 2026-08-11 seat ends, and half-open intervals do not overlap at the shared instant"
            - "ADJACENT CASE: ShiftAssignment.${asg56b}.status == \"SCHEDULED\" and the merged continuous duty block is 48 hours, exactly CONTINUOUS_DUTY_MAX_HOURS, so ERR_REST_PERIOD_VIOLATION does NOT fire"
            - "OVERLAP CASE: HTTP 422 and error_id == \"ERR_DOUBLE_BOOKED_SHIFT\" — 2026-08-11T08:00Z..20:00Z is strictly inside the existing tour"
            - "OVERLAP CASE: error_id != \"ERR_REST_PERIOD_VIOLATION\" — the overlap check at priority 11 precedes the fatigue check at priority 12"
            - "Exactly two ShiftAssignment rows exist for ${ff56a}: ${asg56a} and ${asg56b}"
            - "WorkPeriod for ${ff56a} holds scheduled_hours == 48"
            - "DutyShift.${sh56a}.assigned_headcount == 1 and version == ${sh56a_v1}"

