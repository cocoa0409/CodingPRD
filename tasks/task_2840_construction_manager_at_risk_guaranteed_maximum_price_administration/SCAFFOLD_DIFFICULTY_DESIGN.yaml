          setup:
            - "one CmarProject 'Harborview Clinic' with gmp_status EXECUTED at gmp_amount 1245897.60, cm_fee_amount 44457.60, insurance_amount 11440.00"
            - "two RECONCILED CostReport rows (1000000.00 undisputed; 165100.00 reported with 140000.00 undisputed and 25100.00 disputed)"
            - "one OPEN CostReport row carrying a single 10000.00 line"
            - "audit_status IN_PROGRESS with audit_adjustment_total 5000.00"
