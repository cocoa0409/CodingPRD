              payload: { notification_batch_id: "${batch_adv_id}", customer_id: "${cust_a5_id}" }
              as: CommunityLiaison
            - call: "GET /notification-records"
              payload: { notification_batch_id: "${batch_adv_id}", customer_id: "${cust_a6_id}" }
