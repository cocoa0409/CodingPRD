              captures: {protest1_id: id}
            - call: POST /protests
              payload: {transfer_application_id: "${app2_id}", protestant_claimant_id: "${claimant_b_id}", claimed_injury_af: 12.00, basis: INJURY_TO_SENIOR_RIGHT}
              as: Claimant
              as_user_id: "${claimant_b_id}"
              captures: {protest2_id: id}
            - call: POST /protests/${protest1_id}/route
              payload: {track: NEGOTIATION}
              as: HearingOfficer
            - call: POST /protests/${protest2_id}/route
              payload: {track: HEARING}
              as: HearingOfficer
          trigger: >-
            POST /protests/${protest1_id}/resolve with {outcome: STIPULATE,
            resolution_note: "settled at 10 af", stipulated_offset_af: 10.00},
            then POST /protests/${protest2_id}/resolve with {outcome: STIPULATE,
            resolution_note: "measurement device ordered", condition_type:
            MEASUREMENT_DEVICE, compliance_due_date: "2026-08-01T00:00:00Z"}.
          assert: |
            Both protests reach status == RESOLVED_STIPULATED, yet:
            NEGOTIATION branch (protest 1 / app1):
              Protest.stipulated_offset_af == 10.00, track == NEGOTIATION
              InjuryAnalysis: gross_depletion_af == 39.10 (50.00 * 0.92 * 0.8500),
                offset_af == 10.00, net_injury_af == 29.10, status == FINALIZED
              GET /transfer-applications/${app1_id}/approval-conditions returns []
              app1.status == READY_FOR_DECISION, unresolved_protest_count == 0
            HEARING branch (protest 2 / app2):
              Protest.stipulated_offset_af == 0.00, track == HEARING
              InjuryAnalysis: gross_depletion_af == 39.10, offset_af == 0.00,
                net_injury_af == 39.10, status == FINALIZED
              GET /transfer-applications/${app2_id}/approval-conditions returns
                exactly 1 row: condition_type == MEASUREMENT_DEVICE,
                required_af == 12.00 (the protestant's claimed_injury_af),
                source == HEARING_RESOLUTION, status == IMPOSED,
                payment_status == NOT_APPLICABLE, base_fee_usd == 0.00,
                surcharge_pct == 0.000, admin_surcharge_usd == 0.00,
                total_fee_usd == 0.00,
                compliance_due_date == "2026-08-01T00:00:00Z"
              app2.status == READY_FOR_DECISION, unresolved_protest_count == 0
            distance_factor is 0.8500 on both analyses, so the 10.00 af gap
            between the two net_injury_af values is attributable solely to the
            branch taken.
            Applicant claimant A's outstanding_fee_balance_usd is still 0.00 and
            standing_status is IN_GOOD_STANDING: a MEASUREMENT_DEVICE condition
            is never priced, so the fee cascade does not fire on the hearing
            branch.
  # ---------------------------------------------------------------------------
  # RULE 4 — transitive_cascade  (different triggers, different chains)
  # ---------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:

      - name: condition_violation_suspension_cascade
        grounds: state_machines.WaterRight.PARTIALLY_TRANSFERRED_to_SUSPENDED
        distinguishing_aspect: >-
          One POST /approval-conditions/{id}/violate propagates four entities
          deep along a chain no single endpoint owns: ApprovalCondition IMPOSED
          -> VIOLATED (link 1) forces WaterRight PARTIALLY_TRANSFERRED ->
          SUSPENDED (link 2), which forces every ACTIVE LeaseAssignment on that
          right ACTIVE -> SUSPENDED (link 3), which re-runs
          calculations.bank_credit_ledger and calculations.bank_posture on the
          WaterBankAccount so that suspended_lease_count becomes 1 and posture
          jumps straight to FROZEN (link 4) — and, as a fifth observable, the
          SUSPENDED penalty re-scores the right from 60.50/ELEVATED to
          72.50/HIGH. Stopping the cascade at link 2 or 3 leaves the account
          readable as OPEN with 60.00 af of available credit, which the assert
          detects.
        test_recipe:
          setup: >-
            Pin the clock at 2026-03-01. Build the BASE RIGHT for claimant A
            with bank_enrolled true and one point of diversion created BEFORE
            activation (so it is AUTHORIZED). Drive a 30.00 af CHANGE_OF_USE
            application all the way to APPROVE_WITH_CONDITIONS: the
            SEASONAL_AVERAGE analysis is given return_flow_credit_af 23.40 so
            gross_depletion_af 23.40 nets to 0.00, which lets a single
            MEASUREMENT_DEVICE condition (required_af 5.00, compliance_due_date
            2026-05-01) satisfy priority 27 even though MEASUREMENT_DEVICE
            contributes 0.00 to the mitigation sum (0.00 >= 0.00, equality
            sufficient). Then open a bank account, deposit 60.00 af, reserve a
            40.00 af lease for [2026-04-01, 2026-08-01), advance the clock to
            2026-04-05 and activate it (available_credit_af 20.00, posture
            OPEN). Finally advance the clock to 2026-06-01, past the condition's
            compliance_due_date, so priority 34 permits the violation.
          setup_api_calls:
            - call: POST /_clock/set_current_utc
              payload: {current_utc: "2026-03-01T00:00:00Z"}
              as: WaterRightsAnalyst
            - call: POST /claimants
              payload: {legal_name: "Alder Creek Ranch", contact_email: "a@example.test", entity_type: INDIVIDUAL}
              as: WaterRightsAnalyst
              captures: {claimant_a_id: id}
            - call: POST /water-rights
              payload: {claimant_id: "${claimant_a_id}", right_number: "S4-00101", priority_date: "1901-05-01T00:00:00Z", source_stream_code: "ALDER", purpose_of_use: IRRIGATION, place_of_use_acres: 120.00, authorized_diversion_af: 400.00, authorized_rate_cfs: 5.000, bank_enrolled: true}
              as: WaterRightsAnalyst
              captures: {right_id: id}
            - call: POST /water-rights/${right_id}/points-of-diversion
              payload: {legal_description: "NE1/4 S12 T4N R2E", stream_reach_code: "ALDER-01", max_rate_cfs: 5.000, stream_miles_from_headwater: 12.00}
              as: WaterRightsAnalyst
              captures: {pod_id: id}
            - call: POST /water-rights/${right_id}/beneficial-use-records
              payload: {use_year: 2023, reported_diversion_af: 300.000, irrigated_acres: 100.00, verification_source: METER}
              as: WaterRightsAnalyst
            - call: POST /water-rights/${right_id}/beneficial-use-records
              payload: {use_year: 2024, reported_diversion_af: 300.000, irrigated_acres: 100.00, verification_source: METER}
              as: WaterRightsAnalyst
            - call: POST /water-rights/${right_id}/beneficial-use-records
              payload: {use_year: 2025, reported_diversion_af: 300.000, irrigated_acres: 100.00, verification_source: METER}
              as: WaterRightsAnalyst
            - call: POST /water-rights/${right_id}/activate
              payload: {}
              as: WaterRightsAnalyst
            - call: POST /water-rights/${right_id}/hcu-studies
              payload: {method: DIVERSION_BASED, study_period_start_year: 2023, study_period_end_year: 2025}
              as: WaterRightsAnalyst
              captures: {study_id: id}
            - call: GET /water-rights/${right_id}
              payload: {}
              as: WaterRightsAnalyst
              captures: {right_v1: version}
            - call: POST /hcu-studies/${study_id}/certify
              payload: {expected_water_right_version: "${right_v1}"}
              as: WaterRightsAnalyst
              as_user_id: u-analyst-1
            - call: POST /transfer-applications
              payload: {water_right_id: "${right_id}", hcu_study_id: "${study_id}", application_type: CHANGE_OF_USE, requested_af: 30.00, proposed_purpose_of_use: STOCKWATER}
              as: WaterRightsAnalyst
