            - "k_status == UNDER_REVIEW with k_by == CO-1, then e_notreviewable == ERR_CASE_NOT_REVIEWABLE (review requires OPEN or APPEALED)"
            - "e_fields == ERR_SANCTION_FIELDS_REQUIRED with HTTP 422 (a SANCTION decision must carry sanction_level, effective_from and effective_until)"
            - "e_window == ERR_SANCTION_WINDOW_INVALID with HTTP 422 (effective_until must be strictly after effective_from; equal instants are also rejected)"
            - "bb_status == REQUESTED, then e_bbnotappr == ERR_BUYBACK_NOT_APPROVED with HTTP 409 (refund requires APPROVED)"
            - "e_reason == ERR_DECISION_REASON_REQUIRED with HTTP 422 for a DENY without decision_reason, while an APPROVE needs none"
            - "bb2_status == DENIED with bb2_by == FC-1, then e_bbnotreq == ERR_BUYBACK_NOT_REQUESTED with HTTP 409 (DENIED is terminal)"
            - "the case is still UNDER_REVIEW with sanction_order 0, and consultant A is still ACTIVE"

