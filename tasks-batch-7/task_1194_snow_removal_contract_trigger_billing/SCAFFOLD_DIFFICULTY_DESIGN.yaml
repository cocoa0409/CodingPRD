  - rule_id: priority_pair_validation_conflict
    instances:
      - name: invoice_issue_state_vs_fiscal_priority
        grounds:
          - validations[priority=5]
          - validations[priority=21]
          - state_machines.Invoice.DRAFT_to_ISSUED
        distinguishing_aspect: |
          Error-category pair (state vs business_fiscal): issuing a VOIDED invoice
          whose total would also exceed the client credit limit must return
          ERR_INVALID_STATE (state, priority 5), never ERR_CLIENT_CREDIT_EXCEEDED
          (fiscal, priority 21).
        test_recipe:
          setup:
            - "Client credit_limit_cents = 40000 (below the 45000 invoice total) so the fiscal gate always fails for this invoice"
            - "Invoice inv1 (EVENT, total 45000) first proven fiscally blocked, then voided from DRAFT"
          setup_api_calls:
            - { call: "POST /clients", payload: { name: "Tight Budget LLC", credit_limit_cents: 40000 }, as: OpsDispatcher, captures: { clA: $.data.id } }
            - { call: "POST /sites", payload: { client_id: "${clA}", name: "Small Lot", address: "8 Narrow St", region_code: "NE", pavement_area_sqft: 9000, requires_loader: false }, as: OpsDispatcher, captures: { sA: $.data.id } }
            - { call: "POST /contracts", payload: { client_id: "${clA}", contract_type: "PER_PUSH", season_start: "2026-11-01T00:00:00Z", season_end: "2027-03-31T23:59:59Z", trigger_depth_inches: 1.0, per_push_rate_cents: 45000, require_photo_verification: false }, as: OpsDispatcher, captures: { kA: $.data.id } }
            - { call: "POST /contract-sites", payload: { contract_id: "${kA}", site_id: "${sA}", priority_sequence: 1, completion_target_minutes: 360, salt_included_lbs: 0 }, as: OpsDispatcher, captures: { csA: $.data.id } }
