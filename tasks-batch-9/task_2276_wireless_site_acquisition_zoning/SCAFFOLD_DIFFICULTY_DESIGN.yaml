# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Task 2276 — Wireless Site Acquisition & Zoning
# Every instance grounds in SCAFFOLD.yaml §1.1–§1.7 only. All numeric asserts are
# literals computed from the §1.3 formulas and their constants.
scaffold_difficulty_design:

  # =========================================================================
  # Rule 1 — dual-variant calculations across different entity domains
  # =========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: lease_committed_rent_provisional_vs_final_diverge
        grounds:
          - calculations.lease_committed_rent
          - entities.LeaseAgreement.fields.committed_rent_provisional_usd
          - entities.LeaseAgreement.fields.committed_rent_final_usd
          - state_machines.LeaseAgreement.COUNTERED_to_ACCEPTED
          - state_machines.LeaseAgreement.ACCEPTED_to_EXECUTED
        distinguishing_aspect: |
          Domain is lease cost accounting on LeaseAgreement: the provisional variant prices only the
          5-year initial term (160070.45) while the final variant prices all 15 contracted years plus
          the 5% revenue-share uplift (588795.12), a delta of 428724.67 on identical stored economics.
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T00:00:00Z"
            - "one jurisdiction, one OPEN ring in market MKT-NE-01 with market_benchmark_monthly_rent_usd 2400.00"
            - "one ACTIVE landlord and one candidate owned by agent-001 whose acquisition_status is LANDLORD_ENGAGED"
            - "one lease on that candidate with base_monthly_rent_usd 2400.00, FIXED_PCT 3%, 5-year initial term, 2 renewal options of 5 years, revenue_share_pct 0.05"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramDirector
            - call: "POST /jurisdictions"
              payload: { name: "Northeast Township", market_code: "MKT-NE-01", by_right_review_days: 60, conditional_use_review_days: 90, variance_review_days: 150, hearing_cadence_days: 14, requires_visual_simulation: true, min_visual_simulations: 2, max_continuances: 2, historic_district_flag: false, tribal_consultation_required: false, historical_delay_factor: 1.20, appeal_window_days: 30 }
              as: ZoningPlanner
              captures: { jur_id: $.data.id }
            - call: "POST /search-rings"
              payload: { name: "Ring 2276-A", market_code: "MKT-NE-01", center_lat: 42.3500, center_lon: -71.0600, radius_m: 800, required_agl_m: 45, objective_type: "COVERAGE_AND_CAPACITY", target_rsrp_dbm: -95, target_capacity_gbps: 10, market_benchmark_monthly_rent_usd: 2400.00, capex_budget_usd: 250000.00, priority_rank: 1 }
              as: RfEngineer
              captures: { ring_id: $.data.id }
            - call: "POST /search-rings/${ring_id}/open"
              as: RfEngineer
            - call: "POST /landlords"
              payload: { legal_name: "Beacon Holdings LLC", entity_type: "LLC", contact_email: "asset@beacon.example", market_code: "MKT-NE-01", outreach_optout: false }
              as: SiteAcquisitionAgent
              as_user_id: "agent-001"
              captures: { ll_id: $.data.id }
            - call: "POST /candidates"
              payload: { search_ring_id: "${ring_id}", landlord_id: "${ll_id}", jurisdiction_id: "${jur_id}", owning_agent_user_id: "agent-001", site_type: "TOWER", lat: 42.3510, lon: -71.0620, distance_from_center_m: 200, agl_m: 60, months_to_availability: 3, measured_rsrp_dbm: -88, offered_capacity_gbps: 10 }
              as: SiteAcquisitionAgent
              as_user_id: "agent-001"
              captures: { cand_id: $.data.id }
            - call: "POST /candidates/${cand_id}/outreach-events"
              payload: { event_type: "OUTREACH_SENT" }
              as: SiteAcquisitionAgent
              as_user_id: "agent-001"
            - call: "POST /candidates/${cand_id}/outreach-events"
              payload: { event_type: "LANDLORD_REPLY" }
              as: SiteAcquisitionAgent
              as_user_id: "agent-001"
            - call: "POST /leases"
              payload: { candidate_id: "${cand_id}", landlord_id: "${ll_id}", negotiating_agent_user_id: "agent-001", base_monthly_rent_usd: 2400.00, escalation_type: "FIXED_PCT", escalation_pct: 0.03, initial_term_years: 5, renewal_option_count: 2, renewal_term_years: 5, equipment_expansion_sqft: 120, revenue_share_pct: 0.05 }
              as: SiteAcquisitionAgent
              as_user_id: "agent-001"
              captures: { lease_id: $.data.id }
            - call: "POST /leases/${lease_id}/rounds"
              payload: { action: "SUBMIT", counter_rent_usd: 2400.00 }
              as: SiteAcquisitionAgent
              as_user_id: "agent-001"
            - call: "POST /leases/${lease_id}/rounds"
              payload: { action: "COUNTER", counter_rent_usd: 2512.50 }
              as: SiteAcquisitionAgent
              as_user_id: "agent-001"
          trigger:
            - call: "POST /leases/${lease_id}/rounds"
              payload: { action: "ACCEPT" }
              as: SiteAcquisitionAgent
              as_user_id: "agent-001"
              captures: { prov: $.data.committed_rent_provisional_usd }
            - call: "POST /leases/${lease_id}/execute"
              payload: { execution_date: "2026-08-01T00:00:00Z" }
              as: ProgramDirector
              as_user_id: "director-001"
              captures: { fin: $.data.committed_rent_final_usd }
          assert:
            - "LeaseAgreement.${lease_id}.base_monthly_rent_usd == 2512.50"
            - "LeaseAgreement.${lease_id}.committed_rent_provisional_usd == 160070.45"
            - "LeaseAgreement.${lease_id}.committed_rent_final_usd == 588795.12"
            - "LeaseAgreement.${lease_id}.committed_rent_final_usd - LeaseAgreement.${lease_id}.committed_rent_provisional_usd == 428724.67"
            - "GET /leases/${lease_id}/rent-schedule returns provisional_total_usd == 160070.45, final_total_usd == 588795.12, delta_usd == 428724.67, priced_years == 15, first_year_rent_usd == 30150.00, last_year_rent_usd == 45604.58"
            - "LeaseAgreement.${lease_id}.status == EXECUTED"

      - name: on_air_baseline_vs_risk_adjusted_forecast_diverge
        grounds:
          - calculations.on_air_schedule_forecast
          - entities.OnAirPlan.fields.baseline_forecast_date
          - entities.OnAirPlan.fields.risk_adjusted_forecast_date
          - entities.Jurisdiction.fields.historical_delay_factor
        distinguishing_aspect: |
          Different entity domain from the lease instance: schedule risk on OnAirPlan/SearchRing, not rent
          on LeaseAgreement. The baseline variant lands on 2026-11-15 from 45 nominal remaining days while
          the risk-adjusted variant lands on 2026-11-24 from ceil(45 * 1.20) = 54 days.
          Divergence is 9 whole days on identical program state.
          Prefix chain: identical to lease_committed_rent_provisional_vs_final_diverge through the
          execute call, then structural, environmental, zoning, permit and site selection.
        test_recipe:
          setup:
            - "the ring is SITE_SELECTED with a BUILD_READY selected candidate, zoning APPROVED, permit ISSUED, environmental CLEARED"
            - "the selected candidate has no UtilityBackhaulOrder at all, so backhaul contributes BACKHAUL_DEFAULT_DAYS (45)"
            - "logical clock at 2026-10-01T00:00:00Z"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramDirector
            - call: "POST /jurisdictions"
              payload: { name: "Northeast Township", market_code: "MKT-NE-01", by_right_review_days: 60, conditional_use_review_days: 90, variance_review_days: 150, hearing_cadence_days: 14, requires_visual_simulation: true, min_visual_simulations: 2, max_continuances: 2, historic_district_flag: false, tribal_consultation_required: false, historical_delay_factor: 1.20, appeal_window_days: 30 }
              as: ZoningPlanner
              captures: { jur_id: $.data.id }
            - call: "POST /search-rings"
              payload: { name: "Ring 2276-A", market_code: "MKT-NE-01", center_lat: 42.3500, center_lon: -71.0600, radius_m: 800, required_agl_m: 45, objective_type: "COVERAGE_AND_CAPACITY", target_rsrp_dbm: -95, target_capacity_gbps: 10, market_benchmark_monthly_rent_usd: 2400.00, capex_budget_usd: 250000.00, priority_rank: 1 }
              as: RfEngineer
              captures: { ring_id: $.data.id }
            - call: "POST /search-rings/${ring_id}/open"
              as: RfEngineer
            - call: "POST /landlords"
              payload: { legal_name: "Beacon Holdings LLC", entity_type: "LLC", contact_email: "asset@beacon.example", market_code: "MKT-NE-01", outreach_optout: false }
              as: SiteAcquisitionAgent
              as_user_id: "agent-001"
              captures: { ll_id: $.data.id }
            - call: "POST /candidates"
              payload: { search_ring_id: "${ring_id}", landlord_id: "${ll_id}", jurisdiction_id: "${jur_id}", owning_agent_user_id: "agent-001", site_type: "TOWER", lat: 42.3510, lon: -71.0620, distance_from_center_m: 200, agl_m: 60, months_to_availability: 3, measured_rsrp_dbm: -88, offered_capacity_gbps: 10 }
              as: SiteAcquisitionAgent
              as_user_id: "agent-001"
              captures: { cand_id: $.data.id }
            - call: "POST /candidates/${cand_id}/outreach-events"
              payload: { event_type: "OUTREACH_SENT" }
              as: SiteAcquisitionAgent
              as_user_id: "agent-001"
            - call: "POST /candidates/${cand_id}/outreach-events"
              payload: { event_type: "LANDLORD_REPLY" }
              as: SiteAcquisitionAgent
              as_user_id: "agent-001"
            - call: "POST /candidates/${cand_id}/rf-qualify"
              as: RfEngineer
            - call: "POST /leases"
              payload: { candidate_id: "${cand_id}", landlord_id: "${ll_id}", negotiating_agent_user_id: "agent-001", base_monthly_rent_usd: 2400.00, escalation_type: "FIXED_PCT", escalation_pct: 0.03, initial_term_years: 5, renewal_option_count: 2, renewal_term_years: 5, equipment_expansion_sqft: 120, revenue_share_pct: 0.05 }
              as: SiteAcquisitionAgent
              as_user_id: "agent-001"
              captures: { lease_id: $.data.id }
            - call: "POST /leases/${lease_id}/rounds"
              payload: { action: "SUBMIT", counter_rent_usd: 2400.00 }
              as: SiteAcquisitionAgent
              as_user_id: "agent-001"
            - call: "POST /leases/${lease_id}/rounds"
              payload: { action: "ACCEPT" }
              as: SiteAcquisitionAgent
              as_user_id: "agent-001"
            - call: "POST /leases/${lease_id}/execute"
              payload: { execution_date: "2026-08-01T00:00:00Z" }
              as: ProgramDirector
              as_user_id: "director-001"
            - call: "GET /candidates/${cand_id}"
              as: StructuralEngineer
              captures: { cand_v: $.data.version }
            - call: "POST /structural-analyses"
              payload: { candidate_id: "${cand_id}", analysis_type: "TIA_222_H", existing_load_pct: 55.0, appurtenance_count: 4, wind_speed_mph: 90, ice_thickness_in: 0, performed_by_user_id: "sengr-001", expected_candidate_version: "${cand_v}" }
              as: StructuralEngineer
              as_user_id: "sengr-001"
              captures: { sa_id: $.data.id }
            - call: "POST /structural-analyses/${sa_id}/complete"
              as: StructuralEngineer
              as_user_id: "sengr-001"
            - call: "POST /environmental-reviews"
              payload: { candidate_id: "${cand_id}", nepa_category: "CATEGORICAL_EXCLUSION", section106_required: false }
              as: EnvironmentalReviewer
              captures: { er_id: $.data.id }
            - call: "POST /environmental-reviews/${er_id}/screen"
              as: EnvironmentalReviewer
            - call: "POST /environmental-reviews/${er_id}/branch-complete"
              payload: { branch: "PUBLIC_NOTICE", finding: "NO_ADVERSE_EFFECT" }
              as: EnvironmentalReviewer
            - call: "POST /zoning-applications"
              payload: { candidate_id: "${cand_id}", application_type: "CONDITIONAL_USE", filed_by_user_id: "planner-001" }
              as: ZoningPlanner
              captures: { za_id: $.data.id }
            - call: "POST /zoning-applications/${za_id}/visual-simulations"
              payload: { view_angle_deg: 0, photo_reference: "sim-north" }
              as: ZoningPlanner
            - call: "POST /zoning-applications/${za_id}/visual-simulations"
              payload: { view_angle_deg: 180, photo_reference: "sim-south" }
              as: ZoningPlanner
            - call: "POST /zoning-applications/${za_id}/submit"
              as: ZoningPlanner
            - call: "POST /zoning-applications/${za_id}/completeness"
              payload: { outcome: "COMPLETE" }
              as: ZoningPlanner
            - call: "POST /zoning-applications/${za_id}/hearings"
              payload: { action: "SCHEDULE", hearing_date: "2026-10-01T00:00:00Z" }
              as: ZoningPlanner
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-01T00:00:00Z" }
              as: ProgramDirector
            - call: "POST /zoning-applications/${za_id}/hearings"
              payload: { action: "HOLD" }
              as: ZoningPlanner
            - call: "POST /zoning-applications/${za_id}/decide"
              payload: { outcome: "APPROVED", decision_date: "2026-10-01T00:00:00Z" }
              as: ZoningPlanner
            - call: "POST /construction-permits"
              payload: { candidate_id: "${cand_id}", permit_type: "BUILDING", valid_days: 180 }
              as: ConstructionManager
              captures: { cp_id: $.data.id }
            - call: "POST /construction-permits/${cp_id}/issue"
              payload: { issued_date: "2026-10-01T00:00:00Z" }
              as: ConstructionManager
            - call: "POST /candidates/${cand_id}/mark-build-ready"
              as: ConstructionManager
            - call: "GET /search-rings/${ring_id}"
              as: ProgramDirector
              captures: { ring_v: $.data.version }
            - call: "POST /search-rings/${ring_id}/select-site"
              payload: { expected_search_ring_version: "${ring_v}" }
              as: ProgramDirector
              as_user_id: "director-001"
          trigger:
            - call: "POST /on-air-plans"
              payload: { search_ring_id: "${ring_id}", target_on_air_date: "2026-12-01T00:00:00Z" }
              as: ProgramDirector
              as_user_id: "director-001"
              captures: { plan_id: $.data.id }
          assert:
            - "OnAirPlan.${plan_id}.baseline_forecast_date == 2026-11-15T00:00:00Z"
            - "OnAirPlan.${plan_id}.risk_adjusted_forecast_date == 2026-11-24T00:00:00Z"
            - "OnAirPlan.${plan_id}.schedule_risk_score == 36.00"
            - "OnAirPlan.${plan_id}.risk_band == LOW"
            - "OnAirPlan.${plan_id}.driver_candidate_id == ${cand_id}"
            - "OnAirPlan.${plan_id}.status == PLANNED"
            - "GET /on-air-plans/${plan_id}/forecast returns remaining_days == 45, risk_days == 54, slip_days == -7"

  # =========================================================================
  # Rule 2 — combinatorial formulas across different modes
  # =========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: lease_rent_rounding_order_pinned_per_year_then_sum
        grounds:
          - calculations.lease_committed_rent
          - entities.LeaseAgreement.fields.committed_rent_provisional_usd
        distinguishing_aspect: |
          Mode (b) nested rounding where order matters: with base_monthly_rent_usd 2512.50 and FIXED_PCT
          3% over 5 years, rounding each lease year to cents and then summing gives 160070.45, while
          summing the unrounded years and rounding once gives 160070.44 — a one-cent divergence that
          pins the declared ROUNDING_ORDER constant.
          Prefix chain: identical to lease_committed_rent_provisional_vs_final_diverge.
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T00:00:00Z, one OPEN ring with benchmark 2400.00"
            - "one candidate at LANDLORD_ENGAGED with a lease at FIXED_PCT 3%, 5-year initial term"
            - "the negotiation has been countered to 2512.50 so ACCEPT prices the provisional variant on that base"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramDirector
            - call: "POST /jurisdictions"
              payload: { name: "Northeast Township", market_code: "MKT-NE-01", by_right_review_days: 60, conditional_use_review_days: 90, variance_review_days: 150, hearing_cadence_days: 14, requires_visual_simulation: true, min_visual_simulations: 2, max_continuances: 2, historic_district_flag: false, tribal_consultation_required: false, historical_delay_factor: 1.20, appeal_window_days: 30 }
              as: ZoningPlanner
              captures: { jur_id: $.data.id }
            - call: "POST /search-rings"
              payload: { name: "Ring 2276-A", market_code: "MKT-NE-01", center_lat: 42.3500, center_lon: -71.0600, radius_m: 800, required_agl_m: 45, objective_type: "COVERAGE_AND_CAPACITY", target_rsrp_dbm: -95, target_capacity_gbps: 10, market_benchmark_monthly_rent_usd: 2400.00, capex_budget_usd: 250000.00, priority_rank: 1 }
              as: RfEngineer
              captures: { ring_id: $.data.id }
            - call: "POST /search-rings/${ring_id}/open"
              as: RfEngineer
            - call: "POST /landlords"
              payload: { legal_name: "Beacon Holdings LLC", entity_type: "LLC", contact_email: "asset@beacon.example", market_code: "MKT-NE-01", outreach_optout: false }
              as: SiteAcquisitionAgent
              as_user_id: "agent-001"
              captures: { ll_id: $.data.id }
            - call: "POST /candidates"
              payload: { search_ring_id: "${ring_id}", landlord_id: "${ll_id}", jurisdiction_id: "${jur_id}", owning_agent_user_id: "agent-001", site_type: "TOWER", lat: 42.3510, lon: -71.0620, distance_from_center_m: 200, agl_m: 60, months_to_availability: 3, measured_rsrp_dbm: -88, offered_capacity_gbps: 10 }
              as: SiteAcquisitionAgent
              as_user_id: "agent-001"
              captures: { cand_id: $.data.id }
            - call: "POST /candidates/${cand_id}/outreach-events"
              payload: { event_type: "OUTREACH_SENT" }
              as: SiteAcquisitionAgent
              as_user_id: "agent-001"
            - call: "POST /candidates/${cand_id}/outreach-events"
              payload: { event_type: "LANDLORD_REPLY" }
              as: SiteAcquisitionAgent
              as_user_id: "agent-001"
            - call: "POST /leases"
              payload: { candidate_id: "${cand_id}", landlord_id: "${ll_id}", negotiating_agent_user_id: "agent-001", base_monthly_rent_usd: 2400.00, escalation_type: "FIXED_PCT", escalation_pct: 0.03, initial_term_years: 5, renewal_option_count: 2, renewal_term_years: 5, equipment_expansion_sqft: 120, revenue_share_pct: 0.05 }
              as: SiteAcquisitionAgent
              as_user_id: "agent-001"
              captures: { lease_id: $.data.id }
            - call: "POST /leases/${lease_id}/rounds"
              payload: { action: "SUBMIT", counter_rent_usd: 2400.00 }
              as: SiteAcquisitionAgent
              as_user_id: "agent-001"
            - call: "POST /leases/${lease_id}/rounds"
              payload: { action: "COUNTER", counter_rent_usd: 2512.50 }
              as: SiteAcquisitionAgent
              as_user_id: "agent-001"
          trigger:
            - call: "POST /leases/${lease_id}/rounds"
              payload: { action: "ACCEPT" }
              as: SiteAcquisitionAgent
              as_user_id: "agent-001"
          assert:
            - "LeaseAgreement.${lease_id}.committed_rent_provisional_usd == 160070.45"
            - "LeaseAgreement.${lease_id}.committed_rent_provisional_usd != 160070.44"
            - "GET /leases/${lease_id}/rent-schedule returns first_year_rent_usd == 30150.00 and priced_years == 15"
            - "LeaseAgreement.${lease_id}.round_count == 2"

      - name: zoning_expedite_tier_keyed_on_step_one_subtotal
        grounds:
          - calculations.zoning_fee_total
          - entities.ZoningApplication.fields.zoning_fee_total_usd
          - entities.Jurisdiction.fields.historic_district_flag
        distinguishing_aspect: |
          Mode (c) circular-looking dependency with pinned evaluation order: a VARIANCE filing in a
          historic district with zero simulations has a step-1 subtotal of 5700.00, so the expedite tier
          is 0.08 and the total is 6156.00. Re-deriving the tier from the 6156.00 total (>= 6000 -> 0.12)
          would yield 6384.00; the pinned four-step order forbids it.
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T00:00:00Z"
            - "a jurisdiction with historic_district_flag true, requires_visual_simulation false and variance_review_days 150"
            - "a candidate whose lease is EXECUTED so the application may be submitted, with a VARIANCE application carrying zero visual simulations"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramDirector
            - call: "POST /jurisdictions"
              payload: { name: "Historic Village", market_code: "MKT-NE-02", by_right_review_days: 60, conditional_use_review_days: 90, variance_review_days: 150, hearing_cadence_days: 14, requires_visual_simulation: false, min_visual_simulations: 2, max_continuances: 2, historic_district_flag: true, tribal_consultation_required: false, historical_delay_factor: 1.35, appeal_window_days: 30 }
              as: ZoningPlanner
              captures: { jur2_id: $.data.id }
            - call: "POST /search-rings"
              payload: { name: "Ring 2276-B", market_code: "MKT-NE-02", center_lat: 42.4000, center_lon: -71.1000, radius_m: 800, required_agl_m: 45, objective_type: "COVERAGE_AND_CAPACITY", target_rsrp_dbm: -95, target_capacity_gbps: 10, market_benchmark_monthly_rent_usd: 2400.00, capex_budget_usd: 250000.00, priority_rank: 2 }
              as: RfEngineer
              captures: { ring2_id: $.data.id }
            - call: "POST /search-rings/${ring2_id}/open"
              as: RfEngineer
            - call: "POST /landlords"
              payload: { legal_name: "Village Trust REIT", entity_type: "REIT", contact_email: "trust@village.example", market_code: "MKT-NE-02", outreach_optout: false }
              as: SiteAcquisitionAgent
              as_user_id: "agent-002"
              captures: { ll2_id: $.data.id }
            - call: "POST /candidates"
              payload: { search_ring_id: "${ring2_id}", landlord_id: "${ll2_id}", jurisdiction_id: "${jur2_id}", owning_agent_user_id: "agent-002", site_type: "ROOFTOP", lat: 42.4010, lon: -71.1010, distance_from_center_m: 300, agl_m: 50, months_to_availability: 2, measured_rsrp_dbm: -90, offered_capacity_gbps: 8 }
              as: SiteAcquisitionAgent
              as_user_id: "agent-002"
              captures: { cand2_id: $.data.id }
            - call: "POST /candidates/${cand2_id}/outreach-events"
              payload: { event_type: "OUTREACH_SENT" }
              as: SiteAcquisitionAgent
              as_user_id: "agent-002"
            - call: "POST /candidates/${cand2_id}/outreach-events"
              payload: { event_type: "LANDLORD_REPLY" }
              as: SiteAcquisitionAgent
              as_user_id: "agent-002"
            - call: "POST /leases"
              payload: { candidate_id: "${cand2_id}", landlord_id: "${ll2_id}", negotiating_agent_user_id: "agent-002", base_monthly_rent_usd: 2400.00, escalation_type: "FLAT_STEP", escalation_step_usd: 50.00, initial_term_years: 5, renewal_option_count: 1, renewal_term_years: 5, equipment_expansion_sqft: 90 }
              as: SiteAcquisitionAgent
              as_user_id: "agent-002"
              captures: { lease2_id: $.data.id }
            - call: "POST /leases/${lease2_id}/rounds"
              payload: { action: "SUBMIT", counter_rent_usd: 2400.00 }
