# =============================================================================
# task_2152 — §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Nine §0.5 rules x >= 2 instances. Every ground resolves into SCAFFOLD.yaml.
# Fixture conventions used throughout:
#   * logical clock starts at 2026-08-01T00:00:00Z (see POST /_clock/set_current_utc)
#   * "First Meridian Bank" is NON partial-exempt (prior_year_closed_end = 700),
#     so required_field_count = 48 and income_thousands/rate_spread/purchaser_type
#     are applicable register fields
#   * every ULI literal is 25 characters unless the test is probing S300
# =============================================================================
scaffold_difficulty_design:

  - rule_id: dual_variant_calc
    instances:
      - name: submission_provisional_vs_final_record_count
        grounds:
          - calculations.submission_record_count
          - entities.FilingSubmission.fields.provisional_record_count
          - entities.FilingSubmission.fields.final_record_count
          - entities.Application.fields.is_superseded
          - state_machines.FilingSubmission.EDITS_ATTACHED_to_CERTIFIED
        distinguishing_aspect: |
          Both variants read the same base set of Applications, yet PROVISIONAL
          (frozen at submission creation) counts the superseded original while
          FINAL (frozen at certification) drops it, so one identical database
          state yields provisional_record_count 2 and final_record_count 1 on the
          same FilingSubmission row. This instance lives in the filing/register
          entity domain; the second dual-variant instance lives in the audit-scrub
          entity domain.
        test_recipe:
          setup:
            - "One non partial-exempt Institution for activity year 2026 with filing_deadline_at 2027-03-01T23:59:59.000Z."
            - "One CensusTract 06075010100 in county 06075 / CA so geocoding resolves to exactly one candidate."
            - "Application A originated 2026-03-15, REGISTER_LOCKED and CLEARED by edit run 1."
            - "Application B created with supersedes_application_id = A, originated 2026-04-20, REGISTER_LOCKED and CLEARED by edit run 2; A.is_superseded is now true and edit run 1 is INVALIDATED."
            - "A FilingSubmission created after both records exist and attached to edit run 2."
          setup_api_calls:
            - call: "POST /hmda/institutions"
              payload: { lei: "5493001KJTIIGC8Y1R12", name: "First Meridian Bank", activity_year: 2026, asset_size_usd_cents: 250000000000, prior_year_closed_end_originations: 700, prior_year_open_end_originations: 40 }
              as: SystemAdmin
              captures: { inst_id: $.data.id }
            - call: "POST /hmda/census-tracts"
              payload: { tract_code: "06075010100", county_fips: "06075", state_code: "CA", msa_md_code: "41860", minority_population_pct: 42.5, tract_to_msa_income_pct: 88.4, owner_occupied_units: 1200, median_family_income_cents: 9500000 }
              as: SystemAdmin
              captures: { tract_a_id: $.data.id }
            - call: "POST /hmda/applications"
              payload: { institution_id: "${inst_id}", uli: "10BX939C5543TQA1B00000001", application_date: "2026-02-10T00:00:00Z", application_channel: "FACE_TO_FACE", loan_type: "CONVENTIONAL", loan_purpose: "HOME_PURCHASE", occupancy_type: "PRINCIPAL", lien_status: "FIRST_LIEN", loan_amount_cents: 35000000, income_thousands: 120 }
              as: LoanOfficer
              captures: { app_a_id: $.data.id, app_a_v1: $.data.version }
            - call: "POST /hmda/geocode-assignments"
              payload: { application_id: "${app_a_id}", expected_application_version: "${app_a_v1}", street_address: "1 Market St", city: "San Francisco", state_code: "CA", zip_code: "94105", county_fips: "06075", submitted_tract_code: "06075010100" }
              as: LoanOfficer
            - call: "POST /hmda/demographic-entries"
              payload: { application_id: "${app_a_id}", applicant_role: "APPLICANT", collection_method: "PROVIDED_BY_APPLICANT", ethnicity_codes: ["NOT_HISPANIC_OR_LATINO"], race_codes: ["WHITE"], sex_code: "MALE", age_years: 41 }
              as: LoanOfficer
            - call: "POST /hmda/applications/${app_a_id}/advance"
              payload: { to_stage: "UNDERWRITING" }
              as: LoanOfficer
            - call: "POST /hmda/applications/${app_a_id}/advance"
              payload: { to_stage: "DECISIONED" }
              as: LoanOfficer
            - call: "POST /hmda/applications/${app_a_id}/action-taken"
              payload: { action_taken: "ORIGINATED", action_taken_date: "2026-03-15T00:00:00Z", rate_spread: 1.75, purchaser_type: "NOT_APPLICABLE" }
              as: LoanOfficer
            - call: "POST /hmda/applications/${app_a_id}/advance"
              payload: { to_stage: "REGISTER_LOCKED" }
              as: LoanOfficer
            - call: "POST /hmda/edit-runs"
              payload: { institution_id: "${inst_id}", scope: "FULL", window_start: "2026-08-01T00:00:00Z", window_end: "2026-08-02T00:00:00Z" }
              as: ComplianceAnalyst
              captures: { run1_id: $.data.id }
            - call: "POST /hmda/applications"
              payload: { institution_id: "${inst_id}", uli: "10BX939C5543TQA1B00000002", application_date: "2026-02-10T00:00:00Z", application_channel: "FACE_TO_FACE", loan_type: "CONVENTIONAL", loan_purpose: "HOME_PURCHASE", occupancy_type: "PRINCIPAL", lien_status: "FIRST_LIEN", loan_amount_cents: 35000000, income_thousands: 120, supersedes_application_id: "${app_a_id}" }
              as: LoanOfficer
              captures: { app_b_id: $.data.id, app_b_v1: $.data.version }
            - call: "POST /hmda/geocode-assignments"
              payload: { application_id: "${app_b_id}", expected_application_version: "${app_b_v1}", street_address: "1 Market St", city: "San Francisco", state_code: "CA", zip_code: "94105", county_fips: "06075", submitted_tract_code: "06075010100" }
              as: LoanOfficer
            - call: "POST /hmda/demographic-entries"
              payload: { application_id: "${app_b_id}", applicant_role: "APPLICANT", collection_method: "PROVIDED_BY_APPLICANT", ethnicity_codes: ["NOT_HISPANIC_OR_LATINO"], race_codes: ["WHITE"], sex_code: "MALE", age_years: 41 }
              as: LoanOfficer
            - call: "POST /hmda/applications/${app_b_id}/advance"
              payload: { to_stage: "UNDERWRITING" }
              as: LoanOfficer
            - call: "POST /hmda/applications/${app_b_id}/advance"
              payload: { to_stage: "DECISIONED" }
              as: LoanOfficer
            - call: "POST /hmda/applications/${app_b_id}/action-taken"
              payload: { action_taken: "ORIGINATED", action_taken_date: "2026-04-20T00:00:00Z", rate_spread: 1.75, purchaser_type: "NOT_APPLICABLE" }
              as: LoanOfficer
            - call: "POST /hmda/applications/${app_b_id}/advance"
              payload: { to_stage: "REGISTER_LOCKED" }
              as: LoanOfficer
            - call: "POST /hmda/edit-runs"
              payload: { institution_id: "${inst_id}", scope: "FULL", window_start: "2026-08-02T00:00:00Z", window_end: "2026-08-03T00:00:00Z" }
              as: ComplianceAnalyst
              captures: { run2_id: $.data.id }
            - call: "GET /hmda/institutions/${inst_id}"
              payload: {}
              as: ComplianceOfficer
              captures: { inst_v: $.data.version }
            - call: "POST /hmda/submissions"
              payload: { institution_id: "${inst_id}", expected_institution_version: "${inst_v}" }
              as: ComplianceOfficer
              as_user_id: "officer-alpha"
              captures: { sub_id: $.data.id, prov_count: $.data.provisional_record_count }
            - call: "POST /hmda/submissions/${sub_id}/attach-edit-run"
              payload: { edit_run_id: "${run2_id}" }
              as: ComplianceOfficer
              as_user_id: "officer-alpha"
          trigger:
            - call: "POST /hmda/submissions/${sub_id}/certify"
              payload: { attestation_text: "Register certified complete and accurate for activity year 2026." }
              as: ComplianceOfficer
              as_user_id: "officer-alpha"
              captures: { final_count: $.data.final_record_count }
          assert:
            - "FilingSubmission.${sub_id}.provisional_record_count == 2"
            - "FilingSubmission.${sub_id}.final_record_count == 1"
            - "FilingSubmission.${sub_id}.provisional_record_count != FilingSubmission.${sub_id}.final_record_count"
            - "Application.${app_a_id}.is_superseded == true"
            - "Application.${app_a_id}.lar_status == CLEARED"
            - "Application.${app_b_id}.is_superseded == false"
            - "FilingSubmission.${sub_id}.status == CERTIFIED"

      - name: audit_defect_rate_field_weighted_vs_record_weighted
        grounds:
          - calculations.audit_defect_rate
          - entities.AuditSample.fields.defect_rate_basis
          - entities.AuditSample.fields.defect_rate_pct
          - entities.AuditFinding.fields.is_defect
          - state_machines.AuditSample.IN_REVIEW_to_CLOSED_WITH_FINDINGS
        distinguishing_aspect: |
          Over the identical three AuditFinding rows (three defective fields
          spread across two sampled records, four fields re-keyed per record),
          FIELD_WEIGHTED closes at 37.50 percent while RECORD_WEIGHTED closes at
          100.00 percent. The subject is the audit-scrub domain (AuditSample /
          AuditFinding), structurally different from the register-count variant
          that lives on FilingSubmission.
        test_recipe:
          setup:
            - "One non partial-exempt Institution and one CensusTract as above."
            - "Two Applications originated 2026-03-15 and 2026-04-20, both lar_status COMPLETE, both inside the sampling period 2026-01-01..2026-06-30."
            - "AuditSample S1 drawn over that period with fields_reviewed_per_record 4; population_size 2 and sample_size 2, so both records are selected."
            - "Three findings on S1: two defective fields on record A, one defective field on record B. S1 closed FIELD_WEIGHTED, which flips all three findings to ACCEPTED_AS_IS and frees their remediation windows."
            - "AuditSample S2 drawn over the same period with the same three findings, closed RECORD_WEIGHTED."
          setup_api_calls:
            - call: "POST /hmda/institutions"
              payload: { lei: "5493001KJTIIGC8Y1R12", name: "First Meridian Bank", activity_year: 2026, asset_size_usd_cents: 250000000000, prior_year_closed_end_originations: 700, prior_year_open_end_originations: 40 }
              as: SystemAdmin
              captures: { inst_id: $.data.id }
            - call: "POST /hmda/census-tracts"
              payload: { tract_code: "06075010100", county_fips: "06075", state_code: "CA", msa_md_code: "41860", minority_population_pct: 42.5, tract_to_msa_income_pct: 88.4, owner_occupied_units: 1200, median_family_income_cents: 9500000 }
              as: SystemAdmin
            - call: "POST /hmda/applications"
              payload: { institution_id: "${inst_id}", uli: "10BX939C5543TQA1B00000001", application_date: "2026-02-10T00:00:00Z", application_channel: "FACE_TO_FACE", loan_type: "CONVENTIONAL", loan_purpose: "HOME_PURCHASE", occupancy_type: "PRINCIPAL", lien_status: "FIRST_LIEN", loan_amount_cents: 35000000, income_thousands: 120 }
              as: LoanOfficer
              captures: { app_a_id: $.data.id, app_a_v1: $.data.version }
            - call: "POST /hmda/geocode-assignments"
              payload: { application_id: "${app_a_id}", expected_application_version: "${app_a_v1}", street_address: "1 Market St", city: "San Francisco", state_code: "CA", zip_code: "94105", county_fips: "06075", submitted_tract_code: "06075010100" }
              as: LoanOfficer
            - call: "POST /hmda/demographic-entries"
              payload: { application_id: "${app_a_id}", applicant_role: "APPLICANT", collection_method: "PROVIDED_BY_APPLICANT", ethnicity_codes: ["NOT_HISPANIC_OR_LATINO"], race_codes: ["WHITE"], sex_code: "MALE", age_years: 41 }
              as: LoanOfficer
            - call: "POST /hmda/applications/${app_a_id}/advance"
              payload: { to_stage: "UNDERWRITING" }
              as: LoanOfficer
            - call: "POST /hmda/applications/${app_a_id}/advance"
              payload: { to_stage: "DECISIONED" }
              as: LoanOfficer
            - call: "POST /hmda/applications/${app_a_id}/action-taken"
              payload: { action_taken: "ORIGINATED", action_taken_date: "2026-03-15T00:00:00Z", rate_spread: 1.75, purchaser_type: "NOT_APPLICABLE" }
              as: LoanOfficer
            - call: "POST /hmda/applications"
              payload: { institution_id: "${inst_id}", uli: "10BX939C5543TQA1B00000002", application_date: "2026-02-12T00:00:00Z", application_channel: "FACE_TO_FACE", loan_type: "CONVENTIONAL", loan_purpose: "REFINANCING", occupancy_type: "PRINCIPAL", lien_status: "FIRST_LIEN", loan_amount_cents: 41000000, income_thousands: 150 }
              as: LoanOfficer
              captures: { app_b_id: $.data.id, app_b_v1: $.data.version }
            - call: "POST /hmda/geocode-assignments"
              payload: { application_id: "${app_b_id}", expected_application_version: "${app_b_v1}", street_address: "9 Mission St", city: "San Francisco", state_code: "CA", zip_code: "94105", county_fips: "06075", submitted_tract_code: "06075010100" }
              as: LoanOfficer
            - call: "POST /hmda/demographic-entries"
              payload: { application_id: "${app_b_id}", applicant_role: "APPLICANT", collection_method: "PROVIDED_BY_APPLICANT", ethnicity_codes: ["NOT_HISPANIC_OR_LATINO"], race_codes: ["ASIAN"], sex_code: "FEMALE", age_years: 38 }
              as: LoanOfficer
            - call: "POST /hmda/applications/${app_b_id}/advance"
              payload: { to_stage: "UNDERWRITING" }
              as: LoanOfficer
            - call: "POST /hmda/applications/${app_b_id}/advance"
              payload: { to_stage: "DECISIONED" }
              as: LoanOfficer
            - call: "POST /hmda/applications/${app_b_id}/action-taken"
              payload: { action_taken: "ORIGINATED", action_taken_date: "2026-04-20T00:00:00Z", rate_spread: 2.10, purchaser_type: "NOT_APPLICABLE" }
              as: LoanOfficer
            - call: "POST /hmda/audit-samples"
              payload: { institution_id: "${inst_id}", method: "SYSTEMATIC_INTERVAL", period_start: "2026-01-01T00:00:00Z", period_end: "2026-06-30T23:59:59Z", fields_reviewed_per_record: 4 }
              as: ComplianceAnalyst
              captures: { s1_id: $.data.id }
            - call: "POST /hmda/audit-findings"
              payload: { audit_sample_id: "${s1_id}", application_id: "${app_a_id}", field_name: "income_thousands", recorded_value: "120", source_document_value: "112", severity: "MATERIAL", remediation_start: "2026-09-01T00:00:00Z", remediation_end: "2026-09-05T00:00:00Z" }
              as: ComplianceAnalyst
            - call: "POST /hmda/audit-findings"
              payload: { audit_sample_id: "${s1_id}", application_id: "${app_a_id}", field_name: "rate_spread", recorded_value: "1.75", source_document_value: "1.85", severity: "NON_MATERIAL", remediation_start: "2026-09-06T00:00:00Z", remediation_end: "2026-09-10T00:00:00Z" }
              as: ComplianceAnalyst
            - call: "POST /hmda/audit-findings"
              payload: { audit_sample_id: "${s1_id}", application_id: "${app_b_id}", field_name: "loan_amount_cents", recorded_value: "41000000", source_document_value: "40900000", severity: "MATERIAL", remediation_start: "2026-09-01T00:00:00Z", remediation_end: "2026-09-05T00:00:00Z" }
              as: ComplianceAnalyst
            - call: "POST /hmda/audit-samples/${s1_id}/close"
              payload: { defect_rate_basis: "FIELD_WEIGHTED" }
              as: ComplianceAnalyst
              captures: { s1_rate: $.data.defect_rate_pct }
            - call: "POST /hmda/audit-samples"
              payload: { institution_id: "${inst_id}", method: "SYSTEMATIC_INTERVAL", period_start: "2026-01-01T00:00:00Z", period_end: "2026-06-30T23:59:59Z", fields_reviewed_per_record: 4 }
              as: ComplianceAnalyst
              captures: { s2_id: $.data.id }
            - call: "POST /hmda/audit-findings"
              payload: { audit_sample_id: "${s2_id}", application_id: "${app_a_id}", field_name: "income_thousands", recorded_value: "120", source_document_value: "112", severity: "MATERIAL", remediation_start: "2026-09-01T00:00:00Z", remediation_end: "2026-09-05T00:00:00Z" }
              as: ComplianceAnalyst
            - call: "POST /hmda/audit-findings"
              payload: { audit_sample_id: "${s2_id}", application_id: "${app_a_id}", field_name: "rate_spread", recorded_value: "1.75", source_document_value: "1.85", severity: "NON_MATERIAL", remediation_start: "2026-09-06T00:00:00Z", remediation_end: "2026-09-10T00:00:00Z" }
              as: ComplianceAnalyst
            - call: "POST /hmda/audit-findings"
              payload: { audit_sample_id: "${s2_id}", application_id: "${app_b_id}", field_name: "loan_amount_cents", recorded_value: "41000000", source_document_value: "40900000", severity: "MATERIAL", remediation_start: "2026-09-01T00:00:00Z", remediation_end: "2026-09-05T00:00:00Z" }
              as: ComplianceAnalyst
          trigger:
            - call: "POST /hmda/audit-samples/${s2_id}/close"
              payload: { defect_rate_basis: "RECORD_WEIGHTED" }
              as: ComplianceAnalyst
              captures: { s2_rate: $.data.defect_rate_pct }
          assert:
            - "AuditSample.${s1_id}.sample_size == 2"
            - "AuditSample.${s1_id}.population_size == 2"
            - "AuditSample.${s1_id}.defect_count == 3"
            - "AuditSample.${s1_id}.records_with_defect_count == 2"
            - "AuditSample.${s1_id}.defect_rate_pct == 37.50"
            - "AuditSample.${s2_id}.defect_rate_pct == 100.00"
            - "AuditSample.${s1_id}.status == CLOSED_WITH_FINDINGS"
            - "AuditSample.${s2_id}.status == CLOSED_WITH_FINDINGS"

  - rule_id: combinatorial_formula
    instances:
      - name: fair_lending_disparity_rounds_each_rate_before_dividing
        grounds:
          - calculations.fair_lending_disparity_index
          - entities.FairLendingAnalysis.fields.control_denial_rate_pct
          - entities.FairLendingAnalysis.fields.protected_denial_rate_pct
          - entities.FairLendingAnalysis.fields.disparity_index
          - state_machines.FairLendingAnalysis.COMPUTED_to_CLEARED
        distinguishing_aspect: |
          MODE (b) — nested rounding where order changes the cents. Control group
          1 of 2 denied rounds to 50.00; protected group 2 of 3 denied rounds to
          66.67; the pinned order divides the two ALREADY-ROUNDED rates and
          returns 133.34, whereas dividing the raw ratios and rounding once at
          the end returns 133.33. This is the rounding-order axis; the other two
          combinatorial instances sit on the tiered-nested-clamp axis and on the
          circular-dependency axis.
        test_recipe:
          setup:
            - "One non partial-exempt Institution for activity year 2026."
            - "Five DECISIONED Applications, each carrying an APPLICANT DemographicEntry: two with race_codes [WHITE] (one ORIGINATED, one DENIED) and three with race_codes [BLACK] (one ORIGINATED, two DENIED)."
            - "All five action dates fall inside 2026-03-10..2026-03-14, i.e. inside the analysis period 2026-01-01..2026-06-30."
          setup_api_calls:
            - call: "POST /hmda/institutions"
              payload: { lei: "5493001KJTIIGC8Y1R12", name: "First Meridian Bank", activity_year: 2026, asset_size_usd_cents: 250000000000, prior_year_closed_end_originations: 700, prior_year_open_end_originations: 40 }
              as: SystemAdmin
              captures: { inst_id: $.data.id }
            - call: "POST /hmda/applications"
