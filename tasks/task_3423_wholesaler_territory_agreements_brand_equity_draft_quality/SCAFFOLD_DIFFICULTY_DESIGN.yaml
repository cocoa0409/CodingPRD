              as: DraftAuditor
            - call: "POST /draft-audits"
              payload: { account_id: "${aq3_id}", conducted_at: "2026-09-01T00:00:00Z", line_cleaning_last_at: "2026-08-25T00:00:00Z", kegs: [{ brand_code: "BUD-LTD", filled_at: "2026-05-03T00:00:00Z", volume_bbl: 15 }] }
