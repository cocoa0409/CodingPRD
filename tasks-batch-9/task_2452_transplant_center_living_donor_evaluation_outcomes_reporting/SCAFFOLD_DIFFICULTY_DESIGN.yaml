- rule_id: priority_pair_validation_conflict
  instances:
  - name: state_transition_precedes_clearance_safety_on_reattestation
    grounds:
    - validations.priority_8.ERR_INVALID_STATE_TRANSITION
    - validations.priority_12.ERR_CLEARANCE_INCOMPLETE
    - state_machines.DonorCandidate.advocacy_status
    - state_machines.DonorCandidate.medical_status_psychosocial_status
    distinguishing_aspect: 'Pair: STATE (priority 8) beats BUSINESS_SAFETY (priority 12) on POST /donor-candidates/{id}/advocacy-determination.
