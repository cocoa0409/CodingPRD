        distinguishing_aspect: |
          Depth-3 chain from ONE trigger (study close): frames flip OPEN -> CLOSED (hop 1);
          each frame closure runs the duplicate sweep flipping the later rt-1 response
          ACCEPTED -> REJECTED/DUPLICATE (hop 2, caused by hop 1); the flips recompute the
          brand's BrandResult provisional snapshot (hop 3, caused by hop 2). Distinct trigger
          from the award-determination cascade instance.
        test_recipe:
          setup:
            - "Same fixture as index_score_provisional_vs_final_after_dedupe: min_sample 3, BrandA PANEL frame, rt-1 twice (10/10 earlier, 2/2 later), rt-2 once (6/6), all ACCEPTED at ingest"
