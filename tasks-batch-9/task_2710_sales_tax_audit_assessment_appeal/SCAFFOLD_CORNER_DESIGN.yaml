              payload: {}
              as: SelectionAnalyst
            - call: "GET /audit-leads"
              payload: { industry_project_id: "${proj_a}", status: "SELECTED" }
              as: SelectionAnalyst
              captures: { lead_a: "$.data[0].id" }
            - call: "GET /audit-leads"
              payload: { industry_project_id: "${proj_b}", status: "SELECTED" }
              as: SelectionAnalyst
              captures: { lead_b: "$.data[0].id" }
            - call: "POST /audit-leads/${lead_a}/convert"
              payload: { lead_auditor_user_id: "auditor-1", audit_type: "DESK" }
              as: AuditSupervisor
              as_user_id: "supervisor-1"
              captures: { audit_id: "$.data.id" }
          trigger:
            - call: "POST /audit-leads/${lead_a}/convert"
              payload: { lead_auditor_user_id: "auditor-1", audit_type: "DESK" }
              as: AuditSupervisor
              as_user_id: "supervisor-1"
            - call: "POST /audit-leads/${lead_b}/convert"
              payload: { lead_auditor_user_id: "auditor-1", audit_type: "DESK" }
              as: AuditSupervisor
              as_user_id: "supervisor-1"
            - call: "GET /audits"
              payload: { taxpayer_id: "${te_id}", limit: 10, offset: 0 }
