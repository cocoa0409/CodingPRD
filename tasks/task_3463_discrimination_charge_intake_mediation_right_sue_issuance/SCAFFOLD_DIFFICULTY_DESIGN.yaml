            - call: "POST /eeoc/mediation-cases/${med_v}/respond"
              payload: { response: "ACCEPTED" }
              as: ChargingParty
              as_user_id: "${cp_22}"
            - call: "POST /eeoc/mediation-cases/${med_v}/respond"
              payload: { response: "ACCEPTED" }
              as: RespondentRep
              as_user_id: "${emp_v}"
          trigger:
            - call: "POST /eeoc/mediation-cases/${med_v}/conclude"
              payload: { outcome: "SETTLED", settlement_amount_cents: 2500000 }
              as: Mediator
              captures: { med_v_status: $.data.status }
            - call: "GET /eeoc/charges/${chg_v}"
              as: Director
              captures: { chg_v_settled: $.data.settled_amount_cents, chg_v_status1: $.data.case_status, chg_v_via: $.data.settled_via }
            - call: "POST /eeoc/charges/${chg_v}/vacate-settlement"
              payload: { reason: "respondent repudiated the agreement" }
              as: Director
              captures: { chg_v_status2: $.data.case_status, chg_v_settled2: $.data.settled_amount_cents }
            - call: "GET /eeoc/mediation-cases/${med_v}"
              as: Director
              captures: { med_v_status2: $.data.status }
            - call: "GET /eeoc/charges/${chg_v}"
              as: Director
              captures: { inv_v: $.data.investigation_case_id }
            - call: "GET /eeoc/investigation-cases/${inv_v}"
              as: Director
              captures: { inv_v_status: $.data.status }
          assert:
            - "forward action: settled_amount_cents == 2500000, settled_via == MEDIATION, case_status == CLOSED_SETTLED"
            - "compensating action: settled_amount_cents == 0, settled_via == null, case_status == UNDER_INVESTIGATION"
            - "invariant: the global sum of settled_amount_cents across all charges is identical (0) before the pair and after it"
            - "mediation case == VACATED; a fresh InvestigationCase was auto-created (status OPEN) because none existed on the mediation-only path"
