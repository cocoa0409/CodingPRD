              captures: { ld_b: $.data.ld_accrued_cents }
          assert:
            - "AT the cap — Concession.${csn_a}.ld_accrued_cents == 5000000 from 20 net late days at 250000 (20 * 250000 == 5000000 exactly, so min() returns the product, not the cap)"
            - "AT the cap — Concession.${csn_a}.actual_service_commencement == '2027-01-21' and status == OPERATIONS"
            - "ONE DAY PAST — Concession.${csn_b}.ld_accrued_cents == 5000000, clamped down from the uncapped 5250000 (21 * 250000)"
            - "ONE DAY PAST — Concession.${csn_b}.actual_service_commencement == '2027-01-22' and status == OPERATIONS"
            - "the two accruals are equal but the underlying day counts differ by one, so the clamp — not a day-count cap — is what produced the equality"
            - "neither concession has any ReliefClaim: GET /ppp/relief-claims?concession_id=${csn_a} and ?concession_id=${csn_b} both return total_count 0, so excused_days was 0 in both computations"
            - "Concession.${csn_a}.monthly_unitary_charge_cents == 8604167 and is unaffected by the liquidated damages"

  # ===========================================================================
  - rule_id: cross_entity_state_dependency
