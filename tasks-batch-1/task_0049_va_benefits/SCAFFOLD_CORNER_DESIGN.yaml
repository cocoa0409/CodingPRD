          assert:
            - "HTTP status == 412"
            - "error_id == ERR_STALE_VERSION"
            - "Veteran.${vet_id}.award_status == DRAFT"

      - name: occ_correct_veteran_version_succeeds
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[award-activate-stale-veteran]", state_machines.Veteran.DRAFT_to_ACTIVE]
        distinguishing_aspect: "Re-reading the veteran after the grant cascade and activating with the fresh version succeeds; award_status -> ACTIVE and version increments."
        test_recipe:
          setup: ["A veteran granted a single 50% condition; version re-read after the cascade."]
          setup_api_calls:
            - call: "POST /veterans"
              payload: { full_name: "OCCok Vet", file_number: "FN-C-OCCOK", total_active_duty_days: 1095 }
              as: ClaimsAdmin
              captures: { vet_id: $.data.id }
            - call: "POST /claims"
              payload: { veteran_id: "${vet_id}", claim_type: "ORIGINAL", received_date: "2026-01-01T00:00:00Z" }
              as: ClaimsAdmin
              captures: { claim_id: $.data.id, claim_v: $.data.version }
            - call: "POST /claims/${claim_id}/conditions"
              payload: { veteran_id: "${vet_id}", diagnostic_code: "5260", proposed_rating_pct: 50 }
              as: RatingSpecialist
            - call: "POST /claims/${claim_id}/open-development"
              payload: {}
              as: ClaimsAdmin
            - call: "POST /claims/${claim_id}/rate"
              payload: {}
              as: RatingSpecialist
            - call: "POST /claims/${claim_id}/grant"
              payload: { expected_claim_version: "${claim_v}" }
              as: ClaimsAdmin
            - call: "GET /veterans/${vet_id}"
              payload: {}
              as: ClaimsAdmin
              captures: { vet_v_fresh: $.data.version }
          trigger:
            - call: "POST /veterans/${vet_id}/activate-award"
              payload: { expected_veteran_version: "${vet_v_fresh}" }
              as: ClaimsAdmin
          assert:
            - "Veteran.${vet_id}.award_status == ACTIVE"

      - name: dependent_remove_recomputes_compensation
        claim_type: derived_field_reconciliation
        grounds: [endpoints, calculations.monthly_compensation, entities.Dependent.fields.status]
        distinguishing_aspect: "Removing an ACTIVE spouse from a rating-50 veteran (was 114900 with spouse) recomputes monthly_compensation_cents back to 109900; removed dependent excluded."
        test_recipe:
          setup: ["A veteran granted 50% with one ACTIVE spouse, monthly_compensation_cents=114900."]
          setup_api_calls:
            - call: "POST /veterans"
              payload: { full_name: "DepRem Vet", file_number: "FN-C-DEPREM", total_active_duty_days: 1095 }
              as: ClaimsAdmin
              captures: { vet_id: $.data.id }
            - call: "POST /claims"
              payload: { veteran_id: "${vet_id}", claim_type: "ORIGINAL", received_date: "2026-01-01T00:00:00Z" }
              as: ClaimsAdmin
              captures: { claim_id: $.data.id, claim_v: $.data.version }
            - call: "POST /claims/${claim_id}/conditions"
              payload: { veteran_id: "${vet_id}", diagnostic_code: "5260", proposed_rating_pct: 50 }
              as: RatingSpecialist
            - call: "POST /claims/${claim_id}/open-development"
              payload: {}
              as: ClaimsAdmin
            - call: "POST /claims/${claim_id}/rate"
              payload: {}
              as: RatingSpecialist
            - call: "POST /claims/${claim_id}/grant"
              payload: { expected_claim_version: "${claim_v}" }
              as: ClaimsAdmin
            - call: "POST /veterans/${vet_id}/dependents"
              payload: { relationship: "SPOUSE" }
              as: ClaimsAdmin
              captures: { dep_id: $.data.id }
          trigger:
            - call: "POST /veterans/${vet_id}/dependents/${dep_id}/remove"
              payload: {}
              as: ClaimsAdmin
            - call: "GET /veterans/${vet_id}"
              payload: {}
              as: ClaimsAdmin
          assert:
            - "Before remove: Veteran.${vet_id}.monthly_compensation_cents == 114900"
            - "After remove: Veteran.${vet_id}.monthly_compensation_cents == 109900"

      - name: grant_cascade_chain_covered_by_difficulty
        claim_type: cascading_side_effects
        grounds: [state_machines.Claim.RATED_to_GRANTED]
        excluded_because:
          difficulty_instance: transitive_cascade / grant_cascade_condition_rating_compensation
          rationale: "The depth-3 grant cascade (condition -> combined rating -> compensation) is exercised by the named §1.8 instance."

  # ===========================================================================
  - section: consistency_model
    instances:
      - name: grant_changes_visible_same_request
        claim_type: immediate
        grounds: [state_machines.Claim.RATED_to_GRANTED, entities.Veteran.fields.combined_rating_pct]
        distinguishing_aspect: "Immediate consistency: the grant response and an immediately following GET /veterans/{id} both show combined_rating_pct=40 with no lag."
        test_recipe:
          setup: ["A claim with one 40% condition in RATED state."]
          setup_api_calls:
            - call: "POST /veterans"
              payload: { full_name: "Immed Vet", file_number: "FN-C-IMMED", total_active_duty_days: 1095 }
              as: ClaimsAdmin
              captures: { vet_id: $.data.id }
            - call: "POST /claims"
              payload: { veteran_id: "${vet_id}", claim_type: "ORIGINAL", received_date: "2026-01-01T00:00:00Z" }
              as: ClaimsAdmin
              captures: { claim_id: $.data.id, claim_v: $.data.version }
            - call: "POST /claims/${claim_id}/conditions"
              payload: { veteran_id: "${vet_id}", diagnostic_code: "5260", proposed_rating_pct: 40 }
              as: RatingSpecialist
            - call: "POST /claims/${claim_id}/open-development"
              payload: {}
              as: ClaimsAdmin
            - call: "POST /claims/${claim_id}/rate"
              payload: {}
              as: RatingSpecialist
          trigger:
            - call: "POST /claims/${claim_id}/grant"
              payload: { expected_claim_version: "${claim_v}" }
              as: ClaimsAdmin
            - call: "GET /veterans/${vet_id}"
              payload: {}
              as: ClaimsAdmin
          assert:
            - "Veteran.${vet_id}.combined_rating_pct == 40"
