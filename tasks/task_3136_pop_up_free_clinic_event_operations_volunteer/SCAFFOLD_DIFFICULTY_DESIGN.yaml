# =============================================================================
# §1.8 Scaffold Difficulty Design — Test Targeting Index
# Pop-Up Free Clinic Event Operations & Volunteer Licensing
# =============================================================================
# Two instances per Difficulty Rule (9 rules x 2 = 18 instances).
# Every instance grounds in SCAFFOLD.yaml §1.1–§1.7 and is reachable from
# empty-DB via the declared §1.5 endpoint surface.
# =============================================================================

scaffold_difficulty_design:

  # ---------------------------------------------------------------------------
  # Rule 1 — dual_variant_calc (different entity domains)
  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: station_throughput_optimistic_vs_pessimistic_projection
        grounds:
          - calculations.projected_servable_patients
          - entities.ClinicEvent.fields.projected_servable_patients
          - entities.ServiceStation.fields.status
        distinguishing_aspect: |
          Station-throughput projection on the ServiceStation/ClinicEvent domain:
          with one OPERATIONAL 3-chair dental station and one DEGRADED 3-chair
          dental station (480-minute windows, 30 min/patient), the pessimistic
          variant (DEGRADED at floor(3/2)=1 chair) yields 48+16=64 while the
          optimistic variant (DEGRADED at full chair_count) yields 48+48=96 —
          same inputs, different valid outputs. The DEGRADED station is reached
          by pushing sterilization backlog above STERILIZATION_BACKLOG_MAX.
        test_recipe:
          setup:
            - "Event ev1 with two requires_sterilization DENTAL stations, each chair_count=3, 480-min windows, mpp=30; sterilizer unpacked; one completed cycle clearing both stations; both OPERATIONAL"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /sites"
              payload: { site_name: "Civic Arena", site_type: "ARENA", state_code: "TN", square_footage: 40000, has_loading_dock: true, power_capacity_kw: 200.0, sterilization_capable: true }
              as: LogisticsCoordinator
              captures: { site1: $.data.id }
            - call: "POST /sites/${site1}/vet"
              payload: {}
              as: LogisticsCoordinator
            - call: "POST /clinic-events"
              payload: { event_code: "RAM-TN-01", name: "Knoxville Clinic", host_state_code: "TN", service_date: "2026-10-03", doors_open_utc: "2026-10-03T10:00:00Z", total_patient_capacity: 500 }
              as: EventDirector
              captures: { ev1: $.data.id, ev1_v: $.data.version }
            - call: "POST /clinic-events/${ev1}/site-agreements"
              payload: { site_id: "${site1}", host_org_name: "Arena Authority", liability_cap_cents: 90000000, insurance_certificate_ref: "CERT-1", expected_event_version: "${ev1_v}" }
              as: LogisticsCoordinator
              captures: { ag1: $.data.id }
            - call: "POST /clinic-events/${ev1}/site-agreements/${ag1}/submit"
              payload: {}
              as: LogisticsCoordinator
            - call: "POST /clinic-events/${ev1}/site-agreements/${ag1}/confirm"
              payload: {}
              as: EventDirector
            - call: "POST /clinic-events/${ev1}/manifests"
              payload: { manifest_label: "T-01", item_count: 30, weight_kg: 1200.0, requires_loading_dock: true, contains_sterilizer: true }
              as: LogisticsCoordinator
              captures: { mf1: $.data.id }
            - call: "POST /clinic-events/${ev1}/manifests/${mf1}/ship"
              payload: {}
              as: LogisticsCoordinator
            - call: "POST /clinic-events/${ev1}/manifests/${mf1}/deliver"
              payload: {}
              as: LogisticsCoordinator
            - call: "POST /clinic-events/${ev1}/manifests/${mf1}/unpack"
              payload: {}
              as: LogisticsCoordinator
            - call: "POST /clinic-events/${ev1}/stations"
              payload: { station_label: "DENTAL-01", station_type: "DENTAL", chair_count: 3, minutes_per_patient: 30, requires_sterilization: true, service_window_open_utc: "2026-10-03T11:00:00Z", service_window_close_utc: "2026-10-03T19:00:00Z" }
              as: LogisticsCoordinator
              captures: { st1: $.data.id }
            - call: "POST /clinic-events/${ev1}/stations"
              payload: { station_label: "DENTAL-02", station_type: "DENTAL", chair_count: 3, minutes_per_patient: 30, requires_sterilization: true, service_window_open_utc: "2026-10-03T11:00:00Z", service_window_close_utc: "2026-10-03T19:00:00Z" }
              as: LogisticsCoordinator
              captures: { st2: $.data.id }
            - call: "POST /clinic-events/${ev1}/stations/${st1}/mark-set-up"
              payload: {}
              as: LogisticsCoordinator
            - call: "POST /clinic-events/${ev1}/stations/${st2}/mark-set-up"
              payload: {}
              as: LogisticsCoordinator
            - call: "POST /clinic-events/${ev1}/sterilization-cycles"
              payload: { instrument_batch_size: 2 }
              as: SterilizationTech
              captures: { cyc1a: $.data.id }
            - call: "POST /clinic-events/${ev1}/sterilization-cycles/${cyc1a}/complete"
              payload: {}
              as: SterilizationTech
            - call: "POST /clinic-events/${ev1}/stations/${st1}/mark-operational"
              payload: {}
              as: StationLead
            - call: "POST /clinic-events/${ev1}/stations/${st2}/mark-operational"
              payload: {}
              as: StationLead
          trigger:
            # degrade ONLY st2's effective contribution: backlog > 6 flips both
            # requires_sterilization stations to DEGRADED; to isolate st2 we take
            # st1 OFFLINE first (OFFLINE is excluded from the projection entirely),
            # then drive the backlog over the threshold so st2 degrades alone.
            - call: "POST /clinic-events/${ev1}/stations/${st1}/take-offline"
              payload: {}
              as: StationLead
            - call: "POST /clinic-events/${ev1}/sterilization-cycles"
              payload: { instrument_batch_size: 7 }
              as: SterilizationTech
              captures: { cyc1b: $.data.id }
            - call: "GET /clinic-events/${ev1}"
              payload: {}
              as: EventDirector
              captures: { ev1_projection: $.data.projected_servable_patients }
          assert:
            - "ServiceStation.${st2}.status == DEGRADED (backlog 7 > 6)"
            - "ServiceStation.${st1}.status == OFFLINE (excluded from projection)"
            - "ClinicEvent.${ev1}.projected_servable_patients == 16 (pessimistic variant persisted: only DEGRADED st2 contributes floor(floor(3/2)*480/30)=floor(1*480/30)=16; the optimistic variant would give 48 for the same station — variants diverge by 32 on identical station data)"

      - name: host_cost_share_provisional_uncapped_vs_final_capped
        grounds:
          - calculations.host_cost_share
          - entities.SiteAgreement.fields.cost_share_cents
          - state_machines.SiteAgreement.NEGOTIATING_to_CONFIRMED
        distinguishing_aspect: |
          Host cost share on the SiteAgreement/Site fiscal domain (different
          entity domain from station throughput): a DRAFT agreement shows the
          provisional uncapped variant (1,120,000 cents for an ARENA at 35,000
          sqft) while the CONFIRMED agreement persists the final capped variant
          min(1,120,000, liability_cap_cents=900,000) = 900,000 — same inputs,
          cap truncation makes the variants diverge.
        test_recipe:
          setup:
            - "VETTED ARENA site at 35,000 sqft; event in PLANNING; one DRAFT agreement with liability_cap_cents=900000"
          setup_api_calls:
            - call: "POST /sites"
              payload: { site_name: "Big Arena", site_type: "ARENA", state_code: "KY", square_footage: 35000, has_loading_dock: true, power_capacity_kw: 300.0, sterilization_capable: true }
              as: LogisticsCoordinator
              captures: { site2: $.data.id }
            - call: "POST /sites/${site2}/vet"
              payload: {}
              as: LogisticsCoordinator
            - call: "POST /clinic-events"
              payload: { event_code: "RAM-KY-01", name: "Lexington Clinic", host_state_code: "KY", service_date: "2026-11-07", doors_open_utc: "2026-11-07T10:00:00Z", total_patient_capacity: 400 }
              as: EventDirector
              captures: { ev2: $.data.id, ev2_v: $.data.version }
            - call: "POST /clinic-events/${ev2}/site-agreements"
              payload: { site_id: "${site2}", host_org_name: "Arena Board", liability_cap_cents: 900000, insurance_certificate_ref: "CERT-2", expected_event_version: "${ev2_v}" }
              as: LogisticsCoordinator
              captures: { ag2: $.data.id, ag2_provisional: $.data.cost_share_cents }
            - call: "POST /clinic-events/${ev2}/site-agreements/${ag2}/submit"
              payload: {}
              as: LogisticsCoordinator
          trigger:
            - call: "POST /clinic-events/${ev2}/site-agreements/${ag2}/confirm"
              payload: {}
              as: EventDirector
              captures: { ag2_final: $.data.cost_share_cents }
          assert:
            - "SiteAgreement.${ag2} provisional cost_share_cents at creation == 1120000 (uncapped variant)"
            - "SiteAgreement.${ag2} cost_share_cents after confirm == 900000 (capped at liability_cap_cents)"
            - "ClinicEvent.${ev2}.posture == SITE_LOCKED"

  # ---------------------------------------------------------------------------
  # Rule 2 — combinatorial_formula (different modes: (b) rounding-order and (a) nested min/max)
  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: throughput_round_per_station_then_sum_pinned
        grounds:
          - calculations.projected_servable_patients
        distinguishing_aspect: |
          Mode (b) nested rounding order: the formula pins floor PER STATION
          before summation. A 5-chair station at 100-minute window and 30
          min/patient contributes floor(500/30)=16; two such stations yield 32.
          Sum-then-floor would give floor(1000/30)=33 — a different integer.
        test_recipe:
          setup:
            - "Event with two OPERATIONAL dental stations, each chair_count=5, window 100 min, minutes_per_patient=30"
          setup_api_calls:
            - call: "POST /sites"
              payload: { site_name: "School Gym", site_type: "SCHOOL", state_code: "VA", square_footage: 8000, has_loading_dock: false, power_capacity_kw: 100.0, sterilization_capable: false }
              as: LogisticsCoordinator
              captures: { site3: $.data.id }
            - call: "POST /sites/${site3}/vet"
              payload: {}
              as: LogisticsCoordinator
            - call: "POST /clinic-events"
              payload: { event_code: "RAM-VA-01", name: "Wise County", host_state_code: "VA", service_date: "2026-10-10", doors_open_utc: "2026-10-10T10:00:00Z", total_patient_capacity: 200 }
              as: EventDirector
              captures: { ev3: $.data.id, ev3_v: $.data.version }
            - call: "POST /clinic-events/${ev3}/site-agreements"
              payload: { site_id: "${site3}", host_org_name: "School Board", liability_cap_cents: 5000000, insurance_certificate_ref: "CERT-3", expected_event_version: "${ev3_v}" }
              as: LogisticsCoordinator
              captures: { ag3: $.data.id }
            - call: "POST /clinic-events/${ev3}/site-agreements/${ag3}/submit"
              payload: {}
              as: LogisticsCoordinator
            - call: "POST /clinic-events/${ev3}/site-agreements/${ag3}/confirm"
              payload: {}
              as: EventDirector
            - call: "POST /clinic-events/${ev3}/stations"
              payload: { station_label: "DENTAL-A", station_type: "DENTAL", chair_count: 5, minutes_per_patient: 30, requires_sterilization: false, service_window_open_utc: "2026-10-10T11:00:00Z", service_window_close_utc: "2026-10-10T12:40:00Z" }
              as: LogisticsCoordinator
              captures: { stA: $.data.id }
            - call: "POST /clinic-events/${ev3}/stations"
              payload: { station_label: "DENTAL-B", station_type: "DENTAL", chair_count: 5, minutes_per_patient: 30, requires_sterilization: false, service_window_open_utc: "2026-10-10T11:00:00Z", service_window_close_utc: "2026-10-10T12:40:00Z" }
              as: LogisticsCoordinator
              captures: { stB: $.data.id }
            - call: "POST /clinic-events/${ev3}/stations/${stA}/mark-set-up"
              payload: {}
              as: LogisticsCoordinator
            - call: "POST /clinic-events/${ev3}/stations/${stB}/mark-set-up"
              payload: {}
              as: LogisticsCoordinator
            - call: "POST /clinic-events/${ev3}/stations/${stA}/mark-operational"
              payload: {}
              as: StationLead
            - call: "POST /clinic-events/${ev3}/stations/${stB}/mark-operational"
              payload: {}
              as: StationLead
          trigger:
            - call: "GET /clinic-events/${ev3}"
              payload: {}
              as: EventDirector
          assert:
            - "ClinicEvent.${ev3}.projected_servable_patients == 32 (floor(5*100/30)=16 per station, 16+16; sum-then-floor 33 is the forbidden order)"
            - "ClinicEvent.${ev3}.dental_chair_count == 10"

      - name: coverage_score_nested_min_max_weights
        grounds:
          - calculations.discipline_coverage_score
        distinguishing_aspect: |
          Mode (a) >=3 inputs with non-linear interaction: coverage score nests
          per-discipline min(authorized/max(stations,1), 1.0) inside a weighted
          sum with tiered weights (0.5/0.3/0.2) and round_half_up — the
          per-discipline cap at 1.0 makes an over-staffed DENTAL (3 authorized
          for 2 stations) contribute exactly 0.5, not 0.75.
        test_recipe:
          setup:
            - "Event with 2 DENTAL stations SET_UP, 3 AUTHORIZED DENTAL volunteers with ROSTERED assignments, 0 VISION/MEDICAL stations and 0 VISION/MEDICAL volunteers"
          setup_api_calls:
            - call: "POST /sites"
              payload: { site_name: "Fairground", site_type: "FAIRGROUND", state_code: "VA", square_footage: 25000, has_loading_dock: true, power_capacity_kw: 150.0, sterilization_capable: true }
              as: LogisticsCoordinator
              captures: { site4: $.data.id }
            - call: "POST /sites/${site4}/vet"
              payload: {}
              as: LogisticsCoordinator
            - call: "POST /clinic-events"
              payload: { event_code: "RAM-VA-02", name: "Richmond Clinic", host_state_code: "VA", service_date: "2026-10-17", doors_open_utc: "2026-10-17T10:00:00Z", total_patient_capacity: 300 }
              as: EventDirector
              captures: { ev4: $.data.id, ev4_v: $.data.version }
            - call: "POST /clinic-events/${ev4}/site-agreements"
              payload: { site_id: "${site4}", host_org_name: "Fair Authority", liability_cap_cents: 5000000, insurance_certificate_ref: "CERT-4", expected_event_version: "${ev4_v}" }
              as: LogisticsCoordinator
              captures: { ag4: $.data.id }
            - call: "POST /clinic-events/${ev4}/site-agreements/${ag4}/submit"
              payload: {}
              as: LogisticsCoordinator
            - call: "POST /clinic-events/${ev4}/site-agreements/${ag4}/confirm"
              payload: {}
              as: EventDirector
            - call: "POST /clinic-events/${ev4}/stations"
              payload: { station_label: "D-1", station_type: "DENTAL", chair_count: 2, minutes_per_patient: 40, requires_sterilization: false, service_window_open_utc: "2026-10-17T11:00:00Z", service_window_close_utc: "2026-10-17T19:00:00Z" }
              as: LogisticsCoordinator
              captures: { d1: $.data.id }
            - call: "POST /clinic-events/${ev4}/stations"
              payload: { station_label: "D-2", station_type: "DENTAL", chair_count: 2, minutes_per_patient: 40, requires_sterilization: false, service_window_open_utc: "2026-10-17T11:00:00Z", service_window_close_utc: "2026-10-17T19:00:00Z" }
              as: LogisticsCoordinator
              captures: { d2: $.data.id }
            - call: "POST /clinic-events/${ev4}/stations/${d1}/mark-set-up"
              payload: {}
              as: LogisticsCoordinator
            - call: "POST /clinic-events/${ev4}/stations/${d2}/mark-set-up"
              payload: {}
              as: LogisticsCoordinator
            - call: "POST /volunteers"
              payload: { full_name: "Dentist One", email: "d1@x.com", discipline: "DENTAL", license_number: "L-D1", license_state_code: "VA", license_expiry_date: "2027-01-01" }
              as: VolunteerCoordinator
              captures: { v_d1: $.data.id }
            - call: "POST /volunteers"
              payload: { full_name: "Dentist Two", email: "d2@x.com", discipline: "DENTAL", license_number: "L-D2", license_state_code: "VA", license_expiry_date: "2027-01-01" }
              as: VolunteerCoordinator
              captures: { v_d2: $.data.id }
            - call: "POST /volunteers"
              payload: { full_name: "Dentist Three", email: "d3@x.com", discipline: "DENTAL", license_number: "L-D3", license_state_code: "VA", license_expiry_date: "2027-01-01" }
              as: VolunteerCoordinator
              captures: { v_d3: $.data.id }
            - call: "POST /volunteers/${v_d1}/request-verification"
              payload: { clinic_event_id: "${ev4}", reviewer_notes: "ok" }
              as: VolunteerCoordinator
              captures: { lv_d1: $.data.id }
            - call: "POST /volunteers/${v_d1}/license-verifications/${lv_d1}/approve"
              payload: {}
              as: CredentialingOfficer
            - call: "POST /volunteers/${v_d2}/request-verification"
              payload: { clinic_event_id: "${ev4}", reviewer_notes: "ok" }
              as: VolunteerCoordinator
              captures: { lv_d2: $.data.id }
            - call: "POST /volunteers/${v_d2}/license-verifications/${lv_d2}/approve"
              payload: {}
              as: CredentialingOfficer
            - call: "POST /volunteers/${v_d3}/request-verification"
              payload: { clinic_event_id: "${ev4}", reviewer_notes: "ok" }
              as: VolunteerCoordinator
              captures: { lv_d3: $.data.id }
            - call: "POST /volunteers/${v_d3}/license-verifications/${lv_d3}/approve"
              payload: {}
              as: CredentialingOfficer
            - call: "POST /clinic-events/${ev4}/assignments"
              payload: { volunteer_id: "${v_d1}", shift_code: "FULL_DAY" }
              as: VolunteerCoordinator
            - call: "POST /clinic-events/${ev4}/assignments"
              payload: { volunteer_id: "${v_d2}", shift_code: "FULL_DAY" }
              as: VolunteerCoordinator
            - call: "POST /clinic-events/${ev4}/assignments"
              payload: { volunteer_id: "${v_d3}", shift_code: "FULL_DAY" }
              as: VolunteerCoordinator
            - call: "GET /clinic-events/${ev4}"
              payload: {}
              as: EventDirector
              captures: { ev4_v_now: $.data.version }
            - call: "POST /volunteers/${v_d1}/authorize"
              payload: { clinic_event_id: "${ev4}", expected_event_version: "${ev4_v_now}" }
              as: VolunteerCoordinator
            - call: "GET /clinic-events/${ev4}"
              payload: {}
              as: EventDirector
              captures: { ev4_v_now2: $.data.version }
            - call: "POST /volunteers/${v_d2}/authorize"
              payload: { clinic_event_id: "${ev4}", expected_event_version: "${ev4_v_now}" }
              as: VolunteerCoordinator
            - call: "POST /volunteers/${v_d3}/authorize"
              payload: { clinic_event_id: "${ev4}", expected_event_version: "${ev4_v_now2}" }
              as: VolunteerCoordinator
          trigger:
            - call: "GET /clinic-events/${ev4}"
              payload: {}
              as: EventDirector
          assert:
            - "ClinicEvent.${ev4}.verified_volunteer_count == 3"
            - "coverage_DENTAL capped at min(3/2, 1.0) = 1.0; score = round_half_up(100 * 0.5 * 1.0, 2) = 50.0, NOT 75.0 (per-discipline cap is the non-linear interaction)"

  # ---------------------------------------------------------------------------
  # Rule 3 — non_linear_state_machine (different entities)
  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: volunteer_suspend_reinstate_cycle
        grounds:
          - state_machines.Volunteer.AUTHORIZED_to_SUSPENDED
          - state_machines.Volunteer.SUSPENDED_to_VERIFIED
          - state_machines.Volunteer.VERIFIED_to_AUTHORIZED
        distinguishing_aspect: |
          Volunteer machine contains a true cycle AUTHORIZED -> SUSPENDED ->
          VERIFIED -> AUTHORIZED (revision loop), distinct from a linear
          pipeline: the same volunteer can traverse AUTHORIZED twice, and each
          suspension releases assignments while reinstatement does not restore
          them (asymmetric cycle effects).
        test_recipe:
          setup:
            - "Event ev5 SITE_LOCKED; one AUTHORIZED dental volunteer with a ROSTERED assignment"
          setup_api_calls:
            - call: "POST /sites"
              payload: { site_name: "Fairground F", site_type: "FAIRGROUND", state_code: "TN", square_footage: 20000, has_loading_dock: true, power_capacity_kw: 120.0, sterilization_capable: true }
              as: LogisticsCoordinator
              captures: { site5: $.data.id }
            - call: "POST /sites/${site5}/vet"
              payload: {}
              as: LogisticsCoordinator
            - call: "POST /clinic-events"
              payload: { event_code: "RAM-TN-02", name: "Chattanooga", host_state_code: "TN", service_date: "2026-10-24", doors_open_utc: "2026-10-24T10:00:00Z", total_patient_capacity: 250 }
              as: EventDirector
              captures: { ev5: $.data.id, ev5_v: $.data.version }
            - call: "POST /clinic-events/${ev5}/site-agreements"
              payload: { site_id: "${site5}", host_org_name: "Fair Board", liability_cap_cents: 5000000, insurance_certificate_ref: "C5", expected_event_version: "${ev5_v}" }
              as: LogisticsCoordinator
              captures: { ag5: $.data.id }
            - call: "POST /clinic-events/${ev5}/site-agreements/${ag5}/submit"
              payload: {}
              as: LogisticsCoordinator
            - call: "POST /clinic-events/${ev5}/site-agreements/${ag5}/confirm"
              payload: {}
              as: EventDirector
            - call: "POST /volunteers"
              payload: { full_name: "Dent A", email: "da@x.com", discipline: "DENTAL", license_number: "L-DA", license_state_code: "TN", license_expiry_date: "2027-01-01" }
              as: VolunteerCoordinator
              captures: { v5: $.data.id }
            - call: "POST /volunteers/${v5}/request-verification"
              payload: { clinic_event_id: "${ev5}", reviewer_notes: "ok" }
              as: VolunteerCoordinator
              captures: { lv5: $.data.id }
            - call: "POST /volunteers/${v5}/license-verifications/${lv5}/approve"
              payload: {}
              as: CredentialingOfficer
            - call: "POST /clinic-events/${ev5}/assignments"
              payload: { volunteer_id: "${v5}", shift_code: "FULL_DAY" }
              as: VolunteerCoordinator
              captures: { asg5: $.data.id }
            - call: "GET /clinic-events/${ev5}"
              payload: {}
              as: EventDirector
              captures: { ev5_v1: $.data.version }
            - call: "POST /volunteers/${v5}/authorize"
              payload: { clinic_event_id: "${ev5}", expected_event_version: "${ev5_v1}" }
              as: VolunteerCoordinator
          trigger:
            - call: "POST /volunteers/${v5}/suspend"
              payload: { clinic_event_id: "${ev5}", suspension_reason: "license audit" }
              as: VolunteerCoordinator
            - call: "POST /volunteers/${v5}/reinstate"
              payload: { clinic_event_id: "${ev5}" }
              as: VolunteerCoordinator
            - call: "GET /clinic-events/${ev5}"
              payload: {}
              as: EventDirector
              captures: { ev5_v2: $.data.version }
            - call: "POST /volunteers/${v5}/authorize"
              payload: { clinic_event_id: "${ev5}", expected_event_version: "${ev5_v2}" }
              as: VolunteerCoordinator
          assert:
            - "Volunteer.${v5}.status == AUTHORIZED after full cycle (AUTHORIZED -> SUSPENDED -> VERIFIED -> AUTHORIZED)"
            - "DisciplineAssignment.${asg5}.status == RELEASED (suspension cascade fired; reinstatement did NOT restore the assignment — asymmetric cycle)"

      - name: station_operational_degraded_operational_sterilization_loop
        grounds:
          - state_machines.ServiceStation.OPERATIONAL_to_DEGRADED
          - state_machines.ServiceStation.DEGRADED_to_OPERATIONAL
        distinguishing_aspect: |
          ServiceStation machine contains a system-driven bounded cycle
          OPERATIONAL -> DEGRADED -> OPERATIONAL driven by the sterilization
          backlog threshold — a different entity than Volunteer and a cyclic
          shape triggered by aggregate state, not by a direct API call.
        test_recipe:
          setup:
            - "Event ev6 READY-> with a requires_sterilization DENTAL station OPERATIONAL; an UNPACKED sterilizer manifest; sterilization cycles startable"
