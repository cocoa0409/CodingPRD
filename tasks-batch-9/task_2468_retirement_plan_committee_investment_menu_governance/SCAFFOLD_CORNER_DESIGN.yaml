              payload: { attendee_member_ids: ["${mem_chair_id}"] }
              as: CommitteeChair
              as_user_id: "${mem_chair_id}"
          assert:
            - "at fiscal_quarter_index 7 the chair's three records are still COMPLETED / WAIVED / WAIVED with completed_quarter_index 0, and CommitteeMember.${mem_chair_id}.fiduciary_training_status is unchanged — 7 - 0 == 7 < 8"
            - "the ${meet_q7_id} convene returned 200 with quorum_met true, proving all three members still counted toward eligible_voting_seat_count at gap 7"
            - "the eighth advance-quarter moved Plan.${plan_id}.fiscal_quarter_index to 8 and flipped all nine training records (three per member) to EXPIRED in one system pass, since 0 + 8 <= 8 holds with equality"
            - "the vote on ${motion_q7_id} returned 409 with data.error_id == ERR_TRAINING_NOT_CURRENT and the motion still has for_count == 0 — priority 50 fires before any tally work"
            - "the ${meet_q7_id} adjourn returned 200 (adjourn has no training gate) and the OPEN motion was WITHDRAWN by the cascade"
            - "the ${meet_q7_id} minutes-approve returned 409 with data.error_id == ERR_TRAINING_NOT_CURRENT even though the meeting's frozen quorum_met is true: the training gate at 50 outranks the quorum gate at 58, so the meeting can never reach MINUTES_APPROVED"
            - "the meeting's frozen eligible_voting_seat_count and voting_attendee_count are still 3 — expiry does not rewrite already-convened figures, only future ones"
            - "after the three fresh records the chair's new FIDUCIARY_DUTIES record has completed_quarter_index == 8 and status COMPLETED, and the two waivers likewise stamp completed_quarter_index 8; the eight-quarter clock restarted from the new index rather than from the original completion"
            - "the ${meet_q8_id} convene returned 200: the chair alone is enough to convene, because quorum_met == false does not block convening (it will be false here, 1 >= 3 failing)"
            - "SPEC CONFLICT recorded, not asserted: §1.3 names the required module set as {FIDUCIARY_DUTIES, PROHIBITED_TRANSACTIONS, INVESTMENT_BASICS} while §1.2 activation names {FIDUCIARY_DUTIES, IPS_MECHANICS}, and INVESTMENT_BASICS is not a member of the module_code enum. This recipe refreshes all three assignable modules so it passes under either reading; under the literal §1.3 set no member could ever be CURRENT and chain_l3 itself would be unbuildable."

      - name: provider_cost_passes_run_a_then_b_then_c_and_the_tier_never_reads_the_total
        claim_type: Correct Result
        grounds:
          - calculations.total_provider_cost_bps
          - state_machines.ServiceProviderEngagement.PENDING_to_ACTIVE
          - errors.ERR_NO_PLAN_ASSETS
        distinguishing_aspect: "Four engagements in four different provider roles, benchmarked against the same 1,200,000,000-cent asset base and 1,200 accounts, land on 25.00 (TIER_A ceiling), 25.01 (one bp past it), 45.00 (TIER_B ceiling) and 70.00 (TIER_C, which trips rfp_required on the total > 60.00 arm and cascades ACTIVE -> UNDER_RFP inside one call). A re-benchmark in the next quarter flips the cheapest engagement into UNDER_RFP on the percentile arm alone at exactly 75, and a same-quarter repeat and a zero-asset plan supply the two rejections."
        test_recipe:
          setup:
            - "chain_l3 is replayed: Plan.total_plan_assets_cents == 1200000000 (LCGRA 800000000 + BNDIX 400000000) and Plan.participant_account_count == 1200, so head_cost_bps == per_head_fee_cents * 1200 * 10000 / 1200000000 == per_head_fee_cents / 100."
            - "Four engagements are registered in four distinct provider_roles so no term overlap can fire; all four share the term 2026-01-01..2027-12-31 and seed last_rfp_quarter_index 0, keeping the null and >= 20 RFP arms quiet."
            - "A second plan with no funds at all is created to drive the divide-by-zero guard."
