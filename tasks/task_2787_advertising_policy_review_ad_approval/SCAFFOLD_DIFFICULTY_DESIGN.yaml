            - call: "GET /ad-policy/review-tasks"
              payload: { ad_creative_id: "${cr_disc_id}" }
              as: PolicyAdmin
              captures: { td_id: "$.data[0].id" }
            - call: "POST /ad-policy/review-tasks/${tn_id}/claim"
              payload: {}
              as: PolicyReviewer
              as_user_id: "${rev_id}"
            - call: "POST /ad-policy/review-tasks/${td_id}/claim"
              payload: {}
              as: PolicyReviewer
              as_user_id: "${rev_id}"
          trigger:
            - call: "POST /ad-policy/review-tasks/${tn_id}/decision"
              payload: { resolution: "APPROVE_WITH_LIMITS", limited_country_codes: ["US"], note: "Approving for US only." }
              as: PolicyReviewer
              as_user_id: "${rev_id}"
            - call: "POST /ad-policy/review-tasks/${td_id}/decision"
              payload: { resolution: "APPROVE_WITH_LIMITS", limited_country_codes: ["US"], note: "Approving for US only." }
              as: PolicyReviewer
              as_user_id: "${rev_id}"
            - call: "GET /ad-policy/reviewers/${rev_id}"
              payload: {}
              as: PolicyAdmin
          assert:
            - "The first trigger call returns 422 with error_id ERR_POLITICAL_DISCLOSURE_MISSING, never ERR_CERTIFICATION_MISSING and never ERR_POLITICAL_ELIGIBILITY_MISSING"
            - "The second trigger call returns 422 with error_id ERR_CERTIFICATION_MISSING, proving priority 70 was also violated by the first request"
            - "AdCreative.${cr_nodisc_id}.review_status == PENDING_MANUAL_REVIEW with limited_country_codes == [] and approved_under_certification_id == null"
            - "AdCreative.${cr_disc_id}.review_status == PENDING_MANUAL_REVIEW with limited_country_codes == [] and approved_under_certification_id == null"
