      - name: tax_roll_posting_and_commission_submission_are_not_repeatable
        claim_type: violation_to_error
        grounds:
          - validations[priority=44]
          - validations[priority=45]
          - validations[priority=31]
          - calculations.tax_roll_proration
        distinguishing_aspect: |
          On a statute that does not require boundary-commission review the case reaches
          ORDINANCE_ADOPTED with commission_review_status NOT_REQUIRED, so submitting to the
          commission is refused with ERR_COMMISSION_REVIEW_NOT_PENDING even though
          ORDINANCE_ADOPTED is a declared from-state for that transition — the review flag, not the
          status, is the gate. Posting the tax roll then succeeds exactly once (224,658 cents over
          82 remaining fiscal-year days) and the repeat is refused on tax_roll_status, while
          re-effectuating an EFFECTIVE case is refused on status.
        test_recipe:
          setup:
            - "An INVOLUNTARY_ORDINANCE case carried to ORDINANCE_ADOPTED with the clock at 2026-10-11T09:00:00Z under the default effective_date_rule IMMEDIATE and boundary_commission_required false."
