      - name: ttp_rounds_the_monthly_income_before_the_percentage_not_after
        claim_type: Precision
        grounds:
          - calculations.tenant_rent_recalculation
          - entities.TenantCertification.fields.ttp_cents
        distinguishing_aspect: "An annual adjusted income of 600174 divides into 50014.5 cents a month, which must round half-up to 50015 BEFORE the 30 percent is taken: 0.3 * 50015 = 15004.5 rounds half-up to 15005, whereas deferring the division rounds 0.3 * 50014.5 = 15004.35 down to 15004. Both rounding steps are half-up and both matter; the single-cent difference propagates into tenant_rent_cents and hap_cents."
        test_recipe:
          setup: ["Owner, property with baseline allowance 11500, contract at 118000, one household with annual_adjusted_income_cents 600174 and annual_gross_income_cents 600174."]
          setup_api_calls:
            - call: "POST /pbra/owners"
              payload: { legal_name: "Cedar Ridge Housing Partners LP", tin: "27-3310011", contact_email: "agent@cedarridge.example" }
