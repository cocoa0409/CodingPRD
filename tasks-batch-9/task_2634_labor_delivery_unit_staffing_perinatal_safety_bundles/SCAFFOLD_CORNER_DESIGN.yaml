      - name: both_support_pass_ids_from_four_reentry_laps_and_one_pass_that_expires_without_a_sweep
        claim_type: Error Triggerability
        grounds: |
          §1.6 ERR_SUPPORT_REENTRY_LIMIT_REACHED (409) and ERR_SUPPORT_PASS_EXPIRED (422); §1.2
          SupportPersonPass (shape cyclic_reentry; check-in preconditions "clock_now < valid_until" and,
          "When coming from CHECKED_OUT: reentry_count < REENTRY_LIMIT (3)"; ISSUED|CHECKED_OUT -> EXPIRED
          happens only inside POST /obstetric-units/{unitId}/capacity-sweep); §1.5
          POST /support-person-passes (valid_until := created_at + PASS_VALID_HOURS 24),
          /check-in (priority ladder 8 -> 8.01 -> 8.1 -> 11.6 -> 15) and /check-out; §1.3
          support_person_occupancy (the INDUCTION_FROZEN clamp holds the allowance at 1).
        distinguishing_aspect: |
          reentry_count is proven to count RE-entries and not entries: the first check-in leaves it 0 and
          only the returns increment it, so the fourth return is the one that is refused. The expiry probe
          lands on the exact valid_until instant with NO capacity-sweep in the chain, which separates two
          things an implementation loves to conflate - the pass ROW is still ISSUED (only the sweep may
          rewrite it to EXPIRED) while the check-in ACTION is already refused 422, because the guard reads
          the clock rather than the stored status. A sweep-driven implementation would instead answer
          ERR_INVALID_STATE_TRANSITION or let the check-in through.
        test_recipe:
          setup: |
            Clock 2026-08-01T06:00:00Z. One unit with two LDR beds and one ANTEPARTUM encounter holding
            LDR-01. The unit is left in its fresh state (cesarean_readiness_state NOT_READY, so posture is
            INDUCTION_FROZEN and calc support_person_occupancy clamps the allowance to 1), which is why the
            two passes are never checked in at the same time. Two PARTNER passes are issued on the encounter
            at 06:00, so both carry valid_until 2026-08-02T06:00:00Z.
          setup_api_calls:
            - call: POST /_clock/set_current_utc
              payload: { current_utc: "2026-08-01T06:00:00Z" }
              as: PerinatalSafetyOfficer
              as_user_id: "safety-officer-bootstrap"
            - call: POST /obstetric-units
              payload: { unit_name: "Larkspur Meadows Birth Center LDR", licensed_ldr_beds: 3, licensed_or_rooms: 1 }
              as: PerinatalSafetyOfficer
              as_user_id: "safety-officer-bootstrap"
              captures: { unit_id: $.data.id }
            - call: POST /obstetric-units/${unit_id}/beds
              payload: { bed_label: "LDR-01", bed_type: "LDR" }
              as: PerinatalSafetyOfficer
              as_user_id: "safety-officer-bootstrap"
              captures: { bed_ldr1: $.data.id }
            - call: POST /obstetric-units/${unit_id}/beds
              payload: { bed_label: "LDR-02", bed_type: "LDR" }
              as: PerinatalSafetyOfficer
              as_user_id: "safety-officer-bootstrap"
            - call: POST /labor-encounters
              payload: { unit_id: "${unit_id}", patient_record_code: "PRC-LARK-2201", parity: 3, gestational_age_weeks: 40 }
              as: ChargeNurse
              as_user_id: "charge-nurse-01"
              captures: { enc_id: $.data.id }
            - call: POST /labor-encounters/${enc_id}/assign-bed
              payload: { bed_id: "${bed_ldr1}" }
              as: ChargeNurse
              as_user_id: "charge-nurse-01"
            - call: POST /support-person-passes
              payload: { encounter_id: "${enc_id}", person_name: "Ellery Vandergraaf", credential_type: "PARTNER" }
              as: PatientAccessCoordinator
              as_user_id: "access-coordinator-01"
              captures: { pass_a: $.data.id, valid_a: $.data.valid_until }
            - call: POST /support-person-passes
              payload: { encounter_id: "${enc_id}", person_name: "Marguerite Ashdown", credential_type: "PARTNER" }
              as: PatientAccessCoordinator
              as_user_id: "access-coordinator-01"
              captures: { pass_b: $.data.id, valid_b: $.data.valid_until }
          trigger:
            - call: POST /support-person-passes/${pass_a}/check-in
              payload: {}
              as: PatientAccessCoordinator
              as_user_id: "access-coordinator-01"
              captures: { re0: $.data.reentry_count }
            - call: POST /support-person-passes/${pass_a}/check-out
              payload: {}
              as: PatientAccessCoordinator
              as_user_id: "access-coordinator-01"
            - call: POST /support-person-passes/${pass_a}/check-in
              payload: {}
              as: PatientAccessCoordinator
              as_user_id: "access-coordinator-01"
              captures: { re1: $.data.reentry_count }
            - call: POST /support-person-passes/${pass_a}/check-out
              payload: {}
              as: PatientAccessCoordinator
              as_user_id: "access-coordinator-01"
            - call: POST /support-person-passes/${pass_a}/check-in
              payload: {}
              as: PatientAccessCoordinator
              as_user_id: "access-coordinator-01"
              captures: { re2: $.data.reentry_count }
            - call: POST /support-person-passes/${pass_a}/check-out
              payload: {}
              as: PatientAccessCoordinator
              as_user_id: "access-coordinator-01"
            - call: POST /support-person-passes/${pass_a}/check-in
              payload: {}
              as: PatientAccessCoordinator
              as_user_id: "access-coordinator-01"
              captures: { re3: $.data.reentry_count }
            - call: POST /support-person-passes/${pass_a}/check-out
              payload: {}
              as: PatientAccessCoordinator
              as_user_id: "access-coordinator-01"
            - call: POST /support-person-passes/${pass_a}/check-in
              payload: {}
              as: PatientAccessCoordinator
              as_user_id: "access-coordinator-01"
              captures: { e_reentry: $.data.error_id }
            - call: POST /_clock/set_current_utc
              payload: { current_utc: "2026-08-02T06:00:00Z" }
              as: PerinatalSafetyOfficer
              as_user_id: "safety-officer-bootstrap"
            - call: POST /support-person-passes/${pass_b}/check-in
              payload: {}
              as: PatientAccessCoordinator
              as_user_id: "access-coordinator-01"
              captures: { e_expired: $.data.error_id }
            - call: GET /support-person-passes/${pass_b}
              payload: {}
              as: PatientAccessCoordinator
              as_user_id: "access-coordinator-01"
              captures: { b_status: $.data.status }
            - call: GET /support-person-passes/${pass_a}
              payload: {}
              as: PatientAccessCoordinator
              as_user_id: "access-coordinator-01"
              captures: { a_status: $.data.status, a_re: $.data.reentry_count }
          assert: |
            Both passes are created 201 with status == "ISSUED", reentry_count == 0 and
            valid_until == "2026-08-02T06:00:00Z" (created_at 06:00 + PASS_VALID_HOURS 24).
            Pass A laps: the first check-in is 200 with status == "CHECKED_IN",
            checked_in_at == "2026-08-01T06:00:00Z" and reentry_count == 0 (an entry from ISSUED is not a
            re-entry); the three returns are 200 with reentry_count == 1, 2 and 3 in that order, each with
            checked_out_at reset to null on the way in.
            Fourth return: 409 with error_id == "ERR_SUPPORT_REENTRY_LIMIT_REACHED" (3 < 3 is false) - NOT
            ERR_INVALID_STATE_TRANSITION (CHECKED_OUT is a declared `from:` state) and NOT
            ERR_SUPPORT_OCCUPANCY_EXCEEDED (nobody is checked in); the pass stays CHECKED_OUT with
            reentry_count == 3.
            Pass B at exactly valid_until, with no capacity-sweep anywhere in the chain: 422 with
            error_id == "ERR_SUPPORT_PASS_EXPIRED" - the guard is clock_now < valid_until and the boundary
            instant fails it.
            Final reads: GET /support-person-passes/${pass_b} still reports status == "ISSUED" (never
            EXPIRED, because only the sweep may write that state) with checked_in_at == null, and
            GET /support-person-passes/${pass_a} reports status == "CHECKED_OUT" with reentry_count == 3.

      - name: bed_hold_mismatch_is_a_defensive_guard_with_no_reachable_public_api_path
        claim_type: Error Triggerability
        grounds:
          - errors[ERR_BED_HOLD_MISMATCH]
          - validations[priority=8.07]
          - state_machines.Bed
          - endpoints[POST /induction-bookings/{bookingId}/hold-capacity]
          - endpoints[POST /induction-bookings/{bookingId}/bump]
          - endpoints[POST /induction-bookings/{bookingId}/cancel]
          - endpoints[DELETE /beds/{bedId}]
          - endpoints[PATCH /beds/{bedId}]
        excluded_because:
          difficulty_instance: corner:errors / three_structural_guard_ids_that_only_exist_because_the_specific_over_generic_carve_out_holds
          rationale: |
            ERR_BED_HOLD_MISMATCH would require a CONFIRMED booking whose bed_id points at a Bed that is
            HELD by a *different* booking, and no public sequence in §1.5 can construct that state:
            hold-capacity only accepts an AVAILABLE bed and stamps held_booking_id on it in the same
            write; bump and cancel both null out the booking's bed_id as they release the bed, so a
            released booking never keeps a dangling pointer; PATCH /beds/{bedId} refuses a HELD bed with
            ERR_BED_NOT_RELEASABLE and DELETE /beds/{bedId} refuses any referenced bed (the reachable
            arm of that guard, ERR_BED_HAS_FUTURE_HOLDS, is what the cited instance drives). The id is a
            defensive assertion protecting the admit path against a corrupted pointer, so the reachable
            neighbours on the same 8.07 rung are asserted instead of a state no API caller can reach.

      - name: the_two_stale_unit_version_write_endpoints_are_asserted_in_the_concurrency_layer
        claim_type: Error Triggerability
        grounds:
          - errors[ERR_STALE_UNIT_VERSION]
          - concurrency_rules[induction-hold-stale-unit]
          - concurrency_rules[snapshot-create-stale-unit]
        excluded_because:
          difficulty_instance: corner:cross_cutting_complexity_layers / stale_unit_version_is_refused_on_both_declared_unit_scoped_writes_while_the_refreshed_version_passes
          rationale: |
            ERR_STALE_UNIT_VERSION is declared by two separate §1.2.1 rules over two different write
            endpoints (hold-capacity with expected_unit_version, and quality-measure-snapshot creation
            with the same field). Asserting it once here would leave the second endpoint untested, so the
            id is claimed by the optimistic_concurrency layer instance below, which drives BOTH endpoints
            with a version captured before an intervening unit write and then re-drives each with the
            refreshed version to prove the 412 was about staleness and not about the payload.

      - name: the_three_authorization_ids_are_asserted_across_the_full_six_role_matrix
        claim_type: Error Triggerability
        grounds:
          - errors[ERR_UNKNOWN_ROLE]
          - errors[ERR_INSUFFICIENT_PERMISSIONS]
          - errors[ERR_SEGREGATION_OF_DUTIES_VIOLATION]
          - errors[ERR_CROSS_UNIT_REFERENCE]
          - roles
        excluded_because:
          difficulty_instance: corner:rbac / every_exclusive_operation_denies_the_other_five_roles_while_the_shared_reads_admit_all_six
          rationale: |
            These four ids are role-model claims rather than single-endpoint claims: ERR_UNKNOWN_ROLE and
            ERR_INSUFFICIENT_PERMISSIONS only mean something when swept across the whole §1.7 matrix (the
            priority-1/priority-2 ordering for a single endpoint is already pinned by
            unknown_x_user_role_is_rejected_at_priority_1_before_the_permission_check_at_priority_2 and
            insufficient_permissions_at_priority_2_outranks_a_nonexistent_bed_id_at_priority_3),
            ERR_SEGREGATION_OF_DUTIES_VIOLATION is declared six times over six different pairs, and
            ERR_CROSS_UNIT_REFERENCE is a scoping claim over three unrelated endpoints. The rbac section
            below owns all four, so the errors section keeps only the pointer.

  # ===========================================================================
  # SECTION 7 — rbac.
  # Table 7 of the claim-extraction guide states two bullets per role ("can
  # perform all exclusive_operations and shared_operations", "cannot perform
  # other roles' exclusive_operations") plus a role-model table; this scaffold
  # declares complexity_profile.role_model == "segregation_of_duties", so the
  # "Segregation of duties" row ("same user cannot do step A and step B") is the
  # dominant claim family here and carries one instance per declared SoD pair.
  # The claim_type values below are therefore: Exclusive Operation Denial,
  # Shared Operation Access, Segregation of duties, and the `peer_roles` row
  # ("Role A cannot touch role B's resources") applied to this scaffold's unit
  # scoping. NOTE ON NAMING: the guide says ERR_UNAUTHORIZED; §1.6 of this
  # scaffold names the same 403 ERR_INSUFFICIENT_PERMISSIONS, which is the id
  # asserted below.
  # ===========================================================================
  - section: rbac
    instances:

      - name: every_exclusive_operation_denies_the_other_five_roles_while_the_shared_reads_admit_all_six
        claim_type: Exclusive Operation Denial
        grounds:
          - roles[ChargeNurse].exclusive_operations
          - roles[PerinatalSafetyOfficer].exclusive_operations
          - roles[PatientAccessCoordinator].exclusive_operations
          - roles[BedsideNurse].note
          - roles[AnesthesiaLead].note
          - validations[priority=2]
          - errors[ERR_INSUFFICIENT_PERMISSIONS]
          - endpoints[POST /obstetric-units]
          - endpoints[PATCH /beds/{bedId}]
          - endpoints[POST /induction-bookings/{bookingId}/hold-capacity]
          - endpoints[POST /support-person-passes/{passId}/check-in]
          - endpoints[POST /bundle-activations]
          - endpoints[POST /shift-assignments]
          - endpoints[GET /obstetric-units/{unitId}/readiness-report]
          - endpoints[GET /obstetric-units/{unitId}]
        distinguishing_aspect: |
          §1.7 is NOT a hierarchy and this sweep is what proves it. The PerinatalSafetyOfficer created
          the unit and the bed, yet is refused PATCH /beds/{bedId} — the natural "admin can do anything"
          shortcut dies here. The ChargeNurse, the busiest writer in the scaffold, is refused three
          different neighbours' endpoints, one of which (hold-capacity) would ALSO have failed the
          priority-8.02 posture rung on this INDUCTION_FROZEN unit, so an implementation that checks
          business state before the allow-list returns 409 instead of 403. Two probes attack the shared
          set rather than the exclusive set: POST /bundle-activations and POST /shift-assignments belong
          to nobody exclusively yet still deny the roles outside their two-role allow-list, which
          falsifies "shared means everyone", and GET .../readiness-report denies the
          PatientAccessCoordinator, which falsifies "reads are open". The last probe closes the loop
          from the other side: AnesthesiaLead, whose exclusive_operations is deliberately EMPTY, still
          writes successfully through a co-held endpoint, so an empty exclusive list must not be
          implemented as a read-only role.
        test_recipe:
          setup: |
            Clock 2026-08-01T06:00:00Z. One unit with a single LDR bed, one ANESTHESIOLOGIST staff member
            with a live credential and or_circulating_qualified true, one ANTEPARTUM encounter, one
            ISSUED PARTNER support pass on that encounter, and one REQUESTED induction booking. The unit
            is left fresh, so cesarean_readiness_state is NOT_READY and staffing_posture is
            INDUCTION_FROZEN — which is exactly what makes the hold-capacity probe a two-reason refusal
            and therefore diagnostic.
          setup_api_calls:
            - call: POST /_clock/set_current_utc
              payload: { current_utc: "2026-08-01T06:00:00Z" }
              as: PerinatalSafetyOfficer
              as_user_id: "safety-officer-bootstrap"
            - call: POST /obstetric-units
              payload: { unit_name: "Ashgrove Commons Womens Hospital LDR", licensed_ldr_beds: 4, licensed_or_rooms: 1 }
              as: PerinatalSafetyOfficer
              as_user_id: "safety-officer-bootstrap"
              captures: { unit_id: $.data.id }
            - call: POST /obstetric-units/${unit_id}/beds
              payload: { bed_label: "LDR-01", bed_type: "LDR" }
              as: PerinatalSafetyOfficer
              as_user_id: "safety-officer-bootstrap"
              captures: { bed_ldr1: $.data.id }
            - call: POST /obstetric-units/${unit_id}/staff-members
              payload: { full_name: "Corvin Halloway", staff_role: "ANESTHESIOLOGIST", fetal_monitoring_cert_level: "BASIC", credential_expires_at: "2027-01-01T00:00:00Z", or_circulating_qualified: true }
              as: ChargeNurse
              as_user_id: "charge-nurse-01"
              captures: { staff_anes: $.data.id }
            - call: POST /labor-encounters
              payload: { unit_id: "${unit_id}", patient_record_code: "PRC-ASHG-3301", parity: 1, gestational_age_weeks: 39 }
              as: ChargeNurse
              as_user_id: "charge-nurse-01"
              captures: { enc_id: $.data.id }
            - call: POST /support-person-passes
              payload: { encounter_id: "${enc_id}", person_name: "Delphine Marchetti", credential_type: "PARTNER" }
              as: PatientAccessCoordinator
              as_user_id: "access-coordinator-01"
              captures: { pass_id: $.data.id }
            - call: POST /induction-bookings
              payload: { unit_id: "${unit_id}", patient_record_code: "PRC-ASHG-3302", gestational_age_weeks: 39, indication_code: "PREECLAMPSIA", requested_start_utc: "2026-08-01T09:00:00Z", expected_labor_minutes: 120 }
              as: PatientAccessCoordinator
              as_user_id: "access-coordinator-01"
              captures: { bk_id: $.data.id }
          trigger:
            - call: POST /obstetric-units
              payload: { unit_name: "Ashgrove Annex LDR", licensed_ldr_beds: 2, licensed_or_rooms: 1 }
              as: ChargeNurse
              as_user_id: "charge-nurse-01"
              captures: { e_unit_create: $.data.error_id }
            - call: PATCH /beds/${bed_ldr1}
              payload: { status: "BLOCKED" }
              as: PerinatalSafetyOfficer
              as_user_id: "safety-officer-bootstrap"
              captures: { e_bed_patch: $.data.error_id }
            - call: GET /obstetric-units/${unit_id}
              payload: {}
              as: PerinatalSafetyOfficer
              as_user_id: "safety-officer-bootstrap"
              captures: { v_unit_now: $.data.version }
            - call: POST /induction-bookings/${bk_id}/hold-capacity
              payload: { bed_id: "${bed_ldr1}", expected_unit_version: "${v_unit_now}" }
              as: ChargeNurse
              as_user_id: "charge-nurse-01"
              captures: { e_hold: $.data.error_id }
            - call: POST /support-person-passes/${pass_id}/check-in
              payload: {}
              as: ChargeNurse
              as_user_id: "charge-nurse-01"
              captures: { e_checkin: $.data.error_id }
            - call: POST /bundle-activations
              payload: { encounter_id: "${enc_id}", bundle_type: "SEVERE_HYPERTENSION", activation_trigger: "CLINICIAN_JUDGMENT" }
              as: ChargeNurse
              as_user_id: "charge-nurse-01"
              captures: { e_activate: $.data.error_id }
            - call: POST /shift-assignments
              payload: { unit_id: "${unit_id}", staff_id: "${staff_anes}", role_slot: "OR_STANDBY", shift_start_utc: "2026-08-01T06:00:00Z", shift_end_utc: "2026-08-01T14:00:00Z" }
              as: ObstetricianAttending
              as_user_id: "ob-attending-01"
              captures: { e_shift_create: $.data.error_id }
            - call: GET /obstetric-units/${unit_id}/readiness-report
              payload: {}
              as: PatientAccessCoordinator
              as_user_id: "access-coordinator-01"
              captures: { e_readiness_read: $.data.error_id }
            - call: GET /obstetric-units/${unit_id}
              payload: {}
              as: BedsideNurse
              as_user_id: "bedside-nurse-01"
              captures: { seen_by_bedside: $.data.id }
            - call: GET /obstetric-units/${unit_id}
              payload: {}
              as: PatientAccessCoordinator
              as_user_id: "access-coordinator-01"
              captures: { seen_by_access: $.data.id }
            - call: POST /shift-assignments
              payload: { unit_id: "${unit_id}", staff_id: "${staff_anes}", role_slot: "OR_STANDBY", shift_start_utc: "2026-08-01T06:00:00Z", shift_end_utc: "2026-08-01T14:00:00Z" }
              as: AnesthesiaLead
              as_user_id: "anesthesia-lead-01"
              captures: { shift_id: $.data.id, shift_status: $.data.status }
          assert:
            - "HTTP 403 and e_unit_create == \"ERR_INSUFFICIENT_PERMISSIONS\" — POST /obstetric-units is PerinatalSafetyOfficer-exclusive"
            - "HTTP 403 and e_bed_patch == \"ERR_INSUFFICIENT_PERMISSIONS\" — PATCH /beds/{bedId} is ChargeNurse-exclusive even for the officer who created the bed"
            - "Bed.${bed_ldr1}.status == \"AVAILABLE\" — the refused PATCH wrote nothing"
            - "HTTP 403 and e_hold == \"ERR_INSUFFICIENT_PERMISSIONS\", NOT 409 ERR_UNIT_POSTURE_BLOCKS_OPERATION — priority 2 outranks priority 8.02"
            - "InductionBooking.${bk_id}.status == \"REQUESTED\" and InductionBooking.${bk_id}.bed_id is null"
            - "HTTP 403 and e_checkin == \"ERR_INSUFFICIENT_PERMISSIONS\" — check-in is PatientAccessCoordinator-exclusive although ChargeNurse holds revoke on the same entity"
            - "SupportPersonPass.${pass_id}.status == \"ISSUED\""
            - "HTTP 403 and e_activate == \"ERR_INSUFFICIENT_PERMISSIONS\" — POST /bundle-activations is shared by ObstetricianAttending and BedsideNurse only"
            - "HTTP 403 and e_shift_create == \"ERR_INSUFFICIENT_PERMISSIONS\" — POST /shift-assignments is shared by ChargeNurse and AnesthesiaLead only"
            - "HTTP 403 and e_readiness_read == \"ERR_INSUFFICIENT_PERMISSIONS\" — a read is not automatically shared"
            - "HTTP 200 and seen_by_bedside == \"${unit_id}\" and seen_by_access == \"${unit_id}\" — GET /obstetric-units/{unitId} is in all six roles' shared_operations"
            - "HTTP 201 and shift_status == \"SCHEDULED\" — AnesthesiaLead writes through a co-held endpoint despite an empty exclusive_operations list"
            - "ShiftAssignment.${shift_id}.capacity_units_effective is null"
            - "exactly one ObstetricUnit row exists — no annex unit was created by the refused call"

      - name: sod_1_and_sod_2_refuse_the_checklist_performer_and_the_drill_documenter_wearing_the_officer_role
        claim_type: Segregation of duties
        grounds:
          - roles[BedsideNurse].segregation_of_duties[SOD-1]
          - roles[PerinatalSafetyOfficer].segregation_of_duties[SOD-1 second step]
          - roles[AnesthesiaLead].segregation_of_duties[SOD-2]
          - roles[PerinatalSafetyOfficer].segregation_of_duties[SOD-2 second step]
          - roles[PerinatalSafetyOfficer].note
          - validations[priority=10]
          - validations[priority=11.5]
          - errors[ERR_SEGREGATION_OF_DUTIES_VIOLATION]
          - errors[ERR_BUNDLE_SCORE_NOT_COMPUTED]
          - endpoints[POST /bundle-activations/{activationId}/close-debrief]
          - endpoints[POST /cesarean-readiness-drills/{drillId}/validate]
          - calculations.cesarean_readiness_derivation
        distinguishing_aspect: |
          Both denials are issued to a caller who IS authorized for the endpoint: the role check at
          priority 2 passes and only the identity comparison at priority 10 fails, which is the whole
          point of `identity: entity_backed:StaffMember` — a clinician who puts on the officer hat is
          still the same StaffMember.id. Each denial is paired with the identical call under a different
          X-User-ID to prove the refusal was about WHO and not about the payload or the state. The
          close-debrief probe is §1.4's declared PRIORITY CONFLICT PAIR 3 and it crosses HTTP families
          twice over: the activation is still ACTIVATED (a non-declared source state, priority 8) and its
          timeliness_score is still null (priority 11.5), so a naive ladder answers 409
          ERR_INVALID_STATE_TRANSITION or 422 ERR_BUNDLE_SCORE_NOT_COMPUTED; the correct answer is 403,
          and the second probe shows the 422 waiting underneath once the identity clears.
        test_recipe:
          setup: |
            Clock starts 2026-08-01T05:45:00Z. One unit with one LDR bed and three staff members: a
            charge RN (ADVANCED cert) holding an ACTIVE CHARGE shift, an OB attending and an
            anesthesiologist. A DECISION_TO_INCISION drill is scheduled at 05:50 with the OB and the
            anesthesiologist as its two participants, started at 05:50 and documented at 06:00 by the
            ANESTHESIOLOGIST (decision 05:50, incision 06:00 -> measured 10 minutes, a pass). Separately
            an OBSTETRIC_HEMORRHAGE activation is opened on an encounter and its TYPE_AND_SCREEN item is
            completed by the CHARGE RN, whose ACTIVE CHARGE shift satisfies the priority-12 attachment
            rule. No OR_STANDBY shift exists anywhere, which pins the post-validation readiness to
            DEGRADED rather than READY.
          setup_api_calls:
            - call: POST /_clock/set_current_utc
              payload: { current_utc: "2026-08-01T05:45:00Z" }
              as: PerinatalSafetyOfficer
              as_user_id: "safety-officer-bootstrap"
            - call: POST /obstetric-units
              payload: { unit_name: "Pemberly Hollow Womens Hospital LDR", licensed_ldr_beds: 4, licensed_or_rooms: 2 }
              as: PerinatalSafetyOfficer
              as_user_id: "safety-officer-bootstrap"
              captures: { unit_id: $.data.id }
            - call: POST /obstetric-units/${unit_id}/beds
              payload: { bed_label: "LDR-01", bed_type: "LDR" }
              as: PerinatalSafetyOfficer
              as_user_id: "safety-officer-bootstrap"
              captures: { bed_ldr1: $.data.id }
            - call: POST /obstetric-units/${unit_id}/staff-members
              payload: { full_name: "Rosalind Twickenham", staff_role: "RN_LABOR_DELIVERY", fetal_monitoring_cert_level: "ADVANCED", credential_expires_at: "2027-01-01T00:00:00Z" }
              as: ChargeNurse
              as_user_id: "charge-nurse-01"
              captures: { rn_charge: $.data.id }
            - call: POST /obstetric-units/${unit_id}/staff-members
