          assert:
            - "the contained candidate 09:00..10:00 on line A returns 409 ERR_RETREAD_SLOT_CONFLICT"
            - "the candidate 12:00..13:00 on line A also returns 409 — it starts inside the incumbent's 30-minute cooldown tail, which ends at 12:30"
            - "the predecessor candidate 06:00..08:00 on line A returns 201: its end instant equals the incumbent's start instant, and half-open intervals do not touch; the candidate's OWN cooldown is deliberately not part of its occupied span"
            - "the interval that line A rejected (09:00..10:00) is accepted on line B, so the contended resource is the individual RetreadLine, not the ServiceLocation"
            - "RetreadLine.${lineA_id}.booked_minutes == 420 (240 + 30 for job 1, 120 + 30 for job 2) and RetreadLine.${lineB_id}.booked_minutes == 90"

      - name: agreement_windows_closed_inclusive_touching_endpoints_conflict
        grounds:
          - calculations.agreement_window_overlap
          - validations.priority_23_business_temporal
          - errors.ERR_AGREEMENT_WINDOW_OVERLAP
          - state_machines.NationalAgreement.DRAFT_to_ACTIVE
        distinguishing_aspect: |
          RESOURCE: the FleetAccount's pricing calendar (a completely different resource
          entity from RetreadLine). INTERVAL SEMANTICS: CLOSED INCLUSIVE CALENDAR DATES rather
          than half-open timestamps — so unlike the retread line, touching endpoints DO
          conflict: a window starting on 2026-12-31, the incumbent's last covered day, is
          refused, while 2027-01-01 is accepted. The opposite convention to instance one, on
          purpose.
        test_recipe:
          setup:
            - "one fleet with an ACTIVE agreement covering 2026-07-01..2026-12-31 inclusive"
            - "two DRAFT agreements ready to activate: one starting on 2026-12-31, one starting on 2027-01-01"
