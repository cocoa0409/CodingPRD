            - "Only one Interview exists across both applications (the buffered-overlap second was rejected)"

  # ===================================================================
  # Rule 9 — Compensating-action invariants across different conserved quantities
  # ===================================================================
  - rule_id: compensating_invariant
    instances:
      - name: department_committed_offer_cents_round_trip_offer_create_then_reject
        grounds:
          - calculations.department_committed_offer
          - entities.Department.fields.committed_offer_cents
          - state_machines.Offer.PENDING_APPROVAL_to_REJECTED
        distinguishing_aspect: |
          Conserved quantity = Department.committed_offer_cents (USD cents on the budget ledger).
          Forward action: POST /offers (adds base_salary_cents to committed). Compensating action:
          POST /offers/{id}/reject (subtracts base_salary_cents). Pinned invariant:
          Department.committed_offer_cents after the round-trip == Department.committed_offer_cents
          before the round-trip (initial 0 → +12_000_000 → 0). Drift is forbidden.
        test_recipe:
          setup:
            - "Department D with committed_offer_cents=0 initially"
            - "Requisition R APPROVED under D; Candidate C; Application A SCREENING"
          setup_api_calls:
            - call: "POST /ats/departments"
              payload: { name: "InvDept1", cost_center_code: "INV-001", hiring_budget_cents: 100000000 }
              as: PlatformAdmin
              captures: { dept_id: $.data.id }
            - call: "GET /ats/departments/${dept_id}"
              payload: {}
              as: PlatformAdmin
              captures: { committed_before: $.data.committed_offer_cents }
            - call: "POST /ats/requisitions"
              payload: { department_id: "${dept_id}", title: "InvRole1", target_level: "MID", base_salary_min_cents: 10000000, base_salary_max_cents: 15000000, openings: 1 }
              as: Recruiter
              as_user_id: "rec_alice"
              captures: { req_id: $.data.id }
            - call: "POST /ats/requisitions/${req_id}/submit"
              payload: {}
              as: Recruiter
              as_user_id: "rec_alice"
            - call: "POST /ats/requisitions/${req_id}/approve"
              payload: {}
              as: HiringManager
              as_user_id: "hm_bob"
            - call: "POST /ats/candidates"
              payload: { full_name: "Inv Cand 1", email: "inv1@example.com", source_channel: "DIRECT", eeo_ethnicity: "WHITE", eeo_gender: "MALE", eeo_veteran: false, eeo_disability: false }
              as: Recruiter
              as_user_id: "rec_alice"
              captures: { cand_id: $.data.id }
            - call: "POST /ats/applications"
              payload: { candidate_id: "${cand_id}", requisition_id: "${req_id}" }
              as: Recruiter
              as_user_id: "rec_alice"
              captures: { app_id: $.data.id }
            - call: "POST /ats/applications/${app_id}/screen"
              payload: {}
              as: Recruiter
              as_user_id: "rec_alice"
            - call: "POST /ats/offers"
              payload: { application_id: "${app_id}", base_salary_cents: 12000000, signing_bonus_cents: 0 }
              as: Recruiter
              as_user_id: "rec_alice"
              captures: { offer_id: $.data.id }
            - call: "GET /ats/departments/${dept_id}"
              payload: {}
              as: PlatformAdmin
              captures: { committed_after_create: $.data.committed_offer_cents }
          trigger:
            - call: "POST /ats/offers/${offer_id}/reject"
              payload: {}
              as: CompApprover
              as_user_id: "comp_carol"
            - call: "GET /ats/departments/${dept_id}"
              payload: {}
              as: PlatformAdmin
              captures: { committed_after_reject: $.data.committed_offer_cents }
          assert:
            - "Before create: Department.committed_offer_cents == 0"
            - "After create: Department.committed_offer_cents == 12000000 (offer.base_salary_cents was added)"
            - "After reject: Department.committed_offer_cents == 0 (round-trip invariant: forward+compensate leaves the ledger unchanged)"

      - name: requisition_filled_count_round_trip_offer_accept_then_bgc_failed
        grounds:
          - entities.JobRequisition.fields.filled_count
          - state_machines.Offer.EXTENDED_to_ACCEPTED
          - state_machines.BackgroundCheck.IN_PROGRESS_to_FAILED
          - state_machines.Application.OFFER_EXTENDED_to_HIRED
        distinguishing_aspect: |
          A different conserved quantity than the budget ledger: JobRequisition.filled_count
          (integer headcount counter). Forward action: offer ACCEPT bubbles filled_count++ (and
          may auto-CLOSE the requisition). Compensating action: BackgroundCheck FAILED rolls back
          the hire, decrementing filled_count and re-opening the requisition. Pinned invariant:
          filled_count after the round-trip equals filled_count before the round-trip
          (0 → 1 → 0); requisition returns to APPROVED.
        test_recipe:
          setup:
            - "Requisition R openings=1 APPROVED; filled_count==0 initially"
            - "Offer O accepted; BGC IN_PROGRESS"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-01-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /ats/departments"
              payload: { name: "InvDept2", cost_center_code: "INV-002", hiring_budget_cents: 100000000 }
              as: PlatformAdmin
              captures: { dept_id: $.data.id }
            - call: "POST /ats/requisitions"
              payload: { department_id: "${dept_id}", title: "InvRole2", target_level: "MID", base_salary_min_cents: 10000000, base_salary_max_cents: 15000000, openings: 1 }
              as: Recruiter
              as_user_id: "rec_alice"
              captures: { req_id: $.data.id }
            - call: "POST /ats/requisitions/${req_id}/submit"
              payload: {}
              as: Recruiter
              as_user_id: "rec_alice"
            - call: "POST /ats/requisitions/${req_id}/approve"
              payload: {}
              as: HiringManager
              as_user_id: "hm_bob"
            - call: "GET /ats/requisitions/${req_id}"
              payload: {}
              as: Recruiter
              as_user_id: "rec_alice"
              captures: { filled_before: $.data.filled_count }
            - call: "POST /ats/candidates"
              payload: { full_name: "Inv Cand 2", email: "inv2@example.com", source_channel: "DIRECT", eeo_ethnicity: "WHITE", eeo_gender: "MALE", eeo_veteran: false, eeo_disability: false }
              as: Recruiter
              as_user_id: "rec_alice"
              captures: { cand_id: $.data.id }
            - call: "POST /ats/applications"
              payload: { candidate_id: "${cand_id}", requisition_id: "${req_id}" }
              as: Recruiter
              as_user_id: "rec_alice"
              captures: { app_id: $.data.id }
            - call: "POST /ats/applications/${app_id}/screen"
              payload: {}
              as: Recruiter
              as_user_id: "rec_alice"
            - call: "POST /ats/offers"
              payload: { application_id: "${app_id}", base_salary_cents: 12000000, signing_bonus_cents: 0 }
              as: Recruiter
              as_user_id: "rec_alice"
              captures: { offer_id: $.data.id, offer_v1: $.data.version }
            - call: "POST /ats/offers/${offer_id}/approve"
              payload: { expected_offer_version: "${offer_v1}" }
              as: CompApprover
              as_user_id: "comp_carol"
              captures: { offer_v2: $.data.version }
            - call: "POST /ats/offers/${offer_id}/approve"
              payload: { expected_offer_version: "${offer_v2}" }
              as: VP
              as_user_id: "vp_dave"
            - call: "POST /ats/offers/${offer_id}/extend"
              payload: {}
              as: Recruiter
              as_user_id: "rec_alice"
            - call: "POST /ats/offers/${offer_id}/accept"
              payload: {}
              as: Candidate
              as_user_id: "${cand_id}"
            - call: "GET /ats/requisitions/${req_id}"
              payload: {}
              as: Recruiter
              as_user_id: "rec_alice"
              captures: { filled_after_accept: $.data.filled_count, status_after_accept: $.data.status }
            - call: "GET /ats/background-checks"
              payload: { offer_id: "${offer_id}" }
              as: ComplianceOfficer
              as_user_id: "co_frank"
              captures: { bgc_list_pre: $.data }
            - call: "GET /ats/background-checks"
              payload: { offer_id: "${offer_id}" }
              as: ComplianceOfficer
              as_user_id: "co_frank"
              captures: { first_bgc_id: "$.data[0].id" }
            - call: "POST /ats/background-checks/${first_bgc_id}/start"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co_frank"
          trigger:
            - call: "POST /ats/background-checks/${first_bgc_id}/resolve"
              payload: { outcome: "FAILED" }
              as: ComplianceOfficer
              as_user_id: "co_frank"
            - call: "GET /ats/requisitions/${req_id}"
              payload: {}
              as: Recruiter
              as_user_id: "rec_alice"
              captures: { filled_after_round_trip: $.data.filled_count, status_after_round_trip: $.data.status }
          assert:
            - "Before accept: JobRequisition.filled_count == 0 (no hires)"
            - "After accept: JobRequisition.filled_count == 1 and JobRequisition.status == CLOSED (auto-closed: filled_count == openings)"
            - "After BGC FAILED: JobRequisition.filled_count == 0 (back to baseline) and JobRequisition.status == APPROVED (re-opened from CLOSED)"
            - "Conservation invariant: filled_count round-trip 0 → 1 → 0 holds exactly"
