      - name: disposition_on_scrapped_fiber_batch_returns_invalid_state
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.FiberBatch.terminal_states
          - state_machines.FiberBatch.QUEUED_to_SCRAPPED
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: |
          SCRAPPED is terminal, so neither extrude nor a second disposition is admissible from it;
