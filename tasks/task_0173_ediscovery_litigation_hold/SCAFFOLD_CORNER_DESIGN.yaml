        test_recipe:
          setup: ["scope1 processed with hash X; scope2 collected with the same hash X"]
          setup_api_calls:
            - call: "POST /matters"
              payload: { caption: "M", bates_prefix: "AA" }
              as: LegalOps
              captures: { m_id: $.data.id }
            - call: "POST /custodians"
              payload: { matter_id: "${m_id}", full_name: "Al", email: "a@x.com" }
              as: LegalOps
              captures: { c1_id: $.data.id }
            - call: "POST /legal-holds"
              payload: { matter_id: "${m_id}", title: "H", instructions: "P", ack_deadline: "2026-06-10T00:00:00Z" }
              as: LegalOps
              captures: { h_id: $.data.id }
