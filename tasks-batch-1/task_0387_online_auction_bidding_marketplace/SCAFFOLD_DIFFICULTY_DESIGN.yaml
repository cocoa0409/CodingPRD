          AWAITING_PAYMENT the ship transition is undefined and rejected ERR_INVALID_STATE.
        test_recipe:
          setup:
            - "Seller S publishes BUY_NOW 20000; Buyer B buys (Order UNPAID/AWAITING_PAYMENT); not yet paid."
          setup_api_calls:
