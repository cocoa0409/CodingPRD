        distinguishing_aspect: "The checkpoint batch endpoint advances four independent epochs with per-category counters: run at 08-02 activates the restricted entry and flips attestation DUE; run at 08-04 expires the preclearance; run at 09-01 marks training overdue (x2), expires the entry, and lapses the attestation."
