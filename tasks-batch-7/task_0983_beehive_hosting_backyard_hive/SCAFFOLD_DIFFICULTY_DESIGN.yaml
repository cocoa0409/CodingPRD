            - { call: "POST /api/harvests", payload: { hive_id: "${hv}", collected_on: "2026-06-16T00:00:00Z", gross_kg: 10.000, moisture_pct: 18.7 }, as: Beekeeper, as_user_id: "bk-1", captures: { net_b: $.data.net_kg } }
          assert:
