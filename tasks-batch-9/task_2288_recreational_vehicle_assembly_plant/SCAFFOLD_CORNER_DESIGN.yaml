      - name: pinned_configuration_snapshot_survives_a_floor_plan_reprice
        claim_type: immutability
        grounds:
          - entities.UnitOrder.fields.locked_floor_plan_version
          - entities.UnitOrder.fields.provisional_invoice_cents
          - endpoints["PATCH /floor-plans/{id}"]
          - state_machines.UnitOrder.status.transitions.DRAFT_to_CONFIG_VALIDATED
        distinguishing_aspect: "Repricing the floor plan after submit moves FloorPlan.version to 2 and its base_msrp_cents to 9000000, but the order's locked_floor_plan_version stays 1 and provisional_invoice_cents stays 6620350: the pinned snapshot is never rewritten in place, and the order row's own version does not move."
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z."
