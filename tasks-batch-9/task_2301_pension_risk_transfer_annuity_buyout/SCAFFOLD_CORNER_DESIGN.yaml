          assert:
            - "the disqualification returned 200 with IndependentExpert.${expert_id}.expert_status == DISQUALIFIED, reviewed_by_user_id == fiduciary-01 and version == 2"
            - "the opinion attempt returns 409 ERR_EXPERT_NOT_ENGAGED and safest_available_opinion stays null"
            - "the second independence-review returns 409 ERR_EXPERT_STATE_INVALID — a distinct code from the opinion refusal"
            - "GET /prt/plans/${plan_id}/independent-experts?expert_status=ENGAGED returns total_count == 0"
            - "IndependentExpert.${expert_id}.version is still 2 — neither refused call wrote anything"

      - name: applied_correction_syncs_the_audited_benefit_into_the_participant_ledger
        claim_type: ledger_sync
        grounds:
          - state_machines.BenefitAudit.CORRECTION_REQUIRED_to_CORRECTED
          - calculations.benefit_recomputation
          - calculations.participant_accounting_liability
        distinguishing_aspect: |
          A correction must propagate three levels in one call: the audit's own
          state, the participant's audited_monthly_benefit_cents, and the derived
          accounting liability. The second audit recomputes 112500 against a stated
          100000 for a variance of 12500 — past the 500-cent tolerance — and applying
          it must move the participant's liability from 11460000 to 12892500. An
          implementation that stores the correction on the audit only, or that leaves
          the participant on the stated benefit, fails the last two assertions.
        test_recipe:
          setup:
            - "one PensionPlan with one participant: stated 100000, FAME 250000, 320 credited months, cleansed and audited once with variance 0"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: Actuary
              as_user_id: "actuary-01"
