            - "ACTIVE lease with ACTIVE allocation; DOCK resource with concurrent_capacity 1"
            - "Movement A SCHEDULED on the dock for 2026-05-10T08:00:00Z..12:00:00Z"
            - "Movement B NOMINATED with the identical window; its schedule attempt previously failed ERR_WINDOW_CONFLICT"
