              payload: { current_utc: "2026-08-09T00:00:00Z" }
              as: PlatformOps
            - call: "POST /early-payments/${ep2_id}/settlement/confirm"
              payload: {}
              as: BuyerTreasury
              as_user_id: "${buyer_id}"
              captures: { ep2_funding: "$.data.funding_status", ep2_final_net: "$.data.net_payment_cents" }
          assert:
            - "checkpoint 1, before any payment: Invoice.${invoice_id}.face_covered_cents == 0 and remaining_face_cents == 100000 == face_amount_cents"
            - "checkpoint 2, after the reservation: face_covered_cents == 100000 and remaining_face_cents == 0"
            - "${ep1_net} == 98444 (provisional discount 1556 for 56 days from requested_pay_date 2026-08-05)"
            - "checkpoint 3, after the failure: ${ep1_funding} == VOID, settlement_status == FAILED, face_covered_cents back to 0 and remaining_face_cents back to 100000 with no residue"
            - "${offer_status_after_fail} == ACCEPTED, so a replacement payment is legal; ${offer_v2} is the current OCC anchor"
            - "checkpoint 4, after the replacement reservation and execution: exactly one EarlyPayment row of this invoice is counted, face_covered_cents == 100000 and remaining_face_cents == 0 (the VOID row is excluded, never double-counted)"
            - "${ep2_net} == 98500 and ${ep2_value_date} == 2026-08-09 (execution_date 2026-08-07 gives 54 days, discount 1500)"
            - "checkpoint 5, after confirmation: ${ep2_funding} == RELEASED, which is still inside the counted set, so face_covered_cents stays 100000 and remaining_face_cents stays 0"
            - "${ep2_final_net} == 98556 with Invoice.${invoice_id}.final_discount_cents == 1444 (52 days from value_date 2026-08-09), provisional_discount_cents == 1500 and discount_true_up_cents == -56"
            - "GET /early-payments?invoice_id=${invoice_id} returns 2 rows, one VOID and one RELEASED, and Invoice.${invoice_id}.status == EARLY_PAID"

