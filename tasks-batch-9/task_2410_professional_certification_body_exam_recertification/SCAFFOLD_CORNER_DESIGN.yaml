            - call: "POST /applications"
              payload: {"candidate_id": "${candC_id}", "program_id": "${prog_id}", "education_credential": "BACHELOR", "education_completion_year": 2015, "experience_months": 24, "attestation_signed": true}
              as: EligibilityReviewer
