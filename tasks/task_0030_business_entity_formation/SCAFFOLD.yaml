scenario: |
  State Business Entity Formation & Annual Report: LLC/Corp/LP, Operating Agreement
  templates, EIN application, registered agent, annual report/Franchise Tax, Foreign
  Qualification (out-of-state), BOI disclosure.

domain_name: business-entity-formation
api_prefix: ""

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: posture_driven_gating
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - derived_field_reconciliation
    - rate_threshold_triggers

  entity_topology: hierarchical
  state_machine_shape: posture_driven   # BusinessEntity.compliance_posture gates children
  relationship_patterns:
    - one_to_many                       # BusinessEntity -> {OA, EIN, RA, AR, FQ, BOI, Events}
    - cross_aggregate                   # ForeignQualification references foreign-state RegisteredAgent
  role_model: peer_roles
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — EMITTED VERBATIM)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: BusinessEntity
    parent: null
    common_fields: true
    fields:
      - name: legal_name
        type: string
        source: input
        description: "Registered legal name; unique per formation_state_code."
        constraints: "1..200 chars; uppercase ASCII letters, digits, spaces, '-', '.', ',', '&'."
      - name: entity_type
        type: enum
        source: input
        description: "Type of business entity."
        constraints: "One of LLC, CORP, LP."
      - name: formation_state_code
        type: string
        source: input
        description: "USPS two-letter state code where the entity is formed."
        constraints: "Two uppercase letters; must be in the supported state set {CA, DE, NY, TX, FL, WY}."
      - name: revenue_band
        type: enum
        source: input
        description: "Self-reported revenue tier used for franchise tax estimation."
        constraints: "One of ZERO, MICRO, SMALL, MEDIUM, LARGE."
        default: ZERO
      - name: formed_at
        type: datetime
        source: system
        description: "Server-stamped ISO 8601 UTC formation timestamp."
      - name: status
        type: enum
        source: computed
        description: "Lifecycle status; see §1.2 BusinessEntity state machine."
        constraints: "One of FORMING, ACTIVE, DELINQUENT, SUSPENDED, DISSOLVED."
        default: FORMING
      - name: compliance_posture
        type: enum
        source: computed
        description: "Derived posture aggregating child compliance; see §1.3 compliance_posture calculation."
        constraints: "One of GOOD_STANDING, RESTRICTED, FROZEN."
        default: GOOD_STANDING
      - name: franchise_tax_paid_through_year
        type: integer
        source: computed
        description: "Highest period_year for which a FILED AnnualReport exists; 0 if none."
        default: 0
      - name: cumulative_franchise_tax_paid_cents
        type: integer
        source: computed
        description: "Sum of AnnualReport.franchise_tax_amount_cents + late_fee_cents over all FILED reports; invariant under void+refile (Rule 9)."
        default: 0

  - name: OperatingAgreement
    parent: BusinessEntity
    common_fields: true
    fields:
      - name: business_entity_id
        type: string
        source: input
        description: "FK -> BusinessEntity.id; parent entity this agreement governs."
      - name: template_type
        type: enum
        source: input
        description: "Template family selected by the filer."
        constraints: "One of MEMBER_MANAGED, MANAGER_MANAGED, LP_GENERAL_LIMITED."
      - name: members_json
        type: object
        source: input
        description: "Array of { name, ownership_pct } members; ownership_pct sums to exactly 100."
        constraints: "1..50 members; each name 1..120 chars; ownership_pct integer 1..100."
      - name: status
        type: enum
        source: computed
        description: "See §1.2 OperatingAgreement state machine."
        constraints: "One of DRAFT, EXECUTED, SUPERSEDED."
        default: DRAFT
      - name: executed_at
        type: datetime
        source: computed
        description: "Server-stamped ISO 8601 UTC when status flips DRAFT->EXECUTED; null otherwise."
        default: null

  - name: EINApplication
    parent: BusinessEntity
    common_fields: true
    fields:
      - name: business_entity_id
        type: string
        source: input
        description: "FK -> BusinessEntity.id; parent entity applying for an EIN."
      - name: responsible_party_name
        type: string
        source: input
        description: "Name of the responsible party submitting on the entity's behalf."
        constraints: "1..120 chars."
      - name: responsible_party_ssn_last4
        type: string
        source: input
        description: "Last four digits of responsible party SSN (string to preserve leading zeros)."
        constraints: "Exactly 4 digits, '0'..'9'."
      - name: ein
        type: string
        source: computed
        description: "Server-issued nine-digit EIN with dash after position 2 (e.g., 87-1234567); null until ISSUED."
        default: null
      - name: status
        type: enum
        source: computed
        description: "See §1.2 EINApplication state machine."
        constraints: "One of PENDING, ISSUED, REJECTED."
        default: PENDING
      - name: issued_at
        type: datetime
        source: computed
        description: "Server-stamped ISO 8601 UTC when issued; null otherwise."
        default: null

  - name: RegisteredAgent
    parent: BusinessEntity
    common_fields: true
    fields:
      - name: business_entity_id
        type: string
        source: input
        description: "FK -> BusinessEntity.id; parent entity the agent serves."
      - name: agent_name
        type: string
        source: input
        description: "Name of the registered agent (individual or commercial entity)."
        constraints: "1..200 chars."
      - name: agent_type
        type: enum
        source: input
        description: "Whether the agent is an individual person or a commercial registered agent service."
        constraints: "One of INDIVIDUAL, COMMERCIAL."
      - name: agent_state_code
        type: string
        source: input
        description: "USPS two-letter state code where the agent maintains a physical address."
        constraints: "Two uppercase letters; for in-state agents MUST equal BusinessEntity.formation_state_code."
      - name: status
        type: enum
        source: computed
        description: "See §1.2 RegisteredAgent state machine; terminal RESIGNED."
        constraints: "One of ACTIVE, RESIGNED."
        default: ACTIVE
      - name: resigned_at
        type: datetime
        source: computed
        description: "Server-stamped ISO 8601 UTC when status flips ACTIVE->RESIGNED; null otherwise."
        default: null

  - name: AnnualReport
    parent: BusinessEntity
    common_fields: true
    fields:
      - name: business_entity_id
        type: string
        source: input
        description: "FK -> BusinessEntity.id; parent entity for this report."
      - name: period_year
        type: integer
        source: input
        description: "Reporting calendar year; one report per (business_entity_id, period_year)."
        constraints: "Integer 2020..2099."
      - name: status
        type: enum
        source: computed
        description: "See §1.2 AnnualReport state machine."
        constraints: "One of DRAFT, FILED, DELINQUENT, VOIDED."
        default: DRAFT
      - name: franchise_tax_amount_cents
        type: integer
        source: computed
        description: "Computed by §1.3 franchise_tax; provisional at create, assessed at file."
        default: 0
      - name: late_fee_cents
        type: integer
        source: computed
        description: "Computed by §1.3 late_fee_accrual at the moment of FILE; 0 if filed on or before deadline."
        default: 0
      - name: filed_at
        type: datetime
        source: computed
        description: "Server-stamped ISO 8601 UTC when status flips DRAFT/DELINQUENT->FILED; null otherwise."
        default: null
      - name: voided_at
        type: datetime
        source: computed
        description: "Server-stamped ISO 8601 UTC when ComplianceOfficer voids a FILED report; null otherwise."
        default: null

  - name: ForeignQualification
    parent: BusinessEntity
    common_fields: true
    fields:
      - name: business_entity_id
        type: string
        source: input
        description: "FK -> BusinessEntity.id; the home-state entity qualifying abroad."
      - name: foreign_state_code
        type: string
        source: input
        description: "USPS two-letter state code where the entity is qualifying to do business; MUST differ from BusinessEntity.formation_state_code."
        constraints: "Two uppercase letters; must be in the supported state set."
      - name: foreign_registered_agent_id
        type: string
        source: input
        description: "FK -> RegisteredAgent.id; agent in foreign_state_code (agent_state_code MUST equal foreign_state_code)."
      - name: status
        type: enum
        source: computed
        description: "See §1.2 ForeignQualification state machine."
        constraints: "One of PENDING, QUALIFIED, WITHDRAWN."
        default: PENDING
      - name: qualified_at
        type: datetime
        source: computed
        description: "Server-stamped ISO 8601 UTC when status flips PENDING->QUALIFIED; null otherwise."
        default: null
      - name: withdrawn_at
        type: datetime
        source: computed
        description: "Server-stamped ISO 8601 UTC when status flips QUALIFIED->WITHDRAWN; null otherwise."
        default: null

  - name: BOIDisclosure
    parent: BusinessEntity
    common_fields: true
    fields:
      - name: business_entity_id
        type: string
        source: input
        description: "FK -> BusinessEntity.id; the subject entity disclosing beneficial owners."
      - name: beneficial_owners_json
        type: object
        source: input
        description: "Array of { name, dob, ownership_pct, control_role } owners; ownership_pct sums to exactly 100."
        constraints: "1..25 entries; ownership_pct integer 1..100; control_role one of OWNER, CONTROLLER, BOTH."
      - name: triggering_event
        type: enum
        source: input
        description: "Reason the disclosure is required."
        constraints: "One of FORMATION, AMENDMENT, ANNUAL_REFRESH."
      - name: status
        type: enum
        source: computed
        description: "See §1.2 BOIDisclosure state machine; cycle SUBMITTED->AMENDED->SUBMITTED."
        constraints: "One of DRAFT, SUBMITTED, AMENDED."
        default: DRAFT
      - name: submitted_at
        type: datetime
        source: computed
        description: "Server-stamped ISO 8601 UTC of the most recent SUBMITTED transition; null while DRAFT."
        default: null

  - name: ComplianceEvent
    parent: BusinessEntity
    common_fields: false
    fields:
      - name: business_entity_id
        type: string
        source: system
        description: "FK -> BusinessEntity.id; the subject entity this event records."
      - name: event_type
        type: enum
        source: system
        description: "Server-emitted event family."
        constraints: "One of POSTURE_CHANGED, STATUS_CHANGED, REPORT_FILED, AGENT_REPLACED, BOI_SUBMITTED, FQ_QUALIFIED, FQ_WITHDRAWN, REPORT_VOIDED, REINSTATED, DELINQUENT_AUTO."
      - name: event_payload
        type: object
        source: system
        description: "Free-form structured payload; e.g., { from: X, to: Y } for state changes."
      - name: event_at
        type: datetime
        source: system
        description: "Server-stamped ISO 8601 UTC; uses /_clock/set_current_utc value when set."

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: BusinessEntity
    initial_state: FORMING
    terminal_states: [DISSOLVED]
    transitions:
      - from: FORMING
        to: ACTIVE
        trigger: "Automatic when all of (RegisteredAgent.ACTIVE exists, EINApplication.ISSUED exists, OperatingAgreement.EXECUTED exists if entity_type in {LLC, LP}) become true."
        actor: system
        preconditions:
          - "Exactly one RegisteredAgent in ACTIVE for this BusinessEntity."
          - "Exactly one EINApplication in ISSUED for this BusinessEntity."
          - "If entity_type in {LLC, LP}: at least one OperatingAgreement in EXECUTED for this BusinessEntity."
        side_effects:
          - "Recompute compliance_posture (§1.3); typically -> GOOD_STANDING."
          - "Emit ComplianceEvent event_type=STATUS_CHANGED, payload={from:FORMING,to:ACTIVE}."
          - "increments BusinessEntity.version by 1."
      - from: ACTIVE
        to: DELINQUENT
        trigger: "Automatic when any AnnualReport flips DRAFT->DELINQUENT for this BusinessEntity (cascade hop 2 of Rule 4 chain A)."
        actor: system
        preconditions:
          - "At least one AnnualReport with status=DELINQUENT for this BusinessEntity."
        side_effects:
          - "Recompute compliance_posture -> RESTRICTED."
          - "Emit ComplianceEvent event_type=STATUS_CHANGED, payload={from:ACTIVE,to:DELINQUENT}."
          - "increments BusinessEntity.version by 1."
      - from: DELINQUENT
        to: ACTIVE
        trigger: "Automatic when every AnnualReport for this BusinessEntity is in {FILED, VOIDED} (all delinquent reports have been cured)."
        actor: system
        preconditions:
          - "No AnnualReport with status=DELINQUENT or DRAFT remains for this BusinessEntity for any period_year strictly less than the current clock year."
        side_effects:
          - "Recompute compliance_posture -> GOOD_STANDING (subject to other gates)."
          - "Emit ComplianceEvent event_type=STATUS_CHANGED, payload={from:DELINQUENT,to:ACTIVE}."
          - "increments BusinessEntity.version by 1."
      - from: DELINQUENT
        to: SUSPENDED
        trigger: "Automatic on clock advance past Dec 31 of the second consecutive delinquent year (entity has DELINQUENT reports for two consecutive period_years)."
        actor: system
        preconditions:
          - "Two AnnualReports with status=DELINQUENT whose period_year values are consecutive integers."
        side_effects:
          - "Recompute compliance_posture -> FROZEN."
          - "Emit ComplianceEvent event_type=STATUS_CHANGED, payload={from:DELINQUENT,to:SUSPENDED}."
          - "increments BusinessEntity.version by 1."
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /business-entities/{id}/reinstate"
        actor: StateAdmin
        preconditions:
          - "BusinessEntity.status == SUSPENDED."
          - "All delinquent AnnualReports for this BusinessEntity have been cured (status in {FILED, VOIDED}) for every period_year < clock year."
          - "Exactly one RegisteredAgent in ACTIVE."
        side_effects:
          - "Recompute compliance_posture -> GOOD_STANDING."
          - "Emit ComplianceEvent event_type=REINSTATED, payload={from:SUSPENDED,to:ACTIVE}."
          - "increments BusinessEntity.version by 1."
      - from: ACTIVE
        to: DISSOLVED
        trigger: "PATCH /business-entities/{id}/dissolve"
        actor: Filer
        preconditions:
          - "BusinessEntity.status == ACTIVE."
          - "No ForeignQualification with status=QUALIFIED for this BusinessEntity."
        side_effects:
          - "Recompute compliance_posture -> FROZEN."
          - "All AnnualReports in DRAFT or DELINQUENT flip to VOIDED."
          - "All RegisteredAgents in ACTIVE flip to RESIGNED."
          - "Emit ComplianceEvent event_type=STATUS_CHANGED, payload={from:ACTIVE,to:DISSOLVED}."
          - "increments BusinessEntity.version by 1."
      - from: DELINQUENT
        to: DISSOLVED
        trigger: "PATCH /business-entities/{id}/dissolve"
        actor: Filer
        preconditions:
          - "BusinessEntity.status == DELINQUENT."
          - "No ForeignQualification with status=QUALIFIED for this BusinessEntity."
        side_effects:
          - "Recompute compliance_posture -> FROZEN."
          - "All AnnualReports in DRAFT or DELINQUENT flip to VOIDED."
          - "All RegisteredAgents in ACTIVE flip to RESIGNED."
          - "Emit ComplianceEvent event_type=STATUS_CHANGED, payload={from:DELINQUENT,to:DISSOLVED}."
          - "increments BusinessEntity.version by 1."

  - entity: OperatingAgreement
    initial_state: DRAFT
    terminal_states: [SUPERSEDED]
    transitions:
      - from: DRAFT
        to: EXECUTED
        trigger: "POST /operating-agreements/{id}/execute"
        actor: Filer
        preconditions:
          - "OperatingAgreement.status == DRAFT."
          - "Sum of members_json[*].ownership_pct == 100 exactly."
          - "BusinessEntity.status != DISSOLVED and BusinessEntity.compliance_posture != FROZEN."
        side_effects:
          - "Set executed_at to current clock UTC."
          - "If a prior OperatingAgreement of the same business_entity_id is in EXECUTED, transition that prior one DRAFT/EXECUTED -> SUPERSEDED in this same request."
          - "Recompute BusinessEntity.compliance_posture (§1.3)."
          - "Possible automatic BusinessEntity transition FORMING->ACTIVE if §1.2 preconditions now hold."
          - "increments OperatingAgreement.version by 1."
      - from: EXECUTED
        to: SUPERSEDED
        trigger: "System-only when another OperatingAgreement of the same business_entity_id is EXECUTED."
        actor: system
        preconditions:
          - "Another OperatingAgreement of the same business_entity_id is transitioning DRAFT -> EXECUTED."
        side_effects:
          - "Emit ComplianceEvent event_type=AGENT_REPLACED is NOT applicable here; no event emitted (audit trail derives from the new EXECUTED record)."
          - "increments OperatingAgreement.version by 1."

  - entity: EINApplication
    initial_state: PENDING
    terminal_states: [ISSUED, REJECTED]
    transitions:
      - from: PENDING
        to: ISSUED
        trigger: "POST /ein-applications/{id}/issue"
        actor: StateAdmin
        preconditions:
          - "EINApplication.status == PENDING."
          - "BusinessEntity.status != DISSOLVED."
        side_effects:
          - "Server-mint nine-digit ein in NN-NNNNNNN form (deterministic test seed: 87-0000000 + sequence)."
          - "Set issued_at to current clock UTC."
          - "Possible automatic BusinessEntity transition FORMING->ACTIVE if §1.2 preconditions now hold."
          - "increments EINApplication.version by 1."
      - from: PENDING
        to: REJECTED
        trigger: "POST /ein-applications/{id}/issue with reject=true"
        actor: StateAdmin
        preconditions:
          - "EINApplication.status == PENDING."
        side_effects:
          - "increments EINApplication.version by 1."

  - entity: RegisteredAgent
    initial_state: ACTIVE
    terminal_states: [RESIGNED]
    transitions:
      - from: ACTIVE
        to: RESIGNED
        trigger: "POST /registered-agents/{id}/resign OR cascaded from BusinessEntity DISSOLVED OR superseded by a new POST /business-entities/{id}/registered-agents (CREATE-with-supersede)."
        actor: Filer | system
        preconditions:
          - "RegisteredAgent.status == ACTIVE."
        side_effects:
          - "Set resigned_at to current clock UTC."
          - "If triggered by resignation (not cascade and not supersede), BusinessEntity.compliance_posture is recomputed (§1.3); typically -> RESTRICTED if no other ACTIVE agent exists."
          - "Emit ComplianceEvent event_type=AGENT_REPLACED only when superseded by a new RegisteredAgent (Rule 4 cascade hop)."
          - "increments RegisteredAgent.version by 1."

  - entity: AnnualReport
    initial_state: DRAFT
    terminal_states: [VOIDED]
    transitions:
      - from: DRAFT
        to: FILED
        trigger: "POST /annual-reports/{id}/file"
        actor: Filer
        preconditions:
          - "AnnualReport.status == DRAFT."
          - "BusinessEntity.status != DISSOLVED."
          - "BusinessEntity.compliance_posture != FROZEN OR (BusinessEntity.status == SUSPENDED AND this filing is the cure-path under reinstatement preparation)."
          - "Exactly one RegisteredAgent in ACTIVE for this BusinessEntity."
        side_effects:
          - "Recompute franchise_tax_amount_cents via assessed variant (§1.3)."
          - "Recompute late_fee_cents via §1.3 late_fee_accrual (0 if filed on or before deadline)."
          - "Set filed_at to current clock UTC."
          - "Recompute BusinessEntity.franchise_tax_paid_through_year (max period_year of FILED reports)."
          - "Recompute BusinessEntity.cumulative_franchise_tax_paid_cents."
          - "Possible automatic BusinessEntity DELINQUENT->ACTIVE if §1.2 preconditions now hold."
          - "Emit ComplianceEvent event_type=REPORT_FILED."
          - "increments AnnualReport.version by 1."
      - from: DELINQUENT
        to: FILED
        trigger: "POST /annual-reports/{id}/file"
        actor: Filer
        preconditions:
          - "AnnualReport.status == DELINQUENT."
          - "BusinessEntity.status in {DELINQUENT, SUSPENDED}."
          - "Exactly one RegisteredAgent in ACTIVE for this BusinessEntity."
        side_effects:
          - "Recompute franchise_tax_amount_cents via assessed variant (§1.3)."
          - "Recompute late_fee_cents via §1.3 late_fee_accrual."
          - "Set filed_at to current clock UTC."
          - "Recompute BusinessEntity.franchise_tax_paid_through_year and cumulative_franchise_tax_paid_cents."
          - "Possible automatic BusinessEntity DELINQUENT->ACTIVE."
          - "Emit ComplianceEvent event_type=REPORT_FILED."
          - "increments AnnualReport.version by 1."
      - from: DRAFT
        to: DELINQUENT
        trigger: "Automatic when current clock UTC > April 15 (23:59:59Z) of (period_year + 1) and status is still DRAFT."
        actor: system
        preconditions:
          - "AnnualReport.status == DRAFT."
          - "current_clock_utc > {period_year+1}-04-15T23:59:59Z."
        side_effects:
          - "Recompute BusinessEntity.compliance_posture -> RESTRICTED."
          - "Possible automatic BusinessEntity ACTIVE->DELINQUENT (Rule 4 cascade hop 2)."
          - "Emit ComplianceEvent event_type=DELINQUENT_AUTO."
          - "increments AnnualReport.version by 1."
      - from: FILED
        to: VOIDED
        trigger: "POST /annual-reports/{id}/void"
        actor: ComplianceOfficer
        preconditions:
          - "AnnualReport.status == FILED."
          - "BusinessEntity.status != DISSOLVED."
        side_effects:
          - "Set voided_at to current clock UTC."
          - "Recompute BusinessEntity.franchise_tax_paid_through_year and cumulative_franchise_tax_paid_cents (Rule 9 invariant: refile must restore exactly)."
          - "Emit ComplianceEvent event_type=REPORT_VOIDED."
          - "increments AnnualReport.version by 1."

  - entity: ForeignQualification
    initial_state: PENDING
    terminal_states: [WITHDRAWN]
    transitions:
      - from: PENDING
        to: QUALIFIED
        trigger: "POST /foreign-qualifications/{id}/approve"
        actor: StateAdmin
        preconditions:
          - "ForeignQualification.status == PENDING."
          - "BusinessEntity.compliance_posture == GOOD_STANDING (cross-entity gate)."
          - "ForeignQualification.foreign_registered_agent_id resolves to a RegisteredAgent with status=ACTIVE and agent_state_code == ForeignQualification.foreign_state_code."
          - "No other ForeignQualification for the same (business_entity_id, foreign_state_code) has status=QUALIFIED whose [qualified_at, withdrawn_at) interval covers current clock UTC."
        side_effects:
          - "Set qualified_at to current clock UTC."
          - "Emit ComplianceEvent event_type=FQ_QUALIFIED."
          - "increments ForeignQualification.version by 1."
      - from: QUALIFIED
        to: WITHDRAWN
        trigger: "POST /foreign-qualifications/{id}/withdraw"
        actor: Filer
        preconditions:
          - "ForeignQualification.status == QUALIFIED."
        side_effects:
          - "Set withdrawn_at to current clock UTC."
          - "Emit ComplianceEvent event_type=FQ_WITHDRAWN."
          - "increments ForeignQualification.version by 1."

  - entity: BOIDisclosure
    initial_state: DRAFT
    terminal_states: []     # cyclic SUBMITTED <-> AMENDED; no terminal state
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /boi-disclosures/{id}/submit"
        actor: Filer
        preconditions:
          - "BOIDisclosure.status == DRAFT."
          - "BusinessEntity.status != DISSOLVED."
          - "Exactly one RegisteredAgent in ACTIVE for this BusinessEntity (cross-entity gate)."
          - "Sum of beneficial_owners_json[*].ownership_pct == 100 exactly."
          - "Current clock UTC <= boi_filing_deadline for this BOIDisclosure (§1.3)."
        side_effects:
          - "Set submitted_at to current clock UTC."
          - "Emit ComplianceEvent event_type=BOI_SUBMITTED."
          - "increments BOIDisclosure.version by 1."
      - from: SUBMITTED
        to: AMENDED
        trigger: "POST /boi-disclosures/{id}/amend"
        actor: Filer
        preconditions:
          - "BOIDisclosure.status == SUBMITTED."
          - "BusinessEntity.status != DISSOLVED."
        side_effects:
          - "Sum of beneficial_owners_json[*].ownership_pct == 100 enforced on the amended payload."
          - "increments BOIDisclosure.version by 1."
      - from: AMENDED
        to: SUBMITTED
        trigger: "POST /boi-disclosures/{id}/submit  (re-submit after amendment; the SUBMITTED<->AMENDED cycle of Rule 3)"
        actor: Filer
        preconditions:
          - "BOIDisclosure.status == AMENDED."
          - "BusinessEntity.status != DISSOLVED."
          - "Exactly one RegisteredAgent in ACTIVE for this BusinessEntity."
          - "Sum of beneficial_owners_json[*].ownership_pct == 100 exactly."
        side_effects:
          - "Set submitted_at to current clock UTC."
          - "Emit ComplianceEvent event_type=BOI_SUBMITTED."
          - "increments BOIDisclosure.version by 1."

# =============================================================================
# §1.2.1 Concurrency Rules — OCC on the parent's `version`
# =============================================================================
concurrency_rules:
  - rule_id: registered-agent-create-stale-business-entity
    parent_entity: BusinessEntity
    write_endpoint: "POST /business-entities/{id}/registered-agents"
    occ_field: expected_business_entity_version
    description: |
      Creating a new RegisteredAgent against a BusinessEntity whose version
      has advanced since the client last observed it is rejected. This is the
      true-race case (CREATE-with-supersede): the new RegisteredAgent
      legitimately supersedes any prior ACTIVE one — the natural product
      semantic — and the only way to detect a stale view is via OCC on
      BusinessEntity.version, which has been bumped by the prior writer's
      successful supersede.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: franchise_tax
    trigger: "Computed (a) provisionally at AnnualReport create, (b) assessed at AnnualReport FILE transition; written to AnnualReport.franchise_tax_amount_cents."
    algorithm: tiered_pricing
    formula: |
      base_cents = BASE_BY_STATE[BusinessEntity.formation_state_code][BusinessEntity.entity_type]
      tier_multiplier_x100 = TIER_MULT_X100[BusinessEntity.revenue_band]
      raw_cents = (base_cents * tier_multiplier_x100) // 100      # integer floor division per dollar of base
      # Rule 2 mode (a): non-linear interaction — base depends on (state, entity_type); multiplier on revenue_band; tiered selection.
      assessed_variant_minimum_cents = MIN_FLOOR_BY_STATE[BusinessEntity.formation_state_code]
      franchise_tax_amount_cents = max(raw_cents, assessed_variant_minimum_cents)
    input_set: "BusinessEntity.entity_type, formation_state_code, revenue_band (current at the moment the calculation runs)."
    constants:
      BASE_BY_STATE:
        CA: { LLC: 80000, CORP: 80000, LP: 80000 }      # cents = $800
        DE: { LLC: 30000, CORP: 17500, LP: 30000 }      # cents = $300 / $175 / $300
        NY: { LLC: 2500,  CORP: 2500,  LP: 2500 }       # cents = $25
        TX: { LLC: 0,     CORP: 0,     LP: 0 }
        FL: { LLC: 13875, CORP: 15000, LP: 50000 }
        WY: { LLC: 6000,  CORP: 6000,  LP: 10000 }
      TIER_MULT_X100:
        ZERO: 100        # 1.00x
        MICRO: 100       # 1.00x
        SMALL: 110       # 1.10x
        MEDIUM: 125      # 1.25x
        LARGE: 150       # 1.50x
      MIN_FLOOR_BY_STATE:
        CA: 80000
        DE: 17500
        NY: 2500
        TX: 0
        FL: 13875
        WY: 6000
    precision: "integer cents; floor division per intermediate step; no rounding."
    variants:
      - name: provisional_estimate
        when: "At AnnualReport CREATE — uses BusinessEntity.revenue_band as declared at create time."
        difference: "May diverge from the assessed value if revenue_band is updated between create and file (the assessed variant always re-reads the band at FILE)."
      - name: assessed_final
        when: "At AnnualReport FILE — re-evaluates against current BusinessEntity.revenue_band."
        difference: "Same formula; binding result written to AnnualReport.franchise_tax_amount_cents."

  - name: late_fee_accrual
    trigger: "Computed at AnnualReport FILE; written to AnnualReport.late_fee_cents."
    algorithm: chronological
    formula: |
      deadline_utc = ISO(f"{AnnualReport.period_year+1}-04-15T23:59:59Z")
      filed_utc = current clock UTC
      if filed_utc <= deadline_utc:
          late_fee_cents = 0
      else:
          # Rule 2 mode (b): rounding-order is pinned — per-day fee rounded, THEN summed.
          # The alternative ("sum then round") is FORBIDDEN; tests pin the per-day order.
          delta_seconds = int((filed_utc - deadline_utc).total_seconds())
          days_late = max(1, (delta_seconds + 86399) // 86400)              # ceil to whole days, minimum 1 day
          daily_rate_cents_x100 = DAILY_RATE_BY_STATE_X100[BusinessEntity.formation_state_code]   # cents * 100
          per_day_fee_cents = (daily_rate_cents_x100 + 50) // 100           # round_half_up to cents
          accrued_cents = per_day_fee_cents * days_late
          late_fee_cents = min(accrued_cents, LATE_FEE_CAP_CENTS)
    input_set: "AnnualReport.period_year, BusinessEntity.formation_state_code, current clock UTC."
    constants:
      DAILY_RATE_BY_STATE_X100:
        CA: 5550        # 55.50 cents/day
        DE: 11100       # 111.00 cents/day
        NY: 2250        # 22.50 cents/day
        TX: 0           # no late fee
        FL: 7775        # 77.75 cents/day
        WY: 3325        # 33.25 cents/day
      LATE_FEE_CAP_CENTS: 25000000   # $250,000 cap
    precision: "round_half_up per-day fee to cents; then multiply by integer days_late; floor by cap."

  - name: boi_filing_deadline
    trigger: "Computed read-only when creating a BOIDisclosure; consulted at submit/amend transitions; written to BOIDisclosure (derived, returned in GET response only)."
    algorithm: threshold
    formula: |
      base_utc = BusinessEntity.formed_at if triggering_event == FORMATION else current clock UTC at BOIDisclosure create
      grace_days = GRACE_DAYS_BY_TRIGGER[triggering_event]
      deadline_utc = base_utc + (grace_days days)   # whole-day addition at UTC
    input_set: "BOIDisclosure.triggering_event, BusinessEntity.formed_at, current clock UTC."
    constants:
      GRACE_DAYS_BY_TRIGGER:
        FORMATION: 90
        AMENDMENT: 30
        ANNUAL_REFRESH: 30
    precision: "whole-day arithmetic at UTC; comparison is `current_clock_utc <= deadline_utc` (inclusive on the deadline second)."

  - name: compliance_posture
    trigger: "Computed (a) realtime at every BusinessEntity mutation or child-cascade hop; (b) snapshot-at-year-end variant pins posture at Dec 31 23:59:59Z for compliance certificates."
    algorithm: constraint_propagation
    formula: |
      if BusinessEntity.status == DISSOLVED: posture = FROZEN
      elif BusinessEntity.status == SUSPENDED: posture = FROZEN
      elif any AnnualReport.status == DELINQUENT for this BusinessEntity: posture = RESTRICTED
      elif no RegisteredAgent.status == ACTIVE for this BusinessEntity: posture = RESTRICTED
      elif any BOIDisclosure exists and the most-recent BOIDisclosure.submitted_at + 365 days < current_clock_utc: posture = RESTRICTED
      else: posture = GOOD_STANDING
    input_set: "BusinessEntity.status, all AnnualReport.status, all RegisteredAgent.status, most-recent BOIDisclosure.submitted_at, current clock UTC."
    constants:
      BOI_REFRESH_DAYS: 365
    precision: "discrete enum result; no numeric precision."
    variants:
      - name: realtime
        when: "Every write that mutates BusinessEntity or any of its children — used by all state-machine preconditions and side-effect gates."
        difference: "Reads `current clock UTC` and current child states; result reflects the system-of-record state at the instant of the write."
      - name: snapshot_at_year_end
        when: "GET /business-entities/{id}/posture-snapshot?year=YYYY — used to issue compliance certificates."
        difference: "Substitutes current_clock_utc with `{year}-12-31T23:59:59Z` and uses each child's state-as-of that timestamp (AnnualReport delinquency is evaluated against that snapshot, not now)."

# =============================================================================
# §1.4 Validation Rules Table (Ordered by Priority)
# =============================================================================
validations:
  - priority: 10
    category: auth
    check: "X-User-Role and X-User-ID headers MUST be present and X-User-Role MUST be one of the declared roles in §1.7."
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all except POST /business-entities (Anonymous allowed) and POST /_clock/set_current_utc"
  - priority: 20
    category: auth
    check: "Role MUST be in the endpoint's `roles:` list."
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all"
  - priority: 30
    category: existence
    check: "Every path-templated id resolves to a persisted entity of the expected type; FK fields in payload resolve to persisted entities of the declared type."
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints with path-templated ids or FK inputs"
  - priority: 40
    category: state
    check: "Target resource is in a state from which the requested transition is permitted (per §1.2)."
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all action endpoints (file, execute, issue, resign, approve, withdraw, dissolve, reinstate, submit, amend, void)"
  - priority: 45
    category: state
    check: "Cross-entity gate: BusinessEntity.status != DISSOLVED for any child mutation."
    error_id: ERR_ENTITY_DISSOLVED
    http_status: 409
    applies_to: "all child create / action endpoints"
  - priority: 50
    category: business_safety
    check: "BOIDisclosure beneficial_owners_json: 1..25 entries; each ownership_pct integer 1..100; SUM == 100 EXACTLY; control_role in {OWNER, CONTROLLER, BOTH}."
    error_id: ERR_BOI_INVALID
    http_status: 422
    applies_to: "POST /business-entities/{id}/boi-disclosures, POST /boi-disclosures/{id}/amend, POST /boi-disclosures/{id}/submit"
  - priority: 55
    category: business_safety
    check: "OperatingAgreement members_json: 1..50 entries; each ownership_pct integer 1..100; SUM == 100 EXACTLY."
    error_id: ERR_OPERATING_AGREEMENT_INVALID
    http_status: 422
    applies_to: "POST /business-entities/{id}/operating-agreements, POST /operating-agreements/{id}/execute"
  - priority: 60
    category: business_referential
    check: "ForeignQualification.foreign_registered_agent_id MUST resolve to a RegisteredAgent whose status=ACTIVE AND agent_state_code == ForeignQualification.foreign_state_code."
    error_id: ERR_FQ_AGENT_MISMATCH
    http_status: 422
    applies_to: "POST /business-entities/{id}/foreign-qualifications, POST /foreign-qualifications/{id}/approve"
  - priority: 65
    category: business_referential
    check: "RegisteredAgent.agent_state_code MUST equal BusinessEntity.formation_state_code when agent is created against the home-state entity (in-state agent rule); foreign-state agents are created with the same endpoint but a different agent_state_code AND are only consumable by ForeignQualification."
    error_id: ERR_AGENT_STATE_MISMATCH
    http_status: 422
    applies_to: "POST /business-entities/{id}/registered-agents"
  - priority: 70
    category: business_temporal
    check: "AnnualReport uniqueness: at most one AnnualReport per (business_entity_id, period_year) across the lifetime of the entity (zero-width interval; even VOIDED reports occupy the slot)."
    error_id: ERR_REPORT_PERIOD_TAKEN
    http_status: 409
    applies_to: "POST /business-entities/{id}/annual-reports"
  - priority: 72
    category: business_temporal
    check: "ForeignQualification uniqueness: at most one ForeignQualification per (business_entity_id, foreign_state_code) whose [qualified_at, withdrawn_at) half-open interval covers current clock UTC."
    error_id: ERR_FQ_OVERLAP
    http_status: 409
    applies_to: "POST /business-entities/{id}/foreign-qualifications, POST /foreign-qualifications/{id}/approve"
  - priority: 75
    category: business_constraint
    check: "BOI submit/amend: current clock UTC MUST be on or before boi_filing_deadline (§1.3)."
    error_id: ERR_BOI_PAST_DEADLINE
    http_status: 422
    applies_to: "POST /boi-disclosures/{id}/submit"
  - priority: 80
    category: business_constraint
    check: "ForeignQualification.foreign_state_code MUST differ from BusinessEntity.formation_state_code."
    error_id: ERR_FQ_SAME_STATE
    http_status: 422
    applies_to: "POST /business-entities/{id}/foreign-qualifications"
  - priority: 85
    category: business_constraint
    check: "OperatingAgreement.template_type MUST match entity_type: MEMBER_MANAGED/MANAGER_MANAGED only for LLC; LP_GENERAL_LIMITED only for LP; CORP rejects any OperatingAgreement creation."
    error_id: ERR_TEMPLATE_TYPE_MISMATCH
    http_status: 422
    applies_to: "POST /business-entities/{id}/operating-agreements"
  - priority: 90
    category: business_fiscal
    check: "AnnualReport.file: BusinessEntity.cumulative_franchise_tax_paid_cents budget cap check — assessed franchise_tax_amount_cents + late_fee_cents MUST be < CUMULATIVE_CAP_CENTS."
    error_id: ERR_FRANCHISE_TAX_CAP_EXCEEDED
    http_status: 422
    applies_to: "POST /annual-reports/{id}/file"
  - priority: 95
    category: business_fiscal
    check: "ForeignQualification.approve: ALL prior AnnualReports for this BusinessEntity (period_year < clock year) MUST be in {FILED, VOIDED} — fiscal currency required before qualifying out of state."
    error_id: ERR_FRANCHISE_TAX_IN_ARREARS
    http_status: 422
    applies_to: "POST /foreign-qualifications/{id}/approve"
  - priority: 100
    category: state
    check: "OCC version check: any payload field named `expected_<parent>_version` MUST equal the parent's current `version`; mismatch is rejected per §1.2.1."
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /business-entities/{id}/registered-agents"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  - method: POST
    path: "/business-entities"
    description: "Create a new BusinessEntity (formation)."
    roles: [Anonymous, Filer]
    code: 201
    input: [legal_name, entity_type, formation_state_code, "revenue_band?"]
    output: BusinessEntity
    side_effects:
      - "BusinessEntity created with status=FORMING, compliance_posture=GOOD_STANDING (provisional)."
      - "formed_at server-stamped."

  - method: GET
    path: "/business-entities/{id}"
    description: "Get a BusinessEntity."
    roles: [Anonymous, Filer, StateAdmin, ComplianceOfficer]
    code: 200
    input: []
    output: BusinessEntity
    side_effects: []

  - method: GET
    path: "/business-entities"
    description: "List BusinessEntities with optional filters."
    roles: [Anonymous, Filer, StateAdmin, ComplianceOfficer]
    code: 200
    input: ["formation_state_code?", "entity_type?", "status?", "limit?", "offset?"]
    output: BusinessEntity[]
    side_effects: []

  - method: PATCH
    path: "/business-entities/{id}/dissolve"
    description: "Voluntary dissolution by the filer."
    roles: [Filer]
    code: 200
    input: []
    output: BusinessEntity
    side_effects:
      - "BusinessEntity transitions ACTIVE|DELINQUENT -> DISSOLVED (terminal)."
      - "All DRAFT/DELINQUENT AnnualReports flip to VOIDED."
      - "All ACTIVE RegisteredAgents flip to RESIGNED."
      - "compliance_posture -> FROZEN."
      - "increments BusinessEntity.version by 1."

  - method: POST
    path: "/business-entities/{id}/reinstate"
    description: "State-admin reinstatement of a SUSPENDED entity."
    roles: [StateAdmin]
    code: 200
    input: []
    output: BusinessEntity
    side_effects:
      - "BusinessEntity transitions SUSPENDED -> ACTIVE."
      - "compliance_posture recomputed."
      - "increments BusinessEntity.version by 1."

  - method: POST
    path: "/business-entities/{id}/registered-agents"
    description: "Create a RegisteredAgent on the BusinessEntity. CREATE-with-supersede: the prior ACTIVE agent (if any) is auto-resigned in the same request — true race resolved via OCC on BusinessEntity.version."
    roles: [Filer]
    code: 201
    input: [agent_name, agent_type, agent_state_code, expected_business_entity_version]
    output: RegisteredAgent
    side_effects:
      - "If a prior RegisteredAgent for this BusinessEntity is in ACTIVE, transition it ACTIVE -> RESIGNED (supersede)."
      - "New RegisteredAgent persisted in ACTIVE."
      - "Recompute BusinessEntity.compliance_posture."
      - "Possible automatic BusinessEntity FORMING -> ACTIVE if §1.2 preconditions now hold."
      - "increments BusinessEntity.version by 1."
      - "Emit ComplianceEvent event_type=AGENT_REPLACED when a prior agent was superseded."

  - method: GET
    path: "/business-entities/{id}/registered-agents"
    description: "List RegisteredAgents under a BusinessEntity (FK reverse-reachability)."
    roles: [Filer, StateAdmin, ComplianceOfficer]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: RegisteredAgent[]
    side_effects: []

  - method: GET
    path: "/registered-agents/{id}"
    description: "Get a single RegisteredAgent by id (also anchors the RegisteredAgent collection segment for FK reverse-reachability)."
    roles: [Filer, StateAdmin, ComplianceOfficer]
    code: 200
    input: []
    output: RegisteredAgent
    side_effects: []

  - method: GET
    path: "/registered-agents/{id}/foreign-qualifications"
    description: "List ForeignQualifications whose foreign_registered_agent_id equals the path id (FK reverse-reachability for ForeignQualification.foreign_registered_agent_id -> RegisteredAgent.id)."
    roles: [Filer, StateAdmin, ComplianceOfficer]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: ForeignQualification[]
    side_effects: []

  - method: POST
    path: "/registered-agents/{id}/resign"
    description: "Voluntary resignation of a RegisteredAgent."
    roles: [Filer]
    code: 200
    input: []
    output: RegisteredAgent
    side_effects:
      - "RegisteredAgent transitions ACTIVE -> RESIGNED."
      - "Recompute BusinessEntity.compliance_posture (typically -> RESTRICTED if no ACTIVE remains)."
      - "increments RegisteredAgent.version by 1."

  - method: POST
    path: "/business-entities/{id}/operating-agreements"
    description: "Create an OperatingAgreement in DRAFT (LLC/LP only)."
    roles: [Filer]
    code: 201
    input: [template_type, members_json]
    output: OperatingAgreement
    side_effects:
      - "OperatingAgreement persisted in DRAFT."

  - method: GET
    path: "/business-entities/{id}/operating-agreements"
    description: "List OperatingAgreements under a BusinessEntity."
    roles: [Filer, StateAdmin, ComplianceOfficer]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: OperatingAgreement[]
    side_effects: []

  - method: POST
    path: "/operating-agreements/{id}/execute"
    description: "Execute an OperatingAgreement (DRAFT -> EXECUTED)."
    roles: [Filer]
    code: 200
    input: []
    output: OperatingAgreement
    side_effects:
      - "OperatingAgreement transitions DRAFT -> EXECUTED, executed_at stamped."
      - "Any prior EXECUTED agreement on the same BusinessEntity flips EXECUTED -> SUPERSEDED."
      - "Possible automatic BusinessEntity FORMING -> ACTIVE if §1.2 preconditions now hold."
      - "increments OperatingAgreement.version by 1."

  - method: POST
    path: "/business-entities/{id}/ein-applications"
    description: "Create an EINApplication in PENDING."
    roles: [Filer]
    code: 201
    input: [responsible_party_name, responsible_party_ssn_last4]
    output: EINApplication
    side_effects:
      - "EINApplication persisted in PENDING."

  - method: GET
    path: "/business-entities/{id}/ein-applications"
    description: "List EINApplications under a BusinessEntity."
    roles: [Filer, StateAdmin, ComplianceOfficer]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: EINApplication[]
    side_effects: []

  - method: POST
    path: "/ein-applications/{id}/issue"
    description: "State-admin issuance or rejection of an EINApplication."
    roles: [StateAdmin]
    code: 200
    input: ["reject?"]
    output: EINApplication
    side_effects:
      - "EINApplication transitions PENDING -> ISSUED (default) or PENDING -> REJECTED (when reject=true)."
      - "On ISSUED: server-mint ein, set issued_at."
      - "Possible automatic BusinessEntity FORMING -> ACTIVE if §1.2 preconditions now hold."
      - "increments EINApplication.version by 1."

  - method: POST
    path: "/business-entities/{id}/annual-reports"
    description: "Create an AnnualReport in DRAFT for a period_year."
    roles: [Filer]
    code: 201
    input: [period_year]
    output: AnnualReport
    side_effects:
      - "AnnualReport persisted in DRAFT."
      - "Provisional franchise_tax_amount_cents stamped via §1.3 provisional_estimate variant."

  - method: GET
    path: "/business-entities/{id}/annual-reports"
    description: "List AnnualReports under a BusinessEntity."
    roles: [Filer, StateAdmin, ComplianceOfficer]
    code: 200
    input: ["status?", "period_year?", "limit?", "offset?"]
    output: AnnualReport[]
    side_effects: []

  - method: POST
    path: "/annual-reports/{id}/file"
    description: "File an AnnualReport (DRAFT|DELINQUENT -> FILED)."
    roles: [Filer]
    code: 200
    input: []
    output: AnnualReport
    side_effects:
      - "AnnualReport transitions to FILED; filed_at stamped."
      - "franchise_tax_amount_cents reassessed via §1.3 assessed_final variant."
      - "late_fee_cents computed via §1.3 late_fee_accrual."
      - "BusinessEntity.franchise_tax_paid_through_year and cumulative_franchise_tax_paid_cents recomputed."
      - "Possible automatic BusinessEntity DELINQUENT -> ACTIVE."
      - "increments AnnualReport.version by 1."

  - method: POST
    path: "/annual-reports/{id}/void"
    description: "ComplianceOfficer voids a FILED report (correction path)."
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: AnnualReport
    side_effects:
      - "AnnualReport transitions FILED -> VOIDED; voided_at stamped."
      - "BusinessEntity.franchise_tax_paid_through_year and cumulative_franchise_tax_paid_cents recomputed (Rule 9 invariant)."
      - "increments AnnualReport.version by 1."

  - method: POST
    path: "/business-entities/{id}/foreign-qualifications"
    description: "Create a ForeignQualification in PENDING."
    roles: [Filer]
    code: 201
    input: [foreign_state_code, foreign_registered_agent_id]
    output: ForeignQualification
    side_effects:
      - "ForeignQualification persisted in PENDING."

  - method: POST
    path: "/foreign-qualifications/{id}/approve"
    description: "StateAdmin approval (PENDING -> QUALIFIED)."
    roles: [StateAdmin]
    code: 200
    input: []
    output: ForeignQualification
    side_effects:
      - "ForeignQualification transitions PENDING -> QUALIFIED; qualified_at stamped."
      - "increments ForeignQualification.version by 1."

  - method: POST
    path: "/foreign-qualifications/{id}/withdraw"
    description: "Withdraw a QUALIFIED ForeignQualification (QUALIFIED -> WITHDRAWN)."
    roles: [Filer]
    code: 200
    input: []
    output: ForeignQualification
    side_effects:
      - "ForeignQualification transitions QUALIFIED -> WITHDRAWN; withdrawn_at stamped."
      - "increments ForeignQualification.version by 1."

  - method: GET
    path: "/business-entities/{id}/foreign-qualifications"
    description: "List ForeignQualifications under a BusinessEntity (FK reverse-reachability)."
    roles: [Filer, StateAdmin, ComplianceOfficer]
    code: 200
    input: ["status?", "foreign_state_code?", "limit?", "offset?"]
    output: ForeignQualification[]
    side_effects: []

  - method: POST
    path: "/business-entities/{id}/boi-disclosures"
    description: "Create a BOIDisclosure in DRAFT."
    roles: [Filer]
    code: 201
    input: [triggering_event, beneficial_owners_json]
    output: BOIDisclosure
    side_effects:
      - "BOIDisclosure persisted in DRAFT."

  - method: POST
    path: "/boi-disclosures/{id}/submit"
    description: "Submit (DRAFT|AMENDED -> SUBMITTED)."
    roles: [Filer]
    code: 200
    input: []
    output: BOIDisclosure
    side_effects:
      - "BOIDisclosure transitions to SUBMITTED; submitted_at stamped."
      - "increments BOIDisclosure.version by 1."

  - method: POST
    path: "/boi-disclosures/{id}/amend"
    description: "Amend a SUBMITTED BOIDisclosure (SUBMITTED -> AMENDED) with a new beneficial_owners_json payload."
    roles: [Filer]
    code: 200
    input: [beneficial_owners_json]
    output: BOIDisclosure
    side_effects:
      - "BOIDisclosure transitions SUBMITTED -> AMENDED; new beneficial_owners_json persisted."
      - "increments BOIDisclosure.version by 1."

  - method: GET
    path: "/business-entities/{id}/boi-disclosures"
    description: "List BOIDisclosures under a BusinessEntity (FK reverse-reachability)."
    roles: [Filer, StateAdmin, ComplianceOfficer]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: BOIDisclosure[]
    side_effects: []

  - method: GET
    path: "/business-entities/{id}/compliance-events"
    description: "List ComplianceEvent audit-trail entries under a BusinessEntity (FK reverse-reachability)."
    roles: [Filer, StateAdmin, ComplianceOfficer]
    code: 200
    input: ["event_type?", "limit?", "offset?"]
    output: ComplianceEvent[]
    side_effects: []

  - method: POST
    path: "/_clock/set_current_utc"
    description: "Test-driving endpoint: set the server's current clock UTC; mandatory for time-gated state transitions (AnnualReport DRAFT->DELINQUENT, BOI deadline)."
    roles: [StateAdmin, ComplianceOfficer]
    code: 200
    input: [to_iso8601]
    output: ClockSnapshot
    side_effects:
      - "Server-wide clock UTC pinned to to_iso8601."
      - "Re-evaluates time-gated transitions: any AnnualReport in DRAFT whose deadline has now passed flips DRAFT -> DELINQUENT (Rule 4 cascade origin); cascades into BusinessEntity ACTIVE -> DELINQUENT and posture recomputes."

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "Missing or unrecognized X-User-Role / X-User-ID headers on endpoints that require authentication."
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "Authenticated role is not in the endpoint's `roles:` list."
  - id: ERR_NOT_FOUND
    http: 404
    condition: "Path-templated id or FK input does not resolve to a persisted entity."
  - id: ERR_INVALID_STATE
    http: 409
    condition: "Target resource is in a state from which the requested transition is not permitted."
  - id: ERR_ENTITY_DISSOLVED
    http: 409
    condition: "Parent BusinessEntity.status == DISSOLVED; any further child mutation is forbidden."
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "Payload is malformed: missing required field, wrong type, or violates a declared `constraints:` clause on a §1.1 field (length, enum membership, regex)."
  - id: ERR_STALE_VERSION
    http: 412
    condition: "OCC: payload `expected_<parent>_version` does not match the parent's current `version`."
  - id: ERR_BOI_INVALID
    http: 422
    condition: "BOIDisclosure beneficial_owners_json fails the safety check (count out of 1..25, any ownership_pct out of 1..100, sum != 100, bad control_role)."
  - id: ERR_OPERATING_AGREEMENT_INVALID
    http: 422
    condition: "OperatingAgreement members_json fails the safety check (count out of 1..50, any ownership_pct out of 1..100, sum != 100)."
  - id: ERR_FQ_AGENT_MISMATCH
    http: 422
    condition: "ForeignQualification.foreign_registered_agent_id references an agent that is not ACTIVE or whose agent_state_code != foreign_state_code."
  - id: ERR_AGENT_STATE_MISMATCH
    http: 422
    condition: "Home-state RegisteredAgent agent_state_code != BusinessEntity.formation_state_code (in-state agent rule)."
  - id: ERR_REPORT_PERIOD_TAKEN
    http: 409
    condition: "An AnnualReport for this (business_entity_id, period_year) already exists (zero-width interval uniqueness)."
  - id: ERR_FQ_OVERLAP
    http: 409
    condition: "Another ForeignQualification for the same (business_entity_id, foreign_state_code) is currently QUALIFIED (half-open interval overlap)."
  - id: ERR_BOI_PAST_DEADLINE
    http: 422
    condition: "Current clock UTC > boi_filing_deadline at submit time."
  - id: ERR_FQ_SAME_STATE
    http: 422
    condition: "ForeignQualification.foreign_state_code equals BusinessEntity.formation_state_code."
  - id: ERR_TEMPLATE_TYPE_MISMATCH
    http: 422
    condition: "OperatingAgreement.template_type does not match entity_type (LLC vs LP vs CORP-rejected)."
  - id: ERR_FRANCHISE_TAX_CAP_EXCEEDED
    http: 422
    condition: "AnnualReport.file: assessed franchise_tax_amount_cents + late_fee_cents would push cumulative_franchise_tax_paid_cents past the cumulative cap."
  - id: ERR_FRANCHISE_TAX_IN_ARREARS
    http: 422
    condition: "ForeignQualification.approve: at least one AnnualReport with status NOT IN {FILED, VOIDED} exists for period_year < current clock year."

# =============================================================================
# §1.7 RBAC Matrix
