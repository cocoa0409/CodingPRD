    instances:
      - name: occ_ts_create_stale_patient_version
        claim_type: optimistic_concurrency
        grounds:
          - "concurrency_rules[ts-create-stale-patient]"
          - "errors[ERR_STALE_VERSION]"
        distinguishing_aspect: "The second T&S create carrying the pre-first-create patient version is rejected with 412."
        test_recipe:
          setup: ["clock 2026-08-10T09:00:00Z; patient created (version 1 captured); T&S#1 created (bumps Patient.version to 2)"]
          setup_api_calls:
            - call: "POST /blood-bank/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T09:00:00Z" }
              as: BloodBankSupervisor
            - call: "POST /blood-bank/patients"
              payload: { mrn: "M-6001", full_name: "Zach Doe", date_of_birth: "1988-08-08" }
              as: BloodBankTechnologist
              captures: { pat: $.data.id, pat_v: $.data.version }
            - call: "POST /blood-bank/type-and-screens"
              payload: { patient_id: "${pat}", specimen_collected_at: "2026-08-10T08:00:00Z", expected_patient_version: "${pat_v}" }
              as: BloodBankTechnologist
              as_user_id: "tech-a"
              captures: { ts1: $.data.id }
          trigger:
            - call: "POST /blood-bank/type-and-screens"
              payload: { patient_id: "${pat}", specimen_collected_at: "2026-08-10T08:30:00Z", expected_patient_version: "${pat_v}" }
              as: BloodBankTechnologist
              as_user_id: "tech-a"
              captures: { err: $.data.error_id }
          assert:
            - "response is 412 ERR_STALE_VERSION (pat_v is stale at 1; current is 2)"
            - "GET /blood-bank/type-and-screens?patient_id=${pat} -> total_count == 1"
      - name: occ_policy_update_stale_version
        claim_type: optimistic_concurrency
        grounds:
          - "concurrency_rules[policy-update-stale-version]"
          - "errors[ERR_STALE_VERSION]"
        distinguishing_aspect: "The second PUT carrying the pre-first-PUT policy version is rejected with 412; the successful PUT bumped version to 2."
        test_recipe:
          setup: ["policy created (version 1 captured)"]
          setup_api_calls:
            - call: "POST /blood-bank/par-level-policies"
              payload: { product_type: "RBC", abo_type: "O", rh_type: "NEG", watch_threshold: 6, shortage_threshold: 4, critical_threshold: 2 }
              as: BloodBankSupervisor
              captures: { pol: $.data.id, pol_v: $.data.version }
          trigger:
            - call: "PUT /blood-bank/par-level-policies/${pol}"
              payload: { expected_policy_version: "${pol_v}", watch_threshold: 8 }
              as: BloodBankSupervisor
              captures: { v2: $.data.version }
            - call: "PUT /blood-bank/par-level-policies/${pol}"
              payload: { expected_policy_version: "${pol_v}", watch_threshold: 9 }
              as: BloodBankSupervisor
              captures: { err: $.data.error_id }
          assert:
            - "first PUT: 200, v2 == 2, watch_threshold == 8"
            - "second PUT (same captured version): 412 ERR_STALE_VERSION; watch_threshold stays 8"
