  - rule_id: boundary_precision_check
    instances:
      - name: deductible_exact_equality_consumes_full_no_coinsurance
        grounds:
          - calculations.charge_patient_responsibility
          - entities.Patient.fields.insurance_deductible_remaining_cents
          - entities.Charge.fields.deductible_applied_cents
        distinguishing_aspect: |
          Numeric-threshold boundary on the deductible metric via POST /charges:
          when insurer_allowed_cents == insurance_deductible_remaining_cents
          exactly (both 8000), the whole allowed is deductible (deductible_applied
          8000), coinsurance remainder is 0, patient_responsibility==8000 and
          insurer_responsibility==0 with deductible_remaining landing on exactly 0.
        test_recipe:
          setup:
            - "Insured patient: coinsurance 0.2, deductible_remaining 8000, MEDICAL encounter BILLING_OPEN."
          setup_api_calls:
            - call: "POST /providers"
              payload: { full_name: "Dr Edge", npi: "NPI-10", active: true }
              as: PracticeAdmin
              captures: { prov_id: $.data.id }
            - call: "POST /patients"
              payload: { full_name: "Edge Pat", date_of_birth: "1977-12-12", has_active_insurance: true, insurance_coinsurance_rate: 0.2, insurance_deductible_remaining_cents: 8000 }
              as: FrontDesk
              captures: { pat_id: $.data.id }
            - call: "POST /encounters"
              payload: { patient_id: "${pat_id}", provider_id: "${prov_id}", visit_type: "MEDICAL", scheduled_at: "2026-01-10T09:00:00Z" }
              as: FrontDesk
              captures: { enc_id: $.data.id }
          trigger:
            - call: "POST /charges"
              payload: { patient_id: "${pat_id}", encounter_id: "${enc_id}", source_kind: "ENCOUNTER", charge_kind: "OFFICE_VISIT", billed_amount_cents: 8000, insurer_allowed_cents: 8000 }
              as: BillingSpecialist
              captures: { ch_id: $.data.id }
          assert:
            - "Charge.${ch_id}.deductible_applied_cents == 8000"
            - "Charge.${ch_id}.patient_responsibility_cents == 8000"
