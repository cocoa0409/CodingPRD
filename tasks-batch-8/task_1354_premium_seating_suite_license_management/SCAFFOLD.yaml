  - { method: GET, path: "/api/rentals", description: "List rentals (AccountHolder sees only own)", roles: [StadiumAdmin, PremiumSalesRep, FinanceController, EventServicesManager, AccountHolder], code: 200, input: ["event_id?", "suite_id?", "account_id?", "status?", "limit?", "offset?"], output: "SingleEventRental[]", side_effects: [] }
  - { method: POST, path: "/api/rentals/{id}/set_status", description: "Rental lifecycle (HELD | CONFIRMED | CANCELLED | EXPIRED) with hold window, deposit invoice, tiered cancel fees", roles: [PremiumSalesRep, AccountHolder, StadiumAdmin], code: 200, input: [target_status], output: SingleEventRental, side_effects: ["see SingleEventRental machine"] }

  # --- TransferRequest ---
  - { method: POST, path: "/api/transfer-requests", description: "Submit a transfer/sublease request (SUBMITTED)", roles: [AccountHolder], code: 201, input: [agreement_id, from_account_id, to_account_id, transfer_type, asking_price_cents], output: TransferRequest, side_effects: ["status=SUBMITTED"] }
  - { method: GET, path: "/api/transfer-requests/{id}", description: "Get a transfer request", roles: [StadiumAdmin, PremiumSalesRep, FinanceController, EventServicesManager, AccountHolder], code: 200, input: [], output: TransferRequest, side_effects: [] }
