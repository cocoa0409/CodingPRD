            - "Call 4 → total_count 0 (no statement was created by the preview)"
            - "Call 5 → total_count 1 with data[0].statement_id == null (the preview stamped nothing)"
            - "Call 6 → 201 with gross_cents 40000 and net_payable_cents 28000, proving the previewed window was still free"

