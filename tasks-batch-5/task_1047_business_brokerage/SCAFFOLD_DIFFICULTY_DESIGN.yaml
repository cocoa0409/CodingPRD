              captures: { cim_id: $.data.id }
            - call: "POST /brokerage/cims/${cim_id}/publish"
              payload: {}
              as: Broker
              as_user_id: "${broker_id}"
            - call: "POST /brokerage/listings/${listing_id}/activate"
