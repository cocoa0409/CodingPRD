            - "data[0].finding_type == \"OFF_POSTED_UNDERCHARGE\" (posted_gross 240000 exceeds gross 230000, so the retailer was undercharged)."
            - "data[0].variance_cents == 10000 and data[0].penalty_component_cents == 4000 (round_half_up(10000 * 0.40))."
