          assert:
            - "TaxReturn.${ret_id}.final_refund_cents == 430000: eitc = min(round(0.25*3000000)=750000, 650000) = 650000 (cap binds); liability = round(0.12*(3000000+500000)) = 420000; refund = max(0, 200000+650000-420000)"
            - "TaxReturn.${ret_id}.estimated_refund_cents == 650000 after PATCH: 200000 + min(round(0.15*3000000)=450000, 600000)"

      - name: savings_match_per_line_rounding
        grounds:
          - calculations.savings_match
          - entities.TaxReturn.fields.savings_match_cents
        distinguishing_aspect: |
          Mode (b) — nested rounding order (distinct from instance
          eitc_final_tier_cap_composition's mode (a)): the scaffold pins
          per-line floor-to-whole-dollars THEN summation; two SAVINGS lines of
