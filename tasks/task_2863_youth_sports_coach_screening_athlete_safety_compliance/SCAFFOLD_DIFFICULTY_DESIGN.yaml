              as: NgbAdmin
            - call: "POST /safesport/members"
              payload: { club_id: "${club_a_id}", full_name: "Ira Blaine", email: "ira.blaine@alpha.test", role_type: "VOLUNTEER", has_minor_athlete_contact: false, date_of_birth: "1989-01-15", jurisdiction_codes: ["CA"] }
              as: ClubAdministrator
              as_user_id: "${club_a_id}"
              captures: { m_br_id: $.data.id }
            - call: "POST /safesport/members/${m_br_id}/screening-orders"
              payload: { expedited: false, expected_club_version: "${club_a_v1}" }
              as: ClubAdministrator
              as_user_id: "${club_a_id}"
              captures: { so_br_id: $.data.id }
            - call: "POST /safesport/screening-orders/${so_br_id}/result"
