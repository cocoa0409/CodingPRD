      - name: customer_read_other_contract_forbidden
        claim_type: rbac_ownership
        grounds:
          - "roles[Customer]"
          - "errors[ERR_FORBIDDEN]"
        distinguishing_aspect: "Customer self-reads are scoped: Customer B reading Customer A's contract detail is denied 403."
        test_recipe:
          setup: ["customers A and B; one DRAFT contract belonging to A"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
