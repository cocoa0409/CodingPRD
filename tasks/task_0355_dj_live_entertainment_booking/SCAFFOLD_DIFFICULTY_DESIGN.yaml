scaffold_difficulty_design:

  # =====================================================================
  # RULE 1 — dual-variant calculations across different entity domains
  # =====================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: quote_provisional_vs_final_total_diverge_on_booking
        grounds:
          - calculations.booking_quote_total
          - calculations.overtime_charge
          - entities.Booking.fields.quote_total_cents
          - entities.Booking.fields.final_total_cents
        distinguishing_aspect: |
          The provisional quote (324000) excludes overtime while the final total
          (330000) includes the realized overtime block charge for the SAME booking,
          so final_total_cents - quote_total_cents == overtime_cents == 6000.
        test_recipe:
          setup:
            - "Clock at 2026-06-14T00:00:00Z."
            - "Zone Z_HOME (base 0) and Zone Z_EVENT (base 10000, per_mile 500, surge 12000bps)."
            - "Package STANDARD: flat 50000, included 120, deposit 2500bps, with two equipment lines 30000 + 20000."
            - "Performer base_set 200000, overtime 3000/15min, home zone Z_HOME."
            - "Booking event in Z_EVENT, 20 miles, contracted 120, event_start 2026-08-01T20:00:00Z."
            - "Booking driven to PERFORMING then completed with actual_set_minutes 150."
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { now_utc: "2026-06-14T00:00:00Z" }
              as: StudioAdmin
            - call: "POST /travel-zones"
              payload: { zone_code: "ZH", name: "Home", base_travel_fee_cents: 0, per_mile_fee_cents: 0, surge_multiplier_bps: 10000 }
              as: StudioAdmin
              captures: { zhome: $.data.id }
            - call: "POST /travel-zones"
              payload: { zone_code: "ZE", name: "Event", base_travel_fee_cents: 10000, per_mile_fee_cents: 500, surge_multiplier_bps: 12000 }
              as: StudioAdmin
              captures: { zevent: $.data.id }
            - call: "POST /packages"
              payload: { name: "Std", tier: "STANDARD", flat_package_fee_cents: 50000, included_set_minutes: 120, deposit_pct_bps: 2500 }
              as: StudioAdmin
              captures: { pkg: $.data.id }
            - call: "POST /packages/${pkg}/equipment"
              payload: { category: "SOUND", label: "PA", unit_fee_cents: 30000 }
              as: StudioAdmin
            - call: "POST /packages/${pkg}/equipment"
              payload: { category: "LIGHTING", label: "Rig", unit_fee_cents: 20000 }
              as: StudioAdmin
            - call: "POST /performers"
              payload: { stage_name: "DJ A", act_type: "DJ", genre: "HOUSE", home_zone_id: "${zhome}", base_set_rate_cents: 200000, overtime_rate_cents_per_15min: 3000 }
              as: StudioAdmin
              captures: { perf: $.data.id }
            - call: "POST /clients"
              payload: { full_name: "Client A", email: "a@x.com" }
              as: BookingAgent
              captures: { cli: $.data.id }
            - call: "POST /bookings"
              payload: { client_id: "${cli}", performer_id: "${perf}", package_id: "${pkg}", event_zone_id: "${zevent}", event_start_utc: "2026-08-01T20:00:00Z", event_miles_from_home: 20, contracted_set_minutes: 120 }
              as: BookingAgent
              captures: { bk: $.data.id }
            - call: "POST /bookings/${bk}/hold"
              payload: {}
              as: BookingAgent
              captures: { bkv_hold: $.data.version }
            - call: "POST /bookings/${bk}/issue-contract"
              payload: { expected_booking_version: "${bkv_hold}" }
              as: BookingAgent
              captures: { ct: $.data.id }
            - call: "GET /bookings/${bk}/contracts"
              payload: {}
              as: BookingAgent
              captures: { ctid: "$.data[0].id" }
            - call: "POST /contracts/${ctid}/sign"
              payload: {}
              as: Client
              as_user_id: "${cli}"
            - call: "POST /payments"
              payload: { booking_id: "${bk}", kind: "DEPOSIT", amount_cents: 81000 }
              as: BookingAgent
              captures: { pay: $.data.id }
            - call: "POST /payments/${pay}/capture"
              payload: {}
              as: BookingAgent
            - call: "POST /bookings/${bk}/start-set"
              payload: {}
              as: BookingAgent
          trigger:
            - call: "POST /bookings/${bk}/complete-set"
              payload: { actual_set_minutes: 150 }
              as: BookingAgent
              captures: { final: $.data.final_total_cents, quote: $.data.quote_total_cents, ot: $.data.overtime_cents }
          assert:
            - "Booking.${bk}.quote_total_cents == 324000"
            - "Booking.${bk}.overtime_cents == 6000"
            - "Booking.${bk}.final_total_cents == 330000"
            - "Booking.${bk}.final_total_cents - Booking.${bk}.quote_total_cents == 6000"

      - name: travel_fee_waiver_vs_charged_diverge_on_zone
        grounds:
          - calculations.travel_fee
          - calculations.travel_fee.variants.home_zone_waiver
          - entities.Booking.fields.quote_total_cents
          - entities.TravelZone.fields.surge_multiplier_bps
        distinguishing_aspect: |
          Same performer, package and miles produce travel 0 when event_zone == home_zone
          (quote 300000) but travel 24000 when event_zone != home_zone (quote 324000);
          the divergence is on the TravelZone domain, not the Booking cost domain.
        test_recipe:
          setup:
            - "Clock at 2026-06-14T00:00:00Z."
            - "Two zones: Z_HOME and Z_EVENT (base 10000, per_mile 500, surge 12000bps)."
            - "Same STANDARD package (flat 50000, equip 30000+20000) and performer (base 200000) home zone Z_HOME."
            - "Booking H: event in Z_HOME, 20 miles. Booking E: event in Z_EVENT, 20 miles."
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { now_utc: "2026-06-14T00:00:00Z" }
              as: StudioAdmin
            - call: "POST /travel-zones"
              payload: { zone_code: "ZH", name: "Home", base_travel_fee_cents: 0, per_mile_fee_cents: 0, surge_multiplier_bps: 10000 }
              as: StudioAdmin
              captures: { zhome: $.data.id }
            - call: "POST /travel-zones"
              payload: { zone_code: "ZE", name: "Event", base_travel_fee_cents: 10000, per_mile_fee_cents: 500, surge_multiplier_bps: 12000 }
              as: StudioAdmin
              captures: { zevent: $.data.id }
            - call: "POST /packages"
              payload: { name: "Std", tier: "STANDARD", flat_package_fee_cents: 50000, included_set_minutes: 120, deposit_pct_bps: 2500 }
              as: StudioAdmin
              captures: { pkg: $.data.id }
            - call: "POST /packages/${pkg}/equipment"
              payload: { category: "SOUND", label: "PA", unit_fee_cents: 30000 }
              as: StudioAdmin
            - call: "POST /packages/${pkg}/equipment"
              payload: { category: "LIGHTING", label: "Rig", unit_fee_cents: 20000 }
              as: StudioAdmin
            - call: "POST /performers"
              payload: { stage_name: "DJ A", act_type: "DJ", genre: "HOUSE", home_zone_id: "${zhome}", base_set_rate_cents: 200000, overtime_rate_cents_per_15min: 3000 }
              as: StudioAdmin
              captures: { perf: $.data.id }
            - call: "POST /clients"
              payload: { full_name: "Client A", email: "a@x.com" }
              as: BookingAgent
              captures: { cli: $.data.id }
            - call: "POST /bookings"
              payload: { client_id: "${cli}", performer_id: "${perf}", package_id: "${pkg}", event_zone_id: "${zhome}", event_start_utc: "2026-08-01T20:00:00Z", event_miles_from_home: 20, contracted_set_minutes: 120 }
              as: BookingAgent
              captures: { bkH: $.data.id }
            - call: "POST /bookings/${bkH}/hold"
              payload: {}
              as: BookingAgent
              captures: { qH: $.data.quote_total_cents }
            - call: "POST /bookings"
              payload: { client_id: "${cli}", performer_id: "${perf}", package_id: "${pkg}", event_zone_id: "${zevent}", event_start_utc: "2026-09-05T20:00:00Z", event_miles_from_home: 20, contracted_set_minutes: 120 }
              as: BookingAgent
              captures: { bkE: $.data.id }
          trigger:
            - call: "POST /bookings/${bkE}/hold"
              payload: {}
              as: BookingAgent
              captures: { qE: $.data.quote_total_cents }
          assert:
            - "Booking.${bkH}.quote_total_cents == 300000"
            - "Booking.${bkE}.quote_total_cents == 324000"
            - "Booking.${bkE}.quote_total_cents - Booking.${bkH}.quote_total_cents == 24000"

  # =====================================================================
  # RULE 2 — combinatorial formulas across different modes
  # =====================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: quote_total_mode_a_nonlinear_threshold_branch
        grounds:
          - calculations.booking_quote_total
          - calculations.travel_fee
          - entities.Booking.fields.quote_total_cents
        distinguishing_aspect: |
          Mode (a): quote combines >=3 inputs (set rate, package flat, summed equipment,
          travel) where travel itself is a conditional branch on home-zone identity and a
          surge multiplication — non-linear interaction yielding 324000 for the charged path.
        test_recipe:
          setup:
            - "Clock at 2026-06-14T00:00:00Z; charged-zone booking as in dual_variant instance 1."
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { now_utc: "2026-06-14T00:00:00Z" }
              as: StudioAdmin
            - call: "POST /travel-zones"
              payload: { zone_code: "ZH", name: "Home", base_travel_fee_cents: 0, per_mile_fee_cents: 0, surge_multiplier_bps: 10000 }
              as: StudioAdmin
              captures: { zhome: $.data.id }
            - call: "POST /travel-zones"
              payload: { zone_code: "ZE", name: "Event", base_travel_fee_cents: 10000, per_mile_fee_cents: 500, surge_multiplier_bps: 12000 }
              as: StudioAdmin
              captures: { zevent: $.data.id }
            - call: "POST /packages"
              payload: { name: "Std", tier: "STANDARD", flat_package_fee_cents: 50000, included_set_minutes: 120, deposit_pct_bps: 2500 }
              as: StudioAdmin
              captures: { pkg: $.data.id }
            - call: "POST /packages/${pkg}/equipment"
              payload: { category: "SOUND", label: "PA", unit_fee_cents: 30000 }
              as: StudioAdmin
            - call: "POST /packages/${pkg}/equipment"
              payload: { category: "LIGHTING", label: "Rig", unit_fee_cents: 20000 }
              as: StudioAdmin
            - call: "POST /performers"
              payload: { stage_name: "DJ A", act_type: "DJ", genre: "HOUSE", home_zone_id: "${zhome}", base_set_rate_cents: 200000, overtime_rate_cents_per_15min: 3000 }
              as: StudioAdmin
              captures: { perf: $.data.id }
            - call: "POST /clients"
              payload: { full_name: "Client A", email: "a@x.com" }
              as: BookingAgent
              captures: { cli: $.data.id }
            - call: "POST /bookings"
              payload: { client_id: "${cli}", performer_id: "${perf}", package_id: "${pkg}", event_zone_id: "${zevent}", event_start_utc: "2026-08-01T20:00:00Z", event_miles_from_home: 20, contracted_set_minutes: 120 }
              as: BookingAgent
              captures: { bk: $.data.id }
          trigger:
            - call: "POST /bookings/${bk}/hold"
              payload: {}
              as: BookingAgent
              captures: { q: $.data.quote_total_cents }
          assert:
            - "Booking.${bk}.quote_total_cents == 324000"
            - "Booking.${bk}.deposit_required_cents == 81000"

      - name: cancellation_fee_mode_c_ordered_tier_then_surcharge
        grounds:
          - calculations.cancellation_fee
          - calculations.cancellation_fee.variants.confirmed_surcharge
          - entities.Booking.fields.cancellation_fee_cents
        distinguishing_aspect: |
          Mode (c): cancellation_fee pins evaluation order — the lead-time tier (here
          lead_days 48 -> 1000bps) is computed first, THEN the CONFIRMED +1000bps surcharge
          is layered (capped at 10000), so order is load-bearing: 324000*2000/10000 == 64800.
        test_recipe:
          setup:
            - "Clock 2026-06-14 (lead 48 days). Booking driven to CONFIRMED, then cancelled."
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { now_utc: "2026-06-14T00:00:00Z" }
              as: StudioAdmin
            - call: "POST /travel-zones"
              payload: { zone_code: "ZH", name: "Home", base_travel_fee_cents: 0, per_mile_fee_cents: 0, surge_multiplier_bps: 10000 }
              as: StudioAdmin
              captures: { zhome: $.data.id }
            - call: "POST /travel-zones"
              payload: { zone_code: "ZE", name: "Event", base_travel_fee_cents: 10000, per_mile_fee_cents: 500, surge_multiplier_bps: 12000 }
              as: StudioAdmin
              captures: { zevent: $.data.id }
            - call: "POST /packages"
              payload: { name: "Std", tier: "STANDARD", flat_package_fee_cents: 50000, included_set_minutes: 120, deposit_pct_bps: 2500 }
              as: StudioAdmin
              captures: { pkg: $.data.id }
            - call: "POST /packages/${pkg}/equipment"
              payload: { category: "SOUND", label: "PA", unit_fee_cents: 30000 }
              as: StudioAdmin
            - call: "POST /packages/${pkg}/equipment"
              payload: { category: "LIGHTING", label: "Rig", unit_fee_cents: 20000 }
              as: StudioAdmin
            - call: "POST /performers"
              payload: { stage_name: "DJ A", act_type: "DJ", genre: "HOUSE", home_zone_id: "${zhome}", base_set_rate_cents: 200000, overtime_rate_cents_per_15min: 3000 }
              as: StudioAdmin
              captures: { perf: $.data.id }
            - call: "POST /clients"
              payload: { full_name: "Client A", email: "a@x.com" }
              as: BookingAgent
              captures: { cli: $.data.id }
            - call: "POST /bookings"
              payload: { client_id: "${cli}", performer_id: "${perf}", package_id: "${pkg}", event_zone_id: "${zevent}", event_start_utc: "2026-08-01T20:00:00Z", event_miles_from_home: 20, contracted_set_minutes: 120 }
              as: BookingAgent
              captures: { bk: $.data.id }
            - call: "POST /bookings/${bk}/hold"
              payload: {}
              as: BookingAgent
              captures: { bkv_hold: $.data.version }
            - call: "POST /bookings/${bk}/issue-contract"
              payload: { expected_booking_version: "${bkv_hold}" }
              as: BookingAgent
            - call: "GET /bookings/${bk}/contracts"
              payload: {}
              as: BookingAgent
              captures: { ctid: "$.data[0].id" }
            - call: "POST /contracts/${ctid}/sign"
              payload: {}
              as: Client
              as_user_id: "${cli}"
            - call: "POST /payments"
              payload: { booking_id: "${bk}", kind: "DEPOSIT", amount_cents: 81000 }
              as: BookingAgent
              captures: { pay: $.data.id }
            - call: "POST /payments/${pay}/capture"
              payload: {}
              as: BookingAgent
          trigger:
            - call: "POST /bookings/${bk}/cancel"
              payload: {}
              as: BookingAgent
              captures: { fee: $.data.cancellation_fee_cents }
          assert:
            - "Booking.${bk}.status == CANCELLED"
            - "Booking.${bk}.cancellation_fee_cents == 64800"

  # =====================================================================
  # RULE 3 — non-linear state-machine shape on different entities
  # =====================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: booking_negotiation_cycle_contract_sent_negotiating_contract_sent
        grounds:
          - state_machines.Booking.CONTRACT_SENT_to_NEGOTIATING
          - state_machines.Booking.NEGOTIATING_to_CONTRACT_SENT
          - entities.ContractDocument.fields.revision
        distinguishing_aspect: |
          Booking cycles CONTRACT_SENT -> NEGOTIATING -> CONTRACT_SENT; the re-issue
          produces ContractDocument revision 2 while the original revision 1 becomes
          SUPERSEDED, proving a true cycle (not a linear pipeline) on the Booking entity.
        test_recipe:
          setup:
            - "Booking at CONTRACT_SENT with contract revision 1 ISSUED."
            - "Client requests revision (-> NEGOTIATING); agent re-issues (-> CONTRACT_SENT, revision 2)."
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { now_utc: "2026-06-14T00:00:00Z" }
              as: StudioAdmin
            - call: "POST /travel-zones"
              payload: { zone_code: "ZH", name: "Home", base_travel_fee_cents: 0, per_mile_fee_cents: 0, surge_multiplier_bps: 10000 }
              as: StudioAdmin
              captures: { zhome: $.data.id }
            - call: "POST /packages"
              payload: { name: "Std", tier: "STANDARD", flat_package_fee_cents: 50000, included_set_minutes: 120, deposit_pct_bps: 2500 }
              as: StudioAdmin
              captures: { pkg: $.data.id }
            - call: "POST /performers"
              payload: { stage_name: "DJ A", act_type: "DJ", genre: "HOUSE", home_zone_id: "${zhome}", base_set_rate_cents: 200000, overtime_rate_cents_per_15min: 3000 }
              as: StudioAdmin
              captures: { perf: $.data.id }
            - call: "POST /clients"
              payload: { full_name: "Client A", email: "a@x.com" }
              as: BookingAgent
              captures: { cli: $.data.id }
            - call: "POST /bookings"
              payload: { client_id: "${cli}", performer_id: "${perf}", package_id: "${pkg}", event_zone_id: "${zhome}", event_start_utc: "2026-08-01T20:00:00Z", event_miles_from_home: 0, contracted_set_minutes: 120 }
              as: BookingAgent
              captures: { bk: $.data.id }
            - call: "POST /bookings/${bk}/hold"
              payload: {}
              as: BookingAgent
              captures: { bkv_hold: $.data.version }
            - call: "POST /bookings/${bk}/issue-contract"
              payload: { expected_booking_version: "${bkv_hold}" }
              as: BookingAgent
            - call: "POST /bookings/${bk}/request-revision"
              payload: {}
              as: Client
              as_user_id: "${cli}"
              captures: { bkv_neg: $.data.version }
          trigger:
            - call: "POST /bookings/${bk}/issue-contract"
              payload: { expected_booking_version: "${bkv_neg}" }
              as: BookingAgent
              captures: { bkstatus: $.data.status }
            - call: "GET /bookings/${bk}/contracts"
              payload: {}
              as: BookingAgent
          assert:
            - "Booking.${bk}.status == CONTRACT_SENT"
            - "ContractDocument with revision==1 on booking ${bk} has status SUPERSEDED"
            - "ContractDocument with revision==2 on booking ${bk} has status ISSUED"

      - name: payment_parallel_dimensions_capture_vs_settlement_evolve_independently
        grounds:
          - state_machines.PaymentRecord.AUTHORIZED_to_CAPTURED
          - state_machines.PaymentRecord.UNSETTLED_to_SETTLED
          - entities.PaymentRecord.fields.capture_status
          - entities.PaymentRecord.fields.settlement_status
        distinguishing_aspect: |
          PaymentRecord carries two independent state axes: capture_status moves
          AUTHORIZED->CAPTURED while settlement_status stays UNSETTLED, then the booking
          settle sweep flips settlement_status->SETTLED with capture_status unchanged at CAPTURED.
        test_recipe:
          setup:
            - "Booking driven to PERFORMED with full payment so settle is valid."
            - "Deposit + balance payments CAPTURED; capture_status CAPTURED, settlement_status UNSETTLED before settle."
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { now_utc: "2026-06-14T00:00:00Z" }
              as: StudioAdmin
            - call: "POST /travel-zones"
              payload: { zone_code: "ZH", name: "Home", base_travel_fee_cents: 0, per_mile_fee_cents: 0, surge_multiplier_bps: 10000 }
              as: StudioAdmin
              captures: { zhome: $.data.id }
            - call: "POST /packages"
              payload: { name: "Std", tier: "STANDARD", flat_package_fee_cents: 50000, included_set_minutes: 120, deposit_pct_bps: 2500 }
              as: StudioAdmin
              captures: { pkg: $.data.id }
            - call: "POST /performers"
              payload: { stage_name: "DJ A", act_type: "DJ", genre: "HOUSE", home_zone_id: "${zhome}", base_set_rate_cents: 200000, overtime_rate_cents_per_15min: 3000 }
              as: StudioAdmin
              captures: { perf: $.data.id }
            - call: "POST /clients"
              payload: { full_name: "Client A", email: "a@x.com" }
              as: BookingAgent
              captures: { cli: $.data.id }
            - call: "POST /bookings"
              payload: { client_id: "${cli}", performer_id: "${perf}", package_id: "${pkg}", event_zone_id: "${zhome}", event_start_utc: "2026-08-01T20:00:00Z", event_miles_from_home: 0, contracted_set_minutes: 120 }
              as: BookingAgent
              captures: { bk: $.data.id }
            - call: "POST /bookings/${bk}/hold"
              payload: {}
              as: BookingAgent
              captures: { bkv_hold: $.data.version }
            - call: "POST /bookings/${bk}/issue-contract"
              payload: { expected_booking_version: "${bkv_hold}" }
              as: BookingAgent
            - call: "GET /bookings/${bk}/contracts"
              payload: {}
              as: BookingAgent
              captures: { ctid: "$.data[0].id" }
            - call: "POST /contracts/${ctid}/sign"
              payload: {}
              as: Client
              as_user_id: "${cli}"
            - call: "POST /payments"
              payload: { booking_id: "${bk}", kind: "DEPOSIT", amount_cents: 62500 }
              as: BookingAgent
              captures: { dep: $.data.id }
            - call: "POST /payments/${dep}/capture"
              payload: {}
              as: BookingAgent
            - call: "POST /payments"
              payload: { booking_id: "${bk}", kind: "BALANCE", amount_cents: 187500 }
              as: BookingAgent
              captures: { bal: $.data.id }
            - call: "POST /payments/${bal}/capture"
              payload: {}
              as: BookingAgent
            - call: "POST /_clock/set"
              payload: { now_utc: "2026-08-01T20:00:00Z" }
              as: StudioAdmin
            - call: "POST /bookings/${bk}/start-set"
              payload: {}
              as: BookingAgent
            - call: "POST /bookings/${bk}/complete-set"
              payload: { actual_set_minutes: 120 }
              as: BookingAgent
          trigger:
            - call: "POST /bookings/${bk}/settle"
              payload: {}
              as: BookingAgent
            - call: "GET /payments/${dep}"
              payload: {}
              as: BookingAgent
              captures: { cap: $.data.capture_status, settle: $.data.settlement_status }
          assert:
            - "PaymentRecord.${dep}.capture_status == CAPTURED"
            - "PaymentRecord.${dep}.settlement_status == SETTLED"
            - "Booking.${bk}.status == SETTLED"

  # =====================================================================
  # RULE 4 — transitive cascade chains from different triggers
  # =====================================================================
  - rule_id: transitive_cascade
    instances:
      - name: cancel_cascade_depth3_payment_to_client_credit
        grounds:
          - state_machines.Booking.HOLD_to_CANCELLED
          - state_machines.PaymentRecord.UNSETTLED_to_REFUNDED
          - entities.Client.fields.store_credit_cents
          - entities.PaymentRecord.fields.settlement_status
        distinguishing_aspect: |
          Depth-3 chain: cancel mutates Booking (compute fee) -> that mutation marks the
          CAPTURED PaymentRecord REFUNDED -> the REFUNDED payment with refund_destination
          STORE_CREDIT itself adds the refundable remainder to Client.store_credit_cents.
        test_recipe:
          setup:
            - "Clock 2026-06-14 (lead 48). CONFIRMED booking; deposit 81000 captured with refund_destination STORE_CREDIT."
            - "Cancel fee = 64800 (CONFIRMED tier). Refundable to credit = min(amount_paid, ...) i.e. 81000 - 64800 = 16200."
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { now_utc: "2026-06-14T00:00:00Z" }
              as: StudioAdmin
            - call: "POST /travel-zones"
              payload: { zone_code: "ZH", name: "Home", base_travel_fee_cents: 0, per_mile_fee_cents: 0, surge_multiplier_bps: 10000 }
              as: StudioAdmin
              captures: { zhome: $.data.id }
            - call: "POST /travel-zones"
              payload: { zone_code: "ZE", name: "Event", base_travel_fee_cents: 10000, per_mile_fee_cents: 500, surge_multiplier_bps: 12000 }
              as: StudioAdmin
              captures: { zevent: $.data.id }
            - call: "POST /packages"
              payload: { name: "Std", tier: "STANDARD", flat_package_fee_cents: 50000, included_set_minutes: 120, deposit_pct_bps: 2500 }
              as: StudioAdmin
