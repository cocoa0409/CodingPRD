            - { call: "POST /homeownership/volunteers", payload: { program_id: "${prog_id}", full_name: "Dana Reyes", birth_date: "1990-04-10T00:00:00.000Z", waiver_expires_on: "2027-12-31T00:00:00.000Z" }, as: ConstructionManager, as_user_id: "cm-1", captures: { vol_id: $.data.id } }
            - { call: "POST /homeownership/construction-shifts", payload: { build_site_id: "${site_id}", crew_lead_user_id: "cm-1", start_at: "2026-08-05T08:00:00.000Z", end_at: "2026-08-05T12:00:00.000Z", volunteer_slots: 1 }, as: ConstructionManager, as_user_id: "cm-1", captures: { shift_id: $.data.id } }
