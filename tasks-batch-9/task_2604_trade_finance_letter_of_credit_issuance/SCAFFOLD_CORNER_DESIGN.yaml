  - section: endpoints
    instances:
      - name: standard_crud_applicant_create_read_and_child_listing
        claim_type: standard_crud
        grounds:
          - endpoints.POST_/applicants
          - endpoints.GET_/applicants/{id}
          - endpoints.GET_/applicants/{id}/facilities
          - response_envelope
        distinguishing_aspect: |
          The create/read pair round-trips every stored field unchanged and the
          child listing wraps its rows in the array envelope with response_type
          "array" and the four pagination fields, defaulting to limit 10 and
          offset 0 with total_count 2 and has_more false. A single-object read
          must carry response_type "object" and no pagination fields at all, so an
          implementation that emits one envelope shape for both endpoints fails.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-10T09:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T09:00:00Z" }
              as: SystemOperator
              as_user_id: "sysop_1"
          trigger:
            - call: "POST /applicants"
              payload: { legal_name: "Baltic Timber Imports AS", country_code: "NO", industry_code: "4671", internal_risk_grade: "A", kyc_status: "CLEARED" }
              as: CreditOfficer
              as_user_id: "co_1"
              captures: { app_id: $.data.id, created: $.data.created_at, ver: $.data.version }
            - call: "POST /applicants/${app_id}/facilities"
              payload: { currency: "USD", limit_cents: 50000000, collateral_required_pct: 0, facility_expiry_date: "2027-06-30" }
              as: CreditOfficer
              as_user_id: "co_1"
              captures: { f1_id: $.data.id }
            - call: "POST /applicants/${app_id}/facilities"
              payload: { currency: "EUR", limit_cents: 30000000, collateral_required_pct: 25, facility_expiry_date: "2027-12-31" }
              as: CreditOfficer
              as_user_id: "co_1"
              captures: { f2_id: $.data.id }
            - call: "GET /applicants/${app_id}"
              payload: {}
              as: TradeFinanceOfficer
              as_user_id: "tfo_1"
              captures: { r_name: $.data.legal_name, r_grade: $.data.internal_risk_grade, r_status: $.data.status, r_ver: $.data.version }
            - call: "GET /applicants/${app_id}/facilities"
              payload: {}
              as: CreditOfficer
              as_user_id: "co_1"
              captures: { l1: "$.data[0].id", l2: "$.data[1].id", l1_cur: "$.data[0].currency" }
          assert:
            - "every trigger call returns HTTP 200"
            - "${r_name} == \"Baltic Timber Imports AS\""
            - "${r_grade} == A"
            - "${r_status} == ACTIVE"
            - "${r_ver} == ${ver}"
            - "${created} == \"2026-08-10T09:00:00Z\""
            - "trigger call 4 response meta carries api_request_id and api_request_timestamp and response_type == \"object\""
            - "trigger call 5 response_type == \"array\" and its meta carries limit 10, offset 0, total_count 2, has_more false"
            - "${l1} == ${f1_id}"
            - "${l2} == ${f2_id}"
            - "${l1_cur} == USD"
            - "Applicant.${app_id}.sanctions_flag == false"

      - name: action_endpoint_discrepancy_waiver_flow_returns_the_parent_row
        claim_type: action_endpoint
        grounds:
          - endpoints.POST_/presentations/{id}/discrepancies
          - endpoints.POST_/presentations/{id}/waiver-requests
          - endpoints.POST_/waiver-requests/{id}/respond
          - state_machines.Presentation.examination_status
        distinguishing_aspect: |
          Each action endpoint returns the row its own §1.5 output names - the
          discrepancy POST returns a Discrepancy, the waiver POST returns a
          WaiverRequest, the respond POST returns the WaiverRequest again - while
          the side effects land on the PARENT Presentation, whose
          examination_status walks UNDER_EXAMINATION -> DISCREPANT ->
          WAIVER_REQUESTED -> COMPLYING and whose discrepancy_count reaches 1. The
          GRANT also flips the named Discrepancy IDENTIFIED -> WAIVED. An
          implementation that returns the presentation from these endpoints, or
          that forgets to move the discrepancy, fails.
