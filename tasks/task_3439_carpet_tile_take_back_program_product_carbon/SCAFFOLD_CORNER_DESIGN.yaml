        distinguishing_aspect: "Every FK-filtered list returns exactly the children of the named parent and an empty array (not an error) when the filter matches nothing — the reverse-reachability channel for every child FK in the model."
        test_recipe:
          setup:
            - "Collection GAT; batch DL-100 RELEASED; site INSTALLED with zone Z-1 (10 m2 from DL-100); order ORD-1 DRAFT on Z-1; take-back TB-1 REQUESTED; report REP-1 DRAFT; claim CL-1 DRAFT on REP-1."
          setup_api_calls:
            - *c_clock
            - *c_col_gate_none
            - *c_lot_net200
            - *c_lot_vir200
            - *c_qc_lot1
            - *c_qc_lot2
            - *c_batch_b1
            - *c_alloc1
            - *c_alloc2
            - *c_rel_b1
            - *c_site1
            - *c_install1
            - call: "POST /carpetloop/sites/${site1}/zones"
              payload: { batch_id: "${b1}", zone_code: "Z-1", area_m2: 10 }
              as: Installer
              as_user_id: "inst-bob"
              captures: { z1: $.data.id }
            - *c_get_site
            - call: "POST /carpetloop/replacement-orders"
              payload: { site_id: "${site1}", zone_id: "${z1}", reason: "WEAR", new_zone_code: "Z-1R", expected_site_version: "${sv1}" }
              as: Specifier
              as_user_id: "spec-ada"
              captures: { ord1: $.data.id }
            - *c_tb1
            - *c_rep_gate
            - *c_claim_neutral
          trigger:
            - call: "GET /carpetloop/zones"
              payload: { batch_id: "${b1}" }
