          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T23:00:00Z" }
              as: SystemAdmin
            - call: "POST /service-accounts/${acct_id}/execute-shutoff"
              as: BillingSupervisor
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-11T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /service-accounts/${acct_id}/execute-shutoff"
              as: BillingSupervisor
          assert:
            - "BEFORE THE ANCHOR: HTTP 409 with error_id ERR_SHUTOFF_NOTICE_NOT_ELAPSED, and service_status is still SHUTOFF_SCHEDULED with shutoff_scheduled_for 2026-08-11T00:00:00Z"
            - "AT THE ANCHOR: HTTP 200 and ServiceAccount.${acct_id}.service_status == SHUTOFF_EXECUTED — the comparison clock_now >= shutoff_scheduled_for is inclusive"
            - "credit_status is still PAST_DUE and balance_cents is still 5210 — executing a shutoff moves no money"
            - "GET /service-accounts/${acct_id}/ledger-entries returns total_count 1 throughout"
            - "The refusal was not ERR_SHUTOFF_HOLD_ACTIVE: open_investigation_hold_count and open_rebill_count are both 0, so only the notice-period condition was outstanding"

      - name: corner_endpoint_cross_reference_link_arrangement_binds_account_bill_and_investigation
        claim_type: cross_reference_link
        grounds:
          - endpoints[POST /payment-arrangements]
          - endpoints[GET /payment-arrangements]
          - entities.PaymentArrangement
        distinguishing_aspect: |
          One create call establishes three references at once — account_id, bill_id and the optional
          investigation_id — and every one of them is validated before the plan is written: a bogus
          investigation_id is refused with a 404 at priority 5 even though the account and the bill are
          both real and the OCC token is current. Once the link exists it is queryable from each side
          independently, so the association must be stored as data rather than inferred from the bill.
        test_recipe:
          setup:
            - "CHAIN-BASE-A: RS-STD-2026, SUMMER periods 2025-06, 2025-07, 2025-08 and 2026-07, account ACC-1001 with master meter MTR-A-1 and reads 100000 / 104000 / 108000 / 112000 / 153000, and four ISSUED bills (5210, 5210, 5210, 44939), so the balance is 60569 and credit_status is PAST_DUE. The clock is 2026-08-01T00:00:00Z."
