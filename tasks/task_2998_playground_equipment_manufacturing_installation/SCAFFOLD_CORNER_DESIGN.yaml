# SCAFFOLD_CORNER_DESIGN.yaml - task 2998 Playground Equipment Manufacturing & Installation
# Breadth probe (SKILL.md §1.9). Sections and claim_type values are taken verbatim from
# references/claim-extraction-guide.md; every grounds entry resolves into SCAFFOLD.yaml §1.1-§1.7.
# Corners already asserted by SCAFFOLD_DIFFICULTY_DESIGN.yaml appear as excluded_because stubs
# with no test_recipe. Every numeric literal below was computed by executing the relevant
# calculations[].formula against the pinned inputs.
scaffold_corner_design:

  # =========================================================================
  - section: entities
    instances:
      - name: component_model_create_echoes_inputs_and_returns_201
        claim_type: creation
        grounds:
          - endpoints[POST /playground/component-models]
          - entities.ComponentModel
          - response_envelope.success
        distinguishing_aspect: "POST /playground/component-models with every declared input present returns HTTP 201, response_type 'object', and echoes all twelve input fields unchanged in data."
        test_recipe:
          setup:
            - "Empty database. No standard is needed: model creation is independent of the ACTIVE edition (only certification requires one)."
          setup_api_calls: []
          trigger:
            - call: "POST /playground/component-models"
              payload: { sku: "SLIDE-HD-122", category: "PLASTIC_SLIDE", age_group: "TODDLER_6_23M", deck_height_cm: 122, use_zone_footprint_cm: 183, color_options: ["YELLOW", "CRIMSON"], unit_price_cents: 215450, hardware_bag_count: 4, warranty_years: 10, parts_support_until_year: 2040, accessible_transfer_ready: false, supersedes_model_id: null }
              as: ManufacturerAdmin
              as_user_id: "admin-1"
              captures: { model_id: $.data.id }
          assert:
            - "HTTP 201 with response_type == 'object' and meta.api_request_id present"
            - "ComponentModel.${model_id}.sku == 'SLIDE-HD-122', category == PLASTIC_SLIDE, age_group == TODDLER_6_23M"
            - "ComponentModel.${model_id}.deck_height_cm == 122, use_zone_footprint_cm == 183, unit_price_cents == 215450"
            - "ComponentModel.${model_id}.color_options == ['YELLOW', 'CRIMSON'] in the submitted order (index 0 is the default colour that carries no uplift)"
            - "ComponentModel.${model_id}.hardware_bag_count == 4, warranty_years == 10, parts_support_until_year == 2040"
            - "ComponentModel.${model_id}.id, created_at, updated_at and version are all present and version == 1"

      - name: component_model_create_omitting_optional_inputs_applies_declared_defaults
        claim_type: defaults
        grounds:
          - entities.ComponentModel.fields.accessible_transfer_ready
          - entities.ComponentModel.fields.certification_status
          - entities.ComponentModel.fields.lifecycle_status
          - entities.ComponentModel.fields.supersedes_model_id
        distinguishing_aspect: "Omitting both optional inputs yields accessible_transfer_ready == false and supersedes_model_id == null, while the three system fields land on their declared defaults UNCERTIFIED / null / ACTIVE - not on nulls or empty strings."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "POST /playground/component-models"
              payload: { sku: "POST-STD-120", category: "POST", age_group: "TODDLER_6_23M", deck_height_cm: 0, use_zone_footprint_cm: 30, color_options: ["CEDAR", "FOREST_GREEN"], unit_price_cents: 10750, hardware_bag_count: 2, warranty_years: 15, parts_support_until_year: 2040 }
              as: ManufacturerAdmin
              as_user_id: "admin-1"
              captures: { model_id: $.data.id }
          assert:
            - "ComponentModel.${model_id}.accessible_transfer_ready == false (declared default applied for the omitted optional input)"
            - "ComponentModel.${model_id}.supersedes_model_id == null"
            - "ComponentModel.${model_id}.certification_status == UNCERTIFIED"
            - "ComponentModel.${model_id}.certified_against_standard_id == null"
            - "ComponentModel.${model_id}.lifecycle_status == ACTIVE"
            - "deck_height_cm == 0 is stored as 0, not coerced to null (a POST legitimately has zero fall height)"

      - name: play_area_get_returns_stored_row_with_computed_defaults
        claim_type: retrieval
        grounds:
          - endpoints[GET /playground/play-areas/{id}]
          - entities.PlayArea.fields.critical_fall_height_cm
          - entities.PlayArea.fields.required_surfacing_depth_cm
          - entities.PlayArea.fields.status
        distinguishing_aspect: "A freshly created PlayArea with no placements reads back with its five inputs unchanged and its three derived/system fields at 0 / 15 / PLANNED, proving required_surfacing_depth_cm is seeded from the zero-fall-height branch rather than left null."
        test_recipe:
          setup:
            - "PlaygroundStandard ASTM_F1487/2024 ACTIVE (required before a project may leave DRAFT)."
            - "DesignProject 'Nettle Park' in CONSULTATION with one TODDLER_6_23M play area 0..2000, ENGINEERED_WOOD_FIBER, depth 30, and no placements yet."
          setup_api_calls:
            - call: "POST /playground/standards"
              payload: { code: "ASTM_F1487", edition_year: 2024, effective_from: "2024-01-01", min_use_zone_clearance_cm: 183, max_fall_height_cm_toddler: 122, max_fall_height_cm_preschool: 152, max_fall_height_cm_school_age: 244, requires_accessible_route: false }
              as: ComplianceOfficer
              as_user_id: "officer-1"
              captures: { std1_id: $.data.id }
            - call: "POST /playground/standards/${std1_id}/activate"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "officer-1"
            - call: "POST /playground/projects"
              payload: { client_name: "Nettle Park", site_length_cm: 3000, site_width_cm: 1200, site_soil_type: "CLAY", budget_cents: 500000, fundraising_deadline: "2026-12-31", required_age_groups: ["TODDLER_6_23M"], accessible_route_required: false }
              as: DesignConsultant
              as_user_id: "consultant-1"
              captures: { proj_id: $.data.id }
            - call: "POST /playground/projects/${proj_id}/start-consultation"
              payload: {}
              as: DesignConsultant
              as_user_id: "consultant-1"
            - call: "POST /playground/projects/${proj_id}/play-areas"
              payload: { age_group: "TODDLER_6_23M", axis_origin_cm: 0, axis_length_cm: 2000, surfacing_material: "ENGINEERED_WOOD_FIBER", surfacing_depth_cm: 30 }
              as: DesignConsultant
              as_user_id: "consultant-1"
              captures: { area_id: $.data.id }
          trigger:
            - call: "GET /playground/play-areas/${area_id}"
              payload: {}
              as: DesignConsultant
              as_user_id: "consultant-1"
          assert:
            - "HTTP 200 with response_type == 'object'"
            - "PlayArea.${area_id}.project_id == ${proj_id} (system-assigned from the nested route, not from the body)"
            - "PlayArea.${area_id}.age_group == TODDLER_6_23M, axis_origin_cm == 0, axis_length_cm == 2000, surfacing_material == ENGINEERED_WOOD_FIBER, surfacing_depth_cm == 30"
            - "PlayArea.${area_id}.critical_fall_height_cm == 0 (no placement in the input set yet)"
            - "PlayArea.${area_id}.required_surfacing_depth_cm == 15 (the zero-fall-height base requirement, not null and not 0)"
            - "PlayArea.${area_id}.status == PLANNED"

      - name: component_models_list_filters_by_certification_status_and_paginates
        claim_type: listing
        grounds:
          - endpoints[GET /playground/component-models]
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
        distinguishing_aspect: "With two models of which one is CERTIFIED, GET /playground/component-models?certification_status=CERTIFIED&limit=1&offset=0 returns exactly that one row with meta.total_count == 1 and has_more == false, while the unfiltered call reports total_count == 2 - so the filter is applied before pagination, not after."
        test_recipe:
          setup:
            - "PlaygroundStandard ASTM_F1487/2024 ACTIVE."
            - "Two ComponentModels: DECK-TDL-122 certified against it, and POST-STD-120 left UNCERTIFIED."
          setup_api_calls:
            - call: "POST /playground/standards"
              payload: { code: "ASTM_F1487", edition_year: 2024, effective_from: "2024-01-01", min_use_zone_clearance_cm: 183, max_fall_height_cm_toddler: 122, max_fall_height_cm_preschool: 152, max_fall_height_cm_school_age: 244, requires_accessible_route: false }
              as: ComplianceOfficer
              as_user_id: "officer-1"
              captures: { std1_id: $.data.id }
            - call: "POST /playground/standards/${std1_id}/activate"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "officer-1"
            - call: "POST /playground/component-models"
              payload: { sku: "DECK-TDL-122", category: "DECK", age_group: "TODDLER_6_23M", deck_height_cm: 122, use_zone_footprint_cm: 183, color_options: ["CEDAR", "SKY_BLUE"], unit_price_cents: 64350, hardware_bag_count: 6, warranty_years: 15, parts_support_until_year: 2040, accessible_transfer_ready: true }
              as: ManufacturerAdmin
              as_user_id: "admin-1"
              captures: { m_deck_id: $.data.id }
            - call: "POST /playground/component-models"
              payload: { sku: "POST-STD-120", category: "POST", age_group: "TODDLER_6_23M", deck_height_cm: 0, use_zone_footprint_cm: 30, color_options: ["CEDAR", "FOREST_GREEN"], unit_price_cents: 10750, hardware_bag_count: 2, warranty_years: 15, parts_support_until_year: 2040 }
              as: ManufacturerAdmin
              as_user_id: "admin-1"
              captures: { m_post_id: $.data.id }
            - call: "POST /playground/component-models/${m_deck_id}/certify"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "officer-1"
          trigger:
            - call: "GET /playground/component-models?certification_status=CERTIFIED&limit=1&offset=0"
              payload: {}
              as: DesignConsultant
              as_user_id: "consultant-1"
            - call: "GET /playground/component-models"
              payload: {}
              as: DesignConsultant
              as_user_id: "consultant-1"
          assert:
            - "filtered call: HTTP 200, response_type == 'array', data has exactly 1 element whose id == ${m_deck_id}"
            - "filtered call: meta.total_count == 1, meta.limit == 1, meta.offset == 0, meta.has_more == false (the count reflects the filtered set, not the table)"
            - "unfiltered call: meta.total_count == 2, meta.limit == 10 (declared pagination default), meta.offset == 0, meta.has_more == false"
            - "unfiltered call: data contains both ${m_deck_id} and ${m_post_id}"

      - name: placement_get_with_unknown_id_returns_not_found
        claim_type: not_found
        grounds:
          - validations[priority=20]
          - errors.ERR_PLACEMENT_NOT_FOUND
          - response_envelope.error
        distinguishing_aspect: "GET /playground/placements/{id} with a syntactically valid but unknown UUID returns HTTP 404 with response_type 'error' and data.error_id == ERR_PLACEMENT_NOT_FOUND - the entity-specific code, never a generic 404 body."
        test_recipe:
          setup:
            - "Empty database - no placement rows exist at all, so any id is unknown."
          setup_api_calls: []
          trigger:
            - call: "GET /playground/placements/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: DesignConsultant
              as_user_id: "consultant-1"
              captures: { err_id: $.data.error_id, err_msg: $.data.message }
          assert:
            - "HTTP 404 with response_type == 'error'"
            - "${err_id} == ERR_PLACEMENT_NOT_FOUND"
            - "${err_msg} is a non-empty string"
            - "the error body carries no fields beyond error_id and message inside data"

      - name: placement_create_missing_x_start_cm_returns_invalid_request
        claim_type: required_fields
        grounds:
          - validations[priority=25]
          - errors.ERR_INVALID_REQUEST
          - endpoints[POST /playground/play-areas/{id}/placements]
        distinguishing_aspect: "Omitting the required input x_start_cm returns HTTP 422 ERR_INVALID_REQUEST at priority 25 - before any business gate such as the model-certified check at priority 44 - and creates no ComponentPlacement row."
        test_recipe:
          setup:
            - "PlaygroundStandard ASTM_F1487/2024 ACTIVE, DECK-TDL-122 CERTIFIED, project 'Oxbow Park' in CONSULTATION with one TODDLER_6_23M area 0..2000 depth 30 and no placements."
          setup_api_calls:
            - call: "POST /playground/standards"
              payload: { code: "ASTM_F1487", edition_year: 2024, effective_from: "2024-01-01", min_use_zone_clearance_cm: 183, max_fall_height_cm_toddler: 122, max_fall_height_cm_preschool: 152, max_fall_height_cm_school_age: 244, requires_accessible_route: false }
              as: ComplianceOfficer
              as_user_id: "officer-1"
              captures: { std1_id: $.data.id }
            - call: "POST /playground/standards/${std1_id}/activate"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "officer-1"
            - call: "POST /playground/component-models"
              payload: { sku: "DECK-TDL-122", category: "DECK", age_group: "TODDLER_6_23M", deck_height_cm: 122, use_zone_footprint_cm: 183, color_options: ["CEDAR", "SKY_BLUE"], unit_price_cents: 64350, hardware_bag_count: 6, warranty_years: 15, parts_support_until_year: 2040, accessible_transfer_ready: true }
              as: ManufacturerAdmin
              as_user_id: "admin-1"
              captures: { m_deck_id: $.data.id }
            - call: "POST /playground/component-models/${m_deck_id}/certify"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "officer-1"
            - call: "POST /playground/projects"
              payload: { client_name: "Oxbow Park", site_length_cm: 3000, site_width_cm: 1200, site_soil_type: "CLAY", budget_cents: 500000, fundraising_deadline: "2026-12-31", required_age_groups: ["TODDLER_6_23M"], accessible_route_required: false }
              as: DesignConsultant
              as_user_id: "consultant-1"
              captures: { proj_id: $.data.id }
            - call: "POST /playground/projects/${proj_id}/start-consultation"
              payload: {}
              as: DesignConsultant
              as_user_id: "consultant-1"
            - call: "POST /playground/projects/${proj_id}/play-areas"
              payload: { age_group: "TODDLER_6_23M", axis_origin_cm: 0, axis_length_cm: 2000, surfacing_material: "ENGINEERED_WOOD_FIBER", surfacing_depth_cm: 30 }
              as: DesignConsultant
              as_user_id: "consultant-1"
              captures: { area_id: $.data.id }
          trigger:
            - call: "POST /playground/play-areas/${area_id}/placements"
              payload: { component_model_id: "${m_deck_id}", color_choice: "SKY_BLUE", quantity: 1 }
              as: DesignConsultant
              as_user_id: "consultant-1"
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP 422 with ${err_id} == ERR_INVALID_REQUEST"
            - "GET /playground/play-areas/${area_id}/placements returns meta.total_count == 0"
            - "PlayArea.${area_id}.critical_fall_height_cm == 0 (a rejected create fires no recompute)"

      - name: play_area_create_with_unknown_surfacing_material_returns_invalid_enum
        claim_type: type_constraints
        grounds:
          - validations[priority=25]
          - entities.PlayArea.fields.surfacing_material
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: "A surfacing_material value outside the declared enum is rejected with ERR_INVALID_REQUEST rather than being stored and silently defaulted into the surfacing-depth table's fallback tier."
        test_recipe:
          setup:
            - "PlaygroundStandard ASTM_F1487/2024 ACTIVE and project 'Pippin Park' in CONSULTATION with no play areas."
          setup_api_calls:
            - call: "POST /playground/standards"
              payload: { code: "ASTM_F1487", edition_year: 2024, effective_from: "2024-01-01", min_use_zone_clearance_cm: 183, max_fall_height_cm_toddler: 122, max_fall_height_cm_preschool: 152, max_fall_height_cm_school_age: 244, requires_accessible_route: false }
              as: ComplianceOfficer
              as_user_id: "officer-1"
              captures: { std1_id: $.data.id }
            - call: "POST /playground/standards/${std1_id}/activate"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "officer-1"
            - call: "POST /playground/projects"
              payload: { client_name: "Pippin Park", site_length_cm: 3000, site_width_cm: 1200, site_soil_type: "CLAY", budget_cents: 500000, fundraising_deadline: "2026-12-31", required_age_groups: ["TODDLER_6_23M"], accessible_route_required: false }
              as: DesignConsultant
              as_user_id: "consultant-1"
              captures: { proj_id: $.data.id }
            - call: "POST /playground/projects/${proj_id}/start-consultation"
              payload: {}
              as: DesignConsultant
              as_user_id: "consultant-1"
          trigger:
            - call: "POST /playground/projects/${proj_id}/play-areas"
              payload: { age_group: "TODDLER_6_23M", axis_origin_cm: 0, axis_length_cm: 2000, surfacing_material: "ASTROTURF", surfacing_depth_cm: 30 }
              as: DesignConsultant
              as_user_id: "consultant-1"
              captures: { err_material: $.data.error_id }
            - call: "POST /playground/projects/${proj_id}/play-areas"
              payload: { age_group: "GROWN_UPS", axis_origin_cm: 0, axis_length_cm: 2000, surfacing_material: "ENGINEERED_WOOD_FIBER", surfacing_depth_cm: 30 }
              as: DesignConsultant
              as_user_id: "consultant-1"
              captures: { err_age: $.data.error_id }
          assert:
            - "HTTP 422 and ${err_material} == ERR_INVALID_REQUEST for the out-of-enum surfacing_material"
            - "HTTP 422 and ${err_age} == ERR_INVALID_REQUEST for the out-of-enum age_group"
            - "GET /playground/projects/${proj_id}/play-areas returns meta.total_count == 0"
            - "DesignProject.${proj_id}.design_status == CONSULTATION (both rejections are inert)"

      - name: placement_use_zone_bounds_are_computed_from_model_footprint
        claim_type: computed_fields
        grounds:
          - calculations.use_zone_extent
          - entities.ComponentPlacement.fields.use_zone_start_cm
          - entities.ComponentPlacement.fields.use_zone_end_cm
        distinguishing_aspect: "use_zone_start_cm / use_zone_end_cm are derived as x_start_cm -/+ the MODEL's use_zone_footprint_cm (700 -> 517..883 for footprint 183), and unknown body fields attempting to set them are ignored rather than honoured."
        test_recipe:
          setup:
            - "PlaygroundStandard ASTM_F1487/2024 ACTIVE, DECK-TDL-122 (use_zone_footprint_cm 183) CERTIFIED, project 'Quarry Park' in CONSULTATION with one TODDLER_6_23M area 0..2000 depth 30."
          setup_api_calls:
            - call: "POST /playground/standards"
              payload: { code: "ASTM_F1487", edition_year: 2024, effective_from: "2024-01-01", min_use_zone_clearance_cm: 183, max_fall_height_cm_toddler: 122, max_fall_height_cm_preschool: 152, max_fall_height_cm_school_age: 244, requires_accessible_route: false }
              as: ComplianceOfficer
              as_user_id: "officer-1"
              captures: { std1_id: $.data.id }
            - call: "POST /playground/standards/${std1_id}/activate"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "officer-1"
            - call: "POST /playground/component-models"
              payload: { sku: "DECK-TDL-122", category: "DECK", age_group: "TODDLER_6_23M", deck_height_cm: 122, use_zone_footprint_cm: 183, color_options: ["CEDAR", "SKY_BLUE"], unit_price_cents: 64350, hardware_bag_count: 6, warranty_years: 15, parts_support_until_year: 2040, accessible_transfer_ready: true }
              as: ManufacturerAdmin
              as_user_id: "admin-1"
              captures: { m_deck_id: $.data.id }
            - call: "POST /playground/component-models/${m_deck_id}/certify"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "officer-1"
            - call: "POST /playground/projects"
              payload: { client_name: "Quarry Park", site_length_cm: 3000, site_width_cm: 1200, site_soil_type: "CLAY", budget_cents: 500000, fundraising_deadline: "2026-12-31", required_age_groups: ["TODDLER_6_23M"], accessible_route_required: false }
              as: DesignConsultant
              as_user_id: "consultant-1"
              captures: { proj_id: $.data.id }
            - call: "POST /playground/projects/${proj_id}/start-consultation"
              payload: {}
              as: DesignConsultant
              as_user_id: "consultant-1"
            - call: "POST /playground/projects/${proj_id}/play-areas"
              payload: { age_group: "TODDLER_6_23M", axis_origin_cm: 0, axis_length_cm: 2000, surfacing_material: "ENGINEERED_WOOD_FIBER", surfacing_depth_cm: 30 }
              as: DesignConsultant
              as_user_id: "consultant-1"
              captures: { area_id: $.data.id }
          trigger:
            - call: "POST /playground/play-areas/${area_id}/placements"
              payload: { component_model_id: "${m_deck_id}", color_choice: "SKY_BLUE", x_start_cm: 700, quantity: 1 }
              as: DesignConsultant
              as_user_id: "consultant-1"
              captures: { pl_id: $.data.id }
          assert:
            - "HTTP 201 with ComponentPlacement.${pl_id}.use_zone_start_cm == 517 and use_zone_end_cm == 883 (700 -/+ 183, taken from the model, not from the body)"
            - "ComponentPlacement.${pl_id}.play_area_id == ${area_id} and status == DRAFT"
            - "ComponentPlacement.${pl_id}.retrofit_quantity == 0, retrofit_unit_price_cents == 0, retrofit_handling_cents == 0, retrofit_total_cents == 0, legacy_surcharge_applied == false"
            - "PlayArea.${area_id}.critical_fall_height_cm == 0 (a DRAFT placement is outside the fall-height input set, so creation alone changes nothing)"

      - name: installation_inspection_is_immutable_and_exposes_no_version_field
        claim_type: immutability
        grounds:
          - entities.InstallationInspection
          - entities.InstallationInspection.fields.sequence_number
          - endpoints[GET /playground/installation-jobs/{id}/inspections]
        distinguishing_aspect: "InstallationInspection is declared common_fields: false, so §1.5 exposes create and read routes only - no PUT/PATCH/DELETE - and its rows carry sequence_number but no version field, unlike every other entity in the scaffold."
        test_recipe:
          setup:
            - "This is a surface claim about §1.5 and §1.1: no state beyond an empty database is required to assert the absence of mutation routes and of the version field on the entity's declared shape."
          setup_api_calls: []
          trigger:
            - call: "GET /playground/installation-jobs/00000000-0000-4000-8000-000000000000/inspections"
              payload: {}
              as: SafetyAuditor
              as_user_id: "auditor-1"
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP 404 with ${err_id} == ERR_JOB_NOT_FOUND (the parent {id} segment is resolved before the sub-resource is listed)"
            - "§1.5 declares exactly two InstallationInspection routes: POST /playground/installation-jobs/{id}/inspections and GET /playground/installation-jobs/{id}/inspections - no update or delete route exists for the entity"
            - "entities.InstallationInspection.common_fields == false, so its rows expose id and created_at but no version and no updated_at"
            - "no endpoint in §1.5 accepts an expected_inspection_version input"

      - name: play_area_create_under_unknown_project_returns_project_not_found
        claim_type: parent_relationships
        grounds:
          - validations[priority=20]
          - errors.ERR_PROJECT_NOT_FOUND
          - entities.PlayArea.parent
        distinguishing_aspect: "The nested create route resolves its {id} path segment first: an unknown project id yields ERR_PROJECT_NOT_FOUND (404) rather than ERR_INVALID_REQUEST or a body-level validation error, even when the body itself is also invalid."
        test_recipe:
          setup:
            - "PlaygroundStandard ASTM_F1487/2024 ACTIVE. No DesignProject rows exist."
          setup_api_calls:
            - call: "POST /playground/standards"
              payload: { code: "ASTM_F1487", edition_year: 2024, effective_from: "2024-01-01", min_use_zone_clearance_cm: 183, max_fall_height_cm_toddler: 122, max_fall_height_cm_preschool: 152, max_fall_height_cm_school_age: 244, requires_accessible_route: false }
              as: ComplianceOfficer
              as_user_id: "officer-1"
              captures: { std1_id: $.data.id }
            - call: "POST /playground/standards/${std1_id}/activate"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "officer-1"
          trigger:
