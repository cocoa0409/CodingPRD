scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: lpta_vs_tradeoff_award_selection_diverge
        grounds:
          - calculations.proposal_value_score
          - calculations.proposal_merit_score
          - state_machines.Proposal.UNDER_EVALUATION_to_ACCEPTABLE
          - entities.Solicitation.fields.evaluation_method
        distinguishing_aspect: |
          Identical proposal data (prices + raw scores) selects proposal A under LPTA (lowest price)
          but proposal B under TRADEOFF (highest value_score) — divergence lives on Solicitation/Proposal
          evaluation, a different entity domain than the CPFF cost-accounting dual variant.
        test_recipe:
          setup:
            - "RFP solicitation OPEN with factors TECHNICAL(0.60), PAST_PERFORMANCE(0.40), PRICE; clock 2026-02-01."
            - "Two ACTIVE vendors each submit; A priced $700,000 (TECH 85 / PP 72), B priced $900,000 (TECH 95 / PP 95)."
            - "Solicitation CLOSED, both proposals scored ACCEPTABLE."
          setup_api_calls:
            - call: "POST /solicitations"
              payload: { title: "RFP Tradeoff", vehicle_type: "RFP", set_aside_type: "NONE", naics_size_threshold: 500, open_at: "2026-02-01T00:00:00Z", close_at: "2026-03-01T00:00:00Z" }
              as: ContractingOfficer
              captures: { sol_id: $.data.id }
            - call: "POST /solicitations/${sol_id}/factors"
              payload: { name: "Technical", kind: "TECHNICAL", weight: 0.60 }
              as: ContractingOfficer
              captures: { f_tech: $.data.id }
            - call: "POST /solicitations/${sol_id}/factors"
              payload: { name: "Past Performance", kind: "PAST_PERFORMANCE", weight: 0.40 }
              as: ContractingOfficer
              captures: { f_pp: $.data.id }
            - call: "POST /solicitations/${sol_id}/factors"
              payload: { name: "Price", kind: "PRICE", weight: 0.0 }
              as: ContractingOfficer
              captures: { f_price: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-01T00:00:00Z" }
              as: ContractingOfficer
            - call: "POST /solicitations/${sol_id}/open"
              payload: {}
              as: ContractingOfficer
            - call: "POST /vendors"
              payload: { legal_name: "Vendor A", uei: "AAAA00000001", employee_count: 100, registration_expires_at: "2027-01-01T00:00:00Z" }
              as: Vendor
              captures: { va_id: $.data.id }
            - call: "POST /vendors/${va_id}/activate"
              payload: {}
              as: Vendor
              as_user_id: "${va_id}"
            - call: "POST /vendors"
              payload: { legal_name: "Vendor B", uei: "BBBB00000001", employee_count: 100, registration_expires_at: "2027-01-01T00:00:00Z" }
              as: Vendor
              captures: { vb_id: $.data.id }
            - call: "POST /vendors/${vb_id}/activate"
              payload: {}
              as: Vendor
              as_user_id: "${vb_id}"
            - call: "POST /proposals"
              payload: { solicitation_id: "${sol_id}", vendor_id: "${va_id}", total_price_cents: 70000000 }
              as: Vendor
              as_user_id: "${va_id}"
              captures: { pa_id: $.data.id }
            - call: "POST /proposals/${pa_id}/scores"
              payload: { factor_id: "${f_tech}", raw_score: 85 }
              as: Vendor
              as_user_id: "${va_id}"
            - call: "POST /proposals/${pa_id}/scores"
              payload: { factor_id: "${f_pp}", raw_score: 72 }
              as: Vendor
              as_user_id: "${va_id}"
            - call: "POST /proposals/${pa_id}/scores"
              payload: { factor_id: "${f_price}", raw_score: 100 }
              as: Vendor
              as_user_id: "${va_id}"
            - call: "POST /proposals/${pa_id}/submit"
              payload: {}
              as: Vendor
              as_user_id: "${va_id}"
            - call: "POST /proposals"
              payload: { solicitation_id: "${sol_id}", vendor_id: "${vb_id}", total_price_cents: 90000000 }
              as: Vendor
              as_user_id: "${vb_id}"
              captures: { pb_id: $.data.id }
            - call: "POST /proposals/${pb_id}/scores"
              payload: { factor_id: "${f_tech}", raw_score: 95 }
              as: Vendor
              as_user_id: "${vb_id}"
            - call: "POST /proposals/${pb_id}/scores"
              payload: { factor_id: "${f_pp}", raw_score: 95 }
              as: Vendor
              as_user_id: "${vb_id}"
            - call: "POST /proposals/${pb_id}/scores"
              payload: { factor_id: "${f_price}", raw_score: 100 }
              as: Vendor
              as_user_id: "${vb_id}"
            - call: "POST /proposals/${pb_id}/submit"
              payload: {}
              as: Vendor
              as_user_id: "${vb_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: ContractingOfficer
            - call: "POST /solicitations/${sol_id}/close"
              payload: {}
              as: ContractingOfficer
            - call: "POST /proposals/${pa_id}/begin-evaluation"
              payload: {}
              as: ContractingOfficer
            - call: "POST /proposals/${pa_id}/score"
              payload: {}
              as: ContractingOfficer
            - call: "POST /proposals/${pb_id}/begin-evaluation"
              payload: {}
              as: ContractingOfficer
          trigger:
            - call: "POST /proposals/${pb_id}/score"
              payload: {}
              as: ContractingOfficer
              captures: { pb_value: $.data.value_score, pb_merit: $.data.merit_score }
          assert:
            - "Proposal.${pa_id}.merit_score == 79.80"
            - "Proposal.${pb_id}.merit_score == 95.00"
            - "Proposal.${pb_id}.value_score == 91.56"
            - "Proposal.${pa_id}.value_score == 83.84 (TRADEOFF picks B; LPTA would pick A at price 70000000)"

      - name: ffp_vs_cpff_invoice_amount_diverge
        grounds:
          - calculations.invoice_amount
          - entities.Contract.fields.contract_type
          - entities.Invoice.fields.fee_portion_cents
        distinguishing_aspect: |
          The same claimed dollar figure yields amount == claimed under FFP (units*price, fee 0) but
          amount == cost + proportional fixed fee under CPFF — divergence on the Invoice/Contract cost
          domain, distinct from the LPTA/TRADEOFF selection variant on the Proposal domain.
        test_recipe:
          setup:
            - "A CPFF contract ACTIVE with total_estimated_cost_cents=100000000 and fixed_fee_cents=8000000."
            - "An FFP contract ACTIVE with a CLIN unit_price_cents=50000, funded_qty=100."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-01T00:00:00Z" }
              as: ContractingOfficer
            - call: "POST /vendors"
              payload: { legal_name: "DualVendor", uei: "DUAL00000001", employee_count: 50, registration_expires_at: "2027-01-01T00:00:00Z" }
              as: Vendor
              captures: { v_id: $.data.id }
            - call: "POST /vendors/${v_id}/activate"
              payload: {}
              as: Vendor
              as_user_id: "${v_id}"
            - call: "POST /solicitations"
              payload: { title: "CPFF Sol", vehicle_type: "RFP", set_aside_type: "NONE", naics_size_threshold: 500, open_at: "2026-02-01T00:00:00Z", close_at: "2026-02-10T00:00:00Z" }
              as: ContractingOfficer
              captures: { sol_c: $.data.id }
            - call: "POST /solicitations/${sol_c}/factors"
              payload: { name: "Technical", kind: "TECHNICAL", weight: 1.0 }
              as: ContractingOfficer
              captures: { fc_tech: $.data.id }
            - call: "POST /solicitations/${sol_c}/factors"
              payload: { name: "Price", kind: "PRICE", weight: 0.0 }
              as: ContractingOfficer
              captures: { fc_price: $.data.id }
            - call: "POST /solicitations/${sol_c}/open"
              payload: {}
              as: ContractingOfficer
            - call: "POST /proposals"
              payload: { solicitation_id: "${sol_c}", vendor_id: "${v_id}", total_price_cents: 100000000 }
              as: Vendor
              as_user_id: "${v_id}"
              captures: { pc_id: $.data.id }
            - call: "POST /proposals/${pc_id}/scores"
              payload: { factor_id: "${fc_tech}", raw_score: 90 }
              as: Vendor
              as_user_id: "${v_id}"
            - call: "POST /proposals/${pc_id}/scores"
              payload: { factor_id: "${fc_price}", raw_score: 100 }
              as: Vendor
              as_user_id: "${v_id}"
            - call: "POST /proposals/${pc_id}/submit"
              payload: {}
              as: Vendor
              as_user_id: "${v_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-10T00:00:00Z" }
              as: ContractingOfficer
            - call: "POST /solicitations/${sol_c}/close"
              payload: {}
              as: ContractingOfficer
            - call: "POST /proposals/${pc_id}/begin-evaluation"
              payload: {}
              as: ContractingOfficer
            - call: "POST /proposals/${pc_id}/score"
              payload: {}
              as: ContractingOfficer
            - call: "POST /solicitations/${sol_c}/finalize-evaluation"
              payload: {}
              as: ContractingOfficer
              as_user_id: "co_chair"
              captures: { sol_c_v: $.data.version }
            - call: "POST /awards"
              payload: { solicitation_id: "${sol_c}", proposal_id: "${pc_id}", expected_solicitation_version: "${sol_c_v}" }
              as: ContractingOfficer
              as_user_id: "co_award"
              captures: { aw_c: $.data.id }
            - call: "POST /contracts"
              payload: { award_id: "${aw_c}", contract_type: "CPFF", base_value_cents: 108000000, total_estimated_cost_cents: 100000000, fixed_fee_cents: 8000000 }
              as: ContractingOfficer
              captures: { ctr_cpff: $.data.id, ctr_cpff_v: $.data.version }
            - call: "POST /invoices"
              payload: { contract_id: "${ctr_cpff}", allowable_cost_cents: 25000000, expected_contract_version: "${ctr_cpff_v}" }
              as: Vendor
              as_user_id: "${v_id}"
              captures: { inv_cpff: $.data.id, inv_cpff_amt: $.data.amount_cents, inv_cpff_fee: $.data.fee_portion_cents }
          trigger:
            - call: "GET /invoices/${inv_cpff}"
              payload: {}
              as: ContractingOfficer
              captures: { amt: $.data.amount_cents, fee: $.data.fee_portion_cents }
          assert:
            - "Invoice.${inv_cpff}.fee_portion_cents == 2000000"
            - "Invoice.${inv_cpff}.amount_cents == 27000000 (cost 25000000 + fee 2000000)"
            - "An FFP invoice claiming 25000000 via unit_price 50000 * invoiced_qty 30 would instead yield amount_cents == 1500000, fee_portion_cents == 0"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: tradeoff_value_score_nested_weighting
        grounds:
          - calculations.proposal_value_score
          - calculations.proposal_merit_score
          - entities.EvaluationFactor.fields.weight
        distinguishing_aspect: |
          Mode (a): value_score = merit(weighted sum of >=2 factors) * 0.80 + price_norm(min_price/this_price*100) * 0.20
          — three+ inputs with non-linear min-ratio interaction; distinct mode from the rounding-order CPFF instance.
        test_recipe:
          setup:
            - "RFP OPEN with TECHNICAL(0.60)/PAST_PERFORMANCE(0.40)/PRICE; one ACTIVE vendor proposal priced $700,000, TECH 85 / PP 72; a cheaper $700,000 floor proposal also present so min_price == 70000000."
          setup_api_calls:
            - call: "POST /solicitations"
              payload: { title: "Combo Tradeoff", vehicle_type: "RFP", set_aside_type: "NONE", naics_size_threshold: 500, open_at: "2026-02-01T00:00:00Z", close_at: "2026-03-01T00:00:00Z" }
              as: ContractingOfficer
              captures: { sol_id: $.data.id }
            - call: "POST /solicitations/${sol_id}/factors"
              payload: { name: "Technical", kind: "TECHNICAL", weight: 0.60 }
              as: ContractingOfficer
              captures: { f_tech: $.data.id }
            - call: "POST /solicitations/${sol_id}/factors"
              payload: { name: "Past Performance", kind: "PAST_PERFORMANCE", weight: 0.40 }
              as: ContractingOfficer
              captures: { f_pp: $.data.id }
            - call: "POST /solicitations/${sol_id}/factors"
              payload: { name: "Price", kind: "PRICE", weight: 0.0 }
              as: ContractingOfficer
              captures: { f_price: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-01T00:00:00Z" }
              as: ContractingOfficer
            - call: "POST /solicitations/${sol_id}/open"
              payload: {}
              as: ContractingOfficer
            - call: "POST /vendors"
              payload: { legal_name: "ComboVendor", uei: "COMB00000001", employee_count: 80, registration_expires_at: "2027-01-01T00:00:00Z" }
              as: Vendor
              captures: { v_id: $.data.id }
            - call: "POST /vendors/${v_id}/activate"
              payload: {}
              as: Vendor
              as_user_id: "${v_id}"
            - call: "POST /proposals"
              payload: { solicitation_id: "${sol_id}", vendor_id: "${v_id}", total_price_cents: 70000000 }
              as: Vendor
              as_user_id: "${v_id}"
              captures: { p_id: $.data.id }
            - call: "POST /proposals/${p_id}/scores"
              payload: { factor_id: "${f_tech}", raw_score: 85 }
              as: Vendor
              as_user_id: "${v_id}"
            - call: "POST /proposals/${p_id}/scores"
              payload: { factor_id: "${f_pp}", raw_score: 72 }
              as: Vendor
              as_user_id: "${v_id}"
            - call: "POST /proposals/${p_id}/scores"
              payload: { factor_id: "${f_price}", raw_score: 100 }
              as: Vendor
              as_user_id: "${v_id}"
            - call: "POST /proposals/${p_id}/submit"
              payload: {}
              as: Vendor
              as_user_id: "${v_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: ContractingOfficer
            - call: "POST /solicitations/${sol_id}/close"
              payload: {}
              as: ContractingOfficer
            - call: "POST /proposals/${p_id}/begin-evaluation"
              payload: {}
              as: ContractingOfficer
          trigger:
            - call: "POST /proposals/${p_id}/score"
              payload: {}
              as: ContractingOfficer
              captures: { merit: $.data.merit_score, value: $.data.value_score }
          assert:
            - "Proposal.${p_id}.merit_score == 79.80 (85*0.60 + 72*0.40)"
            - "Proposal.${p_id}.value_score == 83.84 (79.80*0.80 + 100.00*0.20; this proposal is the price floor so price_norm == 100.00)"

      - name: cpff_fee_round_once_sum_then_fee
        grounds:
          - calculations.invoice_amount
          - entities.Invoice.fields.allowable_cost_cents
          - entities.Contract.fields.fixed_fee_cents
        distinguishing_aspect: |
          Mode (b): CPFF fee is computed on the already-summed allowable_cost and rounded ONCE
          (round(fixed_fee * cost / TEC)); per-line-then-sum would diverge (ratio 1/15 over three $1.00
          lines gives 21 vs the pinned 20). Distinct mode from the nested-weighting value_score instance.
        test_recipe:
          setup:
            - "A CPFF contract ACTIVE with total_estimated_cost_cents=90000000 and fixed_fee_cents=6000000 (fee ratio 1/15)."
            - "Invoice claims allowable_cost_cents=300 (the summed total of three $1.00 cost lines)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-01T00:00:00Z" }
              as: ContractingOfficer
            - call: "POST /vendors"
              payload: { legal_name: "RoundVendor", uei: "ROUN00000001", employee_count: 10, registration_expires_at: "2027-01-01T00:00:00Z" }
              as: Vendor
              captures: { v_id: $.data.id }
            - call: "POST /vendors/${v_id}/activate"
              payload: {}
              as: Vendor
              as_user_id: "${v_id}"
            - call: "POST /solicitations"
              payload: { title: "Round Sol", vehicle_type: "RFP", set_aside_type: "NONE", naics_size_threshold: 500, open_at: "2026-02-01T00:00:00Z", close_at: "2026-02-05T00:00:00Z" }
              as: ContractingOfficer
              captures: { sol_id: $.data.id }
            - call: "POST /solicitations/${sol_id}/factors"
              payload: { name: "Technical", kind: "TECHNICAL", weight: 1.0 }
              as: ContractingOfficer
              captures: { f_tech: $.data.id }
            - call: "POST /solicitations/${sol_id}/factors"
              payload: { name: "Price", kind: "PRICE", weight: 0.0 }
              as: ContractingOfficer
              captures: { f_price: $.data.id }
            - call: "POST /solicitations/${sol_id}/open"
              payload: {}
              as: ContractingOfficer
            - call: "POST /proposals"
              payload: { solicitation_id: "${sol_id}", vendor_id: "${v_id}", total_price_cents: 96000000 }
              as: Vendor
              as_user_id: "${v_id}"
              captures: { p_id: $.data.id }
            - call: "POST /proposals/${p_id}/scores"
              payload: { factor_id: "${f_tech}", raw_score: 88 }
              as: Vendor
              as_user_id: "${v_id}"
            - call: "POST /proposals/${p_id}/scores"
              payload: { factor_id: "${f_price}", raw_score: 100 }
              as: Vendor
              as_user_id: "${v_id}"
            - call: "POST /proposals/${p_id}/submit"
              payload: {}
              as: Vendor
              as_user_id: "${v_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-05T00:00:00Z" }
              as: ContractingOfficer
            - call: "POST /solicitations/${sol_id}/close"
              payload: {}
              as: ContractingOfficer
            - call: "POST /proposals/${p_id}/begin-evaluation"
              payload: {}
              as: ContractingOfficer
            - call: "POST /proposals/${p_id}/score"
              payload: {}
              as: ContractingOfficer
            - call: "POST /solicitations/${sol_id}/finalize-evaluation"
              payload: {}
              as: ContractingOfficer
              as_user_id: "co_chair"
              captures: { sol_v: $.data.version }
            - call: "POST /awards"
              payload: { solicitation_id: "${sol_id}", proposal_id: "${p_id}", expected_solicitation_version: "${sol_v}" }
              as: ContractingOfficer
              as_user_id: "co_award"
              captures: { aw_id: $.data.id }
            - call: "POST /contracts"
              payload: { award_id: "${aw_id}", contract_type: "CPFF", base_value_cents: 96000000, total_estimated_cost_cents: 90000000, fixed_fee_cents: 6000000 }
              as: ContractingOfficer
              captures: { ctr_id: $.data.id, ctr_v: $.data.version }
          trigger:
            - call: "POST /invoices"
              payload: { contract_id: "${ctr_id}", allowable_cost_cents: 300, expected_contract_version: "${ctr_v}" }
              as: Vendor
              as_user_id: "${v_id}"
              captures: { inv_id: $.data.id, fee: $.data.fee_portion_cents, amt: $.data.amount_cents }
          assert:
            - "Invoice.${inv_id}.fee_portion_cents == 20 (round(6000000 * 300 / 90000000) == round(20.0) == 20; NOT 21 from per-line rounding)"
            - "Invoice.${inv_id}.amount_cents == 320"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: solicitation_open_amended_revision_cycle
        grounds:
          - state_machines.Solicitation.OPEN_to_AMENDED
          - state_machines.Solicitation.AMENDED_to_OPEN
          - entities.Solicitation.fields.amendment_count
        distinguishing_aspect: |
          Solicitation cycles OPEN->AMENDED->OPEN (a true cycle, not a forward pipeline), each AMEND
          incrementing amendment_count; this non-linear machine is on Solicitation.
        test_recipe:
          setup:
            - "A DRAFT solicitation with valid factors, clock at 2026-02-01 (open_at)."
          setup_api_calls:
            - call: "POST /solicitations"
              payload: { title: "Cycle Sol", vehicle_type: "RFP", set_aside_type: "NONE", naics_size_threshold: 500, open_at: "2026-02-01T00:00:00Z", close_at: "2026-04-01T00:00:00Z" }
              as: ContractingOfficer
              captures: { sol_id: $.data.id }
            - call: "POST /solicitations/${sol_id}/factors"
              payload: { name: "Technical", kind: "TECHNICAL", weight: 1.0 }
              as: ContractingOfficer
            - call: "POST /solicitations/${sol_id}/factors"
              payload: { name: "Price", kind: "PRICE", weight: 0.0 }
              as: ContractingOfficer
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-01T00:00:00Z" }
              as: ContractingOfficer
            - call: "POST /solicitations/${sol_id}/open"
              payload: {}
              as: ContractingOfficer
            - call: "POST /solicitations/${sol_id}/amend"
              payload: {}
              as: ContractingOfficer
            - call: "POST /solicitations/${sol_id}/open"
              payload: {}
              as: ContractingOfficer
          trigger:
            - call: "POST /solicitations/${sol_id}/amend"
              payload: {}
              as: ContractingOfficer
              captures: { st: $.data.status, ac: $.data.amendment_count }
          assert:
            - "Solicitation.${sol_id}.status == AMENDED"
            - "Solicitation.${sol_id}.amendment_count == 2"

      - name: proposal_reevaluation_unacceptable_loop
        grounds:
          - state_machines.Proposal.UNDER_EVALUATION_to_UNACCEPTABLE
          - state_machines.Proposal.UNACCEPTABLE_to_UNDER_EVALUATION
          - state_machines.Proposal.UNDER_EVALUATION_to_ACCEPTABLE
        distinguishing_aspect: |
          Proposal forks UNDER_EVALUATION->{ACCEPTABLE, UNACCEPTABLE} with divergent side effects and
          loops UNACCEPTABLE->UNDER_EVALUATION->ACCEPTABLE — a non-linear cyclic+branching machine on a
          different entity (Proposal) than the Solicitation cycle.
        test_recipe:
          setup:
            - "A CLOSED solicitation with one SUBMITTED proposal whose PAST_PERFORMANCE factor was scored 60 (below 70)."
          setup_api_calls:
            - call: "POST /solicitations"
              payload: { title: "Loop Sol", vehicle_type: "RFP", set_aside_type: "NONE", naics_size_threshold: 500, open_at: "2026-02-01T00:00:00Z", close_at: "2026-02-10T00:00:00Z" }
              as: ContractingOfficer
              captures: { sol_id: $.data.id }
            - call: "POST /solicitations/${sol_id}/factors"
              payload: { name: "Technical", kind: "TECHNICAL", weight: 0.60 }
              as: ContractingOfficer
              captures: { f_tech: $.data.id }
            - call: "POST /solicitations/${sol_id}/factors"
              payload: { name: "Past Performance", kind: "PAST_PERFORMANCE", weight: 0.40 }
              as: ContractingOfficer
              captures: { f_pp: $.data.id }
            - call: "POST /solicitations/${sol_id}/factors"
              payload: { name: "Price", kind: "PRICE", weight: 0.0 }
              as: ContractingOfficer
              captures: { f_price: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-01T00:00:00Z" }
              as: ContractingOfficer
            - call: "POST /solicitations/${sol_id}/open"
              payload: {}
              as: ContractingOfficer
            - call: "POST /vendors"
