            - { call: "POST /clients/${cid}/service-agreements", payload: { price_tier: "STANDARD", rush_multiplier: 1.75, storage_free_days: 10, storage_daily_rate_cents: 55, retention_days: 30, max_boxes_per_batch: 5 }, as: PlatformAdmin }
            - { call: "POST /batches", payload: { client_id: "${cid}", priority: "STANDARD" }, as: IntakeClerk, as_user_id: "clerk-1", captures: { bid: $.data.id } }
            - { call: "POST /batches/${bid}/boxes", payload: { box_label: "BX-1", intake_weight_grams: 600 }, as: IntakeClerk, as_user_id: "clerk-1", captures: { box1: $.data.id } }
            - { call: "POST /boxes/${box1}/documents", payload: { doc_type: "CONTRACT", pages: 100, contains_phi: false, ocr_confidence: 95 }, as: IntakeClerk, as_user_id: "clerk-1", captures: { d1: $.data.id } }
            - { call: "POST /batches/${bid}/start-prep", payload: {}, as: IntakeClerk, as_user_id: "clerk-1" }
            - { call: "POST /batches/${bid}/start-scan", payload: {}, as: ScanOperator, as_user_id: "scan-1" }
            - { call: "POST /scanner-units", payload: { scanner_code: "SCN-1", capacity_pages_per_session: 500 }, as: PlatformAdmin, captures: { sc: $.data.id } }
            - { call: "POST /batches/${bid}/scan-sessions", payload: { scanner_id: "${sc}" }, as: ScanOperator, as_user_id: "scan-1", captures: { ss: $.data.id } }
            - { call: "POST /scan-sessions/${ss}/page-logs", payload: { document_id: "${d1}", pages: 100 }, as: ScanOperator, as_user_id: "scan-1" }
            - { call: "GET /batches/${bid}", payload: {}, as: ScanOperator, as_user_id: "scan-1", captures: { bv: $.data.version } }
            - { call: "POST /scan-sessions/${ss}/commit", payload: { expected_batch_version: "${bv}" }, as: ScanOperator, as_user_id: "scan-1" }
            - { call: "POST /batches/${bid}/submit-qa", payload: {}, as: ScanOperator, as_user_id: "scan-1" }
          trigger:
            - { call: "POST /batches/${bid}/scan-sessions", payload: { scanner_id: "${sc}" }, as: ScanOperator, as_user_id: "scan-1", captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_INVALID_STATE  (batch is QA, not SCANNING)"
            - "Batch.${bid}.status remains QA; no new ScanSession created (GET /batches/${bid}/scan-sessions returns exactly 1)"

      - name: download_gated_by_document_delivery
        grounds:
          - state_machines.Document.INDEXED_to_DELIVERED
          - errors[ERR_DOCUMENT_NOT_DELIVERED]
          - entities.AccessGrant.fields.scope
        distinguishing_aspect: |
          Entity pair AccessGrant-usage x Document (different pair from
          ScanSession x Batch): a FULL_IMAGE grant on the batch exists and is
          ACTIVE, but download is rejected with ERR_DOCUMENT_NOT_DELIVERED
          while the document is INDEXED; the identical call succeeds after the
          batch delivery flips the document to DELIVERED.
        test_recipe:
          setup:
            - "Client (non-HIPAA) + agreement; batch with one 100-page non-PHI document, scanned, QA-passed, INDEXED (batch INDEXING, not yet delivered)"
            - "ACTIVE FULL_IMAGE grant on the batch, expires 2027-01-01 (clock at default 2026-05-01)"
          setup_api_calls:
            - { call: "POST /clients", payload: { name: "DL Gate", hipaa_covered: false }, as: PlatformAdmin, captures: { cid: $.data.id } }
            - { call: "POST /clients/${cid}/service-agreements", payload: { price_tier: "STANDARD", rush_multiplier: 1.75, storage_free_days: 10, storage_daily_rate_cents: 55, retention_days: 30, max_boxes_per_batch: 5 }, as: PlatformAdmin }
            - { call: "POST /batches", payload: { client_id: "${cid}", priority: "STANDARD" }, as: IntakeClerk, as_user_id: "clerk-1", captures: { bid: $.data.id } }
            - { call: "POST /batches/${bid}/boxes", payload: { box_label: "BX-1", intake_weight_grams: 600 }, as: IntakeClerk, as_user_id: "clerk-1", captures: { box1: $.data.id } }
            - { call: "POST /boxes/${box1}/documents", payload: { doc_type: "CONTRACT", pages: 100, contains_phi: false, ocr_confidence: 95 }, as: IntakeClerk, as_user_id: "clerk-1", captures: { d1: $.data.id } }
            - { call: "POST /batches/${bid}/start-prep", payload: {}, as: IntakeClerk, as_user_id: "clerk-1" }
            - { call: "POST /batches/${bid}/start-scan", payload: {}, as: ScanOperator, as_user_id: "scan-1" }
            - { call: "POST /scanner-units", payload: { scanner_code: "SCN-1", capacity_pages_per_session: 500 }, as: PlatformAdmin, captures: { sc: $.data.id } }
            - { call: "POST /batches/${bid}/scan-sessions", payload: { scanner_id: "${sc}" }, as: ScanOperator, as_user_id: "scan-1", captures: { ss: $.data.id } }
            - { call: "POST /scan-sessions/${ss}/page-logs", payload: { document_id: "${d1}", pages: 100 }, as: ScanOperator, as_user_id: "scan-1" }
            - { call: "GET /batches/${bid}", payload: {}, as: ScanOperator, as_user_id: "scan-1", captures: { bv: $.data.version } }
            - { call: "POST /scan-sessions/${ss}/commit", payload: { expected_batch_version: "${bv}" }, as: ScanOperator, as_user_id: "scan-1" }
            - { call: "POST /batches/${bid}/submit-qa", payload: {}, as: ScanOperator, as_user_id: "scan-1" }
            - { call: "POST /batches/${bid}/pass-qa", payload: {}, as: QAReviewer, as_user_id: "qa-1" }
            - { call: "POST /documents/${d1}/index-records", payload: { metadata_json: { title: "T1", record_date: "2026-01-01", subject: "S1" }, ocr_text_ref: "ocr://t1" }, as: Indexer, as_user_id: "idx-1" }
            - { call: "POST /clients/${cid}/access-grants", payload: { batch_id: "${bid}", scope: "FULL_IMAGE", expires_at: "2027-01-01T00:00:00Z" }, as: ClientUser, as_user_id: "${cid}", captures: { gid: $.data.id } }
          trigger:
            - { call: "GET /access-grants/${gid}/documents/${d1}/download", payload: {}, as: ClientUser, as_user_id: "${cid}", captures: { err: $.data.error_id } }
            - { call: "POST /batches/${bid}/deliver", payload: {}, as: QAReviewer, as_user_id: "qa-1" }
            - { call: "GET /access-grants/${gid}/documents/${d1}/download", payload: {}, as: ClientUser, as_user_id: "${cid}", captures: { url: $.data.download_url } }
          assert:
            - "pre-delivery: ${err} == ERR_DOCUMENT_NOT_DELIVERED  (grant ACTIVE + scope sufficient, but document INDEXED)"
            - "post-delivery: Document.${d1}.status == DELIVERED and download succeeds with a non-empty ${url}"

  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: scanner_occupancy_half_open_interval
        grounds:
          - state_machines.ScanSession.OPEN_to_COMMITTED
          - errors[ERR_SCANNER_BUSY]
          - entities.ScanSession.fields.started_at
        distinguishing_aspect: |
          Interval semantics: point-to-point half-open occupancy — a scanner is
          occupied over [started_at, ended_at) of its OPEN session; a second
          session on the same scanner (even for a different batch) collides
          with ERR_SCANNER_BUSY, and the instant the first session COMMITTED
          (ended_at set) an adjacent new session is admitted. Resource:
          ScannerUnit.
        test_recipe:
          setup:
            - "Client + agreement; batches B1 and B2, each in SCANNING with one box and one 50-page document"
            - "Scanner SCN-1 (capacity 500); session A OPEN on B1 occupying SCN-1"
          setup_api_calls:
            - { call: "POST /clients", payload: { name: "Occ Co", hipaa_covered: false }, as: PlatformAdmin, captures: { cid: $.data.id } }
            - { call: "POST /clients/${cid}/service-agreements", payload: { price_tier: "STANDARD", rush_multiplier: 1.75, storage_free_days: 10, storage_daily_rate_cents: 55, retention_days: 30, max_boxes_per_batch: 5 }, as: PlatformAdmin }
            - { call: "POST /scanner-units", payload: { scanner_code: "SCN-1", capacity_pages_per_session: 500 }, as: PlatformAdmin, captures: { sc: $.data.id } }
            - { call: "POST /batches", payload: { client_id: "${cid}", priority: "STANDARD" }, as: IntakeClerk, as_user_id: "clerk-1", captures: { b1: $.data.id } }
            - { call: "POST /batches/${b1}/boxes", payload: { box_label: "BX-1", intake_weight_grams: 300 }, as: IntakeClerk, as_user_id: "clerk-1", captures: { box1: $.data.id } }
            - { call: "POST /boxes/${box1}/documents", payload: { doc_type: "OTHER", pages: 50, contains_phi: false, ocr_confidence: 95 }, as: IntakeClerk, as_user_id: "clerk-1", captures: { d1: $.data.id } }
            - { call: "POST /batches/${b1}/start-prep", payload: {}, as: IntakeClerk, as_user_id: "clerk-1" }
            - { call: "POST /batches/${b1}/start-scan", payload: {}, as: ScanOperator, as_user_id: "scan-1" }
            - { call: "POST /batches", payload: { client_id: "${cid}", priority: "STANDARD" }, as: IntakeClerk, as_user_id: "clerk-1", captures: { b2: $.data.id } }
            - { call: "POST /batches/${b2}/boxes", payload: { box_label: "BX-2", intake_weight_grams: 300 }, as: IntakeClerk, as_user_id: "clerk-1", captures: { box2: $.data.id } }
            - { call: "POST /boxes/${box2}/documents", payload: { doc_type: "OTHER", pages: 50, contains_phi: false, ocr_confidence: 95 }, as: IntakeClerk, as_user_id: "clerk-1", captures: { d2: $.data.id } }
            - { call: "POST /batches/${b2}/start-prep", payload: {}, as: IntakeClerk, as_user_id: "clerk-1" }
            - { call: "POST /batches/${b2}/start-scan", payload: {}, as: ScanOperator, as_user_id: "scan-1" }
            - { call: "POST /batches/${b1}/scan-sessions", payload: { scanner_id: "${sc}" }, as: ScanOperator, as_user_id: "scan-1", captures: { ssA: $.data.id } }
            - { call: "POST /scan-sessions/${ssA}/page-logs", payload: { document_id: "${d1}", pages: 50 }, as: ScanOperator, as_user_id: "scan-1" }
          trigger:
            - { call: "POST /batches/${b2}/scan-sessions", payload: { scanner_id: "${sc}" }, as: ScanOperator, as_user_id: "scan-1", captures: { err: $.data.error_id } }
            - { call: "GET /batches/${b1}", payload: {}, as: ScanOperator, as_user_id: "scan-1", captures: { bv1: $.data.version } }
            - { call: "POST /scan-sessions/${ssA}/commit", payload: { expected_batch_version: "${bv1}" }, as: ScanOperator, as_user_id: "scan-1" }
            - { call: "POST /batches/${b2}/scan-sessions", payload: { scanner_id: "${sc}" }, as: ScanOperator, as_user_id: "scan-1", captures: { ssB: $.data.id } }
          assert:
            - "while session A OPEN: ${err} == ERR_SCANNER_BUSY (occupancy collision across batches)"
            - "after A commits (ended_at set): session B admitted — ScanSession.${ssB}.status == OPEN"
            - "adjacency at the boundary is admitted (half-open interval: the commit instant frees the scanner)"

      - name: shelf_aggregate_capacity_overlap_and_release
        grounds:
          - state_machines.Box.RECEIVED_to_STORED
          - state_machines.ShelfAssignment.ACTIVE_to_RELEASED
          - entities.ShelfSlot.fields.occupied_weight_grams
          - errors[ERR_SHELF_OVER_CAPACITY]
        distinguishing_aspect: |
          Different interval semantics from scanner occupancy: aggregate
          capacity over concurrent ACTIVE assignments (not pairwise interval
          collision) on a different resource (ShelfSlot). 600g admitted, a
          further 500g rejected (1100 > 1000); once box 1 leaves storage
          (custody PREP releases its assignment), the same 500g placement is
          admitted — occupancy is governed by the ACTIVE set, not by history.
        test_recipe:
          setup:
            - "Client + agreement (max_boxes 5); batch with boxes A (600g, STORED on slot cap 1000) and B (500g, RECEIVED)"
            - "Shelf slot SH-AGG capacity_grams 1000, occupied 600 after A's placement"
          setup_api_calls:
            - { call: "POST /clients", payload: { name: "Agg Co", hipaa_covered: false }, as: PlatformAdmin, captures: { cid: $.data.id } }
            - { call: "POST /clients/${cid}/service-agreements", payload: { price_tier: "STANDARD", rush_multiplier: 1.75, storage_free_days: 10, storage_daily_rate_cents: 55, retention_days: 30, max_boxes_per_batch: 5 }, as: PlatformAdmin }
            - { call: "POST /shelf-slots", payload: { shelf_code: "SH-AGG", zone: "GENERAL", capacity_grams: 1000 }, as: PlatformAdmin, captures: { slot: $.data.id } }
            - { call: "POST /batches", payload: { client_id: "${cid}", priority: "STANDARD" }, as: IntakeClerk, as_user_id: "clerk-1", captures: { bid: $.data.id } }
            - { call: "POST /batches/${bid}/boxes", payload: { box_label: "BX-A", intake_weight_grams: 600 }, as: IntakeClerk, as_user_id: "clerk-1", captures: { boxA: $.data.id } }
            - { call: "POST /batches/${bid}/boxes", payload: { box_label: "BX-B", intake_weight_grams: 500 }, as: IntakeClerk, as_user_id: "clerk-1", captures: { boxB: $.data.id } }
            - { call: "POST /boxes/${boxA}/shelf-assignments", payload: { shelf_slot_id: "${slot}" }, as: IntakeClerk, as_user_id: "clerk-1" }
          trigger:
            - { call: "POST /boxes/${boxB}/shelf-assignments", payload: { shelf_slot_id: "${slot}" }, as: IntakeClerk, as_user_id: "clerk-1", captures: { err: $.data.error_id } }
            - { call: "POST /boxes/${boxA}/custody-events", payload: { to_stage: "PREP" }, as: PrepTechnician, as_user_id: "prep-1" }
            - { call: "GET /shelf-slots/${slot}", payload: {}, as: IntakeClerk, as_user_id: "clerk-1", captures: { occ_mid: $.data.occupied_weight_grams } }
            - { call: "POST /boxes/${boxB}/shelf-assignments", payload: { shelf_slot_id: "${slot}" }, as: IntakeClerk, as_user_id: "clerk-1" }
            - { call: "GET /shelf-slots/${slot}", payload: {}, as: IntakeClerk, as_user_id: "clerk-1", captures: { occ_end: $.data.occupied_weight_grams } }
          assert:
            - "first attempt: ${err} == ERR_SHELF_OVER_CAPACITY (600 + 500 > 1000)"
            - "after A leaves storage (STORED -> IN_PREP, assignment RELEASED): ${occ_mid} == 0"
            - "retry admitted: Box.${boxB}.status == STORED and ${occ_end} == 500"

  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: shelf_occupancy_conservation_occupy_then_release
        grounds:
          - state_machines.ShelfAssignment.ACTIVE_to_RELEASED
          - entities.ShelfSlot.fields.occupied_weight_grams
          - calculations.storage_fee_projection
        distinguishing_aspect: |
          Conserved quantity: ShelfSlot.occupied_weight_grams must always equal
          the sum of intake_weight_grams over ACTIVE assignments. The forward
          action (place 600g) paired with its compensating action (manual
          release) returns the gauge to exactly 0 — no drift.
        test_recipe:
          setup:
            - "Client + agreement; batch INTAKE with box A (600g); GENERAL slot cap 2000"
          setup_api_calls:
            - { call: "POST /clients", payload: { name: "Conserve Co", hipaa_covered: false }, as: PlatformAdmin, captures: { cid: $.data.id } }
            - { call: "POST /clients/${cid}/service-agreements", payload: { price_tier: "STANDARD", rush_multiplier: 1.75, storage_free_days: 10, storage_daily_rate_cents: 55, retention_days: 30, max_boxes_per_batch: 5 }, as: PlatformAdmin }
            - { call: "POST /shelf-slots", payload: { shelf_code: "SH-C", zone: "GENERAL", capacity_grams: 2000 }, as: PlatformAdmin, captures: { slot: $.data.id } }
            - { call: "POST /batches", payload: { client_id: "${cid}", priority: "STANDARD" }, as: IntakeClerk, as_user_id: "clerk-1", captures: { bid: $.data.id } }
            - { call: "POST /batches/${bid}/boxes", payload: { box_label: "BX-A", intake_weight_grams: 600 }, as: IntakeClerk, as_user_id: "clerk-1", captures: { boxA: $.data.id } }
          trigger:
            - { call: "POST /boxes/${boxA}/shelf-assignments", payload: { shelf_slot_id: "${slot}" }, as: IntakeClerk, as_user_id: "clerk-1", captures: { asg: $.data.id } }
            - { call: "GET /shelf-slots/${slot}", payload: {}, as: IntakeClerk, as_user_id: "clerk-1", captures: { occ_1: $.data.occupied_weight_grams } }
            - { call: "POST /shelf-assignments/${asg}/release", payload: {}, as: IntakeClerk, as_user_id: "clerk-1" }
            - { call: "GET /shelf-slots/${slot}", payload: {}, as: IntakeClerk, as_user_id: "clerk-1", captures: { occ_2: $.data.occupied_weight_grams } }
          assert:
            - "after placement: ${occ_1} == 600"
            - "after the compensating release: ${occ_2} == 0  (occupy + release conserves the occupancy gauge)"
            - "ShelfAssignment.${asg}.status == RELEASED with released_at set"

      - name: billable_pages_count_once_across_rework
        grounds:
          - entities.Batch.fields.billable_scanned_pages
          - state_machines.Document.QA_FAILED_to_SCANNED
          - calculations.invoice_pricing
          - state_machines.Batch.QA_to_SCANNING
        distinguishing_aspect: |
          Conserved quantity (different from shelf occupancy): the billable
          page ledger. A full scan (100 pages) followed by its compensating
          rework cycle (QA-fail + rescan of the same 100 pages) leaves
          billable_scanned_pages and the invoice page subtotal unchanged at
          100 pages / 4500 cents, even though produced material
          (scanned_pages) grew to 200.
        test_recipe:
          setup:
            - "Client + STANDARD agreement; batch with one 100-page document d1"
            - "d1 scanned and committed; qa-review marks d1 QA_FAILED; batch submitted to QA then failed back to SCANNING; rework session rescans d1 and commits"
          setup_api_calls:
            - { call: "POST /clients", payload: { name: "Ledger Co", hipaa_covered: false }, as: PlatformAdmin, captures: { cid: $.data.id } }
            - { call: "POST /clients/${cid}/service-agreements", payload: { price_tier: "STANDARD", rush_multiplier: 1.75, storage_free_days: 10, storage_daily_rate_cents: 55, retention_days: 30, max_boxes_per_batch: 5 }, as: PlatformAdmin }
            - { call: "POST /batches", payload: { client_id: "${cid}", priority: "STANDARD" }, as: IntakeClerk, as_user_id: "clerk-1", captures: { bid: $.data.id } }
            - { call: "POST /batches/${bid}/boxes", payload: { box_label: "BX-1", intake_weight_grams: 600 }, as: IntakeClerk, as_user_id: "clerk-1", captures: { box1: $.data.id } }
            - { call: "POST /boxes/${box1}/documents", payload: { doc_type: "CONTRACT", pages: 100, contains_phi: false, ocr_confidence: 95 }, as: IntakeClerk, as_user_id: "clerk-1", captures: { d1: $.data.id } }
            - { call: "POST /batches/${bid}/start-prep", payload: {}, as: IntakeClerk, as_user_id: "clerk-1" }
            - { call: "POST /batches/${bid}/start-scan", payload: {}, as: ScanOperator, as_user_id: "scan-1" }
            - { call: "POST /scanner-units", payload: { scanner_code: "SCN-1", capacity_pages_per_session: 500 }, as: PlatformAdmin, captures: { sc: $.data.id } }
            - { call: "POST /batches/${bid}/scan-sessions", payload: { scanner_id: "${sc}" }, as: ScanOperator, as_user_id: "scan-1", captures: { ss1: $.data.id } }
            - { call: "POST /scan-sessions/${ss1}/page-logs", payload: { document_id: "${d1}", pages: 100 }, as: ScanOperator, as_user_id: "scan-1" }
            - { call: "GET /batches/${bid}", payload: {}, as: ScanOperator, as_user_id: "scan-1", captures: { bv1: $.data.version } }
            - { call: "POST /scan-sessions/${ss1}/commit", payload: { expected_batch_version: "${bv1}" }, as: ScanOperator, as_user_id: "scan-1" }
            - { call: "GET /batches/${bid}/invoices", payload: {}, as: BillingClerk, as_user_id: "bill-1", captures: { inv: "$.data[0].id" } }
            - { call: "GET /invoices/${inv}", payload: {}, as: BillingClerk, as_user_id: "bill-1", captures: { sub_after_scan: $.data.page_subtotal_cents } }
            - { call: "POST /batches/${bid}/qa-reviews", payload: { document_id: "${d1}" }, as: QAReviewer, as_user_id: "qa-1" }
            - { call: "POST /batches/${bid}/submit-qa", payload: {}, as: ScanOperator, as_user_id: "scan-1" }
            - { call: "POST /batches/${bid}/fail-qa", payload: {}, as: QAReviewer, as_user_id: "qa-1" }
          trigger:
            - { call: "POST /batches/${bid}/scan-sessions", payload: { scanner_id: "${sc}" }, as: ScanOperator, as_user_id: "scan-1", captures: { ss2: $.data.id } }
            - { call: "POST /scan-sessions/${ss2}/page-logs", payload: { document_id: "${d1}", pages: 100 }, as: ScanOperator, as_user_id: "scan-1" }
            - { call: "GET /batches/${bid}", payload: {}, as: ScanOperator, as_user_id: "scan-1", captures: { bv2: $.data.version } }
            - { call: "POST /scan-sessions/${ss2}/commit", payload: { expected_batch_version: "${bv2}" }, as: ScanOperator, as_user_id: "scan-1" }
            - { call: "GET /batches/${bid}", payload: {}, as: BillingClerk, as_user_id: "bill-1", captures: { billable: $.data.billable_scanned_pages, scanned: $.data.scanned_pages } }
            - { call: "GET /invoices/${inv}", payload: {}, as: BillingClerk, as_user_id: "bill-1", captures: { sub_after_rework: $.data.page_subtotal_cents } }
          assert:
            - "after first scan: ${sub_after_scan} == 4500"
            - "after full rework cycle: ${billable} == 100  (count-once conserved)"
            - "produced material diverges as designed: ${scanned} == 200"
            - "invoice conserved: ${sub_after_rework} == 4500  (rework is never double-billed)"
