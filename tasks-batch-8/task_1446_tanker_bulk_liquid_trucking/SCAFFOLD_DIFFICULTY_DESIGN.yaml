            - { call: "POST /bulk-liquid/compatibility-rules", payload: { prior_group: PETROLEUM, next_group: PETROLEUM, required_wash_level: NONE }, as: FleetAdmin }
            - { call: "POST /bulk-liquid/trailers", payload: { unit_number: "T-101", capacity_gallons: 8000, tare_weight_lb: 25000, tare_steer_lb: 6000, tare_drive_lb: 9000, tare_trailer_lb: 10000, steer_axle_rating_lb: 12000, drive_axle_rating_lb: 34000, trailer_axle_rating_lb: 34000, gvwr_lb: 80000 }, as: FleetAdmin, captures: { trl: $.data.id } }
            - { call: "POST /bulk-liquid/drivers", payload: { full_name: "Dana Roe", cdl_number: "CDL-1", tanker_endorsement: true, hazmat_endorsement: true, endorsement_expires_on: "2027-06-01" }, as: FleetAdmin, captures: { drv: $.data.id } }
            - { call: "POST /bulk-liquid/loading-racks", payload: { rack_code: "R-1", terminal_name: "Baytown", authorized_groups: [PETROLEUM], open_hour: 6, close_hour: 22, meter_id: "M-1" }, as: FleetAdmin, captures: { rack: $.data.id } }
            - { call: "POST /bulk-liquid/wash-bays", payload: { bay_code: "WB-1", supported_wash_levels: [FLUSH, DETERGENT_WASH], cleanup_buffer_minutes: 30 }, as: FleetAdmin, captures: { bay: $.data.id } }
            - { call: "POST /bulk-liquid/tank-wash-certificates", payload: { trailer_id: "${trl}", wash_bay_id: "${bay}", wash_level: FLUSH, window_start: "2026-08-01T06:00:00Z", window_end: "2026-08-01T07:00:00Z" }, as: WashOperator, captures: { cert: $.data.id } }
            - { call: "POST /bulk-liquid/tank-wash-certificates/${cert}/certify", as: WashOperator }
            - { call: "POST /bulk-liquid/shipments", payload: { customer_id: "${cust}", product_id: "${prod}", ordered_gallons: 1000, route_miles: 100, rate_per_gal_cents: 100 }, as: Dispatcher, captures: { ship: $.data.id } }
            - { call: "POST /bulk-liquid/shipments/${ship}/plan", payload: { trailer_id: "${trl}", driver_id: "${drv}", rack_id: "${rack}", rack_window_start: "2026-08-02T10:00:00Z", rack_window_end: "2026-08-02T12:00:00Z", wash_cert_id: "${cert}" }, as: Dispatcher }
          trigger:
            - { call: "POST /bulk-liquid/tank-wash-certificates/${cert}/revoke", as: SafetyOfficer, as_user_id: "so-1", captures: { cert_status: $.data.status } }
            - { call: "GET /bulk-liquid/shipments/${ship}", as: Dispatcher, captures: { ship_status: $.data.status, ship_cert: $.data.wash_cert_id, ship_trl: $.data.trailer_id } }
            - { call: "GET /bulk-liquid/trailers/${trl}", as: FleetAdmin, captures: { trl_status: $.data.status } }
          assert:
            - "TankWashCertificate.${cert}.status == VOIDED (hop 1)"
            - "Shipment.${ship}.status == DRAFT with wash_cert_id == null and trailer_id == null (hop 2)"
            - "TankTrailer.${trl}.status == AVAILABLE (hop 3)"

