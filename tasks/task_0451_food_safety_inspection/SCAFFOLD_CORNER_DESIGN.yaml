              as: PermitClerk
            - call: "POST /permits"
              payload: { establishment_id: "${e1}", plan_review_id: "${pr1}" }
              as: PermitClerk
            - call: "POST /inspections"
              payload: { establishment_id: "${e1}", inspector_id: "${i1}", inspection_type: "ROUTINE", scheduled_index: 130 }
              as: PermitClerk
              captures: { insp1: $.data.id }
            - call: "POST /inspections/${insp1}/start"
              payload: {}
              as: Inspector
              as_user_id: "${i1}"
            - call: "POST /violations"
              payload: { inspection_id: "${insp1}", fda_code_id: "${c_big}", corrected_on_site: false }
