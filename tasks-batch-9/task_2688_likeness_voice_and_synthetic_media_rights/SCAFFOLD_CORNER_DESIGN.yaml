      - name: the_five_hop_revocation_chain_runs_end_to_end
        claim_type: cascading_side_effects
        excluded_because:
          difficulty_instance: consent_revoke_five_hop_cascade_to_removal_obligation
          rationale: >-
            The deepest cascade in the scaffold — revoke -> asset retention -> replica quarantine ->
            performance withdrawal -> license removal obligation -> talent posture — is walked hop by
            hop in §1.8, which asserts the settled state after each hop and the ordering sensitivity
            (children processed created_at ASC).

      - name: cascade_ordering_only_touches_non_terminal_children
        claim_type: cascading_side_effects
        excluded_because:
          difficulty_instance: revocation_cascade_skips_children_already_in_terminal_states
          rationale: >-
            Partial application — the same cascade run against a fixture whose children are already
            REJECTED, PURGED or REMOVAL_CONFIRMED — is asserted in §1.8 and again by the state-machine
            corner of the same name, so a third copy would add nothing.

      - name: both_royalty_variants_price_the_same_use_differently
        claim_type: dual_variant_calculation
        excluded_because:
          difficulty_instance: per_use_royalty_provisional_versus_final_divergence
          rationale: >-
            The layer's whole content for this scaffold is the provisional/final royalty pair and the
            domicile/use-state expiry pair; §1.8 asserts both amounts, the ledger delta on the switch
            and the null arm of the expiry variant.

      - name: derived_counters_reconcile_after_create_update_and_reversal
        claim_type: derived_field_reconciliation
        excluded_because:
          difficulty_instance: ledger_sum_restored_after_provisional_accrual_is_reversed
          rationale: >-
            Every derived counter in this scaffold (grant total, talent lifetime, open license count,
            open removal obligations, legal hold count) is reconciled before and after a reversal in
            §1.8, which is a strictly stronger claim than the create/update/delete triple.

      - name: a_sweep_at_the_deadline_boundary_acts_and_a_sweep_before_it_does_not
        claim_type: scheduled_actions
        excluded_because:
          difficulty_instance: removal_deadline_day_boundary_in_sweep_phase_three
          rationale: >-
            POST /compliance-sweeps is the scaffold's only scheduled action, and its firing boundary is
            asserted in §1.8 at the exact removal deadline instant and one second either side.

