          Readings are processed in recorded_at ASC order regardless of insertion order: recording 07:40 at 6.0 C first and 07:20 at 5.0 C second still yields the chronological attribution 10 + 20 = 30 minutes, not the 20 minutes the 07:40 row alone had claimed against the 07:00 received_at.
