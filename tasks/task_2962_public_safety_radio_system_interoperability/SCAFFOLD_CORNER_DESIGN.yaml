          assert:
            - "Baseline: SiteEvent.${event_ofa_id}.status == ESCALATED, escalation_tier == 3, backup_minutes_remaining == 0, preempted_talkpath_count == 0"
            - "Baseline: Site.${site_ofa_id}.status == OFF_AIR and capacity_mode == EMERGENCY_ONLY"
            - "trigger[0] returns HTTP 409 with data.error_id == ERR_SITE_OFF_AIR"
            - "Site.${site_ofa_id}.busy_talkpaths == 0, granted_request_count == 0, busied_request_count == 0 and grade_of_service_pct == 100.0"
            - "GET /radio-system/talkpath-requests?site_id=${site_ofa_id} returns total_count == 0"

  - section: rbac
    instances:
      - name: rbac_dispatcher_cannot_create_a_site
        claim_type: cross_role_denial
        grounds:
          - roles.SystemAdmin.exclusive_operations
          - roles.Dispatcher
          - errors.ERR_UNAUTHORIZED
        distinguishing_aspect: "Site creation is exclusive to SystemAdmin: the same well-formed body returns HTTP 403 ERR_UNAUTHORIZED under the Dispatcher role and HTTP 201 under SystemAdmin, so the refusal is authorisation and not payload validation."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; agency RBD exists so the Dispatcher's X-User-ID resolves."
          setup_api_calls:
            - call: "POST /radio-system/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
              as_user_id: "admin-1"
            - call: "POST /radio-system/agencies"
              payload: { name: "RBAC Dispatch Agency", agency_code: "RBD01", agency_type: "LAW", recorder_retention_days: 180 }
              as: SystemAdmin
              as_user_id: "admin-1"
              captures: { agency_rbd_id: "$.data.id" }
          trigger:
            - call: "POST /radio-system/sites"
              payload: { site_code: "RBD-1", name: "RBAC Site One", channel_capacity: 4, backup_power_type: "GENERATOR" }
              as: Dispatcher
              as_user_id: "${agency_rbd_id}"
              captures: { rbd_error_id: "$.data.error_id" }
            - call: "POST /radio-system/sites"
              payload: { site_code: "RBD-1", name: "RBAC Site One", channel_capacity: 4, backup_power_type: "GENERATOR" }
              as: SystemAdmin
              as_user_id: "admin-1"
              captures: { site_rbd_id: "$.data.id" }
          assert:
            - "trigger[0] returns HTTP 403 with data.error_id == ERR_UNAUTHORIZED"
            - "GET /radio-system/sites?site_code=RBD-1 immediately after trigger[0] returns total_count == 0 (nothing was written)"
            - "trigger[1] returns HTTP 201 with data.site_code == \"RBD-1\", proving the body itself was valid"

      - name: rbac_key_custodian_cannot_approve_its_own_keyset_role
        claim_type: cross_role_denial
        grounds:
          - roles.SecurityOfficer.exclusive_operations
          - roles.KeyCustodian.exclusive_operations
          - errors.ERR_UNAUTHORIZED
        distinguishing_aspect: "The two crypto roles are split: KeyCustodian may create a keyset but the approval endpoint is exclusive to SecurityOfficer, so KeyCustodian approving returns HTTP 403 ERR_UNAUTHORIZED (role denial) rather than ERR_SEGREGATION_OF_DUTIES."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; keyset KS-RBAC-1 is PENDING_APPROVAL, created by kc-1."
          setup_api_calls:
            - call: "POST /radio-system/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
              as_user_id: "admin-1"
            - call: "POST /radio-system/keysets"
              payload: { keyset_name: "KS-RBAC-1", algorithm: "AES256", crypto_period_start: "2026-08-01T00:00:00Z", crypto_period_end: "2026-11-01T00:00:00Z" }
              as: KeyCustodian
              as_user_id: "kc-1"
              captures: { keyset_rbac_id: "$.data.id" }
          trigger:
            - call: "POST /radio-system/keysets/${keyset_rbac_id}/approval"
              payload: { decision: "APPROVE" }
              as: KeyCustodian
              as_user_id: "kc-1"
              captures: { rbac_keyset_error_id: "$.data.error_id" }
            - call: "POST /radio-system/keysets/${keyset_rbac_id}/approval"
              payload: { decision: "APPROVE" }
              as: SecurityOfficer
              as_user_id: "so-1"
          assert:
            - "trigger[0] returns HTTP 403 with data.error_id == ERR_UNAUTHORIZED (role check precedes the segregation-of-duties check)"
            - "After trigger[0]: Keyset.${keyset_rbac_id}.status == PENDING_APPROVAL and approved_by_user_id == null"
            - "trigger[1] returns HTTP 200 with status == ACTIVE and approved_by_user_id == \"so-1\""

      - name: rbac_fleet_engineer_cannot_rule_on_its_own_change_request
        claim_type: cross_role_denial
        grounds:
          - roles.ChangeControlBoard.exclusive_operations
          - roles.FleetEngineer.exclusive_operations
          - errors.ERR_UNAUTHORIZED
        distinguishing_aspect: "The approval chain separates authoring from ruling: review-decision is exclusive to ChangeControlBoard, so the FleetEngineer who submitted the request is refused with HTTP 403 ERR_UNAUTHORIZED while ccb-1 succeeds on the identical body."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; change request CR-RBAC is SUBMITTED against PUBLISHED template RBC-BASE-1 for agency RBC."
          setup_api_calls:
            - call: "POST /radio-system/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
              as_user_id: "admin-1"
            - call: "POST /radio-system/agencies"
              payload: { name: "RBAC Board Agency", agency_code: "RBC01", agency_type: "FIRE", recorder_retention_days: 90 }
              as: SystemAdmin
              as_user_id: "admin-1"
              captures: { agency_rbc_id: "$.data.id" }
            - call: "POST /radio-system/templates"
              payload: { template_name: "RBC-BASE-1", target_standard: "P25_PHASE2", talkgroup_slot_count: 4 }
              as: FleetEngineer
              as_user_id: "fe-1"
              captures: { tpl_rbc_id: "$.data.id" }
            - call: "POST /radio-system/templates/${tpl_rbc_id}/publish"
              payload: {}
              as: FleetEngineer
              as_user_id: "fe-1"
            - call: "POST /radio-system/change-requests"
              payload: { template_id: "${tpl_rbc_id}", target_agency_id: "${agency_rbc_id}", title: "RBAC ruling check" }
              as: FleetEngineer
              as_user_id: "fe-1"
              captures: { cr_rbc_id: "$.data.id" }
            - call: "POST /radio-system/change-requests/${cr_rbc_id}/submit"
              payload: {}
              as: FleetEngineer
              as_user_id: "fe-1"
          trigger:
            - call: "POST /radio-system/change-requests/${cr_rbc_id}/review-decision"
              payload: { decision: "APPROVE" }
              as: FleetEngineer
              as_user_id: "fe-1"
              captures: { rbac_cr_error_id: "$.data.error_id" }
            - call: "POST /radio-system/change-requests/${cr_rbc_id}/review-decision"
              payload: { decision: "APPROVE" }
              as: ChangeControlBoard
              as_user_id: "ccb-1"
          assert:
            - "trigger[0] returns HTTP 403 with data.error_id == ERR_UNAUTHORIZED"
            - "After trigger[0]: ProgrammingChangeRequest.${cr_rbc_id}.status == SUBMITTED and reviewed_by_user_id == null"
            - "trigger[1] returns HTTP 200 with status == APPROVED, reviewed_by_user_id == \"ccb-1\" and pinned_template_version == 1"

      - name: rbac_segregation_of_duties_blocks_self_review_of_change_request
        claim_type: segregation_of_duties
        grounds:
          - validations[priority=10]
          - endpoints[POST /radio-system/change-requests/{change_request_id}/review-decision]
          - errors.ERR_SEGREGATION_OF_DUTIES
        distinguishing_aspect: "With the ChangeControlBoard role satisfied, the reviewer identity is still compared to submitted_by_user_id: X-User-ID ccb-1 reviewing a request it submitted returns HTTP 403 ERR_SEGREGATION_OF_DUTIES, while a different board member id on the same request succeeds."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "Change request CR-SOD is SUBMITTED with submitted_by_user_id == ccb-1 (the submit call used the FleetEngineer role with X-User-ID ccb-1)."
          setup_api_calls:
            - call: "POST /radio-system/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
              as_user_id: "admin-1"
            - call: "POST /radio-system/agencies"
              payload: { name: "SoD Board Agency", agency_code: "SOD01", agency_type: "EMS", recorder_retention_days: 90 }
              as: SystemAdmin
              as_user_id: "admin-1"
              captures: { agency_sod_id: "$.data.id" }
            - call: "POST /radio-system/templates"
              payload: { template_name: "SOD-BASE-1", target_standard: "P25_PHASE2", talkgroup_slot_count: 4 }
              as: FleetEngineer
              as_user_id: "fe-1"
              captures: { tpl_sod_id: "$.data.id" }
            - call: "POST /radio-system/templates/${tpl_sod_id}/publish"
              payload: {}
              as: FleetEngineer
              as_user_id: "fe-1"
            - call: "POST /radio-system/change-requests"
              payload: { template_id: "${tpl_sod_id}", target_agency_id: "${agency_sod_id}", title: "SoD self review" }
              as: FleetEngineer
              as_user_id: "fe-1"
              captures: { cr_sod_id: "$.data.id" }
            - call: "POST /radio-system/change-requests/${cr_sod_id}/submit"
              payload: {}
              as: FleetEngineer
              as_user_id: "ccb-1"
          trigger:
            - call: "POST /radio-system/change-requests/${cr_sod_id}/review-decision"
              payload: { decision: "APPROVE" }
              as: ChangeControlBoard
              as_user_id: "ccb-1"
              captures: { sod_cr_error_id: "$.data.error_id" }
            - call: "POST /radio-system/change-requests/${cr_sod_id}/review-decision"
              payload: { decision: "REJECT", review_comment: "Reviewed by a different board member" }
              as: ChangeControlBoard
              as_user_id: "ccb-2"
          assert:
            - "Baseline: ProgrammingChangeRequest.${cr_sod_id}.submitted_by_user_id == \"ccb-1\" and status == SUBMITTED"
            - "trigger[0] returns HTTP 403 with data.error_id == ERR_SEGREGATION_OF_DUTIES"
            - "After trigger[0]: status stays SUBMITTED and reviewed_by_user_id == null"
            - "trigger[1] returns HTTP 200 with status == REJECTED and reviewed_by_user_id == \"ccb-2\""

      - name: rbac_peer_agency_cannot_lock_another_agencys_talkgroup
        claim_type: peer_roles
        grounds:
          - validations[priority=9]
          - roles.AgencyRadioManager.identity
          - errors.ERR_AGENCY_SCOPE_VIOLATION
        distinguishing_aspect: "Two AgencyRadioManagers hold the same role but are peers, not superiors: manager of agency PRB is refused with HTTP 403 ERR_AGENCY_SCOPE_VIOLATION on a talkgroup owned by agency PRA, while both may read it."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; agencies PRA and PRB exist; PRA owns talkgroup PRA-A on site PRB-1."
          setup_api_calls:
            - call: "POST /radio-system/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
              as_user_id: "admin-1"
            - call: "POST /radio-system/agencies"
              payload: { name: "Peer Agency A", agency_code: "PRA01", agency_type: "LAW", recorder_retention_days: 180 }
              as: SystemAdmin
