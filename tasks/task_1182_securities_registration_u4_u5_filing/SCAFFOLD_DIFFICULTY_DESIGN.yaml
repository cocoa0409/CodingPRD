              captures: { sie_x2_id: $.data.id }
            - call: "POST /registration-desk/exam-requirements"
              payload: { registration_request_id: "${req_x2_id}", exam_code: "S7" }
              as: RegistrationPrincipal
              captures: { s7_x2_id: $.data.id }
            - call: "POST /registration-desk/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-10T00:00:00Z" }
              as: SystemOperator
            - call: "POST /registration-desk/exam-windows"
              payload: { exam_requirement_id: "${s7_x2_id}", window_start: "2026-06-10T00:00:00Z", window_end: "2026-06-11T00:00:00Z" }
              as: RegistrationPrincipal
              captures: { err_s7: $.data.error_id }
            - call: "POST /registration-desk/exam-windows"
              payload: { exam_requirement_id: "${sie_x2_id}", window_start: "2026-06-10T00:00:00Z", window_end: "2026-06-11T00:00:00Z" }
              as: RegistrationPrincipal
              captures: { win_sie_x2: $.data.id }
          trigger:
            - call: "POST /registration-desk/exam-windows"
              payload: { exam_requirement_id: "${s7_x2_id}", window_start: "2026-06-12T00:00:00Z", window_end: "2026-06-13T00:00:00Z" }
              as: RegistrationPrincipal
              captures: { win_s7_x2: $.data.id }
          assert:
            - "first S7 window attempt captured err_s7 == ERR_REFERENTIAL_VIOLATION (SIE still REQUIRED)"
            - "after SIE window ${win_sie_x2} scheduled (SIE -> SCHEDULED) the S7 window succeeds: ExamWindow.${win_s7_x2}.status == SCHEDULED and ExamRequirement.${s7_x2_id}.status == SCHEDULED"

  # ===========================================================================
  # Rule 8 — resource_temporal_overlap (different interval semantics)
  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: exam_window_slot_occupation_disjoint_rejected
        grounds:
          - validations[priority=4]
          - state_machines.ExamRequirement.REQUIRED_to_SCHEDULED
        distinguishing_aspect: |
          Semantics: exclusive-slot occupation on the ExamRequirement resource —
          a second window is rejected while ANY window holds SCHEDULED/OPEN even
          when the two intervals are fully DISJOINT in time; only after the
          first window reaches USED or CANCELLED may another be created. This is
          cardinality-occupation, not geometric interval intersection.
        test_recipe:
          setup:
            - "Firm, applicant, request; SIE requirement; W1 SCHEDULED 2026-06-01..2026-06-02; clock 2026-06-01T10:00:00Z"
          setup_api_calls:
            - call: "POST /registration-desk/firms"
              payload: { crd_number: "1801", legal_name: "Overlap Firm 1" }
              as: SystemOperator
              captures: { firm_o1_id: $.data.id }
            - call: "POST /registration-desk/applicants"
              payload: { crd_number: "2801", full_name: "Overlap Rep 1", date_of_birth: "1995-03-15" }
              as: RegistrationPrincipal
              captures: { app_o1_id: $.data.id }
            - call: "POST /registration-desk/registration-requests"
              payload: { applicant_id: "${app_o1_id}", firm_id: "${firm_o1_id}", registration_category: "RR" }
              as: RegistrationPrincipal
              captures: { req_o1_id: $.data.id }
            - call: "POST /registration-desk/exam-requirements"
              payload: { registration_request_id: "${req_o1_id}", exam_code: "SIE" }
              as: RegistrationPrincipal
              captures: { sie_o1_id: $.data.id }
            - call: "POST /registration-desk/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T10:00:00Z" }
              as: SystemOperator
            - call: "POST /registration-desk/exam-windows"
              payload: { exam_requirement_id: "${sie_o1_id}", window_start: "2026-06-01T00:00:00Z", window_end: "2026-06-02T00:00:00Z" }
              as: RegistrationPrincipal
              captures: { win_o1: $.data.id }
            - call: "POST /registration-desk/exam-windows"
              payload: { exam_requirement_id: "${sie_o1_id}", window_start: "2026-07-01T00:00:00Z", window_end: "2026-07-02T00:00:00Z" }
              as: RegistrationPrincipal
              captures: { err_ov1: $.data.error_id }
            - call: "POST /registration-desk/exam-windows/${win_o1}/record-result"
              payload: { result: "FAIL" }
              as: SystemOperator
          trigger:
            - call: "POST /registration-desk/exam-windows"
              payload: { exam_requirement_id: "${sie_o1_id}", window_start: "2026-07-01T00:00:00Z", window_end: "2026-07-02T00:00:00Z" }
              as: RegistrationPrincipal
              captures: { win_o2: $.data.id }
          assert:
            - "while W1 was SCHEDULED the disjoint July window was rejected: captured err_ov1 == ERR_DUPLICATE"
            - "after W1 reached USED (FAIL recorded) the identical July window succeeds: ExamWindow.${win_o2}.status == SCHEDULED"

      - name: affiliation_status_occupation_blocks_and_releases
        grounds:
          - validations[priority=4]
          - entities.AffiliationRequest.fields.status
        distinguishing_aspect: |
          Semantics: status-membership occupation on the AffiliationRequest
          resource (keyed by applicant+second_firm) — different resource and
          different interval semantics from instance 1 (no time interval at
          all): a duplicate is rejected while the first is PENDING and while
          APPROVED, but the slot is released once the first reaches DENIED,
          whereupon an identical request succeeds.
        test_recipe:
          setup:
            - "Firms F1, F2; applicant with ACTIVE R1 at F1; affiliation AF1 created then DENIED (denial_reason supplied)"
            - "Clock irrelevant; occupation predicate is status membership"
          setup_api_calls:
            - call: "POST /registration-desk/firms"
              payload: { crd_number: "1802", legal_name: "Overlap Firm 2A" }
              as: SystemOperator
              captures: { firm_o2a_id: $.data.id }
            - call: "POST /registration-desk/firms"
              payload: { crd_number: "1803", legal_name: "Overlap Firm 2B" }
              as: SystemOperator
              captures: { firm_o2b_id: $.data.id }
            - call: "POST /registration-desk/applicants"
              payload: { crd_number: "2802", full_name: "Overlap Rep 2", date_of_birth: "1996-04-16" }
              as: RegistrationPrincipal
              captures: { app_o2_id: $.data.id }
            - call: "POST /registration-desk/registration-requests"
              payload: { applicant_id: "${app_o2_id}", firm_id: "${firm_o2a_id}", registration_category: "IA" }
              as: RegistrationPrincipal
              captures: { req_o2_id: $.data.id }
            - call: "POST /registration-desk/affiliation-requests"
              payload: { applicant_id: "${app_o2_id}", second_firm_id: "${firm_o2b_id}", first_registration_request_id: "${req_o2_id}" }
              as: RegistrationPrincipal
              captures: { aff_o2_id: $.data.id }
            - call: "POST /registration-desk/affiliation-requests"
              payload: { applicant_id: "${app_o2_id}", second_firm_id: "${firm_o2b_id}", first_registration_request_id: "${req_o2_id}" }
              as: RegistrationPrincipal
              captures: { err_aff2: $.data.error_id }
            - call: "POST /registration-desk/affiliation-requests/${aff_o2_id}/deny"
              payload: { denial_reason: "Conflicting business line at second firm." }
              as: ComplianceOfficer
          trigger:
            - call: "POST /registration-desk/affiliation-requests"
              payload: { applicant_id: "${app_o2_id}", second_firm_id: "${firm_o2b_id}", first_registration_request_id: "${req_o2_id}" }
              as: RegistrationPrincipal
              captures: { aff_o2_second_id: $.data.id }
          assert:
            - "while AF1 was PENDING the duplicate was rejected: captured err_aff2 == ERR_DUPLICATE"
            - "after AF1 -> DENIED the identical payload succeeds: AffiliationRequest.${aff_o2_second_id}.status == PENDING"

  # ===========================================================================
  # Rule 9 — compensating_invariant (different conserved quantities)
  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: jurisdiction_fee_conservation_on_relinquish
        grounds:
          - state_machines.JurisdictionSelection.APPROVED_to_RELINQUISHED
          - entities.RenewalInvoice.fields.jurisdiction_fee_cents
        distinguishing_aspect: |
          Conserved quantity (money): for an ISSUED invoice,
          jurisdiction_fee_cents MUST equal the sum of annual_fee_cents over the
          request's APPROVED selections at all times. Approving added CA 5000 +
          NY 5000 = 10000; relinquishing CA removes exactly 5000 — the invoice
          recompute after relinquish yields 5000, and total_cents drops by the
          same 5000 (no drift in base or surcharge).
        test_recipe:
          setup:
            - "Firm; ACTIVE registration (approved 2026-06-02, ACTIVE 2026-06-03) with APPROVED CA+NY selections"
            - "ISSUED invoice for cycle 2027 created at clock 2026-12-01: jurisdiction_fee_cents 10000, base 10000, total 20000"
          setup_api_calls:
            - call: "POST /registration-desk/firms"
              payload: { crd_number: "1901", legal_name: "Invariant Firm 1" }
              as: SystemOperator
              captures: { firm_i1_id: $.data.id }
            - call: "POST /registration-desk/applicants"
              payload: { crd_number: "2901", full_name: "Invariant Rep 1", date_of_birth: "1997-05-17" }
              as: RegistrationPrincipal
              captures: { app_i1_id: $.data.id }
