            - { call: "POST /api/departments", payload: { name: "Eng", chargeback_account_code: "GL-ENG" }, as: HRAdmin, captures: { dept: $.data.id } }
            - { call: "POST /api/budgets", payload: { program_id: "${prog}", department_id: "${dept}", period_start_date: "2026-01-01", period_end_date: "2027-01-01", allocated_points: 10000 }, as: FinanceAdmin }
            - { call: "POST /api/employees", payload: { employee_ref: "E1", full_name: "A", department_id: "${dept}", hire_date: "2021-06-15", state_code: "CA" }, as: HRAdmin, captures: { e1: $.data.id } }
          trigger:
            - { call: "POST /api/nominations", payload: { program_id: "${prog}", nominee_id: "${e1}", type: PEER, points_requested: 100, reason_code: TEAMWORK, message: "me me me", idempotency_key: "val-self-1" }, as: Employee, as_user_id: "${e1}", captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_SELF_NOMINATION"

      - name: self_approval_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=10]", "errors[ERR_SELF_APPROVAL]"]
        distinguishing_aspect: "A manager who NOMINATED a direct report cannot approve that same nomination (approver == nominator) — segregation of duties inside the workflow."
        test_recipe:
          setup: ["manager nominates direct report"]
          setup_api_calls:
            - { call: "POST /api/programs", payload: { name: "P", max_points_per_nomination: 1000, point_cost_rate_cents: 0.5, state_rate_map: { CA: 0.093 } }, as: HRAdmin, captures: { prog: $.data.id } }
            - { call: "POST /api/programs/${prog}/activate", payload: {}, as: HRAdmin }
