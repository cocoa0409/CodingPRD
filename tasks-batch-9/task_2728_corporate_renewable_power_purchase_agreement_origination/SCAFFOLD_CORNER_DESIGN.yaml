          assert:
            - "before the trigger Offtaker.${buyer_id}.qualification_status == QUALIFIED, credit_tier == PRIME, unsecured_credit_limit_usd == 3000000.00 and watchlist_since is null"
            - "before the trigger Deal.${deal_id}.credit_status == APPROVED, exposure_usd == 1394550.00 = round(61320.00 * 22.75, 2), credit_support_required_usd == 0.00 and support_cure_deadline is null"
            - "the trigger returns 200 with Offtaker.${buyer_id}.credit_score == 60.25 = 0.55*55 (BB) + 0.30*50 (100 - 10*5.0) + 0.15*100 (CDP_AND_TCFD)"
            - "Offtaker.${buyer_id}.credit_tier == SUBPRIME because 45.00 <= 60.25 < 62.00, and unsecured_credit_limit_usd == 300000.00 = min(2000000.00, round(60000000.00 * 0.005, 2))"
