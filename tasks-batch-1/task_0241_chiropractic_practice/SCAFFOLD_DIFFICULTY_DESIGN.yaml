  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: provider_half_open_overlap_adjacency_allowed
        grounds:
          - validations[priority=13]
          - entities.Appointment.fields.scheduled_start
          - entities.Appointment.fields.scheduled_end
          - errors[ERR_PROVIDER_DOUBLE_BOOKED]
        distinguishing_aspect: |
          Resource = Provider; interval semantics = HALF-OPEN [start,end). A second booking that starts exactly when the
          first ends (16:15 == 16:00+15) is ALLOWED (adjacency permitted); a booking that overlaps (16:10 inside [16:00,16:15))
          is REJECTED with ERR_PROVIDER_DOUBLE_BOOKED. Two DIFFERENT rooms isolate this to the provider dimension only.
        test_recipe:
          setup:
            - "Provider P with one BOOKED appointment 2026-03-10T16:00:00Z..16:15 in room R1; a second OPEN room R2 exists (so room conflict cannot fire)."
          setup_api_calls:
            - call: "POST /fee-schedules"
              payload: { visit_type: "ADJUSTMENT", cash_rate_cents: 6000, billed_amount_cents: 9000 }
              as: PracticeAdmin
            - call: "POST /providers"
              payload: { full_name: "Dr Vega", npi: "1234567890", license_state: "CA" }
              as: PracticeAdmin
              captures: { prov_id: $.data.id }
            - call: "POST /treatment-rooms"
              payload: { name: "R1", room_type: "ADJUSTMENT", turnover_buffer_minutes: 0 }
              as: PracticeAdmin
              captures: { r1: $.data.id }
            - call: "POST /treatment-rooms"
              payload: { name: "R2", room_type: "ADJUSTMENT", turnover_buffer_minutes: 0 }
              as: PracticeAdmin
              captures: { r2: $.data.id }
            - call: "POST /_clock/set"
              payload: { current_utc: "2026-03-02T08:00:00Z" }
              as: PracticeAdmin
            - call: "POST /patients"
              payload: { full_name: "Adj Al", date_of_birth: "1980-01-01", payer_mode: "CASH" }
              as: FrontDesk
              captures: { pt_id: $.data.id }
            - call: "POST /patients/${pt_id}/appointments"
              payload: { provider_id: "${prov_id}", treatment_room_id: "${r1}", visit_type: "ADJUSTMENT", scheduled_start: "2026-03-10T16:00:00Z", duration_minutes: 15 }
              as: FrontDesk
              captures: { base_appt: $.data.id }
          trigger:
            - call: "POST /patients/${pt_id}/appointments"
              payload: { provider_id: "${prov_id}", treatment_room_id: "${r2}", visit_type: "ADJUSTMENT", scheduled_start: "2026-03-10T16:15:00Z", duration_minutes: 15 }
              as: FrontDesk
              captures: { adjacent_status: $.data.attendance_status }
            - call: "POST /patients/${pt_id}/appointments"
              payload: { provider_id: "${prov_id}", treatment_room_id: "${r2}", visit_type: "ADJUSTMENT", scheduled_start: "2026-03-10T16:10:00Z", duration_minutes: 15 }
              as: FrontDesk
              captures: { err: $.data.error_id }
          assert:
            - "the adjacent (16:15) booking succeeds with attendance_status == BOOKED"
            - "the overlapping (16:10) booking returns response_type error with data.error_id == ERR_PROVIDER_DOUBLE_BOOKED"

      - name: room_buffer_closed_interval_adjacency_insufficient
        grounds:
          - validations[priority=14]
          - entities.TreatmentRoom.fields.turnover_buffer_minutes
          - errors[ERR_ROOM_BUFFER_CONFLICT]
        distinguishing_aspect: |
          DIFFERENT resource (TreatmentRoom) and DIFFERENT interval semantics = CLOSED-WITH-BUFFER: a 10-minute turnover
          buffer means a back-to-back booking at 16:15 (== prior end) is now REJECTED (must be >= prior_end + 10m = 16:25),
          whereas a booking at 16:25 is allowed. Adjacency, allowed for the provider rule, is insufficient here.
          Two DIFFERENT providers isolate this to the room dimension.
        test_recipe:
          setup:
            - "Room R with turnover_buffer_minutes=10 holding a BOOKED appointment 16:00..16:15 (provider P1); a second provider P2 exists so provider conflict cannot fire."
          setup_api_calls:
            - call: "POST /fee-schedules"
              payload: { visit_type: "ADJUSTMENT", cash_rate_cents: 6000, billed_amount_cents: 9000 }
              as: PracticeAdmin
            - call: "POST /providers"
              payload: { full_name: "Dr Vega", npi: "1234567890", license_state: "CA" }
              as: PracticeAdmin
              captures: { p1: $.data.id }
            - call: "POST /providers"
              payload: { full_name: "Dr Lin", npi: "1234567891", license_state: "CA" }
              as: PracticeAdmin
              captures: { p2: $.data.id }
            - call: "POST /treatment-rooms"
              payload: { name: "R", room_type: "ADJUSTMENT", turnover_buffer_minutes: 10 }
              as: PracticeAdmin
              captures: { room_id: $.data.id }
            - call: "POST /_clock/set"
              payload: { current_utc: "2026-03-02T08:00:00Z" }
              as: PracticeAdmin
            - call: "POST /patients"
              payload: { full_name: "Buf Bob", date_of_birth: "1980-01-01", payer_mode: "CASH" }
              as: FrontDesk
              captures: { pt_id: $.data.id }
            - call: "POST /patients/${pt_id}/appointments"
              payload: { provider_id: "${p1}", treatment_room_id: "${room_id}", visit_type: "ADJUSTMENT", scheduled_start: "2026-03-10T16:00:00Z", duration_minutes: 15 }
              as: FrontDesk
              captures: { base_appt: $.data.id }
          trigger:
            - call: "POST /patients/${pt_id}/appointments"
              payload: { provider_id: "${p2}", treatment_room_id: "${room_id}", visit_type: "ADJUSTMENT", scheduled_start: "2026-03-10T16:15:00Z", duration_minutes: 15 }
              as: FrontDesk
              captures: { err: $.data.error_id }
            - call: "POST /patients/${pt_id}/appointments"
              payload: { provider_id: "${p2}", treatment_room_id: "${room_id}", visit_type: "ADJUSTMENT", scheduled_start: "2026-03-10T16:25:00Z", duration_minutes: 15 }
              as: FrontDesk
              captures: { ok_status: $.data.attendance_status }
          assert:
            - "the 16:15 booking (== prior end, inside the 10m buffer) returns response_type error with data.error_id == ERR_ROOM_BUFFER_CONFLICT"
            - "the 16:25 booking (>= prior end + 10m buffer) succeeds with attendance_status == BOOKED"

  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: cap_slot_conserved_book_then_cancel
        grounds:
          - state_machines.Appointment.BOOKED_to_CANCELLED
          - calculations.cap_reservation_check
          - entities.InsurancePolicy.fields.visits_reserved
          - entities.InsurancePolicy.fields.visits_committed
        distinguishing_aspect: |
          Conserved quantity = cap occupancy (visits_reserved + visits_committed). Booking reserves one slot (+1) and a
          non-late cancel releases it (-1), so the invariant (visits_reserved + visits_committed) returns to its pre-booking
          value of 0 with NO drift. This is the cap-conservation invariant.
        test_recipe:
          setup:
            - "INSURANCE patient, ACTIVE policy annual_visit_cap=5, no appointments yet (visits_reserved+visits_committed == 0). Clock well before the appointment so cancel is NOT late."
          setup_api_calls:
            - call: "POST /fee-schedules"
              payload: { visit_type: "ADJUSTMENT", cash_rate_cents: 6000, billed_amount_cents: 9000 }
              as: PracticeAdmin
            - call: "POST /providers"
              payload: { full_name: "Dr Vega", npi: "1234567890", license_state: "CA" }
              as: PracticeAdmin
              captures: { prov_id: $.data.id }
            - call: "POST /treatment-rooms"
              payload: { name: "Adj 1", room_type: "ADJUSTMENT" }
              as: PracticeAdmin
              captures: { room_id: $.data.id }
            - call: "POST /_clock/set"
              payload: { current_utc: "2026-03-02T08:00:00Z" }
              as: PracticeAdmin
            - call: "POST /patients"
              payload: { full_name: "Conserve Cara", date_of_birth: "1980-01-01", payer_mode: "INSURANCE" }
              as: FrontDesk
              captures: { pt_id: $.data.id }
            - call: "POST /patients/${pt_id}/insurance-policies"
              payload: { carrier_name: "Acme", annual_visit_cap: 5, deductible_total_cents: 0, coinsurance_pct: 0.20, allowed_amount_cents: 8000 }
              as: BillingClerk
              captures: { pol_id: $.data.id }
            - call: "POST /patients/${pt_id}/appointments"
              payload: { provider_id: "${prov_id}", treatment_room_id: "${room_id}", visit_type: "ADJUSTMENT", scheduled_start: "2026-03-20T17:00:00Z", duration_minutes: 15, insurance_policy_id: "${pol_id}" }
              as: FrontDesk
              captures: { appt_id: $.data.id }
          trigger:
            - call: "POST /patients/${pt_id}/appointments/${appt_id}/cancel"
              payload: {}
              as: FrontDesk
              captures: { st: $.data.attendance_status }
          assert:
            - "Appointment.${appt_id}.attendance_status == CANCELLED"
            - "InsurancePolicy.${pol_id}.visits_reserved == 0"
            - "InsurancePolicy.${pol_id}.visits_committed == 0"

      - name: ledger_balance_conserved_charge_then_writeoff
        grounds:
          - state_machines.Appointment.CHECKED_IN_to_ATTENDED
          - state_machines.Appointment.POSTED_to_WRITTEN_OFF
          - entities.Patient.fields.ledger_balance_cents
          - entities.LedgerEntry.fields.amount_cents
        distinguishing_aspect: |
          A DIFFERENT conserved quantity = Patient.ledger_balance_cents. Completing posts a CHARGE (+6000) and the write-off
          posts a reversing WRITE_OFF (-6000), leaving ledger_balance_cents back at 0 — no drift. Distinct from the cap-slot
          invariant (counts vs cents).
        test_recipe:
          setup:
            - "CASH patient with one ATTENDED+POSTED ADJUSTMENT (cash_rate 6000) so ledger_balance_cents == 6000 before the write-off."
          setup_api_calls:
            - call: "POST /fee-schedules"
              payload: { visit_type: "ADJUSTMENT", cash_rate_cents: 6000, billed_amount_cents: 9000 }
              as: PracticeAdmin
            - call: "POST /providers"
              payload: { full_name: "Dr Vega", npi: "1234567890", license_state: "CA" }
              as: PracticeAdmin
              captures: { prov_id: $.data.id }
            - call: "POST /treatment-rooms"
              payload: { name: "Adj 1", room_type: "ADJUSTMENT" }
              as: PracticeAdmin
              captures: { room_id: $.data.id }
            - call: "POST /_clock/set"
              payload: { current_utc: "2026-03-02T08:00:00Z" }
              as: PracticeAdmin
            - call: "POST /patients"
              payload: { full_name: "Ledger Lee", date_of_birth: "1980-01-01", payer_mode: "CASH" }
              as: FrontDesk
              captures: { pt_id: $.data.id }
            - call: "POST /patients/${pt_id}/appointments"
              payload: { provider_id: "${prov_id}", treatment_room_id: "${room_id}", visit_type: "ADJUSTMENT", scheduled_start: "2026-03-03T17:00:00Z", duration_minutes: 15 }
              as: FrontDesk
              captures: { appt_id: $.data.id }
            - call: "POST /patients/${pt_id}/appointments/${appt_id}/check-in"
              payload: {}
              as: FrontDesk
            - call: "POST /patients/${pt_id}/appointments/${appt_id}/soap-note"
              payload: { provider_id: "${prov_id}", subjective: "s", objective: "o", assessment: "a", plan: "p" }
              as: Provider
              as_user_id: "${prov_id}"
            - call: "POST /patients/${pt_id}/appointments/${appt_id}/soap-note/sign"
              payload: {}
              as: Provider
              as_user_id: "${prov_id}"
            - call: "POST /patients/${pt_id}/appointments/${appt_id}/complete"
              payload: {}
              as: Provider
              as_user_id: "${prov_id}"
          trigger:
            - call: "POST /patients/${pt_id}/appointments/${appt_id}/write-off"
              payload: {}
              as: BillingClerk
              captures: { bill: $.data.billing_status }
          assert:
            - "Appointment.${appt_id}.billing_status == WRITTEN_OFF"
            - "Patient.${pt_id}.ledger_balance_cents == 0"
