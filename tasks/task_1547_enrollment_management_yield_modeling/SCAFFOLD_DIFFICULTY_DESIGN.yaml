              as: EnrollmentManager
              captures: { p_id: $.data.id }
            - { call: "POST /enrollment/cycles/${c_id}/advance", payload: { to_status: "OPEN" }, as: EnrollmentManager }
            - call: "POST /enrollment/applicants"
              payload: { cycle_id: "${c_id}", full_name: "X Ninety", email: "x90@x.com", applicant_type: "FIRST_YEAR", inquiry_source: "WEB_FORM", distance_band: "LOCAL" }
              as: AdmissionsOfficer
              captures: { ap_x: $.data.id }
            - call: "POST /enrollment/applicants"
              payload: { cycle_id: "${c_id}", full_name: "Y Below", email: "y89@x.com", applicant_type: "FIRST_YEAR", inquiry_source: "WEB_FORM", distance_band: "LOCAL" }
              as: AdmissionsOfficer
              captures: { ap_y: $.data.id }
            - call: "POST /enrollment/applications"
              payload: { applicant_id: "${ap_x}", program_id: "${p_id}", cycle_id: "${c_id}", academic_score: 90.0, efc_cents: 5000000 }
              as: AdmissionsOfficer
              captures: { app_x: $.data.id }
            - call: "POST /enrollment/applications"
              payload: { applicant_id: "${ap_y}", program_id: "${p_id}", cycle_id: "${c_id}", academic_score: 89.99, efc_cents: 5000000 }
              as: AdmissionsOfficer
              captures: { app_y: $.data.id }
            - { call: "POST /enrollment/applications/${app_x}/transition", payload: { to_status: "IN_REVIEW" }, as: AdmissionsOfficer }
            - call: "POST /enrollment/reviews"
              payload: { application_id: "${app_x}", reader_id: "reader-1", window_start_at: "2026-08-01T00:00:00Z", window_end_at: "2027-01-01T00:00:00Z" }
              as: AdmissionsOfficer
              captures: { rx1: $.data.id }
            - { call: "POST /enrollment/reviews/${rx1}/submit", payload: { score_academic: 90, score_fit: 90, recommendation: "ADMIT" }, as: ApplicationReader, as_user_id: "reader-1" }
            - call: "POST /enrollment/reviews"
              payload: { application_id: "${app_x}", reader_id: "reader-2", window_start_at: "2026-08-01T00:00:00Z", window_end_at: "2027-01-01T00:00:00Z" }
              as: AdmissionsOfficer
              captures: { rx2: $.data.id }
            - { call: "POST /enrollment/reviews/${rx2}/submit", payload: { score_academic: 90, score_fit: 90, recommendation: "ADMIT" }, as: ApplicationReader, as_user_id: "reader-2" }
            - { call: "POST /enrollment/applications/${app_x}/transition", payload: { to_status: "DECISION_PENDING" }, as: AdmissionsOfficer }
            - call: "POST /enrollment/applications/${app_x}/transition"
              payload: { to_status: "ADMITTED" }
              as: AdmissionsOfficer
              captures: { app_x_v: $.data.version }
            - { call: "POST /enrollment/applications/${app_y}/transition", payload: { to_status: "IN_REVIEW" }, as: AdmissionsOfficer }
            - call: "POST /enrollment/reviews"
              payload: { application_id: "${app_y}", reader_id: "reader-1", window_start_at: "2026-08-01T00:00:00Z", window_end_at: "2027-01-01T00:00:00Z" }
              as: AdmissionsOfficer
              captures: { ry1: $.data.id }
            - { call: "POST /enrollment/reviews/${ry1}/submit", payload: { score_academic: 89, score_fit: 89, recommendation: "ADMIT" }, as: ApplicationReader, as_user_id: "reader-1" }
            - call: "POST /enrollment/reviews"
              payload: { application_id: "${app_y}", reader_id: "reader-2", window_start_at: "2026-08-01T00:00:00Z", window_end_at: "2027-01-01T00:00:00Z" }
              as: AdmissionsOfficer
              captures: { ry2: $.data.id }
            - { call: "POST /enrollment/reviews/${ry2}/submit", payload: { score_academic: 89, score_fit: 89, recommendation: "ADMIT" }, as: ApplicationReader, as_user_id: "reader-2" }
            - { call: "POST /enrollment/applications/${app_y}/transition", payload: { to_status: "DECISION_PENDING" }, as: AdmissionsOfficer }
            - call: "POST /enrollment/applications/${app_y}/transition"
