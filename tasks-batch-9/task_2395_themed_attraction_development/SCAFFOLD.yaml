    applies_to: "POST /design-packages/{id}/approve, POST /budget-ledger-entries"
  # Catch-all for the design_phase entry preconditions that carry no dedicated
  # error of their own. Deliberately LAST so that every specific gate above
  # (priority 15 review clearance, 29 scene readiness, 30 show quality,
  # 33 accessible route, 34 accessible share, 37 capacity target) still owns its
  # own transition and stays reachable; this rule only covers the residue.
  - priority: 49
    category: state
    check: "The content preconditions of the requested design_phase entry are met: BLUE_SKY -> CONCEPT needs at least one ShowScene of the project; CONCEPT -> SCHEMATIC needs selected_ride_system_id not null and at least two ShowScene rows with status IN {SEQUENCED, PROGRAMMED, VALIDATED}; SCHEMATIC -> DESIGN_DEVELOPMENT needs at least one DesignPackage with status IN {SUBMITTED, APPROVED}; DESIGN_DEVELOPMENT -> PRODUCTION needs at least one DesignPackage with status APPROVED"
    error_id: ERR_PHASE_PRECONDITION_UNMET
    http_status: 409
    applies_to: "POST /attraction-projects/{id}/advance-phase"

endpoints:
  # ---------------------------------------------------------------- test clock
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Sets the server's logical clock. Before the first call the logical clock reads exactly 2026-08-01T00:00:00Z and MUST NOT fall back to real wall-clock time; every deadline, rehearsal window and handover timestamp is evaluated against this logical clock."
    roles: [ProgramAdmin]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["logical clock repositioned to to_iso8601"]

  # ------------------------------------------------------- AttractionProject
  - method: POST
    path: "/attraction-projects"
    description: "Opens a new themed attraction program"
    roles: [OwnerRep]
    code: 201
    input: [project_code, name, design_day_attendance, peak_hour_share, budget_ceiling_cents, "virtual_queue_share_pct?"]
    output: AttractionProject
    side_effects:
      - "computes required_hourly_capacity_guests via calculations.project_required_hourly_capacity"
      - "design_phase := BLUE_SKY, readiness_posture := OPEN, committed_cost_cents := 0, ledger_sequence_high_water := 0"
  - method: GET
    path: "/attraction-projects/{id}"
    description: "Reads one attraction program"
    roles: [OwnerRep, CreativeDirector, RideEngineer, ShowProgrammer, ThirdPartyReviewer, ContractorPM, ProgramAdmin]
    code: 200
    input: []
    output: AttractionProject
    side_effects: []
  - method: GET
    path: "/attraction-projects"
    description: "Lists attraction programs with pagination and optional phase/posture filters"
    roles: [OwnerRep, CreativeDirector, RideEngineer, ShowProgrammer, ThirdPartyReviewer, ContractorPM, ProgramAdmin]
    code: 200
    input: ["limit?", "offset?", "design_phase?", "readiness_posture?"]
    output: AttractionProject[]
    side_effects: []
  - method: PATCH
    path: "/attraction-projects/{id}"
    description: "Owner adjustment of capacity assumptions, virtual-queue share and the cost ceiling; the only write that remains available while the program is FROZEN, so a ceiling raise can lift a budget freeze"
    roles: [OwnerRep]
    code: 200
    input: [expected_project_version, "budget_ceiling_cents?", "virtual_queue_share_pct?", "design_day_attendance?", "peak_hour_share?"]
    output: AttractionProject
    side_effects:
      - "recomputes required_hourly_capacity_guests when design_day_attendance or peak_hour_share changes"
      - "recomputes committed_cost_cents / forecast_cost_cents and readiness_posture via calculations.project_budget_position and calculations.project_readiness_posture"
      - "may cascade ShowScene freeze or release when readiness_posture crosses FROZEN"
      - "increments AttractionProject.version by 1"
  - method: POST
    path: "/attraction-projects/{id}/advance-phase"
    description: "Advances design_phase one rung along the delivery ladder"
    roles: [OwnerRep]
    code: 200
    input: [to_phase, expected_project_version]
    output: AttractionProject
    side_effects:
      - "design_phase := to_phase"
      - "handover_accepted_at := current logical clock instant when to_phase == OPERATIONS_HANDOVER"
      - "increments AttractionProject.version by 1"
  - method: GET
    path: "/attraction-projects/{id}/capacity-summary"
    description: "Derived capacity read: both ride-capacity variants, queue totals, virtual-queue allocation, accessible share, posted wait and show quality"
    roles: [OwnerRep, CreativeDirector, RideEngineer, ShowProgrammer, ContractorPM, ProgramAdmin]
    code: 200
    input: []
    output: { required_hourly_capacity_guests: integer, selected_ride_system_id: string, theoretical_hourly_capacity_guests: integer, operational_hourly_capacity_guests: integer, queue_capacity_total_guests: integer, accessible_capacity_guests: integer, accessible_share_pct: number, virtual_queue_allocation_guests: integer, posted_wait_minutes: number, show_quality_score: number }
    side_effects: ["recomputes calculations.project_queue_position and calculations.project_show_quality_score for the response (no persisted change)"]
  - method: GET
    path: "/attraction-projects/{id}/budget-position"
    description: "Derived budget read: both budget variants side by side plus headroom, posture and adopted value-engineering savings"
    roles: [OwnerRep, ContractorPM, CreativeDirector, ProgramAdmin]
    code: 200
    input: []
    output: { committed_cost_cents: integer, forecast_cost_cents: integer, budget_ceiling_cents: integer, headroom_cents: integer, restricted_utilisation_cents: integer, readiness_posture: string, ve_program_net_savings_cents: integer }
    side_effects: ["recomputes calculations.project_budget_position and calculations.ve_item_net_saving program roll-up for the response (no persisted change)"]
  - method: GET
    path: "/attraction-projects/{id}/ride-systems"
    description: "Reverse lookup: candidate and selected ride systems of the program"
    roles: [OwnerRep, RideEngineer, CreativeDirector, ContractorPM, ProgramAdmin]
    code: 200
    input: ["limit?", "offset?", "status?"]
    output: RideSystem[]
    side_effects: []
  - method: GET
    path: "/attraction-projects/{id}/queue-segments"
    description: "Reverse lookup: queue segments of the program"
    roles: [OwnerRep, CreativeDirector, ContractorPM, ProgramAdmin]
    code: 200
    input: ["limit?", "offset?", "status?"]
    output: QueueSegment[]
    side_effects: []
  - method: GET
    path: "/attraction-projects/{id}/value-engineering-items"
    description: "Reverse lookup: value-engineering items of the program"
    roles: [OwnerRep, ContractorPM, CreativeDirector, ProgramAdmin]
    code: 200
    input: ["limit?", "offset?", "status?"]
    output: ValueEngineeringItem[]
    side_effects: []
  - method: GET
    path: "/attraction-projects/{id}/rehearsal-runs"
    description: "Reverse lookup: rehearsal and soft-open runs of the program"
    roles: [OwnerRep, ContractorPM, ShowProgrammer, ProgramAdmin]
    code: 200
    input: ["limit?", "offset?", "run_kind?"]
    output: RehearsalRun[]
    side_effects: []
  - method: GET
    path: "/attraction-projects/{id}/budget-ledger-entries"
    description: "Reverse lookup: the program cost ledger in chronological order (created_at ASC, then sequence_no ASC)"
    roles: [OwnerRep, ContractorPM, ProgramAdmin]
    code: 200
    input: ["limit?", "offset?", "entry_kind?"]
    output: BudgetLedgerEntry[]
    side_effects: []
  - method: GET
    path: "/attraction-projects/{id}/maintenance-items"
    description: "Reverse lookup: maintenance procedures and spare parts of the program"
    roles: [OwnerRep, RideEngineer, ContractorPM, ProgramAdmin]
    code: 200
    input: ["limit?", "offset?", "status?"]
    output: MaintenanceItem[]
    side_effects: []

  # ------------------------------------------------------------- RideSystem
  - method: POST
    path: "/ride-systems"
    description: "Registers a candidate ride system offer and computes both capacity variants"
    roles: [RideEngineer]
    code: 201
    input: [project_id, vendor_name, system_type, vehicle_count, riders_per_vehicle, block_zone_count, cycle_time_seconds, availability_pct, load_efficiency_pct, show_stops_per_hour]
    output: RideSystem
    side_effects:
      - "computes dispatch_interval_seconds, theoretical_hourly_capacity_guests and operational_hourly_capacity_guests via calculations.ride_system_hourly_capacity"
      - "status := CANDIDATE"
  - method: GET
    path: "/ride-systems/{id}"
    description: "Reads one ride system with both capacity variants"
    roles: [OwnerRep, RideEngineer, CreativeDirector, ContractorPM, ProgramAdmin]
    code: 200
    input: []
    output: RideSystem
    side_effects: []
  - method: PATCH
    path: "/ride-systems/{id}"
    description: "Revises ride-system engineering parameters and recomputes both capacity variants"
    roles: [RideEngineer]
    code: 200
    input: [expected_ride_system_version, "vehicle_count?", "riders_per_vehicle?", "block_zone_count?", "cycle_time_seconds?", "availability_pct?", "load_efficiency_pct?", "show_stops_per_hour?"]
    output: RideSystem
    side_effects:
      - "recomputes dispatch_interval_seconds and both capacity variants via calculations.ride_system_hourly_capacity"
      - "increments RideSystem.version by 1, which invalidates any DesignPackage.pinned_ride_system_version captured earlier"
  - method: POST
    path: "/ride-systems/{id}/select"
    description: "Owner selects this candidate as the program's ride system"
    roles: [OwnerRep]
    code: 200
    input: [expected_project_version]
    output: RideSystem
    side_effects:
      - "status := SELECTED"
      - "any other RideSystem of the project with status SELECTED cascades back to CANDIDATE"
      - "AttractionProject.selected_ride_system_id := this id"
      - "increments AttractionProject.version by 1"
  - method: POST
    path: "/ride-systems/{id}/mark-engineered"
    description: "Records ride vehicle and control-system engineering completion against a safety standard"
    roles: [RideEngineer]
    code: 200
    input: [safety_standard, control_system_spec_ref]
    output: RideSystem
    side_effects: ["safety_standard and control_system_spec_ref recorded", "status := ENGINEERED", "increments RideSystem.version by 1"]
  - method: POST
    path: "/ride-systems/{id}/commission"
    description: "Commissions the ride system once third-party review of the approved package is cleared"
    roles: [RideEngineer]
    code: 200
    input: []
    output: RideSystem
    side_effects: ["status := COMMISSIONED", "increments RideSystem.version by 1"]

  # ------------------------------------------------------------ QueueSegment
  - method: POST
    path: "/queue-segments"
    description: "Proposes a queue segment and computes its guest capacity from the routing class"
    roles: [CreativeDirector]
    code: 201
    input: [project_id, segment_label, length_meters, width_meters, routing_type, position_index]
    output: QueueSegment
    side_effects: ["computes capacity_guests via calculations.queue_segment_capacity", "status := PROPOSED"]
  - method: GET
    path: "/queue-segments/{id}"
    description: "Reads one queue segment"
    roles: [OwnerRep, CreativeDirector, ContractorPM, ProgramAdmin]
    code: 200
    input: []
    output: QueueSegment
    side_effects: []
  - method: POST
    path: "/queue-segments/{id}/accept"
    description: "Accepts the segment into the queue and adds its capacity to the program total"
    roles: [OwnerRep]
    code: 200
    input: [expected_project_version]
    output: QueueSegment
    side_effects:
      - "status := ACCEPTED"
      - "AttractionProject.queue_capacity_total_guests increased by capacity_guests"
      - "increments AttractionProject.version by 1"
  - method: POST
    path: "/queue-segments/{id}/retire"
    description: "Retires an accepted segment, the compensating action for accept"
    roles: [OwnerRep]
    code: 200
    input: [expected_project_version]
    output: QueueSegment
    side_effects:
      - "status := RETIRED"
      - "AttractionProject.queue_capacity_total_guests decreased by capacity_guests"
      - "increments AttractionProject.version by 1"

  # -------------------------------------------------------------- ShowScene
  - method: POST
