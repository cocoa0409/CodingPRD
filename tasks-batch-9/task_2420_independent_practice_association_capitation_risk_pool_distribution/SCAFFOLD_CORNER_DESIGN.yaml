              as: ClaimsExaminer
              captures: { clm_e3b: "$.data.id" }
            - call: "POST /ipa/downstream-claims/${clm_e3b}/state"
              payload: { to_state: "ADJUDICATED_APPROVED", allowed_cents: 3000 }
              as: ClaimsExaminer
            - call: "POST /ipa/downstream-claims/${clm_e3b}/state"
              payload: { to_state: "PAID" }
