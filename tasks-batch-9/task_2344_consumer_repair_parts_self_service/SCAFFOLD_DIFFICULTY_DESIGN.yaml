          assert:
            - "response trailing_units == 0 and pipeline_units == 0"
            - "response base_monthly_units == 0.0"
            - "response obsolescence_band == CURRENT and band_multiplier == 1.00"
            - "response projected_units == 0.0"
            - "response safety_stock_pct == 0.30"
            - "response mandated_buffer_units == 0"
            - "${rec_zero} == 0"
            - "HTTP status == 200 (an empty aggregate is not an error)"

