scenario: 'desgin task harder than expert level.!!!!2153. Residence Life & RA Staffing (university residence life office): RA recruitment/selection & training certification, duty rotation & on-call coverage, incident report & policy violation routing to conduct, room-condition inspection & damage billing, roommate conflict mediation & room change process, programming requirement & budget per floor, occupancy census & consolidation, break housing & emergency closure'
domain_name: residence-life-ra-staffing
api_prefix: "/residence-life"

complexity_profile:
  primary_archetype: workflow_orchestration
  secondary_archetype: quota_allocation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - selector_policy
  entity_topology: graph
  state_machine_shape: parallel
  relationship_patterns:
    - one_to_many
    - many_to_many
    - self_referential
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate
  difficulty_level: expert_plus
  notes: |
    Fourteen entities forming a graph: Student <-> Room <-> Floor <-> Building on the
    housing axis, RAApplication -> RA -> DutyShift on the staffing axis, and four
    cross-aggregate case types (IncidentReport/ConductCase, RoomInspection/DamageCharge,
    RoomChangeCase, BreakHousingRequest) that bind the two axes together. RA carries two
    independent state dimensions (employment_status x certification_status) and
    RoomChangeCase carries two more (mediation_status x placement_status); both dimension
    pairs gate operations on OTHER entities, so the hard part is reasoning about which
    dimension a given precondition reads.

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# ---------------------------------------------------------------------------
# 1.1 Entity-Relationship Table
# ---------------------------------------------------------------------------
entities:

  - name: Building
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: Residence hall display name.
      - name: code
        type: string
        source: input
        description: Short hall code, unique across all Buildings.
        constraints: "uppercase alphanumeric, 2-8 chars; unique"
      - name: campus_zone
        type: enum
        source: input
        description: Campus zone the hall sits in.
        constraints: "NORTH | SOUTH | WEST"
      - name: break_housing_enabled
        type: boolean
        source: input
        default: false
        description: Whether this hall accepts BreakHousingRequest rows at all.
      - name: posture
        type: enum
        source: computed
        default: OPEN
        description: Operational posture gating every child operation in the hall.
        constraints: "OPEN | RESTRICTED | EMERGENCY_CLOSED"
      - name: closure_reason
        type: string
        source: system
        default: null
        description: Free text stamped by the most recent posture change; null while posture is OPEN.
      - name: last_posture_change_at
        type: datetime
        source: system
        default: null
        description: Logical-clock instant of the most recent posture change.
      - name: bed_capacity
        type: integer
        source: computed
        default: 0
        description: "Sum of Room.bed_capacity over every Room whose Floor.building_id equals this Building.id, regardless of Room.status."
      - name: assigned_bed_count
        type: integer
        source: computed
        default: 0
        description: "Count of Student rows whose current_room_id points at a Room in this Building. Conserved quantity for the placement-revert invariant."

  - name: Floor
    parent: Building
    common_fields: true
    fields:
      - name: building_id
        type: string
        source: input
        description: "FK -> Building.id; the hall this floor belongs to."
      - name: floor_number
        type: integer
        source: input
        description: Floor ordinal within the hall.
        constraints: "1..30; unique per building_id"
      - name: required_programs_per_term
        type: integer
        source: input
        default: 4
        description: Programs the floor must hold in a term to be COMPLIANT.
        constraints: "1..12"
      - name: programming_budget_cents
        type: integer
        source: computed
        default: 0
        description: Total programming budget allocated to this floor for the term.
      - name: programming_encumbered_cents
        type: integer
        source: computed
        default: 0
        description: Cents locked by ProgramEvent rows in status APPROVED.
      - name: programming_spent_cents
        type: integer
        source: computed
        default: 0
        description: Cents disbursed by ProgramEvent rows in status REIMBURSED.
      - name: programming_available_cents
        type: integer
        source: computed
        default: 0
        description: "programming_budget_cents - programming_encumbered_cents - programming_spent_cents. The three-bucket partition invariant."
      - name: programming_frozen
        type: boolean
        source: computed
        default: false
        description: True while the parent Building.posture is EMERGENCY_CLOSED; blocks ProgramEvent approval.
      - name: held_program_count
        type: integer
        source: computed
        default: 0
        description: "Count of ProgramEvent on this floor with status IN {HELD, REIMBURSED}."
      - name: programming_compliance_status
        type: enum
        source: computed
        default: PENDING
        description: Term programming compliance derived by calculation floor_programming_compliance.
        constraints: "PENDING | COMPLIANT | DEFICIENT"
      - name: uncovered_shift_count
        type: integer
        source: computed
        default: 0
        description: "Count of DutyShift on this floor with status == OPEN and start_at >= logical clock now."
      - name: coverage_status
        type: enum
        source: computed
        default: NORMAL
        description: "CRITICAL when uncovered_shift_count >= COVERAGE_ALERT_THRESHOLD, else NORMAL."
        constraints: "NORMAL | CRITICAL"
      - name: bed_capacity
        type: integer
        source: computed
        default: 0
        description: Sum of Room.bed_capacity over Rooms on this floor.
      - name: occupied_beds
        type: integer
        source: computed
        default: 0
        description: Sum of Room.occupied_beds over Rooms on this floor.

  - name: Room
    parent: Floor
    common_fields: true
    fields:
      - name: floor_id
        type: string
        source: input
        description: "FK -> Floor.id; the floor this room sits on."
      - name: room_number
        type: string
        source: input
        description: Room label, unique per floor_id.
        constraints: "unique per floor_id"
      - name: bed_capacity
        type: integer
        source: input
        description: Number of beds physically in the room.
        constraints: "1..4"
      - name: last_renovation_year
        type: integer
        source: input
        description: Calendar year of the last renovation; drives damage depreciation.
        constraints: "1950..2100"
      - name: occupied_beds
        type: integer
        source: computed
        default: 0
        description: Count of Student rows whose current_room_id equals this Room.id.
      - name: status
        type: enum
        source: computed
        default: AVAILABLE
        description: Room lifecycle status.
        constraints: "AVAILABLE | OCCUPIED | OFFLINE | CONSOLIDATED"
      - name: pre_closure_status
        type: enum
        source: system
        default: null
        description: Status held immediately before an emergency-closure cascade forced OFFLINE; replayed on hall reopen.
        constraints: "AVAILABLE | OCCUPIED | null"
      - name: condition_score
        type: integer
        source: computed
        default: 100
        description: condition_score of the most recent RoomInspection with status COMPLETED, ordered by completed_at DESC then created_at DESC; 100 when none.
        constraints: "0..100"
      - name: break_hold_count
        type: integer
        source: computed
        default: 0
        description: "Count of BreakHousingRequest for this room with status IN {APPROVED, CHECKED_IN}."

  - name: Student
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: Resident name.
      - name: email
        type: string
        source: input
        description: Campus email, unique across Students.
        constraints: "unique"
      - name: class_year
        type: enum
        source: input
        description: Academic standing.
        constraints: "FIRST_YEAR | SOPHOMORE | JUNIOR | SENIOR"
      - name: financial_hardship_flag
        type: boolean
        source: input
        default: false
        description: Bursar-verified hardship flag; enables the damage hardship relief branch.
      - name: current_room_id
        type: string
        source: computed
        default: null
        description: "FK -> Room.id; the room the student currently occupies, null when unassigned."
      - name: housing_status
        type: enum
        source: computed
        default: UNASSIGNED
        description: Placement dimension of the student record.
        constraints: "UNASSIGNED | ASSIGNED | RELOCATION_PENDING"
      - name: conduct_standing
        type: enum
        source: computed
        default: GOOD
        description: Conduct dimension of the student record, derived from conduct_points.
        constraints: "GOOD | PROBATION | SUSPENDED"
      - name: conduct_points
        type: integer
        source: computed
        default: 0
        description: Running sum of ConductCase.sanction_points over the student's SANCTIONED cases.
      - name: judicial_hold
        type: boolean
        source: computed
        default: false
        description: True while at least one ConductCase for this student is in status OPEN or HEARING_SCHEDULED.
      - name: break_housing_eligible
        type: boolean
        source: computed
        default: true
        description: Set false when conduct_standing becomes PROBATION or SUSPENDED; blocks break-housing approval.
      - name: damage_balance_cents
        type: integer
        source: computed
        default: 0
        description: "Sum of DamageCharge.final_amount_cents for this student over charges with status IN {BILLED, APPEALED}."

  - name: RAApplication
    parent: null
    common_fields: true
    fields:
      - name: applicant_student_id
        type: string
        source: input
        description: "FK -> Student.id; the student applying for an RA position."
      - name: term_code
        type: string
        source: input
        description: Hiring term, e.g. 2026FA.
        constraints: "matches ^[0-9]{4}(FA|SP|SU)$; unique per applicant_student_id"
      - name: essay_ref
        type: string
        source: input
        description: Reference handle for the applicant essay packet.
      - name: status
        type: enum
        source: computed
        default: DRAFT
        description: Application lifecycle state (cyclic through REVISION_REQUESTED).
        constraints: "DRAFT | SUBMITTED | UNDER_REVIEW | REVISION_REQUESTED | OFFERED | ACCEPTED | DECLINED | REJECTED"
      - name: interview_score
        type: number
        source: computed
        default: null
        description: Score recorded by the reviewing director on the most recent review.
        constraints: "0..100, one decimal place"
      - name: revision_count
        type: integer
        source: computed
        default: 0
        description: Number of REQUEST_REVISION decisions issued so far; capped by MAX_REVISION_ROUNDS.
      - name: revision_notes
        type: string
        source: computed
        default: null
        description: Notes from the most recent REQUEST_REVISION decision.
      - name: reviewed_by_user_id
        type: string
        source: computed
        default: null
        description: X-User-ID of the ResidenceDirector who issued the most recent review.
      - name: submitted_at
        type: datetime
        source: computed
        default: null
        description: Logical-clock instant of the most recent submit.
      - name: created_ra_id
        type: string
        source: computed
        default: null
        description: "FK -> RA.id; the RA row synthesized when the applicant ACCEPTs an offer, null otherwise."

  - name: RA
    parent: null
    common_fields: true
    fields:
      - name: student_id
        type: string
        source: computed
        description: "FK -> Student.id; the person holding the RA position."
      - name: application_id
        type: string
        source: computed
        description: "FK -> RAApplication.id; the accepted application that produced this RA."
      - name: assigned_floor_id
        type: string
        source: computed
        default: null
        description: "FK -> Floor.id; the floor this RA staffs, null until floor assignment."
      - name: employment_status
        type: enum
        source: computed
        default: PROVISIONAL
        description: Employment dimension; evolves independently of certification_status.
        constraints: "PROVISIONAL | ACTIVE | SUSPENDED | SEPARATED"
      - name: certification_status
        type: enum
        source: computed
        default: UNCERTIFIED
        description: Training dimension; evolves independently of employment_status.
        constraints: "UNCERTIFIED | IN_TRAINING | CERTIFIED | LAPSED"
      - name: training_credits_earned
        type: integer
        source: computed
        default: 0
        description: Sum of MODULE_CREDITS over completed_module_codes.
      - name: completed_module_codes
        type: array
        source: computed
        default: []
        description: "Distinct module codes logged for this RA; members of {CRISIS, TITLE_IX, FIRE_SAFETY, MEDIATION, DIVERSITY, PROGRAMMING}."
      - name: certified_at
        type: datetime
        source: computed
        default: null
        description: Logical-clock instant of the most recent CERTIFY action.
      - name: duty_points_balance
        type: integer
        source: computed
        default: 0
        description: "Sum of DutyShift.points_value over this RA's shifts with status == COMPLETED."
      - name: missed_shift_count
        type: integer
        source: computed
        default: 0
        description: "Count of this RA's shifts with status == MISSED."
      - name: separation_reason
        type: string
        source: computed
        default: null
        description: Reason text stamped by the SEPARATE employment action.

  - name: DutyShift
    parent: null
    common_fields: true
    fields:
      - name: floor_id
        type: string
        source: input
        description: "FK -> Floor.id; the floor covered by this on-call block."
      - name: shift_type
        type: enum
        source: input
        description: Rotation slot class; fixes points_value.
        constraints: "WEEKDAY | WEEKEND | BREAK"
      - name: start_at
        type: datetime
        source: input
        description: Inclusive start of the half-open coverage interval.
      - name: end_at
        type: datetime
        source: input
        description: Exclusive end of the half-open coverage interval.
        constraints: "end_at > start_at; duration <= 24h"
      - name: assigned_ra_id
        type: string
        source: computed
        default: null
        description: "FK -> RA.id; the RA currently holding the shift, null while OPEN."
      - name: swap_requested_ra_id
        type: string
        source: computed
        default: null
        description: "FK -> RA.id; the proposed replacement while status is SWAP_PENDING."
      - name: status
        type: enum
        source: computed
        default: OPEN
        description: Shift lifecycle with a swap cycle back to ASSIGNED.
        constraints: "OPEN | ASSIGNED | SWAP_PENDING | CHECKED_IN | COMPLETED | MISSED | VOID"
      - name: points_value
        type: integer
        source: computed
        description: "DUTY_POINTS[shift_type]; 1 for WEEKDAY, 3 for WEEKEND, 5 for BREAK."
      - name: checked_in_at
        type: datetime
        source: computed
        default: null
        description: Logical-clock instant of CHECK_IN.
      - name: completed_at
        type: datetime
        source: computed
        default: null
        description: Logical-clock instant of COMPLETE.
      - name: filled_by_selector
        type: boolean
        source: computed
        default: false
        description: True when assigned_ra_id was picked by the emergency_shift_assignee_selection policy rather than named explicitly.

  - name: IncidentReport
    parent: null
    common_fields: true
    fields:
      - name: filed_by_ra_id
        type: string
        source: computed
        description: "FK -> RA.id; the RA who filed the report (taken from X-User-ID)."
      - name: room_id
        type: string
        source: input
        description: "FK -> Room.id; where the incident occurred."
      - name: subject_student_id
        type: string
        source: input
        description: "FK -> Student.id; the resident the report is about."
      - name: occurred_at
        type: datetime
        source: input
        description: When the incident happened.
      - name: severity
        type: enum
        source: input
        description: Reporter-assessed severity; drives conduct sanction base points.
        constraints: "MINOR | MODERATE | SEVERE"
      - name: policy_code
        type: enum
        source: input
        description: Policy section allegedly violated.
        constraints: "ALCOHOL | NOISE | GUEST | DAMAGE | SAFETY"
      - name: narrative
        type: string
        source: input
        description: Free-text account.
        constraints: "min length 10 at submit time"
      - name: status
        type: enum
        source: computed
        default: DRAFT
        description: Report lifecycle; branches at triage and cycles through RETURNED_FOR_DETAIL.
        constraints: "DRAFT | SUBMITTED | RETURNED_FOR_DETAIL | ROUTED_TO_CONDUCT | CLOSED_NO_ACTION | CLOSED_ADJUDICATED"
      - name: return_count
        type: integer
        source: computed
        default: 0
        description: Number of RETURN triage dispositions issued; capped by MAX_RETURN_ROUNDS.
      - name: submitted_at
        type: datetime
        source: computed
        default: null
        description: Logical-clock instant of the most recent submit.
      - name: routed_by_user_id
        type: string
        source: computed
        default: null
        description: X-User-ID of the ResidenceDirector who routed the report to conduct.
      - name: conduct_case_id
        type: string
        source: computed
        default: null
        description: "FK -> ConductCase.id; the case synthesized by the ROUTE disposition, null otherwise."

  - name: ConductCase
    parent: null
    common_fields: true
    fields:
      - name: incident_report_id
        type: string
        source: computed
        description: "FK -> IncidentReport.id; the routed report that opened this case."
      - name: respondent_student_id
        type: string
        source: computed
        description: "FK -> Student.id; copied from IncidentReport.subject_student_id at routing."
      - name: severity
        type: enum
        source: computed
        description: Copied from IncidentReport.severity at routing.
        constraints: "MINOR | MODERATE | SEVERE"
      - name: status
        type: enum
        source: computed
        default: OPEN
        description: Adjudication lifecycle.
        constraints: "OPEN | HEARING_SCHEDULED | SANCTIONED | DISMISSED"
      - name: opened_at
        type: datetime
        source: computed
        description: Logical-clock instant the case was opened by routing.
      - name: hearing_at
        type: datetime
        source: computed
        default: null
        description: Scheduled hearing instant; must fall within HEARING_WINDOW_DAYS of opened_at.
      - name: scheduled_by_user_id
        type: string
        source: computed
        default: null
        description: X-User-ID of the ConductOfficer who scheduled the hearing.
      - name: decided_by_user_id
        type: string
        source: computed
        default: null
        description: X-User-ID of the ConductOfficer who decided the case; must differ from scheduled_by_user_id.
      - name: prior_sanctioned_count
        type: integer
        source: computed
        default: 0
        description: "Count of OTHER ConductCase rows for the same respondent_student_id with status == SANCTIONED, evaluated at decision time."
      - name: sanction_points
        type: integer
        source: computed
        default: null
        description: Points applied on SANCTION, from calculation conduct_sanction_points; null until decided.
      - name: outcome
        type: enum
        source: computed
        default: null
        description: Decision outcome.
        constraints: "SANCTION | DISMISS | null"

  - name: RoomInspection
    parent: null
    common_fields: true
    fields:
      - name: room_id
        type: string
        source: input
        description: "FK -> Room.id; the room being inspected."
      - name: inspector_ra_id
        type: string
        source: computed
        description: "FK -> RA.id; the inspecting RA (taken from X-User-ID)."
      - name: inspection_type
        type: enum
        source: input
        description: Inspection class.
        constraints: "CHECK_IN | CHECK_OUT | HEALTH_SAFETY"
      - name: scheduled_for
        type: datetime
        source: input
        description: Planned inspection instant.
      - name: status
        type: enum
        source: computed
        default: SCHEDULED
        description: Inspection lifecycle. SUPERSEDED is written by the create-with-supersede path.
        constraints: "SCHEDULED | COMPLETED | SUPERSEDED | CANCELLED"
      - name: condition_score
        type: integer
        source: computed
        default: null
        description: Score recorded at completion; copied onto Room.condition_score.
        constraints: "0..100"
      - name: damage_lines
        type: array
        source: computed
        default: []
        description: "Array of { component_code, quantity } recorded at completion; component_code IN {WALL, DOOR, CARPET, FURNITURE, WINDOW}, quantity 1..10."
      - name: responsible_student_id
        type: string
        source: computed
        default: null
        description: "FK -> Student.id; the resident the damage is billed to; defaults to the room's sole occupant when omitted."
      - name: damage_charge_id
        type: string
        source: computed
        default: null
        description: "FK -> DamageCharge.id; the charge synthesized at completion when damage_lines is non-empty, null otherwise."
      - name: completed_at
        type: datetime
        source: computed
        default: null
        description: Logical-clock instant of completion.

  - name: DamageCharge
    parent: null
    common_fields: true
    fields:
      - name: inspection_id
        type: string
        source: computed
        description: "FK -> RoomInspection.id; the completed inspection that produced this charge."
      - name: student_id
        type: string
        source: computed
        description: "FK -> Student.id; the billed resident."
      - name: provisional_subtotal_cents
        type: integer
        source: computed
        description: PROVISIONAL_LIST variant of damage_line_assessment, stamped at inspection completion.
      - name: assessed_subtotal_cents
        type: integer
        source: computed
        default: null
        description: FINAL_DEPRECIATED variant of damage_line_assessment, stamped at billing; null while PENDING.
      - name: depreciation_rate
        type: number
        source: computed
        default: null
        description: Rate used by the FINAL_DEPRECIATED variant, from the room's age at billing time.
      - name: admin_fee_cents
        type: integer
        source: computed
        default: null
        description: Tiered administrative fee from calculation damage_charge_settlement.
      - name: hardship_relief_cents
        type: integer
        source: computed
        default: null
        description: Hardship relief credit from calculation damage_charge_settlement.
      - name: final_amount_cents
        type: integer
        source: computed
        default: null
        description: Amount owed after admin fee and hardship relief; the quantity summed into Student.damage_balance_cents.
      - name: status
        type: enum
        source: computed
        default: PENDING
        description: Billing lifecycle with an appeal cycle back to BILLED.
        constraints: "PENDING | BILLED | APPEALED | SETTLED | WAIVED | VOID"
      - name: billed_at
        type: datetime
        source: computed
        default: null
        description: Logical-clock instant of the most recent billing or appeal resolution.
      - name: appeal_deadline_at
        type: datetime
        source: computed
        default: null
        description: "billed_at + APPEAL_WINDOW_DAYS; appeals strictly after this instant are refused."
      - name: appeal_reason
        type: string
        source: computed
        default: null
        description: Reason text supplied by the appealing student.
      - name: appeal_outcome
        type: enum
        source: computed
        default: null
        description: Result of the single permitted appeal resolution.
        constraints: "ADJUSTED | UPHELD | null"

  - name: RoomChangeCase
    parent: null
    common_fields: true
    fields:
      - name: student_id
        type: string
        source: input
        description: "FK -> Student.id; the resident who would move."
      - name: roommate_student_id
        type: string
        source: input
        default: null
        description: "FK -> Student.id; the other party in a roommate conflict; null for SELF_REQUEST and EMERGENCY_RELOCATION."
      - name: from_room_id
        type: string
        source: input
        description: "FK -> Room.id; the room the student currently occupies."
      - name: to_room_id
        type: string
        source: computed
        default: null
        description: "FK -> Room.id; the target room, set by placement-request."
      - name: origin
        type: enum
        source: input
        description: Why the case exists; ROOMMATE_CONFLICT forces the mediation dimension to start at INTAKE.
        constraints: "SELF_REQUEST | ROOMMATE_CONFLICT | EMERGENCY_RELOCATION"
      - name: mediation_status
        type: enum
        source: computed
        default: NOT_REQUIRED
        description: Mediation dimension; cycles SESSION_SCHEDULED -> IMPASSE -> SESSION_SCHEDULED up to MAX_MEDIATION_ROUNDS.
        constraints: "NOT_REQUIRED | INTAKE | SESSION_SCHEDULED | AGREEMENT_REACHED | IMPASSE"
      - name: placement_status
        type: enum
        source: computed
        default: NONE
        description: Placement dimension; evolves independently of mediation_status.
        constraints: "NONE | REQUESTED | APPROVED | COMPLETED | DENIED | CANCELLED | REVERTED"
      - name: mediation_round
        type: integer
        source: computed
        default: 0
        description: Number of sessions recorded so far.
      - name: session_at
        type: datetime
        source: computed
        default: null
        description: Instant of the scheduled or most recently recorded session.
      - name: opened_by_user_id
        type: string
        source: computed
        description: X-User-ID of the actor who created the case, or the literal "system" for the emergency-relocation cascade.
      - name: superseded_case_id
        type: string
        source: computed
        default: null
        description: "FK -> RoomChangeCase.id; the prior REQUESTED case this one superseded, null when none."
      - name: reverted_from_room_id
        type: string
        source: computed
        default: null
        description: "FK -> Room.id; room recorded at placement completion so a revert can restore it exactly."

  - name: ProgramEvent
    parent: null
    common_fields: true
    fields:
      - name: floor_id
        type: string
        source: input
        description: "FK -> Floor.id; the floor whose programming requirement and budget this event draws on."
      - name: organizer_ra_id
        type: string
        source: computed
        description: "FK -> RA.id; the proposing RA (taken from X-User-ID)."
      - name: title
        type: string
        source: input
        description: Program title.
      - name: category
        type: enum
        source: input
        description: Programming category; the compliance mix requires at least one EDUCATIONAL and one WELLNESS.
        constraints: "SOCIAL | EDUCATIONAL | WELLNESS"
      - name: scheduled_for
        type: datetime
        source: input
        description: Planned program instant.
      - name: requested_amount_cents
        type: integer
        source: input
        description: Budget the RA asks the floor to encumber.
        constraints: "0..500000"
      - name: status
        type: enum
        source: computed
        default: PROPOSED
        description: Program lifecycle.
        constraints: "PROPOSED | APPROVED | HELD | REIMBURSED | DENIED | CANCELLED"
      - name: encumbered_amount_cents
        type: integer
        source: computed
        default: 0
        description: Cents currently locked on the floor by this event; equals requested_amount_cents while APPROVED or HELD, 0 otherwise.
      - name: attendance_count
        type: integer
        source: computed
        default: null
        description: Headcount recorded by the HOLD outcome.
      - name: receipt_lines
        type: array
        source: computed
        default: []
        description: "Array of { line_category, amount_cents } supplied at reimbursement; line_category IN {FOOD, SUPPLIES, HONORARIUM}."
      - name: reimbursed_amount_cents
        type: integer
        source: computed
        default: null
        description: Output of calculation program_reimbursement_amount; null until REIMBURSED.
      - name: decision_reason
        type: string
        source: computed
        default: null
        description: Reason recorded by the approve/deny/cancel actions.

  - name: BreakHousingRequest
    parent: null
    common_fields: true
    fields:
      - name: student_id
        type: string
        source: input
        description: "FK -> Student.id; the resident asking to stay over break."
      - name: room_id
        type: string
        source: input
        description: "FK -> Room.id; the room the stay would occupy."
      - name: break_code
        type: enum
        source: input
        description: Which break period.
        constraints: "THANKSGIVING | WINTER | SPRING"
      - name: start_date
        type: string
        source: input
        description: First occupied calendar date, inclusive (YYYY-MM-DD).
      - name: end_date
        type: string
        source: input
        description: Last occupied calendar date, inclusive (YYYY-MM-DD).
        constraints: "end_date >= start_date; span <= 45 days"
      - name: reason
        type: string
        source: input
        description: Justification text.
      - name: status
        type: enum
        source: computed
        default: REQUESTED
        description: Break-housing lifecycle; REVOKED is written by cascades.
        constraints: "REQUESTED | APPROVED | CHECKED_IN | DENIED | REVOKED | CLOSED"
      - name: decided_by_user_id
        type: string
        source: computed
        default: null
        description: X-User-ID of the director who approved or denied.
      - name: revocation_cause
        type: enum
        source: computed
        default: null
        description: Which cascade revoked the stay.
        constraints: "EMERGENCY_CLOSURE | CONDUCT_INELIGIBLE | null"
      - name: checked_in_at
        type: datetime
        source: computed
        default: null
        description: Logical-clock instant of check-in.

# ---------------------------------------------------------------------------
# 1.2 State Machine Table
# ---------------------------------------------------------------------------
state_machines:

  - entity: Building
    state_field: posture
    shape: cyclic
    initial_state: OPEN
    terminal_states: []
    transitions:
      - from: OPEN
        to: RESTRICTED
        trigger: "POST /residence-life/buildings/{building_id}/posture with target_posture=RESTRICTED"
        actor: ResidenceDirector
        preconditions: ["posture == OPEN"]
        side_effects:
          - "closure_reason := reason; last_posture_change_at := logical clock now; version += 1"
          - "New RoomChangeCase placement approvals into rooms in this building are refused with ERR_BUILDING_NOT_OPEN"
      - from: RESTRICTED
        to: OPEN
        trigger: "POST /residence-life/buildings/{building_id}/posture with target_posture=OPEN"
        actor: ResidenceDirector
        preconditions: ["posture == RESTRICTED"]
        side_effects: ["closure_reason := null; last_posture_change_at := now; version += 1"]
      - from: OPEN
        to: EMERGENCY_CLOSED
        trigger: "POST /residence-life/buildings/{building_id}/posture with target_posture=EMERGENCY_CLOSED"
        actor: ResidenceDirector
        preconditions: ["posture == OPEN", "reason is present and non-empty"]
        side_effects:
          - "CASCADE LINK 1: every Room whose Floor.building_id == this building and whose status IN {AVAILABLE, OCCUPIED} records pre_closure_status := status and transitions to OFFLINE"
          - "CASCADE LINK 2: each Room that just entered OFFLINE causes every BreakHousingRequest referencing that room with status IN {APPROVED, CHECKED_IN} to transition to REVOKED with revocation_cause := EMERGENCY_CLOSURE"
          - "CASCADE LINK 3: each BreakHousingRequest that just entered REVOKED causes a new RoomChangeCase to be created for its student_id with origin := EMERGENCY_RELOCATION, from_room_id := the student's current_room_id, mediation_status := NOT_REQUIRED, placement_status := REQUESTED, opened_by_user_id := \"system\""
          - "CASCADE LINK 4: each RoomChangeCase created by link 3 causes its Student.housing_status to become RELOCATION_PENDING"
          - "FAN-OUT: every Floor in the building sets programming_frozen := true and recomputes programming_compliance_status"
          - "closure_reason := reason; last_posture_change_at := now; version += 1"
      - from: RESTRICTED
        to: EMERGENCY_CLOSED
        trigger: "POST /residence-life/buildings/{building_id}/posture with target_posture=EMERGENCY_CLOSED"
        actor: ResidenceDirector
        preconditions: ["posture == RESTRICTED", "reason is present and non-empty"]
        side_effects: ["identical cascade links 1-4 and fan-out as the OPEN -> EMERGENCY_CLOSED transition"]
      - from: EMERGENCY_CLOSED
        to: OPEN
        trigger: "POST /residence-life/buildings/{building_id}/posture with target_posture=OPEN"
        actor: ResidenceDirector
        preconditions: ["posture == EMERGENCY_CLOSED"]
        side_effects:
          - "Every Room in the building whose status == OFFLINE and pre_closure_status is non-null returns to pre_closure_status, then pre_closure_status := null"
          - "Every Floor in the building sets programming_frozen := false and recomputes programming_compliance_status"
          - "REVOKED BreakHousingRequest rows are NOT restored; closure_reason := null; version += 1"
        note: "EMERGENCY_CLOSED -> RESTRICTED is not a declared transition and is refused with ERR_INVALID_POSTURE_TRANSITION."

  - entity: Room
    state_field: status
    shape: branching
    initial_state: AVAILABLE
    terminal_states: [CONSOLIDATED]
    transitions:
      - from: AVAILABLE
        to: OCCUPIED
        trigger: "POST /residence-life/students/{student_id}/room-assignment with action=PLACE"
        actor: ResidenceDirector
        preconditions: ["status == AVAILABLE", "occupied_beds < bed_capacity", "parent Building.posture == OPEN"]
        side_effects: ["occupied_beds += 1", "Floor.occupied_beds recomputed", "Building.assigned_bed_count recomputed", "version += 1"]
      - from: OCCUPIED
        to: AVAILABLE
        trigger: "POST /residence-life/students/{student_id}/room-assignment with action=VACATE, or the last occupant is moved out by placement completion"
        actor: ResidenceDirector
        preconditions: ["status == OCCUPIED", "occupied_beds == 1"]
        side_effects: ["occupied_beds := 0", "Floor.occupied_beds recomputed", "Building.assigned_bed_count recomputed", "version += 1"]
      - from: AVAILABLE
        to: OFFLINE
        trigger: "POST /residence-life/rooms/{room_id}/status with target_status=OFFLINE, or emergency-closure cascade link 1"
        actor: ResidenceDirector | system
        preconditions: ["status == AVAILABLE"]
        side_effects: ["pre_closure_status := AVAILABLE when written by the cascade, null when written by an explicit director action", "version += 1"]
      - from: OCCUPIED
        to: OFFLINE
        trigger: "POST /residence-life/rooms/{room_id}/status with target_status=OFFLINE, or emergency-closure cascade link 1"
        actor: ResidenceDirector | system
        preconditions: ["status == OCCUPIED"]
        side_effects:
          - "pre_closure_status := OCCUPIED when written by the cascade"
          - "Triggers cascade link 2 on every BreakHousingRequest for this room with status IN {APPROVED, CHECKED_IN}"
          - "version += 1"
      - from: OFFLINE
        to: AVAILABLE
        trigger: "POST /residence-life/rooms/{room_id}/status with target_status=AVAILABLE, or hall reopen replaying pre_closure_status"
        actor: ResidenceDirector | system
        preconditions: ["status == OFFLINE", "occupied_beds == 0 when the actor is a director"]
        side_effects: ["pre_closure_status := null", "version += 1"]
      - from: OFFLINE
        to: OCCUPIED
        trigger: "Hall reopen replaying pre_closure_status == OCCUPIED"
        actor: system
        preconditions: ["status == OFFLINE", "pre_closure_status == OCCUPIED"]
        side_effects: ["pre_closure_status := null", "version += 1"]
      - from: OCCUPIED
        to: CONSOLIDATED
        trigger: "POST /residence-life/buildings/{building_id}/consolidation with mode=EXECUTE, for each source room fully vacated by the plan"
        actor: ResidenceDirector
        preconditions: ["status == OCCUPIED", "every occupant has been moved to a target room by this run", "occupied_beds == 0 after the moves"]
        side_effects: ["occupied_beds := 0", "Floor.occupied_beds recomputed", "Building.assigned_bed_count unchanged", "version += 1"]

  - entity: RAApplication
    state_field: status
    shape: cyclic
    initial_state: DRAFT
    terminal_states: [ACCEPTED, DECLINED, REJECTED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /residence-life/ra-applications/{application_id}/submit"
        actor: Student
        preconditions: ["status == DRAFT", "X-User-ID == applicant_student_id", "essay_ref is non-empty"]
        side_effects: ["submitted_at := logical clock now", "version += 1"]
      - from: REVISION_REQUESTED
        to: SUBMITTED
        trigger: "POST /residence-life/ra-applications/{application_id}/submit"
        actor: Student
        preconditions: ["status == REVISION_REQUESTED", "X-User-ID == applicant_student_id"]
        side_effects: ["submitted_at := now", "version += 1"]
        note: "This edge closes the revision cycle UNDER_REVIEW -> REVISION_REQUESTED -> SUBMITTED -> UNDER_REVIEW."
      - from: SUBMITTED
        to: UNDER_REVIEW
        trigger: "POST /residence-life/ra-applications/{application_id}/review"
        actor: ResidenceDirector
        preconditions: ["status == SUBMITTED"]
        side_effects: ["interview_score := supplied score", "reviewed_by_user_id := X-User-ID", "version += 1"]
      - from: UNDER_REVIEW
        to: REVISION_REQUESTED
        trigger: "POST /residence-life/ra-applications/{application_id}/decision with decision=REQUEST_REVISION"
        actor: ResidenceDirector
        preconditions: ["status == UNDER_REVIEW", "revision_count < MAX_REVISION_ROUNDS"]
        side_effects: ["revision_count += 1", "revision_notes := supplied notes", "version += 1"]
      - from: UNDER_REVIEW
        to: OFFERED
        trigger: "POST /residence-life/ra-applications/{application_id}/decision with decision=OFFER"
        actor: ResidenceDirector
        preconditions: ["status == UNDER_REVIEW", "interview_score is non-null"]
        side_effects: ["version += 1"]
      - from: UNDER_REVIEW
        to: REJECTED
        trigger: "POST /residence-life/ra-applications/{application_id}/decision with decision=REJECT"
        actor: ResidenceDirector
        preconditions: ["status == UNDER_REVIEW"]
        side_effects: ["version += 1"]
      - from: OFFERED
        to: ACCEPTED
        trigger: "POST /residence-life/ra-applications/{application_id}/response with response=ACCEPT"
        actor: Student
        preconditions: ["status == OFFERED", "X-User-ID == applicant_student_id"]
        side_effects:
          - "A new RA row is created with student_id := applicant_student_id, application_id := this application, employment_status := PROVISIONAL, certification_status := UNCERTIFIED"
          - "created_ra_id := the new RA.id"
          - "version += 1"
      - from: OFFERED
        to: DECLINED
        trigger: "POST /residence-life/ra-applications/{application_id}/response with response=DECLINE"
        actor: Student
        preconditions: ["status == OFFERED", "X-User-ID == applicant_student_id"]
        side_effects: ["version += 1"]

  - entity: RA
    state_field: employment_status
    shape: cyclic
    initial_state: PROVISIONAL
    terminal_states: [SEPARATED]
    transitions:
      - from: PROVISIONAL
        to: ACTIVE
        trigger: "POST /residence-life/ras/{ra_id}/employment with action=ACTIVATE"
        actor: ResidenceDirector
        preconditions: ["employment_status == PROVISIONAL", "assigned_floor_id is non-null"]
        side_effects: ["version += 1"]
        note: "Independent of certification_status: an RA may be ACTIVE while UNCERTIFIED."
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /residence-life/ras/{ra_id}/employment with action=SUSPEND"
        actor: ResidenceDirector
        preconditions: ["employment_status == ACTIVE"]
        side_effects: ["certification_status is left untouched", "version += 1"]
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /residence-life/ras/{ra_id}/employment with action=REINSTATE"
        actor: ResidenceDirector
        preconditions: ["employment_status == SUSPENDED"]
        side_effects: ["certification_status is left untouched", "version += 1"]
      - from: ACTIVE
        to: SEPARATED
        trigger: "POST /residence-life/ras/{ra_id}/employment with action=SEPARATE"
        actor: ResidenceDirector
        preconditions: ["employment_status == ACTIVE"]
        side_effects:
          - "CASCADE LINK 1: every DutyShift with assigned_ra_id == this RA, status IN {ASSIGNED, SWAP_PENDING} and start_at > logical clock now transitions to OPEN with assigned_ra_id := null and swap_requested_ra_id := null"
          - "CASCADE LINK 2: each DutyShift that just returned to OPEN causes its Floor.uncovered_shift_count to be recomputed"
          - "CASCADE LINK 3: each Floor whose recomputed uncovered_shift_count >= COVERAGE_ALERT_THRESHOLD sets coverage_status := CRITICAL"
          - "separation_reason := reason; version += 1"
      - from: SUSPENDED
        to: SEPARATED
        trigger: "POST /residence-life/ras/{ra_id}/employment with action=SEPARATE"
        actor: ResidenceDirector
        preconditions: ["employment_status == SUSPENDED"]
        side_effects: ["identical cascade links 1-3 as the ACTIVE -> SEPARATED transition", "separation_reason := reason; version += 1"]

  - entity: RA
    state_field: certification_status
    shape: cyclic
    initial_state: UNCERTIFIED
    terminal_states: []
    transitions:
      - from: UNCERTIFIED
        to: IN_TRAINING
        trigger: "POST /residence-life/ras/{ra_id}/certification with action=START_TRAINING"
        actor: ResidenceDirector
        preconditions: ["certification_status == UNCERTIFIED"]
        side_effects: ["employment_status is left untouched", "version += 1"]
      - from: LAPSED
        to: IN_TRAINING
        trigger: "POST /residence-life/ras/{ra_id}/certification with action=START_TRAINING"
        actor: ResidenceDirector
        preconditions: ["certification_status == LAPSED"]
        side_effects: ["employment_status is left untouched", "version += 1"]
        note: "Closes the recertification cycle CERTIFIED -> LAPSED -> IN_TRAINING -> CERTIFIED."
      - from: IN_TRAINING
        to: CERTIFIED
        trigger: "POST /residence-life/ras/{ra_id}/certification with action=CERTIFY"
        actor: ResidenceDirector
        preconditions:
          - "certification_status == IN_TRAINING"
          - "training_credits_earned >= CERTIFICATION_CREDIT_MIN"
          - "completed_module_codes contains every code in MANDATORY_MODULE_CODES"
        side_effects: ["certified_at := logical clock now", "employment_status is left untouched", "version += 1"]
      - from: CERTIFIED
        to: LAPSED
        trigger: "POST /residence-life/ras/{ra_id}/certification with action=LAPSE"
        actor: ResidenceDirector
        preconditions: ["certification_status == CERTIFIED"]
        side_effects:
          - "employment_status is left untouched"
          - "Already-ASSIGNED DutyShift rows are left in place; only NEW assignments are refused with ERR_RA_NOT_CERTIFIED"
          - "version += 1"

  - entity: DutyShift
    state_field: status
    shape: cyclic
    initial_state: OPEN
    terminal_states: [COMPLETED, MISSED, VOID]
    transitions:
      - from: OPEN
        to: ASSIGNED
        trigger: "POST /residence-life/duty-shifts/{shift_id}/assignment, or POST /residence-life/duty-shifts/{shift_id}/auto-fill"
        actor: ResidenceDirector
        preconditions:
          - "status == OPEN"
          - "the named RA has employment_status == ACTIVE"
          - "the named RA has certification_status == CERTIFIED"
          - "the named RA has assigned_floor_id == this shift's floor_id"
          - "no other DutyShift held by that RA with status IN {ASSIGNED, SWAP_PENDING, CHECKED_IN, COMPLETED} conflicts under the half-open-plus-rest rule"
          - "start_at > logical clock now"
        side_effects:
          - "assigned_ra_id := the named RA; filled_by_selector := true only on the auto-fill path"
          - "Floor.uncovered_shift_count recomputed; Floor.coverage_status recomputed"
          - "version += 1"
      - from: ASSIGNED
        to: SWAP_PENDING
        trigger: "POST /residence-life/duty-shifts/{shift_id}/swap with action=REQUEST"
        actor: ResidentAssistant
        preconditions: ["status == ASSIGNED", "X-User-ID == assigned_ra_id", "replacement_ra_id names an RA with employment_status == ACTIVE and certification_status == CERTIFIED", "start_at > logical clock now"]
        side_effects: ["swap_requested_ra_id := replacement_ra_id", "version += 1"]
      - from: SWAP_PENDING
        to: ASSIGNED
        trigger: "POST /residence-life/duty-shifts/{shift_id}/swap with action=APPROVE (accept the replacement) or action=WITHDRAW (keep the original holder)"
        actor: ResidenceDirector
        preconditions:
          - "status == SWAP_PENDING"
          - "on APPROVE, the swap_requested_ra_id passes the same active/certified/floor/rest checks the original assignment passed"
        side_effects:
          - "on APPROVE: assigned_ra_id := swap_requested_ra_id; on WITHDRAW: assigned_ra_id is unchanged"
          - "swap_requested_ra_id := null"
          - "version += 1"
        note: "Closes the swap cycle ASSIGNED -> SWAP_PENDING -> ASSIGNED."
      - from: ASSIGNED
        to: CHECKED_IN
        trigger: "POST /residence-life/duty-shifts/{shift_id}/outcome with action=CHECK_IN"
        actor: ResidentAssistant
        preconditions: ["status == ASSIGNED", "X-User-ID == assigned_ra_id", "start_at <= logical clock now < end_at"]
        side_effects: ["checked_in_at := now", "version += 1"]
      - from: CHECKED_IN
        to: COMPLETED
        trigger: "POST /residence-life/duty-shifts/{shift_id}/outcome with action=COMPLETE"
        actor: ResidentAssistant
        preconditions: ["status == CHECKED_IN", "X-User-ID == assigned_ra_id", "logical clock now >= end_at"]
        side_effects: ["completed_at := now", "RA.duty_points_balance += points_value", "version += 1"]
      - from: ASSIGNED
        to: MISSED
        trigger: "POST /residence-life/duty-shifts/{shift_id}/outcome with action=MARK_MISSED"
        actor: ResidenceDirector
        preconditions: ["status == ASSIGNED", "logical clock now >= end_at"]
        side_effects: ["RA.missed_shift_count += 1", "version += 1"]
      - from: OPEN
        to: VOID
        trigger: "POST /residence-life/duty-shifts/{shift_id}/outcome with action=VOID"
        actor: ResidenceDirector
        preconditions: ["status == OPEN"]
        side_effects: ["Floor.uncovered_shift_count recomputed; Floor.coverage_status recomputed", "version += 1"]
      - from: COMPLETED
        to: VOID
        trigger: "POST /residence-life/duty-shifts/{shift_id}/outcome with action=VOID"
        actor: ResidenceDirector
        preconditions: ["status == COMPLETED"]
        side_effects: ["RA.duty_points_balance -= points_value (compensating reversal, no drift)", "version += 1"]

  - entity: IncidentReport
    state_field: status
    shape: branching
    initial_state: DRAFT
    terminal_states: [CLOSED_NO_ACTION, CLOSED_ADJUDICATED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /residence-life/incident-reports/{report_id}/submit"
        actor: ResidentAssistant
        preconditions: ["status == DRAFT", "X-User-ID == filed_by_ra_id", "narrative length >= 10"]
        side_effects: ["submitted_at := logical clock now", "version += 1"]
      - from: RETURNED_FOR_DETAIL
        to: SUBMITTED
        trigger: "POST /residence-life/incident-reports/{report_id}/submit"
        actor: ResidentAssistant
        preconditions: ["status == RETURNED_FOR_DETAIL", "X-User-ID == filed_by_ra_id", "narrative length >= 10"]
        side_effects: ["submitted_at := now", "version += 1"]
        note: "Closes the detail cycle SUBMITTED -> RETURNED_FOR_DETAIL -> SUBMITTED."
      - from: SUBMITTED
        to: RETURNED_FOR_DETAIL
        trigger: "POST /residence-life/incident-reports/{report_id}/triage with disposition=RETURN"
        actor: ResidenceDirector
        preconditions: ["status == SUBMITTED", "return_count < MAX_RETURN_ROUNDS"]
        side_effects: ["return_count += 1", "version += 1"]
      - from: SUBMITTED
        to: ROUTED_TO_CONDUCT
        trigger: "POST /residence-life/incident-reports/{report_id}/triage with disposition=ROUTE"
        actor: ResidenceDirector
        preconditions: ["status == SUBMITTED"]
        side_effects:
          - "A new ConductCase is created with incident_report_id := this report, respondent_student_id := subject_student_id, severity := this report's severity, status := OPEN, opened_at := logical clock now"
          - "conduct_case_id := the new ConductCase.id; routed_by_user_id := X-User-ID"
          - "Student.judicial_hold := true for subject_student_id"
          - "version += 1"
        note: "ROUTE and CLOSE_NO_ACTION are the two branches of the triage fork; their side-effect sets are disjoint."
      - from: SUBMITTED
        to: CLOSED_NO_ACTION
        trigger: "POST /residence-life/incident-reports/{report_id}/triage with disposition=CLOSE_NO_ACTION"
        actor: ResidenceDirector
        preconditions: ["status == SUBMITTED"]
        side_effects: ["No ConductCase is created; conduct_case_id stays null; Student.judicial_hold is left untouched", "version += 1"]
      - from: ROUTED_TO_CONDUCT
        to: CLOSED_ADJUDICATED
        trigger: "System bubble-up when the linked ConductCase reaches SANCTIONED or DISMISSED"
        actor: system
        preconditions: ["status == ROUTED_TO_CONDUCT", "the ConductCase named by conduct_case_id has status IN {SANCTIONED, DISMISSED}"]
        side_effects: ["version += 1"]

  - entity: ConductCase
    state_field: status
    shape: branching
    initial_state: OPEN
    terminal_states: [SANCTIONED, DISMISSED]
    transitions:
      - from: OPEN
        to: HEARING_SCHEDULED
        trigger: "POST /residence-life/conduct-cases/{case_id}/hearing"
        actor: ConductOfficer
        preconditions: ["status == OPEN", "hearing_at > logical clock now", "hearing_at <= opened_at + HEARING_WINDOW_DAYS days"]
        side_effects: ["hearing_at := supplied instant", "scheduled_by_user_id := X-User-ID", "version += 1"]
      - from: HEARING_SCHEDULED
        to: SANCTIONED
        trigger: "POST /residence-life/conduct-cases/{case_id}/decision with outcome=SANCTION"
        actor: ConductOfficer
        preconditions: ["status == HEARING_SCHEDULED", "X-User-ID != scheduled_by_user_id (segregation of duties)"]
        side_effects:
          - "prior_sanctioned_count := count of other SANCTIONED cases for the respondent; sanction_points := conduct_sanction_points(severity, prior_sanctioned_count)"
          - "CASCADE LINK 1: Student.conduct_points += sanction_points for respondent_student_id"
          - "CASCADE LINK 2: the new conduct_points value crossing CONDUCT_PROBATION_THRESHOLD sets Student.conduct_standing := PROBATION (or SUSPENDED at CONDUCT_SUSPENSION_THRESHOLD)"
          - "CASCADE LINK 3: the Student entering PROBATION or SUSPENDED sets Student.break_housing_eligible := false and transitions every RoomChangeCase of that student whose placement_status == REQUESTED to DENIED"
          - "CASCADE LINK 4: break_housing_eligible turning false transitions every BreakHousingRequest of that student with status IN {REQUESTED, APPROVED} to REVOKED with revocation_cause := CONDUCT_INELIGIBLE"
          - "BUBBLE-UP: the linked IncidentReport moves ROUTED_TO_CONDUCT -> CLOSED_ADJUDICATED"
          - "Student.judicial_hold := false when no other OPEN/HEARING_SCHEDULED case remains"
          - "decided_by_user_id := X-User-ID; outcome := SANCTION; version += 1"
      - from: HEARING_SCHEDULED
        to: DISMISSED
        trigger: "POST /residence-life/conduct-cases/{case_id}/decision with outcome=DISMISS"
        actor: ConductOfficer
        preconditions: ["status == HEARING_SCHEDULED", "X-User-ID != scheduled_by_user_id (segregation of duties)"]
        side_effects:
          - "sanction_points := 0; Student.conduct_points is left unchanged"
          - "Student.judicial_hold := false when no other OPEN/HEARING_SCHEDULED case remains"
          - "BUBBLE-UP: the linked IncidentReport moves ROUTED_TO_CONDUCT -> CLOSED_ADJUDICATED"
          - "decided_by_user_id := X-User-ID; outcome := DISMISS; version += 1"

  - entity: RoomInspection
    state_field: status
    shape: branching
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, SUPERSEDED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: COMPLETED
        trigger: "POST /residence-life/room-inspections/{inspection_id}/completion"
        actor: ResidentAssistant
        preconditions:
          - "status == SCHEDULED"
          - "X-User-ID == inspector_ra_id"
          - "the inspecting RA has certification_status == CERTIFIED and employment_status == ACTIVE"
          - "the room's Floor.id == the inspecting RA's assigned_floor_id"
        side_effects:
          - "condition_score := supplied score; Room.condition_score := supplied score; completed_at := logical clock now"
          - "When damage_lines is non-empty a DamageCharge is created with status PENDING, student_id := responsible_student_id (or the room's sole occupant when omitted) and provisional_subtotal_cents := damage_line_assessment/PROVISIONAL_LIST"
          - "damage_charge_id := the new DamageCharge.id when one was created"
          - "version += 1"
      - from: SCHEDULED
        to: SUPERSEDED
        trigger: "POST /residence-life/room-inspections creating a newer inspection of the same room and inspection_type"
        actor: ResidentAssistant
        preconditions: ["status == SCHEDULED", "the new inspection targets the same room_id and inspection_type"]
        side_effects: ["version += 1"]
      - from: SCHEDULED
        to: CANCELLED
        trigger: "System fan-out when the inspected Room transitions to OFFLINE"
        actor: system
        preconditions: ["status == SCHEDULED", "the Room named by room_id has just entered OFFLINE"]
        side_effects: ["version += 1"]

  - entity: DamageCharge
    state_field: status
    shape: cyclic
    initial_state: PENDING
    terminal_states: [SETTLED, WAIVED, VOID]
    transitions:
      - from: PENDING
        to: BILLED
        trigger: "POST /residence-life/damage-charges/{charge_id}/billing"
        actor: BursarOfficer
        preconditions: ["status == PENDING", "the billed Student.conduct_standing != SUSPENDED"]
        side_effects:
          - "depreciation_rate, assessed_subtotal_cents := damage_line_assessment/FINAL_DEPRECIATED"
          - "admin_fee_cents, hardship_relief_cents, final_amount_cents := damage_charge_settlement"
          - "billed_at := logical clock now; appeal_deadline_at := billed_at + APPEAL_WINDOW_DAYS days"
          - "Student.damage_balance_cents recomputed (this charge now contributes final_amount_cents)"
          - "version += 1"
      - from: BILLED
        to: APPEALED
        trigger: "POST /residence-life/damage-charges/{charge_id}/appeal"
        actor: Student
        preconditions: ["status == BILLED", "X-User-ID == student_id", "appeal_outcome is null (only one appeal per charge)", "logical clock now <= appeal_deadline_at"]
        side_effects: ["appeal_reason := supplied reason", "Student.damage_balance_cents still includes this charge", "version += 1"]
      - from: APPEALED
        to: BILLED
        trigger: "POST /residence-life/damage-charges/{charge_id}/appeal-resolution with action=ADJUST or action=UPHOLD"
        actor: BursarOfficer
        preconditions: ["status == APPEALED", "on ADJUST, adjusted_subtotal_cents is present and 0 <= adjusted_subtotal_cents <= assessed_subtotal_cents"]
        side_effects:
          - "on ADJUST: assessed_subtotal_cents := adjusted_subtotal_cents, then admin_fee_cents / hardship_relief_cents / final_amount_cents are recomputed by damage_charge_settlement from the adjusted subtotal; appeal_outcome := ADJUSTED"
          - "on UPHOLD: all amounts are left unchanged; appeal_outcome := UPHELD"
          - "billed_at := logical clock now; appeal_deadline_at := billed_at + APPEAL_WINDOW_DAYS days"
          - "Student.damage_balance_cents recomputed"
          - "version += 1"
        note: "Closes the appeal cycle BILLED -> APPEALED -> BILLED. A second appeal is refused because appeal_outcome is no longer null."
      - from: BILLED
        to: SETTLED
        trigger: "POST /residence-life/damage-charges/{charge_id}/settlement with action=SETTLE"
        actor: BursarOfficer
        preconditions: ["status == BILLED"]
        side_effects: ["Student.damage_balance_cents recomputed (this charge no longer contributes)", "version += 1"]
      - from: BILLED
        to: WAIVED
        trigger: "POST /residence-life/damage-charges/{charge_id}/settlement with action=WAIVE"
        actor: BursarOfficer
        preconditions: ["status == BILLED"]
        side_effects:
          - "COMPENSATION: Student.damage_balance_cents recomputed; the exact final_amount_cents added at billing is removed, restoring the pre-billing balance with no drift"
          - "version += 1"
      - from: PENDING
        to: VOID
        trigger: "POST /residence-life/damage-charges/{charge_id}/settlement with action=WAIVE on a charge that was never billed"
        actor: BursarOfficer
        preconditions: ["status == PENDING"]
        side_effects: ["No ledger movement occurs because the charge never contributed to Student.damage_balance_cents", "version += 1"]

  - entity: RoomChangeCase
    state_field: mediation_status
    shape: cyclic
    initial_state: NOT_REQUIRED
    terminal_states: [AGREEMENT_REACHED]
    transitions:
      - from: INTAKE
        to: SESSION_SCHEDULED
        trigger: "POST /residence-life/room-change-cases/{case_id}/mediation with action=SCHEDULE_SESSION"
        actor: ResidenceDirector
        preconditions: ["mediation_status == INTAKE", "session_at > logical clock now", "mediation_round < MAX_MEDIATION_ROUNDS"]
        side_effects: ["session_at := supplied instant", "placement_status is left untouched", "version += 1"]
      - from: IMPASSE
        to: SESSION_SCHEDULED
        trigger: "POST /residence-life/room-change-cases/{case_id}/mediation with action=SCHEDULE_SESSION"
        actor: ResidenceDirector
        preconditions: ["mediation_status == IMPASSE", "mediation_round < MAX_MEDIATION_ROUNDS", "session_at > logical clock now"]
        side_effects: ["session_at := supplied instant", "placement_status is left untouched", "version += 1"]
        note: "Closes the mediation cycle SESSION_SCHEDULED -> IMPASSE -> SESSION_SCHEDULED."
      - from: SESSION_SCHEDULED
        to: AGREEMENT_REACHED
        trigger: "POST /residence-life/room-change-cases/{case_id}/mediation with action=RECORD_SESSION and outcome=AGREEMENT"
        actor: ResidenceDirector
        preconditions: ["mediation_status == SESSION_SCHEDULED"]
        side_effects: ["mediation_round += 1", "placement_status is left untouched", "version += 1"]
      - from: SESSION_SCHEDULED
        to: IMPASSE
        trigger: "POST /residence-life/room-change-cases/{case_id}/mediation with action=RECORD_SESSION and outcome=IMPASSE"
        actor: ResidenceDirector
        preconditions: ["mediation_status == SESSION_SCHEDULED"]
        side_effects: ["mediation_round += 1", "placement_status is left untouched", "version += 1"]
      - from: NOT_REQUIRED
        to: INTAKE
        trigger: "POST /residence-life/room-change-cases/{case_id}/mediation with action=OPEN_INTAKE"
        actor: ResidenceDirector
        preconditions: ["mediation_status == NOT_REQUIRED", "roommate_student_id is non-null"]
        side_effects: ["placement_status is left untouched", "version += 1"]
        note: "Cases created with origin == ROOMMATE_CONFLICT are born in INTAKE and do not need this edge."

  - entity: RoomChangeCase
    state_field: placement_status
    shape: branching
    initial_state: NONE
    terminal_states: [COMPLETED, DENIED, CANCELLED, REVERTED]
    transitions:
      - from: NONE
        to: REQUESTED
        trigger: "POST /residence-life/room-change-cases/{case_id}/placement-request"
        actor: Student | ResidenceDirector
        preconditions:
          - "placement_status == NONE"
          - "when origin == ROOMMATE_CONFLICT, mediation_status IN {AGREEMENT_REACHED, IMPASSE}"
          - "to_room_id names a Room with status == AVAILABLE or (status == OCCUPIED and occupied_beds < bed_capacity)"
          - "the student's conduct_standing != SUSPENDED"
        side_effects: ["to_room_id := supplied room", "mediation_status is left untouched", "version += 1"]
      - from: REQUESTED
        to: APPROVED
        trigger: "POST /residence-life/room-change-cases/{case_id}/placement-decision with decision=APPROVE"
        actor: ResidenceDirector
        preconditions:
          - "placement_status == REQUESTED"
          - "the Building owning to_room_id has posture == OPEN"
          - "the target Room.status IN {AVAILABLE, OCCUPIED} and occupied_beds < bed_capacity"
          - "the student's conduct_standing == GOOD"
          - "the student's judicial_hold == false"
        side_effects: ["mediation_status is left untouched", "version += 1"]
      - from: REQUESTED
        to: DENIED
        trigger: "POST /residence-life/room-change-cases/{case_id}/placement-decision with decision=DENY, or conduct cascade link 3"
        actor: ResidenceDirector | system
        preconditions: ["placement_status == REQUESTED"]
        side_effects: ["mediation_status is left untouched", "version += 1"]
      - from: REQUESTED
        to: CANCELLED
        trigger: "POST /residence-life/room-change-cases creating a newer case for the same student_id, which supersedes this one"
        actor: system
        preconditions: ["placement_status == REQUESTED"]
        side_effects: ["the newer case records superseded_case_id := this case's id", "version += 1"]
      - from: APPROVED
        to: COMPLETED
        trigger: "POST /residence-life/room-change-cases/{case_id}/placement-completion"
        actor: ResidenceDirector
        preconditions: ["placement_status == APPROVED", "the target Room still has occupied_beds < bed_capacity", "the Building owning to_room_id has posture == OPEN"]
        side_effects:
          - "reverted_from_room_id := from_room_id"
          - "Student.current_room_id := to_room_id; Student.housing_status := ASSIGNED"
          - "from_room.occupied_beds -= 1 (and from_room transitions OCCUPIED -> AVAILABLE when it reaches 0); to_room.occupied_beds += 1 (and to_room transitions AVAILABLE -> OCCUPIED when it reaches 1)"
          - "Building.assigned_bed_count is unchanged: the move conserves total occupied beds"
          - "version += 1"
      - from: COMPLETED
        to: REVERTED
        trigger: "POST /residence-life/room-change-cases/{case_id}/placement-revert"
        actor: ResidenceDirector
        preconditions: ["placement_status == COMPLETED", "the room named by reverted_from_room_id has status != CONSOLIDATED and occupied_beds < bed_capacity"]
        side_effects:
          - "COMPENSATION: Student.current_room_id := reverted_from_room_id; to_room.occupied_beds -= 1; reverted_from_room.occupied_beds += 1"
          - "Every Room touched by the forward move returns to the exact occupied_beds it held before placement completion; Building.assigned_bed_count is unchanged end to end"
          - "version += 1"

  - entity: ProgramEvent
    state_field: status
    shape: branching
    initial_state: PROPOSED
    terminal_states: [REIMBURSED, DENIED, CANCELLED]
    transitions:
      - from: PROPOSED
        to: APPROVED
        trigger: "POST /residence-life/program-events/{event_id}/decision with decision=APPROVE"
        actor: ResidenceDirector
        preconditions:
          - "status == PROPOSED"
          - "the Floor has programming_frozen == false"
          - "the Floor has programming_budget_cents > 0"
          - "requested_amount_cents <= Floor.programming_available_cents"
        side_effects:
          - "encumbered_amount_cents := requested_amount_cents"
          - "Floor.programming_encumbered_cents += requested_amount_cents; Floor.programming_available_cents recomputed"
          - "version += 1"
      - from: PROPOSED
        to: DENIED
        trigger: "POST /residence-life/program-events/{event_id}/decision with decision=DENY"
        actor: ResidenceDirector
        preconditions: ["status == PROPOSED"]
        side_effects: ["no floor bucket moves", "version += 1"]
      - from: APPROVED
        to: HELD
        trigger: "POST /residence-life/program-events/{event_id}/outcome with action=HOLD"
        actor: ResidentAssistant | ResidenceDirector
        preconditions: ["status == APPROVED", "logical clock now >= scheduled_for"]
        side_effects:
          - "attendance_count := supplied headcount"
          - "Floor.held_program_count recomputed; Floor.programming_compliance_status recomputed by floor_programming_compliance"
          - "version += 1"
      - from: APPROVED
        to: CANCELLED
        trigger: "POST /residence-life/program-events/{event_id}/outcome with action=CANCEL"
        actor: ResidentAssistant | ResidenceDirector
        preconditions: ["status == APPROVED"]
        side_effects:
          - "COMPENSATION: Floor.programming_encumbered_cents -= encumbered_amount_cents; encumbered_amount_cents := 0; Floor.programming_available_cents recomputed to its exact pre-approval value"
          - "version += 1"
      - from: HELD
        to: CANCELLED
        trigger: "POST /residence-life/program-events/{event_id}/outcome with action=CANCEL"
        actor: ResidenceDirector
        preconditions: ["status == HELD"]
        side_effects:
          - "COMPENSATION: Floor.programming_encumbered_cents -= encumbered_amount_cents; encumbered_amount_cents := 0; Floor.held_program_count and programming_compliance_status recomputed"
          - "version += 1"
      - from: HELD
        to: REIMBURSED
        trigger: "POST /residence-life/program-events/{event_id}/reimbursement"
        actor: ResidenceDirector
        preconditions:
          - "status == HELD"
          - "receipt_lines is non-empty"
          - "max(0, program_reimbursement_amount - requested_amount_cents) <= Floor.programming_available_cents"
        side_effects:
          - "reimbursed_amount_cents := program_reimbursement_amount; receipt_lines := supplied lines"
          - "Floor.programming_encumbered_cents -= encumbered_amount_cents; encumbered_amount_cents := 0"
          - "Floor.programming_spent_cents += reimbursed_amount_cents; Floor.programming_available_cents recomputed"
          - "version += 1"

  - entity: BreakHousingRequest
    state_field: status
    shape: branching
    initial_state: REQUESTED
    terminal_states: [DENIED, REVOKED, CLOSED]
    transitions:
      - from: REQUESTED
        to: APPROVED
        trigger: "POST /residence-life/break-housing-requests/{request_id}/decision with decision=APPROVE"
        actor: ResidenceDirector
        preconditions:
          - "status == REQUESTED"
          - "the Building owning room_id has break_housing_enabled == true"
          - "the Building owning room_id has posture == OPEN"
          - "the Student has break_housing_eligible == true"
          - "the aggregate closed-interval occupancy check in break_housing_capacity_projection passes"
        side_effects: ["decided_by_user_id := X-User-ID", "Room.break_hold_count recomputed", "version += 1"]
      - from: REQUESTED
        to: DENIED
        trigger: "POST /residence-life/break-housing-requests/{request_id}/decision with decision=DENY"
        actor: ResidenceDirector
        preconditions: ["status == REQUESTED"]
        side_effects: ["decided_by_user_id := X-User-ID", "version += 1"]
      - from: APPROVED
        to: CHECKED_IN
        trigger: "POST /residence-life/break-housing-requests/{request_id}/occupancy with action=CHECK_IN"
        actor: ResidentAssistant | ResidenceDirector
        preconditions: ["status == APPROVED", "the date part of the logical clock is >= start_date and <= end_date", "the Building posture == OPEN"]
        side_effects: ["checked_in_at := logical clock now", "version += 1"]
      - from: CHECKED_IN
        to: CLOSED
        trigger: "POST /residence-life/break-housing-requests/{request_id}/occupancy with action=CLOSE"
        actor: ResidentAssistant | ResidenceDirector
        preconditions: ["status == CHECKED_IN", "the date part of the logical clock is > end_date"]
        side_effects: ["Room.break_hold_count recomputed", "version += 1"]
      - from: APPROVED
        to: REVOKED
        trigger: "Emergency-closure cascade link 2, or conduct cascade link 4"
        actor: system
        preconditions: ["status == APPROVED", "the room just entered OFFLINE, or the student just lost break_housing_eligible"]
        side_effects: ["revocation_cause := EMERGENCY_CLOSURE or CONDUCT_INELIGIBLE", "Room.break_hold_count recomputed", "triggers cascade link 3 (a RoomChangeCase is created) only on the EMERGENCY_CLOSURE path", "version += 1"]
      - from: CHECKED_IN
        to: REVOKED
        trigger: "Emergency-closure cascade link 2"
        actor: system
        preconditions: ["status == CHECKED_IN", "the room just entered OFFLINE"]
        side_effects: ["revocation_cause := EMERGENCY_CLOSURE", "Room.break_hold_count recomputed", "triggers cascade link 3 (a RoomChangeCase is created)", "version += 1"]
      - from: REQUESTED
        to: REVOKED
        trigger: "Conduct cascade link 4"
        actor: system
        preconditions: ["status == REQUESTED", "the student just lost break_housing_eligible"]
        side_effects: ["revocation_cause := CONDUCT_INELIGIBLE", "version += 1"]

# ---------------------------------------------------------------------------
# 1.2.1 Concurrency Rules  (OCC on the parent's version — the only sanctioned mechanism)
# ---------------------------------------------------------------------------
concurrency_rules:
  - rule_id: inspection-create-stale-room
    parent_entity: Room
    write_endpoint: "POST /residence-life/room-inspections"
    occ_field: "expected_room_version"
    description: |
      Scheduling a RoomInspection against a Room whose version has advanced since the
      client last observed it is rejected. This captures the case where another writer
      has already scheduled an inspection of the same room and type (which legitimately
      supersedes the prior SCHEDULED inspection under the RoomInspection state machine),
      so the current writer's view of the room is stale.
    error_id: ERR_STALE_ROOM_VERSION
    http_status: 412

  - rule_id: room-change-create-stale-student
    parent_entity: Student
    write_endpoint: "POST /residence-life/room-change-cases"
    occ_field: "expected_student_version"
    description: |
      Opening a RoomChangeCase against a Student whose version has advanced since the
      client last observed it is rejected. This captures the case where another writer
      has already opened a case that legitimately supersedes the student's prior
      REQUESTED case, so the current writer's view of the student is stale.
    error_id: ERR_STALE_STUDENT_VERSION
    http_status: 412

# ---------------------------------------------------------------------------
# 1.3 Calculation Rules Table
# ---------------------------------------------------------------------------
calculations:

  - name: damage_line_assessment
    trigger: "PROVISIONAL_LIST runs on the RoomInspection SCHEDULED -> COMPLETED transition and writes DamageCharge.provisional_subtotal_cents. FINAL_DEPRECIATED runs on the DamageCharge PENDING -> BILLED transition (and again on APPEALED -> BILLED with action=ADJUST) and writes DamageCharge.assessed_subtotal_cents and DamageCharge.depreciation_rate."
    algorithm: tiered_pricing
    formula: |
      # depreciation_rate depends on the logical clock YEAR at billing time,
      # never on wall-clock time.
      age_years        = year_of(logical_clock_now) - Room.last_renovation_year
      depreciation_rate = min(DEPRECIATION_CAP, DEPRECIATION_PER_YEAR * max(0, age_years))

      # PROVISIONAL_LIST (inspection completion)
      provisional_subtotal_cents =
          sum over line in RoomInspection.damage_lines of
              CATALOG_LIST_CENTS[line.component_code] * line.quantity
      # no depreciation, no fee, no relief

      # FINAL_DEPRECIATED (billing)
      # ROUNDING ORDER IS PINNED: depreciate and round EACH LINE to whole cents
      # with round_half_up, THEN sum. Summing first and rounding once is wrong.
      assessed_subtotal_cents =
          sum over line in RoomInspection.damage_lines of
              round_half_up(
                CATALOG_LIST_CENTS[line.component_code] * line.quantity
                * (1 - depreciation_rate)
              )
    input_set: "Exactly the damage_lines array frozen onto the RoomInspection at COMPLETED. Lines are processed in the array order supplied at completion; because each line is rounded independently the order does not change the sum, but the per-line rounding does."
    constants:
      CATALOG_LIST_CENTS: { WALL: 7500, DOOR: 22000, CARPET: 18000, FURNITURE: 13500, WINDOW: 26000 }
      DEPRECIATION_PER_YEAR: 0.06
      DEPRECIATION_CAP: 0.50
    precision: "whole cents, round_half_up, applied per line item"
    variants:
      - name: PROVISIONAL_LIST
        when: "Stamped at RoomInspection completion, before any bursar review."
        difference: "Uses undepreciated catalog list prices and skips the settlement layer entirely; produces a strictly larger figure than FINAL_DEPRECIATED whenever depreciation_rate > 0."
      - name: FINAL_DEPRECIATED
        when: "Stamped at DamageCharge billing and re-stamped on an ADJUST appeal resolution."
        difference: "Applies the room-age depreciation rate per line with round_half_up before summing, then feeds damage_charge_settlement."

  - name: damage_charge_settlement
    trigger: "Runs immediately after damage_line_assessment/FINAL_DEPRECIATED on DamageCharge PENDING -> BILLED and on APPEALED -> BILLED with action=ADJUST. Writes admin_fee_cents, hardship_relief_cents and final_amount_cents."
    algorithm: constraint_propagation
    formula: |
      # The fee looks circular (the fee is a share of the total, and the relief
      # tier is keyed on a total that already contains the fee). The evaluation
      # order below is PINNED and is the only correct reading.
      #
      # STEP 1  gross_cents            = assessed_subtotal_cents   (FINAL_DEPRECIATED)
      # STEP 2  admin_rate             = tier selected by gross_cents:
      #                                    gross_cents < 5000              -> 0.00
      #                                    5000 <= gross_cents < 20000     -> 0.05
      #                                    gross_cents >= 20000            -> 0.10
      # STEP 3  admin_fee_cents        = round_half_up(gross_cents * admin_rate)
      # STEP 4  total_before_relief    = gross_cents + admin_fee_cents
      # STEP 5  hardship_relief_cents  = 0 when Student.financial_hardship_flag is false
      #                                  else min(HARDSHIP_CAP_CENTS,
      #                                           round_half_up(total_before_relief
      #                                                         * HARDSHIP_RELIEF_RATE))
      # STEP 6  final_amount_cents     = max(0, total_before_relief - hardship_relief_cents)
      #
      # The admin tier is chosen from gross_cents (STEP 2), NEVER from
      # total_before_relief; the relief base is total_before_relief (STEP 5),
      # NEVER gross_cents. Swapping the two bases changes the answer.
      appeal_deadline_at = billed_at + APPEAL_WINDOW_DAYS days
    input_set: "One DamageCharge and its billed Student. Only the charge's own assessed_subtotal_cents participates; other charges of the same student never enter the tier decision."
    constants:
      ADMIN_FEE_TIER_LOW_CENTS: 5000
      ADMIN_FEE_TIER_HIGH_CENTS: 20000
      ADMIN_FEE_RATE_LOW: 0.00
      ADMIN_FEE_RATE_MID: 0.05
      ADMIN_FEE_RATE_HIGH: 0.10
      HARDSHIP_RELIEF_RATE: 0.25
      HARDSHIP_CAP_CENTS: 5000
      APPEAL_WINDOW_DAYS: 14
    precision: "whole cents, round_half_up, one rounding per step as written"

  - name: program_reimbursement_amount
    trigger: "Runs on the ProgramEvent HELD -> REIMBURSED transition and writes ProgramEvent.reimbursed_amount_cents, then moves the Floor's encumbered bucket into the spent bucket."
    algorithm: aggregation
    formula: |
      # ROUNDING ORDER IS PINNED: apply the category rate to EACH receipt line,
      # round that line to whole cents with round_half_up, THEN sum the rounded
      # lines. Grouping lines by category and rounding once per category (or
      # once at the end) produces a different number of cents and is wrong.
      reimbursed_amount_cents =
          sum over line in receipt_lines of
              round_half_up(line.amount_cents * LINE_RATE[line.line_category])

      overrun_cents = max(0, reimbursed_amount_cents - ProgramEvent.requested_amount_cents)
      # overrun_cents must be <= Floor.programming_available_cents, else
      # ERR_FLOOR_BUDGET_EXCEEDED. There is NO cap: an under-spend returns the
      # difference to the floor, an over-spend draws the excess from it.

      # bucket movement, applied in this order:
      Floor.programming_encumbered_cents -= ProgramEvent.encumbered_amount_cents
      Floor.programming_spent_cents      += reimbursed_amount_cents
      Floor.programming_available_cents   = Floor.programming_budget_cents
                                          - Floor.programming_encumbered_cents
                                          - Floor.programming_spent_cents
    input_set: "Exactly the receipt_lines array supplied on the reimbursement call, in the order supplied. Lines from other events never participate."
    constants:
      LINE_RATE: { FOOD: 0.75, SUPPLIES: 0.90, HONORARIUM: 1.00 }
    precision: "whole cents, round_half_up, applied per receipt line"

  - name: ra_duty_load_score
    trigger: "Read on GET /residence-life/ras/{ra_id}/duty-load; the FORWARD_28 variant is also the ranking key used by emergency_shift_assignee_selection."
    algorithm: chronological
    formula: |
      # TERM_TO_DATE  — what the RA has already worked this term
      term_to_date_score =
          sum over s in DutyShift
              where s.assigned_ra_id == RA.id
                and s.status IN {COMPLETED, MISSED}
                and TERM_START_UTC <= s.start_at < logical_clock_now
          of  (s.points_value * MISSED_MULTIPLIER) when s.status == MISSED
              else s.points_value

      # FORWARD_28 — what the RA is already committed to over the next 28 days
      forward_28_score =
          sum over s in DutyShift
              where s.assigned_ra_id == RA.id
                and s.status IN {ASSIGNED, SWAP_PENDING, CHECKED_IN}
                and logical_clock_now <= s.start_at
                             < logical_clock_now + FORWARD_WINDOW_DAYS days
          of  s.points_value
      # window is half-open: a shift starting exactly at
      # logical_clock_now + 28 days is EXCLUDED; one starting exactly at
      # logical_clock_now is INCLUDED.
    input_set: "DutyShift rows for one RA only. TERM_TO_DATE reads the closed-past status set {COMPLETED, MISSED}; FORWARD_28 reads the open-future status set {ASSIGNED, SWAP_PENDING, CHECKED_IN}. The two status sets are disjoint, so the same shift never contributes to both."
    constants:
      TERM_START_UTC: "2026-08-01T00:00:00Z"
      FORWARD_WINDOW_DAYS: 28
      MISSED_MULTIPLIER: 2
      DUTY_POINTS: { WEEKDAY: 1, WEEKEND: 3, BREAK: 5 }
    precision: "integer points, no rounding"
    variants:
      - name: TERM_TO_DATE
        when: "Backward-looking workload review; the figure a director cites when balancing the rotation."
        difference: "Reads only settled shifts in the past window and doubles MISSED shifts as a reliability penalty."
      - name: FORWARD_28
        when: "Forward-looking commitment load; the ranking key for filling an unstaffed shift."
        difference: "Reads only unsettled shifts in the next 28 days and applies no penalty multiplier; produces a different number from TERM_TO_DATE for the same RA and the same shift table."

  - name: emergency_shift_assignee_selection
    trigger: "Runs on POST /residence-life/duty-shifts/{shift_id}/auto-fill to pick the RA that takes an unstaffed shift."
    algorithm: weighted_scoring
    formula: |
      # (a) ELIGIBILITY FILTER — candidate set, as an explicit predicate
      candidates = RA rows where
            employment_status == ACTIVE
        and certification_status == CERTIFIED
        and assigned_floor_id == DutyShift.floor_id
        and RA.id NOT IN exclude_ra_ids
        and no DutyShift of that RA with status IN {ASSIGNED, SWAP_PENDING,
            CHECKED_IN, COMPLETED} conflicts with this shift under the
            half-open-plus-rest rule in validation priority 50

      # (b) RANKING EXPRESSION — lowest score wins
      rank_key(ra) = ra_duty_load_score(ra, variant = FORWARD_28)

      # (c) TIE-BREAK, applied in order when rank_key ties
      #     1. fewer missed_shift_count wins
      #     2. lower duty_points_balance wins
      #     3. earlier RA.created_at wins        (never RA.id)

      # (d) EMPTY-POOL FALLBACK
      #     candidates is empty -> ERR_NO_ELIGIBLE_RA (422); the shift stays OPEN
      #     and Floor.uncovered_shift_count is left unchanged.
    input_set: "All RA rows in the system, filtered by (a). Selection never consults RA.id or any other random identifier."
    constants:
      FORWARD_WINDOW_DAYS: 28
    precision: "integer points; ties resolved by the ordered tie-break list"

  - name: conduct_sanction_points
    trigger: "Runs on the ConductCase HEARING_SCHEDULED -> SANCTIONED transition and writes ConductCase.sanction_points, then Student.conduct_points."
    algorithm: weighted_scoring
    formula: |
      base_points        = CONDUCT_BASE_POINTS[ConductCase.severity]
      prior_sanctioned_count =
          count of ConductCase rows where
              respondent_student_id == this case's respondent_student_id
          and id != this case's id
          and status == SANCTIONED
          # evaluated at decision time, so ordering of decisions matters
      repeat_multiplier  = min(REPEAT_MULTIPLIER_CAP,
                               1 + REPEAT_STEP * prior_sanctioned_count)
      sanction_points    = round_half_up(base_points * repeat_multiplier)

      Student.conduct_points = sum of sanction_points over that student's
                               SANCTIONED cases
      Student.conduct_standing =
            SUSPENDED when conduct_points >= CONDUCT_SUSPENSION_THRESHOLD
       else PROBATION when conduct_points >= CONDUCT_PROBATION_THRESHOLD
       else GOOD
    input_set: "ConductCase rows for one respondent with status == SANCTIONED. DISMISSED and OPEN cases never contribute."
    constants:
      CONDUCT_BASE_POINTS: { MINOR: 2, MODERATE: 5, SEVERE: 9 }
      REPEAT_STEP: 0.5
      REPEAT_MULTIPLIER_CAP: 2.5
      CONDUCT_PROBATION_THRESHOLD: 12
      CONDUCT_SUSPENSION_THRESHOLD: 20
      HEARING_WINDOW_DAYS: 10
    precision: "integer points, round_half_up on the multiplied product"

  - name: break_housing_capacity_projection
    trigger: "Runs on the BreakHousingRequest REQUESTED -> APPROVED transition to decide whether the stay fits."
    algorithm: interval_merge
    formula: |
      # Break stays are CLOSED intervals on calendar dates: BOTH endpoints are
      # occupied. Two stays intersect when
      #     a.start_date <= b.end_date  AND  b.start_date <= a.end_date
      # so a stay ending 2026-12-24 and a stay starting 2026-12-24 DO collide
      # (they share that date). This is deliberately different from the
      # half-open duty-shift interval in validation priority 50.
      overlapping =
          BreakHousingRequest rows where
              room_id == candidate.room_id
          and id != candidate.id
          and status IN {APPROVED, CHECKED_IN}
          and start_date <= candidate.end_date
          and candidate.start_date <= end_date

      # AGGREGATE capacity, not pairwise exclusion: overlap alone is fine while
      # beds remain.
      projected_holds = count(overlapping) + 1
      approve when projected_holds <= Room.bed_capacity
      else ERR_BREAK_HOUSING_CAPACITY (409)
    input_set: "BreakHousingRequest rows for the candidate's room with status IN {APPROVED, CHECKED_IN}. REQUESTED, DENIED, REVOKED and CLOSED rows never occupy a bed."
    constants:
      MAX_BREAK_SPAN_DAYS: 45
    precision: "integer bed counts; dates compared as calendar dates, not instants"

  - name: floor_programming_compliance
    trigger: "Recomputed whenever a ProgramEvent on the floor reaches HELD, REIMBURSED or CANCELLED, and whenever Floor.programming_frozen changes. Writes Floor.held_program_count and Floor.programming_compliance_status."
    algorithm: threshold
    formula: |
      qualifying = ProgramEvent rows where floor_id == Floor.id
                   and status IN {HELD, REIMBURSED}
      held_program_count = count(qualifying)
      has_educational    = any(e.category == EDUCATIONAL for e in qualifying)
      has_wellness       = any(e.category == WELLNESS    for e in qualifying)

      programming_compliance_status =
            COMPLIANT when held_program_count >= Floor.required_programs_per_term
                       and has_educational and has_wellness
       else DEFICIENT when Floor.programming_frozen is true
       else PENDING
    input_set: "ProgramEvent rows on one floor with status IN {HELD, REIMBURSED}. PROPOSED, APPROVED, DENIED and CANCELLED events are excluded."
    constants:
      DEFAULT_REQUIRED_PROGRAMS_PER_TERM: 4
    precision: "integer counts; the threshold is >=, so exactly required_programs_per_term qualifies"

  - name: occupancy_census
    trigger: "Read on GET /residence-life/buildings/{building_id}/census and recomputed as the input to consolidation_plan."
    algorithm: aggregation
    formula: |
      rooms          = Room rows whose Floor.building_id == Building.id
      total_beds     = sum over rooms of bed_capacity
      occupied_beds  = sum over rooms of occupied_beds
      offline_room_count     = count of rooms with status IN {OFFLINE, CONSOLIDATED}
      underfilled_room_count = count of rooms with status == OCCUPIED
                               and 1 <= occupied_beds < bed_capacity
      vacancy_rate   = 0 when total_beds == 0
                       else round_half_up((total_beds - occupied_beds) / total_beds, 4)
    input_set: "Every Room in the building regardless of status; OFFLINE and CONSOLIDATED rooms still contribute their bed_capacity to total_beds."
    constants: {}
    precision: "vacancy_rate to 4 decimal places, round_half_up; all counts are integers"

  - name: consolidation_plan
    trigger: "Runs on POST /residence-life/buildings/{building_id}/consolidation for both mode=PLAN and mode=EXECUTE."
    algorithm: waterfall_allocation
    formula: |
      # PRECONDITIONS (checked before any planning)
      #   occupancy_census.occupied_beds == 0        -> ERR_CENSUS_EMPTY (422)
      #   occupancy_census.vacancy_rate < CONSOLIDATION_MIN_VACANCY_RATE
      #                                              -> ERR_CONSOLIDATION_NOT_WARRANTED (409)
      #   Building.posture != OPEN                   -> ERR_BUILDING_NOT_OPEN (409)

      # (a) SOURCE ELIGIBILITY — rooms to empty out
      sources = rooms where status == OCCUPIED
                          and 1 <= occupied_beds < bed_capacity
      # STRICT inequality: a room with occupied_beds == bed_capacity is full and
      # is never a source. An empty candidate set is NOT an error.

      # (b) SOURCE ORDER — emptiest first, so the fewest students move
      sort sources by (occupied_beds ASC, bed_capacity DESC, created_at ASC)

      # (c) TARGET ELIGIBILITY AND ORDER — pack the fullest room that still has
      #     a free bed, so vacancies concentrate
      targets = rooms where status IN {AVAILABLE, OCCUPIED}
                          and occupied_beds < bed_capacity
                          and id not in the set of sources already emptied
      sort targets by (occupied_beds DESC, bed_capacity DESC, created_at ASC)

      # (d) WATERFALL — for each source in order, for each occupant of that
      #     source ordered by Student.created_at ASC, place the occupant in the
      #     first target with a free bed that is not the source itself. Target
      #     occupancy is updated after every placement, so ordering is
      #     load-bearing. A source whose occupants cannot all be placed is
      #     SKIPPED whole (partial evacuation is never planned).
      planned_move_count = number of (student, target) pairs produced

      # (e) EXECUTE only: apply every planned move, then each fully emptied
      #     source transitions OCCUPIED -> CONSOLIDATED. Building.assigned_bed_count
      #     is unchanged by the run: every move is a transfer, never a creation.
    input_set: "Every Room in the building plus the Student rows occupying them. Selection uses only occupied_beds, bed_capacity, status and created_at; Room.id and Student.id never influence the plan."
    constants:
      CONSOLIDATION_MIN_VACANCY_RATE: 0.25
    precision: "integer bed counts; ties broken by created_at ASC, never by id"

# ---------------------------------------------------------------------------
# 1.4 Validation Rules Table (evaluated in ascending priority; first failure wins)
# ---------------------------------------------------------------------------
validations:

  - priority: 1
    category: auth
    check: "Both X-User-Role and X-User-ID headers are present and non-empty."
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "X-User-Role is one of the five roles declared in the RBAC matrix."
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 5
    category: auth
    check: "The role is listed in the endpoint's roles[]."
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: all

  - priority: 8
    category: auth
    check: "For entity_backed roles acting on their own resource, X-User-ID equals the resource's owning foreign key: Student -> RAApplication.applicant_student_id / DamageCharge.student_id / RoomChangeCase.student_id; ResidentAssistant -> IncidentReport.filed_by_ra_id / RoomInspection.inspector_ra_id / DutyShift.assigned_ra_id."
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "POST /ra-applications/{id}/submit, POST /ra-applications/{id}/response, POST /damage-charges/{id}/appeal, POST /incident-reports/{id}/submit, POST /room-inspections/{id}/completion, POST /duty-shifts/{id}/swap (action=REQUEST), POST /duty-shifts/{id}/outcome (action IN {CHECK_IN, COMPLETE})"

  - priority: 10
    category: existence
    check: "Every resource named by a path segment exists, validated left to right."
    error_id: "ERR_BUILDING_NOT_FOUND | ERR_FLOOR_NOT_FOUND | ERR_ROOM_NOT_FOUND | ERR_STUDENT_NOT_FOUND | ERR_APPLICATION_NOT_FOUND | ERR_RA_NOT_FOUND | ERR_SHIFT_NOT_FOUND | ERR_INCIDENT_NOT_FOUND | ERR_CONDUCT_CASE_NOT_FOUND | ERR_INSPECTION_NOT_FOUND | ERR_CHARGE_NOT_FOUND | ERR_ROOM_CHANGE_CASE_NOT_FOUND | ERR_PROGRAM_EVENT_NOT_FOUND | ERR_BREAK_REQUEST_NOT_FOUND"
    http_status: 404
    applies_to: all

  - priority: 15
    category: business_constraint
    check: "Request body shape: every required input field is present, enums are members of their declared set, integers are within their declared range, datetimes parse as ISO 8601, dates parse as YYYY-MM-DD, DutyShift.end_at > start_at with duration <= 24h, BreakHousingRequest.end_date >= start_date with span <= MAX_BREAK_SPAN_DAYS, pagination limit in 1..100 and offset >= 0."
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all

  - priority: 20
    category: existence
    check: "Every foreign key supplied in the request body resolves to an existing row (floor_id, room_id, student_id, ra_id, replacement_ra_id, to_room_id, roommate_student_id, applicant_student_id, responsible_student_id)."
    error_id: "ERR_FLOOR_NOT_FOUND | ERR_ROOM_NOT_FOUND | ERR_STUDENT_NOT_FOUND | ERR_RA_NOT_FOUND"
    http_status: 404
    applies_to: "all POST endpoints carrying a foreign key in the body"

  - priority: 25
    category: state
    check: "The supplied expected_room_version / expected_student_version equals the parent's current version field."
    error_id: "ERR_STALE_ROOM_VERSION | ERR_STALE_STUDENT_VERSION"
    http_status: 412
    applies_to: "POST /room-inspections, POST /room-change-cases"

  - priority: 30
    category: state
    check: "The target resource is in a state from which the requested transition is declared in the state machine table."
    error_id: "ERR_APPLICATION_STATE_INVALID | ERR_RA_STATE_INVALID | ERR_SHIFT_STATE_INVALID | ERR_INCIDENT_STATE_INVALID | ERR_CONDUCT_CASE_STATE_INVALID | ERR_INSPECTION_STATE_INVALID | ERR_CHARGE_STATE_INVALID | ERR_PLACEMENT_STATE_INVALID | ERR_MEDIATION_STATE_INVALID | ERR_PROGRAM_STATE_INVALID | ERR_PROGRAM_NOT_HELD | ERR_BREAK_REQUEST_STATE_INVALID | ERR_INVALID_POSTURE_TRANSITION"
    http_status: 409
    applies_to: "every action endpoint that drives a state transition"

  - priority: 32
    category: state
    check: "Round caps on cyclic machines: RAApplication.revision_count < MAX_REVISION_ROUNDS before a REQUEST_REVISION; IncidentReport.return_count < MAX_RETURN_ROUNDS before a RETURN; RoomChangeCase.mediation_round < MAX_MEDIATION_ROUNDS before a SCHEDULE_SESSION; DamageCharge.appeal_outcome is null before an appeal."
    error_id: "ERR_REVISION_LIMIT_REACHED | ERR_RETURN_LIMIT_REACHED | ERR_MEDIATION_ROUND_LIMIT | ERR_APPEAL_ALREADY_RESOLVED"
    http_status: 409
    applies_to: "POST /ra-applications/{id}/decision, POST /incident-reports/{id}/triage, POST /room-change-cases/{id}/mediation, POST /damage-charges/{id}/appeal"

  - priority: 35
    category: state
    check: "Cross-entity posture gate: the Building owning the affected Room or Floor has posture == OPEN."
    error_id: ERR_BUILDING_NOT_OPEN
    http_status: 409
    applies_to: "POST /students/{id}/room-assignment (action=PLACE), POST /room-change-cases/{id}/placement-decision, POST /room-change-cases/{id}/placement-completion, POST /break-housing-requests/{id}/decision, POST /break-housing-requests/{id}/occupancy, POST /buildings/{id}/consolidation"

  - priority: 36
    category: state
    check: "Target-room availability gate: the room named by to_room_id or room_id has status IN {AVAILABLE, OCCUPIED} and occupied_beds < bed_capacity."
    error_id: "ERR_ROOM_NOT_AVAILABLE | ERR_ROOM_AT_CAPACITY"
    http_status: 409
    applies_to: "POST /students/{id}/room-assignment (action=PLACE), POST /room-change-cases/{id}/placement-request, POST /room-change-cases/{id}/placement-decision, POST /room-change-cases/{id}/placement-completion, POST /room-change-cases/{id}/placement-revert"

  - priority: 40
    category: business_safety
    check: "The RA named for a duty assignment, swap approval or auto-fill has certification_status == CERTIFIED."
    error_id: ERR_RA_NOT_CERTIFIED
    http_status: 409
    applies_to: "POST /duty-shifts/{id}/assignment, POST /duty-shifts/{id}/swap, POST /room-inspections/{id}/completion"

  - priority: 41
    category: business_safety
    check: "The RA named for a duty assignment, swap approval, inspection completion or program proposal has employment_status == ACTIVE."
    error_id: ERR_RA_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /duty-shifts/{id}/assignment, POST /duty-shifts/{id}/swap, POST /room-inspections, POST /room-inspections/{id}/completion, POST /program-events, POST /incident-reports"

  - priority: 42
    category: business_safety
    check: "Certification requires training_credits_earned >= CERTIFICATION_CREDIT_MIN. The comparison is >=, so exactly CERTIFICATION_CREDIT_MIN certifies."
    error_id: ERR_TRAINING_CREDITS_INSUFFICIENT
    http_status: 409
    applies_to: "POST /ras/{id}/certification (action=CERTIFY)"

  - priority: 43
    category: business_safety
    check: "Certification requires completed_module_codes to contain every code in MANDATORY_MODULE_CODES."
    error_id: ERR_MANDATORY_MODULE_MISSING
    http_status: 409
    applies_to: "POST /ras/{id}/certification (action=CERTIFY)"

  - priority: 44
    category: business_safety
    check: "A module code already present in completed_module_codes cannot be logged again; credits are never double counted."
    error_id: ERR_MODULE_ALREADY_COMPLETED
    http_status: 409
    applies_to: "POST /ras/{id}/training-records"

  - priority: 45
    category: business_safety
    check: "Segregation of duties: the ConductOfficer deciding a case (X-User-ID) must differ from ConductCase.scheduled_by_user_id."
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /conduct-cases/{id}/decision"

  - priority: 46
    category: business_safety
    check: "An RA may not file an incident report naming their own Student record as subject_student_id."
    error_id: ERR_SELF_REPORT_FORBIDDEN
    http_status: 422
    applies_to: "POST /incident-reports"

  - priority: 47
    category: business_safety
    check: "A student with judicial_hold == true cannot have a room-change placement approved; a student with conduct_standing == SUSPENDED cannot be billed or have a placement requested."
    error_id: "ERR_JUDICIAL_HOLD | ERR_STUDENT_ON_PROBATION"
    http_status: 409
    applies_to: "POST /room-change-cases/{id}/placement-decision, POST /room-change-cases/{id}/placement-request, POST /damage-charges/{id}/billing"

  - priority: 48
    category: business_safety
    check: "Break housing requires the student's break_housing_eligible == true and the Building's break_housing_enabled == true."
    error_id: "ERR_BREAK_HOUSING_DISABLED | ERR_STUDENT_ON_PROBATION"
    http_status: 409
    applies_to: "POST /break-housing-requests/{id}/decision (decision=APPROVE)"

  - priority: 50
    category: business_temporal
    check: "Duty coverage conflict on the RA as a resource. Shifts are HALF-OPEN intervals [start_at, end_at). A candidate shift conflicts with any shift already held by that RA (status IN {ASSIGNED, SWAP_PENDING, CHECKED_IN, COMPLETED}) when the intervals intersect, OR when the clear gap between them is strictly less than MIN_REST_MINUTES. A gap of exactly MIN_REST_MINUTES is allowed; back-to-back shifts (gap 0) are refused."
    error_id: ERR_DUTY_COVERAGE_CONFLICT
    http_status: 409
    applies_to: "POST /duty-shifts/{id}/assignment, POST /duty-shifts/{id}/swap (action IN {REQUEST, APPROVE}), POST /duty-shifts/{id}/auto-fill"

  - priority: 51
    category: business_temporal
    check: "A shift can only be assigned while start_at > logical clock now; check-in requires start_at <= now < end_at; complete requires now >= end_at; mark-missed requires now >= end_at."
    error_id: ERR_SHIFT_WINDOW_NOT_REACHED
    http_status: 409
    applies_to: "POST /duty-shifts/{id}/assignment, POST /duty-shifts/{id}/auto-fill, POST /duty-shifts/{id}/outcome"

  - priority: 52
    category: business_temporal
    check: "A conduct hearing must be scheduled strictly after the logical clock and no later than ConductCase.opened_at + HEARING_WINDOW_DAYS days."
    error_id: ERR_HEARING_WINDOW_EXCEEDED
    http_status: 409
    applies_to: "POST /conduct-cases/{id}/hearing"

  - priority: 53
    category: business_temporal
    check: "An appeal must arrive at or before DamageCharge.appeal_deadline_at on the logical clock."
    error_id: ERR_APPEAL_WINDOW_CLOSED
    http_status: 409
    applies_to: "POST /damage-charges/{id}/appeal"

  - priority: 60
    category: business_constraint
    check: "Break-housing aggregate capacity on the Room as a resource. Stays are CLOSED date intervals [start_date, end_date]; two stays collide when start_date <= other.end_date AND other.start_date <= end_date, so sharing a single boundary date IS a collision. Approval is refused when count(colliding APPROVED/CHECKED_IN stays) + 1 > Room.bed_capacity."
    error_id: ERR_BREAK_HOUSING_CAPACITY
    http_status: 409
    applies_to: "POST /break-housing-requests/{id}/decision (decision=APPROVE)"

  - priority: 61
    category: business_constraint
    check: "Uniqueness: Building.code, Student.email, Floor.floor_number per building_id, Room.room_number per floor_id, and one RAApplication per (applicant_student_id, term_code)."
    error_id: "ERR_DUPLICATE_BUILDING_CODE | ERR_DUPLICATE_STUDENT_EMAIL | ERR_DUPLICATE_FLOOR_NUMBER | ERR_DUPLICATE_ROOM_NUMBER | ERR_DUPLICATE_APPLICATION"
    http_status: 409
    applies_to: "POST /buildings, POST /students, POST /floors, POST /rooms, POST /ra-applications"

  - priority: 62
    category: business_constraint
    check: "The auto-fill candidate pool computed by emergency_shift_assignee_selection is non-empty."
    error_id: ERR_NO_ELIGIBLE_RA
    http_status: 422
    applies_to: "POST /duty-shifts/{id}/auto-fill"

  - priority: 63
    category: business_constraint
    check: "Consolidation requires occupancy_census.occupied_beds > 0, then vacancy_rate >= CONSOLIDATION_MIN_VACANCY_RATE. An empty SOURCE candidate set is NOT an error: the run returns 200 with planned_move_count == 0."
    error_id: "ERR_CENSUS_EMPTY | ERR_CONSOLIDATION_NOT_WARRANTED"
    http_status: 422
    applies_to: "POST /buildings/{id}/consolidation"

  - priority: 70
    category: business_referential
    check: "Floor coherence: a DutyShift's floor_id must equal the assigned RA's assigned_floor_id; an inspected Room's floor_id must equal the inspecting RA's assigned_floor_id; a ProgramEvent's floor_id must equal the organizing RA's assigned_floor_id."
    error_id: ERR_FLOOR_MISMATCH
    http_status: 422
    applies_to: "POST /duty-shifts/{id}/assignment, POST /duty-shifts/{id}/swap, POST /duty-shifts/{id}/auto-fill, POST /room-inspections, POST /program-events"

  - priority: 71
    category: business_referential
    check: "A RoomChangeCase's from_room_id must equal Student.current_room_id at creation, and to_room_id must differ from from_room_id."
    error_id: ERR_STUDENT_NOT_IN_ROOM
    http_status: 422
    applies_to: "POST /room-change-cases, POST /room-change-cases/{id}/placement-request"

  - priority: 80
    category: business_fiscal
    check: "Program approval requires Floor.programming_budget_cents > 0 and requested_amount_cents <= Floor.programming_available_cents."
    error_id: "ERR_PROGRAM_BUDGET_NOT_ALLOCATED | ERR_FLOOR_BUDGET_EXCEEDED"
    http_status: 409
    applies_to: "POST /program-events/{id}/decision (decision=APPROVE)"

  - priority: 81
    category: business_fiscal
    check: "Reimbursement requires max(0, program_reimbursement_amount - requested_amount_cents) <= Floor.programming_available_cents."
    error_id: ERR_FLOOR_BUDGET_EXCEEDED
    http_status: 409
    applies_to: "POST /program-events/{id}/reimbursement"

# ---------------------------------------------------------------------------
# 1.5 API Endpoint Table   (all paths sit under api_prefix /residence-life)
# ---------------------------------------------------------------------------
endpoints:

  # ---- reads: single resource -------------------------------------------
  - method: GET
    path: "/residence-life/buildings/{building_id}"
    description: "Fetch one residence hall with its computed bed_capacity, assigned_bed_count and posture."
    roles: [ResidenceDirector, ResidentAssistant, ConductOfficer, BursarOfficer, Student]
    code: 200
    input: []
    output: Building
    side_effects: []

  - method: GET
    path: "/residence-life/floors/{floor_id}"
    description: "Fetch one floor with its three programming buckets, compliance status and coverage status."
    roles: [ResidenceDirector, ResidentAssistant, ConductOfficer, BursarOfficer, Student]
    code: 200
    input: []
    output: Floor
    side_effects: []

  - method: GET
    path: "/residence-life/rooms/{room_id}"
    description: "Fetch one room with occupied_beds, status, condition_score and break_hold_count."
    roles: [ResidenceDirector, ResidentAssistant, ConductOfficer, BursarOfficer, Student]
    code: 200
    input: []
    output: Room
    side_effects: []

  - method: GET
    path: "/residence-life/students/{student_id}"
    description: "Fetch one resident with housing_status, conduct_standing, conduct_points, judicial_hold and damage_balance_cents."
    roles: [ResidenceDirector, ResidentAssistant, ConductOfficer, BursarOfficer, Student]
    code: 200
    input: []
    output: Student
    side_effects: []

