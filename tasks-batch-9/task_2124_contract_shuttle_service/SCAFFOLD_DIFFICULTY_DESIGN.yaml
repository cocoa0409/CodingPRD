            - call: "POST /service-contracts"
              payload: { client_name: "Dispute Loop Corp", site_type: "CORPORATE", base_rate_cents_per_service_hour: 9000, term_start_date: "2026-09-01", term_end_date: "2027-08-31", escalation_index_pct: 3.5, sla_on_time_threshold_pct: 92.00, penalty_rate_cents_per_missed_trip: 4500, ada_min_accessible_pct: 25.00 }
              as: ContractAdmin
              captures: { c8: $.data.id }
            - call: "POST /service-contracts/${c8}/activate"
              payload: {}
              as: ContractAdmin
            - call: "POST /routes"
              payload: { contract_id: "${c8}", name: "Single Loop", loop_minutes: 48, headway_minutes: 12, service_window_start_min: 420, service_window_end_min: 420, demand_forecast_pax_per_hour: 0, reference_seat_capacity: 20 }
              as: OpsPlanner
              captures: { r8: $.data.id }
            - call: "POST /vehicles"
              payload: { fleet_code: "SHV-501", seat_capacity: 20, is_ada_accessible: false, odometer_km: 1000, service_interval_km: 20000 }
              as: FleetManager
              captures: { v8: $.data.id }
            - call: "POST /drivers"
              payload: { full_name: "Omar Haddad", license_class: "CDL_B", ada_certified: false, max_duty_minutes_per_day: 480 }
              as: OpsPlanner
              captures: { d8: $.data.id }
            - call: "POST /routes/${r8}/publish"
              payload: { service_date: "2026-09-02" }
              as: OpsPlanner
            - call: "GET /trips"
              payload: { route_id: "${r8}", service_date: "2026-09-02" }
              as: OpsPlanner
              captures: { y1: "$.data[0].id" }
            - call: "POST /trips/${y1}/assign"
              payload: { vehicle_id: "${v8}", driver_id: "${d8}" }
              as: OpsPlanner
            - call: "POST /trips/${y1}/start"
              payload: { actual_departure_min: 423 }
              as: DriverUser
              as_user_id: "${d8}"
            - call: "POST /trips/${y1}/complete"
              payload: { actual_completion_min: 470, boarded: 11, alighted: 11, ada_boardings: 0 }
              as: DriverUser
              as_user_id: "${d8}"
            - call: "POST /service-period-reports"
              payload: { contract_id: "${c8}", period_start_date: "2026-09-01", period_end_date: "2026-09-30" }
              as: ClientLiaison
              captures: { rep4: $.data.id }
            - call: "POST /service-period-reports/${rep4}/submit"
              payload: {}
              as: ClientLiaison
