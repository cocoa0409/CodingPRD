  - { id: ERR_NOT_FOUND, http: 404, condition: "Resource id in path does not exist" }
  - { id: ERR_VALIDATION, http: 400, condition: "Missing required field, invalid enum, or malformed value" }
  - { id: ERR_MISSING_IDEMPOTENCY_KEY, http: 400, condition: "POST without Idempotency-Key header" }
  - { id: ERR_IDEMPOTENCY_REPLAY_MISMATCH, http: 409, condition: "Idempotency-Key reused with a different body" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_*_version does not match the parent's current version" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Target resource's own state machine rejects the transition" }
  - { id: ERR_COMMUNITY_NOT_OPEN, http: 409, condition: "Home start while community phase is not OPEN_FOR_SALES or SELLING_OUT" }
  - { id: ERR_INVALID_PHASE_TRANSITION, http: 409, condition: "advance-phase from CLOSED or out-of-order phase move" }
  - { id: ERR_HOME_NOT_COMPLETE, http: 409, condition: "Contract close while home build_stage != COMPLETE" }
  - { id: ERR_CONTRACT_NOT_ACTIVE, http: 409, condition: "Takedown execute while option contract is not ACTIVE" }
  - { id: ERR_CONTRACT_EXHAUSTED, http: 409, condition: "Takedown would exceed total_lots, or contract already EXHAUSTED" }
  - { id: ERR_TAKEDOWN_WINDOW_NOT_OPEN, http: 409, condition: "Takedown execute before window_start" }
  - { id: ERR_TAKEDOWN_WINDOW_EXPIRED, http: 409, condition: "Takedown execute after window_end (takedown flips to DEFAULTED)" }
  - { id: ERR_LOT_NOT_AVAILABLE, http: 409, condition: "Home start on a lot that is not BANKED" }
  - { id: ERR_HOME_NOT_UNSOLD, http: 409, condition: "Sales contract create on a home whose sales_status != UNSOLD" }
  - { id: ERR_STARTS_QUOTA_EXCEEDED, http: 409, condition: "Home start when pacing plan quota remaining is 0" }
  - { id: ERR_STARTS_BLOCKED_OVERHELD, http: 409, condition: "Home start while community posture is OVERHELD" }
  - { id: ERR_NO_CAPACITY_REMAINING, http: 409, condition: "No FRAMING commitment covering clock with remaining_units > 0" }
  - { id: ERR_NO_PUBLISHED_PACING_PLAN, http: 409, condition: "Home start without a PUBLISHED pacing plan covering the clock" }
  - { id: ERR_CAPACITY_PERIOD_OVERLAP, http: 409, condition: "Commitment period overlaps another commitment of same partner+community (half-open; adjacency allowed)" }
  - { id: ERR_CAPACITY_BELOW_ALLOCATED, http: 409, condition: "Reduce would set committed_units below allocated_units" }
  - { id: ERR_INCENTIVE_WINDOW_CONFLICT, http: 409, condition: "Same-type, same-series incentive windows overlap or lack the 7-day buffer" }
  - { id: ERR_SERIES_BAND_OVERLAP, http: 422, condition: "Product series price band overlaps another series in the community" }
  - { id: ERR_PRICE_OUT_OF_SERIES_BAND, http: 422, condition: "Home gross price outside its series band" }
  - { id: ERR_PRICE_BELOW_NET_FLOOR, http: 422, condition: "Approve with contract_price_cents < home.net_effective_price_cents" }
  - { id: ERR_SALES_CONTRACT_NOT_TERMINABLE, http: 409, condition: "Terminate a CLOSED or already TERMINATED contract" }

# =============================================================================
# Table 7: RBAC Matrix
# =============================================================================
roles:
  - name: DIVISION_PRESIDENT
    description: "Division executive; owns communities, phase moves, pacing plan publication, trade partners, and the logical clock"
    identity: opaque
    exclusive_operations:
      - "POST /communities"
      - "POST /communities/{id}/advance-phase"
      - "POST /communities/{id}/pacing-plans"
      - "POST /trade-partners"
      - "POST /_clock/set_current_utc"
    shared_operations: ["All GET endpoints"]

  - name: LAND_MANAGER
    description: "Land acquisition manager; owns parcels, option contracts, and takedowns"
    identity: opaque
    exclusive_operations:
      - "POST /land-parcels"
      - "POST /option-contracts (+ execute, cure, takedowns)"
      - "POST /takedowns/{id}/execute"
    shared_operations: ["All GET endpoints"]

  - name: COMMUNITY_MANAGER
    description: "Community operator; opens communities, manages series, starts homes, deploys incentives, approves/closes sales"
    identity: opaque
    exclusive_operations:
      - "POST /communities/{id}/open"
      - "POST /communities/{id}/product-series"
      - "POST /communities/{id}/homes"
      - "POST /communities/{id}/incentives"
      - "POST /incentives/{id}/cancel"
      - "POST /homes/{id}/advance-stage"
      - "POST /sales-contracts/{id}/approve"
      - "POST /sales-contracts/{id}/close"
    shared_operations: ["All GET endpoints"]

  - name: SALES_AGENT
    description: "Sales agent; writes and renegotiates/terminates sales contracts"
    identity: opaque
    exclusive_operations:
      - "POST /sales-contracts"
      - "POST /sales-contracts/{id}/renegotiate"
      - "POST /sales-contracts/{id}/terminate"
    shared_operations: ["All GET endpoints"]

  - name: TRADE_PARTNER
    description: "Trade contractor; owns its capacity commitments (X-User-ID == TradePartner.id)"
    identity: entity_backed:TradePartner
    exclusive_operations:
      - "POST /trade-partners/{id}/capacity-commitments (own id only)"
      - "POST /capacity-commitments/{id}/reduce (own commitments only)"
    shared_operations: ["All GET endpoints"]
