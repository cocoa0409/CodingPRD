              captures: { rd_id: $.data.id, instr: $.data.instrument_number, bk: $.data.book }
          assert:
            - "RecordedDocument.${rd_id}.instrument_number == 1000002"
            - "RecordedDocument.${rd_id}.book == 1"
            - "RecordingOffice.${off_id}.next_instrument_number == 1000003"
            - "RecordingOffice.${off_id}.current_book == 2"
            - "RecordingOffice.${off_id}.documents_in_current_book == 0"
            - "RecordingOffice.${off_id}.current_page == 1"

      - name: reject_voids_assessment_then_releases_hold
        grounds:
          - state_machines.DocumentPackage.IN_EXAMINATION_to_REJECTED
          - entities.FeeAssessment.fields.status
          - entities.Submitter.fields.escrow_held_cents
        distinguishing_aspect: |
          Depth-3 cascade from the reject trigger (distinct from the record
          trigger): (1) reject creates a RejectionNotice which (2) voids the
          FINALIZED FeeAssessment (status→VOIDED), which (3) releases the escrow
          hold so Submitter.escrow_held_cents returns to 0.
        test_recipe:
          setup:
            - "Office, ACTIVE submitter with escrow deposit; DEED package ASSESSED (FINALIZED total 3500, hold 3500 on submitter)."
          setup_api_calls:
            - call: "POST /offices"
              payload: { county_name: "Acme", book_capacity: 3 }
              as: Clerk
              captures: { off_id: $.data.id }
            - call: "POST /submitters"
              payload: { name: "Title Co", submitter_type: "TITLE_COMPANY" }
              as: Clerk
              captures: { sub_id: $.data.id }
            - call: "POST /offices/${off_id}/deposit-escrow"
              payload: { submitter_id: "${sub_id}", amount_cents: 100000 }
              as: Clerk
            - call: "POST /packages"
              payload: { submitter_id: "${sub_id}", office_id: "${off_id}", doc_type: "DEED", declared_page_count: 1, declared_consideration_cents: 0, first_page_top_margin_inches: 3.0, notary_present: true }
              as: Submitter
              as_user_id: "${sub_id}"
              captures: { pkg_id: $.data.id }
            - call: "POST /packages/${pkg_id}/party-entries"
              payload: { party_role: "GRANTOR", party_name: "G" }
              as: Submitter
              as_user_id: "${sub_id}"
            - call: "POST /packages/${pkg_id}/party-entries"
              payload: { party_role: "GRANTEE", party_name: "E" }
              as: Submitter
              as_user_id: "${sub_id}"
            - call: "POST /packages/${pkg_id}/begin-examination"
              payload: {}
              as: Examiner
              as_user_id: "ex-1"
              captures: { pkg_v: $.data.version }
            - call: "POST /packages/${pkg_id}/assessments"
              payload: { verified_page_count: 1, verified_consideration_cents: 0, expected_package_version: "${pkg_v}" }
              as: Examiner
              as_user_id: "ex-1"
              captures: { fa_id: $.data.id }
          trigger:
            - call: "POST /packages/${pkg_id}/reject"
              payload: { reason_code: "LEGAL_DESCRIPTION", detail: "metes and bounds incomplete" }
              as: Examiner
              as_user_id: "ex-1"
              captures: { rn_id: $.data.id }
          assert:
            - "DocumentPackage.${pkg_id}.status == REJECTED"
            - "FeeAssessment.${fa_id}.status == VOIDED"
            - "Submitter.${sub_id}.escrow_held_cents == 0"

