          - entities.CmarProject
          - endpoints.POST_/gmp-proposals
        distinguishing_aspect: |
          The two rates that drive the pricing rule are per-project columns, not global
          constants. Two projects fed byte-identical proposal payloads must therefore price to
          different guaranteed maximum prices, and the four-decimal rate must be applied at
          full width rather than being rounded to a percentage first.
        test_recipe:
          setup:
            - "empty database"
            - "logical clock at 2026-08-01T00:00:00Z"
