  # ===========================================================================
  # Rule 4 — Transitive cascade chains from different triggers
  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: recall_cascade_batch_to_prep_to_prescription_depth3
        grounds:
          - state_machines.CompoundingBatch.RELEASED_to_RECALLED
          - state_machines.FinishedPreparation.DISPENSED_to_RECALLED
          - state_machines.Prescription.ACTIVE_to_FILLED
          - entities.Prescription.fields.units_dispensed
          - entities.Prescription.fields.status
        distinguishing_aspect: |
          Depth-3 cascade triggered by POST /recalls: recall mutates CompoundingBatch
          (RELEASED->RECALLED); that batch change mutates each child FinishedPreparation
          (DISPENSED->RECALLED); that prep change itself decrements the bound
          Prescription.units_dispensed and reverts FILLED->ACTIVE — each hop caused by
          the prior hop, not by the original recall call directly.
        test_recipe:
          setup:
            - "503A facility, clock 2026-06-01T00:00:00.000Z."
            - "MFR theoretical_yield_units=2, prescription units_prescribed=2."
            - "Batch compiled (2 preps), all QC passed, released; both preps dispensed against the prescription so units_dispensed=2 and prescription is FILLED."
          setup_api_calls:
            - call: "POST /pharmacy-compounding/facilities"
              payload: { name: "Casc A", registration_type: "503A", state_code: "CA" }
              as: SystemAdmin
              captures: { f_id: $.data.id }
            - call: "POST /pharmacy-compounding/facilities/${f_id}/_clock/set"
              payload: { to_iso8601: "2026-06-01T00:00:00.000Z" }
              as: SystemAdmin
            - call: "POST /pharmacy-compounding/master-formulation-records"
              payload: { facility_id: "${f_id}", name: "Naltrexone 4.5mg Cap", dosage_form: "ORAL_SOLID", default_bud_days_nonsterile: 90, theoretical_yield_units: 2, anticipatory_max_units: 500 }
