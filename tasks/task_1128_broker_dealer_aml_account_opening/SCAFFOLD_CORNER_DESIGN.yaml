        claim_type: conditional_action
        grounds: [entities.SARFiling.fields.continuing_review_count]
        distinguishing_aspect: "Continuing review with outcome NO_CONTINUING_ACTIVITY records the review (count 1, new_draft_filing_id null) and pushes next_review_due to clock+90 (2026-05-15 -> 2026-08-13) without creating a draft."
        test_recipe:
          setup: ["Case DECIDED_FILED; SAR filed at 2026-05-01; clock 2026-05-15."]
