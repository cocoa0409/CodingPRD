        distinguishing_aspect: "Both declared terminal states are locked: a second release on a RELEASED batch and a suspension on a CLOSED matter each return ERR_INVALID_STATE, leaving version, released_at and the ledger untouched."
        test_recipe:
          setup:
            - "the matter of release_bubbles_matter_to_closeout_then_close_completes, already CLOSED with its single batch RELEASED"
          setup_api_calls:
