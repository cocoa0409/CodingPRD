  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:

      - name: exception_window_adjacency_allowed_overlap_rejected
        grounds:
          - validations[priority=79]
          - entities.PolicyException.fields.effective_from
          - entities.PolicyException.fields.expires_at
          - errors[ERR_EXCEPTION_WINDOW_OVERLAP]
        distinguishing_aspect: |
          HALF-OPEN, un-inflated windows keyed by (customer_id, scope) where
          ADJACENCY IS ALLOWED: a window starting exactly at the incumbent's
          expires_at is accepted, and only a window starting one second earlier is
          rejected. No buffer is involved.
        test_recipe:
          setup:
            - "A HIGH_VALUE customer exists with account_status ACTIVE, so the priority 41 and 87 gates pass."
            - "Analyst AN1 exists to carry the RiskAnalyst X-User-ID."
            - "Exception E1 with scope AUTO_APPROVE_UNDER_AMOUNT covers [2026-08-01T00:00:00Z, 2026-09-01T00:00:00Z) and is in state REQUESTED, which priority 79 counts as blocking."
          setup_api_calls:
            - call: "POST /fraud/customers"
              payload: { email: "adj@example.com", home_country: "US", tier: "HIGH_VALUE" }
              as: CheckoutService
              captures: { cust_id: $.data.id }
            - call: "POST /fraud/analysts"
              payload: { display_name: "AN1 Senior", seniority: "SENIOR", skill_families: ["IDENTITY"], shift_capacity_cases: 3 }
              as: PlatformAdmin
              captures: { an1_id: $.data.id }
            - call: "POST /fraud/policy-exceptions"
              payload: { customer_id: "${cust_id}", scope: "AUTO_APPROVE_UNDER_AMOUNT", max_amount_cents: 100000, effective_from: "2026-08-01T00:00:00Z", expires_at: "2026-09-01T00:00:00Z", justification: "August concierge window" }
              as: RiskAnalyst
              as_user_id: "${an1_id}"
              captures: { e1_id: $.data.id }
          trigger:
            - call: "POST /fraud/policy-exceptions"
              payload: { customer_id: "${cust_id}", scope: "AUTO_APPROVE_UNDER_AMOUNT", max_amount_cents: 100000, effective_from: "2026-09-01T00:00:00Z", expires_at: "2026-10-01T00:00:00Z", justification: "September concierge window, exactly adjacent" }
              as: RiskAnalyst
              as_user_id: "${an1_id}"
              captures: { e2_id: $.data.id }
            - call: "POST /fraud/policy-exceptions"
              payload: { customer_id: "${cust_id}", scope: "AUTO_APPROVE_UNDER_AMOUNT", max_amount_cents: 100000, effective_from: "2026-08-31T23:59:59Z", expires_at: "2026-10-01T00:00:00Z", justification: "one second early, overlaps E1" }
              as: RiskAnalyst
              as_user_id: "${an1_id}"
          assert:
            - "First trigger call: HTTP status == 201"
            - "PolicyException.${e2_id}.state == REQUESTED"
            - "PolicyException.${e2_id}.effective_from == 2026-09-01T00:00:00Z"
            - "Second trigger call: HTTP status == 409 and error.error_id == ERR_EXCEPTION_WINDOW_OVERLAP"
            - "GET /fraud/policy-exceptions?customer_id=${cust_id} returns total_count == 2"
            - "PolicyException.${e1_id}.state == REQUESTED"

      - name: rule_pack_buffer_inflated_window_rejects_gap_below_freeze
        grounds:
          - validations[priority=75]
          - global_constants.RULE_PACK_ACTIVATION_FREEZE_SECONDS
          - state_machines.RulePack.DRAFT_to_ACTIVE
          - errors[ERR_RULE_PACK_WINDOW_OVERLAP]
        distinguishing_aspect: |
          The opposite adjacency semantics on a different resource: RulePack windows
          are INFLATED by the 3600s freeze buffer on both ends before the overlap
          test, so a gap of 3599s is REJECTED while a gap of exactly 3600s is
          accepted — the mirror image of the exception rule, where zero gap is fine.
          The check also fires only at activation, so both candidates can sit as
          DRAFTs simultaneously.
        test_recipe:
          setup:
            - "Pack P1 is ACTIVE over [2026-07-01T00:00:00Z, 2026-08-01T12:00:00Z)."
            - "DRAFT pack P2 starts at 2026-08-01T12:59:59Z — a 3599s gap, one second short of the buffer."
            - "DRAFT pack P3 starts at 2026-08-01T13:00:00Z — a gap of exactly 3600s."
            - "Both drafts carry one rule so the priority 78 empty-pack gate passes, and both are authored by eng-author-1 while eng-approver-2 activates them."
          setup_api_calls:
            - call: "POST /fraud/rule-packs"
              payload: { version_label: "P1-incumbent", blend_mode: "WEIGHTED", rule_weight: 0.40, model_weight: 0.60, review_floor_score: 40.00, decline_floor_score: 60.00, effective_from: "2026-07-01T00:00:00Z", effective_until: "2026-08-01T12:00:00Z" }
              as: PolicyEngineer
              as_user_id: "eng-author-1"
              captures: { p1_id: $.data.id }
            - call: "POST /fraud/rule-packs/${p1_id}/rules"
              payload: { code: "BEH_FAST_CHECKOUT", signal_family: "BEHAVIORAL", points: 20, evaluation_order: 10, hard_decline: false }
              as: PolicyEngineer
              as_user_id: "eng-author-1"
            - call: "POST /fraud/rule-packs/${p1_id}/activate"
              payload: {}
              as: PolicyEngineer
              as_user_id: "eng-approver-2"
            - call: "POST /fraud/rule-packs"
              payload: { version_label: "P2-gap-3599", blend_mode: "WEIGHTED", rule_weight: 0.40, model_weight: 0.60, review_floor_score: 40.00, decline_floor_score: 60.00, effective_from: "2026-08-01T12:59:59Z", effective_until: "2027-01-01T00:00:00Z" }
              as: PolicyEngineer
              as_user_id: "eng-author-1"
              captures: { p2_id: $.data.id }
            - call: "POST /fraud/rule-packs/${p2_id}/rules"
              payload: { code: "BEH_FAST_CHECKOUT", signal_family: "BEHAVIORAL", points: 20, evaluation_order: 10, hard_decline: false }
              as: PolicyEngineer
              as_user_id: "eng-author-1"
            - call: "POST /fraud/rule-packs"
              payload: { version_label: "P3-gap-3600", blend_mode: "WEIGHTED", rule_weight: 0.40, model_weight: 0.60, review_floor_score: 40.00, decline_floor_score: 60.00, effective_from: "2026-08-01T13:00:00Z", effective_until: "2027-01-01T00:00:00Z" }
              as: PolicyEngineer
              as_user_id: "eng-author-1"
              captures: { p3_id: $.data.id }
            - call: "POST /fraud/rule-packs/${p3_id}/rules"
              payload: { code: "BEH_FAST_CHECKOUT", signal_family: "BEHAVIORAL", points: 20, evaluation_order: 10, hard_decline: false }
              as: PolicyEngineer
              as_user_id: "eng-author-1"
          trigger:
            - call: "POST /fraud/rule-packs/${p2_id}/activate"
              payload: {}
              as: PolicyEngineer
              as_user_id: "eng-approver-2"
            - call: "POST /fraud/rule-packs/${p3_id}/activate"
              payload: {}
              as: PolicyEngineer
              as_user_id: "eng-approver-2"
          assert:
            - "First trigger call: HTTP status == 409 and error.error_id == ERR_RULE_PACK_WINDOW_OVERLAP"
            - "RulePack.${p2_id}.status == DRAFT"
            - "RulePack.${p2_id}.activated_at == null"
            - "Second trigger call: HTTP status == 200"
            - "RulePack.${p3_id}.status == ACTIVE"
            - "RulePack.${p1_id}.status == RETIRED"
            - "GET /fraud/rule-packs?status=DRAFT returns total_count == 1"

