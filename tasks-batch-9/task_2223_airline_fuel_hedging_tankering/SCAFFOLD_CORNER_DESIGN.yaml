        distinguishing_aspect: |
          trade_status TERMINATED is terminal on the trade dimension, so /execute and
          a repeat /terminate both return 409 ERR_INSTRUMENT_INVALID_TRADE_STATE. The
          PROPOSED -> TERMINATED edge already decremented open_instrument_count to 0
          and planned_coverage_pct_delta to 0.00, and the two rejected calls leave
          both untouched — no double decrement.
        test_recipe:
          setup:
            - "One SIZING HedgeProgram with consumption_basis_gallons 4400000 and one child instrument moved PROPOSED -> TERMINATED."
          setup_api_calls:
            - call: "POST /fuel/hedge-policies"
