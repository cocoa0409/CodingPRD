            - call: "POST /statute-profiles"
              payload: { state_code: "NC", authorized_methods: ["PETITION_MAJORITY"], required_service_types: ["POLICE"], signature_basis: "ASSESSED_VALUE", signature_threshold_pct: 50.00 }
