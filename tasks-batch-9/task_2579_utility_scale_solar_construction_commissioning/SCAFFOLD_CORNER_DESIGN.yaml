            - "GradingArea.${ga}.status is still GRADED — the refused DRAINAGE log changed no state"

      - name: pile_disposition_thresholds_select_across_all_four_outcomes
        claim_type: threshold
        grounds:
          - calculations.pile_drive_disposition
          - state_machines.Pile.PLANNED_to_OUT_OF_TOLERANCE
          - state_machines.Pile.OUT_OF_TOLERANCE_to_ACCEPTED
          - validations[priority=21]
        distinguishing_aspect: "The refusal flag SELECTS the embedment threshold and the plumb check is ANDed on top, so five identical-design piles land on three different statuses: 2700 mm (exactly 0.9 * 3000) with refusal is ACCEPTED, 2699 with refusal is REFUSED, 2999 without refusal is OUT_OF_TOLERANCE, and 12.0 mm plumb passes where 12.1 fails."
        test_recipe:
          setup:
            - "One project with an ACCEPTED grading area and one block with planned_pile_count 5, holding five PLANNED piles each with design_embedment_mm 3000"
          setup_api_calls:
            - call: "POST /solar/projects"
              payload: { name: "Threshold Wash", utility_name: "Basin Power", ac_capacity_kw: 100, dc_capacity_kw: 130, contract_value_cents: 10000000, retainage_pct: 0.05, ld_per_day_cents: 50000, ld_cap_pct: 0.05, sc_deadline_date: "2026-08-01", guaranteed_capacity_kw_ac: 100, guaranteed_performance_ratio: 0.69 }
              as: EpcProjectManager
              captures: { proj: $.data.id }
            - call: "POST /solar/projects/${proj}/grading-areas"
              payload: { area_code: "A1", permit_number: "CGP-2026-118", disturbed_acreage_limit: 40.00, bmp_inspection_interval_days: 14 }
              as: CivilSuperintendent
              captures: { ga: $.data.id }
            - call: "POST /solar/grading-areas/${ga}/earthwork-logs"
              payload: { activity_type: "CLEARING", work_start_at: "2026-08-01T12:00:00Z", work_end_at: "2026-08-01T20:00:00Z", acreage_disturbed_delta: 10.00 }
              as: CivilSuperintendent
            - call: "POST /solar/grading-areas/${ga}/earthwork-logs"
              payload: { activity_type: "GRADING", work_start_at: "2026-08-02T12:00:00Z", work_end_at: "2026-08-02T20:00:00Z", acreage_disturbed_delta: 8.00 }
              as: CivilSuperintendent
            - call: "POST /solar/grading-areas/${ga}/acceptance"
              payload: { compaction_test_pct: 96.5, drainage_inspection_passed: true }
              as: OwnerEngineer
            - call: "POST /solar/projects/${proj}/blocks"
              payload: { grading_area_id: "${ga}", block_code: "B1", dc_capacity_kw: 130, planned_pile_count: 5, planned_string_count: 1 }
              as: EpcProjectManager
              captures: { blk: $.data.id }
            - call: "POST /solar/blocks/${blk}/piles"
              payload: { row_index: 1, position_index: 1, design_embedment_mm: 3000 }
              as: InstallationForeman
              captures: { p1: $.data.id }
            - call: "POST /solar/blocks/${blk}/piles"
              payload: { row_index: 1, position_index: 2, design_embedment_mm: 3000 }
              as: InstallationForeman
              captures: { p2: $.data.id }
            - call: "POST /solar/blocks/${blk}/piles"
              payload: { row_index: 1, position_index: 3, design_embedment_mm: 3000 }
              as: InstallationForeman
              captures: { p3: $.data.id }
            - call: "POST /solar/blocks/${blk}/piles"
              payload: { row_index: 1, position_index: 4, design_embedment_mm: 3000 }
              as: InstallationForeman
              captures: { p4: $.data.id }
            - call: "POST /solar/blocks/${blk}/piles"
              payload: { row_index: 1, position_index: 5, design_embedment_mm: 3000 }
              as: InstallationForeman
              captures: { p5: $.data.id }
          trigger:
            - call: "POST /solar/piles/${p1}/drive-results"
              payload: { actual_embedment_mm: 3000, plumb_deviation_mm: 5.0, blow_count: 42, refusal: false }
              as: InstallationForeman
              captures: { s1: $.data.status }
            - call: "POST /solar/piles/${p2}/drive-results"
              payload: { actual_embedment_mm: 2999, plumb_deviation_mm: 5.0, blow_count: 44, refusal: false }
              as: InstallationForeman
              captures: { s2: $.data.status }
            - call: "POST /solar/piles/${p3}/drive-results"
              payload: { actual_embedment_mm: 2700, plumb_deviation_mm: 5.0, blow_count: 90, refusal: true }
              as: InstallationForeman
              captures: { s3: $.data.status }
            - call: "POST /solar/piles/${p4}/drive-results"
              payload: { actual_embedment_mm: 2800, plumb_deviation_mm: 12.1, blow_count: 88, refusal: true }
              as: InstallationForeman
              captures: { s4: $.data.status }
            - call: "POST /solar/piles/${p5}/drive-results"
              payload: { actual_embedment_mm: 2699, plumb_deviation_mm: 5.0, blow_count: 95, refusal: true }
              as: InstallationForeman
              captures: { s5: $.data.status }
            - call: "POST /solar/piles/${p2}/remediations"
              payload: { remediation_method: "SPLICE", actual_embedment_mm: 2650, plumb_deviation_mm: 5.0 }
              as: InstallationForeman
              captures: { eid: $.data.error_id }
            - call: "POST /solar/piles/${p2}/remediations"
              payload: { remediation_method: "SPLICE", actual_embedment_mm: 2700, plumb_deviation_mm: 12.0 }
              as: InstallationForeman
              captures: { s2b: $.data.status, meth: $.data.remediation_method, rem: $.data.remediated }
          assert:
            - "${s1} == ACCEPTED (no refusal, embedment meets design, plumb 5.0 <= 12.0)"
            - "${s2} == OUT_OF_TOLERANCE — without refusal the FULL design embedment is required, so 2999 < 3000 fails even though 2999 > 2700"
            - "${s3} == ACCEPTED — with refusal the threshold relaxes to exactly 2700 mm and the comparison is <, so 2700 is not below it"
            - "${s4} == OUT_OF_TOLERANCE — embedment clears 2700 but plumb 12.1 > PLUMB_TOLERANCE_MM 12.0"
            - "${s5} == REFUSED — 2699 < 2700 under the refusal branch"
            - "the 2650 mm remediation returns 422 with ${eid} == ERR_REMEDIATION_STILL_OUT_OF_TOLERANCE and Pile.${p2}.status stays OUT_OF_TOLERANCE with remediated == false"
            - "the 2700 mm / 12.0 mm remediation returns 200 with ${s2b} == ACCEPTED, ${meth} == SPLICE and ${rem} == true"
            - "Block.${blk}.piles_accepted_count == 3, piles_refused_count == 1 and mechanical_status == HOLD"

      - name: payroll_hour_aggregation_stub
