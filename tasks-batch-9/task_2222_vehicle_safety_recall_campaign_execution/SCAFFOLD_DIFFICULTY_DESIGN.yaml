  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: population_rule_half_open_window_allows_touch_rejects_intersection
        grounds:
          - validations[priority=30]
          - errors[ERR_POPULATION_RULE_OVERLAP]
          - entities.VehiclePopulationRule.fields.production_start_date
          - entities.VehiclePopulationRule.fields.production_end_date
        distinguishing_aspect: |
          HALF-OPEN interval semantics on VehiclePopulationRule: a second rule starting exactly on
          the first rule's production_end_date 2024-07-01 is accepted (201) because [start, end)
          windows that touch do not intersect, while a window starting 2024-06-15 inside the first
          is refused with ERR_POPULATION_RULE_OVERLAP.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-03T09:00:00Z; campaign 26V-101 in DRAFT."
            - "One INCLUDE rule for PLT1/MDLA/2024 covering [2024-01-01, 2024-07-01) with part numbers 1000..1999 already exists."
            - "No population run has been executed and no vehicles exist, so rule creation is unaffected by matching."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00Z" }
              as: SafetyEngineer
            - call: "POST /recall-campaigns"
              payload: { campaign_number: "26V-101", defect_type: "SAFETY_DEFECT", defect_description: "Driver airbag inflator may rupture on deployment", risk_severity: "MODERATE" }
              as: SafetyEngineer
              as_user_id: "u-eng-1"
              captures: { camp_id: $.data.id }
            - call: "POST /recall-campaigns/${camp_id}/population-rules"
              payload: { inclusion_mode: "INCLUDE", plant_code: "PLT1", model_code: "MDLA", model_year: 2024, production_start_date: "2024-01-01", production_end_date: "2024-07-01", part_number_low: 1000, part_number_high: 1999 }
              as: SafetyEngineer
              as_user_id: "u-eng-1"
              captures: { rule_a_id: $.data.id }
          trigger:
            - call: "POST /recall-campaigns/${camp_id}/population-rules"
              payload: { inclusion_mode: "INCLUDE", plant_code: "PLT1", model_code: "MDLA", model_year: 2024, production_start_date: "2024-07-01", production_end_date: "2025-01-01", part_number_low: 1000, part_number_high: 1999 }
              as: SafetyEngineer
              as_user_id: "u-eng-1"
              captures: { rule_b_id: $.data.id }
            - call: "POST /recall-campaigns/${camp_id}/population-rules"
              payload: { inclusion_mode: "INCLUDE", plant_code: "PLT1", model_code: "MDLA", model_year: 2024, production_start_date: "2024-06-15", production_end_date: "2024-09-01", part_number_low: 1000, part_number_high: 1999 }
              as: SafetyEngineer
              as_user_id: "u-eng-1"
          assert:
            - "the touching rule was created: VehiclePopulationRule.${rule_b_id}.production_start_date == 2024-07-01 and HTTP status was 201"
            - "the second trigger call returned HTTP status 409 with response.data.error_id == ERR_POPULATION_RULE_OVERLAP"
            - "GET /recall-campaigns/${camp_id}/population-rules returns total_count 2"
            - "VehiclePopulationRule.${rule_a_id}.production_end_date == 2024-07-01"

      - name: labor_operation_closed_window_rejects_touching_endpoint
        grounds:
          - validations[priority=31]
          - errors[ERR_LABOR_OP_WINDOW_CONFLICT]
          - entities.LaborOperation.fields.effective_from
          - entities.LaborOperation.fields.effective_to
        distinguishing_aspect: |
          CLOSED interval semantics on a different entity, LaborOperation: a second R101-01 window
          beginning exactly on the existing window's effective_to 2027-12-31 IS a conflict
          (ERR_LABOR_OP_WINDOW_CONFLICT), the inverse of the half-open population-rule rule, while
          a window starting the next day 2028-01-01 is accepted.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-03T09:00:00Z; campaign 26V-101 in DRAFT."
            - "LaborOperation R101-01 with flat_hours 1.10 is effective 2026-08-01..2027-12-31 (inclusive on both ends)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00Z" }
              as: SafetyEngineer
            - call: "POST /recall-campaigns"
              payload: { campaign_number: "26V-101", defect_type: "SAFETY_DEFECT", defect_description: "Driver airbag inflator may rupture on deployment", risk_severity: "MODERATE" }
              as: SafetyEngineer
              as_user_id: "u-eng-1"
              captures: { camp_id: $.data.id }
            - call: "POST /recall-campaigns/${camp_id}/labor-operations"
              payload: { labor_op_code: "R101-01", description: "Replace driver airbag inflator", flat_hours: 1.10, rate_type: "WARRANTY", effective_from: "2026-08-01", effective_to: "2027-12-31" }
              as: SafetyEngineer
              as_user_id: "u-eng-1"
              captures: { lop_a_id: $.data.id }
          trigger:
            - call: "POST /recall-campaigns/${camp_id}/labor-operations"
              payload: { labor_op_code: "R101-01", description: "Replace driver airbag inflator (rev B rate)", flat_hours: 1.20, rate_type: "WARRANTY", effective_from: "2027-12-31", effective_to: "2028-12-31" }
              as: SafetyEngineer
              as_user_id: "u-eng-1"
            - call: "POST /recall-campaigns/${camp_id}/labor-operations"
              payload: { labor_op_code: "R101-01", description: "Replace driver airbag inflator (rev B rate)", flat_hours: 1.20, rate_type: "WARRANTY", effective_from: "2028-01-01", effective_to: "2028-12-31" }
              as: SafetyEngineer
              as_user_id: "u-eng-1"
              captures: { lop_b_id: $.data.id }
          assert:
            - "the first trigger call returned HTTP status 409 with response.data.error_id == ERR_LABOR_OP_WINDOW_CONFLICT"
            - "the second trigger call returned HTTP status 201 and LaborOperation.${lop_b_id}.effective_from == 2028-01-01"
            - "GET /recall-campaigns/${camp_id}/labor-operations?labor_op_code=R101-01 returns total_count 2"
            - "LaborOperation.${lop_a_id}.effective_to == 2027-12-31 and LaborOperation.${lop_a_id}.flat_hours == 1.10"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: parts_units_conserved_across_supersede_and_reversal_of_consumed_allocation
        grounds:
          - calculations.parts_conservation_invariant
          - calculations.parts_allocation_grant
          - state_machines.RepairClaim.APPROVED_to_REVERSED
          - entities.RemedyPart.fields.unallocated_qty
          - entities.PartsAllocation.fields.revoked_reason
        distinguishing_aspect: |
          Conserved quantity = physical parts UNITS: total_procured_qty 100 must always equal
          unallocated_qty + sum(allocated - consumed) over ALLOCATED rows + consumed_qty, and
          because the reversed claim's source allocation was already REVOKED by a supersede, the
          returned unit is credited to unallocated_qty (99) instead of to that allocation.
        test_recipe:
          setup:
