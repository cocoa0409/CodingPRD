            - { call: "POST /v1/liability-waivers", payload: { team_id: "${t}", facility_id: "${f}", waiver_version: "v1", signed_on: "2026-08-02" }, as: Handler, as_user_id: "${h}" }
            - { call: "POST /v1/visit-requests", payload: { requested_start: "2026-08-10T14:00:00Z", requested_end: "2026-08-10T15:00:00Z", visit_program: "GENERAL", priority: "ROUTINE" }, as: FacilityCoordinator, as_user_id: "${f}", captures: { r1: $.data.id, r1_v: $.data.version } }
            - { call: "POST /v1/visit-requests", payload: { requested_start: "2026-08-12T09:00:00Z", requested_end: "2026-08-12T09:30:00Z", visit_program: "READING", priority: "HIGH" }, as: FacilityCoordinator, as_user_id: "${f}", captures: { r2: $.data.id } }
          trigger:
            - { call: "POST /v1/visit-requests/${r1}/offers", payload: { team_id: "${t}", expected_visit_request_version: "${r1_v}" }, as: ProgramAdmin }
            - { call: "POST /v1/visit-requests/${r1}/decline", payload: {}, as: Handler, as_user_id: "${h}" }
            - { call: "GET /v1/visit-requests/${r1}", payload: {}, as: ProgramAdmin, captures: { r1_v2: $.data.version } }
            - { call: "POST /v1/visit-requests/${r1}/offers", payload: { team_id: "${t}", expected_visit_request_version: "${r1_v2}" }, as: ProgramAdmin }
            - { call: "POST /v1/visit-requests/${r1}/accept", payload: {}, as: Handler, as_user_id: "${h}", captures: { v1: $.data.id } }
            - { call: "POST /v1/visits/${v1}/cancel", payload: { reason: "handler conflict" }, as: Handler, as_user_id: "${h}" }
            - { call: "GET /v1/visit-requests?facility_id=${f}", payload: {}, as: ProgramAdmin }
            - { call: "GET /v1/visit-requests/${r1}", payload: {}, as: ProgramAdmin, captures: { r1_st: $.data.status, r1_dc: $.data.decline_count } }
          assert:
            - "GET /v1/visit-requests?facility_id=${f} returns total_count == 2 (cardinality conserved through the whole cycle; nothing created or lost)"
            - "r1_st == OPEN AND r1_dc == 1 (accept-then-cancel compensated back to OPEN; only the explicit decline counted)"
            - "Visit.${v1}.lifecycle_status == CANCELLED with cancel_reason HANDLER_CANCEL; hours_notice > 48 so Team.late_cancel_count stays 0"
