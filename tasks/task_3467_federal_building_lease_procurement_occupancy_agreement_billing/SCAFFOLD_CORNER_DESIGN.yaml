# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Breadth probe over SCAFFOLD.yaml §1.1–§1.7 per references/claim-extraction-guide.md.
# Instances already exercised by §1.8 are emitted as excluded_because stubs.
# =============================================================================
scaffold_corner_design:
  # ---------------------------------------------------------------------------
  - section: entities
    instances:
      - name: agency_create_returns_defaults
        claim_type: creation
        grounds: [entities.Agency, "endpoints[POST /leasing/agencies]"]
        distinguishing_aspect: "POST with both required fields returns 201 with server-minted id, created_at, version == 1, and status defaulting to ACTIVE."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-10-01T00:00:00Z" }, as: GSAAdmin }
          trigger:
            - { call: "POST /leasing/agencies", payload: { bureau_code: "BUR-301", name: "Forest Service" }, as: GSAAdmin, captures: { ag: $.data.id } }
          assert:
            - "Agency ${ag}: status == ACTIVE (default applied), version == 1"
            - "Agency ${ag}: bureau_code == 'BUR-301' and created_at is non-null"

      - name: agency_create_missing_required_bureau_code
        claim_type: required_fields
        grounds: [entities.Agency.fields.bureau_code, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "Omitting bureau_code (a required input with no default) is rejected with ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "POST /leasing/agencies", payload: { name: "Forest Service" }, as: GSAAdmin, captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_INVALID_REQUEST and no Agency is persisted (GET /leasing/agencies/${any} impossible)"

      - name: building_security_capability_out_of_range_rejected
        claim_type: type_constraints
        grounds: [entities.Building.fields.security_capability, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "security_capability is constrained to 1..5; 6 is rejected with ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "POST /leasing/buildings", payload: { building_name: "X", address: "1 A St", region_code: "R9", ownership_type: "FEDERALLY_OWNED", security_capability: 6, total_sf: 10000 }, as: GSAAdmin, captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_INVALID_REQUEST"

      - name: requirement_create_applies_initial_state_and_defaults
        claim_type: initial_state
        grounds: [state_machines.SpaceRequirement, entities.SpaceRequirement.fields.delivery_method]
        distinguishing_aspect: "A new requirement starts in DRAFT with delivery_method STANDARD and null computed fields (projection happens only at validate)."
        test_recipe:
          setup: ["agency exists"]
          setup_api_calls:
            - { call: "POST /leasing/agencies", payload: { bureau_code: "BUR-302", name: "Forest Service" }, as: GSAAdmin, captures: { ag: $.data.id } }
          trigger:
            - { call: "POST /leasing/space-requirements", payload: { agency_id: "${ag}", title: "Field Office", base_headcount: 120, annual_growth_pct: 0.01, target_occupancy_year: 2030, sf_per_person: 160, special_needs: [], region_code: "R4", mission_points: 10, population_points: 8, size_points: 6, criticality_points: 6 }, as: AgencyManager, as_user_id: "${ag}", captures: { req: $.data.id } }
          assert:
            - "SpaceRequirement ${req}: status == DRAFT, delivery_method == STANDARD, source_plan_id is null"
            - "projected_headcount, required_security_level, required_usable_sf are all null until validate"

      - name: requirement_create_computed_field_input_ignored
        claim_type: computed_fields
        grounds: [entities.SpaceRequirement.fields.projected_headcount]
        distinguishing_aspect: "Client-supplied projected_headcount: 999 is ignored by the server; the field stays null until validate computes it."
        test_recipe:
          setup: ["agency exists"]
          setup_api_calls:
            - { call: "POST /leasing/agencies", payload: { bureau_code: "BUR-303", name: "Forest Service" }, as: GSAAdmin, captures: { ag: $.data.id } }
          trigger:
            - { call: "POST /leasing/space-requirements", payload: { agency_id: "${ag}", title: "Field Office", base_headcount: 120, annual_growth_pct: 0.01, target_occupancy_year: 2030, sf_per_person: 160, special_needs: [], region_code: "R4", mission_points: 10, population_points: 8, size_points: 6, criticality_points: 6, projected_headcount: 999 }, as: AgencyManager, as_user_id: "${ag}", captures: { req: $.data.id } }
          assert:
            - "SpaceRequirement ${req}: projected_headcount is null (input ignored, not stored)"

      - name: get_missing_agency_returns_not_found
        claim_type: not_found
        grounds: ["errors[ERR_NOT_FOUND]", "endpoints[GET /leasing/agencies/{id}]"]
        distinguishing_aspect: "GET with a well-formed but nonexistent UUID returns 404 ERR_NOT_FOUND."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "GET /leasing/agencies/00000000-0000-0000-0000-000000000000", as: GSAAdmin, captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_NOT_FOUND (http 404)"

      - name: offer_list_pagination_and_requirement_filter
        claim_type: listing
        grounds: ["endpoints[GET /leasing/offers]", response_envelope]
        distinguishing_aspect: "Filtered list honors limit/offset and reports total_count and has_more across two pages."
        test_recipe:
          setup:
            - "Requirement SOLICITING with exactly two offers submitted"
          setup_api_calls:
            - { call: "POST /leasing/agencies", payload: { bureau_code: "BUR-304", name: "Forest Service" }, as: GSAAdmin, captures: { ag: $.data.id } }
            - { call: "POST /leasing/buildings", payload: { building_name: "Metro Tower", address: "100 Federal Plaza", region_code: "R9", ownership_type: "LEASED_STOCK", security_capability: 5, total_sf: 200000 }, as: GSAAdmin, captures: { bld: $.data.id } }
            - { call: "POST /leasing/buildings", payload: { building_name: "Riverside Annex", address: "200 River Rd", region_code: "R9", ownership_type: "LEASED_STOCK", security_capability: 5, total_sf: 200000 }, as: GSAAdmin, captures: { bld2: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-10-01T00:00:00Z" }, as: GSAAdmin }
            - { call: "POST /leasing/space-requirements", payload: { agency_id: "${ag}", title: "HQ Consolidation", base_headcount: 400, annual_growth_pct: 0.02, target_occupancy_year: 2031, sf_per_person: 150, special_needs: [{ need_type: "SCIF", sf: 2000 }], region_code: "R9", mission_points: 20, population_points: 15, size_points: 10, criticality_points: 8 }, as: AgencyManager, as_user_id: "${ag}", captures: { req: $.data.id } }
            - { call: "POST /leasing/space-requirements/${req}/submit", as: AgencyManager, as_user_id: "${ag}" }
            - { call: "POST /leasing/space-requirements/${req}/validate", as: GSALeasingOfficer }
            - { call: "POST /leasing/space-requirements/${req}/complete-market-survey", payload: { survey_summary: "Five buildings toured" }, as: GSALeasingOfficer }
            - { call: "POST /leasing/space-requirements/${req}/offers", payload: { building_id: "${bld}", lessor_name: "Metro REIT LLC", shell_rate_per_sf_yr_cents: 3000, operating_rate_per_sf_yr_cents: 900, base_year_tax_per_sf_yr_cents: 400, escalation_method: "BASE_YEAR_STOP", ti_allowance_per_sf_cents: 5000, free_rent_months: 3, term_years: 10, valid_until: "2027-12-31T00:00:00Z" }, as: LessorRep }
            - { call: "POST /leasing/space-requirements/${req}/offers", payload: { building_id: "${bld2}", lessor_name: "River Properties Inc", shell_rate_per_sf_yr_cents: 3100, operating_rate_per_sf_yr_cents: 880, base_year_tax_per_sf_yr_cents: 410, escalation_method: "CPI_INDEXED", ti_allowance_per_sf_cents: 4500, free_rent_months: 2, term_years: 10, valid_until: "2027-12-31T00:00:00Z" }, as: LessorRep }
          trigger:
            - { call: "GET /leasing/offers", payload: { requirement_id: "${req}", limit: 1, offset: 0 }, as: GSAAdmin, captures: { page1: $.data } }
            - { call: "GET /leasing/offers", payload: { requirement_id: "${req}", limit: 1, offset: 1 }, as: GSAAdmin }
          assert:
            - "Page 1: exactly 1 offer in data, total_count == 2, has_more == true"
            - "Page 2: exactly 1 offer in data, total_count == 2, has_more == false"
            - "The two pages contain different offer ids"

      - name: oa_create_tenancy_ambiguity_rejected
        claim_type: type_constraints
        grounds: ["validations[priority=10]", "errors[ERR_OA_TENANCY_AMBIGUOUS]"]
        distinguishing_aspect: "OA create requires exactly one of lease_id / building_id: presenting both (a commenced lease plus an owned building) or neither is rejected with ERR_OA_TENANCY_AMBIGUOUS."
        test_recipe:
          setup:
            - "Agency, owned building, and a commenced lease on a leased-stock building all exist"
          setup_api_calls:
            - { call: "POST /leasing/agencies", payload: { bureau_code: "BUR-305", name: "Forest Service" }, as: GSAAdmin, captures: { ag: $.data.id } }
            - { call: "POST /leasing/buildings", payload: { building_name: "Legacy Federal", address: "1 Constitution Ave", region_code: "R11", ownership_type: "FEDERALLY_OWNED", security_capability: 4, total_sf: 50000 }, as: GSAAdmin, captures: { bld_o: $.data.id } }
            - { call: "POST /leasing/buildings", payload: { building_name: "Metro Tower", address: "100 Federal Plaza", region_code: "R9", ownership_type: "LEASED_STOCK", security_capability: 5, total_sf: 200000 }, as: GSAAdmin, captures: { bld_l: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-10-01T00:00:00Z" }, as: GSAAdmin }
            - { call: "POST /leasing/space-requirements", payload: { agency_id: "${ag}", title: "HQ Consolidation", base_headcount: 400, annual_growth_pct: 0.02, target_occupancy_year: 2031, sf_per_person: 150, special_needs: [{ need_type: "SCIF", sf: 2000 }], region_code: "R9", mission_points: 20, population_points: 15, size_points: 10, criticality_points: 8 }, as: AgencyManager, as_user_id: "${ag}", captures: { req: $.data.id } }
            - { call: "POST /leasing/space-requirements/${req}/submit", as: AgencyManager, as_user_id: "${ag}" }
            - { call: "POST /leasing/space-requirements/${req}/validate", as: GSALeasingOfficer }
            - { call: "POST /leasing/space-requirements/${req}/complete-market-survey", payload: { survey_summary: "Five buildings toured" }, as: GSALeasingOfficer }
            - { call: "POST /leasing/space-requirements/${req}/offers", payload: { building_id: "${bld_l}", lessor_name: "Metro REIT LLC", shell_rate_per_sf_yr_cents: 3000, operating_rate_per_sf_yr_cents: 900, base_year_tax_per_sf_yr_cents: 400, escalation_method: "BASE_YEAR_STOP", ti_allowance_per_sf_cents: 5000, free_rent_months: 3, term_years: 10, valid_until: "2027-12-31T00:00:00Z" }, as: LessorRep, captures: { off: $.data.id } }
            - { call: "POST /leasing/offers/${off}/evaluate", as: GSALeasingOfficer }
            - { call: "POST /leasing/offers/${off}/select", as: GSALeasingOfficer, captures: { lease: $.data.id } }
            - { call: "POST /leasing/leases/${lease}/commence", payload: { commencement_date: "2027-01-01", ti_buildout_cost_cents: 400000000, ti_amort_method: "ANNUITY" }, as: GSALeasingOfficer }
          trigger:
            - { call: "POST /leasing/occupancy-agreements", payload: { lease_id: "${lease}", building_id: "${bld_o}", agency_id: "${ag}", assigned_sf: 1000, start_date: "2027-01-01", end_date: "2030-12-31" }, as: GSALeasingOfficer, captures: { err1: $.data.error_id } }
            - { call: "POST /leasing/occupancy-agreements", payload: { agency_id: "${ag}", assigned_sf: 1000, start_date: "2027-01-01", end_date: "2030-12-31" }, as: GSALeasingOfficer, captures: { err2: $.data.error_id } }
          assert:
            - "${err1} == ERR_OA_TENANCY_AMBIGUOUS (both tenancy fields present)"
            - "${err2} == ERR_OA_TENANCY_AMBIGUOUS (neither tenancy field present)"

      - name: oa_create_on_leased_stock_building_rejected
        claim_type: parent_relationships
        grounds: ["validations[priority=10]", "errors[ERR_BUILDING_NOT_OWNED]", entities.OccupancyAgreement.fields.building_id]
        distinguishing_aspect: "A building_id OA is only legal against FEDERALLY_OWNED stock; targeting a LEASED_STOCK building is rejected with ERR_BUILDING_NOT_OWNED."
        test_recipe:
          setup: ["agency and LEASED_STOCK building exist"]
          setup_api_calls:
            - { call: "POST /leasing/agencies", payload: { bureau_code: "BUR-306", name: "Forest Service" }, as: GSAAdmin, captures: { ag: $.data.id } }
            - { call: "POST /leasing/buildings", payload: { building_name: "Metro Tower", address: "100 Federal Plaza", region_code: "R9", ownership_type: "LEASED_STOCK", security_capability: 5, total_sf: 200000 }, as: GSAAdmin, captures: { bld: $.data.id } }
          trigger:
            - { call: "POST /leasing/occupancy-agreements", payload: { building_id: "${bld}", agency_id: "${ag}", assigned_sf: 1000, start_date: "2027-01-01", end_date: "2030-12-31", shell_equivalent_rate_per_sf_yr_cents: 2800, operating_rate_per_sf_yr_cents: 800 }, as: GSALeasingOfficer, captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_BUILDING_NOT_OWNED"

      - name: owned_oa_missing_rate_inputs_rejected
        claim_type: required_fields
        grounds: ["validations[priority=10]", entities.OccupancyAgreement.fields.shell_equivalent_rate_per_sf_yr_cents, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "Owned OAs must carry shell_equivalent and operating rate inputs; omitting shell_equivalent_rate_per_sf_yr_cents is rejected with ERR_INVALID_REQUEST (conditional requiredness)."
        test_recipe:
          setup: ["agency and FEDERALLY_OWNED building exist"]
          setup_api_calls:
            - { call: "POST /leasing/agencies", payload: { bureau_code: "BUR-307", name: "Park Service" }, as: GSAAdmin, captures: { ag: $.data.id } }
            - { call: "POST /leasing/buildings", payload: { building_name: "Legacy Federal", address: "1 Constitution Ave", region_code: "R11", ownership_type: "FEDERALLY_OWNED", security_capability: 4, total_sf: 50000 }, as: GSAAdmin, captures: { bld: $.data.id } }
          trigger:
            - { call: "POST /leasing/occupancy-agreements", payload: { building_id: "${bld}", agency_id: "${ag}", assigned_sf: 1000, start_date: "2027-01-01", end_date: "2030-12-31", operating_rate_per_sf_yr_cents: 800 }, as: GSALeasingOfficer, captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_INVALID_REQUEST (shell_equivalent_rate_per_sf_yr_cents required for owned OAs)"
  # ---------------------------------------------------------------------------
  - section: state_machines
    instances:
      - name: requirement_return_resubmit_revision_cycle
        claim_type: valid_transition
        grounds: [state_machines.SpaceRequirement.SUBMITTED_to_NEEDS_REVISION, state_machines.SpaceRequirement.NEEDS_REVISION_to_SUBMITTED]
        distinguishing_aspect: "The requirement's revision loop SUBMITTED -> NEEDS_REVISION -> SUBMITTED -> VALIDATED is traversable repeatedly and each hop is observable."
        test_recipe:
          setup: ["agency exists; requirement created"]
          setup_api_calls:
            - { call: "POST /leasing/agencies", payload: { bureau_code: "BUR-310", name: "Forest Service" }, as: GSAAdmin, captures: { ag: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-10-01T00:00:00Z" }, as: GSAAdmin }
            - { call: "POST /leasing/space-requirements", payload: { agency_id: "${ag}", title: "Field Office", base_headcount: 120, annual_growth_pct: 0.01, target_occupancy_year: 2030, sf_per_person: 160, special_needs: [], region_code: "R4", mission_points: 10, population_points: 8, size_points: 6, criticality_points: 6 }, as: AgencyManager, as_user_id: "${ag}", captures: { req: $.data.id } }
            - { call: "POST /leasing/space-requirements/${req}/submit", as: AgencyManager, as_user_id: "${ag}" }
          trigger:
            - { call: "POST /leasing/space-requirements/${req}/return", as: GSALeasingOfficer }
            - { call: "POST /leasing/space-requirements/${req}/resubmit", as: AgencyManager, as_user_id: "${ag}" }
            - { call: "POST /leasing/space-requirements/${req}/validate", as: GSALeasingOfficer, captures: { lvl: $.data.required_security_level } }
          assert:
            - "After return: status == NEEDS_REVISION; after resubmit: status == SUBMITTED (cycle closed)"
            - "After validate: status == VALIDATED and required_security_level == 3 (30 points: 10+8+6+6, no SCIF)"

      - name: requirement_submit_from_validated_rejected
        claim_type: invalid_transition
        grounds: [state_machines.SpaceRequirement, "errors[ERR_INVALID_STATE_TRANSITION]"]
        distinguishing_aspect: "submit is defined only from DRAFT; a VALIDATED requirement rejects it with ERR_INVALID_STATE_TRANSITION."
        test_recipe:
          setup: ["requirement VALIDATED"]
          setup_api_calls:
            - { call: "POST /leasing/agencies", payload: { bureau_code: "BUR-311", name: "Forest Service" }, as: GSAAdmin, captures: { ag: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-10-01T00:00:00Z" }, as: GSAAdmin }
            - { call: "POST /leasing/space-requirements", payload: { agency_id: "${ag}", title: "Field Office", base_headcount: 120, annual_growth_pct: 0.01, target_occupancy_year: 2030, sf_per_person: 160, special_needs: [], region_code: "R4", mission_points: 10, population_points: 8, size_points: 6, criticality_points: 6 }, as: AgencyManager, as_user_id: "${ag}", captures: { req: $.data.id } }
            - { call: "POST /leasing/space-requirements/${req}/submit", as: AgencyManager, as_user_id: "${ag}" }
            - { call: "POST /leasing/space-requirements/${req}/validate", as: GSALeasingOfficer }
          trigger:
            - { call: "POST /leasing/space-requirements/${req}/submit", as: AgencyManager, as_user_id: "${ag}", captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_INVALID_STATE_TRANSITION and status remains VALIDATED"

      - name: requirement_awarded_terminal_lockdown
        claim_type: terminal_state_lockdown
        grounds: [state_machines.SpaceRequirement, "errors[ERR_INVALID_STATE_TRANSITION]"]
        distinguishing_aspect: "AWARDED is terminal: return on an awarded requirement is rejected and the award stands."
        test_recipe:
          setup: ["requirement AWARDED via full procurement"]
          setup_api_calls:
            - { call: "POST /leasing/agencies", payload: { bureau_code: "BUR-312", name: "Forest Service" }, as: GSAAdmin, captures: { ag: $.data.id } }
            - { call: "POST /leasing/buildings", payload: { building_name: "Metro Tower", address: "100 Federal Plaza", region_code: "R9", ownership_type: "LEASED_STOCK", security_capability: 5, total_sf: 200000 }, as: GSAAdmin, captures: { bld: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-10-01T00:00:00Z" }, as: GSAAdmin }
            - { call: "POST /leasing/space-requirements", payload: { agency_id: "${ag}", title: "HQ Consolidation", base_headcount: 400, annual_growth_pct: 0.02, target_occupancy_year: 2031, sf_per_person: 150, special_needs: [{ need_type: "SCIF", sf: 2000 }], region_code: "R9", mission_points: 20, population_points: 15, size_points: 10, criticality_points: 8 }, as: AgencyManager, as_user_id: "${ag}", captures: { req: $.data.id } }
            - { call: "POST /leasing/space-requirements/${req}/submit", as: AgencyManager, as_user_id: "${ag}" }
            - { call: "POST /leasing/space-requirements/${req}/validate", as: GSALeasingOfficer }
            - { call: "POST /leasing/space-requirements/${req}/complete-market-survey", payload: { survey_summary: "Five buildings toured" }, as: GSALeasingOfficer }
            - { call: "POST /leasing/space-requirements/${req}/offers", payload: { building_id: "${bld}", lessor_name: "Metro REIT LLC", shell_rate_per_sf_yr_cents: 3000, operating_rate_per_sf_yr_cents: 900, base_year_tax_per_sf_yr_cents: 400, escalation_method: "BASE_YEAR_STOP", ti_allowance_per_sf_cents: 5000, free_rent_months: 3, term_years: 10, valid_until: "2027-12-31T00:00:00Z" }, as: LessorRep, captures: { off: $.data.id } }
            - { call: "POST /leasing/offers/${off}/evaluate", as: GSALeasingOfficer }
            - { call: "POST /leasing/offers/${off}/select", as: GSALeasingOfficer }
          trigger:
            - { call: "POST /leasing/space-requirements/${req}/return", as: GSALeasingOfficer, captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_INVALID_STATE_TRANSITION; requirement remains AWARDED"

      - name: offer_select_before_evaluate_rejected
        claim_type: invalid_transition
        grounds: [state_machines.LeaseOffer.UNDER_EVALUATION_to_SELECTED, "errors[ERR_INVALID_STATE_TRANSITION]"]
        distinguishing_aspect: "select exists only from UNDER_EVALUATION; a SUBMITTED offer rejects it."
        test_recipe:
          setup: ["requirement SOLICITING with one SUBMITTED offer"]
          setup_api_calls:
            - { call: "POST /leasing/agencies", payload: { bureau_code: "BUR-313", name: "Forest Service" }, as: GSAAdmin, captures: { ag: $.data.id } }
            - { call: "POST /leasing/buildings", payload: { building_name: "Metro Tower", address: "100 Federal Plaza", region_code: "R9", ownership_type: "LEASED_STOCK", security_capability: 5, total_sf: 200000 }, as: GSAAdmin, captures: { bld: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-10-01T00:00:00Z" }, as: GSAAdmin }
            - { call: "POST /leasing/space-requirements", payload: { agency_id: "${ag}", title: "HQ Consolidation", base_headcount: 400, annual_growth_pct: 0.02, target_occupancy_year: 2031, sf_per_person: 150, special_needs: [{ need_type: "SCIF", sf: 2000 }], region_code: "R9", mission_points: 20, population_points: 15, size_points: 10, criticality_points: 8 }, as: AgencyManager, as_user_id: "${ag}", captures: { req: $.data.id } }
            - { call: "POST /leasing/space-requirements/${req}/submit", as: AgencyManager, as_user_id: "${ag}" }
            - { call: "POST /leasing/space-requirements/${req}/validate", as: GSALeasingOfficer }
            - { call: "POST /leasing/space-requirements/${req}/complete-market-survey", payload: { survey_summary: "Five buildings toured" }, as: GSALeasingOfficer }
            - { call: "POST /leasing/space-requirements/${req}/offers", payload: { building_id: "${bld}", lessor_name: "Metro REIT LLC", shell_rate_per_sf_yr_cents: 3000, operating_rate_per_sf_yr_cents: 900, base_year_tax_per_sf_yr_cents: 400, escalation_method: "BASE_YEAR_STOP", ti_allowance_per_sf_cents: 5000, free_rent_months: 3, term_years: 10, valid_until: "2027-12-31T00:00:00Z" }, as: LessorRep, captures: { off: $.data.id } }
          trigger:
            - { call: "POST /leasing/offers/${off}/select", as: GSALeasingOfficer, captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_INVALID_STATE_TRANSITION; offer remains SUBMITTED; no lease created"

      - name: offer_withdraw_after_selection_rejected
        claim_type: terminal_state_lockdown
        grounds: [state_machines.LeaseOffer, "errors[ERR_INVALID_STATE_TRANSITION]"]
        distinguishing_aspect: "SELECTED is terminal: withdraw on the awarded offer is rejected."
        test_recipe:
          setup: ["offer SELECTED (full award)"]
          setup_api_calls:
            - { call: "POST /leasing/agencies", payload: { bureau_code: "BUR-314", name: "Forest Service" }, as: GSAAdmin, captures: { ag: $.data.id } }
