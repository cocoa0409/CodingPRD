      - name: base_declaration_rounds_the_sum_not_the_components
        claim_type: correct_result
        grounds: [calculations.base_item_calorie_declaration]
        excluded_because:
          difficulty_instance: combinatorial_formula / base_declaration_sums_at_full_precision_then_rounds_once
          rationale: "That instance computes the multi-component sum at full precision and declares once, with the component-wise counter-example spelled out, which is the correct-result claim for this rule."

      - name: variable_range_endpoints_from_choice_group_bounds
        claim_type: correct_result
        grounds: [calculations.variable_item_calorie_range]
        excluded_because:
          difficulty_instance: combinatorial_formula / variable_range_nested_min_max_over_choice_groups
          rationale: "That instance covers EXACTLY_ONE, UP_TO_N and UNLIMITED groups in one formula and asserts both declared endpoints and the display text."

      - name: coverage_basis_variants_produce_different_counts
        claim_type: variant_divergence
        grounds: [calculations.covered_establishment_determination.variants]
        excluded_because:
          difficulty_instance: dual_variant_calc / coverage_basis_divergence_operating_only_vs_registered_all
          rationale: "That instance runs both bases over identical rows and asserts the 19-versus-20 divergence and the differing coverage_reason."

      - name: automatic_redetermination_always_uses_the_operating_only_basis
        claim_type: variant_selection
        grounds: [calculations.covered_establishment_determination.variants]
        excluded_because:
          difficulty_instance: dual_variant_calc / coverage_basis_divergence_operating_only_vs_registered_all
          rationale: "That instance shows the automatic re-determination picking OPERATING_ONLY even after REGISTERED_ALL was explicitly persisted, which is the variant-selection claim."

      - name: penalty_basis_variants_land_in_different_fee_tiers
        claim_type: variant_divergence
        grounds: [calculations.enforcement_penalty_assessment.variants]
        excluded_because:
          difficulty_instance: dual_variant_calc / penalty_basis_divergence_per_board_vs_per_establishment
          rationale: "That instance assesses both bases over the same three boards and asserts base, fee and total for each."

      - name: rescinding_and_reassessing_reconciles_both_ledgers
        claim_type: reconciliation
        grounds: [calculations.enforcement_penalty_assessment]
        excluded_because:
          difficulty_instance: dual_variant_calc / penalty_basis_divergence_per_board_vs_per_establishment
          rationale: "That instance rescinds the PER_BOARD penalty back to zero on both ledgers and then re-assesses on the PER_ESTABLISHMENT basis, asserting the delta at every step."

      - name: reprint_tolerance_band_is_inclusive
        claim_type: threshold
        grounds: [calculations.reprint_obligation_and_deadline]
        excluded_because:
          difficulty_instance: boundary_precision_check / reprint_tolerance_band_at_and_below_the_threshold
          rationale: "That instance tests a delta exactly equal to the tolerance and a delta below a larger tolerance, covering both sides of the >= comparison."

      - name: zero_item_branch_outranks_the_unit_branch
        claim_type: input_set_filtering
        grounds: [calculations.covered_establishment_determination]
        excluded_because:
          difficulty_instance: boundary_precision_check / zero_non_exempt_item_edge_outranks_unit_threshold
          rationale: "That instance shows a 20-unit brand with no non-exempt item reporting NO_STANDARD_MENU_ITEMS rather than BELOW_UNIT_THRESHOLD."

  # ===========================================================================
  - section: validations
    instances:
      - name: frozen_posture_blocks_menu_and_board_writes_but_never_reads
        claim_type: cross_entity_validation
        grounds:
          - validations[priority=19]
          - errors[ERR_BRAND_POSTURE_FROZEN]
          - entities.Brand.compliance_posture
        distinguishing_aspect: "The gate lives on an ancestor aggregate: one ESCALATE on an EnforcementAction freezes the Brand, after which POST /menu-items, POST /menu-boards and POST /menu-items/{id}/recipes all return ERR_BRAND_POSTURE_FROZEN (409) while every GET keeps working."
        test_recipe:
          setup:
            - "COVERED brand (20 OPERATING units) with one certified STANDARD item and a PUBLISHED disclosure packet."
            - "One EnforcementAction driven OPEN -> RESPONSE_SUBMITTED -> INFO_REQUESTED -> RESPONSE_SUBMITTED -> ESCALATED, which sets open_enforcement_escalated_count to 1."
