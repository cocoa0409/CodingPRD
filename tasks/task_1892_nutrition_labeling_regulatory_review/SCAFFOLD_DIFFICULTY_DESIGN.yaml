            - { call: "POST /api/products/${pid}/recipes", payload: { name: "v1", yield_factor: 1.0, lines: [ { ingredient_id: "${i_flour}", quantity_g: 120 } ] }, as: ClientRep, as_user_id: "${cid}" }
