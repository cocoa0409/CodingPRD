              as: Abstracter
              as_user_id: abs_751
              captures: { d_out: $.data.in_scope }
          assert:
            - "captured ssd == 1996-01-15"
            - "captured d_in == true (recording_date exactly at scope_start_date is IN scope — inclusive bound)"
            - "captured d_out == false (one day earlier is OUT of scope)"

