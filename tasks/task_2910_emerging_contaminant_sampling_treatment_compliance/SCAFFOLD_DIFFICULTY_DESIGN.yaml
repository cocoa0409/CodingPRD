# =============================================================================
# §1.8 Scaffold Difficulty Design — Test Targeting Index
# Task 2910 — Emerging Contaminant Sampling & Treatment Compliance
# =============================================================================
# Every instance below grounds in elements already declared in SCAFFOLD.yaml
# §1.1–§1.7. Deleting this file leaves the declared behaviour identical; it only
# makes coverage harder to audit.
#
# Fixture conventions used throughout (so every chain is reproducible from an
# empty database):
#   * The logical clock is left at its default 2026-08-01T00:00:00.000Z unless an
#     instance states otherwise; every collected_at and analyzed_at literal below
#     is therefore in the past and every pilot window has already opened.
#   * A Laboratory's own id is the X-User-ID a LaboratoryManager presents
#     (§1.7 identity: entity_backed:Laboratory), so every laboratory-role call
#     carries `as_user_id: "${lab_id}"`.
#   * ComplianceOfficer / TreatmentEngineer / FinanceOfficer / StateRegulator /
#     UtilityAdmin / SamplingTechnician are opaque identities; `as_user_id` is
#     pinned only where an audit id or a segregation-of-duties comparison matters.
#   * EntryPoint "EPTDS-01" with population_served 45000 always yields
#     served_account_count 18000, annual_billed_kgal 1080000 and
#     baseline_annual_revenue_cents 1026000000 (ceil(45000 / 2.5) = 18000,
#     18000 * 60 = 1080000, 1080000 * 950 = 1026000000).
#   * Every money literal, LRAA, ratio, score and rate figure in an `assert:` was
#     computed by executing the matching §1.3 `formula:` with decimal
#     round_half_up arithmetic — never estimated.

scaffold_difficulty_design:

  # ===========================================================================
  # §0.5 rule 1 — dual_variant_calc
  # Two calculations, each with two variants, on DIFFERENT ENTITY DOMAINS:
  # instance 1 averages laboratory concentrations across LabResult/EntryPoint;
  # instance 2 converts one CapitalProject money ladder into a household bill.
  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: lraa_compliance_and_planning_variants_diverge_on_two_censored_quarters
        grounds:
          - calculations.locational_running_annual_average
          - calculations.compliance_posture_derivation
          - calculations.violation_determination
          - entities.LabResult.fields.compliance_value_ng_per_l
          - entities.LabResult.fields.planning_value_ng_per_l
          - entities.ComplianceDetermination.fields.lraa_ng_per_l
          - entities.ComplianceDetermination.fields.planning_lraa_ng_per_l
          - concurrency_rules[entry-point-determination-supersede]
        distinguishing_aspect: |
          This instance's two variants live in the CONCENTRATION domain (LabResult values aggregated
          onto EntryPoint/ComplianceDetermination): compliance_lraa substitutes 0.00 for every
          non-detect while planning_lraa substitutes half the detection limit, so the same four
          ACCEPTED rows freeze lraa_ng_per_l 2.15 and planning_lraa_ng_per_l 2.60 on one row — a delta
          of exactly 0.45, which is 2 * (1.80 / 2) / 4. The money-domain instance below shares no
          entity, no field and no substitution rule with this one.
        test_recipe:
          setup:
            - "Contaminant PFOA: mcl 4.00, trigger 2.00, required_mrl 2.00, not a hazard-index member."
            - "Laboratory certified for METHOD_533 with lowest achievable detection limit 1.00 and daily capacity 5."
            - "EntryPoint EPTDS-01, GROUNDWATER, population 45000."
            - "Four monitoring periods, all analysed at detection limit 1.80: 2025Q3 reported 3.20 (detect), 2025Q4 reported 1.20 (non-detect), 2026Q1 reported 5.40 (detect), 2026Q2 reported 1.60 (non-detect). Every sample is shipped, received clean, reported and ACCEPTED, so all four samples are ANALYZED and inside the LRAA window."
            - "The logical clock stays at its default 2026-08-01T00:00:00.000Z."
          setup_api_calls:
            - call: "POST /contaminants"
              payload: { code: "PFOA", mcl_ng_per_l: 4.00, trigger_level_ng_per_l: 2.00, required_mrl_ng_per_l: 2.00, hazard_index_member: false }
              as: UtilityAdmin
              captures: { pfoa_id: "$.data.id" }
            - call: "POST /laboratories"
              payload: { name: "Northgate Analytical", certification_id: "CERT-001", certified_methods: ["METHOD_533"], lowest_achievable_dl_ng_per_l: 1.00, certification_expires_on: "2027-12-31T00:00:00.000Z", daily_analysis_capacity: 5 }
              as: UtilityAdmin
              captures: { lab_id: "$.data.id" }
            - call: "POST /entry-points"
              payload: { label: "EPTDS-01", source_type: "GROUNDWATER", population_served: 45000 }
              as: UtilityAdmin
              captures: { ep_id: "$.data.id" }
            - call: "POST /samples"
              payload: { entry_point_id: "${ep_id}", panel_contaminant_ids: ["${pfoa_id}"], monitoring_period: "2025Q3", collected_at: "2025-08-15T08:00:00.000Z", protocol: "LOW_FLOW_GRAB", ptfe_free_kit: true, field_blank_included: true, preservative_lot: "LOT-Q3" }
              as: SamplingTechnician
              captures: { s_q3_id: "$.data.id" }
            - call: "POST /samples/${s_q3_id}/ship"
              payload: { laboratory_id: "${lab_id}" }
              as: SamplingTechnician
            - call: "POST /samples/${s_q3_id}/receive"
              payload: { chain_of_custody_intact: true, field_blank_result_ng_per_l: 0.50 }
              as: LaboratoryManager
              as_user_id: "${lab_id}"
            - call: "POST /lab-results"
              payload: { sample_id: "${s_q3_id}", contaminant_id: "${pfoa_id}", method: "METHOD_533", reported_ng_per_l: 3.20, detection_limit_ng_per_l: 1.80, analyzed_at: "2025-08-20T08:00:00.000Z" }
              as: LaboratoryManager
              as_user_id: "${lab_id}"
              captures: { r_q3_id: "$.data.id" }
            - call: "POST /lab-results/${r_q3_id}/review"
              payload: { action: "ACCEPT" }
              as: ComplianceOfficer
              as_user_id: "officer-1"
            - call: "POST /samples"
              payload: { entry_point_id: "${ep_id}", panel_contaminant_ids: ["${pfoa_id}"], monitoring_period: "2025Q4", collected_at: "2025-11-14T08:00:00.000Z", protocol: "LOW_FLOW_GRAB", ptfe_free_kit: true, field_blank_included: true, preservative_lot: "LOT-Q4" }
              as: SamplingTechnician
              captures: { s_q4_id: "$.data.id" }
            - call: "POST /samples/${s_q4_id}/ship"
              payload: { laboratory_id: "${lab_id}" }
              as: SamplingTechnician
            - call: "POST /samples/${s_q4_id}/receive"
              payload: { chain_of_custody_intact: true, field_blank_result_ng_per_l: 0.50 }
              as: LaboratoryManager
              as_user_id: "${lab_id}"
            - call: "POST /lab-results"
              payload: { sample_id: "${s_q4_id}", contaminant_id: "${pfoa_id}", method: "METHOD_533", reported_ng_per_l: 1.20, detection_limit_ng_per_l: 1.80, analyzed_at: "2025-11-19T08:00:00.000Z" }
              as: LaboratoryManager
              as_user_id: "${lab_id}"
              captures: { r_q4_id: "$.data.id" }
            - call: "POST /lab-results/${r_q4_id}/review"
              payload: { action: "ACCEPT" }
              as: ComplianceOfficer
              as_user_id: "officer-1"
            - call: "POST /samples"
              payload: { entry_point_id: "${ep_id}", panel_contaminant_ids: ["${pfoa_id}"], monitoring_period: "2026Q1", collected_at: "2026-02-13T08:00:00.000Z", protocol: "LOW_FLOW_GRAB", ptfe_free_kit: true, field_blank_included: true, preservative_lot: "LOT-Q1" }
              as: SamplingTechnician
              captures: { s_q1_id: "$.data.id" }
            - call: "POST /samples/${s_q1_id}/ship"
              payload: { laboratory_id: "${lab_id}" }
              as: SamplingTechnician
            - call: "POST /samples/${s_q1_id}/receive"
              payload: { chain_of_custody_intact: true, field_blank_result_ng_per_l: 0.50 }
              as: LaboratoryManager
              as_user_id: "${lab_id}"
            - call: "POST /lab-results"
              payload: { sample_id: "${s_q1_id}", contaminant_id: "${pfoa_id}", method: "METHOD_533", reported_ng_per_l: 5.40, detection_limit_ng_per_l: 1.80, analyzed_at: "2026-02-18T08:00:00.000Z" }
              as: LaboratoryManager
              as_user_id: "${lab_id}"
              captures: { r_q1_id: "$.data.id" }
            - call: "POST /lab-results/${r_q1_id}/review"
              payload: { action: "ACCEPT" }
              as: ComplianceOfficer
              as_user_id: "officer-1"
            - call: "POST /samples"
              payload: { entry_point_id: "${ep_id}", panel_contaminant_ids: ["${pfoa_id}"], monitoring_period: "2026Q2", collected_at: "2026-05-15T08:00:00.000Z", protocol: "LOW_FLOW_GRAB", ptfe_free_kit: true, field_blank_included: true, preservative_lot: "LOT-Q2" }
              as: SamplingTechnician
              captures: { s_q2_id: "$.data.id" }
            - call: "POST /samples/${s_q2_id}/ship"
              payload: { laboratory_id: "${lab_id}" }
              as: SamplingTechnician
            - call: "POST /samples/${s_q2_id}/receive"
              payload: { chain_of_custody_intact: true, field_blank_result_ng_per_l: 0.50 }
              as: LaboratoryManager
              as_user_id: "${lab_id}"
            - call: "POST /lab-results"
              payload: { sample_id: "${s_q2_id}", contaminant_id: "${pfoa_id}", method: "METHOD_533", reported_ng_per_l: 1.60, detection_limit_ng_per_l: 1.80, analyzed_at: "2026-05-20T08:00:00.000Z" }
              as: LaboratoryManager
              as_user_id: "${lab_id}"
              captures: { r_q2_id: "$.data.id" }
            - call: "POST /lab-results/${r_q2_id}/review"
              payload: { action: "ACCEPT" }
              as: ComplianceOfficer
              as_user_id: "officer-1"
            - call: "GET /entry-points/${ep_id}"
              payload: {}
              as: ComplianceOfficer
              captures: { ep_v: "$.data.version" }
          trigger:
            - call: "POST /compliance-determinations"
              payload: { entry_point_id: "${ep_id}", contaminant_id: "${pfoa_id}", period_end: "2026Q2", expected_entry_point_version: "${ep_v}" }
              as: ComplianceOfficer
              as_user_id: "officer-1"
              captures: { det_id: "$.data.id" }
          assert:
            - "ComplianceDetermination.${det_id}.lraa_ng_per_l == 2.15"
            - "ComplianceDetermination.${det_id}.planning_lraa_ng_per_l == 2.60"
            - "ComplianceDetermination.${det_id}.planning_lraa_ng_per_l - ComplianceDetermination.${det_id}.lraa_ng_per_l == 0.45"
            - "ComplianceDetermination.${det_id}.quarters_used == 4"
            - "ComplianceDetermination.${det_id}.hazard_index == 0.00"
            - "ComplianceDetermination.${det_id}.determination == TRIGGER_EXCEEDED"
            - "ComplianceDetermination.${det_id}.violation_type == NONE"
            - "ComplianceDetermination.${det_id}.status == DRAFT"
            - "ComplianceDetermination.${det_id}.determined_by_user_id == \"officer-1\""
            - "LabResult.${r_q4_id}.censored == true"
            - "LabResult.${r_q4_id}.compliance_value_ng_per_l == 0.00"
            - "LabResult.${r_q4_id}.planning_value_ng_per_l == 0.90"
            - "LabResult.${r_q3_id}.censored == false"
            - "LabResult.${r_q3_id}.compliance_value_ng_per_l == 3.20"
            - "LabResult.${r_q3_id}.planning_value_ng_per_l == 3.20"
            - "EntryPoint.${ep_id}.max_compliance_ratio == 0.5375"
            - "EntryPoint.${ep_id}.compliance_posture == TRIGGERED"
            - "EntryPoint.${ep_id}.accepted_result_count == 4"
            - "EntryPoint.${ep_id}.consecutive_qualifying_quarters == 0"

      - name: bill_impact_uniform_and_volumetric_variants_diverge_on_one_capital_project
        grounds:
          - calculations.rate_impact_analysis
          - calculations.technology_score
          - calculations.technology_selection
          - entities.CapitalProject.fields.uniform_monthly_increase_cents
          - entities.CapitalProject.fields.volumetric_rate_increase_cents_per_kgal
          - entities.CapitalProject.fields.volumetric_monthly_increase_cents
          - entities.CapitalProject.fields.monthly_bill_increase_cents
          - state_machines.TreatmentEvaluation.PILOTING_to_SELECTED
        distinguishing_aspect: |
          This instance's two variants live in the MONEY domain on a single CapitalProject row: the
          uniform variant divides final_annual_requirement_cents 73675367 straight by 18000 accounts
          times 12 months (341 cents), while the volumetric variant first rounds a whole-cent rate per
          kgal (73675367 / 1080000 = 68) and only then converts it to a monthly bill (340 cents). The
          1-cent divergence is caused by an intermediate rounding, not by a censoring substitution, and
          no LabResult, EntryPoint concentration field or detection limit participates.
        test_recipe:
          setup:
            - "EntryPoint EPTDS-01 with population 45000, so served_account_count 18000, annual_billed_kgal 1080000 and baseline_annual_revenue_cents 1026000000."
            - "A voluntary TreatmentEvaluation with two completed pilots: GAC (influent 50.00, effluent 1.85, lifecycle 2550000000, capital estimate 680000000, O&M estimate 31000000, residuals 62.00, footprint 71.00, O&M complexity 83.00 -> technology_score 80.14) and IX (influent 50.00, effluent 4.00, lifecycle 1800000000, residuals 40.00, footprint 85.00, O&M complexity 70.00 -> technology_score 76.20)."
            - "The SELECT decision therefore picks GAC and creates a CapitalProject with capital_cost_cents 680000000, annual_om_cost_cents 31000000, rate_design UNIFORM, no funding and no cost recovery."
            - "Pilot windows are in May 2026, both already closed against the default clock 2026-08-01T00:00:00.000Z, and are 48 hours apart so they do not conflict."
          setup_api_calls:
            - call: "POST /entry-points"
              payload: { label: "EPTDS-01", source_type: "GROUNDWATER", population_served: 45000 }
              as: UtilityAdmin
              captures: { ep_id: "$.data.id" }
            - call: "POST /treatment-evaluations"
              payload: { entry_point_id: "${ep_id}", residuals_budget_cents: 250000 }
              as: TreatmentEngineer
              captures: { eval_id: "$.data.id" }
            - call: "POST /pilot-tests"
              payload: { treatment_evaluation_id: "${eval_id}", technology: "GAC", window_start_at: "2026-05-01T00:00:00.000Z", window_end_at: "2026-05-15T00:00:00.000Z", ebct_min: 10.00, lifecycle_cost_cents: 2550000000, capital_cost_estimate_cents: 680000000, annual_om_estimate_cents: 31000000, residuals_burden_score: 62.00, footprint_score: 71.00, om_complexity_score: 83.00 }
              as: TreatmentEngineer
              captures: { gac_id: "$.data.id" }
            - call: "POST /pilot-tests"
              payload: { treatment_evaluation_id: "${eval_id}", technology: "IX", window_start_at: "2026-05-17T00:00:00.000Z", window_end_at: "2026-05-31T00:00:00.000Z", ebct_min: 3.00, lifecycle_cost_cents: 1800000000, capital_cost_estimate_cents: 900000000, annual_om_estimate_cents: 40000000, residuals_burden_score: 40.00, footprint_score: 85.00, om_complexity_score: 70.00 }
              as: TreatmentEngineer
              captures: { ix_id: "$.data.id" }
            - call: "POST /pilot-tests/${gac_id}/start"
              payload: {}
              as: TreatmentEngineer
            - call: "POST /pilot-tests/${gac_id}/complete"
              payload: { influent_ng_per_l: 50.00, effluent_ng_per_l: 1.85, bed_volumes_treated: 25000, spent_media_kg: 800.00 }
              as: TreatmentEngineer
            - call: "POST /pilot-tests/${ix_id}/start"
              payload: {}
              as: TreatmentEngineer
            - call: "POST /pilot-tests/${ix_id}/complete"
              payload: { influent_ng_per_l: 50.00, effluent_ng_per_l: 4.00, bed_volumes_treated: 20000, spent_media_kg: 400.00 }
              as: TreatmentEngineer
            - call: "POST /treatment-evaluations/${eval_id}/decision"
              payload: { action: "SELECT", decision_note: "GAC scores highest and clears the removal floor." }
              as: TreatmentEngineer
            - call: "GET /capital-projects?treatment_evaluation_id=${eval_id}"
              payload: {}
              as: FinanceOfficer
              captures: { proj_id: "$.data[0].id" }
          trigger:
            - call: "PATCH /capital-projects/${proj_id}"
              payload: { rate_design: "VOLUMETRIC" }
              as: FinanceOfficer
          assert:
            - "CapitalProject.${proj_id}.selected_technology == GAC"
            - "CapitalProject.${proj_id}.capital_cost_cents == 680000000"
            - "CapitalProject.${proj_id}.annual_om_cost_cents == 31000000"
            - "CapitalProject.${proj_id}.local_share_cents == 680000000"
            - "CapitalProject.${proj_id}.borrowed_cents == 680000000"
            - "CapitalProject.${proj_id}.annual_debt_service_cents == 41586568"
            - "CapitalProject.${proj_id}.base_annual_requirement_cents == 72586568"
            - "CapitalProject.${proj_id}.provisional_rate_impact_pct == 7.07"
            - "CapitalProject.${proj_id}.surcharge_bp == 150"
            - "CapitalProject.${proj_id}.final_annual_requirement_cents == 73675367"
            - "CapitalProject.${proj_id}.rate_impact_pct == 7.18"
            - "CapitalProject.${proj_id}.uniform_monthly_increase_cents == 341"
            - "CapitalProject.${proj_id}.volumetric_rate_increase_cents_per_kgal == 68"
            - "CapitalProject.${proj_id}.volumetric_monthly_increase_cents == 340"
            - "CapitalProject.${proj_id}.monthly_bill_increase_cents == 340"
            - "CapitalProject.${proj_id}.rate_design == VOLUMETRIC"
            - "CapitalProject.${proj_id}.uniform_monthly_increase_cents != CapitalProject.${proj_id}.volumetric_monthly_increase_cents"
            - "PilotTest.${gac_id}.technology_score == 80.14"
            - "PilotTest.${ix_id}.technology_score == 76.20"
            - "PilotTest.${gac_id}.selected == true"
            - "PilotTest.${ix_id}.selected == false"
  # ===========================================================================
  # §0.5 rule 2 — combinatorial_formula
  # Three instances, one per required MODE:
  #   (a) hazard_index          — non-linear multi-input sum of ratios, one final rounding
  #   (b) technology_score      — nested rounding: each weighted term rounded before the sum
  #   (c) rate_impact_analysis  — pinned circular-looking sequential order, no fixed point
  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:

      - name: hazard_index_sums_three_unrounded_ratios_before_one_final_rounding
        grounds:
          - calculations.hazard_index
          - calculations.locational_running_annual_average
          - calculations.compliance_posture_derivation
          - entities.Contaminant.fields.hbwc_ng_per_l
          - entities.Contaminant.fields.hazard_index_member
          - entities.EntryPoint.fields.hazard_index
          - state_machines.Sample.RECEIVED_to_ANALYZED
        distinguishing_aspect: |
          MODE (a): a non-linear function of three independent inputs where each term is a quotient and
          the terms are summed at full precision, with exactly one rounding at the very end. Three
          hazard-index members each average 3.35 against an hbwc of 10.0, so the raw sum is
          0.335 + 0.335 + 0.335 = 1.005 and hazard_index is 1.01; an implementation that rounds each
          term to two places first would sum 0.34 * 3 = 1.02. The discriminator is the sum, not an
          ordering of separate formulas (that is instance (b)) and not a pinned multi-step ladder
          (that is instance (c)).
        test_recipe:
          setup:
            - "Three hazard-index Contaminants PFHXS, PFNA and HFPO_DA, each with mcl_ng_per_l 20.00, trigger_level_ng_per_l 10.00, required_mrl_ng_per_l 2.00, hazard_index_member true and hbwc_ng_per_l 10.0."
            - "Laboratory certified for METHOD_1633, lowest achievable detection limit 1.00, daily capacity 5."
            - "EntryPoint EPTDS-01, population 45000."
            - "One 2026Q2 sample whose panel is all three contaminants, shipped, received clean, with three reported results of 3.35 at detection limit 1.00 (all detects)."
            - "Two of the three results are already ACCEPTED in setup; because the panel is incomplete the sample is still RECEIVED, so EntryPoint.hazard_index is still 0.00 immediately before the trigger."
          setup_api_calls:
            - call: "POST /contaminants"
              payload: { code: "PFHXS", mcl_ng_per_l: 20.00, trigger_level_ng_per_l: 10.00, required_mrl_ng_per_l: 2.00, hazard_index_member: true, hbwc_ng_per_l: 10.0 }
              as: UtilityAdmin
              captures: { c1_id: "$.data.id" }
            - call: "POST /contaminants"
              payload: { code: "PFNA", mcl_ng_per_l: 20.00, trigger_level_ng_per_l: 10.00, required_mrl_ng_per_l: 2.00, hazard_index_member: true, hbwc_ng_per_l: 10.0 }
              as: UtilityAdmin
              captures: { c2_id: "$.data.id" }
            - call: "POST /contaminants"
              payload: { code: "HFPO_DA", mcl_ng_per_l: 20.00, trigger_level_ng_per_l: 10.00, required_mrl_ng_per_l: 2.00, hazard_index_member: true, hbwc_ng_per_l: 10.0 }
              as: UtilityAdmin
              captures: { c3_id: "$.data.id" }
            - call: "POST /laboratories"
              payload: { name: "Northgate Analytical", certification_id: "CERT-001", certified_methods: ["METHOD_1633"], lowest_achievable_dl_ng_per_l: 1.00, certification_expires_on: "2027-12-31T00:00:00.000Z", daily_analysis_capacity: 5 }
              as: UtilityAdmin
              captures: { lab_id: "$.data.id" }
            - call: "POST /entry-points"
              payload: { label: "EPTDS-01", source_type: "GROUNDWATER", population_served: 45000 }
              as: UtilityAdmin
              captures: { ep_id: "$.data.id" }
            - call: "POST /samples"
              payload: { entry_point_id: "${ep_id}", panel_contaminant_ids: ["${c1_id}", "${c2_id}", "${c3_id}"], monitoring_period: "2026Q2", collected_at: "2026-05-15T08:00:00.000Z", protocol: "LOW_FLOW_GRAB", ptfe_free_kit: true, field_blank_included: true, preservative_lot: "LOT-HI" }
              as: SamplingTechnician
              captures: { s_id: "$.data.id" }
            - call: "POST /samples/${s_id}/ship"
              payload: { laboratory_id: "${lab_id}" }
              as: SamplingTechnician
            - call: "POST /samples/${s_id}/receive"
              payload: { chain_of_custody_intact: true, field_blank_result_ng_per_l: 0.50 }
              as: LaboratoryManager
              as_user_id: "${lab_id}"
            - call: "POST /lab-results"
              payload: { sample_id: "${s_id}", contaminant_id: "${c1_id}", method: "METHOD_1633", reported_ng_per_l: 3.35, detection_limit_ng_per_l: 1.00, analyzed_at: "2026-05-20T08:00:00.000Z" }
              as: LaboratoryManager
              as_user_id: "${lab_id}"
              captures: { r1_id: "$.data.id" }
            - call: "POST /lab-results"
              payload: { sample_id: "${s_id}", contaminant_id: "${c2_id}", method: "METHOD_1633", reported_ng_per_l: 3.35, detection_limit_ng_per_l: 1.00, analyzed_at: "2026-05-20T08:00:00.000Z" }
              as: LaboratoryManager
              as_user_id: "${lab_id}"
              captures: { r2_id: "$.data.id" }
            - call: "POST /lab-results"
              payload: { sample_id: "${s_id}", contaminant_id: "${c3_id}", method: "METHOD_1633", reported_ng_per_l: 3.35, detection_limit_ng_per_l: 1.00, analyzed_at: "2026-05-20T08:00:00.000Z" }
              as: LaboratoryManager
              as_user_id: "${lab_id}"
              captures: { r3_id: "$.data.id" }
            - call: "POST /lab-results/${r1_id}/review"
              payload: { action: "ACCEPT" }
              as: ComplianceOfficer
              as_user_id: "officer-1"
            - call: "POST /lab-results/${r2_id}/review"
              payload: { action: "ACCEPT" }
              as: ComplianceOfficer
              as_user_id: "officer-1"
          trigger:
            - call: "POST /lab-results/${r3_id}/review"
              payload: { action: "ACCEPT" }
              as: ComplianceOfficer
              as_user_id: "officer-1"
          assert:
