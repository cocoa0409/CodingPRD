            - "pay_applied == 45000 and pay_over == 0"
            - "inv_status == PAID and inv_paid == 45000 and inv_balance == 0"
            - "standing_after == GOOD and exposure_after == 0 (hop 2 of the cascade)"
            - "order_billing == PAID (attached-order fan-out of the invoice transition)"

