            - call: "POST /inspections"
              payload: { property_id: "${p1}", inspector_id: "${i1}", purpose: "REAL_ESTATE", scheduled_start_at: "2026-08-03T13:00:00Z", scheduled_end_at: "2026-08-03T15:00:00Z" }
              as: FieldInspector
              as_user_id: "${i1}"
              captures: { e2: "$.data.error_id" }
            - call: "POST /inspections"
              payload: { property_id: "${p1}", inspector_id: "${i1}", purpose: "INITIAL", closing_date: "2026-09-01", scheduled_start_at: "2026-08-04T13:00:00Z", scheduled_end_at: "2026-08-04T15:00:00Z" }
              as: FieldInspector
