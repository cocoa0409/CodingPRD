      - name: station_not_found_on_booking
        claim_type: Violation to Error
        grounds: ["errors[ERR_STATION_NOT_FOUND]"]
        distinguishing_aspect: "Booking against a non-existent station id returns ERR_STATION_NOT_FOUND (404)."
        test_recipe:
          setup: ["A member; clock at default (future sessions)."]
          setup_api_calls:
            - call: "POST /api/members"
              payload: { email: "cor-snf@x.com", full_name: "SNF" }
              as: PlatformAdmin
              captures: { m_id: $.data.id }
          trigger:
            - call: "POST /api/tasting-sessions"
              payload: { station_id: "00000000-0000-0000-0000-000000000000", start_at: "2026-08-01T10:00:00Z", end_at: "2026-08-01T11:00:00Z" }
              as: Customer
              as_user_id: "${m_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_STATION_NOT_FOUND"

      - name: subscription_not_found_on_transition
        claim_type: Violation to Error
        grounds: ["errors[ERR_SUBSCRIPTION_NOT_FOUND]"]
        distinguishing_aspect: "Transitioning a non-existent subscription returns ERR_SUBSCRIPTION_NOT_FOUND (404)."
        test_recipe:
          setup: ["A member (no subscriptions)."]
          setup_api_calls:
            - call: "POST /api/members"
              payload: { email: "cor-subnf@x.com", full_name: "SubNF" }
              as: PlatformAdmin
              captures: { m_id: $.data.id }
          trigger:
            - call: "POST /api/subscriptions/00000000-0000-0000-0000-000000000000/transition"
              payload: { action: "PAUSE" }
              as: Customer
              as_user_id: "${m_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_SUBSCRIPTION_NOT_FOUND"

      - name: error_invalid_state_on_refulfill
        claim_type: Violation to Error
        grounds: ["errors[ERR_INVALID_STATE]"]
        excluded_because:
          difficulty_instance: state_beats_safety_on_second_fulfill
          rationale: "ERR_INVALID_STATE is the winning error of the named §1.8 priority-pair instance."
      - name: error_fusti_quarantined_on_fulfill
        claim_type: Violation to Error
        grounds: ["errors[ERR_FUSTI_QUARANTINED]"]
        excluded_because:
          difficulty_instance: fulfill_requires_reserved_fusti_in_service
          rationale: "ERR_FUSTI_QUARANTINED is asserted by the named §1.8 cross-entity instance."
      - name: error_wholesale_not_approved_on_order
        claim_type: Violation to Error
        grounds: ["errors[ERR_WHOLESALE_NOT_APPROVED]"]
        excluded_because:
          difficulty_instance: wholesale_order_requires_account_approved
