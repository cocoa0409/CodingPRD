              payload: { name: "Giant Wheel", ride_class: "MAJOR", footprint_sqft: 4010, power_amps: 300, crew_size_setup: 6, setup_hours: 8, axle_count: 4 }
              as: PlatformAdmin
              captures: { ride_v1a: $.data.id }
            - call: "POST /rides"
              payload: { name: "Tilt-A-Whirl", ride_class: "FLAT", footprint_sqft: 2003, power_amps: 120, crew_size_setup: 4, setup_hours: 5, axle_count: 2 }
              as: PlatformAdmin
              captures: { ride_v1b: $.data.id }
            - call: "POST /rides"
              payload: { name: "Kiddie Coaster", ride_class: "KIDDIE", footprint_sqft: 905, power_amps: 60, crew_size_setup: 2, setup_hours: 3, axle_count: 1 }
              as: PlatformAdmin
              captures: { ride_v1c: $.data.id }
            - call: "POST /routes"
              payload: { name: "2026 Midwest Swing", season_year: 2026, home_base_state: "OH" }
              as: RouteManager
              captures: { route_v1: $.data.id }
            - call: "POST /route-stops"
              payload: { route_id: "${route_v1}", venue_id: "${venue_v1c}", load_in_start: "2026-09-01T06:00:00Z", open_date: "2026-09-04T12:00:00Z", close_date: "2026-09-07T12:00:00Z", teardown_deadline: "2026-09-08T12:00:00Z" }
              as: RouteManager
              captures: { stop_v1: $.data.id, sv_v1a: $.data.version }
            - call: "POST /ride-allocations"
              payload: { ride_id: "${ride_v1a}", route_stop_id: "${stop_v1}", expected_route_stop_version: "${sv_v1a}" }
              as: LotBoss
              captures: { alloc_v1a: $.data.id }
            - call: "GET /route-stops/${stop_v1}"
              payload: {}
              as: LotBoss
              captures: { sv_v1b: $.data.version }
            - call: "POST /ride-allocations"
              payload: { ride_id: "${ride_v1b}", route_stop_id: "${stop_v1}", expected_route_stop_version: "${sv_v1b}" }
              as: LotBoss
              captures: { alloc_v1b: $.data.id }
            - call: "GET /route-stops/${stop_v1}"
              payload: {}
