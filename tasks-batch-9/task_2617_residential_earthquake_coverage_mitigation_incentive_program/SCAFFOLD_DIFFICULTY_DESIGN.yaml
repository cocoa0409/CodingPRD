            - "after reserving A: ${s1_res} == 250000, ${s1_dis} == 0, ${s1_unc} == 750000 (sum 1000000)"
            - "after reserving B: ${s2_res} == 550000, ${s2_dis} == 0, ${s2_unc} == 450000 (sum 1000000)"
