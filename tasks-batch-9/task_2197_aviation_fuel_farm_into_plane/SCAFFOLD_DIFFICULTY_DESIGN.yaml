            - call: "POST /storage-tanks/${tank_id}/samples"
              payload: { sample_purpose: "PERIODIC_TANK_QA" }
              as: QualityInspector
              as_user_id: "qi-alice"
              captures: { qa_sample_id: $.data.id }
            - call: "POST /quality-samples/${qa_sample_id}/test-results"
              payload: { water_reaction_rating: 1, particulate_mg_per_l: 0.5, conductivity_ps_per_m: 120.0, observed_density_kg_per_m3: 795.0, flash_point_c: 42.0 }
              as: QualityInspector
              as_user_id: "qi-alice"
            - call: "POST /storage-tanks/${tank_id}/quality-release"
