            - call: "POST /metrology/certificates"
              payload: { lot_id: "${lot_m}", certificate_code: "CERT-M", value_assignment_variant: WEIGHTED_MEAN, uncertainty_components: [], validity_days: 365, expected_lot_version: "${lot_m_v}" }
              as: CertificationOfficer
