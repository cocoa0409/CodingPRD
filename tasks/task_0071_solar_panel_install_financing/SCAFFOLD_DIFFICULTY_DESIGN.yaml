      - name: net_metering_kwh_bank_conserved_surplus_then_draw
        grounds:
          - calculations.net_metering_settlement
          - state_machines.NetMeterPeriod.OPEN_to_SETTLED
          - entities.NetMeterPeriod.fields.bank_kwh_after
        distinguishing_aspect: |
          Conserved quantity = banked kWh (energy, not capacity). A surplus period banks net +300
          (bank_kwh_after 300); a following deficit period of net -600 draws the full 300 from the
          bank (bank_kwh_after 0) and bills only the residual 300 kWh. Banked-in (300) equals
          drawn-out (300): the kWh bank conserves with zero leakage.
        test_recipe:
          setup:
            - "An OPERATIONAL project, full-retail utility (rate 15, ratio 1.0); period A net +300 settled, period B net -600 OPEN."
          setup_api_calls:
            - call: "POST /solar/homeowners"
