            - "${err_buffer} == ERR_PRESERVATION_WINDOW_CONFLICT with HTTP 409 for a 2-day gap after an end of 2026-08-10T00:00:00Z"
            - "SubpoenaRequest.${sub_to2b}.preservation_start_at == 2026-08-13T00:00:00Z and status == RECEIVED, proving a gap of exactly PRESERVATION_BUFFER_DAYS is accepted"
            - "GET /deposit-fraud/customers/${cust_to2}/subpoenas returns total_count == 2"
            - "GET /deposit-fraud/customers/${cust_to2} returns preservation_hold_active == true"

  # =========================================================================
  # Rule 9 — compensating-action invariants across different conserved quantities
  # =========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: deposit_then_override_release_then_return_restores_depositor_ledger_exactly
        grounds:
          - calculations.account_funds_invariant
          - state_machines.DepositItem.PENDING_to_RETURNED
          - state_machines.HoldOverrideReview.APPROVED_to_EXECUTED
          - entities.DepositAccount.fields.ledger_balance_cents
          - entities.DepositAccount.fields.available_balance_cents
        distinguishing_aspect: |
          Conserved quantity 1, depositor funds: the forward action (deposit 30000 plus a full 7500-cent
          early release) and its compensating action (settle RETURNED) must leave
          DepositAccount.ledger_balance_cents at its exact pre-deposit value of 0, with
          available_balance_cents + held_amount_cents == ledger_balance_cents holding at every step.
        test_recipe:
          setup:
            - "Logical clock at its 2026-08-01T00:00:00Z default."
            - "One ACTIVE DepositAccount with ledger_balance_cents 0, available_balance_cents 0 and held_amount_cents 0."
            - "One CHECK deposit of 30000 cents, an APPROVED HoldOverrideReview for the full 7500-cent hold prepared by analyst-1 and approved by sup-1."
          setup_api_calls:
            - call: "POST /deposit-fraud/customers"
              payload: { legal_name: "Lachlan Whitcombe", tin_last4: "1919", kyc_tier: "TIER_2", watchlist_hit: false }
              as: OperationsAdmin
              as_user_id: "ops-1"
              captures: { cust_ci1: "$.data.id" }
            - call: "POST /deposit-fraud/accounts"
              payload: { customer_id: "${cust_ci1}", product_type: "CHECKING", open_channel: "BRANCH" }
              as: OperationsAdmin
              as_user_id: "ops-1"
              captures: { acct_ci1: "$.data.id" }
            - call: "POST /deposit-fraud/accounts/${acct_ci1}/funding-sources"
              payload: { source_type: "EXTERNAL_ACH", routing_last4: "2828" }
              as: OperationsAdmin
              as_user_id: "ops-1"
              captures: { fs_ci1: "$.data.id", md_ci1: "$.data.micro_deposit_cents" }
            - call: "POST /deposit-fraud/funding-sources/${fs_ci1}/verification-attempts"
              payload: { micro_deposit_cents: "${md_ci1}" }
              as: OperationsAdmin
              as_user_id: "ops-1"
            - call: "POST /deposit-fraud/accounts/${acct_ci1}/deposit-items"
              payload: { item_type: "CHECK", amount_cents: 30000 }
              as: OperationsAdmin
              as_user_id: "ops-1"
              captures: { item_ci1: "$.data.id" }
            - call: "GET /deposit-fraud/deposit-items/${item_ci1}/holds"
              payload: {}
              as: FraudAnalyst
              as_user_id: "analyst-1"
              captures: { hold_ci1: "$.data[0].id", hold_ci1_v: "$.data[0].version" }
            - call: "POST /deposit-fraud/check-holds/${hold_ci1}/override-reviews"
              payload: { requested_release_cents: 7500, release_effective_at: "2026-08-01T00:00:00Z", release_window_end_at: "2026-08-02T00:00:00Z", justification: "Known drawer", expected_check_hold_version: "${hold_ci1_v}" }
              as: FraudAnalyst
              as_user_id: "analyst-1"
              captures: { rev_ci1: "$.data.id" }
            - call: "POST /deposit-fraud/hold-override-reviews/${rev_ci1}/submit"
              payload: {}
              as: FraudAnalyst
              as_user_id: "analyst-1"
            - call: "POST /deposit-fraud/hold-override-reviews/${rev_ci1}/decide"
              payload: { decision: "APPROVE", decision_note: "Within authority" }
              as: FraudSupervisor
              as_user_id: "sup-1"
          trigger:
            - call: "POST /deposit-fraud/hold-override-reviews/${rev_ci1}/execute"
              payload: {}
              as: FraudSupervisor
              as_user_id: "sup-1"
            - call: "GET /deposit-fraud/accounts/${acct_ci1}"
              payload: {}
              as: FraudAnalyst
              as_user_id: "analyst-1"
              captures: { ledger_mid: "$.data.ledger_balance_cents", avail_mid: "$.data.available_balance_cents", held_mid: "$.data.held_amount_cents" }
            - call: "POST /deposit-fraud/deposit-items/${item_ci1}/settle"
              payload: { outcome: "RETURNED", return_reason: "UNCOLLECTED_FUNDS" }
              as: OperationsAdmin
              as_user_id: "ops-1"
            - call: "GET /deposit-fraud/accounts/${acct_ci1}"
              payload: {}
              as: FraudAnalyst
              as_user_id: "analyst-1"
              captures: { ledger_final: "$.data.ledger_balance_cents", avail_final: "$.data.available_balance_cents", held_final: "$.data.held_amount_cents" }
          assert:
            - "${ledger_mid} == 30000"
            - "${avail_mid} == 30000"
            - "${held_mid} == 0"
            - "${ledger_final} == 0"
            - "${avail_final} == 0"
            - "${held_final} == 0"
            - "GET /deposit-fraud/check-holds/${hold_ci1} returns status == OVERRIDDEN and held_amount_cents == 0, unchanged by the return because it was no longer ACTIVE"
            - "GET /deposit-fraud/deposit-items/${item_ci1} returns status == RETURNED and return_reason == UNCOLLECTED_FUNDS"

      - name: charge_off_book_then_reverse_restores_net_bank_position_exactly
        grounds:
          - calculations.charge_off_pricing
          - calculations.account_funds_invariant
          - state_machines.ChargeOff.BOOKED_to_REVERSED
          - state_machines.DepositAccount.CHARGED_OFF_to_CLOSED
          - entities.ChargeOff.fields.ledger_balance_before_book_cents
          - entities.DepositAccount.fields.charged_off_amount_cents
        distinguishing_aspect: |
          Conserved quantity 2, the bank's recognised loss position
          net_bank_position_cents = ledger_balance_cents - charged_off_amount_cents — a different
          conserved quantity from depositor funds: booking 105000 cents leaves it at 0 and reversing
          restores ledger_balance_cents to the snapshot ledger_balance_before_book_cents of 0 with
          charged_off_amount_cents back to 0, leaving zero drift.
        test_recipe:
          setup:
            - "Logical clock at its 2026-08-01T00:00:00Z default."
            - "One Customer with no subpoena, so preservation_hold_active is false."
            - "One DepositAccount driven all the way to lifecycle_status CLOSED: funded and ACTIVE, then a MULE FraudCase opened, advanced, SUBSTANTIATED, a BsaReferral drafted, submitted and ACCEPTED, then the case closed."
            - "Account balances at that point: ledger_balance_cents 0, available_balance_cents 0, charged_off_amount_cents 0."
            - "An APPROVED ChargeOff with gross_loss_cents 120000 and collateral_offset_cents 20000, priced at base_net_cents 100000, recovery_fee_cents 5000 and net_charge_off_cents 105000."
          setup_api_calls:
            - call: "POST /deposit-fraud/customers"
              payload: { legal_name: "Anouk Delacroix", tin_last4: "5757", kyc_tier: "TIER_2", watchlist_hit: false }
              as: OperationsAdmin
              as_user_id: "ops-1"
              captures: { cust_ci2: "$.data.id" }
            - call: "POST /deposit-fraud/accounts"
              payload: { customer_id: "${cust_ci2}", product_type: "CHECKING", open_channel: "BRANCH" }
              as: OperationsAdmin
              as_user_id: "ops-1"
              captures: { acct_ci2: "$.data.id" }
            - call: "POST /deposit-fraud/accounts/${acct_ci2}/funding-sources"
              payload: { source_type: "EXTERNAL_ACH", routing_last4: "3636" }
              as: OperationsAdmin
              as_user_id: "ops-1"
              captures: { fs_ci2: "$.data.id", md_ci2: "$.data.micro_deposit_cents" }
            - call: "POST /deposit-fraud/funding-sources/${fs_ci2}/verification-attempts"
              payload: { micro_deposit_cents: "${md_ci2}" }
              as: OperationsAdmin
              as_user_id: "ops-1"
            - call: "POST /deposit-fraud/fraud-cases"
              payload: { primary_account_id: "${acct_ci2}", case_type: "MULE" }
              as: FraudAnalyst
              as_user_id: "analyst-1"
              captures: { case_ci2: "$.data.id" }
            - call: "POST /deposit-fraud/fraud-cases/${case_ci2}/advance"
              payload: {}
              as: FraudAnalyst
              as_user_id: "analyst-1"
            - call: "POST /deposit-fraud/fraud-cases/${case_ci2}/disposition"
              payload: { decision: "SUBSTANTIATE", disposition_note: "Mule activity confirmed" }
              as: FraudSupervisor
              as_user_id: "sup-1"
            - call: "POST /deposit-fraud/fraud-cases/${case_ci2}/bsa-referrals"
              payload: { narrative: "Account received and forwarded third-party funds within hours across six counterparties.", suspected_activity_code: "MULE_ACTIVITY" }
              as: FraudAnalyst
              as_user_id: "analyst-1"
              captures: { ref_ci2: "$.data.id" }
            - call: "POST /deposit-fraud/bsa-referrals/${ref_ci2}/submit"
              payload: {}
              as: FraudAnalyst
              as_user_id: "analyst-1"
            - call: "POST /deposit-fraud/bsa-referrals/${ref_ci2}/adjudicate"
              payload: { decision: "ACCEPT" }
              as: BsaOfficer
              as_user_id: "bsa-1"
            - call: "POST /deposit-fraud/fraud-cases/${case_ci2}/close"
              payload: {}
              as: FraudSupervisor
              as_user_id: "sup-1"
            - call: "GET /deposit-fraud/accounts/${acct_ci2}"
              payload: {}
              as: FraudAnalyst
              as_user_id: "analyst-1"
              captures: { acct_ci2_v: "$.data.version", ledger_pre_book: "$.data.ledger_balance_cents" }
            - call: "POST /deposit-fraud/accounts/${acct_ci2}/charge-offs"
              payload: { gross_loss_cents: 120000, collateral_offset_cents: 20000, expected_account_version: "${acct_ci2_v}" }
              as: FraudAnalyst
              as_user_id: "analyst-1"
              captures: { co_ci2: "$.data.id", base_net_ci2: "$.data.base_net_cents", fee_ci2: "$.data.recovery_fee_cents", net_ci2: "$.data.net_charge_off_cents" }
            - call: "POST /deposit-fraud/charge-offs/${co_ci2}/approve"
              payload: {}
              as: FraudSupervisor
              as_user_id: "sup-1"
          trigger:
            - call: "POST /deposit-fraud/charge-offs/${co_ci2}/book"
              payload: {}
              as: OperationsAdmin
              as_user_id: "ops-1"
              captures: { co_status_after_book: "$.data.status", snapshot_ci2: "$.data.ledger_balance_before_book_cents" }
            - call: "GET /deposit-fraud/accounts/${acct_ci2}"
              payload: {}
              as: FraudAnalyst
              as_user_id: "analyst-1"
              captures: { ledger_after_book: "$.data.ledger_balance_cents", charged_after_book: "$.data.charged_off_amount_cents", lifecycle_after_book: "$.data.lifecycle_status" }
            - call: "POST /deposit-fraud/charge-offs/${co_ci2}/reverse"
              payload: { reversal_reason: "Drawer paid in full; write-off rescinded" }
              as: FraudSupervisor
              as_user_id: "sup-1"
              captures: { co_status_after_reverse: "$.data.status" }
            - call: "GET /deposit-fraud/accounts/${acct_ci2}"
              payload: {}
              as: FraudAnalyst
              as_user_id: "analyst-1"
              captures: { ledger_after_reverse: "$.data.ledger_balance_cents", charged_after_reverse: "$.data.charged_off_amount_cents", lifecycle_after_reverse: "$.data.lifecycle_status" }
          assert:
            - "${ledger_pre_book} == 0"
            - "${base_net_ci2} == 100000"
            - "${fee_ci2} == 5000"
            - "${net_ci2} == 105000"
            - "${co_status_after_book} == REFERRED_TO_RECOVERY because 105000 >= RECOVERY_REFERRAL_MIN_CENTS 25000"
            - "${snapshot_ci2} == 0"
            - "${ledger_after_book} == 105000 and ${charged_after_book} == 105000, so ledger_balance_cents - charged_off_amount_cents == 0, the same net_bank_position_cents as before booking"
            - "${lifecycle_after_book} == CHARGED_OFF"
            - "${co_status_after_reverse} == REVERSED"
            - "${ledger_after_reverse} == 0"
            - "${charged_after_reverse} == 0"
            - "${lifecycle_after_reverse} == CLOSED"
            - "GET /deposit-fraud/accounts/${acct_ci2} returns available_balance_cents == 0 and held_amount_cents == 0 after the reversal"
