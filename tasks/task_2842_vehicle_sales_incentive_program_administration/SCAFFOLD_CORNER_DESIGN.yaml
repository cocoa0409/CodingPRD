        grounds:
          - complexity_profile.complexity_layers
          - validations[priority=14]
        excluded_because:
          difficulty_instance: stacked_total_landing_exactly_on_the_pair_cap_is_accepted
          rationale: "That §1.8 instance sits the cumulative stacked total exactly ON the CAPPED_TOTAL boundary and one cent past it, which is the layer's `cumulative threshold tested at boundary` claim; the tier-attainment side of the layer is pinned by stair_step_payout_marginal_bands_versus_full_volume, and the budget-headroom side by the §1.9 validations instance budget_headroom_admits_the_claim_landing_exactly_on_budget_and_refuses_the_next_cent."

  - section: consistency_model
