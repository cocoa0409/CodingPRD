      - name: corner_revision_cycle_returns_application_to_review
        claim_type: cyclic
        grounds:
          - state_machines.ColocationApplication.transitions.MODIFICATION_REQUIRED_to_UNDER_STRUCTURAL_REVIEW
        excluded_because:
          difficulty_instance: application_review_modification_revision_cycle
          rationale: "The §1.8 instance drives the full UNDER_STRUCTURAL_REVIEW -> MODIFICATION_REQUIRED -> revise loop and asserts revision_count, the superseded analysis and open_review_count."

      - name: corner_parallel_axes_change_independently
        claim_type: parallel
        grounds:
          - state_machines.SiteAmendment.axis_billing_status.BILLING_to_SUSPENDED
        excluded_because:
          difficulty_instance: site_amendment_parallel_execution_and_billing_axes
          rationale: "The §1.8 instance moves the billing axis SUSPENDED->BILLING while the execution axis moves EXECUTED->TERMINATION_NOTICED and asserts both axes plus the retained capacity."

      - name: corner_cost_share_decline_stalls_project
        claim_type: valid_transition
        grounds:
          - state_machines.ModificationProject.transitions.COST_ALLOCATED_to_STALLED
        excluded_because:
          difficulty_instance: modification_project_fork_join_stalled_branch
          rationale: "The §1.8 instance asserts the STALLED join, the untouched ACCEPTED share and the absence of billing on the divergent branch."

      - name: corner_on_hold_application_resumes_when_privilege_restored
        claim_type: valid_transition
        grounds:
          - state_machines.ColocationApplication.transitions.ON_HOLD_to_SUBMITTED
        excluded_because:
          difficulty_instance: decommission_deposit_release_cascade_restores_privilege
          rationale: "The §1.8 cascade instance asserts ON_HOLD -> SUBMITTED as the fourth link of the deposit-release chain."

