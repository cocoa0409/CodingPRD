  # ===========================================================================
  - section: validations
    instances:

      - name: leak_and_water_tests_not_applicable_to_a_dry_variant
        claim_type: conditional_validation
        grounds:
          - validations[priority 10] ERR_TEST_NOT_APPLICABLE
          - entities.ModelVariant.fields.requires_leak_test
          - entities.ModelVariant.fields.water_liters_limit
        distinguishing_aspect: "Applicability is per-variant configuration, not per-unit state: on a variant with requires_leak_test false and water_liters_limit null, a GATED unit still rejects LEAK and WATER with 422 ERR_TEST_NOT_APPLICABLE while ENERGY is accepted — and certify then fails 409 because no WATER test can ever exist."
        test_recipe:
          setup:
            - "Line L1 with ST10/ST20, SUP1, P-DOOR-A; ShiftPlan A 06:00-14:00 headcount 20"
            - "ModelVariant WM-D RELEASED: FAM_A, 2 option points, 100 labour minutes, requires_leak_test omitted (false), hipot 0.50, functional_cycle_count_required 1, energy_kwh_limit 400.00, water_liters_limit omitted (null); POS-DOOR on P-DOOR-A at ST10 qty 1"
            - "Slot index 1 (07:00) SEQUENCED and RELEASED; unit_d has hipot 0.30 PASS and FUNCTIONAL_CYCLE 1 PASS, so quality_status == GATED (no LEAK is required)"
          setup_api_calls:
            - *c_clock
            - *c_line
            - *c_st10
            - *c_st20
            - *c_sup1
            - *c_pdoor
            - call: "POST /model-variants"
              payload: { model_code: "WM-D", family_code: "FAM_A", option_codes: ["OPT-D"], option_content_points: 2, labor_minutes: 100, functional_cycle_count_required: 1, hipot_leakage_ma_limit: 0.50, energy_kwh_limit: 400.00 }
              as: PlantAdmin
              captures: { wmd_id: $.data.id, wmd_v: $.data.version }
            - call: "POST /bom-lines"
              payload: { model_variant_id: "${wmd_id}", part_id: "${p_door_id}", station_id: "${st10_id}", bom_position_code: "POS-DOOR", qty_per_unit: 1, effective_from_sequence: 1, expected_model_variant_version: "${wmd_v}" }
              as: EngineeringLead
            - call: "POST /model-variants/${wmd_id}/release"
              payload: {}
              as: PlantAdmin
            - *c_lineread
            - *c_shifta
            - call: "POST /build-slots"
              payload: { line_id: "${line_id}", model_variant_id: "${wmd_id}", sequence_index: 1, planned_start: "2026-08-03T07:00:00Z" }
              as: ProductionPlanner
              captures: { slotd_id: $.data.id }
            - call: "POST /build-slots/${slotd_id}/sequence"
              payload: {}
              as: ProductionPlanner
            - call: "POST /build-slots/${slotd_id}/release"
              payload: {}
              as: LineOperator
              captures: { unitd_id: $.data.id }
            - call: "POST /production-units/${unitd_id}/quality-tests"
              payload: { test_type: "ELECTRICAL_SAFETY", measured_value: 0.30 }
              as: QualityInspector
            - call: "POST /production-units/${unitd_id}/quality-tests"
              payload: { test_type: "FUNCTIONAL_CYCLE", measured_value: 1 }
              as: QualityInspector
          trigger:
            - call: "POST /production-units/${unitd_id}/quality-tests"
              payload: { test_type: "LEAK", measured_value: 1.00 }
              as: QualityInspector
              captures: { err_leak_id: $.data.error_id }
            - call: "POST /production-units/${unitd_id}/quality-tests"
              payload: { test_type: "WATER", measured_value: 100.00 }
              as: QualityInspector
              captures: { err_water_id: $.data.error_id }
            - call: "POST /production-units/${unitd_id}/quality-tests"
              payload: { test_type: "ENERGY", measured_value: 380.00 }
              as: QualityInspector
            - call: "POST /production-units/${unitd_id}/certify"
              payload: {}
              as: QualityInspector
              captures: { err_cert_id: $.data.error_id }
          assert:
            - "Trigger 1: HTTP 422 with error.error_id == ERR_TEST_NOT_APPLICABLE — requires_leak_test is false, and this outranks nothing else here because the gate order (priority 11) would have allowed a LEAK test on a GATED unit"
            - "Trigger 2: HTTP 422 with error.error_id == ERR_TEST_NOT_APPLICABLE — water_liters_limit is null"
            - "Trigger 3: HTTP 201 with test_type ENERGY, limit_value == 400.00, ratio-bearing measured_value == 380.00, result == MEASURED and status == RECORDED"
            - "Trigger 4: HTTP 409 with error.error_id == ERR_INVALID_STATE — certification needs at least one RECORDED WATER test; quality_status is still GATED and efficiency_index is still null"
            - "GET /production-units/${unitd_id}/quality-tests returns total_count == 3 — the two rejected calls persisted nothing"

      - name: quarantined_unit_rejects_assembly_progress_and_new_tests
        claim_type: priority_ordering
        grounds:
          - validations[priority 12] ERR_UNIT_QUARANTINED
          - validations[priority 9] ERR_INVALID_STATE
        distinguishing_aspect: "Quarantine (priority 12) is checked before the plain state guard (priority 9): a REWORK x QUARANTINED unit answers 409 ERR_UNIT_QUARANTINED to complete-assembly, ship and a fresh test, even though ship from REWORK would independently be ERR_INVALID_STATE; only clear-quarantine gets through."
        test_recipe:
          setup:
            - "Base fixture: Line L1 (ST10/ST20), SUP1, P-DOOR-A, WM-X RELEASED, ShiftPlan A, slot index 1 SEQUENCED and RELEASED as unit1"
            - "An ELECTRICAL_SAFETY test of 0.60 mA (limit 0.50) has already FAILED, so unit1 is REWORK x QUARANTINED with rework_count 1"
          setup_api_calls:
            - *c_clock
            - *c_line
            - *c_st10
            - *c_st20
            - *c_sup1
            - *c_pdoor
            - *c_wmx
            - *c_bomx
            - *c_relx
            - *c_lineread
            - *c_shifta
            - *c_slot1
            - *c_seq1
            - *c_rel1
            - *c_hipotfail
          trigger:
            - call: "POST /production-units/${unit1_id}/complete-assembly"
              payload: {}
              as: LineOperator
              captures: { err_q1_id: $.data.error_id }
            - call: "POST /production-units/${unit1_id}/ship"
              payload: {}
              as: LineOperator
              captures: { err_q2_id: $.data.error_id }
            - call: "POST /production-units/${unit1_id}/quality-tests"
              payload: { test_type: "ELECTRICAL_SAFETY", measured_value: 0.30 }
              as: QualityInspector
              captures: { err_q3_id: $.data.error_id }
            - call: "POST /production-units/${unit1_id}/clear-quarantine"
              payload: { note: "harness reset" }
              as: QualityInspector
            - call: "POST /production-units/${unit1_id}/quality-tests"
              payload: { test_type: "ELECTRICAL_SAFETY", measured_value: 0.30 }
              as: QualityInspector
          assert:
            - "Triggers 1, 2 and 3: HTTP 409 with error.error_id == ERR_UNIT_QUARANTINED — not ERR_INVALID_STATE, even for ship, whose from-state guard is also violated"
            - "After trigger 3: ProductionUnit.${unit1_id}.assembly_status == REWORK, quality_status == QUARANTINED, rework_count == 1"
            - "Trigger 4: HTTP 200; QualityTest.${failtest_id}.status == VOIDED and quality_status == PENDING, assembly_status == IN_STATION"
            - "Trigger 5: HTTP 201 and quality_status == SAFETY_PASSED — the gate chain restarts from the voided baseline"
            - "BuildSlot.${slot1_id}.status stayed RELEASED throughout"

      - name: duplicate_codes_are_global_for_lines_and_line_scoped_for_stations
        claim_type: violation_to_error
        grounds:
          - validations[priority 32] ERR_DUPLICATE_CODE
          - entities.Station.fields.station_code
          - entities.Station.fields.position_index
        distinguishing_aspect: "One error code, two scopes: line_code collides globally, while station_code and position_index collide only within their own line — ST10 at position 10 on a second line is accepted, so the uniqueness key must be (line_id, station_code) and (line_id, position_index)."
        test_recipe:
          setup:
            - "Line L1 exists with station ST10 at position_index 10"
          setup_api_calls:
            - *c_clock
            - *c_line
            - *c_st10
          trigger:
            - call: "POST /lines"
              payload: { line_code: "L1", takt_seconds: 90, option_load_limit_pct: 50.00, baseline_headcount: 10, current_family_code: "FAM_B" }
              as: PlantAdmin
              captures: { err_d1_id: $.data.error_id }
            - call: "POST /stations"
              payload: { line_id: "${line_id}", station_code: "ST10", position_index: 30, presentation_slot_capacity: 40, station_cycle_seconds: 110 }
              as: PlantAdmin
              captures: { err_d2_id: $.data.error_id }
            - call: "POST /stations"
              payload: { line_id: "${line_id}", station_code: "ST99", position_index: 10, presentation_slot_capacity: 40, station_cycle_seconds: 110 }
              as: PlantAdmin
              captures: { err_d3_id: $.data.error_id }
            - call: "POST /lines"
              payload: { line_code: "L2", takt_seconds: 120, option_load_limit_pct: 63.00, baseline_headcount: 20, current_family_code: "FAM_A" }
              as: PlantAdmin
              captures: { l2_id: $.data.id }
            - call: "POST /stations"
              payload: { line_id: "${l2_id}", station_code: "ST10", position_index: 10, presentation_slot_capacity: 40, station_cycle_seconds: 110 }
              as: PlantAdmin
              captures: { st10b_id: $.data.id }
          assert:
            - "Triggers 1, 2 and 3: HTTP 409 with error.error_id == ERR_DUPLICATE_CODE"
            - "Trigger 5: HTTP 201 — Station.${st10b_id}.station_code == 'ST10' and position_index == 10 on line ${l2_id}"
            - "GET /lines/${line_id}/stations returns total_count == 1 and GET /lines/${l2_id}/stations returns total_count == 1"

      - name: sequence_index_stays_taken_until_the_checkpoint_cancels_the_stale_slot
        claim_type: violation_to_error
        grounds:
          - validations[priority 25] ERR_SEQUENCE_INDEX_TAKEN
          - state_machines.BuildSlot PLANNED -> CANCELLED
        distinguishing_aspect: "The uniqueness set is {PLANNED, SEQUENCED, RELEASED, BUILT}: a merely PLANNED slot still blocks index 1, and the index only frees up after the checkpoint CANCELS it for having a planned_start in the past."
        test_recipe:
          setup:
            - "Base fixture: Line L1 (ST10/ST20), SUP1, P-DOOR-A, WM-X RELEASED, ShiftPlan A 06:00-14:00; slot index 1 at 07:00 is PLANNED and never sequenced"
          setup_api_calls:
            - *c_clock
            - *c_line
            - *c_st10
            - *c_st20
            - *c_sup1
            - *c_pdoor
            - *c_wmx
            - *c_bomx
            - *c_relx
            - *c_lineread
            - *c_shifta
            - *c_slot1
          trigger:
            - call: "POST /build-slots"
              payload: { line_id: "${line_id}", model_variant_id: "${wmx_id}", sequence_index: 1, planned_start: "2026-08-03T09:00:00Z" }
              as: ProductionPlanner
              captures: { err_idx_id: $.data.error_id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T08:00:00Z" }
              as: PlantAdmin
            - call: "POST /lines/${line_id}/run-checkpoint"
              payload: {}
              as: ProductionPlanner
            - call: "POST /build-slots"
              payload: { line_id: "${line_id}", model_variant_id: "${wmx_id}", sequence_index: 1, planned_start: "2026-08-03T09:00:00Z" }
              as: ProductionPlanner
              captures: { slot1b_id: $.data.id }
          assert:
            - "Trigger 1: HTTP 409 with error.error_id == ERR_SEQUENCE_INDEX_TAKEN — PLANNED counts as taken"
            - "Trigger 3: the checkpoint response cancelled_slot_ids == [${slot1_id}] and BuildSlot.${slot1_id}.status == CANCELLED (terminal)"
            - "Trigger 4: HTTP 201 — BuildSlot.${slot1b_id}.sequence_index == 1 and status == PLANNED; the cancelled slot no longer occupies the index"
            - "Line.${line_id}.checkpoint_index == 1 and max_released_sequence_index == 0"

      - name: shift_coverage_is_inclusive_at_start_and_exclusive_at_end
        claim_type: satisfaction_to_pass
        grounds:
          - validations[priority 24] ERR_NO_SHIFT_COVERAGE
          - entities.ShiftPlan.fields.shift_end
        distinguishing_aspect: "Coverage is the half-open interval [shift_start, shift_end + overtime_minutes): a slot planned exactly at 06:00 sequences against shift A, while a slot planned exactly at 14:00 — the plan's own end instant — is rejected with 422 ERR_NO_SHIFT_COVERAGE."
        test_recipe:
          setup:
            - "Base fixture: Line L1 (ST10/ST20), SUP1, P-DOOR-A, WM-X RELEASED, single ACTIVE ShiftPlan A 06:00-14:00 with overtime_minutes 0"
            - "Slot index 1 planned at 06:00:00Z and slot index 2 planned at 14:00:00Z, both PLANNED"
          setup_api_calls:
            - *c_clock
            - *c_line
            - *c_st10
            - *c_st20
            - *c_sup1
            - *c_pdoor
            - *c_wmx
            - *c_bomx
            - *c_relx
            - *c_lineread
            - *c_shifta
            - call: "POST /build-slots"
              payload: { line_id: "${line_id}", model_variant_id: "${wmx_id}", sequence_index: 1, planned_start: "2026-08-03T06:00:00Z" }
              as: ProductionPlanner
              captures: { edge_open_id: $.data.id }
            - call: "POST /build-slots"
              payload: { line_id: "${line_id}", model_variant_id: "${wmx_id}", sequence_index: 2, planned_start: "2026-08-03T14:00:00Z" }
              as: ProductionPlanner
              captures: { edge_close_id: $.data.id }
          trigger:
            - call: "POST /build-slots/${edge_open_id}/sequence"
              payload: {}
              as: ProductionPlanner
            - call: "POST /build-slots/${edge_close_id}/sequence"
              payload: {}
              as: ProductionPlanner
              captures: { err_cov_id: $.data.error_id }
          assert:
            - "Trigger 1: HTTP 200 — BuildSlot.${edge_open_id}.status == SEQUENCED with shift_plan_id == ${shift_a_id}; the start instant is inside the window"
            - "Trigger 2: HTTP 422 with error.error_id == ERR_NO_SHIFT_COVERAGE; BuildSlot.${edge_close_id}.status is still PLANNED with shift_plan_id null"
            - "ShiftPlan.${shift_a_id}.committed_labor_minutes == 150 — only the accepted slot booked labour"

      - name: sync_delivery_window_is_inclusive_at_start_and_exclusive_at_end
        claim_type: cross_entity_validation
        grounds:
          - validations[priority 28] ERR_SYNC_DELIVERY_MISSING
          - entities.BuildSlot.fields.sync_delivery_call_id
        distinguishing_aspect: "A sequenced module needs a call with window_start <= planned_start < window_end: a call ending exactly at the 09:30 planned start does not cover it, a call starting exactly at 09:30 does, and the covering call's id is pinned onto the slot."
        test_recipe:
          setup:
            - "Line L1 with ST10/ST20, SUP1, sequenced-module part P-MOD-1 (line_side_max_units 1), WM-M RELEASED with POS-MOD on P-MOD-1 at ST10 qty 1 and 100 labour minutes"
            - "ShiftPlan A 06:00-14:00 headcount 20; slot index 1 planned at 09:30 is PLANNED; no DeliveryCall exists yet"
          setup_api_calls:
            - *c_clock
            - *c_line
            - *c_st10
            - *c_st20
            - *c_sup1
            - *c_pmod
            - *c_wmm
            - *c_bomm
            - *c_relm
            - *c_lineread_m
            - *c_shiftm
            - *c_slotm
          trigger:
            - call: "POST /build-slots/${slotm_id}/sequence"
              payload: {}
              as: ProductionPlanner
              captures: { err_sync1_id: $.data.error_id }
            - call: "POST /delivery-calls"
              payload: { supplier_id: "${sup1_id}", part_id: "${p_mod_id}", station_id: "${st10_id}", window_start: "2026-08-03T08:00:00Z", window_end: "2026-08-03T09:30:00Z", sequenced_qty: 1 }
              as: ProductionPlanner
              captures: { call_early_id: $.data.id }
            - call: "POST /build-slots/${slotm_id}/sequence"
              payload: {}
              as: ProductionPlanner
              captures: { err_sync2_id: $.data.error_id }
            - call: "POST /delivery-calls/${call_early_id}/cancel"
              payload: {}
              as: ProductionPlanner
            - call: "POST /delivery-calls"
              payload: { supplier_id: "${sup1_id}", part_id: "${p_mod_id}", station_id: "${st10_id}", window_start: "2026-08-03T09:30:00Z", window_end: "2026-08-03T10:30:00Z", sequenced_qty: 1 }
              as: ProductionPlanner
              captures: { call_exact_id: $.data.id }
            - call: "POST /build-slots/${slotm_id}/sequence"
              payload: {}
              as: ProductionPlanner
          assert:
            - "Triggers 1 and 3: HTTP 422 with error.error_id == ERR_SYNC_DELIVERY_MISSING — window_end 09:30 is exclusive, so the 08:00-09:30 call covers nothing at 09:30"
            - "Trigger 5: HTTP 201 — the 09:30-10:30 call is accepted; the earlier call had to be CANCELLED first, otherwise its 10-minute pad would have raised ERR_DOCK_WINDOW_CONFLICT"
            - "Trigger 6: HTTP 200 — BuildSlot.${slotm_id}.status == SEQUENCED with sync_delivery_call_id == ${call_exact_id}"
            - "BuildSlot.${slotm_id}.allocated_slot_units == 0 and Station.${st10_id}.presentation_slots_used == 0 — a sequenced module consumes no presentation slot"
            - "ShiftPlan.${shift_m_id}.committed_labor_minutes == 100"

      - name: part_change_pending_blocks_sequencing_until_the_change_is_rejected
        claim_type: cascading_validation
        grounds:
          - validations[priority 16] ERR_PART_CHANGE_PENDING
          - state_machines.Part ACTIVE -> CHANGE_PENDING
          - state_machines.EngineeringChange UNDER_REVIEW -> REJECTED
        distinguishing_aspect: "Submitting a change freezes its affected part and thereby the sequencing of every slot whose effective BOM names it; rejecting the change thaws the part with no other trace, so the same slot call flips from 409 to 200 without any change to the slot itself."
        test_recipe:
          setup:
            - "Base fixture: Line L1 (ST10/ST20), SUP1, P-DOOR-A, WM-X RELEASED with POS-DOOR on P-DOOR-A, ShiftPlan A; slot index 1 at 07:00 PLANNED"
