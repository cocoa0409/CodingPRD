          - entities.ResultDelivery.fields.content_type
        distinguishing_aspect: "License tier gates content type at fan-out: the publish mints a CALL delivery for the PREMIUM customer (fee 4999) while the BASIC customer's feed holds only the VOTE_UPDATE (350) — no CALL row exists for BASIC at all."
        test_recipe:
