      - name: loyalty_tier_keyed_on_pre_discount_subtotal
        grounds:
          - calculations.box_monthly_charge
          - calculations.scan_page_charge
          - entities.BillingCycle.fields.loyalty_discount_cents
          - entities.BillingCycle.fields.total_charge_cents
        distinguishing_aspect: |
          Mode (c) — a circular-looking dependency pinned to one order. The subtotal 40500 sits at or
          above LOYALTY_TIER_2_MIN_CENTS so the discount is 4050 and the total is 36450; re-keying the
          tier on the post-discount total would drop it to tier 1 and yield 38475.
