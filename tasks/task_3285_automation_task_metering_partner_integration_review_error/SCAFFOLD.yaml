# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Member
    description: "Team user who builds workflows, manages connections and folders, and replays failed or held tasks."
    identity: "entity_backed:Member"
    exclusive_operations:
      - "POST /zapier/folders"
