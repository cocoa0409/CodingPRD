          assert:
            - "${reserved_at_create} == 0.00 and ${available_at_create} == 80.00 at creation"
            - "${reserved_1} == 40.00 with ${available_1} == 40.00, then ${reserved_2} == 80.00 with ${available_2} == 0.00 — the second 40-hour request lands exactly on the budget and equality passes"
            - "HTTP 422 with ${err_hours} == ERR_ENGAGEMENT_HOURS_EXCEEDED for one hour beyond the budget"
            - "${asg1_state} == REVOKED with ${asg1_settled} == 0 — a never-provisioned assignment consumes nothing"
            - "${reserved_3} == 40.00, ${consumed_3} == 0.00 and ${available_3} == 40.00 — the revocation returns the full reservation"
            - "${asg3_state} == REQUESTED and ${reserved_4} == 80.00 with ${consumed_4} == 0.00 and ${available_4} == 0.00 — the freed capacity is reusable and the ledger invariant 80 == 80 + 0 + 0 holds"

      - name: emergency_pause_cascade_end_to_end
        claim_type: cascading_side_effects
        excluded_because:
          difficulty_instance: emergency_pause_cascade_reaches_tester_availability_through_six_links
          rationale: "The depth probe already walks the full six-link pause cascade — document, targets, assignments, hour ledger, tester counters and tester availability — and asserts every intermediate link, which is exactly the end-to-end chain claim for this layer."

      - name: closure_signoff_cascade_end_to_end
        claim_type: cascading_side_effects
        excluded_because:
          difficulty_instance: closure_signoff_cascade_clears_asset_exposure_through_five_links
          rationale: "The five-link closure chain from verification sign-off to asset exposure clearing, including the ordering-sensitive plan ledger transfer, is asserted link by link in the depth probe."

      - name: assurance_score_variant_divergence_and_delta
        claim_type: dual_variant_calculation
        excluded_because:
          difficulty_instance: assurance_score_provisional_and_final_diverge_on_identical_findings
          rationale: "The depth probe holds the finding set constant and reads both the PROVISIONAL and FINAL variants, asserting each value and the delta produced by the switch, which is the whole dual-variant claim."

      - name: tester_interval_capacity_threshold_at_the_boundary
        claim_type: rate_threshold_triggers
        excluded_because:
          difficulty_instance: tester_intervals_are_half_open_and_capped_in_aggregate
          rationale: "The depth probe tests the per-tester concurrency cap at exactly max_concurrent_engagements and one past it, including the half-open touch that does not count, so the instantaneous side of this layer is already covered."

  - section: consistency_model
    instances:
      - name: every_derived_field_is_readable_in_the_same_response_that_changed_it
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - entities[TestPlan].total_risk_points
          - entities[Asset].open_finding_count
          - entities[Finding].severity_band
        distinguishing_aspect: "Each write's own response body already carries the recomputed derived fields, and an immediate follow-up read of a different entity returns the same numbers — no second request, no settling delay: the finding response holds its severity band while the plan and asset rows already show the new points and counters."
        test_recipe:
          setup:
            - "An EXECUTING engagement whose plan ledger and asset counters are still at zero."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /pentest/assets"
              payload: { name: "Payments API", asset_class: "APPLICATION", criticality_tier: 1, compliance_regimes: ["SOC2"], exposure_score: 88, last_tested_at: "2025-10-02T00:00:00Z" }
              as: PlatformAdmin
              captures: { asset_a_id: $.data.id, open_at_create: $.data.open_finding_count, exposure_state_at_create: $.data.exposure_state }
            - call: "POST /pentest/testers"
              payload: { full_name: "Dana Reyes", certifications: ["OSCP", "CISSP"], clearance_expires_at: "2027-01-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { tester_id: $.data.id }
            - call: "POST /pentest/testers/${tester_id}/background-check"
              payload: { result: "CLEARED" }
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "POST /pentest/test-plans"
              payload: { fiscal_year: 2026, risk_appetite_score: 100, planned_engagement_count: 5, prioritization_mode: "RISK_DRIVEN" }
              as: ProgramManager
              as_user_id: "pm-1"
              captures: { plan_id: $.data.id, pv1: $.data.version, points_at_create: $.data.total_risk_points }
            - call: "POST /pentest/scope-items"
              payload: { test_plan_id: "${plan_id}", asset_id: "${asset_a_id}", justification: "Payments coverage", requested_engagement_hours: 120, expected_test_plan_version: "${pv1}" }
              as: ProgramManager
              as_user_id: "pm-1"
              captures: { si_a_id: $.data.id, si_score: $.data.priority_score }
            - call: "POST /pentest/scope-items/${si_a_id}/decision"
              payload: { decision: "APPROVE", note: "In scope" }
              as: ProgramManager
              as_user_id: "pm-1"
            - call: "POST /pentest/test-plans/${plan_id}/activate"
              payload: {}
              as: ProgramManager
              as_user_id: "pm-1"
              captures: { coverage_on_activate: $.data.coverage_score }
            - call: "POST /pentest/engagements"
              payload: { test_plan_id: "${plan_id}", scope_item_id: "${si_a_id}", engagement_type: "APPLICATION_TEST", window_start: "2026-09-05T00:00:00Z", window_end: "2026-09-30T23:59:59Z", hours_allocated: 80 }
              as: ProgramManager
              as_user_id: "pm-1"
              captures: { eng_id: $.data.id }
            - call: "POST /pentest/rules-of-engagement"
              payload: { engagement_id: "${eng_id}", exclusions: [], allowed_techniques: ["SQLI"], emergency_stop_procedure: "Call the SOC hotline", escalation_contact: "soc@example.com" }
              as: ProgramManager
              as_user_id: "pm-1"
              captures: { roe_id: $.data.id }
            - call: "POST /pentest/authorized-targets"
              payload: { roe_id: "${roe_id}", asset_id: "${asset_a_id}", window_start: "2026-09-05T00:00:00Z", window_end: "2026-09-25T00:00:00Z", technique_allowlist: ["SQLI"] }
              as: ProgramManager
              as_user_id: "pm-1"
            - call: "POST /pentest/rules-of-engagement/${roe_id}/sign"
              payload: { signature_note: "Authorized" }
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "GET /pentest/engagements/${eng_id}"
              payload: {}
              as: ProgramManager
              as_user_id: "pm-1"
              captures: { ev2: $.data.version }
            - call: "POST /pentest/tester-assignments"
              payload: { engagement_id: "${eng_id}", tester_id: "${tester_id}", assignment_role: "LEAD", interval_start: "2026-09-05T00:00:00Z", interval_end: "2026-09-20T00:00:00Z", requested_hours: 40, granted_asset_ids: ["${asset_a_id}"], expected_engagement_version: "${ev2}" }
              as: ProgramManager
              as_user_id: "pm-1"
              captures: { asg_id: $.data.id }
            - call: "POST /pentest/tester-assignments/${asg_id}/access"
              payload: { action: "PROVISION" }
              as: ProgramManager
              as_user_id: "pm-1"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-08T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /pentest/engagements/${eng_id}/execution"
              payload: { action: "START" }
              as: ProgramManager
              as_user_id: "pm-1"
              captures: { ev5: $.data.version }
          trigger:
            - call: "POST /pentest/findings"
              payload: { engagement_id: "${eng_id}", asset_id: "${asset_a_id}", title: "Payments IDOR", reproduction_steps: "1. Change the account id 2. Read another tenant", business_impact_narrative: "Cardholder data read", technical_base_score: 8.00, exposure_class: "INTERNET", root_cause_theme: "ACCESS_CONTROL", expected_engagement_version: "${ev5}" }
              as: Tester
              as_user_id: "${tester_id}"
              captures: { f1_id: $.data.id, f1_score: $.data.severity_score, f1_band: $.data.severity_band, f1_points: $.data.severity_points }
            - call: "GET /pentest/assets/${asset_a_id}"
              payload: {}
              as: ProgramManager
              as_user_id: "pm-1"
              captures: { open_after: $.data.open_finding_count, open_crit_after: $.data.open_critical_finding_count, exposure_state_after: $.data.exposure_state }
            - call: "GET /pentest/test-plans/${plan_id}"
              payload: {}
              as: ProgramManager
              as_user_id: "pm-1"
              captures: { open_points_after: $.data.open_risk_points }
            - call: "GET /pentest/critical-alerts"
              payload: { finding_id: "${f1_id}", limit: 10, offset: 0 }
              as: ProgramManager
              as_user_id: "pm-1"
              captures: { alert_id: "$.data[0].id", alert_deadline: "$.data[0].ack_deadline_at" }
            - call: "GET /pentest/engagements/${eng_id}"
              payload: {}
              as: ProgramManager
              as_user_id: "pm-1"
              captures: { assurance_after: $.data.provisional_assurance_score }
          assert:
            - "${open_at_create} == 0 with ${exposure_state_at_create} == BASELINE and ${points_at_create} == 0 before the finding"
            - "${si_score} == 89.80 (0.45*88 + 0.30*100 + 0.20*91 + 0.05*40) and ${coverage_on_activate} == 100.00 are already present in the responses of the writes that produced them"
            - "${f1_score} == 9.90 with ${f1_band} == CRITICAL in the creation response itself — 8.00 * 1.15 + 0.50 + 0.20, no follow-up read needed"
            - "${open_after} == 1, ${open_crit_after} == 1 and ${exposure_state_after} == ELEVATED in the very next read"
            - "${open_points_after} == ${f1_points} — the plan ledger already reflects the finding"
            - "${alert_id} resolves with total_count == 1 and ${alert_deadline} == 2026-09-08T10:00:00Z, an alert raised synchronously with the finding"
            - "${assurance_after} == 75.00 — the PROVISIONAL variant deducts 25 for the single CRITICAL finding and is readable immediately"
