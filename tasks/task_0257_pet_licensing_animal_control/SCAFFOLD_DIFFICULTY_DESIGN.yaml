  - rule_id: boundary_precision_check
    instances:
      - name: late_penalty_tier_boundary_at_30_days
        grounds:
          - calculations.late_penalty
          - state_machines.License.GRACE_to_EXPIRED
          - entities.License.fields.late_penalty_cents
        distinguishing_aspect: |
          At exactly days_late=30 the late_penalty uses TIER_1 (<=30): for a KENNEL license with
          final_fee_cents=12000 the penalty is 30*200=6000 (uncapped). The boundary is the numeric
          metric days_late at the <= breakpoint, reached through POST /_clock/advance then observed
          on the License — a different metric and endpoint from the kennel empty-slot edge below.
        test_recipe:
          setup:
            - "Owner OH owns kennel KH (capacity 5); one KENNEL license LH for an unaltered pet issued 2026-01-01 term 1yr, occupied_slots=0 at submit → final_fee 12000"
            - "Clock advanced to 2027-03-02 (grace_end 2027-01-31 + 30 days) so LH EXPIRED with days_late=30"
