            - "${b_stop1_service} == 171, ${b_service} == 361 and ${b_duty} == 841"
            - "${c_duty} == 840"
            - "${high_error} == ERR_HOS_DUTY_LIMIT with HTTP 422 (NOT ERR_DRIVER_REST_GAP, although the 300-minute gap is equally violated)"
            - "${low_error} == ERR_DRIVER_REST_GAP with HTTP 422 (the identical call with one fewer duty minute now surfaces the priority-14 objection)"
            - "Trip.${trip_b_id}.driver_id == null and Trip.${trip_c_id}.driver_id == null - neither refused assignment mutated anything"

      - name: own_state_check_beats_deferral_limit_on_an_already_deferred_work_order
        grounds:
          - validations[priority 8 state]
          - validations[priority 15 constraint]
          - state_machines.MaintenanceWorkOrder
          - errors.ERR_INVALID_STATE_TRANSITION
          - errors.ERR_DEFERRAL_LIMIT
        distinguishing_aspect: |
          PAIR: state (priority 8) versus constraint (priority 15) - a different
          pair of categories from the 12/14 instance and from the 2/4 instance.
          A work order sitting in DEFERRED with deferral_count already at the
          MAX_DEFERRALS ceiling of 2 violates both rules at once. The answer is
          ERR_INVALID_STATE_TRANSITION, because DEFERRED has no defer edge at
          all. Rescheduling it back to SCHEDULED leaves deferral_count at 2 and
          removes only the state objection; the very same defer call then
          returns ERR_DEFERRAL_LIMIT. Both errors are HTTP 409, so only the
          error_id distinguishes them.
        test_recipe:
          setup:
            - "Domicile DOM-CHI and tractor TR-501 exist; no trip is ever created, so the maintenance-conflict geometry can never interfere."
            - "Work order W1 is created SCHEDULED with deferral_count 0, then walked SCHEDULED -> DEFERRED -> SCHEDULED -> DEFERRED so that deferral_count == 2 and status == DEFERRED."
          setup_api_calls:
            - call: "POST /fleet/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: FleetPlanner
            - call: "POST /fleet/domiciles"
              payload: { domicile_code: "DOM-CHI", region_code: "MIDWEST", tractor_capacity: 40, driver_headcount_target: 20, fixed_ownership_cents_per_day: 12000, overhead_cents_per_day: 4000, dedicated_rate_cents_per_mile: 285, dedicated_rate_cents_per_case: 210 }
              as: FleetPlanner
              captures: { dom_chi_id: $.data.id }
            - call: "POST /fleet/tractors"
              payload: { unit_code: "TR-501", domicile_id: "${dom_chi_id}", odometer_miles: 40000, pm_interval_miles: 25000, pm_last_service_odometer: 39000 }
              as: MaintenanceCoordinator
              captures: { trc_501_id: $.data.id }
            - call: "POST /fleet/maintenance-work-orders"
              payload: { asset_kind: "TRACTOR", tractor_id: "${trc_501_id}", service_type: "PM_B", window_start_at: "2026-08-10T06:00:00Z", window_end_at: "2026-08-10T14:00:00Z" }
              as: MaintenanceCoordinator
              captures: { wo_1_id: $.data.id, wo_1_status: $.data.status, wo_1_deferrals: $.data.deferral_count, wo_1_auto: $.data.auto_generated }
            - call: "POST /fleet/maintenance-work-orders/${wo_1_id}/defer"
              payload: { reason_code: "PARTS_BACKORDER" }
              as: MaintenanceCoordinator
              captures: { after_defer_1: $.data.deferral_count }
            - call: "POST /fleet/maintenance-work-orders/${wo_1_id}/reschedule"
              payload: { window_start_at: "2026-08-11T06:00:00Z", window_end_at: "2026-08-11T14:00:00Z" }
              as: MaintenanceCoordinator
            - call: "POST /fleet/maintenance-work-orders/${wo_1_id}/defer"
              payload: { reason_code: "PARTS_BACKORDER" }
              as: MaintenanceCoordinator
              captures: { after_defer_2: $.data.deferral_count, after_defer_2_status: $.data.status }
          trigger:
            - call: "POST /fleet/maintenance-work-orders/${wo_1_id}/defer"
              payload: { reason_code: "PARTS_BACKORDER" }
              as: MaintenanceCoordinator
              captures: { low_priority_error: $.data.error_id }
            - call: "POST /fleet/maintenance-work-orders/${wo_1_id}/reschedule"
              payload: { window_start_at: "2026-08-12T06:00:00Z", window_end_at: "2026-08-12T14:00:00Z" }
              as: MaintenanceCoordinator
              captures: { resched_status: $.data.status, resched_deferrals: $.data.deferral_count }
            - call: "POST /fleet/maintenance-work-orders/${wo_1_id}/defer"
              payload: { reason_code: "PARTS_BACKORDER" }
              as: MaintenanceCoordinator
              captures: { high_priority_error: $.data.error_id }
          assert:
            - "${wo_1_status} == SCHEDULED, ${wo_1_deferrals} == 0 and ${wo_1_auto} == false"
            - "${after_defer_1} == 1"
            - "${after_defer_2} == 2 and ${after_defer_2_status} == DEFERRED"
            - "${low_priority_error} == ERR_INVALID_STATE_TRANSITION with HTTP 409 (NOT ERR_DEFERRAL_LIMIT, although deferral_count has already reached 2)"
            - "${resched_status} == SCHEDULED and ${resched_deferrals} == 2 (rescheduling never resets the counter)"
            - "${high_priority_error} == ERR_DEFERRAL_LIMIT with HTTP 409 - reached only once the state objection is gone"
            - "GET /fleet/maintenance-work-orders/${wo_1_id} still reports status == SCHEDULED, deferral_count == 2 and window_start_at == 2026-08-12T06:00:00Z"

      - name: role_check_beats_existence_so_a_forbidden_role_cannot_probe_for_404
        grounds:
          - validations[priority 2 authorization]
          - validations[priority 4 existence]
          - roles.MaintenanceCoordinator
          - errors.ERR_UNAUTHORIZED
          - errors.ERR_TRIP_NOT_FOUND
        distinguishing_aspect: |
          PAIR: authorization (priority 2) versus existence (priority 4) - the
          only pair in this rule that is about information leakage rather than
          business rules, and the only one whose two members carry different
          HTTP statuses (403 versus 404). The identical request against the
          identical non-existent trip id answers 403 for MaintenanceCoordinator,
          which is not in the endpoint's roles, and 404 for FleetPlanner, which
          is. A role that may not call the endpoint therefore cannot use it as
          an existence oracle.
        test_recipe:
          setup:
            - "Empty database apart from the logical clock; the trip id used below is a well-formed UUID that was never created."
          setup_api_calls:
            - call: "POST /fleet/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: FleetPlanner
          trigger:
            - call: "POST /fleet/trips/11111111-2222-4333-8444-555555555555/plan"
              payload: {}
              as: MaintenanceCoordinator
              captures: { forbidden_error: $.data.error_id }
            - call: "POST /fleet/trips/11111111-2222-4333-8444-555555555555/plan"
              payload: {}
              as: FleetPlanner
              captures: { missing_error: $.data.error_id }
          assert:
            - "${forbidden_error} == ERR_UNAUTHORIZED with HTTP 403"
            - "${missing_error} == ERR_TRIP_NOT_FOUND with HTTP 404"
            - "the two responses differ only in the caller's X-User-Role, proving the role gate runs before the existence lookup"
            - "the 403 response body carries no field that reveals whether the trip exists"

  # =========================================================================
  - rule_id: boundary_precision_check
    instances:

      - name: break_minutes_appear_only_above_480_drive_minutes_not_at_480
        grounds:
          - calculations.trip_plan_totals
          - calculations.trip_plan_totals.constants.BREAK_TRIGGER_DRIVE_MINUTES
          - calculations.trip_plan_totals.constants.MANDATORY_BREAK_MINUTES
          - endpoints[POST /fleet/trips/{trip_id}/assignments]
        distinguishing_aspect: |
          METRIC: planned_break_minutes (a step function of
          planned_drive_minutes at BREAK_TRIGGER_DRIVE_MINUTES = 480).
          ENDPOINT: POST /fleet/trips/{trip_id}/assignments.
          The comparison is strict `>`, so 480 drive minutes carries NO break
          and 481 carries the full 30. Because planned_duty_minutes contains
          the break, one extra drive minute moves duty by 31, not by 1. Both
          calls succeed with HTTP 200 - this boundary is about a value, not
          about an error - which separates it from the two other instances in
          this rule, whose boundaries decide accept-versus-reject.
        test_recipe:
          setup:
            - "Store S-1005 unloads 600 cases/hour with 3 doors and 24-hour dock availability, so no dock or window geometry interferes."
            - "Two drivers, two tractors and two trailers exist, so TRIP-P and TRIP-Q never contend for equipment or for driver rest and the only difference between them is one drive minute."
            - "TRIP-P: DELIVERY of 600 cases (service ceil(600*60/600) + 15 = 75) then a DROP_OFF (20). Drive 240 + 240 = 480 exactly -> break 0 -> duty 480 + 95 + 0 = 575."
            - "TRIP-Q: identical, except the second leg drives 241 minutes. Drive 481 -> break 30 -> duty 481 + 95 + 30 = 606."
          setup_api_calls:
            - call: "POST /fleet/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: FleetPlanner
            - call: "POST /fleet/stores"
              payload: { store_code: "S-1005", region_code: "MOUNTAIN", dock_count: 3, cases_per_hour_unload_rate: 600, dock_open_minute: 0, dock_close_minute: 1439 }
              as: FleetPlanner
              captures: { store_s5_id: $.data.id }
            - call: "POST /fleet/domiciles"
              payload: { domicile_code: "DOM-SLC", region_code: "MOUNTAIN", tractor_capacity: 30, driver_headcount_target: 15, fixed_ownership_cents_per_day: 10000, overhead_cents_per_day: 3000, dedicated_rate_cents_per_mile: 275, dedicated_rate_cents_per_case: 200 }
              as: FleetPlanner
              captures: { dom_slc_id: $.data.id }
            - call: "POST /fleet/driver-pay-plans"
              payload: { plan_code: "MILE-A", mileage_cents_per_mile: 78, stop_cents_per_stop: 2200, drop_hook_cents: 1500, hourly_cents_per_minute: 42, minimum_daily_cents: 24000, backhaul_bonus_pct: 0.05 }
              as: PayrollAnalyst
              captures: { plan_a_id: $.data.id }
            - call: "POST /fleet/drivers"
              payload: { driver_code: "D-81", domicile_id: "${dom_slc_id}", pay_plan_id: "${plan_a_id}", seniority_date: "2018-05-02" }
              as: TransportManager
              captures: { drv_81_id: $.data.id }
            - call: "POST /fleet/drivers"
              payload: { driver_code: "D-82", domicile_id: "${dom_slc_id}", pay_plan_id: "${plan_a_id}", seniority_date: "2020-06-15" }
              as: TransportManager
              captures: { drv_82_id: $.data.id }
            - call: "POST /fleet/tractors"
              payload: { unit_code: "TR-511", domicile_id: "${dom_slc_id}", odometer_miles: 30000, pm_interval_miles: 25000, pm_last_service_odometer: 29000 }
              as: MaintenanceCoordinator
              captures: { trc_511_id: $.data.id }
            - call: "POST /fleet/tractors"
              payload: { unit_code: "TR-512", domicile_id: "${dom_slc_id}", odometer_miles: 31000, pm_interval_miles: 25000, pm_last_service_odometer: 30000 }
              as: MaintenanceCoordinator
