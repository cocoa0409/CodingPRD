scaffold_difficulty_design:
  # ===========================================================================
  # Rule 1 — dual_variant_calc: two calculations, different entity domains
  # (production forecasting on MealPeriodService vs fiscal settlement on
  # CommissionStatement).
  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: forecast_base_vs_trend_variants
        grounds:
          - calculations.production_forecast_portions
          - entities.ProductionForecast.fields.variant
          - entities.ProductionForecast.fields.forecasted_portions
        distinguishing_aspect: |
          Same swipe history on the production domain: BASE (plain moving
          average) yields 60 portions while TREND (slope-adjusted) yields 66
          portions for the same (meal_period_id, recipe_id); the companion
          dual-variant instance lives in the fiscal domain
          (commission_provisional_vs_final_settlement), not in production.
        test_recipe:
          setup:
            - "Hall (capacity 1000), recipe R (popularity_share 0.5, unit_cost 800, allergen_reviewed true), published cycle covering 2026-07-01..2026-10-01"
            - "Four historical Thursday LUNCH periods in IN_SERVICE with BOARD_SWIPE counts 100 (2026-07-30), 110 (2026-08-06), 120 (2026-08-13), 130 (2026-08-20)"
            - "Target Thursday LUNCH period 2026-08-27 in SCHEDULED"
          setup_api_calls:
            - { call: "POST /dining-halls", payload: { name: "North Hall", service_model: "BOARD", dining_capacity: 1000, catering_kitchen_capacity: 500 }, as: DiningAdmin, captures: { h: $.data.id } }
            - { call: "POST /recipes", payload: { dining_hall_id: "${h}", name: "Grain Bowl", station: "GLOBAL", allergen_tags: [], dietary_flags: ["VEGAN"], popularity_share: 0.5, unit_cost_cents: 800, allergen_reviewed: true }, as: KitchenLead, captures: { r: $.data.id } }
            - { call: "POST /menu-cycles", payload: { dining_hall_id: "${h}", name: "Fall A", cycle_length_weeks: 4, start_date: "2026-07-01", end_date: "2026-10-01" }, as: DiningAdmin, captures: { cyc: $.data.id } }
            - { call: "POST /menu-cycles/${cyc}/publish", payload: {}, as: DiningAdmin }
            # --- historical period 1: 2026-07-30, 100 covers
            - { call: "POST /meal-periods", payload: { dining_hall_id: "${h}", menu_cycle_id: "${cyc}", service_date: "2026-07-30", meal_period: "LUNCH" }, as: HallManager, captures: { p1: $.data.id, p1v: $.data.version } }
            - { call: "POST /meal-periods/${p1}/forecasts", payload: { recipe_id: "${r}", variant: "BASE", expected_meal_period_version: "${p1v}" }, as: KitchenLead, captures: { f1: $.data.id } }
            - { call: "POST /production-forecasts/${f1}/lock", payload: {}, as: KitchenLead }
            - { call: "POST /meal-periods/${p1}/lock-forecast", payload: {}, as: HallManager }
            - { call: "POST /meal-periods/${p1}/open-service", payload: {}, as: HallManager }
            - { call: "POST /meal-periods/${p1}/swipes", payload: { events: [ { entry_type: "BOARD_SWIPE", amount_cents: 0, count: 100 } ] }, as: HallManager }
            # --- historical period 2: 2026-08-06, 110 covers
            - { call: "POST /meal-periods", payload: { dining_hall_id: "${h}", menu_cycle_id: "${cyc}", service_date: "2026-08-06", meal_period: "LUNCH" }, as: HallManager, captures: { p2: $.data.id, p2v: $.data.version } }
            - { call: "POST /meal-periods/${p2}/forecasts", payload: { recipe_id: "${r}", variant: "BASE", expected_meal_period_version: "${p2v}" }, as: KitchenLead, captures: { f2: $.data.id } }
            - { call: "POST /production-forecasts/${f2}/lock", payload: {}, as: KitchenLead }
            - { call: "POST /meal-periods/${p2}/lock-forecast", payload: {}, as: HallManager }
            - { call: "POST /meal-periods/${p2}/open-service", payload: {}, as: HallManager }
            - { call: "POST /meal-periods/${p2}/swipes", payload: { events: [ { entry_type: "BOARD_SWIPE", amount_cents: 0, count: 110 } ] }, as: HallManager }
            # --- historical period 3: 2026-08-13, 120 covers
            - { call: "POST /meal-periods", payload: { dining_hall_id: "${h}", menu_cycle_id: "${cyc}", service_date: "2026-08-13", meal_period: "LUNCH" }, as: HallManager, captures: { p3: $.data.id, p3v: $.data.version } }
            - { call: "POST /meal-periods/${p3}/forecasts", payload: { recipe_id: "${r}", variant: "BASE", expected_meal_period_version: "${p3v}" }, as: KitchenLead, captures: { f3: $.data.id } }
            - { call: "POST /production-forecasts/${f3}/lock", payload: {}, as: KitchenLead }
            - { call: "POST /meal-periods/${p3}/lock-forecast", payload: {}, as: HallManager }
            - { call: "POST /meal-periods/${p3}/open-service", payload: {}, as: HallManager }
            - { call: "POST /meal-periods/${p3}/swipes", payload: { events: [ { entry_type: "BOARD_SWIPE", amount_cents: 0, count: 120 } ] }, as: HallManager }
            # --- historical period 4: 2026-08-20, 130 covers
            - { call: "POST /meal-periods", payload: { dining_hall_id: "${h}", menu_cycle_id: "${cyc}", service_date: "2026-08-20", meal_period: "LUNCH" }, as: HallManager, captures: { p4: $.data.id, p4v: $.data.version } }
            - { call: "POST /meal-periods/${p4}/forecasts", payload: { recipe_id: "${r}", variant: "BASE", expected_meal_period_version: "${p4v}" }, as: KitchenLead, captures: { f4: $.data.id } }
            - { call: "POST /production-forecasts/${f4}/lock", payload: {}, as: KitchenLead }
            - { call: "POST /meal-periods/${p4}/lock-forecast", payload: {}, as: HallManager }
            - { call: "POST /meal-periods/${p4}/open-service", payload: {}, as: HallManager }
            - { call: "POST /meal-periods/${p4}/swipes", payload: { events: [ { entry_type: "BOARD_SWIPE", amount_cents: 0, count: 130 } ] }, as: HallManager }
            # --- target period
            - { call: "POST /meal-periods", payload: { dining_hall_id: "${h}", menu_cycle_id: "${cyc}", service_date: "2026-08-27", meal_period: "LUNCH" }, as: HallManager, captures: { tp: $.data.id, tpv: $.data.version } }
          trigger:
            - { call: "POST /meal-periods/${tp}/forecasts", payload: { recipe_id: "${r}", variant: "BASE", expected_meal_period_version: "${tpv}" }, as: KitchenLead, captures: { fb: $.data.id, fb_portions: $.data.forecasted_portions } }
            - { call: "POST /production-forecasts/${fb}/lock", payload: {}, as: KitchenLead }
            - { call: "GET /meal-periods/${tp}", payload: {}, as: HallManager, captures: { tpv2: $.data.version } }
            - { call: "POST /meal-periods/${tp}/forecasts", payload: { recipe_id: "${r}", variant: "TREND", expected_meal_period_version: "${tpv2}" }, as: KitchenLead, captures: { ft: $.data.id, ft_portions: $.data.forecasted_portions } }
          assert:
            - "BASE forecast forecasted_portions == 60  (mean(100,110,120,130)=115; round_half_up(115*0.5*1.05)=round_half_up(60.375)=60)"
            - "TREND forecast forecasted_portions == 66  (slope=(130-100)/3=10; base 125; round_half_up(125*0.5*1.05)=round_half_up(65.625)=66)"
            - "GET /production-forecasts?meal_period_id=${tp}&recipe_id=${r} shows the BASE forecast with status SUPERSEDED and the TREND forecast with status DRAFT"
            - "Both forecasts share identical history inputs — only the variant differs"

      - name: commission_provisional_vs_final_settlement
        grounds:
          - calculations.commission_settlement
          - state_machines.CommissionStatement.PROVISIONAL_to_FINALIZED
          - entities.CommissionStatement.fields.provisional_total_due_cents
        distinguishing_aspect: |
          Same August activity on the fiscal domain: the PROVISIONAL variant
          (RECONCILED+CLOSED periods, quoted catering, no top-up) totals 47000
          while the FINAL variant (CLOSED only, PAID catering at final_total,
          guarantee top-up) totals 50000 — entity domain CommissionStatement,
          disjoint from the production domain of forecast_base_vs_trend_variants.
        test_recipe:
          setup:
            - "Hall with ACTIVE contract: board_rate 500, retail 1000 bps, catering 800 bps, minimum guarantee 50000, effective [2026-08-01, 2026-12-01)"
            - "P1 (2026-08-03 LUNCH) CLOSED with 200 board swipes and 100 retail sales of 3000 cents; P2 (2026-08-04 LUNCH) RECONCILED (not closed) with 100 board swipes and 50 retail sales of 1000 cents"
            - "Catering order A (event 2026-08-20 DINNER) PAID with quoted 100000 and final_total 110000; catering order B (event 2026-08-21 LUNCH) SCHEDULED with quoted 50000"
            - "Department budget 10000000"
          setup_api_calls:
            - { call: "POST /dining-halls", payload: { name: "South Hall", service_model: "HYBRID", dining_capacity: 1000, catering_kitchen_capacity: 500 }, as: DiningAdmin, captures: { h: $.data.id } }
            - { call: "POST /vendor-contracts", payload: { dining_hall_id: "${h}", vendor_name: "CampusEats LLC", board_rate_per_cover_cents: 500, retail_commission_bps: 1000, catering_commission_bps: 800, minimum_monthly_guarantee_cents: 50000, effective_start_date: "2026-08-01", effective_end_date: "2026-12-01" }, as: DiningAdmin, captures: { vc: $.data.id } }
            - { call: "POST /vendor-contracts/${vc}/activate", payload: {}, as: ContractManager }
            - { call: "POST /recipes", payload: { dining_hall_id: "${h}", name: "Pasta", station: "GLOBAL", allergen_tags: [], dietary_flags: ["VEGETARIAN"], popularity_share: 0.5, unit_cost_cents: 800, allergen_reviewed: true }, as: KitchenLead, captures: { r: $.data.id } }
            - { call: "POST /menu-cycles", payload: { dining_hall_id: "${h}", name: "Aug cycle", cycle_length_weeks: 4, start_date: "2026-07-01", end_date: "2026-10-01" }, as: DiningAdmin, captures: { cyc: $.data.id } }
            - { call: "POST /menu-cycles/${cyc}/publish", payload: {}, as: DiningAdmin }
            # --- P1 to CLOSED
            - { call: "POST /meal-periods", payload: { dining_hall_id: "${h}", menu_cycle_id: "${cyc}", service_date: "2026-08-03", meal_period: "LUNCH" }, as: HallManager, captures: { p1: $.data.id, p1v: $.data.version } }
            - { call: "POST /meal-periods/${p1}/forecasts", payload: { recipe_id: "${r}", variant: "BASE", expected_meal_period_version: "${p1v}" }, as: KitchenLead, captures: { f1: $.data.id } }
            - { call: "POST /production-forecasts/${f1}/lock", payload: {}, as: KitchenLead }
            - { call: "POST /meal-periods/${p1}/lock-forecast", payload: {}, as: HallManager }
            - { call: "POST /meal-periods/${p1}/open-service", payload: {}, as: HallManager }
            - { call: "POST /meal-periods/${p1}/swipes", payload: { events: [ { entry_type: "BOARD_SWIPE", amount_cents: 0, count: 200 }, { entry_type: "RETAIL_SALE", amount_cents: 3000, count: 100 } ] }, as: HallManager }
            - { call: "POST /meal-periods/${p1}/reconcile", payload: {}, as: HallManager }
            - { call: "POST /meal-periods/${p1}/close", payload: {}, as: DiningAdmin }
            # --- P2 to RECONCILED
            - { call: "POST /meal-periods", payload: { dining_hall_id: "${h}", menu_cycle_id: "${cyc}", service_date: "2026-08-04", meal_period: "LUNCH" }, as: HallManager, captures: { p2: $.data.id, p2v: $.data.version } }
            - { call: "POST /meal-periods/${p2}/forecasts", payload: { recipe_id: "${r}", variant: "BASE", expected_meal_period_version: "${p2v}" }, as: KitchenLead, captures: { f2: $.data.id } }
            - { call: "POST /production-forecasts/${f2}/lock", payload: {}, as: KitchenLead }
            - { call: "POST /meal-periods/${p2}/lock-forecast", payload: {}, as: HallManager }
            - { call: "POST /meal-periods/${p2}/open-service", payload: {}, as: HallManager }
            - { call: "POST /meal-periods/${p2}/swipes", payload: { events: [ { entry_type: "BOARD_SWIPE", amount_cents: 0, count: 100 }, { entry_type: "RETAIL_SALE", amount_cents: 1000, count: 50 } ] }, as: HallManager }
            - { call: "POST /meal-periods/${p2}/reconcile", payload: {}, as: HallManager }
            # --- department + catering A to PAID
            - { call: "POST /departments", payload: { name: "Engineering", department_code: "ENG", semester_budget_cents: 10000000 }, as: DiningAdmin, captures: { d: $.data.id } }
            - { call: "POST /catering-orders", payload: { dining_hall_id: "${h}", department_id: "${d}", event_date: "2026-08-20", time_slot: "DINNER", guaranteed_covers: 100, menu_lines: [ { recipe_id: "${r}", portions: 90 } ], dietary_plates: 0 }, as: DepartmentUser, as_user_id: "${d}", captures: { oa: $.data.id, oa_q: $.data.quoted_total_cents } }
            - { call: "POST /catering-orders/${oa}/submit", payload: {}, as: DepartmentUser, as_user_id: "${d}" }
            - { call: "GET /departments/${d}", payload: {}, as: DiningAdmin, captures: { dv1: $.data.version } }
            - { call: "POST /catering-orders/${oa}/approve", payload: { expected_department_version: "${dv1}" }, as: HallManager }
            - { call: "POST /catering-orders/${oa}/schedule", payload: {}, as: HallManager }
            - { call: "POST /catering-orders/${oa}/fulfill", payload: {}, as: KitchenLead }
            - { call: "POST /catering-orders/${oa}/invoice", payload: { final_total_cents: 110000 }, as: HallManager }
            - { call: "POST /catering-orders/${oa}/pay", payload: {}, as: DiningAdmin }
            # --- catering B to SCHEDULED (minimum-floor quote 50000)
            - { call: "POST /catering-orders", payload: { dining_hall_id: "${h}", department_id: "${d}", event_date: "2026-08-21", time_slot: "LUNCH", guaranteed_covers: 10, menu_lines: [ { recipe_id: "${r}", portions: 5 } ], dietary_plates: 0 }, as: DepartmentUser, as_user_id: "${d}", captures: { ob: $.data.id } }
            - { call: "POST /catering-orders/${ob}/submit", payload: {}, as: DepartmentUser, as_user_id: "${d}" }
            - { call: "GET /departments/${d}", payload: {}, as: DiningAdmin, captures: { dv2: $.data.version } }
            - { call: "POST /catering-orders/${ob}/approve", payload: { expected_department_version: "${dv2}" }, as: HallManager }
            - { call: "POST /catering-orders/${ob}/schedule", payload: {}, as: HallManager }
          trigger:
            - { call: "POST /vendor-contracts/${vc}/commission-statements", payload: { period_month: "2026-08" }, as: DiningAdmin, captures: { st: $.data.id, st_prov_total: $.data.total_due_to_university_cents } }
            - { call: "POST /commission-statements/${st}/finalize", payload: {}, as: ContractManager }
          assert:
            - "After create: status == PROVISIONAL, board_revenue_cents == 150000, retail_commission_cents == 35000, catering_commission_cents == 12000, guarantee_top_up_cents == 0, total_due_to_university_cents == 47000, provisional_total_due_cents == 47000"
            - "After finalize: status == FINALIZED, board_revenue_cents == 100000 (P2 excluded: still RECONCILED), retail_commission_cents == 30000, catering_commission_cents == 8800 (PAID order A only, on final_total 110000; B excluded), guarantee_top_up_cents == 11200, total_due_to_university_cents == 50000"
            - "provisional_total_due_cents remains 47000 after finalize"
            - "identical underlying activity; the two variants differ by inclusion set, catering base, and the top-up rule"

  # ===========================================================================
  # Rule 2 — combinatorial_formula: instances in modes (a), (b), (c)
  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: catering_quote_tiered_markup_at_covers_boundary
        grounds:
          - calculations.catering_quote
          - entities.CateringOrder.fields.quoted_total_cents
        distinguishing_aspect: |
          Mode (a) — a formula with 4 inputs (food cost, covers tier, dietary
          plates, per-cover service fee), tiered rate selection, and a max()
          floor: guaranteed_covers == 200 selects the 1.15 tier (not 1.25),
          producing exactly 188000; one cover fewer (199) would select 1.25.
        test_recipe:
          setup:
            - "Hall (kitchen capacity 10000), recipes R1 (unit_cost 800) and R2 (unit_cost 600), department with budget 10000000"
            - "Order: covers 200, menu R1x150 + R2x50 (food cost 150000), 10 dietary plates"
          setup_api_calls:
            - { call: "POST /dining-halls", payload: { name: "Hall Q", service_model: "RETAIL", dining_capacity: 800, catering_kitchen_capacity: 10000 }, as: DiningAdmin, captures: { h: $.data.id } }
            - { call: "POST /recipes", payload: { dining_hall_id: "${h}", name: "R1", station: "GRILL", allergen_tags: [], dietary_flags: [], popularity_share: 0.5, unit_cost_cents: 800, allergen_reviewed: true }, as: KitchenLead, captures: { r1: $.data.id } }
            - { call: "POST /recipes", payload: { dining_hall_id: "${h}", name: "R2", station: "DELI", allergen_tags: [], dietary_flags: [], popularity_share: 0.5, unit_cost_cents: 600, allergen_reviewed: true }, as: KitchenLead, captures: { r2: $.data.id } }
            - { call: "POST /departments", payload: { name: "Law", department_code: "LAW", semester_budget_cents: 10000000 }, as: DiningAdmin, captures: { d: $.data.id } }
          trigger:
            - { call: "POST /catering-orders", payload: { dining_hall_id: "${h}", department_id: "${d}", event_date: "2026-09-15", time_slot: "LUNCH", guaranteed_covers: 200, menu_lines: [ { recipe_id: "${r1}", portions: 150 }, { recipe_id: "${r2}", portions: 50 } ], dietary_plates: 10 }, as: DepartmentUser, as_user_id: "${d}", captures: { o: $.data.id, oq: $.data.quoted_total_cents } }
          assert:
            - "quoted_total_cents == 188000  (marked_up = round_half_up(150000*1.15) = 172500; dietary = 10*300 = 3000; service = 7500 + 25*200 = 12500; 172500+3000+12500 = 188000 >= 50000 floor)"
            - "tier proof: at covers == 200 the rate is 1.15 — had 1.25 applied, marked_up would be 187500 and total 203000"
            - "approval_status == DRAFT and fulfillment_status == NONE at creation"

      - name: commission_per_event_rounding_order
        grounds:
          - calculations.commission_settlement
          - entities.CommissionStatement.fields.retail_commission_cents
        distinguishing_aspect: |
          Mode (b) — nested rounding order: three 335-cent retail sales at 1500
          bps round per-event to 50 each (sum 150); the forbidden sum-then-round
          order gives round_half_up(1005*0.15) = 151. Scaffold pins per-event.
        test_recipe:
          setup:
            - "Hall with ACTIVE contract: retail_commission_bps 1500, catering 0 bps, guarantee 0; one CLOSED period (2026-08-05 LUNCH) containing exactly three RETAIL_SALE events of 335 cents and zero board swipes"
          setup_api_calls:
            - { call: "POST /dining-halls", payload: { name: "Hall R", service_model: "RETAIL", dining_capacity: 800, catering_kitchen_capacity: 500 }, as: DiningAdmin, captures: { h: $.data.id } }
            - { call: "POST /vendor-contracts", payload: { dining_hall_id: "${h}", vendor_name: "RoundTest", board_rate_per_cover_cents: 500, retail_commission_bps: 1500, catering_commission_bps: 0, minimum_monthly_guarantee_cents: 0, effective_start_date: "2026-08-01", effective_end_date: "2026-12-01" }, as: DiningAdmin, captures: { vc: $.data.id } }
            - { call: "POST /vendor-contracts/${vc}/activate", payload: {}, as: ContractManager }
            - { call: "POST /recipes", payload: { dining_hall_id: "${h}", name: "Soup", station: "DELI", allergen_tags: [], dietary_flags: [], popularity_share: 0.5, unit_cost_cents: 400, allergen_reviewed: true }, as: KitchenLead, captures: { r: $.data.id } }
            - { call: "POST /menu-cycles", payload: { dining_hall_id: "${h}", name: "Cyc", cycle_length_weeks: 4, start_date: "2026-07-01", end_date: "2026-10-01" }, as: DiningAdmin, captures: { cyc: $.data.id } }
            - { call: "POST /menu-cycles/${cyc}/publish", payload: {}, as: DiningAdmin }
            - { call: "POST /meal-periods", payload: { dining_hall_id: "${h}", menu_cycle_id: "${cyc}", service_date: "2026-08-05", meal_period: "LUNCH" }, as: HallManager, captures: { p: $.data.id, pv: $.data.version } }
            - { call: "POST /meal-periods/${p}/forecasts", payload: { recipe_id: "${r}", variant: "BASE", expected_meal_period_version: "${pv}" }, as: KitchenLead, captures: { f: $.data.id } }
            - { call: "POST /production-forecasts/${f}/lock", payload: {}, as: KitchenLead }
            - { call: "POST /meal-periods/${p}/lock-forecast", payload: {}, as: HallManager }
            - { call: "POST /meal-periods/${p}/open-service", payload: {}, as: HallManager }
            - { call: "POST /meal-periods/${p}/swipes", payload: { events: [ { entry_type: "RETAIL_SALE", amount_cents: 335, count: 3 } ] }, as: HallManager }
            - { call: "POST /meal-periods/${p}/reconcile", payload: {}, as: HallManager }
            - { call: "POST /meal-periods/${p}/close", payload: {}, as: DiningAdmin }
          trigger:
            - { call: "POST /vendor-contracts/${vc}/commission-statements", payload: { period_month: "2026-08" }, as: DiningAdmin, captures: { st: $.data.id } }
          assert:
            - "retail_commission_cents == 150  (3 x round_half_up(335*1500/10000) = 3 x round_half_up(50.25) = 3 x 50)"
            - "retail_commission_cents != 151  (sum-then-round would give round_half_up(1005*0.15) = 151 — the pinned order is per-event then sum)"
            - "board_revenue_cents == 0, catering_commission_cents == 0, guarantee_top_up_cents == 0, total_due_to_university_cents == 150"

      - name: overtime_split_shift_evaluation_order
        grounds:
          - calculations.weekly_overtime_allocation
          - entities.LaborShift.fields.overtime_minutes
        distinguishing_aspect: |
          Mode (c) — circular-looking dependency resolved by pinned evaluation
          order: whether Friday's shift is overtime depends on the weekly
          accumulator, which depends on which shifts are already COMPLETED;
          replay in chronological order makes Friday's 480-minute shift split
          exactly 240 regular + 240 overtime when 2160 minutes precede it.
        test_recipe:
          setup:
            - "Hall ACTIVE; staff_ref S2 with Mon-Thu 2026-08-03..06 shifts 480-1020 (540 min each, rate 2000) CONFIRMED then COMPLETED in order"
            - "Friday 2026-08-07 shift 480-960 (480 min) CONFIRMED, about to complete"
          setup_api_calls:
            - { call: "POST /dining-halls", payload: { name: "Hall OT", service_model: "BOARD", dining_capacity: 800, catering_kitchen_capacity: 500 }, as: DiningAdmin, captures: { h: $.data.id } }
            - { call: "POST /labor-shifts", payload: { dining_hall_id: "${h}", staff_ref: "S2", role: "COOK", shift_date: "2026-08-03", start_minute: 480, end_minute: 1020, hourly_rate_cents: 2000 }, as: HallManager, captures: { s1: $.data.id } }
            - { call: "POST /labor-shifts/${s1}/confirm", payload: {}, as: HallManager }
            - { call: "POST /labor-shifts/${s1}/complete", payload: { worked_minutes: 540 }, as: HallManager }
            - { call: "POST /labor-shifts", payload: { dining_hall_id: "${h}", staff_ref: "S2", role: "COOK", shift_date: "2026-08-04", start_minute: 480, end_minute: 1020, hourly_rate_cents: 2000 }, as: HallManager, captures: { s2: $.data.id } }
            - { call: "POST /labor-shifts/${s2}/confirm", payload: {}, as: HallManager }
            - { call: "POST /labor-shifts/${s2}/complete", payload: { worked_minutes: 540 }, as: HallManager }
            - { call: "POST /labor-shifts", payload: { dining_hall_id: "${h}", staff_ref: "S2", role: "COOK", shift_date: "2026-08-05", start_minute: 480, end_minute: 1020, hourly_rate_cents: 2000 }, as: HallManager, captures: { s3: $.data.id } }
            - { call: "POST /labor-shifts/${s3}/confirm", payload: {}, as: HallManager }
            - { call: "POST /labor-shifts/${s3}/complete", payload: { worked_minutes: 540 }, as: HallManager }
            - { call: "POST /labor-shifts", payload: { dining_hall_id: "${h}", staff_ref: "S2", role: "COOK", shift_date: "2026-08-06", start_minute: 480, end_minute: 1020, hourly_rate_cents: 2000 }, as: HallManager, captures: { s4: $.data.id } }
            - { call: "POST /labor-shifts/${s4}/confirm", payload: {}, as: HallManager }
            - { call: "POST /labor-shifts/${s4}/complete", payload: { worked_minutes: 540 }, as: HallManager }
            - { call: "POST /labor-shifts", payload: { dining_hall_id: "${h}", staff_ref: "S2", role: "COOK", shift_date: "2026-08-07", start_minute: 480, end_minute: 960, hourly_rate_cents: 2000 }, as: HallManager, captures: { s5: $.data.id } }
            - { call: "POST /labor-shifts/${s5}/confirm", payload: {}, as: HallManager }
          trigger:
            - { call: "POST /labor-shifts/${s5}/complete", payload: { worked_minutes: 480 }, as: HallManager }
          assert:
            - "Friday shift regular_minutes == 240 and overtime_minutes == 240 (accumulator 2160 + 240 reaches exactly 2400; only minutes beyond 2400 are OT)"
            - "Friday regular_pay_cents == 8000 (240*2000/60) and overtime_pay_cents == 12000 (240*2000*1.5/60)"
            - "Monday shift (${s1}) retains regular_minutes == 540 and overtime_minutes == 0 — earlier completions are not retroactively adjusted"

  # ===========================================================================
  # Rule 3 — non_linear_state_machine: cycle on AccommodationRequest, cycle on
  # WasteLog, cycle on CommissionStatement (three different entities)
  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: accommodation_review_info_cycle
        grounds:
          - state_machines.AccommodationRequest.SUBMITTED_to_NUTRITION_REVIEW
          - state_machines.AccommodationRequest.NUTRITION_REVIEW_to_SUBMITTED
          - state_machines.AccommodationRequest.NUTRITION_REVIEW_to_APPROVED
        distinguishing_aspect: |
          Cyclic machine on AccommodationRequest: the request traverses
          SUBMITTED -> NUTRITION_REVIEW -> SUBMITTED (request-info loop) ->
          NUTRITION_REVIEW -> APPROVED -> ACTIVE; the loop edge distinguishes
          it from the linear MealPeriodService pipeline.
        test_recipe:
          setup:
            - "Hall with one ACTIVE recipe (VEGAN, allergen-free) so the suitable-menu gate passes"
            - "Accommodation request for student STU-1 excluding PEANUT, requirement VEGAN, in SUBMITTED"
          setup_api_calls:
            - { call: "POST /dining-halls", payload: { name: "Hall Ac", service_model: "BOARD", dining_capacity: 800, catering_kitchen_capacity: 500 }, as: DiningAdmin, captures: { h: $.data.id } }
            - { call: "POST /recipes", payload: { dining_hall_id: "${h}", name: "Vegan Chili", station: "GLOBAL", allergen_tags: [], dietary_flags: ["VEGAN"], popularity_share: 0.5, unit_cost_cents: 500, allergen_reviewed: true }, as: KitchenLead, captures: { r: $.data.id } }
            - { call: "POST /accommodation-requests", payload: { dining_hall_id: "${h}", student_ref: "STU-1", allergen_exclusions: ["PEANUT"], dietary_requirement: "VEGAN" }, as: HallManager, captures: { ar: $.data.id, ar_s0: $.data.status } }
          trigger:
            - { call: "POST /accommodation-requests/${ar}/start-review", payload: {}, as: Dietitian, captures: { ar_s1: $.data.status } }
            - { call: "POST /accommodation-requests/${ar}/request-info", payload: { review_notes: "need brand list" }, as: Dietitian, captures: { ar_s2: $.data.status } }
            - { call: "POST /accommodation-requests/${ar}/start-review", payload: {}, as: Dietitian, captures: { ar_s3: $.data.status } }
            - { call: "POST /accommodation-requests/${ar}/approve", payload: {}, as: Dietitian, captures: { ar_s4: $.data.status } }
            - { call: "POST /accommodation-requests/${ar}/activate", payload: {}, as: KitchenLead, captures: { ar_s5: $.data.status } }
          assert:
            - "Observed statuses in order: SUBMITTED (create), NUTRITION_REVIEW, SUBMITTED (after request-info), NUTRITION_REVIEW, APPROVED, ACTIVE"
            - "After request-info: review_notes == 'need brand list'"
            - "The NUTRITION_REVIEW -> SUBMITTED edge fired without error, proving the cycle is legal (not a terminal lockdown)"

      - name: waste_log_verify_reject_cycle
        grounds:
          - state_machines.WasteLog.RECORDED_to_VERIFIED
          - state_machines.WasteLog.VERIFIED_to_RECORDED
          - state_machines.WasteLog.VERIFIED_to_POSTED
        distinguishing_aspect: |
          Cyclic machine on WasteLog: RECORDED -> VERIFIED -> RECORDED (reject)
          -> VERIFIED -> POSTED; the reject edge reopens the log, and only the
          final post moves mass into the period aggregates.
        test_recipe:
          setup:
            - "Hall + recipe + published cycle; period 2026-08-10 LUNCH driven to RECONCILED with 1 board swipe"
            - "Waste log 10.0 kg LANDFILL / PRE_CONSUMER recorded by KitchenLead user kl-1"
          setup_api_calls:
            - { call: "POST /dining-halls", payload: { name: "Hall W", service_model: "BOARD", dining_capacity: 800, catering_kitchen_capacity: 500 }, as: DiningAdmin, captures: { h: $.data.id } }
            - { call: "POST /recipes", payload: { dining_hall_id: "${h}", name: "Rice", station: "GLOBAL", allergen_tags: [], dietary_flags: [], popularity_share: 0.5, unit_cost_cents: 300, allergen_reviewed: true }, as: KitchenLead, captures: { r: $.data.id } }
            - { call: "POST /menu-cycles", payload: { dining_hall_id: "${h}", name: "Cyc", cycle_length_weeks: 4, start_date: "2026-07-01", end_date: "2026-10-01" }, as: DiningAdmin, captures: { cyc: $.data.id } }
            - { call: "POST /menu-cycles/${cyc}/publish", payload: {}, as: DiningAdmin }
            - { call: "POST /meal-periods", payload: { dining_hall_id: "${h}", menu_cycle_id: "${cyc}", service_date: "2026-08-10", meal_period: "LUNCH" }, as: HallManager, captures: { p: $.data.id, pv: $.data.version } }
            - { call: "POST /meal-periods/${p}/forecasts", payload: { recipe_id: "${r}", variant: "BASE", expected_meal_period_version: "${pv}" }, as: KitchenLead, captures: { f: $.data.id } }
            - { call: "POST /production-forecasts/${f}/lock", payload: {}, as: KitchenLead }
            - { call: "POST /meal-periods/${p}/lock-forecast", payload: {}, as: HallManager }
            - { call: "POST /meal-periods/${p}/open-service", payload: {}, as: HallManager }
            - { call: "POST /meal-periods/${p}/swipes", payload: { events: [ { entry_type: "BOARD_SWIPE", amount_cents: 0, count: 1 } ] }, as: HallManager }
            - { call: "POST /meal-periods/${p}/reconcile", payload: {}, as: HallManager }
            - { call: "POST /meal-periods/${p}/waste-logs", payload: { category: "PRE_CONSUMER", disposition: "LANDFILL", weight_kg: 10.0 }, as: KitchenLead, as_user_id: "kl-1", captures: { wl: $.data.id, wl_s0: $.data.status } }
          trigger:
            - { call: "POST /waste-logs/${wl}/verify", payload: {}, as: HallManager, as_user_id: "hm-1", captures: { wl_s1: $.data.status } }
            - { call: "POST /waste-logs/${wl}/reject", payload: {}, as: HallManager, captures: { wl_s2: $.data.status } }
            - { call: "POST /waste-logs/${wl}/verify", payload: {}, as: HallManager, as_user_id: "hm-1", captures: { wl_s3: $.data.status } }
            - { call: "POST /waste-logs/${wl}/post", payload: {}, as: HallManager, captures: { wl_s4: $.data.status } }
            - { call: "GET /meal-periods/${p}", payload: {}, as: HallManager, captures: { p_waste: $.data.posted_waste_kg } }
          assert:
            - "Observed log statuses in order: RECORDED, VERIFIED, RECORDED (reject cycle), VERIFIED, POSTED"
            - "After reject: verified_by_user_id is null"
            - "MealPeriodService.posted_waste_kg == 10.0 exactly once — the verify/reject cycle never touched the POSTED set"

      - name: commission_dispute_recompute_cycle
        grounds:
          - state_machines.CommissionStatement.FINALIZED_to_DISPUTED
          - state_machines.CommissionStatement.DISPUTED_to_PROVISIONAL
          - calculations.commission_settlement
        distinguishing_aspect: |
          Cyclic machine on CommissionStatement: PROVISIONAL -> FINALIZED ->
          DISPUTED -> PROVISIONAL; recompute regenerates provisional figures and
          clears finalized_at while provisional_total_due_cents stays pinned —
          a different entity than AccommodationRequest or WasteLog.
        test_recipe:
          setup:
            - "Hall with ACTIVE contract (board 500, retail 1000 bps, catering 800 bps, guarantee 0); statement for 2026-08 with no activity (all monetary fields 0)"
          setup_api_calls:
            - { call: "POST /dining-halls", payload: { name: "Hall CS", service_model: "RETAIL", dining_capacity: 800, catering_kitchen_capacity: 500 }, as: DiningAdmin, captures: { h: $.data.id } }
            - { call: "POST /vendor-contracts", payload: { dining_hall_id: "${h}", vendor_name: "CycleVendor", board_rate_per_cover_cents: 500, retail_commission_bps: 1000, catering_commission_bps: 800, minimum_monthly_guarantee_cents: 0, effective_start_date: "2026-08-01", effective_end_date: "2026-12-01" }, as: DiningAdmin, captures: { vc: $.data.id } }
            - { call: "POST /vendor-contracts/${vc}/activate", payload: {}, as: ContractManager }
            - { call: "POST /vendor-contracts/${vc}/commission-statements", payload: { period_month: "2026-08" }, as: DiningAdmin, captures: { st: $.data.id, st_s0: $.data.status } }
          trigger:
            - { call: "POST /commission-statements/${st}/finalize", payload: {}, as: ContractManager, captures: { st_s1: $.data.status } }
            - { call: "POST /commission-statements/${st}/dispute", payload: { reason: "vendor disputes retail count" }, as: DiningAdmin, captures: { st_s2: $.data.status } }
            - { call: "POST /commission-statements/${st}/recompute", payload: {}, as: DiningAdmin, captures: { st_s3: $.data.status, st_fin: $.data.finalized_at } }
          assert:
            - "Observed statuses in order: PROVISIONAL, FINALIZED, DISPUTED, PROVISIONAL"
            - "After recompute: finalized_at is null and total_due_to_university_cents == 0"
            - "provisional_total_due_cents == 0 and unchanged across the whole cycle"

  # ===========================================================================
  # Rule 4 — transitive_cascade: depth-3 from inspection submit, depth-2 from
  # waste post, depth-3 from corrective reopen (three different triggers)
  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: inspection_fail_suspends_hall_cancels_periods
        grounds:
          - state_machines.InspectionReport.DRAFT_to_SUBMITTED
          - state_machines.DiningHall.ACTIVE_to_SUSPENDED
          - state_machines.MealPeriodService.SCHEDULED_to_CANCELLED
          - calculations.inspection_scoring
        distinguishing_aspect: |
          Depth-3 chain triggered by inspection submit: (1) C5 computes outcome
          FAIL on the report, (2) the FAIL outcome suspends the hall,
          (3) the hall's suspension cancels its SCHEDULED periods. The FORECAST_
          LOCKED/IN_SERVICE sibling proves the cascade is state-conditional.
        test_recipe:
          setup:
            - "Hall with recipe + published cycle; period P1 (2026-08-10 LUNCH) in SCHEDULED; period P2 (2026-08-11 LUNCH) in IN_SERVICE"
            - "Inspection report with one CRITICAL violation, inspection_date 2026-08-12, in DRAFT"
          setup_api_calls:
            - { call: "POST /dining-halls", payload: { name: "Hall IC", service_model: "BOARD", dining_capacity: 800, catering_kitchen_capacity: 500 }, as: DiningAdmin, captures: { h: $.data.id } }
            - { call: "POST /recipes", payload: { dining_hall_id: "${h}", name: "Stew", station: "GLOBAL", allergen_tags: [], dietary_flags: [], popularity_share: 0.5, unit_cost_cents: 500, allergen_reviewed: true }, as: KitchenLead, captures: { r: $.data.id } }
            - { call: "POST /menu-cycles", payload: { dining_hall_id: "${h}", name: "Cyc", cycle_length_weeks: 4, start_date: "2026-07-01", end_date: "2026-10-01" }, as: DiningAdmin, captures: { cyc: $.data.id } }
            - { call: "POST /menu-cycles/${cyc}/publish", payload: {}, as: DiningAdmin }
            - { call: "POST /meal-periods", payload: { dining_hall_id: "${h}", menu_cycle_id: "${cyc}", service_date: "2026-08-10", meal_period: "LUNCH" }, as: HallManager, captures: { p1: $.data.id } }
            - { call: "POST /meal-periods", payload: { dining_hall_id: "${h}", menu_cycle_id: "${cyc}", service_date: "2026-08-11", meal_period: "LUNCH" }, as: HallManager, captures: { p2: $.data.id, p2v: $.data.version } }
            - { call: "POST /meal-periods/${p2}/forecasts", payload: { recipe_id: "${r}", variant: "BASE", expected_meal_period_version: "${p2v}" }, as: KitchenLead, captures: { f2: $.data.id } }
            - { call: "POST /production-forecasts/${f2}/lock", payload: {}, as: KitchenLead }
            - { call: "POST /meal-periods/${p2}/lock-forecast", payload: {}, as: HallManager }
            - { call: "POST /meal-periods/${p2}/open-service", payload: {}, as: HallManager }
            - { call: "POST /inspection-reports", payload: { dining_hall_id: "${h}", inspection_date: "2026-08-12", violations: [ { code: "TEMP-01", severity: "CRITICAL" } ] }, as: HealthInspector, as_user_id: "insp-1", captures: { ir: $.data.id } }
          trigger:
            - { call: "POST /inspection-reports/${ir}/submit", payload: {}, as: HealthInspector, as_user_id: "insp-1", captures: { ir_outcome: $.data.outcome, ir_score: $.data.score } }
          assert:
            - "InspectionReport.outcome == FAIL despite score == 75 (any CRITICAL forces FAIL) — link 1"
            - "DiningHall.status == SUSPENDED — link 2, caused by the FAIL outcome"
            - "MealPeriodService ${p1}.status == CANCELLED — link 3, caused by the hall suspension"
            - "MealPeriodService ${p2}.status == IN_SERVICE (cascade touches only SCHEDULED periods)"
            - "GET /corrective-actions?inspection_report_id=${ir} returns exactly 1 row: severity CRITICAL, status OPEN, due_date == 2026-08-19 (inspection_date + 7d)"

      - name: waste_post_threshold_alert_cascade
        grounds:
          - state_machines.WasteLog.VERIFIED_to_POSTED
          - calculations.sustainability_metrics
          - entities.MealPeriodService.fields.sustainability_alert
        distinguishing_aspect: |
          Depth-2 chain triggered by waste post: (1) the post adds mass to the
          period's POSTED aggregates, (2) the aggregate recompute flips
          sustainability_alert when the ratio crosses 0.15 — the alert is
          caused by the aggregate update, not by the post directly. Different
          trigger than the inspection cascade.
        test_recipe:
          setup:
            - "Period 2026-08-12 LUNCH in RECONCILED with actual_covers == 100 (100 board swipes)"
            - "First waste log 15.0 kg LANDFILL POSTED; second waste log 0.02 kg LANDFILL recorded"
          setup_api_calls:
            - { call: "POST /dining-halls", payload: { name: "Hall SA", service_model: "BOARD", dining_capacity: 800, catering_kitchen_capacity: 500 }, as: DiningAdmin, captures: { h: $.data.id } }
            - { call: "POST /recipes", payload: { dining_hall_id: "${h}", name: "Beans", station: "GLOBAL", allergen_tags: [], dietary_flags: [], popularity_share: 0.5, unit_cost_cents: 300, allergen_reviewed: true }, as: KitchenLead, captures: { r: $.data.id } }
            - { call: "POST /menu-cycles", payload: { dining_hall_id: "${h}", name: "Cyc", cycle_length_weeks: 4, start_date: "2026-07-01", end_date: "2026-10-01" }, as: DiningAdmin, captures: { cyc: $.data.id } }
            - { call: "POST /menu-cycles/${cyc}/publish", payload: {}, as: DiningAdmin }
            - { call: "POST /meal-periods", payload: { dining_hall_id: "${h}", menu_cycle_id: "${cyc}", service_date: "2026-08-12", meal_period: "LUNCH" }, as: HallManager, captures: { p: $.data.id, pv: $.data.version } }
            - { call: "POST /meal-periods/${p}/forecasts", payload: { recipe_id: "${r}", variant: "BASE", expected_meal_period_version: "${pv}" }, as: KitchenLead, captures: { f: $.data.id } }
            - { call: "POST /production-forecasts/${f}/lock", payload: {}, as: KitchenLead }
            - { call: "POST /meal-periods/${p}/lock-forecast", payload: {}, as: HallManager }
            - { call: "POST /meal-periods/${p}/open-service", payload: {}, as: HallManager }
            - { call: "POST /meal-periods/${p}/swipes", payload: { events: [ { entry_type: "BOARD_SWIPE", amount_cents: 0, count: 100 } ] }, as: HallManager }
            - { call: "POST /meal-periods/${p}/reconcile", payload: {}, as: HallManager }
            - { call: "POST /meal-periods/${p}/waste-logs", payload: { category: "POST_CONSUMER", disposition: "LANDFILL", weight_kg: 15.0 }, as: KitchenLead, as_user_id: "kl-1", captures: { w1: $.data.id } }
            - { call: "POST /waste-logs/${w1}/verify", payload: {}, as: HallManager, as_user_id: "hm-1" }
            - { call: "POST /waste-logs/${w1}/post", payload: {}, as: HallManager }
            - { call: "POST /meal-periods/${p}/waste-logs", payload: { category: "POST_CONSUMER", disposition: "LANDFILL", weight_kg: 0.02 }, as: KitchenLead, as_user_id: "kl-1", captures: { w2: $.data.id } }
            - { call: "POST /waste-logs/${w2}/verify", payload: {}, as: HallManager, as_user_id: "hm-1" }
          trigger:
            - { call: "POST /waste-logs/${w2}/post", payload: {}, as: HallManager }
            - { call: "GET /meal-periods/${p}", payload: {}, as: HallManager, captures: { p_kg: $.data.posted_waste_kg, p_alert: $.data.sustainability_alert } }
          assert:
            - "After first post: posted_waste_kg == 15.0 and sustainability_alert == false (15.0/100 == 0.15 exactly; strictly-greater threshold not crossed)"
            - "After second post: posted_waste_kg == 15.02 and landfill_waste_kg == 15.02"
            - "sustainability_alert == true (15.02/100 = 0.1502 > 0.15) — the flag flip is the second link of the cascade"
            - "diversion_rate == 0.0 (all posted mass is LANDFILL)"

      - name: corrective_reopen_resuspends_hall
        grounds:
          - state_machines.CorrectiveAction.RESOLVED_to_OPEN
          - state_machines.DiningHall.ACTIVE_to_SUSPENDED
          - state_machines.MealPeriodService.SCHEDULED_to_CANCELLED
        distinguishing_aspect: |
          Depth-3 chain triggered by corrective-action reopen (a different
          trigger than inspection submit): reopening a CRITICAL action
          re-suspends the reactivated hall, which again cancels its SCHEDULED
          periods — proving the cascade is bound to the hall transition
          regardless of which trigger fires it.
        test_recipe:
          setup:
            - "Hall was suspended by a FAIL inspection, corrective action CA (CRITICAL) RESOLVED but not VERIFIED, hall reactivated to ACTIVE, new period P2 in SCHEDULED"
          setup_api_calls:
            - { call: "POST /dining-halls", payload: { name: "Hall CR", service_model: "BOARD", dining_capacity: 800, catering_kitchen_capacity: 500 }, as: DiningAdmin, captures: { h: $.data.id } }
            - { call: "POST /recipes", payload: { dining_hall_id: "${h}", name: "Soup", station: "DELI", allergen_tags: [], dietary_flags: [], popularity_share: 0.5, unit_cost_cents: 300, allergen_reviewed: true }, as: KitchenLead, captures: { r: $.data.id } }
            - { call: "POST /menu-cycles", payload: { dining_hall_id: "${h}", name: "Cyc", cycle_length_weeks: 4, start_date: "2026-07-01", end_date: "2026-10-01" }, as: DiningAdmin, captures: { cyc: $.data.id } }
            - { call: "POST /menu-cycles/${cyc}/publish", payload: {}, as: DiningAdmin }
            - { call: "POST /inspection-reports", payload: { dining_hall_id: "${h}", inspection_date: "2026-08-05", violations: [ { code: "SAN-07", severity: "CRITICAL" } ] }, as: HealthInspector, as_user_id: "insp-1", captures: { ir: $.data.id } }
            - { call: "POST /inspection-reports/${ir}/submit", payload: {}, as: HealthInspector, as_user_id: "insp-1" }
            - { call: "GET /corrective-actions", payload: { inspection_report_id: "${ir}" }, as: HealthInspector, captures: { ca: "$.data[0].id" } }
            - { call: "POST /inspection-reports/${ir}/acknowledge", payload: {}, as: HallManager }
            - { call: "POST /corrective-actions/${ca}/resolve", payload: {}, as: HallManager }
            - { call: "POST /dining-halls/${h}/reactivate", payload: {}, as: DiningAdmin }
            - { call: "POST /meal-periods", payload: { dining_hall_id: "${h}", menu_cycle_id: "${cyc}", service_date: "2026-08-20", meal_period: "LUNCH" }, as: HallManager, captures: { p2: $.data.id } }
          trigger:
            - { call: "POST /corrective-actions/${ca}/reopen", payload: {}, as: HealthInspector, as_user_id: "insp-1" }
          assert:
            - "CorrectiveAction.status == OPEN and resolved_by_user_id is null — link 1"
            - "DiningHall.status == SUSPENDED — link 2 (CRITICAL reopen on an ACTIVE hall)"
            - "MealPeriodService ${p2}.status == CANCELLED — link 3"
            - "The same hall cascade fired from a different originating trigger than inspection_fail_suspends_hall_cancels_periods"

  # ===========================================================================
  # Rule 5 — priority_pair_validation_conflict: state-vs-fiscal,
  # safety-vs-constraint, auth-vs-existence (three different category pairs)
  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: submit_approved_order_state_beats_budget
        grounds:
          - validations[priority=4]
          - validations[priority=9]
          - state_machines.CateringOrder
        distinguishing_aspect: |
          Category pair state (p4) vs business_fiscal (p9): the order is in
          APPROVED (invalid from-state for submit) AND the department's
          available_cents (12000) is below the quote (188000); the response
          must be ERR_INVALID_STATE (409), never ERR_INSUFFICIENT_BUDGET (402).
        test_recipe:
          setup:
            - "Hall (kitchen 10000), recipe R (unit cost 800), department budget 200000"
            - "Order quoted 188000 (covers 200, R x 200 + ... see chain), SUBMITTED then APPROVED; department available now 12000"
          setup_api_calls:
            - { call: "POST /dining-halls", payload: { name: "Hall P5a", service_model: "RETAIL", dining_capacity: 800, catering_kitchen_capacity: 10000 }, as: DiningAdmin, captures: { h: $.data.id } }
            - { call: "POST /recipes", payload: { dining_hall_id: "${h}", name: "R", station: "GRILL", allergen_tags: [], dietary_flags: [], popularity_share: 0.5, unit_cost_cents: 800, allergen_reviewed: true }, as: KitchenLead, captures: { r: $.data.id } }
            - { call: "POST /departments", payload: { name: "Music", department_code: "MUS", semester_budget_cents: 200000 }, as: DiningAdmin, captures: { d: $.data.id } }
            - { call: "POST /catering-orders", payload: { dining_hall_id: "${h}", department_id: "${d}", event_date: "2026-09-01", time_slot: "DINNER", guaranteed_covers: 200, menu_lines: [ { recipe_id: "${r}", portions: 150 } ], dietary_plates: 20 }, as: DepartmentUser, as_user_id: "${d}", captures: { o: $.data.id } }
            # quote: food 150*800=120000; x1.15 = 138000; dietary 20*300 = 6000; service 7500+5000=12500 -> 156500? NO: use portions 150 + dietary 20 -> 138000+6000+12500 = 156500. Budget 200000 covers it once; after approve available = 43500 < 156500 -> dual failure on re-submit.
            - { call: "POST /catering-orders/${o}/submit", payload: {}, as: DepartmentUser, as_user_id: "${d}" }
            - { call: "GET /departments/${d}", payload: {}, as: DiningAdmin, captures: { dv: $.data.version } }
            - { call: "POST /catering-orders/${o}/approve", payload: { expected_department_version: "${dv}" }, as: HallManager }
          trigger:
            - { call: "POST /catering-orders/${o}/submit", payload: {}, as: DepartmentUser, as_user_id: "${d}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_STATE with HTTP 409 (approval_status == APPROVED is not a from-state for submit)"
            - "NOT ERR_INSUFFICIENT_BUDGET — the fiscal check (available 43500 < quoted 156500) also fails but loses on priority"
            - "Order remains APPROVED; department buckets unchanged (reserved 0, committed 156500)"

      - name: publish_cycle_safety_beats_overlap
        grounds:
          - validations[priority=6]
          - validations[priority=7]
          - state_machines.MenuCycle.DRAFT_to_PUBLISHED
        distinguishing_aspect: |
          Category pair business_safety (p6) vs business_constraint (p7): the
          hall has an ACTIVE unreviewed recipe (allergen gate fails) AND the
          candidate cycle overlaps a PUBLISHED cycle (overlap check fails);
          the response must be ERR_ALLERGEN_UNDECLARED (422), not
          ERR_CYCLE_OVERLAP (409).
        test_recipe:
          setup:
            - "Hall with PUBLISHED cycle C1 [2026-09-01, 2026-10-01) created while no recipes existed (safety gate vacuous)"
            - "Recipe R created afterwards, ACTIVE, allergen_reviewed == false"
            - "Cycle C2 [2026-09-15, 2026-10-15) in DRAFT — overlaps C1"
          setup_api_calls:
            - { call: "POST /dining-halls", payload: { name: "Hall P5b", service_model: "BOARD", dining_capacity: 800, catering_kitchen_capacity: 500 }, as: DiningAdmin, captures: { h: $.data.id } }
            - { call: "POST /menu-cycles", payload: { dining_hall_id: "${h}", name: "C1", cycle_length_weeks: 4, start_date: "2026-09-01", end_date: "2026-10-01" }, as: DiningAdmin, captures: { c1: $.data.id } }
            - { call: "POST /menu-cycles/${c1}/publish", payload: {}, as: DiningAdmin }
            - { call: "POST /recipes", payload: { dining_hall_id: "${h}", name: "Mystery Loaf", station: "BAKERY", allergen_tags: ["WHEAT"], dietary_flags: [], popularity_share: 0.3, unit_cost_cents: 200 }, as: KitchenLead, captures: { r: $.data.id } }
            - { call: "POST /menu-cycles", payload: { dining_hall_id: "${h}", name: "C2", cycle_length_weeks: 4, start_date: "2026-09-15", end_date: "2026-10-15" }, as: DiningAdmin, captures: { c2: $.data.id } }
          trigger:
            - { call: "POST /menu-cycles/${c2}/publish", payload: {}, as: DiningAdmin, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_ALLERGEN_UNDECLARED with HTTP 422 (safety p6 wins over constraint p7)"
            - "NOT ERR_CYCLE_OVERLAP — the half-open overlap with C1 also holds but loses on priority"
            - "C2 remains DRAFT"

      - name: wrong_role_beats_not_found
        grounds:
          - validations[priority=2]
          - validations[priority=3]
        distinguishing_aspect: |
          Category pair auth/authorization (p2) vs existence (p3): publishing a
          nonexistent cycle as HallManager must return ERR_FORBIDDEN (403), not
          ERR_NOT_FOUND (404) — the server never reveals existence to a role
          that may not act.
        test_recipe:
          setup:
            - "Empty database; the cycle id in the path does not exist"
          setup_api_calls: []
          trigger:
            - { call: "POST /menu-cycles/00000000-0000-0000-0000-000000000000/publish", payload: {}, as: HallManager, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_FORBIDDEN with HTTP 403"
            - "NOT ERR_NOT_FOUND — authorization (p2) precedes existence (p3)"

  # ===========================================================================
  # Rule 6 — boundary_precision_check: aggregate covers (<=), cumulative OT
  # minutes (>2400), inspection score (>=70) — three metrics, three endpoints
  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: catering_capacity_exact_fit_then_overflow
        grounds:
          - state_machines.CateringOrder
          - calculations.department_budget_ledger
          - errors[ERR_CATERING_CAPACITY_EXCEEDED]
        distinguishing_aspect: |
          Metric: aggregate guaranteed_covers on the (hall, event_date, slot)
          pool; endpoint: approve. 300 + 200 == capacity 500 exactly is ALLOWED
          (<= semantics); adding a 1-cover order afterwards (501 > 500) is
          rejected. Boundary sits exactly at equality.
        test_recipe:
          setup:
            - "Hall catering_kitchen_capacity == 500; recipe R; department budget 10000000"
            - "Orders A (covers 300) and B (covers 200) APPROVED for 2026-09-05 LUNCH — pool exactly full; order C (covers 1) SUBMITTED for the same slot"
          setup_api_calls:
            - { call: "POST /dining-halls", payload: { name: "Hall Cap", service_model: "RETAIL", dining_capacity: 800, catering_kitchen_capacity: 500 }, as: DiningAdmin, captures: { h: $.data.id } }
            - { call: "POST /recipes", payload: { dining_hall_id: "${h}", name: "R", station: "GRILL", allergen_tags: [], dietary_flags: [], popularity_share: 0.5, unit_cost_cents: 800, allergen_reviewed: true }, as: KitchenLead, captures: { r: $.data.id } }
            - { call: "POST /departments", payload: { name: "Bio", department_code: "BIO", semester_budget_cents: 10000000 }, as: DiningAdmin, captures: { d: $.data.id } }
            - { call: "POST /catering-orders", payload: { dining_hall_id: "${h}", department_id: "${d}", event_date: "2026-09-05", time_slot: "LUNCH", guaranteed_covers: 300, menu_lines: [ { recipe_id: "${r}", portions: 250 } ], dietary_plates: 0 }, as: DepartmentUser, as_user_id: "${d}", captures: { oa: $.data.id } }
            - { call: "POST /catering-orders/${oa}/submit", payload: {}, as: DepartmentUser, as_user_id: "${d}" }
            - { call: "GET /departments/${d}", payload: {}, as: DiningAdmin, captures: { dv1: $.data.version } }
            - { call: "POST /catering-orders/${oa}/approve", payload: { expected_department_version: "${dv1}" }, as: HallManager }
            - { call: "POST /catering-orders", payload: { dining_hall_id: "${h}", department_id: "${d}", event_date: "2026-09-05", time_slot: "LUNCH", guaranteed_covers: 200, menu_lines: [ { recipe_id: "${r}", portions: 200 } ], dietary_plates: 0 }, as: DepartmentUser, as_user_id: "${d}", captures: { ob: $.data.id } }
            - { call: "POST /catering-orders/${ob}/submit", payload: {}, as: DepartmentUser, as_user_id: "${d}" }
            - { call: "GET /departments/${d}", payload: {}, as: DiningAdmin, captures: { dv2: $.data.version } }
            - { call: "POST /catering-orders/${ob}/approve", payload: { expected_department_version: "${dv2}" }, as: HallManager, captures: { ob_status: $.data.approval_status } }
            - { call: "POST /catering-orders", payload: { dining_hall_id: "${h}", department_id: "${d}", event_date: "2026-09-05", time_slot: "LUNCH", guaranteed_covers: 1, menu_lines: [ { recipe_id: "${r}", portions: 1 } ], dietary_plates: 0 }, as: DepartmentUser, as_user_id: "${d}", captures: { oc: $.data.id } }
            - { call: "POST /catering-orders/${oc}/submit", payload: {}, as: DepartmentUser, as_user_id: "${d}" }
            - { call: "GET /departments/${d}", payload: {}, as: DiningAdmin, captures: { dv3: $.data.version } }
          trigger:
            - { call: "POST /catering-orders/${oc}/approve", payload: { expected_department_version: "${dv3}" }, as: HallManager, captures: { err: $.data.error_id } }
          assert:
            - "Order B approval succeeded with pool at exactly 500/500 (equality allowed)"
            - "Order C approve returns error_id == ERR_CATERING_CAPACITY_EXCEEDED with HTTP 409 (300+200+1 = 501 > 500)"
            - "Order C remains SUBMITTED; its budget reservation is NOT released by the failed approval"

      - name: overtime_threshold_exactly_2400_minutes
        grounds:
          - calculations.weekly_overtime_allocation
          - entities.LaborShift.fields.regular_minutes
        distinguishing_aspect: |
          Metric: cumulative weekly worked minutes; endpoint: complete. The
          Thursday shift landing the accumulator at EXACTLY 2400 contributes 0
          overtime (minutes 'beyond' 2400 only); the Friday shift starts at an
          accumulator of 2400 so all 120 of its minutes are OT.
        test_recipe:
          setup:
            - "Hall ACTIVE; staff_ref S1 with Mon-Thu 2026-08-03..06 shifts 480-1080 (600 min each, rate 2000) COMPLETED; Friday 2026-08-07 shift 480-600 (120 min) CONFIRMED"
          setup_api_calls:
            - { call: "POST /dining-halls", payload: { name: "Hall OTB", service_model: "BOARD", dining_capacity: 800, catering_kitchen_capacity: 500 }, as: DiningAdmin, captures: { h: $.data.id } }
            - { call: "POST /labor-shifts", payload: { dining_hall_id: "${h}", staff_ref: "S1", role: "SERVER", shift_date: "2026-08-03", start_minute: 480, end_minute: 1080, hourly_rate_cents: 2000 }, as: HallManager, captures: { s1: $.data.id } }
            - { call: "POST /labor-shifts/${s1}/confirm", payload: {}, as: HallManager }
            - { call: "POST /labor-shifts/${s1}/complete", payload: { worked_minutes: 600 }, as: HallManager }
            - { call: "POST /labor-shifts", payload: { dining_hall_id: "${h}", staff_ref: "S1", role: "SERVER", shift_date: "2026-08-04", start_minute: 480, end_minute: 1080, hourly_rate_cents: 2000 }, as: HallManager, captures: { s2: $.data.id } }
            - { call: "POST /labor-shifts/${s2}/confirm", payload: {}, as: HallManager }
            - { call: "POST /labor-shifts/${s2}/complete", payload: { worked_minutes: 600 }, as: HallManager }
            - { call: "POST /labor-shifts", payload: { dining_hall_id: "${h}", staff_ref: "S1", role: "SERVER", shift_date: "2026-08-05", start_minute: 480, end_minute: 1080, hourly_rate_cents: 2000 }, as: HallManager, captures: { s3: $.data.id } }
            - { call: "POST /labor-shifts/${s3}/confirm", payload: {}, as: HallManager }
            - { call: "POST /labor-shifts/${s3}/complete", payload: { worked_minutes: 600 }, as: HallManager }
            - { call: "POST /labor-shifts", payload: { dining_hall_id: "${h}", staff_ref: "S1", role: "SERVER", shift_date: "2026-08-06", start_minute: 480, end_minute: 1080, hourly_rate_cents: 2000 }, as: HallManager, captures: { s4: $.data.id } }
            - { call: "POST /labor-shifts/${s4}/confirm", payload: {}, as: HallManager }
            - { call: "POST /labor-shifts/${s4}/complete", payload: { worked_minutes: 600 }, as: HallManager, captures: { s4_ot: $.data.overtime_minutes } }
            - { call: "POST /labor-shifts", payload: { dining_hall_id: "${h}", staff_ref: "S1", role: "SERVER", shift_date: "2026-08-07", start_minute: 480, end_minute: 600, hourly_rate_cents: 2000 }, as: HallManager, captures: { s5: $.data.id } }
            - { call: "POST /labor-shifts/${s5}/confirm", payload: {}, as: HallManager }
          trigger:
            - { call: "POST /labor-shifts/${s5}/complete", payload: { worked_minutes: 120 }, as: HallManager, captures: { s5_reg: $.data.regular_minutes, s5_ot: $.data.overtime_minutes, s5_otp: $.data.overtime_pay_cents } }
          assert:
            - "Thursday shift (${s4}) overtime_minutes == 0 — accumulator ends at exactly 2400, the boundary minute is not OT"
            - "Friday shift regular_minutes == 0 and overtime_minutes == 120 (accumulator already at 2400)"
            - "Friday overtime_pay_cents == 6000 (round_half_up(120*2000*1.5/60)) and regular_pay_cents == 0"

      - name: inspection_score_exactly_70_passes
        grounds:
          - calculations.inspection_scoring
          - entities.InspectionReport.fields.outcome
        distinguishing_aspect: |
          Metric: inspection score; endpoint: submit. Score exactly 70 (three
          MAJOR violations) is PASS because the band is >= 70; adding one MINOR
          drops to 67 which is CONDITIONAL — one demerit flips the outcome band.
        test_recipe:
          setup:
            - "Hall ACTIVE; two DRAFT inspection reports: IR1 with 3 MAJOR violations (2026-08-05), IR2 with 3 MAJOR + 1 MINOR (2026-08-06)"
          setup_api_calls:
            - { call: "POST /dining-halls", payload: { name: "Hall IN", service_model: "BOARD", dining_capacity: 800, catering_kitchen_capacity: 500 }, as: DiningAdmin, captures: { h: $.data.id } }
            - { call: "POST /inspection-reports", payload: { dining_hall_id: "${h}", inspection_date: "2026-08-05", violations: [ { code: "M1", severity: "MAJOR" }, { code: "M2", severity: "MAJOR" }, { code: "M3", severity: "MAJOR" } ] }, as: HealthInspector, as_user_id: "insp-1", captures: { ir1: $.data.id } }
            - { call: "POST /inspection-reports", payload: { dining_hall_id: "${h}", inspection_date: "2026-08-06", violations: [ { code: "M1", severity: "MAJOR" }, { code: "M2", severity: "MAJOR" }, { code: "M3", severity: "MAJOR" }, { code: "m1", severity: "MINOR" } ] }, as: HealthInspector, as_user_id: "insp-1", captures: { ir2: $.data.id } }
          trigger:
            - { call: "POST /inspection-reports/${ir1}/submit", payload: {}, as: HealthInspector, as_user_id: "insp-1", captures: { s1: $.data.score, o1: $.data.outcome } }
            - { call: "POST /inspection-reports/${ir2}/submit", payload: {}, as: HealthInspector, as_user_id: "insp-1", captures: { s2: $.data.score, o2: $.data.outcome } }
          assert:
            - "IR1: score == 70 and outcome == PASS (70 >= 70; no CRITICAL)"
            - "IR2: score == 67 and outcome == CONDITIONAL (40..69 band)"
            - "DiningHall remains ACTIVE after both submits (no FAIL occurred)"
            - "GET /corrective-actions?inspection_report_id=${ir1} total_count == 3 with due_date 2026-08-19; IR2 yields 4 rows due 2026-08-20 (3x +14d) and 2026-09-05 (1x +30d)"

  # ===========================================================================
  # Rule 7 — cross_entity_state_dependency: three different entity pairs
  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: open_service_requires_hall_active
        grounds:
          - state_machines.MealPeriodService.FORECAST_LOCKED_to_IN_SERVICE
          - entities.MealPeriodService.fields.dining_hall_id
          - errors[ERR_HALL_SUSPENDED]
        distinguishing_aspect: |
          Pair (MealPeriodService -> DiningHall): open-service is legal on the
          period's own state (FORECAST_LOCKED) but the parent hall is SUSPENDED;
          the hall gate fires with ERR_HALL_SUSPENDED and the period is left
          FORECAST_LOCKED (hall suspension does not cancel non-SCHEDULED periods).
        test_recipe:
          setup:
            - "Hall with recipe + published cycle; period 2026-08-13 LUNCH in FORECAST_LOCKED; hall then suspended by DiningAdmin"
          setup_api_calls:
            - { call: "POST /dining-halls", payload: { name: "Hall XE1", service_model: "BOARD", dining_capacity: 800, catering_kitchen_capacity: 500 }, as: DiningAdmin, captures: { h: $.data.id } }
            - { call: "POST /recipes", payload: { dining_hall_id: "${h}", name: "R", station: "GRILL", allergen_tags: [], dietary_flags: [], popularity_share: 0.5, unit_cost_cents: 500, allergen_reviewed: true }, as: KitchenLead, captures: { r: $.data.id } }
            - { call: "POST /menu-cycles", payload: { dining_hall_id: "${h}", name: "Cyc", cycle_length_weeks: 4, start_date: "2026-07-01", end_date: "2026-10-01" }, as: DiningAdmin, captures: { cyc: $.data.id } }
            - { call: "POST /menu-cycles/${cyc}/publish", payload: {}, as: DiningAdmin }
            - { call: "POST /meal-periods", payload: { dining_hall_id: "${h}", menu_cycle_id: "${cyc}", service_date: "2026-08-13", meal_period: "LUNCH" }, as: HallManager, captures: { p: $.data.id, pv: $.data.version } }
            - { call: "POST /meal-periods/${p}/forecasts", payload: { recipe_id: "${r}", variant: "BASE", expected_meal_period_version: "${pv}" }, as: KitchenLead, captures: { f: $.data.id } }
            - { call: "POST /production-forecasts/${f}/lock", payload: {}, as: KitchenLead }
            - { call: "POST /meal-periods/${p}/lock-forecast", payload: {}, as: HallManager }
            - { call: "POST /dining-halls/${h}/suspend", payload: {}, as: DiningAdmin }
          trigger:
            - { call: "POST /meal-periods/${p}/open-service", payload: {}, as: HallManager, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_HALL_SUSPENDED with HTTP 409"
            - "MealPeriodService ${p}.status remains FORECAST_LOCKED (not CANCELLED: the cascade only cancels SCHEDULED periods)"

      - name: finalize_requires_contract_active
        grounds:
          - state_machines.CommissionStatement.PROVISIONAL_to_FINALIZED
          - entities.CommissionStatement.fields.vendor_contract_id
          - errors[ERR_CONTRACT_NOT_ACTIVE]
        distinguishing_aspect: |
          Pair (CommissionStatement -> VendorContract): finalize on a
          PROVISIONAL statement whose contract was just TERMINATED fails with
          ERR_CONTRACT_NOT_ACTIVE even though the statement's own state allows
          the transition.
        test_recipe:
          setup:
            - "Hall with contract ACTIVATED then a PROVISIONAL statement for 2026-08; contract then TERMINATED"
          setup_api_calls:
            - { call: "POST /dining-halls", payload: { name: "Hall XE2", service_model: "RETAIL", dining_capacity: 800, catering_kitchen_capacity: 500 }, as: DiningAdmin, captures: { h: $.data.id } }
            - { call: "POST /vendor-contracts", payload: { dining_hall_id: "${h}", vendor_name: "V", board_rate_per_cover_cents: 500, retail_commission_bps: 1000, catering_commission_bps: 800, minimum_monthly_guarantee_cents: 0, effective_start_date: "2026-08-01", effective_end_date: "2026-12-01" }, as: DiningAdmin, captures: { vc: $.data.id } }
            - { call: "POST /vendor-contracts/${vc}/activate", payload: {}, as: ContractManager }
            - { call: "POST /vendor-contracts/${vc}/commission-statements", payload: { period_month: "2026-08" }, as: DiningAdmin, captures: { st: $.data.id } }
            - { call: "POST /vendor-contracts/${vc}/terminate", payload: {}, as: ContractManager }
          trigger:
            - { call: "POST /commission-statements/${st}/finalize", payload: {}, as: ContractManager, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_CONTRACT_NOT_ACTIVE with HTTP 409"
            - "CommissionStatement remains PROVISIONAL; finalized_at is null"

      - name: catering_approve_blocked_by_open_critical
        grounds:
          - state_machines.CateringOrder
          - entities.CorrectiveAction.fields.severity
          - errors[ERR_CRITICAL_VIOLATION_OPEN]
        distinguishing_aspect: |
          Pair (CateringOrder -> CorrectiveAction): the order is SUBMITTED and
          the department has funds, but an OPEN CRITICAL corrective action
          exists at the hall (from a FAIL inspection that also suspended the
          hall); approve fails with ERR_CRITICAL_VIOLATION_OPEN.
        test_recipe:
          setup:
            - "Hall (kitchen 10000), recipe, department budget 1000000; order quoted 100000 SUBMITTED while hall ACTIVE"
            - "FAIL inspection (1 CRITICAL, 2026-08-05) then submitted: hall SUSPENDED, corrective action OPEN"
          setup_api_calls:
            - { call: "POST /dining-halls", payload: { name: "Hall XE3", service_model: "HYBRID", dining_capacity: 800, catering_kitchen_capacity: 10000 }, as: DiningAdmin, captures: { h: $.data.id } }
            - { call: "POST /recipes", payload: { dining_hall_id: "${h}", name: "R", station: "GRILL", allergen_tags: [], dietary_flags: [], popularity_share: 0.5, unit_cost_cents: 800, allergen_reviewed: true }, as: KitchenLead, captures: { r: $.data.id } }
            - { call: "POST /departments", payload: { name: "Chem", department_code: "CHEM", semester_budget_cents: 1000000 }, as: DiningAdmin, captures: { d: $.data.id } }
            - { call: "POST /catering-orders", payload: { dining_hall_id: "${h}", department_id: "${d}", event_date: "2026-09-03", time_slot: "DINNER", guaranteed_covers: 100, menu_lines: [ { recipe_id: "${r}", portions: 90 } ], dietary_plates: 0 }, as: DepartmentUser, as_user_id: "${d}", captures: { o: $.data.id } }
            - { call: "POST /catering-orders/${o}/submit", payload: {}, as: DepartmentUser, as_user_id: "${d}" }
            - { call: "POST /inspection-reports", payload: { dining_hall_id: "${h}", inspection_date: "2026-08-05", violations: [ { code: "SAN-01", severity: "CRITICAL" } ] }, as: HealthInspector, as_user_id: "insp-1", captures: { ir: $.data.id } }
            - { call: "POST /inspection-reports/${ir}/submit", payload: {}, as: HealthInspector, as_user_id: "insp-1" }
            - { call: "GET /departments/${d}", payload: {}, as: DiningAdmin, captures: { dv: $.data.version } }
          trigger:
            - { call: "POST /catering-orders/${o}/approve", payload: { expected_department_version: "${dv}" }, as: HallManager, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_CRITICAL_VIOLATION_OPEN with HTTP 422"
            - "Order remains SUBMITTED; department reserved_cents still 100000 (no bucket movement on failure)"

  # ===========================================================================
  # Rule 8 — resource_temporal_overlap: three different interval semantics on
  # three different resources
  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: menu_cycle_half_open_adjacency
        grounds:
          - state_machines.MenuCycle.DRAFT_to_PUBLISHED
          - errors[ERR_CYCLE_OVERLAP]
        distinguishing_aspect: |
          Resource: the hall's cycle calendar; semantics: half-open
          [start_date, end_date) — C2 ending exactly where C1 starts publishes
          cleanly, while C3 straddling the boundary by one day inside is
          rejected with ERR_CYCLE_OVERLAP.
        test_recipe:
          setup:
            - "Hall with NO recipes (safety gate vacuous); C1 PUBLISHED [2026-09-01, 2026-10-01)"
          setup_api_calls:
            - { call: "POST /dining-halls", payload: { name: "Hall OV1", service_model: "BOARD", dining_capacity: 800, catering_kitchen_capacity: 500 }, as: DiningAdmin, captures: { h: $.data.id } }
            - { call: "POST /menu-cycles", payload: { dining_hall_id: "${h}", name: "C1", cycle_length_weeks: 4, start_date: "2026-09-01", end_date: "2026-10-01" }, as: DiningAdmin, captures: { c1: $.data.id } }
            - { call: "POST /menu-cycles/${c1}/publish", payload: {}, as: DiningAdmin }
            - { call: "POST /menu-cycles", payload: { dining_hall_id: "${h}", name: "C2", cycle_length_weeks: 4, start_date: "2026-08-01", end_date: "2026-09-01" }, as: DiningAdmin, captures: { c2: $.data.id } }
            - { call: "POST /menu-cycles", payload: { dining_hall_id: "${h}", name: "C3", cycle_length_weeks: 4, start_date: "2026-08-15", end_date: "2026-09-15" }, as: DiningAdmin, captures: { c3: $.data.id } }
          trigger:
            - { call: "POST /menu-cycles/${c2}/publish", payload: {}, as: DiningAdmin, captures: { c2s: $.data.status } }
            - { call: "POST /menu-cycles/${c3}/publish", payload: {}, as: DiningAdmin, captures: { err: $.data.error_id } }
          assert:
            - "C2 publish succeeds (status PUBLISHED): [2026-08-01, 2026-09-01) merely touches [2026-09-01, 2026-10-01) — adjacency is not overlap"
            - "C3 publish returns error_id == ERR_CYCLE_OVERLAP with HTTP 409: [2026-08-15, 2026-09-15) intersects C1"
            - "C3 remains DRAFT"

      - name: labor_shift_rest_buffer_boundary
        grounds:
          - state_machines.LaborShift.PLANNED_to_ASSIGNED
          - errors[ERR_REST_PERIOD_VIOLATION]
          - errors[ERR_SHIFT_OVERLAP]
        distinguishing_aspect: |
          Resource: staff_ref's personal timeline; semantics: half-open overlap
          PLUS a 480-minute rest buffer — an adjacent [900,1200) shift does not
          overlap [600,900) yet is still rejected for insufficient rest, and a
          480-minute gap is allowed while 479 is not. Distinct from the cycle
          calendar's pure half-open rule.
        test_recipe:
          setup:
            - "Hall ACTIVE; staff S9 has shift1 2026-08-10 [780,1320] ASSIGNED"
          setup_api_calls:
            - { call: "POST /dining-halls", payload: { name: "Hall OV2", service_model: "BOARD", dining_capacity: 800, catering_kitchen_capacity: 500 }, as: DiningAdmin, captures: { h: $.data.id } }
            - { call: "POST /labor-shifts", payload: { dining_hall_id: "${h}", staff_ref: "S9", role: "COOK", shift_date: "2026-08-10", start_minute: 780, end_minute: 1320, hourly_rate_cents: 1800 }, as: HallManager, captures: { s1: $.data.id } }
          trigger:
            - { call: "POST /labor-shifts", payload: { dining_hall_id: "${h}", staff_ref: "S9", role: "COOK", shift_date: "2026-08-11", start_minute: 300, end_minute: 600, hourly_rate_cents: 1800 }, as: HallManager, captures: { err1: $.data.error_id } }
            - { call: "POST /labor-shifts", payload: { dining_hall_id: "${h}", staff_ref: "S9", role: "COOK", shift_date: "2026-08-11", start_minute: 360, end_minute: 600, hourly_rate_cents: 1800 }, as: HallManager, captures: { s3: $.data.id, s3s: $.data.status } }
            - { call: "POST /labor-shifts", payload: { dining_hall_id: "${h}", staff_ref: "S9", role: "COOK", shift_date: "2026-08-10", start_minute: 800, end_minute: 1000, hourly_rate_cents: 1800 }, as: HallManager, captures: { err2: $.data.error_id } }
          assert:
            - "First trigger: error_id == ERR_REST_PERIOD_VIOLATION with HTTP 422 (gap = (1440-1320)+300 = 420 < 480)"
            - "Second trigger succeeds with status ASSIGNED (gap = 480 exactly; boundary inclusive)"
            - "Third trigger: error_id == ERR_SHIFT_OVERLAP with HTTP 409 — [800,1000) intersects [780,1320); overlap (constraint p7) beats rest (temporal p8) when both fail"

      - name: catering_slot_aggregate_capacity_semantics
        grounds:
          - state_machines.CateringOrder
          - entities.DiningHall.fields.catering_kitchen_capacity
        distinguishing_aspect: |
          Resource: the (hall, event_date, time_slot) capacity pool; semantics:
          aggregate summation with <= admission rather than binary interval
          exclusion — a 500-cover LUNCH approval does not block a 500-cover
          DINNER approval on the same date, while one extra cover into the full
          LUNCH pool is rejected.
        test_recipe:
          setup:
            - "Hall catering_kitchen_capacity == 500; recipe R; department budget 10000000"
            - "L1 (covers 500, 2026-09-10 LUNCH) APPROVED; D1 (covers 500, 2026-09-10 DINNER) SUBMITTED; L2 (covers 1, 2026-09-10 LUNCH) SUBMITTED"
          setup_api_calls:
            - { call: "POST /dining-halls", payload: { name: "Hall OV3", service_model: "RETAIL", dining_capacity: 800, catering_kitchen_capacity: 500 }, as: DiningAdmin, captures: { h: $.data.id } }
            - { call: "POST /recipes", payload: { dining_hall_id: "${h}", name: "R", station: "GRILL", allergen_tags: [], dietary_flags: [], popularity_share: 0.5, unit_cost_cents: 800, allergen_reviewed: true }, as: KitchenLead, captures: { r: $.data.id } }
            - { call: "POST /departments", payload: { name: "Arts", department_code: "ART", semester_budget_cents: 10000000 }, as: DiningAdmin, captures: { d: $.data.id } }
            - { call: "POST /catering-orders", payload: { dining_hall_id: "${h}", department_id: "${d}", event_date: "2026-09-10", time_slot: "LUNCH", guaranteed_covers: 500, menu_lines: [ { recipe_id: "${r}", portions: 400 } ], dietary_plates: 0 }, as: DepartmentUser, as_user_id: "${d}", captures: { l1: $.data.id } }
            - { call: "POST /catering-orders/${l1}/submit", payload: {}, as: DepartmentUser, as_user_id: "${d}" }
            - { call: "GET /departments/${d}", payload: {}, as: DiningAdmin, captures: { dv1: $.data.version } }
            - { call: "POST /catering-orders/${l1}/approve", payload: { expected_department_version: "${dv1}" }, as: HallManager }
            - { call: "POST /catering-orders", payload: { dining_hall_id: "${h}", department_id: "${d}", event_date: "2026-09-10", time_slot: "DINNER", guaranteed_covers: 500, menu_lines: [ { recipe_id: "${r}", portions: 400 } ], dietary_plates: 0 }, as: DepartmentUser, as_user_id: "${d}", captures: { d1: $.data.id } }
            - { call: "POST /catering-orders/${d1}/submit", payload: {}, as: DepartmentUser, as_user_id: "${d}" }
            - { call: "POST /catering-orders", payload: { dining_hall_id: "${h}", department_id: "${d}", event_date: "2026-09-10", time_slot: "LUNCH", guaranteed_covers: 1, menu_lines: [ { recipe_id: "${r}", portions: 1 } ], dietary_plates: 0 }, as: DepartmentUser, as_user_id: "${d}", captures: { l2: $.data.id } }
            - { call: "POST /catering-orders/${l2}/submit", payload: {}, as: DepartmentUser, as_user_id: "${d}" }
            - { call: "GET /departments/${d}", payload: {}, as: DiningAdmin, captures: { dv2: $.data.version } }
          trigger:
            - { call: "POST /catering-orders/${d1}/approve", payload: { expected_department_version: "${dv2}" }, as: HallManager, captures: { d1s: $.data.approval_status } }
            - { call: "GET /departments/${d}", payload: {}, as: DiningAdmin, captures: { dv3: $.data.version } }
            - { call: "POST /catering-orders/${l2}/approve", payload: { expected_department_version: "${dv3}" }, as: HallManager, captures: { err: $.data.error_id } }
          assert:
            - "D1 approve succeeds (APPROVED): the DINNER slot pool is independent of the full LUNCH pool"
            - "L2 approve returns error_id == ERR_CATERING_CAPACITY_EXCEEDED with HTTP 409 (500 + 1 > 500)"
            - "L2 remains SUBMITTED"

  # ===========================================================================
  # Rule 9 — compensating_invariant: cents (budget), cardinality (LOCKED
  # forecasts), kilograms (posted waste) — three conserved quantities
  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: department_budget_conservation
        grounds:
          - calculations.department_budget_ledger
          - entities.Department.fields.available_cents
          - state_machines.CateringOrder
        distinguishing_aspect: |
          Conserved quantity: cents. INV-1 — available + reserved + committed +
          spent == semester_budget_cents after every step of submit -> reject
          -> resubmit -> approve -> cancel-with-fee; the reject fully unwinds
          the reservation and the cancellation fee (18800) is the only net
          spend.
        test_recipe:
          setup:
            - "Hall (kitchen 10000), recipe R (unit 800), department budget 1000000"
            - "Order quoted 188000 (covers 200, R x 150, dietary 10), event 2026-09-01 DINNER (>= 72h from default clock, so 10% fee tier)"
          setup_api_calls:
            - { call: "POST /dining-halls", payload: { name: "Hall INV1", service_model: "RETAIL", dining_capacity: 800, catering_kitchen_capacity: 10000 }, as: DiningAdmin, captures: { h: $.data.id } }
            - { call: "POST /recipes", payload: { dining_hall_id: "${h}", name: "R", station: "GRILL", allergen_tags: [], dietary_flags: [], popularity_share: 0.5, unit_cost_cents: 800, allergen_reviewed: true }, as: KitchenLead, captures: { r: $.data.id } }
            - { call: "POST /departments", payload: { name: "Philosophy", department_code: "PHIL", semester_budget_cents: 1000000 }, as: DiningAdmin, captures: { d: $.data.id } }
            - { call: "POST /catering-orders", payload: { dining_hall_id: "${h}", department_id: "${d}", event_date: "2026-09-01", time_slot: "DINNER", guaranteed_covers: 200, menu_lines: [ { recipe_id: "${r}", portions: 150 } ], dietary_plates: 10 }, as: DepartmentUser, as_user_id: "${d}", captures: { o: $.data.id, oq: $.data.quoted_total_cents } }
          trigger:
            - { call: "POST /catering-orders/${o}/submit", payload: {}, as: DepartmentUser, as_user_id: "${d}" }
            - { call: "POST /catering-orders/${o}/reject", payload: {}, as: HallManager }
            - { call: "GET /departments/${d}", payload: {}, as: DiningAdmin, captures: { av_after_reject: $.data.available_cents } }
            - { call: "POST /catering-orders/${o}/submit", payload: {}, as: DepartmentUser, as_user_id: "${d}" }
            - { call: "GET /departments/${d}", payload: {}, as: DiningAdmin, captures: { dv: $.data.version } }
            - { call: "POST /catering-orders/${o}/approve", payload: { expected_department_version: "${dv}" }, as: HallManager }
            - { call: "POST /catering-orders/${o}/cancel", payload: {}, as: HallManager, captures: { fee: $.data.cancellation_fee_cents } }
            - { call: "GET /departments/${d}", payload: {}, as: DiningAdmin, captures: { av_end: $.data.available_cents, sp_end: $.data.spent_cents } }
          assert:
            - "quoted_total_cents == 188000"
            - "After reject: reserved_cents == 0 and available_cents == 1000000 — submit+reject is a perfect compensating pair"
            - "After approve: committed_cents == 188000, reserved_cents == 0, available_cents == 812000"
            - "Cancel fee == 18800 (round_half_up(188000 * 1000/10000); event is >= 72h out so 10% tier)"
            - "Final: spent_cents == 18800, committed_cents == 0, available_cents == 981200; 981200 + 0 + 0 + 18800 == 1000000 == semester_budget_cents"

      - name: forecast_locked_cardinality_conservation
        grounds:
          - state_machines.ProductionForecast.LOCKED_to_SUPERSEDED
          - concurrency_rules[forecast-create-stale-period]
          - entities.ProductionForecast.fields.status
        distinguishing_aspect: |
          Conserved quantity: cardinality. INV-2 — the count of LOCKED forecasts
          per (meal_period_id, recipe_id) never exceeds 1: creating a successor
          supersedes the incumbent (1 -> 0 while the successor is DRAFT) and
          locking the successor restores exactly 1.
        test_recipe:
          setup:
            - "Hall, recipe R, published cycle, period 2026-08-17 LUNCH in SCHEDULED"
          setup_api_calls:
            - { call: "POST /dining-halls", payload: { name: "Hall INV2", service_model: "BOARD", dining_capacity: 1000, catering_kitchen_capacity: 500 }, as: DiningAdmin, captures: { h: $.data.id } }
            - { call: "POST /recipes", payload: { dining_hall_id: "${h}", name: "R", station: "GRILL", allergen_tags: [], dietary_flags: [], popularity_share: 0.5, unit_cost_cents: 800, allergen_reviewed: true }, as: KitchenLead, captures: { r: $.data.id } }
            - { call: "POST /menu-cycles", payload: { dining_hall_id: "${h}", name: "Cyc", cycle_length_weeks: 4, start_date: "2026-07-01", end_date: "2026-10-01" }, as: DiningAdmin, captures: { cyc: $.data.id } }
            - { call: "POST /menu-cycles/${cyc}/publish", payload: {}, as: DiningAdmin }
            - { call: "POST /meal-periods", payload: { dining_hall_id: "${h}", menu_cycle_id: "${cyc}", service_date: "2026-08-17", meal_period: "LUNCH" }, as: HallManager, captures: { p: $.data.id, pv1: $.data.version } }
            - { call: "POST /meal-periods/${p}/forecasts", payload: { recipe_id: "${r}", variant: "BASE", expected_meal_period_version: "${pv1}" }, as: KitchenLead, captures: { f1: $.data.id } }
            - { call: "POST /production-forecasts/${f1}/lock", payload: {}, as: KitchenLead }
          trigger:
            - { call: "GET /meal-periods/${p}", payload: {}, as: KitchenLead, captures: { pv2: $.data.version } }
            - { call: "POST /meal-periods/${p}/forecasts", payload: { recipe_id: "${r}", variant: "BASE", expected_meal_period_version: "${pv2}" }, as: KitchenLead, captures: { f2: $.data.id, f2s: $.data.status } }
            - { call: "GET /production-forecasts/${f1}", payload: {}, as: KitchenLead, captures: { f1s: $.data.status } }
            - { call: "POST /production-forecasts/${f2}/lock", payload: {}, as: KitchenLead }
            - { call: "GET /production-forecasts", payload: { meal_period_id: "${p}", recipe_id: "${r}" }, as: KitchenLead }
          assert:
            - "After F2 creation: F1.status == SUPERSEDED and F2.status == DRAFT — LOCKED count for the pair is 0 (never 2)"
            - "After F2 lock: the pair holds exactly one LOCKED forecast (F2) and one SUPERSEDED (F1)"
            - "GET /production-forecasts?meal_period_id=${p}&recipe_id=${r} returns exactly 2 rows total (history is retained, not deleted)"

      - name: waste_posted_mass_conservation
        grounds:
          - state_machines.WasteLog.VERIFIED_to_RECORDED
          - calculations.sustainability_metrics
          - entities.MealPeriodService.fields.posted_waste_kg
        distinguishing_aspect: |
          Conserved quantity: kilograms. Across the verify/reject cycle the
          POSTED set is untouched, so the period's posted_waste_kg stays at 0
          until the single post, after which it is exactly 10.0 — no drift from
          the intermediate verifications.
        test_recipe:
          setup:
            - "Period 2026-08-18 LUNCH in RECONCILED (10 board swipes); waste log 10.0 kg COMPOST recorded"
          setup_api_calls:
            - { call: "POST /dining-halls", payload: { name: "Hall INV3", service_model: "BOARD", dining_capacity: 800, catering_kitchen_capacity: 500 }, as: DiningAdmin, captures: { h: $.data.id } }
            - { call: "POST /recipes", payload: { dining_hall_id: "${h}", name: "R", station: "DELI", allergen_tags: [], dietary_flags: [], popularity_share: 0.5, unit_cost_cents: 300, allergen_reviewed: true }, as: KitchenLead, captures: { r: $.data.id } }
            - { call: "POST /menu-cycles", payload: { dining_hall_id: "${h}", name: "Cyc", cycle_length_weeks: 4, start_date: "2026-07-01", end_date: "2026-10-01" }, as: DiningAdmin, captures: { cyc: $.data.id } }
            - { call: "POST /menu-cycles/${cyc}/publish", payload: {}, as: DiningAdmin }
            - { call: "POST /meal-periods", payload: { dining_hall_id: "${h}", menu_cycle_id: "${cyc}", service_date: "2026-08-18", meal_period: "LUNCH" }, as: HallManager, captures: { p: $.data.id, pv: $.data.version } }
            - { call: "POST /meal-periods/${p}/forecasts", payload: { recipe_id: "${r}", variant: "BASE", expected_meal_period_version: "${pv}" }, as: KitchenLead, captures: { f: $.data.id } }
            - { call: "POST /production-forecasts/${f}/lock", payload: {}, as: KitchenLead }
            - { call: "POST /meal-periods/${p}/lock-forecast", payload: {}, as: HallManager }
            - { call: "POST /meal-periods/${p}/open-service", payload: {}, as: HallManager }
            - { call: "POST /meal-periods/${p}/swipes", payload: { events: [ { entry_type: "BOARD_SWIPE", amount_cents: 0, count: 10 } ] }, as: HallManager }
            - { call: "POST /meal-periods/${p}/reconcile", payload: {}, as: HallManager }
            - { call: "POST /meal-periods/${p}/waste-logs", payload: { category: "PRE_CONSUMER", disposition: "COMPOST", weight_kg: 10.0 }, as: KitchenLead, as_user_id: "kl-9", captures: { wl: $.data.id } }
          trigger:
            - { call: "POST /waste-logs/${wl}/verify", payload: {}, as: HallManager, as_user_id: "hm-9" }
            - { call: "POST /waste-logs/${wl}/reject", payload: {}, as: HallManager }
            - { call: "GET /meal-periods/${p}", payload: {}, as: HallManager, captures: { mid_kg: $.data.posted_waste_kg } }
            - { call: "POST /waste-logs/${wl}/verify", payload: {}, as: HallManager, as_user_id: "hm-9" }
            - { call: "POST /waste-logs/${wl}/post", payload: {}, as: HallManager }
            - { call: "GET /meal-periods/${p}", payload: {}, as: HallManager, captures: { end_kg: $.data.posted_waste_kg, end_div: $.data.diversion_rate } }
          assert:
            - "Mid-cycle (after verify -> reject): posted_waste_kg == 0 — intermediate verifications add nothing"
            - "After final post: posted_waste_kg == 10.0 exactly (single counting, no duplication from the cycle)"
            - "diversion_rate == 1.0 (all 10.0 kg COMPOST) and sustainability_alert == false (landfill 0/10 = 0 <= 0.15)"
