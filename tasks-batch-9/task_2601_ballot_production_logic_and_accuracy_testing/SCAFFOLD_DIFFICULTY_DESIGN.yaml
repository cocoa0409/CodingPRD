  - rule_id: non_linear_state_machine
    instances:
      - name: nl_style_proof_reject_reproof_cycle
        grounds:
          - state_machines.BallotStyle
          - entities.BallotStyle.fields.revision
          - entities.BallotStyle.fields.proof_cycle_count
          - entities.BallotStyle.fields.translated_languages
          - validations.style-state-permits-operation
        distinguishing_aspect: |
          The BallotStyle machine is cyclic AND forking, not a linear progression: one endpoint
          (proof-decision) drives two different target states with different side-effect sets, and
          request-proof is legal from two different from-states with DIFFERENT side effects - it bumps
          revision only on the PROOF_REJECTED -> PROOFING edge, never on DRAFT -> PROOFING. The same
          style therefore visits PROOFING three times with revision 1, then 2, then 3, and each
          rejection wipes translated_languages so the loop cannot be re-entered without redoing the
          language work. A linear machine could not re-enter PROOFING at all.
        test_recipe:
          setup:
            - "An election in CONTESTS_CERTIFIED with one certified CANDIDATE contest in D-12."
            - "One ballot style S-100 covering D-12, freshly created in DRAFT with revision 1 and proof_cycle_count 0."
            - "The style's language and format coverage certified, then a first proof requested by user-coord-1 so the style sits in PROOFING with proof_cycle_count 1 and revision still 1."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { now: "2026-08-01T00:00:00Z" }
              as: ElectionsDirector
            - call: "POST /elections"
              payload: { name: "November 2026 General", jurisdiction: "Kestrel County", election_date: "2026-11-03", rotation_policy: "NONE", candidate_order_method: "ALPHABETICAL_BY_BALLOT_NAME", la_notice_hours: 48 }
              as: ElectionsDirector
              captures: { el: $.data.id }
            - call: "POST /elections/${el}/contests"
              payload: { title: "County Sheriff", contest_type: "CANDIDATE", district_code: "D-12", seats_open: 1, rotation_required: false }
              as: BallotCoordinator
              captures: { ct: $.data.id }
            - call: "POST /contests/${ct}/candidates"
              payload: { full_name: "Ana Alvarez", ballot_name: "Alvarez", filing_received_at: "2026-06-01T09:00:00Z", party_code: "IND" }
              as: BallotCoordinator
              captures: { c_alv: $.data.id }
            - call: "POST /contests/${ct}/certify"
              payload: {}
              as: ElectionsDirector
            - call: "POST /elections/${el}/ballot-styles"
              payload: { style_code: "S-100", district_codes: ["D-12"], language_set: ["EN"], required_formats: ["PAPER_STANDARD"] }
              as: BallotCoordinator
              captures: { st: $.data.id }
            - call: "POST /elections/${el}/certify-ballot-order"
              payload: {}
              as: ElectionsDirector
            - call: "POST /ballot-styles/${st}/language-certifications"
              payload: { translated_languages: ["EN"], certified_formats: ["PAPER_STANDARD"] }
              as: LanguageAccessCoordinator
            - call: "POST /ballot-styles/${st}/request-proof"
              payload: {}
              as: BallotCoordinator
              as_user_id: "user-coord-1"
          trigger:
            - call: "POST /ballot-styles/${st}/proof-decision"
              payload: { decision: "REJECT", decision_note: "Spanish glyphs clipped in contest 2" }
              as: ElectionsDirector
              as_user_id: "user-director-1"
            - call: "POST /ballot-styles/${st}/request-proof"
              payload: {}
              as: BallotCoordinator
              as_user_id: "user-coord-1"
            - call: "POST /ballot-styles/${st}/language-certifications"
              payload: { translated_languages: ["EN"], certified_formats: ["PAPER_STANDARD"] }
              as: LanguageAccessCoordinator
            - call: "POST /ballot-styles/${st}/request-proof"
              payload: {}
              as: BallotCoordinator
              as_user_id: "user-coord-1"
            - call: "POST /ballot-styles/${st}/request-proof"
              payload: {}
              as: BallotCoordinator
              as_user_id: "user-coord-1"
            - call: "POST /ballot-styles/${st}/proof-decision"
              payload: { decision: "REJECT", decision_note: "Header rule still 1pt too thin" }
              as: ElectionsDirector
              as_user_id: "user-director-1"
            - call: "POST /ballot-styles/${st}/language-certifications"
              payload: { translated_languages: ["EN"], certified_formats: ["PAPER_STANDARD"] }
              as: LanguageAccessCoordinator
            - call: "POST /ballot-styles/${st}/request-proof"
              payload: {}
              as: BallotCoordinator
              as_user_id: "user-coord-1"
            - call: "POST /ballot-styles/${st}/proof-decision"
              payload: { decision: "APPROVE", decision_note: "Third proof accepted" }
              as: ElectionsDirector
              as_user_id: "user-director-1"
            - call: "POST /ballot-styles/${st}/proof-decision"
              payload: { decision: "REJECT", decision_note: "Too late to change our mind" }
              as: ElectionsDirector
              as_user_id: "user-director-1"
          assert:
            - "Call 1 (REJECT) succeeds: BallotStyle.${st}.status == PROOF_REJECTED, revision == 1, proof_cycle_count == 1, translated_languages == [], certified_formats == [], proof_decided_by_user_id == \"user-director-1\"."
            - "Call 2 (immediate re-request) fails with ERR_LANGUAGE_COVERAGE_INCOMPLETE (409) because the rejection wiped the coverage; the style stays PROOF_REJECTED with revision 1 and proof_cycle_count 1."
            - "Call 4 (re-request after re-certification) succeeds: status == PROOFING, revision == 2 (bumped, because this entry came from PROOF_REJECTED), proof_cycle_count == 2."
            - "Call 5 (request-proof while already PROOFING) fails with ERR_STYLE_STATE_INVALID (409); revision stays 2 and proof_cycle_count stays 2, proving the loop edge is guarded and not merely idempotent."
            - "Call 6 (second REJECT) returns the style to PROOF_REJECTED with revision 2 and proof_cycle_count 2, clearing the coverage arrays again - the same endpoint has now produced PROOF_REJECTED twice and APPROVED zero times."
            - "Call 8 (third request-proof) gives status PROOFING with revision == 3 and proof_cycle_count == 3, so PROOFING has been entered three times with three distinct revisions."
            - "Call 9 (APPROVE) gives status APPROVED with revision == 3 and proof_cycle_count == 3 - the approval branch bumps neither counter and does not clear the coverage arrays, which still read [\"EN\"] and [\"PAPER_STANDARD\"]."
            - "Call 10 (proof-decision on an APPROVED style) fails with ERR_STYLE_STATE_INVALID (409): the cycle is only re-enterable from PROOF_REJECTED, never from APPROVED, so APPROVED is a one-way exit from the loop for this endpoint."
            - "Election.${el}.status is CONTESTS_CERTIFIED throughout; no PrintJob or TestDeck exists, so none of the reject-branch cascade side effects have anything to act on."

      - name: nl_tabulator_parallel_program_and_custody_axes
        grounds:
          - state_machines.TabulatorUnit
          - entities.TabulatorUnit.fields.program_status
          - entities.TabulatorUnit.fields.custody_status
          - validations.tabulator-state-permits-operation
          - calculations.la_test_discrepancy
        distinguishing_aspect: |
          TabulatorUnit runs TWO independent state dimensions at once (program_status and
          custody_status), and each guard reads both: program requires program_status IN
          {UNPROGRAMMED, LA_FAILED} AND custody_status == IN_VAULT, while deploy requires
          program_status == LA_PASSED AND custody_status == IN_VAULT. The unit therefore loops
          PROGRAMMED -> LA_FAILED -> PROGRAMMED -> LA_PASSED on one axis while the other axis has
          not moved at all, and later moves IN_VAULT -> DEPLOYED -> IN_VAULT while the program axis
          is frozen at LA_PASSED. A single-dimension state variable cannot encode this: the pair
          (LA_PASSED, IN_VAULT) occurs both before the deployment and after the seal is broken, yet
          the two axes were reached by different triggers.
        test_recipe:
          setup:
            - "An election in STYLES_LOCKED with locked style S-100, precinct P-001 assigned to it, and lot L-001 received (12500) and issued (3000) to P-001."
            - "A tabulator TAB-001 just created, so program_status == UNPROGRAMMED and custody_status == IN_VAULT."
            - "TAB-001 programmed for S-100 by user-tech-1, and deck DECK-A built for S-100 with ballot_count 2, blank_count 1 and expected_marks [{${ct}, ${c_alv}, 1}]."
