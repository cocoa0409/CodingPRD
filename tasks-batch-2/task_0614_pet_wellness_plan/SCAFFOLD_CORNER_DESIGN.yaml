              as: Member
              as_user_id: "${acct_id}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 412"
            - "error_id == ERR_STALE_MEMBERSHIP_VERSION"

      - name: derived_entitlement_balance_reconciles_after_visit
        claim_type: derived_field_reconciliation
        grounds:
          - calculations.reconcile_term_balance
          - entities.ContractTerm.fields.entitlement_balance_cents
        distinguishing_aspect: "After one covered EXAM visit, ContractTerm.entitlement_balance_cents drops by exactly 6000 (granted 12000 -> balance 6000)."
        test_recipe:
          setup: ["ESSENTIAL-like single-line plan: EXAM 2@6000 only -> granted 12000; one covered EXAM visit"]
          setup_api_calls:
            - call: "POST /wellness/_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: PlanAdmin
            - call: "POST /wellness/plans"
              payload: { tier: "PLUS", name: "Plus", monthly_fee_cents: 4500, annual_value_cents: 60000 }
              as: PlanAdmin
              captures: { plus_id: $.data.id }
            - call: "POST /wellness/plan-services"
              payload: { plan_id: "${plus_id}", service_code: "EXAM", included_quantity: 2, unit_value_cents: 6000 }
              as: PlanAdmin
            - call: "POST /wellness/clinics"
              payload: { name: "CA Clinic", region_code: "CA" }
              as: PlanAdmin
              captures: { clinic_id: $.data.id }
            - call: "POST /wellness/member-accounts"
              payload: { email: "ccc@x.com", full_name: "CCC", home_clinic_id: "${clinic_id}" }
              as: Member
              captures: { acct_id: $.data.id }
            - call: "POST /wellness/memberships"
              payload: { member_account_id: "${acct_id}", plan_id: "${plus_id}", billing_anchor_day: 1 }
              as: Member
              as_user_id: "${acct_id}"
              captures: { mem_id: $.data.id }
            - call: "POST /wellness/memberships/${mem_id}/pets"
              payload: { name: "Rex", species: "DOG", weight_kg: 12 }
              as: Member
              as_user_id: "${acct_id}"
              captures: { pet_id: $.data.id }
            - call: "POST /wellness/memberships/${mem_id}/activate"
              payload: {}
              as: Member
              as_user_id: "${acct_id}"
              captures: { term1_id: $.data.id }
          trigger:
            - call: "POST /wellness/memberships/${mem_id}/visits"
              payload: { enrolled_pet_id: "${pet_id}", clinic_id: "${clinic_id}", service_code: "EXAM" }
              as: ClinicStaff
          assert:
            - "ContractTerm.${term1_id}.entitlement_granted_cents == 12000"
            - "ContractTerm.${term1_id}.entitlement_balance_cents == 6000"

      - name: cascade_renewal_already_covered_by_difficulty
        claim_type: cascading_side_effects
        grounds:
          - state_machines.ContractTerm.RENEWAL_PENDING_to_EXPIRED
        excluded_because:
          difficulty_instance: transitive_cascade / renewal_cascade_expire_forfeit_grant_depth2
          rationale: "The expire -> forfeit -> successor grant cascade is asserted by the named §1.8 instance."

  # ---------------------------------------------------------------------------
  - section: consistency_model
    instances:
      - name: activate_changes_visible_in_same_response
        claim_type: immediate
        grounds:
          - state_machines.Membership.PENDING_PAYMENT_to_ENROLLED
          - entities.Membership.fields.status
        distinguishing_aspect: "The activate response itself shows status ENROLLED (immediate consistency; no read-after-write lag)."
        test_recipe:
          setup: ["PLUS membership PENDING_PAYMENT with one pet"]
          setup_api_calls:
            - call: "POST /wellness/_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: PlanAdmin
            - call: "POST /wellness/plans"
              payload: { tier: "PLUS", name: "Plus", monthly_fee_cents: 4500, annual_value_cents: 60000 }
              as: PlanAdmin
              captures: { plus_id: $.data.id }
            - call: "POST /wellness/plan-services"
              payload: { plan_id: "${plus_id}", service_code: "EXAM", included_quantity: 2, unit_value_cents: 6000 }
              as: PlanAdmin
            - call: "POST /wellness/clinics"
              payload: { name: "CA Clinic", region_code: "CA" }
              as: PlanAdmin
              captures: { clinic_id: $.data.id }
            - call: "POST /wellness/member-accounts"
              payload: { email: "cma@x.com", full_name: "CMA", home_clinic_id: "${clinic_id}" }
              as: Member
              captures: { acct_id: $.data.id }
            - call: "POST /wellness/memberships"
              payload: { member_account_id: "${acct_id}", plan_id: "${plus_id}", billing_anchor_day: 1 }
              as: Member
              as_user_id: "${acct_id}"
              captures: { mem_id: $.data.id }
            - call: "POST /wellness/memberships/${mem_id}/pets"
              payload: { name: "Rex", species: "DOG", weight_kg: 12 }
              as: Member
              as_user_id: "${acct_id}"
          trigger:
            - call: "POST /wellness/memberships/${mem_id}/activate"
              payload: {}
              as: Member
