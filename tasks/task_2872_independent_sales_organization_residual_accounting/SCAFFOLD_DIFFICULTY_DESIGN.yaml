              as: IsoAdmin
              captures: { m2: $.data.id }
            - call: "POST /merchants/${m2}/activate"
              payload: {}
              as: IsoAdmin
            - call: "POST /residual-batches"
              payload: { processor_program_id: "${p1}", period_month: "2026-07", coverage_start: "2026-07-01", coverage_end: "2026-08-01", file_checksum: "sha256:sod-0001" }
              as: ResidualAnalyst
              captures: { b1: $.data.id }
            - call: "POST /residual-batches/${b1}/lines"
              payload: { merchant_id: "${m2}", transaction_count: 125, sales_volume_cents: 100000, interchange_cents: 1800, assessments_cents: 130, gross_income_cents: 3200 }
              as: ResidualAnalyst
            - call: "POST /residual-batches/${b1}/normalize"
              payload: {}
              as: ResidualAnalyst
            - call: "POST /residual-batches/${b1}/post"
              payload: {}
              as: ResidualController
            - call: "GET /agent-statements"
              payload: { agent_id: "${a1}", period_month: "2026-07" }
