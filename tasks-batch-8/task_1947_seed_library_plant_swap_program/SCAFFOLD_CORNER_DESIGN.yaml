      - name: ep_conditional_action_site_deactivation_guarded
        claim_type: conditional_action
        grounds: ["state_machines.Site.ACTIVE_to_INACTIVE", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "PATCH /api/sites/{id} status=INACTIVE is rejected with ERR_INVALID_STATE while the site hosts a live (DRAFT/SCHEDULED/INTAKE_OPEN/INTAKE_CLOSED) swap event — deactivation is guarded by child state."
        test_recipe:
          setup: ["site S; event E at S published (SCHEDULED)"]
          setup_api_calls:
            - call: "POST /api/sites"
              payload: { name: "S", site_type: "GARDEN", region_zone: "ZONE_5A" }
              as: ProgramAdmin
              captures: { s_id: "$.data.id" }
            - call: "POST /api/swap-events"
              payload: { site_id: "${s_id}", title: "E", start_at: "2027-01-09T10:00:00Z", end_at: "2027-01-09T12:00:00Z" }
              as: ProgramAdmin
              captures: { e_id: "$.data.id" }
            - call: "POST /api/swap-events/${e_id}/publish"
              payload: {}
              as: ProgramAdmin
          trigger:
            - call: "PATCH /api/sites/${s_id}"
