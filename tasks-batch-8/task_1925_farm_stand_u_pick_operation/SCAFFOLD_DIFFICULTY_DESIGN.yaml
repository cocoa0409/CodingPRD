        distinguishing_aspect: |
          Cyclic machine on Field: DORMANT -> OPEN -> PICKED_OUT -> ROTATION_REST
          -> DORMANT is traversed end-to-end, with the rest_until inclusive
          boundary (rest through 2026-08-10 lifts exactly on 2026-08-10).
