    roles: [FieldTechnician, Supervisor]
    code: 201
    input: [scope, entry_required, reason]
    output: ShutoffOrder
    side_effects: []

  - method: GET
    path: "/gas-ops/incidents/{id}/shutoff-orders"
    description: "List shutoff orders of an incident"
    roles: [SystemAdmin, Dispatcher, FieldTechnician, Supervisor, Regulator]
    code: 200
    input: ["limit?", "offset?"]
    output: "ShutoffOrder[]"
    side_effects: []

  - method: GET
    path: "/gas-ops/shutoff-orders/{shutoffId}"
    description: "Get a shutoff order"
    roles: [SystemAdmin, Dispatcher, FieldTechnician, Supervisor, Regulator]
    code: 200
    input: []
    output: ShutoffOrder
    side_effects: []

  - method: POST
    path: "/gas-ops/shutoff-orders/{shutoffId}/authorize"
    description: "Supervisor authorizes a REQUESTED shutoff"
    roles: [Supervisor]
    code: 200
    input: []
    output: ShutoffOrder
    side_effects: ["REQUESTED -> AUTHORIZED"]

  - method: POST
    path: "/gas-ops/shutoff-orders/{shutoffId}/decline"
    description: "Supervisor declines a REQUESTED shutoff"
    roles: [Supervisor]
    code: 200
    input: ["reason?"]
    output: ShutoffOrder
    side_effects: ["REQUESTED -> DECLINED"]

  - method: POST
    path: "/gas-ops/shutoff-orders/{shutoffId}/execute"
    description: "Assigned technician executes an AUTHORIZED shutoff (entry gate applies when entry_required)"
    roles: [FieldTechnician]
    code: 200
    input: []
    output: ShutoffOrder
    side_effects: ["AUTHORIZED -> EXECUTED", "incident.gas_flow_stopped recomputed", "METER scope + evacuation_required triggers AUTO_SEVERITY MEDIA notification rule"]

  - method: POST
    path: "/gas-ops/shutoff-orders/{shutoffId}/restore"
    description: "Assigned technician restores gas after an EXECUTED shutoff"
    roles: [FieldTechnician]
    code: 200
    input: []
    output: ShutoffOrder
    side_effects: ["EXECUTED -> RESTORED"]

  # --- Responsibility determination ---
  - method: POST
    path: "/gas-ops/incidents/{id}/responsibility-determinations"
    description: "Draft a responsibility determination (OCC-guarded on incident version)"
    roles: [Supervisor]
    code: 201
    input: [responsibility, basis, expected_incident_version, "notes?"]
    output: ResponsibilityDetermination
    side_effects: ["status := DRAFT", "increments GasIncident.version by 1"]

  - method: GET
    path: "/gas-ops/incidents/{id}/responsibility-determinations"
    description: "List determinations of an incident"
    roles: [SystemAdmin, Dispatcher, FieldTechnician, Supervisor, Regulator]
    code: 200
    input: ["limit?", "offset?"]
    output: "ResponsibilityDetermination[]"
    side_effects: []

  - method: GET
    path: "/gas-ops/responsibility-determinations/{determinationId}"
    description: "Get a determination"
    roles: [SystemAdmin, Dispatcher, FieldTechnician, Supervisor, Regulator]
    code: 200
    input: []
    output: ResponsibilityDetermination
    side_effects: []

  - method: POST
    path: "/gas-ops/responsibility-determinations/{determinationId}/finalize"
    description: "Finalize a DRAFT determination; finalizer must differ from drafter (segregation of duties)"
    roles: [Supervisor]
    code: 200
    input: []
    output: ResponsibilityDetermination
    side_effects: ["DRAFT -> FINAL; prior FINAL -> SUPERSEDED", "OUTSIDE_COMPANY/SHARED auto-creates OPEN RepairWorkOrder", "INSIDE_CUSTOMER sets incident.customer_referral_required", "incident.responsibility recomputed", "increments GasIncident.version by 1"]

  # --- RepairWorkOrder ---
  - method: POST
    path: "/gas-ops/incidents/{id}/repair-work-orders"
    description: "Manually create a work order (requires leak_confirmed == true); provisional estimate uses UNDETERMINED row when no FINAL determination exists"
    roles: [Supervisor]
    code: 201
    input: ["notes?"]
    output: RepairWorkOrder
    side_effects: ["status := OPEN, origin := MANUAL, provisional_estimate_cents from matrix"]

  - method: GET
    path: "/gas-ops/incidents/{id}/repair-work-orders"
    description: "List work orders of an incident"
    roles: [SystemAdmin, Dispatcher, FieldTechnician, Supervisor, Regulator]
    code: 200
    input: ["limit?", "offset?"]
    output: "RepairWorkOrder[]"
    side_effects: []

  - method: GET
    path: "/gas-ops/repair-work-orders/{workOrderId}"
    description: "Get a work order"
    roles: [SystemAdmin, Dispatcher, FieldTechnician, Supervisor, Regulator]
    code: 200
    input: []
    output: RepairWorkOrder
    side_effects: []

  - method: POST
    path: "/gas-ops/repair-work-orders/{workOrderId}/schedule"
    description: "Schedule an OPEN work order to a crew window (travel buffer, FINAL determination, budget cap gates)"
    roles: [Supervisor]
    code: 200
    input: [crew_id, window_start, window_end]
    output: RepairWorkOrder
    side_effects: ["OPEN -> SCHEDULED", "territory.repair_reserved_cents += current_estimate_cents"]

  - method: POST
    path: "/gas-ops/repair-work-orders/{workOrderId}/start"
    description: "Start a SCHEDULED work order"
    roles: [Supervisor]
    code: 200
    input: []
    output: RepairWorkOrder
    side_effects: ["SCHEDULED -> IN_PROGRESS"]

  - method: POST
    path: "/gas-ops/repair-work-orders/{workOrderId}/hold"
    description: "Hold an IN_PROGRESS work order"
    roles: [Supervisor]
    code: 200
    input: ["reason?"]
    output: RepairWorkOrder
    side_effects: ["IN_PROGRESS -> ON_HOLD"]

  - method: POST
    path: "/gas-ops/repair-work-orders/{workOrderId}/resume"
    description: "Resume an ON_HOLD work order"
    roles: [Supervisor]
    code: 200
    input: []
    output: RepairWorkOrder
    side_effects: ["ON_HOLD -> IN_PROGRESS"]

  - method: POST
    path: "/gas-ops/repair-work-orders/{workOrderId}/complete"
    description: "Complete an IN_PROGRESS work order with parts lines and labor minutes"
    roles: [Supervisor]
    code: 200
    input: [lines, labor_minutes]
    output: RepairWorkOrder
    side_effects: ["final_cost_cents per repair_cost_final", "territory.repair_reserved_cents -= provisional_estimate_cents", "IN_PROGRESS -> COMPLETED"]

  - method: POST
    path: "/gas-ops/repair-work-orders/{workOrderId}/cancel"
    description: "Cancel an OPEN/SCHEDULED/ON_HOLD work order"
    roles: [Supervisor]
    code: 200
    input: ["reason?"]
    output: RepairWorkOrder
    side_effects: ["-> CANCELLED", "reserved budget released when SCHEDULED/ON_HOLD"]

  # --- RegulatoryReport ---
  - method: POST
    path: "/gas-ops/regulatory-reports"
    description: "Generate a DRAFT response-time compliance snapshot for a territory and half-open period"
    roles: [Supervisor]
    code: 201
    input: [territory_id, period_start, period_end]
    output: RegulatoryReport
    side_effects: ["Snapshot counts/rates computed per regulatory_compliance_snapshot", "status := DRAFT"]

  - method: GET
    path: "/gas-ops/regulatory-reports"
    description: "List reports (Regulator sees only SUBMITTED/ACCEPTED/REJECTED)"
    roles: [SystemAdmin, Dispatcher, Supervisor, Regulator]
    code: 200
    input: ["territory_id?", "status?", "limit?", "offset?"]
    output: "RegulatoryReport[]"
    side_effects: []

  - method: GET
    path: "/gas-ops/regulatory-reports/{reportId}"
    description: "Get a report (Regulator cannot read DRAFT)"
    roles: [SystemAdmin, Dispatcher, Supervisor, Regulator]
    code: 200
    input: []
    output: RegulatoryReport
    side_effects: []

  - method: POST
    path: "/gas-ops/regulatory-reports/{reportId}/submit"
    description: "Submit a DRAFT report (freezes snapshot; stale drafts rejected)"
    roles: [Supervisor]
    code: 200
    input: []
    output: RegulatoryReport
    side_effects: ["DRAFT -> SUBMITTED, submitted_at := now"]

  - method: POST
    path: "/gas-ops/regulatory-reports/{reportId}/accept"
    description: "Regulator accepts a SUBMITTED report"
    roles: [Regulator]
    code: 200
    input: []
    output: RegulatoryReport
    side_effects: ["SUBMITTED -> ACCEPTED"]

  - method: POST
    path: "/gas-ops/regulatory-reports/{reportId}/reject"
    description: "Regulator rejects a SUBMITTED report"
    roles: [Regulator]
    code: 200
    input: [reason]
    output: RegulatoryReport
    side_effects: ["SUBMITTED -> REJECTED"]

  - method: POST
    path: "/gas-ops/regulatory-reports/{reportId}/regenerate"
    description: "Recompute a DRAFT or REJECTED report snapshot"
    roles: [Supervisor]
    code: 200
    input: []
    output: RegulatoryReport
    side_effects: ["Snapshot recomputed; needs_regeneration := false; regeneration_count += 1; REJECTED -> DRAFT"]

  # --- PublicNotification ---
  - method: POST
    path: "/gas-ops/incidents/{id}/public-notifications"
    description: "Draft a media/public-safety notification (MANUAL)"
    roles: [Supervisor]
    code: 201
    input: [channel, headline, body]
    output: PublicNotification
    side_effects: ["status := DRAFT"]

  - method: GET
    path: "/gas-ops/incidents/{id}/public-notifications"
    description: "List notifications of an incident"
    roles: [SystemAdmin, Dispatcher, FieldTechnician, Supervisor, Regulator]
    code: 200
    input: ["limit?", "offset?"]
    output: "PublicNotification[]"
    side_effects: []

  - method: GET
    path: "/gas-ops/public-notifications/{notificationId}"
    description: "Get a notification"
    roles: [SystemAdmin, Dispatcher, FieldTechnician, Supervisor, Regulator]
    code: 200
    input: []
    output: PublicNotification
    side_effects: []

  - method: POST
    path: "/gas-ops/public-notifications/{notificationId}/issue"
    description: "Issue a DRAFT notification"
    roles: [Supervisor]
    code: 200
    input: []
    output: PublicNotification
    side_effects: ["DRAFT -> ISSUED, issued_at := now"]

  - method: POST
    path: "/gas-ops/public-notifications/{notificationId}/retract"
    description: "Retract an ISSUED notification"
    roles: [Supervisor]
    code: 200
    input: ["reason?"]
    output: PublicNotification
    side_effects: ["ISSUED -> RETRACTED, retracted_at := now"]

  - method: POST
    path: "/gas-ops/public-notifications/{notificationId}/discard"
    description: "Discard a DRAFT notification"
    roles: [Supervisor]
    code: 200
    input: []
    output: PublicNotification
    side_effects: ["DRAFT -> DISCARDED"]

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role missing/invalid" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field, unknown enum value, or numeric range violation" }
  - { id: ERR_INVALID_TIME_RANGE, http: 400, condition: "shift_end <= shift_start, window_end <= window_start, or period_end <= period_start" }
  - { id: ERR_REPAIR_BUDGET_EXCEEDED, http: 402, condition: "Scheduling would push territory.repair_reserved_cents above repair_budget_cap_cents" }
  - { id: ERR_INSUFFICIENT_PERMISSIONS, http: 403, condition: "Role not permitted on this endpoint" }
  - { id: ERR_REGULATOR_SCOPE_RESTRICTED, http: 403, condition: "Regulator reads only CLOSED/MERGED incidents and non-DRAFT reports" }
  - { id: ERR_NOT_ASSIGNED_TO_INCIDENT, http: 403, condition: "FieldTechnician acts on an incident/assignment it is not assigned to" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "Determination finalizer equals the drafter" }
  - { id: ERR_TERRITORY_NOT_FOUND, http: 404, condition: "Territory id does not exist" }
  - { id: ERR_TECHNICIAN_NOT_FOUND, http: 404, condition: "Technician id does not exist" }
  - { id: ERR_CREW_NOT_FOUND, http: 404, condition: "Repair crew id does not exist" }
  - { id: ERR_CALL_NOT_FOUND, http: 404, condition: "Emergency call id does not exist" }
  - { id: ERR_INCIDENT_NOT_FOUND, http: 404, condition: "Incident id does not exist" }
  - { id: ERR_DISPATCH_NOT_FOUND, http: 404, condition: "Dispatch assignment id does not exist" }
  - { id: ERR_PAUSE_NOT_FOUND, http: 404, condition: "Response-clock pause id does not exist" }
  - { id: ERR_SHUTOFF_NOT_FOUND, http: 404, condition: "Shutoff order id does not exist" }
  - { id: ERR_DETERMINATION_NOT_FOUND, http: 404, condition: "Responsibility determination id does not exist" }
  - { id: ERR_WORK_ORDER_NOT_FOUND, http: 404, condition: "Repair work order id does not exist" }
  - { id: ERR_REPORT_NOT_FOUND, http: 404, condition: "Regulatory report id does not exist" }
  - { id: ERR_NOTIFICATION_NOT_FOUND, http: 404, condition: "Public notification id does not exist" }
  - { id: ERR_STALE_INCIDENT_VERSION, http: 412, condition: "expected_incident_version does not match the incident's current version (OCC)" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Generic illegal state transition on the target resource" }
  - { id: ERR_INCIDENT_NOT_TRIAGED, http: 409, condition: "Dispatch requires the incident in TRIAGED" }
  - { id: ERR_INCIDENT_NOT_ACTIVE, http: 409, condition: "Operation requires a non-terminal, stage-appropriate incident (NEW/REOPENED for triage; ON_SCENE/MAKE_SAFE_IN_PROGRESS for readings/actions/completion; MONITORING for close)" }
  - { id: ERR_OPEN_PAUSE_EXISTS, http: 409, condition: "A response-clock pause is already OPEN on the incident (or arrival already recorded / lifecycle not in {TRIAGED, DISPATCHED})" }
  - { id: ERR_NO_AVAILABLE_TECHNICIAN, http: 409, condition: "Auto-selection found no eligible technician (empty candidate pool)" }
  - { id: ERR_TECHNICIAN_OFF_SHIFT, http: 409, condition: "Explicitly named technician is not on shift at the current logical time" }
  - { id: ERR_TECHNICIAN_TERRITORY_MISMATCH, http: 409, condition: "Explicitly named technician's home_territory_id differs from the incident territory" }
  - { id: ERR_TECHNICIAN_CAPACITY_REACHED, http: 409, condition: "Technician already holds 2 active assignments" }
  - { id: ERR_SHIFT_OVERLAP, http: 409, condition: "New shift [shift_start, shift_end) overlaps an existing shift of the same technician (adjacency is allowed)" }
  - { id: ERR_TRAVEL_BUFFER_VIOLATION, http: 409, condition: "Crew scheduling leaves less than 30 minutes between work-order windows" }
  - { id: ERR_DISPATCH_NOT_PREEMPTABLE, http: 409, condition: "Only EN_ROUTE assignments can be preempted (ON_SCENE/terminal cannot)" }
  - { id: ERR_MERGE_TARGET_INVALID, http: 409, condition: "Merge target missing, terminal, identical to source, or different normalized_address" }
  - { id: ERR_OPEN_DISPATCHES_EXIST, http: 409, condition: "Close/merge blocked: an assignment is still EN_ROUTE or ON_SCENE" }
  - { id: ERR_OPEN_SHUTOFF_ORDER, http: 409, condition: "Close blocked: a shutoff order is REQUESTED or AUTHORIZED" }
  - { id: ERR_DETERMINATION_NOT_DRAFT, http: 409, condition: "Finalize requires a DRAFT determination" }
  - { id: ERR_REPORT_NOT_DRAFT, http: 409, condition: "Submit requires a DRAFT report with needs_regeneration == false" }
  - { id: ERR_NOTIFICATION_NOT_DRAFT, http: 409, condition: "Issue/discard requires a DRAFT notification" }
  - { id: ERR_NOTIFICATION_NOT_ISSUED, http: 409, condition: "Retract requires an ISSUED notification" }
  - { id: ERR_ATMOSPHERIC_READING_REQUIRED, http: 422, condition: "Make-safe completion on an odor-reported incident requires at least one atmospheric reading" }
  - { id: ERR_MAKE_SAFE_NOT_COMPLETED, http: 422, condition: "Close requires make_safe_completed == true; make-safe completion blocked because evacuation_required == true lacks an EVACUATE action" }
  - { id: ERR_ENTRY_NOT_AUTHORIZED, http: 422, condition: "Executing an entry_required shutoff requires entry_status in {AUTHORIZED, FORCED}" }
  - { id: ERR_DETERMINATION_REQUIRED, http: 422, condition: "leak_confirmed close, or work-order schedule, requires a FINAL responsibility determination" }

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: SystemAdmin
    description: "Platform operator: territories, technicians, crews, logical clock"
    identity: opaque
    exclusive_operations:
      - "POST /_clock/set_current_utc"
      - "POST /gas-ops/territories"
      - "POST /gas-ops/technicians"
      - "POST /gas-ops/repair-crews"
    shared_operations:
      - "All GET endpoints"
      - "POST /gas-ops/technicians/{id}/shifts (shared with Supervisor)"

  - name: Dispatcher
    description: "Call-taker/dispatcher: intake, triage, dispatch, clock pauses, consent-based entry authorizations"
    identity: opaque
    exclusive_operations:
      - "POST /gas-ops/emergency-calls (shared with Supervisor)"
    shared_operations:
      - "POST /gas-ops/incidents/{id}/triage (shared with Supervisor)"
      - "POST /gas-ops/incidents/{id}/reclassify-priority (shared with Supervisor)"
      - "POST /gas-ops/incidents/{id}/dispatches (shared with Supervisor)"
      - "POST /gas-ops/incidents/{id}/response-clock-pauses and /end (shared with Supervisor)"
      - "POST /gas-ops/incidents/{id}/premise-entry-authorizations with method=CUSTOMER_CONSENT"
      - "GET endpoints except Regulator-scoped exclusions"

  - name: FieldTechnician
    description: "First responder: arrives/clears own assignments, records readings and make-safe actions, requests/executes shutoffs"
    identity: "entity_backed:FieldTechnician"
    exclusive_operations:
      - "POST /gas-ops/dispatches/{id}/arrive"
      - "POST /gas-ops/dispatches/{id}/clear"
      - "POST /gas-ops/incidents/{id}/atmospheric-readings"
      - "POST /gas-ops/incidents/{id}/make-safe-actions"
      - "POST /gas-ops/incidents/{id}/make-safe/complete"
      - "POST /gas-ops/shutoff-orders/{id}/execute"
      - "POST /gas-ops/shutoff-orders/{id}/restore"
    shared_operations:
      - "POST /gas-ops/incidents/{id}/shutoff-orders (shared with Supervisor)"
      - "POST /gas-ops/incidents/{id}/entry-status (shared with Supervisor)"
      - "GET endpoints (assignment-scoped for incidents)"

  - name: Supervisor
    description: "Operations supervisor: all dispatcher capabilities plus authorization, preemption, determinations, work orders, reports, notifications, close/merge"
    identity: opaque
    exclusive_operations:
      - "POST /gas-ops/shutoff-orders/{id}/authorize and /decline"
      - "POST /gas-ops/dispatches/{id}/preempt and /cancel"
      - "POST /gas-ops/incidents/{id}/close and /merge-duplicate"
      - "POST /gas-ops/incidents/{id}/responsibility-determinations and finalize (finalize requires a different supervisor user id than the drafter)"
      - "POST /gas-ops/incidents/{id}/repair-work-orders and all /gas-ops/repair-work-orders/{id}/* actions"
      - "POST /gas-ops/regulatory-reports, /submit, /regenerate"
      - "POST /gas-ops/incidents/{id}/public-notifications and issue/retract/discard"
      - "premise-entry-authorizations with method=EMERGENCY_FORCED or WARRANT"
    shared_operations:
      - "All Dispatcher shared_operations"
      - "All GET endpoints"

  - name: Regulator
    description: "External regulator: read-only access to closed incidents and submitted reports; accepts/rejects reports"
    identity: opaque
    exclusive_operations:
      - "POST /gas-ops/regulatory-reports/{id}/accept"
      - "POST /gas-ops/regulatory-reports/{id}/reject"
    shared_operations:
      - "GET endpoints subject to scope: only CLOSED/MERGED incidents, only non-DRAFT reports"


