            - "${claim_benefit} == 150000, ${claim_occurrence_used} == 150000 and ${claim_status_final} == PAID"
            - "GET /ledger-entries?enrollment_id=${enrollment_id}&ledger_kind=BENEFIT reports total_count 1 with one BENEFIT_CHARGE of +150000 carrying cap_year_start 2026-08-05"

