  - section: validations
    instances:
      - name: get_family_missing_header_unauthenticated
        claim_type: Violation → Error
        grounds:
          - validations[priority=1]
          - errors[ERR_UNAUTHENTICATED]
        distinguishing_aspect: "A request with missing X-User-ID/X-User-Role headers returns ERR_UNAUTHENTICATED (401) before any other check."
        test_recipe:
          setup: ["A family exists"]
          setup_api_calls:
            - { call: "POST /families", payload: { family_name: "Kindred S", outreach_budget_cents: 10000 }, as: ProgramAdmin, captures: { fid: $.data.id } }
          trigger:
            - { call: "GET /families/${fid}", payload: {}, as: ProgramAdmin, captures: { err: $.data.error_id } }
          assert:
            - "With X-User-ID and X-User-Role headers omitted, response HTTP status == 401"
            - "response data.error_id == ERR_UNAUTHENTICATED"

      - name: billing_role_cannot_create_case_forbidden
        claim_type: Violation → Error
        grounds:
          - validations[priority=2]
          - roles.BillingSpecialist
          - errors[ERR_FORBIDDEN]
        distinguishing_aspect: "BillingSpecialist calling POST /counseling-cases (GeneticCounselor-exclusive) returns ERR_FORBIDDEN (403)."
        test_recipe:
          setup: ["Family and counselor exist"]
          setup_api_calls:
