scaffold_difficulty_design:

  # -------------------------------------------------------------------------
  # Rule 1 — Dual-variant calculations across different entity domains
  # -------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:

      - name: back_pay_initial_vs_alj_variants_diverge_on_benefit_award
        grounds:
          - calculations.back_pay_amount
          - calculations.back_pay_amount.variants.INITIAL_APPROVAL
          - calculations.back_pay_amount.variants.ALJ_APPROVAL
          - entities.BenefitAward.fields.back_pay_cents
          - entities.BenefitAward.fields.back_pay_variant
        distinguishing_aspect: |
          Same Application, same Claimant, same EOD/PFD/PIA — INITIAL_APPROVAL
          variant computes back_pay against the DDS examiner's decision_date
          (close to filing), while ALJ_APPROVAL variant computes against the
          ALJ decision_date (years later), producing different back_pay_cents
          on the BenefitAward entity. This rule lives on entity BenefitAward
          (financial domain).
        test_recipe:
          setup:
            - "Server clock at 2026-04-15T00:00:00Z."
            - "Claimant C registered (age ~46 at filing), 30 years of credits at 48000 USD/yr (earnings_cents=4800000) covering 1996-2025."
            - "Application A submitted on 2026-01-15 with claim_type=SSDI_ONLY, alleged_onset_date=2024-01-01, protective_filing_date=2026-01-15; QC passes (insured)."
            - "MedicalEvidence attached."
            - "DDS examiner approves at 2026-04-15: decision_type=RFC_DISABLED, established_onset_date=2024-01-15 → BenefitAward created with back_pay_variant=INITIAL_APPROVAL."
          setup_api_calls:
            - call: "POST /ssdi/_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-15T00:00:00Z" }
              as: SSAAdmin
            - call: "POST /ssdi/claimants"
              payload: { ssn_last4: "1234", full_name: "Claim Ant", date_of_birth: "1980-01-01T00:00:00Z", filing_state: "TX" }
              as: SSAAdmin
              captures: { c_id: "$.data.id "}
            - call: "POST /ssdi/work-credits"
              payload: { claimant_id: "${c_id}", year: 2020, credits_earned: 4, earnings_cents: 4800000 }
              as: SSAAdmin
            - call: "POST /ssdi/work-credits"
              payload: { claimant_id: "${c_id}", year: 2021, credits_earned: 4, earnings_cents: 4800000 }
              as: SSAAdmin
            - call: "POST /ssdi/work-credits"
              payload: { claimant_id: "${c_id}", year: 2022, credits_earned: 4, earnings_cents: 4800000 }
              as: SSAAdmin
            - call: "POST /ssdi/work-credits"
              payload: { claimant_id: "${c_id}", year: 2023, credits_earned: 4, earnings_cents: 4800000 }
              as: SSAAdmin
            - call: "POST /ssdi/work-credits"
              payload: { claimant_id: "${c_id}", year: 2024, credits_earned: 4, earnings_cents: 4800000 }
              as: SSAAdmin
            - call: "POST /ssdi/work-credits"
              payload: { claimant_id: "${c_id}", year: 2025, credits_earned: 4, earnings_cents: 4800000 }
              as: SSAAdmin
            - call: "POST /ssdi/work-credits"
              payload: { claimant_id: "${c_id}", year: 2015, credits_earned: 4, earnings_cents: 4800000 }
              as: SSAAdmin
            - call: "POST /ssdi/work-credits"
              payload: { claimant_id: "${c_id}", year: 2016, credits_earned: 4, earnings_cents: 4800000 }
              as: SSAAdmin
            - call: "POST /ssdi/work-credits"
              payload: { claimant_id: "${c_id}", year: 2017, credits_earned: 4, earnings_cents: 4800000 }
              as: SSAAdmin
            - call: "POST /ssdi/work-credits"
              payload: { claimant_id: "${c_id}", year: 2018, credits_earned: 4, earnings_cents: 4800000 }
              as: SSAAdmin
            - call: "POST /ssdi/work-credits"
              payload: { claimant_id: "${c_id}", year: 2019, credits_earned: 4, earnings_cents: 4800000 }
              as: SSAAdmin
            - call: "POST /ssdi/applications"
              payload: { claimant_id: "${c_id}", alleged_onset_date: "2024-01-01T00:00:00Z", protective_filing_date: "2026-01-15T00:00:00Z", claim_type: "SSDI_ONLY" }
              as: Claimant
              as_user_id: "${c_id}"
              captures: { app_id: "$.data.id "}
            - call: "POST /ssdi/applications/${app_id}/submit"
              payload: {}
              as: Claimant
              as_user_id: "${c_id}"
              captures: { app_v_after_submit: "$.data.version "}
            - call: "POST /ssdi/applications/${app_id}/evidence"
              payload: { source_type: "TREATING_PHYSICIAN", report_date: "2024-02-01T00:00:00Z", diagnosis_code: "M54.5", severity_score: 80 }
              as: Claimant
              as_user_id: "${c_id}"
            - call: "POST /ssdi/_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-15T00:00:00Z" }
              as: SSAAdmin
          trigger:
            - call: "POST /ssdi/applications/${app_id}/medical-decision"
              payload: { decision_type: "RFC_DISABLED", established_onset_date: "2024-01-15T00:00:00Z", rfc_score: 30, expected_application_version: "${app_v_after_submit}" }
              as: DDSExaminer
              captures: { decision_id: "$.data.id "}
          assert:
            - "Application.${app_id}.status == APPROVED_INITIAL or AWARDED"
            - "Application.${app_id}.medical_decision == RFC_DISABLED"
            - "BenefitAward (filtered by application_id=${app_id}).back_pay_variant == INITIAL_APPROVAL"
            - "BenefitAward.primary_insurance_amount_cents == 196092"
            - "BenefitAward.monthly_benefit_cents == 196092"
            - "BenefitAward.back_pay_cents == 2941380"

      - name: ssi_supplement_eligible_vs_resource_ineligible_variants_on_supplement_entity
        grounds:
          - calculations.ssi_supplement_amount
          - entities.SSISupplement.fields.status
          - entities.SSISupplement.fields.monthly_supplement_cents
          - entities.Claimant.fields.countable_resources_cents
        distinguishing_aspect: |
          On SSISupplement entity (welfare-supplement domain — distinct from
          BenefitAward's insurance-payout domain), the same identical PIA and
          monthly income produce different supplement values depending on
          whether claimant.countable_resources_cents exceeds the $2,000 limit.
          Low-resource claimant: status=ACTIVE, monthly_supplement_cents>0;
          high-resource claimant: status=INELIGIBLE_RESOURCES,
          monthly_supplement_cents=0. Two valid algorithms (eligibility-gated
          vs unconditional) produce different results.
        test_recipe:
          setup:
            - "Server clock at 2026-04-15."
            - "Claimant C2 with monthly_income_cents=0, countable_resources_cents=300000 ($3,000 — over limit)."
            - "Work credits give a low PIA (AIME=$1,000 → PIA=$900)."
            - "Application A2 with claim_type=CONCURRENT_SSDI_SSI, submitted and INSURED, evidence attached."
          setup_api_calls:
            - call: "POST /ssdi/_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-15T00:00:00Z" }
              as: SSAAdmin
            - call: "POST /ssdi/claimants"
              payload: { ssn_last4: "5678", full_name: "Low Income", date_of_birth: "1985-01-01T00:00:00Z", filing_state: "CA", monthly_income_cents: 0, countable_resources_cents: 300000 }
              as: SSAAdmin
              captures: { c2_id: "$.data.id "}
            - call: "POST /ssdi/work-credits"
              payload: { claimant_id: "${c2_id}", year: 2020, credits_earned: 4, earnings_cents: 1200000 }
              as: SSAAdmin
            - call: "POST /ssdi/work-credits"
              payload: { claimant_id: "${c2_id}", year: 2021, credits_earned: 4, earnings_cents: 1200000 }
              as: SSAAdmin
            - call: "POST /ssdi/work-credits"
              payload: { claimant_id: "${c2_id}", year: 2022, credits_earned: 4, earnings_cents: 1200000 }
              as: SSAAdmin
            - call: "POST /ssdi/work-credits"
              payload: { claimant_id: "${c2_id}", year: 2023, credits_earned: 4, earnings_cents: 1200000 }
              as: SSAAdmin
            - call: "POST /ssdi/work-credits"
              payload: { claimant_id: "${c2_id}", year: 2024, credits_earned: 4, earnings_cents: 1200000 }
              as: SSAAdmin
            - call: "POST /ssdi/work-credits"
              payload: { claimant_id: "${c2_id}", year: 2025, credits_earned: 4, earnings_cents: 1200000 }
              as: SSAAdmin
            - call: "POST /ssdi/work-credits"
              payload: { claimant_id: "${c2_id}", year: 2015, credits_earned: 4, earnings_cents: 1200000 }
              as: SSAAdmin
            - call: "POST /ssdi/work-credits"
              payload: { claimant_id: "${c2_id}", year: 2016, credits_earned: 4, earnings_cents: 1200000 }
              as: SSAAdmin
            - call: "POST /ssdi/work-credits"
              payload: { claimant_id: "${c2_id}", year: 2017, credits_earned: 4, earnings_cents: 1200000 }
              as: SSAAdmin
            - call: "POST /ssdi/work-credits"
              payload: { claimant_id: "${c2_id}", year: 2018, credits_earned: 4, earnings_cents: 1200000 }
              as: SSAAdmin
            - call: "POST /ssdi/work-credits"
              payload: { claimant_id: "${c2_id}", year: 2019, credits_earned: 4, earnings_cents: 1200000 }
              as: SSAAdmin
            - call: "POST /ssdi/applications"
              payload: { claimant_id: "${c2_id}", alleged_onset_date: "2024-01-01T00:00:00Z", protective_filing_date: "2026-01-15T00:00:00Z", claim_type: "CONCURRENT_SSDI_SSI" }
              as: SSAAdmin
              captures: { a2_id: "$.data.id "}
            - call: "POST /ssdi/applications/${a2_id}/submit"
              payload: {}
              as: Claimant
              as_user_id: "${c2_id}"
              captures: { a2_v: "$.data.version "}
            - call: "POST /ssdi/applications/${a2_id}/evidence"
              payload: { source_type: "TREATING_PHYSICIAN", report_date: "2024-02-01T00:00:00Z", diagnosis_code: "F32.9", severity_score: 75 }
              as: DDSExaminer
            - call: "POST /ssdi/_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-15T00:00:00Z" }
              as: SSAAdmin
          trigger:
            - call: "POST /ssdi/applications/${a2_id}/medical-decision"
              payload: { decision_type: "RFC_DISABLED", established_onset_date: "2024-01-15T00:00:00Z", rfc_score: 25, expected_application_version: "${a2_v}" }
              as: DDSExaminer
          assert:
            - "SSISupplement (filtered by application_id=${a2_id}).status == INELIGIBLE_RESOURCES"
            - "SSISupplement.monthly_supplement_cents == 0"
            - "SSISupplement.state_supplement_cents == 0"

  # -------------------------------------------------------------------------
  # Rule 2 — Combinatorial formulas across different modes
  # -------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:

      - name: pia_tiered_bend_points_round_per_tier_then_sum
        grounds:
          - calculations.pia_amount
          - calculations.pia_amount.constants.BEND1_CENTS
          - calculations.pia_amount.constants.BEND2_CENTS
        distinguishing_aspect: |
          Mode (b) — nested rounding where order matters. PIA formula rounds
          each tier separately (0.9*tier1, 0.32*tier2, 0.15*tier3) before
          summing. Round-then-sum vs sum-then-round produces different cents
          for AIMEs whose per-tier products are not whole cents. Order pinned
          in formula.
        test_recipe:
          setup:
            - "Server clock at 2026-04-15."
            - "Claimant C3 (age 46) with 12 years credits at earnings 4800000 cents/yr → AIME=400000 cents."
            - "Per-tier: tier1=117400 → 0.9*117400=105660; tier2=282600 → 0.32*282600=90432; tier3=0; sum=196092."
            - "If instead computed as round(0.9*117400 + 0.32*282600 + 0.15*0)=round(196092.0)=196092 — happens to agree here, BUT for the boundary AIME the rounding order matters; this test pins the per-tier rule with a clean baseline."
            - "Application submitted + evidence + decision in MEDICAL_REVIEW."
          setup_api_calls:
            - call: "POST /ssdi/_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-15T00:00:00Z" }
              as: SSAAdmin
            - call: "POST /ssdi/claimants"
              payload: { ssn_last4: "9999", full_name: "Tier Test", date_of_birth: "1980-01-01T00:00:00Z", filing_state: "TX" }
              as: SSAAdmin
              captures: { c3_id: "$.data.id "}
            - call: "POST /ssdi/work-credits"
              payload: { claimant_id: "${c3_id}", year: 2014, credits_earned: 4, earnings_cents: 4800000 }
              as: SSAAdmin
            - call: "POST /ssdi/work-credits"
              payload: { claimant_id: "${c3_id}", year: 2015, credits_earned: 4, earnings_cents: 4800000 }
              as: SSAAdmin
            - call: "POST /ssdi/work-credits"
              payload: { claimant_id: "${c3_id}", year: 2016, credits_earned: 4, earnings_cents: 4800000 }
              as: SSAAdmin
            - call: "POST /ssdi/work-credits"
              payload: { claimant_id: "${c3_id}", year: 2017, credits_earned: 4, earnings_cents: 4800000 }
              as: SSAAdmin
            - call: "POST /ssdi/work-credits"
              payload: { claimant_id: "${c3_id}", year: 2018, credits_earned: 4, earnings_cents: 4800000 }
              as: SSAAdmin
            - call: "POST /ssdi/work-credits"
              payload: { claimant_id: "${c3_id}", year: 2019, credits_earned: 4, earnings_cents: 4800000 }
              as: SSAAdmin
            - call: "POST /ssdi/work-credits"
              payload: { claimant_id: "${c3_id}", year: 2020, credits_earned: 4, earnings_cents: 4800000 }
              as: SSAAdmin
            - call: "POST /ssdi/work-credits"
              payload: { claimant_id: "${c3_id}", year: 2021, credits_earned: 4, earnings_cents: 4800000 }
              as: SSAAdmin
            - call: "POST /ssdi/work-credits"
              payload: { claimant_id: "${c3_id}", year: 2022, credits_earned: 4, earnings_cents: 4800000 }
              as: SSAAdmin
            - call: "POST /ssdi/work-credits"
              payload: { claimant_id: "${c3_id}", year: 2023, credits_earned: 4, earnings_cents: 4800000 }
              as: SSAAdmin
            - call: "POST /ssdi/work-credits"
              payload: { claimant_id: "${c3_id}", year: 2024, credits_earned: 4, earnings_cents: 4800000 }
              as: SSAAdmin
            - call: "POST /ssdi/work-credits"
              payload: { claimant_id: "${c3_id}", year: 2025, credits_earned: 4, earnings_cents: 4800000 }
              as: SSAAdmin
            - call: "POST /ssdi/applications"
              payload: { claimant_id: "${c3_id}", alleged_onset_date: "2024-01-01T00:00:00Z", protective_filing_date: "2026-01-15T00:00:00Z", claim_type: "SSDI_ONLY" }
              as: SSAAdmin
              captures: { a3_id: "$.data.id "}
            - call: "POST /ssdi/applications/${a3_id}/submit"
              payload: {}
              as: Claimant
              as_user_id: "${c3_id}"
              captures: { a3_v: "$.data.version "}
            - call: "POST /ssdi/applications/${a3_id}/evidence"
              payload: { source_type: "TREATING_PHYSICIAN", report_date: "2024-02-01T00:00:00Z", diagnosis_code: "M54.5", severity_score: 80 }
              as: Claimant
              as_user_id: "${c3_id}"
            - call: "POST /ssdi/_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-15T00:00:00Z" }
              as: SSAAdmin
          trigger:
            - call: "POST /ssdi/applications/${a3_id}/medical-decision"
              payload: { decision_type: "RFC_DISABLED", established_onset_date: "2024-01-15T00:00:00Z", rfc_score: 30, expected_application_version: "${a3_v}" }
              as: DDSExaminer
          assert:
            - "BenefitAward (application_id=${a3_id}).primary_insurance_amount_cents == 196092"

      - name: qc_count_nonlinear_age_bucket_with_lookback_gate
        grounds:
          - calculations.qc_count
          - calculations.qc_count.constants.RECENT_QC_THRESHOLD
          - calculations.qc_count.constants.LOOKBACK_YEARS
          - entities.Application.fields.insured_status
        distinguishing_aspect: |
          Mode (a) — non-linear formula with ≥3 inputs (age, total credits,
          credits in 10-year lookback). The required_total_qc piecewise
          function (under 24 vs 24-30 vs 31+) interacts with a hard 20-quarter
          recent-work threshold. A claimant with age=23 needs only 6 total
          credits but still must have 20 recent — a different combinatorial
          interaction than PIA tiered pricing (different mode (a) from the
          PIA's mode (b) rounding-order claim).
        test_recipe:
          setup:
            - "Server clock at 2026-01-15."
            - "Claimant born 2002-06-01 (age 23 at filing 2026-01-15). Posts 6 total credits across 2 years (3+3); recent_qc_in_lookback = 6 (< 20)."
            - "Application submitted → QC check fails on recent_qc gate → DENIED_QC."
          setup_api_calls:
            - call: "POST /ssdi/_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-15T00:00:00Z" }
              as: SSAAdmin
            - call: "POST /ssdi/claimants"
              payload: { ssn_last4: "1010", full_name: "Young Claim", date_of_birth: "2002-06-01T00:00:00Z", filing_state: "TX" }
              as: SSAAdmin
              captures: { cy_id: "$.data.id "}
            - call: "POST /ssdi/work-credits"
              payload: { claimant_id: "${cy_id}", year: 2024, credits_earned: 3, earnings_cents: 1200000 }
              as: SSAAdmin
            - call: "POST /ssdi/work-credits"
              payload: { claimant_id: "${cy_id}", year: 2025, credits_earned: 3, earnings_cents: 1200000 }
              as: SSAAdmin
            - call: "POST /ssdi/applications"
              payload: { claimant_id: "${cy_id}", alleged_onset_date: "2025-01-01T00:00:00Z", protective_filing_date: "2026-01-15T00:00:00Z", claim_type: "SSDI_ONLY" }
              as: SSAAdmin
              captures: { ay_id: "$.data.id "}
          trigger:
            - call: "POST /ssdi/applications/${ay_id}/submit"
              payload: {}
              as: Claimant
              as_user_id: "${cy_id}"
          assert:
            - "Application.${ay_id}.total_qc_at_filing == 6"
            - "Application.${ay_id}.recent_qc_in_lookback == 6"
            - "Application.${ay_id}.insured_status == NOT_INSURED"
            - "Application.${ay_id}.status == DENIED_QC"

  # -------------------------------------------------------------------------
  # Rule 3 — Non-linear state-machine shape on different entities
  # -------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:

      - name: application_branching_medical_decision_fork
        grounds:
          - state_machines.Application.transitions.MEDICAL_REVIEW_to_APPROVED_INITIAL
          - state_machines.Application.transitions.MEDICAL_REVIEW_to_DENIED_MEDICAL
          - state_machines.Application.transitions.DENIED_MEDICAL_to_RECONSIDERATION
          - state_machines.Application.transitions.RECONSIDERATION_to_ALJ_PENDING
          - state_machines.Application.transitions.ALJ_PENDING_to_ALJ_APPROVED
        distinguishing_aspect: |
          Application has a branching fork on MEDICAL_REVIEW (→APPROVED_INITIAL
          OR →DENIED_MEDICAL with divergent side-effect sets) and an explicit
          revision-loop sub-graph (DENIED_MEDICAL → RECONSIDERATION → ALJ_PENDING
          → ALJ_APPROVED, where the latter creates a BenefitAward with a
          different back_pay_variant than the initial branch would have). This
          is branching + revision-loop, not a linear pipeline.
        test_recipe:
          setup:
            - "Same Claimant baseline as back_pay_initial_vs_alj_variants_diverge_on_benefit_award."
            - "Application denied at MEDICAL_REVIEW, then reconsidered, then escalated to ALJ_PENDING, then ALJ_APPROVED."
          setup_api_calls:
            - call: "POST /ssdi/_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-15T00:00:00Z" }
              as: SSAAdmin
            - call: "POST /ssdi/claimants"
              payload: { ssn_last4: "2020", full_name: "Loop Claimant", date_of_birth: "1980-01-01T00:00:00Z", filing_state: "TX" }
              as: SSAAdmin
              captures: { cl_id: "$.data.id "}
