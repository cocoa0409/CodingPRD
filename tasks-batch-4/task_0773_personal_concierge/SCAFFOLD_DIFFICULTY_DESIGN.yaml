# =============================================================================
# task_0773_personal_concierge — §1.8 Scaffold Difficulty Design
# Test Targeting Index: 9 Difficulty Rules x 2 instances = 18 instances.
# Every grounds ref resolves into SCAFFOLD.yaml §1.1–§1.7.
# All numeric asserts are literals computed against §1.3 formulas + constants.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: engagement_provisional_vs_final_charge
        grounds:
          - calculations.engagement_client_charge
          - state_machines.VendorEngagement.PROPOSED_to_CONFIRMED
          - state_machines.VendorEngagement.CONFIRMED_to_RECONCILED
          - entities.VendorEngagement.fields.charge_basis
          - entities.Expense.fields.variance_cents
        distinguishing_aspect: |
          The provisional charge (from estimated_cost_lines, 1098) and the final charge
          (from actual_cost_lines, 1650) differ for the SAME engagement; this is cost
          accounting on VendorEngagement — a different entity domain than the satisfaction
          scoring instance.
        test_recipe:
          setup:
            - "ACTIVE member + ACTIVE GOLD membership on a plan with default_markup_pct=0.15"
            - "One ACTIVE BOOKING vendor, one SUBMITTED BOOKING service request"
            - "Engagement (MARKUP, markup_pct=0.10, estimated=[333,333,333]) CONFIRMED then RECONCILED with actual=[500,500,500]"
          setup_api_calls:
            - { call: "POST /concierge/members", payload: { full_name: "A", email: "a@x.com" }, as: AccountManager, captures: { m_id: "$.data.id" } }
            - { call: "POST /concierge/members/${m_id}/activate", payload: {}, as: AccountManager, captures: { m_v: "$.data.version" } }
            - { call: "POST /concierge/retainer-plans", payload: { name: "Gold", monthly_retainer_cents: 300000, included_hours: 10, overage_rate_cents_per_hour: 8000, default_markup_pct: 0.15, max_pass_through_cents: 50000 }, as: AccountManager, captures: { plan_id: "$.data.id" } }
            - { call: "POST /concierge/members/${m_id}/memberships", payload: { plan_id: "${plan_id}", vip_tier: "GOLD", expected_member_version: "${m_v}" }, as: AccountManager, captures: { ms_id: "$.data.id" } }
            - { call: "POST /concierge/vendors", payload: { name: "Concierge Bookings", category: "BOOKING" }, as: AccountManager, captures: { v_id: "$.data.id" } }
            - { call: "POST /concierge/service-requests", payload: { membership_id: "${ms_id}", category: "BOOKING", title: "Dinner reservation" }, as: Member, as_user_id: "${m_id}", captures: { sr_id: "$.data.id" } }
            - { call: "POST /concierge/service-requests/${sr_id}/engagements", payload: { vendor_id: "${v_id}", billing_mode: "MARKUP", markup_pct: 0.10, estimated_cost_lines: [333,333,333], service_start: "2026-03-05T18:00:00Z", service_end: "2026-03-05T20:00:00Z" }, as: ConciergeAgent, captures: { eng_id: "$.data.id" } }
            - { call: "POST /concierge/vendor-engagements/${eng_id}/confirm", payload: {}, as: ConciergeAgent }
          trigger:
            - { call: "POST /concierge/vendor-engagements/${eng_id}/reconcile", payload: { actual_cost_lines: [500,500,500] }, as: FinanceOps }
          assert:
            - "VendorEngagement.${eng_id}.charge_basis == FINAL"
            - "VendorEngagement.${eng_id}.client_charge_cents == 1650"
            - "The RECONCILED Expense for engagement ${eng_id} has estimated_cents == 1098, actual_cents == 1650, variance_cents == 552"
            - "Provisional (1098) != Final (1650)"

      - name: satisfaction_lifetime_vs_current_standing
        grounds:
          - calculations.membership_satisfaction
          - entities.Membership.fields.satisfaction_score
          - entities.SatisfactionRating.fields.sequence_no
        distinguishing_aspect: |
          lifetime_average (mean over ALL 4 ratings = 3.50) diverges from current_standing
          (mean over the most recent CURRENT_STANDING_WINDOW=3 by sequence_no DESC = 3.00);
          this is satisfaction scoring on Membership — a different entity domain than the
          engagement cost instance.
        test_recipe:
          setup:
            - "ACTIVE member + ACTIVE STANDARD membership"
            - "Four ERRAND requests each fulfilled and rated in order with scores 5, 3, 2, 4 (sequence_no 1..4)"
          setup_api_calls:
            - { call: "POST /concierge/members", payload: { full_name: "B", email: "b@x.com" }, as: AccountManager, captures: { m_id: "$.data.id" } }
            - { call: "POST /concierge/members/${m_id}/activate", payload: {}, as: AccountManager, captures: { m_v: "$.data.version" } }
            - { call: "POST /concierge/retainer-plans", payload: { name: "Std", monthly_retainer_cents: 100000, included_hours: 5, overage_rate_cents_per_hour: 6000, default_markup_pct: 0.10, max_pass_through_cents: 40000 }, as: AccountManager, captures: { plan_id: "$.data.id" } }
            - { call: "POST /concierge/members/${m_id}/memberships", payload: { plan_id: "${plan_id}", vip_tier: "STANDARD", expected_member_version: "${m_v}" }, as: AccountManager, captures: { ms_id: "$.data.id" } }
            - { call: "POST /concierge/service-requests", payload: { membership_id: "${ms_id}", category: "ERRAND", title: "r1" }, as: Member, as_user_id: "${m_id}", captures: { sr1: "$.data.id" } }
            - { call: "POST /concierge/service-requests/${sr1}/accept", payload: { scheduled_start: "2026-03-02T09:00:00Z", scheduled_end: "2026-03-02T10:00:00Z" }, as: ConciergeAgent }
            - { call: "POST /concierge/service-requests/${sr1}/fulfill", payload: {}, as: ConciergeAgent }
            - { call: "POST /concierge/service-requests/${sr1}/ratings", payload: { score: 5 }, as: Member, as_user_id: "${m_id}" }
            - { call: "POST /concierge/service-requests", payload: { membership_id: "${ms_id}", category: "ERRAND", title: "r2" }, as: Member, as_user_id: "${m_id}", captures: { sr2: "$.data.id" } }
            - { call: "POST /concierge/service-requests/${sr2}/accept", payload: { scheduled_start: "2026-03-02T09:00:00Z", scheduled_end: "2026-03-02T10:00:00Z" }, as: ConciergeAgent }
            - { call: "POST /concierge/service-requests/${sr2}/fulfill", payload: {}, as: ConciergeAgent }
            - { call: "POST /concierge/service-requests/${sr2}/ratings", payload: { score: 3 }, as: Member, as_user_id: "${m_id}" }
            - { call: "POST /concierge/service-requests", payload: { membership_id: "${ms_id}", category: "ERRAND", title: "r3" }, as: Member, as_user_id: "${m_id}", captures: { sr3: "$.data.id" } }
            - { call: "POST /concierge/service-requests/${sr3}/accept", payload: { scheduled_start: "2026-03-02T09:00:00Z", scheduled_end: "2026-03-02T10:00:00Z" }, as: ConciergeAgent }
            - { call: "POST /concierge/service-requests/${sr3}/fulfill", payload: {}, as: ConciergeAgent }
            - { call: "POST /concierge/service-requests/${sr3}/ratings", payload: { score: 2 }, as: Member, as_user_id: "${m_id}" }
            - { call: "POST /concierge/service-requests", payload: { membership_id: "${ms_id}", category: "ERRAND", title: "r4" }, as: Member, as_user_id: "${m_id}", captures: { sr4: "$.data.id" } }
            - { call: "POST /concierge/service-requests/${sr4}/accept", payload: { scheduled_start: "2026-03-02T09:00:00Z", scheduled_end: "2026-03-02T10:00:00Z" }, as: ConciergeAgent }
            - { call: "POST /concierge/service-requests/${sr4}/fulfill", payload: {}, as: ConciergeAgent }
            - { call: "POST /concierge/service-requests/${sr4}/ratings", payload: { score: 4 }, as: Member, as_user_id: "${m_id}" }
          trigger:
            - { call: "GET /concierge/memberships/${ms_id}/satisfaction", payload: {}, as: AccountManager }
          assert:
            - "GET /memberships/${ms_id}/satisfaction returns rating_count == 4"
            - "lifetime_average == 3.50"
            - "current_standing == 3.00"
            - "Membership.${ms_id}.satisfaction_score == 3.00"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: overage_tiered_nonlinear_charge
        grounds:
          - calculations.overage_charge
          - entities.BillingCycle.fields.overage_charge_cents
          - entities.Membership.fields.vip_tier
        distinguishing_aspect: |
          Mode (a): non-linear formula over >=3 inputs (consumed_minutes, included_minutes,
          vip_tier multiplier, base rate) with max() then a tier-multiplier selection then
          ceil — GOLD*0.90 gives effective 7200 c/hr and ceil(100*7200/60)=12000.
        test_recipe:
          setup:
            - "ACTIVE member + ACTIVE GOLD membership; plan included_hours=10 (600 min), overage_rate_cents_per_hour=8000"
            - "OPEN cycle 0; one BOOKING request; 700 minutes logged"
          setup_api_calls:
            - { call: "POST /concierge/members", payload: { full_name: "C", email: "c@x.com" }, as: AccountManager, captures: { m_id: "$.data.id" } }
            - { call: "POST /concierge/members/${m_id}/activate", payload: {}, as: AccountManager, captures: { m_v: "$.data.version" } }
            - { call: "POST /concierge/retainer-plans", payload: { name: "Gold", monthly_retainer_cents: 300000, included_hours: 10, overage_rate_cents_per_hour: 8000, default_markup_pct: 0.15, max_pass_through_cents: 50000 }, as: AccountManager, captures: { plan_id: "$.data.id" } }
            - { call: "POST /concierge/members/${m_id}/memberships", payload: { plan_id: "${plan_id}", vip_tier: "GOLD", expected_member_version: "${m_v}" }, as: AccountManager, captures: { ms_id: "$.data.id" } }
            - { call: "GET /concierge/billing-cycles?membership_id=${ms_id}", payload: {}, as: AccountManager, captures: { cyc0: "$.data[0].id" } }
            - { call: "POST /concierge/service-requests", payload: { membership_id: "${ms_id}", category: "BOOKING", title: "long task" }, as: Member, as_user_id: "${m_id}", captures: { sr_id: "$.data.id" } }
          trigger:
            - { call: "POST /concierge/service-requests/${sr_id}/time-entries", payload: { minutes: 700 }, as: ConciergeAgent }
          assert:
            - "BillingCycle.${cyc0}.consumed_minutes == 700"
            - "BillingCycle.${cyc0}.overage_minutes == 100"
            - "BillingCycle.${cyc0}.overage_charge_cents == 12000"
            - "Membership.${ms_id}.hour_bank_remaining_minutes == 0"

      - name: engagement_markup_rounding_order
        grounds:
          - calculations.engagement_client_charge
          - state_machines.VendorEngagement.PROPOSED_to_CONFIRMED
          - entities.VendorEngagement.fields.client_charge_cents
        distinguishing_aspect: |
          Mode (b): rounding order pinned. round-per-line-then-sum of [333,333,333] at
          markup 0.10 = 366+366+366 = 1098, whereas sum-then-round = round(999*1.10)=1099.
          The scaffold pins per-line rounding, so 1098 (not 1099).
        test_recipe:
          setup:
            - "ACTIVE member + membership; ACTIVE BOOKING vendor; BOOKING request"
            - "Engagement MARKUP markup_pct=0.10 estimated=[333,333,333]"
          setup_api_calls:
            - { call: "POST /concierge/members", payload: { full_name: "D", email: "d@x.com" }, as: AccountManager, captures: { m_id: "$.data.id" } }
            - { call: "POST /concierge/members/${m_id}/activate", payload: {}, as: AccountManager, captures: { m_v: "$.data.version" } }
            - { call: "POST /concierge/retainer-plans", payload: { name: "Std", monthly_retainer_cents: 100000, included_hours: 5, overage_rate_cents_per_hour: 6000, default_markup_pct: 0.10, max_pass_through_cents: 40000 }, as: AccountManager, captures: { plan_id: "$.data.id" } }
            - { call: "POST /concierge/members/${m_id}/memberships", payload: { plan_id: "${plan_id}", vip_tier: "STANDARD", expected_member_version: "${m_v}" }, as: AccountManager, captures: { ms_id: "$.data.id" } }
            - { call: "POST /concierge/vendors", payload: { name: "Bk", category: "BOOKING" }, as: AccountManager, captures: { v_id: "$.data.id" } }
            - { call: "POST /concierge/service-requests", payload: { membership_id: "${ms_id}", category: "BOOKING", title: "reserve" }, as: Member, as_user_id: "${m_id}", captures: { sr_id: "$.data.id" } }
            - { call: "POST /concierge/service-requests/${sr_id}/engagements", payload: { vendor_id: "${v_id}", billing_mode: "MARKUP", markup_pct: 0.10, estimated_cost_lines: [333,333,333], service_start: "2026-03-06T10:00:00Z", service_end: "2026-03-06T11:00:00Z" }, as: ConciergeAgent, captures: { eng_id: "$.data.id" } }
          trigger:
            - { call: "POST /concierge/vendor-engagements/${eng_id}/confirm", payload: {}, as: ConciergeAgent }
          assert:
            - "VendorEngagement.${eng_id}.client_charge_cents == 1098"
            - "VendorEngagement.${eng_id}.client_charge_cents != 1099"
            - "VendorEngagement.${eng_id}.charge_basis == PROVISIONAL"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: service_request_hold_resume_cycle
        grounds:
          - state_machines.ServiceRequest.IN_PROGRESS_to_ON_HOLD
          - state_machines.ServiceRequest.ON_HOLD_to_IN_PROGRESS
        distinguishing_aspect: |
          ServiceRequest is cyclic: IN_PROGRESS -> ON_HOLD -> IN_PROGRESS -> ON_HOLD; the
          request re-enters IN_PROGRESS after a hold, which a linear pipeline cannot express.
        test_recipe:
          setup:
            - "ACTIVE member + membership; one request accepted into IN_PROGRESS"
          setup_api_calls:
            - { call: "POST /concierge/members", payload: { full_name: "E", email: "e@x.com" }, as: AccountManager, captures: { m_id: "$.data.id" } }
            - { call: "POST /concierge/members/${m_id}/activate", payload: {}, as: AccountManager, captures: { m_v: "$.data.version" } }
            - { call: "POST /concierge/retainer-plans", payload: { name: "Std", monthly_retainer_cents: 100000, included_hours: 5, overage_rate_cents_per_hour: 6000, default_markup_pct: 0.10, max_pass_through_cents: 40000 }, as: AccountManager, captures: { plan_id: "$.data.id" } }
            - { call: "POST /concierge/members/${m_id}/memberships", payload: { plan_id: "${plan_id}", vip_tier: "STANDARD", expected_member_version: "${m_v}" }, as: AccountManager, captures: { ms_id: "$.data.id" } }
            - { call: "POST /concierge/service-requests", payload: { membership_id: "${ms_id}", category: "ERRAND", title: "task" }, as: Member, as_user_id: "${m_id}", captures: { sr_id: "$.data.id" } }
            - { call: "POST /concierge/service-requests/${sr_id}/accept", payload: { scheduled_start: "2026-03-02T09:00:00Z", scheduled_end: "2026-03-02T10:00:00Z" }, as: ConciergeAgent }
          trigger:
            - { call: "POST /concierge/service-requests/${sr_id}/hold", payload: {}, as: ConciergeAgent }
            - { call: "POST /concierge/service-requests/${sr_id}/resume", payload: {}, as: ConciergeAgent }
            - { call: "POST /concierge/service-requests/${sr_id}/hold", payload: {}, as: ConciergeAgent }
          assert:
            - "After the first hold, ServiceRequest.${sr_id}.status == ON_HOLD"
            - "After resume, ServiceRequest.${sr_id}.status == IN_PROGRESS (cycle re-entry)"
            - "After the second hold, ServiceRequest.${sr_id}.status == ON_HOLD"

      - name: expense_dispute_resolve_cycle
        grounds:
          - state_machines.Expense.RECONCILED_to_DISPUTED
          - state_machines.Expense.DISPUTED_to_RECONCILED
        distinguishing_aspect: |
          Expense is cyclic: RECONCILED -> DISPUTED -> RECONCILED -> DISPUTED; a different
          entity than ServiceRequest, satisfying the two-distinct-entity requirement.
        test_recipe:
          setup:
            - "ACTIVE member + membership; ACTIVE BOOKING vendor; BOOKING request"
            - "Engagement CONFIRMED then RECONCILED producing a RECONCILED Expense"
          setup_api_calls:
            - { call: "POST /concierge/members", payload: { full_name: "F", email: "f@x.com" }, as: AccountManager, captures: { m_id: "$.data.id" } }
            - { call: "POST /concierge/members/${m_id}/activate", payload: {}, as: AccountManager, captures: { m_v: "$.data.version" } }
            - { call: "POST /concierge/retainer-plans", payload: { name: "Std", monthly_retainer_cents: 100000, included_hours: 5, overage_rate_cents_per_hour: 6000, default_markup_pct: 0.10, max_pass_through_cents: 40000 }, as: AccountManager, captures: { plan_id: "$.data.id" } }
            - { call: "POST /concierge/members/${m_id}/memberships", payload: { plan_id: "${plan_id}", vip_tier: "STANDARD", expected_member_version: "${m_v}" }, as: AccountManager, captures: { ms_id: "$.data.id" } }
            - { call: "POST /concierge/vendors", payload: { name: "Bk", category: "BOOKING" }, as: AccountManager, captures: { v_id: "$.data.id" } }
            - { call: "POST /concierge/service-requests", payload: { membership_id: "${ms_id}", category: "BOOKING", title: "reserve" }, as: Member, as_user_id: "${m_id}", captures: { sr_id: "$.data.id" } }
            - { call: "POST /concierge/service-requests/${sr_id}/engagements", payload: { vendor_id: "${v_id}", billing_mode: "MARKUP", markup_pct: 0.10, estimated_cost_lines: [1000], service_start: "2026-03-06T10:00:00Z", service_end: "2026-03-06T11:00:00Z" }, as: ConciergeAgent, captures: { eng_id: "$.data.id" } }
            - { call: "POST /concierge/vendor-engagements/${eng_id}/confirm", payload: {}, as: ConciergeAgent }
            - { call: "POST /concierge/vendor-engagements/${eng_id}/reconcile", payload: { actual_cost_lines: [1000] }, as: FinanceOps }
            - { call: "GET /concierge/expenses?vendor_engagement_id=${eng_id}", payload: {}, as: FinanceOps, captures: { exp_id: "$.data[0].id" } }
          trigger:
            - { call: "POST /concierge/expenses/${exp_id}/dispute", payload: {}, as: FinanceOps }
            - { call: "POST /concierge/expenses/${exp_id}/resolve", payload: {}, as: FinanceOps }
            - { call: "POST /concierge/expenses/${exp_id}/dispute", payload: {}, as: FinanceOps }
          assert:
            - "After the first dispute, Expense.${exp_id}.status == DISPUTED"
            - "After resolve, Expense.${exp_id}.status == RECONCILED (cycle re-entry)"
            - "After the second dispute, Expense.${exp_id}.status == DISPUTED"

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: time_entry_debit_ledger_cascade
        grounds:
          - state_machines.TimeEntry.FINALIZED_to_REVERSED
          - calculations.overage_charge
          - calculations.membership_outstanding_balance
          - entities.Member.fields.lifetime_billed_cents
        distinguishing_aspect: |
          Depth-3 chain from POST time-entries: TimeEntry -> BillingCycle.consumed/overage
          (link1) -> Membership.outstanding_balance_cents (link2) -> Member.lifetime_billed_cents
          (link3); each link is caused by the prior link, not by the original call.
        test_recipe:
          setup:
            - "ACTIVE member + ACTIVE GOLD membership; plan included_hours=10, overage_rate 8000; OPEN cycle 0; one request"
          setup_api_calls:
            - { call: "POST /concierge/members", payload: { full_name: "G", email: "g@x.com" }, as: AccountManager, captures: { m_id: "$.data.id" } }
            - { call: "POST /concierge/members/${m_id}/activate", payload: {}, as: AccountManager, captures: { m_v: "$.data.version" } }
            - { call: "POST /concierge/retainer-plans", payload: { name: "Gold", monthly_retainer_cents: 300000, included_hours: 10, overage_rate_cents_per_hour: 8000, default_markup_pct: 0.15, max_pass_through_cents: 50000 }, as: AccountManager, captures: { plan_id: "$.data.id" } }
            - { call: "POST /concierge/members/${m_id}/memberships", payload: { plan_id: "${plan_id}", vip_tier: "GOLD", expected_member_version: "${m_v}" }, as: AccountManager, captures: { ms_id: "$.data.id" } }
            - { call: "GET /concierge/billing-cycles?membership_id=${ms_id}", payload: {}, as: AccountManager, captures: { cyc0: "$.data[0].id" } }
            - { call: "POST /concierge/service-requests", payload: { membership_id: "${ms_id}", category: "ERRAND", title: "task" }, as: Member, as_user_id: "${m_id}", captures: { sr_id: "$.data.id" } }
          trigger:
            - { call: "POST /concierge/service-requests/${sr_id}/time-entries", payload: { minutes: 700 }, as: ConciergeAgent }
          assert:
            - "BillingCycle.${cyc0}.consumed_minutes == 700 (link1)"
            - "Membership.${ms_id}.outstanding_balance_cents == 12000 (link2, overage only)"
            - "Member.${m_id}.lifetime_billed_cents == 12000 (link3)"

      - name: engagement_reconcile_expense_cascade
        grounds:
          - state_machines.VendorEngagement.CONFIRMED_to_RECONCILED
          - entities.Expense.fields.actual_cents
          - calculations.membership_outstanding_balance
        distinguishing_aspect: |
          Depth-2 chain from POST reconcile (a different trigger than time-entries):
          VendorEngagement -> Expense.actual_cents (link1) -> Membership.outstanding_balance_cents
          (link2). Estimated [1000] provisional 1100; actual [2000] final 2200.
        test_recipe:
          setup:
            - "ACTIVE member + membership; ACTIVE BOOKING vendor; BOOKING request; engagement CONFIRMED (provisional 1100)"
          setup_api_calls:
            - { call: "POST /concierge/members", payload: { full_name: "H", email: "h@x.com" }, as: AccountManager, captures: { m_id: "$.data.id" } }
            - { call: "POST /concierge/members/${m_id}/activate", payload: {}, as: AccountManager, captures: { m_v: "$.data.version" } }
            - { call: "POST /concierge/retainer-plans", payload: { name: "Std", monthly_retainer_cents: 100000, included_hours: 5, overage_rate_cents_per_hour: 6000, default_markup_pct: 0.10, max_pass_through_cents: 40000 }, as: AccountManager, captures: { plan_id: "$.data.id" } }
            - { call: "POST /concierge/members/${m_id}/memberships", payload: { plan_id: "${plan_id}", vip_tier: "STANDARD", expected_member_version: "${m_v}" }, as: AccountManager, captures: { ms_id: "$.data.id" } }
            - { call: "POST /concierge/vendors", payload: { name: "Bk", category: "BOOKING" }, as: AccountManager, captures: { v_id: "$.data.id" } }
            - { call: "POST /concierge/service-requests", payload: { membership_id: "${ms_id}", category: "BOOKING", title: "reserve" }, as: Member, as_user_id: "${m_id}", captures: { sr_id: "$.data.id" } }
            - { call: "POST /concierge/service-requests/${sr_id}/engagements", payload: { vendor_id: "${v_id}", billing_mode: "MARKUP", markup_pct: 0.10, estimated_cost_lines: [1000], service_start: "2026-03-06T10:00:00Z", service_end: "2026-03-06T11:00:00Z" }, as: ConciergeAgent, captures: { eng_id: "$.data.id" } }
            - { call: "POST /concierge/vendor-engagements/${eng_id}/confirm", payload: {}, as: ConciergeAgent }
          trigger:
            - { call: "POST /concierge/vendor-engagements/${eng_id}/reconcile", payload: { actual_cost_lines: [2000] }, as: FinanceOps }
          assert:
            - "The Expense for engagement ${eng_id} has actual_cents == 2200 and estimated_cents == 1100 (link1)"
            - "Membership.${ms_id}.outstanding_balance_cents == 2200 (link2)"

  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: membership_state_beats_category_eligibility
        grounds:
          - validations[priority=10]
          - validations[priority=11]
        distinguishing_aspect: |
          A PAUSED membership (state, ERR_MEMBERSHIP_NOT_ACTIVE, pri 10) and a STANDARD tier
          requesting TRAVEL (business_constraint, ERR_CATEGORY_NOT_ELIGIBLE, pri 11) both fail;
          the lower priority number wins -> ERR_MEMBERSHIP_NOT_ACTIVE. Pair: state vs business_constraint.
        test_recipe:
          setup:
            - "ACTIVE member + STANDARD membership that is then PAUSED"
          setup_api_calls:
            - { call: "POST /concierge/members", payload: { full_name: "I", email: "i@x.com" }, as: AccountManager, captures: { m_id: "$.data.id" } }
            - { call: "POST /concierge/members/${m_id}/activate", payload: {}, as: AccountManager, captures: { m_v: "$.data.version" } }
            - { call: "POST /concierge/retainer-plans", payload: { name: "Std", monthly_retainer_cents: 100000, included_hours: 5, overage_rate_cents_per_hour: 6000, default_markup_pct: 0.10, max_pass_through_cents: 40000 }, as: AccountManager, captures: { plan_id: "$.data.id" } }
            - { call: "POST /concierge/members/${m_id}/memberships", payload: { plan_id: "${plan_id}", vip_tier: "STANDARD", expected_member_version: "${m_v}" }, as: AccountManager, captures: { ms_id: "$.data.id" } }
            - { call: "POST /concierge/memberships/${ms_id}/pause", payload: {}, as: AccountManager }
          trigger:
            - { call: "POST /concierge/service-requests", payload: { membership_id: "${ms_id}", category: "TRAVEL", title: "flight" }, as: Member, as_user_id: "${m_id}", captures: { err: "$.data.error_id" } }
          assert:
            - "HTTP 409"
            - "response error_id == ERR_MEMBERSHIP_NOT_ACTIVE (not ERR_CATEGORY_NOT_ELIGIBLE)"

      - name: vendor_referential_beats_passthrough_fiscal
        grounds:
          - validations[priority=17]
          - validations[priority=19]
        distinguishing_aspect: |
          Vendor category mismatch (business_referential, ERR_VENDOR_CATEGORY_MISMATCH, pri 17)
          and a pass-through line 999999 > max_pass_through 50000 (business_fiscal,
          ERR_PASS_THROUGH_LIMIT_EXCEEDED, pri 19) both fail; pri 17 wins. Pair: business_referential
          vs business_fiscal — a different category pair than the state/business_constraint instance.
        test_recipe:
          setup:
            - "ACTIVE member + GOLD membership; a BOOKING request; an ACTIVE ERRAND vendor (mismatch)"
          setup_api_calls:
            - { call: "POST /concierge/members", payload: { full_name: "J", email: "j@x.com" }, as: AccountManager, captures: { m_id: "$.data.id" } }
            - { call: "POST /concierge/members/${m_id}/activate", payload: {}, as: AccountManager, captures: { m_v: "$.data.version" } }
            - { call: "POST /concierge/retainer-plans", payload: { name: "Gold", monthly_retainer_cents: 300000, included_hours: 10, overage_rate_cents_per_hour: 8000, default_markup_pct: 0.15, max_pass_through_cents: 50000 }, as: AccountManager, captures: { plan_id: "$.data.id" } }
            - { call: "POST /concierge/members/${m_id}/memberships", payload: { plan_id: "${plan_id}", vip_tier: "GOLD", expected_member_version: "${m_v}" }, as: AccountManager, captures: { ms_id: "$.data.id" } }
            - { call: "POST /concierge/vendors", payload: { name: "Errands", category: "ERRAND" }, as: AccountManager, captures: { v_id: "$.data.id" } }
            - { call: "POST /concierge/service-requests", payload: { membership_id: "${ms_id}", category: "BOOKING", title: "reserve" }, as: Member, as_user_id: "${m_id}", captures: { sr_id: "$.data.id" } }
          trigger:
            - { call: "POST /concierge/service-requests/${sr_id}/engagements", payload: { vendor_id: "${v_id}", billing_mode: "PASS_THROUGH", estimated_cost_lines: [999999], service_start: "2026-03-06T10:00:00Z", service_end: "2026-03-06T11:00:00Z" }, as: ConciergeAgent, captures: { err: "$.data.error_id" } }
          assert:
            - "HTTP 422"
            - "response error_id == ERR_VENDOR_CATEGORY_MISMATCH (not ERR_PASS_THROUGH_LIMIT_EXCEEDED)"

  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: overage_boundary_at_included_minutes
        grounds:
          - calculations.overage_charge
          - entities.BillingCycle.fields.overage_minutes
        distinguishing_aspect: |
          Numeric threshold on minutes: consumed == included (600) yields overage_minutes 0
          and overage_charge_cents 0; one more minute (601) would produce the first overage.
          Metric: hour-bank minutes, reached through POST time-entries.
        test_recipe:
          setup:
            - "ACTIVE member + GOLD membership; plan included_hours=10 (600 min); OPEN cycle 0; one request"
          setup_api_calls:
            - { call: "POST /concierge/members", payload: { full_name: "K", email: "k@x.com" }, as: AccountManager, captures: { m_id: "$.data.id" } }
            - { call: "POST /concierge/members/${m_id}/activate", payload: {}, as: AccountManager, captures: { m_v: "$.data.version" } }
            - { call: "POST /concierge/retainer-plans", payload: { name: "Gold", monthly_retainer_cents: 300000, included_hours: 10, overage_rate_cents_per_hour: 8000, default_markup_pct: 0.15, max_pass_through_cents: 50000 }, as: AccountManager, captures: { plan_id: "$.data.id" } }
            - { call: "POST /concierge/members/${m_id}/memberships", payload: { plan_id: "${plan_id}", vip_tier: "GOLD", expected_member_version: "${m_v}" }, as: AccountManager, captures: { ms_id: "$.data.id" } }
            - { call: "GET /concierge/billing-cycles?membership_id=${ms_id}", payload: {}, as: AccountManager, captures: { cyc0: "$.data[0].id" } }
            - { call: "POST /concierge/service-requests", payload: { membership_id: "${ms_id}", category: "ERRAND", title: "task" }, as: Member, as_user_id: "${m_id}", captures: { sr_id: "$.data.id" } }
          trigger:
            - { call: "POST /concierge/service-requests/${sr_id}/time-entries", payload: { minutes: 600 }, as: ConciergeAgent }
          assert:
            - "BillingCycle.${cyc0}.consumed_minutes == 600"
            - "BillingCycle.${cyc0}.overage_minutes == 0"
            - "BillingCycle.${cyc0}.overage_charge_cents == 0"
            - "Membership.${ms_id}.hour_bank_remaining_minutes == 0"

      - name: satisfaction_empty_set_returns_null
        grounds:
          - calculations.membership_satisfaction
          - entities.Membership.fields.satisfaction_score
        distinguishing_aspect: |
          Empty-collection edge on a different metric/endpoint: a membership with zero
          SatisfactionRating rows yields rating_count 0 and null averages via
          GET /memberships/{id}/satisfaction.
        test_recipe:
          setup:
            - "ACTIVE member + ACTIVE membership with no ratings"
          setup_api_calls:
            - { call: "POST /concierge/members", payload: { full_name: "L", email: "l@x.com" }, as: AccountManager, captures: { m_id: "$.data.id" } }
            - { call: "POST /concierge/members/${m_id}/activate", payload: {}, as: AccountManager, captures: { m_v: "$.data.version" } }
            - { call: "POST /concierge/retainer-plans", payload: { name: "Std", monthly_retainer_cents: 100000, included_hours: 5, overage_rate_cents_per_hour: 6000, default_markup_pct: 0.10, max_pass_through_cents: 40000 }, as: AccountManager, captures: { plan_id: "$.data.id" } }
            - { call: "POST /concierge/members/${m_id}/memberships", payload: { plan_id: "${plan_id}", vip_tier: "STANDARD", expected_member_version: "${m_v}" }, as: AccountManager, captures: { ms_id: "$.data.id" } }
          trigger:
            - { call: "GET /concierge/memberships/${ms_id}/satisfaction", payload: {}, as: AccountManager }
          assert:
            - "rating_count == 0"
            - "lifetime_average == null"
            - "current_standing == null"
            - "Membership.${ms_id}.satisfaction_score == null"

  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: request_intake_requires_membership_active
        grounds:
          - validations[priority=10]
          - entities.Membership.fields.status
          - state_machines.Membership.ACTIVE_to_PAUSED
        distinguishing_aspect: |
          ServiceRequest intake is gated by Membership.status: a PAUSED membership rejects
          intake with ERR_MEMBERSHIP_NOT_ACTIVE. Entity pair: ServiceRequest -> Membership.
        test_recipe:
          setup:
            - "ACTIVE member + STANDARD membership then PAUSED; category ERRAND (eligible for any tier, isolating the membership dependency)"
          setup_api_calls:
