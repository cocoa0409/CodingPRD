              as: Instructor
              as_user_id: "${cand_id}"
            - call: "POST /aha/course-sessions/${c_s1_id}/complete"
              payload: {}
              as: Instructor
              as_user_id: "${cand_id}"
            - call: "POST /aha/course-sessions"
              payload: { training_center_id: "${center_id}", site_id: "${site_id}", primary_instructor_id: "${cand_id}", guidelines_version_id: "${gv_id}", course_type: "BLS_PROVIDER", delivery_format: "CLASSROOM", start_at: "2026-10-11T14:00:00Z", end_at: "2026-10-11T18:00:00Z", capacity: 6, manikin_count: 2, aed_trainer_count: 1, assisting_instructor_count: 0 }
