              as: CommissioningAgent
              captures: { hall_v1: $.data.version }
            - call: "POST /commissioning-packages"
              payload: { hall_id: "${hall_id}", level: "L1", title: "L1 documentation review", target_load_kw: 5.00, expected_hall_version: "${hall_v1}" }
              as: CommissioningAgent
