      - name: the_four_hop_objection_chain_is_verified_end_to_end
        claim_type: cascading_side_effects
        grounds:
          - state_machines.Petition.transitions.OBJECTIONS_PENDING_to_RERUN_DIRECTED
          - complexity_profile.complexity_layers.cascading_side_effects
        excluded_because:
          difficulty_instance: transitive_cascade / objection_sustained_four_hop_cascade
          rationale: "The named \u00a71.8 instance walks all four hops of the deepest chain in the domain (objection SUSTAINED -> round SET_ASIDE -> petition RERUN_DIRECTED -> accepted list SUPERSEDED and approved messages RERUN_BLACKOUT) and asserts each intermediate hop, which is precisely the layer's N-level end-to-end claim."

      - name: re_verifying_after_the_last_ruling_switches_the_denominator_variant
        claim_type: dual_variant_calculation
        grounds:
          - calculations.showing_of_interest_ratio
          - entities.Petition.fields.showing_headcount_basis
          - state_machines.Petition.transitions.SOI_VERIFIED_to_SOI_VERIFIED
          - constants.SHOWING_OF_INTEREST_THRESHOLD
        distinguishing_aspect: |
          The variant switch is observed inside one case file rather than across two: with QC still PENDING the
          ratio must use the AS_PETITIONED denominator 102 (34.31), and re-verifying the identical card counts
          once QC is ruled EXCLUDED must use the AS_RULED denominator 90 (38.89). The selection then
          oscillates: reconsidering MAINT returns that row to PENDING and the next verification falls back to
          the petitioned denominator 102, while ruling MAINT EXCLUDED moves the AS_RULED denominator to 60
          (58.33). Four verifications on identical card counts therefore yield 34.31, 38.89, 34.31 and 58.33 -
          and the intervening rulings must not silently re-run the calculation on their own.
        test_recipe:
          setup:
            - "petition 07-RC-340704 with PROD 60, MAINT 30 and QC 12 all scored TRADITIONAL"
            - "PROD and MAINT ruled INCLUDED, QC left PENDING, 45 cards submitted with 10 defective"
