    - errors[ERR_STALE_FACILITY_VERSION]
    distinguishing_aspect: 'concurrency_rules entry 1: a publisher holding the version read before an intervening signage attestation bumped Facility.version is rejected with ERR_STALE_FACILITY_VERSION (412); re-reading the current version and retrying succeeds.'
    test_recipe:
      setup:
