# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Task: task_3330_electric_arc_furnace_mini_mill_production_scrap
#
# Nine §0.5 difficulty rules, two instances each. Every grounds ref resolves
# into SCAFFOLD.yaml §1.1–§1.7; every test_recipe drives empty-DB → target
# state using only §1.5 endpoints. All formula-derived asserts are literals
# computed from the pinned inputs.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: settlement_amount_indexed_fifo_vs_flat
        grounds:
          - calculations.settlement_amount
          - state_machines.ProcurementContract.OPEN_to_CLOSED
          - endpoints.POST_/mills/{millId}/procurement-contracts/{contractId}/close
        distinguishing_aspect: |
          INDEXED contract settlement consumes lots oldest-first at each lot's
          receipt-month index price (chronological FIFO variant); the FIXED
          variant on the same tonnage would charge one flat price for every
          settled ton. This instance's entity domain is ProcurementContract
          settlement — distinct from the Order pricing instance below.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-10T00:00:00Z. One ENERGY mill."
            - "SurchargeIndex SHREDDED 2026-08 = 39000, SHREDDED 2026-09 = 41000 (both PUBLISHED)."
            - "INDEXED contract C (SHREDDED, committed 100t) with lots: 2026-08-05 30t, 2026-08-20 40t, 2026-09-02 20t — all dry (moisture 0), chemistry benign."
            - "received_tons = 90 >= 0.80 * 100, so close is permitted."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-10T00:00:00Z" }
              as: PlantManager
            - call: "POST /mills"
              payload: { name: "Gallatin Energy Mill", division: "ENERGY", furnace_capacity_tons: 150, caster_rate_tph: 80 }
              as: PlantManager
              captures: { mill_id: $.data.id }
            - call: "POST /mills/${mill_id}/surcharge-indices"
              payload: { grade_category: "SHREDDED", effective_month: "2026-08", price_per_ton_cents: 39000 }
              as: PlantManager
            - call: "POST /mills/${mill_id}/surcharge-indices"
              payload: { grade_category: "SHREDDED", effective_month: "2026-09", price_per_ton_cents: 41000 }
              as: PlantManager
            - call: "POST /mills/${mill_id}/procurement-contracts"
              payload: { supplier_name: "River Metals Recycling", grade_category: "SHREDDED", contract_type: "INDEXED", committed_tons: 100 }
              as: ProcurementOfficer
              captures: { contract_id: $.data.id }
            - call: "POST /mills/${mill_id}/procurement-contracts/${contract_id}/scrap-lots"
              payload: { received_on: "2026-08-05", tons_received: 30, moisture_pct: 0.0, cu_pct: 0.001, mn_pct: 0.004 }
              as: ProcurementOfficer
            - call: "POST /mills/${mill_id}/procurement-contracts/${contract_id}/scrap-lots"
              payload: { received_on: "2026-08-20", tons_received: 40, moisture_pct: 0.0, cu_pct: 0.001, mn_pct: 0.004 }
              as: ProcurementOfficer
            - call: "POST /mills/${mill_id}/procurement-contracts/${contract_id}/scrap-lots"
              payload: { received_on: "2026-09-02", tons_received: 20, moisture_pct: 0.0, cu_pct: 0.001, mn_pct: 0.004 }
              as: ProcurementOfficer
          trigger:
            - call: "POST /mills/${mill_id}/procurement-contracts/${contract_id}/close"
              payload: {}
              as: ProcurementOfficer
          assert:
            - "ProcurementContract.${contract_id}.status == CLOSED"
            - "ProcurementContract.${contract_id}.settlement_tons == 90"
            - "ProcurementContract.${contract_id}.settlement_amount_cents == 3550000 (30*39000 + 40*39000 + 20*41000, per-lot rounding is exact here)"
            - "ProcurementContract.${contract_id}.settlement_amount_cents != 3510000 (the flat 90*39000 the FIXED variant would produce at the cheapest month)"

      - name: product_price_contract_month_vs_current_month
        grounds:
          - calculations.product_price
          - state_machines.Order.QUOTED_to_CONFIRMED
          - state_machines.Order.ALLOCATED_to_INVOICED
          - endpoints.POST_/mills/{millId}/customer-accounts/{accountId}/orders/{orderId}/confirm
        distinguishing_aspect: |
          CONTRACT pricing resolves the surcharge at the order's
          fulfillment_month and never re-prices; SPOT pricing resolves at the
          logical-clock month of the call. Same order fields, different month
          selection. This instance's entity domain is Order pricing — distinct
          from contract settlement above.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-10T00:00:00Z. One CONSTRUCTION mill."
            - "SurchargeIndex SHREDDED 2026-09 = 38000, SHREDDED 2026-10 = 40000."
            - "Grade G1 (product_form BILLET -> SHREDDED surcharge category)."
            - "Two accounts: CONTRA (CONTRACT) and SPOTCO (SPOT); one order each: 20t BILLET, fulfillment_month 2026-10, base 25000."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-10T00:00:00Z" }
              as: PlantManager
            - call: "POST /mills"
              payload: { name: "Crawfordsville Bar Mill", division: "CONSTRUCTION", furnace_capacity_tons: 150, caster_rate_tph: 80 }
              as: PlantManager
              captures: { mill_id: $.data.id }
            - call: "POST /mills/${mill_id}/surcharge-indices"
              payload: { grade_category: "SHREDDED", effective_month: "2026-09", price_per_ton_cents: 38000 }
              as: PlantManager
            - call: "POST /mills/${mill_id}/surcharge-indices"
              payload: { grade_category: "SHREDDED", effective_month: "2026-10", price_per_ton_cents: 40000 }
              as: PlantManager
            - call: "POST /mills/${mill_id}/grades"
              payload: { grade_code: "GR40", product_form: "BILLET", grade_group: "GROUP_A", certification_class: "STANDARD", cu_max_pct: 0.004, mn_min_pct: 0.002, mn_max_pct: 0.012, requires_energy_certified: false }
              as: Metallurgist
              captures: { grade_id: $.data.id }
            - call: "POST /mills/${mill_id}/customer-accounts"
              payload: { name: "Contract Builders Inc", market: "CONSTRUCTION", pricing_mode: "CONTRACT" }
              as: AccountManager
              captures: { acct_contract: $.data.id }
            - call: "POST /mills/${mill_id}/customer-accounts"
              payload: { name: "Spot Fabricators LLC", market: "CONSTRUCTION", pricing_mode: "SPOT" }
              as: AccountManager
              captures: { acct_spot: $.data.id }
            - call: "POST /mills/${mill_id}/customer-accounts/${acct_contract}/orders"
              payload: { product_family: "REBAR", grade_id: "${grade_id}", tons: 20, fulfillment_month: "2026-10", base_price_cents_per_ton: 25000 }
              as: AccountManager
              captures: { ord_contract: $.data.id, ord_contract_v: $.data.version }
            - call: "POST /mills/${mill_id}/customer-accounts/${acct_spot}/orders"
              payload: { product_family: "REBAR", grade_id: "${grade_id}", tons: 20, fulfillment_month: "2026-10", base_price_cents_per_ton: 25000 }
              as: AccountManager
              captures: { ord_spot: $.data.id, ord_spot_v: $.data.version }
          trigger:
            - call: "POST /mills/${mill_id}/customer-accounts/${acct_contract}/orders/${ord_contract}/confirm"
              payload: { expected_order_version: "${ord_contract_v}" }
              as: AccountManager
            - call: "POST /mills/${mill_id}/customer-accounts/${acct_spot}/orders/${ord_spot}/confirm"
              payload: { expected_order_version: "${ord_spot_v}" }
              as: AccountManager
          assert:
            - "Order.${ord_contract}.computed_price_cents == 1260000 ((25000 + 40000) * 20 — fulfillment-month 2026-10 index)"
            - "Order.${ord_contract}.price_basis == CONTRACT_MONTH_INDEX"
            - "Order.${ord_spot}.computed_price_cents == 1260000 ((25000 + 38000) * 20 — current-month 2026-09 index at confirm)"
            - "Order.${ord_spot}.price_basis == CURRENT_MONTH_INDEX"
            - "the variant divergence is in the month selection, visible at re-price: a SPOT order re-priced in 2026-10 resolves 40000 while the CONTRACT order's 2026-10 price is frozen at confirm — the two variants pin different months for identical order data"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:

      - name: charge_cost_round_per_line_then_sum
        grounds:
          - calculations.charge_cost
          - endpoints.POST_/mills/{millId}/heats/{heatId}/charges
          - endpoints.POST_/mills/{millId}/heats/{heatId}/tap
        distinguishing_aspect: |
          Mode (b) nested rounding: line_cost_cents is rounded per line and the
          heat total is the sum of rounded lines; the pinned order (round-then-
          sum) is load-bearing because fractional tonnages make sum-then-round
          produce different cents.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-10T00:00:00Z. One CONSTRUCTION mill; one SHREDDED FIXED contract priced 39001 with a 10t dry lot; chemistry benign."
            - "Grade G1 (BILLET, cu_max 0.004, mn_min 0.002); heat H1 planned_tap_at 2026-09-15T12:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-10T00:00:00Z" }
              as: PlantManager
            - call: "POST /mills"
              payload: { name: "Hertford Bar Mill", division: "CONSTRUCTION", furnace_capacity_tons: 150, caster_rate_tph: 80 }
              as: PlantManager
              captures: { mill_id: $.data.id }
            - call: "POST /mills/${mill_id}/procurement-contracts"
              payload: { supplier_name: "Coastal Scrap Co", grade_category: "SHREDDED", contract_type: "FIXED", contract_price_cents: 39001, committed_tons: 50 }
              as: ProcurementOfficer
              captures: { contract_a: $.data.id }
            - call: "POST /mills/${mill_id}/procurement-contracts/${contract_a}/scrap-lots"
              payload: { received_on: "2026-09-03", tons_received: 10, moisture_pct: 0.0, cu_pct: 0.001, mn_pct: 0.004 }
              as: ProcurementOfficer
              captures: { lot_1: $.data.id }
            - call: "POST /mills/${mill_id}/grades"
              payload: { grade_code: "GR40", product_form: "BILLET", grade_group: "GROUP_A", certification_class: "STANDARD", cu_max_pct: 0.004, mn_min_pct: 0.002, mn_max_pct: 0.012, requires_energy_certified: false }
              as: Metallurgist
              captures: { grade_id: $.data.id }
            - call: "POST /mills/${mill_id}/heats"
              payload: { heat_number: "H-1001", grade_id: "${grade_id}", target_tap_weight_tons: 2, planned_tap_at: "2026-09-15T12:00:00Z" }
              as: MillOperator
              captures: { heat_id: $.data.id }
          trigger:
            - call: "POST /mills/${mill_id}/heats/${heat_id}/charges"
              payload: { scrap_lot_id: "${lot_1}", tons: 0.667 }
              as: MillOperator
              captures: { line_1: $.data.id }
            - call: "POST /mills/${mill_id}/heats/${heat_id}/charges"
              payload: { scrap_lot_id: "${lot_1}", tons: 0.667 }
              as: MillOperator
              captures: { line_2: $.data.id }
          assert:
            - "HeatChargeLine.${line_1}.line_cost_cents == 26014 (round_half_up(39001 * 0.667) = round_half_up(26013.667))"
            - "HeatChargeLine.${line_2}.line_cost_cents == 26014 (identical second draw, same per-line rounding)"
            - "the pinned round-per-line-then-sum total is 52028; the forbidden sum-then-round order gives round_half_up(2 * 39001 * 0.667) = round_half_up(52027.334) == 52027 — a one-cent divergence that pins the rounding order"

      - name: product_price_tiered_branching_by_mode_and_month
        grounds:
          - calculations.product_price
          - calculations.settlement_amount
          - state_machines.Order.ALLOCATED_to_INVOICED
        distinguishing_aspect: |
          Mode (a) conditional-branch combinatorics: the price formula branches
          on pricing_mode (CONTRACT vs SPOT), branch-specific month selection
          (fulfillment_month vs clock month), and the product_form -> surcharge
          category mapping (BILLET→SHREDDED, BLOOM→BUSHLING, SLAB→HMS) — a
          >=3-input non-linear selection, distinct from the rounding mode above.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-10T00:00:00Z. One AUTOMOTIVE mill."
            - "Indices: SHREDDED 2026-09 = 38000, SHREDDED 2026-10 = 40000; BUSHLING 2026-09 = 42000, BUSHLING 2026-10 = 41000."
            - "Grades: BIL (BILLET), BLM (BLOOM). SPOT account SP with two orders: O1 BILLET 20t fulfillment 2026-10; O2 BLOOM 10t fulfillment 2026-10."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-10T00:00:00Z" }
              as: PlantManager
            - call: "POST /mills"
              payload: { name: "Decatur Sheet Mill", division: "AUTOMOTIVE", furnace_capacity_tons: 150, caster_rate_tph: 80 }
              as: PlantManager
              captures: { mill_id: $.data.id }
            - call: "POST /mills/${mill_id}/surcharge-indices"
              payload: { grade_category: "SHREDDED", effective_month: "2026-09", price_per_ton_cents: 38000 }
              as: PlantManager
            - call: "POST /mills/${mill_id}/surcharge-indices"
              payload: { grade_category: "SHREDDED", effective_month: "2026-10", price_per_ton_cents: 40000 }
              as: PlantManager
            - call: "POST /mills/${mill_id}/surcharge-indices"
              payload: { grade_category: "BUSHLING", effective_month: "2026-09", price_per_ton_cents: 42000 }
              as: PlantManager
            - call: "POST /mills/${mill_id}/surcharge-indices"
              payload: { grade_category: "BUSHLING", effective_month: "2026-10", price_per_ton_cents: 41000 }
              as: PlantManager
            - call: "POST /mills/${mill_id}/grades"
              payload: { grade_code: "BIL-50", product_form: "BILLET", grade_group: "GROUP_A", certification_class: "STANDARD", cu_max_pct: 0.004, mn_min_pct: 0.002, mn_max_pct: 0.012, requires_energy_certified: false }
              as: Metallurgist
              captures: { grade_bil: $.data.id }
            - call: "POST /mills/${mill_id}/grades"
              payload: { grade_code: "BLM-60", product_form: "BLOOM", grade_group: "GROUP_B", certification_class: "STANDARD", cu_max_pct: 0.004, mn_min_pct: 0.002, mn_max_pct: 0.012, requires_energy_certified: false }
              as: Metallurgist
              captures: { grade_blm: $.data.id }
            - call: "POST /mills/${mill_id}/customer-accounts"
              payload: { name: "Spot Auto Stamping", market: "AUTOMOTIVE", pricing_mode: "SPOT" }
              as: AccountManager
              captures: { acct_sp: $.data.id }
            - call: "POST /mills/${mill_id}/customer-accounts/${acct_sp}/orders"
              payload: { product_family: "REBAR", grade_id: "${grade_bil}", tons: 20, fulfillment_month: "2026-10", base_price_cents_per_ton: 25000 }
              as: AccountManager
              captures: { ord_1: $.data.id, ord_1_v: $.data.version }
            - call: "POST /mills/${mill_id}/customer-accounts/${acct_sp}/orders"
              payload: { product_family: "BEAM", grade_id: "${grade_blm}", tons: 10, fulfillment_month: "2026-10", base_price_cents_per_ton: 25000 }
              as: AccountManager
              captures: { ord_2: $.data.id, ord_2_v: $.data.version }
          trigger:
            - call: "POST /mills/${mill_id}/customer-accounts/${acct_sp}/orders/${ord_1}/confirm"
              payload: { expected_order_version: "${ord_1_v}" }
              as: AccountManager
            - call: "POST /mills/${mill_id}/customer-accounts/${acct_sp}/orders/${ord_2}/confirm"
              payload: { expected_order_version: "${ord_2_v}" }
              as: AccountManager
          assert:
            - "Order.${ord_1}.computed_price_cents == 1260000 ((25000 + 38000) * 20 — BILLET maps to SHREDDED at the current month 2026-09)"
            - "Order.${ord_2}.computed_price_cents == 670000 ((25000 + 42000) * 10 — BLOOM maps to BUSHLING at 2026-09)"
            - "the BLOOM order's surcharge category moved AGAINST the month gradient (BUSHLING fell in 2026-10 while SHREDDED rose), so the branch on product_form is observable independent of the month branch"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:

      - name: meltdown_sheet_revision_cycle
        grounds:
          - state_machines.MeltdownSheet
          - endpoints.POST_/mills/{millId}/heats/{heatId}/meltdown-sheets/{sheetId}/revise
        distinguishing_aspect: |
          Cyclic machine (RECORDED → REVISED → RECORDED → ... with revision_no
          accumulating per cycle) on the MeltdownSheet entity — distinct from
          the parallel-dimension machine on CustomerAccount.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-10T00:00:00Z. Mill, FIXED contract 39000, dry lot 50t, grade GR40 (cu_max 0.004, mn band 0.002..0.012)."
            - "Heat CHARGED (one 8t charge line applied); initial sheet recorded with out-of-band Mn (0.015 > mn_max)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-10T00:00:00Z" }
              as: PlantManager
            - call: "POST /mills"
              payload: { name: "Gallatin Energy Mill", division: "ENERGY", furnace_capacity_tons: 150, caster_rate_tph: 80 }
              as: PlantManager
              captures: { mill_id: $.data.id }
            - call: "POST /mills/${mill_id}/procurement-contracts"
              payload: { supplier_name: "River Metals Recycling", grade_category: "SHREDDED", contract_type: "FIXED", contract_price_cents: 39000, committed_tons: 100 }
              as: ProcurementOfficer
              captures: { contract_id: $.data.id }
            - call: "POST /mills/${mill_id}/procurement-contracts/${contract_id}/scrap-lots"
              payload: { received_on: "2026-09-03", tons_received: 50, moisture_pct: 0.0, cu_pct: 0.001, mn_pct: 0.004 }
              as: ProcurementOfficer
              captures: { lot_id: $.data.id }
            - call: "POST /mills/${mill_id}/grades"
              payload: { grade_code: "GR40", product_form: "BILLET", grade_group: "GROUP_A", certification_class: "STANDARD", cu_max_pct: 0.004, mn_min_pct: 0.002, mn_max_pct: 0.012, requires_energy_certified: false }
              as: Metallurgist
              captures: { grade_id: $.data.id }
            - call: "POST /mills/${mill_id}/heats"
              payload: { heat_number: "H-2001", grade_id: "${grade_id}", target_tap_weight_tons: 8, planned_tap_at: "2026-09-15T12:00:00Z" }
              as: MillOperator
              captures: { heat_id: $.data.id }
            - call: "POST /mills/${mill_id}/heats/${heat_id}/charges"
              payload: { scrap_lot_id: "${lot_id}", tons: 8 }
              as: MillOperator
            - call: "POST /mills/${mill_id}/heats/${heat_id}/meltdown-sheets"
              payload: { cu_pct: 0.002, mn_pct: 0.015 }
              as: Metallurgist
              captures: { sheet_id: $.data.id }
          trigger:
            - call: "POST /mills/${mill_id}/heats/${heat_id}/meltdown-sheets/${sheet_id}/revise"
              payload: { cu_pct: 0.002, mn_pct: 0.011 }
              as: Metallurgist
            - call: "POST /mills/${mill_id}/heats/${heat_id}/meltdown-sheets/${sheet_id}/revise"
              payload: { cu_pct: 0.002, mn_pct: 0.008 }
              as: Metallurgist
            - call: "POST /mills/${mill_id}/heats/${heat_id}/meltdown-sheets/${sheet_id}/confirm"
              payload: {}
              as: Metallurgist
          assert:
            - "after the first revise, MeltdownSheet.${sheet_id}.status == REVISED and revision_no == 2 and chem_ok == true (0.011 inside 0.002..0.012)"
            - "after the second revise, status returns to RECORDED and revision_no == 3 — the cycle loops rather than terminating"
            - "after confirm, MeltdownSheet.${sheet_id}.status == CONFIRMED"
            - "Heat.${heat_id}.status == MELTDOWN_LOCKED (cascade up from sheet confirm)"

      - name: customer_account_parallel_credit_and_priority_dimensions
        grounds:
          - state_machines.CustomerAccount
          - endpoints.PATCH_/mills/{millId}/customer-accounts/{accountId}
        distinguishing_aspect: |
          Parallel state dimensions on one entity (credit_status GOOD↔WATCH→
          BLOCKED, allocation_priority STANDARD↔STRATEGIC) that evolve
          independently — distinct from the MeltdownSheet cycle.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-10T00:00:00Z. One mill; one SPOT account created (GOOD / STANDARD)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-10T00:00:00Z" }
              as: PlantManager
            - call: "POST /mills"
              payload: { name: "Crawfordsville Bar Mill", division: "CONSTRUCTION", furnace_capacity_tons: 150, caster_rate_tph: 80 }
              as: PlantManager
              captures: { mill_id: $.data.id }
            - call: "POST /mills/${mill_id}/customer-accounts"
              payload: { name: "Midwest Erectors", market: "CONSTRUCTION", pricing_mode: "SPOT" }
              as: AccountManager
              captures: { acct_id: $.data.id }
          trigger:
            - call: "PATCH /mills/${mill_id}/customer-accounts/${acct_id}"
              payload: { credit_status: "WATCH" }
              as: AccountManager
            - call: "PATCH /mills/${mill_id}/customer-accounts/${acct_id}"
              payload: { allocation_priority: "STRATEGIC" }
              as: AccountManager
            - call: "PATCH /mills/${mill_id}/customer-accounts/${acct_id}"
              payload: { credit_status: "GOOD" }
              as: AccountManager
          assert:
            - "after PATCH 1, CustomerAccount.${acct_id}.credit_status == WATCH and allocation_priority == STANDARD (untouched)"
            - "after PATCH 2, allocation_priority == STRATEGIC while credit_status is still WATCH — dimensions evolve independently"
            - "after PATCH 3, credit_status == GOOD and allocation_priority == STRATEGIC (the priority dimension is not reset by the credit repair)"
            - "CustomerAccount.${acct_id}.version == 4 (creation + three mutations)"

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:

      - name: event_release_aborts_heat_restores_lot
        grounds:
          - state_machines.EnergyEvent.ACTIVE_to_RELEASED
          - state_machines.Heat.MELTDOWN_LOCKED_to_ABORTED
          - state_machines.ScrapLot.CONSUMED_to_RECEIVED
        distinguishing_aspect: |
          Depth-3 cascade: EnergyEvent release → non-waivered in-flight Heat
          aborts → its ScrapLots regain tonnage and revert status. Each link is
          caused by the previous link, not by the release call directly.
          Trigger: event release (distinct from the invoice cascade below).
        test_recipe:
          setup:
            - "Logical clock at 2026-09-10T00:00:00Z. Mill, FIXED contract 39000, lot L1 10t dry, grade GR40."
            - "Heat H1 charged 8t from L1 (lot PARTIALLY_CONSUMED, remaining 2) and meltdown-confirmed (heat MELTDOWN_LOCKED)."
            - "EnergyEvent EV (called 2026-09-10T12:00Z, released 2026-09-10T14:00Z) ACTIVATED; mill posture INTERRUPTED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-10T00:00:00Z" }
              as: PlantManager
            - call: "POST /mills"
              payload: { name: "Gallatin Energy Mill", division: "ENERGY", furnace_capacity_tons: 150, caster_rate_tph: 80 }
              as: PlantManager
              captures: { mill_id: $.data.id }
            - call: "POST /mills/${mill_id}/procurement-contracts"
              payload: { supplier_name: "River Metals Recycling", grade_category: "SHREDDED", contract_type: "FIXED", contract_price_cents: 39000, committed_tons: 100 }
              as: ProcurementOfficer
