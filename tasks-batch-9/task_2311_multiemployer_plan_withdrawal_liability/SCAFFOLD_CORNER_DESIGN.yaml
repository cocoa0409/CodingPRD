            - "Every response carries the standard envelope with data null on the error path and a non-null request_id."

      - name: body_foreign_keys_are_resolved_before_state_and_return_not_found
        claim_type: Error triggerable
        grounds:
          - "validations[priority=5]"
          - "errors[ERR_ASSESSMENT_NOT_FOUND]"
          - "errors[ERR_STALE_EMPLOYER_VERSION]"
          - "errors[ERR_STALE_ASSESSMENT_VERSION]"
        distinguishing_aspect: |
          Body foreign keys resolve at priority 5, ahead of ownership (6), optimistic
          concurrency (7) and every state check (8+). The two OCC endpoints are the sharp
          cases: a request naming an unknown parent AND carrying a version token must
          answer 404, not 412, because there is no row whose version could be compared.
          The multi-key case pins that resolution follows the order the keys are declared
          in the endpoint's input list, not alphabetical or hash order.
