# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Timeshare & Fractional Ownership — Expert
# Breadth probe over §1.1–§1.7 claims NOT covered by the nine §1.8 difficulty rules.
# Canonical resort config matches SCAFFOLD_DIFFICULTY_DESIGN.yaml.
# =============================================================================

scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: create_resort_returns_201_with_defaults_applied
        claim_type: Defaults
        grounds:
          - entities.Resort.fields.rescission_days
          - entities.Resort.fields.borrow_surcharge_pct
          - entities.Resort.fields.current_use_year
        distinguishing_aspect: "Omitting rescission_days/borrow_surcharge_pct/delinquency_grace_days/foreclosure_threshold_periods applies defaults 7 / 0.10 / 30 / 2; current_use_year defaults to 2026."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /resorts"
              payload: { name: "Defaults R", points_per_week_base: 1000, annual_fee_cents_per_1000_points: 20000 }
              as: ResortManager
              captures: { resort_id: $.data.id }
          assert:
            - "HTTP 201; Resort.${resort_id}.rescission_days == 7"
            - "Resort.${resort_id}.borrow_surcharge_pct == 0.10"
            - "Resort.${resort_id}.delinquency_grace_days == 30"
            - "Resort.${resort_id}.foreclosure_threshold_periods == 2"
            - "Resort.${resort_id}.current_use_year == 2026; version == 1"

      - name: create_owner_missing_required_field_rejected
        claim_type: Required Fields
        grounds:
          - entities.Owner.fields.full_name
          - validations[priority=5]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "POST /owners without full_name returns ERR_INVALID_REQUEST (400); no Owner created."
        test_recipe:
          setup: ["Resort R exists."]
          setup_api_calls:
            - call: "POST /resorts"
              payload: { name: "R", points_per_week_base: 1000, annual_fee_cents_per_1000_points: 20000 }
              as: ResortManager
              captures: { resort_id: $.data.id }
          trigger:
            - call: "POST /owners"
              payload: { resort_id: "${resort_id}", email: "noname@x.com" }
              as: ResortManager
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 400 with error_id == ERR_INVALID_REQUEST"

      - name: inventory_unit_points_value_computed_ignores_input
        claim_type: Computed Fields
        grounds:
          - entities.InventoryUnit.fields.points_value
          - calculations.reservation_points_cost
        distinguishing_aspect: "InventoryUnit.points_value is computed = round_half_up(base*season_mult); a SILVER unit on base 1000 yields 600 regardless of any client-supplied value."
        test_recipe:
          setup: ["Resort R base 1000."]
          setup_api_calls:
            - call: "POST /resorts"
              payload: { name: "R", points_per_week_base: 1000, annual_fee_cents_per_1000_points: 20000 }
              as: ResortManager
              captures: { resort_id: $.data.id }
          trigger:
            - call: "POST /inventory-units"
              payload: { resort_id: "${resort_id}", unit_label: "Villa Silver", week_number: 5, season: "SILVER" }
              as: ResortManager
              captures: { unit_id: $.data.id, pv: $.data.points_value }
          assert:
            - "InventoryUnit.${unit_id}.points_value == 600 (round_half_up(1000*0.60))"
            - "InventoryUnit.${unit_id}.status == AVAILABLE"

      - name: inventory_unit_invalid_week_number_rejected
        claim_type: Type Constraints
        grounds:
          - entities.InventoryUnit.fields.week_number
          - validations[priority=5]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "week_number outside 1..52 (e.g. 60) returns ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["Resort R exists."]
          setup_api_calls:
            - call: "POST /resorts"
              payload: { name: "R", points_per_week_base: 1000, annual_fee_cents_per_1000_points: 20000 }
              as: ResortManager
              captures: { resort_id: $.data.id }
          trigger:
            - call: "POST /inventory-units"
              payload: { resort_id: "${resort_id}", unit_label: "Bad Week", week_number: 60, season: "GOLD" }
              as: ResortManager
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 400 with error_id == ERR_INVALID_REQUEST"

      - name: get_owner_not_found_returns_404
        claim_type: Not Found
        grounds:
          - validations[priority=4]
          - errors[ERR_NOT_FOUND]
        distinguishing_aspect: "GET /owners/{nonexistent-uuid} returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Resort R exists; owner id is a random UUID."]
          setup_api_calls:
            - call: "POST /resorts"
              payload: { name: "R", points_per_week_base: 1000, annual_fee_cents_per_1000_points: 20000 }
              as: ResortManager
          trigger:
            - call: "GET /owners/00000000-0000-4000-8000-000000000000"
              as: ResortManager
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 404 with error_id == ERR_NOT_FOUND"

      - name: contract_create_cross_resort_owner_rejected
        claim_type: Parent Relationships
        grounds:
          - entities.Contract.fields.owner_id
          - validations[priority=6]
          - errors[ERR_CROSS_RESORT_REFERENCE]
        distinguishing_aspect: "Creating a Contract whose owner_id belongs to a different resort returns ERR_CROSS_RESORT_REFERENCE (409)."
        test_recipe:
          setup: ["Resort R1 and Resort R2; Owner O2 belongs to R2; contract created under R1 references O2."]
          setup_api_calls:
            - call: "POST /resorts"
              payload: { name: "R1", points_per_week_base: 1000, annual_fee_cents_per_1000_points: 20000 }
              as: ResortManager
              captures: { resort1: $.data.id }
            - call: "POST /resorts"
              payload: { name: "R2", points_per_week_base: 1000, annual_fee_cents_per_1000_points: 20000 }
              as: ResortManager
              captures: { resort2: $.data.id }
            - call: "POST /owners"
              payload: { resort_id: "${resort2}", full_name: "O2", email: "o2@x.com" }
              as: ResortManager
              captures: { owner2: $.data.id }
          trigger:
            - call: "POST /contracts"
              payload: { resort_id: "${resort1}", owner_id: "${owner2}", ownership_type: "DEEDED", inventory_model: "POINTS", annual_points_allotment: 5000 }
              as: ResortManager
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409 with error_id == ERR_CROSS_RESORT_REFERENCE"

      - name: owner_open_balance_computed_from_issued_invoices
        claim_type: Computed Fields
        grounds:
          - entities.Owner.fields.open_balance_cents
          - calculations.owner_status
        distinguishing_aspect: "Owner.open_balance_cents = sum of amount_due_cents over ISSUED/DELINQUENT invoices; one ISSUED 200000-cent invoice -> open_balance_cents == 200000; status GOOD_STANDING until overdue."
        test_recipe:
          setup: ["Resort R; DEEDED POINTS contract C ACTIVE allotment 10000; ANNUAL invoice ISSUED amount_cents=200000 (not yet delinquent)."]
          setup_api_calls:
            - call: "POST /resorts"
              payload: { name: "R", points_per_week_base: 1000, annual_fee_cents_per_1000_points: 20000 }
              as: ResortManager
              captures: { resort_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { resort_id: "${resort_id}", to_iso8601: "2026-01-01T00:00:00Z" }
              as: ResortManager
            - call: "POST /owners"
              payload: { resort_id: "${resort_id}", full_name: "O1", email: "o1@x.com" }
              as: ResortManager
              captures: { owner_id: $.data.id }
            - call: "POST /contracts"
              payload: { resort_id: "${resort_id}", owner_id: "${owner_id}", ownership_type: "DEEDED", inventory_model: "POINTS", annual_points_allotment: 10000 }
              as: ResortManager
              captures: { contract_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { resort_id: "${resort_id}", to_iso8601: "2026-01-08T00:00:00Z" }
              as: ResortManager
            - call: "POST /contracts/${contract_id}/activate"
              payload: {}
              as: ResortManager
            - call: "POST /invoices"
              payload: { contract_id: "${contract_id}", source_type: "ANNUAL", use_year: 2026, due_date: "2026-02-01T00:00:00Z" }
              as: ResortManager
              captures: { invoice_id: $.data.id }
            - call: "POST /invoices/${invoice_id}/issue"
              payload: {}
              as: ResortManager
          trigger:
            - call: "GET /owners/${owner_id}"
              as: ResortManager
              captures: { bal: $.data.open_balance_cents, st: $.data.status }
          assert:
            - "Owner.${owner_id}.open_balance_cents == 200000"
            - "Owner.${owner_id}.status == GOOD_STANDING (invoice ISSUED, not yet DELINQUENT)"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: activate_before_rescission_window_elapsed_rejected
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.Contract.PENDING_RESCISSION_to_ACTIVE
          - validations[priority=8]
          - errors[ERR_RESCISSION_WINDOW_OPEN]
        distinguishing_aspect: "Activating a PENDING_RESCISSION contract while current_utc < signed_at + 7 days returns ERR_RESCISSION_WINDOW_OPEN (409)."
        test_recipe:
          setup: ["Resort R rescission_days 7; contract C created at clock 2026-01-01; clock still 2026-01-03 (< 2026-01-08)."]
          setup_api_calls:
            - call: "POST /resorts"
              payload: { name: "R", points_per_week_base: 1000, annual_fee_cents_per_1000_points: 20000, rescission_days: 7 }
              as: ResortManager
              captures: { resort_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { resort_id: "${resort_id}", to_iso8601: "2026-01-01T00:00:00Z" }
              as: ResortManager
            - call: "POST /owners"
              payload: { resort_id: "${resort_id}", full_name: "O1", email: "o1@x.com" }
              as: ResortManager
              captures: { owner_id: $.data.id }
            - call: "POST /contracts"
              payload: { resort_id: "${resort_id}", owner_id: "${owner_id}", ownership_type: "DEEDED", inventory_model: "POINTS", annual_points_allotment: 5000 }
              as: ResortManager
              captures: { contract_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { resort_id: "${resort_id}", to_iso8601: "2026-01-03T00:00:00Z" }
              as: ResortManager
          trigger:
            - call: "POST /contracts/${contract_id}/activate"
              payload: {}
              as: ResortManager
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409 with error_id == ERR_RESCISSION_WINDOW_OPEN; Contract.${contract_id}.status remains PENDING_RESCISSION"

      - name: rescind_after_window_closed_rejected
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.Contract.PENDING_RESCISSION_to_RESCINDED
          - validations[priority=8]
          - errors[ERR_RESCISSION_WINDOW_CLOSED]
        distinguishing_aspect: "Rescinding a still-PENDING_RESCISSION contract after current_utc > signed_at + 7 days returns ERR_RESCISSION_WINDOW_CLOSED (409)."
        test_recipe:
          setup: ["Resort R rescission_days 7; contract C signed 2026-01-01, never activated; clock advanced to 2026-01-20."]
          setup_api_calls:
            - call: "POST /resorts"
              payload: { name: "R", points_per_week_base: 1000, annual_fee_cents_per_1000_points: 20000, rescission_days: 7 }
              as: ResortManager
              captures: { resort_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { resort_id: "${resort_id}", to_iso8601: "2026-01-01T00:00:00Z" }
              as: ResortManager
            - call: "POST /owners"
              payload: { resort_id: "${resort_id}", full_name: "O1", email: "o1@x.com" }
              as: ResortManager
              captures: { owner_id: $.data.id }
            - call: "POST /contracts"
              payload: { resort_id: "${resort_id}", owner_id: "${owner_id}", ownership_type: "DEEDED", inventory_model: "POINTS", annual_points_allotment: 5000 }
              as: ResortManager
              captures: { contract_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { resort_id: "${resort_id}", to_iso8601: "2026-01-20T00:00:00Z" }
              as: ResortManager
          trigger:
            - call: "POST /contracts/${contract_id}/rescind"
              payload: {}
              as: Owner
              as_user_id: "${owner_id}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409 with error_id == ERR_RESCISSION_WINDOW_CLOSED; Contract.${contract_id}.status remains PENDING_RESCISSION"

      - name: contract_rescind_within_window_writes_off_invoices
        claim_type: Side Effect Execution
        grounds:
          - state_machines.Contract.PENDING_RESCISSION_to_RESCINDED
          - state_machines.MaintenanceFeeInvoice.DRAFT_to_WRITTEN_OFF
          - entities.Contract.fields.status
        distinguishing_aspect: "Rescinding inside the window flips Contract to RESCINDED and cascades the contract's DRAFT invoices to WRITTEN_OFF."
        test_recipe:
          setup: ["Resort R; PENDING_RESCISSION contract C with a DRAFT ANNUAL invoice; clock at 2026-01-03 (window open for rescind)."]
          setup_api_calls:
            - call: "POST /resorts"
              payload: { name: "R", points_per_week_base: 1000, annual_fee_cents_per_1000_points: 20000, rescission_days: 7 }
              as: ResortManager
              captures: { resort_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { resort_id: "${resort_id}", to_iso8601: "2026-01-01T00:00:00Z" }
              as: ResortManager
            - call: "POST /owners"
              payload: { resort_id: "${resort_id}", full_name: "O1", email: "o1@x.com" }
              as: ResortManager
              captures: { owner_id: $.data.id }
            - call: "POST /contracts"
              payload: { resort_id: "${resort_id}", owner_id: "${owner_id}", ownership_type: "DEEDED", inventory_model: "POINTS", annual_points_allotment: 10000 }
              as: ResortManager
              captures: { contract_id: $.data.id }
            - call: "POST /invoices"
              payload: { contract_id: "${contract_id}", source_type: "ANNUAL", use_year: 2026, due_date: "2026-02-01T00:00:00Z" }
              as: ResortManager
              captures: { invoice_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { resort_id: "${resort_id}", to_iso8601: "2026-01-03T00:00:00Z" }
              as: ResortManager
          trigger:
            - call: "POST /contracts/${contract_id}/rescind"
              payload: {}
              as: Owner
              as_user_id: "${owner_id}"
          assert:
            - "Contract.${contract_id}.status == RESCINDED"
            - "MaintenanceFeeInvoice.${invoice_id}.status == WRITTEN_OFF"

      - name: confirm_reservation_invalid_from_completed_rejected
        claim_type: Invalid Transitions
        grounds:
          - state_machines.Reservation.HELD_to_CONFIRMED
          - validations[priority=7]
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "Confirming a reservation already COMPLETED (terminal) returns ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["Resort R; DEEDED POINTS contract C ACTIVE allotment 5000; GOLD unit; reservation confirmed then completed."]
          setup_api_calls:
            - call: "POST /resorts"
              payload: { name: "R", points_per_week_base: 1000, annual_fee_cents_per_1000_points: 20000 }
              as: ResortManager
              captures: { resort_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { resort_id: "${resort_id}", to_iso8601: "2026-01-01T00:00:00Z" }
              as: ResortManager
            - call: "POST /owners"
              payload: { resort_id: "${resort_id}", full_name: "O1", email: "o1@x.com" }
              as: ResortManager
              captures: { owner_id: $.data.id }
            - call: "POST /inventory-units"
              payload: { resort_id: "${resort_id}", unit_label: "Villa Gold", week_number: 8, season: "GOLD" }
              as: ResortManager
              captures: { unit_id: $.data.id }
            - call: "POST /contracts"
              payload: { resort_id: "${resort_id}", owner_id: "${owner_id}", ownership_type: "DEEDED", inventory_model: "POINTS", annual_points_allotment: 5000 }
              as: ResortManager
              captures: { contract_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { resort_id: "${resort_id}", to_iso8601: "2026-01-08T00:00:00Z" }
              as: ResortManager
            - call: "POST /contracts/${contract_id}/activate"
              payload: {}
              as: ResortManager
            - call: "GET /points-accounts?contract_id=${contract_id}&use_year=2026"
              as: Owner
              as_user_id: "${owner_id}"
              captures: { acct_v: $.data.0.version }
            - call: "POST /reservations"
              payload: { contract_id: "${contract_id}", inventory_unit_id: "${unit_id}", use_year: 2026, expected_points_account_version: "${acct_v}" }
              as: Owner
              as_user_id: "${owner_id}"
              captures: { reservation_id: $.data.id }
            - call: "POST /reservations/${reservation_id}/confirm"
              payload: {}
              as: Owner
              as_user_id: "${owner_id}"
            - call: "POST /reservations/${reservation_id}/complete"
              payload: {}
              as: ResortManager
          trigger:
            - call: "POST /reservations/${reservation_id}/confirm"
              payload: {}
              as: Owner
              as_user_id: "${owner_id}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409 with error_id == ERR_INVALID_STATE; Reservation.${reservation_id}.status remains COMPLETED"

      - name: terminal_resale_complete_twice_rejected
        claim_type: Terminal State Lockdown
        grounds:
          - state_machines.ResaleTransfer.PENDING_RESCISSION_to_COMPLETED
          - validations[priority=7]
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "Completing an already-COMPLETED ResaleTransfer returns ERR_INVALID_STATE (409) — terminal state lockdown."
        test_recipe:
          setup: ["Resort R; ACTIVE contract C owner SELLER; buyer BUYER; ResaleTransfer T signed 2026-01-01, completed after window (clock 2026-01-20)."]
          setup_api_calls:
            - call: "POST /resorts"
              payload: { name: "R", points_per_week_base: 1000, annual_fee_cents_per_1000_points: 20000, rescission_days: 7 }
              as: ResortManager
              captures: { resort_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { resort_id: "${resort_id}", to_iso8601: "2026-01-01T00:00:00Z" }
              as: ResortManager
            - call: "POST /owners"
              payload: { resort_id: "${resort_id}", full_name: "Seller", email: "seller@x.com" }
              as: ResortManager
              captures: { seller_id: $.data.id }
            - call: "POST /owners"
              payload: { resort_id: "${resort_id}", full_name: "Buyer", email: "buyer@x.com" }
              as: ResortManager
              captures: { buyer_id: $.data.id }
            - call: "POST /contracts"
              payload: { resort_id: "${resort_id}", owner_id: "${seller_id}", ownership_type: "DEEDED", inventory_model: "POINTS", annual_points_allotment: 10000 }
              as: ResortManager
              captures: { contract_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { resort_id: "${resort_id}", to_iso8601: "2026-01-08T00:00:00Z" }
              as: ResortManager
            - call: "POST /contracts/${contract_id}/activate"
              payload: {}
              as: ResortManager
            - call: "POST /resale-transfers"
              payload: { source_contract_id: "${contract_id}", buyer_owner_id: "${buyer_id}", sale_price_cents: 5000000, transfer_use_year: 2026, transfer_day_of_year: 120 }
              as: ResaleAgent
              captures: { transfer_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { resort_id: "${resort_id}", to_iso8601: "2026-01-20T00:00:00Z" }
              as: ResortManager
            - call: "POST /resale-transfers/${transfer_id}/complete"
              payload: {}
              as: ResaleAgent
          trigger:
            - call: "POST /resale-transfers/${transfer_id}/complete"
              payload: {}
              as: ResaleAgent
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409 with error_id == ERR_INVALID_STATE; ResaleTransfer.${transfer_id}.status remains COMPLETED"

      - name: reservation_starts_in_held_initial_state
        claim_type: Initial State
        grounds:
          - entities.Reservation.fields.status
          - state_machines.Reservation.HELD_to_CONFIRMED
        distinguishing_aspect: "A newly created reservation starts in HELD with computed points_cost == 1000 (GOLD unit) and borrowed_points == 0; status is server-set."
        test_recipe:
          setup: ["Resort R; DEEDED POINTS contract C ACTIVE allotment 5000; GOLD unit."]
          setup_api_calls:
            - call: "POST /resorts"
              payload: { name: "R", points_per_week_base: 1000, annual_fee_cents_per_1000_points: 20000 }
              as: ResortManager
              captures: { resort_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { resort_id: "${resort_id}", to_iso8601: "2026-01-01T00:00:00Z" }
              as: ResortManager
            - call: "POST /owners"
              payload: { resort_id: "${resort_id}", full_name: "O1", email: "o1@x.com" }
              as: ResortManager
              captures: { owner_id: $.data.id }
            - call: "POST /inventory-units"
              payload: { resort_id: "${resort_id}", unit_label: "Villa Gold", week_number: 9, season: "GOLD" }
              as: ResortManager
              captures: { unit_id: $.data.id }
            - call: "POST /contracts"
              payload: { resort_id: "${resort_id}", owner_id: "${owner_id}", ownership_type: "DEEDED", inventory_model: "POINTS", annual_points_allotment: 5000 }
              as: ResortManager
              captures: { contract_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { resort_id: "${resort_id}", to_iso8601: "2026-01-08T00:00:00Z" }
              as: ResortManager
            - call: "POST /contracts/${contract_id}/activate"
              payload: {}
              as: ResortManager
            - call: "GET /points-accounts?contract_id=${contract_id}&use_year=2026"
              as: Owner
              as_user_id: "${owner_id}"
              captures: { acct_v: $.data.0.version }
          trigger:
            - call: "POST /reservations"
              payload: { contract_id: "${contract_id}", inventory_unit_id: "${unit_id}", use_year: 2026, expected_points_account_version: "${acct_v}" }
              as: Owner
              as_user_id: "${owner_id}"
              captures: { reservation_id: $.data.id, st: $.data.status, pc: $.data.points_cost }
          assert:
            - "HTTP 201; Reservation.${reservation_id}.status == HELD; points_cost == 1000; borrowed_points == 0"

      - name: mark_delinquent_during_grace_rejected
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.MaintenanceFeeInvoice.ISSUED_to_DELINQUENT
          - validations[priority=12]
          - errors[ERR_GRACE_PERIOD_ACTIVE]
        distinguishing_aspect: "mark-delinquent before due_date + 30 grace days returns ERR_GRACE_PERIOD_ACTIVE (409)."
        test_recipe:
          setup: ["Resort R grace 30; ANNUAL invoice ISSUED due 2026-02-01; clock at 2026-02-15 (within grace, 30 days not elapsed)."]
          setup_api_calls:
            - call: "POST /resorts"
