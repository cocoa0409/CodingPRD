  # ===========================================================================
  - section: endpoints
    instances:

      - name: region_computed_read_matches_an_independent_client_count
        claim_type: Computed read
        grounds:
          - endpoints.GET_/regions/{id}
          - entities.Region.fields.clients_in_pipeline
          - entities.Region.fields.occupancy_pct
        distinguishing_aspect: "The region read is a computed read: clients_in_pipeline equals an independent count of the region's non-CLOSED, non-REFERRED clients and occupancy_pct equals that count over agent_count times target_client_ratio — two derived fields that must agree with the child rows."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. One region with target_client_ratio 4.0, two lead agents, three clients, one of them closed."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /regions"
              payload: { name: "Puget Sound", service_area_codes: ["98101", "98102", "98103"], traditional_commission_pct: 0.025, target_client_ratio: 4.0 }
              as: PlatformAdmin
              captures: { region_id: $.data.id }
            - call: "POST /agents"
              payload: { region_id: "${region_id}", full_name: "Ada Lead", agent_kind: "LEAD", home_zip: "98101", base_salary_cents: 8000000 }
              as: PlatformAdmin
              captures: { agent_a: $.data.id }
            - call: "POST /agents"
              payload: { region_id: "${region_id}", full_name: "Ben Lead", agent_kind: "LEAD", home_zip: "98102", base_salary_cents: 7000000 }
              as: PlatformAdmin
            - call: "POST /clients"
              payload: { full_name: "First Buyer", email: "first@x.com", service_area_code: "98101", need_kind: "BUY" }
              as: OperationsCoordinator
              captures: { client_1: $.data.id }
            - call: "POST /clients/${client_1}/assign-agent"
              payload: {}
              as: OperationsCoordinator
            - call: "POST /clients/${client_1}/transactions"
              payload: {}
              as: TransactionCoordinator
              captures: { tx_1: $.data.id }
            - call: "POST /transactions/${tx_1}/coordination"
              payload: { coordination_status: "REVIEW", contract_price_cents: 70000000 }
              as: TransactionCoordinator
            - call: "POST /transactions/${tx_1}/close"
              payload: {}
              as: TransactionCoordinator
            - call: "POST /clients"
              payload: { full_name: "Second Buyer", email: "second@x.com", service_area_code: "98102", need_kind: "BUY" }
              as: OperationsCoordinator
              captures: { client_2: $.data.id }
