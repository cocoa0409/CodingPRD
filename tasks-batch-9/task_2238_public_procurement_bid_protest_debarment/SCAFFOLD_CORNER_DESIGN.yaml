              as_user_id: "U-ADMIN-1"
            - call: "POST /procurement/vendors"
              payload: { legal_name: "Fairhaven Utilities", tax_id: "100000060", contact_email: "v60@example.gov" }
              as: SystemAdmin
              as_user_id: "U-ADMIN-1"
              captures: { c_v60_id: $.data.id }
            - call: "POST /procurement/solicitations"
              payload:
                solicitation_number: "SOL-2238-C29"
                title: "Utility Pole Relocation"
                issuing_agency_code: "DOT"
                estimated_value_cents: 10000000
                original_bid_due_utc: "2026-08-27T00:00:00Z"
                original_question_deadline_utc: "2026-08-20T00:00:00Z"
                mandatory_requirements:
                  - { requirement_code: "REQ-POLE", description: "utility coordination plan", materiality: "MATERIAL", is_waivable: false }
              as: ProcurementOfficer
              as_user_id: "U-OFFICER-1"
              captures: { c_s29_id: $.data.id }
          trigger:
            - call: "POST /procurement/vendors"
              payload: { legal_name: "Fairhaven Utilities Holdings", tax_id: "100000060", contact_email: "v60b@example.gov" }
              as: SystemAdmin
              as_user_id: "U-ADMIN-1"
          assert:
            - "HTTP 409 with $.data.error_id == ERR_DUPLICATE_TAX_ID; GET /procurement/vendors?tax_id=100000060 still returns total_count 1 with id ${c_v60_id}"
            - "a POST /procurement/solicitations reusing solicitation_number SOL-2238-C29 returns HTTP 409 ERR_DUPLICATE_SOLICITATION_NUMBER"
            - "a POST /procurement/solicitations whose mandatory_requirements lists requirement_code REQ-TWICE twice returns HTTP 409 ERR_DUPLICATE_REQUIREMENT_CODE and creates no Solicitation row"
            - "a POST /procurement/solicitations/${c_s29_id}/addenda whose new_requirement_codes reintroduces REQ-POLE returns HTTP 409 ERR_DUPLICATE_REQUIREMENT_CODE and leaves addendum_count 0"

      - name: corner_vendor_acting_on_another_vendors_bid_is_rejected
        claim_type: Triggerability
        grounds:
          - validations[priority=8]
          - errors[ERR_VENDOR_IDENTITY_MISMATCH]
          - roles.Vendor
        distinguishing_aspect: "The Vendor role is entity_backed: X-User-ID must equal the body's vendor_id, so vendor A submitting a bid on behalf of vendor B gets HTTP 403 ERR_VENDOR_IDENTITY_MISMATCH — not ERR_FORBIDDEN_ROLE, since Vendor is a permitted role on the endpoint."
        test_recipe:
          setup:
            - "clock pinned to 2026-08-01T00:00:00Z; two Vendors; one ISSUED Solicitation"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
