        excluded_because:
          difficulty_instance: cross_entity_state_dependency / allocation_requires_active_license
          rationale: "ERR_LICENSE_NOT_ACTIVE is asserted as the failure path of the allocation-requires-active-license §1.8 instance."

      - name: error_equipment_not_registered_triggerable
        claim_type: violation_to_error
        grounds: ["errors[ERR_EQUIPMENT_NOT_REGISTERED]"]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / allocation_referential_beats_temporal
          rationale: "ERR_EQUIPMENT_NOT_REGISTERED is asserted as the winning error of the referential-vs-temporal §1.8 instance."

      - name: error_occasion_overlap_triggerable
        claim_type: violation_to_error
        grounds: ["errors[ERR_OCCASION_OVERLAP]"]
        excluded_because:
