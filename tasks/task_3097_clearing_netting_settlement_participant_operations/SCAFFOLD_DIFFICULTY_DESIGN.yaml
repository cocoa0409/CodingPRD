          assert:
            - "GET /clearing/participants/${p_va}/fund-components returns one row with component_amount_cents == 1000000 — the base multiplier of 10000 applied at exactly 2500 bps"
            - "PUT /clearing/securities/${sec_vol} with current_volatility_bps 2501, then a fresh net position re-opening the fund, then recompute yields component_amount_cents == 1500000"
            - "the two components differ by exactly 500000 cents, which is the observable discontinuity at the boundary"

      - name: zero_net_position_set_boundary_on_empty_window
        grounds:
          - validations[priority=15]
          - errors[ERR_EMPTY_NET_POSITION_SET]
          - state_machines.SettlementWindow.NETTED_to_SETTLED
          - calculations.multilateral_netting.input_set
        distinguishing_aspect: "The boundary is an empty-collection edge on a different resource: a window whose inclusion set is empty because its only trade has match_status ALLEGED yields zero net position rows, and the settle gate must reject with ERR_EMPTY_NET_POSITION_SET rather than settling vacuously."
        test_recipe:
