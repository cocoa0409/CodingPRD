              as: DesignEngineer
              as_user_id: "${eng_b_id}"
              payload: { action: APPROVE }
            - call: POST /production-lots
              as: ProductionSupervisor
              as_user_id: "${sup_a_id}"
              payload: { plant_id: "${plant_id}", cell_design_id: "${design_id}", lot_code: "LOT-A", quantity: 9 }
              captures: { lot_id: "$.data.id" }
            - call: POST /production-lots/${lot_id}/env-hold
              as: SafetyOfficer
              as_user_id: "${safe_a_id}"
              payload: { action: HOLD, hold_reason: OPERATOR_HOLD }
              captures: { hold_state: "$.data.env_hold_status" }
          trigger:
            - call: POST /production-lots/${lot_id}/env-hold
              as: SafetyOfficer
              as_user_id: "${safe_a_id}"
              payload: { action: HOLD, hold_reason: OPERATOR_HOLD }
              captures: { err_id: "$.data.error_id" }
          assert:
            - "The first HOLD answered env_hold_status == \"HELD\", hold_reason == \"OPERATOR_HOLD\", process_state still \"PLANNED\"."
            - "Trigger: HTTP 409; data.error_id == \"ERR_LOT_STATE_INVALID\"."
            - "GET /production-lots/${lot_id} answers env_hold_status == \"HELD\" and hold_reason == \"OPERATOR_HOLD\" - unchanged by the refused second hold."
            - "A following RELEASE_HOLD by ${safe_a_id} answers 200 with env_hold_status == \"CLEAR\" and hold_reason == null, proving the axis is still live."

      - name: assembly_parallel_axes_derive_certification_across_rework_generations
        claim_type: Side Effect Execution
        grounds:
          - state_machines.BatteryAssembly.torque_status
          - state_machines.BatteryAssembly.insulation_status
          - state_machines.BatteryAssembly.certification_status
        excluded_because:
          difficulty_instance: non_linear_state_machine / battery_assembly_parallel_axes_rework_generations
          rationale: "That instance drives both parallel axes through PENDING/PASS/FAIL, asserts the compound certification_status re-derivation at each step and replays it across rework generations up to the ERR_REWORK_LIMIT_REACHED cap."

      - name: quarantined_lot_retest_loop_respects_the_hard_cap
        claim_type: Valid Transition
        grounds:
          - state_machines.ProductionLot.process_state
          - errors[ERR_RETEST_LIMIT_REACHED]
        excluded_because:
          difficulty_instance: non_linear_state_machine / production_lot_quarantine_retest_cycle_with_hard_cap
          rationale: "That instance walks LOT_TESTING -> QUARANTINED -> LOT_TESTING twice, asserts the tightened plan on each pass and the 409 ERR_RETEST_LIMIT_REACHED on the third RETEST."

      - name: exposure_removal_cascades_into_plant_posture_and_lot_holds
        claim_type: Side Effect Execution
        grounds:
          - state_machines.Worker.removal_status
          - state_machines.Plant.compliance_posture
          - state_machines.ProductionLot.env_hold_status
        excluded_because:
          difficulty_instance: transitive_cascade / cascade_a_exposure_removal_freezes_plant_holds_lots_aborts_runs
          rationale: "That instance asserts every hop of CASCADE A: removal -> open_medical_removal_count -> posture FROZEN -> lot hold with hold_reason PLANT_FROZEN -> run abort with abort_reason ENV_HOLD_CASCADE."

      - name: failed_capacity_test_quarantines_the_lot_and_voids_scheduled_tests
        claim_type: Side Effect Execution
        grounds:
          - state_machines.CapacityTest.test_state
          - state_machines.BatteryAssembly.certification_status
          - state_machines.ProductionLot.process_state
        excluded_because:
          difficulty_instance: transitive_cascade / cascade_b_failed_capacity_test_quarantines_lot_revokes_assemblies_voids_tests
          rationale: "That instance asserts CASCADE B hop by hop: FAIL -> failed_test_count above acceptance_number -> lot QUARANTINED -> assemblies REVOKED -> sibling SCHEDULED tests VOIDED."

      - name: core_return_axis_walks_deposit_held_to_recycled
        claim_type: Valid Transition
        grounds:
          - state_machines.BatteryUnit.core_status
          - endpoints[POST /battery-units/{id}/core-return/transitions]
        excluded_because:
          difficulty_instance: compensating_invariant / invariant_c1_core_deposit_liability_closes_by_refund_or_by_forfeit
          rationale: "That instance drives DEPOSIT_HELD -> RETURN_OPEN -> IN_TRANSIT -> RECEIVED -> RECYCLED on one unit and -> REJECTED on another, asserting core_status plus the deposit ledger at every hop."

  # =====================================================================
  # SECTION 3 - CALCULATIONS (guide Table 3 + algorithm-type boundary rows)
