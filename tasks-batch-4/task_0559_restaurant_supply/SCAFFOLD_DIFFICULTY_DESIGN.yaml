        distinguishing_aspect: "Conserved quantity = credit cents: Account.outstanding_cents starts at 0, confirm adds the order total 2160c, cancel removes it, leaving outstanding_cents back at 0 and credit_available_cents restored — a monetary invariant distinct from the inventory-units invariant."
