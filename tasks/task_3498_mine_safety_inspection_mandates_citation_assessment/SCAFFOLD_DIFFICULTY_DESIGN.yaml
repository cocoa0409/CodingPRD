  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: penalty_points_tiered_multi_input_total
        grounds:
          - calculations.penalty_points
          - calculations.penalty_dollar_pipeline
        distinguishing_aspect: |
          Mode (a) — a seven-input formula with tiered-rate selection on THREE
          axes at once (persons_affected 3 lands in the 2..5 tier worth 5;
          operator tonnage 120000 lands in the 50000..499999 tier worth 5; S&S
          surcharge 15 applies conditionally): 25+15+20+5+15+0+5 = 90 points,
          converted through the marginal dollar tiers to exactly 2250000 cents.
        test_recipe:
          setup:
            - "Operator with annual_tonnage_tons 120000 (size tier 5); no prior citations (history tier 0)."
            - "SPOT inspection IN_PROGRESS at 2026-02-10T09:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-02-10T08:00:00Z" }
              as: MSHAAdmin
            - call: "POST /msha/operators"
              payload: { legal_name: "Big River Minerals", annual_tonnage_tons: 120000, home_district: "D-02" }
              as: MSHAAdmin
              captures: { op_id: $.data.id }
            - call: "POST /msha/mines"
              payload: { operator_id: "${op_id}", mine_name: "Big River No 1", mine_type: "SURFACE", activation_date: "2026-01-01" }
              as: MSHAAdmin
              captures: { m_id: $.data.id }
            - call: "POST /msha/inspectors"
              payload: { full_name: "R. Alvarez", badge_number: "INSP-100", district_code: "D-02", certification: "BOTH", conflicted_operator_ids: [] }
              as: MSHAAdmin
              captures: { i1: $.data.id }
            - call: "POST /msha/inspections"
              payload: { mine_id: "${m_id}", inspector_id: "${i1}", kind: "SPOT", planned_start_at: "2026-02-10T08:00:00Z", planned_end_at: "2026-02-10T17:00:00Z" }
              as: DistrictManager
              captures: { insp1: $.data.id }
            - call: "POST /msha/inspections/${insp1}/file-review"
              payload: {}
              as: Inspector
              as_user_id: "${i1}"
            - call: "POST /msha/inspections/${insp1}/start"
              payload: {}
              as: Inspector
              as_user_id: "${i1}"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-02-10T09:00:00Z" }
              as: MSHAAdmin
          trigger:
            - call: "POST /msha/citations"
              payload: { inspection_id: "${insp1}", mine_id: "${m_id}", standard_code: "30 CFR 56.9300", kind: "CITATION", negligence: "MODERATE", gravity_likelihood: "REASONABLY_LIKELY", gravity_severity: "SERIOUS", persons_affected: 3, significant_and_substantial: true, repeat_violation: false }
              as: Inspector
              as_user_id: "${i1}"
              captures: { cit1: $.data.id }
            - call: "GET /msha/citations/${cit1}/penalty-assessments"
              payload: {}
              as: DistrictManager
              captures: { asm1: "$.data[0].id" }
          assert:
            - "PenaltyAssessment.${asm1}.points_total == 90 (25+15+20+5+15+0+5)"
            - "PenaltyAssessment.${asm1}.proposed_penalty_cents == 2250000 (20*11250 + 40*22500 + 30*37500)"
            - "PenaltyAssessment.${asm1}.statutory_floor_applied == false"
            - "Citation.${cit1}.abatement_base_days == 5 and abatement_deadline == 2026-02-15T09:00:00Z (SERIOUS tier)"

      - name: repeat_multiplier_half_up_rounding_step
        grounds:
          - calculations.penalty_dollar_pipeline
        distinguishing_aspect: |
          Mode (b) — nested rounding where order and mode matter and the scaffold
          pins both: gross 168750c x 1.15 = 194062.50 exactly, round_half_up to
          194063 at the multiplier step; a truncate or half-even implementation
          stores 194062, a full cent different on a 15-point citation.
        test_recipe:
          setup:
            - "Operator 1000 tons (size tier 0); no prior citations."
            - "SPOT inspection IN_PROGRESS at 2026-02-10T09:00:00Z; citation with likelihood REASONABLY_LIKELY only (15 points) and repeat_violation true."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-02-10T08:00:00Z" }
              as: MSHAAdmin
            - call: "POST /msha/operators"
              payload: { legal_name: "Canyon Coal Co", annual_tonnage_tons: 1000, home_district: "D-11" }
              as: MSHAAdmin
              captures: { op_id: $.data.id }
            - call: "POST /msha/mines"
              payload: { operator_id: "${op_id}", mine_name: "Canyon No 6", mine_type: "UNDERGROUND", activation_date: "2026-01-01" }
              as: MSHAAdmin
              captures: { m_id: $.data.id }
            - call: "POST /msha/inspectors"
              payload: { full_name: "R. Alvarez", badge_number: "INSP-100", district_code: "D-11", certification: "BOTH", conflicted_operator_ids: [] }
              as: MSHAAdmin
              captures: { i1: $.data.id }
            - call: "POST /msha/inspections"
              payload: { mine_id: "${m_id}", inspector_id: "${i1}", kind: "SPOT", planned_start_at: "2026-02-10T08:00:00Z", planned_end_at: "2026-02-10T17:00:00Z" }
              as: DistrictManager
              captures: { insp1: $.data.id }
            - call: "POST /msha/inspections/${insp1}/file-review"
              payload: {}
              as: Inspector
              as_user_id: "${i1}"
            - call: "POST /msha/inspections/${insp1}/start"
              payload: {}
              as: Inspector
              as_user_id: "${i1}"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-02-10T09:00:00Z" }
              as: MSHAAdmin
          trigger:
            - call: "POST /msha/citations"
              payload: { inspection_id: "${insp1}", mine_id: "${m_id}", standard_code: "30 CFR 75.370", kind: "CITATION", negligence: "NONE", gravity_likelihood: "REASONABLY_LIKELY", gravity_severity: "NO_INJURY", persons_affected: 1, significant_and_substantial: false, repeat_violation: true }
              as: Inspector
              as_user_id: "${i1}"
              captures: { cit1: $.data.id }
            - call: "GET /msha/citations/${cit1}/penalty-assessments"
              payload: {}
              as: DistrictManager
              captures: { asm1: "$.data[0].id" }
          assert:
            - "PenaltyAssessment.${asm1}.points_total == 15"
            - "PenaltyAssessment.${asm1}.proposed_penalty_cents == 194063 (168750 x 1.15 = 194062.50, round_half_up; NOT 194062)"

      - name: quota_crediting_oldest_delinquent_first_order
        grounds:
          - calculations.inspection_quota_crediting
          - entities.InspectionCycle.fields.completed_inspections
        distinguishing_aspect: |
          Mode (c) — a circular-looking dependency with a pinned evaluation
          order: which cycle an inspection credits depends on cycle states, but
          crediting itself changes a cycle's state. The pinned rule (oldest
          DELINQUENT first, period_start ASC then created_at ASC) credits the
          2026-04-10 completion to DELINQUENT cycle 1 — curing it — even though
          the completion date falls inside OPEN cycle 2, which stays at 0.
        test_recipe:
          setup:
            - "UNDERGROUND mine activated 2026-01-01; cycle 1 [2026-01-01, 2026-03-31] closed DELINQUENT (no inspection); cycle 2 [2026-04-01, 2026-06-29] OPEN."
            - "All three required plan types APPROVED so the REGULAR completion gate passes."
            - "REGULAR inspection of cycle 2 completes at 2026-04-10T12:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-01-05T09:00:00Z" }
              as: MSHAAdmin
            - call: "POST /msha/operators"
              payload: { legal_name: "Canyon Coal Co", annual_tonnage_tons: 1000, home_district: "D-11" }
              as: MSHAAdmin
              captures: { op_id: $.data.id }
            - call: "POST /msha/mines"
              payload: { operator_id: "${op_id}", mine_name: "Canyon No 7", mine_type: "UNDERGROUND", activation_date: "2026-01-01" }
              as: MSHAAdmin
              captures: { m_id: $.data.id }
            - call: "POST /msha/mines/${m_id}/inspection-cycles"
              payload: { period_start: "2026-01-01", period_end: "2026-03-31" }
              as: MSHAAdmin
              captures: { cyc1: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-04-01T00:00:00Z" }
              as: MSHAAdmin
            - call: "POST /msha/inspection-cycles/${cyc1}/close"
              payload: {}
              as: MSHAAdmin
            - call: "POST /msha/mines/${m_id}/inspection-cycles"
              payload: { period_start: "2026-04-01", period_end: "2026-06-29" }
              as: MSHAAdmin
              captures: { cyc2: $.data.id }
            - call: "POST /msha/mines/${m_id}/mine-plans"
              payload: { plan_type: "VENTILATION", document_ref: "doc-vent-r1" }
              as: OperatorRep
              as_user_id: "${op_id}"
              captures: { plan_v: $.data.id }
            - call: "GET /msha/mines/${m_id}"
              payload: {}
              as: DistrictManager
              captures: { mv1: $.data.version }
            - call: "POST /msha/mine-plans/${plan_v}/approve"
              payload: { expected_mine_version: "${mv1}" }
              as: DistrictManager
            - call: "POST /msha/mines/${m_id}/mine-plans"
              payload: { plan_type: "ROOF_CONTROL", document_ref: "doc-roof-r1" }
              as: OperatorRep
              as_user_id: "${op_id}"
              captures: { plan_r: $.data.id }
            - call: "GET /msha/mines/${m_id}"
              payload: {}
