# =============================================================================
# §1.9 Scaffold Corner Design — Mystery Shopping & CX-Audit (Expert)
# Breadth probe over the claim-extraction-guide taxonomy. Every active instance's
# setup_api_calls drives empty-DB → precondition using only §1.5 endpoints.
# excluded_because stubs cite §1.8 instances by name.
# =============================================================================
scaffold_corner_design:

  # ---------------------------------------------------------------------------
  - section: entities
    instances:
      - name: create_shopper_minimal_required_fields_returns_201
        claim_type: Creation
        grounds: [entities.Shopper, endpoints]
        distinguishing_aspect: "POST /shoppers with full_name/email/home_lat/home_lng returns 201, status REGISTERED, reliability_score 100, certification_score 0."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /shoppers"
              payload: { full_name: "Cor Shop", email: "cor@x.test", home_lat: 40.0, home_lng: -74.0 }
              as: Anonymous
              captures: { sid: $.data.id, st: $.data.status, rel: $.data.reliability_score, cert: $.data.certification_score }
          assert:
            - "response code 201; Shopper.status == REGISTERED; reliability_score == 100; certification_score == 0; tax_id_on_file == false (default)"

      - name: create_shopper_missing_email_returns_invalid_request
        claim_type: Required Fields
        grounds: ["entities.Shopper.fields.email", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /shoppers omitting required email → ERR_INVALID_REQUEST (400); no shopper created."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /shoppers"
              payload: { full_name: "No Email", home_lat: 40.0, home_lng: -74.0 }
              as: Anonymous
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_REQUEST (400)"

      - name: get_shopper_nonexistent_returns_not_found
        claim_type: Not Found
        grounds: ["entities.Shopper", "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET /shoppers/{random-uuid} → ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB; an authenticated PlatformAdmin."]
          setup_api_calls: []
          trigger:
            - call: "GET /shoppers/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_NOT_FOUND (404)"

      - name: system_fields_minted_by_server_input_ignored
        claim_type: System Fields
        grounds: [entities.Shopper.fields.reliability_score]
        distinguishing_aspect: "Client-supplied reliability_score/status/id on POST /shoppers are ignored; server mints id and forces reliability_score 100, status REGISTERED."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /shoppers"
              payload: { full_name: "Ignore Me", email: "ig@x.test", home_lat: 40.0, home_lng: -74.0 }
              as: Anonymous
              captures: { rel: $.data.reliability_score, st: $.data.status }
          assert:
            - "reliability_score == 100 and status == REGISTERED regardless of any client-supplied values"

      - name: defaults_applied_tax_id_on_file_false
        claim_type: Defaults
        grounds: [entities.Shopper.fields.tax_id_on_file]
        distinguishing_aspect: "Omitting tax_id_on_file → default false."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /shoppers"
              payload: { full_name: "Def Shop", email: "def@x.test", home_lat: 40.0, home_lng: -74.0 }
              as: Anonymous
              captures: { tax: $.data.tax_id_on_file }
          assert:
            - "Shopper.tax_id_on_file == false (default)"

      - name: location_invalid_scenario_family_enum_rejected
        claim_type: Type Constraints
        grounds: ["entities.Location.fields.scenario_family", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /clients/{id}/locations with scenario_family 'SPA' (not in {RETAIL,DINING,BANKING}) → ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["One ACTIVE ClientAccount."]
          setup_api_calls:
            - call: "POST /clients"
              payload: { company_name: "EnumCo", billing_email: "e@x.test", fee_per_completed_shop_cents: 15000 }
              as: Anonymous
              captures: { client_id: $.data.id }
          trigger:
            - call: "POST /clients/${client_id}/locations"
              payload: { label: "Bad", lat: 40.0, lng: -74.0, scenario_family: "SPA" }
              as: ClientManager
              as_user_id: "${client_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_REQUEST (400)"

      - name: travel_distance_computed_input_ignored
        claim_type: Computed Fields
        grounds: [entities.Assignment.fields.travel_distance_km, calculations.travel_distance]
        distinguishing_aspect: "Assignment.travel_distance_km is computed from Shopper home and Location coords (haversine, 69.94 for 40.0/-74.0 → 40.5/-74.5), not client-supplied."
        test_recipe:
          setup: ["PUBLISHED RETAIL wave/script; Location 40.5/-74.5; CERTIFIED Shopper home 40.0/-74.0."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /clients"
              payload: { company_name: "TdCo", billing_email: "td@x.test", fee_per_completed_shop_cents: 15000 }
              as: Anonymous
              captures: { client_id: $.data.id }
            - call: "POST /clients/${client_id}/locations"
              payload: { label: "TdL", lat: 40.5, lng: -74.5, scenario_family: "RETAIL" }
              as: ClientManager
              as_user_id: "${client_id}"
              captures: { loc_id: $.data.id }
            - call: "POST /clients/${client_id}/scripts"
              payload: { title: "Td", scenario_family: "RETAIL", required_photo_count: 1, receipt_required: false, reimburse_cap_cents: 5000, base_fee_cents: 2000, weights_json: { greeting: 1.0 }, passing_score: 70 }
              as: ClientManager
              as_user_id: "${client_id}"
              captures: { script_id: $.data.id }
            - call: "POST /scripts/${script_id}/publish"
              payload: {}
              as: ClientManager
              as_user_id: "${client_id}"
            - call: "POST /clients/${client_id}/waves"
              payload: { name: "TdW", field_window_start: "2026-06-01T00:00:00Z", field_window_end: "2026-06-30T00:00:00Z", rotation_cooldown_days: 30 }
              as: ClientManager
              as_user_id: "${client_id}"
              captures: { wave_id: $.data.id }
            - call: "POST /waves/${wave_id}/publish"
              payload: {}
              as: ClientManager
              as_user_id: "${client_id}"
            - call: "POST /shoppers"
              payload: { full_name: "Td Shop", email: "tds@x.test", home_lat: 40.0, home_lng: -74.0 }
              as: Anonymous
              captures: { shopper_id: $.data.id }
            - call: "POST /shoppers/${shopper_id}/certification-attempts"
              payload: { raw_score: 90, scenario_family: "RETAIL" }
              as: QaValidator
          trigger:
            - call: "POST /assignments"
              payload: { wave_id: "${wave_id}", shopper_id: "${shopper_id}", location_id: "${loc_id}", script_id: "${script_id}", due_at: "2026-06-10T00:00:00Z" }
              as: ClientManager
              as_user_id: "${client_id}"
              captures: { dist: $.data.travel_distance_km }
          assert:
            - "Assignment.travel_distance_km == 69.94 (haversine 40.0/-74.0 → 40.5/-74.5, round_half_up 2dp)"

      - name: certification_attempt_immutable_no_version_field
        claim_type: Immutability
        grounds: [entities.CertificationAttempt]
        distinguishing_aspect: "CertificationAttempt has common_fields:false — it is an append-only log row with id + created_at and no version/update endpoint."
        test_recipe:
          setup: ["A REGISTERED Shopper."]
          setup_api_calls:
            - call: "POST /shoppers"
              payload: { full_name: "Imm Shop", email: "imm@x.test", home_lat: 40.0, home_lng: -74.0 }
              as: Anonymous
              captures: { shopper_id: $.data.id }
            - call: "POST /shoppers/${shopper_id}/certification-attempts"
              payload: { raw_score: 90, scenario_family: "RETAIL" }
              as: QaValidator
              captures: { att_idx: $.data.attempt_index, outcome: $.data.outcome }
          trigger:
            - call: "GET /shoppers/${shopper_id}/certification-attempts"
              payload: {}
              as: QaValidator
              captures: { first_idx: "$.data[0].attempt_index" }
          assert:
            - "CertificationAttempt.attempt_index == 1 for the first RETAIL attempt; outcome == PASSED"

  # ---------------------------------------------------------------------------
  - section: state_machines
    instances:
      - name: accept_from_validated_assignment_returns_invalid_state
        claim_type: Invalid Transitions
        grounds: ["state_machines.Assignment", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Calling accept on a VALIDATED (terminal) Assignment → ERR_INVALID_STATE (409); no side effects."
        test_recipe:
          setup: ["A VALIDATED Assignment."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /clients"
              payload: { company_name: "TermCo", billing_email: "t@x.test", fee_per_completed_shop_cents: 15000 }
              as: Anonymous
              captures: { client_id: $.data.id }
            - call: "POST /clients/${client_id}/locations"
              payload: { label: "TL", lat: 40.0, lng: -74.0, scenario_family: "RETAIL" }
              as: ClientManager
              as_user_id: "${client_id}"
              captures: { loc_id: $.data.id }
            - call: "POST /clients/${client_id}/scripts"
              payload: { title: "T", scenario_family: "RETAIL", required_photo_count: 1, receipt_required: false, reimburse_cap_cents: 5000, base_fee_cents: 2000, weights_json: { greeting: 1.0 }, passing_score: 70 }
              as: ClientManager
