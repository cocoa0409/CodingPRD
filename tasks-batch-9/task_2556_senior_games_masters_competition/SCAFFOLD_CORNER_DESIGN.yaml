      - name: corner_state_machine_precondition_seed_with_no_accepted_entries_rejected
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.SportEvent.OPEN_to_SEEDED
          - validations[priority=86]
          - validations[priority=88]
          - errors[ERR_NO_ELIGIBLE_ENTRIES]
        distinguishing_aspect: "An event with min_entries_to_stage 1 and zero ACCEPTED entries violates both priority 86 and priority 88, and the response is priority 86's ERR_NO_ELIGIBLE_ENTRIES (422) — the emptiness of the candidate set is reported ahead of the count shortfall, and the event stays OPEN at its original version."
