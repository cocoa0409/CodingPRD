# =============================================================================
# task_0721_warehouse_club_membership — SCAFFOLD_DIFFICULTY_DESIGN.yaml (§1.8)
# Test Targeting Index — 9 rules x 2 instances = 18 instances
# Default clock at startup: 2026-03-01T00:00:00Z
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: return_refund_receipted_vs_no_receipt_diverge
        grounds:
          - calculations.return_refund
          - state_machines.Return.PENDING_to_APPROVED
          - entities.Product.fields.member_price_cents
        distinguishing_aspect: |
          Same Product + qty=2 returned by an EXECUTIVE member yields refund 16000 under the
          receipted variant (prorated historical net paid) but 18000 under no_receipt (current
          member_price * qty) — divergence on the Return/Transaction-line refund domain.
        test_recipe:
          setup:
            - "EXECUTIVE plan (annual_fee 12000, reward_rate_bps 200, cap 100000). Product P member_price_cents=9000, list 10000, reward_eligible true."
            - "Member M ACTIVE. A FINALIZED transaction bought P qty=5 at member price 8000 (price changed to 9000 AFTER finalize)."
          setup_api_calls:
            - call: "POST /plans"
              payload: { tier: "EXECUTIVE", annual_fee_cents: 12000, reward_rate_bps: 200, reward_cap_cents: 100000, max_household_cards: 1, addon_fee_cents: 6000 }
              as: ClubAdmin
              captures: { exec_plan_id: $.data.id }
            - call: "POST /products"
              payload: { sku: "P-DUAL", list_price_cents: 10000, member_price_cents: 8000, reward_eligible: true }
              as: ClubAdmin
              captures: { prod_id: $.data.id }
            - call: "POST /memberships"
              payload: { plan_id: "${exec_plan_id}", primary_member_name: "Mem Dual", auto_renew: false }
              as: Anonymous
              captures: { m_id: $.data.id }
            - call: "POST /payments"
              payload: { membership_id: "${m_id}", purpose: "SIGNUP", outcome: "SUCCEEDED" }
              as: Member
              as_user_id: "${m_id}"
            - call: "POST /transactions"
              payload: { membership_id: "${m_id}" }
              as: RegisterClerk
              captures: { txn_id: $.data.id }
            - call: "POST /transactions/${txn_id}/lines"
              payload: { product_id: "${prod_id}", qty: 5 }
              as: RegisterClerk
              captures: { line_id: $.data.id }
            - call: "POST /transactions/${txn_id}/finalize"
              payload: {}
              as: RegisterClerk
          trigger:
            - call: "POST /returns"
              payload: { membership_id: "${m_id}", product_id: "${prod_id}", qty: 2, transaction_id: "${txn_id}" }
              as: ServiceDeskClerk
              captures: { ret_rcpt_id: $.data.id }
            - call: "POST /returns/${ret_rcpt_id}/approve"
              payload: {}
              as: ServiceDeskClerk
            - call: "POST /returns"
              payload: { membership_id: "${m_id}", product_id: "${prod_id}", qty: 2 }
              as: ServiceDeskClerk
              captures: { ret_noreceipt_id: $.data.id }
            - call: "POST /returns/${ret_noreceipt_id}/approve"
              payload: {}
              as: ServiceDeskClerk
          assert:
            - "Return.${ret_rcpt_id}.lookup_mode == RECEIPTED"
            - "Return.${ret_rcpt_id}.refund_cents == 16000"
            - "Return.${ret_noreceipt_id}.lookup_mode == NO_RECEIPT_LOOKUP"
            - "Return.${ret_noreceipt_id}.refund_cents == 18000"

      - name: reward_accrual_capped_vs_uncapped_on_membership
        grounds:
          - calculations.transaction_reward_accrual
          - state_machines.Transaction.OPEN_to_FINALIZED
          - entities.Membership.fields.reward_accrued_cents
        distinguishing_aspect: |
          On the Membership reward-accrual domain, an identical 40000-net reward_eligible
          transaction accrues 800 under an uncapped plan (cap 100000) but only 500 under a
          plan whose remaining cap is 500 — different result, different entity domain than refund.
        test_recipe:
          setup:
            - "EXECUTIVE plan EXEC_LOW with reward_cap_cents=500. EXECUTIVE plan EXEC_HIGH with cap 100000."
            - "Two ACTIVE members, one per plan; each opens a transaction buying reward_eligible product P qty=5 at member 8000 (net 40000)."
          setup_api_calls:
            - call: "POST /plans"
              payload: { tier: "EXECUTIVE", annual_fee_cents: 12000, reward_rate_bps: 200, reward_cap_cents: 500, max_household_cards: 1, addon_fee_cents: 6000 }
              as: ClubAdmin
              captures: { plan_low: $.data.id }
            - call: "POST /plans"
              payload: { tier: "EXECUTIVE", annual_fee_cents: 12000, reward_rate_bps: 200, reward_cap_cents: 100000, max_household_cards: 1, addon_fee_cents: 6000 }
              as: ClubAdmin
              captures: { plan_high: $.data.id }
            - call: "POST /products"
              payload: { sku: "P-CAP", list_price_cents: 10000, member_price_cents: 8000, reward_eligible: true }
              as: ClubAdmin
              captures: { prod_id: $.data.id }
            - call: "POST /memberships"
              payload: { plan_id: "${plan_low}", primary_member_name: "Mem Low", auto_renew: false }
              as: Anonymous
              captures: { m_low: $.data.id }
            - call: "POST /payments"
              payload: { membership_id: "${m_low}", purpose: "SIGNUP", outcome: "SUCCEEDED" }
              as: Member
              as_user_id: "${m_low}"
            - call: "POST /memberships"
              payload: { plan_id: "${plan_high}", primary_member_name: "Mem High", auto_renew: false }
              as: Anonymous
              captures: { m_high: $.data.id }
            - call: "POST /payments"
              payload: { membership_id: "${m_high}", purpose: "SIGNUP", outcome: "SUCCEEDED" }
              as: Member
              as_user_id: "${m_high}"
            - call: "POST /transactions"
              payload: { membership_id: "${m_low}" }
              as: RegisterClerk
              captures: { txn_low: $.data.id }
            - call: "POST /transactions/${txn_low}/lines"
              payload: { product_id: "${prod_id}", qty: 5 }
              as: RegisterClerk
            - call: "POST /transactions"
              payload: { membership_id: "${m_high}" }
              as: RegisterClerk
              captures: { txn_high: $.data.id }
            - call: "POST /transactions/${txn_high}/lines"
              payload: { product_id: "${prod_id}", qty: 5 }
              as: RegisterClerk
          trigger:
            - call: "POST /transactions/${txn_low}/finalize"
              payload: {}
              as: RegisterClerk
            - call: "POST /transactions/${txn_high}/finalize"
              payload: {}
              as: RegisterClerk
          assert:
            - "Transaction.${txn_low}.reward_accrued_cents == 500"
            - "Membership.${m_low}.reward_accrued_cents == 500"
            - "Transaction.${txn_high}.reward_accrued_cents == 800"
            - "Membership.${m_high}.reward_accrued_cents == 800"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: discount_stack_pinned_order_instant_then_rebate
        grounds:
          - calculations.line_discounted_amount
          - state_machines.Transaction.OPEN_to_OPEN
          - entities.InstantSaving.fields.kind
        distinguishing_aspect: |
          Mode (c) circular-looking dependency: rebate is computed off the post-instant base, so
          the pinned order instant-then-rebate gives net 19500 (gross 24000 - instant 3000 -
          rebate 1500); the reversed order is impossible because rebate is keyed on base_after_instant.
        test_recipe:
          setup:
            - "BASIC plan. ACTIVE member. Product P member 8000. INSTANT_SAVINGS 1000/unit and MANUFACTURER_REBATE 500/unit, both active at clock 2026-03-01."
          setup_api_calls:
            - call: "POST /plans"
              payload: { tier: "BASIC", annual_fee_cents: 6000, max_household_cards: 1, addon_fee_cents: 4000 }
              as: ClubAdmin
              captures: { basic_plan: $.data.id }
            - call: "POST /products"
              payload: { sku: "P-STACK", list_price_cents: 10000, member_price_cents: 8000 }
              as: ClubAdmin
              captures: { prod_id: $.data.id }
            - call: "POST /instant-savings"
              payload: { product_id: "${prod_id}", kind: "INSTANT_SAVINGS", amount_cents: 1000, window_start_utc: "2026-01-01T00:00:00Z", window_end_utc: "2026-12-01T00:00:00Z" }
              as: ClubAdmin
            - call: "POST /instant-savings"
              payload: { product_id: "${prod_id}", kind: "MANUFACTURER_REBATE", amount_cents: 500, window_start_utc: "2026-01-01T00:00:00Z", window_end_utc: "2026-12-01T00:00:00Z" }
              as: ClubAdmin
            - call: "POST /memberships"
              payload: { plan_id: "${basic_plan}", primary_member_name: "Mem Stack", auto_renew: false }
              as: Anonymous
              captures: { m_id: $.data.id }
            - call: "POST /payments"
              payload: { membership_id: "${m_id}", purpose: "SIGNUP", outcome: "SUCCEEDED" }
              as: Member
              as_user_id: "${m_id}"
            - call: "POST /transactions"
              payload: { membership_id: "${m_id}" }
              as: RegisterClerk
              captures: { txn_id: $.data.id }
          trigger:
            - call: "POST /transactions/${txn_id}/lines"
              payload: { product_id: "${prod_id}", qty: 3 }
              as: RegisterClerk
              captures: { line_id: $.data.id }
          assert:
            - "TransactionLine.${line_id}.line_instant_savings_cents == 3000"
            - "TransactionLine.${line_id}.line_rebate_cents == 1500"
            - "Transaction.${txn_id}.net_cents == 19500"

      - name: cancel_refund_proration_nonlinear_with_redemption
        grounds:
          - calculations.cancel_refund
          - state_machines.Membership.ACTIVE_to_CANCELLED
          - entities.Membership.fields.reward_redeemed_cents
        distinguishing_aspect: |
          Mode (a) ≥3-input non-linear formula: gross_refund = floor(annual_fee * remaining_days/365)
          THEN net = max(0, gross - reward_redeemed); with annual_fee 12000, 100 days elapsed and 0
          redeemed, net = 8712 — branch on remaining_days and floor on a product of three inputs.
        test_recipe:
          setup:
            - "BASIC plan annual_fee 12000. ACTIVE member activated at clock 2026-03-01; clock then advanced 100 days to 2026-06-09T00:00:00Z."
          setup_api_calls:
            - call: "POST /plans"
              payload: { tier: "BASIC", annual_fee_cents: 12000, max_household_cards: 1, addon_fee_cents: 4000 }
              as: ClubAdmin
              captures: { basic_plan: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: ClubAdmin
            - call: "POST /memberships"
              payload: { plan_id: "${basic_plan}", primary_member_name: "Mem Cancel", auto_renew: false }
              as: Anonymous
              captures: { m_id: $.data.id }
            - call: "POST /payments"
              payload: { membership_id: "${m_id}", purpose: "SIGNUP", outcome: "SUCCEEDED" }
              as: Member
              as_user_id: "${m_id}"
              captures: { mv: $.data.id }
            - call: "GET /memberships/${m_id}"
              payload: {}
              as: Member
              as_user_id: "${m_id}"
              captures: { m_ver: $.data.version }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-09T00:00:00Z" }
              as: ClubAdmin
          trigger:
            - call: "POST /memberships/${m_id}/cancel"
              payload: { expected_membership_version: "${m_ver}" }
              as: Member
              as_user_id: "${m_id}"
          assert:
            - "Membership.${m_id}.status == CANCELLED"
            - "FeeEvent for ${m_id} with kind=CANCEL_REFUND has amount_cents == -8712"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: membership_cyclic_renew_reinstate_loop
        grounds:
          - state_machines.Membership.ACTIVE_to_ACTIVE
          - state_machines.Membership.EXPIRED_to_ACTIVE
          - entities.Membership.fields.status
        distinguishing_aspect: |
          Membership is cyclic: ACTIVE→ACTIVE (renew self-loop) and EXPIRED→ACTIVE (reinstate)
          form loops, not a linear pipeline — distinct from the Transaction branching machine.
        test_recipe:
          setup:
            - "BASIC plan annual_fee 6000, auto_renew=false. Member activated 2026-03-01; clock advanced past term_end so it EXPIRES; then reinstated via RENEWAL payment."
          setup_api_calls:
            - call: "POST /plans"
              payload: { tier: "BASIC", annual_fee_cents: 6000, max_household_cards: 1, addon_fee_cents: 4000 }
              as: ClubAdmin
              captures: { basic_plan: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: ClubAdmin
            - call: "POST /memberships"
              payload: { plan_id: "${basic_plan}", primary_member_name: "Mem Cyc", auto_renew: false }
              as: Anonymous
              captures: { m_id: $.data.id }
            - call: "POST /payments"
              payload: { membership_id: "${m_id}", purpose: "SIGNUP", outcome: "SUCCEEDED" }
              as: Member
              as_user_id: "${m_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-04-01T00:00:00Z" }
              as: ClubAdmin
            - call: "GET /memberships/${m_id}"
              payload: {}
              as: Member
              as_user_id: "${m_id}"
              captures: { status_after_lapse: $.data.status }
          trigger:
            - call: "POST /payments"
              payload: { membership_id: "${m_id}", purpose: "RENEWAL", outcome: "SUCCEEDED" }
              as: Member
              as_user_id: "${m_id}"
          assert:
            - "Membership.${m_id}.status == ACTIVE after the RENEWAL payment (reinstated from EXPIRED)"
            - "status_after_lapse == EXPIRED"

      - name: transaction_branching_finalize_vs_void
        grounds:
          - state_machines.Transaction.OPEN_to_FINALIZED
          - state_machines.Transaction.OPEN_to_VOIDED
          - entities.Transaction.fields.status
        distinguishing_aspect: |
          Transaction OPEN branches to two terminals with divergent side-effect sets: FINALIZED
          creates an ACCRUAL ledger entry, VOIDED creates none — branching machine on a different
          entity than Membership.
        test_recipe:
          setup:
            - "EXECUTIVE plan. ACTIVE member. Two OPEN transactions each with one reward_eligible line qty 5 (net 40000)."
          setup_api_calls:
            - call: "POST /plans"
              payload: { tier: "EXECUTIVE", annual_fee_cents: 12000, reward_rate_bps: 200, reward_cap_cents: 100000, max_household_cards: 1, addon_fee_cents: 6000 }
              as: ClubAdmin
              captures: { exec_plan: $.data.id }
            - call: "POST /products"
              payload: { sku: "P-BR", list_price_cents: 10000, member_price_cents: 8000, reward_eligible: true }
              as: ClubAdmin
              captures: { prod_id: $.data.id }
            - call: "POST /memberships"
              payload: { plan_id: "${exec_plan}", primary_member_name: "Mem Br", auto_renew: false }
              as: Anonymous
              captures: { m_id: $.data.id }
            - call: "POST /payments"
              payload: { membership_id: "${m_id}", purpose: "SIGNUP", outcome: "SUCCEEDED" }
              as: Member
              as_user_id: "${m_id}"
            - call: "POST /transactions"
              payload: { membership_id: "${m_id}" }
              as: RegisterClerk
              captures: { txn_fin: $.data.id }
            - call: "POST /transactions/${txn_fin}/lines"
              payload: { product_id: "${prod_id}", qty: 5 }
              as: RegisterClerk
            - call: "POST /transactions"
              payload: { membership_id: "${m_id}" }
              as: RegisterClerk
              captures: { txn_void: $.data.id }
            - call: "POST /transactions/${txn_void}/lines"
              payload: { product_id: "${prod_id}", qty: 5 }
              as: RegisterClerk
          trigger:
            - call: "POST /transactions/${txn_fin}/finalize"
              payload: {}
              as: RegisterClerk
            - call: "POST /transactions/${txn_void}/void"
              payload: {}
              as: RegisterClerk
          assert:
            - "Transaction.${txn_fin}.status == FINALIZED"
            - "Transaction.${txn_void}.status == VOIDED"
            - "reward-ledger entries for source_transaction_id=${txn_fin} include exactly one ACCRUAL of 800"
            - "reward-ledger entries for source_transaction_id=${txn_void} count == 0"

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: cancel_cascade_depth3_fee_ledger_cards
        grounds:
          - state_machines.Membership.ACTIVE_to_CANCELLED
          - state_machines.HouseholdCard.ACTIVE_to_REVOKED
          - calculations.cancel_refund
        distinguishing_aspect: |
          Depth-≥3 chain from the cancel trigger: cancel → create CANCEL_REFUND FeeEvent +
          EXPIRY ledger entry → recompute Membership.reward_accrued → REVOKE all ACTIVE
          HouseholdCards; each link caused by the prior, not the original action directly.
        test_recipe:
          setup:
            - "BASIC plan annual_fee 6000, max_household_cards 1. ACTIVE member with one ACTIVE INCLUDED household card. Cancelled same day."
          setup_api_calls:
            - call: "POST /plans"
              payload: { tier: "BASIC", annual_fee_cents: 6000, max_household_cards: 1, addon_fee_cents: 4000 }
              as: ClubAdmin
              captures: { basic_plan: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: ClubAdmin
            - call: "POST /memberships"
              payload: { plan_id: "${basic_plan}", primary_member_name: "Mem Casc", auto_renew: false }
              as: Anonymous
              captures: { m_id: $.data.id }
            - call: "POST /payments"
              payload: { membership_id: "${m_id}", purpose: "SIGNUP", outcome: "SUCCEEDED" }
              as: Member
              as_user_id: "${m_id}"
            - call: "POST /household-cards"
              payload: { membership_id: "${m_id}", cardholder_name: "Spouse", card_kind: "INCLUDED" }
              as: Member
              as_user_id: "${m_id}"
              captures: { card_id: $.data.id }
            - call: "GET /memberships/${m_id}"
              payload: {}
              as: Member
              as_user_id: "${m_id}"
              captures: { m_ver: $.data.version }
          trigger:
            - call: "POST /memberships/${m_id}/cancel"
              payload: { expected_membership_version: "${m_ver}" }
              as: Member
              as_user_id: "${m_id}"
          assert:
            - "Membership.${m_id}.status == CANCELLED"
            - "HouseholdCard.${card_id}.status == REVOKED"
            - "FeeEvent for ${m_id} with kind=CANCEL_REFUND has amount_cents == -6000"
            - "reward-ledger for ${m_id} includes one EXPIRY entry"

      - name: return_approve_cascade_depth3_reversal_qty_membership
        grounds:
          - state_machines.Return.PENDING_to_APPROVED
          - entities.TransactionLine.fields.returned_qty
          - entities.Membership.fields.reward_accrued_cents
        distinguishing_aspect: |
          Depth-≥3 chain from the return-approve trigger (different origin than cancel): approve →
          create REVERSAL ledger entry → bump TransactionLine.returned_qty → recompute
          Membership.reward_accrued_cents from the ledger.
        test_recipe:
          setup:
            - "EXECUTIVE plan cap 100000. ACTIVE member, FINALIZED txn bought P qty 5 member 8000 (accrued 800). Receipted return qty 2."
          setup_api_calls:
            - call: "POST /plans"
              payload: { tier: "EXECUTIVE", annual_fee_cents: 12000, reward_rate_bps: 200, reward_cap_cents: 100000, max_household_cards: 1, addon_fee_cents: 6000 }
              as: ClubAdmin
              captures: { exec_plan: $.data.id }
            - call: "POST /products"
              payload: { sku: "P-RET", list_price_cents: 10000, member_price_cents: 8000, reward_eligible: true }
              as: ClubAdmin
              captures: { prod_id: $.data.id }
            - call: "POST /memberships"
              payload: { plan_id: "${exec_plan}", primary_member_name: "Mem Ret", auto_renew: false }
              as: Anonymous
              captures: { m_id: $.data.id }
            - call: "POST /payments"
              payload: { membership_id: "${m_id}", purpose: "SIGNUP", outcome: "SUCCEEDED" }
              as: Member
              as_user_id: "${m_id}"
            - call: "POST /transactions"
              payload: { membership_id: "${m_id}" }
              as: RegisterClerk
              captures: { txn_id: $.data.id }
            - call: "POST /transactions/${txn_id}/lines"
              payload: { product_id: "${prod_id}", qty: 5 }
              as: RegisterClerk
              captures: { line_id: $.data.id }
            - call: "POST /transactions/${txn_id}/finalize"
              payload: {}
              as: RegisterClerk
            - call: "POST /returns"
              payload: { membership_id: "${m_id}", product_id: "${prod_id}", qty: 2, transaction_id: "${txn_id}" }
              as: ServiceDeskClerk
              captures: { ret_id: $.data.id }
          trigger:
            - call: "POST /returns/${ret_id}/approve"
              payload: {}
              as: ServiceDeskClerk
          assert:
            - "Return.${ret_id}.status == APPROVED"
            - "Return.${ret_id}.reward_reversal_cents == 320"
            - "TransactionLine.${line_id}.returned_qty == 2"
            - "Membership.${m_id}.reward_accrued_cents == 480"

  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_not_active_beats_member_only_safety
        grounds:
          - validations[priority=7]
          - validations[priority=8]
          - errors[ERR_MEMBERSHIP_NOT_ACTIVE]
        distinguishing_aspect: |
          A line add on a member_only product to a transaction whose membership is EXPIRED fails
          both priority-7 (business_referential: membership not ACTIVE) and priority-8
          (business_safety: member_only) — the higher-priority state/referential ERR_MEMBERSHIP_NOT_ACTIVE wins.
        test_recipe:
          setup:
            - "BASIC plan. Member activated 2026-03-01, an OPEN transaction created, then clock advanced so membership EXPIRES. Product is member_only=true."
          setup_api_calls:
            - call: "POST /plans"
              payload: { tier: "BASIC", annual_fee_cents: 6000, max_household_cards: 1, addon_fee_cents: 4000 }
              as: ClubAdmin
              captures: { basic_plan: $.data.id }
            - call: "POST /products"
              payload: { sku: "P-MO", list_price_cents: 10000, member_price_cents: 8000, member_only: true }
              as: ClubAdmin
              captures: { prod_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: ClubAdmin
            - call: "POST /memberships"
              payload: { plan_id: "${basic_plan}", primary_member_name: "Mem PV1", auto_renew: false }
              as: Anonymous
              captures: { m_id: $.data.id }
            - call: "POST /payments"
              payload: { membership_id: "${m_id}", purpose: "SIGNUP", outcome: "SUCCEEDED" }
              as: Member
              as_user_id: "${m_id}"
            - call: "POST /transactions"
              payload: { membership_id: "${m_id}" }
              as: RegisterClerk
              captures: { txn_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-04-01T00:00:00Z" }
              as: ClubAdmin
          trigger:
            - call: "POST /transactions/${txn_id}/lines"
              payload: { product_id: "${prod_id}", qty: 1 }
              as: RegisterClerk
              captures: { err: $.data.error_id }
          assert:
            - "response_type == error"
            - "err == ERR_MEMBERSHIP_NOT_ACTIVE"

      - name: purchase_limit_beats_reward_fiscal_redemption
        grounds:
          - validations[priority=9]
          - validations[priority=13]
          - errors[ERR_PURCHASE_LIMIT_EXCEEDED]
        distinguishing_aspect: |
          Different error-category pair than instance 1 (business_constraint vs business_fiscal):
          a line add exceeding per_member_limit is rejected with ERR_PURCHASE_LIMIT_EXCEEDED
          (priority 9) even though the request would also touch reward fiscal logic downstream.
        test_recipe:
          setup:
            - "BASIC plan. ACTIVE member. Product per_member_limit=3. An OPEN transaction already has a line qty 3 of P this term."
          setup_api_calls:
            - call: "POST /plans"
              payload: { tier: "BASIC", annual_fee_cents: 6000, max_household_cards: 1, addon_fee_cents: 4000 }
              as: ClubAdmin
              captures: { basic_plan: $.data.id }
            - call: "POST /products"
              payload: { sku: "P-LIM", list_price_cents: 10000, member_price_cents: 8000, per_member_limit: 3 }
              as: ClubAdmin
              captures: { prod_id: $.data.id }
            - call: "POST /memberships"
              payload: { plan_id: "${basic_plan}", primary_member_name: "Mem PV2", auto_renew: false }
              as: Anonymous
              captures: { m_id: $.data.id }
            - call: "POST /payments"
              payload: { membership_id: "${m_id}", purpose: "SIGNUP", outcome: "SUCCEEDED" }
              as: Member
              as_user_id: "${m_id}"
            - call: "POST /transactions"
              payload: { membership_id: "${m_id}" }
              as: RegisterClerk
              captures: { txn_id: $.data.id }
            - call: "POST /transactions/${txn_id}/lines"
              payload: { product_id: "${prod_id}", qty: 3 }
              as: RegisterClerk
          trigger:
            - call: "POST /transactions/${txn_id}/lines"
              payload: { product_id: "${prod_id}", qty: 1 }
              as: RegisterClerk
              captures: { err: $.data.error_id }
          assert:
            - "response_type == error"
            - "err == ERR_PURCHASE_LIMIT_EXCEEDED"

  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: purchase_limit_at_exact_boundary
        grounds:
          - validations[priority=9]
          - calculations.line_discounted_amount
          - entities.Product.fields.per_member_limit
        distinguishing_aspect: |
          per_member_limit=3: cumulative qty exactly 3 succeeds (<= limit), qty pushing to 4 fails;
          boundary is at the equality (3 OK, 4 rejected) on the purchase-limit metric via /lines.
        test_recipe:
          setup:
            - "BASIC plan. ACTIVE member. Product per_member_limit=3. OPEN transaction."
          setup_api_calls:
            - call: "POST /plans"
              payload: { tier: "BASIC", annual_fee_cents: 6000, max_household_cards: 1, addon_fee_cents: 4000 }
              as: ClubAdmin
              captures: { basic_plan: $.data.id }
            - call: "POST /products"
              payload: { sku: "P-BND", list_price_cents: 10000, member_price_cents: 8000, per_member_limit: 3 }
              as: ClubAdmin
              captures: { prod_id: $.data.id }
            - call: "POST /memberships"
              payload: { plan_id: "${basic_plan}", primary_member_name: "Mem BND", auto_renew: false }
              as: Anonymous
              captures: { m_id: $.data.id }
            - call: "POST /payments"
              payload: { membership_id: "${m_id}", purpose: "SIGNUP", outcome: "SUCCEEDED" }
              as: Member
              as_user_id: "${m_id}"
            - call: "POST /transactions"
              payload: { membership_id: "${m_id}" }
              as: RegisterClerk
              captures: { txn_id: $.data.id }
          trigger:
            - call: "POST /transactions/${txn_id}/lines"
              payload: { product_id: "${prod_id}", qty: 3 }
              as: RegisterClerk
              captures: { ok_line: $.data.id }
            - call: "POST /transactions/${txn_id}/lines"
              payload: { product_id: "${prod_id}", qty: 1 }
              as: RegisterClerk
              captures: { err: $.data.error_id }
          assert:
            - "TransactionLine.${ok_line}.qty == 3 (cumulative 3 == limit accepted)"
            - "err == ERR_PURCHASE_LIMIT_EXCEEDED (cumulative 4 > 3 rejected)"

      - name: finalize_empty_transaction_zero_line_edge
        grounds:
          - validations[priority=6]
          - state_machines.Transaction.OPEN_to_FINALIZED
          - errors[ERR_EMPTY_TRANSACTION]
        distinguishing_aspect: |
          Empty-set boundary on a different metric/endpoint: finalizing a transaction with zero
          lines fails ERR_EMPTY_TRANSACTION via /finalize, distinct from the numeric purchase-limit boundary.
        test_recipe:
          setup:
            - "BASIC plan. ACTIVE member. An OPEN transaction with NO lines."
          setup_api_calls:
            - call: "POST /plans"
              payload: { tier: "BASIC", annual_fee_cents: 6000, max_household_cards: 1, addon_fee_cents: 4000 }
              as: ClubAdmin
              captures: { basic_plan: $.data.id }
            - call: "POST /memberships"
              payload: { plan_id: "${basic_plan}", primary_member_name: "Mem EMP", auto_renew: false }
              as: Anonymous
              captures: { m_id: $.data.id }
            - call: "POST /payments"
              payload: { membership_id: "${m_id}", purpose: "SIGNUP", outcome: "SUCCEEDED" }
              as: Member
              as_user_id: "${m_id}"
            - call: "POST /transactions"
              payload: { membership_id: "${m_id}" }
              as: RegisterClerk
              captures: { txn_id: $.data.id }
          trigger:
            - call: "POST /transactions/${txn_id}/finalize"
              payload: {}
              as: RegisterClerk
              captures: { err: $.data.error_id }
          assert:
            - "response_type == error"
            - "err == ERR_EMPTY_TRANSACTION"

  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: line_add_requires_membership_active
        grounds:
          - state_machines.Transaction.OPEN_to_OPEN
          - entities.Membership.fields.status
          - validations[priority=7]
        distinguishing_aspect: |
          Transaction line-add (Transaction entity) is gated on the owning Membership entity being
          ACTIVE — Transaction→Membership pair; an EXPIRED membership rejects the line.
        test_recipe:
          setup:
            - "BASIC plan. Member activated 2026-03-01, OPEN transaction created, clock advanced past term so membership EXPIRES. Product not member_only (isolates the cross-entity dep)."
          setup_api_calls:
            - call: "POST /plans"
              payload: { tier: "BASIC", annual_fee_cents: 6000, max_household_cards: 1, addon_fee_cents: 4000 }
              as: ClubAdmin
              captures: { basic_plan: $.data.id }
            - call: "POST /products"
              payload: { sku: "P-CE1", list_price_cents: 10000, member_price_cents: 8000 }
              as: ClubAdmin
              captures: { prod_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: ClubAdmin
            - call: "POST /memberships"
              payload: { plan_id: "${basic_plan}", primary_member_name: "Mem CE1", auto_renew: false }
              as: Anonymous
              captures: { m_id: $.data.id }
            - call: "POST /payments"
              payload: { membership_id: "${m_id}", purpose: "SIGNUP", outcome: "SUCCEEDED" }
              as: Member
              as_user_id: "${m_id}"
            - call: "POST /transactions"
              payload: { membership_id: "${m_id}" }
              as: RegisterClerk
              captures: { txn_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-04-01T00:00:00Z" }
              as: ClubAdmin
          trigger:
            - call: "POST /transactions/${txn_id}/lines"
              payload: { product_id: "${prod_id}", qty: 1 }
              as: RegisterClerk
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_MEMBERSHIP_NOT_ACTIVE"

      - name: receipted_return_requires_finalized_transaction
        grounds:
          - state_machines.Return.PENDING_to_APPROVED
          - entities.Transaction.fields.status
          - validations[priority=12]
        distinguishing_aspect: |
          Different entity pair than instance 1 (Return→Transaction): approving a receipted return
          requires its source Transaction to be FINALIZED; a return whose qty exceeds the original
          FINALIZED line qty is rejected with ERR_RETURN_QTY_EXCEEDS_PURCHASED.
        test_recipe:
          setup:
            - "BASIC plan. ACTIVE member. FINALIZED txn with line qty 2 of product P. A receipted return for qty 3 is created (3 > 2)."
          setup_api_calls:
            - call: "POST /plans"
              payload: { tier: "BASIC", annual_fee_cents: 6000, max_household_cards: 1, addon_fee_cents: 4000 }
              as: ClubAdmin
              captures: { basic_plan: $.data.id }
            - call: "POST /products"
              payload: { sku: "P-CE2", list_price_cents: 10000, member_price_cents: 8000 }
              as: ClubAdmin
              captures: { prod_id: $.data.id }
            - call: "POST /memberships"
              payload: { plan_id: "${basic_plan}", primary_member_name: "Mem CE2", auto_renew: false }
              as: Anonymous
              captures: { m_id: $.data.id }
            - call: "POST /payments"
              payload: { membership_id: "${m_id}", purpose: "SIGNUP", outcome: "SUCCEEDED" }
              as: Member
              as_user_id: "${m_id}"
            - call: "POST /transactions"
              payload: { membership_id: "${m_id}" }
              as: RegisterClerk
              captures: { txn_id: $.data.id }
            - call: "POST /transactions/${txn_id}/lines"
              payload: { product_id: "${prod_id}", qty: 2 }
              as: RegisterClerk
            - call: "POST /transactions/${txn_id}/finalize"
              payload: {}
              as: RegisterClerk
            - call: "POST /returns"
              payload: { membership_id: "${m_id}", product_id: "${prod_id}", qty: 3, transaction_id: "${txn_id}" }
              as: ServiceDeskClerk
              captures: { ret_id: $.data.id }
          trigger:
            - call: "POST /returns/${ret_id}/approve"
              payload: {}
              as: ServiceDeskClerk
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_RETURN_QTY_EXCEEDS_PURCHASED"

  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: instant_saving_window_half_open_boundary
        grounds:
          - calculations.line_discounted_amount
          - entities.InstantSaving.fields.window_start_utc
          - entities.InstantSaving.fields.window_end_utc
        distinguishing_aspect: |
          Half-open [start, end) interval semantics on InstantSaving: a saving with
          window_end_utc exactly equal to clock_now does NOT apply (end exclusive), so a line at
          clock == window_end gets zero instant savings while one strictly inside gets the discount.
        test_recipe:
          setup:
            - "BASIC plan. ACTIVE member. Product P member 8000 with an INSTANT_SAVINGS 1000/unit window [2026-03-01, 2026-06-01). Two lines added: one at clock 2026-05-01 (inside), one at clock 2026-06-01 (== end, excluded)."
          setup_api_calls:
            - call: "POST /plans"
              payload: { tier: "BASIC", annual_fee_cents: 6000, max_household_cards: 1, addon_fee_cents: 4000 }
              as: ClubAdmin
              captures: { basic_plan: $.data.id }
            - call: "POST /products"
              payload: { sku: "P-WIN", list_price_cents: 10000, member_price_cents: 8000 }
              as: ClubAdmin
              captures: { prod_id: $.data.id }
            - call: "POST /instant-savings"
              payload: { product_id: "${prod_id}", kind: "INSTANT_SAVINGS", amount_cents: 1000, window_start_utc: "2026-03-01T00:00:00Z", window_end_utc: "2026-06-01T00:00:00Z" }
              as: ClubAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: ClubAdmin
            - call: "POST /memberships"
              payload: { plan_id: "${basic_plan}", primary_member_name: "Mem WIN", auto_renew: false }
              as: Anonymous
              captures: { m_id: $.data.id }
            - call: "POST /payments"
              payload: { membership_id: "${m_id}", purpose: "SIGNUP", outcome: "SUCCEEDED" }
              as: Member
              as_user_id: "${m_id}"
            - call: "POST /transactions"
              payload: { membership_id: "${m_id}" }
              as: RegisterClerk
              captures: { txn_id: $.data.id }
          trigger:
            - call: "POST /transactions/${txn_id}/lines"
              payload: { product_id: "${prod_id}", qty: 1 }
              as: RegisterClerk
              captures: { line_inside: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: ClubAdmin
            - call: "POST /transactions/${txn_id}/lines"
              payload: { product_id: "${prod_id}", qty: 1 }
              as: RegisterClerk
              captures: { line_at_end: $.data.id }
          assert:
            - "TransactionLine.${line_inside}.line_instant_savings_cents == 1000"
            - "TransactionLine.${line_at_end}.line_instant_savings_cents == 0"

      - name: no_receipt_lookup_window_inclusive_boundary
        grounds:
          - validations[priority=11]
          - entities.Return.fields.lookup_mode
          - entities.Transaction.fields.finalized_at_utc
        distinguishing_aspect: |
          Different interval semantics and resource than the InstantSaving window: the no-receipt
          lookup eligibility window measures (clock_now - finalized_at) against
          NO_RECEIPT_WINDOW_DAYS using whole-day inclusive arithmetic on the Return/Transaction
          aggregate — a finalize exactly NO_RECEIPT_WINDOW_DAYS+1 ago is DENIED, within is allowed.
        test_recipe:
          setup:
            - "BASIC plan. ACTIVE member. FINALIZED txn (P qty 1) at clock 2026-03-01. NO_RECEIPT_WINDOW_DAYS=90; clock advanced to 2026-06-15 (>90 days later) — no-receipt lookup must be DENIED."
          setup_api_calls:
            - call: "POST /plans"
              payload: { tier: "BASIC", annual_fee_cents: 6000, max_household_cards: 1, addon_fee_cents: 4000 }
              as: ClubAdmin
              captures: { basic_plan: $.data.id }
            - call: "POST /products"
              payload: { sku: "P-NRW", list_price_cents: 10000, member_price_cents: 8000 }
              as: ClubAdmin
              captures: { prod_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: ClubAdmin
            - call: "POST /memberships"
              payload: { plan_id: "${basic_plan}", primary_member_name: "Mem NRW", auto_renew: false }
              as: Anonymous
              captures: { m_id: $.data.id }
            - call: "POST /payments"
              payload: { membership_id: "${m_id}", purpose: "SIGNUP", outcome: "SUCCEEDED" }
              as: Member
              as_user_id: "${m_id}"
            - call: "POST /transactions"
              payload: { membership_id: "${m_id}" }
              as: RegisterClerk
              captures: { txn_id: $.data.id }
            - call: "POST /transactions/${txn_id}/lines"
              payload: { product_id: "${prod_id}", qty: 1 }
              as: RegisterClerk
            - call: "POST /transactions/${txn_id}/finalize"
              payload: {}
              as: RegisterClerk
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-15T00:00:00Z" }
              as: ClubAdmin
          trigger:
            - call: "POST /returns"
              payload: { membership_id: "${m_id}", product_id: "${prod_id}", qty: 1 }
              as: ServiceDeskClerk
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_NO_RECEIPT_LOOKUP_DENIED"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: reward_conserved_accrual_then_reversal
        grounds:
          - calculations.transaction_reward_accrual
          - calculations.return_refund
          - entities.RewardLedgerEntry.fields.amount_cents
        distinguishing_aspect: |
          Conserved quantity = executive reward balance: Membership.reward_accrued_cents MUST equal
          sum of all RewardLedgerEntry.amount_cents (ACCRUAL+REVERSAL+REDEMPTION+EXPIRY) for the
          term; full return of all units reverses the entire 800 accrual back to 0 with no drift.
        test_recipe:
          setup:
            - "EXECUTIVE plan cap 100000. ACTIVE member, FINALIZED txn P qty 5 member 8000 (accrued 800). Receipted return of full qty 5."
          setup_api_calls:
            - call: "POST /plans"
              payload: { tier: "EXECUTIVE", annual_fee_cents: 12000, reward_rate_bps: 200, reward_cap_cents: 100000, max_household_cards: 1, addon_fee_cents: 6000 }
              as: ClubAdmin
              captures: { exec_plan: $.data.id }
            - call: "POST /products"
              payload: { sku: "P-INV1", list_price_cents: 10000, member_price_cents: 8000, reward_eligible: true }
              as: ClubAdmin
              captures: { prod_id: $.data.id }
            - call: "POST /memberships"
              payload: { plan_id: "${exec_plan}", primary_member_name: "Mem INV1", auto_renew: false }
              as: Anonymous
              captures: { m_id: $.data.id }
            - call: "POST /payments"
              payload: { membership_id: "${m_id}", purpose: "SIGNUP", outcome: "SUCCEEDED" }
              as: Member
              as_user_id: "${m_id}"
            - call: "POST /transactions"
              payload: { membership_id: "${m_id}" }
              as: RegisterClerk
              captures: { txn_id: $.data.id }
            - call: "POST /transactions/${txn_id}/lines"
              payload: { product_id: "${prod_id}", qty: 5 }
              as: RegisterClerk
            - call: "POST /transactions/${txn_id}/finalize"
              payload: {}
              as: RegisterClerk
            - call: "POST /returns"
              payload: { membership_id: "${m_id}", product_id: "${prod_id}", qty: 5, transaction_id: "${txn_id}" }
              as: ServiceDeskClerk
              captures: { ret_id: $.data.id }
          trigger:
            - call: "POST /returns/${ret_id}/approve"
              payload: {}
              as: ServiceDeskClerk
          assert:
            - "Return.${ret_id}.reward_reversal_cents == 800"
            - "Membership.${m_id}.reward_accrued_cents == 0"
            - "sum of RewardLedgerEntry.amount_cents for ${m_id} == 0"

      - name: fee_conserved_signup_then_cancel_refund
        grounds:
          - calculations.cancel_refund
          - entities.FeeEvent.fields.amount_cents
          - state_machines.Membership.ACTIVE_to_CANCELLED
        distinguishing_aspect: |
          Different conserved quantity = net fee collected: cancelling on the same day as activation
          (remaining 365/365) fully refunds the signup fee, so sum of FeeEvent.amount_cents for the
          membership (SIGNUP +6000, CANCEL_REFUND -6000) nets to 0 — no fee drift.
        test_recipe:
          setup:
            - "BASIC plan annual_fee 6000. Member activated at clock 2026-03-01; cancelled same day (elapsed 0)."
          setup_api_calls:
            - call: "POST /plans"
              payload: { tier: "BASIC", annual_fee_cents: 6000, max_household_cards: 1, addon_fee_cents: 4000 }
              as: ClubAdmin
              captures: { basic_plan: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: ClubAdmin
            - call: "POST /memberships"
              payload: { plan_id: "${basic_plan}", primary_member_name: "Mem INV2", auto_renew: false }
              as: Anonymous
              captures: { m_id: $.data.id }
            - call: "POST /payments"
              payload: { membership_id: "${m_id}", purpose: "SIGNUP", outcome: "SUCCEEDED" }
              as: Member
              as_user_id: "${m_id}"
            - call: "GET /memberships/${m_id}"
              payload: {}
              as: Member
              as_user_id: "${m_id}"
              captures: { m_ver: $.data.version }
          trigger:
            - call: "POST /memberships/${m_id}/cancel"
              payload: { expected_membership_version: "${m_ver}" }
              as: Member
              as_user_id: "${m_id}"
          assert:
            - "FeeEvent for ${m_id} kind=CANCEL_REFUND amount_cents == -6000"
            - "sum of FeeEvent.amount_cents for ${m_id} == 0"
