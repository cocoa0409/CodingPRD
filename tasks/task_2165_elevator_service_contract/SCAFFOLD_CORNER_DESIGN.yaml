        distinguishing_aspect: "The role is correct but the identity is not: X-User-ID bm-other does not equal the target contract's building_manager_user_id bm-r2, so the call returns 403 ERR_NOT_CONTRACT_PARTY rather than ERR_UNAUTHORIZED."
