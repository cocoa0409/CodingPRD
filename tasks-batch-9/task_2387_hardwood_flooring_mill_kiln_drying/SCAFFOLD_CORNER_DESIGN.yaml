            - { call: "POST /mill/species-profiles", payload: { species_code: "RED_OAK", common_name: "Red Oak", density_class: "DENSE", tangential_shrinkage_coefficient: 0.145, target_moisture_pct: 7.0, max_moisture_gradient_pp: 2.0 }, as: MillAdmin, captures: { oak_id: "$.data.id", oak_v: "$.data.version" } }
            - { call: "POST /mill/species-profiles", payload: { species_code: "WHITE_ASH", common_name: "White Ash", density_class: "MEDIUM", tangential_shrinkage_coefficient: 0.150, target_moisture_pct: 7.0, max_moisture_gradient_pp: 2.0 }, as: MillAdmin, captures: { ash_id: "$.data.id", ash_v: "$.data.version" } }
            - { call: "POST /mill/species-profiles", payload: { species_code: "POPLAR", common_name: "Yellow Poplar", density_class: "SOFT", tangential_shrinkage_coefficient: 0.122, target_moisture_pct: 7.0, max_moisture_gradient_pp: 2.5 }, as: MillAdmin, captures: { poplar_id: "$.data.id", poplar_v: "$.data.version" } }
            - { call: "POST /mill/species-profiles", payload: { species_code: "HICKORY", common_name: "Hickory", density_class: "DENSE", tangential_shrinkage_coefficient: 0.181, target_moisture_pct: 6.0, max_moisture_gradient_pp: 1.5 }, as: MillAdmin, captures: { hickory_id: "$.data.id", hickory_v: "$.data.version" } }
          trigger:
            - { call: "POST /mill/drying-schedules", payload: { species_profile_id: "${oak_id}", schedule_code: "RO-100", thickness_in: 1.00, initial_moisture_pct: 45.0, final_moisture_pct: 7.0, conditioning_hours: 24, stress_relief_hours: 12, expected_species_profile_version: "${oak_v}" }, as: MillAdmin }
            - { call: "POST /mill/drying-schedules", payload: { species_profile_id: "${ash_id}", schedule_code: "WA-150", thickness_in: 1.50, initial_moisture_pct: 45.0, final_moisture_pct: 7.0, conditioning_hours: 12, stress_relief_hours: 6, expected_species_profile_version: "${ash_v}" }, as: MillAdmin }
            - { call: "POST /mill/drying-schedules", payload: { species_profile_id: "${poplar_id}", schedule_code: "PO-200", thickness_in: 2.00, initial_moisture_pct: 45.0, final_moisture_pct: 7.0, conditioning_hours: 24, stress_relief_hours: 12, expected_species_profile_version: "${poplar_v}" }, as: MillAdmin }
            - { call: "POST /mill/drying-schedules", payload: { species_profile_id: "${hickory_id}", schedule_code: "HI-200", thickness_in: 2.00, initial_moisture_pct: 60.0, final_moisture_pct: 6.0, conditioning_hours: 24, stress_relief_hours: 12, expected_species_profile_version: "${hickory_v}" }, as: MillAdmin }
          assert:
            - "RED_OAK 1.00 in (tier 1.00): data.planned_dry_hours == 265.0 ((96 + 3.5 * 38) * 1.00 + 36)."
            - "WHITE_ASH 1.50 in (tier 1.95): data.planned_dry_hours == 343.7 ((72 + 2.5 * 38) * 1.95 = 325.65, plus 18 = 343.65 -> 343.7)."
            - "POPLAR 2.00 in (tier 2.60): data.planned_dry_hours == 354.2 ((54 + 1.8 * 38) * 2.60 = 318.24, plus 36 = 354.24 -> 354.2)."
            - "HICKORY 2.00 in with a 54-point drop: data.planned_dry_hours == 360.0, the MAX_SCHEDULE_HOURS clamp applied to a raw 777.0."
            - "The clamped HICKORY schedule stores 360.0 exactly, not 777.0 and not 360 with a fractional remainder."

      - name: weighted_initial_moisture_excludes_unallocated_receipts
        claim_type: input_set_filtering
        grounds: ["calculations.weighted_initial_moisture", "entities.KilnCharge.weighted_initial_moisture_pct"]
        distinguishing_aspect: "Only receipts whose kiln_charge_id points at this charge and whose status is ALLOCATED count: a 2000 bf ACCEPTED receipt at 20.0 pct and a REJECTED receipt are both excluded, and the aggregate is null while the set is empty."
        test_recipe:
          setup: ["A SCHEDULED charge on a 12000 bf chamber, plus four RED_OAK receipts: 5800 at 46.0, 3900 at 44.0, 2000 at 20.0 (accepted, never allocated) and one rejected."]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-08-01T00:00:00.000Z" }, as: MillAdmin }
            - { call: "POST /mill/species-profiles", payload: { species_code: "RED_OAK", common_name: "Red Oak", density_class: "DENSE", tangential_shrinkage_coefficient: 0.145, target_moisture_pct: 7.0, max_moisture_gradient_pp: 2.0 }, as: MillAdmin, captures: { species_id: "$.data.id", species_v: "$.data.version" } }
            - { call: "POST /mill/drying-schedules", payload: { species_profile_id: "${species_id}", schedule_code: "RO-100", thickness_in: 1.00, initial_moisture_pct: 45.0, final_moisture_pct: 7.0, conditioning_hours: 24, stress_relief_hours: 12, expected_species_profile_version: "${species_v}" }, as: MillAdmin, captures: { sched_id: "$.data.id" } }
            - { call: "POST /mill/kiln-chambers", payload: { chamber_code: "K1", capacity_board_feet: 12000 }, as: MillAdmin, captures: { chamber_id: "$.data.id" } }
            - { call: "POST /mill/kiln-charges", payload: { drying_schedule_id: "${sched_id}", kiln_chamber_id: "${chamber_id}", planned_start_utc: "2026-08-05T00:00:00.000Z" }, as: KilnOperator, captures: { charge_a: "$.data.id" } }
            - { call: "POST /mill/green-receipts", payload: { species_profile_id: "${species_id}", supplier_name: "Ridgeline Logging", received_board_feet: 6000, receipt_grade: "FAS", moisture_pct_at_receipt: 46.0 }, as: ProcurementClerk, captures: { r1: "$.data.id" } }
            - { call: "POST /mill/green-receipts/${r1}/accept", payload: { accepted_board_feet: 5800 }, as: ProcurementClerk }
            - { call: "POST /mill/green-receipts", payload: { species_profile_id: "${species_id}", supplier_name: "Ridgeline Logging", received_board_feet: 4000, receipt_grade: "SELECT", moisture_pct_at_receipt: 44.0 }, as: ProcurementClerk, captures: { r2: "$.data.id" } }
            - { call: "POST /mill/green-receipts/${r2}/accept", payload: { accepted_board_feet: 3900 }, as: ProcurementClerk }
            - { call: "POST /mill/green-receipts", payload: { species_profile_id: "${species_id}", supplier_name: "Valley Sawmill", received_board_feet: 2000, receipt_grade: "NO1_COMMON", moisture_pct_at_receipt: 20.0 }, as: ProcurementClerk, captures: { r3: "$.data.id" } }
            - { call: "POST /mill/green-receipts/${r3}/accept", payload: { accepted_board_feet: 2000 }, as: ProcurementClerk }
            - { call: "POST /mill/green-receipts", payload: { species_profile_id: "${species_id}", supplier_name: "Valley Sawmill", received_board_feet: 1000, receipt_grade: "NO2_COMMON", moisture_pct_at_receipt: 30.0 }, as: ProcurementClerk, captures: { r4: "$.data.id" } }
            - { call: "POST /mill/green-receipts/${r4}/reject", payload: { rejection_reason: "Wet-stored blue stain" }, as: ProcurementClerk }
          trigger:
            - { call: "POST /mill/kiln-charges/${charge_a}/allocate_receipt", payload: { green_receipt_id: "${r1}" }, as: KilnOperator }
            - { call: "POST /mill/kiln-charges/${charge_a}/allocate_receipt", payload: { green_receipt_id: "${r2}" }, as: KilnOperator }
            - { call: "POST /mill/kiln-charges/${charge_a}/deallocate_receipt", payload: { green_receipt_id: "${r2}" }, as: KilnOperator }
            - { call: "POST /mill/kiln-charges/${charge_a}/deallocate_receipt", payload: { green_receipt_id: "${r1}" }, as: KilnOperator }
          assert:
            - "After the first allocate: data.charged_green_bf == 5800 and data.weighted_initial_moisture_pct == 46.0."
            - "After the second allocate: data.charged_green_bf == 9700 and data.weighted_initial_moisture_pct == 45.2 (438400 / 9700 = 45.195 -> 45.2)."
            - "The 2000 bf ACCEPTED receipt at 20.0 pct is excluded: including it would give 478400 / 11700 = 40.9, and the rejected receipt is excluded as well."
            - "After the first deallocate: data.charged_green_bf == 5800 and data.weighted_initial_moisture_pct == 46.0 again."
            - "After the second deallocate the input set is empty: data.charged_green_bf == 0 and data.weighted_initial_moisture_pct == null."
            - "GET /mill/green-receipts?status=ACCEPTED returns total_count 3 at the end - r1, r2 and the never-allocated r3."

