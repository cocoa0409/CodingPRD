      - name: commitment_with_no_shipped_pounds_defaults_with_fifteen_percent_penalty
        claim_type: tiered_pricing
        grounds:
          - calculations.commitment_settlement
          - state_machines.BuyerCommitment.OPEN_to_DEFAULTED
          - entities.BuyerCommitment.fields.shortfall_penalty_cents
        distinguishing_aspect: |
          The zero-shipment boundary settles into DEFAULTED, not SETTLED: revenue
          is 0, the penalty is the FULL commitment at 15% (220.00 lbs * 380
          cents * 0.15 = 12540 cents), and settled_net_cents is negative
          (-12540) with fill_pct 0.0000 and fill_status SHORTFALL.
        test_recipe:
          setup:
            - "One OPEN buyer commitment for 220.00 lbs of STRAWBERRY at 380 cents/lb, shelf-life guarantee 5 days, delivery window 2026-08-01 .. 2026-08-05, with no allocations at all."
