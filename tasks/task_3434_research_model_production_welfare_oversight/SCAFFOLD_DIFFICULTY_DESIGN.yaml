# =============================================================================
# 1.8 Scaffold Difficulty Design (Test Targeting Index)
# =============================================================================
# Every instance grounds in SCAFFOLD.yaml 1.1-1.7 and is replay-checked against
# the 1.5 endpoint table. Logical clock default: 2026-09-01T00:00:00Z.
scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: colony_forecast_projected_vs_confirmed
        grounds:
          - calculations.colony_availability_forecast
          - entities.Colony.fields.projected_pipeline_count
          - entities.Colony.fields.confirmed_available_count
        distinguishing_aspect: |
          Colony production domain: with identical colony data (10 breeding pairs,
          one WEANED cohort, lifecycle PRODUCTION, genetic CLEAR) the PROJECTED
          variant adds the expected-litter term while CONFIRMED_ONLY counts only
          free animals in HOLD/PARTIALLY_ALLOCATED cohorts, yielding 48 vs 0.
        test_recipe:
          setup:
            - "VF room (capacity 100) in a REGISTERED facility"
            - "INBRED IMMUNOCOMPETENT MOUSE strain, typical_litter_size 6, min_barrier MPF, base 1000 cents"
            - "APPROVED protocol (quota 1000) at the facility"
            - "Colony with 10 breeding pairs advanced FOUNDING->EXPANDING->PRODUCTION with one WEANED cohort of 10M/10F"
          setup_api_calls:
            - call: "POST /api/facilities"
              payload: { name: "Site Alpha", site_code: "SA", registration_number: "REG-001", registration_expires_at: "2027-09-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { fac_id: $.data.id }
            - call: "POST /api/rooms"
              payload: { facility_id: "${fac_id}", room_code: "R1", barrier_level: "VF", excluded_agents: ["MHV", "MPV"], cage_capacity: 100 }
              as: FacilityManager
              captures: { room_id: $.data.id }
            - call: "POST /api/strains"
              payload: { strain_code: "C57BL6J", species: "MOUSE", immune_class: "IMMUNOCOMPETENT", breeding_type: "INBRED", min_barrier_level: "MPF", gestation_days: 21, wean_age_days: 21, typical_litter_size: 6, base_price_cents: 1000 }
              as: PlatformAdmin
              captures: { strain_id: $.data.id }
            - call: "POST /api/protocols"
              payload: { facility_id: "${fac_id}", protocol_number: "P-100", pi_name: "Dr. Xu", species: "MOUSE", approved_animal_quota: 1000, effective_date: "2026-09-01T00:00:00Z", expiration_date: "2029-09-01T00:00:00Z" }
              as: FacilityManager
              as_user_id: "fm_1"
              captures: { prot_id: $.data.id }
            - call: "POST /api/protocols/${prot_id}/transition"
              payload: { target_state: "SUBMITTED" }
              as: FacilityManager
              as_user_id: "fm_1"
            - call: "POST /api/protocols/${prot_id}/transition"
              payload: { target_state: "UNDER_REVIEW" }
              as: IACUCReviewer
              as_user_id: "rev_1"
            - call: "POST /api/protocols/${prot_id}/transition"
              payload: { target_state: "APPROVED" }
              as: IACUCReviewer
              as_user_id: "rev_1"
            - call: "POST /api/colonies"
              payload: { room_id: "${room_id}", strain_id: "${strain_id}", protocol_id: "${prot_id}", breeding_pair_count: 10 }
              as: FacilityManager
              captures: { col_id: $.data.id }
            - call: "POST /api/colonies/${col_id}/transition"
              payload: { target_state: "EXPANDING" }
              as: FacilityManager
            - call: "POST /api/cohorts"
              payload: { colony_id: "${col_id}", birth_date: "2026-09-01T00:00:00Z", count_male: 10, count_female: 10, avg_weight_g_male: 20.0, avg_weight_g_female: 20.0 }
              as: FacilityManager
            - call: "POST /api/colonies/${col_id}/transition"
              payload: { target_state: "PRODUCTION" }
              as: FacilityManager
          trigger:
            - call: "GET /api/colonies/${col_id}"
              as: FacilityManager
          assert:
            - "Colony.${col_id}.projected_pipeline_count == 48  (0 confirmed + floor(10*6*0.8))"
            - "Colony.${col_id}.confirmed_available_count == 0  (the WEANED cohort is excluded from the CONFIRMED_ONLY input set)"
            - "Colony.${col_id}.lifecycle_status == PRODUCTION"

      - name: customer_exposure_gross_vs_net
        grounds:
          - calculations.customer_credit_positions
          - entities.Customer.fields.credit_exposure_cents
          - entities.Customer.fields.outstanding_balance_cents
        distinguishing_aspect: |
          Customer credit domain (different entity domain than the colony
          forecast): identical order data yields GROSS exposure 50000 cents
          (SOURCING + DELIVERED pipeline) vs NET_BILLED 20000 cents (DELIVERED
          only) — the two variants must diverge.
        test_recipe:
          setup:
            - "Base production chain: REGISTERED facility, VF room, strain (base 1000 cents, IMMUNOCOMPETENT, min MPF), APPROVED protocol, PRODUCTION colony (10 pairs), HOLD cohort 20M/20F born 2026-09-01"
            - "Customer with credit_limit_cents 1000000"
            - "Order1 for 10M/10F fully delivered and accepted (quote 20000)"
            - "Order2 for 15M/15F in SOURCING (quote 30000)"
          setup_api_calls:
            - call: "POST /api/facilities"
              payload: { name: "Site Alpha", site_code: "SA", registration_number: "REG-001", registration_expires_at: "2027-09-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { fac_id: $.data.id }
            - call: "POST /api/rooms"
              payload: { facility_id: "${fac_id}", room_code: "R1", barrier_level: "VF", excluded_agents: ["MHV", "MPV"], cage_capacity: 100 }
              as: FacilityManager
              captures: { room_id: $.data.id }
            - call: "POST /api/strains"
              payload: { strain_code: "C57BL6J", species: "MOUSE", immune_class: "IMMUNOCOMPETENT", breeding_type: "INBRED", min_barrier_level: "MPF", gestation_days: 21, wean_age_days: 21, typical_litter_size: 6, base_price_cents: 1000 }
              as: PlatformAdmin
              captures: { strain_id: $.data.id }
            - call: "POST /api/protocols"
              payload: { facility_id: "${fac_id}", protocol_number: "P-100", pi_name: "Dr. Xu", species: "MOUSE", approved_animal_quota: 1000, effective_date: "2026-09-01T00:00:00Z", expiration_date: "2029-09-01T00:00:00Z" }
              as: FacilityManager
              as_user_id: "fm_1"
              captures: { prot_id: $.data.id }
            - call: "POST /api/protocols/${prot_id}/transition"
              payload: { target_state: "SUBMITTED" }
              as: FacilityManager
              as_user_id: "fm_1"
            - call: "POST /api/protocols/${prot_id}/transition"
              payload: { target_state: "UNDER_REVIEW" }
              as: IACUCReviewer
              as_user_id: "rev_1"
            - call: "POST /api/protocols/${prot_id}/transition"
              payload: { target_state: "APPROVED" }
              as: IACUCReviewer
              as_user_id: "rev_1"
            - call: "POST /api/colonies"
              payload: { room_id: "${room_id}", strain_id: "${strain_id}", protocol_id: "${prot_id}", breeding_pair_count: 10 }
              as: FacilityManager
              captures: { col_id: $.data.id }
            - call: "POST /api/colonies/${col_id}/transition"
              payload: { target_state: "EXPANDING" }
              as: FacilityManager
            - call: "POST /api/cohorts"
              payload: { colony_id: "${col_id}", birth_date: "2026-09-01T00:00:00Z", count_male: 20, count_female: 20, avg_weight_g_male: 20.0, avg_weight_g_female: 20.0 }
              as: FacilityManager
              captures: { coh_id: $.data.id }
            - call: "POST /api/colonies/${col_id}/transition"
              payload: { target_state: "PRODUCTION" }
              as: FacilityManager
            - call: "POST /api/cohorts/${coh_id}/transition"
              payload: { target_state: "HOLD" }
              as: FacilityManager
            - call: "POST /api/customers"
              payload: { institution_name: "Inst A", account_number: "ACCT-1", credit_limit_cents: 1000000, accepted_min_health_status: "MPF", is_commercial: false }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /api/orders"
              payload: { strain_id: "${strain_id}", quantity_male: 10, quantity_female: 10, min_age_weeks: 4, max_age_weeks: 6, min_weight_g: 18.0, max_weight_g: 22.0, required_delivery_date: "2026-10-13T12:00:00Z" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { o1_id: $.data.id }
            - call: "POST /api/orders/${o1_id}/transition"
              payload: { target_state: "SOURCING" }
              as: FacilityManager
              captures: { o1_v2: $.data.version }
            - call: "POST /api/allocations"
              payload: { order_id: "${o1_id}", cohort_id: "${coh_id}", qty_male: 10, qty_female: 10, expected_order_version: "${o1_v2}" }
              as: FacilityManager
              captures: { alloc1_id: $.data.id }
            - call: "GET /api/orders/${o1_id}"
              as: FacilityManager
              captures: { o1_v3: $.data.version }
            - call: "POST /api/shipments"
              payload: { order_id: "${o1_id}", vehicle_code: "VH1", vehicle_barrier_cert: "VF", sanitized_at: "2026-10-12T06:00:00Z", departure_date: "2026-10-12T08:00:00Z", planned_arrival_date: "2026-10-13T08:00:00Z", expected_order_version: "${o1_v3}" }
              as: LogisticsCoordinator
              captures: { ship1_id: $.data.id }
            - call: "POST /api/shipments/${ship1_id}/transition"
              payload: { target_state: "LOADED" }
              as: LogisticsCoordinator
            - call: "POST /api/shipments/${ship1_id}/transition"
              payload: { target_state: "IN_TRANSIT" }
              as: LogisticsCoordinator
            - call: "POST /api/shipments/${ship1_id}/transition"
              payload: { target_state: "ARRIVED" }
              as: LogisticsCoordinator
            - call: "POST /api/shipments/${ship1_id}/transition"
              payload: { target_state: "ACCEPTED", received_male: 10, received_female: 10 }
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /api/orders"
              payload: { strain_id: "${strain_id}", quantity_male: 15, quantity_female: 15, min_age_weeks: 4, max_age_weeks: 6, min_weight_g: 18.0, max_weight_g: 22.0, required_delivery_date: "2026-10-13T12:00:00Z" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { o2_id: $.data.id }
            - call: "POST /api/orders/${o2_id}/transition"
              payload: { target_state: "SOURCING" }
              as: FacilityManager
          trigger:
            - call: "GET /api/customers/${cust_id}"
              as: PlatformAdmin
          assert:
            - "Customer.${cust_id}.outstanding_balance_cents == 20000  (NET_BILLED: only DELIVERED order1)"
            - "Customer.${cust_id}.credit_exposure_cents == 50000  (GROSS: DELIVERED 20000 + SOURCING 30000)"
            - "CustomerOrder.${o1_id}.status == DELIVERED"
            - "CustomerOrder.${o2_id}.status == SOURCING"

  - rule_id: combinatorial_formula
    instances:
      - name: order_quote_tiered_surcharge_stacking
        grounds:
          - calculations.order_quote
          - entities.CustomerOrder.fields.quoted_total_cents
        distinguishing_aspect: |
          Mode (a) combinatorial: 4 inputs (quantity, tier table, immune_class,
          min_health_status) with a tier branch and two conditional surcharges;
          the pinned evaluation order (tier discount rounded, then surcharges
          rounded) yields exactly 156600 cents, while discounting after
          surcharging or skipping the intermediate rounding yields 156000 or
          other values.
        test_recipe:
          setup:
            - "IMMUNOCOMPROMISED strain, base_price_cents 1000, min_barrier VF, in a VF room"
            - "PRODUCTION colony with 25 breeding pairs (PROJECTED availability floor(25*6*0.8) = 120)"
            - "Customer credit_limit_cents 1000000"
            - "Order: 60M/60F (= 120 animals, tier TIER1 -10%), min_health_status VF (+20%), ages 4-6, weights 18-22, delivery 2026-10-13T12:00:00Z"
          setup_api_calls:
            - call: "POST /api/facilities"
              payload: { name: "Site Alpha", site_code: "SA", registration_number: "REG-001", registration_expires_at: "2027-09-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { fac_id: $.data.id }
            - call: "POST /api/rooms"
              payload: { facility_id: "${fac_id}", room_code: "R1", barrier_level: "VF", excluded_agents: ["MHV", "MPV"], cage_capacity: 100 }
              as: FacilityManager
              captures: { room_id: $.data.id }
            - call: "POST /api/strains"
              payload: { strain_code: "NSG", species: "MOUSE", immune_class: "IMMUNOCOMPROMISED", breeding_type: "INBRED", min_barrier_level: "VF", gestation_days: 21, wean_age_days: 21, typical_litter_size: 6, base_price_cents: 1000 }
              as: PlatformAdmin
              captures: { strain_id: $.data.id }
            - call: "POST /api/protocols"
              payload: { facility_id: "${fac_id}", protocol_number: "P-100", pi_name: "Dr. Xu", species: "MOUSE", approved_animal_quota: 1000, effective_date: "2026-09-01T00:00:00Z", expiration_date: "2029-09-01T00:00:00Z" }
              as: FacilityManager
              as_user_id: "fm_1"
              captures: { prot_id: $.data.id }
            - call: "POST /api/protocols/${prot_id}/transition"
              payload: { target_state: "SUBMITTED" }
              as: FacilityManager
              as_user_id: "fm_1"
            - call: "POST /api/protocols/${prot_id}/transition"
              payload: { target_state: "UNDER_REVIEW" }
              as: IACUCReviewer
              as_user_id: "rev_1"
            - call: "POST /api/protocols/${prot_id}/transition"
              payload: { target_state: "APPROVED" }
              as: IACUCReviewer
              as_user_id: "rev_1"
            - call: "POST /api/colonies"
              payload: { room_id: "${room_id}", strain_id: "${strain_id}", protocol_id: "${prot_id}", breeding_pair_count: 25 }
              as: FacilityManager
              captures: { col_id: $.data.id }
            - call: "POST /api/colonies/${col_id}/transition"
              payload: { target_state: "EXPANDING" }
              as: FacilityManager
            - call: "POST /api/cohorts"
              payload: { colony_id: "${col_id}", birth_date: "2026-09-01T00:00:00Z", count_male: 5, count_female: 5, avg_weight_g_male: 20.0, avg_weight_g_female: 20.0 }
              as: FacilityManager
            - call: "POST /api/colonies/${col_id}/transition"
              payload: { target_state: "PRODUCTION" }
              as: FacilityManager
            - call: "POST /api/customers"
              payload: { institution_name: "Inst A", account_number: "ACCT-1", credit_limit_cents: 1000000, accepted_min_health_status: "MPF", is_commercial: false }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /api/orders"
              payload: { strain_id: "${strain_id}", quantity_male: 60, quantity_female: 60, min_age_weeks: 4, max_age_weeks: 6, min_weight_g: 18.0, max_weight_g: 22.0, required_delivery_date: "2026-10-13T12:00:00Z", min_health_status: "VF" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { ord_id: $.data.id }
          trigger:
            - call: "POST /api/orders/${ord_id}/transition"
              payload: { target_state: "SOURCING" }
              as: FacilityManager
          assert:
            - "CustomerOrder.${ord_id}.status == SOURCING"
            - "CustomerOrder.${ord_id}.quoted_total_cents == 156600  (120*1000=120000; tier -10% -> 108000; surcharges 0.25+0.20=0.45 -> ROUND_HALF_UP(108000*1.45)=156600)"

      - name: shipment_box_count_per_line_ceil_then_sum
        grounds:
          - calculations.shipment_box_count
          - entities.Shipment.fields.box_count
        distinguishing_aspect: |
          Mode (b) nested rounding (different mode than the quote instance):
          ceiling is applied per (allocation, sex) line BEFORE summation, giving
          5 boxes; the rejected sum-then-ceil order would give 4 boxes for the
          same 20 animals at the same weight tier.
        test_recipe:
          setup:
            - "PRODUCTION colony (10 pairs) in VF room with two HOLD cohorts of 10M/10F each, both averaging 20.0 g (STANDARD tier, 6 per box), born 2026-09-01"
            - "Order for 17M/3F fully covered by allocation A1 = 7M/3F on cohort A and A2 = 10M/0F on cohort B"
          setup_api_calls:
            - call: "POST /api/facilities"
              payload: { name: "Site Alpha", site_code: "SA", registration_number: "REG-001", registration_expires_at: "2027-09-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { fac_id: $.data.id }
            - call: "POST /api/rooms"
              payload: { facility_id: "${fac_id}", room_code: "R1", barrier_level: "VF", excluded_agents: ["MHV", "MPV"], cage_capacity: 100 }
              as: FacilityManager
              captures: { room_id: $.data.id }
            - call: "POST /api/strains"
              payload: { strain_code: "C57BL6J", species: "MOUSE", immune_class: "IMMUNOCOMPETENT", breeding_type: "INBRED", min_barrier_level: "MPF", gestation_days: 21, wean_age_days: 21, typical_litter_size: 6, base_price_cents: 1000 }
              as: PlatformAdmin
              captures: { strain_id: $.data.id }
            - call: "POST /api/protocols"
              payload: { facility_id: "${fac_id}", protocol_number: "P-100", pi_name: "Dr. Xu", species: "MOUSE", approved_animal_quota: 1000, effective_date: "2026-09-01T00:00:00Z", expiration_date: "2029-09-01T00:00:00Z" }
              as: FacilityManager
              as_user_id: "fm_1"
              captures: { prot_id: $.data.id }
            - call: "POST /api/protocols/${prot_id}/transition"
              payload: { target_state: "SUBMITTED" }
              as: FacilityManager
              as_user_id: "fm_1"
            - call: "POST /api/protocols/${prot_id}/transition"
              payload: { target_state: "UNDER_REVIEW" }
              as: IACUCReviewer
              as_user_id: "rev_1"
            - call: "POST /api/protocols/${prot_id}/transition"
              payload: { target_state: "APPROVED" }
              as: IACUCReviewer
              as_user_id: "rev_1"
            - call: "POST /api/colonies"
              payload: { room_id: "${room_id}", strain_id: "${strain_id}", protocol_id: "${prot_id}", breeding_pair_count: 10 }
              as: FacilityManager
              captures: { col_id: $.data.id }
            - call: "POST /api/colonies/${col_id}/transition"
              payload: { target_state: "EXPANDING" }
              as: FacilityManager
            - call: "POST /api/cohorts"
              payload: { colony_id: "${col_id}", birth_date: "2026-09-01T00:00:00Z", count_male: 10, count_female: 10, avg_weight_g_male: 20.0, avg_weight_g_female: 20.0 }
              as: FacilityManager
              captures: { coh_a: $.data.id }
            - call: "POST /api/colonies/${col_id}/transition"
              payload: { target_state: "PRODUCTION" }
              as: FacilityManager
            - call: "POST /api/cohorts"
              payload: { colony_id: "${col_id}", birth_date: "2026-09-01T00:00:00Z", count_male: 10, count_female: 10, avg_weight_g_male: 20.0, avg_weight_g_female: 20.0 }
              as: FacilityManager
              captures: { coh_b: $.data.id }
            - call: "POST /api/cohorts/${coh_a}/transition"
              payload: { target_state: "HOLD" }
              as: FacilityManager
            - call: "POST /api/cohorts/${coh_b}/transition"
              payload: { target_state: "HOLD" }
              as: FacilityManager
            - call: "POST /api/customers"
              payload: { institution_name: "Inst A", account_number: "ACCT-1", credit_limit_cents: 100000, accepted_min_health_status: "MPF", is_commercial: false }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /api/orders"
              payload: { strain_id: "${strain_id}", quantity_male: 17, quantity_female: 3, min_age_weeks: 4, max_age_weeks: 6, min_weight_g: 18.0, max_weight_g: 22.0, required_delivery_date: "2026-10-13T12:00:00Z" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { ord_id: $.data.id }
            - call: "POST /api/orders/${ord_id}/transition"
              payload: { target_state: "SOURCING" }
              as: FacilityManager
              captures: { o_v2: $.data.version }
            - call: "POST /api/allocations"
              payload: { order_id: "${ord_id}", cohort_id: "${coh_a}", qty_male: 7, qty_female: 3, expected_order_version: "${o_v2}" }
              as: FacilityManager
            - call: "GET /api/orders/${ord_id}"
              as: FacilityManager
              captures: { o_v3: $.data.version }
            - call: "POST /api/allocations"
              payload: { order_id: "${ord_id}", cohort_id: "${coh_b}", qty_male: 10, qty_female: 0, expected_order_version: "${o_v3}" }
              as: FacilityManager
            - call: "GET /api/orders/${ord_id}"
              as: FacilityManager
              captures: { o_v4: $.data.version }
          trigger:
            - call: "POST /api/shipments"
              payload: { order_id: "${ord_id}", vehicle_code: "VH1", vehicle_barrier_cert: "VF", sanitized_at: "2026-10-12T06:00:00Z", departure_date: "2026-10-12T08:00:00Z", planned_arrival_date: "2026-10-13T08:00:00Z", expected_order_version: "${o_v4}" }
              as: LogisticsCoordinator
              captures: { ship_id: $.data.id }
          assert:
            - "Shipment.${ship_id}.box_count == 5  (ceil(7/6)+ceil(3/6) = 3 on A1, ceil(10/6) = 2 on A2)"
            - "CustomerOrder.${ord_id}.status == SCHEDULED"
            - "Shipment.${ship_id}.status == PLANNED"

  - rule_id: non_linear_state_machine
    instances:
      - name: colony_parallel_lifecycle_genetic_dimensions
        grounds:
          - state_machines.Colony
          - entities.Colony.fields.lifecycle_status
          - entities.Colony.fields.genetic_status
        distinguishing_aspect: |
          One entity carries two independent state dimensions: the clock sweep
          flips genetic_status CLEAR -> PANEL_DUE while lifecycle_status stays
          PRODUCTION, proving the dimensions evolve independently (parallel
          shape), unlike a single linear pipeline.
        test_recipe:
          setup:
            - "PRODUCTION colony (10 pairs, one WEANED cohort) created at the default clock 2026-09-01T00:00:00Z with default snp_panel_interval_weeks 12 (panel due after 2026-11-24)"
          setup_api_calls:
            - call: "POST /api/facilities"
              payload: { name: "Site Alpha", site_code: "SA", registration_number: "REG-001", registration_expires_at: "2027-09-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { fac_id: $.data.id }
            - call: "POST /api/rooms"
              payload: { facility_id: "${fac_id}", room_code: "R1", barrier_level: "VF", excluded_agents: ["MHV", "MPV"], cage_capacity: 100 }
              as: FacilityManager
              captures: { room_id: $.data.id }
            - call: "POST /api/strains"
              payload: { strain_code: "C57BL6J", species: "MOUSE", immune_class: "IMMUNOCOMPETENT", breeding_type: "INBRED", min_barrier_level: "MPF", gestation_days: 21, wean_age_days: 21, typical_litter_size: 6, base_price_cents: 1000 }
              as: PlatformAdmin
              captures: { strain_id: $.data.id }
            - call: "POST /api/protocols"
              payload: { facility_id: "${fac_id}", protocol_number: "P-100", pi_name: "Dr. Xu", species: "MOUSE", approved_animal_quota: 1000, effective_date: "2026-09-01T00:00:00Z", expiration_date: "2029-09-01T00:00:00Z" }
              as: FacilityManager
              as_user_id: "fm_1"
              captures: { prot_id: $.data.id }
            - call: "POST /api/protocols/${prot_id}/transition"
