          assert:
            - "${k_dg_over} == \"ERR_DOSE_EXCEEDS_VIAL_FILL\" and ${k_dg_zero} == \"ERR_DOSE_EXCEEDS_VIAL_FILL\", both HTTP 422"
            - "${k_dg_prep} == \"ERR_PREP_ATTESTATION_REQUIRED\" with HTTP 422"
            - "${k_dg_ok} == DOCUMENTED and the vial is ADMINISTERED exactly once"
            - "${k_dg_sod} == \"ERR_SEGREGATION_OF_DUTIES\" with HTTP 403 — priority 9 wins over the wrong 0.2 ml volume"
            - "${k_dg_mismatch} == \"ERR_ATTESTED_WASTAGE_MISMATCH\" with HTTP 422 (computed wasted_ml is 0.21 to three decimals)"
            - "${k_dg_attested} == ATTESTED with attested_by_clinician_id == ${k_cl2_id}"

      - name: corner_coverage_gates_separate_a_missing_policy_from_an_excluded_drug
