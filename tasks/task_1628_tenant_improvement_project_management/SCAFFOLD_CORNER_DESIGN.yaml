            - "Different-id approve: DisbursementRequest.${d1}.status == APPROVED"

  # =====================================================================
  # Section: cross-cutting complexity layers — OCC stale version
  # =====================================================================
  - section: cross_cutting_layers
    instances:
      - name: occ_work_letter_counter_stale_version_rejected
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[work-letter-counter-stale-version]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "Countering with a WorkLetter version captured before the landlord's re-proposal (which advanced the version) is rejected with ERR_STALE_VERSION 412; re-reading and retrying with the fresh version succeeds."
        test_recipe:
          setup: ["WorkLetter PROPOSED at version V; client holds V; landlord's counter via /counter advances the letter to COUNTERED then /propose returns it to PROPOSED at V+2... simplified: tenant reads version, PM counters (bumping version), tenant's counter with the old version is stale"]
          setup_api_calls:
            - call: "POST /api/properties"
              payload: { name: "P", address: "1 St" }
              as: LandlordPM
              captures: { prop_id: $.data.id }
            - call: "POST /api/properties/${prop_id}/lease-spaces"
              payload: { suite_number: "1", floor: 1, rentable_sqft: 1000 }
              as: LandlordPM
              captures: { space_id: $.data.id }
            - call: "POST /api/tenants"
              payload: { legal_name: "T", contact_email: "t@x.example", tax_id: "TX" }
              as: LandlordPM
              captures: { tenant_id: $.data.id }
            - call: "POST /api/leases"
              payload: { space_id: "${space_id}", tenant_id: "${tenant_id}", base_rent_annual_cents: 36500000, scheduled_rent_commencement_date: "2026-10-01T00:00:00Z", lease_term_months: 60 }
              as: LandlordPM
              captures: { lease_id: $.data.id }
            - call: "POST /api/leases/${lease_id}/activate"
              as: LandlordPM
            - call: "POST /api/leases/${lease_id}/ti-projects"
              payload: { project_name: "TI", base_contract_cents: 40000000 }
              as: LandlordPM
              captures: { proj_id: $.data.id }
            - call: "POST /api/ti-projects/${proj_id}/work-letters"
              payload: { scope_description: "v1", allowance_offer_cents: 45000000, work_delineation: "LANDLORD" }
              as: LandlordPM
              captures: { wl_id: $.data.id }
            - call: "POST /api/work-letters/${wl_id}/propose"
              as: LandlordPM
            - call: "GET /api/work-letters/${wl_id}"
              as: TenantRep
              as_user_id: "${tenant_id}"
              captures: { wl_v_observed: $.data.version }
            - call: "POST /api/work-letters/${wl_id}/counter"
              payload: { scope_description: "v2 tenant counter", allowance_offer_cents: 48000000, work_delineation: "SPLIT", expected_work_letter_version: "${wl_v_observed}" }
              as: TenantRep
              as_user_id: "${tenant_id}"
            - call: "POST /api/work-letters/${wl_id}/propose"
              as: LandlordPM
          trigger:
            - call: "POST /api/work-letters/${wl_id}/counter"
              payload: { scope_description: "v3 stale counter", allowance_offer_cents: 49000000, work_delineation: "SPLIT", expected_work_letter_version: "${wl_v_observed}" }
              as: TenantRep
              as_user_id: "${tenant_id}"
              captures: { err: $.data.error_id }
            - call: "GET /api/work-letters/${wl_id}"
              as: LandlordPM
              captures: { wl_v_fresh: $.data.version }
            - call: "POST /api/work-letters/${wl_id}/counter"
              payload: { scope_description: "v3 fresh counter", allowance_offer_cents: 49000000, work_delineation: "SPLIT", expected_work_letter_version: "${wl_v_fresh}" }
              as: TenantRep
              as_user_id: "${tenant_id}"
              captures: { st: $.data.status }
          assert:
            - "Stale counter: error_id == ERR_STALE_VERSION, HTTP 412"
            - "Fresh counter after re-read succeeds: WorkLetter.${wl_id}.status == COUNTERED and round_number == 2"
      - name: occ_disbursement_create_stale_project_rejected
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[disbursement-create-stale-project]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "Creating a draw with a TIProject version captured before an intervening CO creation (which bumped project version) fails with ERR_STALE_VERSION 412."
        test_recipe:
