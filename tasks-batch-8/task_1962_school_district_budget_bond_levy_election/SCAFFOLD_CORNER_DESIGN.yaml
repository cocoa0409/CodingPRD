              captures: { bv: $.data.id }
            - call: "POST /district/budget-versions/${bv}/budget-lines"
              payload: { fund_code: "EDUCATION", function_code: "1100", object_code: "100", cost_center: "DISTRICT", appropriation_amount: 12000000 }
              as: BudgetAnalyst
            - call: "POST /district/budget-versions/${bv}/budget-lines"
              payload: { fund_code: "OPERATIONS", function_code: "2500", object_code: "300", cost_center: "DISTRICT", appropriation_amount: 6000000 }
              as: BudgetAnalyst
            - call: "POST /district/budget-versions/${bv}/budget-lines"
              payload: { fund_code: "TRANSPORTATION", function_code: "2550", object_code: "300", cost_center: "DISTRICT", appropriation_amount: 2000000 }
