scaffold_difficulty_design:

  # =========================================================================
  # Rule 1 — Dual-variant calculations across different entity domains
  # =========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: refund_provisional_vs_final_on_booking
        grounds:
          - calculations.cancellation_refund
          - state_machines.Booking.CONFIRMED_to_CANCELLED
          - state_machines.ClassSession.LOCKED_to_COMPLETED
          - entities.Booking.fields.refilled_from_waitlist
        distinguishing_aspect: |
          On the Booking domain, the PROVISIONAL refund (computed forward-looking at
          cancel time, tier 75% of 9000 minus 300 = 6450) diverges from the FINAL refund
          (computed chronologically at completion once the freed seat is known refilled =
          9000 minus 300 = 8700); the divergence is on Booking.refund_cents, a Booking-domain field.
        test_recipe:
          setup:
            - "Published template (INTERMEDIATE, base 8500), an OPEN GROUP session planned_seats=2 with one ingredient line"
            - "Member A holds a CONFIRMED 1-seat booking (charge 9000) paid to card; Member B is WAITING with a 1-seat entry"
            - "Clock at 2026-06-25T00:00:00Z; session start_at 2026-06-29T04:00:00Z (100h before)"
          setup_api_calls:
            - call: "POST /culinary/instructors"
              payload: { full_name: "Chef I", email: "chef.i@x.com", max_skill_level: "PROFESSIONAL" }
              as: StudioAdmin
              captures: { instr_id: $.data.id }
            - call: "POST /culinary/members"
              payload: { full_name: "Mem A", email: "a@x.com" }
              as: StudioAdmin
              captures: { mem_a: $.data.id }
            - call: "POST /culinary/members"
              payload: { full_name: "Mem B", email: "b@x.com" }
              as: StudioAdmin
              captures: { mem_b: $.data.id }
            - call: "POST /culinary/templates"
              payload: { title: "Pasta", skill_level: "INTERMEDIATE", base_price_cents: 8500, default_capacity: 2, station_fixed_cost_cents: 6000, prep_minutes: 60, cleanup_minutes: 30 }
              as: StudioAdmin
              captures: { tmpl_id: $.data.id }
            - call: "POST /culinary/templates/${tmpl_id}/publish"
              payload: {}
              as: StudioAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-25T00:00:00Z" }
              as: StudioAdmin
            - call: "POST /culinary/sessions"
              payload: { template_id: "${tmpl_id}", instructor_id: "${instr_id}", station_id: "ST1", event_type: "GROUP", start_at: "2026-06-29T04:00:00Z", end_at: "2026-06-29T06:00:00Z", planned_seats: 2 }
              as: StudioAdmin
              captures: { sess_id: $.data.id }
            - call: "POST /culinary/sessions/${sess_id}/ingredient-lines"
              payload: { name: "flour", qty_per_seat: 0.125, unit_cost_cents: 322 }
              as: Instructor
              as_user_id: "${instr_id}"
            - call: "POST /culinary/sessions/${sess_id}/open"
              payload: {}
              as: Instructor
              as_user_id: "${instr_id}"
            - call: "POST /culinary/bookings"
              payload: { session_id: "${sess_id}", member_id: "${mem_a}", seats_requested: 1 }
              as: Member
              as_user_id: "${mem_a}"
              captures: { bk_a: $.data.id }
            - call: "GET /culinary/sessions/${sess_id}"
              payload: {}
              as: StudioAdmin
              captures: { occ_sv_1: $.data.version }
            - call: "POST /culinary/bookings/${bk_a}/confirm"
              payload: { expected_session_version: "${occ_sv_1}" }
              as: Member
              as_user_id: "${mem_a}"
            - call: "GET /culinary/sessions/${sess_id}"
              payload: {}
              as: StudioAdmin
              captures: { sess_v_after_a: $.data.version }
            - call: "POST /culinary/bookings"
              payload: { session_id: "${sess_id}", member_id: "${mem_b}", seats_requested: 1 }
              as: Member
              as_user_id: "${mem_b}"
              captures: { bk_b: $.data.id }
            - call: "POST /culinary/bookings/${bk_b}/confirm"
              payload: { expected_session_version: "${sess_v_after_a}" }
              as: Member
              as_user_id: "${mem_b}"
            - call: "POST /culinary/sessions/${sess_id}/waitlist"
              payload: { member_id: "${mem_b}", seats_requested: 1 }
              as: Member
              as_user_id: "${mem_b}"
              captures: { wl_b: $.data.id }
          trigger:
            - call: "POST /culinary/bookings/${bk_a}/cancel"
              payload: {}
              as: Member
              as_user_id: "${mem_a}"
              captures: { refund_prov: $.data.refund_cents }
          assert:
            - "Booking.${bk_a}.refund_cents == 6450"
            - "Booking.${bk_a}.lifecycle_status == CANCELLED"
            - "Booking.${bk_a}.refilled_from_waitlist == false"
        # NOTE: Member B already CONFIRMED holds seat 2; once A is CONFIRMED session is FULL (2/2),
        # B then joins the waitlist (FULL). Cancel of A frees a seat; B's WAITING entry is promoted,
        # setting refilled_from_waitlist=true, but PROVISIONAL still reports 6450. FINAL reconciliation
        # to 8700 happens at completion (covered by the variant_selection corner instance).

      - name: reliability_provisional_vs_final_on_member
        grounds:
          - calculations.member_reliability_score
          - state_machines.Booking.CONFIRMED_to_NO_SHOW
          - state_machines.ClassSession.LOCKED_to_COMPLETED
          - entities.Member.fields.reliability_score
        distinguishing_aspect: |
          On the Member domain, PROVISIONAL reliability (read before completion: only SETTLED
          strikes count, so a pending NO_SHOW leaves score 100) diverges from FINAL reliability
          (computed at completion after the strike SETTLES: 100 - 25 = 75); the divergence is on
          Member.reliability_score, a Member-domain field distinct from the Booking refund above.
        test_recipe:
          setup:
            - "Published template, a LOCKED GROUP session, Member M holds a CONFIRMED booking just marked NO_SHOW (strike PENDING)"
          setup_api_calls:
            - call: "POST /culinary/instructors"
              payload: { full_name: "Chef J", email: "chef.j@x.com", max_skill_level: "ADVANCED" }
              as: StudioAdmin
              captures: { instr_id: $.data.id }
            - call: "POST /culinary/members"
              payload: { full_name: "Mem M", email: "m@x.com" }
              as: StudioAdmin
              captures: { mem_m: $.data.id }
            - call: "POST /culinary/templates"
              payload: { title: "Knife", skill_level: "ADVANCED", base_price_cents: 8500, default_capacity: 3, station_fixed_cost_cents: 6000, prep_minutes: 30, cleanup_minutes: 0 }
              as: StudioAdmin
              captures: { tmpl_id: $.data.id }
            - call: "POST /culinary/templates/${tmpl_id}/publish"
              payload: {}
              as: StudioAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: StudioAdmin
            - call: "POST /culinary/sessions"
              payload: { template_id: "${tmpl_id}", instructor_id: "${instr_id}", station_id: "ST2", event_type: "GROUP", start_at: "2026-07-10T14:00:00Z", end_at: "2026-07-10T16:00:00Z", planned_seats: 3 }
              as: StudioAdmin
              captures: { sess_id: $.data.id }
            - call: "POST /culinary/sessions/${sess_id}/ingredient-lines"
              payload: { name: "onion", qty_per_seat: 0.2, unit_cost_cents: 100 }
              as: Instructor
              as_user_id: "${instr_id}"
            - call: "POST /culinary/sessions/${sess_id}/open"
              payload: {}
              as: Instructor
              as_user_id: "${instr_id}"
            - call: "POST /culinary/bookings"
              payload: { session_id: "${sess_id}", member_id: "${mem_m}", seats_requested: 1 }
              as: Member
              as_user_id: "${mem_m}"
              captures: { bk_m: $.data.id }
            - call: "GET /culinary/sessions/${sess_id}"
              payload: {}
              as: StudioAdmin
              captures: { occ_sv_2: $.data.version }
            - call: "POST /culinary/bookings/${bk_m}/confirm"
              payload: { expected_session_version: "${occ_sv_2}" }
              as: Member
              as_user_id: "${mem_m}"
            - call: "POST /culinary/sessions/${sess_id}/lock"
              payload: {}
              as: Instructor
              as_user_id: "${instr_id}"
            - call: "POST /culinary/bookings/${bk_m}/mark-no-show"
              payload: {}
              as: Instructor
              as_user_id: "${instr_id}"
            - call: "GET /culinary/members/${mem_m}"
              payload: {}
              as: StudioAdmin
              captures: { score_prov: $.data.reliability_score }
          trigger:
            - call: "POST /culinary/sessions/${sess_id}/complete"
              payload: {}
              as: Instructor
              as_user_id: "${instr_id}"
          assert:
            - "Member.${mem_m}.reliability_score read BEFORE complete (score_prov) == 100"
            - "Member.${mem_m}.reliability_score == 75 after complete (strike SETTLED, FINAL)"
            - "Member.${mem_m}.booking_status == GOOD_STANDING"

  # =========================================================================
  # Rule 2 — Combinatorial formulas across different modes
  # =========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: booking_charge_tiered_nonlinear_mode_a
        grounds:
          - calculations.booking_charge
          - entities.ClassTemplate.fields.skill_level
          - entities.ClassSession.fields.event_type
        distinguishing_aspect: |
          MODE (a): booking_charge combines >=3 inputs (base_price 8500, seats 6, skill ADVANCED
          surcharge 1200, group-discount tier keyed on seats) with non-linear tier selection:
          subtotal = 6*(8500+1200) = 58200, discount = 10% = 5820, charge = 52380 — the tier branch
          on seats_requested makes it non-linear, distinct from the rounding-order mode below.
        test_recipe:
          setup:
            - "Published template ADVANCED base 8500, OPEN GROUP session planned_seats=6"
          setup_api_calls:
            - call: "POST /culinary/instructors"
              payload: { full_name: "Chef K", email: "chef.k@x.com", max_skill_level: "PROFESSIONAL" }
              as: StudioAdmin
              captures: { instr_id: $.data.id }
            - call: "POST /culinary/members"
              payload: { full_name: "Mem C", email: "c@x.com" }
              as: StudioAdmin
              captures: { mem_c: $.data.id }
            - call: "POST /culinary/templates"
              payload: { title: "Saffron", skill_level: "ADVANCED", base_price_cents: 8500, default_capacity: 6, station_fixed_cost_cents: 6000, prep_minutes: 30, cleanup_minutes: 0 }
              as: StudioAdmin
              captures: { tmpl_id: $.data.id }
            - call: "POST /culinary/templates/${tmpl_id}/publish"
              payload: {}
              as: StudioAdmin
            - call: "POST /culinary/sessions"
              payload: { template_id: "${tmpl_id}", instructor_id: "${instr_id}", station_id: "ST3", event_type: "GROUP", start_at: "2026-08-01T14:00:00Z", end_at: "2026-08-01T16:00:00Z", planned_seats: 6 }
              as: StudioAdmin
              captures: { sess_id: $.data.id }
            - call: "POST /culinary/sessions/${sess_id}/ingredient-lines"
              payload: { name: "rice", qty_per_seat: 0.1, unit_cost_cents: 200 }
              as: Instructor
              as_user_id: "${instr_id}"
            - call: "POST /culinary/sessions/${sess_id}/open"
              payload: {}
              as: Instructor
              as_user_id: "${instr_id}"
          trigger:
            - call: "POST /culinary/bookings"
              payload: { session_id: "${sess_id}", member_id: "${mem_c}", seats_requested: 6 }
              as: Member
              as_user_id: "${mem_c}"
              captures: { bk_c: $.data.id }
          assert:
            - "Booking.${bk_c}.charge_cents == 52380"

      - name: prep_cost_round_per_line_then_sum_mode_b
        grounds:
          - calculations.prep_cost_per_seat
          - entities.IngredientLine.fields.qty_per_seat
          - entities.ClassSession.fields.prep_cost_per_seat_cents
        distinguishing_aspect: |
          MODE (b): prep_cost_per_seat PINS round-per-line-then-sum. Lines round to {40,299,93,15}
          summing to 447, whereas sum-then-round of the raw 446.10 would give 446 — the two orders
          diverge by 1 cent; plus station ceil(6000/8)=750, so prep_cost_per_seat_cents == 1197.
          This is the rounding-order axis, a different combinatorial mode than the tiered formula above.
        test_recipe:
          setup:
            - "OPEN session planned_seats=8 with four ingredient lines whose per-line cents force a divergence"
          setup_api_calls:
            - call: "POST /culinary/instructors"
              payload: { full_name: "Chef L", email: "chef.l@x.com", max_skill_level: "PROFESSIONAL" }
              as: StudioAdmin
              captures: { instr_id: $.data.id }
            - call: "POST /culinary/templates"
              payload: { title: "RiceBowl", skill_level: "BEGINNER", base_price_cents: 5000, default_capacity: 8, station_fixed_cost_cents: 6000, prep_minutes: 30, cleanup_minutes: 0 }
              as: StudioAdmin
              captures: { tmpl_id: $.data.id }
            - call: "POST /culinary/templates/${tmpl_id}/publish"
              payload: {}
              as: StudioAdmin
            - call: "POST /culinary/sessions"
              payload: { template_id: "${tmpl_id}", instructor_id: "${instr_id}", station_id: "ST4", event_type: "GROUP", start_at: "2026-08-05T14:00:00Z", end_at: "2026-08-05T16:00:00Z", planned_seats: 8 }
              as: StudioAdmin
              captures: { sess_id: $.data.id }
            - call: "POST /culinary/sessions/${sess_id}/ingredient-lines"
              payload: { name: "flour", qty_per_seat: 0.125, unit_cost_cents: 322 }
              as: Instructor
              as_user_id: "${instr_id}"
            - call: "POST /culinary/sessions/${sess_id}/ingredient-lines"
              payload: { name: "saffron", qty_per_seat: 0.003, unit_cost_cents: 99500 }
              as: Instructor
              as_user_id: "${instr_id}"
            - call: "POST /culinary/sessions/${sess_id}/ingredient-lines"
              payload: { name: "olive_oil", qty_per_seat: 0.05, unit_cost_cents: 1850 }
              as: Instructor
              as_user_id: "${instr_id}"
            - call: "POST /culinary/sessions/${sess_id}/ingredient-lines"
              payload: { name: "herbs", qty_per_seat: 0.011, unit_cost_cents: 1350 }
              as: Instructor
              as_user_id: "${instr_id}"
          trigger:
            - call: "POST /culinary/sessions/${sess_id}/open"
              payload: {}
              as: Instructor
              as_user_id: "${instr_id}"
              captures: { prep: $.data.prep_cost_per_seat_cents }
          assert:
            - "ClassSession.${sess_id}.prep_cost_per_seat_cents == 1197"

  # =========================================================================
  # Rule 3 — Non-linear state-machine shape on different entities
  # =========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: session_open_full_open_cycle
        grounds:
          - state_machines.ClassSession.OPEN_to_FULL
          - state_machines.ClassSession.FULL_to_OPEN
          - entities.ClassSession.fields.confirmed_seats
        distinguishing_aspect: |
          ClassSession exhibits a cycle OPEN->FULL->OPEN: confirming the last seat auto-transitions
          OPEN->FULL, and cancelling a confirmed booking with no waitlist refill auto-transitions
          FULL->OPEN — the same status is revisited, a non-linear shape on ClassSession.
        test_recipe:
          setup:
            - "OPEN GROUP session planned_seats=1, no waitlist; one member confirms (->FULL), then cancels (->OPEN)"
          setup_api_calls:
            - call: "POST /culinary/instructors"
              payload: { full_name: "Chef M", email: "chef.m@x.com", max_skill_level: "PROFESSIONAL" }
              as: StudioAdmin
              captures: { instr_id: $.data.id }
            - call: "POST /culinary/members"
              payload: { full_name: "Mem D", email: "d@x.com" }
              as: StudioAdmin
              captures: { mem_d: $.data.id }
            - call: "POST /culinary/templates"
              payload: { title: "Soup", skill_level: "BEGINNER", base_price_cents: 5000, default_capacity: 1, station_fixed_cost_cents: 1000, prep_minutes: 0, cleanup_minutes: 0 }
              as: StudioAdmin
              captures: { tmpl_id: $.data.id }
            - call: "POST /culinary/templates/${tmpl_id}/publish"
              payload: {}
              as: StudioAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: StudioAdmin
            - call: "POST /culinary/sessions"
              payload: { template_id: "${tmpl_id}", instructor_id: "${instr_id}", station_id: "ST5", event_type: "GROUP", start_at: "2026-08-20T14:00:00Z", end_at: "2026-08-20T16:00:00Z", planned_seats: 1 }
              as: StudioAdmin
              captures: { sess_id: $.data.id }
            - call: "POST /culinary/sessions/${sess_id}/ingredient-lines"
              payload: { name: "water", qty_per_seat: 1, unit_cost_cents: 1 }
              as: Instructor
              as_user_id: "${instr_id}"
            - call: "POST /culinary/sessions/${sess_id}/open"
              payload: {}
              as: Instructor
              as_user_id: "${instr_id}"
            - call: "POST /culinary/bookings"
              payload: { session_id: "${sess_id}", member_id: "${mem_d}", seats_requested: 1 }
              as: Member
              as_user_id: "${mem_d}"
              captures: { bk_d: $.data.id }
            - call: "GET /culinary/sessions/${sess_id}"
              payload: {}
              as: StudioAdmin
              captures: { occ_sv_3: $.data.version }
            - call: "POST /culinary/bookings/${bk_d}/confirm"
              payload: { expected_session_version: "${occ_sv_3}" }
              as: Member
              as_user_id: "${mem_d}"
            - call: "GET /culinary/sessions/${sess_id}"
              payload: {}
              as: StudioAdmin
              captures: { status_full: $.data.status }
          trigger:
            - call: "POST /culinary/bookings/${bk_d}/cancel"
              payload: {}
              as: Member
              as_user_id: "${mem_d}"
            - call: "GET /culinary/sessions/${sess_id}"
              payload: {}
              as: StudioAdmin
              captures: { status_after: $.data.status }
          assert:
            - "ClassSession.${sess_id}.status == FULL after confirm (status_full)"
            - "ClassSession.${sess_id}.status == OPEN after cancel with empty waitlist"
            - "ClassSession.${sess_id}.confirmed_seats == 0 after cancel"

      - name: gift_card_active_depleted_active_cycle
        grounds:
          - state_machines.GiftCard.ACTIVE_to_DEPLETED
          - state_machines.GiftCard.DEPLETED_to_ACTIVE
          - entities.GiftCard.fields.balance_cents
        distinguishing_aspect: |
          GiftCard exhibits a cycle ACTIVE->DEPLETED->ACTIVE: a REDEEM that drains balance to 0
          flips ACTIVE->DEPLETED, and a reload flips DEPLETED->ACTIVE — a non-linear cycle on a
          different entity (GiftCard) than the session capacity cycle above.
        test_recipe:
          setup:
            - "Member owns a gift card of exactly 9000; a confirmed 1-seat INTERMEDIATE booking (charge 9000) drains it to DEPLETED; then reload"
          setup_api_calls:
            - call: "POST /culinary/instructors"
              payload: { full_name: "Chef N", email: "chef.n@x.com", max_skill_level: "PROFESSIONAL" }
              as: StudioAdmin
              captures: { instr_id: $.data.id }
            - call: "POST /culinary/members"
              payload: { full_name: "Mem E", email: "e@x.com" }
              as: StudioAdmin
              captures: { mem_e: $.data.id }
            - call: "POST /culinary/gift-cards"
              payload: { code: "GC-E1", owner_member_id: "${mem_e}", initial_value_cents: 9000 }
              as: Member
              as_user_id: "${mem_e}"
              captures: { gc_e: $.data.id }
            - call: "POST /culinary/templates"
              payload: { title: "Bread", skill_level: "INTERMEDIATE", base_price_cents: 8500, default_capacity: 2, station_fixed_cost_cents: 1000, prep_minutes: 0, cleanup_minutes: 0 }
              as: StudioAdmin
              captures: { tmpl_id: $.data.id }
            - call: "POST /culinary/templates/${tmpl_id}/publish"
              payload: {}
              as: StudioAdmin
            - call: "POST /culinary/sessions"
              payload: { template_id: "${tmpl_id}", instructor_id: "${instr_id}", station_id: "ST6", event_type: "GROUP", start_at: "2026-08-25T14:00:00Z", end_at: "2026-08-25T16:00:00Z", planned_seats: 2 }
              as: StudioAdmin
              captures: { sess_id: $.data.id }
            - call: "POST /culinary/sessions/${sess_id}/ingredient-lines"
              payload: { name: "yeast", qty_per_seat: 0.01, unit_cost_cents: 50 }
              as: Instructor
              as_user_id: "${instr_id}"
            - call: "POST /culinary/sessions/${sess_id}/open"
              payload: {}
              as: Instructor
              as_user_id: "${instr_id}"
            - call: "POST /culinary/bookings"
              payload: { session_id: "${sess_id}", member_id: "${mem_e}", seats_requested: 1 }
              as: Member
              as_user_id: "${mem_e}"
              captures: { bk_e: $.data.id }
            - call: "GET /culinary/sessions/${sess_id}"
              payload: {}
              as: StudioAdmin
              captures: { occ_sv_4: $.data.version }
            - call: "POST /culinary/bookings/${bk_e}/confirm"
              payload: { expected_session_version: "${occ_sv_4}" }
              as: Member
              as_user_id: "${mem_e}"
            - call: "GET /culinary/gift-cards/${gc_e}"
              payload: {}
              as: Member
              as_user_id: "${mem_e}"
              captures: { gc_status_depleted: $.data.status, gc_v: $.data.version }
          trigger:
            - call: "POST /culinary/gift-cards/${gc_e}/reload"
              payload: { amount_cents: 5000, expected_gift_card_version: "${gc_v}" }
              as: Member
              as_user_id: "${mem_e}"
          assert:
            - "GiftCard.${gc_e}.status == DEPLETED after the charge drained balance to 0 (gc_status_depleted)"
            - "GiftCard.${gc_e}.status == ACTIVE after reload"
            - "GiftCard.${gc_e}.balance_cents == 5000 after reload"

  # =========================================================================
  # Rule 4 — Transitive cascade chains from different triggers
  # =========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: booking_cancel_promotes_waitlist_depth3
        grounds:
          - state_machines.Booking.CONFIRMED_to_CANCELLED
          - calculations.waitlist_promotion
          - calculations.payment_waterfall
          - entities.WaitlistEntry.fields.queue_status
        distinguishing_aspect: |
          Depth-3 cascade from a Booking cancel: (1) cancel frees a seat on the ClassSession,
          (2) that free triggers promotion of the oldest WAITING WaitlistEntry into a new CONFIRMED
          Booking, (3) that new Booking's confirmation itself triggers the payment_waterfall debit on
          the promoted member's funding — each link caused by the prior, not by the original cancel.
        test_recipe:
          setup:
            - "FULL GROUP session planned_seats=1; Member A CONFIRMED in seat; Member B WAITING with funds in a gift card"
          setup_api_calls:
            - call: "POST /culinary/instructors"
              payload: { full_name: "Chef O", email: "chef.o@x.com", max_skill_level: "PROFESSIONAL" }
              as: StudioAdmin
              captures: { instr_id: $.data.id }
            - call: "POST /culinary/members"
              payload: { full_name: "Mem A4", email: "a4@x.com" }
              as: StudioAdmin
              captures: { mem_a: $.data.id }
            - call: "POST /culinary/members"
              payload: { full_name: "Mem B4", email: "b4@x.com" }
              as: StudioAdmin
              captures: { mem_b: $.data.id }
            - call: "POST /culinary/gift-cards"
              payload: { code: "GC-B4", owner_member_id: "${mem_b}", initial_value_cents: 20000 }
              as: Member
              as_user_id: "${mem_b}"
              captures: { gc_b: $.data.id }
