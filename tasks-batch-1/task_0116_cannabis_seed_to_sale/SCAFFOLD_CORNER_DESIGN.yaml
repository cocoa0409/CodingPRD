              captures: { dist_id: $.data.id }
            - call: "POST /compliance/licenses"
              payload: { license_number: "CUL-CM1", license_type: "CULTIVATION", state_code: "CA", expires_on: "2027-01-01T00:00:00Z" }
              as: StateRegulator
              captures: { dest_id: $.data.id }
            - call: "POST /compliance/licenses"
              payload: { license_number: "LAB-CM1", license_type: "TESTING", state_code: "CA", expires_on: "2027-01-01T00:00:00Z" }
              as: StateRegulator
              captures: { lab_id: $.data.id }
            - call: "POST /compliance/plant-batches"
              payload: { license_id: "${dist_id}", lot_tag: "LOT-CM1", strain: "X", plant_count: 10, planted_at: "2026-01-01T00:00:00Z" }
              as: Cultivator
              captures: { batch_id: $.data.id }
            - call: "POST /compliance/plant-batches/${batch_id}/advance"
              payload: {}
              as: Cultivator
            - call: "POST /compliance/plant-batches/${batch_id}/advance"
              payload: {}
              as: Cultivator
            - call: "POST /compliance/harvests"
              payload: { plant_batch_id: "${batch_id}", harvest_name: "H-CM1", wet_weight_grams: 1000 }
              as: Cultivator
              captures: { harv_id: $.data.id }
            - call: "POST /compliance/harvests/${harv_id}/cure"
              payload: { dry_weight_grams: 500 }
              as: Cultivator
            - call: "POST /compliance/packages"
              payload: { harvest_id: "${harv_id}", package_tag: "PKG-CM1", product_category: "FLOWER", quantity_grams: 50 }
              as: Cultivator
              captures: { pkg_id: $.data.id }
            - call: "POST /compliance/lab-results"
              payload: { package_id: "${pkg_id}", testing_license_id: "${lab_id}", thc_pct: 18.0, pesticide_pass: true, tested_at: "2026-05-01T00:00:00Z" }
              as: QALabUser
              as_user_id: "qa-1"
            - call: "POST /compliance/packages/${pkg_id}/release"
              payload: {}
              as: ComplianceManager
              as_user_id: "cm-1"
            - call: "POST /compliance/manifests"
              payload: { origin_license_id: "${dist_id}", destination_license_id: "${dest_id}" }
              as: DistributionAgent
              captures: { man_id: $.data.id }
            - call: "POST /compliance/manifests/${man_id}/lines"
              payload: { package_id: "${pkg_id}", grams: 50 }
              as: DistributionAgent
            - call: "GET /compliance/manifests/${man_id}"
              as: DistributionAgent
              captures: { man_v: $.data.version }
            - call: "POST /compliance/manifests/${man_id}/depart"
              payload: { expected_manifest_version: "${man_v}" }
              as: DistributionAgent
          trigger:
            - call: "POST /compliance/manifests/${man_id}/receive"
              payload: { decision: "accept" }
              as: DistributionAgent
              captures: { man_status: $.data.status }
            - call: "GET /compliance/packages/${pkg_id}"
              as: DistributionAgent
              captures: { pkg_license: $.data.license_id, pkg_status: $.data.status }
          assert:
            - "Manifest.${man_id}.status == RECEIVED; Package.${pkg_id}.license_id == ${dest_id}; Package.${pkg_id}.status == ACTIVE"
