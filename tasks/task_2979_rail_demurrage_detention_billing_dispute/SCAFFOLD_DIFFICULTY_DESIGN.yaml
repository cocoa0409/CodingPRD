            - call: "POST /demurrage/disputes/${dsp_id}/begin-review"
              payload: {}
              as: DemurrageAdjudicator
              as_user_id: "adj-r3i2-b"
            - call: "POST /demurrage/disputes/${dsp_id}/decide"
              payload: { decision: "ALLOWED", allowance_pct: 1, decision_rationale: "Appeal sustained in full." }
              as: DemurrageAdjudicator
              as_user_id: "adj-r3i2-b"
          assert:
            - "after submit: status SUBMITTED, submitted_at 2026-08-15T10:00:00.000Z, evidence_weight 3, adjudication_due_at 2026-09-10T23:59:59.999Z"
            - "after the first begin-review: status UNDER_REVIEW and first_level_adjudicator_id == adj-r3i2-a"
            - "after request-info: status INFO_REQUESTED, info_request_count == 1, and adjudication_due_at has been REPLACED with 2026-09-03T23:59:59.999Z — an EARLIER instant than before"
            - "after request-info the target charge is still DISPUTED and total_credit_cents is still 0"
            - "after resubmit: status SUBMITTED, submitted_at refreshed to 2026-08-25T09:00:00.000Z, evidence_weight 6, and adjudication_due_at STILL 2026-09-03T23:59:59.999Z"
            - "resubmit must not recompute the due date from the enlarged weight: 2026-09-16 and 2026-09-08 are both wrong answers"
            - "after the second begin-review: status UNDER_REVIEW again with round_number still 1 and first_level_adjudicator_id unchanged"
            - "after the round-1 decide: status DECIDED, allowance_pct 0.65, allowed_credit_cents 30908, the charge ADJUSTED at credit 30908 / net 16642, Invoice total_credit_cents 30908 and derived status ADJUSTED"
            - "after appeal: status APPEALED, round_number 2, decision PENDING, allowance_pct null, allowed_credit_cents 0"
            - "after appeal the money is fully reversed: charge back to DISPUTED with credit_applied_cents 0, Invoice total_credit_cents 0, total_net_cents 47550, derived status PARTIALLY_DISPUTED, Customer.credit_balance_cents 0"
            - "after appeal: adjudication_due_at == 2026-09-15T23:59:59.999Z, computed from the 2026-09-01 appeal date with the appeal multiplier and NO evidence-weight discount"
            - "after the round-2 begin-review: appeal_adjudicator_id == adj-r3i2-b while first_level_adjudicator_id is still adj-r3i2-a"
            - "after the round-2 decide: status DECIDED, allowed_credit_cents 47550, charge ADJUSTED at credit 47550 / net 0, Invoice total_credit_cents 47550 / total_net_cents 0"
