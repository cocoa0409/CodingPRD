            - call: "POST /wt/program-designs/${c5b_pd}/accept"
              payload: { expected_program_design_version: "${c5b_pd_v}" }
              as: CustomerContact
              as_user_id: "${c5b_acct}"
            - { call: "POST /wt/feed-stations/${c5b_fs}/bring-online", payload: {}, as: WaterChemist }
            - { call: "POST /wt/assets/${c5b_asset}/commission", payload: {}, as: WaterChemist }
            - call: "POST /wt/legionella-plans"
              payload: { asset_id: "${c5b_asset}", plan_text: "scheme", validation_interval_days: 10 }
              as: WaterChemist
              captures: { c5b_plan: $.data.id }
            - { call: "POST /wt/legionella-plans/${c5b_plan}/activate", payload: {}, as: WaterChemist }
            - call: "POST /wt/test-routes"
              payload: { account_id: "${c5b_acct}", route_name: "SF-R" }
              as: WaterChemist
              captures: { c5b_rt: $.data.id }
            - call: "POST /wt/test-routes/${c5b_rt}/stops"
              payload: { asset_id: "${c5b_asset}", window_start: "2026-08-02T00:00:00Z", window_end: "2026-08-02T06:00:00Z", sequence_index: 1 }
              as: WaterChemist
              captures: { c5b_st: $.data.id }
            - { call: "POST /wt/test-routes/${c5b_rt}/publish", payload: {}, as: WaterChemist }
            - { call: "POST /wt/_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T01:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /wt/route-stops/${c5b_st}/arrive", payload: {}, as: WaterChemist }
            - { call: "POST /wt/legionella-plans/${c5b_plan}/suspend", payload: {}, as: AccountManager }
          trigger:
            - call: "POST /wt/route-stops/${c5b_st}/water-test-results"
              payload: { asset_id: "${c5b_other}", ph: 8.0, conductivity_umhos: 2000, calcium_ppm: 300, alkalinity_ppm: 150, temperature_f: 90, inhibitor_residual_ppm: 4 }
              as: WaterChemist
