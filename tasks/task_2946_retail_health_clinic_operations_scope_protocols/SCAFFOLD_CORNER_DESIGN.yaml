      - name: corner_header_authentication_outranks_role_path_and_body_checks
        claim_type: authentication_precedence
        grounds:
          - validations[priority=1]
          - validations[priority=2]
          - validations[priority=3]
          - validations[priority=4]
          - errors[ERR_UNAUTHENTICATED]
          - errors[ERR_FORBIDDEN_ROLE]
        distinguishing_aspect: "The four-step gate is walked in order on ONE endpoint: an empty X-User-Role is 401 even though the body is also malformed and the path id is unknown; an undeclared role string is 401 (not 403); a declared-but-wrong role is 403; and a correct role whose X-User-Id resolves to no Clinician row is 403 ERR_FORBIDDEN_ROLE (priority 4) rather than 404 or ERR_UNAUTHENTICATED."
