      - name: pack_reserve_and_verify_then_cancel_restores_device_reservation_ledger
        grounds:
          - state_machines.BypassCase.SETUP_VERIFIED_to_CANCELLED
          - state_machines.PerfusionDevice.RESERVED_to_AVAILABLE
          - state_machines.PumpChecklist.VERIFIED_to_INVALIDATED
