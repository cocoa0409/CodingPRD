      - "GET /governance-profiles"
      - "GET /governance-profiles/{governance_profile_id}"
      - "GET /governance-profiles/{id}/standard-evaluations"
      - "GET /standard-evaluations/{standard_evaluation_id}"
      - "GET /rating-cycles"
      - "GET /rating-cycles/{rating_cycle_id}"
      - "GET /rating-cycles/{rating_cycle_id}/score-breakdown"
      - "GET /rating-cycles/{id}/dimension-scores"
      - "GET /correction-requests"
      - "GET /correction-requests/{correction_request_id}"
      - "GET /appeals"
