- rule_id: cross_entity_state_dependency
  applies: true
  rationale: |
    Four write paths are gated on a *different* entity's state: subscription acceptance
    depends on OfferingDocument.status, wrap certification depends on the pinned
    OperatingBudget still being the ACTIVE one, and closing-notice settlement depends on
    every WeeklyWrap being out of the SUBMITTED/DISPUTED limbo.
  instances:
  - name: withdrawn_offering_document_blocks_subscription_acceptance
    grounds:
    - §1.4 priority 9 cross-entity state -> ERR_OFFERING_NOT_EFFECTIVE (409)
    - §1.2 OfferingDocument EFFECTIVE -> WITHDRAWN
    - §1.1 Subscription.offering_document_id FK -> OfferingDocument.id
    distinguishing_aspect: |
      The subscription itself is perfectly valid and SUBMITTED, the investor is
      ACCREDITED, and the money fits the offering; only the parent document's state has
      changed. Acceptance must therefore fail with ERR_OFFERING_NOT_EFFECTIVE (409). An
      implementation that validates only the subscription's own fields accepts it and
      wrongly mints an InvestorAccount against a withdrawn offering.
    test_recipe:
      setup:
      - |-
        An effective offering with one accredited investor holding a submitted
        subscription. The document is then withdrawn before acceptance is attempted.
      setup_api_calls:
      - call: POST /theatres
        payload:
          name: Belasco House
          seat_count: 1200
          top_ticket_price_cents: 19900
          changeover_buffer_days: 3
        as: GeneralManager
        captures:
          th: $.data.id
      - call: POST /productions
        payload:
          title: The Ledger
          offering_entity_type: LP
          capitalization_target_cents: 120000000
          reserve_target_cents: 2000000
          theatre_id: ${th}
          pre_recoupment_pool_pct: 0.35
          post_recoupment_pool_pct: 0.4
          subsidiary_rights_investor_share_pct: 0.4
          closing_notice_min_days: 14
        as: GeneralManager
        captures:
          pr: $.data.id
      - call: POST /productions/${pr}/open-offering
        payload: {}
        as: SyndicationCounsel
      - call: POST /offering-documents
        payload:
          production_id: ${pr}
          doc_type: LP_AGREEMENT
          offering_amount_cents: 120000000
          unit_price_cents: 60000000
          max_investors: 5
          effective_date: '2026-08-01'
          expiration_date: '2026-12-31'
        as: SyndicationCounsel
        captures:
          od: $.data.id
      - call: POST /offering-documents/${od}/make-effective
        payload: {}
        as: SyndicationCounsel
      - call: POST /investors
        payload:
          legal_name: Iris Ivanov
          jurisdiction: NY
          contact_email: iris@example.com
        as: SyndicationCounsel
        captures:
          iv1: $.data.id
      - call: POST /investors/${iv1}/accredit
        payload:
          accreditation_status: ACCREDITED
        as: SyndicationCounsel
      - call: POST /subscriptions
        payload:
          offering_document_id: ${od}
          investor_id: ${iv1}
          units: 1
        as: Investor
        as_user_id: ${iv1}
        captures:
          sb1: $.data.id
      - call: POST /offering-documents/${od}/withdraw
        payload:
          withdrawal_reason: Blue-sky filing deficiency in two states
        as: SyndicationCounsel
      trigger:
      - call: POST /subscriptions/${sb1}/accept
        payload: {}
        as: SyndicationCounsel
        captures:
          err: $.data.error_id
      - call: GET /offering-documents/${od}
        as: SyndicationCounsel
      - call: GET /subscriptions/${sb1}
        as: SyndicationCounsel
      - call: GET /investor-accounts?production_id=${pr}
        as: SyndicationCounsel
      - call: GET /productions/${pr}
        as: GeneralManager
      assert:
      - HTTP 409 with error.code == "ERR_OFFERING_NOT_EFFECTIVE"
      - 'GET /offering-documents/${od}: status == "WITHDRAWN"'
      - 'GET /subscriptions/${sb1}: status == "SUBMITTED" (unchanged; the subscription itself was valid)'
      - 'GET /investor-accounts?production_id=${pr}: total_count == 0'
      - 'GET /productions/${pr}: offering_status == "OFFERING", capital_raised_cents == 0'
  - name: lazily_expired_offering_document_blocks_acceptance_with_specific_error
    grounds:
    - §1.2 OfferingDocument EFFECTIVE -> EXPIRED (lazy, evaluated on read against the logical clock and expiration_date)
    - §1.4 priority 12 business_temporal -> ERR_OFFERING_EXPIRED (422)
    - '§1.4 priority 9 note: EXPIRED is deliberately excluded from ERR_OFFERING_NOT_EFFECTIVE so the lapsed-window case reports the more specific error'
    - §1.5 POST /_clock/set_current_utc
    distinguishing_aspect: |
      Expiry is never written by a request; it is derived when the document is read after
      the clock passes expiration_date. A subscription created on 2026-08-15 against a
      document expiring 2026-08-31 is legal, but accepting it after the clock moves to
      2026-09-01 must fail with ERR_OFFERING_EXPIRED (422) - not the generic
      ERR_OFFERING_NOT_EFFECTIVE (409), which the ladder explicitly reserves for DRAFT and
      WITHDRAWN. An implementation that never re-derives status returns 200; one that
      folds expiry into the priority-9 check returns the wrong code and status.
    test_recipe:
      setup:
      - |-
        An offering document effective 2026-08-01 and expiring 2026-08-31. The clock is
        set to 2026-08-15 for the subscription, then advanced to 2026-09-01 and the
        document is read back to confirm lazy expiry before acceptance is attempted.
      setup_api_calls:
      - call: POST /theatres
        payload:
          name: Belasco House
          seat_count: 1200
          top_ticket_price_cents: 19900
          changeover_buffer_days: 3
        as: GeneralManager
        captures:
          th: $.data.id
      - call: POST /productions
        payload:
          title: The Ledger
          offering_entity_type: LP
          capitalization_target_cents: 120000000
          reserve_target_cents: 2000000
          theatre_id: ${th}
          pre_recoupment_pool_pct: 0.35
          post_recoupment_pool_pct: 0.4
          subsidiary_rights_investor_share_pct: 0.4
          closing_notice_min_days: 14
        as: GeneralManager
        captures:
          pr: $.data.id
      - call: POST /productions/${pr}/open-offering
        payload: {}
        as: SyndicationCounsel
      - call: POST /offering-documents
        payload:
          production_id: ${pr}
          doc_type: LP_AGREEMENT
          offering_amount_cents: 120000000
          unit_price_cents: 60000000
          max_investors: 5
          effective_date: '2026-08-01'
          expiration_date: '2026-08-31'
        as: SyndicationCounsel
        captures:
          od: $.data.id
      - call: POST /offering-documents/${od}/make-effective
        payload: {}
        as: SyndicationCounsel
      - call: POST /investors
        payload:
          legal_name: Iris Ivanov
          jurisdiction: NY
          contact_email: iris@example.com
        as: SyndicationCounsel
        captures:
          iv1: $.data.id
      - call: POST /investors/${iv1}/accredit
        payload:
          accreditation_status: ACCREDITED
        as: SyndicationCounsel
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-08-15T00:00:00Z'
        as: GeneralManager
      - call: POST /subscriptions
        payload:
          offering_document_id: ${od}
          investor_id: ${iv1}
          units: 1
        as: Investor
        as_user_id: ${iv1}
        captures:
          sb1: $.data.id
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-09-01T00:00:00Z'
        as: GeneralManager
      - call: GET /offering-documents/${od}
        as: SyndicationCounsel
      trigger:
      - call: POST /subscriptions/${sb1}/accept
        payload: {}
        as: SyndicationCounsel
        captures:
          err: $.data.error_id
      - call: GET /subscriptions/${sb1}
        as: SyndicationCounsel
      - call: GET /productions/${pr}
        as: GeneralManager
      assert:
      - The mid-setup GET at clock 2026-09-01 shows status == "EXPIRED" without any write having been issued against the document
      - The trigger returns HTTP 422 with error.code == "ERR_OFFERING_EXPIRED"
      - error.code is NOT "ERR_OFFERING_NOT_EFFECTIVE" and the status is not 409
      - 'GET /subscriptions/${sb1}: status == "SUBMITTED"'
      - 'GET /productions/${pr}: offering_status == "OFFERING", capital_raised_cents == 0, escrow_balance_cents == 0'
  - name: superseded_pinned_operating_budget_blocks_wrap_certification
    grounds:
    - §1.1 WeeklyWrap.operating_budget_id, .operating_budget_version_pinned (system fields set at wrap creation)
    - §1.2 OperatingBudget ACTIVE -> SUPERSEDED when a newer budget is activated
    - §1.6 ERR_OPERATING_BUDGET_CHANGED (409)
    distinguishing_aspect: |
      A wrap pins the operating budget it was drafted against. Activating a second budget
      supersedes the first, so certifying the wrap would settle it against costs that are
      no longer authoritative and must fail with ERR_OPERATING_BUDGET_CHANGED (409). An
      implementation that always reads the current ACTIVE budget certifies happily against
      the new weekly fixed cost of 40,000,000; one that does not pin at all cannot detect
      the change.
    test_recipe:
      setup:
      - |-
        BASE chain on POOL basis through RUNNING with W1 (week ending 2026-09-06) created
        and submitted against budget ${ob} (weekly fixed 32,000,000). A second budget
        ${ob2} (weekly fixed 40,000,000) is then created and activated, superseding it.
