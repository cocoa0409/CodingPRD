            - call: "POST /incentives/programs/${prog_id}/revise"
              payload: { revision_note: "budget too small" }
              as: ProgramDesigner
              as_user_id: "u-designer-1"
              captures: { s2: $.data.status, sub2: $.data.submitted_by_user_id, v2: $.data.version }
            - call: "POST /incentives/programs/${prog_id}/submit"
              payload: {}
              as: ProgramDesigner
              as_user_id: "u-designer-2"
              captures: { s3: $.data.status, sub3: $.data.submitted_by_user_id, v3: $.data.version }
            - call: "POST /incentives/programs/${prog_id}/revise"
              payload: {}
              as: ProgramDesigner
              as_user_id: "u-designer-2"
              captures: { s4: $.data.status, v4: $.data.version }
            - call: "POST /incentives/programs/${prog_id}/submit"
              payload: {}
