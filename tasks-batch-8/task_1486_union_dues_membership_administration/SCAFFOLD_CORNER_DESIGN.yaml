              as: ParentBodyAdmin
              captures: { loc: "$.data.id", loc_v: "$.data.version" }
            - call: "POST /api/locals/${loc}/per-capita-reports"
              payload: { period: "2026-08", expected_local_version: "${loc_v}" }
              as: SecretaryTreasurer
              as_user_id: st_1
              captures: { rep1: "$.data.id" }
            - call: "GET /api/locals/${loc}"
              as: SecretaryTreasurer
              captures: { loc_v2: "$.data.version" }
          trigger:
            - call: "POST /api/locals/${loc}/per-capita-reports"
              payload: { period: "2026-08", expected_local_version: "${loc_v2}" }
              as: SecretaryTreasurer
              as_user_id: st_1
              captures: { rep2: "$.data.id", rep2_status: "$.data.status" }
            - call: "GET /api/locals/${loc}/per-capita-reports?status=SUPERSEDED"
              as: SecretaryTreasurer
              captures: { sup1: "$.data[0].id" }
          assert:
            - "${rep2_status} == DRAFT (fresh version accepted)"
            - "${sup1} == ${rep1} — the first DRAFT was superseded by the second"

      - name: member_version_increments_on_mutation
        claim_type: optimistic_concurrency
        grounds: [entities.Member, "concurrency_rules[transfer-create-stale-member]"]
        distinguishing_aspect: "common_fields versioning: registration yields version 1; a payment mutation increments it to exactly 2."
        test_recipe:
          setup: ["FLAT local; member M with one assessment (run 2026-08)"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: ParentBodyAdmin }
            - call: "POST /api/locals"
