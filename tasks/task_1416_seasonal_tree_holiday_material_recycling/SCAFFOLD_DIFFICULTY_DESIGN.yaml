            - "Appeal path: ContaminationTicket.${t1} went UPHELD -> APPEALED -> OVERTURNED"
            - "Compensation after OVERTURNED: Household.${h1}.strike_count == 0, curbside_eligible == true, CurbsideBooking.${b1}.status == CONFIRMED, ServiceZone.${zid}.reserved_trees == 3 (re-reserved without capacity check)"
