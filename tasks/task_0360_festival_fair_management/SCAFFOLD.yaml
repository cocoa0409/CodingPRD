scenario: "360. Festival & Fair Management: multi-day ticketing & wristband (RFID cashless), vendor/booth application & fee, stage/schedule & artist, gate scan & re-entry, parking/camping add-on, weather/refund policy, lost-child/medical, sales reporting"
domain_name: festival-fair-management
api_prefix: /

complexity_profile:
  primary_archetype: "Quota / allocation"
  secondary_archetype: "Pricing engine"
  complexity_layers:
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
    - derived_field_reconciliation
    - optimistic_concurrency

  entity_topology: hybrid
  # Festival is the aggregate root (hierarchical: Zone, Stage, ParkingLot,
  # CampingArea hang off it). VendorApplication, Wristband, Ticket, Performance,
  # GateEvent, Incident reference Festival and each other by FK (flat references
  # across the tree) — so the topology is a tree with cross-cutting associations.

  state_machine_shape: posture_driven
  # Festival.operational_posture (PLANNING / ON_SALE / LIVE / SUSPENDED / CLOSED /
  # CANCELLED) gates every child operation (ticket sale, gate scan, vendor confirm,
  # wallet top-up). SUSPENDED is reached from LIVE on a weather hold and can revert
  # to LIVE (cycle), or advance to CANCELLED (branch with divergent refund cascade).
  # VendorApplication adds a branching-with-revert machine; Wristband adds parallel
  # state dimensions (lifecycle_status x presence_status).

  relationship_patterns:
    - one_to_many        # Festival -> Zone/Stage/ParkingLot/CampingArea/Ticket/...
    - cross_aggregate    # VendorApplication.booth_zone_id -> Zone; Ticket.wristband_id -> Wristband
    - polymorphic        # GateEvent.subject_ref points at a Wristband; Incident.linked_ticket_id optional

  role_model: peer_roles
  # GateAttendant scans, BoxOffice sells/refunds tickets, VendorManager rules on
  # booth applications, FestivalDirector controls posture + weather + settlement,
  # Vendor acts on its own application/booth. Distinct resource ownership per role.

  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =====================================================================
# §1.1 ENTITY-RELATIONSHIP TABLE
# =====================================================================
entities:
  - name: Festival
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: festival display name
      - name: start_date
        type: string
        source: input
        description: first festival day, ISO date YYYY-MM-DD (inclusive)
      - name: end_date
        type: string
        source: input
        description: last festival day, ISO date YYYY-MM-DD (inclusive)
      - name: total_days
        type: integer
        source: computed
        description: "inclusive day count = (end_date - start_date) + 1; drives ticket face value and weather pro-rata"
      - name: operational_posture
        type: enum
        source: computed
        description: "lifecycle gate over all child ops"
        default: PLANNING
        constraints: "one of {PLANNING, ON_SALE, LIVE, SUSPENDED, CLOSED, CANCELLED}"
      - name: current_festival_day
        type: integer
        source: computed
        description: "0 while not yet LIVE; set to N (1-indexed) when day N opens via POST /festivals/{id}/open-day; bounds weather pro-rata elapsed_days"
        default: 0
      - name: max_reentries
        type: integer
        source: input
        description: "max ENTER scans allowed AFTER the first entry per wristband; 0 means no re-entry"
        default: 1
      - name: wristband_cashout_pct
        type: number
        source: input
        description: "processing fee fraction withheld on patron wallet cash-out"
        default: 0.03
      - name: vendor_commission_pct
        type: number
        source: input
        description: "platform commission fraction withheld from vendor cashless gross at settlement"
        default: 0.08
      - name: total_wallet_liability
        type: number
        source: computed
        description: "running sum of balance over all wristbands with lifecycle_status IN {ACTIVE}; conserved quantity for wallet invariant"
        default: 0
      - name: total_refund_liability
        type: number
        source: computed
        description: "running sum of all ISSUED Refund.amount; conserved quantity for refund-ledger invariant"
        default: 0

  - name: Zone
    parent: Festival
    common_fields: true
    fields:
      - name: festival_id
        type: string
        source: input
        description: "FK -> Festival.id; owning festival"
      - name: code
        type: string
        source: input
        description: "zone letter, one of {A, B, C}; selects premium surcharge fraction"
        constraints: "one of {A, B, C}"
      - name: slot_capacity
        type: integer
        source: input
        description: "max number of booth applications that may hold a confirmed slot in this zone"
        constraints: ">= 1"
      - name: allocated_count
        type: integer
        source: computed
        description: "count of VendorApplication with booth_zone_id == this zone and status IN {APPROVED, CONFIRMED}; conserved quantity for booth-slot invariant"
        default: 0

  - name: Stage
    parent: Festival
    common_fields: true
    fields:
      - name: festival_id
        type: string
        source: input
        description: "FK -> Festival.id; owning festival"
      - name: name
        type: string
        source: input
        description: stage display name
      - name: changeover_minutes
        type: integer
        source: input
        description: "mandatory teardown/setup buffer enforced after each performance end before the next may start"
        default: 30
        constraints: ">= 0"

  - name: ParkingLot
    parent: Festival
    common_fields: true
    fields:
      - name: festival_id
        type: string
        source: input
        description: "FK -> Festival.id; owning festival"
      - name: name
        type: string
        source: input
        description: lot display name
      - name: capacity
        type: integer
        source: input
        description: "max number of parking passes sellable for this lot across all days"
        constraints: ">= 1"
      - name: sold_count
        type: integer
        source: computed
        description: "count of AddOn rows with kind=PARKING, parking_lot_id == this lot, status IN {SOLD}; quota-allocation conserved quantity"
        default: 0
      - name: price_per_pass
        type: number
        source: input
        description: flat price for one parking pass (all-festival)

  - name: CampingArea
    parent: Festival
    common_fields: true
    fields:
      - name: festival_id
        type: string
        source: input
        description: "FK -> Festival.id; owning festival"
      - name: name
        type: string
        source: input
        description: camping area display name
      - name: capacity
        type: integer
        source: input
        description: "max number of camping plots sellable in this area"
        constraints: ">= 1"
      - name: sold_count
        type: integer
        source: computed
        description: "count of AddOn rows with kind=CAMPING, camping_area_id == this area, status IN {SOLD}"
        default: 0
      - name: price_per_night
        type: number
        source: input
        description: per-night price for one camping plot

  - name: Ticket
    parent: Festival
    common_fields: true
    fields:
      - name: festival_id
        type: string
        source: input
        description: "FK -> Festival.id; festival this ticket admits to"
      - name: wristband_id
        type: string
        source: computed
        description: "FK -> Wristband.id; RFID wristband linked at activation, null until activated"
        default: null
      - name: ticket_type
        type: enum
        source: input
        description: "pricing class"
        constraints: "one of {GA, VIP}"
      - name: day_count
        type: integer
        source: input
        description: "number of festival days this ticket admits to; 1..Festival.total_days"
        constraints: ">= 1 and <= Festival.total_days"
      - name: face_value
        type: number
        source: computed
        description: "PER_DAY_PRICE[ticket_type] * day_count; basis for both refund variants"
      - name: status
        type: enum
        source: computed
        description: "ticket lifecycle"
        default: SOLD
        constraints: "one of {SOLD, ACTIVATED, REFUNDED, VOID}"
      - name: purchaser_email
        type: string
        source: input
        description: patron email for the ticket holder

  - name: Wristband
    parent: Festival
    common_fields: true
    fields:
      - name: festival_id
        type: string
        source: input
        description: "FK -> Festival.id; owning festival"
      - name: rfid_uid
        type: string
        source: input
        description: "physical RFID tag UID; unique among non-VOID wristbands within the same festival"
      - name: lifecycle_status
        type: enum
        source: computed
        description: "wallet/issuance dimension (independent of presence_status)"
        default: ISSUED
        constraints: "one of {ISSUED, ACTIVE, FROZEN, CLOSED, VOID}"
      - name: presence_status
        type: enum
        source: computed
        description: "gate dimension (independent of lifecycle_status); evolves on gate scans"
        default: OUTSIDE
        constraints: "one of {OUTSIDE, INSIDE}"
      - name: balance
        type: number
        source: computed
        description: "cashless wallet balance; >= 0 invariant; sum over ACTIVE wristbands == Festival.total_wallet_liability"
        default: 0
      - name: entry_count
        type: integer
        source: computed
        description: "total ENTER scans accepted on this wristband"
        default: 0
      - name: reentry_used
        type: integer
        source: computed
        description: "ENTER scans accepted while entry_count was already >= 1; capped by Festival.max_reentries"
        default: 0

  - name: WalletTxn
    parent: Wristband
    common_fields: false
    fields:
      - name: wristband_id
        type: string
        source: input
        description: "FK -> Wristband.id; wallet this txn affects"
      - name: festival_id
        type: string
        source: computed
        description: "FK -> Festival.id; denormalized from wristband for reporting"
      - name: kind
        type: enum
        source: input
        description: "ledger entry kind"
        constraints: "one of {TOPUP, SPEND, CASHOUT, CASHOUT_FEE}"
      - name: amount
        type: number
        source: input
        description: "signed-by-convention positive magnitude in dollars (2dp); direction implied by kind"
      - name: booth_zone_id
        type: string
        source: input
        description: "FK -> Zone.id; vendor zone credited on SPEND, null otherwise"
        default: null
      - name: vendor_application_id
        type: string
        source: computed
        description: "FK -> VendorApplication.id; the confirmed vendor occupying booth_zone_id at SPEND time, null otherwise"
        default: null

  - name: VendorApplication
    parent: Festival
    common_fields: true
    fields:
      - name: festival_id
        type: string
        source: input
        description: "FK -> Festival.id; festival applied to"
      - name: vendor_id
        type: string
        source: input
        description: "FK -> Vendor.id; applicant vendor (entity_backed identity)"
      - name: booth_zone_id
        type: string
        source: input
        description: "FK -> Zone.id; requested booth zone"
      - name: booth_tier
        type: enum
        source: input
        description: "booth product tier selecting the daily base rate"
        constraints: "one of {STANDARD, PREMIUM, FOOD}"
      - name: day_count
        type: integer
        source: input
        description: "number of festival days the booth operates; 1..Festival.total_days"
        constraints: ">= 1 and <= Festival.total_days"
      - name: power_addon
        type: boolean
        source: input
        description: "whether electrical hookup is requested (adds POWER_DAILY * day_count)"
        default: false
      - name: status
        type: enum
        source: computed
        description: "application lifecycle (branching with revert)"
        default: SUBMITTED
        constraints: "one of {SUBMITTED, UNDER_REVIEW, APPROVED, CONFIRMED, REJECTED, WITHDRAWN}"
      - name: booth_fee
        type: number
        source: computed
        description: "computed at approval by booth_fee_calc; null before APPROVED"
        default: null
      - name: fee_paid
        type: number
        source: computed
        description: "amount of booth_fee paid so far; CONFIRMED requires fee_paid >= booth_fee"
        default: 0

  - name: Vendor
    parent: null
    common_fields: true
    fields:
      - name: company_name
        type: string
        source: input
        description: vendor legal/display name
      - name: contact_email
        type: string
        source: input
        description: vendor contact email
      - name: payout_total
        type: number
        source: computed
        description: "cumulative settlement payout credited to this vendor across confirmed booths"
        default: 0

  - name: Performance
    parent: Stage
    common_fields: true
    fields:
      - name: stage_id
        type: string
        source: input
        description: "FK -> Stage.id; stage this set occupies"
      - name: festival_id
        type: string
        source: computed
        description: "FK -> Festival.id; denormalized from stage"
      - name: artist_name
        type: string
        source: input
        description: performing artist/act name
      - name: starts_at
        type: string
        source: input
        description: "ISO 8601 UTC start instant of the set"
      - name: ends_at
        type: string
        source: input
        description: "ISO 8601 UTC end instant; must be > starts_at"
      - name: status
        type: enum
        source: computed
        description: "performance lifecycle"
        default: SCHEDULED
        constraints: "one of {SCHEDULED, CANCELLED}"

  - name: AddOn
    parent: Festival
    common_fields: true
    fields:
      - name: festival_id
        type: string
        source: input
        description: "FK -> Festival.id; owning festival"
      - name: ticket_id
        type: string
        source: input
        description: "FK -> Ticket.id; ticket this add-on attaches to"
      - name: kind
        type: enum
        source: input
        description: "add-on type"
        constraints: "one of {PARKING, CAMPING}"
      - name: parking_lot_id
        type: string
        source: input
        description: "FK -> ParkingLot.id; required when kind=PARKING, else null"
        default: null
      - name: camping_area_id
        type: string
        source: input
        description: "FK -> CampingArea.id; required when kind=CAMPING, else null"
        default: null
      - name: nights
        type: integer
        source: input
        description: "camping nights; required when kind=CAMPING (1..total_days), ignored for PARKING"
        default: null
      - name: price
        type: number
        source: computed
        description: "PARKING: ParkingLot.price_per_pass; CAMPING: CampingArea.price_per_night * nights"
      - name: status
        type: enum
        source: computed
        description: "add-on lifecycle"
        default: SOLD
        constraints: "one of {SOLD, REFUNDED}"

  - name: GateEvent
    parent: Festival
    common_fields: false
    fields:
      - name: festival_id
        type: string
        source: input
        description: "FK -> Festival.id; festival the scan occurred at"
      - name: wristband_id
        type: string
        source: input
        description: "FK -> Wristband.id; scanned wristband (polymorphic subject_ref)"
      - name: direction
        type: enum
        source: input
        description: "scan direction"
        constraints: "one of {ENTER, EXIT}"
      - name: outcome
        type: enum
        source: computed
        description: "scan adjudication result"
        constraints: "one of {ADMITTED, EXITED, DENIED}"
      - name: deny_reason
        type: string
        source: computed
        description: "error_id of the rejection when outcome=DENIED, null otherwise"
        default: null

  - name: Refund
    parent: Festival
    common_fields: true
    fields:
      - name: festival_id
        type: string
        source: input
        description: "FK -> Festival.id; festival the refund belongs to"
      - name: ticket_id
        type: string
        source: input
        description: "FK -> Ticket.id; ticket being refunded"
      - name: refund_kind
        type: enum
        source: computed
        description: "which refund algorithm produced the amount"
        constraints: "one of {WEATHER_PRORATA, VOLUNTARY_TIERED}"
      - name: amount
        type: number
        source: computed
        description: "dollars refunded to patron (2dp); contributes to Festival.total_refund_liability"
      - name: fee_withheld
        type: number
        source: computed
        description: "cancellation fee withheld (VOLUNTARY_TIERED) or 0 (WEATHER_PRORATA)"
        default: 0
      - name: status
        type: enum
        source: computed
        description: refund lifecycle
        default: ISSUED
        constraints: "one of {ISSUED}"

  - name: Incident
    parent: Festival
    common_fields: true
    fields:
      - name: festival_id
        type: string
        source: input
        description: "FK -> Festival.id; festival where the incident occurred"
      - name: incident_type
        type: enum
        source: input
        description: "incident category"
        constraints: "one of {LOST_CHILD, MEDICAL}"
      - name: linked_wristband_id
        type: string
        source: input
        description: "FK -> Wristband.id; involved wristband if known, null otherwise"
        default: null
      - name: severity
        type: enum
        source: input
        description: "triage severity"
        default: LOW
        constraints: "one of {LOW, MEDIUM, HIGH, CRITICAL}"
      - name: status
        type: enum
        source: computed
        description: "incident lifecycle (branching with revert)"
        default: OPEN
        constraints: "one of {OPEN, ESCALATED, RESOLVED}"
      - name: notes
        type: string
        source: input
        description: free-text triage notes
        default: null

# =====================================================================
# §1.2 STATE MACHINE TABLE
# =====================================================================
state_machines:
  - entity: Festival
    initial_state: PLANNING
    terminal_states: [CLOSED, CANCELLED]
    transitions:
      - from: PLANNING
        to: ON_SALE
        trigger: "POST /festivals/{id}/open-sales"
        actor: FestivalDirector
        preconditions:
          - "festival has >= 1 Zone and >= 1 Stage"
        side_effects:
          - "ticket sales become permitted (BoxOffice may POST /festivals/{id}/tickets)"
        note: "posture gate opens"
      - from: ON_SALE
        to: LIVE
        trigger: "POST /festivals/{id}/go-live"
        actor: FestivalDirector
        preconditions:
          - "current UTC date >= start_date OR director override flag not required by tests"
        side_effects:
          - "gate scans become permitted; sets current_festival_day = 1"
      - from: LIVE
        to: SUSPENDED
        trigger: "POST /festivals/{id}/weather-hold"
        actor: FestivalDirector
        preconditions:
          - "posture == LIVE"
        side_effects:
          - "all Performance with status=SCHEDULED whose starts_at is in the future are NOT auto-cancelled here (only on CANCELLED); new gate ENTER scans are rejected with ERR_FESTIVAL_SUSPENDED while EXIT scans remain permitted"
        note: "cycle entry; revertible to LIVE"
      - from: SUSPENDED
        to: LIVE
        trigger: "POST /festivals/{id}/resume"
        actor: FestivalDirector
        preconditions:
          - "posture == SUSPENDED"
        side_effects:
          - "gate ENTER scans permitted again"
        note: "cycle back-edge LIVE<->SUSPENDED"
      - from: SUSPENDED
        to: CANCELLED
        trigger: "POST /festivals/{id}/cancel"
        actor: FestivalDirector
        preconditions:
          - "posture == SUSPENDED"
        side_effects:
          - "CASCADE: for every Ticket with status IN {SOLD, ACTIVATED}, issue a Refund via weather_prorata_refund using current_festival_day as elapsed; set Ticket.status=REFUNDED; each refund increments Festival.total_refund_liability"
          - "that ticket refund itself triggers: if the ticket has lifecycle wristband ACTIVE, the linked Wristband is auto-frozen (lifecycle_status -> FROZEN) so no further SPEND occurs; freezing the wristband itself triggers recompute of Festival.total_wallet_liability (removes the now-FROZEN balance from the ACTIVE sum)"
          - "every Performance with status=SCHEDULED -> CANCELLED"
          - "every AddOn with status=SOLD -> REFUNDED"
        note: "branch target with divergent (weather) refund cascade; depth-3 chain ticket->wristband->liability"
      - from: LIVE
        to: CLOSED
        trigger: "POST /festivals/{id}/close"
        actor: FestivalDirector
        preconditions:
          - "posture == LIVE"
          - "current_festival_day == total_days"
        side_effects:
          - "ticket sales and gate scans permanently disabled; wallet cash-out remains permitted post-close"
      - from: ON_SALE
        to: CANCELLED
        trigger: "POST /festivals/{id}/cancel"
        actor: FestivalDirector
        preconditions:
          - "posture == ON_SALE"
        side_effects:
          - "CASCADE: every Ticket with status=SOLD -> REFUNDED via weather_prorata_refund with elapsed=0 (full face value); every AddOn SOLD -> REFUNDED; every Performance SCHEDULED -> CANCELLED"
        note: "pre-event cancel: full refunds (elapsed 0)"

  - entity: VendorApplication
    initial_state: SUBMITTED
    terminal_states: [REJECTED, WITHDRAWN]
    transitions:
      - from: SUBMITTED
        to: UNDER_REVIEW
        trigger: "POST /vendor-applications/{id}/start-review"
        actor: VendorManager
        preconditions:
          - "Festival.operational_posture IN {PLANNING, ON_SALE}"
        side_effects: []
      - from: UNDER_REVIEW
        to: APPROVED
        trigger: "POST /vendor-applications/{id}/approve"
        actor: VendorManager
        preconditions:
          - "Zone.allocated_count < Zone.slot_capacity for booth_zone_id (slot available)"
          - "expected_zone_version matches Zone.version (OCC)"
        side_effects:
          - "compute booth_fee via booth_fee_calc; persist on application"
          - "increment booth_zone Zone.allocated_count by 1"
          - "increment Zone.version by 1"
        note: "guarded by cross-entity Zone capacity"
      - from: UNDER_REVIEW
        to: REJECTED
        trigger: "POST /vendor-applications/{id}/reject"
        actor: VendorManager
        preconditions:
          - "posture IN {PLANNING, ON_SALE}"
        side_effects: []
        note: "terminal; no slot was held"
      - from: APPROVED
        to: UNDER_REVIEW
        trigger: "POST /vendor-applications/{id}/return-for-revision"
        actor: VendorManager
        preconditions:
          - "fee_paid == 0 (cannot revise once any fee paid)"
        side_effects:
          - "COMPENSATION: decrement booth_zone Zone.allocated_count by 1; clear booth_fee back to null; increment Zone.version by 1"
        note: "revert edge (branching-with-revert); restores the slot to the pool"
      - from: APPROVED
        to: CONFIRMED
        trigger: "POST /vendor-applications/{id}/confirm"
        actor: Vendor
        preconditions:
          - "fee_paid >= booth_fee (paid in full via POST /vendor-applications/{id}/pay-fee)"
          - "Festival.operational_posture != CANCELLED"
        side_effects:
          - "booth slot becomes permanent for settlement; allocated_count unchanged (already counted at APPROVED)"
      - from: APPROVED
        to: WITHDRAWN
        trigger: "POST /vendor-applications/{id}/withdraw"
        actor: Vendor
        preconditions:
          - "fee_paid == 0"
        side_effects:
          - "COMPENSATION: decrement booth_zone Zone.allocated_count by 1; increment Zone.version by 1"
        note: "terminal; releases slot"

  - entity: Wristband
    initial_state: ISSUED
    terminal_states: [VOID, CLOSED]
    transitions:
      - from: ISSUED
        to: ACTIVE
        trigger: "POST /wristbands/{id}/activate"
        actor: BoxOffice
        preconditions:
          - "a Ticket with status=SOLD and matching festival_id is supplied and currently has wristband_id == null"
          - "Festival.operational_posture IN {ON_SALE, LIVE}"
        side_effects:
          - "link Ticket.wristband_id = this wristband; Ticket.status SOLD -> ACTIVATED"
          - "lifecycle_status ISSUED -> ACTIVE"
        note: "lifecycle dimension; presence_status stays OUTSIDE (parallel/independent axis)"
      - from: ACTIVE
        to: FROZEN
        trigger: "POST /wristbands/{id}/freeze OR system on festival weather-cancel cascade"
        actor: FestivalDirector | system
        preconditions:
          - "lifecycle_status == ACTIVE"
        side_effects:
          - "SPEND rejected while FROZEN; recompute Festival.total_wallet_liability to exclude this balance"
        note: "parallel axis: presence_status unaffected"
      - from: FROZEN
        to: ACTIVE
        trigger: "POST /wristbands/{id}/unfreeze"
        actor: FestivalDirector
        preconditions:
          - "lifecycle_status == FROZEN"
          - "Festival.operational_posture != CANCELLED"
        side_effects:
          - "recompute Festival.total_wallet_liability to re-include this balance"
        note: "cycle ACTIVE<->FROZEN on lifecycle dimension"
      - from: ACTIVE
        to: CLOSED
        trigger: "POST /wristbands/{id}/cashout"
        actor: BoxOffice
        preconditions:
          - "lifecycle_status == ACTIVE"
          - "presence_status == OUTSIDE (must have exited before cash-out)"
        side_effects:
          - "compute cashout via wristband_cashout; write WalletTxn CASHOUT + CASHOUT_FEE; set balance = 0"
          - "decrement Festival.total_wallet_liability by the pre-cashout balance"
          - "lifecycle_status -> CLOSED"
      - from: ISSUED
        to: VOID
        trigger: "POST /wristbands/{id}/void"
        actor: BoxOffice
        preconditions:
          - "lifecycle_status == ISSUED (never activated)"
        side_effects:
          - "rfid_uid freed for reuse within festival"

  - entity: Wristband
    initial_state: OUTSIDE
    terminal_states: []
    transitions:
      - from: OUTSIDE
        to: INSIDE
        trigger: "POST /festivals/{id}/gate-scan (direction=ENTER)"
        actor: GateAttendant
        preconditions:
          - "lifecycle_status == ACTIVE"
          - "Festival.operational_posture == LIVE (not SUSPENDED)"
          - "if entry_count >= 1 then reentry_used < Festival.max_reentries"
        side_effects:
          - "presence_status OUTSIDE -> INSIDE; entry_count += 1; if entry_count was >= 1 before this scan then reentry_used += 1; create GateEvent outcome=ADMITTED"
        note: "presence dimension; independent of lifecycle dimension"
      - from: INSIDE
        to: OUTSIDE
        trigger: "POST /festivals/{id}/gate-scan (direction=EXIT)"
        actor: GateAttendant
        preconditions:
          - "presence_status == INSIDE"
        side_effects:
          - "presence_status INSIDE -> OUTSIDE; create GateEvent outcome=EXITED"
        note: "EXIT permitted even when posture==SUSPENDED"

  - entity: Incident
    initial_state: OPEN
    terminal_states: [RESOLVED]
    transitions:
      - from: OPEN
        to: ESCALATED
        trigger: "POST /incidents/{id}/escalate"
        actor: FestivalDirector | GateAttendant
        preconditions:
          - "severity IN {HIGH, CRITICAL}"
        side_effects: []
      - from: ESCALATED
        to: OPEN
        trigger: "POST /incidents/{id}/deescalate"
        actor: FestivalDirector
        preconditions:
          - "status == ESCALATED"
        side_effects: []
        note: "revert edge"
      - from: OPEN
        to: RESOLVED
        trigger: "POST /incidents/{id}/resolve"
        actor: FestivalDirector | GateAttendant
        preconditions:
          - "status == OPEN"
        side_effects: []
      - from: ESCALATED
        to: RESOLVED
        trigger: "POST /incidents/{id}/resolve"
        actor: FestivalDirector
        preconditions:
          - "status == ESCALATED"
        side_effects: []

# =====================================================================
# §1.2.1 CONCURRENCY RULES (OCC on parent version)
# =====================================================================
concurrency_rules:
  - rule_id: approve-application-stale-zone
    parent_entity: Zone
    write_endpoint: "POST /vendor-applications/{id}/approve"
    occ_field: "expected_zone_version"
    description: |
      Approving a VendorApplication consumes one booth slot in its Zone and
      advances Zone.version. A second approval that still carries the Zone
      version observed before any prior approval is rejected as stale: the
      caller's view of remaining slot capacity is out of date, and committing
      it could over-allocate the zone beyond slot_capacity. The loser must
      re-read the Zone, re-confirm a slot remains, and retry with the fresh
      version. (CREATE-with-supersede shape: a new approval legitimately
      supersedes the prior occupancy snapshot of the slot pool.)
    error_id: ERR_STALE_ZONE_VERSION
    http_status: 412

  - rule_id: addon-sell-stale-lot
    parent_entity: ParkingLot
    write_endpoint: "POST /tickets/{id}/add-ons"
    occ_field: "expected_lot_version"
    description: |
      Selling a PARKING AddOn consumes one pass from the ParkingLot pool and
      advances ParkingLot.version. A sell carrying a ParkingLot version from
      before a prior sale is rejected as stale, because the caller's view of
      sold_count vs capacity is out of date and committing could oversell the
      lot. occ_field applies only when kind=PARKING. (Supersede shape: the
      new pass sale supersedes the prior view of the pool's remaining capacity.)
    error_id: ERR_STALE_LOT_VERSION
    http_status: 412

# =====================================================================
# §1.3 CALCULATION RULES TABLE
# =====================================================================
calculations:
  - name: booth_fee_calc
    trigger: "VendorApplication UNDER_REVIEW -> APPROVED (POST /vendor-applications/{id}/approve)"
    algorithm: tiered_pricing
    formula: |
      base        = TIER_RATE[booth_tier] * day_count
      surcharge   = base * ZONE_SURCHARGE[Zone.code]
      location_fee = round2(base + surcharge)            # round component 1 first
      power_fee   = round2(POWER_DAILY * day_count) if power_addon else 0.00
      booth_fee   = round2(location_fee + power_fee)     # then add component 2
    input_set: "single VendorApplication; reads its Zone.code for surcharge; pinned evaluation order rounds location_fee BEFORE adding power_fee"
    constants:
      TIER_RATE: { STANDARD: 150.00, PREMIUM: 300.00, FOOD: 450.00 }
      ZONE_SURCHARGE: { A: 0.20, B: 0.10, C: 0.00 }
      POWER_DAILY: 40.00
    precision: "2 decimal places, round_half_up; per-component rounding order pinned (location_fee then +power_fee)"

  - name: weather_prorata_refund
    trigger: "Festival cancel cascade (ON_SALE->CANCELLED or SUSPENDED->CANCELLED), per Ticket"
    algorithm: forward_looking
    formula: |
      elapsed_days  = Festival.current_festival_day        # 0 before LIVE; N when day N open
      remaining     = max(0, Festival.total_days - elapsed_days)
      refund_amount = round2( Ticket.face_value * (remaining / Festival.total_days) )
      fee_withheld  = 0.00
    input_set: "every Ticket with status IN {SOLD, ACTIVATED} on the festival at cancel time; elapsed = current_festival_day"
    constants: {}
    precision: "2 decimal places, round_half_up"
    variants:
      - name: full_remaining
        when: "festival CANCELLED from ON_SALE (current_festival_day == 0)"
        difference: "remaining == total_days, refund == full face_value"
      - name: partial_remaining
        when: "festival CANCELLED from SUSPENDED after one or more days opened"
        difference: "remaining < total_days, refund prorated down by elapsed days"

  - name: voluntary_tiered_refund
    trigger: "Patron-initiated single-ticket refund (POST /tickets/{id}/refund)"
    algorithm: tiered_pricing
    formula: |
      days_before = date(Festival.start_date) - date(today)   # whole days; today from /_clock
      if   days_before >= 14: fee_pct = 0.00
      elif days_before >= 7 : fee_pct = 0.25
      elif days_before >= 1 : fee_pct = 0.50
      else                  : fee_pct = 1.00                  # same-day / after start: no refund
      fee_withheld  = round2(Ticket.face_value * fee_pct)
      refund_amount = round2(Ticket.face_value - fee_withheld)
    input_set: "one Ticket with status=SOLD; tier selected by whole days between today and start_date"
    constants:
      FEE_PCT_TIERS: { ">=14": 0.00, "7..13": 0.25, "1..6": 0.50, "<1": 1.00 }
    precision: "2 decimal places, round_half_up; threshold uses >= on whole-day counts"
    variants:
      - name: weather_prorata
        when: "refund originates from a festival weather/cancel cascade instead of patron request"
        difference: "DIFFERENT ENTITY-DOMAIN ALGORITHM: prorates by remaining festival days (forward_looking), withholds no fee — distinct from this chronological days-before-event fee tiering"

  - name: wristband_cashout
    trigger: "Wristband ACTIVE -> CLOSED (POST /wristbands/{id}/cashout)"
    algorithm: aggregation
    formula: |
      pre_balance   = Wristband.balance
      fee           = round2(pre_balance * Festival.wristband_cashout_pct)
      refund_amount = round2(pre_balance - fee)               # floor 0 implicit since fee <= balance
    input_set: "single Wristband; pre_balance is the running wallet balance (sum of TOPUP - SPEND, never negative)"
    constants: {}
    precision: "2 decimal places, round_half_up"

  - name: vendor_settlement_payout
    trigger: "POST /vendor-applications/{id}/settle (FestivalDirector, posture==CLOSED)"
    algorithm: aggregation
    formula: |
      gross         = round2( SUM(WalletTxn.amount WHERE kind=SPEND
                              AND vendor_application_id == this application) )   # sum THEN round
      commission    = round2( gross * Festival.vendor_commission_pct )          # commission on summed gross
      net           = round2( gross - commission )
      outstanding   = max(0, booth_fee - fee_paid)
      payout        = round2( net - outstanding )
    input_set: "all SPEND WalletTxn credited to this confirmed application's booth; gross summed across txns THEN rounded (NOT per-line), commission applied to the summed gross"
    constants:
      ROUNDING_ORDER: "sum_then_round"
    precision: "2 decimal places, round_half_up; aggregation order pinned to sum-then-round (diverges from per-line-then-sum)"

  - name: festival_sales_report
    trigger: "GET /festivals/{id}/sales-report"
    algorithm: aggregation
    formula: |
      ticket_revenue   = round2( SUM(Ticket.face_value WHERE status IN {SOLD, ACTIVATED}) )
      addon_revenue    = round2( SUM(AddOn.price       WHERE status == SOLD) )
      cashless_volume  = round2( SUM(WalletTxn.amount  WHERE kind == SPEND) )
      refunds_issued   = round2( SUM(Refund.amount     WHERE status == ISSUED) )
      net_revenue      = round2( ticket_revenue + addon_revenue - refunds_issued )
    input_set: "festival-scoped; each sub-aggregate pins its own status filter; REFUNDED/VOID tickets and REFUNDED add-ons excluded from revenue"
    constants: {}
    precision: "2 decimal places, round_half_up"

# =====================================================================
# §1.4 VALIDATION RULES TABLE (ordered by priority)
# =====================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all
  - priority: 2
    category: auth
    check: "role permitted for this operation per §1.7 RBAC"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: all
  - priority: 3
    category: existence
    check: "all path-referenced resources exist, validated left-to-right"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all routes with path ids"
  - priority: 4
    category: business_referential
    check: "all body FK references resolve to existing rows of the correct entity and same festival"
    error_id: ERR_FK_NOT_FOUND
    http_status: 422
    applies_to: "POST/PUT bodies carrying FK fields"
  - priority: 5
    category: existence
    check: "vendor acting via X-User-ID owns the VendorApplication (vendor_id == X-User-ID) for vendor-exclusive transitions"
    error_id: ERR_NOT_OWNER
    http_status: 403
    applies_to: "POST /vendor-applications/{id}/confirm, /withdraw, /pay-fee"
  - priority: 6
    category: state
    check: "target resource is in a state from which the requested transition is defined in §1.2"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints"
  - priority: 7
    category: state
    check: "Festival.operational_posture permits this child operation (e.g. ticket sale requires ON_SALE; gate ENTER requires LIVE)"
    error_id: ERR_FESTIVAL_POSTURE
    http_status: 409
    applies_to: "POST tickets, add-ons, activate, gate-scan(ENTER), topup, spend"
  - priority: 8
    category: state
    check: "gate ENTER while Festival.operational_posture == SUSPENDED (weather hold) is rejected; EXIT still allowed"
    error_id: ERR_FESTIVAL_SUSPENDED
    http_status: 409
    applies_to: "POST /festivals/{id}/gate-scan with direction=ENTER"
  - priority: 9
    category: business_constraint
    check: "OCC: expected_zone_version / expected_lot_version matches the parent's current version"
    error_id: ERR_STALE_ZONE_VERSION
    http_status: 412
    applies_to: "POST /vendor-applications/{id}/approve (zone), POST /tickets/{id}/add-ons (lot)"
  - priority: 10
    category: business_safety
    check: "gate ENTER on a wristband that is already INSIDE is rejected (double-entry / pass-back guard)"
    error_id: ERR_ALREADY_INSIDE
    http_status: 409
    applies_to: "POST /festivals/{id}/gate-scan direction=ENTER"
  - priority: 11
    category: business_safety
    check: "gate ENTER beyond the re-entry cap (reentry_used >= max_reentries) is rejected"
    error_id: ERR_REENTRY_LIMIT
    http_status: 409
    applies_to: "POST /festivals/{id}/gate-scan direction=ENTER"
  - priority: 12
    category: business_temporal
    check: "Performance interval [starts_at, ends_at) plus Stage.changeover_minutes buffer must not collide with any SCHEDULED performance on the SAME stage. Semantics: half-open [starts_at, ends_at); reject when starts_at < existing.ends_at + changeover_minutes AND ends_at + changeover_minutes > existing.starts_at"
    error_id: ERR_STAGE_CONFLICT
    http_status: 409
    applies_to: "POST /stages/{id}/performances"
  - priority: 13
    category: business_temporal
    check: "Same artist_name must not have two SCHEDULED performances whose half-open intervals [starts_at, ends_at) overlap anywhere in the festival (across ALL stages), with NO buffer; exact adjacency (existing.ends_at == new.starts_at) is ALLOWED. Reject when starts_at < existing.ends_at AND ends_at > existing.starts_at for any SCHEDULED performance of the same artist_name in the same festival"
    error_id: ERR_ARTIST_DOUBLE_BOOKED
    http_status: 409
    applies_to: "POST /stages/{id}/performances"
  - priority: 14
    category: business_constraint
    check: "ends_at > starts_at on a Performance"
    error_id: ERR_INVALID_INTERVAL
    http_status: 422
    applies_to: "POST /stages/{id}/performances"
  - priority: 15
    category: business_constraint
    check: "rfid_uid unique among Wristband rows with lifecycle_status != VOID in the same festival"
    error_id: ERR_DUPLICATE_RFID
    http_status: 409
    applies_to: "POST /festivals/{id}/wristbands"
  - priority: 16
    category: business_constraint
    check: "VendorApplication approve requires the target Zone to have a free slot (allocated_count < slot_capacity)"
    error_id: ERR_ZONE_FULL
    http_status: 409
    applies_to: "POST /vendor-applications/{id}/approve"
  - priority: 17
    category: business_constraint
    check: "AddOn PARKING sell requires the lot to have a free pass (sold_count < capacity); CAMPING sell requires area free plot"
    error_id: ERR_CAPACITY_FULL
    http_status: 409
    applies_to: "POST /tickets/{id}/add-ons"
  - priority: 18
    category: business_fiscal
    check: "wallet SPEND requires balance >= amount; cash-out and spend never drive balance negative"
    error_id: ERR_INSUFFICIENT_BALANCE
    http_status: 422
    applies_to: "POST /wristbands/{id}/spend"
  - priority: 19
    category: business_fiscal
    check: "VendorApplication confirm requires fee_paid >= booth_fee"
    error_id: ERR_FEE_UNPAID
    http_status: 409
    applies_to: "POST /vendor-applications/{id}/confirm"
  - priority: 20
    category: business_constraint
    check: "Ticket.day_count and VendorApplication.day_count and AddOn.nights within 1..Festival.total_days"
    error_id: ERR_DAYCOUNT_RANGE
    http_status: 422
    applies_to: "POST tickets, vendor-applications, camping add-ons"
  - priority: 21
    category: business_constraint
    check: "request body field types/enums valid and required fields present (kind=CAMPING requires camping_area_id and nights; kind=PARKING requires parking_lot_id)"
    error_id: ERR_INVALID_REQUEST
    http_status: 422
    applies_to: all

# =====================================================================
# §1.5 API ENDPOINT TABLE
# =====================================================================
endpoints:
  # ---- Festival lifecycle ----
  - method: POST
    path: "/festivals"
    description: "create a festival in PLANNING"
    roles: [FestivalDirector]
    code: 201
    input: [name, start_date, end_date, "max_reentries?", "wristband_cashout_pct?", "vendor_commission_pct?"]
    output: Festival
    side_effects: ["compute total_days from dates; posture=PLANNING; current_festival_day=0"]
  - method: GET
    path: "/festivals/{id}"
    description: "fetch a festival"
    roles: [FestivalDirector, BoxOffice, VendorManager, GateAttendant, Vendor]
    code: 200
    input: []
    output: Festival
    side_effects: []
  - method: GET
    path: "/festivals"
    description: "list festivals"
    roles: [FestivalDirector, BoxOffice, VendorManager, GateAttendant, Vendor]
    code: 200
    input: ["limit?", "offset?"]
    output: Festival[]
    side_effects: []
  - method: POST
    path: "/festivals/{id}/open-sales"
    description: "PLANNING -> ON_SALE"
    roles: [FestivalDirector]
    code: 200
    input: []
    output: Festival
    side_effects: ["posture -> ON_SALE; increments Festival.version by 1"]
  - method: POST
    path: "/festivals/{id}/go-live"
    description: "ON_SALE -> LIVE"
    roles: [FestivalDirector]
    code: 200
    input: []
    output: Festival
    side_effects: ["posture -> LIVE; current_festival_day -> 1; increments Festival.version by 1"]
  - method: POST
    path: "/festivals/{id}/open-day"
    description: "advance current_festival_day to a given 1-indexed day while LIVE"
    roles: [FestivalDirector]
    code: 200
    input: [day]
    output: Festival
    side_effects: ["set current_festival_day = day (1..total_days); increments Festival.version by 1"]
  - method: POST
    path: "/festivals/{id}/weather-hold"
    description: "LIVE -> SUSPENDED (weather hold)"
    roles: [FestivalDirector]
    code: 200
    input: []
    output: Festival
    side_effects: ["posture -> SUSPENDED; ENTER scans now rejected; increments Festival.version by 1"]
  - method: POST
    path: "/festivals/{id}/resume"
    description: "SUSPENDED -> LIVE"
    roles: [FestivalDirector]
    code: 200
    input: []
    output: Festival
    side_effects: ["posture -> LIVE; increments Festival.version by 1"]
  - method: POST
    path: "/festivals/{id}/cancel"
    description: "ON_SALE|SUSPENDED -> CANCELLED with weather-prorata refund cascade"
    roles: [FestivalDirector]
    code: 200
    input: []
    output: Festival
    side_effects:
      - "CASCADE issue weather_prorata_refund per SOLD/ACTIVATED Ticket; Ticket->REFUNDED; AddOn->REFUNDED; Performance->CANCELLED; active linked Wristbands auto-FROZEN; recompute total_refund_liability and total_wallet_liability; increments Festival.version by 1"
  - method: POST
    path: "/festivals/{id}/close"
    description: "LIVE -> CLOSED at final day"
    roles: [FestivalDirector]
    code: 200
    input: []
    output: Festival
    side_effects: ["posture -> CLOSED; increments Festival.version by 1"]
  - method: GET
    path: "/festivals/{id}/sales-report"
    description: "computed sales aggregates (festival_sales_report)"
    roles: [FestivalDirector, BoxOffice]
    code: 200
    input: []
    output: "{ ticket_revenue: number, addon_revenue: number, cashless_volume: number, refunds_issued: number, net_revenue: number }"
    side_effects: []

  # ---- Zones / Stages / Lots / Areas ----
  - method: POST
    path: "/festivals/{id}/zones"
    description: "create a booth zone"
    roles: [FestivalDirector]
    code: 201
    input: [code, slot_capacity]
    output: Zone
    side_effects: ["allocated_count=0"]
  - method: GET
    path: "/festivals/{id}/zones"
    description: "list zones of a festival (FK reverse-reachability for Zone.festival_id)"
    roles: [FestivalDirector, VendorManager, Vendor]
    code: 200
    input: ["limit?", "offset?"]
    output: Zone[]
    side_effects: []
  - method: GET
    path: "/zones/{id}"
    description: "fetch a zone"
    roles: [FestivalDirector, VendorManager, Vendor]
    code: 200
    input: []
    output: Zone
    side_effects: []
  - method: POST
    path: "/festivals/{id}/stages"
    description: "create a stage"
    roles: [FestivalDirector]
    code: 201
    input: [name, "changeover_minutes?"]
    output: Stage
    side_effects: []
  - method: GET
    path: "/festivals/{id}/stages"
    description: "list stages of a festival (FK reverse-reachability for Stage.festival_id)"
    roles: [FestivalDirector, VendorManager, GateAttendant]
    code: 200
    input: ["limit?", "offset?"]
    output: Stage[]
    side_effects: []
  - method: GET
    path: "/stages/{id}"
    description: "fetch a stage"
    roles: [FestivalDirector, VendorManager]
    code: 200
    input: []
    output: Stage
    side_effects: []
  - method: POST
    path: "/festivals/{id}/parking-lots"
    description: "create a parking lot"
    roles: [FestivalDirector]
    code: 201
    input: [name, capacity, price_per_pass]
    output: ParkingLot
    side_effects: ["sold_count=0"]
  - method: GET
    path: "/festivals/{id}/parking-lots"
    description: "list parking lots (FK reverse-reachability for ParkingLot.festival_id)"
    roles: [FestivalDirector, BoxOffice]
    code: 200
    input: ["limit?", "offset?"]
    output: ParkingLot[]
    side_effects: []
  - method: GET
    path: "/parking-lots/{id}"
    description: "fetch a parking lot"
    roles: [FestivalDirector, BoxOffice]
    code: 200
    input: []
    output: ParkingLot
    side_effects: []
  - method: POST
    path: "/festivals/{id}/camping-areas"
    description: "create a camping area"
    roles: [FestivalDirector]
    code: 201
    input: [name, capacity, price_per_night]
    output: CampingArea
    side_effects: ["sold_count=0"]
  - method: GET
    path: "/festivals/{id}/camping-areas"
    description: "list camping areas (FK reverse-reachability for CampingArea.festival_id)"
    roles: [FestivalDirector, BoxOffice]
    code: 200
    input: ["limit?", "offset?"]
    output: CampingArea[]
    side_effects: []
  - method: GET
    path: "/camping-areas/{id}"
    description: "fetch a camping area"
    roles: [FestivalDirector, BoxOffice]
    code: 200
    input: []
    output: CampingArea
    side_effects: []

  # ---- Performances ----
  - method: POST
    path: "/stages/{id}/performances"
    description: "schedule a performance on a stage (temporal overlap + buffer enforced)"
    roles: [FestivalDirector]
    code: 201
    input: [artist_name, starts_at, ends_at]
    output: Performance
    side_effects: ["status=SCHEDULED; reject on ERR_INVALID_INTERVAL, ERR_STAGE_CONFLICT (per-stage buffered), ERR_ARTIST_DOUBLE_BOOKED (festival-wide artist, no buffer)"]
  - method: GET
    path: "/stages/{id}/performances"
    description: "list performances on a stage (FK reverse-reachability for Performance.stage_id)"
    roles: [FestivalDirector, GateAttendant]
    code: 200
    input: ["limit?", "offset?"]
    output: Performance[]
    side_effects: []
  - method: GET
    path: "/performances"
    description: "list performances; filter by festival_id (FK reverse-reachability for Performance.festival_id)"
    roles: [FestivalDirector, GateAttendant]
    code: 200
    input: ["festival_id?", "limit?", "offset?"]
    output: Performance[]
    side_effects: []
  - method: GET
    path: "/performances/{id}"
    description: "fetch a performance"
    roles: [FestivalDirector, GateAttendant]
    code: 200
    input: []
    output: Performance
    side_effects: []

  # ---- Tickets / Add-ons / Refunds ----
  - method: POST
    path: "/festivals/{id}/tickets"
    description: "sell a ticket (posture must be ON_SALE)"
    roles: [BoxOffice]
    code: 201
    input: [ticket_type, day_count, purchaser_email]
    output: Ticket
    side_effects: ["compute face_value; status=SOLD"]
  - method: GET
    path: "/festivals/{id}/tickets"
    description: "list tickets of a festival (FK reverse-reachability for Ticket.festival_id)"
    roles: [FestivalDirector, BoxOffice]
    code: 200
    input: ["limit?", "offset?"]
    output: Ticket[]
    side_effects: []
  - method: GET
    path: "/tickets/{id}"
    description: "fetch a ticket"
    roles: [FestivalDirector, BoxOffice]
    code: 200
    input: []
    output: Ticket
    side_effects: []
  - method: GET
    path: "/tickets"
    description: "list tickets; filter by wristband_id (FK reverse-reachability for Ticket.wristband_id)"
    roles: [FestivalDirector, BoxOffice]
    code: 200
    input: ["wristband_id?", "limit?", "offset?"]
    output: Ticket[]
    side_effects: []
  - method: POST
    path: "/tickets/{id}/refund"
    description: "patron voluntary refund (voluntary_tiered_refund)"
    roles: [BoxOffice]
    code: 201
    input: []
    output: Refund
    side_effects: ["compute voluntary_tiered_refund; Ticket SOLD->REFUNDED; total_refund_liability += amount"]
  - method: POST
    path: "/tickets/{id}/add-ons"
    description: "sell a parking/camping add-on against a ticket (quota enforced; OCC for parking)"
    roles: [BoxOffice]
    code: 201
    input: [kind, "parking_lot_id?", "camping_area_id?", "nights?", "expected_lot_version?"]
    output: AddOn
    side_effects: ["compute price; status=SOLD; increment lot/area sold_count; for PARKING increment ParkingLot.version by 1"]
  - method: GET
    path: "/tickets/{id}/add-ons"
    description: "list add-ons on a ticket (FK reverse-reachability for AddOn.ticket_id)"
    roles: [FestivalDirector, BoxOffice]
    code: 200
    input: ["limit?", "offset?"]
    output: AddOn[]
    side_effects: []
  - method: GET
    path: "/add-ons"
    description: "list add-ons; filter by festival_id, parking_lot_id, camping_area_id (FK reverse-reachability for those FKs)"
    roles: [FestivalDirector, BoxOffice]
    code: 200
    input: ["festival_id?", "parking_lot_id?", "camping_area_id?", "limit?", "offset?"]
    output: AddOn[]
    side_effects: []
  - method: GET
    path: "/add-ons/{id}"
    description: "fetch an add-on (anchors the /add-ons collection segment)"
    roles: [FestivalDirector, BoxOffice]
    code: 200
    input: []
    output: AddOn
    side_effects: []
  - method: GET
    path: "/refunds/{id}"
    description: "fetch a refund (anchors the /refunds collection segment)"
    roles: [FestivalDirector, BoxOffice]
    code: 200
    input: []
    output: Refund
    side_effects: []
  - method: GET
    path: "/festivals/{id}/refunds"
    description: "list refunds of a festival (FK reverse-reachability for Refund.festival_id)"
    roles: [FestivalDirector, BoxOffice]
    code: 200
    input: ["limit?", "offset?"]
    output: Refund[]
    side_effects: []
  - method: GET
    path: "/refunds"
    description: "list refunds; filter by ticket_id (FK reverse-reachability for Refund.ticket_id)"
    roles: [FestivalDirector, BoxOffice]
    code: 200
    input: ["ticket_id?", "limit?", "offset?"]
    output: Refund[]
    side_effects: []

  # ---- Wristbands / Wallet ----
  - method: POST
    path: "/festivals/{id}/wristbands"
    description: "issue an RFID wristband (ISSUED)"
    roles: [BoxOffice]
    code: 201
    input: [rfid_uid]
    output: Wristband
    side_effects: ["lifecycle_status=ISSUED; presence_status=OUTSIDE; balance=0; ERR_DUPLICATE_RFID on collision"]
  - method: GET
    path: "/festivals/{id}/wristbands"
    description: "list wristbands of a festival (FK reverse-reachability for Wristband.festival_id)"
    roles: [FestivalDirector, BoxOffice, GateAttendant]
    code: 200
    input: ["limit?", "offset?"]
    output: Wristband[]
    side_effects: []
  - method: GET
    path: "/wristbands/{id}"
    description: "fetch a wristband"
    roles: [FestivalDirector, BoxOffice, GateAttendant]
    code: 200
    input: []
    output: Wristband
    side_effects: []
  - method: POST
    path: "/wristbands/{id}/activate"
    description: "ISSUED -> ACTIVE, link to a SOLD ticket"
    roles: [BoxOffice]
    code: 200
    input: [ticket_id]
    output: Wristband
    side_effects: ["link Ticket.wristband_id; Ticket SOLD->ACTIVATED; lifecycle_status->ACTIVE"]
  - method: POST
    path: "/wristbands/{id}/topup"
    description: "add funds to the cashless wallet (TOPUP)"
    roles: [BoxOffice]
    code: 201
    input: [amount]
    output: WalletTxn
    side_effects: ["balance += amount; Festival.total_wallet_liability += amount; requires lifecycle_status==ACTIVE"]
  - method: POST
    path: "/wristbands/{id}/spend"
    description: "deduct funds at a vendor booth (SPEND)"
    roles: [BoxOffice]
    code: 201
    input: [amount, booth_zone_id]
    output: WalletTxn
    side_effects: ["balance -= amount (>=0 enforced); credit booth's confirmed vendor_application_id; Festival.total_wallet_liability -= amount; requires lifecycle_status==ACTIVE"]
  - method: POST
    path: "/wristbands/{id}/freeze"
    description: "ACTIVE -> FROZEN (manual)"
    roles: [FestivalDirector]
    code: 200
    input: []
    output: Wristband
    side_effects: ["recompute Festival.total_wallet_liability excluding this balance"]
  - method: POST
    path: "/wristbands/{id}/unfreeze"
    description: "FROZEN -> ACTIVE"
    roles: [FestivalDirector]
    code: 200
    input: []
    output: Wristband
    side_effects: ["recompute Festival.total_wallet_liability re-including this balance"]
  - method: POST
    path: "/wristbands/{id}/cashout"
    description: "ACTIVE -> CLOSED, refund unspent balance minus fee"
    roles: [BoxOffice]
    code: 200
    input: []
    output: Wristband
    side_effects: ["compute wristband_cashout; write CASHOUT + CASHOUT_FEE WalletTxns; balance=0; Festival.total_wallet_liability -= pre_balance; lifecycle_status->CLOSED"]
  - method: POST
    path: "/wristbands/{id}/void"
    description: "ISSUED -> VOID (never activated)"
    roles: [BoxOffice]
    code: 200
    input: []
    output: Wristband
    side_effects: ["rfid_uid freed for reuse"]
  - method: GET
    path: "/wristbands/{id}/wallet-txns"
    description: "list wallet txns of a wristband (FK reverse-reachability for WalletTxn.wristband_id)"
    roles: [FestivalDirector, BoxOffice]
    code: 200
    input: ["limit?", "offset?"]
    output: WalletTxn[]
    side_effects: []
  - method: GET
    path: "/wallet-txns"
    description: "list wallet txns; filter by festival_id, booth_zone_id, vendor_application_id (FK reverse-reachability)"
    roles: [FestivalDirector, BoxOffice]
    code: 200
    input: ["festival_id?", "booth_zone_id?", "vendor_application_id?", "limit?", "offset?"]
    output: WalletTxn[]
    side_effects: []
  - method: GET
    path: "/wallet-txns/{id}"
    description: "fetch a wallet txn (anchors the /wallet-txns collection segment)"
    roles: [FestivalDirector, BoxOffice]
    code: 200
    input: []
    output: WalletTxn
    side_effects: []

  # ---- Gate scans ----
  - method: POST
    path: "/festivals/{id}/gate-scan"
    description: "scan a wristband at the gate (ENTER/EXIT) with re-entry + posture gating"
    roles: [GateAttendant]
    code: 201
    input: [wristband_id, direction]
    output: GateEvent
    side_effects: ["update Wristband presence_status/entry_count/reentry_used; emit GateEvent ADMITTED/EXITED/DENIED"]
  - method: GET
    path: "/festivals/{id}/gate-events"
    description: "list gate events of a festival (FK reverse-reachability for GateEvent.festival_id)"
    roles: [FestivalDirector, GateAttendant]
    code: 200
    input: ["limit?", "offset?"]
    output: GateEvent[]
    side_effects: []
  - method: GET
    path: "/gate-events"
    description: "list gate events; filter by wristband_id (FK reverse-reachability for GateEvent.wristband_id)"
    roles: [FestivalDirector, GateAttendant]
    code: 200
    input: ["wristband_id?", "limit?", "offset?"]
    output: GateEvent[]
    side_effects: []
  - method: GET
    path: "/gate-events/{id}"
    description: "fetch a gate event (anchors the /gate-events collection segment)"
    roles: [FestivalDirector, GateAttendant]
    code: 200
    input: []
    output: GateEvent
    side_effects: []

  # ---- Vendors / Applications ----
  - method: POST
    path: "/vendors"
    description: "register a vendor"
    roles: [VendorManager, Vendor]
    code: 201
    input: [company_name, contact_email]
    output: Vendor
    side_effects: ["payout_total=0"]
  - method: GET
    path: "/vendors/{id}"
    description: "fetch a vendor"
    roles: [FestivalDirector, VendorManager, Vendor]
    code: 200
    input: []
    output: Vendor
    side_effects: []
  - method: POST
    path: "/festivals/{id}/vendor-applications"
    description: "submit a booth application (SUBMITTED)"
    roles: [Vendor, VendorManager]
    code: 201
    input: [vendor_id, booth_zone_id, booth_tier, day_count, "power_addon?"]
    output: VendorApplication
    side_effects: ["status=SUBMITTED"]
  - method: GET
    path: "/festivals/{id}/vendor-applications"
    description: "list applications of a festival (FK reverse-reachability for VendorApplication.festival_id)"
    roles: [FestivalDirector, VendorManager]
    code: 200
    input: ["limit?", "offset?"]
    output: VendorApplication[]
    side_effects: []
  - method: GET
    path: "/vendor-applications/{id}"
    description: "fetch an application"
    roles: [FestivalDirector, VendorManager, Vendor]
    code: 200
    input: []
    output: VendorApplication
    side_effects: []
  - method: GET
    path: "/vendor-applications"
    description: "list applications; filter by vendor_id, booth_zone_id (FK reverse-reachability for those FKs)"
    roles: [FestivalDirector, VendorManager, Vendor]
    code: 200
    input: ["vendor_id?", "booth_zone_id?", "limit?", "offset?"]
    output: VendorApplication[]
    side_effects: []
  - method: POST
    path: "/vendor-applications/{id}/start-review"
    description: "SUBMITTED -> UNDER_REVIEW"
    roles: [VendorManager]
    code: 200
    input: []
    output: VendorApplication
    side_effects: []
  - method: POST
    path: "/vendor-applications/{id}/approve"
    description: "UNDER_REVIEW -> APPROVED (computes booth_fee, consumes zone slot, OCC on zone)"
    roles: [VendorManager]
    code: 200
    input: [expected_zone_version]
    output: VendorApplication
    side_effects: ["compute booth_fee_calc; Zone.allocated_count += 1; increments Zone.version by 1"]
  - method: POST
    path: "/vendor-applications/{id}/reject"
    description: "UNDER_REVIEW -> REJECTED"
    roles: [VendorManager]
    code: 200
    input: []
    output: VendorApplication
    side_effects: []
  - method: POST
    path: "/vendor-applications/{id}/return-for-revision"
    description: "APPROVED -> UNDER_REVIEW (revert; releases slot)"
    roles: [VendorManager]
    code: 200
    input: []
    output: VendorApplication
    side_effects: ["Zone.allocated_count -= 1; booth_fee=null; increments Zone.version by 1"]
  - method: POST
    path: "/vendor-applications/{id}/pay-fee"
    description: "record a booth-fee payment"
    roles: [Vendor]
    code: 200
    input: [amount]
    output: VendorApplication
    side_effects: ["fee_paid += amount"]
  - method: POST
    path: "/vendor-applications/{id}/confirm"
    description: "APPROVED -> CONFIRMED (requires fee paid in full)"
    roles: [Vendor]
    code: 200
    input: []
    output: VendorApplication
    side_effects: ["status=CONFIRMED"]
  - method: POST
    path: "/vendor-applications/{id}/withdraw"
    description: "APPROVED -> WITHDRAWN (releases slot)"
    roles: [Vendor]
    code: 200
    input: []
    output: VendorApplication
    side_effects: ["Zone.allocated_count -= 1; increments Zone.version by 1"]
  - method: POST
    path: "/vendor-applications/{id}/settle"
    description: "settle a confirmed booth at festival close (vendor_settlement_payout)"
    roles: [FestivalDirector]
    code: 200
    input: []
    output: VendorApplication
    side_effects: ["compute vendor_settlement_payout; credit Vendor.payout_total"]

  # ---- Incidents ----
  - method: POST
    path: "/festivals/{id}/incidents"
    description: "log a lost-child / medical incident"
    roles: [GateAttendant, FestivalDirector]
    code: 201
    input: [incident_type, "severity?", "linked_wristband_id?", "notes?"]
    output: Incident
    side_effects: ["status=OPEN"]
  - method: GET
    path: "/festivals/{id}/incidents"
    description: "list incidents of a festival (FK reverse-reachability for Incident.festival_id)"
    roles: [FestivalDirector, GateAttendant]
    code: 200
    input: ["limit?", "offset?"]
    output: Incident[]
    side_effects: []
  - method: GET
    path: "/incidents/{id}"
    description: "fetch an incident"
    roles: [FestivalDirector, GateAttendant]
    code: 200
    input: []
    output: Incident
    side_effects: []
  - method: GET
    path: "/incidents"
    description: "list incidents; filter by linked_wristband_id (FK reverse-reachability)"
    roles: [FestivalDirector, GateAttendant]
    code: 200
    input: ["linked_wristband_id?", "limit?", "offset?"]
    output: Incident[]
    side_effects: []
  - method: POST
    path: "/incidents/{id}/escalate"
    description: "OPEN -> ESCALATED (HIGH/CRITICAL only)"
    roles: [FestivalDirector, GateAttendant]
    code: 200
    input: []
    output: Incident
    side_effects: []
  - method: POST
    path: "/incidents/{id}/deescalate"
    description: "ESCALATED -> OPEN (revert)"
    roles: [FestivalDirector]
    code: 200
    input: []
    output: Incident
    side_effects: []
  - method: POST
    path: "/incidents/{id}/resolve"
    description: "OPEN|ESCALATED -> RESOLVED"
    roles: [FestivalDirector, GateAttendant]
    code: 200
    input: []
    output: Incident
    side_effects: []

  # ---- Test-driving clock ----
  - method: POST
    path: "/_clock/set_current_utc"
    description: "set the server's notion of 'now' (drives voluntary_tiered_refund day tiers)"
    roles: [FestivalDirector]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string }"
    side_effects: ["server clock pinned for deterministic day-tier calculations"]

# =====================================================================
# §1.6 ERROR CODE CATALOG
# =====================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header missing"
  - id: ERR_FORBIDDEN_ROLE
    http: 403
    condition: "authenticated role not permitted for this endpoint"
  - id: ERR_NOT_OWNER
    http: 403
    condition: "vendor X-User-ID does not own the target VendorApplication"
  - id: ERR_NOT_FOUND
    http: 404
    condition: "path-referenced resource does not exist"
  - id: ERR_FK_NOT_FOUND
    http: 422
    condition: "body foreign key does not resolve to an existing row of the correct entity / festival"
  - id: ERR_INVALID_REQUEST
    http: 422
    condition: "malformed body, missing required field, bad enum/type, or kind/field combination invalid"
  - id: ERR_DAYCOUNT_RANGE
    http: 422
    condition: "day_count or nights outside 1..Festival.total_days"
  - id: ERR_INVALID_INTERVAL
    http: 422
    condition: "Performance ends_at <= starts_at"
  - id: ERR_INVALID_STATE
    http: 409
    condition: "requested transition not defined from the resource's current state"
  - id: ERR_FESTIVAL_POSTURE
    http: 409
    condition: "festival posture does not permit this child operation (e.g. sell ticket when not ON_SALE)"
  - id: ERR_FESTIVAL_SUSPENDED
    http: 409
    condition: "gate ENTER attempted while festival posture == SUSPENDED (weather hold)"
  - id: ERR_ALREADY_INSIDE
    http: 409
    condition: "gate ENTER on a wristband whose presence_status is already INSIDE"
  - id: ERR_REENTRY_LIMIT
    http: 409
    condition: "gate ENTER would exceed Festival.max_reentries (reentry_used >= max_reentries)"
  - id: ERR_STAGE_CONFLICT
    http: 409
    condition: "performance interval plus changeover buffer collides with a SCHEDULED performance on the same stage (per-stage, buffered, half-open)"
  - id: ERR_ARTIST_DOUBLE_BOOKED
    http: 409
    condition: "same artist_name has a SCHEDULED performance whose half-open interval overlaps the new one anywhere in the festival (festival-wide, no buffer; exact adjacency allowed)"
  - id: ERR_DUPLICATE_RFID
    http: 409
    condition: "rfid_uid already used by a non-VOID wristband in the same festival"
  - id: ERR_ZONE_FULL
    http: 409
    condition: "zone allocated_count == slot_capacity at approval"
  - id: ERR_CAPACITY_FULL
    http: 409
    condition: "parking lot or camping area sold_count == capacity at sell"
  - id: ERR_FEE_UNPAID
    http: 409
    condition: "confirm attempted while fee_paid < booth_fee"
  - id: ERR_INSUFFICIENT_BALANCE
    http: 422
    condition: "SPEND amount exceeds wristband wallet balance"
  - id: ERR_STALE_ZONE_VERSION
    http: 412
    condition: "expected_zone_version does not match current Zone.version on approve (OCC)"
  - id: ERR_STALE_LOT_VERSION
    http: 412
    condition: "expected_lot_version does not match current ParkingLot.version on parking add-on sell (OCC)"

# =====================================================================
# §1.7 RBAC MATRIX
# =====================================================================
roles:
  - name: FestivalDirector
    description: "operations owner; controls festival posture, weather holds, cancellation cascade, settlement, incidents, clock"
    identity: opaque
    exclusive_operations:
      - "POST /festivals and all /festivals/{id}/{open-sales,go-live,open-day,weather-hold,resume,cancel,close}"
      - "POST /festivals/{id}/zones,/stages,/parking-lots,/camping-areas"
      - "POST /stages/{id}/performances"
      - "POST /wristbands/{id}/{freeze,unfreeze}"
      - "POST /vendor-applications/{id}/settle"
      - "POST /incidents/{id}/deescalate"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "GET reads across festival/zones/stages/lots/areas/tickets/wristbands/refunds/reports"
      - "POST /festivals/{id}/incidents, /incidents/{id}/{escalate,resolve}"
  - name: BoxOffice
    description: "ticketing and wallet desk; sells tickets/add-ons, issues+activates+cashes-out wristbands, processes voluntary refunds"
    identity: opaque
    exclusive_operations:
      - "POST /festivals/{id}/tickets, /tickets/{id}/refund, /tickets/{id}/add-ons"
      - "POST /festivals/{id}/wristbands, /wristbands/{id}/{activate,topup,spend,cashout,void}"
    shared_operations:
      - "GET reads across tickets, wristbands, wallet-txns, refunds, add-ons, reports"
  - name: VendorManager
    description: "adjudicates booth applications (review/approve/reject/return); registers vendors"
    identity: opaque
    exclusive_operations:
      - "POST /vendor-applications/{id}/{start-review,approve,reject,return-for-revision}"
    shared_operations:
      - "POST /vendors, /festivals/{id}/vendor-applications"
      - "GET reads across vendors, applications, zones, stages"
  - name: Vendor
    description: "applicant acting on its own booth application; pays fee, confirms, withdraws"
    identity: "entity_backed:Vendor"
    exclusive_operations:
      - "POST /vendor-applications/{id}/{pay-fee,confirm,withdraw} on own application"
    shared_operations:
      - "POST /vendors, /festivals/{id}/vendor-applications"
      - "GET reads across own applications, zones, vendors"
  - name: GateAttendant
    description: "scans wristbands at gates; logs and triages incidents"
    identity: opaque
    exclusive_operations:
      - "POST /festivals/{id}/gate-scan"
    shared_operations:
      - "POST /festivals/{id}/incidents, /incidents/{id}/{escalate,resolve}"
      - "GET reads across gate-events, wristbands, stages, performances, incidents"
