            - "POST /sharps/programs/${prog}/funding-adjustments {delta_cents: -500, expected_program_version: ${prog_v}, memo: \"trim\"} as SponsorRepresentative ${sp_nw} -> 422 with error_id == \"ERR_FUNDING_BELOW_OBLIGATIONS\" (1500 - 500 = 1000 < reserved 1465 + committed 0)"
            - "after that refusal SponsorshipProgram.${prog}.funding_ceiling_cents == 1500, version == ${prog_v} and the ledger still returns total_count == 1"
            - "POST /sharps/programs/${prog}/funding-adjustments {delta_cents: -35, expected_program_version: ${prog_v}} as SponsorRepresentative ${sp_nw} -> 200: funding_ceiling_cents == 1465 (exactly reserved + committed, the inclusive edge), available_cents == 0, status == \"EXHAUSTED\", version == ${prog_v} + 1, and a FUNDING_ADJUSTMENT ledger entry with amount_cents == -35 lands as sequence_no 2"
            - "POST /sharps/enrollments/${enr_f}/kits {expected_enrollment_version: ${enr_f_v}} as ProgramAdmin -> 422 with error_id == \"ERR_PROGRAM_FUNDING_EXHAUSTED\" again, now with available_cents at exactly 0"
            - "POST /sharps/programs/${prog}/funding-adjustments {delta_cents: 2000, expected_program_version: ${prog_v} + 1} as SponsorRepresentative ${sp_nw} -> 200 with funding_ceiling_cents == 3465, available_cents == 2000 and status back to \"ACTIVE\""
            - "POST /sharps/enrollments/${enr_f}/kits {expected_enrollment_version: ${enr_f_v}} as ProgramAdmin -> 201 with provisional_cost_cents == 1465, leaving reserved_cents == 2930 and available_cents == 535"

      # ---- the remaining catalogue entries are reached by §1.8 instances -----
      - name: error_label_window_conflict_is_reachable
        claim_type: violation_to_error
        grounds:
          - errors[ERR_LABEL_WINDOW_CONFLICT]
        excluded_because:
          difficulty_instance: second_return_label_rejected_when_window_touches_live_label_and_during_void_quarantine
          rationale: "That §1.8 temporal-boundary instance triggers the 409 twice — once on a touching window and once inside the void quarantine — and also asserts the first free instant."

      - name: error_facility_intake_capacity_exceeded_is_reachable
        claim_type: violation_to_error
        grounds:
          - errors[ERR_FACILITY_INTAKE_CAPACITY_EXCEEDED]
        excluded_because:
          difficulty_instance: facility_daily_intake_capacity_exceeded_by_aggregate_units_on_same_intake_date
          rationale: "The §1.8 aggregate-constraint instance books the facility up to its exact ceiling and then over it, asserting both the accepted and the refused activation."

      - name: error_state_mailback_prohibited_is_reachable
        claim_type: violation_to_error
        grounds:
          - errors[ERR_STATE_MAILBACK_PROHIBITED]
        excluded_because:
          difficulty_instance: safety_beats_constraint_on_label_activation_for_prohibited_state
          rationale: "That §1.8 priority-conflict instance returns this 422 while three lower-priority packaging and routing violations are simultaneously present."

      - name: error_invalid_facility_state_is_reachable
        claim_type: violation_to_error
        grounds:
          - errors[ERR_INVALID_FACILITY_STATE]
        excluded_because:
          difficulty_instance: certificate_issuance_blocked_when_treatment_facility_suspended
          rationale: "The §1.8 cross-entity-state instance suspends the facility mid-route and asserts the 409 on destruction certification, then reinstates and succeeds."

      - name: error_invalid_enrollment_state_is_reachable
        claim_type: violation_to_error
        grounds:
          - errors[ERR_INVALID_ENROLLMENT_STATE]
        excluded_because:
          difficulty_instance: state_beats_fiscal_on_kit_issuance_for_paused_enrollment
          rationale: "That §1.8 priority-conflict instance asserts this 409 on kit issuance while the program is simultaneously unable to fund the kit, pinning the state-over-fiscal ordering."

  # ===========================================================================
  # §1.7 RBAC
  # ===========================================================================
  - section: rbac
    instances:
      - name: missing_x_user_headers_and_unknown_roles_return_unauthenticated
        claim_type: role_denial
        grounds:
          - validations.priority 1 (ERR_UNAUTHENTICATED)
          - errors[ERR_UNAUTHENTICATED]
          - roles (the six declared X-User-Role values)
        distinguishing_aspect: "Priority 1 sits above every other rule, so an absent header set yields 401 even when the request would ALSO have failed 404 on a non-existent id, and an unrecognised role string is a 401 (not the role-permission 403), because the header value is not one of the six declared roles at all."
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; a single CA state rule exists so there is a legitimate row to read."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /sharps/state-rules"
              payload: { state_code: "CA", household_sharps_classification: "HOUSEHOLD_EXEMPT", mail_back_permitted: true, max_container_volume_liters: 30.3, certificate_retention_years: 3 }
              as: ProgramAdmin
              captures: { sr_ca: $.data.id }
          trigger:
            - call: "POST /sharps/state-rules"
              payload: { state_code: "NV", household_sharps_classification: "HOUSEHOLD_EXEMPT", mail_back_permitted: true, max_container_volume_liters: 30.3, certificate_retention_years: 3 }
              as: "(request sent with NO X-User-Role and NO X-User-ID header)"
              captures: { err_unauth: $.data.error_id }
          assert:
            - "HTTP status == 401 and ${err_unauth} == \"ERR_UNAUTHENTICATED\""
            - "GET /sharps/state-rules?state_code=NV with no headers -> 401 ERR_UNAUTHENTICATED, and GET /sharps/state-rules?state_code=NV as ProgramAdmin returns total_count == 0 — the header-less write created nothing"
            - "POST /sharps/state-rules with X-User-Role \"FacilityAuditor\" (a role that is not one of the six declared values) and X-User-ID \"aud-1\" -> 401 ERR_UNAUTHENTICATED, NOT 403 — the role list check at priority 2 is only reached for declared roles"
            - "GET /sharps/state-rules/${sr_ca} with X-User-Role \"ProgramAdmin\" but no X-User-ID header -> 401 ERR_UNAUTHENTICATED"
            - "GET /sharps/kits/00000000-0000-4000-8000-00000000ffff with no headers -> 401 ERR_UNAUTHENTICATED, not 404 — priority 1 outranks the existence band at priority 4"
            - "GET /sharps/state-rules/${sr_ca} as ProgramAdmin with X-User-ID \"admin-1\" -> 200 with state_code == \"CA\" (positive control: the same route succeeds once both headers are present)"

      - name: roles_cannot_invoke_other_roles_exclusive_operations
        claim_type: role_denial
        grounds:
          - validations.priority 2 (ERR_ROLE_NOT_PERMITTED)
          - errors[ERR_ROLE_NOT_PERMITTED]
          - roles.ProgramAdmin.exclusive_operations
          - roles.SponsorRepresentative.exclusive_operations
          - roles.LogisticsCoordinator.exclusive_operations
          - roles.IntakeTechnician.exclusive_operations
          - roles.DestructionOfficer.exclusive_operations
        distinguishing_aspect: "Every one of the six roles is refused on another role's exclusive operation, and each probe deliberately targets a NON-EXISTENT path id so the response proves priority 2 (403) runs before the existence band at priority 4 (404) — a permission check that needed to load the row first would answer 404."
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z. No domain rows are needed: every probe uses a syntactically valid but non-existent UUID."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
          trigger:
            - call: "POST /sharps/shipments/00000000-0000-4000-8000-00000000ffff/conformance-screening"
              payload: { outcome: "CONFORMING", observed_gross_weight_grams: 1200 }
              as: DestructionOfficer
              as_user_id: "officer-12"
              captures: { err_role: $.data.error_id }
          assert:
            - "HTTP status == 403 and ${err_role} == \"ERR_ROLE_NOT_PERMITTED\" — screening is IntakeTechnician-exclusive, and the answer is 403 rather than the 404 the non-existent shipment id would otherwise earn"
            - "POST /sharps/return-labels/00000000-0000-4000-8000-00000000ffff/activate {treatment_facility_id: \"00000000-0000-4000-8000-00000000fffe\", scheduled_intake_date: \"2026-08-05\", declared_gross_weight_grams: 1200} as IntakeTechnician tech-77 -> 403 ERR_ROLE_NOT_PERMITTED (activation is LogisticsCoordinator-exclusive)"
            - "POST /sharps/enrollments/00000000-0000-4000-8000-00000000ffff/sponsor-decision {decision: APPROVE} as ProgramAdmin -> 403 ERR_ROLE_NOT_PERMITTED — even the admin cannot cast the sponsor's funding decision"
            - "POST /sharps/auto-ship-runs {} as LogisticsCoordinator -> 403 ERR_ROLE_NOT_PERMITTED, and GET /sharps/auto-ship-runs as ProgramAdmin returns total_count == 0"
            - "POST /_clock/set_current_utc {to_iso8601: \"2027-01-01T00:00:00Z\"} as Patient with X-User-ID \"00000000-0000-4000-8000-00000000fffd\" -> 403 ERR_ROLE_NOT_PERMITTED; the clock is unchanged, which a subsequent POST /sharps/state-rules as ProgramAdmin confirms through created_at == \"2026-08-01T00:00:00Z\""
            - "POST /sharps/shipments/00000000-0000-4000-8000-00000000ffff/destruction-certificates {destroyed_units: 60} as IntakeTechnician tech-77 -> 403 ERR_ROLE_NOT_PERMITTED (certification is DestructionOfficer-exclusive)"
            - "POST /sharps/state-rules {state_code: \"NV\", household_sharps_classification: \"HOUSEHOLD_EXEMPT\", mail_back_permitted: true, max_container_volume_liters: 30.3, certificate_retention_years: 3} as SponsorRepresentative with X-User-ID \"00000000-0000-4000-8000-00000000fffc\" -> 403 ERR_ROLE_NOT_PERMITTED (configuration is ProgramAdmin-exclusive)"
            - "POST /sharps/auto-ship-runs {} as ProgramAdmin -> 201 (positive control on the same route that refused the coordinator) with enrollments_evaluated == 0 and kits_created == 0"

      - name: entity_backed_roles_cannot_act_on_another_owners_kit_or_program
        claim_type: owner_scoping
        grounds:
          - validations.priority 5 (ERR_NOT_RESOURCE_OWNER)
          - errors[ERR_NOT_RESOURCE_OWNER]
          - roles.Patient.identity (entity_backed:Patient)
          - roles.SponsorRepresentative.identity (entity_backed:Sponsor)
        distinguishing_aspect: "Ownership is resolved through two different FK paths — Kit -> Enrollment -> Patient for the Patient role and Enrollment -> SponsorshipProgram -> Sponsor (or the program directly) for the SponsorRepresentative role — and it is checked at priority 5, i.e. BEFORE kit/enrollment state (6-8) and before OCC (13). The same operations carried out by the opaque ProgramAdmin role bypass the check entirely, because the rule is scoped to the two entity-backed roles."
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; CA rule."
            - "Two sponsors with one program each: Northwind (program NW-2026) and Cascadia (program CAS-2026), both funded 500000 / 5000."
            - "Dana is enrolled against NW-2026 and her enrollment is submitted, so it waits in PENDING_SPONSOR_APPROVAL."
            - "Eli is enrolled against CAS-2026, approved by Cascadia, and holds a freshly ISSUED kit."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /sharps/state-rules"
              payload: { state_code: "CA", household_sharps_classification: "HOUSEHOLD_EXEMPT", mail_back_permitted: true, max_container_volume_liters: 30.3, certificate_retention_years: 3 }
              as: ProgramAdmin
              captures: { sr_ca: $.data.id }
            - call: "POST /sharps/sponsors"
              payload: { legal_name: "Northwind Devices Inc", sponsor_type: "MANUFACTURER", contact_email: "programs@northwind.example" }
              as: ProgramAdmin
              captures: { sp_a: $.data.id }
            - call: "POST /sharps/sponsors/${sp_a}/programs"
              payload: { program_code: "NW-2026", funding_ceiling_cents: 500000, per_kit_allowance_cents: 5000 }
              as: ProgramAdmin
              captures: { prog_a: $.data.id }
            - call: "POST /sharps/sponsors"
              payload: { legal_name: "Cascadia Health Plan", sponsor_type: "HEALTH_PLAN", contact_email: "programs@cascadia.example" }
              as: ProgramAdmin
              captures: { sp_b: $.data.id }
            - call: "POST /sharps/sponsors/${sp_b}/programs"
              payload: { program_code: "CAS-2026", funding_ceiling_cents: 500000, per_kit_allowance_cents: 5000 }
              as: ProgramAdmin
              captures: { prog_b: $.data.id }
            - call: "POST /sharps/patients"
              payload: { full_name: "Dana Reyes", state_rule_id: "${sr_ca}", therapy_type: "INSULIN_PEN_NEEDLES", weekly_sharps_count: 20, contact_email: "dana@example.com" }
              as: ProgramAdmin
              captures: { pat_d: $.data.id }
            - call: "POST /sharps/patients/${pat_d}/eligibility-review"
              payload: { decision: "APPROVE" }
              as: ProgramAdmin
            - call: "POST /sharps/enrollments"
              payload: { patient_id: "${pat_d}", sponsorship_program_id: "${prog_a}", cadence_days: 30, kits_authorized: 3 }
              as: ProgramAdmin
              captures: { enr_d: $.data.id }
            - call: "POST /sharps/enrollments/${enr_d}/submit"
              payload: {}
              as: ProgramAdmin
              captures: { enr_d_v: $.data.version }
            - call: "POST /sharps/patients"
              payload: { full_name: "Eli Barnes", state_rule_id: "${sr_ca}", therapy_type: "INSULIN_PEN_NEEDLES", weekly_sharps_count: 20, contact_email: "eli@example.com" }
              as: ProgramAdmin
              captures: { pat_e: $.data.id }
            - call: "POST /sharps/patients/${pat_e}/eligibility-review"
              payload: { decision: "APPROVE" }
              as: ProgramAdmin
            - call: "POST /sharps/enrollments"
              payload: { patient_id: "${pat_e}", sponsorship_program_id: "${prog_b}", cadence_days: 30, kits_authorized: 3 }
              as: ProgramAdmin
              captures: { enr_e: $.data.id }
            - call: "POST /sharps/enrollments/${enr_e}/submit"
              payload: {}
              as: ProgramAdmin
            - call: "POST /sharps/enrollments/${enr_e}/sponsor-decision"
              payload: { decision: "APPROVE" }
              as: SponsorRepresentative
              as_user_id: "${sp_b}"
              captures: { enr_e_v: $.data.version }
            - call: "POST /sharps/enrollments/${enr_e}/kits"
              payload: { expected_enrollment_version: "${enr_e_v}" }
              as: ProgramAdmin
              captures: { kit_e: $.data.id }
            - call: "GET /sharps/programs/${prog_a}"
              payload: {}
              as: ProgramAdmin
              captures: { prog_a_v: $.data.version }
          trigger:
            - call: "POST /sharps/enrollments/${enr_d}/sponsor-decision"
              payload: { decision: "APPROVE" }
              as: SponsorRepresentative
              as_user_id: "${sp_b}"
              captures: { err_owner: $.data.error_id }
          assert:
            - "HTTP status == 403 and ${err_owner} == \"ERR_NOT_RESOURCE_OWNER\" — Cascadia cannot fund an enrollment that hangs off Northwind's program"
            - "Enrollment.${enr_d}.status == \"PENDING_SPONSOR_APPROVAL\" and version == ${enr_d_v} (no partial write)"
            - "POST /sharps/programs/${prog_a}/funding-adjustments {delta_cents: -400000, expected_program_version: ${prog_a_v}} as SponsorRepresentative ${sp_b} -> 403 ERR_NOT_RESOURCE_OWNER, and SponsorshipProgram.${prog_a}.funding_ceiling_cents is still 500000 with version == ${prog_a_v} — ownership at priority 5 answers before the OCC check at 13 would even look at the version"
            - "POST /sharps/kits/${kit_e}/acknowledge-receipt as Patient with X-User-ID ${pat_d} -> 403 ERR_NOT_RESOURCE_OWNER (the kit resolves to Eli through Kit -> Enrollment -> Patient)"
            - "POST /sharps/kits/${kit_e}/seal {fill_units: 60, sealed_gross_weight_grams: 1200} as Patient ${pat_d} -> 403 ERR_NOT_RESOURCE_OWNER, and Kit.${kit_e}.status is still \"ISSUED\" with fill_units == null"
            - "POST /sharps/kits/${kit_e}/acknowledge-receipt as Patient ${pat_e} -> 200 with status \"ACTIVE_FILLING\"; repeating it as Patient ${pat_d} -> 403 ERR_NOT_RESOURCE_OWNER (not the 409 ERR_INVALID_KIT_STATE the wrong-state replay would earn at priority 8)"
            - "POST /sharps/kits/${kit_e}/seal {fill_units: 60, sealed_gross_weight_grams: 1200} as Patient ${pat_e} -> 200 with status \"SEALED\" (positive control for the owning patient)"
            - "POST /sharps/enrollments/${enr_d}/sponsor-decision {decision: APPROVE} as SponsorRepresentative ${sp_a} -> 200 with status \"ACTIVE\" (positive control for the owning sponsor)"
            - "POST /sharps/programs/${prog_a}/funding-adjustments {delta_cents: 1000, expected_program_version: ${prog_a_v}} as ProgramAdmin -> 200 with funding_ceiling_cents == 501000 — the opaque admin role is outside the ownership rule entirely"

  # ===========================================================================
  # CROSS-CUTTING COMPLEXITY LAYERS
  # (optimistic_concurrency, cascading_side_effects, dual_variant_calculation,
  #  ops_run_checkpoint)
  # ===========================================================================
  - section: cross_cutting_complexity_layers
    instances:
      - name: both_occ_rules_reject_stale_parent_versions_and_bump_on_every_write
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules.kit-issue-stale-enrollment
          - concurrency_rules.funding-adjustment-stale-program
          - endpoints.POST /sharps/enrollments/{id}/kits
          - endpoints.POST /sharps/programs/{id}/funding-adjustments
          - validations.priority 13 (state band OCC checks)
        distinguishing_aspect: "Both §1.2.1 rules are exercised on the same fixture, each proving three things: the stale value is refused with 412 and writes nothing, the fresh value succeeds, and an immediate replay of the JUST-SUCCEEDED payload is now itself stale — which is only true if the write bumped the parent's version. A fourth probe fires the same stale payload at a non-existent enrollment id and must get 404, because existence (priority 4) is checked before OCC (priority 13)."
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; CA rule; MANUFACTURER sponsor; program NW-2026 funded 500000 / 5000."
            - "Dana's enrollment is ACTIVE with 5 kits authorized and no kit issued yet; the enrollment version at that point is captured, as is the program version."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /sharps/state-rules"
              payload: { state_code: "CA", household_sharps_classification: "HOUSEHOLD_EXEMPT", mail_back_permitted: true, max_container_volume_liters: 30.3, certificate_retention_years: 3 }
              as: ProgramAdmin
              captures: { sr_ca: $.data.id }
            - call: "POST /sharps/sponsors"
              payload: { legal_name: "Northwind Devices Inc", sponsor_type: "MANUFACTURER", contact_email: "programs@northwind.example" }
              as: ProgramAdmin
              captures: { sp_nw: $.data.id }
            - call: "POST /sharps/sponsors/${sp_nw}/programs"
              payload: { program_code: "NW-2026", funding_ceiling_cents: 500000, per_kit_allowance_cents: 5000 }
              as: ProgramAdmin
              captures: { prog: $.data.id }
            - call: "POST /sharps/patients"
              payload: { full_name: "Dana Reyes", state_rule_id: "${sr_ca}", therapy_type: "INSULIN_PEN_NEEDLES", weekly_sharps_count: 20, contact_email: "dana@example.com" }
              as: ProgramAdmin
              captures: { pat_d: $.data.id }
            - call: "POST /sharps/patients/${pat_d}/eligibility-review"
              payload: { decision: "APPROVE" }
              as: ProgramAdmin
            - call: "POST /sharps/enrollments"
              payload: { patient_id: "${pat_d}", sponsorship_program_id: "${prog}", cadence_days: 30, kits_authorized: 5 }
              as: ProgramAdmin
              captures: { enr: $.data.id }
            - call: "POST /sharps/enrollments/${enr}/submit"
              payload: {}
              as: ProgramAdmin
            - call: "POST /sharps/enrollments/${enr}/sponsor-decision"
              payload: { decision: "APPROVE" }
              as: SponsorRepresentative
              as_user_id: "${sp_nw}"
              captures: { enr_v1: $.data.version }
            - call: "GET /sharps/programs/${prog}"
              payload: {}
              as: ProgramAdmin
              captures: { prog_v: $.data.version }
          trigger:
            - call: "POST /sharps/enrollments/${enr}/kits"
              payload: { expected_enrollment_version: "${enr_v1} - 1" }
              as: ProgramAdmin
              captures: { err_occ: $.data.error_id }
          assert:
            - "HTTP status == 412 and ${err_occ} == \"ERR_STALE_ENROLLMENT_VERSION\""
            - "GET /sharps/kits?enrollment_id=${enr} returns total_count == 0; Enrollment.${enr}.version == ${enr_v1}; GET /sharps/ledger-entries?sponsorship_program_id=${prog} returns total_count == 0; SponsorshipProgram.${prog}.reserved_cents == 0"
            - "POST /sharps/enrollments/${enr}/kits {expected_enrollment_version: ${enr_v1}} as ProgramAdmin -> 201 with provisional_cost_cents == 1465, and Enrollment.${enr}.version == ${enr_v1} + 1"
            - "replaying POST /sharps/enrollments/${enr}/kits {expected_enrollment_version: ${enr_v1}} as ProgramAdmin -> 412 ERR_STALE_ENROLLMENT_VERSION — the value that worked one call ago is now stale, which is only possible if the write bumped the version"
            - "POST /sharps/enrollments/${enr}/kits {expected_enrollment_version: ${enr_v1} + 1} as ProgramAdmin -> 201: the first kit is supersede-voided, so GET /sharps/ledger-entries?sponsorship_program_id=${prog} returns 3 entries in sequence_no ASC (RESERVATION +1465, RESERVATION_RELEASE -1465, RESERVATION +1465) and reserved_cents is back to 1465"
            - "POST /sharps/enrollments/00000000-0000-4000-8000-00000000ffff/kits {expected_enrollment_version: ${enr_v1} - 1} as ProgramAdmin -> 404 ERR_ENROLLMENT_NOT_FOUND, not 412 — existence at priority 4 outranks the OCC check at priority 13"
            - "POST /sharps/programs/${prog}/funding-adjustments {delta_cents: 1000, expected_program_version: ${prog_v} - 1} as ProgramAdmin -> 412 ERR_STALE_PROGRAM_VERSION with funding_ceiling_cents still 500000 and no FUNDING_ADJUSTMENT entry appended"
            - "POST /sharps/programs/${prog}/funding-adjustments {delta_cents: 1000, expected_program_version: ${prog_v}} as ProgramAdmin -> 200 with funding_ceiling_cents == 501000 and version == ${prog_v} + 1"
            - "replaying that identical adjustment with expected_program_version: ${prog_v} -> 412 ERR_STALE_PROGRAM_VERSION, and funding_ceiling_cents stays 501000 (the additive adjustment is applied exactly once)"

      - name: ops_run_refreshes_both_risk_variants_and_skips_on_audit_without_ever_suspending
        claim_type: ops_run_checkpoint
        grounds:
          - calculations.patient_risk_score.variants.AUDIT
          - calculations.patient_risk_score.variants.SCREENING
          - calculations.autoship_due_evaluation.constants.SKIP_REASON_ORDER
          - entities.AutoShipRun.fields.kits_skipped_risk
          - entities.Patient.fields.audit_risk_score
        distinguishing_aspect: "STEP A of the run rewrites BOTH stored scores and MUST NOT write Patient.status: at run time the decayed SCREENING value has fallen to 23 while the undecayed AUDIT value, inflated by two late kits, stands at 65 — past the suspend threshold of 60. The run must therefore skip both enrollments at rung 2 (risk, ahead of unfilled) while leaving the patient ENROLLED, the enrollments ACTIVE and their due dates untouched. An implementation that reuses the screening cascade here would suspend the patient and pause both enrollments."
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z: CA rule (72-hour notification window), spec MB-USPS, facility \"CA-TF-0001\" capacity 200, MANUFACTURER sponsor with TWO programs (NW-A and NW-B, each 500000 / 5000)."
            - "Dana is enrolled twice — enrollment A against NW-A (created 2026-08-01) and enrollment B against NW-B (created 2026-08-02) — which is legal because the duplicate rule keys on (patient, program)."
            - "Kit A1 runs the full route on 2026-08-01 and is screened NON_CONFORMING for LOOSE_SHARPS_IN_BOX (weight 45), opening one event at 2026-08-01T00:00:00Z; 45 < 60 so no suspension happens then."
            - "Clock 2026-08-02: kit A2 is issued on enrollment A (kit A1 is already RECEIVED so nothing is superseded) and kit B1 is issued on enrollment B. Both are left in ISSUED with seal_deadline_date 2026-09-15 (2026-08-02 + 30 cadence + 14 grace)."
            - "Clock 2026-11-30: the event is 121 days old (decay 0.5) and both ISSUED kits are past their seal deadline, so SCREENING = round_half_up(45 * 0.5 = 22.5) = 23 while AUDIT = 45 + 10 * 2 = 65."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /sharps/state-rules"
              payload: { state_code: "CA", household_sharps_classification: "HOUSEHOLD_EXEMPT", mail_back_permitted: true, max_container_volume_liters: 30.3, certificate_retention_years: 3, notification_deadline_hours: 72 }
