            - { call: "POST /legal-petitions/${pet_id}/advance", payload: { event: "FILE" }, as: StaffAttorney, as_user_id: "atty_1" }
            - { call: "POST /legal-petitions/${pet_id}/advance", payload: { event: "RECORD_DECISION", decision: "GRANTED", vacates_conviction: true }, as: StaffAttorney, as_user_id: "atty_1" }
            - call: "POST /compensation-claims"
              payload: { case_id: "${case_id}", years_incarcerated_claimed: 11 }
              as: StaffAttorney
              as_user_id: "atty_1"
              captures: { claim_id: $.data.id }
            - { call: "POST /compensation-claims/${claim_id}/advance", payload: { event: "FILE" }, as: StaffAttorney, as_user_id: "atty_1" }
            - call: "GET /jurisdictions/${jur_id}/policy-initiatives"
              as: PolicyDirector
              captures: { cnt_filed: "$.data[0].pattern_case_count" }
          trigger:
            - { call: "POST /compensation-claims/${claim_id}/advance", payload: { event: "RECORD_DECISION", decision: "DENIED" }, as: StaffAttorney, as_user_id: "atty_1" }
            - call: "GET /jurisdictions/${jur_id}/policy-initiatives"
              as: PolicyDirector
              captures: { cnt_denied: "$.data[0].pattern_case_count" }
          assert:
            - "while the claim is FILED: pattern_case_count == 0 (FILED is not in the DENIED/APPEALED input set)"
            - "after RECORD_DECISION DENIED: pattern_case_count == 1"

      - name: records_denial_feeds_records_transparency_pattern
        claim_type: Input Set Filtering
        grounds:
          - "calculations.policy_pattern_count"
          - "state_machines.RecordsRequest.SUBMITTED_to_DENIED"
        distinguishing_aspect: "The RECORDS_TRANSPARENCY input set counts cases with at least one DENIED records request: a DENIED disposition on an APPEALED request counts the case once (distinct-case semantics), even after repeated denials."
        test_recipe:
          setup: ["Case OPEN in jurisdiction with a RECORDS_TRANSPARENCY initiative; one records request SUBMITTED."]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: PlatformAdmin }
            - call: "POST /jurisdictions"
              payload: { state_code: "MS", name: "Mississippi", has_post_conviction_dna_statute: false, clemency_available: false, compensation_statute_exists: false }
              as: PlatformAdmin
              captures: { jur_id: $.data.id }
            - call: "POST /policy-initiatives"
              payload: { jurisdiction_id: "${jur_id}", topic: "RECORDS_TRANSPARENCY", title: "Public-records compliance" }
              as: PolicyDirector
              captures: { pol_id: $.data.id }
            - call: "POST /clients"
              payload: { full_name: "Hal Kim", inmate_number: "MS-9" }
              as: IntakeSpecialist
              captures: { cl: $.data.id }
            - call: "POST /intake-requests"
              payload: { client_id: "${cl}", jurisdiction_id: "${jur_id}", conviction_date: "2020-01-01T00:00:00Z", conviction_summary: "Transparency probe", claim_of_actual_innocence: true, claim_strength: "MODERATE", evidence_potential: "UNCERTAIN", years_served: 6, health_urgency: "NONE" }
              as: IntakeSpecialist
              captures: { r_id: $.data.id }
            - { call: "POST /intake-requests/${r_id}/advance", payload: { event: "BEGIN_SCREENING" }, as: IntakeSpecialist }
            - { call: "POST /intake-requests/${r_id}/advance", payload: { event: "RECOMMEND", recommendation: "ACCEPT" }, as: IntakeSpecialist, as_user_id: "spec_1" }
            - call: "POST /intake-requests/${r_id}/decide"
              payload: { decision: "ACCEPTED", assigned_attorney_id: "atty_1" }
              as: ManagingAttorney
              as_user_id: "ma_1"
              captures: { case_id: $.data.accepted_case_id }
            - call: "POST /records-requests"
              payload: { case_id: "${case_id}", agency_type: "POLICE", agency_name: "Jackson PD", request_summary: "Offense report and property log" }
              as: EvidenceAnalyst
              captures: { rr_id: $.data.id }
            - { call: "POST /records-requests/${rr_id}/advance", payload: { event: "SUBMIT" }, as: EvidenceAnalyst }
          trigger:
            - { call: "POST /records-requests/${rr_id}/advance", payload: { event: "RECORD_RESPONSE", disposition: "DENIED" }, as: EvidenceAnalyst }
            - { call: "POST /records-requests/${rr_id}/advance", payload: { event: "APPEAL" }, as: EvidenceAnalyst }
            - { call: "POST /records-requests/${rr_id}/advance", payload: { event: "RECORD_RESPONSE", disposition: "DENIED" }, as: EvidenceAnalyst }
            - call: "GET /jurisdictions/${jur_id}/policy-initiatives"
              as: PolicyDirector
              captures: { cnt: "$.data[0].pattern_case_count" }
          assert:
            - "the appeal cycle works: SUBMITTED -> DENIED -> APPEALED -> DENIED (second denial legal after appeal)"
            - "pattern_case_count == 1 after two denials of the SAME case (distinct cases counted, not denials)"

  # ===========================================================================
  - section: validations
    instances:
      - name: any_endpoint_missing_auth_headers_rejected
        claim_type: Violation -> Error
        grounds:
          - "validations[priority=1]"
          - "errors[ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER]"
        distinguishing_aspect: "Priority 1: a request with no X-User-ID / X-User-Role headers is rejected 400 ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER before any role, existence, or state logic runs — even on a read-only GET."
        test_recipe:
          setup: ["One jurisdiction exists (so the target resource exists and only the auth check can fire)."]
          setup_api_calls:
            - call: "POST /jurisdictions"
              payload: { state_code: "SD", name: "South Dakota", has_post_conviction_dna_statute: true, clemency_available: true, compensation_statute_exists: true }
              as: PlatformAdmin
              captures: { jur_id: $.data.id }
          trigger:
            - call: "GET /jurisdictions/${jur_id}"
              as: "NONE"   # the test sends NO X-User-ID / X-User-Role headers at all
              captures: { err: $.data.error_id }
          assert:
            - "http 400; error_id == ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER"

      - name: request_with_invalid_role_header_rejected
        claim_type: Violation -> Error
        grounds:
          - "validations[priority=1]"
        distinguishing_aspect: "A syntactically present but undeclared role name ('SuperUser') is the same priority-1 rejection, not a 403."
        test_recipe:
          setup: ["One jurisdiction exists."]
          setup_api_calls:
            - call: "POST /jurisdictions"
              payload: { state_code: "WY", name: "Wyoming", has_post_conviction_dna_statute: true, clemency_available: true, compensation_statute_exists: true }
              as: PlatformAdmin
              captures: { jur_id: $.data.id }
          trigger:
            - call: "GET /jurisdictions/${jur_id}"
              as: "SuperUser"   # not a declared role name
              captures: { err: $.data.error_id }
          assert:
            - "http 400; error_id == ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER (undeclared role name fails header validity, not authorization)"

      - name: evidence_analyst_cannot_create_petition
        claim_type: Violation -> Error
        grounds:
          - "validations[priority=2]"
          - "roles.EvidenceAnalyst"
        distinguishing_aspect: "Role authorization is per-endpoint: EvidenceAnalyst (an evidence-shop role) is outside POST /legal-petitions' roles and gets ERR_UNAUTHORIZED_ROLE 403 even though the referenced case exists."
        test_recipe:
          setup: ["A case exists (created via the standard intake chain) — its id is captured for the payload."]
          setup_api_calls:
            - call: "POST /jurisdictions"
              payload: { state_code: "OK", name: "Oklahoma", has_post_conviction_dna_statute: true, clemency_available: true, compensation_statute_exists: true }
              as: PlatformAdmin
              captures: { jur_id: $.data.id }
            - call: "POST /clients"
              payload: { full_name: "Rae Ines", inmate_number: "OK-2" }
              as: IntakeSpecialist
              captures: { cl: $.data.id }
            - call: "POST /intake-requests"
              payload: { client_id: "${cl}", jurisdiction_id: "${jur_id}", conviction_date: "2019-01-01T00:00:00Z", conviction_summary: "RBAC probe", claim_of_actual_innocence: true, claim_strength: "STRONG", evidence_potential: "LIKELY_STORED", years_served: 7, health_urgency: "NONE" }
              as: IntakeSpecialist
              captures: { r_id: $.data.id }
            - { call: "POST /intake-requests/${r_id}/advance", payload: { event: "BEGIN_SCREENING" }, as: IntakeSpecialist }
            - { call: "POST /intake-requests/${r_id}/advance", payload: { event: "RECOMMEND", recommendation: "ACCEPT" }, as: IntakeSpecialist, as_user_id: "spec_1" }
            - call: "POST /intake-requests/${r_id}/decide"
              payload: { decision: "ACCEPTED", assigned_attorney_id: "atty_1" }
              as: ManagingAttorney
              as_user_id: "ma_1"
              captures: { case_id: $.data.accepted_case_id }
          trigger:
            - call: "POST /legal-petitions"
              payload: { case_id: "${case_id}", petition_type: "DIRECT_APPEAL", court_name: "OK Court of Criminal Appeals", claim_basis: "PROCEDURAL" }
              as: EvidenceAnalyst
              captures: { err: $.data.error_id }
          assert:
            - "http 403; error_id == ERR_UNAUTHORIZED_ROLE (role check precedes the LITIGATION gate — the case is only OPEN)"

      - name: client_reading_another_clients_case_rejected
        claim_type: Violation -> Error
        grounds:
          - "validations[priority=3.4]"
          - "roles.Client"
        distinguishing_aspect: "Ownership for the entity-backed Client role resolves through the FK chain: a Client whose X-User-ID differs from the case's intake client gets ERR_OWNERSHIP_MISMATCH 403, while staff roles read the same case freely."
        test_recipe:
          setup: ["Two clients A and B; client A has an accepted case."]
          setup_api_calls:
            - call: "POST /jurisdictions"
              payload: { state_code: "HI", name: "Hawaii", has_post_conviction_dna_statute: true, clemency_available: true, compensation_statute_exists: true }
              as: PlatformAdmin
              captures: { jur_id: $.data.id }
            - call: "POST /clients"
              payload: { full_name: "Client Alpha", inmate_number: "HI-A" }
              as: IntakeSpecialist
              captures: { cl_a: $.data.id }
            - call: "POST /clients"
              payload: { full_name: "Client Beta", inmate_number: "HI-B" }
              as: IntakeSpecialist
              captures: { cl_b: $.data.id }
            - call: "POST /intake-requests"
              payload: { client_id: "${cl_a}", jurisdiction_id: "${jur_id}", conviction_date: "2018-01-01T00:00:00Z", conviction_summary: "Ownership probe", claim_of_actual_innocence: true, claim_strength: "STRONG", evidence_potential: "LIKELY_STORED", years_served: 8, health_urgency: "NONE" }
              as: IntakeSpecialist
              captures: { r_id: $.data.id }
            - { call: "POST /intake-requests/${r_id}/advance", payload: { event: "BEGIN_SCREENING" }, as: IntakeSpecialist }
            - { call: "POST /intake-requests/${r_id}/advance", payload: { event: "RECOMMEND", recommendation: "ACCEPT" }, as: IntakeSpecialist, as_user_id: "spec_1" }
            - call: "POST /intake-requests/${r_id}/decide"
              payload: { decision: "ACCEPTED", assigned_attorney_id: "atty_1" }
              as: ManagingAttorney
              as_user_id: "ma_1"
              captures: { case_id: $.data.accepted_case_id }
          trigger:
            - call: "GET /cases/${case_id}"
              as: Client
              as_user_id: "${cl_b}"
              captures: { err: $.data.error_id }
            - call: "GET /cases/${case_id}"
              as: Client
              as_user_id: "${cl_a}"
              captures: { ok_status: $.data.status }
          assert:
            - "Client B (non-owner): http 403 ERR_OWNERSHIP_MISMATCH"
            - "Client A (owner via Case.intake_request_id -> IntakeRequest.client_id): http 200, status == OPEN"

      - name: create_with_unknown_case_reference_returns_not_found
        claim_type: Violation -> Error
        grounds:
          - "validations[priority=3]"
          - "errors[ERR_CASE_NOT_FOUND]"
        distinguishing_aspect: "Body references are validated for existence just like path ids: POST /evidence-items with a nonexistent case_id yields 404 ERR_CASE_NOT_FOUND, not a dangling FK row."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls: []
          trigger:
            - call: "POST /evidence-items"
              payload: { case_id: "99999999-8888-4777-8666-555555555555", description: "Orphan", evidence_type: "OTHER", custodian_type: "COURT_CLERK", initial_sample_ng: 5 }
              as: EvidenceAnalyst
              captures: { err: $.data.error_id }
          assert:
            - "http 404; error_id == ERR_CASE_NOT_FOUND"

      - name: intake_create_with_invalid_enum_rejected
        claim_type: Type Constraints
        grounds:
          - "validations[priority=3.8]"
          - "entities.IntakeRequest.fields.claim_strength"
        distinguishing_aspect: "Enum vocabularies are closed: claim_strength 'OVERWHELMING' is outside {WEAK, MODERATE, STRONG, COMPELLING} and fails 400 ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["Jurisdiction and client exist."]
          setup_api_calls:
            - call: "POST /jurisdictions"
              payload: { state_code: "AL", name: "Alabama", has_post_conviction_dna_statute: true, clemency_available: true, compensation_statute_exists: true }
              as: PlatformAdmin
              captures: { jur_id: $.data.id }
            - call: "POST /clients"
              payload: { full_name: "Eli Vann", inmate_number: "AL-3" }
              as: IntakeSpecialist
              captures: { cl: $.data.id }
          trigger:
            - call: "POST /intake-requests"
              payload: { client_id: "${cl}", jurisdiction_id: "${jur_id}", conviction_date: "2020-01-01T00:00:00Z", conviction_summary: "Enum probe", claim_of_actual_innocence: true, claim_strength: "OVERWHELMING", evidence_potential: "UNCERTAIN", years_served: 6, health_urgency: "NONE" }
              as: IntakeSpecialist
              captures: { err: $.data.error_id }
          assert:
            - "http 400; error_id == ERR_INVALID_REQUEST"

      - name: intake_create_missing_required_field_rejected
        claim_type: Required Fields
        grounds:
          - "validations[priority=3.8]"
          - "entities.IntakeRequest"
        distinguishing_aspect: "Every input field without a declared default is required: omitting claim_strength fails 400 ERR_INVALID_REQUEST even when all other fields are valid."
        test_recipe:
          setup: ["Jurisdiction and client exist."]
          setup_api_calls:
            - call: "POST /jurisdictions"
              payload: { state_code: "AK", name: "Alaska", has_post_conviction_dna_statute: true, clemency_available: true, compensation_statute_exists: true }
              as: PlatformAdmin
              captures: { jur_id: $.data.id }
            - call: "POST /clients"
              payload: { full_name: "Mel Tarr", inmate_number: "AK-4" }
              as: IntakeSpecialist
              captures: { cl: $.data.id }
          trigger:
            - call: "POST /intake-requests"
              payload: { client_id: "${cl}", jurisdiction_id: "${jur_id}", conviction_date: "2020-01-01T00:00:00Z", conviction_summary: "Missing-field probe", claim_of_actual_innocence: true, evidence_potential: "UNCERTAIN", years_served: 6, health_urgency: "NONE" }
              as: IntakeSpecialist
              captures: { err: $.data.error_id }
          assert:
            - "http 400; error_id == ERR_INVALID_REQUEST (claim_strength absent)"

      - name: jurisdiction_create_with_malformed_state_code_rejected
        claim_type: Type Constraints
        grounds:
          - "entities.Jurisdiction.fields.state_code"
          - "validations[priority=3.8]"
        distinguishing_aspect: "state_code obeys its format constraint (two uppercase letters): 'Texas' fails 400 ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls: []
          trigger:
            - call: "POST /jurisdictions"
              payload: { state_code: "Texas", name: "Texas", has_post_conviction_dna_statute: true, clemency_available: true, compensation_statute_exists: true }
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "http 400; error_id == ERR_INVALID_REQUEST"

      - name: jurisdiction_duplicate_state_code_rejected
        claim_type: Violation -> Error
        grounds:
          - "errors[ERR_DUPLICATE_STATE_CODE]"
          - "entities.Jurisdiction.fields.state_code"
        distinguishing_aspect: "state_code uniqueness is global: a second jurisdiction with state_code TX fails 409 ERR_DUPLICATE_STATE_CODE."
        test_recipe:
          setup: ["One jurisdiction with state_code TX exists."]
          setup_api_calls:
            - call: "POST /jurisdictions"
              payload: { state_code: "TX", name: "Texas", has_post_conviction_dna_statute: true, clemency_available: true, compensation_statute_exists: true }
              as: PlatformAdmin
              captures: { jur_id: $.data.id }
          trigger:
            - call: "POST /jurisdictions"
              payload: { state_code: "TX", name: "Texas (duplicate)", has_post_conviction_dna_statute: false, clemency_available: false, compensation_statute_exists: false }
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "http 409; error_id == ERR_DUPLICATE_STATE_CODE"

      - name: case_advance_with_unknown_event_rejected
        claim_type: Violation -> Error
        grounds:
          - "validations[priority=3.9]"
          - "errors[ERR_INVALID_TRANSITION_EVENT]"
        distinguishing_aspect: "The event vocabulary is closed per endpoint: event 'FLY' on the case advance endpoint fails 400 ERR_INVALID_TRANSITION_EVENT before any state logic (the case is in a perfectly valid OPEN state)."
        test_recipe:
          setup: ["An accepted case in OPEN."]
          setup_api_calls:
            - call: "POST /jurisdictions"
              payload: { state_code: "MN", name: "Minnesota", has_post_conviction_dna_statute: true, clemency_available: true, compensation_statute_exists: true }
              as: PlatformAdmin
              captures: { jur_id: $.data.id }
            - call: "POST /clients"
              payload: { full_name: "Ida Cole", inmate_number: "MN-5" }
              as: IntakeSpecialist
              captures: { cl: $.data.id }
            - call: "POST /intake-requests"
              payload: { client_id: "${cl}", jurisdiction_id: "${jur_id}", conviction_date: "2019-01-01T00:00:00Z", conviction_summary: "Event probe", claim_of_actual_innocence: true, claim_strength: "STRONG", evidence_potential: "LIKELY_STORED", years_served: 7, health_urgency: "NONE" }
              as: IntakeSpecialist
              captures: { r_id: $.data.id }
            - { call: "POST /intake-requests/${r_id}/advance", payload: { event: "BEGIN_SCREENING" }, as: IntakeSpecialist }
            - { call: "POST /intake-requests/${r_id}/advance", payload: { event: "RECOMMEND", recommendation: "ACCEPT" }, as: IntakeSpecialist, as_user_id: "spec_1" }
            - call: "POST /intake-requests/${r_id}/decide"
              payload: { decision: "ACCEPTED", assigned_attorney_id: "atty_1" }
              as: ManagingAttorney
              as_user_id: "ma_1"
              captures: { case_id: $.data.accepted_case_id }
          trigger:
            - call: "POST /cases/${case_id}/advance"
              payload: { event: "FLY" }
              as: StaffAttorney
              as_user_id: "atty_1"
              captures: { err: $.data.error_id }
          assert:
            - "http 400; error_id == ERR_INVALID_TRANSITION_EVENT (not a 409 state error — the event itself is unknown)"

      - name: client_create_with_extra_field_rejected
        claim_type: Violation -> Error
        grounds:
          - "validations[priority=3.8]"
        distinguishing_aspect: "Unknown payload fields are rejected, not silently ignored: POST /clients carrying 'nickname' fails 400 ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls: []
          trigger:
            - call: "POST /clients"
              payload: { full_name: "Rey Sol", inmate_number: "ZZ-1", nickname: "Speedy" }
              as: IntakeSpecialist
              captures: { err: $.data.error_id }
          assert:
            - "http 400; error_id == ERR_INVALID_REQUEST (unknown field 'nickname')"

      - name: recommend_accept_requires_screening_criteria
        claim_type: Violation -> Error
        grounds:
          - "errors[ERR_SCREENING_CRITERIA_NOT_MET]"
          - "state_machines.IntakeRequest.SCREENING_to_DECISION_PENDING"
        distinguishing_aspect: "The case-criteria gate fires only on recommendation=ACCEPT: a request with claim_of_actual_innocence=false gets ERR_SCREENING_CRITERIA_NOT_MET for ACCEPT but a clean 200 for REJECT on the same resource."
        test_recipe:
          setup: ["One intake request in SCREENING with claim_of_actual_innocence=false."]
          setup_api_calls:
            - call: "POST /jurisdictions"
              payload: { state_code: "LA", name: "Louisiana", has_post_conviction_dna_statute: true, clemency_available: true, compensation_statute_exists: true }
              as: PlatformAdmin
              captures: { jur_id: $.data.id }
            - call: "POST /clients"
              payload: { full_name: "Tom Rhee", inmate_number: "LA-6" }
              as: IntakeSpecialist
              captures: { cl: $.data.id }
            - call: "POST /intake-requests"
              payload: { client_id: "${cl}", jurisdiction_id: "${jur_id}", conviction_date: "2021-01-01T00:00:00Z", conviction_summary: "Criteria probe", claim_of_actual_innocence: false, claim_strength: "WEAK", evidence_potential: "NONE_KNOWN", years_served: 5, health_urgency: "NONE" }
              as: IntakeSpecialist
              captures: { r_id: $.data.id }
            - { call: "POST /intake-requests/${r_id}/advance", payload: { event: "BEGIN_SCREENING" }, as: IntakeSpecialist }
          trigger:
            - call: "POST /intake-requests/${r_id}/advance"
              payload: { event: "RECOMMEND", recommendation: "ACCEPT" }
              as: IntakeSpecialist
              as_user_id: "spec_1"
              captures: { err: $.data.error_id }
            - call: "POST /intake-requests/${r_id}/advance"
              payload: { event: "RECOMMEND", recommendation: "REJECT" }
              as: IntakeSpecialist
              as_user_id: "spec_1"
              captures: { st: $.data.status }
          assert:
            - "RECOMMEND ACCEPT: 422 ERR_SCREENING_CRITERIA_NOT_MET; the request stays SCREENING"
            - "RECOMMEND REJECT on the same request: 200, status DECISION_PENDING (the gate is ACCEPT-specific)"

      - name: decide_self_approval_blocked
        claim_type: Violation -> Error
        grounds:
          - "validations[priority=5]"
          - "errors[ERR_DECISION_SELF_APPROVAL]"
          - "complexity_profile.role_model"
        distinguishing_aspect: "Segregation of duties: the ManagingAttorney whose X-User-ID equals the recommending screener's user id is refused with 403 ERR_DECISION_SELF_APPROVAL; a different attorney decides the same request successfully."
        test_recipe:
          setup: ["One intake request in DECISION_PENDING, recommended by user 'hybrid_1'."]
          setup_api_calls:
            - call: "POST /jurisdictions"
              payload: { state_code: "NC", name: "North Carolina", has_post_conviction_dna_statute: true, clemency_available: true, compensation_statute_exists: true }
              as: PlatformAdmin
              captures: { jur_id: $.data.id }
            - call: "POST /clients"
              payload: { full_name: "Ada Sun", inmate_number: "NC-7" }
              as: IntakeSpecialist
              captures: { cl: $.data.id }
            - call: "POST /intake-requests"
              payload: { client_id: "${cl}", jurisdiction_id: "${jur_id}", conviction_date: "2018-01-01T00:00:00Z", conviction_summary: "SoD probe", claim_of_actual_innocence: true, claim_strength: "STRONG", evidence_potential: "LIKELY_STORED", years_served: 8, health_urgency: "NONE" }
              as: IntakeSpecialist
              captures: { r_id: $.data.id }
            - { call: "POST /intake-requests/${r_id}/advance", payload: { event: "BEGIN_SCREENING" }, as: IntakeSpecialist }
            - { call: "POST /intake-requests/${r_id}/advance", payload: { event: "RECOMMEND", recommendation: "ACCEPT" }, as: IntakeSpecialist, as_user_id: "hybrid_1" }
          trigger:
            - call: "POST /intake-requests/${r_id}/decide"
              payload: { decision: "ACCEPTED" }
              as: ManagingAttorney
              as_user_id: "hybrid_1"
