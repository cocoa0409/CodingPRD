          The counterfeit register keeps its own error: a second heat re-using an existing
          mill_cert_serial answers ERR_DUPLICATE_MILL_CERT_SERIAL even though its heat_number is new,
          while duplicate part_number, tool_code and furnace_code all collapse into
          ERR_DUPLICATE_IDENTIFIER — and a heat with a fresh serial is still accepted.
