              payload: { production_id: "${prod_id}", asset_id: "${a2}", archive_id: "${arch_a}", rights_leg: "FOOTAGE", media: "BROADCAST", territory: "WORLD", window_class: "ALL_MEDIA_WINDOW", term_months: 12, term_start_date: "2026-08-15", term_end_date: "2027-08-15" }
              as: ClearanceSupervisor
              captures: { l2: $.data.id }
          assert:
            - "both POST /archives calls return 201 — the operation is shared by ArchiveResearcher and ProductionAdmin"
            - "the rate card posted by RightsHolderRep whose X-User-ID equals ${arch_a} returns 201 with status ACTIVE"
            - "both select-source calls return 200 and set selection_status SELECTED on ${c1} and ${c2} respectively"
            - "both POST /licenses calls return 201 with rate_card_fee_cents == 258750 and status DRAFT, regardless of which role created them"
            - "both assets report licensing_status IN_NEGOTIATION and Production.${prod_id}.committed_fee_cents == 0"

      - name: segregation_of_duties_blocks_the_counsel_who_issued_the_letter
        claim_type: segregation_of_duties
        grounds:
          - validations[priority=23]
          - errors.ERR_SEGREGATION_OF_DUTIES
          - entities.OpinionLetter.fields.issued_by_user_id
          - roles.LegalCounsel
        distinguishing_aspect: "The role check passes and the state machine is satisfied, yet the operation is still refused on IDENTITY: the LegalCounsel X-User-ID stamped on OpinionLetter.issued_by_user_id may not be the X-User-ID that records the ACCEPTED decision, and a second counsel unblocks the identical request."
        test_recipe:
          setup: ["A production in CLEARANCE with one 45-second CRITICAL_COMMENTARY asset, a SUBMITTED analysis scored (90, 60, 40, 50) = 0.6750, and an ISSUED opinion letter authored by 'counsel-a'."]
          setup_api_calls:
            - call: "POST /productions"
              payload: { title: "Same Hands", delivery_deadline_date: "2027-06-30" }
              as: ProductionAdmin
              captures: { prod_id: $.data.id }
            - call: "POST /productions/${prod_id}/state"
              payload: { to_status: "CLEARANCE" }
              as: ProductionAdmin
            - call: "POST /productions/${prod_id}/assets"
              payload: { asset_type: "ARCHIVAL_FOOTAGE", title: "Archive montage", timecode_in_seconds: 0, timecode_out_seconds: 45, usage_purpose: "CRITICAL_COMMENTARY" }
              as: ArchiveResearcher
              captures: { asset_id: $.data.id }
            - call: "POST /assets/${asset_id}/fair-use-analyses"
              payload: { transformative_score: 90, nature_score: 60, amount_used_score: 40, market_harm_score: 50 }
              as: LegalCounsel
              as_user_id: "counsel-a"
              captures: { fua_id: $.data.id }
            - call: "POST /fair-use-analyses/${fua_id}/state"
              payload: { to_status: "SUBMITTED" }
              as: LegalCounsel
              as_user_id: "counsel-a"
            - call: "POST /fair-use-analyses/${fua_id}/opinion-letters"
              payload: { counsel_firm: "Marsh & Keel LLP", letter_reference: "OL-5510", risk_rating: "LOW" }
              as: LegalCounsel
              as_user_id: "counsel-a"
              captures: { ol_id: $.data.id }
            - call: "POST /opinion-letters/${ol_id}/state"
              payload: { to_status: "ISSUED" }
              as: LegalCounsel
              as_user_id: "counsel-a"
          trigger:
            - call: "POST /fair-use-analyses/${fua_id}/state"
