              payload: {}
              as: QualityEngineer
              as_user_id: "qe-1"
            - call: "POST /glass-plant/bottle-designs/${d}/approve"
              payload: {}
              as: QualityEngineer
              as_user_id: "qe-2"
            - call: "GET /glass-plant/bottle-designs/${d}"
              payload: {}
              as: QualityEngineer
              captures: { dv1: "$.data.version" }
            - call: "POST /glass-plant/lightweighting-programs"
