      - name: per_line_rounding_beats_rounding_the_sum
        claim_type: precision
        grounds:
          - calculations.dispute_credit_allocation
        excluded_because:
          difficulty_instance: combinatorial_formula / dispute_credit_per_line_round_half_up_beats_sum_then_round
          rationale: |
            That §1.8 instance is exactly this claim: it pins the per-line
            ROUND_HALF_UP results 30908 and 8158, their sum 39066, and the 39065
            that rounding the summed product would have produced. A corner
            duplicate would assert the same three numbers.

      - name: adjudication_due_date_from_the_weighted_evidence_score
        claim_type: weighted_scoring
        grounds:
          - calculations.adjudication_timeline
        excluded_because:
          difficulty_instance: combinatorial_formula / adjudication_due_date_from_grounds_multiplier_and_evidence_weight
          rationale: |
            The §1.8 instance already drives the CEIL of the grounds multiplier,
            the integer-halved evidence weight, the 5-day discount saturation and
            the 5-business-day floor in one replay, with the resulting
            adjudication_due_at literal.

      - name: provisional_and_final_variants_diverge_on_one_timeline
        claim_type: variant_divergence
        grounds:
          - calculations.demurrage_chargeable_days
        excluded_because:
          difficulty_instance: dual_variant_calc / chargeable_days_provisional_vs_final_on_industry_track_charge
          rationale: |
            The §1.8 instance holds the timeline fixed and reads the same charge
            before and after release, so both variants are observed against one
            input set with both literals pinned. That is the divergence claim.

      - name: storage_clock_mode_selects_the_variant
        claim_type: variant_selection
        grounds:
          - calculations.storage_dwell_charge
        excluded_because:
          difficulty_instance: dual_variant_calc / storage_clock_calendar_vs_hourly_on_same_dwell_interval
          rationale: |
            The §1.8 instance runs the identical dwell interval through two
            facilities that differ only in storage_clock_mode and pins 5 days /
            45000 against 7 days / 63000, which is the selection claim plus the
            divergence it produces.

