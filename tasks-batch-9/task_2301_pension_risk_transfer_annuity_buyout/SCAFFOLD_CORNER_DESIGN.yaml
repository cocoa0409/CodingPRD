            - "${transfer_total} == 2 with ${first_state_now} == SUPERSEDED and ${second_state_now} == INITIATED — created_at ASC keeps the superseded row visible"

      - name: settlement_cascade_is_verified_end_to_end
        claim_type: cascading_side_effects
        grounds:
          - complexity_layers.cascading_side_effects
        excluded_because:
          difficulty_instance: window_settlement_cascades_elections_participants_plan_then_residual
          rationale: |
            That §1.8 instance already walks the full four-level chain (window ->
            elections -> participant records -> plan liability and settlement charge ->
            compound RESIDUAL bubble-up) and pins the ordering, including the fact that
            the plan's funded status is recomputed after, not before, the participant
            liabilities are removed. A separate corner test would be a strict subset.

      - name: both_costing_bases_produce_their_own_result
        claim_type: dual_variant_calculation
        grounds:
          - complexity_layers.dual_variant_calculation
        excluded_because:
          difficulty_instance: strategy_dual_basis_projected_cost_diverges
          rationale: |
            The accounting-basis and settlement-basis variants, and the delta between
            them on the same strategy inputs, are already asserted there with literal
            expected values for both branches, so the layer's "both variants produce
            expected results; delta on switch is correct" claim is discharged.

  - section: consistency_model
    instances:
      - name: every_cascade_is_visible_in_the_response_that_caused_it
        claim_type: immediate
        grounds:
          - consistency_model.immediate
        distinguishing_aspect: |
          The declared model is immediate, so no denormalized field is allowed to lag:
          the participant-assignment response already carries the recomputed tranche
          liabilities and readiness flag, and a re-read taken afterwards must be
          byte-identical to it. This is the claim that forbids an implementation from
          deferring recomputation to the next read.
        test_recipe:
          setup:
            - "a BUYOUT_ONLY plan with one cleansed RETIREE_IN_PAY participant and a DRAFT tranche"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlanSponsor
              as_user_id: "sponsor-treasury-01"
            - call: "POST /prt/plans"
              payload: { sponsor_name: "Ashcroft Machining", plan_name: "Ashcroft Salaried Plan", plan_ein: "231004556", total_liability_cents: 100000000, plan_assets_cents: 92000000, service_cost_cents: 3000000, interest_cost_cents: 9000000, unrecognized_actuarial_loss_cents: 4000000, discount_rate_bps: 500 }
              as: PlanSponsor
              as_user_id: "sponsor-treasury-01"
              captures: { plan_id: $.data.id }
            - call: "POST /prt/plans/${plan_id}/strategies"
              payload: { strategy_name: "Ashcroft Buyout", strategy_type: "ANNUITY_BUYOUT" }
              as: Actuary
              as_user_id: "actuary-01"
              captures: { strategy_id: $.data.id }
            - call: "POST /prt/strategies/${strategy_id}/submission"
              payload: {}
              as: Actuary
              as_user_id: "actuary-01"
            - call: "POST /prt/strategies/${strategy_id}/decision"
              payload: { decision: "APPROVE", decision_rationale: "Buyout approved." }
              as: PlanFiduciary
              as_user_id: "fiduciary-01"
            - call: "POST /prt/plans/${plan_id}/settlement-amendment"
              payload: { amendment_action: "ADOPT", amendment_scope: "BUYOUT_ONLY", amendment_effective_date: "2026-08-01T00:00:00Z" }
              as: PlanSponsor
              as_user_id: "sponsor-treasury-01"
            - call: "POST /prt/plans/${plan_id}/participants"
              payload: { participant_reference: "AC-1601", cohort: "RETIREE_IN_PAY", stated_monthly_benefit_cents: 60000, final_average_monthly_earnings_cents: 150000, credited_service_months: 320, date_of_birth: "1955-02-02" }
              as: PlanAdministrator
              as_user_id: "tpa-ops-01"
              captures: { p1_id: $.data.id }
            - call: "POST /prt/participants/${p1_id}/address-searches"
              payload: { search_result: "CONFIRMED_MATCH", confirmed_address_line1: "23 Kiln Lane", confirmed_postal_code: "14602" }
              as: PlanAdministrator
              as_user_id: "tpa-ops-01"
            - call: "POST /prt/participants/${p1_id}/mortality-checks"
              payload: { match_result: "NO_MATCH" }
              as: PlanAdministrator
              as_user_id: "tpa-ops-01"
              captures: { p1_v: $.data.version }
            - call: "POST /prt/participants/${p1_id}/benefit-audits"
              payload: { expected_participant_version: "${p1_v}" }
              as: Actuary
              as_user_id: "actuary-01"
              captures: { audit_id: $.data.id }
            - call: "POST /prt/benefit-audits/${audit_id}/resolution"
              payload: { resolution: "ACCEPT_AS_IS" }
              as: Actuary
              as_user_id: "actuary-01"
            - call: "POST /prt/plans/${plan_id}/tranches"
              payload: { tranche_name: "Retiree Tranche A", target_cohort: "RETIREE_IN_PAY" }
              as: PlanFiduciary
              as_user_id: "fiduciary-01"
              captures: { tranche_id: $.data.id, draft_flag: $.data.data_readiness_flag, draft_count: $.data.assigned_participant_count }
          trigger:
            - call: "POST /prt/tranches/${tranche_id}/participant-assignments"
              payload: { participant_id: "${p1_id}" }
              as: PlanAdministrator
              as_user_id: "tpa-ops-01"
              captures: { write_count: $.data.assigned_participant_count, write_acct: $.data.accounting_liability_cents, write_settle: $.data.settlement_liability_cents, write_flag: $.data.data_readiness_flag, write_version: $.data.version }
            - call: "GET /prt/tranches/${tranche_id}"
              payload: {}
              as: PlanFiduciary
              as_user_id: "fiduciary-01"
              captures: { read_count: $.data.assigned_participant_count, read_acct: $.data.accounting_liability_cents, read_settle: $.data.settlement_liability_cents, read_flag: $.data.data_readiness_flag, read_version: $.data.version }
            - call: "GET /prt/participants/${p1_id}"
              payload: {}
              as: PlanAdministrator
              as_user_id: "tpa-ops-01"
              captures: { p_state: $.data.participant_status, p_tranche: $.data.tranche_id }
          assert:
            - "the DRAFT tranche started with ${draft_count} == 0 and ${draft_flag} == BLOCKED"
            - "the assignment response itself already carries ${write_count} == 1, ${write_acct} == 8496000 (720000 * 118000 bp) and ${write_settle} == 9090000 (720000 * 126250 bp) — computed on the write, not on the next read"
            - "${write_flag} == READY in that same response, because the only assigned participant is CLEAN"
            - "the re-read matches field for field: ${read_count} == ${write_count}, ${read_acct} == ${write_acct}, ${read_settle} == ${write_settle}, ${read_flag} == ${write_flag}, ${read_version} == ${write_version}"
            - "the cross-entity half of the cascade is equally immediate: ${p_state} == ASSIGNED and ${p_tranche} == ${tranche_id}"
