      - name: error_assignment_superseded_on_accept_stale_offer
        claim_type: violation_to_error
        grounds: ["errors[ERR_ASSIGNMENT_SUPERSEDED]", state_machines.Assignment.OFFERED_to_ACCEPTED, endpoints]
        distinguishing_aspect: "After a second offer supersedes the first OFFERED assignment, accepting the first returns ERR_ASSIGNMENT_SUPERSEDED 409."
        test_recipe:
          setup: ["Request submitted; offered to S1 (asg1), then re-offered to S2 (asg2) which supersedes asg1."]
          setup_api_calls:
            - call: "POST /counties"
              payload: { name: "Sup County", state_code: "CA", min_diligent_attempts: 1 }
              as: Admin
              captures: { county_id: $.data.id }
            - call: "POST /servers"
              payload: { full_name: "S One", license_no: "PS-SUP1" }
              as: Admin
              captures: { s1: $.data.id }
            - call: "POST /servers"
              payload: { full_name: "S Two", license_no: "PS-SUP2" }
              as: Admin
              captures: { s2: $.data.id }
            - call: "POST /servers/${s1}/territories"
              payload: { county_id: "${county_id}" }
              as: Admin
            - call: "POST /servers/${s2}/territories"
              payload: { county_id: "${county_id}" }
              as: Admin
            - call: "POST /clients"
              payload: { firm_name: "Su Law", email: "su@law.com" }
              as: Admin
              captures: { client_id: $.data.id }
            - call: "POST /service-requests"
              payload: { client_id: "${client_id}", county_id: "${county_id}", recipient_name: "R", service_address: "1 St", service_lat: 36.0, service_lng: -119.0 }
              as: Dispatcher
              captures: { sr_id: $.data.id }
            - call: "POST /service-requests/${sr_id}/documents"
              payload: { doc_type: "SUMMONS", page_count: 1 }
              as: Dispatcher
            - call: "POST /service-requests/${sr_id}/submit"
              payload: {}
              as: Dispatcher
              captures: { sr_v1: $.data.version }
            - call: "POST /service-requests/${sr_id}/assignments"
              payload: { server_id: "${s1}", expected_service_request_version: "${sr_v1}" }
              as: Dispatcher
              captures: { asg1: $.data.id }
            - call: "GET /service-requests/${sr_id}"
              payload: {}
              as: Dispatcher
              captures: { sr_v2: $.data.version }
            - call: "POST /service-requests/${sr_id}/assignments"
              payload: { server_id: "${s2}", expected_service_request_version: "${sr_v2}" }
              as: Dispatcher
              captures: { asg2: $.data.id }
          trigger:
            - call: "POST /assignments/${asg1}/accept"
              payload: {}
              as: Server
              as_user_id: "${s1}"
              captures: { err: $.data.error_id }
          assert:
            - "response status == 409"
            - "error_id == ERR_ASSIGNMENT_SUPERSEDED"
            - "Assignment.${asg1}.superseded == true"

      - name: error_substitute_service_diligence_not_met_stub
        claim_type: violation_to_error
        grounds: ["errors[ERR_DILIGENCE_NOT_MET]"]
        excluded_because:
          difficulty_instance: boundary_precision_check / diligence_min_attempts_boundary_on_services_endpoint
          rationale: "ERR_DILIGENCE_NOT_MET triggering is asserted by the named §1.8 boundary instance."

