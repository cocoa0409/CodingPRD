# =============================================================================
# §1.9 Scaffold Corner Design — coverage index for non-Difficulty claims.
# Sections/claim_types follow references/claim-extraction-guide.md.
# Stubs (excluded_because) mark corners already exercised by §1.8 instances.
# =============================================================================
scaffold_corner_design:
  - section: entities
    instances:
      - name: tax_year_creation_client_id_input_ignored
        claim_type: creation
        grounds: [entities.TaxYear, "endpoints.POST /tax/tax-years"]
        distinguishing_aspect: "Create succeeds with defaults applied (prior_year_total_tax_cents omitted -> 0), system fields minted (status OPEN, version 1, all computed money fields 0), and a client-supplied id field is ignored (undeclared fields are never rejected per validations[priority=11])."
        test_recipe:
          setup: ["Empty database; default clock 2026-08-01T00:00:00Z"]
          setup_api_calls: []
          trigger:
            - call: "POST /tax/tax-years"
              payload: { id: "00000000-0000-0000-0000-0000000000aa", fiscal_year_label: "FY2026", period_start_date: "2026-01-01", period_end_date: "2026-12-31", enacted_federal_rate_bp: 2100, pretax_book_income_cents: 100000000 }
              as: TaxManager
              captures: { ty_id: $.data.id, ty_v: $.data.version, ty_st: $.data.status }
          assert:
            - "Response status 201; data.id != client-supplied id (server-minted UUID)"
            - "status == OPEN; version == 1; prior_year_total_tax_cents == 0 (default)"
            - "current_provision_cents == 0, deferred_expense_cents == 0, net_deferred_asset_cents == 0, valuation_allowance_cents == 0, utp_liability_cents == 0, return_to_provision_adjustment_cents == 0, forecast_etr_bp == 0, actual_etr_bp == 0"

      - name: filing_get_unknown_id_not_found
        claim_type: not_found
        grounds: [entities.Filing, "endpoints.GET /tax/filings/{filingId}", "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET with a well-formed but nonexistent UUID returns 404 ERR_NOT_FOUND inside the standard error envelope."
        test_recipe:
          setup: ["Empty database"]
          setup_api_calls: []
          trigger:
            - call: "GET /tax/filings/11111111-2222-3333-4444-555555555555"
              payload: {}
              as: Auditor
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 404; err == ERR_NOT_FOUND; response_type == 'error' with meta.api_request_id present"

      - name: difference_creation_computed_fields_immediate
        claim_type: computed_fields
        grounds: [entities.BookTaxDifference.fields.difference_cents, calculations.difference_amount]
        distinguishing_aspect: "difference_cents is computed (book - tax) and returned in the creation response itself (immediate consistency); status starts IDENTIFIED; created_by_user_id is stamped from X-User-ID."
        test_recipe:
          setup: ["FY2026 TaxYear OPEN; jurisdiction US-FED"]
          setup_api_calls:
            - call: "POST /tax/tax-years"
              payload: { fiscal_year_label: "FY2026", period_start_date: "2026-01-01", period_end_date: "2026-12-31", enacted_federal_rate_bp: 2100, pretax_book_income_cents: 100000000, prior_year_total_tax_cents: 8000000 }
              as: TaxManager
              captures: { ty_id: $.data.id }
            - call: "POST /tax/jurisdictions"
              payload: { code: "US-FED", name: "United States Federal", level: FEDERAL, statutory_rate_bp: 2100, apportionment_pct_bp: 10000, return_due_month: 4, return_due_day: 15, extension_months: 6 }
              as: TaxManager
              captures: { jur_fed: $.data.id }
          trigger:
            - call: "POST /tax/book-tax-differences"
              payload: { tax_year_id: "${ty_id}", jurisdiction_id: "${jur_fed}", description: "accrued warranty", book_amount_cents: 5000000, tax_amount_cents: 2000000, difference_type: TEMPORARY }
              as: TaxAccountant
              as_user_id: "acct-7"
              captures: { dc: $.data.difference_cents, st: $.data.status, cb: $.data.created_by_user_id }
          assert:
            - "difference_cents == 3000000 in the 201 response (no re-read needed)"
            - "status == IDENTIFIED (initial state)"
            - "created_by_user_id == 'acct-7' (stamped from X-User-ID, not client body)"

      - name: filing_list_pagination_and_envelope
        claim_type: listing
        grounds: ["endpoints.GET /tax/filings", response_envelope]
        distinguishing_aspect: "List endpoint honors limit/offset with total_count and has_more: 3 filings -> limit=2 returns 2 with has_more true; offset=2 returns the last 1 with has_more false."
        test_recipe:
          setup: ["FY2026 TaxYear OPEN; jurisdictions US-FED, US-CA, US-IL; one filing per jurisdiction"]
          setup_api_calls:
            - call: "POST /tax/tax-years"
              payload: { fiscal_year_label: "FY2026", period_start_date: "2026-01-01", period_end_date: "2026-12-31", enacted_federal_rate_bp: 2100, pretax_book_income_cents: 100000000, prior_year_total_tax_cents: 8000000 }
              as: TaxManager
              captures: { ty_id: $.data.id }
            - call: "POST /tax/jurisdictions"
              payload: { code: "US-FED", name: "United States Federal", level: FEDERAL, statutory_rate_bp: 2100, apportionment_pct_bp: 10000, return_due_month: 4, return_due_day: 15, extension_months: 6 }
              as: TaxManager
              captures: { jur_fed: $.data.id }
            - call: "POST /tax/jurisdictions"
              payload: { code: "US-CA", name: "California", level: STATE, statutory_rate_bp: 884, apportionment_pct_bp: 2500, return_due_month: 4, return_due_day: 15, extension_months: 7 }
              as: TaxManager
              captures: { jur_ca: $.data.id }
            - call: "POST /tax/jurisdictions"
              payload: { code: "US-IL", name: "Illinois", level: STATE, statutory_rate_bp: 883, apportionment_pct_bp: 2503, return_due_month: 4, return_due_day: 15, extension_months: 6 }
              as: TaxManager
              captures: { jur_il: $.data.id }
            - { call: "POST /tax/filings", payload: { tax_year_id: "${ty_id}", jurisdiction_id: "${jur_fed}", original_due_date: "2027-04-15" }, as: TaxAccountant }
            - { call: "POST /tax/filings", payload: { tax_year_id: "${ty_id}", jurisdiction_id: "${jur_ca}", original_due_date: "2027-04-15" }, as: TaxAccountant }
            - { call: "POST /tax/filings", payload: { tax_year_id: "${ty_id}", jurisdiction_id: "${jur_il}", original_due_date: "2027-04-15" }, as: TaxAccountant }
          trigger:
            - call: "GET /tax/filings"
              payload: { tax_year_id: "${ty_id}", limit: 2, offset: 0 }
              as: Auditor
            - call: "GET /tax/filings"
              payload: { tax_year_id: "${ty_id}", limit: 2, offset: 2 }
              as: Auditor
          assert:
            - "Page 1: response_type == 'array', 2 items, total_count == 3, has_more == true, meta.api_request_id present"
            - "Page 2: 1 item, total_count == 3, has_more == false"
            - "The two pages are disjoint and together cover all 3 filings"

  - section: state_machines
    instances:
      - name: locked_difference_terminal_lockdown_rejected
        claim_type: terminal_state_lockdown
        grounds: [state_machines.BookTaxDifference, "errors[ERR_INVALID_STATE_TRANSITION]"]
        distinguishing_aspect: "From terminal LOCKED every further action trigger (reject shown) is rejected with ERR_INVALID_STATE_TRANSITION and no side effects fire."
        test_recipe:
          setup: ["FY2026 OPEN; PERMANENT difference reviewed then locked"]
          setup_api_calls:
            - call: "POST /tax/tax-years"
              payload: { fiscal_year_label: "FY2026", period_start_date: "2026-01-01", period_end_date: "2026-12-31", enacted_federal_rate_bp: 2100, pretax_book_income_cents: 100000000, prior_year_total_tax_cents: 8000000 }
              as: TaxManager
              captures: { ty_id: $.data.id }
            - call: "POST /tax/jurisdictions"
              payload: { code: "US-FED", name: "United States Federal", level: FEDERAL, statutory_rate_bp: 2100, apportionment_pct_bp: 10000, return_due_month: 4, return_due_day: 15, extension_months: 6 }
              as: TaxManager
              captures: { jur_fed: $.data.id }
            - call: "POST /tax/book-tax-differences"
              payload: { tax_year_id: "${ty_id}", jurisdiction_id: "${jur_fed}", description: "meals 50pct limitation", book_amount_cents: 2000000, tax_amount_cents: 0, difference_type: PERMANENT }
              as: TaxAccountant
              captures: { diff1: $.data.id }
            - { call: "POST /tax/book-tax-differences/${diff1}/review", payload: {}, as: TaxManager }
            - { call: "POST /tax/book-tax-differences/${diff1}/lock", payload: {}, as: TaxManager }
          trigger:
            - call: "POST /tax/book-tax-differences/${diff1}/reject"
              payload: {}
              as: TaxManager
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_STATE_TRANSITION (HTTP 409); the difference remains LOCKED with version unchanged"

      - name: valuation_allowance_approve_supersedes_prior
        claim_type: side_effect_execution
        grounds: [state_machines.ValuationAllowance.SUBMITTED_to_APPROVED, state_machines.ValuationAllowance.APPROVED_to_SUPERSEDED]
        distinguishing_aspect: "Approving a newer assessment flips the previously APPROVED one to SUPERSEDED and re-points TaxYear.valuation_allowance_cents at the new amount (630,000 full -> 320,000 partial)."
        test_recipe:
          setup: ["FY2026 OPEN; TEMPORARY difference 3,000,000 locked (DTA pool 630,000); VA1 (mltn=false) approved at 630,000"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-01-05T00:00:00Z" }, as: PlatformAdmin }
            - call: "POST /tax/tax-years"
              payload: { fiscal_year_label: "FY2026", period_start_date: "2026-01-01", period_end_date: "2026-12-31", enacted_federal_rate_bp: 2100, pretax_book_income_cents: 100000000, prior_year_total_tax_cents: 8000000 }
              as: TaxManager
              captures: { ty_id: $.data.id }
            - call: "POST /tax/jurisdictions"
              payload: { code: "US-FED", name: "United States Federal", level: FEDERAL, statutory_rate_bp: 2100, apportionment_pct_bp: 10000, return_due_month: 4, return_due_day: 15, extension_months: 6 }
              as: TaxManager
              captures: { jur_fed: $.data.id }
            - call: "POST /tax/book-tax-differences"
              payload: { tax_year_id: "${ty_id}", jurisdiction_id: "${jur_fed}", description: "accrued warranty", book_amount_cents: 5000000, tax_amount_cents: 2000000, difference_type: TEMPORARY }
              as: TaxAccountant
              captures: { diff1: $.data.id }
            - { call: "POST /tax/book-tax-differences/${diff1}/review", payload: {}, as: TaxManager }
            - { call: "POST /tax/book-tax-differences/${diff1}/lock", payload: {}, as: TaxManager }
            - call: "GET /tax/tax-years/${ty_id}"
              payload: {}
              as: TaxManager
              captures: { ty_v1: $.data.version }
            - call: "POST /tax/valuation-allowances"
              payload: { tax_year_id: "${ty_id}", more_likely_than_not: false, projected_taxable_income_cents: 0, reversing_dtl_cents: 0, expected_tax_year_version: "${ty_v1}" }
              as: TaxManager
              as_user_id: "mgr-1"
              captures: { va1: $.data.id }
            - { call: "POST /tax/valuation-allowances/${va1}/submit", payload: {}, as: TaxManager, as_user_id: "mgr-1" }
            - { call: "POST /tax/valuation-allowances/${va1}/approve", payload: {}, as: TaxDirector, as_user_id: "dir-1" }
            - call: "GET /tax/tax-years/${ty_id}"
              payload: {}
              as: TaxManager
              captures: { ty_v2: $.data.version }
            - call: "POST /tax/valuation-allowances"
              payload: { tax_year_id: "${ty_id}", more_likely_than_not: true, projected_taxable_income_cents: 1000000, reversing_dtl_cents: 100000, expected_tax_year_version: "${ty_v2}" }
              as: TaxManager
              as_user_id: "mgr-1"
              captures: { va2: $.data.id }
            - { call: "POST /tax/valuation-allowances/${va2}/submit", payload: {}, as: TaxManager, as_user_id: "mgr-1" }
          trigger:
            - { call: "POST /tax/valuation-allowances/${va2}/approve", payload: {}, as: TaxDirector, as_user_id: "dir-1" }
            - call: "GET /tax/valuation-allowances/${va1}"
              payload: {}
              as: Auditor
              captures: { va1_st: $.data.status }
            - call: "GET /tax/tax-years/${ty_id}"
              payload: {}
              as: Auditor
              captures: { ty_va: $.data.valuation_allowance_cents }
          assert:
            - "ValuationAllowance.${va1}.status == SUPERSEDED after va2 approval"
            - "ValuationAllowance.${va2}.status == APPROVED and allowance_amount_cents == 320000"
            - "TaxYear.valuation_allowance_cents == 320000 (re-pointed from 630000)"

      - name: notice_auto_overdue_and_late_response
        claim_type: valid_transition
        grounds: [state_machines.TaxNotice.RECEIVED_to_OVERDUE, state_machines.TaxNotice.OVERDUE_to_RESPONDED]
        distinguishing_aspect: "Clock sweep past response_due_on auto-moves RECEIVED -> OVERDUE without any notice-scoped call; a late respond from OVERDUE is still legal and lands in RESPONDED."
        test_recipe:
          setup: ["Jurisdiction US-FED; notice received 2026-01-10 with response_due_on 2026-02-09, still RECEIVED"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-01-10T00:00:00Z" }, as: PlatformAdmin }
            - call: "POST /tax/jurisdictions"
              payload: { code: "US-FED", name: "United States Federal", level: FEDERAL, statutory_rate_bp: 2100, apportionment_pct_bp: 10000, return_due_month: 4, return_due_day: 15, extension_months: 6 }
              as: TaxManager
              captures: { jur_fed: $.data.id }
            - call: "POST /tax/notices"
              payload: { jurisdiction_id: "${jur_fed}", notice_type: INFORMATION_REQUEST, received_on: "2026-01-10", response_due_on: "2026-02-09" }
              as: TaxAccountant
              captures: { n1: $.data.id }
          trigger:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-02-10T00:00:00Z" }, as: PlatformAdmin, captures: { overdue: $.data.overdue_notice_ids } }
            - { call: "POST /tax/notices/${n1}/respond", payload: { response_text: "records enclosed" }, as: TaxManager, captures: { st: $.data.status } }
          assert:
            - "After the sweep: TaxNotice.${n1}.status was OVERDUE (n1 in overdue_notice_ids)"
            - "Late respond succeeds from OVERDUE: status == RESPONDED"

      - name: utp_auto_lapse_after_statute
        claim_type: valid_transition
        grounds: [state_machines.UncertainTaxPosition.DISCLOSED_to_LAPSED]
        distinguishing_aspect: "A DISCLOSED UTP lapses automatically once the clock passes filed_on + 3 years of the linked filed return; the year's UTP reserve drops to 0 without any position-scoped call."
        test_recipe:
          setup:
            - "FY2026 PROVISION_LOCKED; FED filing READY then FILED on 2026-06-01; UTP 1,000,000 @4000 bp DISCLOSED before filing"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-01-05T00:00:00Z" }, as: PlatformAdmin }
            - call: "POST /tax/tax-years"
              payload: { fiscal_year_label: "FY2026", period_start_date: "2026-01-01", period_end_date: "2026-12-31", enacted_federal_rate_bp: 2100, pretax_book_income_cents: 100000000, prior_year_total_tax_cents: 8000000 }
              as: TaxManager
              captures: { ty_id: $.data.id, ty_v0: $.data.version }
            - call: "POST /tax/jurisdictions"
              payload: { code: "US-FED", name: "United States Federal", level: FEDERAL, statutory_rate_bp: 2100, apportionment_pct_bp: 10000, return_due_month: 4, return_due_day: 15, extension_months: 6 }
              as: TaxManager
              captures: { jur_fed: $.data.id }
            - call: "POST /tax/filings"
              payload: { tax_year_id: "${ty_id}", jurisdiction_id: "${jur_fed}", original_due_date: "2027-04-15" }
              as: TaxAccountant
              captures: { fil1: $.data.id }
            - call: "GET /tax/tax-years/${ty_id}"
              payload: {}
              as: TaxManager
              captures: { ty_va_v: $.data.version }
            - call: "POST /tax/valuation-allowances"
              payload: { tax_year_id: "${ty_id}", more_likely_than_not: false, projected_taxable_income_cents: 0, reversing_dtl_cents: 0, expected_tax_year_version: "${ty_va_v}" }
              as: TaxManager
              as_user_id: "mgr-1"
              captures: { va1: $.data.id }
            - { call: "POST /tax/valuation-allowances/${va1}/submit", payload: {}, as: TaxManager, as_user_id: "mgr-1" }
            - { call: "POST /tax/valuation-allowances/${va1}/approve", payload: {}, as: TaxDirector, as_user_id: "dir-1" }
            - { call: "POST /tax/tax-years/${ty_id}/lock-provision", payload: {}, as: TaxDirector }
            - { call: "POST /tax/filings/${fil1}/mark-ready", payload: { return_tax_liability_cents: 21100000 }, as: TaxAccountant }
            - call: "POST /tax/uncertain-tax-positions"
              payload: { tax_year_id: "${ty_id}", jurisdiction_id: "${jur_fed}", description: "transfer pricing", position_amount_cents: 1000000 }
              as: TaxAccountant
              captures: { utp1: $.data.id }
            - { call: "POST /tax/uncertain-tax-positions/${utp1}/measure", payload: { cumulative_probability_bp: 4000 }, as: TaxManager }
            - { call: "POST /tax/uncertain-tax-positions/${utp1}/disclose", payload: {}, as: TaxManager }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: PlatformAdmin }
            - call: "GET /tax/tax-years/${ty_id}"
              payload: {}
              as: TaxDirector
              captures: { ty_v1: $.data.version }
            - { call: "POST /tax/filings/${fil1}/file", payload: { expected_tax_year_version: "${ty_v1}" }, as: TaxDirector }
          trigger:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2029-06-02T00:00:00Z" }, as: PlatformAdmin, captures: { lapsed: $.data.lapsed_position_ids } }
            - call: "GET /tax/uncertain-tax-positions/${utp1}"
              payload: {}
              as: Auditor
              captures: { st: $.data.status }
            - call: "GET /tax/tax-years/${ty_id}"
              payload: {}
              as: Auditor
              captures: { reserve: $.data.utp_liability_cents }
          assert:
            - "filed_on == 2026-06-01; statute expiry 2029-06-01; clock 2029-06-02 lapses the position (utp1 in lapsed_position_ids)"
            - "UTP.status == LAPSED; TaxYear.utp_liability_cents == 0 (reserve released by the sweep)"

      - name: payment_late_payoff_keeps_penalty
        claim_type: side_effect_execution
        grounds: [state_machines.EstimatedPayment.LATE_to_PAID, calculations.underpayment_penalty]
        distinguishing_aspect: "Paying a LATE quarter's full shortfall lands PAID but the penalty assessed at the LATE transition (2,101 on a 52,537 shortfall) is retained, never refunded."
        test_recipe:
          setup: ["FY2026; US-IL annualized schedule; q1 (552,537 due 2026-04-15) paid only 500,000; clock moved to 2026-04-16 -> LATE, penalty assessed"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-01-05T00:00:00Z" }, as: PlatformAdmin }
            - call: "POST /tax/tax-years"
              payload: { fiscal_year_label: "FY2026", period_start_date: "2026-01-01", period_end_date: "2026-12-31", enacted_federal_rate_bp: 2100, pretax_book_income_cents: 100000000, prior_year_total_tax_cents: 8000000 }
              as: TaxManager
              captures: { ty_id: $.data.id }
            - call: "POST /tax/jurisdictions"
              payload: { code: "US-IL", name: "Illinois", level: STATE, statutory_rate_bp: 883, apportionment_pct_bp: 2503, return_due_month: 4, return_due_day: 15, extension_months: 6 }
              as: TaxManager
              captures: { jur_il: $.data.id }
            - call: "POST /tax/estimated-payments/generate-schedule"
              payload: { tax_year_id: "${ty_id}", jurisdiction_id: "${jur_il}", method: CURRENT_YEAR_ANNUALIZED }
              as: TaxManager
              captures: { q1: "$.data[0].id" }
            - { call: "POST /tax/estimated-payments/${q1}/record-payment", payload: { amount_cents: 500000 }, as: TaxAccountant }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-04-16T00:00:00Z" }, as: PlatformAdmin }
          trigger:
            - { call: "POST /tax/estimated-payments/${q1}/record-payment", payload: { amount_cents: 52537 }, as: TaxAccountant, captures: { st: $.data.status, pen: $.data.penalty_cents, paid: $.data.paid_amount_cents } }
          assert:
            - "Penalty assessed at LATE transition == 2101  # round_half_up(52,537 * 400/10000) = round(2,101.48)"
            - "After payoff: status == PAID, paid_amount_cents == 552537, penalty_cents == 2101 (retained)"

  - section: calculations
    instances:
      - name: permanent_and_zero_differences_produce_no_deferred_items
        claim_type: input_set_filtering
        grounds:
          - calculations.deferred_tax_movement
          - state_machines.BookTaxDifference.REVIEWED_to_LOCKED
        distinguishing_aspect: "The deferred-item input set excludes PERMANENT differences and zero TEMPORARY differences: after locking one of each, the year's DeferredTaxItem list stays empty and net_deferred_asset_cents stays 0."
        test_recipe:
          setup: ["FY2026 OPEN; US-FED; one PERMANENT difference (2,000,000 vs 0) and one TEMPORARY difference with book == tax (1,500,000 vs 1,500,000)"]
          setup_api_calls:
            - call: "POST /tax/tax-years"
              payload: { fiscal_year_label: "FY2026", period_start_date: "2026-01-01", period_end_date: "2026-12-31", enacted_federal_rate_bp: 2100, pretax_book_income_cents: 100000000, prior_year_total_tax_cents: 8000000 }
              as: TaxManager
              captures: { ty_id: $.data.id }
            - call: "POST /tax/jurisdictions"
              payload: { code: "US-FED", name: "United States Federal", level: FEDERAL, statutory_rate_bp: 2100, apportionment_pct_bp: 10000, return_due_month: 4, return_due_day: 15, extension_months: 6 }
              as: TaxManager
              captures: { jur_fed: $.data.id }
            - call: "POST /tax/book-tax-differences"
              payload: { tax_year_id: "${ty_id}", jurisdiction_id: "${jur_fed}", description: "meals 50pct limitation", book_amount_cents: 2000000, tax_amount_cents: 0, difference_type: PERMANENT }
              as: TaxAccountant
              captures: { d_perm: $.data.id }
            - call: "POST /tax/book-tax-differences"
              payload: { tax_year_id: "${ty_id}", jurisdiction_id: "${jur_fed}", description: "timing-neutral accrual", book_amount_cents: 1500000, tax_amount_cents: 1500000, difference_type: TEMPORARY }
              as: TaxAccountant
              captures: { d_zero: $.data.id }
            - { call: "POST /tax/book-tax-differences/${d_perm}/review", payload: {}, as: TaxManager }
            - { call: "POST /tax/book-tax-differences/${d_perm}/lock", payload: {}, as: TaxManager }
            - { call: "POST /tax/book-tax-differences/${d_zero}/review", payload: {}, as: TaxManager }
          trigger:
            - { call: "POST /tax/book-tax-differences/${d_zero}/lock", payload: {}, as: TaxManager }
            - call: "GET /tax/deferred-tax-items"
              payload: { tax_year_id: "${ty_id}" }
              as: Auditor
            - call: "GET /tax/tax-years/${ty_id}"
              payload: {}
              as: Auditor
              captures: { nda: $.data.net_deferred_asset_cents }
          assert:
            - "GET /tax/deferred-tax-items?tax_year_id returns an empty array (PERMANENT and zero TEMPORARY differences generate no rollforward line)"
            - "TaxYear.net_deferred_asset_cents == 0 and deferred_expense_cents == 0"

      - name: current_tax_stack_state_deduction_order
        claim_type: correct_result
        grounds:
          - calculations.current_tax_stack
          - entities.TaxYear.fields.current_provision_cents
        distinguishing_aspect: "Mode (c) pinned evaluation order: state tax is computed on the pre-deduction base first (CA 2,254,200), then deducted from the federal base (99,745,800 -> FED 20,946,618); the reverse order would change both numbers."
        test_recipe:
          setup: ["FY2026 OPEN; US-FED (2100 bp, 100%) and US-CA (884 bp, 25%); LOCKED PERMANENT difference +2,000,000; filings opened for both jurisdictions"]
          setup_api_calls:
            - call: "POST /tax/tax-years"
              payload: { fiscal_year_label: "FY2026", period_start_date: "2026-01-01", period_end_date: "2026-12-31", enacted_federal_rate_bp: 2100, pretax_book_income_cents: 100000000, prior_year_total_tax_cents: 8000000 }
              as: TaxManager
              captures: { ty_id: $.data.id }
            - call: "POST /tax/jurisdictions"
              payload: { code: "US-FED", name: "United States Federal", level: FEDERAL, statutory_rate_bp: 2100, apportionment_pct_bp: 10000, return_due_month: 4, return_due_day: 15, extension_months: 6 }
              as: TaxManager
              captures: { jur_fed: $.data.id }
            - call: "POST /tax/jurisdictions"
              payload: { code: "US-CA", name: "California", level: STATE, statutory_rate_bp: 884, apportionment_pct_bp: 2500, return_due_month: 4, return_due_day: 15, extension_months: 7 }
              as: TaxManager
              captures: { jur_ca: $.data.id }
            - call: "POST /tax/book-tax-differences"
              payload: { tax_year_id: "${ty_id}", jurisdiction_id: "${jur_fed}", description: "meals 50pct limitation", book_amount_cents: 2000000, tax_amount_cents: 0, difference_type: PERMANENT }
              as: TaxAccountant
              captures: { d1: $.data.id }
            - { call: "POST /tax/book-tax-differences/${d1}/review", payload: {}, as: TaxManager }
            - { call: "POST /tax/filings", payload: { tax_year_id: "${ty_id}", jurisdiction_id: "${jur_fed}", original_due_date: "2027-04-15" }, as: TaxAccountant }
            - { call: "POST /tax/filings", payload: { tax_year_id: "${ty_id}", jurisdiction_id: "${jur_ca}", original_due_date: "2027-04-15" }, as: TaxAccountant }
          trigger:
            - { call: "POST /tax/book-tax-differences/${d1}/lock", payload: {}, as: TaxManager }
            - call: "GET /tax/tax-years/${ty_id}"
              payload: {}
              as: Auditor
              captures: { cp: $.data.current_provision_cents }
          assert:
            - "TaxYear.current_provision_cents == 23200818  # CA round((100,000,000+2,000,000)*2500*884/1e8)=2,254,200 first; FED round((102,000,000-2,254,200)*2100/10000)=20,946,618 second"
            - "Had the stack deducted nothing, FED alone would be round(102,000,000*0.21)=21,420,000 — the pinned order is observable"

      - name: utp_interest_accrual_whole_months
        claim_type: precision
        grounds:
          - calculations.utp_recognition_measurement
          - entities.UncertainTaxPosition.fields.interest_accrued_cents
        distinguishing_aspect: "Interest accrues on the unrecognized benefit at 5% per annum using FLOORED whole months: measured 2026-08-01, read at 2026-12-15 -> 4 months (not 4.5) -> 16,667 on a 1,000,000 liability."
        test_recipe:
          setup: ["FY2026 OPEN; US-FED; UTP 1,000,000 measured @4000 bp on the default clock date 2026-08-01"]
          setup_api_calls:
            - call: "POST /tax/tax-years"
              payload: { fiscal_year_label: "FY2026", period_start_date: "2026-01-01", period_end_date: "2026-12-31", enacted_federal_rate_bp: 2100, pretax_book_income_cents: 100000000, prior_year_total_tax_cents: 8000000 }
              as: TaxManager
              captures: { ty_id: $.data.id }
            - call: "POST /tax/jurisdictions"
              payload: { code: "US-FED", name: "United States Federal", level: FEDERAL, statutory_rate_bp: 2100, apportionment_pct_bp: 10000, return_due_month: 4, return_due_day: 15, extension_months: 6 }
              as: TaxManager
              captures: { jur_fed: $.data.id }
            - call: "POST /tax/uncertain-tax-positions"
              payload: { tax_year_id: "${ty_id}", jurisdiction_id: "${jur_fed}", description: "transfer pricing", position_amount_cents: 1000000 }
              as: TaxAccountant
              captures: { utp1: $.data.id }
            - { call: "POST /tax/uncertain-tax-positions/${utp1}/measure", payload: { cumulative_probability_bp: 4000 }, as: TaxManager, captures: { m_on: $.data.measured_on } }
          trigger:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-12-15T00:00:00Z" }, as: PlatformAdmin }
            - call: "GET /tax/uncertain-tax-positions/${utp1}"
              payload: {}
              as: Auditor
              captures: { interest: $.data.interest_accrued_cents }
          assert:
            - "measured_on == '2026-08-01' (default clock date — the clock was never set before measure)"
            - "interest_accrued_cents == 16667  # round_half_up(1,000,000 * 500/10000 * 4/12) = round(16,666.67); the 14 extra days past Dec 1 are floored away"

  - section: validations
    instances:
      - name: tax_year_create_missing_auth_header_returns_401
        claim_type: violation_to_error
        grounds:
          - validations[priority=1]
          - errors[ERR_MISSING_AUTH_CONTEXT]
        distinguishing_aspect: "A request with no X-User-Role/X-User-ID headers is rejected 401 ERR_MISSING_AUTH_CONTEXT before any role, existence, or business check runs."
        test_recipe:
          setup: ["Empty database"]
          setup_api_calls: []
          trigger:
            - call: "POST /tax/tax-years"
              payload: { fiscal_year_label: "FY2026", period_start_date: "2026-01-01", period_end_date: "2026-12-31", enacted_federal_rate_bp: 2100, pretax_book_income_cents: 100000000 }
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 401; err == ERR_MISSING_AUTH_CONTEXT; no TaxYear is created"

      - name: record_payment_unknown_id_returns_not_found
        claim_type: priority_ordering
        grounds:
          - validations[priority=3]
          - validations[priority=4]
        distinguishing_aspect: "Existence (p3) beats state (p4): a payment against a nonexistent payment id reports ERR_NOT_FOUND even though the amount would also be unpayable."
        test_recipe:
          setup: ["Empty database"]
          setup_api_calls: []
          trigger:
            - call: "POST /tax/estimated-payments/11111111-2222-3333-4444-555555555555/record-payment"
              payload: { amount_cents: 1000 }
              as: TaxAccountant
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 404; err == ERR_NOT_FOUND"

      - name: extension_request_after_original_due_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=8]
          - errors[ERR_EXTENSION_WINDOW_MISSED]
        distinguishing_aspect: "request-extension one day past the original due date is rejected ERR_EXTENSION_WINDOW_MISSED; the same call on the due date itself would succeed (<= boundary)."
        test_recipe:
          setup: ["FY2026 OPEN; FED filing PENDING with original_due_date 2027-04-15; clock at 2027-04-16"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-01-05T00:00:00Z" }, as: PlatformAdmin }
            - call: "POST /tax/tax-years"
              payload: { fiscal_year_label: "FY2026", period_start_date: "2026-01-01", period_end_date: "2026-12-31", enacted_federal_rate_bp: 2100, pretax_book_income_cents: 100000000, prior_year_total_tax_cents: 8000000 }
              as: TaxManager
              captures: { ty_id: $.data.id }
            - call: "POST /tax/jurisdictions"
              payload: { code: "US-FED", name: "United States Federal", level: FEDERAL, statutory_rate_bp: 2100, apportionment_pct_bp: 10000, return_due_month: 4, return_due_day: 15, extension_months: 6 }
              as: TaxManager
              captures: { jur_fed: $.data.id }
            - call: "POST /tax/filings"
              payload: { tax_year_id: "${ty_id}", jurisdiction_id: "${jur_fed}", original_due_date: "2027-04-15" }
              as: TaxAccountant
              captures: { fil1: $.data.id }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2027-04-16T00:00:00Z" }, as: PlatformAdmin }
          trigger:
            - call: "POST /tax/filings/${fil1}/request-extension"
              payload: {}
              as: TaxAccountant
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_EXTENSION_WINDOW_MISSED (HTTP 422); extension_status stays NONE"

      - name: audit_close_blocked_by_unresolved_notice
        claim_type: violation_to_error
        grounds:
          - validations[priority=9]
          - errors[ERR_UNRESOLVED_NOTICES]
          - state_machines.AuditCase.ADJUSTMENT_PROPOSED_to_CLOSED_AGREED
        distinguishing_aspect: "Closing an audit while a linked notice is still RECEIVED fails ERR_UNRESOLVED_NOTICES; resolving the notice through its lifecycle unblocks the close."
        test_recipe:
          setup: ["FY2026; US-FED; audit ADJUSTMENT_PROPOSED; linked notice RECEIVED (due far in future)"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-01-05T00:00:00Z" }, as: PlatformAdmin }
            - call: "POST /tax/tax-years"
              payload: { fiscal_year_label: "FY2026", period_start_date: "2026-01-01", period_end_date: "2026-12-31", enacted_federal_rate_bp: 2100, pretax_book_income_cents: 100000000, prior_year_total_tax_cents: 8000000 }
              as: TaxManager
              captures: { ty_id: $.data.id }
            - call: "POST /tax/jurisdictions"
              payload: { code: "US-FED", name: "United States Federal", level: FEDERAL, statutory_rate_bp: 2100, apportionment_pct_bp: 10000, return_due_month: 4, return_due_day: 15, extension_months: 6 }
              as: TaxManager
              captures: { jur_fed: $.data.id }
            - call: "POST /tax/audits"
              payload: { tax_year_id: "${ty_id}", jurisdiction_id: "${jur_fed}", exam_period_start: "2026-01-01", exam_period_end: "2027-01-01" }
              as: TaxManager
              captures: { aud1: $.data.id }
            - { call: "POST /tax/audits/${aud1}/propose-adjustment", payload: { proposed_adjustment_cents: 400000 }, as: TaxManager }
            - call: "POST /tax/notices"
              payload: { jurisdiction_id: "${jur_fed}", audit_case_id: "${aud1}", notice_type: PROPOSED_ADJUSTMENT, received_on: "2026-01-10", response_due_on: "2027-01-10" }
              as: TaxAccountant
              captures: { n1: $.data.id }
          trigger:
            - call: "POST /tax/audits/${aud1}/close"
              payload: { outcome: AGREED, agreed_adjustment_cents: 350000 }
              as: TaxManager
              captures: { err: $.data.error_id }
            - { call: "POST /tax/notices/${n1}/assign-review", payload: {}, as: TaxManager }
            - { call: "POST /tax/notices/${n1}/respond", payload: { response_text: "accepted with revisions" }, as: TaxManager }
            - { call: "POST /tax/notices/${n1}/resolve", payload: {}, as: TaxManager }
            - call: "POST /tax/audits/${aud1}/close"
              payload: { outcome: AGREED, agreed_adjustment_cents: 350000 }
              as: TaxManager
              captures: { st: $.data.status }
          assert:
            - "First close: err == ERR_UNRESOLVED_NOTICES (HTTP 422)"
            - "After notice walks RECEIVED -> UNDER_REVIEW -> RESPONDED -> RESOLVED: close succeeds, status == CLOSED_AGREED, agreed_adjustment_cents == 350000"

      - name: measure_probability_out_of_range_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=10]
          - errors[ERR_PROBABILITY_OUT_OF_RANGE]
        distinguishing_aspect: "cumulative_probability_bp of 10001 (one bp over the maximum) is rejected ERR_PROBABILITY_OUT_OF_RANGE; 10000 is the legal ceiling."
        test_recipe:
          setup: ["FY2026 OPEN; US-FED; UTP identified"]
          setup_api_calls:
            - call: "POST /tax/tax-years"
              payload: { fiscal_year_label: "FY2026", period_start_date: "2026-01-01", period_end_date: "2026-12-31", enacted_federal_rate_bp: 2100, pretax_book_income_cents: 100000000, prior_year_total_tax_cents: 8000000 }
              as: TaxManager
              captures: { ty_id: $.data.id }
            - call: "POST /tax/jurisdictions"
              payload: { code: "US-FED", name: "United States Federal", level: FEDERAL, statutory_rate_bp: 2100, apportionment_pct_bp: 10000, return_due_month: 4, return_due_day: 15, extension_months: 6 }
              as: TaxManager
              captures: { jur_fed: $.data.id }
            - call: "POST /tax/uncertain-tax-positions"
              payload: { tax_year_id: "${ty_id}", jurisdiction_id: "${jur_fed}", description: "R&D credit", position_amount_cents: 2000000 }
              as: TaxAccountant
              captures: { utp1: $.data.id }
          trigger:
            - call: "POST /tax/uncertain-tax-positions/${utp1}/measure"
              payload: { cumulative_probability_bp: 10001 }
              as: TaxManager
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_PROBABILITY_OUT_OF_RANGE (HTTP 422); UTP stays IDENTIFIED"

      - name: record_payment_overpay_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=10]
          - errors[ERR_OVERPAYMENT]
        distinguishing_aspect: "A payment that would push paid above scheduled (552,537 + 1 on an open SCHEDULED quarter) is rejected ERR_OVERPAYMENT — distinct from the already-PAID state error."
