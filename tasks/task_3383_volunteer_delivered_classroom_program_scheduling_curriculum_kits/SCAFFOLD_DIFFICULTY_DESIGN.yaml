  - rule_id: compensating_invariant
    instances:
      - name: kit_ledger_invariant_through_reserve_distribute_reconcile
        grounds:
          - entities.KitInventory
          - state_machines.ClassroomDelivery
          - calculations.required_kits
        distinguishing_aspect: |
          Conserved quantity: physical kits. The invariant
          assembled_count == available_count + reserved_count + distributed_count + written_off_count + consumed_count
          must hold after every forward/compensating pair — ASSEMBLE/WRITE_OFF, RESERVE/CANCEL-release,
          DISTRIBUTE/RECONCILE-with-consumption. Pinned literal checkpoints: after WRITE_OFF
          (45,0,0,5,0), after RESERVE (22,23,0,5,0), after DISTRIBUTE (22,0,23,5,0), after
          RECONCILE with 20 consumed (25,0,0,5,20) — each summing to the assembled 50.
        test_recipe:
          setup:
            - "Logical clock 2026-09-01. Base territory/school; partner1 ACTIVE with eligible vol1."
            - "Program JA-ECO7 (5 sessions, no capstone); agreement ACTIVE (pledge 200000)."
            - "Inventory assembled to 50, then 5 written off."
            - "Delivery (enrolled 20, required_kits 23) taken through PLAN, 5 confirmed sessions, teacher confirm, RESERVE_KITS, SCHEDULE, DISTRIBUTE_KITS; all 5 sessions DELIVERED; delivery COMPLETED."
          setup_api_calls:
            - *clk
            - *office
            - *dist
            - *dist_act
            - *school
            - *partner1
            - *partner1_act
            - *vol1
            - *vol1_clear
            - *vol1_begin
