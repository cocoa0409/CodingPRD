            - { call: "POST /entries", payload: { event_id: "${ev1}", swimmer_id: "${sw_a}", seed_time_cs: 2900 }, as: TeamCoach, as_user_id: "${team_id}", captures: { en_a: "$.data.id" } }
            - { call: "POST /entries/${en_a}/verify", payload: {}, as: MeetDirector }
            - { call: "POST /officials", payload: { meet_id: "${meet_id}", full_name: "Ref R", lsc_membership_id: "LSC-R1", certifications: ["REFEREE"], certification_expires_on: "2027-01-01" }, as: MeetDirector, captures: { off_ref: "$.data.id" } }
