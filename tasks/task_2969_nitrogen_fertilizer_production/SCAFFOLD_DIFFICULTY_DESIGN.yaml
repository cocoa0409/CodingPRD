            - "One UREA tank of capacity_tons 20000, empty, so the priority-26 capacity gate cannot interfere either."
            - "ProductionRun PR-1 over 2026-09-01 -> 2026-09-11 (target 5000) is APPROVED and STARTED with the clock at 2026-09-01, so its status is RUNNING."
            - "Production order PO-1 for 1000 tons is RESERVED against that RUNNING run."
