      - name: reorder_rank_out_of_bounds_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=7]", "errors[ERR_RANK_OUT_OF_BOUNDS]"]
        distinguishing_aspect: "new_rank 0 is outside [1, active_entry_count]; rejected with ERR_RANK_OUT_OF_BOUNDS (422) even with a correct OCC version."
        test_recipe:
          setup: ["scout s, director d; prospect p BOARD_READY; OPEN board b1 with one entry"]
          setup_api_calls:
            - call: "POST /scouting/scouts"
              payload: { full_name: "S", level: "AREA", weight: 1.0, season_grade_mean: 6.00, season_grade_stdev: 1.00 }
