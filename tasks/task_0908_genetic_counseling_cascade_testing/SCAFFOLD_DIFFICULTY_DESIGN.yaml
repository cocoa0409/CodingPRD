          assert:
            - "response data.error_id == ERR_COUNSELOR_DOUBLE_BOOKED"

      - name: lab_aggregate_capacity_exceeded
        grounds:
          - validations[priority=10]
          - entities.Lab.fields.max_concurrent_capacity
          - entities.TestOrder.fields.processing_start
          - entities.TestOrder.fields.processing_end
        distinguishing_aspect: "Lab resource, aggregate-capacity semantics: with max_concurrent_capacity 1, submitting a second order whose processing window overlaps an already-SUBMITTED order is rejected because concurrent occupancy (1) reaches capacity — a count-against-capacity rule, not pairwise buffered adjacency."
