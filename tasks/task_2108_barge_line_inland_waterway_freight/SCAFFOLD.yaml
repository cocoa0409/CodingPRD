  # --- locks ----------------------------------------------------------------
  - method: POST
    path: "/locks"
    description: "Registers a lock chamber. Its id doubles as the LockMaster identity for that chamber."
    roles: [WaterwayAdmin]
    code: 201
    input: ["lock_name", "river_mile", "chamber_capacity_barges", "cycle_minutes", "turnback_buffer_minutes"]
    output: Lock
    side_effects: ["creates Lock in status OPEN with granted_reservation_count 0"]
  - method: POST
    path: "/locks/{lock_id}/set-status"
    description: "Changes the chamber posture. Closing a chamber cancels its live reservations and charges the affected tows a closure delay."
    roles: [LockMaster, WaterwayAdmin]
    code: 200
    input: ["status"]
    output: Lock
    side_effects: ["OPEN <-> RESTRICTED <-> CLOSED per the Lock state machine", "on CLOSED: cancels every REQUESTED and GRANTED reservation on the lock and adds LOCK_CLOSURE_DELAY_MINUTES to each affected Tow, cascading into assignments and contracts", "increments Lock.version by 1"]
  - method: GET
    path: "/locks/{lock_id}"
    description: "Reads one lock."
    roles: [WaterwayAdmin, TariffAnalyst, RateAuthority, TowboatDispatcher, LockMaster, HarborAgent, ContractManager, ClaimsAdjuster, Shipper]
    code: 200
    input: []
    output: Lock
    side_effects: []
  - method: GET
    path: "/locks"
    description: "Lists locks."
    roles: [WaterwayAdmin, TariffAnalyst, RateAuthority, TowboatDispatcher, LockMaster, HarborAgent, ContractManager, ClaimsAdjuster, Shipper]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: Lock[]
    side_effects: []

  # --- lock reservations ----------------------------------------------------
  - method: POST
    path: "/lock-reservations"
    description: "Requests a lockage slot for a tow. The chamber window is sized from the tow's cut count, so the request carries the Tow.version the dispatcher observed."
    roles: [TowboatDispatcher]
    code: 201
    input: ["lock_id", "tow_id", "requested_start_at", "expected_tow_version", "priority_class?"]
    output: LockReservation
    side_effects: ["creates LockReservation in status REQUESTED with cut_count, scheduled_start_at, scheduled_end_at and occupied_until_at from lock_transit_window", "increments Tow.pending_lock_reservation_count by 1", "increments Tow.version by 1"]
  - method: POST
    path: "/lock-reservations/{lock_reservation_id}/grant"
    description: "Grants a requested slot. Only the lockmaster of that chamber may grant."
    roles: [LockMaster]
    code: 200
    input: []
    output: LockReservation
    side_effects: ["REQUESTED -> GRANTED", "increments Lock.granted_reservation_count by 1", "increments LockReservation.version by 1"]
  - method: POST
    path: "/lock-reservations/{lock_reservation_id}/deny"
    description: "Denies a requested slot."
    roles: [LockMaster]
    code: 200
    input: ["reason?"]
    output: LockReservation
    side_effects: ["REQUESTED -> DENIED", "decrements Tow.pending_lock_reservation_count by 1", "increments LockReservation.version by 1"]
  - method: POST
    path: "/lock-reservations/{lock_reservation_id}/reschedule"
    description: "Returns a granted slot to the request queue at a new start time."
    roles: [LockMaster]
    code: 200
    input: ["requested_start_at"]
    output: LockReservation
    side_effects: ["GRANTED -> REQUESTED", "re-pins scheduled_start_at, scheduled_end_at and occupied_until_at", "decrements Lock.granted_reservation_count by 1", "increments LockReservation.version by 1"]
  - method: POST
    path: "/lock-reservations/{lock_reservation_id}/enter-chamber"
    description: "Records the tow entering the chamber."
    roles: [TowboatDispatcher]
    code: 200
    input: ["actual_start_at"]
    output: LockReservation
    side_effects: ["GRANTED -> IN_CHAMBER", "sets actual_start_at", "increments LockReservation.version by 1"]
  - method: POST
    path: "/lock-reservations/{lock_reservation_id}/clear"
    description: "Records the tow clearing the chamber and attributes any lockage delay up the chain."
    roles: [TowboatDispatcher]
    code: 200
    input: ["actual_end_at"]
    output: LockReservation
    side_effects: ["IN_CHAMBER -> CLEARED", "fixes delay_minutes", "adds delay_minutes to Tow.accrued_delay_minutes and may move the tow UNDERWAY -> DELAYED, which then propagates onto its LOADED assignments and their contracts", "decrements Lock.granted_reservation_count and Tow.pending_lock_reservation_count by 1", "increments LockReservation.version by 1"]
  - method: POST
    path: "/lock-reservations/{lock_reservation_id}/cancel"
    description: "Cancels a requested or granted slot from the tow's side."
    roles: [TowboatDispatcher]
    code: 200
    input: []
    output: LockReservation
    side_effects: ["REQUESTED or GRANTED -> CANCELLED", "restores Lock.granted_reservation_count and Tow.pending_lock_reservation_count", "increments LockReservation.version by 1"]
  - method: GET
    path: "/lock-reservations/{lock_reservation_id}"
    description: "Reads one lock reservation including its computed chamber window."
    roles: [WaterwayAdmin, TariffAnalyst, RateAuthority, TowboatDispatcher, LockMaster, HarborAgent, ContractManager, ClaimsAdjuster, Shipper]
    code: 200
    input: []
    output: LockReservation
    side_effects: []
  - method: GET
    path: "/lock-reservations"
    description: "Lists lock reservations by lock, by tow or by status."
    roles: [WaterwayAdmin, TariffAnalyst, RateAuthority, TowboatDispatcher, LockMaster, HarborAgent, ContractManager, ClaimsAdjuster, Shipper]
    code: 200
    input: ["lock_id?", "tow_id?", "status?", "limit?", "offset?"]
    output: LockReservation[]
    side_effects: []

  # --- tows -----------------------------------------------------------------
  - method: POST
    path: "/tows"
    description: "Opens a tow for building."
    roles: [TowboatDispatcher]
    code: 201
    input: ["towboat_name", "horsepower", "origin_mile", "destination_mile", "controlling_gauge_station"]
    output: Tow
    side_effects: ["creates Tow in status BUILDING with barge_count 0, total_loaded_tons 0 and max_draft_feet 0"]
  - method: POST
    path: "/tows/{tow_id}/barge-assignments"
    description: "Adds a loaded barge to a tow against a specific freight contract."
    roles: [TowboatDispatcher]
    code: 201
    input: ["barge_id", "freight_contract_id", "loaded_tons", "cut_position"]
    output: BargeAssignment
    side_effects: ["creates BargeAssignment in status PLANNED and discharge_status NOT_ARRIVED", "recomputes barge_draft_feet, Tow.barge_count, Tow.total_loaded_tons, Tow.max_draft_feet, Tow.draft_restriction_band and Tow.allowed_draft_feet", "increments Tow.version by 1"]
  - method: POST
    path: "/tows/{tow_id}/seal"
    description: "Seals the tow's makeup after the safety, cleanliness, draft and tow-size gates pass."
    roles: [TowboatDispatcher]
    code: 200
    input: []
    output: Tow
    side_effects: ["BUILDING -> SEALED", "every PLANNED assignment -> CONFIRMED", "every barge IDLE or FLEETED -> IN_TOW", "re-pins the draft profile", "increments Tow.version by 1"]
  - method: POST
    path: "/tows/{tow_id}/depart"
    description: "Departs the tow, loading the barges and putting every linked contract in transit."
    roles: [TowboatDispatcher]
    code: 200
    input: ["departed_at"]
    output: Tow
    side_effects: ["SEALED -> UNDERWAY", "every CONFIRMED assignment -> LOADED", "every RESERVED FleetingAssignment of those barges -> RELEASED with released_at set to departed_at and fee_cents fixed", "every linked FreightContract ACTIVE -> IN_TRANSIT", "increments Tow.version by 1"]
  - method: POST
    path: "/tows/{tow_id}/resume"
    description: "Returns a delayed tow to under way without clearing its accrued delay."
    roles: [TowboatDispatcher]
    code: 200
    input: []
    output: Tow
    side_effects: ["DELAYED -> UNDERWAY", "leaves accrued_delay_minutes untouched", "increments Tow.version by 1"]
  - method: POST
    path: "/tows/{tow_id}/arrive"
    description: "Records the tow arriving at the discharge harbor."
    roles: [TowboatDispatcher]
    code: 200
    input: ["arrived_at"]
    output: Tow
    side_effects: ["UNDERWAY or DELAYED -> ARRIVED", "sets arrived_at", "increments Tow.version by 1"]
  - method: POST
    path: "/tows/{tow_id}/break-up"
    description: "Breaks the tow up after every barge has discharged, returning the hulls dirty to the harbor."
    roles: [TowboatDispatcher]
    code: 200
    input: []
    output: Tow
    side_effects: ["ARRIVED -> BROKEN_UP", "every LOADED assignment -> DISCHARGED", "every barge IN_TOW -> IDLE with cleanliness_status DIRTY and last_cargo_commodity_id set to the contract's commodity", "increments Tow.version by 1"]
  - method: POST
    path: "/tows/{tow_id}/adjust-load"
    description: "Light-loads the tow to the current river stage restriction, reducing loaded_tons on every over-draft barge."
    roles: [TowboatDispatcher]
    code: 200
    input: ["expected_tow_version"]
    output: Tow
    side_effects: ["clamps loaded_tons to the band's allowed_tons on every over-draft active assignment in ascending cut_position order", "recomputes barge_draft_feet, Tow.total_loaded_tons and Tow.max_draft_feet", "increments Tow.version by 1 and the version of every assignment touched"]
  - method: GET
    path: "/tows/{tow_id}"
    description: "Reads one tow including its computed draft profile and its version for optimistic concurrency."
    roles: [WaterwayAdmin, TariffAnalyst, RateAuthority, TowboatDispatcher, LockMaster, HarborAgent, ContractManager, ClaimsAdjuster, Shipper]
    code: 200
    input: []
    output: Tow
    side_effects: []
  - method: GET
    path: "/tows"
    description: "Lists tows."
    roles: [WaterwayAdmin, TariffAnalyst, RateAuthority, TowboatDispatcher, LockMaster, HarborAgent, ContractManager, ClaimsAdjuster, Shipper]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: Tow[]
    side_effects: []

  # --- barge assignments ----------------------------------------------------
  - method: POST
    path: "/barge-assignments/{barge_assignment_id}/drop"
    description: "Drops a barge out of a tow before departure, returning its tonnage to the tow's rollup."
    roles: [TowboatDispatcher]
    code: 200
    input: []
    output: BargeAssignment
    side_effects: ["PLANNED or CONFIRMED -> DROPPED", "removes the tonnage from Tow.total_loaded_tons, decrements Tow.barge_count and recomputes Tow.max_draft_feet", "returns the barge to operational_status IDLE", "increments Tow.version by 1"]
  - method: POST
    path: "/barge-assignments/{barge_assignment_id}/record-arrival"
    description: "Tenders the barge at the discharge dock and starts the gross laytime clock."
    roles: [TowboatDispatcher]
    code: 200
    input: ["arrived_at"]
    output: BargeAssignment
    side_effects: ["discharge_status NOT_ARRIVED -> ARRIVED", "sets arrived_at", "increments BargeAssignment.version by 1"]
  - method: POST
    path: "/barge-assignments/{barge_assignment_id}/start-unload"
    description: "Records the start of unloading and starts the net laytime clock."
    roles: [TowboatDispatcher]
    code: 200
    input: ["unload_started_at"]
    output: BargeAssignment
    side_effects: ["discharge_status ARRIVED -> UNLOADING", "sets unload_started_at", "increments BargeAssignment.version by 1"]
  - method: POST
    path: "/barge-assignments/{barge_assignment_id}/finish-unload"
    description: "Records the outturn weight and closes both laytime clocks."
    roles: [TowboatDispatcher]
    code: 200
    input: ["unload_finished_at", "discharged_tons"]
    output: BargeAssignment
    side_effects: ["discharge_status UNLOADING -> COMPLETED", "fixes gross_laytime_hours and net_laytime_hours", "moves the contract IN_TRANSIT -> DISCHARGED once every non-DROPPED assignment of that contract is COMPLETED", "increments BargeAssignment.version by 1"]
  - method: GET
    path: "/barge-assignments/{barge_assignment_id}"
    description: "Reads one barge assignment including both state axes and its laytime figures."
    roles: [WaterwayAdmin, TariffAnalyst, RateAuthority, TowboatDispatcher, LockMaster, HarborAgent, ContractManager, ClaimsAdjuster, Shipper]
    code: 200
    input: []
    output: BargeAssignment
    side_effects: []
  - method: GET
    path: "/barge-assignments"
    description: "Lists barge assignments by tow, by barge, by contract or by either state axis. This is the only channel through which cascade-created assignment state is discoverable."
    roles: [WaterwayAdmin, TariffAnalyst, RateAuthority, TowboatDispatcher, LockMaster, HarborAgent, ContractManager, ClaimsAdjuster, Shipper]
    code: 200
    input: ["tow_id?", "barge_id?", "freight_contract_id?", "status?", "discharge_status?", "limit?", "offset?"]
    output: BargeAssignment[]
    side_effects: []

  # --- freight contracts ----------------------------------------------------
  - method: POST
    path: "/freight-contracts"
    description: "Drafts a freight contract."
    roles: [ContractManager]
    code: 201
    input: ["shipper_id", "commodity_id", "contracted_tons", "origin_mile", "destination_mile", "laytime_hours", "declared_value_cents_per_ton", "claim_settlement_basis?"]
    output: FreightContract
    side_effects: ["creates FreightContract with movement_status DRAFT and billing_status NOT_BILLED"]
  - method: POST
    path: "/freight-contracts/{freight_contract_id}/book"
    description: "Books a drafted contract."
    roles: [ContractManager]
    code: 200
    input: []
    output: FreightContract
    side_effects: ["movement_status DRAFT -> BOOKED", "increments FreightContract.version by 1"]
  - method: POST
    path: "/freight-contracts/{freight_contract_id}/activate"
    description: "Activates a booked contract, pinning the tariff filing, the diesel price and the fuel surcharge percentage that will bill it."
    roles: [ContractManager]
    code: 200
    input: []
    output: FreightContract
    side_effects: ["movement_status BOOKED -> ACTIVE", "pins pinned_tariff_filing_id, pinned_fuel_price_cents_per_gallon and pinned_fuel_surcharge_pct", "sets distance_miles", "increments FreightContract.version by 1"]
  - method: POST
    path: "/freight-contracts/{freight_contract_id}/cancel"
    description: "Cancels a contract that has not yet loaded any barge."
    roles: [ContractManager]
    code: 200
    input: ["reason?"]
    output: FreightContract
    side_effects: ["movement_status -> CANCELLED and billing_status NOT_BILLED -> VOID", "every PLANNED assignment of the contract -> DROPPED, releasing tonnage from its tow", "increments FreightContract.version by 1"]
  - method: POST
    path: "/freight-contracts/{freight_contract_id}/issue-invoice"
    description: "Issues the freight bill using the FINAL variant of every charge rule and posts it to the shipper's balance. Allowed once the contract is IN_TRANSIT or DISCHARGED, provided at least one barge has actually discharged."
    roles: [ContractManager]
    code: 200
    input: ["expected_shipper_version"]
    output: FreightContract
    side_effects: ["billing_status NOT_BILLED -> INVOICED", "fixes linehaul_cents, fuel_surcharge_cents, fleeting_fee_cents, cleaning_fee_cents, demurrage_cents, subtotal_cents, volume_rebate_cents and total_cents", "increases Shipper.outstanding_balance_cents by total_cents and may move Shipper.status ACTIVE -> CREDIT_HOLD", "increments FreightContract.version by 1", "increments Shipper.version by 1"]
  - method: POST
    path: "/freight-contracts/{freight_contract_id}/mark-paid"
    description: "Records payment of the freight bill in full."
    roles: [ContractManager]
    code: 200
    input: ["paid_amount_cents"]
    output: FreightContract
    side_effects: ["billing_status INVOICED or ADJUSTED -> PAID and movement_status DISCHARGED -> CLOSED", "decreases Shipper.outstanding_balance_cents by total_cents and may return Shipper.status CREDIT_HOLD -> ACTIVE", "increments FreightContract.version by 1", "increments Shipper.version by 1"]
  - method: GET
    path: "/freight-contracts/{freight_contract_id}"
    description: "Reads one freight contract including both state axes and every fixed charge bucket."
    roles: [WaterwayAdmin, TariffAnalyst, RateAuthority, TowboatDispatcher, LockMaster, HarborAgent, ContractManager, ClaimsAdjuster, Shipper]
    code: 200
    input: []
    output: FreightContract
    side_effects: []
  - method: GET
    path: "/freight-contracts/{freight_contract_id}/charge-breakdown"
    description: "Computes the charge breakdown on demand. variant selects PROVISIONAL (default) or FINAL; the two variants read different assignment sets, different tonnage fields and different demurrage algorithms and legitimately disagree."
    roles: [WaterwayAdmin, TariffAnalyst, RateAuthority, TowboatDispatcher, LockMaster, HarborAgent, ContractManager, ClaimsAdjuster, Shipper]
    code: 200
    input: ["variant?"]
    output: "{ variant: string, billable_line_count: integer, linehaul_cents: integer, fuel_surcharge_cents: integer, fleeting_fee_cents: integer, cleaning_fee_cents: integer, demurrage_cents: integer, subtotal_cents: integer, volume_rebate_cents: integer, claim_credit_cents: integer, total_cents: integer }"
    side_effects: ["pure read; nothing is persisted and no version is bumped"]
  - method: GET
    path: "/freight-contracts"
    description: "Lists freight contracts by shipper, by commodity, by pinned tariff filing or by either state axis."
    roles: [WaterwayAdmin, TariffAnalyst, RateAuthority, TowboatDispatcher, LockMaster, HarborAgent, ContractManager, ClaimsAdjuster, Shipper]
    code: 200
    input: ["shipper_id?", "commodity_id?", "pinned_tariff_filing_id?", "movement_status?", "billing_status?", "limit?", "offset?"]
    output: FreightContract[]
    side_effects: []

  # --- cargo claims ---------------------------------------------------------
  - method: POST
    path: "/cargo-claims"
    description: "Files a cargo loss, short or contamination claim against one discharged barge."
    roles: [ClaimsAdjuster, Shipper]
    code: 201
    input: ["freight_contract_id", "barge_assignment_id", "claim_type", "claimed_tons", "claimed_amount_cents"]
    output: CargoClaim
    side_effects: ["creates CargoClaim in status SUBMITTED", "increments Shipper.open_claim_count by 1"]
  - method: POST
    path: "/cargo-claims/{cargo_claim_id}/begin-review"
    description: "Opens the adjuster's review."
    roles: [ClaimsAdjuster]
    code: 200
    input: []
    output: CargoClaim
    side_effects: ["SUBMITTED -> UNDER_REVIEW", "increments CargoClaim.version by 1"]
  - method: POST
    path: "/cargo-claims/{cargo_claim_id}/request-info"
    description: "Suspends review pending more information from the claimant."
    roles: [ClaimsAdjuster]
    code: 200
    input: ["info_request_note"]
    output: CargoClaim
    side_effects: ["UNDER_REVIEW -> INFO_REQUESTED", "increments CargoClaim.version by 1"]
  - method: POST
    path: "/cargo-claims/{cargo_claim_id}/resume-review"
    description: "Returns the claim to review after the claimant answers, closing one revision round."
    roles: [ClaimsAdjuster]
    code: 200
    input: ["response_note"]
    output: CargoClaim
    side_effects: ["INFO_REQUESTED -> UNDER_REVIEW", "increments revision_round by 1", "increments CargoClaim.version by 1"]
  - method: POST
    path: "/cargo-claims/{cargo_claim_id}/assess"
    description: "Assesses the claim, computing and storing BOTH settlement variants and recording the assessor identity."
    roles: [ClaimsAdjuster]
    code: 200
    input: []
    output: CargoClaim
    side_effects: ["UNDER_REVIEW -> ASSESSED", "fixes shortage_tons, tolerance_tons, settlement_deductible_cents and settlement_franchise_cents", "sets assessed_by_user_id", "increments CargoClaim.version by 1"]
  - method: POST
    path: "/cargo-claims/{cargo_claim_id}/approve"
    description: "Approves an assessed claim. The approver must not be the assessor."
    roles: [ClaimsAdjuster]
    code: 200
    input: []
    output: CargoClaim
    side_effects: ["ASSESSED -> APPROVED", "selects settlement_cents by the contract's claim_settlement_basis", "credits the contract, moving billing_status INVOICED -> ADJUSTED and recomputing total_cents", "reduces Shipper.outstanding_balance_cents and may return the shipper CREDIT_HOLD -> ACTIVE", "moves the named BargeAssignment discharge_status COMPLETED -> DISPUTED", "increments CargoClaim.version, FreightContract.version and Shipper.version by 1"]
  - method: POST
    path: "/cargo-claims/{cargo_claim_id}/deny"
    description: "Denies an assessed claim. The denier must not be the assessor."
    roles: [ClaimsAdjuster]
    code: 200
    input: ["denial_reason"]
    output: CargoClaim
    side_effects: ["ASSESSED -> DENIED", "leaves settlement_cents at 0 and the contract's billing untouched", "decrements Shipper.open_claim_count by 1", "increments CargoClaim.version by 1"]
  - method: POST
    path: "/cargo-claims/{cargo_claim_id}/withdraw"
    description: "Withdraws a claim before it is assessed."
    roles: [ClaimsAdjuster, Shipper]
    code: 200
    input: []
    output: CargoClaim
    side_effects: ["SUBMITTED, UNDER_REVIEW or INFO_REQUESTED -> WITHDRAWN", "decrements Shipper.open_claim_count by 1", "increments CargoClaim.version by 1"]
  - method: GET
    path: "/cargo-claims/{cargo_claim_id}"
    description: "Reads one cargo claim including both stored settlement variants."
    roles: [WaterwayAdmin, TariffAnalyst, RateAuthority, TowboatDispatcher, LockMaster, HarborAgent, ContractManager, ClaimsAdjuster, Shipper]
    code: 200
    input: []
    output: CargoClaim
    side_effects: []
  - method: GET
    path: "/cargo-claims"
    description: "Lists cargo claims by contract, by assignment or by status."
    roles: [WaterwayAdmin, TariffAnalyst, RateAuthority, TowboatDispatcher, LockMaster, HarborAgent, ContractManager, ClaimsAdjuster, Shipper]
    code: 200
    input: ["freight_contract_id?", "barge_assignment_id?", "status?", "limit?", "offset?"]
    output: CargoClaim[]
    side_effects: []

# ---------------------------------------------------------------------------
# 1.6 Error Code Catalog
# ---------------------------------------------------------------------------
errors:
  # authentication / authorization
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header absent, or X-User-Role names no declared role"
  - id: ERR_FORBIDDEN_ROLE
    http: 403
    condition: "the caller's role is not listed on the endpoint"
  - id: ERR_NOT_RESOURCE_OWNER
    http: 403
    condition: "an entity_backed caller acts on a resource it does not own - a LockMaster on another chamber's reservation, or a Shipper on another shipper's contract or claim"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "the acting X-User-ID equals the identity recorded for the preceding step - the tariff filer at effectuation, or the claim assessor at approval or denial"

  # request shape
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "a required body field is missing, an enum value is not a declared member, a numeric field violates its range, or a datetime does not parse"
  - id: ERR_INVALID_PAGINATION
    http: 400
    condition: "limit is outside [1, 100] or offset is negative"

  # existence
  - id: ERR_SHIPPER_NOT_FOUND
    http: 404
    condition: "no Shipper with the given id"
  - id: ERR_COMMODITY_NOT_FOUND
    http: 404
    condition: "no Commodity with the given id"
  - id: ERR_TARIFF_FILING_NOT_FOUND
    http: 404
    condition: "no TariffFiling with the given id"
  - id: ERR_BARGE_NOT_FOUND
    http: 404
    condition: "no Barge with the given id"
  - id: ERR_CLEANING_ORDER_NOT_FOUND
    http: 404
    condition: "no CleaningOrder with the given id"
  - id: ERR_FLEETING_BERTH_NOT_FOUND
    http: 404
    condition: "no FleetingBerth with the given id"
  - id: ERR_FLEETING_ASSIGNMENT_NOT_FOUND
    http: 404
    condition: "no FleetingAssignment with the given id"
  - id: ERR_LOCK_NOT_FOUND
    http: 404
    condition: "no Lock with the given id"
  - id: ERR_LOCK_RESERVATION_NOT_FOUND
    http: 404
    condition: "no LockReservation with the given id"
  - id: ERR_TOW_NOT_FOUND
    http: 404
    condition: "no Tow with the given id"
  - id: ERR_BARGE_ASSIGNMENT_NOT_FOUND
    http: 404
    condition: "no BargeAssignment with the given id"
  - id: ERR_FREIGHT_CONTRACT_NOT_FOUND
    http: 404
    condition: "no FreightContract with the given id"
  - id: ERR_CARGO_CLAIM_NOT_FOUND
    http: 404
    condition: "no CargoClaim with the given id"

  # state preconditions
  - id: ERR_TARIFF_FILING_INVALID_STATE
    http: 409
    condition: "file called on a filing that is not DRAFT, or effectuate called on a filing that is not FILED"
  - id: ERR_BARGE_NOT_AVAILABLE
    http: 409
    condition: "the barge's operational_status forbids the operation - fleeting a barge that is not IDLE, assigning a barge that is OUT_OF_SERVICE, or starting a cleaning on a barge that is IN_TOW or FLEETED"
  - id: ERR_CLEANING_ORDER_INVALID_STATE
    http: 409
    condition: "start called on an order that is neither ORDERED nor FAILED_INSPECTION, or complete called on an order that is not IN_PROGRESS"
  - id: ERR_FLEETING_ASSIGNMENT_INVALID_STATE
    http: 409
    condition: "release or cancel called on an assignment that is not RESERVED"
  - id: ERR_LOCK_RESERVATION_INVALID_STATE
    http: 409
    condition: "a reservation transition is requested from a state the state machine does not allow"
  - id: ERR_TOW_INVALID_STATE
    http: 409
    condition: "a tow transition is requested from a state the state machine does not allow, including sealing a tow with barge_count 0"
  - id: ERR_BARGE_ASSIGNMENT_INVALID_STATE
    http: 409
    condition: "a makeup or discharge transition is requested from a state the assignment is not in"
  - id: ERR_CONTRACT_MOVEMENT_INVALID_STATE
    http: 409
    condition: "a movement transition is requested from a movement_status the contract is not in, including assigning a barge to a contract that is not ACTIVE or IN_TRANSIT"
  - id: ERR_CONTRACT_BILLING_INVALID_STATE
    http: 409
    condition: "issue-invoice on a contract whose billing_status is not NOT_BILLED, or mark-paid on a contract whose billing_status is neither INVOICED nor ADJUSTED"
  - id: ERR_CLAIM_INVALID_STATE
    http: 409
    condition: "a claim transition is requested from a status the claim is not in"

  # optimistic concurrency
  - id: ERR_STALE_TOW_VERSION
    http: 412
    condition: "expected_tow_version does not match the tow's current version"
  - id: ERR_STALE_SHIPPER_VERSION
    http: 412
    condition: "expected_shipper_version does not match the shipper's current version"

  # safety / compatibility
  - id: ERR_CARGO_INCOMPATIBLE
    http: 422
    condition: "the CompatibilityRule for the barge's prior cargo group and the contract's commodity group is marked prohibited"
  - id: ERR_BARGE_CLEANLINESS_INSUFFICIENT
    http: 422
    condition: "the barge's cleanliness rank is below the level the prior-cargo matrix requires for the next commodity"
  - id: ERR_DRAFT_EXCEEDS_RESTRICTION
    http: 422
    condition: "the tow's max_draft_feet exceeds the controlling river stage band's max_draft_feet"
  - id: ERR_TOW_SIZE_CAP_EXCEEDED
    http: 422
    condition: "the tow's barge_count exceeds the controlling river stage band's tow_size_cap_barges"
  - id: ERR_BARGE_CAPACITY_EXCEEDED
    http: 422
    condition: "loaded_tons exceeds the barge's capacity_tons"

  # temporal / windowing
  - id: ERR_NO_RIVER_STAGE_READING
    http: 422
    condition: "no RiverStageReading for the tow's controlling_gauge_station is dated at or before the logical clock"
  - id: ERR_NO_EFFECTIVE_TARIFF
    http: 422
    condition: "no EFFECTIVE TariffFiling for the contract's commodity group covers the logical clock"
  - id: ERR_NO_FUEL_INDEX_POSTING
    http: 422
    condition: "no FuelIndexPosting has posting_date at or before the logical clock date"
  - id: ERR_TARIFF_WINDOW_OVERLAP
    http: 409
    condition: "effectuating the filing would leave two EFFECTIVE filings for the same commodity group with overlapping effective windows"
  - id: ERR_LOCK_WINDOW_CONFLICT
    http: 409
    condition: "the requested chamber window overlaps the buffered window of another GRANTED or IN_CHAMBER reservation on the same lock"
  - id: ERR_BERTH_CAPACITY_EXCEEDED
    http: 409
    condition: "berth occupancy would exceed capacity_barges at some instant inside the requested interval"
  - id: ERR_UNLOAD_SEQUENCE_INVALID
    http: 422
    condition: "a supplied instant precedes the instant it must follow - unload start before tender, unload finish before start, release before reservation start, chamber clear before chamber entry, or arrival before departure"
  - id: ERR_CLAIM_WINDOW_EXPIRED
    http: 422
    condition: "the logical clock is more than CLAIM_FILING_WINDOW_DAYS past the assignment's unload_finished_at"

  # structural constraints
  - id: ERR_LOCK_CLOSED
    http: 409
    condition: "a reservation is requested, granted or entered at a lock whose status is CLOSED"
  - id: ERR_DUPLICATE_CUT_POSITION
    http: 409
    condition: "another non-DROPPED assignment of the same tow already occupies the cut_position"
  - id: ERR_BARGE_ALREADY_ASSIGNED
    http: 409
    condition: "the barge already holds a PLANNED, CONFIRMED or LOADED assignment on some tow"
  - id: ERR_DUPLICATE_HULL_NUMBER
    http: 409
    condition: "hull_number is already registered on another Barge, or code is already registered on another Commodity"
  - id: ERR_CLAIM_ALREADY_FILED
    http: 409
    condition: "a claim that is neither WITHDRAWN nor DENIED already exists for the named barge assignment"
  - id: ERR_CLAIM_REVISION_LIMIT
    http: 409
    condition: "request-info is called when revision_round has already reached MAX_CLAIM_REVISION_ROUNDS"

  # referential
  - id: ERR_ASSIGNMENT_CONTRACT_MISMATCH
    http: 409
    condition: "the named barge assignment belongs to a different freight contract than the claim"
  - id: ERR_SHORTAGE_NOT_SUPPORTED
    http: 422
    condition: "a SHORTAGE claim asks for more tons than the outturn shortfall, or the named assignment has not completed discharge"
  - id: ERR_NO_BILLABLE_LINES
    http: 422
    condition: "issue-invoice is called on a contract with no assignment in discharge_status COMPLETED or DISPUTED"

  # fiscal
  - id: ERR_SHIPPER_ON_CREDIT_HOLD
    http: 409
    condition: "activation is attempted for a shipper whose status is CREDIT_HOLD"
  - id: ERR_SHIPPER_CREDIT_EXCEEDED
    http: 402
    condition: "the projected charge would push the shipper's outstanding balance past its credit limit"
  - id: ERR_PAYMENT_AMOUNT_MISMATCH
    http: 422
    condition: "paid_amount_cents does not equal the contract's total_cents"

# ---------------------------------------------------------------------------
# 1.7 RBAC Matrix
# ---------------------------------------------------------------------------
roles:
  - name: WaterwayAdmin
    description: "Shore-side reference-data administrator. Owns commodities, the prior-cargo compatibility matrix, hulls, berths, chambers, gauge readings and the logical clock."
    identity: opaque
    exclusive_operations:
      - "POST /_clock/set_current_utc"
      - "POST /commodities"
      - "POST /compatibility-rules"
      - "POST /river-stage-readings"
      - "POST /barges"
      - "POST /fleeting-berths"
      - "POST /locks"
    shared_operations:
      - "POST /locks/{lock_id}/set-status (shared with LockMaster, without the ownership restriction)"
      - "every GET endpoint"

  - name: TariffAnalyst
    description: "Drafts tariff filings and posts the diesel index. May never make its own filing effective."
    identity: opaque
    exclusive_operations:
      - "POST /tariff-filings"
      - "POST /tariff-filings/{tariff_filing_id}/file"
      - "POST /fuel-index-postings"
    shared_operations:
      - "every GET endpoint"

  - name: RateAuthority
    description: "Makes filed tariffs effective. Separation of duties: the acting X-User-ID must differ from the filing's filed_by_user_id."
    identity: opaque
    exclusive_operations:
      - "POST /tariff-filings/{tariff_filing_id}/effectuate"
    shared_operations:
      - "every GET endpoint"

  - name: TowboatDispatcher
    description: "Builds tows, assigns barges by commodity, light-loads to the river stage, moves tows, requests lockages and records discharge events."
    identity: opaque
    exclusive_operations:
      - "POST /tows"
      - "POST /tows/{tow_id}/barge-assignments"
      - "POST /tows/{tow_id}/seal"
      - "POST /tows/{tow_id}/depart"
      - "POST /tows/{tow_id}/resume"
      - "POST /tows/{tow_id}/arrive"
      - "POST /tows/{tow_id}/break-up"
      - "POST /tows/{tow_id}/adjust-load"
      - "POST /barge-assignments/{barge_assignment_id}/drop"
      - "POST /barge-assignments/{barge_assignment_id}/record-arrival"
      - "POST /barge-assignments/{barge_assignment_id}/start-unload"
      - "POST /barge-assignments/{barge_assignment_id}/finish-unload"
      - "POST /lock-reservations"
      - "POST /lock-reservations/{lock_reservation_id}/enter-chamber"
      - "POST /lock-reservations/{lock_reservation_id}/clear"
      - "POST /lock-reservations/{lock_reservation_id}/cancel"
    shared_operations:
      - "every GET endpoint"

  - name: LockMaster
    description: "Operates one lock chamber. X-User-ID is the id of the Lock the caller masters; grant, deny, reschedule and set-status are refused for any other chamber."
    identity: "entity_backed:Lock"
    exclusive_operations:
      - "POST /lock-reservations/{lock_reservation_id}/grant"
      - "POST /lock-reservations/{lock_reservation_id}/deny"
      - "POST /lock-reservations/{lock_reservation_id}/reschedule"
    shared_operations:
      - "POST /locks/{lock_id}/set-status (shared with WaterwayAdmin; restricted to the caller's own chamber)"
      - "every GET endpoint"

  - name: HarborAgent
    description: "Runs the fleeting harbor and the wash rack: berth reservations, releases, cancellations and cleaning orders."
    identity: opaque
    exclusive_operations:
      - "POST /fleeting-assignments"
      - "POST /fleeting-assignments/{fleeting_assignment_id}/release"
      - "POST /fleeting-assignments/{fleeting_assignment_id}/cancel"
      - "POST /barges/{barge_id}/cleaning-orders"
      - "POST /cleaning-orders/{cleaning_order_id}/start"
      - "POST /cleaning-orders/{cleaning_order_id}/complete"
    shared_operations:
      - "every GET endpoint"

  - name: ContractManager
    description: "Owns shipper accounts and the freight contract lifecycle including billing."
    identity: opaque
    exclusive_operations:
      - "POST /shippers"
      - "POST /freight-contracts"
      - "POST /freight-contracts/{freight_contract_id}/book"
      - "POST /freight-contracts/{freight_contract_id}/activate"
      - "POST /freight-contracts/{freight_contract_id}/cancel"
      - "POST /freight-contracts/{freight_contract_id}/issue-invoice"
      - "POST /freight-contracts/{freight_contract_id}/mark-paid"
    shared_operations:
      - "every GET endpoint"

  - name: ClaimsAdjuster
    description: "Handles cargo loss and short claims end to end. Separation of duties: the X-User-ID that assessed a claim may neither approve nor deny it."
    identity: opaque
    exclusive_operations:
      - "POST /cargo-claims/{cargo_claim_id}/begin-review"
      - "POST /cargo-claims/{cargo_claim_id}/request-info"
      - "POST /cargo-claims/{cargo_claim_id}/resume-review"
      - "POST /cargo-claims/{cargo_claim_id}/assess"
      - "POST /cargo-claims/{cargo_claim_id}/approve"
      - "POST /cargo-claims/{cargo_claim_id}/deny"
    shared_operations:
      - "POST /cargo-claims (shared with Shipper)"
      - "POST /cargo-claims/{cargo_claim_id}/withdraw (shared with Shipper)"
      - "every GET endpoint"

  - name: Shipper
    description: "The customer account. X-User-ID is the id of a Shipper row; the shipper may only file, withdraw or read claims and contracts whose shipper_id equals its own id."
    identity: "entity_backed:Shipper"
    exclusive_operations: []
    shared_operations:
      - "POST /cargo-claims (shared with ClaimsAdjuster; restricted to own contracts)"
      - "POST /cargo-claims/{cargo_claim_id}/withdraw (shared with ClaimsAdjuster; restricted to own claims)"
      - "every GET endpoint"
