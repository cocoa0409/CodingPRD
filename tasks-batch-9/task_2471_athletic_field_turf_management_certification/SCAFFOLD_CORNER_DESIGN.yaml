            - "GET /turf/fields/${f_ng} returns data.cumulative_wear_units == 4.32, data.rest_debt_hours == 0.00 and data.play_status == \"OPEN\" - no rest window was opened, so the field is not RESTRICTED"
            - "GET /turf/fields/${f_ng} returns data.usage_hours_ytd == 0.00 - only bookings with status PLAYED contribute usage hours"

      - name: field_cumulative_wear_units_is_a_chronological_running_balance
        claim_type: aggregation
        grounds:
          - calculations.field_cumulative_wear_units
          - entities.UsageLedgerEntry
          - entities.Field
        distinguishing_aspect: "Two PLAY_WEAR entries land on one field in ascending effective_at_utc order, so running_balance_after must read 8.64 then 12.29 while Field.cumulative_wear_units equals the full sum 12.29. An implementation that stamps each entry with only its own delta reports 8.64 and 3.65; one that replays in descending order reports 3.65 and 12.29; one that re-sums with a status filter on the parent booking drops entries entirely."
        test_recipe:
          setup:
            - "Empty database; the logical clock sits at its mandatory default 2026-08-01T00:00:00Z unless a POST /_clock/set_current_utc call below moves it forward."
            - "The setup_api_calls chain below is the authoritative, executable statement of this precondition - every fixture value is a literal and every id is captured from a prior response."
          setup_api_calls:
            - call: "POST /turf/staff-members"
              payload: { full_name: "Dana Reyes", roles: ["FacilitiesDirector"] }
