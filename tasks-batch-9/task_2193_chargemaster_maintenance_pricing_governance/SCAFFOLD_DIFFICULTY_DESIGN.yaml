  - name: resource_temporal_overlap__payer_contract_closed_abut_collides_then_exact_notice_gap_buffer_violation
    grounds:
    - validations[priority=35]
    - validations[priority=36]
    - entities.PayerContract.fields.term_start_date
    - entities.PayerContract.fields.term_end_date
    - entities.PayerContract.fields.renegotiation_notice_days
    distinguishing_aspect: 'PayerContract occupation on the (facility_id, payer_code, product_line) resource uses

      CLOSED [term_start_date, term_end_date] interval semantics PLUS a notice-buffer margin,

      so term_start_date == prior.term_end_date COLLIDES (ERR_CONTRACT_TERM_OVERLAP, the

      opposite verdict from the half-open PriceRule rule) and a clear gap of exactly

      renegotiation_notice_days = 30 days still fails with ERR_CONTRACT_TERM_BUFFER_VIOLATION

      because the buffer requires a STRICTLY greater gap.

      '
    test_recipe:
      setup:
      - Logical clock set to 2026-01-15T00:00:00Z so the prior term is still ACTIVE (not auto-EXPIRED by the clock endpoint).
      - One OPEN facility.
      - One ACTIVE PayerContract C1 on scope (facility, BCBS_STATE, COMMERCIAL) with closed term [2026-01-01T00:00:00Z, 2026-06-30T00:00:00Z] and renegotiation_notice_days = 30.
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-01-15T00:00:00Z'
        as: SystemAdmin
        as_user_id: sysadmin_1
      - call: POST /chargemaster/facilities
        payload:
          name: St Vitus Medical Center
