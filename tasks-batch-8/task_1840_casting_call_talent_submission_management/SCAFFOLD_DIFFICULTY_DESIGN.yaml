              as: CastingDirector
          assert:
            - "Breakdown.${br_id}.status == CANCELLED"
            - "Submission.${sub_id}.status == WITHDRAWN (depth-1)"
            - "AvailabilityHold.${hold_id}.status == RELEASED (depth-2: caused by submission withdrawal)"

  # ==========================================================================
  # Rule 5 — priority_pair_validation_conflict (two DIFFERENT error-category pairs)
  # ==========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_vs_business_safety_on_offer_accept
        grounds:
          - validations[priority=5]
          - validations[priority=7]
          - errors[ERR_INVALID_STATE]
          - errors[ERR_PERMIT_REQUIRED]
        distinguishing_aspect: |
          Category pair (state, business_safety): an offer-accept that BOTH
          targets a non-EXTENDED offer (state violation) AND is for a minor role
          lacking a verified permit (safety violation) must return the
          higher-priority state error ERR_INVALID_STATE, not ERR_PERMIT_REQUIRED.
        test_recipe:
          setup:
            - "Minor-role submission advanced to OFFER_PENDING; offer then WITHDRAWN (state violation); no permit registered (safety violation also true)"
          setup_api_calls:
            - { call: "POST /casting/_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T00:00:00Z" }, as: CastingDirector }
            - call: "POST /casting/productions"
              payload: { title: "PP", production_type: "FILM", union_signatory: false, shoot_city: "LA", shoot_state: "CA", start_date: "2026-08-01T00:00:00Z", wrap_date: "2026-09-30T00:00:00Z", casting_office_id: "office-1" }
              as: CastingDirector
              captures: { prod_id: $.data.id }
            - call: "POST /casting/productions/${prod_id}/roles"
              payload: { character_name: "PR", is_minor_role: true, is_union_covered: false, engagement_start: "2026-08-20T00:00:00Z", engagement_end: "2026-08-22T00:00:00Z" }
              as: CastingDirector
              captures: { role_id: $.data.id }
            - call: "POST /casting/productions/${prod_id}/breakdowns"
              payload: { role_id: "${role_id}", distribution: "OPEN_CALL", submission_deadline: "2026-09-01T00:00:00Z", rate_weekly_cents: 1000000 }
              as: CastingDirector
              captures: { br_id: $.data.id }
            - call: "POST /casting/breakdowns/${br_id}/release"
              payload: { distribution: "OPEN_CALL" }
              as: CastingDirector
              captures: { br_v: $.data.version }
            - call: "POST /casting/talents"
              payload: { full_name: "PT", date_of_birth: "2012-01-01T00:00:00Z", union_status: "NON_UNION" }
              as: CastingDirector
              captures: { tal_id: $.data.id }
            - call: "POST /casting/breakdowns/${br_id}/submissions"
              payload: { talent_id: "${tal_id}", expected_breakdown_version: "${br_v}" }
              as: CastingAssociate
              captures: { sub_id: $.data.id }
            - call: "POST /casting/submissions/${sub_id}/start-review"
              payload: {}
              as: CastingAssociate
            - call: "POST /casting/submissions/${sub_id}/shortlist"
              payload: {}
              as: CastingAssociate
            - call: "POST /casting/breakdowns/${br_id}/sessions"
              payload: { session_start: "2026-08-04T09:00:00Z", session_end: "2026-08-04T12:00:00Z", capacity: 4, location: "Studio 1" }
              as: CastingAssociate
              captures: { sess_id: $.data.id }
            - call: "POST /casting/sessions/${sess_id}/appointments"
              payload: { submission_id: "${sub_id}", slot_start: "2026-08-04T09:00:00Z", slot_end: "2026-08-04T09:30:00Z" }
              as: CastingAssociate
              captures: { appt_id: $.data.id }
            - call: "POST /casting/appointments/${appt_id}/confirm"
              payload: {}
              as: CastingAssociate
            - call: "POST /casting/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-04T13:00:00Z" }
              as: CastingDirector
            - call: "POST /casting/appointments/${appt_id}/complete"
              payload: {}
              as: CastingAssociate
            - call: "POST /casting/submissions/${sub_id}/offers"
              payload: { weekly_rate_cents: 1000000, guarantee_cents: 800000, expires_at: "2026-08-20T00:00:00Z" }
              as: CastingDirector
              captures: { offer_id: $.data.id }
            # withdraw the offer so it leaves EXTENDED (state violation on accept)
            - call: "POST /casting/offers/${offer_id}/withdraw"
              payload: {}
              as: CastingDirector
          trigger:
            - call: "POST /casting/offers/${offer_id}/accept"
              payload: { engagement_start: "2026-08-20T00:00:00Z", engagement_end: "2026-08-22T00:00:00Z", proration_mode: "CALENDAR_SPAN" }
              as: CastingDirector
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE (priority-5 state beats priority-7 business_safety, NOT ERR_PERMIT_REQUIRED)"
            - "http_status == 409"

      - name: business_referential_vs_business_temporal_on_hold_create
        grounds:
          - validations[priority=9]
          - validations[priority=13]
          - errors[ERR_HOLD_TALENT_MISMATCH]
          - errors[ERR_INVALID_WINDOW]
        distinguishing_aspect: |
          Different category pair (business_referential, business_temporal): a
          hold creation that BOTH mismatches the submission's talent
          (referential) AND has window_start >= window_end (temporal) must
          return the higher-priority referential error ERR_HOLD_TALENT_MISMATCH,
