  - section: rbac
    instances:
      - name: corner_rbac_unknown_role_header_unauthenticated
        claim_type: Cannot perform other roles' exclusive_operations → ERR_UNAUTHORIZED
        grounds:
          - validations[priority=1]
          - errors[ERR_UNAUTHENTICATED]
        distinguishing_aspect: |
          A request whose X-User-Role is not one of the five declared roles fails at priority 1
          with ERR_UNAUTHENTICATED (401), before any role-membership or existence check, so an
          undeclared role never even reaches the endpoint's roles list.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; season S7 LIVE."
            - "The role string GameJournalist is not declared in the RBAC table."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: LiveOpsCommander
            - call: "POST /seasons"
              payload: { code: "S7", title: "Season 7 Tidebreak", starts_at: "2026-08-01T00:00:00Z", ends_at: "2026-10-30T00:00:00Z", planned_episode_count: 6, target_xp_total: 9000, pass_price_minor: 1000 }
              as: ContentProducer
              captures: { season_id: $.data.id }
            - call: "POST /seasons/${season_id}/status"
              payload: { to_status: "LIVE" }
              as: ContentProducer
          trigger:
            - call: "GET /seasons/${season_id}"
              payload: {}
              as: GameJournalist
              as_user_id: "u_press_1"
              captures: { err: $.data.error_id }
          assert:
            - "response status == 401"
            - "response data.error_id == ERR_UNAUTHENTICATED"
            - "response data.error_id != ERR_UNAUTHORIZED"

