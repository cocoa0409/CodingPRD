      - name: plan_activation_and_supersession_both_hinge_on_the_target_access_state
        grounds:
          - state_machines.AccessConversionPlan.DRAFT_to_ACTIVE
          - state_machines.AccessConversionPlan.DRAFT_to_ABANDONED
          - errors.ERR_TARGET_ACCESS_NOT_CONVERTIBLE
          - entities.VascularAccess.fields.predecessor_access_id
        distinguishing_aspect: |
          Activation is gated on a second entity's state - the target access must be PLANNED,
          PLACED or MATURING - so a plan aimed at an already IN_USE fistula is rejected with
          ERR_TARGET_ACCESS_NOT_CONVERTIBLE while the plan row itself is flawless. Creating a
          replacement plan on the SAME from_access then supersedes the first (DRAFT -> ABANDONED)
          without any call naming plan 1, and activating the replacement writes
          predecessor_access_id onto the target. Three entities therefore constrain one another
          with no shared payload field.
        test_recipe:
          setup:
            - "one patient with a TUNNELED_CATHETER in IN_USE, an AVF #1 walked all the way to IN_USE, and an AVF #2 left in PLANNED"
            - "plan 1 created from the catheter targeting the IN_USE AVF #1"
          setup_api_calls:
