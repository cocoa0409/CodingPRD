            - call: "POST /eoir/cases/${case_id}/assign-judge"
              payload: { judge_id: "${judge_a}" }
              as: CourtAdministrator
              as_user_id: "admin-01"
            - call: "POST /eoir/cases/${case2}/assign-judge"
              payload: { judge_id: "${judge_a}" }
              as: CourtAdministrator
              as_user_id: "admin-01"
              captures: { err2: $.data.error_id }
            - call: "POST /eoir/cases/${case_id}/assign-judge"
              payload: { judge_id: "${judge_a}" }
              as: CourtAdministrator
              as_user_id: "admin-01"
              captures: { err3: $.data.error_id }
          assert:
            - "assigning judge B (wrong court) fails 409 ERR_JUDGE_WRONG_COURT and the case stays FILED"
            - "assigning judge A succeeds (case CALENDAR, load 1)"
            - "assigning the second case to judge A fails 409 ERR_JUDGE_CASELOAD_FULL (load 1 >= cap 1: the cap comparison is strict)"
            - "re-assigning the first case fails 409 ERR_CASE_NOT_AWAITING_DOCKET (it is CALENDAR, not FILED)"

      - name: reassignment_guard_family_rejected
        claim_type: Violation → Error
        grounds:
          - errors.ERR_COURT_NOT_BACKLOG_CRITICAL
          - errors.ERR_DETAINED_NOT_REASSIGNABLE
          - calculations.backlog_critical_flag
        distinguishing_aspect: "Reassignment has two independent admission gates: the source court must be backlog-critical (flag formula: pending >= ceil(0.25 * goal)) AND the case must be non-detained — each is shown failing alone."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01. Court N (goal 100, one non-detained pending case — NOT critical) and court C (goal 4, one DETAINED pending case — critical at 1 >= ceil(0.25*4))."
          setup_api_calls:
            - *c_clock
            - call: "POST /eoir/courts"
              payload: { court_code: "CT-GN", name: "Calm Court", city: "Omaha", annual_completion_goal: 100, detained_daily_hearing_capacity: 1 }
              as: CourtAdministrator
