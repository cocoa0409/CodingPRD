# SCAFFOLD_CORNER_DESIGN.yaml
# Task 2816 - Postdoctoral Appointment & Visa Administration
#
# Section 1.9 breadth probe. Every claim the scaffold's 1.1-1.7 surface declares
# that SCAFFOLD_DIFFICULTY_DESIGN.yaml (1.8) does not already assert. Sections and
# claim_type values are taken verbatim from
# skills/prd-bench-scaffold-generator/references/claim-extraction-guide.md.
# Corners already covered by a 1.8 instance appear as excluded_because stubs with
# no test_recipe.

scaffold_corner_design:

  - section: entities
    instances:

      - name: postdoc_creation_returns_declared_defaults_and_a_zero_rank_ledger
        claim_type: creation
        grounds:
          - endpoints.POST /postdocs
          - entities.Postdoc
          - response_envelope.success
        distinguishing_aspect: "All five required inputs supplied -> 201 with every declared Postdoc field present, status seeded PROSPECTIVE, total_months_in_rank computed to 0, and the success envelope carrying meta.api_request_id plus response_type object."
        test_recipe:
          setup:
            - "Empty database. No prior postdocs."
          setup_api_calls: []
          trigger:
            - call: "POST /postdocs"
              payload: { full_name: "Anya Krylova", email: "anya.k@example.edu", citizenship_country: "RU", requires_sponsorship: true, phd_award_date: "2026-03-20", prior_external_months_in_rank: 6, o1_endorsement_on_file: false, j1_two_year_bar_flag: false, restricted_party_flag: false }
              as: PostdocAffairsOfficer
              as_user_id: "officer_pa_20"
              captures: { p20_id: "$.data.id", p20_status: "$.data.status", p20_total: "$.data.total_months_in_rank" }
          assert:
            - "response http_status == 201"
            - "response_type == object"
            - "meta.api_request_id is a non-empty string"
            - "${p20_status} == PROSPECTIVE"
            - "${p20_total} == 0"
            - "Postdoc.${p20_id}.citizenship_country == RU"
            - "Postdoc.${p20_id}.requires_sponsorship == true"
            - "Postdoc.${p20_id}.prior_external_months_in_rank == 6"
            - "Postdoc.${p20_id}.version == 1"

      - name: funding_source_retrieval_exposes_the_untouched_award_ledger
        claim_type: retrieval
        grounds:
          - endpoints.GET /funding-sources/{id}
          - entities.FundingSource.fields.encumbered_usd
          - entities.FundingSource.fields.available_balance_usd
        distinguishing_aspect: "A freshly created award reads back UNVERIFIED with verified_at and verified_by_user_id null, encumbered_usd 0.00, and available_balance_usd equal to annual_budget_usd - so the derived balance is present from creation and not only after the first encumbrance."
        test_recipe:
          setup:
            - "One FOUNDATION_GRANT award created and left unverified."
          setup_api_calls:
            - call: "POST /funding-sources"
              payload: { sponsor_name: "Wellcome Trust W-2000", funding_type: "FOUNDATION_GRANT", salary_floor_policy: "INSTITUTIONAL_MIN", award_start_date: "2026-09-01", award_end_date: "2027-12-31", annual_budget_usd: 250000.00 }
              as: PostdocAffairsOfficer
              as_user_id: "officer_pa_20"
              captures: { f20_id: "$.data.id" }
          trigger:
            - call: "GET /funding-sources/${f20_id}"
              payload: {}
              as: HRCompensationApprover
              captures: { f20_vs: "$.data.verification_status", f20_enc: "$.data.encumbered_usd", f20_avail: "$.data.available_balance_usd", f20_verified_at: "$.data.verified_at" }
          assert:
            - "response http_status == 200"
            - "${f20_vs} == UNVERIFIED"
            - "${f20_enc} == 0.00"
            - "${f20_avail} == 250000.00"
            - "${f20_verified_at} == null"
            - "FundingSource.${f20_id}.requires_mentoring_plan == false"
            - "FundingSource.${f20_id}.requires_idp == false"

      - name: appointment_listing_pages_with_limit_offset_total_count_and_has_more
        claim_type: listing
        grounds:
          - endpoints.GET /appointments
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
        distinguishing_aspect: "Three appointments exist; limit 2 offset 0 returns 2 rows with total_count 3 and has_more true, while limit 2 offset 2 returns the remaining 1 row with has_more false. total_count is the unpaged count, not the page length, and it is unaffected by the offset."
        test_recipe:
          setup:
            - "One mentor with valid training and one VERIFIED NIH_SCALE FEDERAL_GRANT (600000.00, 2026-09-01 to 2027-12-31)."
            - "Three scholars, each with exactly one DRAFT appointment 2026-10-01 to 2027-09-30 at 62000.00."
          setup_api_calls:
            - call: "POST /faculty-mentors"
              payload: { full_name: "N. Abebe", department: "Public Health", mentor_training_valid_through: "2029-09-30", max_concurrent_postdocs: 3 }
              as: PostdocAffairsOfficer
              as_user_id: "officer_pa_21"
              captures: { m21_id: "$.data.id" }
            - call: "POST /funding-sources"
              payload: { sponsor_name: "NIH R01-2100", funding_type: "FEDERAL_GRANT", salary_floor_policy: "NIH_SCALE", award_start_date: "2026-09-01", award_end_date: "2027-12-31", annual_budget_usd: 600000.00 }
              as: PostdocAffairsOfficer
              as_user_id: "officer_pa_21"
              captures: { f21_id: "$.data.id" }
            - call: "POST /funding-sources/${f21_id}/verification"
              payload: { decision: "VERIFY" }
              as: HRCompensationApprover
              as_user_id: "hr_appr_2"
            - call: "POST /postdocs"
              payload: { full_name: "Page One", email: "page.one@example.edu", citizenship_country: "US", requires_sponsorship: false, phd_award_date: "2026-01-05" }
              as: PostdocAffairsOfficer
              as_user_id: "officer_pa_21"
              captures: { pg1_id: "$.data.id" }
            - call: "POST /postdocs"
              payload: { full_name: "Page Two", email: "page.two@example.edu", citizenship_country: "US", requires_sponsorship: false, phd_award_date: "2026-01-06" }
              as: PostdocAffairsOfficer
              as_user_id: "officer_pa_21"
              captures: { pg2_id: "$.data.id" }
            - call: "POST /postdocs"
              payload: { full_name: "Page Three", email: "page.three@example.edu", citizenship_country: "US", requires_sponsorship: false, phd_award_date: "2026-01-07" }
              as: PostdocAffairsOfficer
              as_user_id: "officer_pa_21"
              captures: { pg3_id: "$.data.id" }
            - call: "POST /appointments"
              payload: { postdoc_id: "${pg1_id}", mentor_id: "${m21_id}", funding_source_id: "${f21_id}", title_classification: "POSTDOC_ASSOCIATE", employment_class: "EMPLOYEE", term_start_date: "2026-10-01", term_end_date: "2027-09-30", annual_salary_usd: 62000.00 }
              as: PostdocAffairsOfficer
              as_user_id: "officer_pa_21"
              captures: { pa1_id: "$.data.id" }
            - call: "POST /appointments"
              payload: { postdoc_id: "${pg2_id}", mentor_id: "${m21_id}", funding_source_id: "${f21_id}", title_classification: "POSTDOC_ASSOCIATE", employment_class: "EMPLOYEE", term_start_date: "2026-10-01", term_end_date: "2027-09-30", annual_salary_usd: 62000.00 }
              as: PostdocAffairsOfficer
              as_user_id: "officer_pa_21"
              captures: { pa2_id: "$.data.id" }
            - call: "POST /appointments"
              payload: { postdoc_id: "${pg3_id}", mentor_id: "${m21_id}", funding_source_id: "${f21_id}", title_classification: "POSTDOC_ASSOCIATE", employment_class: "EMPLOYEE", term_start_date: "2026-10-01", term_end_date: "2027-09-30", annual_salary_usd: 62000.00 }
              as: PostdocAffairsOfficer
              as_user_id: "officer_pa_21"
              captures: { pa3_id: "$.data.id" }
          trigger:
            - call: "GET /appointments"
              payload: { limit: 2, offset: 0 }
              as: PostdocAffairsOfficer
              captures: { page1_first_id: "$.data[0].id" }
            - call: "GET /appointments"
              payload: { limit: 2, offset: 2 }
              as: PostdocAffairsOfficer
              captures: { page2_first_id: "$.data[0].id" }
          assert:
            - "first page http_status == 200 and response_type == array"
            - "first page data length == 2"
            - "first page total_count == 3"
            - "first page has_more == true"
            - "second page data length == 1"
            - "second page total_count == 3"
            - "second page has_more == false"
            - "${page1_first_id} != ${page2_first_id}"
            - "the union of the two pages is exactly {${pa1_id}, ${pa2_id}, ${pa3_id}}"

      - name: appointment_get_with_an_unknown_id_returns_appointment_not_found
        claim_type: not_found
        grounds:
          - errors[ERR_APPOINTMENT_NOT_FOUND]
          - validations.priority_3_existence
          - endpoints.GET /appointments/{id}
        distinguishing_aspect: "A well-formed but unused UUID on the single-appointment read returns 404 with error_id ERR_APPOINTMENT_NOT_FOUND in the error envelope - not an empty 200 body and not a 400."
        test_recipe:
          setup:
            - "Empty database; no appointment has ever been created."
          setup_api_calls: []
          trigger:
            - call: "GET /appointments/00000000-0000-0000-0000-000000000404"
              payload: {}
              as: PostdocAffairsOfficer
              captures: { nf_err: "$.data.error_id", nf_msg: "$.data.message" }
          assert:
            - "response http_status == 404"
            - "response_type == error"
            - "${nf_err} == ERR_APPOINTMENT_NOT_FOUND"
            - "${nf_msg} is a non-empty string"

      - name: appointment_create_missing_annual_salary_is_rejected_as_invalid_request
        claim_type: required_fields
        grounds:
          - validations.priority_5_ERR_INVALID_REQUEST
          - endpoints.POST /appointments
          - entities.Appointment.fields.annual_salary_usd
        distinguishing_aspect: "annual_salary_usd is an input field with no default, so omitting it is a body-shape failure at priority 5 and must be reported before any referential or fiscal check runs - even though the referenced funding source is also unverified in this chain."
        test_recipe:
          setup:
            - "One mentor with valid training, one UNVERIFIED award, one scholar."
          setup_api_calls:
            - call: "POST /faculty-mentors"
              payload: { full_name: "O. Bergstrom", department: "Linguistics", mentor_training_valid_through: "2029-09-30" }
              as: PostdocAffairsOfficer
              as_user_id: "officer_pa_22"
              captures: { m22_id: "$.data.id" }
            - call: "POST /funding-sources"
              payload: { sponsor_name: "NEH-2200", funding_type: "FEDERAL_GRANT", salary_floor_policy: "NIH_SCALE", award_start_date: "2026-09-01", award_end_date: "2027-12-31", annual_budget_usd: 300000.00 }
              as: PostdocAffairsOfficer
              as_user_id: "officer_pa_22"
              captures: { f22_id: "$.data.id" }
            - call: "POST /postdocs"
              payload: { full_name: "Rhys Calloway", email: "rhys.c@example.edu", citizenship_country: "US", requires_sponsorship: false, phd_award_date: "2026-02-14" }
              as: PostdocAffairsOfficer
              as_user_id: "officer_pa_22"
              captures: { p22_id: "$.data.id" }
          trigger:
            - call: "POST /appointments"
              payload: { postdoc_id: "${p22_id}", mentor_id: "${m22_id}", funding_source_id: "${f22_id}", title_classification: "POSTDOC_ASSOCIATE", employment_class: "EMPLOYEE", term_start_date: "2026-10-01", term_end_date: "2027-09-30" }
              as: PostdocAffairsOfficer
              as_user_id: "officer_pa_22"
              captures: { req_err: "$.data.error_id" }
          assert:
            - "response http_status == 400"
            - "${req_err} == ERR_INVALID_REQUEST"
            - "GET /appointments?postdoc_id=${p22_id} returns total_count 0"

      - name: omitted_optional_inputs_fall_back_to_declared_defaults
        claim_type: defaults
        grounds:
          - entities.Postdoc.fields.prior_external_months_in_rank
          - entities.Laboratory.fields.decontamination_buffer_days
          - entities.Laboratory.fields.status
          - entities.FacultyMentor.fields.max_concurrent_postdocs
        distinguishing_aspect: "Three different entities are created with every optional input omitted. The defaults asserted are the declared ones - prior_external_months_in_rank 0, the three boolean scholar flags false, max_concurrent_postdocs 3, decontamination_buffer_days 0, laboratory status OPEN - and requires_sponsorship is deliberately supplied because it is required, not defaulted."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "POST /postdocs"
              payload: { full_name: "Minimal Scholar", email: "minimal.s@example.edu", citizenship_country: "US", requires_sponsorship: false, phd_award_date: "2026-07-01" }
              as: PostdocAffairsOfficer
              as_user_id: "officer_pa_23"
              captures: { p23_id: "$.data.id", p23_prior: "$.data.prior_external_months_in_rank", p23_o1: "$.data.o1_endorsement_on_file", p23_bar: "$.data.j1_two_year_bar_flag", p23_rp: "$.data.restricted_party_flag" }
            - call: "POST /faculty-mentors"
              payload: { full_name: "Minimal Mentor", department: "Philosophy", mentor_training_valid_through: "2029-12-31" }
              as: PostdocAffairsOfficer
              as_user_id: "officer_pa_23"
              captures: { m23_id: "$.data.id", m23_max: "$.data.max_concurrent_postdocs", m23_count: "$.data.active_postdoc_count" }
            - call: "POST /laboratories"
              payload: { name: "Minimal Bay", biosafety_level: "BSL2", bench_capacity: 4 }
              as: PostdocAffairsOfficer
              as_user_id: "officer_pa_23"
              captures: { lab23_id: "$.data.id", lab23_buffer: "$.data.decontamination_buffer_days", lab23_status: "$.data.status" }
          assert:
            - "${p23_prior} == 0"
            - "${p23_o1} == false"
            - "${p23_bar} == false"
            - "${p23_rp} == false"
            - "Postdoc.${p23_id}.requires_sponsorship == false"
            - "${m23_max} == 3"
            - "${m23_count} == 0"
            - "${lab23_buffer} == 0"
            - "${lab23_status} == OPEN"
            - "Laboratory.${lab23_id}.bench_capacity == 4"

      - name: appointment_create_derives_every_computed_field_from_the_supplied_inputs
        claim_type: computed_fields
        grounds:
          - calculations.months_in_rank_ledger
          - calculations.salary_floor_computation
          - calculations.benefits_eligibility
          - entities.Appointment.fields.encumbrance_usd
        distinguishing_aspect: "One create call and five computed fields at once: term_months 12, months_in_rank_at_start 0, cumulative_months_in_rank_at_end 12, salary_floor_usd 61008.00 for a band-0 POSTDOC_ASSOCIATE on NIH_SCALE, benefits_package EMPLOYEE_FULL because 12 >= BENEFITS_FULL_MIN_MONTHS. encumbrance_usd stays 0.00 because a DRAFT appointment is not a held appointment - the encumbrance is computed at issue-offer, not at create."
        test_recipe:
          setup:
            - "One mentor with valid training and one VERIFIED NIH_SCALE FEDERAL_GRANT (300000.00, 2026-09-01 to 2027-12-31)."
            - "One scholar with prior_external_months_in_rank 0."
          setup_api_calls:
            - call: "POST /faculty-mentors"
              payload: { full_name: "Q. Ivanova", department: "Mathematics", mentor_training_valid_through: "2029-10-31" }
              as: PostdocAffairsOfficer
              as_user_id: "officer_pa_24"
              captures: { m24_id: "$.data.id" }
            - call: "POST /funding-sources"
              payload: { sponsor_name: "NSF DMS-2400", funding_type: "FEDERAL_GRANT", salary_floor_policy: "NIH_SCALE", award_start_date: "2026-09-01", award_end_date: "2027-12-31", annual_budget_usd: 300000.00 }
              as: PostdocAffairsOfficer
              as_user_id: "officer_pa_24"
              captures: { f24_id: "$.data.id" }
            - call: "POST /funding-sources/${f24_id}/verification"
              payload: { decision: "VERIFY" }
              as: HRCompensationApprover
              as_user_id: "hr_appr_2"
            - call: "POST /postdocs"
              payload: { full_name: "Sable Ortiz", email: "sable.o@example.edu", citizenship_country: "US", requires_sponsorship: false, phd_award_date: "2026-06-30" }
              as: PostdocAffairsOfficer
              as_user_id: "officer_pa_24"
              captures: { p24_id: "$.data.id" }
          trigger:
            - call: "POST /appointments"
              payload: { postdoc_id: "${p24_id}", mentor_id: "${m24_id}", funding_source_id: "${f24_id}", title_classification: "POSTDOC_ASSOCIATE", employment_class: "EMPLOYEE", term_start_date: "2026-10-01", term_end_date: "2027-09-30", annual_salary_usd: 68000.00 }
              as: PostdocAffairsOfficer
              as_user_id: "officer_pa_24"
              captures: { a24_id: "$.data.id", a24_months: "$.data.term_months", a24_start: "$.data.months_in_rank_at_start", a24_end: "$.data.cumulative_months_in_rank_at_end", a24_floor: "$.data.salary_floor_usd", a24_benefits: "$.data.benefits_package", a24_enc: "$.data.encumbrance_usd" }
          assert:
            - "${a24_months} == 12"
            - "${a24_start} == 0"
            - "${a24_end} == 12"
            - "${a24_floor} == 61008.00"
            - "${a24_benefits} == EMPLOYEE_FULL"
            - "${a24_enc} == 0.00"
            - "FundingSource.${f24_id}.encumbered_usd == 0.00"
            - "FundingSource.${f24_id}.available_balance_usd == 300000.00"

      - name: appointment_create_seeds_system_fields_the_client_never_supplies
        claim_type: system_fields
        grounds:
          - entities.Appointment.fields.appointment_status
          - entities.Appointment.fields.compliance_status
          - entities.Appointment.fields.prepared_by_user_id
          - entities.Appointment.fields.salary_exception_floor_usd
        distinguishing_aspect: "appointment_status DRAFT, compliance_status PENDING_REVIEW, prepared_by_user_id taken from the X-User-ID header rather than the body, version 1, reinstated_count 0, and both salary-exception fields null. None of these names appears in POST /appointments' input list, so a client cannot set them."
        test_recipe:
          setup:
            - "One mentor with valid training, one VERIFIED NIH_SCALE FEDERAL_GRANT (300000.00, 2026-09-01 to 2027-12-31), one scholar."
          setup_api_calls:
            - call: "POST /faculty-mentors"
              payload: { full_name: "R. Kirchner", department: "History", mentor_training_valid_through: "2029-11-30" }
              as: PostdocAffairsOfficer
              as_user_id: "officer_pa_25"
              captures: { m25_id: "$.data.id" }
            - call: "POST /funding-sources"
              payload: { sponsor_name: "Mellon-2500", funding_type: "FOUNDATION_GRANT", salary_floor_policy: "NIH_SCALE", award_start_date: "2026-09-01", award_end_date: "2027-12-31", annual_budget_usd: 300000.00 }
              as: PostdocAffairsOfficer
              as_user_id: "officer_pa_25"
              captures: { f25_id: "$.data.id" }
            - call: "POST /funding-sources/${f25_id}/verification"
              payload: { decision: "VERIFY" }
              as: HRCompensationApprover
              as_user_id: "hr_appr_2"
            - call: "POST /postdocs"
              payload: { full_name: "Talia Boone", email: "talia.b@example.edu", citizenship_country: "US", requires_sponsorship: false, phd_award_date: "2026-06-01" }
              as: PostdocAffairsOfficer
              as_user_id: "officer_pa_25"
              captures: { p25_id: "$.data.id" }
          trigger:
            - call: "POST /appointments"
              payload: { postdoc_id: "${p25_id}", mentor_id: "${m25_id}", funding_source_id: "${f25_id}", title_classification: "POSTDOC_ASSOCIATE", employment_class: "EMPLOYEE", term_start_date: "2026-10-01", term_end_date: "2027-09-30", annual_salary_usd: 62000.00 }
              as: PostdocAffairsOfficer
              as_user_id: "officer_pa_25"
              captures: { a25_id: "$.data.id", a25_status: "$.data.appointment_status", a25_compliance: "$.data.compliance_status", a25_prepared: "$.data.prepared_by_user_id", a25_version: "$.data.version" }
          assert:
            - "${a25_status} == DRAFT"
            - "${a25_compliance} == PENDING_REVIEW"
            - "${a25_prepared} == officer_pa_25"
            - "${a25_version} == 1"
            - "Appointment.${a25_id}.salary_exception_floor_usd == null"
            - "Appointment.${a25_id}.salary_exception_approved_by_user_id == null"
            - "Appointment.${a25_id}.withdraw_reason == null"
            - "Appointment.${a25_id}.reinstated_count == 0"
            - "Appointment.${a25_id}.created_at is a non-empty ISO-8601 string"
            - "Appointment.${a25_id}.updated_at is a non-empty ISO-8601 string"

      - name: appointment_create_rejects_an_undeclared_enum_and_an_inverted_term
        claim_type: type_constraints
        grounds:
          - validations.priority_5_ERR_INVALID_REQUEST
          - entities.Appointment.constraints.title_classification
          - entities.Appointment.fields.term_end_date
        distinguishing_aspect: "Two distinct body-shape failures on the same endpoint: a title_classification outside {POSTDOC_FELLOW, POSTDOC_SCHOLAR_EMPLOYEE, POSTDOC_ASSOCIATE}, and a term_end_date that is not strictly after term_start_date. Both are priority-5 ERR_INVALID_REQUEST at 400 and neither may be reported as the semantic ERR_TITLE_CLASS_MISMATCH or ERR_TERM_LENGTH_INVALID."
        test_recipe:
          setup:
            - "One mentor with valid training, one VERIFIED NIH_SCALE FEDERAL_GRANT (300000.00, 2026-09-01 to 2027-12-31), one scholar."
          setup_api_calls:
            - call: "POST /faculty-mentors"
              payload: { full_name: "S. Duarte", department: "Sociology", mentor_training_valid_through: "2029-11-30" }
              as: PostdocAffairsOfficer
              as_user_id: "officer_pa_26"
              captures: { m26_id: "$.data.id" }
            - call: "POST /funding-sources"
              payload: { sponsor_name: "NSF SES-2600", funding_type: "FEDERAL_GRANT", salary_floor_policy: "NIH_SCALE", award_start_date: "2026-09-01", award_end_date: "2027-12-31", annual_budget_usd: 300000.00 }
              as: PostdocAffairsOfficer
              as_user_id: "officer_pa_26"
              captures: { f26_id: "$.data.id" }
            - call: "POST /funding-sources/${f26_id}/verification"
              payload: { decision: "VERIFY" }
              as: HRCompensationApprover
              as_user_id: "hr_appr_2"
            - call: "POST /postdocs"
              payload: { full_name: "Umar Sesay", email: "umar.s@example.edu", citizenship_country: "US", requires_sponsorship: false, phd_award_date: "2026-05-05" }
              as: PostdocAffairsOfficer
              as_user_id: "officer_pa_26"
              captures: { p26_id: "$.data.id" }
          trigger:
            - call: "POST /appointments"
              payload: { postdoc_id: "${p26_id}", mentor_id: "${m26_id}", funding_source_id: "${f26_id}", title_classification: "POSTDOC_SUPERVISOR", employment_class: "EMPLOYEE", term_start_date: "2026-10-01", term_end_date: "2027-09-30", annual_salary_usd: 62000.00 }
              as: PostdocAffairsOfficer
              as_user_id: "officer_pa_26"
              captures: { enum_err: "$.data.error_id" }
            - call: "POST /appointments"
