# =============================================================================
# PRD Benchmark Seed Tables — SmartRent access hardware / vacant-unit automation
# Task: task_3329_smart_apartment_access_hardware_deployment_vacant_unit
# =============================================================================

scenario: |
  Smart Apartment Access Hardware Deployment & Vacant Unit Automation (SmartRent):
  property-wide hardware deployment across smart locks, thermostats, leak sensors
  and community access with installation scheduling in occupied units, hub
  connectivity and network design in buildings with poor wireless coverage,
  resident onboarding with app credentials, guest access and move-out credential
  revocation, self-guided tour access for prospects with identity verification and
  time-bounded entry codes, vacant unit automation setting temperature setpoints
  and detecting unauthorized entry, maintenance access workflows with notice
  requirements and audit trails, hardware failure and battery replacement programs
  across thousands of devices, and property management system integration for
  resident status changes.

domain_name: smart-apartment-access-hardware
api_prefix: /smart-rent

# Named constants referenced across state machines and calculations (pinned values)
constants:
  IDENTITY_VERIFICATION_TTL_MINUTES: 60
  MAX_VERIFY_ATTEMPTS: 3
  REQUIRED_NOTICE_HOURS_STANDARD: 48
  REQUIRED_NOTICE_HOURS_EMERGENCY: 24
  NOTICE_WINDOW_OPEN_HOUR: 8
  NOTICE_WINDOW_CLOSE_HOUR: 20
  ESTIMATED_INSTALL_MINUTES: 120
  INSTALL_BUFFER_MINUTES: 30
  BATTERY_DRAIN_PER_SCAN: 1
  LOW_BATTERY_ALERT_PCT: 20
  PLANNED_DAYS: 1
  NET_RSSI_THRESHOLD_DBM_POINT_TO_POINT: -67
  NET_RSSI_THRESHOLD_DBM_FIELD_MESH: -75
  NET_RSSI_THRESHOLD_DBM_HUB_RELAY: -80
  ESTIMATED_JOB_RESERVE_CENTS: 2000

complexity_profile:
  primary_archetype: workflow_orchestration
  secondary_archetype: compliance_audit
  complexity_layers:
    - cascading_side_effects
    - dual_variant_calculation
    - optimistic_concurrency
    - derived_field_reconciliation
  entity_topology: hybrid
  state_machine_shape: parallel
  relationship_patterns:
    - one_to_many
    - cross_aggregate
    - self_referential
  role_model: peer_roles
  consistency_model: immediate

# =============================================================================
# Table 1: Entity Relationship Table (§1.1)
# =============================================================================
entities:
  - name: Property
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Community / property name" }
      - { name: address_line, type: string, source: input, description: "Street address" }
      - { name: unit_capacity, type: integer, source: input, default: 0, description: "Planned unit count" }
      - { name: temp_budget_cents_per_day, type: integer, source: input, default: 500, description: "Daily vacant-unit HVAC budget in cents" }
      - { name: budget_committed_cents, type: number, source: computed, default: 0, description: "Sum of accrued_cost_cents over MaintenanceVisit rows on this property whose status in {NOTICE_CERTIFIED, COMPLETED}; CANCELLED rows contribute 0 and a cancelled visit resets its own accrual to 0" }

  - name: Building
    parent: Property
    common_fields: true
    fields:
      - { name: property_id, type: string, source: system, description: "References Property: owning property" }
      - { name: name, type: string, source: input, description: "Building / wing label" }
      - { name: network_design, type: enum, source: input, description: "POINT_TO_POINT | FIELD_MESH | HUB_RELAY" }
      - { name: wifi_rssi_dbm, type: integer, source: input, description: "Measured hub signal strength (negative dBm)" }
      - { name: last_hub_service_at, type: datetime, source: input, description: "Date the hub was last serviced; null when never serviced" }
      - { name: connectivity_ok, type: computed, description: "Derived from wifi_rssi_dbm vs design threshold (see calculations)" }

  - name: Unit
    parent: Property
    common_fields: true
    fields:
      - { name: property_id, type: string, source: system, description: "References Property: owning property" }
      - { name: building_id, type: string, source: input, description: "References Building: building the unit belongs to" }
      - { name: unit_number, type: string, source: input, description: "Unit label, unique within property" }
      - { name: occupancy_status, type: enum, source: computed, default: VACANT, description: "VACANT | OCCUPIED | NOTICE | NOTICE_ENDED" }
      - { name: target_setpoint_c, type: number, source: computed, description: "Current HVAC heating/cooling setpoint in Celsius" }
      - { name: hvac_mode, type: enum, source: computed, description: "VACANT_AUTO | OCCUPIED" }
      - { name: pod_entry_window_start, type: datetime, source: system, description: "Earliest bookable tour/maintenance instant for this unit" }
      - { name: pod_entry_window_end, type: datetime, source: system, description: "Latest bookable tour/maintenance instant for this unit" }
      - { name: unauthorized_entry_detected, type: boolean, source: computed, default: false, description: "Set when a vacant-unit lock opens without an authorized credential or open maintenance window" }

  - name: Device
    parent: Unit
    common_fields: true
    fields:
      - { name: unit_id, type: string, source: input, description: "References Unit: unit the device serves (null for building-level/community devices)" }
      - { name: building_id, type: string, source: system, description: "References Building: building the device is installed in" }
      - { name: device_type, type: enum, source: input, description: "SMART_LOCK | THERMOSTAT | LEAK_SENSOR | COMMUNITY_ACCESS | HUB" }
      - { name: firmware_version, type: enum, source: input, description: "LATEST | OLD | CRITICAL" }
      - { name: battery_pct, type: integer, source: computed, default: 100, description: "Remaining battery percentage (HUB is mains-powered, pinned 100)" }
      - { name: status, type: enum, source: computed, default: PROVISIONED, description: "PROVISIONED | ONLINE | UNREACHABLE | DECOMMISSIONED" }
      - { name: lock_state, type: enum, source: computed, default: LOCKED, description: "LOCKED | UNLOCKED (smart locks only)" }
      - { name: battery_replacements, type: integer, source: computed, default: 0, description: "Lifetime battery replacements performed on this device" }

  - name: DeviceAlert
    parent: Building
    common_fields: true
    fields:
      - { name: building_id, type: string, source: system, description: "References Building: building the alert was raised in" }
      - { name: device_id, type: string, source: system, description: "References Device: device the alert concerns" }
      - { name: alert_type, type: enum, source: system, description: "OFFLINE | LOW_BATTERY | UNAUTHORIZED_ENTRY" }
      - { name: status, type: enum, source: computed, default: OPEN, description: "OPEN | ACKNOWLEDGED | RESOLVED" }
      - { name: severity, type: enum, source: computed, description: "MEDIUM | HIGH — HIGH for OFFLINE/UNAUTHORIZED_ENTRY alerts, MEDIUM for LOW_BATTERY alerts" }

  - name: WorkOrder
    parent: Device
    common_fields: true
    fields:
      - { name: device_id, type: string, source: system, description: "References Device: device the work order targets" }
      - { name: alert_id, type: string, source: system, description: "References DeviceAlert: originating alert" }
      - { name: assigned_technician_id, type: string, source: input, description: "Technician operator identifier (opaque)" }
      - { name: status, type: enum, source: computed, default: OPEN, description: "OPEN | ASSIGNED | CLOSED" }
      - { name: battery_replaced, type: boolean, source: computed, default: false, description: "True when the work order performed a battery replacement" }

  - name: Resident
    parent: Property
    common_fields: true
    fields:
      - { name: property_id, type: string, source: input, description: "References Property: resident's property" }
      - { name: unit_id, type: string, source: input, description: "References Unit: resident's unit" }
      - { name: full_name, type: string, source: input, description: "Resident legal name" }
      - { name: email, type: string, source: input, description: "Resident email used for app credentials" }
      - { name: status, type: enum, source: computed, default: PENDING_CREDENTIAL, description: "PENDING_CREDENTIAL | ACTIVE | DEACTIVATING | REVOKED" }
      - { name: portal_credential_status, type: enum, source: computed, default: NOT_ISSUED, description: "NOT_ISSUED | ACTIVE | REVOKED" }
      - { name: notice_end_at, type: datetime, source: input, description: "Move-out effective instant declared on deactivation" }

  - name: ResidentStatusEvent
    parent: Resident
    common_fields: false
    fields:
      - { name: resident_id, type: string, source: system, description: "References Resident: resident the event describes" }
      - { name: from_status, type: enum, source: system, description: "Prior resident status" }
      - { name: to_status, type: enum, source: system, description: "New resident status" }
      - { name: recorded_at, type: datetime, source: system, description: "Instant the transition was recorded" }

  - name: AccessCredential
    parent: Unit
    common_fields: true
    fields:
      - { name: unit_id, type: string, source: system, description: "References Unit: unit the credential unlocks" }
      - { name: subject_resident_id, type: string, source: system, description: "References Resident: resident the credential belongs to (null for guest/tour credentials)" }
      - { name: credential_type, type: enum, source: input, description: "RESIDENT | GUEST | TOUR" }
      - { name: status, type: enum, source: computed, default: ISSUED, description: "ISSUED | ACTIVE | EXPIRED | REVOKED" }
      - { name: valid_from, type: datetime, source: input, description: "Start of the credential validity window" }
      - { name: valid_until, type: datetime, source: system, description: "End of the credential validity window" }

  - name: GuestPass
    parent: Unit
    common_fields: true
    fields:
      - { name: unit_id, type: string, source: system, description: "References Unit: unit the guest may enter" }
      - { name: host_resident_id, type: string, source: system, description: "References Resident: hosting resident" }
      - { name: guest_label, type: string, source: input, description: "Free-text guest label" }
      - { name: status, type: enum, source: computed, default: ACTIVE, description: "ACTIVE | EXPIRED | REVOKED" }
      - { name: start_at, type: datetime, source: input, description: "Start of the guest entry window" }
      - { name: end_at, type: datetime, source: input, description: "End of the guest entry window" }

  - name: TourSession
    parent: Unit
    common_fields: true
    fields:
      - { name: unit_id, type: string, source: system, description: "References Unit: unit being toured" }
      - { name: prospect_name, type: string, source: input, description: "Prospect name" }
      - { name: prospect_id_document, type: string, source: input, description: "Prospect identity document number supplied at request" }
      - { name: status, type: enum, source: computed, default: REQUESTED, description: "REQUESTED | DENIED | VERIFIED | ACTIVE | COMPLETED" }
      - { name: requested_start_at, type: datetime, source: input, description: "Requested tour start instant" }
      - { name: duration_minutes, type: integer, source: input, default: 60, description: "Requested tour duration in minutes" }
      - { name: identity_verified_at, type: datetime, source: computed, description: "Instant identity verification succeeded" }
      - { name: verify_attempts, type: integer, source: computed, default: 0, description: "Number of verification attempts on this session" }

  - name: MaintenanceVisit
    parent: Unit
    common_fields: true
    fields:
      - { name: unit_id, type: string, source: system, description: "References Unit: unit being serviced" }
      - { name: technician_id, type: string, source: input, description: "Maintenance technician operator identifier (opaque)" }
      - { name: start_at, type: datetime, source: input, description: "Planned maintenance start instant" }
      - { name: end_at, type: datetime, source: input, description: "Planned maintenance end instant" }
      - { name: planned_hours, type: number, source: computed, description: "= (end_at - start_at) in hours" }
      - { name: actual_hours, type: number, source: computed, description: "Hours actually spent (set on completion)" }
      - { name: is_emergency, type: boolean, source: input, default: false, description: "Emergency visits require reduced notice" }
      - { name: notice_mailed_at, type: datetime, source: input, description: "Instant legal notice was served" }
      - { name: status, type: enum, source: computed, default: REQUESTED, description: "REQUESTED | NOTICE_CERTIFIED | COMPLETED | CANCELLED" }
      - { name: accrued_cost_cents, type: computed, default: 0, description: "Budget accrual (provisional then final — see calculations)" }

  - name: InstallationJob
    parent: Building
    common_fields: true
    fields:
      - { name: property_id, type: string, source: system, description: "References Property: property the job belongs to" }
      - { name: building_id, type: string, source: system, description: "References Building: building the job belongs to" }
      - { name: unit_id, type: string, source: input, description: "References Unit: target unit (null for building-level installs)" }
      - { name: device_type, type: enum, source: input, description: "SMART_LOCK | THERMOSTAT | LEAK_SENSOR | COMMUNITY_ACCESS | HUB" }
      - { name: requires_resident_coordination, type: boolean, source: input, default: false, description: "When true the unit must be OCCUPIED and a notice-served maintenance window must exist" }
      - { name: access_window_start, type: datetime, source: input, description: "Technician access window start" }
      - { name: access_window_end, type: datetime, source: input, description: "Technician access window end" }
      - { name: scheduled_start_at, type: datetime, source: input, description: "Confirmed install start instant" }
      - { name: status, type: enum, source: computed, default: SCHEDULED, description: "SCHEDULED | IN_PROGRESS | COMPLETED | ABORTED" }
      - { name: labor_hours, type: computed, default: 0, description: "Install labor hours (see calculations)" }

# =============================================================================
# Table 2: State Machine Table (§1.2)
# =============================================================================
state_machines:
  - entity: Unit
    initial_state: VACANT
    terminal_states: []
    transitions:
      - from: VACANT
        to: OCCUPIED
        trigger: "POST /residents (first resident created against the unit)"
        actor: PropertyManager
        preconditions:
          - "unit.occupancy_status == VACANT"
          - "no other non-REVOKED Resident exists for unit_id"
        side_effects:
          - "recompute unit.hvac_mode -> OCCUPIED and unit.target_setpoint_c -> 22.0"
          - "unit.unauthorized_entry_detected -> false"
        note: "VACANT <-> OCCUPIED is the occupancy cycle; a unit returns to VACANT after notice expires."
      - from: OCCUPIED
        to: NOTICE
        trigger: "POST /residents/{residentId}/deactivate"
        actor: PropertyManager
        preconditions:
          - "resident.status == ACTIVE"
          - "resident.unit_id == unit.id"
        side_effects:
          - "resident.status -> DEACTIVATING"
          - "all AccessCredential rows with subject_resident_id == resident.id and status in {ISSUED, ACTIVE} -> REVOKED"
          - "recompute resident.portal_credential_status -> REVOKED"
        note: "First hop of the move-out credential-revocation cascade."
      - from: NOTICE
        to: NOTICE_ENDED
        trigger: "system: logical clock reaches unit.occupied_notice_end_at"
        actor: system
        preconditions:
          - "unit.occupancy_status == NOTICE"
          - "logical clock >= resident.notice_end_at"
        side_effects:
          - "resident.status -> REVOKED (bubbled up from DEACTIVATING once no credential in {ISSUED, ACTIVE} remains)"
          - "unit.hvac_mode -> VACANT_AUTO"
        note: "Bubble-up: resident reaches REVOKED only when its credential set is empty of live credentials."
      - from: NOTICE_ENDED
        to: VACANT
        trigger: "POST /units/{unitId}/vacant-automation"
        actor: PropertyManager
        preconditions:
          - "unit.occupancy_status == NOTICE_ENDED"
          - "no Resident with status == ACTIVE references unit_id"
        side_effects:
          - "recompute unit.target_setpoint_c via vacant_unit_setpoint_c calculation"
          - "recompute unit.building_id's devices' status on next scan"
          - "recompute property.budget_committed_cents"

  - entity: Resident
    initial_state: PENDING_CREDENTIAL
    terminal_states: [REVOKED]
    transitions:
      - from: PENDING_CREDENTIAL
        to: ACTIVE
        trigger: "POST /residents/{residentId}/onboard"
        actor: PropertyManager
        preconditions:
          - "resident.status == PENDING_CREDENTIAL"
          - "unit.occupancy_status in {OCCUPIED, NOTICE}"
          - "at least one Device with device_type == SMART_LOCK, unit_id == resident.unit_id, status == ONLINE"
          - "unit's building connectivity_ok == true"
        side_effects:
          - "create AccessCredential{credential_type: RESIDENT, status: ACTIVE, subject_resident_id: resident.id}"
          - "resident.portal_credential_status -> ACTIVE"
          - "append ResidentStatusEvent{PENDING_CREDENTIAL -> ACTIVE}"
      - from: ACTIVE
        to: DEACTIVATING
        trigger: "POST /residents/{residentId}/deactivate"
        actor: PropertyManager
        preconditions:
          - "resident.status == ACTIVE"
        side_effects:
          - "all AccessCredential rows with subject_resident_id == resident.id and status in {ISSUED, ACTIVE} -> REVOKED"
          - "append ResidentStatusEvent{ACTIVE -> DEACTIVATING}"
          - "unit.occupancy_status -> NOTICE"
      - from: DEACTIVATING
        to: REVOKED
        trigger: "system: last live credential revoked"
        actor: system
        preconditions:
          - "no AccessCredential with subject_resident_id == resident.id has status in {ISSUED, ACTIVE}"
        side_effects:
          - "append ResidentStatusEvent{DEACTIVATING -> REVOKED}"
          - "resident.portal_credential_status -> REVOKED"
      - from: DEACTIVATING
        to: ACTIVE
        trigger: "POST /residents/{residentId}/onboard"
        actor: PropertyManager
        preconditions:
          - "resident.status == DEACTIVATING"
          - "unit.occupancy_status == NOTICE"
        side_effects:
          - "re-issue AccessCredential{credential_type: RESIDENT, status: ACTIVE}"
          - "append ResidentStatusEvent{DEACTIVATING -> ACTIVE}"
        note: "Move-out cancellation cycle — DEACTIVATING -> ACTIVE -> DEACTIVATING is allowed."

  - entity: AccessCredential
    initial_state: ISSUED
    terminal_states: [EXPIRED]
    transitions:
      - from: ISSUED
        to: ACTIVE
        trigger: "POST /residents/{residentId}/onboard or POST /tour-sessions/{tourSessionId}/verify"
        actor: system
        preconditions:
          - "credential.valid_from <= logical clock"
        side_effects:
          - "credential.valid_until stamped when not supplied"
      - from: ACTIVE
        to: REVOKED
        trigger: "POST /residents/{residentId}/deactivate or POST /residents/{residentId}/onboard (re-issue supersede)"
        actor: system
        preconditions:
          - "credential.status == ACTIVE"
        side_effects:
          - "recompute resident.portal_credential_status"
      - from: ACTIVE
        to: EXPIRED
        trigger: "system: logical clock reaches credential.valid_until"
        actor: system
        preconditions:
          - "logical clock >= credential.valid_until"
        side_effects: []
      - from: REVOKED
        to: ACTIVE
        trigger: "POST /residents/{residentId}/onboard (re-issue)"
        actor: PropertyManager
        preconditions:
          - "credential.credential_type == RESIDENT"
          - "parent resident.status == DEACTIVATING"
          - "credential.valid_until > logical clock"
        side_effects:
          - "credential.status -> ACTIVE"

  - entity: GuestPass
    initial_state: ACTIVE
    terminal_states: [REVOKED]
    transitions:
      - from: ACTIVE
        to: EXPIRED
        trigger: "system: logical clock reaches guest_pass.end_at"
        actor: system
        preconditions:
          - "logical clock >= guest_pass.end_at"
        side_effects: []
      - from: ACTIVE
        to: REVOKED
        trigger: "POST /residents/{residentId}/deactivate (host move-out cascade)"
        actor: system
        preconditions:
          - "guest_pass.host_resident_id == resident.id"
          - "guest_pass.status == ACTIVE"
        side_effects: []
      - from: EXPIRED
        to: ACTIVE
        trigger: "POST /guest-passes/{guestPassId}/extend"
        actor: Resident
        preconditions:
          - "guest_pass.status == EXPIRED"
          - "new_end_at > logical clock"
          - "host resident.status in {ACTIVE, DEACTIVATING}"
        side_effects:
          - "guest_pass.end_at -> new_end_at"

  - entity: TourSession
    initial_state: REQUESTED
    terminal_states: [COMPLETED]
    transitions:
      - from: REQUESTED
        to: VERIFIED
        trigger: "POST /tour-sessions/{tourSessionId}/verify (identity passes)"
        actor: LeasingAgent
        preconditions:
          - "tour_session.status == REQUESTED"
          - "logical clock <= tour_session.requested_start_at + IDENTITY_VERIFICATION_TTL_MINUTES"
          - "identity_document_number == tour_session.prospect_id_document"
          - "unit.occupancy_status == VACANT"
        side_effects:
          - "create AccessCredential{credential_type: TOUR, status: ACTIVE, valid_from: requested_start_at, valid_until: requested_start_at + duration_minutes}"
          - "tour_session.identity_verified_at -> logical clock"
          - "tour_session.verify_attempts -> verify_attempts + 1"
      - from: REQUESTED
        to: DENIED
        trigger: "POST /tour-sessions/{tourSessionId}/verify (identity fails)"
        actor: LeasingAgent
        preconditions:
          - "tour_session.status == REQUESTED"
          - "identity_document_number != tour_session.prospect_id_document"
        side_effects:
          - "tour_session.verify_attempts -> verify_attempts + 1"
      - from: DENIED
        to: REQUESTED
        trigger: "POST /tour-sessions/{tourSessionId}/verify (retry)"
        actor: LeasingAgent
        preconditions:
          - "tour_session.status == DENIED"
          - "tour_session.verify_attempts < MAX_VERIFY_ATTEMPTS"
          - "logical clock <= tour_session.requested_start_at + IDENTITY_VERIFICATION_TTL_MINUTES"
        side_effects:
          - "tour_session.status -> REQUESTED"
        note: "Retry cycle REQUESTED -> DENIED -> REQUESTED is the non-linear shape."
      - from: VERIFIED
        to: ACTIVE
        trigger: "system: logical clock reaches credential.valid_from"
        actor: system
        preconditions:
          - "tour_session.status == VERIFIED"
        side_effects: []
      - from: ACTIVE
        to: COMPLETED
        trigger: "system: logical clock reaches credential.valid_until with the tour concluded"
        actor: system
        preconditions:
          - "tour_session.status == ACTIVE"
          - "logical clock >= credential.valid_until"
        side_effects:
          - "tour credential.status -> EXPIRED"
      - from: VERIFIED
        to: DENIED
        trigger: "POST /tour-sessions/{tourSessionId}/verify (re-verify fails after verification)"
        actor: LeasingAgent
        preconditions:
          - "tour_session.status == VERIFIED"
          - "identity_document_number != tour_session.prospect_id_document"
        side_effects:
          - "tour credential.status -> REVOKED"
          - "tour_session.verify_attempts -> verify_attempts + 1"

  - entity: Device
    initial_state: PROVISIONED
    terminal_states: [DECOMMISSIONED]
    transitions:
      - from: PROVISIONED
        to: ONLINE
        trigger: "POST /buildings/{buildingId}/device-scans (device reported reachable)"
        actor: HardwareTechnician
        preconditions:
          - "device.id in scan.reachable_device_ids"
        side_effects:
          - "device.status -> ONLINE"
      - from: ONLINE
        to: UNREACHABLE
        trigger: "POST /buildings/{buildingId}/device-scans (device absent from reachable set)"
        actor: HardwareTechnician
        preconditions:
          - "device.id not in scan.reachable_device_ids"
        side_effects:
          - "create DeviceAlert{alert_type: OFFLINE, status: OPEN, severity: HIGH} for the device"
          - "device.battery_pct -> max(0, battery_pct - BATTERY_DRAIN_PER_SCAN)"
      - from: UNREACHABLE
        to: ONLINE
        trigger: "POST /buildings/{buildingId}/device-scans (device reported reachable again)"
        actor: HardwareTechnician
        preconditions:
          - "device.id in scan.reachable_device_ids"
        side_effects:
          - "any OPEN DeviceAlert{alert_type: OFFLINE} for the device -> RESOLVED"
      - from: ONLINE
        to: DECOMMISSIONED
        trigger: "POST /devices/{deviceId}/replace_battery on a device with firmware_version == CRITICAL"
        actor: HardwareTechnician
        preconditions:
          - "device.firmware_version == CRITICAL"
        side_effects: []
      - from: ONLINE
        to: ONLINE
        trigger: "POST /devices/{deviceId}/lock-events"
        actor: HardwareTechnician | PropertyManager
        preconditions:
          - "device.device_type == SMART_LOCK"
          - "device.status == ONLINE"
        side_effects:
          - "device.lock_state -> UNLOCKED when event_type == UNLOCK else LOCKED"
          - "when event_type == UNLOCK and the unit's occupancy_status == VACANT and no ACTIVE GUEST/TOUR AccessCredential covers the logical clock and no NOTICE_CERTIFIED MaintenanceVisit window covers the logical clock: unit.unauthorized_entry_detected -> true and a DeviceAlert{alert_type: UNAUTHORIZED_ENTRY, severity: HIGH, status: OPEN} is raised"
        note: "Vacant-unit unauthorized-entry detection; a lock open with no authorizing credential or window is an intrusion."
    note: "Parallel state dimensions on one entity: `status` and `lock_state` evolve independently."

  - entity: DeviceAlert
    initial_state: OPEN
    terminal_states: []
    transitions:
      - from: OPEN
        to: ACKNOWLEDGED
        trigger: "POST /work-orders/{workOrderId}/assign"
        actor: HardwareTechnician
        preconditions:
          - "a WorkOrder with alert_id == alert.id and assigned_technician_id != null exists"
        side_effects:
          - "parent work order.status -> ASSIGNED"
      - from: OPEN
        to: RESOLVED
        trigger: "POST /buildings/{buildingId}/device-scans (device reachable again)"
        actor: system
        preconditions:
          - "alert.alert_type in {OFFLINE, LOW_BATTERY}"
          - "alert.device_id in scan.reachable_device_ids"
        side_effects: []
      - from: ACKNOWLEDGED
        to: RESOLVED
        trigger: "POST /work-orders/{workOrderId}/assign (technician confirms repair)"
        actor: HardwareTechnician
        preconditions:
          - "alert.status == ACKNOWLEDGED"
        side_effects:
          - "work_order.status -> CLOSED"
      - from: RESOLVED
        to: OPEN
        trigger: "POST /buildings/{buildingId}/device-scans (condition recurs)"
        actor: system
        preconditions:
          - "alert.status == RESOLVED"
          - "alert.device_id not in scan.reachable_device_ids"
        side_effects:
          - "alert.status -> OPEN (recurrence cycle)"

  - entity: WorkOrder
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: ASSIGNED
        trigger: "POST /work-orders/{workOrderId}/assign"
        actor: HardwareTechnician
        preconditions:
          - "work_order.status == OPEN"
          - "assigned technician != null"
        side_effects:
          - "parent DeviceAlert.status -> ACKNOWLEDGED"
      - from: ASSIGNED
        to: CLOSED
        trigger: "POST /work-orders/{workOrderId}/assign (technician confirms repair)"
        actor: HardwareTechnician
        preconditions:
          - "work_order.status == ASSIGNED"
          - "work_order.device_id is ONLINE or the battery was replaced"
        side_effects:
          - "parent DeviceAlert.status -> RESOLVED"
          - "if work_order.battery_replaced then device.battery_replacements -> battery_replacements + 1"

  - entity: InstallationJob
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, ABORTED]
    transitions:
      - from: SCHEDULED
        to: IN_PROGRESS
        trigger: "POST /installation-jobs/{installationJobId}/schedule"
        actor: HardwareTechnician
        preconditions:
          - "installation_job.status == SCHEDULED"
          - "when requires_resident_coordination == true: unit.occupancy_status == OCCUPIED and a MaintenanceVisit for unit_id with status == NOTICE_CERTIFIED exists whose window covers scheduled_start_at"
          - "no MaintenanceVisit or TourSession for unit_id overlaps [scheduled_start_at, scheduled_start_at + ESTIMATED_INSTALL_MINUTES) within the 30-minute buffer"
        side_effects:
          - "installation_job.status -> IN_PROGRESS"
          - "create Device{device_type: installation_job.device_type, status: PROVISIONED} for the target unit/building"
          - "property.budget_committed_cents -> recompute"
      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "POST /installation-jobs/{installationJobId}/complete"
        actor: HardwareTechnician
        preconditions:
          - "installation_job.status == IN_PROGRESS"
          - "building.connectivity_ok == true"
        side_effects:
          - "device.status -> ONLINE"
          - "installation_job.labor_hours -> recompute via installation_labor_hours calculation"
      - from: IN_PROGRESS
        to: ABORTED
        trigger: "POST /installation-jobs/{installationJobId}/complete (failed connectivity check)"
        actor: HardwareTechnician
        preconditions:
          - "building.connectivity_ok == false"
        side_effects:
          - "the synthesized Device for this job -> DECOMMISSIONED"
          - "property.budget_committed_cents -> recompute"
          - "no Device is added to the unit's live device set"

  - entity: MaintenanceVisit
    initial_state: REQUESTED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: REQUESTED
        to: NOTICE_CERTIFIED
        trigger: "POST /maintenance-visits/{maintenanceVisitId}/certify_notice"
        actor: PropertyManager
        preconditions:
          - "maintenance_visit.status == REQUESTED"
          - "notice_mailed_at <= start_at - (REQUIRED_NOTICE_HOURS_EMERGENCY if is_emergency else REQUIRED_NOTICE_HOURS_STANDARD)"
          - "start_at local hour in [NOTICE_WINDOW_OPEN_HOUR, NOTICE_WINDOW_CLOSE_HOUR)"
        side_effects:
          - "maintenance_visit.status -> NOTICE_CERTIFIED"
          - "maintenance_visit.accrued_cost_cents -> provisional accrual"
          - "property.budget_committed_cents -> recompute"
      - from: NOTICE_CERTIFIED
        to: COMPLETED
        trigger: "POST /maintenance-visits/{maintenanceVisitId}/complete"
        actor: MaintenanceTechnician
        preconditions:
          - "maintenance_visit.status == NOTICE_CERTIFIED"
          - "actual_hours > 0"
        side_effects:
          - "maintenance_visit.accrued_cost_cents -> final accrual"
          - "property.budget_committed_cents -> recompute (final)"
      - from: NOTICE_CERTIFIED
        to: CANCELLED
        trigger: "POST /maintenance-visits/{maintenanceVisitId}/complete (cancelled before work)"
        actor: PropertyManager
        preconditions:
          - "maintenance_visit.status == NOTICE_CERTIFIED"
        side_effects:
          - "maintenance_visit.accrued_cost_cents -> 0"
          - "property.budget_committed_cents -> recompute"

# -----------------------------------------------------------------------------
# Concurrency rules (§1.2.1) — true races only, resolved by OCC on parent.version
# -----------------------------------------------------------------------------
concurrency_rules:
  - rule_id: wo-create-stale-alert
    parent_entity: DeviceAlert
    write_endpoint: "POST /device-alerts/{deviceAlertId}/work-orders"
    occ_field: "expected_device_alert_version"
    description: |
      Opening a WorkOrder against a DeviceAlert whose version has advanced
      since the client last observed it is rejected. This captures the case
      where a scan (or an assign) has just mutated the alert — resolving or
      acknowledging it — so the current writer's view of the alert is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: job-create-stale-building
    parent_entity: Building
    write_endpoint: "POST /buildings/{buildingId}/installation-jobs"
    occ_field: "expected_building_version"
    description: |
      Creating an InstallationJob against a Building whose version has advanced
      since the client last observed it is rejected. This captures the case
      where another writer has just changed the building's connectivity or
      scheduled another job, so the current writer's view of the building is
      stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# Table 3: Calculation Rules Table (§1.3)
# =============================================================================
calculations:
  - name: vacant_unit_setpoint_c
    trigger: "POST /units/{unitId}/vacant-automation, and the NOTICE_ENDED -> VACANT transition"
    algorithm: threshold
    formula: |
      forecast = window_forecast_c
      humidity  = relative_humidity_pct
      base = DEFAULT_VACANT_SETPOINT_C
      if relative_humidity_pct >= HUMIDITY_STRESS_THRESHOLD_PCT and forecast >= 27: return clamp(24.0, SETPOINT_MIN_C, SETPOINT_MAX_C)
      if forecast >= HOT_FORECAST_THRESHOLD_C: base = HOT_VACANT_SETPOINT_C
      result = clamp(base, SETPOINT_MIN_C, SETPOINT_MAX_C)
      return result
    input_set: "Unit in occupancy_status NOTICE_ENDED or VACANT; reads the caller-supplied window forecast for the unit's building"
    constants:
      DEFAULT_VACANT_SETPOINT_C: 26.0
      HOT_VACANT_SETPOINT_C: 27.0
      HOT_FORECAST_THRESHOLD_C: 30
      SETPOINT_MIN_C: 15
      SETPOINT_MAX_C: 27
      OCCUPIED_SETPOINT_C: 22.0
      HUMIDITY_STRESS_THRESHOLD_PCT: 60
    precision: "1 decimal place, round_half_up"
    variants:
      - name: base
        when: "relative_humidity_pct < HUMIDITY_STRESS_THRESHOLD_PCT or forecast < 27"
        difference: "uses DEFAULT/HOT vacant setpoint only; humidity ignored"
      - name: humid_stress
        when: "relative_humidity_pct >= HUMIDITY_STRESS_THRESHOLD_PCT and forecast >= 27"
        difference: "dehumidification override: result = clamp(24.0, SETPOINT_MIN_C, SETPOINT_MAX_C) regardless of the HOT clamp"

  - name: maintenance_budget_accrual_cents
    trigger: "POST /maintenance-visits/{maintenanceVisitId}/certify_notice (provisional) and /complete (final)"
    algorithm: aggregation
    formula: |
      hours = planned_hours if not finalised else actual_hours
      cost = BASE_VISIT_CENTS
      if is_emergency: cost += EMERGENCY_SURCHARGE_CENTS
      cost += ceil(hours) * HOURLY_CENTS
      return cost
    input_set: "MaintenanceVisit rows on the property whose status in {NOTICE_CERTIFIED, COMPLETED}; CANCELLED rows excluded and reset to 0"
    constants:
      BASE_VISIT_CENTS: 2000
      EMERGENCY_SURCHARGE_CENTS: 1500
      HOURLY_CENTS: 700
    precision: "integer cents, exact"
    variants:
      - name: provisional
        when: "status == NOTICE_CERTIFIED (visit not yet completed)"
        difference: "uses ceil(planned_hours); superseded on completion"
      - name: final
        when: "status == COMPLETED"
        difference: "uses ceil(actual_hours); the provisional value is replaced, not added"

  - name: device_battery_health_score
    trigger: "POST /buildings/{buildingId}/device-scans"
    algorithm: weighted_scoring
    formula: |
      firmware_score = {LATEST: 100, OLD: 40, CRITICAL: 0}[firmware_version]
      alert_score = max(0, 100 - 25 * open_alert_count)
      t1 = round(0.5 * battery_pct, 1)
      t2 = round(0.3 * firmware_score, 1)
      t3 = round(0.2 * alert_score, 1)
      return round(t1 + t2 + t3, 1)
    input_set: "All Device rows in the building whose status != DECOMMISSIONED; open_alert_count counts DeviceAlert rows with status OPEN for the device"
    constants:
      W_BATTERY: 0.5
      W_FIRMWARE: 0.3
      W_ALERTS: 0.2
      ALERT_PENALTY_PER_OPEN: 25
    precision: "1 decimal place, round per weighted term then sum (round-half-up) — order is pinned"

  - name: building_connectivity_ok
    trigger: "POST /buildings/{buildingId}/installation-jobs and POST /installation-jobs/{installationJobId}/complete"
    algorithm: threshold
    formula: |
      threshold = {POINT_TO_POINT: NET_RSSI_THRESHOLD_DBM_POINT_TO_POINT, FIELD_MESH: NET_RSSI_THRESHOLD_DBM_FIELD_MESH, HUB_RELAY: NET_RSSI_THRESHOLD_DBM_HUB_RELAY}[network_design]
      effective = wifi_rssi_dbm - age_penalty
      age_penalty = 0 if last_hub_service_at is null else floor(AGE_PENALTY_DB_PER_DAY * days(last_hub_service_at, logical clock))
      return effective >= threshold
    input_set: "Building; the boundary is inclusive on the strong side (rssi == threshold counts as connected)"
    constants:
      AGE_PENALTY_DB_PER_DAY: 0.1
    precision: "exact dBm comparison, no rounding"
    variants:
      - name: base
        when: "last_hub_service_at is null"
        difference: "age_penalty = 0; raw wifi_rssi_dbm compared to threshold"
      - name: service_adjusted
        when: "last_hub_service_at is set"
        difference: "age_penalty subtracted before the threshold comparison, so the same raw rssi can flip connectivity"

  - name: installation_labor_hours
    trigger: "POST /installation-jobs/{installationJobId}/complete"
    algorithm: constraint_propagation
    formula: |
      # evaluation order pinned: base -> tier -> rework -> total
      base = {SMART_LOCK: 0.5, THERMOSTAT: 0.4, LEAK_SENSOR: 0.25, COMMUNITY_ACCESS: 0.75, HUB: 1.0}[device_type]
      tier = "SIMPLE" if base < 1.0 else "STANDARD"
      rework = 0.0 if tier == "SIMPLE" else base * 0.25
      total = base + rework
      return round(total, 2)
    input_set: "A single InstallationJob; base depends on device_type; the rework surcharge is keyed on the tier derived from base (evaluation order is pinned above: base before tier before rework before total)"
    constants:
      TIER_THRESHOLD_HOURS: 1.0
      REWORK_RATE: 0.25
    precision: "2 decimal places, round_half_up"

  - name: resident_credential_conservation
    trigger: "recomputed after every AccessCredential mutation"
    algorithm: aggregation
    formula: |
      issued_total = active + expired + revoked
      return issued_total
    input_set: "All AccessCredential rows for one resident (or one unit); counts are over the full set, never a filtered window"
    constants: {}
    precision: "integer count, exact"
    variants:
      - name: per_resident
        when: "scoped by subject_resident_id"
        difference: "counts only credentials belonging to the resident (guest/tour credentials excluded)"
      - name: per_unit
        when: "scoped by unit_id"
        difference: "counts every credential on the unit, including GUEST and TOUR types"

# =============================================================================
# Table 4: Validation Rules Table, ordered by priority (§1.4)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and the role recognized"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "the calling role is permitted for this operation per the RBAC matrix"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: business_constraint
    check: "the request body is well-formed: no missing required field and no unknown field"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all endpoints with a body"
  - priority: 4
    category: existence
    check: "every resource referenced by the path exists, validated left-to-right (ERR_PROPERTY_NOT_FOUND / ERR_BUILDING_NOT_FOUND / ERR_UNIT_NOT_FOUND / ERR_DEVICE_NOT_FOUND / ERR_RESIDENT_NOT_FOUND / ERR_GUEST_PASS_NOT_FOUND / ERR_TOUR_SESSION_NOT_FOUND / ERR_MAINTENANCE_VISIT_NOT_FOUND / ERR_INSTALLATION_JOB_NOT_FOUND / ERR_DEVICE_ALERT_NOT_FOUND / ERR_WORK_ORDER_NOT_FOUND)"
    error_id: ERR_DEVICE_NOT_FOUND
    http_status: 404
    applies_to: "all path resources"
  - priority: 5
    category: state
    check: "the target resource is in a state from which this trigger's transition is declared"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "POST /tour-sessions/{tourSessionId}/verify, POST /work-orders/{workOrderId}/assign, POST /installation-jobs/{installationJobId}/schedule, POST /maintenance-visits/{maintenanceVisitId}/certify_notice, POST /maintenance-visits/{maintenanceVisitId}/complete, POST /guest-passes/{guestPassId}/extend, POST /residents/{residentId}/onboard"
  - priority: 6
    category: state
    check: "the target resource is not already in a terminal state"
    error_id: ERR_ALREADY_TERMINAL
    http_status: 409
    applies_to: "POST /work-orders/{workOrderId}/assign (CLOSED), POST /tour-sessions/{tourSessionId}/verify (COMPLETED), POST /maintenance-visits/{maintenanceVisitId}/complete (CANCELLED), POST /guest-passes/{guestPassId}/extend (REVOKED)"
  - priority: 7
    category: state
    check: "an operation that acts on a resident's unit requires that resident to be in a state other than REVOKED"
    error_id: ERR_RESIDENT_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /units/{unitId}/guest-passes, POST /guest-passes/{guestPassId}/extend"
  - priority: 8
    category: state
    check: "the tour session is in a non-terminal state on which verify is declared (REQUESTED, DENIED or VERIFIED)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "POST /tour-sessions/{tourSessionId}/verify"
  - priority: 9
    category: state
    check: "the tour session's verification window (requested_start_at + IDENTITY_VERIFICATION_TTL_MINUTES) has not elapsed"
    error_id: ERR_IDENTITY_VERIFICATION_EXPIRED
    http_status: 409
    applies_to: "POST /tour-sessions/{tourSessionId}/verify"
  - priority: 10
    category: business_temporal
    check: "legal notice was served at least REQUIRED_NOTICE_HOURS_EMERGENCY (emergency) or REQUIRED_NOTICE_HOURS_STANDARD (non-emergency) before the visit start"
    error_id: ERR_NOTICE_REQUIREMENT_UNMET
    http_status: 409
    applies_to: "POST /maintenance-visits/{maintenanceVisitId}/certify_notice"
  - priority: 11
    category: business_temporal
    check: "the visit start falls inside the legal notice window [NOTICE_WINDOW_OPEN_HOUR, NOTICE_WINDOW_CLOSE_HOUR)"
    error_id: ERR_OUTSIDE_NOTICE_WINDOW
    http_status: 422
    applies_to: "POST /maintenance-visits/{maintenanceVisitId}/certify_notice"
  - priority: 12
    category: business_temporal
    check: "the requested window does not overlap an existing occupation of the same resource under that resource's interval semantics"
    error_id: ERR_UNIT_SCHEDULE_CONFLICT
    http_status: 409
    applies_to: "POST /units/{unitId}/guest-passes, POST /units/{unitId}/maintenance-visits, POST /installation-jobs/{installationJobId}/schedule"
  - priority: 13
    category: business_safety
    check: "the unit's building has connectivity_ok == true and at least one ONLINE smart lock is present on the unit"
    error_id: ERR_INSUFFICIENT_CONNECTIVITY
    http_status: 409
    applies_to: "POST /residents/{residentId}/onboard, POST /installation-jobs/{installationJobId}/complete"
  - priority: 14
    category: business_safety
    check: "a HUB installation requires the target building to already pass connectivity_ok"
    error_id: ERR_NO_HUB_CONNECTIVITY
    http_status: 409
    applies_to: "POST /buildings/{buildingId}/installation-jobs (device_type == HUB)"
  - priority: 15
    category: business_safety
    check: "the device whose battery is being replaced is reachable (status == ONLINE)"
    error_id: ERR_DEVICE_UNREACHABLE
    http_status: 409
    applies_to: "POST /devices/{deviceId}/replace_battery"
  - priority: 16
    category: business_referential
    check: "the credential's subject and validity window are consistent with the target unit's occupancy, resident state and status"
    error_id: ERR_CREDENTIAL_OUT_OF_SCOPE
    http_status: 409
    applies_to: "POST /units/{unitId}/guest-passes, POST /tour-sessions/{tourSessionId}/verify, POST /guest-passes/{guestPassId}/extend"
  - priority: 17
    category: business_referential
    check: "the supplied identity document matches the tour session's prospect identity document"
    error_id: ERR_IDENTITY_VERIFICATION_FAILED
    http_status: 422
    applies_to: "POST /tour-sessions/{tourSessionId}/verify"
  - priority: 18
    category: business_constraint
    check: "a supplied setpoint_override_c lies within [SETPOINT_MIN_C, SETPOINT_MAX_C] (the computed setpoint is already clamped, so only the override can violate)"
    error_id: ERR_SETPOINT_OUT_OF_RANGE
    http_status: 422
    applies_to: "POST /units/{unitId}/vacant-automation"
  - priority: 19
    category: business_constraint
    check: "the unit's unit_number is unique within its property"
    error_id: ERR_DUPLICATE_UNIT_NUMBER
    http_status: 409
    applies_to: "POST /properties/{propertyId}/units"
  - priority: 20
    category: business_fiscal
    check: "committing or reserving this operation keeps Property.budget_committed_cents <= Property.temp_budget_cents_per_day"
    error_id: ERR_BUDGET_EXCEEDED
    http_status: 409
    applies_to: "POST /maintenance-visits/{maintenanceVisitId}/certify_notice, POST /installation-jobs/{installationJobId}/complete, POST /buildings/{buildingId}/installation-jobs"
  - priority: 21
    category: business_referential
    check: "the caller-supplied expected_<parent>_version equals the parent's current version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /device-alerts/{deviceAlertId}/work-orders, POST /buildings/{buildingId}/installation-jobs"

# =============================================================================
# Response Envelope (FIXED — §1.0)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# Table 5: API Endpoint Table (§1.5)
# =============================================================================
endpoints:
  # --- Property / Building / Unit ---
  - method: POST
    path: "/properties"
    description: "Create a property"
    roles: [PlatformAdmin]
    code: 201
    input:
      - name
      - address_line
      - unit_capacity?
      - temp_budget_cents_per_day?
    output: Property
    side_effects: ["budget_committed_cents=0"]
  - method: GET
    path: "/properties/{propertyId}"
    description: "Get a property"
    roles: [PlatformAdmin, PropertyManager]
    code: 200
    input: []
    output: Property
    side_effects: []
  - method: POST
    path: "/properties/{propertyId}/buildings"
    description: "Create a building within a property"
    roles: [PlatformAdmin]
    code: 201
    input:
      - name
      - network_design
      - wifi_rssi_dbm
      - last_hub_service_at?
    output: Building
    side_effects: ["connectivity_ok recomputed from wifi_rssi_dbm and last_hub_service_at"]
  - method: GET
    path: "/buildings"
    description: "List buildings, optionally filtered by property"
    roles: [PlatformAdmin, PropertyManager, HardwareTechnician]
    code: 200
    input:
      - property_id?
    output: Building[]
    side_effects: []
  - method: POST
    path: "/properties/{propertyId}/units"
    description: "Create a unit within a property"
    roles: [PlatformAdmin, PropertyManager]
    code: 201
    input:
      - unit_number
      - building_id?
      - pod_entry_window_start?
      - pod_entry_window_end?
    output: Unit
    side_effects: ["occupancy_status=VACANT, hvac_mode=VACANT_AUTO, target_setpoint_c=26.0"]
  - method: GET
    path: "/units"
    description: "List units, optionally filtered"
    roles: [PlatformAdmin, PropertyManager, HardwareTechnician, LeasingAgent]
    code: 200
    input:
      - property_id?
      - building_id?
      - occupancy_status?
    output: Unit[]
    side_effects: []

  # --- Devices ---
  - method: POST
    path: "/devices"
    description: "Provision a device"
    roles: [PlatformAdmin, HardwareTechnician]
    code: 201
    input:
      - device_type
      - unit_id?
      - building_id
      - firmware_version
      - battery_pct?
    output: Device
    side_effects: ["status=PROVISIONED, lock_state=LOCKED, battery_replacements=0"]
  - method: GET
    path: "/devices"
    description: "List devices, optionally filtered"
    roles: [PlatformAdmin, PropertyManager, HardwareTechnician]
    code: 200
    input:
      - unit_id?
      - building_id?
    output: Device[]
    side_effects: []
  - method: POST
    path: "/devices/{deviceId}/replace_battery"
    description: "Replace a device battery (device must be ONLINE)"
    roles: [HardwareTechnician]
    code: 200
    input: []
    output: Device
    side_effects: ["battery_pct=100", "battery_replacements = battery_replacements + 1", "any OPEN DeviceAlert{LOW_BATTERY} for the device resolved"]
  - method: POST
    path: "/devices/{deviceId}/lock-events"
    description: "Record a lock open/close event; an uncredentialed open on a vacant unit raises an UNAUTHORIZED_ENTRY alert"
    roles: [HardwareTechnician, PropertyManager]
    code: 200
    input:
      - event_type
      - credential_code?
    output: Device
    side_effects: ["lock_state -> UNLOCKED/LOCKED", "unauthorized open on a vacant unit sets unit.unauthorized_entry_detected=true and raises a DeviceAlert{UNAUTHORIZED_ENTRY, HIGH}"]

  - method: POST
    path: "/buildings/{buildingId}/device-scans"
    description: "Run a reachability scan over a building's devices"
    roles: [PlatformAdmin, HardwareTechnician]
    code: 200
    input:
      - reachable_device_ids
      - window_forecast_c?
      - relative_humidity_pct?
    output: DeviceAlert[]
    side_effects: ["devices absent from reachable_device_ids -> UNREACHABLE and OFFLINE (HIGH) alerts raised; reachable devices with battery_pct < LOW_BATTERY_ALERT_PCT raise LOW_BATTERY (MEDIUM) alerts", "devices present -> ONLINE and their OFFLINE alerts resolved", "battery_pct decremented by BATTERY_DRAIN_PER_SCAN on unreachable devices", "device_battery_health_score recomputed"]

  # --- Residents / credentials ---
  - method: POST
    path: "/residents"
    description: "Create a resident (leases a unit)"
    roles: [PlatformAdmin, PropertyManager]
    code: 201
    input:
      - property_id
      - unit_id
      - full_name
      - email
    output: Resident
    side_effects: ["status=PENDING_CREDENTIAL, portal_credential_status=NOT_ISSUED", "unit.occupancy_status -> OCCUPIED"]
  - method: GET
    path: "/residents"
    description: "List residents, optionally filtered"
    roles: [PlatformAdmin, PropertyManager]
    code: 200
    input:
      - property_id?
      - unit_id?
    output: Resident[]
    side_effects: []
  - method: POST
    path: "/residents/{residentId}/onboard"
    description: "Onboard a resident and issue app credentials"
    roles: [PropertyManager]
    code: 200
    input: []
    output: Resident
    side_effects: ["creates an ACTIVE AccessCredential", "portal_credential_status -> ACTIVE", "appends a ResidentStatusEvent", "resident.version incremented"]
  - method: POST
    path: "/residents/{residentId}/deactivate"
    description: "Deactivate a resident (move-out) and revoke credentials"
    roles: [PropertyManager]
    code: 200
    input:
      - notice_end_at
    output: Resident
    side_effects: ["all live AccessCredentials for the resident -> REVOKED", "unit.occupancy_status -> NOTICE", "host's ACTIVE GuestPasses -> REVOKED", "appends a ResidentStatusEvent"]
  - method: GET
    path: "/resident-status-events"
    description: "List resident status events, optionally filtered"
    roles: [PlatformAdmin, PropertyManager]
    code: 200
    input:
      - resident_id?
    output: ResidentStatusEvent[]
    side_effects: []
  - method: GET
    path: "/access-credentials"
    description: "List access credentials, optionally filtered"
    roles: [PlatformAdmin, PropertyManager]
    code: 200
    input:
      - unit_id?
      - subject_resident_id?
    output: AccessCredential[]
    side_effects: []

  # --- Guest passes ---
  - method: POST
    path: "/units/{unitId}/guest-passes"
    description: "Issue a guest pass for a unit"
    roles: [PropertyManager, Resident]
    code: 201
    input:
      - host_resident_id
      - guest_label
      - start_at
      - end_at
    output: GuestPass
    side_effects: ["status=ACTIVE", "an AccessCredential{credential_type: GUEST} created"]
  - method: POST
    path: "/guest-passes/{guestPassId}/extend"
    description: "Extend an expired guest pass"
    roles: [PropertyManager, Resident]
    code: 200
    input:
      - new_end_at
    output: GuestPass
    side_effects: ["status -> ACTIVE when the pass was EXPIRED", "end_at -> new_end_at"]
  - method: GET
    path: "/guest-passes"
    description: "List guest passes, optionally filtered"
    roles: [PlatformAdmin, PropertyManager, Resident]
    code: 200
    input:
      - unit_id?
      - host_resident_id?
    output: GuestPass[]
    side_effects: []

  # --- Tours ---
  - method: POST
    path: "/units/{unitId}/tour-sessions"
    description: "Request a self-guided tour of a vacant unit"
    roles: [PropertyManager, LeasingAgent]
    code: 201
    input:
      - prospect_name
      - prospect_id_document
      - requested_start_at
      - duration_minutes?
    output: TourSession
    side_effects: ["status=REQUESTED, verify_attempts=0"]
  - method: POST
    path: "/tour-sessions/{tourSessionId}/verify"
    description: "Verify prospect identity and issue a time-bounded tour credential"
    roles: [LeasingAgent]
    code: 200
    input:
      - identity_document_number
    output: TourSession
    side_effects: ["status -> VERIFIED on success or DENIED on failure", "verify_attempts incremented", "on success creates an ACTIVE TOUR AccessCredential"]
  - method: GET
    path: "/tour-sessions"
    description: "List tour sessions, optionally filtered"
    roles: [PropertyManager, LeasingAgent]
    code: 200
    input:
      - unit_id?
    output: TourSession[]
    side_effects: []

  # --- Maintenance ---
  - method: POST
    path: "/units/{unitId}/maintenance-visits"
    description: "Request a maintenance visit (optionally emergency)"
    roles: [PropertyManager, MaintenanceTechnician]
    code: 201
    input:
      - technician_id
      - start_at
      - end_at
      - is_emergency?
    output: MaintenanceVisit
    side_effects: ["status=REQUESTED, accrued_cost_cents=0"]
  - method: POST
    path: "/maintenance-visits/{maintenanceVisitId}/certify_notice"
    description: "Certify that legal notice was served and accept the visit"
    roles: [PropertyManager]
    code: 200
    input:
      - notice_mailed_at
    output: MaintenanceVisit
    side_effects: ["status -> NOTICE_CERTIFIED", "accrued_cost_cents -> provisional", "property.budget_committed_cents recomputed"]
  - method: POST
    path: "/maintenance-visits/{maintenanceVisitId}/complete"
    description: "Complete or cancel a certified maintenance visit"
    roles: [PropertyManager, MaintenanceTechnician]
    code: 200
    input:
      - actual_hours?
      - cancelled?
    output: MaintenanceVisit
    side_effects: ["status -> COMPLETED (final accrual) or CANCELLED (accrual reset to 0)", "property.budget_committed_cents recomputed"]
  - method: GET
    path: "/maintenance-visits"
    description: "List maintenance visits, optionally filtered"
    roles: [PropertyManager, MaintenanceTechnician]
    code: 200
    input:
      - unit_id?
      - technician_id?
    output: MaintenanceVisit[]
    side_effects: []

  # --- Installation jobs ---
  - method: POST
    path: "/buildings/{buildingId}/installation-jobs"
    description: "Create an installation job for a device; reserves an estimated cost against the property budget"
    roles: [PropertyManager, HardwareTechnician]
    code: 201
    input:
      - device_type
      - unit_id?
      - requires_resident_coordination?
      - access_window_start
      - access_window_end
      - expected_building_version
    output: InstallationJob
    side_effects: ["status=SCHEDULED", "reserves ESTIMATED_JOB_RESERVE_CENTS on property.budget_committed_cents", "increments Building.version by 1"]
  - method: POST
    path: "/installation-jobs/{installationJobId}/schedule"
    description: "Start (check in) a scheduled installation job"
    roles: [HardwareTechnician]
    code: 200
    input:
      - scheduled_start_at?
    output: InstallationJob
    side_effects: ["status -> IN_PROGRESS", "creates a PROVISIONED Device for the target", "property.budget_committed_cents recomputed"]
  - method: POST
    path: "/installation-jobs/{installationJobId}/complete"
    description: "Complete an in-progress installation job"
    roles: [HardwareTechnician]
    code: 200
    input: []
    output: InstallationJob
    side_effects: ["status -> COMPLETED when connectivity_ok else ABORTED", "labor_hours recomputed", "synthesized device -> ONLINE or DECOMMISSIONED"]
  - method: GET
    path: "/installation-jobs"
    description: "List installation jobs, optionally filtered"
    roles: [PropertyManager, HardwareTechnician]
    code: 200
    input:
      - property_id?
      - building_id?
      - unit_id?
    output: InstallationJob[]
    side_effects: []

  # --- Alerts / work orders ---
  - method: GET
    path: "/device-alerts"
    description: "List device alerts, optionally filtered"
    roles: [PlatformAdmin, PropertyManager, HardwareTechnician]
    code: 200
    input:
      - building_id?
      - device_id?
    output: DeviceAlert[]
    side_effects: []
  - method: POST
    path: "/device-alerts/{deviceAlertId}/work-orders"
    description: "Open a work order against an alert"
    roles: [PropertyManager, HardwareTechnician]
    code: 201
    input:
      - assigned_technician_id?
      - expected_device_alert_version
    output: WorkOrder
    side_effects: ["status=OPEN", "increments DeviceAlert.version by 1"]
  - method: POST
    path: "/work-orders/{workOrderId}/assign"
    description: "Assign a technician and progress the work order"
    roles: [HardwareTechnician]
    code: 200
    input:
      - technician_id
      - replaced_battery?
      - confirm_repair?
    output: WorkOrder
    side_effects: ["status OPEN -> ASSIGNED -> CLOSED", "parent DeviceAlert -> ACKNOWLEDGED then RESOLVED", "device.battery_replacements incremented when replaced_battery"]
  - method: GET
    path: "/work-orders"
    description: "List work orders, optionally filtered"
    roles: [PropertyManager, HardwareTechnician]
    code: 200
    input:
      - device_id?
      - alert_id?
    output: WorkOrder[]
    side_effects: []

  # --- Vacant automation ---
  - method: POST
    path: "/units/{unitId}/vacant-automation"
    description: "Run vacant-unit automation for a unit; an optional setpoint_override_c is validated against [SETPOINT_MIN_C, SETPOINT_MAX_C] before use"
    roles: [PropertyManager]
    code: 200
    input:
      - window_forecast_c
      - relative_humidity_pct
      - setpoint_override_c?
    output: Unit
    side_effects: ["target_setpoint_c recomputed via vacant_unit_setpoint_c", "hvac_mode -> VACANT_AUTO", "NOTICE_ENDED -> VACANT when no ACTIVE resident"]

  # --- Test-driving ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the logical clock. Default at startup is 2026-09-01T00:00:00Z; before any call the clock reads exactly that instant and never falls back to wall-clock time."
    roles: [PlatformAdmin]
    code: 200
    input:
      - current_utc
    output: null
    side_effects: ["expires credentials and guest passes whose valid_until/end_at <= clock", "advances unit NOTICE -> NOTICE_ENDED and VERIFIED/ACTIVE tour sessions"]

# =============================================================================
# Table 6: Error Code Catalog (§1.6)
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "X-User-Role/X-User-ID headers missing or unrecognized" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "calling role is not permitted for this operation" }
  - { id: ERR_PROPERTY_NOT_FOUND, http: 404, condition: "property id in path does not exist" }
  - { id: ERR_BUILDING_NOT_FOUND, http: 404, condition: "building id in path does not exist" }
  - { id: ERR_UNIT_NOT_FOUND, http: 404, condition: "unit id in path does not exist" }
  - { id: ERR_DEVICE_NOT_FOUND, http: 404, condition: "device id in path does not exist" }
  - { id: ERR_RESIDENT_NOT_FOUND, http: 404, condition: "resident id in path does not exist" }
  - { id: ERR_GUEST_PASS_NOT_FOUND, http: 404, condition: "guest pass id in path does not exist" }
  - { id: ERR_TOUR_SESSION_NOT_FOUND, http: 404, condition: "tour session id in path does not exist" }
  - { id: ERR_MAINTENANCE_VISIT_NOT_FOUND, http: 404, condition: "maintenance visit id in path does not exist" }
  - { id: ERR_INSTALLATION_JOB_NOT_FOUND, http: 404, condition: "installation job id in path does not exist" }
  - { id: ERR_DEVICE_ALERT_NOT_FOUND, http: 404, condition: "device alert id in path does not exist" }
  - { id: ERR_WORK_ORDER_NOT_FOUND, http: 404, condition: "work order id in path does not exist" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "target resource is not in a state from which this trigger's transition is declared" }
  - { id: ERR_ALREADY_TERMINAL, http: 409, condition: "target resource is in a terminal state and cannot transition further" }
  - { id: ERR_DEVICE_UNREACHABLE, http: 409, condition: "the device required by this operation is UNREACHABLE" }
  - { id: ERR_INSUFFICIENT_CONNECTIVITY, http: 409, condition: "the unit's building fails the connectivity_ok threshold, or no ONLINE smart lock is present" }
  - { id: ERR_NO_HUB_CONNECTIVITY, http: 409, condition: "no device in the building can reach a hub under any design threshold" }
  - { id: ERR_UNIT_SCHEDULE_CONFLICT, http: 409, condition: "the requested window overlaps an existing occupation of the unit under its interval semantics" }
  - { id: ERR_NOTICE_REQUIREMENT_UNMET, http: 409, condition: "notice was served less than the required lead time before the visit start" }
  - { id: ERR_OUTSIDE_NOTICE_WINDOW, http: 422, condition: "the visit start falls outside the legal notice window hours" }
  - { id: ERR_IDENTITY_VERIFICATION_FAILED, http: 422, condition: "the supplied identity document does not match the tour session's prospect document" }
  - { id: ERR_IDENTITY_VERIFICATION_EXPIRED, http: 409, condition: "the tour session's verification window elapsed before verification" }
  - { id: ERR_SETPOINT_OUT_OF_RANGE, http: 422, condition: "the requested setpoint lies outside [SETPOINT_MIN_C, SETPOINT_MAX_C]" }
  - { id: ERR_CREDENTIAL_OUT_OF_SCOPE, http: 409, condition: "the credential subject/validity window is inconsistent with the unit's occupancy or status" }
  - { id: ERR_RESIDENT_NOT_ACTIVE, http: 409, condition: "an operation requires an ACTIVE resident but the resident is in another state" }
  - { id: ERR_BUDGET_EXCEEDED, http: 409, condition: "committing this operation would exceed the property's committed budget" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "the supplied expected_<parent>_version does not match the parent's current version" }
  - { id: ERR_DUPLICATE_UNIT_NUMBER, http: 409, condition: "a unit with the same unit_number already exists in the property" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "the request body is missing a required field or carries an unknown field" }

# =============================================================================
# Table 7: RBAC Matrix (§1.7)
# =============================================================================
roles:
  - name: PlatformAdmin
    description: "SmartRent platform operator; provisions properties, buildings and devices across all tenants"
    identity: opaque
    exclusive_operations:
      - "POST /properties"
      - "POST /properties/{propertyId}/buildings"
    shared_operations:
      - "GET /properties/{propertyId}"
      - "GET /buildings"
      - "GET /units"
      - "POST /properties/{propertyId}/units"
      - "POST /devices"
      - "GET /devices"
      - "POST /buildings/{buildingId}/device-scans"
      - "POST /residents"
      - "GET /residents"
      - "GET /resident-status-events"
      - "GET /access-credentials"
      - "GET /guest-passes"
      - "GET /device-alerts"
  - name: PropertyManager
    description: "On-site property staff who onboard residents, schedule tours and maintenance, and run vacant automation"
    identity: opaque
    exclusive_operations:
      - "POST /residents/{residentId}/onboard"
      - "POST /residents/{residentId}/deactivate"
      - "POST /maintenance-visits/{maintenanceVisitId}/certify_notice"
      - "POST /units/{unitId}/vacant-automation"
    shared_operations:
      - "POST /units/{unitId}/guest-passes"
      - "POST /units/{unitId}/maintenance-visits"
      - "POST /maintenance-visits/{maintenanceVisitId}/complete"
      - "POST /buildings/{buildingId}/installation-jobs"
      - "GET /units"
      - "GET /residents"
      - "GET /device-alerts"
  - name: HardwareTechnician
    description: "Field technician who installs devices, replaces batteries and closes work orders"
    identity: opaque
    exclusive_operations:
      - "POST /devices/{deviceId}/replace_battery"
      - "POST /installation-jobs/{installationJobId}/schedule"
      - "POST /installation-jobs/{installationJobId}/complete"
      - "POST /work-orders/{workOrderId}/assign"
    shared_operations:
      - "POST /devices"
      - "POST /buildings/{buildingId}/device-scans"
      - "POST /buildings/{buildingId}/installation-jobs"
      - "GET /installation-jobs"
      - "GET /work-orders"
  - name: MaintenanceTechnician
    description: "In-house maintenance technician who performs unit visits"
    identity: opaque
    exclusive_operations: []
    shared_operations:
      - "POST /units/{unitId}/maintenance-visits"
      - "POST /maintenance-visits/{maintenanceVisitId}/complete"
      - "GET /maintenance-visits"
  - name: LeasingAgent
    description: "Leasing staff who request and verify self-guided tours"
    identity: opaque
    exclusive_operations:
      - "POST /tour-sessions/{tourSessionId}/verify"
    shared_operations:
      - "POST /units/{unitId}/tour-sessions"
      - "GET /tour-sessions"
      - "GET /units"
  - name: Resident
    description: "Unit resident who manages guest passes on their own unit"
    identity: entity_backed:Resident
    exclusive_operations: []
    shared_operations:
      - "POST /units/{unitId}/guest-passes"
      - "POST /guest-passes/{guestPassId}/extend"
      - "GET /guest-passes"