      - name: err_income_record_state_invalid_on_second_verification
        claim_type: error_triggerable
        grounds:
          - errors.ERR_INCOME_RECORD_STATE_INVALID
          - validations[priority=60,ERR_INCOME_RECORD_STATE_INVALID]
          - state_machines.IncomeRecord
        distinguishing_aspect: |
          Verification is a one-shot transition out of UNVERIFIED: a second decision on the SAME record
          is rejected with ERR_INCOME_RECORD_STATE_INVALID whether the record landed in VERIFIED or in
          REJECTED, and the rejection does not disturb verification_status or verified_by_user_id. An
          implementation that treats verify as idempotent would return 200 and rewrite
          verified_by_user_id to the second caller.
        test_recipe:
          setup:
            - "One Resident admitted 2026-08-01 into a CERTIFIED NURSING unit of a RECOGNIZED home."
            - "Two IncomeRecord rows for effective_month 2026-08: SSA 114000 (countable rate 10000 bps) and VA_COMPENSATION 50000 (countable rate 8000 bps)."
