        0 and skipped_count 3, because the transition's precondition admits both CONTRACTED and REGISTRATION_OPEN.
  - name: cross_reference_links_require_both_rows_and_scope_agreement_across_aggregates
    claim_type: cross_reference_link
    grounds:
    - §1.4 priority 31 ERR_PROGRAM_SCOPE_MISMATCH
    - §1.4 priority 5 (body foreign keys)
    - §1.1 SupplierContract.destination_id, TaxAwardReport.tax_year, Registration.guest_of_registration_id
    - §1.0 relationship_patterns cross_aggregate, self_referential
    distinguishing_aspect: |
      The flat topology in §1.0 means every relationship is a body foreign key, and the danger that creates is a link that resolves yet crosses an aggregate boundary. Priority 31 is the rule that closes it, and this is the only instance that drives it: a destination that exists but belongs to another program, and a tax year that is a valid integer but does not match the qualifier's program fiscal_year. Both probes are paired with the existence-before-scope ordering, so a dangling id still returns 404 rather than 422. The third link exercised is the self-referential one, where the accepted GUEST row proves a correct link produces a navigable association in both directions.
