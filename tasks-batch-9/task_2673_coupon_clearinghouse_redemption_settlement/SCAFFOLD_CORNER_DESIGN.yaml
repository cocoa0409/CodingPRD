  # =====================================================================
  # Table 6 — Errors
  # =====================================================================
  - section: errors
    instances:

      - name: every_not_found_code_in_the_catalog_is_reachable
        claim_type: triggerable
        grounds:
          - errors.ERR_MANUFACTURER_NOT_FOUND
          - errors.ERR_RETAILER_NOT_FOUND
          - errors.ERR_COUPON_ITEM_NOT_FOUND
          - errors.ERR_PURCHASE_RECORD_NOT_FOUND
          - errors.ERR_STATEMENT_NOT_FOUND
          - errors.ERR_INVOICE_NOT_FOUND
          - errors.ERR_DISPUTE_NOT_FOUND
          - errors.ERR_CLIP_NOT_FOUND
          - errors.ERR_REDEMPTION_EVENT_NOT_FOUND
        distinguishing_aspect: |
          One well-formed but unknown uuid probed against every single-entity GET
          in §1.5, from an opaque staff role that passes the priority-2 and
          priority-4 gates. Each family must answer with its OWN code and a 404 —
          a shared generic ERR_INVALID_REQUEST or a 200 with data null fails this
          claim. This is the catalog-coverage sweep for the nine existence codes
          no other fixture in either design file exercises.
        test_recipe:
          setup:
            - "an empty database; the probe id 11111111-1111-4111-8111-111111111111 names nothing"
          setup_api_calls: []
          trigger:
            - call: "GET /manufacturers/11111111-1111-4111-8111-111111111111"
              payload: {}
              as: ClearinghouseAdmin
              as_user_id: "admin-1"
            - call: "GET /retailers/11111111-1111-4111-8111-111111111111"
              payload: {}
              as: ClearinghouseAdmin
              as_user_id: "admin-1"
            - call: "GET /coupon-items/11111111-1111-4111-8111-111111111111"
              payload: {}
              as: ClearinghouseAdmin
              as_user_id: "admin-1"
            - call: "GET /purchase-data-records/11111111-1111-4111-8111-111111111111"
              payload: {}
              as: ClearinghouseAdmin
              as_user_id: "admin-1"
            - call: "GET /settlement-statements/11111111-1111-4111-8111-111111111111"
              payload: {}
              as: ClearinghouseAdmin
              as_user_id: "admin-1"
            - call: "GET /manufacturer-invoices/11111111-1111-4111-8111-111111111111"
              payload: {}
              as: ClearinghouseAdmin
              as_user_id: "admin-1"
            - call: "GET /disputes/11111111-1111-4111-8111-111111111111"
              payload: {}
              as: ClearinghouseAdmin
