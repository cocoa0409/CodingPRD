              as: PlatformAdmin
              captures: { jur: "$.data.id" }
            - call: "POST /ig/retention-rules"
              payload: { program_id: "${p}", record_class_id: "${cl}", jurisdiction_id: "${jur}", rule_code: "R-1M", retention_months: 1, trigger_basis: "EVENT_DATE", effective_from: "2020-01-01T00:00:00Z" }
              as: RecordsManager
              captures: { rule: "$.data.id" }
            - call: "POST /ig/retention-rules/${rule}/activate"
              payload: {}
              as: RecordsManager
            - call: "POST /ig/records"
              payload: { program_id: "${p}", record_class_id: "${cl}", jurisdiction_id: "${jur}", title: "Due Soon", source_system: "ERP", event_date: "2026-07-01T00:00:00Z", size_gb: 1 }
              as: RecordsManager
              captures: { r: "$.data.id" }
            - call: "GET /ig/records/${r}"
              payload: {}
              as: RecordsManager
              captures: { posture_before: "$.data.disposition_posture" }
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
