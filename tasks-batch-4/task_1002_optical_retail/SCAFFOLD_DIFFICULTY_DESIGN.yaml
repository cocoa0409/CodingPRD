              as: PlatformAdmin
              captures: { blue_id: $.data.id }
            - call: "POST /optical/customers"
              payload: { full_name: "Bo Undary", email: "bo6@x.com", dob: "1990-07-07T00:00:00Z" }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /optical/prescriptions"
              payload: { customer_id: "${cust_id}", od_sphere: -5.50, od_cylinder: -1.00, os_sphere: -5.00, os_cylinder: 0.00, pd_mm: 63.0, issued_at: "2026-04-01T00:00:00Z", expires_at: "2027-04-01T00:00:00Z" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { rx_id: $.data.id }
            - call: "POST /optical/prescriptions/${rx_id}/verify"
              payload: { decision: "VERIFIED" }
              as: OpticianVerifier
          trigger:
            - call: "POST /optical/orders"
              payload: { customer_id: "${cust_id}", prescription_id: "${rx_id}", frame_id: "${frame_id}", material_option_id: "${m160_id}", coating_option_ids: ["${ar_id}", "${blue_id}"], delivery_method: "SHIP" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { err: $.data.error_id }
            - call: "POST /optical/orders"
              payload: { customer_id: "${cust_id}", prescription_id: "${rx_id}", frame_id: "${frame_id}", material_option_id: "${m167_id}", coating_option_ids: ["${ar_id}", "${blue_id}"], delivery_method: "SHIP" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { ord_id: $.data.id }
          assert:
            - "The M160 attempt returns HTTP 422 and ${err} == ERR_LENS_INCOMPATIBLE_WITH_RX"
            - "The M167 attempt returns HTTP 201"
            - "Order.${ord_id}.lens_upcharge_cents == 17950"
            - "Order.${ord_id}.subtotal_cents == 37450"
            - "Order.${ord_id}.customer_due_cents == 33705"

      - name: empty_frame_ids_array_rejected_at_kit_request
        grounds:
          - validations[priority=64]
          - errors[ERR_KIT_EMPTY]
          - entities.HomeTryOnKit.fields.item_count
        distinguishing_aspect: |
          A DIFFERENT metric on a DIFFERENT endpoint — the empty-collection edge of the frame_ids
          cardinality at POST /optical/home-try-on-kits. Zero frames is not a schema error (the
          field is a well-typed array): it is caught by the dedicated priority-64 emptiness rule
          returning ERR_KIT_EMPTY with 422, and a one-frame kit at the other side of the boundary
          succeeds.
        test_recipe:
          setup:
            - "A frame with tryon_stock 1 and a customer with no kit history (return_risk_score 0)."
          setup_api_calls:
