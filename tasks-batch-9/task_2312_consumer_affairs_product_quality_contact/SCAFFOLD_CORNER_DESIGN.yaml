    instances:

      - name: corner_stale_complaint_version_rejects_the_remedy_write
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[remedy-create-stale-complaint]", "errors[ERR_STALE_COMPLAINT_VERSION]", "validations[priority 12]"]
        distinguishing_aspect: "The captured complaint version is invalidated by an unrelated intervening write on the parent, so the remedy create is refused with the version the caller believed in and accepted once re-read."
        test_recipe:
          setup: ["A triaged QUALITY complaint whose version is captured, then bumped by a quality-hold round trip."]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", as: SystemAdmin, payload: { current_utc: "2026-08-01T00:00:00Z" } }
