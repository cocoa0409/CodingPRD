            - "GET /benefits/holdings?product_line=BANKING returns exactly 2 rows across both members"
            - "GET /benefits/holdings?member_id=${e004_id}&product_line=BANKING returns exactly 1 row"
            - "every returned row carries id, created_at, updated_at and version"

  # ===========================================================================
  - section: errors
    instances:

      - name: duplicate_rule_code_is_rejected_regardless_of_status
        claim_type: violation_to_error
        grounds:
          - errors[ERR_DUPLICATE_RULE_CODE]
          - validations[priority=14]
          - entities.RateDiscountRule.fields.rule_code
        distinguishing_aspect: "Uniqueness on rule_code is platform-wide and status-blind, so a code already RETIRED still blocks a new DRAFT of the same name rather than being freed by retirement."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. A rule with code DUP_ONE has been created and retired."
          setup_api_calls:
            - *kc
            - call: "POST /benefits/rate-discount-rules"
              payload: { rule_code: "DUP_ONE", discount_kind: "AUTOPAY", stacking_class: "ADDITIVE", discount_bps: 20, effective_from: "2026-01-01T00:00:00Z", effective_to: "2027-01-01T00:00:00Z" }
              as: BenefitsAdmin
              captures: { err01_r_id: $.data.id }
            - call: "POST /benefits/rate-discount-rules/${err01_r_id}/activate"
              payload: {}
              as: BenefitsAdmin
            - call: "POST /benefits/rate-discount-rules/${err01_r_id}/retire"
              payload: {}
              as: BenefitsAdmin
          trigger:
            - call: "POST /benefits/rate-discount-rules"
              payload: { rule_code: "DUP_ONE", discount_kind: "PROMOTIONAL", stacking_class: "BASE", discount_bps: 30, effective_from: "2027-02-01T00:00:00Z", effective_to: "2027-06-01T00:00:00Z" }
              as: BenefitsAdmin
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 409 and error_id == ERR_DUPLICATE_RULE_CODE"
            - "GET /benefits/rate-discount-rules?status=DRAFT returns 0 rows"
            - "GET /benefits/rate-discount-rules?status=RETIRED returns exactly 1 row, the original DUP_ONE"

      - name: self_stack_cycle_is_rejected_when_a_rule_joins_itself
        claim_type: violation_to_error
        grounds:
          - errors[ERR_SELF_STACK_CYCLE]
          - validations[priority=15]
          - entities.RateDiscountRule.fields.stacks_on_rule_id
        distinguishing_aspect: "The stacking graph is acyclic by construction: a rule whose stacks_on_rule_id closes a loop back onto itself is refused with the graph error rather than accepted and deadlocked at pricing time."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. A root ADDITIVE rule ROOT_A exists in DRAFT."
          setup_api_calls:
            - *kc
            - call: "POST /benefits/rate-discount-rules"
              payload: { rule_code: "ROOT_A", discount_kind: "AUTOPAY", stacking_class: "ADDITIVE", discount_bps: 20, effective_from: "2026-01-01T00:00:00Z", effective_to: "2027-01-01T00:00:00Z" }
              as: BenefitsAdmin
              captures: { err02_ra_id: $.data.id }
            - call: "POST /benefits/rate-discount-rules"
              payload: { rule_code: "CYCLE_B", discount_kind: "AUTOPAY", stacking_class: "ADDITIVE", discount_bps: 25, effective_from: "2026-01-01T00:00:00Z", effective_to: "2027-01-01T00:00:00Z", stacks_on_rule_id: "${err02_ra_id}" }
              as: BenefitsAdmin
              captures: { err02_rb_id: $.data.id }
          trigger:
            - call: "PUT /benefits/rate-discount-rules/${err02_ra_id}"
              payload: { stacks_on_rule_id: "${err02_rb_id}" }
              as: BenefitsAdmin
              captures: { error_id: $.data.error_id }
          assert:
            - "the child rule CYCLE_B is created successfully with 201 and stacks_on_rule_id set to ROOT_A"
            - "the edit that points ROOT_A back at its own child closes the loop and is refused with 422 ERR_SELF_STACK_CYCLE"
            - "RateDiscountRule.${err02_ra_id}.stacks_on_rule_id stays null, so the graph is still acyclic"
            - "GET /benefits/rate-discount-rules?stacks_on_rule_id=${err02_ra_id} returns exactly 1 row"

      - name: activating_a_rule_joined_to_a_draft_rule_is_refused
        claim_type: violation_to_error
        grounds:
          - errors[ERR_ACTIVE_RULE_ON_UNPRICED_LOAN]
          - validations[priority=28]
        distinguishing_aspect: "Activation requires the joined rule to be resolvable and already ACTIVE, so activating a child while its declared parent is still DRAFT is refused rather than leaving an ACTIVE rule hanging off a non-pricing root."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. A DRAFT rule PARENT_D holds code DP_ROOT; a second DRAFT rule CHILD_D joins it."
          setup_api_calls:
            - *kc
            - call: "POST /benefits/rate-discount-rules"
              payload: { rule_code: "DP_ROOT", discount_kind: "AUTOPAY", stacking_class: "ADDITIVE", discount_bps: 20, effective_from: "2026-01-01T00:00:00Z", effective_to: "2027-01-01T00:00:00Z" }
              as: BenefitsAdmin
              captures: { err03_rp_id: $.data.id }
            - call: "POST /benefits/rate-discount-rules"
              payload: { rule_code: "DP_CHILD", discount_kind: "AUTOPAY", stacking_class: "ADDITIVE", discount_bps: 15, effective_from: "2026-01-01T00:00:00Z", effective_to: "2027-01-01T00:00:00Z", stacks_on_rule_id: "${err03_rp_id}" }
              as: BenefitsAdmin
              captures: { err03_rc_id: $.data.id }
          trigger:
            - call: "POST /benefits/rate-discount-rules/${err03_rc_id}/activate"
              payload: {}
              as: BenefitsAdmin
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 422 and error_id == ERR_ACTIVE_RULE_ON_UNPRICED_LOAN"
            - "RateDiscountRule.${err03_rc_id}.status stays DRAFT"
            - "activating the parent ${err03_rp_id} first makes the child's activation succeed"

# ===========================================================================
  - section: rbac
    instances:

      - name: underwriter_cannot_create_rate_discount_rules
        claim_type: role_exclusivity
        grounds:
          - roles.BenefitsAdmin.exclusive_operations
          - roles.Underwriter.identity
          - errors[ERR_FORBIDDEN_ROLE]
        distinguishing_aspect: "BenefitsAdmin owns rule creation exclusively, so Underwriter is refused on that endpoint while still being permitted on the loan-account create it owns — the two roles are peers with disjoint surfaces."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Empty database."
          setup_api_calls:
            - *kc
          trigger:
            - call: "POST /benefits/rate-discount-rules"
              payload: { rule_code: "UW_BLOCKED", discount_kind: "AUTOPAY", stacking_class: "ADDITIVE", discount_bps: 10, effective_from: "2026-01-01T00:00:00Z", effective_to: "2027-01-01T00:00:00Z" }
              as: Underwriter
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 403 and error_id == ERR_FORBIDDEN_ROLE"
            - "GET /benefits/rate-discount-rules returns 0 rows"
            - "the same Underwriter is still permitted on POST /benefits/loan-accounts, which its exclusive surface owns"

      - name: member_cannot_read_another_members_benefit_summary
        claim_type: peer_roles
        grounds:
          - roles.Member.identity
          - endpoints.GET_/benefits/members/{member_id}/benefit-summary
          - errors[ERR_FORBIDDEN_ROLE]
        distinguishing_aspect: "Member is entity_backed and ownership-scoped, so a Member reading another member's summary is refused; the same endpoint is open to the opaque operational roles, which have no ownership constraint."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Members M-R-002A and M-R-002B both exist."
          setup_api_calls:
            - *kc
            - call: "POST /benefits/members"
              payload: { member_number: "M-R-002A", full_name: "Lena Ortiz", email: "lena@x.com" }
              as: Anonymous
              captures: { r002a_id: $.data.id }
            - call: "POST /benefits/members"
              payload: { member_number: "M-R-002B", full_name: "Milo Ortiz", email: "milo@x.com" }
              as: Anonymous
              captures: { r002b_id: $.data.id }
          trigger:
            - call: "GET /benefits/members/${r002b_id}/benefit-summary"
              payload: {}
              as: Member
              as_user_id: "${r002a_id}"
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 403 and error_id == ERR_FORBIDDEN_ROLE"
            - "the same GET with as_user_id ${r002b_id} succeeds with 200"
            - "BenefitsAdmin reading ${r002b_id} also succeeds, since that role is opaque and unscoped"

      - name: compliance_officer_cannot_approve_an_override_on_the_requester_identity
        claim_type: segregation_of_duties
        grounds:
          - roles.ComplianceOfficer.exclusive_operations
          - roles.BenefitsAdmin.exclusive_operations
          - errors[ERR_SEGREGATION_OF_DUTIES]
        distinguishing_aspect: "The segregation rule is keyed on the X-User-ID rather than on the role name: the same operator id cannot request and then approve an override, so the two exclusive operations must be performed by different identities."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Member M-R-003 has a STEPPED_DOWN entitlement ent with a queued override requested by operator id dual-9."
          setup_api_calls:
            - *kc
            - call: "POST /benefits/members"
              payload: { member_number: "M-R-003", full_name: "Nell Bright", email: "nell@x.com" }
              as: Anonymous
              captures: { r003_id: $.data.id }
            - call: "POST /benefits/holdings"
              payload: { member_id: "${r003_id}", product_line: "CAREER", balance_cents: 0 }
              as: PlatformAdmin
              captures: { r003_h_id: $.data.id }
            - call: "POST /benefits/holdings/${r003_h_id}/adopt"
              payload: {}
              as: Member
              as_user_id: "${r003_id}"
            - call: "POST /benefits/members/${r003_id}/entitlements"
              payload: { source_holding_id: "${r003_h_id}", benefit_code: "CAREER_COACHING_CREDIT", value_bps: 1 }
              as: BenefitsAdmin
              captures: { r003_ent_id: $.data.id }
            - call: "POST /benefits/benefit-entitlements/${r003_ent_id}/step-down"
              payload: {}
              as: BenefitsAdmin
            - call: "POST /benefits/benefit-entitlements/${r003_ent_id}/request-override"
              payload: { override_reason: "REMEDIATION" }
              as: BenefitsAdmin
              as_user_id: "dual-9"
          trigger:
            - call: "POST /benefits/benefit-entitlements/${r003_ent_id}/approve-override"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "dual-9"
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 403 and error_id == ERR_SEGREGATION_OF_DUTIES"
            - "BenefitEntitlement.${r003_ent_id}.override_requested_by == \"dual-9\" and override_approved_by is still null"
            - "the same approve-override with as_user_id \"co-different\" succeeds and both override fields become populated"
            - "the entitlement stays STEPPED_DOWN until both override fields are set"

      - name: platform_admin_cannot_decide_a_cross_sell_check
        claim_type: role_exclusivity
        grounds:
