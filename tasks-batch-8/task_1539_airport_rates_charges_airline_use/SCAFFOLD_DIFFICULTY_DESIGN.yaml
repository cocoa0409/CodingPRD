  # ---------------------------------------------------------
  # Rule 4 — transitive_cascade (≥2, different triggers, depth ≥3 + ≥2)
  # ---------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: settlement_finalize_cascade_to_fy_close_and_rates_expire
        grounds:
          - state_machines.AnnualSettlement.RESOLVED_to_FINALIZED
          - state_machines.FiscalYear.OPEN_to_CLOSED
          - state_machines.RatesSetting
        distinguishing_aspect: |
          Cascade of depth 3 from settlement finalize trigger:
          finalize → AnnualSettlement.status=FINALIZED → parent FiscalYear
          OPEN→CLOSED → any DRAFT RatesSetting on the same FY → EXPIRED.
        test_recipe:
          setup:
            - "FY_CAS RESIDUAL OPEN; RatesSetting RS_cas adopted; agreement countersigned; activity; settlement computed, published, disputed, resolved; all lines PAID; a second RatesSetting RS_cas_draft was created on the same FY and left in DRAFT."
