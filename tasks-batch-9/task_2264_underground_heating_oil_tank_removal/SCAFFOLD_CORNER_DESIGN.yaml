            - "the approval response carries HTTP status 409"
            - "RemediationChangeOrder.${co1_id}.status == REJECTED"
            - "RemediationChangeOrder.${co3_id}.status == SUBMITTED"
            - "RemediationChangeOrder.${co3_id}.line_amount_cents == null"
            - "TankProject.${proj_id}.approved_scope_cubic_yards == 8.0"
            - "TankProject.${proj_id}.remediation_cost_cents == 185000"

      # --- codes already raised as an asserted outcome inside §1.8 -------------
      - name: stale_expected_project_version_is_rejected_on_a_parent_scoped_write
        claim_type: violation_to_error
        grounds:
          - errors[ERR_STALE_PROJECT_VERSION]
          - validations[priority=38]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / stale_project_version_beats_invalid_supersede_target_on_change_order_create
          rationale: "That §1.8 instance sends a stale expected_project_version to POST /change-orders and asserts the response error_id == ERR_STALE_PROJECT_VERSION with HTTP 412; the two dedicated OCC instances in the cross_cutting_complexity_layers section below cover the second concurrency rule on POST /trust-fund-claims."

      - name: project_state_gate_is_rejected_on_a_change_order_approval
        claim_type: violation_to_error
        grounds:
          - errors[ERR_PROJECT_STATE_INVALID]
          - validations[priority=40]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / project_state_beats_excavation_limit_on_change_order_approval
          rationale: "That §1.8 instance approves an over-limit change order on a project that has left REMEDIATION_ACTIVE and asserts error_id == ERR_PROJECT_STATE_INVALID, proving both the code and its precedence over priority 70."

      - name: non_owning_homeowner_response_is_rejected
        claim_type: violation_to_error
        grounds:
          - errors[ERR_NOT_RESOURCE_OWNER]
          - validations[priority=25]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / resource_ownership_beats_disclosure_expiry_on_respond
          rationale: "That §1.8 instance has a homeowner from a different property respond to an expired disclosure and asserts error_id == ERR_NOT_RESOURCE_OWNER, so the code is triggered and its precedence over priority 53 is proven."

      - name: sweep_survey_with_no_tank_blocks_the_downstream_write
        claim_type: violation_to_error
        grounds:
          - errors[ERR_NO_TANK_LOCATED]
          - validations[priority=52]
        excluded_because:
          difficulty_instance: boundary_precision_check / sweep_survey_with_zero_tanks_detected_is_a_zero_count_edge
          rationale: "That §1.8 instance records tanks_detected_count == 0 and then asserts the follow-on write returns error_id == ERR_NO_TANK_LOCATED."

      - name: mobilize_before_the_fire_marshal_notice_takes_effect_is_rejected
        claim_type: violation_to_error
        grounds:
          - errors[ERR_FIRE_MARSHAL_NOTICE_NOT_EFFECTIVE]
          - validations[priority=50]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / work_order_mobilize_requires_effective_fire_marshal_notice
          rationale: "That §1.8 instance mobilizes one second before notice_effective_at and asserts error_id == ERR_FIRE_MARSHAL_NOTICE_NOT_EFFECTIVE, then succeeds one second after."

      - name: unacknowledged_contamination_disclosure_blocks_the_claim_submit
        claim_type: violation_to_error
        grounds:
          - errors[ERR_DISCLOSURE_NOT_ACKNOWLEDGED]
          - validations[priority=55]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / claim_submit_requires_acknowledged_contamination_disclosure
          rationale: "That §1.8 instance submits a claim while the CONTAMINATION_FINDINGS disclosure is still PENDING and asserts error_id == ERR_DISCLOSURE_NOT_ACKNOWLEDGED."

      - name: unaccredited_laboratory_cannot_receive_a_sample
        claim_type: violation_to_error
        grounds:
          - errors[ERR_LAB_NOT_ACCREDITED]
          - validations[priority=54]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / soil_sample_receive_requires_accredited_laboratory
          rationale: "That §1.8 instance flips the laboratory's accreditation off and asserts the RECEIVE event returns error_id == ERR_LAB_NOT_ACCREDITED."

      - name: buffered_crew_double_booking_is_rejected
        claim_type: violation_to_error
        grounds:
          - errors[ERR_CREW_BOOKING_CONFLICT]
          - validations[priority=65]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / crew_symmetric_buffer_rejects_gap_below_ninety_minutes
          rationale: "That §1.8 instance books the same crew with an 89-minute gap and asserts error_id == ERR_CREW_BOOKING_CONFLICT, then succeeds at exactly 90 minutes."

      - name: laboratory_concurrent_analysis_ceiling_is_rejected
        claim_type: violation_to_error
        grounds:
          - errors[ERR_LAB_CAPACITY_EXCEEDED]
          - validations[priority=66]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / laboratory_aggregate_capacity_uses_closed_analysis_window
          rationale: "That §1.8 instance drives the laboratory to max_concurrent_analyses and asserts the next RECEIVE returns error_id == ERR_LAB_CAPACITY_EXCEEDED."

      - name: result_reported_past_the_holding_time_is_rejected
        claim_type: violation_to_error
        grounds:
          - errors[ERR_HOLDING_TIME_EXCEEDED]
          - validations[priority=67]
        excluded_because:
          difficulty_instance: boundary_precision_check / holding_time_exactly_at_limit_is_compliant_one_second_past_is_not
          rationale: "That §1.8 instance reports one second past holding_time_hours and asserts error_id == ERR_HOLDING_TIME_EXCEEDED, with the exactly-at-limit sibling passing."

      - name: fourth_information_request_on_a_claim_is_rejected
        claim_type: violation_to_error
        grounds:
          - errors[ERR_INFO_REQUEST_LIMIT_REACHED]
          - validations[priority=78]
        excluded_because:
          difficulty_instance: non_linear_state_machine / trust_fund_claim_review_cycle_bounded_by_info_request_limit
          rationale: "That §1.8 instance walks the review loop to MAX_INFO_REQUESTS and asserts the next INFO_REQUESTED decision returns error_id == ERR_INFO_REQUEST_LIMIT_REACHED with info_request_count frozen at 2."

  # ===========================================================================
  # §1.7 role_model is segregation_of_duties with six roles, two of them
  # entity-backed (LabAnalyst -> Laboratory, Homeowner -> Property).
  - section: rbac
    instances:

      - name: every_role_exclusive_operation_is_forbidden_to_non_holders
        claim_type: other_roles_exclusive_operations_denied
        grounds:
          - roles.ProjectCoordinator.exclusive_operations
          - roles.FieldTechnician.exclusive_operations
          - roles.LabAnalyst.exclusive_operations
          - roles.Homeowner.exclusive_operations
          - roles.LicensedSiteProfessional.exclusive_operations
          - roles.ComplianceOfficer.exclusive_operations
          - errors[ERR_ROLE_NOT_PERMITTED]
          - validations[priority=20]
        distinguishing_aspect: "One exclusive operation per role is attempted by a role that does not hold it; every attempt returns ERR_ROLE_NOT_PERMITTED 403. Because the priority-20 role gate runs before the priority-30 existence gate and the priority-35 shape gate, the all-zero path ids and the minimal bodies never surface a 404 or a 422 — which is itself the observable that pins the ladder order."
        test_recipe:
          setup:
            - "One NJ Property with one TankProject at INTAKE — present only so the change-order attempt can carry a live expected_project_version; every other target uses the all-zero id because the role gate precedes existence and shape checks."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T08:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /properties"
              payload: { street_address: "43 Corner Way", state_code: "NJ", county_code: "MRS", homeowner_name: "Ras Dill", homeowner_email: "ras@example.com", insurance_carrier_code: "CARR-C-43" }
              as: ProjectCoordinator
              captures: { prop_id: $.data.id }
            - call: "POST /tank-projects"
              payload: { property_id: "${prop_id}" }
              as: ProjectCoordinator
              captures: { proj_id: $.data.id, pv1: $.data.version }
          trigger:
            - call: "POST /properties"
              payload: { street_address: "41 Corner Way", state_code: "NJ", county_code: "MRS", homeowner_name: "Mo Yates", homeowner_email: "mo@example.com", insurance_carrier_code: "CARR-C-41" }
              as: FieldTechnician
              captures: { e_pc: $.data.error_id }
            - call: "POST /work-orders/00000000-0000-0000-0000-000000000000/field-events"
              payload: { event: "MOBILIZE" }
              as: ProjectCoordinator
              captures: { e_ft: $.data.error_id }
            - call: "POST /soil-samples/00000000-0000-0000-0000-000000000000/result"
              payload: { tph_mg_kg: 120.0, benzene_mg_kg: 0.05 }
              as: FieldTechnician
              captures: { e_lab: $.data.error_id }
            - call: "POST /disclosures/00000000-0000-0000-0000-000000000000/respond"
              payload: { response: "ACKNOWLEDGED", response_channel: "PORTAL" }
              as: ProjectCoordinator
              captures: { e_home: $.data.error_id }
            - call: "POST /nfa-letters"
              payload: { tank_project_id: "00000000-0000-0000-0000-000000000000", closing_date: "2026-09-15T00:00:00Z" }
              as: ComplianceOfficer
              captures: { e_lsp: $.data.error_id }
            - call: "POST /permits/00000000-0000-0000-0000-000000000000/decision"
              payload: { decision: "ISSUED" }
              as: LicensedSiteProfessional
              as_user_id: "lsp-1"
              captures: { e_co: $.data.error_id }
            - call: "POST /change-orders"
              payload: { tank_project_id: "${proj_id}", additional_cubic_yards: 2.0, unit_rate_cents: 1000, disposal_class: "NON_HAZARDOUS", expected_project_version: "${pv1}" }
              as: ComplianceOfficer
              captures: { e_co_write: $.data.error_id }
          assert:
            - "${e_pc} == ERR_ROLE_NOT_PERMITTED"
            - "${e_ft} == ERR_ROLE_NOT_PERMITTED"
            - "${e_lab} == ERR_ROLE_NOT_PERMITTED"
            - "${e_home} == ERR_ROLE_NOT_PERMITTED"
            - "${e_lsp} == ERR_ROLE_NOT_PERMITTED"
            - "${e_co} == ERR_ROLE_NOT_PERMITTED"
            - "${e_co_write} == ERR_ROLE_NOT_PERMITTED"
            - "all seven responses carry HTTP status 403"
            - "no response carries ERR_TANK_PROJECT_NOT_FOUND, ERR_WORK_ORDER_NOT_FOUND, ERR_SOIL_SAMPLE_NOT_FOUND, ERR_DISCLOSURE_NOT_FOUND, ERR_PERMIT_NOT_FOUND or ERR_INVALID_REQUEST"
            - "GET /tank-projects?property_id=${prop_id} still returns total_count == 1"
            - "TankProject.${proj_id}.version == ${pv1} (the refused change-order create wrote nothing)"
            - "GET /change-orders?tank_project_id=${proj_id} returns total_count == 0"

      - name: each_role_can_perform_its_own_exclusive_operations
        claim_type: exclusive_operations_allowed
        grounds:
          - roles.ProjectCoordinator.exclusive_operations
          - roles.FieldTechnician.exclusive_operations
          - roles.LabAnalyst.exclusive_operations
          - roles.Homeowner.exclusive_operations
          - roles.ComplianceOfficer.exclusive_operations
          - roles.LicensedSiteProfessional.exclusive_operations
        excluded_because:
          difficulty_instance: transitive_cascade / cascade_depth_five_from_lab_result_to_insurance_notification_status
          rationale: "That §1.8 chain performs the ProjectCoordinator intake/permit/crew/work-order writes, the FieldTechnician field events and sample writes, the entity-backed LabAnalyst RECEIVE and result writes, the entity-backed Homeowner respond write and the ComplianceOfficer permit/laboratory/notification writes, and asserts the resulting states — so every one of those exclusive operations is proven to succeed for its holder. The LicensedSiteProfessional exclusive writes (change-order create/submit, NFA draft/issue) are proven the same way by insurance_waterfall_totals_conserved_across_change_order_supersession and cascade_depth_four_from_nfa_rescission_to_claim_and_reserve_revert."

      - name: nfa_letter_drafter_and_signer_must_be_different_users
        claim_type: segregation_of_duties
        grounds:
          - roles.LicensedSiteProfessional.description
          - validations[priority=45]
          - errors[ERR_SEGREGATION_OF_DUTIES]
        excluded_because:
          difficulty_instance: transitive_cascade / cascade_depth_four_from_nfa_rescission_to_claim_and_reserve_revert
          rationale: "That §1.8 chain drafts the NFA letter as lsp-1 and issues it as lsp-2, so the satisfaction side of the duty split is asserted there; the violation side (lsp-1 signing its own draft -> ERR_SEGREGATION_OF_DUTIES 403) is asserted by the errors-section instance nfa_issuance_rejected_for_same_signer_then_stale_closing_date_then_blockers above."

  # ===========================================================================
  # §1.1 complexity_layers = [dual_variant_calculation, cascading_side_effects,
  # rate_threshold_triggers, optimistic_concurrency]. Both §1.2.1 concurrency
  # rules get their own dedicated stale-version instance below.
  - section: cross_cutting_complexity_layers
    instances:

      - name: occ_final_claim_create_with_stale_project_version_is_rejected
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[final-claim-create-stale-project]
          - errors[ERR_STALE_PROJECT_VERSION]
          - validations[priority=38]
          - endpoints[POST /trust-fund-claims].side_effects
