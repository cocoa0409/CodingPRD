              captures: { line_rate: "$.data[0].rate_cents_per_gal", line_amt: "$.data[0].line_amount_cents" }
          assert:
            - "Settlement.${stl}.provisional_total_cents == 27600 after publish (was 16560 before)"
            - "the SettlementLine's rate_cents_per_gal == 150 (clamp of 200 x 0.90 = 180 to cap 150) and line_amount_cents == 27600"
