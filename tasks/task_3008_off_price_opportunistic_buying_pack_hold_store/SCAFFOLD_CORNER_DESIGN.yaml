              payload: { style_code: "MX-CHEAP", department: "APPAREL", quantity: 50, unit_cost_cents: 11500, compare_at_claim_cents: 15000, target_retail_cents: 5000 }
              as: Buyer
            - call: "POST /lots/${lot_mx_id}/lot-lines"
              payload: { style_code: "MX-DEAR", department: "HOME", quantity: 50, unit_cost_cents: 90000, compare_at_claim_cents: 150000, target_retail_cents: 50000 }
              as: Buyer
            - call: "POST /lots/${lot_mx_id}/evaluate"
              payload: {}
              as: Buyer
            - call: "POST /lots/${lot_mx_id}/accept"
              payload: { expected_season_version: "${k_season_v}" }
              as: Buyer
            - call: "POST /stores"
              payload: { store_code: "ST-M", cluster_code: "SUBURBAN_FAMILY", zone_code: "MT", storage_capacity_units: 500 }
              as: AllocationManager
              captures: { store_sm_id: $.data.id }
          trigger:
            - call: "POST /shrink-cases"
              payload: { store_id: "${store_sm_id}", lot_id: "${lot_mx_id}", shrink_type: "MIXED_LOT_SHORTAGE", merge_mode: "HIGH_VALUE_SORT", units_lost: 0, units_untraceable: 3 }
              as: ShrinkAuditor
              captures: { sc_mx_id: $.data.id }
            - call: "POST /shrink-cases/${sc_mx_id}/confirm"
