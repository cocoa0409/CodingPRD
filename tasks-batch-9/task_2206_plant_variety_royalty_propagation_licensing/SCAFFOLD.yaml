    roles: [LicensingOfficer]
    code: 201
    input: [agreement_id, variety_id, sublicensee_name, territory_code, jurisdiction_code, "exclusivity?", effective_date, expiry_date, expected_agreement_version]
    output: SublicenseGrant
    side_effects: ["creates SublicenseGrant with status = PROPOSED and version = 1", "increments PropagatorAgreement.version by 1"]

  - method: GET
    path: "/sublicense-grants"
    description: "List sublicense grants; filter by agreement_id to walk an agreement's downstream programs or by variety_id to see a variety's territory coverage."
    roles: [BreederAdmin, LicensingOfficer, Propagator, TrialCoordinator, ComplianceAuditor]
    code: 200
    input: ["agreement_id?", "variety_id?", "territory_code?", "status?", "exclusivity?", "limit?", "offset?"]
    output: SublicenseGrant[]
    side_effects: []

  - method: GET
    path: "/sublicense-grants/{grant_id}"
    description: "Fetch one sublicense grant including its activation stamp and revocation reason."
    roles: [BreederAdmin, LicensingOfficer, Propagator, TrialCoordinator, ComplianceAuditor]
    code: 200
    input: []
    output: SublicenseGrant
    side_effects: []

  - method: POST
    path: "/sublicense-grants/{grant_id}/activate"
    description: "Activate a proposed sublicense. Requires the variety released, protection in force in that jurisdiction, and no exclusivity clash in the territory over the buffered window."
    roles: [LicensingOfficer]
    code: 200
    input: []
    output: SublicenseGrant
    side_effects: ["drives SublicenseGrant.status PROPOSED -> ACTIVE and sets activated_at = logical clock now", "recomputes Variety.active_sublicense_count", "increments SublicenseGrant.version and Variety.version"]

  - method: POST
    path: "/sublicense-grants/{grant_id}/revoke"
    description: "Revoke a proposed or active sublicense."
    roles: [LicensingOfficer]
    code: 200
    input: []
    output: SublicenseGrant
    side_effects: ["drives SublicenseGrant.status PROPOSED or ACTIVE -> REVOKED with revocation_reason = MANUAL", "recomputes Variety.active_sublicense_count (unchanged when the grant was only PROPOSED)", "increments SublicenseGrant.version and, when the count changed, Variety.version"]

  # ------------------------------------------- SurveillanceCase / GeneticTest
  - method: POST
    path: "/surveillance-cases"
    description: "Open an unauthorized-propagation case from a market survey observation, optionally naming a suspected propagator."
    roles: [ComplianceAuditor]
    code: 201
    input: [variety_id, "suspected_propagator_id?", market_survey_ref]
    output: SurveillanceCase
    side_effects: ["creates SurveillanceCase with status = OPENED, sampled_unit_count = 0, max_match_confidence = 0.0000, all money fields 0 and version = 1"]

  - method: GET
    path: "/surveillance-cases"
    description: "List surveillance cases; filter by variety_id or by suspected_propagator_id to walk one propagator's enforcement exposure."
    roles: [BreederAdmin, LicensingOfficer, Propagator, TrialCoordinator, ComplianceAuditor]
    code: 200
    input: ["variety_id?", "suspected_propagator_id?", "status?", "limit?", "offset?"]
    output: SurveillanceCase[]
    side_effects: []

  - method: GET
    path: "/surveillance-cases/{case_id}"
    description: "Fetch one surveillance case including max_match_confidence and the three damages-waterfall buckets."
    roles: [BreederAdmin, LicensingOfficer, Propagator, TrialCoordinator, ComplianceAuditor]
    code: 200
    input: []
    output: SurveillanceCase
    side_effects: []

  - method: POST
    path: "/surveillance-cases/{case_id}/sample"
    description: "Record the market-survey sample collection for the case."
    roles: [ComplianceAuditor]
    code: 200
    input: [sampled_unit_count]
    output: SurveillanceCase
    side_effects: ["drives SurveillanceCase.status OPENED -> SAMPLED and stores sampled_unit_count", "increments SurveillanceCase.version"]

  - method: POST
    path: "/surveillance-cases/{case_id}/genetic-tests"
    description: "Record an immutable genetic marker test result against the case's samples. The first test moves the case into TESTING."
    roles: [ComplianceAuditor]
    code: 201
    input: [lab_code, marker_panel, match_confidence]
    output: GeneticTest
    side_effects: ["creates an immutable GeneticTest (no version, no update endpoint) with result = MATCH when match_confidence >= 0.9000 else NO_MATCH", "recomputes SurveillanceCase.max_match_confidence as the maximum over the case's tests", "drives SurveillanceCase.status SAMPLED -> TESTING on the first test; further tests leave the status at TESTING", "increments SurveillanceCase.version"]

  - method: GET
    path: "/genetic-tests"
    description: "List genetic tests; filter by case_id to read a case's full marker-test record."
    roles: [BreederAdmin, LicensingOfficer, Propagator, TrialCoordinator, ComplianceAuditor]
    code: 200
    input: ["case_id?", "result?", "lab_code?", "limit?", "offset?"]
    output: GeneticTest[]
    side_effects: []

  - method: GET
    path: "/genetic-tests/{test_id}"
    description: "Fetch one immutable genetic test result. The response carries id and created_at but no updated_at and no version."
    roles: [BreederAdmin, LicensingOfficer, Propagator, TrialCoordinator, ComplianceAuditor]
    code: 200
    input: []
    output: GeneticTest
    side_effects: []

  - method: POST
    path: "/surveillance-cases/{case_id}/conclude-testing"
    description: "Close out testing. The server chooses MATCH_CONFIRMED or NO_MATCH from the case's max_match_confidence against the 0.9000 threshold; the caller supplies no branch selector."
    roles: [ComplianceAuditor]
    code: 200
    input: []
    output: SurveillanceCase
    side_effects: ["drives SurveillanceCase.status TESTING -> MATCH_CONFIRMED when max_match_confidence >= 0.9000, else TESTING -> NO_MATCH", "sets concluded_at = logical clock now", "on MATCH_CONFIRMED with a named suspect only: recomputes Propagator.compliance_score and lifetime_compliance_score, then suspends ACTIVE agreements below the 70 threshold, then freezes their ACTIVE quotas", "increments SurveillanceCase.version and the version of every cascaded propagator, agreement and quota"]

  - method: POST
    path: "/surveillance-cases/{case_id}/resolve"
    description: "Resolve the case and allocate the recovered damages across the enforcement-cost, breeder-pool and propagator-credit buckets."
    roles: [ComplianceAuditor]
    code: 200
    input: [recovered_damages_cents, enforcement_cost_cents]
    output: SurveillanceCase
    side_effects: ["drives SurveillanceCase.status MATCH_CONFIRMED or NO_MATCH -> RESOLVED", "computes enforcement_recovery_cents, breeder_pool_cents and propagator_credit_cents via calculations.damages_waterfall", "adds propagator_credit_cents to Propagator.damages_credit_cents when a suspect is named", "increments SurveillanceCase.version and, when a credit was applied, Propagator.version"]

  # -------------------------------------------------------- AuditEngagement
  - method: POST
    path: "/audit-engagements"
    description: "Open a royalty audit of one accepted report under the agreement's audit rights."
    roles: [ComplianceAuditor]
    code: 201
    input: [agreement_id, royalty_report_id]
    output: AuditEngagement
    side_effects: ["creates AuditEngagement with status = OPENED, underreported_units = 0 and version = 1"]

  - method: GET
    path: "/audit-engagements"
    description: "List audit engagements; filter by agreement_id to walk an agreement's audit history or by royalty_report_id to see every audit of one report."
    roles: [BreederAdmin, LicensingOfficer, Propagator, TrialCoordinator, ComplianceAuditor]
    code: 200
    input: ["agreement_id?", "royalty_report_id?", "status?", "finding_severity?", "limit?", "offset?"]
    output: AuditEngagement[]
    side_effects: []

  - method: GET
    path: "/audit-engagements/{engagement_id}"
    description: "Fetch one audit engagement including its finding severity, underreported unit count and finalizing officer."
    roles: [BreederAdmin, LicensingOfficer, Propagator, TrialCoordinator, ComplianceAuditor]
    code: 200
    input: []
    output: AuditEngagement
    side_effects: []

  - method: POST
    path: "/audit-engagements/{engagement_id}/finalize"
    description: "Finalize the audit. finding_severity NONE closes it with no finding; MINOR or MATERIAL issues findings and drives the dispute and compliance cascades."
    roles: [ComplianceAuditor]
    code: 200
    input: [finding_severity, "underreported_units?"]
    output: AuditEngagement
    side_effects: ["drives AuditEngagement.status OPENED -> FINDINGS_ISSUED (MINOR or MATERIAL) or OPENED -> CLOSED_NO_FINDING (NONE), setting finalized_at = logical clock now and finalized_by_user_id = the request's X-User-ID", "on MATERIAL: recomputes Propagator.material_audit_finding_count", "on MINOR or MATERIAL: the audited report moves ACCEPTED -> DISPUTED with booked_amount_cents = 0 when it is still UNSETTLED, then Propagator.royalty_payable_cents is recomputed, then Propagator.compliance_score and lifetime_compliance_score are recomputed", "on MATERIAL: the agreement moves ACTIVE -> SUSPENDED with suspension_reason = AUDIT_FINDING; on MINOR it suspends only if the recomputed score fell below 70, with suspension_reason = COMPLIANCE_SCORE_BREACH; the suspension then freezes the agreement's ACTIVE quotas", "increments the version of the engagement and of every cascaded report, propagator, agreement and quota"]

  # ---------------------------------------------------- test-driving surface
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Advance the server's logical clock and run the deterministic time sweep. The clock's startup default is exactly 2026-08-01T00:00:00Z and it never falls back to wall-clock time; current_utc must be strictly greater than the present value. The sweep processes classes in a PINNED order: (1) ProtectionFiling rows in MAINTENANCE_DUE whose grace window has closed move to LAPSED, ordered created_at ASC then jurisdiction_code ASC; (2) Variety rows in BRAND_REGISTERED whose brand_renewal_due_at has arrived move to BRAND_RENEWAL_DUE, ordered created_at ASC then denomination ASC; (3) SublicenseGrant rows in ACTIVE past expiry_date move to EXPIRED, ordered created_at ASC then territory_code ASC then sublicensee_name ASC. Finally every Propagator's rolling compliance score is recomputed (ordered created_at ASC then legal_name ASC) because the 120-day window has slid. Ordering never uses id."
    roles: [BreederAdmin, LicensingOfficer, Propagator, TrialCoordinator, ComplianceAuditor]
    code: 200
    input: [current_utc]
    output: "{ current_utc: datetime, lapsed_filing_count: integer, brand_renewal_due_count: integer, expired_grant_count: integer, compliance_recompute_count: integer }"
    side_effects: ["sets the logical clock", "runs the three sweep classes in the pinned order with their pinned intra-class ordering, driving each class's cascades (a lapse revokes that jurisdiction's ACTIVE sublicense grants and re-derives protection_posture, protected_jurisdictions and active_sublicense_count)", "recomputes every Propagator.compliance_score for the slid rolling window, which can auto-suspend ACTIVE agreements and freeze their ACTIVE quotas", "increments the version of every entity it mutates"]

errors:
  # ---- authentication / authorization / schema
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-ID or X-User-Role header missing or empty."
  - id: ERR_FORBIDDEN_ROLE
    http: 403
    condition: "X-User-Role is not a declared role, or is not listed in the called endpoint's roles."
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "Malformed body, missing required input field, unknown field, undeclared enum member, negative quantity, or non-ISO-8601 timestamp."
  - id: ERR_NOT_RESOURCE_OWNER
    http: 403
    condition: "Role Propagator acting on a report, line item or tag order whose propagator (via agreement.propagator_id) is not the acting X-User-ID."

  # ---- existence
  - id: ERR_VARIETY_NOT_FOUND
    http: 404
    condition: "variety_id in the path or body matches no Variety."
  - id: ERR_PROTECTION_FILING_NOT_FOUND
    http: 404
    condition: "filing_id matches no ProtectionFiling."
  - id: ERR_TRIAL_SITE_NOT_FOUND
    http: 404
    condition: "trial_site_id matches no TrialSite."
  - id: ERR_VARIETY_TRIAL_NOT_FOUND
    http: 404
    condition: "trial_id matches no VarietyTrial."
  - id: ERR_PROPAGATOR_NOT_FOUND
    http: 404
    condition: "propagator_id or suspected_propagator_id matches no Propagator."
  - id: ERR_AGREEMENT_NOT_FOUND
    http: 404
    condition: "agreement_id matches no PropagatorAgreement."
  - id: ERR_QUOTA_NOT_FOUND
    http: 404
    condition: "quota_id matches no ProductionQuota."
  - id: ERR_TAG_ORDER_NOT_FOUND
    http: 404
    condition: "tag_order_id matches no TagOrder."
  - id: ERR_ROYALTY_REPORT_NOT_FOUND
    http: 404
    condition: "report_id or royalty_report_id matches no RoyaltyReport."
  - id: ERR_LINE_ITEM_NOT_FOUND
    http: 404
    condition: "line_item_id matches no RoyaltyLineItem."
  - id: ERR_SUBLICENSE_GRANT_NOT_FOUND
    http: 404
    condition: "grant_id matches no SublicenseGrant."
  - id: ERR_SURVEILLANCE_CASE_NOT_FOUND
    http: 404
    condition: "case_id matches no SurveillanceCase."
  - id: ERR_GENETIC_TEST_NOT_FOUND
    http: 404
    condition: "test_id matches no GeneticTest."
  - id: ERR_AUDIT_ENGAGEMENT_NOT_FOUND
    http: 404
    condition: "engagement_id matches no AuditEngagement."

  # ---- optimistic concurrency (§1.2.1)
  - id: ERR_STALE_QUOTA_VERSION
    http: 412
    condition: "expected_quota_version on POST /tag-orders does not equal the ProductionQuota's current version."
  - id: ERR_STALE_REPORT_VERSION
    http: 412
    condition: "expected_report_version on POST /royalty-reports/{report_id}/line-items does not equal the RoyaltyReport's current version."
  - id: ERR_STALE_AGREEMENT_VERSION
    http: 412
    condition: "expected_agreement_version on POST /sublicense-grants does not equal the PropagatorAgreement's current version."

  # ---- state
  - id: ERR_TERMINAL_STATE
    http: 409
    condition: "The target resource is already in a terminal state of the machine the action drives (e.g. RETIRED variety, LAPSED or ABANDONED filing, PASSED or FAILED trial, TERMINATED agreement, CLOSED quota, RECONCILED or VOIDED tag order, REVERSED settlement, REVOKED or EXPIRED grant, RESOLVED case, finalized engagement)."
  - id: ERR_INVALID_STATE_TRANSITION
    http: 409
    condition: "The target resource's current state is not a declared `from:` state for this trigger - including a second, idempotent-looking repeat of an action that already succeeded."
  - id: ERR_QUOTA_FROZEN
    http: 409
    condition: "The ProductionQuota the operation consumes is FROZEN because its agreement is suspended."

  # ---- business: safety / compliance
  - id: ERR_AGREEMENT_NOT_ACTIVE
    http: 409
    condition: "The governing PropagatorAgreement is not ACTIVE (still PENDING_COUNTERSIGN, or SUSPENDED)."
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "The acting X-User-ID equals agreement.countersigned_by_user_id on report acceptance, or equals report.accepted_by_user_id on settlement."
  - id: ERR_PROTECTION_NOT_IN_FORCE
    http: 422
    condition: "Activating a sublicense in a jurisdiction that is not a member of variety.protected_jurisdictions."
  - id: ERR_VARIETY_NOT_RELEASED
    http: 422
    condition: "Activating a sublicense for a variety whose lifecycle_state is not RELEASED."
  - id: ERR_RELEASE_CRITERIA_NOT_MET
    http: 422
    condition: "Releasing a variety with fewer than 2 passed trial regions, a regional_performance_index below 72.00, or protection_posture UNPROTECTED or LAPSED_PROTECTION."
  - id: ERR_COMPLIANCE_SCORE_TOO_LOW
    http: 422
    condition: "Reinstating an agreement while propagator.compliance_score is below 70."
  - id: ERR_MATERIAL_FINDING_UNRESOLVED
    http: 422
    condition: "Reinstating an agreement while propagator.material_audit_finding_count is greater than 0."

  # ---- business: referential
  - id: ERR_QUOTA_AGREEMENT_MISMATCH
    http: 422
    condition: "The line item's quota belongs to a different agreement than the report."
  - id: ERR_TERRITORY_NOT_LICENSED
    http: 422
    condition: "The requested territory_code is not a member of the agreement's territory_codes."
  - id: ERR_REPORT_ENGAGEMENT_MISMATCH
    http: 422
    condition: "The audited royalty_report_id belongs to a different agreement than the supplied agreement_id."
  - id: ERR_BRAND_CONFLICTS_DENOMINATION
    http: 422
    condition: "The proposed brand_mark_text collides case-insensitively with this or another variety's denomination, or with another variety's brand_mark_text."

  # ---- business: uniqueness / constraint
  - id: ERR_DUPLICATE_DENOMINATION
    http: 409
    condition: "A Variety with the same denomination already exists (case-insensitive)."
  - id: ERR_DUPLICATE_FILING_JURISDICTION
    http: 409
    condition: "A ProtectionFiling with the same (variety_id, instrument_type, jurisdiction_code) already exists in status DRAFT, FILED, GRANTED or MAINTENANCE_DUE."
  - id: ERR_DUPLICATE_QUOTA_SEASON
    http: 409
    condition: "A ProductionQuota with the same (agreement_id, variety_id, season_code, territory_code) already exists in status ACTIVE or FROZEN."
  - id: ERR_DUPLICATE_REPORT_PERIOD
    http: 409
    condition: "A RoyaltyReport with the same (agreement_id, period_code) already exists in any status."
  - id: ERR_DUPLICATE_LINE_ITEM_QUOTA
    http: 409
    condition: "A RoyaltyLineItem for the same (report_id, quota_id) already exists."
  - id: ERR_ACTIVE_SUBLICENSES_EXIST
    http: 409
    condition: "Retiring a variety whose active_sublicense_count is greater than 0."
  - id: ERR_UNSETTLED_ROYALTY_OUTSTANDING
    http: 409
    condition: "Terminating an agreement that still has a RoyaltyReport with review_status ACCEPTED and settlement_status UNSETTLED."

  # ---- business: temporal
  - id: ERR_INVALID_INTERVAL
    http: 422
    condition: "A supplied interval is not well-ordered for its declared boundary semantics, or a future-dated field (brand_renewal_due_at, annuity_due_date) is not strictly after the logical clock now."
  - id: ERR_PERIOD_OUTSIDE_TERM
    http: 422
    condition: "A report period or sublicense window falls outside [agreement.term_start, agreement.term_end]."
  - id: ERR_TRIAL_DATE_NOT_REACHED
    http: 422
    condition: "Planting before plant_date, or evaluating before harvest_date, per the logical clock."
  - id: ERR_GRACE_PERIOD_EXPIRED
    http: 422
    condition: "Paying a maintenance annuity after annuity_due_date plus annuity_grace_days days; the boundary instant itself is still accepted."
  - id: ERR_EXCLUSIVITY_CONFLICT
    http: 409
    condition: "Activating a grant whose closed [effective_date, expiry_date] window overlaps an ACTIVE grant for the same (variety_id, territory_code) - the active grant's window extended by 30 days on both ends - where either grant is EXCLUSIVE."
  - id: ERR_CLOCK_NOT_MONOTONIC
    http: 422
    condition: "current_utc on POST /_clock/set_current_utc is not strictly after the clock's present value."

  # ---- business: fiscal / capacity
  - id: ERR_TRIAL_SITE_CAPACITY_EXCEEDED
    http: 409
    condition: "Planting would push the site's committed plot_count over plot_capacity across overlapping half-open [plant_date, harvest_date) windows of PLANNED and PLANTED trials."
  - id: ERR_QUOTA_UNITS_EXCEEDED
    http: 422
    condition: "Issuing a tag order whose requested_units exceeds quota.units_available."
  - id: ERR_ACTIVATION_EXCEEDS_ISSUED
    http: 422
    condition: "Reconciling a tag order with activated_units greater than requested_units."
  - id: ERR_ANNUITY_AMOUNT_MISMATCH
    http: 422
    condition: "paid_amount_cents does not equal the annuity_total_due_cents computed by calculations.annuity_total_due at the moment of the call."
  - id: ERR_REPORT_HAS_NO_LINES
    http: 422
    condition: "Submitting a royalty report that has no RoyaltyLineItem rows."
  - id: ERR_NOTHING_TO_SETTLE
    http: 422
    condition: "Settling a report whose booked_amount_cents is 0, including one zeroed by a dispute."

roles:
  - name: BreederAdmin
    description: "The breeding programme's rights office. Owns the variety record itself, the protection portfolio (filing, grant, maintenance calendar, lapse, abandonment), the trademark dimension, trial certification, and commercial release and retirement. Holds no billing authority whatsoever, so it can never accept or settle a royalty report."
    identity: "opaque"
    exclusive_operations:
      - "POST /varieties"
      - "POST /varieties/{variety_id}/release"
      - "POST /varieties/{variety_id}/retire"
      - "POST /varieties/{variety_id}/brand-register"
      - "POST /varieties/{variety_id}/brand-renew"
      - "POST /varieties/{variety_id}/brand-abandon"
      - "POST /protection-filings"
      - "POST /protection-filings/{filing_id}/file"
      - "POST /protection-filings/{filing_id}/grant"
      - "POST /protection-filings/{filing_id}/schedule-annuity"
      - "POST /protection-filings/{filing_id}/pay-annuity"
      - "POST /protection-filings/{filing_id}/lapse"
      - "POST /protection-filings/{filing_id}/abandon"
      - "POST /variety-trials/{trial_id}/certify"
    shared_operations:
      - "every GET endpoint"
      - "POST /_clock/set_current_utc"

  - name: LicensingOfficer
    description: "The licensing and billing desk. Owns propagator onboarding, agreements and their suspension lifecycle, quota allocation, tag issuance and voiding, royalty acceptance / dispute / settlement / reversal, and sublicensing. Two segregation-of-duties barriers constrain it: the officer who countersigned an agreement may not accept reports under it, and the officer who accepted a report may not settle it - so at least two distinct LicensingOfficer user ids are required to run a report from acceptance to payment."
    identity: "opaque"
    exclusive_operations:
      - "POST /propagators"
      - "POST /propagator-agreements"
      - "POST /propagator-agreements/{agreement_id}/countersign"
      - "POST /propagator-agreements/{agreement_id}/suspend"
      - "POST /propagator-agreements/{agreement_id}/reinstate"
      - "POST /propagator-agreements/{agreement_id}/terminate"
      - "POST /production-quotas"
      - "POST /tag-orders/{tag_order_id}/issue"
      - "POST /tag-orders/{tag_order_id}/void"
      - "POST /royalty-reports/{report_id}/accept"
      - "POST /royalty-reports/{report_id}/dispute"
      - "POST /royalty-reports/{report_id}/settle"
      - "POST /royalty-reports/{report_id}/reverse"
      - "POST /sublicense-grants"
      - "POST /sublicense-grants/{grant_id}/activate"
      - "POST /sublicense-grants/{grant_id}/revoke"
    shared_operations:
      - "every GET endpoint"
      - "POST /_clock/set_current_utc"

  - name: Propagator
    description: "The licensed propagator acting for itself. X-User-ID is the id of the Propagator row, so every ownership check compares X-User-ID against the propagator reached through agreement.propagator_id. It may request and reconcile tags and file, amend and submit its own royalty reports, but it can neither issue nor void tags, and it can never accept, dispute, settle or reverse a report."
    identity: "entity_backed:Propagator"
    exclusive_operations:
      - "POST /tag-orders"
      - "POST /tag-orders/{tag_order_id}/reconcile"
      - "POST /royalty-reports"
      - "POST /royalty-reports/{report_id}/line-items"
      - "POST /royalty-reports/{report_id}/submit"
      - "POST /royalty-reports/{report_id}/revise"
    shared_operations:
      - "every GET endpoint"
      - "POST /_clock/set_current_utc"

  - name: TrialCoordinator
    description: "The regional trialing network. Owns trial sites and the trial calendar up to and including evaluation scoring, but certification - the decision that a trial counts toward release - is reserved to BreederAdmin, so scoring and certifying are separated."
    identity: "opaque"
    exclusive_operations:
      - "POST /trial-sites"
      - "POST /variety-trials"
      - "POST /variety-trials/{trial_id}/plant"
      - "POST /variety-trials/{trial_id}/evaluate"
    shared_operations:
      - "every GET endpoint"
      - "POST /_clock/set_current_utc"

  - name: ComplianceAuditor
    description: "The enforcement and audit function. Owns market-survey surveillance cases, genetic testing, case resolution with damages allocation, and royalty audit engagements. It can issue findings that dispute an accepted report and suspend an agreement, but it can never itself accept, settle or reverse a report, nor issue tags - the audit function is fully separated from the billing function."
    identity: "opaque"
    exclusive_operations:
      - "POST /surveillance-cases"
      - "POST /surveillance-cases/{case_id}/sample"
      - "POST /surveillance-cases/{case_id}/genetic-tests"
      - "POST /surveillance-cases/{case_id}/conclude-testing"
      - "POST /surveillance-cases/{case_id}/resolve"
      - "POST /audit-engagements"
      - "POST /audit-engagements/{engagement_id}/finalize"
    shared_operations:
      - "every GET endpoint"
      - "POST /_clock/set_current_utc"
