              payload: { disability_days: 10 }
              as: ClaimsAdjuster
            - call: "POST /benefit-payments"
              payload: { claim_id: "${claim_a}", benefit_type: "TTD" }
              as: ClaimsAdjuster
              captures: { pay_a: $.data.id }
          trigger:
            - call: "POST /benefit-payments/${pay_a}/void"
              payload: {}
              as: ClaimsAdjuster
          assert:
            - "Reserve.${res_a}.total_incurred_cents == 2700060 after the payment (before void)"
            - "Reserve.${res_a}.total_incurred_cents == 2700060 after the void (zero drift in the conserved money quantity)"

      - name: open_claim_count_conserved_across_close_and_reopen
        grounds:
          - state_machines.Claim.MEDICAL_ONLY_to_CLOSED
          - state_machines.Claim.CLOSED_to_REOPENED
          - entities.Employer.fields.open_claim_count
        distinguishing_aspect: |
          Conserved COUNT quantity (different type from money): Employer.open_claim_count
          returns to its pre-close value after a close (decrement) followed by a reopen
          (increment within the statutory window) — net zero change in the count.
        test_recipe:
          setup:
            - "Employer with one MEDICAL_ONLY claim; open_claim_count==1; clock 2026-03-01 (within reopen window of date_of_injury 2026-02-01)."
          setup_api_calls:
            - call: "POST /employers"
              payload: { legal_name: "Rho Co", state_code: "CA" }
              as: PlatformAdmin
              captures: { emp_id: $.data.id }
            - call: "POST /policies"
              payload: { employer_id: "${emp_id}", policy_number: "P-017", manual_premium_cents: 5000000, effective_date: "2026-01-01T00:00:00Z", expiration_date: "2027-01-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { pol_id: $.data.id }
            - call: "POST /workers"
              payload: { employer_id: "${emp_id}", full_name: "Worker A", gross_wages_cents: 7800000, weeks_worked: 52 }
              as: PlatformAdmin
              captures: { wkr_a: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /claims"
              payload: { policy_id: "${pol_id}", worker_id: "${wkr_a}", date_of_injury: "2026-02-01T00:00:00Z" }
              as: ClaimsAdjuster
              captures: { claim_a: $.data.id }
            - call: "POST /injury-reports"
              payload: { claim_id: "${claim_a}", report_kind: "FROI", maintenance_type_code: "00" }
              as: ClaimsAdjuster
              captures: { froi_a: $.data.id }
            - call: "POST /injury-reports/${froi_a}/transmit"
              payload: {}
              as: ClaimsAdjuster
            - call: "POST /injury-reports/${froi_a}/ack"
              payload: {}
              as: PlatformAdmin
            - call: "POST /claims/${claim_a}/accept"
              payload: {}
              as: ClaimsAdjuster
            - call: "POST /claims/${claim_a}/close"
              payload: {}
              as: ClaimsAdjuster
          trigger:
            - call: "POST /claims/${claim_a}/reopen"
              payload: {}
              as: ClaimsAdjuster
          assert:
            - "Employer.${emp_id}.open_claim_count == 1 before close, 0 after close, 1 after reopen (count conserved across the close+reopen pair)"
            - "Claim.${claim_a}.status == REOPENED"
