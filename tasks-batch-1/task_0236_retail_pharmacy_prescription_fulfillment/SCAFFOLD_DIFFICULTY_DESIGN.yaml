      - name: auth_permission_beats_state_invalid_on_dispense
        grounds:
          - validations[priority=2]
          - validations[priority=6]
          - errors[ERR_INSUFFICIENT_PERMISSIONS]
          - errors[ERR_FILL_NOT_WILL_CALL]
        distinguishing_aspect: |
          Pair auth (priority 2, ERR_INSUFFICIENT_PERMISSIONS) vs state
          (priority 6, ERR_FILL_NOT_WILL_CALL). A Technician (dispense is
          Pharmacist-exclusive) calling dispense on a fill still in ENTERED
          (wrong state too) gets the higher-priority ERR_INSUFFICIENT_PERMISSIONS
          (403), proving auth is checked before state. Different error-category
          pair than the safety-vs-temporal conflict above.
        test_recipe:
          setup:
