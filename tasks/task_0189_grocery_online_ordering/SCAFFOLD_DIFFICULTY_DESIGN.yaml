              captures: { a_id: $.data.id }
            - call: "POST /v1/slots"
              payload: { store_id: "${s_id}", slot_type: "PICKUP", window_start: "2026-06-15T09:00:00Z", window_end: "2026-06-15T11:00:00Z", capacity: 5 }
              as: StoreOps
              captures: { slot_id: $.data.id }
            - call: "POST /v1/slots/${slot_id}/close"
              payload: {}
              as: StoreOps
              captures: { slot_v: $.data.version, slot_status: $.data.status }
          trigger:
            - call: "POST /v1/orders"
              payload: { store_id: "${s_id}", customer_id: "${c_id}", slot_id: "${slot_id}", expected_slot_version: "${slot_v}", lines: [ { product_id: "${a_id}", requested_qty: 1 } ] }
              as: Customer
              as_user_id: "${c_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "data.error_id == ERR_SLOT_CLOSED"

      - name: cesd_line_pick_requires_order_picking   # OrderLine -> Order
        grounds:
          - state_machines.OrderLine.PENDING_to_PICKED
          - entities.Order.fields.fulfillment_status
          - validations[priority=5]
        distinguishing_aspect: |
          Entity pair OrderLine -> Order (a different pair from Order->FulfillmentSlot): picking a line is only
          valid when the parent Order.fulfillment_status == PICKING. On a freshly PLACED order (not yet claimed)
          a pick is rejected ERR_ORDER_NOT_PICKING; the line transition depends on the parent Order's state.
        test_recipe:
          setup:
            - "Store, Customer, slot cap 1, UNIT product A(349). Order placed (PLACED, never claimed). Line PENDING."
          setup_api_calls:
            - call: "POST /v1/stores"
              payload: { name: "S", ebt_enabled: true }
              as: PlatformAdmin
              captures: { s_id: $.data.id }
            - call: "POST /v1/customers"
              payload: { email: "c14@x.com", full_name: "C", date_of_birth: "1990-01-01" }
              as: PlatformAdmin
              captures: { c_id: $.data.id }
            - call: "POST /v1/pickers"
              payload: { store_id: "${s_id}", full_name: "P" }
              as: StoreOps
              captures: { p_id: $.data.id }
            - call: "POST /v1/products"
              payload: { store_id: "${s_id}", sku: "A", name: "A", pricing_mode: "UNIT", unit_price_cents: 349 }
              as: StoreOps
              captures: { a_id: $.data.id }
            - call: "POST /v1/slots"
              payload: { store_id: "${s_id}", slot_type: "PICKUP", window_start: "2026-06-15T09:00:00Z", window_end: "2026-06-15T11:00:00Z", capacity: 1 }
              as: StoreOps
              captures: { slot_id: $.data.id, slot_v: $.data.version }
            - call: "POST /v1/orders"
              payload: { store_id: "${s_id}", customer_id: "${c_id}", slot_id: "${slot_id}", expected_slot_version: "${slot_v}", lines: [ { product_id: "${a_id}", requested_qty: 1 } ] }
              as: Customer
              as_user_id: "${c_id}"
              captures: { ord_id: $.data.id }
            - call: "GET /v1/order-lines"
              payload: { order_id: "${ord_id}" }
              as: Picker
              as_user_id: "${p_id}"
              captures: { line_id: "$.data[0].id" }
          trigger:
            - call: "POST /v1/order-lines/${line_id}/pick"
              payload: { picked_qty: 1 }
              as: Picker
              as_user_id: "${p_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "data.error_id == ERR_ORDER_NOT_PICKING"

  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: rto_slot_window_half_open_overlap   # FulfillmentSlot, half-open no buffer
        grounds:
          - entities.FulfillmentSlot.fields.window_start
          - entities.FulfillmentSlot.fields.window_end
          - validations[priority=6]
          - errors[ERR_SLOT_WINDOW_OVERLAP]
        distinguishing_aspect: |
          Resource FulfillmentSlot, half-open [start,end) semantics with NO buffer: an existing PICKUP slot
          [09:00,11:00) coexists with an adjacent [11:00,13:00) (touching at 11:00 allowed), but a new
          [10:00,12:00) overlaps and is rejected ERR_SLOT_WINDOW_OVERLAP. Different interval arithmetic and
          resource from the picker-window buffered rule.
        test_recipe:
          setup:
            - "Store S. Existing PICKUP slot [2026-06-15T09:00Z, 11:00Z) cap 5."
            - "Adjacent PICKUP slot [11:00Z, 13:00Z) cap 5 also created successfully (touching allowed)."
          setup_api_calls:
            - call: "POST /v1/stores"
              payload: { name: "S", ebt_enabled: true }
              as: PlatformAdmin
              captures: { s_id: $.data.id }
            - call: "POST /v1/slots"
              payload: { store_id: "${s_id}", slot_type: "PICKUP", window_start: "2026-06-15T09:00:00Z", window_end: "2026-06-15T11:00:00Z", capacity: 5 }
              as: StoreOps
              captures: { slot1: $.data.id }
            - call: "POST /v1/slots"
              payload: { store_id: "${s_id}", slot_type: "PICKUP", window_start: "2026-06-15T11:00:00Z", window_end: "2026-06-15T13:00:00Z", capacity: 5 }
              as: StoreOps
              captures: { slot2: $.data.id }
          trigger:
            - call: "POST /v1/slots"
              payload: { store_id: "${s_id}", slot_type: "PICKUP", window_start: "2026-06-15T10:00:00Z", window_end: "2026-06-15T12:00:00Z", capacity: 5 }
              as: StoreOps
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "data.error_id == ERR_SLOT_WINDOW_OVERLAP"

      - name: rto_picker_window_buffered_overlap   # Picker, closed-interval + cooldown buffer
        grounds:
          - state_machines.Order.PLACED_to_PICKING
          - entities.Picker.fields.window_cooldown_minutes
          - errors[ERR_PICKER_WINDOW_CONFLICT]
          - validations[priority=6]
        distinguishing_aspect: |
          Resource Picker, closed-interval-plus-buffer semantics: a picker with window_cooldown_minutes 15 who
          already holds claim window [07:00,07:45] cannot claim a second order at [07:50,08:30] because the
          5-minute gap is below the 15-minute cooldown buffer, yielding ERR_PICKER_WINDOW_CONFLICT. Different
          interval arithmetic (buffer-padded) and resource from the half-open slot rule.
        test_recipe:
          setup:
            - "Store, Customer, slot cap 2, UNIT product A(349). Picker P with window_cooldown_minutes 15."
            - "Two orders O1, O2 placed on the slot. P claims O1 with window [07:00,07:45]."
          setup_api_calls:
            - call: "POST /v1/stores"
              payload: { name: "S", ebt_enabled: true }
              as: PlatformAdmin
              captures: { s_id: $.data.id }
            - call: "POST /v1/customers"
              payload: { email: "c16@x.com", full_name: "C", date_of_birth: "1990-01-01" }
              as: PlatformAdmin
              captures: { c_id: $.data.id }
            - call: "POST /v1/pickers"
              payload: { store_id: "${s_id}", full_name: "P", window_cooldown_minutes: 15 }
              as: StoreOps
              captures: { p_id: $.data.id }
            - call: "POST /v1/products"
              payload: { store_id: "${s_id}", sku: "A", name: "A", pricing_mode: "UNIT", unit_price_cents: 349 }
              as: StoreOps
              captures: { a_id: $.data.id }
            - call: "POST /v1/slots"
              payload: { store_id: "${s_id}", slot_type: "PICKUP", window_start: "2026-06-15T09:00:00Z", window_end: "2026-06-15T11:00:00Z", capacity: 2 }
              as: StoreOps
              captures: { slot_id: $.data.id, slot_v0: $.data.version }
            - call: "POST /v1/orders"
              payload: { store_id: "${s_id}", customer_id: "${c_id}", slot_id: "${slot_id}", expected_slot_version: "${slot_v0}", lines: [ { product_id: "${a_id}", requested_qty: 1 } ] }
              as: Customer
              as_user_id: "${c_id}"
              captures: { o1_id: $.data.id }
            - call: "GET /v1/slots/${slot_id}"
              payload: {}
              as: StoreOps
              captures: { slot_v1: $.data.version }
            - call: "POST /v1/orders"
              payload: { store_id: "${s_id}", customer_id: "${c_id}", slot_id: "${slot_id}", expected_slot_version: "${slot_v1}", lines: [ { product_id: "${a_id}", requested_qty: 1 } ] }
              as: Customer
              as_user_id: "${c_id}"
              captures: { o2_id: $.data.id }
            - call: "POST /v1/orders/${o1_id}/claim"
              payload: { window_start: "2026-06-15T07:00:00Z", window_end: "2026-06-15T07:45:00Z" }
              as: Picker
              as_user_id: "${p_id}"
          trigger:
            - call: "POST /v1/orders/${o2_id}/claim"
              payload: { window_start: "2026-06-15T07:50:00Z", window_end: "2026-06-15T08:30:00Z" }
              as: Picker
              as_user_id: "${p_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "data.error_id == ERR_PICKER_WINDOW_CONFLICT"

  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: ci_slot_capacity_conservation   # conserved quantity: slot booked_count
        grounds:
          - calculations.slot_capacity
          - state_machines.Order.PLACED_to_PICKING
          - state_machines.Order.PLACED_PICKING_STAGED_to_CANCELLED
          - entities.FulfillmentSlot.fields.booked_count
        distinguishing_aspect: |
          Conserved quantity = FulfillmentSlot.booked_count, pinned as
          booked_count == count(Orders where slot_id==slot AND fulfillment_status in {PLACED,PICKING,STAGED,HANDED_OFF}).
          Forward place (booked_count 0->1, slot FULL) paired with its compensating cancel (booked_count 1->0,
          slot back to OPEN) leaves booked_count at 0 — exactly the count of non-cancelled orders on the slot.
        test_recipe:
          setup:
            - "Store, Customer, slot cap 1, UNIT product A(349). Order placed (booked_count 1, slot FULL)."
          setup_api_calls:
            - call: "POST /v1/stores"
              payload: { name: "S", ebt_enabled: true }
              as: PlatformAdmin
              captures: { s_id: $.data.id }
            - call: "POST /v1/customers"
              payload: { email: "c17@x.com", full_name: "C", date_of_birth: "1990-01-01" }
              as: PlatformAdmin
              captures: { c_id: $.data.id }
            - call: "POST /v1/products"
              payload: { store_id: "${s_id}", sku: "A", name: "A", pricing_mode: "UNIT", unit_price_cents: 349 }
              as: StoreOps
              captures: { a_id: $.data.id }
            - call: "POST /v1/slots"
              payload: { store_id: "${s_id}", slot_type: "PICKUP", window_start: "2026-06-15T09:00:00Z", window_end: "2026-06-15T11:00:00Z", capacity: 1 }
              as: StoreOps
              captures: { slot_id: $.data.id, slot_v: $.data.version }
            - call: "POST /v1/orders"
              payload: { store_id: "${s_id}", customer_id: "${c_id}", slot_id: "${slot_id}", expected_slot_version: "${slot_v}", lines: [ { product_id: "${a_id}", requested_qty: 1 } ] }
              as: Customer
              as_user_id: "${c_id}"
              captures: { ord_id: $.data.id }
          trigger:
            - call: "POST /v1/orders/${ord_id}/cancel"
              payload: {}
              as: Customer
              as_user_id: "${c_id}"
          assert:
            - "Order.${ord_id}.fulfillment_status == CANCELLED"
            - "FulfillmentSlot.${slot_id}.booked_count == 0"
            - "FulfillmentSlot.${slot_id}.status == OPEN"

      - name: ci_payment_tender_conservation   # conserved quantity: captured money vs refunds
        grounds:
          - calculations.split_tender_allocation
          - calculations.out_of_stock_refund
          - state_machines.OrderLine.PICKED_to_OUT_OF_STOCK
          - entities.Order.fields.net_captured_cents
          - entities.Order.fields.refunded_total_cents
        distinguishing_aspect: |
          Conserved quantity = captured tender total, pinned as
          net_captured_cents + refunded_total_cents == ebt_charged_cents + card_charged_cents.
          Forward capture (ebt 0 + card 698 = 698 captured) paired with its compensating full out-of-stock
          refund (refunded_total 698) leaves net_captured 0 while the sum stays 698 — no money drift. A
          different conserved quantity (money) from the slot-count invariant.
        test_recipe:
          setup:
            - "Store, Customer (snap 0), Picker, slot cap 1. Non-EBT UNIT product A priced 698, tip 0."
            - "Order one A line picked qty 1 (final 698). Staged. Captured: ebt 0, card 698, net 698."
          setup_api_calls:
            - call: "POST /v1/stores"
              payload: { name: "S", ebt_enabled: true }
              as: PlatformAdmin
              captures: { s_id: $.data.id }
            - call: "POST /v1/customers"
              payload: { email: "c18@x.com", full_name: "C", date_of_birth: "1990-01-01", snap_ebt_balance_cents: 0 }
              as: PlatformAdmin
              captures: { c_id: $.data.id }
            - call: "POST /v1/pickers"
              payload: { store_id: "${s_id}", full_name: "P" }
              as: StoreOps
              captures: { p_id: $.data.id }
            - call: "POST /v1/products"
              payload: { store_id: "${s_id}", sku: "A", name: "A", pricing_mode: "UNIT", unit_price_cents: 698, ebt_eligible: false }
              as: StoreOps
              captures: { a_id: $.data.id }
            - call: "POST /v1/slots"
              payload: { store_id: "${s_id}", slot_type: "PICKUP", window_start: "2026-06-15T09:00:00Z", window_end: "2026-06-15T11:00:00Z", capacity: 1 }
              as: StoreOps
              captures: { slot_id: $.data.id, slot_v: $.data.version }
            - call: "POST /v1/orders"
              payload: { store_id: "${s_id}", customer_id: "${c_id}", slot_id: "${slot_id}", expected_slot_version: "${slot_v}", tip_cents: 0, lines: [ { product_id: "${a_id}", requested_qty: 1 } ] }
              as: Customer
              as_user_id: "${c_id}"
              captures: { ord_id: $.data.id }
            - call: "GET /v1/order-lines"
              payload: { order_id: "${ord_id}" }
              as: Picker
              as_user_id: "${p_id}"
              captures: { line_id: "$.data[0].id" }
            - call: "POST /v1/orders/${ord_id}/claim"
              payload: { window_start: "2026-06-15T07:00:00Z", window_end: "2026-06-15T07:45:00Z" }
              as: Picker
              as_user_id: "${p_id}"
            - call: "POST /v1/order-lines/${line_id}/pick"
              payload: { picked_qty: 1 }
              as: Picker
              as_user_id: "${p_id}"
            - call: "POST /v1/orders/${ord_id}/stage"
              payload: {}
              as: Picker
              as_user_id: "${p_id}"
            - call: "POST /v1/orders/${ord_id}/capture"
              payload: {}
              as: StoreOps
              captures: { ebt0: $.data.ebt_charged_cents, card0: $.data.card_charged_cents }
          trigger:
            - call: "POST /v1/order-lines/${line_id}/out-of-stock"
              payload: {}
              as: StoreOps
          assert:
            - "Order.${ord_id}.refunded_total_cents == 698"
            - "Order.${ord_id}.net_captured_cents == 0"
            - "Order.${ord_id}.payment_status == REFUNDED"
