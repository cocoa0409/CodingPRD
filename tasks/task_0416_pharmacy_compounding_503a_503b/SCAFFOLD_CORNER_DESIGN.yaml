# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Task 0416 — Pharmacy Compounding (503A/503B), Expert tier
#
# Breadth probe. Each instance grounds in SCAFFOLD.yaml §1.1–§1.7.
# `excluded_because:` stubs cite §1.8 difficulty instances by exact name.
# Section/claim_type values are drawn from references/claim-extraction-guide.md.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  # Entities
  # ===========================================================================
  - section: entities
    instances:
      - name: create_facility_returns_201_with_defaults
        claim_type: Creation
        grounds:
          - entities.Facility
          - endpoints["POST /pharmacy-compounding/facilities"]
        distinguishing_aspect: "POST facility with name/registration_type/state_code -> 201; current_utc defaults to 1970-01-01T00:00:00.000Z, version==1."
        test_recipe:
          setup:
            - "Empty DB."
          setup_api_calls: []
          trigger:
            - call: "POST /pharmacy-compounding/facilities"
              payload: { name: "Acme Pharmacy", registration_type: "503A", state_code: "CA" }
              as: SystemAdmin
              captures: { f_id: $.data.id, ts: $.data.current_utc }
          assert:
            - "HTTP status == 201"
            - "Facility.${f_id}.current_utc == 1970-01-01T00:00:00.000Z"
            - "Facility.${f_id}.version == 1"
            - "response.response_type == object"

      - name: get_facility_not_found_returns_404
        claim_type: Not Found
        grounds:
          - entities.Facility
          - errors[ERR_FACILITY_NOT_FOUND]
          - endpoints["GET /pharmacy-compounding/facilities/{fid}"]
        distinguishing_aspect: "GET facility with a non-existent UUID -> ERR_FACILITY_NOT_FOUND (404)."
        test_recipe:
          setup:
            - "Empty DB."
          setup_api_calls: []
          trigger:
            - call: "GET /pharmacy-compounding/facilities/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: SystemAdmin
              captures: { error_id: $.data.error_id }
          assert:
            - "HTTP status == 404"
            - "response.data.error_id == ERR_FACILITY_NOT_FOUND"

      - name: create_mfr_missing_required_field_returns_invalid_request
        claim_type: Required Fields
        grounds:
          - entities.MasterFormulationRecord.fields.dosage_form
          - errors[ERR_INVALID_REQUEST]
          - endpoints["POST /pharmacy-compounding/master-formulation-records"]
        distinguishing_aspect: "POST MFR omitting required dosage_form -> ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup:
            - "A facility exists."
          setup_api_calls:
            - call: "POST /pharmacy-compounding/facilities"
              payload: { name: "Acme", registration_type: "503A", state_code: "CA" }
              as: SystemAdmin
              captures: { f_id: $.data.id }
          trigger:
            - call: "POST /pharmacy-compounding/master-formulation-records"
              payload: { facility_id: "${f_id}", name: "No Form", default_bud_days_nonsterile: 90, theoretical_yield_units: 100, anticipatory_max_units: 500 }
              as: CompoundingPharmacist
              captures: { error_id: $.data.error_id }
          assert:
            - "HTTP status == 400"
            - "response.data.error_id == ERR_INVALID_REQUEST"

      - name: create_mfr_invalid_dosage_form_enum_returns_invalid_enum
        claim_type: Type Constraints
        grounds:
          - entities.MasterFormulationRecord.fields.dosage_form
          - errors[ERR_INVALID_ENUM_VALUE]
          - endpoints["POST /pharmacy-compounding/master-formulation-records"]
        distinguishing_aspect: "POST MFR with dosage_form=GASEOUS (outside declared enum set) -> ERR_INVALID_ENUM_VALUE (400)."
        test_recipe:
          setup:
            - "A facility exists."
          setup_api_calls:
            - call: "POST /pharmacy-compounding/facilities"
              payload: { name: "Acme", registration_type: "503A", state_code: "CA" }
              as: SystemAdmin
              captures: { f_id: $.data.id }
          trigger:
            - call: "POST /pharmacy-compounding/master-formulation-records"
              payload: { facility_id: "${f_id}", name: "Bad Form", dosage_form: "GASEOUS", default_bud_days_nonsterile: 90, theoretical_yield_units: 100, anticipatory_max_units: 500 }
              as: CompoundingPharmacist
              captures: { error_id: $.data.error_id }
          assert:
            - "HTTP status == 400"
            - "response.data.error_id == ERR_INVALID_ENUM_VALUE"

      - name: mfr_is_sterile_computed_from_dosage_form
        claim_type: Computed Fields
        grounds:
          - entities.MasterFormulationRecord.fields.is_sterile
          - entities.MasterFormulationRecord.fields.dosage_form
          - endpoints["POST /pharmacy-compounding/master-formulation-records"]
        distinguishing_aspect: "MFR with dosage_form=STERILE_NONAQUEOUS -> is_sterile==true; client-sent is_sterile (if any) ignored."
        test_recipe:
          setup:
            - "A facility exists."
          setup_api_calls:
            - call: "POST /pharmacy-compounding/facilities"
              payload: { name: "Acme", registration_type: "503B", state_code: "TX" }
              as: SystemAdmin
              captures: { f_id: $.data.id }
          trigger:
            - call: "POST /pharmacy-compounding/master-formulation-records"
              payload: { facility_id: "${f_id}", name: "Oily Inj", dosage_form: "STERILE_NONAQUEOUS", default_bud_days_nonsterile: 1, theoretical_yield_units: 100, anticipatory_max_units: 500 }
              as: CompoundingPharmacist
              captures: { mfr_id: $.data.id }
          assert:
            - "MasterFormulationRecord.${mfr_id}.is_sterile == true"

      - name: create_mfr_default_anticipatory_window_days_applied
        claim_type: Defaults
        grounds:
          - entities.MasterFormulationRecord.fields.anticipatory_window_days
          - endpoints["POST /pharmacy-compounding/master-formulation-records"]
        distinguishing_aspect: "POST MFR omitting anticipatory_window_days -> default 30 applied."
        test_recipe:
          setup:
            - "A facility exists."
          setup_api_calls:
            - call: "POST /pharmacy-compounding/facilities"
              payload: { name: "Acme", registration_type: "503B", state_code: "TX" }
              as: SystemAdmin
              captures: { f_id: $.data.id }
          trigger:
            - call: "POST /pharmacy-compounding/master-formulation-records"
              payload: { facility_id: "${f_id}", name: "Default Window", dosage_form: "ORAL_SOLID", default_bud_days_nonsterile: 90, theoretical_yield_units: 100, anticipatory_max_units: 500 }
              as: CompoundingPharmacist
              captures: { mfr_id: $.data.id }
          assert:
            - "MasterFormulationRecord.${mfr_id}.anticipatory_window_days == 30"

      - name: ingredient_lot_remaining_grams_initialized_to_initial_grams
        claim_type: Computed Fields
        grounds:
          - entities.IngredientLot.fields.remaining_grams
          - entities.IngredientLot.fields.initial_grams
          - endpoints["POST /pharmacy-compounding/ingredient-lots"]
        distinguishing_aspect: "POST ingredient-lot with initial_grams=50 -> remaining_grams==50, status==AVAILABLE."
        test_recipe:
          setup:
            - "A facility exists."
          setup_api_calls:
            - call: "POST /pharmacy-compounding/facilities"
              payload: { name: "Acme", registration_type: "503A", state_code: "CA" }
              as: SystemAdmin
              captures: { f_id: $.data.id }
          trigger:
            - call: "POST /pharmacy-compounding/ingredient-lots"
              payload: { facility_id: "${f_id}", component_name: "API X", lot_number: "X-1", labeled_potency_pct: 100, initial_grams: 50, expiration_utc: "2030-01-01T00:00:00.000Z" }
              as: CompoundingPharmacist
              captures: { lot_id: $.data.id }
          assert:
            - "IngredientLot.${lot_id}.remaining_grams == 50.0"
            - "IngredientLot.${lot_id}.status == AVAILABLE"

      - name: environmental_log_in_spec_computed_and_no_version_field
        claim_type: Immutability
        grounds:
          - entities.EnvironmentalLog
          - entities.EnvironmentalLog.fields.in_spec
          - endpoints["POST /pharmacy-compounding/environmental-logs"]
        distinguishing_aspect: "EnvironmentalLog (common_fields:false) computes in_spec = measured_value <= action_limit; response carries id and created_at but no version field (immutable event)."
        test_recipe:
          setup:
            - "A facility with clock at 2026-06-01T00:00:00.000Z exists."
          setup_api_calls:
            - call: "POST /pharmacy-compounding/facilities"
              payload: { name: "Acme", registration_type: "503B", state_code: "TX" }
              as: SystemAdmin
              captures: { f_id: $.data.id }
            - call: "POST /pharmacy-compounding/facilities/${f_id}/_clock/set"
              payload: { to_iso8601: "2026-06-01T00:00:00.000Z" }
              as: SystemAdmin
          trigger:
            - call: "POST /pharmacy-compounding/environmental-logs"
              payload: { facility_id: "${f_id}", usp_chapter: "USP_797", reading_type: "VIABLE_AIR_CFU", measured_value: 3, action_limit: 5 }
              as: QualityAssurancePharmacist
              captures: { log_id: $.data.id, in_spec: $.data.in_spec }
          assert:
            - "HTTP status == 201"
            - "EnvironmentalLog.${log_id}.in_spec == true (3 <= 5)"
            - "EnvironmentalLog.${log_id}.reading_utc == 2026-06-01T00:00:00.000Z"

      - name: ingredient_lot_self_referential_parent_lot_id_filter
        claim_type: Parent Relationships
        grounds:
          - entities.IngredientLot.fields.parent_lot_id
          - endpoints["GET /pharmacy-compounding/ingredient-lots"]
        distinguishing_aspect: "A child lot created with parent_lot_id set is returned by GET /ingredient-lots?parent_lot_id={parent} (self-referential FK reverse-reachability)."
        test_recipe:
          setup:
            - "A facility and a parent lot exist."
          setup_api_calls:
            - call: "POST /pharmacy-compounding/facilities"
              payload: { name: "Acme", registration_type: "503A", state_code: "CA" }
              as: SystemAdmin
              captures: { f_id: $.data.id }
            - call: "POST /pharmacy-compounding/ingredient-lots"
              payload: { facility_id: "${f_id}", component_name: "API X", lot_number: "X-PARENT", labeled_potency_pct: 100, initial_grams: 50, expiration_utc: "2030-01-01T00:00:00.000Z" }
              as: CompoundingPharmacist
              captures: { parent_id: $.data.id }
            - call: "POST /pharmacy-compounding/ingredient-lots"
              payload: { facility_id: "${f_id}", component_name: "API X", lot_number: "X-CHILD", labeled_potency_pct: 99.4, initial_grams: 20, expiration_utc: "2030-01-01T00:00:00.000Z", parent_lot_id: "${parent_id}" }
              as: CompoundingPharmacist
              captures: { child_id: $.data.id }
          trigger:
            - call: "GET /pharmacy-compounding/ingredient-lots?parent_lot_id=${parent_id}"
              payload: {}
              as: CompoundingPharmacist
          assert:
            - "response is a list whose total_count == 1 and contains IngredientLot.${child_id}"

      - name: list_ingredient_lots_pagination_envelope
        claim_type: Listing
        grounds:
          - entities.IngredientLot
          - endpoints["GET /pharmacy-compounding/ingredient-lots"]
        distinguishing_aspect: "GET /ingredient-lots returns paginated list with limit/offset/total_count/has_more; has_more==true when total exceeds limit."
        test_recipe:
          setup:
            - "A facility with 2 lots exists."
          setup_api_calls:
            - call: "POST /pharmacy-compounding/facilities"
              payload: { name: "Acme", registration_type: "503A", state_code: "CA" }
              as: SystemAdmin
              captures: { f_id: $.data.id }
            - call: "POST /pharmacy-compounding/ingredient-lots"
              payload: { facility_id: "${f_id}", component_name: "API X", lot_number: "X-1", labeled_potency_pct: 100, initial_grams: 50, expiration_utc: "2030-01-01T00:00:00.000Z" }
              as: CompoundingPharmacist
            - call: "POST /pharmacy-compounding/ingredient-lots"
              payload: { facility_id: "${f_id}", component_name: "API Y", lot_number: "Y-1", labeled_potency_pct: 100, initial_grams: 50, expiration_utc: "2030-01-01T00:00:00.000Z" }
              as: CompoundingPharmacist
          trigger:
            - call: "GET /pharmacy-compounding/ingredient-lots?facility_id=${f_id}&limit=1&offset=0"
              payload: {}
              as: CompoundingPharmacist
          assert:
            - "response.total_count == 2"
            - "response.has_more == true"
            - "len(response.data) == 1"

      - name: list_ingredient_lots_invalid_pagination_returns_error
        claim_type: Type Constraints
        grounds:
          - errors[ERR_INVALID_PAGINATION]
          - endpoints["GET /pharmacy-compounding/ingredient-lots"]
        distinguishing_aspect: "GET /ingredient-lots?limit=0 -> ERR_INVALID_PAGINATION (400) (limit below min 1)."
        test_recipe:
          setup:
            - "A facility exists."
          setup_api_calls:
            - call: "POST /pharmacy-compounding/facilities"
              payload: { name: "Acme", registration_type: "503A", state_code: "CA" }
              as: SystemAdmin
              captures: { f_id: $.data.id }
          trigger:
            - call: "GET /pharmacy-compounding/ingredient-lots?facility_id=${f_id}&limit=0"
              payload: {}
              as: CompoundingPharmacist
              captures: { error_id: $.data.error_id }
          assert:
            - "HTTP status == 400"
            - "response.data.error_id == ERR_INVALID_PAGINATION"

      - name: finished_preparation_facility_id_system_assigned
        claim_type: System Fields
        grounds:
          - entities.FinishedPreparation.fields.facility_id
          - entities.FinishedPreparation.fields.unit_serial
        distinguishing_aspect: "FinishedPreparation minted at compile has system-assigned facility_id (== batch's facility) and a system-minted unit_serial; not client-supplied."
        excluded_because:
          difficulty_instance: transitive_cascade / recall_cascade_batch_to_prep_to_prescription_depth3
          rationale: "Compile-time minting of FinishedPreparations (system facility_id + unit_serial) is exercised as a precondition of the recall-cascade difficulty instance, which compiles then lists the minted preps."

  # ===========================================================================
  # State Machines
  # ===========================================================================
  - section: state_machines
    instances:
      - name: batch_initial_state_is_draft
        claim_type: Initial State
        grounds:
          - state_machines.CompoundingBatch
          - endpoints["POST /pharmacy-compounding/compounding-batches"]
        distinguishing_aspect: "Newly created CompoundingBatch starts in DRAFT with version==1, theoretical_yield_units snapshotted from MFR."
        test_recipe:
          setup:
            - "Facility + MFR (theoretical_yield_units=100) exist."
          setup_api_calls:
            - call: "POST /pharmacy-compounding/facilities"
              payload: { name: "Acme", registration_type: "503B", state_code: "TX" }
              as: SystemAdmin
              captures: { f_id: $.data.id }
            - call: "POST /pharmacy-compounding/master-formulation-records"
              payload: { facility_id: "${f_id}", name: "F1", dosage_form: "ORAL_SOLID", default_bud_days_nonsterile: 90, theoretical_yield_units: 100, anticipatory_max_units: 500 }
              as: CompoundingPharmacist
              captures: { mfr_id: $.data.id }
          trigger:
            - call: "POST /pharmacy-compounding/compounding-batches"
              payload: { facility_id: "${f_id}", master_formulation_record_id: "${mfr_id}", purpose: "OFFICE_USE" }
              as: CompoundingPharmacist
              captures: { batch_id: $.data.id }
          assert:
            - "CompoundingBatch.${batch_id}.status == DRAFT"
            - "CompoundingBatch.${batch_id}.theoretical_yield_units == 100"
            - "CompoundingBatch.${batch_id}.version == 1"

      - name: compile_from_draft_rejected_invalid_state
        claim_type: Invalid Transitions
        grounds:
          - state_machines.CompoundingBatch.IN_PROCESS_to_COMPILED
          - errors[ERR_BATCH_NOT_IN_STATE]
          - endpoints["POST /pharmacy-compounding/compounding-batches/{bid}/compile"]
        distinguishing_aspect: "Compiling a DRAFT batch (not IN_PROCESS) -> ERR_BATCH_NOT_IN_STATE (409); no state change."
        test_recipe:
          setup:
            - "A DRAFT batch with a charged usage exists (never started)."
          setup_api_calls:
            - call: "POST /pharmacy-compounding/facilities"
              payload: { name: "Acme", registration_type: "503B", state_code: "TX" }
              as: SystemAdmin
              captures: { f_id: $.data.id }
            - call: "POST /pharmacy-compounding/master-formulation-records"
              payload: { facility_id: "${f_id}", name: "F1", dosage_form: "ORAL_SOLID", default_bud_days_nonsterile: 90, theoretical_yield_units: 100, anticipatory_max_units: 500 }
              as: CompoundingPharmacist
              captures: { mfr_id: $.data.id }
            - call: "POST /pharmacy-compounding/ingredient-lots"
              payload: { facility_id: "${f_id}", component_name: "API X", lot_number: "X-1", labeled_potency_pct: 100, initial_grams: 50, expiration_utc: "2030-01-01T00:00:00.000Z" }
              as: CompoundingPharmacist
              captures: { lot_id: $.data.id }
            - call: "POST /pharmacy-compounding/compounding-batches"
              payload: { facility_id: "${f_id}", master_formulation_record_id: "${mfr_id}", purpose: "OFFICE_USE" }
              as: CompoundingPharmacist
              captures: { batch_id: $.data.id }
            - call: "POST /pharmacy-compounding/batch-ingredient-usages"
              payload: { compounding_batch_id: "${batch_id}", ingredient_lot_id: "${lot_id}", grams_used: 10 }
              as: CompoundingPharmacist
          trigger:
            - call: "POST /pharmacy-compounding/compounding-batches/${batch_id}/compile"
              payload: { actual_yield_units: 100 }
              as: CompoundingPharmacist
              captures: { error_id: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "response.data.error_id == ERR_BATCH_NOT_IN_STATE"
            - "CompoundingBatch.${batch_id}.status == DRAFT"

      - name: reject_from_terminal_rejected_returns_invalid_state
        claim_type: Terminal State Lockdown
        grounds:
          - state_machines.CompoundingBatch.QUARANTINED_to_REJECTED
          - errors[ERR_BATCH_NOT_IN_STATE]
          - endpoints["POST /pharmacy-compounding/compounding-batches/{bid}/reject"]
        distinguishing_aspect: "A second reject on an already-REJECTED batch (terminal) -> ERR_BATCH_NOT_IN_STATE (409); no transition out of terminal."
        test_recipe:
          setup:
            - "A batch compiled then rejected (status REJECTED, terminal)."
          setup_api_calls:
            - call: "POST /pharmacy-compounding/facilities"
              payload: { name: "Acme", registration_type: "503A", state_code: "CA" }
              as: SystemAdmin
              captures: { f_id: $.data.id }
            - call: "POST /pharmacy-compounding/facilities/${f_id}/_clock/set"
              payload: { to_iso8601: "2026-06-01T00:00:00.000Z" }
              as: SystemAdmin
            - call: "POST /pharmacy-compounding/master-formulation-records"
              payload: { facility_id: "${f_id}", name: "F1", dosage_form: "ORAL_SOLID", default_bud_days_nonsterile: 90, theoretical_yield_units: 5, anticipatory_max_units: 500 }
              as: CompoundingPharmacist
              captures: { mfr_id: $.data.id }
            - call: "POST /pharmacy-compounding/ingredient-lots"
              payload: { facility_id: "${f_id}", component_name: "API X", lot_number: "X-1", labeled_potency_pct: 100, initial_grams: 50, expiration_utc: "2030-01-01T00:00:00.000Z" }
              as: CompoundingPharmacist
              captures: { lot_id: $.data.id }
            - call: "POST /pharmacy-compounding/prescriptions"
              payload: { facility_id: "${f_id}", master_formulation_record_id: "${mfr_id}", patient_name: "Pat Q", prescriber_npi: "1234567890", units_prescribed: 5, written_utc: "2026-06-01T00:00:00.000Z" }
              as: DispensingPharmacist
              captures: { rx_id: $.data.id }
            - call: "POST /pharmacy-compounding/compounding-batches"
              payload: { facility_id: "${f_id}", master_formulation_record_id: "${mfr_id}", purpose: "PRESCRIPTION", prescription_id: "${rx_id}" }
              as: CompoundingPharmacist
              captures: { batch_id: $.data.id }
            - call: "POST /pharmacy-compounding/batch-ingredient-usages"
              payload: { compounding_batch_id: "${batch_id}", ingredient_lot_id: "${lot_id}", grams_used: 10 }
              as: CompoundingPharmacist
            - call: "POST /pharmacy-compounding/compounding-batches/${batch_id}/start"
              payload: {}
              as: CompoundingPharmacist
            - call: "POST /pharmacy-compounding/compounding-batches/${batch_id}/compile"
              payload: { actual_yield_units: 5 }
              as: CompoundingPharmacist
            - call: "POST /pharmacy-compounding/compounding-batches/${batch_id}/reject"
              payload: {}
              as: QualityAssurancePharmacist
          trigger:
            - call: "POST /pharmacy-compounding/compounding-batches/${batch_id}/reject"
              payload: {}
              as: QualityAssurancePharmacist
              captures: { error_id: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "response.data.error_id == ERR_BATCH_NOT_IN_STATE"
            - "CompoundingBatch.${batch_id}.status == REJECTED"

      - name: start_idempotency_second_start_returns_invalid_state
        claim_type: Idempotency
        grounds:
          - state_machines.CompoundingBatch.DRAFT_to_IN_PROCESS
          - errors[ERR_BATCH_NOT_IN_STATE]
          - endpoints["POST /pharmacy-compounding/compounding-batches/{bid}/start"]
        distinguishing_aspect: "Calling /start twice: second call observes IN_PROCESS (not DRAFT) -> ERR_BATCH_NOT_IN_STATE (409); lot grams not decremented twice."
        test_recipe:
          setup:
            - "A started (IN_PROCESS) batch with one charged usage (lot initial 50, used 10 -> remaining 40)."
          setup_api_calls:
            - call: "POST /pharmacy-compounding/facilities"
              payload: { name: "Acme", registration_type: "503B", state_code: "TX" }
              as: SystemAdmin
              captures: { f_id: $.data.id }
            - call: "POST /pharmacy-compounding/master-formulation-records"
              payload: { facility_id: "${f_id}", name: "F1", dosage_form: "ORAL_SOLID", default_bud_days_nonsterile: 90, theoretical_yield_units: 100, anticipatory_max_units: 500 }
              as: CompoundingPharmacist
              captures: { mfr_id: $.data.id }
            - call: "POST /pharmacy-compounding/ingredient-lots"
              payload: { facility_id: "${f_id}", component_name: "API X", lot_number: "X-1", labeled_potency_pct: 100, initial_grams: 50, expiration_utc: "2030-01-01T00:00:00.000Z" }
              as: CompoundingPharmacist
              captures: { lot_id: $.data.id }
            - call: "POST /pharmacy-compounding/compounding-batches"
              payload: { facility_id: "${f_id}", master_formulation_record_id: "${mfr_id}", purpose: "OFFICE_USE" }
              as: CompoundingPharmacist
              captures: { batch_id: $.data.id }
            - call: "POST /pharmacy-compounding/batch-ingredient-usages"
              payload: { compounding_batch_id: "${batch_id}", ingredient_lot_id: "${lot_id}", grams_used: 10 }
              as: CompoundingPharmacist
            - call: "POST /pharmacy-compounding/compounding-batches/${batch_id}/start"
              payload: {}
              as: CompoundingPharmacist
          trigger:
            - call: "POST /pharmacy-compounding/compounding-batches/${batch_id}/start"
              payload: {}
              as: CompoundingPharmacist
              captures: { error_id: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "response.data.error_id == ERR_BATCH_NOT_IN_STATE"
            - "IngredientLot.${lot_id}.remaining_grams == 40.0 (not double-decremented to 30)"

      - name: start_blocked_when_mfr_retired_guarded_transition
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.CompoundingBatch.DRAFT_to_IN_PROCESS
          - entities.MasterFormulationRecord.fields.status
          - errors[ERR_MFR_RETIRED]
          - endpoints["POST /pharmacy-compounding/master-formulation-records/{mid}/retire"]
        distinguishing_aspect: "MFR retired (status RETIRED) after a DRAFT batch was created; /start -> ERR_MFR_RETIRED (409) (guarded by MFR.status==ACTIVE)."
        test_recipe:
          setup:
            - "A DRAFT batch with a charged usage; its MFR is then RETIRED."
