# =============================================================================
# PRD Benchmark Scaffold — Flood Zone Determination & Map Amendment Support
# §1.0–§1.7. Difficulty design lives in SCAFFOLD_DIFFICULTY_DESIGN.yaml (§1.8);
# corner design lives in SCAFFOLD_CORNER_DESIGN.yaml (§1.9).
# =============================================================================

scenario: |
  Generate task harder than expert level!

  2549. Flood Zone Determination & Map Amendment Support (flood zone determination provider):
  property geocoding against the current flood hazard maps with structure-level determination,
  life-of-loan monitoring for map revisions and re-determination notices to lenders, borrower
  dispute of a determination with joint review by the federal agency, elevation certificate
  collection and letter of map amendment or revision preparation, base flood elevation
  comparison and lowest floor calculations, mandatory purchase requirement notice and
  force-placement triggers for lenders, community participation status affecting availability
  of coverage, map revision project tracking and preliminary map impact analysis

domain_name: flood-zone-determination
api_prefix: /flood-zone

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: multi_party_negotiation
  difficulty_level: expert_plus            # above the §0.4 Expert band by design ("harder than expert")
  complexity_layers:
    - optimistic_concurrency               # OCC on LoanFolio.version for re-determination create-with-supersede
    - cascading_side_effects               # panel-effective and dispute-sustained chains, depth 5 each
    - dual_variant_calculation             # zone resolution (strict vs lenient) and force-placed premium (estimate vs actual)
    - rate_threshold_triggers              # geocode buffer boundary, coverage caps, notice windows, fee tiers

  entity_topology: flat
  # Every entity is a top-level collection under /flood-zone; relationships are
  # expressed exclusively through FK fields in request bodies, never through
  # nested URL paths. Sub-resources exist only as action endpoints on the owner.

  state_machine_shape: cyclic
  # Determination:      ISSUED -> UNDER_DISPUTE -> ISSUED and ISSUED -> FLAGGED_FOR_REVIEW -> ISSUED
  # MapPanel:           PRELIMINARY -> APPEAL_OPEN -> PRELIMINARY (revised preliminary round)
  # Dispute:            SUBMITTED -> JOINT_AGENCY_REVIEW -> SUBMITTED (agency remand, round + 1)
  # MapAmendmentRequest SUBMITTED_TO_AGENCY -> ADDITIONAL_DATA_REQUESTED -> SUBMITTED_TO_AGENCY
  # LoanFolio:          parallel dimensions (monitoring_status x insurance_status)

  relationship_patterns:
    - one_to_many          # Community -> Property, Property -> Structure, LoanFolio -> Determination
    - self_referential     # MapPanel.supersedes_panel_id, Determination.supersedes_determination_id
    - cross_aggregate      # Determination spans LoanFolio (lender aggregate) and Structure (map aggregate)
    - polymorphic          # ComplianceNotice.acknowledged_by_role is Lender or Borrower

  role_model: segregation_of_duties
  # The ProviderAnalyst X-User-ID that issued a Determination may not perform the
  # provider review of a Dispute against it, and the provider user that submitted
  # an ElevationCertificate may not review that certificate.

  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Community
    parent: null
    common_fields: true
    fields:
      - name: community_id_code
        type: string
        source: input
        description: "NFIP community identification number (CID), 6 characters"
        constraints: "unique across Community"
      - name: name
        type: string
        source: input
        description: "community name as printed on the FIRM"
      - name: state_code
        type: string
        source: input
        description: "2-letter USPS state code; selects the NGVD29->NAVD88 datum offset"
        constraints: "one of {CA, FL, TX, NC}"
      - name: participation_status
        type: enum
        source: input
        default: REGULAR
        description: "NFIP participation standing of the community"
        constraints: "{REGULAR, EMERGENCY, PROBATION, SUSPENDED, NON_PARTICIPATING, WITHDRAWN}"
      - name: cbrs_flag
        type: boolean
        source: input
        default: false
        description: "true when the community sits inside a Coastal Barrier Resources System unit; federal flood insurance is unavailable regardless of participation_status"
      - name: probation_surcharge_cents
        type: integer
        source: input
        default: 0
        description: "annual probation surcharge; only meaningful while participation_status == PROBATION"
        constraints: ">= 0"
      - name: coverage_availability
        type: enum
        source: computed
        description: "availability of federal flood insurance per calculations.community_coverage_availability"
        constraints: "{FULL, FULL_WITH_SURCHARGE, EMERGENCY_LIMITS_ONLY, UNAVAILABLE}"
      - name: last_participation_change_at
        type: datetime
        source: system
        description: "logical-clock instant of the most recent participation_status write; equals created_at at creation"
      - name: active_folio_count
        type: integer
        source: computed
        description: "count of LoanFolio rows whose Property.community_id == this Community.id and whose monitoring_status IN {ACTIVE, SUSPENDED} (cross-entity computed field)"

  - name: Lender
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: "lender institution name"
      - name: contact_email
        type: string
        source: input
        description: "notice delivery address for compliance notices"
      - name: force_placement_authorized_flag
        type: boolean
        source: input
        default: true
        description: "false when the lender's servicing agreement forbids force placement"
      - name: escrow_servicing_flag
        type: boolean
        source: input
        default: true
        description: "false when the lender does not escrow; force-placed premiums may not be debited"
      - name: open_force_placement_count
        type: integer
        source: computed
        description: "count of LoanFolio rows with lender_id == this Lender.id and insurance_status == FORCE_PLACED (cross-entity computed field)"

  - name: MapPanel
    parent: null
    common_fields: true
    fields:
      - name: community_id
        type: string
        source: input
        description: "FK -> Community.id"
      - name: map_panel_number
        type: string
        source: input
        description: "FIRM panel number; (community_id, map_panel_number) is the map timeline key"
      - name: revision_sequence
        type: integer
        source: input
        description: "1 = initial FIRM published directly as EFFECTIVE; >= 2 = revision panel that must walk the preliminary/appeal/LFD workflow"
        constraints: ">= 1"
      - name: supersedes_panel_id
        type: string
        source: input
        default: null
        description: "FK -> MapPanel.id; null when revision_sequence == 1, otherwise the EFFECTIVE panel with the same (community_id, map_panel_number) and revision_sequence == this.revision_sequence - 1"
      - name: revision_status
        type: enum
        source: system
        description: "lifecycle position of this panel in the map revision project"
        constraints: "{PRELIMINARY, APPEAL_OPEN, LFD_ISSUED, EFFECTIVE, SUPERSEDED}"
      - name: zone_code
        type: enum
        source: input
        description: "flood zone this panel assigns to structures inside its Special Flood Hazard Area"
        constraints: "{A, AE, AO, AH, VE}"
      - name: base_flood_elevation_ft
        type: number
        source: input
        default: null
        description: "base flood elevation in NAVD88 feet, 2 decimal places; null for unnumbered zone A"
      - name: sfha_boundary_shift_ft
        type: number
        source: input
        default: 0
        description: "signed feet this panel moves the SFHA boundary relative to the revision_sequence 1 digitization; positive = SFHA expanded outward"
      - name: horizontal_uncertainty_ft
        type: number
        source: input
        default: 0
        description: "cartographic uncertainty of this panel, added to the geocode buffer in calculations.structure_zone_determination"
        constraints: ">= 0"
      - name: effective_date
        type: datetime
        source: input
        description: "printed effective date; panel governs the half-open interval [effective_date, successor.effective_date)"
      - name: appeal_period_end_date
        type: datetime
        source: system
        default: null
        description: "clock instant the 90-day appeal period closes; set when the appeal period opens, cleared on a revised preliminary"
      - name: lfd_issued_at
        type: datetime
        source: system
        default: null
        description: "clock instant the Letter of Final Determination was issued"
      - name: superseded_at
        type: datetime
        source: system
        default: null
        description: "clock instant a successor panel became EFFECTIVE"
      - name: revision_round
        type: integer
        source: system
        default: 0
        description: "number of revised-preliminary rounds this panel has been through"
      - name: study_case_number
        type: string
        source: input
        default: null
        description: "federal agency study case number tracking the map revision project"

  - name: Property
    parent: null
    common_fields: true
    fields:
      - name: community_id
        type: string
        source: input
        description: "FK -> Community.id"
      - name: street_address
        type: string
        source: input
        description: "situs street address submitted for geocoding"
      - name: city
        type: string
        source: input
        description: "situs city"
      - name: postal_code
        type: string
        source: input
        description: "situs postal code"
      - name: map_panel_number
        type: string
        source: input
        description: "FIRM panel number the parcel falls on; joins to MapPanel.map_panel_number within community_id"
      - name: latitude
        type: number
        source: input
        description: "geocoded latitude, 6 decimal places"
      - name: longitude
        type: number
        source: input
        description: "geocoded longitude, 6 decimal places"
      - name: geocode_method
        type: enum
        source: input
        description: "positional method the geocoder resolved; selects GEOCODE_BUFFER_FT"
        constraints: "{ROOFTOP, PARCEL_CENTROID, ZIP_CENTROID, FAILED}"
      - name: geocode_confidence_score
        type: number
        source: input
        description: "geocoder confidence, 2 decimal places, 0.00-1.00"
        constraints: "0.00 <= value <= 1.00"
      - name: geocode_status
        type: enum
        source: computed
        description: "GEOCODED iff geocode_method != FAILED AND geocode_confidence_score >= GEOCODE_CONFIDENCE_FLOOR (0.60); otherwise UNRESOLVED"
        constraints: "{GEOCODED, UNRESOLVED}"
      - name: geocode_buffer_ft
        type: number
        source: computed
        description: "GEOCODE_BUFFER_FT[geocode_method]; 0 for ROOFTOP, 25 for PARCEL_CENTROID, 250 for ZIP_CENTROID, null-equivalent 0 for FAILED"
      - name: geocode_corrected_count
        type: integer
        source: system
        default: 0
        description: "number of accepted geocode corrections on this property"
      - name: structure_count
        type: integer
        source: computed
        description: "count of Structure rows with property_id == this Property.id"

  - name: Structure
    parent: null
    common_fields: true
    fields:
      - name: property_id
        type: string
        source: input
        description: "FK -> Property.id"
      - name: structure_label
        type: string
        source: input
        description: "label distinguishing structures on the same parcel, e.g. PRINCIPAL_RESIDENCE"
      - name: occupancy_type
        type: enum
        source: input
        description: "NFIP occupancy class; selects the building coverage cap"
        constraints: "{SINGLE_FAMILY, TWO_TO_FOUR_FAMILY, OTHER_RESIDENTIAL, NON_RESIDENTIAL}"
      - name: foundation_type
        type: enum
        source: input
        description: "foundation class recorded on the elevation certificate"
        constraints: "{SLAB, CRAWLSPACE, BASEMENT, PIER_PILE}"
      - name: replacement_cost_cents
        type: integer
        source: input
        description: "insurable replacement cost of the structure in cents"
        constraints: "> 0"
      - name: sfha_offset_ft
        type: number
        source: input
        description: "signed horizontal feet from the SFHA boundary as digitized on the community's revision_sequence 1 FIRM; negative = inside the SFHA, positive = outside, 0 = on the boundary"
      - name: post_firm_flag
        type: boolean
        source: input
        default: true
        description: "construction started on or after the community's initial FIRM date"
      - name: fill_placed_flag
        type: boolean
        source: input
        default: false
        description: "true when engineered fill raised the structure; selects LOMR_F instead of LOMA"
      - name: lowest_floor_elevation_ft
        type: number
        source: computed
        default: null
        description: "converted_lowest_floor_ft copied from the ElevationCertificate whose review set status VALIDATED"
      - name: lowest_adjacent_grade_ft
        type: number
        source: computed
        default: null
        description: "converted_lag_ft copied from the ElevationCertificate whose review set status VALIDATED"
      - name: elevation_source_certificate_id
        type: string
        source: system
        default: null
        description: "FK -> ElevationCertificate.id; the certificate whose VALIDATED review populated the elevation fields"

  - name: LoanFolio
    parent: null
    common_fields: true
    fields:
      - name: lender_id
        type: string
        source: input
        description: "FK -> Lender.id"
      - name: property_id
        type: string
        source: input
        description: "FK -> Property.id"
      - name: loan_number
        type: string
        source: input
        description: "lender's loan identifier"
        constraints: "unique per lender_id"
      - name: borrower_user_id
        type: string
        source: input
        description: "opaque X-User-ID the Borrower role must present to act on this folio"
      - name: principal_balance_cents
        type: integer
        source: input
        description: "outstanding principal in cents"
        constraints: "> 0"
      - name: escrow_balance_cents
        type: integer
        source: input
        default: 0
        description: "escrow cash available to fund a force-placed premium"
        constraints: ">= 0"
      - name: initial_escrow_balance_cents
        type: integer
        source: system
        description: "escrow_balance_cents at folio creation; anchors the escrow conservation invariant"
      - name: policy_anniversary_date
        type: datetime
        source: input
        description: "annual policy renewal date used to prorate the force-placed premium"
      - name: monitoring_status
        type: enum
        source: system
        default: ACTIVE
        description: "life-of-loan monitoring dimension; independent of insurance_status"
        constraints: "{ACTIVE, SUSPENDED}"
      - name: insurance_status
        type: enum
        source: system
        default: NONE
        description: "coverage dimension; independent of monitoring_status"
        constraints: "{NONE, NOT_REQUIRED, BORROWER_PROVIDED, FORCE_PLACED}"
      - name: current_determination_id
        type: string
        source: system
        default: null
        description: "FK -> Determination.id; the non-SUPERSEDED determination governing this folio"
      - name: required_coverage_cents
        type: integer
        source: computed
        default: 0
        description: "mandatory purchase amount per calculations.required_coverage_amount"
      - name: reported_coverage_cents
        type: integer
        source: system
        default: 0
        description: "building coverage the lender last reported as borrower-provided"
      - name: uninsured_exposure_cents
        type: integer
        source: computed
        default: 0
        description: "max(0, required_coverage_cents - reported_coverage_cents) when insurance_status != FORCE_PLACED, else 0"
      - name: force_placed_premium_cents
        type: integer
        source: computed
        default: 0
        description: "chronological_actual variant of calculations.force_place_premium, debited from escrow at force placement"
      - name: force_placed_at
        type: datetime
        source: system
        default: null
        description: "clock instant force placement was executed"
      - name: force_placed_coverage_days
        type: integer
        source: computed
        default: 0
        description: "day count the force-placed premium purchased; denominator of the unearned-premium refund"
      - name: cumulative_earned_premium_cents
        type: integer
        source: computed
        default: 0
        description: "running total of force-placed premium recognized as earned; second term of the escrow conservation invariant"
      - name: open_notice_count
        type: integer
        source: computed
        default: 0
        description: "count of ComplianceNotice rows for this folio with status == SENT"
      - name: pending_redetermination_count
        type: integer
        source: computed
        default: 0
        description: "count of Determination rows for this folio with status == FLAGGED_FOR_REVIEW"
      - name: compliance_posture
        type: enum
        source: computed
        default: COMPLIANT
        description: "derived gate per calculations.compliance_posture; gates force placement and notice issuance"
        constraints: "{COMPLIANT, NOTICE_DUE, NOTICE_PENDING, FORCE_PLACE_ELIGIBLE, FORCE_PLACED, REVIEW_PENDING, COVERAGE_UNAVAILABLE}"

  - name: Determination
    parent: null
    common_fields: true
    fields:
      - name: loan_folio_id
        type: string
        source: input
        description: "FK -> LoanFolio.id"
      - name: structure_id
        type: string
        source: input
        description: "FK -> Structure.id; must belong to the Property referenced by the folio"
      - name: map_panel_id
        type: string
        source: system
        description: "FK -> MapPanel.id; the panel chosen by calculations.effective_panel_selector at issuance"
      - name: determination_type
        type: enum
        source: input
        description: "ORIGINATION and LIFE_OF_LOAN_REVIEW are client-supplied; DISPUTE_REVISION is minted only by the dispute-sustained cascade"
        constraints: "{ORIGINATION, LIFE_OF_LOAN_REVIEW, DISPUTE_REVISION}"
      - name: status
        type: enum
        source: system
        default: ISSUED
        description: "determination lifecycle state"
        constraints: "{ISSUED, FLAGGED_FOR_REVIEW, UNDER_DISPUTE, SUPERSEDED}"
      - name: position_class
        type: enum
        source: computed
        description: "geometric classification of the structure against the panel's SFHA boundary per calculations.structure_zone_determination"
        constraints: "{INSIDE, OUTSIDE, INDETERMINATE}"
      - name: zone_code
        type: enum
        source: computed
        description: "flood zone assigned to the structure; X when the structure resolves OUTSIDE the SFHA"
        constraints: "{A, AE, AO, AH, VE, X}"
      - name: sfha_flag
        type: boolean
        source: computed
        description: "true when the structure is treated as being in the Special Flood Hazard Area"
      - name: base_flood_elevation_ft
        type: number
        source: computed
        default: null
        description: "MapPanel.base_flood_elevation_ft snapshot when sfha_flag == true, else null"
      - name: freeboard_ft
        type: number
        source: computed
        default: null
        description: "Structure.lowest_floor_elevation_ft - base_flood_elevation_ft rounded to 1 decimal; null when either input is null"
      - name: mandatory_purchase_flag
        type: boolean
        source: computed
        description: "sfha_flag AND Community.coverage_availability != UNAVAILABLE"
      - name: issued_by_user_id
        type: string
        source: system
        description: "X-User-ID of the ProviderAnalyst that issued it, or the literal string 'system' for cascade-issued determinations; anchors the segregation-of-duties check on provider review"
      - name: supersedes_determination_id
        type: string
        source: system
        default: null
        description: "FK -> Determination.id; the determination this one replaces"
      - name: superseded_at
        type: datetime
        source: system
        default: null
        description: "clock instant this determination left the governing position"
      - name: flagged_reason
        type: enum
        source: system
        default: null
        description: "why this determination was flagged for life-of-loan re-determination"
        constraints: "{MAP_REVISION, GEOCODE_CORRECTION} or null"
      - name: issued_at
        type: datetime
        source: system
        description: "logical-clock instant of issuance"

  - name: Dispute
    parent: null
    common_fields: true
    fields:
      - name: determination_id
        type: string
        source: input
        description: "FK -> Determination.id; must be in status ISSUED"
      - name: basis
        type: enum
        source: input
        description: "grounds asserted by the borrower; each basis carries its own admissibility precondition"
        constraints: "{GEOCODE_ERROR, STRUCTURE_LOCATION, ELEVATION_ABOVE_BFE, MAP_PANEL_STALE}"
      - name: borrower_statement
        type: string
        source: input
        description: "borrower's narrative supporting the dispute"
      - name: asserted_sfha_offset_ft
        type: number
        source: input
        description: "signed SFHA boundary offset the borrower asserts is correct; written onto Structure.sfha_offset_ft when the dispute is sustained"
      - name: status
        type: enum
        source: system
        default: SUBMITTED
        description: "dispute lifecycle state"
        constraints: "{SUBMITTED, JOINT_AGENCY_REVIEW, SUSTAINED, DENIED}"
      - name: round_number
        type: integer
        source: system
        default: 1
        description: "joint-review round; incremented when the agency remands with NON_CONCUR below MAX_DISPUTE_ROUNDS"
        constraints: "1 <= value <= 2"
      - name: provider_recommendation
        type: enum
        source: system
        default: null
        description: "recommendation the provider forwarded into joint review; reset to null on remand"
        constraints: "{UPHOLD, REVISE} or null"
      - name: provider_reviewed_by_user_id
        type: string
        source: system
        default: null
        description: "X-User-ID of the ProviderReviewer that produced provider_recommendation in the current round"
      - name: agency_concurrence
        type: enum
        source: system
        default: null
        description: "federal agency position on the provider recommendation in the latest completed round"
        constraints: "{CONCUR, NON_CONCUR} or null"
      - name: agency_reviewed_by_user_id
        type: string
        source: system
        default: null
        description: "X-User-ID of the AgencyOfficer that recorded agency_concurrence"
      - name: resolution
        type: enum
        source: computed
        default: null
        description: "how the dispute terminated per the (concurrence, recommendation, round_number) matrix"
        constraints: "{UPHELD_BY_CONCURRENCE, REVISED_BY_CONCURRENCE, UPHELD_BY_AGENCY_OVERRIDE, REVISED_BY_AGENCY_OVERRIDE} or null"
      - name: revised_determination_id
        type: string
        source: system
        default: null
        description: "FK -> Determination.id; the DISPUTE_REVISION determination minted when the dispute was sustained"
      - name: filed_at
        type: datetime
        source: system
        description: "clock instant of submission of the current round"
      - name: decision_due_at
        type: datetime
        source: computed
        description: "filed_at + DISPUTE_DECISION_DAYS (30 days); recomputed on each remand"
      - name: resolved_at
        type: datetime
        source: system
        default: null
        description: "clock instant the dispute reached SUSTAINED or DENIED"

  - name: ElevationCertificate
    parent: null
    common_fields: true
    fields:
      - name: structure_id
        type: string
        source: input
        description: "FK -> Structure.id"
      - name: dispute_id
        type: string
        source: input
        default: null
        description: "FK -> Dispute.id; set when the certificate is filed as dispute evidence"
      - name: reference_panel_id
        type: string
        source: system
        description: "FK -> MapPanel.id; the panel supplying base_flood_elevation_ft at submission, chosen by calculations.effective_panel_selector"
      - name: surveyor_license_number
        type: string
        source: input
        description: "licensed surveyor identifier on the FEMA elevation certificate"
      - name: survey_date
        type: datetime
        source: input
        description: "date of survey; CERTIFICATE_VALIDITY_DAYS (365) is measured from here"
      - name: datum
        type: enum
        source: input
        description: "vertical datum of the raw elevations"
        constraints: "{NAVD88, NGVD29}"
      - name: raw_lowest_floor_elevation_ft
        type: number
        source: input
        description: "lowest floor elevation as surveyed, 2 decimal places, in the stated datum"
      - name: raw_lowest_adjacent_grade_ft
        type: number
        source: input
        description: "lowest adjacent grade as surveyed, 2 decimal places, in the stated datum"
      - name: machinery_elevation_ft
        type: number
        source: input
        default: null
        description: "elevation of machinery and equipment servicing the building, in the stated datum"
      - name: converted_lowest_floor_ft
        type: number
        source: computed
        description: "raw_lowest_floor_elevation_ft shifted to NAVD88 then rounded to 1 decimal (round_half_up) per calculations.elevation_certificate_conversion"
      - name: converted_lag_ft
        type: number
        source: computed
        description: "raw_lowest_adjacent_grade_ft shifted to NAVD88 then rounded to 1 decimal (round_half_up)"
      - name: freeboard_ft
        type: number
        source: computed
        description: "round_half_up(converted_lowest_floor_ft - reference panel base_flood_elevation_ft, 1)"
      - name: lag_freeboard_ft
        type: number
        source: computed
        description: "round_half_up(converted_lag_ft - reference panel base_flood_elevation_ft, 1)"
      - name: status
        type: enum
        source: system
        default: SUBMITTED
        description: "review state of the certificate"
        constraints: "{SUBMITTED, VALIDATED, REJECTED}"
      - name: rejection_reason
        type: enum
        source: system
        default: null
        description: "reason recorded when a review sets status REJECTED"
        constraints: "{DATUM_MISMATCH, SURVEY_STALE, MISSING_MACHINERY_ELEVATION} or null"
      - name: submitted_by_user_id
        type: string
        source: system
        description: "X-User-ID that filed the certificate; anchors the segregation-of-duties check on certificate review"
      - name: reviewed_by_user_id
        type: string
        source: system
        default: null
        description: "X-User-ID of the ProviderReviewer that reviewed the certificate"

  - name: MapAmendmentRequest
    parent: null
    common_fields: true
    fields:
      - name: determination_id
        type: string
        source: input
        description: "FK -> Determination.id; the determination the amendment seeks to overturn"
      - name: elevation_certificate_id
        type: string
        source: input
        description: "FK -> ElevationCertificate.id; must reference the same Structure as the determination"
      - name: request_type
        type: enum
        source: input
        description: "LOMA for naturally high ground, LOMR_F when engineered fill raised the structure"
        constraints: "{LOMA, LOMR_F}"
      - name: expedite_flag
        type: boolean
        source: input
        default: false
        description: "true when the requester pays the expedite surcharge"
      - name: status
        type: enum
        source: system
        default: DRAFT
        description: "amendment request lifecycle state"
        constraints: "{DRAFT, SUBMITTED_TO_AGENCY, ADDITIONAL_DATA_REQUESTED, GRANTED, DENIED}"
      - name: resubmission_count
        type: integer
        source: system
        default: 0
        description: "number of times this request was resubmitted after ADDITIONAL_DATA_REQUESTED"
        constraints: "0 <= value <= 2"
      - name: base_review_fee_cents
        type: integer
        source: computed
        description: "BASE_FEE_CENTS[request_type] + RESUBMISSION_FEE_CENTS * resubmission_count"
      - name: fee_tier
        type: enum
        source: computed
        description: "tier keyed on base_review_fee_cents (pre-surcharge), never on total_fee_cents"
        constraints: "{TIER_1, TIER_2, TIER_3}"
      - name: expedite_surcharge_cents
        type: integer
        source: computed
        default: 0
        description: "round_half_up(EXPEDITE_SURCHARGE_PCT[fee_tier] * base_review_fee_cents) when expedite_flag, else 0"
      - name: total_fee_cents
        type: integer
        source: computed
        description: "base_review_fee_cents + expedite_surcharge_cents"
      - name: agency_case_number
        type: string
        source: system
        default: null
        description: "case number the federal agency assigns on decision"
      - name: additional_data_note
        type: string
        source: system
        default: null
        description: "agency's request for additional data on the latest ADDITIONAL_DATA_REQUESTED decision"
      - name: prepared_by_user_id
        type: string
        source: system
        description: "X-User-ID of the ProviderAnalyst that prepared the request"
      - name: submitted_at
        type: datetime
        source: system
        default: null
        description: "clock instant of the most recent submission or resubmission"
      - name: decided_at
        type: datetime
        source: system
        default: null
        description: "clock instant of the agency decision that terminated the request"

  - name: ComplianceNotice
    parent: null
    common_fields: true
    fields:
      - name: loan_folio_id
        type: string
        source: input
        description: "FK -> LoanFolio.id"
      - name: determination_id
        type: string
        source: input
        description: "FK -> Determination.id; the determination the notice cites"
      - name: notice_type
        type: enum
        source: input
        description: "MANDATORY_PURCHASE, FORCE_PLACEMENT_WARNING and COVERAGE_UNAVAILABLE are lender-issued; RE_DETERMINATION is minted only by system cascades"
        constraints: "{MANDATORY_PURCHASE, FORCE_PLACEMENT_WARNING, COVERAGE_UNAVAILABLE, RE_DETERMINATION}"
      - name: annual_premium_rate_cents
        type: integer
        source: input
        description: "annual force-placement premium quoted by the lender's carrier; 0 when not applicable"
        constraints: ">= 0"
      - name: status
        type: enum
        source: system
        default: SENT
        description: "notice lifecycle state"
        constraints: "{SENT, ACKNOWLEDGED, EXPIRED, SUPERSEDED}"
      - name: sent_at
        type: datetime
        source: system
        description: "clock instant the notice was delivered"
      - name: response_deadline_at
        type: datetime
        source: computed
        description: "sent_at + NOTICE_RESPONSE_DAYS[notice_type]; right end of the closed response window"
      - name: required_coverage_snapshot_cents
        type: integer
        source: computed
        description: "LoanFolio.required_coverage_cents at the instant the notice was sent"
      - name: estimated_force_place_premium_cents
        type: integer
        source: computed
        description: "forward_looking_estimate variant of calculations.force_place_premium, computed at send time from whole months remaining"
      - name: acknowledged_at
        type: datetime
        source: system
        default: null
        description: "clock instant of acknowledgement"
      - name: acknowledged_by_role
        type: enum
        source: system
        default: null
        description: "role that acknowledged the notice"
        constraints: "{Lender, Borrower} or null"
      - name: closed_at
        type: datetime
        source: system
        default: null
        description: "clock instant the notice reached EXPIRED or SUPERSEDED"

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: MapPanel
    initial_state: PRELIMINARY
    terminal_states: [SUPERSEDED]
    transitions:
      - from: PRELIMINARY
        to: EFFECTIVE
        trigger: "POST /flood-zone/map-panels with revision_sequence == 1 (automatic at creation)"
        actor: system
        preconditions:
          - "revision_sequence == 1"
          - "supersedes_panel_id is null"
          - "no MapPanel with the same (community_id, map_panel_number) and revision_status == EFFECTIVE exists"
        side_effects:
          - "revision_status set to EFFECTIVE at creation instead of PRELIMINARY"
          - "effective_date stored from the request body"
        note: "an initial FIRM is published, not revised; revision_sequence >= 2 panels start in PRELIMINARY instead"
      - from: PRELIMINARY
        to: APPEAL_OPEN
        trigger: "POST /flood-zone/map-panels/{map_panel_id}/appeal-period"
        actor: AgencyOfficer
        preconditions:
          - "revision_status == PRELIMINARY"
          - "revision_sequence >= 2"
        side_effects:
          - "appeal_period_end_date set to current_utc + APPEAL_PERIOD_DAYS (90 days)"
      - from: APPEAL_OPEN
        to: PRELIMINARY
        trigger: "POST /flood-zone/map-panels/{map_panel_id}/appeal-decision with outcome == REVISED_PRELIMINARY"
        actor: AgencyOfficer
        preconditions:
          - "revision_status == APPEAL_OPEN"
          - "current_utc >= appeal_period_end_date"
        side_effects:
          - "revision_round incremented by 1"
          - "appeal_period_end_date cleared to null"
          - "lfd_issued_at remains null"
        note: "cycle: appeals forced a re-issue of the preliminary map, so the panel returns to PRELIMINARY and may open a second appeal period"
      - from: APPEAL_OPEN
        to: LFD_ISSUED
        trigger: "POST /flood-zone/map-panels/{map_panel_id}/appeal-decision with outcome == LFD_ISSUED"
        actor: AgencyOfficer
        preconditions:
          - "revision_status == APPEAL_OPEN"
          - "current_utc >= appeal_period_end_date"
        side_effects:
          - "lfd_issued_at set to current_utc"
        note: "branch sibling of the REVISED_PRELIMINARY outcome; the two outcomes write disjoint field sets"
      - from: LFD_ISSUED
        to: EFFECTIVE
        trigger: "POST /flood-zone/map-panels/{map_panel_id}/effective"
        actor: AgencyOfficer
        preconditions:
          - "revision_status == LFD_ISSUED"
          - "current_utc >= lfd_issued_at + LFD_WAITING_PERIOD_DAYS (180 days)"
          - "effective_date <= current_utc"
          - "effective_date > effective_date of the MapPanel referenced by supersedes_panel_id (strict; half-open interval semantics)"
        side_effects:
          - "HOP 1: revision_status set to EFFECTIVE"
          - "HOP 2: because this panel became EFFECTIVE, the MapPanel referenced by supersedes_panel_id transitions EFFECTIVE -> SUPERSEDED with superseded_at = current_utc"
          - "HOP 3: because that predecessor is now SUPERSEDED, every Determination with map_panel_id == predecessor.id and status == ISSUED transitions ISSUED -> FLAGGED_FOR_REVIEW with flagged_reason = MAP_REVISION"
          - "HOP 4: because those determinations are now FLAGGED_FOR_REVIEW, each referenced LoanFolio recomputes pending_redetermination_count and compliance_posture, yielding REVIEW_PENDING"
          - "HOP 5: because those folios entered REVIEW_PENDING, every ComplianceNotice on them with status == SENT and notice_type IN {MANDATORY_PURCHASE, FORCE_PLACEMENT_WARNING} transitions SENT -> SUPERSEDED with closed_at = current_utc, and each folio recomputes open_notice_count"
      - from: EFFECTIVE
        to: SUPERSEDED
        trigger: "system: a successor MapPanel with revision_sequence == this.revision_sequence + 1 became EFFECTIVE"
        actor: system
        preconditions:
          - "revision_status == EFFECTIVE"
          - "the successor names this panel in supersedes_panel_id"
        side_effects:
          - "superseded_at set to current_utc"
          - "HOP 3 of the successor's cascade fires against the determinations citing this panel"

  - entity: Determination
    initial_state: ISSUED
    terminal_states: [SUPERSEDED]
    transitions:
      - from: ISSUED
        to: UNDER_DISPUTE
        trigger: "POST /flood-zone/disputes"
        actor: Borrower
        preconditions:
          - "status == ISSUED (FLAGGED_FOR_REVIEW determinations may not be disputed)"
          - "the acting X-User-ID equals LoanFolio.borrower_user_id of the folio referenced by loan_folio_id"
        side_effects:
          - "Dispute created in SUBMITTED with round_number = 1"
      - from: UNDER_DISPUTE
        to: ISSUED
        trigger: "POST /flood-zone/disputes/{dispute_id}/agency-review resolving the dispute to DENIED"
        actor: AgencyOfficer
        preconditions:
          - "status == UNDER_DISPUTE"
          - "the resolving Dispute reaches status DENIED"
        side_effects:
          - "status returns to ISSUED with no field of the determination other than status, updated_at and version changed"
        note: "cycle: a denied dispute returns the same determination row to the governing position"
      - from: UNDER_DISPUTE
        to: SUPERSEDED
        trigger: "POST /flood-zone/disputes/{dispute_id}/agency-review resolving the dispute to SUSTAINED"
        actor: AgencyOfficer
        preconditions:
          - "status == UNDER_DISPUTE"
          - "the resolving Dispute reaches status SUSTAINED"
        side_effects:
          - "HOP 1: Dispute.status set to SUSTAINED with resolved_at = current_utc"
          - "HOP 2: because the dispute is sustained, Structure.sfha_offset_ft of the disputed structure is overwritten with Dispute.asserted_sfha_offset_ft"
          - "HOP 3: because the structure geometry changed, this determination is SUPERSEDED (superseded_at = current_utc) and a new Determination is minted with determination_type = DISPUTE_REVISION, supersedes_determination_id = this.id, issued_by_user_id = 'system', recomputed by calculations.structure_zone_determination variant origination_strict"
          - "HOP 4: because the folio's current determination changed, LoanFolio.current_determination_id, required_coverage_cents, uninsured_exposure_cents and insurance_status are recomputed; when the revision yields sfha_flag == false and insurance_status was FORCE_PLACED, insurance_status becomes NOT_REQUIRED and calculations.escrow_settlement refunds the unearned premium into escrow_balance_cents"
          - "HOP 5: because insurance_status became NOT_REQUIRED, every ComplianceNotice on the folio with status == SENT transitions SENT -> SUPERSEDED, open_notice_count is recomputed, and a system ComplianceNotice with notice_type = RE_DETERMINATION citing the new determination is sent to the lender"
      - from: ISSUED
        to: FLAGGED_FOR_REVIEW
        trigger: "system: HOP 3 of the panel-effective cascade, or HOP 2 of the geocode-correction cascade"
        actor: system
        preconditions:
          - "status == ISSUED"
          - "either the cited MapPanel became SUPERSEDED, or the Property of the cited Structure accepted a geocode correction"
        side_effects:
          - "flagged_reason set to MAP_REVISION or GEOCODE_CORRECTION respectively"
          - "LoanFolio.pending_redetermination_count and compliance_posture recomputed"
      - from: FLAGGED_FOR_REVIEW
        to: ISSUED
        trigger: "POST /flood-zone/monitoring-runs where the re-determination reproduces the same (zone_code, sfha_flag)"
        actor: ProviderAnalyst
        preconditions:
          - "status == FLAGGED_FOR_REVIEW"
          - "calculations.structure_zone_determination variant life_of_loan_lenient yields zone_code and sfha_flag identical to the flagged determination"
        side_effects:
          - "flagged_reason cleared to null"
          - "map_panel_id repointed to the panel chosen by calculations.effective_panel_selector"
          - "LoanFolio.pending_redetermination_count decremented and compliance_posture recomputed"
          - "no new Determination row is created and no ComplianceNotice is sent"
        note: "cycle: the determination returns to ISSUED without being superseded"
      - from: FLAGGED_FOR_REVIEW
        to: SUPERSEDED
        trigger: "POST /flood-zone/monitoring-runs where the re-determination changes (zone_code, sfha_flag)"
        actor: ProviderAnalyst
        preconditions:
          - "status == FLAGGED_FOR_REVIEW"
          - "calculations.structure_zone_determination variant life_of_loan_lenient yields a different zone_code or sfha_flag"
        side_effects:
          - "superseded_at = current_utc; a new Determination with determination_type = LIFE_OF_LOAN_REVIEW and supersedes_determination_id = this.id is created with issued_by_user_id = 'system'"
          - "LoanFolio.current_determination_id repointed, required_coverage_cents and compliance_posture recomputed, pending_redetermination_count decremented"
          - "when the new determination has mandatory_purchase_flag == true and the folio insurance_status IN {NONE, NOT_REQUIRED}, a system ComplianceNotice with notice_type = RE_DETERMINATION is sent and open_notice_count is recomputed"
      - from: ISSUED
        to: SUPERSEDED
        trigger: "POST /flood-zone/determinations with determination_type == LIFE_OF_LOAN_REVIEW for the same (loan_folio_id, structure_id)"
        actor: ProviderAnalyst
        preconditions:
          - "status == ISSUED and this determination is the folio's current_determination_id"
          - "expected_loan_folio_version matches LoanFolio.version"
        side_effects:
          - "superseded_at = current_utc; the new determination carries supersedes_determination_id = this.id"
          - "LoanFolio.current_determination_id repointed, required_coverage_cents / uninsured_exposure_cents / compliance_posture recomputed, LoanFolio.version incremented by 1"
      - from: FLAGGED_FOR_REVIEW
        to: SUPERSEDED
        trigger: "POST /flood-zone/determinations with determination_type == LIFE_OF_LOAN_REVIEW issued manually against a flagged determination"
        actor: ProviderAnalyst
        preconditions:
          - "status == FLAGGED_FOR_REVIEW and this determination is the folio's current_determination_id"
          - "expected_loan_folio_version matches LoanFolio.version"
        side_effects:
          - "same as the ISSUED -> SUPERSEDED manual path, plus LoanFolio.pending_redetermination_count decremented and flagged_reason carried onto the superseded row"

  - entity: Dispute
    initial_state: SUBMITTED
    terminal_states: [SUSTAINED, DENIED]
    transitions:
      - from: SUBMITTED
        to: JOINT_AGENCY_REVIEW
        trigger: "POST /flood-zone/disputes/{dispute_id}/provider-review"
        actor: ProviderReviewer
        preconditions:
          - "status == SUBMITTED"
          - "the acting X-User-ID differs from Determination.issued_by_user_id of the disputed determination (segregation of duties)"
        side_effects:
          - "provider_recommendation set to the supplied recommendation (UPHOLD or REVISE)"
          - "provider_reviewed_by_user_id set to the acting X-User-ID"
      - from: JOINT_AGENCY_REVIEW
        to: SUSTAINED
        trigger: "POST /flood-zone/disputes/{dispute_id}/agency-review with (concurrence == CONCUR AND provider_recommendation == REVISE) or (concurrence == NON_CONCUR AND round_number == MAX_DISPUTE_ROUNDS AND provider_recommendation == UPHOLD)"
        actor: AgencyOfficer
        preconditions:
          - "status == JOINT_AGENCY_REVIEW"
          - "provider_recommendation is not null"
        side_effects:
          - "resolution set to REVISED_BY_CONCURRENCE or REVISED_BY_AGENCY_OVERRIDE respectively; resolved_at = current_utc"
          - "revised_determination_id set to the DISPUTE_REVISION determination minted by HOPs 2-5 of the Determination UNDER_DISPUTE -> SUPERSEDED cascade"
      - from: JOINT_AGENCY_REVIEW
        to: DENIED
        trigger: "POST /flood-zone/disputes/{dispute_id}/agency-review with (concurrence == CONCUR AND provider_recommendation == UPHOLD) or (concurrence == NON_CONCUR AND round_number == MAX_DISPUTE_ROUNDS AND provider_recommendation == REVISE)"
        actor: AgencyOfficer
        preconditions:
          - "status == JOINT_AGENCY_REVIEW"
          - "provider_recommendation is not null"
        side_effects:
          - "resolution set to UPHELD_BY_CONCURRENCE or UPHELD_BY_AGENCY_OVERRIDE respectively; resolved_at = current_utc"
          - "the disputed Determination transitions UNDER_DISPUTE -> ISSUED; no new determination row is created; Structure.sfha_offset_ft is left untouched"
      - from: JOINT_AGENCY_REVIEW
        to: SUBMITTED
        trigger: "POST /flood-zone/disputes/{dispute_id}/agency-review with concurrence == NON_CONCUR while round_number < MAX_DISPUTE_ROUNDS (2)"
        actor: AgencyOfficer
        preconditions:
          - "status == JOINT_AGENCY_REVIEW"
          - "round_number < MAX_DISPUTE_ROUNDS (2)"
        side_effects:
          - "round_number incremented by 1; provider_recommendation and provider_reviewed_by_user_id cleared to null"
          - "agency_concurrence recorded as NON_CONCUR; agency_reviewed_by_user_id set"
          - "filed_at reset to current_utc and decision_due_at recomputed as filed_at + DISPUTE_DECISION_DAYS (30 days)"
          - "the disputed Determination remains UNDER_DISPUTE"
        note: "cycle: the agency remands the packet for a second provider review"

  - entity: LoanFolio
    dimension: monitoring_status
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "system: POST /flood-zone/communities/{community_id}/participation-changes moves the community to a status whose coverage_availability is UNAVAILABLE"
        actor: system
        preconditions:
          - "monitoring_status == ACTIVE"
          - "Property.community_id of the folio equals the changed Community.id"
          - "Community.coverage_availability becomes UNAVAILABLE"
        side_effects:
          - "compliance_posture recomputed to COVERAGE_UNAVAILABLE"
          - "insurance_status is NOT modified by this transition (independent dimension)"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "system: participation-changes restores a community to REGULAR, EMERGENCY or PROBATION"
        actor: system
        preconditions:
          - "monitoring_status == SUSPENDED"
          - "Community.coverage_availability is no longer UNAVAILABLE"
        side_effects:
          - "compliance_posture recomputed from the unchanged insurance_status and notice set"
          - "insurance_status is NOT modified by this transition (independent dimension)"

  - entity: LoanFolio
    dimension: insurance_status
    initial_state: NONE
    terminal_states: []
    transitions:
      - from: NONE
        to: NOT_REQUIRED
        trigger: "system: a Determination with mandatory_purchase_flag == false becomes the folio's current determination"
        actor: system
        preconditions:
          - "insurance_status == NONE"
          - "the new current determination has mandatory_purchase_flag == false"
        side_effects:
          - "required_coverage_cents set to 0; uninsured_exposure_cents set to 0; compliance_posture recomputed to COMPLIANT"
      - from: NOT_REQUIRED
        to: NONE
        trigger: "system: a re-determination moves the structure into the SFHA (mandatory_purchase_flag == true)"
        actor: system
        preconditions:
          - "insurance_status == NOT_REQUIRED"
          - "the new current determination has mandatory_purchase_flag == true"
        side_effects:
          - "required_coverage_cents recomputed; compliance_posture recomputed to NOTICE_DUE"
      - from: NONE
        to: BORROWER_PROVIDED
        trigger: "POST /flood-zone/loan-folios/{loan_folio_id}/insurance-reports"
        actor: Lender
        preconditions:
          - "insurance_status == NONE (reporting coverage while NOT_REQUIRED is rejected with ERR_INVALID_FOLIO_STATE)"
          - "reported_coverage_cents >= required_coverage_cents"
        side_effects:
          - "reported_coverage_cents stored; uninsured_exposure_cents recomputed to 0; compliance_posture recomputed to COMPLIANT"
          - "every ComplianceNotice on the folio with status == SENT and notice_type IN {MANDATORY_PURCHASE, FORCE_PLACEMENT_WARNING} transitions SENT -> SUPERSEDED and open_notice_count is recomputed"
      - from: NONE
        to: FORCE_PLACED
        trigger: "POST /flood-zone/loan-folios/{loan_folio_id}/force-placements"
        actor: Lender
        preconditions:
          - "insurance_status == NONE"
          - "compliance_posture == FORCE_PLACE_ELIGIBLE"
          - "Lender.force_placement_authorized_flag == true and Lender.escrow_servicing_flag == true"
          - "escrow_balance_cents >= force_placed_premium_cents computed by calculations.force_place_premium variant chronological_actual"
        side_effects:
          - "force_placed_premium_cents and force_placed_coverage_days computed and stored; force_placed_at = current_utc"
          - "escrow_balance_cents decremented by force_placed_premium_cents; cumulative_earned_premium_cents left unchanged"
          - "uninsured_exposure_cents set to 0; compliance_posture recomputed to FORCE_PLACED"
          - "the citing ComplianceNotice with status IN {SENT, EXPIRED} transitions to EXPIRED if still SENT, closed_at = current_utc, open_notice_count recomputed"
      - from: FORCE_PLACED
        to: BORROWER_PROVIDED
        trigger: "POST /flood-zone/loan-folios/{loan_folio_id}/insurance-reports"
        actor: Lender
        preconditions:
          - "insurance_status == FORCE_PLACED"
          - "reported_coverage_cents >= required_coverage_cents"
        side_effects:
          - "calculations.escrow_settlement runs: earned_premium_cents recognized, refund_cents credited back to escrow_balance_cents, cumulative_earned_premium_cents incremented"
          - "force_placed_premium_cents reset to 0; force_placed_at and force_placed_coverage_days cleared to null and 0"
          - "compliance_posture recomputed to COMPLIANT"
        note: "compensating action of NONE -> FORCE_PLACED; escrow_balance_cents + cumulative_earned_premium_cents == initial_escrow_balance_cents must hold afterwards"
      - from: FORCE_PLACED
        to: NOT_REQUIRED
        trigger: "system: HOP 4 of the dispute-sustained cascade yields a determination with mandatory_purchase_flag == false"
        actor: system
        preconditions:
          - "insurance_status == FORCE_PLACED"
          - "the new current determination has mandatory_purchase_flag == false"
        side_effects:
          - "calculations.escrow_settlement runs exactly as on the BORROWER_PROVIDED path; required_coverage_cents set to 0"
          - "compliance_posture recomputed to COMPLIANT"

  - entity: ElevationCertificate
    initial_state: SUBMITTED
    terminal_states: [VALIDATED, REJECTED]
    transitions:
      - from: SUBMITTED
        to: VALIDATED
        trigger: "POST /flood-zone/elevation-certificates/{elevation_certificate_id}/review with decision == VALIDATED"
        actor: ProviderReviewer
        preconditions:
          - "status == SUBMITTED"
          - "the acting X-User-ID differs from submitted_by_user_id (segregation of duties)"
          - "current_utc <= survey_date + CERTIFICATE_VALIDITY_DAYS (365 days)"
        side_effects:
          - "reviewed_by_user_id set to the acting X-User-ID"
          - "Structure.lowest_floor_elevation_ft set to converted_lowest_floor_ft and Structure.lowest_adjacent_grade_ft set to converted_lag_ft"
          - "Structure.elevation_source_certificate_id set to this certificate id"
          - "the folio's current Determination recomputes freeboard_ft from the newly populated Structure.lowest_floor_elevation_ft; zone_code, sfha_flag and position_class are NOT recomputed"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /flood-zone/elevation-certificates/{elevation_certificate_id}/review with decision == REJECTED"
        actor: ProviderReviewer
        preconditions:
          - "status == SUBMITTED"
          - "the acting X-User-ID differs from submitted_by_user_id (segregation of duties)"
        side_effects:
          - "rejection_reason stored from the request body; reviewed_by_user_id set"
          - "no Structure field is written; Structure.elevation_source_certificate_id remains unchanged"

  - entity: MapAmendmentRequest
    initial_state: DRAFT
    terminal_states: [GRANTED, DENIED]
    transitions:
      - from: DRAFT
        to: SUBMITTED_TO_AGENCY
        trigger: "POST /flood-zone/map-amendment-requests/{map_amendment_request_id}/submission"
        actor: ProviderAnalyst
        preconditions:
          - "status == DRAFT"
          - "the referenced ElevationCertificate has status == VALIDATED"
          - "current_utc <= ElevationCertificate.survey_date + CERTIFICATE_VALIDITY_DAYS (365 days)"
          - "the referenced Determination has status IN {ISSUED, FLAGGED_FOR_REVIEW}"
        side_effects:
          - "submitted_at = current_utc; base_review_fee_cents, fee_tier, expedite_surcharge_cents and total_fee_cents recomputed by calculations.map_amendment_fee"
      - from: SUBMITTED_TO_AGENCY
        to: GRANTED
        trigger: "POST /flood-zone/map-amendment-requests/{map_amendment_request_id}/agency-decision with decision == GRANTED"
        actor: AgencyOfficer
        preconditions:
          - "status == SUBMITTED_TO_AGENCY"
        side_effects:
          - "agency_case_number stored; decided_at = current_utc"
          - "Structure.sfha_offset_ft is NOT modified; the amendment's effect on future determinations is out of scope of this transition"
      - from: SUBMITTED_TO_AGENCY
        to: DENIED
        trigger: "POST /flood-zone/map-amendment-requests/{map_amendment_request_id}/agency-decision with decision == DENIED"
        actor: AgencyOfficer
        preconditions:
          - "status == SUBMITTED_TO_AGENCY"
        side_effects:
          - "agency_case_number stored; decided_at = current_utc"
      - from: SUBMITTED_TO_AGENCY
        to: ADDITIONAL_DATA_REQUESTED
        trigger: "POST /flood-zone/map-amendment-requests/{map_amendment_request_id}/agency-decision with decision == ADDITIONAL_DATA_REQUESTED"
        actor: AgencyOfficer
        preconditions:
          - "status == SUBMITTED_TO_AGENCY"
          - "resubmission_count < MAX_RESUBMISSIONS (2)"
        side_effects:
          - "additional_data_note stored; decided_at left null (the request is not terminated)"
      - from: ADDITIONAL_DATA_REQUESTED
        to: SUBMITTED_TO_AGENCY
        trigger: "POST /flood-zone/map-amendment-requests/{map_amendment_request_id}/submission"
        actor: ProviderAnalyst
        preconditions:
          - "status == ADDITIONAL_DATA_REQUESTED"
          - "resubmission_count < MAX_RESUBMISSIONS (2)"
          - "the referenced ElevationCertificate still has status == VALIDATED"
        side_effects:
          - "resubmission_count incremented by 1; submitted_at = current_utc"
          - "base_review_fee_cents recomputed (it grows by RESUBMISSION_FEE_CENTS), fee_tier re-keyed on the new base, expedite_surcharge_cents and total_fee_cents recomputed"
        note: "cycle: the same submission endpoint serves the first submission and every resubmission"

  - entity: ComplianceNotice
    initial_state: SENT
    terminal_states: [ACKNOWLEDGED, EXPIRED, SUPERSEDED]
    transitions:
      - from: SENT
        to: ACKNOWLEDGED
        trigger: "POST /flood-zone/compliance-notices/{compliance_notice_id}/acknowledgement"
        actor: "Lender or Borrower"
        preconditions:
          - "status == SENT"
          - "current_utc <= response_deadline_at (the closed response window is still open)"
          - "the acting identity owns the folio: X-User-ID == LoanFolio.lender_id for Lender, X-User-ID == LoanFolio.borrower_user_id for Borrower"
        side_effects:
          - "acknowledged_at = current_utc; acknowledged_by_role set to the acting role"
          - "LoanFolio.open_notice_count recomputed (decremented by one), restoring the value it held before this notice was sent"
      - from: SENT
        to: EXPIRED
        trigger: "system: POST /flood-zone/monitoring-runs or POST /flood-zone/loan-folios/{loan_folio_id}/force-placements observes current_utc > response_deadline_at"
        actor: system
        preconditions:
          - "status == SENT"
          - "current_utc > response_deadline_at"
        side_effects:
          - "closed_at = current_utc; LoanFolio.open_notice_count recomputed"
      - from: SENT
        to: SUPERSEDED
        trigger: "system: HOP 5 of the panel-effective cascade, HOP 5 of the dispute-sustained cascade, or the folio's NONE -> BORROWER_PROVIDED transition"
        actor: system
        preconditions:
          - "status == SENT"
          - "the cited determination left the governing position, or the folio's coverage obligation was satisfied"
        side_effects:
          - "closed_at = current_utc; LoanFolio.open_notice_count recomputed"

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: redetermination-create-stale-folio
    parent_entity: LoanFolio
    write_endpoint: "POST /flood-zone/determinations"
    occ_field: "expected_loan_folio_version"
    description: |
      Issuing a Determination against a LoanFolio whose version has advanced
      since the client last read it is rejected. A LIFE_OF_LOAN_REVIEW
      determination legitimately supersedes whatever determination the folio
      currently points at, so a writer holding a stale view of the folio would
      otherwise supersede a determination it never saw - including one minted
      moments earlier by a monitoring run or by a dispute-sustained cascade.
      The stale-version check turns that into a deterministic 412 rather than a
      silent overwrite of the folio's governing determination.
    error_id: ERR_STALE_LOAN_FOLIO_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: community_coverage_availability
    trigger: "on POST /flood-zone/communities and on every POST /flood-zone/communities/{community_id}/participation-changes; read whenever mandatory_purchase_flag, required_coverage_amount or compliance_posture is evaluated"
    algorithm: threshold
    formula: |
      # evaluated top to bottom; the first matching clause wins
      if community.cbrs_flag == true:                                          return UNAVAILABLE
      if community.participation_status in {SUSPENDED, NON_PARTICIPATING, WITHDRAWN}: return UNAVAILABLE
      if community.participation_status == EMERGENCY:                          return EMERGENCY_LIMITS_ONLY
      if community.participation_status == PROBATION:                          return FULL_WITH_SURCHARGE
      return FULL                                                              # participation_status == REGULAR
    input_set: "the Community row alone; no child entity participates"
    constants: {}
    precision: "enum, no rounding"
    note: "clause order is load-bearing: a CBRS community whose participation_status is REGULAR is still UNAVAILABLE"

  - name: effective_panel_selector
    trigger: "on POST /flood-zone/determinations, on POST /flood-zone/elevation-certificates, and on each re-determination inside POST /flood-zone/monitoring-runs"
    algorithm: chronological
    formula: |
      candidates = MapPanel rows where
            map_panel.community_id     == property.community_id
        AND map_panel.map_panel_number == property.map_panel_number
        AND map_panel.revision_status  == EFFECTIVE
        AND map_panel.effective_date   <= clock.current_utc
      rank_by     = effective_date DESC
      tie_break   = created_at ASC          # never id
      if candidates is empty: raise ERR_NO_EFFECTIVE_PANEL
      return candidates[0]
    input_set: "MapPanel rows with revision_status == EFFECTIVE only; PRELIMINARY, APPEAL_OPEN, LFD_ISSUED and SUPERSEDED panels are excluded"
    constants: {}
    precision: "single row selection"
    note: "the uniqueness validation on (community_id, map_panel_number, revision_status == EFFECTIVE) makes the candidate set size 0 or 1, but rank and tie-break are pinned so the selector stays deterministic if the invariant is ever relaxed"

  - name: structure_zone_determination
    trigger: "on POST /flood-zone/determinations, on each re-determination inside POST /flood-zone/monitoring-runs, on HOP 3 of the dispute-sustained cascade, and on GET /flood-zone/map-panels/{map_panel_id}/impact-analysis (prospective evaluation)"
    algorithm: constraint_propagation
    formula: |
      buffer_ft           = GEOCODE_BUFFER_FT[property.geocode_method] + panel.horizontal_uncertainty_ft
      effective_offset_ft = structure.sfha_offset_ft - panel.sfha_boundary_shift_ft

      if   effective_offset_ft + buffer_ft <  0: position_class = INSIDE
      elif effective_offset_ft - buffer_ft >  0: position_class = OUTSIDE
      else:                                     position_class = INDETERMINATE

      if position_class == INSIDE:
          zone_code = panel.zone_code ; sfha_flag = true
      elif position_class == OUTSIDE:
          zone_code = X               ; sfha_flag = false
      else:
          # INDETERMINATE is variant-dependent - see variants below
          zone_code, sfha_flag = variant_resolution(position_class)

      base_flood_elevation_ft = panel.base_flood_elevation_ft if sfha_flag else null
      freeboard_ft = round_half_up(structure.lowest_floor_elevation_ft - base_flood_elevation_ft, 1)
                     if (structure.lowest_floor_elevation_ft is not null and base_flood_elevation_ft is not null) else null
    input_set: "exactly one Structure, its Property, and the single MapPanel returned by effective_panel_selector (or, for impact-analysis, the non-EFFECTIVE panel under study)"
    constants:
      GEOCODE_BUFFER_FT: { ROOFTOP: 0, PARCEL_CENTROID: 25, ZIP_CENTROID: 250, FAILED: 0 }
    precision: "feet with 1 decimal place; comparisons are exact decimal comparisons, strictly < 0 and strictly > 0"
    variants:
      - name: origination_strict
        when: "determination_type IN {ORIGINATION, DISPUTE_REVISION}, and every prospective evaluation performed by impact-analysis"
        difference: "INDETERMINATE resolves conservatively to zone_code = panel.zone_code and sfha_flag = true, so the lender is told insurance is mandatory whenever the buffer straddles the boundary"
      - name: life_of_loan_lenient
        when: "determination_type == LIFE_OF_LOAN_REVIEW (manual re-determination or monitoring-run re-determination)"
        difference: "INDETERMINATE carries forward the superseded determination's zone_code and sfha_flag unchanged, so an ambiguous re-read never flips a borrower's obligation; when there is no prior determination the rule falls back to origination_strict"
    note: "identical Structure/Property/MapPanel inputs therefore produce sfha_flag = true under origination_strict and sfha_flag = false under life_of_loan_lenient whenever the prior determination said OUTSIDE"

  - name: required_coverage_amount
    trigger: "on every write that repoints LoanFolio.current_determination_id, on POST /flood-zone/communities/{community_id}/participation-changes, and on POST /flood-zone/compliance-notices (snapshot)"
    algorithm: threshold
    formula: |
      mandatory_purchase_flag = determination.sfha_flag AND community.coverage_availability != UNAVAILABLE

      if mandatory_purchase_flag == false:
          required_coverage_cents = 0
      else:
          if community.coverage_availability == EMERGENCY_LIMITS_ONLY:
              cap_cents = EMERGENCY_CAP_CENTS[structure.occupancy_type]
          else:
              cap_cents = REGULAR_CAP_CENTS[structure.occupancy_type]
          required_coverage_cents = min(loan_folio.principal_balance_cents,
                                        structure.replacement_cost_cents,
                                        cap_cents)

      uninsured_exposure_cents = 0 if loan_folio.insurance_status == FORCE_PLACED
                                 else max(0, required_coverage_cents - loan_folio.reported_coverage_cents)
    input_set: "the folio's current Determination (status IN {ISSUED, FLAGGED_FOR_REVIEW, UNDER_DISPUTE}), its Structure, the Property's Community, and the LoanFolio itself"
    constants:
      REGULAR_CAP_CENTS: { SINGLE_FAMILY: 25000000, TWO_TO_FOUR_FAMILY: 25000000, OTHER_RESIDENTIAL: 50000000, NON_RESIDENTIAL: 50000000 }
      EMERGENCY_CAP_CENTS: { SINGLE_FAMILY: 3500000, TWO_TO_FOUR_FAMILY: 3500000, OTHER_RESIDENTIAL: 10000000, NON_RESIDENTIAL: 10000000 }
    precision: "integer cents; no rounding, min() over three integers"
    note: "four inputs interact non-linearly: a coverage_availability change alone can move required_coverage_cents from 25000000 to 3500000 without any change to the loan or the structure"

  - name: elevation_certificate_conversion
    trigger: "on POST /flood-zone/elevation-certificates"
    algorithm: aggregation
    formula: |
      offset_ft = DATUM_OFFSET_FT[community.state_code] if certificate.datum == NGVD29 else 0.00

      # PINNED EVALUATION ORDER (round-then-difference):
      #   step 1  shift the raw survey value into NAVD88
      #   step 2  round the shifted value to 1 decimal, round_half_up   <-- rounding happens HERE
      #   step 3  subtract the panel BFE (2 decimals) from the ROUNDED value
      #   step 4  round the difference to 1 decimal, round_half_up
      converted_lowest_floor_ft = round_half_up(certificate.raw_lowest_floor_elevation_ft   + offset_ft, 1)
      converted_lag_ft          = round_half_up(certificate.raw_lowest_adjacent_grade_ft    + offset_ft, 1)
      freeboard_ft              = round_half_up(converted_lowest_floor_ft - panel.base_flood_elevation_ft, 1)
      lag_freeboard_ft          = round_half_up(converted_lag_ft          - panel.base_flood_elevation_ft, 1)
    input_set: "the ElevationCertificate row, the Structure's Property's Community (for state_code), and the MapPanel returned by effective_panel_selector (for base_flood_elevation_ft)"
    constants:
      DATUM_OFFSET_FT: { CA: -2.44, FL: -1.15, TX: -0.87, NC: -0.55 }
    precision: "1 decimal place, round_half_up, at BOTH rounding steps"
    note: |
      The rounding ORDER changes the answer and is therefore pinned. For a FL
      certificate with raw_lowest_floor_elevation_ft = 8.94, datum NGVD29 and a
      panel BFE of 7.75: the pinned order gives round(8.94 - 1.15, 1) = 7.8 then
      round(7.8 - 7.75, 1) = 0.1, while the rejected order (difference first,
      single rounding) gives round(7.79 - 7.75, 1) = 0.0. Because
      map-amendment eligibility requires freeboard_ft > 0.0, the two orders
      differ by grant-vs-ERR_STRUCTURE_NOT_ABOVE_BFE, not merely by one tenth.

  - name: map_amendment_fee
    trigger: "on POST /flood-zone/map-amendment-requests (draft preview) and on every POST /flood-zone/map-amendment-requests/{map_amendment_request_id}/submission"
    algorithm: tiered_pricing
    formula: |
      # PINNED EVALUATION ORDER for a circular-looking dependency:
      #   the surcharge percentage depends on fee_tier, and fee_tier is keyed on
      #   base_review_fee_cents (the PRE-surcharge subtotal), never on
      #   total_fee_cents. Keying the tier on the total would be circular.
      base_review_fee_cents = BASE_FEE_CENTS[request.request_type]
                            + RESUBMISSION_FEE_CENTS * request.resubmission_count

      if   base_review_fee_cents <= 0:     fee_tier = TIER_1
      elif base_review_fee_cents <= 50000: fee_tier = TIER_2
      else:                                fee_tier = TIER_3

      expedite_surcharge_cents = round_half_up(EXPEDITE_SURCHARGE_PCT[fee_tier] * base_review_fee_cents, 0)
                                 if request.expedite_flag else 0
      total_fee_cents = base_review_fee_cents + expedite_surcharge_cents
    input_set: "the MapAmendmentRequest row alone (request_type, resubmission_count, expedite_flag)"
    constants:
      BASE_FEE_CENTS: { LOMA: 0, LOMR_F: 50000 }
      RESUBMISSION_FEE_CENTS: 12500
      EXPEDITE_SURCHARGE_PCT: { TIER_1: 0.00, TIER_2: 0.30, TIER_3: 0.45 }
    precision: "integer cents, round_half_up on the surcharge only"
    note: |
      Worked divergence: LOMR_F, resubmission_count = 0, expedite_flag = true.
      Pinned order -> base 50000, TIER_2, surcharge 15000, total 65000. Keying the
      tier on the total instead -> 65000 > 50000 -> TIER_3 -> surcharge 22500 ->
      total 72500. The scaffold's answer is 65000.

  - name: force_place_premium
    trigger: "forward_looking_estimate on POST /flood-zone/compliance-notices; chronological_actual on POST /flood-zone/loan-folios/{loan_folio_id}/force-placements"
    algorithm: forward_looking
    formula: |
      # ANNIVERSARY ROLL (both variants): let anniv = loan_folio.policy_anniversary_date;
      # while anniv <= the variant's own anchor instant, add exactly one calendar year.
      #
      # variant forward_looking_estimate (anchor = notice.response_deadline_at):
      whole_months_remaining = max(0, (anniv.year - anchor.year) * 12
                                      + (anniv.month - anchor.month)
                                      - (1 if anniv.day < anchor.day else 0))
      estimated_force_place_premium_cents =
          round_half_up(notice.annual_premium_rate_cents * whole_months_remaining / 12, 0)
      #
      # variant chronological_actual (anchor = clock.current_utc at force placement):
      force_placed_coverage_days = (anniv - anchor).days          # half-open [anchor, anniv)
      force_placed_premium_cents =
          round_half_up(notice.annual_premium_rate_cents * force_placed_coverage_days / 365, 0)
    input_set: "the LoanFolio (policy_anniversary_date) and the single ComplianceNotice that made the folio FORCE_PLACE_ELIGIBLE, i.e. the notice with notice_type == MANDATORY_PURCHASE, status IN {SENT, EXPIRED} and the greatest sent_at; tie-break created_at ASC"
    constants:
      DAYS_PER_YEAR: 365
      MONTHS_PER_YEAR: 12
    precision: "integer cents, round_half_up"
    variants:
      - name: forward_looking_estimate
        when: "computed once at notice send time and stored on ComplianceNotice.estimated_force_place_premium_cents"
        difference: "counts only WHOLE calendar months between the response deadline and the anniversary, divides the annual rate by 12, and ignores the day-level remainder entirely"
      - name: chronological_actual
        when: "computed at force placement and stored on LoanFolio.force_placed_premium_cents"
        difference: "counts exact elapsed days from the placement instant to the anniversary and divides by 365, so it charges the day-level remainder the estimate discarded"
    note: |
      Worked divergence for annual_premium_rate_cents = 288000, deadline
      2026-09-15T00:00:00Z, anniversary 2027-03-15T00:00:00Z, placement
      2026-09-16T00:00:00Z: estimate = round(288000 * 6 / 12) = 144000,
      actual = round(288000 * 180 / 365) = 142027. The two numbers are stored on
      different entities and must both be observable.

  - name: escrow_settlement
    trigger: "on the LoanFolio insurance_status transitions FORCE_PLACED -> BORROWER_PROVIDED and FORCE_PLACED -> NOT_REQUIRED"
    algorithm: aggregation
    formula: |
      days_in_force        = (clock.current_utc - loan_folio.force_placed_at).days      # half-open
      earned_premium_cents = round_half_up(loan_folio.force_placed_premium_cents
                                           * days_in_force
                                           / loan_folio.force_placed_coverage_days, 0)
      refund_cents         = loan_folio.force_placed_premium_cents - earned_premium_cents

      escrow_balance_cents            += refund_cents
      cumulative_earned_premium_cents += earned_premium_cents
      force_placed_premium_cents       = 0
      force_placed_coverage_days       = 0
      force_placed_at                  = null

      # CONSERVED QUANTITY (escrow cash plus recognized premium):
      #   escrow_balance_cents + cumulative_earned_premium_cents == initial_escrow_balance_cents
      # must hold after the forward action (force placement) and after its
      # compensating action (coverage replacement), with zero drift.
    input_set: "the single LoanFolio row; no aggregation over children"
    constants: {}
    precision: "integer cents, round_half_up; the refund absorbs the rounding remainder so the invariant is exact"
    note: "if days_in_force >= force_placed_coverage_days the whole premium is earned and refund_cents is 0; days_in_force is never negative because force_placed_at <= current_utc"

  - name: open_notice_count_reconciliation
    trigger: "after every ComplianceNotice create and after every ComplianceNotice transition out of SENT (ACKNOWLEDGED, EXPIRED, SUPERSEDED)"
    algorithm: aggregation
    formula: |
      open_notice_count = count(ComplianceNotice rows where
                                  loan_folio_id == loan_folio.id
                              AND status        == SENT)
      # CONSERVED QUANTITY (obligation cardinality): issuing a notice and then
      # acknowledging that same notice must return open_notice_count to exactly
      # the value it held before the issuance, for every folio, with no drift
      # from the cascades that fired in between.
    input_set: "all ComplianceNotice rows for the folio regardless of notice_type; only status == SENT is counted; no time window"
    constants: {}
    precision: "integer count; recomputed by full re-count, never by incremental delta"

  - name: compliance_posture
    trigger: "recomputed on every write that touches LoanFolio, its current Determination, its ComplianceNotice set, or its Property's Community; read as a precondition by POST /flood-zone/loan-folios/{loan_folio_id}/force-placements and POST /flood-zone/compliance-notices"
    algorithm: threshold
    formula: |
      # evaluated top to bottom; first match wins
      1. if community.coverage_availability == UNAVAILABLE:                       COVERAGE_UNAVAILABLE
      2. if loan_folio.insurance_status == FORCE_PLACED:                          FORCE_PLACED
      3. if loan_folio.pending_redetermination_count > 0:                         REVIEW_PENDING
      4. if loan_folio.required_coverage_cents == 0
            OR loan_folio.reported_coverage_cents >= loan_folio.required_coverage_cents:
                                                                                 COMPLIANT
      5. if exists ComplianceNotice(loan_folio_id == folio.id,
                                    notice_type == MANDATORY_PURCHASE,
                                    status IN {SENT, EXPIRED},
                                    response_deadline_at < clock.current_utc):    FORCE_PLACE_ELIGIBLE
      6. if exists ComplianceNotice(loan_folio_id == folio.id,
                                    notice_type == MANDATORY_PURCHASE,
                                    status == SENT,
                                    response_deadline_at >= clock.current_utc):   NOTICE_PENDING
      7. otherwise:                                                              NOTICE_DUE
    input_set: "the LoanFolio, its Property's Community, and every ComplianceNotice row on the folio with notice_type == MANDATORY_PURCHASE (SUPERSEDED and ACKNOWLEDGED notices are excluded from clauses 5 and 6)"
    constants: {}
    precision: "enum, no rounding"
    note: "clause order is load-bearing: a folio with a lapsed notice AND a pending re-determination reports REVIEW_PENDING, not FORCE_PLACE_ELIGIBLE, so the map revision blocks force placement"

  - name: preliminary_map_impact_analysis
    trigger: "on GET /flood-zone/map-panels/{map_panel_id}/impact-analysis"
    algorithm: aggregation
    formula: |
      # source set, pinned exactly:
      properties = Property where community_id     == panel.community_id
                                AND map_panel_number == panel.map_panel_number
                                AND geocode_status   == GEOCODED
      structures = Structure where property_id IN properties, ordered by created_at ASC
      for each structure S in structures:
          folio   = the LoanFolio with property_id == S.property_id whose
                    current_determination_id names a Determination with structure_id == S.id
                    (structures with no such folio are skipped and do not count)
          current = that Determination (status IN {ISSUED, FLAGGED_FOR_REVIEW, UNDER_DISPUTE})
          prospect = structure_zone_determination(S, S.property, panel, variant origination_strict)

      structures_evaluated              = count(structures that had a folio)
      newly_in_sfha_count               = count(current.sfha_flag == false AND prospect.sfha_flag == true)
      newly_out_of_sfha_count           = count(current.sfha_flag == true  AND prospect.sfha_flag == false)
      bfe_increase_count                = count(current.base_flood_elevation_ft is not null
                                                AND panel.base_flood_elevation_ft is not null
                                                AND panel.base_flood_elevation_ft > current.base_flood_elevation_ft)
      folios_requiring_new_notice_count = count(distinct folio for the newly_in_sfha structures
                                                whose folio.insurance_status IN {NONE, NOT_REQUIRED})
      aggregate_new_required_coverage_cents = sum over the newly_in_sfha structures of
                                                required_coverage_amount(prospect, S, folio, community)
    input_set: "MapPanel under study with revision_status IN {PRELIMINARY, APPEAL_OPEN, LFD_ISSUED}; EFFECTIVE and SUPERSEDED panels are rejected with ERR_PANEL_NOT_PRELIMINARY"
    constants: {}
    precision: "integer counts and integer cents; the aggregate is order-insensitive, and the created_at ASC walk order is pinned only so the per-structure evaluation log is reproducible"
    note: "this is a read-only projection: it creates no Determination, mutates no Structure and sends no notice"

  - name: monitoring_run_sweep
    trigger: "on POST /flood-zone/monitoring-runs"
    algorithm: chronological
    formula: |
      scope = Determination rows with status == FLAGGED_FOR_REVIEW, filtered by the
              optional community_id / map_panel_id query parameters, processed in
              created_at ASC order (tie-break: created_at ASC is total for a
              single-writer request sequence; id is never consulted)

      for each flagged determination D in scope:
          panel   = effective_panel_selector(D's structure's property)
          outcome = structure_zone_determination(structure, property, panel,
                                                variant life_of_loan_lenient)
          if outcome.zone_code == D.zone_code AND outcome.sfha_flag == D.sfha_flag:
              D: FLAGGED_FOR_REVIEW -> ISSUED           ; redeterminations_cleared += 1
          else:
              D: FLAGGED_FOR_REVIEW -> SUPERSEDED, new LIFE_OF_LOAN_REVIEW
                 determination minted                   ; redeterminations_issued += 1
              if new.mandatory_purchase_flag AND folio.insurance_status IN {NONE, NOT_REQUIRED}:
                  send RE_DETERMINATION notice          ; notices_sent += 1

      # second phase, always runs even when scope is empty:
      for each ComplianceNotice N with status == SENT AND response_deadline_at < clock.current_utc:
          N: SENT -> EXPIRED                            ; notices_expired += 1

      determinations_scanned = count(scope)
    input_set: "only Determination rows in status FLAGGED_FOR_REVIEW enter phase one; only ComplianceNotice rows in status SENT enter phase two"
    constants: {}
    precision: "integer counts"
    note: "an empty scope is a success, not an error: every count in the response is 0 and no row is written"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority; lowest number wins)
#
# The ladder is evaluated strictly in ascending priority for every request. When
# a single request violates two rules, the rule with the smaller priority number
# supplies the response error_id and http_status; the lower-priority violation is
# never reported. Business-rule ordering for this domain is:
#   safety/regulatory (11) -> referential (12) -> temporal (13)
#   -> constraint (14) -> fiscal (15)
# i.e. an NFIP compliance/eligibility failure is reported ahead of a money
# failure, because telling a lender "coverage is unavailable in this community"
# is more actionable than telling it "the escrow is short".
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-Role header present and non-empty; X-User-ID header present and non-empty on every request except GET"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "X-Role value is one of the five declared roles (ProviderAnalyst, ProviderReviewer, AgencyOfficer, Lender, Borrower)"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 3
    category: auth
    check: "the caller's role appears in the target endpoint's roles list"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: all

  - priority: 4
    category: business_constraint
    check: "request body/query shape is valid: no unknown fields, required fields present, enum values in range, integers non-negative where declared, decimals within declared scale, limit in 1..100 and offset >= 0"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all

  - priority: 5
    category: existence
    check: "every path id resolves, validated LEFT TO RIGHT: the leftmost unresolvable segment decides the error_id"
    error_id: "ERR_<ENTITY>_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with path parameters"

  - priority: 6
    category: existence
    check: "every FK supplied in the request body resolves, validated in the field order declared by the endpoint's input list"
    error_id: "ERR_<ENTITY>_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints whose input carries a *_id field"

  - priority: 7
    category: auth
    check: "a Lender caller's X-User-ID matches the Lender row named by the target LoanFolio.lender_id (ownership scoping of folios, determinations, notices and force placements)"
    error_id: ERR_FOLIO_NOT_OWNED
    http_status: 403
    applies_to: "POST /flood-zone/loan-folios/{loan_folio_id}/insurance-reports, POST /flood-zone/loan-folios/{loan_folio_id}/force-placements, POST /flood-zone/compliance-notices, POST /flood-zone/compliance-notices/{compliance_notice_id}/acknowledgement"

  - priority: 8
    category: auth
    check: "a Borrower caller's X-User-ID equals the target LoanFolio.borrower_user_id"
    error_id: ERR_BORROWER_NOT_ON_LOAN
    http_status: 403
    applies_to: "POST /flood-zone/disputes, POST /flood-zone/elevation-certificates, POST /flood-zone/compliance-notices/{compliance_notice_id}/acknowledgement"

  - priority: 9
    category: business_safety
    check: "segregation of duties: the reviewing X-User-ID differs from the submitting/issuing X-User-ID recorded on the entity (ElevationCertificate.submitted_by_user_id for certificate review, Determination.issued_by_user_id for provider dispute review, Dispute.provider_reviewed_by_user_id for agency review)"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /flood-zone/elevation-certificates/{elevation_certificate_id}/review, POST /flood-zone/disputes/{dispute_id}/provider-review, POST /flood-zone/disputes/{dispute_id}/agency-review"

  - priority: 10
    category: business_constraint
    check: "optimistic concurrency: expected_loan_folio_version equals the target LoanFolio.version"
    error_id: ERR_STALE_LOAN_FOLIO_VERSION
    http_status: 412
    applies_to: "POST /flood-zone/determinations"

  - priority: 11
    category: state
    check: "the target entity is in a state from which the requested transition is declared in §1.2 (panel, determination, dispute, certificate, amendment request, notice, folio monitoring_status and folio insurance_status)"
    error_id: "ERR_INVALID_<ENTITY>_STATE"
    http_status: 409
    applies_to: "all transition endpoints"

  - priority: 12
    category: business_safety
    check: "community coverage availability permits the operation: coverage_availability != UNAVAILABLE for force placement and for MANDATORY_PURCHASE notices"
    error_id: ERR_COVERAGE_UNAVAILABLE
    http_status: 409
    applies_to: "POST /flood-zone/loan-folios/{loan_folio_id}/force-placements, POST /flood-zone/compliance-notices"

  - priority: 13
    category: business_safety
    check: "force placement is permitted only when compliance_posture == FORCE_PLACE_ELIGIBLE, i.e. a MANDATORY_PURCHASE notice exists whose response_deadline_at has passed and no re-determination is pending"
    error_id: ERR_NOTICE_PERIOD_NOT_EXPIRED
    http_status: 409
    applies_to: "POST /flood-zone/loan-folios/{loan_folio_id}/force-placements"

  - priority: 14
    category: business_safety
    check: "the lender is authorized to force place: Lender.force_placement_authorized_flag == true"
    error_id: ERR_FORCE_PLACEMENT_NOT_AUTHORIZED
    http_status: 403
    applies_to: "POST /flood-zone/loan-folios/{loan_folio_id}/force-placements"

  - priority: 15
    category: business_safety
    check: "a MANDATORY_PURCHASE notice may be issued only when the folio's current determination carries mandatory_purchase_flag == true"
    error_id: ERR_MANDATORY_PURCHASE_NOT_TRIGGERED
    http_status: 409
    applies_to: "POST /flood-zone/compliance-notices"

  - priority: 16
    category: business_referential
    check: "the referenced elevation certificate has been validated: ElevationCertificate.status == VALIDATED"
    error_id: ERR_CERTIFICATE_NOT_VALIDATED
    http_status: 409
    applies_to: "POST /flood-zone/map-amendment-requests, POST /flood-zone/map-amendment-requests/{map_amendment_request_id}/submission"

  - priority: 17
    category: business_referential
    check: "cross-entity coherence of supplied ids: Determination.structure_id must belong to the Property named by LoanFolio.property_id; ElevationCertificate.structure_id must match the Dispute's determination's structure_id; a MapAmendmentRequest's certificate structure_id must equal its Determination.structure_id; Determination named by a notice must be the folio's current_determination_id"
    error_id: ERR_STRUCTURE_FOLIO_MISMATCH
    http_status: 422
    applies_to: "POST /flood-zone/determinations, POST /flood-zone/elevation-certificates, POST /flood-zone/map-amendment-requests, POST /flood-zone/compliance-notices"

  - priority: 18
    category: business_referential
    check: "the amendment request_type matches the structure's fill history: LOMA requires Structure.fill_placed_flag == false, LOMR_F requires Structure.fill_placed_flag == true"
    error_id: ERR_AMENDMENT_TYPE_MISMATCH
    http_status: 422
    applies_to: "POST /flood-zone/map-amendment-requests"

  - priority: 19
    category: business_referential
    check: "the property is usable: Property.geocode_status == GEOCODED (geocode_method != FAILED and geocode_confidence_score >= 0.60)"
    error_id: ERR_PROPERTY_NOT_GEOCODED
    http_status: 422
    applies_to: "POST /flood-zone/determinations, POST /flood-zone/elevation-certificates"

  - priority: 20
    category: business_referential
    check: "calculations.effective_panel_selector finds at least one EFFECTIVE MapPanel for the property's (community_id, map_panel_number) whose effective_date <= clock.current_utc"
    error_id: ERR_NO_EFFECTIVE_PANEL
    http_status: 422
    applies_to: "POST /flood-zone/determinations, POST /flood-zone/elevation-certificates"

  - priority: 21
    category: business_temporal
    check: "the certificate is still current: the ElevationCertificate.survey_date is within CERTIFICATE_VALIDITY_DAYS = 365 of clock.current_utc, both when the certificate is validated and when the amendment request that references it is submitted"
    error_id: ERR_CERTIFICATE_EXPIRED
    http_status: 422
    applies_to: "POST /flood-zone/elevation-certificates/{elevation_certificate_id}/review with decision == VALIDATED, POST /flood-zone/map-amendment-requests/{map_amendment_request_id}/submission"

  - priority: 22
    category: business_temporal
    check: "a panel may become EFFECTIVE only after its appeal period has closed (appeal_period_end_date <= clock.current_utc) and the letter-of-final-determination waiting period has elapsed (lfd_issued_at + LFD_WAITING_PERIOD_DAYS = 180 <= clock.current_utc)"
    error_id: ERR_LFD_WAITING_PERIOD
    http_status: 409
    applies_to: "POST /flood-zone/map-panels/{map_panel_id}/effective"

  - priority: 23
    category: business_temporal
    check: "effective-date interval hygiene for map panels: effective_date must be <= clock.current_utc at the moment of the EFFECTIVE transition (a future-dated panel cannot go effective), and the incoming panel's effective_date must be strictly greater than the effective_date of the panel it supersedes (half-open [effective_date, superseded_at) intervals must not overlap)"
    error_id: ERR_PANEL_EFFECTIVE_DATE_OVERLAP
    http_status: 409
    applies_to: "POST /flood-zone/map-panels/{map_panel_id}/effective"

  - priority: 24
    category: business_temporal
    check: "notice cooldown: a new ComplianceNotice of the same notice_type on the same loan_folio_id is refused while a SENT notice's closed window [sent_at, response_deadline_at + NOTICE_COOLDOWN_DAYS = 5] contains clock.current_utc"
    error_id: ERR_NOTICE_WINDOW_ACTIVE
    http_status: 409
    applies_to: "POST /flood-zone/compliance-notices"

  - priority: 25
    category: business_constraint
    check: "map panel sequencing and uniqueness: revision_sequence must equal the superseded panel's revision_sequence + 1 (or 1 with supersedes_panel_id null); at most one EFFECTIVE panel may exist per (community_id, map_panel_number); (community_id, map_panel_number, revision_sequence) is unique"
    error_id: ERR_PANEL_SEQUENCE_INVALID
    http_status: 409
    applies_to: "POST /flood-zone/map-panels"

  - priority: 26
    category: business_constraint
    check: "amendment resubmission ceiling: the agency may request additional data only while resubmission_count < MAX_RESUBMISSIONS = 2, so a request that has already been resubmitted twice must be decided GRANTED or DENIED"
    error_id: ERR_RESUBMISSION_LIMIT
    http_status: 409
    applies_to: "POST /flood-zone/map-amendment-requests/{map_amendment_request_id}/agency-decision with decision == ADDITIONAL_DATA_REQUESTED"

  - priority: 27
    category: business_constraint
    check: "amendment eligibility: the referenced certificate's freeboard_ft must be strictly greater than 0.0 for LOMA and lag_freeboard_ft strictly greater than 0.0 for LOMR_F (the lowest floor / lowest adjacent grade must sit above the base flood elevation)"
    error_id: ERR_STRUCTURE_NOT_ABOVE_BFE
    http_status: 422
    applies_to: "POST /flood-zone/map-amendment-requests/{map_amendment_request_id}/submission"

  - priority: 28
    category: business_constraint
    check: "dispute admissibility: basis must be supported by the supplied evidence (ELEVATION_ABOVE_BFE requires a VALIDATED ElevationCertificate on the structure; MAP_PANEL_STALE requires a non-EFFECTIVE later-sequence panel to exist; GEOCODE_ERROR requires Property.geocode_method != ROOFTOP), and a round-2 dispute's asserted_sfha_offset_ft must differ from round 1's"
    error_id: ERR_DISPUTE_BASIS_UNSUPPORTED
    http_status: 422
    applies_to: "POST /flood-zone/disputes"

  - priority: 29
    category: business_constraint
    check: "one origination determination per (loan_folio_id, structure_id): a second ORIGINATION determination is refused once the folio has a current_determination_id"
    error_id: ERR_ORIGINATION_ALREADY_COMPLETE
    http_status: 409
    applies_to: "POST /flood-zone/determinations"

  - priority: 30
    category: business_fiscal
    check: "reported coverage sufficiency and sanity: reported_coverage_cents must be greater than or equal to LoanFolio.required_coverage_cents (the state-machine precondition for both insurance_status transitions into BORROWER_PROVIDED) and must not exceed Structure.replacement_cost_cents"
    error_id: ERR_COVERAGE_BELOW_REQUIRED
    http_status: 422
    applies_to: "POST /flood-zone/loan-folios/{loan_folio_id}/insurance-reports"

  - priority: 31
    category: business_fiscal
    check: "escrow funding: LoanFolio.escrow_balance_cents must be greater than or equal to the computed force_placed_premium_cents (chronological_actual variant) before the premium is drawn"
    error_id: ERR_ESCROW_INSUFFICIENT
    http_status: 402
    applies_to: "POST /flood-zone/loan-folios/{loan_folio_id}/force-placements"

  - priority: 32
    category: business_temporal
    check: "appeal window closure: an appeal decision may be recorded only once the posted appeal period has closed, i.e. MapPanel.appeal_period_end_date <= clock.current_utc"
    error_id: ERR_APPEAL_PERIOD_OPEN
    http_status: 409
    applies_to: "POST /flood-zone/map-panels/{map_panel_id}/appeal-decision"

# =============================================================================
# §1.5 API Endpoint Table
#
# Every path lives under api_prefix /flood-zone. Path parameters are NOT listed
# in `input:` — `input:` names request-body fields for writes and query
# parameters for reads. Every list endpoint accepts limit?/offset? and returns
# the paginated envelope declared in response_envelope. Every list endpoint also
# accepts each of its entity's foreign keys as an optional equality filter, which
# is the reverse-reachability channel for cascade-created children (a
# Determination minted by HOP 3 of the dispute cascade, or a ComplianceNotice
# superseded by a cascade, is discoverable only this way).
# =============================================================================
endpoints:
  # --- reads: Community / Lender -------------------------------------------
  - method: GET
    path: "/flood-zone/communities"
    description: "List communities, optionally filtered by state or participation status"
    roles: [ProviderAnalyst, ProviderReviewer, AgencyOfficer, Lender, Borrower]
    code: 200
    input: ["state_code?", "participation_status?", "limit?", "offset?"]
    output: Community[]
    side_effects: []

  - method: GET
    path: "/flood-zone/communities/{community_id}"
    description: "Fetch one community, including the computed coverage_availability and active_folio_count"
    roles: [ProviderAnalyst, ProviderReviewer, AgencyOfficer, Lender, Borrower]
    code: 200
    input: []
    output: Community
    side_effects: []

  - method: GET
    path: "/flood-zone/lenders"
    description: "List lenders"
    roles: [ProviderAnalyst, ProviderReviewer, AgencyOfficer, Lender]
    code: 200
    input: ["limit?", "offset?"]
    output: Lender[]
    side_effects: []

  - method: GET
    path: "/flood-zone/lenders/{lender_id}"
    description: "Fetch one lender, including the computed open_force_placement_count"
    roles: [ProviderAnalyst, ProviderReviewer, AgencyOfficer, Lender]
    code: 200
    input: []
    output: Lender
    side_effects: []

  # --- reads: MapPanel ------------------------------------------------------
  - method: GET
    path: "/flood-zone/map-panels"
    description: "List map panels; supersedes_panel_id finds the successor of a given panel (self-referential reverse reachability)"
    roles: [ProviderAnalyst, ProviderReviewer, AgencyOfficer, Lender, Borrower]
    code: 200
    input: ["community_id?", "supersedes_panel_id?", "map_panel_number?", "revision_status?", "limit?", "offset?"]
    output: MapPanel[]
    side_effects: []

  - method: GET
    path: "/flood-zone/map-panels/{map_panel_id}"
    description: "Fetch one map panel with its revision_status, base_flood_elevation_ft and interval fields"
    roles: [ProviderAnalyst, ProviderReviewer, AgencyOfficer, Lender, Borrower]
    code: 200
    input: []
    output: MapPanel
    side_effects: []

  - method: GET
    path: "/flood-zone/map-panels/{map_panel_id}/impact-analysis"
    description: "Read-only preliminary-map impact projection for a panel in PRELIMINARY, APPEAL_OPEN or LFD_ISSUED; runs calculations.preliminary_map_impact_analysis and writes nothing"
    roles: [ProviderAnalyst, ProviderReviewer, AgencyOfficer]
    code: 200
    input: []
    output:
      map_panel_id: string
      revision_status: string
      structures_evaluated: integer
      newly_in_sfha_count: integer
      newly_out_of_sfha_count: integer
      bfe_increase_count: integer
      folios_requiring_new_notice_count: integer
      aggregate_new_required_coverage_cents: integer
    side_effects: ["none: no Determination is created, no Structure is mutated, no notice is sent"]

  # --- reads: Property / Structure ------------------------------------------
  - method: GET
    path: "/flood-zone/properties"
    description: "List properties; community_id is the reverse-reachability filter from Community"
    roles: [ProviderAnalyst, ProviderReviewer, AgencyOfficer, Lender, Borrower]
    code: 200
    input: ["community_id?", "map_panel_number?", "geocode_status?", "limit?", "offset?"]
    output: Property[]
    side_effects: []

  - method: GET
    path: "/flood-zone/properties/{property_id}"
    description: "Fetch one property with computed geocode_status, geocode_buffer_ft and structure_count"
    roles: [ProviderAnalyst, ProviderReviewer, AgencyOfficer, Lender, Borrower]
    code: 200
    input: []
    output: Property
    side_effects: []

  - method: GET
    path: "/flood-zone/structures"
    description: "List structures; property_id and elevation_source_certificate_id are the reverse-reachability filters"
    roles: [ProviderAnalyst, ProviderReviewer, AgencyOfficer, Lender, Borrower]
    code: 200
    input: ["property_id?", "elevation_source_certificate_id?", "occupancy_type?", "limit?", "offset?"]
    output: Structure[]
    side_effects: []

  - method: GET
    path: "/flood-zone/structures/{structure_id}"
    description: "Fetch one structure with the elevation fields populated by certificate validation"
    roles: [ProviderAnalyst, ProviderReviewer, AgencyOfficer, Lender, Borrower]
    code: 200
    input: []
    output: Structure
    side_effects: []

  # --- reads: LoanFolio ------------------------------------------------------
  - method: GET
    path: "/flood-zone/loan-folios"
    description: "List loan folios; lender_id, property_id and current_determination_id are the reverse-reachability filters"
    roles: [ProviderAnalyst, ProviderReviewer, AgencyOfficer, Lender, Borrower]
    code: 200
    input: ["lender_id?", "property_id?", "current_determination_id?", "compliance_posture?", "insurance_status?", "limit?", "offset?"]
    output: LoanFolio[]
    side_effects: []

  - method: GET
    path: "/flood-zone/loan-folios/{loan_folio_id}"
    description: "Fetch one loan folio with version, compliance_posture, coverage and escrow ledger fields"
    roles: [ProviderAnalyst, ProviderReviewer, AgencyOfficer, Lender, Borrower]
    code: 200
    input: []
    output: LoanFolio
    side_effects: []

  # --- reads: Determination / Dispute ---------------------------------------
  - method: GET
    path: "/flood-zone/determinations"
    description: "List determinations; loan_folio_id, structure_id, map_panel_id and supersedes_determination_id are the reverse-reachability filters and the only channel for cascade-minted determinations"
    roles: [ProviderAnalyst, ProviderReviewer, AgencyOfficer, Lender, Borrower]
    code: 200
    input: ["loan_folio_id?", "structure_id?", "map_panel_id?", "supersedes_determination_id?", "status?", "determination_type?", "limit?", "offset?"]
    output: Determination[]
    side_effects: []

  - method: GET
    path: "/flood-zone/determinations/{determination_id}"
    description: "Fetch one determination with position_class, zone_code, sfha_flag, freeboard_ft and mandatory_purchase_flag"
    roles: [ProviderAnalyst, ProviderReviewer, AgencyOfficer, Lender, Borrower]
    code: 200
    input: []
    output: Determination
    side_effects: []

  - method: GET
    path: "/flood-zone/disputes"
    description: "List disputes; determination_id and revised_determination_id are the reverse-reachability filters"
    roles: [ProviderAnalyst, ProviderReviewer, AgencyOfficer, Lender, Borrower]
    code: 200
    input: ["determination_id?", "revised_determination_id?", "status?", "basis?", "limit?", "offset?"]
    output: Dispute[]
    side_effects: []

  - method: GET
    path: "/flood-zone/disputes/{dispute_id}"
    description: "Fetch one dispute with round_number, provider_recommendation, agency_concurrence and resolution"
    roles: [ProviderAnalyst, ProviderReviewer, AgencyOfficer, Lender, Borrower]
    code: 200
    input: []
    output: Dispute
    side_effects: []

  # --- reads: ElevationCertificate / MapAmendmentRequest --------------------
  - method: GET
    path: "/flood-zone/elevation-certificates"
    description: "List elevation certificates; structure_id, dispute_id and reference_panel_id are the reverse-reachability filters"
    roles: [ProviderAnalyst, ProviderReviewer, AgencyOfficer, Lender, Borrower]
    code: 200
    input: ["structure_id?", "dispute_id?", "reference_panel_id?", "status?", "limit?", "offset?"]
    output: ElevationCertificate[]
    side_effects: []

  - method: GET
    path: "/flood-zone/elevation-certificates/{elevation_certificate_id}"
    description: "Fetch one certificate with the datum-converted elevations and both freeboard figures"
    roles: [ProviderAnalyst, ProviderReviewer, AgencyOfficer, Lender, Borrower]
    code: 200
    input: []
    output: ElevationCertificate
    side_effects: []

  - method: GET
    path: "/flood-zone/map-amendment-requests"
    description: "List map amendment requests; determination_id and elevation_certificate_id are the reverse-reachability filters"
    roles: [ProviderAnalyst, ProviderReviewer, AgencyOfficer, Lender, Borrower]
    code: 200
    input: ["determination_id?", "elevation_certificate_id?", "status?", "request_type?", "limit?", "offset?"]
    output: MapAmendmentRequest[]
    side_effects: []

  - method: GET
    path: "/flood-zone/map-amendment-requests/{map_amendment_request_id}"
    description: "Fetch one amendment request with base_review_fee_cents, fee_tier, expedite_surcharge_cents and total_fee_cents"
    roles: [ProviderAnalyst, ProviderReviewer, AgencyOfficer, Lender, Borrower]
    code: 200
    input: []
    output: MapAmendmentRequest
    side_effects: []

  # --- reads: ComplianceNotice ----------------------------------------------
  - method: GET
    path: "/flood-zone/compliance-notices"
    description: "List compliance notices; loan_folio_id and determination_id are the reverse-reachability filters and the only channel for cascade-sent or cascade-superseded notices"
    roles: [ProviderAnalyst, ProviderReviewer, AgencyOfficer, Lender, Borrower]
    code: 200
    input: ["loan_folio_id?", "determination_id?", "notice_type?", "status?", "limit?", "offset?"]
    output: ComplianceNotice[]
    side_effects: []

  - method: GET
    path: "/flood-zone/compliance-notices/{compliance_notice_id}"
    description: "Fetch one notice with response_deadline_at and estimated_force_place_premium_cents"
    roles: [ProviderAnalyst, ProviderReviewer, AgencyOfficer, Lender, Borrower]
    code: 200
    input: []
    output: ComplianceNotice
    side_effects: []

  # --- writes: Community / Lender -------------------------------------------
  - method: POST
    path: "/flood-zone/communities"
    description: "Register an NFIP community"
    roles: [ProviderAnalyst]
    code: 201
    input: [community_id_code, name, state_code, "participation_status?", "cbrs_flag?", "probation_surcharge_cents?"]
    output: Community
    side_effects:
      - "calculations.community_coverage_availability sets coverage_availability"
      - "last_participation_change_at set to clock.current_utc; active_folio_count initialized to 0"

  - method: POST
    path: "/flood-zone/communities/{community_id}/participation-changes"
    description: "Change a community's NFIP participation status (suspension, probation, reinstatement, withdrawal)"
    roles: [ProviderAnalyst]
    code: 200
    input: [participation_status, "probation_surcharge_cents?"]
    output: Community
    side_effects:
      - "coverage_availability recomputed; last_participation_change_at set to clock.current_utc"
      - "every LoanFolio on a Property in this community: monitoring_status ACTIVE -> SUSPENDED when the new coverage_availability is UNAVAILABLE, SUSPENDED -> ACTIVE otherwise"
      - "required_coverage_cents and uninsured_exposure_cents recomputed for those folios (an EMERGENCY community caps coverage at EMERGENCY_CAP_CENTS)"
      - "compliance_posture recomputed for those folios"

  - method: POST
    path: "/flood-zone/lenders"
    description: "Register a lender / servicer"
    roles: [ProviderAnalyst]
    code: 201
    input: [name, contact_email, "force_placement_authorized_flag?", "escrow_servicing_flag?"]
    output: Lender
    side_effects: ["open_force_placement_count initialized to 0"]

  # --- writes: MapPanel ------------------------------------------------------
  - method: POST
    path: "/flood-zone/map-panels"
    description: "Publish a FIRM panel. revision_sequence == 1 is created directly in EFFECTIVE; any higher sequence enters PRELIMINARY and must walk the appeal / LFD path before it can become effective"
    roles: [AgencyOfficer]
    code: 201
    input: [community_id, map_panel_number, revision_sequence, zone_code, base_flood_elevation_ft, effective_date, "supersedes_panel_id?", "sfha_boundary_shift_ft?", "horizontal_uncertainty_ft?", "study_case_number?"]
    output: MapPanel
    side_effects:
      - "revision_status = EFFECTIVE when revision_sequence == 1, otherwise PRELIMINARY; revision_round = 0"
      - "validations priority 25 enforces revision_sequence == supersedes.revision_sequence + 1 and single-EFFECTIVE-panel uniqueness"

  - method: POST
    path: "/flood-zone/map-panels/{map_panel_id}/appeal-period"
    description: "Open the statutory appeal period on a PRELIMINARY panel; appeal_period_end_date defaults to clock.current_utc + APPEAL_PERIOD_DAYS (90)"
    roles: [AgencyOfficer]
    code: 200
    input: ["appeal_period_end_date?"]
    output: MapPanel
    side_effects: ["revision_status PRELIMINARY -> APPEAL_OPEN; appeal_period_end_date stored"]

  - method: POST
    path: "/flood-zone/map-panels/{map_panel_id}/appeal-decision"
    description: "Resolve the appeal period: outcome REVISED_PRELIMINARY sends the panel back to PRELIMINARY for another round, outcome LFD_ISSUED issues the letter of final determination"
    roles: [AgencyOfficer]
    code: 200
    input: [outcome]
    output: MapPanel
    side_effects:
      - "outcome == REVISED_PRELIMINARY: revision_status -> PRELIMINARY, revision_round += 1, appeal_period_end_date cleared"
      - "outcome == LFD_ISSUED: revision_status -> LFD_ISSUED, lfd_issued_at = clock.current_utc"
      - "validations priority 32 rejects the decision while appeal_period_end_date > clock.current_utc (ERR_APPEAL_PERIOD_OPEN)"

  - method: POST
    path: "/flood-zone/map-panels/{map_panel_id}/effective"
    description: "Make an LFD_ISSUED panel effective. This is the head of the 5-hop panel-effective cascade"
    roles: [AgencyOfficer]
    code: 200
    input: []
    output: MapPanel
    side_effects:
      - "HOP 1: this panel revision_status LFD_ISSUED -> EFFECTIVE"
      - "HOP 2: the panel it supersedes goes EFFECTIVE -> SUPERSEDED with superseded_at = clock.current_utc"
      - "HOP 3: every Determination whose map_panel_id is the superseded panel and whose status == ISSUED goes ISSUED -> FLAGGED_FOR_REVIEW with flagged_reason = MAP_REVISION"
      - "HOP 4: each affected LoanFolio.pending_redetermination_count is re-counted, and compliance_posture is recomputed to REVIEW_PENDING"
      - "HOP 5: every SENT ComplianceNotice on those folios goes SENT -> SUPERSEDED with closed_at set, and open_notice_count is re-counted"

  # --- writes: Property / Structure -----------------------------------------
  - method: POST
    path: "/flood-zone/properties"
    description: "Geocode and register a property against a flood hazard map panel number"
    roles: [ProviderAnalyst]
    code: 201
    input: [community_id, street_address, city, postal_code, map_panel_number, latitude, longitude, geocode_method, geocode_confidence_score]
    output: Property
    side_effects:
      - "geocode_status computed (GEOCODED only when geocode_method != FAILED and geocode_confidence_score >= GEOCODE_CONFIDENCE_FLOOR 0.60)"
      - "geocode_buffer_ft computed from GEOCODE_BUFFER_FT[geocode_method]; structure_count initialized to 0"

  - method: POST
    path: "/flood-zone/properties/{property_id}/geocode-corrections"
    description: "Re-geocode a property (rooftop upgrade or corrected coordinates). Head of the 2-hop geocode-correction cascade"
    roles: [ProviderAnalyst]
    code: 200
    input: [latitude, longitude, geocode_method, geocode_confidence_score]
    output: Property
    side_effects:
      - "HOP 1: coordinates, geocode_method, geocode_confidence_score replaced; geocode_status and geocode_buffer_ft recomputed; geocode_corrected_count += 1"
      - "HOP 2: every ISSUED Determination on a Structure of this property goes ISSUED -> FLAGGED_FOR_REVIEW with flagged_reason = GEOCODE_CORRECTION; the folios' pending_redetermination_count and compliance_posture are recomputed"

  - method: POST
    path: "/flood-zone/structures"
    description: "Add a structure to a property with its measured offset from the SFHA boundary"
    roles: [ProviderAnalyst]
    code: 201
    input: [property_id, structure_label, occupancy_type, foundation_type, replacement_cost_cents, sfha_offset_ft, "post_firm_flag?", "fill_placed_flag?"]
    output: Structure
    side_effects:
      - "Property.structure_count re-counted"
      - "lowest_floor_elevation_ft and lowest_adjacent_grade_ft stay null until an ElevationCertificate is VALIDATED"

  # --- writes: LoanFolio -----------------------------------------------------
  - method: POST
    path: "/flood-zone/loan-folios"
    description: "Open a life-of-loan monitoring folio for a loan secured by a property"
    roles: [Lender]
    code: 201
    input: [lender_id, property_id, loan_number, borrower_user_id, principal_balance_cents, policy_anniversary_date, "escrow_balance_cents?"]
    output: LoanFolio
    side_effects:
      - "monitoring_status = ACTIVE, insurance_status = NONE, compliance_posture = COMPLIANT (no determination yet, so required_coverage_cents == 0)"
      - "initial_escrow_balance_cents snapshotted from escrow_balance_cents, anchoring the escrow conservation invariant"
      - "Community.active_folio_count re-counted"

  - method: POST
    path: "/flood-zone/loan-folios/{loan_folio_id}/insurance-reports"
    description: "Lender reports borrower-obtained flood coverage; also the compensating action that settles a force-placed premium"
    roles: [Lender]
    code: 200
    input: [reported_coverage_cents]
    output: LoanFolio
    side_effects:
      - "reported_coverage_cents stored; uninsured_exposure_cents recomputed"
      - "insurance_status NONE -> BORROWER_PROVIDED, or FORCE_PLACED -> BORROWER_PROVIDED"
      - "on the FORCE_PLACED path calculations.escrow_settlement runs: escrow_balance_cents += refund, cumulative_earned_premium_cents += earned, force_placed_* cleared, Lender.open_force_placement_count re-counted"
      - "every SENT MANDATORY_PURCHASE notice on the folio goes SENT -> SUPERSEDED; open_notice_count re-counted"
      - "compliance_posture recomputed; version += 1"

  - method: POST
    path: "/flood-zone/loan-folios/{loan_folio_id}/force-placements"
    description: "Force place flood insurance after the mandatory-purchase notice period lapses; draws the premium from escrow"
    roles: [Lender]
    code: 200
    input: []
    output: LoanFolio
    side_effects:
      - "any SENT notice whose response_deadline_at has passed is first moved SENT -> EXPIRED (so compliance_posture reads FORCE_PLACE_ELIGIBLE)"
      - "calculations.force_place_premium variant chronological_actual sets force_placed_premium_cents and force_placed_coverage_days; force_placed_at = clock.current_utc"
      - "escrow_balance_cents -= force_placed_premium_cents; insurance_status NONE -> FORCE_PLACED; uninsured_exposure_cents = 0"
      - "Lender.open_force_placement_count re-counted; compliance_posture -> FORCE_PLACED; version += 1"

  # --- writes: Determination -------------------------------------------------
  - method: POST
    path: "/flood-zone/determinations"
    description: "Issue a structure-level flood zone determination against the current effective panel. expected_loan_folio_version is the OCC guard from §1.2.1"
    roles: [ProviderAnalyst]
    code: 201
    input: [loan_folio_id, structure_id, determination_type, expected_loan_folio_version]
    output: Determination
    side_effects:
      - "calculations.effective_panel_selector picks map_panel_id; calculations.structure_zone_determination sets position_class, zone_code, sfha_flag, base_flood_elevation_ft and freeboard_ft under the variant chosen by determination_type"
      - "any prior ISSUED or FLAGGED_FOR_REVIEW determination for the same (loan_folio_id, structure_id) is SUPERSEDED and named in supersedes_determination_id"
      - "LoanFolio.current_determination_id repointed; required_coverage_cents / uninsured_exposure_cents recomputed; pending_redetermination_count re-counted"
      - "insurance_status NONE -> NOT_REQUIRED when mandatory_purchase_flag is false, or NOT_REQUIRED -> NONE when it becomes true"
      - "compliance_posture recomputed; LoanFolio.version += 1 (so a second write replaying the same expected_loan_folio_version gets 412)"

  # --- writes: Dispute -------------------------------------------------------
  - method: POST
    path: "/flood-zone/disputes"
    description: "Borrower disputes a determination; the determination is locked for the duration of the joint review"
    roles: [Borrower]
    code: 201
    input: [determination_id, basis, borrower_statement, asserted_sfha_offset_ft]
    output: Dispute
    side_effects:
      - "status = SUBMITTED, round_number = 1, filed_at = clock.current_utc, decision_due_at = filed_at + DISPUTE_DECISION_DAYS (30)"
      - "Determination status ISSUED -> UNDER_DISPUTE"
      - "LoanFolio.compliance_posture recomputed (force placement is blocked while a dispute is open)"

  - method: POST
    path: "/flood-zone/disputes/{dispute_id}/provider-review"
    description: "Provider reviewer records the recommendation that the federal agency will concur with or override"
    roles: [ProviderReviewer]
    code: 200
    input: [provider_recommendation]
    output: Dispute
    side_effects:
      - "provider_recommendation and provider_reviewed_by_user_id stored; status SUBMITTED -> JOINT_AGENCY_REVIEW"
      - "segregation of duties: the reviewer's X-User-ID may not equal the disputed Determination.issued_by_user_id"

  - method: POST
    path: "/flood-zone/disputes/{dispute_id}/agency-review"
    description: "Federal agency concurs with or overrides the provider recommendation, closing the joint review. Head of the 5-hop dispute-sustained cascade"
    roles: [AgencyOfficer]
    code: 200
    input: [agency_concurrence]
    output: Dispute
    side_effects:
      - "agency_concurrence and agency_reviewed_by_user_id stored; resolution derived from (agency_concurrence, provider_recommendation, round_number)"
      - "NON_CONCUR below MAX_DISPUTE_ROUNDS: status -> SUBMITTED, round_number += 1, provider_recommendation and provider_reviewed_by_user_id cleared for a fresh provider review"
      - "denial: status -> DENIED, resolved_at set, Determination UNDER_DISPUTE -> ISSUED, compliance_posture recomputed"
      - "sustain HOP 1: status -> SUSTAINED, resolved_at set"
      - "sustain HOP 2: Structure.sfha_offset_ft replaced by asserted_sfha_offset_ft"
      - "sustain HOP 3: a DISPUTE_REVISION Determination is minted from the corrected offset and named in revised_determination_id; the disputed determination goes UNDER_DISPUTE -> SUPERSEDED"
      - "sustain HOP 4: LoanFolio.current_determination_id repointed, required_coverage_cents recomputed, and FORCE_PLACED -> NOT_REQUIRED with calculations.escrow_settlement refunding the unearned premium when the revision clears the mandatory purchase requirement"
      - "sustain HOP 5: every SENT ComplianceNotice on the folio goes SENT -> SUPERSEDED, open_notice_count re-counted, compliance_posture recomputed"

  # --- writes: ElevationCertificate -----------------------------------------
  - method: POST
    path: "/flood-zone/elevation-certificates"
    description: "Collect a surveyed elevation certificate for a structure, optionally attached to an open dispute; the datum conversion runs here"
    roles: [Borrower, ProviderAnalyst]
    code: 201
    input: [structure_id, surveyor_license_number, survey_date, datum, raw_lowest_floor_elevation_ft, raw_lowest_adjacent_grade_ft, "machinery_elevation_ft?", "dispute_id?"]
    output: ElevationCertificate
    side_effects:
      - "reference_panel_id set from calculations.effective_panel_selector"
      - "calculations.elevation_certificate_conversion sets converted_lowest_floor_ft, converted_lag_ft, freeboard_ft and lag_freeboard_ft in the pinned rounding order"
      - "status = SUBMITTED; submitted_by_user_id = the acting X-User-ID (anchor of the certificate-review segregation of duties)"

  - method: POST
    path: "/flood-zone/elevation-certificates/{elevation_certificate_id}/review"
    description: "Provider reviewer validates or rejects a submitted certificate; validation is what publishes the surveyed elevations onto the structure"
    roles: [ProviderReviewer]
    code: 200
    input: [decision, "rejection_reason?"]
    output: ElevationCertificate
    side_effects:
      - "decision == VALIDATED: Structure.lowest_floor_elevation_ft / lowest_adjacent_grade_ft / elevation_source_certificate_id written, and the folio's current Determination.freeboard_ft is recomputed (zone_code and sfha_flag are NOT)"
      - "decision == REJECTED: rejection_reason stored, no Structure field written"
      - "reviewed_by_user_id set; the reviewer's X-User-ID may not equal submitted_by_user_id"

  # --- writes: MapAmendmentRequest ------------------------------------------
  - method: POST
    path: "/flood-zone/map-amendment-requests"
    description: "Prepare a Letter of Map Amendment (LOMA) or Letter of Map Revision based on Fill (LOMR-F) package in DRAFT, with the fee quoted from calculations.map_amendment_fee"
    roles: [ProviderAnalyst]
    code: 201
    input: [determination_id, elevation_certificate_id, request_type, "expedite_flag?"]
    output: MapAmendmentRequest
    side_effects:
      - "status = DRAFT, resubmission_count = 0, prepared_by_user_id set"
      - "base_review_fee_cents, fee_tier, expedite_surcharge_cents and total_fee_cents computed with the tier keyed on the pre-surcharge base"

  - method: POST
    path: "/flood-zone/map-amendment-requests/{map_amendment_request_id}/submission"
    description: "Submit a DRAFT package to the agency, or resubmit one sitting in ADDITIONAL_DATA_REQUESTED. Every resubmission re-prices the fee"
    roles: [ProviderAnalyst]
    code: 200
    input: []
    output: MapAmendmentRequest
    side_effects:
      - "status DRAFT -> SUBMITTED_TO_AGENCY, or ADDITIONAL_DATA_REQUESTED -> SUBMITTED_TO_AGENCY with resubmission_count += 1 first"
      - "calculations.map_amendment_fee re-runs, so a resubmission can cross a fee tier"
      - "submitted_at = clock.current_utc; validations 16, 21 and 27 gate certificate status, survey freshness and above-BFE eligibility"

  - method: POST
    path: "/flood-zone/map-amendment-requests/{map_amendment_request_id}/agency-decision"
    description: "Agency grants, denies, or requests additional data on a submitted package"
    roles: [AgencyOfficer]
    code: 200
    input: [decision, "agency_case_number?", "additional_data_note?"]
    output: MapAmendmentRequest
    side_effects:
      - "GRANTED: status -> GRANTED, decided_at set, agency_case_number stored; the Structure's sfha_offset_ft is NOT altered - the amendment is evidence for a fresh determination, not a determination itself"
      - "DENIED: status -> DENIED, decided_at set"
      - "ADDITIONAL_DATA_REQUESTED: status -> ADDITIONAL_DATA_REQUESTED, additional_data_note stored, decided_at left null"

  # --- writes: ComplianceNotice ---------------------------------------------
  - method: POST
    path: "/flood-zone/compliance-notices"
    description: "Send a mandatory-purchase, force-placement-warning, coverage-unavailable or re-determination notice against a folio's current determination"
    roles: [Lender, ProviderAnalyst]
    code: 201
    input: [loan_folio_id, determination_id, notice_type, annual_premium_rate_cents]
    output: ComplianceNotice
    side_effects:
      - "status = SENT, sent_at = clock.current_utc, response_deadline_at = sent_at + NOTICE_RESPONSE_DAYS[notice_type] (MANDATORY_PURCHASE 45, FORCE_PLACEMENT_WARNING 30, RE_DETERMINATION 30, COVERAGE_UNAVAILABLE 15)"
      - "required_coverage_snapshot_cents snapshotted from the folio"
      - "calculations.force_place_premium variant forward_looking_estimate sets estimated_force_place_premium_cents"
      - "LoanFolio.open_notice_count re-counted; compliance_posture recomputed by calculations.compliance_posture in its declared rule order (NOTICE_PENDING when this notice is the folio's only mandatory-purchase obligation and its deadline is still in the future; an older lapsed MANDATORY_PURCHASE notice still wins with FORCE_PLACE_ELIGIBLE)"

  - method: POST
    path: "/flood-zone/compliance-notices/{compliance_notice_id}/acknowledgement"
    description: "Lender or borrower acknowledges a SENT notice, closing the obligation"
    roles: [Lender, Borrower]
    code: 200
    input: []
    output: ComplianceNotice
    side_effects:
      - "status SENT -> ACKNOWLEDGED; acknowledged_at = clock.current_utc; acknowledged_by_role = the acting X-Role; closed_at set"
      - "LoanFolio.open_notice_count re-counted (the cardinality conservation invariant returns to its pre-issuance value)"
      - "compliance_posture recomputed"

  # --- writes: monitoring sweep and test-driving clock ----------------------
  - method: POST
    path: "/flood-zone/monitoring-runs"
    description: "Run the life-of-loan monitoring sweep: re-determine every FLAGGED_FOR_REVIEW determination in chronological order, then expire every lapsed notice. An empty scope is a success with all counts 0"
    roles: [ProviderAnalyst]
    code: 200
    input: ["community_id?", "map_panel_id?"]
    output:
      determinations_scanned: integer
      redeterminations_cleared: integer
      redeterminations_issued: integer
      notices_sent: integer
      notices_expired: integer
      run_at: string
    side_effects:
      - "each flagged determination goes FLAGGED_FOR_REVIEW -> ISSUED (unchanged outcome) or FLAGGED_FOR_REVIEW -> SUPERSEDED with a fresh LIFE_OF_LOAN_REVIEW determination (changed outcome), under the life_of_loan_lenient variant"
      - "a RE_DETERMINATION ComplianceNotice is sent for each newly mandatory, uninsured folio"
      - "every SENT notice past its response_deadline_at goes SENT -> EXPIRED"
      - "affected LoanFolio.pending_redetermination_count, open_notice_count, required_coverage_cents and compliance_posture recomputed"

  - method: POST
    path: "/flood-zone/_clock/set_current_utc"
    description: "Test-driving endpoint: set the server's logical clock. Before any call the logical clock reads exactly 2026-08-01T00:00:00Z (the mandated startup default) and never falls back to wall-clock time. Moving the clock does not by itself expire notices or make panels effective; those are driven by POST /flood-zone/monitoring-runs and POST /flood-zone/map-panels/{map_panel_id}/effective"
    roles: [ProviderAnalyst, ProviderReviewer, AgencyOfficer, Lender, Borrower]
    code: 200
    input: [current_utc]
    output:
      current_utc: string
    side_effects: ["no entity is written"]

# =============================================================================
# §1.6 Error Code Catalog
# Every entry is triggerable by at least one declared §1.5 endpoint.
# =============================================================================
errors:
  # --- authentication / authorization --------------------------------------
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-Role missing, empty, or not one of the five declared roles; or X-User-ID missing on a non-GET request"
    applies_to: all

  - id: ERR_FORBIDDEN_ROLE
    http: 403
    condition: "the caller's role is not in the target endpoint's roles list (e.g. a Lender calling POST /flood-zone/map-panels)"
    applies_to: all

  - id: ERR_FOLIO_NOT_OWNED
    http: 403
    condition: "a Lender caller's X-User-ID is not the Lender.id named by the target LoanFolio.lender_id"
    applies_to: "insurance-reports, force-placements, compliance-notices, acknowledgement"

  - id: ERR_BORROWER_NOT_ON_LOAN
    http: 403
    condition: "a Borrower caller's X-User-ID is not the target LoanFolio.borrower_user_id"
    applies_to: "POST /flood-zone/disputes, POST /flood-zone/elevation-certificates, acknowledgement"

  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "the reviewing X-User-ID equals the X-User-ID that submitted or issued the artifact under review (certificate review vs submitted_by_user_id, provider dispute review vs Determination.issued_by_user_id, agency review vs Dispute.provider_reviewed_by_user_id)"
    applies_to: "elevation-certificates review, provider-review, agency-review"

  # --- request shape ---------------------------------------------------------
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "unknown body field, missing required field, out-of-range enum value, negative integer where non-negative is declared, malformed datetime, or limit/offset outside 1..100 / >= 0"
    applies_to: all

  # --- existence -------------------------------------------------------------
  - id: ERR_COMMUNITY_NOT_FOUND
    http: 404
    condition: "community_id in the path or body names no Community"
    applies_to: "communities/{community_id}, participation-changes, POST /flood-zone/map-panels, POST /flood-zone/properties, POST /flood-zone/monitoring-runs"

  - id: ERR_LENDER_NOT_FOUND
    http: 404
    condition: "lender_id in the path or body names no Lender"
    applies_to: "lenders/{lender_id}, POST /flood-zone/loan-folios"

  - id: ERR_MAP_PANEL_NOT_FOUND
    http: 404
    condition: "map_panel_id in the path or body, or supersedes_panel_id, names no MapPanel"
    applies_to: "map-panels/{map_panel_id} and its actions, impact-analysis, POST /flood-zone/map-panels, POST /flood-zone/monitoring-runs"

  - id: ERR_PROPERTY_NOT_FOUND
    http: 404
    condition: "property_id in the path or body names no Property"
    applies_to: "properties/{property_id}, geocode-corrections, POST /flood-zone/structures, POST /flood-zone/loan-folios"

  - id: ERR_STRUCTURE_NOT_FOUND
    http: 404
    condition: "structure_id in the path or body names no Structure"
    applies_to: "structures/{structure_id}, POST /flood-zone/determinations, POST /flood-zone/elevation-certificates"

  - id: ERR_LOAN_FOLIO_NOT_FOUND
    http: 404
    condition: "loan_folio_id in the path or body names no LoanFolio"
    applies_to: "loan-folios/{loan_folio_id} and its actions, POST /flood-zone/determinations, POST /flood-zone/compliance-notices"

  - id: ERR_DETERMINATION_NOT_FOUND
    http: 404
    condition: "determination_id in the path or body names no Determination"
    applies_to: "determinations/{determination_id}, POST /flood-zone/disputes, POST /flood-zone/map-amendment-requests, POST /flood-zone/compliance-notices"

  - id: ERR_DISPUTE_NOT_FOUND
    http: 404
    condition: "dispute_id in the path or body names no Dispute"
    applies_to: "disputes/{dispute_id} and its actions, POST /flood-zone/elevation-certificates"

  - id: ERR_ELEVATION_CERTIFICATE_NOT_FOUND
    http: 404
    condition: "elevation_certificate_id in the path or body names no ElevationCertificate"
    applies_to: "elevation-certificates/{elevation_certificate_id} and its review, POST /flood-zone/map-amendment-requests"

  - id: ERR_MAP_AMENDMENT_REQUEST_NOT_FOUND
    http: 404
    condition: "map_amendment_request_id in the path names no MapAmendmentRequest"
    applies_to: "map-amendment-requests/{map_amendment_request_id}, submission, agency-decision"

  - id: ERR_COMPLIANCE_NOTICE_NOT_FOUND
    http: 404
    condition: "compliance_notice_id in the path names no ComplianceNotice"
    applies_to: "compliance-notices/{compliance_notice_id}, acknowledgement"

  # --- optimistic concurrency ------------------------------------------------
  - id: ERR_STALE_LOAN_FOLIO_VERSION
    http: 412
    condition: "expected_loan_folio_version does not equal the target LoanFolio.version, i.e. the folio's governing determination advanced since the client last read it"
    applies_to: "POST /flood-zone/determinations"

  # --- state preconditions ---------------------------------------------------
  - id: ERR_INVALID_PANEL_STATE
    http: 409
    condition: "the MapPanel is not in a state from which the requested panel action is declared (opening an appeal period on an EFFECTIVE panel, deciding an appeal on a PRELIMINARY panel, making a PRELIMINARY or SUPERSEDED panel effective)"
    applies_to: "appeal-period, appeal-decision, effective"

  - id: ERR_INVALID_DETERMINATION_STATE
    http: 409
    condition: "the Determination is not ISSUED when a dispute is filed against it, or is already SUPERSEDED when named by a notice or amendment request"
    applies_to: "POST /flood-zone/disputes, POST /flood-zone/map-amendment-requests, POST /flood-zone/compliance-notices"

  - id: ERR_INVALID_DISPUTE_STATE
    http: 409
    condition: "provider-review called on a dispute that is not SUBMITTED, or agency-review called on a dispute that is not JOINT_AGENCY_REVIEW (including a second call on a SUSTAINED or DENIED dispute)"
    applies_to: "provider-review, agency-review"

  - id: ERR_INVALID_CERTIFICATE_STATE
    http: 409
    condition: "review called on a certificate that is already VALIDATED or REJECTED"
    applies_to: "elevation-certificates review"

  - id: ERR_INVALID_AMENDMENT_STATE
    http: 409
    condition: "submission called on a request that is SUBMITTED_TO_AGENCY, GRANTED or DENIED; or agency-decision called on a request that is not SUBMITTED_TO_AGENCY"
    applies_to: "submission, agency-decision"

  - id: ERR_INVALID_NOTICE_STATE
    http: 409
    condition: "acknowledgement called on a notice that is already ACKNOWLEDGED, EXPIRED or SUPERSEDED"
    applies_to: "acknowledgement"

  - id: ERR_INVALID_FOLIO_STATE
    http: 409
    condition: "the folio's insurance_status forbids the transition (reporting coverage while NOT_REQUIRED, force placing a folio already FORCE_PLACED or BORROWER_PROVIDED) or monitoring_status == SUSPENDED blocks the write"
    applies_to: "insurance-reports, force-placements"

  # --- business: safety / regulatory ----------------------------------------
  - id: ERR_COVERAGE_UNAVAILABLE
    http: 409
    condition: "the property's Community.coverage_availability is UNAVAILABLE (suspended, withdrawn, non-participating, or a CBRS unit), so NFIP coverage cannot be written or force placed"
    applies_to: "force-placements, POST /flood-zone/compliance-notices"

  - id: ERR_NOTICE_PERIOD_NOT_EXPIRED
    http: 409
    condition: "force placement attempted while compliance_posture is not FORCE_PLACE_ELIGIBLE - no mandatory-purchase notice was sent, its response_deadline_at has not passed, or a pending re-determination holds the folio in REVIEW_PENDING"
    applies_to: "force-placements"

  - id: ERR_FORCE_PLACEMENT_NOT_AUTHORIZED
    http: 403
    condition: "the owning Lender.force_placement_authorized_flag is false"
    applies_to: "force-placements"

  - id: ERR_MANDATORY_PURCHASE_NOT_TRIGGERED
    http: 409
    condition: "a MANDATORY_PURCHASE notice is requested while the folio's current determination has mandatory_purchase_flag == false"
    applies_to: "POST /flood-zone/compliance-notices"

  # --- business: referential -------------------------------------------------
  - id: ERR_CERTIFICATE_NOT_VALIDATED
    http: 409
    condition: "the referenced ElevationCertificate.status is SUBMITTED or REJECTED rather than VALIDATED"
    applies_to: "POST /flood-zone/map-amendment-requests, submission"

  - id: ERR_STRUCTURE_FOLIO_MISMATCH
    http: 422
    condition: "supplied ids are individually valid but mutually incoherent: the structure does not sit on the folio's property, the certificate's structure is not the disputed determination's structure, the amendment's certificate is not for the determination's structure, or the notice names a determination that is not the folio's current_determination_id"
    applies_to: "POST /flood-zone/determinations, POST /flood-zone/elevation-certificates, POST /flood-zone/map-amendment-requests, POST /flood-zone/compliance-notices"

  - id: ERR_AMENDMENT_TYPE_MISMATCH
    http: 422
    condition: "request_type == LOMA on a structure with fill_placed_flag == true, or request_type == LOMR_F on a structure with fill_placed_flag == false"
    applies_to: "POST /flood-zone/map-amendment-requests"

  - id: ERR_PROPERTY_NOT_GEOCODED
    http: 422
    condition: "the property's geocode_status is UNRESOLVED (geocode_method == FAILED or geocode_confidence_score below the 0.60 floor)"
    applies_to: "POST /flood-zone/determinations, POST /flood-zone/elevation-certificates"

  - id: ERR_NO_EFFECTIVE_PANEL
    http: 422
    condition: "no EFFECTIVE MapPanel with effective_date <= clock.current_utc exists for the property's (community_id, map_panel_number)"
    applies_to: "POST /flood-zone/determinations, POST /flood-zone/elevation-certificates"

  # --- business: temporal ----------------------------------------------------
  - id: ERR_CERTIFICATE_EXPIRED
    http: 422
    condition: "the referenced certificate's survey_date is more than CERTIFICATE_VALIDITY_DAYS (365) before clock.current_utc"
    applies_to: "elevation-certificates review, submission"

  - id: ERR_APPEAL_PERIOD_OPEN
    http: 409
    condition: "appeal-decision called while appeal_period_end_date > clock.current_utc"
    applies_to: "appeal-decision"

  - id: ERR_LFD_WAITING_PERIOD
    http: 409
    condition: "effective called before lfd_issued_at + LFD_WAITING_PERIOD_DAYS (180) has elapsed"
    applies_to: "effective"

  - id: ERR_PANEL_EFFECTIVE_DATE_OVERLAP
    http: 409
    condition: "the panel's effective_date is in the future relative to clock.current_utc, or is not strictly greater than the effective_date of the panel it supersedes, so the half-open [effective_date, superseded_at) intervals would overlap"
    applies_to: "effective"

  - id: ERR_NOTICE_WINDOW_ACTIVE
    http: 409
    condition: "a notice of the same notice_type is already SENT on the folio and clock.current_utc still lies inside the closed window [sent_at, response_deadline_at + NOTICE_COOLDOWN_DAYS (5)]"
    applies_to: "POST /flood-zone/compliance-notices"

  # --- business: constraint --------------------------------------------------
  - id: ERR_PANEL_SEQUENCE_INVALID
    http: 409
    condition: "revision_sequence is not supersedes_panel_id's revision_sequence + 1, revision_sequence > 1 with supersedes_panel_id null, revision_sequence == 1 with supersedes_panel_id set, a duplicate (community_id, map_panel_number, revision_sequence), or a second EFFECTIVE panel for the same (community_id, map_panel_number)"
    applies_to: "POST /flood-zone/map-panels"

  - id: ERR_RESUBMISSION_LIMIT
    http: 409
    condition: "the agency requests additional data on a package whose resubmission_count has already reached MAX_RESUBMISSIONS (2)"
    applies_to: "agency-decision"

  - id: ERR_STRUCTURE_NOT_ABOVE_BFE
    http: 422
    condition: "LOMA submission with certificate freeboard_ft <= 0.0, or LOMR_F submission with lag_freeboard_ft <= 0.0 - the lowest floor / lowest adjacent grade is not above the base flood elevation"
    applies_to: "submission"

  - id: ERR_DISPUTE_BASIS_UNSUPPORTED
    http: 422
    condition: "the dispute basis is not supported by the record (ELEVATION_ABOVE_BFE without a VALIDATED certificate, MAP_PANEL_STALE with no later-sequence panel, GEOCODE_ERROR on a ROOFTOP geocode) or a round-2 dispute repeats round 1's asserted_sfha_offset_ft"
    applies_to: "POST /flood-zone/disputes"

  - id: ERR_ORIGINATION_ALREADY_COMPLETE
    http: 409
    condition: "determination_type == ORIGINATION on a folio that already has a current_determination_id"
    applies_to: "POST /flood-zone/determinations"

  - id: ERR_PANEL_NOT_PRELIMINARY
    http: 409
    condition: "impact-analysis requested for a panel whose revision_status is EFFECTIVE or SUPERSEDED - only PRELIMINARY, APPEAL_OPEN and LFD_ISSUED panels can be analysed prospectively"
    applies_to: "impact-analysis"

  # --- business: fiscal ------------------------------------------------------
  - id: ERR_COVERAGE_BELOW_REQUIRED
    http: 422
    condition: "reported_coverage_cents is below the folio's required_coverage_cents, or exceeds the structure's replacement_cost_cents (an uninsurable over-report)"
    applies_to: "insurance-reports"

  - id: ERR_ESCROW_INSUFFICIENT
    http: 402
    condition: "escrow_balance_cents is less than the computed force_placed_premium_cents, so the premium cannot be drawn"
    applies_to: "force-placements"

# =============================================================================
# §1.7 RBAC Permission Matrix   (role_model: segregation_of_duties)
#
# Headers: X-Role names the role, X-User-ID names the acting user. The provider
# side is split into two opaque roles precisely so that the person who issues a
# determination or files a certificate cannot also be the person who reviews it,
# and the federal agency is a third, independent role that concurs with or
# overrides the provider's recommendation.
# =============================================================================
roles:
  - name: ProviderAnalyst
    description: "Flood zone determination provider staff: geocodes properties, issues determinations, prepares LOMA/LOMR-F packages, runs the life-of-loan monitoring sweep"
    identity: opaque
    exclusive_operations:
      - "POST /flood-zone/communities"
      - "POST /flood-zone/communities/{community_id}/participation-changes"
      - "POST /flood-zone/lenders"
      - "POST /flood-zone/properties"
      - "POST /flood-zone/properties/{property_id}/geocode-corrections"
      - "POST /flood-zone/structures"
      - "POST /flood-zone/determinations"
      - "POST /flood-zone/map-amendment-requests"
      - "POST /flood-zone/map-amendment-requests/{map_amendment_request_id}/submission"
      - "POST /flood-zone/monitoring-runs"
    shared_operations:
      - "POST /flood-zone/elevation-certificates (shared with Borrower)"
      - "POST /flood-zone/compliance-notices (shared with Lender)"
      - "GET /flood-zone/map-panels/{map_panel_id}/impact-analysis (shared with ProviderReviewer and AgencyOfficer)"
      - "all GET reads except that only provider and agency roles may read impact-analysis"
      - "POST /flood-zone/_clock/set_current_utc"

  - name: ProviderReviewer
    description: "Independent provider reviewer: validates elevation certificates and forms the provider's recommendation on a borrower dispute. Never issues determinations, so its X-User-ID can always differ from issued_by_user_id"
    identity: opaque
    exclusive_operations:
      - "POST /flood-zone/elevation-certificates/{elevation_certificate_id}/review"
      - "POST /flood-zone/disputes/{dispute_id}/provider-review"
    shared_operations:
      - "GET /flood-zone/map-panels/{map_panel_id}/impact-analysis (shared with ProviderAnalyst and AgencyOfficer)"
      - "all GET reads"
      - "POST /flood-zone/_clock/set_current_utc"

  - name: AgencyOfficer
    description: "Federal flood-mapping agency officer: publishes and revises FIRM panels, runs the appeal / letter-of-final-determination workflow, concurs with or overrides provider dispute recommendations, and decides map amendment requests"
    identity: opaque
    exclusive_operations:
      - "POST /flood-zone/map-panels"
      - "POST /flood-zone/map-panels/{map_panel_id}/appeal-period"
      - "POST /flood-zone/map-panels/{map_panel_id}/appeal-decision"
      - "POST /flood-zone/map-panels/{map_panel_id}/effective"
      - "POST /flood-zone/disputes/{dispute_id}/agency-review"
      - "POST /flood-zone/map-amendment-requests/{map_amendment_request_id}/agency-decision"
    shared_operations:
      - "GET /flood-zone/map-panels/{map_panel_id}/impact-analysis (shared with ProviderAnalyst and ProviderReviewer)"
      - "all GET reads"
      - "POST /flood-zone/_clock/set_current_utc"

  - name: Lender
    description: "Mortgage lender / servicer holding the loan: opens the monitoring folio, reports borrower coverage, and force places insurance. X-User-ID is the Lender row's id, so folio ownership is a direct comparison against LoanFolio.lender_id"
    identity: "entity_backed:Lender"
    exclusive_operations:
      - "POST /flood-zone/loan-folios"
      - "POST /flood-zone/loan-folios/{loan_folio_id}/insurance-reports"
      - "POST /flood-zone/loan-folios/{loan_folio_id}/force-placements"
    shared_operations:
      - "POST /flood-zone/compliance-notices (shared with ProviderAnalyst)"
      - "POST /flood-zone/compliance-notices/{compliance_notice_id}/acknowledgement (shared with Borrower)"
      - "all GET reads except GET /flood-zone/map-panels/{map_panel_id}/impact-analysis"
      - "POST /flood-zone/_clock/set_current_utc"

  - name: Borrower
    description: "Property owner / borrower: disputes a determination and files elevation certificates. Identity is opaque - X-User-ID is matched against LoanFolio.borrower_user_id, which is a plain string field, never a Borrower entity id"
    identity: opaque
    exclusive_operations:
      - "POST /flood-zone/disputes"
    shared_operations:
      - "POST /flood-zone/elevation-certificates (shared with ProviderAnalyst)"
      - "POST /flood-zone/compliance-notices/{compliance_notice_id}/acknowledgement (shared with Lender)"
      - "all GET reads except GET /flood-zone/lenders, GET /flood-zone/lenders/{lender_id} and GET /flood-zone/map-panels/{map_panel_id}/impact-analysis"
      - "POST /flood-zone/_clock/set_current_utc"
