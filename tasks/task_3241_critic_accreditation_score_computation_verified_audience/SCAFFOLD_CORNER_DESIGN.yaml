        claim_type: occ_stale_version
        grounds:
          - concurrency_rules[score-recalc-stale-release]
          - concurrency_rules[dispute-ruling-stale-dispute]
        excluded_because:
          difficulty_instance: validations / stale_release_version_on_score_recalculation_returns_412
          rationale: "Both OCC rules are exercised by the §1.9 validations stale-version instance and the §1.9 endpoints dispute-ruling OCC instance."

      - name: scheduled_deferred_actions_embargo
        claim_type: scheduled_action
        grounds:
          - entities.Release.fields.embargo_until
        excluded_because:
          difficulty_instance: boundary_precision_check / embargo_publish_allowed_at_exact_lift_instant
          rationale: "The deferred publish action and its clock dependency are covered by the named §1.8 instance."

      - name: derived_field_reconciliation_score_pct
        claim_type: derived_field_reconciliation
        grounds:
          - entities.Release.fields.tomatometer_pct
          - calculations.tomatometer_score
        distinguishing_aspect: "Release.tomatometer_pct is a denormalized field reconciled on every source mutation: after publishing one FRESH and one ROTTEN review it reads 50; after WITHDRAW of the ROTTEN review it reads 100 — the derived field tracks the live input set with no stale cache."
        test_recipe:
          setup:
            - "Clock 2026-09-01T00:00:00Z; P1 ACCREDITED; CA, CB ACCREDITED; R1 OPEN, embargo lifted."
          setup_api_calls:
            - *c_clock
            - *c_pub
            - call: "POST /publications/${pub1}/transition"
              payload: { action: "ACCREDIT" }
              as: AccreditationBoard
            - *c_ca
            - call: "POST /critics/${ca}/transition"
              payload: { action: "ACCREDIT" }
              as: AccreditationBoard
            - &c_cb
              call: "POST /critics"
              payload: { full_name: "Critic B", publication_id: "${pub1}", is_top_critic: false }
              as: PlatformAdmin
              captures: { cb: $.data.id }
            - call: "POST /critics/${cb}/transition"
              payload: { action: "ACCREDIT" }
              as: AccreditationBoard
            - *c_title
            - call: "PATCH /titles/${t1}"
              payload: { posture: "OPEN" }
              as: PlatformAdmin
            - *c_rel
            - call: "POST /releases/${r1}/transition"
              payload: { action: "OPEN" }
              as: PlatformAdmin
            - *c_ra
            - call: "POST /reviews/${ra}/transition"
              payload: { action: "PUBLISH" }
              as: Critic
              as_user_id: "${ca}"
            - &c_rb
              call: "POST /releases/${r1}/reviews"
              payload: { critic_id: "${cb}", body_text: "A mess.", self_designation: "ROTTEN" }
              as: Critic
              as_user_id: "${cb}"
              captures: { rb: $.data.id }
            - call: "POST /reviews/${rb}/transition"
              payload: { action: "PUBLISH" }
              as: Critic
              as_user_id: "${cb}"
          trigger:
            - call: "GET /releases/${r1}"
              as: PlatformAdmin
              captures: { pct_mid: $.data.tomatometer_pct }
            - call: "POST /reviews/${rb}/transition"
              payload: { action: "WITHDRAW" }
              as: Critic
              as_user_id: "${cb}"
            - call: "GET /releases/${r1}"
              as: PlatformAdmin
          assert:
            - "after both publishes: Release.${r1}.tomatometer_pct == 50"
            - "after WITHDRAW of the ROTTEN review: Release.${r1}.tomatometer_pct == 100"

