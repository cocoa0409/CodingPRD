  # --- CapitalProject ---------------------------------------------------------
  - method: POST
    path: "/swim-club/capital-projects"
    description: "Propose a capital project (pool resurfacing, pump replacement) against a season's reserve."
    roles: [Treasurer]
    code: 201
    input: [funding_season_id, project_kind, title, budget_cents]
    output: CapitalProject
    side_effects: ["status := PROPOSED", "funded_cents := 0", "requested_by_user_id := X-User-ID"]

  - method: POST
    path: "/swim-club/capital-projects/{id}/transitions"
    description: "Approve, reject, start, complete or cancel a capital project. Approval requires a different user than the proposer; cancellation returns every drawn cent to the reserve."
    roles: [BoardPresident, Treasurer]
    code: 200
    input: [to_status]
    output: CapitalProject
    side_effects: ["status := to_status when the edge is declared in §1.2", "APPROVED records approved_by_user_id", "CANCELLED returns funded_cents to season.reserve_unallocated_cents and zeroes funded_cents, restoring the reserve identity", "season.version += 1", "version += 1"]

  - method: POST
    path: "/swim-club/capital-projects/{id}/fund"
    description: "Draw reserve funds onto an approved project. Carries the OCC guard expected_capital_project_version, because a client working from a stale funded_cents figure would over-draw the reserve."
    roles: [Treasurer]
    code: 200
    input: [draw_amount_cents, expected_capital_project_version]
    output: CapitalProject
    side_effects: ["funded_cents += draw_amount_cents", "status APPROVED -> FUNDED on the first draw", "season.reserve_unallocated_cents -= draw_amount_cents while season.reserve_contributions_cents is untouched", "season.version += 1", "version += 1", "ERR_STALE_PROJECT_VERSION (412) when expected_capital_project_version != version"]

  - method: GET
    path: "/swim-club/capital-projects/{id}"
    description: "Read one capital project, including its funded amount."
    roles: [Treasurer, BoardPresident]
    code: 200
    input: []
    output: CapitalProject
    side_effects: []

  - method: GET
    path: "/swim-club/capital-projects"
    description: "List capital projects, filterable by funding season, kind and status."
    roles: [Treasurer, BoardPresident]
    code: 200
    input: ["funding_season_id?", "project_kind?", "status?", "limit?", "offset?"]
    output: CapitalProject[]
    side_effects: []

  # --- Test-driving endpoint (§1.5 ladder step 3) ------------------------------
  - method: POST
    path: "/swim-club/_clock/set_current_utc"
    description: "Set the server's logical UTC clock, which every deadline, expiry, season-window and lookback rule reads. The clock's startup default is exactly 2026-08-01T00:00:00Z: before any call to this endpoint the logical clock reads that instant and MUST NOT fall back to real wall-clock time. This default sits at or before every fixture date, so an unset clock is a fixed, well-defined earliest instant."
    roles: [SystemOperator]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["the logical clock becomes to_iso8601 for every subsequent request", "no entity is mutated and no derived field is recomputed by this call alone"]

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  # auth
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header missing, empty, or naming a role not declared in §1.7"
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "the acting role is not listed in the endpoint's roles"
  - id: ERR_NOT_RESOURCE_OWNER
    http: 403
    condition: "a Member addresses a household, membership, guest visit, registration, reservation, waitlist entry or conduct case belonging to a different household"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "the deciding user is the same user who created the item under decision (capital-project approval, conduct-case decision, inspection-finding verification)"

  # shape
  - id: ERR_VALIDATION
    http: 422
    condition: "a required field is missing, of the wrong JSON type, negative where a non-negative integer is required, or malformed as a date or ISO-8601 instant"
  - id: ERR_INVALID_ENUM
    http: 422
    condition: "an enum-valued input carries a value outside its declared set"
  - id: ERR_INVALID_TIME_RANGE
    http: 422
    condition: "a start instant or date is not strictly before its paired end"
  - id: ERR_PAGINATION_INVALID
    http: 422
    condition: "limit outside [1, 100] or offset negative"

  # existence
  - id: ERR_SEASON_NOT_FOUND
    http: 404
    condition: "no Season with the given id"
  - id: ERR_CATEGORY_NOT_FOUND
    http: 404
    condition: "no MembershipCategory with the given id"
  - id: ERR_HOUSEHOLD_NOT_FOUND
    http: 404
    condition: "no Household with the given id (including transferred_from_household_id)"
  - id: ERR_WAITLIST_ENTRY_NOT_FOUND
    http: 404
    condition: "no WaitlistEntry with the given id"
  - id: ERR_MEMBERSHIP_NOT_FOUND
    http: 404
    condition: "no Membership with the given id"
  - id: ERR_GUEST_VISIT_NOT_FOUND
    http: 404
    condition: "no GuestVisit with the given id"
  - id: ERR_LIFEGUARD_NOT_FOUND
    http: 404
    condition: "no Lifeguard with the given id"
  - id: ERR_CERTIFICATION_NOT_FOUND
    http: 404
    condition: "no Certification with the given id"
  - id: ERR_GUARD_SHIFT_NOT_FOUND
    http: 404
    condition: "no GuardShift with the given id"
  - id: ERR_REGISTRATION_NOT_FOUND
    http: 404
    condition: "no SwimTeamRegistration with the given id"
  - id: ERR_MEET_NOT_FOUND
    http: 404
    condition: "no Meet with the given id"
  - id: ERR_VOLUNTEER_ASSIGNMENT_NOT_FOUND
    http: 404
    condition: "no VolunteerAssignment with the given id"
  - id: ERR_PARTY_RESERVATION_NOT_FOUND
    http: 404
    condition: "no PartyReservation with the given id"
  - id: ERR_INSPECTION_FINDING_NOT_FOUND
    http: 404
    condition: "no InspectionFinding with the given id"
  - id: ERR_CONDUCT_CASE_NOT_FOUND
    http: 404
    condition: "no ConductCase with the given id"
  - id: ERR_CAPITAL_PROJECT_NOT_FOUND
    http: 404
    condition: "no CapitalProject with the given id"

  # optimistic concurrency
  - id: ERR_STALE_HOUSEHOLD_VERSION
    http: 412
    condition: "expected_household_version on POST /swim-club/guest-visits does not equal the sponsoring household's current version"
  - id: ERR_STALE_PROJECT_VERSION
    http: 412
    condition: "expected_capital_project_version on POST /swim-club/capital-projects/{id}/fund does not equal the project's current version"

  # resource state
  - id: ERR_SEASON_NOT_OPEN
    http: 409
    condition: "the referenced season's status is not OPEN"
  - id: ERR_FACILITY_CLOSED
    http: 409
    condition: "the referenced season's facility_posture is CLOSED because an open CRITICAL inspection finding exists or the season itself is not OPEN"
  - id: ERR_FACILITY_RESTRICTED
    http: 409
    condition: "the facility is RESTRICTED and the request exceeds the restricted envelope: more than 2 guests on a visit, or a WHOLE_FACILITY party booking"
  - id: ERR_INVALID_TRANSITION
    http: 409
    condition: "the requested to_status is not a declared outgoing edge from the resource's current status"
  - id: ERR_ALREADY_TERMINAL
    http: 409
    condition: "the addressed resource has already reached a terminal state for its state machine"
  - id: ERR_HOUSEHOLD_SUSPENDED
    http: 409
    condition: "the acting or referenced household's standing is SUSPENDED or EXPELLED"
  - id: ERR_MEMBERSHIP_NOT_IN_GOOD_STANDING
    http: 409
    condition: "the referenced membership's access_status is not ACTIVE (still PENDING where ACTIVE is required, or SUSPENDED, LAPSED or TERMINATED)"
  - id: ERR_ROSTER_ALREADY_CLOSED
    http: 409
    condition: "the meet's roster_closed_at is already set, so no assignment may be added and the roster cannot be closed twice"
  - id: ERR_OFFER_EXPIRED
    http: 409
    condition: "the waitlist offer's offer_expires_at is earlier than the logical clock"
  - id: ERR_MAX_DEFERRALS_REACHED
    http: 409
    condition: "decision=DECLINE with requeue=true is sent when deferral_count already equals MAX_DEFERRALS (2)"

  # safety and compliance
  - id: ERR_CERT_NOT_VALID_FOR_SHIFT
    http: 422
    condition: "the lifeguard lacks a VALID LIFEGUARD certification or a VALID CPR_AED certification covering the shift's end date"
  - id: ERR_GUARD_RATIO_NOT_MET
    http: 422
    condition: "the confirmed guard count is below the count required by the bather load at the window being confirmed"

  # temporal
  - id: ERR_OUTSIDE_SEASON_WINDOW
    http: 422
    condition: "the operation's date or instant falls outside the referenced season's open_date..close_date window"
  - id: ERR_VISIT_IN_FUTURE
    http: 422
    condition: "visit_start_iso is later than the logical clock"

  # constraint satisfaction
  - id: ERR_SHIFT_REST_BUFFER_VIOLATION
    http: 409
    condition: "the lifeguard has another SCHEDULED or CONFIRMED shift within 30 minutes of the new shift, including a shift that merely touches it end-to-start"
  - id: ERR_ZONE_DOUBLE_BOOKED
    http: 409
    condition: "another REQUESTED or CONFIRMED reservation holds a conflicting zone over an overlapping half-open window"
  - id: ERR_BATHER_CAPACITY_EXCEEDED
    http: 409
    condition: "the aggregate bather load of overlapping reservations plus this one exceeds the season's bather_load_capacity"
  - id: ERR_DUPLICATE_MEMBERSHIP
    http: 409
    condition: "the household already holds a live membership for this season"
  - id: ERR_DUPLICATE_WAITLIST_ENTRY
    http: 409
    condition: "the household already holds a WAITING, OFFERED or ACCEPTED entry for this category"
  - id: ERR_GUEST_LIMIT_EXCEEDED
    http: 422
    condition: "guest_count is below 1 or above MAX_GUESTS_PER_VISIT (6)"
  - id: ERR_HOUSEHOLD_SIZE_EXCEEDED
    http: 422
    condition: "the household's member_count exceeds the category's max_household_size"
  - id: ERR_VOLUNTEER_SLOTS_FULL
    http: 409
    condition: "the new assignment's credit_value would push meet.volunteer_slots_filled above meet.volunteer_slots_required"
  - id: ERR_DUPLICATE_VOLUNTEER_ASSIGNMENT
    http: 409
    condition: "the registration already holds an ASSIGNED or COMPLETED assignment for this meet"
  - id: ERR_SQUAD_FULL
    http: 409
    condition: "a WAITLISTED registration is moved to CONFIRMED while its season+squad already holds SQUAD_CAPACITY[squad] registrations in PENDING, CONFIRMED or COMPLETED"

  # referential
  - id: ERR_WAITLIST_OFFER_REQUIRED
    http: 409
    condition: "a membership is created in a category whose waitlist_required is true without an ACCEPTED waitlist entry for this household and category"
  - id: ERR_CATEGORY_MISMATCH
    http: 422
    condition: "the membership_category_id in the request differs from the category of the waitlist entry being converted"
  - id: ERR_SEASON_MISMATCH
    http: 422
    condition: "two season-scoped references in one request name different seasons"
  - id: ERR_WAITLIST_EMPTY
    http: 409
    condition: "no eligible WAITING entry with a GOOD_STANDING household exists for the requested category"

  # fiscal (checked last)
  - id: ERR_DUES_DELINQUENT
    http: 402
    condition: "the household holds a DELINQUENT or WRITTEN_OFF membership for the season, or owes unpaid guest fees or party charges"
  - id: ERR_BOND_NOT_PAID
    http: 402
    condition: "the household's bond is unsettled (bond_status NONE or INSTALLMENTS with bond_paid_cents below the category's bond_cents) when it tries to reserve the facility for a private party"
  - id: ERR_PAYMENT_EXCEEDS_BALANCE
    http: 422
    condition: "amount_cents exceeds the counter it settles - the membership's balance_due_cents, or the household's guest_fee_owed_cents, party_charges_owed_cents or remaining bond"
  - id: ERR_INSUFFICIENT_RESERVE
    http: 402
    condition: "draw_amount_cents exceeds the season's reserve_unallocated_cents"
  - id: ERR_DRAW_EXCEEDS_BUDGET
    http: 422
    condition: "funded_cents plus draw_amount_cents exceeds the project's budget_cents"

# =============================================================================
# 1.7 RBAC Matrix (segregation of duties)
# =============================================================================
roles:
  - name: Member
    description: "A member household acting for itself: requests waitlist entries, pays dues, records its own guests, registers swimmers, books parties, accepts volunteer jobs and appeals conduct sanctions."
    identity: "entity_backed:Household"
    exclusive_operations:
      - "POST /swim-club/conduct-cases/{id}/transitions to APPEALED (only the charged household may appeal)"
    shared_operations:
      - "POST /swim-club/waitlist-entries"
      - "POST /swim-club/waitlist-entries/{id}/respond"
      - "POST /swim-club/memberships/{id}/payments"
      - "POST /swim-club/households/{id}/payments"
      - "POST /swim-club/guest-visits"
      - "POST /swim-club/swim-team-registrations"
      - "POST /swim-club/volunteer-assignments/{id}/transitions to COMPLETED or NO_SHOW"
      - "POST /swim-club/party-reservations"
      - "POST /swim-club/party-reservations/{id}/transitions to CANCELLED_BY_HOST"
      - "all GET reads scoped to its own household"

  - name: MembershipChair
    description: "Runs the membership book: categories, households, the waitlist and membership creation."
    identity: opaque
    exclusive_operations:
      - "POST /swim-club/membership-categories"
      - "POST /swim-club/households"
      - "POST /swim-club/waitlist-entries/next-offer"
      - "POST /swim-club/memberships"
    shared_operations:
      - "POST /swim-club/waitlist-entries"
      - "POST /swim-club/waitlist-entries/{id}/respond"
      - "GET reads on categories, households, waitlist entries, memberships, guest visits and registrations"

  - name: PoolManager
    description: "Runs the facility day to day: season open/close, lifeguard hiring and certification, shift scheduling, guest visits at the gate, party approvals and conduct reports."
    identity: opaque
    exclusive_operations:
      - "POST /swim-club/seasons/{id}/open"
      - "POST /swim-club/seasons/{id}/close"
      - "POST /swim-club/lifeguards"
      - "POST /swim-club/certifications"
      - "POST /swim-club/certifications/{id}/revoke"
      - "POST /swim-club/guard-shifts"
      - "POST /swim-club/guard-shifts/{id}/transitions"
      - "POST /swim-club/guest-visits/{id}/void"
    shared_operations:
      - "POST /swim-club/guest-visits"
      - "POST /swim-club/party-reservations"
      - "POST /swim-club/party-reservations/{id}/transitions"
      - "POST /swim-club/inspection-findings/{id}/transitions to REMEDIATION_SUBMITTED"
      - "POST /swim-club/conduct-cases"
      - "GET /swim-club/seasons/{id}/staffing-window and the operational GET reads"

  - name: SwimTeamCoach
    description: "Runs the swim team: registrations, squads, meet scheduling, volunteer rostering."
    identity: opaque
    exclusive_operations:
      - "POST /swim-club/swim-team-registrations/{id}/transitions"
      - "POST /swim-club/meets"
      - "POST /swim-club/meets/{id}/close-roster"
      - "POST /swim-club/meets/{id}/transitions"
      - "POST /swim-club/volunteer-assignments"
    shared_operations:
      - "POST /swim-club/swim-team-registrations"
      - "POST /swim-club/volunteer-assignments/{id}/transitions"
      - "GET reads on memberships, registrations, meets and assignments"

  - name: HealthInspector
    description: "The health department's inspector: records findings and is the only role that may verify a remediation as closed."
    identity: opaque
    exclusive_operations:
      - "POST /swim-club/inspection-findings"
      - "POST /swim-club/inspection-findings/{id}/transitions to REOPENED or VERIFIED_CLOSED"
    shared_operations:
      - "GET reads on seasons, lifeguards, certifications, guard shifts, the staffing window and inspection findings"

  - name: Treasurer
    description: "Runs the money: invoicing, payments, write-offs, the billing checkpoint, reserve contributions and capital-project funding."
    identity: opaque
    exclusive_operations:
      - "POST /swim-club/seasons/{id}/billing-runs"
      - "POST /swim-club/seasons/{id}/reserve-contributions"
      - "POST /swim-club/memberships/{id}/invoice"
      - "POST /swim-club/memberships/{id}/write-off"
      - "POST /swim-club/capital-projects"
      - "POST /swim-club/capital-projects/{id}/fund"
    shared_operations:
      - "POST /swim-club/memberships/{id}/payments"
      - "POST /swim-club/households/{id}/payments"
      - "POST /swim-club/capital-projects/{id}/transitions to IN_PROGRESS or COMPLETED"
      - "GET reads on seasons, memberships, guest visits, party reservations, meets and capital projects"

  - name: BoardPresident
    description: "The board's decision maker: creates seasons, decides conduct cases, moves household standing, and approves or cancels capital projects. Never proposes what it decides."
    identity: opaque
    exclusive_operations:
      - "POST /swim-club/seasons"
      - "POST /swim-club/households/{id}/standing-transitions"
      - "POST /swim-club/conduct-cases/{id}/transitions to UNDER_REVIEW, SANCTIONED, DISMISSED or CLOSED"
      - "POST /swim-club/capital-projects/{id}/transitions to APPROVED, REJECTED or CANCELLED"
    shared_operations:
      - "POST /swim-club/conduct-cases"
      - "all GET reads"

  - name: SystemOperator
    description: "Operational identity that exists only to drive the logical clock for deterministic testing. It has no business authority whatsoever."
    identity: opaque
    exclusive_operations:
      - "POST /swim-club/_clock/set_current_utc"
    shared_operations: []
