            - { call: "POST /om/_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T01:00:00Z" }, as: EmergencyDirector }
          trigger:
            - { call: "POST /om/outages/${ot}/etr-revisions", payload: { published_etr: "2026-08-10T05:00:00Z", revision_reason: "CORRECTION", expected_outage_version: "${ot_v}" }, as: Dispatcher, captures: { seq: $.data.revision_seq, prev: $.data.previous_etr } }
            - { call: "GET /om/outages/${ot}", payload: {}, as: Dispatcher, captures: { ot_v2: $.data.version, etr: $.data.current_etr } }
            - { call: "POST /om/outages/${ot}/etr-revisions", payload: { published_etr: "2026-08-10T04:30:00Z", revision_reason: "WEATHER_DELAY", expected_outage_version: "${ot_v2}" }, as: Dispatcher, captures: { err: $.data.error_id } }
          assert:
            - "CORRECTION backward move accepted pre-WORKING: ${seq} == 2, ${prev} == \"2026-08-10T07:00:00Z\", ${etr} == \"2026-08-10T05:00:00Z\""
            - "Same direction without CORRECTION: ${err} == ERR_ETR_BACKWARD_FORBIDDEN"

      - name: fatigue_boundary_960_allowed_961_rejected
        claim_type: constants_applied
        grounds:
          - calculations.crew_fatigue_projection
          - errors[ERR_FATIGUE_LIMIT_EXCEEDED]
        distinguishing_aspect: "Projected continuous work of exactly 960 minutes is allowed; 961 is rejected. Boundary measured on minute-level accumulated work plus the ACCEPTED assessment estimate."
        test_recipe:
          setup:
