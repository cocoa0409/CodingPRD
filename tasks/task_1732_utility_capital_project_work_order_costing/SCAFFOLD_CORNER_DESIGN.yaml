            - { call: "POST /ucp/ciac-agreements", payload: { work_order_id: "${wb}", pledged_cents: 50000, pledge_expiry_at: "2026-12-31T00:00:00Z" }, as: RateAnalyst, as_user_id: rates-1, captures: { cb: $.data.id } }
            - { call: "POST /ucp/ciac-agreements/${cb}/receive", payload: {}, as: RateAnalyst, as_user_id: rates-1 }
          trigger:
            - { call: "POST /ucp/work-orders/${wa}/cancel", payload: {}, as: WorkOrderSupervisor, as_user_id: sup-1 }
            - { call: "POST /ucp/work-orders/${wb}/cancel", payload: { writeoff_disposition: EXPENSE }, as: WorkOrderSupervisor, as_user_id: sup-1 }
            - { call: "GET /ucp/ciac-agreements/${ca}", payload: {}, as: Auditor, captures: { ca_st: $.data.status, ca_ref: $.data.refunded_cents, ca_for: $.data.forfeited_cents } }
            - { call: "GET /ucp/ciac-agreements/${cb}", payload: {}, as: Auditor, captures: { cb_st: $.data.status, cb_ref: $.data.refunded_cents, cb_for: $.data.forfeited_cents } }
