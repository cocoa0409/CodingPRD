  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: inspector_calendar_half_open_overlap
        grounds:
          - validations[priority=9]
          - errors.ERR_INSPECTION_SCHEDULE_OVERLAP
          - endpoints.POST_/registry/inspections
        distinguishing_aspect: "Half-open interval exclusion on the Inspector calendar resource: a new inspection starting exactly at the existing inspection's end is allowed (adjacency, [start,end)), while one starting one minute earlier overlaps and is rejected; a different inspector may hold the same window."
        test_recipe:
          setup:
            - "Logical clock at startup default 2026-09-01T00:00:00Z; Facilities P and Q (both FOREIGN, DE)"
            - "Inspector fi-1 holds a SCHEDULED inspection on P covering [2026-10-10T09:00:00Z, 2026-10-10T17:00:00Z)"
          setup_api_calls:
            - call: "POST /registry/facilities"
              payload: { legal_name: "Bavaria Backerei", facility_kind: "FOREIGN", country_code: "DE", ufi: "UFI-DE-1201" }
              as: FacilityOwner
              captures: { fac_p: $.data.id }
            - call: "POST /registry/facilities"
              payload: { legal_name: "Alpen Kaserei", facility_kind: "FOREIGN", country_code: "DE", ufi: "UFI-DE-1202" }
              as: FacilityOwner
              captures: { fac_q: $.data.id }
            - call: "POST /registry/inspections"
              payload: { facility_id: "${fac_p}", scheduled_start_at: "2026-10-10T09:00:00Z", scheduled_end_at: "2026-10-10T17:00:00Z" }
              as: FieldInspector
              as_user_id: "fi-1"
              captures: { insp_p: $.data.id }
          trigger:
            - call: "POST /registry/inspections"
              payload: { facility_id: "${fac_q}", scheduled_start_at: "2026-10-10T17:00:00Z", scheduled_end_at: "2026-10-11T09:00:00Z" }
              as: FieldInspector
              as_user_id: "fi-1"
              captures: { insp_q: $.data.id }
            - call: "POST /registry/inspections"
              payload: { facility_id: "${fac_q}", scheduled_start_at: "2026-10-10T16:59:00Z", scheduled_end_at: "2026-10-10T18:00:00Z" }
              as: FieldInspector
              as_user_id: "fi-1"
              captures: { err_overlap: $.data.error_id }
            - call: "POST /registry/inspections"
              payload: { facility_id: "${fac_q}", scheduled_start_at: "2026-10-10T16:59:00Z", scheduled_end_at: "2026-10-10T18:00:00Z" }
              as: FieldInspector
              as_user_id: "fi-2"
              captures: { insp_q2: $.data.id }
          assert:
            - "adjacent [17:00, next-day 09:00) after [09:00, 17:00): 201, Inspection.${insp_q}.status == SCHEDULED (half-open semantics allow touching endpoints)"
            - "overlapping [16:59, 18:00) for the same inspector: err_overlap == ERR_INSPECTION_SCHEDULE_OVERLAP (http 409)"
            - "the identical overlapping window for a different inspector fi-2 succeeds: Inspection.${insp_q2}.status == SCHEDULED (the resource is the inspector's calendar, not the facility)"

      - name: lab_daily_aggregate_capacity
        grounds:
          - validations[priority=9]
          - errors.ERR_LAB_CAPACITY_EXCEEDED
          - endpoints.POST_/registry/entries/{id}/record-sample
        distinguishing_aspect: "Aggregate-capacity interval semantics on the Laboratory resource (different resource and different semantics from the inspector's half-open interval exclusion): sample units scheduled for a lab-day sum against daily_sample_capacity — a total exactly equal to capacity passes (<=) and one more unit fails, while the same units on the next UTC day pass."
        test_recipe:
          setup:
            - "Logical clock at 2026-10-01T12:00:00Z; Facility R clean; Importer I12; HIGH-risk entry screened to SAMPLE"
            - "Laboratory LAB-X with daily_sample_capacity 3; 3 units already scheduled on 2026-10-02 (1 + 2)"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-10-01T12:00:00Z" }
              as: PlatformAdmin
            - call: "POST /registry/facilities"
              payload: { legal_name: "Kyoto Shoyu", facility_kind: "FOREIGN", country_code: "JP", ufi: "UFI-JP-1301" }
              as: FacilityOwner
              captures: { fac_r: $.data.id }
            - call: "POST /registry/importers"
              payload: { firm_name: "Pacific Rim Imports", account_code: "IMP-1301" }
              as: PlatformAdmin
              captures: { imp12: $.data.id }
            - call: "POST /registry/laboratories"
              payload: { lab_code: "LAB-X", daily_sample_capacity: 3 }
              as: PlatformAdmin
            - call: "POST /registry/prior-notices"
              payload: { importer_id: "${imp12}", facility_id: "${fac_r}", product_code: "PC-SOY-01", product_risk_class: "HIGH", transport_mode: "VESSEL", arrival_eta: "2026-10-03T12:00:00Z", declared_units: 90, unit_value_cents: 150, port_code: "US-OAK" }
              as: Importer
              as_user_id: "${imp12}"
              captures: { pn_r: $.data.id }
            - call: "POST /registry/entries"
              payload: { prior_notice_id: "${pn_r}" }
              as: Importer
              as_user_id: "${imp12}"
              captures: { ent_r: $.data.id }
            - call: "POST /registry/entries/${ent_r}/screen"
              payload: {}
              as: EntryReviewer
              as_user_id: "er-1"
            - call: "POST /registry/entries/${ent_r}/record-sample"
              payload: { lab_code: "LAB-X", sample_units: 1, analysis_date: "2026-10-02" }
              as: EntryReviewer
              as_user_id: "er-1"
            - call: "POST /registry/entries/${ent_r}/record-sample"
              payload: { lab_code: "LAB-X", sample_units: 2, analysis_date: "2026-10-02" }
              as: EntryReviewer
              as_user_id: "er-1"
          trigger:
            - call: "POST /registry/entries/${ent_r}/record-sample"
              payload: { lab_code: "LAB-X", sample_units: 1, analysis_date: "2026-10-02" }
              as: EntryReviewer
              as_user_id: "er-1"
              captures: { err_cap: $.data.error_id }
            - call: "POST /registry/entries/${ent_r}/record-sample"
              payload: { lab_code: "LAB-X", sample_units: 1, analysis_date: "2026-10-03" }
              as: EntryReviewer
              as_user_id: "er-1"
              captures: { samp_ok: $.data.id }
          assert:
            - "bucket 2026-10-02 at 1 + 2 == capacity 3 passed; the +1 overflow: err_cap == ERR_LAB_CAPACITY_EXCEEDED (http 409) — capacity is inclusive at equality"
            - "the same unit on the next UTC day passes: SampleAnalysis.${samp_ok}.status == SCHEDULED (aggregate per lab-day bucket, not an interval exclusion)"
            - "GET /registry/entries/${ent_r}/samples returns 3 samples"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: entry_units_conserved_through_reconditioning
        grounds:
          - calculations.entry_units_conservation
          - state_machines.ImportEntry
          - endpoints.POST_/registry/entries/{id}/record-reconditioning-outcome
        distinguishing_aspect: "Conserved quantity = per-entry unit total: detention, a bond-bearing reconditioning request, and a split outcome (6 passed / 4 failed) move units between the held/released/destroyed buckets while units_held + units_released + units_refused + units_exported + units_destroyed == declared_units (10) at every step; failed units flip the entry to REFUSED with violation consequences."
        test_recipe:
          setup:
            - "Logical clock at startup default 2026-09-01T00:00:00Z; Facility S (FOREIGN, DE); Importer I13"
            - "Entry with declared_units 10 (unit_value_cents 500) auto-detained by a FIRM alert"
          setup_api_calls:
            - call: "POST /registry/facilities"
              payload: { legal_name: "Galicia Mariscos", facility_kind: "FOREIGN", country_code: "ES", ufi: "UFI-ES-1401" }
              as: FacilityOwner
              captures: { fac_s: $.data.id }
            - call: "POST /registry/importers"
              payload: { firm_name: "Coastal Harvest Trading", account_code: "IMP-1401" }
              as: PlatformAdmin
              captures: { imp13: $.data.id }
            - call: "POST /registry/prior-notices"
              payload: { importer_id: "${imp13}", facility_id: "${fac_s}", product_code: "PC-TUNA-01", product_risk_class: "LOW", transport_mode: "VESSEL", arrival_eta: "2026-09-03T00:00:00Z", declared_units: 10, unit_value_cents: 500, port_code: "US-SAV" }
              as: Importer
              as_user_id: "${imp13}"
              captures: { pn_s: $.data.id }
            - call: "POST /registry/entries"
              payload: { prior_notice_id: "${pn_s}" }
              as: Importer
              as_user_id: "${imp13}"
              captures: { ent_s: $.data.id }
            - call: "POST /registry/import-alerts"
              payload: { scope_type: "FIRM", facility_id: "${fac_s}", reason: "Histamine" }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { alert_s: $.data.id }
          trigger:
            - call: "POST /registry/entries/${ent_s}/request-reconditioning"
              payload: { lots: [ { quantity: 6, unit_value_cents: 500 }, { quantity: 4, unit_value_cents: 500 } ] }
              as: Importer
              as_user_id: "${imp13}"
              captures: { bond_s: $.data.bond_amount_cents, held_mid: $.data.units_held }
            - call: "POST /registry/entries/${ent_s}/record-reconditioning-outcome"
              payload: { units_passed: 6, units_failed: 4 }
              as: ComplianceOfficer
              as_user_id: "co-2"
              captures: { rel_end: $.data.units_released, des_end: $.data.units_destroyed, held_end: $.data.units_held, disp_end: $.data.disposition_status }
          assert:
            - "at detention: units_held == 10 and all other buckets == 0 (10 + 0 + 0 + 0 + 0 == declared_units 10)"
            - "bond_s == 500 (round_half_up(3000 x 0.10) + round_half_up(2000 x 0.10) = 300 + 200; storage 0) and held_mid == 10 (bond request moves no units)"
            - "after split outcome: rel_end == 6, des_end == 4, held_end == 0 — 0 + 6 + 0 + 0 + 4 == 10"
            - "disp_end == REFUSED (any failed unit makes the entry a refusal) and GET /registry/facilities/${fac_s} shows violation_count == 1 and open_detention_count == 0"

      - name: recall_quantities_conserved_through_effectiveness_rounds
        grounds:
          - calculations.recall_quantity_conservation
          - calculations.recall_effectiveness
          - endpoints.POST_/registry/recalls/{id}/record-effectiveness
        distinguishing_aspect: "Conserved quantity = recall distributed total (different conserved quantity from per-entry units): two effectiveness rounds move quantities from outstanding into recovered/corrected/destroyed while recovered + corrected + destroyed + outstanding == quantity_distributed (1000) after every round, with effectiveness_pct rounding to 55.0 then 90.0 (1 decimal, round_half_up)."
        test_recipe:
          setup:
            - "Logical clock at startup default 2026-09-01T00:00:00Z; Facility T (DOMESTIC, US); Recall RC1 for product PC-NUT-01 with quantity_distributed 1000, classified CLASS_III"
          setup_api_calls:
            - call: "POST /registry/facilities"
              payload: { legal_name: "Iowa Nut Roasters", facility_kind: "DOMESTIC", country_code: "US", ufi: "UFI-US-1501" }
              as: FacilityOwner
              captures: { fac_t: $.data.id }
            - call: "POST /registry/recalls"
              payload: { facility_id: "${fac_t}", product_code: "PC-NUT-01", quantity_distributed: 1000 }
              as: RecallCoordinator
              as_user_id: "rc-1"
              captures: { rec_1: $.data.id }
            - call: "POST /registry/recalls/${rec_1}/classify"
              payload: { classification: "CLASS_III" }
              as: RecallCoordinator
              as_user_id: "rc-1"
          trigger:
            - call: "POST /registry/recalls/${rec_1}/record-effectiveness"
              payload: { delta_recovered: 400, delta_corrected: 100, delta_destroyed: 50, consignees_contacted: 8, consignees_total: 10 }
              as: RecallCoordinator
              as_user_id: "rc-1"
              captures: { out_1: $.data.quantity_outstanding, pct_1: $.data.effectiveness_pct, con_1: $.data.consignee_contact_pct }
            - call: "POST /registry/recalls/${rec_1}/record-effectiveness"
              payload: { delta_recovered: 350, delta_corrected: 0, delta_destroyed: 0, consignees_contacted: 2, consignees_total: 10 }
              as: RecallCoordinator
              as_user_id: "rc-1"
              captures: { out_2: $.data.quantity_outstanding, pct_2: $.data.effectiveness_pct, con_2: $.data.consignee_contact_pct }
          assert:
            - "after round 1: recovered 400 + corrected 100 + destroyed 50 + out_1 == 1000 (out_1 == 450)"
            - "pct_1 == 55.0 (round_half_up(100 x 550 / 1000, 1)) and con_1 == 80.0"
            - "after round 2: 750 + 100 + 50 + out_2 == 1000 (out_2 == 100)"
            - "pct_2 == 90.0 and con_2 == 100.0 (consignee deltas accumulate: 8 + 2 == 10 of total 10)"
