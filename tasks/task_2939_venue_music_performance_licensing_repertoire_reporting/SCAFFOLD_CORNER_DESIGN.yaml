            - call: "POST /licensing/license-applications"
              payload: { venue_id: "${v1_id}", society_id: "${bmi_id}", requested_license_type: "PER_PROGRAM", declared_seating: 120, declared_standing: 180, declared_cover_revenue_cents: 4200000, declared_live_nights: 4, declared_music_use_profile: "MIXED", requested_term_start: "2026-08-01T00:00:00Z", expected_venue_version: "${v1_v0}" }
              as: VenueOperator
              as_user_id: "${v1_id}"
              captures: { drop_id: "$.data.id", drop_status0: "$.data.status" }
            - call: "POST /licensing/license-applications/${keep_id}/submit"
              payload: {}
              as: VenueOperator
              as_user_id: "${v1_id}"
              captures: { keep_status: "$.data.status" }
          trigger:
            - call: "POST /licensing/license-applications/${drop_id}/withdraw"
              payload: {}
              as: VenueOperator
              as_user_id: "${v1_id}"
              captures: { drop_status1: "$.data.status" }
            - call: "POST /licensing/license-applications/${keep_id}/withdraw"
              payload: {}
              as: VenueOperator
              as_user_id: "${v1_id}"
              captures: { err_a: "$.data.error_id" }
          assert:
            - "${drop_status0} was DRAFT and ${keep_status} was SUBMITTED, so two applications on the same venue and society coexist as long as no licence is active"
            - "The withdraw on ${drop_id} returned HTTP 200 and ${drop_status1} is WITHDRAWN"
            - "The withdraw on ${keep_id} returned HTTP 409 with data.error_id == ERR_APPLICATION_STATE_INVALID, and ${keep_id} is still SUBMITTED"
            - "A second withdraw on ${drop_id} is also refused with ERR_APPLICATION_STATE_INVALID because WITHDRAWN is terminal"
            - "Withdrawing created no License row: GET /licensing/licenses?application_id=${drop_id} returns total_count == 0"
            - "GET /licensing/license-applications?venue_id=${v1_id} still returns both rows, so withdrawal is a status change and not a delete"

      - name: corner_endpoint_clock_advance_writes_no_rows
        claim_type: action_endpoint
        grounds:
          - endpoints.POST__clock_set_current_utc
          - state_machines.License.ACTIVE_to_EXPIRED
        distinguishing_aspect: "The logical clock is the only source of now, but moving it is not a business event: pushing the clock a year past term_end leaves the licence ACTIVE and the venue's coverage untouched until a business call runs."
        test_recipe:
          setup:
            - "Venue V1's licence L1 is ACTIVE with term [2026-08-01, 2027-08-01) while the logical clock still reads the 2026-08-01T00:00:00Z default"
          setup_api_calls:
            - call: "POST /licensing/societies"
              payload: { society_code: "BMI", display_name: "Broadcast Music Inc", repertoire_share_bp: 4600 }
              as: LicensingAdmin
              captures: { bmi_id: "$.data.id" }
            - call: "POST /licensing/rate-schedules"
              payload: { society_id: "${bmi_id}", venue_category: "BAR_GRILL", effective_from: "2026-01-01T00:00:00Z" }
              as: LicensingAdmin
              captures: { sched_id: "$.data.id" }
            - call: "POST /licensing/rate-schedules/${sched_id}/publish"
              payload: {}
              as: LicensingAdmin
            - call: "POST /licensing/venues"
              payload: { legal_name: "Blue Note Grill", venue_category: "BAR_GRILL", seating_capacity: 120, standing_capacity: 180, occupancy_limit: 200, music_use_profile: "MIXED", weekly_live_performance_nights: 4, annual_cover_revenue_cents: 4200000 }
              as: LicensingAdmin
              captures: { v1_id: "$.data.id", v1_v0: "$.data.version" }
            - call: "POST /licensing/license-applications"
              payload: { venue_id: "${v1_id}", society_id: "${bmi_id}", requested_license_type: "BLANKET", declared_seating: 120, declared_standing: 180, declared_cover_revenue_cents: 4200000, declared_live_nights: 4, declared_music_use_profile: "MIXED", requested_term_start: "2026-08-01T00:00:00Z", expected_venue_version: "${v1_v0}" }
              as: VenueOperator
              as_user_id: "${v1_id}"
              captures: { app1_id: "$.data.id" }
            - call: "POST /licensing/license-applications/${app1_id}/submit"
              payload: {}
              as: VenueOperator
              as_user_id: "${v1_id}"
            - call: "POST /licensing/license-applications/${app1_id}/review"
              payload: { disposition: "ACCEPT_FOR_REVIEW" }
              as: LicensingAdmin
            - call: "POST /licensing/license-applications/${app1_id}/review"
              payload: { disposition: "APPROVE" }
              as: LicensingAdmin
            - call: "GET /licensing/licenses"
              payload: { application_id: "${app1_id}" }
              as: LicensingAdmin
              captures: { lic1_id: "$.data[0].id" }
            - call: "POST /licensing/licenses/${lic1_id}/activate"
              payload: {}
              as: LicensingAdmin
              captures: { lic1_ver: "$.data.version", lic1_fee: "$.data.annual_fee_cents" }
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2027-09-01T00:00:00Z" }
              as: LicensingAdmin
            - call: "GET /licensing/licenses/${lic1_id}"
              payload: {}
              as: LicensingAdmin
              captures: { after_status: "$.data.coverage_status", after_ver: "$.data.version" }
            - call: "GET /licensing/venues/${v1_id}"
              payload: {}
              as: LicensingAdmin
              captures: { after_share: "$.data.covered_share_bp" }
          assert:
            - "The clock call returned HTTP 200 with a null data payload and wrote no row"
            - "${after_status} is still ACTIVE even though the clock now reads 2027-09-01T00:00:00Z, a month past term_end 2027-08-01T00:00:00Z"
            - "${after_ver} equals the ${lic1_ver} captured at activation, so no version was consumed by the clock move"
            - "${after_share} is still 4600 and Venue.${v1_id}.coverage_posture is still PARTIALLY_COVERED"
            - "The two reads did not mutate anything either: repeating them returns identical versions"
            - "Only a business call observes the new instant: a renew issued now still succeeds, and the ACTIVE -> EXPIRED transition happens on the successor's activation, not on the clock move"

      - name: corner_endpoint_publish_side_effects_supersede_and_repin
        claim_type: action_endpoint
        grounds:
          - endpoints.POST_licensing_rate_schedules_id_publish
        excluded_because:
          difficulty_instance: transitive_cascade / cascade_a_rate_publish_supersede_repin_trueup_ledger
          rationale: "Every declared side effect of publish, from superseding the incumbent to the true-up assessment, is asserted end-to-end by that §1.8 instance."

      - name: corner_endpoint_report_submit_side_effects_match_and_escalate
        claim_type: action_endpoint
