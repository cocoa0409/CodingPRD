              as_user_id: "${id_fc_a}"
            - call: "GET /alerts/coordination-requests"
              payload: { product_id: "${id_w}" }
              as: Forecaster
              as_user_id: "${id_fc_a}"
              captures: { id_req: "$.data[0].id" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T09:01:00Z" }
