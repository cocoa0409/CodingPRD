      - name: validation_link_confirmation_requires_a_banned_match
        claim_type: cross_entity_validation
        grounds:
          - "validations.priority_100 (ERR_LINK_MATCH_NOT_BANNED)"
          - "state_machines.RelatedAccountLink.transitions"
          - "entities.RelatedAccountLink.fields.matched_seller_state_at_detection"
        distinguishing_aspect: |
          A SUSPENDED incumbent is enough to raise the registration risk flag (score 0.80 >=
          RELATED_LINK_WATCH_SCORE and the state is in {BANNED, SUSPENDED}) but NOT enough to
          confirm the link: confirmation reads matched_seller_state_at_detection, which must be
          exactly BANNED. Dismissing the link instead clears the flag and unwinds both dimensions —
          WATCHLIST back to ACTIVE and RESERVE_HELD back to NORMAL — because no other link points at
          the candidate.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00.000Z."
            - "PolicyRule SP-LINK-1 (SHIPPING_PERFORMANCE, base 8.00, ACCOUNT, requires_poa false)."
            - "Incumbent A is suspended through an ACCOUNT_SUSPENSION override, so enforcement_state is SUSPENDED (not BANNED)."
            - "Candidate B registers sharing A's tax_id_hash (0.35) and payout_bank_token (0.45) -> 0.80; the email domains differ and no device fingerprint is supplied."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00.000Z" }
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "POST /policy-rules"
              payload: { code: "SP-LINK-1", category: "SHIPPING_PERFORMANCE", base_severity_weight: 8.00, removal_scope: "ACCOUNT", requires_poa: false }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { rule_sp: $.data.id }
            - call: "POST /sellers"
              payload: { legal_name: "Harbor Tools LLC", email: "ops@harbor-tools.example", tax_id_hash: "TAX-SHARED", payout_bank_token: "BANK-SHARED", address_fingerprint: "ADDR-HT-0001" }
              as: Anonymous
              captures: { s_a: $.data.id }
            - call: "POST /violations"
              payload: { seller_id: "${s_a}", policy_rule_id: "${rule_sp}", reporter_type: "PLATFORM_AUTOMATION", evidence_reference: "EV-LINK-0001" }
              as: PolicyInvestigator
              as_user_id: "inv-1"
              captures: { v_a: $.data.id }
            - call: "POST /violations/${v_a}/open-investigation"
              payload: {}
              as: PolicyInvestigator
              as_user_id: "inv-1"
            - call: "POST /violations/${v_a}/adjudicate"
              payload: { outcome: "SUBSTANTIATED" }
              as: PolicyInvestigator
              as_user_id: "inv-1"
            - call: "POST /enforcement-actions"
              payload: { violation_id: "${v_a}", action_type_override: "ACCOUNT_SUSPENSION" }
              as: PolicyInvestigator
              as_user_id: "inv-1"
              captures: { a_a: $.data.id }
            - call: "POST /sellers"
              payload: { legal_name: "Beacon Hardware LLC", email: "ops@beacon-hardware.example", tax_id_hash: "TAX-SHARED", payout_bank_token: "BANK-SHARED", address_fingerprint: "ADDR-BH-0001" }
              as: Anonymous
              captures: { s_b: $.data.id, b_flag: $.data.registration_risk_flag, b_root: $.data.root_seller_id }
            - call: "GET /related-account-links"
              payload: { candidate_seller_id: "${s_b}" }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { link_id: "$.data[0].id", link_score: "$.data[0].confidence_score", link_state_at: "$.data[0].matched_seller_state_at_detection" }
          trigger:
            - call: "POST /related-account-links/${link_id}/adjudicate"
              payload: { decision: "CONFIRMED", adjudication_note: "Shared tax id and payout token with a suspended account." }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { err_code: $.data.error_id }
            - call: "POST /related-account-links/${link_id}/adjudicate"
              payload: { decision: "DISMISSED", adjudication_note: "The shared payout token belongs to a legitimate shared factoring provider." }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { link_state: $.data.state }
          assert:
            - "Seller.${s_a}.enforcement_state == SUSPENDED and ban_reason == null"
            - "${link_score} == 0.80 and ${link_state_at} == SUSPENDED"
            - "${b_flag} == true and ${b_root} == ${s_a}   # the top link scores >= RELATED_LINK_WATCH_SCORE against a SUSPENDED account"
            - "before adjudication: Seller.${s_b}.enforcement_state == WATCHLIST and disbursement_state == RESERVE_HELD"
            - "first call: HTTP 422 and ${err_code} == ERR_LINK_MATCH_NOT_BANNED   # SUSPENDED is not BANNED"
            - "after the refusal RelatedAccountLink.${link_id}.state is still DETECTED and Seller.${s_b}.enforcement_state is still WATCHLIST"
            - "second call: HTTP 200 and ${link_state} == DISMISSED"
            - "Seller.${s_b}.registration_risk_flag == false"
            - "Seller.${s_b}.enforcement_state == ACTIVE   # balance is 0.00 and the flag is gone"
            - "Seller.${s_b}.disbursement_state == NORMAL   # the relaxation propagates in the pinned order"
            - "Seller.${s_b}.ban_reason == null and Seller.${s_a}.enforcement_state == SUSPENDED"

      - name: validation_restricted_product_removal_is_permanent
        claim_type: violation_to_error
        grounds:
          - "validations.priority_100 (ERR_LISTING_RESTRICTED_NO_RELIST)"
          - "entities.Listing.fields.removal_policy_category"
          - "calculations.enforcement_ladder_rung.formula (RESTRICTED_PRODUCT floor)"
        distinguishing_aspect: |
          The RESTRICTED_PRODUCT floor turns a 2.00-point action — which would otherwise be a bare
          WARNING — into a LISTING_REMOVAL, and the removed listing records
          removal_policy_category RESTRICTED_PRODUCT. The seller is only WATCHLIST, so the
          seller-state gate is satisfied and the relist is still refused: the ban is attached to the
          listing's removal category, permanently.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00.000Z."
            - "PolicyRule RP-1 (RESTRICTED_PRODUCT, base 2.00, removal_scope LISTING, requires_poa false)."
            - "One seller with listing L (restricted_flag true), violation citing L carried to SUBSTANTIATED."
            - "prior_balance 0.00 + 2.00 = 2.00 -> rung WARNING, lifted to LISTING_REMOVAL by the category floor; the seller lands on WATCHLIST."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00.000Z" }
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "POST /policy-rules"
              payload: { code: "RP-1", category: "RESTRICTED_PRODUCT", base_severity_weight: 2.00, removal_scope: "LISTING", requires_poa: false }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { rule_rp: $.data.id }
            - call: "POST /sellers"
              payload: { legal_name: "Harbor Tools LLC", email: "ops@harbor-tools.example", tax_id_hash: "TAX-HT-0001", payout_bank_token: "BANK-HT-0001", address_fingerprint: "ADDR-HT-0001" }
              as: Anonymous
              captures: { s_id: $.data.id }
            - call: "POST /listings"
              payload: { seller_id: "${s_id}", sku: "HT-SKU-777", title: "Air rifle scope mount", category_code: "OUTDOOR-RESTRICTED", restricted_flag: true }
              as: Seller
              as_user_id: "${s_id}"
              captures: { l1: $.data.id }
            - call: "POST /violations"
              payload: { seller_id: "${s_id}", policy_rule_id: "${rule_rp}", listing_id: "${l1}", reporter_type: "PLATFORM_AUTOMATION", evidence_reference: "EV-RP-0001" }
              as: PolicyInvestigator
              as_user_id: "inv-1"
              captures: { v1: $.data.id }
            - call: "POST /violations/${v1}/open-investigation"
              payload: {}
              as: PolicyInvestigator
              as_user_id: "inv-1"
            - call: "POST /violations/${v1}/adjudicate"
              payload: { outcome: "SUBSTANTIATED" }
              as: PolicyInvestigator
              as_user_id: "inv-1"
            - call: "POST /enforcement-actions"
              payload: { violation_id: "${v1}" }
              as: PolicyInvestigator
              as_user_id: "inv-1"
              captures: { a1: $.data.id, a1_rung: $.data.ladder_rung_computed, a1_type: $.data.action_type }
          trigger:
            - call: "POST /listings/${l1}/relist"
