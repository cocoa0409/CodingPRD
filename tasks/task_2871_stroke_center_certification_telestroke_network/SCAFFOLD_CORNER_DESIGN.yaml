  - name: an_agreement_needs_two_distinct_centers_and_a_hub_primary_hub
    claim_type: violation_to_error
    grounds:
    - validations priority 62 -> ERR_SPOKE_AGREEMENT_SELF_PAIR (409)
    - entities.SpokeAgreement.hub_center_id
    distinguishing_aspect: 'One error covers two clauses: hub != spoke AND the hub must be facility_type HUB_PRIMARY. The second clause is the interesting one — naming the SPOKE as hub and the HUB as spoke is two DISTINCT centres, so a naive equality-only check would accept an inverted agreement.'
