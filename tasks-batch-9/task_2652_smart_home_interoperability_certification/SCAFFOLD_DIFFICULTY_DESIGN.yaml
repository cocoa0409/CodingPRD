  - rule_id: compensating_invariant
    instances:
      - name: credit_escrow_round_trips_through_withdraw_reject_and_consumption
        grounds:
          - calculations.member_credit_ledger
          - state_machines[CertificationSubmission#state].transitions[*->WITHDRAWN]
          - state_machines[CertificationSubmission#state].transitions[IN_REVIEW->REJECTED]
          - endpoints[GET /members/{member_id}/credit-ledger]
        distinguishing_aspect: |
          CONSERVED QUANTITY 1 - MONEY. The identity
          credits_purchased_cents == credit_balance_cents + credits_consumed_cents +
          escrowed_credit_cents must hold, to the cent, after every one of three different escrow exits:
          a member-driven withdraw (release), a reviewer-driven REJECT (release), and a credential
          issuance (consumption). credits_purchased_cents never moves after the two purchases, so any
          drift anywhere in the chain shows up as a broken sum. The final proof of exactness is that the
          released money is spendable again: a fourth submission escrows 150000 that only exists because
          the first two releases were exact.
        test_recipe:
          setup:
            - "One RATIFIED SB1 specification with LIGHTING feature sets CORE_ONOFF (MANDATORY 20), CORE_DIM (MANDATORY 10), OPT_SCENE (OPTIONAL 8), OPT_COLOR (OPTIONAL 6)."
            - "One ADOPTER Member in good standing funded by TWO purchases, 600000 and 400000, so credits_purchased_cents is 1000000 and never changes again."
            - "One AUTHORIZED TestLaboratory with bench_capacity 2."
            - "Four submissions, all LIGHTING/STANDARD: SUB1 declares 2 codes (fee 150000), SUB2 declares 3 codes (fee 165000), SUB3 declares 4 codes (fee 180000), SUB4 declares 2 codes (fee 150000). SUB1, SUB2 and SUB3 are submitted; SUB4 is left in DRAFT."
