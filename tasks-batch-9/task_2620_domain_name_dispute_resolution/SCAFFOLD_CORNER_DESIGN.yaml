              captures: { err_400: "$.data.error_id", msg_400: "$.data.message" }
            - call: "POST /udrp/panelists"
              payload: { full_name: "Oliver Grant", nationality_code: "GB", roster_admitted_at: "2018-01-01T00:00:00Z" }
              as: CaseManager
              as_user_id: "cm-001"
              captures: { err_403: "$.data.error_id", msg_403: "$.data.message" }
            - call: "GET /udrp/cases/00000000-0000-0000-0000-0000000000fc"
              payload: {}
              as: CaseManager
              as_user_id: "cm-001"
              captures: { err_404: "$.data.error_id", msg_404: "$.data.message" }
            - call: "POST /udrp/domains"
              payload: { domain_name: "envelope.example", registrar_id: "${reg_id}", registrant_name_public: "Second Filing", registrant_email_public: "env2@proxy.example", registration_date: "2021-01-01T00:00:00Z", expiry_date: "2028-01-01T00:00:00Z" }
              as: ProviderAdmin
              captures: { err_409: "$.data.error_id", msg_409: "$.data.message" }
            - call: "GET /udrp/domains"
              payload: { registrar_id: "${reg_id}" }
              as: ProviderAdmin
              captures: { dom_total: "$.meta.total_count", dom_row_name: "$.data[0].domain_name" }
          assert:
            - "The complainant creation without email returns HTTP 400 with data.error_id == 'ERR_INVALID_REQUEST' and a non-empty data.message"
            - "A CaseManager calling the ProviderAdmin-only panelist creation returns HTTP 403 with data.error_id == 'ERR_UNAUTHORIZED' and a non-empty data.message"
            - "The fabricated case read returns HTTP 404 with data.error_id == 'ERR_CASE_NOT_FOUND' and a non-empty data.message"
            - "Re-registering envelope.example returns HTTP 409 with data.error_id == 'ERR_DUPLICATE_DOMAIN_NAME' and a non-empty data.message"
            - "All four responses carry response_type 'error', a meta object with api_request_id and api_request_timestamp, and a data object whose only keys are error_id and message - no entity fields and no null id"
            - "GET /udrp/domains?registrar_id=${reg_id} still reports meta.total_count 1 with data[0].domain_name == 'envelope.example', so not one of the four refusals wrote a row"

  - section: rbac
    note: |
      Role claims for a segregation_of_duties model whose three party roles are peer roles with
      three different identity mechanisms: foreign key (Complainant, Panelist), per-request payload
      proof (Respondent) and opaque operator id (ProviderAdmin, CaseManager).
    instances:
      - name: absent_headers_and_an_undeclared_role_are_refused_before_any_lookup
        claim_type: violation_to_error
        grounds:
          - validations[priority=10].ERR_UNAUTHENTICATED
          - validations[priority=30].ERR_CASE_NOT_FOUND
          - roles
        distinguishing_aspect: "Priority 10 is the first rung of the ladder, so a request with no X-User-Role, a request with no X-User-ID and a request naming a role that is not in the six declared roles all fail identically - and they keep failing that way even when the path also names a case that does not exist, which would otherwise be a 404."
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z; registrar IANA-9036; domain auth.example; complainant Auth Ltd (country_code GB); one case at FILED."
          setup_api_calls:
            - call: "POST /udrp/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ProviderAdmin
            - call: "POST /udrp/registrars"
              payload: { name: "Auth Registrar", iana_id: "IANA-9036", contact_email: "abuse@authreg.example", verification_response_hours: 48 }
              as: ProviderAdmin
              captures: { reg_id: "$.data.id" }
            - call: "POST /udrp/domains"
              payload: { domain_name: "auth.example", registrar_id: "${reg_id}", registrant_name_public: "Auth Holder", registrant_email_public: "auth@proxy.example", registration_date: "2020-01-01T00:00:00Z", expiry_date: "2027-01-01T00:00:00Z" }
              as: ProviderAdmin
              captures: { dom_id: "$.data.id" }
            - call: "POST /udrp/complainants"
              payload: { legal_name: "Auth Ltd", country_code: "GB", email: "ip@auth.example" }
              as: CaseManager
              as_user_id: "cm-001"
              captures: { cpl_id: "$.data.id" }
            - call: "POST /udrp/cases"
              payload: { complainant_id: "${cpl_id}", domain_id: "${dom_id}", mutual_jurisdiction: "US", remedy_requested: "TRANSFER", panel_election: "SINGLE" }
              as: Complainant
              as_user_id: "${cpl_id}"
              captures: { case_id: "$.data.id" }
          trigger:
            - call: "GET /udrp/cases/${case_id}"
              payload: {}
              as: "(no X-User-Role header)"
              as_user_id: "cm-001"
              captures: { err_no_role: "$.data.error_id" }
            - call: "GET /udrp/cases/${case_id}"
              payload: {}
              as: CaseManager
              as_user_id: "(no X-User-ID header)"
              captures: { err_no_id: "$.data.error_id" }
            - call: "GET /udrp/cases/${case_id}"
              payload: {}
              as: "Registrar"
              as_user_id: "${reg_id}"
              captures: { err_bad_role: "$.data.error_id" }
            - call: "GET /udrp/cases/00000000-0000-0000-0000-0000000000fb"
              payload: {}
              as: "(no X-User-Role header)"
              as_user_id: "cm-001"
              captures: { err_ladder: "$.data.error_id" }
            - call: "GET /udrp/cases/${case_id}"
              payload: {}
              as: CaseManager
              as_user_id: "cm-001"
              captures: { case_status: "$.data.status" }
          assert:
            - "The request with no X-User-Role header returns HTTP 401 with data.error_id == 'ERR_UNAUTHENTICATED'"
            - "The request with no X-User-ID header returns HTTP 401 with data.error_id == 'ERR_UNAUTHENTICATED', even though the role name is a declared role"
            - "The request naming the undeclared role 'Registrar' returns HTTP 401 with data.error_id == 'ERR_UNAUTHENTICATED' - the six declared roles are the whole vocabulary, and RegistrarAgent is not spelled Registrar"
            - "The header-less request against a fabricated case id also returns HTTP 401 with data.error_id == 'ERR_UNAUTHENTICATED', not the 404 that priority 30 would give, because 10 is checked first"
            - "The same read with both headers present returns HTTP 200 with the case at FILED"

      - name: peer_roles_cannot_reach_each_others_exclusive_operations
        claim_type: violation_to_error
        grounds:
          - validations[priority=20].ERR_UNAUTHORIZED
          - roles.Respondent.exclusive_operations
          - roles.CaseManager.exclusive_operations
          - roles.ProviderAdmin.exclusive_operations
        distinguishing_aspect: "The provider side is split so that no single role can run a case end to end: the CaseManager cannot admit panelists, the ProviderAdmin cannot issue deficiency notices, and the three party roles cannot touch each other's surfaces. Priority 20 also outranks existence, so a wrong role against a fabricated case id is a 403 and not a 404."
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z; registrar IANA-9037; domain unauth.example; complainant Unauth Ltd (country_code GB); one case at FILED."
          setup_api_calls:
            - call: "POST /udrp/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ProviderAdmin
            - call: "POST /udrp/registrars"
              payload: { name: "Unauth Registrar", iana_id: "IANA-9037", contact_email: "abuse@unauthreg.example", verification_response_hours: 48 }
              as: ProviderAdmin
              captures: { reg_id: "$.data.id" }
            - call: "POST /udrp/domains"
              payload: { domain_name: "unauth.example", registrar_id: "${reg_id}", registrant_name_public: "Unauth Holder", registrant_email_public: "unauth@proxy.example", registration_date: "2020-01-01T00:00:00Z", expiry_date: "2027-01-01T00:00:00Z" }
              as: ProviderAdmin
              captures: { dom_id: "$.data.id" }
            - call: "POST /udrp/complainants"
              payload: { legal_name: "Unauth Ltd", country_code: "GB", email: "ip@unauth.example" }
              as: CaseManager
              as_user_id: "cm-001"
              captures: { cpl_id: "$.data.id" }
            - call: "POST /udrp/cases"
              payload: { complainant_id: "${cpl_id}", domain_id: "${dom_id}", mutual_jurisdiction: "US", remedy_requested: "TRANSFER", panel_election: "SINGLE" }
              as: Complainant
              as_user_id: "${cpl_id}"
              captures: { case_id: "$.data.id" }
          trigger:
            - call: "POST /udrp/cases/${case_id}/responses"
              payload: { respondent_email: "unauth@proxy.example", content_summary: "The complainant tries to file the respondent's own answer.", requests_three_member_panel: false }
              as: Complainant
              as_user_id: "${cpl_id}"
              captures: { err_cpl_response: "$.data.error_id" }
            - call: "POST /udrp/cases/${case_id}/compliance-clearance"
              payload: { reviewer_notes: "Respondent clearing its own case." }
              as: Respondent
              as_user_id: "resp-001"
              captures: { err_resp_clearance: "$.data.error_id" }
            - call: "POST /udrp/panelists"
              payload: { full_name: "Oliver Grant", nationality_code: "GB", roster_admitted_at: "2018-01-01T00:00:00Z" }
              as: CaseManager
              as_user_id: "cm-001"
              captures: { err_cm_panelist: "$.data.error_id" }
            - call: "POST /udrp/cases/${case_id}/deficiency-notices"
              payload: { deficiency_codes: ["MISSING_GROUND"], correction_days: 5 }
              as: ProviderAdmin
              captures: { err_admin_notice: "$.data.error_id" }
            - call: "GET /udrp/cases"
              payload: { status: "FILED" }
              as: Respondent
              as_user_id: "resp-001"
              captures: { err_resp_list: "$.data.error_id" }
            - call: "POST /udrp/cases/00000000-0000-0000-0000-0000000000fa/compliance-clearance"
              payload: { reviewer_notes: "Wrong role against a case that does not exist." }
              as: Respondent
              as_user_id: "resp-001"
              captures: { err_ladder: "$.data.error_id" }
            - call: "GET /udrp/cases/${case_id}"
              payload: {}
              as: CaseManager
              as_user_id: "cm-001"
              captures: { case_status: "$.data.status", case_version: "$.data.version" }
          assert:
            - "A Complainant filing the response returns HTTP 403 with data.error_id == 'ERR_UNAUTHORIZED' - responses are the Respondent's exclusive operation"
            - "A Respondent clearing compliance returns HTTP 403 with data.error_id == 'ERR_UNAUTHORIZED'"
            - "A CaseManager admitting a panelist returns HTTP 403 with data.error_id == 'ERR_UNAUTHORIZED' - roster admission is ProviderAdmin-exclusive"
            - "A ProviderAdmin issuing a deficiency notice returns HTTP 403 with data.error_id == 'ERR_UNAUTHORIZED' - notices are CaseManager-exclusive, which is what keeps the provider-side duties segregated"
            - "A Respondent calling the case list returns HTTP 403 with data.error_id == 'ERR_UNAUTHORIZED', because the list endpoint is provider-side only while GET /udrp/cases/{id} is shared"
            - "A Respondent clearing a fabricated case returns HTTP 403 with data.error_id == 'ERR_UNAUTHORIZED', not 404, because priority 20 precedes priority 30"
            - "Case.${case_id} is still FILED with an unchanged version and no DeficiencyNotice, Response or clearance row exists"

      - name: complainant_ownership_is_checked_before_the_body_is_validated
        claim_type: violation_to_error
        grounds:
          - validations[priority=25].ERR_NOT_OWNER
          - validations[priority=38].ERR_INVALID_REQUEST
          - roles.Complainant.ownership_rule
        distinguishing_aspect: "Two complainants exist and only one owns the case. The stranger is refused with ERR_NOT_OWNER at priority 25 even when its body is also malformed, so 25 masks 38; a CaseManager on the same endpoint is subject to no ownership rule at all, because only the Complainant role carries one."
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z; registrar IANA-9038; domain owner.example; complainants Owner Ltd and Stranger Ltd (both country_code GB); one case filed by Owner Ltd."
          setup_api_calls:
            - call: "POST /udrp/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ProviderAdmin
