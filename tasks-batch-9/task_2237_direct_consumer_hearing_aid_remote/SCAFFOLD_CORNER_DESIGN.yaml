            - { call: "POST /inventory-pools", payload: { sku: "NEO-S-OPEN", model: "NEO", dome_size: "S", tip_type: "OPEN" }, as: PlatformAdmin, captures: { pool_so: "$.data.id" } }
            - { call: "POST /inventory-pools/${pool_mo}/restock", payload: { units: 5 }, as: PlatformAdmin }
            - { call: "POST /inventory-pools/${pool_lo}/restock", payload: { units: 5 }, as: PlatformAdmin }
            - { call: "POST /inventory-pools/${pool_so}/restock", payload: { units: 5 }, as: PlatformAdmin }
            - { call: "POST /devices", payload: { serial_number: "SN-L002", model: "NEO", firmware_version: "4.0.0" }, as: PlatformAdmin }
            - { call: "POST /patients", payload: { state_policy_id: "${pol_ca}", email: "l2@x.test", full_name: "L Two", age_years: 70 }, as: CareOpsAgent, captures: { pat_l2: "$.data.id" } }
