scaffold_corner_design:
  - section: entities
    instances:
      - name: owner_create_returns_201_with_defaults_applied
        claim_type: Creation
        grounds: ["entities.Owner", "endpoints.POST /property-care/owners"]
        distinguishing_aspect: "POST /property-care/owners with only the four required fields returns 201, status ACTIVE, snowbird_flag false, notification_preference EMAIL, approval_ceiling_override_cents null, lifetime_credit_balance_cents 0 and version 1."
        test_recipe:
          setup: ["Empty database with the logical clock pinned."]
          setup_api_calls:
            - call: "POST /property-care/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /property-care/owners"
              payload: { full_name: "Ann Base", email: "ann.base@example.com", phone: "+15550200", primary_residence_state: "MN" }
              as: PlatformAdmin
              captures: { owner_id: $.data.id }
          assert:
            - "HTTP status == 201"
            - "Owner.${owner_id}.status == ACTIVE"
            - "Owner.${owner_id}.snowbird_flag == false"
            - "Owner.${owner_id}.notification_preference == EMAIL"
            - "Owner.${owner_id}.approval_ceiling_override_cents == null"
            - "Owner.${owner_id}.lifetime_credit_balance_cents == 0"
            - "Owner.${owner_id}.version == 1"

      - name: owner_retrieval_returns_stored_row
        claim_type: Retrieval
        grounds: ["entities.Owner", "endpoints.GET /property-care/owners/{id}"]
        distinguishing_aspect: "GET /property-care/owners/{id} echoes exactly the stored full_name, email and primary_residence_state and the server-minted id is a bare UUID with no type prefix."
        test_recipe:
          setup: ["One Owner row."]
          setup_api_calls:
            - call: "POST /property-care/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /property-care/owners"
              payload: { full_name: "Ben Read", email: "ben.read@example.com", phone: "+15550201", primary_residence_state: "WI" }
              as: PlatformAdmin
              captures: { owner_id: $.data.id }
          trigger:
            - call: "GET /property-care/owners/${owner_id}"
              payload: {}
              as: Auditor
          assert:
            - "HTTP status == 200"
            - "data.full_name == Ben Read and data.email == ben.read@example.com"
            - "data.id == ${owner_id} and it contains no prefix before the UUID"
            - "response_type == object"

      - name: property_listing_paginates_with_total_count_and_has_more
        claim_type: Listing
        grounds: ["entities.Property", "endpoints.GET /property-care/properties", "response_envelope.pagination_fields"]
        distinguishing_aspect: "GET /property-care/properties with limit 2 and offset 0 over three properties returns exactly 2 rows, total_count 3 and has_more true; offset 2 returns 1 row and has_more false."
        test_recipe:
          setup: ["One Owner with three Properties."]
          setup_api_calls:
            - call: "POST /property-care/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /property-care/owners"
              payload: { full_name: "Cal List", email: "cal.list@example.com", phone: "+15550202", primary_residence_state: "IL" }
              as: PlatformAdmin
              captures: { owner_id: $.data.id }
            - call: "POST /property-care/properties"
              payload: { owner_id: "${owner_id}", label: "P1", address_line: "1 A St", state_code: "FL", travel_distance_miles: 5.0 }
              as: PlatformAdmin
            - call: "POST /property-care/properties"
              payload: { owner_id: "${owner_id}", label: "P2", address_line: "2 A St", state_code: "FL", travel_distance_miles: 15.0 }
              as: PlatformAdmin
            - call: "POST /property-care/properties"
              payload: { owner_id: "${owner_id}", label: "P3", address_line: "3 A St", state_code: "FL", travel_distance_miles: 30.0 }
              as: PlatformAdmin
          trigger:
            - call: "GET /property-care/properties"
              payload: { owner_id: "${owner_id}", limit: 2, offset: 0 }
              as: Auditor
          assert:
            - "HTTP status == 200 and response_type == array"
            - "len(data) == 2"
            - "meta or envelope reports total_count == 3 and has_more == true"

      - name: property_get_with_unknown_uuid_not_found
        claim_type: Not Found
        grounds: ["entities.Property", "errors[ERR_RESOURCE_NOT_FOUND]", "validations[priority=7]"]
        distinguishing_aspect: "GET /property-care/properties/{id} with a well-formed UUID that names no row returns 404 ERR_RESOURCE_NOT_FOUND, not an empty 200."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls:
            - call: "POST /property-care/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "GET /property-care/properties/00000000-0000-4000-8000-0000000000ff"
              payload: {}
              as: Auditor
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 404"
            - "data.error_id == ERR_RESOURCE_NOT_FOUND"

      - name: service_plan_create_missing_required_field_returns_400
        claim_type: Required Fields
        grounds: ["entities.ServicePlan", "validations[priority=59]", "errors[ERR_MISSING_REQUIRED_FIELD]"]
        distinguishing_aspect: "POST /property-care/service-plans without included_visit_units returns 400 ERR_MISSING_REQUIRED_FIELD and creates no row."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls:
            - call: "POST /property-care/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /property-care/service-plans"
              payload: { tier: "BASIC", monthly_fee_cents: 9986, covered_visit_types: ["ROUTINE_WATCH"] }
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 400"
            - "data.error_id == ERR_MISSING_REQUIRED_FIELD"
            - "GET /property-care/service-plans returns total_count == 0"

      - name: property_freeze_setpoint_default_applied_when_omitted
        claim_type: Defaults
        grounds: ["entities.Property.fields.freeze_setpoint_f", "global_constants.FREEZE_SETPOINT_DEFAULT_F"]
        distinguishing_aspect: "Omitting freeze_setpoint_f on property creation stores exactly 55, and omitting rental_program_enrolled stores false."
        test_recipe:
          setup: ["One Owner."]
          setup_api_calls:
            - call: "POST /property-care/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /property-care/owners"
              payload: { full_name: "Dee Default", email: "dee.default@example.com", phone: "+15550203", primary_residence_state: "IA" }
              as: PlatformAdmin
              captures: { owner_id: $.data.id }
          trigger:
            - call: "POST /property-care/properties"
              payload: { owner_id: "${owner_id}", label: "Default House", address_line: "55 Set Pt", state_code: "FL", travel_distance_miles: 5.0 }
              as: PlatformAdmin
              captures: { prop_id: $.data.id }
          assert:
            - "Property.${prop_id}.freeze_setpoint_f == 55"
            - "Property.${prop_id}.rental_program_enrolled == false"
            - "Property.${prop_id}.seasonal_state == OPEN and Property.${prop_id}.occupancy_state == VACANT"
            - "Property.${prop_id}.storm_hold_flag == false"

      - name: property_travel_zone_is_computed_and_ignores_client_value
        claim_type: Computed Fields
        grounds: ["entities.Property.fields.travel_zone", "calculations.travel_zone_assignment"]
        distinguishing_aspect: "travel_zone is derived from travel_distance_miles alone: 10.0 stores Z1, 10.1 stores Z2, 25.0 stores Z2, 60.0 stores Z3 and 60.1 stores OUT_OF_AREA."
        test_recipe:
          setup: ["One Owner."]
          setup_api_calls:
            - call: "POST /property-care/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /property-care/owners"
              payload: { full_name: "Eve Zone", email: "eve.zone@example.com", phone: "+15550204", primary_residence_state: "MO" }
              as: PlatformAdmin
              captures: { owner_id: $.data.id }
            - call: "POST /property-care/properties"
              payload: { owner_id: "${owner_id}", label: "Z1 edge", address_line: "10 Mile Rd", state_code: "FL", travel_distance_miles: 10.0 }
              as: PlatformAdmin
              captures: { p_z1: $.data.id }
            - call: "POST /property-care/properties"
              payload: { owner_id: "${owner_id}", label: "Z2 edge", address_line: "25 Mile Rd", state_code: "FL", travel_distance_miles: 25.0 }
              as: PlatformAdmin
              captures: { p_z2: $.data.id }
            - call: "POST /property-care/properties"
              payload: { owner_id: "${owner_id}", label: "Z3 edge", address_line: "60 Mile Rd", state_code: "FL", travel_distance_miles: 60.0 }
              as: PlatformAdmin
              captures: { p_z3: $.data.id }
          trigger:
            - call: "POST /property-care/properties"
              payload: { owner_id: "${owner_id}", label: "Out of area", address_line: "61 Mile Rd", state_code: "FL", travel_distance_miles: 60.1 }
              as: PlatformAdmin
              captures: { p_out: $.data.id }
          assert:
            - "Property.${p_z1}.travel_zone == Z1"
            - "Property.${p_z2}.travel_zone == Z2"
            - "Property.${p_z3}.travel_zone == Z3"
            - "Property.${p_out}.travel_zone == OUT_OF_AREA"

      - name: visit_system_fields_are_server_stamped_not_client_supplied
        claim_type: System Fields
        grounds: ["entities.Visit.fields.status", "entities.Visit.fields.departed_at", "entities.Visit.fields.tech_user_id"]
        distinguishing_aspect: "A newly created Visit always starts at status SCHEDULED with departed_at, arrived_at, completed_at, tech_user_id and billing_cycle_id all null and version 1, regardless of what the client sends."
        test_recipe:
          setup: ["An ACTIVE STANDARD subscription on a Z2 property and a ROUTINE_WATCH template."]
          setup_api_calls:
            - call: "POST /property-care/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /property-care/owners"
              payload: { full_name: "Fin Sys", email: "fin.sys@example.com", phone: "+15550205", primary_residence_state: "KS" }
              as: PlatformAdmin
              captures: { owner_id: $.data.id }
            - call: "POST /property-care/properties"
              payload: { owner_id: "${owner_id}", label: "Sys House", address_line: "1 Sys St", state_code: "FL", travel_distance_miles: 18.0 }
              as: PlatformAdmin
              captures: { prop_id: $.data.id }
            - call: "POST /property-care/service-plans"
              payload: { tier: "STANDARD", monthly_fee_cents: 19986, included_visit_units: 4, covered_visit_types: ["ROUTINE_WATCH"] }
              as: PlatformAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /property-care/subscriptions"
              payload: { property_id: "${prop_id}", service_plan_id: "${plan_id}", started_on: "2026-06-01T00:00:00Z" }
              as: AccountManager
              captures: { sub_id: $.data.id }
            - call: "POST /property-care/subscriptions/${sub_id}/activate"
              payload: {}
              as: AccountManager
            - call: "POST /property-care/checklist-templates"
              payload: { visit_type: "ROUTINE_WATCH", version_label: "2026.1", item_codes: ["EXT_WALK"], critical_item_codes: [] }
              as: PlatformAdmin
              captures: { tmpl_id: $.data.id }
          trigger:
            - call: "POST /property-care/visits"
              payload: { property_id: "${prop_id}", checklist_template_id: "${tmpl_id}", visit_type: "ROUTINE_WATCH", trigger_source: "SCHEDULED", scheduled_start_at: "2026-06-02T13:00:00Z", scheduled_end_at: "2026-06-02T15:00:00Z" }
              as: Dispatcher
              captures: { visit_id: $.data.id }
          assert:
            - "Visit.${visit_id}.status == SCHEDULED"
            - "Visit.${visit_id}.departed_at == null and arrived_at == null and completed_at == null"
            - "Visit.${visit_id}.tech_user_id == null and billing_cycle_id == null"
            - "Visit.${visit_id}.entitlement_applied == false and billable_amount_cents == 0"
            - "Visit.${visit_id}.version == 1 and created_at is an ISO 8601 UTC instant with three fractional digits"

      - name: vendor_create_invalid_enum_trade_returns_400
        claim_type: Type Constraints
        grounds: ["entities.Vendor.fields.trade", "validations[priority=61]", "errors[ERR_INVALID_ENUM_VALUE]"]
        distinguishing_aspect: "trade is one of the seven declared members; the value PLUMBER is rejected with 400 ERR_INVALID_ENUM_VALUE and no Vendor row is created."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls:
            - call: "POST /property-care/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /property-care/vendors"
              payload: { legal_name: "Bad Trade Co", trade: "PLUMBER", coi_expires_at: "2027-01-01T00:00:00Z", license_expires_at: "2027-01-01T00:00:00Z", hourly_rate_cents: 8000, rating: 4.0 }
              as: Dispatcher
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 400"
            - "data.error_id == ERR_INVALID_ENUM_VALUE"
            - "GET /property-care/vendors returns total_count == 0"

      - name: vendor_create_rating_out_of_range_returns_400
        claim_type: Type Constraints
        grounds: ["entities.Vendor.fields.rating", "validations[priority=62]", "errors[ERR_VALUE_OUT_OF_RANGE]"]
        distinguishing_aspect: "rating is bounded to [0, 5]; a rating of 9.0 is rejected with 400 ERR_VALUE_OUT_OF_RANGE, distinct from the enum error on the same endpoint."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls:
            - call: "POST /property-care/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /property-care/vendors"
              payload: { legal_name: "Over Rated Co", trade: "PLUMBING", coi_expires_at: "2027-01-01T00:00:00Z", license_expires_at: "2027-01-01T00:00:00Z", hourly_rate_cents: 8000, rating: 9.0 }
              as: Dispatcher
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 400"
            - "data.error_id == ERR_VALUE_OUT_OF_RANGE"

      - name: property_create_wrong_type_for_travel_distance_returns_400
        claim_type: Type Constraints
        grounds: ["entities.Property.fields.travel_distance_miles", "validations[priority=60]", "errors[ERR_INVALID_FIELD_TYPE]"]
        distinguishing_aspect: "travel_distance_miles is a number; the string 'eighteen' is rejected with 400 ERR_INVALID_FIELD_TYPE rather than coerced."
        test_recipe:
          setup: ["One Owner."]
          setup_api_calls:
            - call: "POST /property-care/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /property-care/owners"
              payload: { full_name: "Gil Type", email: "gil.type@example.com", phone: "+15550206", primary_residence_state: "NE" }
              as: PlatformAdmin
              captures: { owner_id: $.data.id }
          trigger:
            - call: "POST /property-care/properties"
              payload: { owner_id: "${owner_id}", label: "Type House", address_line: "1 Type St", state_code: "FL", travel_distance_miles: "eighteen" }
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 400"
            - "data.error_id == ERR_INVALID_FIELD_TYPE"

      - name: property_requires_existing_parent_owner_not_found
        claim_type: Parent Relationships
        grounds: ["entities.Property.fields.owner_id", "validations[priority=8]", "errors[ERR_OWNER_NOT_FOUND]"]
        distinguishing_aspect: "Property creation resolves its owner_id foreign key before anything else in the body; an unknown owner returns 404 ERR_OWNER_NOT_FOUND, which is a different code from the generic path 404."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls:
            - call: "POST /property-care/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /property-care/properties"
              payload: { owner_id: "00000000-0000-4000-8000-0000000000aa", label: "Orphan House", address_line: "1 Orphan St", state_code: "FL", travel_distance_miles: 5.0 }
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 404"
            - "data.error_id == ERR_OWNER_NOT_FOUND"

      - name: checklist_template_required_item_count_is_derived_from_item_codes
        claim_type: Computed Fields
        grounds: ["entities.ChecklistTemplate.fields.required_item_count", "entities.ChecklistTemplate.fields.item_codes"]
        distinguishing_aspect: "required_item_count equals len(item_codes) exactly; a template with five codes stores 5 and default_finding_category falls back to OTHER when omitted."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls:
            - call: "POST /property-care/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /property-care/checklist-templates"
              payload: { visit_type: "ROUTINE_WATCH", version_label: "2026.2", item_codes: ["A", "B", "C", "D", "E"], critical_item_codes: ["C"] }
              as: PlatformAdmin
              captures: { tmpl_id: $.data.id }
          assert:
            - "ChecklistTemplate.${tmpl_id}.required_item_count == 5"
            - "ChecklistTemplate.${tmpl_id}.default_finding_category == OTHER"
            - "ChecklistTemplate.${tmpl_id}.status == ACTIVE"

      - name: graph_topology_visit_carries_six_independent_foreign_keys
        claim_type: Parent Relationships
        grounds: ["entities.Visit.fields.away_period_id", "entities.Visit.fields.rental_turnover_id", "complexity_profile.entity_topology"]
        distinguishing_aspect: "The graph topology is real: one Visit row references, in a single stored row, a Property, a ChecklistTemplate, an AwayPeriod and a RentalTurnover, and each link is independently retrievable through the filtered list endpoint."
        test_recipe:
          setup:
            - "A rental-enrolled Z2 property with an ACTIVE STANDARD subscription, one AwayPeriod and one RentalTurnover far from the visit window."
          setup_api_calls:
            - call: "POST /property-care/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /property-care/owners"
              payload: { full_name: "Hana Graph", email: "hana.graph@example.com", phone: "+15550207", primary_residence_state: "ND" }
              as: PlatformAdmin
              captures: { owner_id: $.data.id }
            - call: "POST /property-care/properties"
              payload: { owner_id: "${owner_id}", label: "Graph House", address_line: "1 Edge St", state_code: "FL", travel_distance_miles: 18.0, rental_program_enrolled: true }
              as: PlatformAdmin
              captures: { prop_id: $.data.id }
            - call: "POST /property-care/service-plans"
              payload: { tier: "STANDARD", monthly_fee_cents: 19986, included_visit_units: 4, covered_visit_types: ["ROUTINE_WATCH"] }
              as: PlatformAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /property-care/subscriptions"
              payload: { property_id: "${prop_id}", service_plan_id: "${plan_id}", started_on: "2026-06-01T00:00:00Z" }
              as: AccountManager
              captures: { sub_id: $.data.id }
            - call: "POST /property-care/subscriptions/${sub_id}/activate"
              payload: {}
              as: AccountManager
            - call: "POST /property-care/checklist-templates"
              payload: { visit_type: "ROUTINE_WATCH", version_label: "2026.1", item_codes: ["EXT_WALK"], critical_item_codes: [] }
              as: PlatformAdmin
              captures: { tmpl_id: $.data.id }
            - call: "POST /property-care/away-periods"
              payload: { property_id: "${prop_id}", owner_id: "${owner_id}", start_at: "2026-06-01T00:00:00Z", end_at: "2026-08-30T00:00:00Z", cadence_days: 14 }
              as: AccountManager
              captures: { away_id: $.data.id }
            - call: "POST /property-care/properties/${prop_id}/rental-turnovers"
              payload: { checkout_at: "2026-07-10T11:00:00Z", checkin_at: "2026-07-12T15:00:00Z", guest_reference: "BK-9100" }
              as: Dispatcher
              captures: { turn_id: $.data.id }
          trigger:
            - call: "POST /property-care/visits"
              payload: { property_id: "${prop_id}", checklist_template_id: "${tmpl_id}", visit_type: "ROUTINE_WATCH", trigger_source: "SCHEDULED", scheduled_start_at: "2026-06-05T13:00:00Z", scheduled_end_at: "2026-06-05T15:00:00Z", away_period_id: "${away_id}", rental_turnover_id: "${turn_id}" }
              as: Dispatcher
              captures: { visit_id: $.data.id }
          assert:
            - "Visit.${visit_id}.away_period_id == ${away_id} and Visit.${visit_id}.rental_turnover_id == ${turn_id}"
            - "GET /property-care/visits with away_period_id ${away_id} returns exactly [${visit_id}]"
            - "GET /property-care/visits with rental_turnover_id ${turn_id} returns exactly [${visit_id}]"
            - "AwayPeriod.${away_id}.scheduled_visit_count == 1"

      - name: away_period_projected_visit_count_is_computed_at_create
        claim_type: Computed Fields
        grounds: ["entities.AwayPeriod.fields.projected_visit_count", "calculations.cadence_projection"]
        distinguishing_aspect: "A 90-day away period at cadence 14 stores projected_visit_count floor(90 / 14) == 6, and derived_status reads PLANNED while the clock is before start_at."
        test_recipe:
          setup: ["One Owner and one Property."]
          setup_api_calls:
            - call: "POST /property-care/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /property-care/owners"
              payload: { full_name: "Ike Cadence", email: "ike.cadence@example.com", phone: "+15550208", primary_residence_state: "SD" }
              as: PlatformAdmin
              captures: { owner_id: $.data.id }
            - call: "POST /property-care/properties"
              payload: { owner_id: "${owner_id}", label: "Cadence House", address_line: "14 Cycle Ct", state_code: "FL", travel_distance_miles: 5.0 }
              as: PlatformAdmin
              captures: { prop_id: $.data.id }
          trigger:
            - call: "POST /property-care/away-periods"
              payload: { property_id: "${prop_id}", owner_id: "${owner_id}", start_at: "2026-07-01T00:00:00Z", end_at: "2026-09-29T00:00:00Z", cadence_days: 14 }
              as: Owner
              as_user_id: "${owner_id}"
              captures: { away_id: $.data.id }
          assert:
            - "AwayPeriod.${away_id}.projected_visit_count == 6"
            - "AwayPeriod.${away_id}.scheduled_visit_count == 0"
            - "AwayPeriod.${away_id}.derived_status == PLANNED"
            - "AwayPeriod.${away_id}.cadence_revision_count == 0"

      - name: key_asset_copy_ledger_initialised_from_copies_total
        claim_type: Computed Fields
        grounds: ["entities.KeyAsset.fields.copies_on_hand", "calculations.key_copy_ledger"]
        distinguishing_aspect: "A freshly registered KeyAsset with copies_total 4 stores copies_on_hand 4, copies_issued_outstanding 0, copies_lost 0, code_rotation_count 0 and active_grant_count 0."
        test_recipe:
          setup: ["One Owner and one Property."]
          setup_api_calls:
            - call: "POST /property-care/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
