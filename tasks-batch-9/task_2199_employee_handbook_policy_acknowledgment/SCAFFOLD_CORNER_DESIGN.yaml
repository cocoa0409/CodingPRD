        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[version-create-stale-document]", "errors[ERR_STALE_POLICY_DOCUMENT_VERSION]", "endpoints[POST /policy-documents/{policy_document_id}/versions]", "entities[PolicyDocument].version"]
        distinguishing_aspect: "The PolicyDocument row a client mints versions under is itself mutated by minting, so the version token read before the first mint is already stale for the second: replaying it yields 412 and no PolicyVersion row, while a re-read token succeeds and bumps the document version again -- proving the counter advances on every write, not only on client-visible field edits."
        test_recipe:
          setup: ["One Jurisdiction and one PolicyDocument whose version token is captured immediately at creation."]
          setup_api_calls:
            - { call: "POST /jurisdictions", payload: { state_code: "CA", display_name: "California", min_legal_review_days: 5, ack_deadline_days: 30, retention_years: 5, required_language_codes: ["en"] }, as: HRComplianceAdmin, captures: { j_ca: "$.data.id" } }
            - { call: "POST /policy-documents", payload: { title: "Code of Conduct 2026", category: "CODE_OF_CONDUCT" }, as: PolicyAuthor, captures: { d1: "$.data.id", d1v0: "$.data.version" } }
            - { call: "POST /policy-documents/${d1}/versions", payload: { body_text: "First draft", section_count: 2, required_jurisdiction_ids: ["${j_ca}"], expected_policy_document_version: "${d1v0}" }, as: PolicyAuthor, captures: { v1: "$.data.id" } }
          trigger:
            - { call: "POST /policy-documents/${d1}/versions", payload: { body_text: "Second draft", section_count: 2, required_jurisdiction_ids: ["${j_ca}"], expected_policy_document_version: "${d1v0}" }, as: PolicyAuthor }
            - { call: "GET /policy-documents/${d1}", payload: {}, as: PolicyAuthor, captures: { d1v1: "$.data.version" } }
            - { call: "POST /policy-documents/${d1}/versions", payload: { body_text: "Second draft", section_count: 2, required_jurisdiction_ids: ["${j_ca}"], expected_policy_document_version: "${d1v1}" }, as: PolicyAuthor, captures: { v2: "$.data.id" } }
            - { call: "GET /policy-documents/${d1}", payload: {}, as: PolicyAuthor, captures: { d1v2: "$.data.version" } }
          assert:
            - "the first trigger call returns http_status == 412 with error.error_id == ERR_STALE_POLICY_DOCUMENT_VERSION"
            - "after the 412 GET /policy-versions?policy_document_id=${d1} still returns meta.total_count == 1 and PolicyDocument.${d1}.latest_version_no == 1"
            - "the captured tokens satisfy d1v1 == d1v0 + 1 and d1v2 == d1v1 + 1"
            - "the third trigger call returns http_status == 201 with version_no == 2 and status == DRAFT"
            - "PolicyDocument.${d1}.latest_version_no == 2 and current_published_version_id == null"
