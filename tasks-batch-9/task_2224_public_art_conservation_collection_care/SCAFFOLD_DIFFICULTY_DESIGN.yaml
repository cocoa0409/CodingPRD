        test_recipe:
          setup:
            - "site with concurrent_work_capacity 1 holding one BRONZE artwork"
            - "a WASH protocol for BRONZE and a SCHEDULED MaintenanceVisit in window 2026-08-10..2026-08-12 created while the clock read 2026-08-01"
            - "logical clock then advanced to 2026-08-20T00:00:00Z"
          setup_api_calls:
            - call: "POST /public-art/artists"
              payload: { full_name: "Ada Vance", is_living: true, contact_email: "ada@example.gov" }
              as: CollectionsRegistrar
