# =============================================================================
# 1.8 Scaffold Difficulty Design (Test Targeting Index)
# Task 2419 - Battery Recycling & Second-Life Recovery
# Nine §0.5 Difficulty Rules x >= 2 instances = 27 instances.
# Every numeric literal in an `assert:` line was computed by executing the
# §1.3 formulas with Decimal / ROUND_HALF_UP.
# =============================================================================
scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: settlement_provisional_vs_final_repricing_on_lot_finalize
        grounds:
          - calculations.feedstock_payable_value
          - calculations.settlement_net_payable
          - calculations.assay_variance_pp
          - entities.SupplierSettlement.fields.variant
          - entities.SupplierSettlement.fields.price_basis_date
          - state_machines.RecoveryLot.CHARGED_to_FINALIZED
        distinguishing_aspect: |
          The PROVISIONAL variant prices DECLARED assay x nominal recovery factor at the
          quote effective on Intake.received_at (gross_cents 260224, net 216493), while the
          FINAL variant prices the ACTUAL RecoveryOutput masses with recovery_factor 1.0 at
          the quote effective on RecoveryLot.finalized_at (gross_cents 257008, net 213727)
          for the very same intake, so the same settlement row changes net_payable_cents by
          exactly -2766 cents and its price_basis_date moves from 2026-07-10 to 2026-08-20.
        test_recipe:
          setup:
            - "Logical clock at 2026-07-10T00:00:00.000Z, campus Reno Campus, supplier Northstar Automotive with credit_limit_cents 200000."
            - "July index quotes effective 2026-07-01 (NI 1600, CO 3200, LI 8000, CU 850) and August quotes effective 2026-08-15 (NI 1750, CO 3000, LI 9000, CU 900)."
            - "One NMC622 intake, net_mass_kg 800.0, declared NI 12.0 / CO 4.0 / LI 2.5 / CU 8.0, moisture 3.0, foreign 2.0, carrying two 400.0 kg modules graded D."
            - "Intake released, so a PROVISIONAL DRAFT settlement exists; both modules charged into lot L-1 of a RUNNING NICKEL_RICH hydromet campaign; six assay lines booked totalling 312.000 kg recovered."
            - "Clock moved to 2026-08-20T00:00:00.000Z before the campaign start, so finalized_at lands on the August quote curve."
          setup_api_calls:
            - call: "POST /recycling/_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-10T00:00:00.000Z" }
              as: PlatformAdmin
            - call: "POST /recycling/facilities"
              payload: { name: "Reno Campus", state_code: "NV", mech_capacity_kg_per_day: 3000.0, hydro_capacity_kg_per_day: 2000.0 }
              as: PlatformAdmin
              captures: { fac_id: "$.data.id" }
            - call: "POST /recycling/suppliers"
              payload: { legal_name: "Northstar Automotive", channel: "AUTOMAKER", credit_limit_cents: 200000 }
              as: PlatformAdmin
              captures: { sup_id: "$.data.id" }
            - call: "POST /recycling/metal-index-prices"
              payload: { metal: "NI", effective_date: "2026-07-01T00:00:00.000Z", price_cents_per_kg: 1600 }
              as: MarketAnalyst
            - call: "POST /recycling/metal-index-prices"
              payload: { metal: "CO", effective_date: "2026-07-01T00:00:00.000Z", price_cents_per_kg: 3200 }
              as: MarketAnalyst
            - call: "POST /recycling/metal-index-prices"
              payload: { metal: "LI", effective_date: "2026-07-01T00:00:00.000Z", price_cents_per_kg: 8000 }
              as: MarketAnalyst
            - call: "POST /recycling/metal-index-prices"
              payload: { metal: "CU", effective_date: "2026-07-01T00:00:00.000Z", price_cents_per_kg: 850 }
              as: MarketAnalyst
            - call: "POST /recycling/metal-index-prices"
              payload: { metal: "NI", effective_date: "2026-08-15T00:00:00.000Z", price_cents_per_kg: 1750 }
              as: MarketAnalyst
            - call: "POST /recycling/metal-index-prices"
              payload: { metal: "CO", effective_date: "2026-08-15T00:00:00.000Z", price_cents_per_kg: 3000 }
              as: MarketAnalyst
            - call: "POST /recycling/metal-index-prices"
              payload: { metal: "LI", effective_date: "2026-08-15T00:00:00.000Z", price_cents_per_kg: 9000 }
              as: MarketAnalyst
            - call: "POST /recycling/metal-index-prices"
              payload: { metal: "CU", effective_date: "2026-08-15T00:00:00.000Z", price_cents_per_kg: 900 }
              as: MarketAnalyst
            - call: "POST /recycling/intakes"
              payload: { supplier_id: "${sup_id}", facility_id: "${fac_id}", declared_chemistry: "NMC622", gross_mass_kg: 850.0, packaging_tare_kg: 50.0, declared_ni_pct: 12.0, declared_co_pct: 4.0, declared_li_pct: 2.5, declared_cu_pct: 8.0, moisture_pct: 3.0, foreign_material_pct: 2.0 }
              as: IntakeClerk
              captures: { i_id: "$.data.id" }
            - call: "POST /recycling/intakes/${i_id}/identify-chemistry"
              payload: { identified_chemistry: "NMC622" }
              as: IntakeClerk
              captures: { i_v2: "$.data.version" }
            - call: "POST /recycling/intakes/${i_id}/modules"
              payload: { serial_code: "M-1", mass_kg: 400.0, min_cell_capacity_pct: 58.0, mean_cell_capacity_pct: 62.0, cycle_count: 1200, expected_intake_version: "${i_v2}" }
              as: IntakeClerk
              captures: { m1_id: "$.data.id" }
            - call: "GET /recycling/intakes/${i_id}"
              payload: {}
              as: IntakeClerk
              captures: { i_v3: "$.data.version" }
            - call: "POST /recycling/intakes/${i_id}/modules"
              payload: { serial_code: "M-2", mass_kg: 400.0, min_cell_capacity_pct: 58.0, mean_cell_capacity_pct: 62.0, cycle_count: 1200, expected_intake_version: "${i_v3}" }
              as: IntakeClerk
              captures: { m2_id: "$.data.id" }
            - call: "POST /recycling/intakes/${i_id}/discharge"
              payload: { soc_pct: 12.0 }
              as: PlantOperator
            - call: "POST /recycling/intakes/${i_id}/package"
              payload: { packaging_type: "UN4G-STEEL-DRUM" }
              as: PlantOperator
            - call: "POST /recycling/intakes/${i_id}/manifests"
              payload: { un_number: "UN3480", packing_group: "II", transporter_name: "Sierra Hazmat Lines" }
              as: ComplianceOfficer
              as_user_id: "co-submitter-1"
              captures: { man_id: "$.data.id" }
            - call: "POST /recycling/intakes/${i_id}/manifests/${man_id}/close"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-closer-2"
            - call: "POST /recycling/intakes/${i_id}/release"
              payload: {}
              as: PlantOperator
            - call: "GET /recycling/settlements"
              payload: { intake_id: "${i_id}" }
              as: SettlementAccountant
              captures: { st_id: "$.data[0].id", prov_net: "$.data[0].net_payable_cents" }
            - call: "POST /recycling/processing-lines"
              payload: { facility_id: "${fac_id}", line_code: "HYD-1", line_type: "HYDROMET", chemistry_family: "NICKEL_RICH", throughput_kg_per_hour: 60.0 }
              as: PlatformAdmin
              captures: { line_id: "$.data.id" }
            - call: "POST /recycling/campaigns"
              payload: { line_id: "${line_id}", chemistry_family: "NICKEL_RICH", window_start: "2026-08-01T00:00:00.000Z", window_end: "2026-09-30T00:00:00.000Z", planned_input_kg: 5000.0 }
              as: PlantOperator
              captures: { camp_id: "$.data.id" }
            - call: "POST /recycling/modules/${m1_id}/triage-decisions"
              payload: { scoring_variant: "CONSERVATIVE" }
              as: TriageEngineer
              as_user_id: "te-1"
            - call: "POST /recycling/modules/${m2_id}/triage-decisions"
              payload: { scoring_variant: "CONSERVATIVE" }
              as: TriageEngineer
              as_user_id: "te-1"
            - call: "POST /recycling/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-20T00:00:00.000Z" }
              as: PlatformAdmin
            - call: "POST /recycling/campaigns/${camp_id}/start"
              payload: {}
              as: PlantOperator
            - call: "POST /recycling/campaigns/${camp_id}/lots"
              payload: { lot_code: "L-1" }
              as: PlantOperator
              captures: { lot_id: "$.data.id", lot_v: "$.data.version" }
            - call: "POST /recycling/lots/${lot_id}/charge"
              payload: { module_ids: ["${m1_id}", "${m2_id}"], expected_lot_version: "${lot_v}" }
              as: PlantOperator
            - call: "POST /recycling/lots/${lot_id}/recovery-outputs"
              payload: { metal: "NI", recovered_mass_kg: 68.002, assay_purity_pct: 99.20 }
              as: AssayTechnician
            - call: "POST /recycling/lots/${lot_id}/recovery-outputs"
              payload: { metal: "CO", recovered_mass_kg: 30.003, assay_purity_pct: 99.00 }
              as: AssayTechnician
            - call: "POST /recycling/lots/${lot_id}/recovery-outputs"
              payload: { metal: "LI", recovered_mass_kg: 18.000, assay_purity_pct: 98.50 }
              as: AssayTechnician
            - call: "POST /recycling/lots/${lot_id}/recovery-outputs"
              payload: { metal: "CU", recovered_mass_kg: 60.001, assay_purity_pct: 99.50 }
              as: AssayTechnician
            - call: "POST /recycling/lots/${lot_id}/recovery-outputs"
              payload: { metal: "MN", recovered_mass_kg: 45.994, assay_purity_pct: 96.00 }
              as: AssayTechnician
            - call: "POST /recycling/lots/${lot_id}/recovery-outputs"
              payload: { metal: "GRAPHITE", recovered_mass_kg: 90.000, assay_purity_pct: 94.00 }
              as: AssayTechnician
          trigger:
            - call: "POST /recycling/lots/${lot_id}/finalize"
              payload: { residue_mass_kg: 464.0 }
              as: AssayTechnician
          assert:
            - "Before the trigger, SupplierSettlement.${st_id}.variant == PROVISIONAL"
            - "Before the trigger, ${prov_net} == 216493"
            - "Before the trigger, SupplierSettlement.${st_id}.gross_cents == 260224"
            - "Before the trigger, SupplierSettlement.${st_id}.price_basis_date == 2026-07-10T00:00:00.000Z"
            - "Before the trigger, SupplierSettlement.${st_id}.max_variance_pp == null"
            - "After the trigger, SupplierSettlement.${st_id}.variant == FINAL"
            - "After the trigger, SupplierSettlement.${st_id}.gross_cents == 257008"
            - "After the trigger, SupplierSettlement.${st_id}.processing_fee_cents == 30841"
            - "After the trigger, SupplierSettlement.${st_id}.quality_deduction_cents == 5140"
            - "After the trigger, SupplierSettlement.${st_id}.pre_surcharge_net_cents == 221027"
            - "After the trigger, SupplierSettlement.${st_id}.hazmat_surcharge_cents == 7300"
            - "After the trigger, SupplierSettlement.${st_id}.net_payable_cents == 213727"
            - "After the trigger, SupplierSettlement.${st_id}.price_basis_date == 2026-08-20T00:00:00.000Z"
            - "After the trigger, SupplierSettlement.${st_id}.max_variance_pp == 3.50"
            - "After the trigger, SupplierSettlement.${st_id}.state == DRAFT"
            - "The FINAL line_breakdown entries are NI line_cents 83302, CO 63006, LI 89100, CU 21600"

      - name: module_triage_score_conservative_vs_fleet_average_diverges_grade
        grounds:
          - calculations.module_second_life_score
          - entities.TriageDecision.fields.scoring_variant
          - entities.TriageDecision.fields.derived_disposition
          - state_machines.Module.PENDING_TRIAGE_to_RECOVERY_QUEUE
          - state_machines.Module.PENDING_TRIAGE_to_SECOND_LIFE_QUEUE
        distinguishing_aspect: |
          Two modules carrying identical cell statistics (min 68.0, mean 82.0, 1200 cycles)
          are graded through the two declared variants: CONSERVATIVE reads min_cell_capacity_pct
          and yields score 50.80 -> grade D -> MATERIAL_RECOVERY -> Module.status RECOVERY_QUEUE,
          while FLEET_AVERAGE reads mean_cell_capacity_pct and yields score 64.80 -> grade C ->
          SECOND_LIFE -> Module.status SECOND_LIFE_QUEUE, a 14.00-point delta that crosses two
          grade bands and routes the module down a different state-machine branch.
        test_recipe:
          setup:
            - "Logical clock at 2026-07-10T00:00:00.000Z, one campus, one supplier."
            - "One NMC622 intake, net_mass_kg 800.0, custody_state PACKAGED (packaging is enough for triage; release is not required)."
            - "Two modules M-A and M-B with identical min_cell_capacity_pct 68.0, mean_cell_capacity_pct 82.0, cycle_count 1200, each 100.0 kg, both PENDING_TRIAGE."
          setup_api_calls:
            - call: "POST /recycling/_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-10T00:00:00.000Z" }
              as: PlatformAdmin
            - call: "POST /recycling/facilities"
              payload: { name: "Reno Campus", state_code: "NV", mech_capacity_kg_per_day: 3000.0, hydro_capacity_kg_per_day: 2000.0 }
              as: PlatformAdmin
              captures: { fac_id: "$.data.id" }
            - call: "POST /recycling/suppliers"
              payload: { legal_name: "Northstar Automotive", channel: "AUTOMAKER", credit_limit_cents: 200000 }
              as: PlatformAdmin
              captures: { sup_id: "$.data.id" }
            - call: "POST /recycling/intakes"
              payload: { supplier_id: "${sup_id}", facility_id: "${fac_id}", declared_chemistry: "NMC622", gross_mass_kg: 850.0, packaging_tare_kg: 50.0, declared_ni_pct: 12.0, declared_co_pct: 4.0, declared_li_pct: 2.5, declared_cu_pct: 8.0 }
              as: IntakeClerk
              captures: { i_id: "$.data.id" }
            - call: "POST /recycling/intakes/${i_id}/identify-chemistry"
              payload: { identified_chemistry: "NMC622" }
              as: IntakeClerk
              captures: { i_v2: "$.data.version" }
            - call: "POST /recycling/intakes/${i_id}/modules"
              payload: { serial_code: "M-A", mass_kg: 100.0, min_cell_capacity_pct: 68.0, mean_cell_capacity_pct: 82.0, cycle_count: 1200, expected_intake_version: "${i_v2}" }
              as: IntakeClerk
              captures: { ma_id: "$.data.id" }
            - call: "GET /recycling/intakes/${i_id}"
              payload: {}
              as: IntakeClerk
              captures: { i_v3: "$.data.version" }
            - call: "POST /recycling/intakes/${i_id}/modules"
              payload: { serial_code: "M-B", mass_kg: 100.0, min_cell_capacity_pct: 68.0, mean_cell_capacity_pct: 82.0, cycle_count: 1200, expected_intake_version: "${i_v3}" }
              as: IntakeClerk
              captures: { mb_id: "$.data.id" }
            - call: "POST /recycling/intakes/${i_id}/discharge"
              payload: { soc_pct: 15.0 }
              as: PlantOperator
            - call: "POST /recycling/intakes/${i_id}/package"
              payload: { packaging_type: "UN4G-STEEL-DRUM" }
              as: PlantOperator
          trigger:
            - call: "POST /recycling/modules/${ma_id}/triage-decisions"
              payload: { scoring_variant: "CONSERVATIVE" }
              as: TriageEngineer
              as_user_id: "te-1"
              captures: { td_a_score: "$.data.score", td_a_grade: "$.data.grade" }
            - call: "POST /recycling/modules/${mb_id}/triage-decisions"
              payload: { scoring_variant: "FLEET_AVERAGE" }
              as: TriageEngineer
              as_user_id: "te-1"
              captures: { td_b_score: "$.data.score", td_b_grade: "$.data.grade" }
          assert:
            - "${td_a_score} == 50.80"
            - "${td_a_grade} == D"
            - "TriageDecision of M-A derived_disposition == MATERIAL_RECOVERY and disposition == MATERIAL_RECOVERY"
            - "Module.${ma_id}.status == RECOVERY_QUEUE"
            - "Module.${ma_id}.second_life_score == 50.80 and Module.${ma_id}.grade == D"
            - "${td_b_score} == 64.80"
            - "${td_b_grade} == C"
            - "TriageDecision of M-B derived_disposition == SECOND_LIFE and disposition == SECOND_LIFE"
            - "Module.${mb_id}.status == SECOND_LIFE_QUEUE"
            - "Module.${mb_id}.second_life_score == 64.80 and Module.${mb_id}.grade == C"
            - "${td_b_score} - ${td_a_score} == 14.00"

  - rule_id: combinatorial_formula
    instances:
      - name: quality_deduction_nested_caps_with_strike_escalation_and_global_cap
        grounds:
          - calculations.quality_deduction_pct
          - calculations.settlement_net_payable
          - entities.Supplier.fields.quality_strike_count
          - entities.SupplierSettlement.fields.quality_deduction_pct
          - state_machines.Intake.PACKAGED_to_RELEASED
        distinguishing_aspect: |
          Mode (a) - nested caps: the moisture component is capped at 0.06 (raw 0.10), the
          foreign component at 0.05 (raw 0.07), their sum plus the 0.04 mislabel penalty gives
          base 0.15, the >= 3-strike multiplier lifts it to 0.225, and the global
          TOTAL_DEDUCTION_CAP clips it to exactly 0.2000; the identical intake for a
          zero-strike supplier stops at 0.1500, so both the per-component caps and the global
          cap are simultaneously load-bearing (deduction 67964 vs 50973 cents on gross 339820).
        test_recipe:
          setup:
            - "Logical clock at 2026-07-10T00:00:00.000Z, one campus, July index quotes NI 1600 / CO 3200 / LI 8000 / CU 850 effective 2026-07-01."
            - "Supplier STRIKER with quality_strike_count 3 (three logged incidents) and supplier CLEAN with quality_strike_count 0, both credit_limit_cents 100000000."
            - "One identical intake per supplier: declared NCA but identified NMC622 (mislabel), net_mass_kg 1000.0, declared NI 10.0 / CO 5.0 / LI 3.0 / CU 7.0, moisture_pct 12.0, foreign_material_pct 5.0, each packaged with a closed manifest."
          setup_api_calls:
            - call: "POST /recycling/_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-10T00:00:00.000Z" }
              as: PlatformAdmin
            - call: "POST /recycling/facilities"
              payload: { name: "Reno Campus", state_code: "NV", mech_capacity_kg_per_day: 3000.0, hydro_capacity_kg_per_day: 2000.0 }
              as: PlatformAdmin
              captures: { fac_id: "$.data.id" }
            - call: "POST /recycling/metal-index-prices"
              payload: { metal: "NI", effective_date: "2026-07-01T00:00:00.000Z", price_cents_per_kg: 1600 }
              as: MarketAnalyst
            - call: "POST /recycling/metal-index-prices"
              payload: { metal: "CO", effective_date: "2026-07-01T00:00:00.000Z", price_cents_per_kg: 3200 }
              as: MarketAnalyst
            - call: "POST /recycling/metal-index-prices"
              payload: { metal: "LI", effective_date: "2026-07-01T00:00:00.000Z", price_cents_per_kg: 8000 }
              as: MarketAnalyst
            - call: "POST /recycling/metal-index-prices"
              payload: { metal: "CU", effective_date: "2026-07-01T00:00:00.000Z", price_cents_per_kg: 850 }
              as: MarketAnalyst
            - call: "POST /recycling/suppliers"
              payload: { legal_name: "Striker Dismantling", channel: "DISMANTLER", credit_limit_cents: 100000000 }
              as: PlatformAdmin
              captures: { sup_s_id: "$.data.id" }
            - call: "POST /recycling/suppliers"
              payload: { legal_name: "Clean Automotive", channel: "AUTOMAKER", credit_limit_cents: 100000000 }
              as: PlatformAdmin
              captures: { sup_c_id: "$.data.id" }
            - call: "POST /recycling/suppliers/${sup_s_id}/quality-strikes"
              payload: { incident_code: "MOISTURE_EXCESS" }
              as: ComplianceOfficer
            - call: "POST /recycling/suppliers/${sup_s_id}/quality-strikes"
              payload: { incident_code: "FOREIGN_MATERIAL" }
              as: ComplianceOfficer
            - call: "POST /recycling/suppliers/${sup_s_id}/quality-strikes"
              payload: { incident_code: "MISLABELLED_CHEMISTRY" }
              as: ComplianceOfficer
              captures: { striker_strikes: "$.data.quality_strike_count" }
            - call: "POST /recycling/intakes"
              payload: { supplier_id: "${sup_s_id}", facility_id: "${fac_id}", declared_chemistry: "NCA", gross_mass_kg: 1050.0, packaging_tare_kg: 50.0, declared_ni_pct: 10.0, declared_co_pct: 5.0, declared_li_pct: 3.0, declared_cu_pct: 7.0, moisture_pct: 12.0, foreign_material_pct: 5.0 }
              as: IntakeClerk
              captures: { is_id: "$.data.id" }
            - call: "POST /recycling/intakes/${is_id}/identify-chemistry"
              payload: { identified_chemistry: "NMC622" }
              as: IntakeClerk
            - call: "POST /recycling/intakes/${is_id}/discharge"
              payload: { soc_pct: 10.0 }
              as: PlantOperator
            - call: "POST /recycling/intakes/${is_id}/package"
              payload: { packaging_type: "UN4G-STEEL-DRUM" }
              as: PlantOperator
            - call: "POST /recycling/intakes/${is_id}/manifests"
              payload: { un_number: "UN3480", packing_group: "II", transporter_name: "Sierra Hazmat Lines" }
              as: ComplianceOfficer
              as_user_id: "co-submitter-1"
              captures: { man_s_id: "$.data.id" }
            - call: "POST /recycling/intakes/${is_id}/manifests/${man_s_id}/close"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-closer-2"
            - call: "POST /recycling/intakes"
              payload: { supplier_id: "${sup_c_id}", facility_id: "${fac_id}", declared_chemistry: "NCA", gross_mass_kg: 1050.0, packaging_tare_kg: 50.0, declared_ni_pct: 10.0, declared_co_pct: 5.0, declared_li_pct: 3.0, declared_cu_pct: 7.0, moisture_pct: 12.0, foreign_material_pct: 5.0 }
              as: IntakeClerk
              captures: { ic_id: "$.data.id" }
            - call: "POST /recycling/intakes/${ic_id}/identify-chemistry"
              payload: { identified_chemistry: "NMC622" }
              as: IntakeClerk
            - call: "POST /recycling/intakes/${ic_id}/discharge"
              payload: { soc_pct: 10.0 }
              as: PlantOperator
            - call: "POST /recycling/intakes/${ic_id}/package"
              payload: { packaging_type: "UN4G-STEEL-DRUM" }
              as: PlantOperator
            - call: "POST /recycling/intakes/${ic_id}/manifests"
              payload: { un_number: "UN3480", packing_group: "II", transporter_name: "Sierra Hazmat Lines" }
              as: ComplianceOfficer
              as_user_id: "co-submitter-1"
              captures: { man_c_id: "$.data.id" }
            - call: "POST /recycling/intakes/${ic_id}/manifests/${man_c_id}/close"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-closer-2"
          trigger:
            - call: "POST /recycling/intakes/${is_id}/release"
              payload: {}
              as: PlantOperator
            - call: "POST /recycling/intakes/${ic_id}/release"
              payload: {}
              as: PlantOperator
            - call: "GET /recycling/settlements"
              payload: { supplier_id: "${sup_s_id}" }
              as: SettlementAccountant
              captures: { st_s_id: "$.data[0].id", st_s_qpct: "$.data[0].quality_deduction_pct", st_s_qcents: "$.data[0].quality_deduction_cents", st_s_net: "$.data[0].net_payable_cents" }
            - call: "GET /recycling/settlements"
