            - "Entry.${entry1_id}.verification_status == RECEIVED AND settlement_status == UNBILLED (both dimensions at their own initial state)"
            - "ClassEntry.${ce1_id}.status == ENTERED with placing null, prize_cents 0, points_national 0.0, points_regional 0"
            - "ComplianceCase.${case_id}.status == OPEN with finding null"
            - "CoverageShift.${cov_vet_id}.status == SCHEDULED"
            - "RingSlot.${slot_id}.status == SCHEDULED"
            - "OfficialAssignment.${asg_id}.status == ACTIVE"

      - name: entry_dimension_triggers_out_of_order_rejected
        claim_type: invalid_transitions
        grounds:
          - state_machines.Entry.verification_dimension
          - state_machines.Entry.settlement_dimension
          - errors.ERR_ENTRY_NOT_RECEIVED
          - errors.ERR_ENTRY_NOT_VERIFIED
          - errors.ERR_ENTRY_NOT_INVOICED
          - errors.ERR_ENTRY_ALREADY_INVOICED
        distinguishing_aspect: |
          Each Entry dimension refuses every trigger that is not on its current
          state's transition list, and each refusal has its own error_id. The two
          dimensions are independent but not unordered: accept requires VERIFIED and
          payment requires INVOICED, so the pre-emptive accept and the pre-emptive
          payment must both fail while the entry sits at (RECEIVED, UNBILLED). The
          replayed verify/invoice/payment calls then distinguish "already past this
          state" from "not yet at this state".
        test_recipe:
          setup:
            - "APPROVED show, class 101 (entry_fee_cents 25000) OPEN, one rider, one horse, one Entry with requested_stall_count 0 and one ClassEntry on class 101."
