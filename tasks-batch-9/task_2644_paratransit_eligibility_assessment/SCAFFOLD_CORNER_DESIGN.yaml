              as: EligibilitySpecialist
              as_user_id: "spec-1"
              captures: { stale_err: $.data.error_id }
            - call: "GET /applications/${appn_id}"
              payload: {}
              as: EligibilitySpecialist
              captures: { v_complete: $.data.version, status_complete: $.data.status }
            - call: "POST /applications/${appn_id}/determinations"
              payload: { expected_application_version: "${v_complete}", category: "UNCONDITIONAL", effective_date: "2026-08-06", rationale: "cannot board fixed-route steps" }
              as: EligibilitySpecialist
