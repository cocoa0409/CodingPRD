          assert:
            - "sov_rev == 1 (REVISED hop incremented revision_number)"
            - "sov_status_mid == BALANCED (revise re-ran sov_line_allocation and landed BALANCED via the REVISED->BALANCED system edge)"
            - "sov_final == APPROVED after the approve trigger"
            - "sov_approved_at == project current_time_utc == '2026-05-01T00:00:00Z' (project logical clock at approval time)"
            - "sub_sov_status == APPROVED (bubble-up onto the parent subcontract)"

  # ===========================================================================
  # Rule 4 — Transitive cascade chains from different triggers
  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: default_cascade_subcontract_to_package_to_project_buyout_complete
        grounds:
          - state_machines.Subcontract.EXECUTED_to_DEFAULTED
          - state_machines.TradePackage.AWARDED_to_BUYOUT_IN_PROGRESS
          - state_machines.Project.BUYOUT_COMPLETE_to_BUYOUT_OPEN
          - calculations.buyout_savings_vs_estimate
        distinguishing_aspect: |
          Depth-3 chain triggered by declare-default: Subcontract EXECUTED ->
          DEFAULTED (hop 1) nulls the package's awarded anchor, whose recompute
          (hop 2) flips the package AWARDED -> BUYOUT_IN_PROGRESS, whose
          recompute (hop 3) flips the project BUYOUT_COMPLETE -> BUYOUT_OPEN.
          Each hop is caused by the previous hop's mutation, not by the
          original action.
        test_recipe:
          setup:
            - "Project BUYOUT_COMPLETE: exactly one TradePackage, AWARDED, holding exactly one EXECUTED subcontract"
            - "Versions of all three entities captured immediately before the trigger"
          setup_api_calls:
            - call: "POST /projects"
              payload: { name: "P-TC1", project_number: "TC1", estimated_budget_cents: 50000000, buyout_target_savings_pct: 0.05 }
              as: GCAdmin
              captures: { proj_id: $.data.id }
            - call: "POST /projects/${proj_id}/open"
              as: GCAdmin
              captures: { proj_v: $.data.version }
            - call: "POST /projects/${proj_id}/trade-packages"
              payload: { trade_code: "TC1-26", title: "Mechanical", estimated_budget_cents: 10000000, budgeted_contingency_cents: 0, spec_section: "23 00 00", bid_due_at: "2026-05-20T16:00:00Z", bonding_policy: "WAIVED", expected_project_version: "${proj_v}" }
              as: BuyoutLead
              captures: { tp_id: $.data.id }
            - call: "POST /trade-packages/${tp_id}/publish"
              as: BuyoutLead
            - call: "POST /trade-packages/${tp_id}/bids"
              payload: { bidder_name: "Theta Mech", contact_email: "t@x.com", base_bid_cents: 8000000, bid_received_at: "2026-05-15T12:00:00Z" }
              as: BuyoutLead
              captures: { bid_t: $.data.id }
            - call: "POST /trade-packages/${tp_id}/bids"
              payload: { bidder_name: "Upsilon Mech", contact_email: "u@x.com", base_bid_cents: 8200000, bid_received_at: "2026-05-15T13:00:00Z" }
              as: BuyoutLead
              captures: { bid_u1: $.data.id }
            - call: "POST /trade-packages/${tp_id}/close-bidding"
              as: BuyoutLead
            - call: "POST /trade-packages/${tp_id}/bids/${bid_u1}/withdraw"
              as: BuyoutLead
            - call: "POST /trade-packages/${tp_id}/subcontracts"
              payload: { subcontractor_name: "Theta Mech", source_bid_id: "${bid_t}", flow_down_terms: "fd", payment_terms: { retainage_pct: 0.10, pay_if_paid: true }, change_authority_limits: [{ max_value_cents: -1, max_cumulative_pct: -1, roles: ["OperationsManager"] }] }
              as: BuyoutLead
              captures: { sub_t: $.data.id }
            - call: "POST /subcontracts/${sub_t}/recommend-award"
              payload: { contract_value_cents: 8000000 }
              as: BuyoutLead
            - call: "POST /subcontracts/${sub_t}/award"
              as: OperationsManager
            - call: "POST /subcontracts/${sub_t}/insurance-certificates"
              payload: { certificate_number: "CERT-TC1", gl_occurrence_cents: 1000000, gl_aggregate_cents: 2000000, auto_cents: 1000000, umbrella_cents: 5000000, workers_comp: "STATUTORY", ai_endorsed: true, wos_endorsed: true, ptd_endorsed: true, pollution_cents: 0, expires_on: "2027-06-01" }
              as: BuyoutLead
            - call: "POST /subcontracts/${sub_t}/issue"
              as: BuyoutLead
            - call: "POST /subcontracts/${sub_t}/execute"
              as: BuyoutLead
            # verify the chain reached BUYOUT_COMPLETE and capture pre-trigger versions
            - call: "GET /projects/${proj_id}"
              as: BuyoutLead
              captures: { proj_status_pre: $.data.status, proj_v_pre: $.data.version }
            - call: "GET /trade-packages/${tp_id}"
              as: BuyoutLead
              captures: { tp_status_pre: $.data.status, tp_v_pre: $.data.version, tp_awarded_pre: $.data.awarded_value_cents }
            - call: "GET /subcontracts/${sub_t}"
              as: BuyoutLead
              captures: { sub_v_pre: $.data.version }
          trigger:
            - call: "POST /subcontracts/${sub_t}/declare-default"
              payload: { reason: "abandoned submittals", estimated_replacement_cost_cents: 9000000 }
              as: OperationsManager
            - call: "GET /subcontracts/${sub_t}"
              as: BuyoutLead
              captures: { sub_status_post: $.data.status, sub_flag: $.data.default_flag, sub_defaulted_at: $.data.default_recorded_at, sub_v_post: $.data.version }
            - call: "GET /trade-packages/${tp_id}"
              as: BuyoutLead
              captures: { tp_status_post: $.data.status, tp_awarded_post: $.data.awarded_value_cents, tp_v_post: $.data.version }
            - call: "GET /projects/${proj_id}"
              as: BuyoutLead
              captures: { proj_status_post: $.data.status, proj_v_post: $.data.version }
          assert:
            - "proj_status_pre == BUYOUT_COMPLETE and tp_status_pre == AWARDED (setup reached the bubble-up end state)"
            - "tp_awarded_pre == 8000000 (EXECUTED subcontract counted before default)"
            - "sub_status_post == DEFAULTED and sub_flag == true (hop 1)"
            - "sub_defaulted_at == project current_time_utc == '2026-05-01T00:00:00Z' (project logical clock)"
            - "tp_status_post == BUYOUT_IN_PROGRESS and tp_awarded_post == 0 (hop 2: DEFAULTED no longer counts as awarded anchor)"
            - "proj_status_post == BUYOUT_OPEN (hop 3: project recompute over package states)"
            - "sub_v_post == ${sub_v_pre} + 1 and tp_v_post == ${tp_v_pre} + 1 and proj_v_post == ${proj_v_pre} + 1 (each cascade hop is one mutation)"

      - name: replacement_cascade_spawns_draft_and_rearms_bond_and_insurance
        grounds:
          - state_machines.Subcontract.EXECUTED_to_REPLACED
          - entities.Subcontract.fields.replaces_subcontract_id
          - entities.InsuranceCertificate.fields.status
        distinguishing_aspect: |
          Depth-2 chain from a different trigger (replace, not declare-default):
          EXECUTED -> REPLACED (hop 1) spawns a fresh DRAFT Subcontract whose
          replaces_subcontract_id links back and whose insurance_status /
          negotiation_round are reset (hop 2); the old subcontract's
          certificates flip to SUPERSEDED as part of hop 2. Different
          propagation pattern than the default bubble-up (spawn-and-reset vs
          aggregate recompute).
        test_recipe:
          setup:
            - "EXECUTED subcontract sub_i (insurance COMPLIANT) with a non-terminal sibling sub_j keeping the package BUYOUT_IN_PROGRESS"
          setup_api_calls:
