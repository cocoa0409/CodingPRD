            - { call: "POST /cohorts", payload: { program_id: "${prog_id}", cohort_code: "C-2026A", seat_capacity: 2, session_window_start: "2026-08-01T00:00:00Z", session_window_end: "2026-12-31T23:00:00Z" }, as: ProgramCoordinator, as_user_id: "coord-admin-0", captures: { coh_id: $.data.id } }
            - { call: "POST /class-sessions", payload: { cohort_id: "${coh_id}", module_id: "${m101_id}", facility_id: "${fac_a_id}", instructor_id: "${ins_1_id}", starts_at: "2026-08-03T09:00:00Z" }, as: ProgramCoordinator, as_user_id: "coord-admin-0", captures: { ses_a_id: $.data.id } }
          trigger:
            - { call: "POST /class-sessions", payload: { cohort_id: "${coh_id}", module_id: "${m102_id}", facility_id: "${fac_a_id}", instructor_id: "${ins_2_id}", starts_at: "2026-08-03T11:30:00Z" }, as: ProgramCoordinator, as_user_id: "coord-admin-0", captures: { err1: $.data.error_id } }
            - { call: "POST /class-sessions", payload: { cohort_id: "${coh_id}", module_id: "${m102_id}", facility_id: "${fac_a_id}", instructor_id: "${ins_2_id}", starts_at: "2026-08-03T12:00:00Z" }, as: ProgramCoordinator, as_user_id: "coord-admin-0", captures: { ses_b_id: $.data.id } }
          assert:
            - "ClassSession.${ses_a_id}.ends_at == 2026-08-03T11:30:00Z (computed from 2.5 contact hours)"
            - "Starting at exactly 2026-08-03T11:30:00Z returns 409 with data.error_id == ERR_FACILITY_DOUBLE_BOOKED"
            - "Starting at 2026-08-03T12:00:00Z, exactly 30 minutes after the previous end, returns 201"
            - "ClassSession.${ses_b_id}.ends_at == 2026-08-03T14:30:00Z"
            - "GET /class-sessions with facility_id ${fac_a_id} returns total_count 2"

      - name: instructor_overlap_allows_adjacency_but_caps_aggregate_day_hours
        grounds:
          - validations[priority=42]
          - validations[priority=66]
          - calculations.instructor_daily_contact_load
          - entities.Instructor.fields.max_daily_contact_hours
          - errors[ERR_INSTRUCTOR_DAILY_LOAD_EXCEEDED]
        distinguishing_aspect: |
          Overlap rule #2 lives on a DIFFERENT resource entity (Instructor) with DIFFERENT interval
          geometry: no buffer at all, so exactly-adjacent bookings are legal, and the constraint is instead
          an AGGREGATE per-UTC-calendar-day contact-hour capacity. 2.5 + 2.5 hours back-to-back is accepted
          at exactly the 5.0-hour cap, a third 5.0-hour session on the same day is rejected, and the same
          session on the next UTC day is accepted - none of which the facility buffer rule can express.
        test_recipe:
