            - "The settle after the dismissal returns HTTP 422 with error_id ERR_CLAIM_STATE_INVALID"

      - name: the_reduction_request_checks_the_state_then_the_open_violation_count
        claim_type: error_triggerable
        grounds:
          - errors[ERR_MONITORING_STATE_INVALID]
          - errors[ERR_OPEN_VIOLATION_BLOCKS_REDUCTION]
          - validations[priority=31]
          - validations[priority=91]
          - validations[priority=92]
        distinguishing_aspect: "The open-violation counter is deliberately decoupled from the compliance posture: invalidating the sample behind an issued violation supersedes its result, so the posture falls back to COMPLIANT and the priority-90 gate passes, yet the reduction is still refused at priority 91 because only a rescission clears open_violation_count. Once rescinded, the very same request advances to the priority-92 history gate, which proves the three rows are ordered rather than merged."
        test_recipe:
          setup:
            - "EPTDS-04 is registered and never sampled, so its monitoring_status is still INITIAL."
            - "EPTDS-01 has one accepted 2026Q2 PFOA result at 4.50 ng/L, an issued MCL_VIOLATION determination and open_violation_count 1; its monitoring_status advanced to QUARTERLY on that first accepted result."
            - "The 2026Q2 sample is then invalidated for OPERATOR_ERROR, which supersedes the accepted result and re-derives the entry point to accepted_result_count 0, max_compliance_ratio 0.0000, consecutive_qualifying_quarters 0 and compliance_posture COMPLIANT, while leaving monitoring_status QUARTERLY, open_violation_count 1 and consecutive_invalidated_samples 1."
          setup_api_calls:
            - call: "POST /contaminants"
              payload: { code: "PFOA", mcl_ng_per_l: 4.00, trigger_level_ng_per_l: 2.00, required_mrl_ng_per_l: 2.00 }
