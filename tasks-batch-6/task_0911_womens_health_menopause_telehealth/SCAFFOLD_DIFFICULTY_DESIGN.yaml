  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: visit_provider_slot_half_open_adjacency
        grounds:
          - validations[priority=11]
          - errors[ERR_PROVIDER_SLOT_OVERLAP]
          - entities.Visit.fields.scheduled_start
          - entities.Visit.fields.scheduled_end
        distinguishing_aspect: "Provider-resource, HALF-OPEN [start,end) semantics: an overlapping slot [09:30,10:30) collides with [09:00,10:00) but an adjacent slot [10:00,11:00) whose start equals the prior end does NOT collide (touching allowed)."
