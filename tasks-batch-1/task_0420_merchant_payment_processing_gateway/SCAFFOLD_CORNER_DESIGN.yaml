              payload: { assigned_risk_band: "LOW" }
              as: UnderwritingOfficer
            - call: "POST /merchants/${m_id}/charges"
              payload: { auth_amount_cents: 12345, card_last4: "4242" }
              as: MerchantUser
              as_user_id: "${m_id}"
              captures: { ch_id: $.data.id }
          trigger:
            - call: "POST /charges/${ch_id}/capture"
              payload: { amount_cents: 12345 }
              as: MerchantUser
              as_user_id: "${m_id}"
          assert:
            - "data.processing_fee_cents == 388"

