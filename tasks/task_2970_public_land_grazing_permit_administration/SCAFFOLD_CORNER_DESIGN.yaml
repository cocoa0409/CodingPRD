  - section: errors
    instances:
      - name: corner_error_and_success_envelopes_have_the_declared_shape_on_invalid_payload
        claim_type: error_envelope
        grounds:
          - response_envelope.success
          - response_envelope.error
          - response_envelope.pagination_defaults
          - errors.ERR_ALLOTMENT_NOT_FOUND
          - errors.ERR_VALIDATION
        distinguishing_aspect: "Every response carries meta.api_request_id and meta.api_request_timestamp regardless of outcome, but response_type switches between \"object\", \"array\" and \"error\", and on an error the payload lives in data.error_id / data.message rather than at the top level. A list response additionally carries limit 10 / offset 0 / total_count / has_more by default."
        test_recipe:
          setup:
            - "No setup; one allotment is created by the trigger itself"
          setup_api_calls: []
          trigger:
            - call: "POST /allotments"
              payload: { name: "Envelope Probe Allotment", admin_unit_code: "NV-165", acres: 4000, total_permitted_aums: 120, season_start: "01-01", season_end: "12-31", required_pasture_rotation_count: 1 }
