              payload: { name: "Autumn Cup 2026", rights_holder_org: "USYS", destination_org: "Metro CVB", start_date: "2026-09-15", end_date: "2026-09-18", booking_deadline: "2026-09-10T00:00:00Z", stay_to_play_required: true, share_pct_organizer: 0.50, share_pct_rights_holder: 0.30, share_pct_destination: 0.20 }
