          assert:
            - "t1_signed == 50000"
            - "t1_balance == 50000"
            - "t2_signed == -12000"
            - "t2_balance == 38000"
            - "t3_type == REVERSAL"
            - "t3_signed == 12000"
            - "t3_balance == 50000"
            - "t3_reverses == ${t2_id}"
            - "TrustFundTransaction.${t2_id}.reversed == true"
            - "TrustFundTransaction.${t2_id}.amount_cents == 12000"
            - "TrustFundTransaction.${t2_id}.signed_amount_cents == -12000"
            - "TrustFundTransaction.${t3_id}.reversed == false"
            - "Resident.${res_id}.trust_fund_balance_cents == 50000"
            - "t1_signed + t2_signed + t3_signed == 50000"

      - name: transfer_conserves_occupied_plus_held_beds
        grounds:
          - calculations.care_unit_bed_availability
          - endpoints.POST_/svh/residents/{id}/transfer
          - state_machines.Resident.ADMITTED_to_ADMITTED
          - state_machines.Resident.ADMITTED_to_HOSPITALIZED
        distinguishing_aspect: |
          Beds are the conserved quantity across two invariants at once: per unit,
          occupied + held + available + out_of_service == licensed (2) holds at all four
          observations, and across the pair of units the total occupied + held stays exactly 1 while
          the resident moves ADMITTED -> HOSPITALIZED -> ADMITTED -> transferred. A transfer that
          increments the target without decrementing the source, or that forgets held_bed_count when
          the resident had been hospitalized, breaks a specific one of these sums.
