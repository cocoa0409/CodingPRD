      - name: exam_retake_wait_refuses_day_eighty_nine_and_accepts_day_ninety
        claim_type: Temporal validation
        grounds: ["validations[priority=20]", "errors[ERR_EXAM_RETAKE_TOO_SOON]", entities.ExamAttempt.result]
        distinguishing_aspect: "RETAKE_WAIT_DAYS is measured from the most recent FAILED attempt of the same exam_type and the boundary is inclusive: 2026-10-29 (89 days after the 2026-08-01 failure) is refused and 2026-10-30 (exactly 90 days) is accepted, while an ORAL attempt is not blocked by a WRITTEN failure at all."
        test_recipe:
          setup:
            - "Logical clock at its default 2026-08-01T00:00:00Z; language spa (oral_exam_available true); interpreter Ana Reyes with a CERTIFIED spa credential in PENDING_WRITTEN."
            - "One WRITTEN attempt scored 72 on 2026-08-01 — below the CERTIFIED written floor of 80, so it is a FAIL and starts the retake clock."
          setup_api_calls:
            - call: "POST /languages"
              payload: { code: "spa", name: "Spanish", tier_class: "DESIGNATED", oral_exam_available: true }
              as: ProgramAdmin
              captures: { lang_spa: "$.data.id" }
            - call: "POST /interpreters"
              payload: { full_name: "Ana Reyes", email: "ana.reyes@courts.example.gov", home_county_code: "CAS" }
              as: CredentialingOfficer
              captures: { i1: "$.data.id", i1_v1: "$.data.version" }
            - call: "POST /credentials"
              payload: { interpreter_id: "${i1}", language_id: "${lang_spa}", target_tier: "CERTIFIED", expected_interpreter_version: "${i1_v1}" }
              as: CredentialingOfficer
              captures: { cred1: "$.data.id" }
            - call: "POST /credentials/${cred1}/exam-attempts"
              payload: { exam_type: "WRITTEN", score: 72, taken_on: "2026-08-01" }
              as: CredentialingOfficer
              captures: { ea1: "$.data.id", ea1_result: "$.data.result", ea1_ord: "$.data.attempt_ordinal" }
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-29T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /credentials/${cred1}/exam-attempts"
              payload: { exam_type: "WRITTEN", score: 84, taken_on: "2026-10-29" }
              as: CredentialingOfficer
            - call: "POST /credentials/${cred1}/exam-attempts"
              payload: { exam_type: "ORAL", score: 71, taken_on: "2026-10-29" }
              as: CredentialingOfficer
              captures: { ea_oral: "$.data.id", ea_oral_result: "$.data.result" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-30T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /credentials/${cred1}/exam-attempts"
              payload: { exam_type: "WRITTEN", score: 84, taken_on: "2026-10-30" }
              as: CredentialingOfficer
              captures: { ea3: "$.data.id", ea3_result: "$.data.result", ea3_ord: "$.data.attempt_ordinal" }
          assert:
            - "${ea1_result} == FAIL and ${ea1_ord} == 1; GET /credentials/${cred1} returns written_attempt_count == 1, written_best_score == 72, status == PENDING_WRITTEN"
            - "second trigger returns HTTP 409 with data.error_id == ERR_EXAM_RETAKE_TOO_SOON"
            - "third trigger returns HTTP 201 with ${ea_oral_result} == FAIL — the WRITTEN failure never gates an ORAL attempt, the wait is per exam_type"
            - "fifth trigger returns HTTP 201 with ${ea3_result} == PASS and ${ea3_ord} == 2 — the refused attempt was never persisted, so the ordinal is 2, not 3"
            - "GET /credentials/${cred1} returns written_attempt_count == 2, written_best_score == 84, oral_attempt_count == 1"
            - "GET /credentials/${cred1}/exam-attempts?exam_type=WRITTEN returns total_count == 2"

