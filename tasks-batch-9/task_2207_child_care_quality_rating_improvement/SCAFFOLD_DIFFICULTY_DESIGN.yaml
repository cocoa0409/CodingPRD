    instances:
      - name: staff_credential_registry_state_gates_rating_cycle_award
        grounds:
          - state_machines.RatingCycle.OBSERVATION_FINALIZED_to_AWARDED
          - validations[priority=26]
          - entities.StaffCredential.fields.registry_status
          - entities.StaffCredential.fields.employment_status
          - calculations.credential_compliance_pct
          - calculations.rating_tier_determination
        distinguishing_aspect: |
          Entity pair RatingCycle -> StaffCredential: the RatingCycle
          OBSERVATION_FINALIZED -> AWARDED transition is legal or illegal purely as a
          function of a sibling entity's field state — one ACTIVE StaffCredential with
          registry_status PENDING makes the award fail with ERR_CREDENTIAL_REGISTRY_UNLINKED
          while Provider.credential_compliance_pct is a perfectly adequate 90.00, and
