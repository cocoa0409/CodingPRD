# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Task 2476 — Optical Laboratory & Prescription Fulfillment
#
# Nine §0.5 rule_ids x 2 differentiated instances = 18 instances.
#
# Fixed acting identities used throughout (X-User-ID header values):
#   OPT_A   0a000000-0000-4000-8000-000000000001   StoreOptician
#   OPT_B   0a000000-0000-4000-8000-000000000002   StoreOptician (second optician)
#   TECH_A  0b000000-0000-4000-8000-000000000001   LabTechnician
#   TECH_B  0b000000-0000-4000-8000-000000000002   LabTechnician (second operator)
#   INSP_A  0c000000-0000-4000-8000-000000000001   QualityInspector
#   MGR_A   0d000000-0000-4000-8000-000000000001   LabManager
#   BEN_A   0e000000-0000-4000-8000-000000000001   BenefitsAdministrator
#
# Every money literal below was computed by executing the §1.3 formulas with their declared
# constants; every geometry literal by executing frame_layout_geometry.

scaffold_difficulty_design:

  # =========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: order_quote_provisional_versus_final_diverges_on_rx_order_money
        grounds:
          - calculations.order_quote_and_patient_portion
          - calculations.turnaround_and_expedite_fee
          - calculations.benefit_application_waterfall
          - entities.RxOrder.fields.quote_variant
          - state_machines.RxOrder.billing_status.PROVISIONAL_QUOTED_to_BENEFIT_APPLIED
        distinguishing_aspect: |
          This instance is dual-variant pricing on the RxOrder money domain: the PROVISIONAL variant
          prices the lens without the surfacing surcharge, promises a 24-hour turnaround and charges a
          13646-cent expedite fee, while the FINAL variant adds the 4500-cent surcharge, promises 36
          hours and charges only 9997 cents, so the fee moves DOWN while the base moves UP.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "Plan VSP-PREMIER: frame allowance 15000, lens base allowance 9000, coating pool 8000, progressive copay 3000, plan coinsurance 0.33, annual cap 40000, expedite not covered."
            - "Patient Nora Ellis on that plan with benefit_period_start 2026-01-01 and benefit_used_cents 0."
            - "Design PRG-HI167: PROGRESSIVE, HIGH_INDEX_167, retail 31995, tier PREMIUM, no stock SKU, min fitting height 18.0."
            - "Prescription verified: sphere_od -3.00 cyl -1.25 axis 90, sphere_os -2.75 cyl -1.00 axis 85, add 2.00, prism_od 0.50, PD 61.0, issued 2026-03-01."
            - "Order with frame 21995, coatings AR_PREMIUM + HARDCOAT, expedite requested; PROVISIONAL quote already stored."
            - "One COMPUTED layout requiring a 77.0 mm blank, and an 80.0 mm blank lot, so the lab job takes the SURFACE_AND_EDGE route."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: LabManager
              as_user_id: "0d000000-0000-4000-8000-000000000001"
            - call: "POST /prescribers"
              payload: { npi: "1234567893", full_name: "Dr Iris Vance", license_state: "CA", max_rx_validity_months: 12 }
              as: LabManager
              as_user_id: "0d000000-0000-4000-8000-000000000001"
              captures: { presc_id: $.data.id }
            - call: "POST /insurance-plans"
              payload: { plan_code: "VSP-PREMIER", frame_allowance_cents: 15000, lens_base_allowance_cents: 9000, coating_allowance_cents: 8000, progressive_copay_cents: 3000, coinsurance_pct: 0.33, annual_benefit_cap_cents: 40000, expedite_covered: false, specialty_requires_prior_auth: true }
              as: BenefitsAdministrator
              as_user_id: "0e000000-0000-4000-8000-000000000001"
              captures: { plan_id: $.data.id }
            - call: "POST /patients"
              payload: { full_name: "Nora Ellis", date_of_birth: "1974-05-02", insurance_plan_id: "${plan_id}", member_number: "M-88120", benefit_period_start: "2026-01-01" }
              as: StoreOptician
              as_user_id: "0a000000-0000-4000-8000-000000000001"
              captures: { pat_id: $.data.id }
            - call: "POST /lens-designs"
              payload: { design_code: "PRG-HI167", design_type: "PROGRESSIVE", material: "HIGH_INDEX_167", allowed_coatings: ["AR_PREMIUM", "HARDCOAT", "PHOTOCHROMIC"], retail_price_cents: 31995, min_fitting_height_mm: 18.0, min_blank_diameter_mm: 70.0, product_tier: "PREMIUM", stock_sku_available: false, base_curve: 4.0 }
              as: LabManager
              as_user_id: "0d000000-0000-4000-8000-000000000001"
              captures: { design_prog_id: $.data.id }
            - call: "POST /lens-blank-lots"
              payload: { lens_design_id: "${design_prog_id}", blank_sku: "BLK-167-80", diameter_mm: 80.0, received_qty: 2, received_on: "2026-06-15" }
              as: LabManager
              as_user_id: "0d000000-0000-4000-8000-000000000001"
              captures: { lot80_id: $.data.id }
            - call: "POST /prescriptions"
              payload: { patient_id: "${pat_id}", prescriber_id: "${presc_id}", prescriber_npi_claimed: "1234567893", prescriber_license_state_claimed: "CA", sphere_od: -3.00, cylinder_od: -1.25, axis_od: 90, sphere_os: -2.75, cylinder_os: -1.00, axis_os: 85, add_power: 2.00, prism_od: 0.50, prism_os: 0.00, pd_distance_mm: 61.0, issued_on: "2026-03-01" }
              as: StoreOptician
              as_user_id: "0a000000-0000-4000-8000-000000000001"
              captures: { rx_id: $.data.id }
            - call: "POST /prescriptions/${rx_id}/verify"
              payload: { verification_note: "NPI and license match the prescriber record" }
              as: StoreOptician
              as_user_id: "0a000000-0000-4000-8000-000000000001"
            - call: "POST /rx-orders"
              payload: { patient_id: "${pat_id}", prescription_id: "${rx_id}", lens_design_id: "${design_prog_id}", frame_sku: "FRM-A22", frame_retail_cents: 21995, requested_coatings: ["AR_PREMIUM", "HARDCOAT"], monocular_pd_od_mm: 31.0, monocular_pd_os_mm: 30.0, fitting_height_mm: 22.0, expedite_requested: true }
              as: StoreOptician
              as_user_id: "0a000000-0000-4000-8000-000000000001"
              captures: { order_id: $.data.id, order_v: $.data.version }
            - call: "POST /frame-layouts"
              payload: { rx_order_id: "${order_id}", expected_rx_order_version: "${order_v}", trace_source: "DIGITAL_TRACER", a_mm: 52.0, b_mm: 32.0, ed_mm: 55.0, dbl_mm: 18.0 }
              as: StoreOptician
              as_user_id: "0a000000-0000-4000-8000-000000000001"
              captures: { layout_id: $.data.id }
            - call: "POST /lab-jobs"
              payload: { rx_order_id: "${order_id}" }
              as: LabTechnician
              as_user_id: "0b000000-0000-4000-8000-000000000001"
              captures: { job_id: $.data.id, job_v: $.data.version }
          trigger:
            - call: "GET /rx-orders/${order_id}/charge-summary"
              as: BenefitsAdministrator
              captures: { prov_gross: $.data.gross_charge_cents, prov_fee: $.data.expedite_fee_cents, prov_est: $.data.estimated_benefit_cents, prov_variant: $.data.quote_variant }
            - call: "POST /rx-orders/${order_id}/benefit-application"
              as: BenefitsAdministrator
              as_user_id: "0e000000-0000-4000-8000-000000000001"
            - call: "GET /rx-orders/${order_id}/charge-summary"
              as: BenefitsAdministrator
              captures: { fin_gross: $.data.gross_charge_cents, fin_fee: $.data.expedite_fee_cents, fin_benefit: $.data.insurance_benefit_cents, fin_patient: $.data.patient_portion_cents, fin_variant: $.data.quote_variant }
          assert:
            - "${prov_variant} == PROVISIONAL"
            - "${prov_gross} == 81126"
            - "${prov_fee} == 13646"
            - "${prov_est} == 41697"
            - "${fin_variant} == FINAL"
            - "${fin_gross} == 81977"
            - "${fin_fee} == 9997"
            - "${fin_benefit} == 40000"
            - "${fin_patient} == 41977"
            - "RxOrder.${order_id}.promised_tat_hours == 36"
            - "RxOrder.${order_id}.lab_writeoff_cents == 0"
            - "RxOrder.${order_id}.gross_charge_cents == RxOrder.${order_id}.insurance_benefit_cents + RxOrder.${order_id}.patient_portion_cents + RxOrder.${order_id}.lab_writeoff_cents (81977 == 40000 + 41977 + 0)"
            - "Patient.${pat_id}.benefit_used_cents == 40000"

      - name: remake_responsibility_process_audit_versus_tolerance_delta_on_remake_case
        grounds:
          - calculations.remake_responsibility_split
          - state_machines.RemakeCase.SUBMITTED_to_ADJUDICATED
          - entities.RemakeCase.fields.lab_share_pct
          - entities.RemakeCase.fields.responsibility
          - validations[priority=670]
        distinguishing_aspect: |
          This instance is dual-variant blame allocation on the RemakeCase domain, not pricing on the
          RxOrder: with byte-identical defect_codes and an identical 49985-cent job cost basis,
          PROCESS_AUDIT returns lab_share_pct 100 / LAB / 49985 while TOLERANCE_DELTA dilutes the two
          out-of-tolerance metrics with the two in-tolerance ones and returns 60 / SPLIT / 29991.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; plan, patient, PRG-HI167 design, PROGRESSIVE tolerance standard (sphere 0.13, cylinder 0.13, axis 3, prism 0.33) and an 80.0 mm lot of 2 blanks are configured."
            - "Verified prescription and an order for frame 21995 with AR_PREMIUM + HARDCOAT, so every lab job takes SURFACE_AND_EDGE and job_cost_basis_cents is 31995 + 4500 + 10995 + 2495 == 49985."
            - "Job 1 driven to EDGED, then an OD inspection measuring sphere -3.20 (delta 0.20), cylinder -1.20 (delta 0.05), axis 96 (delta 6) and prism 0.50 (delta 0.00) FAILS on SPHERE and AXIS, putting job 1 in REWORK_QUEUED."
            - "RemakeCase 1 opened on job 1 with defect_codes [POWER_OUT_OF_TOL, AXIS_OUT_OF_TOL], warranty_claim false, linked to that failing inspection; job 1 is scrapped and the order returns to REMAKE_PENDING with remake_count 1."
            - "Job 2 built from the same order and driven through the identical surfacing, edging and failing OD inspection, then RemakeCase 2 opened with the identical defect_codes and warranty_claim false; remake_count 2."
            - "Both cases are SUBMITTED and unadjudicated at trigger time."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: LabManager
              as_user_id: "0d000000-0000-4000-8000-000000000001"
            - call: "POST /prescribers"
              payload: { npi: "1234567893", full_name: "Dr Iris Vance", license_state: "CA", max_rx_validity_months: 12 }
              as: LabManager
              as_user_id: "0d000000-0000-4000-8000-000000000001"
              captures: { presc_id: $.data.id }
            - call: "POST /insurance-plans"
              payload: { plan_code: "VSP-PREMIER", frame_allowance_cents: 15000, lens_base_allowance_cents: 9000, coating_allowance_cents: 8000, progressive_copay_cents: 3000, coinsurance_pct: 0.33, annual_benefit_cap_cents: 40000, expedite_covered: false, specialty_requires_prior_auth: true }
              as: BenefitsAdministrator
              as_user_id: "0e000000-0000-4000-8000-000000000001"
              captures: { plan_id: $.data.id }
            - call: "POST /patients"
              payload: { full_name: "Nora Ellis", date_of_birth: "1974-05-02", insurance_plan_id: "${plan_id}", member_number: "M-88120", benefit_period_start: "2026-01-01" }
              as: StoreOptician
              as_user_id: "0a000000-0000-4000-8000-000000000001"
              captures: { pat_id: $.data.id }
            - call: "POST /lens-designs"
              payload: { design_code: "PRG-HI167", design_type: "PROGRESSIVE", material: "HIGH_INDEX_167", allowed_coatings: ["AR_PREMIUM", "HARDCOAT", "PHOTOCHROMIC"], retail_price_cents: 31995, min_fitting_height_mm: 18.0, min_blank_diameter_mm: 70.0, product_tier: "PREMIUM", stock_sku_available: false, base_curve: 4.0 }
              as: LabManager
              as_user_id: "0d000000-0000-4000-8000-000000000001"
              captures: { design_prog_id: $.data.id }
            - call: "POST /tolerance-standards"
              payload: { design_type: "PROGRESSIVE", power_band_min_abs: 0.00, power_band_max_abs: 6.00, sphere_tolerance_diopters: 0.13, cylinder_tolerance_diopters: 0.13, axis_tolerance_degrees: 3, prism_tolerance_pd: 0.33, allowed_cosmetic_defect_codes: [], effective_from: "2026-01-01" }
              as: LabManager
              as_user_id: "0d000000-0000-4000-8000-000000000001"
              captures: { tol_prog_id: $.data.id }
            - call: "POST /lens-blank-lots"
              payload: { lens_design_id: "${design_prog_id}", blank_sku: "BLK-167-80", diameter_mm: 80.0, received_qty: 2, received_on: "2026-06-15" }
              as: LabManager
              as_user_id: "0d000000-0000-4000-8000-000000000001"
              captures: { lot80_id: $.data.id }
            - call: "POST /lab-machines"
              payload: { machine_code: "GEN-1", machine_type: "GENERATOR", calibration_buffer_minutes: 15 }
              as: LabManager
              as_user_id: "0d000000-0000-4000-8000-000000000001"
              captures: { gen1_id: $.data.id }
            - call: "POST /finishing-bays"
              payload: { bay_code: "BAY-1", concurrent_capacity: 2 }
              as: LabManager
              as_user_id: "0d000000-0000-4000-8000-000000000001"
              captures: { bay1_id: $.data.id }
            - call: "POST /prescriptions"
              payload: { patient_id: "${pat_id}", prescriber_id: "${presc_id}", prescriber_npi_claimed: "1234567893", prescriber_license_state_claimed: "CA", sphere_od: -3.00, cylinder_od: -1.25, axis_od: 90, sphere_os: -2.75, cylinder_os: -1.00, axis_os: 85, add_power: 2.00, prism_od: 0.50, prism_os: 0.00, pd_distance_mm: 61.0, issued_on: "2026-03-01" }
              as: StoreOptician
              as_user_id: "0a000000-0000-4000-8000-000000000001"
              captures: { rx_id: $.data.id }
            - call: "POST /prescriptions/${rx_id}/verify"
              payload: { verification_note: "NPI and license match the prescriber record" }
              as: StoreOptician
              as_user_id: "0a000000-0000-4000-8000-000000000001"
            - call: "POST /rx-orders"
              payload: { patient_id: "${pat_id}", prescription_id: "${rx_id}", lens_design_id: "${design_prog_id}", frame_sku: "FRM-A22", frame_retail_cents: 21995, requested_coatings: ["AR_PREMIUM", "HARDCOAT"], monocular_pd_od_mm: 31.0, monocular_pd_os_mm: 30.0, fitting_height_mm: 22.0, expedite_requested: true }
              as: StoreOptician
              as_user_id: "0a000000-0000-4000-8000-000000000001"
              captures: { order_id: $.data.id, order_v: $.data.version }
            - call: "POST /frame-layouts"
              payload: { rx_order_id: "${order_id}", expected_rx_order_version: "${order_v}", trace_source: "DIGITAL_TRACER", a_mm: 52.0, b_mm: 32.0, ed_mm: 55.0, dbl_mm: 18.0 }
              as: StoreOptician
              as_user_id: "0a000000-0000-4000-8000-000000000001"
              captures: { layout_id: $.data.id }
            - call: "POST /lab-jobs"
              payload: { rx_order_id: "${order_id}" }
              as: LabTechnician
              as_user_id: "0b000000-0000-4000-8000-000000000001"
              captures: { job1_id: $.data.id, job1_v: $.data.version }
            - call: "POST /lab-operations"
              payload: { lab_job_id: "${job1_id}", expected_lab_job_version: "${job1_v}", operation_type: "SURFACING", window_start: "2026-08-01T09:00:00Z", window_end: "2026-08-01T10:00:00Z", machine_id: "${gen1_id}" }
              as: LabTechnician
              as_user_id: "0b000000-0000-4000-8000-000000000001"
              captures: { op1_surf_id: $.data.id }
            - call: "POST /lab-operations/${op1_surf_id}/start"
              as: LabTechnician
              as_user_id: "0b000000-0000-4000-8000-000000000001"
            - call: "POST /lab-operations/${op1_surf_id}/complete"
              as: LabTechnician
              as_user_id: "0b000000-0000-4000-8000-000000000001"
            - call: "GET /lab-jobs/${job1_id}"
              as: LabTechnician
              captures: { job1_v2: $.data.version }
            - call: "POST /lab-operations"
              payload: { lab_job_id: "${job1_id}", expected_lab_job_version: "${job1_v2}", operation_type: "EDGING", window_start: "2026-08-01T11:00:00Z", window_end: "2026-08-01T12:00:00Z", bay_id: "${bay1_id}" }
              as: LabTechnician
              as_user_id: "0b000000-0000-4000-8000-000000000001"
              captures: { op1_edge_id: $.data.id }
            - call: "POST /lab-operations/${op1_edge_id}/start"
              as: LabTechnician
              as_user_id: "0b000000-0000-4000-8000-000000000001"
            - call: "POST /lab-operations/${op1_edge_id}/complete"
              as: LabTechnician
              as_user_id: "0b000000-0000-4000-8000-000000000001"
            - call: "POST /quality-inspections"
              payload: { lab_job_id: "${job1_id}", eye: "OD", measured_sphere: -3.20, measured_cylinder: -1.20, measured_axis: 96, measured_prism: 0.50 }
              as: QualityInspector
              as_user_id: "0c000000-0000-4000-8000-000000000001"
              captures: { insp1_id: $.data.id }
            - call: "POST /remake-cases"
              payload: { lab_job_id: "${job1_id}", quality_inspection_id: "${insp1_id}", defect_codes: ["POWER_OUT_OF_TOL", "AXIS_OUT_OF_TOL"], warranty_claim: false }
              as: StoreOptician
              as_user_id: "0a000000-0000-4000-8000-000000000001"
              captures: { case1_id: $.data.id }
            - call: "POST /lab-jobs"
              payload: { rx_order_id: "${order_id}" }
              as: LabTechnician
              as_user_id: "0b000000-0000-4000-8000-000000000001"
              captures: { job2_id: $.data.id, job2_v: $.data.version }
            - call: "POST /lab-operations"
              payload: { lab_job_id: "${job2_id}", expected_lab_job_version: "${job2_v}", operation_type: "SURFACING", window_start: "2026-08-01T13:00:00Z", window_end: "2026-08-01T14:00:00Z", machine_id: "${gen1_id}" }
              as: LabTechnician
              as_user_id: "0b000000-0000-4000-8000-000000000001"
              captures: { op2_surf_id: $.data.id }
            - call: "POST /lab-operations/${op2_surf_id}/start"
              as: LabTechnician
              as_user_id: "0b000000-0000-4000-8000-000000000001"
            - call: "POST /lab-operations/${op2_surf_id}/complete"
              as: LabTechnician
              as_user_id: "0b000000-0000-4000-8000-000000000001"
            - call: "GET /lab-jobs/${job2_id}"
              as: LabTechnician
              captures: { job2_v2: $.data.version }
            - call: "POST /lab-operations"
