            - "Reconciliation.${recon_id}.remittance_cents != 1648 (the sum-then-round alternative)"
            - "Fair.${fair_id}.publisher_remittance_cents == 1647"

      - name: return_credit_waterfall_cap_boundary
        grounds:
          - calculations.return_credit
          - entities.ReturnAuthorization.fields.credit_cents
        distinguishing_aspect: |
          Mode (b) rounding + waterfall: prior credited quantities consume the
          consignment cap first (created_at ASC), then the over-cap portion prices at
          (1 - restocking_fee_pct), each component rounded round_half_up per line
          before summation. RA1 at exactly the cap of 5 credits 3000; RA2 fully
          over-cap credits 1080 — proving both the cap boundary and the waterfall
          order across RAs.
        test_recipe:
          setup:
            - "Fair through RECONCILING with zero sales; FRONTLIST line list 1000, delivered 20; agreement discount 0.40, return_cap_pct 0.25 (cap = floor(0.25*20) = 5), restocking_fee_pct 0.10"
