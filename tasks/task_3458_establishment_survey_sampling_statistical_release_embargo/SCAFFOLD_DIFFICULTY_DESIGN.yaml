            - { call: "POST /survey/survey-cycles", payload: { program_code: "CES", reference_month: "2026-09" }, as: ProgramAdmin, captures: { cyc: $.data.id } }
            - { call: "POST /survey/survey-cycles/${cyc}/advance", payload: { action: OPEN_COLLECTION }, as: CollectionOfficer }
            - { call: "POST /survey/response-reports", payload: { enrollment_id: "${en1}", cycle_id: "${cyc}", employment: 9 }, as: Respondent, as_user_id: "${e1}", captures: { r1: $.data.id } }
            - { call: "POST /survey/response-reports", payload: { enrollment_id: "${en2}", cycle_id: "${cyc}", employment: 11 }, as: Respondent, as_user_id: "${e2}", captures: { r2: $.data.id } }
            - { call: "POST /survey/response-reports", payload: { enrollment_id: "${en3}", cycle_id: "${cyc}", employment: 8 }, as: Respondent, as_user_id: "${e3}", captures: { r3: $.data.id } }
            - { call: "POST /survey/response-reports/${r1}/advance", payload: { action: ACCEPT }, as: CollectionOfficer }
            - { call: "POST /survey/response-reports/${r2}/advance", payload: { action: ACCEPT }, as: CollectionOfficer }
            - { call: "POST /survey/response-reports/${r3}/advance", payload: { action: ACCEPT }, as: CollectionOfficer }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-21T00:00:00Z" }, as: ProgramAdmin }
            - { call: "POST /survey/survey-cycles/${cyc}/advance", payload: { action: CLOSE_COLLECTION }, as: CollectionOfficer }
            - { call: "POST /survey/survey-cycles/${cyc}/advance", payload: { action: COMPUTE_ESTIMATES }, as: EstimationAnalyst }
            - { call: "POST /survey/survey-cycles/${cyc}/advance", payload: { action: CERTIFY }, as: EstimationAnalyst, as_user_id: "analyst-1" }
            - { call: "POST /survey/release-events", payload: { cycle_id: "${cyc}", release_at: "2026-10-01T13:30:00Z" }, as: ReleaseManager, captures: { rel: $.data.id, rv1: $.data.version } }
            - { call: "POST /survey/release-events/${rel}/advance", payload: { action: APPROVE_DISCLOSURE, expected_release_version: "${rv1}" }, as: DisclosureOfficer, as_user_id: "officer-7", captures: { rv2: $.data.version } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-10-01T13:00:00Z" }, as: ProgramAdmin }
            - { call: "POST /survey/release-events/${rel}/advance", payload: { action: OPEN_EMBARGO, expected_release_version: "${rv2}" }, as: ReleaseManager, captures: { rv3: $.data.version } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-10-01T13:30:00Z" }, as: ProgramAdmin }
            - { call: "POST /survey/release-events/${rel}/advance", payload: { action: PUBLISH, expected_release_version: "${rv3}" }, as: ReleaseManager, captures: { rv4: $.data.version } }
          trigger:
            - { call: "POST /survey/survey-cycles/${cyc}/advance", payload: { action: REOPEN_REVISION }, as: EstimationAnalyst, captures: { cyc_status_reopen: $.data.cycle_status } }
            - { call: "GET /survey/release-events/${rel}", payload: {}, as: ReleaseManager, captures: { rel_disc: $.data.disclosure_status, rel_flag: $.data.revision_notice_required } }
            - { call: "POST /survey/survey-cycles/${cyc}/advance", payload: { action: COMPUTE_ESTIMATES }, as: EstimationAnalyst }
            - { call: "GET /survey/cell-estimates", payload: { cycle_id: "${cyc}" }, as: EstimationAnalyst, captures: { cell_rev: "$.data[0].revision_no", cell_status: "$.data[0].estimate_status" } }
            - { call: "POST /survey/survey-cycles/${cyc}/advance", payload: { action: CERTIFY }, as: EstimationAnalyst, as_user_id: "analyst-2", captures: { cyc_status_final: $.data.cycle_status } }
