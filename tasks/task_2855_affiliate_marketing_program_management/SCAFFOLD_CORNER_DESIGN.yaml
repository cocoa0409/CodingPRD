            - call: "GET /affiliates"
              payload: { limit: 101, offset: 0 }
              as: ProgramAdmin
              as_user_id: "adm-001"
              captures: { err_big: "$.data.error_id" }
            - call: "GET /affiliates"
              payload: { limit: 10, offset: -1 }
              as: ProgramAdmin
              as_user_id: "adm-001"
              captures: { err_neg: "$.data.error_id" }
            - call: "GET /affiliates"
              payload: { limit: 100, offset: 0 }
