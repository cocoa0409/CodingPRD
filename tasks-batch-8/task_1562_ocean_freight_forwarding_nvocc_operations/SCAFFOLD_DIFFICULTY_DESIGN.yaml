            - { call: "POST /freight/bill-of-lading", payload: { booking_id: "${b}", bl_type: "HOUSE", release_mode: "SEAWAY" }, as: DocumentationOfficer, as_user_id: "doc_1", captures: { bl: $.data.id } }
