            - "second trigger response data.commercial_state == 'BOOKING_OPEN'"
            - "third trigger response status is 200"
            - "third trigger response data.state == 'GUARANTEED'"
            - "third trigger response data.contingency_cents == 412500 (262500 subtotal plus the 150000 guarantee penalty, which is added after tier selection)"
