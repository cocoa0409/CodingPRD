              as_user_id: "cw-1"
            - call: "POST /applications/${app_id}/determine"
              payload: {}
              as: Caseworker
              as_user_id: "cw-1"
            - call: "POST /applications/${app_id}/approve"
              payload: { certification_start_month: "2026-08" }
              as: EligibilitySupervisor
              as_user_id: "sup-1"
              captures: { case_id: $.data.id }
            - call: "POST /cases/${case_id}/issuances"
              payload: { benefit_month: "2026-08" }
              as: Caseworker
              as_user_id: "cw-1"
            - call: "POST /cases/${case_id}/work-assignments"
