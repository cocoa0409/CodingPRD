      - name: structural_guards_reject_bad_ranges_inverted_windows_duplicates_and_backward_clocks
        claim_type: violation_to_error
        grounds:
          - validations[priority=12]
          - validations[priority=14]
          - validations[priority=16]
          - validations[priority=130]
        distinguishing_aspect: |
          Each structural family reports its own code with its own status (422 for
