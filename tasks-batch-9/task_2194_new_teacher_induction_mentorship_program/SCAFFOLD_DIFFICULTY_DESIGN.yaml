          PARALLEL DIMENSIONS WITH A JOIN on the ObservationCycle entity, a different
          entity from the ContactLog cycle above: phase and feedback_review_status advance
          independently - the phase stays pinned at POST_CONFERENCE while the feedback
          dimension travels NONE -> DRAFT -> SUBMITTED -> RETURNED -> SUBMITTED -> ACCEPTED
