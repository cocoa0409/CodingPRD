          assert:
            - "fund precondition genuinely failing too: captured ${id} == 350 (< 1500 = 12.5*120 material cost)"
            - "response is 409 with error_id ERR_INVALID_STATE (${id}) — priority-5 state beats priority-11 fiscal"
            - "credit remains SETTLED; fund unchanged (held 0, paid 1650, available 350)"

      - name: quarantined_ticket_routing_safety_beats_empty_pool
        grounds:
          - validations[priority=7]
          - validations[priority=9]
          - errors[ERR_TICKET_QUARANTINED]
          - errors[ERR_NO_ELIGIBLE_PARTNER]
        distinguishing_aspect: |
          Category pair business_safety (p7) vs business_constraint (p9) —
          different pair from instance 1: routing a QUARANTINED ticket when the
          partner pool is also empty must yield ERR_TICKET_QUARANTINED, not
          ERR_NO_ELIGIBLE_PARTNER.
        test_recipe:
          setup:
            - "Zone Z; resident R with DELIVERED kit; pickup collected, certified 12.5 kg RESALE (ticket T)"
            - "NO partners exist at all (selector pool would be empty)"
            - "SEVERE report on T adjudicated UPHELD: T is QUARANTINED"
          setup_api_calls:
            - call: "POST /service-zones"
              payload: { name: "Zone PP2" }
              as: ZoneOperator
