      - name: segregation_beats_cross_reference_mismatch
        grounds:
          - validations[priority=7]
          - validations[priority=8]
          - errors[ERR_SEGREGATION_OF_DUTIES]
          - errors[ERR_CROSS_REFERENCE_MISMATCH]
        distinguishing_aspect: |
          Category pair (business_safety, business_referential): a PROGRAM
          psychomotor submission whose evaluator attested the cited completion
