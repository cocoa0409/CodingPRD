            - call: "GET /incentives/programs/${prog_id}"
              payload: {}
              as: ProgramDesigner
              as_user_id: "u-designer-1"
              captures: { v2: $.data.version, rate2: $.data.per_unit_amount_cents }
            - call: "POST /incentives/programs/${prog_id}/repricings"
              payload: { mode: "PROSPECTIVE", new_per_unit_amount_cents: 26000, expected_program_version: "${v2}" }
              as: ProgramDesigner
              as_user_id: "u-designer-1"
              captures: { r2_prev: $.data.previous_per_unit_amount_cents }
            - call: "GET /incentives/programs/${prog_id}"
              payload: {}
              as: ProgramDesigner
