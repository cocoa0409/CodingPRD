              as: RentalClientContact
              as_user_id: "${clear_client}"
              payload: { submitted_rigging_kg: 1000, requested_power_amps: 500, requested_dmx_universes: 2, requires_orchestra_pit: false }
              captures: { rider_clear: "$.data.id" }
            - call: "POST /tech-riders/${rider_clear}/review"
              as: TechnicalDirector
            - call: "POST /tech-riders/${rider_clear}/equipment-lines"
              as: TechnicalDirector
              payload: { equipment_item_id: "${item_id}", covers_gap: "POWER_SHORTFALL", qty: 2, rental_days: 2 }
              captures: { line_clear: "$.data.id" }
            - call: "POST /engagements/${eng_arrears}/tech-riders"
              as: RentalClientContact
              as_user_id: "${arrears_client}"
              payload: { submitted_rigging_kg: 1000, requested_power_amps: 500, requested_dmx_universes: 2, requires_orchestra_pit: false }
              captures: { rider_arrears: "$.data.id" }
            - call: "POST /tech-riders/${rider_arrears}/review"
              as: TechnicalDirector
            - call: "POST /tech-riders/${rider_arrears}/equipment-lines"
              as: TechnicalDirector
              payload: { equipment_item_id: "${item_id}", covers_gap: "POWER_SHORTFALL", qty: 2, rental_days: 2 }
              captures: { line_arrears: "$.data.id" }
          trigger:
            - call: "POST /tech-riders/${rider_clear}/clear"
              as: TechnicalDirector
            - call: "POST /tech-riders/${rider_arrears}/clear"
              as: TechnicalDirector
            - call: "GET /engagements/${eng_clear}"
              as: RentalManager
            - call: "GET /engagements/${eng_arrears}"
              as: RentalManager
            - call: "GET /equipment-items/${item_id}"
              as: CenterAdmin
          assert:
            - "Both clears return 200 with review_status 'CLEARED' and additional_equipment_cost_cents 100000 on the rider - the gap was covered, so priority 77 passed."
            - "Client-with-no-arrears engagement: additional_equipment_cost_cents == 100000 but deposit_required_cents == 125000 - the equipment add-on is NOT applied when outstanding_balance_cents is 0."
            - "Client-in-arrears engagement: deposit_required_cents == 225000 (125000 + 100000), so a 5000-cent balance is enough to trip the strict `> 0` condition."
            - "The delta between the two deposits is exactly additional_equipment_cost_cents, with facility_fee_cents 500000 and labor_estimate_total_cents 0 identical on both."
            - "EquipmentItem.reserved_qty == 4 (two RESERVED lines of 2 units each) against on_hand_qty 5, and clearing a rider does not change reserved_qty - the hold was taken when the line was created."

      - name: aggregate_crew_capacity_across_individually_valid_calls
        claim_type: aggregate_validation
        excluded_because:
          difficulty_instance: union_crew_aggregate_capacity_across_overlapping_calls_on_two_engagements
          rationale: >-
            §1.8's resource_temporal_overlap instance already builds the case
            where every individual call is under roster_size but the overlapping
            sum exceeds it, including the touching-endpoint exemption and the
            cross-engagement aggregation that makes the check non-local.

  # ===========================================================================
  # ENDPOINTS (§1.5) - guide Table 5, per endpoint pattern
  # ===========================================================================
  - section: endpoints
    instances:

      - name: box_office_statement_matches_tier_aggregates
        claim_type: computed_read
        grounds:
          - "§1.5 GET /engagements/{id}/box-office-statement returns tier_count, seats_allocated_total, sold_qty_total, subscription_held_qty_total, single_ticket_gross_cents, subscription_revenue_cents, restoration_fees_cents, box_office_gross_cents, adjusted_gross_cents."
          - "§1.3 settlement_financials step 1: adjusted_gross_cents = box_office_gross_cents - restoration_fees_cents."
          - "§1.3 CAPITAL_RESTORATION_FEE_CENTS 200 per ticket."
        distinguishing_aspect: >-
          A pure read whose every field is an aggregate over two tiers with
          different prices and only one of them sold, so a statement that sums
          the wrong tier set, forgets the unsold tier's seats, or reports gross
          before deducting restoration fees is visibly wrong. It also pins that
          the statement is derived on read rather than frozen at settlement time,
          since no settlement exists yet.
        test_recipe:
          setup:
            - "Grand Hall and artist 'Cadence Quartet' (guarantee_floor_cents 200000, historical_sell_through_pct 0.8, routing 2026-09-01 -> 2026-12-31) exist."
            - "A PRESENTED engagement (performance 2026-10-11T19:00Z-22:00Z) has two ACTIVE tiers with dynamic pricing disabled: ORCH 100 seats at 10000 and MEZZ 50 seats at 5000."
            - "Round 1 was opened at 300000 / 0.10 and accepted, so negotiated_fee_cents is 300000."
            - "Risk was assessed: projected_gross = round_half_up(10000*100*0.8) + round_half_up(5000*50*0.8) = 800000 + 200000 = 1000000; exposure 0.30 -> 0.135, routing slack 40 days -> 0, lead 71 days -> 0.0816667, sell-through -> 0.02, score round_half_up(23.67) = 24 -> LOW -> CLEARED with projected_margin_cents 450000."
            - "The rider was reviewed CAPABLE and cleared, the engagement was confirmed and tickets went on sale."
            - "Ten ORCH tickets were sold in one order at the base price (dynamic pricing disabled, so multiplier 1.00): gross 100000, restoration 2000."
            - "No subscription package exists, so subscription_held_qty and subscription_revenue_cents are 0 everywhere."
          setup_api_calls:
            - call: "POST /performance-spaces"
              as: CenterAdmin
              payload: { name: "Grand Hall", seat_capacity: 1200, base_facility_fee_cents: 500000, load_in_day_fee_cents: 200000, changeover_buffer_minutes: 120, rigging_capacity_kg: 5000, house_power_amps: 400, dmx_universes: 4 }
              captures: { space_id: "$.data.id" }
            - call: "POST /artists"
              as: ProgrammingDirector
              payload: { legal_name: "Cadence Quartet", agency_name: "Northgate Artists", guarantee_floor_cents: 200000, historical_sell_through_pct: 0.8, routing_window_start_utc: "2026-09-01T00:00:00Z", routing_window_end_utc: "2026-12-31T00:00:00Z", min_days_between_engagements: 0 }
              captures: { artist_id: "$.data.id" }
            - call: "POST /engagements"
              as: ProgrammingDirector
              payload: { engagement_type: "PRESENTED", space_id: "${space_id}", artist_id: "${artist_id}", title: "Cadence Quartet Recital", load_in_start_utc: "2026-10-10T08:00:00Z", performance_start_utc: "2026-10-11T19:00:00Z", performance_end_utc: "2026-10-11T22:00:00Z", load_out_end_utc: "2026-10-12T02:00:00Z", performance_day_count: 1, load_in_day_count: 1 }
              captures: { engagement_id: "$.data.id" }
            - call: "POST /engagements/${engagement_id}/price-tiers"
              as: BoxOfficeManager
              payload: { tier_name: "ORCH", seats_allocated: 100, base_price_cents: 10000, price_ceiling_cents: 12000, dynamic_pricing_enabled: false, subscription_eligible: false }
              captures: { orch_id: "$.data.id" }
            - call: "POST /engagements/${engagement_id}/price-tiers"
              as: BoxOfficeManager
              payload: { tier_name: "MEZZ", seats_allocated: 50, base_price_cents: 5000, price_ceiling_cents: 6000, dynamic_pricing_enabled: false, subscription_eligible: false }
              captures: { mezz_id: "$.data.id" }
            - call: "GET /engagements/${engagement_id}"
              as: ProgrammingDirector
              captures: { eng_v0: "$.data.version" }
            - call: "POST /engagements/${engagement_id}/fee-negotiations"
              as: ProgrammingDirector
              payload: { offered_fee_cents: 300000, offered_artist_share_pct: 0.1, expected_engagement_version: "${eng_v0}" }
              captures: { neg_id: "$.data.id" }
            - call: "POST /fee-negotiations/${neg_id}/accept"
              as: ArtistRepresentative
              as_user_id: "${artist_id}"
            - call: "GET /engagements/${engagement_id}"
              as: FinanceController
              captures: { eng_v1: "$.data.version" }
            - call: "POST /engagements/${engagement_id}/assess-risk"
              as: FinanceController
              payload: { expected_engagement_version: "${eng_v1}" }
            - call: "POST /engagements/${engagement_id}/tech-riders"
              as: ArtistRepresentative
              as_user_id: "${artist_id}"
              payload: { submitted_rigging_kg: 1000, requested_power_amps: 200, requested_dmx_universes: 2, requires_orchestra_pit: false }
              captures: { rider_id: "$.data.id" }
            - call: "POST /tech-riders/${rider_id}/review"
              as: TechnicalDirector
            - call: "POST /tech-riders/${rider_id}/clear"
              as: TechnicalDirector
            - call: "POST /engagements/${engagement_id}/confirm"
              as: ProgrammingDirector
            - call: "POST /engagements/${engagement_id}/on-sale"
              as: BoxOfficeManager
            - call: "POST /price-tiers/${orch_id}/ticket-sales"
              as: BoxOfficeManager
              payload: { qty: 10, channel: "WEB" }
              captures: { sale_id: "$.data.id" }
          trigger:
            - call: "GET /engagements/${engagement_id}/box-office-statement"
              as: BoxOfficeManager
          assert:
            - "200 with tier_count == 2 and seats_allocated_total == 150 - the unsold MEZZ tier is counted in the house even though it contributed no revenue."
            - "sold_qty_total == 10 and subscription_held_qty_total == 0."
            - "single_ticket_gross_cents == 100000 (10 * 10000 at multiplier 1.00) and subscription_revenue_cents == 0."
            - "restoration_fees_cents == 2000 (200 * 10 tickets)."
            - "box_office_gross_cents == 100000 and adjusted_gross_cents == 98000 - the restoration fee is deducted in the statement exactly as in settlement step 1, so the two never disagree."
            - "The read is a pure projection: engagement.version is unchanged and no Settlement row exists, so the figures cannot be coming from frozen settlement fields."

      - name: subscription_package_links_multiple_engagements
        claim_type: cross_reference_link
        excluded_because:
          difficulty_instance: price_tier_seat_conservation_across_sales_subscription_holds_and_refunds
          rationale: >-
            The many-to-many link semantics of SubscriptionPackage
            (included_engagement_ids all resolving, the designated
            subscription_tier_name existing in each engagement, and the per-order
            hold and revenue booked into every linked engagement) are asserted
            inside that §1.8 compensating_invariant instance.
  # ===========================================================================
  # ERRORS (§1.6) - guide Table 6: every catalogued code must be triggerable
  # ===========================================================================
  - section: errors
    instances:

      - name: nonexistent_path_resources_return_entity_specific_not_found_codes
        claim_type: error_triggerable
        grounds:
          - "§1.4 priority 30: path-referenced resources are validated left to right, yielding the code of the missing entity type."
          - "§1.6 ERR_NEGOTIATION_NOT_FOUND, ERR_TECH_RIDER_NOT_FOUND, ERR_LABOR_CALL_NOT_FOUND, ERR_PRICE_TIER_NOT_FOUND, ERR_SUBSCRIPTION_PACKAGE_NOT_FOUND, ERR_SETTLEMENT_NOT_FOUND, ERR_PARTY_NOT_FOUND, ERR_DEPARTMENT_NOT_FOUND (all 404)."
        distinguishing_aspect: >-
          Sweeps every child-resource path in the API against well-formed but
          unknown UUIDs, which is the only way to prove the catalogue does not
          collapse into one generic 404: eight distinct codes come back from eight
          different path shapes, including the two aggregate parties (Artist and
          UnionDepartment) that share ERR_PARTY_NOT_FOUND and
          ERR_DEPARTMENT_NOT_FOUND respectively.
        test_recipe:
          setup:
            - "The database contains no rows of any kind beyond the logical clock; every id below is a syntactically valid v4 UUID that matches nothing."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              as: CenterAdmin
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
          trigger:
            - call: "POST /fee-negotiations/22222222-2222-4222-8222-222222222222/counter"
              as: ArtistRepresentative
              as_user_id: "user-artist-x"
              payload: { counter_fee_cents: 400000, counter_artist_share_pct: 0.15 }
              captures: { e_neg: "$.data.error_id" }
            - call: "GET /tech-riders/33333333-3333-4333-8333-333333333333"
              as: TechnicalDirector
              captures: { e_rider: "$.data.error_id" }
            - call: "POST /labor-calls/44444444-4444-4444-8444-444444444444/report-hours"
              as: TechnicalDirector
              payload: { actual_hours: 4, meal_break_taken: true }
              captures: { e_call: "$.data.error_id" }
            - call: "GET /price-tiers/55555555-5555-4555-8555-555555555555"
              as: BoxOfficeManager
              captures: { e_tier: "$.data.error_id" }
            - call: "POST /subscription-packages/66666666-6666-4666-8666-666666666666/sell"
              as: BoxOfficeManager
              payload: { order_qty: 1 }
              captures: { e_pkg: "$.data.error_id" }
            - call: "POST /settlements/77777777-7777-4777-8777-777777777777/reconcile-expenses"
              as: FinanceController
              payload: { actual_marketing_cents: 0 }
              captures: { e_settlement: "$.data.error_id" }
            - call: "GET /artists/88888888-8888-4888-8888-888888888888"
              as: ProgrammingDirector
              captures: { e_party: "$.data.error_id" }
            - call: "GET /union-departments/99999999-9999-4999-8999-999999999999"
              as: CenterAdmin
              captures: { e_dept: "$.data.error_id" }
          assert:
            - "Each call returns 404 with the entity-specific code: ERR_NEGOTIATION_NOT_FOUND, ERR_TECH_RIDER_NOT_FOUND, ERR_LABOR_CALL_NOT_FOUND, ERR_PRICE_TIER_NOT_FOUND, ERR_SUBSCRIPTION_PACKAGE_NOT_FOUND, ERR_SETTLEMENT_NOT_FOUND, ERR_PARTY_NOT_FOUND, ERR_DEPARTMENT_NOT_FOUND in that order."
            - "Every response body carries the standard error envelope with a non-empty message alongside error_id."
            - "The action endpoints in the list (counter, report-hours, sell, reconcile-expenses) return 404 rather than a 409 state code: existence is checked at priority 30, before any state check at priority 40."

      - name: body_referenced_resources_are_resolved_before_the_payload_is_applied
        claim_type: error_triggerable
        grounds:
          - "§1.4 priority 32: body-referenced resources (space_id, artist_id, rental_client_id, union_department_id, equipment_item_id, included_engagement_ids elements) must exist."
          - "§1.6 ERR_SPACE_NOT_FOUND, ERR_PARTY_NOT_FOUND, ERR_EQUIPMENT_ITEM_NOT_FOUND (404)."
        distinguishing_aspect: >-
          The path is valid in every call here, so the 404 can only come from a
          body reference - the complement of the path sweep. Keeping one reference
          valid while breaking the other on the same booking request proves the
          checks are per-field rather than a single "some reference is bad" branch.
        test_recipe:
          setup:
            - "Grand Hall (house_power_amps 400) and artist 'Cadence Quartet' exist; client 'Meridian Dance Company' (credit A) exists."
            - "A RENTAL engagement on Grand Hall has a rider requesting 500 A, reviewed to GAP_IDENTIFIED ['POWER_SHORTFALL'], so it accepts equipment lines."
          setup_api_calls:
            - call: "POST /performance-spaces"
              as: CenterAdmin
              payload: { name: "Grand Hall", seat_capacity: 1200, base_facility_fee_cents: 500000, load_in_day_fee_cents: 200000, changeover_buffer_minutes: 120, rigging_capacity_kg: 5000, house_power_amps: 400, dmx_universes: 4 }
              captures: { space_id: "$.data.id" }
            - call: "POST /artists"
              as: ProgrammingDirector
              payload: { legal_name: "Cadence Quartet", agency_name: "Northgate Artists", guarantee_floor_cents: 200000, historical_sell_through_pct: 0.8, routing_window_start_utc: "2026-09-01T00:00:00Z", routing_window_end_utc: "2026-12-31T00:00:00Z", min_days_between_engagements: 0 }
              captures: { artist_id: "$.data.id" }
            - call: "POST /rental-clients"
              as: RentalManager
              payload: { org_name: "Meridian Dance Company", contact_email: "book@meridian.example", credit_rating: "A", is_nonprofit: false }
              captures: { client_id: "$.data.id" }
            - call: "POST /engagements"
              as: RentalManager
              payload: { engagement_type: "RENTAL", space_id: "${space_id}", rental_client_id: "${client_id}", title: "Meridian Rental", load_in_start_utc: "2026-10-01T08:00:00Z", performance_start_utc: "2026-10-02T19:00:00Z", performance_end_utc: "2026-10-02T22:00:00Z", load_out_end_utc: "2026-10-03T02:00:00Z", performance_day_count: 1, load_in_day_count: 1 }
              captures: { engagement_id: "$.data.id" }
            - call: "POST /engagements/${engagement_id}/tech-riders"
              as: RentalClientContact
              as_user_id: "${client_id}"
              payload: { submitted_rigging_kg: 1000, requested_power_amps: 500, requested_dmx_universes: 2, requires_orchestra_pit: false }
              captures: { rider_id: "$.data.id" }
            - call: "POST /tech-riders/${rider_id}/review"
              as: TechnicalDirector
          trigger:
            - call: "POST /engagements"
              as: ProgrammingDirector
              payload: { engagement_type: "PRESENTED", space_id: "aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa", artist_id: "${artist_id}", title: "Bad Hall", load_in_start_utc: "2026-11-01T08:00:00Z", performance_start_utc: "2026-11-02T19:00:00Z", performance_end_utc: "2026-11-02T22:00:00Z", load_out_end_utc: "2026-11-03T02:00:00Z", performance_day_count: 1, load_in_day_count: 1 }
              captures: { e_space: "$.data.error_id" }
            - call: "POST /engagements"
              as: ProgrammingDirector
              payload: { engagement_type: "PRESENTED", space_id: "${space_id}", artist_id: "bbbbbbbb-bbbb-4bbb-8bbb-bbbbbbbbbbbb", title: "Bad Artist", load_in_start_utc: "2026-11-01T08:00:00Z", performance_start_utc: "2026-11-02T19:00:00Z", performance_end_utc: "2026-11-02T22:00:00Z", load_out_end_utc: "2026-11-03T02:00:00Z", performance_day_count: 1, load_in_day_count: 1 }
              captures: { e_party: "$.data.error_id" }
            - call: "POST /tech-riders/${rider_id}/equipment-lines"
              as: TechnicalDirector
              payload: { equipment_item_id: "cccccccc-cccc-4ccc-8ccc-cccccccccccc", covers_gap: "POWER_SHORTFALL", qty: 1, rental_days: 1 }
              captures: { e_item: "$.data.error_id" }
            - call: "GET /engagements"
              as: ProgrammingDirector
              payload: { limit: 10, offset: 0 }
          assert:
            - "Unknown space_id with a valid artist_id: 404 ERR_SPACE_NOT_FOUND."
            - "Valid space_id with an unknown artist_id: 404 ERR_PARTY_NOT_FOUND - the two body references are checked independently."
            - "Unknown equipment_item_id on a GAP_IDENTIFIED rider: 404 ERR_EQUIPMENT_ITEM_NOT_FOUND, not the priority-40 rider-state code, because the rider state is in fact valid."
            - "The engagement listing still reports meta.total_count == 1: none of the three rejected requests persisted anything."

      - name: offline_hall_and_out_of_routing_window_bookings_are_refused
        claim_type: error_triggerable
        grounds:
          - "§1.4 priority 55: the PerformanceSpace of a new engagement must have status ACTIVE (ERR_SPACE_OFFLINE, 422)."
          - "§1.4 priority 62: a PRESENTED performance window must lie inside the artist's routing window (ERR_ROUTING_WINDOW_VIOLATION, 422)."
        distinguishing_aspect: >-
          Two independent booking-time guards, each isolated: the offline hall is
          booked with an in-window artist and the out-of-window artist is booked
          into an active hall, so neither code can mask the other. The routing
          case is placed one day past routing_window_end_utc, which also pins the
          window as inclusive of its own end.
        test_recipe:
          setup:
            - "Studio Theater exists with status OFFLINE supplied at creation (renovation)."
            - "Grand Hall exists with the default ACTIVE status."
            - "Artist 'Cadence Quartet' has routing_window_start_utc 2026-09-01T00:00:00Z and routing_window_end_utc 2026-09-30T23:59:59Z."
          setup_api_calls:
            - call: "POST /performance-spaces"
              as: CenterAdmin
              payload: { name: "Studio Theater", seat_capacity: 200, base_facility_fee_cents: 120000, load_in_day_fee_cents: 40000, changeover_buffer_minutes: 60, rigging_capacity_kg: 800, house_power_amps: 200, dmx_universes: 2, status: "OFFLINE" }
              captures: { offline_space: "$.data.id" }
            - call: "POST /performance-spaces"
              as: CenterAdmin
              payload: { name: "Grand Hall", seat_capacity: 1200, base_facility_fee_cents: 500000, load_in_day_fee_cents: 200000, changeover_buffer_minutes: 120, rigging_capacity_kg: 5000, house_power_amps: 400, dmx_universes: 4 }
              captures: { active_space: "$.data.id" }
            - call: "POST /artists"
              as: ProgrammingDirector
              payload: { legal_name: "Cadence Quartet", agency_name: "Northgate Artists", guarantee_floor_cents: 200000, historical_sell_through_pct: 0.8, routing_window_start_utc: "2026-09-01T00:00:00Z", routing_window_end_utc: "2026-09-30T23:59:59Z", min_days_between_engagements: 0 }
              captures: { artist_id: "$.data.id" }
          trigger:
            - call: "POST /engagements"
              as: ProgrammingDirector
              payload: { engagement_type: "PRESENTED", space_id: "${offline_space}", artist_id: "${artist_id}", title: "Studio Recital", load_in_start_utc: "2026-09-14T08:00:00Z", performance_start_utc: "2026-09-15T19:00:00Z", performance_end_utc: "2026-09-15T22:00:00Z", load_out_end_utc: "2026-09-16T02:00:00Z", performance_day_count: 1, load_in_day_count: 1 }
              captures: { e_offline: "$.data.error_id" }
            - call: "POST /engagements"
              as: ProgrammingDirector
              payload: { engagement_type: "PRESENTED", space_id: "${active_space}", artist_id: "${artist_id}", title: "October Recital", load_in_start_utc: "2026-10-01T08:00:00Z", performance_start_utc: "2026-10-02T19:00:00Z", performance_end_utc: "2026-10-02T22:00:00Z", load_out_end_utc: "2026-10-03T02:00:00Z", performance_day_count: 1, load_in_day_count: 1 }
              captures: { e_routing: "$.data.error_id" }
            - call: "POST /engagements"
              as: ProgrammingDirector
              payload: { engagement_type: "PRESENTED", space_id: "${active_space}", artist_id: "${artist_id}", title: "September Recital", load_in_start_utc: "2026-09-14T08:00:00Z", performance_start_utc: "2026-09-15T19:00:00Z", performance_end_utc: "2026-09-15T22:00:00Z", load_out_end_utc: "2026-09-16T02:00:00Z", performance_day_count: 1, load_in_day_count: 1 }
              captures: { good_engagement: "$.data.id" }
          assert:
            - "Offline hall with an in-window date: 422 ERR_SPACE_OFFLINE."
            - "Active hall with an October date: 422 ERR_ROUTING_WINDOW_VIOLATION - the performance window ends after routing_window_end_utc."
            - "Same artist, same hall, a September date inside the window: 201 - the guards are date- and hall-specific, not a blanket refusal."
            - "The successful booking has lifecycle_status 'DRAFT', financial_clearance 'UNASSESSED', facility_fee_cents 0 and deposit_required_cents 0 (PRESENTED)."

      - name: type_specific_operations_on_the_wrong_engagement_type_return_422
        claim_type: error_triggerable
        grounds:
          - "§1.4 priority 50: fee negotiations, education programs, price tiers, on-sale and subscription membership require PRESENTED; record-deposit requires RENTAL (ERR_ENGAGEMENT_TYPE_MISMATCH, 422)."
        distinguishing_aspect: >-
          Runs the guard in both directions on two engagements that are otherwise
          in the same state (both DRAFT, both freshly created), so an
          implementation that only guards one direction fails exactly half the
          instance. The deposit case is the interesting one because the PRESENTED
          engagement's deposit_required_cents is 0, making a naive "just add the
          payment" implementation look harmless.
        test_recipe:
          setup:
            - "Grand Hall, artist 'Cadence Quartet' and client 'Meridian Dance Company' exist."
            - "A DRAFT PRESENTED engagement (Sep 15 2026) and a DRAFT RENTAL engagement (Oct 2 2026) exist on the same hall, far enough apart for the occupancy check."
          setup_api_calls:
            - call: "POST /performance-spaces"
              as: CenterAdmin
              payload: { name: "Grand Hall", seat_capacity: 1200, base_facility_fee_cents: 500000, load_in_day_fee_cents: 200000, changeover_buffer_minutes: 120, rigging_capacity_kg: 5000, house_power_amps: 400, dmx_universes: 4 }
              captures: { space_id: "$.data.id" }
