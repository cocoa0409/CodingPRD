          assert:
            - "after the first dispute, Invoice.${inv_cyc2}.invoice_status == DISPUTED"
            - "the timely DENY resolves InvoiceDispute.${d1} with resolution == DENIED, resolved_amount_cents == 10000, and returns the invoice to ISSUED"
            - "InvoiceDispute.${d1}.response_due_at == \"2026-10-10T00:00:00Z\" (filed 2026-09-10T00:00:00Z + 30 days)"
            - "the second dispute is accepted (201): Invoice.${inv_cyc2}.invoice_status == DISPUTED again and InvoiceDispute.${d2}.resolution == PENDING — the cycle ISSUED -> DISPUTED -> ISSUED -> DISPUTED is legal"

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:

      - name: enforcement_determination_suspends_carrier_tariff_invoice_dispute_chain
        grounds:
          - state_machines.EnforcementProceeding.NOTICE_ISSUED_to_DETERMINED
          - state_machines.CarrierOrganization.ACTIVE_to_SUSPENDED
          - calculations.compliance_score_adjustment
        distinguishing_aspect: |
          Depth-4 cascade from the determine transition: VIOLATION_FOUND on
          UNREASONABLE_PRACTICE with 5 violations drops compliance_score to
          500 (< 600), which suspends the carrier, which suspends its
          PUBLISHED tariff, which voids the ISSUED-under-that-tariff invoice,
          which auto-waives the invoice's PENDING dispute — each link caused
          by the previous one.
        test_recipe:
          setup:
            - "VOCC carrier with a PUBLISHED tariff (free 2 days, 20000/day); one ISSUED 20000-cent invoice with a PENDING dispute on it."
          setup_api_calls:
            - *d_clock_start
            - call: "POST /fmc/carriers"
              payload: { org_name: "Cascade Carriers", org_type: "VOCC" }
              as: CommissionAdmin
              captures: { carrier_id: $.data.id, carrier_v: $.data.version }
            - *d_mk_shipper
            - call: "POST /fmc/carriers/${carrier_id}/tariff-publications"
              payload: { tariff_code: "DD-SUS-1", charge_scope: "DEMURRAGE", free_time_days: 2, per_diem_rate_cents: 20000, accrual_method: "CALENDAR", change_type: "NEW", effective_date: "2026-09-02T00:00:00Z", expected_carrier_version: "${carrier_v}" }
              as: CarrierRep
              as_user_id: "${carrier_id}"
              captures: { t_sus: $.data.id }
            - *d_clock_sep03
            - call: "POST /fmc/tariff-publications/${t_sus}/publish"
              payload: {}
              as: CarrierRep
              as_user_id: "${carrier_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-07T00:00:00Z" }
              as: CommissionAdmin
            - call: "POST /fmc/carriers/${carrier_id}/invoices"
              payload: { invoice_number: "INV-SUS-1", charge_basis: "TARIFF", tariff_id: "${t_sus}", billed_party_shipper_id: "${shipper_id}", container_number: "MSKU3000003", port_code: "USLGB", availability_date: "2026-09-03T00:00:00Z", return_date: "2026-09-06T00:00:00Z", last_accrual_date: "2026-09-06T00:00:00Z" }
              as: CarrierRep
              as_user_id: "${carrier_id}"
              captures: { inv_sus: $.data.id }
            - call: "POST /fmc/invoices/${inv_sus}/disputes"
              payload: { dispute_reason: "CHARGE_EXCEEDS_PUBLISHED" }
              as: ShipperRep
              as_user_id: "${shipper_id}"
              captures: { dsp_sus: $.data.id }
          trigger:
            - call: "POST /fmc/enforcement-proceedings"
              payload: { target_carrier_id: "${carrier_id}", basis: "UNREASONABLE_PRACTICE" }
              as: EnforcementCounsel
              as_user_id: "ec-1"
              captures: { proc_id: $.data.id }
            - call: "POST /fmc/enforcement-proceedings/${proc_id}/determine"
              payload: { determination: "VIOLATION_FOUND", violation_count: 5, willful: false }
              as: AdministrativeLawJudge
              as_user_id: "alj-1"
          assert:
            - "GET /fmc/carriers/${carrier_id} shows compliance_score == 500 (1000 - min(100 x 5, 500)), status == SUSPENDED, cumulative_civil_penalties_cents == 5000000"
            - "GET /fmc/carriers/${carrier_id}/tariff-publications shows the tariff ${t_sus} with publication_status == SUSPENDED (cascade link 2)"
            - "GET /fmc/invoices/${inv_sus} shows invoice_status == VOIDED (cascade link 3)"
            - "GET /fmc/invoices/${inv_sus}/disputes shows InvoiceDispute.${dsp_sus} with resolution == UPHELD_WAIVED and resolved_amount_cents == 0 (cascade link 4)"
            - "EnforcementProceeding.${proc_id}.proceeding_status == DETERMINED and score_delta == -500"

      - name: bond_exhaustion_suspends_license_then_service_contracts
        grounds:
          - state_machines.OTILicense.ACTIVE_to_SUSPENDED
          - state_machines.ServiceContract.EFFECTIVE_to_SUSPENDED
          - calculations.bond_coverage_tracking
        distinguishing_aspect: |
          Depth-3 cascade from a bond draw (a different triggering transition
          than the enforcement determination): a full-coverage draw exhausts
          the only bond, which drops the license's total available coverage
          below required_bond_cents, which suspends the license, which
          suspends the carrier's EFFECTIVE service contract.
        test_recipe:
          setup:
            - "NVOCC carrier with an ACTIVE license (one 7500000-cent bond — exactly the required minimum) and an EFFECTIVE service contract."
          setup_api_calls:
            - *d_clock_start
            - call: "POST /fmc/carriers"
              payload: { org_name: "Nightowl Logistics", org_type: "NVOCC" }
              as: CommissionAdmin
              captures: { carrier_id: $.data.id }
            - *d_mk_shipper
            - call: "POST /fmc/carriers/${carrier_id}/oti-licenses"
              payload: { license_type: "NVOCC" }
              as: CarrierRep
              as_user_id: "${carrier_id}"
              captures: { lic_id: $.data.id }
            - call: "POST /fmc/oti-licenses/${lic_id}/surety-bonds"
              payload: { bond_ref: "B1", surety_name: "Pacific Surety", coverage_cents: 7500000 }
              as: CarrierRep
              as_user_id: "${carrier_id}"
              captures: { lic_v: $.data.version, lic_status: $.data.license_status }
            - *d_clock_sep03
            - call: "POST /fmc/carriers/${carrier_id}/service-contracts"
              payload: { contract_reference: "SC-1", shipper_id: "${shipper_id}", agreed_at: "2026-09-02T00:00:00Z", duration_months: 12, minimum_quantity_commitment: 100, negotiated_free_time_days: 3, negotiated_per_diem_rate_cents: 12000, negotiated_accrual_method: "CALENDAR" }
              as: CarrierRep
              as_user_id: "${carrier_id}"
              captures: { sc_id: $.data.id }
          trigger:
            - call: "POST /fmc/oti-licenses/${lic_id}/draws"
              payload: { bond_ref: "B1", amount_cents: 7500000, reason: "unpaid reparation order", expected_license_version: "${lic_v}" }
              as: EnforcementCounsel
              as_user_id: "ec-1"
          assert:
            - "the bond append activated the license first (license_status == ACTIVE at exactly 7500000 == required_bond_cents)"
            - "after the draw: the bond's drawn_cents == 7500000, available_cents == 0, bond_status == EXHAUSTED (cascade link 1)"
            - "OTILicense.${lic_id}.license_status == SUSPENDED and total_available_coverage_cents == 0 (cascade link 2)"
            - "GET /fmc/service-contracts?carrier_id=${carrier_id} shows ServiceContract.${sc_id} with contract_status == SUSPENDED (cascade link 3)"

  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:

      - name: suspended_carrier_beats_late_invoice_issuance
        grounds:
          - validations[priority=6]
          - validations[priority=7]
          - errors.ERR_CARRIER_NOT_ACTIVE
          - errors.ERR_LATE_INVOICE_ISSUANCE
        distinguishing_aspect: |
          Error-category pair {state, business_temporal}: the invoice request
          violates both the carrier-active state rule (priority 6) and the
          30-day issuance window (priority 7); the state error
          ERR_CARRIER_NOT_ACTIVE must win because state preconditions are
          evaluated before business_temporal rules.
        test_recipe:
          setup:
            - "VOCC carrier, SUSPENDED by an earlier UNREASONABLE_PRACTICE determination (5 violations -> score 500); its tariff was PUBLISHED and is now SUSPENDED by the cascade."
            - "Logical clock at 2026-10-20T00:00:00Z, so the invoice's last_accrual_date 2026-09-06 is also more than 30 days stale."
          setup_api_calls:
            - *d_clock_start
            - call: "POST /fmc/carriers"
              payload: { org_name: "Dual Failure Lines", org_type: "VOCC" }
              as: CommissionAdmin
              captures: { carrier_id: $.data.id, carrier_v: $.data.version }
            - *d_mk_shipper
            - call: "POST /fmc/carriers/${carrier_id}/tariff-publications"
              payload: { tariff_code: "DD-LATE-1", charge_scope: "DEMURRAGE", free_time_days: 2, per_diem_rate_cents: 20000, accrual_method: "CALENDAR", change_type: "NEW", effective_date: "2026-09-02T00:00:00Z", expected_carrier_version: "${carrier_v}" }
              as: CarrierRep
              as_user_id: "${carrier_id}"
              captures: { t_late: $.data.id }
            - *d_clock_sep03
            - call: "POST /fmc/tariff-publications/${t_late}/publish"
              payload: {}
              as: CarrierRep
              as_user_id: "${carrier_id}"
            - call: "POST /fmc/enforcement-proceedings"
              payload: { target_carrier_id: "${carrier_id}", basis: "UNREASONABLE_PRACTICE" }
              as: EnforcementCounsel
              as_user_id: "ec-1"
              captures: { proc_id: $.data.id }
            - call: "POST /fmc/enforcement-proceedings/${proc_id}/determine"
              payload: { determination: "VIOLATION_FOUND", violation_count: 5, willful: false }
              as: AdministrativeLawJudge
              as_user_id: "alj-1"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-20T00:00:00Z" }
              as: CommissionAdmin
          trigger:
            - call: "POST /fmc/carriers/${carrier_id}/invoices"
              payload: { invoice_number: "INV-DUAL-1", charge_basis: "TARIFF", tariff_id: "${t_late}", billed_party_shipper_id: "${shipper_id}", container_number: "MSKU4000004", port_code: "USLGB", availability_date: "2026-09-03T00:00:00Z", return_date: "2026-09-06T00:00:00Z", last_accrual_date: "2026-09-06T00:00:00Z" }
              as: CarrierRep
              as_user_id: "${carrier_id}"
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 409 and error_id == ERR_CARRIER_NOT_ACTIVE"
            - "error_id != ERR_LATE_INVOICE_ISSUANCE and != ERR_TARIFF_NOT_PUBLISHED, even though both of those checks would also fail (last_accrual 2026-09-06 is 44 days before the clock; the tariff is SUSPENDED)"
            - "no invoice is created: GET /fmc/invoices?carrier_id=${carrier_id} returns 0 rows"

      - name: expired_complaint_window_beats_wrong_billed_party
        grounds:
          - validations[priority=7]
          - validations[priority=8]
          - errors.ERR_COMPLAINT_FILING_WINDOW_EXPIRED
          - errors.ERR_NOT_INVOICE_PARTY
        distinguishing_aspect: |
          Error-category pair {business_temporal, business_referential}: the
          complaint is filed 181 days after the subject invoice's issuance
          (window expired) AND the invoice was billed to a different shipper
          (party mismatch); the temporal error
          ERR_COMPLAINT_FILING_WINDOW_EXPIRED must win because priority 7 is
          evaluated before priority 8.
        test_recipe:
          setup:
            - "VOCC carrier with PUBLISHED tariff; two shippers S1 (complainant) and S2 (billed party)."
            - "Invoice billed to S2 issued at 2026-09-10T00:00:00Z; the complaint window ends 2027-03-09T00:00:00Z (issued_at + 180 days)."
            - "Logical clock at 2027-03-10T00:00:00Z for the filing attempt."
          setup_api_calls:
            - *d_clock_start
            - call: "POST /fmc/carriers"
              payload: { org_name: "Window Probe Carriers", org_type: "VOCC" }
              as: CommissionAdmin
              captures: { carrier_id: $.data.id, carrier_v: $.data.version }
            - *d_mk_shipper
            - call: "POST /fmc/shippers"
              payload: { company_name: "Second Party Shippers", contact_email: "billing@secondparty.example" }
              as: CommissionAdmin
              captures: { shipper2_id: $.data.id }
            - call: "POST /fmc/carriers/${carrier_id}/tariff-publications"
              payload: { tariff_code: "DD-WIN-1", charge_scope: "DETENTION", free_time_days: 2, per_diem_rate_cents: 5000, accrual_method: "CALENDAR", change_type: "NEW", effective_date: "2026-09-02T00:00:00Z", expected_carrier_version: "${carrier_v}" }
              as: CarrierRep
              as_user_id: "${carrier_id}"
              captures: { t_win: $.data.id }
            - *d_clock_sep03
            - call: "POST /fmc/tariff-publications/${t_win}/publish"
              payload: {}
              as: CarrierRep
              as_user_id: "${carrier_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-10T00:00:00Z" }
              as: CommissionAdmin
            - call: "POST /fmc/carriers/${carrier_id}/invoices"
              payload: { invoice_number: "INV-WIN-1", charge_basis: "TARIFF", tariff_id: "${t_win}", billed_party_shipper_id: "${shipper2_id}", container_number: "MSKU4000009", port_code: "USNYC", availability_date: "2026-09-04T00:00:00Z", return_date: "2026-09-08T00:00:00Z", last_accrual_date: "2026-09-08T00:00:00Z" }
              as: CarrierRep
              as_user_id: "${carrier_id}"
              captures: { inv_win: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-03-10T00:00:00Z" }
              as: CommissionAdmin
          trigger:
            - call: "POST /fmc/complaints"
              payload: { respondent_carrier_id: "${carrier_id}", subject_invoice_ids: ["${inv_win}"], reparations_claimed_cents: 10000 }
              as: ShipperRep
              as_user_id: "${shipper_id}"
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 422 and error_id == ERR_COMPLAINT_FILING_WINDOW_EXPIRED (filed 2027-03-10 > issued_at 2026-09-10 + 180 days = 2027-03-09)"
            - "error_id != ERR_NOT_INVOICE_PARTY even though the invoice was billed to ${shipper2_id}, not the complainant"
            - "GET /fmc/complaints?shipper_id=${shipper_id} returns 0 rows"

  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:

      - name: dispute_response_at_exact_deadline_vs_one_second_late
        grounds:
          - entities.InvoiceDispute.fields.response_due_at
          - state_machines.InvoiceDispute.PENDING_to_DENIED
          - state_machines.InvoiceDispute.PENDING_to_UPHELD_WAIVED
        distinguishing_aspect: |
          Time-metric boundary: responding at exactly response_due_at is
          timely (<=) and a DENY stands; responding one second later forces
          UPHELD_WAIVED, voids the invoice, and docks the carrier 25
          compliance points — the two branches differ by exactly one second
          on the clock.
        test_recipe:
          setup:
            - "VOCC carrier with PUBLISHED tariff (free 2 days, 5000/day); two identical 5000-cent ISSUED invoices to one shipper; both disputes filed at 2026-09-10T09:30:00Z, so response_due_at == 2026-10-10T09:30:00Z for both."
          setup_api_calls:
            - *d_clock_start
            - call: "POST /fmc/carriers"
              payload: { org_name: "Deadline Carriers", org_type: "VOCC" }
              as: CommissionAdmin
              captures: { carrier_id: $.data.id, carrier_v: $.data.version }
            - *d_mk_shipper
            - call: "POST /fmc/carriers/${carrier_id}/tariff-publications"
              payload: { tariff_code: "DD-DUE-1", charge_scope: "DETENTION", free_time_days: 2, per_diem_rate_cents: 5000, accrual_method: "CALENDAR", change_type: "NEW", effective_date: "2026-09-02T00:00:00Z", expected_carrier_version: "${carrier_v}" }
              as: CarrierRep
              as_user_id: "${carrier_id}"
              captures: { t_due: $.data.id }
            - *d_clock_sep03
            - call: "POST /fmc/tariff-publications/${t_due}/publish"
              payload: {}
              as: CarrierRep
              as_user_id: "${carrier_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-08T00:00:00Z" }
              as: CommissionAdmin
            - call: "POST /fmc/carriers/${carrier_id}/invoices"
              payload: { invoice_number: "INV-DUE-A", charge_basis: "TARIFF", tariff_id: "${t_due}", billed_party_shipper_id: "${shipper_id}", container_number: "MSKU5000001", port_code: "USNYC", availability_date: "2026-09-04T00:00:00Z", return_date: "2026-09-07T00:00:00Z", last_accrual_date: "2026-09-07T00:00:00Z" }
              as: CarrierRep
              as_user_id: "${carrier_id}"
              captures: { inv_a: $.data.id }
            - call: "POST /fmc/carriers/${carrier_id}/invoices"
              payload: { invoice_number: "INV-DUE-B", charge_basis: "TARIFF", tariff_id: "${t_due}", billed_party_shipper_id: "${shipper_id}", container_number: "MSKU5000002", port_code: "USNYC", availability_date: "2026-09-04T00:00:00Z", return_date: "2026-09-07T00:00:00Z", last_accrual_date: "2026-09-07T00:00:00Z" }
              as: CarrierRep
              as_user_id: "${carrier_id}"
              captures: { inv_b: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-10T09:30:00Z" }
              as: CommissionAdmin
            - call: "POST /fmc/invoices/${inv_a}/disputes"
              payload: { dispute_reason: "CHARGE_EXCEEDS_PUBLISHED" }
              as: ShipperRep
              as_user_id: "${shipper_id}"
              captures: { d_a: $.data.id }
            - call: "POST /fmc/invoices/${inv_b}/disputes"
              payload: { dispute_reason: "CHARGE_EXCEEDS_PUBLISHED" }
              as: ShipperRep
              as_user_id: "${shipper_id}"
              captures: { d_b: $.data.id }
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-10T09:30:00Z" }
              as: CommissionAdmin
            - call: "POST /fmc/invoice-disputes/${d_a}/respond"
              payload: { resolution: "DENY", denial_justification: "Charge matches the published tariff" }
              as: CarrierRep
              as_user_id: "${carrier_id}"
              captures: { res_a: $.data.resolution, late_a: $.data.response_was_late }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-10T09:30:01Z" }
              as: CommissionAdmin
            - call: "POST /fmc/invoice-disputes/${d_b}/respond"
              payload: { resolution: "DENY", denial_justification: "One second late" }
              as: CarrierRep
              as_user_id: "${carrier_id}"
              captures: { res_b: $.data.resolution, late_b: $.data.response_was_late }
          assert:
            - "InvoiceDispute.${d_a}.resolution == DENIED and response_was_late == false (responded exactly at response_due_at 2026-10-10T09:30:00Z)"
            - "Invoice.${inv_a}.invoice_status == ISSUED (timely denial leaves the charge standing)"
            - "InvoiceDispute.${d_b}.resolution == UPHELD_WAIVED, requested_resolution == DENY, and response_was_late == true (one second past the deadline forces the waiver)"
            - "Invoice.${inv_b}.invoice_status == VOIDED and InvoiceDispute.${d_b}.resolved_amount_cents == 0"
            - "GET /fmc/carriers/${carrier_id} shows compliance_score == 975 (1000 - 25 SCORE_PENALTY_LATE_DISPUTE_RESPONSE)"

      - name: bond_coverage_at_exact_required_minimum
        grounds:
          - calculations.bond_coverage_tracking
          - state_machines.OTILicense.PENDING_BOND_to_ACTIVE
          - entities.OTILicense.fields.required_bond_cents
        distinguishing_aspect: |
          Money-metric boundary on a different endpoint: a bond of 7499999
          cents leaves the NVOCC license PENDING_BOND, and appending a second
          bond of exactly 1 cent (total 7500000 == required_bond_cents)
          activates it — the >= comparison admits exact equality.
        test_recipe:
          setup:
            - "NVOCC carrier with a fresh OTILicense (PENDING_BOND, required_bond_cents 7500000)."
          setup_api_calls:
            - *d_clock_start
            - call: "POST /fmc/carriers"
              payload: { org_name: "Precision Forwarders", org_type: "NVOCC" }
              as: CommissionAdmin
              captures: { carrier_id: $.data.id }
            - call: "POST /fmc/carriers/${carrier_id}/oti-licenses"
              payload: { license_type: "NVOCC" }
              as: CarrierRep
              as_user_id: "${carrier_id}"
              captures: { lic_id: $.data.id }
          trigger:
            - call: "POST /fmc/oti-licenses/${lic_id}/surety-bonds"
              payload: { bond_ref: "B-SHORT", surety_name: "Pacific Surety", coverage_cents: 7499999 }
              as: CarrierRep
              as_user_id: "${carrier_id}"
              captures: { status_short: $.data.license_status, total_short: $.data.total_available_coverage_cents }
            - call: "POST /fmc/oti-licenses/${lic_id}/surety-bonds"
              payload: { bond_ref: "B-EXACT", surety_name: "Pacific Surety", coverage_cents: 1 }
              as: CarrierRep
              as_user_id: "${carrier_id}"
              captures: { status_exact: $.data.license_status, total_exact: $.data.total_available_coverage_cents }
          assert:
            - "after the 7499999-cent bond: license_status == PENDING_BOND and total_available_coverage_cents == 7499999 (1 cent short)"
            - "after the 1-cent bond: license_status == ACTIVE and total_available_coverage_cents == 7500000 — exact equality with required_bond_cents satisfies the >= rule"

  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:

      - name: invoice_creation_requires_tariff_published
        grounds:
          - validations[priority=6.5]
          - state_machines.TariffPublication.DRAFT_to_PUBLISHED
          - errors.ERR_TARIFF_NOT_PUBLISHED
        distinguishing_aspect: |
          Entity pair Invoice -> TariffPublication: invoice creation is gated
          on the referenced tariff's publication_status — DRAFT rejects with
          ERR_TARIFF_NOT_PUBLISHED even though the effective_date has passed,
          and the same request succeeds once the tariff is PUBLISHED.
        test_recipe:
          setup:
            - "VOCC carrier, shipper, and a tariff whose effective_date 2026-09-02 has passed but which is still DRAFT (clock 2026-09-05T00:00:00Z)."
          setup_api_calls:
            - *d_clock_start
            - call: "POST /fmc/carriers"
              payload: { org_name: "Gatekeeper Lines", org_type: "VOCC" }
              as: CommissionAdmin
              captures: { carrier_id: $.data.id, carrier_v: $.data.version }
            - *d_mk_shipper
            - call: "POST /fmc/carriers/${carrier_id}/tariff-publications"
              payload: { tariff_code: "DD-GATE-1", charge_scope: "DEMURRAGE", free_time_days: 2, per_diem_rate_cents: 5000, accrual_method: "CALENDAR", change_type: "NEW", effective_date: "2026-09-02T00:00:00Z", expected_carrier_version: "${carrier_v}" }
              as: CarrierRep
              as_user_id: "${carrier_id}"
              captures: { t_gate: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-05T00:00:00Z" }
              as: CommissionAdmin
          trigger:
            - call: "POST /fmc/carriers/${carrier_id}/invoices"
              payload: { invoice_number: "INV-GATE-1", charge_basis: "TARIFF", tariff_id: "${t_gate}", billed_party_shipper_id: "${shipper_id}", container_number: "MSKU6000001", port_code: "USNYC", availability_date: "2026-09-03T00:00:00Z", return_date: "2026-09-04T00:00:00Z", last_accrual_date: "2026-09-04T00:00:00Z" }
              as: CarrierRep
              as_user_id: "${carrier_id}"
              captures: { error_id: $.data.error_id }
            - call: "POST /fmc/tariff-publications/${t_gate}/publish"
              payload: {}
              as: CarrierRep
              as_user_id: "${carrier_id}"
            - call: "POST /fmc/carriers/${carrier_id}/invoices"
              payload: { invoice_number: "INV-GATE-2", charge_basis: "TARIFF", tariff_id: "${t_gate}", billed_party_shipper_id: "${shipper_id}", container_number: "MSKU6000002", port_code: "USNYC", availability_date: "2026-09-03T00:00:00Z", return_date: "2026-09-05T00:00:00Z", last_accrual_date: "2026-09-05T00:00:00Z" }
              as: CarrierRep
              as_user_id: "${carrier_id}"
              captures: { inv_gate: $.data.id }
          assert:
            - "the first attempt fails with 409 ERR_TARIFF_NOT_PUBLISHED (tariff DRAFT — the passed effective_date does not help)"
            - "after publish, the identical invoice body succeeds with 201 and invoice_status == ISSUED"
            - "Invoice.${inv_gate}.billable_days == 0 (return exactly at free_time_end) and amount_cents == 0 — a zero-amount invoice is still issuable"

      - name: nvocc_invoice_requires_active_oti_license
        grounds:
          - validations[priority=6.5]
          - state_machines.OTILicense
          - errors.ERR_LICENSE_NOT_ACTIVE
        distinguishing_aspect: |
          Entity pair Invoice -> OTILicense (distinct from Invoice ->
          TariffPublication): a NVOCC carrier with a PUBLISHED tariff cannot
          invoice while it holds no license or a PENDING_BOND license; only
          after bond coverage reaches the required minimum does the same
          request succeed.
        test_recipe:
          setup:
            - "NVOCC carrier with a PUBLISHED tariff (free 2 days, 5000/day, effective 2026-09-02, published 2026-09-03); clock 2026-09-05T00:00:00Z."
          setup_api_calls:
            - *d_clock_start
            - call: "POST /fmc/carriers"
              payload: { org_name: "Unlicensed Logistics", org_type: "NVOCC" }
              as: CommissionAdmin
              captures: { carrier_id: $.data.id, carrier_v: $.data.version }
            - *d_mk_shipper
            - call: "POST /fmc/carriers/${carrier_id}/tariff-publications"
              payload: { tariff_code: "DD-LIC-1", charge_scope: "DEMURRAGE", free_time_days: 2, per_diem_rate_cents: 5000, accrual_method: "CALENDAR", change_type: "NEW", effective_date: "2026-09-02T00:00:00Z", expected_carrier_version: "${carrier_v}" }
              as: CarrierRep
              as_user_id: "${carrier_id}"
              captures: { t_lic: $.data.id }
            - *d_clock_sep03
            - call: "POST /fmc/tariff-publications/${t_lic}/publish"
              payload: {}
              as: CarrierRep
              as_user_id: "${carrier_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-05T00:00:00Z" }
              as: CommissionAdmin
          trigger:
            - call: "POST /fmc/carriers/${carrier_id}/invoices"
              payload: { invoice_number: "INV-LIC-1", charge_basis: "TARIFF", tariff_id: "${t_lic}", billed_party_shipper_id: "${shipper_id}", container_number: "MSKU7000001", port_code: "USNYC", availability_date: "2026-09-03T00:00:00Z", return_date: "2026-09-04T00:00:00Z", last_accrual_date: "2026-09-04T00:00:00Z" }
              as: CarrierRep
              as_user_id: "${carrier_id}"
              captures: { error_id: $.data.error_id }
            - call: "POST /fmc/carriers/${carrier_id}/oti-licenses"
              payload: { license_type: "NVOCC" }
              as: CarrierRep
              as_user_id: "${carrier_id}"
              captures: { lic_id: $.data.id }
            - call: "POST /fmc/carriers/${carrier_id}/invoices"
              payload: { invoice_number: "INV-LIC-2", charge_basis: "TARIFF", tariff_id: "${t_lic}", billed_party_shipper_id: "${shipper_id}", container_number: "MSKU7000002", port_code: "USNYC", availability_date: "2026-09-03T00:00:00Z", return_date: "2026-09-04T00:00:00Z", last_accrual_date: "2026-09-04T00:00:00Z" }
              as: CarrierRep
              as_user_id: "${carrier_id}"
              captures: { error_id2: $.data.error_id }
            - call: "POST /fmc/oti-licenses/${lic_id}/surety-bonds"
              payload: { bond_ref: "B1", surety_name: "Pacific Surety", coverage_cents: 7500000 }
              as: CarrierRep
              as_user_id: "${carrier_id}"
            - call: "POST /fmc/carriers/${carrier_id}/invoices"
              payload: { invoice_number: "INV-LIC-3", charge_basis: "TARIFF", tariff_id: "${t_lic}", billed_party_shipper_id: "${shipper_id}", container_number: "MSKU7000003", port_code: "USNYC", availability_date: "2026-09-03T00:00:00Z", return_date: "2026-09-04T00:00:00Z", last_accrual_date: "2026-09-04T00:00:00Z" }
              as: CarrierRep
              as_user_id: "${carrier_id}"
              captures: { inv_lic: $.data.id }
          assert:
            - "with no license at all: 409 ERR_LICENSE_NOT_ACTIVE"
            - "with the license stuck PENDING_BOND (no bond posted): 409 ERR_LICENSE_NOT_ACTIVE again"
            - "after the 7500000-cent bond activates the license: 201 and Invoice.${inv_lic}.invoice_status == ISSUED"

  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:

      - name: monitoring_reports_half_open_adjacency_allowed_overlap_rejected
        grounds:
          - validations[priority=9]
          - entities.CarrierAgreement.fields.monitoring_reports
          - errors.ERR_MONITORING_PERIOD_OVERLAP
        distinguishing_aspect: |
          Half-open interval semantics on the CarrierAgreement resource:
          [2026-01-01, 2026-04-01) and [2026-04-01, 2026-07-01) touch at a
          boundary and are both accepted, while [2026-03-01, 2026-05-01)
          properly intersects the first and is rejected — adjacency is not
          overlap under [start, end) arithmetic.
        test_recipe:
          setup:
            - "Two VOCC carriers and a filed agreement AG-2026-02."
          setup_api_calls:
            - *d_clock_start
            - call: "POST /fmc/carriers"
              payload: { org_name: "Overlap Alpha Lines", org_type: "VOCC" }
              as: CommissionAdmin
              captures: { ca_id: $.data.id }
            - call: "POST /fmc/carriers"
              payload: { org_name: "Overlap Beta Lines", org_type: "VOCC" }
              as: CommissionAdmin
              captures: { cb_id: $.data.id }
            - call: "POST /fmc/carrier-agreements"
              payload: { agreement_number: "AG-2026-02", agreement_type: "SPACE_CHARTER", member_carrier_ids: ["${ca_id}", "${cb_id}"] }
              as: CarrierRep
              as_user_id: "${ca_id}"
              captures: { ag_id: $.data.id }
          trigger:
            - call: "POST /fmc/carrier-agreements/${ag_id}/monitoring-reports"
              payload: { reporting_period_start: "2026-01-01T00:00:00Z", reporting_period_end: "2026-04-01T00:00:00Z", total_market_teus: 1000, member_volumes: [{ carrier_id: "${ca_id}", carried_teus: 300 }, { carrier_id: "${cb_id}", carried_teus: 200 }] }
              as: CarrierRep
              as_user_id: "${ca_id}"
            - call: "POST /fmc/carrier-agreements/${ag_id}/monitoring-reports"
              payload: { reporting_period_start: "2026-04-01T00:00:00Z", reporting_period_end: "2026-07-01T00:00:00Z", total_market_teus: 1000, member_volumes: [{ carrier_id: "${ca_id}", carried_teus: 300 }, { carrier_id: "${cb_id}", carried_teus: 200 }] }
              as: CarrierRep
              as_user_id: "${ca_id}"
            - call: "POST /fmc/carrier-agreements/${ag_id}/monitoring-reports"
              payload: { reporting_period_start: "2026-03-01T00:00:00Z", reporting_period_end: "2026-05-01T00:00:00Z", total_market_teus: 1000, member_volumes: [{ carrier_id: "${ca_id}", carried_teus: 300 }, { carrier_id: "${cb_id}", carried_teus: 200 }] }
              as: CarrierRep
              as_user_id: "${ca_id}"
              captures: { error_id: $.data.error_id }
          assert:
            - "the first two reports are accepted (201 each): the second starts exactly where the first ends, and half-open [start, end) periods do not intersect there"
            - "the third is rejected: 409 ERR_MONITORING_PERIOD_OVERLAP ([2026-03-01, 2026-05-01) intersects both stored periods)"
            - "GET /fmc/carrier-agreements/${ag_id} shows exactly 2 embedded monitoring_reports and market_concentration_hhi == 1300.0"

      - name: port_week_berth_capacity_aggregate_ceiling
        grounds:
          - validations[priority=9]
          - entities.PortCongestionReport
          - errors.ERR_PORT_CAPACITY_EXCEEDED
        distinguishing_aspect: |
          Aggregate-capacity interval semantics on the PortCongestionReport
          resource — different from the half-open non-overlap rule: reports
          for the SAME (port_code, week_start) may coexist across terminals,
          but their berth_occupancy_hours sum must stay <= 672; 600 + 72 is
          accepted exactly at the ceiling and one further hour is rejected.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z; no congestion reports yet."
          setup_api_calls:
            - *d_clock_start
          trigger:
            - call: "POST /fmc/port-congestion-reports"
              payload: { port_code: "USSEA", terminal_code: "TERM-1", week_start: "2026-09-07T00:00:00Z", berth_occupancy_hours: 168, gate_closures_hours: 5, vessel_dwell_hours_avg: 72.0 }
              as: CommissionDocket
            - call: "POST /fmc/port-congestion-reports"
              payload: { port_code: "USSEA", terminal_code: "TERM-2", week_start: "2026-09-07T00:00:00Z", berth_occupancy_hours: 168, gate_closures_hours: 0, vessel_dwell_hours_avg: 48.0 }
              as: CommissionDocket
            - call: "POST /fmc/port-congestion-reports"
              payload: { port_code: "USSEA", terminal_code: "TERM-3", week_start: "2026-09-07T00:00:00Z", berth_occupancy_hours: 168, gate_closures_hours: 0, vessel_dwell_hours_avg: 40.0 }
              as: CommissionDocket
            - call: "POST /fmc/port-congestion-reports"
              payload: { port_code: "USSEA", terminal_code: "TERM-4", week_start: "2026-09-07T00:00:00Z", berth_occupancy_hours: 168, gate_closures_hours: 0, vessel_dwell_hours_avg: 38.0 }
              as: CommissionDocket
            - call: "POST /fmc/port-congestion-reports"
              payload: { port_code: "USSEA", terminal_code: "TERM-5", week_start: "2026-09-07T00:00:00Z", berth_occupancy_hours: 1, gate_closures_hours: 0, vessel_dwell_hours_avg: 10.0 }
              as: CommissionDocket
              captures: { error_id: $.data.error_id }
            - call: "POST /fmc/port-congestion-reports"
              payload: { port_code: "USSEA", terminal_code: "TERM-5", week_start: "2026-09-07T00:00:00Z", berth_occupancy_hours: 1, gate_closures_hours: 0, vessel_dwell_hours_avg: 10.0 }
              as: CommissionDocket
              captures: { error_id2: $.data.error_id }
          assert:
            - "the four 168-hour reports are all accepted (201): 4 x 168 == 672 equals PORT_WEEKLY_BERTH_CAPACITY_HOURS exactly, and <= admits equality"
            - "the fifth report is rejected: 409 ERR_PORT_CAPACITY_EXCEEDED (672 + 1 > 672)"
            - "the failing report is not stored — the identical TERM-5 retry is rejected again with ERR_PORT_CAPACITY_EXCEEDED (not ERR_DUPLICATE_CONGESTION_REPORT)"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:

      - name: bond_draw_and_reversal_conserve_coverage_identity
        grounds:
          - calculations.bond_coverage_tracking
          - concurrency_rules[bond-draw-stale-license]
        distinguishing_aspect: |
          Conserved quantity: per-bond surety capacity. A +3000000 draw
          followed by its -3000000 reversal leaves drawn_cents + available_cents
          == coverage_cents == 7500000 at every step, and the license rides
          the coverage threshold down to SUSPENDED and back to ACTIVE — the
          compensating pair leaves zero drift in the ledger.
        test_recipe:
          setup:
            - "NVOCC carrier with an ACTIVE license via one 7500000-cent bond B1."
          setup_api_calls:
            - *d_clock_start
            - call: "POST /fmc/carriers"
              payload: { org_name: "Ledger Lines", org_type: "NVOCC" }
              as: CommissionAdmin
              captures: { carrier_id: $.data.id }
            - call: "POST /fmc/carriers/${carrier_id}/oti-licenses"
              payload: { license_type: "NVOCC" }
              as: CarrierRep
              as_user_id: "${carrier_id}"
              captures: { lic_id: $.data.id }
            - call: "POST /fmc/oti-licenses/${lic_id}/surety-bonds"
              payload: { bond_ref: "B1", surety_name: "Pacific Surety", coverage_cents: 7500000 }
              as: CarrierRep
              as_user_id: "${carrier_id}"
              captures: { lic_v: $.data.version }
          trigger:
            - call: "POST /fmc/oti-licenses/${lic_id}/draws"
              payload: { bond_ref: "B1", amount_cents: 3000000, reason: "claim CAM-1", expected_license_version: "${lic_v}" }
              as: EnforcementCounsel
              as_user_id: "ec-1"
              captures: { lic_v2: $.data.version, status_after_draw: $.data.license_status, total_after_draw: $.data.total_available_coverage_cents }
            - call: "POST /fmc/oti-licenses/${lic_id}/draws"
              payload: { bond_ref: "B1", amount_cents: -3000000, reason: "claim CAM-1 repaid", expected_license_version: "${lic_v2}" }
              as: EnforcementCounsel
              as_user_id: "ec-1"
              captures: { status_after_reversal: $.data.license_status, total_after_reversal: $.data.total_available_coverage_cents }
          assert:
            - "after the draw: B1 drawn_cents == 3000000, available_cents == 4500000, and drawn + available == 7500000 == coverage_cents"
            - "after the draw the license is SUSPENDED (4500000 < 7500000 required) and version advanced (lic_v2 == lic_v + 1)"
            - "after the reversal: B1 drawn_cents == 0, available_cents == 7500000, and drawn + available == coverage_cents still holds"
            - "the license is ACTIVE again — the compensating action restored the exact pre-draw state, not an approximation"

      - name: reparation_award_and_reversal_conserve_shipper_ledger
        grounds:
          - calculations.reparation_award
          - state_machines.Complaint.APPEALED_to_REVERSED
          - entities.ShipperAccount.fields.total_recovery_cents
        distinguishing_aspect: |
          Conserved quantity: the shipper's recovery ledger. A decision
          credits +110250 (OUT_OF_POCKET: 105000 paid charge + 5250 interest)
          and the appeal REVERSE debits exactly the same amount —
          total_recovery_cents returns to its pre-decision value 0, a
          different conserved quantity than the bond-coverage identity.
        test_recipe:
          setup:
            - "VOCC carrier with PUBLISHED CALENDAR tariff (free 4, 15000/day); shipper with one PAID 105000-cent invoice; clean DOCKETED complaint (score 100, claimed 200000) already in ADJUDICATION_OPEN under judge alj-1."
          setup_api_calls:
            - *d_clock_start
            - call: "POST /fmc/carriers"
              payload: { org_name: "Reversal Carriers", org_type: "VOCC" }
              as: CommissionAdmin
              captures: { carrier_id: $.data.id, carrier_v: $.data.version }
            - *d_mk_shipper
            - call: "POST /fmc/carriers/${carrier_id}/tariff-publications"
              payload: { tariff_code: "DD-REV-1", charge_scope: "DEMURRAGE", free_time_days: 4, per_diem_rate_cents: 15000, accrual_method: "CALENDAR", change_type: "NEW", effective_date: "2026-09-02T00:00:00Z", expected_carrier_version: "${carrier_v}" }
              as: CarrierRep
              as_user_id: "${carrier_id}"
              captures: { t_rev: $.data.id }
            - *d_clock_sep03
            - call: "POST /fmc/tariff-publications/${t_rev}/publish"
              payload: {}
              as: CarrierRep
              as_user_id: "${carrier_id}"
            - *d_clock_sep15
            - call: "POST /fmc/carriers/${carrier_id}/invoices"
              payload: { invoice_number: "INV-REV-1", charge_basis: "TARIFF", tariff_id: "${t_rev}", billed_party_shipper_id: "${shipper_id}", container_number: "MSKU8000001", port_code: "USNYC", availability_date: "2026-09-04T00:00:00Z", return_date: "2026-09-14T12:00:00Z", last_accrual_date: "2026-09-14T12:00:00Z" }
              as: CarrierRep
              as_user_id: "${carrier_id}"
              captures: { inv_rev: $.data.id }
            - call: "POST /fmc/invoices/${inv_rev}/mark-paid"
              payload: {}
              as: ShipperRep
              as_user_id: "${shipper_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-20T00:00:00Z" }
              as: CommissionAdmin
            - call: "POST /fmc/complaints"
              payload: { respondent_carrier_id: "${carrier_id}", subject_invoice_ids: ["${inv_rev}"], reparations_claimed_cents: 200000 }
              as: ShipperRep
              as_user_id: "${shipper_id}"
              captures: { comp_rev: $.data.id }
            - call: "POST /fmc/complaints/${comp_rev}/open-adjudication"
              payload: {}
              as: AdministrativeLawJudge
              as_user_id: "alj-1"
            - call: "GET /fmc/shippers/${shipper_id}"
              payload: {}
              as: CommissionDocket
              captures: { recovery_before: $.data.total_recovery_cents }
            - call: "POST /fmc/complaints/${comp_rev}/decide"
              payload: {}
              as: AdministrativeLawJudge
              as_user_id: "alj-1"
              captures: { award: $.data.reparations_awarded_cents }
            - call: "POST /fmc/complaints/${comp_rev}/appeal"
              payload: {}
              as: CarrierRep
              as_user_id: "${carrier_id}"
          trigger:
            - call: "POST /fmc/complaints/${comp_rev}/resolve-appeal"
              payload: { decision: "REVERSE" }
              as: CommissionAdmin
          assert:
            - "the decision credited exactly 110250 (OUT_OF_POCKET: 105000 + round_half_up(105000 x 0.05) = 5250 interest)"
            - "ShipperAccount.${shipper_id}.total_recovery_cents == 110250 after the decision and == 0 after the reversal (== recovery_before)"
            - "Complaint.${comp_rev}.reparations_awarded_cents == 0 and complaint_status == REVERSED after the reversal"
            - "the appeal was filed by the respondent carrier within the window (decided_at 2026-09-20T00:00:00Z, appeal_deadline 2026-10-20T00:00:00Z)"
