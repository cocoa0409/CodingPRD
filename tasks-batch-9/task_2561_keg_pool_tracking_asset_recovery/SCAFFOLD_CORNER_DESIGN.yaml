              captures: { d1_id: "$.data.id" }
            - call: "POST /pools"
              payload: { pool_code: "HB-50L", size_liters: 50, stainless_weight_kg: 12.5, replacement_cost_cents: 23500, region_code: "CO" }
              as: PoolOperator
              as_user_id: "op-1"
              captures: { p1_id: "$.data.id" }
            - call: "POST /pools/${p1_id}/kegs"
              payload: { asset_tag: "K-0001" }
              as: PoolOperator
              as_user_id: "op-1"
              captures: { k1_id: "$.data.id" }
            - call: "POST /pools/${p1_id}/kegs"
              payload: { asset_tag: "K-0002", fill_count: 5, fills_at_last_pressure_test: 5 }
              as: PoolOperator
              as_user_id: "op-1"
              captures: { k2_id: "$.data.id" }
            - call: "POST /pools/${p1_id}/kegs"
              payload: { asset_tag: "K-0003", fill_count: 9, fills_at_last_pressure_test: 9 }
              as: PoolOperator
              as_user_id: "op-1"
            - call: "POST /float-agreements"
              payload: { brewer_id: "${b1_id}", pool_id: "${p1_id}", float_size_kegs: 2, per_fill_rate_cents: 2200 }
              as: PoolOperator
              as_user_id: "op-1"
              captures: { fa1_id: "$.data.id" }
            - call: "POST /float-agreements/${fa1_id}/activate"
              payload: { effective_date: "2026-08-01" }
              as: PoolOperator
              as_user_id: "op-1"
              captures: { fa1_v: "$.data.version" }
            - call: "POST /issuance-orders"
              payload: { agreement_id: "${fa1_id}", requested_keg_count: 2 }
              as: PoolOperator
              as_user_id: "op-1"
              captures: { o1_id: "$.data.id" }
            - call: "POST /issuance-orders/${o1_id}/allocate"
              payload: { expected_agreement_version: "${fa1_v}" }
              as: PoolOperator
              as_user_id: "op-1"
            - call: "POST /issuance-orders/${o1_id}/dispatch"
              payload: { dispatched_at: "2026-08-01T00:00:00Z" }
              as: PoolOperator
              as_user_id: "op-1"
            - call: "POST /kegs/${k1_id}/scan"
              payload: { scan_point: "FILL", party_type: "BREWER", scanned_at: "2026-08-03T00:00:00Z", brand_code_scanned: "RDG", brewer_id: "${b1_id}" }
              as: Brewer
              as_user_id: "${b1_id}"
          trigger:
            - call: "POST /kegs/${k1_id}/scan"
              payload: { scan_point: "DISTRIBUTION", party_type: "DISTRIBUTOR", scanned_at: "2026-08-04T00:00:00Z", brand_code_scanned: "ZZZ", distributor_id: "${d1_id}" }
              as: Distributor
              as_user_id: "${d1_id}"
              captures: { e_owner: "$.data.error_id" }
            - call: "POST /kegs/${k2_id}/scan"
