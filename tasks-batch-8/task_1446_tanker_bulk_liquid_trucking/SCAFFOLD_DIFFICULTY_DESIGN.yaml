        distinguishing_aspect: |
          Entity pair Shipment x TankWashCertificate (distinct from the
          sibling's SpillIncident x Shipment): Shipment's DRAFT->PLANNED
          transition is gated on the referenced certificate being in
          CERTIFIED — a SCHEDULED cert yields ERR_CERT_INVALID_STATE.
        test_recipe:
          setup:
            - "Wash certificate booked but NOT certified (SCHEDULED); shipment in DRAFT; trailer has no prior load so a cert is optional — but an attached one must be CERTIFIED"
          setup_api_calls:
