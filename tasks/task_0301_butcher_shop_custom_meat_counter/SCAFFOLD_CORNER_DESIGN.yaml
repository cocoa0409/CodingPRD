              as_user_id: "${ii_id}"
              captures: { order_id: "$.data.id" }
            - call: "GET /custom-orders/${order_id}/order-lines"
              payload: {}
              as: CounterClerk
              captures: { line_id: "$.data[0].id" }
            - call: "POST /custom-orders/${order_id}/confirm"
              payload: {}
              as: CounterClerk
            - call: "POST /inventory-lots"
              payload: { cut_type_id: "${ribeye_id}", received_weight_g: 2000 }
              as: Butcher
              captures: { lot_id: "$.data.id", lot_v: "$.data.version" }
          trigger:
