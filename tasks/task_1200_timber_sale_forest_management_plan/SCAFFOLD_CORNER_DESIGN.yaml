  - section: calculations
    instances:
      - name: certify_rejected_when_sampling_error_too_high
        claim_type: constants_applied
        grounds: [calculations.cruise_volume_estimate, "errors[ERR_SAMPLING_ERROR_TOO_HIGH]"]
        distinguishing_aspect: "With 5 reconciled plots of wildly varying volumes [100,2000,100,2000,100], sampling_error_pct computes to 48.40 > 10.00, so certify is rejected ERR_SAMPLING_ERROR_TOO_HIGH (min-plots passes, so the sampling check is what fires)."
        test_recipe:
          setup: ["cruise RECONCILED with 5 plots [100,2000,100,2000,100]"]
          setup_api_calls:
            - { call: "POST /forestry/foresters", payload: { license_no: "F-100", full_name: "Francis Forester", email: "f@x.com" }, as: PlatformAdmin, captures: { f_id: "$.data.id" } }
            - { call: "POST /forestry/landowners", payload: { full_name: "Lara Landowner", email: "l@x.com", tax_id: "T-1" }, as: PlatformAdmin, captures: { lo_id: "$.data.id" } }
