            - call: "POST /adoption-cycles"
              payload: { state_id: "${st_ga_id}", subject: "SCIENCE", cycle_year: 2027, submission_open_at: "2026-09-01T00:00:00Z", submission_deadline_at: "2026-10-01T00:00:00Z", committee_review_at: "2026-10-15T00:00:00Z", public_comment_start_at: "2026-11-01T00:00:00Z", public_comment_end_at: "2026-11-15T00:00:00Z", adoption_decision_at: "2026-12-01T00:00:00Z", contract_term_years: 6 }
              as: StateAdoptionOfficer
              as_user_id: "${st_ga_id}"
              captures: { cyc_id: $.data.id }
            - call: "POST /titles"
              payload: { isbn_base: "9780000001301", subject: "SCIENCE", grade_low: 5, grade_high: 5, copyright_year: 2026, content_tags: ["LAB_SAFETY"], page_count: 340, signature_page_capacity: 384, list_price_cents: 9200 }
              as: PublisherEditor
              captures: { ttl_id: $.data.id }
            - call: "POST /titles/${ttl_id}/release"
              payload: {}
              as: PublisherEditor
            - call: "POST /submissions"
              payload: { cycle_id: "${cyc_id}", title_id: "${ttl_id}" }
              as: PublisherEditor
              captures: { sub_id: $.data.id }
            - call: "POST /submissions/${sub_id}/correlations"
              payload: { standard_code: "GA.S.5.1", depth_level: "MASTERY", page_reference: "pp. 30-64", evidence_citation: "Investigations 1 through 4 assess the standard to mastery." }
              as: PublisherEditor
              captures: { corr_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-15T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /adoption-cycles/${cyc_id}/phase-advance"
              payload: {}
              as: StateAdoptionOfficer
              as_user_id: "${st_ga_id}"
            - call: "POST /submissions/${sub_id}/file"
              payload: {}
              as: PublisherEditor
            - call: "POST /submissions/${sub_id}/correlations/${corr_id}/verdict"
              payload: { verdict: "ACCEPT" }
              as: ReviewCommitteeMember
              as_user_id: "cm-1"
            - call: "GET /submissions/${sub_id}"
              payload: {}
              as: PricingManager
              captures: { sub_v1: $.data.version }
            - call: "POST /pricing-proposals"
              payload: { submission_id: "${sub_id}", base_price_cents: 9200, term_years: 4, annual_escalator_bps: 100, projected_adoption_units: 6000, digital_seat_price_cents: 1500, expected_submission_version: "${sub_v1}" }
              as: PricingManager
              captures: { prop_id: $.data.id }
            - call: "POST /pricing-proposals/${prop_id}/decision"
              payload: { verdict: "APPROVE" }
              as: StateAdoptionOfficer
              as_user_id: "${st_ga_id}"
            - call: "POST /committee-panels"
              payload: { cycle_id: "${cyc_id}", panel_label: "GA SCI Panel A", session_start_at: "2026-10-20T14:00:00Z", session_end_at: "2026-10-20T18:00:00Z", buffer_minutes: 10, member_count: 3, quorum_required: 3 }
              as: StateAdoptionOfficer
              as_user_id: "${st_ga_id}"
              captures: { pnl_id: $.data.id, pnl_v0: $.data.version }
            - call: "POST /committee-panels/${pnl_id}/slots"
              payload: { submission_id: "${sub_id}", start_at: "2026-10-20T14:00:00Z", end_at: "2026-10-20T14:30:00Z", expected_panel_version: "${pnl_v0}" }
              as: StateAdoptionOfficer
              as_user_id: "${st_ga_id}"
              captures: { slot_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-16T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /adoption-cycles/${cyc_id}/phase-advance"
              payload: {}
              as: StateAdoptionOfficer
              as_user_id: "${st_ga_id}"
            - call: "POST /adoption-cycles/${cyc_id}/phase-advance"
              payload: {}
              as: StateAdoptionOfficer
              as_user_id: "${st_ga_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-20T14:00:00Z" }
              as: PlatformAdmin
            - call: "POST /committee-panels/${pnl_id}/open-session"
              payload: {}
              as: StateAdoptionOfficer
