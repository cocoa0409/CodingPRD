scenario: "2391. Neurodiagnostic & Long-Term EEG Monitoring Unit (epilepsy monitoring unit): admission scheduling with medication reduction protocol and target event count, continuous video-EEG acquisition with technologist coverage and electrode maintenance, seizure detection alerting, nurse response and safety intervention documentation, study review, spike/seizure marking and interpretation turnaround, length-of-stay decisions balancing event capture against risk, ambulatory versus inpatient study selection and insurance authorization, data storage volume, retention and export for surgical evaluation, surgical candidacy conference workflow"
domain_name: "neurodiagnostic-emu"
api_prefix: "/neurodiagnostics"

complexity_profile:
  primary_archetype: workflow orchestration
  secondary_archetype: multi-party negotiation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
    - derived_field_reconciliation
  entity_topology: flat
  state_machine_shape: parallel
  relationship_patterns:
    - one_to_many
    - many_to_many
    - self_referential
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate
  difficulty_band: "beyond Expert (15 entities, 71 endpoints, 58 error codes, 9 calculations, 10 state machines, 2 OCC rules)"

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

entities:
  - name: MonitoringUnit
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: "Display name of the epilepsy monitoring unit."
      - name: bed_count
        type: integer
        source: input
        description: "Declared inpatient bed count of the unit; informational counterpart to the Bed rows actually created."
        constraints: ">= 1"
      - name: storage_quota_gb
        type: number
        source: input
        description: "Total EEG data storage quota in GB against which storage_pressure_pct is computed."
        constraints: "> 0, 2 decimal places"
      - name: storage_used_gb
        type: number
        source: computed
        description: "sum of Study.stored_gb for Studies of this unit with data_state IN {ONLINE, EXPORT_HELD} plus sum of ExportPackage.package_gb for packages of those Studies with status IN {BUILT, DELIVERED}. Recomputed on every Study segment close, export build, export revoke, archive, purge and retention sweep."
        default: 0
        constraints: "2 decimal places, round_half_up"
      - name: storage_pressure_pct
        type: number
        source: computed
        description: "round_half_up(storage_used_gb / storage_quota_gb * 100, 2) — see calculations.unit_storage_pressure."
        default: 0
        constraints: "2 decimal places, round_half_up"
      - name: posture
        type: enum
        source: computed
        description: "Derived gating posture of the unit; STORAGE_LOCKED wins over COVERAGE_CONSTRAINED (see calculations.unit_storage_pressure)."
        default: OPEN
        constraints: "OPEN | COVERAGE_CONSTRAINED | STORAGE_LOCKED"
      - name: beds_available
        type: integer
        source: computed
        description: "count of Bed rows of this unit whose computed status == AVAILABLE."
        default: 0
      - name: active_study_count
        type: integer
        source: computed
        description: "count of Study rows of this unit (via Admission.unit_id) with acquisition_state == ACQUIRING."
        default: 0
      - name: coverage_capacity
        type: integer
        source: computed
        description: "sum of TechnologistShift.max_concurrent_studies over shifts of this unit whose computed state == ACTIVE and whose half-open window [starts_at, ends_at) contains the current logical clock."
        default: 0
      - name: late_response_count
        type: integer
        source: computed
        description: "count of SeizureAlert rows on Studies of this unit with response_state == RESPONDED_LATE."
        default: 0
      - name: retention_sweep_index
        type: integer
        source: computed
        description: "Number of completed retention sweeps (POST /neurodiagnostics/units/{id}/retention-sweep) executed on this unit; increments by 1 per sweep."
        default: 0

  - name: Bed
    parent: MonitoringUnit
    common_fields: true
    fields:
      - name: unit_id
        type: string
        source: input
        description: "FK -> MonitoringUnit.id; the unit that owns this bed."
      - name: label
        type: string
        source: input
        description: "Human-readable bed label, unique within the unit."
      - name: status
        type: enum
        source: computed
        description: "AVAILABLE when no Admission occupies the bed and (released_at IS NULL OR current logical clock >= turnover_clear_at); OCCUPIED while an Admission with clinical_state IN {ADMITTED, CAPTURE_TARGET_MET} holds bed_id == this Bed.id; TURNOVER when released_at IS NOT NULL and current logical clock < turnover_clear_at."
        default: AVAILABLE
        constraints: "AVAILABLE | OCCUPIED | TURNOVER"
      - name: released_at
        type: datetime
        source: computed
        description: "Logical-clock instant at which the last occupying Admission was discharged; NULL if the bed has never been occupied."
      - name: turnover_clear_at
        type: datetime
        source: computed
        description: "released_at + TURNOVER_BUFFER_MINUTES (90) — the first instant at which the bed may be re-occupied; NULL when released_at IS NULL."
      - name: current_admission_id
        type: string
        source: computed
        description: "Computed back-reference to the Admission whose bed_id == this Bed.id and whose clinical_state IN {ADMITTED, CAPTURE_TARGET_MET}; NULL when the bed is not occupied."

  - name: TechnologistShift
    parent: MonitoringUnit
    common_fields: true
    fields:
      - name: unit_id
        type: string
        source: input
        description: "FK -> MonitoringUnit.id; the unit this shift covers."
      - name: technologist_user_id
        type: string
        source: input
        description: "Opaque X-User-ID of the Technologist rostered for this shift; never compared to any entity id."
      - name: starts_at
        type: datetime
        source: input
        description: "Inclusive start of the coverage window."
      - name: ends_at
        type: datetime
        source: input
        description: "Exclusive end of the coverage window; must be strictly after starts_at."
      - name: max_concurrent_studies
        type: integer
        source: input
        description: "Aggregate acquisition capacity of this shift: how many Studies may be in acquisition_state IN {ACQUIRING, PAUSED} against this shift at once."
        constraints: ">= 1"
      - name: state
        type: enum
        source: computed
        description: "SCHEDULED on creation; ACTIVE after POST activate; CLOSED after POST close."
        default: SCHEDULED
        constraints: "SCHEDULED | ACTIVE | CLOSED"
      - name: assigned_study_count
        type: integer
        source: computed
        description: "count of Study rows with shift_id == this shift and acquisition_state IN {ACQUIRING, PAUSED}."
        default: 0

  - name: Patient
    parent: null
    common_fields: true
    fields:
      - name: mrn
        type: string
        source: input
        description: "Medical record number, unique across Patients."
      - name: display_name
        type: string
        source: input
        description: "Patient display name."
      - name: risk_tier
        type: enum
        source: input
        description: "Clinical risk tier driving BASE_RISK in calculations.los_extension_decision and TIER_BASE in calculations.alert_response_deadline."
        constraints: "LOW | MODERATE | HIGH"

  - name: AuthorizationRequest
    parent: Patient
    common_fields: true
    fields:
      - name: patient_id
        type: string
        source: input
        description: "FK -> Patient.id; the patient this payer authorization covers."
      - name: requested_setting
        type: enum
        source: input
        description: "Setting the unit asked the payer to authorize."
        constraints: "INPATIENT_VEEG | AMBULATORY_VEEG"
      - name: requested_days
        type: integer
        source: input
        description: "Number of monitored days requested from the payer."
        constraints: ">= 1"
      - name: status
        type: enum
        source: computed
        description: "Authorization lifecycle state; PENDED returns the request to the unit for one more submission attempt."
        default: DRAFT
        constraints: "DRAFT | SUBMITTED | PENDED | APPROVED | DENIED"
      - name: authorized_setting
        type: enum
        source: computed
        description: "Setting the payer actually approved; NULL until status == APPROVED."
        constraints: "INPATIENT_VEEG | AMBULATORY_VEEG"
      - name: authorized_days
        type: integer
        source: computed
        description: "Total monitored days the payer approved; 0 until status == APPROVED. Ledger invariant: authorized_days == days_consumed + days_reserved + days_available."
        default: 0
      - name: days_reserved
        type: integer
        source: computed
        description: "Authorized days currently held by an Admission that has not yet been discharged (planned_days at admission, plus days granted by extension decisions)."
        default: 0
      - name: days_consumed
        type: integer
        source: computed
        description: "Authorized days permanently spent: ceil of elapsed_monitored_days at discharge, capped at the days that were reserved."
        default: 0
      - name: days_available
        type: integer
        source: computed
        description: "authorized_days - days_consumed - days_reserved; the pool an extension decision may draw from."
        default: 0
      - name: resubmission_count
        type: integer
        source: computed
        description: "Number of PENDED -> SUBMITTED resubmissions performed; capped by MAX_RESUBMISSIONS (2)."
        default: 0
      - name: payer_note
        type: string
        source: computed
        description: "Free-text note supplied by the PayerReviewer on the most recent decision; NULL until a decision is recorded."

  - name: Admission
    parent: null
    common_fields: true
    fields:
      - name: patient_id
        type: string
        source: input
        description: "FK -> Patient.id; the monitored patient."
      - name: authorization_id
        type: string
        source: input
        description: "FK -> AuthorizationRequest.id; the payer authorization funding this stay."
      - name: unit_id
        type: string
        source: input
        description: "FK -> MonitoringUnit.id; the unit performing the monitoring."
      - name: bed_id
        type: string
        source: computed
        description: "FK -> Bed.id; assigned by POST admit for INPATIENT_VEEG admissions and NULL for AMBULATORY_VEEG; cleared on discharge."
      - name: setting
        type: enum
        source: input
        description: "Requested monitoring setting; must equal AuthorizationRequest.authorized_setting at admit time."
        constraints: "INPATIENT_VEEG | AMBULATORY_VEEG"
      - name: scheduled_admit_at
        type: datetime
        source: input
        description: "Planned admission instant."
      - name: target_event_count
        type: integer
        source: input
        description: "Number of weighted events the epileptologist wants captured before discharge."
        constraints: ">= 1"
      - name: planned_days
        type: integer
        source: input
        description: "Days of monitoring initially reserved against the authorization."
        constraints: ">= 1"
      - name: admitted_at
        type: datetime
        source: computed
        description: "Logical-clock instant of POST admit; NULL while clinical_state == SCHEDULED."
      - name: discharged_at
        type: datetime
        source: computed
        description: "Logical-clock instant of POST discharge; NULL until clinical_state == DISCHARGED."
      - name: planned_discharge_at
        type: datetime
        source: computed
        description: "admitted_at + (planned_days + sum of granted extension days) * 24h; NULL while clinical_state == SCHEDULED."
      - name: clinical_state
        type: enum
        source: computed
        description: "First parallel state dimension: bedside monitoring lifecycle."
        default: SCHEDULED
        constraints: "SCHEDULED | ADMITTED | CAPTURE_TARGET_MET | DISCHARGED"
      - name: authorization_state
        type: enum
        source: computed
        description: "Second parallel state dimension: payer-day posture, evolving independently of clinical_state."
        default: AUTH_PENDING
        constraints: "AUTH_PENDING | AUTH_ACTIVE | AUTH_EXHAUSTED | AUTH_CLOSED"
      - name: weighted_event_count
        type: number
        source: computed
        description: "Sum of EventMarking.weight over markings of this admission's Studies with status == ADJUDICATED and event_class IN {CLINICAL_SEIZURE, SUBCLINICAL_SEIZURE} — see calculations.capture_adequacy_index."
        default: 0
        constraints: "3 decimal places, round_half_up"
      - name: capture_adequacy_index
        type: number
        source: computed
        description: "RETROSPECTIVE_ADJUDICATED variant of calculations.capture_adequacy_index; the only variant that drives the CAPTURE_TARGET_MET transition."
        default: 0
        constraints: "3 decimal places, round_half_up"
      - name: capture_adequacy_index_prospective
        type: number
        source: computed
        description: "PROSPECTIVE variant of calculations.capture_adequacy_index; advisory only, never gates a transition."
        default: 0
        constraints: "3 decimal places, round_half_up"
      - name: projected_daily_yield
        type: number
        source: computed
        description: "weighted_event_count / elapsed_monitored_days, 3 decimal places round_half_up; 0 when elapsed_monitored_days == 0."
        default: 0
      - name: deficit_weighted
        type: number
        source: computed
        description: "max(0, target_event_count - weighted_event_count), 3 decimal places round_half_up."
        default: 0
      - name: elapsed_monitored_days
        type: number
        source: computed
        description: "(current logical clock - admitted_at) in days, 3 decimal places round_half_up; frozen at discharged_at once clinical_state == DISCHARGED; 0 while SCHEDULED."
        default: 0
      - name: extension_count
        type: integer
        source: computed
        description: "Number of extension decisions recorded against this admission."
        default: 0
      - name: last_extension_outcome
        type: enum
        source: computed
        description: "Outcome of the most recent extension decision; NULL until extension_count >= 1."
        constraints: "GRANTED | DENIED_RISK | DENIED_AUTH_DAYS | DENIED_TARGET_MET"
      - name: last_extension_granted_days
        type: integer
        source: computed
        description: "Days granted by the most recent extension decision; 0 when the decision denied the extension."
        default: 0
      - name: disposition
        type: enum
        source: computed
        description: "Discharge disposition recorded by POST discharge; NULL until clinical_state == DISCHARGED."
        constraints: "ROUTINE | SURGICAL_EVALUATION | TERMINATED_EARLY"

  - name: TaperPlan
    parent: Admission
    common_fields: true
    fields:
      - name: admission_id
        type: string
        source: input
        description: "FK -> Admission.id; the stay this medication-reduction protocol belongs to."
      - name: total_steps
        type: integer
        source: input
        description: "Number of reduction steps in the protocol."
        constraints: ">= 1"
      - name: current_step
        type: integer
        source: computed
        description: "Steps already advanced; 0 at creation, incremented by POST advance-step, capped at total_steps."
        default: 0
      - name: status
        type: enum
        source: computed
        description: "ACTIVE while reducing, HELD when paused for safety, COMPLETED when current_step == total_steps, ABORTED when the admission is discharged before completion."
        default: ACTIVE
        constraints: "ACTIVE | HELD | COMPLETED | ABORTED"
      - name: hold_reason
        type: string
        source: computed
        description: "Reason recorded by POST hold; NULL unless the plan has ever been HELD."

  - name: Study
    parent: Admission
    common_fields: true
    fields:
      - name: admission_id
        type: string
        source: input
        description: "FK -> Admission.id; the stay this recording belongs to."
      - name: shift_id
        type: string
        source: computed
        description: "FK -> TechnologistShift.id; the shift that authorized acquisition, pinned by POST start and retained thereafter."
      - name: channel_count
        type: integer
        source: input
        description: "Number of recorded EEG channels; drives storage volume."
        constraints: ">= 8"
      - name: modality
        type: enum
        source: input
        description: "Acquisition modality; must equal Admission.setting."
        constraints: "INPATIENT_VEEG | AMBULATORY_VEEG"
      - name: acquisition_state
        type: enum
        source: computed
        description: "First parallel state dimension: recording lifecycle."
        default: PREPARING
        constraints: "PREPARING | ACQUIRING | PAUSED | COMPLETED"
      - name: data_state
        type: enum
        source: computed
        description: "Second parallel state dimension: data-residency lifecycle, evolving independently of acquisition_state."
        default: ONLINE
        constraints: "ONLINE | EXPORT_HELD | ARCHIVED | PURGED"
      - name: acquired_minutes
        type: integer
        source: computed
        description: "Sum of the durations in whole minutes of all closed acquisition segments; the open segment is not counted until it closes."
        default: 0
      - name: stored_gb
        type: number
        source: computed
        description: "Per-segment-rounded storage volume of this study — see calculations.study_storage_gb (rounding order pinned)."
        default: 0
        constraints: "2 decimal places, round_half_up"
      - name: closed_segment_count
        type: integer
        source: computed
        description: "Number of acquisition segments closed by POST pause or POST complete."
        default: 0
      - name: current_segment_started_at
        type: datetime
        source: computed
        description: "Logical-clock instant at which the currently open segment began (POST start or POST resume); NULL when acquisition_state IN {PREPARING, PAUSED, COMPLETED}."
      - name: completed_at
        type: datetime
        source: computed
        description: "Logical-clock instant of POST complete; NULL until acquisition_state == COMPLETED."
      - name: last_impedance_kohm
        type: number
        source: computed
        description: "Electrode impedance recorded by the most recent POST pause carrying maintenance_kind == ELECTRODE_REGEL; NULL when never recorded."
      - name: impedance_fail_count
        type: integer
        source: computed
        description: "Number of maintenance pauses whose impedance_kohm exceeded IMPEDANCE_LIMIT_KOHM (10.00)."
        default: 0
      - name: export_hold_reason
        type: string
        source: computed
        description: "Reason recorded by POST export-hold; NULL unless data_state has been EXPORT_HELD."

  - name: SeizureAlert
    parent: Study
    common_fields: true
    fields:
      - name: study_id
        type: string
        source: input
        description: "FK -> Study.id; the recording the alert fired on."
      - name: source
        type: enum
        source: input
        description: "Origin of the alert."
        constraints: "ALGORITHM | TECHNOLOGIST | PATIENT_PUSH_BUTTON"
      - name: detected_at
        type: datetime
        source: computed
        description: "Logical-clock instant at which the alert was raised."
      - name: triage_state
        type: enum
        source: computed
        description: "First parallel state dimension: fork on adjudication then join at CLOSED."
        default: DETECTED
        constraints: "DETECTED | CONFIRMED_CLINICAL | CONFIRMED_SUBCLINICAL | REJECTED_ARTIFACT | CLOSED"
      - name: response_state
        type: enum
        source: computed
        description: "Second parallel state dimension: nurse bedside response timeliness, evolving independently of triage_state."
        default: AWAITING_RESPONSE
        constraints: "AWAITING_RESPONSE | RESPONDED_ON_TIME | RESPONDED_LATE"
      - name: response_deadline_minutes
        type: integer
        source: computed
        description: "Nurse response deadline in whole minutes, frozen at detection — see calculations.alert_response_deadline."
        default: 0
      - name: responded_at
        type: datetime
        source: computed
        description: "Logical-clock instant of the first SafetyIntervention recorded against this alert; NULL while response_state == AWAITING_RESPONSE."
      - name: latency_minutes
        type: integer
        source: computed
        description: "floor((responded_at - detected_at) in minutes); NULL while response_state == AWAITING_RESPONSE."
      - name: adjudicated_at
        type: datetime
        source: computed
        description: "Logical-clock instant of POST adjudicate; NULL while triage_state == DETECTED."

  - name: SafetyIntervention
    parent: SeizureAlert
    common_fields: false
    fields:
      - name: alert_id
        type: string
        source: input
        description: "FK -> SeizureAlert.id; the alert this bedside response documents."
      - name: nurse_user_id
        type: string
        source: system
        description: "X-User-ID of the Nurse who recorded the intervention; opaque operator id."
      - name: interventions
        type: array
        source: input
        description: "Non-empty list of bedside actions performed."
        constraints: "each member IN {POSITIONING, SUCTION, OXYGEN, SEIZURE_TESTING, VITALS, RESCUE_MEDICATION, PHYSICIAN_NOTIFIED}; length >= 1"
      - name: injury_observed
        type: boolean
        source: input
        description: "Whether the nurse observed injury during the event."
      - name: rescue_med_given
        type: boolean
        source: input
        description: "Whether a rescue medication was administered."
      - name: recorded_at
        type: datetime
        source: system
        description: "Logical-clock instant at which the intervention was recorded."

  - name: EventMarking
    parent: Study
    common_fields: true
    fields:
      - name: study_id
        type: string
        source: input
        description: "FK -> Study.id; the recording the marking annotates."
      - name: alert_id
        type: string
        source: input
        description: "FK -> SeizureAlert.id; the alert this marking substantiates, or NULL for a review-time marking that no alert produced."
      - name: onset_at
        type: datetime
        source: input
        description: "Electrographic onset instant; must fall inside a closed acquisition segment of the study."
      - name: duration_seconds
        type: integer
        source: input
        description: "Event duration in seconds."
        default: 60
        constraints: ">= 1"
      - name: event_class
        type: enum
        source: input
        description: "Marking class; only CLINICAL_SEIZURE and SUBCLINICAL_SEIZURE carry capture weight."
        constraints: "CLINICAL_SEIZURE | SUBCLINICAL_SEIZURE | SPIKE_BURST | ARTIFACT"
      - name: status
        type: enum
        source: computed
        description: "PROPOSED on creation, ADJUDICATED once an Epileptologist confirms it, RETRACTED when withdrawn."
        default: PROPOSED
        constraints: "PROPOSED | ADJUDICATED | RETRACTED"
      - name: taper_step_at_onset
        type: integer
        source: computed
        description: "TaperPlan.current_step of the admission's TaperPlan captured at marking creation; 0 when the admission has no TaperPlan."
        default: 0
      - name: weight
        type: number
        source: computed
        description: "CLASS_WEIGHT[event_class] * (TAPER_PROVOKED_DISCOUNT if taper_step_at_onset >= 2 else 1), 3 decimal places round_half_up; 0 for SPIKE_BURST and ARTIFACT."
        default: 0
      - name: adjudicated_at
        type: datetime
        source: computed
        description: "Logical-clock instant of adjudication; NULL while status != ADJUDICATED."
      - name: retraction_reason
        type: string
        source: computed
        description: "Reason recorded by POST retract; NULL while status != RETRACTED."

  - name: ReviewReport
    parent: Study
    common_fields: true
    fields:
      - name: study_id
        type: string
        source: input
        description: "FK -> Study.id; the recording being interpreted. The report row is synthesized by the Study ACQUIRING/PAUSED -> COMPLETED transition, so this FK is only observable through GET /neurodiagnostics/studies/{id}/reports."
      - name: status
        type: enum
        source: computed
        description: "Interpretation lifecycle."
        default: PRELIM_DRAFT
        constraints: "PRELIM_DRAFT | PRELIM_ISSUED | ADDENDUM_OPEN | FINAL_ISSUED"
      - name: localization
        type: string
        source: computed
        description: "Seizure-onset localization text supplied by the most recent issue call; NULL while status == PRELIM_DRAFT."
      - name: prelim_issued_at
        type: datetime
        source: computed
        description: "Logical-clock instant of POST issue-prelim; NULL while status == PRELIM_DRAFT."
      - name: final_issued_at
        type: datetime
        source: computed
        description: "Logical-clock instant of POST issue-final; NULL until status == FINAL_ISSUED."
      - name: prelim_author_user_id
        type: string
        source: computed
        description: "X-User-ID of the Epileptologist who issued the preliminary report; opaque operator id."
      - name: final_author_user_id
        type: string
        source: computed
        description: "X-User-ID of the Epileptologist who issued the final report; must differ from prelim_author_user_id."
      - name: turnaround_calendar_hours
        type: number
        source: computed
        description: "CALENDAR_CLOCK variant of calculations.interpretation_turnaround; NULL while status == PRELIM_DRAFT."
        constraints: "2 decimal places, round_half_up"
      - name: turnaround_coverage_hours
        type: number
        source: computed
        description: "COVERAGE_CLOCK variant of calculations.interpretation_turnaround; the only variant that drives sla_breached."
        constraints: "2 decimal places, round_half_up"
      - name: sla_breached
        type: boolean
        source: computed
        description: "TRUE iff turnaround_coverage_hours > SLA_PRELIM_COVERAGE_HOURS (8)."
        default: false
      - name: addendum_count
        type: integer
        source: computed
        description: "Number of addenda opened on this report; capped by MAX_ADDENDA (2)."
        default: 0
      - name: addendum_reason
        type: string
        source: computed
        description: "Reason recorded by the most recent POST open-addendum; NULL when addendum_count == 0."

  - name: ExportPackage
    parent: Study
    common_fields: true
    fields:
      - name: study_id
        type: string
        source: input
        description: "FK -> Study.id; the recording being exported for surgical evaluation."
      - name: include_video
        type: boolean
        source: input
        description: "Whether synchronized video is included; drives package_gb."
      - name: supersedes_export_id
        type: string
        source: input
        description: "FK -> ExportPackage.id; self-referential pointer to the package this one replaces, or NULL for a first-generation package."
      - name: status
        type: enum
        source: computed
        description: "Export lifecycle; BLOCKED is entered automatically when the unit posture becomes STORAGE_LOCKED while the package is QUEUED."
        default: QUEUED
        constraints: "QUEUED | BLOCKED | BUILT | DELIVERED | REVOKED | PURGED"
      - name: package_gb
        type: number
        source: computed
        description: "Allocated package volume in GB, computed at build time — see calculations.export_package_gb; 0 while status IN {QUEUED, BLOCKED}."
        default: 0
        constraints: "2 decimal places, round_half_up"
      - name: built_at
        type: datetime
        source: computed
        description: "Logical-clock instant of POST build; NULL while status IN {QUEUED, BLOCKED}."
      - name: delivered_at
        type: datetime
        source: computed
        description: "Logical-clock instant of POST deliver; NULL until status == DELIVERED."
      - name: recipient_center
        type: string
        source: computed
        description: "Surgical center the package was delivered to; NULL until status == DELIVERED."
      - name: retention_expires_at
        type: datetime
        source: computed
        description: "built_at + RETENTION_DAYS (30) * 24h; the instant from which a retention sweep may purge the package. NULL while status IN {QUEUED, BLOCKED}."
      - name: blocked_reason
        type: string
        source: computed
        description: "Reason recorded when the package was auto-BLOCKED; NULL unless status has been BLOCKED."
      - name: revocation_reason
        type: string
        source: computed
        description: "Reason recorded by POST revoke; NULL unless status == REVOKED."

  - name: SurgicalConferenceCase
    parent: Admission
    common_fields: true
    fields:
      - name: admission_id
        type: string
        source: input
        description: "FK -> Admission.id; the stay whose surgical candidacy is being decided."
      - name: export_id
        type: string
        source: input
        description: "FK -> ExportPackage.id; the delivered export package the conference reviews."
      - name: status
        type: enum
        source: computed
        description: "Conference lifecycle; DEFERRED returns to PRESENTED for another voting round."
        default: DRAFT
        constraints: "DRAFT | PRESENTED | CANDIDATE | NON_CANDIDATE | DEFERRED"
      - name: presenter_user_id
        type: string
        source: computed
        description: "X-User-ID of the Epileptologist who presented the case; this user's vote is never counted (segregation of duties)."
      - name: defer_round
        type: integer
        source: computed
        description: "Number of completed DEFERRED rounds; capped by MAX_DEFER_ROUNDS (2)."
        default: 0
      - name: eligible_vote_count
        type: integer
        source: computed
        description: "count of ConferenceVote rows on this case with counted == TRUE and round_index == defer_round."
        default: 0
      - name: candidate_votes
        type: integer
        source: computed
        description: "count of counted ConferenceVote rows in the current round with vote == CANDIDATE."
        default: 0
      - name: non_candidate_votes
        type: integer
        source: computed
        description: "count of counted ConferenceVote rows in the current round with vote == NON_CANDIDATE."
        default: 0
      - name: defer_votes
        type: integer
        source: computed
        description: "count of counted ConferenceVote rows in the current round with vote == DEFER."
        default: 0
      - name: distinct_specialty_count
        type: integer
        source: computed
        description: "count of distinct ConferenceVote.specialty values over counted votes in the current round."
        default: 0
      - name: quorum_met
        type: boolean
        source: computed
        description: "TRUE iff eligible_vote_count >= QUORUM_MIN (3) AND distinct_specialty_count >= QUORUM_SPECIALTY_MIN (2)."
        default: false
      - name: decision_at
        type: datetime
        source: computed
        description: "Logical-clock instant at which the case reached CANDIDATE or NON_CANDIDATE; NULL otherwise."

  - name: ConferenceVote
    parent: SurgicalConferenceCase
    common_fields: false
    fields:
      - name: case_id
        type: string
        source: input
        description: "FK -> SurgicalConferenceCase.id; the case being voted on."
      - name: voter_user_id
        type: string
        source: system
        description: "X-User-ID of the voting Epileptologist; opaque operator id, unique per case per round."
      - name: specialty
        type: enum
        source: input
        description: "Specialty the voter represents at the conference."
        constraints: "EPILEPTOLOGY | NEUROSURGERY | NEUROPSYCHOLOGY | NEURORADIOLOGY"
      - name: vote
        type: enum
        source: input
        description: "Ballot cast in the current round."
        constraints: "CANDIDATE | NON_CANDIDATE | DEFER"
      - name: rationale
        type: string
        source: input
        description: "Optional free-text rationale."
      - name: counted
        type: boolean
        source: computed
        description: "FALSE when voter_user_id == SurgicalConferenceCase.presenter_user_id, TRUE otherwise; only counted votes enter the tally."
        default: true
      - name: round_index
        type: integer
        source: computed
        description: "SurgicalConferenceCase.defer_round at the instant the ballot was cast."
        default: 0

state_machines:
  - entity: AuthorizationRequest
    initial_state: DRAFT
    terminal_states: [APPROVED, DENIED]
    note: "Cyclic shape: SUBMITTED -> PENDED -> SUBMITTED negotiation rounds, capped at MAX_RESUBMISSIONS (2)."
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /neurodiagnostics/authorizations/{id}/submit"
        actor: UnitCoordinator
        preconditions: ["status == DRAFT"]
        side_effects: ["sets payer_note to NULL", "increments AuthorizationRequest.version by 1"]
      - from: SUBMITTED
        to: PENDED
        trigger: "POST /neurodiagnostics/authorizations/{id}/payer-decision with outcome == PEND"
        actor: PayerReviewer
        preconditions: ["status == SUBMITTED"]
        side_effects: ["sets payer_note from request", "increments AuthorizationRequest.version by 1"]
      - from: PENDED
        to: SUBMITTED
        trigger: "POST /neurodiagnostics/authorizations/{id}/submit"
        actor: UnitCoordinator
        preconditions: ["status == PENDED", "resubmission_count < MAX_RESUBMISSIONS (2) else ERR_RESUBMISSION_LIMIT"]
        side_effects: ["increments resubmission_count by 1", "increments AuthorizationRequest.version by 1"]
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /neurodiagnostics/authorizations/{id}/payer-decision with outcome == APPROVE"
        actor: PayerReviewer
        preconditions: ["status == SUBMITTED", "authorized_days >= 1 supplied in request else ERR_INVALID_REQUEST", "authorized_setting supplied in request else ERR_INVALID_REQUEST"]
        side_effects: ["sets authorized_setting and authorized_days from request", "sets days_available = authorized_days, days_reserved = 0, days_consumed = 0", "sets payer_note from request", "increments AuthorizationRequest.version by 1"]
      - from: SUBMITTED
        to: DENIED
        trigger: "POST /neurodiagnostics/authorizations/{id}/payer-decision with outcome == DENY"
        actor: PayerReviewer
        preconditions: ["status == SUBMITTED"]
        side_effects: ["leaves authorized_days at 0", "sets payer_note from request", "increments AuthorizationRequest.version by 1"]

  - entity: TechnologistShift
    initial_state: SCHEDULED
    terminal_states: [CLOSED]
    transitions:
      - from: SCHEDULED
        to: ACTIVE
        trigger: "POST /neurodiagnostics/technologist-shifts/{id}/activate"
        actor: UnitCoordinator
        preconditions: ["state == SCHEDULED"]
        side_effects: ["recomputes MonitoringUnit.coverage_capacity", "recomputes MonitoringUnit.posture", "increments TechnologistShift.version by 1"]
      - from: ACTIVE
        to: CLOSED
        trigger: "POST /neurodiagnostics/technologist-shifts/{id}/close"
        actor: UnitCoordinator
        preconditions: ["state == ACTIVE", "assigned_study_count == 0 else ERR_SHIFT_HAS_ACTIVE_STUDIES"]
        side_effects: ["recomputes MonitoringUnit.coverage_capacity", "recomputes MonitoringUnit.posture", "increments TechnologistShift.version by 1"]

  - entity: Admission
    initial_state: "SCHEDULED x AUTH_PENDING"
    terminal_states: ["DISCHARGED x AUTH_CLOSED"]
    note: "Parallel dimensions: clinical_state (SCHEDULED | ADMITTED | CAPTURE_TARGET_MET | DISCHARGED) evolves independently of authorization_state (AUTH_PENDING | AUTH_ACTIVE | AUTH_EXHAUSTED | AUTH_CLOSED). Dimension 1 transitions are bedside actions; dimension 2 transitions are payer-day ledger events."
    transitions:
      - from: SCHEDULED
        to: ADMITTED
        trigger: "POST /neurodiagnostics/admissions/{id}/admit"
        actor: UnitCoordinator
        preconditions:
          # listed in the §1.4 priority order, which is authoritative when several are violated at once
          - "clinical_state == SCHEDULED else ERR_INVALID_ADMISSION_STATE (priority 6)"
          - "if AuthorizationRequest.status == APPROVED: Admission.setting == AuthorizationRequest.authorized_setting else ERR_SETTING_MISMATCH (priority 13)"
          - "for INPATIENT_VEEG with bed_id supplied: Bed.status == AVAILABLE, i.e. Bed has no current_admission_id AND (Bed.released_at IS NULL OR current logical clock >= Bed.turnover_clear_at) else ERR_BED_OCCUPANCY_CONFLICT (priority 14)"
          - "setting == INPATIENT_VEEG requires bed_id in request else ERR_BED_REQUIRED_FOR_INPATIENT; setting == AMBULATORY_VEEG forbids bed_id else ERR_BED_NOT_ALLOWED_FOR_AMBULATORY (priority 15)"
          - "AuthorizationRequest.status == APPROVED else ERR_AUTHORIZATION_NOT_APPROVED (priority 19)"
          - "AuthorizationRequest.days_available >= planned_days else ERR_AUTHORIZATION_DAYS_EXHAUSTED (priority 20)"
          - "MonitoringUnit.posture != STORAGE_LOCKED else ERR_UNIT_STORAGE_LOCKED (priority 21)"
        side_effects:
          - "sets admitted_at = current logical clock"
          - "sets bed_id from request for INPATIENT_VEEG; Bed.status becomes OCCUPIED and Bed.current_admission_id = Admission.id"
          - "sets planned_discharge_at = admitted_at + planned_days * 24h"
          - "moves authorization_state AUTH_PENDING -> AUTH_ACTIVE"
          - "AuthorizationRequest.days_reserved += planned_days and days_available -= planned_days (ledger invariant preserved)"
          - "increments Admission.version by 1"
      - from: ADMITTED
        to: CAPTURE_TARGET_MET
        trigger: "system: recomputation of capture_adequacy_index reaches >= 1.000 (link 3 of the alert-adjudication cascade)"
        actor: system
        preconditions: ["clinical_state == ADMITTED", "capture_adequacy_index >= 1.000"]
        side_effects:
          - "cascade link 4: every TaperPlan of this admission with status IN {ACTIVE, HELD} moves to COMPLETED"
          - "increments Admission.version by 1"
      - from: CAPTURE_TARGET_MET
        to: ADMITTED
        trigger: "system: recomputation of capture_adequacy_index falls below 1.000 after an EventMarking retraction (compensating cascade)"
        actor: system
        preconditions: ["clinical_state == CAPTURE_TARGET_MET", "capture_adequacy_index < 1.000"]
        side_effects:
          - "compensation: every TaperPlan of this admission whose status == COMPLETED and current_step < total_steps returns to ACTIVE"
          - "increments Admission.version by 1"
      - from: ADMITTED
        to: DISCHARGED
        trigger: "POST /neurodiagnostics/admissions/{id}/discharge"
        actor: UnitCoordinator
        preconditions:
          - "clinical_state IN {ADMITTED, CAPTURE_TARGET_MET}"
          - "no Study of this admission has acquisition_state IN {PREPARING, ACQUIRING, PAUSED} else ERR_OPEN_STUDY_ON_DISCHARGE"
        side_effects:
          - "sets discharged_at = current logical clock and freezes elapsed_monitored_days"
          - "sets disposition from request"
          - "AuthorizationRequest.days_consumed += min(days_reserved, ceil(elapsed_monitored_days)); days_reserved -= that amount then any remainder returns to days_available (ledger invariant preserved)"
          - "moves authorization_state to AUTH_CLOSED"
          - "for INPATIENT_VEEG: Bed.current_admission_id = NULL, Bed.released_at = discharged_at, Bed.turnover_clear_at = discharged_at + 90 minutes, Bed.status becomes TURNOVER; Admission.bed_id is cleared"
          - "every TaperPlan of this admission with status IN {ACTIVE, HELD} moves to ABORTED"
          - "increments Admission.version by 1"
      - from: CAPTURE_TARGET_MET
        to: DISCHARGED
        trigger: "POST /neurodiagnostics/admissions/{id}/discharge"
        actor: UnitCoordinator
        preconditions:
          - "clinical_state == CAPTURE_TARGET_MET"
          - "no Study of this admission has acquisition_state IN {PREPARING, ACQUIRING, PAUSED} else ERR_OPEN_STUDY_ON_DISCHARGE"
        side_effects: ["same ledger, bed-release and taper-abort side effects as the ADMITTED -> DISCHARGED transition", "increments Admission.version by 1"]
      - from: AUTH_ACTIVE
        to: AUTH_EXHAUSTED
        trigger: "system: an extension decision leaves AuthorizationRequest.days_available == 0, or the decision outcome is DENIED_AUTH_DAYS"
        actor: system
        preconditions: ["authorization_state == AUTH_ACTIVE"]
        side_effects: ["recomputes capture_adequacy_index_prospective (its input set includes days_available)", "increments Admission.version by 1"]
      - from: AUTH_EXHAUSTED
        to: AUTH_CLOSED
        trigger: "POST /neurodiagnostics/admissions/{id}/discharge"
        actor: UnitCoordinator
        preconditions: ["authorization_state == AUTH_EXHAUSTED"]
        side_effects: ["same ledger side effects as the clinical discharge transition", "increments Admission.version by 1"]

  - entity: TaperPlan
    initial_state: ACTIVE
    terminal_states: [ABORTED]
    note: "Cyclic shape: ACTIVE self-loops on advance-step, ACTIVE <-> HELD on hold/resume, and COMPLETED -> ACTIVE when a retraction cascade revokes CAPTURE_TARGET_MET."
    transitions:
      - from: ACTIVE
        to: ACTIVE
        trigger: "POST /neurodiagnostics/taper-plans/{id}/advance-step"
        actor: Epileptologist
        preconditions:
          - "status == ACTIVE"
          - "current_step < total_steps (structural invariant: reaching total_steps moves the plan to COMPLETED, so an ACTIVE plan always has at least one step left)"
          - "Admission.clinical_state == ADMITTED else ERR_INVALID_ADMISSION_STATE"
          - "no SeizureAlert on this admission's Studies has triage_state == CONFIRMED_CLINICAL (an unclosed confirmed clinical event) else ERR_TAPER_BLOCKED_BY_OPEN_EVENT"
        side_effects:
          - "increments current_step by 1"
          - "when current_step == total_steps the plan moves to COMPLETED"
          - "raises the risk terms of calculations.los_extension_decision and calculations.alert_response_deadline for subsequent evaluations"
          - "increments TaperPlan.version by 1"
      - from: ACTIVE
        to: HELD
        trigger: "POST /neurodiagnostics/taper-plans/{id}/hold"
        actor: Epileptologist
        preconditions: ["status == ACTIVE"]
        side_effects: ["sets hold_reason from request", "increments TaperPlan.version by 1"]
      - from: HELD
        to: ACTIVE
        trigger: "POST /neurodiagnostics/taper-plans/{id}/resume"
        actor: Epileptologist
        preconditions: ["status == HELD", "Admission.clinical_state == ADMITTED else ERR_INVALID_ADMISSION_STATE"]
        side_effects: ["increments TaperPlan.version by 1"]
      - from: ACTIVE
        to: COMPLETED
        trigger: "system: current_step reaches total_steps, or the admission enters CAPTURE_TARGET_MET (cascade link 4)"
        actor: system
        preconditions: ["status == ACTIVE"]
        side_effects: ["freezes current_step", "increments TaperPlan.version by 1"]
      - from: HELD
        to: COMPLETED
        trigger: "system: the admission enters CAPTURE_TARGET_MET (cascade link 4)"
        actor: system
        preconditions: ["status == HELD"]
        side_effects: ["increments TaperPlan.version by 1"]
      - from: COMPLETED
        to: ACTIVE
        trigger: "system: the admission leaves CAPTURE_TARGET_MET back to ADMITTED after an EventMarking retraction"
        actor: system
        preconditions: ["status == COMPLETED", "current_step < total_steps"]
        side_effects: ["increments TaperPlan.version by 1"]
      - from: ACTIVE
        to: ABORTED
        trigger: "system: the admission is discharged"
        actor: system
        preconditions: ["status IN {ACTIVE, HELD}"]
        side_effects: ["increments TaperPlan.version by 1"]
      - from: HELD
        to: ABORTED
        trigger: "system: the admission is discharged"
        actor: system
        preconditions: ["status == HELD"]
        side_effects: ["increments TaperPlan.version by 1"]

  - entity: Study
    initial_state: "PREPARING x ONLINE"
    terminal_states: ["COMPLETED x PURGED"]
    note: "Parallel dimensions: acquisition_state (PREPARING | ACQUIRING | PAUSED | COMPLETED) and data_state (ONLINE | EXPORT_HELD | ARCHIVED | PURGED) evolve independently; ARCHIVED is guarded by acquisition_state == COMPLETED."
    transitions:
      - from: PREPARING
        to: ACQUIRING
        trigger: "POST /neurodiagnostics/studies/{id}/start"
        actor: Technologist
        preconditions:
          - "acquisition_state == PREPARING else ERR_INVALID_STUDY_STATE"
          - "Admission.clinical_state == ADMITTED else ERR_INVALID_ADMISSION_STATE"
          - "Study.modality == Admission.setting else ERR_SETTING_MISMATCH"
          - "TechnologistShift.state == ACTIVE AND current logical clock IN [starts_at, ends_at) else ERR_NO_TECH_COVERAGE"
          - "TechnologistShift.assigned_study_count < TechnologistShift.max_concurrent_studies else ERR_TECH_CAPACITY_EXCEEDED"
          - "MonitoringUnit.posture != STORAGE_LOCKED else ERR_UNIT_STORAGE_LOCKED"
        side_effects:
          - "pins shift_id from request and sets current_segment_started_at = current logical clock"
          - "increments TechnologistShift.assigned_study_count"
          - "increments MonitoringUnit.active_study_count and recomputes MonitoringUnit.posture (may become COVERAGE_CONSTRAINED)"
          - "increments Study.version by 1"
      - from: ACQUIRING
        to: PAUSED
        trigger: "POST /neurodiagnostics/studies/{id}/pause"
        actor: Technologist
        preconditions: ["acquisition_state == ACQUIRING else ERR_INVALID_STUDY_STATE"]
        side_effects:
          - "closes the open segment: acquired_minutes += floor((now - current_segment_started_at) in minutes), closed_segment_count += 1, current_segment_started_at = NULL"
          - "recomputes stored_gb per calculations.study_storage_gb (round per segment, then sum)"
          - "recomputes MonitoringUnit.storage_used_gb, storage_pressure_pct and posture"
          - "when maintenance_kind == ELECTRODE_REGEL: sets last_impedance_kohm from request and increments impedance_fail_count when impedance_kohm > IMPEDANCE_LIMIT_KOHM (10.00)"
          - "decrements MonitoringUnit.active_study_count"
          - "increments Study.version by 1"
      - from: PAUSED
        to: ACQUIRING
        trigger: "POST /neurodiagnostics/studies/{id}/resume"
        actor: Technologist
        preconditions:
          - "acquisition_state == PAUSED else ERR_INVALID_STUDY_STATE"
          - "TechnologistShift.state == ACTIVE AND current logical clock IN [starts_at, ends_at) else ERR_NO_TECH_COVERAGE"
          - "MonitoringUnit.posture != STORAGE_LOCKED else ERR_UNIT_STORAGE_LOCKED"
        side_effects:
          - "opens a new segment: current_segment_started_at = current logical clock"
          - "increments MonitoringUnit.active_study_count and recomputes MonitoringUnit.posture"
          - "increments Study.version by 1"
      - from: ACQUIRING
        to: COMPLETED
        trigger: "POST /neurodiagnostics/studies/{id}/complete"
        actor: Technologist
        preconditions: ["acquisition_state == ACQUIRING else ERR_INVALID_STUDY_STATE"]
        side_effects:
          - "closes the open segment and recomputes acquired_minutes, closed_segment_count and stored_gb per calculations.study_storage_gb"
          - "sets completed_at = current logical clock"
          - "decrements TechnologistShift.assigned_study_count and MonitoringUnit.active_study_count, then recomputes MonitoringUnit.posture"
          - "creates exactly one ReviewReport for this Study with status PRELIM_DRAFT (discoverable only via GET /neurodiagnostics/studies/{id}/reports)"
          - "recomputes MonitoringUnit.storage_used_gb and storage_pressure_pct"
          - "increments Study.version by 1"
      - from: PAUSED
        to: COMPLETED
        trigger: "POST /neurodiagnostics/studies/{id}/complete"
        actor: Technologist
        preconditions: ["acquisition_state == PAUSED else ERR_INVALID_STUDY_STATE"]
        side_effects:
          - "no open segment to close; acquired_minutes and stored_gb are unchanged"
          - "sets completed_at = current logical clock"
          - "decrements TechnologistShift.assigned_study_count"
          - "creates exactly one ReviewReport for this Study with status PRELIM_DRAFT"
          - "increments Study.version by 1"
      - from: ONLINE
        to: EXPORT_HELD
        trigger: "POST /neurodiagnostics/studies/{id}/export-hold"
        actor: UnitCoordinator
        preconditions: ["data_state == ONLINE else ERR_INVALID_DATA_STATE"]
        side_effects:
          - "sets export_hold_reason from request"
          - "every ExportPackage of this Study with status == QUEUED moves to BLOCKED with blocked_reason = 'STUDY_EXPORT_HELD'"
          - "increments Study.version by 1"
      - from: EXPORT_HELD
        to: ONLINE
        trigger: "POST /neurodiagnostics/studies/{id}/export-release"
        actor: UnitCoordinator
        preconditions: ["data_state == EXPORT_HELD else ERR_INVALID_DATA_STATE"]
        side_effects:
          - "every ExportPackage of this Study with status == BLOCKED and blocked_reason == 'STUDY_EXPORT_HELD' returns to QUEUED"
          - "increments Study.version by 1"
      - from: ONLINE
        to: ARCHIVED
        trigger: "POST /neurodiagnostics/studies/{id}/archive"
        actor: UnitCoordinator
        preconditions:
          - "data_state == ONLINE else ERR_INVALID_DATA_STATE"
          - "acquisition_state == COMPLETED else ERR_INVALID_STUDY_STATE (guarded cross-dimension transition)"
        side_effects:
          - "removes this Study's stored_gb from MonitoringUnit.storage_used_gb, then recomputes storage_pressure_pct and posture"
          - "when posture leaves STORAGE_LOCKED, every ExportPackage of this unit with status == BLOCKED and blocked_reason == 'UNIT_STORAGE_LOCKED' returns to QUEUED"
          - "increments Study.version by 1"
      - from: ARCHIVED
        to: PURGED
        trigger: "POST /neurodiagnostics/units/{id}/retention-sweep (system pass over archived studies whose admission is DISCHARGED)"
        actor: system
        preconditions: ["data_state == ARCHIVED", "Admission.clinical_state == DISCHARGED"]
        side_effects: ["increments Study.version by 1"]

  - entity: SeizureAlert
    initial_state: "DETECTED x AWAITING_RESPONSE"
    terminal_states: ["CLOSED"]
    note: "Fork-join on triage_state (DETECTED forks into CONFIRMED_CLINICAL | CONFIRMED_SUBCLINICAL | REJECTED_ARTIFACT with divergent side-effect sets, joining at CLOSED) running in parallel with response_state."
    transitions:
      - from: DETECTED
        to: CONFIRMED_CLINICAL
        trigger: "POST /neurodiagnostics/alerts/{id}/adjudicate with classification == CLINICAL"
        actor: Epileptologist
        preconditions: ["triage_state == DETECTED else ERR_INVALID_ALERT_STATE", "at least one SafetyIntervention exists for this alert else ERR_INTERVENTION_REQUIRED"]
        side_effects:
          - "sets adjudicated_at = current logical clock"
          - "cascade link 1: every EventMarking with alert_id == this alert and status == PROPOSED moves to ADJUDICATED"
          - "cascade link 2: that EventMarking transition recomputes Admission.weighted_event_count, capture_adequacy_index, capture_adequacy_index_prospective, projected_daily_yield and deficit_weighted"
          - "cascade link 3: when capture_adequacy_index >= 1.000 the Admission moves ADMITTED -> CAPTURE_TARGET_MET"
          - "increments SeizureAlert.version by 1"
      - from: DETECTED
        to: CONFIRMED_SUBCLINICAL
        trigger: "POST /neurodiagnostics/alerts/{id}/adjudicate with classification == SUBCLINICAL"
        actor: Epileptologist
        preconditions: ["triage_state == DETECTED else ERR_INVALID_ALERT_STATE"]
        side_effects:
          - "sets adjudicated_at = current logical clock"
          - "no SafetyIntervention is required on this branch"
          - "every EventMarking with alert_id == this alert and status == PROPOSED moves to ADJUDICATED, which recomputes the Admission capture fields"
          - "increments SeizureAlert.version by 1"
      - from: DETECTED
        to: REJECTED_ARTIFACT
        trigger: "POST /neurodiagnostics/alerts/{id}/adjudicate with classification == ARTIFACT"
        actor: Epileptologist
        preconditions: ["triage_state == DETECTED else ERR_INVALID_ALERT_STATE"]
        side_effects:
          - "sets adjudicated_at = current logical clock"
          - "every EventMarking with alert_id == this alert and status == PROPOSED moves to RETRACTED with retraction_reason = 'ALERT_REJECTED_AS_ARTIFACT'; Admission capture fields are recomputed and do not increase"
          - "increments SeizureAlert.version by 1"
      - from: CONFIRMED_CLINICAL
        to: CLOSED
        trigger: "POST /neurodiagnostics/alerts/{id}/close"
        actor: Epileptologist
        preconditions: ["triage_state IN {CONFIRMED_CLINICAL, CONFIRMED_SUBCLINICAL, REJECTED_ARTIFACT}", "response_state != AWAITING_RESPONSE for the CONFIRMED_CLINICAL branch else ERR_INTERVENTION_REQUIRED"]
        side_effects: ["join point: unblocks TaperPlan advance-step for this admission", "increments SeizureAlert.version by 1"]
      - from: CONFIRMED_SUBCLINICAL
        to: CLOSED
        trigger: "POST /neurodiagnostics/alerts/{id}/close"
        actor: Epileptologist
        preconditions: ["triage_state == CONFIRMED_SUBCLINICAL"]
        side_effects: ["join point reached without any bedside response requirement", "increments SeizureAlert.version by 1"]
      - from: REJECTED_ARTIFACT
        to: CLOSED
        trigger: "POST /neurodiagnostics/alerts/{id}/close"
        actor: Epileptologist
        preconditions: ["triage_state == REJECTED_ARTIFACT"]
        side_effects: ["join point reached; no capture credit was granted on this branch", "increments SeizureAlert.version by 1"]
      - from: AWAITING_RESPONSE
        to: RESPONDED_ON_TIME
        trigger: "POST /neurodiagnostics/alerts/{id}/interventions (first intervention, latency_minutes <= response_deadline_minutes)"
        actor: Nurse
        preconditions: ["response_state == AWAITING_RESPONSE", "Study.acquisition_state IN {ACQUIRING, PAUSED} else ERR_INVALID_STUDY_STATE"]
        side_effects:
          - "sets responded_at = current logical clock and latency_minutes = floor((responded_at - detected_at) in minutes)"
          - "increments SeizureAlert.version by 1"
      - from: AWAITING_RESPONSE
        to: RESPONDED_LATE
        trigger: "POST /neurodiagnostics/alerts/{id}/interventions (first intervention, latency_minutes > response_deadline_minutes)"
        actor: Nurse
        preconditions: ["response_state == AWAITING_RESPONSE", "Study.acquisition_state IN {ACQUIRING, PAUSED} else ERR_INVALID_STUDY_STATE"]
        side_effects:
          - "sets responded_at and latency_minutes as above"
          - "increments MonitoringUnit.late_response_count by 1"
          - "increments SeizureAlert.version by 1"

  - entity: EventMarking
    initial_state: PROPOSED
    terminal_states: [RETRACTED]
    transitions:
      - from: PROPOSED
        to: ADJUDICATED
        trigger: "POST /neurodiagnostics/markings/{id}/adjudicate, or system cascade from SeizureAlert adjudication"
        actor: Epileptologist
        preconditions: ["status == PROPOSED else ERR_INVALID_MARKING_STATE", "Study.data_state != PURGED else ERR_INVALID_DATA_STATE"]
        side_effects:
          - "sets adjudicated_at = current logical clock"
          - "recomputes Admission.weighted_event_count, capture_adequacy_index, capture_adequacy_index_prospective, projected_daily_yield, deficit_weighted"
          - "may drive Admission ADMITTED -> CAPTURE_TARGET_MET"
          - "increments EventMarking.version by 1"
      - from: ADJUDICATED
        to: RETRACTED
        trigger: "POST /neurodiagnostics/markings/{id}/retract"
        actor: Epileptologist
        preconditions: ["status == ADJUDICATED else ERR_INVALID_MARKING_STATE"]
        side_effects:
          - "sets retraction_reason from request"
          - "recomputes Admission.weighted_event_count and both capture_adequacy_index variants downward"
          - "may drive Admission CAPTURE_TARGET_MET -> ADMITTED, which in turn returns COMPLETED TaperPlans to ACTIVE"
          - "increments EventMarking.version by 1"
      - from: PROPOSED
        to: RETRACTED
        trigger: "POST /neurodiagnostics/markings/{id}/retract, or system cascade from SeizureAlert ARTIFACT adjudication"
        actor: Epileptologist
        preconditions: ["status == PROPOSED"]
        side_effects: ["sets retraction_reason", "capture fields unchanged because a PROPOSED marking never contributed weight", "increments EventMarking.version by 1"]

  - entity: ReviewReport
    initial_state: PRELIM_DRAFT
    terminal_states: [FINAL_ISSUED]
    transitions:
      - from: PRELIM_DRAFT
        to: PRELIM_ISSUED
        trigger: "POST /neurodiagnostics/reports/{id}/issue-prelim"
        actor: Epileptologist
        preconditions: ["status == PRELIM_DRAFT else ERR_INVALID_REPORT_STATE", "Study.acquisition_state == COMPLETED else ERR_INVALID_STUDY_STATE"]
        side_effects:
          - "sets prelim_issued_at = current logical clock and prelim_author_user_id = X-User-ID"
          - "computes turnaround_calendar_hours (CALENDAR_CLOCK variant) and turnaround_coverage_hours (COVERAGE_CLOCK variant)"
          - "sets sla_breached = (turnaround_coverage_hours > 8)"
          - "increments ReviewReport.version by 1"
      - from: PRELIM_ISSUED
        to: ADDENDUM_OPEN
        trigger: "POST /neurodiagnostics/reports/{id}/open-addendum"
        actor: Epileptologist
        preconditions: ["status == PRELIM_ISSUED else ERR_INVALID_REPORT_STATE", "addendum_count < MAX_ADDENDA (2) else ERR_ADDENDUM_LIMIT"]
        side_effects: ["increments addendum_count by 1", "sets addendum_reason from request", "increments ReviewReport.version by 1"]
      - from: ADDENDUM_OPEN
        to: PRELIM_ISSUED
        trigger: "POST /neurodiagnostics/reports/{id}/issue-prelim (re-issue after addendum)"
        actor: Epileptologist
        preconditions: ["status == ADDENDUM_OPEN"]
        side_effects: ["overwrites localization from request", "leaves prelim_issued_at, turnaround_calendar_hours, turnaround_coverage_hours and sla_breached at their original values", "increments ReviewReport.version by 1"]
      - from: PRELIM_ISSUED
        to: FINAL_ISSUED
        trigger: "POST /neurodiagnostics/reports/{id}/issue-final"
        actor: Epileptologist
        preconditions:
          - "status == PRELIM_ISSUED else ERR_INVALID_REPORT_STATE"
          - "X-User-ID != prelim_author_user_id else ERR_SEGREGATION_OF_DUTIES"
          - "no EventMarking of this Study has status == PROPOSED else ERR_MARKING_NOT_ADJUDICATED"
        side_effects:
          - "sets final_issued_at = current logical clock, final_author_user_id = X-User-ID and localization from request"
          - "unblocks ExportPackage creation for this Study"
          - "increments ReviewReport.version by 1"

  - entity: ExportPackage
    initial_state: QUEUED
    terminal_states: [REVOKED, PURGED]
    transitions:
      - from: QUEUED
        to: BUILT
        trigger: "POST /neurodiagnostics/exports/{id}/build"
        actor: UnitCoordinator
        preconditions:
          - "status == QUEUED else ERR_INVALID_EXPORT_STATE"
          - "Study.data_state == ONLINE else ERR_INVALID_DATA_STATE"
          - "MonitoringUnit.storage_pressure_pct < STORAGE_LOCK_PCT (90.00) i.e. posture != STORAGE_LOCKED else ERR_UNIT_STORAGE_LOCKED"
          - "MonitoringUnit.storage_used_gb + calculations.export_package_gb result <= MonitoringUnit.storage_quota_gb else ERR_STORAGE_QUOTA_EXCEEDED"
        side_effects:
          - "cascade link 1: sets package_gb per calculations.export_package_gb, built_at = current logical clock and retention_expires_at = built_at + 30 * 24h"
          - "cascade link 2: MonitoringUnit.storage_used_gb += package_gb, which recomputes storage_pressure_pct"
          - "cascade link 3: when storage_pressure_pct >= 90.00 the unit posture becomes STORAGE_LOCKED"
          - "cascade link 4: because the posture is STORAGE_LOCKED, every other ExportPackage of this unit with status == QUEUED moves to BLOCKED with blocked_reason = 'UNIT_STORAGE_LOCKED'"
          - "increments ExportPackage.version by 1"
      - from: QUEUED
        to: BLOCKED
        trigger: "system: unit posture becomes STORAGE_LOCKED, or the Study enters EXPORT_HELD"
        actor: system
        preconditions: ["status == QUEUED"]
        side_effects: ["sets blocked_reason to 'UNIT_STORAGE_LOCKED' or 'STUDY_EXPORT_HELD'", "increments ExportPackage.version by 1"]
      - from: BLOCKED
        to: QUEUED
        trigger: "system: unit posture leaves STORAGE_LOCKED (retention sweep, archive or revoke), or the Study leaves EXPORT_HELD"
        actor: system
        preconditions: ["status == BLOCKED", "the condition named by blocked_reason no longer holds"]
        side_effects: ["clears blocked_reason", "increments ExportPackage.version by 1"]
      - from: BUILT
        to: DELIVERED
        trigger: "POST /neurodiagnostics/exports/{id}/deliver"
        actor: UnitCoordinator
        preconditions: ["status == BUILT else ERR_INVALID_EXPORT_STATE"]
        side_effects: ["sets delivered_at = current logical clock and recipient_center from request", "unblocks SurgicalConferenceCase creation against this package", "increments ExportPackage.version by 1"]
      - from: BUILT
        to: REVOKED
        trigger: "POST /neurodiagnostics/exports/{id}/revoke"
        actor: UnitCoordinator
        preconditions: ["status IN {BUILT, DELIVERED} else ERR_INVALID_EXPORT_STATE"]
        side_effects:
          - "compensating action: MonitoringUnit.storage_used_gb -= package_gb, restoring the pre-build value exactly; storage_pressure_pct and posture are recomputed"
          - "when posture leaves STORAGE_LOCKED, BLOCKED packages with blocked_reason == 'UNIT_STORAGE_LOCKED' return to QUEUED"
          - "sets revocation_reason from request; package_gb is retained as the historical allocation record"
          - "increments ExportPackage.version by 1"
      - from: DELIVERED
        to: REVOKED
        trigger: "POST /neurodiagnostics/exports/{id}/revoke"
        actor: UnitCoordinator
        preconditions: ["status == DELIVERED", "no SurgicalConferenceCase referencing this package has status IN {CANDIDATE, NON_CANDIDATE} else ERR_EXPORT_IN_DECIDED_CASE"]
        side_effects: ["same storage-restoration side effects as BUILT -> REVOKED", "increments ExportPackage.version by 1"]
      - from: BUILT
        to: PURGED
        trigger: "POST /neurodiagnostics/units/{id}/retention-sweep (retention_expires_at <= current logical clock)"
        actor: system
        preconditions: ["status IN {BUILT, DELIVERED}", "retention_expires_at <= current logical clock"]
        side_effects:
          - "MonitoringUnit.storage_used_gb -= package_gb, then storage_pressure_pct and posture are recomputed"
          - "when posture leaves STORAGE_LOCKED, BLOCKED packages with blocked_reason == 'UNIT_STORAGE_LOCKED' return to QUEUED"
          - "increments ExportPackage.version by 1"
      - from: DELIVERED
        to: PURGED
        trigger: "POST /neurodiagnostics/units/{id}/retention-sweep (retention_expires_at <= current logical clock)"
        actor: system
        preconditions: ["status == DELIVERED", "retention_expires_at <= current logical clock"]
        side_effects: ["same storage-release side effects as BUILT -> PURGED", "increments ExportPackage.version by 1"]

  - entity: SurgicalConferenceCase
    initial_state: DRAFT
    terminal_states: [CANDIDATE, NON_CANDIDATE]
    note: "Cyclic shape: DEFERRED -> PRESENTED reopens voting for another round, capped at MAX_DEFER_ROUNDS (2)."
    transitions:
      - from: DRAFT
        to: PRESENTED
        trigger: "POST /neurodiagnostics/conference-cases/{id}/present"
        actor: Epileptologist
        preconditions:
          - "status == DRAFT else ERR_INVALID_CASE_STATE"
          - "ExportPackage.status == DELIVERED else ERR_EXPORT_NOT_DELIVERED"
        side_effects: ["sets presenter_user_id = X-User-ID (this user's ballots will be recorded with counted == FALSE)", "increments SurgicalConferenceCase.version by 1"]
      - from: DEFERRED
        to: PRESENTED
        trigger: "POST /neurodiagnostics/conference-cases/{id}/present"
        actor: Epileptologist
        preconditions: ["status == DEFERRED", "defer_round < MAX_DEFER_ROUNDS (2) else ERR_DEFER_LIMIT"]
        side_effects: ["resets the per-round tallies (candidate_votes, non_candidate_votes, defer_votes, eligible_vote_count, distinct_specialty_count, quorum_met) to the current round", "increments SurgicalConferenceCase.version by 1"]
      - from: PRESENTED
        to: CANDIDATE
        trigger: "POST /neurodiagnostics/conference-cases/{id}/close-vote (tally resolves to CANDIDATE)"
        actor: Epileptologist
        preconditions: ["status == PRESENTED else ERR_INVALID_CASE_STATE", "quorum_met == TRUE else ERR_QUORUM_NOT_MET"]
        side_effects: ["sets decision_at = current logical clock", "increments SurgicalConferenceCase.version by 1"]
      - from: PRESENTED
        to: NON_CANDIDATE
        trigger: "POST /neurodiagnostics/conference-cases/{id}/close-vote (tally resolves to NON_CANDIDATE)"
        actor: Epileptologist
        preconditions: ["status == PRESENTED else ERR_INVALID_CASE_STATE", "quorum_met == TRUE else ERR_QUORUM_NOT_MET"]
        side_effects: ["sets decision_at = current logical clock", "increments SurgicalConferenceCase.version by 1"]
      - from: PRESENTED
        to: DEFERRED
        trigger: "POST /neurodiagnostics/conference-cases/{id}/close-vote (tally resolves to DEFER)"
        actor: Epileptologist
        preconditions: ["status == PRESENTED else ERR_INVALID_CASE_STATE", "quorum_met == TRUE else ERR_QUORUM_NOT_MET"]
        side_effects:
          - "increments defer_round by 1"
          - "leaves decision_at NULL"
          - "retains the tallies of the round just closed (eligible_vote_count, candidate_votes, non_candidate_votes, defer_votes, distinct_specialty_count, quorum_met keep the values that decided the deferral; they are only reset by the next POST present)"
          - "increments SurgicalConferenceCase.version by 1"

concurrency_rules:
  - rule_id: admission-extension-stale
    parent_entity: Admission
    write_endpoint: "POST /neurodiagnostics/admissions/{id}/extension-decisions"
    occ_field: "expected_admission_version"
    description: |
      Recording a length-of-stay extension decision against an Admission whose version has
      advanced since the client last read it is rejected with a stale-version error. A second
      extension decision is legitimate product behavior (an admission may be extended more than
      once), so the guard cannot be expressed as a state precondition: the deciding
      Epileptologist must prove the capture/risk numbers they reasoned over are still current,
      because any adjudication, retraction or prior extension has already recomputed
      capture_adequacy_index, projected_daily_yield and the authorization day ledger.
    error_id: ERR_STALE_ADMISSION_VERSION
    http_status: 412
  - rule_id: export-create-stale-study
    parent_entity: Study
    write_endpoint: "POST /neurodiagnostics/exports"
    occ_field: "expected_study_version"
    description: |
      Creating an ExportPackage against a Study whose version has advanced since the client last
      read it is rejected with a stale-version error. Multiple packages per Study are legitimate
      (a later package may supersede an earlier one via supersedes_export_id), so no state
      precondition covers it; the guard forces the requester to have observed the Study's current
      stored_gb and data_state, which drive package_gb and the quota check.
    error_id: ERR_STALE_STUDY_VERSION
    http_status: 412

calculations:
  - name: study_storage_gb
    trigger: "On every Study segment close — POST /neurodiagnostics/studies/{id}/pause and POST /neurodiagnostics/studies/{id}/complete (both list 'recomputes stored_gb' in their side_effects)."
    algorithm: aggregation
    formula: |
      # ROUNDING ORDER IS PINNED: round each closed segment to 2 decimals, THEN sum.
      # (Summing raw segment volumes and rounding once at the end is WRONG here and
      #  produces a different value; e.g. segments of 1538 and 1243 minutes at 32
      #  channels INPATIENT_VEEG give 49.22 + 39.78 = 89.00 per-segment, but 88.99
      #  sum-then-round.)
      rate_gb_per_minute = GB_PER_CHANNEL_MINUTE * Study.channel_count * MODALITY_FACTOR[Study.modality]
      stored_gb = 0
      for segment in closed_segments(Study) ordered by segment.started_at ASC:   # tie-break: created_at ASC
          segment_minutes = floor((segment.ended_at - segment.started_at) in minutes)
          segment_gb = round_half_up(segment_minutes * rate_gb_per_minute, 2)
          stored_gb = round_half_up(stored_gb + segment_gb, 2)
      return stored_gb
    input_set: "Only CLOSED acquisition segments of the Study (a segment closes on POST pause or POST complete). The open segment identified by current_segment_started_at contributes 0 until it closes. Segments are processed in started_at ASC order, tie-broken by created_at ASC."
    constants:
      GB_PER_CHANNEL_MINUTE: 0.0004
      MODALITY_FACTOR:
        INPATIENT_VEEG: 2.5
        AMBULATORY_VEEG: 1.0
    precision: "2 decimal places, round_half_up, applied per segment and again after each accumulation"

  - name: export_package_gb
    trigger: "POST /neurodiagnostics/exports/{id}/build (side effect 'sets package_gb per calculations.export_package_gb')."
    algorithm: threshold
    formula: |
      if ExportPackage.include_video == TRUE:
          package_gb = Study.stored_gb
      else:
          package_gb = round_half_up(Study.stored_gb / MODALITY_FACTOR[Study.modality], 2)
    input_set: "The single Study named by ExportPackage.study_id, using its stored_gb at build time."
    constants:
      MODALITY_FACTOR:
        INPATIENT_VEEG: 2.5
        AMBULATORY_VEEG: 1.0
    precision: "2 decimal places, round_half_up"

  - name: interpretation_turnaround
    trigger: "POST /neurodiagnostics/reports/{id}/issue-prelim (side effect 'computes turnaround_calendar_hours and turnaround_coverage_hours')."
    algorithm: interval_merge
    formula: |
      start = Study.completed_at
      end   = ReviewReport.prelim_issued_at        # both are logical-clock instants
      # CALENDAR_CLOCK variant
      turnaround_calendar_hours = round_half_up((end - start) in hours, 2)
      # COVERAGE_CLOCK variant: only the daily reading window counts
      covered_minutes = 0
      for each UTC calendar day D from date(start) to date(end) inclusive:
          window_start = D at READING_WINDOW_START_UTC (08:00:00)
          window_end   = D at READING_WINDOW_END_UTC   (18:00:00)     # half-open [start, end)
          overlap = max(0, min(end, window_end) - max(start, window_start))
          covered_minutes += overlap in minutes
      turnaround_coverage_hours = round_half_up(covered_minutes / 60, 2)
      sla_breached = (turnaround_coverage_hours > SLA_PRELIM_COVERAGE_HOURS)    # strictly greater
    input_set: "Exactly one ReviewReport and its Study; the Study MUST have acquisition_state == COMPLETED so completed_at is non-NULL. No other reports enter the computation."
    constants:
      READING_WINDOW_START_UTC: "08:00:00"
      READING_WINDOW_END_UTC: "18:00:00"
      SLA_PRELIM_COVERAGE_HOURS: 8
    precision: "2 decimal places, round_half_up"
    variants:
      - name: CALENDAR_CLOCK
        when: "Reported on ReviewReport.turnaround_calendar_hours; used for external reporting of wall-clock delay."
        difference: "Counts every elapsed minute between Study.completed_at and prelim_issued_at, including nights and non-reading hours."
      - name: COVERAGE_CLOCK
        when: "Reported on ReviewReport.turnaround_coverage_hours; the ONLY variant that drives sla_breached."
        difference: "Counts only minutes falling inside the daily half-open reading window [08:00, 18:00) UTC, so the same pair of instants yields a strictly smaller number whenever the interval spans a night."

  - name: capture_adequacy_index
    trigger: "Every EventMarking PROPOSED -> ADJUDICATED and ADJUDICATED -> RETRACTED transition, and every AuthorizationRequest day-ledger change (all list 'recomputes ... capture_adequacy_index' in their side_effects)."
    algorithm: weighted_scoring
    formula: |
      # per-marking weight (stored on EventMarking.weight at creation time)
      weight(m) = round_half_up(CLASS_WEIGHT[m.event_class]
                                * (TAPER_PROVOKED_DISCOUNT if m.taper_step_at_onset >= TAPER_DISCOUNT_MIN_STEP else 1.0), 3)
      weighted_event_count = round_half_up(sum of weight(m) over the input set, 3)
      deficit_weighted     = round_half_up(max(0, Admission.target_event_count - weighted_event_count), 3)
      elapsed_monitored_days = round_half_up((clock_or_discharge - Admission.admitted_at) in days, 3)
      projected_daily_yield  = 0 if elapsed_monitored_days == 0
                               else round_half_up(weighted_event_count / elapsed_monitored_days, 3)
      # RETROSPECTIVE_ADJUDICATED variant (drives CAPTURE_TARGET_MET)
      capture_adequacy_index = round_half_up(min(1.0, weighted_event_count / Admission.target_event_count), 3)
      # PROSPECTIVE variant (advisory)
      capture_adequacy_index_prospective =
          round_half_up((weighted_event_count
                         + projected_daily_yield * AuthorizationRequest.days_available)
                        / Admission.target_event_count, 3)          # NOT clamped at 1.0
    input_set: "EventMarking rows whose study_id belongs to a Study with admission_id == this Admission, with status == ADJUDICATED and event_class IN {CLINICAL_SEIZURE, SUBCLINICAL_SEIZURE}. PROPOSED and RETRACTED markings are excluded; SPIKE_BURST and ARTIFACT markings carry CLASS_WEIGHT 0 and never contribute. elapsed_monitored_days uses the current logical clock while clinical_state != DISCHARGED and discharged_at afterwards."
    constants:
      CLASS_WEIGHT:
        CLINICAL_SEIZURE: 1.0
        SUBCLINICAL_SEIZURE: 0.5
        SPIKE_BURST: 0
        ARTIFACT: 0
      TAPER_PROVOKED_DISCOUNT: 0.75
      TAPER_DISCOUNT_MIN_STEP: 2
    precision: "3 decimal places, round_half_up"
    variants:
      - name: RETROSPECTIVE_ADJUDICATED
        when: "Stored on Admission.capture_adequacy_index; the only variant the ADMITTED -> CAPTURE_TARGET_MET transition reads."
        difference: "Counts only weight already banked by ADJUDICATED markings and clamps at 1.0."
      - name: PROSPECTIVE
        when: "Stored on Admission.capture_adequacy_index_prospective; shown to the epileptologist when deciding length of stay."
        difference: "Adds the yield still expected from the authorization days that remain available (projected_daily_yield * AuthorizationRequest.days_available) and is NOT clamped, so identical marking data yields a strictly larger — and possibly >1.0 — number whenever days_available > 0 and projected_daily_yield > 0."

  - name: los_extension_decision
    trigger: "POST /neurodiagnostics/admissions/{id}/extension-decisions (side effect 'evaluates calculations.los_extension_decision')."
    algorithm: constraint_propagation
    formula: |
      # EVALUATION ORDER IS PINNED S1..S7. The chain looks circular (the risk budget limits the
      # days granted, the days granted change planned_discharge_at, which changes the elapsed
      # days that fed the yield) — it is resolved by evaluating every term against the state as
      # it exists BEFORE this call and applying the grant exactly once, at S7.
      S1: elapsed = Admission.elapsed_monitored_days                       # 3 dp
      S2: deficit = Admission.deficit_weighted                             # 3 dp
      S3: yield_rate = Admission.projected_daily_yield                     # 3 dp
          if Admission.weighted_event_count == 0 OR elapsed == 0: reject ERR_NO_YIELD_BASIS
      S4: yield_days = ceil(deficit / yield_rate)                          # integer, >= 0
      S5: daily_risk = BASE_RISK[Patient.risk_tier]
                       + TAPER_RISK_PER_STEP * TaperPlan.current_step      # CURRENT step, never a projected step
                       + (POSTURE_CONSTRAINED_RISK_ADD if MonitoringUnit.posture == COVERAGE_CONSTRAINED else 0)
      S6: risk_budget_days = floor(RISK_ALLOWANCE_UNITS / daily_risk)      # integer
      S7: granted_days = min(yield_days, risk_budget_days, AuthorizationRequest.days_available)
          if granted_days <= 0:
              outcome = DENIED_RISK if risk_budget_days <= 0 else DENIED_AUTH_DAYS
          else:
              outcome = GRANTED
      # when Admission.clinical_state == CAPTURE_TARGET_MET the call is rejected with
      # ERR_TARGET_ALREADY_MET before S1 (deficit is 0 and no extension is warranted).
      # When TaperPlan is absent, TaperPlan.current_step reads 0.
    input_set: "The single Admission under decision, its Patient (risk_tier), its AuthorizationRequest (days_available), its MonitoringUnit (posture) and its TaperPlan with status IN {ACTIVE, HELD, COMPLETED} (current_step). ABORTED plans are excluded; when the admission has no TaperPlan, current_step reads 0."
    constants:
      RISK_ALLOWANCE_UNITS: 24
      BASE_RISK:
        LOW: 2
        MODERATE: 3
        HIGH: 5
      TAPER_RISK_PER_STEP: 1.5
      POSTURE_CONSTRAINED_RISK_ADD: 2
    precision: "granted_days, yield_days and risk_budget_days are integers; daily_risk carries 1 decimal place; ceil at S4 and floor at S6"

  - name: alert_response_deadline
    trigger: "POST /neurodiagnostics/studies/{id}/alerts (side effect 'sets response_deadline_minutes')."
    algorithm: threshold
    formula: |
      # Four inputs interacting non-linearly through nested max/min clamping.
      base       = TIER_BASE[Patient.risk_tier]
      taper_adj  = -1 * TaperPlan.current_step                       # deeper medication reduction -> tighter deadline
      posture_adj = POSTURE_CONSTRAINED_DEADLINE_ADD if MonitoringUnit.posture == COVERAGE_CONSTRAINED else 0
      night_adj  = NIGHT_DEADLINE_ADD if hour_utc(detected_at) IN NIGHT_HOURS_UTC else 0
      response_deadline_minutes = max(DEADLINE_FLOOR_MINUTES,
                                      min(DEADLINE_CEILING_MINUTES,
                                          base + taper_adj + posture_adj + night_adj))
      # Timeliness, evaluated when the first SafetyIntervention is recorded:
      latency_minutes = floor((responded_at - detected_at) in minutes)
      response_state  = RESPONDED_ON_TIME if latency_minutes <= response_deadline_minutes
                        else RESPONDED_LATE                          # boundary: equality is ON TIME
    input_set: "The Patient of the alert's Study's Admission (risk_tier), that Admission's TaperPlan with status IN {ACTIVE, HELD, COMPLETED} (current_step; 0 when absent), the MonitoringUnit posture at detection time, and the UTC hour of detected_at. The value is frozen on the SeizureAlert at detection and never recomputed."
    constants:
      TIER_BASE:
        LOW: 10
        MODERATE: 6
        HIGH: 3
      POSTURE_CONSTRAINED_DEADLINE_ADD: 2
      NIGHT_DEADLINE_ADD: 1
      NIGHT_HOURS_UTC: "hour >= 22 OR hour <= 5"
      DEADLINE_FLOOR_MINUTES: 2
      DEADLINE_CEILING_MINUTES: 15
    precision: "whole minutes; latency uses floor"

  - name: unit_storage_pressure
    trigger: "Every Study segment close, archive and retention purge; every ExportPackage build, revoke and purge; every shift activate/close and study start/pause/resume/complete (all list 'recomputes MonitoringUnit ... posture' in their side_effects)."
    algorithm: threshold
    formula: |
      storage_used_gb = round_half_up(
            sum of Study.stored_gb for Studies of this unit with data_state IN {ONLINE, EXPORT_HELD}
          + sum of ExportPackage.package_gb for packages of those Studies with status IN {BUILT, DELIVERED}, 2)
      storage_pressure_pct = round_half_up(storage_used_gb / MonitoringUnit.storage_quota_gb * 100, 2)
      # posture precedence is pinned: storage lock outranks coverage constraint
      if storage_pressure_pct >= STORAGE_LOCK_PCT:              # 90.00, inclusive
          posture = STORAGE_LOCKED
      elif active_study_count > 0 AND active_study_count >= coverage_capacity:
          posture = COVERAGE_CONSTRAINED
      else:
          posture = OPEN
    input_set: "Studies reached through Admission.unit_id == this unit with data_state IN {ONLINE, EXPORT_HELD} (ARCHIVED and PURGED studies are excluded), and ExportPackage rows on those studies with status IN {BUILT, DELIVERED} (QUEUED, BLOCKED, REVOKED and PURGED packages are excluded). active_study_count counts Studies with acquisition_state == ACQUIRING; coverage_capacity sums max_concurrent_studies over TechnologistShift rows with state == ACTIVE whose half-open window [starts_at, ends_at) contains the current logical clock."
    constants:
      STORAGE_LOCK_PCT: 90.00
    precision: "2 decimal places, round_half_up"

  - name: authorization_day_ledger
    trigger: "POST admit, POST /neurodiagnostics/admissions/{id}/extension-decisions and POST discharge (all list day-ledger mutations in their side_effects)."
    algorithm: waterfall_allocation
    formula: |
      # Conserved quantity — this equality MUST hold after every mutation:
      authorized_days == days_consumed + days_reserved + days_available
      on admit:      days_reserved += Admission.planned_days ; days_available -= Admission.planned_days
      on extension (outcome == GRANTED):
                     days_reserved += granted_days           ; days_available -= granted_days
      on discharge:  spent = min(days_reserved, ceil(Admission.elapsed_monitored_days))
                     days_consumed += spent
                     days_available += (days_reserved - spent)
                     days_reserved  = 0
    input_set: "The single AuthorizationRequest named by Admission.authorization_id, with status == APPROVED. DRAFT, SUBMITTED, PENDED and DENIED authorizations have authorized_days == 0 and cannot fund an admission."
    constants: {}
    precision: "integer days; ceil on elapsed_monitored_days"

  - name: conference_vote_tally
    trigger: "POST /neurodiagnostics/conference-cases/{id}/votes (recomputes the tallies) and POST /neurodiagnostics/conference-cases/{id}/close-vote (resolves the outcome)."
    algorithm: aggregation
    formula: |
      counted_votes = ConferenceVote rows on this case with counted == TRUE and round_index == case.defer_round
      eligible_vote_count      = count(counted_votes)
      candidate_votes          = count(counted_votes where vote == CANDIDATE)
      non_candidate_votes      = count(counted_votes where vote == NON_CANDIDATE)
      defer_votes              = count(counted_votes where vote == DEFER)
      distinct_specialty_count = count(distinct counted_votes.specialty)
      quorum_met = (eligible_vote_count >= QUORUM_MIN AND distinct_specialty_count >= QUORUM_SPECIALTY_MIN)
      # outcome resolution on close-vote, evaluated in this pinned order:
      T1: if NOT quorum_met: reject ERR_QUORUM_NOT_MET
      T2: elif defer_votes >= candidate_votes AND defer_votes >= non_candidate_votes: outcome = DEFERRED
      T3: elif candidate_votes > non_candidate_votes: outcome = CANDIDATE
      T4: elif non_candidate_votes > candidate_votes: outcome = NON_CANDIDATE
      T5: else: outcome = DEFERRED                     # candidate_votes == non_candidate_votes, both > defer_votes
    input_set: "ConferenceVote rows of this case with counted == TRUE and round_index == case.defer_round. The presenter's own ballot is stored with counted == FALSE and is excluded from every tally; ballots from earlier rounds are excluded by round_index."
    constants:
      QUORUM_MIN: 3
      QUORUM_SPECIALTY_MIN: 2
      MAX_DEFER_ROUNDS: 2
    precision: "integer counts"

validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are present and X-User-Role is a declared role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "the acting role appears in the target endpoint's roles list in §1.5"
    error_id: ERR_ROLE_NOT_PERMITTED
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: existence
    check: "request body and query parameters parse, required fields are present, enums are members of their declared sets, and numbers respect their declared ranges"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all"
  - priority: 4
    category: existence
    check: "every path id resolves, validated left to right"
    error_id: "ERR_UNIT_NOT_FOUND | ERR_BED_NOT_FOUND | ERR_SHIFT_NOT_FOUND | ERR_PATIENT_NOT_FOUND | ERR_AUTHORIZATION_NOT_FOUND | ERR_ADMISSION_NOT_FOUND | ERR_TAPER_PLAN_NOT_FOUND | ERR_STUDY_NOT_FOUND | ERR_ALERT_NOT_FOUND | ERR_MARKING_NOT_FOUND | ERR_REPORT_NOT_FOUND | ERR_EXPORT_NOT_FOUND | ERR_CASE_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints carrying a path id"
  - priority: 5
    category: existence
    check: "every foreign key supplied in the request body resolves, validated in the field order declared by the endpoint's input list"
    error_id: "ERR_PATIENT_NOT_FOUND | ERR_AUTHORIZATION_NOT_FOUND | ERR_UNIT_NOT_FOUND | ERR_BED_NOT_FOUND | ERR_SHIFT_NOT_FOUND | ERR_ADMISSION_NOT_FOUND | ERR_STUDY_NOT_FOUND | ERR_ALERT_NOT_FOUND | ERR_EXPORT_NOT_FOUND"
    http_status: 404
    applies_to: "all POST endpoints taking foreign keys in the body"
  - priority: 6
    category: state
    check: "the target entity is in a state from which the requested transition is declared in §1.2"
    error_id: "ERR_INVALID_AUTHORIZATION_STATE | ERR_INVALID_ADMISSION_STATE | ERR_INVALID_TAPER_STATE | ERR_INVALID_STUDY_STATE | ERR_INVALID_DATA_STATE | ERR_INVALID_ALERT_STATE | ERR_INVALID_MARKING_STATE | ERR_INVALID_REPORT_STATE | ERR_INVALID_EXPORT_STATE | ERR_INVALID_CASE_STATE | ERR_INVALID_SHIFT_STATE"
    http_status: 409
    applies_to: "all state-transition endpoints"
  - priority: 7
    category: state
    check: "expected_admission_version equals Admission.version (POST extension-decisions) and expected_study_version equals Study.version (POST exports) — §1.2.1 optimistic concurrency"
    error_id: "ERR_STALE_ADMISSION_VERSION | ERR_STALE_STUDY_VERSION"
    http_status: 412
    applies_to: "POST /neurodiagnostics/admissions/{id}/extension-decisions, POST /neurodiagnostics/exports"
  - priority: 8
    category: business_safety
    check: "the X-User-ID issuing a final report differs from ReviewReport.prelim_author_user_id"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /neurodiagnostics/reports/{id}/issue-final"
  - priority: 9
    category: business_safety
    check: "no SeizureAlert on the admission's Studies has triage_state == CONFIRMED_CLINICAL (an unclosed confirmed clinical event) when advancing a medication taper"
    error_id: ERR_TAPER_BLOCKED_BY_OPEN_EVENT
    http_status: 409
    applies_to: "POST /neurodiagnostics/taper-plans/{id}/advance-step"
  - priority: 10
    category: business_safety
    check: "a CONFIRMED_CLINICAL adjudication or close requires at least one SafetyIntervention on the alert"
    error_id: ERR_INTERVENTION_REQUIRED
    http_status: 409
    applies_to: "POST /neurodiagnostics/alerts/{id}/adjudicate, POST /neurodiagnostics/alerts/{id}/close"
  - priority: 11
    category: business_safety
    check: "the named TechnologistShift has state == ACTIVE and the current logical clock lies in its half-open window [starts_at, ends_at)"
    error_id: ERR_NO_TECH_COVERAGE
    http_status: 409
    applies_to: "POST /neurodiagnostics/studies/{id}/start, POST /neurodiagnostics/studies/{id}/resume"
  - priority: 12
    category: business_constraint
    check: "TechnologistShift.assigned_study_count < TechnologistShift.max_concurrent_studies"
    error_id: ERR_TECH_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /neurodiagnostics/studies/{id}/start"
  - priority: 13
    category: business_constraint
    check: "when the AuthorizationRequest has status == APPROVED, Admission.setting equals AuthorizationRequest.authorized_setting at admit time; and Study.modality equals Admission.setting at start time. An authorization that is not APPROVED has authorized_setting NULL and is caught by priority 19 instead, so this rule stays silent for it"
    error_id: ERR_SETTING_MISMATCH
    http_status: 422
    applies_to: "POST /neurodiagnostics/admissions/{id}/admit, POST /neurodiagnostics/studies/{id}/start"
  - priority: 14
    category: business_temporal
    check: "the requested Bed has status == AVAILABLE: no current_admission_id and (released_at IS NULL OR current logical clock >= turnover_clear_at, i.e. released_at + 90 minutes)"
    error_id: ERR_BED_OCCUPANCY_CONFLICT
    http_status: 409
    applies_to: "POST /neurodiagnostics/admissions/{id}/admit"
  - priority: 15
    category: business_constraint
    check: "INPATIENT_VEEG admissions supply bed_id; AMBULATORY_VEEG admissions must not"
    error_id: "ERR_BED_REQUIRED_FOR_INPATIENT | ERR_BED_NOT_ALLOWED_FOR_AMBULATORY"
    http_status: 422
    applies_to: "POST /neurodiagnostics/admissions/{id}/admit"
  - priority: 16
    category: business_referential
    check: "the Study has a ReviewReport with status == FINAL_ISSUED before an ExportPackage may be created against it"
    error_id: ERR_REPORT_NOT_FINAL
    http_status: 409
    applies_to: "POST /neurodiagnostics/exports"
  - priority: 17
    category: business_referential
    check: "every EventMarking of the Study has status != PROPOSED before the final report may be issued"
    error_id: ERR_MARKING_NOT_ADJUDICATED
    http_status: 409
    applies_to: "POST /neurodiagnostics/reports/{id}/issue-final"
  - priority: 18
    category: business_referential
    check: "the referenced ExportPackage has status == DELIVERED before a conference case may be presented"
    error_id: ERR_EXPORT_NOT_DELIVERED
    http_status: 409
    applies_to: "POST /neurodiagnostics/conference-cases/{id}/present"
  - priority: 19
    category: business_referential
    check: "an AuthorizationRequest has status == APPROVED before an admission may be admitted against it"
    error_id: ERR_AUTHORIZATION_NOT_APPROVED
    http_status: 409
    applies_to: "POST /neurodiagnostics/admissions/{id}/admit"
  - priority: 20
    category: business_fiscal
    check: "AuthorizationRequest.days_available >= the days being reserved (planned_days at admit)"
    error_id: ERR_AUTHORIZATION_DAYS_EXHAUSTED
    http_status: 402
    applies_to: "POST /neurodiagnostics/admissions/{id}/admit"
  - priority: 21
    category: business_fiscal
    check: "MonitoringUnit.posture != STORAGE_LOCKED (storage_pressure_pct < 90.00)"
    error_id: ERR_UNIT_STORAGE_LOCKED
    http_status: 409
    applies_to: "POST /neurodiagnostics/admissions/{id}/admit, POST /neurodiagnostics/studies/{id}/start, POST /neurodiagnostics/studies/{id}/resume, POST /neurodiagnostics/exports/{id}/build"
  - priority: 22
    category: business_fiscal
    check: "MonitoringUnit.storage_used_gb + the package volume about to be allocated <= MonitoringUnit.storage_quota_gb"
    error_id: ERR_STORAGE_QUOTA_EXCEEDED
    http_status: 409
    applies_to: "POST /neurodiagnostics/exports/{id}/build"
  - priority: 23
    category: business_constraint
    check: "round-cap limits: AuthorizationRequest.resubmission_count < 2 on resubmit, ReviewReport.addendum_count < 2 on open-addendum, SurgicalConferenceCase.defer_round < 2 on re-present"
    error_id: "ERR_RESUBMISSION_LIMIT | ERR_ADDENDUM_LIMIT | ERR_DEFER_LIMIT"
    http_status: 409
    applies_to: "POST /neurodiagnostics/authorizations/{id}/submit, POST /neurodiagnostics/reports/{id}/open-addendum, POST /neurodiagnostics/conference-cases/{id}/present"
  - priority: 24
    category: business_constraint
    check: "the voting X-User-ID has not already cast a ballot on this case in the current defer_round"
    error_id: ERR_DUPLICATE_VOTE
    http_status: 409
    applies_to: "POST /neurodiagnostics/conference-cases/{id}/votes"
  - priority: 25
    category: business_constraint
    check: "SurgicalConferenceCase.quorum_met == TRUE (>= 3 counted votes spanning >= 2 distinct specialties in the current round)"
    error_id: ERR_QUORUM_NOT_MET
    http_status: 409
    applies_to: "POST /neurodiagnostics/conference-cases/{id}/close-vote"
  - priority: 26
    category: business_constraint
    check: "the extension decision has a yield basis: Admission.weighted_event_count > 0 and elapsed_monitored_days > 0"
    error_id: ERR_NO_YIELD_BASIS
    http_status: 422
    applies_to: "POST /neurodiagnostics/admissions/{id}/extension-decisions"
  - priority: 27
    category: business_constraint
    check: "the admission has not already met its capture target when an extension is requested"
    error_id: ERR_TARGET_ALREADY_MET
    http_status: 409
    applies_to: "POST /neurodiagnostics/admissions/{id}/extension-decisions"
  - priority: 28
    category: business_temporal
    check: "EventMarking.onset_at falls inside a closed acquisition segment of the Study"
    error_id: ERR_MARKING_OUTSIDE_STUDY_WINDOW
    http_status: 422
    applies_to: "POST /neurodiagnostics/markings"
  - priority: 29
    category: business_constraint
    check: "no Study of the admission has acquisition_state IN {PREPARING, ACQUIRING, PAUSED} at discharge; no Study is assigned to a shift being closed"
    error_id: "ERR_OPEN_STUDY_ON_DISCHARGE | ERR_SHIFT_HAS_ACTIVE_STUDIES"
    http_status: 409
    applies_to: "POST /neurodiagnostics/admissions/{id}/discharge, POST /neurodiagnostics/technologist-shifts/{id}/close"
  - priority: 30
    category: business_temporal
    check: "TechnologistShift.ends_at > starts_at; the logical clock never moves backwards"
    error_id: "ERR_SHIFT_WINDOW_INVALID | ERR_CLOCK_MONOTONIC"
    http_status: 422
    applies_to: "POST /neurodiagnostics/technologist-shifts, POST /_clock/set_current_utc"
  - priority: 31
    category: business_referential
    check: "an ExportPackage in a decided conference case may not be revoked"
    error_id: ERR_EXPORT_IN_DECIDED_CASE
    http_status: 409
    applies_to: "POST /neurodiagnostics/exports/{id}/revoke"

endpoints:
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Test-driving endpoint (§1.5 ladder rung 3): moves the server's logical clock forward. The clock's startup default is exactly 2026-08-01T00:00:00Z and MUST NOT fall back to real wall-clock time. Moving the clock backwards is rejected with ERR_CLOCK_MONOTONIC."
    roles: [UnitCoordinator, Technologist, Nurse, Epileptologist, PayerReviewer]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string }"
    side_effects: ["sets the logical clock used by every computed datetime, deadline, window and retention check"]

  - method: POST
    path: "/neurodiagnostics/units"
    description: "Create a monitoring unit."
    roles: [UnitCoordinator]
    code: 201
    input: [name, bed_count, storage_quota_gb]
    output: MonitoringUnit
    side_effects: ["initializes storage_used_gb 0, storage_pressure_pct 0, posture OPEN, retention_sweep_index 0"]
  - method: GET
    path: "/neurodiagnostics/units/{id}"
    description: "Read a monitoring unit with its derived posture and storage figures."
    roles: [UnitCoordinator, Technologist, Nurse, Epileptologist]
    code: 200
    input: []
    output: MonitoringUnit
    side_effects: []
  - method: POST
    path: "/neurodiagnostics/units/{id}/retention-sweep"
    description: "Ops-run checkpoint: purges every ExportPackage of this unit whose retention_expires_at <= the current logical clock and every ARCHIVED Study of a DISCHARGED admission, then recomputes storage and posture."
    roles: [UnitCoordinator]
    code: 200
    input: []
    output: MonitoringUnit
    side_effects:
      - "increments retention_sweep_index by 1"
      - "moves qualifying ExportPackage rows BUILT/DELIVERED -> PURGED and releases their package_gb from storage_used_gb"
      - "moves qualifying Study rows ARCHIVED -> PURGED"
      - "recomputes storage_used_gb, storage_pressure_pct and posture per calculations.unit_storage_pressure"
      - "returns BLOCKED packages with blocked_reason == 'UNIT_STORAGE_LOCKED' to QUEUED when the posture leaves STORAGE_LOCKED"
      - "increments MonitoringUnit.version by 1"

  - method: POST
    path: "/neurodiagnostics/beds"
    description: "Create a bed in a unit."
    roles: [UnitCoordinator]
    code: 201
    input: [unit_id, label]
    output: Bed
    side_effects: ["recomputes MonitoringUnit.beds_available"]
  - method: GET
    path: "/neurodiagnostics/units/{id}/beds"
    description: "List the beds of a unit with computed occupancy status and turnover window."
    roles: [UnitCoordinator, Technologist, Nurse, Epileptologist]
    code: 200
    input: ["limit?", "offset?"]
    output: Bed[]
    side_effects: []

  - method: POST
    path: "/neurodiagnostics/technologist-shifts"
    description: "Roster a technologist coverage window with an aggregate concurrent-study capacity."
    roles: [UnitCoordinator]
    code: 201
    input: [unit_id, technologist_user_id, starts_at, ends_at, max_concurrent_studies]
    output: TechnologistShift
    side_effects: ["validates ends_at > starts_at (ERR_SHIFT_WINDOW_INVALID)", "initializes state SCHEDULED and assigned_study_count 0"]
  - method: GET
    path: "/neurodiagnostics/units/{id}/technologist-shifts"
    description: "List the coverage windows rostered for a unit."
    roles: [UnitCoordinator, Technologist, Epileptologist]
    code: 200
    input: ["limit?", "offset?"]
    output: TechnologistShift[]
    side_effects: []
  - method: GET
    path: "/neurodiagnostics/technologist-shifts/{id}"
    description: "Read one coverage window with its computed state and assigned_study_count."
    roles: [UnitCoordinator, Technologist, Epileptologist]
    code: 200
    input: []
    output: TechnologistShift
    side_effects: []
  - method: POST
    path: "/neurodiagnostics/technologist-shifts/{id}/activate"
    description: "Activate a rostered shift so it can carry acquisitions."
    roles: [UnitCoordinator]
    code: 200
    input: []
    output: TechnologistShift
    side_effects: ["SCHEDULED -> ACTIVE", "recomputes MonitoringUnit.coverage_capacity and posture"]
  - method: POST
    path: "/neurodiagnostics/technologist-shifts/{id}/close"
    description: "Close an active shift; rejected while it still carries acquisitions."
    roles: [UnitCoordinator]
    code: 200
    input: []
    output: TechnologistShift
    side_effects: ["ACTIVE -> CLOSED", "recomputes MonitoringUnit.coverage_capacity and posture"]

  - method: POST
    path: "/neurodiagnostics/patients"
    description: "Register a patient with a clinical risk tier."
    roles: [UnitCoordinator]
    code: 201
    input: [mrn, display_name, risk_tier]
    output: Patient
    side_effects: []
  - method: GET
    path: "/neurodiagnostics/patients/{id}"
    description: "Read a patient."
    roles: [UnitCoordinator, Technologist, Nurse, Epileptologist, PayerReviewer]
    code: 200
    input: []
    output: Patient
    side_effects: []

  - method: POST
    path: "/neurodiagnostics/authorizations"
    description: "Draft a payer authorization request for a patient."
    roles: [UnitCoordinator]
    code: 201
    input: [patient_id, requested_setting, requested_days]
    output: AuthorizationRequest
    side_effects: ["initializes status DRAFT and the day ledger at 0/0/0/0"]
  - method: GET
    path: "/neurodiagnostics/patients/{id}/authorizations"
    description: "List the authorization requests raised for a patient."
    roles: [UnitCoordinator, Epileptologist, PayerReviewer]
    code: 200
    input: ["limit?", "offset?"]
    output: AuthorizationRequest[]
    side_effects: []
  - method: GET
    path: "/neurodiagnostics/authorizations/{id}"
    description: "Read an authorization request with its day ledger."
    roles: [UnitCoordinator, Epileptologist, PayerReviewer]
    code: 200
    input: []
    output: AuthorizationRequest
    side_effects: []
  - method: POST
    path: "/neurodiagnostics/authorizations/{id}/submit"
    description: "Submit a DRAFT authorization, or resubmit a PENDED one (capped at 2 resubmissions)."
    roles: [UnitCoordinator]
    code: 200
    input: []
    output: AuthorizationRequest
    side_effects: ["DRAFT -> SUBMITTED or PENDED -> SUBMITTED", "increments resubmission_count on the PENDED path"]
  - method: POST
    path: "/neurodiagnostics/authorizations/{id}/payer-decision"
    description: "Payer records APPROVE, PEND or DENY on a SUBMITTED authorization."
    roles: [PayerReviewer]
    code: 200
    input: [outcome, "authorized_days?", "authorized_setting?", "payer_note?"]
    output: AuthorizationRequest
    side_effects: ["SUBMITTED -> APPROVED | PENDED | DENIED", "on APPROVE sets authorized_days, authorized_setting and days_available"]

  - method: POST
    path: "/neurodiagnostics/admissions"
    description: "Schedule an admission against an authorization, with a weighted capture target and initially reserved days."
    roles: [UnitCoordinator]
    code: 201
    input: [patient_id, authorization_id, unit_id, setting, scheduled_admit_at, target_event_count, planned_days]
    output: Admission
    side_effects: ["initializes clinical_state SCHEDULED and authorization_state AUTH_PENDING", "no authorization days are reserved until admit"]
  - method: GET
    path: "/neurodiagnostics/admissions"
    description: "List admissions, filterable by patient, authorization, unit, bed and either parallel state dimension."
    roles: [UnitCoordinator, Technologist, Nurse, Epileptologist, PayerReviewer]
    code: 200
    input: ["patient_id?", "authorization_id?", "unit_id?", "bed_id?", "clinical_state?", "authorization_state?", "limit?", "offset?"]
    output: Admission[]
    side_effects: []
  - method: GET
    path: "/neurodiagnostics/admissions/{id}"
    description: "Read an admission with both state dimensions, the capture fields and the extension history."
    roles: [UnitCoordinator, Technologist, Nurse, Epileptologist, PayerReviewer]
    code: 200
    input: []
    output: Admission
    side_effects: []
  - method: POST
    path: "/neurodiagnostics/admissions/{id}/admit"
    description: "Admit a scheduled patient, assigning a bed for inpatient studies and reserving authorization days."
    roles: [UnitCoordinator]
    code: 200
    input: ["bed_id?"]
    output: Admission
    side_effects: ["SCHEDULED -> ADMITTED and AUTH_PENDING -> AUTH_ACTIVE", "reserves planned_days on the AuthorizationRequest ledger", "occupies the Bed and sets planned_discharge_at"]
  - method: POST
    path: "/neurodiagnostics/admissions/{id}/extension-decisions"
    description: "Record a length-of-stay extension decision balancing remaining capture deficit against taper/posture risk and remaining authorized days. Guarded by optimistic concurrency on Admission.version."
    roles: [Epileptologist]
    code: 200
    input: [expected_admission_version]
    output: Admission
    side_effects:
      - "evaluates calculations.los_extension_decision in the pinned order S1..S7"
      - "sets last_extension_outcome, last_extension_granted_days and increments extension_count"
      - "on GRANTED: reserves granted_days on the AuthorizationRequest ledger and pushes planned_discharge_at out by granted_days * 24h"
      - "may move authorization_state AUTH_ACTIVE -> AUTH_EXHAUSTED"
      - "recomputes capture_adequacy_index_prospective"
      - "increments Admission.version by 1"
  - method: POST
    path: "/neurodiagnostics/admissions/{id}/discharge"
    description: "Discharge the patient, settling the authorization day ledger and releasing the bed into its turnover window."
    roles: [UnitCoordinator]
    code: 200
    input: [disposition]
    output: Admission
    side_effects: ["ADMITTED|CAPTURE_TARGET_MET -> DISCHARGED and authorization_state -> AUTH_CLOSED", "settles days_consumed/days_reserved/days_available", "releases the Bed with a 90-minute turnover window", "aborts non-terminal TaperPlans"]
  - method: GET
    path: "/neurodiagnostics/admissions/{id}/capture-summary"
    description: "Computed read exposing both capture-adequacy variants side by side for the length-of-stay decision."
    roles: [UnitCoordinator, Epileptologist]
    code: 200
    input: []
    output: "{ adequacy_retrospective: number, adequacy_prospective: number, weighted_event_count: number, projected_daily_yield: number, deficit_weighted: number, elapsed_monitored_days: number }"
    side_effects: []

  - method: POST
    path: "/neurodiagnostics/taper-plans"
    description: "Create the medication-reduction protocol for an admission."
    roles: [Epileptologist]
    code: 201
    input: [admission_id, total_steps]
    output: TaperPlan
    side_effects: ["initializes status ACTIVE and current_step 0"]
  - method: GET
    path: "/neurodiagnostics/admissions/{id}/taper-plans"
    description: "List the taper plans of an admission."
    roles: [UnitCoordinator, Nurse, Epileptologist]
    code: 200
    input: ["limit?", "offset?"]
    output: TaperPlan[]
    side_effects: []
  - method: GET
    path: "/neurodiagnostics/taper-plans/{id}"
    description: "Read a taper plan."
    roles: [UnitCoordinator, Nurse, Epileptologist]
    code: 200
    input: []
    output: TaperPlan
    side_effects: []
  - method: POST
    path: "/neurodiagnostics/taper-plans/{id}/advance-step"
    description: "Advance one medication-reduction step; blocked while an unclosed confirmed clinical event stands."
    roles: [Epileptologist]
    code: 200
    input: []
    output: TaperPlan
    side_effects: ["increments current_step", "auto-completes the plan when current_step reaches total_steps", "raises subsequent alert-deadline and extension-risk terms"]
  - method: POST
    path: "/neurodiagnostics/taper-plans/{id}/hold"
    description: "Hold the taper for safety."
    roles: [Epileptologist]
    code: 200
    input: [hold_reason]
    output: TaperPlan
    side_effects: ["ACTIVE -> HELD", "sets hold_reason"]
  - method: POST
    path: "/neurodiagnostics/taper-plans/{id}/resume"
    description: "Resume a held taper."
    roles: [Epileptologist]
    code: 200
    input: []
    output: TaperPlan
    side_effects: ["HELD -> ACTIVE"]

  - method: POST
    path: "/neurodiagnostics/studies"
    description: "Create a video-EEG study for an admission."
    roles: [Technologist]
    code: 201
    input: [admission_id, channel_count, modality]
    output: Study
    side_effects: ["initializes acquisition_state PREPARING and data_state ONLINE"]
  - method: GET
    path: "/neurodiagnostics/studies"
    description: "List studies, filterable by admission, covering shift and either parallel state dimension."
    roles: [UnitCoordinator, Technologist, Nurse, Epileptologist]
    code: 200
    input: ["admission_id?", "shift_id?", "acquisition_state?", "data_state?", "limit?", "offset?"]
    output: Study[]
    side_effects: []
  - method: GET
    path: "/neurodiagnostics/studies/{id}"
    description: "Read a study with acquired_minutes, stored_gb and both state dimensions."
    roles: [UnitCoordinator, Technologist, Nurse, Epileptologist]
    code: 200
    input: []
    output: Study
    side_effects: []
  - method: POST
    path: "/neurodiagnostics/studies/{id}/start"
    description: "Begin acquisition under a named active technologist shift."
    roles: [Technologist]
    code: 200
    input: [shift_id]
    output: Study
    side_effects: ["PREPARING -> ACQUIRING", "pins shift_id and opens the first segment", "increments shift assigned_study_count and unit active_study_count", "recomputes unit posture"]
  - method: POST
    path: "/neurodiagnostics/studies/{id}/pause"
    description: "Pause acquisition, closing the open segment; optionally records electrode maintenance and impedance."
    roles: [Technologist]
    code: 200
    input: [reason, "maintenance_kind?", "impedance_kohm?"]
    output: Study
    side_effects: ["ACQUIRING -> PAUSED", "closes the segment and recomputes acquired_minutes, closed_segment_count and stored_gb", "records last_impedance_kohm and impedance_fail_count for ELECTRODE_REGEL maintenance", "recomputes unit storage_used_gb, storage_pressure_pct and posture"]
  - method: POST
    path: "/neurodiagnostics/studies/{id}/resume"
    description: "Resume a paused acquisition, opening a new segment."
    roles: [Technologist]
    code: 200
    input: []
    output: Study
    side_effects: ["PAUSED -> ACQUIRING", "opens a new segment", "recomputes unit active_study_count and posture"]
  - method: POST
    path: "/neurodiagnostics/studies/{id}/complete"
    description: "Complete acquisition; closes any open segment and creates the preliminary review report."
    roles: [Technologist]
    code: 200
    input: []
    output: Study
    side_effects: ["ACQUIRING|PAUSED -> COMPLETED", "recomputes stored_gb and unit storage fields", "creates one ReviewReport in PRELIM_DRAFT", "decrements shift assigned_study_count"]
  - method: POST
    path: "/neurodiagnostics/studies/{id}/archive"
    description: "Archive a completed study's data, releasing its online storage footprint."
    roles: [UnitCoordinator]
    code: 200
    input: []
    output: Study
    side_effects: ["ONLINE -> ARCHIVED (guarded by acquisition_state == COMPLETED)", "removes stored_gb from unit storage_used_gb and recomputes posture", "may unblock BLOCKED export packages"]
  - method: POST
    path: "/neurodiagnostics/studies/{id}/export-hold"
    description: "Place a legal/clinical hold on the study's data, blocking queued exports."
    roles: [UnitCoordinator]
    code: 200
    input: [hold_reason]
    output: Study
    side_effects: ["ONLINE -> EXPORT_HELD", "moves QUEUED packages of this study to BLOCKED with blocked_reason 'STUDY_EXPORT_HELD'"]
  - method: POST
    path: "/neurodiagnostics/studies/{id}/export-release"
    description: "Release the export hold, returning blocked packages to the queue."
    roles: [UnitCoordinator]
    code: 200
    input: []
    output: Study
    side_effects: ["EXPORT_HELD -> ONLINE", "returns packages blocked by the hold to QUEUED"]

  - method: POST
    path: "/neurodiagnostics/studies/{id}/alerts"
    description: "Raise a seizure-detection alert on an acquiring study; freezes the nurse response deadline."
    roles: [Technologist, Nurse, Epileptologist]
    code: 201
    input: [source]
    output: SeizureAlert
    side_effects: ["sets detected_at from the logical clock", "sets response_deadline_minutes per calculations.alert_response_deadline", "initializes triage_state DETECTED and response_state AWAITING_RESPONSE"]
  - method: GET
    path: "/neurodiagnostics/studies/{id}/alerts"
    description: "List the alerts of a study."
    roles: [UnitCoordinator, Technologist, Nurse, Epileptologist]
    code: 200
    input: ["limit?", "offset?"]
    output: SeizureAlert[]
    side_effects: []
  - method: GET
    path: "/neurodiagnostics/alerts/{id}"
    description: "Read an alert with both state dimensions, its deadline and its latency."
    roles: [UnitCoordinator, Technologist, Nurse, Epileptologist]
    code: 200
    input: []
    output: SeizureAlert
    side_effects: []
  - method: POST
    path: "/neurodiagnostics/alerts/{id}/adjudicate"
    description: "Classify an alert as CLINICAL, SUBCLINICAL or ARTIFACT; the CLINICAL branch requires documented bedside intervention and drives the capture cascade."
    roles: [Epileptologist]
    code: 200
    input: [classification]
    output: SeizureAlert
    side_effects: ["DETECTED -> CONFIRMED_CLINICAL | CONFIRMED_SUBCLINICAL | REJECTED_ARTIFACT", "cascades linked EventMarkings to ADJUDICATED (or RETRACTED on the ARTIFACT branch)", "recomputes the Admission capture fields and may drive CAPTURE_TARGET_MET, which completes the TaperPlan"]
  - method: POST
    path: "/neurodiagnostics/alerts/{id}/close"
    description: "Close an adjudicated alert (join point); unblocks taper advancement."
    roles: [Epileptologist]
    code: 200
    input: []
    output: SeizureAlert
    side_effects: ["CONFIRMED_CLINICAL | CONFIRMED_SUBCLINICAL | REJECTED_ARTIFACT -> CLOSED"]
  - method: POST
    path: "/neurodiagnostics/alerts/{id}/interventions"
    description: "Nurse documents the bedside safety response; the first intervention stamps response latency and timeliness."
    roles: [Nurse]
    code: 201
    input: [interventions, injury_observed, rescue_med_given]
    output: SafetyIntervention
    side_effects: ["sets SeizureAlert.responded_at and latency_minutes on the first intervention", "moves response_state to RESPONDED_ON_TIME or RESPONDED_LATE", "increments MonitoringUnit.late_response_count on the LATE branch"]
  - method: GET
    path: "/neurodiagnostics/alerts/{id}/interventions"
    description: "List the append-only safety interventions documented for an alert."
    roles: [UnitCoordinator, Nurse, Epileptologist]
    code: 200
    input: ["limit?", "offset?"]
    output: SafetyIntervention[]
    side_effects: []

  - method: POST
    path: "/neurodiagnostics/markings"
    description: "Mark a spike or seizure on a study, optionally substantiating an alert; weight is frozen from the taper step at onset."
    roles: [Technologist, Epileptologist]
    code: 201
    input: [study_id, onset_at, event_class, "duration_seconds?", "alert_id?"]
    output: EventMarking
    side_effects: ["captures taper_step_at_onset and computes weight per calculations.capture_adequacy_index", "initializes status PROPOSED, so no capture credit accrues yet"]
  - method: GET
    path: "/neurodiagnostics/markings"
    description: "List markings, filterable by study, substantiated alert and status."
    roles: [UnitCoordinator, Technologist, Nurse, Epileptologist]
    code: 200
    input: ["study_id?", "alert_id?", "status?", "limit?", "offset?"]
    output: EventMarking[]
    side_effects: []
  - method: GET
    path: "/neurodiagnostics/markings/{id}"
    description: "Read one marking with its frozen weight."
    roles: [UnitCoordinator, Technologist, Nurse, Epileptologist]
    code: 200
    input: []
    output: EventMarking
    side_effects: []
  - method: POST
    path: "/neurodiagnostics/markings/{id}/adjudicate"
    description: "Confirm a marking, banking its weight into the admission's capture figures."
    roles: [Epileptologist]
    code: 200
    input: []
    output: EventMarking
    side_effects: ["PROPOSED -> ADJUDICATED", "recomputes Admission.weighted_event_count and both capture_adequacy_index variants", "may drive Admission ADMITTED -> CAPTURE_TARGET_MET"]
  - method: POST
    path: "/neurodiagnostics/markings/{id}/retract"
    description: "Retract a marking; reverses its capture contribution and any target-met cascade."
    roles: [Epileptologist]
    code: 200
    input: [retraction_reason]
    output: EventMarking
    side_effects: ["PROPOSED|ADJUDICATED -> RETRACTED", "recomputes the Admission capture fields downward", "may drive CAPTURE_TARGET_MET -> ADMITTED and return COMPLETED TaperPlans to ACTIVE"]

  - method: GET
    path: "/neurodiagnostics/studies/{id}/reports"
    description: "List the review reports of a study; the only discovery channel for the report created by study completion."
    roles: [UnitCoordinator, Technologist, Epileptologist]
    code: 200
    input: ["limit?", "offset?"]
    output: ReviewReport[]
    side_effects: []
  - method: GET
    path: "/neurodiagnostics/reports/{id}"
    description: "Read a review report with both turnaround variants and the SLA flag."
    roles: [UnitCoordinator, Technologist, Epileptologist]
    code: 200
    input: []
    output: ReviewReport
    side_effects: []
  - method: POST
    path: "/neurodiagnostics/reports/{id}/issue-prelim"
    description: "Issue (or re-issue after an addendum) the preliminary interpretation; computes both turnaround variants."
    roles: [Epileptologist]
    code: 200
    input: [localization]
    output: ReviewReport
    side_effects: ["PRELIM_DRAFT -> PRELIM_ISSUED or ADDENDUM_OPEN -> PRELIM_ISSUED", "on the first issue computes turnaround_calendar_hours, turnaround_coverage_hours and sla_breached and stamps prelim_author_user_id"]
  - method: POST
    path: "/neurodiagnostics/reports/{id}/open-addendum"
    description: "Open an addendum on an issued preliminary report (max 2)."
    roles: [Epileptologist]
    code: 200
    input: [addendum_reason]
    output: ReviewReport
    side_effects: ["PRELIM_ISSUED -> ADDENDUM_OPEN", "increments addendum_count"]
  - method: POST
    path: "/neurodiagnostics/reports/{id}/issue-final"
    description: "Issue the final interpretation; must be a different epileptologist than the preliminary author and requires all markings adjudicated."
    roles: [Epileptologist]
    code: 200
    input: [localization]
    output: ReviewReport
    side_effects: ["PRELIM_ISSUED -> FINAL_ISSUED", "stamps final_author_user_id", "unblocks ExportPackage creation for the study"]

  - method: POST
    path: "/neurodiagnostics/exports"
    description: "Queue a surgical-evaluation export package for a study whose final report is issued. Guarded by optimistic concurrency on Study.version."
    roles: [UnitCoordinator]
    code: 201
    input: [study_id, include_video, expected_study_version, "supersedes_export_id?"]
    output: ExportPackage
    side_effects: ["initializes status QUEUED with package_gb 0", "increments Study.version by 1"]
  - method: GET
    path: "/neurodiagnostics/exports"
    description: "List export packages, filterable by study, superseded package and status."
    roles: [UnitCoordinator, Epileptologist]
    code: 200
    input: ["study_id?", "supersedes_export_id?", "status?", "limit?", "offset?"]
    output: ExportPackage[]
    side_effects: []
  - method: GET
    path: "/neurodiagnostics/exports/{id}"
    description: "Read an export package with its allocated volume and retention expiry."
    roles: [UnitCoordinator, Epileptologist]
    code: 200
    input: []
    output: ExportPackage
    side_effects: []
  - method: POST
    path: "/neurodiagnostics/exports/{id}/build"
    description: "Build a queued package, allocating its storage volume against the unit quota."
    roles: [UnitCoordinator]
    code: 200
    input: []
    output: ExportPackage
    side_effects: ["QUEUED -> BUILT", "sets package_gb per calculations.export_package_gb, built_at and retention_expires_at", "adds package_gb to unit storage_used_gb and recomputes posture", "auto-BLOCKs the unit's other QUEUED packages when the posture becomes STORAGE_LOCKED"]
  - method: POST
    path: "/neurodiagnostics/exports/{id}/deliver"
    description: "Deliver a built package to a surgical center."
    roles: [UnitCoordinator]
    code: 200
    input: [recipient_center]
    output: ExportPackage
    side_effects: ["BUILT -> DELIVERED", "sets delivered_at and recipient_center", "unblocks conference presentation"]
  - method: POST
    path: "/neurodiagnostics/exports/{id}/revoke"
    description: "Revoke a built or delivered package; the compensating action restores the unit's storage figure exactly."
    roles: [UnitCoordinator]
    code: 200
    input: [revocation_reason]
    output: ExportPackage
    side_effects: ["BUILT|DELIVERED -> REVOKED", "subtracts package_gb from unit storage_used_gb and recomputes storage_pressure_pct and posture", "returns packages blocked by the storage lock to QUEUED"]

  - method: POST
    path: "/neurodiagnostics/conference-cases"
    description: "Open a surgical candidacy conference case over a delivered export package."
    roles: [Epileptologist]
    code: 201
    input: [admission_id, export_id]
    output: SurgicalConferenceCase
    side_effects: ["initializes status DRAFT with all tallies 0 and quorum_met FALSE"]
  - method: GET
    path: "/neurodiagnostics/conference-cases"
    description: "List conference cases, filterable by admission, export package and status."
    roles: [UnitCoordinator, Epileptologist]
    code: 200
    input: ["admission_id?", "export_id?", "status?", "limit?", "offset?"]
    output: SurgicalConferenceCase[]
    side_effects: []
  - method: GET
    path: "/neurodiagnostics/conference-cases/{id}"
    description: "Read a conference case with its per-round tallies and quorum flag."
    roles: [UnitCoordinator, Epileptologist]
    code: 200
    input: []
    output: SurgicalConferenceCase
    side_effects: []
  - method: POST
    path: "/neurodiagnostics/conference-cases/{id}/present"
    description: "Present the case (initially or after a deferral), opening the current voting round."
    roles: [Epileptologist]
    code: 200
    input: []
    output: SurgicalConferenceCase
    side_effects: ["DRAFT -> PRESENTED or DEFERRED -> PRESENTED", "stamps presenter_user_id, whose own ballot will be recorded uncounted", "resets the per-round tallies"]
  - method: POST
    path: "/neurodiagnostics/conference-cases/{id}/votes"
    description: "Cast a ballot in the current voting round; the presenter's ballot is recorded with counted == FALSE."
    roles: [Epileptologist]
    code: 201
    input: [specialty, vote, "rationale?"]
    output: ConferenceVote
    side_effects: ["stamps voter_user_id, round_index and counted", "recomputes the case tallies, distinct_specialty_count and quorum_met"]
  - method: GET
    path: "/neurodiagnostics/conference-cases/{id}/votes"
    description: "List the append-only ballots cast on a case across all rounds."
    roles: [UnitCoordinator, Epileptologist]
    code: 200
    input: ["limit?", "offset?"]
    output: ConferenceVote[]
    side_effects: []
  - method: POST
    path: "/neurodiagnostics/conference-cases/{id}/close-vote"
    description: "Close the round and resolve candidacy per the pinned tally order T1..T5."
    roles: [Epileptologist]
    code: 200
    input: []
    output: SurgicalConferenceCase
    side_effects: ["PRESENTED -> CANDIDATE | NON_CANDIDATE | DEFERRED", "sets decision_at on a terminal outcome or increments defer_round on a deferral"]

errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header missing, or X-User-Role is not a declared role"
  - id: ERR_ROLE_NOT_PERMITTED
    http: 403
    condition: "the acting role is not listed in the target endpoint's roles"
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "malformed body, missing required field, enum value outside its declared set, or numeric value outside its declared range"
  - id: ERR_UNIT_NOT_FOUND
    http: 404
    condition: "unit id in path or unit_id in body does not resolve"
  - id: ERR_BED_NOT_FOUND
    http: 404
    condition: "bed_id supplied at admit does not resolve"
  - id: ERR_SHIFT_NOT_FOUND
    http: 404
    condition: "shift id in path or shift_id in body does not resolve"
  - id: ERR_PATIENT_NOT_FOUND
    http: 404
    condition: "patient id in path or patient_id in body does not resolve"
  - id: ERR_AUTHORIZATION_NOT_FOUND
    http: 404
    condition: "authorization id in path or authorization_id in body does not resolve"
  - id: ERR_ADMISSION_NOT_FOUND
    http: 404
    condition: "admission id in path or admission_id in body does not resolve"
  - id: ERR_TAPER_PLAN_NOT_FOUND
    http: 404
    condition: "taper plan id in path does not resolve"
  - id: ERR_STUDY_NOT_FOUND
    http: 404
    condition: "study id in path or study_id in body does not resolve"
  - id: ERR_ALERT_NOT_FOUND
    http: 404
    condition: "alert id in path or alert_id in body does not resolve"
  - id: ERR_MARKING_NOT_FOUND
    http: 404
    condition: "marking id in path does not resolve"
  - id: ERR_REPORT_NOT_FOUND
    http: 404
    condition: "report id in path does not resolve"
  - id: ERR_EXPORT_NOT_FOUND
    http: 404
    condition: "export id in path, export_id in body, or supersedes_export_id does not resolve"
  - id: ERR_CASE_NOT_FOUND
    http: 404
    condition: "conference case id in path does not resolve"
  - id: ERR_INVALID_AUTHORIZATION_STATE
    http: 409
    condition: "submit called on a status other than DRAFT or PENDED, or payer-decision called on a status other than SUBMITTED"
  - id: ERR_INVALID_ADMISSION_STATE
    http: 409
    condition: "admit on a non-SCHEDULED admission, discharge on an admission not in {ADMITTED, CAPTURE_TARGET_MET}, taper action on an admission not ADMITTED, or extension decision on a DISCHARGED admission"
  - id: ERR_INVALID_TAPER_STATE
    http: 409
    condition: "advance-step on a plan not ACTIVE, hold on a plan not ACTIVE, or resume on a plan not HELD"
  - id: ERR_INVALID_STUDY_STATE
    http: 409
    condition: "start on a study not PREPARING, pause on a study not ACQUIRING, resume on a study not PAUSED, complete on a study already COMPLETED, archive on a study whose acquisition_state != COMPLETED, intervention recorded on a study whose acquisition_state is not in {ACQUIRING, PAUSED}, or issue-prelim on a study not COMPLETED"
  - id: ERR_INVALID_DATA_STATE
    http: 409
    condition: "export-hold on a study whose data_state != ONLINE, export-release on a study whose data_state != EXPORT_HELD, archive on a study whose data_state != ONLINE, or build/adjudicate touching PURGED data"
  - id: ERR_INVALID_ALERT_STATE
    http: 409
    condition: "adjudicate on an alert not DETECTED, or close on an alert still DETECTED or already CLOSED"
  - id: ERR_INVALID_MARKING_STATE
    http: 409
    condition: "adjudicate on a marking not PROPOSED, or retract on a marking already RETRACTED"
  - id: ERR_INVALID_REPORT_STATE
    http: 409
    condition: "issue-prelim on a report not in {PRELIM_DRAFT, ADDENDUM_OPEN}, open-addendum on a report not PRELIM_ISSUED, or issue-final on a report not PRELIM_ISSUED"
  - id: ERR_INVALID_EXPORT_STATE
    http: 409
    condition: "build on a package not QUEUED, deliver on a package not BUILT, or revoke on a package not in {BUILT, DELIVERED}"
  - id: ERR_INVALID_CASE_STATE
    http: 409
    condition: "present on a case not in {DRAFT, DEFERRED}, vote on a case not PRESENTED, or close-vote on a case not PRESENTED"
  - id: ERR_INVALID_SHIFT_STATE
    http: 409
    condition: "activate on a shift not SCHEDULED, close on a shift not ACTIVE, or study start naming a CLOSED shift"
  - id: ERR_STALE_ADMISSION_VERSION
    http: 412
    condition: "expected_admission_version does not equal the current Admission.version on POST extension-decisions (§1.2.1 admission-extension-stale)"
  - id: ERR_STALE_STUDY_VERSION
    http: 412
    condition: "expected_study_version does not equal the current Study.version on POST exports (§1.2.1 export-create-stale-study)"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "the X-User-ID issuing the final report equals ReviewReport.prelim_author_user_id"
  - id: ERR_TAPER_BLOCKED_BY_OPEN_EVENT
    http: 409
    condition: "advance-step while a SeizureAlert on the admission's studies has triage_state == CONFIRMED_CLINICAL"
  - id: ERR_INTERVENTION_REQUIRED
    http: 409
    condition: "CLINICAL adjudication or close of a CONFIRMED_CLINICAL alert with no SafetyIntervention documented"
  - id: ERR_NO_TECH_COVERAGE
    http: 409
    condition: "study start or resume when the named shift is not ACTIVE or the logical clock lies outside its half-open window"
  - id: ERR_TECH_CAPACITY_EXCEEDED
    http: 409
    condition: "study start when the shift's assigned_study_count already equals max_concurrent_studies"
  - id: ERR_SETTING_MISMATCH
    http: 422
    condition: "Admission.setting != AuthorizationRequest.authorized_setting at admit, or Study.modality != Admission.setting at start"
  - id: ERR_BED_OCCUPANCY_CONFLICT
    http: 409
    condition: "the requested bed is occupied, or the logical clock is still inside its 90-minute turnover window"
  - id: ERR_BED_REQUIRED_FOR_INPATIENT
    http: 422
    condition: "admit of an INPATIENT_VEEG admission without bed_id"
  - id: ERR_BED_NOT_ALLOWED_FOR_AMBULATORY
    http: 422
    condition: "admit of an AMBULATORY_VEEG admission with bed_id supplied"
  - id: ERR_REPORT_NOT_FINAL
    http: 409
    condition: "export creation for a study whose ReviewReport is not FINAL_ISSUED"
  - id: ERR_MARKING_NOT_ADJUDICATED
    http: 409
    condition: "issue-final while any EventMarking of the study is still PROPOSED"
  - id: ERR_EXPORT_NOT_DELIVERED
    http: 409
    condition: "conference presentation over an export package whose status != DELIVERED"
  - id: ERR_AUTHORIZATION_NOT_APPROVED
    http: 409
    condition: "admit against an authorization whose status != APPROVED"
  - id: ERR_AUTHORIZATION_DAYS_EXHAUSTED
    http: 402
    condition: "admit when AuthorizationRequest.days_available < Admission.planned_days"
  - id: ERR_UNIT_STORAGE_LOCKED
    http: 409
    condition: "admit, study start, study resume or export build while MonitoringUnit.posture == STORAGE_LOCKED (storage_pressure_pct >= 90.00)"
  - id: ERR_STORAGE_QUOTA_EXCEEDED
    http: 409
    condition: "export build whose package_gb would push storage_used_gb above storage_quota_gb"
  - id: ERR_RESUBMISSION_LIMIT
    http: 409
    condition: "resubmit of a PENDED authorization whose resubmission_count already equals 2"
  - id: ERR_ADDENDUM_LIMIT
    http: 409
    condition: "open-addendum on a report whose addendum_count already equals 2"
  - id: ERR_DEFER_LIMIT
    http: 409
    condition: "re-present of a DEFERRED case whose defer_round already equals 2"
  - id: ERR_DUPLICATE_VOTE
    http: 409
    condition: "the acting X-User-ID has already cast a ballot on this case in the current defer_round"
  - id: ERR_QUORUM_NOT_MET
    http: 409
    condition: "close-vote while quorum_met == FALSE (fewer than 3 counted votes, or fewer than 2 distinct specialties)"
  - id: ERR_NO_YIELD_BASIS
    http: 422
    condition: "extension decision when the admission has weighted_event_count == 0 or elapsed_monitored_days == 0, leaving projected_daily_yield undefined"
  - id: ERR_TARGET_ALREADY_MET
    http: 409
    condition: "extension decision on an admission whose clinical_state == CAPTURE_TARGET_MET"
  - id: ERR_MARKING_OUTSIDE_STUDY_WINDOW
    http: 422
    condition: "marking onset_at falls outside every closed acquisition segment of the study"
  - id: ERR_OPEN_STUDY_ON_DISCHARGE
    http: 409
    condition: "discharge while a study of the admission is still in {PREPARING, ACQUIRING, PAUSED}"
  - id: ERR_SHIFT_HAS_ACTIVE_STUDIES
    http: 409
    condition: "shift close while assigned_study_count > 0"
  - id: ERR_SHIFT_WINDOW_INVALID
    http: 422
    condition: "shift creation with ends_at <= starts_at"
  - id: ERR_CLOCK_MONOTONIC
    http: 422
    condition: "POST /_clock/set_current_utc with to_iso8601 earlier than the current logical clock"
  - id: ERR_EXPORT_IN_DECIDED_CASE
    http: 409
    condition: "revoke of a delivered package referenced by a SurgicalConferenceCase in status CANDIDATE or NON_CANDIDATE"

roles:
  - name: UnitCoordinator
    description: "Runs the unit: units, beds, shift roster, patients, authorizations, admissions, discharges, data lifecycle (archive/hold), export packaging and retention sweeps."
    identity: "opaque"
    exclusive_operations:
      - "POST /neurodiagnostics/units"
