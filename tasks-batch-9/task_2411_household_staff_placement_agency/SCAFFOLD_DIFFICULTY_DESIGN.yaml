- rule_id: non_linear_state_machine
  instances:
  - name: requisition_rescope_loop_clears_the_fee_stamp_and_caps_at_three_rounds
    grounds: state_machines.RoleRequisition (DRAFT -> SCOPING, SCOPING -> SOURCING, SOURCING -> SCOPING); validations.scoping_round_cap;
      global_constants.MAX_SCOPING_ROUNDS
    mechanism: 'The requisition cycles SOURCING -> SCOPING -> SOURCING. Every re-scope increments scoping_round and
      clears resolved_fee_schedule_id, fee_percent_bps, guarantee_window_days and provisional_fee_cents back to null,
      so the fee stamp only exists between finalize-scope and the next re-scope. The loop is bounded: a fourth scope
      attempt at scoping_round 3 is refused.'
    naive_implementation: Treat scope as an idempotent edit that never revisits the fee stamp, or allow the loop to
      run forever because no round counter is kept.
    distinguishing_aspect: After the second scope the requisition is back in SCOPING with all four fee fields null
      even though they were populated a moment earlier, and the fourth scope attempt is refused with the requisition
      left untouched in SOURCING at scoping_round 3.
    test_recipe:
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        as: AgencyPrincipal
        payload:
          current_utc: '2026-08-01T00:00:00Z'
      - call: POST /clients
        as: AgencyPrincipal
        payload:
          household_name: Dunmore Lodge
          primary_contact_email: ops@dunmore.example
          region_code: CT
        captures:
          client_id: $.data.id
      - call: POST /clients/${client_id}/confidentiality-agreement
        as: Client
        payload:
          action: SIGN
          signatory_name: A. Dunmore
      - call: POST /clients/${client_id}/confidentiality-agreement
        as: AgencyPrincipal
        payload:
          action: COUNTERSIGN
      - call: POST /fee-schedules
        as: AgencyPrincipal
        payload:
          role_type: CHAUFFEUR
          comp_band_floor_cents: 0
          fee_percent_bps: 1500
          guarantee_window_days: 60
          effective_from: '2026-01-01'
      - call: POST /role-requisitions
        as: PlacementConsultant
        payload:
          client_id: ${client_id}
          role_type: CHAUFFEUR
          first_year_compensation_cents: 5400000
          schedule_pattern: FIVE_TWO
          live_in_required: false
        captures:
          req_id: $.data.id
      - call: POST /role-requisitions/${req_id}/scope
        as: PlacementConsultant
        payload:
          scope_note: Two vehicles, evening cover.
      - call: POST /role-requisitions/${req_id}/finalize-scope
        as: PlacementConsultant
        payload:
          note: Scope agreed with the household.
        captures:
          bps1: $.data.fee_percent_bps
          prov1: $.data.provisional_fee_cents
      - call: POST /role-requisitions/${req_id}/scope
        as: PlacementConsultant
        payload:
          scope_note: Household added weekend cover.
          first_year_compensation_cents: 5800000
        captures:
          round2: $.data.scoping_round
          bps_after_rescope: $.data.fee_percent_bps
      - call: POST /role-requisitions/${req_id}/finalize-scope
        as: PlacementConsultant
        payload:
          note: Second scope agreed.
      - call: POST /role-requisitions/${req_id}/scope
        as: PlacementConsultant
        payload:
          scope_note: Household reverted to weekday cover.
          first_year_compensation_cents: 5400000
      - call: POST /role-requisitions/${req_id}/finalize-scope
        as: PlacementConsultant
        payload:
          note: Third scope agreed.
        captures:
          round3: $.data.scoping_round
      trigger:
      - call: POST /role-requisitions/${req_id}/scope
        as: PlacementConsultant
        payload:
          scope_note: A fourth change of mind.
        captures:
          err: $.data.error_id
      asserts:
      - the first finalize-scope stamped fee_percent_bps == 1500 and provisional_fee_cents == 810000
      - the second scope returned 200 with status == SCOPING, scoping_round == 2 and resolved_fee_schedule_id, fee_percent_bps,
        guarantee_window_days and provisional_fee_cents all null
      - the second finalize-scope re-stamped provisional_fee_cents == 870000 from the new 5800000 compensation
      - the third finalize-scope left status == SOURCING and scoping_round == 3 with provisional_fee_cents back to
        810000
      - the trigger returns 409 with error_id == ERR_SCOPING_ROUND_LIMIT
      - GET /role-requisitions/${req_id} after the trigger still reads status == SOURCING, scoping_round == 3 and
        provisional_fee_cents == 810000 - the refused attempt changed nothing
  - name: candidate_vetting_and_availability_dimensions_advance_independently
    grounds: state_machines.Candidate.vetting_status; state_machines.Candidate.availability_status; complexity_profile.state_machine_shape
      (parallel dimensions on one row)
    mechanism: The candidate carries two independent state dimensions on the same row. The vetting dimension walks
      UNVETTED -> SCREENING -> REFERENCES_VERIFIED -> BACKGROUND_PENDING -> CLEARED entirely while the availability
      dimension stays AVAILABLE; booking a trial then moves availability to ON_TRIAL without touching vetting, and
      a FAILED outcome returns availability to AVAILABLE with vetting still CLEARED.
