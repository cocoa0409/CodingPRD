  # =====================================================================
  # SECTION 8 — CROSS-CUTTING COMPLEXITY LAYERS (§1.0 complexity_profile)
  # =====================================================================
  - section: cross_cutting_complexity_layers
    instances:
      - name: all_three_occ_guards_reject_a_stale_parent_version_independently
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[contract-activate-stale-shipper]
          - concurrency_rules[scan-capture-stale-shipment]
          - concurrency_rules[adjustment-create-stale-invoice]
        distinguishing_aspect: |
          Three different parents each guard a different write, and each one is proved by
          replaying a version that a successful sibling call has already consumed: activating
          a second contract with the shipper version the first activation burned, capturing a
          second scan with the shipment version the first scan burned, and proposing a second
          adjustment with the invoice version the first proposal burned. A mere PROPOSAL is
          enough to invalidate the invoice version, which is the case implementations miss.
        test_recipe:
          setup:
            - "SH-2001 is ACTIVE at version 1. Two DRAFT contracts exist for it with non-overlapping periods: C1 covering [2026-01-01, 2026-12-31] and C2 covering [2027-01-01, 2027-12-31], both divisor 139, min charge 1195, zone-2 rows 380/340/305."
            - "ServiceLevel EXPRESS exists."
          setup_api_calls:
            - call: "POST /shipper-accounts"
              payload: { account_number: "SH-2001", name: "Acme Parcel" }
              as: CarrierAdmin
              captures: { sh: $.data.id, sh_v1: $.data.version }
            - call: "POST /service-levels"
              payload: { code: "EXPRESS", name: "Express", guarantee_hours: 24, guaranteed: true }
              as: CarrierAdmin
              captures: { sl: $.data.id }
            - call: "POST /rate-contracts"
              payload:
                shipper_id: "${sh}"
                effective_from: "2026-01-01"
                effective_to: "2026-12-31"
                dim_divisor: 139
                min_charge_cents: 1195
                rate_table: [{zone: 2, min_lbs: 1, max_lbs: 20, cents_per_lb: 380}, {zone: 2, min_lbs: 21, max_lbs: 70, cents_per_lb: 340}, {zone: 2, min_lbs: 71, max_lbs: 9999, cents_per_lb: 305}]
                tier_discount_table: [{min_transportation_subtotal_cents: 50000, discount_bps: 550}]
              as: CarrierAdmin
              captures: { c1: $.data.id }
            - call: "POST /rate-contracts"
              payload:
                shipper_id: "${sh}"
                effective_from: "2027-01-01"
                effective_to: "2027-12-31"
                dim_divisor: 139
                min_charge_cents: 1195
                rate_table: [{zone: 2, min_lbs: 1, max_lbs: 20, cents_per_lb: 380}, {zone: 2, min_lbs: 21, max_lbs: 70, cents_per_lb: 340}, {zone: 2, min_lbs: 71, max_lbs: 9999, cents_per_lb: 305}]
                tier_discount_table: [{min_transportation_subtotal_cents: 50000, discount_bps: 550}]
              as: CarrierAdmin
              captures: { c2: $.data.id }
          trigger:
            - call: "POST /rate-contracts/${c1}/activate"
              payload: { expected_shipper_account_version: "${sh_v1}" }
              as: CarrierAdmin
              captures: { c1_state: $.data.status }
            - call: "POST /rate-contracts/${c2}/activate"
              payload: { expected_shipper_account_version: "${sh_v1}" }
              as: CarrierAdmin
              captures: { e_shipper: $.data.error_id }
            - call: "GET /shipper-accounts/${sh}"
              payload: {}
              as: CarrierAdmin
              captures: { sh_v2: $.data.version }
            - call: "POST /rate-contracts/${c2}/activate"
              payload: { expected_shipper_account_version: "${sh_v2}" }
              as: CarrierAdmin
              captures: { c2_state: $.data.status }
            - call: "POST /shipments"
              payload: { shipper_id: "${sh}", service_level_id: "${sl}", tracking_number: "1Z-X-1001", zone: 2, residential_declared: false, declared_length_in: 12, declared_width_in: 10, declared_height_in: 8, declared_weight_lbs: 6.0 }
              as: CarrierOps
              captures: { p: $.data.id, p_v1: $.data.version }
            - call: "POST /shipments/${p}/scans"
              payload: { scan_source: "AUTOMATED_DWS", scanned_length_in: 12, scanned_width_in: 10, scanned_height_in: 8, scanned_weight_lbs: 6.0, expected_shipment_version: "${p_v1}" }
              as: CarrierOps
              captures: { scan1: $.data.id }
            - call: "POST /shipments/${p}/scans"
              payload: { scan_source: "AUTOMATED_DWS", scanned_length_in: 12, scanned_width_in: 10, scanned_height_in: 8, scanned_weight_lbs: 6.0, expected_shipment_version: "${p_v1}" }
              as: CarrierOps
              captures: { e_shipment: $.data.error_id }
            - call: "GET /shipments/${p}"
              payload: {}
              as: CarrierOps
              captures: { p_v2: $.data.version }
            - call: "POST /shipments/${p}/scans"
