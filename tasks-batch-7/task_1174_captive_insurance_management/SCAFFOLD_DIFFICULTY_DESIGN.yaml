# =============================================================================
# SCAFFOLD_DIFFICULTY_DESIGN.yaml — Captive Insurance Management (task_1174)
# 9 Difficulty Rules x 2+ instances each = 18+ instances total
# =============================================================================

scaffold_difficulty_design:
  # =========================================================================
  # Rule 1: Dual-variant calculations across different entity domains
  # =========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: solvency_standard_vs_conservative_collateral_haircut
        grounds:
          - calculations.solvency_ratio_calculation
          - calculations.collateral_valuation
          - entities.CaptiveEntity.fields.solvency_ratio
          - entities.CollateralPosting.fields.effective_value_cents
        distinguishing_aspect: |
          Same collateral amount produces different effective_value_cents depending on
          whether CaptiveEntity.tax_classification is MICRO_CAPTIVE_831B (conservative,
          LOC haircut 7.5%) or STANDARD_831A (standard, LOC haircut 5%). This is a
          dual-variant on the CaptiveEntity domain (solvency), distinct from premium
          allocation variants on the InsuranceProgram domain.
        test_recipe:
          setup:
            - "CaptiveEntity created with tax_classification = MICRO_CAPTIVE_831B, status = CAPITALIZED"
            - "InsuranceProgram created, status = BOUND, fronting_required = true"
            - "FrontingArrangement created, status = TERMS_AGREED, collateral_required = 100000"
            - "CollateralPosting of type LETTER_OF_CREDIT for 100000 cents"
          setup_api_calls:
            - call: "POST /api/captives"
              payload: { captive_name: "Test Captive A", domicile_jurisdiction: "VERMONT", formation_date: "2026-01-15T00:00:00Z", capitalization_amount: 500000, tax_classification: "MICRO_CAPTIVE_831B" }
              as: CaptiveManager
              captures: { captive_id: $.data.id, captive_ver: $.data.version }
            - call: "POST /api/captives/${captive_id}/domicile-filings"
              payload: { filing_type: "INITIAL_FORMATION", jurisdiction: "VERMONT", supporting_documents: [{document_type: "ARTICLES", document_url: "https://docs.example.com/articles.pdf", uploaded_at: "2026-01-15T00:00:00Z"}] }
              as: CaptiveManager
              captures: { filing_id: $.data.id }
            - call: "POST /api/captives/${captive_id}/domicile-filings/${filing_id}/submit"
              payload: {}
              as: CaptiveManager
            - call: "POST /api/captives/${captive_id}/domicile-filings/${filing_id}/acknowledge"
              payload: {}
              as: DomicileRegulator
            - call: "POST /api/captives/${captive_id}/domicile-filings/${filing_id}/approve"
              payload: {}
              as: DomicileRegulator
            - call: "POST /api/captives/${captive_id}/programs"
              payload: { program_name: "GL Program", line_of_business: "GENERAL_LIABILITY", policy_period_start: "2026-06-01T00:00:00Z", policy_period_end: "2027-05-31T23:59:59Z", aggregate_limit_cents: 1000000, per_occurrence_limit_cents: 250000, attachment_point_cents: 10000, premium_budget_cents: 200000, fronting_required: true, expected_captive_version: "${captive_ver}" }
              as: Underwriter
              captures: { program_id: $.data.id }
            - call: "POST /api/captives/${captive_id}/programs/${program_id}/quote"
              payload: {}
              as: Underwriter
            - call: "POST /api/captives/${captive_id}/programs/${program_id}/fronting"
              payload: { fronting_carrier_name: "FrontCo", fronting_fee_pct: 0.08, reinsurance_ceded_pct: 0.90 }
              as: Underwriter
              captures: { fronting_id: $.data.id }
            - call: "POST /api/captives/${captive_id}/programs/${program_id}/fronting/${fronting_id}/agree-terms"
              payload: {}
              as: Underwriter
            - call: "POST /api/captives/${captive_id}/programs/${program_id}/fronting/${fronting_id}/collateral"
              payload: { collateral_type: "LETTER_OF_CREDIT", amount_cents: 100000, posted_date: "2026-05-01T00:00:00Z", expiry_date: "2027-05-01T00:00:00Z", issuing_institution: "First Bank" }
              as: CaptiveManager
              captures: { collateral_id: $.data.id, effective_value: $.data.effective_value_cents }
          trigger:
            - call: "GET /api/captives/${captive_id}/programs/${program_id}/fronting/${fronting_id}/collateral/${collateral_id}"
              as: CaptiveManager
          assert:
            - "CollateralPosting.${collateral_id}.effective_value_cents == 92500 (conservative 7.5% haircut on 100000)"
            - "CollateralPosting.${collateral_id}.haircut_pct == 0.075"

      - name: premium_allocation_provisional_vs_final_rounding
        grounds:
          - calculations.premium_allocation_calculation
          - entities.PremiumAllocation.fields.provisional_amount_cents
          - entities.PremiumAllocation.fields.final_amount_cents
          - entities.PremiumAllocation.fields.adjustment_cents
        distinguishing_aspect: |
          Same premium allocation produces different amounts: provisional variant rounds
          up to nearest 100 cents (conservatism), final variant rounds to exact cent.
          This operates on the InsuranceProgram/OperatingUnit domain, distinct from the
          CaptiveEntity solvency domain of the other dual_variant_calc instance.
        test_recipe:
          setup:
            - "CaptiveEntity created, status = ACTIVE"
            - "InsuranceProgram created and bound, premium_budget = 200000"
            - "Two OperatingUnits: UnitA exposure=1000, UnitB exposure=3000"
            - "PremiumAllocation for UnitA with EXPOSURE_PRO_RATA method"
          setup_api_calls:
            - call: "POST /api/captives"
              payload: { captive_name: "Test Captive B", domicile_jurisdiction: "BERMUDA", formation_date: "2026-01-15T00:00:00Z", capitalization_amount: 500000 }
              as: CaptiveManager
              captures: { captive_id: $.data.id, captive_ver: $.data.version }
            - call: "POST /api/captives/${captive_id}/domicile-filings"
              payload: { filing_type: "INITIAL_FORMATION", jurisdiction: "BERMUDA", supporting_documents: [{document_type: "ARTICLES", document_url: "https://docs.example.com/articles.pdf", uploaded_at: "2026-01-15T00:00:00Z"}] }
              as: CaptiveManager
              captures: { filing_id: $.data.id }
            - call: "POST /api/captives/${captive_id}/domicile-filings/${filing_id}/submit"
              payload: {}
              as: CaptiveManager
            - call: "POST /api/captives/${captive_id}/domicile-filings/${filing_id}/acknowledge"
              payload: {}
              as: DomicileRegulator
            - call: "POST /api/captives/${captive_id}/domicile-filings/${filing_id}/approve"
              payload: {}
              as: DomicileRegulator
            - call: "POST /api/captives/${captive_id}/operating-units"
              payload: { unit_name: "Unit Alpha", unit_code: "UA", exposure_basis: "REVENUE", exposure_amount: 1000 }
              as: CaptiveManager
              captures: { unit_a_id: $.data.id }
            - call: "POST /api/captives/${captive_id}/operating-units"
              payload: { unit_name: "Unit Beta", unit_code: "UB", exposure_basis: "REVENUE", exposure_amount: 3000 }
              as: CaptiveManager
              captures: { unit_b_id: $.data.id }
            - call: "POST /api/captives/${captive_id}/programs"
              payload: { program_name: "WC Program", line_of_business: "WORKERS_COMP", policy_period_start: "2026-06-01T00:00:00Z", policy_period_end: "2027-05-31T23:59:59Z", aggregate_limit_cents: 1000000, per_occurrence_limit_cents: 250000, attachment_point_cents: 10000, premium_budget_cents: 200000, expected_captive_version: "${captive_ver}" }
              as: Underwriter
              captures: { program_id: $.data.id }
            - call: "POST /api/captives/${captive_id}/programs/${program_id}/quote"
              payload: {}
              as: Underwriter
            - call: "POST /api/captives/${captive_id}/programs/${program_id}/bind"
              payload: {}
              as: Underwriter
            - call: "POST /api/captives/${captive_id}/activate"
              payload: {}
              as: CaptiveManager
            - call: "POST /api/captives/${captive_id}/programs/${program_id}/activate"
              payload: {}
              as: Underwriter
            - call: "POST /api/captives/${captive_id}/programs/${program_id}/allocations"
              payload: { operating_unit_id: "${unit_a_id}", allocation_method: "EXPOSURE_PRO_RATA", allocation_period_start: "2026-06-01T00:00:00Z", allocation_period_end: "2027-05-31T23:59:59Z" }
              as: Underwriter
              captures: { alloc_id: $.data.id, provisional_amount: $.data.provisional_amount_cents }
          trigger:
            - call: "GET /api/captives/${captive_id}/programs/${program_id}/allocations/${alloc_id}"
              as: Actuary
          assert:
            - "PremiumAllocation.${alloc_id}.provisional_amount_cents == 50000 (200000 * 1000/4000 = 50000, rounded up to nearest 100 = 50000)"
            - "PremiumAllocation.${alloc_id}.status == PROVISIONAL"

  # =========================================================================
  # Rule 2: Combinatorial formulas across different modes
  # =========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: risk_distribution_three_factor_weighted_score
        grounds:
          - calculations.risk_distribution_analysis
          - entities.TaxPosition.fields.risk_distribution_test_result
          - entities.TaxPosition.fields.insured_entities_count
          - entities.TaxPosition.fields.third_party_premium_pct
        distinguishing_aspect: |
          Mode (a): formula with 3+ inputs (insured_entities_count, third_party_premium_pct,
          premium_concentration) and non-linear interaction — each factor has tiered
          thresholds producing 0/15/20/30/40 points, summed to produce a 0-100 score
          that maps to PASS/MARGINAL/FAIL. The tiers interact non-linearly because
          failing one factor can drop the total below the PASS threshold even when
          other factors score maximum.
        test_recipe:
          setup:
            - "CaptiveEntity ACTIVE with 3 operating units (below 12-entity minimum)"
            - "Premium allocations concentrated in 1 unit (100% concentration)"
            - "No third-party premium"
          setup_api_calls:
            - call: "POST /api/captives"
              payload: { captive_name: "Test Captive C", domicile_jurisdiction: "CAYMAN", formation_date: "2026-01-15T00:00:00Z", capitalization_amount: 500000 }
              as: CaptiveManager
              captures: { captive_id: $.data.id, captive_ver: $.data.version }
            - call: "POST /api/captives/${captive_id}/domicile-filings"
              payload: { filing_type: "INITIAL_FORMATION", jurisdiction: "CAYMAN", supporting_documents: [{document_type: "ARTICLES", document_url: "https://docs.example.com/a.pdf", uploaded_at: "2026-01-15T00:00:00Z"}] }
              as: CaptiveManager
              captures: { filing_id: $.data.id }
            - call: "POST /api/captives/${captive_id}/domicile-filings/${filing_id}/submit"
              payload: {}
              as: CaptiveManager
            - call: "POST /api/captives/${captive_id}/domicile-filings/${filing_id}/acknowledge"
              payload: {}
              as: DomicileRegulator
            - call: "POST /api/captives/${captive_id}/domicile-filings/${filing_id}/approve"
              payload: {}
              as: DomicileRegulator
            - call: "POST /api/captives/${captive_id}/operating-units"
              payload: { unit_name: "Only Unit", unit_code: "OU1", exposure_basis: "REVENUE", exposure_amount: 5000 }
              as: CaptiveManager
              captures: { unit_id: $.data.id }
            - call: "POST /api/captives/${captive_id}/programs"
              payload: { program_name: "Prop Program", line_of_business: "PROPERTY", policy_period_start: "2026-06-01T00:00:00Z", policy_period_end: "2027-05-31T23:59:59Z", aggregate_limit_cents: 1000000, per_occurrence_limit_cents: 250000, attachment_point_cents: 10000, premium_budget_cents: 200000, expected_captive_version: "${captive_ver}" }
              as: Underwriter
              captures: { program_id: $.data.id }
            - call: "POST /api/captives/${captive_id}/programs/${program_id}/quote"
              payload: {}
              as: Underwriter
            - call: "POST /api/captives/${captive_id}/programs/${program_id}/bind"
              payload: {}
              as: Underwriter
            - call: "POST /api/captives/${captive_id}/activate"
              payload: {}
              as: CaptiveManager
            - call: "POST /api/captives/${captive_id}/programs/${program_id}/activate"
              payload: {}
              as: Underwriter
            - call: "POST /api/captives/${captive_id}/tax-positions"
              payload: { tax_year: 2026, position_type: "RISK_DISTRIBUTION", position_description: "Annual risk distribution analysis" }
              as: TaxAdvisor
              captures: { position_id: $.data.id }
          trigger:
            - call: "POST /api/captives/${captive_id}/tax-positions/${position_id}/analyze"
              as: TaxAdvisor
          assert:
            - "TaxPosition.${position_id}.insured_entities_count == 1"
            - "TaxPosition.${position_id}.risk_distribution_test_result == FAIL"
            - "TaxPosition.${position_id}.status == ANALYZED"

      - name: collateral_valuation_nested_rounding_order
        grounds:
          - calculations.collateral_valuation
          - entities.CollateralPosting.fields.effective_value_cents
          - entities.CollateralPosting.fields.haircut_pct
        distinguishing_aspect: |
          Mode (b): nested rounding where the order matters — haircut is applied first
          (amount * (1 - haircut_pct)), then the result is rounded to integer cents.
          If we summed collateral amounts first then applied aggregate haircut, we would
          get a different total. The scaffold pins per-posting rounding then sum.
          E.g., 33333 * (1 - 0.05) = 31666.35 -> 31666 (per-posting) vs
          33333 + 33333 = 66666 * 0.95 = 63332.7 -> 63333 (aggregate).
        test_recipe:
          setup:
            - "CaptiveEntity with STANDARD_831A tax classification, status = CAPITALIZED"
            - "Program with fronting, FrontingArrangement in TERMS_AGREED"
            - "Two CollateralPostings of 33333 cents each, type LETTER_OF_CREDIT (5% haircut)"
          setup_api_calls:
            - call: "POST /api/captives"
              payload: { captive_name: "Test Captive D", domicile_jurisdiction: "GUERNSEY", formation_date: "2026-01-15T00:00:00Z", capitalization_amount: 500000, tax_classification: "STANDARD_831A" }
              as: CaptiveManager
              captures: { captive_id: $.data.id, captive_ver: $.data.version }
            - call: "POST /api/captives/${captive_id}/domicile-filings"
              payload: { filing_type: "INITIAL_FORMATION", jurisdiction: "GUERNSEY", supporting_documents: [{document_type: "ARTICLES", document_url: "https://docs.example.com/a.pdf", uploaded_at: "2026-01-15T00:00:00Z"}] }
              as: CaptiveManager
              captures: { filing_id: $.data.id }
            - call: "POST /api/captives/${captive_id}/domicile-filings/${filing_id}/submit"
              payload: {}
              as: CaptiveManager
            - call: "POST /api/captives/${captive_id}/domicile-filings/${filing_id}/acknowledge"
              payload: {}
              as: DomicileRegulator
            - call: "POST /api/captives/${captive_id}/domicile-filings/${filing_id}/approve"
              payload: {}
              as: DomicileRegulator
            - call: "POST /api/captives/${captive_id}/programs"
              payload: { program_name: "Cyber Program", line_of_business: "CYBER", policy_period_start: "2026-06-01T00:00:00Z", policy_period_end: "2027-05-31T23:59:59Z", aggregate_limit_cents: 1000000, per_occurrence_limit_cents: 250000, attachment_point_cents: 10000, premium_budget_cents: 200000, fronting_required: true, expected_captive_version: "${captive_ver}" }
              as: Underwriter
              captures: { program_id: $.data.id }
            - call: "POST /api/captives/${captive_id}/programs/${program_id}/quote"
              payload: {}
              as: Underwriter
            - call: "POST /api/captives/${captive_id}/programs/${program_id}/fronting"
              payload: { fronting_carrier_name: "FrontCo2", fronting_fee_pct: 0.05, reinsurance_ceded_pct: 0.80 }
              as: Underwriter
              captures: { fronting_id: $.data.id }
            - call: "POST /api/captives/${captive_id}/programs/${program_id}/fronting/${fronting_id}/agree-terms"
              payload: {}
              as: Underwriter
            - call: "POST /api/captives/${captive_id}/programs/${program_id}/fronting/${fronting_id}/collateral"
              payload: { collateral_type: "LETTER_OF_CREDIT", amount_cents: 33333, posted_date: "2026-05-01T00:00:00Z", expiry_date: "2027-05-01T00:00:00Z", issuing_institution: "Bank A" }
              as: CaptiveManager
              captures: { coll1_id: $.data.id, coll1_effective: $.data.effective_value_cents }
            - call: "POST /api/captives/${captive_id}/programs/${program_id}/fronting/${fronting_id}/collateral"
              payload: { collateral_type: "LETTER_OF_CREDIT", amount_cents: 33333, posted_date: "2026-05-01T00:00:00Z", expiry_date: "2027-05-01T00:00:00Z", issuing_institution: "Bank B" }
              as: CaptiveManager
              captures: { coll2_id: $.data.id, coll2_effective: $.data.effective_value_cents }
          trigger:
            - call: "GET /api/captives/${captive_id}/programs/${program_id}/fronting/${fronting_id}/collateral/${coll1_id}"
              as: CaptiveManager
            - call: "GET /api/captives/${captive_id}/programs/${program_id}/fronting/${fronting_id}/collateral/${coll2_id}"
              as: CaptiveManager
          assert:
            - "CollateralPosting.${coll1_id}.effective_value_cents == 31666 (33333 * 0.95 = 31666.35, round_half_up = 31666)"
            - "CollateralPosting.${coll2_id}.effective_value_cents == 31666 (same per-posting rounding)"
            - "Sum of effective values = 63332 (per-posting rounding), NOT 63333 (aggregate rounding)"

  # =========================================================================
  # Rule 3: Non-linear state-machine shape on different entities
  # =========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: claim_parallel_dimensions_payment_and_litigation
        grounds:
          - state_machines.Claim
          - entities.Claim.fields.claim_status
          - entities.Claim.fields.payment_status
          - entities.Claim.fields.litigation_status
        distinguishing_aspect: |
          Claim has parallel state dimensions: claim_status (REPORTED->ACK->INV->RESERVED->SETTLED/DENIED)
          x payment_status (UNPAID->PARTIALLY_PAID->FULLY_PAID) x litigation_status
          (NOT_LITIGATED->LITIGATED->SETTLED_IN_LITIGATION). These evolve independently
          on the same entity. This is a parallel-dimensions shape on Claim.
        test_recipe:
          setup:
            - "CaptiveEntity ACTIVE, program IN_FORCE"
            - "Claim created, acknowledged, investigated, reserved"
          setup_api_calls:
            - call: "POST /api/captives"
              payload: { captive_name: "Test Captive E", domicile_jurisdiction: "VERMONT", formation_date: "2026-01-15T00:00:00Z", capitalization_amount: 500000 }
              as: CaptiveManager
              captures: { captive_id: $.data.id, captive_ver: $.data.version }
            - call: "POST /api/captives/${captive_id}/domicile-filings"
              payload: { filing_type: "INITIAL_FORMATION", jurisdiction: "VERMONT", supporting_documents: [{document_type: "ARTICLES", document_url: "https://docs.example.com/a.pdf", uploaded_at: "2026-01-15T00:00:00Z"}] }
              as: CaptiveManager
              captures: { filing_id: $.data.id }
            - call: "POST /api/captives/${captive_id}/domicile-filings/${filing_id}/submit"
              payload: {}
              as: CaptiveManager
            - call: "POST /api/captives/${captive_id}/domicile-filings/${filing_id}/acknowledge"
              payload: {}
              as: DomicileRegulator
            - call: "POST /api/captives/${captive_id}/domicile-filings/${filing_id}/approve"
              payload: {}
              as: DomicileRegulator
            - call: "POST /api/captives/${captive_id}/operating-units"
              payload: { unit_name: "Unit X", unit_code: "UX", exposure_basis: "PAYROLL", exposure_amount: 2000 }
              as: CaptiveManager
              captures: { unit_id: $.data.id }
            - call: "POST /api/captives/${captive_id}/programs"
              payload: { program_name: "GL Prog", line_of_business: "GENERAL_LIABILITY", policy_period_start: "2026-06-01T00:00:00Z", policy_period_end: "2027-05-31T23:59:59Z", aggregate_limit_cents: 1000000, per_occurrence_limit_cents: 250000, attachment_point_cents: 10000, premium_budget_cents: 200000, expected_captive_version: "${captive_ver}" }
              as: Underwriter
              captures: { program_id: $.data.id }
            - call: "POST /api/captives/${captive_id}/programs/${program_id}/quote"
              payload: {}
              as: Underwriter
            - call: "POST /api/captives/${captive_id}/programs/${program_id}/bind"
              payload: {}
              as: Underwriter
            - call: "POST /api/captives/${captive_id}/activate"
              payload: {}
              as: CaptiveManager
            - call: "POST /api/captives/${captive_id}/programs/${program_id}/activate"
              payload: {}
              as: Underwriter
            - call: "POST /api/captives/${captive_id}/programs/${program_id}/claims"
              payload: { operating_unit_id: "${unit_id}", claimant_name: "John Doe", loss_date: "2026-07-15T00:00:00Z", claimed_amount_cents: 50000 }
              as: ClaimsAdjuster
              captures: { claim_id: $.data.id }
            - call: "POST /api/captives/${captive_id}/programs/${program_id}/claims/${claim_id}/acknowledge"
              payload: {}
              as: ClaimsAdjuster
            - call: "POST /api/captives/${captive_id}/programs/${program_id}/claims/${claim_id}/investigate"
              payload: {}
              as: ClaimsAdjuster
            - call: "POST /api/captives/${captive_id}/programs/${program_id}/claims/${claim_id}/set-reserve"
              payload: { reserve_amount_cents: 45000 }
              as: Actuary
          trigger:
            - call: "GET /api/captives/${captive_id}/programs/${program_id}/claims/${claim_id}"
              as: ClaimsAdjuster
          assert:
            - "Claim.${claim_id}.claim_status == RESERVED"
            - "Claim.${claim_id}.payment_status == UNPAID"
            - "Claim.${claim_id}.litigation_status == NOT_LITIGATED"
            - "Claim.${claim_id}.reserved_amount_cents == 45000"

      - name: tpa_assignment_cyclic_suspend_reinstate
        grounds:
          - state_machines.TPAAssignment
          - entities.TPAAssignment.fields.status
        distinguishing_aspect: |
          TPAAssignment has a cyclic state machine: ACTIVE -> SUSPENDED -> ACTIVE (reinstate)
          -> SUSPENDED -> TERMINATED. This is a cycle (A->B->A) on TPAAssignment, distinct
          from the parallel dimensions on Claim.
        test_recipe:
          setup:
            - "CaptiveEntity ACTIVE, program IN_FORCE"
            - "Claim created with TPA assigned, TPA in ACTIVE"
          setup_api_calls:
            - call: "POST /api/captives"
              payload: { captive_name: "Test Captive F", domicile_jurisdiction: "LUXEMBOURG", formation_date: "2026-01-15T00:00:00Z", capitalization_amount: 500000 }
              as: CaptiveManager
              captures: { captive_id: $.data.id, captive_ver: $.data.version }
            - call: "POST /api/captives/${captive_id}/domicile-filings"
              payload: { filing_type: "INITIAL_FORMATION", jurisdiction: "LUXEMBOURG", supporting_documents: [{document_type: "ARTICLES", document_url: "https://docs.example.com/a.pdf", uploaded_at: "2026-01-15T00:00:00Z"}] }
              as: CaptiveManager
              captures: { filing_id: $.data.id }
            - call: "POST /api/captives/${captive_id}/domicile-filings/${filing_id}/submit"
              payload: {}
              as: CaptiveManager
            - call: "POST /api/captives/${captive_id}/domicile-filings/${filing_id}/acknowledge"
              payload: {}
              as: DomicileRegulator
            - call: "POST /api/captives/${captive_id}/domicile-filings/${filing_id}/approve"
              payload: {}
              as: DomicileRegulator
            - call: "POST /api/captives/${captive_id}/operating-units"
              payload: { unit_name: "Unit Y", unit_code: "UY", exposure_basis: "HEADCOUNT", exposure_amount: 500 }
              as: CaptiveManager
              captures: { unit_id: $.data.id }
            - call: "POST /api/captives/${captive_id}/programs"
              payload: { program_name: "PL Prog", line_of_business: "PROFESSIONAL_LIABILITY", policy_period_start: "2026-06-01T00:00:00Z", policy_period_end: "2027-05-31T23:59:59Z", aggregate_limit_cents: 1000000, per_occurrence_limit_cents: 250000, attachment_point_cents: 10000, premium_budget_cents: 200000, expected_captive_version: "${captive_ver}" }
              as: Underwriter
              captures: { program_id: $.data.id }
