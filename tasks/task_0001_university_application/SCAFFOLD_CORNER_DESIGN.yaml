              as_user_id: "${applicant_id}"
              captures: { letter_id: $.data.id }
            - call: "POST /recommendation-letters/${letter_id}/start"
              payload: {}
              as: Recommender
              as_user_id: "${rec_id}"
            - call: "POST /recommendation-letters/${letter_id}/submit"
              payload: { body: "Letter body content beyond the two hundred character minimum with substantive evaluation of the applicant's strengths in academic discipline, character, and intellectual disposition observed over time." }
              as: Recommender
              as_user_id: "${rec_id}"
            - call: "POST /applications/${app_id}/submit"
              payload: {}
              as: Applicant
              as_user_id: "${applicant_id}"
            - call: "POST /applications/${app_id}/start-review"
              payload: {}
              as: AdmissionsOfficer
              captures: { v_review: $.data.version }
            - call: "POST /applications/${app_id}/decide"
              payload: { decision: "ADMIT", expected_application_version: "${v_review}" }
              as: AdmissionsOfficer
          trigger:
            - call: "POST /applications/${app_id}/accept-offer"
              payload: {}
              as: Applicant
              as_user_id: "${applicant_id}"
            - call: "GET /schools/${school_id}"
              payload: {}
              as: PlatformAdmin
              captures: { posture_now: $.data.posture, count_now: $.data.confirmed_enrollment_count }
          assert:
            - "School.${school_id}.confirmed_enrollment_count == 1 (immediately visible after accept-offer)"
            - "School.${school_id}.posture == 'AT_TARGET' (immediately visible — no lag)"
