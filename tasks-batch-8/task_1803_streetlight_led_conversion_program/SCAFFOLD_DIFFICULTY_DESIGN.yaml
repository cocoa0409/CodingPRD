- rule_id: cross_entity_state_dependency
  instances:
  - name: dispatch_blocked_while_route_suspended
    grounds:
    - state_machines.WorkOrder.PENDING_to_DISPATCHED
    - state_machines.ConversionRoute.IN_PROGRESS_to_SUSPENDED
    - errors[ERR_ROUTE_SUSPENDED]
    distinguishing_aspect: 'Entity pair (WorkOrder, ConversionRoute): a work order''s PENDING -> DISPATCHED

      transition is gated by its PARENT route''s state — RELEASED/IN_PROGRESS admits,

      SUSPENDED rejects with ERR_ROUTE_SUSPENDED; resuming the route re-admits the identical

      request with an unchanged payload.

