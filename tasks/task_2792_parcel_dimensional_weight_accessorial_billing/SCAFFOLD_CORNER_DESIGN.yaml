            - "GET /shipments/${over}/accessorials returns total_count == 1 with code ADDITIONAL_HANDLING and amount_cents == 2450"
            - "${over_total} == 22170 (19720 + 2450) — the whole 2450 delta comes from the threshold, not from a weight difference"
