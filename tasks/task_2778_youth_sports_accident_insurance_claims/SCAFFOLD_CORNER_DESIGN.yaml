            - call: "POST /sanctioned-activities/${act_id}/sanction-decision"
              payload: { decision: "SANCTION" }
              as: LeagueOfficial
              as_user_id: "official-1"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-12T00:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /injury-reports"
              payload: { enrollment_id: "${enr_a_id}", sanctioned_activity_id: "${act_id}", injury_datetime: "2026-07-11T16:00:00Z", body_part: "ANKLE_FOOT", injury_description: "ankle injured landing a basket toss", severity_tier: "MODERATE" }
              as: LeagueAdministrator
              as_user_id: "${league_id}"
              captures: { ir_a_id: "$.data.id" }
            - call: "POST /injury-reports"
              payload: { enrollment_id: "${enr_b_id}", sanctioned_activity_id: "${act_id}", injury_datetime: "2026-07-11T16:20:00Z", body_part: "SHOULDER_ARM", injury_description: "shoulder injured spotting a pyramid", severity_tier: "MODERATE" }
              as: LeagueAdministrator
              as_user_id: "${league_id}"
              captures: { ir_b_id: "$.data.id" }
          trigger:
            - call: "POST /injury-reports/${ir_a_id}/verification-decision"
              payload: { decision: "VERIFY", official_attestation: "coach and spotter both witnessed the landing" }
              as: LeagueOfficial
              as_user_id: "official-2"
            - call: "POST /injury-reports/${ir_b_id}/verification-decision"
              payload: { decision: "VERIFY", official_attestation: "coach witnessed the pyramid dismount" }
              as: LeagueOfficial
              as_user_id: "official-2"
            - call: "POST /enrollments"
              payload: { participant_id: "${pa_id}", league_policy_id: "${pol_id}", enrolled_on_date: "2026-07-12" }
              as: LeagueAdministrator
              as_user_id: "${league_id}"
          assert:
            - "after setup, LeaguePolicy.${pol_id}: annual_premium_cents == 100681, coverage_posture == OPEN, incurred_loss_cents == 0, open_claim_count == 0"
            - "after trigger call 1: reserve_cents == 250000, incurred_loss_cents == 250000, incurred_loss_ratio_bps == 24831, open_claim_count == 1, experience_tier == DECLINE, coverage_posture == CLAIMS_REVIEW (24831 >= 6500 while open_claim_count 1 < 3)"
            - "after trigger call 2: reserve_cents == 500000, incurred_loss_cents == 500000, incurred_loss_ratio_bps == 49662, open_claim_count == 2, coverage_posture == FROZEN because incurred_loss_cents is exactly equal to aggregate_limit_cents"
            - "trigger call 2 still returned HTTP 200 with data.status == VERIFIED: CLAIMS_REVIEW does not block verification, only new enrollment"
            - "trigger call 3 returns HTTP 409 with data.error_id == ERR_POLICY_FROZEN (priority 11 outranks the CLAIMS_REVIEW rule at priority 12 now that the policy is frozen)"
            - "SanctionedActivity.${act_id}.status is still SANCTIONED: the freeze cascade only rejects activities still in PENDING_SANCTION"

      - name: cascading_side_effects_chain_verified_end_to_end
        claim_type: cascading_side_effects
        grounds: [complexity_profile.complexity_layers]
        excluded_because:
          difficulty_instance: transitive_cascade / cascade_a_report_verification_freezes_policy_and_rejects_pending_activity
          rationale: "That instance walks the five-link chain from one verification through claim creation, aggregate recomputation, the posture flip and the downstream activity rejection, asserting every link and the ordering between them."

      - name: dual_variant_calculation_layer_produces_both_results
        claim_type: dual_variant_calculation
        grounds: [complexity_profile.complexity_layers]
        excluded_because:
          difficulty_instance: dual_variant_calc / benefit_determination_excess_of_other_vs_full_excess
          rationale: "That instance runs identical billing down both coordination bases and asserts the exact payable figures and the delta between them."

  - section: consistency_model
    instances:

      - name: verification_cascade_is_fully_visible_in_the_immediately_following_reads
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - calculations.policy_loss_experience
          - state_machines.InjuryReport.PENDING_VERIFICATION_to_VERIFIED
        distinguishing_aspect: "The consistency model is immediate, so the claim minted by verification and every derived policy aggregate must be correct on the very next read with no second write, no delay and no re-read loop. Asserting the ratio 3038 and reserve 250000 on the first read after the trigger fails any implementation that recomputes aggregates lazily on a later request."
        test_recipe:
          setup:
            - "One league, one BASEBALL_U12 classification and one ACTIVE policy for 404 participants with the catastrophic layer elected (annual premium 822840)."
            - "One ENROLLED athlete and one PENDING_VERIFICATION MODERATE injury report on a SANCTIONED game."
            - "Before the trigger the policy has no claims: reserve_cents 0, open_claim_count 0, coverage_posture OPEN."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-05T00:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /leagues"
              payload: { name: "Quillan Baseball", league_code: "QLB-150", state_code: "KY", governing_body_code: "USYSA", contact_email: "admin@qlb.example" }
              as: ProgramAdministrator
              captures: { league_id: "$.data.id" }
            - call: "POST /sport-classifications"
              payload: { sport_code: "BASEBALL_U12", sport_name: "Baseball U12", hazard_class: "CLASS_2_MODERATE", base_rate_per_participant_cents: 1850, deductible_cents: 25000, per_injury_limit_cents: 2500000, cat_attachment_point_cents: 2500000, aggregate_limit_cents: 25000000, cat_lifetime_max_cents: 100000000, minimum_participants: 25, travel_buffer_minutes: 60, service_category_caps: { EMERGENCY_ROOM: 500000, SURGERY: 3000000, DIAGNOSTIC_IMAGING: 300000, PHYSICAL_THERAPY: 20000, DENTAL: 350000, AMBULANCE: 200000, PHYSICIAN_OFFICE: 50000 } }
              as: ProgramAdministrator
              captures: { sport_id: "$.data.id" }
            - call: "POST /league-policies"
              payload: { league_id: "${league_id}", sport_classification_id: "${sport_id}", term_effective_date: "2026-03-01", term_expiration_date: "2027-03-01", enrolled_participant_count: 404, coverage_basis_election: "EXCESS_ONLY", cat_layer_elected: true }
              as: ProgramAdministrator
              captures: { pol_id: "$.data.id" }
            - call: "POST /league-policies/${pol_id}/bind"
              payload: {}
              as: ProgramAdministrator
            - call: "POST /league-policies/${pol_id}/activate"
              payload: {}
              as: ProgramAdministrator
            - call: "POST /participants"
              payload: { league_id: "${league_id}", first_name: "Rhiannon", last_name: "Vasquez", date_of_birth: "2016-05-12", guardian_email: "g50@qlb.example" }
              as: LeagueAdministrator
              as_user_id: "${league_id}"
              captures: { p1_id: "$.data.id" }
            - call: "POST /enrollments"
              payload: { participant_id: "${p1_id}", league_policy_id: "${pol_id}", enrolled_on_date: "2026-03-05" }
              as: LeagueAdministrator
              as_user_id: "${league_id}"
              captures: { enr1_id: "$.data.id" }
            - call: "POST /sanctioned-activities"
              payload: { league_policy_id: "${pol_id}", activity_type: "GAME", venue_name: "Quillan Field 1", starts_at: "2026-07-11T18:00:00Z", ends_at: "2026-07-11T20:00:00Z" }
              as: LeagueAdministrator
              as_user_id: "${league_id}"
              captures: { act_id: "$.data.id" }
            - call: "POST /sanctioned-activities/${act_id}/sanction-decision"
              payload: { decision: "SANCTION" }
              as: LeagueOfficial
              as_user_id: "official-1"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-12T00:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /injury-reports"
              payload: { enrollment_id: "${enr1_id}", sanctioned_activity_id: "${act_id}", injury_datetime: "2026-07-11T19:00:00Z", body_part: "KNEE", injury_description: "knee sprain covering first base", severity_tier: "MODERATE" }
              as: LeagueAdministrator
              as_user_id: "${league_id}"
              captures: { ir_id: "$.data.id" }
          trigger:
            - call: "POST /injury-reports/${ir_id}/verification-decision"
              payload: { decision: "VERIFY", official_attestation: "first-base official witnessed the play" }
              as: LeagueOfficial
              as_user_id: "official-2"
            - call: "GET /claims"
              payload: { enrollment_id: "${enr1_id}" }
              as: ClaimsExaminer
              captures: { claim_id: "$.data[0].id" }
            - call: "GET /league-policies/${pol_id}/loss-experience"
              payload: {}
              as: ProgramAdministrator
          assert:
            - "trigger call 1 returns HTTP 200 with data.status == VERIFIED and data.verified_by_official_id == official-2"
            - "trigger call 2, the first read after the write, already returns meta.total_count == 1 with the new claim in adjudication_status PENDING_COORDINATION and reserve_amount_cents 250000"
            - "trigger call 3, also a first read, already returns reserve_cents == 250000, incurred_loss_cents == 250000, open_claim_count == 1, incurred_loss_ratio_bps == 3038, experience_tier == PREFERRED and coverage_posture == OPEN"
            - "no repeated read is required for any of these values to appear, and no value changes if the same two reads are issued a second time"
