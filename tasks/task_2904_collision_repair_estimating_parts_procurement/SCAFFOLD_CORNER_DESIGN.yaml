  - section: validations
    instances:
      - name: not_included_operation_without_a_justification_blocks_the_lock
        claim_type: violation_to_error
        grounds:
          - validations.priority_56
          - errors.ERR_NOT_INCLUDED_JUSTIFICATION_MISSING
          - entities.EstimateLine.fields.justification_note
        distinguishing_aspect: >-
          The justification is demanded only for lines flagged not_included_operation, and only at the
          lock - the line is accepted at creation. Two orders that differ in nothing but the presence of
          justification_note therefore end in a 422 and a clean lock respectively, which pins the check
          to the field rather than to the flag.
        test_recipe:
          setup:
            - "Order A: one BODY 4.5 h line with not_included_operation true and NO justification_note, blueprinted."
            - "Order B: the same line with justification_note present, blueprinted and already locked."
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Fay Soto", phone: "555-1031", email: "fay@example.com" }
              as: ShopAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /insurers"
              payload: { insurer_code: "CRNR-31", name: "Cornerstone Mutual", rate_ceiling_cents: { BODY: 6000, FRAME: 8000, REFINISH: 5800, MECHANICAL: 11000, ALUMINUM_BODY: 8800 } }
              as: ShopAdmin
