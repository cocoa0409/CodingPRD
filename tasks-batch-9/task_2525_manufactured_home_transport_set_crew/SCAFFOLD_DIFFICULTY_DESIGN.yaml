  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: site_not_ready_outranks_installer_license_invalid
        grounds:
          - validations[priority=8]
          - validations[priority=11]
          - calculations.site_readiness_evaluation
          - state_machines.Site.READINESS_FAILED_to_READY
          - entities.SetCrew.fields.license_expiry_date
        distinguishing_aspect: |
          One dispatch request violates a `state` rule (ERR_SITE_NOT_READY, priority
          8) and a `business_safety` rule (ERR_INSTALLER_LICENSE_INVALID, priority 11)
          at the same time and must return the priority-8 error; curing only the site
          then exposes the priority-11 error on an otherwise identical request, so the
          pair spans two different validation categories rather than two rules of the
          same kind.
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T00:00:00Z"
            - "one Plant and one SetCrew whose license_expiry_date is 2026-07-01, i.e. already lapsed against the logical clock"
            - "one single-section AZ order with a site whose pad inspection failed, so readiness_status is READINESS_FAILED"
