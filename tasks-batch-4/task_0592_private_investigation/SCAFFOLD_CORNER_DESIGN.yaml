scaffold_corner_design:

  # =========================================================================
  # Entities
  # =========================================================================
  - section: entities
    instances:

      - name: client_create_applies_defaults_and_system_fields
        claim_type: Defaults
        grounds:
          - entities.Client.fields.status
          - entities.Client.fields.adverse_party_names
          - endpoints["POST /clients"]
        distinguishing_aspect: "Omitting adverse_party_names yields [] and status defaults to ACTIVE; id/created_at/updated_at/version are server-minted with version == 1."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /clients"
              payload: { legal_name: "Ada Law LLP", contact_email: "ada@law.test" }
              as: CaseManager
              captures: { cl_id: $.data.id, cl_status: $.data.status, cl_version: $.data.version }
          assert:
            - "HTTP status == 201"
            - "${cl_status} == ACTIVE"
            - "${cl_version} == 1"
            - "Client.${cl_id}.adverse_party_names == []"
            - "response envelope carries meta.api_request_id, meta.api_request_timestamp and response_type == object"

      - name: case_create_missing_required_field_returns_invalid_request
        claim_type: Required Fields
        grounds:
          - endpoints["POST /cases"]
          - validations[priority=5]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "POST /cases without jurisdiction_state is rejected with 400 ERR_INVALID_REQUEST and no Case row is created."
        test_recipe:
          setup: ["One Client exists."]
          setup_api_calls:
            - call: "POST /clients"
              payload: { legal_name: "Ada Law LLP", contact_email: "ada@law.test" }
              as: CaseManager
              captures: { cl_id: $.data.id }
          trigger:
            - call: "POST /cases"
              payload: { client_id: "${cl_id}", case_type: "SKIP_TRACE", subject_name: "Sam Subject" }
              as: CaseManager
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 400"
            - "${err} == ERR_INVALID_REQUEST"
            - "GET /cases returns total_count == 0"

      - name: case_get_unknown_id_returns_not_found
        claim_type: Not Found
        grounds:
          - endpoints["GET /cases/{id}"]
          - validations[priority=3]
          - errors[ERR_CASE_NOT_FOUND]
        distinguishing_aspect: "GET /cases/{random-uuid} on an empty database returns 404 ERR_CASE_NOT_FOUND."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "GET /cases/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              payload: {}
              as: CaseManager
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 404"
            - "${err} == ERR_CASE_NOT_FOUND"

      - name: case_list_pagination_limit_offset_and_has_more
        claim_type: Listing
        grounds:
          - endpoints["GET /cases"]
          - entities.Case.fields.status
        distinguishing_aspect: "With three INTAKE cases for one client, GET /cases?client_id=..&limit=2&offset=0 returns 2 rows, total_count 3 and has_more true; offset=2 returns 1 row and has_more false."
        test_recipe:
          setup: ["One Client with three cases, all in INTAKE."]
          setup_api_calls:
            - call: "POST /clients"
              payload: { legal_name: "Ada Law LLP", contact_email: "ada@law.test" }
              as: CaseManager
              captures: { cl_id: $.data.id }
            - call: "POST /cases"
              payload: { client_id: "${cl_id}", case_type: "SKIP_TRACE", jurisdiction_state: "CA", subject_name: "Sub A" }
              as: CaseManager
            - call: "POST /cases"
              payload: { client_id: "${cl_id}", case_type: "SURVEILLANCE", jurisdiction_state: "CA", subject_name: "Sub B" }
              as: CaseManager
            - call: "POST /cases"
              payload: { client_id: "${cl_id}", case_type: "BACKGROUND", jurisdiction_state: "NV", subject_name: "Sub C" }
              as: CaseManager
          trigger:
            - call: "GET /cases?client_id=${cl_id}&limit=2&offset=0"
              payload: {}
              as: CaseManager
            - call: "GET /cases?client_id=${cl_id}&limit=2&offset=2"
              payload: {}
              as: CaseManager
          assert:
            - "first call returns 2 rows with total_count == 3 and has_more == true"
            - "second call returns 1 row with total_count == 3 and has_more == false"
            - "every returned Case has status == INTAKE"

      - name: investigator_rate_outside_seniority_band_rejected
        claim_type: Type Constraints
        grounds:
          - entities.Investigator.fields.hourly_rate_cents
          - validations[priority=16]
          - errors[ERR_RATE_OUT_OF_BAND]
        distinguishing_aspect: "A JUNIOR investigator with hourly_rate_cents 15000 (LEAD band) is rejected with 422 ERR_RATE_OUT_OF_BAND."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /investigators"
              payload: { full_name: "Ivy Nguyen", seniority: "JUNIOR", hourly_rate_cents: 15000 }
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 422"
            - "${err} == ERR_RATE_OUT_OF_BAND"

      - name: license_is_currently_valid_computed_against_logical_clock
        claim_type: Computed Fields
        grounds:
          - entities.License.fields.is_currently_valid
          - endpoints["GET /investigators/{id}/licenses"]
          - endpoints["POST /_clock/set_current_utc"]
        distinguishing_aspect: "A licence valid 2026-01-01 to 2026-07-01 reads is_currently_valid true at clock 2026-06-01 and false once the clock is moved to 2026-07-01 (valid_until is exclusive)."
        test_recipe:
          setup: ["One investigator with a single CA licence valid [2026-01-01, 2026-07-01)."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /investigators"
              payload: { full_name: "Ivy Nguyen", seniority: "JUNIOR", hourly_rate_cents: 8333 }
              as: PlatformAdmin
              captures: { inv1_id: $.data.id }
            - call: "POST /investigators/${inv1_id}/licenses"
              payload: { state_code: "CA", license_number: "CA-1001", valid_from: "2026-01-01T00:00:00Z", valid_until: "2026-07-01T00:00:00Z" }
              as: ComplianceOfficer
              captures: { lic1_id: $.data.id }
          trigger:
            - call: "GET /investigators/${inv1_id}/licenses?state_code=CA"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "GET /investigators/${inv1_id}/licenses?state_code=CA"
              payload: {}
              as: ComplianceOfficer
          assert:
            - "at clock 2026-06-01: License.${lic1_id}.is_currently_valid == true"
            - "at clock 2026-07-01: License.${lic1_id}.is_currently_valid == false"
            - "License.${lic1_id}.status == ACTIVE in both reads"

      - name: custody_event_log_is_append_only_with_no_version
        claim_type: Immutability
        grounds:
          - entities.CustodyEvent.fields.seq
          - entities.CustodyEvent.fields.action
          - endpoints["GET /evidence/{id}/custody-events"]
        distinguishing_aspect: "CustodyEvent has common_fields: false — each row exposes id, created_at, seq, action, from/to custodian and occurred_at but no version field, and rows are only ever appended (seq 1 = COLLECT, seq 2 = TRANSFER)."
        test_recipe:
          setup:
            - "ACTIVE CA case, LEAD-assigned CA-licensed investigator, one IN_PROGRESS session with one COLLECTED evidence item."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /clients"
              payload: { legal_name: "Ada Law LLP", contact_email: "ada@law.test" }
              as: CaseManager
              captures: { cl_id: $.data.id }
            - call: "POST /investigators"
              payload: { full_name: "Ivy Nguyen", seniority: "JUNIOR", hourly_rate_cents: 8333 }
              as: PlatformAdmin
              captures: { inv1_id: $.data.id }
            - call: "POST /investigators/${inv1_id}/licenses"
              payload: { state_code: "CA", license_number: "CA-1001", valid_from: "2026-01-01T00:00:00Z", valid_until: "2027-01-01T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /cases"
              payload: { client_id: "${cl_id}", case_type: "SURVEILLANCE", jurisdiction_state: "CA", subject_name: "Sam Subject" }
              as: CaseManager
              captures: { case_id: $.data.id }
            - call: "POST /cases/${case_id}/conflict-check"
              payload: { decision: "CLEAR" }
              as: ComplianceOfficer
            - call: "POST /cases/${case_id}/retainer"
              payload: { amount_cents: 500000 }
              as: CaseManager
            - call: "POST /assignments"
              payload: { case_id: "${case_id}", investigator_id: "${inv1_id}", role_on_case: "LEAD" }
              as: CaseManager
            - call: "POST /surveillance-sessions"
              payload: { case_id: "${case_id}", investigator_id: "${inv1_id}", start_at: "2026-06-02T09:00:00Z", end_at: "2026-06-02T10:30:00Z", location: "Post A" }
              as: Investigator
              as_user_id: "${inv1_id}"
              captures: { s1_id: $.data.id }
            - call: "POST /surveillance-sessions/${s1_id}/start"
              payload: {}
              as: Investigator
              as_user_id: "${inv1_id}"
            - call: "POST /evidence"
              payload: { case_id: "${case_id}", session_id: "${s1_id}", kind: "PHOTO", hash_sha256: "aaa111", captured_at: "2026-06-02T09:10:00Z" }
              as: Investigator
              as_user_id: "${inv1_id}"
              captures: { ev_id: $.data.id }
          trigger:
            - call: "POST /evidence/${ev_id}/transfer"
              payload: { to_custodian_id: "co-1" }
              as: Investigator
              as_user_id: "${inv1_id}"
              captures: { custodian_after: $.data.custodian_user_id }
            - call: "GET /evidence/${ev_id}/custody-events"
              payload: {}
              as: ComplianceOfficer
          assert:
            - "${custodian_after} == co-1"
            - "GET /evidence/${ev_id}/custody-events returns 2 rows: seq 1 action COLLECT (to_custodian_id == ${inv1_id}), seq 2 action TRANSFER (from_custodian_id == ${inv1_id}, to_custodian_id == co-1)"
            - "EvidenceItem.${ev_id}.chain_seq == 2"
            - "EvidenceItem.${ev_id}.custody_state == COLLECTED"

  # =========================================================================
  # State machines
  # =========================================================================
  - section: state_machines
    instances:

      - name: conflict_check_decline_terminates_case_and_bars_client
        claim_type: Valid Transition
        grounds:
          - state_machines.Case.INTAKE_to_DECLINED
          - entities.Client.fields.status
          - endpoints["POST /cases/{id}/conflict-check"]
        distinguishing_aspect: "The DECLINE branch of the conflict-check fork drives Case -> DECLINED and cross-entity Client -> BARRED, with no ledger entry created — a divergent side-effect set from the CLEAR branch."
        test_recipe:
          setup: ["One Client listing 'Victor Adverse' as an adverse party; one INTAKE case whose subject is that adverse party."]
          setup_api_calls:
            - call: "POST /clients"
              payload: { legal_name: "Ada Law LLP", contact_email: "ada@law.test", adverse_party_names: ["Victor Adverse"] }
              as: CaseManager
              captures: { cl_id: $.data.id }
            - call: "POST /cases"
              payload: { client_id: "${cl_id}", case_type: "BACKGROUND", jurisdiction_state: "CA", subject_name: "Victor Adverse" }
              as: CaseManager
              captures: { case_id: $.data.id }
          trigger:
            - call: "POST /cases/${case_id}/conflict-check"
              payload: { decision: "DECLINE", note: "Subject is a listed adverse party" }
              as: ComplianceOfficer
              captures: { case_status: $.data.status }
          assert:
            - "${case_status} == DECLINED"
            - "Client.${cl_id}.status == BARRED"
            - "GET /cases/${case_id}/ledger returns 0 rows"

      - name: conflict_check_on_barred_client_returns_client_barred
        claim_type: Precondition Enforcement
        grounds:
          - validations[priority=9]
          - errors[ERR_CLIENT_BARRED]
          - state_machines.Case.INTAKE_to_CONFLICT_CLEARED
        distinguishing_aspect: "Once a Client is BARRED by a DECLINE, a second INTAKE case of that client cannot be cleared: 409 ERR_CLIENT_BARRED, and the case stays INTAKE."
        test_recipe:
          setup: ["A Client BARRED by a DECLINE on its first case; a second case of the same client still in INTAKE."]
          setup_api_calls:
            - call: "POST /clients"
              payload: { legal_name: "Ada Law LLP", contact_email: "ada@law.test", adverse_party_names: ["Victor Adverse"] }
              as: CaseManager
              captures: { cl_id: $.data.id }
            - call: "POST /cases"
              payload: { client_id: "${cl_id}", case_type: "BACKGROUND", jurisdiction_state: "CA", subject_name: "Victor Adverse" }
              as: CaseManager
              captures: { case1_id: $.data.id }
            - call: "POST /cases"
              payload: { client_id: "${cl_id}", case_type: "SKIP_TRACE", jurisdiction_state: "CA", subject_name: "Sam Subject" }
              as: CaseManager
              captures: { case2_id: $.data.id }
            - call: "POST /cases/${case1_id}/conflict-check"
              payload: { decision: "DECLINE" }
              as: ComplianceOfficer
          trigger:
            - call: "POST /cases/${case2_id}/conflict-check"
              payload: { decision: "CLEAR" }
              as: ComplianceOfficer
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "${err} == ERR_CLIENT_BARRED"
            - "Case.${case2_id}.status == INTAKE"

      - name: close_an_already_closed_case_returns_invalid_state
        claim_type: Terminal State Lockdown
        grounds:
          - state_machines.Case.ACTIVE_to_CLOSED
          - validations[priority=7]
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "CLOSED is terminal: a second POST /cases/{id}/close returns 409 ERR_INVALID_STATE and fires no cascade."
        test_recipe:
          setup: ["An ACTIVE case with a 500000-cent retainer that has already been closed once."]
          setup_api_calls:
            - call: "POST /clients"
              payload: { legal_name: "Ada Law LLP", contact_email: "ada@law.test" }
              as: CaseManager
              captures: { cl_id: $.data.id }
            - call: "POST /cases"
              payload: { client_id: "${cl_id}", case_type: "SKIP_TRACE", jurisdiction_state: "CA", subject_name: "Sam Subject" }
              as: CaseManager
              captures: { case_id: $.data.id }
            - call: "POST /cases/${case_id}/conflict-check"
              payload: { decision: "CLEAR" }
              as: ComplianceOfficer
            - call: "POST /cases/${case_id}/retainer"
              payload: { amount_cents: 500000 }
              as: CaseManager
            - call: "POST /cases/${case_id}/close"
              payload: {}
              as: CaseManager
          trigger:
            - call: "POST /cases/${case_id}/close"
              payload: {}
              as: CaseManager
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "${err} == ERR_INVALID_STATE"
            - "Case.${case_id}.status == CLOSED"

      - name: complete_a_planned_session_returns_invalid_state
        claim_type: Invalid Transitions
        grounds:
          - state_machines.SurveillanceSession.IN_PROGRESS_to_COMPLETED
          - validations[priority=7]
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "Completing a session that was never started (status PLANNED) returns 409 ERR_INVALID_STATE; billable_minutes stays 0 and Case.billable_minutes_total stays 0."
        test_recipe:
          setup: ["ACTIVE CA case, LEAD-assigned CA-licensed investigator, one PLANNED session."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /clients"
              payload: { legal_name: "Ada Law LLP", contact_email: "ada@law.test" }
              as: CaseManager
              captures: { cl_id: $.data.id }
            - call: "POST /investigators"
              payload: { full_name: "Ivy Nguyen", seniority: "JUNIOR", hourly_rate_cents: 8333 }
              as: PlatformAdmin
              captures: { inv1_id: $.data.id }
            - call: "POST /investigators/${inv1_id}/licenses"
              payload: { state_code: "CA", license_number: "CA-1001", valid_from: "2026-01-01T00:00:00Z", valid_until: "2027-01-01T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /cases"
              payload: { client_id: "${cl_id}", case_type: "SURVEILLANCE", jurisdiction_state: "CA", subject_name: "Sam Subject" }
              as: CaseManager
              captures: { case_id: $.data.id }
            - call: "POST /cases/${case_id}/conflict-check"
              payload: { decision: "CLEAR" }
              as: ComplianceOfficer
            - call: "POST /cases/${case_id}/retainer"
              payload: { amount_cents: 500000 }
              as: CaseManager
            - call: "POST /assignments"
              payload: { case_id: "${case_id}", investigator_id: "${inv1_id}", role_on_case: "LEAD" }
              as: CaseManager
            - call: "POST /surveillance-sessions"
              payload: { case_id: "${case_id}", investigator_id: "${inv1_id}", start_at: "2026-06-02T09:00:00Z", end_at: "2026-06-02T10:30:00Z", location: "Post A" }
              as: Investigator
              as_user_id: "${inv1_id}"
              captures: { s1_id: $.data.id }
          trigger:
            - call: "POST /surveillance-sessions/${s1_id}/complete"
              payload: { mileage_miles: 5 }
              as: Investigator
              as_user_id: "${inv1_id}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "${err} == ERR_INVALID_STATE"
            - "SurveillanceSession.${s1_id}.status == PLANNED"
            - "SurveillanceSession.${s1_id}.billable_minutes == 0"
            - "Case.${case_id}.billable_minutes_total == 0"

      - name: report_revision_cycle_returns_to_peer_review
        claim_type: cyclic
        grounds:
          - state_machines.InvestigationReport.PEER_REVIEW_to_REVISION_REQUESTED
          - state_machines.InvestigationReport.REVISION_REQUESTED_to_PEER_REVIEW
          - calculations.redaction_score
        distinguishing_aspect: "After a REQUEST_REVISION the author re-submits and the report re-enters PEER_REVIEW with author_redaction_score RE-STAMPED from 20 to 0 because the cited PHOTO was redacted in between."
        test_recipe:
          setup:
            - "ACTIVE CA case; INV1 (LEAD author) and INV2 (SUPPORT reviewer) assigned; one COMPLETED session with a single UNREDACTED PHOTO evidence item."
            - "A report citing that item, submitted for peer review and bounced back with REQUEST_REVISION."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /clients"
              payload: { legal_name: "Ada Law LLP", contact_email: "ada@law.test" }
              as: CaseManager
              captures: { cl_id: $.data.id }
            - call: "POST /investigators"
              payload: { full_name: "Ivy Nguyen", seniority: "JUNIOR", hourly_rate_cents: 8333 }
              as: PlatformAdmin
              captures: { inv1_id: $.data.id }
            - call: "POST /investigators"
              payload: { full_name: "Nate Ortiz", seniority: "SENIOR", hourly_rate_cents: 12000 }
              as: PlatformAdmin
              captures: { inv2_id: $.data.id }
            - call: "POST /investigators/${inv1_id}/licenses"
              payload: { state_code: "CA", license_number: "CA-1001", valid_from: "2026-01-01T00:00:00Z", valid_until: "2027-01-01T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /cases"
              payload: { client_id: "${cl_id}", case_type: "SURVEILLANCE", jurisdiction_state: "CA", subject_name: "Sam Subject" }
              as: CaseManager
              captures: { case_id: $.data.id }
            - call: "POST /cases/${case_id}/conflict-check"
              payload: { decision: "CLEAR" }
              as: ComplianceOfficer
            - call: "POST /cases/${case_id}/retainer"
              payload: { amount_cents: 500000 }
              as: CaseManager
            - call: "POST /assignments"
              payload: { case_id: "${case_id}", investigator_id: "${inv1_id}", role_on_case: "LEAD" }
              as: CaseManager
            - call: "POST /assignments"
              payload: { case_id: "${case_id}", investigator_id: "${inv2_id}", role_on_case: "SUPPORT" }
              as: CaseManager
            - call: "POST /surveillance-sessions"
              payload: { case_id: "${case_id}", investigator_id: "${inv1_id}", start_at: "2026-06-02T09:00:00Z", end_at: "2026-06-02T10:30:00Z", location: "Post A" }
              as: Investigator
              as_user_id: "${inv1_id}"
              captures: { s1_id: $.data.id }
            - call: "POST /surveillance-sessions/${s1_id}/start"
              payload: {}
              as: Investigator
              as_user_id: "${inv1_id}"
            - call: "POST /evidence"
              payload: { case_id: "${case_id}", session_id: "${s1_id}", kind: "PHOTO", hash_sha256: "aaa111", captured_at: "2026-06-02T09:10:00Z" }
              as: Investigator
              as_user_id: "${inv1_id}"
              captures: { ev_id: $.data.id }
            - call: "POST /surveillance-sessions/${s1_id}/complete"
              payload: { mileage_miles: 0 }
              as: Investigator
              as_user_id: "${inv1_id}"
            - call: "GET /cases/${case_id}"
              payload: {}
              as: CaseManager
              captures: { case_v1: $.data.version }
            - call: "POST /reports"
              payload: { case_id: "${case_id}", title: "Draft one", evidence_ids: ["${ev_id}"], expected_case_version: "${case_v1}" }
              as: Investigator
              as_user_id: "${inv1_id}"
              captures: { rep_id: $.data.id }
            - call: "POST /reports/${rep_id}/submit-review"
              payload: {}
              as: Investigator
              as_user_id: "${inv1_id}"
              captures: { score_first: $.data.author_redaction_score }
            - call: "POST /reports/${rep_id}/peer-review"
              payload: { decision: "REQUEST_REVISION", note: "Redact the photo first" }
              as: Investigator
              as_user_id: "${inv2_id}"
              captures: { status_after_bounce: $.data.status }
          trigger:
            - call: "POST /evidence/${ev_id}/redact"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /reports/${rep_id}/submit-review"
              payload: {}
              as: Investigator
              as_user_id: "${inv1_id}"
              captures: { score_second: $.data.author_redaction_score, status_second: $.data.status }
          assert:
            - "${score_first} == 20"
            - "${status_after_bounce} == REVISION_REQUESTED"
            - "${status_second} == PEER_REVIEW"
            - "${score_second} == 0"
            - "InvestigationReport.${rep_id}.reviewer_investigator_id == ${inv2_id}"

      - name: testimony_third_continuance_returns_continuance_limit
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.CourtTestimony.SCHEDULED_to_CONTINUED
          - entities.CourtTestimony.fields.continuance_count
          - errors[ERR_CONTINUANCE_LIMIT]
