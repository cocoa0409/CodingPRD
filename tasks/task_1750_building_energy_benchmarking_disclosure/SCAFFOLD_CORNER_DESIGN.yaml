# =============================================================================
# Task 1750: Scaffold Corner Design (Coverage Index for Non-Difficulty Tests,
# SKILL.md §1.9). Breadth coverage of §1.1-§1.7 claims NOT already covered by
# SCAFFOLD_DIFFICULTY_DESIGN.yaml. Sections/claim_types follow
# references/claim-extraction-guide.md. All recipes replayable from empty-DB.
# Standard cycle fixture constants (unless overridden): threshold 25000 sqft;
# covered types [OFFICE, MULTIFAMILY, RETAIL, HOTEL]; late rate 5000/day cap 60;
# NON_COMPLIANCE 500000; completeness min 90; correction tolerance 5; YoY 25;
# weather factor 0.9; OFFICE standard {median 80, slope 2, baseline_default 100,
# reduction 10, tolerance 5, rate 5, cap 1000000}.
# =============================================================================

scaffold_corner_design:
  # ===========================================================================
  - section: entities
    instances:
      - name: e_owner_create_applies_defaults
        claim_type: creation_and_defaults
        grounds:
          - "entities.Owner"
        distinguishing_aspect: "A new owner gets system-managed defaults: standing NORMAL, outstanding_fines_cents 0, version 1."
        test_recipe:
          setup: ["nothing but an officer"]
          setup_api_calls: []
          trigger:
            - { call: "POST /v1/owners", payload: { name: "Owner Zero", contact_email: "oz@x.com" }, as: ComplianceOfficer, as_user_id: "officer-1", captures: { st: $.data.standing, out: $.data.outstanding_fines_cents, ver: $.data.version } }
          assert:
            - "response 201 with standing == NORMAL, outstanding_fines_cents == 0, version == 1, id is a bare UUID"

      - name: e_building_create_missing_required_field_returns_invalid_request
        claim_type: required_fields
        grounds:
          - "entities.Building.fields.gross_floor_area_sqft"
          - "errors[ERR_INVALID_REQUEST]"
        distinguishing_aspect: "Omitting required gross_floor_area_sqft fails with 400 ERR_INVALID_REQUEST before any state exists."
        test_recipe:
          setup: ["owner o1 exists"]
          setup_api_calls:
            - { call: "POST /v1/owners", payload: { name: "Owner V", contact_email: "ov@x.com" }, as: ComplianceOfficer, as_user_id: "officer-1", captures: { o1: $.data.id } }
          trigger:
            - { call: "POST /v1/buildings", payload: { address: "1 Incomplete St", property_type: "OFFICE" }, as: BuildingOwner, as_user_id: "${o1}", captures: { err: "$.data.error_id" } }
          assert:
            - "err == ERR_INVALID_REQUEST (400); no building persisted"

      - name: e_building_create_invalid_enum_rejected
        claim_type: type_constraints
        grounds:
          - "entities.Building.fields.property_type"
          - "errors[ERR_INVALID_REQUEST]"
        distinguishing_aspect: "property_type outside {OFFICE, MULTIFAMILY, RETAIL, HOTEL, INDUSTRIAL} is a 400, not a 422 or silent coercion."
        test_recipe:
          setup: ["owner o1 exists"]
          setup_api_calls:
            - { call: "POST /v1/owners", payload: { name: "Owner W", contact_email: "ow@x.com" }, as: ComplianceOfficer, as_user_id: "officer-1", captures: { o1: $.data.id } }
          trigger:
            - { call: "POST /v1/buildings", payload: { address: "1 Castle Ave", gross_floor_area_sqft: 90000, property_type: "CASTLE" }, as: BuildingOwner, as_user_id: "${o1}", captures: { err: "$.data.error_id" } }
          assert:
            - "err == ERR_INVALID_REQUEST (400)"

      - name: e_owner_computed_fields_input_ignored
        claim_type: computed_fields
        grounds:
          - "entities.Owner.fields.standing"
          - "entities.Owner.fields.outstanding_fines_cents"
        distinguishing_aspect: "Client-supplied standing/outstanding_fines_cents in the create payload are ignored; the server computes both."
        test_recipe:
          setup: ["nothing"]
          setup_api_calls: []
          trigger:
            - { call: "POST /v1/owners", payload: { name: "Owner Rigged", contact_email: "or@x.com", standing: "RESTRICTED", outstanding_fines_cents: 999999 }, as: ComplianceOfficer, as_user_id: "officer-1", captures: { st: $.data.standing, out: $.data.outstanding_fines_cents } }
          assert:
            - "response shows standing == NORMAL and outstanding_fines_cents == 0 (client values ignored)"

      - name: e_get_building_not_found_returns_404
        claim_type: not_found
        grounds:
          - "errors[ERR_NOT_FOUND]"
          - "validations[priority=4]"
        distinguishing_aspect: "GET on a well-formed but nonexistent UUID returns the error envelope with ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["nothing"]
          setup_api_calls: []
          trigger:
            - { call: "GET /v1/buildings/00000000-0000-0000-0000-000000000000", as: ComplianceOfficer, captures: { err: "$.data.error_id" } }
          assert:
            - "err == ERR_NOT_FOUND and HTTP 404; error envelope carries meta + data.error_id + data.message"

      - name: e_buildings_list_pagination_envelope
        claim_type: listing
        grounds:
          - "response_envelope"
          - "endpoints[GET /v1/buildings]"
        distinguishing_aspect: "List endpoint honors the fixed envelope: limit/offset windowing with total_count and has_more."
        test_recipe:
          setup: ["owner with three buildings"]
          setup_api_calls:
            - { call: "POST /v1/owners", payload: { name: "Owner P", contact_email: "op@x.com" }, as: ComplianceOfficer, as_user_id: "officer-1", captures: { o1: $.data.id } }
            - { call: "POST /v1/buildings", payload: { address: "1 A St", gross_floor_area_sqft: 30000, property_type: "OFFICE" }, as: BuildingOwner, as_user_id: "${o1}" }
            - { call: "POST /v1/buildings", payload: { address: "2 A St", gross_floor_area_sqft: 31000, property_type: "RETAIL" }, as: BuildingOwner, as_user_id: "${o1}" }
            - { call: "POST /v1/buildings", payload: { address: "3 A St", gross_floor_area_sqft: 32000, property_type: "HOTEL" }, as: BuildingOwner, as_user_id: "${o1}" }
          trigger:
            - { call: "GET /v1/buildings", payload: { limit: 2, offset: 0 }, as: ComplianceOfficer }
          assert:
            - "data holds exactly 2 buildings; envelope reports total_count == 3 and has_more == true (limit == 2, offset == 0)"

      - name: e_covered_list_filter_excludes_uncovered
        claim_type: listing
        grounds:
          - "endpoints[GET /v1/buildings]"
          - "calculations.coverage_determination"
        excluded_because:
          difficulty_instance: floor_area_exactly_at_coverage_threshold
          rationale: "The difficulty instance asserts the covered_in_cycle_id list contains exactly the 25000-sqft building and excludes the 24999 and INDUSTRIAL ones."

  # ===========================================================================
  - section: state_machines
    instances:
      - name: s_report_created_in_draft
        claim_type: initial_state
        grounds:
          - "state_machines.BenchmarkReport"
        distinguishing_aspect: "A created report starts DRAFT with revision_number 0 and aggregates computed at creation."
        test_recipe:
          setup: ["owner, OPEN cycle c27, covered building b1 (50000 sqft OFFICE)"]
          setup_api_calls:
            - { call: "POST /v1/owners", payload: { name: "Owner D0", contact_email: "od0@x.com" }, as: ComplianceOfficer, as_user_id: "officer-1", captures: { o1: $.data.id } }
            - call: "POST /v1/reporting-cycles"
              payload: { cycle_year: 2027, filing_deadline_at: "2027-06-01T00:00:00Z", covered_floor_area_threshold_sqft: 25000, covered_property_types: ["OFFICE", "MULTIFAMILY", "RETAIL", "HOTEL"], late_fine_daily_rate_cents: 5000, late_fine_cap_days: 60, non_compliance_fine_cents: 500000, data_completeness_min_pct: 90, correction_tolerance_pct: 5, anomaly_yoy_threshold_pct: 25, weather_adjustment_factor: 0.9, performance_standards: [{ property_type: "OFFICE", median_eui: 80, score_slope: 2, baseline_eui_default: 100, annual_reduction_pct: 10, shortfall_tolerance_pct: 5, fine_rate_cents_per_sqft: 5, performance_fine_cap_cents: 1000000 }] }
              as: ComplianceOfficer
              as_user_id: "officer-1"
              captures: { c27: $.data.id }
            - { call: "POST /v1/reporting-cycles/${c27}/open", payload: {}, as: ComplianceOfficer, as_user_id: "officer-1" }
            - { call: "POST /v1/buildings", payload: { address: "30 Main St", gross_floor_area_sqft: 50000, property_type: "OFFICE" }, as: BuildingOwner, as_user_id: "${o1}", captures: { b1: $.data.id } }
          trigger:
            - { call: "POST /v1/benchmark-reports", payload: { building_id: "${b1}", cycle_id: "${c27}" }, as: BuildingOwner, as_user_id: "${o1}", captures: { st: $.data.status, rev: $.data.revision_number, agg: $.data.aggregated_kbtu } }
          assert:
            - "status == DRAFT, revision_number == 0, aggregated_kbtu == 0 (no usage yet), is_late == false"

      - name: s_submit_from_verified_returns_invalid_state
        claim_type: invalid_transition
        grounds:
          - "state_machines.BenchmarkReport"
          - "errors[ERR_INVALID_STATE_TRANSITION]"
        distinguishing_aspect: "VERIFIED is not a valid from-state for submit; only DRAFT and FLAGGED are."
        test_recipe:
          setup:
            - "full verification fixture: owner, verifier, OPEN cycle, building with 90.00 completeness (units 20000/15000/5000, consents u1+u2), report SUBMITTED then VERIFIED"
          setup_api_calls:
            - { call: "POST /v1/owners", payload: { name: "Owner D1", contact_email: "od1@x.com" }, as: ComplianceOfficer, as_user_id: "officer-1", captures: { o1: $.data.id } }
            - { call: "POST /v1/verifiers", payload: { name: "Verifier D1", license_number: "LIC-D1" }, as: ComplianceOfficer, as_user_id: "officer-1", captures: { v1: $.data.id } }
            - call: "POST /v1/reporting-cycles"
              payload: { cycle_year: 2027, filing_deadline_at: "2027-06-01T00:00:00Z", covered_floor_area_threshold_sqft: 25000, covered_property_types: ["OFFICE", "MULTIFAMILY", "RETAIL", "HOTEL"], late_fine_daily_rate_cents: 5000, late_fine_cap_days: 60, non_compliance_fine_cents: 500000, data_completeness_min_pct: 90, correction_tolerance_pct: 5, anomaly_yoy_threshold_pct: 25, weather_adjustment_factor: 0.9, performance_standards: [{ property_type: "OFFICE", median_eui: 80, score_slope: 2, baseline_eui_default: 100, annual_reduction_pct: 10, shortfall_tolerance_pct: 5, fine_rate_cents_per_sqft: 5, performance_fine_cap_cents: 1000000 }] }
              as: ComplianceOfficer
              as_user_id: "officer-1"
              captures: { c27: $.data.id }
            - { call: "POST /v1/reporting-cycles/${c27}/open", payload: {}, as: ComplianceOfficer, as_user_id: "officer-1" }
            - { call: "POST /v1/buildings", payload: { address: "31 Main St", gross_floor_area_sqft: 50000, property_type: "OFFICE" }, as: BuildingOwner, as_user_id: "${o1}", captures: { b1: $.data.id } }
            - { call: "POST /v1/buildings/${b1}/tenant-units", payload: { unit_label: "U1", floor_area_sqft: 20000, space_type: "OFFICE" }, as: BuildingOwner, as_user_id: "${o1}", captures: { u1: $.data.id } }
            - { call: "POST /v1/buildings/${b1}/tenant-units", payload: { unit_label: "U2", floor_area_sqft: 15000, space_type: "RETAIL" }, as: BuildingOwner, as_user_id: "${o1}", captures: { u2: $.data.id } }
            - { call: "POST /v1/buildings/${b1}/tenant-units", payload: { unit_label: "U3", floor_area_sqft: 5000, space_type: "OFFICE" }, as: BuildingOwner, as_user_id: "${o1}" }
            - { call: "POST /v1/tenant-units/${u1}/consent-grants", payload: {}, as: BuildingOwner, as_user_id: "${o1}", captures: { cg1: $.data.id } }
            - { call: "POST /v1/consent-grants/${cg1}/grant", payload: { valid_from: "2027-01-01", valid_to: "2027-12-31" }, as: TenantRep, as_user_id: "${u1}" }
            - { call: "POST /v1/tenant-units/${u2}/consent-grants", payload: {}, as: BuildingOwner, as_user_id: "${o1}", captures: { cg2: $.data.id } }
            - { call: "POST /v1/consent-grants/${cg2}/grant", payload: { valid_from: "2027-01-01", valid_to: "2027-12-31" }, as: TenantRep, as_user_id: "${u2}" }
            - { call: "POST /v1/benchmark-reports", payload: { building_id: "${b1}", cycle_id: "${c27}" }, as: BuildingOwner, as_user_id: "${o1}", captures: { rep1: $.data.id } }
            - { call: "POST /v1/benchmark-reports/${rep1}/submit", payload: {}, as: BuildingOwner, as_user_id: "${o1}" }
            - { call: "POST /v1/benchmark-reports/${rep1}/verification-records", payload: { verifier_id: "${v1}" }, as: BuildingOwner, as_user_id: "${o1}", captures: { vr1: $.data.id } }
            - { call: "POST /v1/verification-records/${vr1}/sign-off", payload: {}, as: DataVerifier, as_user_id: "${v1}" }
          trigger:
            - { call: "POST /v1/benchmark-reports/${rep1}/submit", payload: {}, as: BuildingOwner, as_user_id: "${o1}", captures: { err: "$.data.error_id" } }
          assert:
            - "err == ERR_INVALID_STATE_TRANSITION (409); report remains VERIFIED"

      - name: s_fine_paid_is_terminal
        claim_type: terminal_state_lockdown
        grounds:
          - "state_machines.FineAssessment"
          - "errors[ERR_INVALID_STATE_TRANSITION]"
        distinguishing_aspect: "PAID is terminal: a second pay on the paid fine is rejected with ERR_INVALID_STATE_TRANSITION."
        test_recipe:
          setup:
            - "owner with building at 90.00 completeness; report DRAFT; clock 2027-06-03T12:00:00Z; late submit -> fine 10000 ASSESSED; notice -> NOTICED final 10000; pay 10000 -> PAID"
          setup_api_calls:
            - { call: "POST /v1/owners", payload: { name: "Owner D2", contact_email: "od2@x.com" }, as: ComplianceOfficer, as_user_id: "officer-1", captures: { o1: $.data.id } }
            - call: "POST /v1/reporting-cycles"
              payload: { cycle_year: 2027, filing_deadline_at: "2027-06-01T00:00:00Z", covered_floor_area_threshold_sqft: 25000, covered_property_types: ["OFFICE", "MULTIFAMILY", "RETAIL", "HOTEL"], late_fine_daily_rate_cents: 5000, late_fine_cap_days: 60, non_compliance_fine_cents: 500000, data_completeness_min_pct: 90, correction_tolerance_pct: 5, anomaly_yoy_threshold_pct: 25, weather_adjustment_factor: 0.9, performance_standards: [{ property_type: "OFFICE", median_eui: 80, score_slope: 2, baseline_eui_default: 100, annual_reduction_pct: 10, shortfall_tolerance_pct: 5, fine_rate_cents_per_sqft: 5, performance_fine_cap_cents: 1000000 }] }
              as: ComplianceOfficer
              as_user_id: "officer-1"
              captures: { c27: $.data.id }
            - { call: "POST /v1/reporting-cycles/${c27}/open", payload: {}, as: ComplianceOfficer, as_user_id: "officer-1" }
            - { call: "POST /v1/buildings", payload: { address: "32 Main St", gross_floor_area_sqft: 50000, property_type: "OFFICE" }, as: BuildingOwner, as_user_id: "${o1}", captures: { b1: $.data.id } }
            - { call: "POST /v1/buildings/${b1}/tenant-units", payload: { unit_label: "U1", floor_area_sqft: 20000, space_type: "OFFICE" }, as: BuildingOwner, as_user_id: "${o1}", captures: { u1: $.data.id } }
            - { call: "POST /v1/buildings/${b1}/tenant-units", payload: { unit_label: "U2", floor_area_sqft: 15000, space_type: "RETAIL" }, as: BuildingOwner, as_user_id: "${o1}", captures: { u2: $.data.id } }
            - { call: "POST /v1/buildings/${b1}/tenant-units", payload: { unit_label: "U3", floor_area_sqft: 5000, space_type: "OFFICE" }, as: BuildingOwner, as_user_id: "${o1}" }
            - { call: "POST /v1/tenant-units/${u1}/consent-grants", payload: {}, as: BuildingOwner, as_user_id: "${o1}", captures: { cg1: $.data.id } }
            - { call: "POST /v1/consent-grants/${cg1}/grant", payload: { valid_from: "2027-01-01", valid_to: "2027-12-31" }, as: TenantRep, as_user_id: "${u1}" }
            - { call: "POST /v1/tenant-units/${u2}/consent-grants", payload: {}, as: BuildingOwner, as_user_id: "${o1}", captures: { cg2: $.data.id } }
            - { call: "POST /v1/consent-grants/${cg2}/grant", payload: { valid_from: "2027-01-01", valid_to: "2027-12-31" }, as: TenantRep, as_user_id: "${u2}" }
            - { call: "POST /v1/benchmark-reports", payload: { building_id: "${b1}", cycle_id: "${c27}" }, as: BuildingOwner, as_user_id: "${o1}", captures: { rep1: $.data.id } }
            - { call: "POST /v1/_clock/set_current_utc", payload: { to_iso8601: "2027-06-03T12:00:00Z" }, as: ComplianceOfficer, as_user_id: "officer-1" }
            - { call: "POST /v1/benchmark-reports/${rep1}/submit", payload: {}, as: BuildingOwner, as_user_id: "${o1}" }
            - { call: "GET /v1/fine-assessments", payload: { building_id: "${b1}" }, as: ComplianceOfficer, captures: { f1: "$.data[0].id" } }
            - { call: "POST /v1/fine-assessments/${f1}/notice", payload: {}, as: ComplianceOfficer, as_user_id: "officer-1" }
            - { call: "POST /v1/fine-assessments/${f1}/pay", payload: { paid_amount_cents: 10000 }, as: BuildingOwner, as_user_id: "${o1}", captures: { st: $.data.status } }
          trigger:
            - { call: "POST /v1/fine-assessments/${f1}/pay", payload: { paid_amount_cents: 10000 }, as: BuildingOwner, as_user_id: "${o1}", captures: { err: "$.data.error_id" } }
          assert:
            - "first pay lands in PAID; second pay fails with err == ERR_INVALID_STATE_TRANSITION (409) — terminal lockdown"

      - name: s_consent_grant_from_granted_rejected
        claim_type: invalid_transition
        grounds:
          - "state_machines.ConsentGrant"
          - "errors[ERR_INVALID_STATE_TRANSITION]"
        distinguishing_aspect: "grant is only valid from REQUESTED; re-granting a GRANTED grant fails regardless of window."
        test_recipe:
          setup: ["owner, building, unit u1, consent cg1 already GRANTED for 2027"]
          setup_api_calls:
            - { call: "POST /v1/owners", payload: { name: "Owner D3", contact_email: "od3@x.com" }, as: ComplianceOfficer, as_user_id: "officer-1", captures: { o1: $.data.id } }
            - { call: "POST /v1/buildings", payload: { address: "33 Main St", gross_floor_area_sqft: 50000, property_type: "OFFICE" }, as: BuildingOwner, as_user_id: "${o1}", captures: { b1: $.data.id } }
            - { call: "POST /v1/buildings/${b1}/tenant-units", payload: { unit_label: "U1", floor_area_sqft: 20000, space_type: "OFFICE" }, as: BuildingOwner, as_user_id: "${o1}", captures: { u1: $.data.id } }
            - { call: "POST /v1/tenant-units/${u1}/consent-grants", payload: {}, as: BuildingOwner, as_user_id: "${o1}", captures: { cg1: $.data.id } }
            - { call: "POST /v1/consent-grants/${cg1}/grant", payload: { valid_from: "2027-01-01", valid_to: "2027-12-31" }, as: TenantRep, as_user_id: "${u1}" }
          trigger:
            - { call: "POST /v1/consent-grants/${cg1}/grant", payload: { valid_from: "2027-01-01", valid_to: "2027-12-31" }, as: TenantRep, as_user_id: "${u1}", captures: { err: "$.data.error_id" } }
          assert:
            - "err == ERR_INVALID_STATE_TRANSITION (409)"

      - name: s_cycle_open_twice_rejected
        claim_type: invalid_transition
        grounds:
          - "state_machines.ReportingCycle"
          - "errors[ERR_INVALID_STATE_TRANSITION]"
        distinguishing_aspect: "open is only valid from SCHEDULED; the second open is rejected."
        test_recipe:
          setup: ["cycle c27 created and opened"]
          setup_api_calls:
            - call: "POST /v1/reporting-cycles"
              payload: { cycle_year: 2027, filing_deadline_at: "2027-06-01T00:00:00Z", covered_floor_area_threshold_sqft: 25000, covered_property_types: ["OFFICE", "MULTIFAMILY", "RETAIL", "HOTEL"], late_fine_daily_rate_cents: 5000, late_fine_cap_days: 60, non_compliance_fine_cents: 500000, performance_standards: [{ property_type: "OFFICE", median_eui: 80, score_slope: 2, baseline_eui_default: 100, annual_reduction_pct: 10, shortfall_tolerance_pct: 5, fine_rate_cents_per_sqft: 5, performance_fine_cap_cents: 1000000 }] }
              as: ComplianceOfficer
              as_user_id: "officer-1"
              captures: { c27: $.data.id }
            - { call: "POST /v1/reporting-cycles/${c27}/open", payload: {}, as: ComplianceOfficer, as_user_id: "officer-1" }
          trigger:
            - { call: "POST /v1/reporting-cycles/${c27}/open", payload: {}, as: ComplianceOfficer, as_user_id: "officer-1", captures: { err: "$.data.error_id" } }
          assert:
            - "err == ERR_INVALID_STATE_TRANSITION (409); cycle stays OPEN"

      - name: s_exemption_decide_before_review_rejected
        claim_type: invalid_transition
        grounds:
          - "state_machines.ExemptionRequest"
          - "errors[ERR_INVALID_STATE_TRANSITION]"
        distinguishing_aspect: "decide requires UNDER_REVIEW; deciding a fresh SUBMITTED request is rejected (approval chain step cannot be skipped)."
        test_recipe:
          setup: ["owner, OPEN cycle, building, EXEMPTION request er1 in SUBMITTED"]
          setup_api_calls:
            - { call: "POST /v1/owners", payload: { name: "Owner D4", contact_email: "od4@x.com" }, as: ComplianceOfficer, as_user_id: "officer-1", captures: { o1: $.data.id } }
            - call: "POST /v1/reporting-cycles"
              payload: { cycle_year: 2027, filing_deadline_at: "2027-06-01T00:00:00Z", covered_floor_area_threshold_sqft: 25000, covered_property_types: ["OFFICE", "MULTIFAMILY", "RETAIL", "HOTEL"], late_fine_daily_rate_cents: 5000, late_fine_cap_days: 60, non_compliance_fine_cents: 500000, performance_standards: [{ property_type: "OFFICE", median_eui: 80, score_slope: 2, baseline_eui_default: 100, annual_reduction_pct: 10, shortfall_tolerance_pct: 5, fine_rate_cents_per_sqft: 5, performance_fine_cap_cents: 1000000 }] }
              as: ComplianceOfficer
              as_user_id: "officer-1"
              captures: { c27: $.data.id }
            - { call: "POST /v1/reporting-cycles/${c27}/open", payload: {}, as: ComplianceOfficer, as_user_id: "officer-1" }
            - { call: "POST /v1/buildings", payload: { address: "34 Main St", gross_floor_area_sqft: 50000, property_type: "OFFICE" }, as: BuildingOwner, as_user_id: "${o1}", captures: { b1: $.data.id } }
            - { call: "POST /v1/buildings/${b1}/exemption-requests", payload: { cycle_id: "${c27}", request_type: "EXEMPTION", reason: "Building fully vacant this cycle" }, as: BuildingOwner, as_user_id: "${o1}", captures: { er1: $.data.id } }
          trigger:
            - { call: "POST /v1/exemption-requests/${er1}/decide", payload: { decision: "APPROVED", decision_note: "Skipping review" }, as: ComplianceOfficer, as_user_id: "officer-1", captures: { err: "$.data.error_id" } }
          assert:
            - "err == ERR_INVALID_STATE_TRANSITION (409); request remains SUBMITTED"

      - name: s_usage_void_from_voided_rejected
        claim_type: invalid_transition
        grounds:
          - "state_machines.UsageRecord"
          - "errors[ERR_INVALID_STATE_TRANSITION]"
        distinguishing_aspect: "VOIDED is terminal; voiding the same record twice is rejected."
        test_recipe:
          setup: ["owner, building, ELECTRICITY account, one usage record voided"]
          setup_api_calls:
            - { call: "POST /v1/owners", payload: { name: "Owner D5", contact_email: "od5@x.com" }, as: ComplianceOfficer, as_user_id: "officer-1", captures: { o1: $.data.id } }
