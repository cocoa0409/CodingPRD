            - "start on the ACTIVE-storm but FULL-menu unit fails: error_id == ERR_UNIT_NOT_IN_STORM_TIER"
            - "CrewAssignment.${a1}.status == SCHEDULED and CrewAssignment.${a2}.status == SCHEDULED (both unchanged)"

      - name: pledge_creation_requires_active_relief_org
        grounds:
          - state_machines.ReliefPledge
          - validations[priority=7]
          - errors[ERR_RELIEF_ORG_INACTIVE]
        distinguishing_aspect: |
          Entity pair ReliefPledge -> ReliefOrg (different pair from
          CrewAssignment -> StormEvent/Unit): pledging meals with a SUSPENDED
          relief organization is rejected with ERR_RELIEF_ORG_INACTIVE even
          though the unit is legitimately storm-affected.
        test_recipe:
          setup:
            - "Clock 2026-09-10T08:00:00Z. Storm WATCH; unit U water DOWN (TIER2). ReliefOrg R created ACTIVE then suspended via PATCH."
          setup_api_calls:
            - call: "POST /ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-10T08:00:00Z" }
              as: CommandCenterAdmin
            - call: "POST /ops/storm-events"
