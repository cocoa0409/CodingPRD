            - "ProcessingPlant.${plant_id}.downtime_minutes_mtd == 360.0"
            - "ProcessingPlant.${plant_id}.flare_minutes_mtd == 360.0"
            - "ProcessingPlant.${plant_id}.availability_factor_pct == 97.30"

  - section: calculations
    instances:
      - name: good_reading_air_intrusion_index_correct_result
        claim_type: correct_result
        grounds: ["calculations.reading_quality_classification", "entities.WellTuningReading.fields.air_intrusion_index", "entities.WellTuningReading.fields.resulting_well_state"]
        distinguishing_aspect: "For oxygen 0.8, nitrogen 4.0, methane 55.0 and temperature 118.0 the weighted score is 3.20 + 1.40 - 2.75 + 0.00 = 1.85, classifying GOOD, leaving the well ONLINE with current_flow_scfm equal to the reading's 480.0."
        test_recipe:
          setup: ["One LandfillSite and one GasWell W-01 with target_flow_scfm 500.0, ONLINE, no readings."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: ProjectAdmin
            - call: "POST /sites"
              payload: { name: "Rolling Hills Landfill", state_code: "CA", host_royalty_pct: 0.12, royalty_variant: "GROSS_REVENUE_SHARE", permit_nmoc_limit_lb_per_hr: 3.5 }
              as: ProjectAdmin
              captures: { site_id: $.data.id }
            - call: "POST /wells"
              payload: { site_id: "${site_id}", well_code: "W-01", target_flow_scfm: 500.0 }
              as: ProjectAdmin
              captures: { w1_id: $.data.id }
          trigger:
            - call: "POST /wells/${w1_id}/readings"
              payload: { taken_at: "2026-08-10T01:00:00Z", methane_pct: 55.0, oxygen_pct: 0.8, nitrogen_pct: 4.0, temperature_f: 118.0, flow_scfm: 480.0, vacuum_inhg: 22.5 }
              as: WellfieldTechnician
              captures: { aii: $.data.air_intrusion_index, qclass: $.data.quality_class }
          assert:
            - "${aii} == 1.85"
            - "${qclass} == 'GOOD'"
            - "The reading's resulting_well_state == ONLINE"
            - "GasWell.${w1_id}.operating_state == ONLINE"
            - "GasWell.${w1_id}.current_flow_scfm == 480.0"
            - "GasWell.${w1_id}.consecutive_good_readings == 1"
            - "GasWell.${w1_id}.wellhead_vacuum_inhg == 22.5"
            - "LandfillSite.${site_id}.collected_flow_scfm == 480.0"
            - "LandfillSite.${site_id}.collection_efficiency_pct == 96.0"

      - name: availability_factor_merges_overlapping_and_touching_downtime_intervals
        claim_type: interval_merge
        grounds: ["calculations.plant_availability_factor", "entities.ProcessingPlant.fields.downtime_minutes_mtd", "entities.ProcessingPlant.fields.flare_minutes_mtd", "entities.DowntimeEvent.fields.duration_minutes"]
        distinguishing_aspect: "Two overlapping FLARED outages (00:00-06:00 and 04:00-08:00) merge to 480 minutes, and two touching VENTED outages (00:00-02:00 and 02:00-05:00) merge to 300 contiguous minutes, giving downtime_minutes_mtd 780.0 - not the 900.0 a naive sum of the four durations would produce - and availability_factor_pct 94.58."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-11T00:00:00Z, so the month-to-date window is [2026-08-01T00:00:00Z, 2026-08-11T00:00:00Z) = 14400 minutes."
            - "One LandfillSite and one ProcessingPlant with no downtime records yet (availability_factor_pct 100.0)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-11T00:00:00Z" }
              as: ProjectAdmin
            - call: "POST /sites"
              payload: { name: "Rolling Hills Landfill", state_code: "CA", host_royalty_pct: 0.12, royalty_variant: "GROSS_REVENUE_SHARE", permit_nmoc_limit_lb_per_hr: 3.5 }
              as: ProjectAdmin
              captures: { site_id: $.data.id }
            - call: "POST /plants"
              payload: { site_id: "${site_id}", plant_code: "P1", receipt_point_code: "RP-7", receipt_point_mdq_dth_per_day: 4800.0, min_feed_scfm: 900.0 }
              as: ProjectAdmin
              captures: { plant_id: $.data.id }
          trigger:
            - call: "POST /downtime-events"
              payload: { plant_id: "${plant_id}", start_at: "2026-08-02T00:00:00Z", cause: "COMPRESSOR_TRIP", disposition: "FLARED" }
              as: PlantOperator
              captures: { d1_id: $.data.id }
            - call: "POST /downtime-events/${d1_id}/close"
              payload: { end_at: "2026-08-02T06:00:00Z", flared_mmbtu: 12.50 }
              as: PlantOperator
            - call: "POST /downtime-events"
              payload: { plant_id: "${plant_id}", start_at: "2026-08-02T04:00:00Z", cause: "OFF_SPEC_TRIP", disposition: "FLARED" }
              as: PlantOperator
              captures: { d2_id: $.data.id }
            - call: "POST /downtime-events/${d2_id}/close"
              payload: { end_at: "2026-08-02T08:00:00Z" }
              as: PlantOperator
            - call: "POST /downtime-events"
              payload: { plant_id: "${plant_id}", start_at: "2026-08-03T00:00:00Z", cause: "PLANNED_MAINTENANCE", disposition: "VENTED" }
              as: PlantOperator
              captures: { d3_id: $.data.id }
            - call: "POST /downtime-events/${d3_id}/close"
              payload: { end_at: "2026-08-03T02:00:00Z", vented_mmbtu: 4.00 }
              as: PlantOperator
            - call: "POST /downtime-events"
              payload: { plant_id: "${plant_id}", start_at: "2026-08-03T02:00:00Z", cause: "PLANNED_MAINTENANCE", disposition: "VENTED" }
              as: PlantOperator
              captures: { d4_id: $.data.id }
            - call: "POST /downtime-events/${d4_id}/close"
              payload: { end_at: "2026-08-03T05:00:00Z" }
              as: PlantOperator
            - call: "GET /sites/${site_id}/energy-balance"
              as: ProjectAdmin
              captures: { prod: $.data.energy_produced_mmbtu, flared: $.data.energy_flared_mmbtu, vented: $.data.energy_vented_mmbtu, ok: $.data.balance_ok }
          assert:
            - "DowntimeEvent.${d1_id}.duration_minutes == 360.0 and status == CLOSED"
            - "DowntimeEvent.${d2_id}.duration_minutes == 240.0"
            - "DowntimeEvent.${d3_id}.duration_minutes == 120.0"
            - "DowntimeEvent.${d4_id}.duration_minutes == 180.0"
            - "ProcessingPlant.${plant_id}.downtime_minutes_mtd == 780.0"
            - "ProcessingPlant.${plant_id}.flare_minutes_mtd == 480.0"
            - "ProcessingPlant.${plant_id}.availability_factor_pct == 94.58"
            - "${prod} == 16.50"
            - "${flared} == 12.50"
            - "${vented} == 4.00"
            - "${ok} == true"

