          - state_machines.AdCampaign.APPROVED_to_RECONCILED
          - entities.AdCampaign.fields.show_payout_cents
          - entities.AdCampaign.fields.platform_take_cents
          - entities.AdSlot.fields.gross_cents
        distinguishing_aspect: |
          Conserved quantity = the campaign's gross total (sum of AdSlot.gross_cents),
          a different conserved quantity than the show ledger. Invariant pinned by
          the formula: show_payout_cents + platform_take_cents == sum of
