# Scaffold Corner Design (SKILL.md §1.9) - breadth coverage index for task 2873.
# Walked row-by-row against references/claim-extraction-guide.md; every instance is a test
# prototype the unit-test-generator transcribes verbatim. Corners already asserted by
# SCAFFOLD_DIFFICULTY_DESIGN.yaml carry an excluded_because stub instead of a test_recipe.
scaffold_corner_design:
  - section: Entities
    instances:
      - name: create_member_persists_inputs_and_derives_system_fields
        claim_type: Creation
        grounds:
          - entities.Member
          - endpoints["POST /advocacy/members"]
          - response_envelope.success
        distinguishing_aspect: "A single POST with every required field returns 201 with the fixed envelope, a bare UUID id (no type prefix), version 1, notice_method derived from FEDERAL -> RATIO, and the two computed counters seeded to their declared defaults."
        test_recipe:
          setup:
            - "Empty database at the default logical clock 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: AssociationAdmin
              as_user_id: "admin-1"
          trigger:
            - call: "POST /advocacy/members"
              payload: { legal_name: "Alpha Steel Co", membership_tier: "PREMIER", home_jurisdiction_code: "FEDERAL", home_district_code: "CA-12", annual_dues_cents: 400000, dues_year: 2026, restricted_class_size: 25, status: "ACTIVE", advocacy_optout: false, engagement_score: 90 }
              as: AssociationAdmin
              as_user_id: "admin-1"
              captures: { m1_id: $.data.id, m1_created: $.data.created_at }
          assert:
            - "HTTP 201 with response_type object and meta.api_request_id present"
            - "Member.${m1_id}: legal_name 'Alpha Steel Co', membership_tier PREMIER, home_jurisdiction_code FEDERAL, home_district_code CA-12, annual_dues_cents 400000, dues_year 2026, restricted_class_size 25, status ACTIVE, advocacy_optout false, engagement_score 90"
            - "notice_method == RATIO (derived from JURISDICTION_RULES[FEDERAL].deductibility_method, never accepted from the client)"
            - "pac_solicitable == false and recorded_dissent_count == 0"
            - "id is a bare 36-character UUID with no type prefix; version == 1; created_at == updated_at == 2026-08-01T00:00:00.000Z"
      - name: read_member_returns_the_stored_row
        claim_type: Retrieval
        grounds:
          - endpoints["GET /advocacy/members/{id}"]
          - entities.Member
        distinguishing_aspect: "The GET is a pure read: every field matches the create response byte for byte and version is still 1, proving no mutation happened on read."
        test_recipe:
          setup:
            - "One member enrolled at the default clock and never mutated afterwards."
          setup_api_calls:
            - call: "POST /advocacy/members"
              payload: { legal_name: "Beta Foundry Co", membership_tier: "FULL", home_jurisdiction_code: "STATE_CA", home_district_code: "CA-12", annual_dues_cents: 400000, dues_year: 2026, restricted_class_size: 15 }
              as: AssociationAdmin
              as_user_id: "admin-1"
              captures: { m1_id: $.data.id }
          trigger:
            - call: "GET /advocacy/members/${m1_id}"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-1"
          assert:
            - "HTTP 200 with data.id == ${m1_id}, membership_tier FULL, home_jurisdiction_code STATE_CA"
            - "notice_method == FLAT_FLOOR (STATE_CA resolves to the flat-floor deductibility method)"
            - "version == 1 and updated_at == created_at - the read mutated nothing"
      - name: list_member_prior_approvals_paginates_in_created_at_order
        claim_type: Listing
        grounds:
          - endpoints["GET /advocacy/members/{id}/prior-approvals"]
          - response_envelope.pagination_fields
        distinguishing_aspect: "limit 1 / offset 0 returns only the earliest-created approval with total_count 2 and has_more true; offset 1 returns the later one with has_more false, so the page window and the created_at ASC order are both pinned."
        test_recipe:
          setup:
            - "One member holding two non-overlapping REQUESTED prior approvals, created in this order: 2026-01-01..2026-03-31 first, then 2026-04-01..2026-06-30."
          setup_api_calls:
            - call: "POST /advocacy/members"
              payload: { legal_name: "Alpha Steel Co", membership_tier: "PREMIER", home_jurisdiction_code: "FEDERAL", home_district_code: "CA-12", annual_dues_cents: 400000, dues_year: 2026, restricted_class_size: 25 }
              as: AssociationAdmin
              as_user_id: "admin-1"
              captures: { m1_id: $.data.id }
            - call: "POST /advocacy/prior-approvals"
              payload: { member_id: "${m1_id}", calendar_year: 2026, solicitable_class_size: 5, effective_date: "2026-01-01", expires_at_date: "2026-03-31" }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { pa1_id: $.data.id }
            - call: "POST /advocacy/prior-approvals"
              payload: { member_id: "${m1_id}", calendar_year: 2026, solicitable_class_size: 5, effective_date: "2026-04-01", expires_at_date: "2026-06-30" }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { pa2_id: $.data.id }
          trigger:
            - call: "GET /advocacy/members/${m1_id}/prior-approvals"
              payload: { limit: 1, offset: 0 }
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "GET /advocacy/members/${m1_id}/prior-approvals"
              payload: { limit: 1, offset: 1 }
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "GET /advocacy/members/${m1_id}/prior-approvals"
              payload: { status: "GRANTED" }
              as: ComplianceOfficer
              as_user_id: "co-1"
          assert:
            - "First page: response_type array, exactly one row whose id == ${pa1_id}, total_count == 2, has_more == true, limit == 1, offset == 0"
            - "Second page: exactly one row whose id == ${pa2_id}, total_count == 2, has_more == false"
            - "Filtered read with status GRANTED: zero rows, total_count == 0, has_more == false (both approvals are still REQUESTED)"
      - name: read_unknown_member_id_returns_member_not_found
        claim_type: Not Found
        grounds:
          - validations[priority=4].error_id
          - errors[ERR_MEMBER_NOT_FOUND]
        distinguishing_aspect: "A syntactically valid but unused UUID must produce 404 ERR_MEMBER_NOT_FOUND from the priority-4 existence check, not a 200 with an empty body and not a 400."
        test_recipe:
          setup:
            - "One unrelated member exists, so the collection is non-empty and the 404 cannot be an artifact of an empty store."
          setup_api_calls:
            - call: "POST /advocacy/members"
              payload: { legal_name: "Alpha Steel Co", membership_tier: "PREMIER", home_jurisdiction_code: "FEDERAL", home_district_code: "CA-12", annual_dues_cents: 400000, dues_year: 2026, restricted_class_size: 25 }
              as: AssociationAdmin
              as_user_id: "admin-1"
              captures: { m1_id: $.data.id }
          trigger:
            - call: "GET /advocacy/members/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: AssociationAdmin
              as_user_id: "admin-1"
              captures: { err_id: $.data.error_id, err_msg: $.data.message }
          assert:
            - "HTTP 404 with response_type error and data.error_id == ERR_MEMBER_NOT_FOUND"
            - "data.message is a non-empty human-readable string"
            - "The existing member ${m1_id} is untouched (version 1)"
      - name: create_candidate_without_district_code_rejected
        claim_type: Required Fields
        grounds:
          - validations[priority=6].error_id
          - endpoints["POST /advocacy/candidates"]
        distinguishing_aspect: "district_code has source input with no default, so omitting it is a shape violation caught at priority 6 with 400 ERR_INVALID_REQUEST - before any scoring or jurisdiction logic runs."
        test_recipe:
          setup:
            - "No candidate rows exist; the request omits the required district_code field and supplies every other required input."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: GovAffairsDirector
              as_user_id: "gad-1"
          trigger:
            - call: "POST /advocacy/candidates"
              payload: { name: "Rep. Jane Alvarez", office: "US_HOUSE", jurisdiction_code: "FEDERAL", election_cycle: "2026-GENERAL", incumbency: "INCUMBENT", voting_alignment_pct: 90.00, committee_relevance_score: 80 }
              as: GovAffairsDirector
              as_user_id: "gad-1"
              captures: { err_id: $.data.error_id, err_msg: $.data.message }
          assert:
            - "HTTP 400 with error_id ERR_INVALID_REQUEST"
            - "No Candidate row is created"
      - name: create_member_omitting_optional_fields_applies_declared_defaults
        claim_type: Defaults
        grounds:
          - entities.Member.fields.status
          - entities.Member.fields.advocacy_optout
          - entities.Member.fields.engagement_score
        distinguishing_aspect: "Omitting the three defaulted inputs must yield exactly ACTIVE / false / 50 - not null, not 0 - because engagement_score 50 later decides constituent-match ranking."
        test_recipe:
          setup:
            - "Empty database at the default logical clock."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: AssociationAdmin
              as_user_id: "admin-1"
          trigger:
            - call: "POST /advocacy/members"
              payload: { legal_name: "Gamma Tooling Co", membership_tier: "ASSOCIATE", home_jurisdiction_code: "STATE_NY", home_district_code: "NY-05", annual_dues_cents: 250000, dues_year: 2026, restricted_class_size: 5 }
              as: AssociationAdmin
              as_user_id: "admin-1"
              captures: { m1_id: $.data.id }
          assert:
            - "Member.${m1_id}.status == ACTIVE, advocacy_optout == false, engagement_score == 50"
            - "notice_method == RATIO (STATE_NY) and pac_solicitable == false"
            - "version == 1"
      - name: create_contribution_computed_and_system_fields_input_ignored
        claim_type: Computed Fields
        grounds:
          - entities.PacContribution.fields.support_score
          - entities.PacContribution.fields.max_allowed_cents
          - entities.PacContribution.fields.status
          - calculations.candidate_support_score
        distinguishing_aspect: "Client-supplied values for the computed and system fields are ignored rather than honoured or rejected: the server recomputes support_score 80.50, max_allowed_cents 250000, status PENDING_BOARD and mints its own id, created_at and version."
        test_recipe:
          setup:
            - "One FEDERAL fund for 2026 with min_reserve_cents 0 and one FEDERAL INCUMBENT candidate with voting_alignment_pct 90.00 and committee_relevance_score 80 and no alerts in its district."
          setup_api_calls:
            - call: "POST /advocacy/segregated-funds"
              payload: { name: "NMA Federal PAC", fund_year: 2026, jurisdiction_code: "FEDERAL", min_reserve_cents: 0 }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { fund_id: $.data.id }
            - call: "POST /advocacy/candidates"
              payload: { name: "Rep. Jane Alvarez", office: "US_HOUSE", jurisdiction_code: "FEDERAL", district_code: "CA-12", election_cycle: "2026-GENERAL", incumbency: "INCUMBENT", voting_alignment_pct: 90.00, committee_relevance_score: 80 }
              as: GovAffairsDirector
              as_user_id: "gad-1"
              captures: { cand_id: $.data.id }
          trigger:
            - call: "POST /advocacy/pac-contributions"
              payload: { fund_id: "${fund_id}", candidate_id: "${cand_id}", amount_cents: 100000, memo: "Client tries to pin the score", support_score: 99.99, max_allowed_cents: 999999, status: "BOARD_APPROVED", id: "11111111-1111-1111-1111-111111111111", version: 7 }
              as: GovAffairsDirector
              as_user_id: "gad-1"
              captures: { contrib_id: $.data.id }
          assert:
            - "HTTP 201 - the extra keys are ignored, not rejected"
            - "PacContribution.${contrib_id}.support_score == 80.50 (NOT 99.99) and max_allowed_cents == 250000 (NOT 999999)"
            - "status == PENDING_BOARD (NOT BOARD_APPROVED) and proposed_by_user_id == gad-1"
            - "id != 11111111-1111-1111-1111-111111111111 and version == 1 (NOT 7)"
            - "Candidate.${cand_id}.pending_support_cents == 100000 and latest_support_score == 80.50"
      - name: action_alert_rows_are_immutable
        claim_type: Immutability
        grounds:
          - entities.ActionAlert
        excluded_because:
          difficulty_instance: resource_temporal_overlap / alert_cooling_window_at_exactly_48_hours_is_allowed
          rationale: "That instance's final assert states no ActionAlert carries a version field and no earlier alert row is rewritten by later dispatches; ActionAlert also has no update endpoint in §1.5."
      - name: create_seat_under_unknown_committee_path_not_found
        claim_type: Parent Relationships
        grounds:
          - validations[priority=4].error_id
          - endpoints["POST /advocacy/committees/{id}/seats"]
        distinguishing_aspect: "The path parent is validated before the body FK, so an unknown committee id yields ERR_COMMITTEE_NOT_FOUND even though the member_id in the body is perfectly valid."
        test_recipe:
          setup:
            - "One ACTIVE member exists; no committee with the requested id exists."
          setup_api_calls:
            - call: "POST /advocacy/members"
              payload: { legal_name: "Alpha Steel Co", membership_tier: "PREMIER", home_jurisdiction_code: "FEDERAL", home_district_code: "CA-12", annual_dues_cents: 400000, dues_year: 2026, restricted_class_size: 25 }
              as: AssociationAdmin
              as_user_id: "admin-1"
              captures: { m1_id: $.data.id }
          trigger:
            - call: "POST /advocacy/committees/00000000-0000-0000-0000-000000000000/seats"
              payload: { member_id: "${m1_id}", seat_role: "CHAIR" }
              as: GovAffairsDirector
              as_user_id: "gad-1"
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP 404 with error_id ERR_COMMITTEE_NOT_FOUND (NOT ERR_MEMBER_NOT_FOUND)"
            - "No CommitteeSeat row is created"
      - name: create_position_with_unknown_body_committee_id_not_found
        claim_type: Parent Relationships
        grounds:
          - validations[priority=7].error_id
          - entities.PolicyPosition.fields.committee_id
        distinguishing_aspect: "Flat topology: the parent arrives as a body foreign key rather than a path segment, and the priority-7 body-FK check must still return 404 ERR_COMMITTEE_NOT_FOUND before any jurisdiction-coherence logic at priority 17."
        test_recipe:
          setup:
            - "No committee exists with the referenced id; the jurisdiction_code in the body would also be incoherent, so the ordering is observable."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: GovAffairsDirector
              as_user_id: "gad-1"
          trigger:
            - call: "POST /advocacy/policy-positions"
              payload: { committee_id: "00000000-0000-0000-0000-000000000000", title: "Orphan Position", jurisdiction_code: "STATE_NY", summary: "References a committee that does not exist." }
              as: GovAffairsDirector
              as_user_id: "gad-1"
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP 404 with error_id ERR_COMMITTEE_NOT_FOUND (NOT 422 ERR_JURISDICTION_SCOPE_MISMATCH)"
            - "No PolicyPosition row is created"
      - name: create_member_with_illegal_membership_tier_rejected
        claim_type: Type Constraints
        grounds:
          - entities.Member.fields.membership_tier
          - validations[priority=6].error_id
        distinguishing_aspect: "membership_tier is a closed enum feeding TIER_WEIGHT; an unlisted value such as GOLD has no weight and must be refused at priority 6 rather than silently defaulted to ASSOCIATE."
        test_recipe:
          setup:
            - "Empty database at the default logical clock."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: AssociationAdmin
              as_user_id: "admin-1"
          trigger:
            - call: "POST /advocacy/members"
              payload: { legal_name: "Omega Alloys Co", membership_tier: "GOLD", home_jurisdiction_code: "FEDERAL", home_district_code: "CA-12", annual_dues_cents: 400000, dues_year: 2026, restricted_class_size: 25 }
              as: AssociationAdmin
              as_user_id: "admin-1"
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP 400 with error_id ERR_INVALID_REQUEST"
            - "No Member row is created"
            - "The same request with membership_tier ASSOCIATE returns 201, proving the enum was the only defect"
  - section: State Machines
    instances:
      - name: file_registration_moves_draft_to_active_and_stamps_filed_at
        claim_type: Valid Transition
        grounds:
          - state_machines.LobbyingRegistration[DRAFT -> ACTIVE]
          - endpoints["POST /advocacy/lobbying-registrations/{id}/file"]
        distinguishing_aspect: "The happy-path filing edge: status becomes ACTIVE, filed_at is stamped from the logical clock (not from wall time), version increments to 2, and the coverage window is left untouched."
        test_recipe:
          setup:
            - "One DRAFT FEDERAL registration covering 2026-01-01 through 2026-12-31, no other registration for the same registrant."
          setup_api_calls:
            - call: "POST /advocacy/lobbying-registrations"
              payload: { jurisdiction_code: "FEDERAL", registrant_name: "National Metals Association", coverage_start_date: "2026-01-01", coverage_end_date: "2026-12-31" }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { reg_id: $.data.id }
          trigger:
            - call: "POST /advocacy/lobbying-registrations/${reg_id}/file"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-1"
          assert:
            - "HTTP 200 with data.status == ACTIVE"
            - "filed_at == 2026-08-01T00:00:00.000Z (the logical clock, not wall-clock now)"
            - "coverage_start_date 2026-01-01 and coverage_end_date 2026-12-31 unchanged; amendment_round still 0"
            - "ytd_reportable_cents == 0 and ytd_reportable_hours == 0.000"
            - "version == 2 (the write bumped it from 1)"
      - name: new_registration_starts_in_draft
        claim_type: Initial State
        grounds:
          - state_machines.LobbyingRegistration.initial_state
        distinguishing_aspect: "A freshly created registration is DRAFT with filed_at null - the create endpoint must not auto-file, because DRAFT is exactly what makes activity logging return ERR_REGISTRATION_NOT_ACTIVE."
        test_recipe:
          setup:
            - "Empty database at the default logical clock."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ComplianceOfficer
              as_user_id: "co-1"
          trigger:
            - call: "POST /advocacy/lobbying-registrations"
              payload: { jurisdiction_code: "STATE_NY", registrant_name: "National Metals Association", coverage_start_date: "2026-01-01", coverage_end_date: "2026-12-31" }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { reg_id: $.data.id }
          assert:
            - "HTTP 201 with status == DRAFT"
            - "filed_at is null and terminated_at is null; amendment_round == 0"
            - "version == 1"
      - name: terminating_an_already_terminated_registration_rejected
        claim_type: Idempotency
        grounds:
          - state_machines.LobbyingRegistration.terminal_states
          - validations[priority=8].error_id
        distinguishing_aspect: "TERMINATED is terminal, so the second identical terminate is not a silent no-op: it must be 409 ERR_INVALID_REGISTRATION_STATE, and terminated_at must keep the first call's timestamp."
        test_recipe:
          setup:
            - "One ACTIVE FEDERAL registration with no expenditure reports at all, so the priority-26 open-report guard cannot fire."
          setup_api_calls:
            - call: "POST /advocacy/lobbying-registrations"
              payload: { jurisdiction_code: "FEDERAL", registrant_name: "National Metals Association", coverage_start_date: "2026-01-01", coverage_end_date: "2026-12-31" }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { reg_id: $.data.id }
            - call: "POST /advocacy/lobbying-registrations/${reg_id}/file"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "POST /advocacy/lobbying-registrations/${reg_id}/terminate"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-1"
          trigger:
            - call: "POST /advocacy/lobbying-registrations/${reg_id}/terminate"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { err_id: $.data.error_id }
          assert:
            - "First terminate returned 200 with status TERMINATED and terminated_at 2026-08-01T00:00:00.000Z"
            - "Second terminate returns HTTP 409 with error_id ERR_INVALID_REGISTRATION_STATE"
            - "GET /advocacy/lobbying-registrations/${reg_id} still shows terminated_at 2026-08-01T00:00:00.000Z and the version reached by the first terminate - the rejected call bumped nothing"
      - name: certify_amendment_on_an_active_registration_rejected
        claim_type: Invalid Transition
        grounds:
          - state_machines.LobbyingRegistration[AMENDMENT_PENDING -> ACTIVE]
          - validations[priority=8].error_id
        distinguishing_aspect: "certify-amendment is declared only from AMENDMENT_PENDING; firing it on an ACTIVE registration must not increment amendment_round (which would permanently disarm the auto-amendment trigger)."
        test_recipe:
          setup:
            - "One ACTIVE FEDERAL registration that has never been amended (amendment_round 0)."
          setup_api_calls:
            - call: "POST /advocacy/lobbying-registrations"
              payload: { jurisdiction_code: "FEDERAL", registrant_name: "National Metals Association", coverage_start_date: "2026-01-01", coverage_end_date: "2026-12-31" }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { reg_id: $.data.id }
            - call: "POST /advocacy/lobbying-registrations/${reg_id}/file"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-1"
          trigger:
            - call: "POST /advocacy/lobbying-registrations/${reg_id}/certify-amendment"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP 409 with error_id ERR_INVALID_REGISTRATION_STATE"
            - "GET /advocacy/lobbying-registrations/${reg_id}: status still ACTIVE and amendment_round still 0"
      - name: closed_campaign_refuses_both_a_second_close_and_a_new_alert
        claim_type: Terminal State Lockdown
        grounds:
          - state_machines.GrassrootsCampaign.terminal_states
          - validations[priority=8].error_id
        distinguishing_aspect: "CLOSED is terminal on both outgoing edges at once: the second close and a post-close alert dispatch both return ERR_INVALID_CAMPAIGN_STATE, and the frozen accumulators do not move."
        test_recipe:
          setup:
            - "Canonical adopted FEDERAL position: three CA-12 members (PREMIER/FULL/ASSOCIATE, engagement 90/70/50, dues 400000, dues_year 2026, restricted_class_size 25), one FEDERAL committee with quorum_threshold_pct 60.00 and consensus_threshold_pct 66.67, three seats (CHAIR/MEMBER/MEMBER, total_voting_weight 6, roster_state QUORATE), ballot opened, ballots SUPPORT/SUPPORT/OPPOSE, tally (quorum 100.00, consensus 83.33) then adopt; then one PLANNED campaign on that position, closed once."
          setup_api_calls:
            - call: "POST /advocacy/members"
              payload: { legal_name: "Alpha Steel Co", membership_tier: "PREMIER", home_jurisdiction_code: "FEDERAL", home_district_code: "CA-12", annual_dues_cents: 400000, dues_year: 2026, restricted_class_size: 25, engagement_score: 90 }
              as: AssociationAdmin
              as_user_id: "admin-1"
              captures: { m1_id: $.data.id }
            - call: "POST /advocacy/members"
              payload: { legal_name: "Beta Foundry Co", membership_tier: "FULL", home_jurisdiction_code: "FEDERAL", home_district_code: "CA-12", annual_dues_cents: 400000, dues_year: 2026, restricted_class_size: 25, engagement_score: 70 }
              as: AssociationAdmin
              as_user_id: "admin-1"
              captures: { m2_id: $.data.id }
            - call: "POST /advocacy/members"
