  - rule_id: compensating_invariant
    instances:
      - name: money_conservation_across_two_withdrawals
        grounds:
          - calculations.withdrawal_refund_settlement
          - calculations.entry_fee_assessment
          - entities.Show.fields.fee_collected_cents
          - entities.Show.fields.fee_retained_cents
          - entities.Entry.fields.net_fee_cents
          - state_machines.Entry.CONFIRMED_to_WITHDRAWN
        distinguishing_aspect: |
            The invariant is MONETARY and it must hold after two successive compensations, not just one:
            Show.fee_collected_cents must always equal the sum of every Entry.net_fee_cents, and
            fee_charged_cents must always equal fee_refunded_cents + fee_collected_cents. The second withdrawal
            is the trap: it drops the pre-refund balance below the MID tier, so the retention percentage changes
            between the two compensations (233 then 0) while the identity still has to close. Any implementation
            that decrements the ledger by a remembered figure, or that re-reads the tier from the post-refund
            balance, breaks one of the two sums.

        test_recipe:
          setup:
            - "Logical clock at 2026-08-10T09:00:00Z"
            - "APPROVED CONFORMATION show, one OPEN BREED class, three CONFIRMED entries of one handler"
            - "Dogs 1 and 2 are BITCHES, so both entries can declare season"
            - "Fees are 4663 / 3763 / 3387 (all PROVISIONAL), Show.fee_charged_cents == 11813, fee_collected_cents == 11813, fee_refunded_cents == 0, fee_retained_cents == 0"
