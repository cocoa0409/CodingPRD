          setup:
            - "Logical clock at 2026-08-01T08:00:00Z"
            - "Facility with compliance_posture OPEN and observation_bed_count 2"
            - "ACTIVE CARDIAC transfer agreement at capability_tier 3 accepting unstable patients, window 2026-07-01..2026-12-31"
