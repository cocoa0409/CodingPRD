  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      # ---- instance 1: depth >= 3 — order cancel cascade ----
      - name: order_cancel_depth3_cascade
        grounds:
          - state_machines.Order.CONFIRMED_to_CANCELLED
          - state_machines.PrintRun.QUEUED_to_CANCELLED
          - calculations.spool_conservation
          - calculations.wallet_ledger
        distinguishing_aspect: >
          Trigger order /cancel (CONFIRMED): A cancel Order -> B that VOIDs lines
          AND cancels QUEUED runs -> each cancelled run C releases spool
          grams_committed -> the released grams D restore spool.grams_remaining;
          each link caused by the prior, depth 4 from one trigger.
        test_recipe:
          setup:
            - "Funded customer; CONFIRMED order with line B; a QUEUED (not started) PrintRun committing 4g on a 30g spool (remaining 26)."
          setup_api_calls:
            - { call: "POST /bureaus", payload: { name: "Bureau T1" }, as: BureauAdmin, captures: { b: $.data.id } }
            - { call: "POST /bureaus/customers", payload: { bureau_id: "${b}", email: "t1@x.com", display_name: "T1" }, as: BureauAdmin, captures: { cust: $.data.id } }
            - { call: "POST /bureaus/customers/${cust}/deposit", payload: { amount_cents: 5000000 }, as: BureauAdmin }
            - { call: "POST /bureaus/materials", payload: { bureau_id: "${b}", process: "SLA", name: "Tough Resin", density_g_per_cm3: 1.10, material_rate_cents_per_cm3: 35, machine_rate_cents_per_min: 12, setup_fee_cents: 2500, min_wall_thickness_mm: 0.80, max_overhang_deg: 45 }, as: BureauAdmin, captures: { mat: $.data.id } }
            - { call: "POST /bureaus/machines", payload: { bureau_id: "${b}", process: "SLA", label: "Form-A", build_x_mm: 145, build_y_mm: 145, build_z_mm: 185 }, as: BureauAdmin, captures: { mach: $.data.id } }
            - { call: "POST /bureaus/spools", payload: { bureau_id: "${b}", material_id: "${mat}", grams_total: 30 }, as: BureauAdmin, captures: { spool: $.data.id } }
            - { call: "POST /bureaus/print-files", payload: { bureau_id: "${b}", customer_id: "${cust}", filename: "B.stl", volume_cm3: 4.00, bbox_x_mm: 20, bbox_y_mm: 20, bbox_z_mm: 20, min_wall_mm: 1.0, max_overhang_deg: 40, is_manifold: true }, as: Customer, as_user_id: "${cust}", captures: { fileB: $.data.id } }
            - { call: "POST /bureaus/print-files/${fileB}/check", payload: { material_id: "${mat}" }, as: QAReviewer }
            - { call: "POST /bureaus/orders", payload: { bureau_id: "${b}", customer_id: "${cust}", lead_tier: "STANDARD" }, as: Customer, as_user_id: "${cust}", captures: { ord: $.data.id } }
            - { call: "POST /bureaus/order-lines", payload: { order_id: "${ord}", print_file_id: "${fileB}", material_id: "${mat}", layer_height_mm: 0.10, quantity: 1 }, as: Customer, as_user_id: "${cust}", captures: { lineB: $.data.id } }
            - { call: "POST /bureaus/orders/${ord}/quote", payload: {}, as: Customer, as_user_id: "${cust}", captures: { ov: $.data.version } }
            - { call: "POST /bureaus/orders/${ord}/confirm", payload: { expected_order_version: "${ov}" }, as: Customer, as_user_id: "${cust}" }
            - { call: "POST /bureaus/print-runs", payload: { order_line_id: "${lineB}", machine_id: "${mach}", spool_id: "${spool}", start_min: 0, duration_min: 24 }, as: Operator, captures: { run1: $.data.id } }
          trigger:
            - { call: "POST /bureaus/orders/${ord}/cancel", payload: {}, as: Customer, as_user_id: "${cust}", captures: { fs: $.data.fulfillment_status, ps: $.data.payment_status } }
            - { call: "GET /bureaus/print-runs/${run1}", payload: {}, as: Operator, captures: { run_status: $.data.status } }
            - { call: "GET /bureaus/spools/${spool}", payload: {}, as: Operator, captures: { rem: $.data.grams_remaining, comm: $.data.grams_committed } }
            - { call: "GET /bureaus/order-lines/${lineB}", payload: {}, as: Customer, as_user_id: "${cust}", captures: { line_status: $.data.status } }
          assert:
            - "Order.${ord}.fulfillment_status == CANCELLED and payment_status == REFUNDED"
            - "PrintRun.${run1}.status == CANCELLED (cascade hop 2)"
            - "OrderLine.${lineB}.status == VOID (cascade hop 2)"
            - "Spool.${spool}.grams_committed == 0 and grams_remaining == 30 (cascade hops 3-4: grams released)"
            - "Customer.${cust}.wallet_balance_cents == 5000000 (escrow fully refunded)"

      # ---- instance 2: depth >= 2 — run complete bubbles order to READY ----
      - name: run_complete_bubbles_order_ready_cascade
        grounds:
          - state_machines.PrintRun.PRINTING_to_DONE
          - state_machines.Order.IN_PRODUCTION_to_READY
          - calculations.spool_conservation
        distinguishing_aspect: >
          Trigger run /complete: A complete run -> B spool grams move
          committed->consumed -> C order (no finishing tasks) bubbles
          IN_PRODUCTION->READY because all ACTIVE lines now have a DONE run;
          depth 3 from the complete trigger, distinct trigger from order /cancel.
        test_recipe:
          setup:
            - "Funded customer; confirmed order with single line B; run started (order IN_PRODUCTION); no finishing tasks attached."
          setup_api_calls:
            - { call: "POST /bureaus", payload: { name: "Bureau T2" }, as: BureauAdmin, captures: { b: $.data.id } }
            - { call: "POST /bureaus/customers", payload: { bureau_id: "${b}", email: "t2@x.com", display_name: "T2" }, as: BureauAdmin, captures: { cust: $.data.id } }
            - { call: "POST /bureaus/customers/${cust}/deposit", payload: { amount_cents: 5000000 }, as: BureauAdmin }
            - { call: "POST /bureaus/materials", payload: { bureau_id: "${b}", process: "SLA", name: "Tough Resin", density_g_per_cm3: 1.10, material_rate_cents_per_cm3: 35, machine_rate_cents_per_min: 12, setup_fee_cents: 2500, min_wall_thickness_mm: 0.80, max_overhang_deg: 45 }, as: BureauAdmin, captures: { mat: $.data.id } }
            - { call: "POST /bureaus/machines", payload: { bureau_id: "${b}", process: "SLA", label: "Form-A", build_x_mm: 145, build_y_mm: 145, build_z_mm: 185 }, as: BureauAdmin, captures: { mach: $.data.id } }
            - { call: "POST /bureaus/spools", payload: { bureau_id: "${b}", material_id: "${mat}", grams_total: 100 }, as: BureauAdmin, captures: { spool: $.data.id } }
            - { call: "POST /bureaus/print-files", payload: { bureau_id: "${b}", customer_id: "${cust}", filename: "B.stl", volume_cm3: 4.00, bbox_x_mm: 20, bbox_y_mm: 20, bbox_z_mm: 20, min_wall_mm: 1.0, max_overhang_deg: 40, is_manifold: true }, as: Customer, as_user_id: "${cust}", captures: { fileB: $.data.id } }
            - { call: "POST /bureaus/print-files/${fileB}/check", payload: { material_id: "${mat}" }, as: QAReviewer }
            - { call: "POST /bureaus/orders", payload: { bureau_id: "${b}", customer_id: "${cust}", lead_tier: "STANDARD" }, as: Customer, as_user_id: "${cust}", captures: { ord: $.data.id } }
            - { call: "POST /bureaus/order-lines", payload: { order_id: "${ord}", print_file_id: "${fileB}", material_id: "${mat}", layer_height_mm: 0.10, quantity: 1 }, as: Customer, as_user_id: "${cust}", captures: { lineB: $.data.id } }
            - { call: "POST /bureaus/orders/${ord}/quote", payload: {}, as: Customer, as_user_id: "${cust}", captures: { ov: $.data.version } }
            - { call: "POST /bureaus/orders/${ord}/confirm", payload: { expected_order_version: "${ov}" }, as: Customer, as_user_id: "${cust}" }
            - { call: "POST /bureaus/print-runs", payload: { order_line_id: "${lineB}", machine_id: "${mach}", spool_id: "${spool}", start_min: 0, duration_min: 24 }, as: Operator, captures: { run1: $.data.id } }
            - { call: "POST /bureaus/print-runs/${run1}/start", payload: {}, as: Operator }
          trigger:
            - { call: "POST /bureaus/print-runs/${run1}/complete", payload: {}, as: Operator }
            - { call: "GET /bureaus/spools/${spool}", payload: {}, as: Operator, captures: { consumed: $.data.grams_consumed, committed: $.data.grams_committed } }
            - { call: "GET /bureaus/orders/${ord}", payload: {}, as: Operator, captures: { fs: $.data.fulfillment_status } }
          assert:
            - "PrintRun.${run1}.status == DONE"
            - "Spool.${spool}.grams_committed == 0 and grams_consumed == 4 (hop 2: committed->consumed)"
            - "Order.${ord}.fulfillment_status == READY (hop 3: bubble-up, no finishing tasks)"

  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      # ---- instance 1: state (p6) vs business_fiscal (p13) — state wins ----
      - name: confirm_invalid_state_beats_insufficient_wallet
        grounds:
          - validations[priority=6]
          - validations[priority=13]
          - errors[ERR_INVALID_STATE]
          - errors[ERR_INSUFFICIENT_WALLET]
        distinguishing_aspect: >
          A DRAFT (not QUOTED) order with an under-funded customer fails BOTH the
          state precondition (confirm requires QUOTED) and the wallet check; the
          higher-priority state check (p6) wins -> ERR_INVALID_STATE, not
          ERR_INSUFFICIENT_WALLET (state vs business_fiscal pair).
        test_recipe:
          setup:
            - "Customer with wallet 0 (no deposit); DRAFT order with one ACTIVE line B (never quoted)."
          setup_api_calls:
            - { call: "POST /bureaus", payload: { name: "Bureau V1" }, as: BureauAdmin, captures: { b: $.data.id } }
            - { call: "POST /bureaus/customers", payload: { bureau_id: "${b}", email: "v1@x.com", display_name: "V1" }, as: BureauAdmin, captures: { cust: $.data.id } }
            - { call: "POST /bureaus/materials", payload: { bureau_id: "${b}", process: "SLA", name: "Tough Resin", density_g_per_cm3: 1.10, material_rate_cents_per_cm3: 35, machine_rate_cents_per_min: 12, setup_fee_cents: 2500, min_wall_thickness_mm: 0.80, max_overhang_deg: 45 }, as: BureauAdmin, captures: { mat: $.data.id } }
            - { call: "POST /bureaus/machines", payload: { bureau_id: "${b}", process: "SLA", label: "Form-A", build_x_mm: 145, build_y_mm: 145, build_z_mm: 185 }, as: BureauAdmin }
            - { call: "POST /bureaus/print-files", payload: { bureau_id: "${b}", customer_id: "${cust}", filename: "B.stl", volume_cm3: 4.00, bbox_x_mm: 20, bbox_y_mm: 20, bbox_z_mm: 20, min_wall_mm: 1.0, max_overhang_deg: 40, is_manifold: true }, as: Customer, as_user_id: "${cust}", captures: { fileB: $.data.id } }
            - { call: "POST /bureaus/print-files/${fileB}/check", payload: { material_id: "${mat}" }, as: QAReviewer }
            - { call: "POST /bureaus/orders", payload: { bureau_id: "${b}", customer_id: "${cust}", lead_tier: "STANDARD" }, as: Customer, as_user_id: "${cust}", captures: { ord: $.data.id } }
            - { call: "POST /bureaus/order-lines", payload: { order_id: "${ord}", print_file_id: "${fileB}", material_id: "${mat}", layer_height_mm: 0.10, quantity: 1 }, as: Customer, as_user_id: "${cust}", captures: { lineB: $.data.id, ov: $.data.version } }
          trigger:
            - { call: "POST /bureaus/orders/${ord}/confirm", payload: { expected_order_version: "${ov}" }, as: Customer, as_user_id: "${cust}", captures: { err: $.data.error_id } }
          assert:
            - "Response status 409 and data.error_id == ERR_INVALID_STATE (state p6 beats fiscal p13)"

      # ---- instance 2: business_safety (p7) vs business_fiscal (p13) — safety wins ----
      - name: quote_file_not_printable_beats_wallet
        grounds:
          - validations[priority=7]
          - validations[priority=13]
          - errors[ERR_FILE_NOT_PRINTABLE]
          - errors[ERR_INSUFFICIENT_WALLET]
        distinguishing_aspect: >
          Quoting an order whose only line uses a non-PRINTABLE (UPLOADED) file,
          for a zero-wallet customer: the safety gate (p7, ERR_FILE_NOT_PRINTABLE)
          fires before any fiscal consideration — business_safety vs
          business_fiscal pair (different from the state-vs-fiscal instance).
        test_recipe:
          setup:
            - "Customer wallet 0; DRAFT order with one ACTIVE line whose file is UPLOADED (never checked, so not PRINTABLE)."
          setup_api_calls:
            - { call: "POST /bureaus", payload: { name: "Bureau V2" }, as: BureauAdmin, captures: { b: $.data.id } }
            - { call: "POST /bureaus/customers", payload: { bureau_id: "${b}", email: "v2@x.com", display_name: "V2" }, as: BureauAdmin, captures: { cust: $.data.id } }
            - { call: "POST /bureaus/materials", payload: { bureau_id: "${b}", process: "SLA", name: "Tough Resin", density_g_per_cm3: 1.10, material_rate_cents_per_cm3: 35, machine_rate_cents_per_min: 12, setup_fee_cents: 2500, min_wall_thickness_mm: 0.80, max_overhang_deg: 45 }, as: BureauAdmin, captures: { mat: $.data.id } }
            - { call: "POST /bureaus/print-files", payload: { bureau_id: "${b}", customer_id: "${cust}", filename: "B.stl", volume_cm3: 4.00, bbox_x_mm: 20, bbox_y_mm: 20, bbox_z_mm: 20, min_wall_mm: 1.0, max_overhang_deg: 40, is_manifold: true }, as: Customer, as_user_id: "${cust}", captures: { fileB: $.data.id } }
            - { call: "POST /bureaus/orders", payload: { bureau_id: "${b}", customer_id: "${cust}", lead_tier: "STANDARD" }, as: Customer, as_user_id: "${cust}", captures: { ord: $.data.id } }
            - { call: "POST /bureaus/order-lines", payload: { order_id: "${ord}", print_file_id: "${fileB}", material_id: "${mat}", layer_height_mm: 0.10, quantity: 1 }, as: Customer, as_user_id: "${cust}", captures: { lineB: $.data.id } }
          trigger:
            - { call: "POST /bureaus/orders/${ord}/quote", payload: {}, as: Customer, as_user_id: "${cust}", captures: { err: $.data.error_id } }
          assert:
            - "Response status 409 and data.error_id == ERR_FILE_NOT_PRINTABLE (safety p7 beats fiscal p13)"

  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:
      # ---- instance 1: machine capacity '>' boundary (== allowed) ----
      - name: machine_capacity_exact_boundary
        grounds:
          - validations[priority=11]
          - calculations.machine_utilization
          - errors[ERR_MACHINE_CAPACITY_EXCEEDED]
          - entities.Machine.fields.scheduled_minutes
        distinguishing_aspect: >
          Machine with 460 scheduled minutes: a 20-min run lands exactly at the
          480 shift cap (460+20==480 ACCEPTED, util 100), while a 21-min run
          (460+21==481 > 480 REJECTED) — strict '>' boundary on the
          scheduled-minutes metric, via POST /bureaus/print-runs.
        test_recipe:
          setup:
            - "Bureau shift_capacity 480; funded customer; confirmed order with line A (qty 3) for grams; one QUEUED run of 460 min already on machine M."
          setup_api_calls:
            - { call: "POST /bureaus", payload: { name: "Bureau B1", shift_capacity_minutes: 480 }, as: BureauAdmin, captures: { b: $.data.id } }
            - { call: "POST /bureaus/customers", payload: { bureau_id: "${b}", email: "bb1@x.com", display_name: "BB1" }, as: BureauAdmin, captures: { cust: $.data.id } }
            - { call: "POST /bureaus/customers/${cust}/deposit", payload: { amount_cents: 5000000 }, as: BureauAdmin }
            - { call: "POST /bureaus/materials", payload: { bureau_id: "${b}", process: "SLA", name: "Tough Resin", density_g_per_cm3: 1.10, material_rate_cents_per_cm3: 35, machine_rate_cents_per_min: 12, setup_fee_cents: 2500, min_wall_thickness_mm: 0.80, max_overhang_deg: 45 }, as: BureauAdmin, captures: { mat: $.data.id } }
            - { call: "POST /bureaus/machines", payload: { bureau_id: "${b}", process: "SLA", label: "Form-A", build_x_mm: 145, build_y_mm: 145, build_z_mm: 185 }, as: BureauAdmin, captures: { mach: $.data.id } }
            - { call: "POST /bureaus/spools", payload: { bureau_id: "${b}", material_id: "${mat}", grams_total: 1000 }, as: BureauAdmin, captures: { spool: $.data.id } }
            - { call: "POST /bureaus/print-files", payload: { bureau_id: "${b}", customer_id: "${cust}", filename: "A.stl", volume_cm3: 8.40, bbox_x_mm: 50, bbox_y_mm: 50, bbox_z_mm: 60, min_wall_mm: 1.0, max_overhang_deg: 40, is_manifold: true }, as: Customer, as_user_id: "${cust}", captures: { fileA: $.data.id } }
            - { call: "POST /bureaus/print-files/${fileA}/check", payload: { material_id: "${mat}" }, as: QAReviewer }
            - { call: "POST /bureaus/orders", payload: { bureau_id: "${b}", customer_id: "${cust}", lead_tier: "STANDARD" }, as: Customer, as_user_id: "${cust}", captures: { ord: $.data.id } }
            - { call: "POST /bureaus/order-lines", payload: { order_id: "${ord}", print_file_id: "${fileA}", material_id: "${mat}", layer_height_mm: 0.05, quantity: 3 }, as: Customer, as_user_id: "${cust}", captures: { lineA: $.data.id } }
            - { call: "POST /bureaus/orders/${ord}/quote", payload: {}, as: Customer, as_user_id: "${cust}", captures: { ov: $.data.version } }
            - { call: "POST /bureaus/orders/${ord}/confirm", payload: { expected_order_version: "${ov}" }, as: Customer, as_user_id: "${cust}" }
            - { call: "POST /bureaus/print-runs", payload: { order_line_id: "${lineA}", machine_id: "${mach}", spool_id: "${spool}", start_min: 0, duration_min: 460 }, as: Operator, captures: { runBig: $.data.id } }
          trigger:
            - { call: "POST /bureaus/print-runs", payload: { order_line_id: "${lineA}", machine_id: "${mach}", spool_id: "${spool}", start_min: 460, duration_min: 20 }, as: Operator, captures: { run_ok: $.data.id, status_ok: $.data.status } }
            - { call: "GET /bureaus/machines/${mach}", payload: {}, as: Operator, captures: { util_at_cap: $.data.utilization_pct } }
            - { call: "POST /bureaus/print-runs", payload: { order_line_id: "${lineA}", machine_id: "${mach}", spool_id: "${spool}", start_min: 480, duration_min: 21 }, as: Operator, captures: { err: $.data.error_id } }
          assert:
            - "The 460+20==480 run is created (status QUEUED); Machine.${mach}.utilization_pct == 100"
            - "The 460+21==481 run is rejected: status 409, data.error_id == ERR_MACHINE_CAPACITY_EXCEEDED"

      # ---- instance 2: empty-set boundary — quote on order with zero ACTIVE lines ----
      - name: quote_empty_order_zero_active_lines
        grounds:
          - validations[priority=7]
          - errors[ERR_ORDER_EMPTY]
          - state_machines.Order.DRAFT_to_QUOTED
        distinguishing_aspect: >
          Quoting a DRAFT order that has zero ACTIVE OrderLines (empty collection,
          not a numeric threshold) returns ERR_ORDER_EMPTY — a count==0
          boundary on a distinct metric (line cardinality) via POST
          /bureaus/orders/{id}/quote, distinct from the capacity numeric boundary.
        test_recipe:
          setup:
            - "Bureau, Customer; a DRAFT order created with no order-lines attached."
          setup_api_calls:
            - { call: "POST /bureaus", payload: { name: "Bureau B2" }, as: BureauAdmin, captures: { b: $.data.id } }
            - { call: "POST /bureaus/customers", payload: { bureau_id: "${b}", email: "bb2@x.com", display_name: "BB2" }, as: BureauAdmin, captures: { cust: $.data.id } }
            - { call: "POST /bureaus/orders", payload: { bureau_id: "${b}", customer_id: "${cust}", lead_tier: "STANDARD" }, as: Customer, as_user_id: "${cust}", captures: { ord: $.data.id } }
          trigger:
            - { call: "POST /bureaus/orders/${ord}/quote", payload: {}, as: Customer, as_user_id: "${cust}", captures: { err: $.data.error_id } }
          assert:
            - "Response status 409 and data.error_id == ERR_ORDER_EMPTY (zero ACTIVE lines)"

  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      # ---- instance 1: PrintRun /start depends on owning Order.payment_status ----
      - name: run_start_requires_order_escrowed
        grounds:
          - state_machines.PrintRun.QUEUED_to_PRINTING
          - entities.Order.fields.payment_status
          - errors[ERR_ORDER_NOT_ESCROWED]
        distinguishing_aspect: >
          PrintRun QUEUED->PRINTING is gated by the OWNING ORDER's payment_status
          (must be ESCROWED): starting a run whose order is still QUOTED/UNPAID
          fails ERR_ORDER_NOT_ESCROWED — PrintRun depends on Order state
          (PrintRun<->Order pair).
        test_recipe:
          setup:
            - "Funded customer; order with line B QUOTED but NOT confirmed (payment_status UNPAID); a QUEUED PrintRun created for line B."
          setup_api_calls:
            - { call: "POST /bureaus", payload: { name: "Bureau X1" }, as: BureauAdmin, captures: { b: $.data.id } }
            - { call: "POST /bureaus/customers", payload: { bureau_id: "${b}", email: "x1@x.com", display_name: "X1" }, as: BureauAdmin, captures: { cust: $.data.id } }
