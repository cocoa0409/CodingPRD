# =============================================================================
# Boutique Fitness Class Pass (ClassPass-style) — SCAFFOLD (§1.0–§1.7)
# Expert tier.
# =============================================================================

scenario: |
  Boutique Fitness Class Pass (ClassPass style): class schedule & capacity,
  credit/membership packages, reservation & waitlist auto-promote,
  late-cancel/no-show fee, instructor/room resource, intro offer,
  freeze/rollover, multi-studio network

domain_name: boutique-fitness-class-pass
api_prefix: /

# =============================================================================
# §0 Complexity Profile
# =============================================================================
complexity_profile:
  primary_archetype: quota_allocation
  secondary_archetype: temporal_windowing
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
    - scheduled_deferred_actions
    - selector_policy

  entity_topology: graph
  # ClassSession references Studio, Room, Instructor, ClassTemplate (many FK fan-in);
  # Reservation references Member, ClassSession, Membership. Peer entities linked by FK,
  # not a strict nesting tree.

  state_machine_shape: parallel
  # Reservation carries two independent dimensions (booking_status × attendance_status);
  # ClassSession has a cyclic OPEN<->FULL loop driven by waitlist promotion;
  # Membership has a freeze cycle ACTIVE<->FROZEN.

  relationship_patterns:
    - one_to_many        # Studio -> Room; ClassSession -> Reservation; Membership -> WalletEntry
    - many_to_many       # Member <-> ClassSession via Reservation
    - cross_aggregate    # Reservation depends on Membership (credit) and ClassSession (capacity)

  role_model: peer_roles
  # Member acts on own reservations/memberships; StudioManager owns schedule and
  # resources for a studio; NetworkAdmin owns network-wide config and ops runs.

  consistency_model: immediate
  # All cascades (debit/credit, waitlist promotion, capacity counters, fee posting)
  # resolve atomically inside the triggering request.

# =============================================================================
# §1.0 Response Envelope (FIXED — EMIT VERBATIM)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:

  # --- Configuration / network ------------------------------------------------
  - name: Studio
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Studio display name" }
      - { name: state_code, type: string, source: input, description: "US state code where the studio operates, e.g. CA" }
      - { name: timezone, type: string, source: input, description: "IANA timezone, e.g. America/Los_Angeles", default: "UTC" }
      - { name: status, type: enum, source: computed, description: "OPEN | CLOSED — CLOSED studios reject new session creation", default: "OPEN", constraints: "values: OPEN, CLOSED" }
      - { name: active_room_count, type: integer, source: computed, description: "Count of Rooms with status==ACTIVE under this studio" }

  - name: Room
    parent: Studio
    common_fields: true
    fields:
      - { name: studio_id, type: string, source: input, description: "FK -> Studio.id" }
      - { name: name, type: string, source: input, description: "Room display name" }
      - { name: physical_capacity, type: integer, source: input, description: "Max headcount the room can physically hold", constraints: "integer >= 1" }
      - { name: status, type: enum, source: computed, description: "ACTIVE | RETIRED — RETIRED rooms cannot host new sessions", default: "ACTIVE", constraints: "values: ACTIVE, RETIRED" }

  - name: Instructor
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Instructor name" }
      - { name: home_studio_id, type: string, source: input, description: "FK -> Studio.id; studio the instructor is primarily based at" }
      - { name: status, type: enum, source: computed, description: "ACTIVE | INACTIVE — INACTIVE instructors cannot be assigned to new sessions", default: "ACTIVE", constraints: "values: ACTIVE, INACTIVE" }

  - name: ClassTemplate
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Class type name, e.g. Vinyasa Flow" }
      - { name: duration_min, type: integer, source: input, description: "Session length in minutes", constraints: "integer in [15,240]" }
      - { name: credit_cost, type: integer, source: input, description: "Credits charged to reserve one seat in a session of this template", constraints: "integer >= 1" }
      - { name: late_cancel_window_hours, type: integer, source: input, description: "Hours before session start inside which a cancel counts as late-cancel", default: 12, constraints: "integer >= 0" }
      - { name: status, type: enum, source: computed, description: "ACTIVE | ARCHIVED — ARCHIVED templates cannot back new sessions", default: "ACTIVE", constraints: "values: ACTIVE, ARCHIVED" }

  # --- Packages / membership --------------------------------------------------
  - name: PackagePlan
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Plan display name" }
      - { name: kind, type: enum, source: input, description: "INTRO | CREDIT_PACK | MEMBERSHIP", constraints: "values: INTRO, CREDIT_PACK, MEMBERSHIP" }
      - { name: price_cents, type: integer, source: input, description: "Purchase price in cents", constraints: "integer >= 0" }
      - { name: grant_credits, type: integer, source: input, description: "Credits granted on purchase (INTRO/CREDIT_PACK) or per cycle (MEMBERSHIP)", constraints: "integer >= 1" }
      - { name: validity_days, type: integer, source: input, description: "Days from activation until credits expire (INTRO/CREDIT_PACK) or one billing cycle length (MEMBERSHIP)", constraints: "integer >= 1" }
      - { name: rollover_cap, type: integer, source: input, description: "MEMBERSHIP only: max unused credits carried into the next cycle; 0 = no rollover; ignored for INTRO/CREDIT_PACK", default: 0, constraints: "integer >= 0" }
      - { name: freeze_max_days, type: integer, source: input, description: "MEMBERSHIP only: cumulative days a membership may be frozen per cycle; ignored otherwise", default: 0, constraints: "integer >= 0" }
      - { name: intro_once_per_member, type: boolean, source: input, description: "INTRO only: if true, a member may purchase at most one INTRO plan ever", default: true }
      - { name: status, type: enum, source: computed, description: "ACTIVE | RETIRED — RETIRED plans cannot be purchased", default: "ACTIVE", constraints: "values: ACTIVE, RETIRED" }

  - name: Member
    parent: null
    common_fields: true
    fields:
      - { name: email, type: string, source: input, description: "Unique member email (case-insensitive)" }
      - { name: full_name, type: string, source: input, description: "Member name" }
      - { name: home_studio_id, type: string, source: input, description: "FK -> Studio.id; member's home studio in the network" }
      - { name: has_used_intro, type: boolean, source: computed, description: "True once the member has ever purchased an INTRO plan", default: false }
      - { name: no_show_strikes, type: integer, source: computed, description: "Rolling count of NO_SHOW + LATE_CANCEL events in the trailing STRIKE_WINDOW_DAYS; gates booking when over threshold", default: 0 }
      - { name: standing, type: enum, source: computed, description: "GOOD | RESTRICTED — RESTRICTED when no_show_strikes >= NO_SHOW_BLOCK_THRESHOLD; RESTRICTED members cannot create reservations", default: "GOOD", constraints: "values: GOOD, RESTRICTED" }

  - name: Membership
    parent: null
    common_fields: true
    fields:
      - { name: member_id, type: string, source: input, description: "FK -> Member.id; owning member" }
      - { name: plan_id, type: string, source: input, description: "FK -> PackagePlan.id; the purchased plan" }
      - { name: status, type: enum, source: computed, description: "PENDING_PAYMENT | ACTIVE | FROZEN | EXPIRED | CANCELLED", default: "PENDING_PAYMENT", constraints: "values: PENDING_PAYMENT, ACTIVE, FROZEN, EXPIRED, CANCELLED" }
      - { name: credit_balance, type: integer, source: computed, description: "Current spendable credits; sum of WalletEntry.delta for this membership", default: 0 }
      - { name: activated_at, type: datetime, source: computed, description: "Timestamp membership became ACTIVE (payment captured)" }
      - { name: cycle_start, type: datetime, source: computed, description: "Start of the current billing/validity cycle" }
      - { name: expires_at, type: datetime, source: computed, description: "End of current cycle = cycle_start + plan.validity_days; credits expire at this instant" }
      - { name: frozen_at, type: datetime, source: computed, description: "Timestamp the current freeze began; null when not FROZEN" }
      - { name: freeze_days_used, type: integer, source: computed, description: "Cumulative freeze days consumed in the current cycle (MEMBERSHIP)", default: 0 }
      - { name: rolled_over_credits, type: integer, source: computed, description: "Credits carried from the previous cycle into the current one on the most recent renewal", default: 0 }
      - { name: refund_cents, type: integer, source: computed, description: "Cents refunded on cancellation; 0 until cancelled", default: 0 }

  - name: WalletEntry
    parent: Membership
    common_fields: false
    fields:
      - { name: membership_id, type: string, source: input, description: "FK -> Membership.id; the wallet this entry belongs to" }
      - { name: reservation_id, type: string, source: input, description: "FK -> Reservation.id; set when the entry is a reservation debit or its refund; null for grants/expiries" }
      - { name: kind, type: enum, source: system, description: "GRANT | RESERVE_DEBIT | CANCEL_REFUND | EXPIRY_FORFEIT | ROLLOVER_FORFEIT", constraints: "values: GRANT, RESERVE_DEBIT, CANCEL_REFUND, EXPIRY_FORFEIT, ROLLOVER_FORFEIT" }
      - { name: delta, type: integer, source: system, description: "Signed credit change applied to credit_balance (positive grant/refund, negative debit/forfeit)" }
      - { name: note, type: string, source: system, description: "Human-readable reason for this ledger movement" }

  # --- Schedule / reservations ------------------------------------------------
  - name: ClassSession
    parent: null
    common_fields: true
    fields:
      - { name: studio_id, type: string, source: input, description: "FK -> Studio.id; studio hosting the session" }
      - { name: room_id, type: string, source: input, description: "FK -> Room.id; room hosting the session" }
      - { name: instructor_id, type: string, source: input, description: "FK -> Instructor.id; assigned instructor" }
      - { name: template_id, type: string, source: input, description: "FK -> ClassTemplate.id; class type" }
      - { name: starts_at, type: datetime, source: input, description: "Session start (ISO 8601 UTC)" }
      - { name: ends_at, type: datetime, source: computed, description: "starts_at + template.duration_min minutes" }
      - { name: seat_capacity, type: integer, source: input, description: "Bookable seats; MUST be <= room.physical_capacity at creation", constraints: "integer >= 1" }
      - { name: waitlist_capacity, type: integer, source: input, description: "Max number of WAITLISTED reservations held on the session at any one time", default: 5, constraints: "integer >= 0" }
      - { name: status, type: enum, source: computed, description: "SCHEDULED | OPEN | FULL | CANCELLED | COMPLETED — see §1.2", default: "SCHEDULED", constraints: "values: SCHEDULED, OPEN, FULL, CANCELLED, COMPLETED" }
      - { name: booked_count, type: integer, source: computed, description: "Count of Reservation rows on this session with booking_status==BOOKED", default: 0 }
      - { name: waitlisted_count, type: integer, source: computed, description: "Count of Reservation rows on this session with booking_status==WAITLISTED", default: 0 }

  - name: Reservation
    parent: ClassSession
    common_fields: true
    fields:
      - { name: session_id, type: string, source: input, description: "FK -> ClassSession.id; reserved session" }
      - { name: member_id, type: string, source: input, description: "FK -> Member.id; member who booked" }
      - { name: membership_id, type: string, source: input, description: "FK -> Membership.id; wallet that credits were debited from / refunded to" }
      - { name: booking_status, type: enum, source: computed, description: "Dimension 1: WAITLISTED | BOOKED | RELEASED — seat-holding lifecycle", default: "WAITLISTED", constraints: "values: WAITLISTED, BOOKED, RELEASED" }
      - { name: attendance_status, type: enum, source: computed, description: "Dimension 2: PENDING | CHECKED_IN | NO_SHOW | CANCELLED | LATE_CANCELLED — attendance outcome, evolves independently of booking_status", default: "PENDING", constraints: "values: PENDING, CHECKED_IN, NO_SHOW, CANCELLED, LATE_CANCELLED" }
      - { name: credits_charged, type: integer, source: computed, description: "Credits debited when this reservation took a seat (BOOKED); 0 while WAITLISTED", default: 0 }
      - { name: waitlist_position, type: integer, source: computed, description: "1-based position among WAITLISTED reservations on the session, ordered by created_at ASC; 0 when not waitlisted", default: 0 }
      - { name: late_fee_cents, type: integer, source: computed, description: "Cents charged for a late-cancel or no-show on this reservation; 0 otherwise", default: 0 }
      - { name: promoted_at, type: datetime, source: computed, description: "Timestamp a WAITLISTED reservation was auto-promoted to BOOKED; null if never promoted" }

  - name: FeeCharge
    parent: Member
    common_fields: true
    fields:
      - { name: member_id, type: string, source: input, description: "FK -> Member.id; member charged" }
      - { name: reservation_id, type: string, source: input, description: "FK -> Reservation.id; reservation that triggered the fee" }
      - { name: kind, type: enum, source: system, description: "LATE_CANCEL | NO_SHOW", constraints: "values: LATE_CANCEL, NO_SHOW" }
      - { name: amount_cents, type: integer, source: computed, description: "Fee amount in cents (see §1.3 late_fee_assessment)" }
      - { name: status, type: enum, source: computed, description: "ASSESSED | WAIVED — WAIVED zeroes the member's liability", default: "ASSESSED", constraints: "values: ASSESSED, WAIVED" }
      - { name: credit_refunded, type: boolean, source: computed, description: "True when the seat credit was refunded as part of the cancel that produced this fee", default: false }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:

  # --- Membership: freeze cycle (cyclic ACTIVE<->FROZEN) ----------------------
  - entity: Membership
    initial_state: PENDING_PAYMENT
    terminal_states: [EXPIRED, CANCELLED]
    transitions:
      - from: PENDING_PAYMENT
        to: ACTIVE
        trigger: "POST /_payments/capture"
        actor: NetworkAdmin
        preconditions:
          - "membership.status == PENDING_PAYMENT"
          - "payment outcome == CAPTURED"
        side_effects:
          - "set activated_at = current clock; cycle_start = current clock; expires_at = cycle_start + plan.validity_days days"
          - "append WalletEntry{kind:GRANT, delta:+plan.grant_credits, membership_id:self.id}; recompute credit_balance"
          - "set Member.has_used_intro = true when plan.kind == INTRO"
      - from: ACTIVE
        to: FROZEN
        trigger: "POST /memberships/{id}/freeze"
        actor: Member
        preconditions:
          - "membership.status == ACTIVE"
          - "plan.kind == MEMBERSHIP"
          - "plan.freeze_max_days > 0"
          - "freeze_days_used < plan.freeze_max_days"
        side_effects:
          - "set frozen_at = current clock"
          - "expires_at is NOT advanced at freeze time; it is advanced on unfreeze (see ACTIVE transition)"
      - from: FROZEN
        to: ACTIVE
        trigger: "POST /memberships/{id}/unfreeze"
        actor: Member
        preconditions:
          - "membership.status == FROZEN"
        side_effects:
          - "frozen_span_days = ceil((current clock - frozen_at) / 1 day); capped so freeze_days_used + frozen_span_days <= plan.freeze_max_days"
          - "freeze_days_used += frozen_span_days (capped)"
          - "expires_at += frozen_span_days days (membership cycle extended by the frozen span)"
          - "set frozen_at = null"
        note: "Cyclic: a membership may freeze/unfreeze repeatedly within one cycle until freeze_days_used reaches plan.freeze_max_days."
      - from: ACTIVE
        to: ACTIVE
        trigger: "POST /memberships/{id}/renew (MEMBERSHIP only) at or after expires_at via ops/clock"
        actor: NetworkAdmin
        preconditions:
          - "membership.status == ACTIVE"
          - "plan.kind == MEMBERSHIP"
          - "current clock >= expires_at"
        side_effects:
          - "rolled_over_credits = min(credit_balance, plan.rollover_cap) (see §1.3 rollover_carry)"
          - "forfeited = credit_balance - rolled_over_credits; append WalletEntry{kind:ROLLOVER_FORFEIT, delta:-forfeited} when forfeited > 0"
          - "append WalletEntry{kind:GRANT, delta:+plan.grant_credits} (note records rolled_over_credits carried in)"
          - "cycle_start = expires_at; expires_at = cycle_start + plan.validity_days; freeze_days_used = 0"
          - "recompute credit_balance = rolled_over_credits + plan.grant_credits (= old_balance - forfeited + grant_credits)"
        note: "Self-loop renewal resets the cycle and applies rollover. credit_balance after renew = rolled_over_credits + plan.grant_credits."
      - from: ACTIVE
        to: EXPIRED
        trigger: "POST /_ops/run_expiry"
        actor: NetworkAdmin
        preconditions:
          - "membership.status == ACTIVE"
          - "current clock >= expires_at"
          - "plan.kind != MEMBERSHIP (INTRO/CREDIT_PACK do not auto-renew)"
        side_effects:
          - "forfeited = credit_balance; append WalletEntry{kind:EXPIRY_FORFEIT, delta:-forfeited} when forfeited > 0"
          - "recompute credit_balance = 0"
      - from: FROZEN
        to: EXPIRED
        trigger: "POST /_ops/run_expiry"
        actor: NetworkAdmin
        preconditions:
          - "membership.status == FROZEN"
          - "current clock >= expires_at"
        note: "A membership frozen past its (frozen-extended) expiry still expires; forfeits remaining credits as in ACTIVE->EXPIRED."
        side_effects:
          - "forfeited = credit_balance; append WalletEntry{kind:EXPIRY_FORFEIT, delta:-forfeited} when forfeited > 0; recompute credit_balance = 0"
      - from: ACTIVE
        to: CANCELLED
        trigger: "POST /memberships/{id}/cancel"
        actor: Member
        preconditions:
          - "membership.status == ACTIVE"
        side_effects:
          - "compute refund_cents per §1.3 cancellation_refund (prorated, dual-variant)"
          - "forfeited = credit_balance; append WalletEntry{kind:EXPIRY_FORFEIT, delta:-forfeited} when forfeited > 0; recompute credit_balance = 0"
      - from: FROZEN
        to: CANCELLED
        trigger: "POST /memberships/{id}/cancel"
        actor: Member
        preconditions:
          - "membership.status == FROZEN"
        side_effects:
          - "compute refund_cents per §1.3 cancellation_refund"
          - "forfeited = credit_balance; append WalletEntry{kind:EXPIRY_FORFEIT, delta:-forfeited} when forfeited > 0; recompute credit_balance = 0"

  # --- ClassSession: cyclic OPEN<->FULL via waitlist promotion ----------------
  - entity: ClassSession
    initial_state: SCHEDULED
    terminal_states: [CANCELLED, COMPLETED]
    transitions:
      - from: SCHEDULED
        to: OPEN
        trigger: "POST /sessions/{id}/publish"
        actor: StudioManager
        preconditions:
          - "session.status == SCHEDULED"
          - "room.status == ACTIVE"
          - "instructor.status == ACTIVE"
          - "studio.status == OPEN"
        side_effects:
          - "session becomes bookable; booked_count and waitlisted_count remain 0"
      - from: OPEN
        to: FULL
        trigger: "system: a reservation is booked that makes booked_count == seat_capacity (POST /sessions/{id}/reservations or waitlist promotion)"
        actor: system
        preconditions:
          - "session.status == OPEN"
          - "booked_count would reach seat_capacity"
        side_effects:
          - "subsequent reservation attempts go to the waitlist while waitlisted_count < waitlist_capacity"
      - from: FULL
        to: OPEN
        trigger: "system: a BOOKED reservation is released (cancel/late-cancel) and after promotion booked_count < seat_capacity"
        actor: system
        preconditions:
          - "session.status == FULL"
        side_effects:
          - "AUTO-PROMOTE: the WAITLISTED reservation with the lowest waitlist_position (created_at ASC) is promoted to BOOKED before re-evaluating capacity — see §1.3 waitlist_promotion"
          - "if after promotion booked_count < seat_capacity, session returns to OPEN; if still == seat_capacity it stays FULL"
      - from: OPEN
        to: CANCELLED
        trigger: "POST /sessions/{id}/cancel"
        actor: StudioManager
        preconditions:
          - "session.status IN {SCHEDULED, OPEN, FULL}"
        side_effects:
          - "CASCADE: every Reservation with booking_status IN {BOOKED, WAITLISTED} is released — booking_status=RELEASED, attendance_status=CANCELLED"
          - "for each released BOOKED reservation, refund credits_charged (WalletEntry{kind:CANCEL_REFUND, delta:+credits_charged}); NO late fee regardless of timing (studio-initiated)"
          - "recompute booked_count=0, waitlisted_count=0"
      - from: FULL
        to: CANCELLED
        trigger: "POST /sessions/{id}/cancel"
        actor: StudioManager
        preconditions:
          - "session.status IN {SCHEDULED, OPEN, FULL}"
        side_effects:
          - "same cascade as OPEN->CANCELLED"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /sessions/{id}/cancel"
        actor: StudioManager
        preconditions:
          - "session.status IN {SCHEDULED, OPEN, FULL}"
        side_effects:
          - "no reservations exist yet; just mark CANCELLED"
      - from: OPEN
        to: COMPLETED
        trigger: "POST /_ops/run_completion"
        actor: NetworkAdmin
        preconditions:
          - "session.status IN {OPEN, FULL}"
          - "current clock >= session.ends_at"
        side_effects:
          - "CASCADE: every Reservation still booking_status==BOOKED and attendance_status==PENDING is marked attendance_status=NO_SHOW"
          - "for each new NO_SHOW: assess fee per §1.3 late_fee_assessment (FeeCharge{kind:NO_SHOW}); seat credit is NOT refunded; increment Member.no_show_strikes; recompute Member.standing"
          - "WAITLISTED reservations still pending are released (booking_status=RELEASED, attendance_status=CANCELLED, no fee)"
      - from: FULL
        to: COMPLETED
        trigger: "POST /_ops/run_completion"
        actor: NetworkAdmin
        preconditions:
          - "session.status IN {OPEN, FULL}"
          - "current clock >= session.ends_at"
        side_effects:
          - "same cascade as OPEN->COMPLETED"

  # --- Reservation: parallel dimensions (booking_status × attendance_status) --
  - entity: Reservation
    initial_state: WAITLISTED
    terminal_states: [RELEASED]
    note: |
      Two independent dimensions. booking_status ∈ {WAITLISTED, BOOKED, RELEASED}
      (seat-holding). attendance_status ∈ {PENDING, CHECKED_IN, NO_SHOW, CANCELLED,
      LATE_CANCELLED} (outcome). A reservation can be BOOKED while attendance is
      PENDING or CHECKED_IN; it becomes RELEASED only via cancel/late-cancel/session
      cancel/no-show. The terminal_states list refers to booking_status.
    transitions:
      - from: WAITLISTED
        to: BOOKED
        trigger: "POST /sessions/{id}/reservations when session.status==OPEN and booked_count < seat_capacity"
        actor: Member
        preconditions:
          - "reservation just created AND session has a free seat at creation time"
          - "Member.standing == GOOD"
          - "membership.status == ACTIVE"
          - "membership.credit_balance >= template.credit_cost"
        side_effects:
          - "debit template.credit_cost from membership (WalletEntry{kind:RESERVE_DEBIT, delta:-credit_cost}); set credits_charged=credit_cost"
          - "booked_count += 1; if booked_count == seat_capacity session -> FULL"
        note: "On a session with a free seat, a new reservation is created already BOOKED (skips WAITLISTED)."
      - from: WAITLISTED
        to: BOOKED
        trigger: "system: auto-promotion when a seat frees on a FULL session"
        actor: system
        preconditions:
          - "this reservation has the lowest waitlist_position among WAITLISTED on the session"
          - "membership.status == ACTIVE"
          - "membership.credit_balance >= template.credit_cost"
        side_effects:
          - "debit template.credit_cost (WalletEntry{kind:RESERVE_DEBIT}); set credits_charged=credit_cost; set promoted_at=current clock"
          - "booked_count += 1; recompute waitlist_position of remaining WAITLISTED reservations"
        note: "If the head-of-line member has insufficient credit or inactive membership, that reservation is RELEASED (booking_status=RELEASED, attendance_status=CANCELLED) and promotion proceeds to the next in line — see §1.3 waitlist_promotion."
      - from: WAITLISTED
        to: RELEASED
        trigger: "POST /reservations/{id}/cancel"
        actor: Member
        preconditions:
          - "reservation.booking_status == WAITLISTED"
        side_effects:
          - "attendance_status=CANCELLED; waitlisted_count -= 1; recompute waitlist_position of those behind; NO credit movement (never debited), NO fee"
      - from: BOOKED
        to: RELEASED
        trigger: "POST /reservations/{id}/cancel — outside late-cancel window"
        actor: Member
        preconditions:
          - "reservation.booking_status == BOOKED"
          - "current clock < session.starts_at - template.late_cancel_window_hours hours"
        side_effects:
          - "attendance_status=CANCELLED; refund credits_charged (WalletEntry{kind:CANCEL_REFUND, delta:+credits_charged})"
          - "booked_count -= 1; trigger session FULL->OPEN auto-promotion path"
        note: "Early cancel: full credit refund, no fee."
      - from: BOOKED
        to: RELEASED
        trigger: "POST /reservations/{id}/cancel — inside late-cancel window"
        actor: Member
        preconditions:
          - "reservation.booking_status == BOOKED"
          - "session.starts_at - template.late_cancel_window_hours hours <= current clock < session.starts_at"
        side_effects:
          - "attendance_status=LATE_CANCELLED; seat credit IS refunded (WalletEntry{kind:CANCEL_REFUND, delta:+credits_charged}) BUT a LATE_CANCEL FeeCharge is assessed per §1.3 late_fee_assessment"
          - "booked_count -= 1; trigger auto-promotion; increment Member.no_show_strikes; recompute Member.standing"
        note: "Late cancel: credit refunded, monetary fee charged, strike incremented."
      - from: BOOKED
        to: BOOKED
        trigger: "POST /reservations/{id}/check_in"
        actor: StudioManager
        preconditions:
          - "reservation.booking_status == BOOKED"
          - "reservation.attendance_status == PENDING"
          - "session.status IN {OPEN, FULL}"
          - "current clock >= session.starts_at - CHECKIN_LEAD_HOURS hours"
        side_effects:
          - "attendance_status=CHECKED_IN (booking_status stays BOOKED — parallel dimension change only)"
        note: "Attendance dimension advances independently; the seat stays held."

  # --- FeeCharge: assess then optionally waive ---------------------------------
  - entity: FeeCharge
    initial_state: ASSESSED
    terminal_states: [WAIVED]
    transitions:
      - from: ASSESSED
        to: WAIVED
        trigger: "POST /fees/{id}/waive"
        actor: StudioManager
        preconditions:
          - "fee.status == ASSESSED"
        side_effects:
          - "set amount_cents-effective to 0 (status=WAIVED); decrement Member.no_show_strikes by 1 (floor 0); recompute Member.standing"
        note: "Waiving reverses the strike that the originating event added."

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: reservation-create-stale-session
    parent_entity: ClassSession
    write_endpoint: "POST /sessions/{id}/reservations"
    occ_field: "expected_session_version"
    description: |
      Creating a reservation against a ClassSession whose version has advanced
      since the client last observed it is rejected with a stale-version error.
      A free seat the client saw may already have been taken (the prior booking
      bumped the session version and possibly flipped OPEN->FULL), so the client's
      view of remaining capacity is stale and the booking is refused until re-read.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: membership-freeze-stale
    parent_entity: Membership
    write_endpoint: "POST /memberships/{id}/freeze"
    occ_field: "expected_membership_version"
    description: |
      Freezing a Membership whose version has advanced since the client last
      observed it is rejected. A debit/refund/renew may have moved credit_balance
      or freeze_days_used (any of which legitimately changes whether freeze is
      permitted), so the client's snapshot is stale and the freeze is refused.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:

  - name: waitlist_promotion
    trigger: "A BOOKED seat is released on a FULL session (reservation early/late cancel, or check-in is irrelevant) OR a session re-evaluates capacity"
    algorithm: waterfall_allocation
    formula: |
      # Promote from the waitlist into the freed seat(s), in strict order.
      candidates = reservations on session WHERE booking_status == WAITLISTED
                   ORDER BY created_at ASC          # waitlist_position 1,2,3,...
      free_seats = seat_capacity - booked_count     # after the release
      for seat in range(free_seats):
        promoted = false
        while candidates and not promoted:
          head = candidates.pop_front()             # lowest created_at
          if head.membership.status == ACTIVE and head.membership.credit_balance >= template.credit_cost:
            debit template.credit_cost from head.membership   # RESERVE_DEBIT
            head.booking_status = BOOKED
            head.credits_charged = template.credit_cost
            head.promoted_at = now
            booked_count += 1
            promoted = true
          else:
            # head cannot pay -> skip and release it, continue down the line
            head.booking_status = RELEASED
            head.attendance_status = CANCELLED
            waitlisted_count -= 1
      recompute waitlist_position for all remaining WAITLISTED (created_at ASC, 1-based)
      session.status = FULL if booked_count == seat_capacity else OPEN
    input_set: "WAITLISTED reservations on the session, ordered by created_at ASC (NEVER by id)"
    constants: {}
    precision: "integer credits; no rounding"
    variants:
      - name: single_seat_release
        when: "exactly one BOOKED seat freed (member cancel)"
        difference: "free_seats == 1; promote at most one payable head-of-line"
      - name: bulk_release_on_capacity_increase
        when: "StudioManager raises seat_capacity on a FULL session (PATCH /sessions/{id})"
        difference: "free_seats == new_capacity - booked_count; promote multiple heads in order until seats fill or waitlist drains"

  - name: late_fee_assessment
    trigger: "BOOKED reservation late-cancelled (inside window) OR marked NO_SHOW on session completion"
    algorithm: tiered_pricing
    formula: |
      # Fee depends on EVENT KIND and the member's rolling strike count BEFORE this event.
      base = LATE_CANCEL_BASE_CENTS if kind == LATE_CANCEL else NO_SHOW_BASE_CENTS
      prior_strikes = Member.no_show_strikes    # count BEFORE this event is added
      if prior_strikes <= 1:
        surcharge = 0
      elif prior_strikes <= 3:
        surcharge = TIER2_SURCHARGE_CENTS       # applies to strikes 2 and 3
      else:
        surcharge = TIER3_SURCHARGE_CENTS       # applies to strikes 4+
      amount_cents = base + surcharge
      # boundary: prior_strikes == 1 -> tier1 (surcharge 0); prior_strikes == 2 -> tier2
    input_set: "single reservation event; Member.no_show_strikes observed BEFORE incrementing for this event"
    constants:
      LATE_CANCEL_BASE_CENTS: 1500
      NO_SHOW_BASE_CENTS: 2500
      TIER2_SURCHARGE_CENTS: 1000
      TIER3_SURCHARGE_CENTS: 2500
    precision: "integer cents; no rounding"
    variants:
      - name: late_cancel
        when: "kind == LATE_CANCEL"
        difference: "base = 1500; seat credit IS refunded alongside the fee"
      - name: no_show
        when: "kind == NO_SHOW"
        difference: "base = 2500; seat credit is NOT refunded"

  - name: cancellation_refund
    trigger: "POST /memberships/{id}/cancel"
    algorithm: chronological
    formula: |
      # PRORATED monetary refund of the unused cycle, dual-variant by plan kind.
      # elapsed_days counts whole days from cycle_start to current clock (floor).
      # frozen days do NOT count as elapsed (the cycle was paused).
      elapsed_days = floor((now - cycle_start)/1day) - freeze_days_used
      cycle_len = plan.validity_days
      remaining_days = max(0, cycle_len - elapsed_days)
      # ROUNDING ORDER IS PINNED (mode-b nested rounding): keep the ratio at FULL
      # precision, multiply price by it, and round_half_up exactly ONCE at the very
      # end. Do NOT round remaining_ratio first (rounding the ratio to 2dp then
      # multiplying yields different cents). refund_cents is an integer cents value.
      remaining_ratio = remaining_days / cycle_len                 # full precision, no intermediate rounding
      refund_cents = round_half_up(plan.price_cents * remaining_ratio)   # single final rounding
    input_set: "the membership's own cycle window and price"
    constants:
      EARLY_CANCEL_PENALTY_CENTS: 0
    precision: "integer cents; multiply at full ratio precision, round_half_up exactly once at the end"
    variants:
      - name: membership_prorated
        when: "plan.kind == MEMBERSHIP"
        difference: "full proration as above; remaining unused credits are forfeited (not cash-refunded)"
      - name: pack_no_refund
        when: "plan.kind IN {INTRO, CREDIT_PACK}"
        difference: "refund_cents = 0 (packs are non-refundable); credits still forfeited on cancel"

  - name: rollover_carry
    trigger: "Membership ACTIVE->ACTIVE renewal (MEMBERSHIP) at cycle boundary"
    algorithm: threshold
    formula: |
      rolled_over_credits = min(credit_balance_at_renewal, plan.rollover_cap)
      forfeited = credit_balance_at_renewal - rolled_over_credits
      new_credit_balance = rolled_over_credits + plan.grant_credits
      # boundary: balance == rollover_cap -> all roll; balance == rollover_cap+1 -> 1 forfeited
    input_set: "membership.credit_balance immediately before renewal; plan.rollover_cap; plan.grant_credits"
    constants: {}
    precision: "integer credits"
    variants:
      - name: under_cap
        when: "credit_balance <= rollover_cap"
        difference: "all credits roll; forfeited == 0"
      - name: over_cap
        when: "credit_balance > rollover_cap"
        difference: "exactly rollover_cap roll; the surplus is forfeited (ROLLOVER_FORFEIT)"

  - name: room_capacity_invariant
    trigger: "POST /sessions, PATCH /sessions/{id} (seat_capacity), publish"
    algorithm: aggregation
    formula: |
      # Session seat_capacity may never exceed the hosting room's physical_capacity.
      assert seat_capacity <= room.physical_capacity
      # waitlist gate: a new WAITLISTED reservation is accepted only while
      # waitlisted_count < waitlist_capacity.
    input_set: "the session's seat_capacity vs room.physical_capacity; waitlisted_count vs waitlist_capacity"
    constants: {}
    precision: "integer"

  - name: instructor_double_book_window
    trigger: "POST /sessions, PATCH /sessions/{id} (starts_at), publish"
    algorithm: interval_merge
    formula: |
      # Instructor conflict uses a TRAVEL BUFFER between sessions at DIFFERENT studios.
      # [a.starts_at, a.ends_at] for two non-CANCELLED sessions of the same instructor.
      same_studio_conflict = intervals strictly overlap   # half-open [start, end); touching at a point is OK
      cross_studio_conflict = gap < INSTRUCTOR_TRAVEL_BUFFER_MIN   # needs buffer when studios differ
      where gap = max(0, later.starts_at - earlier.ends_at) in minutes
      reject if same_studio_conflict OR cross_studio_conflict
    input_set: "all non-CANCELLED ClassSession of the same instructor_id"
    constants:
      INSTRUCTOR_TRAVEL_BUFFER_MIN: 30
    precision: "minutes"

  - name: room_overlap_window
    trigger: "POST /sessions, PATCH /sessions/{id} (starts_at/room_id), publish"
    algorithm: interval_merge
    formula: |
      # Room conflict uses a CLEANING BUFFER appended to each session.
      # Two non-CANCELLED sessions in the same room conflict if their cleaning-padded
      # intervals overlap: [start, end + ROOM_CLEANING_BUFFER_MIN).
      a_end_padded = a.ends_at + ROOM_CLEANING_BUFFER_MIN minutes
      b_end_padded = b.ends_at + ROOM_CLEANING_BUFFER_MIN minutes
      conflict = (a.starts_at < b_end_padded) AND (b.starts_at < a_end_padded)
      # half-open: a session may start exactly when the prior padded interval ends.
    input_set: "all non-CANCELLED ClassSession in the same room_id"
    constants:
      ROOM_CLEANING_BUFFER_MIN: 15
    precision: "minutes"

  - name: member_standing_strike
    trigger: "On NO_SHOW (session completion) or LATE_CANCEL (late reservation cancel); reversed on fee waive"
    algorithm: threshold
    formula: |
      # no_show_strikes = count of FeeCharge rows for this member with status==ASSESSED
      #   (each LATE_CANCEL/NO_SHOW assesses exactly one fee; a waive flips status to
      #    WAIVED and removes its strike contribution).
      no_show_strikes = count(FeeCharge WHERE member_id==m.id AND status==ASSESSED
                              AND created_at >= now - STRIKE_WINDOW_DAYS days)
      standing = RESTRICTED if no_show_strikes >= NO_SHOW_BLOCK_THRESHOLD else GOOD
      # boundary: strikes == NO_SHOW_BLOCK_THRESHOLD-1 -> GOOD; == NO_SHOW_BLOCK_THRESHOLD -> RESTRICTED
      # check_in is gated by current clock >= session.starts_at - CHECKIN_LEAD_HOURS hours
    input_set: "ASSESSED FeeCharge rows for the member within the trailing STRIKE_WINDOW_DAYS window, ordered by created_at"
    constants:
      NO_SHOW_BLOCK_THRESHOLD: 3
      STRIKE_WINDOW_DAYS: 30
      CHECKIN_LEAD_HOURS: 2
    precision: "integer count"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and recognized"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all except POST /studios bootstrap and /_* test endpoints which require NetworkAdmin"

  - priority: 2
    category: auth
    check: "Acting role is permitted for this operation per §1.7; entity_backed role must own the targeted resource"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: existence
    check: "Every path/body resource id resolves to an existing entity, validated left-to-right"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints referencing an id"

  - priority: 4
    category: business_constraint
    check: "Required body fields present and well-typed; enum values in declared set; numeric fields satisfy declared ranges"
    error_id: ERR_INVALID_REQUEST
    http_status: 422
    applies_to: "all POST/PATCH"

  - priority: 5
    category: state
    check: "Target resource is in a state from which the requested transition is defined (§1.2). For reservation create this is the session being OPEN/FULL (bookable); for check_in this is booking_status==BOOKED and attendance_status==PENDING."
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints except where a more specific state error below applies"

  - priority: 6
    category: state
    check: "Reservation target session is in OPEN or FULL (bookable) when reserving; a SCHEDULED/CANCELLED/COMPLETED session is not bookable"
    error_id: ERR_SESSION_NOT_BOOKABLE
    http_status: 409
    applies_to: "POST /sessions/{id}/reservations"

  - priority: 7
    category: state
    check: "OCC: expected_<parent>_version matches the parent entity's current version (checked after the session is confirmed bookable / membership confirmed freezable)"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /sessions/{id}/reservations, POST /memberships/{id}/freeze"

  - priority: 8
    category: business_safety
    check: "Studio.status==OPEN, Room.status==ACTIVE, Instructor.status==ACTIVE when creating or publishing a session (checked before the temporal-overlap and capacity checks)"
    error_id: ERR_STUDIO_CLOSED
    http_status: 409
    applies_to: "POST /sessions, POST /sessions/{id}/publish, PATCH /sessions/{id}"

  - priority: 9
    category: business_safety
    check: "Member.standing == GOOD (no_show_strikes < NO_SHOW_BLOCK_THRESHOLD) before creating a reservation"
    error_id: ERR_MEMBER_RESTRICTED
    http_status: 403
    applies_to: "POST /sessions/{id}/reservations"

  - priority: 10
    category: business_temporal
    check: "check_in only inside its allowed window: current clock >= session.starts_at - CHECKIN_LEAD_HOURS hours"
    error_id: ERR_INVALID_CANCEL_WINDOW
    http_status: 409
    applies_to: "POST /reservations/{id}/check_in"

  - priority: 11
    category: business_referential
    check: "INTRO plan purchase allowed only if member has not used an intro before (Member.has_used_intro == false) when plan.intro_once_per_member"
    error_id: ERR_INTRO_ALREADY_USED
    http_status: 409
    applies_to: "POST /members/{id}/memberships"

  - priority: 12
    category: business_temporal
    check: "Instructor not double-booked under §1.3 instructor_double_book_window (same-studio strict overlap, or cross-studio gap < travel buffer)"
    error_id: ERR_INSTRUCTOR_CONFLICT
    http_status: 409
    applies_to: "POST /sessions, PATCH /sessions/{id}, POST /sessions/{id}/publish"

  - priority: 13
    category: business_temporal
    check: "Room not double-booked under §1.3 room_overlap_window (cleaning-buffer padded overlap)"
    error_id: ERR_ROOM_CONFLICT
    http_status: 409
    applies_to: "POST /sessions, PATCH /sessions/{id}, POST /sessions/{id}/publish"

  - priority: 14
    category: business_constraint
    check: "session.seat_capacity <= room.physical_capacity (§1.3 room_capacity_invariant)"
    error_id: ERR_CAPACITY_EXCEEDS_ROOM
    http_status: 409
    applies_to: "POST /sessions, PATCH /sessions/{id}"

  - priority: 15
    category: business_constraint
    check: "Freeze allowed only for MEMBERSHIP plans with freeze_max_days>0 and freeze_days_used<freeze_max_days"
    error_id: ERR_FREEZE_NOT_ALLOWED
    http_status: 409
    applies_to: "POST /memberships/{id}/freeze"

  - priority: 16
    category: business_constraint
    check: "membership.status == ACTIVE when reserving (checked before duplicate/waitlist/credit checks)"
    error_id: ERR_MEMBERSHIP_INACTIVE
    http_status: 409
    applies_to: "POST /sessions/{id}/reservations"

  - priority: 17
    category: business_constraint
    check: "Cannot create a second non-RELEASED reservation for the same member on the same session (duplicate booking)"
    error_id: ERR_DUPLICATE_RESERVATION
    http_status: 409
    applies_to: "POST /sessions/{id}/reservations"

  - priority: 18
    category: business_constraint
    check: "Waitlist not full: waitlisted_count < waitlist_capacity when no free seat exists"
    error_id: ERR_WAITLIST_FULL
    http_status: 409
    applies_to: "POST /sessions/{id}/reservations"

  - priority: 19
    category: business_fiscal
    check: "membership.credit_balance >= template.credit_cost when a seat is taken (immediate book only; waitlist entries are not charged until promotion)"
    error_id: ERR_INSUFFICIENT_CREDITS
    http_status: 402
    applies_to: "POST /sessions/{id}/reservations"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:

  # --- Studios & rooms (config) ----------------------------------------------
  - method: POST
    path: "/studios"
    description: "Create a studio in the network"
    roles: [NetworkAdmin]
    code: 201
    input: [name, state_code, "timezone?"]
    output: Studio
    side_effects: ["status=OPEN; active_room_count=0"]

  - method: GET
    path: "/studios/{id}"
    description: "Fetch a studio"
    roles: [NetworkAdmin, StudioManager, Member]
    code: 200
    input: []
    output: Studio

  - method: POST
    path: "/studios/{id}/close"
    description: "Close a studio (no new sessions may be created/published)"
    roles: [NetworkAdmin]
    code: 200
    input: []
    output: Studio
    side_effects: ["status=CLOSED"]

  - method: POST
    path: "/studios/{id}/rooms"
    description: "Add a room to a studio"
    roles: [NetworkAdmin, StudioManager]
    code: 201
    input: [name, physical_capacity]
    output: Room
    side_effects: ["status=ACTIVE; Studio.active_room_count recomputed"]

  - method: GET
    path: "/studios/{id}/rooms"
    description: "List rooms under a studio (FK reverse-reachability for Room.studio_id)"
    roles: [NetworkAdmin, StudioManager, Member]
    code: 200
    input: ["limit?", "offset?"]
    output: Room[]

  - method: POST
    path: "/rooms/{id}/retire"
    description: "Retire a room"
    roles: [NetworkAdmin, StudioManager]
    code: 200
    input: []
    output: Room
    side_effects: ["status=RETIRED; Studio.active_room_count recomputed"]

  # --- Instructors -----------------------------------------------------------
  - method: POST
    path: "/instructors"
    description: "Create an instructor"
    roles: [NetworkAdmin]
    code: 201
    input: [full_name, home_studio_id]
    output: Instructor
    side_effects: ["status=ACTIVE"]

  - method: GET
    path: "/instructors/{id}"
    description: "Fetch an instructor"
    roles: [NetworkAdmin, StudioManager, Member]
    code: 200
    input: []
    output: Instructor

  - method: GET
    path: "/instructors"
    description: "List instructors; filter by home_studio_id (FK reverse-reachability for Instructor.home_studio_id)"
    roles: [NetworkAdmin, StudioManager, Member]
    code: 200
    input: ["home_studio_id?", "limit?", "offset?"]
    output: Instructor[]

  - method: POST
    path: "/instructors/{id}/deactivate"
    description: "Deactivate an instructor"
    roles: [NetworkAdmin]
    code: 200
    input: []
    output: Instructor
    side_effects: ["status=INACTIVE"]

  # --- Class templates -------------------------------------------------------
  - method: POST
    path: "/class-templates"
    description: "Create a class template (type)"
    roles: [NetworkAdmin]
    code: 201
    input: [name, duration_min, credit_cost, "late_cancel_window_hours?"]
    output: ClassTemplate
    side_effects: ["status=ACTIVE"]

  - method: GET
    path: "/class-templates/{id}"
    description: "Fetch a class template"
    roles: [NetworkAdmin, StudioManager, Member]
    code: 200
    input: []
    output: ClassTemplate

  # --- Package plans & memberships -------------------------------------------
  - method: POST
    path: "/package-plans"
    description: "Create a package/membership plan"
    roles: [NetworkAdmin]
    code: 201
    input: [name, kind, price_cents, grant_credits, validity_days, "rollover_cap?", "freeze_max_days?", "intro_once_per_member?"]
    output: PackagePlan
    side_effects: ["status=ACTIVE"]

  - method: GET
    path: "/package-plans/{id}"
    description: "Fetch a package plan"
    roles: [NetworkAdmin, StudioManager, Member]
    code: 200
    input: []
    output: PackagePlan

  - method: POST
    path: "/members"
    description: "Register a member"
    roles: [NetworkAdmin, Member]
    code: 201
    input: [email, full_name, home_studio_id]
    output: Member
    side_effects: ["has_used_intro=false; no_show_strikes=0; standing=GOOD"]

  - method: GET
    path: "/members/{id}"
    description: "Fetch a member (computed standing, strikes)"
    roles: [NetworkAdmin, StudioManager, Member]
    code: 200
    input: []
    output: Member

  - method: GET
    path: "/members"
    description: "List members; filter by home_studio_id (FK reverse-reachability for Member.home_studio_id)"
    roles: [NetworkAdmin, StudioManager]
    code: 200
    input: ["home_studio_id?", "limit?", "offset?"]
    output: Member[]

  - method: POST
    path: "/members/{id}/memberships"
    description: "Purchase a plan -> create a Membership in PENDING_PAYMENT"
    roles: [NetworkAdmin, Member]
    code: 201
    input: [plan_id]
    output: Membership
    side_effects: ["status=PENDING_PAYMENT; credit_balance=0; enforce ERR_INTRO_ALREADY_USED"]

  - method: GET
    path: "/members/{id}/memberships"
    description: "List a member's memberships (FK reverse-reachability for Membership.member_id)"
    roles: [NetworkAdmin, StudioManager, Member]
    code: 200
    input: ["limit?", "offset?"]
    output: Membership[]

  - method: GET
    path: "/memberships/{id}"
    description: "Fetch a membership with computed credit_balance, expires_at, freeze_days_used"
    roles: [NetworkAdmin, StudioManager, Member]
    code: 200
    input: []
    output: Membership

  - method: GET
    path: "/memberships"
    description: "List memberships; filter by member_id or plan_id (FK reverse-reachability for Membership.plan_id)"
    roles: [NetworkAdmin, StudioManager]
    code: 200
    input: ["member_id?", "plan_id?", "limit?", "offset?"]
    output: Membership[]

  - method: GET
    path: "/memberships/{id}/wallet-entries"
    description: "List wallet ledger entries for a membership (FK reverse-reachability for WalletEntry.membership_id)"
    roles: [NetworkAdmin, StudioManager, Member]
    code: 200
    input: ["limit?", "offset?"]
    output: WalletEntry[]

  - method: POST
    path: "/memberships/{id}/freeze"
    description: "Freeze an active MEMBERSHIP (OCC-guarded)"
    roles: [Member, NetworkAdmin]
    code: 200
    input: [expected_membership_version]
    output: Membership
    side_effects: ["status=FROZEN; frozen_at set; increments Membership.version by 1"]

  - method: POST
    path: "/memberships/{id}/unfreeze"
    description: "Unfreeze a frozen MEMBERSHIP; extends expires_at by frozen span"
    roles: [Member, NetworkAdmin]
    code: 200
    input: []
    output: Membership
    side_effects: ["status=ACTIVE; freeze_days_used += frozen span (capped); expires_at advanced; increments Membership.version by 1"]

  - method: POST
    path: "/memberships/{id}/renew"
    description: "Renew a MEMBERSHIP at/after cycle end; applies rollover (§1.3 rollover_carry)"
    roles: [NetworkAdmin]
    code: 200
    input: []
    output: Membership
    side_effects: ["rolled_over_credits computed; ROLLOVER_FORFEIT/GRANT entries appended; cycle reset; freeze_days_used=0; increments Membership.version by 1"]

  - method: POST
    path: "/memberships/{id}/cancel"
    description: "Cancel a membership; prorated refund_cents (§1.3 cancellation_refund); forfeits credits"
    roles: [Member, NetworkAdmin]
    code: 200
    input: []
    output: Membership
    side_effects: ["status=CANCELLED; refund_cents computed; EXPIRY_FORFEIT of remaining credits; increments Membership.version by 1"]

  - method: GET
    path: "/members/{id}/fees"
    description: "List fee charges for a member (FK reverse-reachability for FeeCharge.member_id)"
    roles: [NetworkAdmin, StudioManager, Member]
    code: 200
    input: ["limit?", "offset?"]
    output: FeeCharge[]

  - method: POST
    path: "/fees/{id}/waive"
    description: "Waive a fee charge; reverses the strike it created"
    roles: [StudioManager, NetworkAdmin]
    code: 200
    input: []
    output: FeeCharge
    side_effects: ["status=WAIVED; Member.no_show_strikes -= 1 (floor 0); Member.standing recomputed"]

  # --- Sessions & reservations -----------------------------------------------
  - method: POST
    path: "/sessions"
    description: "Create a class session (SCHEDULED); enforces room/instructor/capacity conflicts"
    roles: [StudioManager, NetworkAdmin]
    code: 201
    input: [studio_id, room_id, instructor_id, template_id, starts_at, seat_capacity, "waitlist_capacity?"]
    output: ClassSession
    side_effects: ["status=SCHEDULED; ends_at computed; conflict checks per §1.4 priorities 9-11"]

  - method: GET
    path: "/sessions/{id}"
    description: "Fetch a session with computed counts and status"
    roles: [NetworkAdmin, StudioManager, Member]
    code: 200
    input: []
    output: ClassSession

  - method: GET
    path: "/sessions"
    description: "List sessions; filter by studio_id, room_id, instructor_id, template_id (FK reverse-reachability)"
    roles: [NetworkAdmin, StudioManager, Member]
    code: 200
    input: ["studio_id?", "room_id?", "instructor_id?", "template_id?", "limit?", "offset?"]
    output: ClassSession[]

  - method: PATCH
    path: "/sessions/{id}"
    description: "Update a session's seat_capacity / starts_at / room before completion; re-runs conflict and capacity checks; raising seat_capacity on a FULL session triggers bulk waitlist promotion"
    roles: [StudioManager, NetworkAdmin]
    code: 200
    input: ["seat_capacity?", "starts_at?", "room_id?", "waitlist_capacity?"]
    output: ClassSession
    side_effects: ["re-validate conflicts; on seat_capacity increase run §1.3 waitlist_promotion (bulk_release_on_capacity_increase)"]

  - method: POST
    path: "/sessions/{id}/publish"
    description: "Publish a SCHEDULED session -> OPEN (bookable)"
    roles: [StudioManager, NetworkAdmin]
    code: 200
    input: []
    output: ClassSession
    side_effects: ["status=OPEN; re-validate room/instructor active and conflicts"]

  - method: POST
    path: "/sessions/{id}/cancel"
    description: "Cancel a session; cascades reservation releases + credit refunds (no fees)"
    roles: [StudioManager, NetworkAdmin]
    code: 200
    input: []
    output: ClassSession
    side_effects: ["status=CANCELLED; release all reservations; refund BOOKED seat credits; counts reset"]

  - method: POST
    path: "/sessions/{id}/reservations"
    description: "Reserve a seat (or join waitlist). OCC-guarded on session.version. Books immediately if a free seat exists, else waitlists."
    roles: [Member, NetworkAdmin]
    code: 201
    input: [membership_id, expected_session_version]
    output: Reservation
    side_effects: ["create Reservation; if free seat -> BOOKED + RESERVE_DEBIT + possible OPEN->FULL; else WAITLISTED; increments ClassSession.version by 1"]

  - method: GET
    path: "/sessions/{id}/reservations"
    description: "List reservations on a session (FK reverse-reachability for Reservation.session_id)"
    roles: [NetworkAdmin, StudioManager, Member]
    code: 200
    input: ["limit?", "offset?"]
    output: Reservation[]

  - method: GET
    path: "/reservations/{id}"
    description: "Fetch a reservation (booking_status, attendance_status, credits_charged, late_fee_cents, waitlist_position)"
    roles: [NetworkAdmin, StudioManager, Member]
    code: 200
    input: []
    output: Reservation

  - method: GET
    path: "/reservations/{id}/wallet-entries"
    description: "List wallet ledger entries tied to a reservation (FK reverse-reachability for WalletEntry.reservation_id)"
    roles: [NetworkAdmin, StudioManager, Member]
    code: 200
    input: ["limit?", "offset?"]
    output: WalletEntry[]

  - method: GET
    path: "/reservations"
    description: "List reservations; filter by member_id or membership_id (FK reverse-reachability for Reservation.member_id and Reservation.membership_id)"
    roles: [NetworkAdmin, StudioManager, Member]
    code: 200
    input: ["member_id?", "membership_id?", "limit?", "offset?"]
    output: Reservation[]

  - method: POST
    path: "/reservations/{id}/cancel"
    description: "Cancel a reservation; early=refund no fee, late=refund+fee+strike, waitlisted=no charge; triggers auto-promotion"
    roles: [Member, NetworkAdmin]
    code: 200
    input: []
    output: Reservation
    side_effects: ["booking_status=RELEASED; refund/fee per window; auto-promote head-of-line waitlist; recompute counts and Member standing"]

  - method: POST
    path: "/reservations/{id}/check_in"
    description: "Check a member in (attendance_status=CHECKED_IN); booking_status unchanged"
    roles: [StudioManager, NetworkAdmin]
    code: 200
    input: []
    output: Reservation
    side_effects: ["attendance_status=CHECKED_IN"]

  - method: GET
    path: "/fees/{id}"
    description: "Fetch a fee charge"
    roles: [NetworkAdmin, StudioManager, Member]
    code: 200
    input: []
    output: FeeCharge

  - method: GET
    path: "/fees"
    description: "List fee charges; filter by reservation_id or member_id (FK reverse-reachability for FeeCharge.reservation_id)"
    roles: [NetworkAdmin, StudioManager, Member]
    code: 200
    input: ["reservation_id?", "member_id?", "limit?", "offset?"]
    output: FeeCharge[]

  # --- Test-driving / ops endpoints (outside public business surface) --------
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server's current UTC clock (drives late-cancel window, freeze span, expiry, completion)"
    roles: [NetworkAdmin]
    code: 200
    input: [to_iso8601]
    output: null

  - method: POST
    path: "/_payments/capture"
    description: "Simulate a payment capture for a PENDING_PAYMENT membership -> ACTIVE + grant credits"
    roles: [NetworkAdmin]
    code: 200
    input: [membership_id, outcome]
    output: Membership
    side_effects: ["on CAPTURED: status=ACTIVE; activated_at/cycle_start/expires_at set; GRANT credits; has_used_intro for INTRO"]

  - method: POST
    path: "/_ops/run_completion"
    description: "Advance all OPEN/FULL sessions whose ends_at <= clock to COMPLETED; marks NO_SHOWs, assesses fees, releases waitlist"
    roles: [NetworkAdmin]
    code: 200
    input: []
    output: null
    side_effects: ["per §1.2 ClassSession OPEN/FULL->COMPLETED cascade"]

  - method: POST
    path: "/_ops/run_expiry"
    description: "Expire memberships (INTRO/CREDIT_PACK, or any past expires_at) -> EXPIRED + forfeit credits"
    roles: [NetworkAdmin]
    code: 200
    input: []
    output: null
    side_effects: ["per §1.2 Membership ACTIVE/FROZEN->EXPIRED cascade"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing/unrecognized X-User-Role or X-User-ID" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Role not permitted for the operation, or entity_backed actor does not own the resource" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Referenced studio/room/instructor/template/plan/member/membership/session/reservation/fee id does not exist" }
  - { id: ERR_INVALID_REQUEST, http: 422, condition: "Missing required field, bad type, enum out of set, or numeric range violation" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Requested transition not defined from the resource's current state" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_<parent>_version does not match the parent's current version (OCC)" }
  - { id: ERR_MEMBER_RESTRICTED, http: 403, condition: "Member.standing == RESTRICTED (no_show_strikes >= block threshold) on reservation attempt" }
  - { id: ERR_INTRO_ALREADY_USED, http: 409, condition: "Member already used an INTRO plan and plan.intro_once_per_member is true" }
  - { id: ERR_INSTRUCTOR_CONFLICT, http: 409, condition: "Instructor double-booked: same-studio overlap or cross-studio gap < travel buffer" }
  - { id: ERR_ROOM_CONFLICT, http: 409, condition: "Room double-booked: cleaning-buffer-padded intervals overlap" }
  - { id: ERR_CAPACITY_EXCEEDS_ROOM, http: 409, condition: "seat_capacity > room.physical_capacity" }
  - { id: ERR_MEMBERSHIP_INACTIVE, http: 409, condition: "Membership not ACTIVE when reserving/promoting" }
  - { id: ERR_DUPLICATE_RESERVATION, http: 409, condition: "Member already holds a non-RELEASED reservation on the same session" }
  - { id: ERR_WAITLIST_FULL, http: 409, condition: "waitlisted_count == waitlist_capacity and no free seat exists" }
  - { id: ERR_INSUFFICIENT_CREDITS, http: 402, condition: "credit_balance < template.credit_cost when a seat would be taken" }
  - { id: ERR_FREEZE_NOT_ALLOWED, http: 409, condition: "Plan is not MEMBERSHIP, freeze_max_days==0, or freeze_days_used would exceed freeze_max_days" }
  - { id: ERR_STUDIO_CLOSED, http: 409, condition: "Session create/publish against a CLOSED studio, RETIRED room, or INACTIVE instructor" }
  - { id: ERR_SESSION_NOT_BOOKABLE, http: 409, condition: "Reservation attempt against a session not in OPEN/FULL" }
  - { id: ERR_INVALID_CANCEL_WINDOW, http: 409, condition: "check_in attempted before CHECKIN_LEAD_HOURS, or other window-gated action outside its allowed window" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: NetworkAdmin
    description: "Network operator: owns global config (plans, templates, studios, instructors) and runs ops/clock/payment endpoints."
    identity: opaque
    exclusive_operations:
      - "POST /studios, POST /studios/{id}/close"
      - "POST /instructors, POST /instructors/{id}/deactivate"
      - "POST /class-templates"
      - "POST /package-plans"
      - "POST /memberships/{id}/renew"
      - "POST /_clock/set_current_utc, POST /_payments/capture, POST /_ops/run_completion, POST /_ops/run_expiry"
    shared_operations:
      - "create/manage rooms, sessions, reservations, memberships, fees (admin superset for testing/operations)"

  - name: StudioManager
    description: "Manages a studio's schedule and on-site operations: rooms, sessions, check-ins, fee waivers."
    identity: opaque
    exclusive_operations:
      - "POST /sessions/{id}/publish, POST /sessions/{id}/cancel, PATCH /sessions/{id}"
      - "POST /reservations/{id}/check_in"
      - "POST /fees/{id}/waive"
      - "POST /rooms/{id}/retire"
    shared_operations:
      - "POST /sessions, POST /studios/{id}/rooms (with NetworkAdmin)"
      - "GET reads across studios, sessions, reservations, members"

  - name: Member
    description: "End customer: purchases memberships, reserves/cancels seats, freezes own membership."
    identity: entity_backed:Member
    exclusive_operations:
      - "POST /sessions/{id}/reservations, POST /reservations/{id}/cancel"
      - "POST /memberships/{id}/freeze, POST /memberships/{id}/unfreeze, POST /memberships/{id}/cancel"
    shared_operations:
      - "POST /members, POST /members/{id}/memberships (with NetworkAdmin)"
      - "GET own member, memberships, wallet-entries, reservations, fees, sessions"
