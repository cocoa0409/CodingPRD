# SCAFFOLD_CORNER_DESIGN.yaml — §1.9 breadth probe for task 2554
# School Crossing Guard & Safe Routes to School (municipal school crossing program)
#
# Taxonomy: sections and claim_type values come verbatim from
# skills/prd-bench-scaffold-generator/references/claim-extraction-guide.md.
# Every instance name is unique across this file AND SCAFFOLD_DIFFICULTY_DESIGN.yaml.
# Corners already asserted by §1.8 are emitted as excluded_because stubs with no test_recipe.
# Default logical clock before any /_clock/set_current_utc call: 2026-08-01T00:00:00Z.

scaffold_corner_design:
  - section: entities
    instances:
      - name: corner_school_creation_returns_declared_defaults
        claim_type: creation
        grounds:
          - entities.School
          - endpoints.POST_/srts/schools
          - entities.School.fields.early_dismissal_pm_offset_minutes
        distinguishing_aspect: |
          A create call that omits all three optional inputs must return 201 with
          early_dismissal_pm_offset_minutes -120, no_school_dates [], early_dismissal_dates
          [], coverage_rate_pct 100.00, coverage_posture OPEN, all three post counters 0
          and version 1 — the declared defaults, not nulls.
        test_recipe:
          setup:
            - "Empty database; logical clock at its default 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /srts/schools"
              payload: { name: "Cedar Point Elementary", district_code: "D-11", enrollment_count: 410, session_start_date: "2026-08-24", session_end_date: "2027-06-11", am_window_start_utc: "07:30", am_window_end_utc: "08:30", pm_window_start_utc: "15:00", pm_window_end_utc: "16:00", baseline_walk_bike_mode_share_pct: 12.25 }
              as: ProgramAdmin
              as_user_id: "adm-1"
              captures: { school_c_id: $.data.id }
          trigger:
            - call: "GET /srts/schools/${school_c_id}"
              payload: {}
              as: ProgramAdmin
              as_user_id: "adm-1"
          assert:
            - "create call returns HTTP 201 with response_type object and data.id present"
            - "School.${school_c_id}.early_dismissal_pm_offset_minutes == -120"
            - "School.${school_c_id}.no_school_dates == [] and early_dismissal_dates == []"
            - "School.${school_c_id}.active_post_count == 0, covered_post_count == 0, uncovered_post_count == 0"
            - "School.${school_c_id}.coverage_rate_pct == 100.00 and coverage_posture == OPEN"
            - "School.${school_c_id}.walk_bike_mode_share_pct == null, walk_bike_mode_share_weighted_pct == null, mode_share_trend_pct == null, latest_survey_term_code == null"
            - "School.${school_c_id}.version == 1 with created_at == 2026-08-01T00:00:00Z"
            - "GET returns the identical stored field values"

      - name: corner_guard_creation_starts_applicant_with_no_equipment
        claim_type: system_fields
        grounds:
          - entities.Guard.fields.certification_status
          - entities.Guard.fields.equipment_complete
          - entities.Guard.fields.reliability_score_rolling_90d
          - state_machines.Guard.initial_state
        distinguishing_aspect: |
          Every system and computed field on a brand-new Guard is server-stamped:
          certification_status APPLICANT, duty_status UNASSIGNED, training_hours_completed
          0, equipment_issued [], equipment_complete false, both reliability scores 100.00,
          certified_on and certification_expires_on null — regardless of what the caller
          sends in the four declared input fields.
        test_recipe:
          setup:
            - "Empty database; logical clock at its default 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /srts/guards"
              payload: { full_name: "Priya Nandi", home_zone_code: "Z-EAST", hire_date: "2026-08-03", substitute_pool_optin: true }
              as: CrossingSupervisor
              as_user_id: "sup-1"
              captures: { guard_c_id: $.data.id }
          trigger:
            - call: "GET /srts/guards/${guard_c_id}"
              payload: {}
              as: CrossingSupervisor
              as_user_id: "sup-1"
          assert:
            - "Guard.${guard_c_id}.certification_status == APPLICANT and duty_status == UNASSIGNED"
            - "Guard.${guard_c_id}.training_hours_completed == 0 and hours_since_last_certification == 0"
            - "Guard.${guard_c_id}.equipment_issued == [] and equipment_complete == false"
            - "Guard.${guard_c_id}.reliability_score_rolling_90d == 100.00 and reliability_score_season_to_date == 100.00"
            - "Guard.${guard_c_id}.certified_on == null, certification_expires_on == null, suspension_reason == null"
            - "Guard.${guard_c_id}.version == 1"

      - name: corner_post_assignment_list_pagination_envelope
        claim_type: listing
        grounds:
          - endpoints.GET_/srts/post-assignments
          - response_envelope.pagination_fields
        distinguishing_aspect: |
          With three assignments for one guard and limit 2 / offset 0, the list endpoint
          returns exactly 2 rows with total_count 3 and has_more true; offset 2 returns the
          remaining 1 row with has_more false. Filtering by guard_id must not change
          total_count semantics — it counts the filtered set, not the table.
        test_recipe:
          setup:
            - "School with one WARRANTED intersection carrying three ACTIVE posts: NW AM, SE AM, SW PM."
            - "Guard Rita holds three assignments: NW 2026-09-08 -> 2026-09-18, SE 2026-09-19 -> 2026-09-25, SW (PM) 2026-09-08 -> 2026-09-18."
            - "Clock left at the default so all three stay SCHEDULED."
          setup_api_calls:
            - call: "POST /srts/schools"
              payload: { name: "Maple Grove Elementary", district_code: "D-07", enrollment_count: 640, session_start_date: "2026-08-24", session_end_date: "2027-06-11", am_window_start_utc: "07:15", am_window_end_utc: "08:15", pm_window_start_utc: "14:45", pm_window_end_utc: "15:45", baseline_walk_bike_mode_share_pct: 18.50 }
              as: ProgramAdmin
              as_user_id: "adm-1"
              captures: { school_id: $.data.id }
            - call: "POST /srts/intersections"
              payload: { school_id: "${school_id}", cross_streets: "Maple St & 3rd Ave", control_type: "UNCONTROLLED", speed_limit_mph: 30, lanes_crossed: 2, posted_school_zone: true }
              as: ProgramAdmin
              as_user_id: "adm-1"
              captures: { isx_id: $.data.id }
            - call: "POST /srts/intersections/${isx_id}/crash-records"
              payload: { crash_date: "2023-10-01", severity: "INJURY", involved_pedestrian: true, involved_school_age: true }
              as: TrafficEngineer
              as_user_id: "eng-1"
            - call: "POST /srts/intersections/${isx_id}/crash-records"
              payload: { crash_date: "2025-05-14", severity: "SEVERE_INJURY", involved_pedestrian: true, involved_school_age: true }
              as: TrafficEngineer
              as_user_id: "eng-1"
              captures: { isx_v: $.data.version }
            - call: "POST /srts/warrant-studies"
              payload: { intersection_id: "${isx_id}", count_window_start: "2026-09-08", count_window_end: "2026-09-30", expected_intersection_version: "${isx_v}" }
              as: TrafficEngineer
              as_user_id: "eng-1"
              captures: { study_id: $.data.id }
            - call: "POST /srts/warrant-studies/${study_id}/count-sessions"
              payload: { session_date: "2026-09-08", period: "AM_ARRIVAL", observed_minutes: 60, child_count: 70, adult_count: 10, vehicle_count: 500, adequate_gaps: 28 }
              as: TrafficEngineer
              as_user_id: "eng-1"
            - call: "POST /srts/warrant-studies/${study_id}/count-sessions"
              payload: { session_date: "2026-09-09", period: "PM_DISMISSAL", observed_minutes: 60, child_count: 50, adult_count: 8, vehicle_count: 380, adequate_gaps: 20 }
              as: TrafficEngineer
              as_user_id: "eng-1"
            - call: "POST /srts/warrant-studies/${study_id}/analyze"
              payload: {}
              as: TrafficEngineer
              as_user_id: "eng-1"
            - call: "POST /srts/warrant-studies/${study_id}/finalize"
              payload: { engineer_note: "Adopt WARRANTED determination." }
              as: TrafficEngineer
              as_user_id: "eng-2"
            - call: "POST /srts/guards"
              payload: { full_name: "Rita Alvarez", home_zone_code: "Z-NORTH", hire_date: "2026-08-03", substitute_pool_optin: false }
              as: CrossingSupervisor
              as_user_id: "sup-1"
              captures: { g1_id: $.data.id }
            - call: "POST /srts/guards/${g1_id}/training"
              payload: { training_date: "2026-08-05", hours: 12, curriculum_code: "SRTS-BASIC" }
              as: CrossingSupervisor
              as_user_id: "sup-1"
            - call: "POST /srts/guards/${g1_id}/equipment"
              payload: { item_type: "HIGH_VIS_VEST", issued_on: "2026-08-06" }
              as: CrossingSupervisor
              as_user_id: "sup-1"
            - call: "POST /srts/guards/${g1_id}/equipment"
              payload: { item_type: "STOP_PADDLE", issued_on: "2026-08-06" }
              as: CrossingSupervisor
              as_user_id: "sup-1"
            - call: "POST /srts/guards/${g1_id}/equipment"
              payload: { item_type: "WHISTLE", issued_on: "2026-08-06" }
              as: CrossingSupervisor
              as_user_id: "sup-1"
            - call: "POST /srts/guards/${g1_id}/certify"
              payload: { certified_on: "2026-08-07", certification_expires_on: "2027-06-30" }
              as: CrossingSupervisor
              as_user_id: "sup-1"
            - call: "POST /srts/guard-posts"
              payload: { intersection_id: "${isx_id}", post_label: "Maple NW corner", zone_code: "Z-NORTH", required_shift: "AM" }
              as: CrossingSupervisor
              as_user_id: "sup-1"
              captures: { post_id: $.data.id }
            - call: "POST /srts/guard-posts/${post_id}/activate"
              payload: {}
              as: ProgramAdmin
              as_user_id: "adm-1"
              captures: { post_v: $.data.version }
            - call: "POST /srts/guard-posts"
              payload: { intersection_id: "${isx_id}", post_label: "Maple SE corner", zone_code: "Z-NORTH", required_shift: "AM" }
              as: CrossingSupervisor
              as_user_id: "sup-1"
              captures: { post_b_id: $.data.id }
            - call: "POST /srts/guard-posts/${post_b_id}/activate"
              payload: {}
              as: ProgramAdmin
              as_user_id: "adm-1"
              captures: { post_b_v: $.data.version }
            - call: "POST /srts/guard-posts"
              payload: { intersection_id: "${isx_id}", post_label: "Maple SW corner", zone_code: "Z-NORTH", required_shift: "PM" }
              as: CrossingSupervisor
              as_user_id: "sup-1"
              captures: { post_c_id: $.data.id }
            - call: "POST /srts/guard-posts/${post_c_id}/activate"
              payload: {}
              as: ProgramAdmin
              as_user_id: "adm-1"
              captures: { post_c_v: $.data.version }
            - call: "POST /srts/guard-posts/${post_id}/assignments"
              payload: { guard_id: "${g1_id}", start_date: "2026-09-08", end_date: "2026-09-18", expected_guard_post_version: "${post_v}" }
              as: CrossingSupervisor
              as_user_id: "sup-1"
              captures: { asg1_id: $.data.id }
            - call: "POST /srts/guard-posts/${post_b_id}/assignments"
              payload: { guard_id: "${g1_id}", start_date: "2026-09-19", end_date: "2026-09-25", expected_guard_post_version: "${post_b_v}" }
              as: CrossingSupervisor
              as_user_id: "sup-1"
              captures: { asg2_id: $.data.id }
            - call: "POST /srts/guard-posts/${post_c_id}/assignments"
              payload: { guard_id: "${g1_id}", start_date: "2026-09-08", end_date: "2026-09-18", expected_guard_post_version: "${post_c_v}" }
              as: CrossingSupervisor
              as_user_id: "sup-1"
              captures: { asg3_id: $.data.id }
          trigger:
            - call: "GET /srts/post-assignments"
              payload: { guard_id: "${g1_id}", limit: 2, offset: 0 }
              as: CrossingSupervisor
              as_user_id: "sup-1"
            - call: "GET /srts/post-assignments"
              payload: { guard_id: "${g1_id}", limit: 2, offset: 2 }
              as: CrossingSupervisor
              as_user_id: "sup-1"
          assert:
            - "first trigger call returns HTTP 200 with response_type array and exactly 2 items"
            - "first trigger call meta/pagination reports limit 2, offset 0, total_count 3, has_more true"
            - "second trigger call returns exactly 1 item with limit 2, offset 2, total_count 3, has_more false"
            - "the union of both pages is exactly {${asg1_id}, ${asg2_id}, ${asg3_id}} with no duplicates"

      - name: corner_intersection_not_found_returns_404
        claim_type: not_found
        grounds:
          - errors.ERR_INTERSECTION_NOT_FOUND
          - endpoints.GET_/srts/intersections/{id}
        distinguishing_aspect: |
          A well-formed id that names no row returns ERR_INTERSECTION_NOT_FOUND with HTTP
          404 and the error envelope shape, not an empty 200 object and not 400.
        test_recipe:
          setup:
            - "Empty database; no intersections exist."
          setup_api_calls:
            - call: "POST /srts/schools"
              payload: { name: "Cedar Point Elementary", district_code: "D-11", enrollment_count: 410, session_start_date: "2026-08-24", session_end_date: "2027-06-11", am_window_start_utc: "07:30", am_window_end_utc: "08:30", pm_window_start_utc: "15:00", pm_window_end_utc: "16:00", baseline_walk_bike_mode_share_pct: 12.25 }
              as: ProgramAdmin
              as_user_id: "adm-1"
              captures: { school_c_id: $.data.id }
          trigger:
            - call: "GET /srts/intersections/isx-00000000-0000-0000-0000-000000000000"
              payload: {}
              as: ProgramAdmin
              as_user_id: "adm-1"
          assert:
            - "response error id == ERR_INTERSECTION_NOT_FOUND with HTTP status 404"
            - "response_type == error and data.error_id == ERR_INTERSECTION_NOT_FOUND"

      - name: corner_school_missing_required_field_rejected
        claim_type: required_fields
        grounds:
          - errors.ERR_INVALID_REQUEST
          - endpoints.POST_/srts/schools
        distinguishing_aspect: |
          Omitting the required session_end_date returns ERR_INVALID_REQUEST with HTTP 400
          and creates nothing; the ten declared required inputs are not individually
          optional even though three other inputs are.
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls:
            - call: "POST /srts/schools"
              payload: { name: "Cedar Point Elementary", district_code: "D-11", enrollment_count: 410, session_start_date: "2026-08-24", session_end_date: "2027-06-11", am_window_start_utc: "07:30", am_window_end_utc: "08:30", pm_window_start_utc: "15:00", pm_window_end_utc: "16:00", baseline_walk_bike_mode_share_pct: 12.25 }
              as: ProgramAdmin
              as_user_id: "adm-1"
              captures: { school_c_id: $.data.id }
          trigger:
            - call: "POST /srts/schools"
              payload: { name: "Willow Bend Elementary", district_code: "D-12", enrollment_count: 380, session_start_date: "2026-08-24", am_window_start_utc: "07:30", am_window_end_utc: "08:30", pm_window_start_utc: "15:00", pm_window_end_utc: "16:00", baseline_walk_bike_mode_share_pct: 10.00 }
              as: ProgramAdmin
              as_user_id: "adm-1"
          assert:
            - "response error id == ERR_INVALID_REQUEST with HTTP status 400"
            - "no second School row exists — a subsequent GET /srts/schools/${school_c_id} still returns the only school created in setup"

      - name: corner_intersection_invalid_enum_and_inverted_range_rejected
        claim_type: type_constraints
        grounds:
          - errors.ERR_INVALID_REQUEST
          - entities.Intersection.fields.control_type
          - endpoints.POST_/srts/intersections
        distinguishing_aspect: |
          control_type ROUNDABOUT is not a declared member of {UNCONTROLLED, STOP_SIGN,
          SIGNALIZED} and must be rejected with ERR_INVALID_REQUEST (400); a School whose
          session_start_date is later than its session_end_date is rejected by the same
          error id for the inverted-range reason.
        test_recipe:
          setup:
            - "One school exists so the FK in the invalid-enum call resolves and the rejection is attributable to the enum alone."
          setup_api_calls:
            - call: "POST /srts/schools"
              payload: { name: "Maple Grove Elementary", district_code: "D-07", enrollment_count: 640, session_start_date: "2026-08-24", session_end_date: "2027-06-11", am_window_start_utc: "07:15", am_window_end_utc: "08:15", pm_window_start_utc: "14:45", pm_window_end_utc: "15:45", baseline_walk_bike_mode_share_pct: 18.50 }
              as: ProgramAdmin
              as_user_id: "adm-1"
              captures: { school_id: $.data.id }
          trigger:
            - call: "POST /srts/intersections"
              payload: { school_id: "${school_id}", cross_streets: "Oak St & 9th Ave", control_type: "ROUNDABOUT", speed_limit_mph: 30, lanes_crossed: 2, posted_school_zone: true }
              as: ProgramAdmin
              as_user_id: "adm-1"
            - call: "POST /srts/schools"
              payload: { name: "Willow Bend Elementary", district_code: "D-12", enrollment_count: 380, session_start_date: "2027-06-11", session_end_date: "2026-08-24", am_window_start_utc: "07:30", am_window_end_utc: "08:30", pm_window_start_utc: "15:00", pm_window_end_utc: "16:00", baseline_walk_bike_mode_share_pct: 10.00 }
              as: ProgramAdmin
              as_user_id: "adm-1"
          assert:
            - "first trigger call returns error id ERR_INVALID_REQUEST with HTTP status 400"
            - "second trigger call returns error id ERR_INVALID_REQUEST with HTTP status 400"
            - "no Intersection row and no second School row were created"

      - name: corner_intersection_requires_existing_parent_school
        claim_type: parent_relationships
        grounds:
          - errors.ERR_SCHOOL_NOT_FOUND
          - entities.Intersection.fields.school_id
        distinguishing_aspect: |
          A body FK naming no School returns ERR_SCHOOL_NOT_FOUND with HTTP 404 (the
          priority-34 body-FK existence band), not ERR_INVALID_REQUEST 400 and not a
          dangling intersection.
        test_recipe:
          setup:
            - "One school exists; the trigger cites a different, non-existent school id."
          setup_api_calls:
            - call: "POST /srts/schools"
              payload: { name: "Maple Grove Elementary", district_code: "D-07", enrollment_count: 640, session_start_date: "2026-08-24", session_end_date: "2027-06-11", am_window_start_utc: "07:15", am_window_end_utc: "08:15", pm_window_start_utc: "14:45", pm_window_end_utc: "15:45", baseline_walk_bike_mode_share_pct: 18.50 }
              as: ProgramAdmin
              as_user_id: "adm-1"
              captures: { school_id: $.data.id }
          trigger:
            - call: "POST /srts/intersections"
              payload: { school_id: "sch-00000000-0000-0000-0000-000000000000", cross_streets: "Oak St & 9th Ave", control_type: "UNCONTROLLED", speed_limit_mph: 30, lanes_crossed: 2, posted_school_zone: true }
              as: ProgramAdmin
              as_user_id: "adm-1"
          assert:
            - "response error id == ERR_SCHOOL_NOT_FOUND with HTTP status 404"
            - "GET /srts/schools/${school_id}/intersections returns an empty array"

      - name: corner_project_cannot_cite_complaint_from_another_intersection
        claim_type: graph
        grounds:
          - errors.ERR_COMPLAINT_NOT_REFERABLE
          - entities.InfrastructureProject.fields.source_complaint_id
          - validations.priority_66.ERR_COMPLAINT_NOT_REFERABLE
        distinguishing_aspect: |
          Graph-topology integrity across three aggregates: an InfrastructureProject joins
          a GrantProgram, an Intersection and optionally a Complaint, and the cited
          complaint must belong to the SAME intersection as the project. Citing a TRIAGED
          complaint from a different intersection returns ERR_COMPLAINT_NOT_REFERABLE (422)
          and leaves that complaint in TRIAGED with referred_project_id null.
        test_recipe:
          setup:
            - "School with two intersections: A (WARRANTED) and B (no study)."
            - "One HIGH SPEEDING complaint on intersection B, triaged REFER_TO_ENGINEERING so it is TRIAGED."
            - "One grant program with a 12,000,000-cent pool."
          setup_api_calls:
            - call: "POST /srts/schools"
              payload: { name: "Maple Grove Elementary", district_code: "D-07", enrollment_count: 640, session_start_date: "2026-08-24", session_end_date: "2027-06-11", am_window_start_utc: "07:15", am_window_end_utc: "08:15", pm_window_start_utc: "14:45", pm_window_end_utc: "15:45", baseline_walk_bike_mode_share_pct: 18.50 }
              as: ProgramAdmin
              as_user_id: "adm-1"
              captures: { school_id: $.data.id }
            - call: "POST /srts/intersections"
              payload: { school_id: "${school_id}", cross_streets: "Maple St & 3rd Ave", control_type: "UNCONTROLLED", speed_limit_mph: 30, lanes_crossed: 2, posted_school_zone: true }
              as: ProgramAdmin
              as_user_id: "adm-1"
              captures: { isx_id: $.data.id }
            - call: "POST /srts/intersections/${isx_id}/crash-records"
              payload: { crash_date: "2023-10-01", severity: "INJURY", involved_pedestrian: true, involved_school_age: true }
              as: TrafficEngineer
              as_user_id: "eng-1"
            - call: "POST /srts/intersections/${isx_id}/crash-records"
              payload: { crash_date: "2025-05-14", severity: "SEVERE_INJURY", involved_pedestrian: true, involved_school_age: true }
              as: TrafficEngineer
              as_user_id: "eng-1"
              captures: { isx_v: $.data.version }
            - call: "POST /srts/warrant-studies"
              payload: { intersection_id: "${isx_id}", count_window_start: "2026-09-08", count_window_end: "2026-09-30", expected_intersection_version: "${isx_v}" }
              as: TrafficEngineer
              as_user_id: "eng-1"
              captures: { study_id: $.data.id }
            - call: "POST /srts/warrant-studies/${study_id}/count-sessions"
              payload: { session_date: "2026-09-08", period: "AM_ARRIVAL", observed_minutes: 60, child_count: 70, adult_count: 10, vehicle_count: 500, adequate_gaps: 28 }
              as: TrafficEngineer
              as_user_id: "eng-1"
            - call: "POST /srts/warrant-studies/${study_id}/count-sessions"
              payload: { session_date: "2026-09-09", period: "PM_DISMISSAL", observed_minutes: 60, child_count: 50, adult_count: 8, vehicle_count: 380, adequate_gaps: 20 }
              as: TrafficEngineer
              as_user_id: "eng-1"
            - call: "POST /srts/warrant-studies/${study_id}/analyze"
              payload: {}
              as: TrafficEngineer
              as_user_id: "eng-1"
            - call: "POST /srts/warrant-studies/${study_id}/finalize"
              payload: { engineer_note: "Adopt WARRANTED determination." }
              as: TrafficEngineer
              as_user_id: "eng-2"
            - call: "POST /srts/intersections"
              payload: { school_id: "${school_id}", cross_streets: "Birch St & 4th Ave", control_type: "UNCONTROLLED", speed_limit_mph: 30, lanes_crossed: 2, posted_school_zone: true }
              as: ProgramAdmin
              as_user_id: "adm-1"
              captures: { isx_b_id: $.data.id }
            - call: "POST /srts/intersections/${isx_b_id}/complaints"
