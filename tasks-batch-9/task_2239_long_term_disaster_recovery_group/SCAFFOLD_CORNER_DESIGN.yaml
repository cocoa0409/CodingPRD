            - "GET /housing-assignments?lodging_site_id=${lg}&status=ACTIVE: total_count 1, containing only ${hq}."

  - section: calculations
    instances:
      - name: corner_verified_damage_total_caps_each_item_before_summing
        claim_type: constants_applied
        grounds: ["calculations.verified_damage_total", "calculations.verified_damage_total.constants.CATEGORY_CAP_CENTS"]
        distinguishing_aspect: "CATEGORY_CAP_CENTS must be applied per item BEFORE summation: a STRUCTURE item verified at 13000000 contributes 12000000 and a CONTENTS item verified at 2000000 contributes 1500000, giving 13500000. Capping the sum instead of the items (a single 12000000 STRUCTURE ceiling on the 15000000 raw total) yields 12000000."
        test_recipe:
          setup:
            - "One case with a STRUCTURE item verified at 13000000 (cap 12000000) and a CONTENTS item verified at 2000000 (cap 1500000)."
          setup_api_calls:
            - call: POST /_clock/set_current_utc
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
