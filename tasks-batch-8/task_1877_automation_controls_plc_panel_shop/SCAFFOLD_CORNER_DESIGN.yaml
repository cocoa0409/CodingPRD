              payload: { component_id: "${comp_sd}", quantity: 1 }
              as: DesignEngineer
            - call: "POST /panel-shop/panels/${p_sd}/submit-review"
              payload: {}
              as: DesignEngineer
          trigger:
            - call: "POST /panel-shop/panels/${p_sd}/approve-design"
              payload: {}
