      - { name: name, type: string, source: input, description: "Plan display name" }
      - { name: tier, type: enum, source: input, description: "Plan tier", constraints: "BASIC | PREMIER | ELITE" }
      - { name: monthly_fee_cents, type: integer, source: input, description: "Recurring monthly fee, integer cents", constraints: ">= 0" }
      - { name: monthly_court_credits, type: integer, source: input, description: "Court-time credits granted each period (1 credit = 1 booked hour)", constraints: ">= 0" }
      - { name: peak_access, type: boolean, source: input, description: "Whether credits may be spent on peak-hour reservations" }
      - { name: guest_fee_cents, type: integer, source: input, description: "Fee charged per guest brought to a reservation", constraints: ">= 0" }
      - { name: freeze_limit, type: integer, source: input, description: "Maximum number of freezes allowed per subscription lifetime", constraints: ">= 0" }

  - name: Member
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: full_name, type: string, source: input, description: "Member full name" }
      - { name: email, type: string, source: input, description: "Unique contact email", constraints: "unique across Members" }
      - { name: status, type: enum, source: system, description: "Account state", default: ACTIVE, constraints: "ACTIVE | SUSPENDED" }
      - { name: no_show_strikes, type: integer, source: computed, description: "Cumulative unresolved no-show strikes; drives auto-suspension", default: 0 }
      - { name: account_balance_cents, type: integer, source: computed, description: "Running ledger of charges minus payments/refunds; positive = owed by member", default: 0 }

  - name: Subscription
    parent: null
    common_fields: true
    fields:
