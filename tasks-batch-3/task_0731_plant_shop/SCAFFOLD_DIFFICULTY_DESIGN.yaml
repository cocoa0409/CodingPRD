            - call: "POST /plants/${plant_id}/stock-units"
              payload: { acquisition_date: "2026-03-25T00:00:00Z" }
              as: ShopStaff
            - call: "POST /orders"
              payload: { customer_id: "${cust_a_id}", delivery_zone: "ZONE_A", lines: [{ plant_id: "${plant_id}", qty: 1 }] }
              as: Customer
              as_user_id: "${cust_a_id}"
              captures: { order_id: "$.data.id" }
