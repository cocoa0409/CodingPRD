          trigger:
            - { call: "POST /lab/orders/${order_id}/submit", payload: {}, as: Customer, as_user_id: "${cust_b}", captures: { err: "$.data.error_id" } }
          assert:
            - "captured err == ERR_RESOURCE_OWNERSHIP_VIOLATION and HTTP status == 403"
            - "Order.${order_id}.status remains DRAFT"

      - name: inventory_clerk_cannot_disposition_excursion
        claim_type: role_denial
        grounds: [roles, "errors[ERR_FORBIDDEN_ROLE]"]
        distinguishing_aspect: "Disposition is QualityManager-exclusive; InventoryClerk gets 403 ERR_FORBIDDEN_ROLE even with a valid OPEN excursion."
        test_recipe:
