        claim_type: rate_threshold_triggers
        grounds:
          - complexity_profile.complexity_layers
          - calculations.counter_posture_derivation
          - validations[priority=34]
          - errors.ERR_COUNTER_SUSPENDED
          - entities.Counter.fields.open_excursion_count
        distinguishing_aspect: |
          Posture escalates on a COUNT, not on a single event: one open excursion RESTRICTS and
          the second one SUSPENDS, which blocks even read-adjacent compliance work such as
          drawing a verification sample. Resolving one excursion drops the count back to 1, and
          sampling immediately becomes possible again -- so posture must be re-derived on
          resolve, not latched.
