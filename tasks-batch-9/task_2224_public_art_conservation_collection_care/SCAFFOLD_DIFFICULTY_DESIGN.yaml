              as: CollectionsRegistrar
              as_user_id: "reg-1"
              captures: { site_id: $.data.id }
            - call: "POST /public-art/artworks"
              payload: { accession_number: "2024.001", title: "Standing Figure", artist_id: "${artist_id}", site_id: "${site_id}", material_class: "BRONZE", significance_tier: "LANDMARK", footprint_units: 6, insured_value_cents: 12000000, acquisition_date: "2014-06-01", acquisition_document_ref: "DEED-2014-001", recognized_stature: false }
              as: CollectionsRegistrar
              as_user_id: "reg-1"
              captures: { artwork_id: $.data.id }
            - call: "POST /public-art/conservators"
              payload: { firm_name: "Patina Studio", accreditation: "AIC_PA", material_specialties: ["BRONZE", "STONE"], hourly_rate_cents: 14500, insurance_expires_on: "2027-01-31" }
              as: PublicArtManager
              as_user_id: "mgr-1"
              captures: { cons_id: $.data.id }
            - call: "POST /public-art/condition-assessments"
              payload: { artwork_id: "${artwork_id}", cycle_year: 2026, assessed_on: "2026-07-15", surface_score: 3, structural_score: 2, coating_score: 2, mount_score: 1, graffiti_score: 2 }
              as: ConditionSurveyor
              as_user_id: "surv-1"
              captures: { assess_id: $.data.id }
            - call: "POST /public-art/condition-assessments/${assess_id}/photos"
              payload: { view_code: "FRONT", media_ref: "media/a/1.jpg" }
              as: ConditionSurveyor
              as_user_id: "surv-1"
            - call: "POST /public-art/condition-assessments/${assess_id}/photos"
              payload: { view_code: "SIDE", media_ref: "media/a/2.jpg" }
              as: ConditionSurveyor
              as_user_id: "surv-1"
            - call: "POST /public-art/condition-assessments/${assess_id}/photos"
              payload: { view_code: "DETAIL", media_ref: "media/a/3.jpg" }
              as: ConditionSurveyor
              as_user_id: "surv-1"
            - call: "POST /public-art/condition-assessments/${assess_id}/submit"
              payload: { surveyor_note: "condition poor" }
              as: ConditionSurveyor
              as_user_id: "surv-1"
            - call: "POST /public-art/condition-assessments/${assess_id}/finalize"
              payload: { finalization_note: "treatment required" }
              as: ChiefConservator
              as_user_id: "chief-1"
            - call: "GET /public-art/artworks/${artwork_id}"
              payload: {}
              as: ChiefConservator
              as_user_id: "chief-1"
              captures: { aw_v: $.data.version }
            - call: "POST /public-art/treatment-proposals"
              payload: { artwork_id: "${artwork_id}", conservator_id: "${cons_id}", assessment_id: "${assess_id}", treatment_scope: "COATING", engagement_start: "2026-09-01T00:00:00Z", engagement_end: "2026-09-05T00:00:00Z", expected_artwork_version: "${aw_v}", alters_appearance: false }
              as: ChiefConservator
              as_user_id: "chief-1"
              captures: { prop_id: $.data.id }
            - call: "POST /public-art/treatment-proposals/${prop_id}/line-items"
              payload: { labor_hours: 12.5, complexity_class: "COATING", materials_cents: 82500, description: "recoat and wax" }
              as: ChiefConservator
              as_user_id: "chief-1"
          trigger:
            - call: "POST /public-art/treatment-proposals/${prop_id}/line-items"
              payload: { labor_hours: 12.5, complexity_class: "SURFACE", materials_cents: 15000, description: "surface cleaning" }
              as: ChiefConservator
              as_user_id: "chief-1"
          assert:
            - "TreatmentProposal.${prop_id}.line_items[0].labor_cents == 226563"
            - "TreatmentProposal.${prop_id}.line_items[1].labor_cents == 208438"
            - "TreatmentProposal.${prop_id}.subtotal_cents == 532501"
            - "TreatmentProposal.${prop_id}.overhead_cents == 61238"
            - "TreatmentProposal.${prop_id}.contingency_cents == 44530"
            - "TreatmentProposal.${prop_id}.mobilization_cents == 45000"
            - "TreatmentProposal.${prop_id}.estimate_total_cents == 683269"

      - name: pool_supplemental_tier_keyed_on_gross_draw_mode_c
        grounds:
          - calculations.pool_draw_available_cents
          - entities.FundingPool.fields.draw_authorized_cents
          - entities.FundingPool.fields.admin_fee_cents
          - entities.FundingPool.fields.available_cents
          - endpoints["POST /public-art/funding-pools"]
        distinguishing_aspect: |
          Mode (c) circular-looking dependency: the admin fee is a percentage of the authorized amount
          while the supplemental tier is keyed on the draw, so evaluation order decides the value. The
          scaffold pins tier selection to the PRE-fee gross draw: 400000000 at 450 bps grosses 18000000
          (tier 75 bps) and authorizes 20527500, whereas keying the tier on the post-fee figure would
          cross TIER2_FLOOR_CENTS and wrongly authorize 22482500.
        test_recipe:
          setup:
            - "empty database, logical clock explicitly pinned to 2026-08-01T00:00:00Z"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PublicArtManager
              as_user_id: "mgr-1"
          trigger:
            - call: "POST /public-art/funding-pools"
              payload: { pool_code: "END-BIG", pool_type: "ENDOWMENT", fiscal_year: 2026, principal_cents: 400000000, draw_rate_bps: 450 }
              as: FinanceOfficer
              as_user_id: "fin-1"
              captures: { big_pool_id: $.data.id }
            - call: "POST /public-art/funding-pools"
              payload: { pool_code: "END-SMALL", pool_type: "ENDOWMENT", fiscal_year: 2026, principal_cents: 80000000, draw_rate_bps: 450 }
              as: FinanceOfficer
              as_user_id: "fin-1"
              captures: { small_pool_id: $.data.id }
          assert:
            - "FundingPool.${big_pool_id}.admin_fee_cents == 472500"
            - "FundingPool.${big_pool_id}.draw_authorized_cents == 20527500"
            - "FundingPool.${big_pool_id}.available_cents == 20527500"
            - "FundingPool.${small_pool_id}.admin_fee_cents == 81000"
            - "FundingPool.${small_pool_id}.draw_authorized_cents == 3519000"
            - "FundingPool.${small_pool_id}.available_cents == 3519000"

  - rule_id: non_linear_state_machine
    instances:
      - name: assessment_revision_loop_reenters_submitted_until_round_cap
        grounds:
          - state_machines.ConditionAssessment.SUBMITTED_to_REVISION_REQUESTED
          - state_machines.ConditionAssessment.REVISION_REQUESTED_to_SUBMITTED
          - entities.ConditionAssessment.fields.revision_rounds
          - validations[priority=35]
          - errors[ERR_REVISION_LIMIT_REACHED]
        distinguishing_aspect: |
          Cycle on ConditionAssessment: SUBMITTED -> REVISION_REQUESTED -> SUBMITTED is traversed twice,
          restamping submitted_by_user_id each round, and the loop terminates at MAX_REVISION_ROUNDS 2 so
          the third request-revision is refused with ERR_REVISION_LIMIT_REACHED while status stays SUBMITTED.
        test_recipe:
          setup:
            - "logical clock at its default 2026-08-01T00:00:00Z"
            - "one BRONZE artwork with a ConditionAssessment carrying three photos, already once around the loop: status REVISION_REQUESTED with revision_rounds == 1"
          setup_api_calls:
            - call: "POST /public-art/artists"
