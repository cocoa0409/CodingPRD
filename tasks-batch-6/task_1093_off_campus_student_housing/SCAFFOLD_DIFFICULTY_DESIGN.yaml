            - "Payout.${po1}.platform_fee_cents == 17760"
            - "Payout.${po1}.holdback_cents == 3947"
            - "Payout.${po1}.subtotal_cents == 175627"
            - "Payout.${po1}.rebate_cents == 1776"
            - "Payout.${po1}.net_amount_cents == 177403"
            - "Payout.${po1}.status == SUBMITTED and Payout.${po1}.submitted_by_user_id == admin-1"

  - rule_id: non_linear_state_machine
    instances:
      - name: lease_status_and_funding_status_axes_move_independently
        grounds:
          - state_machines.Lease.lease_status.PENDING_SIGNATURE_to_ACTIVE
          - state_machines.Lease.funding_status.UNFUNDED_to_DELINQUENT
          - state_machines.Lease.funding_status.DELINQUENT_to_CURRENT
          - state_machines.Installment.SCHEDULED_to_LATE
          - calculations.lease_funding_status
          - entities.Lease.fields.funding_status
        distinguishing_aspect: |
          Non-linearity type: PARALLEL state dimensions on ONE Lease row. The clock
          checkpoint drives funding_status UNFUNDED -> DELINQUENT and the payment drives
          it DELINQUENT -> CURRENT while lease_status stays pinned at ACTIVE across both
          events; neither axis gates the other.
        test_recipe:
          setup:
            - "Base fixture: PREFERRED university SU, LISTED property, 4-bed unit at 90000 cents per bed."
            - "One VERIFIED student with an ACTIVE 10-installment lease (first RENT installment 98667 due 2026-08-15)."
            - "Logical clock still at its 2026-05-01T00:00:00Z default when the trigger begins."
          setup_api_calls:
            - call: "POST /universities"
              payload: { name: "State University", code: "SU", partner_tier: "PREFERRED", verification_required: true, academic_year_start_date: "2026-08-15", academic_year_end_date: "2027-05-15", partner_admin_user_id: "uni-admin-su" }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { uni_su: $.data.id }
            - call: "POST /properties"
              payload: { university_id: "${uni_su}", name: "Maple Commons", address_line: "12 Maple St", distance_to_campus_m: 800 }
              as: PropertyManager
              as_user_id: "mgr-1"
              captures: { prop1: $.data.id }
            - call: "POST /units"
              payload: { property_id: "${prop1}", unit_number: "101", floorplan_code: "4x2", bedroom_count: 4, bathroom_count: 2, bed_labels: ["A", "B", "C", "D"], base_rent_cents_per_bed_monthly: 90000 }
              as: PropertyManager
              as_user_id: "mgr-1"
              captures: { unit1: $.data.id }
            - call: "POST /properties/${prop1}/list"
              payload: {}
