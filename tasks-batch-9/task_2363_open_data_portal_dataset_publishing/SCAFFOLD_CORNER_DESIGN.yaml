              as_user_id: "${dept_id}"
            - call: "POST /open-data/metadata-records/${md_a_id}/decide"
              payload: { decision: "ACCEPT" }
              as: PortalAdmin
            - call: "POST /open-data/privacy-assessments"
              payload: { dataset_id: "${ds_a_id}", declared_quasi_identifier_count: 2, declared_smallest_cell_size: 20, population_size: 100000 }
              as: PrivacyReviewer
              as_user_id: "pr-analyst-1"
              captures: { pa_a_id: "$.data.id" }
