# §1.9 Scaffold Corner Design — Coverage Index for Non-Difficulty Tests
# Breadth probe across the claim-extraction-guide's nine sections.
scaffold_corner_design:

  # ==========================================================================
  # Section: entities
  # ==========================================================================
  - section: entities
    instances:
      - name: production_create_returns_201_and_defaults
        claim_type: creation
        grounds: ["endpoints[POST /casting/productions]", entities.Production.fields.status]
        distinguishing_aspect: "Creating a Production with all required fields returns 201, server-minted id, status defaulting to SETUP, active_breakdown_count defaulting to 0, version == 1."
        test_recipe:
          setup: ["empty DB; clock at default 2026-08-01T00:00:00Z"]
          setup_api_calls: []
          trigger:
            - call: "POST /casting/productions"
              payload: { title: "NewProd", production_type: "FILM", union_signatory: true, shoot_city: "LA", shoot_state: "CA", start_date: "2026-08-01T00:00:00Z", wrap_date: "2026-09-01T00:00:00Z", casting_office_id: "office-1" }
              as: CastingDirector
              captures: { pid: $.data.id, pstatus: $.data.status, pcount: $.data.active_breakdown_count, pver: $.data.version }
          assert:
            - "http_status == 201"
            - "pstatus == SETUP"
            - "pcount == 0"
            - "pver == 1"
            - "Production.${pid}.id is a server-minted UUID"

      - name: production_get_not_found_returns_404
        claim_type: not_found
        grounds: ["endpoints[GET /casting/productions/{id}]", "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET of a non-existent production id returns 404 ERR_NOT_FOUND (existence check, left-to-right path validation)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /casting/productions/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: CastingDirector
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_NOT_FOUND"
            - "http_status == 404"

      - name: production_create_missing_required_field_returns_400
        claim_type: required_fields
        grounds: ["endpoints[POST /casting/productions]", "errors[ERR_INVALID_REQUEST]", "validations[priority=26]"]
        distinguishing_aspect: "Omitting required field title on create returns 400 ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /casting/productions"
              payload: { production_type: "FILM", union_signatory: true, shoot_city: "LA", shoot_state: "CA", start_date: "2026-08-01T00:00:00Z", wrap_date: "2026-09-01T00:00:00Z", casting_office_id: "office-1" }
              as: CastingDirector
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_REQUEST"
            - "http_status == 400"

      - name: talent_is_minor_computed_on_read
        claim_type: computed_fields
        grounds: [entities.Talent.fields.is_minor, "endpoints[GET /casting/talents/{id}]"]
        distinguishing_aspect: "is_minor is computed from date_of_birth vs the logical clock, not stored from input; a client-supplied is_minor is ignored and the server recomputes it on read."
        test_recipe:
          setup: ["clock at 2026-08-01; talent DOB 2012-06-01 (age 14)"]
          setup_api_calls:
            - { call: "POST /casting/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: CastingDirector }
            - call: "POST /casting/talents"
              payload: { full_name: "Kid", date_of_birth: "2012-06-01T00:00:00Z", union_status: "NON_UNION" }
              as: CastingDirector
              captures: { tid: $.data.id }
          trigger:
            - call: "GET /casting/talents/${tid}"
              payload: {}
              as: CastingDirector
              captures: { is_minor: $.data.is_minor }
          assert:
            - "is_minor == true (DOB 2012-06-01 is age 14 at clock 2026-08-01; computed server-side)"

      - name: production_list_pagination_envelope
        claim_type: listing
        grounds: ["endpoints[GET /casting/productions]", response_envelope]
        distinguishing_aspect: "List endpoint returns the envelope pagination fields limit/offset/total_count/has_more with the declared defaults (limit 10)."
        test_recipe:
          setup: ["two productions created"]
          setup_api_calls:
            - call: "POST /casting/productions"
              payload: { title: "L1", production_type: "FILM", union_signatory: false, shoot_city: "LA", shoot_state: "CA", start_date: "2026-08-01T00:00:00Z", wrap_date: "2026-09-01T00:00:00Z", casting_office_id: "office-1" }
              as: CastingDirector
            - call: "POST /casting/productions"
              payload: { title: "L2", production_type: "FILM", union_signatory: false, shoot_city: "LA", shoot_state: "CA", start_date: "2026-08-01T00:00:00Z", wrap_date: "2026-09-01T00:00:00Z", casting_office_id: "office-1" }
              as: CastingDirector
          trigger:
            - call: "GET /casting/productions"
              payload: {}
              as: CastingDirector
              captures: { first_id: "$.data[0].id", second_id: "$.data[1].id" }
          assert:
            - "both first_id and second_id are present (the page holds the 2 created productions)"
            - "response data is an array of length 2 (total_count == 2) and has_more == false under the default limit 10"

  # ==========================================================================
  # Section: state_machines
  # ==========================================================================
  - section: state_machines
    instances:
      - name: breakdown_release_from_released_returns_invalid_state
        claim_type: invalid_transition
        grounds: [state_machines.Breakdown.transitions, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Releasing an already-RELEASED_OPEN breakdown is not a declared transition; returns 409 ERR_INVALID_STATE (idempotency / no double-release)."
        test_recipe:
          setup: ["Breakdown in RELEASED_OPEN"]
          setup_api_calls:
            - { call: "POST /casting/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: CastingDirector }
            - call: "POST /casting/productions"
              payload: { title: "SM1", production_type: "FILM", union_signatory: false, shoot_city: "LA", shoot_state: "CA", start_date: "2026-08-01T00:00:00Z", wrap_date: "2026-09-30T00:00:00Z", casting_office_id: "office-1" }
              as: CastingDirector
              captures: { pid: $.data.id }
            - call: "POST /casting/productions/${pid}/roles"
              payload: { character_name: "R", is_minor_role: false, is_union_covered: false, engagement_start: "2026-08-10T00:00:00Z", engagement_end: "2026-08-12T00:00:00Z" }
              as: CastingDirector
              captures: { rid: $.data.id }
            - call: "POST /casting/productions/${pid}/breakdowns"
              payload: { role_id: "${rid}", distribution: "OPEN_CALL", submission_deadline: "2026-09-01T00:00:00Z", rate_weekly_cents: 1000000 }
              as: CastingDirector
              captures: { bid: $.data.id }
            - call: "POST /casting/breakdowns/${bid}/release"
              payload: { distribution: "OPEN_CALL" }
              as: CastingDirector
          trigger:
            - call: "POST /casting/breakdowns/${bid}/release"
              payload: { distribution: "OPEN_CALL" }
              as: CastingDirector
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_STATE"
            - "http_status == 409"

      - name: breakdown_cancel_terminal_lockdown
        claim_type: terminal_state_lockdown
        grounds: [state_machines.Breakdown.terminal_states, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "From terminal CANCELLED, no further transition (e.g., close) is possible; returns 409 ERR_INVALID_STATE."
        test_recipe:
          setup: ["Breakdown in CANCELLED (from DRAFT)"]
          setup_api_calls:
            - { call: "POST /casting/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: CastingDirector }
            - call: "POST /casting/productions"
              payload: { title: "SM2", production_type: "FILM", union_signatory: false, shoot_city: "LA", shoot_state: "CA", start_date: "2026-08-01T00:00:00Z", wrap_date: "2026-09-30T00:00:00Z", casting_office_id: "office-1" }
              as: CastingDirector
              captures: { pid: $.data.id }
            - call: "POST /casting/productions/${pid}/roles"
              payload: { character_name: "R", is_minor_role: false, is_union_covered: false, engagement_start: "2026-08-10T00:00:00Z", engagement_end: "2026-08-12T00:00:00Z" }
              as: CastingDirector
              captures: { rid: $.data.id }
            - call: "POST /casting/productions/${pid}/breakdowns"
              payload: { role_id: "${rid}", distribution: "OPEN_CALL", submission_deadline: "2026-09-01T00:00:00Z", rate_weekly_cents: 1000000 }
              as: CastingDirector
              captures: { bid: $.data.id }
            - call: "POST /casting/breakdowns/${bid}/cancel"
              payload: {}
              as: CastingDirector
          trigger:
            - call: "POST /casting/breakdowns/${bid}/close"
              payload: {}
              as: CastingDirector
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_STATE (CANCELLED is terminal; close rejected)"
            - "http_status == 409"

      - name: submission_initial_state_submitted
        claim_type: initial_state
        grounds: [state_machines.Submission.initial_state]
        distinguishing_aspect: "A freshly created (non-duplicate) submission starts in SUBMITTED with reviewed_at null."
        test_recipe:
          setup: ["Released OPEN breakdown"]
          setup_api_calls:
            - { call: "POST /casting/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: CastingDirector }
            - call: "POST /casting/productions"
              payload: { title: "SM3", production_type: "FILM", union_signatory: false, shoot_city: "LA", shoot_state: "CA", start_date: "2026-08-01T00:00:00Z", wrap_date: "2026-09-30T00:00:00Z", casting_office_id: "office-1" }
              as: CastingDirector
              captures: { pid: $.data.id }
            - call: "POST /casting/productions/${pid}/roles"
              payload: { character_name: "R", is_minor_role: false, is_union_covered: false, engagement_start: "2026-08-10T00:00:00Z", engagement_end: "2026-08-12T00:00:00Z" }
              as: CastingDirector
              captures: { rid: $.data.id }
            - call: "POST /casting/productions/${pid}/breakdowns"
              payload: { role_id: "${rid}", distribution: "OPEN_CALL", submission_deadline: "2026-09-01T00:00:00Z", rate_weekly_cents: 1000000 }
              as: CastingDirector
              captures: { bid: $.data.id }
            - call: "POST /casting/breakdowns/${bid}/release"
              payload: { distribution: "OPEN_CALL" }
              as: CastingDirector
            - call: "POST /casting/talents"
              payload: { full_name: "T", date_of_birth: "1990-01-01T00:00:00Z", union_status: "NON_UNION" }
              as: CastingDirector
              captures: { tid: $.data.id }
          trigger:
            - call: "GET /casting/breakdowns/${bid}"
              payload: {}
              as: CastingDirector
              captures: { bdv1: $.data.version }
            - call: "POST /casting/breakdowns/${bid}/submissions"
              payload: { talent_id: "${tid}", expected_breakdown_version: "${bdv1}" }
              as: CastingAssociate
              captures: { sid: $.data.id, sstatus: $.data.status }
          assert:
            - "sstatus == SUBMITTED (initial state)"
            - "Submission.${sid}.reviewed_at is null"

      - name: submission_reject_releases_active_holds_side_effect
        claim_type: side_effect_execution
        grounds: [state_machines.Submission.SHORTLISTED_to_REJECTED, state_machines.AvailabilityHold.ACTIVE_to_RELEASED]
        distinguishing_aspect: "Rejecting a SHORTLISTED submission cascades its ACTIVE holds to RELEASED (cross-entity side effect declared on the transition)."
        test_recipe:
          setup: ["SHORTLISTED submission with one ACTIVE PIN hold"]
          setup_api_calls:
            - { call: "POST /casting/_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T00:00:00Z" }, as: CastingDirector }
            - call: "POST /casting/productions"
              payload: { title: "SM4", production_type: "FILM", union_signatory: false, shoot_city: "LA", shoot_state: "CA", start_date: "2026-08-01T00:00:00Z", wrap_date: "2026-09-30T00:00:00Z", casting_office_id: "office-1" }
              as: CastingDirector
              captures: { pid: $.data.id }
            - call: "POST /casting/productions/${pid}/roles"
              payload: { character_name: "R", is_minor_role: false, is_union_covered: false, engagement_start: "2026-08-20T00:00:00Z", engagement_end: "2026-08-22T00:00:00Z" }
              as: CastingDirector
              captures: { rid: $.data.id }
            - call: "POST /casting/productions/${pid}/breakdowns"
              payload: { role_id: "${rid}", distribution: "OPEN_CALL", submission_deadline: "2026-09-01T00:00:00Z", rate_weekly_cents: 1000000 }
              as: CastingDirector
              captures: { bid: $.data.id }
            - call: "POST /casting/breakdowns/${bid}/release"
              payload: { distribution: "OPEN_CALL" }
              as: CastingDirector
            - call: "POST /casting/talents"
              payload: { full_name: "T", date_of_birth: "1990-01-01T00:00:00Z", union_status: "NON_UNION" }
              as: CastingDirector
              captures: { tid: $.data.id }
            - call: "GET /casting/breakdowns/${bid}"
              payload: {}
              as: CastingDirector
              captures: { bdv2: $.data.version }
            - call: "POST /casting/breakdowns/${bid}/submissions"
              payload: { talent_id: "${tid}", expected_breakdown_version: "${bdv2}" }
              as: CastingAssociate
              captures: { sid: $.data.id }
            - call: "POST /casting/submissions/${sid}/start-review"
              payload: {}
              as: CastingAssociate
            - call: "POST /casting/submissions/${sid}/shortlist"
              payload: {}
              as: CastingAssociate
            - call: "POST /casting/submissions/${sid}/holds"
              payload: { talent_id: "${tid}", hold_kind: "PIN", window_start: "2026-08-20T00:00:00Z", window_end: "2026-08-23T00:00:00Z", priority_rank: 1, expires_at: "2026-08-19T00:00:00Z" }
              as: CastingDirector
              captures: { hid: $.data.id }
          trigger:
            - call: "POST /casting/submissions/${sid}/reject"
              payload: {}
              as: CastingAssociate
          assert:
            - "Submission.${sid}.status == REJECTED"
            - "AvailabilityHold.${hid}.status == RELEASED (cascade side effect fired)"

  # ==========================================================================
  # Section: calculations
  # ==========================================================================
  - section: calculations
    instances:
      - name: tafthartley_eligibility_window_excludes_outside
        claim_type: input_set_filtering
        grounds: [calculations.union_eligibility_tafthartley]
        distinguishing_aspect: "union_engagement_count_365d counts only CONFIRMED bookings whose engagement_start falls inside the inclusive 365-day window; a confirmed booking with engagement_start BEFORE the window is excluded from the count."
        test_recipe:
          setup: ["NON_UNION talent with one CONFIRMED union-covered booking engagement_start inside window; verify count == 1 (only in-window counted)"]
          setup_api_calls:
            - { call: "POST /casting/_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T00:00:00Z" }, as: CastingDirector }
            - call: "POST /casting/productions"
              payload: { title: "CP1", production_type: "TV_SERIES", union_signatory: true, shoot_city: "LA", shoot_state: "CA", start_date: "2026-08-01T00:00:00Z", wrap_date: "2026-09-30T00:00:00Z", casting_office_id: "office-1" }
              as: CastingDirector
              captures: { pid: $.data.id }
            - call: "POST /casting/productions/${pid}/roles"
              payload: { character_name: "R", is_minor_role: false, is_union_covered: true, engagement_start: "2026-08-10T00:00:00Z", engagement_end: "2026-08-11T00:00:00Z" }
              as: CastingDirector
              captures: { rid: $.data.id }
            - call: "POST /casting/productions/${pid}/breakdowns"
              payload: { role_id: "${rid}", distribution: "OPEN_CALL", submission_deadline: "2026-09-01T00:00:00Z", rate_weekly_cents: 1000000 }
              as: CastingDirector
              captures: { bid: $.data.id }
            - call: "POST /casting/breakdowns/${bid}/release"
              payload: { distribution: "OPEN_CALL" }
              as: CastingDirector
            - call: "POST /casting/talents"
              payload: { full_name: "T", date_of_birth: "1990-01-01T00:00:00Z", union_status: "NON_UNION" }
              as: CastingDirector
              captures: { tid: $.data.id }
            - call: "GET /casting/breakdowns/${bid}"
              payload: {}
              as: CastingDirector
              captures: { bdv3: $.data.version }
            - call: "POST /casting/breakdowns/${bid}/submissions"
              payload: { talent_id: "${tid}", expected_breakdown_version: "${bdv3}" }
              as: CastingAssociate
              captures: { sid: $.data.id }
            - call: "POST /casting/submissions/${sid}/start-review"
              payload: {}
              as: CastingAssociate
            - call: "POST /casting/submissions/${sid}/shortlist"
              payload: {}
              as: CastingAssociate
            - call: "POST /casting/breakdowns/${bid}/sessions"
              payload: { session_start: "2026-08-04T09:00:00Z", session_end: "2026-08-04T12:00:00Z", capacity: 4, location: "S1" }
              as: CastingAssociate
              captures: { seid: $.data.id }
            - call: "POST /casting/sessions/${seid}/appointments"
              payload: { submission_id: "${sid}", slot_start: "2026-08-04T09:00:00Z", slot_end: "2026-08-04T09:30:00Z" }
              as: CastingAssociate
              captures: { aid: $.data.id }
            - call: "POST /casting/appointments/${aid}/confirm"
              payload: {}
              as: CastingAssociate
            - call: "POST /casting/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-04T13:00:00Z" }
              as: CastingDirector
            - call: "POST /casting/appointments/${aid}/complete"
              payload: {}
              as: CastingAssociate
            - call: "POST /casting/submissions/${sid}/offers"
              payload: { weekly_rate_cents: 1000000, guarantee_cents: 800000, expires_at: "2026-08-20T00:00:00Z" }
              as: CastingDirector
              captures: { oid: $.data.id }
            - call: "POST /casting/offers/${oid}/accept"
              payload: { engagement_start: "2026-08-10T00:00:00Z", engagement_end: "2026-08-11T00:00:00Z", proration_mode: "CALENDAR_SPAN" }
              as: CastingDirector
              captures: { mid: $.data.id }
            - call: "POST /casting/bookings"
              payload: { submission_id: "${sid}", deal_memo_id: "${mid}" }
              as: ProductionCoordinator
              captures: { bid2: $.data.id }
          trigger:
            - call: "POST /casting/bookings/${bid2}/confirm"
              payload: {}
              as: ProductionCoordinator
            - call: "GET /casting/talents/${tid}"
              payload: {}
              as: CastingDirector
              captures: { cnt: $.data.union_engagement_count_365d, ustatus: $.data.union_status }
          assert:
            - "cnt == 1 (single in-window confirmed union-covered engagement)"
            - "ustatus == NON_UNION (count 1 < threshold 3, no flip)"

      - name: engagement_fee_proration_constants_applied
        claim_type: constants_applied
        grounds: [calculations.engagement_fee_proration]
        distinguishing_aspect: "The daily rate is floor_div(weekly, 5) using the WORKDAYS_PER_WEEK=5 constant BEFORE multiplication; a weekly rate not divisible by 5 discards the remainder (weekly 1000003 -> daily 200000, not 200000.6)."
        test_recipe:
          setup: ["Submission at OFFER_PENDING with ACCEPTED-eligible offer weekly_rate_cents=1000003 (not divisible by 5); single-day engagement 2026-08-10 (Monday)"]
          setup_api_calls:
            - { call: "POST /casting/_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T00:00:00Z" }, as: CastingDirector }
            - call: "POST /casting/productions"
              payload: { title: "CP2", production_type: "FILM", union_signatory: false, shoot_city: "LA", shoot_state: "CA", start_date: "2026-08-01T00:00:00Z", wrap_date: "2026-09-30T00:00:00Z", casting_office_id: "office-1" }
              as: CastingDirector
              captures: { pid: $.data.id }
            - call: "POST /casting/productions/${pid}/roles"
              payload: { character_name: "R", is_minor_role: false, is_union_covered: false, engagement_start: "2026-08-10T00:00:00Z", engagement_end: "2026-08-10T00:00:00Z" }
              as: CastingDirector
              captures: { rid: $.data.id }
            - call: "POST /casting/productions/${pid}/breakdowns"
              payload: { role_id: "${rid}", distribution: "OPEN_CALL", submission_deadline: "2026-09-01T00:00:00Z", rate_weekly_cents: 1000003 }
              as: CastingDirector
              captures: { bid: $.data.id }
            - call: "POST /casting/breakdowns/${bid}/release"
              payload: { distribution: "OPEN_CALL" }
              as: CastingDirector
            - call: "POST /casting/talents"
              payload: { full_name: "T", date_of_birth: "1990-01-01T00:00:00Z", union_status: "NON_UNION" }
              as: CastingDirector
              captures: { tid: $.data.id }
            - call: "GET /casting/breakdowns/${bid}"
              payload: {}
              as: CastingDirector
              captures: { bdv4: $.data.version }
            - call: "POST /casting/breakdowns/${bid}/submissions"
              payload: { talent_id: "${tid}", expected_breakdown_version: "${bdv4}" }
              as: CastingAssociate
              captures: { sid: $.data.id }
            - call: "POST /casting/submissions/${sid}/start-review"
              payload: {}
              as: CastingAssociate
            - call: "POST /casting/submissions/${sid}/shortlist"
              payload: {}
              as: CastingAssociate
            - call: "POST /casting/breakdowns/${bid}/sessions"
              payload: { session_start: "2026-08-04T09:00:00Z", session_end: "2026-08-04T12:00:00Z", capacity: 4, location: "S1" }
              as: CastingAssociate
              captures: { seid: $.data.id }
            - call: "POST /casting/sessions/${seid}/appointments"
              payload: { submission_id: "${sid}", slot_start: "2026-08-04T09:00:00Z", slot_end: "2026-08-04T09:30:00Z" }
              as: CastingAssociate
              captures: { aid: $.data.id }
            - call: "POST /casting/appointments/${aid}/confirm"
              payload: {}
              as: CastingAssociate
            - call: "POST /casting/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-04T13:00:00Z" }
              as: CastingDirector
            - call: "POST /casting/appointments/${aid}/complete"
              payload: {}
              as: CastingAssociate
            - call: "POST /casting/submissions/${sid}/offers"
              payload: { weekly_rate_cents: 1000003, guarantee_cents: 800000, expires_at: "2026-08-20T00:00:00Z" }
              as: CastingDirector
              captures: { oid: $.data.id }
          trigger:
            - call: "POST /casting/offers/${oid}/accept"
              payload: { engagement_start: "2026-08-10T00:00:00Z", engagement_end: "2026-08-10T00:00:00Z", proration_mode: "WORKDAY_SPAN" }
              as: CastingDirector
              captures: { fee: $.data.computed_fee_cents }
          assert:
            - "fee == 200000 (floor_div(1000003,5)=200000 daily * 1 weekday; the 3-cent remainder is discarded BEFORE multiplication, proving constant + rounding order)"

  # ==========================================================================
  # Section: validations
  # ==========================================================================
  - section: validations
    instances:
      - name: submission_after_deadline_returns_deadline_passed
        claim_type: violation_to_error
        grounds: ["validations[priority=15]", "errors[ERR_DEADLINE_PASSED]"]
        distinguishing_aspect: "Submitting at/after submission_deadline returns 422 ERR_DEADLINE_PASSED (business_temporal)."
        test_recipe:
          setup: ["Released OPEN breakdown with submission_deadline 2026-08-05; clock advanced to 2026-08-06"]
          setup_api_calls:
