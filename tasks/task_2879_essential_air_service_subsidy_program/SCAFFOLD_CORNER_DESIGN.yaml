          - endpoints.GET_/eas/service-periods/{id}/payment-preview
          - calculations.subsidy_payment_amount.variants
        excluded_because:
          difficulty_instance: dual_variant_calc / payment_variant_divergence_on_identical_period_data
          rationale: "That instance already reads the preview over one reported period, pins completed_flight_proration_net_usd, scheduled_flight_flat_net_usd, per_departure_rate_usd, credited_departures and divergence_usd, and then certifies to show the persisted payment matches the variant in effect."

      - name: period_reporting_is_conditional_on_the_agreement_status
        claim_type: conditional_action
        grounds:
          - endpoints.POST_/eas/service-periods/{id}/report
          - state_machines.ServiceAgreement
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / period_report_reads_the_parent_agreement_status
          rationale: "That instance already drives the report endpoint against a SUSPENDED parent agreement and then against the reinstated one, showing the condition is read from the parent rather than from the period."

  - section: errors
    instances:
      - name: unknown_ids_return_the_resource_specific_not_found_error
        claim_type: error_catalog_coverage
        grounds:
          - errors.ERR_SERVICE_PERIOD_NOT_FOUND
          - errors.ERR_PAYMENT_NOT_FOUND
          - errors.ERR_PETITION_NOT_FOUND
          - errors.ERR_RENEGOTIATION_NOT_FOUND
          - validations.priority_4
          - response_envelope
        distinguishing_aspect: "Four collections share one HTTP status but not one error id, and every failure carries the full error envelope — error_id, message and a request-scoped error_id-bearing body — so a generic 404 is not acceptable."
        test_recipe:
          setup:
            - "An empty program: no periods, payments, petitions or renegotiations exist."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
          trigger:
            - call: "GET /eas/service-periods/00000000-0000-4000-8000-000000000001"
              payload: {}
              as: ProgramAdmin
