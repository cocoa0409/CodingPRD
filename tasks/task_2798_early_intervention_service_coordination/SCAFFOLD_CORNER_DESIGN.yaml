      - name: err_visit_not_scheduled_is_triggerable
        claim_type: error_triggerability
        excluded_because:
          difficulty_instance: state_beats_fiscal_on_visit_document
          rationale: >-
            That §1.8 instance documents an already-DELIVERED visit a second time and asserts
            ERR_VISIT_NOT_SCHEDULED (409), so the code has a dedicated trigger.

      - name: err_actual_units_exceed_scheduled_is_triggerable
        claim_type: error_triggerability
        excluded_because:
          difficulty_instance: state_beats_fiscal_on_visit_document
          rationale: >-
            The same §1.8 instance isolates the fiscal clause by documenting a SCHEDULED visit with
            more actual_units than scheduled_units and asserting ERR_ACTUAL_UNITS_EXCEED_SCHEDULED
            (422), which is this code's trigger.

      - name: err_provider_credential_expired_is_triggerable
        claim_type: error_triggerability
        excluded_because:
          difficulty_instance: safety_beats_constraint_on_authorization_create
          rationale: >-
            An authorization whose end_date falls after the provider's credential_expiry_date is
            created in that §1.8 instance and returns ERR_PROVIDER_CREDENTIAL_EXPIRED (422), both on
            its own and in combination with a pool violation.

      - name: err_authorization_window_overlap_is_triggerable
        claim_type: error_triggerability
        excluded_because:
          difficulty_instance: authorization_window_closed_interval_touching_endpoints_collide
          rationale: >-
            Two authorizations for the same line and provider whose closed date intervals share a
            single endpoint day are already asserted to collide with ERR_AUTHORIZATION_WINDOW_OVERLAP
            (409) in §1.8.

      - name: err_provider_schedule_conflict_is_triggerable
        claim_type: error_triggerability
        excluded_because:
          difficulty_instance: provider_visit_half_open_adjacency_allowed_but_cross_setting_buffer_conflicts
          rationale: >-
            That §1.8 instance schedules a same-provider session inside the 30-minute cross-setting
            buffer and asserts ERR_PROVIDER_SCHEDULE_CONFLICT (409), alongside the adjacent
            same-setting session that must be accepted.

      - name: err_caseload_cap_exceeded_is_triggerable
        claim_type: error_triggerability
        excluded_because:
          difficulty_instance: caseload_cap_exact_equality_admits_assignment
          rationale: >-
            The boundary instance in §1.8 admits the assignment that lands exactly on the ceiling and
            then refuses the next one with ERR_CASELOAD_CAP_EXCEEDED (409), which is this code's
            trigger.

      - name: err_required_assessments_incomplete_is_triggerable
        claim_type: error_triggerability
        excluded_because:
          difficulty_instance: eligibility_determination_requires_both_completed_assessment_types
          rationale: >-
            Determining eligibility with only the INITIAL_EVALUATION completed returns
            ERR_REQUIRED_ASSESSMENTS_INCOMPLETE (422) in that §1.8 instance, which also proves the
            symmetric case with only the FAMILY_ASSESSMENT completed.

      - name: err_ledger_would_unbalance_is_triggerable
        claim_type: error_triggerability
        excluded_because:
          difficulty_instance: family_ledger_conserved_across_accrual_and_void
          rationale: >-
            The ledger-invariant instance in §1.8 drives the guard that refuses a write which would
            break total_assessed_cents == family_balance_cents + family_waived_cents or drive a
            component negative, returning ERR_LEDGER_WOULD_UNBALANCE (409).

  - section: rbac
    instances:
      - name: visit_documentation_missing_x_user_then_role_then_owner_ladder
        claim_type: identity_and_ownership_ladder
        grounds:
          - roles.Provider
          - validations[priority 1 -> ERR_UNAUTHENTICATED]
          - validations[priority 2 -> ERR_ROLE_NOT_PERMITTED]
          - validations[priority 16 -> ERR_NOT_RESOURCE_OWNER]
        distinguishing_aspect: |
          Three different rejections on the same endpoint and the same visit, distinguished only by
          the caller identity: no X-User-ID at all is 401, a well-formed identity in the wrong role is
          403 ERR_ROLE_NOT_PERMITTED, and a well-formed Provider identity that is not the
          authorization's provider_id is 403 ERR_NOT_RESOURCE_OWNER. Only the fourth call — the
          authorized provider — succeeds, and documented_by_user_id records exactly that identity.
        test_recipe:
          setup:
            - "ACTIVE plan with one SPEECH_THERAPY HOME line and a 24-unit authorization held by provider prov1."
            - "A second credentialed provider prov2 exists but holds no authorization on this line."
            - "One SCHEDULED visit on 2026-03-24 and the logical clock at 2026-03-25T09:00:00Z."
