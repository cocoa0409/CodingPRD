# =============================================================================
# SCAFFOLD_DIFFICULTY_DESIGN — §1.8 Test Targeting Index
# task_3168_open_seating_boarding_position_assignment_point_point
# 9 Difficulty Rules x 2 instances each = 18 instances.
# All formula-derived assert literals were pre-computed from §1.3 constants.
# =============================================================================

scaffold_difficulty_design:

  # =============================================================
  # Rule 1 — dual_variant_calc (different entity domains)
  # =============================================================
  - rule_id: dual_variant_calc
    instances:
      - name: credit_mint_full_vs_no_show_forfeit
        grounds:
          - calculations.travel_credit_mint
          - state_machines.PassengerJourney.CHECKED_IN_to_NO_SHOW
        distinguishing_aspect: |
          Same journey fields (base_fare_cents=20000, no upgrades) under two
          variants of travel_credit_mint on the PassengerJourney/TravelCredit
          domain: a flexible-fare (change_fee_cents=0) cancellation mints a
          TravelCredit of exactly 20000 cents, while the no_show_forfeit
          variant on a non-flexible fare (change_fee_cents=5000) mints NO
          credit and instead stamps no_show_penalty_cents=20000.
        test_recipe:
          setup:
            - "Station DAL exists; fare classes FLEX (change_fee_cents=0) and WGA (change_fee_cents=5000) exist"
            - "Aircraft tail with seat_count=143 exists; flight leg L1 DAL->HOU STD 2026-10-01T12:00:00Z capacity 143 exists"
            - "Passenger PA (NONE tier) with two journeys: JFLEX (fare FLEX, base 20000) and JWGA (fare WGA, base 20000), both BOOKED on L1"
            - "Logical clock 2026-09-30T12:00:00Z (inside check-in window for both)"
          setup_api_calls:
            - call: "POST /ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-30T12:00:00Z" }
              as: OpsController
            - call: "POST /ops/stations"
              payload: { iata_code: "DAL" }
              as: OpsController
              captures: { st_dal: $.data.id }
            - call: "POST /ops/stations"
              payload: { iata_code: "HOU" }
              as: OpsController
              captures: { st_hou: $.data.id }
            - call: "POST /ops/fare-classes"
              payload: { code: "FLEX", change_fee_cents: 0, included_bags: 2, credit_validity_days: 365 }
              as: OpsController
              captures: { fc_flex: $.data.id }
            - call: "POST /ops/fare-classes"
              payload: { code: "WGA", change_fee_cents: 5000, included_bags: 2, credit_validity_days: 365 }
              as: OpsController
              captures: { fc_wga: $.data.id }
            - call: "POST /ops/aircraft"
              payload: { tail_number: "N100", seat_count: 143, fleet_type: "SINGLE_FLEET", home_station_code: "DAL" }
              as: OpsController
            - call: "POST /ops/flight-legs"
              payload: { flight_number: "WN100", origin_station_id: "${st_dal}", destination_station_id: "${st_hou}", scheduled_departure_utc: "2026-10-01T12:00:00Z", scheduled_arrival_utc: "2026-10-01T13:00:00Z", capacity_seats: 143, turn_target_minutes: 35 }
              as: OpsController
              captures: { leg1: $.data.id }
            - call: "POST /ops/passengers"
              payload: { full_name: "P A", date_of_birth: "1990-01-01" }
              as: Passenger
              captures: { pa: $.data.id }
            - call: "POST /ops/bookings"
              payload: { record_locator: "FLEX01", journeys: [ { passenger_id: "${pa}", flight_leg_id: "${leg1}", fare_class_id: "${fc_flex}", base_fare_cents: 20000 } ] }
              as: Passenger
              as_user_id: "${pa}"
              captures: { bk_flex: $.data.id, j_flex: "$.data.journey_ids[0]" }
            - call: "POST /ops/bookings"
              payload: { record_locator: "WGA001", journeys: [ { passenger_id: "${pa}", flight_leg_id: "${leg1}", fare_class_id: "${fc_wga}", base_fare_cents: 20000 } ] }
              as: Passenger
              as_user_id: "${pa}"
              captures: { j_wga: "$.data.journey_ids[0]" }
            - call: "POST /ops/journeys/${j_wga}/check-in"
              payload: {}
              as: Passenger
              as_user_id: "${pa}"
            - call: "POST /ops/flight-legs/${leg1}/boarding/open"
              payload: {}
              as: GateAgent
            - call: "POST /ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-01T12:00:00Z" }
              as: OpsController
            - call: "POST /ops/flight-legs/${leg1}/no-show-sweep"
              payload: {}
              as: GateAgent
          trigger:
            - call: "POST /ops/journeys/${j_flex}/cancel"
              payload: {}
              as: Passenger
              as_user_id: "${pa}"
            - call: "GET /ops/credits"
              payload: { passenger_id: "${pa}" }
              as: Passenger
              as_user_id: "${pa}"
              captures: { credit_amount: "$.data[0].initial_amount_cents" }
            - call: "GET /ops/journeys/${j_wga}"
              payload: {}
              as: Passenger
              as_user_id: "${pa}"
          assert:
            - "credits list for passenger ${pa} contains exactly 1 credit"
            - "TravelCredit.initial_amount_cents == 20000 and TravelCredit.source_journey_id == ${j_flex}"
            - "PassengerJourney.${j_wga}.journey_status == NO_SHOW"
            - "PassengerJourney.${j_wga}.no_show_penalty_cents == 20000"
            - "no TravelCredit exists with source_journey_id == ${j_wga}"

      - name: turn_projection_forward_vs_realized
        grounds:
          - calculations.turn_time_projection
        distinguishing_aspect: |
          Same FlightLeg under two variants of turn_time_projection on the
          FlightLeg operations domain: the forward_looking variant (leg not yet
          DEPARTED) counts 2 ACCEPTED bags plus 2 expected bags for the 1 BOOKED
          journey (projected_bags=4) and yields 17 projected minutes; the
          realized_turn variant (leg DEPARTED) counts only the 2 actually-LOADED
          bags and the 1 BOARDED passenger and yields 15 minutes — same leg,
          same constants, different result.
        test_recipe:
          setup:
            - "Stations DAL, HOU; fare FLEX (included_bags=2); aircraft seat_count=143; leg L1 capacity 100, turn_target 35, STD 2026-10-01T12:00:00Z"
            - "90 journeys on L1 (89 distinct CHECKED_IN passengers + 1 BOOKED passenger); 2 ACCEPTED bags total on the leg (on one checked-in journey)"
            - "Logical clock 2026-09-30T12:00:00Z during check-ins, then 2026-10-01T11:00:00Z for the forward read"
          setup_api_calls:
            - call: "POST /ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-30T12:00:00Z" }
              as: OpsController
            - call: "POST /ops/stations"
              payload: { iata_code: "DAL" }
              as: OpsController
              captures: { st_dal: $.data.id }
            - call: "POST /ops/stations"
              payload: { iata_code: "HOU" }
              as: OpsController
              captures: { st_hou: $.data.id }
            - call: "POST /ops/fare-classes"
              payload: { code: "FLEX", change_fee_cents: 0, included_bags: 2, credit_validity_days: 365 }
              as: OpsController
              captures: { fc_flex: $.data.id }
            - call: "POST /ops/aircraft"
              payload: { tail_number: "N100", seat_count: 143, fleet_type: "SINGLE_FLEET", home_station_code: "DAL" }
              as: OpsController
            - call: "POST /ops/flight-legs"
              payload: { flight_number: "WN100", origin_station_id: "${st_dal}", destination_station_id: "${st_hou}", scheduled_departure_utc: "2026-10-01T12:00:00Z", scheduled_arrival_utc: "2026-10-01T13:00:00Z", capacity_seats: 100, turn_target_minutes: 35, gate_agent_count: 2, ramp_agent_count: 4 }
              as: OpsController
              captures: { leg1: $.data.id }
            - call: "POST /ops/passengers"
              payload: { full_name: "P K", date_of_birth: "1990-01-01" }
              as: Passenger
              captures: { pk: $.data.id }
            - call: "POST /ops/passengers"
              payload: { full_name: "P B", date_of_birth: "1990-01-01" }
              as: Passenger
              captures: { pb: $.data.id }
            - call: "POST /ops/bookings"
              payload: { record_locator: "GRP090", journeys: [ { passenger_id: "${pk}", flight_leg_id: "${leg1}", fare_class_id: "${fc_flex}", base_fare_cents: 10000 } ] }
              as: Passenger
              as_user_id: "${pk}"
              captures: { j_k: "$.data.journey_ids[0]" }
            - call: "POST /ops/bookings"
              payload: { record_locator: "GRP091", journeys: [ { passenger_id: "${pb}", flight_leg_id: "${leg1}", fare_class_id: "${fc_flex}", base_fare_cents: 10000 } ] }
              as: Passenger
              as_user_id: "${pb}"
              captures: { j_b: "$.data.journey_ids[0]" }
            - call: "POST /ops/journeys/${j_k}/check-in"
              payload: {}
              as: Passenger
              as_user_id: "${pk}"
            - call: "POST /ops/journeys/${j_k}/bags"
              payload: { weight_lbs: 30 }
              as: GateAgent
            - call: "POST /ops/journeys/${j_k}/bags"
              payload: { weight_lbs: 30 }
              as: GateAgent
            - call: "POST /ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-01T11:00:00Z" }
              as: OpsController
          trigger:
            - call: "GET /ops/flight-legs/${leg1}/turn-projection"
              payload: {}
              as: GateAgent
              captures: { proj_min: $.data.projected_turn_minutes, proj_bags: $.data.projected_bags, turns_slip: $.data.turns_slip }
            - call: "POST /ops/flight-legs/${leg1}/boarding/open"
              payload: {}
              as: GateAgent
            - call: "POST /ops/boarding/scan"
              payload: { journey_id: "${j_k}" }
              as: GateAgent
            - call: "POST /ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-01T12:00:00Z" }
              as: OpsController
            - call: "POST /ops/flight-legs/${leg1}/depart"
              payload: {}
              as: GateAgent
            - call: "GET /ops/flight-legs/${leg1}/turn-projection"
              payload: {}
              as: GateAgent
              captures: { realized_min: $.data.projected_turn_minutes, realized_bags: $.data.projected_bags }
          assert:
            - "forward read: projected_bags == 4 (2 ACCEPTED + 1 BOOKED journey * included_bags 2)"
            - "forward read: projected_turn_minutes == 17 (12 base + 4 bag + ceil(2*18/60)=1 pax + 0 buffer)"
            - "forward read: turns_slip == false (17 <= turn_target 35)"
            - "realized read after DEPART: projected_bags == 2 (only LOADED bags counted)"
            - "realized read: projected_turn_minutes == 15 (12 base + 2 bag + ceil(1*18/60)=1 pax; only the BOARDED passenger counts)"
            - "realized read: turns_slip == false (15 <= 35); the variant delta is 17 vs 15 on identical leg constants"

  # =============================================================
  # Rule 2 — combinatorial_formula (different modes)
  # =============================================================
  - rule_id: combinatorial_formula
    instances:
      - name: boarding_assignment_tiered_mode_a
        grounds:
          - calculations.boarding_position_assignment
        distinguishing_aspect: |
          Mode (a) multi-input non-linear selector: with a PREBOARD passenger,
          one UPGRADED_BOARDING purchase, one A_LIST_PREFERRED, one A_LIST, and
          two NONE-tier passengers on one leg, the phase interaction assigns
          PREBOARD group position 1, A1 to the upgrade, A16/A17 to the status
          tiers in tier order, and A18/A19 to NONE-tier by checked_in_at —
          5 inputs (accommodation, upgrade, tier, check-in time, created_at)
          with conditional branches, not a linear sort.
        test_recipe:
          setup:
            - "Stations DAL/HOU; fare PRE (preboard_eligible=true, FLEX) and FLEX; aircraft seat_count=143; leg L1 capacity 143 STD 2026-10-01T12:00:00Z"
            - "6 passengers: PPRE (accommodation PREBOARD), PUPG (buys UPGRADED_BOARDING), PALP (A_LIST_PREFERRED), PAL (A_LIST), PN1 and PN2 (NONE); all journeys BOOKED on L1"
            - "Check-in order (logical clock): PN2 11:00:00Z, PN1 11:00:05Z, PAL 11:00:10Z, PALP 11:00:20Z, PPRE 11:00:30Z; PUPG checked in 10:59:00Z then purchased upgrade"
          setup_api_calls:
            - call: "POST /ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-30T10:00:00Z" }
              as: OpsController
            - call: "POST /ops/stations"
              payload: { iata_code: "DAL" }
              as: OpsController
              captures: { st_dal: $.data.id }
            - call: "POST /ops/stations"
              payload: { iata_code: "HOU" }
              as: OpsController
              captures: { st_hou: $.data.id }
            - call: "POST /ops/fare-classes"
              payload: { code: "PRE", change_fee_cents: 0, preboard_eligible: true, included_bags: 2 }
              as: OpsController
              captures: { fc_pre: $.data.id }
            - call: "POST /ops/fare-classes"
              payload: { code: "FLEX", change_fee_cents: 0, included_bags: 2 }
              as: OpsController
              captures: { fc_flex: $.data.id }
            - call: "POST /ops/aircraft"
              payload: { tail_number: "N100", seat_count: 143, fleet_type: "SINGLE_FLEET", home_station_code: "DAL" }
              as: OpsController
            - call: "POST /ops/flight-legs"
              payload: { flight_number: "WN100", origin_station_id: "${st_dal}", destination_station_id: "${st_hou}", scheduled_departure_utc: "2026-10-01T12:00:00Z", scheduled_arrival_utc: "2026-10-01T13:00:00Z", capacity_seats: 143, turn_target_minutes: 35 }
              as: OpsController
              captures: { leg1: $.data.id, leg1_v: $.data.version }
            - call: "POST /ops/passengers"
              payload: { full_name: "P PRE", date_of_birth: "1980-01-01" }
              as: Passenger
              captures: { p_pre: $.data.id }
            - call: "POST /ops/passengers"
              payload: { full_name: "P UPG", date_of_birth: "1980-01-01" }
              as: Passenger
              captures: { p_upg: $.data.id }
            - call: "POST /ops/passengers"
              payload: { full_name: "P ALP", date_of_birth: "1980-01-01", status_tier: "A_LIST_PREFERRED" }
              as: Passenger
              captures: { p_alp: $.data.id }
            - call: "POST /ops/passengers"
              payload: { full_name: "P AL", date_of_birth: "1980-01-01", status_tier: "A_LIST" }
              as: Passenger
              captures: { p_al: $.data.id }
            - call: "POST /ops/passengers"
              payload: { full_name: "P N1", date_of_birth: "1980-01-01" }
              as: Passenger
              captures: { p_n1: $.data.id }
            - call: "POST /ops/passengers"
              payload: { full_name: "P N2", date_of_birth: "1980-01-01" }
              as: Passenger
              captures: { p_n2: $.data.id }
            - call: "POST /ops/bookings"
              payload: { record_locator: "BKPRE0", journeys: [ { passenger_id: "${p_pre}", flight_leg_id: "${leg1}", fare_class_id: "${fc_pre}", base_fare_cents: 10000, accommodation: "PREBOARD" } ] }
              as: Passenger
              as_user_id: "${p_pre}"
              captures: { j_pre: "$.data.journey_ids[0]" }
            - call: "POST /ops/bookings"
              payload: { record_locator: "BKUPG0", journeys: [ { passenger_id: "${p_upg}", flight_leg_id: "${leg1}", fare_class_id: "${fc_flex}", base_fare_cents: 10000 } ] }
              as: Passenger
              as_user_id: "${p_upg}"
              captures: { j_upg: "$.data.journey_ids[0]" }
            - call: "POST /ops/bookings"
              payload: { record_locator: "BKALP0", journeys: [ { passenger_id: "${p_alp}", flight_leg_id: "${leg1}", fare_class_id: "${fc_flex}", base_fare_cents: 10000 } ] }
              as: Passenger
              as_user_id: "${p_alp}"
              captures: { j_alp: "$.data.journey_ids[0]" }
            - call: "POST /ops/bookings"
              payload: { record_locator: "BKAL00", journeys: [ { passenger_id: "${p_al}", flight_leg_id: "${leg1}", fare_class_id: "${fc_flex}", base_fare_cents: 10000 } ] }
              as: Passenger
              as_user_id: "${p_al}"
              captures: { j_al: "$.data.journey_ids[0]" }
            - call: "POST /ops/bookings"
              payload: { record_locator: "BKN100", journeys: [ { passenger_id: "${p_n1}", flight_leg_id: "${leg1}", fare_class_id: "${fc_flex}", base_fare_cents: 10000 } ] }
              as: Passenger
              as_user_id: "${p_n1}"
              captures: { j_n1: "$.data.journey_ids[0]" }
            - call: "POST /ops/bookings"
              payload: { record_locator: "BKN200", journeys: [ { passenger_id: "${p_n2}", flight_leg_id: "${leg1}", fare_class_id: "${fc_flex}", base_fare_cents: 10000 } ] }
              as: Passenger
              as_user_id: "${p_n2}"
              captures: { j_n2: "$.data.journey_ids[0]" }
            - call: "POST /ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-30T10:59:00Z" }
              as: OpsController
            - call: "POST /ops/flight-legs/${leg1}/check-ins"
              payload: { journey_id: "${j_upg}", expected_leg_version: "${leg1_v}" }
              as: Passenger
              as_user_id: "${p_upg}"
              captures: { leg1_v2: $.data.version }
            - call: "POST /ops/flight-legs/${leg1}/upgrades"
              payload: { journey_id: "${j_upg}", upgrade_type: "UPGRADED_BOARDING", expected_leg_version: "${leg1_v2}" }
              as: Passenger
              as_user_id: "${p_upg}"
              captures: { upg_pos: $.data.position_granted, leg1_v3: $.data.version }
            - call: "POST /ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-30T11:00:00Z" }
              as: OpsController
            - call: "POST /ops/flight-legs/${leg1}/check-ins"
              payload: { journey_id: "${j_n2}", expected_leg_version: "${leg1_v3}" }
              as: Passenger
              as_user_id: "${p_n2}"
              captures: { leg1_v4: $.data.version }
            - call: "POST /ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-30T11:00:05Z" }
              as: OpsController
            - call: "POST /ops/flight-legs/${leg1}/check-ins"
              payload: { journey_id: "${j_n1}", expected_leg_version: "${leg1_v4}" }
              as: Passenger
              as_user_id: "${p_n1}"
              captures: { leg1_v5: $.data.version }
            - call: "POST /ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-30T11:00:10Z" }
              as: OpsController
            - call: "POST /ops/flight-legs/${leg1}/check-ins"
              payload: { journey_id: "${j_al}", expected_leg_version: "${leg1_v5}" }
              as: Passenger
              as_user_id: "${p_al}"
              captures: { leg1_v6: $.data.version }
            - call: "POST /ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-30T11:00:20Z" }
              as: OpsController
            - call: "POST /ops/flight-legs/${leg1}/check-ins"
              payload: { journey_id: "${j_alp}", expected_leg_version: "${leg1_v6}" }
              as: Passenger
              as_user_id: "${p_alp}"
              captures: { leg1_v7: $.data.version }
            - call: "POST /ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-30T11:00:30Z" }
              as: OpsController
            - call: "POST /ops/flight-legs/${leg1}/check-ins"
              payload: { journey_id: "${j_pre}", expected_leg_version: "${leg1_v7}" }
              as: Passenger
              as_user_id: "${p_pre}"
          trigger:
            - call: "GET /ops/flight-legs/${leg1}/boarding-assignments"
              payload: {}
              as: GateAgent
              captures: { a0_journey: "$.data[0].journey_id", a1_journey: "$.data[1].journey_id", a2_journey: "$.data[2].journey_id", a3_journey: "$.data[3].journey_id", a4_journey: "$.data[4].journey_id", a5_journey: "$.data[5].journey_id" }
          assert:
            - "boarding order [0] journey == ${j_pre} (group PREBOARD position 1)"
            - "boarding order [1] journey == ${j_upg} (group A position 1, source UPGRADE_PURCHASE)"
            - "boarding order [2] journey == ${j_alp} (group A position 16, A_LIST_PREFERRED first among status)"
            - "boarding order [3] journey == ${j_al} (group A position 17)"
            - "boarding order [4] journey == ${j_n2} (group A position 18; checked in before PN1)"
            - "boarding order [5] journey == ${j_n1} (group A position 19)"
            - "upgrade position_granted == 1"

      - name: upgrade_price_nested_rounding_mode_b
        grounds:
          - calculations.upgrade_price
        distinguishing_aspect: |
          Mode (b) nested rounding with pinned step order: UPGRADED_BOARDING on
          fare D10 (upgrade_discount_pct=10) with tier A_LIST_PREFERRED(25)
          prices floor(floor(4000*0.90)=3600 * 0.75) = 2700 — each
          multiplication floors BEFORE the next step. The companion
          discriminator on the same journey: EARLY_BIRD on the same fare and
          passenger prices floor(1500*0.90) = 1350 because the status-tier
          discount is structurally excluded from the EB formula — an
          implementation applying the 25% tier to EB yields 1013; both pins
          together isolate the nested-rounding and variant-selection semantics.
        test_recipe:
          setup:
            - "Stations DAL/HOU; fare class D10 (upgrade_discount_pct=10, change_fee_cents=0, included_bags=2)"
            - "Aircraft seat_count=143; leg L1 STD 2026-10-01T12:00:00Z capacity 143"
            - "Passenger PALP (A_LIST_PREFERRED) with BOOKED journey J1 (fare D10, base 10000) on L1"
            - "Logical clock 2026-09-30T11:00:00Z (UB window open: within day-of-travel; before STD)"
          setup_api_calls:
            - call: "POST /ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-30T11:00:00Z" }
              as: OpsController
            - call: "POST /ops/stations"
              payload: { iata_code: "DAL" }
              as: OpsController
              captures: { st_dal: $.data.id }
            - call: "POST /ops/stations"
              payload: { iata_code: "HOU" }
              as: OpsController
              captures: { st_hou: $.data.id }
            - call: "POST /ops/fare-classes"
              payload: { code: "D10", change_fee_cents: 0, upgrade_discount_pct: 10, included_bags: 2 }
              as: OpsController
              captures: { fc_d10: $.data.id }
            - call: "POST /ops/aircraft"
              payload: { tail_number: "N100", seat_count: 143, fleet_type: "SINGLE_FLEET", home_station_code: "DAL" }
              as: OpsController
            - call: "POST /ops/flight-legs"
              payload: { flight_number: "WN100", origin_station_id: "${st_dal}", destination_station_id: "${st_hou}", scheduled_departure_utc: "2026-10-01T12:00:00Z", scheduled_arrival_utc: "2026-10-01T13:00:00Z", capacity_seats: 143, turn_target_minutes: 35 }
              as: OpsController
              captures: { leg1: $.data.id, leg1_v: $.data.version }
            - call: "POST /ops/passengers"
              payload: { full_name: "P ALP", date_of_birth: "1980-01-01", status_tier: "A_LIST_PREFERRED" }
              as: Passenger
              captures: { p_alp: $.data.id }
            - call: "POST /ops/bookings"
              payload: { record_locator: "BKD100", journeys: [ { passenger_id: "${p_alp}", flight_leg_id: "${leg1}", fare_class_id: "${fc_d10}", base_fare_cents: 10000 } ] }
              as: Passenger
              as_user_id: "${p_alp}"
              captures: { j1: "$.data.journey_ids[0]" }
            - call: "POST /ops/flight-legs/${leg1}/check-ins"
              payload: { journey_id: "${j1}", expected_leg_version: "${leg1_v}" }
              as: Passenger
              as_user_id: "${p_alp}"
              captures: { leg1_v2: $.data.version }
          trigger:
            - call: "POST /ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-29T20:00:00Z" }
              as: OpsController
            - call: "POST /ops/flight-legs/${leg1}/upgrades"
              payload: { journey_id: "${j1}", upgrade_type: "EARLY_BIRD", expected_leg_version: "${leg1_v2}" }
              as: Passenger
              as_user_id: "${p_alp}"
              captures: { eb_price: $.data.price_cents, leg1_v3: $.data.version }
            - call: "POST /ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-30T12:00:00Z" }
              as: OpsController
            - call: "POST /ops/flight-legs/${leg1}/upgrades"
              payload: { journey_id: "${j1}", upgrade_type: "UPGRADED_BOARDING", expected_leg_version: "${leg1_v3}" }
              as: Passenger
              as_user_id: "${p_alp}"
              captures: { ub_price: $.data.price_cents, ub_pos: $.data.position_granted }
          assert:
            - "EARLY_BIRD price_cents == 1350 (floor(1500*0.90); A_LIST_PREFERRED 25 pct discount structurally excluded from the EB variant — an implementation applying it yields 1013 and fails)"
            - "UPGRADED_BOARDING price_cents == 2700 (floor(floor(4000*0.90)=3600 * 0.75); pinned fare-first nested floor)"
            - "UPGRADED_BOARDING position_granted == 1"
            - "both upgrades ACTIVE on the same journey (duplicate-type rule is per upgrade_type, not per journey)"

  # =============================================================
  # Rule 3 — non_linear_state_machine (different entities)
  # =============================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: flight_leg_delay_cycle_retime
        grounds:
          - state_machines.FlightLeg.SCHEDULED_to_DELAYED
          - state_machines.FlightLeg.DELAYED_to_DELAYED
          - calculations.boarding_position_assignment
        distinguishing_aspect: |
          FlightLeg has a delay cycle SCHEDULED→DELAYED→DELAYED: a 30-minute
          delay posts first (below RETIME_THRESHOLD 45, assignments untouched),
          then a strictly-greater 60-minute delay re-enters DELAYED and triggers
          the retime recompute — non-accommodation ACTIVE assignments flip to
          assignment_source=RETIME while the PREBOARD assignment is preserved
          unchanged.
        test_recipe:
          setup:
            - "Stations DAL/HOU; fare PRE (preboard_eligible) and FLEX; aircraft; leg L1 STD 2026-10-01T12:00:00Z"
            - "PPRE journey CHECKED_IN (PREBOARD) and PN1 journey CHECKED_IN (group A position 16) on L1"
          setup_api_calls:
            - call: "POST /ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-30T11:00:00Z" }
              as: OpsController
            - call: "POST /ops/stations"
              payload: { iata_code: "DAL" }
              as: OpsController
              captures: { st_dal: $.data.id }
            - call: "POST /ops/stations"
              payload: { iata_code: "HOU" }
              as: OpsController
              captures: { st_hou: $.data.id }
            - call: "POST /ops/fare-classes"
              payload: { code: "PRE", change_fee_cents: 0, preboard_eligible: true, included_bags: 2 }
              as: OpsController
              captures: { fc_pre: $.data.id }
            - call: "POST /ops/fare-classes"
              payload: { code: "FLEX", change_fee_cents: 0, included_bags: 2 }
              as: OpsController
              captures: { fc_flex: $.data.id }
            - call: "POST /ops/aircraft"
              payload: { tail_number: "N100", seat_count: 143, fleet_type: "SINGLE_FLEET", home_station_code: "DAL" }
              as: OpsController
            - call: "POST /ops/flight-legs"
              payload: { flight_number: "WN100", origin_station_id: "${st_dal}", destination_station_id: "${st_hou}", scheduled_departure_utc: "2026-10-01T12:00:00Z", scheduled_arrival_utc: "2026-10-01T13:00:00Z", capacity_seats: 143, turn_target_minutes: 35 }
              as: OpsController
              captures: { leg1: $.data.id, leg1_v: $.data.version }
            - call: "POST /ops/passengers"
              payload: { full_name: "P PRE", date_of_birth: "1980-01-01" }
              as: Passenger
              captures: { p_pre: $.data.id }
            - call: "POST /ops/passengers"
              payload: { full_name: "P N1", date_of_birth: "1980-01-01" }
              as: Passenger
              captures: { p_n1: $.data.id }
            - call: "POST /ops/bookings"
              payload: { record_locator: "BKPRE0", journeys: [ { passenger_id: "${p_pre}", flight_leg_id: "${leg1}", fare_class_id: "${fc_pre}", base_fare_cents: 10000, accommodation: "PREBOARD" } ] }
              as: Passenger
              as_user_id: "${p_pre}"
              captures: { j_pre: "$.data.journey_ids[0]" }
            - call: "POST /ops/bookings"
              payload: { record_locator: "BKN100", journeys: [ { passenger_id: "${p_n1}", flight_leg_id: "${leg1}", fare_class_id: "${fc_flex}", base_fare_cents: 10000 } ] }
              as: Passenger
              as_user_id: "${p_n1}"
              captures: { j_n1: "$.data.journey_ids[0]" }
            - call: "POST /ops/flight-legs/${leg1}/check-ins"
              payload: { journey_id: "${j_pre}", expected_leg_version: "${leg1_v}" }
              as: Passenger
              as_user_id: "${p_pre}"
              captures: { leg1_v2: $.data.version }
            - call: "POST /ops/flight-legs/${leg1}/check-ins"
              payload: { journey_id: "${j_n1}", expected_leg_version: "${leg1_v2}" }
              as: Passenger
              as_user_id: "${p_n1}"
            - call: "POST /ops/flight-legs/${leg1}/disruptions"
              payload: { disruption_type: "DELAY", cause: "WEATHER", delay_minutes: 30 }
              as: OpsController
          trigger:
            - call: "POST /ops/flight-legs/${leg1}/disruptions"
              payload: { disruption_type: "DELAY", cause: "WEATHER", delay_minutes: 60 }
              as: OpsController
            - call: "GET /ops/journeys/${j_n1}/boarding-assignments"
              payload: {}
              as: Passenger
              as_user_id: "${p_n1}"
              captures: { n1_src: "$.data[0].assignment_source", n1_status: "$.data[0].assignment_status" }
            - call: "GET /ops/journeys/${j_pre}/boarding-assignments"
              payload: {}
              as: Passenger
              as_user_id: "${p_pre}"
              captures: { pre_src: "$.data[0].assignment_source", pre_grp: "$.data[0].boarding_group" }
          assert:
            - "after first 30-min delay: leg delay_minutes == 30 and PN1 assignment still assignment_source=CHECKIN_TIME (30 < RETIME_THRESHOLD 45)"
            - "after second 60-min delay: leg leg_status == DELAYED and delay_minutes == 60 (DELAYED→DELAYED re-entry)"
            - "PN1 latest assignment assignment_source == RETIME"
            - "PPRE assignment unchanged: boarding_group == PREBOARD and assignment_source == PREBOARD_ACCOMMODATION"

      - name: travel_credit_partial_redeem_cycle
        grounds:
          - state_machines.TravelCredit.OPEN_to_PARTIALLY_REDEEMED
          - state_machines.TravelCredit.PARTIALLY_REDEEMED_to_PARTIALLY_REDEEMED
          - state_machines.TravelCredit.PARTIALLY_REDEEMED_to_OPEN
        distinguishing_aspect: |
          TravelCredit has a non-linear self-loop cycle
          OPEN→PARTIALLY_REDEEMED→PARTIALLY_REDEEMED and a back-edge
          PARTIALLY_REDEEMED→OPEN when the paid journey is changed (redemption
          voided, balance restored) — a different entity than FlightLeg's delay
          cycle, exercising cyclic state on the credit ledger.
        test_recipe:
          setup:
            - "Stations DAL/HOU; fare FLEX; aircraft; leg L1 STD 2026-10-01T12:00:00Z and leg L2 STD 2026-10-02T12:00:00Z"
            - "Passenger PA with journey J_SRC (base 20000, FLEX) on L1 CANCELLED at T0 → TravelCredit CR (initial 20000, OPEN)"
            - "Journey J_NEW (base 10000, FLEX) BOOKED on L2"
          setup_api_calls:
            - call: "POST /ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-30T11:00:00Z" }
              as: OpsController
            - call: "POST /ops/stations"
              payload: { iata_code: "DAL" }
              as: OpsController
              captures: { st_dal: $.data.id }
            - call: "POST /ops/stations"
              payload: { iata_code: "HOU" }
              as: OpsController
              captures: { st_hou: $.data.id }
            - call: "POST /ops/fare-classes"
              payload: { code: "FLEX", change_fee_cents: 0, included_bags: 2, credit_validity_days: 365 }
              as: OpsController
              captures: { fc_flex: $.data.id }
            - call: "POST /ops/aircraft"
              payload: { tail_number: "N100", seat_count: 143, fleet_type: "SINGLE_FLEET", home_station_code: "DAL" }
              as: OpsController
            - call: "POST /ops/flight-legs"
              payload: { flight_number: "WN100", origin_station_id: "${st_dal}", destination_station_id: "${st_hou}", scheduled_departure_utc: "2026-10-01T12:00:00Z", scheduled_arrival_utc: "2026-10-01T13:00:00Z", capacity_seats: 143, turn_target_minutes: 35 }
              as: OpsController
              captures: { leg1: $.data.id }
            - call: "POST /ops/flight-legs"
              payload: { flight_number: "WN101", origin_station_id: "${st_dal}", destination_station_id: "${st_hou}", scheduled_departure_utc: "2026-10-02T12:00:00Z", scheduled_arrival_utc: "2026-10-02T13:00:00Z", capacity_seats: 143, turn_target_minutes: 35 }
              as: OpsController
              captures: { leg2: $.data.id }
            - call: "POST /ops/passengers"
              payload: { full_name: "P A", date_of_birth: "1990-01-01" }
              as: Passenger
              captures: { pa: $.data.id }
            - call: "POST /ops/bookings"
              payload: { record_locator: "BKSRC0", journeys: [ { passenger_id: "${pa}", flight_leg_id: "${leg1}", fare_class_id: "${fc_flex}", base_fare_cents: 20000 } ] }
              as: Passenger
              as_user_id: "${pa}"
              captures: { j_src: "$.data.journey_ids[0]" }
            - call: "POST /ops/journeys/${j_src}/cancel"
              payload: {}
              as: Passenger
              as_user_id: "${pa}"
            - call: "GET /ops/credits"
              payload: { passenger_id: "${pa}" }
              as: Passenger
              as_user_id: "${pa}"
              captures: { cr_id: "$.data[0].id", cr_v0: "$.data[0].version" }
            - call: "POST /ops/bookings"
              payload: { record_locator: "BKNEW0", journeys: [ { passenger_id: "${pa}", flight_leg_id: "${leg2}", fare_class_id: "${fc_flex}", base_fare_cents: 10000 } ] }
              as: Passenger
              as_user_id: "${pa}"
              captures: { j_new: "$.data.journey_ids[0]" }
          trigger:
            - call: "POST /ops/credits/${cr_id}/redeem"
              payload: { journey_id: "${j_new}", amount_cents: 5000, expected_credit_version: "${cr_v0}" }
              as: Passenger
              as_user_id: "${pa}"
              captures: { cr_v1: $.data.version }
            - call: "POST /ops/credits/${cr_id}/redeem"
              payload: { journey_id: "${j_new}", amount_cents: 5000, expected_credit_version: "${cr_v1}" }
              as: Passenger
              as_user_id: "${pa}"
              captures: { cr_v2: $.data.version }
            - call: "POST /ops/journeys/${j_new}/change"
              payload: { new_flight_leg_id: "${leg2}", new_fare_class_id: "${fc_flex}", new_base_fare_cents: 10000 }
              as: Passenger
              as_user_id: "${pa}"
            - call: "GET /ops/credits/${cr_id}"
              payload: {}
              as: Passenger
              as_user_id: "${pa}"
              captures: { cr_status: $.data.credit_status, cr_remaining: $.data.remaining_amount_cents }
          assert:
            - "after two 5000 redemptions: credit_status == PARTIALLY_REDEEMED and remaining_amount_cents == 10000 (self-loop traversed twice)"
            - "after journey change voids both ACTIVE redemptions: credit_status == OPEN (back-edge) and remaining_amount_cents == 20000"
            - "CreditRedemption rows for ${j_new} are VOIDED"

  # =============================================================
  # Rule 4 — transitive_cascade (different triggers, depth >= 3 and >= 2)
  # =============================================================
  - rule_id: transitive_cascade
    instances:
      - name: delay_propagates_aircraft_then_crew_depth3
        grounds:
          - calculations.delay_propagation
          - state_machines.FlightLeg.SCHEDULED_to_DELAYED
          - state_machines.CrewPairing.ACTIVE_to_BROKEN
        distinguishing_aspect: |
          Depth-3 transitive cascade from a DELAY post: posting a 50-minute
          delay on L1 mutates L1→DELAYED (hop 0); the aircraft-routing hop
          pushes L1's downstream leg L2→DELAYED via a system DisruptionEvent
          (hop 1); L2's own crew pairing breaks and posts a CREW delay on the
          pairing's next covered leg L3 (hop 2), so the L3 mutation is caused
          by L2's mutation, not by the original post — a 3-link chain from one
          trigger.
        test_recipe:
          setup:
            - "Stations DAL/HOU/AUS; aircraft N100; legs L1 DAL→HOU (STD 12:00 STA 13:00), L2 HOU→AUS (STD 13:35, turn_target 35 → slack 0), L3 AUS→DAL (STD 14:30, turn 35)"
            - "AircraftRouting R1 covering [L1, L2]; CrewPairing CP1 covering [L2, L3] for an AVAILABLE captain"
            - "All legs SCHEDULED; clock 2026-09-30T11:00:00Z"
          setup_api_calls:
            - call: "POST /ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-30T11:00:00Z" }
              as: OpsController
            - call: "POST /ops/stations"
              payload: { iata_code: "DAL", min_connection_minutes: 40 }
              as: OpsController
              captures: { st_dal: $.data.id }
            - call: "POST /ops/stations"
              payload: { iata_code: "HOU", min_connection_minutes: 40 }
              as: OpsController
              captures: { st_hou: $.data.id }
            - call: "POST /ops/stations"
              payload: { iata_code: "AUS", min_connection_minutes: 40 }
              as: OpsController
              captures: { st_aus: $.data.id }
            - call: "POST /ops/aircraft"
              payload: { tail_number: "N100", seat_count: 143, fleet_type: "SINGLE_FLEET", home_station_code: "DAL" }
              as: OpsController
              captures: { ac1: $.data.id }
            - call: "POST /ops/flight-legs"
              payload: { flight_number: "WN1", origin_station_id: "${st_dal}", destination_station_id: "${st_hou}", scheduled_departure_utc: "2026-10-01T12:00:00Z", scheduled_arrival_utc: "2026-10-01T13:00:00Z", capacity_seats: 143, turn_target_minutes: 35 }
              as: OpsController
              captures: { l1: $.data.id }
            - call: "POST /ops/flight-legs"
              payload: { flight_number: "WN2", origin_station_id: "${st_hou}", destination_station_id: "${st_aus}", scheduled_departure_utc: "2026-10-01T13:35:00Z", scheduled_arrival_utc: "2026-10-01T14:35:00Z", capacity_seats: 143, turn_target_minutes: 35 }
              as: OpsController
              captures: { l2: $.data.id }
            - call: "POST /ops/flight-legs"
              payload: { flight_number: "WN3", origin_station_id: "${st_aus}", destination_station_id: "${st_dal}", scheduled_departure_utc: "2026-10-01T15:10:00Z", scheduled_arrival_utc: "2026-10-01T16:10:00Z", capacity_seats: 143, turn_target_minutes: 35 }
              as: OpsController
              captures: { l3: $.data.id }
            - call: "POST /ops/aircraft-routings"
              payload: { routing_date: "2026-10-01", aircraft_id: "${ac1}", leg_ids: ["${l1}", "${l2}"] }
              as: OpsController
              captures: { r1: $.data.id }
            - call: "POST /ops/crew-members"
              payload: { employee_ref: "C100", crew_role: "CAPTAIN", qualified_fleet: "SINGLE_FLEET", base_station_code: "HOU" }
              as: OpsController
              captures: { cm1: $.data.id }
            - call: "POST /ops/crew-pairings"
              payload: { pairing_date: "2026-10-01", crew_member_id: "${cm1}", leg_ids: ["${l2}", "${l3}"] }
              as: OpsController
              captures: { cp1: $.data.id }
          trigger:
            - call: "POST /ops/flight-legs/${l1}/disruptions"
              payload: { disruption_type: "DELAY", cause: "WEATHER", delay_minutes: 50 }
              as: OpsController
            - call: "GET /ops/flight-legs/${l2}"
              payload: {}
              as: OpsController
              captures: { l2_status: $.data.leg_status, l2_delay: $.data.delay_minutes, l2_prop: $.data.delay_propagated }
            - call: "GET /ops/crew-pairings/${cp1}"
              payload: {}
              as: OpsController
              captures: { cp_status: $.data.pairing_status }
            - call: "GET /ops/flight-legs/${l3}"
              payload: {}
              as: OpsController
              captures: { l3_status: $.data.leg_status, l3_cause: $.data.delay_cause }
          assert:
            - "L1.leg_status == DELAYED, delay_minutes == 50, delay_propagated == false (direct post)"
            - "L2.leg_status == DELAYED with delay_propagated == true and delay_cause == INBOUND_DELAY (hop 1: slack 0 < 50)"
            - "CrewPairing.${cp1}.pairing_status == BROKEN (crew buffer at HOU violated by L2's pushed STD)"
            - "L3.leg_status == DELAYED with delay_cause == CREW (hop 2: caused by pairing break, not by the original post)"
            - "L2's DisruptionEvent propagation_depth == 1 and L3's == 2"

      - name: flight_cancellation_cascade_depth2
        grounds:
          - state_machines.FlightLeg.SCHEDULED_to_CANCELLED
          - state_machines.PassengerJourney.BOOKED_to_CANCELLED
          - state_machines.Booking.ACTIVE_to_CANCELLED
          - calculations.travel_credit_mint
        distinguishing_aspect: |
          Depth-2 cascade from a CANCELLATION post (different trigger than the
          DELAY cascade): the leg cancellation cancels the journey (hop 1), and
          the journey's terminal status then auto-cancels the parent Booking
          (hop 2 — caused by the journey flip, not directly by the leg post),
          while minting the TravelCredit for the journey.
        test_recipe:
          setup:
            - "Stations DAL/HOU; fare FLEX (credit_validity_days=365); aircraft; leg L1 STD 2026-10-01T12:00:00Z"
            - "Passenger PA with booking BK1 containing exactly one journey J1 (base 15000, FLEX) BOOKED on L1"
          setup_api_calls:
            - call: "POST /ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-30T11:00:00Z" }
              as: OpsController
            - call: "POST /ops/stations"
              payload: { iata_code: "DAL" }
              as: OpsController
              captures: { st_dal: $.data.id }
            - call: "POST /ops/stations"
              payload: { iata_code: "HOU" }
              as: OpsController
              captures: { st_hou: $.data.id }
            - call: "POST /ops/fare-classes"
              payload: { code: "FLEX", change_fee_cents: 0, included_bags: 2, credit_validity_days: 365 }
              as: OpsController
              captures: { fc_flex: $.data.id }
            - call: "POST /ops/aircraft"
              payload: { tail_number: "N100", seat_count: 143, fleet_type: "SINGLE_FLEET", home_station_code: "DAL" }
              as: OpsController
            - call: "POST /ops/flight-legs"
              payload: { flight_number: "WN100", origin_station_id: "${st_dal}", destination_station_id: "${st_hou}", scheduled_departure_utc: "2026-10-01T12:00:00Z", scheduled_arrival_utc: "2026-10-01T13:00:00Z", capacity_seats: 143, turn_target_minutes: 35 }
              as: OpsController
              captures: { leg1: $.data.id }
            - call: "POST /ops/passengers"
              payload: { full_name: "P A", date_of_birth: "1990-01-01" }
              as: Passenger
              captures: { pa: $.data.id }
            - call: "POST /ops/bookings"
              payload: { record_locator: "BK100", journeys: [ { passenger_id: "${pa}", flight_leg_id: "${leg1}", fare_class_id: "${fc_flex}", base_fare_cents: 15000 } ] }
              as: Passenger
              as_user_id: "${pa}"
              captures: { bk1: $.data.id, j1: "$.data.journey_ids[0]" }
          trigger:
            - call: "POST /ops/flight-legs/${leg1}/disruptions"
              payload: { disruption_type: "CANCELLATION", cause: "WEATHER" }
              as: OpsController
            - call: "GET /ops/journeys/${j1}"
              payload: {}
              as: Passenger
              as_user_id: "${pa}"
              captures: { j1_status: $.data.journey_status }
            - call: "GET /ops/bookings/${bk1}"
              payload: {}
              as: Passenger
              as_user_id: "${pa}"
              captures: { bk_status: $.data.booking_status }
            - call: "GET /ops/credits"
              payload: { passenger_id: "${pa}" }
              as: Passenger
              as_user_id: "${pa}"
              captures: { cr_amt: "$.data[0].initial_amount_cents", cr_exp: "$.data[0].expires_on" }
          assert:
            - "FlightLeg.${leg1}.leg_status == CANCELLED"
            - "PassengerJourney.${j1}.journey_status == CANCELLED (hop 1)"
            - "Booking.${bk1}.booking_status == CANCELLED (hop 2: auto-derived from all journeys terminal)"
            - "minted TravelCredit.initial_amount_cents == 15000 with expires_on == 2027-10-01 (service date + 365 days)"

  # =============================================================
  # Rule 5 — priority_pair_validation_conflict (different error-category pairs)
  # =============================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_vs_business_safety_on_checkin
        grounds:
          - validations[priority=5]
          - validations[priority=12]
        distinguishing_aspect: |
          Pair (state, business_safety): a single check-in call violates both
          priority 5 (journey already CHECKED_IN — ERR_INVALID_STATE) and
          priority 12 (PREBOARD journey on a non-preboard-eligible fare);
          priority 5 wins, so the response is ERR_INVALID_STATE/409, never
          ERR_PREBOARD_NOT_ELIGIBLE.
        test_recipe:
          setup:
            - "Stations DAL/HOU; fare FLEX (preboard_eligible=false — deliberately mis-provisioned booking made while fare allowed PREBOARD, fare class since corrected to preboard_eligible=false); aircraft; leg L1"
            - "Passenger PA with journey J1 BOOKED on L1 carrying accommodation=PREBOARD, then already CHECKED_IN once"
          setup_api_calls:
            - call: "POST /ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-30T11:00:00Z" }
              as: OpsController
            - call: "POST /ops/stations"
              payload: { iata_code: "DAL" }
              as: OpsController
              captures: { st_dal: $.data.id }
            - call: "POST /ops/stations"
              payload: { iata_code: "HOU" }
              as: OpsController
              captures: { st_hou: $.data.id }
            - call: "POST /ops/fare-classes"
              payload: { code: "PREX", change_fee_cents: 0, preboard_eligible: true, included_bags: 2 }
              as: OpsController
              captures: { fc_prex: $.data.id }
            - call: "POST /ops/aircraft"
              payload: { tail_number: "N100", seat_count: 143, fleet_type: "SINGLE_FLEET", home_station_code: "DAL" }
              as: OpsController
            - call: "POST /ops/flight-legs"
              payload: { flight_number: "WN100", origin_station_id: "${st_dal}", destination_station_id: "${st_hou}", scheduled_departure_utc: "2026-10-01T12:00:00Z", scheduled_arrival_utc: "2026-10-01T13:00:00Z", capacity_seats: 143, turn_target_minutes: 35 }
              as: OpsController
              captures: { leg1: $.data.id, leg1_v: $.data.version }
            - call: "POST /ops/passengers"
              payload: { full_name: "P A", date_of_birth: "1990-01-01" }
              as: Passenger
              captures: { pa: $.data.id }
            - call: "POST /ops/bookings"
              payload: { record_locator: "BKPB0", journeys: [ { passenger_id: "${pa}", flight_leg_id: "${leg1}", fare_class_id: "${fc_prex}", base_fare_cents: 10000, accommodation: "PREBOARD" } ] }
              as: Passenger
              as_user_id: "${pa}"
              captures: { j1: "$.data.journey_ids[0]" }
            - call: "POST /ops/flight-legs/${leg1}/check-ins"
              payload: { journey_id: "${j1}", expected_leg_version: "${leg1_v}" }
              as: Passenger
              as_user_id: "${pa}"
              captures: { leg1_v2: $.data.version }
          trigger:
            - call: "POST /ops/flight-legs/${leg1}/check-ins"
              payload: { journey_id: "${j1}", expected_leg_version: "${leg1_v2}" }
              as: Passenger
              as_user_id: "${pa}"
              captures: { err: $.data.error_id }
          assert:
            - "second check-in returns error_id == ERR_INVALID_STATE with HTTP 409 (priority 5 state check precedes priority 12 business_safety preboard re-validation)"
            - "error_id != ERR_PREBOARD_NOT_ELIGIBLE"
            - "error_id != ERR_DUPLICATE_CHECKIN (priority 19 business_constraint loses to priority 5 state)"

      - name: referential_vs_fiscal_on_routing_create
        grounds:
          - validations[priority=8]
          - validations[priority=23]
        distinguishing_aspect: |
          Pair (business_referential, business_fiscal): routing creation that
          violates both priority 8 (turn buffer: STD_next - STA_prev = 20 <
          turn_target 35 → ERR_ROUTING_TURN_VIOLATION) and a fiscal-flavored
          check expressed on booking (fare inactive, priority 23) cannot
          co-fire on one endpoint — so this instance instead pairs priority 8
          (referential) against priority 9 (referential-overlap) is forbidden
          by the rule's different-category clause; the realized pair is
          business_referential (turn violation, priority 8) versus
          business_temporal (station min_connection, priority 11): turn 20
          violates both the turn buffer and station HOU min_connection 40,
          and priority 8's ERR_ROUTING_TURN_VIOLATION wins over
          ERR_STATION_CONNECTION_VIOLATION.
        test_recipe:
          setup:
            - "Stations DAL/HOU (HOU min_connection_minutes=40); aircraft N100; legs L1 DAL→HOU STA 13:00 and L2 HOU→AUS STD 13:20 with turn_target 35"
          setup_api_calls:
            - call: "POST /ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-30T11:00:00Z" }
              as: OpsController
            - call: "POST /ops/stations"
              payload: { iata_code: "DAL", min_connection_minutes: 40 }
              as: OpsController
              captures: { st_dal: $.data.id }
            - call: "POST /ops/stations"
              payload: { iata_code: "HOU", min_connection_minutes: 40 }
              as: OpsController
              captures: { st_hou: $.data.id }
            - call: "POST /ops/stations"
              payload: { iata_code: "AUS", min_connection_minutes: 40 }
              as: OpsController
              captures: { st_aus: $.data.id }
            - call: "POST /ops/aircraft"
              payload: { tail_number: "N100", seat_count: 143, fleet_type: "SINGLE_FLEET", home_station_code: "DAL" }
              as: OpsController
              captures: { ac1: $.data.id }
            - call: "POST /ops/flight-legs"
              payload: { flight_number: "WN1", origin_station_id: "${st_dal}", destination_station_id: "${st_hou}", scheduled_departure_utc: "2026-10-01T12:00:00Z", scheduled_arrival_utc: "2026-10-01T13:00:00Z", capacity_seats: 143, turn_target_minutes: 35 }
              as: OpsController
              captures: { l1: $.data.id }
            - call: "POST /ops/flight-legs"
              payload: { flight_number: "WN2", origin_station_id: "${st_hou}", destination_station_id: "${st_aus}", scheduled_departure_utc: "2026-10-01T13:20:00Z", scheduled_arrival_utc: "2026-10-01T14:20:00Z", capacity_seats: 143, turn_target_minutes: 35 }
              as: OpsController
              captures: { l2: $.data.id }
          trigger:
            - call: "POST /ops/aircraft-routings"
              payload: { routing_date: "2026-10-01", aircraft_id: "${ac1}", leg_ids: ["${l1}", "${l2}"] }
              as: OpsController
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_ROUTING_TURN_VIOLATION (HTTP 422): priority 8 business_referential turn-buffer check precedes priority 11 business_temporal station-connection check even though STD_next-STA_prev=20 violates both (20 < turn_target 35 and 20 < min_connection 40)"
            - "error_id != ERR_STATION_CONNECTION_VIOLATION"
            - "no AircraftRouting row is created"

  # =============================================================
  # Rule 6 — boundary_precision_check (different metrics/endpoints)
  # =============================================================
  - rule_id: boundary_precision_check
    instances:
      - name: staffing_bags_per_agent_strict_greater_boundary
        grounds:
          - calculations.ground_staffing_adequacy
        distinguishing_aspect: |
          Numeric threshold on the bags_per_ramp_agent metric via the
          staffing-check endpoint: the understaff clause uses a strict >
          against 15, so 60 ACCEPTED bags over 4 ramp agents yields exactly
          15.0 (adequate on that clause) while 61 bags yields 15.25 -> 15.3
          (understaffed) — one bag flips the predicate; the load_factor >=
          0.90 co-condition is satisfied by 90 BOOKED journeys on a
          100-seat leg.
        test_recipe:
          setup:
            - "Stations DAL/HOU; fare FLEX (included_bags=2); aircraft; leg L1 capacity 100, gate_agent_count 3, ramp_agent_count 4 (staff_units 7 >= 5), STD 2026-10-01T12:00:00Z"
            - "90 distinct passengers P01..P90 each with a BOOKED journey on L1 (load_factor 0.90 satisfies the >= co-condition at its own boundary)"
            - "60 ACCEPTED bags distributed across those journeys (all CHECKED_IN so no BOOKED-included-bag expectation inflates projected_bags; projected_bags == 60)"
          setup_api_calls:
            - call: "POST /ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-30T11:00:00Z" }
              as: OpsController
            - call: "POST /ops/stations"
              payload: { iata_code: "DAL" }
              as: OpsController
              captures: { st_dal: $.data.id }
            - call: "POST /ops/stations"
              payload: { iata_code: "HOU" }
              as: OpsController
              captures: { st_hou: $.data.id }
            - call: "POST /ops/fare-classes"
              payload: { code: "FLEX", change_fee_cents: 0, included_bags: 2 }
              as: OpsController
              captures: { fc_flex: $.data.id }
            - call: "POST /ops/aircraft"
              payload: { tail_number: "N100", seat_count: 143, fleet_type: "SINGLE_FLEET", home_station_code: "DAL" }
              as: OpsController
            - call: "POST /ops/flight-legs"
              payload: { flight_number: "WN100", origin_station_id: "${st_dal}", destination_station_id: "${st_hou}", scheduled_departure_utc: "2026-10-01T12:00:00Z", scheduled_arrival_utc: "2026-10-01T13:00:00Z", capacity_seats: 100, turn_target_minutes: 35, gate_agent_count: 3, ramp_agent_count: 4 }
              as: OpsController
              captures: { leg1: $.data.id }
            - call: "POST /ops/passengers"
              payload: { full_name: "P 01", date_of_birth: "1990-01-01" }
              as: Passenger
              captures: { p01: $.data.id }
            - call: "POST /ops/bookings"
              payload: { record_locator: "BKP01", journeys: [ { passenger_id: "${p01}", flight_leg_id: "${leg1}", fare_class_id: "${fc_flex}", base_fare_cents: 10000 } ] }
              as: Passenger
              as_user_id: "${p01}"
              captures: { j01: "$.data.journey_ids[0]" }
