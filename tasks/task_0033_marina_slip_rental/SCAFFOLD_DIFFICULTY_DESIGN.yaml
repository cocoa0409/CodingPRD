            - "trigger response http_status == 422"

  # =====================================================================
  # Rule 6 — boundary_precision_check
  # =====================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: liveaboard_quota_strict_less_than
        grounds:
          - validations[priority=11]
          - state_machines.Tenant.PENDING_to_APPROVED
        distinguishing_aspect: |
          Numeric threshold boundary on Marina.liveaboard_current_count vs
          Marina.liveaboard_cap: gate is `<` (strict). With cap=1 and one
          tenant already APPROVED (count==1), a second PENDING tenant's
          approve is REJECTED at count==cap. The boundary is reached via
          POST /tenants/{id}/liveaboard-approve. Different endpoint from
          rule-6 instance 2.
        test_recipe:
          setup:
            - "Marina with liveaboard_cap=1; Tenant TB already APPROVED at HMK (count==1); Tenant TC currently PENDING."
          setup_api_calls:
            - call: "POST /marinas"
              payload: { name: "HMK", harbor_code: "HMK", liveaboard_cap: 1 }
              as: HarborMaster
              captures: { mar_id: $.data.id }
            - call: "POST /tenants"
              payload: { email: "tb@x.com", full_name: "T B" }
              as: HarborMaster
              captures: { tb_id: $.data.id }
            - call: "POST /tenants"
              payload: { email: "tc@x.com", full_name: "T C" }
              as: HarborMaster
              captures: { tc_id: $.data.id }
            - call: "POST /tenants/${tb_id}/liveaboard-applications"
              payload: { marina_id: "${mar_id}" }
              as: Tenant
              as_user_id: "${tb_id}"
            - call: "POST /tenants/${tb_id}/liveaboard-approve"
              payload: { marina_id: "${mar_id}" }
              as: HarborMaster
            - call: "POST /tenants/${tc_id}/liveaboard-applications"
              payload: { marina_id: "${mar_id}" }
              as: Tenant
              as_user_id: "${tc_id}"
          trigger:
            - call: "POST /tenants/${tc_id}/liveaboard-approve"
              payload: { marina_id: "${mar_id}" }
              as: HarborMaster
              captures: { err: $.data.error_id }
          assert:
            - "trigger response error_id == \"ERR_LIVEABOARD_QUOTA_EXCEEDED\""
            - "Marina.${mar_id}.liveaboard_current_count == 1"

      - name: lease_overlap_adjacent_dates_do_not_collide
        grounds:
          - validations[priority=9]
        distinguishing_aspect: |
          Empty-set/zero-overlap edge: with half-open intervals, a lease
          starting EXACTLY on the previous lease's end_date does NOT collide
          (boundary semantics `<` rather than `<=`). Triggered through POST
          /leases — different endpoint from the strict-less-than quota
          check, different metric (interval adjacency vs counter
          threshold).
        test_recipe:
          setup:
            - "Marina HML; Slip S1; Tenant TD with vessel VD, existing RESERVED lease 2026-09-01..2026-09-10 on S1."
          setup_api_calls:
            - call: "POST /marinas"
              payload: { name: "HML", harbor_code: "HML", liveaboard_cap: 1 }
              as: HarborMaster
              captures: { mar_id: $.data.id }
            - call: "POST /marinas/${mar_id}/slips"
              payload: { slip_number: "L-1", length_ft: 50, beam_ft: 15, power_amp: "A50", base_daily_rate_cents: 5000 }
              as: HarborMaster
              captures: { slip_id: $.data.id, slip_v0: $.data.version }
            - call: "POST /tenants"
              payload: { email: "td@x.com", full_name: "T D" }
              as: HarborMaster
              captures: { td_id: $.data.id }
            - call: "POST /tenants"
              payload: { email: "te@x.com", full_name: "T E" }
              as: HarborMaster
              captures: { te_id: $.data.id }
            - call: "POST /vessels"
              payload: { tenant_id: "${td_id}", name: "VD", loa_ft: 40, beam_ft: 12, insurance_policy_number: "PD", insurance_expires_on: "2027-01-01", insurance_coverage_cents: 6000000 }
              as: Tenant
              as_user_id: "${td_id}"
              captures: { vd_id: $.data.id }
            - call: "POST /vessels"
              payload: { tenant_id: "${te_id}", name: "VE", loa_ft: 40, beam_ft: 12, insurance_policy_number: "PE", insurance_expires_on: "2027-01-01", insurance_coverage_cents: 6000000 }
              as: Tenant
              as_user_id: "${te_id}"
              captures: { ve_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: HarborMaster
            - call: "POST /leases"
              payload: { marina_id: "${mar_id}", slip_id: "${slip_id}", tenant_id: "${td_id}", vessel_id: "${vd_id}", start_date: "2026-09-01", end_date: "2026-09-10", expected_slip_version: "${slip_v0}" }
              as: Tenant
              as_user_id: "${td_id}"
              captures: { lease_d_id: $.data.id, slip_v1: $.data.version }
          trigger:
            - call: "POST /leases"
              payload: { marina_id: "${mar_id}", slip_id: "${slip_id}", tenant_id: "${te_id}", vessel_id: "${ve_id}", start_date: "2026-09-10", end_date: "2026-09-15", expected_slip_version: "${slip_v1}" }
              as: Tenant
              as_user_id: "${te_id}"
              captures: { lease_e_id: $.data.id }
          assert:
            - "Lease.${lease_e_id}.status == \"RESERVED\""
            - "Lease.${lease_e_id}.start_date == \"2026-09-10\""

  # =====================================================================
  # Rule 7 — cross_entity_state_dependency
  # =====================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: lease_checkin_requires_tenant_liveaboard_approved
        grounds:
          - state_machines.Lease.RESERVED_to_ACTIVE
          - state_machines.Tenant.PENDING_to_APPROVED
        distinguishing_aspect: |
          Cross-entity pair (Lease, Tenant): Lease RESERVED -> ACTIVE
          requires Tenant.liveaboard_status == APPROVED when
          Lease.is_liveaboard == true. The pre-condition is on a DIFFERENT
          entity than the one transitioning. Pair = (Lease, Tenant).
        test_recipe:
          setup:
            - "Marina HMM allowing liveaboard; Slip liveaboard_allowed=true; Tenant TF currently PENDING (NOT yet approved); Vessel VF valid; Lease L_F RESERVED with is_liveaboard=true."
          setup_api_calls:
            - call: "POST /marinas"
              payload: { name: "HMM", harbor_code: "HMM", liveaboard_cap: 3 }
              as: HarborMaster
              captures: { mar_id: $.data.id }
            - call: "POST /marinas/${mar_id}/slips"
              payload: { slip_number: "M-1", length_ft: 50, beam_ft: 15, power_amp: "A50", liveaboard_allowed: true, base_daily_rate_cents: 5000 }
              as: HarborMaster
              captures: { slip_id: $.data.id, slip_v0: $.data.version }
