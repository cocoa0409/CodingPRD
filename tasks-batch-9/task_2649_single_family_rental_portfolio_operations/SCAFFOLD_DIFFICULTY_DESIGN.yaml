  - rule_id: boundary_precision_check
    instances:
      - name: fraud_score_exactly_at_block_threshold_allows_booking
        grounds:
          - calculations.prospect_fraud_risk_score
          - validations[priority=422]
          - errors.ERR_PROSPECT_FRAUD_BLOCKED
          - entities.Market.fields.fraud_block_threshold_bps
          - state_machines.ShowingSlot.AVAILABLE_to_BOOKED
        distinguishing_aspect: |
          A prospect whose post-verification score lands on exactly 6000 - the market's
          fraud_block_threshold_bps - must be allowed to book because V422 is strictly greater-than,
          while an otherwise identical prospect 500 cents poorer scores 6002 and is refused; an
          implementation using >= or truncating the 6002.4 quotient downward gets one of the two wrong.
        test_recipe:
          setup:
            - "Market ATL has fraud_block_threshold_bps 6000, rent_index_cents 210000 and showing_buffer_minutes 30."
            - "Home H1 is still PIPELINE, so its leasing_posture is RESTRICTED, which V500 still permits showings on."
            - "Two showing slots sit on H1's calendar exactly 30 minutes apart: S1 15:00-15:30 and S2 16:00-16:30 on 2026-09-10."
            - "Prospect P3A verified with document_match_score_bps 6000, device_reputation_bps 3000, ip_geo_distance_km 400 and verified_monthly_income_cents 157500 - identity 4000, income 7500, history 5000 (tier D), device 9000 - scoring exactly 6000."
            - "Prospect P3B is identical except verified_monthly_income_cents 157000, so its income factor is 7508 and its score is round_half_up(6002.4) = 6002."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: System
            - call: "POST /markets"
