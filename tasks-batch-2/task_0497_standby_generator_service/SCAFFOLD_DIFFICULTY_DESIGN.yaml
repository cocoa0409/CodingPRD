              payload: { permit_number: "PPC1", permit_decision: "APPROVE", fuel_supply_btu_per_hr: 400000 }
              as: ServiceManager
            - call: "POST /projects/${proj}/install"
              payload: { install_tech_id: "${tech}", ats_amps: 200 }
              as: ServiceManager
            - call: "POST /projects/${proj}/activate"
