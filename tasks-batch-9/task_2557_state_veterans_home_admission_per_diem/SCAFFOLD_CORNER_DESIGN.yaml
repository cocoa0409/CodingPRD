      - name: val_trust_fund_floor_rules_separate_withdrawal_from_cost_share_debit
        claim_type: priority_ordering
        grounds:
          - validations[priority=95,ERR_TRUST_FUND_INSUFFICIENT]
          - validations[priority=95,ERR_PNA_RESERVE_BREACH]
          - errors.ERR_PNA_RESERVE_BREACH
