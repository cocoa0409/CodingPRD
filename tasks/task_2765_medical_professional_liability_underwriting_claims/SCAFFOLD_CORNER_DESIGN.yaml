# ===========================================================================
# 1.9 Scaffold Corner Design - task 2765 Medical Professional Liability
# Underwriting & Claims
#
# Breadth walk of references/claim-extraction-guide.md against this scaffold's
# 1.1-1.7 surface. Conventions shared with SCAFFOLD_DIFFICULTY_DESIGN.yaml:
#   * the logical clock is pinned as the first setup call of every chain;
#   * audit ids are literals: uw-1 (UnderwritingOfficer), adj-1 / adj-2
#     (ClaimsAdjuster), appr-1 (ClaimsCommitteeApprover), chair-1
#     (PeerReviewChair), act-1 (ActuarialAnalyst), chief-1 (ChiefActuary),
#     comp-1 (ComplianceOfficer); the Insured role's X-User-ID is the
#     server-minted Insured id, so it is always a ${var};
#   * every OCC write is preceded by a read of the parent that captures
#     `version`, and the captured ${var} is what the payload carries;
#   * "00000000-0000-4000-8000-000000000000" is the canonical absent id.
#
# Reference rating figures reused below (all computed from 1.3 by code):
#   OBSTETRICS_GYNECOLOGY / COOK_IL / R2 1.00 / ILF 1.00 / step 1 0.35
#     -> premium 19285.00, fee 250.00, guaranty 244.19, total 19779.19
#   the same insured at step 2 (0.60) -> 33060.00 / 500.00 / 419.50 / 33979.50
#   the same insured at limit 2000000.00 (ILF 1.45)
#     -> 27963.25 / 500.00 / 355.79 / 28819.04
#   ORTHOPEDIC_SURGERY / MARICOPA_AZ / R2 1.00 / step 5 1.00
#     -> premium 24800.00, fee 250.00, guaranty 313.13, total 25363.13
# ===========================================================================

scaffold_corner_design:

  # =========================================================================
  - section: entities
    instances:
      - name: specialty_class_creation_returns_every_declared_and_defaulted_field
        claim_type: creation
        grounds:
          - endpoints[POST /mpl/specialty-classes]
          - entities.SpecialtyClass
          - response_envelope.success
        distinguishing_aspect: "A 201 response carries the five input fields verbatim plus rate_revision_index 0 and last_approved_rate_change_pct null, wrapped in the meta/response_type/data envelope."
        test_recipe:
          setup:
            - "Empty database with the logical clock pinned at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /mpl/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ActuarialAnalyst
              as_user_id: "act-1"
          trigger:
            - call: "POST /mpl/specialty-classes"
              payload: { specialty_code: "NEUROSURGERY", base_class_code: "CLASS_8", base_rate_per_million: 92000.00, hazard_index: 10.0, benchmark_severity: 1250000.00 }
              as: ActuarialAnalyst
              as_user_id: "act-1"
              captures: { sc_neuro: $.data.id }
          assert:
            - "response.status == 201"
            - "response.response_type == object"
            - "SpecialtyClass.${sc_neuro}.specialty_code == NEUROSURGERY"
            - "SpecialtyClass.${sc_neuro}.base_class_code == CLASS_8"
            - "SpecialtyClass.${sc_neuro}.base_rate_per_million == 92000.00"
            - "SpecialtyClass.${sc_neuro}.hazard_index == 10.0"
            - "SpecialtyClass.${sc_neuro}.benchmark_severity == 1250000.00"
            - "SpecialtyClass.${sc_neuro}.rate_revision_index == 0"
            - "SpecialtyClass.${sc_neuro}.last_approved_rate_change_pct == null"
            - "SpecialtyClass.${sc_neuro}.version == 1"

      - name: insured_retrieval_returns_the_stored_underwriting_and_risk_block
        claim_type: retrieval
        grounds:
          - endpoints[GET /mpl/insureds/{id}]
          - entities.Insured
          - calculations.insured_risk_classification
        distinguishing_aspect: "A GET on a freshly created insured echoes every input field and the snapshot risk block risk_class_score 4.20 / risk_class_code R2 / risk_class_factor 1.00."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "OBSTETRICS_GYNECOLOGY class at hazard_index 7.0 and one PHYSICIAN insured at high_severity_procedure_pct 40, so the snapshot score is 0.40*7.0 + 0.35*4.0 = 4.20 -> R2."
          setup_api_calls:
            - call: "POST /mpl/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: UnderwritingOfficer
              as_user_id: "uw-1"
            - call: "POST /mpl/specialty-classes"
              payload: { specialty_code: "OBSTETRICS_GYNECOLOGY", base_class_code: "CLASS_6", base_rate_per_million: 38000.00, hazard_index: 7.0, benchmark_severity: 640000.00 }
              as: ActuarialAnalyst
              as_user_id: "act-1"
              captures: { sc_obgyn: $.data.id }
            - call: "POST /mpl/insureds"
              payload: { entity_type: "PHYSICIAN", legal_name: "Rivera OBGYN PC", specialty_class_id: "${sc_obgyn}", venue_code: "COOK_IL", high_severity_procedure_pct: 40, years_in_practice: 12, board_certified: true }
              as: UnderwritingOfficer
              as_user_id: "uw-1"
              captures: { ins_a: $.data.id }
          trigger:
            - call: "GET /mpl/insureds/${ins_a}"
              payload: {}
              as: UnderwritingOfficer
              as_user_id: "uw-1"
          assert:
            - "response.status == 200"
            - "Insured.${ins_a}.entity_type == PHYSICIAN"
            - "Insured.${ins_a}.legal_name == Rivera OBGYN PC"
            - "Insured.${ins_a}.specialty_class_id == ${sc_obgyn}"
            - "Insured.${ins_a}.venue_code == COOK_IL"
            - "Insured.${ins_a}.high_severity_procedure_pct == 40"
            - "Insured.${ins_a}.years_in_practice == 12"
            - "Insured.${ins_a}.board_certified == true"
            - "Insured.${ins_a}.risk_class_score == 4.20"
            - "Insured.${ins_a}.risk_class_code == R2"
            - "Insured.${ins_a}.risk_class_factor == 1.00"

      - name: insured_listing_paginates_with_total_count_and_has_more
        claim_type: listing
        grounds:
          - endpoints[GET /mpl/insureds]
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
        distinguishing_aspect: "With three insureds on file, limit 2 / offset 0 returns 2 rows with total_count 3 and has_more true, and offset 2 returns the last row with has_more false."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "One FAMILY_MEDICINE class and three PHYSICIAN insureds created in order: Ash, Beal, Chen."
          setup_api_calls:
            - call: "POST /mpl/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: UnderwritingOfficer
              as_user_id: "uw-1"
            - call: "POST /mpl/specialty-classes"
              payload: { specialty_code: "FAMILY_MEDICINE", base_class_code: "CLASS_1", base_rate_per_million: 9500.00, hazard_index: 2.0, benchmark_severity: 180000.00 }
              as: ActuarialAnalyst
              as_user_id: "act-1"
              captures: { sc_fam: $.data.id }
            - call: "POST /mpl/insureds"
              payload: { entity_type: "PHYSICIAN", legal_name: "Ash Family Medicine", specialty_class_id: "${sc_fam}", venue_code: "TRAVIS_TX", high_severity_procedure_pct: 10, years_in_practice: 8, board_certified: true }
              as: UnderwritingOfficer
              as_user_id: "uw-1"
              captures: { ins_1: $.data.id }
            - call: "POST /mpl/insureds"
              payload: { entity_type: "PHYSICIAN", legal_name: "Beal Family Medicine", specialty_class_id: "${sc_fam}", venue_code: "TRAVIS_TX", high_severity_procedure_pct: 10, years_in_practice: 8, board_certified: true }
              as: UnderwritingOfficer
              as_user_id: "uw-1"
              captures: { ins_2: $.data.id }
            - call: "POST /mpl/insureds"
              payload: { entity_type: "PHYSICIAN", legal_name: "Chen Family Medicine", specialty_class_id: "${sc_fam}", venue_code: "TRAVIS_TX", high_severity_procedure_pct: 10, years_in_practice: 8, board_certified: true }
              as: UnderwritingOfficer
              as_user_id: "uw-1"
              captures: { ins_3: $.data.id }
          trigger:
            - call: "GET /mpl/insureds"
              payload: { limit: 2, offset: 0 }
              as: UnderwritingOfficer
              as_user_id: "uw-1"
            - call: "GET /mpl/insureds"
              payload: { limit: 2, offset: 2 }
              as: UnderwritingOfficer
              as_user_id: "uw-1"
          assert:
            - "first response.response_type == array"
            - "first response.total_count == 3"
            - "first response.has_more == true"
            - "first response returns exactly 2 Insured rows"
            - "second response.total_count == 3"
            - "second response.has_more == false"
            - "second response returns exactly 1 Insured row and it is ${ins_3}"

      - name: policy_get_with_an_unknown_id_returns_policy_not_found
        claim_type: not_found
        grounds:
          - endpoints[GET /mpl/policies/{id}]
          - errors[ERR_POLICY_NOT_FOUND]
          - validations[priority=24]
        distinguishing_aspect: "A syntactically valid but absent policy id returns ERR_POLICY_NOT_FOUND with HTTP 404 and an error envelope, not an empty 200."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z and no Policy rows at all."
          setup_api_calls:
            - call: "POST /mpl/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: UnderwritingOfficer
              as_user_id: "uw-1"
          trigger:
            - call: "GET /mpl/policies/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: UnderwritingOfficer
              as_user_id: "uw-1"
              captures: { err_id: $.data.error_id }
          assert:
            - "response.status == 404"
            - "response.response_type == error"
            - "${err_id} == ERR_POLICY_NOT_FOUND"

      - name: insured_create_missing_required_venue_code_returns_validation_error
        claim_type: required_fields
        grounds:
          - endpoints[POST /mpl/insureds]
          - errors[ERR_VALIDATION]
          - validations[priority=10]
        distinguishing_aspect: "Omitting venue_code, which has source input and no default, returns ERR_VALIDATION (400) and creates no Insured row."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z with one FAMILY_MEDICINE class on file."
          setup_api_calls:
            - call: "POST /mpl/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: UnderwritingOfficer
              as_user_id: "uw-1"
            - call: "POST /mpl/specialty-classes"
              payload: { specialty_code: "FAMILY_MEDICINE", base_class_code: "CLASS_1", base_rate_per_million: 9500.00, hazard_index: 2.0, benchmark_severity: 180000.00 }
              as: ActuarialAnalyst
              as_user_id: "act-1"
              captures: { sc_fam: $.data.id }
          trigger:
            - call: "POST /mpl/insureds"
              payload: { entity_type: "PHYSICIAN", legal_name: "Nowhere Clinic", specialty_class_id: "${sc_fam}", high_severity_procedure_pct: 10 }
              as: UnderwritingOfficer
              as_user_id: "uw-1"
              captures: { err_id: $.data.error_id }
          assert:
            - "response.status == 400"
            - "${err_id} == ERR_VALIDATION"
            - "GET /mpl/insureds returns total_count 0"

      - name: policy_create_applies_declared_defaults_for_omitted_optional_inputs
        claim_type: defaults
        grounds:
          - endpoints[POST /mpl/policies]
          - entities.Policy.fields.prior_acts_step_credit
          - entities.Policy.fields.status
          - entities.Insured.fields.years_in_practice
          - entities.Insured.fields.board_certified
        distinguishing_aspect: "Omitting prior_acts_step_credit yields 0, and omitting years_in_practice / board_certified on the insured yields 0 / false, while the new policy defaults to status QUOTED with null current_term_id and 0 premium totals."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z with one ORTHOPEDIC_SURGERY class on file."
            - "The insured is created without years_in_practice and without board_certified."
          setup_api_calls:
            - call: "POST /mpl/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: UnderwritingOfficer
              as_user_id: "uw-1"
            - call: "POST /mpl/specialty-classes"
              payload: { specialty_code: "ORTHOPEDIC_SURGERY", base_class_code: "CLASS_5", base_rate_per_million: 24800.00, hazard_index: 6.0, benchmark_severity: 480000.00 }
              as: ActuarialAnalyst
              as_user_id: "act-1"
              captures: { sc_ortho: $.data.id }
            - call: "POST /mpl/insureds"
              payload: { entity_type: "PHYSICIAN", legal_name: "Default Ortho PLLC", specialty_class_id: "${sc_ortho}", venue_code: "MARICOPA_AZ", high_severity_procedure_pct: 30 }
              as: UnderwritingOfficer
              as_user_id: "uw-1"
              captures: { ins_x: $.data.id }
          trigger:
            - call: "POST /mpl/policies"
              payload: { insured_id: "${ins_x}", coverage_form: "CLAIMS_MADE", limit_per_claim: 1000000.00, limit_aggregate: 3000000.00, retroactive_date: "2026-08-01", consent_to_settle_clause: "NONE" }
              as: UnderwritingOfficer
              as_user_id: "uw-1"
              captures: { pol_x: $.data.id }
          assert:
            - "response.status == 201"
            - "Insured.${ins_x}.years_in_practice == 0"
            - "Insured.${ins_x}.board_certified == false"
            - "Insured.${ins_x}.status == PROSPECT"
            - "Insured.${ins_x}.credentialing_status == PENDING"
            - "Insured.${ins_x}.credentialing_expires_on == null"
            - "Insured.${ins_x}.open_claim_count == 0"
            - "Insured.${ins_x}.closed_paid_claim_count == 0"
            - "Policy.${pol_x}.prior_acts_step_credit == 0"
            - "Policy.${pol_x}.status == QUOTED"
            - "Policy.${pol_x}.current_term_id == null"
            - "Policy.${pol_x}.quoted_premium_total == 0"
            - "Policy.${pol_x}.written_premium_net_total == 0"
            - "Policy.${pol_x}.policy_number == MPL-000001"

      - name: claim_severity_band_is_computed_and_a_client_supplied_band_input_ignored
        claim_type: computed_fields
        grounds:
          - endpoints[POST /mpl/claims]
          - entities.Claim.fields.severity_band
          - entities.Claim.fields.severity_band_factor
          - calculations.coverage_trigger_resolution
        distinguishing_aspect: "A demand of 800000.00 lands in BAND_3 at factor 0.45 even though the request body smuggles severity_band BAND_1, because both fields have source computed."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; OBSTETRICS_GYNECOLOGY class and one COOK_IL insured, with no policy at all so the intake denies for NO_RESPONDING_COVERAGE."
          setup_api_calls:
            - call: "POST /mpl/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ClaimsAdjuster
              as_user_id: "adj-1"
            - call: "POST /mpl/specialty-classes"
              payload: { specialty_code: "OBSTETRICS_GYNECOLOGY", base_class_code: "CLASS_6", base_rate_per_million: 38000.00, hazard_index: 7.0, benchmark_severity: 640000.00 }
              as: ActuarialAnalyst
              as_user_id: "act-1"
              captures: { sc_obgyn: $.data.id }
            - call: "POST /mpl/insureds"
              payload: { entity_type: "PHYSICIAN", legal_name: "Rivera OBGYN PC", specialty_class_id: "${sc_obgyn}", venue_code: "COOK_IL", high_severity_procedure_pct: 40, years_in_practice: 12, board_certified: true }
              as: UnderwritingOfficer
              as_user_id: "uw-1"
              captures: { ins_a: $.data.id }
          trigger:
            - call: "POST /mpl/claims"
              payload: { insured_id: "${ins_a}", incident_date: "2026-08-05", report_date: "2026-09-01", venue_code: "COOK_IL", allegation_category: "OBSTETRIC_INJURY", demand_amount: 800000.00, severity_band: "BAND_1", severity_band_factor: 0.20 }
              as: ClaimsAdjuster
              as_user_id: "adj-1"
              captures: { clm_z: $.data.id }
          assert:
            - "response.status == 201"
            - "Claim.${clm_z}.severity_band == BAND_3"
            - "Claim.${clm_z}.severity_band_factor == 0.45"
            - "Claim.${clm_z}.coverage_status == DENIED"
            - "Claim.${clm_z}.denial_reason == NO_RESPONDING_COVERAGE"
            - "Claim.${clm_z}.policy_term_id == null"

      - name: specialty_class_system_fields_are_server_minted_with_client_ids_input_ignored
        claim_type: system_fields
        grounds:
          - endpoints[POST /mpl/specialty-classes]
          - entities.SpecialtyClass.fields.rate_revision_index
          - response_envelope.success
        distinguishing_aspect: "A request that supplies id, created_at and rate_revision_index 9 is accepted but the server mints its own id and timestamps and keeps rate_revision_index at 0."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z with no SpecialtyClass rows."
          setup_api_calls:
            - call: "POST /mpl/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ActuarialAnalyst
              as_user_id: "act-1"
          trigger:
            - call: "POST /mpl/specialty-classes"
              payload: { specialty_code: "EMERGENCY_MEDICINE", base_class_code: "CLASS_4", base_rate_per_million: 18000.00, hazard_index: 4.0, benchmark_severity: 320000.00, id: "00000000-0000-4000-8000-000000000000", created_at: "1999-01-01T00:00:00Z", rate_revision_index: 9 }
              as: ActuarialAnalyst
              as_user_id: "act-1"
              captures: { sc_em: $.data.id }
          assert:
            - "response.status == 201"
            - "${sc_em} != 00000000-0000-4000-8000-000000000000"
            - "SpecialtyClass.${sc_em}.created_at == 2026-08-01T00:00:00Z"
            - "SpecialtyClass.${sc_em}.updated_at == 2026-08-01T00:00:00Z"
            - "SpecialtyClass.${sc_em}.rate_revision_index == 0"
            - "SpecialtyClass.${sc_em}.version == 1"

      - name: policy_create_with_an_invalid_enum_coverage_form_returns_validation_error
        claim_type: type_constraints
        grounds:
          - endpoints[POST /mpl/policies]
          - entities.Policy.fields.coverage_form
          - validations[priority=10]
          - errors[ERR_VALIDATION]
        distinguishing_aspect: "coverage_form SURPLUS_LINES is not a declared member of {CLAIMS_MADE, OCCURRENCE}, so the create returns ERR_VALIDATION (400) and no Policy row appears."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z with an ORTHOPEDIC_SURGERY class and one MARICOPA_AZ insured."
          setup_api_calls:
            - call: "POST /mpl/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: UnderwritingOfficer
              as_user_id: "uw-1"
            - call: "POST /mpl/specialty-classes"
              payload: { specialty_code: "ORTHOPEDIC_SURGERY", base_class_code: "CLASS_5", base_rate_per_million: 24800.00, hazard_index: 6.0, benchmark_severity: 480000.00 }
              as: ActuarialAnalyst
              as_user_id: "act-1"
              captures: { sc_ortho: $.data.id }
            - call: "POST /mpl/insureds"
              payload: { entity_type: "PHYSICIAN", legal_name: "Desert Orthopedics PLLC", specialty_class_id: "${sc_ortho}", venue_code: "MARICOPA_AZ", high_severity_procedure_pct: 30, years_in_practice: 12, board_certified: true }
              as: UnderwritingOfficer
              as_user_id: "uw-1"
              captures: { ins_b: $.data.id }
          trigger:
            - call: "POST /mpl/policies"
              payload: { insured_id: "${ins_b}", coverage_form: "SURPLUS_LINES", limit_per_claim: 1000000.00, limit_aggregate: 3000000.00, retroactive_date: "2026-08-01", consent_to_settle_clause: "NONE" }
              as: UnderwritingOfficer
              as_user_id: "uw-1"
              captures: { err_id: $.data.error_id }
          assert:
            - "response.status == 400"
            - "${err_id} == ERR_VALIDATION"
            - "GET /mpl/policies returns total_count 0"

      - name: reserve_entry_is_append_only_and_exposes_no_version_or_updated_at
        claim_type: immutability
        grounds:
          - entities.ReserveEntry
          - endpoints[GET /mpl/claims/{id}/reserve-entries]
          - endpoints[POST /mpl/claims/{id}/reserve-entries]
        distinguishing_aspect: "ReserveEntry is declared common_fields false, so its rows carry id, created_at and set_by_user_id but neither version nor updated_at, and no update endpoint exists to mutate a posting."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; OBSTETRICS_GYNECOLOGY class, COOK_IL insured CREDENTIALED to 2028-01-01, IN_FORCE claims-made term, one COVERED claim."
            - "One CASE_BASIS reserve posting of 300000.00 indemnity and 84000.00 expense."
          setup_api_calls:
            - call: "POST /mpl/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: UnderwritingOfficer
              as_user_id: "uw-1"
            - call: "POST /mpl/specialty-classes"
              payload: { specialty_code: "OBSTETRICS_GYNECOLOGY", base_class_code: "CLASS_6", base_rate_per_million: 38000.00, hazard_index: 7.0, benchmark_severity: 640000.00 }
              as: ActuarialAnalyst
              as_user_id: "act-1"
              captures: { sc_obgyn: $.data.id }
            - call: "POST /mpl/insureds"
              payload: { entity_type: "PHYSICIAN", legal_name: "Rivera OBGYN PC", specialty_class_id: "${sc_obgyn}", venue_code: "COOK_IL", high_severity_procedure_pct: 40, years_in_practice: 12, board_certified: true }
              as: UnderwritingOfficer
              as_user_id: "uw-1"
              captures: { ins_a: $.data.id }
            - call: "POST /mpl/insureds/${ins_a}/credentialing-decision"
              payload: { credentialing_status: "CREDENTIALED", credentialing_expires_on: "2028-01-01" }
              as: UnderwritingOfficer
              as_user_id: "uw-1"
            - call: "POST /mpl/policies"
              payload: { insured_id: "${ins_a}", coverage_form: "CLAIMS_MADE", limit_per_claim: 1000000.00, limit_aggregate: 3000000.00, retroactive_date: "2026-08-01", prior_acts_step_credit: 0, consent_to_settle_clause: "NONE" }
              as: UnderwritingOfficer
              as_user_id: "uw-1"
              captures: { pol_a: $.data.id, pol_a_v0: $.data.version }
            - call: "POST /mpl/policies/${pol_a}/terms"
              payload: { effective_date: "2026-08-01", expiration_date: "2027-08-01", expected_policy_version: "${pol_a_v0}" }
              as: UnderwritingOfficer
              as_user_id: "uw-1"
              captures: { term_a1: $.data.id }
            - call: "POST /mpl/policy-terms/${term_a1}/issuance"
              payload: {}
              as: UnderwritingOfficer
              as_user_id: "uw-1"
            - call: "POST /mpl/claims"
              payload: { insured_id: "${ins_a}", incident_date: "2026-08-05", report_date: "2026-09-01", venue_code: "COOK_IL", allegation_category: "OBSTETRIC_INJURY", demand_amount: 800000.00 }
              as: ClaimsAdjuster
              as_user_id: "adj-1"
              captures: { clm_a: $.data.id }
            - call: "POST /mpl/claims/${clm_a}/coverage-decision"
