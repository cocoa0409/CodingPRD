# =============================================================================
# SCAFFOLD — Clinical Trial Smart Matching
# Expert difficulty tier (§0.4): 11 entities, 32 endpoints, 26 error codes,
# 5 calculation rules (3 with dual variants), 6 state machines.
# =============================================================================

scenario: "Clinical Trial Smart Matching: trial inclusion/exclusion criteria, informed consent versioning, randomization scheme, IRB approval, adverse event reporting, blood draw window, participant compensation payment"

domain_name: clinical-trial-matching
api_prefix: /
# Graph topology with many top-level collections (trials, participants,
# screenings, enrollments, irb-reviews, adverse-events, payments). The API has
# no single shared resource prefix, so the prefix is the API root; each entity's
# collection segment (trials, participants, enrollments, …) is the first path
# segment of its resource URL.

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: selector_policy
  complexity_layers:
    - cascading_side_effects
    - derived_field_reconciliation
    - optimistic_concurrency
    - rate_threshold_triggers
    - selector_policy

  entity_topology: graph
  # Participant and Trial are peers joined by Screening (matching result) and
  # Enrollment (the committed link). Consent documents version within a Trial;
  # adverse events and visits hang off Enrollment. Mix of FK references with one
  # many-to-many bridge (Screening) — graph, not a strict tree.

  state_machine_shape: parallel
  # Enrollment carries two independent dimensions: enrollment_status
  # (SCREENED→CONSENTED→RANDOMIZED→ACTIVE→COMPLETED) and safety_status
  # (CLEAR→FLAGGED→HOLD) that evolve independently driven by AdverseEvent.
  # IRBReview is a branching fork (APPROVE/REJECT/REVISE). ConsentDocument has a
  # revision cycle (ACTIVE→SUPERSEDED via a new IRB-approved version). Trial
  # posture is compound (derived from IRB status + safety holds).

  relationship_patterns:
    - one_to_many        # Trial → EligibilityCriterion, ConsentDocument, RandomizationArm, IRBReview
    - many_to_many       # Participant ↔ Trial via Screening
    - cross_aggregate    # AdverseEvent on an Enrollment freezes its parent Trial

  role_model: segregation_of_duties
  # The Investigator who reports an AdverseEvent cannot triage/adjudicate it (a
  # SafetyOfficer does). The IRBReviewer who decides a protocol cannot be the
  # trial's Sponsor. CoordinatorStaff run screening/enrollment/visits.

  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — EMIT VERBATIM)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Trial
    parent: null
    common_fields: true
    fields:
      - name: title
        type: string
        source: input
        description: "Human-readable trial name."
      - name: sponsor_user_id
        type: string
        source: system
        description: "X-User-ID of the Sponsor who created the trial; ownership/segregation anchor."
      - name: target_enrollment
        type: integer
        source: input
        description: "Number of participants the trial intends to randomize."
        constraints: ">= 1"
      - name: randomization_method
        type: enum
        source: input
        description: "Allocation algorithm."
        constraints: "one of {SIMPLE, PERMUTED_BLOCK}; PERMUTED_BLOCK requires block_size."
      - name: block_size
        type: integer
        source: input
        description: "Block length for PERMUTED_BLOCK randomization; null for SIMPLE."
        default: null
        constraints: "when set, must be a positive multiple of the number of arms."
      - name: irb_status
        type: enum
        source: computed
        description: "Mirrors the latest decided PROTOCOL IRBReview outcome for this trial."
        default: NONE
        constraints: "one of {NONE, PENDING, APPROVED, REJECTED}."
      - name: posture
        type: enum
        source: computed
        description: "Derived gate over child operations; recomputed on IRB and safety changes."
        default: SETUP
        constraints: "one of {SETUP, OPEN, FROZEN}."
      - name: enrolled_count
        type: integer
        source: computed
        description: "Count of Enrollments for this trial whose enrollment_status IN {RANDOMIZED, ACTIVE, COMPLETED}."
        default: 0
      - name: active_safety_holds
        type: integer
        source: computed
        description: "Count of Enrollments for this trial whose safety_status == HOLD."
        default: 0

  - name: EligibilityCriterion
    parent: Trial
    common_fields: true
    fields:
      - name: trial_id
        type: string
        source: input
        description: "FK -> Trial.id; criterion belongs to this trial."
      - name: kind
        type: enum
        source: input
        description: "Whether satisfying the predicate qualifies or disqualifies the participant."
        constraints: "one of {INCLUSION, EXCLUSION}."
      - name: attribute
        type: enum
        source: input
        description: "Participant attribute the predicate reads."
        constraints: "one of {age_years, weight_kg, hba1c, prior_trials_count, biomarker_positive}."
      - name: comparator
        type: enum
        source: input
        description: "Relational operator applied between attribute and threshold."
        constraints: "one of {GE, GT, LE, LT, EQ}."
      - name: threshold
        type: number
        source: input
        description: "Right-hand side of the predicate; for biomarker_positive use 1 (true) / 0 (false)."

  - name: RandomizationArm
    parent: Trial
    common_fields: true
    fields:
      - name: trial_id
        type: string
        source: input
        description: "FK -> Trial.id; arm belongs to this trial."
      - name: name
        type: string
        source: input
        description: "Arm label, e.g. TREATMENT or PLACEBO."
      - name: allocation_weight
        type: integer
        source: input
        description: "Relative allocation ratio numerator for this arm."
        constraints: ">= 1"
      - name: assigned_count
        type: integer
        source: computed
        description: "Count of Enrollments randomized to this arm (enrollment_status IN {RANDOMIZED, ACTIVE, COMPLETED})."
        default: 0

  - name: ConsentDocument
    parent: Trial
    common_fields: true
    fields:
      - name: trial_id
        type: string
        source: input
        description: "FK -> Trial.id; consent document for this trial."
      - name: version_number
        type: integer
        source: system
        description: "Monotonic per-trial consent version; first document is 1, each new document increments by 1."
      - name: body_hash
        type: string
        source: input
        description: "Opaque hash of the consent text; identifies the wording."
      - name: status
        type: enum
        source: computed
        description: "Lifecycle of this consent version."
        default: DRAFT
        constraints: "one of {DRAFT, IRB_APPROVED, ACTIVE, SUPERSEDED}."
      - name: irb_review_id
        type: string
        source: computed
        description: "Back-pointer to the IRBReview.id that approved this version (null while DRAFT). Soft reference, not a forward-owned FK; reviews for a document are listed via GET /trials/{id}/irb-reviews."
        default: null

  - name: IRBReview
    parent: Trial
    common_fields: true
    fields:
      - name: trial_id
        type: string
        source: input
        description: "FK -> Trial.id; the trial under review."
      - name: scope
        type: enum
        source: input
        description: "What the review decides on."
        constraints: "one of {PROTOCOL, CONSENT}."
      - name: consent_document_id
        type: string
        source: input
        description: "Soft reference to the ConsentDocument.id under review; required when scope==CONSENT, null when scope==PROTOCOL. Not a forward-owned FK (a review is owned by its trial); resolve via GET /trials/{id}/consent-documents."
        default: null
      - name: reviewer_user_id
        type: string
        source: system
        description: "X-User-ID of the IRBReviewer who decided; null while PENDING."
        default: null
      - name: decision
        type: enum
        source: computed
        description: "Review state."
        default: PENDING
        constraints: "one of {PENDING, APPROVED, REJECTED, REVISE_REQUESTED}."
      - name: decided_at
        type: datetime
        source: system
        description: "Server clock at the moment of decision; null while PENDING."
        default: null

  - name: Participant
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: "Participant display name."
      - name: age_years
        type: integer
        source: input
        description: "Age in completed years."
        constraints: ">= 0"
      - name: weight_kg
        type: number
        source: input
        description: "Body weight in kilograms."
      - name: hba1c
        type: number
        source: input
        description: "Glycated hemoglobin percentage, read by eligibility predicates."
      - name: prior_trials_count
        type: integer
        source: input
        description: "How many prior trials this participant has joined."
        default: 0
      - name: biomarker_positive
        type: boolean
        source: input
        description: "Whether the target biomarker is present."
        default: false

  - name: Screening
    parent: null
    common_fields: true
    fields:
      - name: trial_id
        type: string
        source: input
        description: "FK -> Trial.id; trial the participant was matched against."
      - name: participant_id
        type: string
        source: input
        description: "FK -> Participant.id; the matched participant."
      - name: match_result
        type: enum
        source: computed
        description: "Outcome of evaluating the trial's criteria against the participant snapshot."
        default: ELIGIBLE
        constraints: "one of {ELIGIBLE, INELIGIBLE}."
      - name: failed_criteria_count
        type: integer
        source: computed
        description: "Number of criteria the participant failed at screening time (see calc eligibility_match)."
        default: 0
      - name: match_score
        type: number
        source: computed
        description: "Weighted eligibility score in [0,1] (see calc match_score)."
        default: 0

  - name: Enrollment
    parent: null
    common_fields: true
    fields:
      - name: trial_id
        type: string
        source: input
        description: "FK -> Trial.id; trial the participant is enrolled in (copied from the screening)."
      - name: participant_id
        type: string
        source: input
        description: "FK -> Participant.id; the enrolled participant (copied from the screening)."
      - name: screening_id
        type: string
        source: input
        description: "FK -> Screening.id; the ELIGIBLE screening that authorized enrollment."
      - name: enrollment_status
        type: enum
        source: computed
        description: "Primary lifecycle dimension (parallel with safety_status)."
        default: SCREENED
        constraints: "one of {SCREENED, CONSENTED, RANDOMIZED, ACTIVE, COMPLETED, WITHDRAWN}."
      - name: safety_status
        type: enum
        source: computed
        description: "Independent safety dimension driven by adverse events."
        default: CLEAR
        constraints: "one of {CLEAR, FLAGGED, HOLD}."
      - name: arm_id
        type: string
        source: computed
        description: "FK -> RandomizationArm.id; assigned at RANDOMIZED (null before)."
        default: null
      - name: signed_consent_document_id
        type: string
        source: computed
        description: "FK -> ConsentDocument.id; the ACTIVE consent version the participant signed to reach CONSENTED (null before consent and after a reconsent revert)."
        default: null
      - name: signed_consent_version
        type: integer
        source: computed
        description: "Snapshot of the signed ConsentDocument.version_number at consent time; cleared (null) on reconsent revert."
        default: null
      - name: completed_visits_count
        type: integer
        source: computed
        description: "Count of Visits for this enrollment whose status == COMPLETED."
        default: 0

  - name: Visit
    parent: Enrollment
    common_fields: true
    fields:
      - name: enrollment_id
        type: string
        source: input
        description: "FK -> Enrollment.id; the enrollment this visit belongs to."
      - name: sequence_index
        type: integer
        source: input
        description: "1-based ordinal of the visit within the enrollment schedule."
        constraints: ">= 1; unique per enrollment."
      - name: scheduled_at
        type: datetime
        source: input
        description: "Planned visit time (ISO 8601 UTC), center of the blood-draw window."
      - name: draw_window_minutes
        type: integer
        source: input
        description: "Half-width of the acceptable blood-draw window around scheduled_at, in minutes."
        constraints: ">= 0"
      - name: drawn_at
        type: datetime
        source: input
        description: "Actual blood-draw time supplied at completion (ISO 8601 UTC); null while SCHEDULED."
        default: null
      - name: draw_in_window
        type: boolean
        source: computed
        description: "Whether drawn_at fell inside the half-open window [scheduled_at - w, scheduled_at + w); see calc draw_window_check."
        default: false
      - name: draw_deviation_minutes
        type: integer
        source: computed
        description: "Absolute whole minutes between drawn_at and scheduled_at, floored; null while SCHEDULED."
        default: null
      - name: status
        type: enum
        source: computed
        description: "Visit lifecycle."
        default: SCHEDULED
        constraints: "one of {SCHEDULED, COMPLETED, CANCELLED}."
      - name: payable_amount_cents
        type: integer
        source: computed
        description: "Compensation owed for this visit once COMPLETED (see calc visit_compensation)."
        default: 0

  - name: AdverseEvent
    parent: Enrollment
    common_fields: true
    fields:
      - name: enrollment_id
        type: string
        source: input
        description: "FK -> Enrollment.id; the enrollment on which the event occurred."
      - name: reporter_user_id
        type: string
        source: system
        description: "X-User-ID of the Investigator who reported the event (segregation anchor)."
      - name: severity
        type: enum
        source: input
        description: "Clinical severity grade as reported."
        constraints: "one of {MILD, MODERATE, SEVERE, LIFE_THREATENING}."
      - name: is_serious
        type: boolean
        source: input
        description: "Whether the event meets the regulatory 'serious' definition (SAE)."
        default: false
      - name: occurred_at
        type: datetime
        source: input
        description: "When the event occurred (ISO 8601 UTC)."
      - name: report_status
        type: enum
        source: computed
        description: "Reporting/adjudication lifecycle."
        default: REPORTED
        constraints: "one of {REPORTED, UNDER_REVIEW, ADJUDICATED_RELATED, ADJUDICATED_UNRELATED}."
      - name: adjudicator_user_id
        type: string
        source: system
        description: "X-User-ID of the SafetyOfficer who adjudicated; null until adjudicated."
        default: null

  - name: CompensationPayment
    parent: Enrollment
    common_fields: true
    fields:
      - name: enrollment_id
        type: string
        source: input
        description: "FK -> Enrollment.id; the enrollment being paid."
      - name: amount_cents
        type: integer
        source: computed
        description: "Net compensation swept for this payment after withholding (see calc compensation_sweep)."
        default: 0
      - name: gross_cents
        type: integer
        source: computed
        description: "Sum of payable_amount_cents over the swept visits, before withholding."
        default: 0
      - name: visit_ids
        type: array
        source: computed
        description: "Ids of the COMPLETED, previously-unpaid Visits included in this sweep."
      - name: status
        type: enum
        source: computed
        description: "Payment lifecycle."
        default: PENDING
        constraints: "one of {PENDING, PAID}."

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  # ---------------------------------------------------------------------------
  # 1) IRBReview — BRANCHING fork (APPROVE / REJECT / REVISE) with divergent
  #    side-effect sets per branch. Non-linear (Rule 3 instance A).
  # ---------------------------------------------------------------------------
  - entity: IRBReview
    initial_state: PENDING
    terminal_states: [APPROVED, REJECTED, REVISE_REQUESTED]
    transitions:
      - from: PENDING
        to: APPROVED
        trigger: "POST /trials/{id}/irb-reviews/{reviewId}/decide  (action=APPROVE)"
        actor: IRBReviewer
        preconditions:
          - "review.decision == PENDING"
          - "the acting IRBReviewer X-User-ID != trial.sponsor_user_id (segregation of duties)"
          - "if scope == CONSENT: the referenced ConsentDocument.status == DRAFT"
        side_effects:
          - "set decision = APPROVED, reviewer_user_id = X-User-ID, decided_at = clock"
          - "if scope == PROTOCOL: set Trial.irb_status = APPROVED; recompute Trial.posture (SETUP -> OPEN once an ACTIVE consent exists and >=1 arm)"
          - "if scope == CONSENT: transition the referenced ConsentDocument DRAFT -> IRB_APPROVED and set its irb_review_id to this review (cascade)"
          - "increments Trial.version by 1"
      - from: PENDING
        to: REJECTED
        trigger: "POST /trials/{id}/irb-reviews/{reviewId}/decide  (action=REJECT)"
        actor: IRBReviewer
        preconditions:
          - "review.decision == PENDING"
          - "the acting IRBReviewer X-User-ID != trial.sponsor_user_id"
        side_effects:
          - "set decision = REJECTED, reviewer_user_id = X-User-ID, decided_at = clock"
          - "if scope == PROTOCOL: set Trial.irb_status = REJECTED; Trial.posture stays SETUP"
          - "increments Trial.version by 1"
      - from: PENDING
        to: REVISE_REQUESTED
        trigger: "POST /trials/{id}/irb-reviews/{reviewId}/decide  (action=REVISE)"
        actor: IRBReviewer
        preconditions:
          - "review.decision == PENDING"
          - "the acting IRBReviewer X-User-ID != trial.sponsor_user_id"
        side_effects:
          - "set decision = REVISE_REQUESTED, reviewer_user_id = X-User-ID, decided_at = clock"
          - "if scope == PROTOCOL: Trial.irb_status stays PENDING"
          - "increments Trial.version by 1"
        note: "REVISE is a terminal branch: the review is no longer decidable; the sponsor must open a fresh review."

  # ---------------------------------------------------------------------------
  # 2) ConsentDocument — revision CYCLE: ACTIVE -> SUPERSEDED when a newer
  #    version goes ACTIVE. Non-linear (Rule 3 instance B; different entity).
  # ---------------------------------------------------------------------------
  - entity: ConsentDocument
    initial_state: DRAFT
    terminal_states: [SUPERSEDED]
    transitions:
      - from: DRAFT
        to: IRB_APPROVED
        trigger: "system: IRBReview(scope=CONSENT) decided APPROVE"
        actor: system
        preconditions:
          - "document.status == DRAFT"
        side_effects:
          - "set irb_review_id to the approving review"
          - "increments ConsentDocument.version by 1"
      - from: IRB_APPROVED
        to: ACTIVE
        trigger: "POST /trials/{id}/consent-documents/{docId}/activate"
        actor: Sponsor
        preconditions:
          - "document.status == IRB_APPROVED"
          - "Trial.irb_status == APPROVED (protocol approved)"
          - "Trial has >= 1 RandomizationArm"
        side_effects:
          - "if a prior ACTIVE ConsentDocument exists for this trial: transition it ACTIVE -> SUPERSEDED (cascade hop 1)"
          - "recompute Trial.posture (SETUP -> OPEN when irb_status==APPROVED and no active safety holds)"
          - "increments Trial.version by 1"
        note: "Activating a new version is the revision-loop edge; the prior ACTIVE doc cycles to SUPERSEDED, which itself reconsents enrollments."
      - from: ACTIVE
        to: SUPERSEDED
        trigger: "system: a newer ConsentDocument for the same trial transitions to ACTIVE (cascade hop from activate)"
        actor: system
        preconditions:
          - "document.status == ACTIVE"
        side_effects:
          - "for every Enrollment whose signed_consent_document_id == THIS now-superseded document.id and whose enrollment_status == CONSENTED: fire the Enrollment SM CONSENTED -> SCREENED reconsent edge (cascade hop 2; rooted at consent-document activate, depth-3 chain: activate -> supersede prior -> reconsent enrollment)"
          - "increments ConsentDocument.version by 1"

  # ---------------------------------------------------------------------------
  # 3) Enrollment.enrollment_status — PARALLEL dimension #1, with a reconsent
  #    CYCLE CONSENTED -> SCREENED. Triggered by the merged transition endpoint.
  # ---------------------------------------------------------------------------
  - entity: Enrollment
    initial_state: SCREENED
    terminal_states: [COMPLETED, WITHDRAWN]
    transitions:
      - from: SCREENED
        to: CONSENTED
        trigger: "POST /enrollments/{id}/transition  (action=CONSENT)"
        actor: CoordinatorStaff
        preconditions:
          - "enrollment.enrollment_status == SCREENED"
          - "Trial.posture == OPEN (cross-entity: Enrollment depends on Trial state)"
          - "the signed ConsentDocument.status == ACTIVE and belongs to this trial"
          - "the signed ConsentDocument.version_number == the trial's current ACTIVE consent version_number"
        side_effects:
          - "set signed_consent_document_id = consent_document_id and signed_consent_version = that document's version_number"
          - "set enrollment_status = CONSENTED"
          - "increments Enrollment.version by 1"
      - from: CONSENTED
        to: RANDOMIZED
        trigger: "POST /enrollments/{id}/transition  (action=RANDOMIZE)"
        actor: CoordinatorStaff
        preconditions:
          - "enrollment.enrollment_status == CONSENTED"
          - "enrollment.safety_status == CLEAR (cross-dimension gate)"
          - "Trial.posture == OPEN"
          - "Trial.enrolled_count < Trial.target_enrollment (capacity)"
          - "expected_trial_version == live Trial.version (OCC)"
        side_effects:
          - "select RandomizationArm via selector arm_selection; set Enrollment.arm_id"
          - "set enrollment_status = RANDOMIZED"
          - "increment chosen RandomizationArm.assigned_count by 1 (cascade)"
          - "increment Trial.enrolled_count by 1 (cascade)"
          - "recompute Trial.posture; increments Enrollment.version by 1; increments Trial.version by 1"
      - from: RANDOMIZED
        to: ACTIVE
        trigger: "POST /enrollments/{id}/transition  (action=ACTIVATE)"
        actor: CoordinatorStaff
        preconditions:
          - "enrollment.enrollment_status == RANDOMIZED"
          - "enrollment.safety_status != HOLD"
        side_effects:
          - "set enrollment_status = ACTIVE"
          - "increments Enrollment.version by 1"
      - from: ACTIVE
        to: COMPLETED
        trigger: "POST /enrollments/{id}/transition  (action=COMPLETE)"
        actor: CoordinatorStaff
        preconditions:
          - "enrollment.enrollment_status == ACTIVE"
          - "no Visit of this enrollment is in status SCHEDULED (all visits resolved)"
          - "enrollment.safety_status != HOLD"
        side_effects:
          - "set enrollment_status = COMPLETED"
          - "increments Enrollment.version by 1"
      - from: CONSENTED
        to: SCREENED
        trigger: "system: the ConsentDocument signed by this enrollment transitions ACTIVE -> SUPERSEDED"
        actor: system
        preconditions:
          - "enrollment.enrollment_status == CONSENTED"
        side_effects:
          - "clear Enrollment.signed_consent_document_id and signed_consent_version (set both null)"
          - "set enrollment_status = SCREENED (reconsent required)"
          - "increments Enrollment.version by 1"
        note: "Reconsent loop edge — the cyclic part of the machine; fires as the third hop of the consent-activation cascade."
      - from: SCREENED
        to: WITHDRAWN
        trigger: "POST /enrollments/{id}/transition  (action=WITHDRAW)"
        actor: CoordinatorStaff
        preconditions:
          - "enrollment.enrollment_status IN {SCREENED, CONSENTED, RANDOMIZED, ACTIVE}"
        side_effects:
          - "set enrollment_status = WITHDRAWN"
          - "if enrollment was RANDOMIZED or ACTIVE: decrement its RandomizationArm.assigned_count by 1 AND decrement Trial.enrolled_count by 1 (compensating cascade)"
          - "cancel every Visit of this enrollment in status SCHEDULED (set status=CANCELLED)"
          - "recompute Trial.posture; increments Enrollment.version by 1"
        note: "from: lists SCREENED but the precondition admits all four non-terminal states; the arm/count compensation fires only for RANDOMIZED/ACTIVE."

  # ---------------------------------------------------------------------------
  # 4) Enrollment.safety_status — PARALLEL dimension #2 (same entity as #3,
  #    independent axis). Driven by AdverseEvent review.
  # ---------------------------------------------------------------------------
  - entity: Enrollment
    initial_state: CLEAR
    terminal_states: []
    transitions:
      - from: CLEAR
        to: FLAGGED
        trigger: "system: an AdverseEvent on this enrollment moves REPORTED -> UNDER_REVIEW"
        actor: system
        preconditions:
          - "enrollment.safety_status == CLEAR"
        side_effects:
          - "set safety_status = FLAGGED"
          - "increments Enrollment.version by 1"
      - from: FLAGGED
        to: HOLD
        trigger: "system: an AdverseEvent on this enrollment is ADJUDICATED_RELATED with severity IN {SEVERE, LIFE_THREATENING}"
        actor: system
        preconditions:
          - "enrollment.safety_status == FLAGGED"
        side_effects:
          - "set safety_status = HOLD"
          - "increment Trial.active_safety_holds by 1 (cascade)"
          - "recompute Trial.posture (-> FROZEN when active_safety_holds >= 1)"
          - "increments Enrollment.version by 1"
      - from: HOLD
        to: CLEAR
        trigger: "POST /enrollments/{id}/lift-hold"
        actor: SafetyOfficer
        preconditions:
          - "enrollment.safety_status == HOLD"
          - "every AdverseEvent on this enrollment is in {ADJUDICATED_RELATED, ADJUDICATED_UNRELATED} (none REPORTED/UNDER_REVIEW)"
        side_effects:
          - "set safety_status = CLEAR"
          - "decrement Trial.active_safety_holds by 1 (compensating cascade)"
          - "recompute Trial.posture (-> OPEN when active_safety_holds == 0 and irb_status == APPROVED and an ACTIVE consent exists)"
          - "increments Enrollment.version by 1"
      - from: FLAGGED
        to: CLEAR
        trigger: "system: an AdverseEvent on this enrollment is ADJUDICATED_UNRELATED and no other AE keeps it flagged"
        actor: system
        preconditions:
          - "enrollment.safety_status == FLAGGED"
          - "no AdverseEvent on this enrollment is in {REPORTED, UNDER_REVIEW}"
        side_effects:
          - "set safety_status = CLEAR"
          - "increments Enrollment.version by 1"

  # ---------------------------------------------------------------------------
  # 5) AdverseEvent — reporting → review → adjudication; drives Enrollment
  #    safety dimension and (transitively) Trial posture (cascade depth 3+).
  # ---------------------------------------------------------------------------
  - entity: AdverseEvent
    initial_state: REPORTED
    terminal_states: [ADJUDICATED_RELATED, ADJUDICATED_UNRELATED]
    transitions:
      - from: REPORTED
        to: UNDER_REVIEW
        trigger: "POST /adverse-events/{id}/review  (action=TRIAGE)"
        actor: SafetyOfficer
        preconditions:
          - "event.report_status == REPORTED"
          - "the acting SafetyOfficer X-User-ID != event.reporter_user_id (segregation of duties)"
        side_effects:
          - "set report_status = UNDER_REVIEW"
          - "if parent Enrollment.safety_status == CLEAR: transition Enrollment CLEAR -> FLAGGED (cascade)"
          - "increments AdverseEvent.version by 1"
      - from: UNDER_REVIEW
        to: ADJUDICATED_RELATED
        trigger: "POST /adverse-events/{id}/review  (action=ADJUDICATE, relation=RELATED)"
        actor: SafetyOfficer
        preconditions:
          - "event.report_status == UNDER_REVIEW"
          - "the acting SafetyOfficer X-User-ID != event.reporter_user_id"
        side_effects:
          - "set report_status = ADJUDICATED_RELATED, adjudicator_user_id = X-User-ID"
          - "if severity IN {SEVERE, LIFE_THREATENING}: transition Enrollment FLAGGED -> HOLD (cascade; which itself increments Trial.active_safety_holds and may FREEZE Trial — cascade depth 3)"
          - "increments AdverseEvent.version by 1"
      - from: UNDER_REVIEW
        to: ADJUDICATED_UNRELATED
        trigger: "POST /adverse-events/{id}/review  (action=ADJUDICATE, relation=UNRELATED)"
        actor: SafetyOfficer
        preconditions:
          - "event.report_status == UNDER_REVIEW"
          - "the acting SafetyOfficer X-User-ID != event.reporter_user_id"
        side_effects:
          - "set report_status = ADJUDICATED_UNRELATED, adjudicator_user_id = X-User-ID"
          - "if no other AdverseEvent on the enrollment is in {REPORTED, UNDER_REVIEW}: transition Enrollment FLAGGED -> CLEAR (cascade)"
          - "increments AdverseEvent.version by 1"

  # ---------------------------------------------------------------------------
  # 6) Visit — SCHEDULED → COMPLETED / CANCELLED. Completion is gated by an
  #    in-window blood draw supplied at completion; computes payable_amount_cents.
  # ---------------------------------------------------------------------------
  - entity: Visit
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: COMPLETED
        trigger: "POST /visits/{id}/complete  (carries drawn_at)"
        actor: CoordinatorStaff
        preconditions:
          - "visit.status == SCHEDULED"
          - "parent Enrollment.enrollment_status == ACTIVE (cross-entity)"
          - "parent Enrollment.safety_status != HOLD"
          - "the supplied drawn_at yields draw_in_window == true via calc draw_window_check"
        side_effects:
          - "set drawn_at; compute draw_in_window and draw_deviation_minutes (calc draw_window_check)"
          - "set status = COMPLETED"
          - "set payable_amount_cents via calc visit_compensation"
          - "increment parent Enrollment.completed_visits_count by 1 (cascade)"
          - "increments Visit.version by 1"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "system: parent Enrollment withdrawn"
        actor: system
        preconditions:
          - "visit.status == SCHEDULED"
        side_effects:
          - "set status = CANCELLED"
          - "increments Visit.version by 1"

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: consent-activate-stale-trial
    parent_entity: Trial
    write_endpoint: "POST /trials/{id}/consent-documents/{docId}/activate"
    occ_field: "expected_trial_version"
    description: |
      Activating a ConsentDocument supersedes whichever ConsentDocument was
      previously ACTIVE for the trial and recomputes Trial.posture. When the
      Trial.version has advanced since the client last read it (e.g. another
      activation already superseded the prior consent, or a PROTOCOL decision
      moved posture), the client's view is stale and the activation is rejected.
      The supersede legitimately overwrites the prior ACTIVE version, so a
      strictly-later request observing the same pre-state would itself succeed —
      a true CREATE-with-supersede race resolved by OCC on Trial.version.
    error_id: ERR_STALE_TRIAL_VERSION
    http_status: 412

  - rule_id: randomize-stale-trial
    parent_entity: Trial
    write_endpoint: "POST /enrollments/{id}/transition"
    occ_field: "expected_trial_version"
    description: |
      The RANDOMIZE transition consumes one slot of the trial's finite
      target_enrollment and bumps Trial.enrolled_count and an arm's
      assigned_count. When Trial.version has advanced since the client read it
      (another randomization already consumed a slot, or a safety HOLD froze the
      trial), the client's capacity view is stale and the transition is rejected.
      A strictly-later request seeing the same pre-state would legitimately
      consume the next slot — a true allocation race resolved by OCC on
      Trial.version.
    error_id: ERR_STALE_TRIAL_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  # ---------------------------------------------------------------------------
  # A) Eligibility matching — DUAL VARIANT (strict snapshot at screening vs
  #    live re-evaluation at enrollment). Screening/Participant domain.
  # ---------------------------------------------------------------------------
  - name: eligibility_match
    trigger: "POST /trials/{id}/screen-participant (screening_snapshot); re-run by POST /enrollments (enrollment_revalidation)"
    algorithm: aggregation
    formula: |
      # Evaluate every EligibilityCriterion of the trial against the participant.
      failed = 0
      for c in criteria(trial):                       # order: created_at ASC (stable; no observable dependence on order)
        lhs = participant[c.attribute]                # biomarker_positive -> 1.0 if true else 0.0
        rhs = c.threshold
        predicate = compare(lhs, c.comparator, rhs)   # GE: lhs>=rhs, GT: lhs>rhs, LE: lhs<=rhs, LT: lhs<rhs, EQ: lhs==rhs
        if c.kind == INCLUSION and not predicate: failed += 1   # inclusion must hold
        if c.kind == EXCLUSION and predicate:     failed += 1   # exclusion must NOT hold
      match_result = ELIGIBLE if failed == 0 else INELIGIBLE
      failed_criteria_count = failed
    input_set: "All EligibilityCriterion rows where criterion.trial_id == trial.id (configuration; never soft-deleted, no status filter)."
    constants: {}
    precision: "Integer comparisons exact; numeric attributes compared at full double precision (no rounding before compare)."
    variants:
      - name: screening_snapshot
        when: "POST /trials/{id}/screen-participant"
        difference: "Evaluates against the participant's CURRENT field values and FREEZES match_result + failed_criteria_count + match_score on the Screening row."
      - name: enrollment_revalidation
        when: "POST /enrollments (creating an Enrollment from an ELIGIBLE Screening)"
        difference: "Re-evaluates the SAME predicates against the participant's field values AT ENROLLMENT TIME. If the participant's fields changed so the live evaluation now yields INELIGIBLE even though the stored Screening said ELIGIBLE, enrollment is rejected with ERR_ELIGIBILITY_DRIFTED — the frozen snapshot and the live value diverge."

  # ---------------------------------------------------------------------------
  # B) Match score — weighted scoring on the Screening/Trial domain.
  #    Combinatorial mode (a): >=3 inputs, nested min clamp, conditional branches.
  # ---------------------------------------------------------------------------
  - name: match_score
    trigger: "Computed during eligibility_match (screening_snapshot variant); stored on Screening.match_score"
    algorithm: weighted_scoring
    formula: |
      inclusion = [c for c in criteria(trial) if c.kind == INCLUSION]
      exclusion = [c for c in criteria(trial) if c.kind == EXCLUSION]
      if len(inclusion) == 0 and len(exclusion) == 0:
        match_score = 1.0
      else:
        inc_passed = count(c in inclusion where predicate(c) is true)
        exc_clear  = count(c in exclusion where predicate(c) is false)
        if len(inclusion) > 0 and len(exclusion) > 0:
          raw = INCLUSION_WEIGHT * (inc_passed / len(inclusion)) + EXCLUSION_WEIGHT * (exc_clear / len(exclusion))
        elif len(inclusion) > 0:
          raw = inc_passed / len(inclusion)          # lone present category takes full weight
        else:
          raw = exc_clear / len(exclusion)
        match_score = round_half_up(min(1.0, raw), 4)   # min(1.0, .) clamp applied BEFORE rounding
    input_set: "Same criteria set as eligibility_match for the screened participant snapshot."
    constants: { INCLUSION_WEIGHT: 0.6, EXCLUSION_WEIGHT: 0.4 }
    precision: "4 decimal places, round_half_up; the min(1.0, .) clamp is applied BEFORE rounding."

  # ---------------------------------------------------------------------------
  # B2) Blood-draw window check — half-open interval boundary precision.
  #     Computes draw_in_window and draw_deviation_minutes for a Visit.
  # ---------------------------------------------------------------------------
  - name: draw_window_check
    trigger: "POST /visits/{id}/complete (sets Visit.draw_in_window and draw_deviation_minutes)"
    algorithm: threshold
    formula: |
      sched = visit.scheduled_at
      w     = visit.draw_window_minutes
      lower = sched - w minutes        # INCLUSIVE
      upper = sched + w minutes        # EXCLUSIVE (half-open at the upper bound)
      draw_in_window = (drawn_at >= lower) AND (drawn_at < upper)
      draw_deviation_minutes = floor(abs(drawn_at - sched) in whole minutes)
    input_set: "The single Visit (scheduled_at, draw_window_minutes) and the drawn_at supplied at completion."
    constants: {}
    precision: "Minute-floored deviation; window comparison at full timestamp precision. Half-open: a draw exactly at sched+w is OUT of window; exactly at sched-w is IN."

  # ---------------------------------------------------------------------------
  # C) Visit compensation — DUAL VARIANT (on-time vs late-grace bonus tier),
  #    Visit domain. Combinatorial mode (b): pinned rounding order — per-visit
  #    values are exact integer cents and the single withholding rounding lives
  #    only in the sweep (sum-then-withhold), so it cannot be reproduced per-visit.
  # ---------------------------------------------------------------------------
  - name: visit_compensation
    trigger: "Visit SCHEDULED -> COMPLETED (sets Visit.payable_amount_cents)"
    algorithm: tiered_pricing
    formula: |
      base = BASE_VISIT_CENTS                          # per completed visit
      if visit.draw_deviation_minutes <= ON_TIME_MINUTES:    # <=
        bonus = ON_TIME_BONUS_CENTS
      elif visit.draw_deviation_minutes <= LATE_GRACE_MINUTES:
        bonus = LATE_BONUS_CENTS
      else:
        bonus = 0
      mileage = MILEAGE_RATE_CENTS * max(0, visit.sequence_index - 1)
      payable_amount_cents = base + bonus + mileage    # integer cents; exact, no rounding at the visit level
    input_set: "The single Visit being completed, using its draw_deviation_minutes and sequence_index."
    constants:
      BASE_VISIT_CENTS: 7500
      ON_TIME_MINUTES: 15
      LATE_GRACE_MINUTES: 60
      ON_TIME_BONUS_CENTS: 2500
      LATE_BONUS_CENTS: 1000
      MILEAGE_RATE_CENTS: 1200
    precision: "Integer cents throughout; per-visit value is exact (no rounding needed at this level)."
    variants:
      - name: on_time_tier
        when: "draw_deviation_minutes <= ON_TIME_MINUTES"
        difference: "Full ON_TIME_BONUS_CENTS (2500) bonus added."
      - name: late_grace_tier
        when: "ON_TIME_MINUTES < draw_deviation_minutes <= LATE_GRACE_MINUTES"
        difference: "Reduced LATE_BONUS_CENTS (1000) bonus; the same visit (identical base/mileage) yields a different payable_amount_cents than the on_time_tier."

  # ---------------------------------------------------------------------------
  # D) Compensation sweep — DUAL VARIANT on the Enrollment/Payment domain.
  #    Combinatorial mode (c): circular-looking dependency — the withholding
  #    tier is keyed on the gross subtotal; evaluation order is pinned
  #    gross -> tier -> withholding -> net.
  # ---------------------------------------------------------------------------
  - name: compensation_sweep
    trigger: "POST /enrollments/{id}/payments  (creates a CompensationPayment)"
    algorithm: waterfall_allocation
    formula: |
      # 1) Gather the COMPLETED, previously-unpaid visits of this enrollment.
      visits = [v for v in Visit where v.enrollment_id == enrollment.id
                 and v.status == COMPLETED
                 and v.id NOT IN any prior CompensationPayment(status IN {PENDING, PAID}).visit_ids]
                # ordered by sequence_index ASC (sequence_index is unique per enrollment -> no ties)
      gross_cents = sum(v.payable_amount_cents for v in visits)        # SUM FIRST (per-visit values already exact)
      # 2) Withholding tier is keyed on the gross subtotal (the circular-looking dep):
      if gross_cents >= WITHHOLDING_THRESHOLD_CENTS:                   # >=
        withholding = round_half_up(gross_cents * HIGH_WITHHOLDING_RATE)   # round the gross*rate PRODUCT, not per visit
      else:
        withholding = round_half_up(gross_cents * LOW_WITHHOLDING_RATE)
      # 3) Net is computed from the tier the gross selected — order: gross -> tier -> net.
      amount_cents = gross_cents - withholding
      visit_ids = [v.id for v in visits]
    input_set: "COMPLETED Visits of the enrollment not already attached to a PENDING/PAID CompensationPayment."
    constants:
      WITHHOLDING_THRESHOLD_CENTS: 30000
      LOW_WITHHOLDING_RATE: 0.0
      HIGH_WITHHOLDING_RATE: 0.10
    precision: "round_half_up to whole cents; withholding rounds the gross*rate PRODUCT (sum-then-multiply-then-round), NOT per-visit."
    variants:
      - name: standard_sweep
        when: "enrollment.enrollment_status IN {ACTIVE, COMPLETED}"
        difference: "Withholding tier selected by gross: HIGH_WITHHOLDING_RATE when gross_cents >= WITHHOLDING_THRESHOLD_CENTS, else LOW."
      - name: early_termination_sweep
        when: "enrollment.enrollment_status == WITHDRAWN"
        difference: "Same visit set and same gross, but withholding is forced to LOW_WITHHOLDING_RATE (0.0) regardless of gross — a withdrawn participant's residual compensation is never withheld. Diverges from standard_sweep at the SAME gross when gross >= threshold."

# =============================================================================
# §1.3a Selector policy referenced by the RANDOMIZE transition.
# =============================================================================
selectors:
  - name: arm_selection
    trigger: "POST /enrollments/{id}/transition (action=RANDOMIZE)"
    description: |
      Deterministic randomization-arm selector (NO RNG — the benchmark fixes a
      reproducible deterministic scheme so tests are black-box verifiable).
    eligibility_filter: "All RandomizationArm rows where arm.trial_id == trial.id."
    ranking_expression: |
      Pick the arm most UNDER its fair share. fair_share(a) =
      target_enrollment * (a.allocation_weight / sum_of_weights). deficit(a) =
      fair_share(a) - a.assigned_count. Choose the arm with the LARGEST deficit.
      For PERMUTED_BLOCK, fair share is computed within the current block of size
      block_size (block index = floor(trial.enrolled_count / block_size)); deficits
      reset at each block boundary.
    tie_break: "When two arms tie on deficit, pick the arm with the smaller created_at (ASC); never use id."
    empty_pool_fallback: "If the trial has zero arms, randomize is impossible (consent activation already required >=1 arm); reaching it with no arm is rejected ERR_TRIAL_NOT_CONFIGURED."

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and X-User-Role is a known role."
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"

  - priority: 2
    category: auth
    check: "The role is permitted for this endpoint per §1.7."
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: existence
    check: "Every resource named in the path exists, validated left-to-right."
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all path-parameterized endpoints"

  - priority: 4
    category: existence
    check: "Every reference in the request body (participant_id, screening_id, consent_document_id) resolves to an existing resource of the right type."
    error_id: ERR_REFERENCE_NOT_FOUND
    http_status: 404
    applies_to: "all create/action endpoints with body references"

  - priority: 5
    category: business_constraint
    check: "Required body fields present and well-typed; enum values in range; numbers within declared bounds (e.g. target_enrollment >= 1, draw_window_minutes >= 0)."
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all create/action endpoints"

  - priority: 6
    category: business_constraint
    check: "Action discriminator valid: /transition action IN {CONSENT,RANDOMIZE,ACTIVATE,COMPLETE,WITHDRAW}; /review action IN {TRIAGE,ADJUDICATE} and ADJUDICATE carries relation IN {RELATED,UNRELATED}; /decide action IN {APPROVE,REJECT,REVISE}."
    error_id: ERR_INVALID_ACTION
    http_status: 400
    applies_to: "POST /enrollments/{id}/transition, POST /adverse-events/{id}/review, POST /trials/{id}/irb-reviews/{reviewId}/decide"

  - priority: 7
    category: business_constraint
    check: "Per-action required body fields: CONSENT requires consent_document_id; RANDOMIZE requires expected_trial_version. IRB review scope==CONSENT requires consent_document_id; scope==PROTOCOL forbids it."
    error_id: ERR_MISSING_ACTION_FIELD
    http_status: 400
    applies_to: "POST /enrollments/{id}/transition, POST /trials/{id}/irb-reviews"

  - priority: 8
    category: state
    check: "Target resource is in a state from which the requested transition is defined (per §1.2 from/preconditions)."
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all action endpoints"

  - priority: 9
    category: state
    check: "A review already APPROVED/REJECTED/REVISE_REQUESTED can no longer be decided."
    error_id: ERR_REVISE_NOT_DECIDABLE
    http_status: 409
    applies_to: "POST /trials/{id}/irb-reviews/{reviewId}/decide"

  - priority: 10
    category: business_safety
    check: "Segregation of duties: an IRBReviewer deciding a review must not be the trial's sponsor_user_id; a SafetyOfficer reviewing an AdverseEvent must not be its reporter_user_id."
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /trials/{id}/irb-reviews/{reviewId}/decide, POST /adverse-events/{id}/review"

  - priority: 11
    category: business_safety
    check: "Trial.posture must be OPEN for the CONSENT and RANDOMIZE enrollment transitions; a FROZEN trial (active safety hold) blocks them."
    error_id: ERR_TRIAL_NOT_OPEN
    http_status: 409
    applies_to: "POST /enrollments/{id}/transition (action IN {CONSENT, RANDOMIZE})"

  - priority: 12
    category: business_safety
    check: "An Enrollment whose safety_status == HOLD cannot be randomized, activated, completed, or have a visit completed."
    error_id: ERR_ENROLLMENT_ON_HOLD
    http_status: 409
    applies_to: "POST /enrollments/{id}/transition (RANDOMIZE/ACTIVATE/COMPLETE), POST /visits/{id}/complete"

  - priority: 13
    category: business_referential
    check: "Consent integrity: the ConsentDocument signed at CONSENT must be ACTIVE, belong to the trial, and its version_number must equal the trial's current ACTIVE consent version_number."
    error_id: ERR_CONSENT_VERSION_MISMATCH
    http_status: 409
    applies_to: "POST /enrollments/{id}/transition (action=CONSENT)"

  - priority: 14
    category: business_referential
    check: "Enrollment must reference a Screening with match_result == ELIGIBLE for the same trial."
    error_id: ERR_SCREENING_NOT_ELIGIBLE
    http_status: 409
    applies_to: "POST /enrollments"

  - priority: 15
    category: business_referential
    check: "Eligibility drift: at enrollment creation, live re-evaluation of the trial's criteria against the participant's current fields must still yield ELIGIBLE."
    error_id: ERR_ELIGIBILITY_DRIFTED
    http_status: 409
    applies_to: "POST /enrollments"

  - priority: 16
    category: business_constraint
    check: "Activating a consent requires the consent in IRB_APPROVED status, Trial.irb_status==APPROVED, and the trial to have >=1 RandomizationArm."
    error_id: ERR_TRIAL_NOT_CONFIGURED
    http_status: 409
    applies_to: "POST /trials/{id}/consent-documents/{docId}/activate"

  - priority: 17
    category: business_temporal
    check: "A Visit completion requires the supplied drawn_at to fall inside the half-open window [scheduled_at - w, scheduled_at + w)."
    error_id: ERR_DRAW_OUT_OF_WINDOW
    http_status: 409
    applies_to: "POST /visits/{id}/complete"

  - priority: 18
    category: business_temporal
    check: "Two Visits of the same enrollment must not have overlapping draw windows: |scheduled_at_a - scheduled_at_b| in minutes must be >= (w_a + w_b) (windows may touch at the boundary; exact adjacency allowed)."
    error_id: ERR_VISIT_WINDOW_OVERLAP
    http_status: 409
    applies_to: "POST /enrollments/{id}/visits"

  - priority: 19
    category: business_temporal
    check: "At most one PENDING PROTOCOL IRBReview may exist per trial (uniqueness over the open-review interval)."
    error_id: ERR_REVIEW_ALREADY_OPEN
    http_status: 409
    applies_to: "POST /trials/{id}/irb-reviews"

  - priority: 20
    category: business_constraint
    check: "A Visit's sequence_index must be unique within its enrollment."
    error_id: ERR_DUPLICATE_VISIT_INDEX
    http_status: 409
    applies_to: "POST /enrollments/{id}/visits"

  - priority: 21
    category: business_fiscal
    check: "Capacity: Trial.enrolled_count must be < Trial.target_enrollment at RANDOMIZE time."
    error_id: ERR_TRIAL_AT_CAPACITY
    http_status: 409
    applies_to: "POST /enrollments/{id}/transition (action=RANDOMIZE)"

  - priority: 22
    category: business_fiscal
    check: "Optimistic concurrency: expected_trial_version (when required) must equal the live Trial.version."
    error_id: ERR_STALE_TRIAL_VERSION
    http_status: 412
    applies_to: "POST /trials/{id}/consent-documents/{docId}/activate, POST /enrollments/{id}/transition (action=RANDOMIZE)"

  - priority: 23
    category: business_fiscal
    check: "A CompensationPayment sweep must include >= 1 COMPLETED previously-unpaid visit; an empty sweep is rejected."
    error_id: ERR_NO_PAYABLE_VISITS
    http_status: 409
    applies_to: "POST /enrollments/{id}/payments"

  - priority: 24
    category: state
    check: "pay applies only to a PENDING CompensationPayment."
    error_id: ERR_PAYMENT_NOT_PENDING
    http_status: 409
    applies_to: "POST /payments/{id}/pay"

  - priority: 25
    category: state
    check: "Criteria and arms may only be added while Trial.posture == SETUP."
    error_id: ERR_TRIAL_NOT_IN_SETUP
    http_status: 409
    applies_to: "POST /trials/{id}/criteria, POST /trials/{id}/arms"

# =============================================================================
# §1.5 API Endpoint Table  (32 endpoints)
# =============================================================================
endpoints:
  # ---- Test-driving clock (last-resort, /_ namespace) ----------------------
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server's logical UTC clock used for window/temporal checks."
    roles: [Sponsor, CoordinatorStaff, IRBReviewer, SafetyOfficer, Investigator]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["server logical clock set to to_iso8601"]

  # ---- Trial (segment: trials) ---------------------------------------------
  - method: POST
    path: "/trials"
    description: "Create a trial (posture=SETUP, irb_status=NONE)."
    roles: [Sponsor]
    code: 201
    input: ["title", "target_enrollment", "randomization_method", "block_size?"]
    output: Trial
    side_effects: ["sponsor_user_id set from X-User-ID; posture=SETUP; irb_status=NONE"]
  - method: GET
    path: "/trials/{id}"
    description: "Fetch a trial including computed posture, irb_status, enrolled_count, active_safety_holds, version."
    roles: [Sponsor, CoordinatorStaff, IRBReviewer, SafetyOfficer]
    code: 200
    input: []
    output: Trial
    side_effects: []

  # ---- EligibilityCriterion (reverse-reach for trial_id via sub-resource) --
  - method: POST
    path: "/trials/{id}/criteria"
    description: "Add an inclusion/exclusion criterion (only while posture==SETUP)."
    roles: [Sponsor]
    code: 201
    input: ["kind", "attribute", "comparator", "threshold"]
    output: EligibilityCriterion
    side_effects: []
  - method: GET
    path: "/trials/{id}/criteria"
    description: "List the trial's eligibility criteria (reverse-reachability for EligibilityCriterion.trial_id)."
    roles: [Sponsor, CoordinatorStaff, IRBReviewer, SafetyOfficer]
    code: 200
    input: []
    output: EligibilityCriterion[]
    side_effects: []

  # ---- RandomizationArm (reverse-reach for trial_id via sub-resource) ------
  - method: POST
    path: "/trials/{id}/arms"
    description: "Add a randomization arm (only while posture==SETUP)."
    roles: [Sponsor]
    code: 201
    input: ["name", "allocation_weight"]
    output: RandomizationArm
    side_effects: []
  - method: GET
    path: "/trials/{id}/arms"
    description: "List the trial's arms with assigned_count (reverse-reachability for RandomizationArm.trial_id)."
    roles: [Sponsor, CoordinatorStaff, IRBReviewer, SafetyOfficer]
    code: 200
    input: []
    output: RandomizationArm[]
    side_effects: []

  # ---- ConsentDocument (reverse-reach for trial_id via sub-resource) -------
  - method: POST
    path: "/trials/{id}/consent-documents"
    description: "Create a DRAFT consent document; version_number = (max existing for trial) + 1."
    roles: [Sponsor]
    code: 201
    input: ["body_hash"]
    output: ConsentDocument
    side_effects: ["version_number assigned monotonically per trial; status=DRAFT"]
  - method: GET
    path: "/trials/{id}/consent-documents"
    description: "List the trial's consent documents (all versions/statuses; reverse-reachability for ConsentDocument.trial_id)."
    roles: [Sponsor, CoordinatorStaff, IRBReviewer, SafetyOfficer]
    code: 200
    input: ["status?"]
    output: ConsentDocument[]
    side_effects: []
  - method: POST
    path: "/trials/{id}/consent-documents/{docId}/activate"
    description: "Activate an IRB_APPROVED consent version; supersedes the prior ACTIVE version and cascades reconsent. OCC-guarded on Trial.version."
    roles: [Sponsor]
    code: 200
    input: ["expected_trial_version"]
    output: ConsentDocument
    side_effects:
      - "prior ACTIVE ConsentDocument -> SUPERSEDED (cascade hop 1)"
      - "enrollments signed against the superseded doc and CONSENTED -> SCREENED (reconsent cascade hop 2)"
      - "recompute Trial.posture; increments Trial.version by 1"

  # ---- IRBReview (reverse-reach for trial_id via sub-resource) -------------
  - method: POST
    path: "/trials/{id}/irb-reviews"
    description: "Open an IRB review (scope PROTOCOL or CONSENT). PROTOCOL sets Trial.irb_status=PENDING."
    roles: [Sponsor]
    code: 201
    input: ["scope", "consent_document_id?"]
    output: IRBReview
    side_effects: ["if scope==PROTOCOL: Trial.irb_status=PENDING; increments Trial.version by 1"]
  - method: GET
    path: "/trials/{id}/irb-reviews"
    description: "List the trial's IRB reviews; filter by scope/decision (reverse-reachability for IRBReview.trial_id)."
    roles: [Sponsor, CoordinatorStaff, IRBReviewer, SafetyOfficer]
    code: 200
    input: ["scope?", "decision?"]
    output: IRBReview[]
    side_effects: []
  - method: POST
    path: "/trials/{id}/irb-reviews/{reviewId}/decide"
    description: "IRBReviewer decides a PENDING review (APPROVE/REJECT/REVISE). Branching fork."
    roles: [IRBReviewer]
    code: 200
    input: ["action"]
    output: IRBReview
    side_effects:
      - "APPROVE/PROTOCOL: Trial.irb_status=APPROVED; recompute posture"
      - "APPROVE/CONSENT: ConsentDocument DRAFT -> IRB_APPROVED, set irb_review_id"
      - "REJECT/PROTOCOL: Trial.irb_status=REJECTED"
      - "REVISE: decision=REVISE_REQUESTED (no longer decidable); increments Trial.version by 1"

  # ---- Participant ---------------------------------------------------------
  - method: POST
    path: "/participants"
    description: "Register a participant with demographic/clinical attributes."
    roles: [CoordinatorStaff]
    code: 201
    input: ["full_name", "age_years", "weight_kg", "hba1c", "prior_trials_count?", "biomarker_positive?"]
    output: Participant
    side_effects: []
  - method: PATCH
    path: "/participants/{id}"
    description: "Update mutable participant attributes (used to induce eligibility drift between screening and enrollment)."
    roles: [CoordinatorStaff]
    code: 200
    input: ["age_years?", "weight_kg?", "hba1c?", "prior_trials_count?", "biomarker_positive?"]
    output: Participant
    side_effects: ["increments Participant.version by 1"]

  # ---- Screening (segment: screenings) -------------------------------------
  - method: POST
    path: "/trials/{id}/screen-participant"
    description: "Run the matching engine: evaluate the trial's criteria against a participant, persisting match_result, failed_criteria_count, match_score."
    roles: [CoordinatorStaff]
    code: 201
    input: ["participant_id"]
    output: Screening
    side_effects: ["runs calc eligibility_match (screening_snapshot) and calc match_score"]
  - method: GET
    path: "/screenings/{id}"
    description: "Fetch a single screening (establishes the screenings segment)."
    roles: [CoordinatorStaff, Sponsor]
    code: 200
    input: []
    output: Screening
    side_effects: []
  - method: GET
    path: "/screenings"
    description: "List screenings; filter by trial_id and participant_id (reverse-reachability for Screening.trial_id and Screening.participant_id)."
    roles: [CoordinatorStaff, Sponsor]
    code: 200
    input: ["trial_id?", "participant_id?", "match_result?", "limit?", "offset?"]
    output: Screening[]
    side_effects: []

  # ---- Enrollment (segment: enrollments) -----------------------------------
  - method: POST
    path: "/enrollments"
    description: "Create an Enrollment from an ELIGIBLE Screening (re-evaluates eligibility live). Starts SCREENED/CLEAR."
    roles: [CoordinatorStaff]
    code: 201
    input: ["screening_id"]
    output: Enrollment
    side_effects: ["runs calc eligibility_match (enrollment_revalidation); copies trial_id/participant_id from the screening"]
  - method: GET
    path: "/enrollments/{id}"
    description: "Fetch an enrollment (both status dimensions, arm, consent snapshot, counts, version)."
    roles: [CoordinatorStaff, Sponsor, SafetyOfficer]
    code: 200
    input: []
    output: Enrollment
    side_effects: []
  - method: GET
    path: "/enrollments"
    description: "List enrollments; filter by trial_id, participant_id, screening_id, arm_id, signed_consent_document_id (reverse-reachability for all five Enrollment FKs)."
    roles: [CoordinatorStaff, Sponsor, SafetyOfficer]
    code: 200
    input: ["trial_id?", "participant_id?", "screening_id?", "arm_id?", "signed_consent_document_id?", "enrollment_status?", "safety_status?", "limit?", "offset?"]
    output: Enrollment[]
    side_effects: []
  - method: POST
    path: "/enrollments/{id}/transition"
    description: "Drive the enrollment_status lifecycle. action in {CONSENT, RANDOMIZE, ACTIVATE, COMPLETE, WITHDRAW}. CONSENT requires consent_document_id; RANDOMIZE requires expected_trial_version (OCC on Trial.version)."
    roles: [CoordinatorStaff]
    code: 200
    input: ["action", "consent_document_id?", "expected_trial_version?"]
    output: Enrollment
    side_effects:
      - "CONSENT: set signed_consent_document_id/version; SCREENED -> CONSENTED"
      - "RANDOMIZE: select arm (arm_selection); set arm_id; CONSENTED -> RANDOMIZED; increment arm.assigned_count + Trial.enrolled_count; recompute Trial.posture; increments Trial.version by 1"
      - "ACTIVATE: RANDOMIZED -> ACTIVE"
      - "COMPLETE: ACTIVE -> COMPLETED"
      - "WITHDRAW: -> WITHDRAWN; compensating decrement of arm.assigned_count/Trial.enrolled_count; cancel SCHEDULED visits; recompute Trial.posture"
      - "increments Enrollment.version by 1"
  - method: POST
    path: "/enrollments/{id}/lift-hold"
    description: "SafetyOfficer lifts a safety HOLD once all AEs are adjudicated; safety_status HOLD -> CLEAR."
    roles: [SafetyOfficer]
    code: 200
    input: []
    output: Enrollment
    side_effects: ["safety_status -> CLEAR; decrement Trial.active_safety_holds; recompute Trial.posture; increments Enrollment.version by 1"]

  # ---- Visit (child of Enrollment) -----------------------------------------
  - method: POST
    path: "/enrollments/{id}/visits"
    description: "Schedule a visit with a blood-draw window; rejects window overlap with sibling visits."
    roles: [CoordinatorStaff]
    code: 201
    input: ["sequence_index", "scheduled_at", "draw_window_minutes"]
    output: Visit
    side_effects: ["Visit created SCHEDULED"]
  - method: GET
    path: "/enrollments/{id}/visits"
    description: "List the enrollment's visits (reverse-reachability for Visit.enrollment_id)."
    roles: [CoordinatorStaff, Sponsor, SafetyOfficer]
    code: 200
    input: []
    output: Visit[]
    side_effects: []
  - method: POST
    path: "/visits/{id}/complete"
    description: "Complete a SCHEDULED visit by supplying drawn_at; requires the draw to be in-window; computes payable_amount_cents."
    roles: [CoordinatorStaff]
    code: 200
    input: ["drawn_at"]
    output: Visit
    side_effects: ["set drawn_at; compute draw_in_window/draw_deviation_minutes (draw_window_check); status -> COMPLETED; set payable_amount_cents (visit_compensation); increment Enrollment.completed_visits_count; increments Visit.version by 1"]

  # ---- AdverseEvent (child of Enrollment) ----------------------------------
  - method: POST
    path: "/enrollments/{id}/adverse-events"
    description: "Investigator reports an adverse event on an enrollment; starts REPORTED."
    roles: [Investigator]
    code: 201
    input: ["severity", "occurred_at", "is_serious?"]
    output: AdverseEvent
    side_effects: ["reporter_user_id set from X-User-ID; report_status=REPORTED"]
  - method: GET
    path: "/enrollments/{id}/adverse-events"
    description: "List adverse events for an enrollment (reverse-reachability for AdverseEvent.enrollment_id)."
    roles: [CoordinatorStaff, Sponsor, SafetyOfficer, Investigator]
    code: 200
    input: []
    output: AdverseEvent[]
    side_effects: []
  - method: POST
    path: "/adverse-events/{id}/review"
    description: "SafetyOfficer reviews an adverse event. action=TRIAGE moves REPORTED -> UNDER_REVIEW (flags enrollment); action=ADJUDICATE with relation RELATED/UNRELATED moves UNDER_REVIEW -> ADJUDICATED_*."
    roles: [SafetyOfficer]
    code: 200
    input: ["action", "relation?"]
    output: AdverseEvent
    side_effects:
      - "TRIAGE: report_status -> UNDER_REVIEW; Enrollment CLEAR -> FLAGGED (cascade)"
      - "ADJUDICATE/RELATED + SEVERE/LIFE_THREATENING: Enrollment FLAGGED -> HOLD -> Trial.active_safety_holds++ -> posture FROZEN (depth-3 cascade)"
      - "ADJUDICATE/UNRELATED + no other open AE: Enrollment FLAGGED -> CLEAR (cascade)"
      - "increments AdverseEvent.version by 1"

  # ---- CompensationPayment (child of Enrollment) ---------------------------
  - method: POST
    path: "/enrollments/{id}/payments"
    description: "Sweep COMPLETED previously-unpaid visits into a CompensationPayment (PENDING)."
    roles: [Sponsor]
    code: 201
    input: []
    output: CompensationPayment
    side_effects: ["runs calc compensation_sweep; sets gross_cents, amount_cents, visit_ids; status=PENDING"]
  - method: GET
    path: "/enrollments/{id}/payments"
    description: "List compensation payments for an enrollment (reverse-reachability for CompensationPayment.enrollment_id)."
    roles: [Sponsor, CoordinatorStaff]
    code: 200
    input: []
    output: CompensationPayment[]
    side_effects: []
  - method: POST
    path: "/payments/{id}/pay"
    description: "Mark a PENDING compensation payment PAID."
    roles: [Sponsor]
    code: 200
    input: []
    output: CompensationPayment
    side_effects: ["status -> PAID; increments CompensationPayment.version by 1"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "Missing/invalid X-User-Role or X-User-ID headers."
  - id: ERR_FORBIDDEN_ROLE
    http: 403
    condition: "Role not permitted for the endpoint."
  - id: ERR_NOT_FOUND
    http: 404
    condition: "A path-referenced resource does not exist."
  - id: ERR_REFERENCE_NOT_FOUND
    http: 404
    condition: "A body reference (participant_id, screening_id, consent_document_id) targets a non-existent resource."
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "Missing required field, bad type, out-of-range number, or invalid enum value."
  - id: ERR_INVALID_ACTION
    http: 400
    condition: "Unknown action value on a /transition, /review, or /decide endpoint, or ADJUDICATE without a valid relation."
  - id: ERR_MISSING_ACTION_FIELD
    http: 400
    condition: "CONSENT transition without consent_document_id, RANDOMIZE without expected_trial_version, or IRB CONSENT-scope review without consent_document_id / PROTOCOL-scope with one."
  - id: ERR_INVALID_STATE
    http: 409
    condition: "Target resource not in a state from which this transition is defined."
  - id: ERR_REVISE_NOT_DECIDABLE
    http: 409
    condition: "Decide attempted on a review already in REVISE_REQUESTED/APPROVED/REJECTED."
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "Actor would violate segregation of duties (sponsor deciding own review, or AE reporter reviewing own AE)."
  - id: ERR_TRIAL_NOT_OPEN
    http: 409
    condition: "Trial.posture != OPEN for a CONSENT/RANDOMIZE transition."
  - id: ERR_ENROLLMENT_ON_HOLD
    http: 409
    condition: "Enrollment.safety_status == HOLD blocks randomize/activate/complete/visit-complete."
  - id: ERR_CONSENT_VERSION_MISMATCH
    http: 409
    condition: "Signed consent document is not the trial's current ACTIVE version (wrong status, wrong trial, or stale version_number)."
  - id: ERR_ELIGIBILITY_DRIFTED
    http: 409
    condition: "Live re-evaluation at enrollment yields INELIGIBLE though the stored screening was ELIGIBLE."
  - id: ERR_SCREENING_NOT_ELIGIBLE
    http: 409
    condition: "Enrollment references a screening whose match_result != ELIGIBLE."
  - id: ERR_TRIAL_NOT_CONFIGURED
    http: 409
    condition: "Consent activation before the trial has APPROVED protocol IRB / >=1 arm / IRB_APPROVED consent."
  - id: ERR_DRAW_OUT_OF_WINDOW
    http: 409
    condition: "Visit completion attempted with a drawn_at outside the half-open draw window."
  - id: ERR_VISIT_WINDOW_OVERLAP
    http: 409
    condition: "A new visit's draw window overlaps a sibling visit's draw window."
  - id: ERR_DUPLICATE_VISIT_INDEX
    http: 409
    condition: "A visit with the same sequence_index already exists for the enrollment."
  - id: ERR_REVIEW_ALREADY_OPEN
    http: 409
    condition: "A PENDING PROTOCOL review already exists for the trial."
  - id: ERR_TRIAL_AT_CAPACITY
    http: 409
    condition: "Randomization attempted when Trial.enrolled_count >= Trial.target_enrollment."
  - id: ERR_STALE_TRIAL_VERSION
    http: 412
    condition: "expected_trial_version does not equal live Trial.version (OCC)."
  - id: ERR_NO_PAYABLE_VISITS
    http: 409
    condition: "Compensation sweep found no COMPLETED previously-unpaid visit."
  - id: ERR_PAYMENT_NOT_PENDING
    http: 409
    condition: "pay attempted on a non-PENDING CompensationPayment."
  - id: ERR_TRIAL_NOT_IN_SETUP
    http: 409
    condition: "Adding criteria/arms attempted when Trial.posture != SETUP."

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Sponsor
    description: "Owns the trial: configures criteria/arms, manages consent documents, opens IRB reviews, runs compensation payments."
    identity: "opaque"
    exclusive_operations:
      - "POST /trials"
      - "POST /trials/{id}/criteria"
      - "POST /trials/{id}/arms"
      - "POST /trials/{id}/consent-documents"
      - "POST /trials/{id}/consent-documents/{docId}/activate"
      - "POST /trials/{id}/irb-reviews"
      - "POST /enrollments/{id}/payments"
      - "POST /payments/{id}/pay"
    shared_operations:
      - "GET (trials, criteria, arms, consent-documents, irb-reviews, screenings, enrollments, visits, adverse-events, payments)"

  - name: IRBReviewer
    description: "Independent ethics reviewer; decides protocol and consent reviews. Must not be the trial sponsor (segregation of duties)."
    identity: "opaque"
    exclusive_operations:
      - "POST /trials/{id}/irb-reviews/{reviewId}/decide"
    shared_operations:
      - "GET (trials, criteria, arms, consent-documents, irb-reviews)"

  - name: CoordinatorStaff
    description: "Site staff: registers/updates participants, runs screening, drives enrollment lifecycle transitions, schedules and completes visits."
    identity: "opaque"
    exclusive_operations:
      - "POST /participants"
      - "PATCH /participants/{id}"
      - "POST /trials/{id}/screen-participant"
      - "POST /enrollments"
      - "POST /enrollments/{id}/transition"
      - "POST /enrollments/{id}/visits"
      - "POST /visits/{id}/complete"
    shared_operations:
      - "GET (trials, criteria, arms, consent-documents, screenings, enrollments, visits, adverse-events, payments)"

  - name: Investigator
    description: "Clinician who reports adverse events. Cannot triage/adjudicate the events they report (segregation of duties)."
    identity: "opaque"
    exclusive_operations:
      - "POST /enrollments/{id}/adverse-events"
    shared_operations:
      - "GET (adverse-events)"

  - name: SafetyOfficer
    description: "Independent safety reviewer: triages and adjudicates adverse events, lifts safety holds. Must not be the AE reporter."
    identity: "opaque"
    exclusive_operations:
      - "POST /adverse-events/{id}/review"
      - "POST /enrollments/{id}/lift-hold"
    shared_operations:
      - "GET (trials, enrollments, visits, adverse-events)"
