scaffold_difficulty_design:

  # =========================================================================
  # Rule 1: Dual-variant calculations on different entity domains (>=2)
  # =========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: franchise_tax_authorized_vs_assumed_par
        grounds:
          - calculations.franchise_tax_base
          - calculations.franchise_tax_base.variants.authorized_shares
          - calculations.franchise_tax_base.variants.assumed_par_value
          - endpoints.POST_/business-registry/tax-assessments
          - entities.BusinessEntity.fields.authorized_shares
          - entities.BusinessEntity.fields.total_gross_assets_cents
          - entities.BusinessEntity.fields.total_issued_shares
        distinguishing_aspect: |
          For the same CORP BusinessEntity (authorized_shares=12000, total_gross_assets_cents=100000000,
          total_issued_shares=8000), the AUTHORIZED_SHARES variant computes base_tax_cents=33500 while
          the ASSUMED_PAR_VALUE variant computes base_tax_cents=80000 — two valid algorithms,
          identical inputs, different cents. Entity domain: FranchiseTaxAssessment over BusinessEntity (CORP).
        test_recipe:
          setup:
            - "Create BusinessEntity{entity_type=CORP, home_state=DE, authorized_shares=12000, total_gross_assets_cents=100000000, total_issued_shares=8000} via POST /business-registry/entities"
            - "POST /business-registry/entities/{id}/form to drive to ACTIVE"
          trigger:
            - "POST /business-registry/tax-assessments {business_entity_id, tax_year=2024, calculation_method=AUTHORIZED_SHARES} → assessment A"
            - "POST /business-registry/tax-assessments {business_entity_id, tax_year=2025, calculation_method=ASSUMED_PAR_VALUE} → assessment B"
          assert:
            - "assessment A.base_tax_cents == 33500"
            - "assessment B.base_tax_cents == 80000"
            - "assessment A.base_tax_cents != assessment B.base_tax_cents"

      - name: boi_exposure_provisional_vs_finalized
        grounds:
          - calculations.beneficial_owner_exposure_score
          - calculations.beneficial_owner_exposure_score.variants.provisional
          - calculations.beneficial_owner_exposure_score.variants.finalized
          - endpoints.GET_/business-registry/entities/{id}/exposure-summary
          - entities.BOIOwnership
          - entities.BeneficialOwner.fields.identifying_document_type
        distinguishing_aspect: |
          For the same BusinessEntity with a FILED+CURRENT BOIReport snapshot containing
          (Owner1: STATE_DRIVERS_LICENSE 40%, Owner2: FOREIGN_PASSPORT 60%) yielding finalized_score=2.20,
          after Owner2's identifying_document_type is changed to STATE_ID (and the BOIReport is NOT yet
          updated), provisional_score recomputes to 1.60 while finalized_score remains 2.20. Entity domain:
          BeneficialOwner via BOIOwnership — structurally distinct from the FranchiseTaxAssessment domain
          in instance 1.
        test_recipe:
          setup:
            - "Create ACTIVE BusinessEntity"
            - "Create BeneficialOwner O1 (STATE_DRIVERS_LICENSE), O2 (FOREIGN_PASSPORT)"
            - "POST .../entities/{id}/boi-ownership for O1 bps=4000 and O2 bps=6000"
            - "Create BOIReport(filing_type=INITIAL); POST /file → status=CURRENT"
            - "Update O2.identifying_document_type → STATE_ID by replacing the ownership row (terminate then re-add with new owner referencing STATE_ID document) WITHOUT filing a BOI UPDATE"
          trigger:
            - "GET /business-registry/entities/{id}/exposure-summary?view=provisional"
            - "GET /business-registry/entities/{id}/exposure-summary?view=finalized"
          assert:
            - "exposure-summary provisional.score == 1.60"
            - "exposure-summary finalized.score == 2.20"
            - "provisional.score != finalized.score"

  # =========================================================================
  # Rule 2: Combinatorial formulas across different modes (>=2)
  # =========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: late_fee_three_input_threshold_with_per_line_rounding
        grounds:
          - calculations.franchise_tax_late_fee
          - calculations.franchise_tax_late_fee.constants.MONTHLY_INTEREST_RATE
          - calculations.franchise_tax_late_fee.constants.LATE_FEE_FLAT_CENTS
          - calculations.franchise_tax_late_fee.constants.LATE_FEE_MONTH_CAP
          - endpoints.POST_/business-registry/_clock/advance
          - state_machines.FranchiseTaxAssessment.ASSESSED_to_OVERDUE
        distinguishing_aspect: |
          Mode (a) + mode (b): formula has THREE inputs (base_tax_cents, due_date, now) with
          non-linear interaction via ceil()-of-month, 18-month cap, and pinned per-line rounding
          order: monthly_interest_cents = round_half_up(base_tax * 0.015) BEFORE multiplying
          by months_late, NOT round_half_up(base_tax * 0.015 * months_late). The two orders
          diverge starting at base_tax_cents=33500 / months_late=4 (per-line: 503*4=2012;
          all-at-once: round_half_up(33500*0.015*4)=2010). Pinned to per-line for this scaffold.
        test_recipe:
          setup:
            - "Create ACTIVE CORP BusinessEntity with authorized_shares=12000"
            - "POST /business-registry/tax-assessments {tax_year=2024, calculation_method=AUTHORIZED_SHARES} → assessment with base_tax_cents=33500, due_date=2025-03-01"
            - "Set clock to 2025-03-02 via POST /_clock/advance"
          trigger:
            - "POST /_clock/advance with duration spanning 2025-03-02 → 2025-06-15 (≈106 days)"
          assert:
            - "FranchiseTaxAssessment.status == OVERDUE"
            - "FranchiseTaxAssessment.late_fee_cents == 22012   # = 20000 + round_half_up(33500*0.015)=503 * 4 months"
            - "FranchiseTaxAssessment.total_due_cents == 55512"

      - name: total_due_with_credit_pinned_evaluation_order
        grounds:
          - calculations.total_due_with_credit_application
          - calculations.franchise_tax_late_fee
          - entities.BusinessEntity.fields.credit_balance_cents
          - endpoints.POST_/business-registry/entities/{id}/credit-deposit
          - endpoints.POST_/business-registry/tax-assessments/{id}/pay
        distinguishing_aspect: |
          Mode (c): circular-looking dependency between total_due_cents, late_fee_cents, and
          credit_applied_cents (which itself depends on the pre-credit total). Evaluation order
          is PINNED: late_fee first (from franchise_tax_late_fee), then pre_credit_due, then
          credit_applied = min(credit_balance, pre_credit_due), then total_due. Late fee is NOT
          recomputed after credit application. Structurally distinct from mode (a) above
          (multi-input threshold) because the difficulty here is the evaluation ORDER, not the
          formula shape.
        test_recipe:
          setup:
            - "Reproduce assessment from late_fee_three_input_threshold_with_per_line_rounding (base=33500, late_fee=22012, status=OVERDUE)"
            - "POST /business-registry/entities/{business_entity_id}/credit-deposit {amount_cents: 10000}"
          trigger:
            - "POST /business-registry/tax-assessments/{id}/pay"
          assert:
            - "FranchiseTaxAssessment.total_due_cents == 45512   # = 33500 + 22012 - 10000"
            - "BusinessEntity.credit_balance_cents == 0"
            - "FranchiseTaxAssessment.late_fee_cents == 22012   # unchanged after credit applied"
            - "FranchiseTaxAssessment.status == PAID"

  # =========================================================================
  # Rule 3: Non-linear state-machine shape across different entities (>=2)
  # =========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: annual_report_reject_to_draft_revision_cycle
        grounds:
          - state_machines.AnnualReport
          - state_machines.AnnualReport.SUBMITTED_to_REJECTED
          - state_machines.AnnualReport.REJECTED_to_DRAFT
          - endpoints.POST_/business-registry/annual-reports/{id}/reject
          - endpoints.PATCH_/business-registry/annual-reports/{id}
        distinguishing_aspect: |
          Cyclic shape on AnnualReport: SUBMITTED → REJECTED → DRAFT → SUBMITTED. A second
          rejection round produces the SAME state vertex visited twice, structurally distinct
          from any linear A→B→C pipeline. Entity: AnnualReport.
        test_recipe:
          setup:
            - "ACTIVE BusinessEntity"
            - "Create AnnualReport in DRAFT; POST /submit → SUBMITTED"
          trigger:
            - "POST .../reject with rejection_reason='missing principal_office_address'"
            - "PATCH /annual-reports/{id} {principal_office_address='123 Main'} → DRAFT"
            - "POST /submit → SUBMITTED (second cycle iteration)"
            - "POST .../reject with rejection_reason='needs officer count'"
          assert:
            - "After first /reject: status == REJECTED"
            - "After PATCH: status == DRAFT AND rejection_reason == null"
            - "After second /submit: status == SUBMITTED"
            - "After second /reject: status == REJECTED  # revisited"

      - name: boi_report_current_stale_current_cycle
        grounds:
          - state_machines.BOIReport
          - state_machines.BOIReport.CURRENT_to_STALE
          - state_machines.BOIReport.STALE_to_CURRENT
          - endpoints.POST_/business-registry/_clock/advance
          - endpoints.POST_/business-registry/boi-reports/{id}/file
        distinguishing_aspect: |
          Cyclic shape on BOIReport: CURRENT → STALE → CURRENT (via timely UPDATE filing).
          Distinct entity from instance 1 (BOIReport, not AnnualReport) and distinct cycle
          topology (CURRENT visited twice with a STALE detour, not a REJECT/REVISION loop).
        test_recipe:
          setup:
            - "ACTIVE BusinessEntity with two owners summing to 10000 bps; INITIAL BOIReport FILED → CURRENT"
            - "Add a new BOIOwnership row (forces ownership-change clock)"
          trigger:
            - "POST /_clock/advance by 31 days → BOIReport transitions CURRENT → STALE"
            - "POST /business-registry/boi-reports {filing_type=UPDATE} → new DRAFT report"
            - "POST .../file on the new report → it becomes FILED → CURRENT; the previous STALE report becomes CORRECTED"
          assert:
            - "After clock advance: prior report.status == STALE"
            - "After UPDATE file: prior report.status == CORRECTED"
            - "After UPDATE file: the new report.status == CURRENT  # CURRENT-vertex revisited via cycle"
            - "BusinessEntity.compliance_status returned to GOOD_STANDING"

  # =========================================================================
  # Rule 4: Transitive cascade chains from different triggers (>=2)
  # =========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: tax_overdue_to_delinquent_to_admin_dissolved_depth3
        grounds:
          - state_machines.FranchiseTaxAssessment.ASSESSED_to_OVERDUE
          - state_machines.FranchiseTaxAssessment.OVERDUE_to_DELINQUENT
          - state_machines.BusinessEntity.ACTIVE_to_ADMINISTRATIVELY_DISSOLVED
          - state_machines.ForeignQualification.QUALIFIED_to_REVOKED
          - endpoints.POST_/business-registry/_clock/advance
        distinguishing_aspect: |
          Depth-4 chain triggered by clock-advance: (1) FranchiseTaxAssessment ASSESSED→OVERDUE
          (depth 1, side effect: drive BusinessEntity.compliance_status GOOD→NOT_IN); (2) the
          tax row itself OVERDUE→DELINQUENT after 90 days (depth 2, side effect: drive
          compliance_status NOT_IN→DELINQUENT); (3) ComplianceOfficer issues ADMIN_DISSOLVE on
          DELINQUENT-for-60-days, which mutates BusinessEntity.formation_status (depth 3); (4)
          that admin-dissolve cascades into any QUALIFIED ForeignQualification → REVOKED
          (depth 4). Each link is caused by the prior link, not the original tick.
        test_recipe:
          setup:
            - "ACTIVE CORP BusinessEntity with authorized_shares=12000"
            - "POST /tax-assessments {tax_year=2024, calculation_method=AUTHORIZED_SHARES}  → due_date=2025-03-01"
            - "Create a QUALIFIED ForeignQualification in NY"
          trigger:
            - "POST /_clock/advance to 2025-03-02 → assessment.status=OVERDUE; BE.compliance_status=NOT_IN_GOOD_STANDING"
            - "POST /_clock/advance to 2025-06-01 (≈92 days past due) → assessment.status=DELINQUENT; BE.compliance_status=DELINQUENT"
            - "POST /_clock/advance to 2025-08-01 (>=60 days DELINQUENT)"
            - "POST /business-registry/entities/{id}/administratively-dissolve"
          assert:
            - "FranchiseTaxAssessment.status == DELINQUENT after second clock advance"
            - "BusinessEntity.compliance_status == DELINQUENT after second clock advance"
            - "After admin-dissolve: BusinessEntity.formation_status == ADMINISTRATIVELY_DISSOLVED"
            - "After admin-dissolve: ForeignQualification.status == REVOKED  # depth-4 hop"
            - "ComplianceEvent rows include TAX_OVERDUE, TAX_DELINQUENT, ADMIN_DISSOLVED, FOREIGN_REVOKED in chronological order"

      - name: boi_ownership_change_to_stale_to_compliance_loss_depth3
        grounds:
          - state_machines.BOIReport.CURRENT_to_STALE
          - state_machines.BusinessEntity.compliance_status_sub_machine
          - endpoints.DELETE_/business-registry/entities/{id}/boi-ownership/{ownership_id}
          - endpoints.POST_/business-registry/_clock/advance
          - calculations.boi_penalty
          - calculations.derived_compliance_status
        distinguishing_aspect: |
          Distinct trigger: a DELETE on BOIOwnership (not a clock-advance on tax). Depth-3
          chain: (1) BOIOwnership row termination starts a 30-day timer; (2) clock advance past
          30 days transitions BOIReport CURRENT→STALE (depth 2 — caused by the termination
          ageing past threshold); (3) STALE state drives BusinessEntity.compliance_status
          GOOD_STANDING→NOT_IN_GOOD_STANDING (depth 3 — caused by the STALE transition itself,
          not by the original DELETE). Originating transition is BOIOwnership termination,
          structurally distinct from the tax-overdue trigger in the first instance.
        test_recipe:
          setup:
            - "ACTIVE BusinessEntity with three owners summing to 10000 bps; INITIAL BOIReport FILED → CURRENT; BE.compliance_status=GOOD_STANDING"
          trigger:
            - "DELETE /business-registry/entities/{id}/boi-ownership/{owner_id}  # terminate one owner row"
            - "POST /_clock/advance by 31 days"
          assert:
            - "BOIReport.status == STALE after the clock advance"
            - "BusinessEntity.compliance_status == NOT_IN_GOOD_STANDING after the clock advance"
            - "BOIReport.penalty_cents == 59100   # 1 day * $591 in cents (immediately after STALE)"

  # =========================================================================
  # Rule 5: Validation priority conflicts across different error-category pairs (>=2)
  # =========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_vs_business_safety_segregation
        grounds:
          - validations[priority=6]
          - validations[priority=8]
          - errors.ERR_INVALID_STATE
          - errors.ERR_SEGREGATION_OF_DUTIES
          - endpoints.POST_/business-registry/annual-reports/{id}/accept
        distinguishing_aspect: |
          Error-category pair (state vs business_safety): an AnnualReport already in ACCEPTED
          (so /accept would yield ERR_INVALID_STATE per priority 6) is hit by a /accept call
          whose X-User-ID also violates segregation of duties (priority 8 → ERR_SEGREGATION_OF_DUTIES).
          Priority 6 < 8, so the state error wins.
        test_recipe:
          setup:
            - "Create ACTIVE BusinessEntity (entity_id=E)"
            - "Create AnnualReport, POST /submit, POST /accept by TaxOfficer T1 → status=ACCEPTED"
          trigger:
            - "POST /business-registry/annual-reports/{id}/accept with X-User-Role=TaxOfficer and X-User-ID=E (Filer's own id — would normally violate segregation)"
          assert:
            - "HTTP 409"
            - "error_id == ERR_INVALID_STATE   # priority 6 fires before priority 8 ERR_SEGREGATION_OF_DUTIES"

      - name: business_fiscal_vs_business_constraint_tax_method
        grounds:
          - validations[priority=20]
          - validations[priority=22]
          - errors.ERR_INVALID_TAX_METHOD
          - errors.ERR_DUPLICATE_TAX_YEAR
          - endpoints.POST_/business-registry/tax-assessments
        distinguishing_aspect: |
          Different error-category pair (business_fiscal vs business_constraint): a tax-assessment
          POST for an LLC entity uses calculation_method=AUTHORIZED_SHARES (priority 20 fiscal →
          ERR_INVALID_TAX_METHOD) AND duplicates an already-assessed tax_year (priority 22 constraint
          → ERR_DUPLICATE_TAX_YEAR). Priority 20 < 22, so the fiscal error wins. Distinct from
          instance 1's (state, business_safety) pairing.
        test_recipe:
          setup:
            - "Create ACTIVE LLC BusinessEntity"
            - "POST /tax-assessments {tax_year=2024, calculation_method=FLAT} succeeds"
          trigger:
            - "POST /tax-assessments {tax_year=2024, calculation_method=AUTHORIZED_SHARES}"
          assert:
            - "HTTP 422"
            - "error_id == ERR_INVALID_TAX_METHOD   # priority 20 fires before priority 22 ERR_DUPLICATE_TAX_YEAR"

  # =========================================================================
  # Rule 6: Boundary-precision checks on different metrics/endpoints (>=2)
  # =========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: authorized_shares_tier_boundary_5000_vs_5001
        grounds:
          - calculations.franchise_tax_base.constants.CORP_TIER1_MAX_SHARES
          - calculations.franchise_tax_base.constants.CORP_TIER2_TAX_CENTS
          - endpoints.POST_/business-registry/tax-assessments
        distinguishing_aspect: |
          Numeric threshold boundary at authorized_shares <= 5000 vs > 5000. 5000 shares
          (inclusive) yields base_tax_cents=17500 ($175); 5001 shares (just over) jumps to
          25000 cents ($250). Endpoint: POST /tax-assessments. Metric: dollar tax amount.
        test_recipe:
          setup:
            - "Create two ACTIVE CORP BusinessEntities E_A and E_B"
            - "E_A.authorized_shares=5000; E_B.authorized_shares=5001"
          trigger:
            - "POST /tax-assessments {business_entity_id=E_A, tax_year=2024, calculation_method=AUTHORIZED_SHARES}"
            - "POST /tax-assessments {business_entity_id=E_B, tax_year=2024, calculation_method=AUTHORIZED_SHARES}"
          assert:
            - "assessment(E_A).base_tax_cents == 17500"
            - "assessment(E_B).base_tax_cents == 25000"

      - name: ownership_sum_empty_vs_full_10000_bps
        grounds:
          - validations[priority=15]
          - errors.ERR_OWNERSHIP_NOT_100
          - endpoints.POST_/business-registry/boi-reports/{id}/file
          - entities.BOIOwnership.fields.ownership_percent_basis_points
        distinguishing_aspect: |
          Empty-collection / aggregate boundary: zero active BOIOwnership rows (sum=0) and
          sum=9999 BOTH must reject; sum=10000 (exact) must accept. Different metric
          (basis-point sum, not a tax dollar boundary) and different endpoint (POST /boi-reports/{id}/file,
          not POST /tax-assessments).
        test_recipe:
          setup:
            - "ACTIVE BusinessEntity E"
            - "Create BeneficialOwner O1 (US_PASSPORT)"
            - "POST .../entities/E/boi-ownership {beneficial_owner_id=O1, ownership_percent_basis_points=9999}"
            - "Create BOIReport R1{filing_type=INITIAL}"
          trigger:
            - "POST /business-registry/boi-reports/R1/file  # case 1: sum=9999"
            - "PATCH ownership row to 10000 bps via DELETE + add new row; POST /file again"
          assert:
            - "Case 1: HTTP 422, error_id == ERR_OWNERSHIP_NOT_100"
            - "Case 2 (sum exactly 10000): HTTP 200, BOIReport.status == CURRENT"

  # =========================================================================
  # Rule 7: Cross-entity state dependencies across different entity pairs (>=2)
  # =========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: foreign_qualification_requires_business_entity_good_standing
        grounds:
          - state_machines.ForeignQualification.PENDING_to_QUALIFIED
          - state_machines.BusinessEntity.compliance_status_sub_machine
          - validations[priority=7]
          - endpoints.POST_/business-registry/foreign-qualifications/{id}/approve
        distinguishing_aspect: |
          Entity pair (ForeignQualification, BusinessEntity): ForeignQualification PENDING→QUALIFIED
          is gated by BusinessEntity.compliance_status = GOOD_STANDING. If the BusinessEntity is
          NOT_IN_GOOD_STANDING (e.g., open OVERDUE FranchiseTaxAssessment), the approve fails with
          ERR_INVALID_STATE even though the ForeignQualification row itself is in PENDING.
        test_recipe:
          setup:
            - "ACTIVE CORP BusinessEntity with an OVERDUE FranchiseTaxAssessment (drive via _clock/advance) → BE.compliance_status=NOT_IN_GOOD_STANDING"
            - "POST /foreign-qualifications {foreign_state=NY, …} → status=PENDING"
          trigger:
            - "POST /business-registry/foreign-qualifications/{id}/approve"
          assert:
            - "HTTP 409"
            - "error_id == ERR_INVALID_STATE"
            - "ForeignQualification.status == PENDING  # unchanged"

      - name: voluntary_dissolution_requires_no_active_dependents
        grounds:
          - state_machines.BusinessEntity.ACTIVE_to_DISSOLVED
          - validations[priority=19]
          - errors.ERR_HAS_DEPENDENCIES
          - state_machines.ForeignQualification.QUALIFIED_to_WITHDRAWN
          - state_machines.BOIReport.CURRENT_to_STALE
          - endpoints.POST_/business-registry/entities/{id}/dissolve
        distinguishing_aspect: |
          Different entity pair (BusinessEntity, BOIReport): voluntary dissolve fails when a
          STALE BOIReport exists. This is a distinct pair from instance 1 (ForeignQualification,
          BusinessEntity) — both directions are exercised, but the second sits on a different
          dependent entity.
        test_recipe:
          setup:
            - "ACTIVE BusinessEntity"
            - "INITIAL BOIReport → CURRENT; terminate an ownership row; POST /_clock/advance by 31 days → BOIReport.status=STALE"
          trigger:
            - "POST /business-registry/entities/{id}/dissolve"
          assert:
            - "HTTP 409"
            - "error_id == ERR_HAS_DEPENDENCIES"
            - "BusinessEntity.formation_status == ACTIVE  # unchanged"

  # =========================================================================
  # Rule 8: Resource temporal-overlap conflicts across different interval semantics (>=2)
  # =========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: foreign_qualification_unique_open_window_per_state_pair
        grounds:
          - validations[priority=18]
          - errors.ERR_DUPLICATE_FOREIGN_QUALIFICATION
          - entities.ForeignQualification.fields.status
          - endpoints.POST_/business-registry/foreign-qualifications
          - concurrency_rules[ForeignQualification]
        distinguishing_aspect: |
          Interval semantics: a "non-terminal" interval — half-open from creation to
          (WITHDRAWN ∪ REVOKED) — must NOT overlap another non-terminal interval on the same
          (business_entity_id, foreign_state). Adjacency is allowed (a WITHDRAWN row + a new
          PENDING row at the same instant is fine because the first is closed). Resource:
          ForeignQualification scoped by (business_entity_id, foreign_state).
        test_recipe:
          setup:
            - "ACTIVE BusinessEntity with home_state=DE"
            - "POST /foreign-qualifications {foreign_state=NY, …} → status=PENDING (interval open)"
          trigger:
            - "POST /foreign-qualifications {foreign_state=NY, …} (second filing, while first is PENDING)"
            - "POST .../first-qualification/withdraw  # close first interval (assume first was approved earlier in a setup variant), or reject it"
            - "POST /foreign-qualifications {foreign_state=NY, …} (third filing after first is REVOKED/WITHDRAWN)"
          assert:
            - "Second filing: HTTP 409, error_id == ERR_DUPLICATE_FOREIGN_QUALIFICATION  # overlapping open interval"
            - "Third filing after first terminated: HTTP 201  # non-overlapping intervals allowed"

      - name: annual_report_unique_year_window_per_entity
        grounds:
          - validations[priority=14]
          - errors.ERR_DUPLICATE_ANNUAL_REPORT
          - entities.AnnualReport.fields.report_year
          - endpoints.POST_/business-registry/annual-reports
          - concurrency_rules[AnnualReport]
        distinguishing_aspect: |
          Different interval semantics from instance 1: each AnnualReport occupies a CLOSED
          calendar-year interval (report_year is an integer year, both endpoints inclusive),
          and the conflict rule is "no two reports with status IN {SUBMITTED, ACCEPTED} for the
          same year" — REJECTED reports DO NOT block a new submission, so the "occupied" set is
          status-filtered, unlike Rule 8 instance 1 which counts non-terminal as occupied.
          Resource: AnnualReport scoped by (business_entity_id, report_year).
        test_recipe:
          setup:
            - "ACTIVE BusinessEntity"
            - "Create AnnualReport for year 2024 → DRAFT → SUBMITTED → REJECTED"
            - "Create AnnualReport for year 2024 → DRAFT → SUBMITTED → ACCEPTED"
          trigger:
            - "POST /annual-reports {report_year=2024, …}  # third attempt while ACCEPTED holds the year"
          assert:
            - "Second creation (after first is REJECTED): allowed — REJECTED does NOT occupy the year"
            - "Third creation: HTTP 409, error_id == ERR_DUPLICATE_ANNUAL_REPORT  # ACCEPTED occupies"
            - "First report.status == REJECTED  # remains, never deletes year"

  # =========================================================================
  # Rule 9: Compensating-action invariants across different conserved quantities (>=2)
  # =========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: tax_pay_refund_credit_balance_conserved
        grounds:
          - entities.BusinessEntity.fields.credit_balance_cents
          - calculations.total_due_with_credit_application
          - endpoints.POST_/business-registry/tax-assessments/{id}/pay
          - endpoints.POST_/business-registry/tax-assessments/{id}/refund
          - endpoints.POST_/business-registry/entities/{id}/credit-deposit
        distinguishing_aspect: |
          Conserved quantity (in cents): BusinessEntity.credit_balance_cents +
          sum(credit_applied_cents on PAID FranchiseTaxAssessments) MUST equal the running total
          of cents ever deposited via /credit-deposit. /pay debits credit_balance by
          credit_applied_cents; /refund (compensating action) restores credit_balance by exactly
          credit_applied_cents, leaving the conserved sum unchanged.
        test_recipe:
          setup:
            - "ACTIVE CORP BusinessEntity"
            - "POST /credit-deposit {amount_cents: 50000}  # total ever-deposited = 50000"
            - "POST /tax-assessments {tax_year=2024, calculation_method=AUTHORIZED_SHARES} (authorized_shares=5000) → base_tax_cents=17500"
          trigger:
            - "POST /tax-assessments/{id}/pay  # credit_balance: 50000 → 32500; credit_applied=17500"
            - "POST /tax-assessments/{id}/refund  # compensating action"
          assert:
            - "After /pay: BusinessEntity.credit_balance_cents == 32500 AND assessment.status == PAID"
            - "After /refund: BusinessEntity.credit_balance_cents == 50000   # invariant: credit_balance is restored exactly"
            - "After /refund: assessment.status == ASSESSED   # back to non-PAID"
            - "Conserved global: credit_balance_cents + 0 == 50000 (every deposit accounted for)"

      - name: boi_ownership_add_terminate_bps_sum_conserved
        grounds:
          - entities.BOIOwnership.fields.ownership_percent_basis_points
          - validations[priority=15]
          - endpoints.POST_/business-registry/entities/{id}/boi-ownership
          - endpoints.DELETE_/business-registry/entities/{id}/boi-ownership/{ownership_id}
        distinguishing_aspect: |
          Different conserved quantity (basis points, not cents): the invariant
          sum(active_BOIOwnership.ownership_percent_basis_points for BE) MUST be unchanged by
          a forward action (ADD a new ownership row with delta bps) paired with its compensating
          action (DELETE that same row). Conserved quantity is a percentage stake total, not a
          monetary balance — structurally distinct from instance 1.
        test_recipe:
          setup:
            - "ACTIVE BusinessEntity"
            - "Create BeneficialOwner O1 (US_PASSPORT) and O2 (STATE_DRIVERS_LICENSE)"
            - "POST .../boi-ownership {beneficial_owner_id=O1, bps=10000}  # sum=10000 (single owner)"
          trigger:
            - "POST .../boi-ownership {beneficial_owner_id=O2, bps=2500}  # FORWARD action; sum=12500"
            - "DELETE .../boi-ownership/{O2_row_id}  # COMPENSATING action; sum returns to baseline"
          assert:
            - "After forward action: sum(active_BOIOwnership.ownership_percent_basis_points) == 12500"
            - "After compensating action: sum(active_BOIOwnership.ownership_percent_basis_points) == 10000   # invariant restored"
            - "The DELETE soft-deletes the row (terminated_at != null), but it does NOT contribute to active sum"
