              as: VesselOperator
              as_user_id: "${op_id}"
              captures: { err2: $.data.error_id }
          assert:
            - "Adjustment -413764 would drive outstanding 413763 to -1 -> ERR_ADJUSTMENT_WOULD_UNDERFLOW (422)"
            - "Second EM trip [2026-10-08, 2026-10-12] touches T1's closed interval [2026-10-01, 2026-10-08] at 2026-10-08 -> ERR_EM_TRIP_OVERLAP (409)"
            - "Invoice.${inv_id}.amount_adjusted_cents remains 0; EMTrip count for ${v_id} remains 1"

  # ===========================================================================
  # Section 7 — RBAC (Table 7 + segregation_of_duties role model): role
  # permission denials, ownership checks on entity_backed roles, and the two
  # segregation-of-duties rules (debriefer conflict of interest; invoice
  # adjustment by issuer).
  # ===========================================================================
  - section: rbac
    instances:
      - name: unauthenticated_request_missing_headers
        claim_type: rbac_denial
        grounds:
          - validations[priority=1]
          - errors[ERR_UNAUTHENTICATED]
        distinguishing_aspect: |
          Priority-1 auth: a request without X-User-Role / X-User-ID headers is
          rejected ERR_UNAUTHENTICATED (401) before any other check — even when
          the request body would otherwise be invalid (auth outranks schema).
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "POST /observer-program/fisheries"
              payload: { code: "BSAI-NA", coverage_target_pct: "not-a-number" }
              as: ProgramAdmin
              captures: { err: $.data.error_id }
          assert:
            - "Request sent WITHOUT X-User-Role / X-User-ID headers -> ERR_UNAUTHENTICATED (401)"
            - "Auth failure (priority 1) preempts the schema error (priority 4) that the malformed body would otherwise produce"

      - name: role_denied_for_exclusive_operation
        claim_type: rbac_denial
        grounds:
          - validations[priority=2]
          - errors[ERR_FORBIDDEN]
          - roles[ProgramCoordinator]
          - roles[ProgramAdmin]
        distinguishing_aspect: |
          Exclusive operations are enforced per role: ProgramCoordinator may NOT
          create fisheries (ProgramAdmin-exclusive) and ProgramAdmin may NOT
          create coverage plans (ProgramCoordinator-exclusive); both fail
          ERR_FORBIDDEN (403).
        test_recipe:
          setup:
            - "Fishery F exists (created by ProgramAdmin)"
          setup_api_calls:
            - call: "POST /observer-program/fisheries"
              payload: { code: "BSAI-RB", name: "RB Fishery", region: "Bering Sea", coverage_target_pct: 0.30, priority_gear: "TRAWL" }
              as: ProgramAdmin
              captures: { fish_id: $.data.id }
          trigger:
            - call: "POST /observer-program/fisheries"
              payload: { code: "BSAI-RB2", name: "Forbidden Fishery", region: "GOA", coverage_target_pct: 0.20, priority_gear: "POT" }
              as: ProgramCoordinator
              captures: { err1: $.data.error_id }
            - call: "POST /observer-program/coverage-plans"
              payload: { fishery_id: "${fish_id}", period_start: "2026-09-01T00:00:00Z", period_end: "2026-12-31T00:00:00Z", projected_fleet_effort_days: 100, projected_em_effort_days: 0 }
              as: ProgramAdmin
              captures: { err2: $.data.error_id }
          assert:
            - "ProgramCoordinator POST /fisheries -> ERR_FORBIDDEN (403)"
            - "ProgramAdmin POST /coverage-plans -> ERR_FORBIDDEN (403)"

      - name: observer_cannot_act_on_another_observers_deployment
        claim_type: rbac_denial
        grounds:
          - errors[ERR_FORBIDDEN]
          - roles[Observer]
        distinguishing_aspect: |
          Ownership for entity_backed Observer: board requires acting observer
          == Deployment.observer_id; a different Observer entity's id in
          X-User-ID fails ERR_FORBIDDEN (403).
        test_recipe:
          setup:
            - "Deployment D READY_TO_DEPLOY owned by observer OBS1; observer OBS2 also exists"
          setup_api_calls:
            - call: "POST /observer-program/fisheries"
