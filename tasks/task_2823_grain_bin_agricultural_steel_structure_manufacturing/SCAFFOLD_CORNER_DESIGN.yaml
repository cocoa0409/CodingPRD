            - "that same call requeues both orders: O1 and O2 are production_status QUEUED again"
            - "re-setting the limit to the value already in force returns HTTP 200, leaves status ACTIVE, credit_available_cents 0 and both orders QUEUED, yet still increments Dealer.version by 1"
            - "Dealer.version increased by exactly 1 on each of the four credit-limit calls"
            - "at every step credit_limit_cents == credit_committed_cents + credit_available_cents holds exactly, including 3999467 == 3999468 + (-1)"

