          - complexity_profile.complexity_layers.dual_variant_calculation
          - calculations.claim_net_payable.variants
          - calculations.builder_risk_score.variants
        distinguishing_aspect: "Each dual-variant calculation must produce the declared result under both variants and the delta on switching must be exactly the difference the constants imply."
        excluded_because:
          difficulty_instance: "claim_net_payable_builder_arm_waives_deductible_insurer_arm_charges_it"
          rationale: "The two dual-variant calculations are each covered by a difficulty instance that runs both arms on identical inputs and pins the delta - the settlement pair here and the declared-versus-observed risk score pair in builder_risk_score_declared_vs_observed_variant_changes_band; a generic variant test would restate them."

  - section: "Consistency Model"
    instances:
