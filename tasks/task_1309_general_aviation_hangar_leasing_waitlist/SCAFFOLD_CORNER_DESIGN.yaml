              payload: { airport_code: "KSAU", name: "Susp Auth Field", escalation_pct: 0.0, escalation_policy: "ANNIVERSARY_SIMPLE", offer_acceptance_window_hours: 72, cure_window_days: 30, late_fee_grace_days: 5 }
              as: AirportManager
              captures: { ap_sa: $.data.id }
