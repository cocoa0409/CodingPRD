            - "WorkOrder.${wo_id}.status remains TRIAGED"

      - name: technician_cannot_approve_purchase_request
        claim_type: role_denial
        grounds: ["roles[Technician]", "endpoints[POST /purchase-requests/{id}/events]", "errors[ERR_FORBIDDEN]"]
        distinguishing_aspect: "The approval chain forbids the requester from approving: a Technician calling the purchase-request events endpoint gets ERR_FORBIDDEN (403)."
