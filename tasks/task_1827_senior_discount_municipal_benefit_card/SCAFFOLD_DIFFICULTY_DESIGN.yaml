            - "recertification_due_date == '2028-06-01' (approval date 2027-06-02 + 365 days)"
            - "annual_income_cents refreshed to 1500000 from the recertification application"

  - rule_id: transitive_cascade
    instances:
      - name: manual_flag_cascade_suspends_cardholder_and_cards
        grounds:
          - state_machines.UsageTransaction.POSTED_to_FLAGGED
          - state_machines.Cardholder.ACTIVE_to_SUSPENDED
          - state_machines.BenefitCard.ACTIVE_to_SUSPENDED
          - entities.Cardholder.fields.fraud_flag_count
        distinguishing_aspect: |
          Depth-4 cascade from the POST .../flag trigger: (1) the transaction
          transitions POSTED -> FLAGGED; (2) that transition increments
          cardholder.fraud_flag_count 2 -> 3; (3) the counter crossing
          FRAUD_SUSPEND_THRESHOLD (3) suspends the Cardholder
          (pre_suspension_status ACTIVE preserved); (4) the cardholder suspension
          cascades their ACTIVE card to SUSPENDED. Each link is caused by the
          previous link, not by the flag call itself.
        test_recipe:
          setup:
            - "Cardholder onboarded with ACTIVE card; merchant (rate 10, cap 100000) with GROCERY offer 10% max 100"
            - "Clock 2026-08-10T10:00:00Z; three POSTED transactions t1, t2, t3 (purchase 100 each, day counts 1-3)"
            - "FraudAnalyst fraud-1 has already flagged t1 and t2 (fraud_flag_count == 2; below threshold 3, cardholder still ACTIVE)"
          setup_api_calls:
            - { call: "POST /senior-benefits/applications", payload: { kind: INITIAL, applicant_full_name: "Flagg Cascade", date_of_birth: "1960-02-02", annual_income_cents: 600000, residency_address: "8 Ash St" }, as: Applicant, captures: { app_id: $.data.id } }
            - { call: "POST /senior-benefits/applications/${app_id}/start-review", payload: {}, as: EligibilitySpecialist, as_user_id: "spec-1" }
            - { call: "POST /senior-benefits/applications/${app_id}/documents", payload: { document_type: PROOF_OF_AGE, document_reference: "F-AGE" }, as: Applicant, captures: { doc1: $.data.id } }
            - { call: "POST /senior-benefits/applications/${app_id}/documents/${doc1}/review", payload: { decision: VERIFIED }, as: EligibilitySpecialist, as_user_id: "spec-1" }
            - { call: "POST /senior-benefits/applications/${app_id}/documents", payload: { document_type: PROOF_OF_INCOME, document_reference: "F-INC" }, as: Applicant, captures: { doc2: $.data.id } }
            - { call: "POST /senior-benefits/applications/${app_id}/documents/${doc2}/review", payload: { decision: VERIFIED }, as: EligibilitySpecialist, as_user_id: "spec-1" }
            - { call: "POST /senior-benefits/applications/${app_id}/documents", payload: { document_type: PROOF_OF_RESIDENCY, document_reference: "F-RES" }, as: Applicant, captures: { doc3: $.data.id } }
            - { call: "POST /senior-benefits/applications/${app_id}/documents/${doc3}/review", payload: { decision: VERIFIED }, as: EligibilitySpecialist, as_user_id: "spec-1" }
            - { call: "POST /senior-benefits/applications/${app_id}/approve", payload: {}, as: ProgramAdministrator, as_user_id: "admin-1", captures: { ch_id: $.data.cardholder_id } }
            - { call: "GET /senior-benefits/cardholders/${ch_id}/cards", as: ProgramAdministrator, captures: { card_id: "$.data[0].id" } }
            - { call: "POST /senior-benefits/merchants", payload: { name: "Flag Foods", reimbursement_rate_pct: 10, monthly_reimbursement_cap_cents: 100000 }, as: ProgramAdministrator, captures: { m_id: $.data.id } }
            - { call: "POST /senior-benefits/merchants/${m_id}/offers", payload: { category: GROCERY, discount_pct: 10, max_discount_cents: 100, valid_from: "2026-01-01", valid_until: "2027-01-01" }, as: MerchantOperator, as_user_id: "${m_id}" }
            - { call: "POST /senior-benefits/_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T10:00:00Z" }, as: ProgramAdministrator }
            - { call: "POST /senior-benefits/usage-transactions", payload: { card_id: "${card_id}", merchant_id: "${m_id}", category: GROCERY, purchase_amount_cents: 100 }, as: MerchantOperator, as_user_id: "${m_id}", captures: { t1: $.data.id } }
            - { call: "POST /senior-benefits/usage-transactions", payload: { card_id: "${card_id}", merchant_id: "${m_id}", category: GROCERY, purchase_amount_cents: 100 }, as: MerchantOperator, as_user_id: "${m_id}", captures: { t2: $.data.id } }
            - { call: "POST /senior-benefits/usage-transactions", payload: { card_id: "${card_id}", merchant_id: "${m_id}", category: GROCERY, purchase_amount_cents: 100 }, as: MerchantOperator, as_user_id: "${m_id}", captures: { t3: $.data.id } }
            - { call: "POST /senior-benefits/usage-transactions/${t1}/flag", payload: { reason: "duplicate pattern" }, as: FraudAnalyst, as_user_id: "fraud-1" }
            - { call: "POST /senior-benefits/usage-transactions/${t2}/flag", payload: { reason: "duplicate pattern" }, as: FraudAnalyst, as_user_id: "fraud-1" }
          trigger:
            - { call: "POST /senior-benefits/usage-transactions/${t3}/flag", payload: { reason: "third strike" }, as: FraudAnalyst, as_user_id: "fraud-1", captures: { t3_status: $.data.status, t3_flagger: $.data.flagged_by_user_id } }
            - { call: "GET /senior-benefits/cardholders/${ch_id}", as: FraudAnalyst, captures: { ch_status: $.data.status, ch_count: $.data.fraud_flag_count, ch_pre: $.data.pre_suspension_status } }
            - { call: "GET /senior-benefits/cardholders/${ch_id}/cards", as: FraudAnalyst, captures: { card_status: "$.data[0].status" } }
          assert:
            - "UsageTransaction.${t3}.status == FLAGGED and flagged_by_user_id == 'fraud-1' (link 1)"
            - "Cardholder.${ch_id}.fraud_flag_count == 3 (link 2: counter incremented by the flag transition)"
            - "Cardholder.${ch_id}.status == SUSPENDED with pre_suspension_status == ACTIVE (link 3: threshold crossing, not the flag call, suspends)"
            - "BenefitCard.${card_id}.status == SUSPENDED (link 4: cardholder suspension cascades to cards)"

      - name: clear_flag_cascade_restores_cardholder_and_cards
        grounds:
          - state_machines.UsageTransaction.FLAGGED_to_POSTED
          - state_machines.Cardholder.SUSPENDED_to_ACTIVE
          - state_machines.BenefitCard.SUSPENDED_to_ACTIVE
        distinguishing_aspect: |
          Depth-4 cascade from a DIFFERENT trigger (POST .../clear-flag, the
          compensating direction): (1) transaction FLAGGED -> POSTED; (2) that
          transition decrements fraud_flag_count 3 -> 2; (3) dropping below
          threshold restores the Cardholder to pre_suspension_status ACTIVE;
          (4) the cardholder restoration cascades their SUSPENDED card back to
          ACTIVE. Segregation: the clearer (fraud-2) differs from the flagger
          (fraud-1).
        test_recipe:
          setup:
            - "Same arrangement as manual_flag_cascade_suspends_cardholder_and_cards: three POSTED transactions, all flagged by fraud-1, cardholder SUSPENDED (pre_suspension_status ACTIVE), card SUSPENDED, fraud_flag_count == 3"
          setup_api_calls:
