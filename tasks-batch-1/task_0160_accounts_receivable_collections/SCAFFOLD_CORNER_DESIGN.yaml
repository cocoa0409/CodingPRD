# =============================================================================
# SCAFFOLD_CORNER_DESIGN.yaml — §1.9 Scaffold Corner Design (breadth probe)
# Accounts Receivable & Collections (Expert)
# Walks references/claim-extraction-guide.md against §1.1-§1.7.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: create_customer_returns_201_with_defaults
        claim_type: Creation
        grounds: [entities.Customer, endpoints]
        distinguishing_aspect: >-
          POST /ar/customers with name + credit_limit_cents returns 201 with
          credit_status GOOD, collection_stage CURRENT, currency default USD,
          exposure_cents 0, version 1.
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /ar/customers"
              payload: { name: "Acme", credit_limit_cents: 500000 }
              as: AR_MANAGER
              captures: { c_id: $.data.id, cur: $.data.currency, cs: $.data.credit_status, v: $.data.version }
          assert:
            - "Customer.currency == USD"
            - "Customer.credit_status == GOOD"
            - "Customer.collection_stage == CURRENT"
            - "Customer.exposure_cents == 0"
            - "Customer.version == 1"

      - name: get_customer_by_id_returns_stored_entity
        claim_type: Retrieval
        grounds: [entities.Customer, endpoints]
        distinguishing_aspect: "GET /ar/customers/{id} returns the customer just created with matching name."
        test_recipe:
          setup: ["one customer exists"]
          setup_api_calls:
            - call: "POST /ar/customers"
              payload: { name: "Beta", credit_limit_cents: 300000 }
              as: AR_MANAGER
              captures: { c_id: $.data.id }
          trigger:
            - call: "GET /ar/customers/${c_id}"
              payload: {}
              as: AUDITOR
              captures: { nm: $.data.name }
          assert:
            - "Customer.${c_id}.name == Beta"

      - name: list_invoices_paginated_envelope
        claim_type: Listing
        grounds: [entities.Invoice, endpoints]
        distinguishing_aspect: "GET /ar/invoices returns a paginated array with total_count and has_more in meta/envelope."
        test_recipe:
          setup: ["customer with 2 invoices"]
          setup_api_calls:
            - call: "POST /ar/customers"
              payload: { name: "ListCo", credit_limit_cents: 1000000 }
              as: AR_MANAGER
              captures: { c_id: $.data.id }
            - call: "POST /ar/invoices"
              payload: { customer_id: "${c_id}", invoice_date: "2026-01-01T00:00:00Z", due_date: "2026-02-01T00:00:00Z", face_amount_cents: 1000 }
              as: AR_CLERK
            - call: "POST /ar/invoices"
              payload: { customer_id: "${c_id}", invoice_date: "2026-01-01T00:00:00Z", due_date: "2026-02-01T00:00:00Z", face_amount_cents: 2000 }
              as: AR_CLERK
          trigger:
            - call: "GET /ar/invoices"
              payload: { customer_id: "${c_id}", limit: 1, offset: 0 }
              as: AUDITOR
          assert:
            - "response data is a list of length 1; envelope total_count == 2; has_more == true"

      - name: get_invoice_not_found_returns_404
        claim_type: Not Found
        grounds: ["errors[ERR_NOT_FOUND]", endpoints]
        distinguishing_aspect: "GET /ar/invoices/{id} with a non-existent UUID returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /ar/invoices/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: AUDITOR
              captures: { err: $.data.error_id }
          assert:
            - "response.error_id == ERR_NOT_FOUND"

      - name: create_invoice_missing_required_field_returns_invalid_request
        claim_type: Required Fields
        grounds: ["errors[ERR_INVALID_REQUEST]", entities.Invoice]
        distinguishing_aspect: "POST /ar/invoices missing face_amount_cents returns ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["one customer"]
          setup_api_calls:
            - call: "POST /ar/customers"
              payload: { name: "MissCo", credit_limit_cents: 100000 }
              as: AR_MANAGER
              captures: { c_id: $.data.id }
          trigger:
            - call: "POST /ar/invoices"
              payload: { customer_id: "${c_id}", invoice_date: "2026-01-01T00:00:00Z", due_date: "2026-02-01T00:00:00Z" }
              as: AR_CLERK
              captures: { err: $.data.error_id }
          assert:
            - "response.error_id == ERR_INVALID_REQUEST"

      - name: customer_currency_default_applied_when_omitted
        claim_type: Defaults
        grounds: [entities.Customer.fields.currency]
        distinguishing_aspect: "Omitting currency on POST /ar/customers yields default USD."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /ar/customers"
              payload: { name: "DefCo", credit_limit_cents: 100000 }
              as: AR_MANAGER
              captures: { cur: $.data.currency }
          assert:
            - "Customer.currency == USD"

      - name: invoice_balance_computed_equals_face_at_creation
        claim_type: Computed Fields
        grounds: [entities.Invoice.fields.balance_cents]
        distinguishing_aspect: "balance_cents is computed; a client-supplied balance_cents is ignored and equals face_amount_cents at creation."
        test_recipe:
          setup: ["one customer"]
          setup_api_calls:
            - call: "POST /ar/customers"
              payload: { name: "CompCo", credit_limit_cents: 1000000 }
              as: AR_MANAGER
              captures: { c_id: $.data.id }
          trigger:
            - call: "POST /ar/invoices"
              payload: { customer_id: "${c_id}", invoice_date: "2026-01-01T00:00:00Z", due_date: "2026-02-01T00:00:00Z", face_amount_cents: 7777 }
              as: AR_CLERK
              captures: { bal: $.data.balance_cents }
          assert:
            - "Invoice.balance_cents == 7777"

      - name: system_fields_generated_on_create
        claim_type: System Fields
        grounds: [entities.Payment]
        distinguishing_aspect: "id, created_at, version are server-minted on POST /ar/payments; version starts at 1."
        test_recipe:
          setup: ["one customer"]
          setup_api_calls:
            - call: "POST /ar/customers"
              payload: { name: "SysCo", credit_limit_cents: 1000000 }
              as: AR_MANAGER
              captures: { c_id: $.data.id }
          trigger:
            - call: "POST /ar/payments"
              payload: { customer_id: "${c_id}", amount_cents: 5000, received_at: "2026-03-01T00:00:00Z" }
              as: AR_CLERK
              captures: { pid: $.data.id, v: $.data.version }
          assert:
            - "Payment.id is a non-empty UUID; Payment.version == 1"

      - name: invoice_invalid_currency_enum_rejected
        claim_type: Type Constraints
        grounds: ["errors[ERR_INVALID_ENUM]", entities.Customer.fields.currency]
        distinguishing_aspect: "POST /ar/customers with currency JPY (outside {USD,EUR,GBP}) returns ERR_INVALID_ENUM (422)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /ar/customers"
              payload: { name: "Yen", currency: "JPY", credit_limit_cents: 100000 }
              as: AR_MANAGER
              captures: { err: $.data.error_id }
          assert:
            - "response.error_id == ERR_INVALID_ENUM"

      - name: invoice_due_before_invoice_date_rejected
        claim_type: Type Constraints
        grounds: ["errors[ERR_VALIDATION]", entities.Invoice.fields.due_date]
        distinguishing_aspect: "due_date earlier than invoice_date violates the field constraint -> ERR_VALIDATION (422)."
        test_recipe:
          setup: ["one customer"]
          setup_api_calls:
            - call: "POST /ar/customers"
              payload: { name: "DateCo", credit_limit_cents: 1000000 }
              as: AR_MANAGER
              captures: { c_id: $.data.id }
          trigger:
            - call: "POST /ar/invoices"
              payload: { customer_id: "${c_id}", invoice_date: "2026-03-01T00:00:00Z", due_date: "2026-02-01T00:00:00Z", face_amount_cents: 1000 }
              as: AR_CLERK
              captures: { err: $.data.error_id }
          assert:
            - "response.error_id == ERR_VALIDATION"

      - name: invoice_requires_existing_customer_parent
        claim_type: Parent Relationships
        grounds: [entities.Invoice.fields.customer_id, "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "POST /ar/invoices with a non-existent customer_id (FK) returns ERR_NOT_FOUND."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /ar/invoices"
              payload: { customer_id: "00000000-0000-4000-8000-000000000000", invoice_date: "2026-01-01T00:00:00Z", due_date: "2026-02-01T00:00:00Z", face_amount_cents: 1000 }
              as: AR_CLERK
              captures: { err: $.data.error_id }
          assert:
            - "response.error_id == ERR_NOT_FOUND"

      - name: dunning_notice_discoverable_only_via_reverse_get
        claim_type: flat
        grounds: [entities.DunningNotice.fields.invoice_id, endpoints]
        distinguishing_aspect: >-
          DunningNotice rows are cascade-created by POST /ar/dunning-runs (which
          returns DunningNotice[]) and are discoverable via the
          GET /ar/invoices/{id}/dunning-notices reverse-reachability channel.
        test_recipe:
          setup: ["customer with an overdue invoice and an active sequence; clock 2026-05-01"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: AR_MANAGER
            - call: "POST /ar/customers"
              payload: { name: "DN", credit_limit_cents: 1000000 }
              as: AR_MANAGER
              captures: { c_id: $.data.id }
            - call: "POST /ar/invoices"
              payload: { customer_id: "${c_id}", invoice_date: "2026-01-01T00:00:00Z", due_date: "2026-03-01T00:00:00Z", face_amount_cents: 5000 }
              as: AR_CLERK
              captures: { inv_id: $.data.id }
            - call: "POST /ar/dunning-sequences"
              payload: { name: "S", steps: [ { min_days_overdue: 1, channel: "EMAIL", severity: 1 } ] }
              as: AR_MANAGER
              captures: { seq_id: $.data.id }
            - call: "POST /ar/dunning-runs"
              payload: { customer_id: "${c_id}", sequence_id: "${seq_id}" }
              as: COLLECTIONS_AGENT
          trigger:
            - call: "GET /ar/invoices/${inv_id}/dunning-notices"
              payload: {}
              as: COLLECTIONS_AGENT
              captures: { step: "$.data[0].step_index" }
          assert:
            - "DunningNotice[0].step_index == 1"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: invoice_initial_state_is_open
        claim_type: Initial State
        grounds: [state_machines.Invoice, entities.Invoice.fields.status]
        distinguishing_aspect: "A freshly created invoice starts in status OPEN with dunning_stage_index 0."
        test_recipe:
          setup: ["one customer"]
          setup_api_calls:
            - call: "POST /ar/customers"
              payload: { name: "InitCo", credit_limit_cents: 1000000 }
              as: AR_MANAGER
              captures: { c_id: $.data.id }
          trigger:
            - call: "POST /ar/invoices"
              payload: { customer_id: "${c_id}", invoice_date: "2026-01-01T00:00:00Z", due_date: "2026-02-01T00:00:00Z", face_amount_cents: 1000 }
              as: AR_CLERK
              captures: { st: $.data.status, dsi: $.data.dunning_stage_index }
          assert:
            - "Invoice.status == OPEN"
            - "Invoice.dunning_stage_index == 0"

      - name: dispute_start_review_from_under_review_invalid
        claim_type: Invalid Transitions
        grounds: [state_machines.Dispute.OPEN_to_UNDER_REVIEW, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Calling start-review on a dispute already UNDER_REVIEW returns ERR_INVALID_STATE (no transition defined from UNDER_REVIEW for start-review)."
        test_recipe:
          setup: ["dispute moved to UNDER_REVIEW"]
          setup_api_calls:
            - call: "POST /ar/customers"
              payload: { name: "DS", credit_limit_cents: 1000000 }
              as: AR_MANAGER
              captures: { c_id: $.data.id }
            - call: "POST /ar/invoices"
              payload: { customer_id: "${c_id}", invoice_date: "2026-01-01T00:00:00Z", due_date: "2026-02-01T00:00:00Z", face_amount_cents: 50000 }
              as: AR_CLERK
              captures: { inv_id: $.data.id }
            - call: "POST /ar/disputes"
              payload: { invoice_id: "${inv_id}", amount_cents: 10000, reason_code: "DAMAGE" }
              as: COLLECTIONS_AGENT
              captures: { d_id: $.data.id }
            - call: "POST /ar/disputes/${d_id}/start-review"
              payload: {}
              as: AR_MANAGER
          trigger:
            - call: "POST /ar/disputes/${d_id}/start-review"
              payload: {}
              as: AR_MANAGER
              captures: { err: $.data.error_id }
          assert:
            - "response.error_id == ERR_INVALID_STATE"

      - name: terminal_paid_invoice_rejects_further_application
        claim_type: Terminal State Lockdown
        grounds: [state_machines.Invoice, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "A PAID invoice (terminal) rejects any further payment application with ERR_INVALID_STATE."
        test_recipe:
          setup: ["invoice fully paid, second payment available"]
          setup_api_calls:
            - call: "POST /ar/customers"
              payload: { name: "TL", credit_limit_cents: 1000000 }
              as: AR_MANAGER
              captures: { c_id: $.data.id }
            - call: "POST /ar/invoices"
              payload: { customer_id: "${c_id}", invoice_date: "2026-01-01T00:00:00Z", due_date: "2026-02-01T00:00:00Z", face_amount_cents: 4000 }
              as: AR_CLERK
              captures: { inv_id: $.data.id }
            - call: "POST /ar/payments"
              payload: { customer_id: "${c_id}", amount_cents: 8000, received_at: "2026-03-01T00:00:00Z" }
              as: AR_CLERK
              captures: { pay_id: $.data.id }
            - call: "POST /ar/payments/${pay_id}/applications"
              payload: { invoice_id: "${inv_id}", applied_cents: 4000 }
              as: AR_CLERK
          trigger:
            - call: "POST /ar/payments/${pay_id}/applications"
              payload: { invoice_id: "${inv_id}", applied_cents: 1000 }
              as: AR_CLERK
              captures: { err: $.data.error_id }
          assert:
            - "response.error_id == ERR_INVALID_STATE"

      - name: dispute_resolve_credit_decrements_invoice_balance
        claim_type: Side Effect Execution
        grounds: [state_machines.Dispute.UNDER_REVIEW_to_RESOLVED_CREDIT, entities.Invoice.fields.balance_cents]
        distinguishing_aspect: "Resolving a dispute with resolve_credit_cents 4000 decrements invoice.balance_cents by 4000 (60000 -> 56000) and clears disputed_amount."
        test_recipe:
          setup: ["OPEN invoice 60000, partial dispute 4000 started-review"]
          setup_api_calls:
            - call: "POST /ar/customers"
              payload: { name: "RC", credit_limit_cents: 1000000 }
              as: AR_MANAGER
              captures: { c_id: $.data.id }
            - call: "POST /ar/invoices"
              payload: { customer_id: "${c_id}", invoice_date: "2026-01-01T00:00:00Z", due_date: "2026-02-01T00:00:00Z", face_amount_cents: 60000 }
              as: AR_CLERK
              captures: { inv_id: $.data.id }
            - call: "POST /ar/disputes"
              payload: { invoice_id: "${inv_id}", amount_cents: 4000, reason_code: "PRICING" }
              as: COLLECTIONS_AGENT
              captures: { d_id: $.data.id }
            - call: "POST /ar/disputes/${d_id}/start-review"
              payload: {}
              as: AR_MANAGER
          trigger:
            - call: "POST /ar/disputes/${d_id}/resolve"
              payload: { resolve_credit_cents: 4000 }
              as: AR_MANAGER
            - call: "GET /ar/invoices/${inv_id}"
              payload: {}
              as: AR_MANAGER
              captures: { bal: $.data.balance_cents, disp: $.data.disputed_amount_cents }
          assert:
            - "Invoice.${inv_id}.balance_cents == 56000"
            - "Invoice.${inv_id}.disputed_amount_cents == 0"

      - name: dunning_run_bubbles_collection_stage_to_dunning
        claim_type: Bubble up
        grounds: [state_machines.Customer, entities.Customer.fields.collection_stage]
        distinguishing_aspect: "First dunning notice on an overdue (B1_30) invoice bubbles Customer.collection_stage CURRENT -> DUNNING."
        test_recipe:
          setup: ["customer with one invoice 1-30 days overdue; clock 2026-04-01; due 2026-03-15"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-01T00:00:00Z" }
              as: AR_MANAGER
            - call: "POST /ar/customers"
              payload: { name: "BU", credit_limit_cents: 1000000 }
              as: AR_MANAGER
              captures: { c_id: $.data.id }
            - call: "POST /ar/invoices"
              payload: { customer_id: "${c_id}", invoice_date: "2026-02-01T00:00:00Z", due_date: "2026-03-15T00:00:00Z", face_amount_cents: 5000 }
              as: AR_CLERK
            - call: "POST /ar/dunning-sequences"
              payload: { name: "S", steps: [ { min_days_overdue: 1, channel: "EMAIL", severity: 1 } ] }
              as: AR_MANAGER
              captures: { seq_id: $.data.id }
          trigger:
            - call: "POST /ar/dunning-runs"
              payload: { customer_id: "${c_id}", sequence_id: "${seq_id}" }
              as: COLLECTIONS_AGENT
            - call: "GET /ar/customers/${c_id}"
              payload: {}
              as: AR_MANAGER
              captures: { st: $.data.collection_stage }
          assert:
            - "Customer.${c_id}.collection_stage == DUNNING"

      - name: dispute_reject_compensation_restores_dunnable_balance
        claim_type: Compensation
        grounds: [state_machines.Dispute.UNDER_REVIEW_to_REJECTED, entities.Invoice.fields.disputed_amount_cents]
        distinguishing_aspect: "Rejecting a dispute compensates: invoice.disputed_amount_cents returns to 0 and exposure_cents rises back to full balance."
        test_recipe:
          setup: ["OPEN invoice 60000, partial dispute 15000 under review"]
          setup_api_calls:
            - call: "POST /ar/customers"
              payload: { name: "RJ", credit_limit_cents: 1000000 }
              as: AR_MANAGER
              captures: { c_id: $.data.id }
            - call: "POST /ar/invoices"
              payload: { customer_id: "${c_id}", invoice_date: "2026-01-01T00:00:00Z", due_date: "2026-02-01T00:00:00Z", face_amount_cents: 60000 }
              as: AR_CLERK
              captures: { inv_id: $.data.id }
            - call: "POST /ar/disputes"
              payload: { invoice_id: "${inv_id}", amount_cents: 15000, reason_code: "DUPLICATE" }
              as: COLLECTIONS_AGENT
              captures: { d_id: $.data.id }
            - call: "POST /ar/disputes/${d_id}/start-review"
              payload: {}
              as: AR_MANAGER
          trigger:
            - call: "POST /ar/disputes/${d_id}/reject"
              payload: {}
              as: AR_MANAGER
            - call: "GET /ar/invoices/${inv_id}"
              payload: {}
              as: AR_MANAGER
              captures: { disp: $.data.disputed_amount_cents }
            - call: "GET /ar/customers/${c_id}"
              payload: {}
              as: AR_MANAGER
              captures: { exp: $.data.exposure_cents }
          assert:
            - "Invoice.${inv_id}.disputed_amount_cents == 0"
            - "Customer.${c_id}.exposure_cents == 60000"

      - name: reverse_payment_reverts_partial_invoice_status
        claim_type: Cross-entity
        grounds: [state_machines.Payment.PARTIALLY_APPLIED_to_UNAPPLIED, entities.Invoice.fields.status]
        distinguishing_aspect: "Reversing the only application on a PARTIAL invoice reverts invoice.status back to OPEN and restores balance."
        test_recipe:
          setup: ["invoice 10000, 4000 applied -> PARTIAL"]
          setup_api_calls:
            - call: "POST /ar/customers"
              payload: { name: "RV", credit_limit_cents: 1000000 }
              as: AR_MANAGER
              captures: { c_id: $.data.id }
            - call: "POST /ar/invoices"
              payload: { customer_id: "${c_id}", invoice_date: "2026-01-01T00:00:00Z", due_date: "2026-02-01T00:00:00Z", face_amount_cents: 10000 }
              as: AR_CLERK
              captures: { inv_id: $.data.id }
            - call: "POST /ar/payments"
              payload: { customer_id: "${c_id}", amount_cents: 4000, received_at: "2026-03-01T00:00:00Z" }
              as: AR_CLERK
              captures: { pay_id: $.data.id }
            - call: "POST /ar/payments/${pay_id}/applications"
              payload: { invoice_id: "${inv_id}", applied_cents: 4000 }
              as: AR_CLERK
              captures: { app_id: $.data.id }
          trigger:
            - call: "POST /ar/payments/${pay_id}/applications/${app_id}/reverse"
              payload: {}
              as: AR_CLERK
            - call: "GET /ar/invoices/${inv_id}"
              payload: {}
              as: AR_MANAGER
              captures: { st: $.data.status, bal: $.data.balance_cents }
          assert:
            - "Invoice.${inv_id}.status == OPEN"
            - "Invoice.${inv_id}.balance_cents == 10000"

      - name: promise_cancel_on_non_active_returns_domain_error
        claim_type: invalid_transition
        grounds: ["validations[priority=18]", "errors[ERR_PROMISE_ALREADY_RESOLVED]", state_machines.PromiseToPay.ACTIVE_to_CANCELLED]
        distinguishing_aspect: "Cancelling an already-CANCELLED promise returns the domain-specific ERR_PROMISE_ALREADY_RESOLVED (409), not ERR_INVALID_STATE."
        test_recipe:
          setup: ["customer with one ACTIVE promise, then cancelled"]
          setup_api_calls:
            - call: "POST /ar/customers"
              payload: { name: "PC", credit_limit_cents: 1000000 }
              as: AR_MANAGER
              captures: { c_id: $.data.id, c_v: $.data.version }
            - call: "POST /ar/promises"
              payload: { customer_id: "${c_id}", promised_amount_cents: 5000, coverage_start: "2026-06-01T00:00:00Z", coverage_end: "2026-06-30T00:00:00Z", expected_customer_version: "${c_v}" }
              as: COLLECTIONS_AGENT
              captures: { p_id: $.data.id }
            - call: "POST /ar/promises/${p_id}/cancel"
              payload: {}
              as: COLLECTIONS_AGENT
          trigger:
            - call: "POST /ar/promises/${p_id}/cancel"
              payload: {}
              as: COLLECTIONS_AGENT
              captures: { err: $.data.error_id }
          assert:
            - "response.error_id == ERR_PROMISE_ALREADY_RESOLVED"

      - name: promise_kept_when_payment_covers_within_window
        claim_type: Valid Transition
        grounds: [state_machines.PromiseToPay.ACTIVE_to_KEPT, entities.PromiseToPay.fields.applied_payment_cents]
        distinguishing_aspect: "A promise whose covering payment meets the promised amount, evaluated after coverage_end, transitions to KEPT."
        test_recipe:
          setup: ["customer with one overdue invoice; an ACTIVE promise 5000 covering [2026-06-01,2026-06-15); a 5000 payment applied within window; clock advanced past coverage_end"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-05T00:00:00Z" }
              as: AR_MANAGER
            - call: "POST /ar/customers"
              payload: { name: "PK", credit_limit_cents: 1000000 }
              as: AR_MANAGER
              captures: { c_id: $.data.id }
            - call: "POST /ar/invoices"
              payload: { customer_id: "${c_id}", invoice_date: "2026-04-01T00:00:00Z", due_date: "2026-05-01T00:00:00Z", face_amount_cents: 5000 }
              as: AR_CLERK
