      - name: verifying_an_already_verified_award_a_second_time_is_refused
        claim_type: idempotency
        grounds:
          - state_machines.FundingSource.UNVERIFIED_to_VERIFIED
          - state_machines.FundingSource.VERIFIED_to_SUSPENDED
          - validations.priority_6_ERR_INVALID_STATE_TRANSITION
        distinguishing_aspect: "VERIFY is declared only from UNVERIFIED and SUSPENDED, so a repeat VERIFY on a VERIFIED award is not a silent no-op - it is ERR_INVALID_STATE_TRANSITION (409), and verified_at must keep its original stamp. The chain then proves the machine is not simply write-once: SUSPEND followed by VERIFY succeeds and re-stamps the verifier."
