  # ------------------------------------------------------- test-driving API
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server's logical clock. Before any call to this endpoint the logical clock reads exactly 2026-08-01T00:00:00Z; it never falls back to real wall-clock time. Every opened_at, approved_at, started_at, completed_at, executed_at, session_start, submitted_at, staled_at stamp and every window/aging comparison reads this clock."
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string }"
    side_effects: ["recomputes calculations.issue_severity_index and readiness_posture for every CxProject, because issue aging is clock-dependent"]

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "X-User-Role or X-User-ID header missing, empty, or naming an unknown role" }
  - { id: ERR_ROLE_NOT_PERMITTED, http: 403, condition: "The authenticated role is not listed for the endpoint in the 1.5 table" }
  - { id: ERR_VALIDATION, http: 400, condition: "Missing required body field, malformed type, undeclared enum member, out-of-range number, unparseable ISO 8601 datetime, or pagination limit/offset outside 1..100 / >= 0" }
  - { id: ERR_PROJECT_NOT_FOUND, http: 404, condition: "No CxProject with the referenced id" }
  - { id: ERR_REQUIREMENT_NOT_FOUND, http: 404, condition: "No OwnerRequirement with the referenced id" }
  - { id: ERR_PLAN_NOT_FOUND, http: 404, condition: "No CxPlan with the referenced id" }
  - { id: ERR_SUBMITTAL_NOT_FOUND, http: 404, condition: "No Submittal with the referenced id" }
  - { id: ERR_EQUIPMENT_NOT_FOUND, http: 404, condition: "No EquipmentUnit with the referenced id" }
  - { id: ERR_CHECKLIST_NOT_FOUND, http: 404, condition: "No PrefunctionalChecklist with the referenced id" }
  - { id: ERR_TEST_NOT_FOUND, http: 404, condition: "No FunctionalTest with the referenced id" }
  - { id: ERR_ISSUE_NOT_FOUND, http: 404, condition: "No Issue with the referenced id" }
  - { id: ERR_DEFERRED_TEST_NOT_FOUND, http: 404, condition: "No DeferredTest with the referenced id" }
  - { id: ERR_DELIVERABLE_NOT_FOUND, http: 404, condition: "No CloseoutDeliverable with the referenced id" }
  - { id: ERR_CREDIT_NOT_FOUND, http: 404, condition: "No CertificationCredit with the referenced id" }
  - { id: ERR_BASELINE_NOT_FOUND, http: 404, condition: "No EnergyBaseline with the referenced id" }
  - { id: ERR_PROJECT_SCOPE_MISMATCH, http: 409, condition: "Two entities named in one request resolve to different CxProject ids" }
  - { id: ERR_STALE_PROJECT_VERSION, http: 412, condition: "expected_project_version does not equal the current CxProject.version" }
  - { id: ERR_PROJECT_FROZEN, http: 409, condition: "CxProject.readiness_posture == FROZEN blocks phase advance, acceptance issuance, deliverable acceptance, seasonal scheduling and credit submission" }
  - { id: ERR_PHASE_NOT_ALLOWED, http: 409, condition: "The requested phase is not the single next phase, or the endpoint requires a phase the project is not in" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "The target resource's current status has no declared transition for the requested action" }
  - { id: ERR_EQUIPMENT_NOT_READY, http: 409, condition: "The EquipmentUnit's install_status or verification_status does not satisfy the operation's cross-entity precondition" }
  - { id: ERR_PLAN_NOT_APPROVED, http: 409, condition: "The project's newest CxPlan is not APPROVED" }
  - { id: ERR_PLAN_PIN_STALE, http: 409, condition: "The project's newest CxPlan has pin_stale == true because a pinned OwnerRequirement was revised" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "The acting X-User-ID equals the user id recorded on the preceding step of the same artifact" }
  - { id: ERR_RETEST_EVIDENCE_REQUIRED, http: 422, condition: "Closing a FUNCTIONAL issue of severity S1 or S2 without a closure_retest_id, or with one whose FunctionalTest.status != PASSED" }
  - { id: ERR_SAFETY_ITEM_FAILED, http: 422, condition: "Verifying a checklist that carries a safety-critical item with result == FAIL" }
  - { id: ERR_INVALID_WINDOW, http: 422, condition: "scheduled_end <= scheduled_start, or window_end <= window_start" }
  - { id: ERR_WITNESS_WINDOW_CONFLICT, http: 409, condition: "The buffered closed witness window collides with at least CxProject.witness_capacity occupied windows on the same project" }
  - { id: ERR_SEASONAL_WINDOW_CONFLICT, http: 409, condition: "The half-open seasonal window overlaps another PLANNED or BLOCKED window on the same EquipmentUnit" }
  - { id: ERR_OUTSIDE_SEASONAL_WINDOW, http: 409, condition: "The logical clock is outside [window_start, window_end) when executing a deferred test" }
  - { id: ERR_RETEST_SCOPE_MISMATCH, http: 422, condition: "closure_retest_id names a FunctionalTest whose equipment_id differs from the Issue's equipment_id" }
  - { id: ERR_REQUIREMENT_NOT_PINNED, http: 422, condition: "requirement_id is absent from the newest APPROVED CxPlan's pinned_requirement_ids" }
  - { id: ERR_EVIDENCE_REF_INVALID, http: 422, condition: "evidence_ref_id does not resolve to a row of the family evidence_type declares, or that row belongs to another project" }
  - { id: ERR_CHECKLIST_EMPTY, http: 422, condition: "Executing a checklist whose item_count is 0" }
  - { id: ERR_CHECKLIST_INCOMPLETE, http: 422, condition: "Executing a checklist that still has an item with result == PENDING" }
  - { id: ERR_DUPLICATE_ITEM_CODE, http: 422, condition: "Adding an item whose item_code already exists on the checklist" }
  - { id: ERR_ITEM_NOT_FOUND, http: 422, condition: "Recording a result against an item_code the checklist does not carry" }
  - { id: ERR_EVIDENCE_INSUFFICIENT, http: 422, condition: "fresh_evidence_count is below required_evidence_count at credit submission" }
  - { id: ERR_TRAINING_COVERAGE_INSUFFICIENT, http: 422, condition: "Accepting a TRAINING_SESSION whose coverage_ratio is below 0.80" }
  - { id: ERR_REVIEW_ROUNDS_EXCEEDED, http: 422, condition: "Resubmitting a submittal already at review_round 3" }
  - { id: ERR_RETRO_ONLY, http: 422, condition: "Creating an EnergyBaseline on a project whose project_type != RETRO_COMMISSIONING" }
  - { id: ERR_VARIANT_NOT_PERMITTED, http: 422, condition: "Certifying the DEEMED variant on a project whose certification_target == ENHANCED" }
  - { id: ERR_RETAINAGE_CAP_EXCEEDED, http: 422, condition: "The issue being logged would push retainage_withheld_cents above floor(contract_value_cents * 0.10)" }
  - { id: ERR_ACCEPTANCE_SCORE_TOO_LOW, http: 422, condition: "The FINAL variant of acceptance_completion_score is below 70.00 for SUBSTANTIAL or below 95.00 for FINAL acceptance" }
  - { id: ERR_OPEN_BLOCKING_ISSUES, http: 422, condition: "Issues remain open that the requested acceptance kind forbids" }

# =============================================================================
# 1.7 RBAC Matrix (segregation of duties)
# =============================================================================
roles:
  - name: PlatformAdmin
    description: "Platform operator of the commissioning software; opens engagements, registers equipment and drives the logical clock. Never signs off commissioning work."
    identity: opaque
    exclusive_operations:
      - "POST /cx-projects"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "POST /equipment-units (shared with CxAuthority)"
      - "every GET endpoint"

  - name: CxAuthority
    description: "The commissioning authority firm's agent. Reviews submittals, owns checklists, witnesses functional tests, runs the issue log, schedules seasonal work and assembles certification credit packages."
    identity: opaque
    exclusive_operations:
      - "POST /cx-projects/{id}/advance-phase"
      - "POST /cx-projects/{id}/run-seasonal-sweep"
      - "POST /cx-plans"
      - "POST /submittals/{id}/review"
      - "POST /prefunctional-checklists"
      - "POST /prefunctional-checklists/{id}/items"
      - "POST /prefunctional-checklists/{id}/verify"
      - "POST /prefunctional-checklists/{id}/reject"
      - "POST /functional-tests"
      - "POST /functional-tests/{id}/start"
      - "POST /functional-tests/{id}/record-result"
      - "POST /functional-tests/{id}/schedule-retest"
      - "POST /issues/{id}/verify-closure"
      - "POST /issues/{id}/reopen"
      - "POST /issues/{id}/void"
      - "POST /deferred-tests"
      - "POST /deferred-tests/{id}/execute"
      - "POST /closeout-deliverables/{id}/return"
      - "POST /certification-credits"
      - "POST /certification-credits/{id}/evidence"
      - "POST /certification-credits/{id}/submit"
      - "POST /energy-baselines"
      - "POST /energy-baselines/{id}/post-period"
      - "POST /energy-baselines/{id}/certify-savings"
    shared_operations:
      - "POST /equipment-units (shared with PlatformAdmin)"
      - "POST /issues (shared with Contractor)"
      - "POST /closeout-deliverables/{id}/accept (shared with OwnerRepresentative)"
      - "every GET endpoint"

  - name: Contractor
    description: "Installing contractor. Advances installation, records and executes pre-functional checklists, proposes corrective actions and delivers training and closeout documents. May never verify its own work: the executed_by_user_id of a checklist and the delivered_by_user_id of a deliverable are excluded from the corresponding verification step."
    identity: opaque
    exclusive_operations:
      - "POST /equipment-units/{id}/install-status"
      - "POST /prefunctional-checklists/{id}/record-item"
      - "POST /prefunctional-checklists/{id}/execute"
      - "POST /issues/{id}/propose-resolution"
    shared_operations:
      - "POST /issues (shared with CxAuthority)"
      - "POST /closeout-deliverables (shared with DesignTeam)"
      - "POST /closeout-deliverables/{id}/deliver (shared with DesignTeam)"
      - "every GET endpoint"

  - name: DesignTeam
    description: "Architect and engineer of record. Lodges and resubmits submittals and contributes systems-manual sections."
    identity: opaque
    exclusive_operations:
      - "POST /submittals"
      - "POST /submittals/{id}/resubmit"
    shared_operations:
      - "POST /closeout-deliverables (shared with Contractor)"
      - "POST /closeout-deliverables/{id}/deliver (shared with Contractor)"
      - "every GET endpoint"

  - name: OwnerRepresentative
    description: "The building owner's representative. Owns the Owner Project Requirements, approves the commissioning plan, defers issues to seasonal testing, adjudicates certification credits and issues acceptance."
    identity: opaque
    exclusive_operations:
      - "POST /owner-requirements"
      - "POST /owner-requirements/{id}/approve"
      - "POST /owner-requirements/{id}/revise"
      - "POST /cx-plans/{id}/approve"
      - "POST /issues/{id}/defer"
      - "POST /certification-credits/{id}/adjudicate"
      - "POST /cx-projects/{id}/issue-acceptance"
    shared_operations:
      - "POST /closeout-deliverables/{id}/accept (shared with CxAuthority)"
      - "every GET endpoint"
