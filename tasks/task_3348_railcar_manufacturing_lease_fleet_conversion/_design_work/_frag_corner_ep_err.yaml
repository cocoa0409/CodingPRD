            - call: "POST /api/v1/component-receipts"
              payload: { component_purchase_order_id: "${po_ws}", component_id: "${ws_id}", qty_received: 100, receipt_date: "2026-09-06" }
              as: SupplyChainCoordinator
              captures: { rc_ws: $.data.id }
            - call: "POST /api/v1/component-receipts/${rc_ws}/receive"
