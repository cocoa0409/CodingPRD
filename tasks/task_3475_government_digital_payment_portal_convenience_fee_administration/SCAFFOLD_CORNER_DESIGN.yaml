            - call: "GET /portal/payment-transactions"
              payload: { payer_id: "${payer_id}", funds_status: "AUTHORIZED" }
              as: PlatformAdmin
          assert:
            - "the VOIDED filter returns exactly 1 row: ${txn_id}"
            - "the AUTHORIZED filter returns exactly 1 row: ${txn_id2}"
            - "unfiltered list for the payer returns 2 rows in created_at ASC order"

  # ===========================================================================
  - section: errors
    instances:
      - name: err_duplicate_payer_email
        claim_type: violation_to_error
        grounds:
          - errors.ERR_DUPLICATE_PAYER_EMAIL
          - entities.Payer.fields.email
        distinguishing_aspect: "Email uniqueness is global across payers: the second registration with pat@example.com fails 409 while a different email succeeds."
        test_recipe:
