              as_user_id: "${fleet_id}"
              captures: { truck_id: $.data.id }
            - call: "POST /dealers"
              payload: { dealer_name: "B2 Freightliner", region: "SE", hourly_labor_rate_cents: 20000 }
              as: FleetManager
              as_user_id: "${fleet_id}"
              captures: { dealer_id: $.data.id }
            - call: "POST /dealers/${dealer_id}/bays"
              payload: { bay_code: "B1" }
