            - call: "POST /bakery-distribution/products"
              payload: { sku: "FLR-OCC-34", category: "FLOUR", allergen_class: "GLUTEN", shelf_life_days: 365, index_code: "NONE", list_price_cents_per_lb: 34, min_rotation_days: 0 }
              as: PricingController
              as_user_id: "pc_1"
              captures: { prod_c: $.data.id }
            - call: "POST /bakery-distribution/warehouse-zones"
              payload: { zone_code: "Z-GLU", allergen_class: "GLUTEN" }
              as: WarehouseOperator
              as_user_id: "wo_1"
              captures: { zone_glu: $.data.id }
