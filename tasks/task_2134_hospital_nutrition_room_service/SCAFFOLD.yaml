scenario: |
  desgin task harder than expert level.!!!! 2134. Hospital Food & Nutrition Room Service (hospital nutrition services):
  diet order intake & therapeutic diet rules, allergy/texture modification validation at order entry, on-demand meal
  ordering & delivery window, tray accuracy & temperature check, NPO status & missed-meal handling, nutrition consult &
  supplement ordering, patient satisfaction & meal-hold coordination with procedures, production forecasting & food cost

domain_name: hospital-nutrition-room-service
api_prefix: /nutrition

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: temporal_windowing
  complexity_layers: [optimistic_concurrency, cascading_side_effects, dual_variant_calculation, derived_field_reconciliation]

  entity_topology: graph
  # Peer entities linked by explicit foreign keys plus a self-referential supersede chain on DietOrder
  # (supersedes_diet_order_id) and cross-aggregate references (MealOrder -> DietOrder -> TherapeuticDietRule,
  # MealOrder -> MealPeriod -> Ward, SupplementOrder -> NutritionConsult -> MenuItem).

  state_machine_shape: parallel
  # MealOrder carries two independent state dimensions (fulfillment_status x qa_status) that advance on
  # separate triggers; DietOrder is cyclic (PENDING_COSIGN -> REVISION_REQUESTED -> PENDING_COSIGN, bounded
  # by MAX_REVISION_ROUNDS) and branching (submit forks to ACTIVE or PENDING_COSIGN on the cosign flag).

  relationship_patterns:
    - one_to_many
    - self_referential
    - cross_aggregate
    - polymorphic

  role_model: segregation_of_duties
  # The opaque X-User-ID that recorded the tray accuracy check may not record the temperature check on the
  # same tray; the X-User-ID that requested a nutrition consult may not sign it.

  consistency_model: immediate

difficulty_level: beyond_expert
# 12 entities / 9 state-machine tables over 8 entities / 10 calculations / 41 validations / 65 endpoints / 51 errors / 5 roles.

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Ward
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Human readable ward name" }
      - { name: code, type: string, source: input, description: "Ward short code", constraints: "unique across all Wards; 2-8 chars" }
      - { name: tray_line_capacity_per_window, type: integer, source: input, description: "Trays the ward tray line can plate in one service window; used only as the ROLLING_AVERAGE forecast fallback when no CLOSED history exists", constraints: ">= 1" }
      - { name: delivery_lead_minutes, type: integer, source: input, description: "Minutes between plating and expected bedside arrival", constraints: ">= 0" }
      - { name: temperature_probe_required, type: boolean, source: input, default: true, description: "When true a temperature check is mandatory before delivery for every MealOrder on this ward" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "Ward operational status", constraints: "ACTIVE | SUSPENDED" }
      - { name: active_patient_census, type: integer, source: computed, default: 0, description: "count(Patient where ward_id == this.id AND status == ADMITTED AND npo_status == NONE)" }

  - name: Patient
    parent: null
    common_fields: true
    fields:
      - { name: ward_id, type: string, source: input, description: "FK -> Ward.id; ward the patient occupies" }
      - { name: mrn, type: string, source: input, description: "Medical record number", constraints: "unique across all Patients" }
      - { name: full_name, type: string, source: input, description: "Patient name" }
      - { name: age_years, type: integer, source: input, description: "Age in whole years", constraints: "0..120" }
      - { name: allergen_codes, type: array, source: input, default: [], description: "Documented allergen codes, upper-snake strings such as PEANUT or MILK" }
      - { name: texture_level, type: enum, source: input, default: REGULAR, description: "Minimum texture modification the patient requires", constraints: "REGULAR | MINCED_MOIST | PUREED | LIQUIDISED" }
      - { name: liquid_level, type: enum, source: input, default: THIN, description: "Minimum liquid thickness the patient requires", constraints: "THIN | MILDLY_THICK | MODERATELY_THICK | EXTREMELY_THICK" }
      - { name: status, type: enum, source: system, default: ADMITTED, description: "Admission status", constraints: "ADMITTED | DISCHARGED" }
      - { name: npo_status, type: enum, source: computed, default: NONE, description: "Derived from the ProcedureHold in status ACTIVE for this patient; NONE when no such hold exists", constraints: "NONE | NPO_STRICT | NPO_CLEAR_LIQUIDS" }
      - { name: active_procedure_hold_id, type: string, source: computed, description: "Derived pointer to the ProcedureHold in status ACTIVE for this patient, or null; navigate with GET /nutrition/procedure-holds?patient_id=<id>" }
      - { name: active_diet_order_id, type: string, source: computed, description: "Derived pointer to the DietOrder in status ACTIVE for this patient, or null; navigate with GET /nutrition/diet-orders?patient_id=<id>" }
      - { name: missed_meal_count, type: integer, source: computed, default: 0, description: "Running count of MealOrders for this patient that entered fulfillment_status MISSED" }
      - { name: protein_deficit_g, type: number, source: computed, default: 0, description: "Accumulated total_protein_g of every MISSED MealOrder for this patient; 1 decimal place" }
      - { name: daily_supplement_cost_cents, type: integer, source: computed, default: 0, description: "sum(SupplementOrder.daily_cost_cents where patient_id == this.id AND status == ACTIVE)" }
      - { name: survey_count, type: integer, source: computed, default: 0, description: "count(SatisfactionSurvey where patient_id == this.id)" }
      - { name: satisfaction_score_avg, type: number, source: computed, description: "Mean of the already-rounded SatisfactionSurvey.composite_score values for this patient, 2 decimal places; null when survey_count == 0" }

  - name: TherapeuticDietRule
    parent: null
    common_fields: true
    fields:
      - { name: diet_code, type: string, source: input, description: "Therapeutic diet code", constraints: "unique across all TherapeuticDietRules" }
      - { name: display_name, type: string, source: input, description: "Human readable rule name" }
      - { name: max_sodium_mg_per_meal, type: integer, source: input, description: "Per-meal sodium ceiling in mg; null means this rule imposes no sodium ceiling", constraints: ">= 0 or null" }
      - { name: max_potassium_mg_per_meal, type: integer, source: input, description: "Per-meal potassium ceiling in mg; null means no ceiling", constraints: ">= 0 or null" }
      - { name: max_carb_g_per_meal, type: number, source: input, description: "Per-meal carbohydrate ceiling in g, 1 decimal; null means no ceiling", constraints: ">= 0 or null" }
      - { name: min_texture_level, type: enum, source: input, description: "Texture floor this rule imposes; null means none", constraints: "REGULAR | MINCED_MOIST | PUREED | LIQUIDISED | null" }
      - { name: min_liquid_level, type: enum, source: input, description: "Liquid thickness floor this rule imposes; null means none", constraints: "THIN | MILDLY_THICK | MODERATELY_THICK | EXTREMELY_THICK | null" }
      - { name: forbidden_tag_codes, type: array, source: input, default: [], description: "MenuItem tag codes this rule forbids, such as HIGH_FAT" }
      - { name: requires_dietitian_cosign, type: boolean, source: input, default: true, description: "When true a DietOrder carrying this rule must be cosigned by a Dietitian before it activates" }
      - { name: precedence_rank, type: integer, source: input, description: "Lower rank is clinically stronger; used only to order the forbidden_tag_codes union deterministically", constraints: "1..999" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "Rule availability", constraints: "ACTIVE | RETIRED" }

  - name: DietOrder
    parent: null
    common_fields: true
    fields:
      - { name: patient_id, type: string, source: input, description: "FK -> Patient.id; patient this diet order governs" }
      - { name: primary_diet_rule_id, type: string, source: input, description: "FK -> TherapeuticDietRule.id; mandatory therapeutic rule" }
      - { name: secondary_diet_rule_id, type: string, source: input, description: "FK -> TherapeuticDietRule.id; optional second therapeutic rule layered on the primary; null when absent" }
      - { name: supersedes_diet_order_id, type: string, source: system, description: "FK -> DietOrder.id; the DietOrder this one displaced at activation time, or null" }
      - { name: superseded_by_diet_order_id, type: string, source: system, description: "Derived inverse pointer to the DietOrder that displaced this one, or null; navigate with GET /nutrition/diet-orders?supersedes_diet_order_id=<id>" }
      - { name: ordering_physician_user_id, type: string, source: system, description: "Opaque X-User-ID of the Physician who created the order; audit stamp, roles are opaque per the RBAC matrix" }
      - { name: cosigned_by_user_id, type: string, source: system, description: "Opaque X-User-ID of the Dietitian who cosigned, null when the order auto-activated or is not yet cosigned" }
      - { name: texture_level, type: enum, source: input, default: REGULAR, description: "Texture the prescriber requests", constraints: "REGULAR | MINCED_MOIST | PUREED | LIQUIDISED" }
      - { name: liquid_level, type: enum, source: input, default: THIN, description: "Liquid thickness the prescriber requests", constraints: "THIN | MILDLY_THICK | MODERATELY_THICK | EXTREMELY_THICK" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "Diet order lifecycle", constraints: "DRAFT | PENDING_COSIGN | REVISION_REQUESTED | ACTIVE | SUPERSEDED | DISCONTINUED" }
      - { name: revision_round, type: integer, source: computed, default: 0, description: "Number of completed request-revision rounds; bounded by MAX_REVISION_ROUNDS" }
      - { name: revision_note, type: string, source: system, description: "Free text supplied on the most recent request-revision, or null" }
      - { name: effective_from, type: datetime, source: system, description: "Logical-clock instant at which this order became ACTIVE; null before activation" }
      - { name: effective_sodium_cap_mg, type: integer, source: computed, description: "Per-meal sodium ceiling after layering both rules and the NPO override; null means uncapped" }
      - { name: effective_potassium_cap_mg, type: integer, source: computed, description: "Per-meal potassium ceiling after layering both rules; null means uncapped" }
      - { name: effective_carb_cap_g, type: number, source: computed, description: "Per-meal carbohydrate ceiling after layering both rules and the NPO override, 1 decimal; null means uncapped" }
      - { name: effective_texture_level, type: enum, source: computed, description: "Most restrictive texture across order, patient and rules, then the NPO override", constraints: "REGULAR | MINCED_MOIST | PUREED | LIQUIDISED" }
      - { name: effective_liquid_level, type: enum, source: computed, description: "Most restrictive liquid thickness across order, patient and rules, except that NPO_CLEAR_LIQUIDS pins it to THIN", constraints: "THIN | MILDLY_THICK | MODERATELY_THICK | EXTREMELY_THICK" }
      - { name: forbidden_tag_codes_effective, type: array, source: computed, default: [], description: "Union of both rules forbidden_tag_codes, de-duplicated, ordered by owning rule precedence_rank ASC then tag code ASC" }
      - { name: linked_meal_order_count, type: integer, source: computed, default: 0, description: "count(MealOrder where diet_order_id == this.id); every increment mutates this row and therefore bumps version" }

  - name: MealPeriod
    parent: null
    common_fields: true
    fields:
      - { name: ward_id, type: string, source: input, description: "FK -> Ward.id; ward served by this period" }
      - { name: period_code, type: enum, source: input, description: "Meal service slot", constraints: "BREAKFAST | LUNCH | DINNER | LATE_SNACK" }
      - { name: service_date, type: string, source: input, description: "Service date as YYYY-MM-DD", constraints: "ISO calendar date" }
      - { name: order_cutoff_at, type: datetime, source: input, description: "Last logical-clock instant at which a MealOrder may be created for this period; must be strictly before window_start_at" }
      - { name: window_start_at, type: datetime, source: input, description: "Inclusive start of the bedside delivery window" }
      - { name: window_end_at, type: datetime, source: input, description: "Exclusive end of the bedside delivery window for compliance scoring; treated as INCLUSIVE for ward window-overlap detection" }
      - { name: production_capacity_trays, type: integer, source: input, description: "Hard ceiling on committed_tray_count for this period", constraints: ">= 1" }
      - { name: cost_ceiling_cents, type: integer, source: input, description: "Optional ceiling on committed_food_cost_cents; null means no ceiling", constraints: ">= 0 or null" }
      - { name: status, type: enum, source: system, default: PLANNED, description: "Period lifecycle", constraints: "PLANNED | FORECAST_LOCKED | IN_SERVICE | CLOSED" }
      - { name: forecast_variant, type: enum, source: system, description: "Variant pinned at forecast lock time; null before lock", constraints: "ROLLING_AVERAGE | CENSUS_BASED | null" }
      - { name: forecast_tray_count, type: integer, source: computed, description: "Tray count produced by the pinned forecast variant; null before lock" }
      - { name: forecast_cost_cents, type: integer, source: computed, description: "forecast_tray_count * AVERAGE_TRAY_COST_CENTS; null before lock" }
      - { name: forecast_variance_pct, type: number, source: computed, description: "Signed percentage variance of committed_tray_count against forecast_tray_count, 2 decimals; null before lock and null when forecast_tray_count == 0" }
      - { name: locked_at, type: datetime, source: system, description: "Logical-clock instant of forecast lock; null before lock" }
      - { name: committed_tray_count, type: integer, source: computed, default: 0, description: "count(MealOrder where meal_period_id == this.id AND fulfillment_status IN {VALIDATED, IN_PRODUCTION, PLATED, DELIVERED})" }
      - { name: committed_food_cost_cents, type: integer, source: computed, default: 0, description: "sum(MealOrder.food_cost_cents where meal_period_id == this.id AND fulfillment_status IN {VALIDATED, IN_PRODUCTION, PLATED, DELIVERED})" }
      - { name: delivered_tray_count, type: integer, source: computed, default: 0, description: "count(MealOrder where meal_period_id == this.id AND fulfillment_status == DELIVERED)" }
      - { name: period_overhead_cents, type: integer, source: computed, default: 0, description: "Overhead component of the period cost rollup, recomputed whenever committed_food_cost_cents changes" }
      - { name: period_bulk_discount_cents, type: integer, source: computed, default: 0, description: "Bulk discount component of the period cost rollup" }
      - { name: period_total_cost_cents, type: integer, source: computed, default: 0, description: "committed_food_cost_cents + period_overhead_cents - period_bulk_discount_cents" }

  - name: MenuItem
    parent: null
    common_fields: true
    fields:
      - { name: item_code, type: string, source: input, description: "Menu item code", constraints: "unique across all MenuItems" }
      - { name: display_name, type: string, source: input, description: "Menu item name" }
      - { name: sodium_mg, type: integer, source: input, description: "Sodium per unit in mg", constraints: ">= 0" }
      - { name: potassium_mg, type: integer, source: input, description: "Potassium per unit in mg", constraints: ">= 0" }
      - { name: carb_g, type: number, source: input, description: "Carbohydrate per unit in g, 1 decimal", constraints: ">= 0" }
      - { name: protein_g, type: number, source: input, description: "Protein per unit in g, 1 decimal", constraints: ">= 0" }
      - { name: unit_cost_cents, type: integer, source: input, description: "Raw food cost per unit in cents before waste factor and texture surcharge", constraints: ">= 0" }
      - { name: texture_level, type: enum, source: input, description: "Texture this item is prepared to", constraints: "REGULAR | MINCED_MOIST | PUREED | LIQUIDISED" }
      - { name: liquid_level, type: enum, source: input, description: "Thickness of the item when it is a liquid; null for non-liquid items", constraints: "THIN | MILDLY_THICK | MODERATELY_THICK | EXTREMELY_THICK | null" }
      - { name: service_temp_class, type: enum, source: input, description: "Temperature class that decides which probe reading the tray check requires", constraints: "HOT | COLD | AMBIENT" }
      - { name: allergen_codes, type: array, source: input, default: [], description: "Allergen codes contained in this item" }
      - { name: tag_codes, type: array, source: input, default: [], description: "Dietary tag codes such as HIGH_FAT or FRIED" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "Availability on the menu", constraints: "ACTIVE | DISCONTINUED" }

  - name: MealOrder
    parent: null
    common_fields: true
    fields:
      - { name: patient_id, type: string, source: input, description: "FK -> Patient.id; patient the tray is for" }
      - { name: meal_period_id, type: string, source: input, description: "FK -> MealPeriod.id; service period the tray belongs to" }
      - { name: diet_order_id, type: string, source: input, description: "FK -> DietOrder.id; diet order this tray is validated against; re-pinned when the order is superseded" }
      - { name: pinned_diet_order_version, type: integer, source: system, description: "DietOrder.version observed when the tray was pinned to that diet order" }
      - { name: placed_by_user_id, type: string, source: system, description: "Opaque X-User-ID of the DietClerk who created the order; audit stamp" }
      - { name: fulfillment_status, type: enum, source: system, default: PENDING_VALIDATION, description: "Production and delivery dimension", constraints: "PENDING_VALIDATION | VALIDATED | IN_PRODUCTION | PLATED | DELIVERED | CANCELLED | MISSED" }
      - { name: qa_status, type: enum, source: system, default: NOT_CHECKED, description: "Tray quality-assurance dimension, advanced independently of fulfillment_status", constraints: "NOT_CHECKED | ACCURACY_PASSED | ACCURACY_FAILED | TEMP_PASSED | TEMP_FAILED" }
      - { name: revalidation_required, type: boolean, source: system, default: false, description: "Set true when a cascade reverted this tray to PENDING_VALIDATION because its diet order was superseded" }
      - { name: effective_texture_level, type: enum, source: computed, description: "Snapshot of the pinned DietOrder.effective_texture_level, refreshed on every re-pin and on every validate", constraints: "REGULAR | MINCED_MOIST | PUREED | LIQUIDISED" }
      - { name: effective_liquid_level, type: enum, source: computed, description: "Snapshot of the pinned DietOrder.effective_liquid_level, refreshed on every re-pin and on every validate", constraints: "THIN | MILDLY_THICK | MODERATELY_THICK | EXTREMELY_THICK" }
      - { name: total_sodium_mg, type: integer, source: computed, default: 0, description: "Sum over lines of effective MenuItem.sodium_mg * quantity" }
      - { name: total_potassium_mg, type: integer, source: computed, default: 0, description: "Sum over lines of effective MenuItem.potassium_mg * quantity" }
      - { name: total_carb_g, type: number, source: computed, default: 0, description: "Sum over lines of effective MenuItem.carb_g * quantity, 1 decimal" }
      - { name: total_protein_g, type: number, source: computed, default: 0, description: "Sum over lines of effective MenuItem.protein_g * quantity, 1 decimal" }
      - { name: food_cost_cents, type: integer, source: computed, default: 0, description: "Sum of the per-line rounded MealOrderLine.line_cost_cents values" }
      - { name: requires_hot_probe, type: boolean, source: computed, default: false, description: "True when at least one line resolves to a MenuItem with service_temp_class == HOT" }
      - { name: requires_cold_probe, type: boolean, source: computed, default: false, description: "True when at least one line resolves to a MenuItem with service_temp_class == COLD" }
      - { name: hot_probe_celsius, type: number, source: system, description: "Most recent hot probe reading in Celsius, 1 decimal; null before any temperature check" }
      - { name: cold_probe_celsius, type: number, source: system, description: "Most recent cold probe reading in Celsius, 1 decimal; null before any temperature check" }
      - { name: accuracy_retry_count, type: integer, source: computed, default: 0, description: "Number of accuracy checks that ended in ACCURACY_FAILED on this tray" }
      - { name: temperature_retry_count, type: integer, source: computed, default: 0, description: "Number of temperature checks that ended in TEMP_FAILED on this tray" }
      - { name: accuracy_checked_by_user_id, type: string, source: system, description: "Opaque X-User-ID that recorded the most recent accuracy check; audit stamp used by the segregation-of-duties check" }
      - { name: temperature_checked_by_user_id, type: string, source: system, description: "Opaque X-User-ID that recorded the most recent temperature check; audit stamp" }
      - { name: delivered_at, type: datetime, source: system, description: "Logical-clock instant of bedside delivery; null until DELIVERED" }
      - { name: delivery_window_compliance, type: enum, source: computed, description: "Position of delivered_at against the period window; null until DELIVERED", constraints: "EARLY | ON_TIME | LATE | null" }
      - { name: service_compliance_score, type: integer, source: computed, description: "Tray service score in 0..100; null until DELIVERED" }
      - { name: missed_reason, type: enum, source: system, description: "Why the tray was recorded MISSED; null otherwise", constraints: "NPO_HOLD | PERIOD_CLOSED | null" }

  - name: MealOrderLine
    parent: MealOrder
    common_fields: true
    fields:
      - { name: meal_order_id, type: string, source: system, description: "FK -> MealOrder.id; owning tray" }
      - { name: menu_item_id, type: string, source: input, description: "FK -> MenuItem.id; item currently on the tray for this line" }
      - { name: substituted_from_menu_item_id, type: string, source: system, description: "FK -> MenuItem.id; item this line originally carried before substitution, null when never substituted" }
      - { name: quantity, type: integer, source: input, description: "Units of the item on the tray", constraints: "1..10" }
      - { name: line_status, type: enum, source: system, default: REQUESTED, description: "Line provenance", constraints: "REQUESTED | SUBSTITUTED" }
      - { name: substitution_reason, type: string, source: system, description: "Free text captured at substitution, null otherwise" }
      - { name: line_cost_cents, type: integer, source: computed, default: 0, description: "ROUND_HALF_UP((menu_item.unit_cost_cents * quantity + texture surcharge * quantity) * WASTE_FACTOR), rounded at the line" }

  - name: ProcedureHold
    parent: null
    common_fields: true
    fields:
      - { name: patient_id, type: string, source: input, description: "FK -> Patient.id; patient whose intake is held" }
      - { name: procedure_code, type: string, source: input, description: "Procedure identifier that motivates the hold" }
      - { name: npo_kind, type: enum, source: input, description: "Nil-per-os severity the hold imposes while ACTIVE", constraints: "NPO_STRICT | NPO_CLEAR_LIQUIDS" }
      - { name: hold_start_at, type: datetime, source: input, description: "Inclusive start of the clinical hold" }
      - { name: hold_end_at, type: datetime, source: input, description: "Exclusive end of the clinical hold; must be strictly after hold_start_at" }
      - { name: buffer_before_minutes, type: integer, source: input, default: 0, description: "Minutes of protected time before hold_start_at", constraints: "0..720" }
      - { name: buffer_after_minutes, type: integer, source: input, default: 0, description: "Minutes of protected time after hold_end_at", constraints: "0..720" }
      - { name: buffered_start_at, type: datetime, source: computed, description: "hold_start_at minus buffer_before_minutes" }
      - { name: buffered_end_at, type: datetime, source: computed, description: "hold_end_at plus buffer_after_minutes" }
      - { name: status, type: enum, source: system, default: SCHEDULED, description: "Hold lifecycle", constraints: "SCHEDULED | ACTIVE | RELEASED | CANCELLED" }
      - { name: requested_by_user_id, type: string, source: system, description: "Opaque X-User-ID of the Physician who booked the hold; audit stamp" }
      - { name: released_at, type: datetime, source: system, description: "Logical-clock instant of release; null unless RELEASED" }
      - { name: missed_meal_order_count, type: integer, source: computed, default: 0, description: "Number of MealOrders this hold pushed into MISSED when it activated" }

  - name: NutritionConsult
    parent: null
    common_fields: true
    fields:
      - { name: patient_id, type: string, source: input, description: "FK -> Patient.id; patient under review" }
      - { name: acuity, type: enum, source: input, default: ROUTINE, description: "Turnaround class driving due_at", constraints: "ROUTINE | URGENT" }
      - { name: reason_code, type: string, source: input, description: "Why the consult was raised" }
      - { name: requested_by_user_id, type: string, source: system, description: "Opaque X-User-ID that raised the consult, or the literal string SYSTEM for auto-generated consults; audit stamp used by the segregation-of-duties check at sign time" }
      - { name: assigned_dietitian_user_id, type: string, source: system, description: "Opaque X-User-ID the consult is assigned to; null before assignment" }
      - { name: auto_generated, type: boolean, source: computed, default: false, description: "True when the missed-meal cascade created this consult rather than a human" }
      - { name: status, type: enum, source: system, default: REQUESTED, description: "Consult lifecycle", constraints: "REQUESTED | ASSIGNED | ASSESSED | SIGNED | CANCELLED" }
      - { name: assessment_variant, type: enum, source: system, description: "Scoring variant chosen at assessment; null before assessment", constraints: "SCREENING | COMPREHENSIVE | null" }
      - { name: weight_loss_pct, type: number, source: system, description: "Unintentional weight loss percentage captured at assessment; null before" }
      - { name: intake_pct, type: number, source: system, description: "Percentage of estimated energy needs met, captured at assessment; null before" }
      - { name: bmi, type: number, source: system, description: "Body mass index captured at assessment; null before" }
      - { name: albumin_g_dl, type: number, source: system, description: "Serum albumin in g/dL; required only by the COMPREHENSIVE variant" }
      - { name: malnutrition_risk_score, type: number, source: computed, description: "Weighted risk score in 0..100, 2 decimals; null before assessment" }
      - { name: risk_tier, type: enum, source: computed, description: "Tier derived from malnutrition_risk_score; null before assessment", constraints: "LOW | MODERATE | HIGH | null" }
      - { name: recommended_supplement_item_id, type: string, source: input, description: "FK -> MenuItem.id; oral supplement the dietitian recommends, null when none" }
      - { name: signed_by_user_id, type: string, source: system, description: "Opaque X-User-ID that signed the consult; audit stamp" }
      - { name: due_at, type: datetime, source: computed, description: "created_at plus CONSULT_URGENT_SLA_HOURS for URGENT or CONSULT_ROUTINE_SLA_HOURS for ROUTINE" }
      - { name: is_overdue, type: boolean, source: computed, default: false, description: "True when the logical clock is at or past due_at and status is not SIGNED or CANCELLED" }
      - { name: linked_supplement_order_count, type: integer, source: computed, default: 0, description: "count(SupplementOrder where consult_id == this.id); every increment mutates this row and therefore bumps version" }

  - name: SupplementOrder
    parent: null
    common_fields: true
    fields:
      - { name: consult_id, type: string, source: input, description: "FK -> NutritionConsult.id; consult that justifies the supplement" }
      - { name: patient_id, type: string, source: system, description: "FK -> Patient.id; copied from the consult at creation" }
      - { name: menu_item_id, type: string, source: input, description: "FK -> MenuItem.id; supplement product" }
      - { name: doses_per_day, type: integer, source: input, description: "Doses dispensed per calendar day", constraints: "1..6" }
      - { name: status, type: enum, source: system, default: PENDING, description: "Supplement lifecycle", constraints: "PENDING | ACTIVE | CANCELLED" }
      - { name: daily_cost_cents, type: integer, source: computed, default: 0, description: "menu_item.unit_cost_cents * doses_per_day" }
      - { name: ordered_by_user_id, type: string, source: system, description: "Opaque X-User-ID of the Dietitian who created the supplement order; audit stamp" }
      - { name: activated_at, type: datetime, source: system, description: "Logical-clock instant of activation; null before" }
      - { name: cancelled_at, type: datetime, source: system, description: "Logical-clock instant of cancellation; null unless CANCELLED" }

  - name: SatisfactionSurvey
    parent: MealOrder
    common_fields: false
    fields:
      - { name: meal_order_id, type: string, source: input, description: "FK -> MealOrder.id; tray being rated; at most one survey per tray" }
      - { name: patient_id, type: string, source: system, description: "FK -> Patient.id; copied from the tray at creation" }
      - { name: taste_score, type: integer, source: input, description: "Taste rating", constraints: "1..5" }
      - { name: temperature_score, type: integer, source: input, description: "Serving temperature rating", constraints: "1..5" }
      - { name: accuracy_score, type: integer, source: input, description: "Tray accuracy rating", constraints: "1..5" }
      - { name: comment, type: string, source: input, description: "Optional free text" }
      - { name: composite_score, type: number, source: computed, description: "Weighted composite of the three ratings, 2 decimals" }

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Ward
    state_field: status
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "PATCH /nutrition/wards/{id} with status = SUSPENDED"
        actor: NutritionManager
        preconditions: ["ward.status == ACTIVE"]
        side_effects: ["increments Ward.version by 1", "no MealPeriod may afterwards move PLANNED -> FORECAST_LOCKED for this ward while status == SUSPENDED"]
      - from: SUSPENDED
        to: ACTIVE
        trigger: "PATCH /nutrition/wards/{id} with status = ACTIVE"
        actor: NutritionManager
        preconditions: ["ward.status == SUSPENDED"]
        side_effects: ["increments Ward.version by 1"]

  - entity: Patient
    state_field: status
    initial_state: ADMITTED
    terminal_states: [DISCHARGED]
    transitions:
      - from: ADMITTED
        to: DISCHARGED
        trigger: "POST /nutrition/patients/{id}/discharge"
        actor: DietClerk
        preconditions: ["patient.status == ADMITTED"]
        side_effects:
          - "sets Patient.status = DISCHARGED and increments Patient.version by 1"
          - "cascade level 1: every MealOrder with patient_id == this patient and fulfillment_status IN {PENDING_VALIDATION, VALIDATED, IN_PRODUCTION, PLATED} moves to fulfillment_status CANCELLED"
          - "cascade level 2: because each of those trays left a committed status, its MealPeriod recomputes committed_tray_count and committed_food_cost_cents, then recomputes period_overhead_cents, period_bulk_discount_cents and period_total_cost_cents via meal_period_cost_rollup"
          - "cascade level 3: because committed_tray_count changed, any MealPeriod already in status FORECAST_LOCKED or IN_SERVICE recomputes forecast_variance_pct"
          - "every ProcedureHold for this patient with status == SCHEDULED moves to CANCELLED"
          - "the DietOrder for this patient with status == ACTIVE, if any, moves to DISCONTINUED and Patient.active_diet_order_id becomes null"
        note: "Trays already DELIVERED, CANCELLED or MISSED are untouched by the cascade."

  - entity: DietOrder
    state_field: status
    initial_state: DRAFT
    terminal_states: [SUPERSEDED, DISCONTINUED]
    transitions:
      - from: DRAFT
        to: PENDING_COSIGN
        trigger: "POST /nutrition/diet-orders/{id}/submit when cosign is required"
        actor: Physician
        preconditions:
          - "diet_order.status == DRAFT"
          - "patient.status == ADMITTED"
          - "primary rule status == ACTIVE and, when present, secondary rule status == ACTIVE"
          - "primary_diet_rule.requires_dietitian_cosign == true OR (secondary rule present AND secondary_diet_rule.requires_dietitian_cosign == true)"
        side_effects: ["recomputes the effective_* envelope via effective_diet_envelope", "increments DietOrder.version by 1"]
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /nutrition/diet-orders/{id}/submit when no referenced rule requires cosign"
        actor: Physician
        preconditions:
          - "diet_order.status == DRAFT"
          - "patient.status == ADMITTED"
          - "primary rule status == ACTIVE and, when present, secondary rule status == ACTIVE"
          - "primary_diet_rule.requires_dietitian_cosign == false AND (secondary rule absent OR secondary_diet_rule.requires_dietitian_cosign == false)"
        side_effects:
          - "recomputes the effective_* envelope via effective_diet_envelope"
          - "sets effective_from = logical clock, cosigned_by_user_id = null"
          - "runs the activation cascade described on the PENDING_COSIGN -> ACTIVE transition"
          - "increments DietOrder.version by 1"
        note: "Conditional branch: the same trigger forks to PENDING_COSIGN or to ACTIVE purely on the requires_dietitian_cosign flags of the referenced rules."
      - from: PENDING_COSIGN
        to: REVISION_REQUESTED
        trigger: "POST /nutrition/diet-orders/{id}/request-revision"
        actor: Dietitian
        preconditions: ["diet_order.status == PENDING_COSIGN", "diet_order.revision_round < MAX_REVISION_ROUNDS"]
        side_effects: ["increments revision_round by 1", "stores revision_note", "increments DietOrder.version by 1"]
      - from: REVISION_REQUESTED
        to: PENDING_COSIGN
        trigger: "POST /nutrition/diet-orders/{id}/submit"
        actor: Physician
        preconditions: ["diet_order.status == REVISION_REQUESTED", "patient.status == ADMITTED", "referenced rule statuses == ACTIVE"]
        side_effects: ["recomputes the effective_* envelope via effective_diet_envelope", "increments DietOrder.version by 1"]
        note: "Closes the revision cycle PENDING_COSIGN -> REVISION_REQUESTED -> PENDING_COSIGN; the cycle terminates when revision_round reaches MAX_REVISION_ROUNDS."
      - from: PENDING_COSIGN
        to: ACTIVE
        trigger: "POST /nutrition/diet-orders/{id}/cosign"
        actor: Dietitian
        preconditions:
          - "diet_order.status == PENDING_COSIGN"
          - "patient.status == ADMITTED"
          - "X-User-ID != diet_order.ordering_physician_user_id"
        side_effects:
          - "sets cosigned_by_user_id = X-User-ID, effective_from = logical clock, recomputes the effective_* envelope"
          - "sets Patient.active_diet_order_id = this order id"
          - "cascade level 1: the patient's prior DietOrder with status == ACTIVE, if any, moves ACTIVE -> SUPERSEDED and records superseded_by_diet_order_id = this order id, while this order records supersedes_diet_order_id = that prior order id"
          - "cascade level 2: because the prior order became SUPERSEDED, every MealOrder with diet_order_id == prior order id and fulfillment_status IN {PENDING_VALIDATION, VALIDATED} is re-pinned to this order (diet_order_id and pinned_diet_order_version updated), fulfillment_status forced to PENDING_VALIDATION and revalidation_required set true"
          - "cascade level 3: because each re-pinned tray that had been VALIDATED left a committed status, its MealPeriod decrements committed_tray_count and subtracts that tray's food_cost_cents from committed_food_cost_cents"
          - "cascade level 4: because committed_food_cost_cents changed, that MealPeriod recomputes period_overhead_cents, period_bulk_discount_cents and period_total_cost_cents via meal_period_cost_rollup, and recomputes forecast_variance_pct when forecast_tray_count is not null and non-zero"
          - "increments DietOrder.version by 1 on this order and on the superseded order"
      - from: ACTIVE
        to: DISCONTINUED
        trigger: "POST /nutrition/diet-orders/{id}/discontinue"
        actor: Physician
        preconditions: ["diet_order.status == ACTIVE"]
        side_effects: ["sets Patient.active_diet_order_id = null", "every MealOrder pinned to this order with fulfillment_status IN {PENDING_VALIDATION, VALIDATED} sets revalidation_required = true", "increments DietOrder.version by 1"]
      - from: PENDING_COSIGN
        to: DISCONTINUED
        trigger: "POST /nutrition/diet-orders/{id}/discontinue"
        actor: Physician
        preconditions: ["diet_order.status == PENDING_COSIGN"]
        side_effects: ["increments DietOrder.version by 1"]
      - from: ACTIVE
        to: SUPERSEDED
        trigger: "system, during the activation cascade of a newer DietOrder for the same patient"
        actor: system
        preconditions: ["diet_order.status == ACTIVE", "the newer order reached ACTIVE for the same patient_id"]
        side_effects: ["records superseded_by_diet_order_id", "drives cascade levels 2 to 4 described on PENDING_COSIGN -> ACTIVE", "increments DietOrder.version by 1"]

  - entity: MealPeriod
    state_field: status
    initial_state: PLANNED
    terminal_states: [CLOSED]
    transitions:
      - from: PLANNED
        to: FORECAST_LOCKED
        trigger: "POST /nutrition/meal-periods/{id}/lock-forecast"
        actor: NutritionManager
        preconditions: ["meal_period.status == PLANNED", "ward.status == ACTIVE"]
        side_effects:
          - "pins forecast_variant from the request body"
          - "computes forecast_tray_count via production_forecast_trays and forecast_cost_cents = forecast_tray_count * AVERAGE_TRAY_COST_CENTS"
          - "computes forecast_variance_pct via forecast_variance, or leaves it null when forecast_tray_count == 0"
          - "sets locked_at = logical clock"
          - "increments MealPeriod.version by 1"
      - from: FORECAST_LOCKED
        to: IN_SERVICE
        trigger: "POST /nutrition/meal-periods/{id}/open-service"
        actor: NutritionManager
        preconditions: ["meal_period.status == FORECAST_LOCKED", "ward.status == ACTIVE"]
        side_effects: ["increments MealPeriod.version by 1"]
      - from: IN_SERVICE
        to: CLOSED
        trigger: "POST /nutrition/meal-periods/{id}/close"
        actor: NutritionManager
        preconditions: ["meal_period.status == IN_SERVICE"]
        side_effects:
          - "cascade level 1: every MealOrder in this period with fulfillment_status IN {PENDING_VALIDATION, VALIDATED, IN_PRODUCTION, PLATED} moves to MISSED with missed_reason = PERIOD_CLOSED"
          - "cascade level 2: because each tray entered MISSED, Patient.missed_meal_count increments by 1 and Patient.protein_deficit_g increases by that tray's total_protein_g"
          - "cascade level 3: because missed_meal_count crossed MISSED_MEAL_CONSULT_THRESHOLD, an auto-generated NutritionConsult is created per missed_meal_consult_escalation"
          - "recomputes committed_tray_count, committed_food_cost_cents, the cost rollup and forecast_variance_pct"
          - "increments MealPeriod.version by 1"

  - entity: MealOrder
    state_field: fulfillment_status
    initial_state: PENDING_VALIDATION
    terminal_states: [DELIVERED, CANCELLED, MISSED]
    transitions:
      - from: PENDING_VALIDATION
        to: VALIDATED
        trigger: "POST /nutrition/meal-orders/{id}/validate"
        actor: DietClerk
        preconditions:
          - "meal_order.fulfillment_status == PENDING_VALIDATION"
          - "meal_period.status IN {PLANNED, FORECAST_LOCKED, IN_SERVICE}"
          - "patient.status == ADMITTED"
          - "pinned DietOrder.status == ACTIVE"
          - "meal_order.pinned_diet_order_version == diet_order.version"
          - "patient.npo_status == NONE"
          - "every line passes the allergen, texture, liquid, forbidden-tag and menu-item-status checks"
          - "the recomputed nutrient totals fit inside the pinned diet order effective caps"
          - "meal_period.committed_tray_count + 1 <= meal_period.production_capacity_trays"
          - "when meal_period.cost_ceiling_cents is not null: meal_period.committed_food_cost_cents + meal_order.food_cost_cents <= meal_period.cost_ceiling_cents"
        side_effects:
          - "refreshes effective_texture_level, effective_liquid_level, the four nutrient totals, every line_cost_cents and food_cost_cents"
          - "sets revalidation_required = false"
          - "increments MealPeriod.committed_tray_count by 1 and adds food_cost_cents to MealPeriod.committed_food_cost_cents"
          - "recomputes MealPeriod period_overhead_cents, period_bulk_discount_cents and period_total_cost_cents via meal_period_cost_rollup"
          - "recomputes MealPeriod.forecast_variance_pct when forecast_tray_count is not null and non-zero"
          - "increments MealOrder.version by 1 and MealPeriod.version by 1"
      - from: VALIDATED
        to: IN_PRODUCTION
        trigger: "POST /nutrition/meal-orders/{id}/start-production"
        actor: TrayAide
        preconditions: ["meal_order.fulfillment_status == VALIDATED", "meal_period.status == IN_SERVICE", "meal_order.revalidation_required == false"]
        side_effects: ["increments MealOrder.version by 1"]
      - from: IN_PRODUCTION
        to: PLATED
        trigger: "POST /nutrition/meal-orders/{id}/plate"
        actor: TrayAide
        preconditions: ["meal_order.fulfillment_status == IN_PRODUCTION"]
        side_effects: ["increments MealOrder.version by 1"]
      - from: PLATED
        to: DELIVERED
        trigger: "POST /nutrition/meal-orders/{id}/deliver"
        actor: TrayAide
        preconditions:
          - "meal_order.fulfillment_status == PLATED"
          - "meal_order.qa_status == TEMP_PASSED"
          - "patient.npo_status == NONE"
        side_effects:
          - "sets delivered_at = logical clock"
          - "computes delivery_window_compliance and service_compliance_score via tray_service_compliance"
          - "increments MealPeriod.delivered_tray_count by 1"
          - "increments MealOrder.version by 1 and MealPeriod.version by 1"
      - from: PENDING_VALIDATION
        to: CANCELLED
        trigger: "POST /nutrition/meal-orders/{id}/cancel"
        actor: DietClerk
        preconditions: ["meal_order.fulfillment_status == PENDING_VALIDATION"]
        side_effects: ["increments MealOrder.version by 1"]
      - from: VALIDATED
        to: CANCELLED
        trigger: "POST /nutrition/meal-orders/{id}/cancel"
        actor: DietClerk
        preconditions: ["meal_order.fulfillment_status == VALIDATED"]
        side_effects:
          - "decrements MealPeriod.committed_tray_count by 1 and subtracts this tray's food_cost_cents from MealPeriod.committed_food_cost_cents"
          - "recomputes the MealPeriod cost rollup and forecast_variance_pct"
          - "increments MealOrder.version by 1 and MealPeriod.version by 1"
        note: "Compensating action for the PENDING_VALIDATION -> VALIDATED slot reservation; both the tray-slot count and the cents ledger return to their pre-validate values."
      - from: IN_PRODUCTION
        to: CANCELLED
        trigger: "POST /nutrition/meal-orders/{id}/cancel"
        actor: DietClerk
        preconditions: ["meal_order.fulfillment_status == IN_PRODUCTION"]
        side_effects: ["decrements MealPeriod.committed_tray_count by 1 and subtracts food_cost_cents from MealPeriod.committed_food_cost_cents", "recomputes the MealPeriod cost rollup and forecast_variance_pct", "increments MealOrder.version by 1 and MealPeriod.version by 1"]
      - from: PLATED
        to: CANCELLED
        trigger: "POST /nutrition/meal-orders/{id}/cancel"
        actor: DietClerk
        preconditions: ["meal_order.fulfillment_status == PLATED"]
        side_effects: ["decrements MealPeriod.committed_tray_count by 1 and subtracts food_cost_cents from MealPeriod.committed_food_cost_cents", "recomputes the MealPeriod cost rollup and forecast_variance_pct", "increments MealOrder.version by 1 and MealPeriod.version by 1"]
      - from: PENDING_VALIDATION
        to: MISSED
        trigger: "system, on ProcedureHold activation covering this tray window or on MealPeriod close"
        actor: system
        preconditions: ["meal_order.fulfillment_status == PENDING_VALIDATION"]
        side_effects:
          - "sets missed_reason = NPO_HOLD or PERIOD_CLOSED"
          - "increments Patient.missed_meal_count by 1 and adds total_protein_g to Patient.protein_deficit_g"
          - "may create an auto-generated NutritionConsult per missed_meal_consult_escalation"
          - "increments MealOrder.version by 1 and Patient.version by 1"
      - from: VALIDATED
        to: MISSED
        trigger: "system, on ProcedureHold activation covering this tray window or on MealPeriod close"
        actor: system
        preconditions: ["meal_order.fulfillment_status == VALIDATED"]
        side_effects:
          - "sets missed_reason = NPO_HOLD or PERIOD_CLOSED"
          - "decrements MealPeriod.committed_tray_count by 1 and subtracts food_cost_cents from MealPeriod.committed_food_cost_cents, then recomputes the cost rollup and forecast_variance_pct"
          - "increments Patient.missed_meal_count by 1 and adds total_protein_g to Patient.protein_deficit_g"
          - "may create an auto-generated NutritionConsult per missed_meal_consult_escalation"
          - "increments MealOrder.version by 1, MealPeriod.version by 1 and Patient.version by 1"
      - from: IN_PRODUCTION
        to: MISSED
        trigger: "system, on ProcedureHold activation covering this tray window or on MealPeriod close"
        actor: system
        preconditions: ["meal_order.fulfillment_status == IN_PRODUCTION"]
        side_effects: ["identical to the VALIDATED -> MISSED side-effect list"]
      - from: PLATED
        to: MISSED
        trigger: "system, on ProcedureHold activation covering this tray window or on MealPeriod close"
        actor: system
        preconditions: ["meal_order.fulfillment_status == PLATED"]
        side_effects: ["identical to the VALIDATED -> MISSED side-effect list"]

  - entity: MealOrder
    state_field: qa_status
    initial_state: NOT_CHECKED
    terminal_states: [TEMP_PASSED]
    transitions:
      - from: NOT_CHECKED
        to: ACCURACY_PASSED
        trigger: "POST /nutrition/meal-orders/{id}/accuracy-check with observed_line_count equal to the tray line count and no defect codes"
        actor: TrayAide
        preconditions: ["meal_order.fulfillment_status == PLATED", "meal_order.qa_status == NOT_CHECKED"]
        side_effects: ["sets accuracy_checked_by_user_id = X-User-ID", "increments MealOrder.version by 1"]
      - from: NOT_CHECKED
        to: ACCURACY_FAILED
        trigger: "POST /nutrition/meal-orders/{id}/accuracy-check with a mismatched observed_line_count or a non-empty defect_codes list"
        actor: TrayAide
        preconditions: ["meal_order.fulfillment_status == PLATED", "meal_order.qa_status == NOT_CHECKED"]
        side_effects: ["increments accuracy_retry_count by 1", "sets accuracy_checked_by_user_id = X-User-ID", "increments MealOrder.version by 1"]
      - from: ACCURACY_FAILED
        to: ACCURACY_PASSED
        trigger: "POST /nutrition/meal-orders/{id}/accuracy-check re-run after the tray is corrected"
        actor: TrayAide
        preconditions: ["meal_order.fulfillment_status == PLATED", "meal_order.qa_status == ACCURACY_FAILED"]
        side_effects: ["sets accuracy_checked_by_user_id = X-User-ID", "increments MealOrder.version by 1"]
        note: "Closes the accuracy retry cycle; accuracy_retry_count is never decremented and permanently penalises service_compliance_score."
      - from: ACCURACY_FAILED
        to: ACCURACY_FAILED
        trigger: "POST /nutrition/meal-orders/{id}/accuracy-check that still fails"
        actor: TrayAide
        preconditions: ["meal_order.fulfillment_status == PLATED", "meal_order.qa_status == ACCURACY_FAILED"]
        side_effects: ["increments accuracy_retry_count by 1", "increments MealOrder.version by 1"]
      - from: ACCURACY_PASSED
        to: TEMP_PASSED
        trigger: "POST /nutrition/meal-orders/{id}/temperature-check with every required probe inside its limit"
        actor: TrayAide
        preconditions:
          - "meal_order.fulfillment_status == PLATED"
          - "meal_order.qa_status == ACCURACY_PASSED"
          - "X-User-ID != meal_order.accuracy_checked_by_user_id"
          - "hot_probe_celsius supplied when requires_hot_probe, cold_probe_celsius supplied when requires_cold_probe"
        side_effects: ["stores the probe readings", "sets temperature_checked_by_user_id = X-User-ID", "increments MealOrder.version by 1"]
      - from: ACCURACY_PASSED
        to: TEMP_FAILED
        trigger: "POST /nutrition/meal-orders/{id}/temperature-check with a probe outside its limit"
        actor: TrayAide
        preconditions:
          - "meal_order.fulfillment_status == PLATED"
          - "meal_order.qa_status == ACCURACY_PASSED"
          - "X-User-ID != meal_order.accuracy_checked_by_user_id"
        side_effects: ["stores the probe readings", "increments temperature_retry_count by 1", "sets temperature_checked_by_user_id = X-User-ID", "increments MealOrder.version by 1"]
      - from: TEMP_FAILED
        to: TEMP_PASSED
        trigger: "POST /nutrition/meal-orders/{id}/temperature-check re-run after the tray is re-thermalised"
        actor: TrayAide
        preconditions: ["meal_order.fulfillment_status == PLATED", "meal_order.qa_status == TEMP_FAILED", "X-User-ID != meal_order.accuracy_checked_by_user_id"]
        side_effects: ["stores the probe readings", "increments MealOrder.version by 1"]
      - from: TEMP_FAILED
        to: TEMP_FAILED
        trigger: "POST /nutrition/meal-orders/{id}/temperature-check that still fails"
        actor: TrayAide
        preconditions: ["meal_order.fulfillment_status == PLATED", "meal_order.qa_status == TEMP_FAILED", "X-User-ID != meal_order.accuracy_checked_by_user_id"]
        side_effects: ["increments temperature_retry_count by 1", "increments MealOrder.version by 1"]

  - entity: ProcedureHold
    state_field: status
    initial_state: SCHEDULED
    terminal_states: [RELEASED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: ACTIVE
        trigger: "POST /nutrition/procedure-holds/{id}/activate"
        actor: Physician
        preconditions: ["procedure_hold.status == SCHEDULED", "patient.status == ADMITTED", "no other ProcedureHold for this patient is in status ACTIVE"]
        side_effects:
          - "cascade level 1: sets Patient.npo_status = hold.npo_kind and Patient.active_procedure_hold_id = hold.id"
          - "cascade level 2: because Patient.npo_status left NONE, every MealOrder for this patient whose MealPeriod window [window_start_at, window_end_at) intersects [buffered_start_at, buffered_end_at) and whose fulfillment_status IN {PENDING_VALIDATION, VALIDATED, IN_PRODUCTION, PLATED} moves to MISSED with missed_reason = NPO_HOLD, and hold.missed_meal_order_count is set to the number of trays moved"
          - "cascade level 3: because each of those trays that had been VALIDATED, IN_PRODUCTION or PLATED left a committed status, its MealPeriod decrements committed_tray_count, subtracts that tray's food_cost_cents from committed_food_cost_cents and recomputes period_overhead_cents, period_bulk_discount_cents, period_total_cost_cents and forecast_variance_pct"
          - "cascade level 4: because each tray entered MISSED, Patient.missed_meal_count increments by 1 and Patient.protein_deficit_g increases by that tray's total_protein_g; when missed_meal_count reaches MISSED_MEAL_CONSULT_THRESHOLD and no NutritionConsult for the patient is in status REQUESTED, ASSIGNED or ASSESSED, an auto-generated URGENT NutritionConsult is created per missed_meal_consult_escalation"
          - "cascade level 5: because Patient.npo_status left NONE, Ward.active_patient_census is recomputed"
          - "increments ProcedureHold.version by 1 and Patient.version by 1"
      - from: ACTIVE
        to: RELEASED
        trigger: "POST /nutrition/procedure-holds/{id}/release"
        actor: Physician
        preconditions: ["procedure_hold.status == ACTIVE"]
        side_effects:
          - "sets released_at = logical clock"
          - "sets Patient.npo_status = NONE and Patient.active_procedure_hold_id = null"
          - "recomputes Ward.active_patient_census"
          - "increments ProcedureHold.version by 1 and Patient.version by 1"
        note: "Release does NOT resurrect the trays the hold pushed into MISSED; missed_meal_count and protein_deficit_g are not rewound."
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /nutrition/procedure-holds/{id}/cancel"
        actor: Physician
        preconditions: ["procedure_hold.status == SCHEDULED"]
        side_effects: ["increments ProcedureHold.version by 1", "frees the buffered interval for future overlap checks"]

  - entity: NutritionConsult
    state_field: status
    initial_state: REQUESTED
    terminal_states: [SIGNED, CANCELLED]
    transitions:
      - from: REQUESTED
        to: ASSIGNED
        trigger: "POST /nutrition/nutrition-consults/{id}/assign"
        actor: Dietitian
        preconditions: ["consult.status == REQUESTED"]
        side_effects: ["sets assigned_dietitian_user_id from the request body", "increments NutritionConsult.version by 1"]
      - from: ASSIGNED
        to: ASSESSED
        trigger: "POST /nutrition/nutrition-consults/{id}/assess"
        actor: Dietitian
        preconditions: ["consult.status == ASSIGNED", "albumin_g_dl supplied when assessment_variant == COMPREHENSIVE"]
        side_effects: ["stores the four assessment inputs and the variant", "computes malnutrition_risk_score and risk_tier via malnutrition_risk_score", "increments NutritionConsult.version by 1"]
      - from: ASSESSED
        to: SIGNED
        trigger: "POST /nutrition/nutrition-consults/{id}/sign"
        actor: Dietitian
        preconditions: ["consult.status == ASSESSED", "X-User-ID != consult.requested_by_user_id"]
        side_effects: ["sets signed_by_user_id = X-User-ID", "unlocks SupplementOrder activation for supplement orders on this consult", "increments NutritionConsult.version by 1"]
      - from: REQUESTED
        to: CANCELLED
        trigger: "POST /nutrition/nutrition-consults/{id}/cancel"
        actor: Dietitian
        preconditions: ["consult.status == REQUESTED"]
        side_effects: ["every SupplementOrder on this consult with status == PENDING moves to CANCELLED", "increments NutritionConsult.version by 1"]
      - from: ASSIGNED
        to: CANCELLED
        trigger: "POST /nutrition/nutrition-consults/{id}/cancel"
        actor: Dietitian
        preconditions: ["consult.status == ASSIGNED"]
        side_effects: ["every SupplementOrder on this consult with status == PENDING moves to CANCELLED", "increments NutritionConsult.version by 1"]
      - from: ASSESSED
        to: CANCELLED
        trigger: "POST /nutrition/nutrition-consults/{id}/cancel"
        actor: Dietitian
        preconditions: ["consult.status == ASSESSED"]
        side_effects: ["every SupplementOrder on this consult with status == PENDING moves to CANCELLED", "increments NutritionConsult.version by 1"]

  - entity: SupplementOrder
    state_field: status
    initial_state: PENDING
    terminal_states: [CANCELLED]
    transitions:
      - from: PENDING
        to: ACTIVE
        trigger: "POST /nutrition/supplement-orders/{id}/activate"
        actor: Dietitian
        preconditions: ["supplement_order.status == PENDING", "consult.status == SIGNED", "patient.status == ADMITTED", "menu_item.status == ACTIVE"]
        side_effects:
          - "sets activated_at = logical clock"
          - "adds daily_cost_cents to Patient.daily_supplement_cost_cents"
          - "increments SupplementOrder.version by 1 and Patient.version by 1"
      - from: ACTIVE
        to: CANCELLED
        trigger: "POST /nutrition/supplement-orders/{id}/cancel"
        actor: Dietitian
        preconditions: ["supplement_order.status == ACTIVE"]
        side_effects:
          - "sets cancelled_at = logical clock"
          - "subtracts daily_cost_cents from Patient.daily_supplement_cost_cents"
          - "increments SupplementOrder.version by 1 and Patient.version by 1"
        note: "Compensating action for activation; Patient.daily_supplement_cost_cents returns exactly to its pre-activation value."
      - from: PENDING
        to: CANCELLED
        trigger: "POST /nutrition/supplement-orders/{id}/cancel, or the cancel cascade of the owning NutritionConsult"
        actor: Dietitian
        preconditions: ["supplement_order.status == PENDING"]
        side_effects: ["sets cancelled_at = logical clock", "leaves Patient.daily_supplement_cost_cents unchanged because a PENDING order never debited it", "increments SupplementOrder.version by 1"]

# =============================================================================
# 1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: meal-order-create-stale-diet-order
    parent_entity: DietOrder
    write_endpoint: "POST /nutrition/meal-orders"
    occ_field: "expected_diet_order_version"
    description: |
      Creating a MealOrder against a DietOrder whose version has advanced since the client last
      observed it is rejected. Every accepted MealOrder creation increments the diet order's
      linked_meal_order_count and therefore its version, and a cosign, revision or discontinue on
      the diet order advances it too, so a client holding an older version is working from a stale
      view of the therapeutic envelope the tray would be validated against.
    error_id: ERR_STALE_DIET_ORDER_VERSION
    http_status: 412

  - rule_id: supplement-order-create-stale-consult
    parent_entity: NutritionConsult
    write_endpoint: "POST /nutrition/supplement-orders"
    occ_field: "expected_consult_version"
    description: |
      Creating a SupplementOrder against a NutritionConsult whose version has advanced since the
      client last observed it is rejected. Each accepted supplement order increments the consult's
      linked_supplement_order_count and therefore its version, and assess or sign advance it too,
      so an older version means the recommendation the client is acting on is stale.
    error_id: ERR_STALE_CONSULT_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: effective_diet_envelope
    trigger: "On every DietOrder transition into PENDING_COSIGN or ACTIVE (submit, resubmit, cosign), and again on every MealOrder validate, which reads the pinned order's envelope"
    algorithm: constraint_propagation
    formula: |
      TEXTURE_ORDINAL = { REGULAR: 0, MINCED_MOIST: 1, PUREED: 2, LIQUIDISED: 3 }
      LIQUID_ORDINAL  = { THIN: 0, MILDLY_THICK: 1, MODERATELY_THICK: 2, EXTREMELY_THICK: 3 }

      rules = [primary_diet_rule] + ([secondary_diet_rule] if secondary_diet_rule_id is not null else [])

      # step 1 - numeric ceilings: most restrictive non-null wins; all-null means uncapped
      sodium_candidates    = [r.max_sodium_mg_per_meal    for r in rules if r.max_sodium_mg_per_meal    is not null]
      potassium_candidates = [r.max_potassium_mg_per_meal for r in rules if r.max_potassium_mg_per_meal is not null]
      carb_candidates      = [r.max_carb_g_per_meal       for r in rules if r.max_carb_g_per_meal       is not null]
      effective_sodium_cap_mg    = min(sodium_candidates)    if sodium_candidates    else null
      effective_potassium_cap_mg = min(potassium_candidates) if potassium_candidates else null
      effective_carb_cap_g       = min(carb_candidates)      if carb_candidates      else null

      # step 2 - texture floor: highest ordinal across the prescription, the patient and the rules
      texture_candidates = [diet_order.texture_level, patient.texture_level]
                         + [r.min_texture_level for r in rules if r.min_texture_level is not null]
      effective_texture_level = argmax_by_ordinal(texture_candidates, TEXTURE_ORDINAL)

      # step 3 - liquid floor: highest ordinal across the prescription, the patient and the rules
      liquid_candidates = [diet_order.liquid_level, patient.liquid_level]
                        + [r.min_liquid_level for r in rules if r.min_liquid_level is not null]
      effective_liquid_level = argmax_by_ordinal(liquid_candidates, LIQUID_ORDINAL)

      # step 4 - NPO override, applied LAST and NOT monotonic with steps 2 and 3
      if patient.npo_status == NPO_STRICT:
          effective_texture_level = LIQUIDISED
          effective_sodium_cap_mg = 0
          effective_potassium_cap_mg = 0
          effective_carb_cap_g = 0.0
      elif patient.npo_status == NPO_CLEAR_LIQUIDS:
          effective_texture_level = LIQUIDISED
          effective_liquid_level  = THIN                       # pinned DOWN, overriding step 3
          effective_carb_cap_g    = CLEAR_LIQUID_CARB_CAP_G if effective_carb_cap_g is null
                                    else min(effective_carb_cap_g, CLEAR_LIQUID_CARB_CAP_G)

      # step 5 - forbidden tags: union, de-duplicated
      forbidden_tag_codes_effective = distinct(concat(r.forbidden_tag_codes for r in rules))
                                      ordered by (owning rule precedence_rank ASC, tag_code ASC)
    input_set: "The DietOrder itself, its Patient (texture_level, liquid_level, npo_status), and the one or two TherapeuticDietRules it references; only rules with status == ACTIVE may be referenced, enforced by validation priority 24."
    constants:
      CLEAR_LIQUID_CARB_CAP_G: 15.0
    precision: "Carbohydrate caps carry 1 decimal place, round_half_up; sodium and potassium caps are whole mg"
    variants: []

  - name: meal_order_nutrient_totals
    trigger: "On MealOrder creation, on every line substitution, and again on POST /nutrition/meal-orders/{id}/validate"
    algorithm: aggregation
    formula: |
      lines = MealOrderLine where meal_order_id == order.id AND line_status IN {REQUESTED, SUBSTITUTED},
              processed in created_at ASC order
      effective_item(line) = MenuItem with id == line.menu_item_id      # already the substitute after a swap
      total_sodium_mg    = sum(effective_item(l).sodium_mg    * l.quantity for l in lines)
      total_potassium_mg = sum(effective_item(l).potassium_mg * l.quantity for l in lines)
      total_carb_g       = ROUND_HALF_UP(sum(effective_item(l).carb_g    * l.quantity for l in lines), 1)
      total_protein_g    = ROUND_HALF_UP(sum(effective_item(l).protein_g * l.quantity for l in lines), 1)
      requires_hot_probe  = any(effective_item(l).service_temp_class == HOT  for l in lines)
      requires_cold_probe = any(effective_item(l).service_temp_class == COLD for l in lines)
    input_set: "Every MealOrderLine of the tray; line_status REQUESTED and SUBSTITUTED both count, and a substituted line contributes its NEW menu item, never the original."
    constants: {}
    precision: "Sodium and potassium are whole mg; carbohydrate and protein carry 1 decimal place, round_half_up applied once to the summed value"
    variants: []

  - name: meal_order_food_cost
    trigger: "On MealOrder creation, on every line substitution, and again on POST /nutrition/meal-orders/{id}/validate"
    algorithm: tiered_pricing
    formula: |
      surcharge_per_unit = TEXTURE_PREP_SURCHARGE_CENTS[meal_order.effective_texture_level]
      for each line in MealOrderLine where meal_order_id == order.id, in created_at ASC order:
          base_cents = effective_item(line).unit_cost_cents * line.quantity
          prep_cents = surcharge_per_unit * line.quantity
          line.line_cost_cents = ROUND_HALF_UP((base_cents + prep_cents) * WASTE_FACTOR)   # integer cents
      food_cost_cents = sum(line.line_cost_cents for every line)
      # PINNED ORDER: round at the LINE first, then sum the rounded integers.
      # The rejected reading -- sum the un-rounded line values and round once at the end --
      # returns a different integer whenever the discarded fractions accumulate past a cent.
    input_set: "Every MealOrderLine of the tray. The surcharge is keyed on the tray's effective_texture_level, which itself comes from effective_diet_envelope, so the cost changes when the diet order envelope tightens."
    constants:
      WASTE_FACTOR: 1.08
      TEXTURE_PREP_SURCHARGE_CENTS: { REGULAR: 0, MINCED_MOIST: 25, PUREED: 60, LIQUIDISED: 90 }
    precision: "Whole cents, ROUND_HALF_UP applied once per line, never to the tray total"
    variants: []

  - name: meal_period_cost_rollup
    trigger: "Whenever MealPeriod.committed_food_cost_cents changes: MealOrder validate, cancel from a committed status, or a system move to MISSED"
    algorithm: waterfall_allocation
    formula: |
      # Evaluation order is PINNED and executed exactly in these six steps.
      step 1: line_subtotal_cents = committed_food_cost_cents
              = sum(MealOrder.food_cost_cents where meal_period_id == P.id
                    AND fulfillment_status IN {VALIDATED, IN_PRODUCTION, PLATED, DELIVERED})
      step 2: volume_tier is keyed on the STEP-1 SUBTOTAL, never on the gross or the final total:
                  tier A when line_subtotal_cents <  TIER_A_MAX_EXCLUSIVE
                  tier B when TIER_A_MAX_EXCLUSIVE <= line_subtotal_cents < TIER_B_MAX_EXCLUSIVE
                  tier C when line_subtotal_cents >= TIER_B_MAX_EXCLUSIVE
      step 3: period_overhead_cents = ROUND_HALF_UP(line_subtotal_cents * OVERHEAD_RATE[tier])
      step 4: gross_cents = line_subtotal_cents + period_overhead_cents
      step 5: period_bulk_discount_cents = ROUND_HALF_UP(gross_cents * BULK_DISCOUNT_RATE[tier])
              # keyed on the GROSS, which already contains the overhead -- not on the subtotal
      step 6: period_total_cost_cents = gross_cents - period_bulk_discount_cents
      # The circular-looking reading "the tier is the tier the period total falls into" is REJECTED:
      # the tier is fixed by step 1 before any overhead exists, which makes step 3 well defined.
    input_set: "MealOrders on the period whose fulfillment_status is VALIDATED, IN_PRODUCTION, PLATED or DELIVERED; PENDING_VALIDATION, CANCELLED and MISSED trays are excluded."
    constants:
      TIER_A_MAX_EXCLUSIVE: 2000
      TIER_B_MAX_EXCLUSIVE: 6000
      OVERHEAD_RATE: { A: 0.180, B: 0.150, C: 0.120 }
      BULK_DISCOUNT_RATE: { A: 0.000, B: 0.020, C: 0.045 }
    precision: "Whole cents, ROUND_HALF_UP at step 3 and again at step 5; step 6 is exact integer arithmetic"
    variants: []

  - name: production_forecast_trays
    trigger: "POST /nutrition/meal-periods/{id}/lock-forecast"
    algorithm: forward_looking
    formula: |
      # variant is pinned from the request body and stored on MealPeriod.forecast_variant
      history = MealPeriod where ward_id == P.ward_id
                            AND period_code == P.period_code
                            AND status == CLOSED
                            AND service_date < P.service_date
                ordered by service_date DESC, then created_at DESC
                take the first ROLLING_HISTORY_DEPTH rows

      if variant == ROLLING_AVERAGE:
          if len(history) == 0:
              forecast_tray_count = ward.tray_line_capacity_per_window      # empty-history fallback
          else:
              mean_delivered = sum(h.delivered_tray_count for h in history) / len(history)
              forecast_tray_count = CEIL(mean_delivered * NO_SHOW_ADJUSTMENT)
      elif variant == CENSUS_BASED:
          census = count(Patient where ward_id == P.ward_id
                                   AND status == ADMITTED
                                   AND npo_status == NONE)
          forecast_tray_count = CEIL(census * PARTICIPATION_RATE)

      forecast_cost_cents = forecast_tray_count * AVERAGE_TRAY_COST_CENTS
    input_set: "ROLLING_AVERAGE reads only MealPeriods in status CLOSED for the same ward and period_code with an earlier service_date, at most three of them, ranked by service_date DESC with created_at DESC as the tie-break. CENSUS_BASED reads only Patients on the ward with status ADMITTED and npo_status NONE at the moment of the lock."
    constants:
      ROLLING_HISTORY_DEPTH: 3
      NO_SHOW_ADJUSTMENT: 0.92
      PARTICIPATION_RATE: 0.85
      AVERAGE_TRAY_COST_CENTS: 1150
    precision: "forecast_tray_count is a whole tray count produced by CEIL; forecast_cost_cents is exact integer arithmetic"
    variants:
      - name: ROLLING_AVERAGE
        when: "forecast_variant == ROLLING_AVERAGE at lock time"
        difference: "Backward looking: keys off delivered history of at most three earlier CLOSED periods and shrinks it by NO_SHOW_ADJUSTMENT; falls back to the ward tray-line capacity when no history exists, which typically overshoots a small census."
      - name: CENSUS_BASED
        when: "forecast_variant == CENSUS_BASED at lock time"
        difference: "Forward looking: keys off the live ward census of ADMITTED patients not under NPO and shrinks it by PARTICIPATION_RATE; ignores delivered history entirely, so it produces a different tray count from ROLLING_AVERAGE on the same period."

  - name: forecast_variance
    trigger: "On forecast lock and on every subsequent change to MealPeriod.committed_tray_count while status IN {FORECAST_LOCKED, IN_SERVICE, CLOSED}"
    algorithm: threshold
    formula: |
      if forecast_tray_count is null or forecast_tray_count == 0:
          forecast_variance_pct = null                                  # zero-denominator boundary
      else:
          forecast_variance_pct = ROUND_HALF_UP(
              (committed_tray_count - forecast_tray_count) / forecast_tray_count * 100, 2)
    input_set: "The period's own forecast_tray_count and committed_tray_count; no other rows participate."
    constants: {}
    precision: "2 decimal places, round_half_up, signed"
    variants: []

  - name: tray_service_compliance
    trigger: "POST /nutrition/meal-orders/{id}/temperature-check evaluates the probe limits; POST /nutrition/meal-orders/{id}/deliver evaluates the window position and the final score"
    algorithm: threshold
    formula: |
      # probe evaluation, run at temperature-check time
      hot_ok  = (not order.requires_hot_probe)  or (hot_probe_celsius  >= HOT_MIN_CELSIUS)
      cold_ok = (not order.requires_cold_probe) or (cold_probe_celsius <= COLD_MAX_CELSIUS)
      qa_status becomes TEMP_PASSED when hot_ok AND cold_ok, otherwise TEMP_FAILED
      # exactly 60.0 passes and exactly 4.0 passes; 59.9 and 4.1 fail

      # window evaluation, run at deliver time against the logical clock
      if      delivered_at <  meal_period.window_start_at: delivery_window_compliance = EARLY
      elif    delivered_at >= meal_period.window_end_at:   delivery_window_compliance = LATE
      else:                                                delivery_window_compliance = ON_TIME
      # half-open [window_start_at, window_end_at): the instant equal to window_end_at is LATE

      service_compliance_score = MAX(0,
            100
          - (LATE_PENALTY  if delivery_window_compliance == LATE  else 0)
          - (EARLY_PENALTY if delivery_window_compliance == EARLY else 0)
          - TEMP_RETRY_PENALTY     * order.temperature_retry_count
          - ACCURACY_RETRY_PENALTY * order.accuracy_retry_count)
    input_set: "Only the tray under check and its MealPeriod window; retry counters are cumulative over the tray's whole QA history and are never reset."
    constants:
      HOT_MIN_CELSIUS: 60.0
      COLD_MAX_CELSIUS: 4.0
      LATE_PENALTY: 25
      EARLY_PENALTY: 10
      TEMP_RETRY_PENALTY: 15
      ACCURACY_RETRY_PENALTY: 20
    precision: "Probe readings carry 1 decimal place; service_compliance_score is a whole number clamped to 0..100"
    variants: []

  - name: malnutrition_risk_score
    trigger: "POST /nutrition/nutrition-consults/{id}/assess"
    algorithm: weighted_scoring
    formula: |
      wl_pts     = 0 if weight_loss_pct <  5    else 40 if weight_loss_pct <  10   else 70 if weight_loss_pct < 15   else 100
      intake_pts = 0 if intake_pct     >= 75    else 40 if intake_pct     >= 50    else 70 if intake_pct     >= 25   else 100
      bmi_pts    = 0 if bmi            >= 22    else 40 if bmi            >= 18.5  else 70 if bmi            >= 16   else 100
      alb_pts    = 0 if albumin_g_dl   >= 3.5   else 40 if albumin_g_dl   >= 3.0   else 70 if albumin_g_dl   >= 2.5  else 100

      if assessment_variant == SCREENING:
          malnutrition_risk_score = ROUND_HALF_UP(0.50*wl_pts + 0.30*intake_pts + 0.20*bmi_pts, 2)
      elif assessment_variant == COMPREHENSIVE:
          malnutrition_risk_score = ROUND_HALF_UP(0.35*wl_pts + 0.25*intake_pts + 0.20*bmi_pts + 0.20*alb_pts, 2)

      risk_tier = LOW      if malnutrition_risk_score <  RISK_TIER_MODERATE_MIN
                  MODERATE if malnutrition_risk_score <  RISK_TIER_HIGH_MIN
                  HIGH     otherwise
    input_set: "Only the four assessment inputs supplied on the assess call. albumin_g_dl is ignored entirely by SCREENING and is mandatory for COMPREHENSIVE."
    constants:
      SCREENING_WEIGHTS: { weight_loss: 0.50, intake: 0.30, bmi: 0.20 }
      COMPREHENSIVE_WEIGHTS: { weight_loss: 0.35, intake: 0.25, bmi: 0.20, albumin: 0.20 }
      RISK_TIER_MODERATE_MIN: 30
      RISK_TIER_HIGH_MIN: 60
    precision: "2 decimal places, round_half_up, computed with decimal arithmetic rather than binary floats"
    variants:
      - name: SCREENING
        when: "assessment_variant == SCREENING on the assess call"
        difference: "Three-factor bedside screen. Weight loss carries half the score and albumin is excluded, so a patient with heavy weight loss but normal labs scores materially HIGHER than under COMPREHENSIVE."
      - name: COMPREHENSIVE
        when: "assessment_variant == COMPREHENSIVE on the assess call"
        difference: "Four-factor assessment. Adding albumin at weight 0.20 dilutes the weight-loss term from 0.50 to 0.35, so identical anthropometrics with a normal albumin land in a LOWER risk_tier than the SCREENING variant reports."

  - name: satisfaction_composite_and_patient_average
    trigger: "POST /nutrition/satisfaction-surveys"
    algorithm: weighted_scoring
    formula: |
      composite_score = ROUND_HALF_UP(
            TASTE_WEIGHT       * taste_score
          + TEMPERATURE_WEIGHT * temperature_score
          + ACCURACY_WEIGHT    * accuracy_score, 2)

      surveys = SatisfactionSurvey where patient_id == P.id, ordered by created_at ASC
      patient.survey_count = count(surveys)
      patient.satisfaction_score_avg = ROUND_HALF_UP(
            sum(s.composite_score for s in surveys) / count(surveys), 2)
      # PINNED ORDER: average the ALREADY-ROUNDED composite_score values, then round once more.
      # The rejected reading -- average the raw weighted sums and round only at the end -- differs.
    input_set: "Every SatisfactionSurvey row for the patient, without status filtering, because surveys are immutable append-only events."
    constants:
      TASTE_WEIGHT: 0.40
      TEMPERATURE_WEIGHT: 0.35
      ACCURACY_WEIGHT: 0.25
    precision: "2 decimal places, round_half_up, computed with decimal arithmetic rather than binary floats so that a value such as 4.325 rounds up to 4.33"
    variants: []

  - name: missed_meal_consult_escalation
    trigger: "Every system transition of a MealOrder into fulfillment_status MISSED, whether from a ProcedureHold activation or from a MealPeriod close"
    algorithm: chronological
    formula: |
      # trays are processed in created_at ASC order within a single cascade
      for each tray moving to MISSED, in created_at ASC order:
          patient.missed_meal_count  += 1
          patient.protein_deficit_g   = ROUND_HALF_UP(patient.protein_deficit_g + tray.total_protein_g, 1)
          if patient.missed_meal_count >= MISSED_MEAL_CONSULT_THRESHOLD
             and no NutritionConsult exists for this patient with status IN {REQUESTED, ASSIGNED, ASSESSED}:
                 create NutritionConsult(patient_id = patient.id,
                                         acuity = URGENT,
                                         reason_code = "MISSED_MEALS",
                                         requested_by_user_id = "SYSTEM",
                                         auto_generated = true,
                                         status = REQUESTED)
      # At most ONE auto-generated consult is created per cascade, because the first creation makes
      # the "no open consult" guard false for every later tray in the same cascade.
    input_set: "Only trays entering MISSED in this cascade and the patient's existing NutritionConsults in status REQUESTED, ASSIGNED or ASSESSED; SIGNED and CANCELLED consults do not suppress the escalation."
    constants:
      MISSED_MEAL_CONSULT_THRESHOLD: 2
      CONSULT_URGENT_SLA_HOURS: 4
      CONSULT_ROUTINE_SLA_HOURS: 24
      MAX_REVISION_ROUNDS: 3
    precision: "protein_deficit_g carries 1 decimal place, round_half_up applied after each addition"
    variants: []

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority; lowest number wins)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are both present and X-User-Role is one of the five declared roles"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"

  - priority: 2
    category: auth
    check: "The acting role appears in the endpoint's roles list"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: existence
    check: "Every id embedded in the path resolves to a stored row, checked left to right"
    error_id: "ERR_WARD_NOT_FOUND | ERR_PATIENT_NOT_FOUND | ERR_DIET_RULE_NOT_FOUND | ERR_DIET_ORDER_NOT_FOUND | ERR_MEAL_PERIOD_NOT_FOUND | ERR_MENU_ITEM_NOT_FOUND | ERR_MEAL_ORDER_NOT_FOUND | ERR_MEAL_ORDER_LINE_NOT_FOUND | ERR_PROCEDURE_HOLD_NOT_FOUND | ERR_CONSULT_NOT_FOUND | ERR_SUPPLEMENT_ORDER_NOT_FOUND | ERR_SURVEY_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with path parameters"

  - priority: 4
    category: business_constraint
    check: "Request body and query string are well formed: required fields present, types correct, enum members recognised, numeric ranges respected, limit in 1..100 and offset >= 0"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all"

  - priority: 5
    category: existence
    check: "Every id supplied in the request body resolves, checked in the order the endpoint's input list declares them"
    error_id: "ERR_WARD_NOT_FOUND | ERR_PATIENT_NOT_FOUND | ERR_DIET_RULE_NOT_FOUND | ERR_DIET_ORDER_NOT_FOUND | ERR_MEAL_PERIOD_NOT_FOUND | ERR_MENU_ITEM_NOT_FOUND | ERR_CONSULT_NOT_FOUND"
    http_status: 404
    applies_to: "all write endpoints that take id fields in the body"

  - priority: 6
    category: business_temporal
    check: "Interval inputs are geometrically sane: MealPeriod requires order_cutoff_at < window_start_at < window_end_at; ProcedureHold requires hold_start_at < hold_end_at"
    error_id: ERR_INVALID_WINDOW
    http_status: 400
    applies_to: "POST /nutrition/meal-periods, POST /nutrition/procedure-holds"

  - priority: 7
    category: state
    check: "The Ward governing the operation has status == ACTIVE"
    error_id: ERR_WARD_SUSPENDED
    http_status: 409
    applies_to: "POST /nutrition/meal-periods, POST /nutrition/meal-periods/{id}/lock-forecast, POST /nutrition/meal-periods/{id}/open-service"

  - priority: 8
    category: state
    check: "The Patient the operation touches has status == ADMITTED"
    error_id: ERR_PATIENT_DISCHARGED
    http_status: 409
    applies_to: "POST /nutrition/diet-orders, POST /nutrition/diet-orders/{id}/submit, POST /nutrition/diet-orders/{id}/cosign, POST /nutrition/meal-orders, POST /nutrition/meal-orders/{id}/validate, POST /nutrition/procedure-holds, POST /nutrition/procedure-holds/{id}/activate, POST /nutrition/nutrition-consults, POST /nutrition/supplement-orders/{id}/activate"

  - priority: 9
    category: state
    check: "The MealPeriod the operation touches has status != CLOSED"
    error_id: ERR_MEAL_PERIOD_CLOSED
    http_status: 409
    applies_to: "POST /nutrition/meal-orders, POST /nutrition/meal-orders/{id}/validate"

  - priority: 10
    category: state
    check: "The target row is in one of the from-states the requested transition declares in the state machine table"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "every action endpoint that drives a state transition"

  - priority: 11
    category: state
    check: "The DietOrder the tray is pinned to has status == ACTIVE"
    error_id: ERR_DIET_ORDER_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /nutrition/meal-orders/{id}/validate"

  - priority: 12
    category: state
    check: "The NutritionConsult backing the supplement has status == SIGNED"
    error_id: ERR_CONSULT_NOT_SIGNED
    http_status: 409
    applies_to: "POST /nutrition/supplement-orders/{id}/activate"

  - priority: 13
    category: state
    check: "The tray's qa_status == TEMP_PASSED before bedside delivery"
    error_id: ERR_QA_NOT_PASSED
    http_status: 409
    applies_to: "POST /nutrition/meal-orders/{id}/deliver"

  - priority: 14
    category: state
    check: "expected_diet_order_version equals the current DietOrder.version (optimistic concurrency, rule meal-order-create-stale-diet-order)"
    error_id: ERR_STALE_DIET_ORDER_VERSION
    http_status: 412
    applies_to: "POST /nutrition/meal-orders"

  - priority: 15
    category: state
    check: "expected_consult_version equals the current NutritionConsult.version (optimistic concurrency, rule supplement-order-create-stale-consult)"
    error_id: ERR_STALE_CONSULT_VERSION
    http_status: 412
    applies_to: "POST /nutrition/supplement-orders"

  - priority: 16
    category: business_referential
    check: "meal_order.pinned_diet_order_version equals the pinned DietOrder.version, i.e. the tray has not drifted away from the envelope it was priced against"
    error_id: ERR_DIET_ORDER_SUPERSEDED
    http_status: 409
    applies_to: "POST /nutrition/meal-orders/{id}/validate"

  - priority: 17
    category: business_safety
    check: "Segregation of duties: the acting X-User-ID differs from the recorded X-User-ID of the paired earlier step (cosign vs ordering physician, temperature check vs accuracy check, consult sign vs consult requester)"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /nutrition/diet-orders/{id}/cosign, POST /nutrition/meal-orders/{id}/temperature-check, POST /nutrition/nutrition-consults/{id}/sign"

  - priority: 18
    category: business_safety
    check: "The patient's npo_status == NONE"
    error_id: ERR_NPO_ACTIVE
    http_status: 422
    applies_to: "POST /nutrition/meal-orders/{id}/validate, POST /nutrition/meal-orders/{id}/deliver"

  - priority: 19
    category: business_safety
    check: "No line's menu item declares an allergen code that appears in the patient's allergen_codes"
    error_id: ERR_ALLERGEN_CONFLICT
    http_status: 422
    applies_to: "POST /nutrition/meal-orders/{id}/validate, POST /nutrition/meal-orders/{id}/lines/{line_id}/substitute"

  - priority: 20
    category: business_safety
    check: "Every line's menu item is prepared at or beyond the tray's effective_texture_level, i.e. TEXTURE_ORDINAL[item.texture_level] >= TEXTURE_ORDINAL[order.effective_texture_level]"
    error_id: ERR_TEXTURE_LEVEL_VIOLATION
    http_status: 422
    applies_to: "POST /nutrition/meal-orders/{id}/validate, POST /nutrition/meal-orders/{id}/lines/{line_id}/substitute"

  - priority: 21
    category: business_safety
    check: "Every line's menu item that declares a liquid_level is thickened at or beyond the tray's effective_liquid_level, i.e. LIQUID_ORDINAL[item.liquid_level] >= LIQUID_ORDINAL[order.effective_liquid_level]"
    error_id: ERR_LIQUID_LEVEL_VIOLATION
    http_status: 422
    applies_to: "POST /nutrition/meal-orders/{id}/validate, POST /nutrition/meal-orders/{id}/lines/{line_id}/substitute"

  - priority: 22
    category: business_safety
    check: "No line's menu item carries a tag code listed in the pinned diet order's forbidden_tag_codes_effective"
    error_id: ERR_FORBIDDEN_TAG
    http_status: 422
    applies_to: "POST /nutrition/meal-orders/{id}/validate, POST /nutrition/meal-orders/{id}/lines/{line_id}/substitute"

  - priority: 23
    category: business_safety
    check: "Every referenced MenuItem has status == ACTIVE"
    error_id: ERR_MENU_ITEM_DISCONTINUED
    http_status: 422
    applies_to: "POST /nutrition/meal-orders, POST /nutrition/meal-orders/{id}/validate, POST /nutrition/meal-orders/{id}/lines/{line_id}/substitute, POST /nutrition/supplement-orders"

  - priority: 24
    category: business_safety
    check: "Every referenced TherapeuticDietRule has status == ACTIVE"
    error_id: ERR_DIET_RULE_RETIRED
    http_status: 422
    applies_to: "POST /nutrition/diet-orders, POST /nutrition/diet-orders/{id}/submit"

  - priority: 25
    category: business_safety
    check: "hot_probe_celsius is supplied when requires_hot_probe is true and cold_probe_celsius is supplied when requires_cold_probe is true"
    error_id: ERR_TEMPERATURE_PROBE_REQUIRED
    http_status: 422
    applies_to: "POST /nutrition/meal-orders/{id}/temperature-check"

  - priority: 26
    category: business_safety
    check: "albumin_g_dl is supplied when assessment_variant == COMPREHENSIVE"
    error_id: ERR_ALBUMIN_REQUIRED
    http_status: 422
    applies_to: "POST /nutrition/nutrition-consults/{id}/assess"

  - priority: 27
    category: business_safety
    check: "The tray's recomputed nutrient totals fit inside the pinned diet order envelope: total_sodium_mg <= effective_sodium_cap_mg, total_potassium_mg <= effective_potassium_cap_mg, total_carb_g <= effective_carb_cap_g, skipping any cap that is null"
    error_id: ERR_NUTRIENT_CAP_EXCEEDED
    http_status: 422
    applies_to: "POST /nutrition/meal-orders/{id}/validate"

  - priority: 28
    category: business_temporal
    check: "Two MealPeriods on the same ward may not occupy overlapping delivery windows; the intervals are compared as CLOSED [window_start_at, window_end_at], so windows that merely touch at an endpoint DO collide"
    error_id: ERR_MEAL_PERIOD_WINDOW_OVERLAP
    http_status: 409
    applies_to: "POST /nutrition/meal-periods"

  - priority: 29
    category: business_temporal
    check: "Two ProcedureHolds on the same patient in status SCHEDULED or ACTIVE may not occupy overlapping buffered intervals; the intervals are compared as HALF-OPEN [buffered_start_at, buffered_end_at), so a new hold whose buffered start equals an existing buffered end is accepted"
    error_id: ERR_PROCEDURE_HOLD_OVERLAP
    http_status: 409
    applies_to: "POST /nutrition/procedure-holds"

  - priority: 30
    category: business_temporal
    check: "The logical clock is strictly before meal_period.order_cutoff_at"
    error_id: ERR_ORDER_CUTOFF_PASSED
    http_status: 422
    applies_to: "POST /nutrition/meal-orders"

  - priority: 31
    category: business_constraint
    check: "The lines array contains at least one entry"
    error_id: ERR_EMPTY_MEAL_ORDER
    http_status: 422
    applies_to: "POST /nutrition/meal-orders"

  - priority: 32
    category: business_constraint
    check: "No other MealOrder exists for the same patient_id and meal_period_id with fulfillment_status NOT IN {CANCELLED, MISSED}"
    error_id: ERR_DUPLICATE_MEAL_ORDER
    http_status: 409
    applies_to: "POST /nutrition/meal-orders"

  - priority: 33
    category: business_constraint
    check: "Patient.mrn is unique across all Patients"
    error_id: ERR_DUPLICATE_MRN
    http_status: 409
    applies_to: "POST /nutrition/patients"

  - priority: 34
    category: business_constraint
    check: "TherapeuticDietRule.diet_code is unique across all rules"
    error_id: ERR_DUPLICATE_DIET_RULE_CODE
    http_status: 409
    applies_to: "POST /nutrition/diet-rules"

  - priority: 35
    category: business_constraint
    check: "MenuItem.item_code is unique across all menu items"
    error_id: ERR_DUPLICATE_MENU_ITEM_CODE
    http_status: 409
    applies_to: "POST /nutrition/menu-items"

  - priority: 36
    category: business_constraint
    check: "Ward.code is unique across all wards"
    error_id: ERR_DUPLICATE_WARD_CODE
    http_status: 409
    applies_to: "POST /nutrition/wards"

  - priority: 37
    category: business_constraint
    check: "The rated MealOrder has fulfillment_status == DELIVERED"
    error_id: ERR_MEAL_ORDER_NOT_DELIVERED
    http_status: 409
    applies_to: "POST /nutrition/satisfaction-surveys"

  - priority: 38
    category: business_constraint
    check: "At most one SatisfactionSurvey exists per MealOrder"
    error_id: ERR_DUPLICATE_SURVEY
    http_status: 409
    applies_to: "POST /nutrition/satisfaction-surveys"

  - priority: 39
    category: business_constraint
    check: "diet_order.revision_round < MAX_REVISION_ROUNDS"
    error_id: ERR_REVISION_LIMIT_EXCEEDED
    http_status: 422
    applies_to: "POST /nutrition/diet-orders/{id}/request-revision"

  - priority: 40
    category: business_fiscal
    check: "meal_period.committed_tray_count + 1 <= meal_period.production_capacity_trays"
    error_id: ERR_TRAY_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /nutrition/meal-orders/{id}/validate"

  - priority: 41
    category: business_fiscal
    check: "When meal_period.cost_ceiling_cents is not null: committed_food_cost_cents + meal_order.food_cost_cents <= cost_ceiling_cents"
    error_id: ERR_PERIOD_COST_CEILING_EXCEEDED
    http_status: 422
    applies_to: "POST /nutrition/meal-orders/{id}/validate"

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Logical clock (test-driving endpoint) ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server's logical UTC clock. Every deadline, window, cutoff and SLA in this API reads this clock, never wall-clock time. Before the first call the clock reads exactly 2026-08-01T00:00:00Z and MUST NOT fall back to real wall-clock time."
    roles: [Physician, Dietitian, DietClerk, TrayAide, NutritionManager]
    code: 200
    input: [to_iso8601]
    output: { current_utc: datetime }
    side_effects: ["recomputes NutritionConsult.is_overdue for every consult on the next read"]

  # --- Wards ---
  - method: POST
    path: "/nutrition/wards"
    description: "Register a ward"
    roles: [NutritionManager]
    code: 201
    input: [name, code, tray_line_capacity_per_window, delivery_lead_minutes, "temperature_probe_required?"]
    output: Ward
    side_effects: ["status initialised to ACTIVE", "active_patient_census initialised to 0"]
  - method: GET
    path: "/nutrition/wards"
    description: "List wards"
    roles: [Physician, Dietitian, DietClerk, TrayAide, NutritionManager]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "Ward[]"
    side_effects: []
  - method: GET
    path: "/nutrition/wards/{id}"
    description: "Read one ward including its live census"
    roles: [Physician, Dietitian, DietClerk, TrayAide, NutritionManager]
    code: 200
    input: []
    output: Ward
    side_effects: []
  - method: PATCH
    path: "/nutrition/wards/{id}"
    description: "Suspend, reinstate or re-capacity a ward"
    roles: [NutritionManager]
    code: 200
    input: ["status?", "tray_line_capacity_per_window?", "delivery_lead_minutes?", "temperature_probe_required?"]
    output: Ward
    side_effects: ["increments Ward.version by 1", "a SUSPENDED ward blocks meal-period creation, forecast lock and service opening"]

  # --- Patients ---
  - method: POST
    path: "/nutrition/patients"
    description: "Admit a patient to a ward"
    roles: [DietClerk, NutritionManager]
    code: 201
    input: [ward_id, mrn, full_name, age_years, "allergen_codes?", "texture_level?", "liquid_level?"]
    output: Patient
    side_effects: ["status initialised to ADMITTED", "npo_status initialised to NONE", "recomputes Ward.active_patient_census"]
  - method: GET
    path: "/nutrition/patients"
    description: "List patients, optionally filtered by ward, admission status or NPO status"
    roles: [Physician, Dietitian, DietClerk, TrayAide, NutritionManager]
    code: 200
    input: ["ward_id?", "status?", "npo_status?", "limit?", "offset?"]
    output: "Patient[]"
    side_effects: []
  - method: GET
    path: "/nutrition/patients/{id}"
    description: "Read one patient including npo_status, missed_meal_count, protein_deficit_g, daily_supplement_cost_cents and satisfaction_score_avg"
    roles: [Physician, Dietitian, DietClerk, TrayAide, NutritionManager]
    code: 200
    input: []
    output: Patient
    side_effects: []
  - method: PATCH
    path: "/nutrition/patients/{id}"
    description: "Update the patient's documented allergens and texture or liquid requirements"
    roles: [DietClerk, Dietitian]
    code: 200
    input: ["allergen_codes?", "texture_level?", "liquid_level?"]
    output: Patient
    side_effects: ["increments Patient.version by 1", "the patient's ACTIVE DietOrder recomputes its effective_* envelope on its next read or validate"]
  - method: POST
    path: "/nutrition/patients/{id}/discharge"
    description: "Discharge the patient and unwind their open nutrition work"
    roles: [DietClerk, NutritionManager]
    code: 200
    input: []
    output: Patient
    side_effects: ["cancels non-terminal MealOrders and releases their tray slots and cents", "cancels SCHEDULED ProcedureHolds", "discontinues the ACTIVE DietOrder", "recomputes Ward.active_patient_census", "increments Patient.version by 1"]

  # --- Therapeutic diet rules ---
  - method: POST
    path: "/nutrition/diet-rules"
    description: "Publish a therapeutic diet rule"
    roles: [Dietitian, NutritionManager]
    code: 201
    input: [diet_code, display_name, precedence_rank, "max_sodium_mg_per_meal?", "max_potassium_mg_per_meal?", "max_carb_g_per_meal?", "min_texture_level?", "min_liquid_level?", "forbidden_tag_codes?", "requires_dietitian_cosign?"]
    output: TherapeuticDietRule
    side_effects: ["status initialised to ACTIVE", "requires_dietitian_cosign defaults to true"]
  - method: GET
    path: "/nutrition/diet-rules"
    description: "List therapeutic diet rules"
    roles: [Physician, Dietitian, DietClerk, TrayAide, NutritionManager]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "TherapeuticDietRule[]"
    side_effects: []
  - method: GET
    path: "/nutrition/diet-rules/{id}"
    description: "Read one therapeutic diet rule"
    roles: [Physician, Dietitian, DietClerk, TrayAide, NutritionManager]
    code: 200
    input: []
    output: TherapeuticDietRule
    side_effects: []
  - method: PATCH
    path: "/nutrition/diet-rules/{id}"
    description: "Retire or reinstate a therapeutic diet rule"
    roles: [Dietitian, NutritionManager]
    code: 200
    input: ["status?"]
    output: TherapeuticDietRule
    side_effects: ["increments TherapeuticDietRule.version by 1", "a RETIRED rule can no longer back a new or resubmitted DietOrder"]

  # --- Diet orders ---
  - method: POST
    path: "/nutrition/diet-orders"
    description: "Draft a diet order for a patient, layering one or two therapeutic rules"
    roles: [Physician]
    code: 201
    input: [patient_id, primary_diet_rule_id, "secondary_diet_rule_id?", "texture_level?", "liquid_level?"]
    output: DietOrder
    side_effects: ["status initialised to DRAFT", "ordering_physician_user_id stamped from X-User-ID", "revision_round initialised to 0"]
  - method: GET
    path: "/nutrition/diet-orders"
    description: "List diet orders; filters cover every foreign key including the self-referential supersede chain"
    roles: [Physician, Dietitian, DietClerk, TrayAide, NutritionManager]
    code: 200
    input: ["patient_id?", "status?", "primary_diet_rule_id?", "secondary_diet_rule_id?", "supersedes_diet_order_id?", "limit?", "offset?"]
    output: "DietOrder[]"
    side_effects: []
  - method: GET
    path: "/nutrition/diet-orders/{id}"
    description: "Read one diet order including its computed effective_* envelope and version"
    roles: [Physician, Dietitian, DietClerk, TrayAide, NutritionManager]
    code: 200
    input: []
    output: DietOrder
    side_effects: []
  - method: POST
    path: "/nutrition/diet-orders/{id}/submit"
    description: "Submit a DRAFT or REVISION_REQUESTED order; forks to ACTIVE when no referenced rule requires a dietitian cosign, otherwise to PENDING_COSIGN"
    roles: [Physician]
    code: 200
    input: []
    output: DietOrder
    side_effects: ["recomputes the effective_* envelope", "on the auto-activation fork, runs the full activation cascade", "increments DietOrder.version by 1"]
  - method: POST
    path: "/nutrition/diet-orders/{id}/request-revision"
    description: "Send a PENDING_COSIGN order back to the prescriber"
    roles: [Dietitian]
    code: 200
    input: [revision_note]
    output: DietOrder
    side_effects: ["increments revision_round by 1", "increments DietOrder.version by 1"]
  - method: POST
    path: "/nutrition/diet-orders/{id}/cosign"
    description: "Cosign and activate a PENDING_COSIGN order; the cosigner may not be the ordering physician"
    roles: [Dietitian]
    code: 200
    input: []
    output: DietOrder
    side_effects: ["activates the order and supersedes the patient's prior ACTIVE order", "re-pins and reverts that order's trays, releasing their tray slots and cents", "recomputes the affected MealPeriod cost rollup and forecast variance", "increments DietOrder.version by 1"]
  - method: POST
    path: "/nutrition/diet-orders/{id}/discontinue"
    description: "Discontinue a PENDING_COSIGN or ACTIVE diet order"
    roles: [Physician]
    code: 200
    input: []
    output: DietOrder
    side_effects: ["clears Patient.active_diet_order_id when the order was ACTIVE", "flags pinned open trays for revalidation", "increments DietOrder.version by 1"]

  # --- Meal periods ---
  - method: POST
    path: "/nutrition/meal-periods"
    description: "Schedule a ward meal service period with its cutoff and delivery window"
    roles: [NutritionManager]
    code: 201
    input: [ward_id, period_code, service_date, order_cutoff_at, window_start_at, window_end_at, production_capacity_trays, "cost_ceiling_cents?"]
    output: MealPeriod
    side_effects: ["status initialised to PLANNED", "rejects a window that collides with another period on the same ward under closed-interval comparison"]
  - method: GET
    path: "/nutrition/meal-periods"
    description: "List meal periods"
    roles: [Physician, Dietitian, DietClerk, TrayAide, NutritionManager]
    code: 200
    input: ["ward_id?", "period_code?", "service_date?", "status?", "limit?", "offset?"]
    output: "MealPeriod[]"
    side_effects: []
  - method: GET
    path: "/nutrition/meal-periods/{id}"
    description: "Read one meal period including committed trays, committed cents, forecast and cost rollup"
    roles: [Physician, Dietitian, DietClerk, TrayAide, NutritionManager]
    code: 200
    input: []
    output: MealPeriod
    side_effects: []
  - method: POST
    path: "/nutrition/meal-periods/{id}/lock-forecast"
    description: "Pin a production forecast variant and lock the period"
    roles: [NutritionManager]
    code: 200
    input: [forecast_variant]
    output: MealPeriod
    side_effects: ["computes forecast_tray_count, forecast_cost_cents and forecast_variance_pct", "sets locked_at", "increments MealPeriod.version by 1"]
  - method: POST
    path: "/nutrition/meal-periods/{id}/open-service"
    description: "Open the tray line for production"
    roles: [NutritionManager]
    code: 200
    input: []
    output: MealPeriod
    side_effects: ["increments MealPeriod.version by 1"]
  - method: POST
    path: "/nutrition/meal-periods/{id}/close"
    description: "Close the period and mark every undelivered tray MISSED"
    roles: [NutritionManager]
    code: 200
    input: []
    output: MealPeriod
    side_effects: ["cascades undelivered trays to MISSED with missed_reason PERIOD_CLOSED", "updates patient missed-meal counters and may auto-create an URGENT consult", "recomputes committed counters, the cost rollup and the forecast variance", "increments MealPeriod.version by 1"]

  # --- Menu items ---
  - method: POST
    path: "/nutrition/menu-items"
    description: "Publish a menu item with its nutrition, texture, allergen and temperature-class profile"
    roles: [NutritionManager]
    code: 201
    input: [item_code, display_name, sodium_mg, potassium_mg, carb_g, protein_g, unit_cost_cents, texture_level, service_temp_class, "liquid_level?", "allergen_codes?", "tag_codes?"]
    output: MenuItem
    side_effects: ["status initialised to ACTIVE"]
  - method: GET
    path: "/nutrition/menu-items"
    description: "List menu items"
    roles: [Physician, Dietitian, DietClerk, TrayAide, NutritionManager]
    code: 200
    input: ["status?", "texture_level?", "service_temp_class?", "limit?", "offset?"]
    output: "MenuItem[]"
    side_effects: []
  - method: GET
    path: "/nutrition/menu-items/{id}"
    description: "Read one menu item"
    roles: [Physician, Dietitian, DietClerk, TrayAide, NutritionManager]
    code: 200
    input: []
    output: MenuItem
    side_effects: []
  - method: PATCH
    path: "/nutrition/menu-items/{id}"
    description: "Discontinue, reinstate or re-price a menu item"
    roles: [NutritionManager]
    code: 200
    input: ["status?", "unit_cost_cents?"]
    output: MenuItem
    side_effects: ["increments MenuItem.version by 1", "a DISCONTINUED item can no longer be ordered, substituted in, or validated"]

  # --- Meal orders ---
  - method: POST
    path: "/nutrition/meal-orders"
    description: "Place an on-demand room-service tray for a patient in a meal period, pinned to the patient's active diet order"
    roles: [DietClerk]
    code: 201
    input: [patient_id, meal_period_id, diet_order_id, expected_diet_order_version, lines]
    output: MealOrder
    side_effects: ["creates one MealOrderLine per lines entry", "computes nutrient totals, per-line costs and food_cost_cents", "stamps pinned_diet_order_version", "increments DietOrder.linked_meal_order_count by 1 and increments DietOrder.version by 1", "fulfillment_status initialised to PENDING_VALIDATION and qa_status to NOT_CHECKED"]
  - method: GET
    path: "/nutrition/meal-orders"
    description: "List meal orders; filters cover the patient, period and diet-order foreign keys and both state dimensions"
    roles: [Physician, Dietitian, DietClerk, TrayAide, NutritionManager]
    code: 200
    input: ["patient_id?", "meal_period_id?", "diet_order_id?", "fulfillment_status?", "qa_status?", "limit?", "offset?"]
    output: "MealOrder[]"
    side_effects: []
  - method: GET
    path: "/nutrition/meal-orders/{id}"
    description: "Read one meal order including both state dimensions, nutrient totals, cost and compliance"
    roles: [Physician, Dietitian, DietClerk, TrayAide, NutritionManager]
    code: 200
    input: []
    output: MealOrder
    side_effects: []
  - method: POST
    path: "/nutrition/meal-orders/{id}/validate"
    description: "Run the full safety and capacity ladder and reserve a tray slot"
    roles: [DietClerk]
    code: 200
    input: []
    output: MealOrder
    side_effects: ["refreshes the envelope snapshot, nutrient totals and costs", "reserves one tray slot and adds food_cost_cents to the period ledger", "recomputes the period cost rollup and forecast variance", "clears revalidation_required", "increments MealOrder.version by 1 and MealPeriod.version by 1"]
  - method: POST
    path: "/nutrition/meal-orders/{id}/start-production"
    description: "Send a validated tray to the tray line"
    roles: [TrayAide]
    code: 200
    input: []
    output: MealOrder
    side_effects: ["increments MealOrder.version by 1"]
  - method: POST
    path: "/nutrition/meal-orders/{id}/plate"
    description: "Record the tray as plated and ready for quality assurance"
    roles: [TrayAide]
    code: 200
    input: []
    output: MealOrder
    side_effects: ["increments MealOrder.version by 1"]
  - method: POST
    path: "/nutrition/meal-orders/{id}/accuracy-check"
    description: "Record a tray accuracy check on the qa_status dimension"
    roles: [TrayAide]
    code: 200
    input: [observed_line_count, "defect_codes?"]
    output: MealOrder
    side_effects: ["sets qa_status to ACCURACY_PASSED or ACCURACY_FAILED", "increments accuracy_retry_count on failure", "stamps accuracy_checked_by_user_id", "increments MealOrder.version by 1"]
  - method: POST
    path: "/nutrition/meal-orders/{id}/temperature-check"
    description: "Record probe readings on the qa_status dimension; the recording user may not be the one who recorded the accuracy check"
    roles: [TrayAide]
    code: 200
    input: ["hot_probe_celsius?", "cold_probe_celsius?"]
    output: MealOrder
    side_effects: ["sets qa_status to TEMP_PASSED or TEMP_FAILED", "increments temperature_retry_count on failure", "stamps temperature_checked_by_user_id", "increments MealOrder.version by 1"]
  - method: POST
    path: "/nutrition/meal-orders/{id}/deliver"
    description: "Record bedside delivery and score the service"
    roles: [TrayAide]
    code: 200
    input: []
    output: MealOrder
    side_effects: ["sets delivered_at, delivery_window_compliance and service_compliance_score", "increments MealPeriod.delivered_tray_count by 1", "increments MealOrder.version by 1 and MealPeriod.version by 1"]
  - method: POST
    path: "/nutrition/meal-orders/{id}/cancel"
    description: "Cancel a tray and, when it held a committed slot, return both the slot and its cents to the period"
    roles: [DietClerk]
    code: 200
    input: []
    output: MealOrder
    side_effects: ["releases the tray slot and cents when cancelling from VALIDATED, IN_PRODUCTION or PLATED", "recomputes the period cost rollup and forecast variance", "increments MealOrder.version by 1"]

  # --- Meal order lines ---
  - method: GET
    path: "/nutrition/meal-order-lines"
    description: "List tray lines; filters cover the owning tray, the current menu item and the pre-substitution menu item"
    roles: [Physician, Dietitian, DietClerk, TrayAide, NutritionManager]
    code: 200
    input: ["meal_order_id?", "menu_item_id?", "substituted_from_menu_item_id?", "line_status?", "limit?", "offset?"]
    output: "MealOrderLine[]"
    side_effects: []
  - method: GET
    path: "/nutrition/meal-order-lines/{id}"
    description: "Read one tray line including its rounded line_cost_cents"
    roles: [Physician, Dietitian, DietClerk, TrayAide, NutritionManager]
    code: 200
    input: []
    output: MealOrderLine
    side_effects: []
  - method: POST
    path: "/nutrition/meal-orders/{id}/lines/{line_id}/substitute"
    description: "Swap a tray line onto a different menu item, re-running the safety checks for the new item"
    roles: [DietClerk, Dietitian]
    code: 200
    input: [substitute_menu_item_id, "substitution_reason?"]
    output: MealOrderLine
    side_effects: ["sets line_status SUBSTITUTED and records substituted_from_menu_item_id", "recomputes the tray nutrient totals, line_cost_cents and food_cost_cents", "increments MealOrderLine.version by 1 and MealOrder.version by 1"]

  # --- Procedure holds ---
  - method: POST
    path: "/nutrition/procedure-holds"
    description: "Book an NPO hold around a procedure, with optional protective buffers"
    roles: [Physician]
    code: 201
    input: [patient_id, procedure_code, npo_kind, hold_start_at, hold_end_at, "buffer_before_minutes?", "buffer_after_minutes?"]
    output: ProcedureHold
    side_effects: ["computes buffered_start_at and buffered_end_at", "status initialised to SCHEDULED", "rejects a buffered interval that collides with another SCHEDULED or ACTIVE hold on the same patient under half-open comparison"]
  - method: GET
    path: "/nutrition/procedure-holds"
    description: "List procedure holds"
    roles: [Physician, Dietitian, DietClerk, TrayAide, NutritionManager]
    code: 200
    input: ["patient_id?", "status?", "limit?", "offset?"]
    output: "ProcedureHold[]"
    side_effects: []
  - method: GET
    path: "/nutrition/procedure-holds/{id}"
    description: "Read one procedure hold"
    roles: [Physician, Dietitian, DietClerk, TrayAide, NutritionManager]
    code: 200
    input: []
    output: ProcedureHold
    side_effects: []
  - method: POST
    path: "/nutrition/procedure-holds/{id}/activate"
    description: "Activate the hold, imposing NPO and voiding every tray whose service window the hold covers"
    roles: [Physician]
    code: 200
    input: []
    output: ProcedureHold
    side_effects: ["sets Patient.npo_status", "cascades covered trays to MISSED with missed_reason NPO_HOLD", "releases their tray slots and cents and recomputes the period rollups", "updates missed-meal counters and may auto-create an URGENT consult", "recomputes Ward.active_patient_census", "increments ProcedureHold.version by 1 and Patient.version by 1"]
  - method: POST
    path: "/nutrition/procedure-holds/{id}/release"
    description: "Release the hold and clear NPO; already-missed trays are not resurrected"
    roles: [Physician]
    code: 200
    input: []
    output: ProcedureHold
    side_effects: ["sets Patient.npo_status to NONE", "recomputes Ward.active_patient_census", "increments ProcedureHold.version by 1 and Patient.version by 1"]
  - method: POST
    path: "/nutrition/procedure-holds/{id}/cancel"
    description: "Cancel a scheduled hold before it takes effect"
    roles: [Physician]
    code: 200
    input: []
    output: ProcedureHold
    side_effects: ["frees the buffered interval for later holds", "increments ProcedureHold.version by 1"]

  # --- Nutrition consults ---
  - method: POST
    path: "/nutrition/nutrition-consults"
    description: "Raise a nutrition consult for a patient"
    roles: [Physician, Dietitian]
    code: 201
    input: [patient_id, reason_code, "acuity?"]
    output: NutritionConsult
    side_effects: ["status initialised to REQUESTED", "requested_by_user_id stamped from X-User-ID", "computes due_at from acuity"]
  - method: GET
    path: "/nutrition/nutrition-consults"
    description: "List nutrition consults"
    roles: [Physician, Dietitian, DietClerk, TrayAide, NutritionManager]
    code: 200
    input: ["patient_id?", "status?", "acuity?", "auto_generated?", "recommended_supplement_item_id?", "limit?", "offset?"]
    output: "NutritionConsult[]"
    side_effects: []
  - method: GET
    path: "/nutrition/nutrition-consults/{id}"
    description: "Read one nutrition consult including its risk score, tier, due_at and version"
    roles: [Physician, Dietitian, DietClerk, TrayAide, NutritionManager]
    code: 200
    input: []
    output: NutritionConsult
    side_effects: []
  - method: POST
    path: "/nutrition/nutrition-consults/{id}/assign"
    description: "Assign the consult to a dietitian"
    roles: [Dietitian]
    code: 200
    input: [dietitian_user_id]
    output: NutritionConsult
    side_effects: ["sets assigned_dietitian_user_id", "increments NutritionConsult.version by 1"]
  - method: POST
    path: "/nutrition/nutrition-consults/{id}/assess"
    description: "Record the malnutrition assessment under the chosen scoring variant"
    roles: [Dietitian]
    code: 200
    input: [assessment_variant, weight_loss_pct, intake_pct, bmi, "albumin_g_dl?", "recommended_supplement_item_id?"]
    output: NutritionConsult
    side_effects: ["computes malnutrition_risk_score and risk_tier", "increments NutritionConsult.version by 1"]
  - method: POST
    path: "/nutrition/nutrition-consults/{id}/sign"
    description: "Sign off the consult; the signer may not be the user who raised it"
    roles: [Dietitian]
    code: 200
    input: []
    output: NutritionConsult
    side_effects: ["sets signed_by_user_id", "unlocks activation of supplement orders on this consult", "increments NutritionConsult.version by 1"]
  - method: POST
    path: "/nutrition/nutrition-consults/{id}/cancel"
    description: "Cancel a consult that has not been signed"
    roles: [Dietitian]
    code: 200
    input: []
    output: NutritionConsult
    side_effects: ["cancels every PENDING SupplementOrder on this consult", "increments NutritionConsult.version by 1"]

  # --- Supplement orders ---
  - method: POST
    path: "/nutrition/supplement-orders"
    description: "Order an oral nutrition supplement against a consult"
    roles: [Dietitian]
    code: 201
    input: [consult_id, menu_item_id, doses_per_day, expected_consult_version]
    output: SupplementOrder
    side_effects: ["copies patient_id from the consult", "computes daily_cost_cents", "status initialised to PENDING", "increments NutritionConsult.linked_supplement_order_count by 1 and increments NutritionConsult.version by 1"]
  - method: GET
    path: "/nutrition/supplement-orders"
    description: "List supplement orders"
    roles: [Physician, Dietitian, DietClerk, TrayAide, NutritionManager]
    code: 200
    input: ["consult_id?", "patient_id?", "menu_item_id?", "status?", "limit?", "offset?"]
    output: "SupplementOrder[]"
    side_effects: []
  - method: GET
    path: "/nutrition/supplement-orders/{id}"
    description: "Read one supplement order"
    roles: [Physician, Dietitian, DietClerk, TrayAide, NutritionManager]
    code: 200
    input: []
    output: SupplementOrder
    side_effects: []
  - method: POST
    path: "/nutrition/supplement-orders/{id}/activate"
    description: "Activate a supplement regimen once its consult is signed"
    roles: [Dietitian]
    code: 200
    input: []
    output: SupplementOrder
    side_effects: ["adds daily_cost_cents to Patient.daily_supplement_cost_cents", "increments SupplementOrder.version by 1 and Patient.version by 1"]
  - method: POST
    path: "/nutrition/supplement-orders/{id}/cancel"
    description: "Cancel a supplement regimen and return its cost to the patient ledger"
    roles: [Dietitian]
    code: 200
    input: []
    output: SupplementOrder
    side_effects: ["subtracts daily_cost_cents from Patient.daily_supplement_cost_cents when the order was ACTIVE", "increments SupplementOrder.version by 1 and Patient.version by 1"]

  # --- Satisfaction surveys ---
  - method: POST
    path: "/nutrition/satisfaction-surveys"
    description: "Record a bedside satisfaction survey for a delivered tray"
    roles: [TrayAide, DietClerk]
    code: 201
    input: [meal_order_id, taste_score, temperature_score, accuracy_score, "comment?"]
    output: SatisfactionSurvey
    side_effects: ["copies patient_id from the tray", "computes composite_score", "recomputes Patient.survey_count and Patient.satisfaction_score_avg", "increments Patient.version by 1"]
  - method: GET
    path: "/nutrition/satisfaction-surveys"
    description: "List satisfaction surveys"
    roles: [Physician, Dietitian, DietClerk, TrayAide, NutritionManager]
    code: 200
    input: ["meal_order_id?", "patient_id?", "limit?", "offset?"]
    output: "SatisfactionSurvey[]"
    side_effects: []
  - method: GET
    path: "/nutrition/satisfaction-surveys/{id}"
    description: "Read one satisfaction survey; surveys are immutable append-only events with no version field"
    roles: [Physician, Dietitian, DietClerk, TrayAide, NutritionManager]
    code: 200
    input: []
    output: SatisfactionSurvey
    side_effects: []

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "X-User-Role or X-User-ID header missing, or X-User-Role is not one of the five declared roles" }
  - { id: ERR_FORBIDDEN_ROLE, http: 403, condition: "The acting role is not listed in the endpoint's roles" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "The acting X-User-ID equals the recorded actor of the paired earlier step: cosign by the ordering physician, temperature check by the accuracy checker, or consult sign by the consult requester" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Malformed body or query: missing required field, wrong type, unrecognised enum member, out-of-range number, limit outside 1..100 or negative offset" }
  - { id: ERR_INVALID_WINDOW, http: 400, condition: "order_cutoff_at is not strictly before window_start_at, window_start_at is not strictly before window_end_at, or hold_start_at is not strictly before hold_end_at" }
  - { id: ERR_WARD_NOT_FOUND, http: 404, condition: "No Ward with the referenced id" }
  - { id: ERR_PATIENT_NOT_FOUND, http: 404, condition: "No Patient with the referenced id" }
  - { id: ERR_DIET_RULE_NOT_FOUND, http: 404, condition: "No TherapeuticDietRule with the referenced id" }
  - { id: ERR_DIET_ORDER_NOT_FOUND, http: 404, condition: "No DietOrder with the referenced id" }
  - { id: ERR_MEAL_PERIOD_NOT_FOUND, http: 404, condition: "No MealPeriod with the referenced id" }
  - { id: ERR_MENU_ITEM_NOT_FOUND, http: 404, condition: "No MenuItem with the referenced id" }
  - { id: ERR_MEAL_ORDER_NOT_FOUND, http: 404, condition: "No MealOrder with the referenced id" }
  - { id: ERR_MEAL_ORDER_LINE_NOT_FOUND, http: 404, condition: "No MealOrderLine with the referenced id, or the line does not belong to the meal order in the path" }
  - { id: ERR_PROCEDURE_HOLD_NOT_FOUND, http: 404, condition: "No ProcedureHold with the referenced id" }
  - { id: ERR_CONSULT_NOT_FOUND, http: 404, condition: "No NutritionConsult with the referenced id" }
  - { id: ERR_SUPPLEMENT_ORDER_NOT_FOUND, http: 404, condition: "No SupplementOrder with the referenced id" }
  - { id: ERR_SURVEY_NOT_FOUND, http: 404, condition: "No SatisfactionSurvey with the referenced id" }
  - { id: ERR_WARD_SUSPENDED, http: 409, condition: "The governing Ward has status SUSPENDED when creating a meal period, locking its forecast or opening its service" }
  - { id: ERR_PATIENT_DISCHARGED, http: 409, condition: "The Patient has status DISCHARGED when a clinical or ordering operation is attempted" }
  - { id: ERR_MEAL_PERIOD_CLOSED, http: 409, condition: "The MealPeriod has status CLOSED when a tray is created or validated against it" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "The target row is not in a declared from-state for the requested transition, including a second attempt at an already-performed transition and any attempt from a terminal state" }
  - { id: ERR_DIET_ORDER_NOT_ACTIVE, http: 409, condition: "The DietOrder a tray is pinned to is not in status ACTIVE at validate time" }
  - { id: ERR_DIET_ORDER_SUPERSEDED, http: 409, condition: "meal_order.pinned_diet_order_version no longer equals the pinned DietOrder.version at validate time, so the tray must be re-priced against the current envelope" }
  - { id: ERR_CONSULT_NOT_SIGNED, http: 409, condition: "The NutritionConsult backing a supplement order is not in status SIGNED at activation time" }
  - { id: ERR_QA_NOT_PASSED, http: 409, condition: "Delivery attempted while qa_status is not TEMP_PASSED" }
  - { id: ERR_STALE_DIET_ORDER_VERSION, http: 412, condition: "expected_diet_order_version does not equal the current DietOrder.version on POST /nutrition/meal-orders" }
  - { id: ERR_STALE_CONSULT_VERSION, http: 412, condition: "expected_consult_version does not equal the current NutritionConsult.version on POST /nutrition/supplement-orders" }
  - { id: ERR_NPO_ACTIVE, http: 422, condition: "The patient's npo_status is NPO_STRICT or NPO_CLEAR_LIQUIDS when a tray is validated or delivered" }
  - { id: ERR_ALLERGEN_CONFLICT, http: 422, condition: "A tray line's menu item declares an allergen code the patient is documented as allergic to" }
  - { id: ERR_TEXTURE_LEVEL_VIOLATION, http: 422, condition: "A tray line's menu item is prepared at a texture ordinal below the tray's effective_texture_level" }
  - { id: ERR_LIQUID_LEVEL_VIOLATION, http: 422, condition: "A tray line's liquid menu item is thickened below the tray's effective_liquid_level" }
  - { id: ERR_FORBIDDEN_TAG, http: 422, condition: "A tray line's menu item carries a tag listed in the pinned diet order's forbidden_tag_codes_effective" }
  - { id: ERR_MENU_ITEM_DISCONTINUED, http: 422, condition: "A referenced MenuItem has status DISCONTINUED" }
  - { id: ERR_DIET_RULE_RETIRED, http: 422, condition: "A referenced TherapeuticDietRule has status RETIRED" }
  - { id: ERR_TEMPERATURE_PROBE_REQUIRED, http: 422, condition: "hot_probe_celsius omitted while requires_hot_probe is true, or cold_probe_celsius omitted while requires_cold_probe is true" }
  - { id: ERR_ALBUMIN_REQUIRED, http: 422, condition: "assessment_variant COMPREHENSIVE submitted without albumin_g_dl" }
  - { id: ERR_NUTRIENT_CAP_EXCEEDED, http: 422, condition: "A tray's recomputed sodium, potassium or carbohydrate total exceeds the corresponding non-null cap on the pinned diet order envelope" }
  - { id: ERR_MEAL_PERIOD_WINDOW_OVERLAP, http: 409, condition: "A new MealPeriod's delivery window collides with an existing period on the same ward under closed-interval comparison, endpoints included" }
  - { id: ERR_PROCEDURE_HOLD_OVERLAP, http: 409, condition: "A new ProcedureHold's buffered interval collides with a SCHEDULED or ACTIVE hold on the same patient under half-open comparison" }
  - { id: ERR_ORDER_CUTOFF_PASSED, http: 422, condition: "The logical clock is at or past meal_period.order_cutoff_at when a tray is created" }
  - { id: ERR_EMPTY_MEAL_ORDER, http: 422, condition: "The lines array supplied on tray creation is empty" }
  - { id: ERR_DUPLICATE_MEAL_ORDER, http: 409, condition: "Another MealOrder already exists for the same patient and meal period with fulfillment_status outside {CANCELLED, MISSED}" }
  - { id: ERR_DUPLICATE_MRN, http: 409, condition: "Another Patient already carries the submitted mrn" }
  - { id: ERR_DUPLICATE_DIET_RULE_CODE, http: 409, condition: "Another TherapeuticDietRule already carries the submitted diet_code" }
  - { id: ERR_DUPLICATE_MENU_ITEM_CODE, http: 409, condition: "Another MenuItem already carries the submitted item_code" }
  - { id: ERR_DUPLICATE_WARD_CODE, http: 409, condition: "Another Ward already carries the submitted code" }
  - { id: ERR_MEAL_ORDER_NOT_DELIVERED, http: 409, condition: "A satisfaction survey is submitted for a tray whose fulfillment_status is not DELIVERED" }
  - { id: ERR_DUPLICATE_SURVEY, http: 409, condition: "A SatisfactionSurvey already exists for the referenced meal order" }
  - { id: ERR_REVISION_LIMIT_EXCEEDED, http: 422, condition: "request-revision attempted when diet_order.revision_round has already reached MAX_REVISION_ROUNDS" }
  - { id: ERR_TRAY_CAPACITY_EXCEEDED, http: 409, condition: "Validating the tray would push meal_period.committed_tray_count past production_capacity_trays" }
  - { id: ERR_PERIOD_COST_CEILING_EXCEEDED, http: 422, condition: "Validating the tray would push meal_period.committed_food_cost_cents past a non-null cost_ceiling_cents" }

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Physician
    description: "Prescribes therapeutic diets and books the NPO holds that coordinate meals with procedures"
    identity: opaque
    exclusive_operations:
      - "POST /nutrition/diet-orders"
      - "POST /nutrition/diet-orders/{id}/submit"
      - "POST /nutrition/diet-orders/{id}/discontinue"
      - "POST /nutrition/procedure-holds"
      - "POST /nutrition/procedure-holds/{id}/activate"
      - "POST /nutrition/procedure-holds/{id}/release"
      - "POST /nutrition/procedure-holds/{id}/cancel"
    shared_operations:
      - "POST /nutrition/nutrition-consults (with Dietitian)"
      - "POST /_clock/set_current_utc (with every role)"
      - "every GET endpoint (with every role)"

  - name: Dietitian
    description: "Owns the therapeutic rule catalogue, cosigns diet orders, and runs the consult and supplement workflow"
    identity: opaque
    exclusive_operations:
      - "POST /nutrition/diet-orders/{id}/cosign"
      - "POST /nutrition/diet-orders/{id}/request-revision"
      - "POST /nutrition/nutrition-consults/{id}/assign"
      - "POST /nutrition/nutrition-consults/{id}/assess"
      - "POST /nutrition/nutrition-consults/{id}/sign"
      - "POST /nutrition/nutrition-consults/{id}/cancel"
      - "POST /nutrition/supplement-orders"
      - "POST /nutrition/supplement-orders/{id}/activate"
      - "POST /nutrition/supplement-orders/{id}/cancel"
    shared_operations:
      - "POST /nutrition/diet-rules and PATCH /nutrition/diet-rules/{id} (with NutritionManager)"
      - "PATCH /nutrition/patients/{id} (with DietClerk)"
      - "POST /nutrition/meal-orders/{id}/lines/{line_id}/substitute (with DietClerk)"
      - "POST /nutrition/nutrition-consults (with Physician)"
      - "POST /_clock/set_current_utc (with every role)"
      - "every GET endpoint (with every role)"

  - name: DietClerk
    description: "Takes room-service orders at the bedside, validates trays against the diet envelope, and cancels them"
    identity: opaque
    exclusive_operations:
      - "POST /nutrition/meal-orders"
      - "POST /nutrition/meal-orders/{id}/validate"
      - "POST /nutrition/meal-orders/{id}/cancel"
    shared_operations:
      - "POST /nutrition/patients and POST /nutrition/patients/{id}/discharge (with NutritionManager)"
      - "PATCH /nutrition/patients/{id} (with Dietitian)"
      - "POST /nutrition/meal-orders/{id}/lines/{line_id}/substitute (with Dietitian)"
      - "POST /nutrition/satisfaction-surveys (with TrayAide)"
      - "POST /_clock/set_current_utc (with every role)"
      - "every GET endpoint (with every role)"

  - name: TrayAide
    description: "Runs the tray line, records the accuracy and temperature checks, and delivers at the bedside"
    identity: opaque
    exclusive_operations:
      - "POST /nutrition/meal-orders/{id}/start-production"
      - "POST /nutrition/meal-orders/{id}/plate"
      - "POST /nutrition/meal-orders/{id}/accuracy-check"
      - "POST /nutrition/meal-orders/{id}/temperature-check"
      - "POST /nutrition/meal-orders/{id}/deliver"
    shared_operations:
      - "POST /nutrition/satisfaction-surveys (with DietClerk)"
      - "POST /_clock/set_current_utc (with every role)"
      - "every GET endpoint (with every role)"

  - name: NutritionManager
    description: "Runs the department: wards, menu catalogue, meal periods, production forecasting and cost"
    identity: opaque
    exclusive_operations:
      - "POST /nutrition/wards and PATCH /nutrition/wards/{id}"
      - "POST /nutrition/menu-items and PATCH /nutrition/menu-items/{id}"
      - "POST /nutrition/meal-periods"
      - "POST /nutrition/meal-periods/{id}/lock-forecast"
      - "POST /nutrition/meal-periods/{id}/open-service"
      - "POST /nutrition/meal-periods/{id}/close"
    shared_operations:
      - "POST /nutrition/diet-rules and PATCH /nutrition/diet-rules/{id} (with Dietitian)"
      - "POST /nutrition/patients and POST /nutrition/patients/{id}/discharge (with DietClerk)"
      - "POST /_clock/set_current_utc (with every role)"
      - "every GET endpoint (with every role)"
