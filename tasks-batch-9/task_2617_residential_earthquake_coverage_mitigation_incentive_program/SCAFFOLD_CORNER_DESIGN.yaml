        distinguishing_aspect: "The declare trigger must move status from MONITORING to DECLARED and bump the event version to 2, since the version is the OCC token that claim filing pins."
        test_recipe:
          setup:
            - "One ACTIVE 2026 layer and one MONITORING magnitude-6.4 event"
          setup_api_calls:
            - call: "POST /eqp/reinsurance-layers"
              payload: { treaty_year: 2026, layer_index: 1, attachment_point_cents: 100000000, limit_cents: 50000000, ceded_pct: 0.90 }
