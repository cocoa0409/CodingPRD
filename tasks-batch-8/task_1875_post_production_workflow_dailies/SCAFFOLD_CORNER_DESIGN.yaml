scaffold_corner_design:
  # ==================================================================
  # Section: entities — creation, retrieval, listing, defaults,
  # required fields, computed fields, system fields, type constraints
  # ==================================================================
  - section: entities
    instances:
      - name: project_create_with_all_required_fields
        claim_type: creation
        grounds: [entities.Project]
        distinguishing_aspect: "POST /projects with all 7 required fields returns 201, status=SETUP, storage_used_gb=0, conform_ready=false, version=1."
        test_recipe:
          setup: ["Empty DB; clock at default 2026-08-01T00:00:00Z"]
          setup_api_calls: []
          trigger:
            - call: "POST /post-production/projects"
              payload: { title: "T", client_code: "CL100", fps: 24, resolution_width: 1920, resolution_height: 1080, storage_quota_gb: 50, security_tier: "STANDARD" }
              as: PostSupervisor
              captures: { proj_id: $.data.id, proj_status: $.data.status, proj_version: $.data.version }
          assert:
            - "proj_status == SETUP"
            - "proj_version == 1"

      - name: project_create_missing_required_field_returns_invalid_request
        claim_type: required_fields
        grounds:
          - "entities.Project"
          - "errors[ERR_INVALID_REQUEST]"
        distinguishing_aspect: "Omitting required `storage_quota_gb` produces ERR_INVALID_REQUEST (400) before any state check runs."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /post-production/projects"
              payload: { title: "T", client_code: "CL101", fps: 24, resolution_width: 1920, resolution_height: 1080, security_tier: "STANDARD" }
              as: PostSupervisor
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_REQUEST"

      - name: project_create_invalid_enum_security_tier
        claim_type: type_constraints
        grounds:
          - "entities.Project.fields.security_tier"
          - "errors[ERR_INVALID_REQUEST]"
        distinguishing_aspect: "security_tier outside {STANDARD, ELEVATED, LOCKDOWN} is rejected with ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /post-production/projects"
              payload: { title: "T", client_code: "CL102", fps: 24, resolution_width: 1920, resolution_height: 1080, storage_quota_gb: 50, security_tier: "PARANOID" }
              as: PostSupervisor
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_REQUEST"

      - name: project_get_not_found
        claim_type: not_found
        grounds:
          - "entities.Project"
          - "errors[ERR_NOT_FOUND]"
        distinguishing_aspect: "GET /projects/{nonexistent-uuid} returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /post-production/projects/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: PostSupervisor
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_NOT_FOUND"

      - name: project_list_pagination_defaults
        claim_type: listing
        grounds: [entities.Project, response_envelope]
        distinguishing_aspect: "GET /projects with no limit/offset uses defaults (limit=10, offset=0); response carries total_count and has_more."
        test_recipe:
          setup: ["Empty DB; 3 projects created"]
          setup_api_calls:
            - call: "POST /post-production/projects"
              payload: { title: "A", client_code: "CLA", fps: 24, resolution_width: 1920, resolution_height: 1080, storage_quota_gb: 10, security_tier: "STANDARD" }
              as: PostSupervisor
            - call: "POST /post-production/projects"
              payload: { title: "B", client_code: "CLB", fps: 24, resolution_width: 1920, resolution_height: 1080, storage_quota_gb: 10, security_tier: "STANDARD" }
              as: PostSupervisor
            - call: "POST /post-production/projects"
              payload: { title: "C", client_code: "CLC", fps: 24, resolution_width: 1920, resolution_height: 1080, storage_quota_gb: 10, security_tier: "STANDARD" }
              as: PostSupervisor
          trigger:
            - call: "GET /post-production/projects"
              payload: {}
              as: PostSupervisor
          assert:
            - "response.meta.response_type == array"
            - "len(response.data) == 3"
            - "response includes pagination fields limit, offset, total_count, has_more"

      - name: project_list_filter_by_status
        claim_type: listing
        grounds: [entities.Project, endpoints]
        distinguishing_aspect: "GET /projects?status=SETUP returns only SETUP projects; projects that advanced to ACTIVE are excluded."
        test_recipe:
          setup: ["Empty DB; one SETUP project, one ACTIVE project"]
          setup_api_calls:
            - call: "POST /post-production/projects"
              payload: { title: "S", client_code: "CLS", fps: 24, resolution_width: 1920, resolution_height: 1080, storage_quota_gb: 10, security_tier: "STANDARD" }
              as: PostSupervisor
              captures: { proj_s: $.data.id }
            - call: "POST /post-production/projects"
              payload: { title: "A", client_code: "CLA2", fps: 24, resolution_width: 1920, resolution_height: 1080, storage_quota_gb: 10, security_tier: "STANDARD" }
              as: PostSupervisor
              captures: { proj_a: $.data.id }
            - call: "POST /post-production/projects/${proj_a}/watermark-profiles"
              payload: { profile_name: "wm", opacity_pct: 80, position: "CENTER", includes_recipient_email: true, forensic_enabled: true }
              as: PostSupervisor
              captures: { wm_a: $.data.id }
            - call: "POST /post-production/projects/${proj_a}/watermark-profiles/${wm_a}/activate"
              payload: {}
              as: PostSupervisor
            - call: "POST /post-production/projects/${proj_a}/bays"
              payload: { bay_name: "BAY-A", bay_type: "OFFLINE", capacity_hours_per_day: 8 }
              as: PostSupervisor
            - call: "POST /post-production/projects/${proj_a}/activate"
              payload: {}
              as: PostSupervisor
          trigger:
            - call: "GET /post-production/projects?status=SETUP"
              payload: {}
              as: PostSupervisor
          assert:
            - "every item in response.data has status == SETUP"
            - "response.data contains proj_s and does not contain proj_a"

      - name: media_batch_create_end_before_start_returns_invalid_request
        claim_type: type_constraints
        grounds: [entities.MediaBatch.fields.ingest_window_end]
        distinguishing_aspect: "ingest_window_end <= ingest_window_start is rejected with ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["Project P exists in SETUP"]
          setup_api_calls:
            - call: "POST /post-production/projects"
              payload: { title: "P", client_code: "CL103", fps: 24, resolution_width: 1920, resolution_height: 1080, storage_quota_gb: 10, security_tier: "STANDARD" }
              as: PostSupervisor
              captures: { proj_id: $.data.id }
          trigger:
            - call: "POST /post-production/projects/${proj_id}/batches"
              payload: { batch_label: "DAYX", ingest_window_start: "2026-08-10T17:00:00Z", ingest_window_end: "2026-08-10T09:00:00Z" }
              as: MediaManager
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_REQUEST"

      - name: media_asset_create_computed_proxy_status_pending
        claim_type: computed_fields
        grounds: [entities.MediaAsset.fields.proxy_status, entities.MediaAsset.fields.proxy_bytes]
        distinguishing_aspect: "New MediaAsset is created with proxy_status=PENDING and proxy_bytes=0; any client-supplied proxy_status/proxy_bytes is ignored."
        test_recipe:
          setup: ["Project P ACTIVE; Batch B INGESTING"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: FacilityAdmin
            - call: "POST /post-production/projects"
              payload: { title: "P", client_code: "CL104", fps: 24, resolution_width: 1920, resolution_height: 1080, storage_quota_gb: 10, security_tier: "STANDARD" }
              as: PostSupervisor
              captures: { proj_id: $.data.id }
            - call: "POST /post-production/projects/${proj_id}/watermark-profiles"
              payload: { profile_name: "wm", opacity_pct: 80, position: "CENTER", includes_recipient_email: true, forensic_enabled: true }
              as: PostSupervisor
              captures: { wm_id: $.data.id }
            - call: "POST /post-production/projects/${proj_id}/watermark-profiles/${wm_id}/activate"
              payload: {}
              as: PostSupervisor
            - call: "POST /post-production/projects/${proj_id}/bays"
              payload: { bay_name: "BAY-01", bay_type: "OFFLINE", capacity_hours_per_day: 8 }
              as: PostSupervisor
            - call: "POST /post-production/projects/${proj_id}/activate"
              payload: {}
              as: PostSupervisor
            - call: "POST /post-production/projects/${proj_id}/batches"
              payload: { batch_label: "D1", ingest_window_start: "2026-07-31T00:00:00Z", ingest_window_end: "2026-08-31T23:59:59Z" }
              as: MediaManager
              captures: { batch_id: $.data.id }
            - call: "POST /post-production/projects/${proj_id}/batches/${batch_id}/start-ingest"
              payload: {}
              as: MediaManager
          trigger:
            - call: "POST /post-production/projects/${proj_id}/assets"
              payload: { batch_id: "${batch_id}", reel_name: "A001", clip_name: "C001", source_bytes: 1000, duration_frames: 100 }
              as: MediaManager
              captures: { proxy_status: $.data.proxy_status, proxy_bytes: $.data.proxy_bytes }
          assert:
            - "proxy_status == PENDING"
            - "proxy_bytes == 0"

      - name: qcreport_immutable_no_update_endpoint
        claim_type: immutability
        grounds: [entities.QCReport]
        distinguishing_aspect: "QCReport is common_fields: false — append-only. There is no PATCH/PUT endpoint for QCReport; only POST (create) and GET (list)."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /post-production/projects/00000000-0000-0000-0000-000000000000/deliverables/00000000-0000-0000-0000-000000000000/qc-reports"
              payload: {}
              as: QCOperator
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_NOT_FOUND   # parent project doesn't exist; QCReport has no direct update path in the endpoint table"

  # ==================================================================
  # Section: state_machines — invalid transitions, terminal lockdown,
  # precondition enforcement, side-effect execution, initial state
  # ==================================================================
  - section: state_machines
    instances:
      - name: project_archive_from_active_returns_invalid_state
        claim_type: invalid_transition
        grounds:
          - "state_machines.Project"
          - "errors[ERR_INVALID_STATE]"
        distinguishing_aspect: "ACTIVE -> ARCHIVED is not a declared transition; only CLOSED -> ARCHIVED is. POST /archive on an ACTIVE project returns ERR_INVALID_STATE."
        test_recipe:
          setup: ["Project P ACTIVE"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: FacilityAdmin
            - call: "POST /post-production/projects"
              payload: { title: "P", client_code: "CL200", fps: 24, resolution_width: 1920, resolution_height: 1080, storage_quota_gb: 10, security_tier: "STANDARD" }
              as: PostSupervisor
              captures: { proj_id: $.data.id }
            - call: "POST /post-production/projects/${proj_id}/watermark-profiles"
              payload: { profile_name: "wm", opacity_pct: 80, position: "CENTER", includes_recipient_email: true, forensic_enabled: true }
              as: PostSupervisor
              captures: { wm_id: $.data.id }
            - call: "POST /post-production/projects/${proj_id}/watermark-profiles/${wm_id}/activate"
              payload: {}
              as: PostSupervisor
            - call: "POST /post-production/projects/${proj_id}/bays"
              payload: { bay_name: "BAY-01", bay_type: "OFFLINE", capacity_hours_per_day: 8 }
              as: PostSupervisor
            - call: "POST /post-production/projects/${proj_id}/activate"
              payload: {}
              as: PostSupervisor
          trigger:
            - call: "POST /post-production/projects/${proj_id}/archive"
              payload: {}
              as: PostSupervisor
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_STATE"

      - name: terminal_state_lockdown_deliverable
        claim_type: terminal_state_lockdown
        grounds:
          - "state_machines.Deliverable"
        distinguishing_aspect: "A DELIVERED deliverable is terminal; attempting render on it returns ERR_INVALID_STATE (or ERR_ALREADY_TERMINAL); no transition fires."
        test_recipe:
          setup: ["Project P ACTIVE with conform_ready; Deliverable D requires_qc=false, already DELIVERED"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: FacilityAdmin
            - call: "POST /post-production/projects"
              payload: { title: "P", client_code: "CL201", fps: 24, resolution_width: 1920, resolution_height: 1080, storage_quota_gb: 100, security_tier: "STANDARD" }
              as: PostSupervisor
              captures: { proj_id: $.data.id }
            - call: "POST /post-production/projects/${proj_id}/watermark-profiles"
              payload: { profile_name: "wm", opacity_pct: 80, position: "CENTER", includes_recipient_email: true, forensic_enabled: true }
              as: PostSupervisor
              captures: { wm_id: $.data.id }
            - call: "POST /post-production/projects/${proj_id}/watermark-profiles/${wm_id}/activate"
              payload: {}
              as: PostSupervisor
            - call: "POST /post-production/projects/${proj_id}/bays"
              payload: { bay_name: "BAY-01", bay_type: "ONLINE", capacity_hours_per_day: 8 }
              as: PostSupervisor
            - call: "POST /post-production/projects/${proj_id}/activate"
              payload: {}
              as: PostSupervisor
            - call: "POST /post-production/projects/${proj_id}/batches"
              payload: { batch_label: "D1", ingest_window_start: "2026-07-31T00:00:00Z", ingest_window_end: "2026-08-31T23:59:59Z" }
              as: MediaManager
              captures: { batch_id: $.data.id }
            - call: "POST /post-production/projects/${proj_id}/batches/${batch_id}/start-ingest"
              payload: {}
              as: MediaManager
            - call: "POST /post-production/projects/${proj_id}/assets"
              payload: { batch_id: "${batch_id}", reel_name: "A001", clip_name: "C001", source_bytes: 1000, duration_frames: 100 }
              as: MediaManager
              captures: { asset_id: $.data.id }
            - call: "POST /post-production/projects/${proj_id}/batches/${batch_id}/finish-ingest"
              payload: {}
              as: MediaManager
            - call: "POST /post-production/projects/${proj_id}/assets/${asset_id}/proxy-complete"
              payload: { proxy_bytes: 500 }
              as: MediaManager
            - call: "POST /post-production/projects/${proj_id}/assets/${asset_id}/verify"
              payload: {}
              as: MediaManager
            - call: "POST /post-production/projects/${proj_id}/turnovers"
              payload: { turnover_kind: "CONFORM", sequence_label: "SEQ-01" }
              as: ConformEditor
              captures: { turn_id: $.data.id }
            - call: "POST /post-production/projects/${proj_id}/turnovers/${turn_id}/stage"
              payload: {}
              as: ConformEditor
            - call: "POST /post-production/vendors"
              payload: { vendor_name: "V1", capabilities: ["CONFORM"], day_rate_cents: 400000, capacity_slots: 2 }
              as: FacilityAdmin
              captures: { vendor_id: $.data.id }
            - call: "POST /post-production/projects/${proj_id}/vendor-bids"
              payload: { turnover_id: "${turn_id}", vendor_id: "${vendor_id}", bid_amount_cents: 500000, eta_days: 3 }
              as: VendorRep
              as_user_id: "${vendor_id}"
              captures: { bid_id: $.data.id }
            - call: "POST /post-production/projects/${proj_id}/vendor-bids/${bid_id}/award"
              payload: {}
              as: PostSupervisor
            - call: "POST /post-production/projects/${proj_id}/turnovers/${turn_id}/issue"
              payload: {}
              as: PostSupervisor
            - call: "POST /post-production/projects/${proj_id}/assets/${asset_id}/conform"
              payload: {}
              as: ConformEditor
            - call: "POST /post-production/projects/${proj_id}/assets/${asset_id}/lock"
              payload: {}
              as: ConformEditor
            - call: "POST /post-production/projects/${proj_id}/deliverables"
              payload: { spec_kind: "MEZZANINE", sequence_label: "SEQ-01", container: "MOV_PRORES", requires_qc: false }
              as: ConformEditor
              captures: { del_id: $.data.id }
            - call: "GET /post-production/projects/${proj_id}"
              payload: {}
              as: PostSupervisor
              captures: { proj_v: $.data.version }
            - call: "POST /post-production/projects/${proj_id}/deliverables/${del_id}/render"
              payload: { expected_project_version: "${proj_v}" }
              as: ConformEditor
            - call: "POST /post-production/projects/${proj_id}/deliverables/${del_id}/render-complete"
              payload: {}
              as: ConformEditor
            - call: "POST /post-production/projects/${proj_id}/deliverables/${del_id}/deliver"
              payload: {}
              as: PostSupervisor
            - call: "GET /post-production/projects/${proj_id}"
              payload: {}
              as: PostSupervisor
              captures: { proj_v2: $.data.version }
          trigger:
            - call: "POST /post-production/projects/${proj_id}/deliverables/${del_id}/render"
              payload: { expected_project_version: "${proj_v2}" }
              as: ConformEditor
              captures: { err: $.data.error_id }
          assert:
            - "err in {ERR_INVALID_STATE, ERR_ALREADY_TERMINAL}"
            - "Deliverable.${del_id}.status == DELIVERED"

      - name: initial_state_media_batch_is_declared
        claim_type: initial_state
        grounds:
          - "state_machines.MediaBatch"
        distinguishing_aspect: "POST /batches creates a batch whose status is DECLARED, never INGESTING or PROXYING."
        test_recipe:
          setup: ["Project P in SETUP"]
          setup_api_calls:
            - call: "POST /post-production/projects"
              payload: { title: "P", client_code: "CL202", fps: 24, resolution_width: 1920, resolution_height: 1080, storage_quota_gb: 10, security_tier: "STANDARD" }
              as: PostSupervisor
              captures: { proj_id: $.data.id }
          trigger:
            - call: "POST /post-production/projects/${proj_id}/batches"
              payload: { batch_label: "D1", ingest_window_start: "2026-08-01T00:00:00Z", ingest_window_end: "2026-08-31T23:59:59Z" }
              as: MediaManager
              captures: { st: $.data.status }
          assert:
            - "st == DECLARED"

      - name: review_round_approve_with_unresolved_critical_returns_invalid_state
        claim_type: precondition_enforcement
        grounds:
          - "state_machines.ReviewRound.NOTES_CLOSED_to_APPROVED"
        distinguishing_aspect: "Approve is blocked while unresolved_critical == true; returns ERR_INVALID_STATE. Resolving the CRITICAL note then allows approval."
        test_recipe:
          setup: ["Project P ACTIVE; ReviewRound RR in NOTES_CLOSED with one CRITICAL note still OPEN"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: FacilityAdmin
            - call: "POST /post-production/projects"
              payload: { title: "P", client_code: "CL203", fps: 24, resolution_width: 1920, resolution_height: 1080, storage_quota_gb: 100, security_tier: "STANDARD" }
              as: PostSupervisor
              captures: { proj_id: $.data.id }
            - call: "POST /post-production/projects/${proj_id}/watermark-profiles"
              payload: { profile_name: "wm", opacity_pct: 80, position: "CENTER", includes_recipient_email: true, forensic_enabled: true }
              as: PostSupervisor
              captures: { wm_id: $.data.id }
            - call: "POST /post-production/projects/${proj_id}/watermark-profiles/${wm_id}/activate"
              payload: {}
              as: PostSupervisor
            - call: "POST /post-production/projects/${proj_id}/bays"
              payload: { bay_name: "BAY-01", bay_type: "ONLINE", capacity_hours_per_day: 8 }
              as: PostSupervisor
            - call: "POST /post-production/projects/${proj_id}/activate"
              payload: {}
              as: PostSupervisor
            - call: "POST /post-production/projects/${proj_id}/batches"
              payload: { batch_label: "D1", ingest_window_start: "2026-07-31T00:00:00Z", ingest_window_end: "2026-08-31T23:59:59Z" }
              as: MediaManager
              captures: { batch_id: $.data.id }
            - call: "POST /post-production/projects/${proj_id}/batches/${batch_id}/start-ingest"
              payload: {}
              as: MediaManager
            - call: "POST /post-production/projects/${proj_id}/assets"
              payload: { batch_id: "${batch_id}", reel_name: "A001", clip_name: "C001", source_bytes: 1000, duration_frames: 100 }
              as: MediaManager
              captures: { asset_id: $.data.id }
            - call: "POST /post-production/projects/${proj_id}/batches/${batch_id}/finish-ingest"
              payload: {}
              as: MediaManager
            - call: "POST /post-production/projects/${proj_id}/assets/${asset_id}/proxy-complete"
              payload: { proxy_bytes: 500 }
              as: MediaManager
            - call: "POST /post-production/projects/${proj_id}/dailies"
              payload: { batch_id: "${batch_id}", watermark_profile_id: "${wm_id}", distribution_list: ["rcpt@x.com"] }
              as: DailiesCoordinator
              captures: { pkg_id: $.data.id }
            - call: "POST /post-production/projects/${proj_id}/dailies/${pkg_id}/publish"
              payload: {}
              as: DailiesCoordinator
            - call: "POST /post-production/projects/${proj_id}/review-rounds"
              payload: { round_label: "RR-01", target_kind: "DAILIES", target_ref_id: "${pkg_id}" }
              as: ReviewerLead
              captures: { rr_id: $.data.id }
            - call: "POST /post-production/projects/${proj_id}/review-notes"
              payload: { round_id: "${rr_id}", author_email: "rev@x.com", severity: "CRITICAL", body: "bad frame at 12" }
              as: ReviewerLead
              captures: { note_id: $.data.id }
            - call: "POST /post-production/projects/${proj_id}/review-rounds/${rr_id}/close-notes"
              payload: {}
              as: ReviewerLead
          trigger:
            - call: "POST /post-production/projects/${proj_id}/review-rounds/${rr_id}/approve"
              payload: {}
              as: ReviewerLead
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_STATE"
            - "ReviewRound.${rr_id}.status == NOTES_CLOSED"

      - name: booking_idempotent_second_checkin_returns_invalid_state
        claim_type: idempotency
        grounds:
          - "state_machines.Booking.RESERVED_to_CHECKED_IN"
        distinguishing_aspect: "Second POST /check-in on an already CHECKED_IN booking returns ERR_INVALID_STATE; no duplicate transition fires."
        test_recipe:
          setup: ["Booking B in CHECKED_IN state for current logical date and hour"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T10:30:00Z" }
              as: FacilityAdmin
            - call: "POST /post-production/projects"
              payload: { title: "P", client_code: "CL204", fps: 24, resolution_width: 1920, resolution_height: 1080, storage_quota_gb: 10, security_tier: "STANDARD" }
              as: PostSupervisor
              captures: { proj_id: $.data.id }
            - call: "POST /post-production/projects/${proj_id}/watermark-profiles"
              payload: { profile_name: "wm", opacity_pct: 80, position: "CENTER", includes_recipient_email: true, forensic_enabled: true }
              as: PostSupervisor
              captures: { wm_id: $.data.id }
            - call: "POST /post-production/projects/${proj_id}/watermark-profiles/${wm_id}/activate"
              payload: {}
              as: PostSupervisor
            - call: "POST /post-production/projects/${proj_id}/bays"
              payload: { bay_name: "BAY-01", bay_type: "OFFLINE", capacity_hours_per_day: 8 }
              as: PostSupervisor
              captures: { bay_id: $.data.id, bay_v: $.data.version }
            - call: "POST /post-production/projects/${proj_id}/activate"
              payload: {}
