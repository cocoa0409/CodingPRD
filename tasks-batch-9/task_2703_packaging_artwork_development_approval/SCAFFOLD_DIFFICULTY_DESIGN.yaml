            - "ArtworkVersion.${v1_id}.state == OBSOLETE_PENDING and ArtworkAsset.${asset_id}.obsolescence_state == SUPERSEDE_PENDING - the cascade is rewound exactly one step, not to ACTIVE"
            - "ArtworkAsset.${asset_id}.current_approved_version_id is still ${v2_id} and ArtworkVersion.${v2_id}.state is still APPROVED"
            - "the second POST /inventory-runouts/${runout_id}/disposition-reversal returns 409 with data.error_id == ERR_RUNOUT_STATE_INVALID (priority 33 admits reversal only from SCRAPPED), and reversal_count is still 1 with both ledgers still 0"
