              payload: {}
              as: PlanAdmin
            - call: "POST /participants"
              payload: { plan_id: "${plan_id}", full_name: "L", date_of_birth: "1980-06-15T00:00:00Z", hire_date: "2018-06-15T00:00:00Z", annual_compensation_cents: 50000000, deferral_rate_bps: 400 }
              as: PlanAdmin
              captures: { p_id: $.data.id }
            - call: "POST /participants/${p_id}/enroll"
              payload: {}
              as: PlanAdmin
            - call: "POST /contribution-periods"
              payload: { participant_id: "${p_id}", period_end_date: "2026-06-15T00:00:00Z", gross_compensation_cents: 10000000 }
              as: PlanAdmin
              captures: { cp_id: $.data.id }
            - call: "POST /contribution-periods/${cp_id}/close"
              payload: {}
              as: PlanAdmin
            - call: "POST /loans"
              payload: { participant_id: "${p_id}", principal_cents: 10000, term_months: 12, annual_interest_rate_bps: 700 }
              as: PlanAdmin
              captures: { loan_a_id: $.data.id }
            - call: "POST /loans/${loan_a_id}/disburse"
              payload: {}
              as: PlanAdmin
            - call: "POST /loans"
              payload: { participant_id: "${p_id}", principal_cents: 10000, term_months: 12, annual_interest_rate_bps: 700 }
              as: PlanAdmin
              captures: { loan_b_id: $.data.id }
