# =============================================================================
# 1.8 Scaffold Difficulty Design (Test Targeting Index)
# Task 2720 - Supermarket Refrigerant Management & Leak Compliance
#
# Every instance is standalone: its setup_api_calls chain drives an empty
# database into the described precondition using only endpoints declared in
# SCAFFOLD.yaml §1.5. The logical clock starts at 2026-08-01T00:00:00Z and is
# always set explicitly anyway. Every numeric assert literal below was computed
# by executing the §1.3 formula against its constants.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: leak_rate_rolling_average_vs_annualizing_diverge_on_one_system
        grounds:
          - calculations.system_leak_rate_pct
          - entities.RefrigerantSystem.fields.leak_rate_method
          - entities.RefrigerantSystem.fields.leak_rate_baseline_at
          - entities.RefrigerantSystem.fields.leak_rate_pct
        distinguishing_aspect: |
          This dual variant lives on the RefrigerantSystem domain (a per-asset
          leak-rate percentage): the ROLLING_AVERAGE variant reads the trailing
          365 days with no time normalisation while ANNUALIZING divides by the
          days since leak_rate_baseline_at and scales by 365, so one identical
          10.0 lb addition on a 100.0 lb system 90 days after the baseline
          reads 10.0 percent under one variant and 40.6 percent under the other.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z."
            - "One store, one R-404A chemistry (gwp 3922, HIGH, HFC)."
            - "SYS_ANN: COMMERCIAL_REFRIGERATION, full_charge_lbs 100.0, initial_charge_lbs 90.0, installed_on 2026-05-03T00:00:00Z (exactly 90 days before the clock), leak_rate_method ANNUALIZING; applicability REGULATED, threshold_pct 20.0, required_certification_type TYPE_II, leak_rate_baseline_at == installed_on."
            - "One TYPE_II technician, one HIGH-class recovery machine verified 2026-06-01, one 50.0 lb cylinder holding 40.0 lbs of R-404A."
            - "One ADD_REFRIGERANT service record moves 10.0 lbs into the system at 2026-08-01T00:00:00Z, taking current_charge_lbs to 100.0."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /stores"
              payload: { name: "Northgate Market", store_code: "NG-001", state_code: "CA", region: "WEST" }
              as: ComplianceManager
              captures: { store_id: $.data.id }
            - call: "POST /refrigerant-types"
              payload: { name: "R-404A", gwp: 3922, pressure_class: "HIGH", ods_class: "HFC", phasedown_status: "RESTRICTED_NEW_EQUIPMENT" }
              as: ComplianceManager
              captures: { rt404_id: $.data.id }
            - call: "POST /systems"
              payload: { store_id: "${store_id}", refrigerant_type_id: "${rt404_id}", system_category: "COMMERCIAL_REFRIGERATION", full_charge_lbs: 100.0, initial_charge_lbs: 90.0, installed_on: "2026-05-03T00:00:00Z", leak_rate_method: "ANNUALIZING" }
              as: ComplianceManager
              captures: { sys_ann_id: $.data.id }
            - call: "POST /technicians"
              payload: { full_name: "Dana Ruiz", epa_certification_number: "EPA-608-11111", certification_type: "TYPE_II", certification_expires_on: "2027-12-31T00:00:00Z" }
              as: ComplianceManager
              captures: { tech1_id: $.data.id }
            - call: "POST /recovery-equipment"
              payload: { store_id: "${store_id}", assigned_technician_id: "${tech1_id}", equipment_serial: "RM-9001", certified_to_standard: "AHRI_740_2016", certified_for_pressure_class: "HIGH", last_verification_on: "2026-06-01T00:00:00Z" }
              as: ComplianceManager
              captures: { eq1_id: $.data.id }
            - call: "POST /cylinders"
              payload: { store_id: "${store_id}", refrigerant_type_id: "${rt404_id}", cylinder_serial: "CYL-0001", nominal_capacity_lbs: 50.0, initial_contents_lbs: 40.0 }
              as: ComplianceManager
              captures: { cyl1_id: $.data.id }
            - call: "GET /systems/${sys_ann_id}"
              payload: {}
              as: ComplianceManager
              captures: { sys_ann_v: $.data.version }
            - call: "POST /service-records"
              payload: { system_id: "${sys_ann_id}", technician_id: "${tech1_id}", recovery_equipment_id: "${eq1_id}", cylinder_id: "${cyl1_id}", service_type: "ADD_REFRIGERANT", refrigerant_added_lbs: 10.0, performed_at: "2026-08-01T00:00:00Z", duration_minutes: 120, expected_system_version: "${sys_ann_v}" }
              as: Technician
              as_user_id: "${tech1_id}"
              captures: { rec_ann_id: $.data.id }
          trigger:
            - call: "GET /systems/${sys_ann_id}/leak-rate-projection"
              payload: {}
              as: ComplianceManager
              captures: { proj_default_rate: $.data.leak_rate_pct, proj_default_start: $.data.window_start }
            - call: "GET /systems/${sys_ann_id}/leak-rate-projection"
              payload: { method: "ROLLING_AVERAGE" }
              as: ComplianceManager
              captures: { proj_rolling_rate: $.data.leak_rate_pct, proj_rolling_start: $.data.window_start }
          assert:
            - "ServiceRecord.${rec_ann_id}.system_charge_after_lbs == 100.0"
            - "ServiceRecord.${rec_ann_id}.leak_rate_pct_after == 40.6"
            - "RefrigerantSystem.${sys_ann_id}.leak_rate_pct == 40.6"
            - "leak-rate-projection default (system method ANNUALIZING): leak_rate_pct == 40.6, method == ANNUALIZING, window_start == 2026-05-03T00:00:00Z, refrigerant_added_lbs_in_window == 10.0, would_trigger_leak_event == true"
            - "leak-rate-projection with method=ROLLING_AVERAGE: leak_rate_pct == 10.0, window_start == 2025-08-01T00:00:00Z, refrigerant_added_lbs_in_window == 10.0, would_trigger_leak_event == false"
            - "The two variants differ by exactly 30.6 percentage points on identical ledger data, and only ANNUALIZING crosses threshold_pct 20.0"

      - name: period_leaked_mass_charge_based_vs_balance_based_diverge_on_one_store
        grounds:
          - calculations.store_period_leaked_lbs
          - entities.RegulatoryReport.fields.leaked_lbs_method
          - entities.RegulatoryReport.fields.total_leaked_lbs
          - state_machines.RegulatoryReport.SUBMITTED_to_REJECTED
        distinguishing_aspect: |
          This dual variant lives on a different entity domain than the leak-rate
          one - it is a Store-level reported mass on a RegulatoryReport, not a
          per-system percentage: CHARGE_BASED counts every pound added in the
          period as leaked (20.0) while BALANCE_BASED nets the opening and
          closing ledger charge against the additions (80.0 + 20.0 - 0.0 - 100.0
          == 0.0) for the very same ledger.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z."
            - "One store, R-404A, SYS1 with full_charge_lbs 100.0, initial_charge_lbs 80.0, installed_on 2025-01-15T00:00:00Z, leak_rate_method ROLLING_AVERAGE."
            - "One 20.0 lb ADD_REFRIGERANT record at 2026-08-01T00:00:00Z inside the reporting period, taking current_charge_lbs from 80.0 to 100.0."
            - "A first ANNUAL_LEAK_RATE report for 2026-07-01..2026-08-01 using CHARGE_BASED is filed, submitted and REJECTED, so the period is free for a second filing."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /stores"
              payload: { name: "Northgate Market", store_code: "NG-001", state_code: "CA", region: "WEST" }
              as: ComplianceManager
              captures: { store_id: $.data.id }
            - call: "POST /refrigerant-types"
              payload: { name: "R-404A", gwp: 3922, pressure_class: "HIGH", ods_class: "HFC", phasedown_status: "RESTRICTED_NEW_EQUIPMENT" }
              as: ComplianceManager
              captures: { rt404_id: $.data.id }
            - call: "POST /systems"
              payload: { store_id: "${store_id}", refrigerant_type_id: "${rt404_id}", system_category: "COMMERCIAL_REFRIGERATION", full_charge_lbs: 100.0, initial_charge_lbs: 80.0, installed_on: "2025-01-15T00:00:00Z", leak_rate_method: "ROLLING_AVERAGE" }
              as: ComplianceManager
              captures: { sys1_id: $.data.id }
            - call: "POST /technicians"
              payload: { full_name: "Dana Ruiz", epa_certification_number: "EPA-608-11111", certification_type: "TYPE_II", certification_expires_on: "2027-12-31T00:00:00Z" }
              as: ComplianceManager
              captures: { tech1_id: $.data.id }
            - call: "POST /recovery-equipment"
              payload: { store_id: "${store_id}", assigned_technician_id: "${tech1_id}", equipment_serial: "RM-9001", certified_to_standard: "AHRI_740_2016", certified_for_pressure_class: "HIGH", last_verification_on: "2026-06-01T00:00:00Z" }
              as: ComplianceManager
              captures: { eq1_id: $.data.id }
            - call: "POST /cylinders"
              payload: { store_id: "${store_id}", refrigerant_type_id: "${rt404_id}", cylinder_serial: "CYL-0001", nominal_capacity_lbs: 50.0, initial_contents_lbs: 40.0 }
              as: ComplianceManager
              captures: { cyl1_id: $.data.id }
            - call: "GET /systems/${sys1_id}"
              payload: {}
              as: ComplianceManager
              captures: { sys1_v: $.data.version }
            - call: "POST /service-records"
              payload: { system_id: "${sys1_id}", technician_id: "${tech1_id}", recovery_equipment_id: "${eq1_id}", cylinder_id: "${cyl1_id}", service_type: "ADD_REFRIGERANT", refrigerant_added_lbs: 20.0, performed_at: "2026-08-01T00:00:00Z", duration_minutes: 120, expected_system_version: "${sys1_v}" }
              as: Technician
              as_user_id: "${tech1_id}"
            - call: "POST /regulatory-reports"
              payload: { store_id: "${store_id}", report_type: "ANNUAL_LEAK_RATE", period_start: "2026-07-01T00:00:00Z", period_end: "2026-08-01T00:00:00Z", leaked_lbs_method: "CHARGE_BASED" }
              as: ComplianceManager
              captures: { rep_charge_id: $.data.id, rep_charge_total: $.data.total_leaked_lbs }
            - call: "POST /regulatory-reports/${rep_charge_id}/submission"
              payload: {}
              as: ComplianceManager
            - call: "POST /regulatory-reports/${rep_charge_id}/decision"
              payload: { decision: "REJECT", rejection_reason_code: "METHOD_CHANGE_REQUESTED" }
              as: Regulator
          trigger:
            - call: "POST /regulatory-reports"
              payload: { store_id: "${store_id}", report_type: "ANNUAL_LEAK_RATE", period_start: "2026-07-01T00:00:00Z", period_end: "2026-08-01T00:00:00Z", leaked_lbs_method: "BALANCE_BASED" }
              as: ComplianceManager
              captures: { rep_balance_id: $.data.id, rep_balance_total: $.data.total_leaked_lbs }
          assert:
            - "RegulatoryReport.${rep_charge_id}.total_leaked_lbs == 20.0"
            - "RegulatoryReport.${rep_charge_id}.included_system_count == 1"
            - "RegulatoryReport.${rep_charge_id}.status == REJECTED"
            - "RegulatoryReport.${rep_balance_id}.total_leaked_lbs == 0.0"
            - "RegulatoryReport.${rep_balance_id}.included_system_count == 1"
            - "The two variants differ by exactly 20.0 lbs on identical ServiceRecord data for the same store and period"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: penalty_exposure_per_citation_rounding_mode_b
        grounds:
          - calculations.inspection_penalty_exposure
          - calculations.store_compliance_posture
          - entities.Inspection.fields.penalty_exposure_usd
          - entities.Inspection.fields.chronic_multiplier_applied
        distinguishing_aspect: |
          Mode b - per-item rounding before summation. Each citation is rounded
          to 2 decimals on its own and only then summed, so two MINOR citations
          of one violation day each at the NON_COMPLIANT multiplier 1.50 give
          round(275.55*1*1.50,2) == 413.33 twice == 826.66, whereas summing the
          raw products first (551.10*1.50 == 826.65) and rounding once yields a
          one-cent-lower total. The half-cent lands exactly on the .005 boundary
          in each citation, so the two orders cannot agree.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z, one store, R-404A, SYS1 (full 100.0, initial 80.0, ROLLING_AVERAGE, threshold 20.0)."
            - "A 20.0 lb ADD_REFRIGERANT record at 2026-08-01T00:00:00Z pushes the rolling leak rate to exactly 20.0 percent and auto-opens a LeakEvent with initial_repair_deadline 2026-08-31T00:00:00Z."
            - "Clock advances to 2026-09-01T00:00:00Z and a compliance run sweeps the event to REPAIR_OVERDUE, so Store.overdue_leak_event_count == 1 and Store.compliance_status == NON_COMPLIANT (multiplier 1.50)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /stores"
              payload: { name: "Northgate Market", store_code: "NG-001", state_code: "CA", region: "WEST" }
              as: ComplianceManager
              captures: { store_id: $.data.id }
            - call: "POST /refrigerant-types"
              payload: { name: "R-404A", gwp: 3922, pressure_class: "HIGH", ods_class: "HFC", phasedown_status: "RESTRICTED_NEW_EQUIPMENT" }
              as: ComplianceManager
              captures: { rt404_id: $.data.id }
            - call: "POST /systems"
              payload: { store_id: "${store_id}", refrigerant_type_id: "${rt404_id}", system_category: "COMMERCIAL_REFRIGERATION", full_charge_lbs: 100.0, initial_charge_lbs: 80.0, installed_on: "2025-01-15T00:00:00Z", leak_rate_method: "ROLLING_AVERAGE" }
              as: ComplianceManager
              captures: { sys1_id: $.data.id }
            - call: "POST /technicians"
              payload: { full_name: "Dana Ruiz", epa_certification_number: "EPA-608-11111", certification_type: "TYPE_II", certification_expires_on: "2027-12-31T00:00:00Z" }
              as: ComplianceManager
              captures: { tech1_id: $.data.id }
            - call: "POST /recovery-equipment"
              payload: { store_id: "${store_id}", assigned_technician_id: "${tech1_id}", equipment_serial: "RM-9001", certified_to_standard: "AHRI_740_2016", certified_for_pressure_class: "HIGH", last_verification_on: "2026-06-01T00:00:00Z" }
              as: ComplianceManager
              captures: { eq1_id: $.data.id }
            - call: "POST /cylinders"
              payload: { store_id: "${store_id}", refrigerant_type_id: "${rt404_id}", cylinder_serial: "CYL-0001", nominal_capacity_lbs: 50.0, initial_contents_lbs: 40.0 }
              as: ComplianceManager
              captures: { cyl1_id: $.data.id }
            - call: "GET /systems/${sys1_id}"
              payload: {}
              as: ComplianceManager
              captures: { sys1_v: $.data.version }
            - call: "POST /service-records"
              payload: { system_id: "${sys1_id}", technician_id: "${tech1_id}", recovery_equipment_id: "${eq1_id}", cylinder_id: "${cyl1_id}", service_type: "ADD_REFRIGERANT", refrigerant_added_lbs: 20.0, performed_at: "2026-08-01T00:00:00Z", duration_minutes: 120, expected_system_version: "${sys1_v}" }
              as: Technician
              as_user_id: "${tech1_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /compliance-runs"
              payload: { store_id: "${store_id}" }
              as: PlatformAdmin
            - call: "GET /stores/${store_id}"
              payload: {}
              as: ComplianceManager
              captures: { posture: $.data.compliance_status }
          trigger:
            - call: "POST /inspections"
              payload: { store_id: "${store_id}", inspector_name: "CARB Field Office", citations: [ { citation_code: "608-LEAK-REPAIR-LATE", severity: "MINOR", violation_days: 1 }, { citation_code: "608-RECORDS-INCOMPLETE", severity: "MINOR", violation_days: 1 } ] }
              as: Regulator
              captures: { insp_id: $.data.id, insp_penalty: $.data.penalty_exposure_usd }
          assert:
            - "Store.${store_id}.overdue_leak_event_count == 1"
            - "Store.${store_id}.compliance_status == NON_COMPLIANT"
            - "Inspection.${insp_id}.chronic_multiplier_applied == 1.50"
            - "Inspection.${insp_id}.penalty_exposure_usd == 826.66"
            - "Inspection.${insp_id}.penalty_exposure_usd != 826.65 (the sum-then-round answer)"
            - "Inspection.${insp_id}.capped == false"
            - "Store.${store_id}.penalty_exposure_total_usd == 826.66"

      - name: late_filing_surcharge_bracket_keyed_on_base_mode_c
        grounds:
          - calculations.late_filing_assessment
          - state_machines.RegulatoryReport.DRAFT_to_SUBMITTED
          - entities.RegulatoryReport.fields.base_assessment_usd
          - entities.RegulatoryReport.fields.administrative_surcharge_usd
          - entities.RegulatoryReport.fields.late_filing_assessment_usd
        distinguishing_aspect: |
          Mode c - a bracket keyed on one named component rather than on the
          running total. The 0.05 / 0.10 / 0.18 surcharge rate is chosen from
          base_assessment_usd alone (990.00 < 1000.00 -> 0.05 -> 49.50 -> total
          1039.50); choosing it from a total that already carries the surcharge
          (1039.50 >= 1000.00 -> 0.10 -> 99.00 -> total 1089.00) differs by
          49.50. Six days late is deliberately the value that straddles the
          1000.00 bracket edge only after the surcharge is folded in.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z, one store, one R-404A system so the report has a system in scope."
            - "A DRAFT ANNUAL_LEAK_RATE report for period 2026-01-01..2026-06-30 (CHARGE_BASED); its filing due date is period_end + 60 days == 2026-08-29T00:00:00Z."
            - "Clock advances to 2026-09-04T00:00:00Z, exactly 6 days past the due date."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /stores"
              payload: { name: "Northgate Market", store_code: "NG-001", state_code: "CA", region: "WEST" }
              as: ComplianceManager
              captures: { store_id: $.data.id }
            - call: "POST /refrigerant-types"
              payload: { name: "R-404A", gwp: 3922, pressure_class: "HIGH", ods_class: "HFC", phasedown_status: "RESTRICTED_NEW_EQUIPMENT" }
              as: ComplianceManager
              captures: { rt404_id: $.data.id }
            - call: "POST /systems"
              payload: { store_id: "${store_id}", refrigerant_type_id: "${rt404_id}", system_category: "COMMERCIAL_REFRIGERATION", full_charge_lbs: 100.0, initial_charge_lbs: 80.0, installed_on: "2025-01-15T00:00:00Z", leak_rate_method: "ROLLING_AVERAGE" }
              as: ComplianceManager
              captures: { sys1_id: $.data.id }
            - call: "POST /regulatory-reports"
              payload: { store_id: "${store_id}", report_type: "ANNUAL_LEAK_RATE", period_start: "2026-01-01T00:00:00Z", period_end: "2026-06-30T00:00:00Z", leaked_lbs_method: "CHARGE_BASED" }
              as: ComplianceManager
              captures: { rep_id: $.data.id, rep_due: $.data.due_on }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-04T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /regulatory-reports/${rep_id}/submission"
              payload: {}
              as: ComplianceManager
              captures: { rep_days_late: $.data.days_late, rep_total: $.data.late_filing_assessment_usd }
          assert:
            - "RegulatoryReport.${rep_id}.due_on == 2026-08-29T00:00:00Z"
            - "RegulatoryReport.${rep_id}.days_late == 6"
            - "RegulatoryReport.${rep_id}.base_assessment_usd == 990.00"
            - "RegulatoryReport.${rep_id}.administrative_surcharge_usd == 49.50"
            - "RegulatoryReport.${rep_id}.late_filing_assessment_usd == 1039.50"
            - "RegulatoryReport.${rep_id}.late_filing_assessment_usd != 1089.00 (the total-keyed bracket answer)"
            - "RegulatoryReport.${rep_id}.status == SUBMITTED"

      - name: retrofit_compatibility_conditional_component_branches_mode_a
        grounds:
          - calculations.retrofit_compatibility_score
          - entities.RetrofitPlan.fields.compatibility_score
          - entities.RetrofitPlan.fields.compatibility_result
          - entities.RetrofitPlan.fields.gwp_reduction_pct
          - state_machines.RetrofitPlan.DRAFT_to_SUPERSEDED
        distinguishing_aspect: |
          Mode a - three inputs feeding conditional branches inside one weighted
          sum. gwp_component is continuous, pressure_component is a two-way
          branch (100.0 same class / 40.0 different) and family_component is a
          three-way branch (100.0 same ods_class / 70.0 HFC-HFO pair / 50.0
          otherwise); the components are never pre-rounded. R-404A -> R-448A
          keeps the HIGH pressure class and the HFC family and scores 84.1
          COMPATIBLE, while R-404A -> R-245fa flips only the pressure branch to
          40.0 and drops to 70.2 CONDITIONALLY_COMPATIBLE even though its target
          GWP is lower - a lower-GWP target scoring worse is the branch signal.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z, one store."
            - "Three chemistries: R-404A (gwp 3922, HIGH, HFC), R-448A (gwp 1387, HIGH, HFC, ALLOWED), R-245fa (gwp 1030, LOW, HFC, ALLOWED)."
            - "SYS1 charged with R-404A, full_charge_lbs 100.0, initial_charge_lbs 80.0."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /stores"
              payload: { name: "Northgate Market", store_code: "NG-001", state_code: "CA", region: "WEST" }
              as: ComplianceManager
              captures: { store_id: $.data.id }
            - call: "POST /refrigerant-types"
              payload: { name: "R-404A", gwp: 3922, pressure_class: "HIGH", ods_class: "HFC", phasedown_status: "RESTRICTED_NEW_EQUIPMENT" }
              as: ComplianceManager
              captures: { rt404_id: $.data.id }
            - call: "POST /refrigerant-types"
              payload: { name: "R-448A", gwp: 1387, pressure_class: "HIGH", ods_class: "HFC", phasedown_status: "ALLOWED" }
              as: ComplianceManager
              captures: { rt448_id: $.data.id }
            - call: "POST /refrigerant-types"
              payload: { name: "R-245fa", gwp: 1030, pressure_class: "LOW", ods_class: "HFC", phasedown_status: "ALLOWED" }
              as: ComplianceManager
              captures: { rt245_id: $.data.id }
            - call: "POST /systems"
              payload: { store_id: "${store_id}", refrigerant_type_id: "${rt404_id}", system_category: "COMMERCIAL_REFRIGERATION", full_charge_lbs: 100.0, initial_charge_lbs: 80.0, installed_on: "2025-01-15T00:00:00Z", leak_rate_method: "ROLLING_AVERAGE" }
              as: ComplianceManager
              captures: { sys1_id: $.data.id }
            - call: "GET /systems/${sys1_id}"
              payload: {}
              as: ComplianceManager
              captures: { sys1_v: $.data.version }
            - call: "POST /retrofit-plans"
