              captures: { first_listed_status: "$.data[0].audit_status" }
          assert:
            - "the first audit recomputed 250000 * 320 * 150 / 120000 == 100000 for variance_cents == 0, so it forked to PASSED and closing it set audited_monthly_benefit_cents == 100000 and accounting_liability_cents == 11460000"
            - "the second audit has audit_sequence == 2, recomputed_monthly_benefit_cents == 112500 (250000 * 360 * 150 / 120000) and variance_cents == 12500, so audit_status == CORRECTION_REQUIRED"
