      - name: second_appeal_while_the_first_is_open_returns_409_appeal_already_open
        claim_type: Violation → Error
        grounds:
          - errors[ERR_APPEAL_ALREADY_OPEN]
        distinguishing_aspect: "The one-open-appeal rule is scoped to the undecided statuses {SUBMITTED, UNDER_REVIEW} and to the player, not to the direction: a DOWN appeal is blocked by an open UP appeal because the constraint counts rows, not intents. Once the first appeal reaches a terminal status the constraint releases, so an implementation that keys uniqueness on player_id alone permanently locks the player out."
        test_recipe:
          setup:
            - "A COMPUTER_RATED player at 3.5 holds one SUBMITTED appeal asking to move up to 4.0 and files a second one asking to move down to 3.0."
          setup_api_calls:
            - *c_t0
            - *a_sec
            - *a_pa1
            - *a_ra1
            - *a_chair
            - *a_ap1
          trigger:
            - call: "POST /tennis/rating-appeals"
              payload: {player_id: "${pa1_id}", direction: "DOWN", requested_level: 3.0, reason: "On reflection the level is too high."}
              as: Player
              as_user_id: "${pa1_id}"
          assert:
            - "HTTP 409"
            - "$.data.error_id == 'ERR_APPEAL_ALREADY_OPEN'"
            - "$.data.error_id != 'ERR_INVALID_RATING_LEVEL' because 3.0 is a legal half-step inside [2.5, 5.0]"
            - "a follow-up GET /tennis/rating-appeals with player_id=${pa1_id} returns $.data.total_count == 1 with items[0].direction == 'UP' and items[0].requested_level == 4.0"
            - "after POST /tennis/rating-appeals/${ap1_id}/start-review and POST /tennis/rating-appeals/${ap1_id}/decide with outcome DENY as CommitteeChair ${chair_id}, the identical DOWN filing returns HTTP 201 because DENIED is not an open status"

      - name: vote_on_a_submitted_appeal_returns_409_subject_not_under_review
        claim_type: Violation → Error
        grounds:
          - errors[ERR_SUBJECT_NOT_UNDER_REVIEW]
        distinguishing_aspect: "Voting is gated on the subject's own status, not on the ballot's wellformedness: the subject resolves, the voter is a disinterested CommitteeMember and the payload is complete, yet SUBMITTED is one step short of open. The chair's start-review is the single act that opens the ballot, which is what makes the vote counters trustworthy."
        test_recipe:
          setup:
            - "An appeal has been filed and sits SUBMITTED; the chair has not started the review yet. A disinterested committee member tries to vote."
          setup_api_calls:
            - *c_t0
            - *a_sec
            - *a_pa1
            - *a_ra1
            - *a_chair
            - *a_cm1
            - *a_ap1
          trigger:
            - call: "POST /tennis/committee-votes"
              payload: {subject_type: "RATING_APPEAL", subject_id: "${ap1_id}", vote: "SUPPORT", note: "Dynamic rating supports the move."}
              as: CommitteeMember
              as_user_id: "${cm1_id}"
          assert:
            - "HTTP 409"
            - "$.data.error_id == 'ERR_SUBJECT_NOT_UNDER_REVIEW'"
            - "$.data.error_id != 'ERR_SOD_INTERESTED_PARTY' because ${cm1_id} is neither the appellant nor a party to the appeal"
            - "$.data.error_id != 'ERR_SUBJECT_TYPE_MISMATCH' because ${ap1_id} does resolve inside RatingAppeal"
            - "a follow-up GET /tennis/rating-appeals/${ap1_id} returns $.data.status == 'SUBMITTED', $.data.support_vote_count == 0 and $.data.oppose_vote_count == 0"
            - "a follow-up GET /tennis/players/${cm1_id}/committee-votes returns $.data.total_count == 0"
            - "after POST /tennis/rating-appeals/${ap1_id}/start-review as CommitteeChair ${chair_id} the identical ballot returns HTTP 201 and the appeal reports support_vote_count == 1"

      - name: granting_an_appeal_with_no_votes_returns_422_quorum_not_met
        claim_type: Violation → Error
        grounds:
          - errors[ERR_QUORUM_NOT_MET]
        distinguishing_aspect: "GRANT has two independent gateways — the auto-grant verdict pinned at filing, or a live committee quorum of support_vote_count >= 2 with support > oppose. This appellant has zero verified matches so auto_grant_eligible was pinned false, and no ballots have been cast, so both gateways are shut. DENY needs neither gateway, which is why the same endpoint with the other outcome must succeed from the identical state."
        test_recipe:
          setup:
            - "The appeal is UNDER_REVIEW with zero votes. The appellant has no verified matches, so auto_grant_eligible was pinned false at filing: the match floor for a COMPUTER_RATED player is 3."
          setup_api_calls:
            - *c_t0
            - *a_sec
            - *a_pa1
            - *a_ra1
            - *a_chair
            - *a_cm1
            - *a_ap1
            - *a_ap1_review
          trigger:
            - call: "POST /tennis/rating-appeals/${ap1_id}/decide"
              payload: {outcome: "GRANT", decision_note: "Chair is persuaded on the merits."}
              as: CommitteeChair
              as_user_id: "${chair_id}"
          assert:
            - "HTTP 422"
            - "$.data.error_id == 'ERR_QUORUM_NOT_MET'"
            - "$.data.error_id != 'ERR_AUTO_GRANT_MUST_BE_GRANTED' because auto_grant_eligible is false here"
            - "$.data.error_id != 'ERR_CHAIR_VOTED_ON_SUBJECT' because the chair cast no ballot"
            - "a follow-up GET /tennis/rating-appeals/${ap1_id} returns $.data.status == 'UNDER_REVIEW', $.data.granted_level == null, $.data.decided_at == null and $.data.auto_grant_eligible == false"
            - "a follow-up GET /tennis/players/${pa1_id} returns $.data.rating_level == 3.5 and $.data.rating_type == 'COMPUTER_RATED'"
            - "the same decide call with outcome DENY returns HTTP 200 with $.data.status == 'DENIED', showing the quorum guards only the grant path"
            - "with two SUPPORT ballots from two distinct CommitteeMembers first, the GRANT returns HTTP 200 with $.data.granted_level == 4.0 and the player's rating_type == 'APPEAL_GRANTED'"

