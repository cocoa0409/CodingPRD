scaffold_difficulty_design:

  # =========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: cancellation_refund_provisional_vs_final_diverge_on_booking
        grounds:
          - calculations.cancellation_refund
          - state_machines.Booking.CONFIRMED_to_CANCELLED
          - endpoints["GET /bookings/{id}/cancellation-quote"]
          - entities.Booking.fields.refund_cents
        distinguishing_aspect: |
          On the Booking domain: a PROVISIONAL quote taken at lead_hours=200 (MODERATE 100% band) returns
          113000, but the FINAL refund committed at lead_hours=100 (MODERATE 50% band) writes refund_cents=56500
          for identical booking data — divergence is driven by the clock crossing a tier boundary.
        test_recipe:
          setup:
            - "MODERATE-tier listing, base 20000/night, 10% tax; CONFIRMED booking 2026-07-10..2026-07-13 (subtotal 102000, tax 11000, refundable_base 113000)."
            - "Clock first at 2026-07-01T16:00:00Z (lead 200h)."
          setup_api_calls:
            - call: "POST /hosts"
              payload: { email: "h1@x.com", display_name: "Host One" }
              as: Anonymous
              captures: { h1: $.data.id }
            - call: "POST /guests"
              payload: { email: "g1@x.com", full_name: "Guest One", govt_id_verified: true, prior_cancellations: 1, chargeback_flag: false }
              as: Anonymous
              captures: { g1: $.data.id }
            - call: "POST /listings"
              payload: { host_id: "${h1}", title: "Beach House", base_nightly_rate_cents: 20000, cleaning_fee_cents: 5000, pet_fee_cents: 3000, tax_rate_bps: 1000, min_nights: 1, gap_nights: 0, cancellation_tier: "MODERATE", security_deposit_cents: 10000, platform_commission_bps: 1500, payout_delay_days: 1 }
              as: Host
              as_user_id: "${h1}"
              captures: { l1: $.data.id }
            - call: "POST /rate-plans"
              payload: { listing_id: "${l1}", label: "PEAK", window_start: "2026-07-01", window_end: "2026-07-31", seasonal_multiplier_bps: 15000, weekend_multiplier_bps: 12000 }
              as: Host
              as_user_id: "${h1}"
            - call: "POST /listings/${l1}/publish"
              payload: {}
              as: Host
              as_user_id: "${h1}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T16:00:00Z" }
              as: PlatformAdmin
            - call: "GET /listings/${l1}"
              payload: {}
              as: Guest
              as_user_id: "${g1}"
              captures: { l1_cv_44: $.data.calendar_version }
            - call: "POST /bookings"
              payload: { listing_id: "${l1}", guest_id: "${g1}", check_in: "2026-07-10", check_out: "2026-07-13", pets_count: 1, expected_listing_calendar_version: "${l1_cv_44}" }
              as: Guest
              as_user_id: "${g1}"
              captures: { b1: $.data.id }
            - call: "POST /bookings/${b1}/screen"
              payload: {}
              as: Host
              as_user_id: "${h1}"
            - call: "POST /bookings/${b1}/approve"
              payload: {}
              as: Host
              as_user_id: "${h1}"
            - call: "POST /bookings/${b1}/confirm"
              payload: {}
              as: Guest
              as_user_id: "${g1}"
          trigger:
            - call: "GET /bookings/${b1}/cancellation-quote"
              payload: {}
              as: Guest
              as_user_id: "${g1}"
              captures: { quote_refund: $.data.refund_cents }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-05T20:00:00Z" }
              as: PlatformAdmin
            - call: "POST /bookings/${b1}/cancel"
              payload: {}
              as: Guest
              as_user_id: "${g1}"
          assert:
            - "GET /bookings/${b1}/cancellation-quote at clock 2026-07-01T16:00:00Z returns refund_cents == 113000 (applied_pct 100)"
            - "Booking.${b1}.refund_cents == 56500 after cancel at clock 2026-07-05T20:00:00Z (applied_pct 50)"
            - "Booking.${b1}.status == CANCELLED"

      - name: payout_estimate_vs_actual_diverge_on_payout
        grounds:
          - calculations.payout_amount
          - state_machines.Booking.APPROVED_to_CONFIRMED
          - state_machines.Payout.SCHEDULED_to_RELEASED
          - entities.Payout.fields.estimated_cents
          - entities.Payout.fields.actual_cents
        distinguishing_aspect: |
          On the Payout domain (distinct from the Booking-domain refund): estimated_cents=93500 is written at
          confirmation with no deposit deductions, while actual_cents=89500 is written at release after a 4000
          APPROVED DamageClaim deduction — same booking, two algorithms, different numbers.
        test_recipe:
          setup:
            - "CONFIRMED booking with gross 110000 (subtotal 102000 + fees 8000), commission 16500 -> estimate 93500."
            - "Stay completed; one APPROVED DamageClaim approved_cents=4000; clock past release_after."
          setup_api_calls:
            - call: "POST /hosts"
              payload: { email: "h2@x.com", display_name: "Host Two" }
              as: Anonymous
              captures: { h2: $.data.id }
            - call: "POST /guests"
              payload: { email: "g2@x.com", full_name: "Guest Two", govt_id_verified: true, prior_cancellations: 0, chargeback_flag: false }
              as: Anonymous
              captures: { g2: $.data.id }
            - call: "POST /listings"
              payload: { host_id: "${h2}", title: "Beach House 2", base_nightly_rate_cents: 20000, cleaning_fee_cents: 5000, pet_fee_cents: 3000, tax_rate_bps: 1000, min_nights: 1, gap_nights: 0, cancellation_tier: "MODERATE", security_deposit_cents: 10000, platform_commission_bps: 1500, payout_delay_days: 1 }
              as: Host
              as_user_id: "${h2}"
              captures: { l2: $.data.id }
            - call: "POST /rate-plans"
              payload: { listing_id: "${l2}", label: "PEAK", window_start: "2026-07-01", window_end: "2026-07-31", seasonal_multiplier_bps: 15000, weekend_multiplier_bps: 12000 }
              as: Host
              as_user_id: "${h2}"
            - call: "POST /listings/${l2}/publish"
              payload: {}
              as: Host
              as_user_id: "${h2}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T16:00:00Z" }
              as: PlatformAdmin
            - call: "GET /listings/${l2}"
              payload: {}
              as: Guest
              as_user_id: "${g2}"
              captures: { l2_cv_119: $.data.calendar_version }
            - call: "POST /bookings"
              payload: { listing_id: "${l2}", guest_id: "${g2}", check_in: "2026-07-10", check_out: "2026-07-13", pets_count: 1, expected_listing_calendar_version: "${l2_cv_119}" }
              as: Guest
              as_user_id: "${g2}"
              captures: { b2: $.data.id }
            - call: "POST /bookings/${b2}/screen"
              payload: {}
              as: Host
              as_user_id: "${h2}"
            - call: "POST /bookings/${b2}/approve"
              payload: {}
              as: Host
              as_user_id: "${h2}"
            - call: "POST /bookings/${b2}/confirm"
              payload: {}
              as: Guest
              as_user_id: "${g2}"
              captures: { dep2: $.data.id }
            - call: "GET /bookings/${b2}/security-deposits"
              payload: {}
              as: Host
              as_user_id: "${h2}"
              captures: { sd2: $.data.0.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-10T12:00:00Z" }
              as: PlatformAdmin
            - call: "POST /security-deposits/${sd2}/claims"
              payload: { security_deposit_id: "${sd2}", amount_cents: 4000, reason: "Broken lamp" }
              as: Host
              as_user_id: "${h2}"
              captures: { dc2: $.data.id }
            - call: "POST /damage-claims/${dc2}/review"
              payload: {}
              as: PlatformAdmin
            - call: "POST /damage-claims/${dc2}/approve"
              payload: {}
              as: PlatformAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-15T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /bookings/${b2}/complete"
              payload: {}
              as: Host
              as_user_id: "${h2}"
            - call: "GET /bookings/${b2}/payouts"
              payload: {}
              as: Host
              as_user_id: "${h2}"
              captures: { p2: $.data.0.id, p2_est: $.data.0.estimated_cents }
          trigger:
            - call: "POST /payouts/${p2}/release"
              payload: {}
              as: PlatformAdmin
              captures: { p2_actual: $.data.actual_cents }
          assert:
            - "Payout.${p2}.estimated_cents == 93500 (written at confirm)"
            - "Payout.${p2}.actual_cents == 89500 (written at release: 110000 - 16500 commission - 4000 deduction)"
            - "Payout.${p2}.status == RELEASED"

  # =========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: nightly_pricing_multiplier_selection_mode_a
        grounds:
          - calculations.nightly_pricing
          - entities.RatePlan.fields.seasonal_multiplier_bps
          - entities.RatePlan.fields.weekend_multiplier_bps
          - endpoints["GET /listings/{id}/quote"]
        distinguishing_aspect: |
          Mode (a): per-night price = base * seasonal_bps/10000 * weekend_bps/10000 with weekend selection
          branching on day-of-week — 3 inputs interacting non-linearly. Fri 36000 + Sat 36000 + Sun 30000 =
          nightly_subtotal 102000.
        test_recipe:
          setup:
            - "Listing base 20000; PEAK plan seasonal 1.5x, weekend 1.2x; quote 2026-07-10(Fri)..2026-07-13."
          setup_api_calls:
            - call: "POST /hosts"
              payload: { email: "h3@x.com", display_name: "Host Three" }
              as: Anonymous
              captures: { h3: $.data.id }
            - call: "POST /listings"
              payload: { host_id: "${h3}", title: "Cabin", base_nightly_rate_cents: 20000, cleaning_fee_cents: 5000, pet_fee_cents: 3000, tax_rate_bps: 1000 }
              as: Host
              as_user_id: "${h3}"
              captures: { l3: $.data.id }
            - call: "POST /rate-plans"
              payload: { listing_id: "${l3}", label: "PEAK", window_start: "2026-07-01", window_end: "2026-07-31", seasonal_multiplier_bps: 15000, weekend_multiplier_bps: 12000 }
              as: Host
              as_user_id: "${h3}"
          trigger:
            - call: "GET /listings/${l3}/quote"
              payload: { check_in: "2026-07-10", check_out: "2026-07-13", pets_count: 1 }
              as: Host
              as_user_id: "${h3}"
              captures: { sub: $.data.nightly_subtotal_cents }
          assert:
            - "GET /listings/${l3}/quote returns nightly_subtotal_cents == 102000 (36000 Fri + 36000 Sat + 30000 Sun)"

      - name: booking_total_rounding_order_mode_b
        grounds:
          - calculations.booking_total
          - calculations.nightly_pricing
          - entities.Booking.fields.tax_cents
          - entities.Booking.fields.total_cents
        distinguishing_aspect: |
          Mode (b): rounding order is pinned — nights rounded per-night then summed (102000), tax rounded ONCE
          on the summed taxable base (110000 * 1000bps = 11000), giving total 121000. Differs from a sum-then-round
          or round-each-component variant.
        test_recipe:
          setup:
            - "Same PEAK listing; booking 2026-07-10..2026-07-13 with 1 pet."
          setup_api_calls:
            - call: "POST /hosts"
              payload: { email: "h4@x.com", display_name: "Host Four" }
              as: Anonymous
              captures: { h4: $.data.id }
            - call: "POST /guests"
              payload: { email: "g4@x.com", full_name: "Guest Four", govt_id_verified: true, prior_cancellations: 0, chargeback_flag: false }
              as: Anonymous
              captures: { g4: $.data.id }
            - call: "POST /listings"
              payload: { host_id: "${h4}", title: "Cabin 4", base_nightly_rate_cents: 20000, cleaning_fee_cents: 5000, pet_fee_cents: 3000, tax_rate_bps: 1000 }
              as: Host
              as_user_id: "${h4}"
              captures: { l4: $.data.id }
            - call: "POST /rate-plans"
              payload: { listing_id: "${l4}", label: "PEAK", window_start: "2026-07-01", window_end: "2026-07-31", seasonal_multiplier_bps: 15000, weekend_multiplier_bps: 12000 }
              as: Host
              as_user_id: "${h4}"
            - call: "POST /listings/${l4}/publish"
              payload: {}
              as: Host
              as_user_id: "${h4}"
          trigger:
            - call: "GET /listings/${l4}"
              payload: {}
              as: Guest
              as_user_id: "${g4}"
              captures: { l4_cv_253: $.data.calendar_version }
            - call: "POST /bookings"
              payload: { listing_id: "${l4}", guest_id: "${g4}", check_in: "2026-07-10", check_out: "2026-07-13", pets_count: 1, expected_listing_calendar_version: "${l4_cv_253}" }
              as: Guest
              as_user_id: "${g4}"
              captures: { b4: $.data.id }
          assert:
            - "Booking.${b4}.nightly_subtotal_cents == 102000"
            - "Booking.${b4}.fees_cents == 8000 (cleaning 5000 + pet 3000)"
            - "Booking.${b4}.tax_cents == 11000 (110000 * 1000/10000, rounded once)"
            - "Booking.${b4}.total_cents == 121000"

  # =========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: booking_screening_revision_cycle
        grounds:
          - state_machines.Booking.SCREENING_to_REQUESTED
          - state_machines.Booking.REQUESTED_to_SCREENING
          - endpoints["POST /bookings/{id}/request-info"]
        distinguishing_aspect: |
          Booking has a cycle SCREENING -> REQUESTED -> SCREENING (info-request loop), a non-linear shape on the
          Booking entity; the booking returns to REQUESTED and can be re-screened.
        test_recipe:
          setup:
            - "Booking in SCREENING state."
          setup_api_calls:
            - call: "POST /hosts"
              payload: { email: "h5@x.com", display_name: "Host Five" }
              as: Anonymous
              captures: { h5: $.data.id }
            - call: "POST /guests"
              payload: { email: "g5@x.com", full_name: "Guest Five", govt_id_verified: true, prior_cancellations: 0, chargeback_flag: false }
              as: Anonymous
              captures: { g5: $.data.id }
            - call: "POST /listings"
              payload: { host_id: "${h5}", title: "Loft", base_nightly_rate_cents: 20000, cleaning_fee_cents: 5000 }
              as: Host
              as_user_id: "${h5}"
              captures: { l5: $.data.id }
            - call: "POST /rate-plans"
              payload: { listing_id: "${l5}", label: "STD", window_start: "2026-07-01", window_end: "2026-07-31", seasonal_multiplier_bps: 10000 }
              as: Host
              as_user_id: "${h5}"
            - call: "POST /listings/${l5}/publish"
              payload: {}
              as: Host
              as_user_id: "${h5}"
            - call: "GET /listings/${l5}"
              payload: {}
              as: Guest
              as_user_id: "${g5}"
              captures: { l5_cv_300: $.data.calendar_version }
            - call: "POST /bookings"
              payload: { listing_id: "${l5}", guest_id: "${g5}", check_in: "2026-07-10", check_out: "2026-07-13", expected_listing_calendar_version: "${l5_cv_300}" }
              as: Guest
              as_user_id: "${g5}"
              captures: { b5: $.data.id }
            - call: "POST /bookings/${b5}/screen"
              payload: {}
              as: Host
              as_user_id: "${h5}"
          trigger:
            - call: "POST /bookings/${b5}/request-info"
              payload: {}
              as: Host
              as_user_id: "${h5}"
            - call: "POST /bookings/${b5}/screen"
              payload: {}
              as: Host
              as_user_id: "${h5}"
              captures: { st: $.data.status }
          assert:
            - "After request-info Booking.${b5}.status == REQUESTED"
            - "After re-screen Booking.${b5}.status == SCREENING (cycle traversed twice)"

      - name: damage_claim_dispute_cycle
        grounds:
          - state_machines.DamageClaim.UNDER_REVIEW_to_DISPUTED
          - state_machines.DamageClaim.DISPUTED_to_UNDER_REVIEW
          - endpoints["POST /damage-claims/{id}/dispute"]
        distinguishing_aspect: |
          DamageClaim (a different entity than Booking) has a cycle UNDER_REVIEW -> DISPUTED -> UNDER_REVIEW
          (guest dispute loop); the claim re-enters review and can then be approved.
        test_recipe:
          setup:
            - "DamageClaim in UNDER_REVIEW on a deposit for a completed/in-stay booking."
          setup_api_calls:
            - call: "POST /hosts"
              payload: { email: "h6@x.com", display_name: "Host Six" }
              as: Anonymous
              captures: { h6: $.data.id }
            - call: "POST /guests"
              payload: { email: "g6@x.com", full_name: "Guest Six", govt_id_verified: true, prior_cancellations: 0, chargeback_flag: false }
              as: Anonymous
