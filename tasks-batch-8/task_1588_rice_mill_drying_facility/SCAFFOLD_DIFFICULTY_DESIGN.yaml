      - name: lot_grading_gated_by_active_hold
        grounds:
          - state_machines.PaddyLot.WEIGHED_to_GRADED
          - state_machines.FoodSafetyHold
        distinguishing_aspect: |
          Pair PaddyLot x FoodSafetyHold (different pair than Settlement x
          HarvestSeason): grading a WEIGHED lot under an ACTIVE LOT-targeted
          hold fails with ERR_ACTIVE_HOLD_BLOCKS_OPERATION; after the hold is
          RELEASED the identical grade call succeeds.
        test_recipe:
          setup:
            - "Season INTAKE_OPEN; grower; one WEIGHED SPOT lot; ACTIVE hold on the lot"
          setup_api_calls:
            - call: "POST /mill/seasons"
              payload: { name: "2026 Fall", intake_start_date: "2026-08-01", intake_end_date: "2026-10-31", spot_daily_cap: 2 }
              as: MillAdmin
