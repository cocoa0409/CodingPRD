        payload: {}
        as: ComplianceOfficer
      assert:
      - ModelRevision.${r1}.firmware_support_until == 2031-07-31T00:00:00Z
      - at clock 2031-07-30 the mark-obsolete attempt returns 409 with error_id ERR_SUPPORT_WINDOW_ACTIVE
      - after the denial ModelRevision.${r1}.status is still SUNSET_ANNOUNCED
      - at clock 2031-07-31T00:00:00Z exactly, mark-obsolete returns 200 and ModelRevision.${r1}.status == OBSOLETE
