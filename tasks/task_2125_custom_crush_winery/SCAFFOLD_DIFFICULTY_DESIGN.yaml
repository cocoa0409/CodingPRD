        grounds:
          - state_machines.BlendTrial.APPROVED_to_EXECUTED
          - state_machines.Lot.AGING_to_CONSUMED
          - state_machines.VesselAllocation.COMMITTED_to_RELEASED
          - state_machines.Vessel.CLEAN_to_DIRTY
          - entities.Contract.fields.gallons_allocated
        distinguishing_aspect: |
          A depth-4 chain whose every link is caused by the previous one: executing
          the trial drains lot2 to 0 gallons (HOP 1 CONSUMED), the lot reaching
          CONSUMED releases allocation al2 (HOP 2), the release dirties vessel T-102
          (HOP 3), and the dirtied vessel's freed allocation drops
          Contract.gallons_allocated from 3000.00 to 2000.00 (HOP 4). lot1, which
          was only partially drawn, breaks no link — its allocation stays COMMITTED
          and T-101 stays CLEAN.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z."
            - "One ACTIVE Contract with tank_gallons_entitled 20000."
            - "lot1 (CABERNET_SAUVIGNON/OAKVILLE, 1565.00 gallons) COMMITTED into T-101 under a 2000-gallon allocation, AGING."
            - "lot2 (MERLOT/OAKVILLE, 866.25 gallons) COMMITTED into T-102 under a 1000-gallon allocation, AGING."
            - "Contract.gallons_allocated == 3000.00 before the trigger."
            - "One APPROVED BlendTrial drawing 750.00 from lot1 and the whole 866.25 from lot2 at 2.00 percent declared loss."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: FacilityAdmin
              as_user_id: "fa-carol"
            - call: "POST /clients"
              payload: { name: "Coombsville Cellars", ttb_permit_number: "BW-CA-15001", contact_email: "ops@coombsville.example" }
              as: FacilityAdmin
              as_user_id: "fa-carol"
              captures: { cl1: $.data.id }
            - call: "POST /contracts"
              payload: { client_id: "${cl1}", harvest_year: 2026, committed_tons: 200, tank_gallons_entitled: 20000, barrel_slots_entitled: 40, crush_rate_cents_per_ton: 50000, storage_rate_cents_per_gallon_month: 25, labor_rate_cents_per_hour: 10000, effective_from: "2026-08-01T00:00:00Z", effective_to: "2027-07-31T00:00:00Z" }
              as: FacilityAdmin
              as_user_id: "fa-carol"
              captures: { ct1: $.data.id }
            - call: "POST /contracts/${ct1}/transitions"
              payload: { action: "SUBMIT" }
              as: FacilityAdmin
              as_user_id: "fa-carol"
            - call: "POST /contracts/${ct1}/transitions"
              payload: { action: "ACTIVATE" }
              as: FacilityAdmin
              as_user_id: "fa-carol"
