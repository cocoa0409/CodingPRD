              captures: { pnst: $.data.status, pnvat: $.data.verified_at }
          assert:
            - "each punch item is created with HTTP 201 in status OPEN: ${pbst} == OPEN with ${pbraise} == ops-01, ${pbrole} == MuseumOperations, ${pbver} == null, ${pbvat} == null and ${pbwr} == null"
            - "${bc1} == 1 and ${post1} == OPEN - blocking_punch_count is not one of the five posture inputs, so a blocking defect does not restrict the posture even though it does block the advance"
            - "${w1} == ERR_INVALID_PUNCH_STATE with HTTP 409 - the item is OPEN, so the objection is the severity: a BLOCKING defect can never be waived"
            - "${w2} == ERR_SEGREGATION_OF_DUTIES with HTTP 403 - ops-01 raised the item and may not verify it, and this is checked at priority 4 long before the punch state at priority 54"
            - "the fab-01 verification succeeds with HTTP 200: ${pbst2} == VERIFIED, ${pbver2} == fab-01, ${pbnote2} is the supplied note and ${pbvat2} == 2026-09-10T08:00:00Z, the logical-clock instant left by the install window"
            - "${w3} == ERR_INVALID_PUNCH_STATE with HTTP 409 - verify is not idempotent; a VERIFIED item is no longer OPEN"
            - "${pmst} == WAIVED with ${pmwr} set, ${pmvat} == 2026-09-10T08:00:00Z and ${pmver} == null - a waiver stamps verified_at but leaves verified_by_user_id null, because nobody verified anything"
            - "${bc2} == 0 - only the BLOCKING item leaving OPEN clears the counter; waiving the MAJOR item never touched it"
            - "${ph2} == CLOSEOUT - the advance is now permitted, having been blocked while ${bc1} was 1"
            - "${ph3} == WARRANTY_CLOSED and ${rows} shows exactly two CLOSED items - the VERIFIED one and the WAIVED one - both bubbled to the terminal state by the settlement sweep"
            - "${pnst} == OPEN with ${pnvat} == null - §1.2 declares CLOSED only as a successor of VERIFIED and WAIVED, so settlement must NOT drag a never-resolved item into the terminal state; an implementation that closes the whole punch list at closeout fails here"

      - name: advance_phase_rejects_every_target_that_is_not_the_immediate_successor
        claim_type: invalid_transitions
        grounds:
          - state_machines.ExhibitProject.phase
          - validations.priority_38
          - errors.ERR_INVALID_PROJECT_PHASE
        distinguishing_aspect: |
          The phase machine is a chain of seven, so from any given phase exactly ONE
          to_phase value is legal: skipping ahead, repeating the current phase and
          stepping backwards are all the same 409. The instance also pins the second
          half of priority 38 - the phase gates on CHILD creates - and the fact that
          those gates outrank both the child's own state check and the posture check.
          A shop drawing attempted in SCHEMATIC must be refused for the phase, not
          for the DRAFT case it names; a commission attempted in SCHEMATIC must be
          refused for the phase, not for the SPECIFIED interactive; and a closeout
          attempted in SCHEMATIC must be refused for the phase even though the
          posture is simultaneously RESTRICTED.
        test_recipe:
          setup:
            - "one project in INTERPRETIVE with zone Z-A already created (zones are legal in INTERPRETIVE)"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ProjectManager
            - call: "POST /exhibit-projects"
              payload: { name: "Deep Time Hall", museum_name: "Ridgeline Museum", storyline_title: "Deep Time: Reading the Rock Record", objective_codes: ["OBJ-STRATA", "OBJ-EXTINCTION"], target_open_date: "2027-05-01T00:00:00Z", contract_value_cents: 9000000 }
