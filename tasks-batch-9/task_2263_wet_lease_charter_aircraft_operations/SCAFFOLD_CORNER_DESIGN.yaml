      - name: cancelled_lessor_and_ferry_legs_leave_the_credited_hour_include_set
        claim_type: Input Set Filtering
        grounds:
          - calculations.monthly_utilization_charge
          - calculations.leg_billable_block_minutes
          - entities.FlightLeg.fields.leg_class
          - endpoints[POST /wetlease/flight-legs/{legId}/cancel]
        distinguishing_aspect: |
          Three legs, three different include-set outcomes in the same month. The COMPLETED
          MAINTENANCE_FERRY leg flies 155 real block minutes and contributes NOTHING (leg_class
          filter, not a state filter). The SCHEDULED revenue leg contributes its 120 scheduled
          minutes while it is still SCHEDULED (2.0000 h), and drops out of credited_hours the
          instant it is cancelled by the lessor - yet the same cancellation ENTERS the
          lessor_attributable_shortfall term, so the charge falls from 2,400,000 to 1,824,000 even
          though credited hours fell. An implementation that either keeps cancelled minutes in
          credited_hours or forgets the lessor-attributable credit gets a different number in both
          directions.
          
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z."
            - "ACTIVE lease on G-ACMI, rate 480000, mgh 5, shortfall_credit_pct 0.60."
            - "leg1 REVENUE 09-08 06:00:00Z-08:35:30Z flown 06:10:00Z-08:35:00Z: billable 145 min."
            - "leg2 REVENUE 09-12 06:00:00Z-08:00:00Z still SCHEDULED: scheduled 120 min."
            - "leg3 MAINTENANCE_FERRY 09-15 06:00:00Z-08:35:30Z flown to block: 155 block min, 0 billable."
