      - name: cancel_on_a_closed_event_is_not_cancellable
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.PSPSEvent.transitions[->CANCELLED]
          - errors[ERR_EVENT_NOT_CANCELLABLE]
        distinguishing_aspect: "Cancellation is only reachable from DRAFT, SCOPED and ARMED; from ACTIVE onward the event must be all-cleared and closed instead, so cancelling an ACTIVE event yields ERR_EVENT_NOT_CANCELLABLE rather than ERR_EVENT_TERMINAL — two different error ids for two different kinds of refusal on the same trigger."
        test_recipe:
          setup:
