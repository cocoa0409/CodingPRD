scenario: |
  Swim Meet Management & Officiating (USA Swimming club meet): meet entry deadlines & qualifying time verification, heat sheet & seeding generation, official assignment & certification requirements, timing system operation & backup timing reconciliation, disqualification recording & coach notification, relay declaration & scratch procedures, scoring & team points, records verification & submission

domain_name: swim-meet-officiating
api_prefix: ""   # flat topology: every entity is a top-level collection

complexity_profile:
  primary_archetype: posture_driven_gating   # Meet/SwimEvent status gates every child operation
  secondary_archetype: compliance_audit      # officiating certification, DQ audit trail, record ratification
  complexity_layers:
    - optimistic_concurrency                 # OCC on Meet.version (seed) and SwimEvent.version (complete)
    - cascading_side_effects                 # DQ confirm/overturn rescore cascades; relay/team scratch cascades
    - dual_variant_calculation               # timing reconciliation variants; tie-policy scoring variants
    - derived_field_reconciliation           # Team.provisional_points vs official_points
  entity_topology: flat
  state_machine_shape: posture_driven        # Meet and SwimEvent are compound/guarded by child states
  relationship_patterns:
    - one_to_many
    - many_to_many                           # Swimmer x SwimEvent via EventEntry; Swimmer x RelayTeam via RelayLeg
    - polymorphic                            # EventEntry references swimmer_id XOR relay_team_id
    - cross_aggregate                        # Disqualification -> LaneAssignment -> EventEntry -> SwimEvent -> Team
  role_model: segregation_of_duties          # DQ recorder and DQ confirmer MUST be different officials
  consistency_model: immediate

# =============================================================================
# 1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table (13 entities, flat; all times integer centiseconds)
# =============================================================================
entities:
  - name: Meet
    parent: null
    common_fields: true
    fields:
      - { name: meet_name, type: string, source: input, description: "Meet name" }
      - { name: course, type: enum, source: input, description: "SCY | SCM | LCM" }
      - { name: start_date, type: string, source: input, description: "First day of meet, YYYY-MM-DD; drives Swimmer.age_on_meet_start" }
      - { name: entry_deadline_utc, type: datetime, source: input, description: "Entries accepted while logical clock <= this instant (inclusive)" }
      - { name: lane_count, type: integer, source: input, default: 6, description: "Lanes per heat; seeding chunk size" }
      - { name: points_table, type: array, source: input, default: "[9,7,6,5,4,3,2,1]", description: "Individual points by place (1-based index); scoring depth = length" }
      - { name: relay_points_multiplier, type: integer, source: input, default: 2, description: "Relay event points = table value * this" }
      - { name: max_individual_entries_per_swimmer, type: integer, source: input, default: 4, description: "Max non-SCRATCHED individual entries per swimmer per meet" }
      - { name: dq_protest_window_minutes, type: integer, source: input, default: 30, description: "Coach protest window after coach notification" }
      - { name: min_recovery_minutes, type: integer, source: input, default: 20, description: "Minimum gap between a swimmer's individual events on the same session_date" }
      - { name: timing_delta_threshold_cs, type: integer, source: input, default: 30, description: "|pad - rounded backup mean| <= this auto-confirms; strictly greater forces MANUAL_REVIEW" }
      - { name: scoring_tie_policy, type: enum, source: input, default: "SPLIT", description: "SPLIT | TOP; immutable once meet is SEEDED" }
      - { name: status, type: enum, source: system, description: "SETUP -> ENTRIES_OPEN -> ENTRIES_CLOSED -> SEEDED -> COMPLETED -> OFFICIAL" }
      - { name: version, type: integer, source: system, description: "Increments ONLY on meet lifecycle transitions (open/close/seed/reopen/complete/finalize) and meet config edits" }

  - name: Team
    parent: null
    common_fields: true
    fields:
      - { name: meet_id, type: string, source: input, description: "FK -> Meet.id" }
      - { name: team_code, type: string, source: input, description: "Club code; unique within meet" }
      - { name: team_name, type: string, source: input, description: "Club name" }
      - { name: status, type: enum, source: system, description: "REGISTERED -> WITHDRAWN" }
      - { name: provisional_points, type: number, source: computed, default: 0, description: "Sum of Result.points over all Result rows (any status incl. UNOFFICIAL) for this team; DQ_EXCLUDED rows contribute 0; 2dp round_half_up" }
      - { name: official_points, type: number, source: computed, default: 0, description: "Sum of Result.points over Result rows with status == OFFICIAL only; 2dp round_half_up" }
      - { name: active_entry_count, type: integer, source: computed, default: 0, description: "Count of EventEntry rows for this team with status IN {ENTERED, SEEDED, FINISHED, DQ, NO_SHOW} (SCRATCHED excluded)" }

  - name: Swimmer
    parent: null
    common_fields: true
    fields:
      - { name: team_id, type: string, source: input, description: "FK -> Team.id" }
      - { name: full_name, type: string, source: input, description: "Swimmer name" }
      - { name: birth_date, type: string, source: input, description: "YYYY-MM-DD" }
      - { name: gender, type: enum, source: input, description: "M | F" }
      - { name: age_on_meet_start, type: integer, source: computed, description: "Whole years from birth_date to meet.start_date (age-up on birthday: born on start_date's month/day N years earlier => age N)" }
      - { name: age_group, type: enum, source: computed, description: "TEN_AND_UNDER (age<=10) | ELEVEN_TWELVE (11-12) | THIRTEEN_FOURTEEN (13-14) | FIFTEEN_AND_OVER (>=15)" }
      - { name: status, type: enum, source: system, description: "ACTIVE | INACTIVE (INACTIVE when team WITHDRAWN)" }

  - name: SwimEvent
    parent: null
    common_fields: true
    fields:
      - { name: meet_id, type: string, source: input, description: "FK -> Meet.id" }
      - { name: event_number, type: integer, source: input, description: "Unique within meet" }
      - { name: gender, type: enum, source: input, description: "M | F | MIXED" }
      - { name: age_group, type: enum, source: input, description: "TEN_AND_UNDER | ELEVEN_TWELVE | THIRTEEN_FOURTEEN | FIFTEEN_AND_OVER" }
      - { name: stroke, type: enum, source: input, description: "FREESTYLE | BACKSTROKE | BREASTSTROKE | BUTTERFLY | INDIVIDUAL_MEDLEY | FREESTYLE_RELAY | MEDLEY_RELAY" }
      - { name: distance_meters, type: integer, source: input, description: "Race distance" }
      - { name: is_relay, type: boolean, source: input, description: "true => entries via RelayTeam only" }
      - { name: qualifying_time_cs, type: integer, source: input, description: "Nullable. Cut time in centiseconds; entry VERIFIED iff seed_time_cs <= qualifying_time_cs (equality qualifies)" , constraints: "null allowed (no-cut event)" }
      - { name: session_date, type: string, source: input, description: "YYYY-MM-DD; overlap/recovery scope" }
      - { name: scheduled_start_minute, type: integer, source: input, description: "Half-open interval [start, end) start, minutes from midnight" }
      - { name: scheduled_end_minute, type: integer, source: input, description: "Half-open interval end; must be > scheduled_start_minute" }
      - { name: status, type: enum, source: system, description: "PENDING -> SEEDED -> IN_PROGRESS -> COMPLETED -> OFFICIAL; COMPLETED -> IN_PROGRESS (reopen); CANCELLED terminal (auto at seed when zero VERIFIED entries)" }

  - name: EventEntry
    parent: null
    common_fields: true
    fields:
      - { name: event_id, type: string, source: input, description: "FK -> SwimEvent.id" }
      - { name: swimmer_id, type: string, source: input, description: "FK -> Swimmer.id; null for relay entries (exactly one of swimmer_id/relay_team_id non-null)" }
      - { name: relay_team_id, type: string, source: input, description: "FK -> RelayTeam.id; null for individual entries" }
      - { name: seed_time_cs, type: integer, source: input, description: "Nullable entry time in centiseconds; null = NT (no time), seeded last", constraints: "null allowed" }
      - { name: qualification_status, type: enum, source: system, description: "UNVERIFIED -> VERIFIED | REJECTED (parallel dimension, set by verify)" }
      - { name: status, type: enum, source: system, description: "ENTERED -> SEEDED -> FINISHED | DQ | NO_SHOW | SCRATCHED; SCRATCHED -> ENTERED | SEEDED (unscratch)" }

  - name: RelayTeam
    parent: null
    common_fields: true
    fields:
      - { name: team_id, type: string, source: input, description: "FK -> Team.id" }
      - { name: event_id, type: string, source: input, description: "FK -> SwimEvent.id; event MUST have is_relay == true" }
      - { name: relay_name, type: string, source: input, description: "e.g. 'A', 'B'; unique per (team_id, event_id)" }
      - { name: entry_id, type: string, source: system, description: "FK -> EventEntry.id; the relay's EventEntry row auto-created with the RelayTeam" }
      - { name: status, type: enum, source: system, description: "DECLARED -> LEGS_LOCKED -> SCRATCHED; DECLARED -> SCRATCHED" }

  - name: RelayLeg
    parent: null
    common_fields: false
    fields:
      - { name: relay_team_id, type: string, source: input, description: "FK -> RelayTeam.id" }
      - { name: leg_number, type: integer, source: input, description: "1..4; POST with an existing leg_number replaces that leg's swimmer while relay is DECLARED" }
      - { name: swimmer_id, type: string, source: input, description: "FK -> Swimmer.id; must be ACTIVE on the relay's team and age-eligible for the relay event" }

  - name: LaneAssignment
    parent: null
    common_fields: true
    fields:
      - { name: event_id, type: string, source: system, description: "FK -> SwimEvent.id" }
      - { name: entry_id, type: string, source: system, description: "FK -> EventEntry.id" }
      - { name: heat_number, type: integer, source: system, description: "1 = slowest heat; highest number = fastest heat" }
      - { name: lane_number, type: integer, source: system, description: "1..lane_count; assigned by middle-out lane priority" }
      - { name: lane_status, type: enum, source: system, description: "ACTIVE -> VOIDED -> ACTIVE (unscratch restores); parallel dimension with reconciliation_status" }
      - { name: pad_cs, type: integer, source: input, description: "Nullable; primary touchpad time", constraints: "null allowed" }
      - { name: backup1_cs, type: integer, source: input, description: "Nullable; backup button 1", constraints: "null allowed" }
      - { name: backup2_cs, type: integer, source: input, description: "Nullable; backup button 2", constraints: "null allowed" }
      - { name: watch_cs, type: integer, source: input, description: "Nullable; manual stopwatch (tertiary)", constraints: "null allowed" }
      - { name: pad_status, type: enum, source: input, default: "UNKNOWN", description: "VALID | INVALID | UNKNOWN; TimingOperator may flag pad malfunction" }
      - { name: reconciliation_status, type: enum, source: system, description: "PENDING_READINGS -> AUTO_CONFIRMED | MANUAL_REVIEW -> RESOLVED; RESOLVED|AUTO_CONFIRMED -> MANUAL_REVIEW (reopen-timing cycle)" }
      - { name: reconciled_variant, type: enum, source: system, description: "Nullable; PRIMARY_PRIORITY | BACKUP_MEAN_PRIORITY; set on auto-confirm (PRIMARY_PRIORITY) or resolve", constraints: "null allowed" }
      - { name: final_time_cs, type: integer, source: computed, description: "Nullable; reconciled official time per timing_reconciliation; cleared on reopen-timing", constraints: "null allowed" }

  - name: Result
    parent: null
    common_fields: true
    fields:
      - { name: entry_id, type: string, source: system, description: "FK -> EventEntry.id; 1:1" }
      - { name: event_id, type: string, source: system, description: "FK -> SwimEvent.id" }
      - { name: team_id, type: string, source: system, description: "FK -> Team.id (denormalized from swimmer/relay team)" }
      - { name: final_time_cs, type: integer, source: computed, description: "Nullable for DQ_EXCLUDED; copied from LaneAssignment.final_time_cs", constraints: "null allowed" }
      - { name: place, type: integer, source: computed, description: "Nullable for DQ_EXCLUDED; competition ranking 1224 (ties share place, next place advances by tie count)", constraints: "null allowed" }
      - { name: points, type: number, source: computed, description: "Per place_points calculation; 2dp round_half_up; 0.00 for DQ_EXCLUDED" }
      - { name: status, type: enum, source: system, description: "UNOFFICIAL -> OFFICIAL; DQ_EXCLUDED (terminal for that Result row)" }

  - name: Official
    parent: null
    common_fields: true
    fields:
      - { name: meet_id, type: string, source: input, description: "FK -> Meet.id" }
      - { name: full_name, type: string, source: input, description: "Official name" }
      - { name: lsc_membership_id, type: string, source: input, description: "LSC membership id; unique within meet" }
      - { name: certifications, type: array, source: input, description: "Subset of [REFEREE, STARTER, STROKE_TURN_JUDGE, CHIEF_TIMER]" }
      - { name: certification_expires_on, type: string, source: input, description: "YYYY-MM-DD; valid for an event iff >= event.session_date (equality valid)" }

  - name: OfficialAssignment
    parent: null
    common_fields: true
    fields:
      - { name: event_id, type: string, source: input, description: "FK -> SwimEvent.id" }
      - { name: official_id, type: string, source: input, description: "FK -> Official.id" }
      - { name: role_on_deck, type: enum, source: input, description: "REFEREE | STARTER | STROKE_TURN_JUDGE | CHIEF_TIMER" }
      - { name: status, type: enum, source: system, description: "PROPOSED -> CONFIRMED -> RELEASED; PROPOSED -> RELEASED" }

  - name: Disqualification
    parent: null
    common_fields: true
    fields:
      - { name: lane_assignment_id, type: string, source: input, description: "FK -> LaneAssignment.id; the swim being sanctioned" }
      - { name: reporting_official_id, type: string, source: system, description: "FK -> Official.id; taken from X-User-ID of the DeckOfficial caller" }
      - { name: resolved_by_referee_id, type: string, source: system, description: "FK -> Official.id; nullable; set by confirm/uphold/overturn; MUST differ from reporting_official_id", constraints: "null allowed" }
      - { name: dq_code, type: enum, source: input, description: "FALSE_START | FLY_ARMS_ALTERNATING | BACK_FINISH_NOT_ON_BACK | BR_KICK_DOWNWARD_WHIP | IM_ORDER_VIOLATION | TURN_NO_TOUCH | RELAY_EARLY_TAKEOFF" }
      - { name: call_notes, type: string, source: input, description: "Free text" }
      - { name: status, type: enum, source: system, description: "RECORDED -> COACH_NOTIFIED -> CONFIRMED | PROTESTED -> UPHELD -> CONFIRMED; PROTESTED -> OVERTURNED" }
      - { name: notified_at, type: datetime, source: system, description: "Nullable; logical-clock timestamp of coach notification", constraints: "null allowed" }

  - name: MeetRecord
    parent: null
    common_fields: true
    fields:
      - { name: event_id, type: string, source: input, description: "FK -> SwimEvent.id" }
      - { name: record_time_cs, type: integer, source: input, description: "Record time in centiseconds" }
      - { name: holder_name, type: string, source: input, description: "Record holder display name" }
      - { name: holder_team, type: string, source: input, description: "Record holder team code" }
      - { name: set_on_date, type: string, source: input, description: "YYYY-MM-DD" }
      - { name: challenger_entry_id, type: string, source: system, description: "FK -> EventEntry.id; nullable; set when auto-created as a challenge by publish", constraints: "null allowed" }
      - { name: status, type: enum, source: system, description: "CURRENT (standing) -> SUPERSEDED; PENDING_VERIFICATION -> SUBMITTED -> CURRENT (ratify); PENDING_VERIFICATION|SUBMITTED -> REJECTED" }

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Meet
    initial_state: SETUP
    terminal_states: [OFFICIAL]
    transitions:
      - from: SETUP
        to: ENTRIES_OPEN
        trigger: POST /meets/{id}/open-entries
        actor: MeetDirector
        preconditions: []
        side_effects: ["Meet.version += 1"]
      - from: ENTRIES_OPEN
        to: ENTRIES_CLOSED
        trigger: POST /meets/{id}/close-entries
        actor: MeetDirector
        preconditions:
          - "logical clock > entry_deadline_utc (ERR_ENTRY_WINDOW_STILL_OPEN)"
        side_effects: ["Meet.version += 1"]
      - from: ENTRIES_CLOSED
        to: SEEDED
        trigger: POST /meets/{id}/seed
        actor: MeetDirector
        preconditions:
          - "expected_meet_version == Meet.version (ERR_STALE_VERSION, checked before this state check)"
          - "every EventEntry of this meet has qualification_status IN {VERIFIED, REJECTED} (ERR_QUALIFICATION_UNDECIDED)"
        side_effects:
          - "meet_seeding calculation runs for every non-CANCELLED SwimEvent"
          - "SwimEvents with zero VERIFIED entries -> CANCELLED"
          - "other SwimEvents PENDING -> SEEDED (SwimEvent.version += 1)"
          - "LaneAssignment rows created (lane_status ACTIVE, reconciliation_status PENDING_READINGS)"
          - "EventEntry ENTERED + VERIFIED -> SEEDED; ENTERED + REJECTED stays ENTERED (never seeded)"
          - "Meet.version += 1"
      - from: SEEDED
        to: ENTRIES_OPEN
        trigger: POST /meets/{id}/reopen-entries
        actor: MeetDirector
        preconditions:
          - "no SwimEvent of this meet is IN_PROGRESS | COMPLETED | OFFICIAL (ERR_EVENTS_ALREADY_UNDERWAY)"
        side_effects:
          - "all LaneAssignment rows of the meet are hard-deleted"
          - "EventEntry SEEDED -> ENTERED (SCRATCHED entries stay SCRATCHED)"
          - "SwimEvent SEEDED -> PENDING; CANCELLED events with now-VERIFIABLE entries stay CANCELLED"
          - "entry_deadline_utc := new_entry_deadline_utc (input)"
          - "Meet.version += 1"
      - from: SEEDED
        to: COMPLETED
        trigger: POST /meets/{id}/complete
        actor: MeetDirector
        preconditions:
          - "every SwimEvent of this meet has status IN {OFFICIAL, CANCELLED} (ERR_EVENTS_NOT_OFFICIAL)"
        side_effects: ["Meet.version += 1"]
      - from: COMPLETED
        to: OFFICIAL
        trigger: POST /meets/{id}/finalize
        actor: MeetDirector
        preconditions:
          - "no MeetRecord of this meet has status IN {PENDING_VERIFICATION, SUBMITTED} (ERR_RECORDS_PENDING)"
        side_effects: ["Meet.version += 1"]

  - entity: Team
    initial_state: REGISTERED
    terminal_states: [WITHDRAWN]
    transitions:
      - from: REGISTERED
        to: WITHDRAWN
        trigger: POST /teams/{id}/withdraw
        actor: MeetDirector
        preconditions:
          - "meet.status IN {SETUP, ENTRIES_OPEN, ENTRIES_CLOSED, SEEDED} (ERR_MEET_ALREADY_COMPLETED)"
        side_effects:
          - "every Swimmer of the team -> INACTIVE"
          - "every EventEntry of the team with status IN {ENTERED, SEEDED} -> SCRATCHED"
          - "each such SEEDED entry's LaneAssignment (lane_status ACTIVE) -> VOIDED"
          - "every RelayTeam of the team with status IN {DECLARED, LEGS_LOCKED} -> SCRATCHED (its entry/lane cascade as above)"
          - "Team.active_entry_count recomputed (-> 0)"

  - entity: Swimmer
    initial_state: ACTIVE
    terminal_states: [INACTIVE]
    transitions:
      - from: ACTIVE
        to: INACTIVE
        trigger: "system (team withdraw cascade)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: SwimEvent
    initial_state: PENDING
    terminal_states: [OFFICIAL, CANCELLED]
    transitions:
      - from: PENDING
        to: SEEDED
        trigger: "system (meet seed)"
        actor: system
        preconditions: [">= 1 VERIFIED EventEntry"]
        side_effects: ["SwimEvent.version += 1"]
      - from: PENDING
        to: CANCELLED
        trigger: "system (meet seed, zero VERIFIED entries)"
        actor: system
        preconditions: []
        side_effects: ["SwimEvent.version += 1"]
      - from: SEEDED
        to: PENDING
        trigger: "system (meet reopen-entries)"
        actor: system
        preconditions: []
        side_effects: ["SwimEvent.version += 1"]
      - from: SEEDED
        to: IN_PROGRESS
        trigger: POST /events/{id}/start
        actor: MeetDirector
        preconditions:
          - "meet.status == SEEDED (ERR_MEET_NOT_SEEDED)"
          - "official coverage: >= 1 CONFIRMED OfficialAssignment with role_on_deck == REFEREE AND >= 1 CONFIRMED with role_on_deck == STROKE_TURN_JUDGE for this event (ERR_OFFICIAL_COVERAGE_INCOMPLETE)"
        side_effects: ["SwimEvent.version += 1"]
      - from: IN_PROGRESS
        to: COMPLETED
        trigger: POST /events/{id}/complete
        actor: MeetDirector
        preconditions:
          - "expected_event_version == SwimEvent.version (ERR_STALE_VERSION, checked before this state check)"
          - "every LaneAssignment of this event with lane_status == ACTIVE has reconciliation_status IN {AUTO_CONFIRMED, RESOLVED} (ERR_UNRESOLVED_LANES_EXIST)"
        side_effects:
          - "place_points calculation runs: Result rows created (FINISHED entries scored; pre-confirmed DQ entries -> DQ_EXCLUDED place null points 0.00)"
          - "scored EventEntry SEEDED -> FINISHED"
          - "Team.provisional_points recomputed for every team with entries in this event"
          - "SwimEvent.version += 1"
      - from: COMPLETED
        to: IN_PROGRESS
        trigger: POST /events/{id}/reopen
        actor: MeetReferee
        preconditions: []
        side_effects:
          - "all Result rows of this event are hard-deleted"
          - "EventEntry FINISHED -> SEEDED (DQ entries stay DQ)"
          - "Team.provisional_points recomputed for affected teams"
          - "SwimEvent.version += 1"
      - from: COMPLETED
        to: OFFICIAL
        trigger: POST /events/{id}/publish
        actor: MeetDirector
        preconditions:
          - "every Disqualification on this event's lane assignments has status IN {CONFIRMED, OVERTURNED} (ERR_DQ_NOT_TERMINAL)"
        side_effects:
          - "every Result UNOFFICIAL -> OFFICIAL"
          - "Team.official_points recomputed for every team with OFFICIAL results in this event"
          - "record challenge check: fastest OFFICIAL non-DQ Result with final_time_cs strictly < standing MeetRecord.record_time_cs auto-creates one MeetRecord PENDING_VERIFICATION (challenger_entry_id = that result's entry)"
          - "SwimEvent.version += 1"

  - entity: EventEntry
    initial_state: ENTERED
    terminal_states: [NO_SHOW]
    terminal_note: "FINISHED and DQ become immutable once the entry's SwimEvent reaches OFFICIAL (reopen and DQ transitions only exist pre-OFFICIAL); NO_SHOW is unconditionally terminal"
    transitions:
      - from: ENTERED
        to: SEEDED
        trigger: "system (meet seed; only qualification_status == VERIFIED)"
        actor: system
        preconditions: []
        side_effects: ["LaneAssignment row created ACTIVE/PENDING_READINGS"]
      - from: ENTERED
        to: SCRATCHED
        trigger: POST /entries/{id}/scratch
        actor: TeamCoach
        preconditions:
          - "meet.status IN {ENTRIES_OPEN, ENTRIES_CLOSED} (ERR_ENTRY_NOT_SCRATCHABLE)"
        side_effects: ["Team.active_entry_count recomputed"]
      - from: SEEDED
        to: SCRATCHED
        trigger: POST /entries/{id}/scratch
        actor: TeamCoach
        preconditions:
          - "the entry's SwimEvent.status == SEEDED (ERR_ENTRY_NOT_SCRATCHABLE when event IN_PROGRESS/COMPLETED/OFFICIAL/CANCELLED)"
        side_effects:
          - "the entry's LaneAssignment (lane_status ACTIVE) -> VOIDED"
          - "Team.active_entry_count recomputed"
      - from: SCRATCHED
        to: ENTERED
        trigger: POST /entries/{id}/unscratch
        actor: TeamCoach
        preconditions:
          - "meet.status IN {ENTRIES_OPEN, ENTRIES_CLOSED} AND no LaneAssignment row exists for this entry (ERR_ENTRY_NOT_UNSCRATCHABLE otherwise)"
        side_effects: ["Team.active_entry_count recomputed"]
      - from: SCRATCHED
        to: SEEDED
        trigger: POST /entries/{id}/unscratch
        actor: TeamCoach
        preconditions:
          - "meet.status == SEEDED AND the entry's SwimEvent.status == SEEDED AND a LaneAssignment with lane_status == VOIDED still exists for this entry (ERR_ENTRY_NOT_UNSCRATCHABLE otherwise)"
        side_effects:
          - "that LaneAssignment VOIDED -> ACTIVE with its original heat_number and lane_number"
          - "Team.active_entry_count recomputed"
      - from: SEEDED
        to: NO_SHOW
        trigger: POST /entries/{id}/mark-no-show
        actor: MeetReferee
        preconditions:
          - "the entry's SwimEvent.status == IN_PROGRESS (ERR_EVENT_NOT_IN_PROGRESS)"
        side_effects:
          - "the entry's LaneAssignment (lane_status ACTIVE) -> VOIDED"
          - "Team.active_entry_count recomputed"
      - from: SEEDED
        to: FINISHED
        trigger: "system (event complete, lane reconciled)"
        actor: system
        preconditions: []
        side_effects: []
      - from: FINISHED
        to: SEEDED
        trigger: "system (event reopen)"
        actor: system
        preconditions: []
        side_effects: []
      - from: FINISHED
        to: DQ
        trigger: "system (Disqualification confirmed after event completion)"
        actor: system
        preconditions: []
        side_effects: ["event rescore cascade (see Disqualification CONFIRMED)"]
      - from: SEEDED
        to: DQ
        trigger: "system (Disqualification confirmed before event completion)"
        actor: system
        preconditions: []
        side_effects: []
      - from: DQ
        to: FINISHED
        trigger: "system (Disqualification overturned)"
        actor: system
        preconditions: []
        side_effects: ["event rescore cascade (see Disqualification OVERTURNED)"]
    note: "qualification_status (UNVERIFIED/VERIFIED/REJECTED) evolves on a parallel axis via POST /entries/{id}/verify and is orthogonal to status"

  - entity: RelayTeam
    initial_state: DECLARED
    terminal_states: [SCRATCHED]
    transitions:
      - from: DECLARED
        to: LEGS_LOCKED
        trigger: POST /relay-teams/{id}/lock
        actor: TeamCoach
        preconditions:
          - "exactly 4 RelayLeg rows exist (ERR_RELAY_LEG_COUNT_INCOMPLETE)"
          - "the relay's EventEntry.qualification_status == VERIFIED (ERR_QUALIFICATION_UNDECIDED)"
          - "the relay's SwimEvent.status IN {PENDING, SEEDED} (ERR_RELAY_LOCK_WINDOW_CLOSED)"
        side_effects: []
      - from: DECLARED
        to: SCRATCHED
        trigger: POST /relay-teams/{id}/scratch
        actor: TeamCoach
        preconditions: []
        side_effects:
          - "the relay's EventEntry (if ENTERED|SEEDED) -> SCRATCHED"
          - "if SEEDED: its LaneAssignment ACTIVE -> VOIDED"
          - "Team.active_entry_count recomputed"
      - from: LEGS_LOCKED
        to: SCRATCHED
        trigger: POST /relay-teams/{id}/scratch
        actor: TeamCoach
        preconditions:
          - "the relay's SwimEvent.status IN {PENDING, SEEDED} (ERR_RELAY_NOT_SCRATCHABLE once IN_PROGRESS)"
        side_effects: ["same as DECLARED -> SCRATCHED"]

  - entity: LaneAssignment
    initial_state: PENDING_READINGS
    terminal_states: []
    transitions:
      - from: PENDING_READINGS
        to: AUTO_CONFIRMED
        trigger: POST /lane-assignments/{id}/readings
        actor: TimingOperator
        preconditions:
          - "lane_status == ACTIVE (ERR_LANE_VOIDED)"
          - "event.status == IN_PROGRESS (ERR_EVENT_NOT_IN_PROGRESS)"
          - "pad_cs present AND pad_status != INVALID AND both backups present AND |pad_cs - backup_mean_rounded| <= meet.timing_delta_threshold_cs (else MANUAL_REVIEW path)"
        side_effects:
          - "reconciled_variant := PRIMARY_PRIORITY; final_time_cs := pad_cs"
      - from: PENDING_READINGS
        to: MANUAL_REVIEW
        trigger: POST /lane-assignments/{id}/readings
        actor: TimingOperator
        preconditions:
          - "lane_status == ACTIVE AND event.status == IN_PROGRESS"
          - "pad missing/INVALID, or any backup missing, or |pad_cs - backup_mean_rounded| > threshold"
        side_effects: ["final_time_cs stays null"]
      - from: MANUAL_REVIEW
        to: RESOLVED
        trigger: POST /lane-assignments/{id}/resolve
        actor: TimingOperator
        preconditions:
          - "event.status == IN_PROGRESS (ERR_EVENT_NOT_IN_PROGRESS)"
          - "the variant's source chain is never empty here (readings required >= 1 value), so resolve always yields a time"
        side_effects:
          - "reconciled_variant := input variant; final_time_cs computed per timing_reconciliation"
          - "pad_status := input pad_status if provided"
      - from: RESOLVED
        to: MANUAL_REVIEW
        trigger: POST /lane-assignments/{id}/reopen-timing
        actor: MeetReferee
        preconditions:
          - "event.status == IN_PROGRESS (ERR_EVENT_NOT_IN_PROGRESS)"
        side_effects: ["final_time_cs := null; reconciled_variant := null"]
      - from: AUTO_CONFIRMED
        to: MANUAL_REVIEW
        trigger: POST /lane-assignments/{id}/reopen-timing
        actor: MeetReferee
        preconditions:
          - "event.status == IN_PROGRESS (ERR_EVENT_NOT_IN_PROGRESS)"
        side_effects: ["final_time_cs := null; reconciled_variant := null"]
    note: "lane_status (ACTIVE/VOIDED) is a parallel dimension: ACTIVE -> VOIDED on scratch/no-show/withdraw cascades; VOIDED -> ACTIVE on unscratch"

  - entity: Result
    initial_state: UNOFFICIAL
    terminal_states: [OFFICIAL, DQ_EXCLUDED]
    creation_note: "at event complete, Result rows for entries already in DQ status are created directly in DQ_EXCLUDED (place null, points 0.00); all others are created in UNOFFICIAL"

    transitions:
      - from: UNOFFICIAL
        to: OFFICIAL
        trigger: "system (event publish)"
        actor: system
        preconditions: []
        side_effects: ["Team.official_points recomputed"]
      - from: UNOFFICIAL
        to: DQ_EXCLUDED
        trigger: "system (DQ confirmed after completion: rescore)"
        actor: system
        preconditions: []
        side_effects: ["place := null; points := 0.00; surviving Results re-placed and re-pointed"]

  - entity: OfficialAssignment
    initial_state: PROPOSED
    terminal_states: [RELEASED]
    transitions:
      - from: PROPOSED
        to: CONFIRMED
        trigger: POST /official-assignments/{id}/confirm
        actor: "DeckOfficial | MeetReferee (the assigned official themself: X-User-ID == official_id)"
        preconditions:
          - "half-open overlap check vs the official's other CONFIRMED assignments (ERR_OFFICIAL_ASSIGNMENT_CONFLICT)"
        side_effects: []
      - from: PROPOSED
        to: RELEASED
        trigger: POST /official-assignments/{id}/release
        actor: MeetDirector
        preconditions: []
        side_effects: []
      - from: CONFIRMED
        to: RELEASED
        trigger: POST /official-assignments/{id}/release
        actor: MeetDirector
        preconditions:
          - "event.status IN {PENDING, SEEDED} (ERR_EVENT_ALREADY_UNDERWAY)"
        side_effects: []

  - entity: Disqualification
    initial_state: RECORDED
    terminal_states: [CONFIRMED, OVERTURNED]
    creation_preconditions:
      - "POST /lane-assignments/{id}/disqualifications creates the row in RECORDED only when: lane reconciliation_status IN {AUTO_CONFIRMED, RESOLVED} (ERR_LANE_NOT_RECONCILED), event.status IN {IN_PROGRESS, COMPLETED} (ERR_EVENT_NOT_IN_PROGRESS), no other non-terminal Disqualification exists on the same lane (ERR_DQ_ALREADY_ACTIVE), and the caller is a DeckOfficial whose X-User-ID is an Official of this meet holding a CONFIRMED STROKE_TURN_JUDGE OfficialAssignment on this event (ERR_INSUFFICIENT_PERMISSIONS)"
    transitions:
      - from: RECORDED
        to: COACH_NOTIFIED
        trigger: POST /disqualifications/{id}/notify-coach
        actor: MeetReferee
        preconditions: []
        side_effects: ["notified_at := logical clock now"]
      - from: COACH_NOTIFIED
        to: PROTESTED
        trigger: POST /disqualifications/{id}/protest
        actor: TeamCoach
        preconditions:
          - "logical clock <= notified_at + meet.dq_protest_window_minutes (ERR_PROTEST_WINDOW_EXPIRED; equality allowed)"
        side_effects: []
      - from: COACH_NOTIFIED
        to: CONFIRMED
        trigger: POST /disqualifications/{id}/confirm
        actor: MeetReferee
        preconditions:
          - "logical clock > notified_at + meet.dq_protest_window_minutes (ERR_PROTEST_WINDOW_OPEN)"
          - "X-User-ID != reporting_official_id (ERR_SEGREGATION_OF_DUTY)"
        side_effects: ["DQ confirmation cascade — see below"]
      - from: PROTESTED
        to: UPHELD
        trigger: POST /disqualifications/{id}/uphold
        actor: MeetReferee
        preconditions:
          - "X-User-ID != reporting_official_id (ERR_SEGREGATION_OF_DUTY)"
        side_effects: []
      - from: UPHELD
        to: CONFIRMED
        trigger: POST /disqualifications/{id}/confirm
        actor: MeetReferee
        preconditions:
          - "X-User-ID != reporting_official_id (ERR_SEGREGATION_OF_DUTY)"
        side_effects: ["DQ confirmation cascade — see below"]
      - from: PROTESTED
        to: OVERTURNED
        trigger: POST /disqualifications/{id}/overturn
        actor: MeetReferee
        preconditions:
          - "X-User-ID != reporting_official_id (ERR_SEGREGATION_OF_DUTY)"
        side_effects: ["DQ overturn cascade — see below"]
    note: |
      DQ confirmation cascade (depth 4): Disqualification -> CONFIRMED; its LaneAssignment's EventEntry
      -> DQ; if the event is COMPLETED the Result row -> DQ_EXCLUDED (place null, points 0.00) and the
      event is re-scored (surviving FINISHED entries re-placed 1..N, points recomputed per place_points);
      Team.provisional_points recomputed for every affected team; SwimEvent.version += 1.
      DQ overturn cascade: Disqualification -> OVERTURNED; EventEntry DQ -> FINISHED (only when the DQ
      had been confirmed; if the event is COMPLETED the event is re-scored with the restored time);
      Team.provisional_points recomputed; SwimEvent.version += 1 on rescore.

  - entity: MeetRecord
    initial_state: CURRENT
    terminal_states: [SUPERSEDED, REJECTED]
    transitions:
      - from: CURRENT
        to: SUPERSEDED
        trigger: "system (a challenge is ratified for the same event)"
        actor: system
        preconditions: []
        side_effects: []
      - from: PENDING_VERIFICATION
        to: SUBMITTED
        trigger: POST /records/{id}/verify
        actor: RecordsOfficer
        preconditions: []
        side_effects: []
      - from: SUBMITTED
        to: CURRENT
        trigger: POST /records/{id}/ratify
        actor: RecordsOfficer
        preconditions: []
        side_effects:
          - "prior MeetRecord of the same event with status CURRENT -> SUPERSEDED (at most one challenge exists per event because publish fires once per event)"
      - from: PENDING_VERIFICATION
        to: REJECTED
        trigger: POST /records/{id}/reject
        actor: RecordsOfficer
        preconditions: []
        side_effects: []
      - from: SUBMITTED
        to: REJECTED
        trigger: POST /records/{id}/reject
        actor: RecordsOfficer
        preconditions: []
        side_effects: []
    note: "PENDING_VERIFICATION rows are created only by the publish cascade (initial_state CURRENT applies to POST /events/{id}/records standing-record creation)"

# =============================================================================
# 1.2.1 Concurrency Rules (OCC only; serially observable)
# =============================================================================
concurrency_rules:
  - rule_id: meet-seed-stale-version
    parent_entity: Meet
    write_endpoint: "POST /meets/{id}/seed"
    occ_field: expected_meet_version
    description: |
      Seeding a Meet whose version has advanced since the client last observed
      it is rejected with 412. The client's heat-sheet plan was computed from a
      stale entry roster (e.g., a reopen-entries/close-entries cycle or a prior
      successful seed moved the version), so the write is refused before any
      state check runs.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: event-complete-stale-version
    parent_entity: SwimEvent
    write_endpoint: "POST /events/{id}/complete"
    occ_field: expected_event_version
    description: |
      Completing a SwimEvent whose version has advanced since the client last
      observed it is rejected with 412. An intervening reopen (referee) or a
      DQ-confirm/overturn rescore legitimately mutated the event, so the
      client's view of which lanes are reconciled is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: backup_mean_rounded
    trigger: "readings submission and resolve, whenever both backup buttons present"
    algorithm: aggregation
    formula: |
      backup_mean_rounded = round_half_up((backup1_cs + backup2_cs) / 2) to whole centiseconds.
      PINNED ORDER (nested rounding): the mean is rounded FIRST to whole centiseconds;
      the delta check |pad_cs - backup_mean_rounded| uses the ROUNDED value;
      final_time_cs copies an already-integer centisecond source (no second rounding).
      Counter-example showing order matters: pad=2543, b1=2510, b2=2515 -> raw mean 2512.5
      (delta 30.5 > 30 would force MANUAL_REVIEW) but rounded mean 2513 (delta 30 <= 30 ->
      AUTO_CONFIRMED). The rounded-first reading is authoritative.
    input_set: "backup1_cs, backup2_cs of the LaneAssignment (both non-null)"
    precision: "whole centiseconds, round_half_up"

  - name: timing_reconciliation
    trigger: "readings submission (auto path) and resolve (manual path)"
    algorithm: threshold
    formula: |
      Source chains per variant (first non-null, valid source wins):
      PRIMARY_PRIORITY:   pad_cs (if present AND pad_status != INVALID)
                          -> backup_mean_rounded (if both backups) -> backup1_cs -> backup2_cs -> watch_cs
      BACKUP_MEAN_PRIORITY: backup_mean_rounded (if both backups)
                          -> pad_cs (if present AND pad_status != INVALID) -> backup1_cs -> backup2_cs -> watch_cs
      Auto path (readings): AUTO_CONFIRMED with PRIMARY_PRIORITY iff pad present, pad_status != INVALID,
        both backups present, and |pad_cs - backup_mean_rounded| <= meet.timing_delta_threshold_cs;
        otherwise reconciliation_status = MANUAL_REVIEW and final_time_cs = null.
      Manual path (resolve): final_time_cs per the input variant's chain. The chain is always
        non-empty at resolve time because readings require at least one timing value.
    input_set: "the LaneAssignment's four reading fields + pad_status + meet.timing_delta_threshold_cs"
    precision: "whole centiseconds"
    variants:
      - name: PRIMARY_PRIORITY
        when: "auto-confirmation, or resolve with variant=PRIMARY_PRIORITY"
        difference: "trusts the touchpad over the backup mean"
      - name: BACKUP_MEAN_PRIORITY
        when: "resolve with variant=BACKUP_MEAN_PRIORITY"
        difference: "trusts the rounded backup mean over the touchpad; identical readings produce a different final_time_cs whenever pad_cs != backup_mean_rounded"

  - name: meet_seeding
    trigger: "POST /meets/{id}/seed"
    algorithm: chronological
    formula: |
      For each SwimEvent (status PENDING) of the meet, in event_number ASC order:
      1. candidates = EventEntry rows with status == ENTERED AND qualification_status == VERIFIED.
      2. If candidates empty -> SwimEvent -> CANCELLED; continue.
      3. Sort: seed_time_cs ASC, with null (NT) entries AFTER all timed entries; tie-break:
         EventEntry.created_at ASC. (id is NEVER a tie-break.)
      4. num_heats = ceil(n / meet.lane_count). Fastest heat has the highest heat_number.
         Fill heats fastest-first: the fastest meet.lane_count candidates form heat num_heats,
         the next chunk heat num_heats-1, ...; the slowest heat (heat 1) holds the remainder
         (possibly partial).
      5. Within each heat, fastest candidate gets lane lane_priority[0], next lane_priority[1], ...
         lane_priority = lanes ordered by |lane - (lane_count + 1) / 2| ASC, ties to the LOWER lane.
         (lane_count 6 -> [3,4,2,5,1,6]; lane_count 8 -> [4,5,3,6,2,7,1,8].)
      6. Each candidate -> EventEntry SEEDED; LaneAssignment created (ACTIVE, PENDING_READINGS).
      7. SwimEvent PENDING -> SEEDED.
    input_set: "all EventEntry rows of the meet (filter as above)"
    note: "REJECTED entries are never seeded and receive no LaneAssignment"

  - name: place_points
    trigger: "event complete (initial scoring), DQ confirm/overturn rescore"
    algorithm: tiered_pricing
    formula: |
      Scored set: EventEntry rows of the event with status FINISHED (final_time_cs non-null),
      ordered final_time_cs ASC, tie-break LaneAssignment.created_at ASC only for display order
      (identical times ALWAYS tie for place regardless of created_at).
      Places: competition ranking ("1224"): equal final_time_cs => same place; the next distinct
      time's place advances by the tie count. DQ / NO_SHOW / SCRATCHED entries are excluded.
      base(place) = meet.points_table[place-1] if place <= len(points_table) else 0.
      Per tied group of size k at place p under meet.scoring_tie_policy:
        SPLIT: each tied result gets round_half_up( sum(base(p..p+k-1)) / k, 2 )   # 2dp
        TOP:   each tied result gets base(p); the following place still advances by k.
      Relay events (event.is_relay == true): the result's points are multiplied by
      meet.relay_points_multiplier AFTER tie handling (round_half_up to 2dp after multiplication).
      Non-tied non-relay: points = base(place) rendered at 2dp.
    input_set: "FINISHED EventEntry rows of the event + their reconciled final_time_cs"
    precision: "2 decimal places, round_half_up"
    variants:
      - name: TIE_SPLIT
        when: "meet.scoring_tie_policy == SPLIT"
        difference: "tied results share the sum of the covered places' points (e.g. tie at 2nd with table [9,7,6,...] -> 6.50 each)"
      - name: TIE_TOP
        when: "meet.scoring_tie_policy == TOP"
        difference: "tied results each receive the higher place's points (tie at 2nd -> 7.00 each); identical race data, different points"

  - name: team_points_rollup
    trigger: "event complete, event reopen, DQ confirm/overturn rescore, event publish"
    algorithm: aggregation
    formula: |
      Team.provisional_points = round_half_up( sum(Result.points over Result rows whose team_id
        == Team.id), 2 )  -- includes UNOFFICIAL and OFFICIAL; DQ_EXCLUDED rows contribute 0.00.
      Team.official_points  = round_half_up( sum(Result.points over Result rows whose team_id
        == Team.id AND Result.status == OFFICIAL), 2 ).
      Recomputed (not incrementally adjusted) on every trigger; Team.version += 1 on change.
    input_set: "Result rows per team, filtered as above"

  - name: age_group_derivation
    trigger: "swimmer creation (and meet.start_date edit before ENTRIES_OPEN)"
    algorithm: threshold
    formula: |
      age_on_meet_start = whole years from birth_date to meet.start_date
        (birthday ON start_date counts: born 2014-08-15, start 2026-08-15 -> age 12).
      age_group: age <= 10 -> TEN_AND_UNDER; 11 <= age <= 12 -> ELEVEN_TWELVE;
        13 <= age <= 14 -> THIRTEEN_FOURTEEN; age >= 15 -> FIFTEEN_AND_OVER.
      Entry eligibility: swimmer.age_group MUST equal SwimEvent.age_group (ERR_AGE_GROUP_INELIGIBLE).
    input_set: "Swimmer.birth_date, Meet.start_date"
    precision: "whole years"

  - name: record_challenge_check
    trigger: "event publish"
    algorithm: threshold
    formula: |
      standing = the MeetRecord of this event with status CURRENT (0 or 1 exists).
      challengers = OFFICIAL non-DQ_EXCLUDED Results of the event with final_time_cs non-null
        AND final_time_cs < standing.record_time_cs (strictly; equality does NOT break the record).
      If standing exists AND challengers non-empty: create exactly ONE MeetRecord
        (status PENDING_VERIFICATION, record_time_cs = min(challengers' final_time_cs),
        holder = that result's swimmer full_name or relay display, holder_team = team_code,
        set_on_date = event.session_date, challenger_entry_id = that result's entry_id).
      If no standing record exists, no challenge is created (records start from explicit
        standing-record creation by RecordsOfficer).
    input_set: "OFFICIAL Results of the event; standing MeetRecord"

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present and role is a declared role"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: "all endpoints"
  - priority: 2
    category: auth
    check: "Role permitted per endpoint roles list; ownership: TeamCoach X-User-ID must equal the resource's Team.id; official self-confirm requires X-User-ID == assignment.official_id"
    error_id: ERR_INSUFFICIENT_PERMISSIONS
    http_status: 403
    applies_to: "all endpoints"
  - priority: 3
    category: auth
    check: "Segregation of duties: DQ confirm/uphold/overturn X-User-ID != Disqualification.reporting_official_id"
    error_id: ERR_SEGREGATION_OF_DUTY
    http_status: 403
    applies_to: "POST /disqualifications/{id}/confirm|uphold|overturn"
  - priority: 4
    category: existence
    check: "Path resource ids exist (validated left-to-right); body FK references exist"
    error_id: "ERR_{RESOURCE}_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints"
  - priority: 5
    category: state
    check: "OCC: expected_meet_version / expected_event_version matches current version (when the endpoint declares the field)"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /meets/{id}/seed, POST /events/{id}/complete"
  - priority: 6
    category: state
    check: "Target resource state preconditions (Meet/SwimEvent/EventEntry/RelayTeam/LaneAssignment/Disqualification/MeetRecord/OfficialAssignment machine guards)"
    error_id: "domain state errors (ERR_MEET_NOT_ACCEPTING_ENTRIES, ERR_EVENT_NOT_IN_PROGRESS, ERR_ENTRY_NOT_SCRATCHABLE, ...)"
    http_status: 409
    applies_to: "all mutation endpoints"
  - priority: 7
    category: business_safety
    check: "Official certification: role_on_deck in Official.certifications AND certification_expires_on >= event.session_date (equality valid)"
    error_id: ERR_CERTIFICATION_INVALID
    http_status: 422
    applies_to: "POST /events/{id}/official-assignments"
  - priority: 8
    category: business_temporal
    check: "Entry window: logical clock <= meet.entry_deadline_utc (equality allowed)"
    error_id: ERR_ENTRY_DEADLINE_PASSED
    http_status: 409
    applies_to: "POST /entries, POST /relay-teams"
  - priority: 9
    category: business_temporal
    check: "DQ protest window: now <= notified_at + dq_protest_window_minutes (equality allowed); confirm-from-COACH_NOTIFIED requires now strictly past the window"
    error_id: "ERR_PROTEST_WINDOW_EXPIRED | ERR_PROTEST_WINDOW_OPEN"
    http_status: 409
    applies_to: "POST /disqualifications/{id}/protest|confirm"
  - priority: 10
    category: business_constraint
    check: "Eligibility: age_group match, gender match (MIXED events accept any), team status == REGISTERED (a WITHDRAWN team implies its swimmers are INACTIVE, so the team check always fires first)"
    error_id: "ERR_AGE_GROUP_INELIGIBLE | ERR_GENDER_INELIGIBLE | ERR_TEAM_NOT_ACTIVE"
    http_status: 422
    applies_to: "POST /entries, POST /relay-teams, POST /relay-teams/{id}/legs"
  - priority: 11
    category: business_constraint
    check: "Entry aggregate limit: swimmer's non-SCRATCHED individual entries in this meet < max_individual_entries_per_swimmer (the 4th allowed, the 5th rejected at the default)"
    error_id: ERR_SWIMMER_ENTRY_LIMIT
    http_status: 409
    applies_to: "POST /entries (individual)"
  - priority: 12
    category: business_constraint
    check: "Recovery buffer: same swimmer's individual events on one session_date must leave gap >= min_recovery_minutes (gap == min_recovery_minutes allowed); overlap is always a violation"
    error_id: ERR_RECOVERY_WINDOW_VIOLATION
    http_status: 409
    applies_to: "POST /entries (individual)"
  - priority: 13
    category: business_constraint
    check: "Official double-booking: half-open [start,end) overlap with the official's PROPOSED|CONFIRMED assignments on the same session_date; adjacency (end == start) is allowed"
    error_id: ERR_OFFICIAL_ASSIGNMENT_CONFLICT
    http_status: 409
    applies_to: "POST /events/{id}/official-assignments (vs PROPOSED+CONFIRMED), POST /official-assignments/{id}/confirm (vs CONFIRMED only)"
  - priority: 14
    category: business_constraint
    check: "Relay structure: leg_number 1..4, swimmer unique within relay, swimmer on relay's team"
    error_id: "ERR_RELAY_SWIMMER_DUPLICATE | ERR_RELAY_SWIMMER_TEAM_MISMATCH"
    http_status: 409
    applies_to: "POST /relay-teams/{id}/legs"
  - priority: 15
    category: business_constraint
    check: "Aggregate gates: seed requires all qualifications decided (ERR_QUALIFICATION_UNDECIDED); event start requires official coverage (ERR_OFFICIAL_COVERAGE_INCOMPLETE); event complete requires lanes reconciled (ERR_UNRESOLVED_LANES_EXIST); meet complete requires events OFFICIAL|CANCELLED (ERR_EVENTS_NOT_OFFICIAL); finalize requires no pending records (ERR_RECORDS_PENDING); lock requires 4 legs (ERR_RELAY_LEG_COUNT_INCOMPLETE); DQ record requires no other non-terminal DQ on the lane (ERR_DQ_ALREADY_ACTIVE); standing record uniqueness (ERR_RECORD_STANDING_EXISTS)"
    error_id: "as listed"
    http_status: 409
    applies_to: "various"
  - priority: 16
    category: business_constraint
    check: "readings payload must carry at least one of pad_cs/backup1_cs/backup2_cs/watch_cs"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "POST /lane-assignments/{id}/readings"

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Meet lifecycle ---
  - { method: POST, path: "/meets", description: "Create meet", roles: [MeetDirector], code: 201, input: [meet_name, course, start_date, entry_deadline_utc, "lane_count?", "points_table?", "relay_points_multiplier?", "max_individual_entries_per_swimmer?", "dq_protest_window_minutes?", "min_recovery_minutes?", "timing_delta_threshold_cs?", "scoring_tie_policy?"], output: Meet, side_effects: ["status SETUP"] }
  - { method: GET, path: "/meets/{id}", description: "Get meet", roles: [Any], code: 200, input: [], output: Meet, side_effects: [] }
  - { method: POST, path: "/meets/{id}/open-entries", description: "SETUP -> ENTRIES_OPEN", roles: [MeetDirector], code: 200, input: [], output: Meet, side_effects: ["Meet.version += 1"] }
  - { method: POST, path: "/meets/{id}/close-entries", description: "ENTRIES_OPEN -> ENTRIES_CLOSED; requires clock past deadline", roles: [MeetDirector], code: 200, input: [], output: Meet, side_effects: ["Meet.version += 1"] }
  - { method: POST, path: "/meets/{id}/seed", description: "Generate heat sheet: heats/lanes for all events (OCC)", roles: [MeetDirector], code: 200, input: [expected_meet_version], output: Meet, side_effects: ["meet_seeding runs", "Meet.version += 1", "increments Meet.version by 1"] }
  - { method: POST, path: "/meets/{id}/reopen-entries", description: "SEEDED -> ENTRIES_OPEN; wipes lane assignments", roles: [MeetDirector], code: 200, input: [new_entry_deadline_utc], output: Meet, side_effects: ["lane assignments hard-deleted", "entries SEEDED -> ENTERED", "Meet.version += 1"] }
  - { method: POST, path: "/meets/{id}/complete", description: "SEEDED -> COMPLETED when all events OFFICIAL|CANCELLED", roles: [MeetDirector], code: 200, input: [], output: Meet, side_effects: ["Meet.version += 1"] }
  - { method: POST, path: "/meets/{id}/finalize", description: "COMPLETED -> OFFICIAL when no pending records", roles: [MeetDirector], code: 200, input: [], output: Meet, side_effects: ["Meet.version += 1"] }
  # --- Team / Swimmer ---
  - { method: POST, path: "/teams", description: "Register team", roles: [MeetDirector], code: 201, input: [meet_id, team_code, team_name], output: Team, side_effects: ["status REGISTERED, points 0"] }
  - { method: GET, path: "/teams/{id}", description: "Get team", roles: [Any], code: 200, input: [], output: Team, side_effects: [] }
  - { method: GET, path: "/teams", description: "List teams", roles: [Any], code: 200, input: ["meet_id?", "limit?", "offset?"], output: "Team[]", side_effects: [] }
  - { method: POST, path: "/teams/{id}/withdraw", description: "Team withdrawal cascade", roles: [MeetDirector], code: 200, input: [], output: Team, side_effects: ["swimmers INACTIVE; entries SCRATCHED; lanes VOIDED; relays SCRATCHED"] }
  - { method: POST, path: "/swimmers", description: "Register swimmer", roles: [TeamCoach], code: 201, input: [team_id, full_name, birth_date, gender], output: Swimmer, side_effects: ["age_on_meet_start + age_group computed"] }
  - { method: GET, path: "/swimmers/{id}", description: "Get swimmer", roles: [Any], code: 200, input: [], output: Swimmer, side_effects: [] }
  - { method: GET, path: "/swimmers", description: "List swimmers", roles: [Any], code: 200, input: ["team_id?", "limit?", "offset?"], output: "Swimmer[]", side_effects: [] }
  # --- SwimEvent ---
  - { method: POST, path: "/events", description: "Create event", roles: [MeetDirector], code: 201, input: [meet_id, event_number, gender, age_group, stroke, distance_meters, is_relay, "qualifying_time_cs?", session_date, scheduled_start_minute, scheduled_end_minute], output: SwimEvent, side_effects: ["status PENDING"] }
  - { method: GET, path: "/events/{id}", description: "Get event", roles: [Any], code: 200, input: [], output: SwimEvent, side_effects: [] }
  - { method: GET, path: "/events", description: "List events", roles: [Any], code: 200, input: ["meet_id?", "limit?", "offset?"], output: "SwimEvent[]", side_effects: [] }
  - { method: POST, path: "/events/{id}/start", description: "SEEDED -> IN_PROGRESS; coverage gate", roles: [MeetDirector], code: 200, input: [], output: SwimEvent, side_effects: ["SwimEvent.version += 1"] }
  - { method: POST, path: "/events/{id}/complete", description: "IN_PROGRESS -> COMPLETED; scores results (OCC)", roles: [MeetDirector], code: 200, input: [expected_event_version], output: SwimEvent, side_effects: ["place_points runs", "Results created", "Team.provisional_points recomputed", "SwimEvent.version += 1", "increments SwimEvent.version by 1"] }
  - { method: POST, path: "/events/{id}/reopen", description: "COMPLETED -> IN_PROGRESS; deletes results", roles: [MeetReferee], code: 200, input: [], output: SwimEvent, side_effects: ["Results hard-deleted", "entries FINISHED -> SEEDED", "Team.provisional_points recomputed", "SwimEvent.version += 1"] }
  - { method: POST, path: "/events/{id}/publish", description: "COMPLETED -> OFFICIAL; records challenges", roles: [MeetDirector], code: 200, input: [], output: SwimEvent, side_effects: ["Results -> OFFICIAL", "Team.official_points recomputed", "record_challenge_check runs", "SwimEvent.version += 1"] }
  - { method: GET, path: "/events/{id}/heat-sheet", description: "Computed read: seeded lanes grouped by heat", roles: [Any], code: 200, input: [], output: "{ event_id: string, heats: array }", side_effects: [] }
  - { method: GET, path: "/events/{id}/results", description: "Results for event", roles: [Any], code: 200, input: ["limit?", "offset?"], output: "Result[]", side_effects: [] }
  - { method: GET, path: "/events/{id}/official-assignments", description: "Assignments for event", roles: [Any], code: 200, input: ["limit?", "offset?"], output: "OfficialAssignment[]", side_effects: [] }
  - { method: GET, path: "/events/{id}/records", description: "Records for event", roles: [Any], code: 200, input: ["limit?", "offset?"], output: "MeetRecord[]", side_effects: [] }
  # --- Entries ---
  - { method: POST, path: "/entries", description: "Create individual entry (relay entries are created via POST /relay-teams)", roles: [TeamCoach], code: 201, input: [event_id, swimmer_id, "seed_time_cs?"], output: EventEntry, side_effects: ["status ENTERED, qualification UNVERIFIED", "Team.active_entry_count recomputed"] }
  - { method: GET, path: "/entries/{id}", description: "Get entry", roles: [Any], code: 200, input: [], output: EventEntry, side_effects: [] }
  - { method: GET, path: "/entries", description: "List entries", roles: [Any], code: 200, input: ["event_id?", "swimmer_id?", "relay_team_id?", "team_id?", "limit?", "offset?"], output: "EventEntry[]", side_effects: [] }
  - { method: POST, path: "/entries/{id}/verify", description: "Verify qualifying time: seed_time_cs <= qualifying_time_cs (equality qualifies); no-cut events verify any seed incl. NT; requires meet.status IN {ENTRIES_OPEN, ENTRIES_CLOSED} and entry ENTERED (ERR_ENTRY_NOT_VERIFIABLE)", roles: [MeetDirector], code: 200, input: [], output: EventEntry, side_effects: ["qualification_status -> VERIFIED | REJECTED"] }
  - { method: POST, path: "/entries/{id}/scratch", description: "ENTERED|SEEDED -> SCRATCHED; frees lane", roles: [TeamCoach], code: 200, input: [], output: EventEntry, side_effects: ["lane VOIDED when SEEDED", "Team.active_entry_count recomputed"] }
  - { method: POST, path: "/entries/{id}/unscratch", description: "SCRATCHED -> ENTERED (pre-seed) or SEEDED (lane restored)", roles: [TeamCoach], code: 200, input: [], output: EventEntry, side_effects: ["lane VOIDED -> ACTIVE when restoring", "Team.active_entry_count recomputed"] }
  - { method: POST, path: "/entries/{id}/mark-no-show", description: "SEEDED -> NO_SHOW at event IN_PROGRESS", roles: [MeetReferee], code: 200, input: [], output: EventEntry, side_effects: ["lane VOIDED", "Team.active_entry_count recomputed"] }
  - { method: GET, path: "/entries/{id}/result", description: "Result for entry (0-1)", roles: [Any], code: 200, input: [], output: "Result[]", side_effects: [] }
  # --- Relay ---
  - { method: POST, path: "/relay-teams", description: "Declare relay team; auto-creates its EventEntry", roles: [TeamCoach], code: 201, input: [team_id, event_id, relay_name, "seed_time_cs?"], output: RelayTeam, side_effects: ["EventEntry created (ENTERED, UNVERIFIED, relay_team_id set)", "Team.active_entry_count recomputed"] }
  - { method: GET, path: "/relay-teams/{id}", description: "Get relay team", roles: [Any], code: 200, input: [], output: RelayTeam, side_effects: [] }
  - { method: GET, path: "/relay-teams", description: "List relay teams", roles: [Any], code: 200, input: ["team_id?", "event_id?", "entry_id?", "limit?", "offset?"], output: "RelayTeam[]", side_effects: [] }
  - { method: POST, path: "/relay-teams/{id}/legs", description: "Add/replace a leg (DECLARED only)", roles: [TeamCoach], code: 201, input: [leg_number, swimmer_id], output: RelayLeg, side_effects: ["existing leg with same leg_number replaced"] }
  - { method: GET, path: "/relay-teams/{id}/legs", description: "Legs of relay", roles: [Any], code: 200, input: ["limit?", "offset?"], output: "RelayLeg[]", side_effects: [] }
  - { method: GET, path: "/relay-legs/{id}", description: "Get a leg", roles: [Any], code: 200, input: [], output: RelayLeg, side_effects: [] }
  - { method: GET, path: "/relay-legs", description: "List legs", roles: [Any], code: 200, input: ["swimmer_id?", "relay_team_id?", "limit?", "offset?"], output: "RelayLeg[]", side_effects: [] }
  - { method: POST, path: "/relay-teams/{id}/lock", description: "DECLARED -> LEGS_LOCKED (4 legs + VERIFIED entry)", roles: [TeamCoach], code: 200, input: [], output: RelayTeam, side_effects: [] }
  - { method: POST, path: "/relay-teams/{id}/scratch", description: "Relay scratch cascade", roles: [TeamCoach], code: 200, input: [], output: RelayTeam, side_effects: ["entry SCRATCHED; lane VOIDED when seeded"] }
  # --- Lane assignments / timing ---
  - { method: GET, path: "/lane-assignments/{id}", description: "Get lane assignment", roles: [Any], code: 200, input: [], output: LaneAssignment, side_effects: [] }
  - { method: GET, path: "/lane-assignments", description: "List lane assignments", roles: [Any], code: 200, input: ["event_id?", "entry_id?", "limit?", "offset?"], output: "LaneAssignment[]", side_effects: [] }
  - { method: POST, path: "/lane-assignments/{id}/readings", description: "Submit timing readings (at least one of pad_cs/backup1_cs/backup2_cs/watch_cs required, else ERR_INVALID_REQUEST); auto-confirm or MANUAL_REVIEW", roles: [TimingOperator], code: 200, input: ["pad_cs?", "backup1_cs?", "backup2_cs?", "watch_cs?", "pad_status?"], output: LaneAssignment, side_effects: ["timing_reconciliation runs (backup_mean_rounded rounding order pinned)"] }
  - { method: POST, path: "/lane-assignments/{id}/resolve", description: "MANUAL_REVIEW -> RESOLVED with chosen variant", roles: [TimingOperator], code: 200, input: [variant, "pad_status?"], output: LaneAssignment, side_effects: ["final_time_cs per variant chain"] }
  - { method: POST, path: "/lane-assignments/{id}/reopen-timing", description: "RESOLVED|AUTO_CONFIRMED -> MANUAL_REVIEW", roles: [MeetReferee], code: 200, input: [], output: LaneAssignment, side_effects: ["final_time_cs cleared"] }
  - { method: GET, path: "/lane-assignments/{id}/disqualifications", description: "DQs on a swim", roles: [Any], code: 200, input: ["limit?", "offset?"], output: "Disqualification[]", side_effects: [] }
  # --- Results ---
  - { method: GET, path: "/teams/{id}/results", description: "Results for team", roles: [Any], code: 200, input: ["limit?", "offset?"], output: "Result[]", side_effects: [] }
  # --- Officials ---
  - { method: POST, path: "/officials", description: "Roster official", roles: [MeetDirector], code: 201, input: [meet_id, full_name, lsc_membership_id, certifications, certification_expires_on], output: Official, side_effects: [] }
  - { method: GET, path: "/officials/{id}", description: "Get official", roles: [Any], code: 200, input: [], output: Official, side_effects: [] }
  - { method: GET, path: "/officials", description: "List officials", roles: [Any], code: 200, input: ["meet_id?", "limit?", "offset?"], output: "Official[]", side_effects: [] }
  - { method: POST, path: "/events/{id}/official-assignments", description: "Propose official assignment (certification + overlap checks)", roles: [MeetDirector], code: 201, input: [official_id, role_on_deck], output: OfficialAssignment, side_effects: ["status PROPOSED"] }
  - { method: GET, path: "/official-assignments/{id}", description: "Get assignment", roles: [Any], code: 200, input: [], output: OfficialAssignment, side_effects: [] }
  - { method: GET, path: "/official-assignments", description: "List assignments", roles: [Any], code: 200, input: ["official_id?", "limit?", "offset?"], output: "OfficialAssignment[]", side_effects: [] }
  - { method: POST, path: "/official-assignments/{id}/confirm", description: "Assigned official confirms own assignment", roles: [DeckOfficial, MeetReferee], code: 200, input: [], output: OfficialAssignment, side_effects: ["status CONFIRMED"] }
  - { method: POST, path: "/official-assignments/{id}/release", description: "Release assignment", roles: [MeetDirector], code: 200, input: [], output: OfficialAssignment, side_effects: ["status RELEASED"] }
  # --- Disqualifications ---
  - { method: POST, path: "/lane-assignments/{id}/disqualifications", description: "Record DQ call on a swim", roles: [DeckOfficial], code: 201, input: [dq_code, call_notes], output: Disqualification, side_effects: ["status RECORDED; reporting_official_id := X-User-ID"] }
  - { method: GET, path: "/disqualifications/{id}", description: "Get DQ", roles: [Any], code: 200, input: [], output: Disqualification, side_effects: [] }
  - { method: GET, path: "/disqualifications", description: "List DQs", roles: [Any], code: 200, input: ["reporting_official_id?", "resolved_by_referee_id?", "limit?", "offset?"], output: "Disqualification[]", side_effects: [] }
  - { method: POST, path: "/disqualifications/{id}/notify-coach", description: "RECORDED -> COACH_NOTIFIED", roles: [MeetReferee], code: 200, input: [], output: Disqualification, side_effects: ["notified_at := now"] }
  - { method: POST, path: "/disqualifications/{id}/protest", description: "COACH_NOTIFIED -> PROTESTED within window", roles: [TeamCoach], code: 200, input: [], output: Disqualification, side_effects: [] }
  - { method: POST, path: "/disqualifications/{id}/confirm", description: "COACH_NOTIFIED (window elapsed) | UPHELD -> CONFIRMED; scoring cascade", roles: [MeetReferee], code: 200, input: [], output: Disqualification, side_effects: ["entry -> DQ", "event rescore when COMPLETED", "Team.provisional_points recomputed", "SwimEvent.version += 1 on rescore"] }
  - { method: POST, path: "/disqualifications/{id}/uphold", description: "PROTESTED -> UPHELD", roles: [MeetReferee], code: 200, input: [], output: Disqualification, side_effects: [] }
  - { method: POST, path: "/disqualifications/{id}/overturn", description: "PROTESTED -> OVERTURNED; restore cascade", roles: [MeetReferee], code: 200, input: [], output: Disqualification, side_effects: ["entry DQ -> FINISHED", "event rescore when COMPLETED", "Team.provisional_points recomputed"] }
  # --- Records ---
  - { method: POST, path: "/events/{id}/records", description: "Create standing record (CURRENT); only when none CURRENT", roles: [RecordsOfficer], code: 201, input: [record_time_cs, holder_name, holder_team, set_on_date], output: MeetRecord, side_effects: ["status CURRENT"] }
  - { method: GET, path: "/records/{id}", description: "Get record", roles: [Any], code: 200, input: [], output: MeetRecord, side_effects: [] }
  - { method: GET, path: "/records", description: "List records", roles: [Any], code: 200, input: ["event_id?", "challenger_entry_id?", "limit?", "offset?"], output: "MeetRecord[]", side_effects: [] }
  - { method: POST, path: "/records/{id}/verify", description: "PENDING_VERIFICATION -> SUBMITTED", roles: [RecordsOfficer], code: 200, input: [], output: MeetRecord, side_effects: [] }
  - { method: POST, path: "/records/{id}/ratify", description: "SUBMITTED -> CURRENT; supersedes old, auto-rejects slower pending challenges", roles: [RecordsOfficer], code: 200, input: [], output: MeetRecord, side_effects: ["old CURRENT -> SUPERSEDED", "slower pending challenges -> REJECTED"] }
  - { method: POST, path: "/records/{id}/reject", description: "PENDING_VERIFICATION|SUBMITTED -> REJECTED", roles: [RecordsOfficer], code: 200, input: [], output: MeetRecord, side_effects: [] }
  # --- Test-driving clock ---
  - { method: POST, path: "/_clock/set_current_utc", description: "Set the logical clock. Server startup default (before any set) is exactly 2026-08-01T00:00:00Z; the logical clock never falls back to wall-clock time.", roles: [Any], code: 200, input: [to_iso8601], output: "{ current_utc: string }", side_effects: ["logical clock advanced"] }

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role missing/invalid" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field, type mismatch, invalid enum, no timing reading supplied, or malformed body" }
  - { id: ERR_INSUFFICIENT_PERMISSIONS, http: 403, condition: "Role not permitted, or ownership check failed (TeamCoach acting on another team's resource; official confirming another official's assignment; DeckOfficial recording DQ without a CONFIRMED STROKE_TURN_JUDGE assignment on that event)" }
  - { id: ERR_SEGREGATION_OF_DUTY, http: 403, condition: "DQ confirm/uphold/overturn attempted by the reporting official (X-User-ID == reporting_official_id)" }
  - { id: ERR_MEET_NOT_FOUND, http: 404, condition: "meet id does not exist" }
  - { id: ERR_TEAM_NOT_FOUND, http: 404, condition: "team id does not exist" }
  - { id: ERR_SWIMMER_NOT_FOUND, http: 404, condition: "swimmer id does not exist" }
  - { id: ERR_EVENT_NOT_FOUND, http: 404, condition: "event id does not exist" }
  - { id: ERR_ENTRY_NOT_FOUND, http: 404, condition: "entry id does not exist" }
  - { id: ERR_RELAY_TEAM_NOT_FOUND, http: 404, condition: "relay team id does not exist" }
  - { id: ERR_LANE_ASSIGNMENT_NOT_FOUND, http: 404, condition: "lane assignment id does not exist" }
  - { id: ERR_OFFICIAL_NOT_FOUND, http: 404, condition: "official id does not exist" }
  - { id: ERR_OFFICIAL_ASSIGNMENT_NOT_FOUND, http: 404, condition: "official assignment id does not exist" }
  - { id: ERR_DISQUALIFICATION_NOT_FOUND, http: 404, condition: "disqualification id does not exist" }
  - { id: ERR_RECORD_NOT_FOUND, http: 404, condition: "record id does not exist" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_meet_version / expected_event_version does not match current version (OCC)" }
  - { id: ERR_MEET_NOT_ACCEPTING_ENTRIES, http: 409, condition: "POST /entries or /relay-teams while meet.status != ENTRIES_OPEN" }
  - { id: ERR_ENTRY_WINDOW_STILL_OPEN, http: 409, condition: "close-entries before the logical clock has passed entry_deadline_utc" }
  - { id: ERR_MEET_NOT_SEEDABLE, http: 409, condition: "seed while meet.status != ENTRIES_CLOSED" }
  - { id: ERR_MEET_NOT_SEEDED, http: 409, condition: "event start while meet.status != SEEDED" }
  - { id: ERR_EVENTS_ALREADY_UNDERWAY, http: 409, condition: "reopen-entries while an event is IN_PROGRESS|COMPLETED|OFFICIAL" }
  - { id: ERR_EVENTS_NOT_OFFICIAL, http: 409, condition: "meet complete while an event is not OFFICIAL|CANCELLED" }
  - { id: ERR_MEET_ALREADY_COMPLETED, http: 409, condition: "team withdraw once meet COMPLETED|OFFICIAL" }
  - { id: ERR_EVENT_NOT_IN_PROGRESS, http: 409, condition: "readings/resolve/reopen-timing/mark-no-show while event not IN_PROGRESS" }
  - { id: ERR_EVENT_ALREADY_UNDERWAY, http: 409, condition: "release of CONFIRMED assignment once event IN_PROGRESS or later" }
  - { id: ERR_ENTRY_NOT_SCRATCHABLE, http: 409, condition: "scratch from a state that forbids it (event IN_PROGRESS+, entry already terminal)" }
  - { id: ERR_ENTRY_NOT_UNSCRATCHABLE, http: 409, condition: "unscratch when entry not SCRATCHED, or lane row gone, or event state forbids restore" }
  - { id: ERR_LANE_VOIDED, http: 409, condition: "readings on a VOIDED lane" }
  - { id: ERR_DQ_NOT_TERMINAL, http: 409, condition: "publish while a DQ on the event is non-terminal" }
  - { id: ERR_DQ_ALREADY_ACTIVE, http: 409, condition: "recording a DQ on a lane that already has a non-terminal DQ" }
  - { id: ERR_DQ_INVALID_STATE, http: 409, condition: "DQ transition from a state that forbids it (e.g., confirm from RECORDED, protest from PROTESTED)" }
  - { id: ERR_RELAY_LEG_COUNT_INCOMPLETE, http: 409, condition: "lock with != 4 legs" }
  - { id: ERR_RELAY_LEGS_LOCKED, http: 409, condition: "leg add/replace while LEGS_LOCKED or SCRATCHED" }
  - { id: ERR_RELAY_LOCK_WINDOW_CLOSED, http: 409, condition: "lock once event IN_PROGRESS or later" }
  - { id: ERR_RELAY_NOT_SCRATCHABLE, http: 409, condition: "relay scratch of LEGS_LOCKED relay once event IN_PROGRESS+" }
  - { id: ERR_RELAY_SWIMMER_DUPLICATE, http: 409, condition: "same swimmer twice in one relay" }
  - { id: ERR_RELAY_SWIMMER_TEAM_MISMATCH, http: 422, condition: "leg swimmer not on the relay's team" }
  - { id: ERR_RECORD_INVALID_STATE, http: 409, condition: "record transition from a state that forbids it" }
  - { id: ERR_RECORD_STANDING_EXISTS, http: 409, condition: "creating a standing record while one is CURRENT for the event" }
  - { id: ERR_RECORDS_PENDING, http: 409, condition: "finalize while PENDING_VERIFICATION|SUBMITTED records exist" }
  - { id: ERR_ENTRY_DEADLINE_PASSED, http: 409, condition: "entry/relay creation after entry_deadline_utc" }
  - { id: ERR_PROTEST_WINDOW_EXPIRED, http: 409, condition: "protest after notified_at + dq_protest_window_minutes" }
  - { id: ERR_PROTEST_WINDOW_OPEN, http: 409, condition: "confirm from COACH_NOTIFIED before the protest window has elapsed" }
  - { id: ERR_CERTIFICATION_INVALID, http: 422, condition: "official lacks role certification or certification expired before event session_date" }
  - { id: ERR_AGE_GROUP_INELIGIBLE, http: 422, condition: "swimmer age_group != event age_group" }
  - { id: ERR_GENDER_INELIGIBLE, http: 422, condition: "swimmer gender != event gender (non-MIXED)" }
  - { id: ERR_TEAM_NOT_ACTIVE, http: 422, condition: "team WITHDRAWN" }
  - { id: ERR_SWIMMER_ENTRY_LIMIT, http: 409, condition: "individual entry would exceed max_individual_entries_per_swimmer" }
  - { id: ERR_RECOVERY_WINDOW_VIOLATION, http: 409, condition: "two individual events of one swimmer on a session_date with gap < min_recovery_minutes or overlapping" }
  - { id: ERR_OFFICIAL_ASSIGNMENT_CONFLICT, http: 409, condition: "official has an overlapping PROPOSED|CONFIRMED (create) or CONFIRMED (confirm) assignment on the same session_date (half-open; adjacency allowed)" }
  - { id: ERR_OFFICIAL_COVERAGE_INCOMPLETE, http: 409, condition: "event start without CONFIRMED REFEREE + CONFIRMED STROKE_TURN_JUDGE" }
  - { id: ERR_QUALIFICATION_UNDECIDED, http: 409, condition: "seed with UNVERIFIED entries present, or relay lock with unverified entry" }
  - { id: ERR_UNRESOLVED_LANES_EXIST, http: 409, condition: "event complete with ACTIVE lanes not AUTO_CONFIRMED|RESOLVED" }
  - { id: ERR_LANE_NOT_RECONCILED, http: 409, condition: "DQ record requires the lane's reconciliation_status IN {AUTO_CONFIRMED, RESOLVED}" }
  - { id: ERR_EVENT_NOT_SEEDED, http: 409, condition: "event start requires SwimEvent.status == SEEDED (e.g., event PENDING or CANCELLED)" }
  - { id: ERR_EVENT_NOT_COMPLETED, http: 409, condition: "publish/reopen requires SwimEvent.status == COMPLETED" }
  - { id: ERR_MEET_INVALID_STATE, http: 409, condition: "meet lifecycle transition from a state that forbids it (e.g., open-entries when not SETUP)" }
  - { id: ERR_ENTRY_NOT_VERIFIABLE, http: 409, condition: "verify requires meet.status IN {ENTRIES_OPEN, ENTRIES_CLOSED} and entry status ENTERED" }

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: MeetDirector
    description: "Meet administrator: meet lifecycle, teams, events, entries verification, seeding, officials roster, assignments"
    identity: opaque
    exclusive_operations:
      - "POST /meets, /meets/{id}/open-entries|close-entries|seed|reopen-entries|complete|finalize"
      - "POST /teams, /teams/{id}/withdraw"
      - "POST /events, /events/{id}/start|complete|publish"
      - "POST /entries/{id}/verify"
      - "POST /officials, /events/{id}/official-assignments, /official-assignments/{id}/release"
    shared_operations: ["GET endpoints"]
  - name: TeamCoach
    description: "Club coach: owns swimmers/entries/relays of their team (X-User-ID == Team.id); protests DQs"
    identity: "entity_backed:Team"
    exclusive_operations:
      - "POST /swimmers, /entries, /relay-teams, /relay-teams/{id}/legs|lock|scratch"
      - "POST /entries/{id}/scratch|unscratch"
      - "POST /disqualifications/{id}/protest"
    shared_operations: ["GET endpoints"]
  - name: TimingOperator
    description: "Timing console operator: readings and reconciliation"
    identity: opaque
    exclusive_operations:
      - "POST /lane-assignments/{id}/readings|resolve"
    shared_operations: ["GET endpoints"]
  - name: DeckOfficial
    description: "Stroke & turn judge (X-User-ID == Official.id): records DQ calls; requires CONFIRMED STROKE_TURN_JUDGE assignment on the event"
    identity: "entity_backed:Official"
    exclusive_operations:
      - "POST /lane-assignments/{id}/disqualifications"
    shared_operations: ["GET endpoints", "POST /official-assignments/{id}/confirm (own assignment)"]
  - name: MeetReferee
    description: "Referee (X-User-ID == Official.id): DQ notification/rulings (never on own recorded calls), no-shows, event/timing reopens"
    identity: "entity_backed:Official"
    exclusive_operations:
      - "POST /disqualifications/{id}/notify-coach|confirm|uphold|overturn"
      - "POST /entries/{id}/mark-no-show"
      - "POST /events/{id}/reopen"
      - "POST /lane-assignments/{id}/reopen-timing"
    shared_operations: ["GET endpoints", "POST /official-assignments/{id}/confirm (own assignment)"]
  - name: RecordsOfficer
    description: "LSC records officer: standing records and challenge verification/ratification"
    identity: opaque
    exclusive_operations:
      - "POST /events/{id}/records, /records/{id}/verify|ratify|reject"
    shared_operations: ["GET endpoints"]
  - name: Any
    description: "Any authenticated role may read"
    identity: opaque
    shared_operations: ["all GET endpoints", "POST /_clock/set_current_utc"]
