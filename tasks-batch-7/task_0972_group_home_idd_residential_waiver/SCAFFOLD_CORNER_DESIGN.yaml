  # ===========================================================================
  # Section: calculations
  # ===========================================================================
  - section: calculations
    instances:
      - name: staffing_check_excludes_cancelled_shifts
        claim_type: input_set_filtering
        grounds: [calculations.weighted_staffing_requirement, state_machines.ShiftAssignment]
        distinguishing_aspect: "Input-set filter: CANCELLED shifts are excluded from scheduled_dsps — two shifts created, one cancelled, count drops back to 1."
        test_recipe:
          setup: ["Home with two AMBULATORY residents moved in (weighted census 2 -> required 1 DAY DSP); two DAY shifts on 2026-06-02 for D1 and D2; D2's shift then cancelled; clock 2026-06-01"]
          setup_api_calls:
            - { call: "POST /agencies", payload: { name: "Agency A" }, as: AgencyAdmin, captures: { ag_id: $.data.id } }
            - { call: "POST /homes", payload: { agency_id: "${ag_id}", name: "Home A", license_number: "LIC-1", certified_bed_count: 2 }, as: AgencyAdmin, captures: { hm_id: $.data.id } }
            - { call: "POST /staff", payload: { agency_id: "${ag_id}", full_name: "Casey Manager", staff_role: "CASE_MANAGER", certifications: ["CPR"], hire_date: "2025-01-15" }, as: AgencyAdmin, captures: { cm_id: $.data.id } }
            - { call: "POST /staff", payload: { agency_id: "${ag_id}", full_name: "Quinn Qidp", staff_role: "QIDP", certifications: ["CPR"], hire_date: "2025-01-15" }, as: AgencyAdmin, captures: { q_id: $.data.id } }
            - { call: "POST /staff", payload: { agency_id: "${ag_id}", full_name: "Dee Spone", staff_role: "DSP", certifications: ["MED_CERT"], hire_date: "2025-02-01" }, as: AgencyAdmin, captures: { d1_id: $.data.id } }
            - { call: "POST /staff", payload: { agency_id: "${ag_id}", full_name: "Dee Sptwo", staff_role: "DSP", certifications: ["CPR"], hire_date: "2025-02-02" }, as: AgencyAdmin, captures: { d2_id: $.data.id } }
            - { call: "POST /individuals", payload: { agency_id: "${ag_id}", legal_name: "Res One", medicaid_id: "MCD-101", date_of_birth: "1990-01-01", mobility_level: "AMBULATORY" }, as: CaseManager, as_user_id: "${cm_id}", captures: { r1_id: $.data.id } }
            - { call: "POST /individuals/${r1_id}/enroll", payload: {}, as: QIDP, as_user_id: "${q_id}" }
            - { call: "POST /individuals", payload: { agency_id: "${ag_id}", legal_name: "Res Two", medicaid_id: "MCD-102", date_of_birth: "1991-02-02", mobility_level: "AMBULATORY" }, as: CaseManager, as_user_id: "${cm_id}", captures: { r2_id: $.data.id } }
            - { call: "POST /individuals/${r2_id}/enroll", payload: {}, as: QIDP, as_user_id: "${q_id}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: AgencyAdmin }
            - { call: "POST /bed-assignments", payload: { home_id: "${hm_id}", bed_label: "R1", individual_id: "${r1_id}", move_in_date: "2026-06-01" }, as: CaseManager, as_user_id: "${cm_id}", captures: { ba1_id: $.data.id } }
            - { call: "POST /bed-assignments/${ba1_id}/move-in", payload: {}, as: QIDP, as_user_id: "${q_id}" }
            - { call: "POST /bed-assignments", payload: { home_id: "${hm_id}", bed_label: "R2", individual_id: "${r2_id}", move_in_date: "2026-06-01" }, as: CaseManager, as_user_id: "${cm_id}", captures: { ba2_id: $.data.id } }
            - { call: "POST /bed-assignments/${ba2_id}/move-in", payload: {}, as: QIDP, as_user_id: "${q_id}" }
            - { call: "POST /shifts", payload: { home_id: "${hm_id}", staff_member_id: "${d1_id}", window_start: "2026-06-02T07:00:00Z", window_end: "2026-06-02T15:00:00Z", shift_type: "DAY" }, as: AgencyAdmin, captures: { sh1_id: $.data.id } }
            - { call: "POST /shifts", payload: { home_id: "${hm_id}", staff_member_id: "${d2_id}", window_start: "2026-06-02T07:00:00Z", window_end: "2026-06-02T15:00:00Z", shift_type: "DAY" }, as: AgencyAdmin, captures: { sh2_id: $.data.id } }
            - { call: "POST /shifts/${sh2_id}/cancel", payload: {}, as: AgencyAdmin }
          trigger:
            - { call: "GET /homes/${hm_id}/staffing-check", payload: { shift_date: "2026-06-02", shift_type: "DAY" }, as: Any, captures: { req: $.data.required_dsps, sch: $.data.scheduled_dsps, ok: $.data.compliant_scheduled } }
          assert:
            - "weighted_census == 2 -> required_dsps == 1 (ceil(2/4))"
            - "scheduled_dsps == 1 (the CANCELLED shift is excluded from the input set)"
            - "compliant_scheduled == true (1 >= 1)"

      - name: med_adherence_closed_window_boundary
        claim_type: correct_result
        grounds: [calculations.med_adherence_rate]
        distinguishing_aspect: "Closed 30-day window: an event scheduled exactly at as_of - 30 days IS included and one 1 minute earlier is NOT; adherence floors to 66% (2 given / 3 total)."
        test_recipe:
          setup: ["Individual ENROLLED with ACTIVE med order; DSP D1 with MED_CERT; four MAR events recorded: 2026-05-31T12:00 GIVEN (boundary), 2026-05-31T11:59 GIVEN (outside), 2026-06-15T08:00 REFUSED, 2026-06-30T12:00 GIVEN (at as_of)"]
          setup_api_calls:
            - { call: "POST /agencies", payload: { name: "Agency A" }, as: AgencyAdmin, captures: { ag_id: $.data.id } }
            - { call: "POST /staff", payload: { agency_id: "${ag_id}", full_name: "Casey Manager", staff_role: "CASE_MANAGER", certifications: ["CPR"], hire_date: "2025-01-15" }, as: AgencyAdmin, captures: { cm_id: $.data.id } }
            - { call: "POST /staff", payload: { agency_id: "${ag_id}", full_name: "Quinn Qidp", staff_role: "QIDP", certifications: ["CPR"], hire_date: "2025-01-15" }, as: AgencyAdmin, captures: { q_id: $.data.id } }
            - { call: "POST /staff", payload: { agency_id: "${ag_id}", full_name: "Dee Spone", staff_role: "DSP", certifications: ["MED_CERT"], hire_date: "2025-02-01" }, as: AgencyAdmin, captures: { d1_id: $.data.id } }
            - { call: "POST /individuals", payload: { agency_id: "${ag_id}", legal_name: "Ind One", medicaid_id: "MCD-001", date_of_birth: "1990-01-01", mobility_level: "AMBULATORY" }, as: CaseManager, as_user_id: "${cm_id}", captures: { ind_id: $.data.id } }
            - { call: "POST /individuals/${ind_id}/enroll", payload: {}, as: QIDP, as_user_id: "${q_id}" }
            - { call: "POST /medication-orders", payload: { individual_id: "${ind_id}", drug_name: "Metformin", dosage: "500mg", schedule_times: ["08:00", "12:00"], start_date: "2026-05-01" }, as: QIDP, as_user_id: "${q_id}", captures: { mo_id: $.data.id } }
            - { call: "POST /admin-events", payload: { medication_order_id: "${mo_id}", scheduled_time: "2026-05-31T12:00:00Z", outcome: "GIVEN", administered_time: "2026-05-31T12:00:00Z" }, as: DSP, as_user_id: "${d1_id}" }
            - { call: "POST /admin-events", payload: { medication_order_id: "${mo_id}", scheduled_time: "2026-05-31T11:59:00Z", outcome: "GIVEN", administered_time: "2026-05-31T11:59:00Z" }, as: DSP, as_user_id: "${d1_id}" }
            - { call: "POST /admin-events", payload: { medication_order_id: "${mo_id}", scheduled_time: "2026-06-15T08:00:00Z", outcome: "REFUSED", administered_time: "2026-06-15T08:10:00Z" }, as: DSP, as_user_id: "${d1_id}" }
            - { call: "POST /admin-events", payload: { medication_order_id: "${mo_id}", scheduled_time: "2026-06-30T12:00:00Z", outcome: "GIVEN", administered_time: "2026-06-30T12:00:00Z" }, as: DSP, as_user_id: "${d1_id}" }
          trigger:
            - { call: "GET /individuals/${ind_id}/med-adherence", payload: { as_of: "2026-06-30T12:00:00Z" }, as: Any, captures: { tot: $.data.total_events, giv: $.data.given_count, pct: $.data.adherence_pct, ws: $.data.window_start } }
          assert:
            - "window_start == 2026-05-31T12:00:00Z (as_of - 30 days)"
            - "total_events == 3 — the 2026-05-31T12:00 event is included (closed lower bound), the 2026-05-31T11:59 event is excluded"
            - "given_count == 2 and adherence_pct == 66 (floor(100*2/3))"

      - name: med_adherence_empty_window_returns_null
        claim_type: correct_result
        grounds: [calculations.med_adherence_rate]
        distinguishing_aspect: "Empty input set: an individual with no MAR events in the window yields adherence_pct == null (not 0, not an error)."
        test_recipe:
          setup: ["Individual ENROLLED with an ACTIVE med order; no admin events"]
          setup_api_calls:
            - { call: "POST /agencies", payload: { name: "Agency A" }, as: AgencyAdmin, captures: { ag_id: $.data.id } }
