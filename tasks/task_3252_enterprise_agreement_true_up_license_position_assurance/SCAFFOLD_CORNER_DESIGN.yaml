scaffold_corner_design:
  # ===========================================================================
  # Section: entities
  # ===========================================================================
  - section: entities
    instances:
      - name: organization_creation_applies_price_level_default_and_computed
        claim_type: creation
        grounds:
          - entities.Organization.fields.price_level
          - calculations.price_level_tiering
        distinguishing_aspect: "POST /organizations with qualified_device_count 100 returns 201 with computed price_level A; a client-supplied price_level is not accepted (computed field)."
        test_recipe:
          setup: ["empty database; logical clock at default 2026-09-01T00:00:00Z"]
          setup_api_calls: []
          trigger:
            - call: "POST /licensing/organizations"
              payload: { legal_name: "Acme Corp", qualified_device_count: 100 }
              as: ProgramAdministrator
              captures: { org_id: $.data.id, lvl: $.data.price_level }
          assert:
            - "response 201; Organization.price_level == A (100 < 250)"
            - "Organization.version == 1 and id is a server-minted UUID"
      - name: organization_missing_qualified_device_count_returns_invalid_request
        claim_type: required_fields
        grounds:
          - entities.Organization.fields.qualified_device_count
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "Omitting the required qualified_device_count on POST /organizations yields ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "POST /licensing/organizations"
              payload: { legal_name: "No Count Corp" }
              as: ProgramAdministrator
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_REQUEST with HTTP 400"
      - name: product_invalid_enum_license_model_returns_invalid_request
        claim_type: type_constraints
        grounds:
          - entities.Product.fields.license_model
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "license_model outside {PER_USER, PER_DEVICE, PER_SERVER_CORE} is rejected at creation."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "POST /licensing/products"
              payload: { sku: "BAD1", name: "Bad", license_model: "PER_SOCKET", license_kind: "SUBSCRIPTION", edition: "STANDARD", family: "X", annual_unit_price_cents: 1000, license_mobility: false }
              as: ProgramAdministrator
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_REQUEST with HTTP 400"
      - name: get_agreement_not_found
        claim_type: not_found
        grounds:
          - errors[ERR_NOT_FOUND]
        distinguishing_aspect: "GET /agreements/{id} with a random UUID yields ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "GET /licensing/agreements/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              as: ProgramAdministrator
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_NOT_FOUND with HTTP 404"
      - name: products_list_pagination_envelope
        claim_type: listing
        grounds:
          - response_envelope
          - entities.Product
        distinguishing_aspect: "GET /products honors limit/offset and returns total_count and has_more per the fixed pagination envelope."
        test_recipe:
          setup: ["three products exist"]
          setup_api_calls:
            - call: "POST /licensing/products"
              payload: { sku: "PG1", name: "P1", license_model: "PER_USER", license_kind: "SUBSCRIPTION", edition: "STANDARD", family: "F", annual_unit_price_cents: 1000, license_mobility: false }
              as: ProgramAdministrator
            - call: "POST /licensing/products"
              payload: { sku: "PG2", name: "P2", license_model: "PER_USER", license_kind: "SUBSCRIPTION", edition: "STANDARD", family: "F", annual_unit_price_cents: 1000, license_mobility: false }
              as: ProgramAdministrator
            - call: "POST /licensing/products"
              payload: { sku: "PG3", name: "P3", license_model: "PER_USER", license_kind: "SUBSCRIPTION", edition: "STANDARD", family: "F", annual_unit_price_cents: 1000, license_mobility: false }
              as: ProgramAdministrator
          trigger:
            - call: "GET /licensing/products"
              payload: { limit: 2, offset: 0 }
              as: Auditor
          assert:
            - "response envelope contains total_count == 3 and has_more == true with limit == 2"
      - name: snapshot_immutability_no_version_field
        claim_type: immutability
        grounds:
          - entities.LicensePositionSnapshot
        distinguishing_aspect: "LicensePositionSnapshot has common_fields false: its representation carries id and created_at but no version/updated_at, and no mutation endpoint exists for it."
        test_recipe:
          setup:
            - "Organization (level A), ACTIVE agreement, anniversary 1, one PER_USER product with one 2-user deployment"
          setup_api_calls:
            - call: "POST /licensing/organizations"
              payload: { legal_name: "Snap Org", qualified_device_count: 100 }
              as: ProgramAdministrator
              captures: { org_id: $.data.id }
            - call: "POST /licensing/agreements"
              payload: { organization_id: "${org_id}", enrollment_number: "E-SNP-1", start_date: "2026-09-01", end_date: "2029-08-31" }
              as: ProgramAdministrator
              captures: { agr_id: $.data.id }
            - call: "POST /licensing/agreements/${agr_id}/activate"
              payload: {}
              as: ProgramAdministrator
            - call: "POST /licensing/agreements/${agr_id}/anniversaries"
              payload: { year_index: 1, period_start: "2026-09-01", period_end: "2027-08-31" }
              as: ProgramAdministrator
              captures: { ann_id: $.data.id }
            - call: "POST /licensing/products"
              payload: { sku: "SN1", name: "Snap Cal", license_model: "PER_USER", license_kind: "SUBSCRIPTION", edition: "STANDARD", family: "CAL", annual_unit_price_cents: 100000, license_mobility: false }
              as: ProgramAdministrator
              captures: { prod_id: $.data.id }
            - call: "POST /licensing/agreements/${agr_id}/deployments"
              payload: { product_id: "${prod_id}", scope: "USER", deployment_date: "2026-09-02", user_count: 2, hosting: "ON_PREMISES" }
              as: CustomerAdmin
              as_user_id: "${org_id}"
          trigger:
            - call: "POST /licensing/agreements/${agr_id}/position-snapshots"
              payload: { anniversary_id: "${ann_id}" }
              as: LicensingSpecialist
              captures: { snap_id: $.data.id }
          assert:
            - "snapshot representation has id, created_at and computed lines but no version field"
            - "lines[0].required_licenses == 2 and lines[0].net_position == -2"

  # ===========================================================================
  # Section: state_machines
  # ===========================================================================
  - section: state_machines
    instances:
      - name: agreement_initial_state_is_draft
        claim_type: initial_state
        grounds:
          - state_machines.Agreement
        distinguishing_aspect: "A newly created agreement starts in DRAFT before any transition."
        test_recipe:
          setup: ["one organization exists"]
          setup_api_calls:
            - call: "POST /licensing/organizations"
              payload: { legal_name: "Init Org", qualified_device_count: 100 }
              as: ProgramAdministrator
              captures: { org_id: $.data.id }
          trigger:
            - call: "POST /licensing/agreements"
              payload: { organization_id: "${org_id}", enrollment_number: "E-INI-1", start_date: "2026-09-01", end_date: "2029-08-31" }
              as: ProgramAdministrator
              captures: { agr_status: $.data.status }
          assert:
            - "Agreement.status == DRAFT at creation"
      - name: agreement_terminal_states_lockdown
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.Agreement
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "From EXPIRED no further transitions are possible: renewal-review, renew, expire, and activate all fail with ERR_INVALID_STATE."
        test_recipe:
          setup: ["agreement with end_date 2026-09-30 expired via clock advance to 2026-10-01"]
          setup_api_calls:
            - call: "POST /licensing/organizations"
              payload: { legal_name: "Term Org", qualified_device_count: 100 }
              as: ProgramAdministrator
              captures: { org_id: $.data.id }
            - call: "POST /licensing/agreements"
              payload: { organization_id: "${org_id}", enrollment_number: "E-TRM-1", start_date: "2026-09-01", end_date: "2026-09-30" }
              as: ProgramAdministrator
              captures: { agr_id: $.data.id }
            - call: "POST /licensing/agreements/${agr_id}/activate"
              payload: {}
              as: ProgramAdministrator
            - call: "POST /licensing/_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-01T00:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /licensing/agreements/${agr_id}/expire"
              payload: {}
              as: ProgramAdministrator
          trigger:
            - call: "POST /licensing/agreements/${agr_id}/renewal-review"
              payload: {}
              as: LicensingSpecialist
              captures: { err1: $.data.error_id }
            - call: "POST /licensing/agreements/${agr_id}/activate"
              payload: {}
              as: ProgramAdministrator
              captures: { err2: $.data.error_id }
          assert:
            - "renewal-review on EXPIRED agreement fails with ERR_INVALID_STATE (409)"
            - "activate on EXPIRED agreement fails with ERR_INVALID_STATE (409)"
      - name: decline_renewal_continue_returns_to_active
        claim_type: valid_transition
        grounds:
          - state_machines.Agreement.RENEWAL_PENDING_to_ACTIVE
        distinguishing_aspect: "decision=CONTINUE from RENEWAL_PENDING returns the agreement to ACTIVE (the back-branch of the renewal fork) without forfeiting grants or commitments."
        test_recipe:
          setup: ["ACTIVE agreement in renewal window (clock 2029-07-01, end 2029-08-31), moved to RENEWAL_PENDING; one ACTIVE grant exists"]
          setup_api_calls:
            - call: "POST /licensing/organizations"
              payload: { legal_name: "Cont Org", qualified_device_count: 100 }
              as: ProgramAdministrator
              captures: { org_id: $.data.id }
            - call: "POST /licensing/agreements"
              payload: { organization_id: "${org_id}", enrollment_number: "E-CNT-1", start_date: "2026-09-01", end_date: "2029-08-31" }
              as: ProgramAdministrator
              captures: { agr_id: $.data.id }
            - call: "POST /licensing/agreements/${agr_id}/activate"
              payload: {}
              as: ProgramAdministrator
            - call: "POST /licensing/agreements/${agr_id}/benefit-grants"
              payload: { benefit_type: "TRAINING_VOUCHER", quantity_granted: 3, expires_on: "2029-12-31" }
              as: LicensingSpecialist
              captures: { grant_id: $.data.id }
            - call: "POST /licensing/_clock/set_current_utc"
              payload: { to_iso8601: "2029-07-01T00:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /licensing/agreements/${agr_id}/renewal-review"
              payload: {}
              as: LicensingSpecialist
          trigger:
            - call: "POST /licensing/agreements/${agr_id}/decline-renewal"
              payload: { decision: "CONTINUE" }
              as: CustomerAdmin
              as_user_id: "${org_id}"
              captures: { agr_status: $.data.status }
            - call: "GET /licensing/benefit-grants/${grant_id}"
              as: LicensingSpecialist
              captures: { grant_status: $.data.status }
          assert:
            - "Agreement.status == ACTIVE after CONTINUE"
            - "AssuranceBenefitGrant.status remains ACTIVE (no forfeiture on the back-branch)"
      - name: renew_closes_all_anniversaries_and_bumps_renewal_count
        claim_type: side_effect_execution
        grounds:
          - state_machines.Agreement.RENEWAL_PENDING_to_RENEWED
        distinguishing_aspect: "Successful renew sets status RENEWED, renewal_count == 1, end_date extended, and every anniversary true_up_closed == true."
        test_recipe:
          setup: ["ACTIVE agreement in renewal window with two anniversaries registered; RENEWAL_PENDING"]
          setup_api_calls:
            - call: "POST /licensing/organizations"
              payload: { legal_name: "Ren Org", qualified_device_count: 100 }
              as: ProgramAdministrator
              captures: { org_id: $.data.id }
            - call: "POST /licensing/agreements"
              payload: { organization_id: "${org_id}", enrollment_number: "E-REN-1", start_date: "2026-09-01", end_date: "2029-08-31" }
              as: ProgramAdministrator
              captures: { agr_id: $.data.id }
            - call: "POST /licensing/agreements/${agr_id}/activate"
              payload: {}
              as: ProgramAdministrator
            - call: "POST /licensing/agreements/${agr_id}/anniversaries"
              payload: { year_index: 1, period_start: "2026-09-01", period_end: "2027-08-31" }
              as: ProgramAdministrator
            - call: "POST /licensing/agreements/${agr_id}/anniversaries"
              payload: { year_index: 2, period_start: "2027-09-01", period_end: "2028-08-31" }
              as: ProgramAdministrator
            - call: "POST /licensing/_clock/set_current_utc"
              payload: { to_iso8601: "2029-07-01T00:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /licensing/agreements/${agr_id}/renewal-review"
              payload: {}
              as: LicensingSpecialist
            - call: "GET /licensing/agreements/${agr_id}"
              as: LicensingSpecialist
              captures: { agr_v: $.data.version }
          trigger:
            - call: "POST /licensing/agreements/${agr_id}/renew"
              payload: { new_end_date: "2032-08-31", expected_agreement_version: "${agr_v}" }
              as: ProgramAdministrator
              captures: { agr_status: $.data.status, rc: $.data.renewal_count }
            - call: "GET /licensing/agreements/${agr_id}/anniversaries"
              as: LicensingSpecialist
          assert:
            - "Agreement.status == RENEWED, renewal_count == 1, end_date == 2032-08-31"
            - "both anniversaries have true_up_closed == true"
      - name: hosting_review_from_approved_is_invalid_transition
        claim_type: invalid_transition
        grounds:
          - state_machines.HostingAuthorization
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "POST /hosting-authorizations/{id}/review is only valid from PENDING_REVIEW; reviewing an APPROVED authorization fails with ERR_INVALID_STATE."
        test_recipe:
          setup: ["APPROVED hosting authorization exists"]
          setup_api_calls:
            - call: "POST /licensing/organizations"
              payload: { legal_name: "HA Org", qualified_device_count: 100 }
              as: ProgramAdministrator
              captures: { org_id: $.data.id }
            - call: "POST /licensing/agreements"
              payload: { organization_id: "${org_id}", enrollment_number: "E-HA-1", start_date: "2026-09-01", end_date: "2029-08-31" }
              as: ProgramAdministrator
              captures: { agr_id: $.data.id }
            - call: "POST /licensing/agreements/${agr_id}/activate"
              payload: {}
              as: ProgramAdministrator
            - call: "POST /licensing/products"
              payload: { sku: "HA1", name: "HA Srv", license_model: "PER_SERVER_CORE", license_kind: "SUBSCRIPTION", edition: "STANDARD", family: "SRV", annual_unit_price_cents: 50000, license_mobility: true }
              as: ProgramAdministrator
              captures: { prod_id: $.data.id }
            - call: "POST /licensing/agreements/${agr_id}/hosting-authorizations"
              payload: { product_id: "${prod_id}", provider_name: "HosterCo", effective_on: "2026-09-01" }
              as: CustomerAdmin
              as_user_id: "${org_id}"
              captures: { auth_id: $.data.id }
            - call: "POST /licensing/hosting-authorizations/${auth_id}/review"
              payload: { decision: "APPROVE" }
              as: LicensingSpecialist
          trigger:
            - call: "POST /licensing/hosting-authorizations/${auth_id}/review"
              payload: { decision: "APPROVE" }
              as: LicensingSpecialist
              captures: { err: $.data.error_id }
          assert:
            - "second review fails with ERR_INVALID_STATE (409) — APPROVED is not a valid from-state for review"

  # ===========================================================================
  # Section: calculations
  # ===========================================================================
  - section: calculations
    instances:
      - name: entitlement_unit_price_locked_at_creation_not_repriced
        claim_type: constants_applied
        grounds:
          - calculations.price_level_tiering
          - entities.LicenseEntitlement.fields.unit_price_cents
        distinguishing_aspect: "Entitlement unit_price_cents is locked at creation from the then-current price level (A: 100000); a later PATCH moving the org to level B does NOT change the existing entitlement's locked price."
        test_recipe:
          setup: ["organization created at 100 devices (level A); entitlement created for product PRC1 (100000) before the tier change"]
          setup_api_calls:
            - call: "POST /licensing/organizations"
              payload: { legal_name: "Lock Org", qualified_device_count: 100 }
              as: ProgramAdministrator
              captures: { org_id: $.data.id }
            - call: "POST /licensing/agreements"
              payload: { organization_id: "${org_id}", enrollment_number: "E-LCK-1", start_date: "2026-09-01", end_date: "2029-08-31" }
              as: ProgramAdministrator
              captures: { agr_id: $.data.id }
            - call: "POST /licensing/agreements/${agr_id}/activate"
              payload: {}
              as: ProgramAdministrator
            - call: "POST /licensing/products"
              payload: { sku: "PRC1", name: "Price Cal", license_model: "PER_USER", license_kind: "SUBSCRIPTION", edition: "STANDARD", family: "CAL", annual_unit_price_cents: 100000, license_mobility: false }
              as: ProgramAdministrator
              captures: { prod_id: $.data.id }
            - call: "POST /licensing/agreements/${agr_id}/entitlements"
              payload: { product_id: "${prod_id}", quantity: 4 }
              as: LicensingSpecialist
              captures: { ent_id: $.data.id, ent_unit: $.data.unit_price_cents }
          trigger:
            - call: "PATCH /licensing/organizations/${org_id}"
              payload: { qualified_device_count: 300 }
              as: ProgramAdministrator
            - call: "GET /licensing/entitlements/${ent_id}"
              as: LicensingSpecialist
              captures: { ent_unit_after: $.data.unit_price_cents }
          assert:
            - "entitlement unit_price_cents at creation == 100000 (level A multiplier 1.00)"
            - "after org moves to level B, entitlement unit_price_cents is still 100000 (locked); Organization.price_level == B"
      - name: submit_reprices_lines_at_current_price_level
        claim_type: correct_result
        grounds:
          - state_machines.TrueUpReport.DRAFT_to_SUBMITTED
          - calculations.true_up_retroactive_pricing
        distinguishing_aspect: "A line added while the org is level A (unit 100000) is repriced at submit time after the org moved to level B: 4 * 95000 * 7/12 = 221667, not the at-creation price."
        test_recipe:
          setup:
            - "Organization at 100 devices (A); agreement ACTIVE; anniversary 1; product RP1 (100000); deployment 4 users, no entitlement; DRAFT report with line (months_growth 6, ANNIVERSARY_PRORATION) added while level A"
            - "Organization patched to 300 devices (level B) before submit"
          setup_api_calls:
            - call: "POST /licensing/organizations"
              payload: { legal_name: "Reprice Org", qualified_device_count: 100 }
              as: ProgramAdministrator
              captures: { org_id: $.data.id }
            - call: "POST /licensing/agreements"
              payload: { organization_id: "${org_id}", enrollment_number: "E-RPR-1", start_date: "2026-09-01", end_date: "2029-08-31" }
              as: ProgramAdministrator
              captures: { agr_id: $.data.id }
            - call: "POST /licensing/agreements/${agr_id}/activate"
              payload: {}
              as: ProgramAdministrator
            - call: "POST /licensing/agreements/${agr_id}/anniversaries"
              payload: { year_index: 1, period_start: "2026-09-01", period_end: "2027-08-31" }
              as: ProgramAdministrator
              captures: { ann_id: $.data.id }
            - call: "POST /licensing/products"
              payload: { sku: "RP1", name: "Reprice Cal", license_model: "PER_USER", license_kind: "SUBSCRIPTION", edition: "STANDARD", family: "CAL", annual_unit_price_cents: 100000, license_mobility: false }
              as: ProgramAdministrator
              captures: { prod_id: $.data.id }
            - call: "POST /licensing/agreements/${agr_id}/deployments"
              payload: { product_id: "${prod_id}", scope: "USER", deployment_date: "2026-09-02", user_count: 4, hosting: "ON_PREMISES" }
              as: CustomerAdmin
              as_user_id: "${org_id}"
            - call: "POST /licensing/agreements/${agr_id}/true-up-reports"
              payload: { anniversary_id: "${ann_id}" }
              as: CustomerAdmin
              as_user_id: "${org_id}"
              captures: { rep_id: $.data.id }
            - call: "POST /licensing/true-up-reports/${rep_id}/lines"
              payload: { product_id: "${prod_id}", months_growth: 6, pricing_variant: "ANNIVERSARY_PRORATION" }
              as: CustomerAdmin
              as_user_id: "${org_id}"
            - call: "PATCH /licensing/organizations/${org_id}"
              payload: { qualified_device_count: 300 }
              as: ProgramAdministrator
          trigger:
            - call: "POST /licensing/true-up-reports/${rep_id}/submit"
              payload: {}
              as: CustomerAdmin
              as_user_id: "${org_id}"
            - call: "GET /licensing/true-up-reports/${rep_id}/lines"
              as: LicensingSpecialist
          assert:
            - "after submit the line unit_price_cents == 95000 (level B multiplier 0.95) and total_amount_cents == 221667 (round_half_up(4*95000*7/12))"
            - "report total_amount_cents == 221667"
      - name: snapshot_excludes_retired_and_future_deployments
        claim_type: input_set_filtering
        grounds:
          - calculations.license_position_computation
        distinguishing_aspect: "license_position_computation includes only deployments with retired == false; a retired 10-user deployment no longer counts toward required_licenses."
        test_recipe:
          setup: ["ACTIVE agreement, anniversary 1, product FLT1, two user deployments (5 and 10 users); the 10-user deployment retired via DELETE"]
          setup_api_calls:
            - call: "POST /licensing/organizations"
              payload: { legal_name: "Filt Org", qualified_device_count: 100 }
              as: ProgramAdministrator
              captures: { org_id: $.data.id }
            - call: "POST /licensing/agreements"
              payload: { organization_id: "${org_id}", enrollment_number: "E-FLT-1", start_date: "2026-09-01", end_date: "2029-08-31" }
              as: ProgramAdministrator
              captures: { agr_id: $.data.id }
            - call: "POST /licensing/agreements/${agr_id}/activate"
              payload: {}
              as: ProgramAdministrator
            - call: "POST /licensing/agreements/${agr_id}/anniversaries"
              payload: { year_index: 1, period_start: "2026-09-01", period_end: "2027-08-31" }
              as: ProgramAdministrator
              captures: { ann_id: $.data.id }
            - call: "POST /licensing/products"
              payload: { sku: "FLT1", name: "Filter Cal", license_model: "PER_USER", license_kind: "SUBSCRIPTION", edition: "STANDARD", family: "CAL", annual_unit_price_cents: 100000, license_mobility: false }
              as: ProgramAdministrator
              captures: { prod_id: $.data.id }
            - call: "POST /licensing/agreements/${agr_id}/deployments"
              payload: { product_id: "${prod_id}", scope: "USER", deployment_date: "2026-09-02", user_count: 5, hosting: "ON_PREMISES" }
              as: CustomerAdmin
              as_user_id: "${org_id}"
            - call: "POST /licensing/agreements/${agr_id}/deployments"
              payload: { product_id: "${prod_id}", scope: "USER", deployment_date: "2026-09-02", user_count: 10, hosting: "ON_PREMISES" }
              as: CustomerAdmin
              as_user_id: "${org_id}"
              captures: { dep_id: $.data.id }
            - call: "DELETE /licensing/deployments/${dep_id}"
              as: CustomerAdmin
              as_user_id: "${org_id}"
          trigger:
            - call: "POST /licensing/agreements/${agr_id}/position-snapshots"
              payload: { anniversary_id: "${ann_id}" }
              as: LicensingSpecialist
              captures: { snap_id: $.data.id }
          assert:
            - "snapshot lines[0].required_licenses == 5 (retired 10-user deployment excluded)"
      - name: shortfall_projection_subscription_lapses_perpetual_survives
        claim_type: correct_result
        grounds:
          - calculations.shortfall_exposure_projection
        distinguishing_aspect: "For a NON_RENEWED agreement with required 40, perpetual 25, subscription 20: effective_coverage == 25 and shortfall == 15 — subscription units contribute zero after lapse."
        test_recipe:
          setup:
            - "ACTIVE agreement ending 2029-08-31; clock 2029-07-01; RENEWAL_PENDING"
            - "PER_DEVICE perpetual product SHP: entitlement 25; PER_DEVICE subscription product SHS: entitlement 20"
            - "deployments: 40 devices for SHP and 40 devices for SHS (required 40 each)"
