  # ===================================================================
  # SECTION 8 - cross_cutting_layers
  # -------------------------------------------------------------------
  # §1.0 declares five complexity layers. Two of them are pinned in full
  # here because they are cheap to probe and easy to get subtly wrong:
  # both optimistic_concurrency rules, on ProductionLot and on
  # BatteryUnit. The other three layers (cascading_side_effects,
  # dual_variant_calculation, selector_policy, rate_threshold_triggers)
  # are each the entire subject of a §1.8 instance and are stubbed
  # against it - a breadth probe of a five-hop cascade or of a
  # dual-variant selector is the depth probe with fewer asserts.
  # ===================================================================
  - section: cross_cutting_layers
    instances:

      - name: lot_occ_is_row_scoped_equality_and_outranks_the_environmental_hold_gate
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[sampling-plan-create-stale-lot]
          - endpoints[POST /production-lots/{id}/sampling-plans]
          - errors[ERR_STALE_LOT_VERSION]
          - errors[ERR_LOT_ENV_HELD]
        distinguishing_aspect: "Four separate traps in one rule. (1) The check is EQUALITY, not 'at least as new as': a version belonging to a different lot, or any value other than this lot's current version, is refused - so an implementation using >= or ignoring the field passes the naive test and fails here. (2) OCC sits at §1.4 priority 10, ABOVE the environmental-hold gate, so a stale write on a HELD lot answers 412 ERR_STALE_LOT_VERSION, while the same write with a fresh version answers 409 ERR_LOT_ENV_HELD - the two errors are ordered, not interchangeable. (3) A REFUSED write does not bump the version, so the fresh version obtained after a 409 is still fresh. (4) A SUCCESSFUL redraw bumps the version, so replaying the very same request body immediately answers 412 - the client's own write invalidates its own token."
        test_recipe:
          setup:
            - "Plant PLT-RIV; workers Cara (PRODUCTION), Dana (QUALITY), Sam (SAFETY), Ada/Ben (ENGINEER); design CD-LEAD-465 APPROVED; lot LOT-S quantity 9 walked PLANNED -> PLATE_PRODUCTION -> FORMATION -> ASSEMBLY (version 4) with assembly ASM-S1 CERTIFIED; the first sampling plan is drawn with expected_lot_version 4, which moves the lot to LOT_TESTING, sets sample_size 3 / acceptance_number 0 / sampling_plan_revision 1 and leaves version 5. A second lot LOT-T quantity 12 is created and left in PLANNED at version 1 to supply a foreign version token. Clock 2026-09-01T00:00Z."
          setup_api_calls:
            - call: POST /_clock/set_current_utc
              as: PlantAdmin
              payload: { current_utc: "2026-09-01T00:00:00Z" }
            - call: POST /plants
              as: PlantAdmin
              payload: { name: "Riverside Battery Works", site_code: "PLT-RIV", licensed_chemistries: [LEAD_ACID, LITHIUM_LFP], permit_status: ACTIVE, monthly_lead_emission_permit_g: 100000.00, peak_tariff_cents_per_kwh: 25.00, offpeak_tariff_cents_per_kwh: 15.00, lead_initial_inventory_kg: 10000.000 }
              captures: { plant_id: "$.data.id" }
            - call: POST /workers
              as: PlantAdmin
              payload: { plant_id: "${plant_id}", full_name: "Ada Engineer", job_class: ENGINEER, hire_date: "2020-01-01T00:00:00Z" }
              captures: { eng_a_id: "$.data.id" }
            - call: POST /workers
              as: PlantAdmin
              payload: { plant_id: "${plant_id}", full_name: "Ben Engineer", job_class: ENGINEER, hire_date: "2020-01-01T00:00:00Z" }
              captures: { eng_b_id: "$.data.id" }
            - call: POST /workers
              as: PlantAdmin
              payload: { plant_id: "${plant_id}", full_name: "Cara Supervisor", job_class: PRODUCTION, hire_date: "2020-01-01T00:00:00Z" }
              captures: { sup_a_id: "$.data.id" }
            - call: POST /workers
              as: PlantAdmin
              payload: { plant_id: "${plant_id}", full_name: "Dana Quality", job_class: QUALITY, hire_date: "2020-01-01T00:00:00Z" }
              captures: { qa_a_id: "$.data.id" }
            - call: POST /workers
              as: PlantAdmin
              payload: { plant_id: "${plant_id}", full_name: "Sam Safety", job_class: SAFETY, hire_date: "2020-01-01T00:00:00Z" }
              captures: { safety_a_id: "$.data.id" }
            - call: POST /cell-designs
              as: DesignEngineer
              as_user_id: "${eng_a_id}"
              payload: { code: "CD-LEAD-465", chemistry: LEAD_ACID, plate_type: TUBULAR, cells_per_battery: 12, cell_nominal_voltage_v: 2.00, nominal_capacity_ah: 465.0, rated_cycles: 1500, warranty_months: 60, pack_weight_kg: 900.0, lead_content_kg: 300.000, formation_charge_factor: 1.50, list_price_cents: 500000 }
              captures: { design_id: "$.data.id" }
            - call: POST /cell-designs/${design_id}/review-actions
