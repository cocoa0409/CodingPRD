            - "response.status_code == 422"
            - "response.data.error_id == 'ERR_CD_REDISCLOSE_REQUIRED'"
            - "LoanApplication.${app_id}.status == APPROVED"

  # -------------------------------------------------------------------------
  # Rule 8 — Resource temporal-overlap conflicts across different interval semantics
  # -------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:

      - name: trid_max_merge_of_le_and_cd_floors_blocks_consummation
        grounds:
          - calculations.trid_timeline_calc
          - validations[priority=9]
          - errors[ERR_TRID_WAITING_PERIOD]
        distinguishing_aspect: |
          Resource = LoanApplication. Interval semantics = MAX-merge of two
          future-floor intervals (LE_first.delivered_at + 7 calendar days and
          CD_last.delivered_at + 3 calendar days). earliest_consummation_at
          is the later of the two floors; close before that timestamp is
          rejected. Tests the closed-left boundary: at exactly
          earliest_consummation_at close is allowed, one second earlier is not.
        test_recipe:
          setup:
            - "Empty DB. Clock at 2026-06-01T00:00:00Z."
            - "LoanApplication in CLEAR_TO_CLOSE with: LE delivered 2026-06-01T10:00:00Z (le_floor = 2026-06-08T10:00:00Z); CD delivered+acknowledged 2026-06-05T10:00:00Z (cd_floor = 2026-06-08T10:00:00Z); earliest_consummation_at = max = 2026-06-08T10:00:00Z."
            - "Clock then advanced to 2026-06-08T09:59:59Z — one second BEFORE earliest_consummation_at."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: LoanOfficer
              as_user_id: "lo-001"
            - call: "POST /applicants"
              payload: { full_name: "R", email: "r@test.com", ssn_last4: "9008", annual_income_cents: 9000000, monthly_debt_cents: 50000, credit_score: 720, state_code: "CA" }
              as: LoanOfficer
              as_user_id: "lo-001"
              captures: { applicant_id: $.data.id }
            - call: "POST /loan-applications"
              payload: { applicant_id: "${applicant_id}", property_address: "P9", property_state_code: "CA", loan_purpose: "PURCHASE", requested_loan_amount_cents: 30000000, property_value_cents: 35000000, loan_term_months: 360 }
              as: LoanOfficer
              as_user_id: "lo-001"
              captures: { app_id: $.data.id }
            - call: "POST /loan-applications/${app_id}/prequalify"
              payload: {}
              as: LoanOfficer
              as_user_id: "lo-001"
              captures: { v1: $.data.version }
            - call: "POST /rate-locks"
              payload: { application_id: "${app_id}", locked_rate_bps: 625, lock_term_days: 60, expected_application_version: "${v1}" }
              as: LoanOfficer
              as_user_id: "lo-001"
              captures: { lock_id: $.data.id }
            - call: "GET /loan-applications/${app_id}"
              payload: {}
              as: LoanOfficer
              as_user_id: "lo-001"
              captures: { v2: $.data.version }
            - call: "POST /disclosures"
              payload: { application_id: "${app_id}", disclosure_type: "LOAN_ESTIMATE", expected_application_version: "${v2}" }
              as: LoanOfficer
              as_user_id: "lo-001"
              captures: { le_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T10:00:00Z" }
              as: LoanOfficer
              as_user_id: "lo-001"
            - call: "POST /disclosures/${le_id}/deliver"
              payload: {}
              as: LoanOfficer
              as_user_id: "lo-001"
            - call: "POST /loan-applications/${app_id}/submit-for-review"
              payload: {}
              as: LoanOfficer
              as_user_id: "lo-001"
            - call: "POST /income-verifications"
              payload: { application_id: "${app_id}", document_type: "W2", verified_annual_income_cents: 9000000 }
              as: LoanOfficer
              as_user_id: "lo-001"
              captures: { iv_id: $.data.id }
            - call: "POST /income-verifications/${iv_id}/accept"
              payload: {}
              as: Underwriter
              as_user_id: "uw-001"
            - call: "POST /asset-verifications"
              payload: { application_id: "${app_id}", asset_type: "CHECKING", verified_balance_cents: 8000000 }
              as: LoanOfficer
              as_user_id: "lo-001"
              captures: { av_id: $.data.id }
            - call: "POST /asset-verifications/${av_id}/accept"
              payload: {}
              as: Underwriter
              as_user_id: "uw-001"
            - call: "POST /appraisals"
              payload: { application_id: "${app_id}" }
              as: LoanOfficer
              as_user_id: "lo-001"
              captures: { appr_id: $.data.id }
            - call: "POST /appraisals/${appr_id}/complete"
              payload: { appraised_value_cents: 35000000 }
              as: Appraiser
              as_user_id: "appr-001"
            - call: "POST /title-searches"
              payload: { application_id: "${app_id}" }
              as: LoanOfficer
              as_user_id: "lo-001"
              captures: { ts_id: $.data.id }
            - call: "POST /title-searches/${ts_id}/mark-clear"
              payload: {}
              as: TitleAgent
              as_user_id: "ta-001"
            - call: "POST /udaap-checks"
              payload: { application_id: "${app_id}", review_outcome: "CLEARED" }
              as: ComplianceOfficer
              as_user_id: "co-001"
            - call: "POST /loan-applications/${app_id}/approve"
              payload: {}
              as: Underwriter
              as_user_id: "uw-001"
              captures: { v_approved: $.data.version }
            - call: "POST /disclosures"
              payload: { application_id: "${app_id}", disclosure_type: "CLOSING_DISCLOSURE", expected_application_version: "${v_approved}" }
              as: LoanOfficer
              as_user_id: "lo-001"
              captures: { cd_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-05T10:00:00Z" }
              as: LoanOfficer
              as_user_id: "lo-001"
            - call: "POST /disclosures/${cd_id}/deliver"
              payload: {}
              as: LoanOfficer
              as_user_id: "lo-001"
            - call: "POST /disclosures/${cd_id}/acknowledge"
              payload: {}
              as: Applicant
              as_user_id: "${applicant_id}"
            - call: "POST /loan-applications/${app_id}/clear-to-close"
              payload: {}
              as: Underwriter
              as_user_id: "uw-001"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-08T09:59:59Z" }
              as: Closer
              as_user_id: "cl-001"
          trigger:
            - call: "POST /loan-applications/${app_id}/close"
              payload: {}
              as: Closer
              as_user_id: "cl-001"
          assert:
            - "response.status_code == 422"
            - "response.data.error_id == 'ERR_TRID_WAITING_PERIOD'"
            - "LoanApplication.${app_id}.status == CLEAR_TO_CLOSE"
            - "LoanApplication.${app_id}.earliest_consummation_at == '2026-06-08T10:00:00.000Z'"

      - name: rate_lock_total_duration_cap_overlap_rejection
        grounds:
          - validations[priority=13.5]
          - errors[ERR_LOCK_DURATION_CAP_EXCEEDED]
          - calculations.rate_lock_extension_calc
          - state_machines.RateLock.ACTIVE_to_ACTIVE
        distinguishing_aspect: |
          Resource = RateLock (DIFFERENT resource entity from LoanApplication in
          instance 1). Interval semantics = cumulative single-interval cap from
          locked_at (a hard 90-day ceiling), structurally DIFFERENT from the
          max-merge of two future-floor intervals used by TRID. The lock's
          live window [locked_at, locked_at + lock_term_days + sum(extensions)]
          must not exceed 90 days; an extend call whose proposed expires_at
          would push the window past +90 days is rejected.
        test_recipe:
          setup:
            - "Empty DB. Clock at 2026-06-01T00:00:00Z."
            - "Applicant + LoanApplication PREQUALIFIED."
            - "ACTIVE RateLock locked at 2026-06-01T00:00:00Z, lock_term_days=60, expires_at=2026-07-31T00:00:00Z, extension_count=0."
            - "One 30-day extension applied: expires_at=2026-08-30T00:00:00Z, extension_count=1. Window now = 60+30 = 90 days from locked_at."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: LoanOfficer
              as_user_id: "lo-001"
            - call: "POST /applicants"
              payload: { full_name: "S", email: "s@test.com", ssn_last4: "9009", annual_income_cents: 7726104, monthly_debt_cents: 50000, credit_score: 720, state_code: "CA" }
              as: LoanOfficer
              as_user_id: "lo-001"
              captures: { applicant_id: $.data.id }
            - call: "POST /loan-applications"
              payload: { applicant_id: "${applicant_id}", property_address: "P10", property_state_code: "CA", loan_purpose: "PURCHASE", requested_loan_amount_cents: 30000000, property_value_cents: 31578948, loan_term_months: 360 }
              as: LoanOfficer
              as_user_id: "lo-001"
              captures: { app_id: $.data.id }
            - call: "POST /loan-applications/${app_id}/prequalify"
              payload: {}
              as: LoanOfficer
              as_user_id: "lo-001"
              captures: { v1: $.data.version }
            - call: "POST /rate-locks"
              payload: { application_id: "${app_id}", locked_rate_bps: 687, lock_term_days: 60, expected_application_version: "${v1}" }
              as: LoanOfficer
              as_user_id: "lo-001"
              captures: { lock_id: $.data.id }
            - call: "POST /rate-locks/${lock_id}/extend"
              payload: { extend_days: 30 }
              as: LoanOfficer
              as_user_id: "lo-001"
          trigger:
            - call: "POST /rate-locks/${lock_id}/extend"
              payload: { extend_days: 7 }
              as: LoanOfficer
              as_user_id: "lo-001"
          assert:
            - "response.status_code == 422"
            - "response.data.error_id == 'ERR_LOCK_DURATION_CAP_EXCEEDED'"
            - "RateLock.${lock_id}.extension_count == 1"
            - "RateLock.${lock_id}.expires_at == '2026-08-30T00:00:00.000Z'"

  # -------------------------------------------------------------------------
  # Rule 9 — Compensating-action invariants across different conserved quantities
  # -------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:

      - name: appraisal_reconsider_roundtrip_preserves_ltv_ratio
        grounds:
          - state_machines.Appraisal.COMPLETED_to_RECONSIDERED
          - state_machines.Appraisal.RECONSIDERED_to_COMPLETED
          - calculations.ltv_ratio
        distinguishing_aspect: |
          Conserved quantity = LoanApplication.ltv_ratio (a numeric ratio).
          Forward action: RECONSIDER changes appraised_value_cents 31000000
          → 32000000, which lowers ltv_ratio. Compensating action: a SECOND
          RECONSIDER restores appraised_value_cents back to 31000000. Invariant
          formula: ltv_ratio == round(30000000 / min(31578948, 31000000), 4)
          == 0.9677 both before the first RECONSIDER and after the second.
        test_recipe:
          setup:
            - "Empty DB. Applicant + LoanApplication PREQUALIFIED."
            - "One COMPLETED Appraisal with appraised_value_cents=31000000; LoanApplication.ltv_ratio=0.9677 (= 30M / min(31578948, 31000000))."
          setup_api_calls:
            - call: "POST /applicants"
              payload: { full_name: "T", email: "t@test.com", ssn_last4: "9010", annual_income_cents: 7726104, monthly_debt_cents: 50000, credit_score: 720, state_code: "CA" }
              as: LoanOfficer
              as_user_id: "lo-001"
              captures: { applicant_id: $.data.id }
            - call: "POST /loan-applications"
              payload: { applicant_id: "${applicant_id}", property_address: "P11", property_state_code: "CA", loan_purpose: "PURCHASE", requested_loan_amount_cents: 30000000, property_value_cents: 31578948, loan_term_months: 360 }
              as: LoanOfficer
              as_user_id: "lo-001"
              captures: { app_id: $.data.id }
            - call: "POST /loan-applications/${app_id}/prequalify"
              payload: {}
              as: LoanOfficer
              as_user_id: "lo-001"
            - call: "POST /appraisals"
              payload: { application_id: "${app_id}" }
              as: LoanOfficer
              as_user_id: "lo-001"
              captures: { appr_id: $.data.id }
            - call: "POST /appraisals/${appr_id}/complete"
              payload: { appraised_value_cents: 31000000 }
              as: Appraiser
              as_user_id: "appr-001"
            - call: "POST /appraisals/${appr_id}/reconsider"
              payload: { reconsideration_note: "Comparable A", new_appraised_value_cents: 32000000 }
              as: LoanOfficer
              as_user_id: "lo-001"
            - call: "POST /appraisals/${appr_id}/confirm-reconsideration"
              payload: {}
              as: Appraiser
              as_user_id: "appr-001"
          trigger:
            - call: "POST /appraisals/${appr_id}/reconsider"
              payload: { reconsideration_note: "Revert to original value", new_appraised_value_cents: 31000000 }
              as: LoanOfficer
              as_user_id: "lo-001"
            - call: "POST /appraisals/${appr_id}/confirm-reconsideration"
              payload: {}
              as: Appraiser
              as_user_id: "appr-001"
          assert:
            - "Appraisal.${appr_id}.status == COMPLETED"
            - "Appraisal.${appr_id}.appraised_value_cents == 31000000"
            - "LoanApplication.${app_id}.ltv_ratio == 0.9677"

      - name: ratelock_create_supersede_preserves_active_lock_count
        grounds:
          - state_machines.RateLock.ACTIVE_to_SUPERSEDED
          - entities.RateLock.fields.status
        distinguishing_aspect: |
          Conserved quantity = COUNT(RateLock WHERE application_id == app AND
          status == 'ACTIVE') — a cardinality, structurally DIFFERENT from the
          numeric ratio conserved in instance 1. Forward action: POST /rate-locks
          creates a new ACTIVE lock and supersedes the prior. Compensating
          action: another POST /rate-locks creates yet another lock,
          superseding the second. Invariant: count of ACTIVE locks for the
          application is always exactly 1 between locks, and always 1 after
          each create.
        test_recipe:
          setup:
            - "Empty DB. Applicant + LoanApplication PREQUALIFIED."
            - "One ACTIVE RateLock at 625 bps (lock A)."
          setup_api_calls:
            - call: "POST /applicants"
              payload: { full_name: "U", email: "u@test.com", ssn_last4: "9011", annual_income_cents: 7726104, monthly_debt_cents: 50000, credit_score: 720, state_code: "CA" }
              as: LoanOfficer
              as_user_id: "lo-001"
              captures: { applicant_id: $.data.id }
            - call: "POST /loan-applications"
              payload: { applicant_id: "${applicant_id}", property_address: "P12", property_state_code: "CA", loan_purpose: "PURCHASE", requested_loan_amount_cents: 30000000, property_value_cents: 31578948, loan_term_months: 360 }
              as: LoanOfficer
              as_user_id: "lo-001"
              captures: { app_id: $.data.id }
            - call: "POST /loan-applications/${app_id}/prequalify"
              payload: {}
              as: LoanOfficer
              as_user_id: "lo-001"
              captures: { v1: $.data.version }
            - call: "POST /rate-locks"
              payload: { application_id: "${app_id}", locked_rate_bps: 625, lock_term_days: 30, expected_application_version: "${v1}" }
              as: LoanOfficer
              as_user_id: "lo-001"
              captures: { lock_a: $.data.id }
            - call: "GET /loan-applications/${app_id}"
              payload: {}
              as: LoanOfficer
              as_user_id: "lo-001"
              captures: { v_after_a: $.data.version }
            - call: "POST /rate-locks"
              payload: { application_id: "${app_id}", locked_rate_bps: 650, lock_term_days: 30, expected_application_version: "${v_after_a}" }
              as: LoanOfficer
              as_user_id: "lo-001"
              captures: { lock_b: $.data.id }
            - call: "GET /loan-applications/${app_id}"
              payload: {}
              as: LoanOfficer
              as_user_id: "lo-001"
              captures: { v_after_b: $.data.version }
          trigger:
            - call: "POST /rate-locks"
              payload: { application_id: "${app_id}", locked_rate_bps: 675, lock_term_days: 30, expected_application_version: "${v_after_b}" }
              as: LoanOfficer
              as_user_id: "lo-001"
              captures: { lock_c: $.data.id }
          assert:
            - "RateLock.${lock_a}.status == SUPERSEDED"
            - "RateLock.${lock_b}.status == SUPERSEDED"
            - "RateLock.${lock_c}.status == ACTIVE"
            - "count(RateLock WHERE application_id == ${app_id} AND status == 'ACTIVE') == 1"
