            - "After APPROVED -> APPLIED: AdvertiserAccount.${adv}.credit_balance_cents == 123214"
            - "Second settle attempt succeeds: billing_status == SETTLED"

  # =================================================================
  # Rule 8 — resource_temporal_overlap (different interval semantics)
  # =================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: static_face_changeover_gap_exclusion
        grounds:
          - calculations.face_availability_calendar
          - validations[priority=10]
        distinguishing_aspect: |
          Resource = static Face; semantics = closed day-precision date intervals PLUS a
          mandatory one-full-day changeover buffer: touching the last booked day is an
          overlap, next-day adjacency (zero free days) also violates the buffer, and only
          end+2 is accepted.
        test_recipe:
          setup:
            - "PUBLISHED static card; static face F1 (permit to 2026-12-31); advertiser; campaign 2026-08-01..2026-10-31 DRAFT"
            - "Flight H1 HELD 2026-08-10..2026-09-06 on F1"
          setup_api_calls:
            - { call: "POST /api/rate-cards", payload: { market_code: "NYC", display_type: "STATIC", base_weekly_cents: 200000, illumination_premium_pct: 0.15, traffic_tier_1_threshold: 100000, traffic_tier_1_uplift_pct: 0.10, traffic_tier_2_threshold: 250000, traffic_tier_2_uplift_pct: 0.25 }, as: InventoryManager, captures: { rc: $.data.id, rc_v: $.data.version } }
            - { call: "PUT /api/rate-cards/${rc}", payload: { status: "PUBLISHED", expected_rate_card_version: "${rc_v}" }, as: InventoryManager }
            - { call: "POST /api/faces", payload: { face_code: "F-NYC-001", structure_code: "ST-001", market_code: "NYC", display_type: "STATIC", illuminated: true, daily_traffic_count: 300000, width_inches: 168, height_inches: 576 }, as: InventoryManager, captures: { f1: $.data.id } }
            - { call: "POST /api/permits", payload: { face_id: "${f1}", permit_number: "P-001", jurisdiction: "NYC DOB", issued_on: "2026-07-01T00:00:00Z", expires_on: "2026-12-31T00:00:00Z" }, as: ComplianceOfficer }
            - { call: "GET /api/faces/${f1}", payload: {}, as: SalesPlanner, captures: { f1_v: $.data.version } }
            - { call: "POST /api/advertiser-accounts", payload: { name: "Acme", credit_limit_cents: 90000000 }, as: SalesPlanner, captures: { adv: $.data.id } }
            - { call: "POST /api/campaigns", payload: { advertiser_id: "${adv}", name: "C1", start_date: "2026-08-01", end_date: "2026-10-31" }, as: SalesPlanner, captures: { camp: $.data.id } }
            - { call: "POST /api/flights", payload: { campaign_id: "${camp}", face_id: "${f1}", rate_card_id: "${rc}", start_date: "2026-08-10", end_date: "2026-09-06", expected_face_version: "${f1_v}" }, as: SalesPlanner, captures: { h1: $.data.id } }
          trigger:
            - { call: "GET /api/faces/${f1}", payload: {}, as: SalesPlanner, captures: { v2: $.data.version } }
            - { call: "POST /api/flights", payload: { campaign_id: "${camp}", face_id: "${f1}", rate_card_id: "${rc}", start_date: "2026-09-06", end_date: "2026-10-04", expected_face_version: "${v2}" }, as: SalesPlanner, captures: { err_overlap: $.data.error_id } }
            - { call: "POST /api/flights", payload: { campaign_id: "${camp}", face_id: "${f1}", rate_card_id: "${rc}", start_date: "2026-09-07", end_date: "2026-10-04", expected_face_version: "${v2}" }, as: SalesPlanner, captures: { err_gap: $.data.error_id } }
            - { call: "POST /api/flights", payload: { campaign_id: "${camp}", face_id: "${f1}", rate_card_id: "${rc}", start_date: "2026-09-08", end_date: "2026-10-05", expected_face_version: "${v2}" }, as: SalesPlanner, captures: { h2: $.data.id, h2_status: $.data.status } }
          assert:
            - "Start 2026-09-06 (== existing end): error_id == ERR_FACE_OVERLAP (closed-interval touch)"
            - "Start 2026-09-07 (zero free days): error_id == ERR_FACE_OVERLAP (changeover day 2026-09-07 missing; static rule requires start >= end + 2)"
            - "Start 2026-09-08 (one full changeover day 2026-09-07 free): created, status == HELD"
      - name: maintenance_window_half_open_datetime_conflict
        grounds:
          - validations[priority=13]
          - state_machines.MaintenanceWorkOrder.OPEN_to_SCHEDULED
        distinguishing_aspect: |
          Resource entity = MaintenanceWorkOrder's scheduled window on the face (different
          resource from the flight-booking rule); semantics = half-open DATETIME window
          [scheduled_start, scheduled_end) mapped to occupied dates via
          date(scheduled_end - 1s), with NO changeover buffer — different geometry from
          the closed date-interval + gap rule. A window ending exactly at 2026-09-07T00:00:00Z
          still occupies 2026-09-06 and conflicts; one starting 2026-09-07T00:00:00Z is free.
        test_recipe:
          setup:
            - "PUBLISHED static card; static face F1 (permit to 2026-12-31); advertiser (limit 90000000); campaign APPROVED; flight 2026-08-10..2026-09-06 confirmed BOOKED on F1"
            - "MaintenanceWorkOrder OPEN on F1"
          setup_api_calls:
            - { call: "POST /api/rate-cards", payload: { market_code: "NYC", display_type: "STATIC", base_weekly_cents: 200000, illumination_premium_pct: 0.15, traffic_tier_1_threshold: 100000, traffic_tier_1_uplift_pct: 0.10, traffic_tier_2_threshold: 250000, traffic_tier_2_uplift_pct: 0.25 }, as: InventoryManager, captures: { rc: $.data.id, rc_v: $.data.version } }
            - { call: "PUT /api/rate-cards/${rc}", payload: { status: "PUBLISHED", expected_rate_card_version: "${rc_v}" }, as: InventoryManager }
            - { call: "POST /api/faces", payload: { face_code: "F-NYC-001", structure_code: "ST-001", market_code: "NYC", display_type: "STATIC", illuminated: true, daily_traffic_count: 300000, width_inches: 168, height_inches: 576 }, as: InventoryManager, captures: { f1: $.data.id } }
            - { call: "POST /api/permits", payload: { face_id: "${f1}", permit_number: "P-001", jurisdiction: "NYC DOB", issued_on: "2026-07-01T00:00:00Z", expires_on: "2026-12-31T00:00:00Z" }, as: ComplianceOfficer }
            - { call: "GET /api/faces/${f1}", payload: {}, as: SalesPlanner, captures: { f1_v: $.data.version } }
            - { call: "POST /api/advertiser-accounts", payload: { name: "Acme", credit_limit_cents: 90000000 }, as: SalesPlanner, captures: { adv: $.data.id } }
            - { call: "POST /api/campaigns", payload: { advertiser_id: "${adv}", name: "C1", start_date: "2026-08-01", end_date: "2026-09-30" }, as: SalesPlanner, captures: { camp: $.data.id } }
            - { call: "POST /api/flights", payload: { campaign_id: "${camp}", face_id: "${f1}", rate_card_id: "${rc}", start_date: "2026-08-10", end_date: "2026-09-06", expected_face_version: "${f1_v}" }, as: SalesPlanner, captures: { fl: $.data.id } }
            - { call: "PUT /api/campaigns/${camp}", payload: { status: "SUBMITTED" }, as: SalesPlanner }
            - { call: "PUT /api/campaigns/${camp}", payload: { status: "APPROVED" }, as: SalesManager, captures: { camp_v: $.data.version } }
            - { call: "POST /api/flights/${fl}/confirm", payload: { expected_campaign_version: "${camp_v}" }, as: SalesPlanner }
            - { call: "POST /api/maintenance-work-orders", payload: { face_id: "${f1}", order_type: "VEGETATION_CLEARANCE", description: "tree trim" }, as: ComplianceOfficer, captures: { wo: $.data.id } }
          trigger:
            - { call: "PUT /api/maintenance-work-orders/${wo}", payload: { status: "SCHEDULED", scheduled_start: "2026-08-20T06:00:00Z", scheduled_end: "2026-08-20T18:00:00Z" }, as: ComplianceOfficer, captures: { err_mid: $.data.error_id } }
            - { call: "PUT /api/maintenance-work-orders/${wo}", payload: { status: "SCHEDULED", scheduled_start: "2026-09-06T12:00:00Z", scheduled_end: "2026-09-07T00:00:00Z" }, as: ComplianceOfficer, captures: { err_edge: $.data.error_id } }
            - { call: "PUT /api/maintenance-work-orders/${wo}", payload: { status: "SCHEDULED", scheduled_start: "2026-09-07T00:00:00Z", scheduled_end: "2026-09-08T00:00:00Z" }, as: ComplianceOfficer, captures: { wo_status: $.data.status } }
          assert:
            - "Window inside the flight (2026-08-20): error_id == ERR_MAINTENANCE_WINDOW_CONFLICT"
            - "Window [2026-09-06T12:00:00Z, 2026-09-07T00:00:00Z): error_id == ERR_MAINTENANCE_WINDOW_CONFLICT (end-exclusive occupies only 2026-09-06, the flight's last day)"
            - "Window [2026-09-07T00:00:00Z, 2026-09-08T00:00:00Z): succeeds, status == SCHEDULED (no changeover buffer on the maintenance rule; flight ended 2026-09-06)"

  # =================================================================
  # Rule 9 — compensating_invariant (different conserved quantities)
  # =================================================================
  - rule_id: compensating_invariant
    instances:
      - name: hold_release_restores_forward_calendar
        grounds:
          - calculations.face_availability_calendar
          - state_machines.Flight.HELD_to_RELEASED
        distinguishing_aspect: |
          Conserved quantity = the face's forward-occupancy interval SET (a set of date
          intervals, not money). Forward action = create HELD (occupies the window);
          compensating action = RELEASE; the invariant forward_calendar(after) ==
          forward_calendar(before) must hold exactly.
        test_recipe:
          setup:
            - "PUBLISHED static card; static face F2 (not illuminated, 50000; permit to 2026-12-31); advertiser; campaign 2026-08-01..2026-09-30 DRAFT; no flights"
          setup_api_calls:
            - { call: "POST /api/rate-cards", payload: { market_code: "NYC", display_type: "STATIC", base_weekly_cents: 200000, illumination_premium_pct: 0.15, traffic_tier_1_threshold: 100000, traffic_tier_1_uplift_pct: 0.10, traffic_tier_2_threshold: 250000, traffic_tier_2_uplift_pct: 0.25 }, as: InventoryManager, captures: { rc: $.data.id, rc_v: $.data.version } }
            - { call: "PUT /api/rate-cards/${rc}", payload: { status: "PUBLISHED", expected_rate_card_version: "${rc_v}" }, as: InventoryManager }
            - { call: "POST /api/faces", payload: { face_code: "F-NYC-002", structure_code: "ST-002", market_code: "NYC", display_type: "STATIC", illuminated: false, daily_traffic_count: 50000, width_inches: 168, height_inches: 576 }, as: InventoryManager, captures: { f2: $.data.id } }
            - { call: "POST /api/permits", payload: { face_id: "${f2}", permit_number: "P-002", jurisdiction: "NYC DOB", issued_on: "2026-07-01T00:00:00Z", expires_on: "2026-12-31T00:00:00Z" }, as: ComplianceOfficer }
            - { call: "GET /api/faces/${f2}", payload: {}, as: SalesPlanner, captures: { f2_v: $.data.version } }
            - { call: "POST /api/advertiser-accounts", payload: { name: "Acme", credit_limit_cents: 90000000 }, as: SalesPlanner, captures: { adv: $.data.id } }
            - { call: "POST /api/campaigns", payload: { advertiser_id: "${adv}", name: "C1", start_date: "2026-08-01", end_date: "2026-09-30" }, as: SalesPlanner, captures: { camp: $.data.id } }
            - { call: "GET /api/faces/${f2}/availability", payload: { from_date: "2026-08-01", to_date: "2026-09-30" }, as: SalesPlanner, captures: { fwd_before: $.data.forward_calendar, com_before: $.data.committed_calendar } }
          trigger:
            - { call: "POST /api/flights", payload: { campaign_id: "${camp}", face_id: "${f2}", rate_card_id: "${rc}", start_date: "2026-08-10", end_date: "2026-09-06", expected_face_version: "${f2_v}" }, as: SalesPlanner, captures: { fl: $.data.id } }
            - { call: "GET /api/faces/${f2}/availability", payload: { from_date: "2026-08-01", to_date: "2026-09-30" }, as: SalesPlanner, captures: { fwd_mid: $.data.forward_calendar } }
            - { call: "PUT /api/flights/${fl}", payload: { status: "RELEASED" }, as: SalesPlanner }
            - { call: "GET /api/faces/${f2}/availability", payload: { from_date: "2026-08-01", to_date: "2026-09-30" }, as: SalesPlanner, captures: { fwd_after: $.data.forward_calendar, com_after: $.data.committed_calendar } }
          assert:
            - "Baseline: forward_calendar == [] and committed_calendar == []"
            - "After create: forward_calendar == [[\"2026-08-10\", \"2026-09-06\"]] (HELD occupies forward only)"
            - "After RELEASE: forward_calendar == [] and committed_calendar == [] — invariant occupancy(after) == occupancy(before) restored exactly"
      - name: confirm_then_cancel_restores_contracted
        grounds:
          - state_machines.Flight.BOOKED_to_CANCELLED
          - entities.Campaign.fields.contracted_cents
          - entities.Campaign.fields.cancellation_fees_cents
        distinguishing_aspect: |
          Conserved quantity = money (campaign.contracted_cents), a different quantity
          type from the interval-set invariant. Forward = confirm (+1150000 gross);
          compensating = cancel from BOOKED; contracted returns to 0 EXACTLY while the
          575000 cancellation fee (50% tier: 9 days before start) lands in the SEPARATE
          cancellation_fees_cents accumulator and must not leak into contracted.
        test_recipe:
          setup:
            - "Full chain on static face F1 (permit to 2026-12-31): campaign APPROVED, flight 2026-08-10..2026-09-06 confirmed BOOKED at default clock 2026-08-01; contracted 1150000"
          setup_api_calls:
            - { call: "POST /api/rate-cards", payload: { market_code: "NYC", display_type: "STATIC", base_weekly_cents: 200000, illumination_premium_pct: 0.15, traffic_tier_1_threshold: 100000, traffic_tier_1_uplift_pct: 0.10, traffic_tier_2_threshold: 250000, traffic_tier_2_uplift_pct: 0.25 }, as: InventoryManager, captures: { rc: $.data.id, rc_v: $.data.version } }
            - { call: "PUT /api/rate-cards/${rc}", payload: { status: "PUBLISHED", expected_rate_card_version: "${rc_v}" }, as: InventoryManager }
            - { call: "POST /api/faces", payload: { face_code: "F-NYC-001", structure_code: "ST-001", market_code: "NYC", display_type: "STATIC", illuminated: true, daily_traffic_count: 300000, width_inches: 168, height_inches: 576 }, as: InventoryManager, captures: { f1: $.data.id } }
            - { call: "POST /api/permits", payload: { face_id: "${f1}", permit_number: "P-001", jurisdiction: "NYC DOB", issued_on: "2026-07-01T00:00:00Z", expires_on: "2026-12-31T00:00:00Z" }, as: ComplianceOfficer }
            - { call: "GET /api/faces/${f1}", payload: {}, as: SalesPlanner, captures: { f1_v: $.data.version } }
            - { call: "POST /api/advertiser-accounts", payload: { name: "Acme", credit_limit_cents: 90000000 }, as: SalesPlanner, captures: { adv: $.data.id } }
            - { call: "POST /api/campaigns", payload: { advertiser_id: "${adv}", name: "C1", start_date: "2026-08-01", end_date: "2026-09-30" }, as: SalesPlanner, captures: { camp: $.data.id } }
            - { call: "POST /api/flights", payload: { campaign_id: "${camp}", face_id: "${f1}", rate_card_id: "${rc}", start_date: "2026-08-10", end_date: "2026-09-06", expected_face_version: "${f1_v}" }, as: SalesPlanner, captures: { fl: $.data.id } }
            - { call: "PUT /api/campaigns/${camp}", payload: { status: "SUBMITTED" }, as: SalesPlanner }
            - { call: "PUT /api/campaigns/${camp}", payload: { status: "APPROVED" }, as: SalesManager, captures: { camp_v: $.data.version } }
            - { call: "POST /api/flights/${fl}/confirm", payload: { expected_campaign_version: "${camp_v}" }, as: SalesPlanner }
            - { call: "GET /api/campaigns/${camp}", payload: {}, as: SalesPlanner, captures: { contracted_mid: $.data.contracted_cents } }
          trigger:
            - { call: "PUT /api/flights/${fl}", payload: { status: "CANCELLED" }, as: SalesPlanner, captures: { fee: $.data.cancellation_fee_cents } }
            - { call: "GET /api/campaigns/${camp}", payload: {}, as: SalesPlanner, captures: { contracted_after: $.data.contracted_cents, fees_after: $.data.cancellation_fees_cents } }
            - { call: "GET /api/advertiser-accounts/${adv}", payload: {}, as: FinanceAnalyst, captures: { exposure_after: $.data.exposure_cents } }
          assert:
            - "After confirm: Campaign.contracted_cents == 1150000"
            - "After cancel: Flight.cancellation_fee_cents == 575000 (50% of 1150000; 2026-08-10 start is 9 days after the 2026-08-01 clock)"
            - "Campaign.contracted_cents == 0 — invariant restored exactly"
            - "Campaign.cancellation_fees_cents == 575000 (fee tracked separately, NOT in contracted)"
            - "AdvertiserAccount.exposure_cents == 0"
