              as: TaxOps
            - call: "POST /firms/${firm_id}/accounts/${acct_id}/dispositions"
              payload: { security_id: "${sec_id}", trade_date: "2025-06-10T00:00:00Z", settlement_date: "2025-06-11T00:00:00Z", quantity: 10, proceeds_cents: 15000, method: "FIFO" }
              as: TaxOps
              captures: { disp1_id: $.data.id }
            - call: "POST /firms/${firm_id}/dispositions/${disp1_id}/settle"
              payload: {}
              as: TaxOps
            - call: "POST /firms/${firm_id}/accounts/${acct_id}/dispositions"
              payload: { security_id: "${sec_id}", trade_date: "2025-06-12T00:00:00Z", settlement_date: "2025-06-13T00:00:00Z", quantity: 10, proceeds_cents: 9000, method: "FIFO" }
              as: TaxOps
              captures: { disp2_id: $.data.id }
