  - error_id: ERR_COLD_CHAIN_NOT_PACKABLE
    http_status: 422
    message: "Prescription {id} is refrigerated and can never be routed into a pouch roll."
    raised_by: "adjudicate with a refrigerated prescription in force_pouch_prescription_ids"
  - error_id: ERR_COLD_CHAIN_PACKAGING_INVALID
    http_status: 422
    message: "Packaging {packaging} is not valid for shipment kind {shipment_kind}."
    raised_by: "POST /pharmacy/fill-cycles/{id}/shipments with STANDARD packaging on a COLD_CHAIN parcel, or insulated packaging on a non cold-chain parcel"
  - error_id: ERR_NON_PACKABLE_IN_POUCH_ROUTE
    http_status: 422
    message: "Prescription {id} has form {form} and cannot be pouch-packed."
    raised_by: "adjudicate with a non-packable prescription in force_pouch_prescription_ids"
  - error_id: ERR_NO_PACKABLE_LINES
    http_status: 422
    message: "Fill cycle {id} has no adjudicated pouch-routed lines."
    raised_by: "POST /pharmacy/fill-cycles/{id}/generate-roll on a cold-chain-only cycle"
  - error_id: ERR_NO_LINES_FOR_SHIPMENT_KIND
    http_status: 422
    message: "Fill cycle {id} has no lines routed to shipment kind {shipment_kind}, or such a parcel already exists."
    raised_by: "POST /pharmacy/fill-cycles/{id}/shipments"
  - error_id: ERR_RX_PENDING_AUTHORIZATION
    http_status: 409
    message: "Prescription {id} is not ACTIVE and cannot be rolled."
    raised_by: "POST /pharmacy/fill-cycles/{id}/generate-roll"
  - error_id: ERR_ROLL_NOT_VERIFIED
    http_status: 409
    message: "The pouch roll for fill cycle {id} has not passed verification."
    raised_by: "POST /pharmacy/shipments/{id}/dispatch on a POUCH_ROLL parcel"
  - error_id: ERR_NO_APPROVED_VACATION_EXCEPTION
    http_status: 422
    message: "Vacation exception {id} is not an approved exception for this patient."
    raised_by: "adjudicate with a vacation_exception_id that is DENIED, SUBMITTED or belongs to another patient"
  - error_id: ERR_CYCLE_WINDOW_OVERLAP
    http_status: 409
    message: "Patient {id} already has a fill cycle covering {cycle_start_date}..{cycle_end_date}."
    raised_by: "POST /pharmacy/fill-cycles with a half-open window that intersects a live cycle"
  - error_id: ERR_REISSUE_SEGMENT_OVERLAP
    http_status: 409
    message: "Pouch roll segment {segment_start_date}..{segment_end_date} collides with an existing roll."
    raised_by: "POST /pharmacy/fill-cycles/{id}/generate-roll whose closed segment touches or overlaps a live roll"
  - error_id: ERR_COLD_CHAIN_GAP_VIOLATION
    http_status: 409
    message: "A cold-chain parcel for patient {id} was staged less than 48 hours ago."
    raised_by: "POST /pharmacy/fill-cycles/{id}/shipments with shipment_kind COLD_CHAIN inside the buffer"
  - error_id: ERR_VACATION_WINDOW_INVALID
    http_status: 422
    message: "Travel window {travel_start_date}..{travel_end_date} cannot support {requested_extra_days} extra days."
    raised_by: "POST /pharmacy/vacation-exceptions with a past start date or a window shorter than the requested days"
  - error_id: ERR_CHASE_TOO_EARLY
    http_status: 409
    message: "Refill authorization {id} may not be chased before {next_chase_due_at}."
    raised_by: "POST /pharmacy/refill-authorizations/{id}/chase from SENT inside the 72-hour window"
  - error_id: ERR_REISSUE_DATE_OUT_OF_WINDOW
    http_status: 422
    message: "Effective date {effective_date} is outside the cycle window."
    raised_by: "POST /pharmacy/fill-cycles/{id}/reissue"
  - error_id: ERR_CHASE_LIMIT_REACHED
    http_status: 409
    message: "Refill authorization {id} has exhausted its 3 chase rounds; escalate instead."
    raised_by: "POST /pharmacy/refill-authorizations/{id}/chase from SENT with chase_round == 3"
  - error_id: ERR_ESCALATION_PREMATURE
    http_status: 409
    message: "Refill authorization {id} has only completed {chase_round} of 3 chase rounds."
    raised_by: "POST /pharmacy/refill-authorizations/{id}/escalate too early"
  - error_id: ERR_REWORK_LIMIT_REACHED
    http_status: 409
    message: "Pouch roll {id} has already been reworked {rework_count} times."
