            - "incentive_usd == 15777.08 — revenue_cap == round2(0.05 * (312000.00 + 3541.50)) == 15777.08 wins over both 36000.00 and the 90000.00 pool cap"
            - "penalty_usd == 0.00 and brand_penalty_usd == 0.00"

      - name: brand_penalty_excludes_closed_or_verified_audits
        claim_type: input_set_filtering
        grounds:
          - calculations.brand_consistency_penalty
          - entities.BrandAudit.fields.finding_status
          - entities.BrandAudit.fields.remediation_status
        distinguishing_aspect: "The exposure filter is a conjunction over two independent dimensions, so leaving EITHER dimension is enough to drop an audit: a VERIFIED-but-still-OPEN audit and a fully CLOSED audit both contribute 0.00 while an ACKNOWLEDGED/IN_PROGRESS audit still counts."
        test_recipe:
          setup:
            - "ACTIVE agreement with one base and an OPEN cycle 2026-09 with published_departures 0 and no legs."
            - "Four audits on that base: MAJOR x2 left OPEN/NOT_STARTED; MINOR x3 driven to remediation VERIFIED while finding_status stays OPEN; CRITICAL x1 driven to finding_status CLOSED; MAJOR x1 left ACKNOWLEDGED/IN_PROGRESS."
          setup_api_calls:
            - call: "POST /cpa/agreements"
              payload: { mainline_partner_name: "Summit Air", regional_carrier_name: "Cascade Regional", fixed_monthly_fee_usd: 250000.00, block_hour_rate_usd: 1450.75, departure_rate_usd: 320.00, aircraft_ownership_fee_usd: 62000.00, incentive_pool_cap_usd: 90000.00, penalty_cap_usd: 120000.00, term_end_date: "2029-12-31" }
              as: CPAAdministrator
