        claim_type: immediate_consistency
        grounds:
          - "complexity_profile.consistency_model"
        distinguishing_aspect: "Immediate consistency: a GET issued right after a mutation reflects every side effect of that mutation in the same logical instant (no eventual lag)."
        test_recipe:
          setup: ["grower, shed, bin"]
          setup_api_calls:
            - { call: "POST /potato-shed/growers", payload: { name: "Grower AX", grower_code: "G-AX" }, as: ShedAdmin, captures: { g_id: "$.data.id" } }
            - { call: "POST /potato-shed/sheds", payload: { name: "Shed EF" }, as: ShedAdmin, captures: { s_id: "$.data.id" } }
            - { call: "POST /potato-shed/sheds/${s_id}/bins", payload: { bin_code: "B-1", capacity_cwt: 2000.00 }, as: ShedAdmin, captures: { b_id: "$.data.id" } }
            - { call: "POST /potato-shed/growers/${g_id}/field-lots", payload: { variety: "RUSSET_BURBANK", harvest_date: "2026-07-28", original_weight_cwt: 250.00 }, as: IntakeClerk, captures: { l_id: "$.data.id" } }
          trigger:
            - { call: "POST /potato-shed/field-lots/${l_id}/bin-assignment", payload: { bin_id: "${b_id}" }, as: IntakeClerk }
            - { call: "GET /potato-shed/field-lots/${l_id}", payload: {}, as: StorageManager, captures: { l_status: "$.data.storage_status", l_bin: "$.data.bin_id" } }
            - { call: "GET /potato-shed/sheds/${s_id}/bins", payload: {}, as: StorageManager, captures: { b_occ: "$.data[0].occupied_cwt", b_lock: "$.data[0].variety_lock" } }
          assert:
            - "l_status == BINNED and l_bin == ${b_id} immediately"
            - "b_occ == 250.00 and b_lock == RUSSET_BURBANK on the very next request (derived bin fields reconciled synchronously)"
