              as: PlanningStaff
              as_user_id: "staff-1"
              captures: { sc: $.data.id, sc_cap: $.data.land_capacity_units, sc_dem: $.data.projected_demand_units, sc_gap: $.data.capacity_gap_units }
            - call: "POST /planning/housing-allocations"
              payload: { plan_update_id: "${pu}", income_tier: "VERY_LOW", assigned_units: 4000, cycle_deadline: "2031-06-30T00:00:00Z" }
              as: StateReviewer
              as_user_id: "state-1"
            - call: "POST /planning/housing-allocations"
              payload: { plan_update_id: "${pu}", income_tier: "LOW", assigned_units: 3000, cycle_deadline: "2031-06-30T00:00:00Z" }
              as: StateReviewer
              as_user_id: "state-1"
