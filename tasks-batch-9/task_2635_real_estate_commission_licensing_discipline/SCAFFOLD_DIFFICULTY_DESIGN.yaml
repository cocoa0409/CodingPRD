  - rule_id: boundary_precision_check
    instances:
      - name: posture_shortage_threshold_99999_watch_versus_100000_restricted_on_ledger_append
        grounds:
          - calculations.brokerage_supervision_posture
          - calculations.trust_account_shortage
          - entities.Brokerage.fields.supervision_posture
          - endpoints["POST /commission/trust-accounts/{id}/ledger-entries"]
        distinguishing_aspect: |
          The metric is money and the endpoint is the ledger append. SHORTAGE_RESTRICT_THRESHOLD_CENTS
          is a `>=` boundary, so 99999 cents of shortage is WATCH and 100000 cents is RESTRICTED - a
          one-cent difference decides whether the brokerage may still take affiliations. A third append
          of exactly 1 cent of obligation moves the WATCH brokerage across the line in place, proving
          the tier is recomputed from the live figure rather than latched at audit time.
        test_recipe:
          setup:
            - "brokerage Alpha Realty (designated broker Al Broker) holds escrow account TA_A with an OBLIGATION_OPENED of 1000000 cents"
            - "brokerage Beta Realty (designated broker Bea Broker) holds escrow account TA_B with an OBLIGATION_OPENED of 1000000 cents"
            - "no audit has ever been scheduled on either account, so neither posture can be explained by a remediation order"
          setup_api_calls:
            - call: "POST /commission/licensees"
              payload: { person_type: "BROKER", full_name: "Al Broker", prelicense_hours: 180 }
              as: LicensingAnalyst
              captures: { al_id: $.data.id }
            - call: "POST /commission/licensees/${al_id}/exam-results"
              payload: { score: 90, taken_on: "2026-07-01" }
              as: LicensingAnalyst
            - call: "POST /commission/brokerages"
              payload: { name: "Alpha Realty", designated_broker_id: "${al_id}", trust_account_required: true, record_retention_years: 5 }
              as: LicensingAnalyst
              captures: { bkg_a_id: $.data.id }
            - call: "POST /commission/brokerages/${bkg_a_id}/trust-accounts"
              payload: { bank_name: "Seaside Bank", account_type: "ESCROW" }
              as: LicensingAnalyst
              captures: { ta_a_id: $.data.id, ta_a_v0: $.data.version }
            - call: "POST /commission/brokerages/${bkg_a_id}/activation"
              payload: { attestation_note: "escrow opened" }
              as: LicensingAnalyst
              captures: { bkg_a_v1: $.data.version }
            - call: "POST /commission/licensees/${al_id}/affiliations"
              payload: { brokerage_id: "${bkg_a_id}", supervising_broker_id: "${al_id}", expected_brokerage_version: "${bkg_a_v1}" }
              as: LicensingAnalyst
            - call: "POST /commission/licensees"
              payload: { person_type: "BROKER", full_name: "Bea Broker", prelicense_hours: 180 }
              as: LicensingAnalyst
              captures: { bea_id: $.data.id }
            - call: "POST /commission/licensees/${bea_id}/exam-results"
              payload: { score: 92, taken_on: "2026-07-01" }
              as: LicensingAnalyst
            - call: "POST /commission/brokerages"
              payload: { name: "Beta Realty", designated_broker_id: "${bea_id}", trust_account_required: true, record_retention_years: 5 }
              as: LicensingAnalyst
              captures: { bkg_b_id: $.data.id }
            - call: "POST /commission/brokerages/${bkg_b_id}/trust-accounts"
              payload: { bank_name: "Seaside Bank", account_type: "ESCROW" }
              as: LicensingAnalyst
              captures: { ta_b_id: $.data.id, ta_b_v0: $.data.version }
            - call: "POST /commission/brokerages/${bkg_b_id}/activation"
              payload: { attestation_note: "escrow opened" }
              as: LicensingAnalyst
              captures: { bkg_b_v1: $.data.version }
            - call: "POST /commission/licensees/${bea_id}/affiliations"
              payload: { brokerage_id: "${bkg_b_id}", supervising_broker_id: "${bea_id}", expected_brokerage_version: "${bkg_b_v1}" }
              as: LicensingAnalyst
            - call: "POST /commission/trust-accounts/${ta_a_id}/ledger-entries"
              payload: { entry_type: "OBLIGATION_OPENED", amount_cents: 1000000, effective_date: "2026-08-01", transaction_reference: "OBL-A1", expected_trust_account_version: "${ta_a_v0}" }
              as: LicensingAnalyst
            - call: "POST /commission/trust-accounts/${ta_b_id}/ledger-entries"
              payload: { entry_type: "OBLIGATION_OPENED", amount_cents: 1000000, effective_date: "2026-08-01", transaction_reference: "OBL-B1", expected_trust_account_version: "${ta_b_v0}" }
              as: LicensingAnalyst
          trigger:
            - call: "GET /commission/trust-accounts/${ta_a_id}"
              payload: {}
              as: LicensingAnalyst
              captures: { ta_a_v1: $.data.version }
            - call: "POST /commission/trust-accounts/${ta_a_id}/ledger-entries"
              payload: { entry_type: "DEPOSIT", amount_cents: 900001, effective_date: "2026-08-01", cleared_date: "2026-08-01", transaction_reference: "DEP-A1", expected_trust_account_version: "${ta_a_v1}" }
              as: LicensingAnalyst
            - call: "GET /commission/trust-accounts/${ta_b_id}"
              payload: {}
              as: LicensingAnalyst
              captures: { ta_b_v1: $.data.version }
            - call: "POST /commission/trust-accounts/${ta_b_id}/ledger-entries"
              payload: { entry_type: "DEPOSIT", amount_cents: 900000, effective_date: "2026-08-01", cleared_date: "2026-08-01", transaction_reference: "DEP-B1", expected_trust_account_version: "${ta_b_v1}" }
              as: LicensingAnalyst
            - call: "GET /commission/trust-accounts/${ta_a_id}"
              payload: {}
              as: LicensingAnalyst
              captures: { ta_a_v2: $.data.version }
            - call: "POST /commission/trust-accounts/${ta_a_id}/ledger-entries"
              payload: { entry_type: "OBLIGATION_OPENED", amount_cents: 1, effective_date: "2026-08-02", transaction_reference: "OBL-A2", expected_trust_account_version: "${ta_a_v2}" }
              as: LicensingAnalyst
          assert:
            - "after DEP-A1: TrustAccount.${ta_a_id}.shortage_cents == 99999 and Brokerage.${bkg_a_id}.supervision_posture == WATCH (99999 is strictly below the 100000 threshold, and a positive shortage is enough for WATCH)"
            - "after DEP-B1: TrustAccount.${ta_b_id}.shortage_cents == 100000 and Brokerage.${bkg_b_id}.supervision_posture == RESTRICTED (the tier comparison is >=, so exactly 100000 restricts)"
            - "Brokerage.${bkg_a_id}.open_shortage_cents == 99999 and Brokerage.${bkg_b_id}.open_shortage_cents == 100000"
            - "after OBL-A2 of exactly 1 cent: TrustAccount.${ta_a_id}.shortage_cents == 100000 and Brokerage.${bkg_a_id}.supervision_posture flips WATCH -> RESTRICTED"
            - "no TrustAudit row exists for either account and both accounts are still status OPEN - the posture came from the live shortage figure, not from a remediation order"
            - "TrustAccount.${ta_a_id}.book_obligation_cents == 1000001 and book_available_cents == 900001 after the third append"
      - name: probable_cause_score_boundary_39_refused_versus_40_accepted_on_complaint_disposition
        grounds:
          - calculations.complaint_priority_score
          - validations[priority=38]
          - errors.ERR_PROBABLE_CAUSE_SCORE_TOO_LOW
          - endpoints["POST /commission/complaints/{id}/disposition"]
        distinguishing_aspect: |
          A different metric (integer score points, not cents) on a different endpoint (complaint
          disposition, not the ledger). PROBABLE_CAUSE_MIN_SCORE is 40 and the harm term is a floor
          division by 100000, so an ADVERTISING complaint alleging 2499999 cents scores 15 + 24 == 39
          and is refused while 2500000 cents scores 15 + 25 == 40 and is accepted. The refused case is
          then amended up by a single cent-band and clears on the retry, so the boundary is exercised
          from below, at the line, and across it on the same row.
        test_recipe:
          setup:
            - "Harbor Realty Group is ACTIVE with designated broker Dana Broker; salespersons Rae Field and Ken Ito are ACTIVE and affiliated"
            - "Harbor's supervision_posture is COMPLIANT and stays COMPLIANT: it has no trust account and only two open complaints, below the WATCH_COMPLAINT_THRESHOLD of 3, so the posture bump is 0"
            - "neither respondent has any prior sanction, so the prior term is 0 and the investigation score is base + harm alone"
            - "complaint CMP-A against Rae Field alleges ADVERTISING with alleged_loss_cents 2499999; complaint CMP-B against Ken Ito alleges ADVERTISING with alleged_loss_cents 2500000; both are in INVESTIGATION"
          setup_api_calls:
            - call: "POST /commission/licensees"
              payload: { person_type: "BROKER", full_name: "Dana Broker", prelicense_hours: 180 }
              as: LicensingAnalyst
              captures: { br_id: $.data.id }
            - call: "POST /commission/licensees/${br_id}/exam-results"
