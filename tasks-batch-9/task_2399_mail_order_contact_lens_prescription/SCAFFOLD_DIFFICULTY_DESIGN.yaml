scaffold_difficulty_design:
- rule_id: dual_variant_calc
  rule_name: Dual-variant calculation
  instances:
  - name: return_settlement_per_box_versus_pooled_rounding
    grounds: §1.3 calculation return_settlement_cents declares variants PER_BOX_ROUNDED (reason PRESCRIPTION_CHANGE) and POOLED_ROUNDED (reason WRONG_PARAMETER) that differ only in whether each opened box residue is rounded to cents before summing.
    distinguishing_aspect: An implementation that rounds once at the end, or once per box, for both variants returns the same number twice. The correct implementation returns 7359 for PRESCRIPTION_CHANGE and 7360 for WRONG_PARAMETER on byte-identical return payloads, a 1-cent divergence that only per-box rounding produces.
    test_recipe:
      setup:
      - A customer with an UPLOAD-verified prescription for a 3200-cent, 30-lens-per-box daily product places a six-box order and ships it, then files one PRESCRIPTION_CHANGE return covering three opened boxes with 7 lenses used in each.
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          current_utc: '2026-09-08T10:00:00Z'
        as: PlatformAdmin
        as_user_id: admin-root
      - call: POST /products
        payload:
          brand: AcuityFlex
          name: Daily 30
          wear_schedule: DAILY_DISPOSABLE
          lenses_per_box: 30
          unit_price_cents: 3200
          base_curve: 8.6
          diameter: 14.2
          sphere_min: -8.0
          sphere_max: 4.0
          sphere_step: 0.25
          material_family: silicone_hydrogel
        as: PlatformAdmin
        as_user_id: admin-root
        captures:
          p1_id: $.data.id
      - call: POST /customers
        payload:
          full_name: Ada Lin
          email: ada.lin@example.com
          state_code: UT
        as: PlatformAdmin
        as_user_id: admin-root
        captures:
          cust_id: $.data.id
      - call: POST /prescriptions
        payload:
          customer_id: ${cust_id}
          product_id: ${p1_id}
          capture_mode: UPLOAD
          document_reference: scan-1
          issue_date: '2026-07-01'
          expiry_date: '2027-07-01'
          od_sphere: -2.25
          os_sphere: -4.0
          base_curve: 8.6
          diameter: 14.2
          boxes_authorized_total: 24
        as: Customer
        as_user_id: ${cust_id}
        captures:
          rx_id: $.data.id
      - call: POST /prescriptions/${rx_id}/submit
        payload: {}
        as: Customer
        as_user_id: ${cust_id}
      - call: POST /orders
        payload:
          customer_id: ${cust_id}
          prescription_id: ${rx_id}
          ordered_product_id: ${p1_id}
          boxes_od: 3
          boxes_os: 3
        as: Customer
        as_user_id: ${cust_id}
        captures:
          order_id: $.data.id
      - call: POST /orders/${order_id}/ship
        payload: {}
        as: FulfillmentOperator
        as_user_id: fo-one
      - call: POST /return-requests
        payload:
          order_id: ${order_id}
          customer_id: ${cust_id}
          reason: PRESCRIPTION_CHANGE
          unopened_boxes: 0
          opened_box_used_counts:
          - 7
          - 7
          - 7
        as: Customer
        as_user_id: ${cust_id}
        captures:
          ret_per_box_id: $.data.id
      trigger:
      - call: POST /return-requests
        payload:
          order_id: ${order_id}
          customer_id: ${cust_id}
          reason: WRONG_PARAMETER
          unopened_boxes: 0
          opened_box_used_counts:
          - 7
          - 7
          - 7
        as: Customer
        as_user_id: ${cust_id}
      assert:
      - Trigger returns 201 with settlement_mode POOLED_ROUNDED and settlement_cents 7360.
      - GET /return-requests/${ret_per_box_id} as ComplianceOfficer returns settlement_mode PER_BOX_ROUNDED and settlement_cents 7359.
      - Both rows carry settlement_channel CASH_REFUND and status SUBMITTED, so no money has moved yet.
      - GET /orders/${order_id} still reports total_cents 19200, subtotal_cents 19200 and shipping_cents 0.
  - name: auto_reorder_cadence_nominal_versus_usage_adjusted
    grounds: §1.3 calculation auto_reorder_cadence declares variants NOMINAL (supply days from wear_schedule and lenses_per_box) and USAGE_ADJUSTED (supply days from observed_days_per_box), both then reduced by REORDER_LEAD_TIME_DAYS and floored at MIN_CADENCE_DAYS.
    distinguishing_aspect: An implementation that ignores cadence_basis, or that multiplies observed_days_per_box by lenses_per_box, produces one cadence for both schedules. The correct implementation yields cadence_days 85 with next_run_at 2026-12-02T08:00:00.000Z for the NOMINAL schedule and cadence_days 35 with next_run_at 2026-10-19T08:00:00.000Z for the USAGE_ADJUSTED one.
    test_recipe:
      setup:
      - One verified prescription carries two schedules, a NOMINAL three-box schedule anchored 2026-09-08 and a USAGE_ADJUSTED one-box schedule anchored 2026-09-14 that reports a 40-day observed box life.
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          current_utc: '2026-09-08T10:00:00Z'
        as: PlatformAdmin
        as_user_id: admin-root
      - call: POST /products
        payload:
          brand: AcuityFlex
          name: Daily 30
          wear_schedule: DAILY_DISPOSABLE
          lenses_per_box: 30
          unit_price_cents: 3200
          base_curve: 8.6
          diameter: 14.2
          sphere_min: -8.0
          sphere_max: 4.0
          sphere_step: 0.25
          material_family: silicone_hydrogel
        as: PlatformAdmin
        as_user_id: admin-root
        captures:
          p1_id: $.data.id
      - call: POST /customers
        payload:
          full_name: Ada Lin
          email: ada.lin@example.com
          state_code: UT
        as: PlatformAdmin
        as_user_id: admin-root
        captures:
          cust_id: $.data.id
      - call: POST /prescriptions
        payload:
          customer_id: ${cust_id}
          product_id: ${p1_id}
          capture_mode: UPLOAD
          document_reference: scan-1
          issue_date: '2026-07-01'
          expiry_date: '2027-07-01'
          od_sphere: -2.25
          os_sphere: -4.0
          base_curve: 8.6
          diameter: 14.2
          boxes_authorized_total: 24
        as: Customer
        as_user_id: ${cust_id}
        captures:
          rx_id: $.data.id
      - call: POST /prescriptions/${rx_id}/submit
        payload: {}
        as: Customer
        as_user_id: ${cust_id}
      - call: POST /auto-reorder-schedules
        payload:
          customer_id: ${cust_id}
          prescription_id: ${rx_id}
          product_id: ${p1_id}
          boxes_per_run: 3
          anchor_date: '2026-09-08'
          cadence_basis: NOMINAL
        as: Customer
        as_user_id: ${cust_id}
        captures:
          sched_nominal_id: $.data.id
      trigger:
      - call: POST /auto-reorder-schedules
        payload:
          customer_id: ${cust_id}
          prescription_id: ${rx_id}
          product_id: ${p1_id}
          boxes_per_run: 1
          anchor_date: '2026-09-14'
          cadence_basis: USAGE_ADJUSTED
          observed_days_per_box: 40
        as: Customer
        as_user_id: ${cust_id}
      assert:
      - Trigger returns 201 with cadence_days 35 and next_run_at 2026-10-19T08:00:00.000Z.
      - GET /auto-reorder-schedules/${sched_nominal_id} as Customer ${cust_id} returns cadence_days 85 and next_run_at 2026-12-02T08:00:00.000Z.
      - GET /customers/${cust_id} reports active_schedule_count 2 and auto_reorder_enabled true.
  - name: torn_lens_no_proration_variant_ignores_box_residue
    grounds: §1.3 calculation return_settlement_cents declares a third variant NO_PRORATION for reason TORN_LENS whose input set is torn_lens_count and the order total only, plus settlement_channel STORE_CREDIT.
    distinguishing_aspect: An implementation that runs the proration branch for every return, or that credits cash for torn lenses, returns 7359 or 7360 as a CASH_REFUND. The correct implementation ignores opened_box_used_counts entirely and returns 747 as STORE_CREDIT for the same physical boxes.
    test_recipe:
      setup:
      - The same six-box shipped order as the first instance, this time returned as TORN_LENS with 7 torn lenses reported while three opened boxes with 7 lenses used are also declared.
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          current_utc: '2026-09-08T10:00:00Z'
        as: PlatformAdmin
        as_user_id: admin-root
      - call: POST /products
        payload:
          brand: AcuityFlex
          name: Daily 30
          wear_schedule: DAILY_DISPOSABLE
          lenses_per_box: 30
          unit_price_cents: 3200
          base_curve: 8.6
          diameter: 14.2
          sphere_min: -8.0
          sphere_max: 4.0
          sphere_step: 0.25
          material_family: silicone_hydrogel
        as: PlatformAdmin
        as_user_id: admin-root
        captures:
          p1_id: $.data.id
      - call: POST /customers
        payload:
          full_name: Ada Lin
          email: ada.lin@example.com
          state_code: UT
        as: PlatformAdmin
        as_user_id: admin-root
        captures:
          cust_id: $.data.id
      - call: POST /prescriptions
        payload:
          customer_id: ${cust_id}
          product_id: ${p1_id}
          capture_mode: UPLOAD
          document_reference: scan-1
          issue_date: '2026-07-01'
          expiry_date: '2027-07-01'
          od_sphere: -2.25
          os_sphere: -4.0
          base_curve: 8.6
          diameter: 14.2
          boxes_authorized_total: 24
        as: Customer
        as_user_id: ${cust_id}
        captures:
          rx_id: $.data.id
      - call: POST /prescriptions/${rx_id}/submit
        payload: {}
        as: Customer
        as_user_id: ${cust_id}
      - call: POST /orders
        payload:
          customer_id: ${cust_id}
          prescription_id: ${rx_id}
          ordered_product_id: ${p1_id}
          boxes_od: 1
          boxes_os: 1
        as: Customer
        as_user_id: ${cust_id}
        captures:
          order_id: $.data.id
      - call: POST /orders/${order_id}/ship
        payload: {}
        as: FulfillmentOperator
        as_user_id: fo-one
      trigger:
      - call: POST /return-requests
        payload:
          order_id: ${order_id}
          customer_id: ${cust_id}
          reason: TORN_LENS
          unopened_boxes: 0
          opened_box_used_counts:
          - 7
          torn_lens_count: 7
        as: Customer
        as_user_id: ${cust_id}
      assert:
      - Trigger returns 201 with settlement_mode NO_PRORATION, settlement_cents 747 and settlement_channel STORE_CREDIT.
      - 747 is round_half_up(7 * 3200 / 30) and is below the cap floor(6400 * 0.20) = 1280, so the cap does not bind here.
      - The declared opened_box_used_counts [7] contributes nothing; a prorating implementation would have returned 2453.
- rule_id: combinatorial_formula
  rule_name: Multi-input combinatorial formula
  instances:
  - name: claim_eight_step_order_with_allowance_cap_and_top_fee_tier
    grounds: §1.3 calculation insurance_reimbursable_cents fixes eight ordered steps in which the processing fee tier is keyed on pre_fee_subtotal_cents, itself the sum of applied_allowance_cents and coinsurance_cents.
    distinguishing_aspect: Keying the fee on the order subtotal of 19200 also selects the 500-cent tier but on the wrong base, and computing coinsurance on the whole base rather than only the amount above the allowance yields 3840 instead of 840. Only the declared order produces applied_allowance_cents 15000, coinsurance_cents 840, pre_fee_subtotal_cents 15840, processing_fee_cents 500 and reimbursable_cents 15340.
    test_recipe:
      setup:
      - An out-of-network plan with a 15000-cent allowance and a 0.20 coinsurance rate covers a customer whose delivered six-box order subtotals 19200 cents; no allowance has been used yet.
      setup_api_calls:
