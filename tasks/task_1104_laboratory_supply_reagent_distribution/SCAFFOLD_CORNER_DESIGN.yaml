      - name: kit_fee_tier_boundary_at_100000
        claim_type: threshold_boundary
        grounds: [calculations.kit_price_rollup]
        distinguishing_aspect: "component_cost exactly 100000 lands in tier 2 (>= boundary) with fee 4000 -> kit_price 104000; 99999 stays tier 1 -> 101499."
        test_recipe:
          setup:
