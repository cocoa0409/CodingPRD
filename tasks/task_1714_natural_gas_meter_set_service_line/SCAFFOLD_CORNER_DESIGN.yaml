            - { call: "POST /main-extensions", payload: { service_application_id: "${app_id}", design_footage_ft: 200, crossings: [{ surface_type: ASPHALT, length_ft: 12.0, width_ft: 3.0 }], rock_excavation_expected: false }, as: DesignEngineer, as_user_id: "eng-1", captures: { me_id: $.data.id } }
            - { call: "POST /main-extensions/${me_id}/submit-design", payload: {}, as: DesignEngineer, as_user_id: "eng-1" }
