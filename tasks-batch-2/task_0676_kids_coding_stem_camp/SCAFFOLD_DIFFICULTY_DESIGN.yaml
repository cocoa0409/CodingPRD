  # =====================================================================
  # Rule 9 — compensating_invariant (different conserved quantities)
  # =====================================================================
  - rule_id: compensating_invariant
    instances:
      - name: drop_in_charge_then_refund_conserves_total_money
        grounds:
          - state_machines.Enrollment.RESERVED_to_CANCELLED
          - calculations.enrollment_drop_in_price
          - entities.Guardian.fields.wallet_credit_cents
          - entities.Enrollment.fields.price_cents
        distinguishing_aspect: "Conserved quantity = total money, pinned as guardian.wallet_credit_cents + (price_cents + wallet_applied_cents over CHARGED enrollments). A DROP_IN enrollment fully covered by a wallet of 4000 (discounted 4000, wallet_applied 4000, price_cents 0, wallet -> 0) then refundably cancelled (>=24h) restores price_cents + wallet_applied_cents = 0 + 4000 to the wallet: wallet returns to 4000 and no money is created or destroyed."
        test_recipe:
          setup:
            - "Guardian wallet 4000; member; OPEN session starting well beyond 24h (2026-05-01T16:00:00Z, clock at default 2026-04-01). Enroll DROP_IN: discounted 4000, wallet_applied 4000, price_cents 0, wallet -> 0. Then cancel >24h before start: full refund returns the charge."
          setup_api_calls:
            - call: "POST /centers"
              payload: { name: "C1", device_count: 50, min_student_instructor_ratio: 10 }
              as: CenterAdmin
              captures: { c1: $.data.id }
            - call: "POST /programs"
              payload: { name: "Create", code: "CRB1", min_age: 4, max_age: 18, drop_in_fee_cents: 4000 }
              as: CenterAdmin
              captures: { prog: $.data.id }
            - call: "POST /belt-levels"
              payload: { program_id: "${prog}", name: "White", rank: 1, required_badge_count: 0 }
              as: CenterAdmin
              captures: { belt1: $.data.id }
            - call: "POST /guardians"
              payload: { full_name: "G1", email: "g1@x.com" }
              as: CenterAdmin
              captures: { g1: $.data.id }
            - call: "POST /guardians/${g1}/wallet/adjustments"
              payload: { amount_cents: 4000, reason: "seed" }
              as: CenterAdmin
            - call: "POST /members"
              payload: { guardian_id: "${g1}", program_id: "${prog}", full_name: "M1", birth_date: "2016-01-01" }
              as: Guardian
              as_user_id: "${g1}"
              captures: { m1: $.data.id }
            - call: "POST /sessions"
              payload: { center_id: "${c1}", program_id: "${prog}", format: "AFTER_SCHOOL", week_count: 1, starts_at: "2026-05-01T16:00:00Z", ends_at: "2026-05-01T18:00:00Z", device_seats_requested: 1, assigned_instructor_count: 5 }
              as: CenterAdmin
              captures: { s1: $.data.id }
            - call: "POST /sessions/${s1}/open"
              payload: {}
              as: CenterAdmin
              captures: { s1v: $.data.version }
            - call: "POST /enrollments"
              payload: { session_id: "${s1}", member_id: "${m1}", coverage: "DROP_IN", sibling_index: 1, expected_session_version: "${s1v}" }
              as: Guardian
              as_user_id: "${g1}"
              captures: { e1: $.data.id }
          trigger:
            - call: "POST /enrollments/${e1}/cancel"
              payload: {}
              as: Guardian
              as_user_id: "${g1}"
          assert:
            - "Enrollment.${e1}.attendance_status == CANCELLED"
            - "Enrollment.${e1}.billing_status == REFUNDED"
            - "Guardian.${g1}.wallet_credit_cents == 4000"

      - name: membership_consume_then_cancel_conserves_seat_count
        grounds:
          - state_machines.Enrollment.RESERVED_to_CANCELLED
          - entities.Membership.fields.sessions_used_this_cycle
          - entities.Membership.fields.included_sessions_per_cycle
        distinguishing_aspect: "Conserved quantity = membership seats (sessions_used_this_cycle + remaining_included = included_sessions_per_cycle). A MEMBERSHIP enrollment consumes one seat (used 1) then its cancellation returns the seat (used 0) regardless of the 24h window — a different conserved quantity (integer seat count) than the money invariant above."
        test_recipe:
          setup:
            - "ACTIVE membership included 8, used 0; OPEN session; member enrolled MEMBERSHIP (used -> 1). Then cancel: used -> 0."
          setup_api_calls:
            - call: "POST /centers"
              payload: { name: "C1", device_count: 50, min_student_instructor_ratio: 10 }
              as: CenterAdmin
              captures: { c1: $.data.id }
            - call: "POST /programs"
              payload: { name: "Build", code: "CRB2", min_age: 4, max_age: 18, drop_in_fee_cents: 4000 }
              as: CenterAdmin
              captures: { prog: $.data.id }
            - call: "POST /belt-levels"
              payload: { program_id: "${prog}", name: "White", rank: 1, required_badge_count: 0 }
              as: CenterAdmin
              captures: { belt1: $.data.id }
            - call: "POST /guardians"
