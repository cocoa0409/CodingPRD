scaffold_difficulty_design:
  # ===================================================================
  # Rule 1 — dual_variant_calc (different entity domains)
  # ===================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: bed_nominal_vs_actual_after_protracted_course
        grounds:
          - calculations.bed_nominal
          - calculations.bed_actual
          - entities.TreatmentCourse.fields.bed_nominal_gy
          - entities.TreatmentCourse.fields.bed_actual_gy
        distinguishing_aspect: |
          Clinical-dose domain (TreatmentCourse): the planned baseline variant uses planned n and d
          with no time correction, while the delivered variant replays DELIVERED fractions only and
          subtracts a 0.6 Gy/day repopulation penalty beyond day 28 — identical course data yields
          24.000 vs 13.200 Gy because the 46-day first-to-last fraction span incurs a 10.800 Gy penalty.
        test_recipe:
          setup:
            - "IMRT course prescribed_total_dose_cGy 2000, planned_fractions 10 (dose_per_fraction_cGy 200 = 2 Gy)"
            - "Plan approved (PRIMARY and SECOND physics checks PASS)"
            - "10 fractions delivered: f1-f5 on 2026-08-03..07, f6-f10 on 2026-09-14..18 (all weekdays)"
            - "One PASS chart review after the 5th delivery so deliveries 6-10 pass the chart gate"
            - "First-to-last delivered span = 46 days > REPOPULATION_KICKOFF_DAY 28"
          setup_api_calls:
            - { call: "POST /oncology/patients", payload: { mrn: "MRN-BED-1", full_name: "Bed Case", date_of_birth: "1958-02-11" }, as: Scheduler, captures: { pat: $.data.id } }
            - { call: "POST /oncology/patients/${pat}/treatment-courses", payload: { diagnosis_code: "C61", intent: "CURATIVE", technique: "IMRT", prescribed_total_dose_cGy: 2000, planned_fractions: 10 }, as: RadiationOncologist, as_user_id: "onc_a", captures: { crs: $.data.id } }
            - { call: "POST /oncology/machines", payload: { name: "CT-Sim-1", machine_type: "CT_SIMULATOR", room: "SIM1" }, as: SystemAdmin, captures: { sim_m: $.data.id } }
            - { call: "POST /oncology/machines", payload: { name: "Linac-1", machine_type: "LINAC", room: "TX1" }, as: SystemAdmin, captures: { lin_m: $.data.id } }
            - { call: "POST /oncology/treatment-courses/${crs}/simulation-appointments", payload: { machine_id: "${sim_m}", start_time: "2026-07-30T09:00:00Z", end_time: "2026-07-30T09:30:00Z", immobilization_device: "THERMOPLASTIC_MASK" }, as: Scheduler, captures: { sim_a: $.data.id } }
            - { call: "POST /oncology/simulation-appointments/${sim_a}/complete", payload: { patient_weight_kg: 80.0 }, as: RadiationTherapist, as_user_id: "rtt_a" }
            - { call: "POST /oncology/treatment-courses/${crs}/contour-sets", payload: { set_label: "CT1", target_volumes: ["PTV"], oar_structures: ["Bladder"] }, as: RadiationOncologist, as_user_id: "onc_a", captures: { cs: $.data.id } }
            - { call: "POST /oncology/contour-sets/${cs}/submit", payload: {}, as: RadiationOncologist, as_user_id: "onc_a" }
            - { call: "POST /oncology/contour-sets/${cs}/approve", payload: {}, as: RadiationOncologist, as_user_id: "onc_b" }
            - { call: "GET /oncology/treatment-courses/${crs}", payload: {}, as: RadiationOncologist, as_user_id: "onc_a", captures: { crs_v: $.data.version } }
            - { call: "POST /oncology/treatment-courses/${crs}/treatment-plans", payload: { contour_set_id: "${cs}", target_total_dose_cGy: 2000, planned_fractions: 10, expected_course_version: "${crs_v}" }, as: MedicalDosimetrist, as_user_id: "dos_a", captures: { pl: $.data.id } }
            - { call: "POST /oncology/treatment-plans/${pl}/dose-constraints", payload: { structure_name: "Bladder", constraint_type: "MAX_DOSE", limit_cGy: 2000, evaluated_value_cGy: 1800 }, as: MedicalDosimetrist, as_user_id: "dos_a" }
            - { call: "POST /oncology/treatment-plans/${pl}/submit-for-check", payload: {}, as: MedicalDosimetrist, as_user_id: "dos_a" }
            - { call: "POST /oncology/treatment-plans/${pl}/physics-checks", payload: { check_type: "PRIMARY", outcome: "PASS" }, as: MedicalPhysicist, as_user_id: "phys_a" }
            - { call: "POST /oncology/treatment-plans/${pl}/physics-checks", payload: { check_type: "SECOND", outcome: "PASS" }, as: MedicalPhysicist, as_user_id: "phys_b" }
            - { call: "POST /oncology/treatment-courses/${crs}/fraction-sessions", payload: { plan_id: "${pl}", machine_id: "${lin_m}", start_time: "2026-08-03T09:00:00Z", end_time: "2026-08-03T09:20:00Z" }, as: Scheduler, captures: { f1: $.data.id } }
            - { call: "POST /oncology/treatment-courses/${crs}/fraction-sessions", payload: { plan_id: "${pl}", machine_id: "${lin_m}", start_time: "2026-08-04T09:00:00Z", end_time: "2026-08-04T09:20:00Z" }, as: Scheduler, captures: { f2: $.data.id } }
            - { call: "POST /oncology/treatment-courses/${crs}/fraction-sessions", payload: { plan_id: "${pl}", machine_id: "${lin_m}", start_time: "2026-08-05T09:00:00Z", end_time: "2026-08-05T09:20:00Z" }, as: Scheduler, captures: { f3: $.data.id } }
            - { call: "POST /oncology/treatment-courses/${crs}/fraction-sessions", payload: { plan_id: "${pl}", machine_id: "${lin_m}", start_time: "2026-08-06T09:00:00Z", end_time: "2026-08-06T09:20:00Z" }, as: Scheduler, captures: { f4: $.data.id } }
            - { call: "POST /oncology/treatment-courses/${crs}/fraction-sessions", payload: { plan_id: "${pl}", machine_id: "${lin_m}", start_time: "2026-08-07T09:00:00Z", end_time: "2026-08-07T09:20:00Z" }, as: Scheduler, captures: { f5: $.data.id } }
            - { call: "POST /oncology/fraction-sessions/${f1}/deliver", payload: {}, as: RadiationTherapist, as_user_id: "rtt_a" }
            - { call: "POST /oncology/fraction-sessions/${f2}/deliver", payload: {}, as: RadiationTherapist, as_user_id: "rtt_a" }
            - { call: "POST /oncology/fraction-sessions/${f3}/deliver", payload: {}, as: RadiationTherapist, as_user_id: "rtt_a" }
            - { call: "POST /oncology/fraction-sessions/${f4}/deliver", payload: {}, as: RadiationTherapist, as_user_id: "rtt_a" }
            - { call: "POST /oncology/fraction-sessions/${f5}/deliver", payload: {}, as: RadiationTherapist, as_user_id: "rtt_a" }
            - { call: "POST /oncology/treatment-courses/${crs}/chart-reviews", payload: { outcome: "PASS" }, as: MedicalPhysicist, as_user_id: "phys_a" }
            - { call: "POST /oncology/treatment-courses/${crs}/fraction-sessions", payload: { plan_id: "${pl}", machine_id: "${lin_m}", start_time: "2026-09-14T09:00:00Z", end_time: "2026-09-14T09:20:00Z" }, as: Scheduler, captures: { f6: $.data.id } }
            - { call: "POST /oncology/treatment-courses/${crs}/fraction-sessions", payload: { plan_id: "${pl}", machine_id: "${lin_m}", start_time: "2026-09-15T09:00:00Z", end_time: "2026-09-15T09:20:00Z" }, as: Scheduler, captures: { f7: $.data.id } }
            - { call: "POST /oncology/treatment-courses/${crs}/fraction-sessions", payload: { plan_id: "${pl}", machine_id: "${lin_m}", start_time: "2026-09-16T09:00:00Z", end_time: "2026-09-16T09:20:00Z" }, as: Scheduler, captures: { f8: $.data.id } }
            - { call: "POST /oncology/treatment-courses/${crs}/fraction-sessions", payload: { plan_id: "${pl}", machine_id: "${lin_m}", start_time: "2026-09-17T09:00:00Z", end_time: "2026-09-17T09:20:00Z" }, as: Scheduler, captures: { f9: $.data.id } }
            - { call: "POST /oncology/treatment-courses/${crs}/fraction-sessions", payload: { plan_id: "${pl}", machine_id: "${lin_m}", start_time: "2026-09-18T09:00:00Z", end_time: "2026-09-18T09:20:00Z" }, as: Scheduler, captures: { f10: $.data.id } }
            - { call: "POST /oncology/fraction-sessions/${f6}/deliver", payload: {}, as: RadiationTherapist, as_user_id: "rtt_a" }
            - { call: "POST /oncology/fraction-sessions/${f7}/deliver", payload: {}, as: RadiationTherapist, as_user_id: "rtt_a" }
            - { call: "POST /oncology/fraction-sessions/${f8}/deliver", payload: {}, as: RadiationTherapist, as_user_id: "rtt_a" }
            - { call: "POST /oncology/fraction-sessions/${f9}/deliver", payload: {}, as: RadiationTherapist, as_user_id: "rtt_a" }
            - { call: "POST /oncology/fraction-sessions/${f10}/deliver", payload: {}, as: RadiationTherapist, as_user_id: "rtt_a" }
          trigger:
            - { call: "GET /oncology/treatment-courses/${crs}", payload: {}, as: RadiationOncologist, as_user_id: "onc_a" }
          assert:
            - "TreatmentCourse.${crs}.bed_nominal_gy == 24.000  (10 * 2 * (1 + 2/10), no time correction)"
            - "TreatmentCourse.${crs}.bed_actual_gy == 13.200  (24.000 - 0.6 * (46 - 28))"
            - "TreatmentCourse.${crs}.delivered_fractions == 10"
            - "TreatmentCourse.${crs}.delivered_dose_cGy == 2000"

      - name: billing_provisional_vs_final_settlement
        grounds:
          - calculations.billing_provisional_total
          - calculations.claim_discount
          - entities.BillingClaim.fields.provisional_total_cents
          - entities.BillingClaim.fields.final_total_cents
        distinguishing_aspect: |
          Fiscal domain (BillingClaim) — a different entity domain than the TreatmentCourse BED pair:
          the forward-looking variant adds projected delivery charges for the 2 undelivered planned
          fractions (2 x 32000 = 64000) on top of the 438000 incurred lines, while the chronological
          finalize variant sums only incurred lines and applies the payer-tier discount; the same
          claim reads 502000 provisionally but finalizes at 438000.
        test_recipe:
          setup:
            - "IMRT course prescribed_total_dose_cGy 5000, planned_fractions 5; plan approved with 1 target volume (planning charge 210000)"
            - "Claim opened AFTER plan approval (backfills SIMULATION 65000, 2 x PHYSICS_CHECK 25000, PLANNING 210000)"
            - "3 fractions delivered 2026-08-03..05 (f1 also bills FIRST_FRACTION_SETUP 12000; 3 x FRACTION_DELIVERY 32000)"
            - "1 fraction NO_SHOW on 2026-08-06 (bills NO_SHOW_FEE 5000)"
            - "Incurred lines total 65000+50000+210000+96000+12000+5000 = 438000"
          setup_api_calls:
            - { call: "POST /oncology/patients", payload: { mrn: "MRN-BILL-1", full_name: "Bill Case", date_of_birth: "1960-05-01" }, as: Scheduler, captures: { pat: $.data.id } }
            - { call: "POST /oncology/patients/${pat}/treatment-courses", payload: { diagnosis_code: "C50", intent: "CURATIVE", technique: "IMRT", prescribed_total_dose_cGy: 5000, planned_fractions: 5 }, as: RadiationOncologist, as_user_id: "onc_a", captures: { crs: $.data.id } }
            - { call: "POST /oncology/machines", payload: { name: "CT-Sim-2", machine_type: "CT_SIMULATOR", room: "SIM1" }, as: SystemAdmin, captures: { sim_m: $.data.id } }
            - { call: "POST /oncology/machines", payload: { name: "Linac-2", machine_type: "LINAC", room: "TX2" }, as: SystemAdmin, captures: { lin_m: $.data.id } }
            - { call: "POST /oncology/treatment-courses/${crs}/simulation-appointments", payload: { machine_id: "${sim_m}", start_time: "2026-07-29T09:00:00Z", end_time: "2026-07-29T09:30:00Z", immobilization_device: "VACUUM_CRADLE" }, as: Scheduler, captures: { sim_a: $.data.id } }
            - { call: "POST /oncology/simulation-appointments/${sim_a}/complete", payload: { patient_weight_kg: 70.0 }, as: RadiationTherapist, as_user_id: "rtt_a" }
            - { call: "POST /oncology/treatment-courses/${crs}/contour-sets", payload: { set_label: "CT1", target_volumes: ["PTV"], oar_structures: [] }, as: RadiationOncologist, as_user_id: "onc_a", captures: { cs: $.data.id } }
            - { call: "POST /oncology/contour-sets/${cs}/submit", payload: {}, as: RadiationOncologist, as_user_id: "onc_a" }
            - { call: "POST /oncology/contour-sets/${cs}/approve", payload: {}, as: RadiationOncologist, as_user_id: "onc_b" }
            - { call: "GET /oncology/treatment-courses/${crs}", payload: {}, as: RadiationOncologist, as_user_id: "onc_a", captures: { crs_v: $.data.version } }
            - { call: "POST /oncology/treatment-courses/${crs}/treatment-plans", payload: { contour_set_id: "${cs}", target_total_dose_cGy: 5000, planned_fractions: 5, expected_course_version: "${crs_v}" }, as: MedicalDosimetrist, as_user_id: "dos_a", captures: { pl: $.data.id } }
            - { call: "POST /oncology/treatment-plans/${pl}/dose-constraints", payload: { structure_name: "Heart", constraint_type: "MEAN_DOSE", limit_cGy: 2600, evaluated_value_cGy: 2000 }, as: MedicalDosimetrist, as_user_id: "dos_a" }
            - { call: "POST /oncology/treatment-plans/${pl}/submit-for-check", payload: {}, as: MedicalDosimetrist, as_user_id: "dos_a" }
            - { call: "POST /oncology/treatment-plans/${pl}/physics-checks", payload: { check_type: "PRIMARY", outcome: "PASS" }, as: MedicalPhysicist, as_user_id: "phys_a" }
            - { call: "POST /oncology/treatment-plans/${pl}/physics-checks", payload: { check_type: "SECOND", outcome: "PASS" }, as: MedicalPhysicist, as_user_id: "phys_b" }
            - { call: "POST /oncology/treatment-courses/${crs}/billing-claims", payload: {}, as: BillingCoordinator, as_user_id: "bill_a", captures: { clm: $.data.id } }
            - { call: "POST /oncology/treatment-courses/${crs}/fraction-sessions", payload: { plan_id: "${pl}", machine_id: "${lin_m}", start_time: "2026-08-03T09:00:00Z", end_time: "2026-08-03T09:20:00Z" }, as: Scheduler, captures: { f1: $.data.id } }
            - { call: "POST /oncology/treatment-courses/${crs}/fraction-sessions", payload: { plan_id: "${pl}", machine_id: "${lin_m}", start_time: "2026-08-04T09:00:00Z", end_time: "2026-08-04T09:20:00Z" }, as: Scheduler, captures: { f2: $.data.id } }
            - { call: "POST /oncology/treatment-courses/${crs}/fraction-sessions", payload: { plan_id: "${pl}", machine_id: "${lin_m}", start_time: "2026-08-05T09:00:00Z", end_time: "2026-08-05T09:20:00Z" }, as: Scheduler, captures: { f3: $.data.id } }
            - { call: "POST /oncology/treatment-courses/${crs}/fraction-sessions", payload: { plan_id: "${pl}", machine_id: "${lin_m}", start_time: "2026-08-06T09:00:00Z", end_time: "2026-08-06T09:20:00Z" }, as: Scheduler, captures: { f4: $.data.id } }
            - { call: "POST /oncology/fraction-sessions/${f1}/deliver", payload: {}, as: RadiationTherapist, as_user_id: "rtt_a" }
            - { call: "POST /oncology/fraction-sessions/${f2}/deliver", payload: {}, as: RadiationTherapist, as_user_id: "rtt_a" }
            - { call: "POST /oncology/fraction-sessions/${f3}/deliver", payload: {}, as: RadiationTherapist, as_user_id: "rtt_a" }
            - { call: "POST /oncology/fraction-sessions/${f4}/mark-no-show", payload: {}, as: RadiationTherapist, as_user_id: "rtt_a" }
            - { call: "GET /oncology/billing-claims/${clm}", payload: {}, as: BillingCoordinator, as_user_id: "bill_a", captures: { cl_v: $.data.version, prov_seen: $.data.provisional_total_cents } }
            - { call: "POST /oncology/billing-claims/${clm}/finalize", payload: { expected_claim_version: "${cl_v}" }, as: BillingCoordinator, as_user_id: "bill_a" }
          trigger:
            - { call: "GET /oncology/billing-claims/${clm}", payload: {}, as: BillingCoordinator, as_user_id: "bill_a" }
          assert:
            - "provisional captured before finalize == 502000 (438000 incurred + (5-3) x 32000 projected)"
            - "BillingClaim.${clm}.gross_total_cents == 438000"
            - "BillingClaim.${clm}.discount_cents == 0  (438000 <= 1500000 tier threshold)"
            - "BillingClaim.${clm}.final_total_cents == 438000"
            - "BillingClaim.${clm}.status == FINALIZED"
  # ===================================================================
  # Rule 2 — combinatorial_formula (three different modes a/b/c)
  # ===================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: planning_charge_technique_target_count_interaction
        grounds:
          - calculations.planning_charge
          - entities.ChargeLine.fields.amount_cents
        distinguishing_aspect: |
          Mode (a) — a >= 3-input formula with non-linear interaction: the PLANNING charge combines
          the technique tier base (SBRT 300000), a per-extra-target multiplier (1 + 0.25*(t-1)),
          and a conditional branch on plan type (initial vs adaptation); with technique=SBRT and
          3 target volumes the multiplier is 1.5 and the initial-plan line is 450000.
        test_recipe:
          setup:
            - "SBRT course prescribed_total_dose_cGy 3000, planned_fractions 5; immobilization BODY_FRAME satisfies the SBRT rule"
            - "Contour set with target_volumes [PTV1, PTV2, PTV3] approved"
            - "Plan created, 1 satisfied constraint, submitted; both physics checks PASS -> PLANNING line appended"
          setup_api_calls:
            - { call: "POST /oncology/patients", payload: { mrn: "MRN-COMB-A", full_name: "Comb Ay", date_of_birth: "1955-01-01" }, as: Scheduler, captures: { pat: $.data.id } }
            - { call: "POST /oncology/patients/${pat}/treatment-courses", payload: { diagnosis_code: "C34", intent: "CURATIVE", technique: "SBRT", prescribed_total_dose_cGy: 3000, planned_fractions: 5 }, as: RadiationOncologist, as_user_id: "onc_a", captures: { crs: $.data.id } }
            - { call: "POST /oncology/machines", payload: { name: "CT-Sim-A", machine_type: "CT_SIMULATOR", room: "SIM1" }, as: SystemAdmin, captures: { sim_m: $.data.id } }
            - { call: "POST /oncology/treatment-courses/${crs}/simulation-appointments", payload: { machine_id: "${sim_m}", start_time: "2026-07-28T09:00:00Z", end_time: "2026-07-28T09:30:00Z", immobilization_device: "BODY_FRAME" }, as: Scheduler, captures: { sim_a: $.data.id } }
            - { call: "POST /oncology/simulation-appointments/${sim_a}/complete", payload: { patient_weight_kg: 90.0 }, as: RadiationTherapist, as_user_id: "rtt_a" }
            - { call: "POST /oncology/treatment-courses/${crs}/contour-sets", payload: { set_label: "CT1", target_volumes: ["PTV1", "PTV2", "PTV3"], oar_structures: ["LungL"] }, as: RadiationOncologist, as_user_id: "onc_a", captures: { cs: $.data.id } }
            - { call: "POST /oncology/contour-sets/${cs}/submit", payload: {}, as: RadiationOncologist, as_user_id: "onc_a" }
            - { call: "POST /oncology/contour-sets/${cs}/approve", payload: {}, as: RadiationOncologist, as_user_id: "onc_b" }
            - { call: "GET /oncology/treatment-courses/${crs}", payload: {}, as: RadiationOncologist, as_user_id: "onc_a", captures: { crs_v: $.data.version } }
            - { call: "POST /oncology/treatment-courses/${crs}/treatment-plans", payload: { contour_set_id: "${cs}", target_total_dose_cGy: 3000, planned_fractions: 5, expected_course_version: "${crs_v}" }, as: MedicalDosimetrist, as_user_id: "dos_a", captures: { pl: $.data.id } }
            - { call: "POST /oncology/treatment-plans/${pl}/dose-constraints", payload: { structure_name: "LungL", constraint_type: "MAX_DOSE", limit_cGy: 1800, evaluated_value_cGy: 1500 }, as: MedicalDosimetrist, as_user_id: "dos_a" }
            - { call: "POST /oncology/treatment-plans/${pl}/submit-for-check", payload: {}, as: MedicalDosimetrist, as_user_id: "dos_a" }
            - { call: "POST /oncology/treatment-plans/${pl}/physics-checks", payload: { check_type: "PRIMARY", outcome: "PASS" }, as: MedicalPhysicist, as_user_id: "phys_a" }
            - { call: "POST /oncology/treatment-courses/${crs}/billing-claims", payload: {}, as: BillingCoordinator, as_user_id: "bill_a", captures: { clm: $.data.id } }
            - { call: "POST /oncology/treatment-plans/${pl}/physics-checks", payload: { check_type: "SECOND", outcome: "PASS" }, as: MedicalPhysicist, as_user_id: "phys_b" }
          trigger:
            - { call: "GET /oncology/billing-claims/${clm}/charge-lines", payload: {}, as: BillingCoordinator, as_user_id: "bill_a" }
          assert:
            - "exactly one ChargeLine with code PLANNING exists on claim ${clm} and its amount_cents == 450000 (round_half_up(300000 * (1 + 0.25 * 2)))"
            - "claim ${clm} also holds SIMULATION 65000 and two PHYSICS_CHECK 25000 lines; gross_total_cents == 565000"

      - name: fraction_dose_allocation_remainder_on_last
        grounds:
          - calculations.fraction_dose_allocation
          - entities.FractionSession.fields.dose_delivered_cGy
        distinguishing_aspect: |
          Mode (b) — nested rounding where order matters: 5005 cGy over 4 fractions must round each
          non-final fraction FIRST (round_half_up(5005/4) = 1251) and reconcile the remainder on the
          LAST fraction (1252); an implementation that sums then rounds (5005/4*4 = 5005 flat) or
          truncates (1250*4 + 5) produces different per-fraction doses.
        test_recipe:
          setup:
            - "THREE_DCRT course prescribed_total_dose_cGy 5005, planned_fractions 4 -> dose_per_fraction_cGy 1251"
            - "Plan approved; 4 fractions booked on consecutive weekdays 2026-08-03..06 and delivered"
          setup_api_calls:
            - { call: "POST /oncology/patients", payload: { mrn: "MRN-COMB-B", full_name: "Comb Bee", date_of_birth: "1962-03-03" }, as: Scheduler, captures: { pat: $.data.id } }
            - { call: "POST /oncology/patients/${pat}/treatment-courses", payload: { diagnosis_code: "C18", intent: "PALLIATIVE", technique: "THREE_DCRT", prescribed_total_dose_cGy: 5005, planned_fractions: 4 }, as: RadiationOncologist, as_user_id: "onc_a", captures: { crs: $.data.id } }
            - { call: "POST /oncology/machines", payload: { name: "CT-Sim-B", machine_type: "CT_SIMULATOR", room: "SIM1" }, as: SystemAdmin, captures: { sim_m: $.data.id } }
            - { call: "POST /oncology/machines", payload: { name: "Linac-B", machine_type: "LINAC", room: "TX1" }, as: SystemAdmin, captures: { lin_m: $.data.id } }
            - { call: "POST /oncology/treatment-courses/${crs}/simulation-appointments", payload: { machine_id: "${sim_m}", start_time: "2026-07-28T10:00:00Z", end_time: "2026-07-28T10:30:00Z", immobilization_device: "NONE" }, as: Scheduler, captures: { sim_a: $.data.id } }
            - { call: "POST /oncology/simulation-appointments/${sim_a}/complete", payload: { patient_weight_kg: 65.0 }, as: RadiationTherapist, as_user_id: "rtt_a" }
            - { call: "POST /oncology/treatment-courses/${crs}/contour-sets", payload: { set_label: "CT1", target_volumes: ["PTV"], oar_structures: ["Rectum"] }, as: RadiationOncologist, as_user_id: "onc_a", captures: { cs: $.data.id } }
            - { call: "POST /oncology/contour-sets/${cs}/submit", payload: {}, as: RadiationOncologist, as_user_id: "onc_a" }
            - { call: "POST /oncology/contour-sets/${cs}/approve", payload: {}, as: RadiationOncologist, as_user_id: "onc_b" }
            - { call: "GET /oncology/treatment-courses/${crs}", payload: {}, as: RadiationOncologist, as_user_id: "onc_a", captures: { crs_v: $.data.version } }
