# =============================================================================
# §1.9 Scaffold Corner Design — Coverage Index for Non-Difficulty Tests
# Task 1698: office furniture dealer & space planning
# =============================================================================
scaffold_corner_design:
  # ======================================================== entities
  - section: entities
    instances:
      - name: create_dealership_applies_defaults
        claim_type: defaults
        grounds: ["entities.Dealership.fields.after_hours_start_minute", "entities.Dealership.fields.turnover_buffer_minutes", "entities.Dealership.fields.credit_cap_pct"]
        distinguishing_aspect: "Omitting all optional config yields the pinned defaults: 1080 / 15000 / 30 / 25."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /api/dealerships"
              payload: { name: "DLR", staging_capacity_units: 100, standard_labor_rate_cents_per_hour: 10000 }
              as: DealerAdmin
              captures: { ah: $.data.after_hours_start_minute, bp: $.data.after_hours_multiplier_bp, buf: $.data.turnover_buffer_minutes, cap: $.data.credit_cap_pct }
          assert:
            - "captured ah == 1080 and bp == 15000 and buf == 30 and cap == 25"

      - name: create_customer_missing_required_field_rejected
        claim_type: required_fields
        grounds: ["entities.Customer.fields.external_ref", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /api/customers without external_ref is rejected with ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["dealership exists"]
          setup_api_calls:
            - call: "POST /api/dealerships"
              payload: { name: "DLR", staging_capacity_units: 100, standard_labor_rate_cents_per_hour: 10000 }
              as: DealerAdmin
              captures: { d_id: $.data.id }
          trigger:
            - call: "POST /api/customers"
              payload: { dealership_id: "${d_id}", name: "Acme Corp" }
              as: AccountExecutive
              captures: { err: $.data.error_id }
          assert:
            - "captured err == 'ERR_INVALID_REQUEST'"

      - name: customer_computed_field_input_ignored
        claim_type: computed_fields
        grounds: ["entities.Customer.fields.liquidation_credit_balance_cents"]
        distinguishing_aspect: "Client-supplied liquidation_credit_balance_cents on create is ignored; the computed ledger reads 0."
        test_recipe:
          setup: ["dealership exists"]
          setup_api_calls:
            - call: "POST /api/dealerships"
              payload: { name: "DLR", staging_capacity_units: 100, standard_labor_rate_cents_per_hour: 10000 }
              as: DealerAdmin
              captures: { d_id: $.data.id }
          trigger:
            - call: "POST /api/customers"
              payload: { dealership_id: "${d_id}", name: "Acme Corp", external_ref: "ACME-1", liquidation_credit_balance_cents: 999999 }
              as: AccountExecutive
              captures: { bal: $.data.liquidation_credit_balance_cents }
          assert:
            - "captured bal == 0 (input ignored; computed field starts at 0)"

      - name: get_nonexistent_customer_returns_404
        claim_type: not_found
        grounds: ["errors[ERR_NOT_FOUND]", "validations[priority=3]"]
        distinguishing_aspect: "GET with a well-formed but absent UUID returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /api/customers/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              payload: {}
              as: AccountExecutive
              captures: { err: $.data.error_id }
          assert:
            - "captured err == 'ERR_NOT_FOUND'"

      - name: customer_list_pagination_envelope
        claim_type: listing
        grounds: ["response_envelope"]
        distinguishing_aspect: "List responses carry the fixed pagination fields; limit=2 over 3 rows yields has_more true then false with offset 2."
        test_recipe:
          setup: ["dealership with 3 customers"]
          setup_api_calls:
            - call: "POST /api/dealerships"
              payload: { name: "DLR", staging_capacity_units: 100, standard_labor_rate_cents_per_hour: 10000 }
              as: DealerAdmin
              captures: { d_id: $.data.id }
            - call: "POST /api/customers"
              payload: { dealership_id: "${d_id}", name: "C1", external_ref: "R1" }
              as: AccountExecutive
            - call: "POST /api/customers"
              payload: { dealership_id: "${d_id}", name: "C2", external_ref: "R2" }
              as: AccountExecutive
            - call: "POST /api/customers"
              payload: { dealership_id: "${d_id}", name: "C3", external_ref: "R3" }
              as: AccountExecutive
          trigger:
            - call: "GET /api/customers?dealership_id=${d_id}&limit=2&offset=0"
              payload: {}
              as: AccountExecutive
          assert:
            - "page 1 returns 2 items with total_count == 3 and has_more == true"
            - "GET with limit=2&offset=2 returns 1 item with total_count == 3 and has_more == false"

      - name: invalid_enum_on_contract_create_rejected
        claim_type: type_constraints
        grounds: ["entities.PricingContract.fields.contract_type", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "contract_type 'FEDERAL' is outside STATE|COOP|NEGOTIATED and is rejected with ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["dealership + customer exist"]
          setup_api_calls:
            - call: "POST /api/dealerships"
              payload: { name: "DLR", staging_capacity_units: 100, standard_labor_rate_cents_per_hour: 10000 }
              as: DealerAdmin
              captures: { d_id: $.data.id }
            - call: "POST /api/customers"
              payload: { dealership_id: "${d_id}", name: "Acme Corp", external_ref: "ACME-1" }
              as: AccountExecutive
              captures: { c_id: $.data.id }
          trigger:
            - call: "POST /api/pricing-contracts"
              payload: { customer_id: "${c_id}", contract_type: "FEDERAL", pricing_tiers: [], default_discount_pct: 30, effective_from: "2026-08-01", effective_to: "2026-12-31" }
              as: AccountExecutive
              captures: { err: $.data.error_id }
          assert:
            - "captured err == 'ERR_INVALID_REQUEST'"

      - name: typical_extended_budget_and_plan_rollup
        claim_type: computed_fields
        grounds: ["entities.Typical.fields.extended_budget_cents", "entities.SpacePlan.fields.budget_cents"]
        distinguishing_aspect: "Typical extension (4 x 250000) and plan rollup are computed: extended_budget_cents == 1000000, plan.budget_cents == 1000000."
        test_recipe:
          setup: ["dealership, customer, DRAFT plan"]
          setup_api_calls:
            - call: "POST /api/dealerships"
              payload: { name: "DLR", staging_capacity_units: 100, standard_labor_rate_cents_per_hour: 10000 }
              as: DealerAdmin
              captures: { d_id: $.data.id }
            - call: "POST /api/customers"
              payload: { dealership_id: "${d_id}", name: "Acme Corp", external_ref: "ACME-1" }
              as: AccountExecutive
              captures: { c_id: $.data.id }
            - call: "POST /api/space-plans"
              payload: { customer_id: "${c_id}", name: "HQ" }
              as: Designer
              captures: { p_id: $.data.id }
          trigger:
            - call: "POST /api/typicals"
              payload: { space_plan_id: "${p_id}", code: "WS-A", quantity: 4, target_budget_cents_per_instance: 250000 }
              as: Designer
              captures: { ext: $.data.extended_budget_cents }
            - call: "GET /api/space-plans/${p_id}"
              payload: {}
              as: Designer
              captures: { budget: $.data.budget_cents }
          assert:
            - "captured ext == 1000000"
            - "captured budget == 1000000"

      - name: asset_tag_initial_status_from_source
        claim_type: creation
        grounds: ["entities.AssetTag.fields.status", "state_machines.AssetTag"]
        distinguishing_aspect: "source PURCHASED starts IN_SERVICE; source TRADED_IN starts IN_STORAGE."
        test_recipe:
          setup: ["dealership + customer exist"]
          setup_api_calls:
            - call: "POST /api/dealerships"
              payload: { name: "DLR", staging_capacity_units: 100, standard_labor_rate_cents_per_hour: 10000 }
              as: DealerAdmin
              captures: { d_id: $.data.id }
            - call: "POST /api/customers"
              payload: { dealership_id: "${d_id}", name: "Acme Corp", external_ref: "ACME-1" }
              as: AccountExecutive
              captures: { c_id: $.data.id }
          trigger:
            - call: "POST /api/asset-tags"
              payload: { customer_id: "${c_id}", description: "Task chair", condition: "GOOD", current_location: "Floor 3", source: "PURCHASED" }
              as: AccountExecutive
              captures: { a1: $.data.status }
            - call: "POST /api/asset-tags"
              payload: { customer_id: "${c_id}", description: "Used credenza", condition: "FAIR", current_location: "Warehouse", source: "TRADED_IN" }
              as: AccountExecutive
              captures: { a2: $.data.status }
          assert:
            - "captured a1 == 'IN_SERVICE' and captured a2 == 'IN_STORAGE'"

      - name: duplicate_series_code_rejected
        claim_type: type_constraints
        grounds: ["errors[ERR_DUPLICATE_REFERENCE]", "validations[priority=8]"]
        distinguishing_aspect: "Second series with the same series_code in the same dealership fails with ERR_DUPLICATE_REFERENCE."
        test_recipe:
          setup: ["dealership with one series SC-ANS"]
          setup_api_calls:
            - call: "POST /api/dealerships"
              payload: { name: "DLR", staging_capacity_units: 100, standard_labor_rate_cents_per_hour: 10000 }
              as: DealerAdmin
              captures: { d_id: $.data.id }
            - call: "POST /api/product-series"
              payload: { dealership_id: "${d_id}", manufacturer: "STEELCASE", category: "SEATING", series_code: "SC-ANS", base_list_price_cents: 100000, base_lead_time_days: 30, option_catalog: [] }
              as: DealerAdmin
          trigger:
            - call: "POST /api/product-series"
              payload: { dealership_id: "${d_id}", manufacturer: "MILLERKNOLL", category: "TABLES", series_code: "SC-ANS", base_list_price_cents: 50000, base_lead_time_days: 10, option_catalog: [] }
              as: DealerAdmin
              captures: { err: $.data.error_id }
          assert:
            - "captured err == 'ERR_DUPLICATE_REFERENCE'"

      - name: duplicate_customer_external_ref_rejected
        claim_type: type_constraints
        grounds: ["errors[ERR_DUPLICATE_REFERENCE]", "entities.Customer.fields.external_ref"]
        distinguishing_aspect: "external_ref is unique per dealership; second use fails with ERR_DUPLICATE_REFERENCE."
        test_recipe:
          setup: ["dealership with customer ACME-1"]
          setup_api_calls:
            - call: "POST /api/dealerships"
              payload: { name: "DLR", staging_capacity_units: 100, standard_labor_rate_cents_per_hour: 10000 }
              as: DealerAdmin
              captures: { d_id: $.data.id }
            - call: "POST /api/customers"
              payload: { dealership_id: "${d_id}", name: "Acme Corp", external_ref: "ACME-1" }
              as: AccountExecutive
          trigger:
            - call: "POST /api/customers"
              payload: { dealership_id: "${d_id}", name: "Acme Subsidiary", external_ref: "ACME-1" }
              as: AccountExecutive
              captures: { err: $.data.error_id }
          assert:
            - "captured err == 'ERR_DUPLICATE_REFERENCE'"

      - name: typical_patch_rejected_when_plan_approved
        claim_type: parent_relationships
        grounds: ["state_machines.SpacePlan", "endpoints.PATCH_typical"]
        distinguishing_aspect: "Typicals are editable only while the plan is DRAFT or IN_REVISION; PATCH against an APPROVED plan fails with ERR_INVALID_STATE."
        test_recipe:
          setup: ["plan APPROVED with one typical"]
          setup_api_calls:
            - call: "POST /api/dealerships"
              payload: { name: "DLR", staging_capacity_units: 100, standard_labor_rate_cents_per_hour: 10000 }
              as: DealerAdmin
              captures: { d_id: $.data.id }
            - call: "POST /api/customers"
              payload: { dealership_id: "${d_id}", name: "Acme Corp", external_ref: "ACME-1" }
              as: AccountExecutive
              captures: { c_id: $.data.id }
            - call: "POST /api/space-plans"
              payload: { customer_id: "${c_id}", name: "HQ" }
              as: Designer
              captures: { p_id: $.data.id }
            - call: "POST /api/typicals"
              payload: { space_plan_id: "${p_id}", code: "WS-A", quantity: 4, target_budget_cents_per_instance: 250000 }
              as: Designer
              captures: { t_id: $.data.id }
            - call: "POST /api/space-plans/${p_id}/submit"
              payload: {}
              as: Designer
            - call: "POST /api/space-plans/${p_id}/approve"
              payload: {}
              as: ClientApprover
          trigger:
            - call: "PATCH /api/typicals/${t_id}"
              payload: { quantity: 6 }
              as: Designer
              captures: { err: $.data.error_id }
          assert:
            - "captured err == 'ERR_INVALID_STATE'"

      - name: order_created_with_initial_state
        claim_type: system_fields
        grounds: ["state_machines.ProjectOrder", "calculations.order_install_posture"]
        distinguishing_aspect: "A new order starts DRAFT with install_posture NOT_SCHEDULED, version 1, server-minted UUID id."
        test_recipe:
          setup: ["dealership, customer, contract, approved plan"]
          setup_api_calls:
            - call: "POST /api/dealerships"
              payload: { name: "DLR", staging_capacity_units: 100, standard_labor_rate_cents_per_hour: 10000 }
              as: DealerAdmin
              captures: { d_id: $.data.id }
            - call: "POST /api/customers"
              payload: { dealership_id: "${d_id}", name: "Acme Corp", external_ref: "ACME-1" }
              as: AccountExecutive
              captures: { c_id: $.data.id }
            - call: "POST /api/pricing-contracts"
              payload: { customer_id: "${c_id}", contract_type: "STATE", pricing_tiers: [], default_discount_pct: 30, effective_from: "2026-08-01", effective_to: "2026-12-31" }
              as: AccountExecutive
              as_user_id: "ae-1"
              captures: { k_id: $.data.id }
            - call: "POST /api/space-plans"
              payload: { customer_id: "${c_id}", name: "HQ" }
              as: Designer
              captures: { p_id: $.data.id }
            - call: "POST /api/typicals"
              payload: { space_plan_id: "${p_id}", code: "WS-A", quantity: 4, target_budget_cents_per_instance: 250000 }
              as: Designer
          trigger:
            - call: "POST /api/project-orders"
              payload: { customer_id: "${c_id}", contract_id: "${k_id}", space_plan_id: "${p_id}" }
              as: AccountExecutive
              captures: { st: $.data.status, post: $.data.install_posture, ver: $.data.version }
          assert:
            - "captured st == 'DRAFT' and post == 'NOT_SCHEDULED' and ver == 1"

  # ======================================================== state_machines
  - section: state_machines
    instances:
      - name: contract_double_activate_rejected
        claim_type: idempotency
        grounds: ["state_machines.PricingContract.DRAFT_to_ACTIVE", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Activating an already-ACTIVE contract fails with ERR_INVALID_STATE; the transition is not idempotent."
        test_recipe:
          setup: ["ACTIVE contract"]
          setup_api_calls:
            - call: "POST /api/dealerships"
              payload: { name: "DLR", staging_capacity_units: 100, standard_labor_rate_cents_per_hour: 10000 }
              as: DealerAdmin
              captures: { d_id: $.data.id }
            - call: "POST /api/customers"
              payload: { dealership_id: "${d_id}", name: "Acme Corp", external_ref: "ACME-1" }
              as: AccountExecutive
              captures: { c_id: $.data.id }
            - call: "POST /api/pricing-contracts"
              payload: { customer_id: "${c_id}", contract_type: "STATE", pricing_tiers: [], default_discount_pct: 30, effective_from: "2026-08-01", effective_to: "2026-12-31" }
              as: AccountExecutive
              as_user_id: "ae-1"
              captures: { k_id: $.data.id }
            - call: "POST /api/pricing-contracts/${k_id}/activate"
              payload: {}
              as: ContractsOfficer
              as_user_id: "co-1"
          trigger:
            - call: "POST /api/pricing-contracts/${k_id}/activate"
              payload: {}
              as: ContractsOfficer
              as_user_id: "co-2"
              captures: { err: $.data.error_id }
          assert:
            - "captured err == 'ERR_INVALID_STATE'"

      - name: order_revise_clears_pins_and_reopens_lines
        claim_type: side_effect_execution
        grounds: ["state_machines.ProjectOrder.SUBMITTED_to_DRAFT", "state_machines.OrderLine.PLACED_to_OPEN"]
        distinguishing_aspect: "Revise returns the order to DRAFT, clears both pinned versions, and moves PLACED lines back to OPEN."
        test_recipe:
          setup: ["order SUBMITTED with one line"]
          setup_api_calls:
            - call: "POST /api/dealerships"
              payload: { name: "DLR", staging_capacity_units: 100, standard_labor_rate_cents_per_hour: 10000 }
              as: DealerAdmin
              captures: { d_id: $.data.id }
            - call: "POST /api/customers"
              payload: { dealership_id: "${d_id}", name: "Acme Corp", external_ref: "ACME-1" }
              as: AccountExecutive
              captures: { c_id: $.data.id }
            - call: "POST /api/pricing-contracts"
              payload: { customer_id: "${c_id}", contract_type: "STATE", pricing_tiers: [ { category: "SEATING", min_qty: 1, discount_pct: 40 } ], default_discount_pct: 30, effective_from: "2026-08-01", effective_to: "2026-12-31" }
              as: AccountExecutive
              as_user_id: "ae-1"
              captures: { k_id: $.data.id }
            - call: "POST /api/pricing-contracts/${k_id}/activate"
              payload: {}
              as: ContractsOfficer
              as_user_id: "co-1"
            - call: "POST /api/space-plans"
              payload: { customer_id: "${c_id}", name: "HQ" }
              as: Designer
              captures: { p_id: $.data.id }
            - call: "POST /api/typicals"
              payload: { space_plan_id: "${p_id}", code: "WS-A", quantity: 4, target_budget_cents_per_instance: 250000 }
              as: Designer
            - call: "POST /api/space-plans/${p_id}/submit"
              payload: {}
              as: Designer
            - call: "POST /api/space-plans/${p_id}/approve"
              payload: {}
              as: ClientApprover
            - call: "POST /api/product-series"
              payload: { dealership_id: "${d_id}", manufacturer: "STEELCASE", category: "SEATING", series_code: "SC-ANS", base_list_price_cents: 100000, base_lead_time_days: 30, option_catalog: [] }
              as: DealerAdmin
              captures: { s_id: $.data.id }
            - call: "POST /api/project-orders"
              payload: { customer_id: "${c_id}", contract_id: "${k_id}", space_plan_id: "${p_id}" }
              as: AccountExecutive
              captures: { o_id: $.data.id }
            - call: "POST /api/order-lines"
              payload: { order_id: "${o_id}", series_id: "${s_id}", quantity: 2, selected_options: [] }
              as: AccountExecutive
              captures: { l_id: $.data.id, l_st0: $.data.status }
            - call: "POST /api/project-orders/${o_id}/submit"
              payload: {}
              as: AccountExecutive
              captures: { pin_k: $.data.pinned_contract_version, pin_p: $.data.pinned_plan_version }
          trigger:
            - call: "POST /api/project-orders/${o_id}/revise"
              payload: {}
              as: AccountExecutive
              captures: { o_st: $.data.status, pin_k2: $.data.pinned_contract_version, pin_p2: $.data.pinned_plan_version }
            - call: "GET /api/order-lines/${l_id}"
              payload: {}
              as: AccountExecutive
              captures: { l_st: $.data.status }
          assert:
            - "captured pin_k and pin_p were non-null after submit"
            - "captured o_st == 'DRAFT' and pin_k2 == null and pin_p2 == null"
            - "captured l_st0 == 'OPEN', line became PLACED at submit, and captured l_st == 'OPEN' again after revise"

      - name: terminal_claim_denied_lockdown
        claim_type: terminal_state_lockdown
        grounds: ["state_machines.ManufacturerClaim", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "From terminal DENIED, no further transition exists: offer_settlement and withdraw both fail with ERR_INVALID_STATE."
        test_recipe:
          setup: ["claim in ACKNOWLEDGED, then denied"]
          setup_api_calls:
            - call: "POST /api/dealerships"
              payload: { name: "DLR", staging_capacity_units: 100, standard_labor_rate_cents_per_hour: 10000 }
              as: DealerAdmin
              captures: { d_id: $.data.id }
            - call: "POST /api/customers"
              payload: { dealership_id: "${d_id}", name: "Acme Corp", external_ref: "ACME-1" }
              as: AccountExecutive
              captures: { c_id: $.data.id }
            - call: "POST /api/pricing-contracts"
              payload: { customer_id: "${c_id}", contract_type: "STATE", pricing_tiers: [ { category: "SEATING", min_qty: 1, discount_pct: 40 } ], default_discount_pct: 30, effective_from: "2026-08-01", effective_to: "2026-12-31" }
              as: AccountExecutive
              as_user_id: "ae-1"
              captures: { k_id: $.data.id }
            - call: "POST /api/pricing-contracts/${k_id}/activate"
              payload: {}
              as: ContractsOfficer
              as_user_id: "co-1"
            - call: "POST /api/space-plans"
              payload: { customer_id: "${c_id}", name: "HQ" }
              as: Designer
              captures: { p_id: $.data.id }
            - call: "POST /api/typicals"
              payload: { space_plan_id: "${p_id}", code: "WS-A", quantity: 4, target_budget_cents_per_instance: 250000 }
              as: Designer
            - call: "POST /api/space-plans/${p_id}/submit"
              payload: {}
              as: Designer
            - call: "POST /api/space-plans/${p_id}/approve"
              payload: {}
              as: ClientApprover
            - call: "POST /api/product-series"
              payload: { dealership_id: "${d_id}", manufacturer: "STEELCASE", category: "SEATING", series_code: "SC-ANS", base_list_price_cents: 100000, base_lead_time_days: 30, option_catalog: [] }
              as: DealerAdmin
              captures: { s_id: $.data.id }
            - call: "POST /api/project-orders"
              payload: { customer_id: "${c_id}", contract_id: "${k_id}", space_plan_id: "${p_id}" }
              as: AccountExecutive
              captures: { o_id: $.data.id }
            - call: "POST /api/order-lines"
              payload: { order_id: "${o_id}", series_id: "${s_id}", quantity: 2, selected_options: [] }
              as: AccountExecutive
              captures: { l_id: $.data.id }
            - call: "POST /api/project-orders/${o_id}/submit"
              payload: {}
              as: AccountExecutive
            - call: "POST /api/punch-items"
              payload: { order_id: "${o_id}", order_line_id: "${l_id}", severity: "STANDARD", description: "Scuff", affected_units: 1 }
              as: ProjectManager
              captures: { pu_id: $.data.id }
            - call: "POST /api/punch-items/${pu_id}/ready_for_verify"
              payload: {}
              as: ProjectManager
            - call: "POST /api/punch-items/${pu_id}/verify"
              payload: { passed: true }
              as: ClaimsCoordinator
            - call: "POST /api/manufacturer-claims"
              payload: { punch_item_id: "${pu_id}", claim_type: "DEFECT", remedy_requested: "REPAIR", claimed_amount_cents: 5000 }
              as: ClaimsCoordinator
              captures: { cl_id: $.data.id }
            - call: "POST /api/manufacturer-claims/${cl_id}/submit"
              payload: {}
              as: ClaimsCoordinator
            - call: "POST /api/manufacturer-claims/${cl_id}/acknowledge"
              payload: {}
              as: ManufacturerRep
            - call: "POST /api/manufacturer-claims/${cl_id}/deny"
              payload: {}
              as: ManufacturerRep
          trigger:
            - call: "POST /api/manufacturer-claims/${cl_id}/offer_settlement"
              payload: { settlement_amount_cents: 1000 }
              as: ManufacturerRep
              captures: { err1: $.data.error_id }
            - call: "POST /api/manufacturer-claims/${cl_id}/withdraw"
              payload: {}
