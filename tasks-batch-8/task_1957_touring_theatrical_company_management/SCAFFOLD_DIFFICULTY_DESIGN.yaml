# =============================================================================
# SCAFFOLD_DIFFICULTY_DESIGN.yaml — Task 1957 (§1.8 Test Targeting Index)
# 9 rules x 24 instances. All literals precomputed per contract item 7.
# =============================================================================
scaffold_difficulty_design:

  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: settlement_provisional_vs_final_payment
        grounds:
          - calculations.calc_provisional_settlement_estimate
          - calculations.calc_settlement_waterfall
          - entities.Stop.fields.estimated_venue_payment_cents
          - entities.Settlement.fields.venue_payment_cents
        distinguishing_aspect: |
          Same contract terms, two sanctioned algorithms on the Settlement/Stop fiscal
          domain: the provisional estimate at certify uses advance_sales_cents with no
          deductions (6,500,000 -> 4,550,000) while the final waterfall deducts taxes and
          levies from audited gross (5,500,000 adjusted -> 4,000,000); the two venue
          payments differ by 550,000 for identical guarantee/split.
        test_recipe:
          setup:
            - "Tour (budget 50,000,000), venue, stop with guarantee 4,000,000, split 70, advance_sales 6,500,000, play week 2026-09-07..2026-09-13, certified READY, one PLAYED performance, settlement figures audited 6,000,000 / taxes 300,000 / levies 200,000, submitted and approved"
          setup_api_calls:
            - call: "POST /tours"
              payload: { name: "Tour A", budget_total_cents: 50000000, capitalization_cents: 10000000, per_diem_policy: FULL_WEEK, per_diem_daily_cents: 20000, royalty_tier_threshold_cents: 1000000 }
              as: Producer
              captures: { tour_id: "$.data.id", tour_v: "$.data.version "}
            - call: "POST /venues"
              payload: { name: "Venue V", city: "Chicago", stage_width_ft: 44, fly_capacity_lines: 30, power_amps: 400, crew_available: 20 }
              as: Producer
              captures: { venue_id: "$.data.id "}
            - call: "POST /tours/${tour_id}/stops"
              payload: { venue_id: "${venue_id}", play_week_start: "2026-09-07", play_week_end: "2026-09-13", load_in_date: "2026-09-05", travel_in_days: 1, guarantee_cents: 4000000, split_pct: 70, advance_sales_cents: 6500000, expected_tour_version: "${tour_v}" }
              as: TourManager
              captures: { stop_id: "$.data.id "}
            - call: "PUT /stops/${stop_id}"
              payload: { status: CONTRACTED }
              as: Producer
            - call: "PUT /stops/${stop_id}"
              payload: { status: ADVANCED }
              as: TourManager
            - call: "POST /stops/${stop_id}/tech-checks"
              payload: { item: STAGE_WIDTH_FT, required_value: 40 }
              as: TourManager
              captures: { check_id: "$.data.id "}
            - call: "PUT /tech-checks/${check_id}"
              payload: { actual_value: 42 }
              as: TourManager
            - call: "PUT /stops/${stop_id}"
              payload: { status: READY }
              as: TourManager
              captures: { est_payment: "$.data.estimated_venue_payment_cents "}
            - call: "POST /stops/${stop_id}/performances"
              payload: { perf_date: "2026-09-08", curtain_time: "19:30", duration_minutes: 150 }
              as: TourManager
              captures: { perf_id: "$.data.id "}
            - call: "PUT /performances/${perf_id}"
              payload: { status: PLAYED, gross_cents: 750000 }
              as: Treasurer
            - call: "GET /stops/${stop_id}/settlement"
              as: Producer
              captures: { s_id: "$.data[0].id" }
            - call: "PUT /settlements/${s_id}"
              payload: { audited_gross_cents: 6000000, taxes_cents: 300000, levies_cents: 200000 }
              as: Treasurer
            - call: "PUT /settlements/${s_id}"
              payload: { status: SUBMITTED }
              as: Treasurer
              as_user_id: trs-1
            - call: "PUT /settlements/${s_id}"
              payload: { status: APPROVED }
              as: Producer
              as_user_id: prod-1
              captures: { final_vp: "$.data.venue_payment_cents", final_share: "$.data.producer_share_cents", final_adj: "$.data.adjusted_gross_cents "}
          trigger:
            - call: "GET /stops/${stop_id}"
              as: Producer
              captures: { stop_est_now: "$.data.estimated_venue_payment_cents "}
          assert:
            - "Stop.${stop_id}.estimated_venue_payment_cents == 4550000 (max(4000000, round(0.70 x 6500000)))"
            - "Settlement.${s_id}.adjusted_gross_cents == 5500000 (6000000 - 300000 - 200000)"
            - "Settlement.${s_id}.venue_payment_cents == 4000000 (max(4000000, round(0.70 x 5500000) = 3850000))"
            - "Settlement.${s_id}.producer_share_cents == 1500000"
            - "estimated_venue_payment_cents (4550000) != venue_payment_cents (4000000)"

      - name: per_diem_full_week_vs_actual_days
        grounds:
          - calculations.calc_per_diem
          - entities.PerDiemStatement.fields.total_cents
          - entities.Tour.fields.per_diem_policy
        distinguishing_aspect: |
          Cast-compensation domain (distinct from the settlement fiscal domain): the same
          days_present=5 / travel_days=2 / rate 20,000 costs 140,000 under FULL_WEEK but
          80,000 under ACTUAL_DAYS; the policy field, not the inputs, selects the variant.
        test_recipe:
          setup:
            - "Two tours identical except per_diem_policy (FULL_WEEK vs ACTUAL_DAYS), each with a READY stop and a CONTRACTED cast member; one per-diem statement per tour with days_present=5, travel_days=2"
          setup_api_calls:
            - call: "POST /tours"
              payload: { name: "Tour FW", budget_total_cents: 50000000, capitalization_cents: 10000000, per_diem_policy: FULL_WEEK, per_diem_daily_cents: 20000, royalty_tier_threshold_cents: 1000000 }
              as: Producer
              captures: { tour_fw: "$.data.id", tour_fw_v: "$.data.version "}
            - call: "POST /tours"
              payload: { name: "Tour AD", budget_total_cents: 50000000, capitalization_cents: 10000000, per_diem_policy: ACTUAL_DAYS, per_diem_daily_cents: 20000, royalty_tier_threshold_cents: 1000000 }
              as: Producer
              captures: { tour_ad: "$.data.id", tour_ad_v: "$.data.version "}
            - call: "POST /venues"
              payload: { name: "Venue V", city: "Chicago", stage_width_ft: 44, fly_capacity_lines: 30, power_amps: 400, crew_available: 20 }
              as: Producer
              captures: { venue_id: "$.data.id "}
            - call: "POST /tours/${tour_fw}/stops"
              payload: { venue_id: "${venue_id}", play_week_start: "2026-09-07", play_week_end: "2026-09-13", load_in_date: "2026-09-05", travel_in_days: 1, guarantee_cents: 1000000, split_pct: 70, expected_tour_version: "${tour_fw_v}" }
              as: TourManager
              captures: { stop_fw: "$.data.id "}
            - call: "POST /tours/${tour_ad}/stops"
              payload: { venue_id: "${venue_id}", play_week_start: "2026-09-07", play_week_end: "2026-09-13", load_in_date: "2026-09-05", travel_in_days: 1, guarantee_cents: 1000000, split_pct: 70, expected_tour_version: "${tour_ad_v}" }
              as: TourManager
              captures: { stop_ad: "$.data.id "}
            - call: "PUT /stops/${stop_fw}"
              payload: { status: CONTRACTED }
              as: Producer
            - call: "PUT /stops/${stop_ad}"
              payload: { status: CONTRACTED }
              as: Producer
            - call: "PUT /stops/${stop_fw}"
              payload: { status: ADVANCED }
              as: TourManager
            - call: "PUT /stops/${stop_ad}"
              payload: { status: ADVANCED }
              as: TourManager
            - call: "POST /stops/${stop_fw}/tech-checks"
              payload: { item: STAGE_WIDTH_FT, required_value: 40 }
              as: TourManager
              captures: { chk_fw: "$.data.id "}
            - call: "POST /stops/${stop_ad}/tech-checks"
              payload: { item: STAGE_WIDTH_FT, required_value: 40 }
              as: TourManager
              captures: { chk_ad: "$.data.id "}
            - call: "PUT /tech-checks/${chk_fw}"
              payload: { actual_value: 42 }
              as: TourManager
            - call: "PUT /tech-checks/${chk_ad}"
              payload: { actual_value: 42 }
              as: TourManager
            - call: "PUT /stops/${stop_fw}"
              payload: { status: READY }
              as: TourManager
            - call: "PUT /stops/${stop_ad}"
              payload: { status: READY }
              as: TourManager
            - call: "POST /tours/${tour_fw}/cast"
              payload: { name: "Pat Principal", contract_type: PRINCIPAL, weekly_salary_cents: 800000 }
              as: CompanyManager
              captures: { cm_fw: "$.data.id "}
            - call: "POST /tours/${tour_ad}/cast"
              payload: { name: "Alex Actor", contract_type: PRINCIPAL, weekly_salary_cents: 800000 }
              as: CompanyManager
              captures: { cm_ad: "$.data.id "}
            - call: "PUT /cast/${cm_fw}"
              payload: { status: CONTRACTED }
              as: CompanyManager
            - call: "PUT /cast/${cm_ad}"
              payload: { status: CONTRACTED }
              as: CompanyManager
          trigger:
            - call: "POST /stops/${stop_fw}/per-diems"
              payload: { cast_member_id: "${cm_fw}", days_present: 5, travel_days: 2 }
              as: CompanyManager
              captures: { pd_fw: "$.data.id", tot_fw: "$.data.total_cents "}
            - call: "POST /stops/${stop_ad}/per-diems"
              payload: { cast_member_id: "${cm_ad}", days_present: 5, travel_days: 2 }
              as: CompanyManager
              captures: { pd_ad: "$.data.id", tot_ad: "$.data.total_cents "}
          assert:
            - "PerDiemStatement.${pd_fw}.total_cents == 140000 (7 x 20000)"
            - "PerDiemStatement.${pd_ad}.total_cents == 80000 (3 x 20000 + 2 x 10000)"
            - "PerDiemStatement.${pd_fw}.policy_snapshot == FULL_WEEK and PerDiemStatement.${pd_ad}.policy_snapshot == ACTUAL_DAYS"

      - name: royalty_marginal_vs_flat_pinned
        grounds:
          - calculations.calc_licensor_royalty
          - entities.Settlement.fields.royalty_cents
        distinguishing_aspect: |
          The prose reading 'rates 600/900 bps with a threshold at T' admits a marginal and
          a flat reading; the scaffold pins marginal: share 1,500,000 with T=1,000,000 yields
          105,000 (60,000 + 45,000), NOT the flat reading 135,000 (0.09 x 1,500,000).
        test_recipe:
          setup:
            - "READY stop played and closed; settlement figures audited 6,000,000 / taxes 300,000 / levies 200,000 against guarantee 4,000,000 split 70 (share = 1,500,000); tour NOT recouped (capitalization 10,000,000)"
          setup_api_calls:
            - call: "POST /tours"
              payload: { name: "Tour A", budget_total_cents: 50000000, capitalization_cents: 10000000, per_diem_policy: FULL_WEEK, per_diem_daily_cents: 20000, royalty_tier_threshold_cents: 1000000 }
              as: Producer
              captures: { tour_id: "$.data.id", tour_v: "$.data.version "}
            - call: "POST /venues"
              payload: { name: "Venue V", city: "Chicago", stage_width_ft: 44, fly_capacity_lines: 30, power_amps: 400, crew_available: 20 }
              as: Producer
              captures: { venue_id: "$.data.id "}
            - call: "POST /tours/${tour_id}/stops"
              payload: { venue_id: "${venue_id}", play_week_start: "2026-09-07", play_week_end: "2026-09-13", load_in_date: "2026-09-05", travel_in_days: 1, guarantee_cents: 4000000, split_pct: 70, expected_tour_version: "${tour_v}" }
              as: TourManager
              captures: { stop_id: "$.data.id "}
            - call: "PUT /stops/${stop_id}"
              payload: { status: CONTRACTED }
              as: Producer
            - call: "PUT /stops/${stop_id}"
              payload: { status: ADVANCED }
              as: TourManager
            - call: "POST /stops/${stop_id}/tech-checks"
              payload: { item: STAGE_WIDTH_FT, required_value: 40 }
              as: TourManager
              captures: { check_id: "$.data.id "}
            - call: "PUT /tech-checks/${check_id}"
              payload: { actual_value: 42 }
              as: TourManager
            - call: "PUT /stops/${stop_id}"
              payload: { status: READY }
              as: TourManager
            - call: "POST /stops/${stop_id}/performances"
              payload: { perf_date: "2026-09-08", curtain_time: "19:30", duration_minutes: 150 }
              as: TourManager
              captures: { perf_id: "$.data.id "}
            - call: "PUT /performances/${perf_id}"
              payload: { status: PLAYED, gross_cents: 750000 }
              as: Treasurer
            - call: "GET /stops/${stop_id}/settlement"
              as: Producer
              captures: { s_id: "$.data[0].id" }
            - call: "PUT /settlements/${s_id}"
              payload: { audited_gross_cents: 6000000, taxes_cents: 300000, levies_cents: 200000 }
              as: Treasurer
            - call: "PUT /settlements/${s_id}"
              payload: { status: SUBMITTED }
              as: Treasurer
              as_user_id: trs-1
          trigger:
            - call: "PUT /settlements/${s_id}"
              payload: { status: APPROVED }
              as: Producer
              as_user_id: prod-1
              captures: { royalty: "$.data.royalty_cents "}
          assert:
            - "Settlement.${s_id}.royalty_cents == 105000 (marginal: 60000 + 45000)"
            - "Settlement.${s_id}.royalty_cents != 135000 (flat reading 0.09 x 1500000 is rejected)"

  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: royalty_tiered_min_max_branch_mode_a
        grounds:
          - calculations.calc_licensor_royalty
          - entities.Tour.fields.royalty_tier_threshold_cents
          - entities.Tour.fields.recouped
        distinguishing_aspect: |
          Mode (a): three inputs (producer_share, threshold T, recouped flag) interact
          non-linearly through nested min/max bracket slicing plus a boolean rate branch;
          share 1,500,000 at T 1,000,000 pre-recoup yields 105,000 via
          round(0.06 x min(share,T)) + round(0.09 x max(0, share - T)).
        test_recipe:
          setup:
            - "Closed stop with approved figures producing producer_share_cents == 1,500,000 (audited 6,000,000, taxes 300,000, levies 200,000, guarantee 4,000,000, split 70); tour capitalization 10,000,000 (not recouped)"
          setup_api_calls:
            - call: "POST /tours"
              payload: { name: "Tour A", budget_total_cents: 50000000, capitalization_cents: 10000000, per_diem_policy: FULL_WEEK, per_diem_daily_cents: 20000, royalty_tier_threshold_cents: 1000000 }
              as: Producer
              captures: { tour_id: "$.data.id", tour_v: "$.data.version "}
            - call: "POST /venues"
              payload: { name: "Venue V", city: "Chicago", stage_width_ft: 44, fly_capacity_lines: 30, power_amps: 400, crew_available: 20 }
              as: Producer
              captures: { venue_id: "$.data.id "}
            - call: "POST /tours/${tour_id}/stops"
              payload: { venue_id: "${venue_id}", play_week_start: "2026-09-07", play_week_end: "2026-09-13", load_in_date: "2026-09-05", travel_in_days: 1, guarantee_cents: 4000000, split_pct: 70, expected_tour_version: "${tour_v}" }
              as: TourManager
              captures: { stop_id: "$.data.id "}
            - call: "PUT /stops/${stop_id}"
              payload: { status: CONTRACTED }
              as: Producer
            - call: "PUT /stops/${stop_id}"
              payload: { status: ADVANCED }
              as: TourManager
            - call: "POST /stops/${stop_id}/tech-checks"
              payload: { item: POWER_AMPS, required_value: 400 }
              as: TourManager
              captures: { check_id: "$.data.id "}
            - call: "PUT /tech-checks/${check_id}"
              payload: { actual_value: 400 }
              as: TourManager
            - call: "PUT /stops/${stop_id}"
              payload: { status: READY }
              as: TourManager
            - call: "POST /stops/${stop_id}/performances"
              payload: { perf_date: "2026-09-09", curtain_time: "19:30", duration_minutes: 150 }
              as: TourManager
              captures: { perf_id: "$.data.id "}
            - call: "PUT /performances/${perf_id}"
              payload: { status: PLAYED, gross_cents: 1000000 }
              as: Treasurer
            - call: "GET /stops/${stop_id}/settlement"
              as: Producer
              captures: { s_id: "$.data[0].id" }
            - call: "PUT /settlements/${s_id}"
              payload: { audited_gross_cents: 6000000, taxes_cents: 300000, levies_cents: 200000 }
              as: Treasurer
            - call: "PUT /settlements/${s_id}"
              payload: { status: SUBMITTED }
              as: Treasurer
              as_user_id: trs-1
          trigger:
            - call: "PUT /settlements/${s_id}"
              payload: { status: APPROVED }
              as: Producer
              as_user_id: prod-1
              captures: { royalty: "$.data.royalty_cents", share: "$.data.producer_share_cents "}
          assert:
            - "Settlement.${s_id}.producer_share_cents == 1500000"
            - "Settlement.${s_id}.royalty_cents == 105000 (600 bps on first 1000000 + 900 bps on remaining 500000)"

      - name: per_diem_half_day_rounding_order_mode_b
        grounds:
          - calculations.calc_per_diem
          - entities.PerDiemStatement.fields.total_cents
        distinguishing_aspect: |
          Mode (b): nested rounding order is pinned — the half-day rate is rounded FIRST
          (round_half_up(20115/2) = 10058) and then multiplied by travel_days; computing
          round(travel_days x rate / 2) instead yields 120,690, one cent less than the
          pinned 120,691 for days_present=7, travel_days=2.
        test_recipe:
          setup:
            - "ACTUAL_DAYS tour with per_diem_daily_cents 20,115; READY stop; CONTRACTED cast member"
          setup_api_calls:
            - call: "POST /tours"
              payload: { name: "Tour AD", budget_total_cents: 50000000, capitalization_cents: 10000000, per_diem_policy: ACTUAL_DAYS, per_diem_daily_cents: 20115, royalty_tier_threshold_cents: 1000000 }
              as: Producer
              captures: { tour_id: "$.data.id", tour_v: "$.data.version "}
            - call: "POST /venues"
              payload: { name: "Venue V", city: "Chicago", stage_width_ft: 44, fly_capacity_lines: 30, power_amps: 400, crew_available: 20 }
              as: Producer
              captures: { venue_id: "$.data.id "}
            - call: "POST /tours/${tour_id}/stops"
              payload: { venue_id: "${venue_id}", play_week_start: "2026-09-07", play_week_end: "2026-09-13", load_in_date: "2026-09-05", travel_in_days: 1, guarantee_cents: 1000000, split_pct: 70, expected_tour_version: "${tour_v}" }
              as: TourManager
              captures: { stop_id: "$.data.id "}
            - call: "PUT /stops/${stop_id}"
              payload: { status: CONTRACTED }
              as: Producer
            - call: "PUT /stops/${stop_id}"
              payload: { status: ADVANCED }
              as: TourManager
            - call: "POST /stops/${stop_id}/tech-checks"
              payload: { item: STAGE_WIDTH_FT, required_value: 40 }
              as: TourManager
              captures: { check_id: "$.data.id "}
            - call: "PUT /tech-checks/${check_id}"
              payload: { actual_value: 42 }
              as: TourManager
            - call: "PUT /stops/${stop_id}"
              payload: { status: READY }
              as: TourManager
            - call: "POST /tours/${tour_id}/cast"
              payload: { name: "Sam Swing", contract_type: SWING, weekly_salary_cents: 400000 }
              as: CompanyManager
              captures: { cm_id: "$.data.id "}
            - call: "PUT /cast/${cm_id}"
              payload: { status: CONTRACTED }
              as: CompanyManager
          trigger:
            - call: "POST /stops/${stop_id}/per-diems"
              payload: { cast_member_id: "${cm_id}", days_present: 7, travel_days: 2 }
              as: CompanyManager
              captures: { pd_id: "$.data.id", total: "$.data.total_cents "}
          assert:
            - "PerDiemStatement.${pd_id}.total_cents == 120691 (5 x 20115 + 2 x 10058)"
            - "PerDiemStatement.${pd_id}.total_cents != 120690 (the sum-then-round reading is rejected)"

      - name: wrap_recoup_evaluation_order_mode_c
        grounds:
          - calculations.calc_weekly_wrap
          - calculations.calc_licensor_royalty
          - entities.Tour.fields.recouped
        distinguishing_aspect: |
          Mode (c): circular-looking dependency pinned by evaluation order — stop 1's royalty
          is fixed at approve with the pre-recoup rates (18,000); the wrap then flips
          recouped (cumulative 282,000 >= capitalization 282,000); stop 2 with IDENTICAL
          figures approves at post-recoup rates (24,000). Royalty never feeds back into the
          recoup test of its own stop.
        test_recipe:
          setup:
            - "Tour with capitalization_cents 282,000; stop 1 (guarantee 0, split 70) played, settled (audited 1,000,000, taxes 0, levies 0 -> share 300,000), approved pre-recoup (royalty 18,000), PAID, WRAPPED (net 282,000 flips recouped); stop 2 identical, settled and submitted"
          setup_api_calls:
            - call: "POST /tours"
              payload: { name: "Tour R", budget_total_cents: 50000000, capitalization_cents: 282000, per_diem_policy: FULL_WEEK, per_diem_daily_cents: 20000, royalty_tier_threshold_cents: 1000000 }
              as: Producer
              captures: { tour_id: "$.data.id", tour_v1: "$.data.version "}
            - call: "POST /venues"
              payload: { name: "Venue V", city: "Chicago", stage_width_ft: 44, fly_capacity_lines: 30, power_amps: 400, crew_available: 20 }
              as: Producer
              captures: { venue_id: "$.data.id "}
            - call: "POST /tours/${tour_id}/stops"
              payload: { venue_id: "${venue_id}", play_week_start: "2026-09-07", play_week_end: "2026-09-13", load_in_date: "2026-09-05", travel_in_days: 1, guarantee_cents: 0, split_pct: 70, expected_tour_version: "${tour_v1}" }
              as: TourManager
              captures: { stop1: "$.data.id "}
            - call: "PUT /stops/${stop1}"
              payload: { status: CONTRACTED }
              as: Producer
            - call: "PUT /stops/${stop1}"
              payload: { status: ADVANCED }
              as: TourManager
            - call: "POST /stops/${stop1}/tech-checks"
              payload: { item: STAGE_WIDTH_FT, required_value: 40 }
              as: TourManager
              captures: { chk1: "$.data.id "}
            - call: "PUT /tech-checks/${chk1}"
              payload: { actual_value: 44 }
              as: TourManager
            - call: "PUT /stops/${stop1}"
              payload: { status: READY }
              as: TourManager
            - call: "POST /stops/${stop1}/performances"
              payload: { perf_date: "2026-09-08", curtain_time: "19:30", duration_minutes: 150 }
              as: TourManager
              captures: { perf1: "$.data.id "}
            - call: "PUT /performances/${perf1}"
              payload: { status: PLAYED, gross_cents: 1000000 }
              as: Treasurer
            - call: "GET /stops/${stop1}/settlement"
              as: Producer
              captures: { s1: "$.data[0].id" }
            - call: "PUT /settlements/${s1}"
              payload: { audited_gross_cents: 1000000, taxes_cents: 0, levies_cents: 0 }
              as: Treasurer
            - call: "PUT /settlements/${s1}"
              payload: { status: SUBMITTED }
              as: Treasurer
              as_user_id: trs-1
            - call: "PUT /settlements/${s1}"
              payload: { status: APPROVED }
              as: Producer
              as_user_id: prod-1
              captures: { roy1: "$.data.royalty_cents "}
            - call: "PUT /settlements/${s1}"
              payload: { status: PAID }
              as: Treasurer
              as_user_id: trs-1
            - call: "PUT /stops/${stop1}"
              payload: { status: WRAPPED }
              as: Producer
            - call: "GET /tours/${tour_id}"
              as: Producer
              captures: { recouped_now: "$.data.recouped", cum_net: "$.data.cumulative_producer_net_cents", tour_v2: "$.data.version "}
            - call: "POST /tours/${tour_id}/stops"
