          The conserved quantity is integer money: incentive_available_cents + incentive_reserved_cents +
          incentive_paid_cents must equal incentive_budget_cents after every write. Withdrawal must release
          exactly the cents the recruitment reserved (5250, the surcharged amount) and not the amount a
