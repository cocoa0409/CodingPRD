              as: Anonymous
              captures: { x1_id: $.data.id }
            - call: "POST /panelists"
              payload: { email: "x2@example.com", display_name: "Filler Two", address_hash: "H-CLUSTER", account_opened_at: "2025-06-01T00:00:00Z", segment_code: "URBAN_MILLENNIAL" }
              as: Anonymous
              captures: { x2_id: $.data.id }
            - call: "POST /panelists"
