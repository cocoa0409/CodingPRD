scaffold_difficulty_design:
  # =========================================================================
  # Rule 1 — Dual-variant calculations across different entity domains
  # =========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: location_reputation_provisional_vs_certified_diverge
        grounds:
          - calculations.location_reputation_score
          - entities.Location.fields.reputation_score_provisional
          - entities.Location.fields.reputation_score_certified
          - state_machines.Review.UNVERIFIED_to_VERIFIED
        distinguishing_aspect: |
          Entity domain = Location (reputation accounting). With the identical two-review data set the
          PROVISIONAL variant (UNVERIFIED+VERIFIED, no decay) yields 63.00 while the CERTIFIED variant
          (VERIFIED only, recency-decayed) yields 75.00 on the very same Location row.
        test_recipe:
          setup:
            - "Logical clock at its startup default 2026-05-01T00:00:00Z."
            - "One Business, one Location whose three listings are all CONNECTED and NAP-matched, so listing_health_score == 100.00."
            - "Review A: rating 5, posted_at 2026-01-01 (120 days old), moderation_state VERIFIED."
            - "Review B: rating 3, posted_at 2026-04-30, moderation_state UNVERIFIED."
            - "No response has ever been published, so both variants see response_rate 0."
          setup_api_calls:
            - call: "POST /reputation/businesses"
              payload: { name: "Acme Dental Group", plan_tier: "PRO", default_frequency_cap_days: 30 }
              as: PlatformAdmin
              captures: { biz_id: $.data.id }
            - call: "POST /reputation/businesses/${biz_id}/locations"
              payload: { name: "Acme Downtown", nap_name: "Acme Dental", nap_address: "1 Main St", nap_phone: "+15551110000" }
              as: PlatformAdmin
              captures: { loc_id: $.data.id }
            - call: "POST /reputation/locations/${loc_id}/listings"
              payload: { site: "GOOGLE", external_listing_id: "g-1", listed_nap_name: "Acme Dental", listed_nap_address: "1 Main St", listed_nap_phone: "+15551110000" }
              as: PlatformAdmin
              captures: { lst_g: $.data.id }
            - call: "POST /reputation/locations/${loc_id}/listings"
              payload: { site: "YELP", external_listing_id: "y-1", listed_nap_name: "Acme Dental", listed_nap_address: "1 Main St", listed_nap_phone: "+15551110000" }
              as: PlatformAdmin
              captures: { lst_y: $.data.id }
            - call: "POST /reputation/locations/${loc_id}/listings"
              payload: { site: "FACEBOOK", external_listing_id: "f-1", listed_nap_name: "Acme Dental", listed_nap_address: "1 Main St", listed_nap_phone: "+15551110000" }
              as: PlatformAdmin
              captures: { lst_f: $.data.id }
            - call: "POST /reputation/listings/${lst_g}/sync"
              payload: { outcome: "SUCCESS" }
              as: PlatformAdmin
            - call: "POST /reputation/listings/${lst_y}/sync"
              payload: { outcome: "SUCCESS" }
              as: PlatformAdmin
            - call: "POST /reputation/listings/${lst_f}/sync"
              payload: { outcome: "SUCCESS" }
              as: PlatformAdmin
            - call: "POST /reputation/locations/${loc_id}/reviews"
              payload: { site: "GOOGLE", external_review_id: "g-r1", author_name: "Ann", rating: 5, text: "Superb", posted_at: "2026-01-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { rev_a: $.data.id }
            - call: "POST /reputation/reviews/${rev_a}/verify"
              payload: {}
              as: PlatformAdmin
            - call: "POST /reputation/locations/${loc_id}/reviews"
              payload: { site: "GOOGLE", external_review_id: "g-r2", author_name: "Bob", rating: 3, text: "Okay", posted_at: "2026-04-30T00:00:00Z" }
              as: PlatformAdmin
              captures: { rev_b: $.data.id }
          trigger:
            - call: "POST /reputation/locations/${loc_id}/certify"
              payload: {}
              as: PlatformAdmin
              captures: { cert_score: $.data.reputation_score_certified, prov_score: $.data.reputation_score_provisional }
          assert:
            - "Location.${loc_id}.listing_health_score == 100.00"
            - "Location.${loc_id}.reputation_score_provisional == 63.00"
            - "Location.${loc_id}.reputation_score_certified == 75.00"
            - "Location.${loc_id}.certified_at == 2026-05-01T00:00:00.000Z"
            - "Location.${loc_id}.avg_rating == 4.00"
            - "Location.${loc_id}.reputation_score_certified != Location.${loc_id}.reputation_score_provisional"

      - name: campaign_conversion_strict_vs_broad_diverge
        grounds:
          - calculations.campaign_conversion_rate
          - entities.Campaign.fields.activated_at
          - entities.Review.fields.review_request_id
          - state_machines.ReviewRequest.SENT_to_CONVERTED
        distinguishing_aspect: |
          Entity domain = Campaign (marketing attribution), a different subject from the Location
          reputation score. On the identical data the STRICT variant scores 50.00 (one linked+VERIFIED
          review over two billable sends) while the BROAD halo variant scores 100.00 (two in-window
          reviews at the location, link and verification ignored).
        test_recipe:
          setup:
            - "Clock at default 2026-05-01T00:00:00Z; Location OPEN with three CONNECTED listings."
            - "Two email-consenting contacts; an EMAIL campaign with credits_allocated 10 and daily_send_cap 10, RUNNING with activated_at 2026-05-01T00:00:00Z."
            - "Both contacts' requests are SENT (denominator 2)."
            - "Review V1 is linked to contact 1's request, rating 5, posted 2026-05-05, VERIFIED."
            - "Review V2 is organic (no request link), rating 4, posted 2026-05-05T12:00:00Z, left UNVERIFIED."
          setup_api_calls:
            - call: "POST /reputation/businesses"
              payload: { name: "Acme Dental Group" }
              as: PlatformAdmin
              captures: { biz_id: $.data.id }
            - call: "POST /reputation/businesses/${biz_id}/locations"
              payload: { name: "Acme Downtown", nap_name: "Acme Dental", nap_address: "1 Main St", nap_phone: "+15551110000" }
              as: PlatformAdmin
              captures: { loc_id: $.data.id }
            - call: "POST /reputation/locations/${loc_id}/listings"
              payload: { site: "GOOGLE", external_listing_id: "g-1", listed_nap_name: "Acme Dental", listed_nap_address: "1 Main St", listed_nap_phone: "+15551110000" }
              as: PlatformAdmin
              captures: { lst_g: $.data.id }
            - call: "POST /reputation/locations/${loc_id}/listings"
              payload: { site: "YELP", external_listing_id: "y-1", listed_nap_name: "Acme Dental", listed_nap_address: "1 Main St", listed_nap_phone: "+15551110000" }
              as: PlatformAdmin
              captures: { lst_y: $.data.id }
            - call: "POST /reputation/locations/${loc_id}/listings"
              payload: { site: "FACEBOOK", external_listing_id: "f-1", listed_nap_name: "Acme Dental", listed_nap_address: "1 Main St", listed_nap_phone: "+15551110000" }
              as: PlatformAdmin
              captures: { lst_f: $.data.id }
            - call: "POST /reputation/listings/${lst_g}/sync"
              payload: { outcome: "SUCCESS" }
              as: PlatformAdmin
            - call: "POST /reputation/listings/${lst_y}/sync"
              payload: { outcome: "SUCCESS" }
              as: PlatformAdmin
            - call: "POST /reputation/listings/${lst_f}/sync"
              payload: { outcome: "SUCCESS" }
              as: PlatformAdmin
            - call: "POST /reputation/businesses/${biz_id}/contacts"
              payload: { full_name: "Carla One", email: "c1@example.com", email_consent: true }
              as: PlatformAdmin
              captures: { c1: $.data.id }
            - call: "POST /reputation/businesses/${biz_id}/contacts"
              payload: { full_name: "Carl Two", email: "c2@example.com", email_consent: true }
              as: PlatformAdmin
              captures: { c2: $.data.id }
            - call: "GET /reputation/locations/${loc_id}"
              payload: {}
              as: PlatformAdmin
              captures: { loc_v: $.data.version }
            - call: "POST /reputation/locations/${loc_id}/campaigns"
              payload: { name: "Spring Asks", channel: "EMAIL", message_body: "Rate us", send_window_start: "09:00", send_window_end: "11:00", daily_send_cap: 10, credits_allocated: 10, expected_location_version: "${loc_v}" }
              as: PlatformAdmin
              captures: { camp: $.data.id }
            - call: "POST /reputation/campaigns/${camp}/schedule"
              payload: {}
              as: PlatformAdmin
            - call: "POST /reputation/campaigns/${camp}/activate"
              payload: {}
              as: PlatformAdmin
            - call: "POST /reputation/campaigns/${camp}/requests"
              payload: { contact_id: "${c1}" }
              as: PlatformAdmin
              captures: { req1: $.data.id }
            - call: "POST /reputation/campaigns/${camp}/requests"
              payload: { contact_id: "${c2}" }
              as: PlatformAdmin
              captures: { req2: $.data.id }
            - call: "POST /reputation/campaigns/${camp}/send-batch"
              payload: { batch_size: 2 }
              as: PlatformAdmin
            - call: "POST /reputation/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-05T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /reputation/locations/${loc_id}/reviews"
              payload: { site: "GOOGLE", external_review_id: "g-r1", author_name: "Carla", rating: 5, text: "Great", posted_at: "2026-05-05T00:00:00Z", review_request_id: "${req1}" }
              as: PlatformAdmin
              captures: { rev_v1: $.data.id }
            - call: "POST /reputation/reviews/${rev_v1}/verify"
              payload: {}
              as: PlatformAdmin
            - call: "POST /reputation/locations/${loc_id}/reviews"
              payload: { site: "YELP", external_review_id: "y-r1", author_name: "Walk In", rating: 4, text: "Nice", posted_at: "2026-05-05T12:00:00Z" }
              as: PlatformAdmin
              captures: { rev_v2: $.data.id }
          trigger:
            - call: "GET /reputation/campaigns/${camp}/metrics"
              payload: {}
              as: PlatformAdmin
              captures: { strict: $.data.conversion_rate_strict, broad: $.data.conversion_rate_broad }
          assert:
            - "metrics.sent_count == 2"
            - "metrics.conversion_rate_strict == 50.00"
            - "metrics.conversion_rate_broad == 100.00"
            - "metrics.conversion_rate_strict != metrics.conversion_rate_broad"
            - "metrics.billing_cost == 0.02"
            - "ReviewRequest.${req1}.status == CONVERTED"
            - "ReviewRequest.${req2}.status == SENT"

  # =========================================================================
  # Rule 2 — Combinatorial formulas across different modes
  # =========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: listing_health_nonlinear_three_input_site_score
        grounds:
          - calculations.listing_health_score
          - entities.Listing.fields.sync_state
          - entities.Listing.fields.last_synced_at
          - state_machines.Listing.PENDING_SYNC_to_SYNC_FAILED
        distinguishing_aspect: |
          Mode (a): a formula with three interacting inputs per site (nap_match_count, sync_state
          factor, staleness) folded through nested max/min clamps and then a tiered site-weight
          selection — GOOGLE 100.0, YELP 10.0, FACEBOOK 0.0 weight to exactly 53.00, a value no
          single input can explain on its own.
        test_recipe:
          setup:
            - "Clock at default 2026-05-01T00:00:00Z."
            - "Location NAP = (Acme Dental / 1 Main St / +15551110000)."
            - "GOOGLE listing: NAP-matched, synced SUCCESS at 2026-05-01 -> CONNECTED, staleness 0 -> site_score 100.0."
            - "YELP listing: phone mismatch (nap_match 2), never synced -> PENDING_SYNC, last_synced_at null -> staleness 365 -> site_score (2/3*100)*0.6 - 30 = 10.0."
            - "FACEBOOK listing: NAP-matched but one FAILURE sync -> SYNC_FAILED, last_synced_at null -> 100*0.3 - 30 = 0.0."
          setup_api_calls:
            - call: "POST /reputation/businesses"
              payload: { name: "Acme Dental Group" }
              as: PlatformAdmin
              captures: { biz_id: $.data.id }
            - call: "POST /reputation/businesses/${biz_id}/locations"
              payload: { name: "Acme Downtown", nap_name: "Acme Dental", nap_address: "1 Main St", nap_phone: "+15551110000" }
              as: PlatformAdmin
              captures: { loc_id: $.data.id }
            - call: "POST /reputation/locations/${loc_id}/listings"
              payload: { site: "GOOGLE", external_listing_id: "g-1", listed_nap_name: "Acme Dental", listed_nap_address: "1 Main St", listed_nap_phone: "+15551110000" }
              as: PlatformAdmin
              captures: { lst_g: $.data.id }
            - call: "POST /reputation/locations/${loc_id}/listings"
              payload: { site: "YELP", external_listing_id: "y-1", listed_nap_name: "Acme Dental", listed_nap_address: "1 Main St", listed_nap_phone: "+19998887777" }
              as: PlatformAdmin
              captures: { lst_y: $.data.id }
            - call: "POST /reputation/locations/${loc_id}/listings"
              payload: { site: "FACEBOOK", external_listing_id: "f-1", listed_nap_name: "Acme Dental", listed_nap_address: "1 Main St", listed_nap_phone: "+15551110000" }
              as: PlatformAdmin
              captures: { lst_f: $.data.id }
            - call: "POST /reputation/listings/${lst_g}/sync"
              payload: { outcome: "SUCCESS" }
              as: PlatformAdmin
            - call: "POST /reputation/listings/${lst_f}/sync"
              payload: { outcome: "FAILURE" }
              as: PlatformAdmin
          trigger:
            - call: "GET /reputation/locations/${loc_id}/dashboard"
              payload: {}
              as: PlatformAdmin
              captures: { health: $.data.listing_health_score }
          assert:
            - "dashboard.listing_health_score == 53.00"
            - "dashboard.reputation_score_provisional == 7.95"
            - "dashboard.posture == OPEN"
            - "Listing.${lst_g}.sync_state == CONNECTED"
            - "Listing.${lst_y}.sync_state == PENDING_SYNC"
            - "Listing.${lst_y}.nap_match_count == 2"
            - "Listing.${lst_f}.sync_state == SYNC_FAILED"
            - "Listing.${lst_f}.sync_failure_count == 1"

      - name: campaign_billing_round_per_line_then_sum
        grounds:
          - calculations.campaign_billing_cost
          - entities.ReviewRequest.fields.unit_cost
          - entities.ReviewRequest.fields.send_index
          - state_machines.ReviewRequest.QUEUED_to_SENT
        distinguishing_aspect: |
          Mode (b): nested rounding whose ORDER changes the cents. Three SMS lines at 0.075 each must
          be rounded per line first (0.08 x 3 = 0.24); the sum-then-round order would produce 0.23.
          The scaffold pins round-then-sum, so billing_cost is 0.24 and every unit_cost is 0.08.
        test_recipe:
          setup:
            - "Clock at default 2026-05-01T00:00:00Z; Location OPEN with three CONNECTED listings (listing_health_score 100.00)."
            - "Three SMS-consenting contacts with phone numbers."
            - "An SMS campaign, credits_allocated 10, daily_send_cap 10, RUNNING."
            - "Three QUEUED requests, one per contact."
          setup_api_calls:
            - call: "POST /reputation/businesses"
              payload: { name: "Acme Dental Group" }
              as: PlatformAdmin
              captures: { biz_id: $.data.id }
            - call: "POST /reputation/businesses/${biz_id}/locations"
              payload: { name: "Acme Downtown", nap_name: "Acme Dental", nap_address: "1 Main St", nap_phone: "+15551110000" }
              as: PlatformAdmin
              captures: { loc_id: $.data.id }
            - call: "POST /reputation/locations/${loc_id}/listings"
              payload: { site: "GOOGLE", external_listing_id: "g-1", listed_nap_name: "Acme Dental", listed_nap_address: "1 Main St", listed_nap_phone: "+15551110000" }
              as: PlatformAdmin
              captures: { lst_g: $.data.id }
            - call: "POST /reputation/locations/${loc_id}/listings"
              payload: { site: "YELP", external_listing_id: "y-1", listed_nap_name: "Acme Dental", listed_nap_address: "1 Main St", listed_nap_phone: "+15551110000" }
              as: PlatformAdmin
              captures: { lst_y: $.data.id }
            - call: "POST /reputation/locations/${loc_id}/listings"
              payload: { site: "FACEBOOK", external_listing_id: "f-1", listed_nap_name: "Acme Dental", listed_nap_address: "1 Main St", listed_nap_phone: "+15551110000" }
              as: PlatformAdmin
              captures: { lst_f: $.data.id }
            - call: "POST /reputation/listings/${lst_g}/sync"
              payload: { outcome: "SUCCESS" }
              as: PlatformAdmin
            - call: "POST /reputation/listings/${lst_y}/sync"
              payload: { outcome: "SUCCESS" }
              as: PlatformAdmin
            - call: "POST /reputation/listings/${lst_f}/sync"
              payload: { outcome: "SUCCESS" }
              as: PlatformAdmin
            - call: "POST /reputation/businesses/${biz_id}/contacts"
              payload: { full_name: "S One", phone: "+15551110001", sms_consent: true }
              as: PlatformAdmin
              captures: { c1: $.data.id }
            - call: "POST /reputation/businesses/${biz_id}/contacts"
              payload: { full_name: "S Two", phone: "+15551110002", sms_consent: true }
              as: PlatformAdmin
              captures: { c2: $.data.id }
            - call: "POST /reputation/businesses/${biz_id}/contacts"
              payload: { full_name: "S Three", phone: "+15551110003", sms_consent: true }
              as: PlatformAdmin
              captures: { c3: $.data.id }
            - call: "GET /reputation/locations/${loc_id}"
              payload: {}
              as: PlatformAdmin
              captures: { loc_v: $.data.version }
            - call: "POST /reputation/locations/${loc_id}/campaigns"
              payload: { name: "SMS Asks", channel: "SMS", message_body: "Rate us", send_window_start: "09:00", send_window_end: "11:00", daily_send_cap: 10, credits_allocated: 10, expected_location_version: "${loc_v}" }
              as: PlatformAdmin
              captures: { camp: $.data.id }
            - call: "POST /reputation/campaigns/${camp}/schedule"
              payload: {}
              as: PlatformAdmin
            - call: "POST /reputation/campaigns/${camp}/activate"
              payload: {}
              as: PlatformAdmin
            - call: "POST /reputation/campaigns/${camp}/requests"
              payload: { contact_id: "${c1}" }
              as: PlatformAdmin
              captures: { req1: $.data.id }
            - call: "POST /reputation/campaigns/${camp}/requests"
              payload: { contact_id: "${c2}" }
              as: PlatformAdmin
              captures: { req2: $.data.id }
            - call: "POST /reputation/campaigns/${camp}/requests"
              payload: { contact_id: "${c3}" }
              as: PlatformAdmin
              captures: { req3: $.data.id }
          trigger:
            - call: "POST /reputation/campaigns/${camp}/send-batch"
              payload: { batch_size: 3 }
              as: PlatformAdmin
              captures: { cost: $.data.billing_cost }
          assert:
            - "send_batch.sent_count == 3"
            - "send_batch.billing_cost == 0.24"
            - "Campaign.${camp}.billing_cost == 0.24"
            - "ReviewRequest.${req1}.unit_cost == 0.08"
            - "ReviewRequest.${req2}.unit_cost == 0.08"
            - "ReviewRequest.${req3}.unit_cost == 0.08"
            - "ReviewRequest.${req1}.send_index == 1"
            - "ReviewRequest.${req3}.send_index == 3"
            - "Campaign.${camp}.credits_consumed == 3 and Campaign.${camp}.credits_reserved == 0"

  # =========================================================================
  # Rule 3 — Non-linear state-machine shape on different entities
  # =========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: review_parallel_dimensions_evolve_independently
        grounds:
          - state_machines.Review.UNVERIFIED_to_VERIFIED
          - state_machines.Review.NONE_to_DRAFTED
          - entities.Review.fields.moderation_state
          - entities.Review.fields.response_state
        distinguishing_aspect: |
          Entity = Review, shape = PARALLEL dimensions: moderation_state and response_state advance on
          the same row without touching each other — after a draft exists (response_state DRAFTED) a
          verify call moves moderation_state UNVERIFIED -> VERIFIED and leaves response_state at DRAFTED.
        test_recipe:
          setup:
            - "Clock at default 2026-05-01T00:00:00Z; Location with three CONNECTED listings."
            - "One ingested review, rating 5, moderation_state UNVERIFIED, response_state NONE."
            - "A ResponseAgent (X-User-ID agent-1) has drafted a reply, so response_state is DRAFTED while moderation_state is still UNVERIFIED."
          setup_api_calls:
            - call: "POST /reputation/businesses"
              payload: { name: "Acme Dental Group" }
              as: PlatformAdmin
              captures: { biz_id: $.data.id }
            - call: "POST /reputation/businesses/${biz_id}/locations"
              payload: { name: "Acme Downtown", nap_name: "Acme Dental", nap_address: "1 Main St", nap_phone: "+15551110000" }
              as: PlatformAdmin
              captures: { loc_id: $.data.id }
            - call: "POST /reputation/locations/${loc_id}/listings"
              payload: { site: "GOOGLE", external_listing_id: "g-1", listed_nap_name: "Acme Dental", listed_nap_address: "1 Main St", listed_nap_phone: "+15551110000" }
              as: PlatformAdmin
              captures: { lst_g: $.data.id }
            - call: "POST /reputation/listings/${lst_g}/sync"
              payload: { outcome: "SUCCESS" }
              as: PlatformAdmin
            - call: "POST /reputation/locations/${loc_id}/reviews"
              payload: { site: "GOOGLE", external_review_id: "g-r1", author_name: "Ann", rating: 5, text: "Superb", posted_at: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { rev: $.data.id, rev_v: $.data.version }
            - call: "POST /reputation/reviews/${rev}/responses"
              payload: { body: "Thank you!", expected_review_version: "${rev_v}" }
              as: ResponseAgent
              as_user_id: "agent-1"
              captures: { resp: $.data.id }
          trigger:
            - call: "POST /reputation/reviews/${rev}/verify"
              payload: {}
              as: PlatformAdmin
              captures: { mod: $.data.moderation_state, rs: $.data.response_state }
          assert:
            - "Review.${rev}.moderation_state == VERIFIED"
            - "Review.${rev}.response_state == DRAFTED"
            - "ReviewResponse.${resp}.state == DRAFT"
            - "ReviewResponse.${resp}.drafted_by_user_id == agent-1"

      - name: response_reject_revise_cycle_returns_to_draft
        grounds:
          - state_machines.ReviewResponse.PENDING_APPROVAL_to_REJECTED
          - state_machines.ReviewResponse.REJECTED_to_DRAFT
          - entities.ReviewResponse.fields.revision_count
        distinguishing_aspect: |
          Entity = ReviewResponse (a different entity from Review), shape = CYCLE:
          DRAFT -> PENDING_APPROVAL -> REJECTED -> DRAFT -> PENDING_APPROVAL. revision_count increments
          to exactly 1 on the loop-back and the response re-enters PENDING_APPROVAL on the second submit.
        test_recipe:
          setup:
            - "Clock at default 2026-05-01T00:00:00Z; Location with a CONNECTED GOOGLE listing."
            - "One VERIFIED-irrelevant review, rating 5, with a ResponseAgent (agent-1) draft submitted for approval."
            - "A ComplianceOfficer (co-1) has rejected the draft, so the response sits in REJECTED with revision_count 0."
          setup_api_calls:
            - call: "POST /reputation/businesses"
              payload: { name: "Acme Dental Group" }
              as: PlatformAdmin
              captures: { biz_id: $.data.id }
            - call: "POST /reputation/businesses/${biz_id}/locations"
              payload: { name: "Acme Downtown", nap_name: "Acme Dental", nap_address: "1 Main St", nap_phone: "+15551110000" }
              as: PlatformAdmin
              captures: { loc_id: $.data.id }
            - call: "POST /reputation/locations/${loc_id}/listings"
              payload: { site: "GOOGLE", external_listing_id: "g-1", listed_nap_name: "Acme Dental", listed_nap_address: "1 Main St", listed_nap_phone: "+15551110000" }
              as: PlatformAdmin
              captures: { lst_g: $.data.id }
            - call: "POST /reputation/listings/${lst_g}/sync"
              payload: { outcome: "SUCCESS" }
              as: PlatformAdmin
            - call: "POST /reputation/locations/${loc_id}/reviews"
              payload: { site: "GOOGLE", external_review_id: "g-r1", author_name: "Ann", rating: 5, text: "Superb", posted_at: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { rev: $.data.id, rev_v: $.data.version }
            - call: "POST /reputation/reviews/${rev}/responses"
