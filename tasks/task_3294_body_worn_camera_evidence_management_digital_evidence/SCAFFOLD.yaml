    input: []
    output: CaseEntity
    side_effects: []

  - method: POST
    path: "/agencies/{agencyId}/cases/{caseId}/submit-review"
    description: "Move case OPEN -> UNDER_REVIEW (needs >= 1 linked recording, all ACTIVE/RETENTION_DUE)"
    roles: [Officer]
    code: 200
    input: []
    output: CaseEntity
    side_effects: ["AuditLogEntry CASE_SUBMITTED"]

  - method: POST
    path: "/agencies/{agencyId}/cases/{caseId}/close"
    description: "Move case UNDER_REVIEW -> CLOSED (no linked recording may be PENDING_REVIEW)"
    roles: [Supervisor]
    code: 200
    input: []
    output: CaseEntity
    side_effects: ["AuditLogEntry CASE_CLOSED"]

  - method: POST
    path: "/agencies/{agencyId}/cases/{caseId}/reopen"
    description: "Move case UNDER_REVIEW or CLOSED -> OPEN"
    roles: [Supervisor]
    code: 200
    input: []
    output: CaseEntity
    side_effects: ["AuditLogEntry CASE_REOPENED"]

  - method: POST
    path: "/agencies/{agencyId}/cases/{caseId}/archive"
    description: "Move case CLOSED -> ARCHIVED (no ACTIVE share grants; no ACTIVE case-scoped legal hold)"
    roles: [RecordsOfficer]
    code: 200
    input: []
    output: CaseEntity
    side_effects: ["case_number freed; AuditLogEntry CASE_ARCHIVED"]

  # --- CaseEvidenceLink ---
  - method: POST
    path: "/agencies/{agencyId}/cases/{caseId}/evidence"
    description: "Link an ACTIVE recording to an OPEN case"
    roles: [Officer, Supervisor]
    code: 201
    input: [recording_id]
    output: CaseEvidenceLink
    side_effects: ["case.evidence_count += 1; case.total_evidence_bytes += size_bytes; recording retention_due_at re-evaluated under case-extension rule; case.retention_due_at recomputed; recording legal_hold_count recomputed (case-scoped holds now cover it); CustodyEvent CASE_LINKED"]

  - method: GET
    path: "/agencies/{agencyId}/cases/{caseId}/evidence"
    description: "List evidence links of a case"
    roles: [AgencyAdmin, Supervisor, RecordsOfficer, Officer]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "CaseEvidenceLink[]"
    side_effects: []

