        claim_type: priority_ordering
        grounds:
          - validations[priority=2]
          - validations[priority=25]
          - validations[priority=30]
          - errors[ERR_ROLE_NOT_PERMITTED]
          - errors[ERR_SPONSOR_NOT_FOUND]
          - errors[ERR_NOT_BANK_SPONSOR]
        distinguishing_aspect: "The ladder is 2 -> 25 -> 30 and each rung is proven by the same request with one thing changed: a Permittee posting a bank with a non-existent sponsor_id gets 403 ERR_ROLE_NOT_PERMITTED (not 404), a Sponsor posting the same body gets 404 ERR_SPONSOR_NOT_FOUND (not 403 ownership), and sponsor B targeting sponsor A's bank gets 403 ERR_NOT_BANK_SPONSOR."
        test_recipe:
          setup:
            - "Two sponsors: A owns bank Cypress Bend; B owns nothing. Clock 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /mitigation/sponsors"
              payload: { legal_name: "Cypress Bend Mitigation LLC", legal_entity_type: "PRIVATE_ENTREPRENEURIAL", performance_bond_cents: 30000000 }
              as: ProgramAdmin
              captures: { sponsor_a: $.data.id }
            - call: "POST /mitigation/sponsors"
              payload: { legal_name: "Blackwater Restoration Trust", legal_entity_type: "NGO", performance_bond_cents: 30000000 }
              as: ProgramAdmin
              captures: { sponsor_b: $.data.id }
            - call: "POST /mitigation/banks"
              payload: { sponsor_id: "${sponsor_a}", site_name: "Cypress Bend", site_huc8_code: "03130002", service_area_huc8_codes: ["03130002", "03130003"], hgm_class: "DEPRESSIONAL", annual_stewardship_cost_cents: 4200000 }
              as: Sponsor
              as_user_id: "${sponsor_a}"
              captures: { bank_a: $.data.id }
          trigger:
            - call: "POST /mitigation/banks"
              payload: { sponsor_id: "00000000-0000-0000-0000-000000000000", site_name: "Ghost Flats", site_huc8_code: "03130009", service_area_huc8_codes: ["03130009"], hgm_class: "FLATS", annual_stewardship_cost_cents: 1000000 }
              as: Permittee
              as_user_id: "00000000-0000-0000-0000-000000000000"
              captures: { e_role: $.data.error_id }
            - call: "POST /mitigation/banks"
              payload: { sponsor_id: "00000000-0000-0000-0000-000000000000", site_name: "Ghost Flats", site_huc8_code: "03130009", service_area_huc8_codes: ["03130009"], hgm_class: "FLATS", annual_stewardship_cost_cents: 1000000 }
              as: Sponsor
              as_user_id: "00000000-0000-0000-0000-000000000000"
              captures: { e_fk: $.data.error_id }
            - call: "POST /mitigation/prospectuses"
              payload: { bank_id: "${bank_a}", objective_summary: "Hostile takeover of a neighbour's bank", proposed_credits: 10.00 }
              as: Sponsor
              as_user_id: "${sponsor_b}"
              captures: { e_owner: $.data.error_id }
            - call: "GET /mitigation/banks"
              payload: { limit: 10, offset: 0 }
              as: ProgramAdmin
          assert:
            - "${e_role} == ERR_ROLE_NOT_PERMITTED with HTTP 403 (priority 2 fires before the body FK is resolved)"
            - "${e_fk} == ERR_SPONSOR_NOT_FOUND with HTTP 404 (priority 25 fires before ownership)"
            - "${e_owner} == ERR_NOT_BANK_SPONSOR with HTTP 403 (priority 30)"
            - "GET banks: total_count == 1 (only ${bank_a} exists)"
            - "GET /mitigation/banks/${bank_a}/prospectuses: total_count == 0"
            - "Sponsor.${sponsor_b}.banks_count == 0"

