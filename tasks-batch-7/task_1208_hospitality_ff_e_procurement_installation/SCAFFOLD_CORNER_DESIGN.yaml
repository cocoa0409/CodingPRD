      - name: reversal_pool_shortfall_guard
        claim_type: violation_to_error
        grounds: ["errors[ERR_REVERSAL_POOL_SHORTFALL]", "state_machines.ReceivingEvent.POSTED_to_REVERSED"]
        distinguishing_aspect: "Reversal is rejected when its units have already been consumed: 6 of 10 received units are installed, so backing out the receipt would drive qty_installable negative (4 - 10)."
        test_recipe:
          setup:
            - "Full pipeline; line 10 x 10000c fully received (installable 10); room R-801; window IN_PROGRESS; task qty 6 COMPLETE (installable now 4, installed 6)"
          setup_api_calls:
            - { call: "POST /api/projects", payload: { name: "P-R10", hotel_name: "H", brand_program: "MARQUEE_SELECT", total_budget_cents: 10000000 }, as: PurchasingAgent, captures: { p_id: $.data.id } }
