  - rule_id: transitive_cascade
    instances:
      - name: composition_retire_cascade_reaches_breach_watch_and_demotion
        grounds:
          - state_machines.Composition.RETIRED
          - state_machines.Campaign.SCHEDULED_to_CANCELLED
          - state_machines.Allocation.RESERVED_to_RELEASED
          - state_machines.Commitment.SECURED_to_BREACH_WATCH
        distinguishing_aspect: |
          Depth-4 chain from a single trigger (composition retire): retire cancels the
          SCHEDULED campaign; the cancellation releases the RESERVED allocation; the
          release drops the SECURED commitment's supply_coverage to 0 which flips it to
          BREACH_WATCH with a 90-day deadline; entering BREACH_WATCH demotes the device
          maker's standing STRATEGIC -> STANDARD. Each hop is caused by the previous
          hop's mutation, not by the original call.
        test_recipe:
          setup:
            - "Maker standing STRATEGIC; program with QUALIFIED composition GX-100"
            - "SECURED commitment (committed 5000, required 5000, prepayment 2500000 -> TIER_A)"
            - "Tank commissioned; campaign SCHEDULED [2028-03-01, 2029-03-01) planned 10000 (expected_good 6200)"
            - "Allocation of 5000 units RESERVED against that campaign (supply_coverage 1.0)"
            - "Logical clock at 2028-03-01T00:00:00Z when retire fires"
          setup_api_calls:
            - { call: "POST /glass/device-makers", payload: { name: "Acme Devices", region: "US", standing_tier: "STRATEGIC" }, as: PlatformAdmin, captures: { m_id: $.data.id } }
            - { call: "POST /glass/programs", payload: { device_maker_id: "${m_id}", name: "Eagle", primary_market: "CONSUMER_ELECTRONICS" }, as: ProgramManager, captures: { p_id: $.data.id } }
            - { call: "POST /glass/programs/${p_id}/execute-nda", payload: { nda_reference: "NDA-001" }, as: ProgramManager }
            - { call: "POST /glass/compositions", payload: { program_id: "${p_id}", composition_code: "GX-100", complexity_multiplier: 1.0 }, as: ProgramManager, captures: { cx_id: $.data.id } }
            - { call: "POST /glass/qual-cycles", payload: { composition_id: "${cx_id}", test_plan_ref: "TP-1" }, as: ProgramManager, captures: { q_id: $.data.id } }
            - { call: "POST /glass/qual-cycles/${q_id}/begin-testing", as: DeviceMaker, as_user_id: "${m_id}" }
            - { call: "POST /glass/qual-cycles/${q_id}/record-result", payload: { outcome: "PASSED" }, as: DeviceMaker, as_user_id: "${m_id}" }
            - { call: "GET /glass/programs/${p_id}", as: ProgramManager, captures: { p_v: $.data.version } }
            - { call: "POST /glass/commitments", payload: { program_id: "${p_id}", committed_units: 5000, required_units: 5000, prepayment_cents: 2500000, expected_program_version: "${p_v}" }, as: ProgramManager, captures: { c_id: $.data.id } }
            - { call: "POST /glass/commitments/${c_id}/sign", as: DeviceMaker, as_user_id: "${m_id}" }
            - { call: "POST /glass/commitments/${c_id}/countersign", as: CapacityPlanner, as_user_id: "planner-01" }
            - { call: "POST /glass/commitments/${c_id}/confirm-prepayment", as: FinanceController, as_user_id: "fin-01", captures: { c_v: $.data.version } }
            - { call: "POST /glass/tanks", payload: { commitment_id: "${c_id}", capacity_units_per_day: 1000 }, as: CapacityPlanner, captures: { t_id: $.data.id } }
            - { call: "POST /glass/_clock/set_current_utc", payload: { to_iso8601: "2028-02-23T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /glass/tanks/${t_id}/commission", as: CapacityPlanner }
            - { call: "POST /glass/campaigns", payload: { tank_id: "${t_id}", composition_id: "${cx_id}", start_date: "2028-03-01T00:00:00Z", end_date: "2029-03-01T00:00:00Z", planned_units: 10000 }, as: CapacityPlanner, captures: { camp_id: $.data.id } }
            - { call: "POST /glass/allocations", payload: { commitment_id: "${c_id}", campaign_id: "${camp_id}", units: 5000, expected_commitment_version: "${c_v}" }, as: CapacityPlanner, captures: { a_id: $.data.id } }
            - { call: "POST /glass/_clock/set_current_utc", payload: { to_iso8601: "2028-03-01T00:00:00Z" }, as: PlatformAdmin }
          trigger:
            - { call: "POST /glass/compositions/${cx_id}/retire", as: ProgramManager }
            - { call: "GET /glass/campaigns/${camp_id}", as: ProgramManager, captures: { camp_status: $.data.status, camp_unalloc: $.data.unallocated_units } }
            - { call: "GET /glass/allocations/${a_id}", as: ProgramManager, captures: { a_status: $.data.status } }
            - { call: "GET /glass/commitments/${c_id}", as: ProgramManager, captures: { c_status: $.data.status, c_deadline: $.data.breach_deadline } }
            - { call: "GET /glass/device-makers/${m_id}", as: ProgramManager, captures: { m_tier: $.data.standing_tier } }
          assert:
            - "hop 1: Campaign.${camp_id}.status == CANCELLED"
            - "hop 2: Allocation.${a_id}.status == RELEASED and Campaign.${camp_id}.unallocated_units == 6200 (restored)"
            - "hop 3: Commitment.${c_id}.status == BREACH_WATCH and breach_deadline == 2028-05-30T00:00:00Z (2028-03-01 + CONST.BREACH_GRACE_DAYS 90)"
            - "hop 4: DeviceMaker.${m_id}.standing_tier == STANDARD (demoted one step from STRATEGIC)"
            - "Composition.${cx_id}.status == RETIRED"

      - name: ip_confirmation_cascade_suspends_license_and_holds_report
        grounds:
          - state_machines.DeviceMaker.UNDER_REVIEW_to_CONFIRMED_INFRINGEMENT
          - state_machines.License.ACTIVE_to_SUSPENDED
          - state_machines.UsageReport.SUBMITTED_to_HELD
        distinguishing_aspect: |
          Depth-3 chain from a different trigger (IP confirmation, not composition
          retire): confirming infringement suspends the maker's ACTIVE license with
          reason IP_REVIEW; the suspension itself holds the license's SUBMITTED usage
          report. License and report mutate without any direct call against them.
        test_recipe:
          setup:
            - "Program DESIGN_FROZEN; license ACTIVE primary market; marketing APPROVED; one usage report SUBMITTED; maker ip_review_status UNDER_REVIEW"
          setup_api_calls:
            - { call: "POST /glass/device-makers", payload: { name: "Beta Devices", region: "EU" }, as: PlatformAdmin, captures: { m_id: $.data.id } }
            - { call: "POST /glass/programs", payload: { device_maker_id: "${m_id}", name: "Falcon", primary_market: "CONSUMER_ELECTRONICS" }, as: ProgramManager, captures: { p_id: $.data.id } }
            - { call: "POST /glass/programs/${p_id}/execute-nda", payload: { nda_reference: "NDA-002" }, as: ProgramManager }
            - { call: "POST /glass/compositions", payload: { program_id: "${p_id}", composition_code: "GX-200", complexity_multiplier: 1.0 }, as: ProgramManager, captures: { cx_id: $.data.id } }
            - { call: "POST /glass/qual-cycles", payload: { composition_id: "${cx_id}", test_plan_ref: "TP-2" }, as: ProgramManager, captures: { q_id: $.data.id } }
            - { call: "POST /glass/qual-cycles/${q_id}/begin-testing", as: DeviceMaker, as_user_id: "${m_id}" }
            - { call: "POST /glass/qual-cycles/${q_id}/record-result", payload: { outcome: "PASSED" }, as: DeviceMaker, as_user_id: "${m_id}" }
            - { call: "POST /glass/programs/${p_id}/begin-qualification", payload: { design_freeze_date: "2027-03-01T00:00:00Z" }, as: ProgramManager }
            - { call: "POST /glass/programs/${p_id}/freeze-design", as: ProgramManager }
            - { call: "POST /glass/licenses", payload: { device_maker_id: "${m_id}", program_id: "${p_id}", market: "CONSUMER_ELECTRONICS", effective_date: "2027-01-01T00:00:00Z", expiry_date: "2028-12-31T00:00:00Z" }, as: LegalCounsel, captures: { lic_id: $.data.id } }
            - { call: "POST /glass/_clock/set_current_utc", payload: { to_iso8601: "2027-01-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /glass/licenses/${lic_id}/activate", as: LegalCounsel }
            - { call: "POST /glass/licenses/${lic_id}/submit-marketing", payload: { materials_ref: "MKT-1" }, as: DeviceMaker, as_user_id: "${m_id}" }
            - { call: "POST /glass/licenses/${lic_id}/review-marketing", payload: { decision: "APPROVED" }, as: LegalCounsel }
            - { call: "POST /glass/usage-reports", payload: { license_id: "${lic_id}", period_start: "2027-01-01T00:00:00Z", period_end: "2027-03-31T00:00:00Z", lines: [{ channel: "DOMESTIC", units: 100, net_revenue_cents: 50000 }] }, as: DeviceMaker, as_user_id: "${m_id}", captures: { ur_id: $.data.id } }
            - { call: "POST /glass/device-makers/${m_id}/ip-review", payload: { to_status: "UNDER_REVIEW" }, as: LegalCounsel }
          trigger:
            - { call: "POST /glass/device-makers/${m_id}/ip-review", payload: { to_status: "CONFIRMED_INFRINGEMENT" }, as: LegalCounsel }
            - { call: "GET /glass/licenses/${lic_id}", as: LegalCounsel, captures: { lic_status: $.data.license_status, lic_reason: $.data.suspension_reason } }
            - { call: "GET /glass/usage-reports/${ur_id}", as: LegalCounsel, captures: { ur_status: $.data.status } }
          assert:
            - "hop 1: License.${lic_id}.license_status == SUSPENDED with suspension_reason == IP_REVIEW"
            - "hop 2: UsageReport.${ur_id}.status == HELD"
            - "DeviceMaker.${m_id}.ip_review_status == CONFIRMED_INFRINGEMENT"
            - "neither the license nor the report was touched by a direct endpoint call"

  - rule_id: priority_pair_validation_conflict
    instances:
      - name: allocation_state_trumps_fiscal
        grounds:
          - validations[priority=6]
          - validations[priority=22]
          - errors[ERR_INVALID_STATE]
          - errors[ERR_COMMITMENT_UNITS_EXCEEDED]
        distinguishing_aspect: |
          Error-category pair state vs business_fiscal: the allocation targets a
          PROPOSED commitment (state failure) with 9999 units that would also exceed
          the commitment's 5000-unit remaining need (fiscal failure); priority 6 must
          beat priority 22, yielding ERR_INVALID_STATE (409), not a fiscal error.
        test_recipe:
          setup:
            - "SECURED commitment c_secure funds the tank so a campaign exists; second commitment c2 sits in PROPOSED (never signed) on the same program with committed_units 5000"
            - "Campaign SCHEDULED planned 10000 with 6200 headroom"
          setup_api_calls:
            - { call: "POST /glass/device-makers", payload: { name: "Acme Devices", region: "US" }, as: PlatformAdmin, captures: { m_id: $.data.id } }
            - { call: "POST /glass/programs", payload: { device_maker_id: "${m_id}", name: "Eagle", primary_market: "CONSUMER_ELECTRONICS" }, as: ProgramManager, captures: { p_id: $.data.id } }
            - { call: "POST /glass/programs/${p_id}/execute-nda", payload: { nda_reference: "NDA-001" }, as: ProgramManager }
            - { call: "POST /glass/compositions", payload: { program_id: "${p_id}", composition_code: "GX-100", complexity_multiplier: 1.0 }, as: ProgramManager, captures: { cx_id: $.data.id } }
            - { call: "POST /glass/qual-cycles", payload: { composition_id: "${cx_id}", test_plan_ref: "TP-1" }, as: ProgramManager, captures: { q_id: $.data.id } }
            - { call: "POST /glass/qual-cycles/${q_id}/begin-testing", as: DeviceMaker, as_user_id: "${m_id}" }
            - { call: "POST /glass/qual-cycles/${q_id}/record-result", payload: { outcome: "PASSED" }, as: DeviceMaker, as_user_id: "${m_id}" }
            - { call: "GET /glass/programs/${p_id}", as: ProgramManager, captures: { p_v1: $.data.version } }
            - { call: "POST /glass/commitments", payload: { program_id: "${p_id}", committed_units: 5000, required_units: 5000, prepayment_cents: 2500000, expected_program_version: "${p_v1}" }, as: ProgramManager, captures: { c1_id: $.data.id } }
            - { call: "POST /glass/commitments/${c1_id}/sign", as: DeviceMaker, as_user_id: "${m_id}" }
            - { call: "POST /glass/commitments/${c1_id}/countersign", as: CapacityPlanner, as_user_id: "planner-01" }
            - { call: "POST /glass/commitments/${c1_id}/confirm-prepayment", as: FinanceController, as_user_id: "fin-01" }
            - { call: "POST /glass/tanks", payload: { commitment_id: "${c1_id}", capacity_units_per_day: 1000 }, as: CapacityPlanner, captures: { t_id: $.data.id } }
            - { call: "POST /glass/_clock/set_current_utc", payload: { to_iso8601: "2028-02-23T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /glass/tanks/${t_id}/commission", as: CapacityPlanner }
            - { call: "POST /glass/campaigns", payload: { tank_id: "${t_id}", composition_id: "${cx_id}", start_date: "2028-03-01T00:00:00Z", end_date: "2029-03-01T00:00:00Z", planned_units: 10000 }, as: CapacityPlanner, captures: { camp_id: $.data.id } }
            - { call: "GET /glass/programs/${p_id}", as: ProgramManager, captures: { p_v2: $.data.version } }
            - { call: "POST /glass/commitments", payload: { program_id: "${p_id}", committed_units: 5000, required_units: 5000, prepayment_cents: 2500000, expected_program_version: "${p_v2}" }, as: ProgramManager, captures: { c2_id: $.data.id, c2_v: $.data.version } }
          trigger:
            - { call: "POST /glass/allocations", payload: { commitment_id: "${c2_id}", campaign_id: "${camp_id}", units: 9999, expected_commitment_version: "${c2_v}" }, as: CapacityPlanner, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_STATE with http 409 (c2 is PROPOSED; the state failure at priority 6 pre-empts the fiscal remaining-need failure at priority 22)"
            - "no Allocation is created; Campaign.${camp_id}.unallocated_units still == 6200"

      - name: campaign_temporal_trumps_referential
        grounds:
          - validations[priority=13]
          - validations[priority=17]
          - errors[ERR_TANK_SCHEDULE_CONFLICT]
          - errors[ERR_COMPOSITION_NOT_QUALIFIED]
        distinguishing_aspect: |
          Error-category pair business_temporal vs business_referential: the new
          campaign window overlaps an existing campaign on the tank (temporal failure)
          AND its composition is still EXPERIMENTAL (referential failure); priority 13
          must beat priority 17, yielding ERR_TANK_SCHEDULE_CONFLICT.
        test_recipe:
          setup:
            - "Tank commissioned; campaign A on QUALIFIED composition GX-100 occupies [2028-03-01, 2029-03-01)"
