# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# task_2161 — Multiemployer (Taft-Hartley) Benefit Fund Administration
# Breadth probe over §1.1-§1.7; §1.8 instances are referenced as stubs, never re-tested.
# =============================================================================
scaffold_corner_design:

  - section: entities
    instances:
      - name: fund_create_returns_every_declared_field_with_derived_posture_frozen
        claim_type: Creation
        grounds:
          - entities.Fund
          - endpoints[POST /funds]
          - calculations.governance_posture
        distinguishing_aspect: "A fund created with all required inputs returns HTTP 201 carrying fund_role HOME, plan_year_start_month 1, allocated_uvb_cents 0, unallocated_uvb_cents equal to total_uvb_cents, reciprocity_agreement_status NONE, governance_posture FROZEN, collections_run_index 0 and version 1."
        test_recipe:
          setup:
            - "Empty database, logical clock left at its 2026-08-01T00:00:00Z default."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-01T00:00:00Z" }
              as: FundAdministrator
          trigger:
            - call: "POST /funds"
              payload: { name: "Local 212 Health and Pension Fund", ein: "36-1234567", interest_rate_annual_bps: 900, ld_rate_bps: 2000, ld_floor_cents: 5000, grace_days: 15, hours_per_coverage_month: 120, bank_cap_hours: 480, max_advance_coverage_months: 12, eligibility_lag_months: 2, accrual_method: "HOURS_BASED", pool_prior_year_contributions_cents: [20000000, 20000000, 20000000, 20000000, 20000000], total_uvb_cents: 100000000 }
              as: FundAdministrator
              captures: { fund_id: $.data.id, fund_v: $.data.version }
          assert:
            - "HTTP 201 and the envelope has response_type == 'object' with meta.api_request_id and meta.api_request_timestamp present"
            - "Fund.${fund_id}.fund_role == HOME and plan_year_start_month == 1"
            - "Fund.${fund_id}.allocated_uvb_cents == 0 and unallocated_uvb_cents == 100000000"
            - "Fund.${fund_id}.reciprocity_agreement_status == NONE"
            - "Fund.${fund_id}.governance_posture == FROZEN and active_union_trustees == 0 and active_employer_trustees == 0"
            - "Fund.${fund_id}.collections_run_index == 0 and suspended_employer_count == 0 and reciprocal_receipts_cents == 0"
            - "${fund_v} == 1 and Fund.${fund_id}.id is a bare UUID with no type prefix"

      - name: trustee_create_defaults_seat_status_to_active_and_lifts_posture_to_open
        claim_type: Defaults
        grounds:
          - entities.Trustee.fields.seat_status
          - calculations.governance_posture
          - endpoints[POST /trustees]
        distinguishing_aspect: "Omitting seat_status yields ACTIVE, and the fourth seating (2 UNION plus 2 EMPLOYER) lifts governance_posture from RESTRICTED to OPEN, while a fifth UNION seat drops it back to RESTRICTED because the parties are unequal."
        test_recipe:
          setup:
            - "One fund with no trustees, governance_posture FROZEN."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-01T00:00:00Z" }
              as: FundAdministrator
            - call: "POST /funds"
              payload: { name: "Posture Fund", ein: "36-3000001", interest_rate_annual_bps: 900, ld_rate_bps: 2000, ld_floor_cents: 5000, grace_days: 15, hours_per_coverage_month: 120, bank_cap_hours: 480, max_advance_coverage_months: 12, eligibility_lag_months: 2, accrual_method: "HOURS_BASED", pool_prior_year_contributions_cents: [20000000, 20000000, 20000000, 20000000, 20000000], total_uvb_cents: 100000000 }
              as: FundAdministrator
              captures: { fund_id: $.data.id }
          trigger:
            - call: "POST /trustees"
              payload: { fund_id: "${fund_id}", full_name: "Union Trustee One", appointing_party: "UNION", term_expires_on: "2029-12-31" }
              as: FundAdministrator
              captures: { u1_id: $.data.id }
            - call: "POST /trustees"
              payload: { fund_id: "${fund_id}", full_name: "Employer Trustee One", appointing_party: "EMPLOYER", term_expires_on: "2029-12-31" }
              as: FundAdministrator
              captures: { e1_id: $.data.id }
            - call: "POST /trustees"
              payload: { fund_id: "${fund_id}", full_name: "Union Trustee Two", appointing_party: "UNION", term_expires_on: "2029-12-31" }
              as: FundAdministrator
            - call: "POST /trustees"
              payload: { fund_id: "${fund_id}", full_name: "Employer Trustee Two", appointing_party: "EMPLOYER", term_expires_on: "2029-12-31" }
              as: FundAdministrator
            - call: "POST /trustees"
              payload: { fund_id: "${fund_id}", full_name: "Union Trustee Three", appointing_party: "UNION", term_expires_on: "2029-12-31" }
              as: FundAdministrator
          assert:
            - "Trustee.${u1_id}.seat_status == ACTIVE without seat_status being supplied"
            - "after the first seating (1 UNION, 0 EMPLOYER) Fund.${fund_id}.governance_posture == FROZEN"
            - "after the second seating (1 and 1) governance_posture == RESTRICTED because min(u, e) < 2"
            - "after the fourth seating (2 and 2) governance_posture == OPEN"
            - "after the fifth seating (3 and 2) governance_posture == RESTRICTED because u != e"
            - "GET /funds/${fund_id}/trustees returns 5 rows and GET /funds/${fund_id}/trustees?appointing_party=EMPLOYER returns 2"

      - name: resigned_trustee_seat_is_created_but_never_counted_toward_posture
        claim_type: Type Constraints
        grounds:
          - entities.Trustee.fields.seat_status
          - calculations.governance_posture
        distinguishing_aspect: "A trustee created with seat_status RESIGNED persists with that value yet contributes nothing to active_union_trustees, so a board of 2 ACTIVE UNION, 2 ACTIVE EMPLOYER and 1 RESIGNED UNION seat still reads OPEN."
        test_recipe:
          setup:
            - "A fund with 2 ACTIVE UNION and 2 ACTIVE EMPLOYER trustees, governance_posture OPEN."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-01T00:00:00Z" }
              as: FundAdministrator
            - call: "POST /funds"
              payload: { name: "Resigned Seat Fund", ein: "36-3000002", interest_rate_annual_bps: 900, ld_rate_bps: 2000, ld_floor_cents: 5000, grace_days: 15, hours_per_coverage_month: 120, bank_cap_hours: 480, max_advance_coverage_months: 12, eligibility_lag_months: 2, accrual_method: "HOURS_BASED", pool_prior_year_contributions_cents: [20000000, 20000000, 20000000, 20000000, 20000000], total_uvb_cents: 100000000 }
              as: FundAdministrator
              captures: { fund_id: $.data.id }
            - call: "POST /trustees"
              payload: { fund_id: "${fund_id}", full_name: "Union Trustee One", appointing_party: "UNION", term_expires_on: "2029-12-31" }
              as: FundAdministrator
            - call: "POST /trustees"
              payload: { fund_id: "${fund_id}", full_name: "Union Trustee Two", appointing_party: "UNION", term_expires_on: "2029-12-31" }
              as: FundAdministrator
            - call: "POST /trustees"
              payload: { fund_id: "${fund_id}", full_name: "Employer Trustee One", appointing_party: "EMPLOYER", term_expires_on: "2029-12-31" }
              as: FundAdministrator
            - call: "POST /trustees"
              payload: { fund_id: "${fund_id}", full_name: "Employer Trustee Two", appointing_party: "EMPLOYER", term_expires_on: "2029-12-31" }
              as: FundAdministrator
          trigger:
            - call: "POST /trustees"
              payload: { fund_id: "${fund_id}", full_name: "Retired Union Trustee", appointing_party: "UNION", term_expires_on: "2029-12-31", seat_status: "RESIGNED" }
              as: FundAdministrator
              captures: { resigned_id: $.data.id }
          assert:
            - "Trustee.${resigned_id}.seat_status == RESIGNED"
            - "Fund.${fund_id}.active_union_trustees == 2 and active_employer_trustees == 2"
            - "Fund.${fund_id}.governance_posture == OPEN"
            - "GET /funds/${fund_id}/trustees?seat_status=RESIGNED returns exactly 1 row"

      - name: employer_create_missing_required_rate_returns_invalid_request
        claim_type: Required Fields
        grounds:
          - entities.Employer.fields.contribution_rate_millicents_per_hour
          - validations[priority=35]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "Omitting contribution_rate_millicents_per_hour, a source: input field with no default, is refused with ERR_INVALID_REQUEST and HTTP 400, and no Employer row is created."
        test_recipe:
          setup:
            - "One fund and nothing else."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-01T00:00:00Z" }
              as: FundAdministrator
            - call: "POST /funds"
              payload: { name: "Required Field Fund", ein: "36-3000003", interest_rate_annual_bps: 900, ld_rate_bps: 2000, ld_floor_cents: 5000, grace_days: 15, hours_per_coverage_month: 120, bank_cap_hours: 480, max_advance_coverage_months: 12, eligibility_lag_months: 2, accrual_method: "HOURS_BASED", pool_prior_year_contributions_cents: [20000000, 20000000, 20000000, 20000000, 20000000], total_uvb_cents: 100000000 }
              as: FundAdministrator
              captures: { fund_id: $.data.id }
          trigger:
            - call: "POST /employers"
              payload: { fund_id: "${fund_id}", legal_name: "No Rate Co", ein: "36-3100001", prior_year_contributions_cents: [1, 1, 1, 1, 1], prior_year_base_units: [1, 1, 1, 1, 1] }
              as: FundAdministrator
              captures: { err_id: $.data.error_id }
          assert:
            - "${err_id} == 'ERR_INVALID_REQUEST' with HTTP 400"
            - "GET /employers?fund_id=${fund_id} returns 0 rows"

      - name: employer_create_rejects_client_supplied_computed_status
        claim_type: Computed Fields
        grounds:
          - entities.Employer.fields.status
          - validations[priority=35]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "status is source: computed and absent from POST /employers input, so a body carrying status: SUSPENDED is refused with ERR_INVALID_REQUEST rather than being silently honoured."
        test_recipe:
          setup:
            - "One fund and nothing else."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-01T00:00:00Z" }
              as: FundAdministrator
            - call: "POST /funds"
              payload: { name: "Computed Field Fund", ein: "36-3000004", interest_rate_annual_bps: 900, ld_rate_bps: 2000, ld_floor_cents: 5000, grace_days: 15, hours_per_coverage_month: 120, bank_cap_hours: 480, max_advance_coverage_months: 12, eligibility_lag_months: 2, accrual_method: "HOURS_BASED", pool_prior_year_contributions_cents: [20000000, 20000000, 20000000, 20000000, 20000000], total_uvb_cents: 100000000 }
              as: FundAdministrator
              captures: { fund_id: $.data.id }
          trigger:
            - call: "POST /employers"
              payload: { fund_id: "${fund_id}", legal_name: "Presumptuous Co", ein: "36-3100002", contribution_rate_millicents_per_hour: 825500, prior_year_contributions_cents: [1, 1, 1, 1, 1], prior_year_base_units: [1, 1, 1, 1, 1], status: "SUSPENDED" }
              as: FundAdministrator
              captures: { err_id: $.data.error_id }
          assert:
            - "${err_id} == 'ERR_INVALID_REQUEST' with HTTP 400"
            - "GET /employers?fund_id=${fund_id} returns 0 rows"

      - name: motion_vote_is_immutable_and_carries_no_version_field
        claim_type: Immutability
        grounds:
          - entities.MotionVote
          - endpoints[POST /motion-votes]
          - endpoints[GET /motion-votes/{id}]
        distinguishing_aspect: "MotionVote is declared common_fields: false, so its create and read responses expose id and created_at but no updated_at and no version, and §1.5 declares no PUT, PATCH or DELETE for it."
        test_recipe:
          setup:
            - "A fund with an OPEN board (3 UNION, 3 EMPLOYER) and one OPEN LD-unrelated motion moved by a union trustee."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-01T00:00:00Z" }
              as: FundAdministrator
            - call: "POST /funds"
              payload: { name: "Vote Immutability Fund", ein: "36-3000005", interest_rate_annual_bps: 900, ld_rate_bps: 2000, ld_floor_cents: 5000, grace_days: 15, hours_per_coverage_month: 120, bank_cap_hours: 480, max_advance_coverage_months: 12, eligibility_lag_months: 2, accrual_method: "HOURS_BASED", pool_prior_year_contributions_cents: [20000000, 20000000, 20000000, 20000000, 20000000], total_uvb_cents: 100000000 }
              as: FundAdministrator
              captures: { fund_id: $.data.id }
            - call: "POST /funds"
              payload: { name: "Sister Fund For Vote Test", ein: "36-3000006", fund_role: "SISTER", interest_rate_annual_bps: 900, ld_rate_bps: 2000, ld_floor_cents: 5000, grace_days: 15, hours_per_coverage_month: 120, bank_cap_hours: 480, max_advance_coverage_months: 12, eligibility_lag_months: 2, accrual_method: "HOURS_BASED", pool_prior_year_contributions_cents: [0, 0, 0, 0, 0] }
              as: FundAdministrator
              captures: { sister_fund_id: $.data.id }
            - call: "POST /trustees"
              payload: { fund_id: "${fund_id}", full_name: "Union Trustee One", appointing_party: "UNION", term_expires_on: "2029-12-31" }
              as: FundAdministrator
              captures: { u1_id: $.data.id }
            - call: "POST /trustees"
              payload: { fund_id: "${fund_id}", full_name: "Union Trustee Two", appointing_party: "UNION", term_expires_on: "2029-12-31" }
              as: FundAdministrator
              captures: { u2_id: $.data.id }
            - call: "POST /trustees"
              payload: { fund_id: "${fund_id}", full_name: "Employer Trustee One", appointing_party: "EMPLOYER", term_expires_on: "2029-12-31" }
              as: FundAdministrator
              captures: { e1_id: $.data.id }
            - call: "POST /trustees"
              payload: { fund_id: "${fund_id}", full_name: "Employer Trustee Two", appointing_party: "EMPLOYER", term_expires_on: "2029-12-31" }
              as: FundAdministrator
              captures: { e2_id: $.data.id }
            - call: "POST /board-motions"
              payload: { fund_id: "${fund_id}", subject_type: "RECIPROCITY_AGREEMENT", subject_ref_id: "${sister_fund_id}" }
              as: Trustee
              as_user_id: "${u1_id}"
              captures: { motion_id: $.data.id }
          trigger:
            - call: "POST /motion-votes"
              payload: { motion_id: "${motion_id}", position: "ABSTAIN" }
              as: Trustee
              as_user_id: "${u2_id}"
              captures: { vote_id: $.data.id }
          assert:
            - "HTTP 201 and MotionVote.${vote_id}.trustee_id == ${u2_id} taken from X-User-ID, not from the body"
            - "the MotionVote response body contains id and created_at but neither updated_at nor version"
            - "GET /motion-votes/${vote_id} returns the same row unchanged"
            - "GET /motion-votes?motion_id=${motion_id} returns exactly 1 row and GET /motion-votes?trustee_id=${u2_id} returns exactly 1 row"

      - name: not_found_sweep_across_every_path_addressed_collection
        claim_type: Not Found
        grounds:
          - validations[priority=30]
          - errors[ERR_FUND_NOT_FOUND]
          - errors[ERR_EMPLOYER_NOT_FOUND]
          - errors[ERR_PARTICIPANT_NOT_FOUND]
          - errors[ERR_REPORT_NOT_FOUND]
          - errors[ERR_COVERAGE_MONTH_NOT_FOUND]
          - errors[ERR_ASSESSMENT_NOT_FOUND]
          - errors[ERR_AUDIT_NOT_FOUND]
          - errors[ERR_WITHDRAWAL_NOT_FOUND]
          - errors[ERR_INSTALLMENT_NOT_FOUND]
          - errors[ERR_MOTION_NOT_FOUND]
          - errors[ERR_VOTE_NOT_FOUND]
          - errors[ERR_TRANSFER_NOT_FOUND]
        distinguishing_aspect: "Every path-addressed collection answers a syntactically valid but unknown UUID with its own domain-specific 404 error_id rather than a shared generic one."
        test_recipe:
          setup:
            - "Empty database apart from the clock call."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-01T00:00:00Z" }
              as: FundAdministrator
          trigger:
            - call: "GET /funds/00000000-0000-4000-8000-000000000001"
              payload: {}
              as: FundAdministrator
              captures: { e_fund: $.data.error_id }
            - call: "GET /employers/00000000-0000-4000-8000-000000000002"
              payload: {}
              as: FundAdministrator
              captures: { e_emp: $.data.error_id }
            - call: "GET /participants/00000000-0000-4000-8000-000000000003"
              payload: {}
              as: FundAdministrator
              captures: { e_part: $.data.error_id }
            - call: "GET /contribution-reports/00000000-0000-4000-8000-000000000004"
              payload: {}
              as: FundAdministrator
              captures: { e_rep: $.data.error_id }
            - call: "GET /coverage-months/00000000-0000-4000-8000-000000000005"
              payload: {}
              as: FundAdministrator
              captures: { e_cov: $.data.error_id }
            - call: "GET /payroll-audits/00000000-0000-4000-8000-000000000006"
              payload: {}
              as: FundAdministrator
              captures: { e_aud: $.data.error_id }
            - call: "GET /withdrawal-assessments/00000000-0000-4000-8000-000000000007"
              payload: {}
              as: FundAdministrator
              captures: { e_wl: $.data.error_id }
            - call: "GET /board-motions/00000000-0000-4000-8000-000000000008"
              payload: {}
              as: FundAdministrator
              captures: { e_mot: $.data.error_id }
            - call: "GET /motion-votes/00000000-0000-4000-8000-000000000009"
              payload: {}
              as: FundAdministrator
              captures: { e_vote: $.data.error_id }
            - call: "GET /reciprocity-transfers/00000000-0000-4000-8000-00000000000a"
              payload: {}
              as: FundAdministrator
              captures: { e_tr: $.data.error_id }
            - call: "POST /delinquency-assessments/00000000-0000-4000-8000-00000000000b/settle"
              payload: { settlement_amount_cents: 100 }
              as: FundAdministrator
              captures: { e_ass: $.data.error_id }
            - call: "POST /payment-installments/00000000-0000-4000-8000-00000000000c/pay"
              payload: { amount_cents: 100 }
              as: ContributingEmployer
              as_user_id: "00000000-0000-4000-8000-0000000000ff"
              captures: { e_inst: $.data.error_id }
          assert:
            - "${e_fund} == 'ERR_FUND_NOT_FOUND' with HTTP 404"
            - "${e_emp} == 'ERR_EMPLOYER_NOT_FOUND' with HTTP 404"
            - "${e_part} == 'ERR_PARTICIPANT_NOT_FOUND' with HTTP 404"
            - "${e_rep} == 'ERR_REPORT_NOT_FOUND' with HTTP 404"
            - "${e_cov} == 'ERR_COVERAGE_MONTH_NOT_FOUND' with HTTP 404"
            - "${e_aud} == 'ERR_AUDIT_NOT_FOUND' with HTTP 404"
            - "${e_wl} == 'ERR_WITHDRAWAL_NOT_FOUND' with HTTP 404"
            - "${e_mot} == 'ERR_MOTION_NOT_FOUND' with HTTP 404"
            - "${e_vote} == 'ERR_VOTE_NOT_FOUND' with HTTP 404"
            - "${e_tr} == 'ERR_TRANSFER_NOT_FOUND' with HTTP 404"
            - "${e_ass} == 'ERR_ASSESSMENT_NOT_FOUND' with HTTP 404"
            - "${e_inst} == 'ERR_INSTALLMENT_NOT_FOUND' with HTTP 404"
            - "every error body has response_type == 'error' and data.error_id plus data.message"

      - name: contribution_report_listing_paginates_with_total_count_and_has_more
        claim_type: Listing
        grounds:
          - endpoints[GET /contribution-reports]
          - response_envelope.pagination_fields
        distinguishing_aspect: "With 3 reports filed, GET /contribution-reports?employer_id=...&limit=2&offset=0 returns 2 rows with total_count 3 and has_more true, and offset=2 returns 1 row with has_more false."
        test_recipe:
          setup:
            - "One employer with one participant and three SUBMITTED reports for 2026-01, 2026-02 and 2026-03."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-01T00:00:00Z" }
              as: FundAdministrator
            - call: "POST /funds"
              payload: { name: "Pagination Fund", ein: "36-3000007", interest_rate_annual_bps: 900, ld_rate_bps: 2000, ld_floor_cents: 5000, grace_days: 15, hours_per_coverage_month: 120, bank_cap_hours: 480, max_advance_coverage_months: 12, eligibility_lag_months: 2, accrual_method: "HOURS_BASED", pool_prior_year_contributions_cents: [20000000, 20000000, 20000000, 20000000, 20000000], total_uvb_cents: 100000000 }
              as: FundAdministrator
              captures: { fund_id: $.data.id }
            - call: "POST /employers"
              payload: { fund_id: "${fund_id}", legal_name: "Ironbridge Mechanical", ein: "36-7654321", contribution_rate_millicents_per_hour: 825500, prior_year_contributions_cents: [4000000, 5000000, 6000000, 5500000, 4500000], prior_year_base_units: [4800, 6000, 7200, 6600, 5400] }
              as: FundAdministrator
              captures: { emp_id: $.data.id }
            - call: "POST /participants"
              payload: { fund_id: "${fund_id}", full_name: "Ada Kowalski", ssn_last4: "4417" }
              as: FundAdministrator
              captures: { p1_id: $.data.id }
            - call: "GET /employers/${emp_id}"
              payload: {}
              as: FundAdministrator
              captures: { emp_v1: $.data.version }
            - call: "POST /contribution-reports"
              payload: { employer_id: "${emp_id}", work_period: "2026-01", expected_employer_version: "${emp_v1}", lines: [ { participant_id: "${p1_id}", hours: 100.00, gross_wages_cents: 400000, work_classification: "JOURNEYMAN" } ] }
              as: FundAdministrator
            - call: "GET /employers/${emp_id}"
              payload: {}
              as: FundAdministrator
              captures: { emp_v2: $.data.version }
            - call: "POST /contribution-reports"
              payload: { employer_id: "${emp_id}", work_period: "2026-02", expected_employer_version: "${emp_v2}", lines: [ { participant_id: "${p1_id}", hours: 100.00, gross_wages_cents: 400000, work_classification: "JOURNEYMAN" } ] }
              as: FundAdministrator
            - call: "GET /employers/${emp_id}"
              payload: {}
              as: FundAdministrator
              captures: { emp_v3: $.data.version }
            - call: "POST /contribution-reports"
              payload: { employer_id: "${emp_id}", work_period: "2026-03", expected_employer_version: "${emp_v3}", lines: [ { participant_id: "${p1_id}", hours: 100.00, gross_wages_cents: 400000, work_classification: "JOURNEYMAN" } ] }
              as: FundAdministrator
          trigger:
            - call: "GET /contribution-reports"
              payload: { employer_id: "${emp_id}", limit: 2, offset: 0 }
              as: FundAdministrator
            - call: "GET /contribution-reports"
              payload: { employer_id: "${emp_id}", limit: 2, offset: 2 }
              as: FundAdministrator
            - call: "GET /contribution-reports"
              payload: { employer_id: "${emp_id}", work_period: "2026-02" }
              as: FundAdministrator
          assert:
            - "the first list returns 2 rows with total_count == 3 and has_more == true and limit == 2 and offset == 0"
            - "the second list returns 1 row with total_count == 3 and has_more == false"
            - "the work_period filter returns exactly 1 row whose work_period == '2026-02' and due_date == '2026-03-20'"
            - "the envelope has response_type == 'array'"

      - name: controlled_group_parent_self_reference_is_queryable_from_the_parent
        claim_type: Parent Relationships
        grounds:
          - entities.Employer.fields.controlled_group_parent_employer_id
          - endpoints[GET /employers]
        distinguishing_aspect: "An employer created with controlled_group_parent_employer_id pointing at a sibling Employer row is retrievable through GET /employers?controlled_group_parent_employer_id=..., proving the self-referential FK is stored and reverse-reachable."
        test_recipe:
          setup:
            - "One fund with a parent employer already registered."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-01T00:00:00Z" }
              as: FundAdministrator
