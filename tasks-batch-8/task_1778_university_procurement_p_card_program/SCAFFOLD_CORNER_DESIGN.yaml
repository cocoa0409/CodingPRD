              as: Buyer
              captures: { vb: $.data.id }
            - call: "POST /vendors"
              payload: { legal_name: "TieC" }
              as: Buyer
              captures: { vc: $.data.id }
            - call: "POST /requisitions"
              payload: { department_id: "${d_id}", requester_id: "req-user-1", vendor_id: "${va}", lines: [{ commodity_code: "MUS", description: "piano", quantity: 1, unit_price_cents: 3000000, cost_category: "EQUIPMENT" }] }
              as: Requester
              as_user_id: "req-user-1"
              captures: { r_id: $.data.id }
            - call: "POST /requisitions/${r_id}/submit"
              as: Requester
              as_user_id: "req-user-1"
            - call: "POST /requisitions/${r_id}/approve-step"
              as: DepartmentApprover
              as_user_id: "dept-approver-1"
            - call: "POST /requisitions/${r_id}/solicitations"
              payload: { response_deadline: "2026-08-08T00:00:00Z" }
              as: Buyer
              captures: { s_id: $.data.id }
            - call: "POST /solicitations/${s_id}/quotes"
              payload: { vendor_id: "${va}", price_cents: 3050000 }
              as: Buyer
              captures: { qa_id: $.data.id }
            - call: "POST /solicitations/${s_id}/quotes"
              payload: { vendor_id: "${vb}", price_cents: 3050000 }
              as: Buyer
              captures: { qb_id: $.data.id }
            - call: "POST /solicitations/${s_id}/quotes"
              payload: { vendor_id: "${vc}", price_cents: 3050000 }
              as: Buyer
