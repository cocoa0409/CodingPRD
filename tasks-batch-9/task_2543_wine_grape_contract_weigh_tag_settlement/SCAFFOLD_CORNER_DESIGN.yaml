      - name: pagination_bounds_are_enforced_and_return_400
        claim_type: Violation → Error
        grounds:
          - validations.priority_8
          - errors[ERR_INVALID_PAGINATION]
          - response_envelope.pagination_defaults
        distinguishing_aspect: |
          Priority 8 owns a 400 — the only 400 in the catalogue, distinct from the 422 of
          the shape check — and it brackets limit into [1, 100] inclusive. The corner is
          that both endpoints of the range must be ACCEPTED while the values one step
          outside are refused, so an implementation using exclusive comparisons fails on
          limit 1 or limit 100 rather than on the invalid input.
        test_recipe:
          setup:
            - "Two growers exist so that the accepted calls return a non-empty page."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: GrowerRelationsManager
            - call: "POST /grower-relations/growers"
              payload: { name: "Ridgeline Vineyards", license_number: "PL-44821", region_code: "NAPA-NORTH" }
              as: GrowerRelationsManager
              captures: { grower_a: $.data.id }
            - call: "POST /grower-relations/growers"
              payload: { name: "Stonegate Ranch", license_number: "PL-44822", region_code: "NAPA-NORTH" }
              as: GrowerRelationsManager
              captures: { grower_b: $.data.id }
          trigger:
            - call: "GET /grower-relations/growers"
              payload: { limit: 0 }
              as: GrowerRelationsManager
              captures: { e1: $.data.error_id }
            - call: "GET /grower-relations/growers"
              payload: { limit: 101 }
              as: GrowerRelationsManager
              captures: { e2: $.data.error_id }
            - call: "GET /grower-relations/growers"
              payload: { offset: -1 }
              as: GrowerRelationsManager
              captures: { e3: $.data.error_id }
            - call: "GET /grower-relations/vineyard-blocks"
              payload: { limit: 0 }
              as: GrowerRelationsManager
              captures: { e4: $.data.error_id }
            - call: "GET /grower-relations/growers"
              payload: { limit: 1 }
              as: GrowerRelationsManager
            - call: "GET /grower-relations/growers"
              payload: { limit: 100 }
              as: GrowerRelationsManager
            - call: "GET /grower-relations/growers"
              payload: { offset: 0 }
              as: GrowerRelationsManager
          assert:
            - "${e1} == ERR_INVALID_PAGINATION with HTTP 400 — a 400, not the 422 of ERR_VALIDATION"
            - "${e2} == ERR_INVALID_PAGINATION: 101 exceeds the maximum of 100"
            - "${e3} == ERR_INVALID_PAGINATION: offset must be >= 0"
            - "${e4} == ERR_INVALID_PAGINATION: the rule applies to EVERY list endpoint, not just to growers"
            - "limit 1 returns 200 with exactly 1 element, total_count 2 and has_more true"
            - "limit 100 returns 200 with both elements and has_more false: the inclusive upper bound is accepted"
            - "offset 0 returns 200 with both elements: the inclusive lower bound is accepted"

      - name: delivery_appointment_lane_guards_reject_closed_lane_and_oversize_load
        claim_type: Violation → Error
        grounds:
          - validations.priority_23
          - validations.priority_45
          - errors[ERR_LANE_CLOSED]
          - errors[ERR_LOAD_EXCEEDS_LANE_MAX]
        distinguishing_aspect: |
          Two lane guards that are easy to leave unimplemented because the lane row looks
          like a passive lookup: booking into a CLOSED lane must fail even though the window
          is free, and planned_tons must respect max_load_tons independently of the daily
          capacity (40.500 t clears the 80.000 t daily budget and still has to be refused).
          The 40.000 t probe pins the inclusive boundary of priority 45.
        test_recipe:
          setup:
            - "Standard chain to an ACKNOWLEDGED pick call, plus a second lane created CLOSED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-20T08:00:00Z" }
