              as: BranchManager
              captures: { unit_id: $.data.id }
            - call: "POST /rental-contracts"
              payload: { customer_id: "${cust_id}", jobsite_address: "400 Industrial Pkwy", damage_waiver_elected: false }
              as: RentalCoordinator
              captures: { contract_id: $.data.id, cv: $.data.version }
            - call: "POST /rental-lines"
              payload: { contract_id: "${contract_id}", unit_id: "${unit_id}", requested_start_date: "2026-08-05", requested_end_date: "2026-08-06", required_working_height_ft: 25, expected_contract_version: "${cv}" }
              as: RentalCoordinator
              captures: { line_id: $.data.id }
