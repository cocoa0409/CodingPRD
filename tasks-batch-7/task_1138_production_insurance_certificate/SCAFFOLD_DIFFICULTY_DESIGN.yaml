                production_type: "COMMERCIAL"
                principal_photography_start: "2026-06-01T00:00:00Z"
                principal_photography_end: "2026-06-15T00:00:00Z"
                budget_cents: 100000000
                requires_completion_bond: false
              as: BrokerAgent
              captures: { prod_id: $.data.id }
            - call: "POST /productions/${prod_id}/policies"
              payload:
                coverage_line: "GENERAL_LIABILITY"
                carrier_code: "AIG"
                policy_number: "AIG-GL-P2"
                limit_cents: 100000000
                aggregate_limit_cents: 200000000
                deductible_cents: 100000
                effective_date: "2026-05-01T00:00:00Z"
                expiry_date: "2026-12-31T00:00:00Z"
                payroll_basis_cents: 10000000
              as: BrokerAgent
              captures: { pol_id: $.data.id }
            - call: "GET /productions/${prod_id}"
              payload: {}
              as: BrokerAgent
              captures: { prod_v: $.data.version }
            - call: "POST /productions/${prod_id}/policies/${pol_id}/bind"
              payload: { expected_production_version: "${prod_v}" }
              as: BrokerAgent
            - call: "POST /productions/${prod_id}/activate"
              payload: {}
              as: BrokerAgent
            - call: "POST /productions/${prod_id}/claims"
              payload:
                policy_id: "${pol_id}"
                claim_type: "DAMAGE"
                occurrence_date: "2026-06-05T00:00:00Z"
                loss_amount_cents: 500000
              as: ProductionManager
              as_user_id: "pm-user-001"
              captures: { claim_id: $.data.id, reserve_amt: $.data.reserve_cents }
            - call: "POST /productions/${prod_id}/claims/${claim_id}/acknowledge"
              payload: {}
              as: ClaimsAdjuster
          trigger:
            # Same user_id as submitter AND over-reserve amount
            - call: "POST /productions/${prod_id}/claims/${claim_id}/settle"
              payload: { settlement_amount_cents: 999999999 }
              as: ClaimsAdjuster
              as_user_id: "pm-user-001"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_SELF_SETTLEMENT_FORBIDDEN"

  # ============================================================
  # Rule 6 — boundary_precision_check
  # ============================================================
  - rule_id: boundary_precision_check
    instances:
      - name: claim_deductible_exact_boundary
        grounds:
          - calculations.claim_deductible_applied
          - entities.Claim.fields.deductible_applied_cents
          - entities.Claim.fields.carrier_payable_cents
        distinguishing_aspect: |
          Numeric threshold boundary: loss_amount_cents == policy.deductible_cents
          exactly, so carrier_payable_cents == 0 (claim sits entirely on
          production). Tests the `min(per_claim_deductible, loss_amount)` edge.
