      - name: letter_counter_by_the_issuing_party_is_refused_then_the_target_succeeds
        claim_type: precondition_enforcement
        grounds:
          - state_machines.LetterOfIntent.ISSUED_to_COUNTERED
          - validations.priority_13_ERR_NOT_DEAL_PARTY
        distinguishing_aspect: |
          The counter transition names ONE specific party - the target - so being a
          party to the deal is not enough. The initiator that issued the letter is
          refused with ERR_NOT_DEAL_PARTY even though its X-User-Id is
          initiator_org_id, which is exactly the check a naive membership test
          (X-User-Id IN {initiator, target}) would pass. The identical payload from
          the target then succeeds and leaves exclusivity_status ACTIVE, proving the
          refusal was about who signed, not about the window.
        test_recipe:
          setup:
            - "A Restructuring in LOI_NEGOTIATION with one ISSUED LetterOfIntent whose exclusivity window is ACTIVE"
          setup_api_calls:
            - call: "POST /organizations"
              payload: { legal_name: "Riverside Youth Alliance", ein: "11-1111111", state_code: "CA", mission_code: "YM-YOUTH_MENTORING", annual_expense_cents: 100000002, unrestricted_net_assets_cents: 59916670 }
