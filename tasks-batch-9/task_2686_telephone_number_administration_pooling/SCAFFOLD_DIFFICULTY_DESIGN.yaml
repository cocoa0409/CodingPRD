              as: CarrierRepresentative
              as_user_id: "${carrier_a_id}"
              captures: { rc_v: $.data.version }
            - call: "POST /numbering/allocation-requests"
              payload: { carrier_id: "${carrier_a_id}", rate_center_id: "${rc_id}", request_type: "GROWTH", requested_block_count: 1, justification: "one growth block pending review", expected_rate_center_version: "${rc_v}" }
              as: CarrierRepresentative
              as_user_id: "${carrier_a_id}"
              captures: { req_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2027-01-29T00:00:00Z" }
