      - name: blade_severity_bands_pinned_at_forty_sixty_and_eighty_with_one_cent_neighbours
        grounds:
          - calculations.blade_damage_severity_score
          - entities.BladeDamage.fields.severity_score
          - entities.BladeDamage.fields.repair_priority_band
          - entities.BladeDamage.fields.repair_due_days
          - endpoints.POST_/wind-ops/turbines/{id}/blade-damages
        distinguishing_aspect: |
          Six recordings straddle all three band thresholds by exactly 0.01. Each band minimum is
          inclusive, so 80.00 is CRITICAL and 79.99 is HIGH, 60.00 is HIGH and 59.99 is MEDIUM,
          40.00 is MEDIUM and 39.99 is LOW, and each flip also moves repair_due_days across the
          14 / 45 / 120 / 365 ladder. The neighbours are produced by moving one input by a couple
          of millimetres or square centimetres, so an implementation that rounds the sum only once
          or uses strict band comparisons lands on the wrong side.
        test_recipe:
          setup:
            - "one farm with two ONLINE turbines T1 and T2, so three findings can be recorded on each of blade positions A, B and C without reusing a position on one turbine"
            - "the logical clock reads 2026-08-01T00:00:00Z"
