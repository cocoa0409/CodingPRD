  # ===========================================================================
  # Errors
  # ===========================================================================
  - section: errors
    instances:
      - name: err_batch_not_released_on_recall_of_draft_batch
        claim_type: Violation → Error
        grounds:
          - errors[ERR_BATCH_NOT_RELEASED]
          - state_machines.CompoundingBatch.RELEASED_to_RECALLED
          - endpoints["POST /pharmacy-compounding/recalls"]
        distinguishing_aspect: "Initiating a recall against a batch that is DRAFT (not RELEASED) -> ERR_BATCH_NOT_RELEASED (409)."
        test_recipe:
          setup:
            - "A DRAFT batch (never released)."
          setup_api_calls:
            - call: "POST /pharmacy-compounding/facilities"
              payload: { name: "Acme", registration_type: "503B", state_code: "TX" }
              as: SystemAdmin
              captures: { f_id: $.data.id }
            - call: "POST /pharmacy-compounding/master-formulation-records"
              payload: { facility_id: "${f_id}", name: "F1", dosage_form: "ORAL_SOLID", default_bud_days_nonsterile: 90, theoretical_yield_units: 100, anticipatory_max_units: 500 }
              as: CompoundingPharmacist
              captures: { mfr_id: $.data.id }
            - call: "POST /pharmacy-compounding/compounding-batches"
              payload: { facility_id: "${f_id}", master_formulation_record_id: "${mfr_id}", purpose: "OFFICE_USE" }
              as: CompoundingPharmacist
              captures: { batch_id: $.data.id }
          trigger:
            - call: "POST /pharmacy-compounding/recalls"
              payload: { facility_id: "${f_id}", compounding_batch_id: "${batch_id}", reason: "LABELING_ERROR", classification: "CLASS_III" }
              as: QualityAssurancePharmacist
              captures: { error_id: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "response.data.error_id == ERR_BATCH_NOT_RELEASED"

      - name: err_qc_not_in_state_record_before_begin
        claim_type: Violation → Error
        grounds:
          - errors[ERR_QC_NOT_IN_STATE]
          - state_machines.QualityControlTest.IN_PROGRESS_to_PASSED
          - endpoints["POST /pharmacy-compounding/qc-tests/{qid}/record"]
        distinguishing_aspect: "Recording a QC test still PENDING (begin not called) -> ERR_QC_NOT_IN_STATE (409)."
        test_recipe:
          setup:
            - "A COMPILED batch with a PENDING POTENCY_ASSAY QC test (begin not called)."
          setup_api_calls:
            - call: "POST /pharmacy-compounding/facilities"
              payload: { name: "Acme", registration_type: "503A", state_code: "CA" }
              as: SystemAdmin
              captures: { f_id: $.data.id }
            - call: "POST /pharmacy-compounding/facilities/${f_id}/_clock/set"
              payload: { to_iso8601: "2026-06-01T00:00:00.000Z" }
              as: SystemAdmin
            - call: "POST /pharmacy-compounding/master-formulation-records"
              payload: { facility_id: "${f_id}", name: "F1", dosage_form: "ORAL_SOLID", default_bud_days_nonsterile: 90, theoretical_yield_units: 5, anticipatory_max_units: 500 }
              as: CompoundingPharmacist
              captures: { mfr_id: $.data.id }
            - call: "POST /pharmacy-compounding/ingredient-lots"
              payload: { facility_id: "${f_id}", component_name: "API X", lot_number: "X-1", labeled_potency_pct: 100, initial_grams: 50, expiration_utc: "2030-01-01T00:00:00.000Z" }
              as: CompoundingPharmacist
              captures: { lot_id: $.data.id }
            - call: "POST /pharmacy-compounding/prescriptions"
              payload: { facility_id: "${f_id}", master_formulation_record_id: "${mfr_id}", patient_name: "Pat Q", prescriber_npi: "1234567890", units_prescribed: 5, written_utc: "2026-06-01T00:00:00.000Z" }
              as: DispensingPharmacist
              captures: { rx_id: $.data.id }
            - call: "POST /pharmacy-compounding/compounding-batches"
              payload: { facility_id: "${f_id}", master_formulation_record_id: "${mfr_id}", purpose: "PRESCRIPTION", prescription_id: "${rx_id}" }
              as: CompoundingPharmacist
              captures: { batch_id: $.data.id }
            - call: "POST /pharmacy-compounding/batch-ingredient-usages"
              payload: { compounding_batch_id: "${batch_id}", ingredient_lot_id: "${lot_id}", grams_used: 10 }
              as: CompoundingPharmacist
            - call: "POST /pharmacy-compounding/compounding-batches/${batch_id}/start"
              payload: {}
              as: CompoundingPharmacist
            - call: "POST /pharmacy-compounding/compounding-batches/${batch_id}/compile"
              payload: { actual_yield_units: 5 }
              as: CompoundingPharmacist
            - call: "POST /pharmacy-compounding/qc-tests"
              payload: { compounding_batch_id: "${batch_id}", test_type: "POTENCY_ASSAY", measured_value: 100, lower_limit: 90, upper_limit: 110 }
              as: QualityAssurancePharmacist
              captures: { qc_id: $.data.id }
          trigger:
            - call: "POST /pharmacy-compounding/qc-tests/${qc_id}/record"
              payload: { measured_value: 100 }
              as: QualityAssurancePharmacist
              captures: { error_id: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "response.data.error_id == ERR_QC_NOT_IN_STATE"

      - name: err_recall_not_in_state_advance_from_reconciled
        claim_type: Violation → Error
        grounds:
          - errors[ERR_RECALL_NOT_IN_STATE]
          - state_machines.Recall.INITIATED_to_IN_PROGRESS
          - endpoints["POST /pharmacy-compounding/recalls/{rid}/advance"]
        distinguishing_aspect: "Advancing a recall that is already RECONCILED (advance only valid from INITIATED) -> ERR_RECALL_NOT_IN_STATE (409)."
        excluded_because:
          difficulty_instance: non_linear_state_machine / recall_in_progress_reopen_cycle_back_to_initiated
          rationale: "The recall state machine and its NOT_IN_STATE guard on advance/reopen/reconcile transitions are exercised by the recall-cycle difficulty instance, which drives INITIATED<->IN_PROGRESS; invalid-from-RECONCILED advance is the same guard on the same machine."

      - name: err_invalid_request_negative_grams_used
        claim_type: Violation → Error
        grounds:
          - errors[ERR_INVALID_REQUEST]
          - entities.BatchIngredientUsage.fields.grams_used
          - endpoints["POST /pharmacy-compounding/batch-ingredient-usages"]
        distinguishing_aspect: "Charging grams_used=-5 (must be > 0) -> ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup:
            - "A DRAFT batch and a lot exist."
          setup_api_calls:
            - call: "POST /pharmacy-compounding/facilities"
              payload: { name: "Acme", registration_type: "503B", state_code: "TX" }
              as: SystemAdmin
              captures: { f_id: $.data.id }
            - call: "POST /pharmacy-compounding/master-formulation-records"
              payload: { facility_id: "${f_id}", name: "F1", dosage_form: "ORAL_SOLID", default_bud_days_nonsterile: 90, theoretical_yield_units: 100, anticipatory_max_units: 500 }
              as: CompoundingPharmacist
              captures: { mfr_id: $.data.id }
            - call: "POST /pharmacy-compounding/ingredient-lots"
              payload: { facility_id: "${f_id}", component_name: "API X", lot_number: "X-1", labeled_potency_pct: 100, initial_grams: 50, expiration_utc: "2030-01-01T00:00:00.000Z" }
              as: CompoundingPharmacist
              captures: { lot_id: $.data.id }
            - call: "POST /pharmacy-compounding/compounding-batches"
              payload: { facility_id: "${f_id}", master_formulation_record_id: "${mfr_id}", purpose: "OFFICE_USE" }
              as: CompoundingPharmacist
              captures: { batch_id: $.data.id }
          trigger:
            - call: "POST /pharmacy-compounding/batch-ingredient-usages"
              payload: { compounding_batch_id: "${batch_id}", ingredient_lot_id: "${lot_id}", grams_used: -5 }
              as: CompoundingPharmacist
              captures: { error_id: $.data.error_id }
          assert:
            - "HTTP status == 400"
            - "response.data.error_id == ERR_INVALID_REQUEST"

