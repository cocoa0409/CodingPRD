              payload: { roll_forming_line_id: "${line_a_id}", coil_lot_id: "${cl2_id}", dealer_order_id: "${o_base_id}", window_start: "2026-08-03T16:00:00Z", window_end: "2026-08-03T20:00:00Z", planned_kg: 6600 }
              as: ProductionPlanner
              captures: { err_buffer: $.data.error_id }
            - call: "POST /roll-forming-runs"
              payload: { roll_forming_line_id: "${line_a_id}", coil_lot_id: "${cl2_id}", dealer_order_id: "${o_base_id}", window_start: "2026-08-03T17:29:00Z", window_end: "2026-08-03T21:29:00Z", planned_kg: 6600 }
              as: ProductionPlanner
              captures: { err_buffer_edge: $.data.error_id }
            - call: "POST /roll-forming-runs"
              payload: { roll_forming_line_id: "${line_a_id}", coil_lot_id: "${cl2_id}", dealer_order_id: "${o_base_id}", window_start: "2026-08-03T17:30:00Z", window_end: "2026-08-03T21:30:00Z", planned_kg: 6600 }
              as: ProductionPlanner
              captures: { run_d_id: $.data.id, run_d_coating: $.data.coating_code }
          assert:
            - "before the trigger: RollFormingRun.${run_a_id}.status == SCHEDULED with coating_code G115, and CoilLot.${cl1_id}.reserved_kg == 6600 with remaining_kg == 13400.0"
            - "the strictly-interior 10:00..11:00 run returns HTTP 409 with error_id ERR_LINE_WINDOW_CONFLICT - genuine intersection needs no coating reasoning"
            - "the 12:00..16:00 run on the SAME coating G115 returns HTTP 201: new.window_start == existing.window_end is a zero-length intersection under half-open semantics and same-coating adjacency is permitted"
            - "after that, CoilLot.${cl1_id}.reserved_kg == 13200 and remaining_kg == 6800.0 - two runs reserve against the same lot"
            - "the 16:00..20:00 run on coating G90 returns HTTP 409 with error_id ERR_LINE_WINDOW_CONFLICT at exactly the same touching instant that G115 was allowed - the differentiator is coating_code, not the clock"
            - "the 17:29..21:29 G90 run also returns HTTP 409: the required gap is CoatingSpec G90's changeover_minutes of 90, so 89 minutes after the 16:00 end of RollFormingRun.${run_b_id} is still inside the buffer"
            - "the 17:30..21:30 G90 run returns HTTP 201 with coating_code G90 - exactly 90 minutes clears the buffer, so the boundary is inclusive on the allowed side"
            - "the buffer is asymmetric: nothing before 08:00 was blocked, only the touching side of the existing windows"
            - "CoilLot.${cl2_id}.reserved_kg == 6600 and remaining_kg == 13400.0 - only the accepted G90 run reserved mass; the two rejected attempts reserved nothing"
            - "RollFormingLine.${line_a_id} ends with exactly three SCHEDULED runs and no COMPLETED runs"

      - name: dealer_yard_staging_slots_use_closed_intervals_and_aggregate_capacity_so_one_overlap_is_legal
        grounds:
          - validations[priority=22]
          - entities.Dealer.staging_slots
          - entities.FreightLoad.yard_window_start
          - concurrency_rules.freight-load-create-stale-dealer
          - errors.ERR_YARD_SLOTS_EXHAUSTED
        distinguishing_aspect: |
          A different contended resource (the Dealer's yard) with the opposite interval convention:
          CLOSED intervals, where touching endpoints DO intersect - the exact configuration that the
          RollFormingLine instance permits. The capacity semantics also differ: this is an AGGREGATE
          count against Dealer.staging_slots rather than pairwise mutual exclusion, so a first overlap
          is accepted and only the load that would be the (slots + 1)-th concurrent occupant is
          rejected. Every create also has to carry a fresh expected_dealer_version, so the rule is
          exercised through an OCC-guarded endpoint.
        test_recipe:
          setup:
            - "Jurisdiction NE-WEST (seal_required false) and Dealer Alpha with staging_slots 2 and high_cube_access true."
            - "No BinDesign or DealerOrder is needed: FreightLoad creation is independent of orders, so the loads stay at order_count 0 and the temporal rule is isolated from the allocation formula."
            - "FreightLoad FL1 (FLATBED, WEIGHT) with yard window 2026-09-10T00:00:00Z..2026-09-12T00:00:00Z in status PLANNED."
            - "Dealer.version is re-read before every create because POST /freight-loads is guarded by expected_dealer_version."
          setup_api_calls:
            - call: "POST /jurisdictions"
              payload: { code: "NE-WEST", name: "Nebraska West", seal_required: false, min_design_wind_speed_mph: 95, seismic_design_category: "A", permit_review_days: 0 }
              as: PlantAdmin
              captures: { j_ns_id: $.data.id }
            - call: "POST /dealers"
              payload: { name: "Alpha Grain Systems", region_code: "NE-01", jurisdiction_id: "${j_ns_id}", credit_limit_cents: 900000000, program_tier: "BASE", staging_slots: 2, high_cube_access: true }
              as: PlantAdmin
              captures: { dlr_a_id: $.data.id, dlr_slots: $.data.staging_slots }
            - call: "GET /dealers/${dlr_a_id}"
              payload: {}
              as: LogisticsCoordinator
              captures: { dv1: $.data.version }
            - call: "POST /freight-loads"
              payload: { dealer_id: "${dlr_a_id}", trailer_type: "FLATBED", allocation_basis: "WEIGHT", yard_window_start: "2026-09-10T00:00:00Z", yard_window_end: "2026-09-12T00:00:00Z", expected_dealer_version: "${dv1}" }
              as: LogisticsCoordinator
              captures: { fl1_id: $.data.id, fl1_status: $.data.status }
          trigger:
            - call: "GET /dealers/${dlr_a_id}"
              payload: {}
              as: LogisticsCoordinator
              captures: { dv2: $.data.version }
            - call: "POST /freight-loads"
              payload: { dealer_id: "${dlr_a_id}", trailer_type: "FLATBED", allocation_basis: "WEIGHT", yard_window_start: "2026-09-12T00:00:00Z", yard_window_end: "2026-09-14T00:00:00Z", expected_dealer_version: "${dv2}" }
              as: LogisticsCoordinator
              captures: { fl2_id: $.data.id }
            - call: "GET /dealers/${dlr_a_id}"
              payload: {}
              as: LogisticsCoordinator
              captures: { dv3: $.data.version }
            - call: "POST /freight-loads"
              payload: { dealer_id: "${dlr_a_id}", trailer_type: "FLATBED", allocation_basis: "WEIGHT", yard_window_start: "2026-09-11T00:00:00Z", yard_window_end: "2026-09-13T00:00:00Z", expected_dealer_version: "${dv3}" }
              as: LogisticsCoordinator
              captures: { err_slots: $.data.error_id }
            - call: "POST /freight-loads"
              payload: { dealer_id: "${dlr_a_id}", trailer_type: "FLATBED", allocation_basis: "WEIGHT", yard_window_start: "2026-09-15T00:00:00Z", yard_window_end: "2026-09-16T00:00:00Z", expected_dealer_version: "${dv3}" }
              as: LogisticsCoordinator
              captures: { fl4_id: $.data.id }
          assert:
            - "before the trigger: Dealer.${dlr_a_id}.staging_slots == 2 and FreightLoad.${fl1_id}.status == PLANNED with order_count == 0"
            - "FL2 at 2026-09-12..2026-09-14 returns HTTP 201 even though its start equals FL1's end: closed intervals make them intersect, but the intersecting count is 1 which is still below staging_slots 2"
            - "FL2's acceptance is the exact mirror image of the RollFormingLine rule, where a touching pair of DIFFERENT coatings is rejected - the two resources use opposite endpoint conventions"
            - "the 2026-09-11..2026-09-13 load returns HTTP 409 with error_id ERR_YARD_SLOTS_EXHAUSTED because it intersects both FreightLoad.${fl1_id} and FreightLoad.${fl2_id}, so the count 2 is already >= staging_slots"
            - "the rejection is aggregate, not pairwise: overlapping ONE existing load was fine, overlapping TWO is not"
            - "the disjoint 2026-09-15..2026-09-16 load returns HTTP 201 - it touches neither window, so the yard is free again"
            - "the disjoint load is accepted with expected_dealer_version ${dv3}, proving the rejected create did not bump Dealer.${dlr_a_id}.version"
            - "the dealer ends with exactly three PLANNED FreightLoad rows: FreightLoad.${fl1_id}, FreightLoad.${fl2_id} and FreightLoad.${fl4_id}"
            - "only PLANNED loads consume a slot - the rule text scopes the count to status PLANNED, so a DISPATCHED load would not have blocked the third window"

  - rule_id: compensating_invariant
    instances:

      - name: voiding_a_completed_run_restores_the_coil_lot_steel_mass_conservation_identity_with_zero_drift
        grounds:
          - calculations.coil_mass_ledger
          - state_machines.RollFormingRun.COMPLETED_to_VOIDED
          - state_machines.CoilLot.DEPLETED_to_AVAILABLE
          - state_machines.DealerOrder.KITTED_to_QUEUED
          - endpoints[POST /roll-forming-runs/{id}/void]
        distinguishing_aspect: |
          The conserved quantity is PHYSICAL STEEL MASS in kilograms on a CoilLot, held by the identity
          received_kg == remaining_kg + reserved_kg + consumed_kg + scrap_kg. The compensation is
          interesting because void is the single undo for two structurally different forward actions:
          voiding a SCHEDULED run releases a RESERVATION, while voiding a COMPLETED run must release a
          CONSUMPTION plus its scrap and additionally walk the run's DealerOrder back from KITTED to
          QUEUED. The run row survives with its original planned_kg, so a naive implementation that
          subtracts instead of re-deriving the four sums drifts.
        test_recipe:
          setup:
            - "Jurisdiction NE-WEST (seal_required false), GrainProfile CORN, CoatingSpec G115, RollFormingLine LINE_A (max_gauge_mm 3.0), engineer PE-1001, Dealer Alpha."
            - "BinDesign D1 (12.0 m x 9.6 m, ASD, coating G115) at UNDER_REVIEW with sheet_gauge_mm 1.6."
            - "DealerOrder O_BASE on D1 (NONE / GRAVITY) confirmed to production_status QUEUED."
            - "CoilLot CL1 of coating G115, gauge_mm 1.6, received_kg 20000, status AVAILABLE."
            - "Two runs on LINE_A against CL1: RUN_1 for 2026-08-03T08:00Z..12:00Z with planned_kg 6600, then RUN_2 for 12:00Z..16:00Z with planned_kg 13400, which exhausts the lot and drives CoilLot CL1 to DEPLETED."
          setup_api_calls:
            - call: "POST /jurisdictions"
              payload: { code: "NE-WEST", name: "Nebraska West", seal_required: false, min_design_wind_speed_mph: 95, seismic_design_category: "A", permit_review_days: 0 }
              as: PlantAdmin
              captures: { j_ns_id: $.data.id }
            - call: "POST /grain-profiles"
              payload: { grain_code: "CORN", bulk_density_kg_per_m3: 721, janssen_k_ratio: 0.42, max_safe_moisture_pct: 15.0, aeration_cfm_per_m3_base: 2.5, drying_multiplier: 4.0 }
              as: PlantAdmin
              captures: { gp_corn_id: $.data.id }
            - call: "POST /coating-specs"
              payload: { coating_code: "G115", zinc_mass_g_per_m2: 350, coating_cost_per_kg_cents: 42, changeover_minutes: 120, max_ambient_moisture_pct: 18.0 }
              as: PlantAdmin
              captures: { cs_g115_id: $.data.id }
            - call: "POST /roll-forming-lines"
              payload: { line_code: "LINE_A", max_gauge_mm: 3.0 }
              as: PlantAdmin
              captures: { line_a_id: $.data.id }
            - call: "POST /engineers"
              payload: { name: "Dana Author", license_number: "PE-1001", licensed_jurisdiction_codes: ["IA-CENTRAL", "NE-WEST", "CA-VALLEY"] }
              as: PlantAdmin
              captures: { eng_a_id: $.data.id }
            - call: "POST /dealers"
              payload: { name: "Alpha Grain Systems", region_code: "NE-01", jurisdiction_id: "${j_ns_id}", credit_limit_cents: 900000000, program_tier: "BASE", staging_slots: 2, high_cube_access: true }
              as: PlantAdmin
              captures: { dlr_a_id: $.data.id }
            - call: "POST /bin-designs"
              payload: { dealer_id: "${dlr_a_id}", jurisdiction_id: "${j_ns_id}", grain_profile_id: "${gp_corn_id}", coating_spec_id: "${cs_g115_id}", diameter_m: 12.0, eave_height_m: 9.6, roof_pitch_deg: 30, design_wind_speed_mph: 105, moisture_pct: 14.0, design_method: "ASD" }
              as: DesignEngineer
              as_user_id: "${eng_a_id}"
              captures: { d1_id: $.data.id, d1_v: $.data.version }
            - call: "POST /bin-designs/${d1_id}/analyses"
              payload: { design_method: "ASD", expected_bin_design_version: "${d1_v}" }
              as: DesignEngineer
              as_user_id: "${eng_a_id}"
              captures: { an1_id: $.data.id }
            - call: "POST /bin-designs/${d1_id}/submit-review"
              payload: {}
              as: DesignEngineer
              as_user_id: "${eng_a_id}"
              captures: { d1_status: $.data.status }
            - call: "POST /dealer-orders"
              payload: { dealer_id: "${dlr_a_id}", bin_design_id: "${d1_id}", order_season: "OFFSEASON", aeration_package: "NONE", unload_system: "GRAVITY" }
              as: DealerPrincipal
              as_user_id: "${dlr_a_id}"
              captures: { o_base_id: $.data.id }
            - call: "POST /dealer-orders/${o_base_id}/confirm"
              payload: {}
              as: DealerPrincipal
              as_user_id: "${dlr_a_id}"
              captures: { o_prod: $.data.production_status }
            - call: "POST /coil-lots"
              payload: { coating_spec_id: "${cs_g115_id}", heat_number: "H-77", gauge_mm: 1.6, received_kg: 20000 }
              as: ProductionPlanner
              captures: { cl1_id: $.data.id, cl1_recv: $.data.received_kg }
            - call: "POST /roll-forming-runs"
              payload: { roll_forming_line_id: "${line_a_id}", coil_lot_id: "${cl1_id}", dealer_order_id: "${o_base_id}", window_start: "2026-08-03T08:00:00Z", window_end: "2026-08-03T12:00:00Z", planned_kg: 6600 }
              as: ProductionPlanner
              captures: { run1_id: $.data.id }
            - call: "POST /roll-forming-runs"
              payload: { roll_forming_line_id: "${line_a_id}", coil_lot_id: "${cl1_id}", dealer_order_id: "${o_base_id}", window_start: "2026-08-03T12:00:00Z", window_end: "2026-08-03T16:00:00Z", planned_kg: 13400 }
              as: ProductionPlanner
              captures: { run2_id: $.data.id }
            - call: "GET /coil-lots/${cl1_id}"
              payload: {}
              as: ProductionPlanner
              captures: { cl_status_dep: $.data.status, cl_rem_dep: $.data.remaining_kg, cl_res_dep: $.data.reserved_kg }
          trigger:
            - call: "POST /roll-forming-runs/${run2_id}/void"
              payload: {}
              as: ProductionPlanner
              captures: { run2_status: $.data.status }
            - call: "GET /coil-lots/${cl1_id}"
              payload: {}
              as: ProductionPlanner
              captures: { cl_status_back: $.data.status, cl_rem_back: $.data.remaining_kg }
            - call: "POST /roll-forming-runs/${run1_id}/complete"
              payload: { consumed_kg: 6410.4, scrap_kg: 152.3 }
              as: ProductionPlanner
              captures: { run1_status: $.data.status, run1_cons: $.data.consumed_kg }
            - call: "GET /coil-lots/${cl1_id}"
              payload: {}
              as: ProductionPlanner
              captures: { cl_rem_mid: $.data.remaining_kg, cl_cons_mid: $.data.consumed_kg, cl_scrap_mid: $.data.scrap_kg }
            - call: "POST /roll-forming-runs/${run1_id}/void"
              payload: {}
              as: ProductionPlanner
              captures: { run1_voided: $.data.status, run1_cons_after: $.data.consumed_kg }
            - call: "GET /coil-lots/${cl1_id}"
              payload: {}
              as: ProductionPlanner
              captures: { cl_rem_end: $.data.remaining_kg, cl_res_end: $.data.reserved_kg }
            - call: "POST /roll-forming-runs/${run1_id}/void"
              payload: {}
              as: ProductionPlanner
              captures: { err_double_void: $.data.error_id }
          assert:
            - "checkpoint 0 (before the trigger): CoilLot.${cl1_id}.received_kg == 20000.0, reserved_kg == 20000.0, consumed_kg == 0.0, scrap_kg == 0.0, remaining_kg == 0.0 and status == DEPLETED - the identity holds as 20000 == 0 + 20000 + 0 + 0"
            - "checkpoint 1 (void of the SCHEDULED RUN_2): RollFormingRun.${run2_id}.status == VOIDED, CoilLot.${cl1_id}.reserved_kg == 6600.0, remaining_kg == 13400.0 and status is back to AVAILABLE - a pure reservation release, and the DEPLETED -> AVAILABLE edge fires"
            - "checkpoint 1: DealerOrder.${o_base_id}.production_status is still QUEUED because RUN_2 never reached COMPLETED, so there is nothing to walk back"
            - "checkpoint 2 (complete of RUN_1): RollFormingRun.${run1_id}.status == COMPLETED with consumed_kg 6410.4 and scrap_kg 152.3; CoilLot.${cl1_id}.reserved_kg == 0.0, consumed_kg == 6410.4, scrap_kg == 152.3 and remaining_kg == 13437.3 - the identity holds as 20000 == 13437.3 + 0 + 6410.4 + 152.3"
            - "checkpoint 2: the completion released the full 6600 reservation and booked only the 6562.7 actually used, so the 37.3 kg difference returns to remaining_kg rather than vanishing"
            - "checkpoint 2: DealerOrder.${o_base_id}.production_status == KITTED"
            - "checkpoint 3 (void of the COMPLETED RUN_1): RollFormingRun.${run1_id}.status == VOIDED with consumed_kg == 0.0 and scrap_kg == 0.0, while planned_kg is still 6600 - the stored plan is not rewritten"
            - "checkpoint 3: CoilLot.${cl1_id}.remaining_kg == 20000.0 with reserved_kg == 0.0, consumed_kg == 0.0 and scrap_kg == 0.0 - the lot is bit-for-bit back to its received state with zero drift, even though it passed through DEPLETED and through a scrap booking"
            - "checkpoint 3: DealerOrder.${o_base_id}.production_status == QUEUED - the KITTED -> QUEUED compensating edge fired, and the order did not land in DRAFT"
            - "the second void of RollFormingRun.${run1_id} returns HTTP 409 with error_id ERR_RUN_STATE_INVALID and CoilLot.${cl1_id}.remaining_kg stays 20000.0 - a repeated compensation cannot push mass above received_kg"

      - name: cancelling_confirmed_orders_restores_the_dealer_credit_conservation_identity_without_double_release
        grounds:
          - calculations.dealer_credit_ledger
          - state_machines.DealerOrder.to_CANCELLED
          - calculations.order_price_and_credit
          - endpoints[POST /dealer-orders/{id}/cancel]
        distinguishing_aspect: |
          A different conserved quantity - MONEY in whole cents on a Dealer, held by
          credit_committed_cents == the sum of credit_hold_cents over that dealer's orders in
          {QUEUED, KITTED, SHIPPED, HOLD_CREDIT, HOLD_ENGINEERING} with
          credit_available_cents == credit_limit_cents - credit_committed_cents. Unlike the coil-mass
          identity, this one is double-booked: cancel BOTH zeroes the order's credit_hold_cents AND
          re-derives the sum, so an implementation that does either one without the other drifts in
          opposite directions. It also has a member that is priced but never committed - a DRAFT order
          carries a populated credit_hold_cents yet contributes nothing, so cancelling it must move the
          ledger by exactly zero.
