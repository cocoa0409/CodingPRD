scenario: "desgin task harder than expert level.!!!! 2140. 403(b) & 457 Plan Administration: eligibility & universal availability notice requirement, multiple-vendor coordination & information sharing agreement, contribution limit aggregation across vendors & special catch-up computation, loan & hardship approval with vendor data, plan-to-plan transfer & exchange rules, 457(b) unforeseeable emergency standard, nondiscrimination applicability differences, remittance timing & correction"
domain_name: "403b-457-plan-administration"
api_prefix: "/plan-admin"

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: quota_allocation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers

  entity_topology: graph
  # Participant x Plan x Vendor form a many-to-many mesh joined by VendorAccount and
  # InformationSharingAgreement; ContributionElection is additionally self-referential
  # through supersedes_election_id, and TransferExchangeRequest links two Plan nodes and
  # two VendorAccount nodes in a single row.

  state_machine_shape: cyclic
  # ISA (ACTIVE <-> SUSPENDED), ParticipantRequest (UNDER_REVIEW -> RETURNED_FOR_INFO ->
  # SUBMITTED), TransferExchangeRequest (SUBMITTED -> REJECTED_BY_VENDOR -> SUBMITTED),
  # Plan (ACTIVE <-> FROZEN) and RemittanceBatch.deposit_state (DEPOSITED <-> REVERSED)
  # all loop; RemittanceBatch additionally carries two independent state axes.

  relationship_patterns:
    - one_to_many
    - many_to_many
    - self_referential
    - cross_aggregate

  role_model: segregation_of_duties
  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# ---------------------------------------------------------------------------
# 1.1 Entity-Relationship Table
# ---------------------------------------------------------------------------
entities:
  - name: Employer
    parent: null
    common_fields: true
    fields:
      - name: legal_name
        type: string
        source: input
        description: Legal name of the plan sponsor.
      - name: ein
        type: string
        source: input
        description: Employer identification number, unique across Employer rows.
        constraints: "unique; format NN-NNNNNNN"
      - name: entity_type
        type: enum
        source: input
        description: Statutory character of the sponsor; drives nondiscrimination regime.
        constraints: "one of PUBLIC_SCHOOL, TAX_EXEMPT_501C3, GOVERNMENTAL_NON_SCHOOL, CHURCH"
      - name: organization_subtype
        type: enum
        source: input
        description: Sub-classification used only by the 15-year special catch-up qualified-organization test.
        constraints: "one of SCHOOL, HOSPITAL, HOME_HEALTH_AGENCY, HEALTH_AND_WELFARE_AGENCY, CHURCH_ORG, OTHER"
      - name: total_employee_count
        type: integer
        source: input
        description: Headcount reported by the sponsor.
        constraints: ">= 0"
      - name: is_governmental
        type: boolean
        source: computed
        description: "True iff entity_type IN {PUBLIC_SCHOOL, GOVERNMENTAL_NON_SCHOOL}."
      - name: is_qualified_organization
        type: boolean
        source: computed
        description: "True iff entity_type IN {PUBLIC_SCHOOL, CHURCH} OR (entity_type == TAX_EXEMPT_501C3 AND organization_subtype IN {HOSPITAL, HOME_HEALTH_AGENCY, HEALTH_AND_WELFARE_AGENCY}). Gate for the 403(b) 15-year service catch-up."

  - name: Plan
    parent: Employer
    common_fields: true
    fields:
      - name: employer_id
        type: string
        source: input
        description: "FK -> Employer.id; the sponsor maintaining this plan."
      - name: plan_name
        type: string
        source: input
        description: Sponsor-assigned plan name.
      - name: plan_type
        type: enum
        source: input
        description: Statutory plan flavour; also the 402(g)/457(e)(15) aggregation bucket key.
        constraints: "one of PLAN_403B, PLAN_457B"
      - name: plan_year
        type: integer
        source: input
        description: Calendar plan year this plan record governs.
        constraints: "2000 <= plan_year <= 2100"
      - name: reported_participant_count
        type: integer
        source: input
        description: Participant count as of the first day of the plan year; sole input to the small-plan test.
        constraints: ">= 0"
      - name: status
        type: enum
        source: system
        description: Lifecycle state of the plan.
        default: DRAFT
        constraints: "one of DRAFT, ACTIVE, FROZEN, TERMINATED"
      - name: is_small_plan
        type: boolean
        source: computed
        description: "True iff reported_participant_count < SMALL_PLAN_PARTICIPANT_THRESHOLD (100). Selects the 7-business-day remittance safe harbour."
      - name: is_governmental_457
        type: boolean
        source: computed
        description: "True iff plan_type == PLAN_457B AND Employer.is_governmental. Governmental 457(b) plans alone may offer the age-50 catch-up."
      - name: nondiscrimination_regime
        type: enum
        source: computed
        description: Which coverage/nondiscrimination body of rules attaches to this plan.
        constraints: "one of UA_ONLY, UA_PLUS_410B_401A4, GOVERNMENTAL_457_ALL_EMPLOYEES, TOP_HAT_457, CHURCH_EXEMPT"
      - name: permits_loans
        type: boolean
        source: input
        description: Plan document permits participant loans.
        default: true
      - name: permits_hardship
        type: boolean
        source: input
        description: Plan document permits 403(b) hardship distributions.
        default: true
      - name: permits_unforeseeable_emergency
        type: boolean
        source: input
        description: Plan document permits 457(b) unforeseeable emergency withdrawals.
        default: true
      - name: permits_contract_exchanges
        type: boolean
        source: input
        description: Plan document permits intra-plan contract exchanges between approved vendors.
        default: true
      - name: permits_incoming_transfers
        type: boolean
        source: input
        description: Plan document accepts plan-to-plan transfers in.
        default: true
      - name: permits_outgoing_transfers
        type: boolean
        source: input
        description: Plan document permits plan-to-plan transfers out.
        default: true
      - name: open_correction_count
        type: integer
        source: computed
        description: "Count of RemittanceCorrection rows with state == OPEN across every RemittanceBatch whose plan_id equals this Plan.id."
        default: 0
      - name: compliance_posture
        type: enum
        source: computed
        description: "UNDER_CORRECTION iff open_correction_count > 0, otherwise CLEAR. Gates TransferExchangeRequest approval."
        default: CLEAR
        constraints: "one of CLEAR, UNDER_CORRECTION"
      - name: projected_excess_participant_count
        type: integer
        source: computed
        description: "Count of distinct Participant rows holding an EFFECTIVE ContributionElection on this plan whose Participant.projected_annual_deferral_cents exceeds the participant's total_limit_cents for this plan's bucket."
        default: 0

  - name: Vendor
    parent: null
    common_fields: true
    fields:
      - name: legal_name
        type: string
        source: input
        description: Legal name of the annuity/custodial provider.
      - name: vendor_code
        type: string
        source: input
        description: Short provider code, unique across Vendor rows.
        constraints: "unique"
      - name: contact_email
        type: string
        source: input
        description: Operational contact for information sharing.

  - name: InformationSharingAgreement
    parent: Plan
    common_fields: true
    fields:
      - name: plan_id
        type: string
        source: input
        description: "FK -> Plan.id; the plan whose sponsor signed this agreement."
      - name: vendor_id
        type: string
        source: input
        description: "FK -> Vendor.id; the provider bound by this agreement."
      - name: status
        type: enum
        source: system
        description: Agreement lifecycle state.
        default: PENDING
        constraints: "one of PENDING, ACTIVE, SUSPENDED, TERMINATED"
      - name: effective_from
        type: string
        source: input
        description: Inclusive first date the agreement covers (ISO 8601 date).
      - name: effective_through
        type: string
        source: input
        description: Inclusive last date the agreement covers (ISO 8601 date).
        constraints: "effective_through >= effective_from"
      - name: shares_loan_data
        type: boolean
        source: input
        description: Provider shares outstanding-loan and highest-balance data under this agreement.
        default: true
      - name: shares_hardship_data
        type: boolean
        source: input
        description: Provider shares hardship/unforeseeable-emergency substantiation data.
        default: true
      - name: shares_contribution_data
        type: boolean
        source: input
        description: Provider shares elective-deferral history used for 402(g) aggregation.
        default: true
      - name: data_current_through_date
        type: string
        source: system
        description: Latest date covered by a provider data feed; null until the first feed is posted.
        default: null
      - name: data_stale
        type: boolean
        source: computed
        description: "True iff data_current_through_date IS NULL OR (current logical clock date - data_current_through_date) > ISA_DATA_STALENESS_DAYS (45)."

  - name: Participant
    parent: Employer
    common_fields: true
    fields:
      - name: employer_id
        type: string
        source: input
        description: "FK -> Employer.id; the employer of record."
      - name: full_name
        type: string
        source: input
        description: Participant name.
      - name: date_of_birth
        type: string
        source: input
        description: ISO 8601 date of birth.
      - name: hire_date
        type: string
        source: input
        description: ISO 8601 date of hire.
      - name: employment_status
        type: enum
        source: input
        description: Current employment relationship.
        default: ACTIVE
        constraints: "one of ACTIVE, TERMINATED"
      - name: termination_date
        type: string
        source: input
        description: ISO 8601 separation date; null while employment_status == ACTIVE.
        default: null
      - name: scheduled_hours_per_week
        type: number
        source: input
        description: Normally scheduled weekly hours; input to the universal-availability part-time exclusion.
        constraints: ">= 0"
      - name: prior_year_hours_worked
        type: integer
        source: input
        description: Hours actually worked in the prior plan year; second prong of the part-time exclusion.
        constraints: ">= 0"
      - name: is_student_performing_services
        type: boolean
        source: input
        description: Student performing services described in section 3121(b)(10).
        default: false
      - name: is_nonresident_alien_no_us_income
        type: boolean
        source: input
        description: Nonresident alien with no US-source income from the employer.
        default: false
      - name: is_select_management_or_hce
        type: boolean
        source: input
        description: Member of the select group of management or highly compensated employees; required for TOP_HAT_457 participation.
        default: false
      - name: includible_compensation_cents
        type: integer
        source: input
        description: Includible compensation for the plan year, in cents; ceiling component of the 415(c) limit.
        constraints: ">= 0"
      - name: years_of_service
        type: number
        source: input
        description: Full years of service with the qualified organization; gate and multiplier for the 15-year special catch-up.
        constraints: ">= 0"
      - name: prior_employer_elective_deferrals_cents
        type: integer
        source: input
        description: Elective deferrals made to prior-employer 403(b) arrangements, in cents; enters lifetime_elective_deferrals_cents.
        default: 0
      - name: underutilized_prior_limit_cents
        type: integer
        source: input
        description: Unused 457(b) deferral limit carried from prior years, in cents; input to the final-three-year catch-up.
        default: 0
      - name: cumulative_special_catchup_used_cents
        type: integer
        source: input
        description: Lifetime 403(b) 15-year special catch-up already consumed, in cents. Seeded at creation from prior-administrator history and incremented by ContributionElection approval.
        default: 0
      - name: attained_age_at_year_end
        type: integer
        source: computed
        description: "(calendar year of the current logical clock) - (calendar year of date_of_birth). Drives the age-50 and final-three-year catch-up gates."
      - name: lifetime_elective_deferrals_cents
        type: integer
        source: computed
        description: "prior_employer_elective_deferrals_cents + SUM over VendorAccount rows of this participant with status == OPEN whose Plan.plan_type == PLAN_403B of (prior_years_elective_deferrals_cents + ytd_elective_deferrals_cents)."
      - name: ytd_elective_deferrals_all_vendors_cents
        type: integer
        source: computed
        description: "SUM of VendorAccount.ytd_elective_deferrals_cents over this participant's OPEN accounts, grouped by the plan_type bucket of the account's Plan."
      - name: total_accumulated_benefit_cents
        type: integer
        source: computed
        description: "SUM of VendorAccount.accumulated_benefit_cents over this participant's OPEN accounts."
      - name: total_vested_balance_cents
        type: integer
        source: computed
        description: "SUM of VendorAccount.vested_balance_cents over this participant's OPEN accounts."
      - name: total_outstanding_loan_balance_cents
        type: integer
        source: computed
        description: "SUM of VendorAccount.outstanding_loan_balance_cents over this participant's OPEN accounts."
      - name: highest_outstanding_loan_12mo_cents
        type: integer
        source: computed
        description: "SUM of VendorAccount.highest_outstanding_loan_12mo_cents over this participant's OPEN accounts."
      - name: loan_eligibility_flag
        type: enum
        source: computed
        description: "SUSPENDED iff total_outstanding_loan_balance_cents > 0 AND loan_maximum_available evaluates to 0 for every PLAN_403B/PLAN_457B bucket the participant holds an OPEN account in; otherwise AVAILABLE. A participant who has never borrowed is never SUSPENDED, however small the vested balance — that case is caught by ERR_NO_VESTED_BALANCE instead."
        default: AVAILABLE
        constraints: "one of AVAILABLE, SUSPENDED"
      - name: projected_annual_deferral_cents
        type: integer
        source: computed
        description: "SUM of annual_deferral_amount_cents over this participant's ContributionElection rows in state EFFECTIVE."
        default: 0

  - name: UniversalAvailabilityNotice
    parent: Plan
    common_fields: false
    fields:
      - name: plan_id
        type: string
        source: input
        description: "FK -> Plan.id; the 403(b) plan the notice covers."
      - name: plan_year
        type: integer
        source: input
        description: Plan year the notice is issued for.
      - name: issued_date
        type: string
        source: input
        description: ISO 8601 date the notice was issued; must not be after the logical clock date.
      - name: delivery_method
        type: enum
        source: input
        description: How the notice reached employees.
        constraints: "one of EMAIL, PAPER_MAIL, INTRANET_POSTING, HAND_DELIVERY"
      - name: recipient_count
        type: integer
        source: input
        description: Number of employees the notice actually reached.
        constraints: ">= 0"
      - name: describes_effective_opportunity
        type: boolean
        source: input
        description: Notice states the effective opportunity to defer, including how and when to elect.
      - name: is_valid
        type: boolean
        source: computed
        description: "True iff describes_effective_opportunity == true AND recipient_count >= Plan.reported_participant_count AND delivery_method != INTRANET_POSTING. Intranet posting alone is never an effective notice."

  - name: EligibilityDetermination
    parent: Plan
    common_fields: true
    fields:
      - name: plan_id
        type: string
        source: input
        description: "FK -> Plan.id; the plan the determination is made against."
      - name: participant_id
        type: string
        source: input
        description: "FK -> Participant.id; the employee being tested."
      - name: asserted_exclusion
        type: enum
        source: input
        description: Exclusion the sponsor asserts; the server re-derives it and rejects an assertion the participant's facts do not support.
        default: NONE
        constraints: "one of NONE, STUDENT, LESS_THAN_20_HOURS, NONRESIDENT_ALIEN, NOT_TOP_HAT_GROUP"
      - name: determined_at
        type: datetime
        source: system
        description: Logical clock instant at which the determination was made.
      - name: determined_by_user_id
        type: string
        source: system
        description: X-User-ID of the ComplianceOfficer who ran the determination.
      - name: status
        type: enum
        source: computed
        description: Derived eligibility outcome.
        constraints: "one of ELIGIBLE, EXCLUDED_STUDENT, EXCLUDED_LESS_THAN_20_HOURS, EXCLUDED_NONRESIDENT_ALIEN, EXCLUDED_NOT_TOP_HAT_GROUP, INELIGIBLE_PLAN_NOT_ACTIVE"
      - name: exclusion_basis
        type: string
        source: computed
        description: Human-readable citation of the exclusion applied; null when status == ELIGIBLE.
        default: null
      - name: notice_status
        type: enum
        source: computed
        description: "CURRENT iff a UniversalAvailabilityNotice with is_valid == true exists for (plan_id, Plan.plan_year); INVALID iff a notice exists for that pair but none is valid; MISSING iff no notice exists. Always CURRENT when universal_availability_applies == false."
        constraints: "one of CURRENT, INVALID, MISSING"
      - name: universal_availability_applies
        type: boolean
        source: computed
        description: "True iff Plan.nondiscrimination_regime IN {UA_ONLY, UA_PLUS_410B_401A4}."
      - name: superseded
        type: boolean
        source: system
        description: Set true on every earlier determination for the same (plan_id, participant_id) when a new one is created.
        default: false

  - name: VendorAccount
    parent: Participant
    common_fields: true
    fields:
      - name: participant_id
        type: string
        source: input
        description: "FK -> Participant.id; the account owner."
      - name: plan_id
        type: string
        source: input
        description: "FK -> Plan.id; the plan under which the contract is held."
      - name: vendor_id
        type: string
        source: input
        description: "FK -> Vendor.id; the provider holding the contract."
      - name: contract_number
        type: string
        source: input
        description: Provider contract identifier.
      - name: accumulated_benefit_cents
        type: integer
        source: system
        description: Provider-reported accumulated benefit in cents; moved by exchanges and transfers.
        default: 0
      - name: vested_percentage_bps
        type: integer
        source: input
        description: Vested percentage in basis points.
        default: 10000
        constraints: "0 <= vested_percentage_bps <= 10000"
      - name: vested_balance_cents
        type: integer
        source: computed
        description: "floor(accumulated_benefit_cents * vested_percentage_bps / 10000)."
      - name: outstanding_loan_balance_cents
        type: integer
        source: system
        description: Current outstanding participant-loan principal on this contract, in cents.
        default: 0
      - name: highest_outstanding_loan_12mo_cents
        type: integer
        source: system
        description: Highest outstanding loan balance on this contract during the trailing LOAN_LOOKBACK_DAYS window, in cents.
        default: 0
      - name: ytd_elective_deferrals_cents
        type: integer
        source: system
        description: Elective deferrals credited to this contract in the current plan year, in cents.
        default: 0
      - name: ytd_employer_contributions_cents
        type: integer
        source: system
        description: Employer nonelective/matching contributions credited in the current plan year, in cents.
        default: 0
      - name: prior_years_elective_deferrals_cents
        type: integer
        source: input
        description: Provider-reported elective deferrals credited in all prior plan years, in cents.
        default: 0
      - name: pending_lost_earnings_cents
        type: integer
        source: system
        description: Lost earnings allocated to this contract by OPEN RemittanceCorrection rows, in cents.
        default: 0
      - name: last_balance_report_date
        type: string
        source: system
        description: as_of_date of the most recent provider balance report; null until the first report.
        default: null
      - name: status
        type: enum
        source: system
        description: Contract status.
        default: OPEN
        constraints: "one of OPEN, CLOSED"

  - name: ContributionElection
    parent: Participant
    common_fields: true
    fields:
      - name: participant_id
        type: string
        source: input
        description: "FK -> Participant.id; the electing employee."
      - name: plan_id
        type: string
        source: input
        description: "FK -> Plan.id; the plan the deferral is made under."
      - name: vendor_account_id
        type: string
        source: input
        description: "FK -> VendorAccount.id; the contract the deferral is directed to."
      - name: supersedes_election_id
        type: string
        source: input
        description: "FK -> ContributionElection.id; the EFFECTIVE election this one replaces, or null when there is none."
        default: null
      - name: annual_deferral_amount_cents
        type: integer
        source: input
        description: Elected annual elective deferral for the window, in cents.
        constraints: "> 0"
      - name: effective_from
        type: string
        source: input
        description: Inclusive first date of the election window (ISO 8601 date).
      - name: effective_through
        type: string
        source: input
        description: Inclusive last date of the election window (ISO 8601 date).
        constraints: "effective_through >= effective_from"
      - name: catchup_election
        type: enum
        source: input
        description: Catch-up buckets the participant elects to use.
        default: NONE
        constraints: "one of NONE, AGE_50, SERVICE_15_YEAR, FINAL_3_YEAR, AGE_50_AND_SERVICE_15_YEAR"
      - name: state
        type: enum
        source: system
        description: Election lifecycle state.
        default: SUBMITTED
        constraints: "one of SUBMITTED, EFFECTIVE, REJECTED, SUPERSEDED, REVOKED"
      - name: basic_deferral_attributed_cents
        type: integer
        source: computed
        description: Portion of annual_deferral_amount_cents attributed to the basic 402(g)/457(e)(15) limit at approval, in cents.
        default: 0
      - name: service_catchup_attributed_cents
        type: integer
        source: computed
        description: Portion attributed to the 403(b) 15-year service catch-up at approval, in cents.
        default: 0
      - name: age50_catchup_attributed_cents
        type: integer
        source: computed
        description: Portion attributed to the age-50 catch-up at approval, in cents.
        default: 0
      - name: final3yr_catchup_attributed_cents
        type: integer
        source: computed
        description: Portion attributed to the 457(b) final-three-year catch-up at approval, in cents.
        default: 0
      - name: submitted_by_user_id
        type: string
        source: system
        description: X-User-ID of the actor that created the election.
      - name: approved_by_user_id
        type: string
        source: system
        description: X-User-ID of the ComplianceOfficer that approved or rejected the election; null until decided.
        default: null

  - name: RemittanceBatch
    parent: Plan
    common_fields: true
    fields:
      - name: plan_id
        type: string
        source: input
        description: "FK -> Plan.id; the plan whose deferrals are being remitted."
      - name: pay_period_start
        type: string
        source: input
        description: Inclusive first date of the pay period (ISO 8601 date).
      - name: pay_period_end
        type: string
        source: input
        description: EXCLUSIVE end date of the pay period (ISO 8601 date); pay periods are half-open [start, end).
        constraints: "pay_period_end > pay_period_start"
      - name: withholding_date
        type: string
        source: input
        description: Date the amounts were withheld from pay; anchor of the remittance deadline.
      - name: total_elective_deferral_cents
        type: integer
        source: input
        description: Sponsor-declared total elective deferral for the batch, in cents; must equal the sum of line_items elective_deferral_cents.
        constraints: ">= 0"
      - name: line_items
        type: array
        source: input
        description: "Per-contract breakdown; each element is { vendor_account_id, elective_deferral_cents, employer_contribution_cents }. Ordered by the sponsor and processed in submitted order."
        constraints: "length >= 1"
      - name: segregation_feasible_date
        type: string
        source: input
        description: Earliest date the sponsor could reasonably segregate the assets; only consulted for large plans.
        default: null
      - name: deposit_state
        type: enum
        source: system
        description: Cash-movement axis of the batch.
        default: WITHHELD
        constraints: "one of WITHHELD, DEPOSITED, REVERSED"
      - name: compliance_state
        type: enum
        source: system
        description: Timeliness axis of the batch, evolving independently of deposit_state.
        default: UNDETERMINED
        constraints: "one of UNDETERMINED, TIMELY, LATE, CORRECTION_PENDING, CORRECTED"
      - name: deposit_date
        type: string
        source: system
        description: Date the deposit was recorded; null until deposited.
        default: null
      - name: deadline_date
        type: string
        source: computed
        description: Deadline produced by the remittance_deadline calculation, in ISO 8601 date form.
      - name: calendar_days_late
        type: integer
        source: computed
        description: "max(0, deposit_date - deadline_date) in calendar days; 0 while TIMELY or UNDETERMINED."
        default: 0
      - name: business_days_late
        type: integer
        source: computed
        description: Count of business days strictly after deadline_date through deposit_date inclusive; 0 while TIMELY or UNDETERMINED.
        default: 0

  - name: RemittanceCorrection
    parent: RemittanceBatch
    common_fields: true
    fields:
      - name: remittance_batch_id
        type: string
        source: input
        description: "FK -> RemittanceBatch.id; the late batch being corrected."
      - name: lost_earnings_total_cents
        type: integer
        source: computed
        description: Total lost earnings owed, in cents, produced by the lost_earnings_correction calculation.
      - name: excise_tax_cents
        type: integer
        source: computed
        description: Section 4975 excise tax on the amount involved, in cents.
      - name: line_breakdown
        type: array
        source: computed
        description: "Per-contract allocation; each element is { vendor_account_id, lost_earnings_cents }, emitted in the same order as the batch's line_items."
      - name: state
        type: enum
        source: system
        description: Correction lifecycle state.
        default: OPEN
        constraints: "one of OPEN, SETTLED, VOIDED"
      - name: settlement_reference
        type: string
        source: system
        description: Reference recorded when the correction is settled; null while OPEN or VOIDED.
        default: null
      - name: settled_at
        type: datetime
        source: system
        description: Logical clock instant of settlement; null while OPEN or VOIDED.
        default: null
      - name: settled_by_user_id
        type: string
        source: system
        description: X-User-ID of the ComplianceOfficer who settled the correction; null while OPEN or VOIDED.
        default: null

  - name: ParticipantRequest
    parent: Participant
    common_fields: true
    fields:
      - name: participant_id
        type: string
        source: input
        description: "FK -> Participant.id; the requesting employee."
      - name: plan_id
        type: string
        source: input
        description: "FK -> Plan.id; the plan the request is made under."
      - name: vendor_account_id
        type: string
        source: input
        description: "FK -> VendorAccount.id; the contract the money would come from."
      - name: request_type
        type: enum
        source: input
        description: Which distribution or loan standard applies.
        constraints: "one of LOAN, HARDSHIP, UNFORESEEABLE_EMERGENCY"
      - name: requested_amount_cents
        type: integer
        source: input
        description: Amount the participant asks for, in cents.
        constraints: "> 0"
      - name: stated_need_cents
        type: integer
        source: input
        description: Immediate and heavy financial need (403(b)) or unforeseeable emergency need (457(b)), in cents.
        default: 0
      - name: estimated_taxes_cents
        type: integer
        source: input
        description: Federal, state and local taxes and penalties reasonably anticipated on the distribution, in cents.
        default: 0
      - name: safe_harbor_reason
        type: enum
        source: input
        description: Deemed-immediate-and-heavy safe harbour event for a 403(b) hardship.
        default: NONE
        constraints: "one of NONE, MEDICAL_EXPENSES, PURCHASE_PRINCIPAL_RESIDENCE, TUITION, PREVENT_EVICTION, FUNERAL, CASUALTY_REPAIR, DISASTER"
      - name: emergency_reason
        type: enum
        source: input
        description: Asserted 457(b) unforeseeable emergency. COLLEGE_TUITION and PURCHASE_OF_HOME are expressly NOT unforeseeable emergencies.
        default: NONE
        constraints: "one of NONE, ILLNESS_OF_PARTICIPANT_OR_DEPENDENT, LOSS_OF_PROPERTY_CASUALTY, IMMINENT_FORECLOSURE_OR_EVICTION, FUNERAL_EXPENSES, EXTRAORDINARY_MEDICAL, COLLEGE_TUITION, PURCHASE_OF_HOME"
      - name: insurance_reimbursement_available_cents
        type: integer
        source: input
        description: Relief available through insurance or other reimbursement, in cents.
        default: 0
      - name: liquidatable_assets_cents
        type: integer
        source: input
        description: Relief available by liquidating the participant's assets without itself causing hardship, in cents.
        default: 0
      - name: deferral_cessation_relief_cents
        type: integer
        source: input
        description: Relief available by ceasing deferrals under the plan, in cents.
        default: 0
      - name: loan_term_months
        type: integer
        source: input
        description: Requested amortisation term for a LOAN request, in months.
        default: null
      - name: state
        type: enum
        source: system
        description: Request lifecycle state.
        default: SUBMITTED
        constraints: "one of SUBMITTED, UNDER_REVIEW, RETURNED_FOR_INFO, APPROVED, DENIED, DISBURSED, PAID"
      - name: max_approvable_cents
        type: integer
        source: computed
        description: Ceiling produced by loan_maximum_available or distribution_max_approvable at the moment of approval, in cents.
        default: null
      - name: approved_amount_cents
        type: integer
        source: computed
        description: Amount actually approved, in cents; null until APPROVED.
        default: null
      - name: submitted_by_user_id
        type: string
        source: system
        description: X-User-ID of the actor that created or last resubmitted the request.
      - name: reviewed_by_user_id
        type: string
        source: system
        description: X-User-ID of the ComplianceOfficer who opened review; null until BEGIN_REVIEW.
        default: null
      - name: decided_by_user_id
        type: string
        source: system
        description: X-User-ID of the ComplianceOfficer who approved or denied; null until decided.
        default: null
      - name: resubmission_count
        type: integer
        source: system
        description: Number of times the request has re-entered SUBMITTED from RETURNED_FOR_INFO.
        default: 0
      - name: denial_reason
        type: string
        source: system
        description: Free-text reason recorded on denial; null otherwise.
        default: null
      - name: fulfillment_date
        type: string
        source: system
        description: Date the loan was disbursed or the distribution paid; null until fulfilled.
        default: null

  - name: TransferExchangeRequest
    parent: Participant
    common_fields: true
    fields:
      - name: participant_id
        type: string
        source: input
        description: "FK -> Participant.id; the account owner moving money."
      - name: request_kind
        type: enum
        source: input
        description: Which body of movement rules applies.
        constraints: "one of CONTRACT_EXCHANGE, PLAN_TO_PLAN_TRANSFER"
      - name: source_plan_id
        type: string
        source: input
        description: "FK -> Plan.id; the plan the money leaves."
      - name: destination_plan_id
        type: string
        source: input
        description: "FK -> Plan.id; the plan the money arrives in. Equal to source_plan_id for a CONTRACT_EXCHANGE."
      - name: source_vendor_account_id
        type: string
        source: input
        description: "FK -> VendorAccount.id; the contract the money leaves."
      - name: destination_vendor_account_id
        type: string
        source: input
        description: "FK -> VendorAccount.id; the contract the money arrives in."
      - name: amount_cents
        type: integer
        source: input
        description: Amount to move, in cents.
        constraints: "> 0"
      - name: state
        type: enum
        source: system
        description: Request lifecycle state.
        default: SUBMITTED
        constraints: "one of SUBMITTED, ACCEPTED_BY_VENDOR, REJECTED_BY_VENDOR, APPROVED, DENIED, EXECUTED, REVERSED"
      - name: vendor_rejection_reason
        type: string
        source: system
        description: Reason recorded by the receiving provider on rejection; null otherwise.
        default: null
      - name: denial_reason
        type: string
        source: system
        description: Reason recorded by the ComplianceOfficer on denial; null otherwise.
        default: null
      - name: pre_move_source_benefit_cents
        type: integer
        source: system
        description: Snapshot of source VendorAccount.accumulated_benefit_cents taken at execution; null until EXECUTED.
        default: null
      - name: pre_move_destination_benefit_cents
        type: integer
        source: system
        description: Snapshot of destination VendorAccount.accumulated_benefit_cents taken at execution; null until EXECUTED.
        default: null
      - name: executed_at
        type: datetime
        source: system
        description: Logical clock instant of execution; null until EXECUTED.
        default: null
      - name: resubmit_count
        type: integer
        source: system
        description: Number of times the request has returned to SUBMITTED from REJECTED_BY_VENDOR.
        default: 0

# ---------------------------------------------------------------------------
# 1.2 State Machine Table
# ---------------------------------------------------------------------------
state_machines:
  - entity: Plan
    initial_state: DRAFT
    terminal_states: [TERMINATED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /plan-admin/plans/{id}/status with to_status = ACTIVE"
        actor: PlanSponsorAdmin
        preconditions:
          - "Plan.status == DRAFT"
          - "X-User-ID equals Plan.employer_id"
        side_effects:
          - "recompute Plan.nondiscrimination_regime from Employer.entity_type and Plan.plan_type"
          - "recompute Plan.is_small_plan and Plan.is_governmental_457"
          - "increments Plan.version by 1"
      - from: ACTIVE
        to: FROZEN
        trigger: "POST /plan-admin/plans/{id}/status with to_status = FROZEN"
        actor: PlanSponsorAdmin
        preconditions:
          - "Plan.status == ACTIVE"
        side_effects:
          - "no ContributionElection may be created or approved against this plan while FROZEN"
          - "no RemittanceBatch may be created against this plan while FROZEN"
          - "no ParticipantRequest with request_type == LOAN may be created against this plan while FROZEN"
          - "increments Plan.version by 1"
        note: "HARDSHIP and UNFORESEEABLE_EMERGENCY requests and TransferExchangeRequests remain available while FROZEN."
      - from: FROZEN
        to: ACTIVE
        trigger: "POST /plan-admin/plans/{id}/status with to_status = ACTIVE"
        actor: PlanSponsorAdmin
        preconditions:
          - "Plan.status == FROZEN"
        side_effects:
          - "increments Plan.version by 1"
        note: "Cycle: ACTIVE -> FROZEN -> ACTIVE may repeat any number of times."
      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /plan-admin/plans/{id}/status with to_status = TERMINATED"
        actor: PlanSponsorAdmin
        preconditions:
          - "Plan.status == ACTIVE"
          - "Plan.open_correction_count == 0"
        side_effects:
          - "every ContributionElection of this plan in state SUBMITTED or EFFECTIVE transitions to REVOKED"
          - "every InformationSharingAgreement of this plan in status PENDING, ACTIVE or SUSPENDED transitions to TERMINATED"
          - "every VendorAccount of this plan whose status is OPEN transitions to CLOSED and therefore leaves every aggregation set"
          - "increments Plan.version by 1"
      - from: FROZEN
        to: TERMINATED
        trigger: "POST /plan-admin/plans/{id}/status with to_status = TERMINATED"
        actor: PlanSponsorAdmin
        preconditions:
          - "Plan.status == FROZEN"
          - "Plan.open_correction_count == 0"
        side_effects:
          - "every ContributionElection of this plan in state SUBMITTED or EFFECTIVE transitions to REVOKED"
          - "every InformationSharingAgreement of this plan in status PENDING, ACTIVE or SUSPENDED transitions to TERMINATED"
          - "every VendorAccount of this plan whose status is OPEN transitions to CLOSED and therefore leaves every aggregation set"
          - "increments Plan.version by 1"

  - entity: InformationSharingAgreement
    initial_state: PENDING
    terminal_states: [TERMINATED]
    transitions:
      - from: PENDING
        to: ACTIVE
        trigger: "POST /plan-admin/information-sharing-agreements/{id}/status with to_status = ACTIVE"
        actor: PlanSponsorAdmin
        preconditions:
          - "InformationSharingAgreement.status == PENDING"
          - "Plan.status IN {ACTIVE, FROZEN}"
        side_effects:
          - "increments InformationSharingAgreement.version by 1"
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /plan-admin/information-sharing-agreements/{id}/status with to_status = SUSPENDED"
        actor: PlanSponsorAdmin
        preconditions:
          - "InformationSharingAgreement.status == ACTIVE"
        side_effects:
          - "every VendorAccount whose (plan_id, vendor_id) matches this agreement stops counting as verified for deferral_limit_aggregate_402g's verified variant"
          - "loan_maximum_available refuses to evaluate for any participant holding such an account"
          - "increments InformationSharingAgreement.version by 1"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /plan-admin/information-sharing-agreements/{id}/status with to_status = ACTIVE, or POST /plan-admin/information-sharing-agreements/{id}/data-feed"
        actor: PlanSponsorAdmin | VendorRepresentative
        preconditions:
          - "InformationSharingAgreement.status == SUSPENDED"
        side_effects:
          - "when triggered by data-feed, data_current_through_date is set to the posted value and data_stale is recomputed"
          - "increments InformationSharingAgreement.version by 1"
        note: "Cycle: ACTIVE -> SUSPENDED -> ACTIVE may repeat any number of times."
      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /plan-admin/information-sharing-agreements/{id}/status with to_status = TERMINATED"
        actor: PlanSponsorAdmin
        preconditions:
          - "InformationSharingAgreement.status == ACTIVE"
        side_effects:
          - "the vendor ceases to be an approved vendor for CONTRACT_EXCHANGE into this plan"
          - "increments InformationSharingAgreement.version by 1"
      - from: SUSPENDED
        to: TERMINATED
        trigger: "POST /plan-admin/information-sharing-agreements/{id}/status with to_status = TERMINATED"
        actor: PlanSponsorAdmin
        preconditions:
          - "InformationSharingAgreement.status == SUSPENDED"
        side_effects:
          - "the vendor ceases to be an approved vendor for CONTRACT_EXCHANGE into this plan"
          - "increments InformationSharingAgreement.version by 1"
      - from: PENDING
        to: TERMINATED
        trigger: "POST /plan-admin/information-sharing-agreements/{id}/status with to_status = TERMINATED"
        actor: PlanSponsorAdmin
        preconditions:
          - "InformationSharingAgreement.status == PENDING"
        side_effects:
          - "increments InformationSharingAgreement.version by 1"

  - entity: ContributionElection
    initial_state: SUBMITTED
    terminal_states: [REJECTED, SUPERSEDED, REVOKED]
    transitions:
      - from: SUBMITTED
        to: EFFECTIVE
        trigger: "POST /plan-admin/contribution-elections/{id}/decision with decision = APPROVE"
        actor: ComplianceOfficer
        preconditions:
          - "ContributionElection.state == SUBMITTED"
          - "Plan.status == ACTIVE"
          - "the latest non-superseded EligibilityDetermination for (plan_id, participant_id) has status == ELIGIBLE"
          - "that determination's notice_status == CURRENT"
          - "X-User-ID differs from that determination's determined_by_user_id"
          - "deferral_attribution_order leaves no unattributed remainder"
        side_effects:
          - "run deferral_attribution_order and write basic_deferral_attributed_cents, service_catchup_attributed_cents, age50_catchup_attributed_cents and final3yr_catchup_attributed_cents"
          - "Participant.cumulative_special_catchup_used_cents += service_catchup_attributed_cents"
          - "when supersedes_election_id is non-null, that election transitions EFFECTIVE -> SUPERSEDED and its effective_through is truncated to (this election's effective_from minus one day)"
          - "CASCADE hop 2: the supersede in turn forces Participant.projected_annual_deferral_cents to be recomputed as the sum of annual_deferral_amount_cents over the participant's EFFECTIVE elections"
          - "CASCADE hop 3: the new projected_annual_deferral_cents forces Plan.projected_excess_participant_count to be recomputed"
          - "approved_by_user_id is set to X-User-ID"
          - "increments ContributionElection.version by 1"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /plan-admin/contribution-elections/{id}/decision with decision = REJECT"
        actor: ComplianceOfficer
        preconditions:
          - "ContributionElection.state == SUBMITTED"
        side_effects:
          - "approved_by_user_id is set to X-User-ID"
          - "no attribution is written and Participant.cumulative_special_catchup_used_cents is unchanged"
          - "increments ContributionElection.version by 1"
      - from: EFFECTIVE
        to: SUPERSEDED
        trigger: "system, on approval of a later ContributionElection whose supersedes_election_id names this row"
        actor: system
        preconditions:
          - "ContributionElection.state == EFFECTIVE"
        side_effects:
          - "effective_through is truncated to the superseding election's effective_from minus one day"
          - "Participant.projected_annual_deferral_cents is recomputed"
          - "increments ContributionElection.version by 1"
      - from: EFFECTIVE
        to: REVOKED
        trigger: "POST /plan-admin/contribution-elections/{id}/revoke"
        actor: PlanSponsorAdmin | Participant
        preconditions:
          - "ContributionElection.state == EFFECTIVE"
        side_effects:
          - "Participant.cumulative_special_catchup_used_cents -= service_catchup_attributed_cents"
          - "Participant.projected_annual_deferral_cents is recomputed"
          - "Plan.projected_excess_participant_count is recomputed"
          - "increments ContributionElection.version by 1"
      - from: SUBMITTED
        to: REVOKED
        trigger: "POST /plan-admin/contribution-elections/{id}/revoke"
        actor: PlanSponsorAdmin | Participant
        preconditions:
          - "ContributionElection.state == SUBMITTED"
        side_effects:
          - "increments ContributionElection.version by 1"

  - entity: RemittanceBatch
    initial_state: WITHHELD
    terminal_states: []
    transitions:
      - from: WITHHELD
        to: DEPOSITED
        trigger: "POST /plan-admin/remittance-batches/{id}/deposit"
        actor: PlanSponsorAdmin
        preconditions:
          - "RemittanceBatch.deposit_state == WITHHELD"
          - "deposit_date >= withholding_date"
          - "deposit_date is not after the current logical clock date"
        side_effects:
          - "deposit_date is stored and deadline_date is computed by remittance_deadline"
          - "for each element of line_items in submitted order, VendorAccount.ytd_elective_deferrals_cents += elective_deferral_cents and VendorAccount.ytd_employer_contributions_cents += employer_contribution_cents"
          - "PARALLEL AXIS: compliance_state moves UNDETERMINED -> TIMELY when deposit_date <= deadline_date, otherwise UNDETERMINED -> LATE"
          - "increments RemittanceBatch.version by 1"
        note: "deposit_state and compliance_state are independent axes; a batch is DEPOSITED regardless of which compliance value it lands on."
      - from: DEPOSITED
        to: REVERSED
        trigger: "POST /plan-admin/remittance-batches/{id}/reverse"
        actor: PlanSponsorAdmin
        preconditions:
          - "RemittanceBatch.deposit_state == DEPOSITED"
          - "no RemittanceCorrection of this batch is in state SETTLED"
        side_effects:
          - "for each element of line_items in submitted order, VendorAccount.ytd_elective_deferrals_cents -= elective_deferral_cents and VendorAccount.ytd_employer_contributions_cents -= employer_contribution_cents"
          - "every RemittanceCorrection of this batch in state OPEN transitions to VOIDED and its per-contract lost earnings are subtracted from VendorAccount.pending_lost_earnings_cents"
          - "Plan.open_correction_count is recomputed and Plan.compliance_posture follows it"
          - "compliance_state is reset to UNDETERMINED, deposit_date to null, calendar_days_late and business_days_late to 0"
          - "increments RemittanceBatch.version by 1"
      - from: REVERSED
        to: DEPOSITED
        trigger: "POST /plan-admin/remittance-batches/{id}/deposit"
        actor: PlanSponsorAdmin
        preconditions:
          - "RemittanceBatch.deposit_state == REVERSED"
          - "deposit_date is not after the current logical clock date"
        side_effects:
          - "identical to the WITHHELD -> DEPOSITED transition, re-evaluated against the newly supplied deposit_date"
          - "increments RemittanceBatch.version by 1"
        note: "Cycle: DEPOSITED -> REVERSED -> DEPOSITED may repeat any number of times."
      - from: LATE
        to: CORRECTION_PENDING
        trigger: "system, immediately after the deposit transition lands compliance_state on LATE"
        actor: system
        preconditions:
          - "RemittanceBatch.compliance_state == LATE"
        side_effects:
          - "CASCADE hop 2: a RemittanceCorrection row is created with lost_earnings_total_cents from lost_earnings_correction and excise_tax_cents from excise_tax_on_late_deposit, in state OPEN"
          - "CASCADE hop 3: creating that correction adds each line's lost earnings to the corresponding VendorAccount.pending_lost_earnings_cents and forces Plan.open_correction_count to be recomputed"
          - "CASCADE hop 4: the non-zero Plan.open_correction_count forces Plan.compliance_posture to move CLEAR -> UNDER_CORRECTION, which blocks approval of every TransferExchangeRequest naming this plan"
          - "increments RemittanceBatch.version by 1"
      - from: CORRECTION_PENDING
        to: CORRECTED
        trigger: "system, when the last RemittanceCorrection of this batch leaves state OPEN"
        actor: system
        preconditions:
          - "RemittanceBatch.compliance_state == CORRECTION_PENDING"
          - "no RemittanceCorrection of this batch is in state OPEN"
        side_effects:
          - "Plan.open_correction_count is recomputed and Plan.compliance_posture follows it"
          - "increments RemittanceBatch.version by 1"

  - entity: ParticipantRequest
    initial_state: SUBMITTED
    terminal_states: [DENIED, DISBURSED, PAID]
    transitions:
      - from: SUBMITTED
        to: UNDER_REVIEW
        trigger: "POST /plan-admin/participant-requests/{id}/decision with decision = BEGIN_REVIEW"
        actor: ComplianceOfficer
        preconditions:
          - "ParticipantRequest.state == SUBMITTED"
        side_effects:
          - "reviewed_by_user_id is set to X-User-ID"
          - "increments ParticipantRequest.version by 1"
      - from: UNDER_REVIEW
        to: RETURNED_FOR_INFO
        trigger: "POST /plan-admin/participant-requests/{id}/decision with decision = RETURN_FOR_INFO"
        actor: ComplianceOfficer
        preconditions:
          - "ParticipantRequest.state == UNDER_REVIEW"
        side_effects:
          - "increments ParticipantRequest.version by 1"
      - from: RETURNED_FOR_INFO
        to: SUBMITTED
        trigger: "POST /plan-admin/participant-requests/{id}/resubmit"
        actor: PlanSponsorAdmin | Participant
        preconditions:
          - "ParticipantRequest.state == RETURNED_FOR_INFO"
        side_effects:
          - "any supplied amount or relief field overwrites the stored value"
          - "resubmission_count += 1"
          - "reviewed_by_user_id is reset to null so review must be re-opened"
          - "submitted_by_user_id is set to X-User-ID"
          - "increments ParticipantRequest.version by 1"
        note: "Cycle: UNDER_REVIEW -> RETURNED_FOR_INFO -> SUBMITTED -> UNDER_REVIEW may repeat any number of times."
      - from: UNDER_REVIEW
        to: APPROVED
        trigger: "POST /plan-admin/participant-requests/{id}/decision with decision = APPROVE"
        actor: ComplianceOfficer
        preconditions:
          - "ParticipantRequest.state == UNDER_REVIEW"
          - "X-User-ID differs from reviewed_by_user_id"
          - "for request_type == LOAN: every OPEN VendorAccount of the participant in this plan's bucket is covered by an InformationSharingAgreement with status == ACTIVE, shares_loan_data == true and data_stale == false; for request_type IN {HARDSHIP, UNFORESEEABLE_EMERGENCY}: the agreement covering the named contract is ACTIVE, shares_hardship_data == true and not stale"
          - "for request_type == LOAN: requested_amount_cents <= loan_maximum_available"
          - "for request_type IN {HARDSHIP, UNFORESEEABLE_EMERGENCY}: requested_amount_cents <= distribution_max_approvable"
        side_effects:
          - "max_approvable_cents is written from loan_maximum_available or distribution_max_approvable"
          - "approved_amount_cents is set to requested_amount_cents"
          - "decided_by_user_id is set to X-User-ID"
          - "increments ParticipantRequest.version by 1"
      - from: UNDER_REVIEW
        to: DENIED
        trigger: "POST /plan-admin/participant-requests/{id}/decision with decision = DENY"
        actor: ComplianceOfficer
        preconditions:
          - "ParticipantRequest.state == UNDER_REVIEW"
          - "X-User-ID differs from reviewed_by_user_id"
        side_effects:
          - "denial_reason is set from the request note"
          - "decided_by_user_id is set to X-User-ID"
          - "increments ParticipantRequest.version by 1"
      - from: APPROVED
        to: DISBURSED
        trigger: "POST /plan-admin/participant-requests/{id}/fulfill"
        actor: PlanSponsorAdmin
        preconditions:
          - "ParticipantRequest.state == APPROVED"
          - "ParticipantRequest.request_type == LOAN"
          - "fulfillment_date is not after the current logical clock date"
        side_effects:
          - "CASCADE hop 2: VendorAccount.outstanding_loan_balance_cents += approved_amount_cents and VendorAccount.highest_outstanding_loan_12mo_cents = max(previous, new outstanding_loan_balance_cents)"
          - "CASCADE hop 3: those contract-level changes force Participant.total_outstanding_loan_balance_cents and Participant.highest_outstanding_loan_12mo_cents to be recomputed"
          - "CASCADE hop 4: the recomputed participant aggregates drive loan_maximum_available to zero while total_outstanding_loan_balance_cents is now positive, which moves Participant.loan_eligibility_flag AVAILABLE -> SUSPENDED and blocks every subsequent LOAN request"
          - "fulfillment_date is stored"
          - "increments ParticipantRequest.version by 1"
        note: "Branch A of the fork: only LOAN requests may land on DISBURSED."
      - from: APPROVED
        to: PAID
        trigger: "POST /plan-admin/participant-requests/{id}/fulfill"
        actor: PlanSponsorAdmin
        preconditions:
          - "ParticipantRequest.state == APPROVED"
          - "ParticipantRequest.request_type IN {HARDSHIP, UNFORESEEABLE_EMERGENCY}"
          - "fulfillment_date is not after the current logical clock date"
        side_effects:
          - "VendorAccount.accumulated_benefit_cents -= approved_amount_cents and vested_balance_cents is recomputed"
          - "Participant.total_accumulated_benefit_cents and Participant.total_vested_balance_cents are recomputed"
          - "outstanding_loan_balance_cents is NOT touched — a distribution is not a loan"
          - "fulfillment_date is stored"
          - "increments ParticipantRequest.version by 1"
        note: "Branch B of the fork: HARDSHIP and UNFORESEEABLE_EMERGENCY requests land on PAID with a different side-effect set from branch A."

  - entity: TransferExchangeRequest
    initial_state: SUBMITTED
    terminal_states: [DENIED, REVERSED]
    transitions:
      - from: SUBMITTED
        to: ACCEPTED_BY_VENDOR
        trigger: "POST /plan-admin/transfer-exchange-requests/{id}/vendor-response with accepted = true"
        actor: VendorRepresentative
        preconditions:
          - "TransferExchangeRequest.state == SUBMITTED"
          - "X-User-ID equals the vendor_id of the destination VendorAccount"
        side_effects:
          - "increments TransferExchangeRequest.version by 1"
      - from: SUBMITTED
        to: REJECTED_BY_VENDOR
        trigger: "POST /plan-admin/transfer-exchange-requests/{id}/vendor-response with accepted = false"
        actor: VendorRepresentative
        preconditions:
          - "TransferExchangeRequest.state == SUBMITTED"
          - "X-User-ID equals the vendor_id of the destination VendorAccount"
        side_effects:
          - "vendor_rejection_reason is stored"
          - "increments TransferExchangeRequest.version by 1"
      - from: REJECTED_BY_VENDOR
        to: SUBMITTED
        trigger: "POST /plan-admin/transfer-exchange-requests/{id}/decision with decision = RESUBMIT"
        actor: ComplianceOfficer
        preconditions:
          - "TransferExchangeRequest.state == REJECTED_BY_VENDOR"
        side_effects:
          - "vendor_rejection_reason is cleared"
          - "resubmit_count += 1"
          - "increments TransferExchangeRequest.version by 1"
        note: "Cycle: SUBMITTED -> REJECTED_BY_VENDOR -> SUBMITTED may repeat any number of times."
      - from: ACCEPTED_BY_VENDOR
        to: APPROVED
        trigger: "POST /plan-admin/transfer-exchange-requests/{id}/decision with decision = APPROVE"
        actor: ComplianceOfficer
        preconditions:
          - "TransferExchangeRequest.state == ACCEPTED_BY_VENDOR"
          - "Plan.compliance_posture == CLEAR for both source_plan_id and destination_plan_id"
          - "exchange_transfer_admissibility passes for this request_kind"
        side_effects:
          - "increments TransferExchangeRequest.version by 1"
      - from: ACCEPTED_BY_VENDOR
        to: DENIED
        trigger: "POST /plan-admin/transfer-exchange-requests/{id}/decision with decision = DENY"
        actor: ComplianceOfficer
        preconditions:
          - "TransferExchangeRequest.state == ACCEPTED_BY_VENDOR"
        side_effects:
          - "denial_reason is stored"
          - "increments TransferExchangeRequest.version by 1"
      - from: SUBMITTED
        to: DENIED
        trigger: "POST /plan-admin/transfer-exchange-requests/{id}/decision with decision = DENY"
        actor: ComplianceOfficer
        preconditions:
          - "TransferExchangeRequest.state == SUBMITTED"
        side_effects:
          - "denial_reason is stored"
          - "increments TransferExchangeRequest.version by 1"
      - from: APPROVED
        to: EXECUTED
        trigger: "POST /plan-admin/transfer-exchange-requests/{id}/execute"
        actor: PlanSponsorAdmin
        preconditions:
          - "TransferExchangeRequest.state == APPROVED"
          - "execution_date is not after the current logical clock date"
          - "amount_cents <= source VendorAccount.accumulated_benefit_cents at execution time"
        side_effects:
          - "pre_move_source_benefit_cents and pre_move_destination_benefit_cents are snapshotted"
          - "source VendorAccount.accumulated_benefit_cents -= amount_cents; destination VendorAccount.accumulated_benefit_cents += amount_cents"
          - "both contracts' vested_balance_cents are recomputed"
          - "Participant.total_accumulated_benefit_cents and Participant.total_vested_balance_cents are recomputed"
          - "executed_at is stamped from the logical clock"
          - "increments TransferExchangeRequest.version by 1"
      - from: EXECUTED
        to: REVERSED
        trigger: "POST /plan-admin/transfer-exchange-requests/{id}/reverse"
        actor: ComplianceOfficer
        preconditions:
          - "TransferExchangeRequest.state == EXECUTED"
        side_effects:
          - "source VendorAccount.accumulated_benefit_cents += amount_cents; destination VendorAccount.accumulated_benefit_cents -= amount_cents"
          - "both contracts' vested_balance_cents are recomputed"
          - "Participant.total_accumulated_benefit_cents and Participant.total_vested_balance_cents are recomputed"
          - "COMPENSATION: the sum of accumulated_benefit_cents over the participant's OPEN contracts returns to its pre-execution value with zero drift"
          - "increments TransferExchangeRequest.version by 1"

# ---------------------------------------------------------------------------
# 1.2.1 Concurrency Rules
# ---------------------------------------------------------------------------
concurrency_rules:
  - rule_id: election-create-stale-participant
    parent_entity: Participant
    write_endpoint: "POST /plan-admin/contribution-elections"
    occ_field: "expected_participant_version"
    description: |
      Creating a ContributionElection against a Participant whose version has advanced
      since the client last observed it is rejected. A new election legitimately
      supersedes the participant's prior EFFECTIVE election, so a writer holding a stale
      view of the participant would otherwise supersede an election it never saw and
      compute its catch-up attribution against an out-of-date
      cumulative_special_catchup_used_cents.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: balance-report-stale-vendor-account
    parent_entity: VendorAccount
    write_endpoint: "POST /plan-admin/vendor-accounts/{id}/balance-report"
    occ_field: "expected_vendor_account_version"
    description: |
      Posting a provider balance report against a VendorAccount whose version has advanced
      since the reporting provider last read it is rejected. A later report legitimately
      overwrites an earlier one, so without the version check a report prepared from an
      out-of-date extract would silently overwrite loan and deferral figures that a
      disbursement or remittance deposit has already moved.
    error_id: ERR_STALE_VERSION
    http_status: 412

# ---------------------------------------------------------------------------
# 1.3 Calculation Rules Table
# ---------------------------------------------------------------------------
calculations:
  - name: nondiscrimination_regime
    trigger: "On POST /plan-admin/plans and on the Plan DRAFT -> ACTIVE transition; the result is stored in Plan.nondiscrimination_regime."
    algorithm: threshold
    formula: |
      emp = Employer[plan.employer_id]
      if emp.entity_type == 'CHURCH':
          regime = 'CHURCH_EXEMPT'                      # neither universal availability nor 410(b)/401(a)(4)
      elif plan.plan_type == 'PLAN_403B':
          regime = 'UA_ONLY' if emp.is_governmental else 'UA_PLUS_410B_401A4'
      else:                                             # PLAN_457B
          regime = 'GOVERNMENTAL_457_ALL_EMPLOYEES' if emp.is_governmental else 'TOP_HAT_457'
    input_set: "Exactly one Employer row (the plan's sponsor) and the plan's own plan_type. No other rows participate."
    constants: {}
    precision: "exact enum selection; no arithmetic"
    variants:
      - name: elective_deferral_side
        when: "Testing the plan's elective-deferral arrangement"
        difference: "UA_ONLY and UA_PLUS_410B_401A4 both impose universal availability on elective deferrals; GOVERNMENTAL_457_ALL_EMPLOYEES and TOP_HAT_457 never do."
      - name: employer_contribution_side
        when: "Testing the plan's employer nonelective/matching contributions"
        difference: "Only UA_PLUS_410B_401A4 additionally subjects employer contributions to 410(b)/401(a)(4); UA_ONLY (governmental 403(b)) does not."

  - name: universal_availability_notice_validity
    trigger: "On POST /plan-admin/plans/{id}/universal-availability-notices; the result is stored in UniversalAvailabilityNotice.is_valid."
    algorithm: threshold
    formula: |
      is_valid = (notice.describes_effective_opportunity == true
                  and notice.recipient_count >= Plan[notice.plan_id].reported_participant_count
                  and notice.delivery_method != 'INTRANET_POSTING')
    input_set: "The notice row being created plus the reported_participant_count of the Plan named by its plan_id."
    constants: {}
    precision: "boolean; recipient_count comparison uses >= so an exact match is sufficient"

  - name: eligibility_determination
    trigger: "On POST /plan-admin/eligibility-determinations; the result is stored in EligibilityDetermination.status, exclusion_basis, notice_status and universal_availability_applies."
    algorithm: constraint_propagation
    formula: |
      plan = Plan[plan_id]; p = Participant[participant_id]
      if plan.status not in ('ACTIVE', 'FROZEN'):
          status = 'INELIGIBLE_PLAN_NOT_ACTIVE'
      elif plan.nondiscrimination_regime == 'TOP_HAT_457':
          status = 'ELIGIBLE' if p.is_select_management_or_hce else 'EXCLUDED_NOT_TOP_HAT_GROUP'
      elif plan.nondiscrimination_regime == 'GOVERNMENTAL_457_ALL_EMPLOYEES':
          status = 'ELIGIBLE'                       # eligible governmental 457(b): no exclusions
      elif plan.nondiscrimination_regime == 'CHURCH_EXEMPT':
          status = 'ELIGIBLE'
      else:                                          # UA_ONLY or UA_PLUS_410B_401A4 -> universal availability
          # EXCLUSION LADDER — evaluated strictly in this order, first hit wins
          if p.is_nonresident_alien_no_us_income:            status = 'EXCLUDED_NONRESIDENT_ALIEN'
          elif p.is_student_performing_services:             status = 'EXCLUDED_STUDENT'
          elif (p.scheduled_hours_per_week < 20
                and p.prior_year_hours_worked < 1000):       status = 'EXCLUDED_LESS_THAN_20_HOURS'
          else:                                              status = 'ELIGIBLE'

      universal_availability_applies = plan.nondiscrimination_regime in ('UA_ONLY', 'UA_PLUS_410B_401A4')
      if not universal_availability_applies:
          notice_status = 'CURRENT'
      else:
          notices = [n for n in UniversalAvailabilityNotice
                       if n.plan_id == plan.id and n.plan_year == plan.plan_year]
          if len(notices) == 0:                    notice_status = 'MISSING'
          elif any(n.is_valid for n in notices):   notice_status = 'CURRENT'
          else:                                    notice_status = 'INVALID'
    input_set: "One Plan row, one Participant row, and every UniversalAvailabilityNotice row whose plan_id equals the plan and whose plan_year equals Plan.plan_year. No notice from another plan year participates."
    constants:
      PART_TIME_HOURS_PER_WEEK_THRESHOLD: 20
      PART_TIME_PRIOR_YEAR_HOURS_THRESHOLD: 1000
    precision: "scheduled_hours_per_week is compared with strict `<` against 20, so exactly 20.0 hours is NOT excludable; prior_year_hours_worked is compared with strict `<` against 1000, so exactly 1000 hours is NOT excludable. Both prongs must hold for EXCLUDED_LESS_THAN_20_HOURS."

  - name: catchup_capacity_403b
    trigger: "On GET /plan-admin/participants/{id}/contribution-limit-summary and inside deferral_attribution_order when Plan.plan_type == PLAN_403B."
    algorithm: threshold
    formula: |
      emp = Employer[plan.employer_id]
      if plan.plan_type != 'PLAN_403B':
          return { 'service_15yr': 0, 'age_50': 0 }
      lifetime = participant.lifetime_elective_deferrals_cents
      if emp.is_qualified_organization and participant.years_of_service >= SERVICE_15YR_MIN_YEARS:
          service_15yr = max(0, min(
              SERVICE_15YR_ANNUAL_CAP_CENTS,
              SERVICE_15YR_LIFETIME_CAP_CENTS - participant.cumulative_special_catchup_used_cents,
              SERVICE_15YR_PER_YEAR_FACTOR_CENTS * floor(participant.years_of_service) - lifetime))
      else:
          service_15yr = 0
      age_50 = AGE_50_CATCHUP_LIMIT_CENTS if participant.attained_age_at_year_end >= 50 else 0
      return { 'service_15yr': service_15yr, 'age_50': age_50 }
    input_set: "The Employer row of the plan's sponsor, the Participant row, and — through lifetime_elective_deferrals_cents — every OPEN VendorAccount of that participant whose Plan.plan_type == PLAN_403B. Accounts with status CLOSED and accounts under PLAN_457B plans are excluded."
    constants:
      SERVICE_15YR_MIN_YEARS: 15
      SERVICE_15YR_ANNUAL_CAP_CENTS: 300000
      SERVICE_15YR_LIFETIME_CAP_CENTS: 1500000
      SERVICE_15YR_PER_YEAR_FACTOR_CENTS: 500000
      AGE_50_CATCHUP_LIMIT_CENTS: 800000
    precision: "integer cents throughout; years_of_service is floored before multiplication; the three-way min is evaluated after each term is computed independently, and the result is floored at 0"

  - name: catchup_capacity_457b
    trigger: "On GET /plan-admin/participants/{id}/contribution-limit-summary and inside deferral_attribution_order when Plan.plan_type == PLAN_457B."
    algorithm: threshold
    formula: |
      if plan.plan_type != 'PLAN_457B':
          return { 'final_3yr': 0, 'age_50': 0, 'usable': 0 }
      age = participant.attained_age_at_year_end
      in_window = age in (NORMAL_RETIREMENT_AGE - 3, NORMAL_RETIREMENT_AGE - 2, NORMAL_RETIREMENT_AGE - 1)   # 62, 63, 64
      if in_window:
          final_3yr = min(FINAL_3YR_MULTIPLIER * BASIC_ELECTIVE_DEFERRAL_LIMIT_CENTS,
                          BASIC_ELECTIVE_DEFERRAL_LIMIT_CENTS + participant.underutilized_prior_limit_cents) \
                      - BASIC_ELECTIVE_DEFERRAL_LIMIT_CENTS
      else:
          final_3yr = 0
      age_50 = AGE_50_CATCHUP_LIMIT_CENTS if (age >= 50 and plan.is_governmental_457) else 0
      usable = max(final_3yr, age_50)          # GREATER OF, never the sum
      return { 'final_3yr': final_3yr, 'age_50': age_50, 'usable': usable }
    input_set: "One Plan row and one Participant row. No VendorAccount participates — 457(b) catch-up capacity is not a function of contract balances."
    constants:
      NORMAL_RETIREMENT_AGE: 65
      FINAL_3YR_MULTIPLIER: 2
      BASIC_ELECTIVE_DEFERRAL_LIMIT_CENTS: 2450000
      AGE_50_CATCHUP_LIMIT_CENTS: 800000
    precision: "integer cents; the final-three-year window test uses exact age equality against {62, 63, 64}, so age 61 and age 65 both yield final_3yr == 0"

  - name: deferral_limit_aggregate_402g
    trigger: "On GET /plan-admin/participants/{id}/contribution-limit-summary and as the ceiling enforced by deferral_attribution_order on the ContributionElection SUBMITTED -> EFFECTIVE transition."
    algorithm: aggregation
    formula: |
      bucket = plan.plan_type                                  # PLAN_403B and PLAN_457B are SEPARATE buckets
      accounts_all = [va for va in VendorAccount
                        if va.participant_id == participant.id
                       and va.status == 'OPEN'
                       and Plan[va.plan_id].plan_type == bucket
                       and Plan[va.plan_id].status in ('ACTIVE', 'FROZEN')]
      accounts_verified = [va for va in accounts_all
                             if exists isa in InformationSharingAgreement
                                where isa.plan_id == va.plan_id
                                  and isa.vendor_id == va.vendor_id
                                  and isa.status == 'ACTIVE'
                                  and isa.shares_contribution_data == true
                                  and isa.data_stale == false]
      ytd_gross    = sum(va.ytd_elective_deferrals_cents for va in accounts_all)
      ytd_verified = sum(va.ytd_elective_deferrals_cents for va in accounts_verified)
      if bucket == 'PLAN_403B':
          caps = catchup_capacity_403b(...)
          catchup_capacity = caps.service_15yr + caps.age_50          # 403(b) catch-ups STACK
      else:
          catchup_capacity = catchup_capacity_457b(...).usable        # 457(b) takes the GREATER OF
      total_limit   = BASIC_ELECTIVE_DEFERRAL_LIMIT_CENTS + catchup_capacity
      room_gross    = max(0, total_limit - ytd_gross)
      room_verified = max(0, total_limit - ytd_verified)
    input_set: "Every OPEN VendorAccount of the participant whose Plan has plan_type equal to the queried plan's plan_type AND status IN {ACTIVE, FROZEN}. Accounts under DRAFT or TERMINATED plans, CLOSED accounts, and accounts in the other plan_type bucket are all excluded. 403(b) deferrals and 457(b) deferrals never aggregate with one another."
    constants:
      BASIC_ELECTIVE_DEFERRAL_LIMIT_CENTS: 2450000
    precision: "integer cents; both room figures are floored at 0"
    variants:
      - name: gross_basis
        when: "Enforcement. Every rejection of an election for exceeding the elective-deferral limit is decided on this variant."
        difference: "Counts ytd_elective_deferrals_cents on ALL accounts in accounts_all, including contracts whose information sharing agreement is missing, PENDING, SUSPENDED, TERMINATED, or whose data feed has gone stale. Produces the SMALLER room and is therefore the conservative figure the plan is obliged to act on."
      - name: verified_basis
        when: "Advisory. Reported alongside the gross figure so the sponsor can see how much of the picture is actually substantiated by an active, current information sharing agreement."
        difference: "Counts only accounts_verified. Produces a LARGER room whenever any contract's agreement is inactive or stale; the difference between the two rooms is exactly the deferral total sitting behind unverified contracts."

  - name: annual_additions_415c
    trigger: "On GET /plan-admin/participants/{id}/contribution-limit-summary and as a second ceiling on the ContributionElection SUBMITTED -> EFFECTIVE transition."
    algorithm: aggregation
    formula: |
      if plan.plan_type != 'PLAN_403B':
          return None                                # 457(b) deferrals are not annual additions
      accounts = [va for va in VendorAccount
                    if va.participant_id == participant.id
                   and va.status == 'OPEN'
                   and Plan[va.plan_id].plan_type == 'PLAN_403B']     # ACROSS EVERY EMPLOYER
      annual_additions = sum(va.ytd_elective_deferrals_cents + va.ytd_employer_contributions_cents
                             for va in accounts)
      limit = min(ANNUAL_ADDITIONS_LIMIT_415C_CENTS, participant.includible_compensation_cents)
      breached = (annual_additions + pending_election_amount_cents) > limit
    input_set: "Every OPEN 403(b) VendorAccount of the participant regardless of which Plan or Employer holds it — under section 415(c) the participant, not the employer, is treated as maintaining the 403(b) annuity."
    constants:
      ANNUAL_ADDITIONS_LIMIT_415C_CENTS: 7200000
    precision: "integer cents; comparison is strict `>` so annual_additions exactly equal to the limit passes"

  - name: deferral_attribution_order
    trigger: "On POST /plan-admin/contribution-elections/{id}/decision with decision = APPROVE; writes ContributionElection.basic_deferral_attributed_cents, service_catchup_attributed_cents, age50_catchup_attributed_cents and final3yr_catchup_attributed_cents and increments Participant.cumulative_special_catchup_used_cents."
    algorithm: waterfall_allocation
    formula: |
      # ---- PINNED EVALUATION ORDER -------------------------------------------------
      # Capacity is evaluated ONCE, against the PRE-ATTRIBUTION snapshot of
      # Participant.cumulative_special_catchup_used_cents. The increment to that field
      # happens only after all buckets have been filled. Recomputing capacity mid-
      # waterfall (i.e. after step 2 has consumed lifetime catch-up room) yields a
      # different, and wrong, split — the dependency is circular in appearance only.
      snapshot_used = participant.cumulative_special_catchup_used_cents      # PRE-attribution
      cap = catchup_capacity_403b(...) if plan.plan_type == 'PLAN_403B' else catchup_capacity_457b(...)
      ytd_gross = deferral_limit_aggregate_402g(...).ytd_gross              # gross_basis, always
      A = election.annual_deferral_amount_cents

      # step 1 — basic limit first
      basic = min(A, max(0, BASIC_ELECTIVE_DEFERRAL_LIMIT_CENTS - ytd_gross))
      rem = A - basic

      # step 2 — 15-year service catch-up BEFORE age-50 (403(b) only)
      if plan.plan_type == 'PLAN_403B' and election.catchup_election in ('SERVICE_15_YEAR', 'AGE_50_AND_SERVICE_15_YEAR'):
          service = min(rem, cap.service_15yr)
      else:
          service = 0
      rem -= service

      # step 3a — 457(b) final-three-year catch-up
      if plan.plan_type == 'PLAN_457B' and election.catchup_election == 'FINAL_3_YEAR':
          final3 = min(rem, cap.final_3yr)
      else:
          final3 = 0
      rem -= final3

      # step 3b — age-50 catch-up LAST
      if election.catchup_election in ('AGE_50', 'AGE_50_AND_SERVICE_15_YEAR'):
          age50 = min(rem, cap.age_50)
      else:
          age50 = 0
      rem -= age50

      if rem > 0:
          reject ERR_402G_LIMIT_EXCEEDED
      # ---- post-attribution persistence --------------------------------------------
      participant.cumulative_special_catchup_used_cents = snapshot_used + service
    input_set: "One ContributionElection row, its Plan, its Participant, and the participant's whole OPEN VendorAccount set in the plan's bucket (through deferral_limit_aggregate_402g's gross_basis variant)."
    constants:
      BASIC_ELECTIVE_DEFERRAL_LIMIT_CENTS: 2450000
    precision: "integer cents; every bucket is filled with min() against the remaining amount, so no bucket can go negative and the four attributed fields always sum to annual_deferral_amount_cents when the election is approved"
    variants:
      - name: pre_snapshot_capacity
        when: "Always — this is the pinned order."
        difference: "cap.service_15yr is computed from cumulative_special_catchup_used_cents as it stood BEFORE this approval."
      - name: post_increment_capacity
        when: "Never applied; documented only to name the divergence the pinned order forecloses."
        difference: "Recomputing cap.service_15yr after step 2 has added `service` to cumulative_special_catchup_used_cents shrinks the second term of the three-way min by exactly `service`, pushing the amount into the age-50 bucket or past the limit entirely."

  - name: loan_maximum_available
    trigger: "On GET /plan-admin/participants/{id}/loan-capacity, on POST /plan-admin/participant-requests when request_type == LOAN, and on the ParticipantRequest UNDER_REVIEW -> APPROVED transition; writes ParticipantRequest.max_approvable_cents and drives Participant.loan_eligibility_flag."
    algorithm: threshold
    formula: |
      accounts = [va for va in VendorAccount
                    if va.participant_id == participant.id
                   and va.status == 'OPEN'
                   and Plan[va.plan_id].employer_id == plan.employer_id
                   and Plan[va.plan_id].plan_type == plan.plan_type]
      # every contract in `accounts` must be covered by an ACTIVE, non-stale, loan-sharing
      # agreement before a maximum may be quoted at all — see validations priority 24/25
      vested_total      = sum(va.vested_balance_cents             for va in accounts)
      outstanding_total = sum(va.outstanding_loan_balance_cents   for va in accounts)
      highest_12mo      = sum(va.highest_outstanding_loan_12mo_cents for va in accounts)

      cap_statutory = LOAN_ABSOLUTE_CAP_CENTS - highest_12mo
      cap_vested    = max(floor(vested_total * LOAN_VESTED_PERCENT_BPS / 10000),
                          LOAN_MINIMUM_FLOOR_CENTS) - outstanding_total
      cap_vested    = min(cap_vested, vested_total - outstanding_total)   # never exceed remaining vested
      maximum_loan  = max(0, min(cap_statutory, cap_vested))
    input_set: "Every OPEN VendorAccount of the participant held under a Plan with the SAME employer_id AND the SAME plan_type as the plan the loan is requested from. Contracts under a different employer or a different plan_type bucket do not aggregate."
    constants:
      LOAN_ABSOLUTE_CAP_CENTS: 5000000
      LOAN_MINIMUM_FLOOR_CENTS: 1000000
      LOAN_VESTED_PERCENT_BPS: 5000
      LOAN_LOOKBACK_DAYS: 365
    precision: "integer cents; the 50% figure uses floor division, and the whole expression is floored at 0. With an empty account set every sum is 0, cap_vested collapses to min(1000000 - 0, 0 - 0) = 0 and maximum_loan is 0."

  - name: distribution_max_approvable
    trigger: "On the ParticipantRequest UNDER_REVIEW -> APPROVED transition when request_type IN {HARDSHIP, UNFORESEEABLE_EMERGENCY}; writes ParticipantRequest.max_approvable_cents."
    algorithm: threshold
    formula: |
      va = VendorAccount[request.vendor_account_id]
      if request.request_type == 'HARDSHIP':
          # 403(b) safe-harbour hardship: the need may be grossed up for anticipated taxes
          # and penalties. Other resources are NOT netted off — the participant's written
          # representation governs and there is no obligation to take a plan loan first.
          base = request.stated_need_cents + request.estimated_taxes_cents
      else:                                   # UNFORESEEABLE_EMERGENCY
          # 457(b): the distribution is limited to the amount reasonably necessary to
          # satisfy the emergency AFTER every other source of relief is exhausted.
          relief = (request.insurance_reimbursement_available_cents
                    + request.liquidatable_assets_cents
                    + request.deferral_cessation_relief_cents)
          if relief >= request.stated_need_cents:
              reject ERR_UE_RELIEF_AVAILABLE
          base = max(0, request.stated_need_cents - relief) + request.estimated_taxes_cents
      max_approvable = min(base, va.vested_balance_cents)
      if request.requested_amount_cents > max_approvable:
          reject ERR_DISTRIBUTION_EXCEEDS_NEED
    input_set: "One ParticipantRequest row and the single VendorAccount named by its vendor_account_id. No other contract of the participant participates."
    constants: {}
    precision: "integer cents; the relief comparison uses `>=` so relief exactly equal to stated_need_cents already defeats the request"
    variants:
      - name: hardship_gross_up
        when: "request_type == HARDSHIP on a PLAN_403B plan"
        difference: "Available relief is ignored entirely; max_approvable = stated_need + estimated_taxes, capped at the contract's vested balance."
      - name: unforeseeable_emergency_net
        when: "request_type == UNFORESEEABLE_EMERGENCY on a PLAN_457B plan"
        difference: "Available relief is subtracted from the need before the tax gross-up; for identical stated_need, estimated_taxes and relief inputs this yields a max_approvable smaller by exactly the relief total, and a relief total at or above the need rejects the request outright."

  - name: exchange_transfer_admissibility
    trigger: "On POST /plan-admin/transfer-exchange-requests and re-checked on the TransferExchangeRequest ACCEPTED_BY_VENDOR -> APPROVED transition."
    algorithm: constraint_propagation
    formula: |
      src  = VendorAccount[request.source_vendor_account_id]
      dst  = VendorAccount[request.destination_vendor_account_id]
      sp   = Plan[request.source_plan_id];  dp = Plan[request.destination_plan_id]

      if request.request_kind == 'CONTRACT_EXCHANGE':
          require sp.id == dp.id                            else ERR_TRANSFER_NOT_PERMITTED_BY_PLAN
          require sp.permits_contract_exchanges             else ERR_TRANSFER_NOT_PERMITTED_BY_PLAN
          require exists isa where isa.plan_id == sp.id
                              and isa.vendor_id == dst.vendor_id
                              and isa.status == 'ACTIVE'
                              and isa.data_stale == false   else ERR_EXCHANGE_VENDOR_NOT_APPROVED
          # the participant's accumulated benefit immediately after the exchange must be at
          # least what it was immediately before
          require request.amount_cents <= src.accumulated_benefit_cents
                                                            else ERR_ACCUMULATED_BENEFIT_REDUCED
          # employment status is irrelevant to an intra-plan exchange
      else:                                                  # PLAN_TO_PLAN_TRANSFER
          require sp.id != dp.id                            else ERR_TRANSFER_NOT_PERMITTED_BY_PLAN
          require sp.permits_outgoing_transfers and dp.permits_incoming_transfers
                                                            else ERR_TRANSFER_NOT_PERMITTED_BY_PLAN
          require sp.plan_type == dp.plan_type              else ERR_TRANSFER_NOT_PERMITTED_BY_PLAN
          # the participant must be an employee or former employee of the receiving employer
          require Participant.employer_id == dp.employer_id else ERR_TRANSFER_PARTICIPANT_NOT_ELIGIBLE
          require request.amount_cents <= src.accumulated_benefit_cents
                                                            else ERR_TRANSFER_AMOUNT_EXCEEDS_BENEFIT
          # NO information sharing agreement is required for a plan-to-plan transfer
    input_set: "One TransferExchangeRequest row, its two Plan rows, its two VendorAccount rows, the Participant row, and every InformationSharingAgreement whose plan_id equals source_plan_id and whose vendor_id equals the destination contract's vendor_id."
    constants: {}
    precision: "exact integer cents comparison; `<=` so an amount exactly equal to the source accumulated benefit is admissible under both kinds"
    variants:
      - name: contract_exchange
        when: "request_kind == CONTRACT_EXCHANGE (money stays inside one plan and moves between two provider contracts)"
        difference: "Requires an ACTIVE, non-stale information sharing agreement between the plan and the RECEIVING vendor; ignores employment status; an over-large amount is reported as ERR_ACCUMULATED_BENEFIT_REDUCED."
      - name: plan_to_plan_transfer
        when: "request_kind == PLAN_TO_PLAN_TRANSFER (money moves between two plans of the same plan_type)"
        difference: "Requires no information sharing agreement at all, but does require Participant.employer_id to equal the receiving plan's employer_id; the identical over-large amount is reported as ERR_TRANSFER_AMOUNT_EXCEEDS_BENEFIT. For one and the same participant, source contract, destination vendor and amount, the exchange variant rejects where the transfer variant admits."

  - name: remittance_deadline
    trigger: "On the RemittanceBatch WITHHELD -> DEPOSITED and REVERSED -> DEPOSITED transitions; writes RemittanceBatch.deadline_date, calendar_days_late and business_days_late and selects the compliance_state axis value."
    algorithm: interval_merge
    formula: |
      def is_business_day(d):
          return d.weekday() < 5 and d not in FEDERAL_HOLIDAYS

      def business_day_offset(d, n):                # n business days AFTER d, not counting d
          c = 0; cur = d
          while c < n:
              cur = cur + 1 day
              if is_business_day(cur): c += 1
          return cur

      def nth_business_day_of_month(year, month, n):
          d = first day of that month; c = 0
          while True:
              if is_business_day(d):
                  c += 1
                  if c == n: return d
              d = d + 1 day

      if plan.is_small_plan:
          deadline = business_day_offset(batch.withholding_date, SMALL_PLAN_SAFE_HARBOR_BUSINESS_DAYS)
      else:
          m = the month immediately following the month of batch.withholding_date
          statutory = nth_business_day_of_month(m.year, m.month, LARGE_PLAN_DEADLINE_BUSINESS_DAY)
          deadline  = min(statutory, batch.segregation_feasible_date) if batch.segregation_feasible_date is not null else statutory

      timely = (batch.deposit_date <= deadline)          # ON the deadline is TIMELY
      calendar_days_late = 0 if timely else (batch.deposit_date - deadline) in whole days
      business_days_late = 0 if timely else count of business days strictly after deadline
                                            through batch.deposit_date inclusive
      compliance_state = 'TIMELY' if timely else 'LATE'
    input_set: "One RemittanceBatch row and the is_small_plan flag of its Plan. FEDERAL_HOLIDAYS is a fixed constant list, not data."
    constants:
      SMALL_PLAN_PARTICIPANT_THRESHOLD: 100
      SMALL_PLAN_SAFE_HARBOR_BUSINESS_DAYS: 7
      LARGE_PLAN_DEADLINE_BUSINESS_DAY: 15
      FEDERAL_HOLIDAYS: ["2026-01-01", "2026-01-19", "2026-02-16", "2026-05-25", "2026-06-19", "2026-07-03", "2026-09-07", "2026-10-12", "2026-11-11", "2026-11-26", "2026-12-25"]
    precision: "whole dates, no times; the timeliness comparison is `<=` so a deposit recorded on deadline_date itself is TIMELY and the very next business day is LATE with business_days_late == 1"

  - name: lost_earnings_correction
    trigger: "On the RemittanceBatch LATE -> CORRECTION_PENDING system transition; writes RemittanceCorrection.lost_earnings_total_cents and RemittanceCorrection.line_breakdown."
    algorithm: weighted_scoring
    formula: |
      days = batch.calendar_days_late
      # ---- PINNED ROUNDING ORDER ---------------------------------------------------
      # Round EACH line item to whole cents FIRST, then sum the rounded lines. Summing
      # the unrounded products and rounding once at the end is a different number and is
      # NOT what this plan does.
      line_breakdown = []
      for item in batch.line_items:                      # submitted order preserved
          raw  = item.elective_deferral_cents * LOST_EARNINGS_ANNUAL_RATE_BPS / 10000 * days / DAYS_PER_YEAR
          cents = round_half_up(raw, 0)                  # to WHOLE CENTS, per line
          line_breakdown.append({ 'vendor_account_id': item.vendor_account_id,
                                  'lost_earnings_cents': cents })
      lost_earnings_total_cents = sum(l.lost_earnings_cents for l in line_breakdown)
    input_set: "The line_items array of exactly one RemittanceBatch, in the order the sponsor submitted it, together with that batch's calendar_days_late. employer_contribution_cents does not earn lost earnings and is excluded."
    constants:
      LOST_EARNINGS_ANNUAL_RATE_BPS: 600
      DAYS_PER_YEAR: 365
    precision: "each line is rounded half-up to whole cents before summation; the alternative order (sum then round) can differ by up to (number of line items) / 2 cents and is explicitly not used"

  - name: excise_tax_on_late_deposit
    trigger: "On the RemittanceBatch LATE -> CORRECTION_PENDING system transition, immediately after lost_earnings_correction; writes RemittanceCorrection.excise_tax_cents."
    algorithm: threshold
    formula: |
      excise_tax_cents = round_half_up(correction.lost_earnings_total_cents
                                       * EXCISE_TAX_RATE_BPS / 10000, 0)
    input_set: "The single lost_earnings_total_cents figure produced by lost_earnings_correction for this correction. The excise tax is computed on the ALREADY-SUMMED total, never per line."
    constants:
      EXCISE_TAX_RATE_BPS: 1500
    precision: "round half-up to whole cents"

# ---------------------------------------------------------------------------
# 1.4 Validation Rules Table (evaluated strictly in ascending priority order;
#     the FIRST rule that fails decides the response)
# ---------------------------------------------------------------------------
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are both present, and X-User-Role names a role declared in the RBAC matrix."
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"

  - priority: 2
    category: auth
    check: "The role in X-User-Role appears in the target endpoint's roles list."
    error_id: ERR_UNAUTHORIZED_ROLE
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: business_constraint
    check: "Request body and query string are well formed: every required field is present, enum values are members of their declared set, integer cent fields are integers within their declared bounds, date fields parse as ISO 8601 dates, limit is in [1,100] and offset is >= 0, and line_items is a non-empty array of objects carrying vendor_account_id, elective_deferral_cents and employer_contribution_cents."
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all"

  - priority: 4
    category: existence
    check: "Every resource named by a path segment exists, checked left to right: Employer, Plan, Vendor, Participant, InformationSharingAgreement, EligibilityDetermination, VendorAccount, ContributionElection, RemittanceBatch, RemittanceCorrection, ParticipantRequest, TransferExchangeRequest."
    error_id: ERR_EMPLOYER_NOT_FOUND | ERR_PLAN_NOT_FOUND | ERR_VENDOR_NOT_FOUND | ERR_PARTICIPANT_NOT_FOUND | ERR_ISA_NOT_FOUND | ERR_ELIGIBILITY_NOT_FOUND | ERR_VENDOR_ACCOUNT_NOT_FOUND | ERR_ELECTION_NOT_FOUND | ERR_REMITTANCE_BATCH_NOT_FOUND | ERR_CORRECTION_NOT_FOUND | ERR_PARTICIPANT_REQUEST_NOT_FOUND | ERR_TRANSFER_REQUEST_NOT_FOUND
    http_status: 404
    applies_to: "every endpoint with a templated path segment"

  - priority: 5
    category: existence
    check: "Every foreign key supplied in the request body resolves to an existing row, checked in the order the fields are declared in the endpoint's input list."
    error_id: ERR_EMPLOYER_NOT_FOUND | ERR_PLAN_NOT_FOUND | ERR_VENDOR_NOT_FOUND | ERR_PARTICIPANT_NOT_FOUND | ERR_VENDOR_ACCOUNT_NOT_FOUND | ERR_ELECTION_NOT_FOUND
    http_status: 404
    applies_to: "POST /plan-admin/plans, POST /plan-admin/information-sharing-agreements, POST /plan-admin/participants, POST /plan-admin/eligibility-determinations, POST /plan-admin/vendor-accounts, POST /plan-admin/contribution-elections, POST /plan-admin/remittance-batches, POST /plan-admin/participant-requests, POST /plan-admin/transfer-exchange-requests"

  - priority: 6
    category: auth
    check: "Ownership: role Participant may only address a participant_id equal to X-User-ID; role VendorRepresentative may only address an InformationSharingAgreement or VendorAccount whose vendor_id equals X-User-ID, and may only answer a TransferExchangeRequest whose destination contract's vendor_id equals X-User-ID; role PlanSponsorAdmin may only address a Plan whose employer_id equals X-User-ID, or a child row whose plan chain resolves to such a Plan."
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "all mutating endpoints"

  - priority: 7
    category: auth
    check: "Segregation of duties: on POST /plan-admin/participant-requests/{id}/decision with decision IN {APPROVE, DENY}, X-User-ID must differ from ParticipantRequest.reviewed_by_user_id; on POST /plan-admin/contribution-elections/{id}/decision, X-User-ID must differ from the determined_by_user_id of the latest non-superseded EligibilityDetermination for that election's (plan_id, participant_id)."
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /plan-admin/participant-requests/{id}/decision, POST /plan-admin/contribution-elections/{id}/decision"

  - priority: 8
    category: state
    check: "Optimistic concurrency: the supplied expected_participant_version equals Participant.version, and the supplied expected_vendor_account_version equals VendorAccount.version."
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /plan-admin/contribution-elections, POST /plan-admin/vendor-accounts/{id}/balance-report"

  - priority: 9
    category: state
    check: "The target row's current state is a declared `from` state for the requested transition in the §1.2 table."
    error_id: ERR_INVALID_STATE_TRANSITION
    http_status: 409
    applies_to: "POST /plan-admin/plans/{id}/status, POST /plan-admin/information-sharing-agreements/{id}/status, POST /plan-admin/contribution-elections/{id}/decision, POST /plan-admin/contribution-elections/{id}/revoke, POST /plan-admin/remittance-batches/{id}/reverse, POST /plan-admin/participant-requests/{id}/decision, POST /plan-admin/participant-requests/{id}/resubmit, POST /plan-admin/participant-requests/{id}/fulfill, POST /plan-admin/transfer-exchange-requests/{id}/vendor-response, POST /plan-admin/transfer-exchange-requests/{id}/decision, POST /plan-admin/transfer-exchange-requests/{id}/execute, POST /plan-admin/transfer-exchange-requests/{id}/reverse"

  - priority: 10
    category: state
    check: "The governing Plan.status IN {ACTIVE, FROZEN}; a plan still in DRAFT or already TERMINATED cannot host the operation."
    error_id: ERR_PLAN_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /plan-admin/information-sharing-agreements, POST /plan-admin/plans/{id}/universal-availability-notices, POST /plan-admin/vendor-accounts, POST /plan-admin/contribution-elections, POST /plan-admin/remittance-batches, POST /plan-admin/participant-requests, POST /plan-admin/transfer-exchange-requests"

  - priority: 11
    category: state
    check: "The governing Plan.status is not FROZEN for operations a frozen plan suspends: creating or approving a ContributionElection, creating a RemittanceBatch, and creating a ParticipantRequest with request_type == LOAN."
    error_id: ERR_PLAN_FROZEN
    http_status: 409
    applies_to: "POST /plan-admin/contribution-elections, POST /plan-admin/contribution-elections/{id}/decision, POST /plan-admin/remittance-batches, POST /plan-admin/participant-requests"

  - priority: 12
    category: state
    check: "Plan.compliance_posture == CLEAR for both the source and the destination plan of a transfer or exchange being approved."
    error_id: ERR_PLAN_UNDER_CORRECTION
    http_status: 409
    applies_to: "POST /plan-admin/transfer-exchange-requests/{id}/decision"

  - priority: 13
    category: state
    check: "RemittanceBatch.deposit_state != DEPOSITED when a deposit is being recorded."
    error_id: ERR_REMITTANCE_ALREADY_DEPOSITED
    http_status: 409
    applies_to: "POST /plan-admin/remittance-batches/{id}/deposit"

  - priority: 14
    category: state
    check: "RemittanceCorrection.state == OPEN when a settlement is being recorded."
    error_id: ERR_CORRECTION_NOT_SETTLEABLE
    http_status: 409
    applies_to: "POST /plan-admin/remittance-batches/{id}/corrections/{correction_id}/settle"

  - priority: 15
    category: state
    check: "Participant.loan_eligibility_flag == AVAILABLE when a request with request_type == LOAN is created."
    error_id: ERR_LOAN_ELIGIBILITY_SUSPENDED
    http_status: 409
    applies_to: "POST /plan-admin/participant-requests"

  - priority: 16
    category: business_safety
    check: "For a plan whose nondiscrimination_regime IN {UA_ONLY, UA_PLUS_410B_401A4}, the latest non-superseded EligibilityDetermination for the (plan, participant) pair has notice_status == CURRENT — i.e. a UniversalAvailabilityNotice with is_valid == true exists for the plan year."
    error_id: ERR_UA_NOTICE_MISSING
    http_status: 422
    applies_to: "POST /plan-admin/contribution-elections/{id}/decision"

  - priority: 17
    category: business_safety
    check: "The asserted_exclusion supplied on an eligibility determination matches the exclusion the participant's facts actually support."
    error_id: ERR_UA_EXCLUSION_NOT_PERMITTED
    http_status: 422
    applies_to: "POST /plan-admin/eligibility-determinations"

  - priority: 18
    category: business_safety
    check: "For a plan whose nondiscrimination_regime == TOP_HAT_457, Participant.is_select_management_or_hce == true before any contract or election is opened."
    error_id: ERR_NOT_TOP_HAT_ELIGIBLE
    http_status: 422
    applies_to: "POST /plan-admin/vendor-accounts, POST /plan-admin/contribution-elections"

  - priority: 19
    category: business_safety
    check: "The latest non-superseded EligibilityDetermination for the (plan, participant) pair exists and has status == ELIGIBLE."
    error_id: ERR_PARTICIPANT_NOT_ELIGIBLE
    http_status: 422
    applies_to: "POST /plan-admin/contribution-elections/{id}/decision"

  - priority: 20
    category: business_safety
    check: "request_type == HARDSHIP only on a PLAN_403B plan with permits_hardship == true; request_type == UNFORESEEABLE_EMERGENCY only on a PLAN_457B plan with permits_unforeseeable_emergency == true; request_type == LOAN only on a plan with permits_loans == true."
    error_id: ERR_DISTRIBUTION_TYPE_NOT_PERMITTED
    http_status: 422
    applies_to: "POST /plan-admin/participant-requests"

  - priority: 21
    category: business_safety
    check: "For request_type == HARDSHIP, safe_harbor_reason != NONE."
    error_id: ERR_HARDSHIP_NOT_SAFE_HARBOR
    http_status: 422
    applies_to: "POST /plan-admin/participant-requests"

  - priority: 22
    category: business_safety
    check: "For request_type == UNFORESEEABLE_EMERGENCY, emergency_reason NOT IN {NONE, COLLEGE_TUITION, PURCHASE_OF_HOME} — neither the purchase of a home nor the payment of college tuition is an unforeseeable emergency."
    error_id: ERR_UE_STANDARD_NOT_MET
    http_status: 422
    applies_to: "POST /plan-admin/participant-requests"

  - priority: 23
    category: business_safety
    check: "For request_type == UNFORESEEABLE_EMERGENCY, insurance_reimbursement_available_cents + liquidatable_assets_cents + deferral_cessation_relief_cents < stated_need_cents."
    error_id: ERR_UE_RELIEF_AVAILABLE
    http_status: 422
    applies_to: "POST /plan-admin/participant-requests/{id}/decision"

  - priority: 24
    category: business_referential
    check: "For request_type == LOAN, every OPEN VendorAccount of the participant in the loan's aggregation set is covered by an InformationSharingAgreement with status == ACTIVE and shares_loan_data == true. For request_type IN {HARDSHIP, UNFORESEEABLE_EMERGENCY}, the agreement covering the single named contract has status == ACTIVE and shares_hardship_data == true."
    error_id: ERR_ISA_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /plan-admin/participant-requests/{id}/decision"

  - priority: 25
    category: business_referential
    check: "Every InformationSharingAgreement relied on by the priority-24 check has data_stale == false."
    error_id: ERR_ISA_DATA_STALE
    http_status: 409
    applies_to: "POST /plan-admin/participant-requests/{id}/decision"

  - priority: 26
    category: business_referential
    check: "For request_kind == CONTRACT_EXCHANGE, the destination contract's vendor holds an InformationSharingAgreement with the plan whose status == ACTIVE and data_stale == false."
    error_id: ERR_EXCHANGE_VENDOR_NOT_APPROVED
    http_status: 422
    applies_to: "POST /plan-admin/transfer-exchange-requests"

  - priority: 27
    category: business_referential
    check: "Plan document permissions and structural shape of the movement: CONTRACT_EXCHANGE requires source_plan_id == destination_plan_id and permits_contract_exchanges; PLAN_TO_PLAN_TRANSFER requires source_plan_id != destination_plan_id, matching plan_type, permits_outgoing_transfers on the source and permits_incoming_transfers on the destination."
    error_id: ERR_TRANSFER_NOT_PERMITTED_BY_PLAN
    http_status: 422
    applies_to: "POST /plan-admin/transfer-exchange-requests"

  - priority: 28
    category: business_referential
    check: "For request_kind == PLAN_TO_PLAN_TRANSFER, Participant.employer_id equals the destination Plan's employer_id."
    error_id: ERR_TRANSFER_PARTICIPANT_NOT_ELIGIBLE
    http_status: 422
    applies_to: "POST /plan-admin/transfer-exchange-requests"

  - priority: 29
    category: business_temporal
    check: "No supplied date is after the current logical clock date: withholding_date, deposit_date, issued_date, as_of_date, data_current_through_date, fulfillment_date and execution_date."
    error_id: ERR_DATE_IN_FUTURE
    http_status: 422
    applies_to: "POST /plan-admin/remittance-batches, POST /plan-admin/remittance-batches/{id}/deposit, POST /plan-admin/plans/{id}/universal-availability-notices, POST /plan-admin/vendor-accounts/{id}/balance-report, POST /plan-admin/information-sharing-agreements/{id}/data-feed, POST /plan-admin/participant-requests/{id}/fulfill, POST /plan-admin/transfer-exchange-requests/{id}/execute"

  - priority: 30
    category: business_temporal
    check: "HALF-OPEN interval rule: the new batch's [pay_period_start, pay_period_end) must not intersect the interval of any other RemittanceBatch for the same plan_id whose deposit_state != REVERSED. Intersection means new.start < other.end AND other.start < new.end, so periods that merely abut (new.start == other.end) are admissible."
    error_id: ERR_REMITTANCE_PERIOD_OVERLAP
    http_status: 409
    applies_to: "POST /plan-admin/remittance-batches"

  - priority: 31
    category: business_temporal
    check: "CLOSED interval rule: the new election's [effective_from, effective_through] must not intersect the window of any ContributionElection for the same (participant_id, plan_id) in state SUBMITTED or EFFECTIVE, unless supersedes_election_id names that very row. Intersection means new.from <= other.through AND other.from <= new.through, so windows that abut on a shared date DO collide."
    error_id: ERR_ELECTION_WINDOW_OVERLAP
    http_status: 409
    applies_to: "POST /plan-admin/contribution-elections"

  - priority: 32
    category: business_temporal
    check: "BUFFERED interval rule: for the same (plan_id, vendor_id), the new agreement must be separated from every existing agreement whose status != TERMINATED by at least ISA_MINIMUM_GAP_DAYS (1) clear day. Conflict means new.effective_from <= other.effective_through + 1 day AND other.effective_from <= new.effective_through + 1 day, so back-to-back agreements with a zero-day gap are rejected."
    error_id: ERR_ISA_INTERVAL_OVERLAP
    http_status: 409
    applies_to: "POST /plan-admin/information-sharing-agreements"

  - priority: 33
    category: business_constraint
    check: "total_elective_deferral_cents equals the sum of elective_deferral_cents over line_items."
    error_id: ERR_REMITTANCE_TOTAL_MISMATCH
    http_status: 422
    applies_to: "POST /plan-admin/remittance-batches"

  - priority: 34
    category: business_constraint
    check: "At most one UniversalAvailabilityNotice may exist per (plan_id, plan_year)."
    error_id: ERR_DUPLICATE_UA_NOTICE
    http_status: 409
    applies_to: "POST /plan-admin/plans/{id}/universal-availability-notices"

  - priority: 35
    category: business_constraint
    check: "catchup_election is structurally compatible with the plan: FINAL_3_YEAR only on PLAN_457B; SERVICE_15_YEAR and AGE_50_AND_SERVICE_15_YEAR only on PLAN_403B; a 457(b) election may never combine the final-three-year and age-50 catch-ups, so AGE_50_AND_SERVICE_15_YEAR is never valid on PLAN_457B."
    error_id: ERR_CATCHUP_COMBINATION_NOT_PERMITTED
    http_status: 422
    applies_to: "POST /plan-admin/contribution-elections"

  - priority: 36
    category: business_constraint
    check: "Every catch-up bucket the election names has non-zero capacity: AGE_50 requires attained_age_at_year_end >= 50 (and, on a 457(b), Plan.is_governmental_457 == true); SERVICE_15_YEAR requires Employer.is_qualified_organization == true and years_of_service >= 15; FINAL_3_YEAR requires attained_age_at_year_end IN {62, 63, 64}."
    error_id: ERR_CATCHUP_NOT_AVAILABLE
    http_status: 422
    applies_to: "POST /plan-admin/contribution-elections"

  - priority: 37
    category: business_fiscal
    check: "deferral_attribution_order leaves no unattributed remainder — the elected annual deferral fits inside the basic limit plus the elected catch-up capacities, measured on deferral_limit_aggregate_402g's gross_basis variant."
    error_id: ERR_402G_LIMIT_EXCEEDED
    http_status: 422
    applies_to: "POST /plan-admin/contribution-elections/{id}/decision"

  - priority: 38
    category: business_fiscal
    check: "annual_additions_415c is not breached by the election being approved (403(b) plans only)."
    error_id: ERR_415C_LIMIT_EXCEEDED
    http_status: 422
    applies_to: "POST /plan-admin/contribution-elections/{id}/decision"

  - priority: 39
    category: business_fiscal
    check: "For request_type == LOAN, the participant's aggregated vested balance across the loan aggregation set is greater than zero."
    error_id: ERR_NO_VESTED_BALANCE
    http_status: 422
    applies_to: "POST /plan-admin/participant-requests, POST /plan-admin/participant-requests/{id}/decision"

  - priority: 40
    category: business_fiscal
    check: "For request_type == LOAN, requested_amount_cents <= loan_maximum_available."
    error_id: ERR_LOAN_LIMIT_EXCEEDED
    http_status: 422
    applies_to: "POST /plan-admin/participant-requests, POST /plan-admin/participant-requests/{id}/decision"

  - priority: 41
    category: business_fiscal
    check: "For request_type IN {HARDSHIP, UNFORESEEABLE_EMERGENCY}, requested_amount_cents <= distribution_max_approvable."
    error_id: ERR_DISTRIBUTION_EXCEEDS_NEED
    http_status: 422
    applies_to: "POST /plan-admin/participant-requests/{id}/decision"

  - priority: 42
    category: business_fiscal
    check: "For request_kind == PLAN_TO_PLAN_TRANSFER, amount_cents <= source VendorAccount.accumulated_benefit_cents."
    error_id: ERR_TRANSFER_AMOUNT_EXCEEDS_BENEFIT
    http_status: 422
    applies_to: "POST /plan-admin/transfer-exchange-requests, POST /plan-admin/transfer-exchange-requests/{id}/execute"

  - priority: 43
    category: business_fiscal
    check: "For request_kind == CONTRACT_EXCHANGE, amount_cents <= source VendorAccount.accumulated_benefit_cents, so that the participant's accumulated benefit immediately after the exchange is at least what it was immediately before."
    error_id: ERR_ACCUMULATED_BENEFIT_REDUCED
    http_status: 422
    applies_to: "POST /plan-admin/transfer-exchange-requests, POST /plan-admin/transfer-exchange-requests/{id}/execute"

# ---------------------------------------------------------------------------
# 1.5 API Endpoint Table
# ---------------------------------------------------------------------------
endpoints:
  # ---- Employer -----------------------------------------------------------
  - method: POST
    path: "/plan-admin/employers"
    description: "Register a plan sponsor. is_governmental and is_qualified_organization are derived from entity_type and organization_subtype and any client-supplied value is ignored."
    roles: [SystemOperator]
    code: 201
    input: [legal_name, ein, entity_type, organization_subtype, total_employee_count]
    output: Employer
    side_effects: ["computes Employer.is_governmental", "computes Employer.is_qualified_organization"]

  - method: GET
    path: "/plan-admin/employers/{id}"
    description: "Read one sponsor."
    roles: [SystemOperator, PlanSponsorAdmin, ComplianceOfficer, VendorRepresentative, Participant]
    code: 200
    input: []
    output: Employer
    side_effects: []

  # ---- Plan ---------------------------------------------------------------
  - method: POST
    path: "/plan-admin/plans"
    description: "Create a plan in DRAFT. nondiscrimination_regime, is_small_plan and is_governmental_457 are computed from the sponsor and plan_type."
    roles: [PlanSponsorAdmin]
    code: 201
    input: [employer_id, plan_name, plan_type, plan_year, reported_participant_count, "permits_loans?", "permits_hardship?", "permits_unforeseeable_emergency?", "permits_contract_exchanges?", "permits_incoming_transfers?", "permits_outgoing_transfers?"]
    output: Plan
    side_effects: ["runs nondiscrimination_regime", "computes Plan.is_small_plan and Plan.is_governmental_457", "initialises open_correction_count to 0 and compliance_posture to CLEAR"]

  - method: GET
    path: "/plan-admin/plans/{id}"
    description: "Read one plan, including its derived nondiscrimination_regime, open_correction_count and compliance_posture."
    roles: [SystemOperator, PlanSponsorAdmin, ComplianceOfficer, VendorRepresentative, Participant]
    code: 200
    input: []
    output: Plan
    side_effects: []

  - method: GET
    path: "/plan-admin/plans"
    description: "List plans, optionally filtered by sponsor, plan type or status."
    roles: [SystemOperator, PlanSponsorAdmin, ComplianceOfficer, VendorRepresentative, Participant]
    code: 200
    input: ["employer_id?", "plan_type?", "status?", "limit?", "offset?"]
    output: Plan[]
    side_effects: []

  - method: POST
    path: "/plan-admin/plans/{id}/status"
    description: "Drive the Plan state machine: DRAFT->ACTIVE, ACTIVE<->FROZEN, ACTIVE|FROZEN->TERMINATED."
    roles: [PlanSponsorAdmin]
    code: 200
    input: [to_status]
    output: Plan
    side_effects: ["on DRAFT->ACTIVE recomputes nondiscrimination_regime, is_small_plan, is_governmental_457", "on ->TERMINATED revokes SUBMITTED/EFFECTIVE elections, terminates non-terminal agreements, and closes every OPEN VendorAccount of the plan", "increments Plan.version by 1"]

  # ---- Vendor -------------------------------------------------------------
  - method: POST
    path: "/plan-admin/vendors"
    description: "Register an annuity or custodial provider."
    roles: [SystemOperator]
    code: 201
    input: [legal_name, vendor_code, contact_email]
    output: Vendor
    side_effects: []

  - method: GET
    path: "/plan-admin/vendors/{id}"
    description: "Read one provider."
    roles: [SystemOperator, PlanSponsorAdmin, ComplianceOfficer, VendorRepresentative, Participant]
    code: 200
    input: []
    output: Vendor
    side_effects: []

  # ---- InformationSharingAgreement ---------------------------------------
  - method: POST
    path: "/plan-admin/information-sharing-agreements"
    description: "Create an information sharing agreement in PENDING between a plan and a provider."
    roles: [PlanSponsorAdmin]
    code: 201
    input: [plan_id, vendor_id, effective_from, effective_through, "shares_loan_data?", "shares_hardship_data?", "shares_contribution_data?"]
    output: InformationSharingAgreement
    side_effects: ["enforces the buffered interval rule against non-TERMINATED agreements for the same (plan_id, vendor_id)", "data_current_through_date starts null so data_stale is true"]

  - method: GET
    path: "/plan-admin/information-sharing-agreements/{id}"
    description: "Read one agreement, including the derived data_stale flag."
    roles: [SystemOperator, PlanSponsorAdmin, ComplianceOfficer, VendorRepresentative, Participant]
    code: 200
    input: []
    output: InformationSharingAgreement
    side_effects: []

  - method: GET
    path: "/plan-admin/information-sharing-agreements"
    description: "List agreements, optionally filtered by plan, vendor or status."
    roles: [SystemOperator, PlanSponsorAdmin, ComplianceOfficer, VendorRepresentative, Participant]
    code: 200
    input: ["plan_id?", "vendor_id?", "status?", "limit?", "offset?"]
    output: InformationSharingAgreement[]
    side_effects: []

  - method: POST
    path: "/plan-admin/information-sharing-agreements/{id}/status"
    description: "Drive the agreement state machine: PENDING->ACTIVE, ACTIVE<->SUSPENDED, any non-terminal->TERMINATED."
    roles: [PlanSponsorAdmin]
    code: 200
    input: [to_status]
    output: InformationSharingAgreement
    side_effects: ["changes which VendorAccounts count as verified for deferral_limit_aggregate_402g", "increments InformationSharingAgreement.version by 1"]

  - method: POST
    path: "/plan-admin/information-sharing-agreements/{id}/data-feed"
    description: "Provider posts a data feed, moving data_current_through_date forward; a SUSPENDED agreement returns to ACTIVE."
    roles: [VendorRepresentative]
    code: 200
    input: [data_current_through_date]
    output: InformationSharingAgreement
    side_effects: ["recomputes data_stale", "SUSPENDED -> ACTIVE when applicable", "increments InformationSharingAgreement.version by 1"]

  # ---- Participant --------------------------------------------------------
  - method: POST
    path: "/plan-admin/participants"
    description: "Register an employee. cumulative_special_catchup_used_cents may be seeded from prior-administrator history."
    roles: [PlanSponsorAdmin]
    code: 201
    input: [employer_id, full_name, date_of_birth, hire_date, scheduled_hours_per_week, prior_year_hours_worked, includible_compensation_cents, years_of_service, "employment_status?", "termination_date?", "is_student_performing_services?", "is_nonresident_alien_no_us_income?", "is_select_management_or_hce?", "prior_employer_elective_deferrals_cents?", "underutilized_prior_limit_cents?", "cumulative_special_catchup_used_cents?"]
    output: Participant
    side_effects: ["computes attained_age_at_year_end from the logical clock", "initialises every aggregate field to 0 and loan_eligibility_flag to AVAILABLE"]

  - method: GET
    path: "/plan-admin/participants/{id}"
    description: "Read one participant, including every cross-contract aggregate."
    roles: [SystemOperator, PlanSponsorAdmin, ComplianceOfficer, VendorRepresentative, Participant]
    code: 200
    input: []
    output: Participant
    side_effects: []

  - method: GET
    path: "/plan-admin/participants"
    description: "List participants, optionally filtered by employer or employment status."
    roles: [SystemOperator, PlanSponsorAdmin, ComplianceOfficer, VendorRepresentative, Participant]
    code: 200
    input: ["employer_id?", "employment_status?", "limit?", "offset?"]
    output: Participant[]
    side_effects: []

  - method: PATCH
    path: "/plan-admin/participants/{id}"
    description: "Update employment facts that drive eligibility, catch-up and 415(c) ceilings."
    roles: [PlanSponsorAdmin]
    code: 200
    input: ["scheduled_hours_per_week?", "prior_year_hours_worked?", "employment_status?", "termination_date?", "includible_compensation_cents?", "years_of_service?", "is_select_management_or_hce?", "is_student_performing_services?", "is_nonresident_alien_no_us_income?"]
    output: Participant
    side_effects: ["increments Participant.version by 1"]

  # ---- UniversalAvailabilityNotice ---------------------------------------
  - method: POST
    path: "/plan-admin/plans/{id}/universal-availability-notices"
    description: "Record the annual universal availability notice for a plan year; is_valid is derived by universal_availability_notice_validity."
    roles: [PlanSponsorAdmin]
    code: 201
    input: [plan_year, issued_date, delivery_method, recipient_count, describes_effective_opportunity]
    output: UniversalAvailabilityNotice
    side_effects: ["runs universal_availability_notice_validity", "later EligibilityDeterminations for this plan year resolve notice_status against this row"]

  - method: GET
    path: "/plan-admin/plans/{id}/universal-availability-notices"
    description: "List the notices recorded for one plan."
    roles: [SystemOperator, PlanSponsorAdmin, ComplianceOfficer, VendorRepresentative, Participant]
    code: 200
    input: ["plan_year?", "limit?", "offset?"]
    output: UniversalAvailabilityNotice[]
    side_effects: []

  # ---- EligibilityDetermination ------------------------------------------
  - method: POST
    path: "/plan-admin/eligibility-determinations"
    description: "Run the eligibility_determination calculation for one (plan, participant) pair and persist the outcome, superseding any earlier determination for that pair."
    roles: [ComplianceOfficer]
    code: 201
    input: [plan_id, participant_id, "asserted_exclusion?"]
    output: EligibilityDetermination
    side_effects: ["runs eligibility_determination", "sets superseded = true on every earlier determination for the same (plan_id, participant_id)", "records determined_by_user_id from X-User-ID"]

  - method: GET
    path: "/plan-admin/eligibility-determinations/{id}"
    description: "Read one determination."
    roles: [SystemOperator, PlanSponsorAdmin, ComplianceOfficer, VendorRepresentative, Participant]
    code: 200
    input: []
    output: EligibilityDetermination
    side_effects: []

  - method: GET
    path: "/plan-admin/eligibility-determinations"
    description: "List determinations, optionally filtered by plan, participant, status or supersession."
    roles: [SystemOperator, PlanSponsorAdmin, ComplianceOfficer, VendorRepresentative, Participant]
    code: 200
    input: ["plan_id?", "participant_id?", "status?", "superseded?", "limit?", "offset?"]
    output: EligibilityDetermination[]
    side_effects: []

  # ---- VendorAccount ------------------------------------------------------
  - method: POST
    path: "/plan-admin/vendor-accounts"
    description: "Open a provider contract for a participant under a plan."
    roles: [PlanSponsorAdmin, VendorRepresentative]
    code: 201
    input: [participant_id, plan_id, vendor_id, contract_number, "accumulated_benefit_cents?", "vested_percentage_bps?", "prior_years_elective_deferrals_cents?"]
    output: VendorAccount
    side_effects: ["computes vested_balance_cents", "recomputes the participant's total_accumulated_benefit_cents, total_vested_balance_cents and lifetime_elective_deferrals_cents"]

  - method: GET
    path: "/plan-admin/vendor-accounts/{id}"
    description: "Read one contract."
    roles: [SystemOperator, PlanSponsorAdmin, ComplianceOfficer, VendorRepresentative, Participant]
    code: 200
    input: []
    output: VendorAccount
    side_effects: []

  - method: GET
    path: "/plan-admin/vendor-accounts"
    description: "List contracts, optionally filtered by participant, plan, vendor or status."
    roles: [SystemOperator, PlanSponsorAdmin, ComplianceOfficer, VendorRepresentative, Participant]
    code: 200
    input: ["participant_id?", "plan_id?", "vendor_id?", "status?", "limit?", "offset?"]
    output: VendorAccount[]
    side_effects: []

  - method: POST
    path: "/plan-admin/vendor-accounts/{id}/balance-report"
    description: "Provider reports contract balances under the information sharing agreement. Guarded by optimistic concurrency on the contract's version."
    roles: [VendorRepresentative]
    code: 200
    input: [expected_vendor_account_version, as_of_date, accumulated_benefit_cents, outstanding_loan_balance_cents, highest_outstanding_loan_12mo_cents, "ytd_elective_deferrals_cents?", "ytd_employer_contributions_cents?", "prior_years_elective_deferrals_cents?"]
    output: VendorAccount
    side_effects: ["recomputes vested_balance_cents", "recomputes every Participant aggregate and loan_eligibility_flag", "stores last_balance_report_date", "increments VendorAccount.version by 1"]

  # ---- ContributionElection ----------------------------------------------
  - method: POST
    path: "/plan-admin/contribution-elections"
    description: "Submit a deferral election. Guarded by optimistic concurrency on the participant's version because an election legitimately supersedes the prior EFFECTIVE one."
    roles: [PlanSponsorAdmin, Participant]
    code: 201
    input: [participant_id, plan_id, vendor_account_id, annual_deferral_amount_cents, effective_from, effective_through, expected_participant_version, "catchup_election?", "supersedes_election_id?"]
    output: ContributionElection
    side_effects: ["enforces the closed-interval election window rule", "records submitted_by_user_id from X-User-ID", "increments Participant.version by 1"]

  - method: GET
    path: "/plan-admin/contribution-elections/{id}"
    description: "Read one election, including its four attribution fields."
    roles: [SystemOperator, PlanSponsorAdmin, ComplianceOfficer, VendorRepresentative, Participant]
    code: 200
    input: []
    output: ContributionElection
    side_effects: []

  - method: GET
    path: "/plan-admin/contribution-elections"
    description: "List elections, optionally filtered by participant, plan, contract, superseded election or state."
    roles: [SystemOperator, PlanSponsorAdmin, ComplianceOfficer, VendorRepresentative, Participant]
    code: 200
    input: ["participant_id?", "plan_id?", "vendor_account_id?", "supersedes_election_id?", "state?", "limit?", "offset?"]
    output: ContributionElection[]
    side_effects: []

  - method: POST
    path: "/plan-admin/contribution-elections/{id}/decision"
    description: "Compliance decision on a submitted election: APPROVE runs deferral_attribution_order, REJECT closes it."
    roles: [ComplianceOfficer]
    code: 200
    input: [decision, "note?"]
    output: ContributionElection
    side_effects: ["runs deferral_attribution_order and writes the four attribution fields", "increments Participant.cumulative_special_catchup_used_cents by service_catchup_attributed_cents", "supersedes the named prior election, then recomputes Participant.projected_annual_deferral_cents, then recomputes Plan.projected_excess_participant_count", "increments ContributionElection.version by 1"]

  - method: POST
    path: "/plan-admin/contribution-elections/{id}/revoke"
    description: "Withdraw a submitted or effective election, returning any consumed lifetime special catch-up."
    roles: [PlanSponsorAdmin, Participant]
    code: 200
    input: ["reason?"]
    output: ContributionElection
    side_effects: ["decrements Participant.cumulative_special_catchup_used_cents by service_catchup_attributed_cents", "recomputes Participant.projected_annual_deferral_cents and Plan.projected_excess_participant_count", "increments ContributionElection.version by 1"]

  # ---- RemittanceBatch ----------------------------------------------------
  - method: POST
    path: "/plan-admin/remittance-batches"
    description: "Record withheld elective deferrals for one pay period, with a per-contract breakdown."
    roles: [PlanSponsorAdmin]
    code: 201
    input: [plan_id, pay_period_start, pay_period_end, withholding_date, total_elective_deferral_cents, line_items, "segregation_feasible_date?"]
    output: RemittanceBatch
    side_effects: ["enforces the half-open pay-period overlap rule", "enforces total_elective_deferral_cents against the line_items sum", "deposit_state starts WITHHELD and compliance_state starts UNDETERMINED"]

  - method: GET
    path: "/plan-admin/remittance-batches/{id}"
    description: "Read one batch, including deadline_date and both lateness counters."
    roles: [SystemOperator, PlanSponsorAdmin, ComplianceOfficer, VendorRepresentative, Participant]
    code: 200
    input: []
    output: RemittanceBatch
    side_effects: []

  - method: GET
    path: "/plan-admin/remittance-batches"
    description: "List batches, optionally filtered by plan or by either state axis."
    roles: [SystemOperator, PlanSponsorAdmin, ComplianceOfficer, VendorRepresentative, Participant]
    code: 200
    input: ["plan_id?", "deposit_state?", "compliance_state?", "limit?", "offset?"]
    output: RemittanceBatch[]
    side_effects: []

  - method: POST
    path: "/plan-admin/remittance-batches/{id}/deposit"
    description: "Record the deposit of a withheld or previously reversed batch; runs remittance_deadline and starts the correction cascade when late."
    roles: [PlanSponsorAdmin]
    code: 200
    input: [deposit_date]
    output: RemittanceBatch
    side_effects: ["credits every line's contract with elective and employer contributions", "runs remittance_deadline and sets compliance_state to TIMELY or LATE", "on LATE, runs lost_earnings_correction and excise_tax_on_late_deposit, creates an OPEN RemittanceCorrection, adds each line's lost earnings to VendorAccount.pending_lost_earnings_cents, recomputes Plan.open_correction_count, and flips Plan.compliance_posture to UNDER_CORRECTION", "increments RemittanceBatch.version by 1"]

  - method: POST
    path: "/plan-admin/remittance-batches/{id}/reverse"
    description: "Reverse a deposited batch, undoing every credit and voiding every OPEN correction it produced."
    roles: [PlanSponsorAdmin]
    code: 200
    input: [reason]
    output: RemittanceBatch
    side_effects: ["debits back every line's elective and employer contributions", "moves every OPEN RemittanceCorrection of the batch to VOIDED and removes its lost earnings from VendorAccount.pending_lost_earnings_cents", "recomputes Plan.open_correction_count and Plan.compliance_posture", "resets compliance_state to UNDETERMINED and both lateness counters to 0", "increments RemittanceBatch.version by 1"]

  - method: GET
    path: "/plan-admin/remittance-batches/{id}/corrections"
    description: "List the corrections produced by one batch."
    roles: [SystemOperator, PlanSponsorAdmin, ComplianceOfficer, VendorRepresentative, Participant]
    code: 200
    input: ["state?", "limit?", "offset?"]
    output: RemittanceCorrection[]
    side_effects: []

  - method: POST
    path: "/plan-admin/remittance-batches/{id}/corrections/{correction_id}/settle"
    description: "Record settlement of an open lost-earnings correction."
    roles: [ComplianceOfficer]
    code: 200
    input: [settlement_reference]
    output: RemittanceCorrection
    side_effects: ["moves the correction OPEN -> SETTLED and removes its lost earnings from VendorAccount.pending_lost_earnings_cents", "recomputes Plan.open_correction_count and Plan.compliance_posture", "moves the batch's compliance_state CORRECTION_PENDING -> CORRECTED when no OPEN correction remains", "increments RemittanceCorrection.version by 1"]

  # ---- ParticipantRequest -------------------------------------------------
  - method: POST
    path: "/plan-admin/participant-requests"
    description: "Submit a loan, 403(b) hardship, or 457(b) unforeseeable emergency request."
    roles: [PlanSponsorAdmin, Participant]
    code: 201
    input: [participant_id, plan_id, vendor_account_id, request_type, requested_amount_cents, "stated_need_cents?", "estimated_taxes_cents?", "safe_harbor_reason?", "emergency_reason?", "insurance_reimbursement_available_cents?", "liquidatable_assets_cents?", "deferral_cessation_relief_cents?", "loan_term_months?"]
    output: ParticipantRequest
    side_effects: ["records submitted_by_user_id from X-User-ID", "for LOAN requests, screens against Participant.loan_eligibility_flag and loan_maximum_available"]

  - method: GET
    path: "/plan-admin/participant-requests/{id}"
    description: "Read one request, including max_approvable_cents and the review/decision user ids."
    roles: [SystemOperator, PlanSponsorAdmin, ComplianceOfficer, VendorRepresentative, Participant]
    code: 200
    input: []
    output: ParticipantRequest
    side_effects: []

  - method: GET
    path: "/plan-admin/participant-requests"
    description: "List requests, optionally filtered by participant, plan, contract, type or state."
    roles: [SystemOperator, PlanSponsorAdmin, ComplianceOfficer, VendorRepresentative, Participant]
    code: 200
    input: ["participant_id?", "plan_id?", "vendor_account_id?", "request_type?", "state?", "limit?", "offset?"]
    output: ParticipantRequest[]
    side_effects: []

  - method: POST
    path: "/plan-admin/participant-requests/{id}/decision"
    description: "Compliance action on a request: BEGIN_REVIEW, RETURN_FOR_INFO, APPROVE or DENY. APPROVE and DENY require a different officer from the one who opened review."
    roles: [ComplianceOfficer]
    code: 200
    input: [decision, "note?"]
    output: ParticipantRequest
    side_effects: ["BEGIN_REVIEW records reviewed_by_user_id", "APPROVE runs loan_maximum_available or distribution_max_approvable, writes max_approvable_cents and approved_amount_cents, and records decided_by_user_id", "increments ParticipantRequest.version by 1"]

  - method: POST
    path: "/plan-admin/participant-requests/{id}/resubmit"
    description: "Return a RETURNED_FOR_INFO request to SUBMITTED, optionally revising amounts and relief figures."
    roles: [PlanSponsorAdmin, Participant]
    code: 200
    input: ["requested_amount_cents?", "stated_need_cents?", "estimated_taxes_cents?", "insurance_reimbursement_available_cents?", "liquidatable_assets_cents?", "deferral_cessation_relief_cents?"]
    output: ParticipantRequest
    side_effects: ["overwrites the supplied fields", "increments resubmission_count", "clears reviewed_by_user_id", "increments ParticipantRequest.version by 1"]

  - method: POST
    path: "/plan-admin/participant-requests/{id}/fulfill"
    description: "Disburse an approved loan or pay an approved distribution; the branch taken depends on request_type."
    roles: [PlanSponsorAdmin]
    code: 200
    input: [fulfillment_date]
    output: ParticipantRequest
    side_effects: ["LOAN branch: increases VendorAccount.outstanding_loan_balance_cents and highest_outstanding_loan_12mo_cents, then recomputes the Participant loan aggregates, then drives Participant.loan_eligibility_flag to SUSPENDED when loan_maximum_available reaches 0", "HARDSHIP/UNFORESEEABLE_EMERGENCY branch: reduces VendorAccount.accumulated_benefit_cents and recomputes vested and participant balance aggregates", "increments ParticipantRequest.version by 1"]

  # ---- TransferExchangeRequest -------------------------------------------
  - method: POST
    path: "/plan-admin/transfer-exchange-requests"
    description: "Submit a contract exchange within one plan or a plan-to-plan transfer between two plans of the same type."
    roles: [PlanSponsorAdmin, Participant]
    code: 201
    input: [participant_id, request_kind, source_plan_id, destination_plan_id, source_vendor_account_id, destination_vendor_account_id, amount_cents]
    output: TransferExchangeRequest
    side_effects: ["runs exchange_transfer_admissibility for the declared request_kind"]

  - method: GET
    path: "/plan-admin/transfer-exchange-requests/{id}"
    description: "Read one movement request, including the execution snapshots."
    roles: [SystemOperator, PlanSponsorAdmin, ComplianceOfficer, VendorRepresentative, Participant]
    code: 200
    input: []
    output: TransferExchangeRequest
    side_effects: []

  - method: GET
    path: "/plan-admin/transfer-exchange-requests"
    description: "List movement requests, optionally filtered by participant, either plan, either contract, kind or state."
    roles: [SystemOperator, PlanSponsorAdmin, ComplianceOfficer, VendorRepresentative, Participant]
    code: 200
    input: ["participant_id?", "source_plan_id?", "destination_plan_id?", "source_vendor_account_id?", "destination_vendor_account_id?", "request_kind?", "state?", "limit?", "offset?"]
    output: TransferExchangeRequest[]
    side_effects: []

  - method: POST
    path: "/plan-admin/transfer-exchange-requests/{id}/vendor-response"
    description: "Receiving provider accepts or rejects the incoming money."
    roles: [VendorRepresentative]
    code: 200
    input: [accepted, "rejection_reason?"]
    output: TransferExchangeRequest
    side_effects: ["SUBMITTED -> ACCEPTED_BY_VENDOR or SUBMITTED -> REJECTED_BY_VENDOR", "increments TransferExchangeRequest.version by 1"]

  - method: POST
    path: "/plan-admin/transfer-exchange-requests/{id}/decision"
    description: "Compliance action: APPROVE an accepted request, DENY it, or RESUBMIT a vendor-rejected one back to SUBMITTED."
    roles: [ComplianceOfficer]
    code: 200
    input: [decision, "note?"]
    output: TransferExchangeRequest
    side_effects: ["APPROVE re-runs exchange_transfer_admissibility and requires CLEAR compliance_posture on both plans", "RESUBMIT clears vendor_rejection_reason and increments resubmit_count", "increments TransferExchangeRequest.version by 1"]

  - method: POST
    path: "/plan-admin/transfer-exchange-requests/{id}/execute"
    description: "Move the money between the two contracts."
    roles: [PlanSponsorAdmin]
    code: 200
    input: [execution_date]
    output: TransferExchangeRequest
    side_effects: ["snapshots both contracts' accumulated_benefit_cents", "debits the source and credits the destination by amount_cents", "recomputes both vested_balance_cents and the participant's balance aggregates", "increments TransferExchangeRequest.version by 1"]

  - method: POST
    path: "/plan-admin/transfer-exchange-requests/{id}/reverse"
    description: "Compensating action for an executed movement; returns both contracts to their pre-execution balances."
    roles: [ComplianceOfficer]
    code: 200
    input: [reason]
    output: TransferExchangeRequest
    side_effects: ["credits the source and debits the destination by amount_cents", "recomputes both vested_balance_cents and the participant's balance aggregates", "leaves the sum of accumulated_benefit_cents over the participant's OPEN contracts exactly where it was before execution", "increments TransferExchangeRequest.version by 1"]

  # ---- Computed reads -----------------------------------------------------
  - method: GET
    path: "/plan-admin/participants/{id}/contribution-limit-summary"
    description: "Aggregated elective-deferral picture for one participant in one plan's bucket, reporting the gross (enforcement) and verified (advisory) variants side by side together with every catch-up capacity. usable_catchup_capacity_cents is service_15yr_catchup_capacity_cents + age50_catchup_capacity_cents for a PLAN_403B bucket (the two 403(b) catch-ups stack) and max(final_3yr_catchup_capacity_cents, age50_catchup_capacity_cents) for a PLAN_457B bucket (the greater of, never the sum); total_limit_cents is always basic_limit_cents + usable_catchup_capacity_cents. included_vendor_account_ids is accounts_all and verified_vendor_account_ids is accounts_verified from deferral_limit_aggregate_402g."
    roles: [SystemOperator, PlanSponsorAdmin, ComplianceOfficer, VendorRepresentative, Participant]
    code: 200
    input: [plan_id, "plan_year?"]
    output:
      participant_id: string
      plan_id: string
      plan_year: integer
      bucket_plan_type: string
      basic_limit_cents: integer
      service_15yr_catchup_capacity_cents: integer
      age50_catchup_capacity_cents: integer
      final_3yr_catchup_capacity_cents: integer
      usable_catchup_capacity_cents: integer
      total_limit_cents: integer
      ytd_gross_cents: integer
      ytd_verified_cents: integer
      room_gross_cents: integer
      room_verified_cents: integer
      lifetime_elective_deferrals_cents: integer
      annual_additions_cents: integer
      annual_additions_limit_cents: integer
      included_vendor_account_ids: array
      verified_vendor_account_ids: array
    side_effects: []

  - method: GET
    path: "/plan-admin/participants/{id}/loan-capacity"
    description: "Loan headroom for one participant in one plan's aggregation set, with both statutory caps exposed separately."
    roles: [SystemOperator, PlanSponsorAdmin, ComplianceOfficer, VendorRepresentative, Participant]
    code: 200
    input: [plan_id]
    output:
      participant_id: string
      plan_id: string
      vested_total_cents: integer
      outstanding_total_cents: integer
      highest_outstanding_12mo_cents: integer
      cap_statutory_cents: integer
      cap_vested_cents: integer
      maximum_loan_cents: integer
      loan_eligibility_flag: string
      included_vendor_account_ids: array
      unverified_vendor_account_ids: array
    side_effects: []

  # ---- Test-driving endpoint ---------------------------------------------
  - method: POST
    path: "/plan-admin/_clock/set_current_utc"
    description: "Set the server's logical clock. The clock is what every date comparison, staleness test, age computation and deadline evaluation reads. At startup, before any call to this endpoint, the logical clock reads exactly 2026-08-01T00:00:00Z and MUST NOT fall back to real wall-clock time."
    roles: [SystemOperator]
    code: 200
    input: [to_iso8601]
    output:
      current_utc: string
      previous_utc: string
    side_effects: ["changes InformationSharingAgreement.data_stale for every agreement", "changes Participant.attained_age_at_year_end when the calendar year changes"]

# ---------------------------------------------------------------------------
# 1.6 Error Code Catalog
# ---------------------------------------------------------------------------
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID missing, or X-User-Role is not a declared role."
  - id: ERR_UNAUTHORIZED_ROLE
    http: 403
    condition: "The acting role is not listed in the endpoint's roles."
  - id: ERR_NOT_RESOURCE_OWNER
    http: 403
    condition: "The acting entity-backed role does not own the addressed resource."
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "The deciding officer is the same user who opened review, or the same user who ran the governing eligibility determination."
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "Malformed body or query: missing required field, bad enum member, non-integer cents, unparseable date, limit outside [1,100], or empty line_items."
  - id: ERR_EMPLOYER_NOT_FOUND
    http: 404
    condition: "No Employer with the referenced id."
  - id: ERR_PLAN_NOT_FOUND
    http: 404
    condition: "No Plan with the referenced id."
  - id: ERR_VENDOR_NOT_FOUND
    http: 404
    condition: "No Vendor with the referenced id."
  - id: ERR_PARTICIPANT_NOT_FOUND
    http: 404
    condition: "No Participant with the referenced id."
  - id: ERR_ISA_NOT_FOUND
    http: 404
    condition: "No InformationSharingAgreement with the referenced id."
  - id: ERR_ELIGIBILITY_NOT_FOUND
    http: 404
    condition: "No EligibilityDetermination with the referenced id."
  - id: ERR_VENDOR_ACCOUNT_NOT_FOUND
    http: 404
    condition: "No VendorAccount with the referenced id."
  - id: ERR_ELECTION_NOT_FOUND
    http: 404
    condition: "No ContributionElection with the referenced id, including a supersedes_election_id that does not resolve."
  - id: ERR_REMITTANCE_BATCH_NOT_FOUND
    http: 404
    condition: "No RemittanceBatch with the referenced id."
  - id: ERR_CORRECTION_NOT_FOUND
    http: 404
    condition: "No RemittanceCorrection with the referenced id under the addressed batch."
  - id: ERR_PARTICIPANT_REQUEST_NOT_FOUND
    http: 404
    condition: "No ParticipantRequest with the referenced id."
  - id: ERR_TRANSFER_REQUEST_NOT_FOUND
    http: 404
    condition: "No TransferExchangeRequest with the referenced id."
  - id: ERR_STALE_VERSION
    http: 412
    condition: "expected_participant_version or expected_vendor_account_version does not match the stored version."
  - id: ERR_INVALID_STATE_TRANSITION
    http: 409
    condition: "The addressed row is not in a declared `from` state for the requested transition."
  - id: ERR_PLAN_NOT_ACTIVE
    http: 409
    condition: "The governing plan is still DRAFT or already TERMINATED."
  - id: ERR_PLAN_FROZEN
    http: 409
    condition: "The governing plan is FROZEN and the operation is one a freeze suspends."
  - id: ERR_PLAN_UNDER_CORRECTION
    http: 409
    condition: "A plan involved in the movement has compliance_posture == UNDER_CORRECTION."
  - id: ERR_REMITTANCE_ALREADY_DEPOSITED
    http: 409
    condition: "A deposit is recorded against a batch whose deposit_state is already DEPOSITED."
  - id: ERR_CORRECTION_NOT_SETTLEABLE
    http: 409
    condition: "A settlement is recorded against a correction that is not in state OPEN."
  - id: ERR_LOAN_ELIGIBILITY_SUSPENDED
    http: 409
    condition: "A LOAN request is created while Participant.loan_eligibility_flag == SUSPENDED."
  - id: ERR_UA_NOTICE_MISSING
    http: 422
    condition: "A universal-availability plan has no valid UniversalAvailabilityNotice for its plan year at the moment an election is approved."
  - id: ERR_UA_EXCLUSION_NOT_PERMITTED
    http: 422
    condition: "The asserted_exclusion is not supported by the participant's facts."
  - id: ERR_NOT_TOP_HAT_ELIGIBLE
    http: 422
    condition: "A non-governmental 457(b) plan is opened to a participant outside the select management or highly compensated group."
  - id: ERR_PARTICIPANT_NOT_ELIGIBLE
    http: 422
    condition: "The latest non-superseded eligibility determination is absent or its status is not ELIGIBLE."
  - id: ERR_DISTRIBUTION_TYPE_NOT_PERMITTED
    http: 422
    condition: "Hardship requested on a 457(b) plan, unforeseeable emergency requested on a 403(b) plan, or the plan document does not permit the requested type."
  - id: ERR_HARDSHIP_NOT_SAFE_HARBOR
    http: 422
    condition: "A hardship request carries safe_harbor_reason == NONE."
  - id: ERR_UE_STANDARD_NOT_MET
    http: 422
    condition: "An unforeseeable emergency request cites NONE, COLLEGE_TUITION or PURCHASE_OF_HOME."
  - id: ERR_UE_RELIEF_AVAILABLE
    http: 422
    condition: "Insurance, liquidation and deferral-cessation relief together already meet or exceed the stated need."
  - id: ERR_ISA_NOT_ACTIVE
    http: 409
    condition: "A required information sharing agreement is absent, PENDING, SUSPENDED or TERMINATED, or does not share the needed data class."
  - id: ERR_ISA_DATA_STALE
    http: 409
    condition: "A required information sharing agreement's data_current_through_date is null or older than 45 days before the logical clock date."
  - id: ERR_ISA_INTERVAL_OVERLAP
    http: 409
    condition: "A new agreement is not separated by at least one clear day from an existing non-TERMINATED agreement for the same plan and vendor."
  - id: ERR_EXCHANGE_VENDOR_NOT_APPROVED
    http: 422
    condition: "The receiving vendor of a contract exchange has no ACTIVE, non-stale agreement with the plan."
  - id: ERR_TRANSFER_NOT_PERMITTED_BY_PLAN
    http: 422
    condition: "Plan document permissions or the structural shape of the movement forbid it."
  - id: ERR_TRANSFER_PARTICIPANT_NOT_ELIGIBLE
    http: 422
    condition: "The participant is neither an employee nor a former employee of the receiving plan's sponsor."
  - id: ERR_DATE_IN_FUTURE
    http: 422
    condition: "A supplied date is after the current logical clock date."
  - id: ERR_REMITTANCE_PERIOD_OVERLAP
    http: 409
    condition: "The new half-open pay period intersects an existing non-reversed batch for the same plan."
  - id: ERR_ELECTION_WINDOW_OVERLAP
    http: 409
    condition: "The new closed election window intersects an existing SUBMITTED or EFFECTIVE window for the same participant and plan without superseding it."
  - id: ERR_REMITTANCE_TOTAL_MISMATCH
    http: 422
    condition: "total_elective_deferral_cents does not equal the sum of the line items' elective_deferral_cents."
  - id: ERR_DUPLICATE_UA_NOTICE
    http: 409
    condition: "A notice already exists for the plan and plan year."
  - id: ERR_CATCHUP_COMBINATION_NOT_PERMITTED
    http: 422
    condition: "The elected catch-up combination is structurally impossible for the plan type, including any attempt to stack the 457(b) final-three-year catch-up with the age-50 catch-up."
  - id: ERR_CATCHUP_NOT_AVAILABLE
    http: 422
    condition: "An elected catch-up bucket has zero capacity for this participant."
  - id: ERR_402G_LIMIT_EXCEEDED
    http: 422
    condition: "The attribution waterfall leaves an unattributed remainder against the gross-basis aggregate."
  - id: ERR_415C_LIMIT_EXCEEDED
    http: 422
    condition: "Annual additions across every 403(b) contract would exceed the lesser of the dollar limit and includible compensation."
  - id: ERR_NO_VESTED_BALANCE
    http: 422
    condition: "A loan is requested against an aggregation set whose vested total is zero."
  - id: ERR_LOAN_LIMIT_EXCEEDED
    http: 422
    condition: "The requested loan exceeds loan_maximum_available."
  - id: ERR_DISTRIBUTION_EXCEEDS_NEED
    http: 422
    condition: "The requested distribution exceeds distribution_max_approvable."
  - id: ERR_TRANSFER_AMOUNT_EXCEEDS_BENEFIT
    http: 422
    condition: "A plan-to-plan transfer amount exceeds the source contract's accumulated benefit."
  - id: ERR_ACCUMULATED_BENEFIT_REDUCED
    http: 422
    condition: "A contract exchange amount exceeds the source contract's accumulated benefit, so the participant's accumulated benefit after the exchange would be less than before."

# ---------------------------------------------------------------------------
# 1.7 RBAC Matrix
# ---------------------------------------------------------------------------
roles:
  - name: SystemOperator
    description: "Platform operator that seeds sponsors and providers and controls the logical clock."
    identity: "opaque"
    exclusive_operations:
      - "POST /plan-admin/employers"
      - "POST /plan-admin/vendors"
      - "POST /plan-admin/_clock/set_current_utc"
    shared_operations:
      - "every GET endpoint"

  - name: PlanSponsorAdmin
    description: "Employer-side plan administrator. X-User-ID is the id of the Employer the administrator acts for."
    identity: "entity_backed:Employer"
    exclusive_operations:
      - "POST /plan-admin/plans"
      - "POST /plan-admin/plans/{id}/status"
      - "POST /plan-admin/information-sharing-agreements"
      - "POST /plan-admin/information-sharing-agreements/{id}/status"
      - "POST /plan-admin/participants"
      - "PATCH /plan-admin/participants/{id}"
      - "POST /plan-admin/plans/{id}/universal-availability-notices"
      - "POST /plan-admin/remittance-batches"
      - "POST /plan-admin/remittance-batches/{id}/deposit"
      - "POST /plan-admin/remittance-batches/{id}/reverse"
      - "POST /plan-admin/participant-requests/{id}/fulfill"
      - "POST /plan-admin/transfer-exchange-requests/{id}/execute"
    shared_operations:
      - "POST /plan-admin/vendor-accounts (with VendorRepresentative)"
      - "POST /plan-admin/contribution-elections (with Participant)"
      - "POST /plan-admin/contribution-elections/{id}/revoke (with Participant)"
      - "POST /plan-admin/participant-requests (with Participant)"
      - "POST /plan-admin/participant-requests/{id}/resubmit (with Participant)"
      - "POST /plan-admin/transfer-exchange-requests (with Participant)"
      - "every GET endpoint"

  - name: ComplianceOfficer
    description: "Independent reviewer. Segregation of duties forbids the same officer from opening review and then approving, and from running an eligibility determination and then approving the election it governs."
    identity: "opaque"
    exclusive_operations:
      - "POST /plan-admin/eligibility-determinations"
      - "POST /plan-admin/contribution-elections/{id}/decision"
      - "POST /plan-admin/participant-requests/{id}/decision"
      - "POST /plan-admin/transfer-exchange-requests/{id}/decision"
      - "POST /plan-admin/transfer-exchange-requests/{id}/reverse"
      - "POST /plan-admin/remittance-batches/{id}/corrections/{correction_id}/settle"
    shared_operations:
      - "every GET endpoint"

  - name: VendorRepresentative
    description: "Provider-side operator. X-User-ID is the id of the Vendor the representative acts for."
    identity: "entity_backed:Vendor"
    exclusive_operations:
      - "POST /plan-admin/information-sharing-agreements/{id}/data-feed"
      - "POST /plan-admin/vendor-accounts/{id}/balance-report"
      - "POST /plan-admin/transfer-exchange-requests/{id}/vendor-response"
    shared_operations:
      - "POST /plan-admin/vendor-accounts (with PlanSponsorAdmin)"
      - "every GET endpoint"

  - name: Participant
    description: "Employee acting on their own record. X-User-ID is the id of the Participant."
    identity: "entity_backed:Participant"
    exclusive_operations: []
    shared_operations:
      - "POST /plan-admin/contribution-elections (with PlanSponsorAdmin)"
      - "POST /plan-admin/contribution-elections/{id}/revoke (with PlanSponsorAdmin)"
      - "POST /plan-admin/participant-requests (with PlanSponsorAdmin)"
      - "POST /plan-admin/participant-requests/{id}/resubmit (with PlanSponsorAdmin)"
      - "POST /plan-admin/transfer-exchange-requests (with PlanSponsorAdmin)"
      - "every GET endpoint"
