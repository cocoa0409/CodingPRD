            - "${swept} == \"2026-08-01T00:00:00Z\" — swept_at is the logical clock, not wall time"
            - "${renew_due2} == 0 and ${overdue2} == 0 and ${swept2} == \"2026-08-01T00:00:00Z\" — the repeat call is a clean no-op"
            - "Facility ${fac_id}.registration_status is still \"REGISTERED\" and compliance_posture is still \"OPEN\""
            - "ProductListing ${lst_id}.listing_status is still \"DRAFT\""
            - "GET /cosmetics/facilities/${fac_id}/ledger-entries returns the same row count before and after both sweeps"

      - name: listing_read_recomputes_its_derived_disclosure_fields_after_each_ingredient_write
        claim_type: computed_read
        grounds:
          - endpoints[GET /cosmetics/listings/{id}]
          - entities.ProductListing.fields.undisclosed_allergen_count
          - calculations.allergen_disclosure_completeness
        distinguishing_aspect: |
          The read-side projection tracks source writes rather than a stale snapshot: an empty listing
          reads complete == true / count == 0, adding one undisclosed 0.0020 LEAVE_ON allergen flips it to
          false / 1, and adding a second DISCLOSED allergen leaves the count at 1 — the disclosed row
          never inflates the counter.
        test_recipe:
          setup:
            - "one REGISTERED facility, one ResponsiblePerson, one LEAVE_ON consumer listing with no ingredients"
          setup_api_calls:
            - call: "POST /cosmetics/facilities"
              payload: { facility_name: "Aster Labs Newark", owner_operator_name: "Aster Holdings LLC", facility_type: "MANUFACTURER", country_code: "US", state_or_province: "NJ" }
              as: FacilityRegistrant
              captures: { fac_id: $.data.id }
            - call: "POST /cosmetics/facilities/${fac_id}/submit-registration"
              payload: {}
              as: FacilityRegistrant
              as_user_id: "${fac_id}"
            - call: "POST /cosmetics/facilities/${fac_id}/registration-decision"
              payload: { decision: "APPROVE" }
              as: RegulatoryReviewer
              as_user_id: "RVW-1"
            - call: "POST /cosmetics/responsible-persons"
              payload: { legal_name: "Aster Brands Inc", us_address_line: "12 Market St, Newark NJ 07102", contact_phone: "+1-202-555-0110", contact_email: "safety@aster.example" }
              as: ResponsiblePersonAgent
              captures: { rp_id: $.data.id }
            - call: "POST /cosmetics/listings"
              payload: { facility_id: "${fac_id}", responsible_person_id: "${rp_id}", product_name: "Aster Blush Powder", category_code: "07A", product_form: "LEAVE_ON", label_contact_type: "ELECTRONIC_CONTACT", label_contact_value: "safety@aster.example" }
              as: ResponsiblePersonAgent
              as_user_id: "${rp_id}"
              captures: { lst_id: $.data.id }
          trigger:
            - call: "GET /cosmetics/listings/${lst_id}"
              payload: {}
              as: RegulatoryReviewer
              as_user_id: "RVW-1"
              captures: { c0: $.data.undisclosed_allergen_count, ok0: $.data.allergen_disclosure_complete, sell0: $.data.marketable }
            - call: "POST /cosmetics/listings/${lst_id}/ingredients"
              payload: { inci_name: "CITRAL", function_code: "FRAGRANCE", concentration_pct: 0.0020, is_fragrance_allergen: true, label_disclosed: false }
              as: ResponsiblePersonAgent
              as_user_id: "${rp_id}"
            - call: "GET /cosmetics/listings/${lst_id}"
              payload: {}
              as: RegulatoryReviewer
              as_user_id: "RVW-1"
              captures: { c1: $.data.undisclosed_allergen_count, ok1: $.data.allergen_disclosure_complete }
            - call: "POST /cosmetics/listings/${lst_id}/ingredients"
              payload: { inci_name: "GERANIOL", function_code: "FRAGRANCE", concentration_pct: 0.0050, is_fragrance_allergen: true, label_disclosed: true }
              as: ResponsiblePersonAgent
              as_user_id: "${rp_id}"
            - call: "GET /cosmetics/listings/${lst_id}"
              payload: {}
              as: RegulatoryReviewer
