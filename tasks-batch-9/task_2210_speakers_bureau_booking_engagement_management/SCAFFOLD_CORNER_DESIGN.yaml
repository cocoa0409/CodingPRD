              payload: { proposal_id: "${pr}", speaker_id: "${sp2}", quoted_fee_cents: 1150000, rank_no: 2 }
              as: BookingAgent
              as_user_id: "agent-01"
              captures: { opt2: $.data.id }
            - call: "POST /proposals/${pr}/present"
              payload: {}
              as: BookingAgent
              as_user_id: "agent-01"
          trigger:
            - call: "POST /proposals/${pr}/select"
              payload: { option_id: "${opt}" }
              as: Client
              as_user_id: "${cl}"
              captures: { eng: $.data.id, bs: $.data.booking_status, qf: $.data.quoted_fee_cents, pct: $.data.commission_pct_snapshot }
            - call: "GET /proposals/${pr}"
              payload: {}
              as: BookingAgent
              as_user_id: "agent-01"
              captures: { pst: $.data.status, oc: $.data.options_count }
            - call: "GET /proposal-options/${opt}"
              payload: {}
              as: BookingAgent
              as_user_id: "agent-01"
              captures: { o1st: $.data.status }
            - call: "GET /proposal-options/${opt2}"
              payload: {}
              as: BookingAgent
              as_user_id: "agent-01"
              captures: { o2st: $.data.status }
            - call: "GET /inquiries/${inq}"
              payload: {}
              as: BookingAgent
              as_user_id: "agent-01"
              captures: { ist: $.data.status }
          assert:
            - "the select response itself already carries the new engagement with booking_status OFFERED, quoted_fee_cents 1275000 and commission_pct_snapshot 0.25 — no second read is needed to observe the write"
            - "the immediately following reads show proposal status ACCEPTED with options_count still 2, the chosen option SELECTED, the losing option DECLINED, and inquiry status WON"
            - "GET /engagements?inquiry_id=${inq} returns total_count 1 in the same request cycle: the derived listing is not eventually consistent"
