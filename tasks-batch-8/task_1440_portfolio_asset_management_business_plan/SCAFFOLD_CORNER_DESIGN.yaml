      - name: archive_portfolio_with_assets_rejected
        claim_type: precondition_enforcement
        grounds: [state_machines.Portfolio.ACTIVE_to_ARCHIVED, "errors[ERR_PORTFOLIO_NOT_EMPTY]"]
