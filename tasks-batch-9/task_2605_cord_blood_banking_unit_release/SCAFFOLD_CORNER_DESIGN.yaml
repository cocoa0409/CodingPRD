      - name: corner_account_delinquent_error_is_triggerable
        claim_type: error_triggerable
        excluded_because:
          difficulty_instance: unit_state_409_outranks_account_delinquent_402_on_reservation
          rationale: "That §1.8 instance drives an account all the way to DELINQUENT through the nightly run and then reserves against it, proving the 402 is reachable while pinning it below priority 9; a second chain would only re-derive the same delinquency ladder."
      - name: corner_maternal_screening_incomplete_error_is_triggerable
        claim_type: error_triggerable
        excluded_because:
          difficulty_instance: unit_eligibility_gated_on_maternal_screening_row_state
          rationale: "That §1.8 instance attempts the eligibility determination with no COMPLETED screening on the enrollment and asserts the 409 ERR_MATERNAL_SCREENING_INCOMPLETE, then repeats the call after the row completes; the code has no other applies_to surface worth a fresh chain."
      - name: corner_maternal_screening_reactive_error_is_triggerable
        claim_type: error_triggerable
        excluded_because:
          difficulty_instance: maternal_reactive_422_outranks_confirmatory_required_409_on_release
          rationale: "That §1.8 instance patches a marker to REACTIVE and asserts the 422 wins at release even with priority 17 also violated, which subsumes the plain triggerability claim."
      - name: corner_quality_below_public_threshold_error_is_triggerable
        claim_type: error_triggerable
        excluded_because:
          difficulty_instance: public_listing_tnc_floor_inclusive_at_900_millions
          rationale: "That §1.8 instance lists a unit at exactly 900 million TNC and refuses one at 899, so the 422 is already exercised at its inclusive boundary."
      - name: corner_processing_window_exceeded_error_is_triggerable
        claim_type: error_triggerable
        excluded_because:
          difficulty_instance: receipt_window_inclusive_at_exactly_48_hours
          rationale: "That §1.8 instance receives at exactly 48.00 hours and then at 48.01, asserting the accept/refuse pair; a separate triggerability chain would repeat the same two calls."
      - name: corner_maintenance_window_conflict_error_is_triggerable
        claim_type: error_triggerable
        excluded_because:
          difficulty_instance: tank_maintenance_window_half_open_on_freeze_instant
          rationale: "That §1.8 instance freezes at the window start (refused), inside it (refused) and at the exclusive end (accepted), which covers the code and its half-open semantics."
      - name: corner_hold_window_conflict_error_is_triggerable
        claim_type: error_triggerable
        excluded_because:
          difficulty_instance: unit_hold_windows_closed_intervals_with_symmetric_24h_buffer
          rationale: "That §1.8 instance walks the 24-hour buffer on both sides of an incumbent hold and asserts the 409 at each side, so the code is exercised at its exact boundary."
      - name: corner_tank_not_operational_error_is_triggerable
        claim_type: error_triggerable
        excluded_because:
          difficulty_instance: release_gated_on_holding_tank_status
          rationale: "That §1.8 instance alarms the holding tank and asserts the release refusal, then restores the tank and releases successfully, covering both halves of the ONLINE gate."

