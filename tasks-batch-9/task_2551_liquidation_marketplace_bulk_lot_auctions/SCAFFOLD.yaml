scenario: |
  Generate task harder than expert level!

  2551. Liquidation Marketplace & Bulk Lot Auctions (B-Stock Solutions style marketplace): seller lot creation from returns and excess inventory with manifest accuracy and condition grading, buyer qualification with resale certificates, business verification and geographic restrictions, auction format selection across auction, fixed price and negotiated terms with reserve pricing, bidding, proxy bids and closing rules with anti-shill controls, buyer premium, payment collection and freight arrangement with pickup deadlines, manifest discrepancy claims with evidence review and partial refunds, brand protection restrictions on channel resale and de-branding requirements, recovery rate analytics by category and channel

domain_name: liquidation-marketplace-bulk-lot-auctions
api_prefix: "/liquidation"

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

complexity_profile:
  primary_archetype: multi_party_negotiation
  secondary_archetype: pricing_engine
  difficulty_level: expert_plus
  difficulty_level_rationale: |
    The scenario is explicitly requested "harder than expert level". Density, not volume, carries the
    difficulty: 14 entities are tightly coupled through ONE money pipeline (hammer -> buyer premium
    tier -> freight -> claim credit -> late fee -> seller commission -> recovery rate -> commission
    tier -> back into the next commission snapshot). Three sale formats (AUCTION / FIXED_PRICE /
    NEGOTIATED) funnel into a single SaleOrder with two independent status axes, and the same
    SaleOrder is the join point for freight scheduling, manifest-discrepancy refunds and seller
    analytics. Endpoint and error counts sit above the Expert band because the §1.5
    testability-completeness rule and the FK reverse-reachability rule both demand read channels for
    cascade-created children; the reasoning surface (16 calculations, 9 state machines, 16 validation
    priority bands) is what makes it hard.
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers

  entity_topology: graph
  # graph: Lot, Listing, Bid, Negotiation, SaleOrder, PickupAppointment and Claim form a
  # cross-referencing mesh rather than a tree — Claim points at BOTH a SaleOrder and a ManifestLine
  # (which hangs off a different branch), PickupAppointment points at SaleOrder + Warehouse +
  # Carrier, and SellerAccount/BuyerAccount are read back from the far side of the mesh by the
  # recovery-rate and credit-exposure aggregates.

  state_machine_shape: parallel
  # Lot is cyclic (MANIFEST_REJECTED -> DRAFT, SOLD -> RELIST_PENDING -> LISTED);
  # Negotiation is cyclic (AWAITING_SELLER <-> AWAITING_BUYER);
  # SaleOrder carries two independent status dimensions (payment_status x logistics_status);
  # Claim is branching with a revision loop (UNDER_REVIEW -> EVIDENCE_REQUESTED -> UNDER_REVIEW).

  relationship_patterns:
    - one_to_many
    - cross_aggregate
    - polymorphic_free   # no polymorphic FKs: every FK names exactly one parent entity
    - self_referential_free

  role_model: segregation_of_duties
  # The MarketplaceOps user who approved a lot's manifest MUST NOT be the MarketplaceOps user who
  # decides a manifest-discrepancy claim against that same lot (§1.4 priority 5). Claim reversal is
  # further walled off into TrustSafety.

  consistency_model: immediate

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:

  - name: SellerAccount
    parent: null
    common_fields: true
    fields:
      - name: legal_name
        type: string
        source: input
        description: registered legal name of the liquidating retailer
      - name: tax_id
        type: string
        source: input
        description: seller tax identifier; also the anti-shill affiliation key compared against BuyerAccount.tax_id
        constraints: "unique across SellerAccount; ERR_DUPLICATE_TAX_ID on collision"
      - name: state_code
        type: string
        source: input
        description: two-letter US state code of the seller's registered address
      - name: contact_email
        type: string
        source: input
        description: operations contact mailbox
      - name: account_status
        type: enum
        source: computed
        description: gate on new listing publication; derived from manifest_accuracy_avg by calculations.seller_probation_evaluation
        default: ACTIVE
        constraints: "one of {ACTIVE, MANIFEST_PROBATION}"
      - name: commission_tier
        type: enum
        source: computed
        description: seller fee tier derived by calculations.commission_tier_assignment
        default: TIER_STANDARD
        constraints: "one of {TIER_STANDARD, TIER_PREFERRED, TIER_PROBATION}"
      - name: commission_rate_bps
        type: integer
        source: computed
        description: basis-point commission rate implied by commission_tier (TIER_STANDARD 2000, TIER_PREFERRED 1500, TIER_PROBATION 2500)
        default: 2000
      - name: gross_hammer_cents
        type: integer
        source: computed
        description: numerator of the GROSS recovery basis; see calculations.recovery_rate
        default: 0
      - name: listed_retail_value_cents
        type: integer
        source: computed
        description: denominator of the GROSS recovery basis; sum of Lot.declared_retail_value_cents over lots with lot_status IN {LISTED, SOLD, RELIST_PENDING}
        default: 0
      - name: gross_recovery_rate
        type: number
        source: computed
        description: GROSS-basis recovery rate, 4 decimal places; see calculations.recovery_rate
        default: 0.0
      - name: net_proceeds_cents
        type: integer
        source: computed
        description: numerator of the NET recovery basis; sum of SaleOrder.seller_net_proceeds_cents over orders with settlement_basis == FINAL
        default: 0
      - name: sold_retail_value_cents
        type: integer
        source: computed
        description: denominator of the NET recovery basis; sum of Lot.declared_retail_value_cents over lots with lot_status == SOLD
        default: 0
      - name: net_recovery_rate
        type: number
        source: computed
        description: NET-basis recovery rate, 4 decimal places; see calculations.recovery_rate
        default: 0.0
      - name: manifest_accuracy_avg
        type: number
        source: computed
        description: mean of Lot.manifest_accuracy_score over this seller's lots whose score is non-null, 3 decimal places; 1.000 when no lot has a score
        default: 1.0
      - name: scored_lot_count
        type: integer
        source: computed
        description: number of this seller's lots whose manifest_accuracy_score is non-null
        default: 0

  - name: BuyerAccount
    parent: null
    common_fields: true
    fields:
      - name: legal_name
        type: string
        source: input
        description: registered legal name of the resale business
      - name: tax_id
        type: string
        source: input
        description: buyer tax identifier; compared against SellerAccount.tax_id for anti-shill affiliation
        constraints: "unique across BuyerAccount; ERR_DUPLICATE_TAX_ID on collision"
      - name: state_code
        type: string
        source: input
        description: two-letter US state code of the buyer's registered address; matched against BrandPolicy.prohibited_buyer_state_codes
      - name: contact_email
        type: string
        source: input
        description: buyer contact mailbox
      - name: resale_certificate_number
        type: string
        source: input
        description: state resale/exemption certificate number; may be absent at creation
        default: null
      - name: resale_certificate_expires_on
        type: string
        source: input
        description: ISO 8601 calendar date (YYYY-MM-DD) on which the resale certificate lapses; may be absent at creation
        default: null
      - name: requested_credit_limit_cents
        type: integer
        source: input
        description: credit line the buyer applied for; advisory only, never used in fiscal checks
        default: 0
      - name: business_verification_status
        type: enum
        source: computed
        description: outcome of TrustSafety business verification, set by the qualification decision endpoint
        default: UNVERIFIED
        constraints: "one of {UNVERIFIED, VERIFIED, REJECTED}"
      - name: qualification_status
        type: enum
        source: computed
        description: bidding eligibility gate; set by the qualification decision endpoint
        default: PENDING
        constraints: "one of {PENDING, QUALIFIED, REJECTED, SUSPENDED}"
      - name: approved_credit_limit_cents
        type: integer
        source: computed
        description: credit ceiling granted by TrustSafety; the fiscal ceiling used by calculations.buyer_exposure
        default: 0
      - name: outstanding_exposure_cents
        type: integer
        source: computed
        description: committed spend across winning bids and unsettled orders; see calculations.buyer_exposure
        default: 0
      - name: wallet_credit_cents
        type: integer
        source: computed
        description: refund credit owed to the buyer from approved manifest-discrepancy claims; consumed by payments and reversed by claim reversal
        default: 0

  - name: Warehouse
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: distribution centre name
      - name: state_code
        type: string
        source: input
        description: two-letter US state code where the dock sits
      - name: dock_door_count
        type: integer
        source: input
        description: number of pickup doors; the candidate pool for the dock-door selector in calculations.dock_door_assignment
        constraints: ">= 1"
      - name: turnaround_buffer_minutes
        type: integer
        source: input
        description: mandatory idle gap enforced between two appointments on the same dock door
        default: 15
        constraints: ">= 0"

  - name: Carrier
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: motor carrier name
      - name: scac_code
        type: string
        source: input
        description: standard carrier alpha code
        constraints: "unique across Carrier"
      - name: daily_pickup_capacity
        type: integer
        source: input
        description: maximum number of appointments this carrier may hold per UTC calendar date; aggregate-capacity resource limit enforced by validations[priority=14]
        constraints: ">= 1"

  - name: BrandPolicy
    parent: null
    common_fields: true
    fields:
      - name: brand_code
        type: string
        source: input
        description: brand identifier the policy protects
        constraints: "unique across BrandPolicy"
      - name: permitted_channels
        type: array
        source: input
        description: explicit allow-list of resale channels; a Listing whose resale_channel is absent from this array is rejected
        constraints: "non-empty; members from {MARKETPLACE_RESALE, EXPORT_ONLY, DISCOUNT_RETAIL, SCRAP_ONLY}"
      - name: de_branding_required
        type: boolean
        source: input
        description: when true, every Listing on a lot carrying this policy must attest de-branding
        default: false
      - name: debranding_fee_cents_per_unit
        type: integer
        source: input
        description: per-unit de-branding cost deducted from seller proceeds when de_branding_required is true
        default: 0
        constraints: ">= 0"
      - name: prohibited_buyer_state_codes
        type: array
        source: input
        description: geographic restriction; buyers whose state_code appears here may not bid, offer or purchase on lots carrying this policy
        default: []
      - name: embargo_start_at
        type: datetime
        source: input
        description: inclusive start of the channel embargo interval; null means no embargo
        default: null
      - name: embargo_end_at
        type: datetime
        source: input
        description: inclusive end of the channel embargo interval; null means no embargo
        default: null

  - name: Lot
    parent: null
    common_fields: true
    fields:
      - name: seller_id
        type: string
        source: input
        description: FK -> SellerAccount.id; the liquidating seller that owns the lot
      - name: warehouse_id
        type: string
        source: input
        description: FK -> Warehouse.id; origin dock the goods must be picked up from
      - name: brand_policy_id
        type: string
        source: input
        description: FK -> BrandPolicy.id; brand protection policy governing resale channel and de-branding; null when the lot carries no protected brand
        default: null
      - name: title
        type: string
        source: input
        description: human readable lot title
      - name: category_code
        type: enum
        source: input
        description: merchandise category used by recovery-rate analytics slicing
        constraints: "one of {APPAREL, ELECTRONICS, HOME_GOODS, TOYS}"
      - name: condition_grade
        type: enum
        source: input
        description: lot-level condition grading; selects the manifest shortage tolerance in calculations.manifest_accuracy_score
        constraints: "one of {NEW_OVERSTOCK, CUSTOMER_RETURNS, SALVAGE}"
      - name: lot_status
        type: enum
        source: computed
        description: lifecycle state; cyclic (MANIFEST_REJECTED -> DRAFT and SOLD -> RELIST_PENDING -> LISTED)
        default: DRAFT
        constraints: "one of {DRAFT, MANIFEST_IN_REVIEW, MANIFEST_REJECTED, MANIFEST_APPROVED, LISTED, SOLD, RELIST_PENDING}"
      - name: manifest_line_count
        type: integer
        source: computed
        description: count of this lot's ManifestLine rows with line_status == ACTIVE
        default: 0
      - name: declared_unit_count
        type: integer
        source: computed
        description: sum of ManifestLine.unit_count over lines with line_status == ACTIVE; conserved quantity DECLARED_UNIT_TOTAL
        default: 0
      - name: declared_retail_value_cents
        type: integer
        source: computed
        description: sum of (ManifestLine.unit_count * ManifestLine.unit_retail_cents) over lines with line_status == ACTIVE
        default: 0
      - name: manifest_reviewed_by_user_id
        type: string
        source: computed
        description: X-User-ID of the MarketplaceOps operator who approved or rejected the manifest; the segregation-of-duties key checked at claim decision time
        default: null
      - name: manifest_accuracy_score
        type: number
        source: computed
        description: manifest accuracy in [0.000, 1.000] recomputed by calculations.manifest_accuracy_score on every claim resolution; null until the lot's first claim resolution
        default: null
      - name: de_branding_required
        type: boolean
        source: computed
        description: mirror of the linked BrandPolicy.de_branding_required at lot creation time; false when brand_policy_id is null
        default: false

  - name: ManifestLine
    parent: Lot
    common_fields: true
    fields:
      - name: lot_id
        type: string
        source: input
        description: FK -> Lot.id; owning lot
      - name: sku
        type: string
        source: input
        description: seller SKU or UPC for the line
      - name: unit_count
        type: integer
        source: input
        description: declared units on this line
        constraints: ">= 1"
      - name: unit_retail_cents
        type: integer
        source: input
        description: declared per-unit retail value in cents
        constraints: ">= 1"
      - name: declared_condition
        type: enum
        source: input
        description: line-level condition grading declared by the seller
        constraints: "one of {NEW, LIKE_NEW, USED_GOOD, DAMAGED, SALVAGE}"
      - name: line_status
        type: enum
        source: computed
        description: ACTIVE lines count toward the lot aggregates; VOIDED lines are excluded but retained for audit
        default: ACTIVE
        constraints: "one of {ACTIVE, VOIDED}"
      - name: verified_unit_count
        type: integer
        source: computed
        description: units confirmed present by the most recent non-reversed claim decision touching this line; null until a claim on this line is decided
        default: null

  - name: Listing
    parent: Lot
    common_fields: true
    fields:
      - name: lot_id
        type: string
        source: input
        description: FK -> Lot.id; the lot being offered
      - name: listing_format
        type: enum
        source: input
        description: sale mechanism; each format enables a different subset of write endpoints
        constraints: "one of {AUCTION, FIXED_PRICE, NEGOTIATED}"
      - name: resale_channel
        type: enum
        source: input
        description: channel the winning buyer is licensed to resell through; validated against BrandPolicy.permitted_channels
        constraints: "one of {MARKETPLACE_RESALE, EXPORT_ONLY, DISCOUNT_RETAIL, SCRAP_ONLY}"
      - name: window_start_at
        type: datetime
        source: input
        description: inclusive start of the offering window; bids/offers before it are rejected
      - name: window_end_at
        type: datetime
        source: input
        description: scheduled close instant; the seed for effective_close_at
        constraints: "> window_start_at"
      - name: effective_close_at
        type: datetime
        source: computed
        description: window_end_at plus every anti-sniping extension granted by calculations.anti_sniping_extension
      - name: extension_count
        type: integer
        source: computed
        description: number of anti-sniping extensions granted; capped at MAX_EXTENSIONS
        default: 0
      - name: opening_bid_cents
        type: integer
        source: input
        description: minimum first bid for AUCTION listings; null for other formats
        default: null
      - name: reserve_price_cents
        type: integer
        source: input
        description: price the high bid must reach for an AUCTION to close sold; null means no reserve
        default: null
      - name: ask_price_cents
        type: integer
        source: input
        description: exact take-it price for FIXED_PRICE listings; null for other formats
        default: null
      - name: min_offer_cents
        type: integer
        source: input
        description: floor for the opening buyer offer on NEGOTIATED listings; null for other formats
        default: null
      - name: bid_increment_cents
        type: integer
        source: input
        description: minimum raise over the current high bid, and the step used when resolving proxy bids
        default: 100000
        constraints: ">= 1"
      - name: de_branding_attested
        type: boolean
        source: input
        description: seller attestation that goods will be de-branded before resale; must be true when the lot's BrandPolicy requires it
        default: false
      - name: listing_status
        type: enum
        source: computed
        description: listing lifecycle
        default: DRAFT
        constraints: "one of {DRAFT, OPEN, CLOSED_SOLD, CLOSED_NO_SALE}"
      - name: bid_count
        type: integer
        source: computed
        description: count of this listing's Bid rows with bid_status IN {STANDING, WINNING, WON, LOST}
        default: 0
      - name: current_high_bid_cents
        type: integer
        source: computed
        description: current price produced by calculations.proxy_bid_resolution; null while no bid stands
        default: null
      - name: current_high_bidder_id
        type: string
        source: computed
        description: BuyerAccount.id of the buyer holding the bid whose bid_status == WINNING on this listing; null while no bid stands
        default: null
      - name: reserve_met
        type: boolean
        source: computed
        description: true when reserve_price_cents is null, or current_high_bid_cents >= reserve_price_cents
        default: false
      - name: min_next_bid_cents
        type: integer
        source: computed
        description: >
          the smallest acceptable next bid published by calculations.proxy_bid_resolution step 5:
          opening_bid_cents while current_high_bid_cents is null, otherwise
          current_high_bid_cents + bid_increment_cents; null on FIXED_PRICE and NEGOTIATED listings

  - name: Bid
    parent: Listing
    common_fields: true
    fields:
      - name: listing_id
        type: string
        source: input
        description: FK -> Listing.id; the listing bid on
      - name: buyer_id
        type: string
        source: input
        description: FK -> BuyerAccount.id; the bidding buyer
      - name: bid_type
        type: enum
        source: system
        description: LIVE for POST /listings/{id}/bids, PROXY for POST /listings/{id}/proxy-bids
        constraints: "one of {LIVE, PROXY}"
      - name: amount_cents
        type: integer
        source: input
        description: the bid amount for LIVE bids; for PROXY bids this is set to the resolved current price at placement time
        constraints: ">= 1"
      - name: max_amount_cents
        type: integer
        source: input
        description: proxy ceiling for PROXY bids; null for LIVE bids
        default: null
      - name: ceiling_cents
        type: integer
        source: computed
        description: max_amount_cents for PROXY bids, amount_cents for LIVE bids; the sort key of calculations.proxy_bid_resolution
      - name: bid_status
        type: enum
        source: computed
        description: bid lifecycle; exactly one bid per listing may be WINNING at a time
        default: STANDING
        constraints: "one of {STANDING, WINNING, SUPERSEDED, WON, LOST}"
      - name: placed_at
        type: datetime
        source: system
        description: logical clock instant at placement; the tie-break input of calculations.proxy_bid_resolution is created_at, never id
      - name: meets_reserve
        type: boolean
        source: computed
        description: snapshot of Listing.reserve_met at the moment this bid became WINNING; false for bids that never led
        default: false

  - name: Negotiation
    parent: Listing
    common_fields: true
    fields:
      - name: listing_id
        type: string
        source: input
        description: FK -> Listing.id; the NEGOTIATED listing under discussion
      - name: buyer_id
        type: string
        source: input
        description: FK -> BuyerAccount.id; the buyer that opened the negotiation
      - name: negotiation_status
        type: enum
        source: computed
        description: whose turn it is, or the terminal outcome; cycles between AWAITING_SELLER and AWAITING_BUYER
        default: AWAITING_SELLER
        constraints: "one of {AWAITING_SELLER, AWAITING_BUYER, ACCEPTED, DECLINED}"
      - name: round_number
        type: integer
        source: computed
        description: count of Offer rows on this negotiation; the opening offer is round 1 and each counter-offer increments it
        default: 1
      - name: current_offer_cents
        type: integer
        source: computed
        description: amount_cents of the Offer with the highest round_number on this negotiation
      - name: current_offer_side
        type: enum
        source: computed
        description: offer_side of the Offer with the highest round_number on this negotiation
        constraints: "one of {BUYER, SELLER}"
      - name: current_offer_expires_at
        type: datetime
        source: computed
        description: expires_at of the Offer with the highest round_number; countering or accepting at or after this instant is rejected
      - name: accepted_price_cents
        type: integer
        source: computed
        description: current_offer_cents frozen at acceptance; null unless negotiation_status == ACCEPTED
        default: null

  - name: Offer
    parent: Negotiation
    common_fields: false
    fields:
      - name: negotiation_id
        type: string
        source: input
        description: FK -> Negotiation.id; the negotiation this offer belongs to
      - name: offer_side
        type: enum
        source: system
        description: BUYER when placed by the negotiation's buyer, SELLER when placed by the lot's seller
        constraints: "one of {BUYER, SELLER}"
      - name: amount_cents
        type: integer
        source: input
        description: offered price in cents
        constraints: ">= 1"
      - name: round_number
        type: integer
        source: system
        description: 1 for the opening offer, incremented for every counter-offer
      - name: expires_at
        type: datetime
        source: system
        description: placement instant plus OFFER_TTL_HOURS; append-only, never mutated

  - name: SaleOrder
    parent: null
    common_fields: true
    fields:
      - name: listing_id
        type: string
        source: input
        description: FK -> Listing.id; the listing that produced the sale
      - name: buyer_id
        type: string
        source: input
        description: FK -> BuyerAccount.id; the winning buyer
      - name: sale_source
        type: enum
        source: system
        description: which closing rule produced the order
        constraints: "one of {AUCTION_CLOSE, FIXED_PRICE_PURCHASE, NEGOTIATED_ACCEPTANCE}"
      - name: hammer_price_cents
        type: integer
        source: system
        description: winning price - Listing.current_high_bid_cents at auction close, ask_price_cents for a fixed-price purchase, Negotiation.accepted_price_cents for a negotiated acceptance
      - name: buyer_premium_bps
        type: integer
        source: computed
        description: basis-point premium rate selected from BUYER_PREMIUM_TIERS by hammer_price_cents; snapshotted at order creation and never re-selected
      - name: buyer_premium_cents
        type: integer
        source: computed
        description: round_half_up(hammer_price_cents * buyer_premium_bps / 10000)
      - name: pallet_count
        type: integer
        source: computed
        description: ceil(Lot.declared_unit_count / UNITS_PER_PALLET) evaluated at order creation
      - name: estimated_freight_cents
        type: integer
        source: computed
        description: pallet_count * FREIGHT_RATE_CENTS_PER_PALLET; the freight term of the PROVISIONAL settlement variant
      - name: actual_freight_cents
        type: integer
        source: input
        description: carrier-invoiced freight captured at pickup completion; the freight term of the FINAL settlement variant
        default: null
      - name: claim_credit_cents
        type: integer
        source: computed
        description: sum of Claim.refund_cents over this order's claims with claim_status IN {APPROVED, PARTIALLY_APPROVED}; conserved quantity BUYER_NET_OUTLAY moves with this field
        default: 0
      - name: late_fee_cents
        type: integer
        source: computed
        description: assessed once, on the first payment received after payment_due_at; computed from pre_fee_total_cents and never from total_due_cents
        default: 0
      - name: pre_fee_total_cents
        type: integer
        source: computed
        description: hammer_price_cents + buyer_premium_cents + the freight term of the active settlement_basis; this is the base the late fee is charged on, so it deliberately excludes late_fee_cents and claim_credit_cents
      - name: total_due_cents
        type: integer
        source: computed
        description: pre_fee_total_cents + late_fee_cents - claim_credit_cents
      - name: amount_paid_cents
        type: integer
        source: computed
        description: cumulative cash received; never reduced by claim refunds
        default: 0
      - name: balance_due_cents
        type: integer
        source: computed
        description: total_due_cents - amount_paid_cents; drives payment_status and feeds calculations.buyer_exposure
        default: 0
      - name: paid_at
        type: datetime
        source: computed
        description: logical clock instant at which balance_due_cents first reached 0; null while any balance remains
        default: null
      - name: picked_up_at
        type: datetime
        source: computed
        description: logical clock instant of pickup completion; null until logistics_status == PICKED_UP
        default: null
      - name: abandoned_at
        type: datetime
        source: computed
        description: logical clock instant at which the pickup-deadline sweep abandoned the order; null otherwise
        default: null
      - name: settlement_basis
        type: enum
        source: computed
        description: which variant of calculations.order_settlement is currently in force
        default: PROVISIONAL
        constraints: "one of {PROVISIONAL, FINAL}"
      - name: payment_status
        type: enum
        source: computed
        description: money dimension of the order; evolves independently of logistics_status
        default: UNPAID
        constraints: "one of {UNPAID, PARTIALLY_PAID, PAID, REFUND_ISSUED}"
      - name: logistics_status
        type: enum
        source: computed
        description: freight dimension of the order; evolves independently of payment_status
        default: AWAITING_APPOINTMENT
        constraints: "one of {AWAITING_APPOINTMENT, APPOINTMENT_SCHEDULED, PICKED_UP, ABANDONED}"
      - name: payment_due_at
        type: datetime
        source: computed
        description: created_at plus PAYMENT_TERM_DAYS; the late-fee threshold
      - name: pickup_deadline_at
        type: datetime
        source: computed
        description: created_at plus PICKUP_DEADLINE_DAYS; the abandonment threshold swept by POST /liquidation/pickup-deadline-sweeps
      - name: claim_window_closes_at
        type: datetime
        source: computed
        description: pickup completion instant plus CLAIM_WINDOW_DAYS; null until logistics_status == PICKED_UP
        default: null
      - name: seller_commission_rate_bps
        type: integer
        source: computed
        description: SellerAccount.commission_rate_bps snapshotted at settlement finalization; never recomputed afterwards
        default: null
      - name: seller_commission_cents
        type: integer
        source: computed
        description: per-line commission total from calculations.seller_net_proceeds; null until settlement_basis == FINAL
        default: null
      - name: seller_debranding_fee_cents
        type: integer
        source: computed
        description: de-branding deduction from calculations.seller_net_proceeds; null until settlement_basis == FINAL
        default: null
      - name: seller_net_proceeds_cents
        type: integer
        source: computed
        description: seller payout from calculations.seller_net_proceeds; null until settlement_basis == FINAL
        default: null

  - name: PickupAppointment
    parent: SaleOrder
    common_fields: true
    fields:
      - name: sale_order_id
        type: string
        source: input
        description: FK -> SaleOrder.id; the order whose goods are being collected
      - name: warehouse_id
        type: string
        source: input
        description: FK -> Warehouse.id; must equal the lot's warehouse_id
      - name: carrier_id
        type: string
        source: input
        description: FK -> Carrier.id; the motor carrier collecting the freight
      - name: window_start_at
        type: datetime
        source: input
        description: inclusive start of the dock occupation interval
      - name: window_end_at
        type: datetime
        source: input
        description: exclusive end of the dock occupation interval
        constraints: "> window_start_at"
      - name: dock_door_number
        type: integer
        source: computed
        description: door chosen by calculations.dock_door_assignment; in [1, Warehouse.dock_door_count]
      - name: bol_number
        type: string
        source: input
        description: bill of lading reference supplied by the buyer's carrier
      - name: appointment_status
        type: enum
        source: computed
        description: appointment lifecycle
        default: SCHEDULED
        constraints: "one of {SCHEDULED, COMPLETED, CANCELLED}"
      - name: completed_at
        type: datetime
        source: computed
        description: logical clock instant at which the appointment was completed; null while SCHEDULED or CANCELLED
        default: null
      - name: picked_up_unit_count
        type: integer
        source: input
        description: units physically loaded, captured at completion
        default: null

  - name: Claim
    parent: SaleOrder
    common_fields: true
    fields:
      - name: sale_order_id
        type: string
        source: input
        description: FK -> SaleOrder.id; the order being disputed
      - name: manifest_line_id
        type: string
        source: input
        description: FK -> ManifestLine.id; the disputed manifest line, which must belong to the order's lot and have line_status == ACTIVE
      - name: claim_type
        type: enum
        source: input
        description: nature of the manifest discrepancy
        constraints: "one of {UNIT_SHORTAGE, CONDITION_MISGRADE, MISSING_SKU}"
      - name: claimed_units
        type: integer
        source: input
        description: units the buyer disputes; must not exceed ManifestLine.unit_count
        constraints: ">= 1"
      - name: verified_units
        type: integer
        source: computed
        description: units the reviewer confirmed; set by the claim decision, in [0, claimed_units]
        default: null
      - name: evidence_item_count
        type: integer
        source: computed
        description: number of evidence URLs accumulated across creation and evidence submissions
        default: 0
      - name: evidence_request_count
        type: integer
        source: computed
        description: number of times a reviewer has bounced the claim back for more evidence; capped at MAX_EVIDENCE_REQUESTS
        default: 0
      - name: claim_status
        type: enum
        source: computed
        description: claim lifecycle; branching with a revision loop
        default: SUBMITTED
        constraints: "one of {SUBMITTED, EVIDENCE_REQUESTED, UNDER_REVIEW, APPROVED, PARTIALLY_APPROVED, DENIED, REVERSED}"
      - name: refund_cents
        type: integer
        source: computed
        description: refund produced by calculations.claim_refund; 0 while undecided or denied
        default: 0
      - name: decided_by_user_id
        type: string
        source: computed
        description: X-User-ID of the MarketplaceOps reviewer who decided the claim
        default: null
      - name: reversed_by_user_id
        type: string
        source: computed
        description: X-User-ID of the TrustSafety operator who reversed the decision
        default: null
      - name: filed_at
        type: datetime
        source: system
        description: logical clock instant at claim creation; compared against SaleOrder.claim_window_closes_at

# =============================================================================
# §1.2 State Machine Table
# Every transition carries a stable `transition_id`; §1.8/§1.9 grounds refer to
# transitions as `state_machines.<Entity>.<transition_id>`.
# =============================================================================
state_machines:

  - entity: Lot
    state_field: lot_status
    shape: cyclic
    initial_state: DRAFT
    terminal_states: []
    note: "No terminal state: a SOLD lot returns to RELIST_PENDING on pickup abandonment and can be listed again."
    transitions:
      - transition_id: DRAFT_to_MANIFEST_IN_REVIEW
        from: DRAFT
        to: MANIFEST_IN_REVIEW
        trigger: "POST /liquidation/lots/{id}/manifest-submissions"
        actor: SellerOps
        preconditions:
          - "lot_status == DRAFT"
          - "manifest_line_count >= 1 (ERR_MANIFEST_EMPTY when 0)"
          - "X-User-ID == Lot.seller_id"
        side_effects:
          - "refreshes Lot.updated_at and increments Lot.version by 1"
      - transition_id: MANIFEST_IN_REVIEW_to_MANIFEST_APPROVED
        from: MANIFEST_IN_REVIEW
        to: MANIFEST_APPROVED
        trigger: "POST /liquidation/lots/{id}/manifest-reviews with decision == APPROVE"
        actor: MarketplaceOps
        preconditions:
          - "lot_status == MANIFEST_IN_REVIEW"
        side_effects:
          - "sets Lot.manifest_reviewed_by_user_id = X-User-ID of the reviewing MarketplaceOps operator"
          - "increments Lot.version by 1"
      - transition_id: MANIFEST_IN_REVIEW_to_MANIFEST_REJECTED
        from: MANIFEST_IN_REVIEW
        to: MANIFEST_REJECTED
        trigger: "POST /liquidation/lots/{id}/manifest-reviews with decision == REJECT"
        actor: MarketplaceOps
        preconditions:
          - "lot_status == MANIFEST_IN_REVIEW"
        side_effects:
          - "sets Lot.manifest_reviewed_by_user_id = X-User-ID of the reviewing MarketplaceOps operator"
          - "increments Lot.version by 1"
      - transition_id: MANIFEST_REJECTED_to_DRAFT
        from: MANIFEST_REJECTED
        to: DRAFT
        trigger: "POST /liquidation/lots/{id}/manifest-lines or POST /liquidation/manifest-lines/{id}/voids"
        actor: SellerOps
        preconditions:
          - "lot_status == MANIFEST_REJECTED"
          - "X-User-ID == Lot.seller_id"
        side_effects:
          - "recomputes Lot.manifest_line_count, Lot.declared_unit_count and Lot.declared_retail_value_cents over lines with line_status == ACTIVE"
        note: "Revision loop: editing a rejected manifest returns the lot to DRAFT so it must be resubmitted."
      - transition_id: MANIFEST_APPROVED_or_RELIST_PENDING_to_LISTED
        from: MANIFEST_APPROVED | RELIST_PENDING
        to: LISTED
        trigger: "POST /liquidation/listings/{id}/publications"
        actor: SellerOps
        preconditions:
          - "lot_status IN {MANIFEST_APPROVED, RELIST_PENDING}"
          - "SellerAccount.account_status == ACTIVE (ERR_SELLER_NOT_ACTIVE otherwise)"
        side_effects:
          - "Listing.listing_status becomes OPEN"
          - "recomputes SellerAccount.listed_retail_value_cents, which recomputes SellerAccount.gross_recovery_rate, which reassigns SellerAccount.commission_tier and commission_rate_bps"
      - transition_id: LISTED_to_SOLD
        from: LISTED
        to: SOLD
        trigger: "POST /liquidation/listings/{id}/closures (reserve met) | POST /liquidation/listings/{id}/bids on a FIXED_PRICE listing | POST /liquidation/negotiations/{id}/acceptances"
        actor: MarketplaceOps | Buyer | SellerOps
        preconditions:
          - "lot_status == LISTED"
          - "the triggering Listing.listing_status == OPEN"
        side_effects:
          - "creates one SaleOrder (see calculations.order_settlement, PROVISIONAL variant)"
          - "recomputes SellerAccount.gross_hammer_cents and SellerAccount.sold_retail_value_cents, which recomputes SellerAccount.gross_recovery_rate, which reassigns SellerAccount.commission_tier and commission_rate_bps"
      - transition_id: LISTED_to_RELIST_PENDING
        from: LISTED
        to: RELIST_PENDING
        trigger: "POST /liquidation/listings/{id}/closures with zero qualifying bids or with reserve unmet"
        actor: MarketplaceOps
        preconditions:
          - "lot_status == LISTED"
          - "Listing.listing_status == OPEN"
        side_effects:
          - "Listing.listing_status becomes CLOSED_NO_SALE and every Bid with bid_status IN {STANDING, WINNING} becomes LOST"
          - "recomputes SellerAccount.gross_recovery_rate (lot stays in the GROSS denominator, contributes nothing to the numerator), which reassigns SellerAccount.commission_tier"
      - transition_id: SOLD_to_RELIST_PENDING
        from: SOLD
        to: RELIST_PENDING
        trigger: "POST /liquidation/pickup-deadline-sweeps (system sweep, abandonment cascade)"
        actor: MarketplaceOps
        preconditions:
          - "lot_status == SOLD"
          - "the lot's SaleOrder.logistics_status became ABANDONED in this sweep"
        side_effects:
          - "recomputes SellerAccount.gross_hammer_cents and sold_retail_value_cents (an ABANDONED order leaves the GROSS numerator), which recomputes gross_recovery_rate, which reassigns commission_tier"

  - entity: Listing
    state_field: listing_status
    shape: branching
    initial_state: DRAFT
    terminal_states: [CLOSED_SOLD, CLOSED_NO_SALE]
    transitions:
      - transition_id: DRAFT_to_OPEN
        from: DRAFT
        to: OPEN
        trigger: "POST /liquidation/listings/{id}/publications"
        actor: SellerOps
        preconditions:
          - "listing_status == DRAFT"
          - "Lot.lot_status IN {MANIFEST_APPROVED, RELIST_PENDING}"
          - "SellerAccount.account_status == ACTIVE"
          - "resale_channel IN BrandPolicy.permitted_channels when Lot.brand_policy_id is non-null"
          - "de_branding_attested == true when Lot.de_branding_required == true"
          - "[window_start_at, window_end_at] does not intersect [BrandPolicy.embargo_start_at, BrandPolicy.embargo_end_at] (both intervals inclusive at both ends)"
          - "no other Listing on the same lot has listing_status == OPEN"
        side_effects:
          - "sets effective_close_at = window_end_at and extension_count = 0"
          - "Lot.lot_status becomes LISTED (see Lot.MANIFEST_APPROVED_or_RELIST_PENDING_to_LISTED)"
          - "increments Listing.version by 1"
      - transition_id: OPEN_to_CLOSED_SOLD_auction
        from: OPEN
        to: CLOSED_SOLD
        trigger: "POST /liquidation/listings/{id}/closures"
        actor: MarketplaceOps
        preconditions:
          - "listing_format == AUCTION"
          - "listing_status == OPEN"
          - "current logical clock >= effective_close_at (ERR_AUCTION_NOT_CLOSABLE otherwise)"
          - "current_high_bid_cents is non-null AND reserve_met == true"
        side_effects:
          - "the Bid with bid_status == WINNING becomes WON; every Bid with bid_status == STANDING becomes LOST"
          - "creates a SaleOrder with sale_source == AUCTION_CLOSE and hammer_price_cents == current_high_bid_cents"
          - "Lot.lot_status becomes SOLD (see Lot.LISTED_to_SOLD), which recomputes the seller recovery aggregates and commission tier"
          - "recomputes BuyerAccount.outstanding_exposure_cents for the winning buyer"
          - "increments Listing.version by 1"
      - transition_id: OPEN_to_CLOSED_NO_SALE
        from: OPEN
        to: CLOSED_NO_SALE
        trigger: "POST /liquidation/listings/{id}/closures"
        actor: MarketplaceOps
        preconditions:
          - "listing_format == AUCTION"
          - "listing_status == OPEN"
          - "current logical clock >= effective_close_at"
          - "current_high_bid_cents is null (empty qualifying-bid set) OR reserve_met == false"
        side_effects:
          - "every Bid with bid_status IN {STANDING, WINNING} becomes LOST"
          - "no SaleOrder is created"
          - "Lot.lot_status becomes RELIST_PENDING (see Lot.LISTED_to_RELIST_PENDING)"
          - "recomputes BuyerAccount.outstanding_exposure_cents for every bidder"
      - transition_id: OPEN_to_CLOSED_SOLD_fixed_price
        from: OPEN
        to: CLOSED_SOLD
        trigger: "POST /liquidation/listings/{id}/bids on a listing whose listing_format == FIXED_PRICE"
        actor: Buyer
        preconditions:
          - "listing_format == FIXED_PRICE"
          - "listing_status == OPEN"
          - "amount_cents == ask_price_cents (ERR_FIXED_PRICE_MISMATCH otherwise)"
          - "window_start_at <= current logical clock < effective_close_at"
        side_effects:
          - "creates a Bid with bid_type == LIVE and bid_status == WON"
          - "creates a SaleOrder with sale_source == FIXED_PRICE_PURCHASE and hammer_price_cents == ask_price_cents"
          - "Lot.lot_status becomes SOLD, which recomputes the seller recovery aggregates and commission tier"
      - transition_id: OPEN_to_CLOSED_SOLD_negotiated
        from: OPEN
        to: CLOSED_SOLD
        trigger: "POST /liquidation/negotiations/{id}/acceptances"
        actor: Buyer | SellerOps
        preconditions:
          - "listing_format == NEGOTIATED"
          - "listing_status == OPEN"
          - "the accepting side is NOT Negotiation.current_offer_side"
        side_effects:
          - "Negotiation.negotiation_status becomes ACCEPTED and accepted_price_cents = current_offer_cents"
          - "every other Negotiation on the same listing with negotiation_status IN {AWAITING_SELLER, AWAITING_BUYER} becomes DECLINED"
          - "creates a SaleOrder with sale_source == NEGOTIATED_ACCEPTANCE and hammer_price_cents == accepted_price_cents"
          - "Lot.lot_status becomes SOLD, which recomputes the seller recovery aggregates and commission tier"

  - entity: Negotiation
    state_field: negotiation_status
    shape: cyclic
    initial_state: AWAITING_SELLER
    terminal_states: [ACCEPTED, DECLINED]
    transitions:
      - transition_id: CREATE_to_AWAITING_SELLER
        from: "(none)"
        to: AWAITING_SELLER
        trigger: "POST /liquidation/listings/{id}/negotiations"
        actor: Buyer
        preconditions:
          - "Listing.listing_format == NEGOTIATED AND listing_status == OPEN"
          - "opening_offer_cents >= Listing.min_offer_cents (ERR_OFFER_BELOW_MINIMUM otherwise)"
          - "BuyerAccount.qualification_status == QUALIFIED"
          - "no other Negotiation on this listing has buyer_id == X-User-ID and negotiation_status IN {AWAITING_SELLER, AWAITING_BUYER}"
        side_effects:
          - "creates Offer round_number 1 with offer_side == BUYER and expires_at = current logical clock + OFFER_TTL_HOURS"
          - "sets round_number = 1, current_offer_cents, current_offer_side = BUYER, current_offer_expires_at"
      - transition_id: AWAITING_SELLER_to_AWAITING_BUYER
        from: AWAITING_SELLER
        to: AWAITING_BUYER
        trigger: "POST /liquidation/negotiations/{id}/counter-offers with X-User-Role == SellerOps"
        actor: SellerOps
        preconditions:
          - "negotiation_status == AWAITING_SELLER (ERR_NOT_YOUR_TURN when the caller is not the awaited side)"
          - "current logical clock < current_offer_expires_at (ERR_OFFER_EXPIRED otherwise)"
          - "round_number + 1 <= MAX_NEGOTIATION_ROUNDS (ERR_NEGOTIATION_ROUND_LIMIT otherwise)"
          - "expected_negotiation_version == Negotiation.version (ERR_STALE_NEGOTIATION_VERSION otherwise)"
        side_effects:
          - "creates Offer with offer_side == SELLER and round_number = previous round_number + 1"
          - "sets round_number, current_offer_cents, current_offer_side = SELLER, current_offer_expires_at = clock + OFFER_TTL_HOURS"
          - "increments Negotiation.version by 1"
      - transition_id: AWAITING_BUYER_to_AWAITING_SELLER
        from: AWAITING_BUYER
        to: AWAITING_SELLER
        trigger: "POST /liquidation/negotiations/{id}/counter-offers with X-User-Role == Buyer"
        actor: Buyer
        preconditions:
          - "negotiation_status == AWAITING_BUYER"
          - "X-User-ID == Negotiation.buyer_id"
          - "current logical clock < current_offer_expires_at"
          - "round_number + 1 <= MAX_NEGOTIATION_ROUNDS"
          - "expected_negotiation_version == Negotiation.version"
        side_effects:
          - "creates Offer with offer_side == BUYER and round_number = previous round_number + 1"
          - "sets round_number, current_offer_cents, current_offer_side = BUYER, current_offer_expires_at = clock + OFFER_TTL_HOURS"
          - "increments Negotiation.version by 1"
        note: "Together with AWAITING_SELLER_to_AWAITING_BUYER this forms the negotiation round cycle."
      - transition_id: AWAITING_to_ACCEPTED
        from: AWAITING_SELLER | AWAITING_BUYER
        to: ACCEPTED
        trigger: "POST /liquidation/negotiations/{id}/acceptances"
        actor: Buyer | SellerOps
        preconditions:
          - "negotiation_status IN {AWAITING_SELLER, AWAITING_BUYER}"
          - "the accepting role is the awaited side (SellerOps when AWAITING_SELLER, Buyer when AWAITING_BUYER)"
          - "current logical clock < current_offer_expires_at"
        side_effects:
          - "sets accepted_price_cents = current_offer_cents"
          - "Listing.listing_status becomes CLOSED_SOLD (see Listing.OPEN_to_CLOSED_SOLD_negotiated)"
          - "creates the SaleOrder and cascades into Lot.LISTED_to_SOLD"
      - transition_id: AWAITING_to_DECLINED
        from: AWAITING_SELLER | AWAITING_BUYER
        to: DECLINED
        trigger: "cascade from POST /liquidation/negotiations/{id}/acceptances on a sibling negotiation of the same listing"
        actor: system
        preconditions:
          - "negotiation_status IN {AWAITING_SELLER, AWAITING_BUYER}"
          - "a different Negotiation on the same listing_id reached ACCEPTED in this request"
        side_effects:
          - "increments Negotiation.version by 1"
        note: "Conditional cascade: only non-terminal sibling negotiations are declined."

  - entity: SaleOrder
    state_field: payment_status
    shape: parallel
    parallel_dimension: 1
    parallel_note: "SaleOrder carries two independent state dimensions: payment_status (this machine) and logistics_status (the next machine). Neither dimension's transitions constrain the other's, but two cross-dimension guards exist: an appointment may only be scheduled when payment_status == PAID, and the pickup-deadline sweep abandons an order regardless of payment_status."
    initial_state: UNPAID
    terminal_states: []
    transitions:
      - transition_id: UNPAID_to_PARTIALLY_PAID
        from: UNPAID
        to: PARTIALLY_PAID
        trigger: "POST /liquidation/sale-orders/{id}/payments with amount_cents < balance_due_cents"
        actor: Buyer
        preconditions:
          - "payment_status == UNPAID"
          - "X-User-ID == SaleOrder.buyer_id"
          - "amount_cents >= 1 and amount_cents <= balance_due_cents (ERR_PAYMENT_EXCEEDS_BALANCE otherwise)"
        side_effects:
          - "increases amount_paid_cents by amount_cents and recomputes balance_due_cents"
          - "recomputes BuyerAccount.outstanding_exposure_cents"
      - transition_id: UNPAID_to_PAID
        from: UNPAID
        to: PAID
        trigger: "POST /liquidation/sale-orders/{id}/payments with amount_cents == balance_due_cents"
        actor: Buyer
        preconditions:
          - "payment_status == UNPAID"
          - "logistics_status != ABANDONED; once the pickup-deadline sweep has abandoned an order it can no longer be paid (ERR_PAYMENT_WINDOW_CLOSED otherwise)"
        side_effects:
          - "sets balance_due_cents = 0 and paid_at = current logical clock"
          - "recomputes BuyerAccount.outstanding_exposure_cents"
      - transition_id: PARTIALLY_PAID_to_PAID
        from: PARTIALLY_PAID
        to: PAID
        trigger: "POST /liquidation/sale-orders/{id}/payments with amount_cents == balance_due_cents"
        actor: Buyer
        preconditions:
          - "payment_status == PARTIALLY_PAID"
          - "amount_cents == balance_due_cents"
        side_effects:
          - "sets balance_due_cents = 0 and paid_at = current logical clock"
          - "when the payment lands after payment_due_at the late fee already recorded in late_fee_cents remains part of total_due_cents"
      - transition_id: PAID_to_REFUND_ISSUED
        from: PAID
        to: REFUND_ISSUED
        trigger: "cascade from POST /liquidation/claims/{id}/decisions with decision IN {APPROVE, PARTIALLY_APPROVE}"
        actor: MarketplaceOps
        preconditions:
          - "payment_status == PAID"
          - "the Claim's manifest line belongs to this order's lot"
        side_effects:
          - "increases claim_credit_cents by calculations.claim_refund.refund_cents"
          - "increases BuyerAccount.wallet_credit_cents by the same amount (amount_paid_cents is NOT reduced)"
          - "recomputes Lot.manifest_accuracy_score, which may transition SellerAccount to MANIFEST_PROBATION and reassign commission_tier"
        note: "Ledger sync: the conserved quantity BUYER_NET_OUTLAY = SaleOrder.amount_paid_cents - BuyerAccount.wallet_credit_cents drops by exactly refund_cents."
      - transition_id: REFUND_ISSUED_to_PAID
        from: REFUND_ISSUED
        to: PAID
        trigger: "cascade from POST /liquidation/claims/{id}/reversals"
        actor: TrustSafety
        preconditions:
          - "payment_status == REFUND_ISSUED"
          - "Claim.claim_status IN {APPROVED, PARTIALLY_APPROVED}"
        side_effects:
          - "decreases claim_credit_cents by the reversed refund_cents; when claim_credit_cents returns to 0 the payment_status returns to PAID"
          - "decreases BuyerAccount.wallet_credit_cents by the same amount"
          - "recomputes Lot.manifest_accuracy_score back to its pre-claim value, which may return SellerAccount to ACTIVE"
        note: "Compensation: every side effect of PAID_to_REFUND_ISSUED is reversed and BUYER_NET_OUTLAY returns to its pre-claim value with no drift."

  - entity: SaleOrder
    state_field: logistics_status
    shape: parallel
    parallel_dimension: 2
    initial_state: AWAITING_APPOINTMENT
    terminal_states: [PICKED_UP, ABANDONED]
    transitions:
      - transition_id: AWAITING_APPOINTMENT_to_APPOINTMENT_SCHEDULED
        from: AWAITING_APPOINTMENT
        to: APPOINTMENT_SCHEDULED
        trigger: "POST /liquidation/sale-orders/{id}/pickup-appointments"
        actor: Buyer
        preconditions:
          - "logistics_status == AWAITING_APPOINTMENT"
          - "payment_status == PAID (ERR_ORDER_NOT_PAID otherwise) — cross-dimension guard"
          - "window_end_at <= pickup_deadline_at (ERR_PICKUP_DEADLINE_PASSED otherwise)"
          - "a dock door is available at the requested warehouse (ERR_DOCK_CAPACITY_EXHAUSTED otherwise)"
          - "the carrier has remaining capacity on that UTC date (ERR_CARRIER_DAY_CAPACITY_FULL otherwise)"
        side_effects:
          - "creates a PickupAppointment with appointment_status == SCHEDULED and the assigned dock_door_number"
          - "the new appointment is discoverable through GET /liquidation/pickup-appointments?sale_order_id=<order id>"
      - transition_id: APPOINTMENT_SCHEDULED_to_PICKED_UP
        from: APPOINTMENT_SCHEDULED
        to: PICKED_UP
        trigger: "POST /liquidation/pickup-appointments/{id}/completions"
        actor: MarketplaceOps
        preconditions:
          - "logistics_status == APPOINTMENT_SCHEDULED"
          - "PickupAppointment.appointment_status == SCHEDULED"
          - "actual_freight_cents >= 0 is supplied"
        side_effects:
          - "PickupAppointment.appointment_status becomes COMPLETED and completed_at is set"
          - "sets picked_up_at and claim_window_closes_at = completed_at + CLAIM_WINDOW_DAYS"
          - "switches the order's settlement_basis from PROVISIONAL to FINAL: freight_cents = actual_freight_cents and total_due_cents is recomputed (see calculations.order_settlement)"
          - "recomputes SellerAccount.net_proceeds_cents, which recomputes net_recovery_rate"
      - transition_id: AWAITING_APPOINTMENT_to_ABANDONED
        from: AWAITING_APPOINTMENT
        to: ABANDONED
        trigger: "POST /liquidation/pickup-deadline-sweeps"
        actor: MarketplaceOps
        preconditions:
          - "logistics_status == AWAITING_APPOINTMENT"
          - "current logical clock > pickup_deadline_at (strict)"
        side_effects:
          - "sets abandoned_at"
          - "Lot.lot_status becomes RELIST_PENDING (see Lot.SOLD_to_RELIST_PENDING)"
          - "recomputes SellerAccount.gross_hammer_cents and sold_retail_value_cents, then gross_recovery_rate, then commission_tier"
          - "recomputes BuyerAccount.outstanding_exposure_cents (the abandoned order leaves the exposure base)"
      - transition_id: APPOINTMENT_SCHEDULED_to_ABANDONED
        from: APPOINTMENT_SCHEDULED
        to: ABANDONED
        trigger: "POST /liquidation/pickup-deadline-sweeps"
        actor: MarketplaceOps
        preconditions:
          - "logistics_status == APPOINTMENT_SCHEDULED"
          - "current logical clock > pickup_deadline_at (strict)"
        side_effects:
          - "the SCHEDULED PickupAppointment becomes CANCELLED and frees its dock-door interval"
          - "sets abandoned_at, cascades Lot to RELIST_PENDING and recomputes the seller and buyer aggregates"
        note: "Conditional cascade: the appointment is only cancelled when one exists in SCHEDULED; an order already PICKED_UP or ABANDONED is skipped by the sweep."

  - entity: PickupAppointment
    state_field: appointment_status
    shape: branching
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - transition_id: SCHEDULED_to_COMPLETED
        from: SCHEDULED
        to: COMPLETED
        trigger: "POST /liquidation/pickup-appointments/{id}/completions"
        actor: MarketplaceOps
        preconditions:
          - "appointment_status == SCHEDULED"
          - "current logical clock >= window_start_at (ERR_APPOINTMENT_NOT_STARTED otherwise)"
        side_effects:
          - "sets completed_at = current logical clock and picked_up_unit_count, and writes SaleOrder.actual_freight_cents from the request body"
          - "SaleOrder.logistics_status becomes PICKED_UP and the order settles FINAL"
      - transition_id: SCHEDULED_to_CANCELLED
        from: SCHEDULED
        to: CANCELLED
        trigger: "POST /liquidation/pickup-appointments/{id}/cancellations or cascade from POST /liquidation/pickup-deadline-sweeps"
        actor: Buyer | MarketplaceOps
        preconditions:
          - "appointment_status == SCHEDULED"
          - "for the buyer-initiated path: X-User-ID == SaleOrder.buyer_id and current logical clock < window_start_at"
        side_effects:
          - "frees the dock-door interval so the same [window_start_at, window_end_at) becomes assignable again"
          - "SaleOrder.logistics_status returns to AWAITING_APPOINTMENT on the buyer-initiated path, or becomes ABANDONED on the sweep path"
          - "leaves the order with no appointment in appointment_status == SCHEDULED"

  - entity: Claim
    state_field: claim_status
    shape: cyclic
    initial_state: SUBMITTED
    terminal_states: [DENIED, REVERSED]
    transitions:
      - transition_id: SUBMITTED_to_UNDER_REVIEW
        from: SUBMITTED
        to: UNDER_REVIEW
        trigger: "POST /liquidation/sale-orders/{id}/claims (when evidence_item_count >= MIN_EVIDENCE_ITEMS at creation) or POST /liquidation/claims/{id}/evidence-items"
        actor: Buyer
        preconditions:
          - "claim_status == SUBMITTED"
          - "evidence_item_count >= MIN_EVIDENCE_ITEMS (ERR_EVIDENCE_INSUFFICIENT otherwise)"
        side_effects:
          - "the claim becomes decidable; no money field moves yet"
      - transition_id: UNDER_REVIEW_to_EVIDENCE_REQUESTED
        from: UNDER_REVIEW
        to: EVIDENCE_REQUESTED
        trigger: "POST /liquidation/claims/{id}/decisions with decision == REQUEST_EVIDENCE"
        actor: MarketplaceOps
        preconditions:
          - "claim_status == UNDER_REVIEW"
          - "evidence_request_count < MAX_EVIDENCE_REQUESTS (ERR_EVIDENCE_REQUEST_LIMIT otherwise)"
          - "X-User-ID != Lot.manifest_reviewed_by_user_id (ERR_SEGREGATION_OF_DUTIES otherwise)"
        side_effects:
          - "increments evidence_request_count by 1"
      - transition_id: EVIDENCE_REQUESTED_to_UNDER_REVIEW
        from: EVIDENCE_REQUESTED
        to: UNDER_REVIEW
        trigger: "POST /liquidation/claims/{id}/evidence-items"
        actor: Buyer
        preconditions:
          - "claim_status == EVIDENCE_REQUESTED"
          - "X-User-ID == the buyer_id of the Claim's SaleOrder"
        side_effects:
          - "increments evidence_item_count by 1"
        note: "Revision loop: at most MAX_EVIDENCE_REQUESTS round trips are possible before a decision must be made."
      - transition_id: UNDER_REVIEW_to_APPROVED
        from: UNDER_REVIEW
        to: APPROVED
        trigger: "POST /liquidation/claims/{id}/decisions with decision == APPROVE"
        actor: MarketplaceOps
        preconditions:
          - "claim_status == UNDER_REVIEW"
          - "verified_units == claimed_units (ERR_VERIFIED_UNITS_MISMATCH otherwise)"
          - "X-User-ID != Lot.manifest_reviewed_by_user_id"
        side_effects:
          - "computes refund_cents (see calculations.claim_refund) and sets decided_by_user_id and verified_units"
          - "SaleOrder.payment_status becomes REFUND_ISSUED and BuyerAccount.wallet_credit_cents increases"
          - "recomputes Lot.manifest_accuracy_score, then SellerAccount.manifest_accuracy_avg, then possibly SellerAccount.account_status and commission_tier"
      - transition_id: UNDER_REVIEW_to_PARTIALLY_APPROVED
        from: UNDER_REVIEW
        to: PARTIALLY_APPROVED
        trigger: "POST /liquidation/claims/{id}/decisions with decision == PARTIALLY_APPROVE"
        actor: MarketplaceOps
        preconditions:
          - "claim_status == UNDER_REVIEW"
          - "0 < verified_units < claimed_units"
        side_effects:
          - "identical to UNDER_REVIEW_to_APPROVED but refund_cents is computed on verified_units"
      - transition_id: UNDER_REVIEW_to_DENIED
        from: UNDER_REVIEW
        to: DENIED
        trigger: "POST /liquidation/claims/{id}/decisions with decision == DENY"
        actor: MarketplaceOps
        preconditions:
          - "claim_status == UNDER_REVIEW"
          - "verified_units == 0"
        side_effects:
          - "sets refund_cents = 0, verified_units = 0 and decided_by_user_id"
          - "no order, buyer or seller aggregate changes"
      - transition_id: DECIDED_to_REVERSED
        from: APPROVED | PARTIALLY_APPROVED
        to: REVERSED
        trigger: "POST /liquidation/claims/{id}/reversals"
        actor: TrustSafety
        preconditions:
          - "claim_status IN {APPROVED, PARTIALLY_APPROVED}"
          - "SaleOrder.payment_status == REFUND_ISSUED"
        side_effects:
          - "reverses the refund: SaleOrder.claim_credit_cents and BuyerAccount.wallet_credit_cents both decrease by refund_cents"
          - "restores Lot.manifest_accuracy_score and, transitively, SellerAccount.manifest_accuracy_avg / account_status / commission_tier"

  - entity: BuyerAccount
    state_field: qualification_status
    shape: cyclic
    initial_state: PENDING
    terminal_states: [REJECTED]
    transitions:
      - transition_id: PENDING_to_QUALIFIED
        from: PENDING
        to: QUALIFIED
        trigger: "POST /liquidation/buyer-accounts/{id}/qualification-decisions with decision == QUALIFY"
        actor: TrustSafety
        preconditions:
          - "qualification_status == PENDING"
          - "resale_certificate_number is non-empty and resale_certificate_expires_on > the UTC calendar date of the current logical clock (ERR_RESALE_CERTIFICATE_EXPIRED otherwise)"
          - "the request body carries business_verified == true (ERR_BUSINESS_NOT_VERIFIED otherwise)"
        side_effects:
          - "business_verification_status becomes VERIFIED and the buyer may bid, negotiate and purchase"
      - transition_id: PENDING_to_REJECTED
        from: PENDING
        to: REJECTED
        trigger: "POST /liquidation/buyer-accounts/{id}/qualification-decisions with decision == REJECT"
        actor: TrustSafety
        preconditions:
          - "qualification_status == PENDING"
        side_effects:
          - "business_verification_status becomes REJECTED; qualification_status == REJECTED is terminal"
      - transition_id: QUALIFIED_to_SUSPENDED
        from: QUALIFIED
        to: SUSPENDED
        trigger: "POST /liquidation/buyer-accounts/{id}/qualification-decisions with decision == SUSPEND"
        actor: TrustSafety
        preconditions:
          - "qualification_status == QUALIFIED"
        side_effects:
          - "the buyer can no longer bid, negotiate or buy (ERR_BUYER_NOT_QUALIFIED) but existing SaleOrders remain payable"
      - transition_id: SUSPENDED_to_QUALIFIED
        from: SUSPENDED
        to: QUALIFIED
        trigger: "POST /liquidation/buyer-accounts/{id}/qualification-decisions with decision == QUALIFY"
        actor: TrustSafety
        preconditions:
          - "qualification_status == SUSPENDED"
          - "resale_certificate_expires_on > the UTC calendar date of the current logical clock"
        side_effects:
          - "business_verification_status becomes VERIFIED and the buyer may bid, negotiate and purchase"
        note: "Reinstatement loop: SUSPENDED is re-enterable, so qualification is cyclic rather than linear."

  - entity: SellerAccount
    state_field: account_status
    shape: cyclic
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - transition_id: ACTIVE_to_MANIFEST_PROBATION
        from: ACTIVE
        to: MANIFEST_PROBATION
        trigger: "cascade from POST /liquidation/claims/{id}/decisions (see calculations.seller_probation_evaluation)"
        actor: system
        preconditions:
          - "account_status == ACTIVE"
          - "manifest_accuracy_avg < 0.850 after the claim decision recomputed the lot scores (strict comparison on the 3-decimal average)"
        side_effects:
          - "sets commission_tier = TIER_PROBATION and commission_rate_bps = 2500, overriding the recovery-based tier"
          - "blocks Listing.DRAFT_to_OPEN for every lot of this seller (ERR_SELLER_NOT_ACTIVE)"
      - transition_id: MANIFEST_PROBATION_to_ACTIVE
        from: MANIFEST_PROBATION
        to: ACTIVE
        trigger: "cascade from POST /liquidation/claims/{id}/reversals"
        actor: system
        preconditions:
          - "account_status == MANIFEST_PROBATION"
          - "manifest_accuracy_avg >= 0.850 after the reversal restored the lot scores"
        side_effects:
          - "reassigns commission_tier from calculations.commission_tier_assignment on the current gross_recovery_rate"

# =============================================================================
# §1.2.1 Concurrency Rules (optimistic concurrency control only)
# =============================================================================
concurrency_rules:
  - rule_id: proxy-bid-supersede-stale-listing
    parent_entity: Listing
    version_field: version
    occ_field: expected_listing_version
    write_endpoint: "POST /liquidation/listings/{id}/proxy-bids"
    error_id: ERR_STALE_LISTING_VERSION
    status: 412
    description: >
      A proxy bid encodes the buyer's ceiling relative to the auction state the buyer last read.
      The client must echo the Listing.version it read; if any other write has advanced
      Listing.version since (a live bid, a proxy bid by another buyer, an anti-sniping extension),
      the submission is rejected with ERR_STALE_LISTING_VERSION (412) and no Bid row is created.
      The buyer re-reads GET /liquidation/listings/{id} and resubmits with the new version.
    version_increment: "Every accepted write to POST /liquidation/listings/{id}/bids, POST /liquidation/listings/{id}/proxy-bids, POST /liquidation/listings/{id}/publications and POST /liquidation/listings/{id}/closures increments Listing.version by exactly 1."

  - rule_id: counter-offer-supersede-stale-negotiation
    parent_entity: Negotiation
    version_field: version
    occ_field: expected_negotiation_version
    write_endpoint: "POST /liquidation/negotiations/{id}/counter-offers"
    error_id: ERR_STALE_NEGOTIATION_VERSION
    status: 412
    description: >
      A counter-offer is only meaningful against the offer the caller last saw. The caller must
      echo Negotiation.version; if the other side has already countered (advancing round_number
      and version), the stale counter-offer is rejected with ERR_STALE_NEGOTIATION_VERSION (412),
      no Offer row is created and round_number is unchanged.
    version_increment: "Every accepted write to POST /liquidation/negotiations/{id}/counter-offers and POST /liquidation/negotiations/{id}/acceptances increments Negotiation.version by exactly 1."

# =============================================================================
# §1.3 Calculation & Algorithm Rules
# All money is integer cents. All rates are integer basis points unless stated.
# Every ratio field is a decimal string with exactly 4 fractional digits,
# rounded half-up at the final step only.
# =============================================================================
calculations:

  - rule_id: proxy_bid_resolution
    description: >
      Resolves the public high bid of an AUCTION listing from the full set of live and proxy bids.
      A PROXY bid carries a hidden max_amount_cents ceiling; a LIVE bid's ceiling is its own
      amount_cents. The listing's displayed current_high_bid_cents is the smallest amount that
      beats the runner-up rather than the leader's full ceiling, which is why two buyers with
      ceilings 3,000,000 and 2,600,000 produce a public high bid of 2,700,000 and not 3,000,000.
    algorithm_type: aggregation
    trigger: "POST /liquidation/listings/{id}/bids and POST /liquidation/listings/{id}/proxy-bids"
    input_set:
      entity: Bid
      filter: "listing_id == this listing AND bid_status IN {STANDING, WINNING}"
      note: "Bids with bid_status IN {LOST, WON, RETRACTED} are excluded from resolution."
    formula: |
      ceiling_cents(bid) = bid.max_amount_cents when bid.bid_type == PROXY
                         = bid.amount_cents     when bid.bid_type == LIVE

      # Step 1 - collapse to one candidate per distinct buyer. When a buyer places a new bid,
      #          that buyer's previous bids on the listing are set to bid_status == SUPERSEDED,
      #          so the input set already holds at most one live bid per buyer_id. On a tie of
      #          ceilings between two different buyers the earliest created_at ranks first.
      candidates = the input set, which holds exactly one entry per distinct buyer_id

      # Step 2 - rank candidates by (ceiling_cents DESC, created_at ASC).
      #          created_at ASC is the sole tie-break; entity id is never consulted.
      leader    = candidates[0]
      runner_up = candidates[1] if len(candidates) >= 2 else None

      # Step 3 - public high bid
      if len(candidates) == 0:
          current_high_bid_cents = null
          current_high_bidder_id = null
      elif len(candidates) == 1:
          current_high_bid_cents = max(Listing.opening_bid_cents,
                                       leader.amount_cents if leader.bid_type == LIVE
                                       else Listing.opening_bid_cents)
          current_high_bidder_id = leader.buyer_id
      else:
          current_high_bid_cents = min(leader.ceiling_cents,
                                       runner_up.ceiling_cents + Listing.bid_increment_cents)
          current_high_bidder_id = leader.buyer_id

      # Step 4 - statuses
      leader.bid_status = WINNING; every other candidate keeps bid_status = STANDING
      leader.meets_reserve = the calculations.reserve_met result for the new current_high_bid_cents

      # Step 5 - minimum acceptable next bid, published on the listing
      min_next_bid_cents = Listing.opening_bid_cents            when current_high_bid_cents is null
                         = current_high_bid_cents + Listing.bid_increment_cents  otherwise
    constants:
      note: "No calculation-level constants; opening_bid_cents and bid_increment_cents come from the Listing."
    precision:
      rounding: none
      unit: integer_cents
    determinism:
      eligibility: "bid_status IN {STANDING, WINNING}, one candidate per buyer_id"
      ranking: "ceiling_cents DESC"
      tie_break: "created_at ASC (never id)"
      empty_pool: "current_high_bid_cents = null and min_next_bid_cents = opening_bid_cents"
    worked_example: |
      Listing S1: opening_bid_cents = 1,000,000, bid_increment_cents = 100,000.
      1) Buyer A LIVE 1,000,000            -> candidates {A:1,000,000}
         one candidate -> current_high_bid_cents = 1,000,000, min_next = 1,100,000
      2) Buyer B PROXY max 3,000,000       -> candidates {B:3,000,000, A:1,000,000}
         leader B, runner_up A -> min(3,000,000, 1,000,000 + 100,000) = 1,100,000
         current_high_bid_cents = 1,100,000, WINNING = B's proxy, min_next = 1,200,000
      3) Buyer A LIVE 2,600,000            -> candidates {B:3,000,000, A:2,600,000}
         leader B -> min(3,000,000, 2,600,000 + 100,000) = 2,700,000
         current_high_bid_cents = 2,700,000, WINNING = B's proxy, min_next = 2,800,000

  - rule_id: reserve_met
    description: >
      A boolean derived field on Listing telling whether the current public high bid has reached
      the seller's reserve. The comparison is inclusive at the reserve.
    algorithm_type: threshold
    trigger: "recomputed on every write that changes Listing.current_high_bid_cents"
    formula: |
      reserve_met = true  when Listing.reserve_price_cents is null
                  = false when current_high_bid_cents is null
                  = (current_high_bid_cents >= Listing.reserve_price_cents)  otherwise
    constants:
      note: "Reserve comparison is inclusive: high bid exactly equal to the reserve satisfies it."
    precision:
      rounding: none
      unit: integer_cents
    worked_example: |
      reserve_price_cents = 2,700,000
      current_high_bid_cents = 2,699,999 -> reserve_met = false
      current_high_bid_cents = 2,700,000 -> reserve_met = true
      current_high_bid_cents = 2,700,001 -> reserve_met = true

  - rule_id: anti_sniping_extension
    description: >
      A bid landing inside the closing window pushes the effective close time out, up to a capped
      number of extensions. The window test is inclusive of the boundary second and the extension
      is measured from the current effective_close_at, not from the bid time.
    algorithm_type: threshold
    trigger: "POST /liquidation/listings/{id}/bids and POST /liquidation/listings/{id}/proxy-bids on an AUCTION listing"
    formula: |
      seconds_remaining = effective_close_at - current logical clock   # in whole seconds
      eligible = (Listing.listing_format == AUCTION)
                 AND (seconds_remaining >= 0)
                 AND (seconds_remaining <= SNIPE_WINDOW_SECONDS)
                 AND (Listing.extension_count < MAX_EXTENSIONS)
      if eligible:
          effective_close_at = effective_close_at + EXTENSION_SECONDS
          extension_count    = extension_count + 1
      # window_end_at is never modified; only effective_close_at moves.
    constants:
      SNIPE_WINDOW_SECONDS: 120
      EXTENSION_SECONDS: 300
      MAX_EXTENSIONS: 3
    precision:
      rounding: none
      unit: whole_seconds
    worked_example: |
      window_end_at = effective_close_at = 2026-08-12T00:00:00Z, extension_count = 0.
      Bid at 2026-08-11T23:58:00Z -> seconds_remaining = 120 (<= 120, inclusive)
        -> effective_close_at = 2026-08-12T00:03:00Z, extension_count = 1
      Bid at 2026-08-11T23:57:59Z -> seconds_remaining = 121 -> no extension, count stays 0
      A 4th qualifying bid when extension_count == 3 leaves effective_close_at unchanged.

  - rule_id: auction_close_outcome
    description: >
      Decides between CLOSED_SOLD and CLOSED_NO_SALE for an AUCTION listing and, on a sale, pins
      the hammer price. The outcome depends on the empty/non-empty qualifying-bid set and on
      reserve_met; there is no partial outcome.
    algorithm_type: chronological
    trigger: "POST /liquidation/listings/{id}/closures"
    input_set:
      entity: Bid
      filter: "listing_id == this listing AND bid_status IN {STANDING, WINNING}"
    formula: |
      if current logical clock < effective_close_at: reject ERR_AUCTION_NOT_CLOSABLE
      if the qualifying-bid set is empty OR reserve_met == false:
          outcome = CLOSED_NO_SALE ; hammer_price_cents = null
          every qualifying Bid -> LOST
      else:
          outcome = CLOSED_SOLD
          hammer_price_cents = Listing.current_high_bid_cents
          winning_bid = the Bid with bid_status == WINNING
          winning_bid -> WON ; every other qualifying Bid -> LOST
    constants:
      note: "No constants; both branches are driven by the qualifying-bid set and reserve_met."
    precision:
      rounding: none
      unit: integer_cents
    worked_example: |
      Listing S1 at close: current_high_bid_cents = 2,700,000, reserve 2,700,000 -> reserve_met true
        -> CLOSED_SOLD, hammer_price_cents = 2,700,000, buyer B's proxy bid -> WON, buyer A -> LOST.
      Listing with zero bids -> CLOSED_NO_SALE, hammer null, lot -> RELIST_PENDING.
      Listing with high bid 2,699,999 against reserve 2,700,000 -> CLOSED_NO_SALE.

  - rule_id: negotiation_round_control
    description: >
      Governs the negotiated-terms ladder: how long each standing offer lives and how many rounds
      the two sides may exchange. A round is one offer by one side, and the buyer's opening offer is
      round 1, so at most MAX_NEGOTIATION_ROUNDS - 1 counter-offers are possible. Both tests are
      strict: an action at exactly current_offer_expires_at is too late, and a counter-offer that
      would push round_number above the cap is rejected without creating an Offer.
    algorithm_type: threshold
    trigger: "POST /liquidation/listings/{id}/negotiations, POST /liquidation/negotiations/{id}/counter-offers, POST /liquidation/negotiations/{id}/acceptances"
    formula: |
      # opening offer (buyer)
      round_number             = 1
      current_offer_side       = BUYER
      current_offer_expires_at = current logical clock + OFFER_TTL_HOURS hours

      # each counter-offer
      next_round = round_number + 1
      next_round <= MAX_NEGOTIATION_ROUNDS             -> accepted (ERR_NEGOTIATION_ROUND_LIMIT otherwise)
      current logical clock < current_offer_expires_at -> accepted (ERR_OFFER_EXPIRED otherwise)
      round_number             = next_round
      current_offer_side       = the countering side
      current_offer_expires_at = current logical clock + OFFER_TTL_HOURS hours

      # acceptance
      accepted_price_cents = current_offer_cents at the instant of acceptance
    constants:
      OFFER_TTL_HOURS: 48
      MAX_NEGOTIATION_ROUNDS: 4
    precision:
      rounding: none
      unit: whole_hours
    worked_example: |
      Clock 2026-08-05T00:00:00Z, Listing min_offer_cents 900,000.
        buyer opens 900,000   -> round 1, side BUYER,  expires 2026-08-07T00:00:00Z
        seller counters 1,500,000 at 2026-08-05T01:00:00Z
                              -> round 2, side SELLER, expires 2026-08-07T01:00:00Z
        buyer counters  1,200,000 -> round 3, side BUYER
        seller counters 1,350,000 -> round 4, side SELLER
        a 5th counter-offer would be round 5 > 4 -> ERR_NEGOTIATION_ROUND_LIMIT, round_number stays 4
        buyer accepts at round 4 -> accepted_price_cents = 1,350,000
      An acceptance attempted at exactly 2026-08-07T01:00:00Z -> ERR_OFFER_EXPIRED (strict comparison).

  - rule_id: buyer_premium
    description: >
      The buyer premium is a tiered percentage of the hammer price. The tier is selected by the
      whole hammer price (a flat, non-marginal table), so a hammer price one cent above a tier
      boundary is charged entirely at the next tier's rate.
    algorithm_type: tiered_pricing
    trigger: "SaleOrder creation (all three sale_source values)"
    formula: |
      buyer_premium_bps = 1400 when hammer_price_cents <= 1,000,000
                       = 1200 when 1,000,000 < hammer_price_cents <= 2,500,000
                       = 1000 when hammer_price_cents > 2,500,000
      buyer_premium_cents = round_half_up(hammer_price_cents * buyer_premium_bps / 10000)
    constants:
      BUYER_PREMIUM_TIERS:
        - {max_hammer_cents: 1000000, rate_bps: 1400}
        - {max_hammer_cents: 2500000, rate_bps: 1200}
        - {max_hammer_cents: null, rate_bps: 1000}
    precision:
      rounding: round_half_up
      decimals: 0
      unit: integer_cents
      order: "multiply hammer by rate_bps, divide by 10000, then round once"
    worked_example: |
      hammer 1,000,000 -> tier 1 (inclusive upper bound) -> 1400 bps -> 140,000
      hammer 1,000,001 -> tier 2 -> 1200 bps -> 120,000 (flat table: the whole amount reprices)
      hammer 2,500,000 -> tier 2 -> 1200 bps -> 300,000
      hammer 2,700,000 -> tier 3 -> 1000 bps -> 270,000
      hammer 1,350,000 -> tier 2 -> 1200 bps -> 162,000

  - rule_id: freight_estimate
    description: >
      Freight is billed per whole pallet. Pallet count is a ceiling division of the lot's declared
      unit count, so 401 units cost the same as 600 units.
    algorithm_type: threshold
    trigger: "SaleOrder creation (PROVISIONAL variant)"
    formula: |
      pallet_count = ceil(Lot.declared_unit_count / UNITS_PER_PALLET)
      estimated_freight_cents = pallet_count * FREIGHT_RATE_CENTS_PER_PALLET
    constants:
      UNITS_PER_PALLET: 200
      FREIGHT_RATE_CENTS_PER_PALLET: 8500
    precision:
      rounding: ceiling
      unit: whole_pallets
    worked_example: |
      declared_unit_count 400 -> ceil(400/200) = 2 pallets -> 17,000
      declared_unit_count 401 -> ceil(401/200) = 3 pallets -> 25,500
      declared_unit_count 445 -> 3 pallets -> 25,500
      declared_unit_count  50 -> 1 pallet   ->  8,500
      declared_unit_count  60 -> 1 pallet   ->  8,500

  - rule_id: order_settlement
    description: >
      Computes every money field on a SaleOrder. The rule is dual-variant: the PROVISIONAL variant
      runs at order creation with an estimated per-pallet freight charge, and the FINAL variant runs
      at pickup completion with the carrier's actual freight. The two variants use identical hammer
      and premium terms, so their delta is exactly the freight delta. The late fee is always
      computed from pre_fee_total_cents (hammer + premium + freight), never from total_due_cents,
      so a claim credit never shrinks the late fee and the fee is never charged on itself.
    algorithm_type: waterfall_allocation
    trigger: "SaleOrder creation (PROVISIONAL); POST /liquidation/pickup-appointments/{id}/completions (FINAL); POST /liquidation/payment-late-fee-sweeps (late fee)"
    variants:
      - variant: PROVISIONAL
        applies_when: "SaleOrder is created by an auction close, a fixed-price purchase or a negotiated acceptance"
        freight_source: "estimated_freight_cents from calculations.freight_estimate"
      - variant: FINAL
        applies_when: "the order's PickupAppointment is completed"
        freight_source: "SaleOrder.actual_freight_cents as supplied by MarketplaceOps at pickup completion"
    formula: |
      buyer_premium_bps    = calculations.buyer_premium.buyer_premium_bps(hammer_price_cents)
      buyer_premium_cents = round_half_up(hammer_price_cents * buyer_premium_bps / 10000)

      freight_cents = estimated_freight_cents          when settlement_basis == PROVISIONAL
                    = SaleOrder.actual_freight_cents  when settlement_basis == FINAL

      pre_fee_total_cents = hammer_price_cents + buyer_premium_cents + freight_cents

      late_fee_cents = 0                                                        when the order was paid in full at or before payment_due_at
                     = round_half_up(pre_fee_total_cents * LATE_FEE_BPS / 10000) once the late-fee sweep observes clock > payment_due_at with balance_due_cents > 0
      # late_fee_cents is assessed at most once per order and is frozen once assessed;
      # switching PROVISIONAL -> FINAL does NOT re-derive an already-assessed late fee.

      total_due_cents    = pre_fee_total_cents + late_fee_cents - claim_credit_cents
      balance_due_cents  = max(0, total_due_cents - amount_paid_cents)
      # clamped at zero: an approved claim credit on an already fully paid order lowers
      # total_due_cents below amount_paid_cents, and the buyer is made whole through
      # BuyerAccount.wallet_credit_cents rather than through a negative balance.

      payment_due_at    = created_at + PAYMENT_TERM_DAYS
      pickup_deadline_at = created_at + PICKUP_DEADLINE_DAYS
    constants:
      LATE_FEE_BPS: 150
      PAYMENT_TERM_DAYS: 3
      PICKUP_DEADLINE_DAYS: 10
    precision:
      rounding: round_half_up
      decimals: 0
      unit: integer_cents
      order: "1) premium from hammer, 2) sum pre_fee_total, 3) late fee from pre_fee_total, 4) subtract claim_credit, 5) subtract amount_paid, 6) clamp the balance at zero"
    worked_example: |
      Order S1 from the auction close: hammer 2,700,000, buyer_premium_bps 1000 -> premium 270,000,
      declared_unit_count 400 -> 2 pallets -> estimated freight 17,000.
        PROVISIONAL: pre_fee_total = 2,987,000 ; total_due = 2,987,000 ; balance_due = 2,987,000
      Pickup completed with actual_freight_cents = 19,000:
        FINAL:       pre_fee_total = 2,989,000 ; total_due = 2,989,000
        variant delta = +2,000, exactly the freight delta (19,000 - 17,000)
      Late-fee path on the same order left unpaid past 2026-08-15T00:00:00Z:
        late_fee = round_half_up(2,987,000 * 150 / 10000) = round_half_up(44,805.0) = 44,805
        total_due = 3,031,805  (computing the fee from total_due_cents would be self-referential
                                and computing it after a claim credit would understate it)
      Same order after an approved claim of 950,400 (still PROVISIONAL):
        total_due = 2,987,000 - 950,400 = 2,036,600 ; after pickup (FINAL) = 2,038,600

  - rule_id: claim_refund
    description: >
      Prices a manifest discrepancy. The shortfall is refunded at the per-unit price the buyer
      effectively paid for that manifest line - the line's proportional share of the hammer price
      divided by its declared unit count - plus the buyer premium that was charged on that share.
      Freight is never refunded because the freight was incurred regardless.
    algorithm_type: weighted_scoring
    trigger: "POST /liquidation/claims/{id}/decisions with decision IN {APPROVE, PARTIALLY_APPROVE}"
    input_set:
      entity: ManifestLine
      filter: "the single ManifestLine referenced by Claim.manifest_line_id, which must have line_status == ACTIVE"
    formula: |
      line_extended_cents   = ManifestLine.unit_count * ManifestLine.unit_retail_cents
      line_share_cents      = round_half_up(SaleOrder.hammer_price_cents * line_extended_cents
                                            / Lot.declared_retail_value_cents)
      per_unit_recovery_cents = round_half_up(line_share_cents / ManifestLine.unit_count)
      base_refund_cents     = per_unit_recovery_cents * verified_units
      premium_refund_cents  = round_half_up(base_refund_cents * SaleOrder.buyer_premium_bps / 10000)
      refund_cents          = base_refund_cents + premium_refund_cents
      # DENY sets refund_cents = 0 and touches no ledger.
    constants:
      CLAIM_WINDOW_DAYS: 5
      MIN_EVIDENCE_ITEMS: 2
      MAX_EVIDENCE_REQUESTS: 2
      note: "The premium rate is the rate already snapshotted on SaleOrder.buyer_premium_bps; the three constants above govern the claim window length and the evidence round trips."
    precision:
      rounding: round_half_up
      decimals: 0
      unit: integer_cents
      order: "round the line share first, then round the per-unit recovery, then multiply by units, then round the premium share"
    worked_example: |
      Lot S1: declared_retail_value_cents = 10,000,000. Line 1 = 100 units @ 40,000 = 4,000,000.
      SaleOrder S1: hammer 2,700,000, buyer_premium_bps 1000.
        line_share = round_half_up(2,700,000 * 4,000,000 / 10,000,000) = 1,080,000
        per_unit_recovery = 1,080,000 / 100 = 10,800
      Claim verified_units = 80:
        base = 10,800 * 80 = 864,000 ; premium share = round_half_up(864,000 * 1000 / 10000) = 86,400
        refund_cents = 950,400
      Claim verified_units = 8:
        base = 86,400 ; premium share = 8,640 ; refund_cents = 95,040
      DENY with verified_units = 0 -> refund_cents = 0

  - rule_id: manifest_accuracy_score
    description: >
      Scores a lot's manifest against verified shortfalls. Each condition grade carries a shortfall
      tolerance: units lost inside the tolerance are free, only the excess reduces the score. The
      tolerance is a floor of a fraction of the declared unit count, so a 400-unit CUSTOMER_RETURNS
      lot absorbs exactly 12 units of shortfall.
    algorithm_type: threshold
    trigger: "POST /liquidation/claims/{id}/decisions and POST /liquidation/claims/{id}/reversals"
    input_set:
      entity: Claim
      filter: "manifest_line_id belongs to this lot AND claim_status IN {APPROVED, PARTIALLY_APPROVED}"
      note: "REVERSED, DENIED, SUBMITTED, UNDER_REVIEW and EVIDENCE_REQUESTED claims contribute nothing."
    formula: |
      tolerance_fraction = CONDITION_TOLERANCE[Lot.condition_grade]
      allowed_units = floor(Lot.declared_unit_count * tolerance_fraction)
      total_verified_units = sum(verified_units) over the input set
      excess_units = max(0, total_verified_units - allowed_units)
      manifest_accuracy_score = round_half_up(1 - excess_units / Lot.declared_unit_count, 3)
      # clamped to [0.000, 1.000]; the field stays null until the lot's first claim resolution
    constants:
      CONDITION_TOLERANCE:
        NEW_OVERSTOCK: 0.01
        CUSTOMER_RETURNS: 0.03
        SALVAGE: 0.08
    precision:
      rounding: round_half_up
      decimals: 3
      unit: decimal_ratio
      order: "floor the allowance first, then subtract, then divide, then round once to 3 decimals"
    worked_example: |
      Lot S1: condition_grade CUSTOMER_RETURNS, declared_unit_count 400.
        allowed_units = floor(400 * 0.03) = 12
        verified 80 -> excess 68 -> score = 1 - 68/400 = 0.830
        verified 72 -> excess 60 -> score = 1 - 60/400 = 0.850  (exactly on the probation boundary)
        verified 12 -> excess  0 -> score = 1.000
        verified  8 -> excess  0 -> score = 1.000
      Same 400 units graded NEW_OVERSTOCK: allowed_units = floor(400 * 0.01) = 4,
        verified 80 -> excess 76 -> score = 1 - 76/400 = 0.810
      Same 400 units graded SALVAGE: allowed_units = 32,
        verified 80 -> excess 48 -> score = 1 - 48/400 = 0.880

  - rule_id: seller_probation_evaluation
    description: >
      Rolls the per-lot accuracy scores into a seller-level average and puts the seller on manifest
      probation once the average falls strictly below the threshold. The comparison is strict, so an
      average of exactly 0.8500 keeps the seller ACTIVE.
    algorithm_type: aggregation
    trigger: "cascade from POST /liquidation/claims/{id}/decisions and POST /liquidation/claims/{id}/reversals"
    input_set:
      entity: Lot
      filter: "seller_id == this seller AND manifest_accuracy_score IS NOT NULL"
      note: "A lot only acquires a score at its first claim resolution, so lots that were never claimed against are excluded entirely rather than counted as 1.000. scored_lot_count is the size of this set; when it is 0 the average is 1.000."
    formula: |
      scored_lot_count      = count(input set)
      manifest_accuracy_avg = 1.000 when scored_lot_count == 0
                            = round_half_up(mean(Lot.manifest_accuracy_score over the input set), 3)
      account_status = MANIFEST_PROBATION when manifest_accuracy_avg < MANIFEST_PROBATION_THRESHOLD
                     = ACTIVE             otherwise
      # The transition is re-evaluated in both directions on every claim decision and reversal.
    constants:
      MANIFEST_PROBATION_THRESHOLD: "0.850"
    precision:
      rounding: round_half_up
      decimals: 3
      unit: decimal_ratio
      order: "average the already-rounded per-lot scores, then round once"
    worked_example: |
      Seller with exactly one scored lot (S1), scored_lot_count = 1:
        score 0.830 -> avg 0.830 < 0.850 -> account_status MANIFEST_PROBATION, tier TIER_PROBATION
        score 0.850 -> avg 0.850, NOT < 0.850 -> account_status stays ACTIVE (strict boundary)
        score 1.000 -> avg 1.000 -> ACTIVE
      Seller with two scored lots at 0.830 and 1.000, scored_lot_count = 2:
        avg = round_half_up(0.915, 3) = 0.915 -> ACTIVE (one bad lot is diluted)
      After POST /liquidation/claims/{id}/reversals the reversed claim leaves the input set, S1's
      score returns to 1.000, the avg returns to 1.000 and the seller returns to ACTIVE - no drift.

  - rule_id: commission_tier_assignment
    description: >
      Assigns the seller's commission tier from the gross recovery rate, with manifest probation as
      an absolute override. The recovery comparison is inclusive at the threshold. The resulting
      rate is snapshotted onto SaleOrder.seller_commission_rate_bps when the order settles FINAL at
      pickup completion, so a later tier change never reprices an already settled order.
    algorithm_type: threshold
    trigger: "cascade from listing publication, auction close, fixed-price purchase, negotiated acceptance, pickup-deadline sweep, claim decision and claim reversal"
    formula: |
      if SellerAccount.account_status == MANIFEST_PROBATION:
          commission_tier = TIER_PROBATION ; commission_rate_bps = 2500
      elif gross_recovery_rate >= RECOVERY_PREFERRED_THRESHOLD:
          commission_tier = TIER_PREFERRED ; commission_rate_bps = 1500
      else:
          commission_tier = TIER_STANDARD  ; commission_rate_bps = 2000
      # SaleOrder.seller_commission_rate_bps = SellerAccount.commission_rate_bps as of pickup
      # completion, read AFTER the same request's recovery recomputation and then frozen.
    constants:
      RECOVERY_PREFERRED_THRESHOLD: "0.2500"
      TIER_STANDARD_BPS: 2000
      TIER_PREFERRED_BPS: 1500
      TIER_PROBATION_BPS: 2500
    precision:
      rounding: none
      unit: basis_points
    worked_example: |
      gross_recovery_rate 0.2499 -> TIER_STANDARD  (2000 bps)
      gross_recovery_rate 0.2500 -> TIER_PREFERRED (1500 bps, inclusive)
      gross_recovery_rate 0.2700 -> TIER_PREFERRED (1500 bps)
      gross_recovery_rate 0.9000 with account_status MANIFEST_PROBATION -> TIER_PROBATION (2500 bps)

  - rule_id: seller_net_proceeds
    description: >
      Computes the seller payout at FINAL settlement. Commission is charged per manifest line - each
      ACTIVE line's proportional share of the hammer price is rounded to cents, the commission on
      that rounded share is rounded to cents, and only then are the per-line commissions summed.
      Rounding per line and then summing is NOT the same as applying the rate to the whole hammer
      price: on a lot whose line shares each land near a half cent the two orders differ by a cent.
      The order given here is normative. Claim refunds are funded out of the buyer premium the
      platform retained, so an approved claim never changes seller_net_proceeds_cents; the seller's
      exposure to manifest inaccuracy runs through MANIFEST_PROBATION and the commission tier instead.
    algorithm_type: waterfall_allocation
    trigger: "POST /liquidation/pickup-appointments/{id}/completions (settlement_basis PROVISIONAL -> FINAL)"
    input_set:
      entity: ManifestLine
      filter: "lot_id == the order's lot AND line_status == ACTIVE"
      ordering: "created_at ASC (never id); the order is fixed so the summation is reproducible"
    formula: |
      seller_commission_rate_bps = SellerAccount.commission_rate_bps read at this instant, then
                                   frozen into SaleOrder.seller_commission_rate_bps

      for each line in the input set, in created_at ASC order:
          line_extended_cents   = line.unit_count * line.unit_retail_cents
          line_share_cents      = round_half_up(SaleOrder.hammer_price_cents * line_extended_cents
                                                / Lot.declared_retail_value_cents)
          line_commission_cents = round_half_up(line_share_cents
                                                * seller_commission_rate_bps / 10000)

      seller_commission_cents     = sum(line_commission_cents)     # round per line, THEN sum
      seller_debranding_fee_cents = Lot.declared_unit_count * BrandPolicy.debranding_fee_cents_per_unit
                                      when Lot.de_branding_required == true
                                  = 0 otherwise
      seller_net_proceeds_cents   = SaleOrder.hammer_price_cents
                                    - seller_commission_cents
                                    - seller_debranding_fee_cents
    constants:
      note: "The rate comes from calculations.commission_tier_assignment; the per-unit de-branding cost comes from the lot's BrandPolicy."
    precision:
      rounding: round_half_up
      decimals: 0
      unit: integer_cents
      order: "1) round each line_share, 2) round each line_commission, 3) sum the rounded line commissions, 4) subtract the de-branding fee. Never apply the rate to the hammer price directly."
    worked_example: |
      Lot S1 (2 lines, declared_retail_value_cents = 10,000,000, declared_unit_count 400,
      de_branding_required true with debranding_fee_cents_per_unit 25), hammer 2,700,000, rate 1500:
        line 1: 100 x 40,000 = 4,000,000 -> share 1,080,000 -> commission   162,000
        line 2: 300 x 20,000 = 6,000,000 -> share 1,620,000 -> commission   243,000
        seller_commission_cents = 405,000 (here the two orders agree)
        seller_debranding_fee_cents = 400 * 25 = 10,000
        seller_net_proceeds_cents = 2,700,000 - 405,000 - 10,000 = 2,285,000

      Lot D (the rounding-divergence lot): 3 lines, declared_retail_value_cents = 5,750,240,
      declared_unit_count 445, de_branding_required false, hammer 2,700,000, rate 1500:
        line 1:  75 x 19,999 = 1,499,925 -> share   704,283 -> commission 105,642  (105,642.45)
        line 2: 325 x 10,001 = 3,250,325 -> share 1,526,176 -> commission 228,926  (228,926.40)
        line 3:  45 x 22,222 =   999,990 -> share   469,541 -> commission  70,431  ( 70,431.15)
        shares sum to exactly 2,700,000
        seller_commission_cents = 105,642 + 228,926 + 70,431 = 404,999
        the forbidden shortcut round_half_up(2,700,000 * 1500 / 10000) = 405,000 is one cent higher
        seller_net_proceeds_cents = 2,700,000 - 404,999 - 0 = 2,295,001

  - rule_id: recovery_rate
    description: >
      The seller-facing recovery analytics. The rule is dual-variant on the same underlying sales:
      the GROSS basis divides hammer proceeds by the retail value of everything the seller put on
      the market (including lots that failed to sell), while the NET basis divides post-commission
      payouts by the retail value of what actually sold. The two variants therefore move in
      opposite directions when a lot fails to sell: GROSS falls because the denominator grows,
      NET is untouched because the failed lot never entered either NET term.
    algorithm_type: aggregation
    trigger: "cascade from listing publication, auction close, fixed-price purchase, negotiated acceptance, pickup completion and pickup-deadline sweep; read through GET /liquidation/recovery-analytics"
    variants:
      - variant: GROSS
        numerator: "SellerAccount.gross_hammer_cents = sum of SaleOrder.hammer_price_cents over this seller's orders with logistics_status != ABANDONED"
        denominator: "SellerAccount.listed_retail_value_cents = sum of Lot.declared_retail_value_cents over this seller's lots with lot_status IN {LISTED, SOLD, RELIST_PENDING}"
        output_field: gross_recovery_rate
      - variant: NET
        numerator: "SellerAccount.net_proceeds_cents = sum of SaleOrder.seller_net_proceeds_cents over this seller's orders with settlement_basis == FINAL"
        denominator: "SellerAccount.sold_retail_value_cents = sum of Lot.declared_retail_value_cents over this seller's lots with lot_status == SOLD"
        output_field: net_recovery_rate
    formula: |
      gross_recovery_rate = 0.0000 when listed_retail_value_cents == 0
                          = round_half_up(gross_hammer_cents / listed_retail_value_cents, 4)
      net_recovery_rate   = 0.0000 when sold_retail_value_cents == 0
                          = round_half_up(net_proceeds_cents / sold_retail_value_cents, 4)
    slicing:
      description: "GET /liquidation/recovery-analytics recomputes both variants over a filtered lot population without persisting anything."
      by_category: "group the lot population by Lot.category_code (APPAREL, ELECTRONICS, HOME_GOODS, TOYS)"
      by_channel: "group the lot population by Listing.resale_channel of the listing that produced each order (MARKETPLACE_RESALE, EXPORT_ONLY, DISCOUNT_RETAIL, SCRAP_ONLY)"
      empty_group: "a group with a zero denominator reports 0.0000 rather than being omitted"
    precision:
      rounding: round_half_up
      decimals: 4
      unit: decimal_ratio
      order: "divide integer cents by integer cents, then round once to 4 decimals"
    worked_example: |
      Seller Z, two lots, both declared with retail value on the manifest:
        Lot X: 1 line 100 x 100,000 -> declared_retail_value_cents 10,000,000
        Lot Y: 1 line  40 x 100,000 -> declared_retail_value_cents  4,000,000
      Step 1: Lot X sells FIXED_PRICE at 2,700,000, is paid and picked up (actual freight 9,000).
        listed_retail = 10,000,000, gross_hammer = 2,700,000 -> GROSS = 0.2700 -> TIER_PREFERRED 1500
        FINAL settlement: commission 405,000, no de-branding -> seller_net_proceeds 2,295,000
        sold_retail = 10,000,000, net_proceeds = 2,295,000 -> NET = 0.2295
      Step 2: Lot Y is published and closes with zero bids (CLOSED_NO_SALE, lot -> RELIST_PENDING).
        listed_retail = 14,000,000, gross_hammer unchanged 2,700,000
        GROSS = round_half_up(2,700,000 / 14,000,000, 4) = round_half_up(0.192857..., 4) = 0.1929
        sold_retail still 10,000,000, net_proceeds still 2,295,000 -> NET = 0.2295 (unchanged)
        the seller's tier drops to TIER_STANDARD, but Lot X's order keeps its frozen 1500 bps
      Same two lots in the opposite order (Y published and closed no-sale BEFORE X is picked up):
        at X's pickup the seller rate is already 2000 -> commission 540,000 -> net 2,160,000
        -> NET = 0.2160. The pipeline is order-sensitive by design.

  - rule_id: buyer_exposure
    description: >
      Tracks how much the buyer is on the hook for and enforces the credit ceiling. A live bid
      exposes the buyer to its own ceiling plus the buyer premium that ceiling would attract, so a
      proxy bid exposes the buyer to its hidden maximum, not to the current public price. Wallet
      credit from approved claims expands the headroom rather than reducing the exposure.
    algorithm_type: aggregation
    trigger: "POST /liquidation/listings/{id}/bids, POST /liquidation/listings/{id}/proxy-bids, POST /liquidation/listings/{id}/negotiations, POST /liquidation/negotiations/{id}/counter-offers, POST /liquidation/listings/{id}/closures, POST /liquidation/sale-orders/{id}/payments, POST /liquidation/pickup-deadline-sweeps"
    input_set:
      entity: Bid
      filter: "buyer_id == this buyer AND bid_status IN {STANDING, WINNING}"
      note: "SUPERSEDED, WON and LOST bids drop out; WON commitments are represented by the SaleOrder balance instead."
    formula: |
      bid_exposure_cents   = sum over the input set of
                               (bid.ceiling_cents
                                + round_half_up(bid.ceiling_cents
                                                * buyer_premium_bps(bid.ceiling_cents) / 10000))
      order_exposure_cents = sum of SaleOrder.balance_due_cents over this buyer's orders with
                               payment_status IN {UNPAID, PARTIALLY_PAID}
                               AND logistics_status != ABANDONED
      outstanding_exposure_cents = bid_exposure_cents + order_exposure_cents

      credit_ceiling_cents = BuyerAccount.approved_credit_limit_cents
                             + BuyerAccount.wallet_credit_cents
      # Admission test on every new commitment, evaluated on the exposure the request WOULD create:
      #   prospective_exposure_cents <= credit_ceiling_cents  -> allowed (inclusive)
      #   otherwise -> ERR_CREDIT_LIMIT_EXCEEDED
      available_credit_cents = credit_ceiling_cents - outstanding_exposure_cents
    constants:
      note: "The premium rate applied to a bid ceiling is the same BUYER_PREMIUM_TIERS table used at settlement."
    precision:
      rounding: round_half_up
      decimals: 0
      unit: integer_cents
      order: "compute each bid's premium from its own ceiling and round it before summing"
    worked_example: |
      Buyer C, approved_credit_limit_cents = 1,140,000, wallet_credit_cents = 0, no orders.
        LIVE bid of 1,000,000: ceiling 1,000,000, premium tier 1400 bps -> 140,000
          prospective_exposure = 1,140,000 <= 1,140,000 -> allowed (inclusive boundary)
      Buyer C with approved_credit_limit_cents = 1,139,999 instead:
          prospective_exposure = 1,140,000 > 1,139,999 -> ERR_CREDIT_LIMIT_EXCEEDED, no Bid created
      Buyer C with approved_credit_limit_cents = 1,139,999 and wallet_credit_cents = 1:
          credit_ceiling = 1,140,000 -> allowed; wallet credit is headroom, not a discount
      Buyer B, approved_credit_limit_cents = 10,000,000:
        PROXY bid with max_amount_cents 3,000,000 while the public price is only 1,100,000
          exposes 3,000,000 + round_half_up(3,000,000 * 1000 / 10000) = 3,300,000

  - rule_id: dock_door_assignment
    description: >
      Selects the dock door for a pickup appointment. Doors are numbered 1..dock_door_count and each
      door must sit idle for turnaround_buffer_minutes between two appointments. The occupation
      interval is half-open on the requested window and is padded by the buffer on both sides, so an
      appointment that starts exactly buffer minutes after the previous one ends is accepted while
      one starting a minute earlier is not.
    algorithm_type: interval_merge
    trigger: "POST /liquidation/sale-orders/{id}/pickup-appointments"
    input_set:
      entity: PickupAppointment
      filter: "warehouse_id == the requested warehouse AND appointment_status == SCHEDULED"
      note: "COMPLETED and CANCELLED appointments release their door immediately and are excluded."
    formula: |
      buffer = Warehouse.turnaround_buffer_minutes

      conflicts(existing, requested) =
            requested.window_start_at < existing.window_end_at   + buffer
        AND existing.window_start_at  < requested.window_end_at  + buffer

      eligible_doors = [ d for d in 1..Warehouse.dock_door_count
                         if no existing appointment on door d conflicts with the request ]
      ranking   = ascending dock_door_number
      selection = eligible_doors[0]
      empty_pool -> reject with ERR_DOCK_CAPACITY_EXHAUSTED (no appointment is created)

      # Companion aggregate limit, checked after the door selector succeeds:
      carrier_day_count = count of PickupAppointment rows with carrier_id == the requested carrier
                          AND appointment_status == SCHEDULED
                          AND window_start_at falls on the same UTC calendar date as the request
      carrier_day_count + 1 <= Carrier.daily_pickup_capacity  -> allowed
      otherwise -> ERR_CARRIER_DAY_CAPACITY_FULL
    constants:
      note: "Both limits are per-entity configuration: Warehouse.dock_door_count, Warehouse.turnaround_buffer_minutes and Carrier.daily_pickup_capacity."
    determinism:
      eligibility: "doors 1..dock_door_count with no conflicting SCHEDULED appointment"
      ranking: "dock_door_number ASC"
      tie_break: "none needed - dock_door_number is unique within a warehouse"
      empty_pool: "ERR_DOCK_CAPACITY_EXHAUSTED (422)"
    precision:
      rounding: none
      unit: whole_minutes
    worked_example: |
      Warehouse W: dock_door_count = 1, turnaround_buffer_minutes = 15.
        A1 booked [2026-08-18T14:00:00Z, 2026-08-18T15:00:00Z) -> dock_door_number 1
        request [15:00:00Z, 16:00:00Z): 15:00 < 15:00+15min = 15:15 -> conflict
          -> eligible_doors is empty -> ERR_DOCK_CAPACITY_EXHAUSTED
        request [15:15:00Z, 16:15:00Z): 15:15 < 15:15 is false -> no conflict -> door 1 assigned
        after A1 is CANCELLED, the [15:00:00Z, 16:00:00Z) request succeeds on door 1
      Warehouse W2 with dock_door_count = 2 and the same A1 on door 1:
        request [15:00:00Z, 16:00:00Z) -> door 1 conflicts, door 2 is free -> door 2 assigned
      Carrier K with daily_pickup_capacity = 1:
        first appointment on 2026-08-18 -> allowed
        second appointment on 2026-08-18 (any warehouse, any free door) -> ERR_CARRIER_DAY_CAPACITY_FULL
        an appointment on 2026-08-19 -> allowed (the counter is per UTC calendar date)

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# A single request that violates several rules returns the error of the LOWEST
# priority number. Bands 11-16 are the domain-specific business ordering:
# brand/geographic safety first, then time, then physical capacity, then other
# constraints, then money.
# =============================================================================
validations:

  # --- band 1: authentication -------------------------------------------------
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers are both present and non-empty"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all endpoints"

  # --- band 2: authorization by role ------------------------------------------
  - priority: 2
    category: auth
    check: "X-User-Role is one of the roles listed in the endpoint's roles[] per §1.7"
    error_id: ERR_ROLE_NOT_PERMITTED
    http_status: 403
    applies_to: "all endpoints"

  # --- band 3: path existence, left to right ----------------------------------
  - priority: 3
    category: existence
    check: "every {id} in the path resolves to a stored row, validated left to right; the first unresolved segment decides the error"
    error_id: "ERR_LOT_NOT_FOUND | ERR_MANIFEST_LINE_NOT_FOUND | ERR_LISTING_NOT_FOUND | ERR_NEGOTIATION_NOT_FOUND | ERR_SALE_ORDER_NOT_FOUND | ERR_APPOINTMENT_NOT_FOUND | ERR_CLAIM_NOT_FOUND | ERR_BUYER_NOT_FOUND | ERR_SELLER_NOT_FOUND"
    http_status: 404
    applies_to: "every endpoint with a path parameter"

  # --- band 4: resource ownership ---------------------------------------------
  - priority: 4
    category: auth
    check: "SellerOps acts only on lots, manifest lines, listings and negotiations whose lot's seller_id == X-User-ID; Buyer acts only on bids, negotiations, orders, appointments and claims whose buyer_id == X-User-ID"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "all SellerOps and Buyer write endpoints, and GET /liquidation/recovery-analytics for SellerOps"

  # --- band 5: segregation of duties ------------------------------------------
  - priority: 5
    category: auth
    check: "the MarketplaceOps X-User-ID deciding a claim differs from Lot.manifest_reviewed_by_user_id of the lot that claim's manifest line belongs to; checked BEFORE any claim state or evidence check"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /liquidation/claims/{id}/decisions"
  - priority: 5
    category: auth
    check: "the TrustSafety X-User-ID reversing a claim differs from Claim.decided_by_user_id"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /liquidation/claims/{id}/reversals"

  # --- band 6: request-body foreign keys --------------------------------------
  - priority: 6
    category: business_referential
    check: "every FK carried in the request body resolves to a stored row (seller_id, warehouse_id, brand_policy_id, lot_id, listing_id, buyer_id, carrier_id, manifest_line_id)"
    error_id: "ERR_SELLER_NOT_FOUND | ERR_WAREHOUSE_NOT_FOUND | ERR_BRAND_POLICY_NOT_FOUND | ERR_LOT_NOT_FOUND | ERR_LISTING_NOT_FOUND | ERR_BUYER_NOT_FOUND | ERR_CARRIER_NOT_FOUND | ERR_MANIFEST_LINE_NOT_FOUND"
    http_status: 404
    applies_to: "every endpoint whose input[] carries an FK field"

  # --- band 7: request shape --------------------------------------------------
  - priority: 7
    category: request_shape
    check: "all required input fields present; enums within their declared value sets; integers within their declared ranges (unit_count >= 1, unit_retail_cents >= 1, dock_door_count >= 1, daily_pickup_capacity >= 1, bid_increment_cents >= 1); window_end_at > window_start_at; format-conditional fields present (opening_bid_cents for AUCTION, ask_price_cents for FIXED_PRICE, min_offer_cents for NEGOTIATED)"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all POST and PATCH endpoints"
  - priority: 7
    category: request_shape
    check: "pagination limit within [1, 100] and offset >= 0"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all list endpoints"

  # --- band 8: optimistic concurrency ----------------------------------------
  - priority: 8
    category: concurrency
    check: "expected_listing_version equals Listing.version; checked before any bid amount, window or credit check so a stale reader is told to re-read rather than told its price is wrong"
    error_id: ERR_STALE_LISTING_VERSION
    http_status: 412
    applies_to: "POST /liquidation/listings/{id}/proxy-bids"
  - priority: 8
    category: concurrency
    check: "expected_negotiation_version equals Negotiation.version"
    error_id: ERR_STALE_NEGOTIATION_VERSION
    http_status: 412
    applies_to: "POST /liquidation/negotiations/{id}/counter-offers"

  # --- band 9: state of the target resource -----------------------------------
  - priority: 9
    category: state
    check: "Lot.lot_status is a legal from-state for the requested transition (DRAFT for manifest submission; MANIFEST_IN_REVIEW for manifest review; DRAFT or MANIFEST_REJECTED for manifest line add/void)"
    error_id: ERR_LOT_STATE_INVALID
    http_status: 409
    applies_to: "POST /liquidation/lots/{id}/manifest-submissions, POST /liquidation/lots/{id}/manifest-reviews, POST /liquidation/lots/{id}/manifest-lines, POST /liquidation/manifest-lines/{id}/voids"
  - priority: 9
    category: state
    check: "Listing.listing_status is a legal from-state (DRAFT to publish; OPEN to bid, offer or close)"
    error_id: ERR_LISTING_STATE_INVALID
    http_status: 409
    applies_to: "POST /liquidation/listings/{id}/publications, POST /liquidation/listings/{id}/bids, POST /liquidation/listings/{id}/proxy-bids, POST /liquidation/listings/{id}/negotiations, POST /liquidation/listings/{id}/closures"
  - priority: 9
    category: state
    check: "Negotiation.negotiation_status is AWAITING_SELLER or AWAITING_BUYER, and the acting side is the awaited side"
    error_id: "ERR_NEGOTIATION_STATE_INVALID | ERR_NOT_YOUR_TURN"
    http_status: 409
    applies_to: "POST /liquidation/negotiations/{id}/counter-offers, POST /liquidation/negotiations/{id}/acceptances"
  - priority: 9
    category: state
    check: "SaleOrder.payment_status permits the write (UNPAID or PARTIALLY_PAID to accept a payment)"
    error_id: ERR_ORDER_PAYMENT_STATE_INVALID
    http_status: 409
    applies_to: "POST /liquidation/sale-orders/{id}/payments"
  - priority: 9
    category: state
    check: "SaleOrder.logistics_status is AWAITING_APPOINTMENT when scheduling a pickup"
    error_id: ERR_ORDER_LOGISTICS_STATE_INVALID
    http_status: 409
    applies_to: "POST /liquidation/sale-orders/{id}/pickup-appointments"
  - priority: 9
    category: state
    check: "PickupAppointment.appointment_status is SCHEDULED"
    error_id: ERR_APPOINTMENT_STATE_INVALID
    http_status: 409
    applies_to: "POST /liquidation/pickup-appointments/{id}/completions, POST /liquidation/pickup-appointments/{id}/cancellations"
  - priority: 9
    category: state
    check: "Claim.claim_status is a legal from-state (UNDER_REVIEW to decide; SUBMITTED or EVIDENCE_REQUESTED to add evidence; APPROVED or PARTIALLY_APPROVED to reverse)"
    error_id: ERR_CLAIM_STATE_INVALID
    http_status: 409
    applies_to: "POST /liquidation/claims/{id}/decisions, POST /liquidation/claims/{id}/evidence-items, POST /liquidation/claims/{id}/reversals"
  - priority: 9
    category: state
    check: "BuyerAccount.qualification_status is a legal from-state for the requested decision (PENDING for QUALIFY/REJECT, QUALIFIED for SUSPEND, SUSPENDED for QUALIFY); REJECTED is terminal"
    error_id: ERR_BUYER_QUALIFICATION_STATE_INVALID
    http_status: 409
    applies_to: "POST /liquidation/buyer-accounts/{id}/qualification-decisions"

  # --- band 10: state of a DIFFERENT entity (cross-entity guards) -------------
  - priority: 10
    category: state
    check: "the listing's Lot.lot_status is MANIFEST_APPROVED or RELIST_PENDING; a lot still in DRAFT, MANIFEST_IN_REVIEW or MANIFEST_REJECTED cannot back an open listing"
    error_id: ERR_LOT_MANIFEST_NOT_APPROVED
    http_status: 409
    applies_to: "POST /liquidation/listings/{id}/publications"
  - priority: 10
    category: state
    check: "SellerAccount.account_status is ACTIVE; a seller on MANIFEST_PROBATION cannot publish"
    error_id: ERR_SELLER_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /liquidation/listings/{id}/publications"
  - priority: 10
    category: state
    check: "BuyerAccount.qualification_status is QUALIFIED; PENDING, REJECTED and SUSPENDED buyers cannot commit to buy"
    error_id: ERR_BUYER_NOT_QUALIFIED
    http_status: 409
    applies_to: "POST /liquidation/listings/{id}/bids, POST /liquidation/listings/{id}/proxy-bids, POST /liquidation/listings/{id}/negotiations, POST /liquidation/negotiations/{id}/counter-offers"
  - priority: 10
    category: state
    check: "SaleOrder.payment_status is PAID before a dock appointment may be scheduled; the logistics dimension is gated on the payment dimension in this one direction only"
    error_id: ERR_ORDER_NOT_PAID
    http_status: 409
    applies_to: "POST /liquidation/sale-orders/{id}/pickup-appointments"
  - priority: 10
    category: state
    check: "SaleOrder.logistics_status is not ABANDONED when a payment is attempted; the money dimension is gated on the freight dimension in this one direction only"
    error_id: ERR_PAYMENT_WINDOW_CLOSED
    http_status: 409
    applies_to: "POST /liquidation/sale-orders/{id}/payments"
  - priority: 10
    category: state
    check: "SaleOrder.logistics_status is PICKED_UP before a claim may be filed, and the referenced ManifestLine.line_status is ACTIVE"
    error_id: "ERR_ORDER_LOGISTICS_STATE_INVALID | ERR_LINE_VOIDED"
    http_status: 409
    applies_to: "POST /liquidation/sale-orders/{id}/claims"

  # --- band 11: brand-protection and geographic safety ------------------------
  - priority: 11
    category: business_safety
    check: "Listing.resale_channel appears in the lot's BrandPolicy.permitted_channels"
    error_id: ERR_CHANNEL_NOT_PERMITTED
    http_status: 422
    applies_to: "POST /liquidation/listings/{id}/publications"
  - priority: 11
    category: business_safety
    check: "Listing.de_branding_attested is true whenever Lot.de_branding_required is true"
    error_id: ERR_DEBRANDING_ATTESTATION_REQUIRED
    http_status: 422
    applies_to: "POST /liquidation/listings/{id}/publications"
  - priority: 11
    category: business_safety
    check: "BuyerAccount.state_code is absent from the lot's BrandPolicy.prohibited_buyer_state_codes; enforced on every buy-side commitment and again at auction close for the prospective winner"
    error_id: ERR_BUYER_STATE_PROHIBITED
    http_status: 422
    applies_to: "POST /liquidation/listings/{id}/bids, POST /liquidation/listings/{id}/proxy-bids, POST /liquidation/listings/{id}/negotiations, POST /liquidation/negotiations/{id}/counter-offers"
  - priority: 11
    category: business_safety
    check: "anti-shill control: BuyerAccount.tax_id differs from the lot's SellerAccount.tax_id, so a seller may not bid on its own inventory through an affiliated buyer account"
    error_id: ERR_SHILL_BIDDING_PROHIBITED
    http_status: 422
    applies_to: "POST /liquidation/listings/{id}/bids, POST /liquidation/listings/{id}/proxy-bids, POST /liquidation/listings/{id}/negotiations"

  # --- band 12: temporal windows and deadlines --------------------------------
  - priority: 12
    category: business_temporal
    check: "the offering window is open: window_start_at <= current logical clock < effective_close_at"
    error_id: "ERR_LISTING_WINDOW_NOT_OPEN | ERR_LISTING_WINDOW_CLOSED"
    http_status: 422
    applies_to: "POST /liquidation/listings/{id}/bids, POST /liquidation/listings/{id}/proxy-bids, POST /liquidation/listings/{id}/negotiations"
  - priority: 12
    category: business_temporal
    check: "the auction has reached its effective close: current logical clock >= Listing.effective_close_at"
    error_id: ERR_AUCTION_NOT_CLOSABLE
    http_status: 422
    applies_to: "POST /liquidation/listings/{id}/closures"
  - priority: 12
    category: business_temporal
    check: "the standing offer has not lapsed: current logical clock < Negotiation.current_offer_expires_at"
    error_id: ERR_OFFER_EXPIRED
    http_status: 422
    applies_to: "POST /liquidation/negotiations/{id}/counter-offers, POST /liquidation/negotiations/{id}/acceptances"
  - priority: 12
    category: business_temporal
    check: "the requested dock window ends at or before SaleOrder.pickup_deadline_at; checked BEFORE the dock-door selector runs, so a hopeless request is rejected on time rather than on capacity"
    error_id: ERR_PICKUP_DEADLINE_PASSED
    http_status: 422
    applies_to: "POST /liquidation/sale-orders/{id}/pickup-appointments"
  - priority: 12
    category: business_temporal
    check: "the appointment window has started: current logical clock >= PickupAppointment.window_start_at"
    error_id: ERR_APPOINTMENT_NOT_STARTED
    http_status: 422
    applies_to: "POST /liquidation/pickup-appointments/{id}/completions"
  - priority: 12
    category: business_temporal
    check: "the claim window is open: current logical clock <= SaleOrder.claim_window_closes_at"
    error_id: ERR_CLAIM_WINDOW_CLOSED
    http_status: 422
    applies_to: "POST /liquidation/sale-orders/{id}/claims"
  - priority: 12
    category: business_temporal
    check: "the buyer's resale certificate has not lapsed: resale_certificate_expires_on > the UTC calendar date of the current logical clock"
    error_id: ERR_RESALE_CERTIFICATE_EXPIRED
    http_status: 422
    applies_to: "POST /liquidation/buyer-accounts/{id}/qualification-decisions with decision QUALIFY"
  - priority: 12
    category: business_temporal
    check: "the publication window does not intersect the lot's BrandPolicy embargo interval [embargo_start_at, embargo_end_at], both ends inclusive"
    error_id: ERR_BRAND_EMBARGO_ACTIVE
    http_status: 422
    applies_to: "POST /liquidation/listings/{id}/publications"

  # --- band 13: dock interval capacity ----------------------------------------
  - priority: 13
    category: business_constraint
    check: "calculations.dock_door_assignment finds at least one door whose SCHEDULED occupations do not conflict with the requested window under the warehouse turnaround buffer"
    error_id: ERR_DOCK_CAPACITY_EXHAUSTED
    http_status: 422
    applies_to: "POST /liquidation/sale-orders/{id}/pickup-appointments"

  # --- band 14: carrier daily aggregate capacity ------------------------------
  - priority: 14
    category: business_constraint
    check: "the carrier holds fewer than Carrier.daily_pickup_capacity SCHEDULED appointments whose window_start_at falls on the same UTC calendar date; evaluated after a door has been found so a request that fails both reports the dock error"
    error_id: ERR_CARRIER_DAY_CAPACITY_FULL
    http_status: 422
    applies_to: "POST /liquidation/sale-orders/{id}/pickup-appointments"

  # --- band 15: remaining structural constraints ------------------------------
  - priority: 15
    category: business_constraint
    check: "the lot has at least one ManifestLine with line_status == ACTIVE (zero-count boundary)"
    error_id: ERR_MANIFEST_EMPTY
    http_status: 422
    applies_to: "POST /liquidation/lots/{id}/manifest-submissions"
  - priority: 15
    category: business_constraint
    check: "no other Listing on the same lot has listing_status == OPEN"
    error_id: ERR_LISTING_ALREADY_OPEN
    http_status: 422
    applies_to: "POST /liquidation/listings/{id}/publications"
  - priority: 15
    category: business_constraint
    check: "the buyer has no other Negotiation on this listing with negotiation_status IN {AWAITING_SELLER, AWAITING_BUYER}"
    error_id: ERR_DUPLICATE_NEGOTIATION
    http_status: 422
    applies_to: "POST /liquidation/listings/{id}/negotiations"
  - priority: 15
    category: business_constraint
    check: "round_number + 1 <= MAX_NEGOTIATION_ROUNDS (4)"
    error_id: ERR_NEGOTIATION_ROUND_LIMIT
    http_status: 422
    applies_to: "POST /liquidation/negotiations/{id}/counter-offers"
  - priority: 15
    category: business_constraint
    check: "Claim.evidence_request_count < MAX_EVIDENCE_REQUESTS (2) when the decision is REQUEST_EVIDENCE"
    error_id: ERR_EVIDENCE_REQUEST_LIMIT
    http_status: 422
    applies_to: "POST /liquidation/claims/{id}/decisions"
  - priority: 15
    category: business_constraint
    check: "Claim.evidence_item_count >= MIN_EVIDENCE_ITEMS (2) before a decision other than REQUEST_EVIDENCE may be made"
    error_id: ERR_EVIDENCE_INSUFFICIENT
    http_status: 422
    applies_to: "POST /liquidation/claims/{id}/decisions"
  - priority: 15
    category: business_constraint
    check: "verified_units is consistent with the decision: == claimed_units for APPROVE, strictly between 0 and claimed_units for PARTIALLY_APPROVE, == 0 for DENY"
    error_id: ERR_VERIFIED_UNITS_MISMATCH
    http_status: 422
    applies_to: "POST /liquidation/claims/{id}/decisions"
  - priority: 15
    category: business_constraint
    check: "claimed_units <= ManifestLine.unit_count and the line's lot_id equals the order's lot"
    error_id: "ERR_CLAIMED_UNITS_EXCEED_LINE | ERR_LINE_NOT_ON_ORDER_LOT"
    http_status: 422
    applies_to: "POST /liquidation/sale-orders/{id}/claims"
  - priority: 15
    category: business_constraint
    check: "PickupAppointment.warehouse_id equals the lot's warehouse_id"
    error_id: ERR_WAREHOUSE_MISMATCH
    http_status: 422
    applies_to: "POST /liquidation/sale-orders/{id}/pickup-appointments"
  - priority: 15
    category: business_constraint
    check: "the qualification request carries business_verified == true when the decision is QUALIFY"
    error_id: ERR_BUSINESS_NOT_VERIFIED
    http_status: 422
    applies_to: "POST /liquidation/buyer-accounts/{id}/qualification-decisions"
  - priority: 15
    category: business_constraint
    check: "tax_id is unique across SellerAccount, tax_id is unique across BuyerAccount, and scac_code is unique across Carrier"
    error_id: "ERR_DUPLICATE_TAX_ID | ERR_DUPLICATE_SCAC"
    http_status: 422
    applies_to: "POST /liquidation/seller-accounts, POST /liquidation/buyer-accounts, POST /liquidation/carriers"

  # --- band 16: money -------------------------------------------------------
  - priority: 16
    category: business_fiscal
    check: "reserve_price_cents >= opening_bid_cents when both are supplied on an AUCTION listing"
    error_id: ERR_RESERVE_BELOW_OPENING
    http_status: 422
    applies_to: "POST /liquidation/lots/{id}/listings"
  - priority: 16
    category: business_fiscal
    check: "amount_cents >= Listing.min_next_bid_cents, which is opening_bid_cents on an empty listing and current_high_bid_cents + bid_increment_cents otherwise (inclusive comparison)"
    error_id: ERR_BID_BELOW_MINIMUM
    http_status: 422
    applies_to: "POST /liquidation/listings/{id}/bids on an AUCTION listing"
  - priority: 16
    category: business_fiscal
    check: "max_amount_cents >= Listing.min_next_bid_cents"
    error_id: ERR_PROXY_MAX_BELOW_MINIMUM
    http_status: 422
    applies_to: "POST /liquidation/listings/{id}/proxy-bids"
  - priority: 16
    category: business_fiscal
    check: "amount_cents == Listing.ask_price_cents exactly on a FIXED_PRICE listing"
    error_id: ERR_FIXED_PRICE_MISMATCH
    http_status: 422
    applies_to: "POST /liquidation/listings/{id}/bids on a FIXED_PRICE listing"
  - priority: 16
    category: business_fiscal
    check: "opening_offer_cents >= Listing.min_offer_cents, and a counter-offer is >= min_offer_cents"
    error_id: ERR_OFFER_BELOW_MINIMUM
    http_status: 422
    applies_to: "POST /liquidation/listings/{id}/negotiations, POST /liquidation/negotiations/{id}/counter-offers"
  - priority: 16
    category: business_fiscal
    check: "the exposure the request would create is <= approved_credit_limit_cents + wallet_credit_cents (inclusive); see calculations.buyer_exposure"
    error_id: ERR_CREDIT_LIMIT_EXCEEDED
    http_status: 422
    applies_to: "POST /liquidation/listings/{id}/bids, POST /liquidation/listings/{id}/proxy-bids, POST /liquidation/listings/{id}/negotiations"
  - priority: 16
    category: business_fiscal
    check: "1 <= amount_cents <= SaleOrder.balance_due_cents"
    error_id: ERR_PAYMENT_EXCEEDS_BALANCE
    http_status: 422
    applies_to: "POST /liquidation/sale-orders/{id}/payments"

# =============================================================================
# §1.5 API Endpoint Table
# Every path is prefixed with the api_prefix "/liquidation"; the single
# test-driving endpoint lives under the /_ namespace.
# The primary path parameter is spelled {id} on every endpoint.
# =============================================================================
endpoints:

  # ---------- reference data (PlatformAdmin) ----------------------------------
  - method: POST
    path: "/liquidation/seller-accounts"
    description: "Register a liquidating seller. Starts ACTIVE on TIER_STANDARD with 2000 bps and manifest_accuracy_avg 1.000."
    roles: [PlatformAdmin]
    code: 201
    input: [legal_name, tax_id, state_code, contact_email]
    output: SellerAccount
    side_effects:
      - "initialises account_status ACTIVE, commission_tier TIER_STANDARD, commission_rate_bps 2000, all recovery aggregates 0 and manifest_accuracy_avg 1.000"
      - "rejects a tax_id already held by another SellerAccount with ERR_DUPLICATE_TAX_ID"

  - method: GET
    path: "/liquidation/seller-accounts/{id}"
    description: "Read one seller account including its live recovery aggregates and commission tier."
    roles: [PlatformAdmin, MarketplaceOps, SellerOps, TrustSafety]
    code: 200
    input: []
    output: SellerAccount
    side_effects: []

  - method: GET
    path: "/liquidation/seller-accounts"
    description: "List seller accounts, optionally filtered by account_status or commission_tier."
    roles: [PlatformAdmin, MarketplaceOps, TrustSafety]
    code: 200
    input: ["account_status?", "commission_tier?", "limit?", "offset?"]
    output: SellerAccount[]
    side_effects: []

  - method: POST
    path: "/liquidation/buyer-accounts"
    description: "Register a resale buyer. Starts PENDING and UNVERIFIED with a zero credit limit; a buyer in PENDING cannot bid, offer or purchase."
    roles: [PlatformAdmin]
    code: 201
    input: ["legal_name", "tax_id", "state_code", "contact_email", "resale_certificate_number?", "resale_certificate_expires_on?", "requested_credit_limit_cents?"]
    output: BuyerAccount
    side_effects:
      - "initialises qualification_status PENDING, business_verification_status UNVERIFIED, approved_credit_limit_cents 0, outstanding_exposure_cents 0, wallet_credit_cents 0"
      - "rejects a tax_id already held by another BuyerAccount with ERR_DUPLICATE_TAX_ID"

  - method: GET
    path: "/liquidation/buyer-accounts/{id}"
    description: "Read one buyer account including qualification_status, outstanding_exposure_cents and wallet_credit_cents."
    roles: [PlatformAdmin, MarketplaceOps, TrustSafety, Buyer]
    code: 200
    input: []
    output: BuyerAccount
    side_effects: []

  - method: GET
    path: "/liquidation/buyer-accounts"
    description: "List buyer accounts, optionally filtered by qualification_status or state_code."
    roles: [PlatformAdmin, MarketplaceOps, TrustSafety]
    code: 200
    input: ["qualification_status?", "state_code?", "limit?", "offset?"]
    output: BuyerAccount[]
    side_effects: []

  - method: POST
    path: "/liquidation/buyer-accounts/{id}/qualification-decisions"
    description: "TrustSafety qualifies, rejects, suspends or reinstates a buyer. QUALIFY requires business_verified true and an unexpired resale certificate."
    roles: [TrustSafety]
    code: 200
    input: ["decision", "business_verified?", "approved_credit_limit_cents?"]
    output: BuyerAccount
    side_effects:
      - "drives the BuyerAccount qualification machine (PENDING -> QUALIFIED | REJECTED, QUALIFIED -> SUSPENDED, SUSPENDED -> QUALIFIED)"
      - "sets business_verification_status from business_verified, and approved_credit_limit_cents when supplied"
      - "increments BuyerAccount.version by 1"

  - method: POST
    path: "/liquidation/buyer-accounts/{id}/credit-limits"
    description: "PlatformAdmin sets the buyer's approved credit ceiling. Used to raise or lower headroom independently of qualification."
