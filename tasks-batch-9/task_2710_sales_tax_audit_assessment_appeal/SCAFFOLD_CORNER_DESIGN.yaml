        claim_type: immediate
        grounds: [complexity_profile.consistency_model, response_envelope.success, state_machines.Audit.transitions.SCOPED_to_FIELDWORK, "state_machines.Audit.transitions.REVIEW_COMPLETE_to_ASSESSED"]
        distinguishing_aspect: |
          The declared model is immediate, so no derived field is allowed to lag one
          request behind. Two cascades prove it: the taxpayer's own agree response
          already carries the agreement as AGREED, and the very next read of the audit
          — with no intervening write — shows FIELDWORK with agreed_agreement_id set;
          and the supervisor's issue response already carries protest_deadline_date
          and collection_status DUE, with the audit already ASSESSED in the same
          request. An implementation that recomputes derived fields on the NEXT read
          would show SCOPED or a null deadline here.
