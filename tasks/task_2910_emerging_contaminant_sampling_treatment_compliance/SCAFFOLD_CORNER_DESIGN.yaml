              captures: { e_media: "$.data.error_id" }
            - call: "POST /residuals-manifests"
              payload: { pilot_test_id: "${gac_id}", media_type: "GAC_CARBON", mass_kg: 900.00 }
              as: TreatmentEngineer
              captures: { e_mass: "$.data.error_id" }
            - call: "POST /residuals-manifests"
              payload: { pilot_test_id: "${gac_id}", media_type: "GAC_CARBON", mass_kg: 800.00 }
              as: TreatmentEngineer
              captures: { m_id: "$.data.id" }
            - call: "POST /residuals-manifests/${m_id}/ship"
