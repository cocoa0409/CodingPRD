# =============================================================================
# PRD Benchmark Seed Tables — task_3371
# Nonprofit Data Transparency Profiles & Filing Data Extraction (Candid)
# =============================================================================

scenario: |
  Nonprofit Data Transparency Profiles & Filing Data Extraction (Candid): nonprofit
  profile creation where organizations self-report programs, finances, leadership and
  demographics with verification levels, annual information return data extraction from
  public filings with normalization across form versions and schedules, transparency seal
  levels awarded for progressive disclosure with annual renewal requirements, grant data
  collection from funders with recipient matching and taxonomy coding of subject areas,
  data licensing to funders, researchers and platforms with permitted-use restrictions,
  organization identity resolution across name changes, mergers and dissolutions, funder
  research tools with prospect matching and historical giving patterns, data correction
  requests from organizations.

domain_name: nonprofit-data-transparency
api_prefix: /nonprofits

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: workflow_orchestration
  complexity_layers:
    - cascading_side_effects
    - version_pinning_on_approval
    - scheduled_deferred_actions
    - derived_field_reconciliation
    - rate_threshold_triggers
    - optimistic_concurrency
  entity_topology: graph
  state_machine_shape: cyclic
  relationship_patterns:
    - one_to_many
    - many_to_many
    - self_referential
    - polymorphic
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — EMIT VERBATIM)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Organization
    parent: null
    common_fields: true
    fields:
      - { name: legal_name, type: string, source: input, description: "Registered legal name of the nonprofit" }
      - { name: display_name, type: string, source: input, description: "Public-facing name", required: false }
      - { name: former_legal_names, type: array, source: computed, default: [], description: "Prior legal names, appended in the order NAME_CHANGE identity cases were finalized" }
      - { name: ein, type: string, source: input, description: "Nine-digit Employer Identification Number; globally unique across Organization rows" }
      - { name: org_type, type: enum, source: input, description: "501C3 | 501C4 | 501C6 | 501C7 | 527 | OTHER" }
      - { name: state_code, type: string, source: input, description: "Two-letter US state of incorporation" }
      - { name: ntee_code, type: string, source: input, description: "NTEE subject-area taxonomy code", required: false }
      - { name: ntee_code_verified, type: boolean, source: system, default: false, description: "Set true only by PlatformVerifier confirmation of the taxonomy code" }
      - { name: mission_statement, type: string, source: input, description: "Free-text mission statement", required: false }
      - { name: profile_status, type: enum, source: system, description: "DRAFT | ACTIVE | SUSPENDED | MERGED | DISSOLVED" }
      - { name: verification_level, type: enum, source: system, description: "SELF_REPORTED | DOCUMENT_VERIFIED | INDEPENDENTLY_AUDITED — monotone, never decreases" }
      - { name: verification_evidence_count, type: integer, source: computed, default: 0, description: "Count of accepted verification evidence submissions" }
      - { name: transparency_seal_level, type: enum, source: computed, description: "NONE | BRONZE | SILVER | GOLD | PLATINUM — mirrors the level of the ACTIVE TransparencySeal, NONE when no ACTIVE seal exists" }
      - { name: seal_expires_on, type: datetime, source: computed, description: "expires_on of the ACTIVE TransparencySeal; null when no ACTIVE seal exists", required: false }
      - { name: provisional_completeness_score, type: integer, source: computed, description: "0..100 self-reported completeness (calculation provisional_completeness_score)" }
      - { name: verified_completeness_score, type: integer, source: computed, description: "0..100 evidence-backed completeness (calculation verified_completeness_score)" }
      - { name: profile_completeness_score, type: integer, source: computed, description: "Published score: verified_completeness_score when verification_level IN {DOCUMENT_VERIFIED, INDEPENDENTLY_AUDITED}, else provisional_completeness_score" }
      - { name: disclosure_pct, type: number, source: computed, description: "Weighted public-disclosure fraction, 4 decimal places (calculation disclosure_pct)" }
      - { name: total_revenue_cents, type: integer, source: computed, default: 0, description: "Sum of total_revenue_cents over the single non-superseded NORMALIZED filing of each tax_year (calculation organization_total_revenue_cents)" }
      - { name: latest_filing_tax_year, type: integer, source: computed, description: "Greatest tax_year among NORMALIZED filings; null when none", required: false }
      - { name: distinct_funder_count, type: integer, source: computed, default: 0, description: "Count of distinct funder_organization_id over Grants with status RECORDED" }
      - { name: active_license_count, type: integer, source: computed, default: 0, description: "Count of DataLicense rows in ACTIVE status where licensee_organization_id == this organization" }
      - { name: open_correction_count, type: integer, source: computed, default: 0, description: "Count of CorrectionRequest rows in status SUBMITTED or UNDER_REVIEW" }
      - { name: last_profile_editor_user_id, type: string, source: system, description: "X-User-ID of the actor that created or last patched this profile; the segregation-of-duties gate on POST /nonprofits/organizations/{id}/verify" }
      - { name: successor_organization_id, type: string, source: computed, description: "FK -> Organization.id; set to the surviving organization when a MERGE case is finalized, null otherwise", required: false }
      - { name: dissolution_date, type: datetime, source: input, description: "Declared dissolution date, set when a DISSOLUTION case is finalized", required: false }

  - name: Program
    parent: Organization
    common_fields: true
    fields:
      - { name: organization_id, type: string, source: system, description: "FK -> Organization.id; owning organization" }
      - { name: program_name, type: string, source: input, description: "Name of the self-reported program" }
      - { name: subject_code, type: string, source: input, description: "Taxonomy subject code for the program", required: false }
      - { name: population_served, type: string, source: input, description: "Free-text description of the population served", required: false }
      - { name: disclosure_level, type: enum, source: input, default: "RESTRICTED", description: "PUBLIC | RESTRICTED | WITHHELD" }
      - { name: is_verified, type: boolean, source: system, default: false, description: "Set true when PlatformVerifier confirms the program record" }
      - { name: status, type: enum, source: system, description: "ACTIVE — set at creation; a Program row is never archived in this version, so ACTIVE is the only member this field can hold" }
      - { name: fiscal_year, type: integer, source: input, description: "Fiscal year the program record describes" }

  - name: Filing
    parent: Organization
    common_fields: true
    fields:
      - { name: organization_id, type: string, source: system, description: "FK -> Organization.id; filing organization" }
      - { name: form_type, type: enum, source: input, description: "FORM_990 | FORM_990_EZ | FORM_990_PF" }
      - { name: form_version_year, type: integer, source: input, description: "Tax-form version the raw document was printed from; one of 2019, 2020, 2021, 2022, 2023, 2024" }
      - { name: tax_year, type: integer, source: input, description: "Fiscal year the return covers" }
      - { name: revision_number, type: integer, source: system, default: 1, description: "Monotone per (organization_id, tax_year, form_type); a later create supersedes the prior revision" }
      - { name: superseded_by_revision_number, type: integer, source: system, description: "revision_number of the filing that superseded this one; null when not superseded", required: false }
      - { name: pre_supersede_status, type: enum, source: system, description: "Status this filing held immediately before supersession; restored verbatim when the superseding revision is voided", required: false }
      - { name: coverage_start, type: datetime, source: input, description: "First day of the covered fiscal period" }
      - { name: coverage_end, type: datetime, source: input, description: "Last day of the covered fiscal period" }
      - { name: source, type: enum, source: input, description: "IRS_BULK_XML | ORG_UPLOAD | MANUAL_ENTRY" }
      - { name: status, type: enum, source: system, description: "RECEIVED | EXTRACTED | EXTRACTION_FAILED | NORMALIZED | DISPUTED | SUPERSEDED | VOIDED" }
      - { name: extracted_field_count, type: integer, source: computed, default: 0, description: "Count of ExtractedField rows whose filing_id == this filing" }
      - { name: total_revenue_cents, type: integer, source: computed, default: 0, description: "Per-field-rounded sum over revenue-component ExtractedFields (calculation filing_total_revenue_normalized_cents)" }
      - { name: extraction_confidence_pct, type: number, source: computed, description: "Mean confidence_pct over ExtractedField rows; null when none", required: false }
      - { name: is_verified, type: boolean, source: system, default: false, description: "Set true by PlatformVerifier confirmation of the normalized return" }

  - name: ExtractedField
    parent: Filing
    common_fields: true
    fields:
      - { name: filing_id, type: string, source: system, description: "FK -> Filing.id; owning filing" }
      - { name: line_code, type: string, source: input, description: "Form line code, e.g. TOTREV, PROGREV, CONTRIB, SALARIES; membership is version-dependent (FORM_VERSION_LINE_MAP)" }
      - { name: raw_value, type: string, source: input, description: "Verbatim decimal string as printed on the return" }
      - { name: raw_format, type: enum, source: input, description: "USD_WHOLE | USD_THOUSANDS | USD_MILLIONS | PLAIN_INTEGER" }
      - { name: schedule_code, type: string, source: input, description: "Schedule the line came from: SCHEDULE_A | SCHEDULE_O | SCHEDULE_I; null for core-form lines", required: false }
      - { name: is_revenue_component, type: boolean, source: input, default: false, description: "True when the line contributes to Filing.total_revenue_cents" }
      - { name: normalized_value_cents, type: integer, source: computed, description: "Per-field rounded cent value (calculation extract_field_normalization)" }
      - { name: normalization_status, type: enum, source: system, description: "PENDING | NORMALIZED | CORRECTED | CONFLICT" }
      - { name: is_verified, type: boolean, source: system, default: false, description: "Set true when the normalized value is backed by an accepted correction or verifier confirmation" }
      - { name: correction_count, type: integer, source: computed, default: 0, description: "Count of CorrectionRequest rows whose target_extracted_field_id == this field" }
      - { name: confidence_pct, type: number, source: computed, description: "Extraction confidence for this line: 99.0 for USD_WHOLE and PLAIN_INTEGER, 92.0 for USD_THOUSANDS, 85.0 for USD_MILLIONS" }

  - name: LeadershipMember
    parent: Organization
    common_fields: true
    fields:
      - { name: organization_id, type: string, source: system, description: "FK -> Organization.id; employing organization" }
      - { name: full_name, type: string, source: input, description: "Full name of the leader" }
      - { name: office_title, type: string, source: input, description: "Office held, e.g. Executive Director, Board Chair, Treasurer" }
      - { name: is_officer, type: boolean, source: input, default: true, description: "True when the person is a voting officer" }
      - { name: is_independent, type: boolean, source: input, default: false, description: "True when the person is an independent voting board member" }
      - { name: is_verified, type: boolean, source: system, default: false, description: "Set true when PlatformVerifier confirms the leadership record" }
      - { name: disclosure_level, type: enum, source: input, default: "RESTRICTED", description: "PUBLIC | RESTRICTED | WITHHELD — whether the officer's name is published" }
      - { name: compensation_cents, type: integer, source: input, default: 0, description: "Reported annual compensation in cents", required: false }
      - { name: service_start, type: datetime, source: input, description: "First day of the service interval (inclusive)" }
      - { name: service_end, type: datetime, source: input, description: "Last day of the service interval (inclusive); null means the term is open-ended", required: false }
      - { name: status, type: enum, source: system, description: "ACTIVE | ENDED" }

  - name: DemographicRecord
    parent: Organization
    common_fields: true
    fields:
      - { name: organization_id, type: string, source: system, description: "FK -> Organization.id; reporting organization" }
      - { name: category, type: enum, source: input, description: "RACE_ETHNICITY | GENDER_IDENTITY | AGE_BAND | LGBTQIA | DISABILITY | VETERAN" }
      - { name: value_code, type: string, source: input, description: "Code within the category, e.g. BLACK_AFRICAN_AMERICAN, WOMAN, AGE_35_44" }
      - { name: disclosure_level, type: enum, source: input, description: "PUBLIC | RESTRICTED | WITHHELD" }
      - { name: is_verified, type: boolean, source: system, default: false, description: "Set true when the organization supplies supporting evidence" }
      - { name: fiscal_year, type: integer, source: input, description: "Fiscal year the demographic record describes" }

  - name: TransparencySeal
    parent: Organization
    common_fields: true
    fields:
      - { name: organization_id, type: string, source: system, description: "FK -> Organization.id; sealed organization" }
      - { name: level, type: enum, source: system, description: "BRONZE | SILVER | GOLD | PLATINUM — frozen at award, never re-evaluated by renewal" }
      - { name: disclosure_pct_at_award, type: number, source: system, description: "Organization.disclosure_pct captured at the moment of award" }
      - { name: awarded_on, type: datetime, source: system, description: "Logical-clock instant the seal was awarded" }
      - { name: expires_on, type: datetime, source: system, description: "awarded_on + 365 days; advanced by renewal" }
      - { name: renewal_window_opens_on, type: datetime, source: system, description: "expires_on - 60 days" }
      - { name: renewal_attempt_count, type: integer, source: system, default: 0, description: "Incremented by every renewal attempt, successful or rejected" }
      - { name: last_renewal_fee_cents, type: integer, source: system, description: "renewal_fee_cents charged by the most recent successful renewal", required: false }
      - { name: status, type: enum, source: system, description: "ACTIVE | LAPSED | REVOKED" }

  - name: Grant
    parent: Organization
    common_fields: true
    fields:
      - { name: recipient_organization_id, type: string, source: system, description: "FK -> Organization.id; the grantee organization this row hangs off" }
      - { name: funder_organization_id, type: string, source: input, description: "FK -> Organization.id; the foundation or funder that made the grant" }
      - { name: funder_name_raw, type: string, source: input, description: "Funder name exactly as it appeared in the funder's data feed" }
      - { name: recipient_name_raw, type: string, source: input, description: "Grantee name exactly as it appeared in the funder's data feed" }
      - { name: recipient_ein, type: string, source: input, description: "Grantee EIN supplied by the funder when known", required: false }
      - { name: amount_cents, type: integer, source: input, description: "Grant amount in cents" }
      - { name: fiscal_year, type: integer, source: input, description: "Funder fiscal year the grant was paid in" }
      - { name: subject_code, type: string, source: input, description: "Funder-supplied or auto-assigned subject taxonomy code", required: false }
      - { name: taxonomy_source, type: enum, source: system, description: "FUNDER_SUPPLIED | AUTO_CODED | UNCODED" }
      - { name: match_score, type: integer, source: computed, default: 0, description: "0..100 recipient-match score (calculation grant_recipient_match_score)" }
      - { name: recipient_match_status, type: enum, source: computed, description: "UNMATCHED | AMBIGUOUS | MATCHED — derived from match_score by the pinned band rule" }
      - { name: status, type: enum, source: system, description: "RECORDED | VOIDED" }

  - name: DataLicense
    parent: Organization
    common_fields: true
    fields:
      - { name: licensee_organization_id, type: string, source: system, description: "FK -> Organization.id; the funder, researcher or platform holding the license" }
      - { name: tier, type: enum, source: input, description: "RESEARCHER | FUNDER | PLATFORM" }
      - { name: permitted_use, type: enum, source: input, description: "AGGREGATE_RESEARCH | GRANTMAKING_DUE_DILIGENCE | PLATFORM_REDISTRIBUTION | MARKETING_PROSPECTING" }
      - { name: term_start, type: datetime, source: input, description: "First instant of the license term (inclusive)" }
      - { name: term_end, type: datetime, source: input, description: "End instant of the license term (exclusive)" }
      - { name: status, type: enum, source: system, description: "DRAFT | ACTIVE | EXPIRED" }
      - { name: projected_annual_records, type: integer, source: input, default: 0, description: "Licensee's own forecast of records it will read in the term", required: false }
      - { name: included_records, type: integer, source: computed, description: "Records bundled in the tier base fee (calculation license_annual_fee_cents)" }
      - { name: records_accessed, type: integer, source: computed, default: 0, description: "Conserved quantity: sum of record_count over LicenseUsageEvent rows with status POSTED" }
      - { name: overage_records, type: integer, source: computed, default: 0, description: "max(0, records_accessed - included_records)" }
      - { name: projected_annual_fee_cents, type: integer, source: computed, description: "Provisional fee quoted at activation from projected_annual_records" }
      - { name: final_annual_fee_cents, type: integer, source: computed, description: "Final fee from actual records_accessed at read time" }
      - { name: overage_flag, type: boolean, source: computed, default: false, description: "True when records_accessed > included_records" }
      - { name: auto_renew, type: boolean, source: input, default: false, description: "Whether the license renews automatically at term_end" }

  - name: LicenseUsageEvent
    parent: DataLicense
    common_fields: true
    fields:
      - { name: license_id, type: string, source: system, description: "FK -> DataLicense.id; owning license" }
      - { name: dataset_scope, type: enum, source: input, description: "ORGANIZATION_PROFILES | FILING_FINANCIALS | GRANT_HISTORY | LEADERSHIP_COMPENSATION" }
      - { name: record_count, type: integer, source: input, description: "Number of records read by this event; must be >= 1" }
      - { name: purpose_code, type: string, source: input, description: "Free-text purpose code supplied by the licensee" }
      - { name: status, type: enum, source: system, description: "POSTED | VOIDED" }
      - { name: occurred_at, type: datetime, source: system, description: "Logical-clock instant the event was posted" }

  - name: CorrectionRequest
    parent: Organization
    common_fields: true
    fields:
      - { name: organization_id, type: string, source: system, description: "FK -> Organization.id; the organization requesting the correction" }
      - { name: target_extracted_field_id, type: string, source: input, description: "FK -> ExtractedField.id; the extracted line whose value is disputed" }
      - { name: requested_value, type: string, source: input, description: "Corrected value the organization wants recorded" }
      - { name: evidence_url, type: string, source: input, description: "URL of the supporting document" }
      - { name: justification, type: string, source: input, description: "Free-text explanation of the correction" }
      - { name: status, type: enum, source: system, description: "SUBMITTED | UNDER_REVIEW | ACCEPTED | PARTIALLY_ACCEPTED | REJECTED | WITHDRAWN" }
      - { name: submitted_by_user_id, type: string, source: system, description: "X-User-ID of the submitter; the segregation-of-duties gate on POST /nonprofits/correction-requests/{id}/decide" }
      - { name: decided_by_user_id, type: string, source: system, description: "X-User-ID of the deciding verifier; null until decided", required: false }
      - { name: review_note, type: string, source: input, description: "Verifier note attached to the decision", required: false }
      - { name: requested_at, type: datetime, source: system, description: "Logical-clock instant the request was submitted" }
      - { name: decided_at, type: datetime, source: system, description: "Logical-clock instant the request reached a decision", required: false }

  - name: IdentityResolutionCase
    parent: Organization
    common_fields: true
    fields:
      - { name: subject_organization_id, type: string, source: input, description: "FK -> Organization.id; the organization whose identity is being resolved" }
      - { name: surviving_organization_id, type: string, source: input, description: "FK -> Organization.id; the surviving organization for a MERGE case; must be null for DISSOLUTION and NAME_CHANGE", required: false }
      - { name: case_type, type: enum, source: input, description: "MERGE | DISSOLUTION | NAME_CHANGE" }
      - { name: new_legal_name, type: string, source: input, description: "Replacement legal name; required for NAME_CHANGE and forbidden otherwise", required: false }
      - { name: effective_date, type: datetime, source: input, description: "Date the identity change takes legal effect" }
      - { name: status, type: enum, source: system, description: "OPEN | FINALIZED | WITHDRAWN" }
      - { name: resolution_note, type: string, source: input, description: "Free-text case note", required: false }
      - { name: reassigned_grant_count, type: integer, source: computed, default: 0, description: "Count of Grant rows re-pointed to the surviving organization when a MERGE case is finalized" }
      - { name: finalized_at, type: datetime, source: system, description: "Logical-clock instant the case was finalized", required: false }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  # ---------------------------------------------------------------------------
  - entity: Organization
    initial_state: DRAFT
    terminal_states: [MERGED, DISSOLVED]
    dimensions:
      - field: profile_status
        states: [DRAFT, ACTIVE, SUSPENDED, MERGED, DISSOLVED]
      - field: verification_level
        states: [SELF_REPORTED, DOCUMENT_VERIFIED, INDEPENDENTLY_AUDITED]
        note: "Monotone parallel dimension on the same row; never decreases."
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: POST /nonprofits/organizations/{id}/verify
        actor: PlatformVerifier
        preconditions:
          - "X-User-ID must differ from Organization.last_profile_editor_user_id (ERR_SEGREGATION_OF_DUTIES)"
          - "target_level must be exactly the next level above verification_level (ERR_VERIFICATION_STEP_INVALID)"
          - "profile_completeness_score, evaluated BEFORE the transition, must be >= 50 (ERR_PROFILE_INCOMPLETE)"
        side_effects:
          - "verification_level advances one step (SELF_REPORTED -> DOCUMENT_VERIFIED -> INDEPENDENTLY_AUDITED)"
          - "verification_evidence_count += evidence_count"
          - "every Program, LeadershipMember and DemographicRecord row of this organization that existed before the call has is_verified set to true, and Organization.ntee_code_verified is set to true"
          - "profile_completeness_score recomputed under the new verification_level"
          - "increments Organization.version by 1"

      - from: ACTIVE
        to: ACTIVE
        trigger: POST /nonprofits/organizations/{id}/verify
        actor: PlatformVerifier
        preconditions:
          - "X-User-ID must differ from Organization.last_profile_editor_user_id (ERR_SEGREGATION_OF_DUTIES)"
          - "target_level must be exactly the next level above verification_level (ERR_VERIFICATION_STEP_INVALID)"
        side_effects:
          - "verification_level advances one step"
          - "verification_evidence_count += evidence_count"
          - "every Program, LeadershipMember and DemographicRecord row of this organization that existed before the call has is_verified set to true, and Organization.ntee_code_verified is set to true"
          - "profile_completeness_score recomputed under the new verification_level"
          - "increments Organization.version by 1"

      - from: SUSPENDED
        to: ACTIVE
        trigger: POST /nonprofits/organizations/{id}/verify
        actor: PlatformVerifier
        preconditions:
          - "open_correction_count must be < 3 (ERR_ORG_NOT_IN_GOOD_STANDING)"
        side_effects:
          - "profile_status returns to ACTIVE"
          - "increments Organization.version by 1"

      - from: ACTIVE
        to: SUSPENDED
        trigger: "system (automatic when open_correction_count reaches 3)"
        actor: system
        preconditions: []
        side_effects:
          - "Every ACTIVE TransparencySeal whose organization_id == this organization -> REVOKED"
          - "Organization.transparency_seal_level -> NONE, seal_expires_on -> null"
          - "increments Organization.version by 1"

      - from: ACTIVE
        to: MERGED
        trigger: "system (automatic when an IdentityResolutionCase of case_type MERGE with subject_organization_id == this organization is finalized)"
        actor: system
        preconditions:
          - "IdentityResolutionCase.status must be OPEN (ERR_INVALID_STATE)"
          - "surviving_organization_id must differ from subject_organization_id (ERR_IDENTITY_CASE_INVALID)"
          - "the merge must not create a cycle in the successor_organization_id graph (ERR_MERGE_CYCLE_DETECTED)"
        side_effects:
          - "successor_organization_id = IdentityResolutionCase.surviving_organization_id"
          - "Every Grant with recipient_organization_id == this organization is re-pointed to the surviving organization"
          - "Every Grant with funder_organization_id == this organization is re-pointed to the surviving organization"
          - "IdentityResolutionCase.reassigned_grant_count = number of re-pointed Grant rows"
          - "surviving Organization.distinct_funder_count recomputed"
          - "Every DataLicense of this organization in ACTIVE status -> EXPIRED"
          - "Every TransparencySeal of this organization in ACTIVE status -> REVOKED"
          - "increments Organization.version by 1 on both the absorbed and the surviving organization"

      - from: SUSPENDED
        to: MERGED
        trigger: "system (automatic when an IdentityResolutionCase of case_type MERGE with subject_organization_id == this organization is finalized)"
        actor: system
        preconditions:
          - "IdentityResolutionCase.status must be OPEN (ERR_INVALID_STATE)"
          - "surviving_organization_id must differ from subject_organization_id (ERR_IDENTITY_CASE_INVALID)"
        side_effects:
          - "successor_organization_id = IdentityResolutionCase.surviving_organization_id"
          - "Every Grant with recipient_organization_id == this organization is re-pointed to the surviving organization"
          - "Every Grant with funder_organization_id == this organization is re-pointed to the surviving organization"
          - "increments Organization.version by 1 on both the absorbed and the surviving organization"

      - from: ACTIVE
        to: DISSOLVED
        trigger: "system (automatic when an IdentityResolutionCase of case_type DISSOLUTION with subject_organization_id == this organization is finalized)"
        actor: system
        preconditions:
          - "IdentityResolutionCase.status must be OPEN (ERR_INVALID_STATE)"
          - "surviving_organization_id must be null (ERR_IDENTITY_CASE_INVALID)"
        side_effects:
          - "dissolution_date = IdentityResolutionCase.effective_date"
          - "Every TransparencySeal of this organization in ACTIVE status -> REVOKED"
          - "Every DataLicense of this organization in ACTIVE status -> EXPIRED"
          - "increments Organization.version by 1"

      - from: SUSPENDED
        to: DISSOLVED
        trigger: "system (automatic when an IdentityResolutionCase of case_type DISSOLUTION with subject_organization_id == this organization is finalized)"
        actor: system
        preconditions:
          - "IdentityResolutionCase.status must be OPEN (ERR_INVALID_STATE)"
        side_effects:
          - "dissolution_date = IdentityResolutionCase.effective_date"
          - "Every TransparencySeal of this organization in ACTIVE status -> REVOKED"
          - "Every DataLicense of this organization in ACTIVE status -> EXPIRED"
          - "increments Organization.version by 1"

      - from: ACTIVE
        to: ACTIVE
        trigger: "system (NAME_CHANGE identity case finalized: legal_name replaced, former name appended)"
        actor: system
        preconditions:
          - "surviving_organization_id must be null (ERR_IDENTITY_CASE_INVALID)"
          - "new_legal_name must be present and must differ from the current legal_name (ERR_IDENTITY_CASE_INVALID)"
        side_effects:
          - "former_legal_names = former_legal_names + [previous legal_name] (appended in finalization order)"
          - "legal_name = IdentityResolutionCase.new_legal_name"
          - "increments Organization.version by 1"

  # ---------------------------------------------------------------------------
  - entity: Filing
    initial_state: RECEIVED
    terminal_states: [VOIDED]
    transitions:
      - from: RECEIVED
        to: EXTRACTED
        trigger: POST /nonprofits/filings/{id}/extract
        actor: PlatformVerifier
        preconditions:
          - "raw_lines must contain at least one entry (ERR_NO_EXTRACTED_FIELDS)"
          - "every line_code must belong to FORM_VERSION_LINE_MAP[form_version_year] (ERR_UNSUPPORTED_FORM_VERSION)"
        side_effects:
          - "One ExtractedField row created per raw_line, each with normalization_status PENDING"
          - "extracted_field_count = number of created rows"
          - "extraction_confidence_pct = mean of the created rows' confidence_pct"

      - from: EXTRACTION_FAILED
        to: EXTRACTED
        trigger: POST /nonprofits/filings/{id}/extract
        actor: PlatformVerifier
        preconditions:
          - "raw_lines must contain at least one entry (ERR_NO_EXTRACTED_FIELDS)"
          - "every line_code must belong to FORM_VERSION_LINE_MAP[form_version_year] (ERR_UNSUPPORTED_FORM_VERSION)"
        side_effects:
          - "One ExtractedField row created per raw_line, each with normalization_status PENDING"

      - from: RECEIVED
        to: EXTRACTION_FAILED
        trigger: "system (automatic when POST /nonprofits/filings/{id}/extract supplies a non-empty raw_lines array in which no line yields a parseable decimal raw_value)"
        actor: system
        preconditions: []
        side_effects:
          - "extracted_field_count = 0 and extraction_confidence_pct = null"
        note: "An EMPTY raw_lines array is a different outcome: the request is rejected with 422 ERR_NO_EXTRACTED_FIELDS and the filing stays in RECEIVED."

      - from: EXTRACTED
        to: NORMALIZED
        trigger: POST /nonprofits/filings/{id}/normalize
        actor: PlatformVerifier
        preconditions:
          - "the filing must have at least one ExtractedField row (ERR_NO_EXTRACTED_FIELDS)"
        side_effects:
          - "Every ExtractedField of this filing with normalization_status PENDING -> NORMALIZED (or CONFLICT on duplicate line_code)"
          - "total_revenue_cents recomputed (per-field rounding, then integer sum)"
          - "is_verified = true iff extraction_confidence_pct >= 90.0 and extracted_field_count >= 1 and no ExtractedField has normalization_status CONFLICT"
          - "Organization.total_revenue_cents, latest_filing_tax_year, provisional_completeness_score, verified_completeness_score, profile_completeness_score and disclosure_pct recomputed"
          - "if the recomputed profile_completeness_score < 50 and the organization holds an ACTIVE TransparencySeal: that seal -> REVOKED and Organization.transparency_seal_level -> NONE"
          - "increments Filing.version by 1 and Organization.version by 1"

      - from: DISPUTED
        to: NORMALIZED
        trigger: POST /nonprofits/filings/{id}/normalize
        actor: PlatformVerifier
        preconditions:
          - "the filing must have at least one ExtractedField row (ERR_NO_EXTRACTED_FIELDS)"
        side_effects:
          - "Every ExtractedField of this filing with normalization_status PENDING or CONFLICT -> NORMALIZED when its line_code is unique within the filing"
          - "total_revenue_cents recomputed"
          - "Organization aggregates recomputed"
          - "increments Filing.version by 1 and Organization.version by 1"

      - from: NORMALIZED
        to: DISPUTED
        trigger: "system (automatic when a CorrectionRequest against one of this filing's ExtractedFields reaches ACCEPTED or PARTIALLY_ACCEPTED)"
        actor: system
        preconditions: []
        side_effects:
          - "the targeted ExtractedField.normalized_value_cents is replaced by the accepted requested_value and its normalization_status -> CORRECTED"
          - "total_revenue_cents recomputed"
          - "Organization.total_revenue_cents recomputed"
          - "increments Filing.version by 1"

      - from: NORMALIZED
        to: SUPERSEDED
        trigger: "system (automatic when POST /nonprofits/filings creates a higher revision_number for the same organization_id, tax_year and form_type)"
        actor: system
        preconditions: []
        side_effects:
          - "pre_supersede_status = the status this filing held immediately before supersession"
          - "superseded_by_revision_number = the new filing's revision_number"
          - "Organization.total_revenue_cents recomputed over non-superseded filings only"

      - from: DISPUTED
        to: SUPERSEDED
        trigger: "system (automatic when POST /nonprofits/filings creates a higher revision_number for the same organization_id, tax_year and form_type)"
        actor: system
        preconditions: []
        side_effects:
          - "pre_supersede_status = the status this filing held immediately before supersession"
          - "superseded_by_revision_number = the new filing's revision_number"
          - "Organization.total_revenue_cents recomputed over non-superseded filings only"

      - from: SUPERSEDED
        to: NORMALIZED
        trigger: "system (automatic when POST /nonprofits/filings/{id}/void voids the revision that superseded this filing)"
        actor: system
        preconditions:
          - "the voided revision's revision_number must equal this filing's superseded_by_revision_number"
        side_effects:
          - "status = pre_supersede_status (the exact status recorded at supersession)"
          - "superseded_by_revision_number = null and pre_supersede_status = null"
          - "Organization.total_revenue_cents recomputed over non-superseded filings only"

      - from: RECEIVED
        to: VOIDED
        trigger: POST /nonprofits/filings/{id}/void
        actor: PlatformAdmin
        preconditions: []
        side_effects:
          - "Organization.total_revenue_cents recomputed"

      - from: EXTRACTED
        to: VOIDED
        trigger: POST /nonprofits/filings/{id}/void
        actor: PlatformAdmin
        preconditions: []
        side_effects:
          - "Organization.total_revenue_cents recomputed"

      - from: EXTRACTION_FAILED
        to: VOIDED
        trigger: POST /nonprofits/filings/{id}/void
        actor: PlatformAdmin
        preconditions: []
        side_effects:
          - "Organization.total_revenue_cents recomputed"

      - from: NORMALIZED
        to: VOIDED
        trigger: POST /nonprofits/filings/{id}/void
        actor: PlatformAdmin
        preconditions: []
        side_effects:
          - "Organization.total_revenue_cents, latest_filing_tax_year and completeness scores recomputed"

      - from: DISPUTED
        to: VOIDED
        trigger: POST /nonprofits/filings/{id}/void
        actor: PlatformAdmin
        preconditions: []
        side_effects:
          - "Organization.total_revenue_cents, latest_filing_tax_year and completeness scores recomputed"

      - from: SUPERSEDED
        to: VOIDED
        trigger: POST /nonprofits/filings/{id}/void
        actor: PlatformAdmin
        preconditions: []
        side_effects:
          - "the previously superseded revision is restored to its pre_supersede_status"
          - "Organization.total_revenue_cents recomputed"

  # ---------------------------------------------------------------------------
  - entity: ExtractedField
    initial_state: PENDING
    terminal_states: []
    transitions:
      - from: PENDING
        to: NORMALIZED
        trigger: "system (during POST /nonprofits/filings/{id}/normalize, when raw_value parses as a decimal)"
        actor: system
        preconditions: []
        side_effects:
          - "normalized_value_cents computed by extract_field_normalization"

      - from: PENDING
        to: CONFLICT
        trigger: "system (during POST /nonprofits/filings/{id}/normalize, when another ExtractedField of the same filing carries the same line_code)"
        actor: system
        preconditions: []
        side_effects:
          - "normalized_value_cents stays null; the field is excluded from Filing.total_revenue_cents"

      - from: CONFLICT
        to: NORMALIZED
        trigger: "system (during a later POST /nonprofits/filings/{id}/normalize, once the duplicate line_code is no longer duplicated)"
        actor: system
        preconditions: []
        side_effects:
          - "normalized_value_cents computed by extract_field_normalization"

      - from: NORMALIZED
        to: CORRECTED
        trigger: "system (automatic when a CorrectionRequest targeting this field reaches ACCEPTED)"
        actor: system
        preconditions: []
        side_effects:
          - "normalized_value_cents = round_half_up(decimal(requested_value) * unit_multiplier(raw_format) * 100, 0)"
          - "is_verified = true"
          - "correction_count += 1"
          - "Filing.total_revenue_cents recomputed; Filing.status -> DISPUTED"
          - "Organization.total_revenue_cents recomputed"
          - "increments ExtractedField.version by 1"

      - from: CORRECTED
        to: CORRECTED
        trigger: "system (automatic when a further CorrectionRequest targeting this field reaches ACCEPTED)"
        actor: system
        preconditions: []
        side_effects:
          - "normalized_value_cents replaced by the newly accepted value"
          - "correction_count += 1"
          - "Filing.total_revenue_cents and Organization.total_revenue_cents recomputed"
          - "increments ExtractedField.version by 1"

      - from: NORMALIZED
        to: CORRECTED
        trigger: "system (automatic when a CorrectionRequest targeting this field reaches PARTIALLY_ACCEPTED and a corrected_value is supplied)"
        actor: system
        preconditions: []
        side_effects:
          - "normalized_value_cents replaced by the partially accepted value"
          - "correction_count += 1"
          - "Filing.total_revenue_cents and Organization.total_revenue_cents recomputed"

  # ---------------------------------------------------------------------------
  - entity: TransparencySeal
    initial_state: ACTIVE
    terminal_states: [LAPSED, REVOKED]
    transitions:
      - from: ACTIVE
        to: ACTIVE
        trigger: POST /nonprofits/seals/{id}/renew
        actor: PlatformVerifier
        preconditions:
          - "days_late must be <= 90 (ERR_SEAL_LAPSED)"
          - "the owning Organization.profile_status must be ACTIVE (ERR_ORG_NOT_IN_GOOD_STANDING)"
        side_effects:
          - "renewal_attempt_count += 1"
          - "last_renewal_fee_cents = renewal_fee_cents from seal_renewal_fee_cents"
          - "expires_on = renewal instant + 365 days"
          - "renewal_window_opens_on = expires_on - 60 days"
          - "level is NOT re-evaluated and disclosure_pct_at_award is NOT refreshed"
          - "increments TransparencySeal.version by 1"

      - from: ACTIVE
        to: LAPSED
        trigger: "system (automatic when POST /nonprofits/seals/{id}/renew is called with days_late >= 91)"
        actor: system
        preconditions: []
        side_effects:
          - "renewal_attempt_count += 1"
          - "Organization.transparency_seal_level -> NONE and seal_expires_on -> null"
          - "increments TransparencySeal.version by 1 and Organization.version by 1"

      - from: ACTIVE
        to: LAPSED
        trigger: "system (automatic when the logical clock advances past expires_on + 90 days)"
        actor: system
        preconditions: []
        side_effects:
          - "Organization.transparency_seal_level -> NONE and seal_expires_on -> null"

      - from: ACTIVE
        to: REVOKED
        trigger: "system (automatic when the owning Organization transitions to SUSPENDED, MERGED or DISSOLVED, or when Organization.disclosure_pct falls below the disclosure floor of this seal's level)"
        actor: system
        preconditions:
          - "level floors: BRONZE and SILVER require disclosure_pct >= 0.50, GOLD requires >= 0.75, PLATINUM requires >= 0.90"
        side_effects:
          - "Organization.transparency_seal_level -> NONE and seal_expires_on -> null"
          - "increments TransparencySeal.version by 1 and Organization.version by 1"

  # ---------------------------------------------------------------------------
  - entity: DataLicense
    initial_state: DRAFT
    terminal_states: [EXPIRED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: POST /nonprofits/licenses/{id}/activate
        actor: DataConsumer
        preconditions:
          - "the licensee Organization.profile_status must be ACTIVE (ERR_ORG_NOT_IN_GOOD_STANDING)"
          - "permitted_use must be permitted for tier (ERR_PERMITTED_USE_NOT_IN_TIER)"
          - "the term must not overlap an existing non-EXPIRED DataLicense of the same tier for the same licensee (ERR_LICENSE_TERM_OVERLAP)"
          - "projected_annual_records must be >= 1 (ERR_INVALID_REQUEST)"
        side_effects:
          - "included_records, projected_annual_fee_cents and final_annual_fee_cents computed"
          - "increments DataLicense.version by 1 and licensee Organization.version by 1"

      - from: ACTIVE
        to: ACTIVE
        trigger: POST /nonprofits/licenses/{id}/usage-events
        actor: DataConsumer
        preconditions:
          - "record_count must be >= 1 (ERR_INVALID_REQUEST)"
          - "the logical clock must be within [term_start, term_end) (ERR_LICENSE_TERM_CLOSED)"
          - "records_accessed + record_count must not exceed included_records * 4 (ERR_QUOTA_EXCEEDED)"
        side_effects:
          - "one LicenseUsageEvent created with status POSTED"
          - "records_accessed += record_count"
          - "overage_records and final_annual_fee_cents recomputed"
          - "increments DataLicense.version by 1"

      - from: ACTIVE
        to: EXPIRED
        trigger: "system (automatic when the logical clock reaches term_end)"
        actor: system
        preconditions: []
        side_effects:
          - "licensee Organization.active_license_count recomputed"

      - from: ACTIVE
        to: EXPIRED
        trigger: "system (automatic when the licensee organization finalizes a MERGE or DISSOLUTION identity case)"
        actor: system
        preconditions: []
        side_effects:
          - "licensee Organization.active_license_count recomputed"

  # ---------------------------------------------------------------------------
  - entity: CorrectionRequest
    initial_state: SUBMITTED
    terminal_states: [ACCEPTED, PARTIALLY_ACCEPTED, REJECTED, WITHDRAWN]
    transitions:
      - from: SUBMITTED
        to: UNDER_REVIEW
        trigger: "POST /nonprofits/correction-requests/{id}/decide with decision CLAIM"
        actor: PlatformVerifier
        preconditions:
          - "X-User-ID must differ from CorrectionRequest.submitted_by_user_id (ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "decided_by_user_id = X-User-ID"
          - "increments CorrectionRequest.version by 1"

      - from: UNDER_REVIEW
        to: SUBMITTED
        trigger: "POST /nonprofits/correction-requests/{id}/decide with decision RETURN_FOR_INFO"
        actor: PlatformVerifier
        preconditions:
          - "review_note must be non-empty (ERR_INVALID_REQUEST)"
        side_effects:
          - "decided_by_user_id = null"
          - "the request re-enters the SUBMITTED queue; a later CLAIM re-enters review"
          - "increments CorrectionRequest.version by 1"

      - from: UNDER_REVIEW
        to: ACCEPTED
        trigger: "POST /nonprofits/correction-requests/{id}/decide with decision ACCEPT"
        actor: PlatformVerifier
        preconditions:
          - "X-User-ID must differ from CorrectionRequest.submitted_by_user_id (ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "decided_by_user_id = X-User-ID, decided_at = logical clock"
          - "target ExtractedField.normalized_value_cents replaced and normalization_status -> CORRECTED"
          - "Filing.status -> DISPUTED (if it was NORMALIZED)"
          - "Filing.total_revenue_cents, Organization.total_revenue_cents and completeness scores recomputed"
          - "if the organization's open_correction_count reaches 3: Organization.profile_status -> SUSPENDED, its ACTIVE seals -> REVOKED"
          - "increments CorrectionRequest.version by 1 and Organization.version by 1"

      - from: UNDER_REVIEW
        to: PARTIALLY_ACCEPTED
        trigger: "POST /nonprofits/correction-requests/{id}/decide with decision PARTIALLY_ACCEPT"
        actor: PlatformVerifier
        preconditions:
          - "corrected_value must be supplied (ERR_INVALID_REQUEST)"
          - "corrected_value must differ from both the current normalized value and requested_value (ERR_INVALID_REQUEST)"
        side_effects:
          - "target ExtractedField.normalized_value_cents replaced by corrected_value and normalization_status -> CORRECTED"
          - "Filing.status -> DISPUTED (if it was NORMALIZED)"
          - "Organization.total_revenue_cents recomputed"
          - "increments CorrectionRequest.version by 1 and Organization.version by 1"

      - from: UNDER_REVIEW
        to: REJECTED
        trigger: "POST /nonprofits/correction-requests/{id}/decide with decision REJECT"
        actor: PlatformVerifier
        preconditions:
          - "review_note must be non-empty (ERR_INVALID_REQUEST)"
        side_effects:
          - "decided_by_user_id = X-User-ID, decided_at = logical clock"
          - "no ExtractedField is mutated"
          - "increments CorrectionRequest.version by 1"

      - from: SUBMITTED
        to: WITHDRAWN
        trigger: "POST /nonprofits/correction-requests/{id}/decide with decision WITHDRAW"
        actor: OrganizationUser
        preconditions:
          - "X-User-ID must equal CorrectionRequest.submitted_by_user_id (ERR_FORBIDDEN_ROLE)"
        side_effects:
          - "no ExtractedField is mutated"
          - "increments CorrectionRequest.version by 1"

      - from: UNDER_REVIEW
        to: WITHDRAWN
        trigger: "POST /nonprofits/correction-requests/{id}/decide with decision WITHDRAW"
        actor: OrganizationUser
        preconditions:
          - "X-User-ID must equal CorrectionRequest.submitted_by_user_id (ERR_FORBIDDEN_ROLE)"
        side_effects:
          - "no ExtractedField is mutated"
          - "increments CorrectionRequest.version by 1"

  # ---------------------------------------------------------------------------
  - entity: IdentityResolutionCase
    initial_state: OPEN
    terminal_states: [FINALIZED, WITHDRAWN]
    transitions:
      - from: OPEN
        to: FINALIZED
        trigger: "POST /nonprofits/identity-cases/{id}/finalize with resolution_decision FINALIZE"
        actor: PlatformAdmin
        preconditions:
          - "MERGE: surviving_organization_id must be present and must differ from subject_organization_id (ERR_IDENTITY_CASE_INVALID)"
          - "MERGE: the successor chain starting at the surviving organization must not reach the subject organization (ERR_MERGE_CYCLE_DETECTED)"
          - "DISSOLUTION: surviving_organization_id must be null (ERR_IDENTITY_CASE_INVALID)"
          - "NAME_CHANGE: surviving_organization_id must be null and new_legal_name must be present (ERR_IDENTITY_CASE_INVALID)"
        side_effects:
          - "MERGE: subject Organization.profile_status -> MERGED, successor_organization_id set, Grants re-pointed, reassigned_grant_count recorded, surviving Organization.distinct_funder_count recomputed"
          - "DISSOLUTION: subject Organization.profile_status -> DISSOLVED with dissolution_date = effective_date"
          - "NAME_CHANGE: subject Organization.legal_name replaced, previous name appended to former_legal_names"
          - "finalized_at = logical clock"
          - "increments IdentityResolutionCase.version by 1 and Organization.version by 1"

      - from: OPEN
        to: WITHDRAWN
        trigger: "POST /nonprofits/identity-cases/{id}/finalize with resolution_decision WITHDRAW"
        actor: PlatformAdmin
        preconditions: []
        side_effects:
          - "no Organization is mutated"
          - "increments IdentityResolutionCase.version by 1"

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: filing-create-stale-organization
    parent_entity: Organization
    write_endpoint: "POST /nonprofits/filings"
    occ_field: "expected_organization_version"
    description: |
      Creating a Filing for an organization whose version has advanced since the
      client last observed it is rejected. This captures the case where another
      writer has just created a filing for the same organization (which
      legitimately supersedes the prior revision under §1.2) and the current
      writer's view of the organization is therefore stale. An Organization's
      version advances ONLY where §1.2 or §1.5 explicitly says "increments
      Organization.version by 1"; creating a child row (Program,
      LeadershipMember, DemographicRecord, Grant or TransparencySeal) does NOT
      advance the parent's version.
    error_id: ERR_STALE_ORGANIZATION_VERSION
    http_status: 412

  - rule_id: correction-create-stale-extracted-field
    parent_entity: ExtractedField
    write_endpoint: "POST /nonprofits/extracted-fields/{id}/correction-requests"
    occ_field: "expected_extracted_field_version"
    description: |
      Filing a CorrectionRequest against an ExtractedField whose version has
      advanced since the client last observed it is rejected. This captures the
      case where another writer has just corrected or re-normalized the field
      (which legitimately changes the value under correction) and the current
      writer is therefore disputing a value that no longer exists.
    error_id: ERR_STALE_EXTRACTED_FIELD_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: extract_field_normalization
    trigger: "POST /nonprofits/filings/{id}/normalize, for each ExtractedField of the filing whose normalization_status is PENDING or CONFLICT"
    algorithm: unit_conversion
    formula: |
      normalized_value_cents = round_half_up(decimal(raw_value) * UNIT_MULTIPLIER[raw_format], 0)
      # round_half_up: an exact .5 fraction rounds AWAY FROM ZERO (half up).
      # This is the ONLY rounding applied to a single field. It is never deferred.
    input_set: "ExtractedField rows with normalization_status IN {PENDING, CONFLICT} belonging to the filing being normalized"
    constants:
      UNIT_MULTIPLIER: { USD_WHOLE: 100, USD_THOUSANDS: 100000, USD_MILLIONS: 100000000, PLAIN_INTEGER: 100 }
    precision: "integer cents, round_half_up"

  - name: filing_total_revenue_normalized_cents
    trigger: "POST /nonprofits/filings/{id}/normalize, POST /nonprofits/filings/{id}/void, and any accepted correction against one of the filing's fields"
    algorithm: aggregation
    formula: |
      # PINNED EVALUATION ORDER — round per field FIRST, then sum as integers.
      Step 1 (per field):
        for each ExtractedField e where e.filing_id == filing.id
             and e.is_revenue_component == true
             and e.normalization_status IN {NORMALIZED, CORRECTED}:
            e.normalized_value_cents = round_half_up(decimal(e.raw_value) * UNIT_MULTIPLIER[e.raw_format], 0)
      Step 2 (integer sum, NO second rounding):
        filing.total_revenue_cents = sum(e.normalized_value_cents for e in the Step-1 set)
      # Fields with normalization_status IN {PENDING, CONFLICT} are excluded entirely.
      # The counter-example is explicitly rejected: summing raw dollars first and
      # rounding once at the end yields 691201 for the worked example below,
      # whereas the required per-field-then-sum order yields 691202.
    input_set: "ExtractedField rows of the filing with is_revenue_component == true and normalization_status IN {NORMALIZED, CORRECTED}"
    constants:
      WORKED_EXAMPLE_LINE_A: { raw_value: "1234.005", raw_format: USD_WHOLE, per_field_cents: 123401 }
      WORKED_EXAMPLE_LINE_B: { raw_value: "5678.005", raw_format: USD_WHOLE, per_field_cents: 567801 }
      WORKED_EXAMPLE_TOTAL_CENTS: 691202
      REJECTED_SUM_THEN_ROUND_TOTAL_CENTS: 691201
    precision: "integer cents, round_half_up per field, then exact integer addition"

  - name: organization_total_revenue_cents
    trigger: "any change to a Filing's status, to Filing.total_revenue_cents, or to the set of an organization's filings"
    algorithm: aggregation
    formula: |
      included = { f : f.organization_id == org.id
                     and f.status == NORMALIZED
                     and f.superseded_by_revision_number == null }
      org.total_revenue_cents = sum(f.total_revenue_cents for f in included)
      org.latest_filing_tax_year = max(f.tax_year for f in included), null when included is empty
      # No tie-break is required: §1.2's supersede invariant guarantees at most one
      # filing per (organization_id, tax_year, form_type) with superseded_by_revision_number == null,
      # so each (tax_year, form_type) pair contributes at most once.
    input_set: "Filing rows with status == NORMALIZED and superseded_by_revision_number == null"
    precision: "integer cents"

  - name: provisional_completeness_score
    trigger: "any change to Program, Filing, LeadershipMember, DemographicRecord or Organization profile fields"
    algorithm: weighted_scoring
    formula: |
      DIMENSION_WEIGHTS = { PROGRAMS: 0.15, FINANCES: 0.25, LEADERSHIP: 0.20,
                            DEMOGRAPHICS: 0.15, MISSION: 0.10, GOVERNANCE: 0.15 }
      dim PROGRAMS:     rows = Program with status ACTIVE
                        0 rows -> 0.0
                        >=1 row and at least one row has subject_code non-null -> 1.0
                        >=1 row and no row has subject_code non-null -> 0.5
      dim FINANCES:     rows = Filing with status IN {NORMALIZED, DISPUTED}
                        0 rows -> 0.0
                        >=1 row with status NORMALIZED and total_revenue_cents non-null -> 1.0
                        otherwise -> 0.5
      dim LEADERSHIP:   rows = LeadershipMember with status ACTIVE
                        0 rows -> 0.0
                        count(is_officer == true) >= 3 -> 1.0
                        count(is_officer == true) in {1,2} -> 0.5
                        else -> 0.0
      dim DEMOGRAPHICS: rows = DemographicRecord
                        0 rows -> 0.0
                        >=1 row with disclosure_level PUBLIC -> 1.0
                        otherwise -> 0.5
      dim MISSION:      mission_statement non-empty AND ntee_code non-null -> 1.0
                        exactly one of the two present -> 0.5
                        neither -> 0.0
      dim GOVERNANCE:   rows = LeadershipMember with status ACTIVE and is_officer == true
                        count(is_independent == true) >= 3 -> 1.0
                        count(is_independent == true) in {1,2} -> 0.5
                        else -> 0.0
      provisional_completeness_score = clamp(round_half_up(sum(DIMENSION_WEIGHTS[d] * dim_score(d)) * 100, 0), 0, 100)
    input_set: "Self-reported rows regardless of is_verified; every Program/LeadershipMember/DemographicRecord row counts"
    constants:
      DIMENSION_WEIGHTS: { PROGRAMS: 0.15, FINANCES: 0.25, LEADERSHIP: 0.20, DEMOGRAPHICS: 0.15, MISSION: 0.10, GOVERNANCE: 0.15 }
      WORKED_EXAMPLE_SCORE: 100
    precision: "integer 0..100, round_half_up"

  - name: verified_completeness_score
    trigger: "same triggers as provisional_completeness_score, plus any change to is_verified on a contributing row"
    algorithm: weighted_scoring
    formula: |
      Same DIMENSION_WEIGHTS and the same dimension membership as provisional_completeness_score,
      but each dimension's score is evidence-capped:
      dim PROGRAMS:     1.0 only if >=1 row and EVERY ACTIVE Program row has is_verified == true and at least one has subject_code non-null
                        0.5 if >=1 ACTIVE Program row exists but the 1.0 condition fails
                        0.0 if no ACTIVE Program row exists
      dim FINANCES:     1.0 only if >=1 Filing row has status NORMALIZED and is_verified == true
                        0.5 if >=1 Filing row has status IN {NORMALIZED, DISPUTED} but the 1.0 condition fails
                        0.0 if no such Filing row exists
      dim LEADERSHIP:   1.0 only if >=3 ACTIVE LeadershipMember rows with is_officer == true AND every such row has is_verified == true
                        0.5 if >=1 ACTIVE LeadershipMember row exists but the 1.0 condition fails
                        0.0 if no ACTIVE LeadershipMember row exists
      dim DEMOGRAPHICS: 1.0 only if >=1 DemographicRecord row has disclosure_level PUBLIC and is_verified == true
                        0.5 if >=1 DemographicRecord row exists but the 1.0 condition fails
                        0.0 if no DemographicRecord row exists
      dim MISSION:      1.0 only if mission_statement non-empty AND ntee_code non-null AND ntee_code_verified == true
                        0.5 if mission_statement non-empty OR ntee_code non-null, but the 1.0 condition fails
                        0.0 if neither is present
      dim GOVERNANCE:   1.0 only if count(ACTIVE, is_officer, is_independent) >= 3 AND every ACTIVE officer row has is_verified == true
                        0.5 if >=1 ACTIVE officer row exists but the 1.0 condition fails
                        0.0 if no ACTIVE officer row exists
      verified_completeness_score = clamp(round_half_up(sum(DIMENSION_WEIGHTS[d] * verified_dim_score(d)) * 100, 0), 0, 100)
      profile_completeness_score = verified_completeness_score  if org.verification_level IN {DOCUMENT_VERIFIED, INDEPENDENTLY_AUDITED}
                                   else provisional_completeness_score
    input_set: "Same rows as provisional_completeness_score; the difference is the is_verified / ntee_code_verified gate on each dimension"
    constants:
      DIMENSION_WEIGHTS: { PROGRAMS: 0.15, FINANCES: 0.25, LEADERSHIP: 0.20, DEMOGRAPHICS: 0.15, MISSION: 0.10, GOVERNANCE: 0.15 }
      WORKED_EXAMPLE_SCORE: 50
    precision: "integer 0..100, round_half_up"
    variants:
      - name: provisional
        when: "verification_level == SELF_REPORTED — profile_completeness_score publishes the self-reported score"
        difference: "For the §1.8 worked example the published score is 100 rather than 50."
      - name: verified
        when: "verification_level IN {DOCUMENT_VERIFIED, INDEPENDENTLY_AUDITED} — profile_completeness_score publishes the evidence-capped score"
        difference: "Verifying an organization can LOWER profile_completeness_score from 100 to 50 for identical underlying rows."

  - name: disclosure_pct
    trigger: "any change to a Program, Filing, LeadershipMember, DemographicRecord or Organization mission/ntee field"
    algorithm: weighted_scoring
    formula: |
      DISCLOSURE_WEIGHTS = { PROGRAMS: 0.15, FINANCES: 0.30, LEADERSHIP: 0.20,
                             DEMOGRAPHICS: 0.15, MISSION: 0.10, GOVERNANCE: 0.10 }
      dim PROGRAMS:     rows = Program with status ACTIVE
                        1.0 if >=1 row with disclosure_level PUBLIC
                        0.5 if >=1 row and none PUBLIC
                        0.0 if no row
      dim FINANCES:     1.0 if >=1 Filing with status NORMALIZED (information returns are public by law)
                        0.5 if >=1 Filing exists and none is NORMALIZED
                        0.0 if no Filing exists
      dim LEADERSHIP:   1.0 if >=1 ACTIVE LeadershipMember with disclosure_level PUBLIC
                        0.5 if >=1 ACTIVE LeadershipMember and none PUBLIC
                        0.0 if no ACTIVE LeadershipMember
      dim DEMOGRAPHICS: 1.0 if >=1 DemographicRecord with disclosure_level PUBLIC
                        0.5 if >=1 DemographicRecord and none PUBLIC
                        0.0 if no DemographicRecord
      dim MISSION:      1.0 if mission_statement non-empty AND ntee_code non-null
                        0.5 if exactly one of the two is present
                        0.0 if neither is present
      dim GOVERNANCE:   1.0 if >=1 ACTIVE LeadershipMember with is_independent == true and disclosure_level PUBLIC
                        0.5 if >=1 ACTIVE LeadershipMember with is_officer == true
                        0.0 otherwise
      disclosure_pct = round_half_up(sum(DISCLOSURE_WEIGHTS[d] * disclosure_dim_score(d)), 4)
    input_set: "Every Program / Filing / LeadershipMember / DemographicRecord row of the organization"
    constants:
      DISCLOSURE_WEIGHTS: { PROGRAMS: 0.15, FINANCES: 0.30, LEADERSHIP: 0.20, DEMOGRAPHICS: 0.15, MISSION: 0.10, GOVERNANCE: 0.10 }
      WORKED_EXAMPLE_PCT: 0.9000
      WORKED_EXAMPLE_PCT_BELOW: 0.8500
    precision: "4 decimal places, round_half_up"

  - name: seal_level_award
    trigger: "POST /nonprofits/organizations/{id}/seals"
    algorithm: threshold
    formula: |
      # Inputs: disclosure_pct, verified_filing_count, leadership_verified_pct, org.verification_level
      verified_filing_count = count(Filing f where f.organization_id == org.id
                                    and f.status == NORMALIZED and f.is_verified == true
                                    and f.tax_year >= org.latest_filing_tax_year - 2)
      leadership_verified_pct = round_half_up(
          count(ACTIVE LeadershipMember with is_verified == true) /
          count(ACTIVE LeadershipMember), 4)          # floor rule skipped when the denominator is 0
      SEAL_RANK = { BRONZE: 1, SILVER: 2, GOLD: 3, PLATINUM: 4 }
      if disclosure_pct < 0.50:
          reject ERR_SEAL_DISCLOSURE_INSUFFICIENT
      base_level =
          PLATINUM  if disclosure_pct >= 0.90 and verified_filing_count >= 2
          GOLD      elif disclosure_pct >= 0.75 and verified_filing_count >= 1
          SILVER    else                       # reachable only when 0.50 <= disclosure_pct < 0.75
      cap_level =
          BRONZE    if org.verification_level == SELF_REPORTED
          GOLD      elif org.verification_level == DOCUMENT_VERIFIED
          PLATINUM  else                       # INDEPENDENTLY_AUDITED
      level = the lower-ranked of base_level and cap_level
      if leadership_verified_pct < 0.50:
          level = the lower-ranked of level and SILVER
      awarded level = level
      expires_on = awarded_on + 365 days
      renewal_window_opens_on = expires_on - 60 days
    input_set: "Organization.disclosure_pct, the organization's NORMALIZED+verified filings in the trailing 3 tax years, its ACTIVE leadership rows, its verification_level"
    constants:
      DISCLOSURE_PLATINUM: 0.90
      DISCLOSURE_GOLD: 0.75
      DISCLOSURE_SILVER: 0.50
      PLATINUM_MIN_VERIFIED_FILINGS: 2
      GOLD_MIN_VERIFIED_FILINGS: 1
      LEADERSHIP_VERIFIED_FLOOR: 0.50
      SEAL_TERM_DAYS: 365
      RENEWAL_WINDOW_DAYS: 60
    precision: "disclosure_pct compared at 4 decimals; no rounding of the level"

  - name: seal_renewal_fee_cents
    trigger: "POST /nonprofits/seals/{id}/renew"
    algorithm: threshold
    formula: |
      # PINNED EVALUATION ORDER — every step consumes only the values produced above it.
      Step 1: level = seal.level                      # frozen at award; renewal NEVER re-evaluates the level
      Step 2: base_fee_cents = SEAL_BASE_FEE_CENTS[level]
      Step 3: days_late = max(0, floor((clock_now - seal.expires_on) / 86400 seconds))
      Step 4: late_tier = 0 if days_late == 0
                         1 if 1 <= days_late <= 30
                         2 if 31 <= days_late <= 90
                         3 if days_late >= 91
      Step 5: late_pct = LATE_PCT[late_tier]           # {0: 0.00, 1: 0.10, 2: 0.25, 3: 0.50}
      Step 6: late_fee_cents = round_half_up(base_fee_cents * late_pct, 0)
      Step 7: renewal_fee_cents = base_fee_cents + late_fee_cents
      Step 8: if late_tier == 3:
                  increment seal.renewal_attempt_count
                  seal.status -> LAPSED and reject with ERR_SEAL_LAPSED
              else:
                  increment seal.renewal_attempt_count
                  seal.last_renewal_fee_cents = renewal_fee_cents
                  seal.expires_on = clock_now + 365 days
                  seal.renewal_window_opens_on = seal.expires_on - 60 days
      # Step 8 evaluates renewal_attempt_count at its PRE-increment value; the
      # increment is a consequence of the decision, never an input to it.
    input_set: "seal.level, seal.expires_on and the logical clock"
    constants:
      SEAL_BASE_FEE_CENTS: { BRONZE: 0, SILVER: 25000, GOLD: 75000, PLATINUM: 200000 }
      LATE_TIER_1_MAX_DAYS: 30
      LATE_TIER_2_MAX_DAYS: 90
      LATE_PCT: { 0: 0.0, 1: 0.10, 2: 0.25, 3: 0.50 }
      WORKED_EXAMPLE_GOLD_15_DAYS_LATE_FEE_CENTS: 82500
      WORKED_EXAMPLE_PLATINUM_32_DAYS_LATE_FEE_CENTS: 250000
    precision: "integer cents, round_half_up"

  - name: license_annual_fee_cents
    trigger: "POST /nonprofits/licenses/{id}/activate (projected variant) and every read of DataLicense or POST /nonprofits/licenses/{id}/usage-events (final variant)"
    algorithm: tiered_pricing
    formula: |
      included_records = TIER_INCLUDED_RECORDS[tier]
      overage_rate_cents_per_record = TIER_OVERAGE_RATE_CENTS[tier]
      projected variant: overage_records = max(0, projected_annual_records - included_records)
      final variant:     overage_records = max(0, records_accessed - included_records)
      fee_cents = TIER_BASE_FEE_CENTS[tier] + overage_records * overage_rate_cents_per_record
      overage_flag = records_accessed > included_records
      # records_accessed is a conserved quantity: it equals the sum of record_count
      # over LicenseUsageEvent rows with status POSTED, and nothing else.
    input_set: "DataLicense.tier plus either projected_annual_records or the POSTED LicenseUsageEvent rows"
    constants:
      TIER_BASE_FEE_CENTS: { RESEARCHER: 500000, FUNDER: 2500000, PLATFORM: 10000000 }
      TIER_INCLUDED_RECORDS: { RESEARCHER: 10000, FUNDER: 100000, PLATFORM: 1000000 }
      TIER_OVERAGE_RATE_CENTS: { RESEARCHER: 5, FUNDER: 2, PLATFORM: 1 }
      QUOTA_HARD_CAP_MULTIPLIER: 4
      WORKED_EXAMPLE_PROJECTED_FEE_CENTS: 700000
      WORKED_EXAMPLE_FINAL_FEE_CENTS: 510000
    precision: "integer cents"
    variants:
      - name: projected
        when: "license status DRAFT or ACTIVE and the caller reads projected_annual_fee_cents"
        difference: "RESEARCHER tier with projected_annual_records 50000 quotes 700000 cents; the same license at read time with records_accessed 12000 quotes 510000."
      - name: final
        when: "the caller reads final_annual_fee_cents"
        difference: "Driven by actual POSTED usage events rather than the licensee's forecast."

  - name: grant_recipient_match_score
    trigger: "POST /nonprofits/organizations/{id}/grants and POST /nonprofits/grants/{id}/match-recipient"
    algorithm: weighted_scoring
    formula: |
      normalize(name):
          uppercase; replace every character that is not A-Z or 0-9 with a space;
          collapse runs of spaces; trim; drop a leading token "THE";
          drop every trailing token in {INC, INCORPORATED, CORP, CORPORATION, LLC, LTD,
                                        FOUNDATION, FUND, TRUST, ASSOCIATION, SOCIETY}
      score = 0
      if grant.recipient_ein is present and equals recipient_org.ein: score += 60
      n = normalize(grant.recipient_name_raw); m = normalize(recipient_org.legal_name)
      if n == m: score += 30
      elif len(n) >= 12 and len(m) >= 12 and n[0:12] == m[0:12]: score += 18
      if grant.subject_code is present and equals recipient_org.ntee_code: score += 10
      match_score = min(100, score)
      recipient_match_status =
          MATCHED    if match_score >= 70
          AMBIGUOUS  if 40 <= match_score <= 69
          UNMATCHED  if match_score < 40
    input_set: "Grant.recipient_ein, Grant.recipient_name_raw, Grant.subject_code and the recipient Organization's ein / legal_name / ntee_code"
    constants:
      EIN_MATCH_POINTS: 60
      NAME_EXACT_POINTS: 30
      NAME_PREFIX_POINTS: 18
      NAME_PREFIX_CHARS: 12
      SUBJECT_MATCH_POINTS: 10
      MATCHED_MIN_SCORE: 70
      AMBIGUOUS_MIN_SCORE: 40
      WORKED_EXAMPLE_EIN_ONLY_SCORE: 60
      WORKED_EXAMPLE_EIN_PLUS_SUBJECT_SCORE: 70
    precision: "integer 0..100"

  - name: prospect_match_score
    trigger: "GET /nonprofits/funder-research/prospects"
    algorithm: weighted_scoring
    formula: |
      candidate set = { o : o.profile_status == ACTIVE
                            and o.id != funder_organization_id
                            and o.id is not the subject or surviving organization of an OPEN IdentityResolutionCase involving funder_organization_id }
      mean_amount_cents = mean(g.amount_cents for g in Grant where g.funder_organization_id == funder_organization_id and g.status == RECORDED),
                          and 0 when that set is empty
      band_low_cents  = round_half_up(mean_amount_cents * 0.5, 0)
      band_high_cents = round_half_up(mean_amount_cents * 2.0, 0)
      score = 0
      if candidate.state_code == funder.state_code: score += 25
      if subject_code query parameter is present and candidate.ntee_code == subject_code: score += 35
      if band_low_cents <= candidate.total_revenue_cents <= band_high_cents: score += 20
      if candidate has >=1 Grant with funder_organization_id == funder_organization_id and status RECORDED: score += 20
      match_score = min(100, score)
      historical_giving_cents = sum(g.amount_cents for g in Grant where g.funder_organization_id == funder_organization_id
                                    and g.recipient_organization_id == candidate.id and g.status == RECORDED)
      RANKING (pinned): match_score DESC, then historical_giving_cents DESC, then candidate.created_at ASC.
      No UUID/random id ever participates in the ranking.
      EMPTY CANDIDATE SET: return an empty array with total_count 0 and has_more false — this is not an error.
    input_set: "Organizations with profile_status ACTIVE, excluding the funder itself and organizations tied to it by an OPEN identity case"
    constants:
      GEO_MATCH_POINTS: 25
      SUBJECT_MATCH_POINTS: 35
      SIZE_BAND_POINTS: 20
      HISTORY_POINTS: 20
      SIZE_BAND_LOW_MULTIPLIER: 0.5
      SIZE_BAND_HIGH_MULTIPLIER: 2.0
    precision: "integer 0..100 for match_score; integer cents for historical_giving_cents"

  - name: form_version_line_membership
    trigger: "POST /nonprofits/filings/{id}/extract"
    algorithm: reference_lookup
    formula: |
      FORM_VERSION_LINE_MAP is a closed table. A raw line is accepted only when
      line_code is a member of FORM_VERSION_LINE_MAP[filing.form_version_year];
      otherwise the whole request is rejected with ERR_UNSUPPORTED_FORM_VERSION.
      GOV_GRANTS does not exist before version 2020 and CRYPTO_HOLDINGS does not
      exist before version 2024, so the same line code is valid on one version
      and rejected on another.
    input_set: "filing.form_version_year plus every line_code in the request's raw_lines array"
    constants:
      FORM_VERSION_LINE_MAP:
        2019: [TOTREV, PROGREV, CONTRIB, SALARIES, OCCUPANCY, PROF_FUNDRAISING]
        2020: [TOTREV, PROGREV, CONTRIB, SALARIES, OCCUPANCY, PROF_FUNDRAISING, GOV_GRANTS]
        2021: [TOTREV, PROGREV, CONTRIB, SALARIES, OCCUPANCY, PROF_FUNDRAISING, GOV_GRANTS]
        2022: [TOTREV, PROGREV, CONTRIB, SALARIES, OCCUPANCY, PROF_FUNDRAISING, GOV_GRANTS, NET_ASSETS]
        2023: [TOTREV, PROGREV, CONTRIB, SALARIES, OCCUPANCY, PROF_FUNDRAISING, GOV_GRANTS, NET_ASSETS]
        2024: [TOTREV, PROGREV, CONTRIB, SALARIES, OCCUPANCY, PROF_FUNDRAISING, GOV_GRANTS, NET_ASSETS, CRYPTO_HOLDINGS]
      SUPPORTED_FORM_VERSION_YEARS: [2019, 2020, 2021, 2022, 2023, 2024]
    precision: "closed-set membership; no numeric rounding"

  - name: license_permitted_use_check
    trigger: "POST /nonprofits/licenses/{id}/activate"
    algorithm: reference_lookup
    formula: |
      PERMITTED_USES_BY_TIER is a closed table. Activation succeeds only when
      DataLicense.permitted_use is a member of PERMITTED_USES_BY_TIER[tier];
      otherwise the request is rejected with ERR_PERMITTED_USE_NOT_IN_TIER.
    input_set: "DataLicense.tier and DataLicense.permitted_use"
    constants:
      PERMITTED_USES_BY_TIER:
        RESEARCHER: [AGGREGATE_RESEARCH]
        FUNDER: [AGGREGATE_RESEARCH, GRANTMAKING_DUE_DILIGENCE]
        PLATFORM: [AGGREGATE_RESEARCH, GRANTMAKING_DUE_DILIGENCE, PLATFORM_REDISTRIBUTION, MARKETING_PROSPECTING]
    precision: "closed-set membership; no numeric rounding"

  - name: organization_derived_counters
    trigger: "any change to Grant, DataLicense, CorrectionRequest or IdentityResolutionCase rows belonging to the organization"
    algorithm: aggregation
    formula: |
      org.distinct_funder_count  = count(distinct g.funder_organization_id for g in Grant where g.recipient_organization_id == org.id and g.status == RECORDED)
      org.active_license_count   = count(l for l in DataLicense where l.licensee_organization_id == org.id and l.status == ACTIVE)
      org.open_correction_count  = count(c for c in CorrectionRequest where c.organization_id == org.id and c.status IN {SUBMITTED, UNDER_REVIEW})
      org.transparency_seal_level = the level of the ACTIVE TransparencySeal whose organization_id == org.id, else NONE
      org.seal_expires_on        = expires_on of that same ACTIVE TransparencySeal, else null
    input_set: "Grant rows with status RECORDED, DataLicense rows with status ACTIVE, CorrectionRequest rows with status IN {SUBMITTED, UNDER_REVIEW}, TransparencySeal rows with status ACTIVE"
    precision: "integers; enum for transparency_seal_level"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers must both be present and X-User-Role must name a declared role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"

  - priority: 2
    category: auth
    check: "the acting role must appear in the endpoint's roles list; entity_backed roles must additionally satisfy the ownership rule (X-User-ID == the owned resource's organization id)"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: existence
    check: "every resource id appearing in the path must exist, checked left-to-right in path order (organization, then filing, then extracted field, then license and usage event, then seal, grant, correction request and identity case)"
    error_id: "ERR_ORGANIZATION_NOT_FOUND / ERR_FILING_NOT_FOUND / ERR_EXTRACTED_FIELD_NOT_FOUND / ERR_LICENSE_NOT_FOUND / ERR_USAGE_EVENT_NOT_FOUND / ERR_SEAL_NOT_FOUND / ERR_GRANT_NOT_FOUND / ERR_CORRECTION_REQUEST_NOT_FOUND / ERR_IDENTITY_CASE_NOT_FOUND"
    http_status: 404
    applies_to: "all resource endpoints"

  - priority: 4
    category: existence
    check: "required body fields must be present and well typed, and every id supplied in the body must resolve to an existing row; body ids are checked in the order the endpoint's input list declares them"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all write endpoints"

  - priority: 5
    category: state
    check: "the target resource must be in a state from which the requested transition is declared in §1.2; transitions not declared for the current state are rejected. This includes the cross-entity state gate on POST /nonprofits/correction-requests/{id}/decide with decision ACCEPT: the target ExtractedField's Filing.status must be NORMALIZED or DISPUTED"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "every endpoint that drives a §1.2 transition"

  - priority: 6
    category: business_safety
    check: "segregation-of-duties gates, verification gates and good-standing gates, evaluated in this order: (1) the verifying user must differ from Organization.last_profile_editor_user_id and the deciding user must differ from CorrectionRequest.submitted_by_user_id; (2) target_level on POST /nonprofits/organizations/{id}/verify must be exactly one step above the current verification_level; (3) profile_completeness_score evaluated before the transition must be >= 50; (4) POST /nonprofits/filings/{id}/extract and POST /nonprofits/filings/{id}/normalize require the filing's Organization.profile_status IN {DRAFT, ACTIVE}; (5) POST /nonprofits/licenses/{id}/activate requires the licensee organization to be ACTIVE and POST /nonprofits/organizations/{id}/seals requires the organization named in the path to be ACTIVE"
    error_id: "ERR_SEGREGATION_OF_DUTIES / ERR_VERIFICATION_STEP_INVALID / ERR_PROFILE_INCOMPLETE / ERR_ORG_NOT_IN_GOOD_STANDING"
    http_status: 403
    applies_to: "POST /nonprofits/organizations/{id}/verify, POST /nonprofits/correction-requests/{id}/decide, POST /nonprofits/licenses/{id}/activate, POST /nonprofits/organizations/{id}/seals, POST /nonprofits/filings/{id}/extract, POST /nonprofits/filings/{id}/normalize"

  - priority: 7
    category: business_constraint
    check: "uniqueness and non-overlap constraints: ein uniqueness across Organization; no overlapping DataLicense term for the same licensee and tier; no overlapping LeadershipMember service interval for the same organization and office_title; no closed-interval coverage overlap between filings of the same organization that carry different form_type values; no duplicate line_code within one Filing at normalize time; no cycle in the successor_organization_id graph; an extract request with an empty raw_lines array"
    error_id: "ERR_EIN_ALREADY_REGISTERED / ERR_LICENSE_TERM_OVERLAP / ERR_LEADERSHIP_TERM_OVERLAP / ERR_FILING_COVERAGE_OVERLAP / ERR_MERGE_CYCLE_DETECTED / ERR_NO_EXTRACTED_FIELDS"
    http_status: 409
    applies_to: "POST /nonprofits/organizations, POST /nonprofits/filings, POST /nonprofits/licenses/{id}/activate, POST /nonprofits/organizations/{id}/leadership-members, POST /nonprofits/filings/{id}/extract, POST /nonprofits/filings/{id}/normalize, POST /nonprofits/identity-cases/{id}/finalize"

  - priority: 8
    category: business_fiscal
    check: "record-quota gate on license usage: records_accessed + record_count must not exceed included_records * 4"
    error_id: ERR_QUOTA_EXCEEDED
    http_status: 402
    applies_to: "POST /nonprofits/licenses/{id}/usage-events"

  - priority: 9
    category: business_referential
    check: "reference-data membership: every line_code must belong to FORM_VERSION_LINE_MAP[form_version_year] for the filing's declared version, and permitted_use must be a member of the tier's permitted-use set"
    error_id: "ERR_UNSUPPORTED_FORM_VERSION / ERR_PERMITTED_USE_NOT_IN_TIER"
    http_status: 422
    applies_to: "POST /nonprofits/filings/{id}/extract, POST /nonprofits/licenses/{id}/activate"

  - priority: 10
    category: business_temporal
    check: "logical-clock window gates: a usage event must fall inside [term_start, term_end); a seal renewal with days_late >= 91 is rejected; a seal whose expires_on + 90 days is already behind the clock is already LAPSED"
    error_id: "ERR_LICENSE_TERM_CLOSED / ERR_SEAL_LAPSED"
    http_status: 409
    applies_to: "POST /nonprofits/licenses/{id}/usage-events, POST /nonprofits/seals/{id}/renew"

  - priority: 11
    category: business_safety
    check: "disclosure floor for a seal award: disclosure_pct must be >= 0.50, and the organization must hold no ACTIVE TransparencySeal (a second award while one is ACTIVE is ERR_INVALID_STATE)"
    error_id: "ERR_SEAL_DISCLOSURE_INSUFFICIENT / ERR_INVALID_STATE"
    http_status: 422
    applies_to: "POST /nonprofits/organizations/{id}/seals"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Organization ---
  - method: POST
    path: "/nonprofits/organizations"
    description: "Create a nonprofit organization profile"
    roles: [PlatformAdmin]
    code: 201
    input: [legal_name, ein, org_type, state_code, "display_name?", "ntee_code?", "mission_statement?", "dissolution_date?"]
    output: Organization
    side_effects:
      - "profile_status=DRAFT, verification_level=SELF_REPORTED, former_legal_names=[]"
      - "last_profile_editor_user_id = X-User-ID"
      - "all computed counters initialised to 0; transparency_seal_level=NONE"

  - method: GET
    path: "/nonprofits/organizations"
    description: "List organization profiles with filtering and pagination"
    roles: [PlatformAdmin, PlatformVerifier, OrganizationUser, DataConsumer]
    code: 200
    input: ["ein?", "state_code?", "profile_status?", "verification_level?", "successor_organization_id?", "limit?", "offset?"]
    output: Organization[]
    side_effects: []

  - method: GET
    path: "/nonprofits/organizations/{id}"
    description: "Read one organization profile including every computed field"
    roles: [PlatformAdmin, PlatformVerifier, OrganizationUser, DataConsumer]
    code: 200
    input: []
    output: Organization
    side_effects: []

  - method: PATCH
    path: "/nonprofits/organizations/{id}"
    description: "Update self-reported profile fields; an optional demographic_records array REPLACES the organization's whole demographic set"
    roles: [OrganizationUser, PlatformAdmin]
    code: 200
    input: [expected_organization_version, "display_name?", "ntee_code?", "mission_statement?", "legal_name?", "state_code?", "demographic_records?"]
    output: Organization
    side_effects:
      - "last_profile_editor_user_id = X-User-ID"
      - "when demographic_records is present, every existing DemographicRecord of this organization is deleted and one row is created per array element"
      - "provisional_completeness_score, verified_completeness_score, profile_completeness_score and disclosure_pct recomputed"
      - "when the recomputed disclosure_pct falls below the disclosure floor of an ACTIVE TransparencySeal's level, that seal -> REVOKED and transparency_seal_level -> NONE with seal_expires_on -> null"
      - "increments Organization.version by 1"

  - method: POST
    path: "/nonprofits/organizations/{id}/verify"
    description: "Advance the organization's verification_level by exactly one step; the acting user must not be the last profile editor"
    roles: [PlatformVerifier]
    code: 200
    input: [target_level, evidence_count]
    output: Organization
    side_effects:
      - "verification_level advances one step"
      - "verification_evidence_count += evidence_count"
      - "profile_status -> ACTIVE when it was DRAFT and profile_completeness_score >= 50"
      - "profile_completeness_score recomputed under the new verification_level"
      - "increments Organization.version by 1"

  # --- Program ---
  - method: POST
    path: "/nonprofits/organizations/{id}/programs"
    description: "Self-report a program"
    roles: [OrganizationUser, PlatformAdmin]
    code: 201
    input: [program_name, fiscal_year, "subject_code?", "population_served?", "disclosure_level?"]
    output: Program
    side_effects:
      - "status=ACTIVE, is_verified=false"
      - "Organization completeness and disclosure scores recomputed"

  - method: GET
    path: "/nonprofits/organizations/{id}/programs"
    description: "List the organization's programs"
    roles: [PlatformAdmin, PlatformVerifier, OrganizationUser, DataConsumer]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: Program[]
    side_effects: []

  # --- LeadershipMember ---
  - method: POST
    path: "/nonprofits/organizations/{id}/leadership-members"
    description: "Self-report a leadership member; the service interval is closed at both ends and may not overlap another row with the same office_title"
    roles: [OrganizationUser, PlatformAdmin]
    code: 201
    input: [full_name, office_title, service_start, "is_officer?", "is_independent?", "disclosure_level?", "compensation_cents?", "service_end?"]
    output: LeadershipMember
    side_effects:
      - "status=ACTIVE, is_verified=false"
      - "Organization completeness and disclosure scores recomputed"

  - method: GET
    path: "/nonprofits/organizations/{id}/leadership-members"
    description: "List the organization's leadership members"
    roles: [PlatformAdmin, PlatformVerifier, OrganizationUser, DataConsumer]
    code: 200
    input: ["status?", "office_title?", "limit?", "offset?"]
    output: LeadershipMember[]
    side_effects: []

  # --- DemographicRecord ---
  - method: GET
    path: "/nonprofits/organizations/{id}/demographic-records"
    description: "List the organization's demographic records (created and replaced through PATCH /nonprofits/organizations/{id})"
    roles: [PlatformAdmin, PlatformVerifier, OrganizationUser, DataConsumer]
    code: 200
    input: ["category?", "disclosure_level?", "limit?", "offset?"]
    output: DemographicRecord[]
    side_effects: []

  # --- TransparencySeal ---
  - method: POST
    path: "/nonprofits/organizations/{id}/seals"
    description: "Award a transparency seal at the level computed by seal_level_award"
    roles: [PlatformVerifier]
    code: 201
    input: []
    output: TransparencySeal
    side_effects:
      - "level, disclosure_pct_at_award, awarded_on, expires_on and renewal_window_opens_on computed"
      - "status=ACTIVE, renewal_attempt_count=0"
      - "Organization.transparency_seal_level and seal_expires_on refreshed"
      - "increments Organization.version by 1"

  - method: GET
    path: "/nonprofits/organizations/{id}/seals"
    description: "List the organization's transparency seals"
    roles: [PlatformAdmin, PlatformVerifier, OrganizationUser, DataConsumer]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: TransparencySeal[]
    side_effects: []

  # --- Grant ---
  - method: POST
    path: "/nonprofits/organizations/{id}/grants"
    description: "Record a grant received by this organization from a funder; the recipient-match score is computed on creation"
    roles: [DataConsumer, PlatformAdmin]
    code: 201
    input: [funder_organization_id, funder_name_raw, recipient_name_raw, amount_cents, fiscal_year, "recipient_ein?", "subject_code?"]
    output: Grant
    side_effects:
      - "status=RECORDED, taxonomy_source derived (FUNDER_SUPPLIED when subject_code present, else UNCODED)"
      - "match_score and recipient_match_status computed by grant_recipient_match_score"
      - "Organization.distinct_funder_count recomputed on both the recipient and the funder"

  - method: GET
    path: "/nonprofits/organizations/{id}/grants"
    description: "List grants where this organization is either the recipient or the funder"
    roles: [PlatformAdmin, PlatformVerifier, OrganizationUser, DataConsumer]
    code: 200
    input: ["funder_organization_id?", "recipient_organization_id?", "fiscal_year?", "recipient_match_status?", "status?", "limit?", "offset?"]
    output: Grant[]
    side_effects: []

  # --- DataLicense ---
  - method: POST
    path: "/nonprofits/organizations/{id}/licenses"
    description: "Request a data license for this organization as licensee"
    roles: [DataConsumer, PlatformAdmin]
    code: 201
    input: [tier, permitted_use, term_start, term_end, "projected_annual_records?", "auto_renew?"]
    output: DataLicense
    side_effects:
      - "status=DRAFT, records_accessed=0, overage_records=0, overage_flag=false"
      - "included_records derived from tier; projected_annual_fee_cents computed from projected_annual_records"

  - method: GET
    path: "/nonprofits/organizations/{id}/licenses"
    description: "List the data licenses held by this organization"
    roles: [PlatformAdmin, PlatformVerifier, DataConsumer]
    code: 200
    input: ["status?", "tier?", "limit?", "offset?"]
    output: DataLicense[]
    side_effects: []

  # --- CorrectionRequest ---
  - method: GET
    path: "/nonprofits/organizations/{id}/correction-requests"
    description: "List the correction requests filed by this organization"
    roles: [PlatformAdmin, PlatformVerifier, OrganizationUser]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: CorrectionRequest[]
    side_effects: []

  # --- IdentityResolutionCase ---
  - method: GET
    path: "/nonprofits/organizations/{id}/identity-cases"
    description: "List identity resolution cases where this organization is the subject or the surviving organization"
    roles: [PlatformAdmin, PlatformVerifier]
    code: 200
    input: ["status?", "case_type?", "limit?", "offset?"]
    output: IdentityResolutionCase[]
    side_effects: []

  # --- Filing ---
  - method: GET
    path: "/nonprofits/organizations/{id}/filings"
    description: "List the organization's information-return filings, including superseded revisions"
    roles: [PlatformAdmin, PlatformVerifier, OrganizationUser, DataConsumer]
    code: 200
    input: ["tax_year?", "form_type?", "status?", "limit?", "offset?"]
    output: Filing[]
    side_effects: []

  - method: POST
    path: "/nonprofits/filings"
    description: "Create a filing revision for an organization; a higher revision legitimately supersedes the prior one"
    roles: [OrganizationUser, PlatformAdmin]
    code: 201
    input: [organization_id, form_type, form_version_year, tax_year, coverage_start, coverage_end, source, expected_organization_version]
    output: Filing
    side_effects:
      - "revision_number = 1 + max(existing revision_number for the same organization_id, tax_year and form_type), or 1 when none exists"
      - "any existing filing for that triple with status not in {SUPERSEDED, VOIDED} -> SUPERSEDED with pre_supersede_status recorded and superseded_by_revision_number set"
      - "status=RECEIVED, extracted_field_count=0, total_revenue_cents=0"
      - "Organization.total_revenue_cents recomputed"
      - "increments Organization.version by 1"

  - method: GET
    path: "/nonprofits/filings/{id}"
    description: "Read one filing including its normalization and supersession fields"
    roles: [PlatformAdmin, PlatformVerifier, OrganizationUser, DataConsumer]
    code: 200
    input: []
    output: Filing
    side_effects: []

  - method: POST
    path: "/nonprofits/filings/{id}/extract"
    description: "Extract line items from the raw return; a non-empty raw_lines array in which no line yields a parseable decimal raw_value drives the filing to EXTRACTION_FAILED, while an empty raw_lines array is refused with ERR_NO_EXTRACTED_FIELDS and leaves the filing where it was"
    roles: [PlatformVerifier]
    code: 200
    input: [raw_lines]
    output: Filing
    side_effects:
      - "one ExtractedField per raw line with normalization_status=PENDING"
      - "status -> EXTRACTED when at least one line was accepted, EXTRACTION_FAILED when the array is non-empty but no line yields a parseable decimal raw_value; an empty array is refused with 422 ERR_NO_EXTRACTED_FIELDS and the filing's status is unchanged"
      - "extracted_field_count and extraction_confidence_pct recomputed"

  - method: POST
    path: "/nonprofits/filings/{id}/normalize"
    description: "Normalize every pending field of the filing, then cascade the recomputation up to the organization"
    roles: [PlatformVerifier]
    code: 200
    input: []
    output: Filing
    side_effects:
      - "PENDING fields -> NORMALIZED, or CONFLICT when their line_code is duplicated inside the filing"
      - "total_revenue_cents recomputed with per-field rounding then integer sum"
      - "is_verified set true iff extraction_confidence_pct >= 90.0 and no field is CONFLICT"
      - "Organization.total_revenue_cents, latest_filing_tax_year, completeness scores and disclosure_pct recomputed"
      - "an ACTIVE seal is revoked when the recomputed profile_completeness_score drops below 50"
      - "increments Filing.version by 1 and Organization.version by 1"

  - method: POST
    path: "/nonprofits/filings/{id}/void"
    description: "Void a filing; voiding a revision that superseded an earlier one restores that earlier revision"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: Filing
    side_effects:
      - "status -> VOIDED"
      - "when this filing's revision_number equals another filing's superseded_by_revision_number, that filing returns to its pre_supersede_status"
      - "Organization.total_revenue_cents, latest_filing_tax_year and completeness scores recomputed"
      - "increments Filing.version by 1 and Organization.version by 1"

  # --- ExtractedField ---
  - method: GET
    path: "/nonprofits/filings/{id}/extracted-fields"
    description: "List the extracted line items of a filing"
    roles: [PlatformAdmin, PlatformVerifier, OrganizationUser, DataConsumer]
    code: 200
    input: ["normalization_status?", "is_revenue_component?", "limit?", "offset?"]
    output: ExtractedField[]
    side_effects: []

  - method: GET
    path: "/nonprofits/extracted-fields/{id}"
    description: "Read one extracted line item"
    roles: [PlatformAdmin, PlatformVerifier, OrganizationUser, DataConsumer]
    code: 200
    input: []
    output: ExtractedField
    side_effects: []

  - method: POST
    path: "/nonprofits/extracted-fields/{id}/correction-requests"
    description: "File a correction request against one extracted line"
    roles: [OrganizationUser]
    code: 201
    input: [requested_value, evidence_url, justification, expected_extracted_field_version]
    output: CorrectionRequest
    side_effects:
      - "status=SUBMITTED, submitted_by_user_id = X-User-ID, requested_at = logical clock"
      - "Organization.open_correction_count recomputed"
      - "increments ExtractedField.version by 1"

  - method: GET
    path: "/nonprofits/extracted-fields/{id}/correction-requests"
    description: "List the correction requests filed against one extracted line"
    roles: [PlatformAdmin, PlatformVerifier, OrganizationUser]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: CorrectionRequest[]
    side_effects: []

  - method: POST
    path: "/nonprofits/correction-requests/{id}/decide"
    description: "Drive the correction-request review machine: CLAIM, RETURN_FOR_INFO, ACCEPT, PARTIALLY_ACCEPT, REJECT or WITHDRAW"
    roles: [PlatformVerifier, OrganizationUser]
    code: 200
    input: [decision, "review_note?", "corrected_value?"]
    output: CorrectionRequest
    side_effects:
      - "SUBMITTED -> UNDER_REVIEW on CLAIM; UNDER_REVIEW -> SUBMITTED on RETURN_FOR_INFO"
      - "ACCEPT replaces the target field's normalized value and drives Filing -> DISPUTED"
      - "PARTIALLY_ACCEPT replaces the target field's value with corrected_value and drives Filing -> DISPUTED"
      - "Organization.total_revenue_cents, completeness scores and open_correction_count recomputed"
      - "Organization -> SUSPENDED with its ACTIVE seals revoked when open_correction_count reaches 3"
      - "increments CorrectionRequest.version by 1 and Organization.version by 1"

  # --- TransparencySeal actions ---
  - method: POST
    path: "/nonprofits/seals/{id}/renew"
    description: "Renew an ACTIVE seal; the level is frozen and the fee is derived from the days-late tier"
    roles: [PlatformVerifier]
    code: 200
    input: []
    output: TransparencySeal
    side_effects:
      - "renewal_attempt_count += 1"
      - "on success: last_renewal_fee_cents recorded, expires_on = clock + 365 days, renewal_window_opens_on = expires_on - 60 days"
      - "on days_late >= 91: status -> LAPSED and Organization.transparency_seal_level -> NONE"
      - "increments TransparencySeal.version by 1"

  # --- Grant actions ---
  - method: POST
    path: "/nonprofits/grants/{id}/match-recipient"
    description: "Re-run the recipient-match scoring for a grant, optionally supplying better identifying data the funder has since obtained"
    roles: [DataConsumer, PlatformAdmin]
    code: 200
    input: ["recipient_ein?", "subject_code?"]
    output: Grant
    side_effects:
      - "when recipient_ein is supplied it replaces Grant.recipient_ein; when subject_code is supplied it replaces Grant.subject_code and sets taxonomy_source to FUNDER_SUPPLIED"
      - "when subject_code is NOT supplied and the recomputed recipient_match_status is MATCHED and the recipient organization has a non-null ntee_code, subject_code is set to that ntee_code and taxonomy_source becomes AUTO_CODED"
      - "match_score and recipient_match_status recomputed by grant_recipient_match_score"
      - "increments Grant.version by 1"

  # --- DataLicense actions ---
  - method: GET
    path: "/nonprofits/licenses/{id}"
    description: "Read one data license including projected and final fee fields"
    roles: [PlatformAdmin, PlatformVerifier, DataConsumer]
    code: 200
    input: []
    output: DataLicense
    side_effects: []

  - method: POST
    path: "/nonprofits/licenses/{id}/activate"
    description: "Activate a DRAFT license after term-overlap and permitted-use checks"
    roles: [DataConsumer]
    code: 200
    input: []
    output: DataLicense
    side_effects:
      - "status -> ACTIVE"
      - "included_records, projected_annual_fee_cents and final_annual_fee_cents computed"
      - "licensee Organization.active_license_count recomputed"
      - "increments DataLicense.version by 1"

  - method: POST
    path: "/nonprofits/licenses/{id}/usage-events"
    description: "Post a usage event against an ACTIVE license"
    roles: [DataConsumer]
    code: 201
    input: [dataset_scope, record_count, purpose_code]
    output: LicenseUsageEvent
    side_effects:
      - "event status=POSTED, occurred_at = logical clock"
      - "DataLicense.records_accessed += record_count"
      - "overage_records, overage_flag and final_annual_fee_cents recomputed"
      - "increments DataLicense.version by 1"

  - method: POST
    path: "/nonprofits/licenses/{id}/usage-events/{event_id}/void"
    description: "Void a posted usage event, returning the consumed records to the license"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: LicenseUsageEvent
    side_effects:
      - "event status -> VOIDED"
      - "DataLicense.records_accessed -= record_count"
      - "overage_records, overage_flag and final_annual_fee_cents recomputed"
      - "increments DataLicense.version by 1"

  - method: GET
    path: "/nonprofits/licenses/{id}/usage-events"
    description: "List the usage events of one license"
    roles: [PlatformAdmin, PlatformVerifier, DataConsumer]
    code: 200
    input: ["status?", "dataset_scope?", "limit?", "offset?"]
    output: LicenseUsageEvent[]
    side_effects: []

  # --- IdentityResolutionCase actions ---
  - method: POST
    path: "/nonprofits/identity-cases"
    description: "Open an identity resolution case for a merger, dissolution or legal-name change"
    roles: [PlatformAdmin]
    code: 201
    input: [subject_organization_id, case_type, effective_date, "surviving_organization_id?", "new_legal_name?", "resolution_note?"]
    output: IdentityResolutionCase
    side_effects:
      - "status=OPEN, reassigned_grant_count=0"
      - "increments the subject Organization.version by 1"

  - method: POST
    path: "/nonprofits/identity-cases/{id}/finalize"
    description: "Finalize or withdraw an OPEN identity resolution case"
    roles: [PlatformAdmin]
    code: 200
    input: [resolution_decision]
    output: IdentityResolutionCase
    side_effects:
      - "FINALIZE applies the case's effect (merge, dissolution or name change) to the subject organization"
      - "MERGE re-points every Grant of the absorbed organization to the surviving one and records reassigned_grant_count"
      - "the subject's ACTIVE seals are revoked and its ACTIVE licenses expire"
      - "finalized_at = logical clock"
      - "increments IdentityResolutionCase.version by 1 and Organization.version by 1"

  # --- Funder research ---
  - method: GET
    path: "/nonprofits/funder-research/prospects"
    description: "Rank candidate grantee organizations for a funder by prospect match score"
    roles: [PlatformAdmin, PlatformVerifier, DataConsumer]
    code: 200
    input: [funder_organization_id, "subject_code?", "min_score?", "limit?", "offset?"]
    output: "{ funder_organization_id: string, mean_grant_amount_cents: integer, prospects: array }"
    side_effects: []

  # --- Test-driving endpoint ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the logical clock. The server starts with the logical clock fixed at 2026-09-01T00:00:00Z and never falls back to wall-clock time; before any call to this endpoint every deadline, expiry and window rule is evaluated against 2026-09-01T00:00:00Z."
    roles: [PlatformAdmin]
    code: 200
    input: [current_utc]
    output: "{ current_utc: datetime }"
    side_effects:
      - "every date-sensitive rule (seal expiry and lapse, license term windows, renewal windows, correction timestamps) is re-evaluated against the new instant"

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  # --- auth ---
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header missing, or X-User-Role names no declared role"
  - id: ERR_FORBIDDEN_ROLE
    http: 403
    condition: "The acting role is not in the endpoint's roles list, or an entity_backed actor is not the owner of the resource it is acting on"

  # --- not found (checked left-to-right in path order) ---
  - id: ERR_ORGANIZATION_NOT_FOUND
    http: 404
    condition: "No Organization exists for the id in the path or in the body"
  - id: ERR_FILING_NOT_FOUND
    http: 404
    condition: "No Filing exists for the id in the path or in the body"
  - id: ERR_EXTRACTED_FIELD_NOT_FOUND
    http: 404
    condition: "No ExtractedField exists for the id in the path or in the body"
  - id: ERR_LICENSE_NOT_FOUND
    http: 404
    condition: "No DataLicense exists for the id in the path"
  - id: ERR_USAGE_EVENT_NOT_FOUND
    http: 404
    condition: "No LicenseUsageEvent exists for the event id in the path"
  - id: ERR_SEAL_NOT_FOUND
    http: 404
    condition: "No TransparencySeal exists for the id in the path"
  - id: ERR_GRANT_NOT_FOUND
    http: 404
    condition: "No Grant exists for the id in the path"
  - id: ERR_CORRECTION_REQUEST_NOT_FOUND
    http: 404
    condition: "No CorrectionRequest exists for the id in the path"
  - id: ERR_IDENTITY_CASE_NOT_FOUND
    http: 404
    condition: "No IdentityResolutionCase exists for the id in the path"

  # --- request shape ---
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "A required body field is missing or ill-typed, a body field is not declared in the endpoint's input list, an unknown enum member is supplied, or a numeric field violates its range (record_count < 1, projected_annual_records < 1, evidence_count < 1, corrected_value equal to the current value)"

  # --- state ---
  - id: ERR_INVALID_STATE
    http: 409
    condition: "The target resource is in a state from which the requested transition is not declared in §1.2 — including a second seal award while one is ACTIVE and finalizing an identity case that is not OPEN"
  - id: ERR_VERIFICATION_STEP_INVALID
    http: 409
    condition: "target_level on POST /nonprofits/organizations/{id}/verify is not exactly the next level above the organization's current verification_level"
  - id: ERR_PROFILE_INCOMPLETE
    http: 409
    condition: "POST /nonprofits/organizations/{id}/verify is called while profile_completeness_score (evaluated before the transition) is below 50"
  - id: ERR_NO_EXTRACTED_FIELDS
    http: 422
    condition: "POST /nonprofits/filings/{id}/extract is called with an empty raw_lines array (the request is refused, no ExtractedField rows are created, and the filing is not advanced past its current status), or POST /nonprofits/filings/{id}/normalize is called on a filing that has zero ExtractedField rows"

  # --- business safety ---
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "The acting X-User-ID equals Organization.last_profile_editor_user_id on POST /nonprofits/organizations/{id}/verify, or equals CorrectionRequest.submitted_by_user_id on POST /nonprofits/correction-requests/{id}/decide with decision ACCEPT"
  - id: ERR_ORG_NOT_IN_GOOD_STANDING
    http: 403
    condition: "The acting or licensee organization has profile_status SUSPENDED, MERGED or DISSOLVED where ACTIVE is required"

  # --- business constraints ---
  - id: ERR_EIN_ALREADY_REGISTERED
    http: 409
    condition: "POST /nonprofits/organizations supplies an ein already held by another Organization"
  - id: ERR_FILING_COVERAGE_OVERLAP
    http: 409
    condition: "POST /nonprofits/filings supplies a closed coverage interval [coverage_start, coverage_end] that touches or overlaps the coverage interval of a non-SUPERSEDED, non-VOIDED filing of the same organization with a different form_type — touching endpoints count as an overlap"
  - id: ERR_LICENSE_TERM_OVERLAP
    http: 409
    condition: "POST /nonprofits/licenses/{id}/activate would create a half-open term [term_start, term_end) that overlaps an existing non-EXPIRED DataLicense of the same licensee and tier — an adjacent term whose term_start equals the prior term_end is NOT an overlap"
  - id: ERR_LEADERSHIP_TERM_OVERLAP
    http: 409
    condition: "POST /nonprofits/organizations/{id}/leadership-members supplies a closed service interval [service_start, service_end] that touches or overlaps an ACTIVE row with the same organization_id and office_title — touching endpoints count as an overlap"
  - id: ERR_MERGE_CYCLE_DETECTED
    http: 409
    condition: "Finalizing a MERGE case would make the successor_organization_id chain starting at the surviving organization reach the subject organization"
  - id: ERR_IDENTITY_CASE_INVALID
    http: 409
    condition: "The case's field combination is illegal: MERGE without a surviving_organization_id, MERGE whose surviving organization equals the subject, DISSOLUTION or NAME_CHANGE with a non-null surviving_organization_id, or NAME_CHANGE without a new_legal_name that differs from the current legal_name"

  # --- business fiscal ---
  - id: ERR_QUOTA_EXCEEDED
    http: 402
    condition: "POST /nonprofits/licenses/{id}/usage-events would push records_accessed above included_records * 4"

  # --- business referential ---
  - id: ERR_UNSUPPORTED_FORM_VERSION
    http: 422
    condition: "POST /nonprofits/filings/{id}/extract supplies a line_code that is not a member of FORM_VERSION_LINE_MAP[form_version_year], or a form_version_year outside {2019, 2020, 2021, 2022, 2023, 2024}"
  - id: ERR_FIELD_NOT_CORRECTABLE
    http: 422
    condition: "POST /nonprofits/extracted-fields/{id}/correction-requests targets an ExtractedField whose normalization_status is PENDING or CONFLICT"
  - id: ERR_PERMITTED_USE_NOT_IN_TIER
    http: 403
    condition: "POST /nonprofits/licenses/{id}/activate supplies a permitted_use that is not a member of PERMITTED_USES_BY_TIER[tier]"
  - id: ERR_SEAL_DISCLOSURE_INSUFFICIENT
    http: 422
    condition: "POST /nonprofits/organizations/{id}/seals is called while Organization.disclosure_pct is below 0.50"

  # --- business temporal ---
  - id: ERR_LICENSE_TERM_CLOSED
    http: 409
    condition: "POST /nonprofits/licenses/{id}/usage-events is called while the logical clock is outside [term_start, term_end)"
  - id: ERR_SEAL_LAPSED
    http: 409
    condition: "POST /nonprofits/seals/{id}/renew is called with days_late >= 91; the seal transitions to LAPSED and the renewal is refused"

  # --- optimistic concurrency ---
  - id: ERR_STALE_ORGANIZATION_VERSION
    http: 412
    condition: "expected_organization_version on POST /nonprofits/filings does not equal the organization's current version"
  - id: ERR_STALE_EXTRACTED_FIELD_VERSION
    http: 412
    condition: "expected_extracted_field_version on POST /nonprofits/extracted-fields/{id}/correction-requests does not equal the field's current version"

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: OrganizationUser
    description: "Staff of a nonprofit organization acting as that organization. Self-reports programs, leadership and demographics, submits information returns, and files correction requests against its own extracted data."
    identity: "entity_backed:Organization"
    exclusive_operations:
      - "PATCH /nonprofits/organizations/{id} — edit own profile (X-User-ID must equal the organization id)"
      - "POST /nonprofits/extracted-fields/{id}/correction-requests — file a correction request"
      - "POST /nonprofits/correction-requests/{id}/decide with decision WITHDRAW — withdraw a request the same user submitted"
    shared_operations:
      - "POST /nonprofits/organizations/{id}/programs — self-report a program"
      - "POST /nonprofits/organizations/{id}/leadership-members — self-report a leader"
      - "POST /nonprofits/filings — submit an information return for the owning organization"
      - "GET /nonprofits/organizations, GET /nonprofits/organizations/{id}, GET /nonprofits/organizations/{id}/programs, GET /nonprofits/organizations/{id}/leadership-members, GET /nonprofits/organizations/{id}/demographic-records, GET /nonprofits/organizations/{id}/filings, GET /nonprofits/filings/{id}, GET /nonprofits/filings/{id}/extracted-fields, GET /nonprofits/extracted-fields/{id}, GET /nonprofits/extracted-fields/{id}/correction-requests, GET /nonprofits/organizations/{id}/correction-requests, GET /nonprofits/organizations/{id}/seals, GET /nonprofits/organizations/{id}/grants"

  - name: PlatformVerifier
    description: "Candid data operations staff. Verifies profiles, runs extraction and normalization, awards and renews transparency seals, and adjudicates correction requests. Never the same person as the profile editor or the correction submitter."
    identity: "opaque"
    exclusive_operations:
      - "POST /nonprofits/organizations/{id}/verify — advance verification_level"
      - "POST /nonprofits/filings/{id}/extract — run line extraction"
      - "POST /nonprofits/filings/{id}/normalize — run normalization and the upward cascade"
      - "POST /nonprofits/organizations/{id}/seals — award a transparency seal"
      - "POST /nonprofits/seals/{id}/renew — renew a transparency seal"
      - "POST /nonprofits/correction-requests/{id}/decide with decisions CLAIM, RETURN_FOR_INFO, ACCEPT, PARTIALLY_ACCEPT, REJECT"
    shared_operations:
      - "GET /nonprofits/organizations, GET /nonprofits/organizations/{id}, GET /nonprofits/organizations/{id}/programs, GET /nonprofits/organizations/{id}/leadership-members, GET /nonprofits/organizations/{id}/demographic-records, GET /nonprofits/organizations/{id}/seals, GET /nonprofits/organizations/{id}/grants, GET /nonprofits/organizations/{id}/licenses, GET /nonprofits/organizations/{id}/filings, GET /nonprofits/organizations/{id}/identity-cases, GET /nonprofits/filings/{id}, GET /nonprofits/filings/{id}/extracted-fields, GET /nonprofits/extracted-fields/{id}, GET /nonprofits/extracted-fields/{id}/correction-requests, GET /nonprofits/licenses/{id}, GET /nonprofits/licenses/{id}/usage-events, GET /nonprofits/funder-research/prospects"

  - name: DataConsumer
    description: "A funder, researcher or platform organization that licenses Candid data, records grants it has made, and runs prospect research. Acts as itself: X-User-ID equals the licensee organization id."
    identity: "entity_backed:Organization"
    exclusive_operations:
      - "POST /nonprofits/organizations/{id}/licenses — request a license as the licensee organization"
      - "POST /nonprofits/licenses/{id}/activate — activate own DRAFT license"
      - "POST /nonprofits/licenses/{id}/usage-events — post a usage event against own ACTIVE license"
      - "POST /nonprofits/grants/{id}/match-recipient — re-run recipient matching"
    shared_operations:
      - "POST /nonprofits/organizations/{id}/grants — record a grant made to a recipient organization"
      - "GET /nonprofits/funder-research/prospects — rank prospect organizations"
      - "GET /nonprofits/organizations, GET /nonprofits/organizations/{id}, GET /nonprofits/organizations/{id}/filings, GET /nonprofits/filings/{id}, GET /nonprofits/filings/{id}/extracted-fields, GET /nonprofits/extracted-fields/{id}, GET /nonprofits/organizations/{id}/grants, GET /nonprofits/organizations/{id}/licenses, GET /nonprofits/licenses/{id}, GET /nonprofits/licenses/{id}/usage-events"

  - name: PlatformAdmin
    description: "Platform operator with override authority over the object graph: creates organizations, voids filings and usage events, opens and finalizes identity resolution cases, and drives the logical clock."
    identity: "opaque"
    exclusive_operations:
      - "POST /nonprofits/organizations — create an organization profile"
      - "POST /nonprofits/filings/{id}/void — void a filing revision"
      - "POST /nonprofits/licenses/{id}/usage-events/{event_id}/void — void a posted usage event"
      - "POST /nonprofits/identity-cases — open an identity resolution case"
      - "POST /nonprofits/identity-cases/{id}/finalize — finalize or withdraw an identity resolution case"
      - "POST /_clock/set_current_utc — set the logical clock"
    shared_operations:
      - "PATCH /nonprofits/organizations/{id}, POST /nonprofits/organizations/{id}/programs, POST /nonprofits/organizations/{id}/leadership-members, POST /nonprofits/organizations/{id}/grants, POST /nonprofits/organizations/{id}/licenses, POST /nonprofits/grants/{id}/match-recipient"
      - "GET /nonprofits/organizations, GET /nonprofits/organizations/{id}, GET /nonprofits/organizations/{id}/programs, GET /nonprofits/organizations/{id}/leadership-members, GET /nonprofits/organizations/{id}/demographic-records, GET /nonprofits/organizations/{id}/seals, GET /nonprofits/organizations/{id}/grants, GET /nonprofits/organizations/{id}/licenses, GET /nonprofits/organizations/{id}/correction-requests, GET /nonprofits/organizations/{id}/identity-cases, GET /nonprofits/organizations/{id}/filings, GET /nonprofits/filings/{id}, GET /nonprofits/filings/{id}/extracted-fields, GET /nonprofits/extracted-fields/{id}, GET /nonprofits/extracted-fields/{id}/correction-requests, GET /nonprofits/licenses/{id}, GET /nonprofits/licenses/{id}/usage-events, GET /nonprofits/funder-research/prospects"

