scaffold_corner_design:
  # =====================================================================
  # Section: entities
  # =====================================================================
  - section: entities
    instances:
      - name: airport_creation_applies_defaults_and_system_fields
        claim_type: creation
        grounds:
          - entities.Airport
          - endpoints[POST /airports]
        distinguishing_aspect: "POST /airports with all required fields returns 201 with server-minted id, created_at, updated_at, version=1, and status ACTIVE; client-supplied status/version in payload is rejected as unknown field or ignored per envelope contract."
        test_recipe:
          setup: ["Empty DB; logical clock at default 2026-08-01T00:00:00Z"]
          setup_api_calls:
            - call: "POST /airports"
              payload: { airport_code: "KENT", name: "Entity Field", escalation_pct: 0.05, escalation_policy: "ANNIVERSARY_COMPOUND", offer_acceptance_window_hours: 48, cure_window_days: 14, late_fee_grace_days: 3 }
              as: AirportManager
              captures: { ap_en: $.data.id, ap_en_status: $.data.status, ap_en_v: $.data.version }
          trigger:
            - call: "GET /airports/${ap_en}"
              as: AirportManager
          assert:
            - "Airport.${ap_en}.status == ACTIVE"
            - "Airport.${ap_en}.version == 1"
            - "Airport.${ap_en}.airport_code == KENT"
            - "Airport.${ap_en}.created_at == 2026-08-01T00:00:00.000Z (logical clock default)"

      - name: hangar_creation_missing_required_size_class_returns_invalid_request
        claim_type: required_field_missing
        grounds:
          - entities.Hangar.fields.size_class
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "Omitting required size_class on hangar creation returns ERR_INVALID_REQUEST (400) before any state/business check runs."
        test_recipe:
          setup: ["Airport exists"]
          setup_api_calls:
            - call: "POST /airports"
              payload: { airport_code: "KREQ", name: "Required Field", escalation_pct: 0.03, escalation_policy: "ANNIVERSARY_SIMPLE", offer_acceptance_window_hours: 72, cure_window_days: 30, late_fee_grace_days: 5 }
              as: AirportManager
              captures: { ap_rq: $.data.id }
          trigger:
            - call: "POST /hangars"
              payload: { airport_id: "${ap_rq}", hangar_code: "T-99", door_type: "SLIDING"  }
              as: AirportManager
              captures: { err_rq: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_REQUEST"

      - name: hangar_invalid_size_class_enum_rejected
        claim_type: type_constraint
        grounds:
          - entities.Hangar.fields.size_class
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "size_class value outside {T_HANGAR, BOX, EXECUTIVE, CORPORATE} is rejected with ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["Airport exists"]
          setup_api_calls:
            - call: "POST /airports"
              payload: { airport_code: "KENM", name: "Enum Field", escalation_pct: 0.03, escalation_policy: "ANNIVERSARY_SIMPLE", offer_acceptance_window_hours: 72, cure_window_days: 30, late_fee_grace_days: 5 }
              as: AirportManager
              captures: { ap_enm: $.data.id }
          trigger:
            - call: "POST /hangars"
              payload: { airport_id: "${ap_enm}", hangar_code: "T-98", size_class: "MEGA", door_type: "SLIDING"  }
              as: AirportManager
              captures: { err_enm: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_REQUEST"

      - name: get_hangar_nonexistent_returns_not_found
        claim_type: not_found
        grounds:
          - entities.Hangar
          - errors[ERR_NOT_FOUND]
        distinguishing_aspect: "GET with a well-formed but nonexistent hangar UUID returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Airport exists"]
          setup_api_calls:
            - call: "POST /airports"
              payload: { airport_code: "KNF", name: "NotFound Field", escalation_pct: 0.03, escalation_policy: "ANNIVERSARY_SIMPLE", offer_acceptance_window_hours: 72, cure_window_days: 30, late_fee_grace_days: 5 }
              as: AirportManager
              captures: { ap_nf: $.data.id }
          trigger:
            - call: "GET /hangars/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              as: AirportManager
              captures: { err_nf: $.data.error_id }
          assert:
            - "error_id == ERR_NOT_FOUND"

      - name: hangar_list_pagination_envelope
        claim_type: listing
        grounds:
          - entities.Hangar
          - response_envelope
        distinguishing_aspect: "GET /airports/{id}/hangars with 3 hangars and limit=2 returns page 1 with total_count=3, has_more=true; offset=2 returns the 3rd with has_more=false; envelope carries meta.api_request_id and response_type array."
        test_recipe:
          setup: ["Airport with three hangars"]
          setup_api_calls:
            - call: "POST /airports"
              payload: { airport_code: "KPG", name: "Page Field", escalation_pct: 0.03, escalation_policy: "ANNIVERSARY_SIMPLE", offer_acceptance_window_hours: 72, cure_window_days: 30, late_fee_grace_days: 5 }
              as: AirportManager
              captures: { ap_pg: $.data.id }
            - call: "POST /hangars"
              payload: { airport_id: "${ap_pg}", hangar_code: "T-1", size_class: "T_HANGAR", door_type: "SLIDING"  }
              as: AirportManager
            - call: "POST /hangars"
              payload: { airport_id: "${ap_pg}", hangar_code: "T-2", size_class: "T_HANGAR", door_type: "SLIDING"  }
              as: AirportManager
            - call: "POST /hangars"
              payload: { airport_id: "${ap_pg}", hangar_code: "B-1", size_class: "BOX", door_type: "BIFOLD"  }
              as: AirportManager
          trigger:
            - call: "GET /hangars?limit=2&offset=0"
              as: AirportManager
            - call: "GET /hangars?limit=2&offset=2"
              as: AirportManager
          assert:
            - "page1 total_count == 3 and has_more == true and len(data) == 2"
            - "page2 has_more == false and len(data) == 1"
            - "response envelope contains meta.api_request_id and response_type == array"

      - name: hangar_computed_posture_ignores_client_input
        claim_type: computed_field
        grounds:
          - entities.Hangar.fields.posture
          - entities.Hangar.fields.condition_rating
        distinguishing_aspect: "posture and condition_rating are system/computed: a create payload cannot set them (unknown field rejection or silent ignore); a fresh hangar reads posture AVAILABLE, condition_rating GOOD."
        test_recipe:
          setup: ["Airport exists"]
          setup_api_calls:
            - call: "POST /airports"
              payload: { airport_code: "KCMP", name: "Computed Field", escalation_pct: 0.03, escalation_policy: "ANNIVERSARY_SIMPLE", offer_acceptance_window_hours: 72, cure_window_days: 30, late_fee_grace_days: 5 }
              as: AirportManager
              captures: { ap_cm: $.data.id }
          trigger:
            - call: "POST /hangars"
              payload: { airport_id: "${ap_cm}", hangar_code: "T-77", size_class: "T_HANGAR", door_type: "SLIDING"  }
              as: AirportManager
              captures: { h_cm_posture: $.data.posture, h_cm_cond: $.data.condition_rating }
          assert:
            - "Hangar.posture == AVAILABLE"
            - "Hangar.condition_rating == GOOD"

  # =====================================================================
  # Section: state_machines
  # =====================================================================
  - section: state_machines
    instances:
      - name: decommission_hangar_with_active_lease_rejected
        claim_type: precondition_enforcement
        grounds:
          - state_machines.Hangar.OPERATIONAL_to_DECOMMISSIONED
          - errors[ERR_HANGAR_OCCUPIED]
        distinguishing_aspect: "Decommissioning a hangar while an ACTIVE lease occupies it fails with ERR_HANGAR_OCCUPIED; hangar stays OPERATIONAL."
        test_recipe:
          setup: ["Airport ACTIVE; hangar with ACTIVE lease"]
          setup_api_calls:
            - call: "POST /airports"
              payload: { airport_code: "KDEC", name: "Decom Field", escalation_pct: 0.0, escalation_policy: "ANNIVERSARY_SIMPLE", offer_acceptance_window_hours: 72, cure_window_days: 30, late_fee_grace_days: 5 }
              as: AirportManager
              captures: { ap_dc: $.data.id }
            - call: "POST /rate-schedules"
              payload: { airport_id: "${ap_dc}", size_class: "T_HANGAR", monthly_rate_cents: 90000, effective_from: "2026-07-01T00:00:00Z", effective_to: "OPEN"  }
              as: AirportManager
            - call: "POST /hangars"
              payload: { airport_id: "${ap_dc}", hangar_code: "T-60", size_class: "T_HANGAR", door_type: "SLIDING"  }
              as: AirportManager
              captures: { h_dc: $.data.id, h_dc_v: $.data.version }
            - call: "POST /applications"
              payload: { airport_id: "${ap_dc}", applicant_name: "Dee Com", applicant_contact: "dee@x.com", size_class_requested: "T_HANGAR", aircraft_n_number: "N190DC", is_based_tenant_transfer: false  }
              as: Applicant
              captures: { app_dc: $.data.id }
            - call: "POST /offers"
              payload: { airport_id: "${ap_dc}", hangar_id: "${h_dc}", application_id: "${app_dc}"  }
              as: AirportManager
              captures: { off_dc: $.data.id }
            - call: "POST /offers/${off_dc}/accept"
              payload: { expected_hangar_version: "${h_dc_v}", aeronautical_use_attested: true, sublease_allowed: false, insurance_policy_number: "POL-DC", insurance_insurer_name: "Avemco", insurance_liability_coverage_cents: 100000000, insurance_effective_from: "2026-08-01T00:00:00Z", insurance_effective_to: "2030-01-01T00:00:00Z", aircraft_n_number: "N190DC", aircraft_make_model: "Cessna 172" }
              as: Applicant
              as_user_id: "${app_dc}"
          trigger:
            - call: "POST /hangars/${h_dc}/decommission"
              payload: {}
              as: AirportManager
              captures: { err_dc: $.data.error_id }
          assert:
            - "error_id == ERR_HANGAR_OCCUPIED"
            - "Hangar.${h_dc}.status == OPERATIONAL"

      - name: withdraw_application_in_queued_state
        claim_type: valid_transition
        grounds:
          - state_machines.WaitlistApplication.QUEUED_to_WITHDRAWN
        distinguishing_aspect: "A QUEUED application withdraws cleanly; a second withdraw attempt fails with ERR_APPLICATION_NOT_WITHDRAWABLE (terminal lockdown)."
        test_recipe:
          setup: ["Airport ACTIVE; one QUEUED application"]
          setup_api_calls:
            - call: "POST /airports"
              payload: { airport_code: "KWDR", name: "Withdraw Field", escalation_pct: 0.0, escalation_policy: "ANNIVERSARY_SIMPLE", offer_acceptance_window_hours: 72, cure_window_days: 30, late_fee_grace_days: 5 }
              as: AirportManager
              captures: { ap_wd: $.data.id }
            - call: "POST /applications"
              payload: { airport_id: "${ap_wd}", applicant_name: "Will Draw", applicant_contact: "will@x.com", size_class_requested: "BOX", aircraft_n_number: "N210WD", is_based_tenant_transfer: false  }
              as: Applicant
              captures: { app_wd: $.data.id }
          trigger:
            - call: "POST /applications/${app_wd}/withdraw"
              payload: {}
              as: Applicant
              as_user_id: "${app_wd}"
            - call: "POST /applications/${app_wd}/withdraw"
              payload: {}
              as: Applicant
              as_user_id: "${app_wd}"
              captures: { err_wd: $.data.error_id }
          assert:
            - "WaitlistApplication.${app_wd}.status == WITHDRAWN after first call"
            - "second withdraw error_id == ERR_APPLICATION_NOT_WITHDRAWABLE"

      - name: cure_finding_after_deadline_rejected_and_escalated
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.UseAuditFinding
          - errors[ERR_CURE_WINDOW_EXPIRED]
        distinguishing_aspect: "At exactly cure_deadline the finding is no longer curable (>= boundary): cure returns ERR_CURE_WINDOW_EXPIRED and the same sweep has flipped the finding ESCALATED_TO_EVICTION."
        test_recipe:
          setup: ["Airport cure_window_days 30; lease ACTIVE; finding filed at 2026-08-05T00:00Z (deadline 2026-09-04T00:00Z)"]
          setup_api_calls:
            - call: "POST /airports"
              payload: { airport_code: "KCDL", name: "Cure Deadline Field", escalation_pct: 0.0, escalation_policy: "ANNIVERSARY_SIMPLE", offer_acceptance_window_hours: 72, cure_window_days: 30, late_fee_grace_days: 5 }
              as: AirportManager
              captures: { ap_cd: $.data.id }
            - call: "POST /rate-schedules"
              payload: { airport_id: "${ap_cd}", size_class: "T_HANGAR", monthly_rate_cents: 90000, effective_from: "2026-07-01T00:00:00Z", effective_to: "OPEN"  }
              as: AirportManager
            - call: "POST /hangars"
              payload: { airport_id: "${ap_cd}", hangar_code: "T-61", size_class: "T_HANGAR", door_type: "SLIDING"  }
              as: AirportManager
              captures: { h_cd: $.data.id, h_cd_v: $.data.version }
            - call: "POST /applications"
              payload: { airport_id: "${ap_cd}", applicant_name: "Cal Deadline", applicant_contact: "cal@x.com", size_class_requested: "T_HANGAR", aircraft_n_number: "N220CD", is_based_tenant_transfer: false  }
              as: Applicant
              captures: { app_cd: $.data.id }
            - call: "POST /offers"
              payload: { airport_id: "${ap_cd}", hangar_id: "${h_cd}", application_id: "${app_cd}"  }
              as: AirportManager
              captures: { off_cd: $.data.id }
            - call: "POST /offers/${off_cd}/accept"
              payload: { expected_hangar_version: "${h_cd_v}", aeronautical_use_attested: true, sublease_allowed: false, insurance_policy_number: "POL-CD", insurance_insurer_name: "Avemco", insurance_liability_coverage_cents: 100000000, insurance_effective_from: "2026-08-01T00:00:00Z", insurance_effective_to: "2030-01-01T00:00:00Z", aircraft_n_number: "N220CD", aircraft_make_model: "Cessna 172" }
              as: Applicant
              as_user_id: "${app_cd}"
              captures: { lease_cd: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T00:00:00Z" }
              as: AirportManager
            - call: "POST /leases/${lease_cd}/audit-findings"
              payload: { finding_type: "NON_AERONAUTICAL_USE" }
              as: ComplianceOfficer
              captures: { find_cd: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-04T00:00:00Z" }
              as: AirportManager
          trigger:
            - call: "POST /audit-findings/${find_cd}/cure"
              payload: {}
              as: Tenant
              as_user_id: "${lease_cd}"
              captures: { err_cd: $.data.error_id }
          assert:
            - "error_id == ERR_CURE_WINDOW_EXPIRED"
            - "UseAuditFinding.${find_cd}.status == ESCALATED_TO_EVICTION"
            - "Lease.${lease_cd}.status == EVICTION_PENDING"

      - name: eviction_execute_then_terminate_full_abandoned_aircraft_flow
        claim_type: valid_transition
        grounds:
          - state_machines.Lease.EVICTION_PENDING_to_EVICTED
          - state_machines.Lease.EVICTED_to_TERMINATED
          - concurrency_rules[eviction-execute-stale-lease]
        distinguishing_aspect: "Full eviction lifecycle: case FILED → EXECUTED (lease EVICTED, hangar AVAILABLE) → aircraft removed → terminate flips case CLOSED_AIRCRAFT_REMOVED and lease TERMINATED; terminate while aircraft BASED fails ERR_AIRCRAFT_STILL_BASED."
        test_recipe:
          setup: ["Airport ACTIVE; lease with one BASED aircraft; UNCURED_AUDIT eviction case auto-created via expired cure deadline"]
          setup_api_calls:
            - call: "POST /airports"
              payload: { airport_code: "KEVX", name: "Eviction Field", escalation_pct: 0.0, escalation_policy: "ANNIVERSARY_SIMPLE", offer_acceptance_window_hours: 72, cure_window_days: 30, late_fee_grace_days: 5 }
              as: AirportManager
              captures: { ap_ev: $.data.id }
            - call: "POST /rate-schedules"
              payload: { airport_id: "${ap_ev}", size_class: "BOX", monthly_rate_cents: 80000, effective_from: "2026-07-01T00:00:00Z", effective_to: "OPEN"  }
              as: AirportManager
            - call: "POST /hangars"
              payload: { airport_id: "${ap_ev}", hangar_code: "B-62", size_class: "BOX", door_type: "BIFOLD"  }
              as: AirportManager
              captures: { h_ev: $.data.id, h_ev_v: $.data.version }
            - call: "POST /applications"
              payload: { airport_id: "${ap_ev}", applicant_name: "Eve Evict", applicant_contact: "eve@x.com", size_class_requested: "BOX", aircraft_n_number: "N230EV", is_based_tenant_transfer: false  }
              as: Applicant
              captures: { app_ev: $.data.id }
            - call: "POST /offers"
              payload: { airport_id: "${ap_ev}", hangar_id: "${h_ev}", application_id: "${app_ev}"  }
              as: AirportManager
              captures: { off_ev: $.data.id }
            - call: "POST /offers/${off_ev}/accept"
              payload: { expected_hangar_version: "${h_ev_v}", aeronautical_use_attested: true, sublease_allowed: false, insurance_policy_number: "POL-EV", insurance_insurer_name: "Avemco", insurance_liability_coverage_cents: 100000000, insurance_effective_from: "2026-08-01T00:00:00Z", insurance_effective_to: "2030-01-01T00:00:00Z", aircraft_n_number: "N230EV", aircraft_make_model: "Cessna 182" }
              as: Applicant
              as_user_id: "${app_ev}"
              captures: { lease_ev: $.data.id, lease_ev_v: $.data.version }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T00:00:00Z" }
              as: AirportManager
            - call: "POST /leases/${lease_ev}/audit-findings"
              payload: { finding_type: "NON_AERONAUTICAL_USE" }
              as: ComplianceOfficer
              captures: { find_ev: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-05T00:00:00Z" }
              as: AirportManager
            - call: "GET /leases/${lease_ev}/eviction-cases"
              as: AirportManager
              captures: { case_ev: "$.data[0].id" }
            - call: "GET /leases/${lease_ev}"
              as: AirportManager
              captures: { lease_ev_v_pre: $.data.version }
          trigger:
            - call: "POST /eviction-cases/${case_ev}/execute"
              payload: { expected_lease_version: "${lease_ev_v_pre}" }
              as: AirportManager
            - call: "POST /leases/${lease_ev}/terminate"
              payload: {}
              as: AirportManager
              captures: { err_ev: $.data.error_id }
            - call: "GET /leases/${lease_ev}/aircraft"
              as: AirportManager
              captures: { ac_ev: "$.data[0].id" }
            - call: "POST /aircraft/${ac_ev}/remove"
              payload: {}
              as: AirportManager
            - call: "POST /leases/${lease_ev}/terminate"
              payload: {}
              as: AirportManager
          assert:
            - "EvictionCase.${case_ev}.status == EXECUTED after execute"
            - "Lease.${lease_ev}.status == EVICTED after execute"
            - "Hangar.${h_ev}.posture == AVAILABLE after execute"
            - "first terminate error_id == ERR_AIRCRAFT_STILL_BASED"
            - "final Lease.${lease_ev}.status == TERMINATED"
            - "final EvictionCase.${case_ev}.status == CLOSED_AIRCRAFT_REMOVED"

      - name: inspection_close_updates_hangar_condition_and_posture
        claim_type: side_effect_execution
        grounds:
          - state_machines.HangarConditionInspection.OPEN_to_CLOSED
          - entities.Hangar.fields.posture
        distinguishing_aspect: "Closing an OUT_OF_SERVICE inspection on a vacant hangar flips condition_rating to OUT_OF_SERVICE and posture to MAINTENANCE_HOLD; closing a TENANT-responsibility POOR inspection without remediation_note fails ERR_REMEDIATION_NOTE_REQUIRED."
        test_recipe:
          setup: ["Airport ACTIVE; vacant hangar H1 (condition GOOD); leased hangar H2 with TENANT-responsibility POOR inspection"]
          setup_api_calls:
            - call: "POST /airports"
              payload: { airport_code: "KINS", name: "Inspection Field", escalation_pct: 0.0, escalation_policy: "ANNIVERSARY_SIMPLE", offer_acceptance_window_hours: 72, cure_window_days: 30, late_fee_grace_days: 5 }
              as: AirportManager
              captures: { ap_in: $.data.id }
            - call: "POST /rate-schedules"
              payload: { airport_id: "${ap_in}", size_class: "T_HANGAR", monthly_rate_cents: 90000, effective_from: "2026-07-01T00:00:00Z", effective_to: "OPEN"  }
              as: AirportManager
            - call: "POST /hangars"
              payload: { airport_id: "${ap_in}", hangar_code: "T-80", size_class: "T_HANGAR", door_type: "SLIDING"  }
              as: AirportManager
              captures: { h_in1: $.data.id }
            - call: "POST /hangars"
              payload: { airport_id: "${ap_in}", hangar_code: "T-81", size_class: "T_HANGAR", door_type: "SLIDING"  }
              as: AirportManager
              captures: { h_in2: $.data.id, h_in2_v: $.data.version }
            - call: "POST /applications"
              payload: { airport_id: "${ap_in}", applicant_name: "Ina Spect", applicant_contact: "ina@x.com", size_class_requested: "T_HANGAR", aircraft_n_number: "N240IN", is_based_tenant_transfer: false  }
              as: Applicant
              captures: { app_in: $.data.id }
            - call: "POST /offers"
              payload: { airport_id: "${ap_in}", hangar_id: "${h_in2}", application_id: "${app_in}"  }
              as: AirportManager
              captures: { off_in: $.data.id }
            - call: "POST /offers/${off_in}/accept"
              payload: { expected_hangar_version: "${h_in2_v}", aeronautical_use_attested: true, sublease_allowed: false, insurance_policy_number: "POL-IN", insurance_insurer_name: "Avemco", insurance_liability_coverage_cents: 100000000, insurance_effective_from: "2026-08-01T00:00:00Z", insurance_effective_to: "2030-01-01T00:00:00Z", aircraft_n_number: "N240IN", aircraft_make_model: "Cessna 172" }
              as: Applicant
              as_user_id: "${app_in}"
            - call: "POST /hangars/${h_in1}/inspections"
              payload: { condition_rating: "OUT_OF_SERVICE", maintenance_responsibility: "AIRPORT", deficiency_note: "Door track collapsed" }
              as: AirportManager
              captures: { insp_in1: $.data.id }
            - call: "POST /hangars/${h_in2}/inspections"
              payload: { condition_rating: "POOR", maintenance_responsibility: "TENANT", deficiency_note: "Oil stains, wall damage" }
              as: ComplianceOfficer
              captures: { insp_in2: $.data.id }
          trigger:
            - call: "POST /inspections/${insp_in1}/close"
              payload: {}
              as: AirportManager
            - call: "POST /inspections/${insp_in2}/close"
              payload: {}
              as: AirportManager
              captures: { err_in2: $.data.error_id }
            - call: "GET /hangars/${h_in1}"
              as: AirportManager
              captures: { h_in1_post: $.data.posture, h_in1_cond: $.data.condition_rating }
          assert:
            - "Hangar.${h_in1}.condition_rating == OUT_OF_SERVICE"
            - "Hangar.${h_in1}.posture == MAINTENANCE_HOLD"
            - "second close error_id == ERR_REMEDIATION_NOTE_REQUIRED"
            - "HangarConditionInspection.${insp_in2}.status == OPEN"

      - name: resume_non_suspended_airport_rejected
        claim_type: invalid_transition
        grounds:
          - state_machines.Airport.SUSPENDED_to_ACTIVE
          - errors[ERR_AIRPORT_NOT_SUSPENDED]
        distinguishing_aspect: "POST /airports/{id}/resume on an already-ACTIVE airport fails with ERR_AIRPORT_NOT_SUSPENDED; no state change."
        test_recipe:
          setup: ["Airport ACTIVE"]
          setup_api_calls:
            - call: "POST /airports"
