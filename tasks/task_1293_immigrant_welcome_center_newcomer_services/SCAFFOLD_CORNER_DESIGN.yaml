# =============================================================================
# §1.9 Scaffold Corner Design — Coverage Index for Non-Difficulty Tests
# Immigrant Welcome Center & Newcomer Services
# Sections/claim_types follow references/claim-extraction-guide.md.
# =============================================================================
scaffold_corner_design:
  - section: entities
    instances:
      - name: client_creation_applies_defaults_and_system_fields
        claim_type: defaults
        grounds: ["entities.Client.fields.household_size", "entities.Client.fields.status", "entities.Client.fields.reportable"]
        distinguishing_aspect: "Omitting optional fields yields household_size 1, status REGISTERED, reportable false, version 1, server-minted id/created_at."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls:
            - call: "POST /clients"
              payload: { full_name: "Solo Client", preferred_language: "es", date_of_birth: "1999-01-01" }
              as: IntakeSpecialist
              captures: { cli_id: $.data.id, cli_hs: $.data.household_size, cli_stat: $.data.status, cli_rep: $.data.reportable, cli_v: $.data.version }
          trigger: []
          assert:
            - "household_size == 1 (default applied)"
            - "status == REGISTERED and reportable == false"
            - "version == 1 and id is a server-minted UUID"
            - "Client registration auto-ACTIVE only after first Case: GET /clients/${cli_id} still REGISTERED"

      - name: client_creation_missing_required_field
        claim_type: violation_to_error
        grounds: ["validations[priority=7]", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /clients without full_name fails 400 ERR_INVALID_REQUEST before any existence/state check."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /clients"
              payload: { preferred_language: "es", date_of_birth: "1999-01-01" }
              as: IntakeSpecialist
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_REQUEST and http status 400"

      - name: case_get_unknown_id_returns_not_found
        claim_type: not_found
        grounds: ["validations[priority=3]", "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET with a well-formed but unknown UUID returns 404 ERR_NOT_FOUND."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /cases/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              as: CaseManager
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_NOT_FOUND and http status 404"

      - name: assessment_score_out_of_range
        claim_type: type_constraint
        grounds: ["entities.NeedsAssessment.fields.housing_score", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "Score 5 violates the 0..4 range -> 400 ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["staff mgr; client; case"]
          setup_api_calls:
            - call: "POST /staff"
              payload: { full_name: "Mgr One", role_level: "CASE_MANAGER", clearance_level: 2, weekly_appointment_capacity: 10 }
              as: CenterAdmin
              captures: { mgr1_id: $.data.id }
            - call: "POST /clients"
              payload: { full_name: "Tariq Client", preferred_language: "ar", date_of_birth: "1992-02-02", household_size: 1 }
              as: IntakeSpecialist
              captures: { cli_id: $.data.id }
            - call: "POST /cases"
              payload: { client_id: "${cli_id}", assigned_manager_id: "${mgr1_id}" }
              as: CaseManager
              as_user_id: "${mgr1_id}"
              captures: { case_id: $.data.id }
          trigger:
            - call: "POST /assessments"
              payload: { case_id: "${case_id}", housing_score: 5, employment_score: 1, education_score: 1, language_score: 1, health_score: 1 }
              as: CaseManager
              as_user_id: "${mgr1_id}"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_REQUEST (score range 0..4 violated)"

      - name: household_head_self_reference_cycle
        claim_type: type_constraint
        grounds: ["entities.Client.fields.household_head_id", "errors[ERR_HOUSEHOLD_HEAD_CYCLE]"]
        distinguishing_aspect: "PATCH setting household_head_id to the client's own id (or any descendant) is rejected with ERR_HOUSEHOLD_HEAD_CYCLE; a valid head is accepted."
        test_recipe:
          setup: ["clients A and B registered"]
          setup_api_calls:
            - call: "POST /clients"
              payload: { full_name: "Head A", preferred_language: "es", date_of_birth: "1980-01-01", household_size: 2 }
              as: IntakeSpecialist
              captures: { clia_id: $.data.id }
            - call: "POST /clients"
              payload: { full_name: "Member B", preferred_language: "es", date_of_birth: "2005-01-01", household_size: 2 }
              as: IntakeSpecialist
              captures: { clib_id: $.data.id }
          trigger:
            - call: "PATCH /clients/${clib_id}"
              payload: { household_head_id: "${clia_id}" }
              as: CaseManager
              captures: { b_head: $.data.household_head_id }
            - call: "PATCH /clients/${clia_id}"
              payload: { household_head_id: "${clib_id}" }
              as: CaseManager
              captures: { err: $.data.error_id }
          assert:
            - "B.head = A accepted (household_head_id == ${clia_id})"
            - "A.head = B rejected with ERR_HOUSEHOLD_HEAD_CYCLE (would close a 2-cycle)"

      - name: program_computed_field_input_ignored
        claim_type: computed_fields
        grounds: ["entities.Program.fields.enrolled_count"]
        distinguishing_aspect: "Caller-supplied enrolled_count is ignored; the created program reports enrolled_count 0 and status OPEN."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /programs"
              payload: { name: "ESOL X", kind: "ESOL", capacity: 5, base_fee_cents: 0, cost_per_completion_cents: 12000, enrolled_count: 99 }
              as: CenterAdmin
              captures: { p_count: $.data.enrolled_count, p_stat: $.data.status }
          assert:
            - "enrolled_count == 0 (input ignored) and status == OPEN"

      - name: fk_reverse_list_cases_by_client
        claim_type: parent_relationships
        grounds: ["entities.Case.fields.client_id"]
        distinguishing_aspect: "GET /cases?client_id= returns exactly that client's cases as an array (FK reverse reachability)."
        test_recipe:
          setup: ["mgr; two clients; two cases for client 1, one for client 2"]
          setup_api_calls:
            - call: "POST /staff"
              payload: { full_name: "Mgr One", role_level: "CASE_MANAGER", clearance_level: 2, weekly_appointment_capacity: 10 }
              as: CenterAdmin
              captures: { mgr1_id: $.data.id }
            - call: "POST /clients"
              payload: { full_name: "Uma One", preferred_language: "es", date_of_birth: "1990-01-01" }
              as: IntakeSpecialist
              captures: { cli1_id: $.data.id }
            - call: "POST /clients"
              payload: { full_name: "Uma Two", preferred_language: "es", date_of_birth: "1991-01-01" }
              as: IntakeSpecialist
              captures: { cli2_id: $.data.id }
            - call: "POST /cases"
              payload: { client_id: "${cli1_id}", assigned_manager_id: "${mgr1_id}" }
              as: CaseManager
              as_user_id: "${mgr1_id}"
            - call: "POST /cases"
              payload: { client_id: "${cli1_id}", assigned_manager_id: "${mgr1_id}" }
              as: CaseManager
              as_user_id: "${mgr1_id}"
            - call: "POST /cases"
              payload: { client_id: "${cli2_id}", assigned_manager_id: "${mgr1_id}" }
              as: CaseManager
              as_user_id: "${mgr1_id}"
          trigger:
            - call: "GET /cases"
              payload: { client_id: "${cli1_id}" }
              as: CaseManager
              as_user_id: "${mgr1_id}"
          assert:
            - "response is an array of length 2, every element's client_id == ${cli1_id}"

      - name: room_immutable_resource_shape
        claim_type: immutability
        grounds: ["entities.Room"]
        distinguishing_aspect: "Room has common_fields false: response carries id and created_at but no version/updated_at, and no update endpoint exists."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls:
            - call: "POST /rooms"
              payload: { name: "Room I", capacity: 12 }
              as: CenterAdmin
              captures: { room_id: $.data.id }
          trigger: []
          assert:
            - "Room.${room_id} has id and created_at; no version or updated_at field present"

  - section: state_machines
    instances:
      - name: referral_created_in_draft_initial_state
        claim_type: initial_state
        grounds: ["state_machines.Referral"]
        distinguishing_aspect: "A new referral starts DRAFT with sent_at null and holds no org slot (slots_used stays 0 until send)."
        test_recipe:
          setup: ["mgr; client; case; org capacity 2"]
          setup_api_calls:
            - call: "POST /staff"
              payload: { full_name: "Mgr One", role_level: "CASE_MANAGER", clearance_level: 2, weekly_appointment_capacity: 10 }
              as: CenterAdmin
              captures: { mgr1_id: $.data.id }
            - call: "POST /clients"
              payload: { full_name: "Vera Client", preferred_language: "ru", date_of_birth: "1993-03-03" }
              as: IntakeSpecialist
              captures: { cli_id: $.data.id }
            - call: "POST /cases"
              payload: { client_id: "${cli_id}", assigned_manager_id: "${mgr1_id}" }
              as: CaseManager
              as_user_id: "${mgr1_id}"
              captures: { case_id: $.data.id }
            - call: "POST /organizations"
              payload: { name: "Org D", service_categories: ["EDUCATION"], referral_capacity: 2, contact_email: "d@org.test" }
              as: CenterAdmin
              captures: { org_id: $.data.id }
          trigger:
            - call: "POST /referrals"
              payload: { case_id: "${case_id}", organization_id: "${org_id}", service_category: "EDUCATION" }
              as: CaseManager
              as_user_id: "${mgr1_id}"
              captures: { ref_stat: $.data.status, ref_sent: $.data.sent_at }
            - call: "GET /organizations/${org_id}"
              as: CaseManager
              as_user_id: "${mgr1_id}"
              captures: { org_used: $.data.referral_slots_used }
          assert:
            - "Referral status == DRAFT, sent_at == null"
            - "Organization.referral_slots_used == 0 (DRAFT holds no slot)"

      - name: terminal_lockdown_withdrawn_referral_rejects_send
        claim_type: invalid_transition
        grounds: ["state_machines.Referral.SENT_to_WITHDRAWN", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "WITHDRAWN is terminal: any further transition attempt fails ERR_INVALID_STATE and no side effects fire."
        test_recipe:
          setup: ["referral created and withdrawn from DRAFT"]
          setup_api_calls:
            - call: "POST /staff"
              payload: { full_name: "Mgr One", role_level: "CASE_MANAGER", clearance_level: 2, weekly_appointment_capacity: 10 }
              as: CenterAdmin
              captures: { mgr1_id: $.data.id }
            - call: "POST /clients"
              payload: { full_name: "Waleed Client", preferred_language: "ar", date_of_birth: "1988-08-08" }
              as: IntakeSpecialist
              captures: { cli_id: $.data.id }
            - call: "POST /cases"
              payload: { client_id: "${cli_id}", assigned_manager_id: "${mgr1_id}" }
              as: CaseManager
              as_user_id: "${mgr1_id}"
              captures: { case_id: $.data.id }
            - call: "POST /organizations"
              payload: { name: "Org E", service_categories: ["HOUSING"], referral_capacity: 2, contact_email: "e@org.test" }
              as: CenterAdmin
              captures: { org_id: $.data.id }
            - call: "POST /referrals"
              payload: { case_id: "${case_id}", organization_id: "${org_id}", service_category: "HOUSING" }
              as: CaseManager
              as_user_id: "${mgr1_id}"
              captures: { ref_id: $.data.id }
            - call: "POST /referrals/${ref_id}/withdraw"
              as: CaseManager
              as_user_id: "${mgr1_id}"
          trigger:
            - call: "POST /referrals/${ref_id}/send"
              as: CaseManager
              as_user_id: "${mgr1_id}"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE and Referral.${ref_id}.status remains WITHDRAWN"

      - name: appointment_complete_from_requested_rejected
        claim_type: invalid_transition
        grounds: ["state_machines.Appointment.CONFIRMED_to_COMPLETED", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "complete requires CONFIRMED; from REQUESTED it fails ERR_INVALID_STATE and completed_at stays null."
        test_recipe:
          setup: ["REQUESTED appointment 2026-08-10 09:00-09:30"]
          setup_api_calls:
            - call: "POST /staff"
              payload: { full_name: "Mgr One", role_level: "CASE_MANAGER", clearance_level: 2, weekly_appointment_capacity: 10 }
              as: CenterAdmin
              captures: { mgr1_id: $.data.id }
            - call: "POST /clients"
              payload: { full_name: "Xiu Client", preferred_language: "zh", date_of_birth: "1995-05-05" }
              as: IntakeSpecialist
              captures: { cli_id: $.data.id }
            - call: "POST /cases"
              payload: { client_id: "${cli_id}", assigned_manager_id: "${mgr1_id}" }
              as: CaseManager
              as_user_id: "${mgr1_id}"
              captures: { case_id: $.data.id }
            - call: "POST /appointments"
              payload: { case_id: "${case_id}", advocate_id: "${mgr1_id}", kind: "DOCUMENT_ID", starts_at: "2026-08-10T09:00:00Z", ends_at: "2026-08-10T09:30:00Z" }
              as: CaseManager
              as_user_id: "${mgr1_id}"
              captures: { appt_id: $.data.id }
          trigger:
            - call: "POST /appointments/${appt_id}/complete"
              as: CaseManager
              as_user_id: "${mgr1_id}"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE (REQUESTED -> COMPLETED not a declared transition)"

      - name: program_full_and_reopen_auto_transitions
        claim_type: side_effect_execution
        grounds: ["state_machines.Program.OPEN_to_FULL", "state_machines.Program.FULL_to_OPEN"]
        distinguishing_aspect: "Reaching enrolled_count == capacity auto-flips OPEN->FULL; a withdrawal auto-flips FULL->OPEN (bubble-up from child counters)."
        test_recipe:
          setup:
            - "Program capacity 1 fee 0; case ACTIVE (assessment verified, plan active); enrollment driven APPLIED->ELIGIBLE->ENROLLED"
          setup_api_calls:
            - call: "POST /staff"
              payload: { full_name: "Mgr One", role_level: "CASE_MANAGER", clearance_level: 2, weekly_appointment_capacity: 10 }
              as: CenterAdmin
              captures: { mgr1_id: $.data.id }
            - call: "POST /staff"
              payload: { full_name: "Mgr Two", role_level: "CASE_MANAGER", clearance_level: 2, weekly_appointment_capacity: 10 }
              as: CenterAdmin
              captures: { mgr2_id: $.data.id }
            - call: "POST /clients"
              payload: { full_name: "Yara Client", preferred_language: "ar", date_of_birth: "1994-04-04" }
              as: IntakeSpecialist
              captures: { cli_id: $.data.id }
            - call: "POST /cases"
              payload: { client_id: "${cli_id}", assigned_manager_id: "${mgr1_id}" }
              as: CaseManager
              as_user_id: "${mgr1_id}"
              captures: { case_id: $.data.id, case_v: $.data.version }
            - call: "POST /assessments"
              payload: { case_id: "${case_id}", housing_score: 1, employment_score: 1, education_score: 1, language_score: 1, health_score: 1 }
              as: CaseManager
              as_user_id: "${mgr1_id}"
              captures: { asmt_id: $.data.id }
            - call: "POST /assessments/${asmt_id}/submit"
              as: CaseManager
              as_user_id: "${mgr1_id}"
            - call: "POST /assessments/${asmt_id}/verify"
              as: CaseManager
              as_user_id: "${mgr2_id}"
            - call: "POST /cases/${case_id}/transition"
              payload: { to_status: "ASSESSED" }
              as: CaseManager
              as_user_id: "${mgr1_id}"
            - call: "POST /cases/${case_id}/transition"
              payload: { to_status: "PLANNING" }
              as: CaseManager
              as_user_id: "${mgr1_id}"
              captures: { case_v2: $.data.version }
            - call: "POST /cases/${case_id}/plans"
              payload: { title: "Plan P", budgeted_hours: 5, expected_case_version: "${case_v2}" }
              as: CaseManager
              as_user_id: "${mgr1_id}"
              captures: { plan_id: $.data.id }
            - call: "POST /plans/${plan_id}/transition"
              payload: { to_status: "ACTIVE" }
              as: CaseManager
              as_user_id: "${mgr1_id}"
            - call: "POST /cases/${case_id}/transition"
              payload: { to_status: "ACTIVE" }
              as: CaseManager
              as_user_id: "${mgr1_id}"
            - call: "POST /programs"
              payload: { name: "ESOL Mini", kind: "ESOL", capacity: 1, base_fee_cents: 0, cost_per_completion_cents: 12000 }
              as: CenterAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /program-enrollments"
              payload: { case_id: "${case_id}", program_id: "${prog_id}" }
              as: CaseManager
              as_user_id: "${mgr1_id}"
              captures: { enr_id: $.data.id }
            - call: "POST /program-enrollments/${enr_id}/transition"
              payload: { to_status: "ELIGIBLE" }
              as: CaseManager
              as_user_id: "${mgr1_id}"
          trigger:
            - call: "POST /program-enrollments/${enr_id}/transition"
              payload: { to_status: "ENROLLED" }
              as: CaseManager
              as_user_id: "${mgr1_id}"
            - call: "GET /programs/${prog_id}"
              as: CaseManager
              as_user_id: "${mgr1_id}"
              captures: { prog_full: $.data.status }
            - call: "POST /program-enrollments/${enr_id}/transition"
              payload: { to_status: "WITHDRAWN" }
              as: CaseManager
              as_user_id: "${mgr1_id}"
            - call: "GET /programs/${prog_id}"
              as: CaseManager
              as_user_id: "${mgr1_id}"
              captures: { prog_open: $.data.status, prog_count: $.data.enrolled_count }
          assert:
            - "After ENROLLED with capacity 1: Program.status == FULL"
            - "After WITHDRAWN: Program.status == OPEN and enrolled_count == 0"

      - name: workshop_waitlist_promotion_order
        claim_type: side_effect_execution
        grounds: ["calculations.workshop_seat_allocation", "state_machines.WorkshopEnrollment.WAITLISTED_to_ENROLLED"]
        distinguishing_aspect: "Cancelling the ENROLLED row promotes the waitlist head by lowest waitlist_position (e2 position 1 before e3 position 2); e3 remains WAITLISTED."
        test_recipe:
          setup: ["Session capacity 1; e1 ENROLLED; e2, e3 WAITLISTED positions 1 and 2"]
          setup_api_calls:
            - call: "POST /staff"
              payload: { full_name: "Mgr One", role_level: "CASE_MANAGER", clearance_level: 2, weekly_appointment_capacity: 10 }
              as: CenterAdmin
              captures: { mgr1_id: $.data.id }
            - call: "POST /rooms"
              payload: { name: "Room P", capacity: 20 }
              as: CenterAdmin
              captures: { room_id: $.data.id }
            - call: "POST /workshop-sessions"
              payload: { room_id: "${room_id}", title: "Promo Session", capacity: 1, starts_at: "2026-08-21T10:00:00Z", ends_at: "2026-08-21T11:00:00Z" }
              as: CaseManager
              as_user_id: "${mgr1_id}"
              captures: { sess_id: $.data.id }
            - call: "POST /clients"
              payload: { full_name: "Zed A", preferred_language: "es", date_of_birth: "1990-01-01" }
              as: IntakeSpecialist
              captures: { clia_id: $.data.id }
            - call: "POST /clients"
              payload: { full_name: "Zed B", preferred_language: "es", date_of_birth: "1990-01-02" }
              as: IntakeSpecialist
              captures: { clib_id: $.data.id }
            - call: "POST /clients"
              payload: { full_name: "Zed C", preferred_language: "es", date_of_birth: "1990-01-03" }
              as: IntakeSpecialist
              captures: { clic_id: $.data.id }
            - call: "POST /cases"
              payload: { client_id: "${clia_id}", assigned_manager_id: "${mgr1_id}" }
              as: CaseManager
              as_user_id: "${mgr1_id}"
              captures: { casea_id: $.data.id }
            - call: "POST /cases"
              payload: { client_id: "${clib_id}", assigned_manager_id: "${mgr1_id}" }
              as: CaseManager
              as_user_id: "${mgr1_id}"
              captures: { caseb_id: $.data.id }
            - call: "POST /cases"
              payload: { client_id: "${clic_id}", assigned_manager_id: "${mgr1_id}" }
              as: CaseManager
              as_user_id: "${mgr1_id}"
              captures: { casec_id: $.data.id }
            - call: "POST /workshop-enrollments"
              payload: { session_id: "${sess_id}", case_id: "${casea_id}" }
              as: CaseManager
              as_user_id: "${mgr1_id}"
              captures: { e1_id: $.data.id }
            - call: "POST /workshop-enrollments"
              payload: { session_id: "${sess_id}", case_id: "${caseb_id}" }
              as: CaseManager
              as_user_id: "${mgr1_id}"
              captures: { e2_id: $.data.id, e2_pos: $.data.waitlist_position }
            - call: "POST /workshop-enrollments"
              payload: { session_id: "${sess_id}", case_id: "${casec_id}" }
              as: CaseManager
              as_user_id: "${mgr1_id}"
              captures: { e3_id: $.data.id, e3_pos: $.data.waitlist_position }
          trigger:
            - call: "POST /workshop-enrollments/${e1_id}/cancel"
              as: CaseManager
              as_user_id: "${mgr1_id}"
            - call: "GET /workshop-enrollments/${e2_id}"
              as: CaseManager
              as_user_id: "${mgr1_id}"
              captures: { e2_stat: $.data.status }
            - call: "GET /workshop-enrollments/${e3_id}"
              as: CaseManager
              as_user_id: "${mgr1_id}"
              captures: { e3_stat: $.data.status }
            - call: "GET /workshop-sessions/${sess_id}"
              as: CaseManager
              as_user_id: "${mgr1_id}"
              captures: { s_enr: $.data.enrolled_count, s_wait: $.data.waitlist_count }
          assert:
            - "e2 (waitlist_position 1) promoted to ENROLLED; e3 (position 2) remains WAITLISTED"
            - "Session: enrolled_count == 1, waitlist_count == 1 (cancel freed one seat and promotion consumed it)"

      - name: screening_reopen_cycle_clears_results
        claim_type: valid_transition
        grounds: ["state_machines.BenefitScreening.SCREENED_to_DRAFT"]
        distinguishing_aspect: "SCREENED -> DRAFT is a legal cycle that clears tier/ratio/eligible_programs; run can then recompute from DRAFT."
        test_recipe:
          setup: ["screening run to SCREENED (household 1, income 1,000,000 => ratio 0.6640 TIER_A)"]
          setup_api_calls:
            - call: "POST /staff"
              payload: { full_name: "Mgr One", role_level: "CASE_MANAGER", clearance_level: 2, weekly_appointment_capacity: 10 }
              as: CenterAdmin
              captures: { mgr1_id: $.data.id }
            - call: "POST /clients"
              payload: { full_name: "Amir Client", preferred_language: "fa", date_of_birth: "1991-09-09", household_size: 1 }
              as: IntakeSpecialist
              captures: { cli_id: $.data.id }
            - call: "POST /cases"
              payload: { client_id: "${cli_id}", assigned_manager_id: "${mgr1_id}" }
              as: CaseManager
              as_user_id: "${mgr1_id}"
              captures: { case_id: $.data.id }
            - call: "POST /benefit-screenings"
              payload: { case_id: "${case_id}", stated_annual_income_cents: 1000000 }
              as: CaseManager
              as_user_id: "${mgr1_id}"
              captures: { scr_id: $.data.id }
            - call: "POST /benefit-screenings/${scr_id}/run"
              as: CaseManager
              as_user_id: "${mgr1_id}"
          trigger:
            - call: "POST /benefit-screenings/${scr_id}/reopen"
              as: CaseManager
              as_user_id: "${mgr1_id}"
              captures: { s_stat: $.data.status, s_tier: $.data.tier, s_progs: $.data.eligible_programs }
          assert:
            - "status == DRAFT, tier == null, eligible_programs == [] after reopen"
            - "A subsequent run from DRAFT succeeds again (cycle)"

      - name: funder_report_returned_resubmit_cycle
        claim_type: valid_transition
        grounds: ["state_machines.FunderReport"]
        distinguishing_aspect: "DRAFT -> SUBMITTED -> RETURNED -> (regenerate) -> SUBMITTED -> ACCEPTED exercises the report revision loop and records submitted_by/reviewed_by."
        test_recipe:
          setup: ["empty-period DRAFT report for [2026-08-01, 2026-09-01) with a single 100% stream"]
          setup_api_calls:
            - call: "POST /funder-reports"
              payload: { period_start: "2026-08-01T00:00:00Z", period_end: "2026-09-01T00:00:00Z", funding_streams: [ { stream_name: "City", share_pct: 100 } ] }
              as: CenterAdmin
              captures: { rep_id: $.data.id }
          trigger:
            - call: "POST /funder-reports/${rep_id}/submit"
              as: CenterAdmin
            - call: "POST /funder-reports/${rep_id}/review"
              payload: { decision: "RETURNED" }
              as: FunderAuditor
              captures: { st1: $.data.status }
            - call: "POST /funder-reports/${rep_id}/regenerate"
              as: CenterAdmin
            - call: "POST /funder-reports/${rep_id}/submit"
              as: CenterAdmin
              captures: { st2: $.data.status }
            - call: "POST /funder-reports/${rep_id}/review"
              payload: { decision: "ACCEPTED" }
              as: FunderAuditor
              captures: { st3: $.data.status }
          assert:
            - "statuses in order: RETURNED, then SUBMITTED after resubmission, then ACCEPTED"
            - "reviewed_by_id set on review; submit from ACCEPTED would fail ERR_INVALID_STATE (terminal)"

  - section: calculations
    instances:
