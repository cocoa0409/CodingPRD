scaffold_corner_design:

  # =========================================================================
  - section: entities
    instances:
      - name: family_create_returns_201_with_fields
        claim_type: Creation
        grounds: [entities.Family, endpoints]
        distinguishing_aspect: "POST /ccdf/families with all required fields returns 201 and a Family with status=PENDING and total_copay_charged_cents=0."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /ccdf/families"
              payload: { applicant_name: "New Fam", household_size: 4, monthly_gross_income_cents: 300000, monthly_self_employment_income_cents: 0, state_code: "CA" }
              as: CaseWorker
              captures: { fam_id: $.data.id }
          assert:
            - "response.status == 201"
            - "Family.${fam_id}.status == PENDING"
            - "Family.${fam_id}.household_size == 4"
            - "Family.${fam_id}.total_copay_charged_cents == 0"
            - "Family.${fam_id}.version == 1"

      - name: family_get_not_found_returns_404
        claim_type: Not Found
        grounds: [entities.Family, "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET /ccdf/families/{unknown uuid} returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /ccdf/families/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: CaseWorker
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 404"
            - "response.data.error_id == ERR_NOT_FOUND"

      - name: family_create_missing_required_returns_invalid_request
        claim_type: Required Fields
        grounds: [entities.Family.fields.applicant_name, "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "POST /ccdf/families omitting applicant_name returns ERR_VALIDATION (400)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /ccdf/families"
              payload: { household_size: 3, monthly_gross_income_cents: 250000, state_code: "CA" }
              as: CaseWorker
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 400"
            - "response.data.error_id == ERR_VALIDATION"

      - name: family_self_employment_income_defaults_zero
        claim_type: Defaults
        grounds: [entities.Family.fields.monthly_self_employment_income_cents]
        distinguishing_aspect: "Omitting monthly_self_employment_income_cents applies default 0."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /ccdf/families"
              payload: { applicant_name: "Def Fam", household_size: 3, monthly_gross_income_cents: 250000, state_code: "CA" }
              as: CaseWorker
              captures: { fam_id: $.data.id }
          assert:
            - "Family.${fam_id}.monthly_self_employment_income_cents == 0"

      - name: provider_create_starts_pending_verification
        claim_type: System Fields
        grounds: [entities.Provider.fields.license_status, entities.Provider.fields.total_net_paid_cents]
        distinguishing_aspect: "POST /ccdf/providers ignores any license_status input and starts PENDING_VERIFICATION with total_net_paid_cents=0."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /ccdf/providers"
              payload: { name: "P One", provider_type: "FAMILY_HOME", published_daily_rate_cents: 4000, license_expiry_date: "2027-01-01T00:00:00Z", state_code: "CA" }
              as: ProgramAdmin
              captures: { prov_id: $.data.id }
          assert:
            - "Provider.${prov_id}.license_status == PENDING_VERIFICATION"
            - "Provider.${prov_id}.total_net_paid_cents == 0"

      - name: income_standard_create_returns_201
        claim_type: Creation
        grounds: [entities.IncomeStandard]
        distinguishing_aspect: "POST /ccdf/income-standards returns 201 with stored limits."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /ccdf/income-standards"
              payload: { household_size: 2, entry_monthly_limit_cents: 350000, exit_monthly_limit_cents: 450000, state_code: "CA" }
              as: ProgramAdmin
              captures: { is_id: $.data.id }
          assert:
            - "response.status == 201"
            - "IncomeStandard.${is_id}.entry_monthly_limit_cents == 350000"

  # =========================================================================
  - section: state_machines
    instances:
      - name: determination_finalize_twice_returns_409
        claim_type: Idempotency
        grounds: [state_machines.EligibilityDetermination.PENDING_to_APPROVED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Finalizing an already-APPROVED determination again returns ERR_INVALID_STATE (409); no state change."
        test_recipe:
          setup: ["APPROVED INITIAL determination"]
          setup_api_calls:
            - call: "POST /ccdf/income-standards"
              payload: { household_size: 3, entry_monthly_limit_cents: 400000, exit_monthly_limit_cents: 500000, state_code: "CA" }
              as: ProgramAdmin
            - call: "POST /ccdf/families"
              payload: { applicant_name: "A Fam", household_size: 3, monthly_gross_income_cents: 250000, monthly_self_employment_income_cents: 0, state_code: "CA" }
              as: CaseWorker
              captures: { fam_id: $.data.id }
            - call: "POST /ccdf/parent-activities"
              payload: { family_id: "${fam_id}", activity_type: "WORK", weekly_hours: 40 }
              as: CaseWorker
            - call: "POST /ccdf/determinations"
              payload: { family_id: "${fam_id}", determination_type: "INITIAL" }
              as: CaseWorker
              captures: { det_id: $.data.id }
            - call: "POST /ccdf/determinations/${det_id}/finalize"
              payload: {}
              as: CaseWorker
          trigger:
            - call: "POST /ccdf/determinations/${det_id}/finalize"
              payload: {}
              as: CaseWorker
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_INVALID_STATE"

      - name: authorization_activate_from_terminated_returns_409
        claim_type: Terminal State Lockdown
        grounds: [state_machines.Authorization.PENDING_to_ACTIVE, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Activating a TERMINATED authorization returns ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["a PENDING Authorization then TERMINATED"]
          setup_api_calls:
            - call: "POST /ccdf/income-standards"
              payload: { household_size: 3, entry_monthly_limit_cents: 400000, exit_monthly_limit_cents: 500000, state_code: "CA" }
              as: ProgramAdmin
            - call: "POST /ccdf/rate-ceilings"
              payload: { provider_type: "CENTER", care_level: "TODDLER", max_daily_rate_cents: 5000, effective_start: "2020-01-01T00:00:00Z", effective_end: "2030-01-01T00:00:00Z", state_code: "CA" }
              as: ProgramAdmin
            - call: "POST /ccdf/families"
              payload: { applicant_name: "A Fam", household_size: 3, monthly_gross_income_cents: 250000, monthly_self_employment_income_cents: 0, state_code: "CA" }
              as: CaseWorker
              captures: { fam_id: $.data.id }
            - call: "POST /ccdf/parent-activities"
              payload: { family_id: "${fam_id}", activity_type: "WORK", weekly_hours: 40 }
              as: CaseWorker
            - call: "POST /ccdf/determinations"
              payload: { family_id: "${fam_id}", determination_type: "INITIAL" }
              as: CaseWorker
              captures: { det_id: $.data.id }
            - call: "POST /ccdf/determinations/${det_id}/finalize"
              payload: {}
              as: CaseWorker
            - call: "POST /ccdf/providers"
              payload: { name: "Sunny Center", provider_type: "CENTER", published_daily_rate_cents: 6000, license_expiry_date: "2027-01-01T00:00:00Z", state_code: "CA" }
              as: ProgramAdmin
              captures: { prov_id: $.data.id }
            - call: "POST /ccdf/providers/${prov_id}/license"
              payload: { action: "VERIFY" }
              as: ProgramAdmin
            - call: "GET /ccdf/families/${fam_id}"
              payload: {}
              as: CaseWorker
              captures: { fam_v: $.data.version }
            - call: "POST /ccdf/authorizations"
              payload: { family_id: "${fam_id}", provider_id: "${prov_id}", determination_id: "${det_id}", child_name: "Kid One", care_level: "TODDLER", start_date: "2026-03-01T00:00:00Z", end_date: "2026-09-01T00:00:00Z", authorized_days_per_month: 22, expected_family_version: "${fam_v}" }
              as: CaseWorker
              captures: { auth_id: $.data.id }
            - call: "POST /ccdf/authorizations/${auth_id}/terminate"
              payload: {}
              as: CaseWorker
          trigger:
            - call: "POST /ccdf/authorizations/${auth_id}/activate"
              payload: {}
              as: CaseWorker
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_INVALID_STATE"

      - name: provider_verify_from_licensed_returns_409
        claim_type: Invalid Transitions
        grounds: [state_machines.Provider.PENDING_VERIFICATION_to_LICENSED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "VERIFY on an already-LICENSED provider returns ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["a LICENSED provider"]
          setup_api_calls:
            - call: "POST /ccdf/providers"
              payload: { name: "Sunny Center", provider_type: "CENTER", published_daily_rate_cents: 6000, license_expiry_date: "2027-01-01T00:00:00Z", state_code: "CA" }
              as: ProgramAdmin
              captures: { prov_id: $.data.id }
            - call: "POST /ccdf/providers/${prov_id}/license"
              payload: { action: "VERIFY" }
              as: ProgramAdmin
          trigger:
            - call: "POST /ccdf/providers/${prov_id}/license"
              payload: { action: "VERIFY" }
              as: ProgramAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_INVALID_STATE"

      - name: provider_renew_after_clock_expiry_relicenses
        claim_type: cyclic
        grounds: [state_machines.Provider.LICENSED_to_EXPIRED, state_machines.Provider.EXPIRED_to_LICENSED]
        distinguishing_aspect: "Advancing the clock past license_expiry_date sweeps the provider to EXPIRED; RENEW with a future expiry returns it to LICENSED (EXPIRED->LICENSED cycle)."
        test_recipe:
          setup: ["a LICENSED provider with license_expiry 2027-01-01"]
          setup_api_calls:
            - call: "POST /ccdf/providers"
              payload: { name: "Sunny Center", provider_type: "CENTER", published_daily_rate_cents: 6000, license_expiry_date: "2027-01-01T00:00:00Z", state_code: "CA" }
              as: ProgramAdmin
              captures: { prov_id: $.data.id }
            - call: "POST /ccdf/providers/${prov_id}/license"
              payload: { action: "VERIFY" }
              as: ProgramAdmin
            - call: "POST /ccdf/_clock/set_current_utc"
              payload: { to_iso8601: "2027-06-01T00:00:00Z" }
              as: ProgramAdmin
          trigger:
            - call: "POST /ccdf/providers/${prov_id}/license"
              payload: { action: "RENEW", license_expiry_date: "2028-01-01T00:00:00Z" }
              as: ProgramAdmin
          assert:
            - "Provider.${prov_id}.license_status == LICENSED"
            - "Provider.${prov_id}.license_expiry_date == 2028-01-01T00:00:00Z"

      - name: authorization_expires_on_clock_advance
        claim_type: compound
        grounds: [state_machines.Authorization.ACTIVE_to_EXPIRED, endpoints]
        distinguishing_aspect: "Advancing the clock past end_date sweeps an ACTIVE authorization to EXPIRED."
        test_recipe:
          setup: ["ACTIVE Authorization end_date 2026-09-01"]
          setup_api_calls:
            - call: "POST /ccdf/income-standards"
              payload: { household_size: 3, entry_monthly_limit_cents: 400000, exit_monthly_limit_cents: 500000, state_code: "CA" }
              as: ProgramAdmin
            - call: "POST /ccdf/rate-ceilings"
              payload: { provider_type: "CENTER", care_level: "TODDLER", max_daily_rate_cents: 5000, effective_start: "2020-01-01T00:00:00Z", effective_end: "2030-01-01T00:00:00Z", state_code: "CA" }
              as: ProgramAdmin
            - call: "POST /ccdf/families"
              payload: { applicant_name: "A Fam", household_size: 3, monthly_gross_income_cents: 250000, monthly_self_employment_income_cents: 0, state_code: "CA" }
              as: CaseWorker
              captures: { fam_id: $.data.id }
            - call: "POST /ccdf/parent-activities"
              payload: { family_id: "${fam_id}", activity_type: "WORK", weekly_hours: 40 }
              as: CaseWorker
            - call: "POST /ccdf/determinations"
              payload: { family_id: "${fam_id}", determination_type: "INITIAL" }
              as: CaseWorker
              captures: { det_id: $.data.id }
            - call: "POST /ccdf/determinations/${det_id}/finalize"
              payload: {}
              as: CaseWorker
            - call: "POST /ccdf/providers"
              payload: { name: "Sunny Center", provider_type: "CENTER", published_daily_rate_cents: 6000, license_expiry_date: "2027-01-01T00:00:00Z", state_code: "CA" }
              as: ProgramAdmin
              captures: { prov_id: $.data.id }
            - call: "POST /ccdf/providers/${prov_id}/license"
              payload: { action: "VERIFY" }
              as: ProgramAdmin
            - call: "GET /ccdf/families/${fam_id}"
              payload: {}
              as: CaseWorker
              captures: { fam_v: $.data.version }
            - call: "POST /ccdf/authorizations"
              payload: { family_id: "${fam_id}", provider_id: "${prov_id}", determination_id: "${det_id}", child_name: "Kid One", care_level: "TODDLER", start_date: "2026-03-01T00:00:00Z", end_date: "2026-09-01T00:00:00Z", authorized_days_per_month: 22, expected_family_version: "${fam_v}" }
              as: CaseWorker
              captures: { auth_id: $.data.id }
            - call: "POST /ccdf/authorizations/${auth_id}/activate"
              payload: {}
              as: CaseWorker
          trigger:
            - call: "POST /ccdf/_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-01T00:00:00Z" }
              as: ProgramAdmin
          assert:
            - "Authorization.${auth_id}.status == EXPIRED"

  # =========================================================================
  - section: calculations
    instances:
      - name: authorized_rate_takes_provider_rate_when_below_ceiling
        claim_type: Correct Result
        grounds: [calculations.authorized_daily_rate, entities.Authorization.fields.authorized_daily_rate_cents]
        distinguishing_aspect: "Provider published 4500 < ceiling 5000 => authorized_daily_rate_cents == 4500 (min picks the provider rate)."
        test_recipe:
          setup: ["provider published 4500; CENTER/TODDLER ceiling 5000; PENDING authorization"]
          setup_api_calls:
            - call: "POST /ccdf/income-standards"
              payload: { household_size: 3, entry_monthly_limit_cents: 400000, exit_monthly_limit_cents: 500000, state_code: "CA" }
              as: ProgramAdmin
            - call: "POST /ccdf/rate-ceilings"
              payload: { provider_type: "CENTER", care_level: "TODDLER", max_daily_rate_cents: 5000, effective_start: "2020-01-01T00:00:00Z", effective_end: "2030-01-01T00:00:00Z", state_code: "CA" }
              as: ProgramAdmin
            - call: "POST /ccdf/families"
              payload: { applicant_name: "A Fam", household_size: 3, monthly_gross_income_cents: 250000, monthly_self_employment_income_cents: 0, state_code: "CA" }
              as: CaseWorker
              captures: { fam_id: $.data.id }
            - call: "POST /ccdf/parent-activities"
              payload: { family_id: "${fam_id}", activity_type: "WORK", weekly_hours: 40 }
              as: CaseWorker
            - call: "POST /ccdf/determinations"
              payload: { family_id: "${fam_id}", determination_type: "INITIAL" }
              as: CaseWorker
              captures: { det_id: $.data.id }
            - call: "POST /ccdf/determinations/${det_id}/finalize"
              payload: {}
              as: CaseWorker
            - call: "POST /ccdf/providers"
              payload: { name: "Cheap Center", provider_type: "CENTER", published_daily_rate_cents: 4500, license_expiry_date: "2027-01-01T00:00:00Z", state_code: "CA" }
              as: ProgramAdmin
              captures: { prov_id: $.data.id }
            - call: "POST /ccdf/providers/${prov_id}/license"
              payload: { action: "VERIFY" }
              as: ProgramAdmin
            - call: "GET /ccdf/families/${fam_id}"
              payload: {}
              as: CaseWorker
              captures: { fam_v: $.data.version }
          trigger:
            - call: "POST /ccdf/authorizations"
              payload: { family_id: "${fam_id}", provider_id: "${prov_id}", determination_id: "${det_id}", child_name: "Kid One", care_level: "TODDLER", start_date: "2026-03-01T00:00:00Z", end_date: "2026-09-01T00:00:00Z", authorized_days_per_month: 22, expected_family_version: "${fam_v}" }
              as: CaseWorker
              captures: { auth_id: $.data.id }
          assert:
            - "Authorization.${auth_id}.authorized_daily_rate_cents == 4500"

      - name: redetermination_continuity_above_entry_below_exit_eligible
        claim_type: Variant Selection
        grounds: [calculations.copay_determination, entities.EligibilityDetermination.fields.income_eligible, entities.EligibilityDetermination.fields.monthly_copay_cents]
        distinguishing_aspect: "REDETERMINATION with income 450000 (above entry 400000, below exit 500000) is income_eligible via the exit limit (continuity of care), band ratio 1.125 -> 10% -> copay 45000."
        test_recipe:
          setup: ["Family gross 450000, self 0, 40h activity; REDETERMINATION determination"]
          setup_api_calls:
            - call: "POST /ccdf/income-standards"
              payload: { household_size: 3, entry_monthly_limit_cents: 400000, exit_monthly_limit_cents: 500000, state_code: "CA" }
              as: ProgramAdmin
            - call: "POST /ccdf/families"
              payload: { applicant_name: "Cont Fam", household_size: 3, monthly_gross_income_cents: 450000, monthly_self_employment_income_cents: 0, state_code: "CA" }
              as: CaseWorker
              captures: { fam_id: $.data.id }
            - call: "POST /ccdf/parent-activities"
              payload: { family_id: "${fam_id}", activity_type: "WORK", weekly_hours: 40 }
              as: CaseWorker
            - call: "POST /ccdf/determinations"
              payload: { family_id: "${fam_id}", determination_type: "REDETERMINATION" }
              as: CaseWorker
              captures: { det_id: $.data.id }
          trigger:
            - call: "POST /ccdf/determinations/${det_id}/finalize"
              payload: {}
              as: CaseWorker
          assert:
            - "EligibilityDetermination.${det_id}.income_eligible == true"
            - "EligibilityDetermination.${det_id}.result == APPROVED"
            - "EligibilityDetermination.${det_id}.monthly_copay_cents == 45000"

      - name: activity_hours_below_minimum_denies_determination
        claim_type: Correct Result
        grounds: [calculations.copay_determination, entities.EligibilityDetermination.fields.activity_eligible]
        distinguishing_aspect: "Total weekly activity hours 10 < MIN_WEEKLY_ACTIVITY_HOURS 20 => activity_eligible false and result DENIED even though income is under the limit."
        test_recipe:
          setup: ["Family gross 250000 (income-eligible) but only 10 weekly activity hours"]
          setup_api_calls:
            - call: "POST /ccdf/income-standards"
              payload: { household_size: 3, entry_monthly_limit_cents: 400000, exit_monthly_limit_cents: 500000, state_code: "CA" }
              as: ProgramAdmin
            - call: "POST /ccdf/families"
              payload: { applicant_name: "LowHrs Fam", household_size: 3, monthly_gross_income_cents: 250000, monthly_self_employment_income_cents: 0, state_code: "CA" }
              as: CaseWorker
              captures: { fam_id: $.data.id }
            - call: "POST /ccdf/parent-activities"
              payload: { family_id: "${fam_id}", activity_type: "JOB_SEARCH", weekly_hours: 10 }
              as: CaseWorker
            - call: "POST /ccdf/determinations"
              payload: { family_id: "${fam_id}", determination_type: "INITIAL" }
              as: CaseWorker
              captures: { det_id: $.data.id }
          trigger:
            - call: "POST /ccdf/determinations/${det_id}/finalize"
              payload: {}
              as: CaseWorker
          assert:
            - "EligibilityDetermination.${det_id}.activity_eligible == false"
            - "EligibilityDetermination.${det_id}.income_eligible == true"
            - "EligibilityDetermination.${det_id}.result == DENIED"

  # =========================================================================
  - section: validations
    instances:
      - name: duplicate_attendance_same_month_returns_409
        claim_type: Violation to Error
        grounds: ["validations[priority=11]", "errors[ERR_DUPLICATE_ATTENDANCE]"]
        distinguishing_aspect: "A second AttendanceRecord for the same (authorization_id, service_month) returns ERR_DUPLICATE_ATTENDANCE (409)."
        test_recipe:
          setup: ["ACTIVE Authorization with a SUBMITTED 2026-03 attendance record"]
          setup_api_calls:
            - call: "POST /ccdf/income-standards"
              payload: { household_size: 3, entry_monthly_limit_cents: 400000, exit_monthly_limit_cents: 500000, state_code: "CA" }
              as: ProgramAdmin
            - call: "POST /ccdf/rate-ceilings"
              payload: { provider_type: "CENTER", care_level: "TODDLER", max_daily_rate_cents: 5000, effective_start: "2020-01-01T00:00:00Z", effective_end: "2030-01-01T00:00:00Z", state_code: "CA" }
              as: ProgramAdmin
            - call: "POST /ccdf/families"
              payload: { applicant_name: "A Fam", household_size: 3, monthly_gross_income_cents: 250000, monthly_self_employment_income_cents: 0, state_code: "CA" }
              as: CaseWorker
              captures: { fam_id: $.data.id }
            - call: "POST /ccdf/parent-activities"
              payload: { family_id: "${fam_id}", activity_type: "WORK", weekly_hours: 40 }
              as: CaseWorker
            - call: "POST /ccdf/determinations"
              payload: { family_id: "${fam_id}", determination_type: "INITIAL" }
              as: CaseWorker
              captures: { det_id: $.data.id }
            - call: "POST /ccdf/determinations/${det_id}/finalize"
              payload: {}
              as: CaseWorker
            - call: "POST /ccdf/providers"
              payload: { name: "Sunny Center", provider_type: "CENTER", published_daily_rate_cents: 6000, license_expiry_date: "2027-01-01T00:00:00Z", state_code: "CA" }
              as: ProgramAdmin
              captures: { prov_id: $.data.id }
            - call: "POST /ccdf/providers/${prov_id}/license"
              payload: { action: "VERIFY" }
              as: ProgramAdmin
            - call: "GET /ccdf/families/${fam_id}"
              payload: {}
              as: CaseWorker
              captures: { fam_v: $.data.version }
            - call: "POST /ccdf/authorizations"
              payload: { family_id: "${fam_id}", provider_id: "${prov_id}", determination_id: "${det_id}", child_name: "Kid One", care_level: "TODDLER", start_date: "2026-03-01T00:00:00Z", end_date: "2026-09-01T00:00:00Z", authorized_days_per_month: 22, expected_family_version: "${fam_v}" }
              as: CaseWorker
              captures: { auth_id: $.data.id }
            - call: "POST /ccdf/authorizations/${auth_id}/activate"
              payload: {}
              as: CaseWorker
            - call: "POST /ccdf/attendance-records"
              payload: { authorization_id: "${auth_id}", service_month: "2026-03", present_days: 18, absent_days: 3 }
              as: Provider
              as_user_id: "${prov_id}"
              captures: { att_id: $.data.id }
          trigger:
            - call: "POST /ccdf/attendance-records"
              payload: { authorization_id: "${auth_id}", service_month: "2026-03", present_days: 10, absent_days: 1 }
              as: Provider
              as_user_id: "${prov_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_DUPLICATE_ATTENDANCE"

      - name: invalid_attendance_days_on_approve_returns_422
        claim_type: Violation to Error
