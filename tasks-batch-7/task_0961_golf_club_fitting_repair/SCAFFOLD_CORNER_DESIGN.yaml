        distinguishing_aspect: "a spec claim filed 200 days after delivery lands in the 91..365 band: coverage_pct 50 and covered_estimate_cents 1150 on a 2300 final price."
        test_recipe:
          setup: ["spec delivered at 2026-05-10T12:00:00Z with final_price_cents 2300; clock advanced to 2026-11-26T12:00:00Z (200 days)"]
          setup_api_calls:
            - call: "POST /golf-shop/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-10T09:00:00Z" }
              as: ShopAdmin
            - call: "POST /golf-shop/customers"
              payload: { full_name: "Mel Marsh", email: "mel@example.com" }
              as: ShopAdmin
              captures: { c_id: $.data.id }
            - call: "POST /golf-shop/staff"
              payload: { full_name: "Fred Fitter", staff_role: "FITTING_SPECIALIST" }
              as: ShopAdmin
              captures: { fs_id: $.data.id }
