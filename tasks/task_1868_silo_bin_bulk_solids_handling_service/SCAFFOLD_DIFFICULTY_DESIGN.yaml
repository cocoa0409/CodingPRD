              as: SafetyOfficer
              captures: { err12: $.data.error_id }
          assert:
            - "error_id == ERR_INBOUND_DELIVERY_PENDING — a DISPATCHED order exists for vessel ${vp}"
            - "permit ${p12} remains DRAFT"

      - name: receive_blocked_by_out_of_tolerance_scale
        grounds:
          - state_machines.ReplenishmentOrder.DISPATCHED_to_RECEIVED
          - entities.Vessel.fields.scale_status
          - errors[ERR_SCALE_OUT_OF_TOLERANCE]
        distinguishing_aspect: |
          Entity pair ReplenishmentOrder -> Vessel (different from
          EntryPermit -> ReplenishmentOrder above): receiving a DISPATCHED
          order is rejected while the vessel's scale_status is
          OUT_OF_TOLERANCE, set by a failed ScaleCalibration on the vessel.
        test_recipe:
          setup:
            - "Site S13. Vessel VQ capacity 100 reorder 30 target 90 TARGET_FILL, error_basis OF_READING. Reading 25.0 auto-created an order; order DISPATCHED. A failing calibration then sets scale_status OUT_OF_TOLERANCE."
          setup_api_calls:
            - call: "POST /sites"
              payload: { name: "Site Thirteen", state_code: "NE" }
              as: ServiceManager
              captures: { s13: $.data.id }
            - call: "POST /vessels"
              payload: { site_id: "${s13}", name: "SILO-Q", vessel_kind: "SILO", capacity_tons: 100, material_name: "barley", reorder_point_pct: 30, target_fill_pct: 90, error_basis: "OF_READING" }
              as: ServiceManager
              captures: { vq: $.data.id }
            - call: "POST /technicians"
              payload: { name: "Tech Eight", weekly_capacity_hours: 40 }
              as: ServiceManager
              captures: { tt8: $.data.id }
            - call: "POST /level-readings"
              payload: { vessel_id: "${vq}", measured_at: "2026-08-02T00:00:00Z", level_pct: 25.0 }
              as: PlantOperator
              as_user_id: "${s13}"
            - call: "GET /replenishment-orders"
              payload: { vessel_id: "${vq}", status: "TRIGGERED" }
              as: ServiceManager
              captures: { o13: "$.data[0].id" }
            - call: "POST /replenishment-orders/${o13}/dispatch"
              payload: {}
              as: ServiceManager
            - call: "POST /scale-calibrations"
              payload: { vessel_id: "${vq}", tested_at: "2026-08-02T12:00:00Z", test_weight_tons: 20.0, indicated_tons: 20.06 }
              as: Technician
              as_user_id: "${tt8}"
          trigger:
            - call: "POST /replenishment-orders/${o13}/receive"
              payload: { delivered_tons: 10.0, received_at: "2026-08-03T00:00:00Z" }
              as: Technician
              as_user_id: "${tt8}"
              captures: { err13: $.data.error_id }
          assert:
            - "error_id == ERR_SCALE_OUT_OF_TOLERANCE (calibration 0.300 pct > 0.25 set OUT_OF_TOLERANCE)"
            - "order ${o13} remains DISPATCHED"
            - "GET /vessels/${vq} shows current_inventory_tons == 25.0 (unchanged)"

