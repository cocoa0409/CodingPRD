scaffold_difficulty_design:
  # ===========================================================================
  # Rule 1 — Dual-variant calculations across different entity domains
  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: quorum_provisional_includes_open_challenged_final_excludes
        grounds:
          - calculations.quorum_calculation
          - entities.Meeting.fields.outstanding_shares
          - state_machines.VoteChallenge.OPEN_to_UPHELD
        distinguishing_aspect: |
          On the Meeting entity domain, the PROVISIONAL quorum variant counts VALIDATED votes
          that carry an OPEN challenge while the FINAL variant excludes them, so identical raw
          data yields quorum_met true (PROVISIONAL) and false (FINAL).
        test_recipe:
          setup:
            - "ANNUAL meeting, outstanding_shares 10000, quorum_threshold_pct 0.5 (threshold_bp 5000)"
            - "a1 holds 4500 COMMON, a2 holds 1500 COMMON; both voted FOR via INTERNET"
            - "meeting convened (clock advanced to meeting_datetime); a2's vote carries an OPEN challenge"
          setup_api_calls:
            - call: "POST /proxy/meetings"
              payload: { company_name: "Acme Corp", ticker: "ACME", meeting_type: "ANNUAL", record_date: "2026-08-10", meeting_datetime: "2026-09-15T16:00:00Z", meeting_mode: "VIRTUAL", quorum_threshold_pct: 0.5, outstanding_shares: 10000 }
              as: ProxyAdministrator
              captures: { m_id: $.data.id }
            - call: "POST /proxy/shareholder-accounts"
              payload: { meeting_id: "${m_id}", holder_name: "Holder One", account_number: "A-1001", share_class: "COMMON", shares_held: 4500 }
              as: TransferAgent
              captures: { a1_id: $.data.id, cn1: $.data.control_number }
            - call: "POST /proxy/shareholder-accounts"
              payload: { meeting_id: "${m_id}", holder_name: "Holder Two", account_number: "A-1002", share_class: "COMMON", shares_held: 1500 }
              as: TransferAgent
              captures: { a2_id: $.data.id, cn2: $.data.control_number }
            - call: "POST /proxy/meetings/${m_id}/lock-record-date"
              payload: {}
              as: ProxyAdministrator
            - call: "POST /proxy/proposals"
              payload: { meeting_id: "${m_id}", proposal_number: 1, title: "Say on pay", proposal_type: "SAY_ON_PAY", vote_standard: "MAJORITY_OF_VOTES_CAST" }
              as: ProxyAdministrator
              captures: { p1_id: $.data.id }
            - call: "POST /proxy/material-distributions/generate"
              payload: { meeting_id: "${m_id}" }
              as: ProxyAdministrator
            - call: "POST /proxy/meetings/${m_id}/open-voting"
              payload: {}
              as: ProxyAdministrator
            - call: "POST /proxy/vote-instructions"
              payload: { meeting_id: "${m_id}", proposal_id: "${p1_id}", account_id: "${a1_id}", channel: "INTERNET", choice: "FOR", control_number: "${cn1}" }
              as: Shareholder
              as_user_id: "${a1_id}"
            - call: "POST /proxy/vote-instructions"
              payload: { meeting_id: "${m_id}", proposal_id: "${p1_id}", account_id: "${a2_id}", channel: "INTERNET", choice: "FOR", control_number: "${cn2}" }
              as: Shareholder
              as_user_id: "${a2_id}"
              captures: { v2_id: $.data.id }
            - call: "POST /proxy/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-15T16:00:00Z" }
              as: ProxyAdministrator
            - call: "POST /proxy/meetings/${m_id}/convene"
              payload: {}
              as: ProxyAdministrator
            - call: "POST /proxy/vote-challenges"
              payload: { meeting_id: "${m_id}", vote_instruction_id: "${v2_id}", reason: "Beneficial ownership dispute" }
              as: InspectorOfElection
          trigger:
            - call: "GET /proxy/meetings/${m_id}/quorum?variant=PROVISIONAL"
              as: InspectorOfElection
              captures: { prov_shares: $.data.shares_present, prov_met: $.data.quorum_met, prov_bp: $.data.quorum_pct_bp }
            - call: "GET /proxy/meetings/${m_id}/quorum?variant=FINAL"
              as: InspectorOfElection
              captures: { fin_shares: $.data.shares_present, fin_met: $.data.quorum_met, fin_bp: $.data.quorum_pct_bp, fin_thr: $.data.threshold_bp }
          assert:
            - "PROVISIONAL: shares_present == 6000, quorum_pct_bp == 6000, quorum_met == true"
            - "FINAL: shares_present == 4500, quorum_pct_bp == 4500, threshold_bp == 5000, quorum_met == false"
            - "Identical raw vote data: prov_shares - fin_shares == 1500 (exactly the OPEN-challenged vote's shares)"

      - name: tabulation_unofficial_vs_certified_outcome_flip
        grounds:
          - calculations.weighted_tabulation
          - entities.Proposal.fields.vote_standard
          - state_machines.VoteChallenge.OPEN_to_UPHELD
        distinguishing_aspect: |
          On the Proposal entity domain (different domain from the Meeting quorum instance),
          the UNOFFICIAL tabulation variant counts an OPEN-challenged vote while CERTIFIED
          excludes it, flipping projected_outcome from PASS to FAIL on identical raw data.
        test_recipe:
          setup:
            - "ANNUAL meeting, outstanding_shares 10000, quorum_threshold_pct 0.5"
            - "a1 600 COMMON votes FOR, a2 2500 COMMON votes AGAINST, a3 2000 COMMON votes FOR"
            - "a3's vote carries an OPEN challenge; meeting convened"
          setup_api_calls:
            - call: "POST /proxy/meetings"
              payload: { company_name: "Beta Inc", ticker: "BETA", meeting_type: "ANNUAL", record_date: "2026-08-10", meeting_datetime: "2026-09-15T16:00:00Z", meeting_mode: "VIRTUAL", quorum_threshold_pct: 0.5, outstanding_shares: 10000 }
              as: ProxyAdministrator
              captures: { m_id: $.data.id }
            - call: "POST /proxy/shareholder-accounts"
              payload: { meeting_id: "${m_id}", holder_name: "Holder One", account_number: "A-1001", share_class: "COMMON", shares_held: 600 }
              as: TransferAgent
              captures: { a1_id: $.data.id, cn1: $.data.control_number }
            - call: "POST /proxy/shareholder-accounts"
              payload: { meeting_id: "${m_id}", holder_name: "Holder Two", account_number: "A-1002", share_class: "COMMON", shares_held: 2500 }
              as: TransferAgent
              captures: { a2_id: $.data.id, cn2: $.data.control_number }
            - call: "POST /proxy/shareholder-accounts"
              payload: { meeting_id: "${m_id}", holder_name: "Holder Three", account_number: "A-1003", share_class: "COMMON", shares_held: 2000 }
              as: TransferAgent
              captures: { a3_id: $.data.id, cn3: $.data.control_number }
            - call: "POST /proxy/meetings/${m_id}/lock-record-date"
              payload: {}
              as: ProxyAdministrator
            - call: "POST /proxy/proposals"
              payload: { meeting_id: "${m_id}", proposal_number: 1, title: "Say on pay", proposal_type: "SAY_ON_PAY", vote_standard: "MAJORITY_OF_VOTES_CAST" }
              as: ProxyAdministrator
              captures: { p1_id: $.data.id }
            - call: "POST /proxy/material-distributions/generate"
              payload: { meeting_id: "${m_id}" }
              as: ProxyAdministrator
            - call: "POST /proxy/meetings/${m_id}/open-voting"
              payload: {}
              as: ProxyAdministrator
            - call: "POST /proxy/vote-instructions"
              payload: { meeting_id: "${m_id}", proposal_id: "${p1_id}", account_id: "${a1_id}", channel: "INTERNET", choice: "FOR", control_number: "${cn1}" }
              as: Shareholder
              as_user_id: "${a1_id}"
            - call: "POST /proxy/vote-instructions"
              payload: { meeting_id: "${m_id}", proposal_id: "${p1_id}", account_id: "${a2_id}", channel: "INTERNET", choice: "AGAINST", control_number: "${cn2}" }
              as: Shareholder
              as_user_id: "${a2_id}"
            - call: "POST /proxy/vote-instructions"
              payload: { meeting_id: "${m_id}", proposal_id: "${p1_id}", account_id: "${a3_id}", channel: "INTERNET", choice: "FOR", control_number: "${cn3}" }
              as: Shareholder
              as_user_id: "${a3_id}"
              captures: { v3_id: $.data.id }
            - call: "POST /proxy/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-15T16:00:00Z" }
              as: ProxyAdministrator
            - call: "POST /proxy/meetings/${m_id}/convene"
              payload: {}
              as: ProxyAdministrator
            - call: "POST /proxy/vote-challenges"
              payload: { meeting_id: "${m_id}", vote_instruction_id: "${v3_id}", reason: "Solicitation defect alleged" }
              as: InspectorOfElection
          trigger:
            - call: "GET /proxy/proposals/${p1_id}/tabulation?variant=UNOFFICIAL"
              as: InspectorOfElection
              captures: { unoff_for: $.data.for_votes, unoff_outcome: $.data.projected_outcome }
            - call: "GET /proxy/proposals/${p1_id}/tabulation?variant=CERTIFIED"
              as: InspectorOfElection
              captures: { cert_for: $.data.for_votes, cert_outcome: $.data.projected_outcome, cert_cast: $.data.votes_cast }
          assert:
            - "UNOFFICIAL: for_votes == 2600, against_votes == 2500, votes_cast == 5100, projected_outcome == PASS (2600*2=5200 > 5100)"
            - "CERTIFIED: for_votes == 600, against_votes == 2500, votes_cast == 3100, projected_outcome == FAIL (600*2=1200 < 3100)"
            - "Same raw data, opposite outcomes: unoff_outcome != cert_outcome"

  # ===========================================================================
  # Rule 2 — Combinatorial formulas across different modes
  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: quorum_contested_floor_max_branch
        grounds:
          - calculations.quorum_calculation
          - entities.Meeting.fields.meeting_type
          - entities.Meeting.fields.quorum_threshold_pct
        distinguishing_aspect: |
          Mode (a): quorum combines >= 3 inputs (shares_present, outstanding_shares,
          quorum_threshold_pct, meeting_type) with non-linear interaction — a conditional
          branch on meeting_type feeds a max() floor, so a CONTESTED meeting with
          quorum_threshold_pct 0.30 is evaluated against threshold_bp 5000, not 3000.
        test_recipe:
          setup:
            - "CONTESTED meeting, outstanding_shares 10000, quorum_threshold_pct 0.30"
            - "a1 4000 COMMON voted FOR; voting open"
          setup_api_calls:
            - call: "POST /proxy/meetings"
              payload: { company_name: "Gamma LLC", ticker: "GAMA", meeting_type: "CONTESTED", record_date: "2026-08-10", meeting_datetime: "2026-09-15T16:00:00Z", meeting_mode: "HYBRID", quorum_threshold_pct: 0.3, outstanding_shares: 10000 }
              as: ProxyAdministrator
              captures: { m_id: $.data.id }
            - call: "POST /proxy/shareholder-accounts"
              payload: { meeting_id: "${m_id}", holder_name: "Holder One", account_number: "A-1001", share_class: "COMMON", shares_held: 4000 }
              as: TransferAgent
              captures: { a1_id: $.data.id, cn1: $.data.control_number }
            - call: "POST /proxy/meetings/${m_id}/lock-record-date"
              payload: {}
              as: ProxyAdministrator
            - call: "POST /proxy/proposals"
              payload: { meeting_id: "${m_id}", proposal_number: 1, title: "Director election", proposal_type: "DIRECTOR_ELECTION", vote_standard: "PLURALITY" }
              as: ProxyAdministrator
              captures: { p1_id: $.data.id }
            - call: "POST /proxy/material-distributions/generate"
              payload: { meeting_id: "${m_id}" }
              as: ProxyAdministrator
            - call: "POST /proxy/meetings/${m_id}/open-voting"
              payload: {}
              as: ProxyAdministrator
            - call: "POST /proxy/vote-instructions"
              payload: { meeting_id: "${m_id}", proposal_id: "${p1_id}", account_id: "${a1_id}", channel: "INTERNET", choice: "FOR", control_number: "${cn1}" }
              as: Shareholder
              as_user_id: "${a1_id}"
          trigger:
            - call: "GET /proxy/meetings/${m_id}/quorum?variant=PROVISIONAL"
              as: ProxyAdministrator
              captures: { thr_bp: $.data.threshold_bp, pct_bp: $.data.quorum_pct_bp, met: $.data.quorum_met }
          assert:
            - "threshold_bp == 5000 (max(0.30, 0.50) floor applied because meeting_type == CONTESTED)"
            - "quorum_pct_bp == 4000"
            - "quorum_met == false (4000 < 5000); an ANNUAL meeting with identical numbers would compute threshold_bp == 3000 and quorum_met == true"

      - name: weighted_tabulation_per_instruction_rounding_order
        grounds:
          - calculations.weighted_tabulation
          - entities.ShareholderAccount.fields.share_class
        distinguishing_aspect: |
          Mode (b) — nested rounding where order matters: weighted votes are rounded
          round_half_up PER INSTRUCTION then summed; two PREFERRED instructions of 1001
          shares each yield 501 + 501 = 1002, whereas sum-then-round would yield
          round(2002 * 0.5) = 1001. The scaffold pins per-instruction-then-sum.
        test_recipe:
          setup:
            - "ANNUAL meeting, outstanding_shares 10000, quorum_threshold_pct 0.5"
            - "a1 and a2 each hold 1001 PREFERRED shares (class weight 0.5); both vote FOR"
          setup_api_calls:
            - call: "POST /proxy/meetings"
              payload: { company_name: "Delta Co", ticker: "DLTA", meeting_type: "ANNUAL", record_date: "2026-08-10", meeting_datetime: "2026-09-15T16:00:00Z", meeting_mode: "VIRTUAL", quorum_threshold_pct: 0.5, outstanding_shares: 10000 }
              as: ProxyAdministrator
              captures: { m_id: $.data.id }
            - call: "POST /proxy/shareholder-accounts"
              payload: { meeting_id: "${m_id}", holder_name: "Pref One", account_number: "P-1001", share_class: "PREFERRED", shares_held: 1001 }
              as: TransferAgent
              captures: { a1_id: $.data.id, cn1: $.data.control_number }
            - call: "POST /proxy/shareholder-accounts"
              payload: { meeting_id: "${m_id}", holder_name: "Pref Two", account_number: "P-1002", share_class: "PREFERRED", shares_held: 1001 }
              as: TransferAgent
              captures: { a2_id: $.data.id, cn2: $.data.control_number }
            - call: "POST /proxy/meetings/${m_id}/lock-record-date"
              payload: {}
              as: ProxyAdministrator
            - call: "POST /proxy/proposals"
              payload: { meeting_id: "${m_id}", proposal_number: 1, title: "Ratify auditor", proposal_type: "RATIFICATION", vote_standard: "MAJORITY_OF_VOTES_CAST" }
              as: ProxyAdministrator
              captures: { p1_id: $.data.id }
            - call: "POST /proxy/material-distributions/generate"
              payload: { meeting_id: "${m_id}" }
              as: ProxyAdministrator
            - call: "POST /proxy/meetings/${m_id}/open-voting"
              payload: {}
              as: ProxyAdministrator
            - call: "POST /proxy/vote-instructions"
              payload: { meeting_id: "${m_id}", proposal_id: "${p1_id}", account_id: "${a1_id}", channel: "INTERNET", choice: "FOR", control_number: "${cn1}" }
              as: Shareholder
              as_user_id: "${a1_id}"
            - call: "POST /proxy/vote-instructions"
              payload: { meeting_id: "${m_id}", proposal_id: "${p1_id}", account_id: "${a2_id}", channel: "INTERNET", choice: "FOR", control_number: "${cn2}" }
              as: Shareholder
              as_user_id: "${a2_id}"
          trigger:
            - call: "GET /proxy/proposals/${p1_id}/tabulation?variant=UNOFFICIAL"
              as: ProxyAdministrator
              captures: { for_v: $.data.for_votes, cast: $.data.votes_cast }
          assert:
            - "for_votes == 1002 (round_half_up(1001*0.5)=501 per instruction, 501+501)"
            - "votes_cast == 1002"
            - "for_votes != 1001 (the sum-then-round result), proving per-instruction-then-sum ordering"

  # ===========================================================================
  # Rule 3 — Non-linear state-machine shape on different entities
  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: meeting_adjourn_reconvene_cycle_suspends_voting
        grounds:
          - state_machines.Meeting.MEETING_IN_PROGRESS_to_ADJOURNED
          - state_machines.Meeting.ADJOURNED_to_MEETING_IN_PROGRESS
          - errors[ERR_VOTING_NOT_OPEN]
        distinguishing_aspect: |
          Meeting machine is cyclic: MEETING_IN_PROGRESS -> ADJOURNED -> MEETING_IN_PROGRESS;
          while ADJOURNED, vote intake is rejected, and after reconvene the same vote succeeds —
          the cycle re-enters a prior state rather than marching a linear pipeline.
        test_recipe:
          setup:
            - "ANNUAL VIRTUAL meeting in MEETING_IN_PROGRESS (clock at meeting_datetime)"
            - "a1 holds 6000 COMMON and has not voted"
          setup_api_calls:
            - call: "POST /proxy/meetings"
              payload: { company_name: "Epsilon Ltd", ticker: "EPS", meeting_type: "ANNUAL", record_date: "2026-08-10", meeting_datetime: "2026-09-15T16:00:00Z", meeting_mode: "VIRTUAL", quorum_threshold_pct: 0.5, outstanding_shares: 10000 }
              as: ProxyAdministrator
              captures: { m_id: $.data.id }
            - call: "POST /proxy/shareholder-accounts"
              payload: { meeting_id: "${m_id}", holder_name: "Holder One", account_number: "A-1001", share_class: "COMMON", shares_held: 6000 }
              as: TransferAgent
              captures: { a1_id: $.data.id, cn1: $.data.control_number }
            - call: "POST /proxy/meetings/${m_id}/lock-record-date"
              payload: {}
              as: ProxyAdministrator
            - call: "POST /proxy/proposals"
              payload: { meeting_id: "${m_id}", proposal_number: 1, title: "Say on pay", proposal_type: "SAY_ON_PAY", vote_standard: "MAJORITY_OF_VOTES_CAST" }
              as: ProxyAdministrator
              captures: { p1_id: $.data.id }
            - call: "POST /proxy/material-distributions/generate"
              payload: { meeting_id: "${m_id}" }
              as: ProxyAdministrator
            - call: "POST /proxy/meetings/${m_id}/open-voting"
              payload: {}
              as: ProxyAdministrator
            - call: "POST /proxy/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-15T16:00:00Z" }
              as: ProxyAdministrator
            - call: "POST /proxy/meetings/${m_id}/convene"
              payload: {}
              as: ProxyAdministrator
          trigger:
            - call: "POST /proxy/meetings/${m_id}/adjourn"
              payload: {}
              as: ProxyAdministrator
              captures: { st_adj: $.data.status }
            - call: "POST /proxy/vote-instructions"
              payload: { meeting_id: "${m_id}", proposal_id: "${p1_id}", account_id: "${a1_id}", channel: "INTERNET", choice: "FOR", control_number: "${cn1}" }
              as: Shareholder
              as_user_id: "${a1_id}"
              captures: { adjourned_err: $.data.error_id }
            - call: "POST /proxy/meetings/${m_id}/reconvene"
              payload: {}
              as: ProxyAdministrator
              captures: { st_rec: $.data.status }
            - call: "POST /proxy/vote-instructions"
              payload: { meeting_id: "${m_id}", proposal_id: "${p1_id}", account_id: "${a1_id}", channel: "INTERNET", choice: "FOR", control_number: "${cn1}" }
              as: Shareholder
              as_user_id: "${a1_id}"
              captures: { v_id: $.data.id, v_status: $.data.status }
          assert:
            - "adjourn response status == ADJOURNED"
            - "vote attempted while ADJOURNED fails with error_id == ERR_VOTING_NOT_OPEN"
            - "reconvene response status == MEETING_IN_PROGRESS (cycle re-entered)"
            - "identical vote after reconvene succeeds: v_status == VALIDATED"

      - name: question_return_resubmit_moderation_loop
        grounds:
          - state_machines.QuestionSubmission.SUBMITTED_to_RETURNED
          - state_machines.QuestionSubmission.RETURNED_to_SUBMITTED
          - state_machines.QuestionSubmission.SUBMITTED_to_APPROVED
        distinguishing_aspect: |
          QuestionSubmission machine is cyclic on a different entity than Meeting:
          SUBMITTED -> RETURNED -> SUBMITTED -> APPROVED, exercising a revise-and-resubmit
          loop with text replacement and moderation-note clearing on re-entry.
        test_recipe:
          setup:
            - "VIRTUAL meeting in VOTING_OPEN; a1 is an ELIGIBLE account"
          setup_api_calls:
            - call: "POST /proxy/meetings"
              payload: { company_name: "Zeta Inc", ticker: "ZETA", meeting_type: "ANNUAL", record_date: "2026-08-10", meeting_datetime: "2026-09-15T16:00:00Z", meeting_mode: "VIRTUAL", quorum_threshold_pct: 0.5, outstanding_shares: 10000 }
              as: ProxyAdministrator
              captures: { m_id: $.data.id }
            - call: "POST /proxy/shareholder-accounts"
              payload: { meeting_id: "${m_id}", holder_name: "Holder One", account_number: "A-1001", share_class: "COMMON", shares_held: 6000 }
              as: TransferAgent
              captures: { a1_id: $.data.id }
            - call: "POST /proxy/meetings/${m_id}/lock-record-date"
              payload: {}
              as: ProxyAdministrator
            - call: "POST /proxy/proposals"
              payload: { meeting_id: "${m_id}", proposal_number: 1, title: "Say on pay", proposal_type: "SAY_ON_PAY", vote_standard: "MAJORITY_OF_VOTES_CAST" }
              as: ProxyAdministrator
            - call: "POST /proxy/material-distributions/generate"
              payload: { meeting_id: "${m_id}" }
              as: ProxyAdministrator
            - call: "POST /proxy/meetings/${m_id}/open-voting"
              payload: {}
              as: ProxyAdministrator
          trigger:
            - call: "POST /proxy/question-submissions"
              payload: { meeting_id: "${m_id}", account_id: "${a1_id}", question_text: "What is the comp plan?" }
              as: Shareholder
              as_user_id: "${a1_id}"
              captures: { q_id: $.data.id, q_status_0: $.data.status }
            - call: "POST /proxy/question-submissions/${q_id}/moderate"
              payload: { action: "RETURN", moderation_note: "Too broad; narrow to one item" }
              as: ProxyAdministrator
              captures: { q_status_1: $.data.status, q_note: $.data.moderation_note }
            - call: "POST /proxy/question-submissions/${q_id}/resubmit"
              payload: { question_text: "What is the CEO pay ratio?" }
              as: Shareholder
              as_user_id: "${a1_id}"
              captures: { q_status_2: $.data.status, q_text_2: $.data.question_text, q_note_2: $.data.moderation_note }
            - call: "POST /proxy/question-submissions/${q_id}/moderate"
              payload: { action: "APPROVE", moderation_note: "Queued for Q&A" }
              as: ProxyAdministrator
              captures: { q_status_3: $.data.status }
          assert:
            - "initial status == SUBMITTED"
            - "after RETURN: status == RETURNED, moderation_note == 'Too broad; narrow to one item'"
            - "after resubmit: status == SUBMITTED (loop re-entry), question_text == 'What is the CEO pay ratio?', moderation_note == null"
            - "after APPROVE: status == APPROVED (terminal)"

  # ===========================================================================
  # Rule 4 — Transitive cascade chains from different triggers
  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: challenge_upheld_cascade_invalidates_vote_certification
        grounds:
          - state_machines.VoteChallenge.OPEN_to_UPHELD
          - state_machines.VoteInstruction.VALIDATED_to_INVALIDATED
          - state_machines.InspectorCertification.DRAFT_to_SUPERSEDED
          - calculations.weighted_tabulation
          - calculations.quorum_calculation
        distinguishing_aspect: |
          Depth-4 chain originating from adjudicate(UPHELD): VoteChallenge OPEN->UPHELD
          causes VoteInstruction VALIDATED->INVALIDATED (link 1), whose invalidation causes
          proposal tabulation recompute (link 2), which causes meeting quorum recompute
          (link 3), which causes the DRAFT certification to be SUPERSEDED (link 4).
        test_recipe:
          setup:
            - "ANNUAL meeting, outstanding_shares 8000, quorum_threshold_pct 0.5 (threshold_bp 5000)"
            - "a1 3000 COMMON FOR and a2 1000 COMMON FOR on proposal p1 (MAJORITY_OF_VOTES_CAST)"
            - "meeting MEETING_HELD (concluded with FINAL quorum 4000/8000 = 5000bp met); DRAFT certification exists"
            - "an OPEN challenge targets a2's vote"
          setup_api_calls:
            - call: "POST /proxy/meetings"
