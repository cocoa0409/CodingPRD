            - call: "POST /buildings/${b9_id}/suites"
              payload: { suite_number: "210", floor: 2, rentable_sf: 5000, suite_class: "STANDARD_EXAM", power_amps_available: 200 }
              as: PortfolioAdmin
              captures: { s9_id: $.data.id }
            - call: "POST /buildings/${b9_id}/shared-spaces"
              payload: { name: "Second Floor Shared Waiting Room", space_type: "WAITING_ROOM", capacity_seats: 24, opens_at: "07:00", closes_at: "19:00" }
              as: PortfolioAdmin
              captures: { ss9_id: $.data.id }
            - call: "POST /tenants"
              payload: { legal_name: "Northgate Medical Group PC", affiliation: "INDEPENDENT_PRACTICE", primary_specialty: "GASTROENTEROLOGY", is_physician_owned: false, npi: "1234567931" }
              as: PortfolioAdmin
