# =============================================================================
# Task 1700: Ship Chandlery & Vessel Provisioning — scaffold seed tables (v1)
# =============================================================================
# §0.4 note: this design intentionally targets the top of the Expert band and
# slightly exceeds the endpoint/error *guideline* ceilings (which SKILL.md §0.4
# marks as "guidelines, not hard rules") because the FK reverse-reachability
# rule (§1.5) and the testability-completeness ladder mechanically require
# sub-resource GETs and transition endpoints for every declared FK and state.
# No entity is padding: every entity participates in at least one calculation,
# cascade, or cross-entity guard.

scenario: |
  Ship Chandlery & Vessel Provisioning (port ship chandler): quotation against
  vessel requisition list, delivery window aligned to port stay, customs/bonded
  stores handling & duty-free rules, cold chain & bonded storage, substitution
  when item unavailable, delivery to gangway & receipt signature, payment via
  agent & currency, quality complaint & credit

domain_name: ship-chandlery-provisioning
api_prefix: /chandlery

# =============================================================================
# §0.3 Complexity Profile
# =============================================================================
complexity_profile:
  primary_archetype: pricing_engine
  secondary_archetype: workflow_orchestration
  complexity_layers:
    - optimistic_concurrency
    - dual_variant_calculation
    - cascading_side_effects
    - pagination_with_filtering
  entity_topology: hybrid            # VesselCall tree + flat catalog/stock references + cross-aggregate order/invoice links
  state_machine_shape: parallel      # Order.fulfillment_status x payment_status; VesselCall.status x customs_clearance_status; plus cyclic machines on Quotation / Requisition / QualityComplaint
  relationship_patterns:
    - one_to_many
    - cross_aggregate
    - many_to_many                   # Order.lines[].allocations[] joins Order lines to StockLot
  role_model: segregation_of_duties  # warehouse creates deliveries, vessel officer confirms; QA reviews, finance owns money; four-eyes re-review on reopened complaints
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
# Money is integer cents. Logical clock: all system timestamps come from the
# logical clock (see POST /chandlery/_clock/set_current_utc); server startup
# default is 2026-08-01T00:00:00Z.
entities:
  - name: ShipAgent
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Agent company name" }
      - { name: settlement_currency, type: enum, source: input, description: "Currency the agent settles invoices in", constraints: "one of USD | EUR | GBP | SGD" }
      - { name: credit_limit_cents, type: integer, source: input, description: "Maximum committed exposure allowed, in cents of settlement_currency", constraints: ">= 0" }
      - { name: payment_terms_days, type: integer, source: input, description: "Days from invoice issuance to due_date", constraints: ">= 0" }
      - { name: committed_exposure_cents, type: integer, source: computed, default: 0, description: "Sum of total_cents of this agent's Orders with payment_status = UNINVOICED and fulfillment_status IN {OPEN, PARTIALLY_DELIVERED, DELIVERED}, plus outstanding_cents of this agent's Invoices with status IN {ISSUED, PARTIALLY_PAID}" }
      - { name: settled_exposure_cents, type: integer, source: computed, default: 0, description: "Sum of outstanding_cents of this agent's Invoices with status IN {ISSUED, PARTIALLY_PAID} only" }

  - name: VesselCall
    parent: null
    common_fields: true
    fields:
      - { name: vessel_name, type: string, source: input, description: "Vessel name" }
      - { name: imo_number, type: string, source: input, description: "IMO number of the vessel" }
      - { name: agent_id, type: string, source: input, description: "FK -> ShipAgent.id; paying agent for this port call" }
      - { name: port_code, type: string, source: input, description: "UN/LOCODE of the port" }
      - { name: scheduled_eta, type: datetime, source: input, description: "Planned arrival (ISO8601 UTC)" }
      - { name: scheduled_etd, type: datetime, source: input, description: "Planned departure (ISO8601 UTC); must be strictly after scheduled_eta" }
      - { name: actual_eta, type: datetime, source: system, description: "Set to logical-clock now on arrive; null until IN_PORT", default: null }
      - { name: actual_etd, type: datetime, source: system, description: "Set to logical-clock now on depart; null until DEPARTED", default: null }
      - { name: foreign_going, type: boolean, source: input, description: "True if the vessel's next voyage is foreign-going (duty-free eligibility precondition)" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | IN_PORT | DEPARTED | CANCELLED", default: SCHEDULED }
      - { name: customs_clearance_status, type: enum, source: system, description: "PENDING | CLEARED | REJECTED — independent parallel dimension governing bonded/duty-free release", default: PENDING }

  - name: CatalogItem
    parent: null
    common_fields: true
    fields:
      - { name: sku, type: string, source: input, description: "Stock keeping unit; unique across all catalog items" }
      - { name: name, type: string, source: input, description: "Display name" }
      - { name: category, type: enum, source: input, description: "PROVISIONS | BONDED | DECK | ENGINE | CABIN" }
      - { name: bonded_eligible, type: boolean, source: input, description: "True if the item may be sold duty-free from bonded stores when customs rules are met" }
      - { name: requires_cold_chain, type: boolean, source: input, description: "True if the item must be held in COLD_STORE storage and attracts the cold-chain surcharge" }
      - { name: base_price_cents, type: integer, source: input, description: "List unit price in USD cents", constraints: ">= 1" }
      - { name: duty_rate_pct, type: number, source: input, default: 0, description: "Import duty percentage applied to the line base when the line is dutiable", constraints: ">= 0" }

  - name: StockLot
    parent: null
    common_fields: true
    fields:
      - { name: catalog_item_id, type: string, source: input, description: "FK -> CatalogItem.id; item held in this lot" }
      - { name: lot_code, type: string, source: input, description: "Warehouse lot code; unique per catalog_item_id; used as tie-break (ASC) after created_at in reservation waterfall" }
      - { name: storage_tier, type: enum, source: input, description: "BONDED_WAREHOUSE | COLD_STORE | DRY_STORE" }
      - { name: received_qty, type: integer, source: input, description: "Total quantity ever received into the lot (adjusted by stock adjustments)", constraints: ">= 0" }
      - { name: on_hand_qty, type: integer, source: computed, description: "Unreserved physical stock; reservation moves qty on_hand -> reserved, delivery confirm deducts both" }
      - { name: reserved_qty, type: integer, source: computed, default: 0, description: "Quantity reserved by non-terminal Orders (fulfillment_status IN {OPEN, PARTIALLY_DELIVERED})" }
      - { name: capacity_qty, type: integer, source: input, description: "For COLD_STORE lots: maximum total cold-reserved qty across overlapping reservation windows; ignored for other tiers", constraints: ">= 0" }

  - name: Requisition
    parent: VesselCall
    common_fields: true
    fields:
      - { name: vessel_call_id, type: string, source: system, description: "FK -> VesselCall.id; taken from the nested creation path" }
      - { name: title, type: string, source: input, description: "Free-text requisition title" }
      - { name: lines, type: array, source: input, description: "Array of {catalog_item_id, requested_qty (integer >= 1), allows_substitution (boolean), notes?}; at least one element" }
      - { name: status, type: enum, source: system, description: "DRAFT | SUBMITTED | QUOTED | CLOSED", default: DRAFT }
      - { name: submitted_at, type: datetime, source: system, description: "Logical-clock timestamp of the most recent DRAFT -> SUBMITTED transition", default: null }

  - name: Quotation
    parent: Requisition
    common_fields: true
    fields:
      - { name: requisition_id, type: string, source: system, description: "FK -> Requisition.id; taken from the nested creation path" }
      - { name: lines, type: array, source: input, description: "Array of {catalog_item_id, qty (integer >= 1), unit_price_cents (integer >= 1), is_substitution (boolean), substitution_of_item_id (string, required iff is_substitution)}; every requisition line must be covered by exactly one quotation line (substitute covers its original)" }
      - { name: valid_until, type: datetime, source: input, description: "Inclusive acceptance deadline (ISO8601 UTC); accept at exactly this instant is valid" }
      - { name: provisional_total_cents, type: integer, source: computed, description: "Provisional order pricing (see calculations.line_pricing variant provisional + order_totals) computed at creation and refreshed on revise" }
      - { name: revision_count, type: integer, source: computed, default: 0, description: "Number of successful revise calls" }
      - { name: authored_by_user_id, type: string, source: system, description: "X-User-ID of the creating ChandlerSalesRep" }
      - { name: status, type: enum, source: system, description: "DRAFT | SENT | ACCEPTED | EXPIRED | WITHDRAWN", default: DRAFT }

  - name: Order
    parent: null
    common_fields: true
    fields:
      - { name: quotation_id, type: string, source: system, description: "FK -> Quotation.id; the accepted quotation this order was created from" }
      - { name: agent_id, type: string, source: system, description: "FK -> ShipAgent.id; denormalized from VesselCall at acceptance for exposure aggregation" }
      - { name: lines, type: array, source: computed, description: "Snapshot array of {catalog_item_id, qty_ordered, qty_delivered (starts 0), unit_price_cents, is_substitution, allocations: [{stock_lot_id, qty}]}" }
      - { name: subtotal_cents, type: integer, source: computed, description: "Accepted-time subtotal (sum of rounded line totals) per calculations.order_totals" }
      - { name: rebate_cents, type: integer, source: computed, description: "Accepted-time volume rebate per calculations.volume_rebate" }
      - { name: total_cents, type: integer, source: computed, description: "Accepted-time order total = subtotal_cents - rebate_cents (frozen from quotation provisional pricing)" }
      - { name: accepted_at, type: datetime, source: system, description: "Logical-clock timestamp of acceptance; start of cold reservation windows" }
      - { name: reservation_window_end, type: datetime, source: system, description: "VesselCall.scheduled_etd captured at acceptance; end of cold reservation windows" }
      - { name: fulfillment_status, type: enum, source: system, description: "OPEN | PARTIALLY_DELIVERED | DELIVERED | CANCELLED — parallel dimension 1", default: OPEN }
      - { name: payment_status, type: enum, source: system, description: "UNINVOICED | INVOICED | PARTIALLY_PAID | PAID | CREDITED — parallel dimension 2", default: UNINVOICED }

  - name: Delivery
    parent: Order
    common_fields: true
    fields:
      - { name: order_id, type: string, source: system, description: "FK -> Order.id; taken from the nested creation path" }
      - { name: window_start, type: datetime, source: input, description: "Planned gangway delivery window start (inclusive lower bound)" }
      - { name: window_end, type: datetime, source: input, description: "Planned gangway delivery window end (inclusive upper bound); must be strictly after window_start" }
      - { name: lines, type: array, source: input, description: "Planned load: array of {catalog_item_id, qty (integer >= 1)}" }
      - { name: confirmed_lines, type: array, source: computed, description: "Actual received quantities per line, captured at confirm: array of {catalog_item_id, qty (integer >= 0)}" }
      - { name: receiver_name, type: string, source: system, description: "Printed name of the vessel-side receiver, captured at confirm", default: null }
      - { name: signature_ref, type: string, source: system, description: "Signature reference captured at confirm (gangway receipt signature)", default: null }
      - { name: confirmed_at, type: datetime, source: system, description: "Logical-clock timestamp of confirm", default: null }
      - { name: created_by_user_id, type: string, source: system, description: "X-User-ID of the creating WarehouseSupervisor" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | OUT_FOR_DELIVERY | DELIVERED | CANCELLED | FAILED", default: SCHEDULED }

  - name: Invoice
    parent: Order
    common_fields: true
    fields:
      - { name: order_id, type: string, source: system, description: "FK -> Order.id; taken from the nested creation path; at most one non-VOID invoice per order" }
      - { name: settlement_currency, type: enum, source: system, description: "Copied from the order's ShipAgent.settlement_currency" }
      - { name: fx_rate_to_settlement, type: number, source: input, description: "USD -> settlement_currency conversion rate applied to the invoice total", constraints: "> 0" }
      - { name: lines, type: array, source: computed, description: "Final-priced lines: {catalog_item_id, qty (delivered), unit_price_cents, duty_free (boolean), duty_cents, cold_surcharge_cents, line_total_cents} per calculations.line_pricing variant final" }
      - { name: duty_free_subtotal_cents, type: integer, source: computed, description: "Sum of line_total_cents of duty-free lines (USD cents)" }
      - { name: dutiable_subtotal_cents, type: integer, source: computed, description: "Sum of line_total_cents of dutiable lines including their duty (USD cents)" }
      - { name: total_duty_cents, type: integer, source: computed, description: "Sum of per-line duty_cents (per-line rounding order pinned in calculations.order_totals)" }
      - { name: subtotal_cents, type: integer, source: computed, description: "duty_free_subtotal_cents + dutiable_subtotal_cents (USD cents)" }
      - { name: rebate_cents, type: integer, source: computed, description: "Volume rebate per calculations.volume_rebate evaluated on subtotal_cents" }
      - { name: total_usd_cents, type: integer, source: computed, description: "subtotal_cents - rebate_cents" }
      - { name: total_cents, type: integer, source: computed, description: "round_half_up(total_usd_cents * fx_rate_to_settlement); invoice amount in settlement_currency cents" }
      - { name: paid_amount_cents, type: integer, source: computed, default: 0, description: "Sum of converted_amount_cents of Payments on this invoice" }
      - { name: credited_amount_cents, type: integer, source: computed, default: 0, description: "Sum of amount_cents of non-REVOKED CreditNotes on this invoice" }
      - { name: fx_writeoff_cents, type: integer, source: computed, default: 0, description: "Settlement tolerance write-off recorded when the closing payment lands within +/- 50 cents of outstanding" }
      - { name: outstanding_cents, type: integer, source: computed, description: "total_cents - paid_amount_cents - credited_amount_cents - fx_writeoff_cents; invariant: paid + credited + writeoff + outstanding == total" }
      - { name: issued_at, type: datetime, source: system, description: "Logical-clock timestamp of issuance" }
      - { name: due_date, type: datetime, source: computed, description: "issued_at + ShipAgent.payment_terms_days" }
      - { name: issued_by_user_id, type: string, source: system, description: "X-User-ID of the issuing FinanceController" }
      - { name: status, type: enum, source: system, description: "ISSUED | PARTIALLY_PAID | PAID | CREDITED | VOID", default: ISSUED }

  - name: Payment
    parent: Invoice
    common_fields: false   # append-only event log entry; id + created_at only
    fields:
      - { name: invoice_id, type: string, source: system, description: "FK -> Invoice.id; taken from the nested creation path" }
      - { name: amount_cents, type: integer, source: input, description: "Amount tendered, in cents of currency", constraints: ">= 1" }
      - { name: currency, type: enum, source: input, description: "Currency of amount_cents: USD | EUR | GBP | SGD" }
      - { name: fx_rate_to_invoice_currency, type: number, source: input, description: "Required iff currency != invoice.settlement_currency; payment currency -> invoice currency rate", constraints: "> 0 when present" }
      - { name: converted_amount_cents, type: integer, source: computed, description: "amount_cents if currency == settlement_currency, else round_half_up(amount_cents * fx_rate_to_invoice_currency)" }
      - { name: writeoff_applied_cents, type: integer, source: computed, default: 0, description: "Tolerance write-off booked by this payment when it closes the invoice within +/- 50 cents" }
      - { name: recorded_by_user_id, type: string, source: system, description: "X-User-ID of the ShipAgentClerk who recorded the payment" }

  - name: QualityComplaint
    parent: Delivery
    common_fields: true
    fields:
      - { name: delivery_id, type: string, source: system, description: "FK -> Delivery.id; taken from the nested creation path" }
      - { name: lines, type: array, source: input, description: "Array of {catalog_item_id, rejected_qty (integer >= 1), reason (SPOILED | DAMAGED | WRONG_ITEM | SHORT)}; rejected_qty per item must be <= delivered qty for that item on this delivery" }
      - { name: evidence_note, type: string, source: input, description: "Free-text evidence" }
      - { name: reopen_count, type: integer, source: computed, default: 0, description: "Number of successful reopen calls (REJECTED -> SUBMITTED)" }
      - { name: last_reviewer_user_id, type: string, source: system, description: "X-User-ID of the QualityAssuranceLead who made the most recent accept/reject decision", default: null }
      - { name: status, type: enum, source: system, description: "SUBMITTED | ACCEPTED | REJECTED", default: SUBMITTED }

  - name: CreditNote
    parent: QualityComplaint
    common_fields: true
    fields:
      - { name: complaint_id, type: string, source: system, description: "FK -> QualityComplaint.id; exactly one credit note per complaint, auto-created on complaint accept" }
      - { name: invoice_id, type: string, source: system, description: "FK -> Invoice.id; selector: the order's invoice with status IN {ISSUED, PARTIALLY_PAID}, latest created_at first, tie-break higher total_cents first" }
      - { name: gross_amount_cents, type: integer, source: computed, description: "Sum over accepted complaint lines of invoice-line unit_price_cents * rejected_qty (settlement-currency price share applied pro-rata: round_half_up(usd_value * invoice.fx_rate_to_settlement) per line)" }
      - { name: restocking_fee_cents, type: integer, source: computed, description: "max(500, round_half_up(gross_amount_cents * 0.05))" }
      - { name: amount_cents, type: integer, source: computed, description: "min(gross_amount_cents - restocking_fee_cents, invoice.total_cents - invoice.credited_amount_cents at issuance); complaint accept fails with ERR_NO_CREDITABLE_INVOICE if this would be <= 0" }
      - { name: status, type: enum, source: system, description: "APPLIED | REVOKED", default: APPLIED }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: VesselCall
    initial_state: SCHEDULED
    terminal_states: [DEPARTED, CANCELLED]
    note: "Two parallel dimensions: status (port presence) x customs_clearance_status (PENDING | CLEARED | REJECTED). Customs transitions are independent of status transitions except they may only occur while status IN {SCHEDULED, IN_PORT}."
    transitions:
      - from: SCHEDULED
        to: IN_PORT
        trigger: "POST /chandlery/vessel-calls/{id}/arrive"
        actor: ChandlerOpsManager
        preconditions:
          - "status == SCHEDULED (else ERR_VESSEL_CALL_NOT_ARRIVABLE)"
        side_effects:
          - "actual_eta := logical clock now"
          - "version += 1; updated_at refreshed"
      - from: IN_PORT
        to: DEPARTED
        trigger: "POST /chandlery/vessel-calls/{id}/depart"
        actor: ChandlerOpsManager
        preconditions:
          - "status == IN_PORT (else ERR_VESSEL_CALL_NOT_IN_PORT)"
        side_effects:
          - "actual_etd := logical clock now"
          - "Cascade hop 1 (VesselCall -> Delivery): all Deliveries of all Orders of this call with status SCHEDULED or OUT_FOR_DELIVERY -> FAILED"
          - "Cascade hop 1 (VesselCall -> Order): Orders of this call with fulfillment_status == OPEN -> CANCELLED"
          - "Cascade hop 2 (Order -> StockLot): for each auto-cancelled Order, release its line allocations (reserved_qty -= alloc, on_hand_qty += alloc)"
          - "Cascade hop 2 (Order -> Invoice): for each auto-cancelled Order with an Invoice in ISSUED (no Payments), that Invoice -> VOID"
          - "Cascade hop 3 (Invoice -> ShipAgent): voiding recomputes the agent's settled_exposure_cents and committed_exposure_cents"
          - "For Orders left PARTIALLY_DELIVERED: release the undelivered remainder of their reservations (reserved_qty -> on_hand_qty)"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /chandlery/vessel-calls/{id}/cancel"
        actor: ChandlerOpsManager
        preconditions:
          - "status == SCHEDULED (else ERR_VESSEL_CALL_NOT_CANCELLABLE)"
        side_effects:
          - "Cascade (VesselCall -> Requisition): all Requisitions of this call in DRAFT | SUBMITTED | QUOTED -> CLOSED"
          - "Cascade: no Orders can exist for a SCHEDULED call (accept requires IN_PORT), so no order side effects"
      - from: PENDING
        to: CLEARED
        trigger: "POST /chandlery/vessel-calls/{id}/customs-clearance {decision: CLEARED}"
        actor: PortCustomsOfficer
        preconditions:
          - "customs_clearance_status IN {PENDING, REJECTED} (else ERR_CUSTOMS_STATE_INVALID)"
          - "status IN {SCHEDULED, IN_PORT} (else ERR_VESSEL_CALL_NOT_IN_PORT)"
        side_effects: ["customs_clearance_status := CLEARED; version += 1"]
      - from: PENDING
        to: REJECTED
        trigger: "POST /chandlery/vessel-calls/{id}/customs-clearance {decision: REJECTED}"
        actor: PortCustomsOfficer
        preconditions:
          - "customs_clearance_status IN {PENDING, CLEARED} (else ERR_CUSTOMS_STATE_INVALID)"
          - "status IN {SCHEDULED, IN_PORT}"
        side_effects: ["customs_clearance_status := REJECTED; version += 1"]
      - from: REJECTED
        to: CLEARED
        trigger: "POST /chandlery/vessel-calls/{id}/customs-clearance {decision: CLEARED}"
        actor: PortCustomsOfficer
        preconditions: ["as above"]
        side_effects: ["customs_clearance_status := CLEARED; version += 1"]
      - from: CLEARED
        to: REJECTED
        trigger: "POST /chandlery/vessel-calls/{id}/customs-clearance {decision: REJECTED}"
        actor: PortCustomsOfficer
        preconditions: ["as above"]
        side_effects: ["customs_clearance_status := REJECTED; version += 1 (revocation; previously issued invoices are NOT retroactively repriced)"]

  - entity: Requisition
    initial_state: DRAFT
    terminal_states: [CLOSED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /chandlery/requisitions/{id}/submit"
        actor: VesselCateringOfficer
        preconditions:
          - "status == DRAFT (else ERR_REQUISITION_NOT_SUBMITTABLE)"
          - "acting X-User-ID == vessel_call_id of this requisition (else ERR_INSUFFICIENT_PERMISSIONS)"
        side_effects: ["submitted_at := now; version += 1"]
      - from: SUBMITTED
        to: DRAFT
        trigger: "POST /chandlery/requisitions/{id}/recall"
        actor: VesselCateringOfficer
        preconditions:
          - "status == SUBMITTED (else ERR_REQUISITION_NOT_RECALLABLE)"
          - "no Quotation of this requisition is in SENT (else ERR_REQUISITION_HAS_LIVE_QUOTATION)"
        side_effects: ["version += 1 (cycle: DRAFT -> SUBMITTED -> DRAFT is legal)"]
      - from: SUBMITTED
        to: QUOTED
        trigger: "system (automatic when a Quotation of this requisition transitions DRAFT -> SENT)"
        actor: system
        preconditions: []
        side_effects: []
      - from: QUOTED
        to: SUBMITTED
        trigger: "system (automatic when the only SENT quotation is withdrawn or expires and no other SENT quotation exists)"
        actor: system
        preconditions: []
        side_effects: []
      - from: QUOTED
        to: CLOSED
        trigger: "system (automatic when a Quotation of this requisition transitions SENT -> ACCEPTED)"
        actor: system
        preconditions: []
        side_effects: []
      - from: SUBMITTED
        to: CLOSED
        trigger: "system (automatic when parent VesselCall SCHEDULED -> CANCELLED)"
        actor: system
        preconditions: []
        side_effects: []
      - from: DRAFT
        to: CLOSED
        trigger: "system (automatic when parent VesselCall SCHEDULED -> CANCELLED)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: Quotation
    initial_state: DRAFT
    terminal_states: [ACCEPTED, EXPIRED, WITHDRAWN]
    note: "Cyclic: SENT -> SENT via revise (revision_count += 1, version += 1). Lazy expiry: any send/revise/accept attempt when now > valid_until flips status to EXPIRED and fails with ERR_QUOTATION_EXPIRED."
    transitions:
      - from: DRAFT
        to: SENT
        trigger: "POST /chandlery/quotations/{id}/send"
        actor: ChandlerSalesRep
        preconditions:
          - "status == DRAFT (else ERR_QUOTATION_NOT_SENDABLE)"
          - "parent Requisition.status IN {SUBMITTED, QUOTED} (else ERR_REQUISITION_NOT_OPEN_FOR_QUOTES)"
        side_effects:
          - "provisional_total_cents recomputed (line_pricing variant provisional)"
          - "parent Requisition -> QUOTED"
          - "version += 1"
      - from: SENT
        to: SENT
        trigger: "POST /chandlery/quotations/{id}/revise"
        actor: ChandlerSalesRep
        preconditions:
          - "status == SENT (else ERR_QUOTATION_NOT_REVISABLE)"
          - "now <= valid_until (else flip to EXPIRED and fail ERR_QUOTATION_EXPIRED)"
          - "expected_quotation_version == current version (else ERR_STALE_VERSION, 412)"
        side_effects:
          - "lines, valid_until replaced; provisional_total_cents recomputed"
          - "revision_count += 1; version += 1"
      - from: SENT
        to: ACCEPTED
        trigger: "POST /chandlery/quotations/{id}/accept"
        actor: VesselCateringOfficer
        preconditions:
          - "status == SENT (else ERR_QUOTATION_NOT_ACCEPTABLE)"
          - "now <= valid_until (else flip to EXPIRED and fail ERR_QUOTATION_EXPIRED)"
          - "acting X-User-ID == vessel_call.id of the requisition's vessel call (ownership, else ERR_INSUFFICIENT_PERMISSIONS)"
          - "VesselCall.status == IN_PORT (cross-entity dependency, else ERR_VESSEL_CALL_NOT_IN_PORT)"
          - "credit limit: order total <= agent.credit_limit_cents - agent.committed_exposure_cents (else ERR_CREDIT_LIMIT_EXCEEDED)"
          - "stock sufficient for every line (waterfall allocation succeeds, else ERR_STOCK_INSUFFICIENT)"
          - "cold-chain capacity: for each COLD_STORE lot touched, overlapping cold reservations + new allocation <= capacity_qty (else ERR_COLD_CHAIN_CAPACITY_EXCEEDED)"
        side_effects:
          - "Create Order (status OPEN x UNINVOICED) snapshotting lines; total_cents := provisional_total_cents; accepted_at := now; reservation_window_end := vessel scheduled_etd"
          - "StockLot waterfall allocation (FIFO by created_at ASC, tie-break lot_code ASC): on_hand_qty -= alloc, reserved_qty += alloc"
          - "parent Requisition -> CLOSED"
          - "ShipAgent.committed_exposure_cents recomputed (adds this order total)"
          - "version += 1"
      - from: SENT
        to: EXPIRED
        trigger: "system (lazy, on any send/revise/accept attempt when now > valid_until)"
        actor: system
        preconditions: []
        side_effects: ["if no other SENT quotation on the requisition, parent Requisition QUOTED -> SUBMITTED"]
      - from: SENT
        to: WITHDRAWN
        trigger: "POST /chandlery/quotations/{id}/withdraw"
        actor: ChandlerSalesRep
        preconditions:
          - "status IN {DRAFT, SENT} (else ERR_QUOTATION_NOT_WITHDRAWABLE)"
        side_effects: ["if withdrawn from SENT and no other SENT quotation on the requisition, parent Requisition QUOTED -> SUBMITTED"]
      - from: DRAFT
        to: WITHDRAWN
        trigger: "POST /chandlery/quotations/{id}/withdraw"
        actor: ChandlerSalesRep
        preconditions: ["status IN {DRAFT, SENT}"]
        side_effects: []

  - entity: Order
    initial_state: OPEN   # fulfillment dimension; payment dimension initial UNINVOICED
    terminal_states: [CANCELLED]   # fulfillment terminal; payment terminal PAID | CREDITED; order CANCELLED forces invoice void, see transitions
    note: "Two independent parallel dimensions on one entity: fulfillment_status (OPEN | PARTIALLY_DELIVERED | DELIVERED | CANCELLED) and payment_status (UNINVOICED | INVOICED | PARTIALLY_PAID | PAID | CREDITED). fulfillment transitions are driven by delivery confirms and cancel; payment transitions by invoice issuance, payments, and credit notes. Dimensions evolve independently except: cancel requires payment_status IN {UNINVOICED, INVOICED} with zero Payments; invoice issuance requires fulfillment DELIVERED or (PARTIALLY_DELIVERED with vessel DEPARTED)."
    transitions:
      - from: "OPEN (payment UNINVOICED)"
        to: "PARTIALLY_DELIVERED (payment UNINVOICED)"
        trigger: "system (during POST /chandlery/deliveries/{id}/confirm when confirmed totals leave at least one line short)"
        actor: system
        preconditions: []
        side_effects:
          - "Cascade hop 1 (Delivery -> Order): lines[].qty_delivered += confirmed qty; fulfillment_status re-derived"
          - "Cascade hop 1b (Delivery -> StockLot): reserved_qty -= confirmed qty, on_hand_qty -= confirmed qty"
      - from: "OPEN or PARTIALLY_DELIVERED (payment UNINVOICED)"
        to: "DELIVERED (payment UNINVOICED)"
        trigger: "system (during confirm when every line's qty_delivered == qty_ordered)"
        actor: system
        preconditions: []
        side_effects:
          - "Release reservation remainder (none when fully delivered)"
      - from: "OPEN (payment UNINVOICED or INVOICED)"
        to: "CANCELLED"
        trigger: "POST /chandlery/orders/{id}/cancel"
        actor: ChandlerOpsManager
        preconditions:
          - "fulfillment_status == OPEN (else ERR_ORDER_NOT_CANCELLABLE)"
          - "payment_status IN {UNINVOICED, INVOICED} and zero Payments on the invoice (else ERR_ORDER_NOT_CANCELLABLE)"
        side_effects:
          - "Cascade hop 1 (Order -> Delivery): SCHEDULED | OUT_FOR_DELIVERY deliveries -> CANCELLED"
          - "Cascade hop 1 (Order -> StockLot): release all allocations (reserved -= , on_hand +=)"
          - "Cascade hop 2 (Order -> Invoice): invoice in ISSUED (no payments) -> VOID"
          - "Cascade hop 3 (Invoice -> ShipAgent): settled/committed exposure recomputed; also ShipAgent.committed_exposure_cents drops this order's total"
      - from: "(payment UNINVOICED)"
        to: "(payment INVOICED)"
        trigger: "system (during POST /chandlery/orders/{id}/invoices)"
        actor: system
        preconditions: []
        side_effects: []
      - from: "(payment INVOICED)"
        to: "(payment PARTIALLY_PAID)"
        trigger: "system (during POST /chandlery/invoices/{id}/payments when converted sum < total - 50)"
        actor: system
        preconditions: []
        side_effects: []
      - from: "(payment INVOICED or PARTIALLY_PAID)"
        to: "(payment PAID)"
        trigger: "system (during payments when converted sum reaches total within +/- 50 cents tolerance; write-off booked)"
        actor: system
        preconditions: []
        side_effects: []
      - from: "(payment INVOICED or PARTIALLY_PAID)"
        to: "(payment CREDITED)"
        trigger: "system (when a CreditNote application makes credited_amount_cents == total_cents)"
        actor: system
        preconditions: []
        side_effects: []
      - from: "(payment CREDITED)"
        to: "(payment INVOICED or PARTIALLY_PAID)"
        trigger: "system (compensation: when a CreditNote is REVOKED, credited_amount drops below total and status re-derives from paid vs total)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: Delivery
    initial_state: SCHEDULED
    terminal_states: [DELIVERED, CANCELLED, FAILED]
    transitions:
      - from: SCHEDULED
        to: OUT_FOR_DELIVERY
        trigger: "POST /chandlery/deliveries/{id}/dispatch"
        actor: WarehouseSupervisor
        preconditions:
          - "status == SCHEDULED (else ERR_DELIVERY_NOT_DISPATCHABLE)"
        side_effects: ["version += 1"]
      - from: OUT_FOR_DELIVERY
        to: DELIVERED
        trigger: "POST /chandlery/deliveries/{id}/confirm"
        actor: VesselCateringOfficer
        preconditions:
          - "status == OUT_FOR_DELIVERY (else ERR_DELIVERY_NOT_CONFIRMABLE)"
          - "acting X-User-ID == vessel_call.id of the order's vessel call (ownership, else ERR_INSUFFICIENT_PERMISSIONS)"
          - "segregation of duties: acting X-User-ID != created_by_user_id (else ERR_SEGREGATION_OF_DUTIES_VIOLATION)"
          - "each confirmed line qty >= 0 and <= planned qty on this delivery (else ERR_QTY_EXCEEDS_REMAINING)"
        side_effects:
          - "confirmed_lines, receiver_name, signature_ref, confirmed_at := now captured"
          - "Cascade hop 1 (Delivery -> Order): qty_delivered accumulates; fulfillment re-derived OPEN -> PARTIALLY_DELIVERED | DELIVERED"
          - "Cascade hop 1 (Delivery -> StockLot): reserved_qty -= confirmed qty, on_hand_qty -= confirmed qty per allocated lot"
          - "version += 1"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "system (order cancel cascade) or system (vessel depart cascade)"
        actor: system
        preconditions: []
        side_effects: []
      - from: OUT_FOR_DELIVERY
        to: CANCELLED
        trigger: "system (order cancel cascade)"
        actor: system
        preconditions: []
        side_effects: []
      - from: SCHEDULED
        to: FAILED
        trigger: "system (vessel depart cascade)"
        actor: system
        preconditions: []
        side_effects: []
      - from: OUT_FOR_DELIVERY
        to: FAILED
        trigger: "system (vessel depart cascade)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: Invoice
    initial_state: ISSUED
    terminal_states: [PAID, CREDITED, VOID]
    transitions:
      - from: ISSUED
        to: PARTIALLY_PAID
        trigger: "system (payment with converted sum < total - 50)"
        actor: system
        preconditions: []
        side_effects: ["outstanding_cents recomputed; ShipAgent exposures recomputed"]
      - from: ISSUED
        to: PAID
        trigger: "system (single payment closing within tolerance)"
        actor: system
        preconditions: []
        side_effects: ["fx_writeoff_cents booked if |delta| in (0, 50]; outstanding -> 0; Order.payment_status -> PAID; exposures recomputed"]
      - from: PARTIALLY_PAID
        to: PAID
        trigger: "system (closing payment within tolerance)"
        actor: system
        preconditions: []
        side_effects: ["as above"]
      - from: ISSUED
        to: CREDITED
        trigger: "system (credit note application makes credited == total)"
        actor: system
        preconditions: []
        side_effects: ["outstanding -> 0; Order.payment_status -> CREDITED; exposures recomputed"]
      - from: PARTIALLY_PAID
        to: CREDITED
        trigger: "system (credit note application makes credited == total - paid)"
        actor: system
        preconditions: []
        side_effects: ["outstanding -> 0; Order.payment_status -> CREDITED; exposures recomputed"]
      - from: CREDITED
        to: ISSUED
        trigger: "system (credit note REVOKED: credited drops below total - paid; status re-derived)"
        actor: system
        preconditions: []
        side_effects: ["outstanding recomputed; Order.payment_status re-derived; exposures recomputed"]
      - from: CREDITED
        to: PARTIALLY_PAID
        trigger: "system (credit note REVOKED with partial payments present)"
        actor: system
        preconditions: []
        side_effects: ["as above"]
      - from: ISSUED
        to: VOID
        trigger: "system (order cancel or vessel depart cascade; only when zero Payments recorded)"
        actor: system
        preconditions: []
        side_effects: ["exposures recomputed"]
  - entity: QualityComplaint
    initial_state: SUBMITTED
    terminal_states: [ACCEPTED]
    note: "Cyclic via reopen: SUBMITTED -> REJECTED -> SUBMITTED (reopen_count += 1). Four-eyes rule: when reopen_count >= 1, the reviewing X-User-ID must differ from last_reviewer_user_id."
    transitions:
      - from: SUBMITTED
        to: ACCEPTED
        trigger: "POST /chandlery/complaints/{id}/accept"
        actor: QualityAssuranceLead
        preconditions:
          - "status == SUBMITTED (else ERR_COMPLAINT_NOT_REVIEWABLE)"
          - "four-eyes: reopen_count >= 1 implies acting X-User-ID != last_reviewer_user_id (else ERR_SEGREGATION_OF_DUTIES_VIOLATION)"
          - "creditable invoice exists: the order has an Invoice with status IN {ISSUED, PARTIALLY_PAID} and total_cents - credited_amount_cents - restocking floor > 0 (selector: latest created_at, tie-break higher total_cents) (else ERR_NO_CREDITABLE_INVOICE)"
        side_effects:
          - "last_reviewer_user_id := acting X-User-ID"
          - "Cascade hop 1 (QualityComplaint -> CreditNote): auto-create CreditNote (status APPLIED) per calculations.credit_note_amount"
          - "Cascade hop 2 (CreditNote -> Invoice): invoice.credited_amount_cents += amount_cents; outstanding_cents recomputed; status -> CREDITED if fully credited"
          - "Cascade hop 3 (Invoice -> ShipAgent): settled_exposure_cents and committed_exposure_cents recomputed; Order.payment_status -> CREDITED if applicable"
          - "version += 1"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /chandlery/complaints/{id}/reject"
        actor: QualityAssuranceLead
        preconditions:
          - "status == SUBMITTED (else ERR_COMPLAINT_NOT_REVIEWABLE)"
          - "four-eyes rule as above"
        side_effects: ["last_reviewer_user_id := acting X-User-ID; version += 1"]
      - from: REJECTED
        to: SUBMITTED
        trigger: "POST /chandlery/complaints/{id}/reopen"
        actor: VesselCateringOfficer
        preconditions:
          - "status == REJECTED (else ERR_COMPLAINT_NOT_REOPENABLE)"
          - "acting X-User-ID == vessel_call.id of the delivery's order's vessel call (ownership, else ERR_INSUFFICIENT_PERMISSIONS)"
        side_effects: ["reopen_count += 1; version += 1"]

  - entity: CreditNote
    initial_state: APPLIED
    terminal_states: [REVOKED]
    transitions:
      - from: APPLIED
        to: REVOKED
        trigger: "POST /chandlery/credit-notes/{id}/revoke"
        actor: FinanceController
        preconditions:
          - "status == APPLIED (else ERR_CREDIT_NOTE_NOT_REVOCABLE)"
          - "invoice.status != PAID or revocation merely reopens an unpaid balance (allowed: revoke always permitted from APPLIED; if invoice was CREDITED it re-derives to ISSUED | PARTIALLY_PAID)"
        side_effects:
          - "Compensation (CreditNote -> Invoice): invoice.credited_amount_cents -= amount_cents; outstanding recomputed; status re-derived"
          - "Compensation (Invoice -> ShipAgent): exposures recomputed"
          - "version += 1"

# =============================================================================
# §1.2.1 Concurrency Rules (true races only, OCC on parent version)
# =============================================================================
concurrency_rules:
  - rule_id: quotation-revise-stale-version
    parent_entity: Quotation
    write_endpoint: "POST /chandlery/quotations/{id}/revise"
    occ_field: expected_quotation_version
    description: |
      Revising a SENT Quotation whose version has advanced since the client
      last observed it is rejected. A prior successful revise legitimately
      re-prices and re-issues the same quotation, so a writer holding an older
      version would otherwise silently overwrite newer negotiated terms.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: stock-adjustment-stale-version
    parent_entity: StockLot
    write_endpoint: "POST /chandlery/stock-lots/{id}/adjustments"
    occ_field: expected_stock_lot_version
    description: |
      Posting a cycle-count adjustment to a StockLot whose version has
      advanced since the client last observed it is rejected. Each adjustment
      legitimately re-bases received_qty and on_hand_qty, so an adjustment
      computed from an older observed quantity must not apply blindly.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
# All money integer cents. All division/multiplication rounding: round_half_up
# to whole cents at the pinned step. Whole hours = floor(elapsed_seconds/3600).
calculations:
  - name: line_pricing
    trigger: "quotation create/revise (variant provisional); invoice issuance (variant final)"
    algorithm: tiered_pricing
    formula: |
      Per line:
        line_base_cents     = unit_price_cents * qty
        duty_free_eligible  = vessel_call.foreign_going
                              AND vessel_call.customs_clearance_status == CLEARED
                              AND catalog_item.bonded_eligible
        duty_cents          = 0 if duty_free_eligible
                              else round_half_up(line_base_cents * duty_rate_pct / 100)
        cold_hours          = variant-specific (see variants)
        cold_surcharge_cents = 0 unless catalog_item.requires_cold_chain;
                              else qty * cold_rate(cold_hours) where
                                cold_rate(h) = 5*h                    if h <= 72
                                             = 5*72 + 12*(h-72)       if h > 72
        line_total_cents    = line_base_cents + duty_cents + cold_surcharge_cents
      Non-linear interactions: qty scales both base and cold surcharge; the duty
      branch is conditional on cross-entity customs state; the cold rate is
      tiered with a kink at 72h. Inputs: qty, unit_price_cents, duty_rate_pct,
      requires_cold_chain, bonded_eligible, foreign_going, clearance, hours.
    input_set: "quotation: the quotation's lines (qty = quoted qty); invoice: the order's lines with qty := qty_delivered (shortage-reduced)"
    constants:
      COLD_TIER1_MAX_HOURS: 72
      COLD_TIER1_RATE_CENTS: 5
      COLD_TIER2_RATE_CENTS: 12
    precision: "integer cents; round_half_up at the duty step and nowhere else inside a line"
    variants:
      - name: provisional
        when: "quotation creation and revise"
        difference: "qty = quoted qty; duty_free_eligible evaluated with the CURRENT customs_clearance_status (PENDING or REJECTED => dutiable); cold_hours = whole hours between vessel_call.scheduled_eta and scheduled_etd (planned port stay)"
      - name: final
        when: "invoice issuance"
        difference: "qty = qty_delivered per line (can be lower after shortage); duty_free_eligible evaluated with the clearance status AT ISSUANCE; cold_hours = whole hours between order.accepted_at and the LAST delivery confirmed_at of the order (actuals); can legitimately diverge from provisional for identical quoted data"

  - name: order_totals
    trigger: "quotation create/revise (on provisional line totals); invoice issuance (on final line totals)"
    algorithm: aggregation
    formula: |
      Rounding order is PINNED (mode: nested rounding where order matters):
        1. compute every line_total_cents exactly as line_pricing (each line
           already rounded at its duty step)
        2. subtotal_cents = SUM(line_total_cents)         -- sum of rounded lines
        3. rebate_cents   = volume_rebate(subtotal_cents)  -- see volume_rebate
        4. total_cents    = subtotal_cents - rebate_cents
      The alternative order (sum unrounded line components, round once at the
      end) produces different cents when several lines carry fractional duty;
      this scaffold pins per-line-then-sum.
      For invoices: duty_free_subtotal_cents = SUM(line_total_cents of duty-free lines),
      dutiable_subtotal_cents = SUM(line_total_cents of dutiable lines),
      total_duty_cents = SUM(duty_cents of dutiable lines),
      then total_usd_cents = subtotal_cents - rebate_cents and
      total_cents = round_half_up(total_usd_cents * fx_rate_to_settlement).
    input_set: "all lines of the quotation (provisional) or all delivered lines of the order (final)"
    constants: {}
    precision: "integer cents; per-line rounding before summation"

  - name: volume_rebate
    trigger: "inside order_totals, step 3"
    algorithm: threshold
    formula: |
      Circular-looking dependency pinned by evaluation order:
        (1) subtotal_cents is computed WITHOUT any rebate
        (2) tier is read from that PRE-REBATE subtotal:
              subtotal >= 1,000,000  -> pct = 7
              subtotal >=   500,000  -> pct = 4
              else                   -> pct = 0
            (boundary is inclusive: subtotal == 500,000 exactly => 4%)
        (3) rebate_cents = round_half_up(subtotal_cents * pct / 100)
        (4) total_cents  = subtotal_cents - rebate_cents
      Note total_cents can drop BELOW the tier boundary (e.g. 500,000 -> 480,000);
      the tier MUST NOT be re-evaluated on the post-rebate total.
    input_set: "the single order/quotation subtotal under computation"
    constants:
      TIER1_SUBTOTAL_CENTS: 500000
      TIER1_PCT: 4
      TIER2_SUBTOTAL_CENTS: 1000000
      TIER2_PCT: 7
    precision: "integer cents; round_half_up on the rebate"

  - name: duty_split
    trigger: "invoice issuance (after line_pricing final)"
    algorithm: aggregation
    formula: |
      Partition invoice lines by their duty_free flag:
        duty_free_subtotal_cents = SUM(line_total_cents | duty_free)
        dutiable_subtotal_cents  = SUM(line_total_cents | not duty_free)   -- includes duty_cents
        total_duty_cents         = SUM(duty_cents | not duty_free)
      A line is duty_free iff (foreign_going AND clearance == CLEARED AND
      bonded_eligible) at issuance. PROVISIONS/DECK/ENGINE/CABIN items with
      bonded_eligible == false are ALWAYS dutiable regardless of clearance.
    input_set: "invoice lines computed by line_pricing variant final"
    constants: {}
    precision: "integer cents (no new rounding; sums of already-rounded line values)"

  - name: stock_reservation_waterfall
    trigger: "quotation accept"
    algorithm: waterfall_allocation
    formula: |
      For each order line (processed in the order the lines appear in the
      quotation payload), allocate qty across the CatalogItem's StockLots:
        candidates  = StockLots with catalog_item_id == line.catalog_item_id
                      AND (on_hand_qty - reserved_qty) > 0
        order       = created_at ASC, tie-break lot_code ASC (never id)
        walk candidates in order, take alloc = min(remaining_need, on_hand - reserved)
        if any line cannot be fully allocated -> reject the whole accept with
        ERR_STOCK_INSUFFICIENT (no partial reservation persists)
      COLD_CHAIN gate (business_constraint): for lines whose item
      requires_cold_chain, only COLD_STORE lots are eligible candidates, and per
      lot: SUM(reserved allocations whose [accepted_at, reservation_window_end)
      half-open window overlaps the new order's window) + new_alloc <= capacity_qty,
      else ERR_COLD_CHAIN_CAPACITY_EXCEEDED. Half-open semantics: windows that
      merely touch (end == start) do NOT overlap.
    input_set: "order lines; StockLots of the referenced catalog items"
    constants: {}
    precision: "integer units; no rounding"

  - name: agent_credit_exposure
    trigger: "recomputed on order accept, order cancel, vessel depart cascade, invoice issuance, payment, credit note apply/revoke"
    algorithm: aggregation
    formula: |
      committed_exposure_cents(agent) =
          SUM(order.total_cents | order.agent_id == agent
                                AND order.payment_status == UNINVOICED
                                AND order.fulfillment_status IN {OPEN, PARTIALLY_DELIVERED, DELIVERED})
        + SUM(invoice.outstanding_cents | invoice order's agent == agent
                                AND invoice.status IN {ISSUED, PARTIALLY_PAID})
      settled_exposure_cents(agent) =
          SUM(invoice.outstanding_cents | invoice order's agent == agent
                                AND invoice.status IN {ISSUED, PARTIALLY_PAID})
      NOTE the currency caveat is intentional and pinned: order totals are USD
      cents and invoice outstanding is settlement cents; the exposure sums them
      raw (a documented conservative approximation the PRD must state).
    input_set: "Orders and Invoices reachable via agent_id (invoices via their order's agent_id); VOID / PAID / CREDITED invoices and CANCELLED orders excluded"
    constants: {}
    precision: "integer cents"
    variants:
      - name: committed
        when: "credit-limit gate at quotation accept; agent GET"
        difference: "includes accepted-but-uninvoiced order totals (USD cents)"
      - name: settled
        when: "agent GET"
        difference: "invoiced outstanding only (settlement cents); diverges from committed whenever an accepted order is not yet invoiced"

  - name: credit_limit_check
    trigger: "quotation accept (after order_totals provisional)"
    algorithm: threshold
    formula: |
      remaining_credit = agent.credit_limit_cents - agent.committed_exposure_cents
      reject with ERR_CREDIT_LIMIT_EXCEEDED iff order_total_cents > remaining_credit
      Boundary is inclusive-accept: order_total_cents == remaining_credit succeeds.
    input_set: "the accepting order's total; the agent's committed exposure BEFORE this order"
    constants: {}
    precision: "integer cents"

  - name: fx_payment_settlement
    trigger: "POST /chandlery/invoices/{id}/payments"
    algorithm: aggregation
    formula: |
      converted_amount_cents = amount_cents                              if currency == invoice.settlement_currency
                             = round_half_up(amount_cents * fx_rate_to_invoice_currency)  otherwise (rate required)
      new_paid = invoice.paid_amount_cents + converted_amount_cents
      delta    = new_paid - invoice.outstanding_cents        -- outstanding BEFORE this payment
      if delta > 50            -> ERR_PAYMENT_OVERPAYMENT (422)
      if delta in [-inf, -51)  -> PARTIALLY_PAID (i.e. new_paid < outstanding - 50 stays partial)
      if delta in [-50, +50]   -> invoice closes: PAID, fx_writeoff_cents = outstanding - new_paid
                                  (positive writeoff forgives an underpayment; negative books an overpayment),
                                  this payment's writeoff_applied_cents = fx_writeoff_cents,
                                  outstanding_cents := 0
      else                     -> outstanding_cents := outstanding - converted_amount_cents
    input_set: "the invoice and the new payment; prior Payments on the invoice"
    constants:
      FX_CLOSING_TOLERANCE_CENTS: 50
    precision: "integer cents; round_half_up on conversion"

  - name: credit_note_amount
    trigger: "complaint accept (auto-credit)"
    algorithm: aggregation
    formula: |
      invoice = selector over the order's invoices: status IN {ISSUED, PARTIALLY_PAID},
                latest created_at first, tie-break higher total_cents first;
                empty candidate set -> ERR_NO_CREDITABLE_INVOICE.
      gross_usd_cents = SUM over complaint lines of
                        (invoice line's unit_price_cents * rejected_qty)
                        -- invoice line matched by catalog_item_id; complaint on an
                        -- item not present on the invoice contributes 0
      gross_amount_cents = round_half_up(gross_usd_cents * invoice.fx_rate_to_settlement)
      restocking_fee_cents = max(500, round_half_up(gross_amount_cents * 5 / 100))
      creditable_remaining = invoice.total_cents - invoice.credited_amount_cents
      amount_cents = min(gross_amount_cents - restocking_fee_cents, creditable_remaining)
      if amount_cents <= 0 -> complaint accept fails with ERR_NO_CREDITABLE_INVOICE
    input_set: "accepted complaint lines; the selected invoice's lines, totals, and existing credits"
    constants:
      RESTOCKING_PCT: 5
      RESTOCKING_MIN_CENTS: 500
    precision: "integer cents; round_half_up per pinned step"

  - name: cold_chain_hours
    trigger: "line_pricing (both variants)"
    algorithm: chronological
    formula: |
      provisional variant: whole_hours(scheduled_etd - scheduled_eta)
      final variant:       whole_hours(last_delivery.confirmed_at - order.accepted_at)
      whole_hours = floor(seconds / 3600); negative clamps to 0.
      Orderliness matters for final: uses the LAST confirmed_at across the
      order's DELIVERED deliveries (max timestamp; ties impossible because a
      delivery's confirmed_at is unique per confirm call against the logical clock).
    input_set: "vessel call schedule (provisional) or order + its deliveries (final)"
    constants: {}
    precision: "whole hours, floor"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - { priority: 1, category: auth, check: "X-User-ID and X-User-Role headers present and non-empty", error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http_status: 400, applies_to: "all endpoints" }
  - { priority: 2, category: auth, check: "X-User-Role is permitted for this endpoint per §1.5 roles; for entity_backed roles with ownership rules (VesselCateringOfficer acting on own call's requisitions/quotations/deliveries/complaints; ShipAgentClerk paying only own agent's invoices) X-User-ID must match the owning entity id", error_id: ERR_INSUFFICIENT_PERMISSIONS, http_status: 403, applies_to: "all endpoints" }
  - { priority: 3, category: existence, check: "Path and body-referenced resource ids exist, validated left-to-right along the path", error_id: "ERR_VESSEL_CALL_NOT_FOUND | ERR_AGENT_NOT_FOUND | ERR_CATALOG_ITEM_NOT_FOUND | ERR_STOCK_LOT_NOT_FOUND | ERR_REQUISITION_NOT_FOUND | ERR_QUOTATION_NOT_FOUND | ERR_ORDER_NOT_FOUND | ERR_DELIVERY_NOT_FOUND | ERR_INVOICE_NOT_FOUND | ERR_COMPLAINT_NOT_FOUND | ERR_CREDIT_NOTE_NOT_FOUND", http_status: 404, applies_to: "all endpoints with resource ids" }
  - { priority: 4, category: existence, check: "Request body well-formed: required fields present, types correct, enums in range, scheduled_etd > scheduled_eta", error_id: ERR_INVALID_REQUEST, http_status: 400, applies_to: "all POST endpoints" }
  - { priority: 5, category: state, check: "Vessel-call-level gate: quotation accept requires VesselCall.status == IN_PORT", error_id: ERR_VESSEL_CALL_NOT_IN_PORT, http_status: 409, applies_to: "POST /chandlery/quotations/{id}/accept" }
  - { priority: 5, category: state, check: "Vessel-call-level gate: arrive requires SCHEDULED", error_id: ERR_VESSEL_CALL_NOT_ARRIVABLE, http_status: 409, applies_to: "POST /chandlery/vessel-calls/{id}/arrive" }
  - { priority: 5, category: state, check: "Vessel-call-level gate: depart requires IN_PORT", error_id: ERR_VESSEL_CALL_NOT_IN_PORT, http_status: 409, applies_to: "POST /chandlery/vessel-calls/{id}/depart" }
  - { priority: 5, category: state, check: "Vessel-call-level gate: cancel requires SCHEDULED", error_id: ERR_VESSEL_CALL_NOT_CANCELLABLE, http_status: 409, applies_to: "POST /chandlery/vessel-calls/{id}/cancel" }
  - { priority: 5, category: state, check: "Resource-level transition preconditions per §1.2 (e.g. quotation SENT for accept/revise, DRAFT for send, delivery OUT_FOR_DELIVERY for confirm, complaint SUBMITTED for review, credit note APPLIED for revoke)", error_id: "ERR_QUOTATION_NOT_SENDABLE | ERR_QUOTATION_NOT_REVISABLE | ERR_QUOTATION_NOT_ACCEPTABLE | ERR_QUOTATION_NOT_WITHDRAWABLE | ERR_REQUISITION_NOT_SUBMITTABLE | ERR_REQUISITION_NOT_RECALLABLE | ERR_REQUISITION_NOT_OPEN_FOR_QUOTES | ERR_REQUISITION_HAS_LIVE_QUOTATION | ERR_ORDER_NOT_CANCELLABLE | ERR_ORDER_NOT_INVOICABLE | ERR_DELIVERY_NOT_DISPATCHABLE | ERR_DELIVERY_NOT_CONFIRMABLE | ERR_INVOICE_NOT_PAYABLE | ERR_COMPLAINT_NOT_REVIEWABLE | ERR_COMPLAINT_NOT_REOPENABLE | ERR_CREDIT_NOTE_NOT_REVOCABLE | ERR_CUSTOMS_STATE_INVALID", http_status: 409, applies_to: "all transition endpoints" }
  - { priority: 6, category: state, check: "OCC: expected_<parent>_version equals the parent's current version", error_id: ERR_STALE_VERSION, http_status: 412, applies_to: "POST /chandlery/quotations/{id}/revise; POST /chandlery/stock-lots/{id}/adjustments" }
  - { priority: 7, category: business_safety, check: "Customs gate: a delivery containing any line whose catalog item is bonded_eligible requires the order's VesselCall.customs_clearance_status == CLEARED", error_id: ERR_CUSTOMS_CLEARANCE_REQUIRED, http_status: 403, applies_to: "POST /chandlery/orders/{id}/deliveries" }
  - { priority: 8, category: business_safety, check: "Bonded eligibility: a quotation line may not substitute INTO a bonded_eligible item unless the original requisition line's item is also bonded_eligible; and duty-free treatment never applies to bonded_eligible == false items", error_id: ERR_BONDED_ITEM_NOT_ELIGIBLE, http_status: 422, applies_to: "POST /chandlery/requisitions/{id}/quotations; POST /chandlery/quotations/{id}/revise" }
  - { priority: 9, category: business_safety, check: "Segregation of duties: (a) delivery confirmer X-User-ID != delivery.created_by_user_id; (b) complaint review on a complaint with reopen_count >= 1 requires X-User-ID != last_reviewer_user_id", error_id: ERR_SEGREGATION_OF_DUTIES_VIOLATION, http_status: 403, applies_to: "POST /chandlery/deliveries/{id}/confirm; POST /chandlery/complaints/{id}/accept; POST /chandlery/complaints/{id}/reject" }
  - { priority: 10, category: business_temporal, check: "window_end must be strictly after window_start", error_id: ERR_DELIVERY_WINDOW_INVERTED, http_status: 400, applies_to: "POST /chandlery/orders/{id}/deliveries" }
  - { priority: 11, category: business_temporal, check: "Delivery window containment: window_start >= (actual_eta if set else scheduled_eta) AND window_end <= (actual_etd if set else scheduled_etd) — closed-interval containment, equality allowed on both ends", error_id: ERR_WINDOW_OUTSIDE_PORT_STAY, http_status: 409, applies_to: "POST /chandlery/orders/{id}/deliveries" }
  - { priority: 12, category: business_temporal, check: "Quotation validity: now <= valid_until (inclusive); on violation flip quotation SENT -> EXPIRED", error_id: ERR_QUOTATION_EXPIRED, http_status: 409, applies_to: "POST /chandlery/quotations/{id}/accept; POST /chandlery/quotations/{id}/revise" }
  - { priority: 13, category: business_constraint, check: "Quantities positive integers where required (>= 1 on requisition/quotation/delivery lines, payments; >= 0 on confirmed lines)", error_id: ERR_INVALID_QTY, http_status: 400, applies_to: "POST /chandlery/vessel-calls/{id}/requisitions; POST /chandlery/requisitions/{id}/quotations; POST /chandlery/orders/{id}/deliveries; POST /chandlery/deliveries/{id}/confirm; POST /chandlery/deliveries/{id}/complaints; POST /chandlery/invoices/{id}/payments; POST /chandlery/stock-lots; POST /chandlery/stock-lots/{id}/adjustments" }
  - { priority: 14, category: business_constraint, check: "Delivery quantity cap: (a) at delivery create, per line the SUM of planned qty over the order's non-terminal (SCHEDULED, OUT_FOR_DELIVERY) deliveries + qty_delivered must be <= qty_ordered; (b) at confirm, confirmed qty <= planned qty on the delivery; (c) complaint rejected_qty <= delivered qty for that item on that delivery", error_id: ERR_QTY_EXCEEDS_REMAINING, http_status: 409, applies_to: "POST /chandlery/orders/{id}/deliveries; POST /chandlery/deliveries/{id}/confirm; POST /chandlery/deliveries/{id}/complaints" }
  - { priority: 15, category: business_constraint, check: "Substitution admissibility: is_substitution lines require the requisition line's allows_substitution == true, the substitute shares the original item's category, requires_cold_chain, and every requisition line is covered exactly once", error_id: ERR_SUBSTITUTION_NOT_ALLOWED, http_status: 422, applies_to: "POST /chandlery/requisitions/{id}/quotations; POST /chandlery/quotations/{id}/revise" }
  - { name: substitution_price_cap, priority: 16, category: business_constraint, check: "Substitution price cap: substitute unit_price_cents <= round_half_up(original item base_price_cents * 115 / 100) — boundary inclusive", error_id: ERR_SUBSTITUTION_PRICE_CAP_EXCEEDED, http_status: 422, applies_to: "POST /chandlery/requisitions/{id}/quotations; POST /chandlery/quotations/{id}/revise" }
  - { priority: 17, category: business_constraint, check: "Stock availability: the reservation waterfall must fully allocate every line", error_id: ERR_STOCK_INSUFFICIENT, http_status: 409, applies_to: "POST /chandlery/quotations/{id}/accept" }
  - { priority: 18, category: business_constraint, check: "Cold-chain aggregate capacity: per COLD_STORE lot, sum of overlapping active cold reservations (half-open windows) + new allocation <= capacity_qty", error_id: ERR_COLD_CHAIN_CAPACITY_EXCEEDED, http_status: 409, applies_to: "POST /chandlery/quotations/{id}/accept" }
  - { priority: 19, category: business_referential, check: "SKU uniqueness across all CatalogItems; lot_code uniqueness per catalog_item_id", error_id: ERR_DUPLICATE_SKU, http_status: 409, applies_to: "POST /chandlery/catalog-items; POST /chandlery/stock-lots" }
  - { priority: 20, category: business_referential, check: "Payment currency admissibility: if currency != invoice.settlement_currency then fx_rate_to_invoice_currency must be present", error_id: ERR_CURRENCY_MISMATCH, http_status: 422, applies_to: "POST /chandlery/invoices/{id}/payments" }
  - { priority: 21, category: business_referential, check: "FX rates must be > 0 where provided/required (invoice fx_rate_to_settlement; payment fx_rate_to_invoice_currency)", error_id: ERR_INVALID_FX_RATE, http_status: 400, applies_to: "POST /chandlery/orders/{id}/invoices; POST /chandlery/invoices/{id}/payments" }
  - { priority: 22, category: business_referential, check: "Creditable invoice selector non-empty and computed credit amount > 0", error_id: ERR_NO_CREDITABLE_INVOICE, http_status: 409, applies_to: "POST /chandlery/complaints/{id}/accept" }
  - { priority: 23, category: business_fiscal, check: "Credit limit: order_total_cents > agent.credit_limit_cents - agent.committed_exposure_cents is rejected; equality accepted", error_id: ERR_CREDIT_LIMIT_EXCEEDED, http_status: 402, applies_to: "POST /chandlery/quotations/{id}/accept" }
  - { priority: 24, category: business_fiscal, check: "Payment overpayment: converted sum may not exceed outstanding + 50 cents", error_id: ERR_PAYMENT_OVERPAYMENT, http_status: 422, applies_to: "POST /chandlery/invoices/{id}/payments" }

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
# GET endpoints (read surface) are available to all eight roles; write
# endpoints carry the restricted role lists shown.
endpoints:
  # --- logical clock (test-driving; outside business surface) ---
  - method: POST
    path: "/chandlery/_clock/set_current_utc"
    description: "Set the server's logical clock (test-driving endpoint). Startup default before any call: 2026-08-01T00:00:00Z; the clock NEVER falls back to wall-clock time. All system timestamps (created_at, accepted_at, confirmed_at, issued_at, actual_eta/etd) read this clock."
    roles: [ChandlerOpsManager]
    code: 200
    input: [to_iso8601]
    output: "{ now_iso8601: string }"
    side_effects: ["lazy quotation expiry re-evaluation is driven by this clock"]

  # --- ShipAgent ---
  - method: POST
    path: "/chandlery/ship-agents"
    description: "Register a paying ship agent"
    roles: [FinanceController]
    code: 201
    input: [name, settlement_currency, credit_limit_cents, payment_terms_days]
    output: ShipAgent
    side_effects: ["committed_exposure_cents = 0; settled_exposure_cents = 0"]

  - method: GET
    path: "/chandlery/ship-agents/{id}"
    description: "Get one ShipAgent including computed exposure fields"
    roles: [ChandlerOpsManager, ChandlerSalesRep, WarehouseSupervisor, FinanceController, QualityAssuranceLead, PortCustomsOfficer, VesselCateringOfficer, ShipAgentClerk]
    code: 200
    input: []
    output: ShipAgent
    side_effects: []

  - method: GET
    path: "/chandlery/ship-agents/{id}/vessel-calls"
    description: "List VesselCalls served by this agent (FK reverse lookup)"
    roles: [ChandlerOpsManager, ChandlerSalesRep, WarehouseSupervisor, FinanceController, QualityAssuranceLead, PortCustomsOfficer, VesselCateringOfficer, ShipAgentClerk]
    code: 200
    input: ["limit?", "offset?"]
    output: "VesselCall[]"
    side_effects: []

  - method: GET
    path: "/chandlery/ship-agents/{id}/orders"
    description: "List Orders billed to this agent (FK reverse lookup)"
    roles: [ChandlerOpsManager, ChandlerSalesRep, WarehouseSupervisor, FinanceController, QualityAssuranceLead, PortCustomsOfficer, VesselCateringOfficer, ShipAgentClerk]
    code: 200
    input: ["limit?", "offset?"]
    output: "Order[]"
    side_effects: []

  # --- VesselCall ---
  - method: POST
    path: "/chandlery/vessel-calls"
    description: "Register a vessel port call"
    roles: [ChandlerOpsManager]
    code: 201
    input: [vessel_name, imo_number, agent_id, port_code, scheduled_eta, scheduled_etd, foreign_going]
    output: VesselCall
    side_effects: ["status = SCHEDULED; customs_clearance_status = PENDING"]

  - method: GET
    path: "/chandlery/vessel-calls/{id}"
    description: "Get one VesselCall"
    roles: [ChandlerOpsManager, ChandlerSalesRep, WarehouseSupervisor, FinanceController, QualityAssuranceLead, PortCustomsOfficer, VesselCateringOfficer, ShipAgentClerk]
    code: 200
    input: []
    output: VesselCall
    side_effects: []

  - method: POST
    path: "/chandlery/vessel-calls/{id}/arrive"
    description: "Mark the vessel arrived (actual_eta := logical now)"
    roles: [ChandlerOpsManager]
    code: 200
    input: []
    output: VesselCall
    side_effects: ["status -> IN_PORT; actual_eta := now; version += 1"]

  - method: POST
    path: "/chandlery/vessel-calls/{id}/depart"
    description: "Mark the vessel departed; cascades to deliveries, orders, invoices, stock, agent exposure"
    roles: [ChandlerOpsManager]
    code: 200
    input: []
    output: VesselCall
    side_effects:
      - "status -> DEPARTED; actual_etd := now; version += 1"
      - "non-terminal Deliveries of this call's orders -> FAILED"
      - "Orders with fulfillment OPEN -> CANCELLED (with stock release + invoice VOID cascade)"
      - "PARTIALLY_DELIVERED orders release undelivered reservation remainder"
      - "affected ShipAgent exposures recomputed"

  - method: POST
    path: "/chandlery/vessel-calls/{id}/cancel"
    description: "Cancel a SCHEDULED vessel call"
    roles: [ChandlerOpsManager]
    code: 200
    input: []
    output: VesselCall
    side_effects: ["status -> CANCELLED; non-CLOSED Requisitions -> CLOSED; version += 1"]

  - method: POST
    path: "/chandlery/vessel-calls/{id}/customs-clearance"
    description: "Customs decision on the call (PENDING <-> CLEARED/REJECTED per machine)"
    roles: [PortCustomsOfficer]
    code: 200
    input: [decision, "notes?"]
    output: VesselCall
    side_effects: ["customs_clearance_status := decision; version += 1"]

  # --- CatalogItem & StockLot ---
  - method: POST
    path: "/chandlery/catalog-items"
    description: "Create a catalog item (sku unique)"
    roles: [ChandlerOpsManager]
    code: 201
    input: [sku, name, category, bonded_eligible, requires_cold_chain, base_price_cents, "duty_rate_pct?"]
    output: CatalogItem
    side_effects: []

  - method: GET
    path: "/chandlery/catalog-items"
    description: "List catalog items with filter + pagination"
    roles: [ChandlerOpsManager, ChandlerSalesRep, WarehouseSupervisor, FinanceController, QualityAssuranceLead, PortCustomsOfficer, VesselCateringOfficer, ShipAgentClerk]
    code: 200
    input: ["category?", "requires_cold_chain?", "limit?", "offset?"]
    output: "CatalogItem[]"
    side_effects: []

  - method: POST
    path: "/chandlery/stock-lots"
    description: "Create a stock lot (lot_code unique per catalog item)"
    roles: [WarehouseSupervisor]
    code: 201
    input: [catalog_item_id, lot_code, storage_tier, received_qty, capacity_qty]
    output: StockLot
    side_effects: ["on_hand_qty := received_qty; reserved_qty := 0"]

  - method: GET
    path: "/chandlery/stock-lots"
    description: "List stock lots (FK reverse lookup for StockLot.catalog_item_id)"
    roles: [ChandlerOpsManager, ChandlerSalesRep, WarehouseSupervisor, FinanceController, QualityAssuranceLead, PortCustomsOfficer, VesselCateringOfficer, ShipAgentClerk]
    code: 200
    input: ["catalog_item_id?", "storage_tier?", "limit?", "offset?"]
    output: "StockLot[]"
    side_effects: []

  - method: GET
    path: "/chandlery/stock-lots/{id}"
    description: "Get one StockLot"
    roles: [ChandlerOpsManager, ChandlerSalesRep, WarehouseSupervisor, FinanceController, QualityAssuranceLead, PortCustomsOfficer, VesselCateringOfficer, ShipAgentClerk]
    code: 200
    input: []
    output: StockLot
    side_effects: []

  - method: POST
    path: "/chandlery/stock-lots/{id}/adjustments"
    description: "Cycle-count adjustment (OCC-guarded): received_qty += adjustment_qty, on_hand_qty += adjustment_qty"
    roles: [WarehouseSupervisor]
    code: 200
    input: [adjustment_qty, reason, expected_stock_lot_version]
    output: StockLot
    side_effects:
      - "increments StockLot.version by 1"
      - "received_qty += adjustment_qty; on_hand_qty += adjustment_qty (reserved_qty unchanged; adjustment_qty may be negative but neither field may go negative nor below reserved_qty -> ERR_INVALID_QTY)"

  # --- Requisition ---
  - method: POST
    path: "/chandlery/vessel-calls/{id}/requisitions"
    description: "Create a requisition (header + lines) for a vessel call; caller must be that call's officer"
    roles: [VesselCateringOfficer]
    code: 201
    input: [title, lines]
    output: Requisition
    side_effects: ["status = DRAFT"]

  - method: GET
    path: "/chandlery/vessel-calls/{id}/requisitions"
    description: "List requisitions of a vessel call (FK reverse lookup)"
    roles: [ChandlerOpsManager, ChandlerSalesRep, WarehouseSupervisor, FinanceController, QualityAssuranceLead, PortCustomsOfficer, VesselCateringOfficer, ShipAgentClerk]
    code: 200
    input: ["limit?", "offset?"]
    output: "Requisition[]"
    side_effects: []

  - method: GET
    path: "/chandlery/requisitions/{id}"
    description: "Get one Requisition"
    roles: [ChandlerOpsManager, ChandlerSalesRep, WarehouseSupervisor, FinanceController, QualityAssuranceLead, PortCustomsOfficer, VesselCateringOfficer, ShipAgentClerk]
    code: 200
    input: []
    output: Requisition
    side_effects: []

  - method: POST
    path: "/chandlery/requisitions/{id}/submit"
    description: "Submit a DRAFT requisition"
    roles: [VesselCateringOfficer]
    code: 200
    input: []
    output: Requisition
    side_effects: ["status -> SUBMITTED; submitted_at := now; version += 1"]

  - method: POST
    path: "/chandlery/requisitions/{id}/recall"
    description: "Recall a SUBMITTED requisition to DRAFT (cycle), blocked while a SENT quotation exists"
    roles: [VesselCateringOfficer]
    code: 200
    input: []
    output: Requisition
    side_effects: ["status -> DRAFT; version += 1"]

  # --- Quotation ---
  - method: POST
    path: "/chandlery/requisitions/{id}/quotations"
    description: "Draft a priced quotation against a SUBMITTED|QUOTED requisition"
    roles: [ChandlerSalesRep]
    code: 201
    input: [lines, valid_until]
    output: Quotation
    side_effects:
      - "provisional_total_cents computed (line_pricing provisional + order_totals)"
      - "authored_by_user_id := X-User-ID; status = DRAFT"

  - method: GET
    path: "/chandlery/requisitions/{id}/quotations"
    description: "List quotations of a requisition (FK reverse lookup)"
    roles: [ChandlerOpsManager, ChandlerSalesRep, WarehouseSupervisor, FinanceController, QualityAssuranceLead, PortCustomsOfficer, VesselCateringOfficer, ShipAgentClerk]
    code: 200
    input: ["limit?", "offset?"]
    output: "Quotation[]"
    side_effects: []

  - method: GET
    path: "/chandlery/quotations/{id}"
    description: "Get one Quotation"
    roles: [ChandlerOpsManager, ChandlerSalesRep, WarehouseSupervisor, FinanceController, QualityAssuranceLead, PortCustomsOfficer, VesselCateringOfficer, ShipAgentClerk]
    code: 200
    input: []
    output: Quotation
    side_effects: []

  - method: POST
    path: "/chandlery/quotations/{id}/send"
    description: "Send a DRAFT quotation to the vessel"
    roles: [ChandlerSalesRep]
    code: 200
    input: []
    output: Quotation
    side_effects: ["status -> SENT; requisition -> QUOTED; provisional_total_cents recomputed; version += 1"]

  - method: POST
    path: "/chandlery/quotations/{id}/revise"
    description: "Revise a SENT quotation (cyclic SENT -> SENT; OCC-guarded)"
    roles: [ChandlerSalesRep]
    code: 200
    input: [lines, valid_until, expected_quotation_version]
    output: Quotation
    side_effects:
      - "increments Quotation.version by 1"
      - "lines and valid_until replaced; revision_count += 1; provisional_total_cents recomputed"

  - method: POST
    path: "/chandlery/quotations/{id}/accept"
    description: "Vessel accepts a SENT quotation; creates the Order, reserves stock, gates on credit/customs-independent rules"
    roles: [VesselCateringOfficer]
    code: 201
    input: []
    output: Order
    side_effects:
      - "quotation -> ACCEPTED; requisition -> CLOSED"
      - "Order created (OPEN x UNINVOICED); accepted_at := now; reservation_window_end := scheduled_etd"
      - "stock_reservation_waterfall runs; StockLots debited on_hand / credited reserved"
      - "ShipAgent.committed_exposure_cents recomputed"
      - "quotation.version += 1"

  - method: POST
    path: "/chandlery/quotations/{id}/withdraw"
    description: "Withdraw a DRAFT or SENT quotation"
    roles: [ChandlerSalesRep]
    code: 200
    input: []
    output: Quotation
    side_effects: ["status -> WITHDRAWN; if it was the only SENT quotation, requisition QUOTED -> SUBMITTED; version += 1"]

  - method: GET
    path: "/chandlery/quotations/{id}/orders"
    description: "List the order created from this quotation (FK reverse lookup; array of 0 or 1)"
    roles: [ChandlerOpsManager, ChandlerSalesRep, WarehouseSupervisor, FinanceController, QualityAssuranceLead, PortCustomsOfficer, VesselCateringOfficer, ShipAgentClerk]
    code: 200
    input: []
    output: "Order[]"
    side_effects: []

  # --- Order ---
  - method: GET
    path: "/chandlery/orders/{id}"
    description: "Get one Order (both parallel status dimensions + totals)"
    roles: [ChandlerOpsManager, ChandlerSalesRep, WarehouseSupervisor, FinanceController, QualityAssuranceLead, PortCustomsOfficer, VesselCateringOfficer, ShipAgentClerk]
    code: 200
    input: []
    output: Order
    side_effects: []

  - method: POST
    path: "/chandlery/orders/{id}/cancel"
    description: "Cancel an undelivered order (compensating cascade)"
    roles: [ChandlerOpsManager]
    code: 200
    input: []
    output: Order
    side_effects:
      - "fulfillment_status -> CANCELLED"
      - "deliveries SCHEDULED|OUT_FOR_DELIVERY -> CANCELLED"
      - "stock allocations released (reserved -> on_hand)"
      - "unpaid ISSUED invoice -> VOID"
      - "ShipAgent exposures recomputed"

  # --- Delivery ---
  - method: POST
    path: "/chandlery/orders/{id}/deliveries"
    description: "Schedule a gangway delivery run within the port stay"
    roles: [WarehouseSupervisor]
    code: 201
    input: [window_start, window_end, lines]
    output: Delivery
    side_effects: ["status = SCHEDULED; created_by_user_id := X-User-ID"]

  - method: GET
    path: "/chandlery/orders/{id}/deliveries"
    description: "List deliveries of an order (FK reverse lookup)"
    roles: [ChandlerOpsManager, ChandlerSalesRep, WarehouseSupervisor, FinanceController, QualityAssuranceLead, PortCustomsOfficer, VesselCateringOfficer, ShipAgentClerk]
    code: 200
    input: ["limit?", "offset?"]
    output: "Delivery[]"
    side_effects: []

  - method: GET
    path: "/chandlery/deliveries/{id}"
    description: "Get one Delivery"
    roles: [ChandlerOpsManager, ChandlerSalesRep, WarehouseSupervisor, FinanceController, QualityAssuranceLead, PortCustomsOfficer, VesselCateringOfficer, ShipAgentClerk]
    code: 200
    input: []
    output: Delivery
    side_effects: []

  - method: POST
    path: "/chandlery/deliveries/{id}/dispatch"
    description: "Mark a scheduled delivery out for delivery"
    roles: [WarehouseSupervisor]
    code: 200
    input: []
    output: Delivery
    side_effects: ["status -> OUT_FOR_DELIVERY; version += 1"]

  - method: POST
    path: "/chandlery/deliveries/{id}/confirm"
    description: "Vessel-side receipt confirmation with signature; shortage-aware; cascades to order fulfillment and stock"
    roles: [VesselCateringOfficer]
    code: 200
    input: [receiver_name, signature_ref, confirmed_lines]
    output: Delivery
    side_effects:
      - "status -> DELIVERED; confirmed_at := now; version += 1"
      - "Order lines qty_delivered += confirmed qty; fulfillment re-derived"
      - "StockLots: reserved_qty and on_hand_qty reduced by confirmed qty"
      - "ShipAgent exposures unchanged (order total frozen) but order version += 1"

  # --- Invoice & Payment ---
  - method: POST
    path: "/chandlery/orders/{id}/invoices"
    description: "Issue the final-priced invoice for a fully-delivered (or departed-partial) order"
    roles: [FinanceController]
    code: 201
    input: [fx_rate_to_settlement]
    output: Invoice
    side_effects:
      - "line_pricing final + duty_split + order_totals computed on delivered qty"
      - "Order.payment_status -> INVOICED"
      - "due_date := issued_at + agent.payment_terms_days"
      - "ShipAgent exposures recomputed (order leg removed, invoice leg added)"

  - method: GET
    path: "/chandlery/orders/{id}/invoices"
    description: "List invoices of an order (FK reverse lookup; array of 0 or 1)"
    roles: [ChandlerOpsManager, ChandlerSalesRep, WarehouseSupervisor, FinanceController, QualityAssuranceLead, PortCustomsOfficer, VesselCateringOfficer, ShipAgentClerk]
    code: 200
    input: []
    output: "Invoice[]"
    side_effects: []

  - method: GET
    path: "/chandlery/invoices/{id}"
    description: "Get one Invoice"
    roles: [ChandlerOpsManager, ChandlerSalesRep, WarehouseSupervisor, FinanceController, QualityAssuranceLead, PortCustomsOfficer, VesselCateringOfficer, ShipAgentClerk]
    code: 200
    input: []
    output: Invoice
    side_effects: []

  - method: POST
    path: "/chandlery/invoices/{id}/payments"
    description: "Agent clerk records a payment (multi-currency, tolerance write-off)"
    roles: [ShipAgentClerk]
    code: 201
    input: [amount_cents, currency, "fx_rate_to_invoice_currency?"]
    output: Payment
    side_effects:
      - "fx_payment_settlement runs; invoice paid/outstanding/writeoff updated"
      - "invoice status -> PARTIALLY_PAID | PAID; Order.payment_status follows"
      - "ShipAgent exposures recomputed"

  - method: GET
    path: "/chandlery/invoices/{id}/payments"
    description: "List payments of an invoice (FK reverse lookup)"
    roles: [ChandlerOpsManager, ChandlerSalesRep, WarehouseSupervisor, FinanceController, QualityAssuranceLead, PortCustomsOfficer, VesselCateringOfficer, ShipAgentClerk]
    code: 200
    input: []
    output: "Payment[]"
    side_effects: []

  # --- QualityComplaint & CreditNote ---
  - method: POST
    path: "/chandlery/deliveries/{id}/complaints"
    description: "Vessel files a quality complaint against a DELIVERED delivery"
    roles: [VesselCateringOfficer]
    code: 201
    input: [lines, evidence_note]
    output: QualityComplaint
    side_effects: ["status = SUBMITTED"]

  - method: GET
    path: "/chandlery/deliveries/{id}/complaints"
    description: "List complaints on a delivery (FK reverse lookup)"
    roles: [ChandlerOpsManager, ChandlerSalesRep, WarehouseSupervisor, FinanceController, QualityAssuranceLead, PortCustomsOfficer, VesselCateringOfficer, ShipAgentClerk]
    code: 200
    input: ["limit?", "offset?"]
    output: "QualityComplaint[]"
    side_effects: []

  - method: POST
    path: "/chandlery/complaints/{id}/accept"
    description: "QA accepts a complaint; auto-issues and applies a CreditNote (depth-3 cascade)"
    roles: [QualityAssuranceLead]
    code: 200
    input: []
    output: QualityComplaint
    side_effects:
      - "status -> ACCEPTED; last_reviewer_user_id := X-User-ID; version += 1"
      - "CreditNote auto-created (APPLIED) per credit_note_amount"
      - "Invoice.credited_amount_cents += amount_cents; status may flip to CREDITED"
      - "Order.payment_status re-derived; ShipAgent exposures recomputed"

  - method: POST
    path: "/chandlery/complaints/{id}/reject"
    description: "QA rejects a complaint"
    roles: [QualityAssuranceLead]
    code: 200
    input: []
    output: QualityComplaint
    side_effects: ["status -> REJECTED; last_reviewer_user_id := X-User-ID; version += 1"]

  - method: POST
    path: "/chandlery/complaints/{id}/reopen"
    description: "Vessel reopens a REJECTED complaint (cycle; four-eyes rule arms)"
    roles: [VesselCateringOfficer]
    code: 200
    input: []
    output: QualityComplaint
    side_effects: ["status -> SUBMITTED; reopen_count += 1; version += 1"]

  - method: GET
    path: "/chandlery/credit-notes"
    description: "List credit notes (FK reverse lookup for CreditNote.complaint_id and CreditNote.invoice_id)"
    roles: [ChandlerOpsManager, ChandlerSalesRep, WarehouseSupervisor, FinanceController, QualityAssuranceLead, PortCustomsOfficer, VesselCateringOfficer, ShipAgentClerk]
    code: 200
    input: ["complaint_id?", "invoice_id?", "limit?", "offset?"]
    output: "CreditNote[]"
    side_effects: []

  - method: GET
    path: "/chandlery/credit-notes/{id}"
    description: "Get one CreditNote"
    roles: [ChandlerOpsManager, ChandlerSalesRep, WarehouseSupervisor, FinanceController, QualityAssuranceLead, PortCustomsOfficer, VesselCateringOfficer, ShipAgentClerk]
    code: 200
    input: []
    output: CreditNote
    side_effects: []

  - method: POST
    path: "/chandlery/credit-notes/{id}/revoke"
    description: "Revoke an APPLIED credit note (compensation)"
    roles: [FinanceController]
    code: 200
    input: []
    output: CreditNote
    side_effects:
      - "status -> REVOKED; version += 1"
      - "Invoice.credited_amount_cents -= amount_cents; outstanding recomputed; status re-derived"
      - "Order.payment_status re-derived; ShipAgent exposures recomputed"

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  # --- auth ---
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role header missing/empty" }
  - { id: ERR_INSUFFICIENT_PERMISSIONS, http: 403, condition: "Role not permitted for endpoint, or entity-backed ownership check failed (officer acting on another call's resources; clerk paying another agent's invoice)" }
  # --- request shape ---
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field, type mismatch, enum out of range, scheduled_etd <= scheduled_eta" }
  # --- not found ---
  - { id: ERR_VESSEL_CALL_NOT_FOUND, http: 404, condition: "VesselCall id not found" }
  - { id: ERR_AGENT_NOT_FOUND, http: 404, condition: "ShipAgent id not found" }
  - { id: ERR_CATALOG_ITEM_NOT_FOUND, http: 404, condition: "CatalogItem id not found (path or referenced in lines)" }
  - { id: ERR_STOCK_LOT_NOT_FOUND, http: 404, condition: "StockLot id not found" }
  - { id: ERR_REQUISITION_NOT_FOUND, http: 404, condition: "Requisition id not found" }
  - { id: ERR_QUOTATION_NOT_FOUND, http: 404, condition: "Quotation id not found" }
  - { id: ERR_ORDER_NOT_FOUND, http: 404, condition: "Order id not found" }
  - { id: ERR_DELIVERY_NOT_FOUND, http: 404, condition: "Delivery id not found" }
  - { id: ERR_INVOICE_NOT_FOUND, http: 404, condition: "Invoice id not found" }
  - { id: ERR_COMPLAINT_NOT_FOUND, http: 404, condition: "QualityComplaint id not found" }
  - { id: ERR_CREDIT_NOTE_NOT_FOUND, http: 404, condition: "CreditNote id not found" }
  # --- state ---
  - { id: ERR_VESSEL_CALL_NOT_ARRIVABLE, http: 409, condition: "arrive requires status == SCHEDULED" }
  - { id: ERR_VESSEL_CALL_NOT_IN_PORT, http: 409, condition: "Operation requires VesselCall.status == IN_PORT (depart, quotation accept) or status IN {SCHEDULED, IN_PORT} (customs-clearance)" }
  - { id: ERR_VESSEL_CALL_NOT_CANCELLABLE, http: 409, condition: "Vessel call cancel requires status == SCHEDULED" }
  - { id: ERR_CUSTOMS_STATE_INVALID, http: 409, condition: "Customs decision not admissible from current customs_clearance_status" }
  - { id: ERR_REQUISITION_NOT_SUBMITTABLE, http: 409, condition: "submit requires requisition DRAFT" }
  - { id: ERR_REQUISITION_NOT_RECALLABLE, http: 409, condition: "recall requires requisition SUBMITTED" }
  - { id: ERR_REQUISITION_HAS_LIVE_QUOTATION, http: 409, condition: "recall blocked while a SENT quotation exists on the requisition" }
  - { id: ERR_REQUISITION_NOT_OPEN_FOR_QUOTES, http: 409, condition: "quotation create requires requisition SUBMITTED or QUOTED" }
  - { id: ERR_QUOTATION_NOT_SENDABLE, http: 409, condition: "send requires quotation DRAFT" }
  - { id: ERR_QUOTATION_NOT_REVISABLE, http: 409, condition: "revise requires quotation SENT" }
  - { id: ERR_QUOTATION_NOT_ACCEPTABLE, http: 409, condition: "accept requires quotation SENT" }
  - { id: ERR_QUOTATION_NOT_WITHDRAWABLE, http: 409, condition: "withdraw requires quotation DRAFT or SENT" }
  - { id: ERR_QUOTATION_EXPIRED, http: 409, condition: "now > valid_until at send/revise/accept; quotation flips to EXPIRED" }
  - { id: ERR_ORDER_NOT_CANCELLABLE, http: 409, condition: "order cancel requires fulfillment OPEN and payment UNINVOICED or INVOICED with zero payments" }
  - { id: ERR_ORDER_NOT_INVOICABLE, http: 409, condition: "invoice issue requires payment_status == UNINVOICED and (fulfillment DELIVERED or (PARTIALLY_DELIVERED and vessel DEPARTED))" }
  - { id: ERR_DELIVERY_NOT_DISPATCHABLE, http: 409, condition: "dispatch requires delivery SCHEDULED" }
  - { id: ERR_DELIVERY_NOT_CONFIRMABLE, http: 409, condition: "confirm requires delivery OUT_FOR_DELIVERY" }
  - { id: ERR_INVOICE_NOT_PAYABLE, http: 409, condition: "payment requires invoice ISSUED or PARTIALLY_PAID" }
  - { id: ERR_COMPLAINT_NOT_REVIEWABLE, http: 409, condition: "accept/reject requires complaint SUBMITTED" }
  - { id: ERR_COMPLAINT_NOT_REOPENABLE, http: 409, condition: "reopen requires complaint REJECTED" }
  - { id: ERR_CREDIT_NOTE_NOT_REVOCABLE, http: 409, condition: "revoke requires credit note APPLIED" }
  # --- concurrency ---
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_<parent>_version does not match the parent entity's current version (OCC)" }
  # --- business safety ---
  - { id: ERR_CUSTOMS_CLEARANCE_REQUIRED, http: 403, condition: "Delivery contains bonded_eligible items but the vessel call's customs_clearance_status != CLEARED" }
  - { id: ERR_BONDED_ITEM_NOT_ELIGIBLE, http: 422, condition: "Substitution into a bonded_eligible item from a non-bonded_eligible original (or reverse)" }
  - { id: ERR_SEGREGATION_OF_DUTIES_VIOLATION, http: 403, condition: "Same X-User-ID on both sides of a segregated pair: delivery creator vs confirmer, or repeated complaint reviewer after reopen" }
  # --- business temporal ---
  - { id: ERR_DELIVERY_WINDOW_INVERTED, http: 400, condition: "window_end <= window_start" }
  - { id: ERR_WINDOW_OUTSIDE_PORT_STAY, http: 409, condition: "Delivery window not contained in [eta, etd] (closed-interval containment, equality allowed)" }
  # --- business constraint ---
  - { id: ERR_INVALID_QTY, http: 400, condition: "Quantity violates its floor (>= 1 on planned/requested/payment; >= 0 on confirmed; stock adjustment would drive a field negative or below reserved_qty)" }
  - { id: ERR_QTY_EXCEEDS_REMAINING, http: 409, condition: "Confirmed qty exceeds delivery plan or order remaining; complaint rejected_qty exceeds delivered qty for the item on that delivery" }
  - { id: ERR_SUBSTITUTION_NOT_ALLOWED, http: 422, condition: "Substitution when requisition line disallows it, or category/cold-chain mismatch, or uncovered requisition line" }
  - { id: ERR_SUBSTITUTION_PRICE_CAP_EXCEEDED, http: 422, condition: "Substitute unit_price_cents > round_half_up(original base_price_cents * 115/100)" }
  - { id: ERR_STOCK_INSUFFICIENT, http: 409, condition: "Reservation waterfall cannot fully allocate every order line" }
  - { id: ERR_COLD_CHAIN_CAPACITY_EXCEEDED, http: 409, condition: "Overlapping cold reservations on a COLD_STORE lot would exceed capacity_qty (half-open window semantics)" }
  # --- business referential ---
  - { id: ERR_DUPLICATE_SKU, http: 409, condition: "CatalogItem.sku already exists; or StockLot.lot_code already exists for the same catalog item" }
  - { id: ERR_CURRENCY_MISMATCH, http: 422, condition: "Payment currency != invoice settlement currency and no fx_rate_to_invoice_currency provided" }
  - { id: ERR_INVALID_FX_RATE, http: 400, condition: "FX rate missing where required, or <= 0" }
  - { id: ERR_NO_CREDITABLE_INVOICE, http: 409, condition: "Complaint accept finds no invoice in ISSUED|PARTIALLY_PAID for the order, or computed credit amount <= 0" }
  # --- business fiscal ---
  - { id: ERR_CREDIT_LIMIT_EXCEEDED, http: 402, condition: "order_total_cents > credit_limit_cents - committed_exposure_cents at accept" }
  - { id: ERR_PAYMENT_OVERPAYMENT, http: 422, condition: "Converted payment sum exceeds outstanding + 50 cents" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: ChandlerOpsManager
    description: "Chandler operations manager: vessel call lifecycle, catalog, order cancel, clock"
    identity: opaque
    exclusive_operations:
      - "POST /chandlery/_clock/set_current_utc"
      - "POST /chandlery/vessel-calls"
      - "POST /chandlery/vessel-calls/{id}/arrive"
      - "POST /chandlery/vessel-calls/{id}/depart"
      - "POST /chandlery/vessel-calls/{id}/cancel"
      - "POST /chandlery/catalog-items"
      - "POST /chandlery/orders/{id}/cancel"
    shared_operations: ["all GET endpoints"]

  - name: ChandlerSalesRep
    description: "Chandler sales representative: drafts, sends, revises, withdraws quotations"
    identity: opaque
    exclusive_operations:
      - "POST /chandlery/requisitions/{id}/quotations"
      - "POST /chandlery/quotations/{id}/send"
      - "POST /chandlery/quotations/{id}/revise"
      - "POST /chandlery/quotations/{id}/withdraw"
    shared_operations: ["all GET endpoints"]

  - name: WarehouseSupervisor
    description: "Warehouse supervisor: stock lots, adjustments, delivery scheduling and dispatch — never confirms a delivery"
    identity: opaque
    exclusive_operations:
      - "POST /chandlery/stock-lots"
      - "POST /chandlery/stock-lots/{id}/adjustments"
      - "POST /chandlery/orders/{id}/deliveries"
      - "POST /chandlery/deliveries/{id}/dispatch"
    shared_operations: ["all GET endpoints"]

  - name: VesselCateringOfficer
    description: "Vessel-side catering officer; X-User-ID equals the VesselCall.id they act for. Creates/submits/recalls requisitions, accepts quotations, confirms deliveries (gangway receipt signature), files and reopens complaints — only for their own call"
    identity: "entity_backed:VesselCall"
    exclusive_operations:
      - "POST /chandlery/vessel-calls/{id}/requisitions"
      - "POST /chandlery/requisitions/{id}/submit"
      - "POST /chandlery/requisitions/{id}/recall"
      - "POST /chandlery/quotations/{id}/accept"
      - "POST /chandlery/deliveries/{id}/confirm"
      - "POST /chandlery/deliveries/{id}/complaints"
      - "POST /chandlery/complaints/{id}/reopen"
    shared_operations: ["all GET endpoints"]

  - name: PortCustomsOfficer
    description: "Port customs officer: clears or rejects bonded/duty-free release on a vessel call"
    identity: opaque
    exclusive_operations:
      - "POST /chandlery/vessel-calls/{id}/customs-clearance"
    shared_operations: ["all GET endpoints"]

  - name: FinanceController
    description: "Finance controller: registers agents, issues invoices, revokes credit notes"
    identity: opaque
    exclusive_operations:
      - "POST /chandlery/ship-agents"
      - "POST /chandlery/orders/{id}/invoices"
      - "POST /chandlery/credit-notes/{id}/revoke"
    shared_operations: ["all GET endpoints"]

  - name: ShipAgentClerk
    description: "Clerk of the paying ship agent; X-User-ID equals the ShipAgent.id they act for. Records payments only against invoices billed to their own agent"
    identity: "entity_backed:ShipAgent"
    exclusive_operations:
      - "POST /chandlery/invoices/{id}/payments"
    shared_operations: ["all GET endpoints"]

  - name: QualityAssuranceLead
    description: "QA lead: accepts/rejects complaints (four-eyes rule applies after a reopen). Never issues credit notes directly — credit is auto-created by the accept transition"
    identity: opaque
    exclusive_operations:
      - "POST /chandlery/complaints/{id}/accept"
      - "POST /chandlery/complaints/{id}/reject"
    shared_operations: ["all GET endpoints"]
