      - name: account_reinstatement_blocked_while_any_misuse_case_stays_open
        grounds:
          - state_machines.Account.SUSPENDED_to_ACTIVE
          - entities.MisuseCase.fields.status
          - endpoints["POST /esa/accounts/{id}/status-actions"]
          - errors.ERR_INVALID_STATE_TRANSITION
