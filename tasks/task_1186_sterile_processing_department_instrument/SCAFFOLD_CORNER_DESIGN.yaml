          trigger:
            - { call: "POST /spd/loaner-sets/${ln}/mark-ready", as: SpdTechnician, as_user_id: "${tech_a}", captures: { e1: "$.data.error_id" } }
            - { call: "POST /spd/loaner-sets/${ln}/receive", as: SpdTechnician, as_user_id: "${tech_a}", captures: { rst: "$.data.status" } }
            - { call: "POST /spd/loaner-sets/${ln}/receive", as: SpdTechnician, as_user_id: "${tech_a}", captures: { e2: "$.data.error_id" } }
            - { call: "POST /spd/loaner-sets/${ln}/mark-ready", as: SpdTechnician, as_user_id: "${tech_a}", captures: { rst2: "$.data.status" } }
          assert:
            - "e1 == ERR_LOANER_NOT_RECEIVED (BOOKED loaner cannot be marked ready)"
            - "rst == RECEIVED (clock default 2026-05-01 <= due_by)"
            - "e2 == ERR_LOANER_NOT_BOOKED (double receive)"
            - "rst2 == READY"

      - name: technician_suspend_reinstate_gates
