            - { call: "POST /cable-diagnostics/faults/${f}/pinpoint", payload: { trace_time_us: 20.0, pinpoint_method: "PULSE_ECHO" }, as: FaultCrewLead }
          trigger:
            - { call: "POST /cable-diagnostics/excavation-orders", payload: { fault_record_id: "${f}", target_location_m: 1560.0, dig_start: "2026-08-13T09:00:00Z", dig_end: "2026-08-13T10:00:00Z", permit_ref: "MX-200", cost_cents: 80000 }, as: FaultCrewLead, captures: { err: "$.data.error_id" } }
          assert:
            - "error_id == ERR_DIG_OUTSIDE_OUTAGE with http 409 (NOT ERR_BUDGET_EXCEEDED)"
            - "no ExcavationOrder created for fault ${f} (GET /cable-diagnostics/faults/${f}/excavation-orders returns [])"

      - name: forbidden_role_beats_not_found
        grounds:
          - validations[priority=2]
          - validations[priority=4]
        distinguishing_aspect: |
          Error-category pair authorization vs existence: a FieldTechnician calling
          POST /test-jobs/{nonexistent-uuid}/start violates both role permission
          (priority 2) and existence (priority 4); ERR_FORBIDDEN MUST win so resource
          existence is never leaked across roles.
        test_recipe:
          setup:
            - "One unrelated circuit exists; the target job id does not exist."
          setup_api_calls:
            - { call: "POST /cable-diagnostics/circuits", payload: { circuit_ref: "CKT-PP3", voltage_class: "KV_25", length_m: 500, installation_year: 2020 }, as: SystemAdmin }
          trigger:
            - { call: "POST /cable-diagnostics/test-jobs/00000000-0000-4000-8000-0000000000ff/start", as: FieldTechnician, as_user_id: "ft-9", captures: { err: "$.data.error_id" } }
          assert:
            - "error_id == ERR_FORBIDDEN with http 403 (NOT ERR_NOT_FOUND)"

  # ------------------------------------------------------------------ Rule 6
  - rule_id: boundary_precision_check
    instances:
      - name: tan_delta_rounds_to_exact_fail_threshold
        grounds:
          - calculations.series_verdict
          - entities.TestSeries.fields.max_tan_delta_e3
        distinguishing_aspect: |
          Metric: tan-delta (1e-3) on POST evaluate. Readings are rounded to 0.1 BEFORE
          comparison: raw 79.95 rounds half-up to exactly 80.0 == TD_FAIL_MIN and >=
          triggers FAIL (fault auto-created); raw 79.94 rounds to 79.9 and stays MONITOR.
        test_recipe:
          setup:
            - "Circuit C (KV_15, length 2000); job IN_PROGRESS (flag false); permit GROUNDING_VERIFIED; assignment confirmed; series S1 ENERGIZING."
          setup_api_calls:
            - { call: "POST /cable-diagnostics/circuits", payload: { circuit_ref: "CKT-BP1", voltage_class: "KV_15", length_m: 2000, installation_year: 2015 }, as: SystemAdmin, captures: { c: "$.data.id" } }
            - { call: "POST /cable-diagnostics/outage-windows", payload: { circuit_id: "${c}", kind: "PLANNED_DIAGNOSTIC", window_start: "2026-08-10T08:00:00Z", window_end: "2026-08-12T12:00:00Z" }, as: NetworkPlanner, captures: { w: "$.data.id" } }
            - { call: "POST /cable-diagnostics/outage-windows/${w}/approve", as: NetworkPlanner }
            - { call: "POST /cable-diagnostics/test-jobs", payload: { circuit_id: "${c}", outage_window_id: "${w}", requested_methods: ["VLF_TAN_DELTA"], approved_budget_cents: 900000 }, as: NetworkPlanner, captures: { j: "$.data.id" } }
            - { call: "POST /cable-diagnostics/test-jobs/${j}/plan", as: NetworkPlanner }
            - { call: "POST /cable-diagnostics/isolation-permits", payload: { test_job_id: "${j}", isolation_points: ["SW-N"], ground_count: 2 }, as: SafetyOfficer, as_user_id: "so-1", captures: { p: "$.data.id" } }
            - { call: "POST /cable-diagnostics/isolation-permits/${p}/issue", as: SafetyOfficer, as_user_id: "so-1" }
            - { call: "POST /cable-diagnostics/isolation-permits/${p}/verify-grounding", as: SafetyOfficer, as_user_id: "so-2" }
            - { call: "POST /cable-diagnostics/mobile-units", payload: { unit_code: "VAN-1", capabilities: ["VLF", "PD", "TDR"], max_test_voltage_kv: 30.0 }, as: SystemAdmin, captures: { u: "$.data.id" } }
            - { call: "POST /cable-diagnostics/equipment-assignments", payload: { mobile_unit_id: "${u}", test_job_id: "${j}", mobilize_at: "2026-08-10T07:00:00Z", demobilize_at: "2026-08-12T12:00:00Z" }, as: DispatchCoordinator, captures: { a: "$.data.id" } }
            - { call: "POST /cable-diagnostics/equipment-assignments/${a}/confirm", as: DispatchCoordinator }
            - { call: "POST /cable-diagnostics/_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T09:00:00Z" }, as: SystemAdmin }
            - { call: "POST /cable-diagnostics/outage-windows/${w}/activate", as: NetworkPlanner }
            - { call: "POST /cable-diagnostics/test-jobs/${j}/start", as: TestSupervisor }
            - { call: "POST /cable-diagnostics/test-series", payload: { test_job_id: "${j}", method: "VLF_TAN_DELTA", test_voltage_kv: 13.05 }, as: TestSupervisor, captures: { s1: "$.data.id" } }
            - { call: "POST /cable-diagnostics/test-series/${s1}/energize", as: TestSupervisor }
          trigger:
            - { call: "POST /cable-diagnostics/test-series/${s1}/readings", payload: { step_index: 0, applied_voltage_kv: 4.35, tan_delta_e3: 79.9, ambient_temp_c: 20.0 }, as: FieldTechnician, as_user_id: "ft-1" }
            - { call: "POST /cable-diagnostics/test-series/${s1}/readings", payload: { step_index: 1, applied_voltage_kv: 8.7, tan_delta_e3: 79.9, ambient_temp_c: 20.0 }, as: FieldTechnician, as_user_id: "ft-1" }
            - { call: "POST /cable-diagnostics/test-series/${s1}/readings", payload: { step_index: 2, applied_voltage_kv: 13.05, tan_delta_e3: 79.95, ambient_temp_c: 20.0 }, as: FieldTechnician, as_user_id: "ft-1" }
            - { call: "POST /cable-diagnostics/test-series/${s1}/evaluate", as: TestSupervisor, captures: { v1: "$.data.verdict", mtd1: "$.data.max_tan_delta_e3" } }
            - { call: "POST /cable-diagnostics/test-series", payload: { test_job_id: "${j}", method: "VLF_TAN_DELTA", test_voltage_kv: 13.05 }, as: TestSupervisor, captures: { s2: "$.data.id" } }
            - { call: "POST /cable-diagnostics/test-series/${s2}/energize", as: TestSupervisor }
            - { call: "POST /cable-diagnostics/test-series/${s2}/readings", payload: { step_index: 0, applied_voltage_kv: 4.35, tan_delta_e3: 79.9, ambient_temp_c: 20.0 }, as: FieldTechnician, as_user_id: "ft-1" }
            - { call: "POST /cable-diagnostics/test-series/${s2}/readings", payload: { step_index: 1, applied_voltage_kv: 8.7, tan_delta_e3: 79.9, ambient_temp_c: 20.0 }, as: FieldTechnician, as_user_id: "ft-1" }
            - { call: "POST /cable-diagnostics/test-series/${s2}/readings", payload: { step_index: 2, applied_voltage_kv: 13.05, tan_delta_e3: 79.94, ambient_temp_c: 20.0 }, as: FieldTechnician, as_user_id: "ft-1" }
            - { call: "POST /cable-diagnostics/test-series/${s2}/evaluate", as: TestSupervisor, captures: { v2: "$.data.verdict", mtd2: "$.data.max_tan_delta_e3" } }
            - { call: "GET /cable-diagnostics/test-series/${s2}/faults", as: TestSupervisor }
            - { call: "GET /cable-diagnostics/circuits/${c}", as: TestSupervisor, captures: { unres: "$.data.unresolved_fault_count" } }
          assert:
            - "TestSeries.${s1}.max_tan_delta_e3 == 80.0 (79.95 rounded half-up) and verdict == FAIL (>= boundary)"
            - "TestSeries.${s2}.max_tan_delta_e3 == 79.9 and verdict == MONITOR"
            - "GET faults for ${s2} returns []; CableCircuit.${c}.unresolved_fault_count == 1 (only S1 raised a fault)"

      - name: equipment_buffer_exact_four_hour_gap_allowed
        grounds:
          - validations[priority=17]
          - calculations.unit_committed_hours
        distinguishing_aspect: |
          Metric: inter-assignment gap minutes on POST equipment-assignments (resource
          MobileUnit). A new assignment starting exactly 4h00m after the previous
          demobilization is allowed (gap >= 4h); 3h59m is rejected — while back-to-back
          adjacency (gap 0) is also rejected, unlike outage-window half-open adjacency.
        test_recipe:
          setup:
            - "Circuit, APPROVED window, PLANNED job; unit VAN-1 with assignment A1 [2026-08-10T07:00Z, 2026-08-10T11:00Z] RESERVED (committed_hours 4.0)."
          setup_api_calls:
            - { call: "POST /cable-diagnostics/circuits", payload: { circuit_ref: "CKT-BP2", voltage_class: "KV_15", length_m: 1000, installation_year: 2015 }, as: SystemAdmin, captures: { c: "$.data.id" } }
            - { call: "POST /cable-diagnostics/outage-windows", payload: { circuit_id: "${c}", kind: "PLANNED_DIAGNOSTIC", window_start: "2026-08-10T08:00:00Z", window_end: "2026-08-12T12:00:00Z" }, as: NetworkPlanner, captures: { w: "$.data.id" } }
            - { call: "POST /cable-diagnostics/outage-windows/${w}/approve", as: NetworkPlanner }
            - { call: "POST /cable-diagnostics/test-jobs", payload: { circuit_id: "${c}", outage_window_id: "${w}", requested_methods: ["VLF_TAN_DELTA"], approved_budget_cents: 800000 }, as: NetworkPlanner, captures: { j: "$.data.id" } }
            - { call: "POST /cable-diagnostics/test-jobs/${j}/plan", as: NetworkPlanner }
            - { call: "POST /cable-diagnostics/mobile-units", payload: { unit_code: "VAN-1", capabilities: ["VLF", "PD", "TDR"], max_test_voltage_kv: 30.0 }, as: SystemAdmin, captures: { u: "$.data.id" } }
            - { call: "POST /cable-diagnostics/equipment-assignments", payload: { mobile_unit_id: "${u}", test_job_id: "${j}", mobilize_at: "2026-08-10T07:00:00Z", demobilize_at: "2026-08-10T11:00:00Z" }, as: DispatchCoordinator, captures: { a1: "$.data.id" } }
          trigger:
            - { call: "POST /cable-diagnostics/equipment-assignments", payload: { mobile_unit_id: "${u}", test_job_id: "${j}", mobilize_at: "2026-08-10T15:00:00Z", demobilize_at: "2026-08-10T19:00:00Z" }, as: DispatchCoordinator, captures: { a2: "$.data.id" } }
            - { call: "POST /cable-diagnostics/equipment-assignments", payload: { mobile_unit_id: "${u}", test_job_id: "${j}", mobilize_at: "2026-08-10T14:59:00Z", demobilize_at: "2026-08-10T18:59:00Z" }, as: DispatchCoordinator, captures: { err: "$.data.error_id" } }
            - { call: "GET /cable-diagnostics/mobile-units/${u}", as: DispatchCoordinator, captures: { uch: "$.data.committed_hours" } }
          assert:
            - "A2 (gap exactly 4h00m) created with 201, status RESERVED"
            - "A3 (gap 3h59m) rejected: error_id == ERR_UNIT_OVERLAP_BUFFER, http 409"
            - "MobileUnit.${u}.committed_hours == 8.0 (4.0 + 4.0; rejected A3 adds nothing)"

      - name: overrun_grace_exactly_fifteen_minutes_free
        grounds:
          - calculations.outage_overrun_charge
          - entities.OutageWindow.fields.overrun_charge_cents
        distinguishing_aspect: |
          Metric: overrun minutes on POST outage-windows/{id}/close. overrun == 15 is NOT
          > GRACE_MIN 15, so chargeable == 0 and charge == 0; overrun == 16 yields
          chargeable 1 minute at tier-1 400 cents == 400. Different metric (minutes) and
          different endpoint from the tan-delta and buffer boundaries.
        test_recipe:
          setup:
            - "Circuit C; window A [2026-08-10T08:00Z, 10:00Z] and window B [13:00Z, 15:00Z] both APPROVED (half-open, non-overlapping)."
          setup_api_calls:
            - { call: "POST /cable-diagnostics/circuits", payload: { circuit_ref: "CKT-BP3", voltage_class: "KV_15", length_m: 1000, installation_year: 2015 }, as: SystemAdmin, captures: { c: "$.data.id" } }
            - { call: "POST /cable-diagnostics/outage-windows", payload: { circuit_id: "${c}", kind: "PLANNED_DIAGNOSTIC", window_start: "2026-08-10T08:00:00Z", window_end: "2026-08-10T10:00:00Z" }, as: NetworkPlanner, captures: { wa: "$.data.id" } }
            - { call: "POST /cable-diagnostics/outage-windows", payload: { circuit_id: "${c}", kind: "PLANNED_DIAGNOSTIC", window_start: "2026-08-10T13:00:00Z", window_end: "2026-08-10T15:00:00Z" }, as: NetworkPlanner, captures: { wb: "$.data.id" } }
            - { call: "POST /cable-diagnostics/outage-windows/${wa}/approve", as: NetworkPlanner }
            - { call: "POST /cable-diagnostics/outage-windows/${wb}/approve", as: NetworkPlanner }
            - { call: "POST /cable-diagnostics/_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T09:00:00Z" }, as: SystemAdmin }
            - { call: "POST /cable-diagnostics/outage-windows/${wa}/activate", as: NetworkPlanner }
            - { call: "POST /cable-diagnostics/outage-windows/${wa}/close", payload: { restored_at: "2026-08-10T10:15:00Z" }, as: NetworkPlanner, captures: { oa: "$.data.overrun_minutes", ca: "$.data.overrun_charge_cents" } }
            - { call: "POST /cable-diagnostics/_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T14:00:00Z" }, as: SystemAdmin }
            - { call: "POST /cable-diagnostics/outage-windows/${wb}/activate", as: NetworkPlanner }
          trigger:
            - { call: "POST /cable-diagnostics/outage-windows/${wb}/close", payload: { restored_at: "2026-08-10T15:16:00Z" }, as: NetworkPlanner, captures: { ob: "$.data.overrun_minutes", cb: "$.data.overrun_charge_cents" } }
          assert:
            - "OutageWindow.${wa}: overrun_minutes == 15 and overrun_charge_cents == 0 (grace boundary, > semantics)"
            - "OutageWindow.${wb}: overrun_minutes == 16 and overrun_charge_cents == 400 (1 chargeable minute x 400)"

      - name: health_score_exactly_forty_is_poor
        grounds:
          - calculations.health_index_score
          - entities.CableCircuit.fields.replacement_recommended
        distinguishing_aspect: |
          Metric: health-index score on POST health-assessments. Penalty sums to exactly
          60.0 -> score exactly 40.0, which satisfies >= 40 and is therefore POOR (NOT
          CRITICAL); adoption then sets replacement_recommended == true because POOR with
          unresolved_fault_count == 2 meets the >= 2 rule.
        test_recipe:
          setup:
            - "Circuit C (KV_15, length 2000, installed 1991 -> age 35y -> age_pen 50); job IN_PROGRESS (methods [VLF_WITH_PD]); two series EVALUATED with tan-delta 90.0 (td_pen 100) and pd 250 (pd_pen 25), both FAIL -> two auto-faults (fault_pen 50)."
          setup_api_calls:
            - { call: "POST /cable-diagnostics/circuits", payload: { circuit_ref: "CKT-BP4", voltage_class: "KV_15", length_m: 2000, installation_year: 1991 }, as: SystemAdmin, captures: { c: "$.data.id" } }
            - { call: "POST /cable-diagnostics/outage-windows", payload: { circuit_id: "${c}", kind: "PLANNED_DIAGNOSTIC", window_start: "2026-08-10T08:00:00Z", window_end: "2026-08-12T12:00:00Z" }, as: NetworkPlanner, captures: { w: "$.data.id" } }
            - { call: "POST /cable-diagnostics/outage-windows/${w}/approve", as: NetworkPlanner }
            - { call: "POST /cable-diagnostics/test-jobs", payload: { circuit_id: "${c}", outage_window_id: "${w}", requested_methods: ["VLF_WITH_PD"], approved_budget_cents: 900000 }, as: NetworkPlanner, captures: { j: "$.data.id" } }
            - { call: "POST /cable-diagnostics/test-jobs/${j}/plan", as: NetworkPlanner }
            - { call: "POST /cable-diagnostics/isolation-permits", payload: { test_job_id: "${j}", isolation_points: ["SW-N"], ground_count: 2 }, as: SafetyOfficer, as_user_id: "so-1", captures: { p: "$.data.id" } }
            - { call: "POST /cable-diagnostics/isolation-permits/${p}/issue", as: SafetyOfficer, as_user_id: "so-1" }
            - { call: "POST /cable-diagnostics/isolation-permits/${p}/verify-grounding", as: SafetyOfficer, as_user_id: "so-2" }
            - { call: "POST /cable-diagnostics/mobile-units", payload: { unit_code: "VAN-1", capabilities: ["VLF", "PD", "TDR"], max_test_voltage_kv: 30.0 }, as: SystemAdmin, captures: { u: "$.data.id" } }
            - { call: "POST /cable-diagnostics/equipment-assignments", payload: { mobile_unit_id: "${u}", test_job_id: "${j}", mobilize_at: "2026-08-10T07:00:00Z", demobilize_at: "2026-08-12T12:00:00Z" }, as: DispatchCoordinator, captures: { a: "$.data.id" } }
            - { call: "POST /cable-diagnostics/equipment-assignments/${a}/confirm", as: DispatchCoordinator }
            - { call: "POST /cable-diagnostics/_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T09:00:00Z" }, as: SystemAdmin }
            - { call: "POST /cable-diagnostics/outage-windows/${w}/activate", as: NetworkPlanner }
            - { call: "POST /cable-diagnostics/test-jobs/${j}/start", as: TestSupervisor }
            - { call: "POST /cable-diagnostics/test-series", payload: { test_job_id: "${j}", method: "VLF_WITH_PD", test_voltage_kv: 13.05 }, as: TestSupervisor, captures: { s1: "$.data.id" } }
            - { call: "POST /cable-diagnostics/test-series/${s1}/energize", as: TestSupervisor }
            - { call: "POST /cable-diagnostics/test-series/${s1}/readings", payload: { step_index: 0, applied_voltage_kv: 4.35, tan_delta_e3: 90.0, pd_level_pc: 250, ambient_temp_c: 20.0 }, as: FieldTechnician, as_user_id: "ft-1" }
            - { call: "POST /cable-diagnostics/test-series/${s1}/readings", payload: { step_index: 1, applied_voltage_kv: 8.7, tan_delta_e3: 90.0, pd_level_pc: 250, ambient_temp_c: 20.0 }, as: FieldTechnician, as_user_id: "ft-1" }
            - { call: "POST /cable-diagnostics/test-series/${s1}/readings", payload: { step_index: 2, applied_voltage_kv: 13.05, tan_delta_e3: 90.0, pd_level_pc: 250, ambient_temp_c: 20.0 }, as: FieldTechnician, as_user_id: "ft-1" }
            - { call: "POST /cable-diagnostics/test-series/${s1}/evaluate", as: TestSupervisor }
            - { call: "POST /cable-diagnostics/test-series", payload: { test_job_id: "${j}", method: "VLF_WITH_PD", test_voltage_kv: 13.05 }, as: TestSupervisor, captures: { s2: "$.data.id" } }
            - { call: "POST /cable-diagnostics/test-series/${s2}/energize", as: TestSupervisor }
            - { call: "POST /cable-diagnostics/test-series/${s2}/readings", payload: { step_index: 0, applied_voltage_kv: 4.35, tan_delta_e3: 90.0, pd_level_pc: 250, ambient_temp_c: 20.0 }, as: FieldTechnician, as_user_id: "ft-1" }
            - { call: "POST /cable-diagnostics/test-series/${s2}/readings", payload: { step_index: 1, applied_voltage_kv: 8.7, tan_delta_e3: 90.0, pd_level_pc: 250, ambient_temp_c: 20.0 }, as: FieldTechnician, as_user_id: "ft-1" }
            - { call: "POST /cable-diagnostics/test-series/${s2}/readings", payload: { step_index: 2, applied_voltage_kv: 13.05, tan_delta_e3: 90.0, pd_level_pc: 250, ambient_temp_c: 20.0 }, as: FieldTechnician, as_user_id: "ft-1" }
            - { call: "POST /cable-diagnostics/test-series/${s2}/evaluate", as: TestSupervisor }
            - { call: "GET /cable-diagnostics/circuits/${c}", as: AssetEngineer, captures: { cv: "$.data.version", unres: "$.data.unresolved_fault_count" } }
          trigger:
            - { call: "POST /cable-diagnostics/health-assessments", payload: { circuit_id: "${c}", basis: "PROVISIONAL", expected_circuit_version: "${cv}" }, as: AssetEngineer, captures: { ha: "$.data.id", score: "$.data.health_index_score" } }
            - { call: "POST /cable-diagnostics/health-assessments/${ha}/review", as: AssetEngineer }
            - { call: "POST /cable-diagnostics/health-assessments/${ha}/adopt", as: NetworkPlanner }
            - { call: "GET /cable-diagnostics/circuits/${c}", as: NetworkPlanner, captures: { chi: "$.data.current_health_index", cband: "$.data.current_health_band", repl: "$.data.replacement_recommended" } }
          assert:
            - "setup gives unresolved_fault_count == 2 (two FAIL auto-faults)"
            - "HealthAssessment.${ha}.health_index_score == 40.0 (35 + 7.5 + 10 + 7.5 = 60.0 penalty) and band == POOR (>= 40, NOT CRITICAL)"
            - "recommended_action == PLAN_REPLACEMENT"
            - "after adopt: CableCircuit.${c}.current_health_index == 40.0, current_health_band == POOR, replacement_recommended == true (POOR and unresolved >= 2)"

  # ------------------------------------------------------------------ Rule 7
  - rule_id: cross_entity_state_dependency
    instances:
      - name: energize_blocked_until_grounding_verified
        grounds:
          - state_machines.TestSeries.SETUP_to_ENERGIZING
          - state_machines.IsolationPermit.ISSUED_to_GROUNDING_VERIFIED
          - validations[priority=8]
        distinguishing_aspect: |
          Entity pair TestSeries x IsolationPermit: energize is rejected with
          ERR_GROUNDING_NOT_VERIFIED while the job's permit is ISSUED; after an
          independent officer verifies grounding, the same call succeeds and also drives
          circuit GROUNDED -> UNDER_TEST.
        test_recipe:
          setup:
            - "Full prefix: job IN_PROGRESS; permit ISSUED (issuer so-1, not yet verified); assignment confirmed; series S SETUP; clock inside window."
          setup_api_calls:
            - { call: "POST /cable-diagnostics/circuits", payload: { circuit_ref: "CKT-CE1", voltage_class: "KV_15", length_m: 1000, installation_year: 2015 }, as: SystemAdmin, captures: { c: "$.data.id" } }
            - { call: "POST /cable-diagnostics/outage-windows", payload: { circuit_id: "${c}", kind: "PLANNED_DIAGNOSTIC", window_start: "2026-08-10T08:00:00Z", window_end: "2026-08-12T12:00:00Z" }, as: NetworkPlanner, captures: { w: "$.data.id" } }
            - { call: "POST /cable-diagnostics/outage-windows/${w}/approve", as: NetworkPlanner }
            - { call: "POST /cable-diagnostics/test-jobs", payload: { circuit_id: "${c}", outage_window_id: "${w}", requested_methods: ["VLF_TAN_DELTA"], approved_budget_cents: 800000 }, as: NetworkPlanner, captures: { j: "$.data.id" } }
            - { call: "POST /cable-diagnostics/test-jobs/${j}/plan", as: NetworkPlanner }
            - { call: "POST /cable-diagnostics/isolation-permits", payload: { test_job_id: "${j}", isolation_points: ["SW-N"], ground_count: 2 }, as: SafetyOfficer, as_user_id: "so-1", captures: { p: "$.data.id" } }
            - { call: "POST /cable-diagnostics/isolation-permits/${p}/issue", as: SafetyOfficer, as_user_id: "so-1" }
            - { call: "POST /cable-diagnostics/mobile-units", payload: { unit_code: "VAN-1", capabilities: ["VLF", "PD", "TDR"], max_test_voltage_kv: 30.0 }, as: SystemAdmin, captures: { u: "$.data.id" } }
            - { call: "POST /cable-diagnostics/equipment-assignments", payload: { mobile_unit_id: "${u}", test_job_id: "${j}", mobilize_at: "2026-08-10T07:00:00Z", demobilize_at: "2026-08-12T12:00:00Z" }, as: DispatchCoordinator, captures: { a: "$.data.id" } }
            - { call: "POST /cable-diagnostics/equipment-assignments/${a}/confirm", as: DispatchCoordinator }
