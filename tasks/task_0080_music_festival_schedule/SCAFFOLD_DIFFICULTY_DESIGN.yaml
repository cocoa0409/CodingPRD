            - "Sub-case II — second slot one second past the warmup-edge (the accepted side of the boundary).  PATCH S_b with scheduled_window_start = T_base + 3601 (one second past the boundary), scheduled_window_end = T_base + 3601 + 600 = T_base + 4201 (ten-minute slot duration).  The closed-closed-with-pad predicate at this position: the gap from S_a's right-padded edge (T_base + 3600, the inclusive right end of the warmup-padded interval) to the candidate's left-padded edge (T_base + 3601 − 600 = T_base + 3001, the left edge of the candidate's symmetric-padded interval if we also pad the candidate, BUT the §1.3 formula only pads the EXISTING intervals — the candidate stays closed-closed-without-pad).  Re-reading the §1.3 wording carefully: `s_padded = [s.scheduled_window_start - warmup_seconds, s.scheduled_window_end + warmup_seconds]` is the existing's symmetric pad, and the candidate is `candidate_closed = [start, end]` without pad.  The conflict predicate is the standard closed-closed intersection of the padded existing and the unpadded candidate: `candidate.start <= s_padded.end and s_padded.start <= candidate.end`, which at the boundary case (sub-case I) was `T_base+3600 ≤ T_base+3600 AND T_base+1800 ≤ T_base+4200` (using S_a.start = T_base+2400 and warmup of 600, so s_padded = [T_base+1800, T_base+3600]; and the candidate at boundary was [T_base+3600, T_base+4200]), where both conjuncts are true at the boundary and the predicate fires.  At the just-past-the-boundary the candidate's start moves to T_base+3601, and the first conjunct becomes `T_base+3601 ≤ T_base+3600`, which is FALSE.  No conflict at the just-past-the-boundary.  Expected response: PATCH S_b succeeds, S_b transitions REQUESTED → SCHEDULED, and a state-transition audit chain is appended.  But the team is currently BUSY-with-S_a, so the §1.2 SoundCheckSlot's REQUESTED→SCHEDULED precondition 'referenced SoundEngineerTeam.status == AVAILABLE' fails first at priority-6-or-the-cross-entity-state-gate-of-the-team-availability — wait, that's the rule-7 instance B's team-availability gate that fires when the team is BUSY.  The team gate at priority 6 is checked before the priority-8 team-temporal-overlap gate, so a busy team's status alone rejects the second slot with ERR_TEAM_NOT_AVAILABLE before the temporal-overlap arithmetic is even considered.  To isolate the priority-8 overlap rule's geometry the test needs the team to be in AVAILABLE status at the time of the second PATCH.  The way to do that is to complete S_a first — POST /sound-checks/{S_a.id}/complete after the clock has crossed S_a's scheduled_window_end — which flips the team back to AVAILABLE.  Then the team-availability gate at priority 6 passes (AVAILABLE), and the next-slot's PATCH-to-SCHEDULED runs the priority-8 temporal-overlap arithmetic against the COMPLETED (formerly-SCHEDULED) S_a row, which is still in the team's existing-slot history per the §1.3 formula's wording 'each existing s in the team's slots in {SCHEDULED, COMPLETED}'.  The COMPLETED status keeps the historical slot in the overlap-check's existing set, which is the standard semantics (you can't double-book the team during a window where it was on a sound-check, regardless of whether that sound-check is still in progress or has been completed since)."
            - "So the setup for sub-cases I and II of the team-overlap rule requires completing S_a first to free the team's availability gate before the second slot's temporal-overlap rule is reached.  POST /_clock/advance with body {festival_id, to_unix_seconds: S_a.scheduled_window_end + 1} to push the clock past S_a's window-end so the complete call's clock-≥-end precondition is satisfied.  Then POST /sound-checks/{S_a.id}/complete — S_a status SCHEDULED → COMPLETED, EngA.status BUSY → AVAILABLE, EngA.current_booking_id ← null, P_morning.sound_check_status SCHEDULED → COMPLETED.  Now the team is AVAILABLE and S_a is in the historical COMPLETED set that the §1.3 formula's existing-slot-set lists.  The next PATCH (sub-case I or II) targets S_b with various window values to probe the boundary.  EngA's available-status passes the priority-6 cross-entity gate (the rule-7 instance B's team-availability), and the priority-8 temporal-overlap rule against the COMPLETED S_a's window is the next check in order."
