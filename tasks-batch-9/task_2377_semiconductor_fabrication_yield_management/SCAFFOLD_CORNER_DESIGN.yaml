      - name: implementing_the_second_ecn_after_the_first_returns_pinned_revision_stale
        claim_type: violation_to_error
        grounds:
          - validations[priority=26]
          - errors[ERR_PINNED_REVISION_STALE]
          - state_machines.RecipeChangeRequest.APPROVED_to_IMPLEMENTED
        distinguishing_aspect: "Two change notices may sit APPROVED against one recipe, each pinning revision 1; implementing the first advances the recipe to revision 2, which invalidates the second one's pin, so its implement returns ERR_PINNED_REVISION_STALE 409 and the recipe keeps the FIRST notice's target_value 100.50 rather than the second one's 101.00."
        test_recipe:
          setup:
            - "Recipe LITHO-100 (target_value 100.00, revision 1) authored by u_pe_1."
            - "Two MINOR change requests on it: CR1 proposing 100.50 (risk_score 11.25) and CR2 proposing 101.00 (risk_score 12.50), both SUBMITTED with impact_lot_count 0."
            - "Both are approved by u_qm_1: CR1 at the recipe's creation version, then CR2 at the version the first approval left behind. Both pin revision 1; the recipe is RESTRICTED."
            - "CR1 is then implemented, driving the recipe to revision 2, target_value 100.50 and status QUALIFIED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProcessEngineer
              as_user_id: "u_pe_1"
            - call: "POST /fab/recipes"
              payload: { recipe_code: "LITHO-100", tool_type: "LITHO", target_value: 100.00, qual_expiry_days: 100 }
              as: ProcessEngineer
              as_user_id: "u_pe_1"
              captures: { r1: $.data.id, rev1: $.data.revision, rver1: $.data.version }
            - call: "POST /fab/recipes/${r1}/change-requests"
              payload: { change_class: "MINOR", proposed_target: 100.50, justification: "CD trim tweak" }
              as: ProcessEngineer
              as_user_id: "u_pe_1"
              captures: { cr1: $.data.id, risk1: $.data.risk_score, ilc1: $.data.impact_lot_count }
            - call: "POST /fab/recipes/${r1}/change-requests"
              payload: { change_class: "MINOR", proposed_target: 101.00, justification: "Second CD trim tweak" }
              as: ProcessEngineer
              as_user_id: "u_pe_1"
              captures: { cr2: $.data.id, risk2: $.data.risk_score }
            - call: "POST /fab/change-requests/${cr1}/approve"
              payload: { expected_recipe_version: "${rver1}" }
              as: QualityManager
              as_user_id: "u_qm_1"
              captures: { pin1: $.data.pinned_recipe_revision }
            - call: "GET /fab/recipes/${r1}"
              payload: {}
              as: ProcessEngineer
              as_user_id: "u_pe_1"
              captures: { rver2: $.data.version, rst2: $.data.status }
            - call: "POST /fab/change-requests/${cr2}/approve"
              payload: { expected_recipe_version: "${rver2}" }
              as: QualityManager
              as_user_id: "u_qm_1"
              captures: { pin2: $.data.pinned_recipe_revision, cr2st: $.data.status }
            - call: "POST /fab/change-requests/${cr1}/implement"
              payload: {}
              as: ProcessEngineer
              as_user_id: "u_pe_1"
              captures: { cr1st: $.data.status }
          trigger:
            - call: "POST /fab/change-requests/${cr2}/implement"
              payload: {}
              as: ProcessEngineer
              as_user_id: "u_pe_1"
              captures: { err: $.data.error_id }
          assert:
