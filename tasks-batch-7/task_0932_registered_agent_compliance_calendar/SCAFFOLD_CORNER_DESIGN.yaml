      - name: corner_segregation_of_duties_blocks_the_preparer_from_submitting
        claim_type: Priority Ordering
        grounds:
          - validations[priority=32]
          - validations[priority=37]
          - errors[ERR_SEGREGATION_OF_DUTIES]
          - gate_precedence["POST /filings/{id}/submit"]
        distinguishing_aspect: "An unfunded DRAFT filing submitted by the same X-User-ID that prepared it returns 403 ERR_SEGREGATION_OF_DUTIES, proving rung 32 is evaluated before the funding rung 37."
        test_recipe:
          setup:
