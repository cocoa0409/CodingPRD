  - rule_id: non_linear_state_machine
    instances:
      - name: payroll_submission_parallel_axes_move_independently
        grounds:
          - state_machines.PayrollSubmission.workflow_status
          - state_machines.PayrollSubmission.compliance_status
          - endpoints.POST /payroll-submissions/{id}/accept
          - endpoints.POST /findings/{id}/withdraw
        distinguishing_aspect: |
          Parallel shape on a single row: the workflow axis and the compliance axis are
          two independent state fields on PayrollSubmission. A submission that has
          reached the ACCEPTED workflow state is driven UNVERIFIED -> COMPLIANT ->
          DEFICIENT -> REMEDIED on the compliance axis by finding creation and finding
          withdrawal, while workflow_status never leaves ACCEPTED. Naive designs collapse
          the two axes into one enum and cannot express "accepted but deficient".
        test_recipe:
          setup:
            - "ACTIVE project in CA-ALAMEDA on a determination whose ELEC-INSIDE-JW BASE rate is 5000 base + 2000 fringe; prime tier ACTIVE."
            - "Separate PREPARER and CERTIFIER staff at the prime contractor so the certification step satisfies segregation of duties."
            - "One journeyworker line of 40.00 h paid exactly 5000 base + 2000 cash fringe, so make_whole_underpayment_cents is 0 and the submission is COMPLIANT."
            - "The submission is carried all the way to workflow_status ACCEPTED by the agency compliance officer."
          setup_api_calls:
            - call: "POST /reporting-portals"
              payload: { portal_code: "LCPTRACKER_CA", submission_format: "XML_LCP", cutoff_offset_days: 10, grace_hours: 0, requires_notarized_statement: false }
              as: PortalAdmin
              captures: { portal_id: $.data.id }
