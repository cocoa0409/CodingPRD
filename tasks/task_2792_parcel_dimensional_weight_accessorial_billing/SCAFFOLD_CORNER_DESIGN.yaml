              payload: { shipper_id: "${sh}", service_level_id: "${sl}", tracking_number: "1Z-E-5001", zone: 2, residential_declared: false, declared_length_in: 30, declared_width_in: 12, declared_height_in: 12, declared_weight_lbs: 40.0 }
              as: CarrierOps
              captures: { p: $.data.id, pv1: $.data.version }
          trigger:
            - call: "GET /shipments/${p}/billing-preview"
              payload: {}
              as: BillingOps
              captures: { t1: $.data.line_total_cents, bw1: $.data.billable_weight_lbs, basis1: $.data.billable_weight_basis, rate1: $.data.rate_cents_per_lb }
            - call: "GET /shipments/${p}/billing-preview"
              payload: {}
              as: RevenueAuditor
              as_user_id: "auditor.one"
              captures: { t2: $.data.line_total_cents }
            - call: "GET /shipments/${p}"
              payload: {}
              as: BillingOps
              captures: { pv2: $.data.version }
            - call: "POST /shipments/${p}/scans"
              payload: { scan_source: "AUTOMATED_DWS", scanned_length_in: 30, scanned_width_in: 12, scanned_height_in: 12, scanned_weight_lbs: 40.7, expected_shipment_version: "${pv1}" }
              as: CarrierOps
              captures: { scan: $.data.id, tol: $.data.tolerance_status, wvar: $.data.weight_variance_lbs }
            - call: "GET /shipments/${p}/billing-preview"
              payload: {}
              as: BillingOps
              captures: { t3: $.data.line_total_cents, bw3: $.data.billable_weight_lbs }
            - call: "GET /invoices"
              payload: { shipper_id: "${sh}" }
              as: BillingOps
          assert:
            - "${t1} == 13600 with ${bw1} == 40, ${basis1} == ACTUAL and ${rate1} == 340 — the 21-70 lb zone-2 row, above the 1195 minimum"
            - "${t2} == ${t1} — two consecutive previews agree, and a RevenueAuditor sees the same numbers as BillingOps"
            - "${pv2} == ${pv1} — no preview call incremented Shipment.version"
            - "${wvar} == 0.7 and ${tol} == WITHIN_TOLERANCE, because the allowance is max(0.5, 40.0 * 2% = 0.8) == 0.8 and 0.7 < 0.8"
            - "${t3} == 13940 and ${bw3} == 41 — the preview now reads the FINAL variant (ceil(40.7) == 41 at 340)"
            - "GET /invoices returns total_count == 0 and GET /invoice-lines returns total_count == 0 — no preview ever created billing state"
            - "Shipment.${p}.measurement_status == SCANNED and version == ${pv1} + 1 — the only mutation came from the scan"

      - name: the_include_list_extends_the_sweep_but_never_lifts_the_billed_gate
        claim_type: conditional_action
        grounds:
          - endpoints[POST /invoices]
          - calculations.invoice_sweep_selection
          - validations[priority=45]  # ERR_SHIPMENT_ALREADY_BILLED
          - validations[priority=46]  # ERR_NO_BILLABLE_SHIPMENTS
        distinguishing_aspect: |
          One optional field changes the sweep's whole result set: the same
          2026-08-01..2026-08-01 period bills only parcel A, then bills the out-of-period
          parcel B when B is named in include_shipment_ids — but naming the already-billed
          parcel A is a 409, and an empty period with no include list is a 422.
        test_recipe:
          setup:
            - "SH-2001 is ACTIVE with ACTIVE contract C1 (divisor 139, min charge 1195, zone-2 rows 380/340/305) and ServiceLevel EXPRESS."
            - "At clock 2026-08-01T00:00:00Z parcel A 1Z-E-6001 (12 x 10 x 8 in, 6.0 lb, zone 2) is inducted, so pickup_date 2026-08-01."
            - "The clock moves to 2026-08-05T00:00:00Z and parcel B 1Z-E-6002 (identical dimensions) is inducted, so pickup_date 2026-08-05. Both are delivered."
          setup_api_calls:
            - call: "POST /shipper-accounts"
              payload: { account_number: "SH-2001", name: "Acme Parcel" }
              as: CarrierAdmin
              captures: { sh: $.data.id, sh_v: $.data.version }
            - call: "POST /service-levels"
              payload: { code: "EXPRESS", name: "Express", guarantee_hours: 24, guaranteed: true }
              as: CarrierAdmin
              captures: { sl: $.data.id }
            - call: "POST /rate-contracts"
              payload:
                shipper_id: "${sh}"
                effective_from: "2026-01-01"
                effective_to: "2026-12-31"
                dim_divisor: 139
                min_charge_cents: 1195
                rate_table: [{zone: 2, min_lbs: 1, max_lbs: 20, cents_per_lb: 380}, {zone: 2, min_lbs: 21, max_lbs: 70, cents_per_lb: 340}, {zone: 2, min_lbs: 71, max_lbs: 9999, cents_per_lb: 305}]
                tier_discount_table: [{min_transportation_subtotal_cents: 50000, discount_bps: 550}]
              as: CarrierAdmin
              captures: { c1: $.data.id }
            - call: "POST /rate-contracts/${c1}/activate"
              payload: { expected_shipper_account_version: "${sh_v}" }
              as: CarrierAdmin
            - call: "POST /shipments"
              payload: { shipper_id: "${sh}", service_level_id: "${sl}", tracking_number: "1Z-E-6001", zone: 2, residential_declared: false, declared_length_in: 12, declared_width_in: 10, declared_height_in: 8, declared_weight_lbs: 6.0 }
              as: CarrierOps
              captures: { pa: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { now_utc: "2026-08-05T00:00:00Z" }
              as: CarrierAdmin
            - call: "POST /shipments"
              payload: { shipper_id: "${sh}", service_level_id: "${sl}", tracking_number: "1Z-E-6002", zone: 2, residential_declared: false, declared_length_in: 12, declared_width_in: 10, declared_height_in: 8, declared_weight_lbs: 6.0 }
              as: CarrierOps
              captures: { pb: $.data.id }
            - call: "POST /shipments/${pa}/deliver"
              payload: {}
              as: CarrierOps
            - call: "POST /shipments/${pb}/deliver"
              payload: {}
              as: CarrierOps
          trigger:
            - call: "POST /invoices"
              payload: { shipper_id: "${sh}", period_start: "2026-08-01", period_end: "2026-08-01" }
              as: BillingOps
              captures: { inv1: $.data.id, lc1: $.data.line_count, net1: $.data.net_amount_cents }
            - call: "POST /invoices"
              payload: { shipper_id: "${sh}", period_start: "2026-08-01", period_end: "2026-08-01", include_shipment_ids: ["${pb}"] }
              as: BillingOps
              captures: { inv2: $.data.id, lc2: $.data.line_count, net2: $.data.net_amount_cents }
            - call: "GET /invoice-lines"
              payload: { invoice_id: "${inv2}" }
              as: BillingOps
              captures: { l2_shipment: "$.data[0].shipment_id" }
            - call: "POST /invoices"
              payload: { shipper_id: "${sh}", period_start: "2026-08-09", period_end: "2026-08-09", include_shipment_ids: ["${pa}"] }
              as: BillingOps
              captures: { err_billed: $.data.error_id }
            - call: "POST /invoices"
              payload: { shipper_id: "${sh}", period_start: "2026-08-09", period_end: "2026-08-09" }
              as: BillingOps
              captures: { err_empty: $.data.error_id }
          assert:
            - "${lc1} == 1 and ${net1} == 2660 — without the include list only parcel A's pickup_date falls in the inclusive period"
            - "${lc2} == 1 and ${net2} == 2660 with ${l2_shipment} == ${pb} — the include list force-added the out-of-period parcel B, and parcel A was skipped this time because it is already BILLED"
            - "The include list naming the already-billed parcel A returns HTTP 409 with ${err_billed} == ERR_SHIPMENT_ALREADY_BILLED — force-adding never lifts that gate"
            - "The same empty period without an include list returns HTTP 422 with ${err_empty} == ERR_NO_BILLABLE_SHIPMENTS — a different error for a different cause"
            - "GET /invoices returns total_count == 2 (${inv1} and ${inv2}), both OPEN, and ShipperAccount.${sh} shows billed_shipment_count == 2 and unbilled_shipment_count == 0"

  # =====================================================================
  # SECTION 6 — ERRORS (§1.6)
  # =====================================================================
  - section: errors
    instances:
      - name: every_error_body_uses_the_declared_error_envelope
        claim_type: violation_to_error
        grounds:
          - errors[ERR_SHIPMENT_NOT_FOUND]
          - errors[ERR_INVALID_PAGINATION]
        distinguishing_aspect: |
          Failures and successes share the same outer envelope: an error carries
          response_type "error" with data.error_id and data.message and no entity fields,
          while the neighbouring success carries response_type "object" or "array" and no
          error_id — so a test can never confuse a 404 body for a thin entity.
        test_recipe:
          setup:
            - "SH-2001 is ACTIVE with ACTIVE contract C1 (divisor 139, min charge 1195, zone-2 rows 380/340/305) and ServiceLevel EXPRESS."
            - "One parcel 1Z-V-1001 (12 x 10 x 8 in, 6.0 lb, zone 2) exists."
          setup_api_calls:
            - call: "POST /shipper-accounts"
              payload: { account_number: "SH-2001", name: "Acme Parcel" }
              as: CarrierAdmin
              captures: { sh: $.data.id, sh_v: $.data.version }
            - call: "POST /service-levels"
              payload: { code: "EXPRESS", name: "Express", guarantee_hours: 24, guaranteed: true }
              as: CarrierAdmin
              captures: { sl: $.data.id }
            - call: "POST /rate-contracts"
              payload:
                shipper_id: "${sh}"
                effective_from: "2026-01-01"
                effective_to: "2026-12-31"
                dim_divisor: 139
                min_charge_cents: 1195
                rate_table: [{zone: 2, min_lbs: 1, max_lbs: 20, cents_per_lb: 380}, {zone: 2, min_lbs: 21, max_lbs: 70, cents_per_lb: 340}, {zone: 2, min_lbs: 71, max_lbs: 9999, cents_per_lb: 305}]
                tier_discount_table: [{min_transportation_subtotal_cents: 50000, discount_bps: 550}]
              as: CarrierAdmin
              captures: { c1: $.data.id }
            - call: "POST /rate-contracts/${c1}/activate"
              payload: { expected_shipper_account_version: "${sh_v}" }
              as: CarrierAdmin
            - call: "POST /shipments"
              payload: { shipper_id: "${sh}", service_level_id: "${sl}", tracking_number: "1Z-V-1001", zone: 2, residential_declared: false, declared_length_in: 12, declared_width_in: 10, declared_height_in: 8, declared_weight_lbs: 6.0 }
              as: CarrierOps
              captures: { p: $.data.id }
          trigger:
            - call: "GET /shipments/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: BillingOps
              captures: { err: $.data.error_id, msg: $.data.message }
            - call: "GET /shipments/${p}"
              payload: {}
              as: BillingOps
              captures: { ok_id: $.data.id }
            - call: "GET /shipments"
              payload: { shipper_id: "${sh}", limit: 101 }
              as: BillingOps
              captures: { err_page: $.data.error_id }
            - call: "GET /shipments"
              payload: { shipper_id: "${sh}" }
              as: BillingOps
              captures: { first: "$.data[0].id" }
          assert:
            - "The 404 body is { meta, response_type: 'error', data: { error_id, message } }: ${err} == ERR_SHIPMENT_NOT_FOUND and ${msg} is a non-empty human-readable string"
            - "The 404 body carries no tracking_number, no version and no created_at — data holds only error_id and message"
            - "The success body has response_type 'object', a meta.api_request_id and a meta.api_request_timestamp, ${ok_id} == ${p}, and no error_id key at all"
            - "The limit 101 call returns HTTP 400 with ${err_page} == ERR_INVALID_PAGINATION because max is 100"
            - "The valid list has response_type 'array' with limit 10, offset 0, total_count 1, has_more false and ${first} == ${p}"

      - name: duplicate_natural_keys_raise_the_same_conflict_on_four_entities
        claim_type: violation_to_error
        grounds:
          - errors[ERR_DUPLICATE_KEY]
          - validations[priority=18]  # ERR_DUPLICATE_KEY
        distinguishing_aspect: |
          Four different uniqueness constraints — account_number, ServiceLevel.code,
          SurchargeWindow.code and tracking_number — all surface as one 409
          ERR_DUPLICATE_KEY, and the window case proves the key check outranks the interval
          overlap check even though the second window's dates do not overlap at all.
        test_recipe:
          setup:
            - "SH-2001 is ACTIVE with ACTIVE contract C1 (divisor 139, min charge 1195, zone-2 rows 380/340/305), ServiceLevel EXPRESS, SurchargeWindow DEMAND-A (kind DEMAND, 2026-08-01 to 2026-08-10, 500 per package) and parcel 1Z-V-2001 (12 x 10 x 8 in, 6.0 lb, zone 2)."
          setup_api_calls:
            - call: "POST /shipper-accounts"
              payload: { account_number: "SH-2001", name: "Acme Parcel" }
              as: CarrierAdmin
              captures: { sh: $.data.id, sh_v: $.data.version }
            - call: "POST /service-levels"
              payload: { code: "EXPRESS", name: "Express", guarantee_hours: 24, guaranteed: true }
              as: CarrierAdmin
              captures: { sl: $.data.id }
            - call: "POST /rate-contracts"
              payload:
                shipper_id: "${sh}"
                effective_from: "2026-01-01"
                effective_to: "2026-12-31"
                dim_divisor: 139
                min_charge_cents: 1195
                rate_table: [{zone: 2, min_lbs: 1, max_lbs: 20, cents_per_lb: 380}, {zone: 2, min_lbs: 21, max_lbs: 70, cents_per_lb: 340}, {zone: 2, min_lbs: 71, max_lbs: 9999, cents_per_lb: 305}]
                tier_discount_table: [{min_transportation_subtotal_cents: 50000, discount_bps: 550}]
              as: CarrierAdmin
              captures: { c1: $.data.id }
            - call: "POST /rate-contracts/${c1}/activate"
              payload: { expected_shipper_account_version: "${sh_v}" }
              as: CarrierAdmin
            - call: "POST /surcharge-windows"
              payload: { code: "DEMAND-A", kind: "DEMAND", start_date: "2026-08-01", end_date: "2026-08-10", per_package_cents: 500 }
              as: CarrierAdmin
              captures: { w1: $.data.id }
            - call: "POST /shipments"
              payload: { shipper_id: "${sh}", service_level_id: "${sl}", tracking_number: "1Z-V-2001", zone: 2, residential_declared: false, declared_length_in: 12, declared_width_in: 10, declared_height_in: 8, declared_weight_lbs: 6.0 }
              as: CarrierOps
              captures: { p: $.data.id }
          trigger:
            - call: "POST /shipper-accounts"
              payload: { account_number: "SH-2001", name: "Impostor Parcel Co" }
              as: CarrierAdmin
              captures: { err_acct: $.data.error_id }
            - call: "POST /service-levels"
              payload: { code: "EXPRESS", name: "Express Two Day", guarantee_hours: 48, guaranteed: true }
              as: CarrierAdmin
              captures: { err_sl: $.data.error_id }
            - call: "POST /surcharge-windows"
              payload: { code: "DEMAND-A", kind: "DEMAND", start_date: "2026-11-01", end_date: "2026-11-10", per_package_cents: 700 }
              as: CarrierAdmin
              captures: { err_win: $.data.error_id }
            - call: "POST /shipments"
              payload: { shipper_id: "${sh}", service_level_id: "${sl}", tracking_number: "1Z-V-2001", zone: 2, residential_declared: false, declared_length_in: 20, declared_width_in: 20, declared_height_in: 20, declared_weight_lbs: 40.0 }
              as: CarrierOps
              captures: { err_ship: $.data.error_id }
          assert:
            - "All four calls return HTTP 409 and ${err_acct} == ${err_sl} == ${err_win} == ${err_ship} == ERR_DUPLICATE_KEY"
            - "The second window's 2026-11-01..2026-11-10 range does not overlap DEMAND-A's August range, so the 409 comes from the code, not from ERR_SURCHARGE_WINDOW_OVERLAP — priority 18 runs before priority 36"
            - "GET /shipper-accounts/${sh} still shows name 'Acme Parcel' and total_shipment_count == 1 — no partial write happened"
            - "GET /surcharge-windows returns total_count == 1 and GET /shipments returns total_count == 1"

      - name: every_unresolvable_reference_has_its_own_not_found_error
        claim_type: violation_to_error
        grounds:
          - errors[ERR_CONTRACT_NOT_FOUND]
          - errors[ERR_SURCHARGE_WINDOW_NOT_FOUND]
          - errors[ERR_ACCESSORIAL_NOT_FOUND]
          - errors[ERR_ADJUSTMENT_NOT_FOUND]
          - errors[ERR_CLAIM_NOT_FOUND]
        distinguishing_aspect: |
          Eight endpoints, eight different 404 identifiers against a completely empty
          database: the error names the entity that failed to resolve rather than collapsing
          into one generic ERR_NOT_FOUND, which is what lets a caller tell a bad contract id
          from a bad window id.
        test_recipe:
          setup:
            - "Empty database. No entity of any kind exists, so every id below is unresolvable."
          setup_api_calls: []
          trigger:
            - call: "GET /rate-contracts/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: CarrierAdmin
              captures: { e_contract: $.data.error_id }
            - call: "GET /service-levels/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: CarrierAdmin
              captures: { e_sl: $.data.error_id }
            - call: "GET /surcharge-windows/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: CarrierAdmin
              captures: { e_win: $.data.error_id }
            - call: "GET /shipper-accounts/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: CarrierAdmin
              captures: { e_shipper: $.data.error_id }
            - call: "POST /accessorial-charges/00000000-0000-0000-0000-000000000000/waive"
              payload: {}
              as: BillingOps
              captures: { e_acc: $.data.error_id }
            - call: "GET /invoice-lines/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: BillingOps
              captures: { e_line: $.data.error_id }
            - call: "GET /billing-adjustments/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: BillingOps
              captures: { e_adj: $.data.error_id }
            - call: "GET /disputes/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: BillingOps
              captures: { e_dsp: $.data.error_id }
            - call: "GET /guarantee-claims/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: BillingOps
              captures: { e_claim: $.data.error_id }
          assert:
            - "Every call returns HTTP 404"
            - "${e_contract} == ERR_CONTRACT_NOT_FOUND, ${e_sl} == ERR_SERVICE_LEVEL_NOT_FOUND, ${e_win} == ERR_SURCHARGE_WINDOW_NOT_FOUND, ${e_shipper} == ERR_SHIPPER_NOT_FOUND"
            - "${e_acc} == ERR_ACCESSORIAL_NOT_FOUND, ${e_line} == ERR_INVOICE_LINE_NOT_FOUND, ${e_adj} == ERR_ADJUSTMENT_NOT_FOUND, ${e_dsp} == ERR_DISPUTE_NOT_FOUND, ${e_claim} == ERR_CLAIM_NOT_FOUND"
            - "All nine identifiers are pairwise distinct"
            - "The waive attempt returns 404 rather than 409 ERR_ACCESSORIAL_NOT_WAIVABLE — resolution precedes the state guard"

      - name: malformed_field_values_all_collapse_into_invalid_request
        claim_type: violation_to_error
        grounds:
          - errors[ERR_INVALID_REQUEST]
          - validations[priority=16]  # ERR_INVALID_REQUEST
          - entities.Shipment.fields.zone
        distinguishing_aspect: |
          Five different shapes of malformed input — a missing required field, a two-decimal
          weight, an out-of-range zone, an out-of-range dim_divisor and an undeclared enum
          member — all return 400 ERR_INVALID_REQUEST, and none of them is silently coerced
          into a stored value.
        test_recipe:
          setup:
            - "SH-2001 is ACTIVE with ACTIVE contract C1 (divisor 139, min charge 1195, zone-2 rows 380/340/305), ServiceLevel EXPRESS and one PENDING_SCAN parcel 1Z-V-4001 (12 x 10 x 8 in, 6.0 lb, zone 2, version 1)."
          setup_api_calls:
            - call: "POST /shipper-accounts"
              payload: { account_number: "SH-2001", name: "Acme Parcel" }
              as: CarrierAdmin
              captures: { sh: $.data.id, sh_v: $.data.version }
            - call: "POST /service-levels"
              payload: { code: "EXPRESS", name: "Express", guarantee_hours: 24, guaranteed: true }
              as: CarrierAdmin
              captures: { sl: $.data.id }
            - call: "POST /rate-contracts"
              payload:
                shipper_id: "${sh}"
                effective_from: "2026-01-01"
                effective_to: "2026-12-31"
                dim_divisor: 139
                min_charge_cents: 1195
                rate_table: [{zone: 2, min_lbs: 1, max_lbs: 20, cents_per_lb: 380}, {zone: 2, min_lbs: 21, max_lbs: 70, cents_per_lb: 340}, {zone: 2, min_lbs: 71, max_lbs: 9999, cents_per_lb: 305}]
                tier_discount_table: [{min_transportation_subtotal_cents: 50000, discount_bps: 550}]
              as: CarrierAdmin
              captures: { c1: $.data.id }
            - call: "POST /rate-contracts/${c1}/activate"
              payload: { expected_shipper_account_version: "${sh_v}" }
              as: CarrierAdmin
            - call: "POST /shipments"
              payload: { shipper_id: "${sh}", service_level_id: "${sl}", tracking_number: "1Z-V-4001", zone: 2, residential_declared: false, declared_length_in: 12, declared_width_in: 10, declared_height_in: 8, declared_weight_lbs: 6.0 }
              as: CarrierOps
              captures: { p: $.data.id, pv: $.data.version }
          trigger:
            - call: "POST /shipments"
              payload: { shipper_id: "${sh}", service_level_id: "${sl}", tracking_number: "1Z-V-4002", zone: 2, residential_declared: false, declared_length_in: 12, declared_width_in: 10, declared_height_in: 8 }
              as: CarrierOps
              captures: { e_missing: $.data.error_id }
            - call: "POST /shipments"
              payload: { shipper_id: "${sh}", service_level_id: "${sl}", tracking_number: "1Z-V-4003", zone: 2, residential_declared: false, declared_length_in: 12, declared_width_in: 10, declared_height_in: 8, declared_weight_lbs: 6.25 }
              as: CarrierOps
              captures: { e_decimal: $.data.error_id }
            - call: "POST /shipments"
              payload: { shipper_id: "${sh}", service_level_id: "${sl}", tracking_number: "1Z-V-4004", zone: 9, residential_declared: false, declared_length_in: 12, declared_width_in: 10, declared_height_in: 8, declared_weight_lbs: 6.0 }
              as: CarrierOps
              captures: { e_zone: $.data.error_id }
            - call: "POST /rate-contracts"
              payload:
                shipper_id: "${sh}"
                effective_from: "2027-01-01"
                effective_to: "2027-12-31"
                dim_divisor: 99
                min_charge_cents: 1195
                rate_table: [{zone: 2, min_lbs: 1, max_lbs: 9999, cents_per_lb: 380}]
                tier_discount_table: []
              as: CarrierAdmin
              captures: { e_div: $.data.error_id }
            - call: "POST /shipments/${p}/scans"
              payload: { scan_source: "LASER_CURTAIN", scanned_length_in: 12, scanned_width_in: 10, scanned_height_in: 8, scanned_weight_lbs: 6.0, expected_shipment_version: "${pv}" }
              as: CarrierOps
              captures: { e_enum: $.data.error_id }
          assert:
            - "All five calls return HTTP 400 and ${e_missing} == ${e_decimal} == ${e_zone} == ${e_div} == ${e_enum} == ERR_INVALID_REQUEST"
            - "declared_weight_lbs 6.25 is rejected outright rather than rounded to 6.3 or 6.2 — at most one decimal place is a hard input rule, distinct from the internal round_half_up of calculations.billable_weight"
            - "zone 9 is outside [2, 8] and dim_divisor 99 is outside [100, 250]"
            - "GET /shipments returns total_count == 1 — 1Z-V-4002, 1Z-V-4003 and 1Z-V-4004 do not exist"
            - "GET /rate-contracts returns total_count == 1 and GET /shipments/${p}/scans returns total_count == 0"
            - "Shipment.${p}.version is still ${pv} and measurement_status is still PENDING_SCAN — the rejected scan incremented nothing"

      - name: inverted_periods_are_unprocessable_on_every_endpoint_that_takes_one
        claim_type: violation_to_error
        grounds:
          - errors[ERR_INVALID_PERIOD]
          - validations[priority=34]  # ERR_INVALID_PERIOD
        distinguishing_aspect: |
          One error covers four different period shapes, and the boundary differs per
          endpoint: contract and invoice ranges are inclusive so from == to is legal, while a
          surcharge window is half-open so start_date == end_date is not.
        test_recipe:
          setup:
            - "SH-2001 is ACTIVE with ACTIVE contract C1 covering [2026-01-01, 2026-12-31] and ServiceLevel EXPRESS."
          setup_api_calls:
            - call: "POST /shipper-accounts"
              payload: { account_number: "SH-2001", name: "Acme Parcel" }
              as: CarrierAdmin
              captures: { sh: $.data.id, sh_v: $.data.version }
            - call: "POST /service-levels"
              payload: { code: "EXPRESS", name: "Express", guarantee_hours: 24, guaranteed: true }
              as: CarrierAdmin
              captures: { sl: $.data.id }
            - call: "POST /rate-contracts"
              payload:
                shipper_id: "${sh}"
                effective_from: "2026-01-01"
                effective_to: "2026-12-31"
                dim_divisor: 139
                min_charge_cents: 1195
                rate_table: [{zone: 2, min_lbs: 1, max_lbs: 20, cents_per_lb: 380}, {zone: 2, min_lbs: 21, max_lbs: 70, cents_per_lb: 340}, {zone: 2, min_lbs: 71, max_lbs: 9999, cents_per_lb: 305}]
                tier_discount_table: [{min_transportation_subtotal_cents: 50000, discount_bps: 550}]
              as: CarrierAdmin
              captures: { c1: $.data.id }
            - call: "POST /rate-contracts/${c1}/activate"
              payload: { expected_shipper_account_version: "${sh_v}" }
              as: CarrierAdmin
          trigger:
            - call: "POST /rate-contracts"
              payload:
                shipper_id: "${sh}"
                effective_from: "2027-06-01"
                effective_to: "2027-05-31"
                dim_divisor: 139
                min_charge_cents: 1195
                rate_table: [{zone: 2, min_lbs: 1, max_lbs: 9999, cents_per_lb: 380}]
                tier_discount_table: []
              as: CarrierAdmin
              captures: { e_contract: $.data.error_id }
            - call: "POST /invoices"
              payload: { shipper_id: "${sh}", period_start: "2026-08-05", period_end: "2026-08-01" }
              as: BillingOps
              captures: { e_invoice: $.data.error_id }
            - call: "POST /surcharge-windows"
              payload: { code: "PEAK-2026", kind: "PEAK_SEASON", start_date: "2026-11-01", end_date: "2026-11-01", per_package_cents: 500 }
              as: CarrierAdmin
              captures: { e_window: $.data.error_id }
            - call: "POST /guarantee-claims/scan"
              payload: { shipper_id: "${sh}", period_start: "2026-08-05", period_end: "2026-08-01" }
              as: RevenueAuditor
              as_user_id: "auditor.one"
              captures: { e_scan: $.data.error_id }
            - call: "POST /surcharge-windows"
              payload: { code: "PEAK-2026", kind: "PEAK_SEASON", start_date: "2026-11-01", end_date: "2026-11-02", per_package_cents: 500 }
              as: CarrierAdmin
              captures: { w_ok: $.data.id, w_status: $.data.status }
          assert:
            - "All four bad calls return HTTP 422 and ${e_contract} == ${e_invoice} == ${e_window} == ${e_scan} == ERR_INVALID_PERIOD"
            - "The contract case is rejected by the period rule (priority 34), not by ERR_CONTRACT_PERIOD_OVERLAP (priority 35), even though 2027 does not overlap C1 at all"
            - "The invoice case is rejected before the sweep runs, so ERR_NO_BILLABLE_SHIPMENTS (priority 46) never appears"
            - "start_date == end_date is invalid for a window because end_date must be strictly greater, while a one-day window 2026-11-01..2026-11-02 is accepted: ${w_status} == SCHEDULED"
            - "GET /rate-contracts returns total_count == 1, GET /invoices returns total_count == 0 and GET /surcharge-windows returns total_count == 1 (only ${w_ok})"

      - name: a_shipper_user_reaching_another_shippers_data_is_a_scope_violation
        claim_type: violation_to_error
        grounds:
          - errors[ERR_SHIPPER_SCOPE_VIOLATION]
          - validations[priority=4]  # ERR_SHIPPER_SCOPE_VIOLATION
          - roles[ShipperUser]
        distinguishing_aspect: |
          ShipperUser identity is entity-backed, so the scope check compares X-User-ID with
          the owning ShipperAccount of the target: shipper 2 reading shipper 1's invoice, its
          shipment or filtering the shipment list by shipper 1's id all return 403
          ERR_SHIPPER_SCOPE_VIOLATION, and the check runs before the 404 for a nonexistent
          sibling resource.
        test_recipe:
          setup:
            - "SH-2001 and SH-2002 are both ACTIVE, each with its own ACTIVE contract (divisor 139, min charge 1195, zone-2 rows 380/340/305) and both use ServiceLevel EXPRESS."
            - "SH-2001 owns parcel 1Z-V-6001 (12 x 10 x 8 in, 6.0 lb, zone 2), which is delivered and swept onto INV1, then ISSUED (net 2660)."
          setup_api_calls:
            - call: "POST /shipper-accounts"
              payload: { account_number: "SH-2001", name: "Acme Parcel" }
              as: CarrierAdmin
              captures: { sh1: $.data.id, sh1_v: $.data.version }
            - call: "POST /shipper-accounts"
              payload: { account_number: "SH-2002", name: "Borealis Freight" }
              as: CarrierAdmin
              captures: { sh2: $.data.id, sh2_v: $.data.version }
            - call: "POST /service-levels"
              payload: { code: "EXPRESS", name: "Express", guarantee_hours: 24, guaranteed: true }
              as: CarrierAdmin
              captures: { sl: $.data.id }
            - call: "POST /rate-contracts"
              payload:
                shipper_id: "${sh1}"
                effective_from: "2026-01-01"
                effective_to: "2026-12-31"
                dim_divisor: 139
                min_charge_cents: 1195
                rate_table: [{zone: 2, min_lbs: 1, max_lbs: 20, cents_per_lb: 380}, {zone: 2, min_lbs: 21, max_lbs: 70, cents_per_lb: 340}, {zone: 2, min_lbs: 71, max_lbs: 9999, cents_per_lb: 305}]
                tier_discount_table: [{min_transportation_subtotal_cents: 50000, discount_bps: 550}]
              as: CarrierAdmin
              captures: { c1: $.data.id }
            - call: "POST /rate-contracts/${c1}/activate"
              payload: { expected_shipper_account_version: "${sh1_v}" }
              as: CarrierAdmin
            - call: "POST /shipments"
              payload: { shipper_id: "${sh1}", service_level_id: "${sl}", tracking_number: "1Z-V-6001", zone: 2, residential_declared: false, declared_length_in: 12, declared_width_in: 10, declared_height_in: 8, declared_weight_lbs: 6.0 }
              as: CarrierOps
              captures: { p: $.data.id }
            - call: "POST /shipments/${p}/deliver"
              payload: {}
              as: CarrierOps
            - call: "POST /invoices"
              payload: { shipper_id: "${sh1}", period_start: "2026-08-01", period_end: "2026-08-01" }
              as: BillingOps
              captures: { inv: $.data.id }
            - call: "POST /invoices/${inv}/issue"
              payload: {}
              as: BillingOps
            - call: "GET /invoice-lines"
              payload: { invoice_id: "${inv}" }
              as: BillingOps
              captures: { line: "$.data[0].id" }
          trigger:
            - call: "GET /invoices/${inv}"
              payload: {}
              as: ShipperUser
              as_user_id: "${sh2}"
              captures: { e_inv: $.data.error_id }
            - call: "GET /shipments/${p}"
              payload: {}
              as: ShipperUser
              as_user_id: "${sh2}"
              captures: { e_ship: $.data.error_id }
            - call: "GET /shipments"
              payload: { shipper_id: "${sh1}" }
              as: ShipperUser
              as_user_id: "${sh2}"
              captures: { e_list: $.data.error_id }
            - call: "POST /disputes"
              payload: { invoice_line_id: "${line}", claim_type: "WEIGHT", claimed_reason: "not my parcel but I want the credit" }
              as: ShipperUser
              as_user_id: "${sh2}"
              captures: { e_dispute: $.data.error_id }
            - call: "GET /invoices/${inv}"
              payload: {}
              as: ShipperUser
              as_user_id: "${sh1}"
              captures: { own_inv: $.data.id, own_net: $.data.net_amount_cents }
            - call: "GET /shipments"
              payload: { shipper_id: "${sh2}" }
              as: ShipperUser
              as_user_id: "${sh2}"
          assert:
            - "All four cross-shipper calls return HTTP 403 and ${e_inv} == ${e_ship} == ${e_list} == ${e_dispute} == ERR_SHIPPER_SCOPE_VIOLATION"
            - "The list case is a violation rather than an empty page — a ShipperUser may not even ask about another shipper's id"
            - "The dispute case is a 403, not a 404 or a 422: priority 4 runs before ERR_INVOICE_LINE_NOT_FOUND (12) and before ERR_DISPUTE_WINDOW_CLOSED (37)"
            - "${own_inv} == ${inv} and ${own_net} == 2660 — SH-2001's own user reads the same invoice successfully"
            - "SH-2002's own shipment list returns HTTP 200 with total_count == 0"
            - "GET /disputes as ${sh2} returns total_count == 0 — the rejected dispute persisted nothing"

      - name: guarantee_claim_ineligibility_is_reported_with_a_specific_error_each_time
        claim_type: violation_to_error
        grounds:
          - errors[ERR_SERVICE_NOT_GUARANTEED]
          - errors[ERR_SHIPMENT_NOT_DELIVERED]
          - errors[ERR_SHIPMENT_NOT_INVOICED]
          - errors[ERR_GUARANTEE_SUSPENDED]
          - calculations.guarantee_refund
        distinguishing_aspect: |
          Four different reasons a claim cannot be filed produce four different errors from
          the same endpoint — an unguaranteed service level, an undelivered parcel, a
          delivered but uninvoiced parcel and a parcel whose pickup date sits inside an ACTIVE
          PEAK_SEASON window — and cancelling that window immediately makes the last one
          claimable.
        test_recipe:
          setup:
            - "SH-2001 is ACTIVE with ACTIVE contract C1 (divisor 139, min charge 1195, zone-2 rows 380/340/305). ServiceLevel EXPRESS is 24 h guaranteed; ServiceLevel GROUND is 72 h with guaranteed false."
            - "At clock 2026-08-01T00:00:00Z three parcels are inducted, all 12 x 10 x 8 in at 6.0 lb, zone 2: P_GROUND 1Z-V-7001 on GROUND, P_TRANSIT 1Z-V-7002 on EXPRESS and P_PEAK 1Z-V-7003 on EXPRESS."
            - "At clock 2026-08-02T03:00:00Z P_GROUND and P_PEAK are delivered (P_PEAK is 3 h past its 24 h commitment); P_TRANSIT is left IN_TRANSIT. Both delivered parcels are swept onto INV1 and the invoice is ISSUED."
            - "The clock then moves to 2026-08-05T00:00:00Z, parcel P_LATE 1Z-V-7004 (EXPRESS, same dimensions) is inducted and delivered late at 2026-08-06T03:00:00Z but never invoiced."
            - "Finally SurchargeWindow PEAK-2026 (PEAK_SEASON, 2026-08-01 to 2026-09-01, 500 per package) is created and ACTIVATED — after INV1 was issued, so INV1's frozen lines are untouched."
          setup_api_calls:
            - call: "POST /shipper-accounts"
              payload: { account_number: "SH-2001", name: "Acme Parcel" }
              as: CarrierAdmin
              captures: { sh: $.data.id, sh_v: $.data.version }
            - call: "POST /service-levels"
              payload: { code: "EXPRESS", name: "Express", guarantee_hours: 24, guaranteed: true }
              as: CarrierAdmin
              captures: { sl: $.data.id }
            - call: "POST /service-levels"
              payload: { code: "GROUND", name: "Ground", guarantee_hours: 72, guaranteed: false }
              as: CarrierAdmin
              captures: { slg: $.data.id }
            - call: "POST /rate-contracts"
              payload:
                shipper_id: "${sh}"
                effective_from: "2026-01-01"
                effective_to: "2026-12-31"
                dim_divisor: 139
                min_charge_cents: 1195
                rate_table: [{zone: 2, min_lbs: 1, max_lbs: 20, cents_per_lb: 380}, {zone: 2, min_lbs: 21, max_lbs: 70, cents_per_lb: 340}, {zone: 2, min_lbs: 71, max_lbs: 9999, cents_per_lb: 305}]
                tier_discount_table: [{min_transportation_subtotal_cents: 50000, discount_bps: 550}]
              as: CarrierAdmin
              captures: { c1: $.data.id }
            - call: "POST /rate-contracts/${c1}/activate"
              payload: { expected_shipper_account_version: "${sh_v}" }
              as: CarrierAdmin
            - call: "POST /shipments"
              payload: { shipper_id: "${sh}", service_level_id: "${slg}", tracking_number: "1Z-V-7001", zone: 2, residential_declared: false, declared_length_in: 12, declared_width_in: 10, declared_height_in: 8, declared_weight_lbs: 6.0 }
              as: CarrierOps
              captures: { p_ground: $.data.id }
            - call: "POST /shipments"
              payload: { shipper_id: "${sh}", service_level_id: "${sl}", tracking_number: "1Z-V-7002", zone: 2, residential_declared: false, declared_length_in: 12, declared_width_in: 10, declared_height_in: 8, declared_weight_lbs: 6.0 }
              as: CarrierOps
              captures: { p_transit: $.data.id }
            - call: "POST /shipments"
              payload: { shipper_id: "${sh}", service_level_id: "${sl}", tracking_number: "1Z-V-7003", zone: 2, residential_declared: false, declared_length_in: 12, declared_width_in: 10, declared_height_in: 8, declared_weight_lbs: 6.0 }
              as: CarrierOps
              captures: { p_peak: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { now_utc: "2026-08-02T03:00:00Z" }
              as: CarrierAdmin
            - call: "POST /shipments/${p_ground}/deliver"
              payload: {}
              as: CarrierOps
            - call: "POST /shipments/${p_peak}/deliver"
              payload: {}
              as: CarrierOps
            - call: "POST /invoices"
              payload: { shipper_id: "${sh}", period_start: "2026-08-01", period_end: "2026-08-01" }
              as: BillingOps
              captures: { inv: $.data.id, lc: $.data.line_count }
            - call: "POST /invoices/${inv}/issue"
              payload: {}
              as: BillingOps
            - call: "POST /_clock/set_current_utc"
              payload: { now_utc: "2026-08-05T00:00:00Z" }
              as: CarrierAdmin
            - call: "POST /shipments"
              payload: { shipper_id: "${sh}", service_level_id: "${sl}", tracking_number: "1Z-V-7004", zone: 2, residential_declared: false, declared_length_in: 12, declared_width_in: 10, declared_height_in: 8, declared_weight_lbs: 6.0 }
              as: CarrierOps
              captures: { p_late: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { now_utc: "2026-08-06T03:00:00Z" }
              as: CarrierAdmin
            - call: "POST /shipments/${p_late}/deliver"
              payload: {}
              as: CarrierOps
            - call: "POST /surcharge-windows"
              payload: { code: "PEAK-2026", kind: "PEAK_SEASON", start_date: "2026-08-01", end_date: "2026-09-01", per_package_cents: 500 }
              as: CarrierAdmin
              captures: { w: $.data.id }
            - call: "POST /surcharge-windows/${w}/activate"
              payload: {}
              as: CarrierAdmin
          trigger:
            - call: "POST /guarantee-claims"
              payload: { shipment_id: "${p_ground}", claimed_reason: "slow" }
              as: RevenueAuditor
              as_user_id: "auditor.one"
              captures: { e_guar: $.data.error_id }
            - call: "POST /guarantee-claims"
              payload: { shipment_id: "${p_transit}", claimed_reason: "still not here" }
              as: RevenueAuditor
              as_user_id: "auditor.one"
              captures: { e_deliv: $.data.error_id }
            - call: "POST /guarantee-claims"
              payload: { shipment_id: "${p_late}", claimed_reason: "three hours late" }
              as: RevenueAuditor
              as_user_id: "auditor.one"
              captures: { e_inv: $.data.error_id }
            - call: "POST /guarantee-claims"
              payload: { shipment_id: "${p_peak}", claimed_reason: "three hours late" }
              as: RevenueAuditor
              as_user_id: "auditor.one"
              captures: { e_susp: $.data.error_id }
            - call: "POST /surcharge-windows/${w}/cancel"
              payload: {}
              as: CarrierAdmin
              captures: { w_state: $.data.status }
            - call: "POST /guarantee-claims"
              payload: { shipment_id: "${p_peak}", claimed_reason: "three hours late" }
              as: RevenueAuditor
              as_user_id: "auditor.one"
              captures: { claim: $.data.id, cand: $.data.candidate_refund_cents, late: $.data.late_by_seconds }
          assert:
            - "${lc} == 2 — only the two delivered parcels were swept; INV1's lines are 2660 each with no PEAK surcharge, because the window was activated after issue"
            - "${e_guar} == ERR_SERVICE_NOT_GUARANTEED (HTTP 422) — GROUND has guaranteed false, and this outranks the PEAK suspension that also applies to its pickup date"
            - "${e_deliv} == ERR_SHIPMENT_NOT_DELIVERED (HTTP 409) — priority 32 precedes every 422 eligibility rule"
            - "${e_inv} == ERR_SHIPMENT_NOT_INVOICED (HTTP 422) — P_LATE is late and guaranteed but sits on no ISSUED line, so there is nothing to refund; priority 51 also outranks the PEAK suspension covering 2026-08-05"
            - "${e_susp} == ERR_GUARANTEE_SUSPENDED (HTTP 422) — the ACTIVE PEAK_SEASON window covers P_PEAK's pickup_date 2026-08-01"
            - "${w_state} == CANCELLED, and the identical retry then returns HTTP 201 with ${late} == 10800 and ${cand} == 2660"
            - "GET /guarantee-claims returns total_count == 1 — the four rejections created nothing"

      - name: touching_contract_periods_collide_but_touching_windows_do_not
        claim_type: violation_to_error
        excluded_because:
          difficulty_instance: rate_contract_periods_are_closed_intervals_so_touching_endpoints_collide
          rationale: |
            The §1.8 interval_boundary_semantics instance already drives
            ERR_CONTRACT_PERIOD_OVERLAP at the exact touching endpoint
            (A.effective_to == B.effective_from) and contrasts it with the one-day gap that is
            accepted, including the supersedes exemption. Re-triggering the same 409 here
            would duplicate that coverage.

      - name: a_touching_surcharge_window_is_accepted_because_the_interval_is_half_open
        claim_type: violation_to_error
        excluded_because:
          difficulty_instance: surcharge_windows_use_half_open_intervals_scoped_by_kind_and_service_level
          rationale: |
            The §1.8 interval_boundary_semantics instance already covers
            ERR_SURCHARGE_WINDOW_OVERLAP end to end: a one-day intersection is rejected, the
            touching A.end_date == B.start_date pair is accepted, and a same-range window of a
            different kind or a different service_level_id scope is accepted too.

      - name: a_third_evidence_request_is_refused_once_the_round_cap_is_reached
        claim_type: violation_to_error
        excluded_because:
          difficulty_instance: dispute_evidence_round_cap_terminates_the_review_cycle
          rationale: |
            The §1.8 cycle_termination instance already walks the evidence loop to
            round_count == MAX_EVIDENCE_ROUNDS and asserts the third
            POST /disputes/{id}/request-evidence returns 409 ERR_EVIDENCE_ROUNDS_EXHAUSTED
            while resolution still works, so this section does not repeat the cap.

  # =====================================================================
  # SECTION 7 — RBAC (§1.7)
  # =====================================================================
  - section: rbac
    instances:
      - name: each_of_the_five_roles_can_run_its_own_exclusive_operations
        claim_type: can_perform_permitted_operations
        grounds:
          - roles[CarrierAdmin]
          - roles[CarrierOps]
          - roles[BillingOps]
          - roles[RevenueAuditor]
          - roles[ShipperUser]
        distinguishing_aspect: |
          One end-to-end revenue-recovery run touches all five roles in sequence — admin
          setup, operational induction and scanning, the billing sweep, the shipper's dispute
          and the auditor's resolution — and every call is accepted, including the two
          operations shared between CarrierOps and BillingOps.
        test_recipe:
          setup:
            - "Empty database. Every object below is created inside the trigger by the role that owns the operation."
          setup_api_calls: []
          trigger:
            - call: "POST /shipper-accounts"
              payload: { account_number: "SH-2001", name: "Acme Parcel", billing_email: "ap@acme.example" }
              as: CarrierAdmin
              captures: { sh: $.data.id, sh_v: $.data.version }
            - call: "POST /service-levels"
              payload: { code: "EXPRESS", name: "Express", guarantee_hours: 24, guaranteed: true }
              as: CarrierAdmin
              captures: { sl: $.data.id }
            - call: "POST /rate-contracts"
              payload:
                shipper_id: "${sh}"
                effective_from: "2026-01-01"
                effective_to: "2026-12-31"
                dim_divisor: 139
                min_charge_cents: 1195
                rate_table: [{zone: 2, min_lbs: 1, max_lbs: 20, cents_per_lb: 380}, {zone: 2, min_lbs: 21, max_lbs: 70, cents_per_lb: 340}, {zone: 2, min_lbs: 71, max_lbs: 9999, cents_per_lb: 305}]
                tier_discount_table: [{min_transportation_subtotal_cents: 50000, discount_bps: 550}]
                residential_waived: false
              as: CarrierAdmin
              captures: { c1: $.data.id }
            - call: "POST /rate-contracts/${c1}/activate"
              payload: { expected_shipper_account_version: "${sh_v}" }
              as: CarrierAdmin
              captures: { c1_state: $.data.status }
            - call: "POST /surcharge-windows"
              payload: { code: "PEAK-2026", kind: "PEAK_SEASON", start_date: "2026-11-01", end_date: "2026-11-10", per_package_cents: 500 }
              as: CarrierAdmin
              captures: { w: $.data.id }
            - call: "POST /surcharge-windows/${w}/activate"
              payload: {}
              as: CarrierAdmin
              captures: { w_state: $.data.status }
            - call: "POST /shipments"
              payload: { shipper_id: "${sh}", service_level_id: "${sl}", tracking_number: "1Z-B-1001", zone: 2, residential_declared: true, declared_length_in: 12, declared_width_in: 10, declared_height_in: 8, declared_weight_lbs: 6.0 }
              as: CarrierOps
              captures: { pa: $.data.id, pa_v: $.data.version }
            - call: "POST /shipments/${pa}/scans"
              payload: { scan_source: "AUTOMATED_DWS", scanned_length_in: 12, scanned_width_in: 10, scanned_height_in: 8, scanned_weight_lbs: 6.0, expected_shipment_version: "${pa_v}" }
              as: CarrierOps
              captures: { scan: $.data.id, tol: $.data.tolerance_status }
            - call: "POST /shipments"
              payload: { shipper_id: "${sh}", service_level_id: "${sl}", tracking_number: "1Z-B-1002", zone: 2, residential_declared: false, declared_length_in: 12, declared_width_in: 10, declared_height_in: 8, declared_weight_lbs: 6.0 }
              as: CarrierOps
              captures: { pb: $.data.id }
            - call: "POST /shipments/${pb}/accessorials"
              payload: { code: "ADDRESS_CORRECTION", reason: "suite number missing" }
              as: CarrierOps
              captures: { manual_acc: $.data.id, manual_amt: $.data.amount_cents }
            - call: "POST /shipments/${pa}/deliver"
              payload: {}
              as: CarrierOps
              captures: { pa_mv: $.data.movement_status }
            - call: "POST /invoices"
              payload: { shipper_id: "${sh}", period_start: "2026-08-01", period_end: "2026-08-01" }
              as: BillingOps
              captures: { inv: $.data.id, lc: $.data.line_count, net: $.data.net_amount_cents }
            - call: "POST /invoices/${inv}/issue"
              payload: {}
              as: BillingOps
              captures: { inv_state: $.data.status }
            - call: "GET /invoice-lines"
              payload: { invoice_id: "${inv}" }
              as: BillingOps
              captures: { line: "$.data[0].id" }
            - call: "POST /disputes"
              payload: { invoice_line_id: "${line}", claim_type: "ACCESSORIAL", claimed_reason: "commercial dock, not residential", disputed_codes: ["RESIDENTIAL"] }
              as: ShipperUser
              as_user_id: "${sh}"
              captures: { dsp: $.data.id }
            - call: "POST /disputes/${dsp}/request-evidence"
              payload: { required_item_type: "ADDRESS_PROOF" }
              as: RevenueAuditor
