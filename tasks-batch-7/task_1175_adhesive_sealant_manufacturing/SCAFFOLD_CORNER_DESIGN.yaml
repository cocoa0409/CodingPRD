              as: BatchOperator
              captures: { bat_id: $.data.id, lot_id: $.data.production_lot_id }
            - { call: "POST /api/batches/${bat_id}/complete-mix", payload: {}, as: BatchOperator }
            - call: "POST /api/packaging-runs"
              payload: { batch_id: "${bat_id}", pack_format: "CARTRIDGE", unit_volume_ml: 310, planned_units: 3, planned_start_at: "2026-05-01T08:10:00Z", planned_end_at: "2026-05-01T09:30:00Z" }
              as: BatchOperator
              captures: { run_id: $.data.id }
            - { call: "POST /api/packaging-runs/${run_id}/complete", payload: {}, as: BatchOperator }
          trigger:
            - { call: "POST /api/packaging-runs/${run_id}/exposure-events", payload: { exposure_minutes: 29, occurred_at: "2026-05-01T08:45:00Z" }, as: BatchOperator, captures: { ev_id: $.data.id } }
          assert:
            - "http 201; event ${ev_id} persisted (GET /api/exposure-events?packaging_run_id=${run_id} total_count == 1)"
            - "PackagingRun.${run_id}.status == SEALED (unchanged) AND ProductionLot.${lot_id}.hold_status == CLEAR AND units_quarantined == 0"

  # ===========================================================================
  - section: calculations
    instances:
      - name: expiry_date_month_end_clamp
        claim_type: correct_result
        grounds: [calculations.expiry_dating, entities.ProductionLot.fields.expiry_date]
        distinguishing_aspect: "Calendar-month arithmetic clamps to the target month's last day: manufacture 2026-01-31 + 1 month -> 2026-02-28 (2026 is not a leap year), never 2026-03-03 or an error."
        test_recipe:
          setup: ["EFFECTIVE formulation with shelf_life_months 1; batch completed at 2026-01-31T08:00 while the clock sits inside its mix window"]
          setup_api_calls:
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-01-31T08:00:00Z" }, as: PlatformAdmin }
            - call: "POST /api/formulations"
              payload: { code: "EPX-CLP", name: "Epx Clamp", chemistry_family: "EPOXY", moisture_sensitive: false, solvent_content_pct: 5.0, flash_point_c: 80.0, pot_life_minutes: 240, shelf_life_months: 1, spec_min_bond_strength_mpa: 12.0, min_remaining_shelf_life_days: 10 }
              as: PlantManager
              captures: { form_id: $.data.id }
            - { call: "POST /api/formulations/${form_id}/activate", payload: {}, as: PlantManager }
            - call: "POST /api/mixing-vessels"
              payload: { vessel_code: "V-CLP", capacity_liters: 100 }
              as: PlantManager
              captures: { ves_id: $.data.id }
            - call: "POST /api/batches"
              payload: { formulation_id: "${form_id}", vessel_id: "${ves_id}", mix_start_at: "2026-01-31T08:00:00Z", mix_end_at: "2026-01-31T09:00:00Z", batch_volume_ml: 1000 }
              as: BatchOperator
              captures: { bat_id: $.data.id, lot_id: $.data.production_lot_id }
          trigger:
            - { call: "POST /api/batches/${bat_id}/complete-mix", payload: {}, as: BatchOperator }
          assert:
            - "ProductionLot.${lot_id}.manufacture_date == 2026-01-31"
            - "ProductionLot.${lot_id}.expiry_date == 2026-02-28 (clamped to February's last day)"

      - name: fifo_violation_blocks_newer_lot_until_oldest_exhausted
        claim_type: correct_result
        grounds: [calculations.fifo_lot_selection, "errors[ERR_FIFO_VIOLATION]", "errors[ERR_INSUFFICIENT_LOT_STOCK]"]
        distinguishing_aspect: "Strict FIFO by (expiry_date, created_at): while the older lot has any available units the newer lot cannot be lined; once the older lot is fully reserved (units_available == 0) the newer lot becomes eligible."
        test_recipe:
          setup:
            - "Two RELEASED lots of the same formulation: lot1 manufactured 2026-05-01 (expiry 2026-11-01, 10 units), lot2 manufactured 2026-06-01 (expiry 2026-12-01, 10 units)"
            - "A DRAFT SALE shipment with ship_date 2026-08-01 (both lots pass the add-time expiry and shelf checks)"
          setup_api_calls:
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T08:00:00Z" }, as: PlatformAdmin }
            - call: "POST /api/formulations"
              payload: { code: "EPX-FIFO", name: "Epx Fifo", chemistry_family: "EPOXY", moisture_sensitive: false, solvent_content_pct: 5.0, flash_point_c: 80.0, pot_life_minutes: 240, shelf_life_months: 6, spec_min_bond_strength_mpa: 12.0, min_remaining_shelf_life_days: 90 }
              as: PlantManager
              captures: { form_id: $.data.id }
            - { call: "POST /api/formulations/${form_id}/activate", payload: {}, as: PlantManager }
            - call: "POST /api/mixing-vessels"
              payload: { vessel_code: "V-FIFO", capacity_liters: 100 }
              as: PlantManager
