          A fourth entity with yet another shape: ReforecastCycle's state is BUBBLED UP from its
          children rather than driven by its own endpoints. OPEN -> DECIDED fires on a child
          decision reaching a terminal state (approve OR reject), and DECIDED -> OPEN fires on the
          creation of a new child - a transition with no endpoint of its own on the cycle at all.
