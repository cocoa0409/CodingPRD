  # =========================================================================
  # Rule 7 -- cross-entity state dependencies across different entity pairs
  # =========================================================================
  - rule_id: cross_entity_state_dependency
    instances:

      - name: start_fabrication_requires_parent_case_exam_complete
        grounds:
          - validations[priority=13]
          - state_machines.CaseArch.PLANNED_to_IMPRESSION_PENDING
          - state_machines.ProsthesisCase.INTAKE_to_EXAM_COMPLETE
          - errors[ERR_CROSS_ENTITY_STATE]
        distinguishing_aspect: |
          Entity pair CaseArch -> ProsthesisCase: the arch's own state PLANNED is perfectly
          legal for start-fabrication, and the call is refused solely because the PARENT
          case is still INTAKE; running complete-exam and repeating the identical call
          then succeeds.
        test_recipe:
          setup:
            - "Logical clock at 2026-05-01T00:00:00Z."
            - "One FLEXIBLE_PARTIAL case still in INTAKE carrying one PLANNED MAXILLARY arch."
            - "No PaymentPlan exists, so the write gate is down and rung 5 cannot mask rung 13."
          setup_api_calls:
            - call: "POST /prosthetics/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "admin-root"
            - call: "POST /prosthetics/patients"
              payload: { full_name: "Quilla Basani", date_of_birth: "1961-08-14", phone: "555-0388" }
              as: FrontOffice
