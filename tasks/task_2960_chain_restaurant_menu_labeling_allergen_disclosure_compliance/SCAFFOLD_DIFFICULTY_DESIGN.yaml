  # ===========================================================================
  # Rule 9 - Compensating invariants over two different conserved quantities
  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: withdraw_certification_restores_the_reprint_obligation_ledger
        grounds:
          - state_machines.Recipe.transitions.APPROVED_to_WITHDRAWN
          - state_machines.Recipe.transitions.SUPERSEDED_to_APPROVED
          - entities.Brand.open_reprint_obligation_count
          - entities.Brand.overdue_board_count
          - entities.MenuBoardListing.listing_status
          - endpoints[POST /recipes/{id}/withdraw-certification]
          - calculations.reprint_obligation_and_deadline
        distinguishing_aspect: "Conserved quantity: the brand's reprint-obligation ledger (open_reprint_obligation_count, overdue_board_count, the listing snapshots and the item's declaration) - a non-monetary obligation counter. Withdrawing the superseding recipe must reverse all four cascade hops of the certification, including an OVERDUE board and the FROZEN posture, leaving reprint_count untouched because no reprint ever happened."
        test_recipe:
          setup:
            - "COVERED Brand (20 OPERATING units) in jurisdiction OH-STD with extra_requirement NONE, so reprint_grace_days == 30."
            - "Recipe R1 of the sandwich is APPROVED with components 140 g @ 140 cal/100 g + 60 g @ 330 cal/100 g + 34 g @ 400 cal/100 g, giving raw 530.00 -> declared 530 Cal and raw sodium 548.90 mg -> declared 550 mg; allergen groups {WHEAT, MILK}, no cross-contact risk."
            - "A PUBLISHED DisclosurePacket exists and a PUBLISHED PRIMARY_MENU_BOARD lists the item; the board is CURRENT and the brand is COMPLIANT with both obligation counters at 0."
            - "Recipe R2 adds a 45 g @ 680 cal/100 g, 590 mg/100 g garlic butter spread whose allergen_group is also MILK, so the allergen matrix does not change and the packet stays PUBLISHED. R2 certifies to raw 836.00 -> declared 840 Cal and raw sodium 814.40 mg -> declared 810 mg."
            - "The 310 Cal jump exceeds the tolerance max(20, round_half_up(530 * 0.2)) == 106, so the certification cascade fires: R1 -> SUPERSEDED, item -> RELABEL_REQUIRED, listing -> STALE, board -> REPRINT_REQUIRED with reprint_deadline 2026-08-31T00:00:00Z, brand open_reprint_obligation_count 1 and posture RESTRICTED."
            - "The clock is then advanced to 2026-09-05T00:00:00Z, pushing the board to OVERDUE, overdue_board_count to 1 and the posture to FROZEN."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /jurisdictions"
              payload: { code: "OH-STD", name: "Ohio", preemption_mode: "PREEMPTED", extra_requirement: "NONE", enforcement_tier: "FEDERAL_ALIGNED" }
              as: PlatformAdmin
              captures: { juris: $.data.id }
            - call: "POST /brands"
              payload: { legal_name: "Golden Grill Holdings LLC", doing_business_as: "Golden Grill" }
              as: PlatformAdmin
              captures: { brand: $.data.id }
            - call: "POST /establishments"
              payload: { brand_id: "${brand}", jurisdiction_id: "${juris}", unit_label: "OH-0001", unit_status: "OPERATING", operates_under_brand_name: true }
              as: PlatformAdmin
              captures: { est: $.data.id }
            - call: "POST /brands/${brand}/establishment-batches"
              payload: { jurisdiction_id: "${juris}", unit_count: 19, unit_status: "OPERATING", operates_under_brand_name: true, unit_label_prefix: "OH-B" }
              as: PlatformAdmin
            - call: "POST /menu-items"
              payload: { brand_id: "${brand}", name: "Grill Sandwich", item_class: "STANDARD", variable_type: "NONE", first_offered_on: "2026-01-05" }
              as: BrandComplianceOfficer
              as_user_id: "${brand}"
              captures: { item: $.data.id, item_v1: $.data.version }
            - call: "POST /menu-items/${item}/recipes"
              payload: { expected_menu_item_version: "${item_v1}", change_note: "Initial specification" }
              as: NutritionAnalyst
              as_user_id: "analyst-1"
              captures: { r1: $.data.id }
            - call: "POST /recipes/${r1}/components"
              payload: { component_name: "Grilled chicken breast", role: "BASE", grams: 140, calories_per_100g: 140, sodium_mg_per_100g: 240, added_sugar_g_per_100g: 0, allergen_group: "NONE", cross_contact_risk: "NONE" }
              as: NutritionAnalyst
              as_user_id: "analyst-1"
            - call: "POST /recipes/${r1}/components"
              payload: { component_name: "Brioche bun", role: "BASE", grams: 60, calories_per_100g: 330, sodium_mg_per_100g: 148, added_sugar_g_per_100g: 4, allergen_group: "WHEAT", cross_contact_risk: "NONE" }
              as: NutritionAnalyst
              as_user_id: "analyst-1"
            - call: "POST /recipes/${r1}/components"
              payload: { component_name: "Cheddar slice", role: "BASE", grams: 34, calories_per_100g: 400, sodium_mg_per_100g: 365, added_sugar_g_per_100g: 0, allergen_group: "MILK", cross_contact_risk: "NONE" }
              as: NutritionAnalyst
              as_user_id: "analyst-1"
            - call: "POST /recipes/${r1}/submit-for-analysis"
              payload: { method: "LAB_ANALYSIS" }
              as: NutritionAnalyst
              as_user_id: "analyst-1"
              captures: { a1: $.data.id }
            - call: "POST /nutrition-analyses/${a1}/decision"
              payload: { decision: "CERTIFY", decision_note: "Laboratory panel accepted" }
              as: NutritionAnalyst
              as_user_id: "analyst-2"
            - call: "GET /brands/${brand}"
              payload: {}
              as: BrandComplianceOfficer
              as_user_id: "${brand}"
              captures: { brand_v: $.data.version }
            - call: "POST /brands/${brand}/disclosure-packets"
              payload: { expected_brand_version: "${brand_v}", cross_contact_statement: "", written_info_channels: ["IN_STORE_BINDER", "WEBSITE"] }
              as: BrandComplianceOfficer
              as_user_id: "${brand}"
              captures: { packet: $.data.id }
            - call: "POST /disclosure-packets/${packet}/publish"
              payload: {}
              as: BrandComplianceOfficer
              as_user_id: "${brand}"
            - call: "POST /menu-boards"
              payload: { establishment_id: "${est}", board_type: "PRIMARY_MENU_BOARD", succinct_statement_variant: "FEDERAL_DEFAULT" }
              as: MenuboardPublisher
              as_user_id: "${est}"
              captures: { board: $.data.id }
            - call: "POST /menu-boards/${board}/listings"
              payload: { menu_item_id: "${item}", sodium_warning_icon: false }
              as: MenuboardPublisher
              as_user_id: "${est}"
              captures: { listing: $.data.id }
            - call: "POST /menu-boards/${board}/publish"
              payload: { effective_from: "2026-08-01T00:00:00Z" }
              as: MenuboardPublisher
              as_user_id: "${est}"
            - call: "GET /menu-items/${item}"
              payload: {}
              as: BrandComplianceOfficer
              as_user_id: "${brand}"
              captures: { item_v2: $.data.version }
            - call: "POST /menu-items/${item}/recipes"
              payload: { expected_menu_item_version: "${item_v2}", change_note: "Add garlic butter spread" }
              as: NutritionAnalyst
              as_user_id: "analyst-1"
              captures: { r2: $.data.id }
            - call: "POST /recipes/${r2}/components"
              payload: { component_name: "Grilled chicken breast", role: "BASE", grams: 140, calories_per_100g: 140, sodium_mg_per_100g: 240, added_sugar_g_per_100g: 0, allergen_group: "NONE", cross_contact_risk: "NONE" }
              as: NutritionAnalyst
              as_user_id: "analyst-1"
            - call: "POST /recipes/${r2}/components"
              payload: { component_name: "Brioche bun", role: "BASE", grams: 60, calories_per_100g: 330, sodium_mg_per_100g: 148, added_sugar_g_per_100g: 4, allergen_group: "WHEAT", cross_contact_risk: "NONE" }
              as: NutritionAnalyst
              as_user_id: "analyst-1"
            - call: "POST /recipes/${r2}/components"
              payload: { component_name: "Cheddar slice", role: "BASE", grams: 34, calories_per_100g: 400, sodium_mg_per_100g: 365, added_sugar_g_per_100g: 0, allergen_group: "MILK", cross_contact_risk: "NONE" }
              as: NutritionAnalyst
              as_user_id: "analyst-1"
            - call: "POST /recipes/${r2}/components"
              payload: { component_name: "Garlic butter spread", role: "BASE", grams: 45, calories_per_100g: 680, sodium_mg_per_100g: 590, added_sugar_g_per_100g: 0, allergen_group: "MILK", cross_contact_risk: "NONE" }
              as: NutritionAnalyst
              as_user_id: "analyst-1"
            - call: "POST /recipes/${r2}/submit-for-analysis"
              payload: { method: "LAB_ANALYSIS" }
              as: NutritionAnalyst
              as_user_id: "analyst-1"
              captures: { a2: $.data.id }
            - call: "POST /nutrition-analyses/${a2}/decision"
              payload: { decision: "CERTIFY", decision_note: "Spread panel accepted" }
              as: NutritionAnalyst
              as_user_id: "analyst-2"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-05T00:00:00Z" }
              as: PlatformAdmin
              captures: { overdue: $.data.boards_marked_overdue }
          trigger:
            - call: "POST /recipes/${r2}/withdraw-certification"
              payload: { reason: "Spread supplier delisted before rollout; revert to the certified sandwich" }
              as: NutritionAnalyst
              as_user_id: "analyst-1"
          assert:
            - "before the trigger: Recipe.${r1}.status == SUPERSEDED, Recipe.${r2}.status == APPROVED with supersedes_recipe_id == ${r1}"
            - "before the trigger: MenuItem.${item}.declared_calorie_max == 840 and declared_sodium_mg == 810 and labeling_status == RELABEL_REQUIRED"
            - "before the trigger: MenuBoardListing.${listing}.listing_status == STALE, MenuBoard.${board}.calorie_compliance_status == OVERDUE with reprint_deadline == 2026-08-31T00:00:00Z, Brand.${brand}.open_reprint_obligation_count == 1, overdue_board_count == 1, compliance_posture == FROZEN"
            - "trigger response HTTP status == 200 and data.status == WITHDRAWN"
            - "COMPENSATION hop 1: Recipe.${r1}.status == APPROVED with approved_at == 2026-09-05T00:00:00Z and version incremented to 2"
            - "COMPENSATION hop 2: MenuItem.${item}.declared_calorie_min == 530 and declared_calorie_max == 530 and declared_sodium_mg == 550 and allergen_groups == [MILK, WHEAT] and cross_contact_groups == []"
            - "COMPENSATION hop 3: MenuBoardListing.${listing}.listing_status == LISTED with declared_min_snapshot == 530 and declared_max_snapshot == 530, and MenuBoard.${board}.calorie_compliance_status == CURRENT with reprint_deadline == null and stale_listing_count == 0"
            - "COMPENSATION hop 4: Brand.${brand}.open_reprint_obligation_count == 0 and overdue_board_count == 0 and compliance_posture == COMPLIANT, and MenuItem.${item}.labeling_status == DECLARED"
            - "no drift: MenuBoard.${board}.reprint_count == 0 because the obligation was compensated away rather than reprinted, and MenuBoard.${board}.publication_status stays PUBLISHED with effective_from 2026-08-01T00:00:00Z"
            - "GET /brands/${brand}/compliance-summary reports open_reprint_obligation_count 0, overdue_board_count 0, compliance_posture COMPLIANT and outstanding_penalty_cents_total 0"
            - "a second POST /recipes/${r2}/withdraw-certification returns ERR_RECIPE_NOT_APPROVED because R2 is terminal, so the compensation cannot be applied twice"

      - name: rescind_penalty_restores_both_money_ledgers_exactly
        grounds:
          - state_machines.EnforcementAction.transitions.PENALTY_ASSESSED_to_RESPONSE_SUBMITTED
          - calculations.enforcement_penalty_assessment
          - entities.Establishment.outstanding_penalty_cents
          - entities.Jurisdiction.assessed_penalty_cents_total
          - validations[priority=39]
          - errors[ERR_OUTSTANDING_PENALTY]
        distinguishing_aspect: "Conserved quantity: money in whole cents held on two separate ledgers (Establishment.outstanding_penalty_cents and Jurisdiction.assessed_penalty_cents_total), a different quantity from the reprint-obligation counters. RESCIND_PENALTY must subtract exactly penalty_total_cents from both and null the whole money breakdown, which is observable through the REPRINT_COMPLETED response that ERR_OUTSTANDING_PENALTY blocked while the penalty stood."
        test_recipe:
