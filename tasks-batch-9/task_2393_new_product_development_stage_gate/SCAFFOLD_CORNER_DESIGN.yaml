          WAIVED is deliberately asymmetric: it counts as satisfied for the gate checklist, so the
          gate can pass at 100.00 completeness, yet contributes nothing to launch_readiness_pct,
          which sticks at 80.00 with the waived type still listed as blocking the lock.
