            - "MIN_MAX_TOPUP: AllocationLine.${lb_id}.need_units == 25 = max_units 30 - pipeline 5; the forecast of 4 is ignored entirely (a DEMAND_DRIVEN reading would have said 4 x 4 - 5 = 11)"
