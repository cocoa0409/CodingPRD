# =============================================================================
# §1.9 Scaffold Corner Design (breadth coverage for non-difficulty tests)
# Sports Officiating Assignment. Walks references/claim-extraction-guide.md
# section-by-section against §1.1–§1.7. Same geometry/clock conventions as §1.8.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: create_league_returns_201_with_defaults_applied
        claim_type: Creation
        grounds: [entities.League, endpoints]
        distinguishing_aspect: "POST /leagues with required fields returns 201; status defaults SETUP; postseason_* defaults (8, 3.5, 0) applied when omitted."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /leagues"
              payload: { name: "L", sport: "BASKETBALL", base_game_fee_cents: 10000, mileage_rate_cents_per_mile: 50 }
              as: LeagueAdmin
              captures: { lg: $.data.id }
          assert:
            - "response.status == 201"
            - "League.${lg}.status == SETUP"
            - "League.${lg}.postseason_min_games == 8"
            - "League.${lg}.postseason_min_rating == 3.5"
            - "League.${lg}.postseason_max_noshows == 0"
            - "League.${lg}.version == 1"

      - name: get_league_not_found_returns_404
        claim_type: Not Found
        grounds: [entities.League, "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET /leagues/{id} with a non-existent UUID returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /leagues/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: LeagueAdmin
              captures: { eid: $.data.error_id }
          assert:
            - "response.status == 404"
            - "response.data.error_id == ERR_NOT_FOUND"

      - name: create_official_missing_required_field_returns_invalid_request
        claim_type: Required Fields
        grounds: [entities.Official, "validations[priority=17]", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /officials missing required home_lat returns ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["League exists."]
          setup_api_calls:
            - call: "POST /leagues"
              payload: { name: "L", sport: "BASKETBALL", base_game_fee_cents: 10000, mileage_rate_cents_per_mile: 0 }
              as: LeagueAdmin
              captures: { lg: $.data.id }
          trigger:
            - call: "POST /officials"
              payload: { league_id: "${lg}", full_name: "O", home_lon: -75.0 }
              as: LeagueAdmin
              captures: { eid: $.data.error_id }
          assert:
            - "response.status == 400"
            - "response.data.error_id == ERR_INVALID_REQUEST"

      - name: create_official_defaults_rank_rookie_status_active
        claim_type: Defaults
        grounds: [entities.Official.fields.rank, entities.Official.fields.status, entities.Official.fields.max_travel_miles]
        distinguishing_aspect: "Omitting rank/max_travel_miles applies defaults ROOKIE and 50; status defaults ACTIVE."
        test_recipe:
          setup: ["League exists."]
          setup_api_calls:
            - call: "POST /leagues"
              payload: { name: "L", sport: "SOCCER", base_game_fee_cents: 10000, mileage_rate_cents_per_mile: 0 }
              as: LeagueAdmin
              captures: { lg: $.data.id }
          trigger:
            - call: "POST /officials"
              payload: { league_id: "${lg}", full_name: "O", home_lat: 40.0, home_lon: -75.0 }
              as: LeagueAdmin
              captures: { off: $.data.id }
          assert:
            - "Official.${off}.rank == ROOKIE"
            - "Official.${off}.status == ACTIVE"
            - "Official.${off}.max_travel_miles == 50"

      - name: official_computed_fields_initial_values
        claim_type: Computed Fields
        grounds: [entities.Official.fields.games_worked_count, entities.Official.fields.penalty_points, entities.Official.fields.reliability_score, entities.Official.fields.mean_rating]
        distinguishing_aspect: "A freshly registered official has games_worked_count 0, penalty_points 0, reliability_score 100, mean_rating null (no evaluations); client-supplied values for these are ignored."
        test_recipe:
          setup: ["League OPEN; official just registered."]
          setup_api_calls:
            - call: "POST /leagues"
              payload: { name: "L", sport: "HOCKEY", base_game_fee_cents: 10000, mileage_rate_cents_per_mile: 0 }
              as: LeagueAdmin
              captures: { lg: $.data.id }
            - call: "POST /leagues/${lg}/activate"
              payload: {}
              as: LeagueAdmin
            - call: "POST /officials"
              payload: { league_id: "${lg}", full_name: "O", home_lat: 40.0, home_lon: -75.0 }
              as: LeagueAdmin
              captures: { off: $.data.id }
          trigger:
            - call: "GET /officials/${off}"
              payload: {}
              as: LeagueAdmin
          assert:
            - "Official.${off}.games_worked_count == 0"
            - "Official.${off}.penalty_points == 0"
            - "Official.${off}.reliability_score == 100"
            - "Official.${off}.mean_rating == null"

      - name: create_official_invalid_enum_rank_rejected
        claim_type: Type Constraints
        grounds: [entities.Official.fields.rank, "validations[priority=17]", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /officials with rank='GRANDMASTER' (not in enum) returns ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["League exists."]
          setup_api_calls:
            - call: "POST /leagues"
              payload: { name: "L", sport: "BASKETBALL", base_game_fee_cents: 10000, mileage_rate_cents_per_mile: 0 }
              as: LeagueAdmin
              captures: { lg: $.data.id }
          trigger:
            - call: "POST /officials"
              payload: { league_id: "${lg}", full_name: "O", rank: "GRANDMASTER", home_lat: 40.0, home_lon: -75.0 }
              as: LeagueAdmin
              captures: { eid: $.data.error_id }
          assert:
            - "response.status == 400"
            - "response.data.error_id == ERR_INVALID_REQUEST"

      - name: availability_window_end_before_start_rejected
        claim_type: Type Constraints
        grounds: [entities.Availability.fields.window_end_utc, "validations[priority=17]", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /availabilities with window_end_utc <= window_start_utc returns ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["League OPEN; official exists."]
          setup_api_calls:
            - call: "POST /leagues"
              payload: { name: "L", sport: "SOCCER", base_game_fee_cents: 10000, mileage_rate_cents_per_mile: 0 }
              as: LeagueAdmin
              captures: { lg: $.data.id }
            - call: "POST /officials"
              payload: { league_id: "${lg}", full_name: "O", home_lat: 40.0, home_lon: -75.0 }
              as: LeagueAdmin
              captures: { off: $.data.id }
          trigger:
            - call: "POST /availabilities"
              payload: { official_id: "${off}", window_start_utc: "2026-06-20T20:00:00Z", window_end_utc: "2026-06-20T18:00:00Z" }
              as: Official
              as_user_id: "${off}"
              captures: { eid: $.data.error_id }
          assert:
            - "response.status == 400"
            - "response.data.error_id == ERR_INVALID_REQUEST"

      - name: conflict_declaration_immutable_id_created_at_only
        claim_type: Immutability
        grounds: [entities.ConflictDeclaration]
        distinguishing_aspect: "ConflictDeclaration is common_fields:false — response carries id and created_at, no version field, and there is no update endpoint."
        test_recipe:
          setup: ["League exists; official exists."]
          setup_api_calls:
            - call: "POST /leagues"
              payload: { name: "L", sport: "BASKETBALL", base_game_fee_cents: 10000, mileage_rate_cents_per_mile: 0 }
              as: LeagueAdmin
              captures: { lg: $.data.id }
            - call: "POST /officials"
              payload: { league_id: "${lg}", full_name: "O", home_lat: 40.0, home_lon: -75.0 }
              as: LeagueAdmin
              captures: { off: $.data.id }
          trigger:
            - call: "POST /conflict-declarations"
              payload: { official_id: "${off}", scope: "TEAM", team_name: "Hawks" }
              as: LeagueAdmin
              captures: { cd: $.data.id }
          assert:
            - "response.status == 201"
            - "ConflictDeclaration.${cd}.id is present"
            - "ConflictDeclaration.${cd} has no version field"

      - name: create_official_wrong_parent_league_returns_not_found
        claim_type: Parent Relationships
        grounds: [entities.Official.fields.league_id, "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "POST /officials with a non-existent league_id returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /officials"
              payload: { league_id: "00000000-0000-0000-0000-000000000000", full_name: "O", home_lat: 40.0, home_lon: -75.0 }
              as: LeagueAdmin
              captures: { eid: $.data.error_id }
          assert:
            - "response.status == 404"
            - "response.data.error_id == ERR_NOT_FOUND"

      - name: list_leagues_pagination_envelope
        claim_type: Listing
        grounds: [entities.League, endpoints]
        distinguishing_aspect: "GET /leagues returns a paginated array envelope with total_count and has_more honoring limit."
        test_recipe:
          setup: ["Two leagues created."]
          setup_api_calls:
            - call: "POST /leagues"
              payload: { name: "L1", sport: "BASKETBALL", base_game_fee_cents: 10000, mileage_rate_cents_per_mile: 0 }
              as: LeagueAdmin
            - call: "POST /leagues"
              payload: { name: "L2", sport: "SOCCER", base_game_fee_cents: 10000, mileage_rate_cents_per_mile: 0 }
              as: LeagueAdmin
          trigger:
            - call: "GET /leagues"
              payload: { limit: 1, offset: 0 }
              as: LeagueAdmin
          assert:
            - "response.response_type == array"
            - "response.data length == 1"
            - "response.meta total_count == 2"
            - "response.has_more == true"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: open_already_open_game_returns_invalid_state
        claim_type: Invalid Transitions
        grounds: [state_machines.Game.DRAFT_to_OPEN, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "POST /games/{id}/open on a game already OPEN returns ERR_INVALID_STATE (409); no side effects."
        test_recipe:
          setup: ["League OPEN; game OPEN with 1 slot."]
          setup_api_calls:
            - call: "POST /leagues"
              payload: { name: "L", sport: "BASKETBALL", base_game_fee_cents: 10000, mileage_rate_cents_per_mile: 0 }
              as: LeagueAdmin
              captures: { lg: $.data.id }
            - call: "POST /leagues/${lg}/activate"
              payload: {}
              as: LeagueAdmin
            - call: "POST /games"
              payload: { league_id: "${lg}", home_team: "H", away_team: "A", venue_lat: 40.0, venue_lon: -75.0, start_utc: "2026-06-20T18:00:00Z", required_crew_size: 1 }
              as: Assignor
              captures: { gm: $.data.id }
            - call: "POST /games/${gm}/crew-slots"
              payload: { position: "ASSISTANT" }
              as: Assignor
              captures: { slot: $.data.id }
            - call: "POST /games/${gm}/open"
              payload: {}
              as: Assignor
          trigger:
            - call: "POST /games/${gm}/open"
              payload: {}
              as: Assignor
              captures: { eid: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_INVALID_STATE"

      - name: lock_game_with_incomplete_crew_returns_crew_incomplete
        claim_type: Precondition Enforcement
        grounds: [state_machines.Game.STAFFED_to_LOCKED, "errors[ERR_CREW_INCOMPLETE]", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "A 2-slot game with only 1 FILLED is OPEN (not STAFFED); POST /games/{id}/lock is rejected — the game is not STAFFED so ERR_INVALID_STATE fires before the crew-complete check."
        test_recipe:
          setup: ["League OPEN; 2-slot game OPEN; one slot accepted (crew_filled_count 1 < 2, game stays OPEN)."]
          setup_api_calls:
            - call: "POST /leagues"
              payload: { name: "L", sport: "SOCCER", base_game_fee_cents: 10000, mileage_rate_cents_per_mile: 0 }
              as: LeagueAdmin
              captures: { lg: $.data.id }
            - call: "POST /leagues/${lg}/activate"
              payload: {}
              as: LeagueAdmin
            - call: "POST /officials"
              payload: { league_id: "${lg}", full_name: "A", home_lat: 40.0, home_lon: -75.0 }
              as: LeagueAdmin
              captures: { oa: $.data.id }
            - call: "POST /availabilities"
              payload: { official_id: "${oa}", window_start_utc: "2026-01-01T00:00:00Z", window_end_utc: "2027-01-01T00:00:00Z" }
              as: Official
              as_user_id: "${oa}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: LeagueAdmin
            - call: "POST /games"
              payload: { league_id: "${lg}", home_team: "H", away_team: "A", venue_lat: 40.0, venue_lon: -75.0, start_utc: "2026-06-20T18:00:00Z", required_crew_size: 2 }
              as: Assignor
              captures: { gm: $.data.id }
            - call: "POST /games/${gm}/crew-slots"
              payload: { position: "ASSISTANT" }
              as: Assignor
              captures: { s1: $.data.id }
            - call: "POST /games/${gm}/crew-slots"
              payload: { position: "ASSISTANT" }
              as: Assignor
              captures: { s2: $.data.id }
            - call: "POST /games/${gm}/open"
              payload: {}
              as: Assignor
              captures: { gv1: $.data.version }
            - call: "POST /crew-slots/${s1}/offer"
              payload: { official_id: "${oa}", expected_game_version: "${gv1}" }
              as: Assignor
              captures: { a1: $.data.id }
            - call: "GET /games/${gm}"
              payload: {}
              as: Assignor
              captures: { gv2: $.data.version }
            - call: "POST /assignments/${a1}/accept"
              payload: { expected_game_version: "${gv2}" }
              as: Official
              as_user_id: "${oa}"
            - call: "GET /games/${gm}"
              payload: {}
              as: Assignor
              captures: { gv3: $.data.version }
          trigger:
            - call: "POST /games/${gm}/lock"
              payload: { expected_game_version: "${gv3}" }
              as: Assignor
              captures: { eid: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_INVALID_STATE"
            - "Game.${gm}.status == OPEN"

      - name: settle_before_game_start_returns_game_not_started
        claim_type: Precondition Enforcement
        grounds: [state_machines.Game.LOCKED_to_COMPLETED, "errors[ERR_GAME_NOT_STARTED]"]
        distinguishing_aspect: "POST /games/{id}/settle while current clock < game.start_utc is rejected with ERR_GAME_NOT_STARTED (409)."
        test_recipe:
          setup: ["League OPEN; 1-slot game accepted and LOCKED; clock still before start."]
          setup_api_calls:
            - call: "POST /leagues"
              payload: { name: "L", sport: "HOCKEY", base_game_fee_cents: 10000, mileage_rate_cents_per_mile: 0 }
              as: LeagueAdmin
              captures: { lg: $.data.id }
            - call: "POST /leagues/${lg}/activate"
              payload: {}
              as: LeagueAdmin
            - call: "POST /officials"
              payload: { league_id: "${lg}", full_name: "O", rank: "SENIOR", home_lat: 40.0, home_lon: -75.0 }
              as: LeagueAdmin
              captures: { off: $.data.id }
            - call: "POST /availabilities"
              payload: { official_id: "${off}", window_start_utc: "2026-01-01T00:00:00Z", window_end_utc: "2027-01-01T00:00:00Z" }
              as: Official
              as_user_id: "${off}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: LeagueAdmin
            - call: "POST /games"
              payload: { league_id: "${lg}", home_team: "H", away_team: "A", venue_lat: 40.0, venue_lon: -75.0, start_utc: "2026-06-20T18:00:00Z", required_crew_size: 1 }
              as: Assignor
              captures: { gm: $.data.id }
            - call: "POST /games/${gm}/crew-slots"
              payload: { position: "REFEREE" }
              as: Assignor
              captures: { slot: $.data.id }
            - call: "POST /games/${gm}/open"
              payload: {}
              as: Assignor
              captures: { gv1: $.data.version }
            - call: "POST /crew-slots/${slot}/offer"
              payload: { official_id: "${off}", expected_game_version: "${gv1}" }
              as: Assignor
              captures: { asg: $.data.id }
            - call: "GET /games/${gm}"
              payload: {}
              as: Assignor
              captures: { gv2: $.data.version }
            - call: "POST /assignments/${asg}/accept"
              payload: { expected_game_version: "${gv2}" }
              as: Official
              as_user_id: "${off}"
            - call: "GET /games/${gm}"
              payload: {}
              as: Assignor
              captures: { gv3: $.data.version }
            - call: "POST /games/${gm}/lock"
              payload: { expected_game_version: "${gv3}" }
              as: Assignor
              captures: { gv4: $.data.version }
          trigger:
            - call: "POST /games/${gm}/settle"
              payload: { expected_game_version: "${gv4}" }
              as: Assignor
              captures: { eid: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_GAME_NOT_STARTED"

      - name: terminal_game_cancelled_no_transitions
        claim_type: Terminal State Lockdown
        grounds: [state_machines.Game.terminal_states, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "A CANCELLED game is terminal; POST /games/{id}/open on it returns ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["League OPEN; game created DRAFT then cancelled."]
          setup_api_calls:
            - call: "POST /leagues"
              payload: { name: "L", sport: "BASKETBALL", base_game_fee_cents: 10000, mileage_rate_cents_per_mile: 0 }
              as: LeagueAdmin
              captures: { lg: $.data.id }
            - call: "POST /leagues/${lg}/activate"
              payload: {}
              as: LeagueAdmin
            - call: "POST /games"
              payload: { league_id: "${lg}", home_team: "H", away_team: "A", venue_lat: 40.0, venue_lon: -75.0, start_utc: "2026-06-20T18:00:00Z", required_crew_size: 1 }
              as: Assignor
              captures: { gm: $.data.id }
            - call: "POST /games/${gm}/cancel"
              payload: {}
              as: Assignor
          trigger:
            - call: "POST /games/${gm}/open"
              payload: {}
              as: Assignor
              captures: { eid: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_INVALID_STATE"

      - name: open_game_without_provisioned_crew_returns_crew_not_provisioned
        claim_type: Precondition Enforcement
        grounds: [state_machines.Game.DRAFT_to_OPEN, "errors[ERR_CREW_NOT_PROVISIONED]"]
        distinguishing_aspect: "Opening a game whose CrewSlot count (0) != required_crew_size (1) returns ERR_CREW_NOT_PROVISIONED (409)."
        test_recipe:
          setup: ["League OPEN; game DRAFT with NO slots provisioned."]
          setup_api_calls:
            - call: "POST /leagues"
              payload: { name: "L", sport: "SOCCER", base_game_fee_cents: 10000, mileage_rate_cents_per_mile: 0 }
              as: LeagueAdmin
              captures: { lg: $.data.id }
            - call: "POST /leagues/${lg}/activate"
              payload: {}
              as: LeagueAdmin
            - call: "POST /games"
              payload: { league_id: "${lg}", home_team: "H", away_team: "A", venue_lat: 40.0, venue_lon: -75.0, start_utc: "2026-06-20T18:00:00Z", required_crew_size: 1 }
              as: Assignor
              captures: { gm: $.data.id }
          trigger:
            - call: "POST /games/${gm}/open"
              payload: {}
              as: Assignor
              captures: { eid: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_CREW_NOT_PROVISIONED"

      - name: offer_already_offered_slot_returns_slot_not_vacant
        claim_type: Idempotency
        grounds: [state_machines.CrewSlot.VACANT_to_OFFERED, "errors[ERR_SLOT_NOT_VACANT]"]
        distinguishing_aspect: "A second offer on a slot already OFFERED returns ERR_SLOT_NOT_VACANT (409)."
        test_recipe:
          setup: ["League OPEN; 1-slot OPEN game; slot already offered to A."]
          setup_api_calls:
            - call: "POST /leagues"
              payload: { name: "L", sport: "BASKETBALL", base_game_fee_cents: 10000, mileage_rate_cents_per_mile: 0 }
              as: LeagueAdmin
              captures: { lg: $.data.id }
            - call: "POST /leagues/${lg}/activate"
              payload: {}
              as: LeagueAdmin
            - call: "POST /officials"
              payload: { league_id: "${lg}", full_name: "A", home_lat: 40.0, home_lon: -75.0 }
              as: LeagueAdmin
              captures: { oa: $.data.id }
            - call: "POST /officials"
              payload: { league_id: "${lg}", full_name: "B", home_lat: 40.0, home_lon: -75.0 }
              as: LeagueAdmin
              captures: { ob: $.data.id }
            - call: "POST /availabilities"
              payload: { official_id: "${oa}", window_start_utc: "2026-01-01T00:00:00Z", window_end_utc: "2027-01-01T00:00:00Z" }
              as: Official
              as_user_id: "${oa}"
            - call: "POST /availabilities"
              payload: { official_id: "${ob}", window_start_utc: "2026-01-01T00:00:00Z", window_end_utc: "2027-01-01T00:00:00Z" }
              as: Official
              as_user_id: "${ob}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: LeagueAdmin
            - call: "POST /games"
              payload: { league_id: "${lg}", home_team: "H", away_team: "A", venue_lat: 40.0, venue_lon: -75.0, start_utc: "2026-06-20T18:00:00Z", required_crew_size: 1 }
              as: Assignor
              captures: { gm: $.data.id }
            - call: "POST /games/${gm}/crew-slots"
              payload: { position: "ASSISTANT" }
              as: Assignor
              captures: { slot: $.data.id }
            - call: "POST /games/${gm}/open"
              payload: {}
              as: Assignor
              captures: { gv1: $.data.version }
            - call: "POST /crew-slots/${slot}/offer"
              payload: { official_id: "${oa}", expected_game_version: "${gv1}" }
              as: Assignor
              captures: { a1: $.data.id }
            - call: "GET /games/${gm}"
              payload: {}
              as: Assignor
              captures: { gv2: $.data.version }
          trigger:
            - call: "POST /crew-slots/${slot}/offer"
              payload: { official_id: "${ob}", expected_game_version: "${gv2}" }
              as: Assignor
              captures: { eid: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_SLOT_NOT_VACANT"

      - name: noshow_before_game_start_returns_game_not_started
        claim_type: Precondition Enforcement
        grounds: [state_machines.Assignment.ACCEPTED_to_NO_SHOW, "errors[ERR_GAME_NOT_STARTED]"]
