              as: ContributingTeam
              as_user_id: "${team_id}"
            - call: "POST /design-system/platform-implementations/${ios_id}/accessibility-audits"
              payload: { method: "AUTOMATED", wcag_level: "AA", violations_critical: 0, violations_serious: 0, violations_moderate: 0, evidence_url: "https://ds.example.com/a11y/ios" }
              as: ContributingTeam
              as_user_id: "${team_id}"
            - call: "POST /design-system/platform-implementations/${and_id}/accessibility-audits"
              payload: { method: "AUTOMATED", wcag_level: "AA", violations_critical: 0, violations_serious: 0, violations_moderate: 0, evidence_url: "https://ds.example.com/a11y/android" }
              as: ContributingTeam
              as_user_id: "${team_id}"
            - call: "POST /design-system/platform-implementations/${web_id}/ship"
              payload: { package_version: "1.0.0", token_compliance_ratio: 0.95 }
              as: ContributingTeam
              as_user_id: "${team_id}"
            - call: "GET /design-system/components/${comp_id}"
              payload: {}
              as: DesignSystemLead
              captures: { cov_1: $.data.coverage_state, cnt_1: $.data.shipped_platform_count }
            - call: "POST /design-system/platform-implementations/${ios_id}/ship"
              payload: { package_version: "1.0.0", token_compliance_ratio: 0.95 }
              as: ContributingTeam
              as_user_id: "${team_id}"
            - call: "GET /design-system/components/${comp_id}"
              payload: {}
              as: DesignSystemLead
              captures: { cov_2: $.data.coverage_state, cnt_2: $.data.shipped_platform_count }
          trigger:
