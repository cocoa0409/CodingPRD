# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Task 2764 — Ski Area Mountain Operations & Snowmaking
#
# Nine §0.5 rule_ids x 2 instances = 18 instances. Every instance grounds only in elements
# declared by SCAFFOLD.yaml §1.1-§1.7; deleting this file would leave the declared behaviour
# byte-identical and only make coverage harder to audit.
#
# Canonical bootstrap used by most chains (referred to as "the open-mountain bootstrap"):
#   logical clock 2026-08-01T00:00:00Z -> season -> lift L1 -> inspection PASS -> operator
#   assignments -> lift STANDBY -> terrain area T1 -> snow stake reading -> grooming task
#   dispatch + complete -> two on-duty patrollers assigned to T1 -> day plan -> publish
#   (PRESEASON -> OPERATING) -> weather -> lift OPEN -> opening decision OPEN.
# Every numeric literal in an `assert:` below was produced by executing the matching
# §1.3 `formula:` with its declared `constants:` under round_half_up.

scaffold_difficulty_design:

  - rule_id: dual_variant_calc
    instances:

      - name: base_depth_policy_variant_divergence_on_terrain_area
        grounds:
          - calculations.terrain_base_depth
          - entities.SeasonConfig.fields.base_depth_policy
          - entities.TerrainArea.fields.base_depth_in
          - entities.TerrainArea.fields.base_depth_stake_count
          - entities.SnowDepthReading.fields.depth_in
        distinguishing_aspect: |
          The dual variant here lives on the TerrainArea snowpack domain (a depth measurement in
          inches averaged across stakes), not on the SnowmakingSession water-accounting domain:
          the identical three-stake reading set resolves to 34.3 in under MEAN_OF_STAKES and 27.6 in
          under MIN_OF_STAKES, so the two variants disagree by 6.7 in on the same physical data.
        test_recipe:
          setup:
            - "Two independent seasons exist, identical except for base_depth_policy: season MEAN uses MEAN_OF_STAKES, season MIN uses MIN_OF_STAKES."
            - "Each season has one lift and one BLUE terrain area of 18.0 acres with min_open_base_depth_in 30."
            - "Each area carries the identical three stake readings taken at the logical clock: S1 33.4 in, S2 27.6 in, S3 41.9 in."
            - "Logical clock is 2026-08-01T00:00:00Z so every reading is inside the 48 hour BASE_DEPTH_LOOKBACK_HOURS window."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: MountainOpsDirector
            - call: "POST /mountain-ops/seasons"
              payload: { season_label: "2026-27-MEAN", base_depth_policy: "MEAN_OF_STAKES", water_right_seasonal_af: 250.000, plant_max_gpm: 6000, snowmaking_kwh_per_af: 620.0, min_patrollers_per_open_area: 2, groom_freshness_hours: 18, energy_windows: [{ code: "OFF_1", start_hour_utc: 0, end_hour_utc: 6, price_usd_per_kwh: 0.062, tier: "OFF_PEAK" }, { code: "MID_1", start_hour_utc: 6, end_hour_utc: 9, price_usd_per_kwh: 0.113, tier: "MID_PEAK" }, { code: "ON_1", start_hour_utc: 9, end_hour_utc: 21, price_usd_per_kwh: 0.187, tier: "ON_PEAK" }, { code: "MID_2", start_hour_utc: 21, end_hour_utc: 24, price_usd_per_kwh: 0.113, tier: "MID_PEAK" }] }
              as: MountainOpsDirector
              captures: { s_mean_id: $.data.id }
            - call: "POST /mountain-ops/lifts"
              payload: { season_id: "${s_mean_id}", lift_code: "L1", name: "Summit Express", lift_type: "DETACHABLE", wind_hold_threshold_mph: 40.0, hourly_capacity_pph: 1800, required_operator_count: 2 }
              as: LiftOpsManager
              captures: { l_mean_id: $.data.id }
            - call: "POST /mountain-ops/terrain-areas"
              payload: { season_id: "${s_mean_id}", serving_lift_id: "${l_mean_id}", trail_code: "T1", name: "Sunbowl", terrain_class: "BLUE", acres: 18.0, min_open_base_depth_in: 30, avalanche_terrain: false }
              as: MountainOpsDirector
              captures: { a_mean_id: $.data.id }
            - call: "POST /mountain-ops/terrain-areas/${a_mean_id}/snow-depth-readings"
              payload: { stake_code: "S1", depth_in: 33.4, measured_at: "2026-08-01T00:00:00Z", density_pct: 10.0, source: "MANUAL_STAKE" }
              as: GroomingLead
            - call: "POST /mountain-ops/terrain-areas/${a_mean_id}/snow-depth-readings"
              payload: { stake_code: "S2", depth_in: 27.6, measured_at: "2026-08-01T00:00:00Z", density_pct: 10.0, source: "MANUAL_STAKE" }
              as: GroomingLead
            - call: "POST /mountain-ops/terrain-areas/${a_mean_id}/snow-depth-readings"
              payload: { stake_code: "S3", depth_in: 41.9, measured_at: "2026-08-01T00:00:00Z", density_pct: 10.0, source: "MANUAL_STAKE" }
              as: GroomingLead
            - call: "POST /mountain-ops/seasons"
              payload: { season_label: "2026-27-MIN", base_depth_policy: "MIN_OF_STAKES", water_right_seasonal_af: 250.000, plant_max_gpm: 6000, snowmaking_kwh_per_af: 620.0, min_patrollers_per_open_area: 2, groom_freshness_hours: 18, energy_windows: [{ code: "OFF_1", start_hour_utc: 0, end_hour_utc: 6, price_usd_per_kwh: 0.062, tier: "OFF_PEAK" }, { code: "MID_1", start_hour_utc: 6, end_hour_utc: 9, price_usd_per_kwh: 0.113, tier: "MID_PEAK" }, { code: "ON_1", start_hour_utc: 9, end_hour_utc: 21, price_usd_per_kwh: 0.187, tier: "ON_PEAK" }, { code: "MID_2", start_hour_utc: 21, end_hour_utc: 24, price_usd_per_kwh: 0.113, tier: "MID_PEAK" }] }
              as: MountainOpsDirector
              captures: { s_min_id: $.data.id }
            - call: "POST /mountain-ops/lifts"
              payload: { season_id: "${s_min_id}", lift_code: "L1", name: "Summit Express", lift_type: "DETACHABLE", wind_hold_threshold_mph: 40.0, hourly_capacity_pph: 1800, required_operator_count: 2 }
              as: LiftOpsManager
              captures: { l_min_id: $.data.id }
            - call: "POST /mountain-ops/terrain-areas"
              payload: { season_id: "${s_min_id}", serving_lift_id: "${l_min_id}", trail_code: "T1", name: "Sunbowl", terrain_class: "BLUE", acres: 18.0, min_open_base_depth_in: 30, avalanche_terrain: false }
              as: MountainOpsDirector
              captures: { a_min_id: $.data.id }
            - call: "POST /mountain-ops/terrain-areas/${a_min_id}/snow-depth-readings"
              payload: { stake_code: "S1", depth_in: 33.4, measured_at: "2026-08-01T00:00:00Z", density_pct: 10.0, source: "MANUAL_STAKE" }
              as: GroomingLead
            - call: "POST /mountain-ops/terrain-areas/${a_min_id}/snow-depth-readings"
              payload: { stake_code: "S2", depth_in: 27.6, measured_at: "2026-08-01T00:00:00Z", density_pct: 10.0, source: "MANUAL_STAKE" }
              as: GroomingLead
          trigger:
            - call: "POST /mountain-ops/terrain-areas/${a_min_id}/snow-depth-readings"
              payload: { stake_code: "S3", depth_in: 41.9, measured_at: "2026-08-01T00:00:00Z", density_pct: 10.0, source: "MANUAL_STAKE" }
              as: GroomingLead
            - call: "GET /mountain-ops/terrain-areas/${a_mean_id}"
              payload: {}
              as: MountainOpsDirector
            - call: "GET /mountain-ops/terrain-areas/${a_min_id}"
              payload: {}
              as: MountainOpsDirector
          assert:
            - "TerrainArea.${a_mean_id}.base_depth_in == 34.3"
            - "TerrainArea.${a_mean_id}.base_depth_stake_count == 3"
            - "TerrainArea.${a_min_id}.base_depth_in == 27.6"
            - "TerrainArea.${a_min_id}.base_depth_stake_count == 3"
            - "TerrainArea.${a_mean_id}.base_depth_in - TerrainArea.${a_min_id}.base_depth_in == 6.7"
            - "TerrainArea.${a_mean_id}.base_depth_in >= 30 while TerrainArea.${a_min_id}.base_depth_in < 30, so the MEAN season's area clears validations[priority=25] and the MIN season's area does not"

      - name: water_volume_variant_divergence_on_snowmaking_session
        grounds:
          - calculations.snowmaking_water_volume
          - entities.SnowmakingSession.fields.water_af_reserved
          - entities.SnowmakingSession.fields.water_af_actual
          - entities.SeasonConfig.fields.water_reserved_af
          - entities.SeasonConfig.fields.water_used_af
          - state_machines.SnowmakingSession.RUNNING_to_COMPLETED
        distinguishing_aspect: |
          The dual variant here lives on the SnowmakingSession water-accounting domain (acre-feet
          drawn against a season water right), a different entity domain from the TerrainArea
          snowpack-depth variant: PLANNED_RESERVATION bills the whole 420 minute declared window
          for 1.547 AF while METERED_ACTUAL bills only the 360 minutes actually spent RUNNING for
          1.326 AF, and the 0.221 AF difference is released back to SeasonConfig.water_reserved_af.
        test_recipe:
          setup:
            - "Open-mountain bootstrap: season (water_right_seasonal_af 250.000, plant_max_gpm 6000, snowmaking_kwh_per_af 620.0), lift L1 OPEN, terrain area T1 OPEN, day plan published with wet_bulb_f 22.0 and wind_speed_mph 10.0, season_state OPERATING."
            - "Pump house PH1 is ONLINE with max_gpm 2400 and gun_count 40."
            - "One session on T1/PH1 declares window [2026-08-01T05:00:00Z, 2026-08-01T12:00:00Z) at 1200 gpm, so planned_minutes is 420 and water_af_reserved is 1.547."
            - "The session runs 05:00-07:00, is paused 07:00-09:00 and runs 09:00-13:00, so accumulated_run_minutes is 360 at completion."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: MountainOpsDirector
            - call: "POST /mountain-ops/seasons"
              payload: { season_label: "2026-27", base_depth_policy: "MEAN_OF_STAKES", water_right_seasonal_af: 250.000, plant_max_gpm: 6000, snowmaking_kwh_per_af: 620.0, min_patrollers_per_open_area: 2, groom_freshness_hours: 18, energy_windows: [{ code: "OFF_1", start_hour_utc: 0, end_hour_utc: 6, price_usd_per_kwh: 0.062, tier: "OFF_PEAK" }, { code: "MID_1", start_hour_utc: 6, end_hour_utc: 9, price_usd_per_kwh: 0.113, tier: "MID_PEAK" }, { code: "ON_1", start_hour_utc: 9, end_hour_utc: 21, price_usd_per_kwh: 0.187, tier: "ON_PEAK" }, { code: "MID_2", start_hour_utc: 21, end_hour_utc: 24, price_usd_per_kwh: 0.113, tier: "MID_PEAK" }] }
              as: MountainOpsDirector
              captures: { season_id: $.data.id }
            - call: "POST /mountain-ops/lifts"
              payload: { season_id: "${season_id}", lift_code: "L1", name: "Summit Express", lift_type: "DETACHABLE", wind_hold_threshold_mph: 40.0, hourly_capacity_pph: 1800, required_operator_count: 2 }
              as: LiftOpsManager
              captures: { lift_id: $.data.id }
            - call: "POST /mountain-ops/lifts/${lift_id}/inspections"
              payload: { result: "PASS", notes: "daily pre-op" }
              as: LiftOpsManager
            - call: "POST /mountain-ops/lift-staff-assignments"
              payload: { lift_id: "${lift_id}", operator_code: "OP-1", role_on_lift: "TOP_OP", shift_start: "2026-08-01T00:00:00Z", shift_end: "2026-08-01T16:00:00Z" }
              as: LiftOpsManager
            - call: "POST /mountain-ops/lift-staff-assignments"
              payload: { lift_id: "${lift_id}", operator_code: "OP-2", role_on_lift: "BOTTOM_OP", shift_start: "2026-08-01T00:00:00Z", shift_end: "2026-08-01T16:00:00Z" }
              as: LiftOpsManager
            - call: "POST /mountain-ops/lifts/${lift_id}/service-status"
              payload: { target_status: "STANDBY" }
              as: LiftOpsManager
            - call: "POST /mountain-ops/terrain-areas"
              payload: { season_id: "${season_id}", serving_lift_id: "${lift_id}", trail_code: "T1", name: "Sunbowl", terrain_class: "BLUE", acres: 18.0, min_open_base_depth_in: 30, avalanche_terrain: false }
              as: MountainOpsDirector
              captures: { area_id: $.data.id }
            - call: "POST /mountain-ops/terrain-areas/${area_id}/snow-depth-readings"
              payload: { stake_code: "S1", depth_in: 40.0, measured_at: "2026-08-01T00:00:00Z", density_pct: 10.0, source: "MANUAL_STAKE" }
              as: GroomingLead
            - call: "POST /mountain-ops/grooming-tasks"
              payload: { terrain_area_id: "${area_id}", cat_route_code: "R1", sequence_index: 1, snowcat_unit_code: "CAT-1", window_start: "2026-08-01T00:00:00Z", window_end: "2026-08-01T04:00:00Z", winch_required: false }
              as: GroomingLead
              captures: { task_id: $.data.id }
            - call: "POST /mountain-ops/grooming-tasks/${task_id}/dispatch"
              payload: {}
              as: GroomingLead
            - call: "POST /mountain-ops/grooming-tasks/${task_id}/complete"
              payload: { passes_completed: 20 }
              as: GroomingLead
            - call: "POST /mountain-ops/patrollers"
              payload: { season_id: "${season_id}", patroller_code: "P1", full_name: "Ada Patrol", cert_level: "EMT", assigned_terrain_area_id: "${area_id}", blaster_certified: true, on_duty: true }
              as: MountainOpsDirector
              captures: { p1_id: $.data.id }
            - call: "POST /mountain-ops/patrollers"
              payload: { season_id: "${season_id}", patroller_code: "P2", full_name: "Bo Patrol", cert_level: "PARAMEDIC", assigned_terrain_area_id: "${area_id}", blaster_certified: true, on_duty: true }
              as: MountainOpsDirector
              captures: { p2_id: $.data.id }
            - call: "POST /mountain-ops/day-plans"
              payload: { season_id: "${season_id}", operating_date: "2026-08-01", parking_stalls_total: 500 }
              as: MountainOpsDirector
              captures: { day_id: $.data.id }
            - call: "POST /mountain-ops/day-plans/${day_id}/publish"
              payload: {}
              as: MountainOpsDirector
            - call: "POST /mountain-ops/day-plans/${day_id}/weather"
              payload: { wind_speed_mph: 10.0, wet_bulb_f: 22.0, new_snow_in: 0.0 }
              as: MountainOpsDirector
            - call: "POST /mountain-ops/lifts/${lift_id}/service-status"
              payload: { target_status: "OPEN" }
              as: LiftOpsManager
            - call: "POST /mountain-ops/terrain-areas/${area_id}/opening-decision"
              payload: { decision: "OPEN", note: "first tracks" }
              as: MountainOpsDirector
            - call: "POST /mountain-ops/pump-houses"
              payload: { season_id: "${season_id}", pump_house_code: "PH1", name: "Base Pumphouse", max_gpm: 2400, gun_count: 40, status: "ONLINE" }
              as: SnowmakingSupervisor
              captures: { ph1_id: $.data.id }
            - call: "GET /mountain-ops/terrain-areas/${area_id}"
              payload: {}
              as: SnowmakingSupervisor
              captures: { ta_v1: $.data.version }
            - call: "POST /mountain-ops/snowmaking-sessions"
              payload: { terrain_area_id: "${area_id}", pump_house_id: "${ph1_id}", window_start: "2026-08-01T05:00:00Z", window_end: "2026-08-01T12:00:00Z", gun_count: 30, gpm: 1200, expected_terrain_area_version: "${ta_v1}" }
              as: SnowmakingSupervisor
              captures: { sess_id: $.data.id, reserved_af: $.data.water_af_reserved }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T05:00:00Z" }
              as: SnowmakingSupervisor
            - call: "POST /mountain-ops/snowmaking-sessions/${sess_id}/status"
              payload: { target_state: "RUNNING" }
              as: SnowmakingSupervisor
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T07:00:00Z" }
              as: SnowmakingSupervisor
            - call: "POST /mountain-ops/snowmaking-sessions/${sess_id}/status"
              payload: { target_state: "PAUSED" }
              as: SnowmakingSupervisor
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T09:00:00Z" }
              as: SnowmakingSupervisor
            - call: "POST /mountain-ops/snowmaking-sessions/${sess_id}/status"
              payload: { target_state: "RUNNING" }
              as: SnowmakingSupervisor
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T13:00:00Z" }
              as: SnowmakingSupervisor
          trigger:
            - call: "POST /mountain-ops/snowmaking-sessions/${sess_id}/status"
              payload: { target_state: "COMPLETED" }
              as: SnowmakingSupervisor
            - call: "GET /mountain-ops/seasons/${season_id}/snow-accounting"
              payload: {}
              as: SnowmakingSupervisor
          assert:
            - "SnowmakingSession.${sess_id}.planned_minutes == 420"
            - "SnowmakingSession.${sess_id}.water_af_reserved == 1.547"
            - "SnowmakingSession.${sess_id}.accumulated_run_minutes == 360"
            - "SnowmakingSession.${sess_id}.water_af_actual == 1.326"
            - "SnowmakingSession.${sess_id}.water_af_reserved - SnowmakingSession.${sess_id}.water_af_actual == 0.221"
            - "SeasonConfig.${season_id}.water_reserved_af == 0.000"
            - "SeasonConfig.${season_id}.water_used_af == 1.326"
            - "GET /mountain-ops/seasons/${season_id}/snow-accounting data.water_right_remaining_af == 248.674"
  - rule_id: combinatorial_formula
    instances:

      - name: energy_cost_per_window_rounding_order_on_snowmaking_session
        grounds:
          - calculations.snowmaking_energy_cost
          - entities.SeasonConfig.fields.energy_windows
          - entities.SeasonConfig.fields.snowmaking_kwh_per_af
          - entities.SnowmakingSession.fields.energy_kwh
          - entities.SnowmakingSession.fields.energy_cost_usd
          - entities.SnowmakingSession.fields.demand_surcharge_applied
        distinguishing_aspect: |
          This is mode (b): one formula whose result depends on the ORDER in which its rounding steps are
          applied, not on which branch is taken. The metered run interval [05:00, 11:00) is sliced across
          three of the four declared energy windows; the declared ROUNDING_ORDER rounds each window's kwh to
          3 decimals, then that window's cost to 2 decimals, and only then sums the already-rounded costs
          (8.50 + 46.45 + 51.25 = 106.20). Summing the unrounded per-window costs and rounding once at the
          end yields 106.19 - one cent low - so the assertion discriminates the two orders on identical
          inputs. The demand surcharge is deliberately left un-fired (peak_committed_gpm 1200 < 0.8 * 6000
          = 4800) so that the per-window sum is observable without the 1.12 multiplier on top of it.
        test_recipe:
          setup:
            - "Open-mountain bootstrap with snowmaking_kwh_per_af 620.0, plant_max_gpm 6000 and the four declared energy windows OFF_1 [0,6) 0.062, MID_1 [6,9) 0.113, ON_1 [9,21) 0.187, MID_2 [21,24) 0.113."
            - "Pump house PH1 ONLINE with max_gpm 2400; the only session on it commits 1200 gpm, so peak_committed_gpm is 1200."
            - "One session on T1/PH1 over [2026-08-01T05:00:00Z, 2026-08-01T12:00:00Z) at 1200 gpm; it runs 05:00-07:00, pauses, resumes 09:00 and is completed at 13:00, so accumulated_run_minutes is 360 and water_af_actual is 1.326."
            - "The priced run interval is therefore [window_start, window_start + 360 minutes) = [05:00, 11:00): 60 minutes in OFF_1, 180 in MID_1, 120 in ON_1 and 0 in MID_2."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: MountainOpsDirector
            - call: "POST /mountain-ops/seasons"
              payload: { season_label: "2026-27", base_depth_policy: "MEAN_OF_STAKES", water_right_seasonal_af: 250.000, plant_max_gpm: 6000, snowmaking_kwh_per_af: 620.0, min_patrollers_per_open_area: 2, groom_freshness_hours: 18, energy_windows: [{ code: "OFF_1", start_hour_utc: 0, end_hour_utc: 6, price_usd_per_kwh: 0.062, tier: "OFF_PEAK" }, { code: "MID_1", start_hour_utc: 6, end_hour_utc: 9, price_usd_per_kwh: 0.113, tier: "MID_PEAK" }, { code: "ON_1", start_hour_utc: 9, end_hour_utc: 21, price_usd_per_kwh: 0.187, tier: "ON_PEAK" }, { code: "MID_2", start_hour_utc: 21, end_hour_utc: 24, price_usd_per_kwh: 0.113, tier: "MID_PEAK" }] }
              as: MountainOpsDirector
              captures: { season_id: $.data.id }
            - call: "POST /mountain-ops/lifts"
              payload: { season_id: "${season_id}", lift_code: "L1", name: "Summit Express", lift_type: "DETACHABLE", wind_hold_threshold_mph: 40.0, hourly_capacity_pph: 1800, required_operator_count: 2 }
              as: LiftOpsManager
              captures: { lift_id: $.data.id }
            - call: "POST /mountain-ops/lifts/${lift_id}/inspections"
              payload: { result: "PASS", notes: "daily pre-op" }
              as: LiftOpsManager
            - call: "POST /mountain-ops/lift-staff-assignments"
              payload: { lift_id: "${lift_id}", operator_code: "OP-1", role_on_lift: "TOP_OP", shift_start: "2026-08-01T00:00:00Z", shift_end: "2026-08-01T16:00:00Z" }
              as: LiftOpsManager
            - call: "POST /mountain-ops/lift-staff-assignments"
              payload: { lift_id: "${lift_id}", operator_code: "OP-2", role_on_lift: "BOTTOM_OP", shift_start: "2026-08-01T00:00:00Z", shift_end: "2026-08-01T16:00:00Z" }
              as: LiftOpsManager
            - call: "POST /mountain-ops/lifts/${lift_id}/service-status"
              payload: { target_status: "STANDBY" }
              as: LiftOpsManager
            - call: "POST /mountain-ops/terrain-areas"
              payload: { season_id: "${season_id}", serving_lift_id: "${lift_id}", trail_code: "T1", name: "Sunbowl", terrain_class: "BLUE", acres: 18.0, min_open_base_depth_in: 30, avalanche_terrain: false }
              as: MountainOpsDirector
              captures: { area_id: $.data.id }
            - call: "POST /mountain-ops/terrain-areas/${area_id}/snow-depth-readings"
              payload: { stake_code: "S1", depth_in: 40.0, measured_at: "2026-08-01T00:00:00Z", density_pct: 10.0, source: "MANUAL_STAKE" }
              as: GroomingLead
            - call: "POST /mountain-ops/grooming-tasks"
              payload: { terrain_area_id: "${area_id}", cat_route_code: "R1", sequence_index: 1, snowcat_unit_code: "CAT-1", window_start: "2026-08-01T00:00:00Z", window_end: "2026-08-01T04:00:00Z", winch_required: false }
              as: GroomingLead
              captures: { task_id: $.data.id }
            - call: "POST /mountain-ops/grooming-tasks/${task_id}/dispatch"
              payload: {  }
              as: GroomingLead
            - call: "POST /mountain-ops/grooming-tasks/${task_id}/complete"
              payload: { passes_completed: 20 }
