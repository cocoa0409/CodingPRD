              payload: { client_id: "${client_id}", package_id: "${pkg_flat_id}", cart_id: "${cart_id}", travel_zone_id: "${zone1_id}", event_start: "2026-05-10T13:00:00Z", event_end: "2026-05-10T14:00:00Z", guest_count: 40, venue_provides_power: true, venue_provides_water: true, distance_km: 10 }
