          setup: ["excavator ex1 exists"]
          setup_api_calls:
            - { call: "POST /damage-recovery/excavators", payload: { company_name: "DigCo", contact_email: "d@x.com" }, as: RecoveryManager, captures: { ex1: $.data.id } }
          trigger:
            - { call: "GET /damage-recovery/excavators/${ex1}", payload: {}, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER and http status == 400"

