  # ---------------------------------------------------------------- rule 8
  - rule_id: resource_temporal_overlap
    instances:
      - name: slot_window_buffer_semantics
        grounds:
          - calculations.occupancy_window_conflict
          - errors[ERR_SLOT_WINDOW_CONFLICT]
        distinguishing_aspect: |
          Interval semantics = geometric buffer with depth coupling: overlap is
          allowed iff vertical gap >= 24in; below that, windows must be disjoint
          (half-open adjacency allowed) and deeper-first. Resource = TrenchSegment.
        test_recipe:
          setup:
            - "mobilized 2-party project; SEG-1 holds electric slot 36-60 window 09-01..09-03; SEG-2 holds electric slot 48-60 window 09-01..09-03"
          setup_api_calls:
            - { call: "POST /api/projects", payload: { name: "Overlap Project", rule20_credit_cents: 0, estimated_total_cost_cents: 1000000, target_cutover_on: "2026-12-31T00:00:00Z", contingency_days: 0 }, as: ProgramManager, captures: { proj: "$.data.id" } }
            - { call: "POST /api/participations", payload: { project_id: "${proj}", utility_name: "U1", utility_type: ELECTRIC, cost_share_bp: 7000, sequence_order: 1 }, as: ProgramManager, captures: { p1: "$.data.id" } }
            - { call: "POST /api/participations", payload: { project_id: "${proj}", utility_name: "U2", utility_type: TELECOM, cost_share_bp: 3000, sequence_order: 2 }, as: ProgramManager, captures: { p2: "$.data.id" } }
            - { call: "POST /api/participations/${p1}/transition", payload: { to: COMMITTED }, as: UtilityCoordinator, as_user_id: "${p1}" }
            - { call: "POST /api/participations/${p2}/transition", payload: { to: COMMITTED }, as: UtilityCoordinator, as_user_id: "${p2}" }
            - { call: "POST /api/projects/${proj}/lifecycle", payload: { action: MOBILIZE }, as: ProgramManager }
            - { call: "POST /api/trench-segments", payload: { project_id: "${proj}", segment_code: "SEG-1", length_ft: 100, max_depth_inches: 60 }, as: ProgramManager, captures: { seg1: "$.data.id", seg1_v: "$.data.version" } }
            - { call: "POST /api/trench-segments/${seg1}/schedule", payload: { excavation_start_on: "2026-09-01T00:00:00Z", excavation_end_on: "2026-09-10T00:00:00Z", expected_trench_segment_version: "${seg1_v}" }, as: ProgramManager }
            - { call: "POST /api/trench-segments", payload: { project_id: "${proj}", segment_code: "SEG-2", length_ft: 100, max_depth_inches: 60 }, as: ProgramManager, captures: { seg2: "$.data.id", seg2_v: "$.data.version" } }
            - { call: "POST /api/trench-segments/${seg2}/schedule", payload: { excavation_start_on: "2026-09-01T00:00:00Z", excavation_end_on: "2026-09-10T00:00:00Z", expected_trench_segment_version: "${seg2_v}" }, as: ProgramManager }
            - { call: "POST /api/occupancy-slots", payload: { trench_segment_id: "${seg1}", participation_id: "${p1}", depth_top_inches: 36, depth_bottom_inches: 60, install_start_at: "2026-09-01T00:00:00Z", install_end_at: "2026-09-03T00:00:00Z" }, as: UtilityCoordinator, as_user_id: "${p1}", captures: { s1_deep: "$.data.id" } }
            - { call: "POST /api/occupancy-slots", payload: { trench_segment_id: "${seg2}", participation_id: "${p1}", depth_top_inches: 48, depth_bottom_inches: 60, install_start_at: "2026-09-01T00:00:00Z", install_end_at: "2026-09-03T00:00:00Z" }, as: UtilityCoordinator, as_user_id: "${p1}", captures: { s2_deep: "$.data.id" } }
          trigger:
            - { call: "POST /api/occupancy-slots", payload: { trench_segment_id: "${seg1}", participation_id: "${p2}", depth_top_inches: 12, depth_bottom_inches: 24, install_start_at: "2026-09-02T00:00:00Z", install_end_at: "2026-09-04T00:00:00Z" }, as: UtilityCoordinator, as_user_id: "${p2}", captures: { err_overlap: "$.data.error_id" } }
            - { call: "POST /api/occupancy-slots", payload: { trench_segment_id: "${seg1}", participation_id: "${p2}", depth_top_inches: 12, depth_bottom_inches: 24, install_start_at: "2026-09-03T00:00:00Z", install_end_at: "2026-09-05T00:00:00Z" }, as: UtilityCoordinator, as_user_id: "${p2}", captures: { adj: "$.data.id" } }
            - { call: "POST /api/occupancy-slots", payload: { trench_segment_id: "${seg2}", participation_id: "${p2}", depth_top_inches: 12, depth_bottom_inches: 24, install_start_at: "2026-09-02T00:00:00Z", install_end_at: "2026-09-04T00:00:00Z" }, as: UtilityCoordinator, as_user_id: "${p2}", captures: { wide: "$.data.id" } }
          assert:
            - "err_overlap == ERR_SLOT_WINDOW_CONFLICT (gap 12 < 24 and windows overlap)"
            - "adj created (gap 12 < 24 but windows merely adjacent — half-open, deeper first — so allowed)"
            - "wide created (overlapping windows but gap exactly 24 >= 24 allows concurrency)"
      - name: outage_crew_aggregate_capacity
        grounds:
          - calculations.outage_crew_capacity
          - errors[ERR_CREW_CAPACITY_EXCEEDED]
        distinguishing_aspect: |
          Interval semantics = aggregate instantaneous count (distinct from the
          geometric buffer of the sibling): up to 2 overlapping active outages per
          feeder at any instant, half-open so back-to-back never counts. Resource
          = feeder crew. The third simultaneous window is rejected.
        test_recipe:
          setup:
            - "mobilized 2-party project; four PROPOSED outages on feeder F1: A 10:00-14:00, B 14:00-18:00 (back-to-back with A), C 13:00-15:00, D 13:30-14:30"
          setup_api_calls:
            - { call: "POST /api/projects", payload: { name: "Crew Project", rule20_credit_cents: 0, estimated_total_cost_cents: 1000000, target_cutover_on: "2026-12-31T00:00:00Z", contingency_days: 0 }, as: ProgramManager, captures: { proj: "$.data.id" } }
            - { call: "POST /api/participations", payload: { project_id: "${proj}", utility_name: "U1", utility_type: ELECTRIC, cost_share_bp: 7000, sequence_order: 1 }, as: ProgramManager, captures: { p1: "$.data.id" } }
            - { call: "POST /api/participations", payload: { project_id: "${proj}", utility_name: "U2", utility_type: TELECOM, cost_share_bp: 3000, sequence_order: 2 }, as: ProgramManager, captures: { p2: "$.data.id" } }
            - { call: "POST /api/participations/${p1}/transition", payload: { to: COMMITTED }, as: UtilityCoordinator, as_user_id: "${p1}" }
            - { call: "POST /api/participations/${p2}/transition", payload: { to: COMMITTED }, as: UtilityCoordinator, as_user_id: "${p2}" }
            - { call: "POST /api/projects/${proj}/lifecycle", payload: { action: MOBILIZE }, as: ProgramManager }
            - { call: "POST /api/outage-windows", payload: { project_id: "${proj}", feeder_id: "F1", start_at: "2026-09-05T10:00:00Z", end_at: "2026-09-05T14:00:00Z" }, as: ProgramManager, captures: { owA: "$.data.id" } }
            - { call: "POST /api/outage-windows", payload: { project_id: "${proj}", feeder_id: "F1", start_at: "2026-09-05T14:00:00Z", end_at: "2026-09-05T18:00:00Z" }, as: ProgramManager, captures: { owB: "$.data.id" } }
            - { call: "POST /api/outage-windows", payload: { project_id: "${proj}", feeder_id: "F1", start_at: "2026-09-05T13:00:00Z", end_at: "2026-09-05T15:00:00Z" }, as: ProgramManager, captures: { owC: "$.data.id" } }
            - { call: "POST /api/outage-windows", payload: { project_id: "${proj}", feeder_id: "F1", start_at: "2026-09-05T13:30:00Z", end_at: "2026-09-05T14:30:00Z" }, as: ProgramManager, captures: { owD: "$.data.id" } }
          trigger:
            - { call: "POST /api/outage-windows/${owA}/transition", payload: { to: APPROVED }, as: ProgramManager, captures: { stA: "$.data.status" } }
            - { call: "POST /api/outage-windows/${owB}/transition", payload: { to: APPROVED }, as: ProgramManager, captures: { stB: "$.data.status" } }
            - { call: "POST /api/outage-windows/${owC}/transition", payload: { to: APPROVED }, as: ProgramManager, captures: { stC: "$.data.status" } }
            - { call: "POST /api/outage-windows/${owD}/transition", payload: { to: APPROVED }, as: ProgramManager, captures: { errD: "$.data.error_id" } }
          assert:
            - "stA == APPROVED and stB == APPROVED (back-to-back at 14:00 does not overlap — half-open)"
            - "stC == APPROVED (at most 2 simultaneous with A during 13:00-14:00 — exactly at the limit)"
            - "errD == ERR_CREW_CAPACITY_EXCEEDED (during 13:30-14:00 A+C+D would be 3 > 2)"
  # ---------------------------------------------------------------- rule 9
  - rule_id: compensating_invariant
    instances:
      - name: allocated_share_conservation_on_withdrawal
        grounds:
          - calculations.provisional_cost_share
          - state_machines.UtilityParticipation.COMMITTED_to_WITHDRAWN
        distinguishing_aspect: |
          Conserved quantity = allocated provisional money: sum of
          provisional_share_cents over non-withdrawn participations ==
          project.estimated_total_cost_cents both before and after a withdrawal
          (withdraw + automatic rescale/recompute is the compensating pair).
