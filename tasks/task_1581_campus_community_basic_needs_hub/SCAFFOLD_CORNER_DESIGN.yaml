        distinguishing_aspect: "Allotment is recomputed from the CURRENTLY VERIFIED assessment: after spending 50 of 60 points (hh=4), verifying a superseding hh=1 assessment drops the allotment to 30, so a new 10-point checkout (settled 50 + 10 > 30) is rejected until the next week window."
        test_recipe:
          setup:
            - "ACTIVE client, first VERIFIED assessment hh=4 (allotment 60); PantryStaff; item cost 10 stock 10 limit 5"
            - "Clock Monday 2026-08-03T10:00:00Z; visit A completed with 5 units (50 points)"
            - "Second assessment hh=1 SUBMITTED and VERIFIED (supersedes the first) mid-week"
          setup_api_calls:
            - call: "POST /staff"
              payload: { full_name: "C Co", email: "coord@hub.test", staff_role: "INTAKE_COORDINATOR" }
              as: HubAdmin
              captures: { coord_id: $.data.id }
            - call: "POST /staff"
