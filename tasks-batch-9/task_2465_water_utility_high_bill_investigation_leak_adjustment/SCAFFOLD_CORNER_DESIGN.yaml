        distinguishing_aspect: |
          The baseline candidate set is filtered on three independent axes and then windowed to the
          three most recent survivors. With a DRAFT same-season bill and an ISSUED WINTER bill both
          present, the 2026-07 target finds only two qualifying samples, so
          seasonal_baseline_gallons is null with baseline_sample_count 2 and POST /investigations is
          refused. Issuing the DRAFT bill then lets a later 2026-08 target draw a full sample — and
          that sample is the three most RECENT survivors (41000, 4000, 4000 for a baseline of
          16333), with the oldest 2025-06 bill dropping out. An implementation that counts DRAFT
          bills, or admits the WINTER bill, or averages all four survivors, produces a different
          number at every step.
