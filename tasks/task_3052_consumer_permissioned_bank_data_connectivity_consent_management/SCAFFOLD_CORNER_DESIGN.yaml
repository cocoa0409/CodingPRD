          assert:
            - "rate_class == MEDIUM, units == 16 (4 jobs x FULL cost 4)"
            - "billable_units == 0 (16 <= FREE_UNITS_MEDIUM 20) and cost_cents == 0"

      - name: webhook_fanout_one_event_per_transaction_refresh
        claim_type: correct_result
        grounds:
          - calculations.webhook_fanout_count
          - state_machines.RefreshJob.QUEUED_to_SUCCEEDED
        distinguishing_aspect: "A successful refresh with new_transaction_count > 0 under a TRANSACTIONS consent emits exactly one TRANSACTIONS_AVAILABLE webhook whose payload carries the count; a refresh with new_transaction_count == 0 emits none."
        test_recipe:
          setup: ["ACTIVE connection under consent [TRANSACTIONS]; agreement permits TRANSACTIONS"]
          setup_api_calls:
            - call: "POST /institutions"
              payload: { name: "Webhook Bank", supported_methods: ["CREDENTIALS"], target_method: "CREDENTIALS", migration_window_start: "2026-09-10T00:00:00Z", migration_window_end: "2026-10-10T00:00:00Z" }
              as: PlatformAdmin
              captures: { inst_id: $.data.id, inst_v: $.data.version }
            - call: "POST /institutions/${inst_id}/agreements"
              payload: { rate_limit_per_hour: 100, permitted_fields_by_scope: { TRANSACTIONS: ["amount_cents", "posted_at"] }, expected_institution_version: "${inst_v}" }
              as: PlatformAdmin
            - call: "POST /recipients"
              payload: { name: "TxFeed", declared_use_case: "transaction feed", minimization_policy: "BROAD" }
              as: PlatformAdmin
              captures: { rec_id: $.data.id }
            - call: "POST /recipients/${rec_id}/review"
              payload: { decision: "APPROVE" }
              as: ComplianceReviewer
              as_user_id: reviewer_1
            - call: "POST /tiers"
              payload: { tier_name: "TxTier", scopes_included: ["TRANSACTIONS"], rate_class: "HIGH" }
              as: PlatformAdmin
              captures: { tier_id: $.data.id }
            - call: "POST /recipients/${rec_id}/tier_assignments"
              payload: { tier_id: "${tier_id}" }
              as: PlatformAdmin
            - call: "GET /recipients/${rec_id}"
              as: PlatformAdmin
              captures: { rec_id_v: $.data.version }
            - call: "POST /recipients/${rec_id}/consents"
              payload: { consumer_ref: "cons_z", data_scopes: ["TRANSACTIONS"], expires_at: "2026-12-31T00:00:00Z", expected_recipient_version: "${rec_id_v}" }
              as: Consumer
              as_user_id: cons_z
              captures: { consent_id: $.data.id }
            - call: "POST /institutions/${inst_id}/connections"
              payload: { consumer_ref: "cons_z", consent_id: "${consent_id}", method: "CREDENTIALS" }
              as: Consumer
              as_user_id: cons_z
              captures: { conn_id: $.data.id }
            - call: "POST /connections/${conn_id}/complete_auth"
              payload: {}
              as: Consumer
              as_user_id: cons_z
          trigger:
            - call: "POST /connections/${conn_id}/refresh"
              payload: { kind: "FULL", new_transaction_count: 7 }
              as: Consumer
              as_user_id: cons_z
            - call: "POST /connections/${conn_id}/refresh"
              payload: { kind: "FULL", new_transaction_count: 0 }
