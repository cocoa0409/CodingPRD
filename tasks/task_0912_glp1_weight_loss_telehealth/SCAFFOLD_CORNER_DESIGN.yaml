scaffold_corner_design:

  # =========================================================================
  # Entities
  # =========================================================================
  - section: entities
    instances:

      - name: patient_creation_returns_computed_bmi_and_defaults
        claim_type: creation
        grounds:
          - entities.Patient.fields.current_bmi
          - entities.Patient.fields.eligibility_status
          - endpoints[POST /glp1/patients]
        distinguishing_aspect: "POST /glp1/patients with all required fields returns 201, computes current_bmi 32.9 from 95.0 kg at 170 cm, and seeds eligibility_status NOT_SCREENED with both lifetime counters at 0."
        test_recipe:
          setup:
            - "Empty database; logical clock left at its 2026-05-01T00:00:00Z default."
          setup_api_calls:
            - call: "POST /glp1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /glp1/patients"
              payload: { email: "corner1@example.com", full_name: "Corner One", state_code: "CA", height_cm: 170, weight_kg: 95.0, payment_mode: "CASH", comorbidity_codes: ["HYPERTENSION"] }
              as: PlatformAdmin
              captures: { p_id: "$.data.id", p_v: "$.data.version" }
          assert:
            - "HTTP 201"
            - "Patient.${p_id}.current_bmi == 32.9"
            - "Patient.${p_id}.eligibility_status == NOT_SCREENED"
            - "Patient.${p_id}.lifetime_charged_cents == 0 and lifetime_credited_cents == 0"
            - "Patient.${p_id}.version == 1"

      - name: patient_retrieval_returns_stored_row
        claim_type: retrieval
        grounds:
          - endpoints[GET /glp1/patients/{patient_id}]
          - entities.Patient.fields.weight_kg
        distinguishing_aspect: "GET /glp1/patients/{patient_id} returns exactly the row created, including the weight recorded by the most recent vitals update."
        test_recipe:
          setup:
            - "One patient created at 170 cm and 95.0 kg, then updated to 90.0 kg."
          setup_api_calls:
            - call: "POST /glp1/patients"
              payload: { email: "corner2@example.com", full_name: "Corner Two", state_code: "CA", height_cm: 170, weight_kg: 95.0, payment_mode: "CASH", comorbidity_codes: [] }
              as: PlatformAdmin
              captures: { p_id: "$.data.id" }
            - call: "PATCH /glp1/patients/${p_id}/vitals"
              payload: { weight_kg: 90.0 }
              as: Patient
              as_user_id: "${p_id}"
          trigger:
            - call: "GET /glp1/patients/${p_id}"
              payload: {}
              as: PlatformAdmin
              captures: { got_bmi: "$.data.current_bmi" }
          assert:
            - "HTTP 200"
            - "Patient.${p_id}.weight_kg == 90.0"
            - "Patient.${p_id}.current_bmi == 31.1"
            - "Patient.${p_id}.version == 2"

      - name: supply_lot_listing_paginates_with_total_count
        claim_type: listing
        grounds:
          - endpoints[GET /glp1/supply-lots]
          - entities.SupplyLot.fields.pharmacy_id
        distinguishing_aspect: "GET /glp1/supply-lots filtered to one pharmacy with limit 2 and offset 0 returns 2 rows, total_count 3 and has_more true."
        test_recipe:
          setup:
            - "One COMPOUNDED pharmacy serving CA holds three RELEASED lots."
          setup_api_calls:
            - call: "POST /glp1/pharmacies"
              payload: { name: "Bay Compounding", dispense_type: "COMPOUNDED", served_state_codes: ["CA"], status: "ACTIVE" }
              as: PlatformAdmin
              captures: { ph_id: "$.data.id" }
            - call: "POST /glp1/supply-lots"
              payload: { pharmacy_id: "${ph_id}", lot_code: "P-1", strength_mg: 0.25, total_units: 10, window_capacity_units: 6, expires_at: "2026-12-31T00:00:00Z", status: "RELEASED" }
              as: PlatformAdmin
            - call: "POST /glp1/supply-lots"
              payload: { pharmacy_id: "${ph_id}", lot_code: "P-2", strength_mg: 0.5, total_units: 10, window_capacity_units: 6, expires_at: "2026-12-31T00:00:00Z", status: "RELEASED" }
              as: PlatformAdmin
            - call: "POST /glp1/supply-lots"
              payload: { pharmacy_id: "${ph_id}", lot_code: "P-3", strength_mg: 1.0, total_units: 10, window_capacity_units: 6, expires_at: "2026-12-31T00:00:00Z", status: "RELEASED" }
              as: PlatformAdmin
          trigger:
            - call: "GET /glp1/supply-lots"
              payload: { pharmacy_id: "${ph_id}", limit: 2, offset: 0 }
              as: PlatformAdmin
              captures: { first_lot: "$.data[0].id" }
          assert:
            - "HTTP 200 and response_type == array"
            - "meta pagination reports total_count == 3, limit == 2, offset == 0 and has_more == true"
            - "exactly 2 SupplyLot rows are returned"

      - name: patient_not_found_returns_404
        claim_type: not_found
        grounds:
          - errors[ERR_PATIENT_NOT_FOUND]
          - validations[priority=3]
        distinguishing_aspect: "GET /glp1/patients/{patient_id} with a well-formed but unknown UUID returns ERR_PATIENT_NOT_FOUND with HTTP 404."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls:
            - call: "POST /glp1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "GET /glp1/patients/11111111-2222-3333-4444-555555555555"
              payload: {}
              as: PlatformAdmin
              captures: { err: "$.data.error_id" }
          assert:
            - "HTTP 404 with error_id ERR_PATIENT_NOT_FOUND"
            - "response_type == error"

      - name: prescription_missing_required_field_returns_validation
        claim_type: required_fields
        grounds:
          - validations[priority=5]
          - errors[ERR_VALIDATION]
          - endpoints[POST /glp1/prescriptions]
        distinguishing_aspect: "POST /glp1/prescriptions without drug_family is refused with ERR_VALIDATION and HTTP 400 before any state or eligibility rule is consulted."
        test_recipe:
          setup:
            - "Clock 2026-06-01T00:00:00Z; a patient, a CA clinician, an ELIGIBLE screening and a completed PRESCRIBE consult all exist."
          setup_api_calls:
            - call: "POST /glp1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /glp1/patients"
              payload: { email: "corner5@example.com", full_name: "Corner Five", state_code: "CA", height_cm: 170, weight_kg: 95.0, payment_mode: "CASH", comorbidity_codes: [] }
              as: PlatformAdmin
              captures: { p_id: "$.data.id" }
            - call: "POST /glp1/providers"
              payload: { full_name: "Dr Nia Cole", provider_type: "CLINICIAN", licensed_state_codes: ["CA"], npi: "1710010001" }
              as: PlatformAdmin
              captures: { d_id: "$.data.id" }
            - call: "POST /glp1/screenings"
              payload: { patient_id: "${p_id}", recorded_weight_kg: 95.0, egfr: 88.0, lab_collected_at: "2026-05-20T00:00:00Z" }
              as: Provider
              as_user_id: "${d_id}"
              captures: { s_id: "$.data.id" }
            - call: "POST /glp1/screenings/${s_id}/submit"
              payload: {}
              as: Provider
              as_user_id: "${d_id}"
            - call: "POST /glp1/consults"
              payload: { patient_id: "${p_id}", provider_id: "${d_id}", scheduled_start_at: "2026-06-02T15:00:00Z", scheduled_end_at: "2026-06-02T15:30:00Z" }
              as: Patient
              as_user_id: "${p_id}"
              captures: { c_id: "$.data.id" }
            - call: "POST /glp1/consults/${c_id}/complete"
              payload: { outcome: "PRESCRIBE" }
              as: Provider
              as_user_id: "${d_id}"
            - call: "GET /glp1/patients/${p_id}"
              payload: {}
              as: PlatformAdmin
              captures: { p_v: "$.data.version" }
          trigger:
            - call: "POST /glp1/prescriptions"
              payload: { patient_id: "${p_id}", consult_id: "${c_id}", prescriber_provider_id: "${d_id}", screening_id: "${s_id}", units_per_cycle: 2, expected_patient_version: "${p_v}" }
              as: Provider
              as_user_id: "${d_id}"
              captures: { err: "$.data.error_id" }
          assert:
            - "HTTP 400 with error_id ERR_VALIDATION"
            - "GET /glp1/prescriptions with patient_id ${p_id} returns total_count == 0"

      - name: prescription_units_per_cycle_defaults_to_four
        claim_type: defaults
        grounds:
          - entities.Prescription.fields.units_per_cycle
          - endpoints[POST /glp1/prescriptions]
        distinguishing_aspect: "Omitting units_per_cycle on POST /glp1/prescriptions applies the declared default of 4 rather than leaving it null."
        test_recipe:
          setup:
            - "Clock 2026-06-01T00:00:00Z; a CA patient with an ELIGIBLE screening and a completed PRESCRIBE consult."
          setup_api_calls:
            - call: "POST /glp1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /glp1/patients"
              payload: { email: "corner6@example.com", full_name: "Corner Six", state_code: "CA", height_cm: 170, weight_kg: 95.0, payment_mode: "CASH", comorbidity_codes: [] }
              as: PlatformAdmin
              captures: { p_id: "$.data.id" }
            - call: "POST /glp1/providers"
              payload: { full_name: "Dr Nia Cole", provider_type: "CLINICIAN", licensed_state_codes: ["CA"], npi: "1710010002" }
              as: PlatformAdmin
              captures: { d_id: "$.data.id" }
            - call: "POST /glp1/screenings"
              payload: { patient_id: "${p_id}", recorded_weight_kg: 95.0, egfr: 88.0, lab_collected_at: "2026-05-20T00:00:00Z" }
              as: Provider
              as_user_id: "${d_id}"
              captures: { s_id: "$.data.id" }
            - call: "POST /glp1/screenings/${s_id}/submit"
              payload: {}
              as: Provider
              as_user_id: "${d_id}"
            - call: "POST /glp1/consults"
              payload: { patient_id: "${p_id}", provider_id: "${d_id}", scheduled_start_at: "2026-06-02T15:00:00Z", scheduled_end_at: "2026-06-02T15:30:00Z" }
              as: Patient
              as_user_id: "${p_id}"
              captures: { c_id: "$.data.id" }
            - call: "POST /glp1/consults/${c_id}/complete"
              payload: { outcome: "PRESCRIBE" }
              as: Provider
              as_user_id: "${d_id}"
            - call: "GET /glp1/patients/${p_id}"
              payload: {}
              as: PlatformAdmin
              captures: { p_v: "$.data.version" }
          trigger:
            - call: "POST /glp1/prescriptions"
              payload: { patient_id: "${p_id}", consult_id: "${c_id}", prescriber_provider_id: "${d_id}", screening_id: "${s_id}", drug_family: "TIRZEPATIDE", expected_patient_version: "${p_v}" }
              as: Provider
              as_user_id: "${d_id}"
              captures: { rx_id: "$.data.id" }
          assert:
            - "HTTP 201"
            - "Prescription.${rx_id}.units_per_cycle == 4"
            - "Prescription.${rx_id}.dose_level == 1 and Prescription.${rx_id}.dose_mg == 2.5"
            - "Prescription.${rx_id}.clinical_status == ACTIVE and fulfillment_status == UNROUTED"
            - "Prescription.${rx_id}.active_route_mode == CASH, seeded from Patient.payment_mode"
            - "Prescription.${rx_id}.supersedes_prescription_id is null"

      - name: supply_lot_available_units_initialised_from_total_units
        claim_type: computed_fields
        grounds:
          - entities.SupplyLot.fields.available_units
          - invariants[INV-1]
        distinguishing_aspect: "A newly created SupplyLot reports available_units equal to total_units with reserved_units and dispensed_units both 0, establishing INV-1 at birth."
        test_recipe:
          setup:
            - "One COMPOUNDED pharmacy serving CA."
          setup_api_calls:
            - call: "POST /glp1/pharmacies"
              payload: { name: "Bay Compounding", dispense_type: "COMPOUNDED", served_state_codes: ["CA"], status: "ACTIVE" }
              as: PlatformAdmin
              captures: { ph_id: "$.data.id" }
          trigger:
            - call: "POST /glp1/supply-lots"
              payload: { pharmacy_id: "${ph_id}", lot_code: "P-9", strength_mg: 0.25, total_units: 18, window_capacity_units: 6, expires_at: "2026-12-31T00:00:00Z", status: "RELEASED" }
              as: PlatformAdmin
              captures: { lot_id: "$.data.id" }
          assert:
            - "HTTP 201"
            - "SupplyLot.${lot_id}.available_units == 18 and reserved_units == 0 and dispensed_units == 0"
            - "SupplyLot.${lot_id}.total_units == 18"

      - name: check_in_nausea_score_out_of_range_rejected
        claim_type: type_constraints
        grounds:
          - validations[priority=5]
          - errors[ERR_VALIDATION]
          - entities.CheckIn.fields.nausea_score
        distinguishing_aspect: "POST /glp1/check-ins with nausea_score 4 is refused with ERR_VALIDATION and HTTP 400 because the declared range is 0 to 3 inclusive."
        test_recipe:
          setup:
            - "Clock 2026-06-01T00:00:00Z; a CA patient with an ACTIVE dose_level 1 prescription."
          setup_api_calls:
            - call: "POST /glp1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /glp1/patients"
              payload: { email: "corner8@example.com", full_name: "Corner Eight", state_code: "CA", height_cm: 170, weight_kg: 95.0, payment_mode: "CASH", comorbidity_codes: [] }
              as: PlatformAdmin
              captures: { p_id: "$.data.id" }
            - call: "POST /glp1/providers"
              payload: { full_name: "Dr Nia Cole", provider_type: "CLINICIAN", licensed_state_codes: ["CA"], npi: "1710010003" }
              as: PlatformAdmin
              captures: { d_id: "$.data.id" }
            - call: "POST /glp1/screenings"
              payload: { patient_id: "${p_id}", recorded_weight_kg: 95.0, egfr: 88.0, lab_collected_at: "2026-05-20T00:00:00Z" }
              as: Provider
              as_user_id: "${d_id}"
              captures: { s_id: "$.data.id" }
            - call: "POST /glp1/screenings/${s_id}/submit"
              payload: {}
              as: Provider
              as_user_id: "${d_id}"
            - call: "POST /glp1/consults"
              payload: { patient_id: "${p_id}", provider_id: "${d_id}", scheduled_start_at: "2026-06-02T15:00:00Z", scheduled_end_at: "2026-06-02T15:30:00Z" }
              as: Patient
              as_user_id: "${p_id}"
              captures: { c_id: "$.data.id" }
            - call: "POST /glp1/consults/${c_id}/complete"
              payload: { outcome: "PRESCRIBE" }
              as: Provider
              as_user_id: "${d_id}"
            - call: "GET /glp1/patients/${p_id}"
              payload: {}
              as: PlatformAdmin
              captures: { p_v: "$.data.version" }
            - call: "POST /glp1/prescriptions"
              payload: { patient_id: "${p_id}", consult_id: "${c_id}", prescriber_provider_id: "${d_id}", screening_id: "${s_id}", drug_family: "SEMAGLUTIDE", units_per_cycle: 2, expected_patient_version: "${p_v}" }
              as: Provider
              as_user_id: "${d_id}"
              captures: { rx_id: "$.data.id" }
          trigger:
            - call: "POST /glp1/check-ins"
              payload: { patient_id: "${p_id}", prescription_id: "${rx_id}", nausea_score: 4, vomiting_score: 0, dehydration_flag: false }
              as: Patient
              as_user_id: "${p_id}"
              captures: { err: "$.data.error_id" }
          assert:
            - "HTTP 400 with error_id ERR_VALIDATION"
            - "GET /glp1/check-ins with prescription_id ${rx_id} returns total_count == 0"

      - name: clinician_without_npi_rejected
        claim_type: type_constraints
        grounds:
          - validations[priority=5]
          - errors[ERR_VALIDATION]
          - entities.Provider.fields.npi
        distinguishing_aspect: "POST /glp1/providers with provider_type CLINICIAN and no npi is refused with ERR_VALIDATION, while the identical body with provider_type COACH is accepted."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls:
            - call: "POST /glp1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /glp1/providers"
              payload: { full_name: "Dr No Npi", provider_type: "CLINICIAN", licensed_state_codes: ["CA"] }
              as: PlatformAdmin
              captures: { err: "$.data.error_id" }
            - call: "POST /glp1/providers"
              payload: { full_name: "Coach No Npi", provider_type: "COACH", licensed_state_codes: ["CA"] }
              as: PlatformAdmin
              captures: { coach_id: "$.data.id" }
          assert:
            - "the CLINICIAN call returns HTTP 400 with error_id ERR_VALIDATION"
            - "the COACH call returns HTTP 201 and Provider.${coach_id}.provider_type == COACH"
            - "Provider.${coach_id}.status == ACTIVE by default"

      - name: supply_lot_parent_pharmacy_not_found_returns_404
        claim_type: parent_relationships
        grounds:
          - validations[priority=6]
          - errors[ERR_PHARMACY_RESOURCE_NOT_FOUND]
          - entities.SupplyLot.fields.pharmacy_id
        distinguishing_aspect: "POST /glp1/supply-lots citing an unknown pharmacy_id is refused with ERR_PHARMACY_RESOURCE_NOT_FOUND and HTTP 404, proving body foreign keys are resolved before the row is written."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls:
            - call: "POST /glp1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /glp1/supply-lots"
              payload: { pharmacy_id: "99999999-8888-7777-6666-555555555555", lot_code: "GHOST", strength_mg: 0.25, total_units: 5, window_capacity_units: 5, expires_at: "2026-12-31T00:00:00Z", status: "RELEASED" }
              as: PlatformAdmin
              captures: { err: "$.data.error_id" }
          assert:
            - "HTTP 404 with error_id ERR_PHARMACY_RESOURCE_NOT_FOUND"
            - "GET /glp1/supply-lots returns total_count == 0"

  # =========================================================================
  # State machines
  # =========================================================================
  - section: state_machines
    instances:

      - name: screening_starts_in_draft_and_defers_on_stale_labs_then_requalifies
        claim_type: cyclic
        grounds:
          - state_machines.EligibilityScreening.DRAFT_to_DEFERRED
          - state_machines.EligibilityScreening.DEFERRED_to_ELIGIBLE
          - entities.EligibilityScreening.fields.submit_count
          - calculations.eligibility_bmi_assessment
        distinguishing_aspect: "A screening created with labs collected 2026-01-01 lands in DRAFT, submits to DEFERRED with decision_reason STALE_LABS at 151 days of lab age, and requalifies to ELIGIBLE on resubmission with fresh labs, leaving submit_count at 2."
        test_recipe:
          setup:
            - "Clock 2026-06-01T00:00:00Z; CA patient at 170 cm and 95.0 kg; a CA-licensed clinician."
            - "A screening opened with egfr 88.0 and labs collected 2026-01-01, which is 151 days old."
          setup_api_calls:
            - call: "POST /glp1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /glp1/patients"
              payload: { email: "sm1@example.com", full_name: "Sm One", state_code: "CA", height_cm: 170, weight_kg: 95.0, payment_mode: "CASH", comorbidity_codes: [] }
              as: PlatformAdmin
              captures: { p_id: "$.data.id" }
            - call: "POST /glp1/providers"
              payload: { full_name: "Dr Nia Cole", provider_type: "CLINICIAN", licensed_state_codes: ["CA"], npi: "1710011001" }
              as: PlatformAdmin
              captures: { d_id: "$.data.id" }
            - call: "POST /glp1/screenings"
              payload: { patient_id: "${p_id}", recorded_weight_kg: 95.0, egfr: 88.0, lab_collected_at: "2026-01-01T00:00:00Z" }
              as: Provider
              as_user_id: "${d_id}"
              captures: { s_id: "$.data.id", s_status: "$.data.status" }
          trigger:
            - call: "POST /glp1/screenings/${s_id}/submit"
              payload: {}
              as: Provider
              as_user_id: "${d_id}"
            - call: "POST /glp1/screenings/${s_id}/submit"
              payload: { recorded_weight_kg: 95.0, egfr: 88.0, lab_collected_at: "2026-05-25T00:00:00Z" }
              as: Provider
              as_user_id: "${d_id}"
          assert:
            - "the screening was created with status DRAFT and submit_count 0"
            - "after the first submit, EligibilityScreening.${s_id}.status == DEFERRED and decision_reason == STALE_LABS and assessed_bmi is null and submit_count == 1"
            - "Patient.${p_id}.eligibility_status == DEFERRED at that point"
            - "after the second submit, EligibilityScreening.${s_id}.status == ELIGIBLE and decision_reason == BMI_QUALIFIED and assessed_bmi == 32.9 and submit_count == 2"
            - "Patient.${p_id}.eligibility_status == ELIGIBLE"

      - name: consult_no_show_then_reschedule_returns_to_scheduled
        claim_type: cyclic
        grounds:
          - state_machines.Consult.SCHEDULED_to_NO_SHOW
          - state_machines.Consult.NO_SHOW_to_SCHEDULED
          - entities.Consult.fields.reschedule_count
        distinguishing_aspect: "Completing a consult with outcome NO_SHOW and then rescheduling it returns status to SCHEDULED with reschedule_count 1, and the vacated window becomes bookable again."
        test_recipe:
          setup:
            - "Clock 2026-06-01T00:00:00Z; a CA patient and a CA-licensed clinician with one SCHEDULED consult on 2026-06-03 from 15:00 to 15:30."
          setup_api_calls:
            - call: "POST /glp1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /glp1/patients"
              payload: { email: "sm2@example.com", full_name: "Sm Two", state_code: "CA", height_cm: 170, weight_kg: 95.0, payment_mode: "CASH", comorbidity_codes: [] }
              as: PlatformAdmin
              captures: { p_id: "$.data.id" }
            - call: "POST /glp1/providers"
              payload: { full_name: "Dr Nia Cole", provider_type: "CLINICIAN", licensed_state_codes: ["CA"], npi: "1710011002" }
              as: PlatformAdmin
              captures: { d_id: "$.data.id" }
            - call: "POST /glp1/consults"
              payload: { patient_id: "${p_id}", provider_id: "${d_id}", scheduled_start_at: "2026-06-03T15:00:00Z", scheduled_end_at: "2026-06-03T15:30:00Z" }
              as: Patient
              as_user_id: "${p_id}"
              captures: { c_id: "$.data.id" }
          trigger:
            - call: "POST /glp1/consults/${c_id}/complete"
              payload: { outcome: "NO_SHOW" }
              as: Provider
              as_user_id: "${d_id}"
            - call: "POST /glp1/consults/${c_id}/reschedule"
              payload: { scheduled_start_at: "2026-06-04T15:00:00Z", scheduled_end_at: "2026-06-04T15:30:00Z" }
              as: Patient
              as_user_id: "${p_id}"
          assert:
            - "after the complete, Consult.${c_id}.status == NO_SHOW"
            - "after the reschedule, Consult.${c_id}.status == SCHEDULED and reschedule_count == 1"
