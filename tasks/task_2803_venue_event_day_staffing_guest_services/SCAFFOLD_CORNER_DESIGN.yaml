      - name: reliability_score_clamped_at_the_floor_of_zero
        claim_type: precision
        grounds:
          - calculations.staff_member_reliability_score
          - state_machines.StaffAssignment.SCHEDULED_to_NO_SHOW
          - state_machines.StaffMember.ACTIVE_to_PROBATION
        distinguishing_aspect: >-
          Five NO_SHOW rows give a raw season score of 100 - 125 = -25 which is stored as the clamped
          0, while the 3-row rolling window sees only three of them and stores 25 - so the two
          variants of the same formula land on different sides of the clamp and the member's five
          strikes are all visible in no_show_strikes.
        test_recipe:
          setup:
            - "Clock at 2026-09-12T08:00:00Z."
            - "One IN_PROGRESS Event with five TICKET_TAKER slots (no required certifications) at 08:00-09:00, 10:00-11:00, 12:00-13:00, 14:00-15:00 and 16:00-17:00Z, each with required_headcount_override 1 - every gap exceeds the 30-minute rest buffer."
            - "One ACTIVE PART_TIME_EMPLOYEE member assigned to all five slots while still ACTIVE."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
