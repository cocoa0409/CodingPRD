      - name: corner_downtime_summary_reads_the_ledger_before_and_after_deenergization
        claim_type: computed_read
        grounds:
          - endpoints["GET /reroof/projects/{id}/downtime-summary"]
          - calculations.downtime_production_loss_credit
          - state_machines.ReroofProject.transitions["AUTHORIZED -> DEENERGIZED"]
        distinguishing_aspect: "The summary is a pure projection with no stored copy: on a merely authorized project every credit figure is 0 and ledger_balanced is trivially true, and the single de-energization call is what materialises 41.75 - here 33.6 kWh * 5 days * 14 cents * 0.85 = 1999.2 rounded to 1999 - into provisional, authorized and reserved simultaneously, while settled and released stay 0 and downtime_days_actual stays 0 until re-energization."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "A PPA project with baseline_daily_kwh 33.6 and downtime_days_estimated 5 collects all three consents, so it is AUTHORIZED with one ENERGIZED circuit."
          setup_api_calls:
            - call: "POST /reroof/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProjectCoordinator
            - call: "POST /reroof/parties"
              payload: { name: "Ridgeline Roofing", party_type: "ROOFER", contact_email: "ops@ridgeline.example" }
