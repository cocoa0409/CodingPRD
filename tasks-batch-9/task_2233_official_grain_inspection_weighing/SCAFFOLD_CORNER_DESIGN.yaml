              captures: { insp: "$.data.id" }
            - call: POST /grain-inspection/equipment
              as: ServiceAdmin
              payload: { service_area_id: "${a1}", equipment_kind: "SAMPLING_DEVICE", asset_code: "PROBE-DUP", model: "Diverter D2" }
              captures: { probe: "$.data.id" }
            - call: POST /grain-inspection/equipment/${probe}/certify
              as: ServiceAdmin
              payload: { certified_until: "2027-01-01T00:00:00Z" }
            - call: POST /grain-inspection/inspection-requests
              as: ServiceAdmin
              payload: { applicant_id: "${app}", service_area_id: "${a1}", commodity: "CORN", point_of_service: "UNLOADING", lot_identifier: "LOT-DUP-1", declared_quantity_bushels: 900, requested_services: ["GRADING"] }
              captures: { req1: "$.data.id" }
            - call: POST /grain-inspection/inspection-requests
              as: ServiceAdmin
              payload: { applicant_id: "${app}", service_area_id: "${a1}", commodity: "CORN", point_of_service: "UNLOADING", lot_identifier: "LOT-DUP-2", declared_quantity_bushels: 900, requested_services: ["GRADING"] }
              captures: { req2: "$.data.id" }
            - call: POST /grain-inspection/samples
              as: LicensedInspector
              payload: { inspection_request_id: "${req1}", sampling_device_id: "${probe}", inspector_id: "${insp}", seal_number: "SEAL-DUP", portions_count: 2 }
              captures: { smp1: "$.data.id" }
          trigger:
            - call: POST /grain-inspection/samples
              as: LicensedInspector
              payload: { inspection_request_id: "${req1}", sampling_device_id: "${probe}", inspector_id: "${insp}", sample_type: "FILE", seal_number: "SEAL-DUP", portions_count: 2 }
              captures: { err: "$.data.error_id" }
          assert:
            - "422 ERR_DUPLICATE_IDENTIFIER: seal_number is unique within inspection_request_id (the FILE sample_type keeps the grading_status transition out of the way, isolating the uniqueness check)"
            - "The identical body against ${req2} -> 201, proving the scope is the request and not the collection"
            - "A second applicant with account_code DUP-100 -> 422 ERR_DUPLICATE_IDENTIFIER (global scope)"
            - "A second inspector with license_number L-DUP in ${a1} -> 422 ERR_DUPLICATE_IDENTIFIER, while the same license_number in ${a2} -> 201"
            - "A second SAMPLING_DEVICE with asset_code PROBE-DUP in ${a1} -> 422 ERR_DUPLICATE_IDENTIFIER, while the same asset_code in ${a2} -> 201"
            - "GET /grain-inspection/samples?inspection_request_id=${req1} -> total_count 1 after the refusal"

      - name: draft_gross_weights_are_checked_against_capacity_in_aggregate
        claim_type: aggregate_validation
        grounds:
          - "validations[priority=11]"
          - "errors[ERR_SCALE_CAPACITY_EXCEEDED]"
          - "entities.WeighingRecord.fields.drafts"
          - "entities.Equipment.fields.capacity_lbs"
        distinguishing_aspect: "Each individual draft is comfortably inside the 100000 lb scale capacity; only their sum is not, and the same code also covers the per-draft sanity rule gross_lbs > tare_lbs, so one error spans an aggregate and an element-wise condition."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-03T09:00:00Z."
            - "A DELEGATED area with supervision_required false and a certified SCALE of capacity_lbs 100000 and tolerance_lbs 20.0."
            - "A CORN request with GRADING and WEIGHING requested and an inspector holding WEIGHING."
          setup_api_calls:
            - call: POST /_clock/set_current_utc
              as: ServiceAdmin
              payload: { current_utc: "2026-08-03T09:00:00Z" }
            - call: POST /grain-inspection/service-areas
              as: ServiceAdmin
              payload: { name: "Plains Delegated Office", state_code: "KS", authority_type: "DELEGATED", supervision_required: false }
