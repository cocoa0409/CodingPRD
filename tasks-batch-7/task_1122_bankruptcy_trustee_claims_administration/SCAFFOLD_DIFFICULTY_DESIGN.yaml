scaffold_difficulty_design:
  # =====================================================================
  # Rule 1 — dual_variant_calc: same data, two valid algorithms, different
  # numbers; the two instances MUST live in different entity domains.
  # =====================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: trustee_commission_disbursed_vs_proposed_basis
        grounds:
          - calculations.trustee_commission_326
          - entities.FeeApplication.fields.commission_basis
        distinguishing_aspect: |
          Entity domain = FeeApplication/trustee compensation. Identical case
          ledger (one CONFIRMED plan allocating 6,000,000 cents; exactly one
          POSTED dividend of 2,000,000, the other dividend still COMPUTED)
          yields commission 275,000 on DISBURSED basis (B = posted dividends +
          paid professional fees = 2,000,000) vs 625,000 on PROPOSED basis
          (B = plan allocated 6,000,000) — same data, two valid algorithms,
          different results.
        test_recipe:
          setup:
            - "Case in DISTRIBUTION with a CONFIRMED plan whose PlanClassAllocation total is 6,000,000 cents (two ALLOWED GENERAL_UNSECURED claims 4,000,000 + 2,000,000; cash 6,000,000 covers fully)"
            - "Exactly one POSTED dividend of 2,000,000 cents (the second claim's; the 4,000,000 dividend still COMPUTED)"
            - "No PAID professional fees"
          setup_api_calls:
            - call: "POST /trustee/creditors"
              payload: { legal_name: "Creditor A", creditor_ref: "CR-A-1", contact_email: "a@x.com" }
              as: Clerk
              captures: { cred_a: $.data.id }
            - call: "POST /trustee/cases"
              payload: { case_number: "26-10001", debtor_name: "Debtor One", filed_on: "2026-01-15T00:00:00Z", district: "D.Del.", trustee_user_id: "trust-0001", objection_window_days: 2 }
              as: Clerk
              captures: { case_id: $.data.id }
            - call: "POST /trustee/cases/${case_id}/assets"
              payload: { description: "Warehouse", scheduled_value_cents: 9000000 }
              as: Trustee
              as_user_id: "trust-0001"
              captures: { asset_id: $.data.id }
            - call: "POST /trustee/cases/${case_id}/begin_investigation"
              payload: {}
              as: Trustee
              as_user_id: "trust-0001"
            - call: "POST /trustee/cases/${case_id}/set_bar_date"
              payload: { bar_date: "2026-06-01T00:00:00Z" }
              as: Clerk
            - call: "POST /trustee/cases/${case_id}/claims"
              payload: { creditor_id: "${cred_a}", received_at: "2026-02-01T00:00:00Z", filed_amount_cents: 4000000, priority_class: "GENERAL_UNSECURED" }
              as: Creditor
              as_user_id: "${cred_a}"
              captures: { claim_a: $.data.id }
            - call: "POST /trustee/cases/${case_id}/claims"
              payload: { creditor_id: "${cred_a}", received_at: "2026-02-01T01:00:00Z", filed_amount_cents: 2000000, priority_class: "GENERAL_UNSECURED" }
              as: Creditor
              as_user_id: "${cred_a}"
              captures: { claim_b: $.data.id }
            - call: "POST /trustee/claims/${claim_a}/review"
              payload: {}
              as: Trustee
              as_user_id: "trust-0001"
            - call: "POST /trustee/claims/${claim_a}/allow"
              payload: {}
              as: Trustee
              as_user_id: "trust-0001"
            - call: "POST /trustee/claims/${claim_b}/review"
              payload: {}
              as: Trustee
              as_user_id: "trust-0001"
            - call: "POST /trustee/claims/${claim_b}/allow"
              payload: {}
              as: Trustee
              as_user_id: "trust-0001"
            - call: "POST /trustee/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-02T00:00:00Z" }
              as: Court
            - call: "POST /trustee/cases/${case_id}/begin_liquidation"
              payload: {}
              as: Trustee
              as_user_id: "trust-0001"
            - call: "POST /trustee/assets/${asset_id}/mark_for_sale"
              payload: {}
              as: Trustee
              as_user_id: "trust-0001"
            - call: "POST /trustee/cases/${case_id}/sales"
              payload: { asset_id: "${asset_id}", buyer_name: "BuyerCo", hammer_price_cents: 6000000, sale_costs_cents: 0 }
              as: Trustee
              as_user_id: "trust-0001"
              captures: { sale_id: $.data.id }
            - call: "POST /trustee/sales/${sale_id}/approve"
              payload: {}
              as: Court
            - call: "POST /trustee/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-05T00:00:00Z" }
              as: Court
            - call: "POST /trustee/sales/${sale_id}/consummate"
              payload: {}
              as: Trustee
              as_user_id: "trust-0001"
            - call: "POST /trustee/cases/${case_id}/begin_distribution"
              payload: {}
              as: Trustee
              as_user_id: "trust-0001"
            - call: "POST /trustee/cases/${case_id}/plans"
              payload: {}
              as: Trustee
              as_user_id: "trust-0001"
              captures: { plan_id: $.data.id }
            - call: "GET /trustee/cases/${case_id}"
              payload: {}
              as: Trustee
              as_user_id: "trust-0001"
              captures: { case_v2: $.data.version }
            - call: "POST /trustee/plans/${plan_id}/confirm"
              payload: { expected_case_version: "${case_v2}" }
              as: Court
            - call: "GET /trustee/plans/${plan_id}/dividends"
              payload: {}
              as: Trustee
              as_user_id: "trust-0001"
              captures: { div_b: "$.data[1].id" }
            - call: "POST /trustee/dividends/${div_b}/post"
              payload: {}
              as: Trustee
              as_user_id: "trust-0001"
            - call: "GET /trustee/cases/${case_id}"
              payload: {}
              as: Trustee
              as_user_id: "trust-0001"
              captures: { case_v3: $.data.version }
          trigger:
            - call: "POST /trustee/cases/${case_id}/fee_applications"
              payload: { applicant_role: "TRUSTEE", requested_amount_cents: 999999999, commission_basis: "DISBURSED", expected_case_version: "${case_v3}" }
              as: Trustee
              as_user_id: "trust-0001"
              captures: { fee_disb: $.data.id, fee_disb_amt: $.data.computed_commission_cents }
            - call: "GET /trustee/cases/${case_id}"
              payload: {}
              as: Trustee
              as_user_id: "trust-0001"
              captures: { case_v4: $.data.version }
            - call: "POST /trustee/cases/${case_id}/fee_applications"
              payload: { applicant_role: "TRUSTEE", requested_amount_cents: 999999999, commission_basis: "PROPOSED", expected_case_version: "${case_v4}" }
              as: Trustee
              as_user_id: "trust-0001"
              captures: { fee_prop_amt: $.data.computed_commission_cents }
          assert:
            - "FeeApplication.${fee_disb}.computed_commission_cents == 275000  # 326 commission on DISBURSED basis B=2,000,000 (one posted dividend)"
            - "fee_prop_amt == 625000  # 326 commission on PROPOSED basis B=6,000,000 (plan allocation)"
            - "fee_prop_amt != fee_disb_amt"

      - name: claim_late_flag_timely_vs_late_same_instant_boundary
        grounds:
          - calculations.claim_late_determination
          - entities.Claim.fields.late
        distinguishing_aspect: |
          Entity domain = Claim (claims register), not compensation. Two valid
          readings of the bar-date rule — inclusive-of-bar-date vs strictly-
          after-bar-date — produce different `late` booleans for a claim whose
          received_at equals claim_bar_date exactly; the scaffold pins strictly-
          greater, so the equal-instant claim is timely while a claim one second
          later is late.
        test_recipe:
          setup:
            - "Case in CLAIMS_ADMINISTRATION with claim_bar_date 2026-06-01T00:00:00Z"
          setup_api_calls:
            - call: "POST /trustee/creditors"
              payload: { legal_name: "Creditor B", creditor_ref: "CR-B-1", contact_email: "b@x.com" }
              as: Clerk
              captures: { cred_b: $.data.id }
            - call: "POST /trustee/cases"
              payload: { case_number: "26-10002", debtor_name: "Debtor Two", filed_on: "2026-01-15T00:00:00Z", district: "D.Del.", trustee_user_id: "trust-0001" }
              as: Clerk
              captures: { case_id: $.data.id }
            - call: "POST /trustee/cases/${case_id}/assets"
              payload: { description: "Truck", scheduled_value_cents: 500000 }
              as: Trustee
              as_user_id: "trust-0001"
            - call: "POST /trustee/cases/${case_id}/begin_investigation"
              payload: {}
              as: Trustee
              as_user_id: "trust-0001"
            - call: "POST /trustee/cases/${case_id}/set_bar_date"
              payload: { bar_date: "2026-06-01T00:00:00Z" }
              as: Clerk
          trigger:
            - call: "POST /trustee/cases/${case_id}/claims"
              payload: { creditor_id: "${cred_b}", received_at: "2026-06-01T00:00:00Z", filed_amount_cents: 100000, priority_class: "GENERAL_UNSECURED" }
              as: Creditor
              as_user_id: "${cred_b}"
              captures: { claim_timely: $.data.id, timely_late: $.data.late }
            - call: "POST /trustee/cases/${case_id}/claims"
              payload: { creditor_id: "${cred_b}", received_at: "2026-06-01T00:00:01Z", filed_amount_cents: 100000, priority_class: "GENERAL_UNSECURED" }
              as: Creditor
              as_user_id: "${cred_b}"
              captures: { claim_late: $.data.id, late_late: $.data.late }
          assert:
            - "Claim.${claim_timely}.late == false"
            - "Claim.${claim_late}.late == true"
            - "timely_late != late_late"

  # =====================================================================
  # Rule 2 — combinatorial_formula: two instances in DIFFERENT modes
  # (a) >=3 inputs non-linear  (b) nested rounding order  (c) circular dep
  # =====================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: trustee_commission_tier_straddle_at_million_boundary
        grounds:
          - calculations.trustee_commission_326
        distinguishing_aspect: |
          Mode (a): a tiered formula with 3+ non-linear inputs (basis B, four
          tier caps, four rates, nested min/max). A basis of 100,000,000 cents
          ($1,000,000) yields exactly 5,325,000; a basis 100 cents higher adds
          exactly 3 cents (3% tier), proving tier straddling and not a flat rate.
        test_recipe:
          setup:
            - "Two cases each in DISTRIBUTION with a CONFIRMED plan and POSTED dividends totalling exactly 100,000,000 cents (case 1) and 100,000,100 cents (case 2)"
            - "To reach those totals: case 1 has one allowed claim of 200,000,000 and cash 100,000,000 (single full pro-rata dividend of 100,000,000); case 2 identical but cash 100,000,100"
          setup_api_calls:
            - call: "POST /trustee/creditors"
              payload: { legal_name: "Creditor C", creditor_ref: "CR-C-1", contact_email: "c@x.com" }
              as: Clerk
              captures: { cred_c: $.data.id }
            - call: "POST /trustee/cases"
              payload: { case_number: "26-10003", debtor_name: "Debtor Three", filed_on: "2026-01-15T00:00:00Z", district: "D.Del.", trustee_user_id: "trust-0001", objection_window_days: 1 }
              as: Clerk
              captures: { case1: $.data.id }
            - call: "POST /trustee/cases/${case1}/assets"
              payload: { description: "Portfolio", scheduled_value_cents: 200000000 }
              as: Trustee
              as_user_id: "trust-0001"
              captures: { asset1: $.data.id }
            - call: "POST /trustee/cases/${case1}/begin_investigation"
              payload: {}
              as: Trustee
              as_user_id: "trust-0001"
            - call: "POST /trustee/cases/${case1}/set_bar_date"
              payload: { bar_date: "2026-06-01T00:00:00Z" }
              as: Clerk
            - call: "POST /trustee/cases/${case1}/claims"
              payload: { creditor_id: "${cred_c}", received_at: "2026-02-01T00:00:00Z", filed_amount_cents: 200000000, priority_class: "GENERAL_UNSECURED" }
              as: Creditor
              as_user_id: "${cred_c}"
              captures: { claim_c1: $.data.id }
            - call: "POST /trustee/claims/${claim_c1}/review"
              payload: {}
              as: Trustee
              as_user_id: "trust-0001"
            - call: "POST /trustee/claims/${claim_c1}/allow"
              payload: {}
              as: Trustee
              as_user_id: "trust-0001"
            - call: "POST /trustee/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-02T00:00:00Z" }
              as: Court
            - call: "POST /trustee/cases/${case1}/begin_liquidation"
              payload: {}
              as: Trustee
              as_user_id: "trust-0001"
            - call: "POST /trustee/assets/${asset1}/mark_for_sale"
              payload: {}
              as: Trustee
              as_user_id: "trust-0001"
            - call: "POST /trustee/cases/${case1}/sales"
              payload: { asset_id: "${asset1}", buyer_name: "BuyerCo", hammer_price_cents: 100000000, sale_costs_cents: 0 }
              as: Trustee
              as_user_id: "trust-0001"
              captures: { sale1: $.data.id }
            - call: "POST /trustee/sales/${sale1}/approve"
              payload: {}
              as: Court
            - call: "POST /trustee/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-04T00:00:00Z" }
              as: Court
            - call: "POST /trustee/sales/${sale1}/consummate"
