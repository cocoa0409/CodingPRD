  - rule_id: boundary_precision_check
    instances:
      - name: size_standard_financial_prong_inclusive_cap
        grounds:
          - calculations.size_standard
          - state_machines.Application.DRAFT_to_UNDERWRITING
          - entities.Application.fields.size_eligible
        distinguishing_aspect: |
          Numeric threshold metric on the SUBMIT endpoint: tnw EXACTLY at TNW_CAP
          (2000000000) and ni EXACTLY at NET_INCOME_CAP (650000000) PASSES (<= is inclusive),
          so size_eligible becomes true at the boundary; one cent over either flips it false.
        test_recipe:
          setup:
            - "A Borrower with tnw exactly 2000000000 and ni exactly 650000000, emp 9000 (headcount fails), so only the financial prong at its inclusive cap can pass."
            - "DRAFT Application with one matching proceeds line, ready to submit."
          setup_api_calls:
            - call: "POST /sba/lenders"
              payload: { name: "Bdy CDC", program: "7A" }
              as: SbaOfficer
              captures: { lender_id: $.data.id }
            - call: "POST /sba/borrowers"
              payload: { lender_id: "${lender_id}", legal_name: "Edge LLC", naics_code: "236220", tangible_net_worth_cents: 2000000000, avg_net_income_cents: 650000000, affiliate_employee_count: 9000 }
              as: LoanOfficer
              as_user_id: "officer-1"
              captures: { borrower_id: $.data.id }
            - call: "POST /sba/applications"
              payload: { borrower_id: "${borrower_id}", requested_amount_cents: 50000000, guaranty_pct: 0.75, maturity_months: 240 }
              as: LoanOfficer
              as_user_id: "officer-1"
              captures: { app_id: $.data.id }
            - call: "POST /sba/proceeds"
              payload: { application_id: "${app_id}", use_category: "REAL_ESTATE", amount_cents: 50000000 }
              as: LoanOfficer
              as_user_id: "officer-1"
          trigger:
            - call: "POST /sba/applications/${app_id}/submit"
              payload: {}
              as: LoanOfficer
              as_user_id: "officer-1"
              captures: { se: $.data.size_eligible, st: $.data.status }
          assert:
            - "Application.${app_id}.size_eligible == true (financial prong passes at the inclusive caps)"
            - "Application.${app_id}.status == UNDERWRITING (submit succeeds)"

      - name: over_disbursement_exact_remaining_boundary
        grounds:
          - validations[priority=13]
          - state_machines.Disbursement.REQUESTED_to_POSTED
          - entities.Application.fields.disbursed_amount_cents
