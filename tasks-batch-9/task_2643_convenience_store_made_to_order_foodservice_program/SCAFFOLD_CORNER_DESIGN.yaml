              as: KitchenAssociate
              captures: { s1: $.data.status, baked1: $.data.baked_qty, rem1: $.data.remaining_qty }
          assert:
            - "${s0} == PLANNED"
            - "${baked0} == 0"
            - "HTTP status == 200"
            - "${s1} == BAKING"
            - "${baked1} == 40"
            - "${rem1} == 40"
            - "ProductionBatch.${batch_id}.hold_started_at == null"
            - "ProductionBatch.${batch_id}.hold_expires_at == null"
            - "ProductionBatch.${batch_id}.reserved_qty == 0"
            - "Store.${store_id}.hot_case_slots_used == 1"

      - name: bake_beyond_the_hot_case_slot_capacity_returns_capacity_exceeded
        claim_type: precondition_enforcement
        grounds:
          - state_machines.ProductionBatch.PLANNED_to_BAKING
          - errors[ERR_HOT_CASE_CAPACITY_EXCEEDED]
          - validations[priority=38]
          - entities.Store.fields.hot_case_slot_capacity
        distinguishing_aspect: |
          The capacity gate is on the STORE, not on the holding unit: with hot_case_slot_capacity 1 the
          second bake is refused even though unit BC-1 still has two free physical slots and the batch was
          accepted at plan time. So the ceiling is checked at bake, not at POST /production-batches.
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T06:00:00Z; store WAWA-0101 created with hot_case_slot_capacity 1"
            - "unit BC-1 has 3 slots; two PLANNED pretzel batches sit in slots 1 and 2"
            - "the slot-1 batch is already baked, so Store.hot_case_slots_used is 1"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T06:00:00Z" }
              as: ChainAdmin
            - call: "POST /stores"
              payload: { store_code: "WAWA-0101", name: "Wawa Route 1", hot_case_slot_capacity: 1, pickup_slot_capacity: 2, is_fuel_site: true }
              as: ChainAdmin
              captures: { store_id: $.data.id }
            - call: "POST /stores/${store_id}/holding-units"
              payload: { unit_code: "BC-1", unit_type: "BAKERY_CASE", min_temp_f: 135, max_temp_f: 185, slot_count: 3 }
              as: StoreManager
              captures: { unit_id: $.data.id }
            - call: "POST /menu-items"
              payload: { sku: "PRETZEL-SOFT", name: "Soft Pretzel", station: "BAKERY", fulfillment_mode: "PAR_BAKED_CASE", base_price_cents: 199, unit_food_cost_cents: 40, bake_minutes: 25, hold_minutes: 240, valid_dayparts: ["BREAKFAST", "LUNCH"], is_catering_eligible: true }
              as: ChainAdmin
              captures: { pretzel_id: $.data.id }
            - call: "POST /production-batches"
              payload: { store_id: "${store_id}", menu_item_id: "${pretzel_id}", holding_unit_id: "${unit_id}", slot_index: 1, planned_qty: 40, bake_start_at: "2026-08-01T06:00:00Z" }
              as: KitchenAssociate
              captures: { batch_a: $.data.id }
            - call: "POST /production-batches"
              payload: { store_id: "${store_id}", menu_item_id: "${pretzel_id}", holding_unit_id: "${unit_id}", slot_index: 2, planned_qty: 20, bake_start_at: "2026-08-01T06:00:00Z" }
              as: KitchenAssociate
              captures: { batch_b: $.data.id, b_status: $.data.status }
            - call: "POST /production-batches/${batch_a}/bake"
              payload: {}
              as: KitchenAssociate
          trigger:
            - call: "POST /production-batches/${batch_b}/bake"
              payload: {}
              as: KitchenAssociate
              captures: { err_id: $.data.error_id }
          assert:
            - "${b_status} == PLANNED"
            - "HTTP status == 409"
            - "${err_id} == ERR_HOT_CASE_CAPACITY_EXCEEDED"
            - "ProductionBatch.${batch_b}.status == PLANNED"
            - "ProductionBatch.${batch_b}.baked_qty == 0"
            - "ProductionBatch.${batch_a}.status == BAKING"
            - "Store.${store_id}.hot_case_slots_used == 1"

      - name: daypart_transition_sweep_discards_a_batch_the_new_menu_excludes
        claim_type: side_effect_execution
        grounds:
          - state_machines.ProductionBatch.HOLDING_to_DISCARDED
          - endpoints[POST /stores/{id}/daypart-transitions]
          - calculations.waste_valuation
          - entities.WasteLog.fields.reason
          - entities.WasteLog.fields.daypart_epoch
        distinguishing_aspect: |
          Every declared side effect of the transition endpoint is checked in one shot: current_daypart
          LUNCH, daypart_epoch 1, the pretzel batch DISCARDED with discarded_qty 40, a WasteLog stamped
          reason DAYPART_TRANSITION / logged_by_user_id "system" / daypart_epoch 1 (the NEW epoch, not 0),
          food_cost 1600 and retail 7960, Store.waste_cost_cents_mtd 1600 and hot_case_slots_used back to 0.
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T06:00:00Z; store in its initial BREAKFAST daypart with daypart_epoch 0"
            - "the pretzel item is BREAKFAST-only, so the LUNCH menu excludes it"
            - "one pretzel batch of 40 pulled at 06:00, HOLDING, hold_expires_at 10:00, nothing reserved"
            - "the clock is then advanced to 2026-08-01T11:00:00Z so the LUNCH transition is due"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T06:00:00Z" }
              as: ChainAdmin
            - call: "POST /stores"
              payload: { store_code: "WAWA-0101", name: "Wawa Route 1", hot_case_slot_capacity: 4, pickup_slot_capacity: 2, is_fuel_site: true }
              as: ChainAdmin
              captures: { store_id: $.data.id }
            - call: "POST /stores/${store_id}/holding-units"
              payload: { unit_code: "BC-1", unit_type: "BAKERY_CASE", min_temp_f: 135, max_temp_f: 185, slot_count: 3 }
              as: StoreManager
              captures: { unit_id: $.data.id }
            - call: "POST /menu-items"
              payload: { sku: "PRETZEL-SOFT", name: "Soft Pretzel", station: "BAKERY", fulfillment_mode: "PAR_BAKED_CASE", base_price_cents: 199, unit_food_cost_cents: 40, bake_minutes: 25, hold_minutes: 240, valid_dayparts: ["BREAKFAST"], is_catering_eligible: true }
              as: ChainAdmin
              captures: { pretzel_id: $.data.id }
            - call: "POST /production-batches"
              payload: { store_id: "${store_id}", menu_item_id: "${pretzel_id}", holding_unit_id: "${unit_id}", slot_index: 1, planned_qty: 40, bake_start_at: "2026-08-01T06:00:00Z" }
              as: KitchenAssociate
              captures: { batch_id: $.data.id }
            - call: "POST /production-batches/${batch_id}/bake"
              payload: {}
              as: KitchenAssociate
            - call: "POST /production-batches/${batch_id}/pull"
              payload: {}
              as: KitchenAssociate
              captures: { expires: $.data.hold_expires_at }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T11:00:00Z" }
              as: ChainAdmin
          trigger:
            - call: "POST /stores/${store_id}/daypart-transitions"
