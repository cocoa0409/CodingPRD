          - errors.ERR_ESCALATION_THRESHOLD_NOT_MET
          - state_machines.IssueSignal.LINKED_to_ESCALATED
        distinguishing_aspect: |
          Metric escalation_score on POST /crisis/issue-signals/{signal_id}/escalate: reach 62 yields
          exactly 70.00 and must escalate because the comparison is >=, while reach 61 yields 69.00 and
          must be refused with ERR_ESCALATION_THRESHOLD_NOT_MET.
