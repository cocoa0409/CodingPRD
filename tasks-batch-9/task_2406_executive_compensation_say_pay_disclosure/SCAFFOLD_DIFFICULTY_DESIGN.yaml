            - "L3: PayoutAward.${psu_award_id}.realizable_value_usd == 5000000.00"
            - "L4: PayProgram.${pp_id}.realized_pay_total_usd == 0.00, realizable_pay_total_usd == 7340000.00, pay_percentile_rank == 0.00, degree_of_alignment == 30.00, alignment_status == ALIGNED"
            - "L5: ProxyAdvisorScreen.${iss_id}.status == STALE and ProxyAdvisorScreen.${gl_id}.status == STALE"
            - "before the trigger PayoutAward.${ai_award_id}.certified_factor_pct was null and both screens were SCREENED — every one of the five levels changed on this single call"

      - name: clawback_recovery_cascades_five_levels_from_determination_to_screen
        grounds:
          - state_machines.ClawbackDetermination.NOTICED_to_RECOVERED
          - state_machines.PayoutAward.VESTED_to_CLAWED_BACK
          - calculations.clawback_recoverable_amount
          - calculations.realized_and_realizable_pay
          - calculations.pay_for_performance_alignment
          - entities.RestatementEvent.fields.recovered_total_usd
          - state_machines.ProxyAdvisorScreen.SCREENED_to_STALE
        distinguishing_aspect: |
          The cascade climbs UPWARD through a different chain than the certification cascade: ClawbackDetermination
          status (L1) -> PayoutAward status and realized_value_usd (L2) -> RestatementEvent.recovered_total_usd (L3,
          a grandparent on the restatement branch, not on the program branch) -> PayProgram alignment fields (L4) ->
          ProxyAdvisorScreen staleness (L5). Its L3 hop crosses aggregate roots, which the certification cascade
          never does.
