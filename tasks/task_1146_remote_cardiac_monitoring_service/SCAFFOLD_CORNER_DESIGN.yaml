  # ================================================================ endpoints
  - section: endpoints
    instances:
      - name: response_envelope_success_shape
        claim_type: standard_crud
        grounds: [response_envelope]
        distinguishing_aspect: "Every success response carries meta.api_request_id, meta.api_request_timestamp, response_type 'object', and data with the entity."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /v1/patients", payload: { full_name: "Envelope", date_of_birth: "1971-03-03", mrn: "MRN-4001", phone: "555-3000", insurance_plan: "MEDICARE" }, as: EnrollmentCoordinator, captures: { p_id: $.data.id } }
          assert:
            - "response meta.api_request_id is a non-empty string and meta.api_request_timestamp is ISO8601"
            - "response response_type == 'object' and data.id == ${p_id}"

