            - "TempExcursion.${exc_id}.acknowledged_by_user_id == ${store_id}"
            - "TempExcursion.${exc_id}.first_breach_iso == 2026-08-01T04:00:00Z"
            - "TempExcursion.${exc_id}.last_breach_iso == 2026-08-01T04:30:00Z"
            - "TempExcursion.${exc_id}.mandatory_disposition == NONE"
            - "Store.${store_id}.energy_posture == CONSTRAINED"

      - name: dr_event_parallel_state_dimensions
        grounds:
          - state_machines.DemandResponseEvent.transitions.dr_clock_complete
          - state_machines.DemandResponseEvent.transitions.dr_settle
          - state_machines.DemandResponseEvent.transitions.dr_reverse_settlement
          - calculations.dr_event_settlement
        distinguishing_aspect: |
          DemandResponseEvent (a different entity from the excursion cycle) carries
          two independent state dimensions: event_state walks
          SCHEDULED -> NOTIFIED -> ACTIVE -> COMPLETED while settlement_state walks
          PENDING -> SETTLED -> REVERSED underneath it. Settling and then reversing
          must move settlement_state twice without ever perturbing event_state,
          which stays COMPLETED - a lattice, not a line.
        test_recipe:
          setup:
            - "one MIXED / SUPERCENTER store with BMS ACTIVE and one TOU_DEMAND account"
            - "three eligible on-peak baseline intervals 1290.5, 1275.0, 1245.0 giving baseline_kw 1270.17"
            - "an event over 2026-08-05T14:00Z-15:00Z with target_reduction_kw 200.0 whose four in-window intervals are 1250.0, 1255.5, 1240.0, 1259.5 - a shortfall run"
            - "the clock advanced to 2026-08-05T15:00:00Z so the sweep completes the event"
          setup_api_calls:
            - call: "POST /energy-ops/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /energy-ops/stores"
              payload: { code: "STR-NL2", climate_zone: "MIXED", store_format: "SUPERCENTER", floor_area_sqft: 120000 }
              as: PlatformAdmin
              captures: { store_id: "$.data.id", store_v1: "$.data.version" }
            - call: "POST /energy-ops/setpoint-standards"
              payload: { climate_zone: "MIXED", store_format: "SUPERCENTER", season: "SUMMER", cooling_setpoint_f: 74.0, heating_setpoint_f: 68.0, deadband_f: 2.0, lighting_lux_target: 750 }
              as: EnergyManager
              captures: { std_id: "$.data.id" }
            - call: "POST /energy-ops/setpoint-standards/${std_id}/publish"
              payload: {}
              as: EnergyManager
            - call: "POST /energy-ops/stores/${store_id}/bms-commissioning"
              payload: { standard_id: "${std_id}", expected_store_version: "${store_v1}" }
              as: EnergyManager
            - call: "POST /energy-ops/stores/${store_id}/bms-activation"
              payload: {}
              as: EnergyManager
            - call: "POST /energy-ops/stores/${store_id}/utility-accounts"
              payload: { utility_name: "Midland Power", rate_schedule_code: "TOU-GS3", rate_family: "TOU_DEMAND", demand_charge_per_kw: 14.50, rate_on_peak: 0.1450, rate_off_peak: 0.0800 }
              as: EnergyManager
              captures: { acct_id: "$.data.id" }
            - call: "POST /energy-ops/utility-accounts/${acct_id}/demand-intervals"
              payload: { intervals: [ { interval_start_iso: "2026-08-04T14:00:00Z", kw_demand: 1290.5, is_on_peak: true }, { interval_start_iso: "2026-08-04T15:00:00Z", kw_demand: 1275.0, is_on_peak: true }, { interval_start_iso: "2026-08-04T16:00:00Z", kw_demand: 1245.0, is_on_peak: true }, { interval_start_iso: "2026-08-05T14:00:00Z", kw_demand: 1250.0, is_on_peak: true, is_dr_event_day: true }, { interval_start_iso: "2026-08-05T14:15:00Z", kw_demand: 1255.5, is_on_peak: true, is_dr_event_day: true }, { interval_start_iso: "2026-08-05T14:30:00Z", kw_demand: 1240.0, is_on_peak: true, is_dr_event_day: true }, { interval_start_iso: "2026-08-05T14:45:00Z", kw_demand: 1259.5, is_on_peak: true, is_dr_event_day: true } ] }
              as: EnergyAnalyst
            - call: "POST /energy-ops/utility-accounts/${acct_id}/demand-response-events"
              payload: { program_code: "CPP-2026", curtailment_start_iso: "2026-08-05T14:00:00Z", curtailment_end_iso: "2026-08-05T15:00:00Z", target_reduction_kw: 200.0 }
              as: EnergyManager
              captures: { event_id: "$.data.id", initial_settlement: "$.data.settlement_state" }
            - call: "POST /energy-ops/demand-response-events/${event_id}/notify"
              payload: {}
              as: EnergyManager
            - call: "POST /energy-ops/_clock/set_current_utc"
              payload: { current_utc: "2026-08-05T14:00:00Z" }
              as: PlatformAdmin
            - call: "POST /energy-ops/demand-response-events/${event_id}/activate"
              payload: {}
              as: EnergyManager
              captures: { active_settlement: "$.data.settlement_state" }
            - call: "POST /energy-ops/_clock/set_current_utc"
              payload: { current_utc: "2026-08-05T15:00:00Z" }
              as: PlatformAdmin
              captures: { completed_count: "$.data.dr_events_completed" }
          trigger:
            - call: "POST /energy-ops/demand-response-events/${event_id}/settle"
              payload: {}
              as: EnergyAnalyst
              captures: { settled_event_state: "$.data.event_state", settled_settlement: "$.data.settlement_state" }
            - call: "POST /energy-ops/demand-response-events/${event_id}/reverse-settlement"
              payload: { reversal_reason: "meter data corrected by utility" }
              as: EnergyManager
              captures: { reversed_event_state: "$.data.event_state", reversed_settlement: "$.data.settlement_state" }
          assert:
            - "${initial_settlement} == PENDING"
            - "${active_settlement} == PENDING"
            - "${completed_count} == 1"
            - "DemandResponseEvent.${event_id}.baseline_kw == 1270.17"
            - "DemandResponseEvent.${event_id}.total_reduction_kwh == 18.92"
            - "DemandResponseEvent.${event_id}.performance_pct == 9.5"
            - "DemandResponseEvent.${event_id}.incentive_usd == 0.00"
            - "DemandResponseEvent.${event_id}.penalty_usd == 32.59"
            - "${settled_event_state} == COMPLETED"
            - "${settled_settlement} == SETTLED"
            - "${reversed_event_state} == COMPLETED"
            - "${reversed_settlement} == REVERSED"
            - "DemandResponseEvent.${event_id}.reversal_reason == meter data corrected by utility"
            - "DemandResponseEvent.${event_id}.performance_pct == 9.5 (retained as evidence after reversal)"
            - "Store.${store_id}.energy_posture == NORMAL"

      - name: store_bms_status_degrade_recommission_cycle
        grounds:
          - state_machines.Store.transitions.bms_degrade_on_urgent_work_order
          - state_machines.Store.transitions.bms_recommission
          - state_machines.Store.transitions.bms_activate
          - state_machines.MaintenanceWorkOrder.transitions.work_order_complete
          - calculations.fault_score
        distinguishing_aspect: |
          The Store bms_status dimension is a cycle, not a ladder: ACTIVE is
          re-entered through DEGRADED -> COMMISSIONING -> ACTIVE, and completing the
          urgent work order does NOT undo the DEGRADED excursion by itself - an
          explicit recommission is required, and the recommission needs a freshly
          read version because the fault cascade already bumped it.
        test_recipe:
          setup:
            - "one HOT_DRY / SUPERCENTER store commissioned and ACTIVE against a published standard"
            - "one REFRIGERATION MAJOR fault, occurrence_count 6, affected_load_kw 20.0, scoring 89.3 (URGENT)"
            - "the triage cascade drives bms_status ACTIVE -> DEGRADED and energy_posture NORMAL -> CONSTRAINED"
          setup_api_calls:
            - call: "POST /energy-ops/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /energy-ops/stores"
              payload: { code: "STR-NL3", climate_zone: "HOT_DRY", store_format: "SUPERCENTER", floor_area_sqft: 110000 }
              as: PlatformAdmin
              captures: { store_id: "$.data.id", store_v1: "$.data.version" }
            - call: "POST /energy-ops/setpoint-standards"
              payload: { climate_zone: "HOT_DRY", store_format: "SUPERCENTER", season: "SUMMER", cooling_setpoint_f: 76.0, heating_setpoint_f: 70.0, deadband_f: 2.0, lighting_lux_target: 750 }
              as: EnergyManager
              captures: { std_id: "$.data.id" }
            - call: "POST /energy-ops/setpoint-standards/${std_id}/publish"
              payload: {}
              as: EnergyManager
            - call: "POST /energy-ops/stores/${store_id}/bms-commissioning"
              payload: { standard_id: "${std_id}", expected_store_version: "${store_v1}" }
              as: EnergyManager
              captures: { commissioning_status: "$.data.bms_status" }
            - call: "POST /energy-ops/stores/${store_id}/bms-activation"
              payload: {}
              as: EnergyManager
              captures: { active_status: "$.data.bms_status" }
            - call: "POST /energy-ops/stores/${store_id}/fault-diagnostics"
              payload: { equipment_ref: "RACK-B2", equipment_class: "REFRIGERATION", fault_code: "SUCTION_PRESSURE_HIGH", severity: "MAJOR", occurrence_count: 6, affected_load_kw: 20.0 }
              as: MaintenanceTech
              captures: { fault_id: "$.data.id", fault_score: "$.data.fault_score" }
            - call: "POST /energy-ops/fault-diagnostics/${fault_id}/triage"
              payload: { outcome: "WORK_ORDER" }
              as: MaintenanceTech
              captures: { wo_id: "$.data.work_order_id", wo_priority: "$.data.work_order_priority", degraded_status: "$.data.store_bms_status", degraded_posture: "$.data.store_energy_posture" }
          trigger:
            - call: "GET /energy-ops/stores/${store_id}"
              payload: {}
              as: EnergyManager
              captures: { store_v_after_cascade: "$.data.version" }
            - call: "POST /energy-ops/stores/${store_id}/bms-commissioning"
              payload: { standard_id: "${std_id}", expected_store_version: "${store_v_after_cascade}" }
              as: EnergyManager
              captures: { recommission_status: "$.data.bms_status" }
            - call: "POST /energy-ops/stores/${store_id}/bms-activation"
              payload: {}
              as: EnergyManager
              captures: { reactivated_status: "$.data.bms_status", reactivated_posture: "$.data.energy_posture" }
            - call: "POST /energy-ops/work-orders/${wo_id}/complete"
              payload: { completion_note: "compressor rack B2 valve replaced" }
              as: MaintenanceTech
          assert:
            - "${commissioning_status} == COMMISSIONING"
            - "${active_status} == ACTIVE"
            - "${fault_score} == 89.3"
            - "${wo_priority} == URGENT"
            - "${degraded_status} == DEGRADED"
            - "${degraded_posture} == CONSTRAINED"
            - "${recommission_status} == COMMISSIONING"
            - "${reactivated_status} == ACTIVE"
            - "${reactivated_posture} == CONSTRAINED"
            - "Store.${store_id}.urgent_work_order_count == 1 immediately after reactivation"
            - "MaintenanceWorkOrder.${wo_id}.state == COMPLETED"
            - "FaultDiagnostic.${fault_id}.state == RESOLVED"
            - "Store.${store_id}.urgent_work_order_count == 0 after completion"
            - "Store.${store_id}.energy_posture == NORMAL after completion"
            - "Store.${store_id}.bms_status == ACTIVE after completion"
            - "Store.${store_id}.active_standard_id == ${std_id}"

  - rule_id: transitive_cascade
    instances:
      - name: reading_escalation_cascade_depth_five
        grounds:
          - state_machines.TempExcursion.transitions.excursion_escalate
          - state_machines.Store.transitions.posture_raise_locked
          - state_machines.DemandResponseEvent.transitions.dr_posture_optout
          - state_machines.LightingOverride.transitions.override_revoke_posture
          - calculations.excursion_exposure
          - calculations.store_energy_posture
          - calculations.lighting_override_projection
        distinguishing_aspect: |
          One BmsGateway reading propagates five links deep across four entities:
          (1) TempExcursion OPEN -> ESCALATED at exposure_minutes 120,
          (2) Store energy_posture CONSTRAINED -> LOCKED,
          (3) the NOTIFIED DemandResponseEvent -> OPTED_OUT with
              opt_out_reason FOOD_SAFETY_POSTURE,
          (4) UtilityAccount.dr_optout_count 0 -> 1 while dr_enrollment_state stays
              ENROLLED (1 < DR_OPTOUT_SUSPEND_COUNT 3),
          (5) the ACTIVE SCHEDULE_EXTEND LightingOverride -> REVOKED with
              revoke_source SYSTEM_POSTURE, releasing 300.00 kWh back to
              Store.override_kwh_used_month, and every PROPOSED RetrofitProject
              of the store gets escalated_review = true.
        test_recipe:
          setup:
            - "one COLD / SUPERCENTER store, BMS ACTIVE, override_budget_kwh_month 500.0, clock 2026-08-01T04:00:00Z"
            - "one MEDIUM_TEMP MEAT case with alarm_high_f 41.0 / alarm_low_f 28.0"
            - "one TOU_DEMAND account with three on-peak baseline intervals so notify succeeds"
            - "one demand-response event for 2026-08-02T14:00Z-15:00Z left in NOTIFIED"
            - "one PROPOSED retrofit project"
            - "two breaching readings (42.0 at 04:00Z, 42.5 at 04:15Z) that put the case in ALARM and the store in CONSTRAINED"
            - "only then an ACTIVE SCHEDULE_EXTEND override for 00:00Z-08:00Z at 37.5 kW, projecting 300.00 kWh, so the override survives the CONSTRAINED step and is still ACTIVE when the LOCKED step arrives"
          setup_api_calls:
            - call: "POST /energy-ops/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T04:00:00Z" }
              as: PlatformAdmin
            - call: "POST /energy-ops/stores"
              payload: { code: "STR-TC1", climate_zone: "COLD", store_format: "SUPERCENTER", floor_area_sqft: 115000, override_budget_kwh_month: 500.0 }
              as: PlatformAdmin
              captures: { store_id: "$.data.id", store_v1: "$.data.version" }
            - call: "POST /energy-ops/setpoint-standards"
              payload: { climate_zone: "COLD", store_format: "SUPERCENTER", season: "SUMMER", cooling_setpoint_f: 73.0, heating_setpoint_f: 68.0, deadband_f: 2.0, lighting_lux_target: 750 }
              as: EnergyManager
              captures: { std_id: "$.data.id" }
            - call: "POST /energy-ops/setpoint-standards/${std_id}/publish"
              payload: {}
              as: EnergyManager
            - call: "POST /energy-ops/stores/${store_id}/bms-commissioning"
              payload: { standard_id: "${std_id}", expected_store_version: "${store_v1}" }
              as: EnergyManager
            - call: "POST /energy-ops/stores/${store_id}/bms-activation"
              payload: {}
              as: EnergyManager
            - call: "POST /energy-ops/stores/${store_id}/utility-accounts"
              payload: { utility_name: "Northern Grid", rate_schedule_code: "TOU-GS3", rate_family: "TOU_DEMAND", demand_charge_per_kw: 14.50, rate_on_peak: 0.1450, rate_off_peak: 0.0800 }
              as: EnergyManager
              captures: { acct_id: "$.data.id" }
            - call: "POST /energy-ops/utility-accounts/${acct_id}/demand-intervals"
              payload: { intervals: [ { interval_start_iso: "2026-08-01T14:00:00Z", kw_demand: 1290.5, is_on_peak: true }, { interval_start_iso: "2026-08-01T15:00:00Z", kw_demand: 1275.0, is_on_peak: true }, { interval_start_iso: "2026-08-01T16:00:00Z", kw_demand: 1245.0, is_on_peak: true } ] }
              as: EnergyAnalyst
            - call: "POST /energy-ops/utility-accounts/${acct_id}/demand-response-events"
              payload: { program_code: "CPP-2026", curtailment_start_iso: "2026-08-02T14:00:00Z", curtailment_end_iso: "2026-08-02T15:00:00Z", target_reduction_kw: 200.0 }
              as: EnergyManager
              captures: { event_id: "$.data.id" }
            - call: "POST /energy-ops/demand-response-events/${event_id}/notify"
              payload: {}
              as: EnergyManager
              captures: { notified_state: "$.data.event_state" }
            - call: "POST /energy-ops/stores/${store_id}/retrofit-projects"
              payload: { measure_type: "CASE_DOORS", capex_usd: 88000.00, projected_annual_savings_kwh: 210000.00 }
              as: EnergyAnalyst
              as_user_id: "u_analyst_tc1"
              captures: { proj_id: "$.data.id" }
            - call: "POST /energy-ops/stores/${store_id}/refrigeration-cases"
              payload: { case_code: "CASE-TC1-01", case_type: "MEDIUM_TEMP", product_class: "MEAT", alarm_high_f: 41.0, alarm_low_f: 28.0, product_value_usd: 12800.00 }
              as: EnergyManager
              captures: { case_id: "$.data.id" }
            - call: "POST /energy-ops/refrigeration-cases/${case_id}/readings"
              payload: { temp_f: 42.0, reading_iso: "2026-08-01T04:00:00Z" }
              as: BmsGateway
              as_user_id: "${store_id}"
            - call: "POST /energy-ops/refrigeration-cases/${case_id}/readings"
              payload: { temp_f: 42.5, reading_iso: "2026-08-01T04:15:00Z" }
              as: BmsGateway
              as_user_id: "${store_id}"
              captures: { exc_id: "$.data.excursion_id", posture_after_alarm: "$.data.store_energy_posture" }
            - call: "POST /energy-ops/stores/${store_id}/lighting-overrides"
              payload: { zone: "SALES_FLOOR", override_type: "SCHEDULE_EXTEND", start_iso: "2026-08-01T00:00:00Z", end_iso: "2026-08-01T08:00:00Z", zone_load_kw: 37.5, requested_reason: "inventory count night crew" }
              as: StoreManager
              as_user_id: "${store_id}"
              captures: { ovr_id: "$.data.id", ovr_state: "$.data.state", ovr_kwh: "$.data.projected_kwh" }
          trigger:
            - call: "POST /energy-ops/refrigeration-cases/${case_id}/readings"
              payload: { temp_f: 43.0, reading_iso: "2026-08-01T06:00:00Z" }
              as: BmsGateway
              as_user_id: "${store_id}"
              captures: { exc_state: "$.data.excursion_state", exposure: "$.data.exposure_minutes", posture: "$.data.store_energy_posture", opted_out: "$.data.dr_events_opted_out", revoked: "$.data.overrides_revoked" }
          assert:
            - "${notified_state} == NOTIFIED"
            - "${posture_after_alarm} == CONSTRAINED"
            - "${ovr_state} == ACTIVE"
            - "${ovr_kwh} == 300.00"
            - "${exc_state} == ESCALATED"
            - "${exposure} == 120"
            - "${posture} == LOCKED"
            - "${opted_out} == 1"
            - "${revoked} == 1"
            - "TempExcursion.${exc_id}.state == ESCALATED"
            - "TempExcursion.${exc_id}.peak_temp_f == 43.0"
            - "TempExcursion.${exc_id}.mandatory_disposition == NONE"
            - "Store.${store_id}.energy_posture == LOCKED"
            - "DemandResponseEvent.${event_id}.event_state == OPTED_OUT"
            - "DemandResponseEvent.${event_id}.opt_out_reason == FOOD_SAFETY_POSTURE"
            - "UtilityAccount.${acct_id}.dr_optout_count == 1"
            - "UtilityAccount.${acct_id}.dr_enrollment_state == ENROLLED"
            - "LightingOverride.${ovr_id}.state == REVOKED"
            - "LightingOverride.${ovr_id}.revoke_source == SYSTEM_POSTURE"
            - "LightingOverride.${ovr_id}.revoked_by_user_id == null"
            - "Store.${store_id}.override_kwh_used_month == 0.00"
            - "RetrofitProject.${proj_id}.escalated_review == true"
            - "RetrofitProject.${proj_id}.state == PROPOSED"

      - name: fault_triage_cascade_depth_four
        grounds:
          - state_machines.FaultDiagnostic.transitions.fault_triage_work_order
          - state_machines.Store.transitions.bms_degrade_on_urgent_work_order
          - state_machines.Store.transitions.posture_raise_constrained
          - calculations.fault_score
          - calculations.store_energy_posture
        distinguishing_aspect: |
          A different trigger (MaintenanceTech triage rather than a meter reading)
          and a shallower depth of exactly four: (1) a MaintenanceWorkOrder is born
          URGENT because fault_score 89.3 >= 70.0, (2) the Store's bms_status goes
          ACTIVE -> DEGRADED because the fault is REFRIGERATION, (3) energy_posture
          is recomputed NORMAL -> CONSTRAINED, (4) every PROPOSED RetrofitProject of
          that store is flagged escalated_review. A MINOR LIGHTING fault triaged in
          the same store produces a ROUTINE work order and stops the chain at link 1.
        test_recipe:
          setup:
            - "one MARINE / NEIGHBORHOOD store, BMS ACTIVE, posture NORMAL"
            - "two PROPOSED retrofit projects on that store"
            - "one MINOR LIGHTING fault (occurrence_count 2, affected_load_kw 10.0, score 23.1) already triaged to a ROUTINE work order, proving the cascade did not fire"
            - "one REFRIGERATION MAJOR fault, occurrence_count 6, affected_load_kw 20.0, score 89.3, still DETECTED"
          setup_api_calls:
            - call: "POST /energy-ops/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
