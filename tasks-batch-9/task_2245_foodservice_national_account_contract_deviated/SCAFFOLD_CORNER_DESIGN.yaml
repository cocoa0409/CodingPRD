      - claim_type: waterfall_allocation
        name: substitute_selection_filters_ranks_and_breaks_ties_by_created_at
        grounds:
          - calculations.substitute_selection
          - validations[priority=33]
          - validations[priority=34]
          - errors.ERR_PRODUCT_IN_STOCK
          - errors.ERR_NO_ELIGIBLE_SUBSTITUTE
          - state_machines.OrderLine.DRAFT_PRICED_to_DRAFT_PRICED
        distinguishing_aspect: |
          All four selector stages are decided in one call: the rank-1 rule is dropped
          because its substitute is OUT_OF_STOCK, the rank-2 rule is dropped because its
          10.00 delta exceeds the 5.00 cap, the two surviving rank-3 rules tie and the
          earlier created_at wins (never the smaller id), and a primary with no surviving
          candidate raises ERR_NO_ELIGIBLE_SUBSTITUTE instead of silently keeping the
          out-of-stock item.
        test_recipe:
          setup:
            - "ACTIVE contract with one unbounded PROTEIN tier LAST_COST PERCENT_OF_COST 25.00, an IN_MARKET coverage and an OPEN August period."
            - "Primary P-CHKN (last 4000 -> lists at 5000, group CHKN); candidates S1 (4000, OUT_OF_STOCK, rank 1), S2 (4400 -> 5500, delta 10.00, rank 2), S3 (4160 -> 5200, delta 4.00, rank 3, created 2026-08-01), S4 (4200 -> 5250, delta exactly 5.00, rank 3, created 2026-08-02)."
            - "Second primary P-BEEF (group BEEF) whose only candidate S5 is OUT_OF_STOCK."
            - "Every rule caps max_price_delta_pct at 5.00 and uses SUBSTITUTE_OWN_PRICE."
          setup_api_calls:
            - call: "POST /nac/operators"
              payload: { legal_name: "Harborline Grill Group", operator_code: "HLG" }
              as: SystemAdmin
              captures: { op_id: $.data.id }
