      - name: partner_cannot_respond_to_another_orgs_referral
        claim_type: Violation to Error
        grounds:
          - validations[priority=23]
          - errors[ERR_NOT_RESOURCE_OWNER]
          - roles.ResourcePartner
        distinguishing_aspect: "Ownership for ResourcePartner is entity-backed on ResourceOrg: a partner whose X-User-ID is a different organization's id is refused with ERR_NOT_RESOURCE_OWNER (403), and the owning organization then succeeds on the same referral."
        test_recipe:
          setup:
            - "Logical clock at 2026-06-01T00:00:00Z."
            - "One worker, one ENROLLED patient, two ACTIVE organizations; the offering belongs to the first."
            - "One Referral in status SENT against the first organization's offering."
          setup_api_calls:
            - call: "POST /chw/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /chw/workers"
              payload: { full_name: "Ana Reyes", employee_code: "C-047" }
              as: ProgramAdmin
              captures: { w1: $.data.id }
            - call: "POST /chw/patients"
              payload: { mrn: "MRN-C47", full_name: "Owner Case", household_size: 2, monthly_income_cents: 100000, residence_zip: "60614" }
              as: CHW
              as_user_id: "${w1}"
              captures: { p1: $.data.id }
            - call: "PATCH /chw/patients/${p1}"
              payload: { enrollment_action: "ENROLL" }
              as: Supervisor
              as_user_id: "sup-1"
            - call: "POST /chw/resource-orgs"
              payload: { name: "Northside Pantry", org_type: "FOOD", service_zips: ["60614"], contact_email: "ops@northside.example" }
              as: ProgramAdmin
              captures: { org_a: $.data.id }
            - call: "POST /chw/resource-orgs"
              payload: { name: "Southside Pantry", org_type: "FOOD", service_zips: ["60614"], contact_email: "ops@southside.example" }
              as: ProgramAdmin
              captures: { org_b: $.data.id }
            - call: "POST /chw/offerings"
              payload: { resource_org_id: "${org_a}", unit_type: "FOOD_BOX", capacity_total: 3 }
              as: ProgramAdmin
              captures: { off_a: $.data.id, off_a_v: $.data.version }
            - call: "POST /chw/referrals"
              payload: { patient_id: "${p1}", offering_id: "${off_a}", opened_by_chw_id: "${w1}", urgency: "ROUTINE", units_requested: 1, expected_offering_version: "${off_a_v}" }
              as: CHW
              as_user_id: "${w1}"
              captures: { r1: $.data.id }
          trigger:
            - call: "POST /chw/referrals/${r1}/respond"
              payload: { decision: "ACCEPTED" }
              as: ResourcePartner
              as_user_id: "${org_b}"
              captures: { err_id: $.data.error_id }
            - call: "POST /chw/referrals/${r1}/respond"
              payload: { decision: "ACCEPTED" }
              as: ResourcePartner
              as_user_id: "${org_a}"
          assert:
            - "${err_id} == ERR_NOT_RESOURCE_OWNER with HTTP status 403"
            - "Referral.${r1}.status == ACCEPTED after the owning organization responds"
            - "ResourceOffering.${off_a}.allocated_units == 1 — acceptance retains the hold"
            - "ResourceOffering.${off_a}.available_units == 2"

      - name: write_gate_exempt_endpoints_still_operate_under_records_hold
        claim_type: Conditional validation
        grounds:
          - write_gate.exempt_operations
          - validations[priority=6]
          - state_machines.Patient.OPEN_to_RECORDS_HOLD
        distinguishing_aspect: "The rung-4 gate covers POST /chw/goals but explicitly exempts POST /chw/home-visits/{id}/cancel and POST /chw/escalations/{id}/acknowledge: under one records hold the first is refused with ERR_PATIENT_RECORDS_HOLD while the other two succeed."
        test_recipe:
          setup:
            - "Logical clock at 2026-06-01T00:00:00Z."
            - "One worker and one ENROLLED patient carrying one SCHEDULED HomeVisit and one OPEN_TIER_1 Escalation opened by the CHW."
            - "The patient is then placed on RECORDS_HOLD."
          setup_api_calls:
            - call: "POST /chw/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /chw/workers"
              payload: { full_name: "Ana Reyes", employee_code: "C-048" }
              as: ProgramAdmin
              captures: { w1: $.data.id }
            - call: "POST /chw/patients"
              payload: { mrn: "MRN-C48", full_name: "Gate Scope Case", household_size: 2, monthly_income_cents: 100000, residence_zip: "60614" }
              as: CHW
              as_user_id: "${w1}"
              captures: { p1: $.data.id }
            - call: "PATCH /chw/patients/${p1}"
              payload: { enrollment_action: "ENROLL" }
              as: Supervisor
              as_user_id: "sup-1"
            - call: "POST /chw/home-visits"
              payload: { patient_id: "${p1}", assigned_chw_id: "${w1}", scheduled_start: "2026-06-04T09:00:00Z", scheduled_end: "2026-06-04T10:00:00Z" }
              as: CHW
              as_user_id: "${w1}"
              captures: { v1: $.data.id }
            - call: "POST /chw/escalations"
              payload: { patient_id: "${p1}", note: "Food insecurity with a child in the home" }
              as: CHW
              as_user_id: "${w1}"
              captures: { x1: $.data.id }
            - call: "POST /chw/patients/${p1}/records-hold"
              payload: { action: "PLACE", reason: "Consent withdrawn" }
              as: Supervisor
              as_user_id: "sup-1"
          trigger:
            - call: "POST /chw/goals"
              payload: { patient_id: "${p1}", domain: "FOOD", direction: "INCREASE_GOOD", baseline_value: 1, target_value: 5 }
              as: CHW
              as_user_id: "${w1}"
              captures: { err_id: $.data.error_id }
            - call: "POST /chw/home-visits/${v1}/cancel"
              payload: {}
              as: CHW
              as_user_id: "${w1}"
            - call: "POST /chw/escalations/${x1}/acknowledge"
              payload: {}
              as: Supervisor
              as_user_id: "sup-1"
          assert:
            - "${err_id} == ERR_PATIENT_RECORDS_HOLD with HTTP status 409"
            - "HomeVisit.${v1}.scheduling_status == CANCELLED — the cancel endpoint is exempt"
            - "Escalation.${x1}.status == ACKNOWLEDGED — the acknowledge endpoint is exempt"
            - "Escalation.${x1}.acknowledged_by_user_id == sup-1"
            - "Patient.${p1}.gate_status == RECORDS_HOLD"
            - "GET /chw/goals with patient_id=${p1} returns total_count == 0 — reads are never gated"

      - name: write_gate_skipped_when_body_patient_id_does_not_resolve
        claim_type: Cascading validation
        grounds:
          - write_gate.subject_resolution
          - validations[priority=6]
          - validations[priority=8]
          - validations[priority=11]
        distinguishing_aspect: "When the body's patient_id resolves to nothing the rung-4 gate is SKIPPED, so a bad enum falls through to ERR_VALIDATION (400) at rung 5 and a well-formed body falls through to ERR_PATIENT_NOT_FOUND (404) at rung 6 — the gate never masks either."
        test_recipe:
          setup:
            - "Logical clock at 2026-06-01T00:00:00Z."
            - "One worker; no patient carries the id used in the trigger bodies."
          setup_api_calls:
            - call: "POST /chw/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /chw/workers"
              payload: { full_name: "Ana Reyes", employee_code: "C-049" }
              as: ProgramAdmin
              captures: { w1: $.data.id }
          trigger:
            - call: "POST /chw/goals"
              payload: { patient_id: "8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", domain: "NUTRITION", direction: "INCREASE_GOOD", baseline_value: 1, target_value: 5 }
              as: CHW
              as_user_id: "${w1}"
              captures: { err_enum: $.data.error_id }
            - call: "POST /chw/goals"
              payload: { patient_id: "8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", domain: "FOOD", direction: "INCREASE_GOOD", baseline_value: 1, target_value: 5 }
              as: CHW
              as_user_id: "${w1}"
              captures: { err_missing: $.data.error_id }
          assert:
            - "${err_enum} == ERR_VALIDATION with HTTP status 400 — NUTRITION is not a declared domain"
            - "${err_missing} == ERR_PATIENT_NOT_FOUND with HTTP status 404"
            - "neither call returns ERR_PATIENT_RECORDS_HOLD"

      - name: remaining_eligibility_criterion_types_each_report_their_own_error
        claim_type: Violation to Error
        grounds:
          - validations[priority=29]
          - validations[priority=30]
          - validations[priority=31]
          - calculations.eligibility_gauntlet
        distinguishing_aspect: "Three offerings each carrying exactly one of the remaining criterion types produce three distinct 422 codes for the same patient: ERR_ELIGIBILITY_HOUSEHOLD_SIZE, ERR_ELIGIBILITY_PROGRAM_ENROLLMENT and ERR_ELIGIBILITY_CATEGORICAL_EXCLUSION."
        test_recipe:
          setup:
            - "Logical clock at 2026-06-01T00:00:00Z."
            - "One worker; one ENROLLED patient with household_size 2, program_enrollments empty and categorical_exclusions containing PRIOR_FRAUD_FINDING."
            - "One ACTIVE organization with three FOOD_BOX offerings of capacity_total 5, each carrying exactly one criterion: HOUSEHOLD_SIZE 4..8, PROGRAM_ENROLLMENT SNAP, and CATEGORICAL_EXCLUSION PRIOR_FRAUD_FINDING."
          setup_api_calls:
            - call: "POST /chw/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /chw/workers"
              payload: { full_name: "Ana Reyes", employee_code: "C-050" }
              as: ProgramAdmin
              captures: { w1: $.data.id }
            - call: "POST /chw/patients"
              payload: { mrn: "MRN-C50", full_name: "Gauntlet Case", household_size: 2, monthly_income_cents: 100000, residence_zip: "60614", categorical_exclusions: ["PRIOR_FRAUD_FINDING"] }
              as: CHW
              as_user_id: "${w1}"
              captures: { p1: $.data.id }
            - call: "PATCH /chw/patients/${p1}"
              payload: { enrollment_action: "ENROLL" }
              as: Supervisor
              as_user_id: "sup-1"
            - call: "POST /chw/resource-orgs"
              payload: { name: "Northside Pantry", org_type: "FOOD", service_zips: ["60614"], contact_email: "ops@northside.example" }
              as: ProgramAdmin
              captures: { org1: $.data.id }
            - call: "POST /chw/offerings"
              payload: { resource_org_id: "${org1}", unit_type: "FOOD_BOX", capacity_total: 5 }
              as: ProgramAdmin
              captures: { off_h: $.data.id, off_h_v: $.data.version }
            - call: "POST /chw/offerings/${off_h}/criteria"
              payload: { criterion_type: "HOUSEHOLD_SIZE", min_household_size: 4, max_household_size: 8 }
              as: ProgramAdmin
            - call: "POST /chw/offerings"
              payload: { resource_org_id: "${org1}", unit_type: "FOOD_BOX", capacity_total: 5 }
              as: ProgramAdmin
              captures: { off_p: $.data.id, off_p_v: $.data.version }
            - call: "POST /chw/offerings/${off_p}/criteria"
              payload: { criterion_type: "PROGRAM_ENROLLMENT", required_program_code: "SNAP" }
              as: ProgramAdmin
            - call: "POST /chw/offerings"
              payload: { resource_org_id: "${org1}", unit_type: "FOOD_BOX", capacity_total: 5 }
              as: ProgramAdmin
              captures: { off_x: $.data.id, off_x_v: $.data.version }
            - call: "POST /chw/offerings/${off_x}/criteria"
              payload: { criterion_type: "CATEGORICAL_EXCLUSION", excluded_flag_code: "PRIOR_FRAUD_FINDING" }
              as: ProgramAdmin
          trigger:
            - call: "POST /chw/referrals"
              payload: { patient_id: "${p1}", offering_id: "${off_h}", opened_by_chw_id: "${w1}", urgency: "ROUTINE", units_requested: 1, expected_offering_version: "${off_h_v}" }
              as: CHW
              as_user_id: "${w1}"
              captures: { err_h: $.data.error_id }
            - call: "POST /chw/referrals"
              payload: { patient_id: "${p1}", offering_id: "${off_p}", opened_by_chw_id: "${w1}", urgency: "ROUTINE", units_requested: 1, expected_offering_version: "${off_p_v}" }
              as: CHW
              as_user_id: "${w1}"
              captures: { err_p: $.data.error_id }
            - call: "POST /chw/referrals"
              payload: { patient_id: "${p1}", offering_id: "${off_x}", opened_by_chw_id: "${w1}", urgency: "ROUTINE", units_requested: 1, expected_offering_version: "${off_x_v}" }
              as: CHW
              as_user_id: "${w1}"
              captures: { err_x: $.data.error_id }
          assert:
            - "${err_h} == ERR_ELIGIBILITY_HOUSEHOLD_SIZE with HTTP status 422"
            - "${err_p} == ERR_ELIGIBILITY_PROGRAM_ENROLLMENT with HTTP status 422"
            - "${err_x} == ERR_ELIGIBILITY_CATEGORICAL_EXCLUSION with HTTP status 422"
            - "ResourceOffering.${off_h}.available_units == 5 and ResourceOffering.${off_p}.available_units == 5 and ResourceOffering.${off_x}.available_units == 5"
            - "GET /chw/referrals with patient_id=${p1} returns total_count == 0"

      - name: two_person_visit_rule_enforced_for_safety_flagged_address
        claim_type: Violation to Error
        grounds:
          - validations[priority=26]
          - errors[ERR_TWO_PERSON_VISIT_REQUIRED]
        excluded_because:
          difficulty_instance: enrollment_rung9_preempts_two_person_safety_rung11
          rationale: "That instance's second trigger call issues the identical request against an ENROLLED safety-flagged patient and asserts ERR_TWO_PERSON_VISIT_REQUIRED with HTTP 422."

      - name: records_hold_gate_outranks_payload_validation
        claim_type: Priority Ordering
        grounds:
          - validations[priority=6]
          - validations[priority=9]
        excluded_because:
          difficulty_instance: write_gate_rung4_preempts_payload_rung5
          rationale: "That instance sends a rung-5-violating goal body for a gated patient and asserts ERR_PATIENT_RECORDS_HOLD."

  # =========================================================================
  # SECTION: endpoints
  # =========================================================================
  - section: endpoints
    instances:

      - name: eligibility_check_endpoint_has_no_side_effects
        claim_type: Computed read
        grounds:
          - endpoints.POST./chw/offerings/{id}/eligibility-check
          - calculations.eligibility_gauntlet
        distinguishing_aspect: "The eligibility-check endpoint is a pure read: two consecutive calls return identical bodies, no Referral is created, and every inventory counter on the offering stays at its initial value."
        test_recipe:
          setup:
            - "Logical clock at 2026-06-01T00:00:00Z."
            - "One worker; one ENROLLED patient in ZIP 60614 with income 100000."
            - "One FOOD_BOX offering of capacity_total 3 carrying a single INCOME_BAND criterion of 200000."
          setup_api_calls:
            - call: "POST /chw/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /chw/workers"
              payload: { full_name: "Ana Reyes", employee_code: "C-060" }
              as: ProgramAdmin
              captures: { w1: $.data.id }
            - call: "POST /chw/patients"
              payload: { mrn: "MRN-C60", full_name: "Pure Read Case", household_size: 2, monthly_income_cents: 100000, residence_zip: "60614" }
              as: CHW
              as_user_id: "${w1}"
              captures: { p1: $.data.id }
            - call: "PATCH /chw/patients/${p1}"
              payload: { enrollment_action: "ENROLL" }
              as: Supervisor
              as_user_id: "sup-1"
            - call: "POST /chw/resource-orgs"
              payload: { name: "Northside Pantry", org_type: "FOOD", service_zips: ["60614"], contact_email: "ops@northside.example" }
              as: ProgramAdmin
              captures: { org1: $.data.id }
            - call: "POST /chw/offerings"
              payload: { resource_org_id: "${org1}", unit_type: "FOOD_BOX", capacity_total: 3 }
              as: ProgramAdmin
              captures: { off1: $.data.id, off1_v1: $.data.version }
            - call: "POST /chw/offerings/${off1}/criteria"
              payload: { criterion_type: "INCOME_BAND", max_monthly_income_cents: 200000 }
              as: ProgramAdmin
          trigger:
            - call: "POST /chw/offerings/${off1}/eligibility-check"
              payload: { patient_id: "${p1}" }
              as: CHW
              as_user_id: "${w1}"
            - call: "POST /chw/offerings/${off1}/eligibility-check"
              payload: { patient_id: "${p1}" }
              as: Supervisor
              as_user_id: "sup-1"
          assert:
            - "both responses report eligible == true and evaluated_count == 1"
            - "both responses report first_failing_criterion_id == null"
            - "ResourceOffering.${off1}.available_units == 3"
            - "ResourceOffering.${off1}.allocated_units == 0"
            - "ResourceOffering.${off1}.lifetime_allocated_units == 0"
            - "ResourceOffering.${off1}.availability_state == AVAILABLE"
            - "GET /chw/referrals with offering_id=${off1} returns total_count == 0"

      - name: logical_clock_default_is_the_declared_startup_instant
        claim_type: Action endpoint
        grounds:
          - endpoints.POST./chw/_clock/set_current_utc
          - calculations.escalation_tier_deadline
        distinguishing_aspect: "Before any POST /chw/_clock/set_current_utc call the clock reads exactly 2026-05-01T00:00:00Z, so a manually opened escalation carries tier_entered_at 2026-05-01T00:00:00.000Z and ack_deadline_at 2026-05-03T00:00:00.000Z from the 48-hour tier-1 SLA."
        test_recipe:
          setup:
            - "Empty database and an untouched logical clock — the trigger chain never calls the clock endpoint."
          setup_api_calls:
            - call: "POST /chw/workers"
              payload: { full_name: "Ana Reyes", employee_code: "C-061" }
              as: ProgramAdmin
              captures: { w1: $.data.id }
            - call: "POST /chw/patients"
              payload: { mrn: "MRN-C61", full_name: "Clock Default Case", household_size: 2, monthly_income_cents: 100000, residence_zip: "60614" }
              as: CHW
              as_user_id: "${w1}"
              captures: { p1: $.data.id }
            - call: "PATCH /chw/patients/${p1}"
              payload: { enrollment_action: "ENROLL" }
              as: Supervisor
              as_user_id: "sup-1"
          trigger:
            - call: "POST /chw/escalations"
              payload: { patient_id: "${p1}", note: "Opened against the default clock" }
              as: CHW
              as_user_id: "${w1}"
              captures: { x1: $.data.id }
          assert:
            - "Escalation.${x1}.tier_entered_at == 2026-05-01T00:00:00.000Z"
            - "Escalation.${x1}.ack_deadline_at == 2026-05-03T00:00:00.000Z"
            - "Escalation.${x1}.status == OPEN_TIER_1"
            - "Escalation.${x1}.current_tier == 1"
            - "Escalation.${x1}.promotion_count == 0"

      - name: run_sweep_returns_counter_summary
        claim_type: Action endpoint
        grounds:
          - endpoints.POST./chw/ops/run-sweep
        excluded_because:
          difficulty_instance: records_hold_depth_five_cascade_to_escalation_auto_resolution
          rationale: "Sweep counter semantics are asserted by the corner instances referral_lapse_sweep_at_exact_deadline_changes_nothing and escalation_tier3_is_the_promotion_ceiling, which pin referrals_lapsed and escalations_promoted directly."

      - name: program_summary_is_derived_never_stored
        claim_type: Computed read
        grounds:
          - calculations.program_report_rollups
        excluded_because:
          difficulty_instance: upheld_appeal_conserves_encounter_minutes_by_funding_source
          rationale: "That instance reads the report immediately after a compensating action and shows the rollups tracking the new entity state with nothing persisted."

