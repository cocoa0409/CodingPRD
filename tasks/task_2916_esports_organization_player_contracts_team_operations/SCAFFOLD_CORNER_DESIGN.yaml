          - errors[ERR_MOVE_NOT_APPROVED]
          - errors[ERR_MOVE_NOT_EXECUTED]
          - errors[ERR_MOVE_NOT_PENDING]
          - errors[ERR_MOVE_NOT_REVERSIBLE]
