              as: LicensingManager
              captures: { bp1_ag: $.data.id }
            - call: "POST /license-agreements/${bp1_ag}/transition"
              payload: { target_state: "ACTIVE" }
              as: LicensingManager
            - call: "POST /license-agreements/${bp1_ag}/quality-audits"
              payload: { audited_at: "2026-05-01T00:00:00Z", cup_score: 90, defect_rate_ppm: 50 }
              as: QualityAuditor
            - call: "POST /license-agreements/${bp1_ag}/royalty-statements"
              payload: { period: "2026-08", sell_in_units: 1, sell_through_units: 1000000, unlicensed_share_pct: 0 }
              as: FinanceAnalyst
              captures: { bp1_s1: $.data.id }
          trigger:
            - call: "POST /royalty-statements/${bp1_s1}/transition"
