              captures: { block_v7: $.data.version }
          trigger:
            - call: "POST /housing/hotel-blocks/${block_id}/terms"
              payload: { negotiated_nightly_rate_cents: 23400, commission_pct: 0.13, rebate_per_room_night_cents: 700, cutoff_date: "2026-08-21", reduction_rights_pct: 0.20, expected_hotel_block_version: "${block_v7}" }
