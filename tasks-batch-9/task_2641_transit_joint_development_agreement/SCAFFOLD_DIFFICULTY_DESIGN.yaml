  - rule_id: compensating_invariant
    instances:
      - name: federal_interest_ledger_conserved_across_filing_and_withdrawal
        grounds:
          - calculations.federal_interest_amount
          - state_machines.FederalDispositionRequest.PENDING_to_WITHDRAWN
          - endpoints[POST /jda/agreements/{id}/disposition-requests]
          - endpoints[POST /jda/disposition-requests/{id}/withdraw]
          - entities.AgencySite.fields.federal_interest_encumbered_cents
          - entities.AgencySite.fields.federal_interest_unencumbered_cents
        distinguishing_aspect: |
          The conserved quantity is a MONEY ledger denominated in cents: filing the disposition request moves
          727500 cents from the site's unencumbered column into the encumbered column, and withdrawing moves
          exactly the same 727500 back, so encumbered + unencumbered == federal_interest_basis_cents 1212500
          at all three checkpoints (pre-filing, post-filing, post-withdrawal) with zero drift.
        test_recipe:
          setup:
            - "Logical clock pinned at 2026-08-01T00:00:00Z"
            - "Federally funded site with federal_interest_pct 2.5 and a CERTIFIED valuation at 48500000 cents, pinning federal_interest_basis_cents = 1212500"
            - "BOARD_APPROVED agreement with site_area_share_pct 60"
