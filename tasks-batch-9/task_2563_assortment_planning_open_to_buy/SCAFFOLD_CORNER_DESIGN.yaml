            - "all eight unknown-id reads return HTTP 404"
            - "${e_dept} == ERR_DEPARTMENT_NOT_FOUND, ${e_clu} == ERR_STORE_CLUSTER_NOT_FOUND, ${e_va} == ERR_VENDOR_AUTHORIZATION_NOT_FOUND, ${e_op} == ERR_OPTION_PLAN_NOT_FOUND"
            - "${e_rc} == ERR_RECEIPT_COMMITMENT_NOT_FOUND, ${e_cyc} == ERR_REFORECAST_CYCLE_NOT_FOUND, ${e_dec} == ERR_CHASE_CANCEL_DECISION_NOT_FOUND, ${e_ov} == ERR_LOCALIZATION_OVERLAY_NOT_FOUND"
