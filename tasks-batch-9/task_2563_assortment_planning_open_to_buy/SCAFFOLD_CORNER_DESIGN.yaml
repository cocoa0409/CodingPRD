              payload: {}
              as: CategoryBuyer
              as_user_id: "buyer-1"
              captures: { base_mult: $.data.effective_overlay_multiplier_bps, base_st: $.data.sell_through_bps, base_basis: $.data.sell_through_basis }
            - call: "POST /otb/assortment-items/${item_id}/activate"
              payload: {}
              as: CategoryBuyer
              as_user_id: "buyer-1"
