            - { call: "POST /midway/crew-shifts", payload: { staff_id: "${crew_id}", work_date: "2026-08-01", start_hour: 6, end_hour: 10, shift_role: "SETUP", expected_staff_version: "${crew_v}" }, as: FairManager, as_user_id: "${sup_id}" }
            - { call: "POST /midway/rides/${ride_id}/verify-assembly", payload: {}, as: CrewMember, as_user_id: "${crew_id}" }
            - { call: "POST /midway/fairs/${fair_id}/request-permit", payload: {}, as: FairManager, as_user_id: "${sup_id}", captures: { permit_id: "$.data.id" } }
