          inspection_valid_until is stamped at clock + 24h and priority 32 guards two different
          endpoints, so the same expiry must be enforced on the terrain opening decision AND on the lift
          service-status transition. The season is created with groom_freshness_hours 48 precisely so the
          25-hour clock advance does not trip priority 26 first and mask the result. mechanical_status
