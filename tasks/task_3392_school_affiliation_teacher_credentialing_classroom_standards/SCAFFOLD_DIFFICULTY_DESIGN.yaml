# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Task: task_3392_school_affiliation_teacher_credentialing_classroom_standards
# Two instances per §0.5 rule; every instance replays against SCAFFOLD §1.5.
# =============================================================================
scaffold_difficulty_design:

  - rule_id: dual_variant_calc
    instances:

      - name: credential_ce_cycle_vs_rolling_window
        grounds:
          - calculations.ce_hours_qualification
          - entities.Credential.fields.ce_hours_cycle_credited
          - entities.Credential.fields.ce_hours_rolling_credited
        distinguishing_aspect: "Credential domain: after a renewal rebases cycle_start to 2029-06-01, the identical CE ledger yields ce_hours_cycle_credited == 10.0 (CYCLE: earned_at >= cycle_start) but ce_hours_rolling_credited == 40.0 (ROLLING: trailing 36 months), because the two 2027 entries fall out of CYCLE but stay inside ROLLING."
        test_recipe:
          setup:
            - "ACTIVE catalog: ce_hours_required 30, credential_validity_months 36, renewal_window_months 3, renewal_grace_months 6."
            - "ACCREDITED program with learner credentialed EARLY_CHILDHOOD on 2026-09-01 via an unsupervised VERIFIED placement (540 hours = target)."
            - "CE ledger: 18h (event ended 2027-02-01) + 12h (event ended 2027-03-01); renewal at 2029-06-01 (window opening day, fee 8500); then 10h (event ended 2030-01-10)."
          setup_api_calls:
            - &clk_start
              call: "POST /society/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: SocietyAdmin
            - &cat_create
              call: "POST /society/standards-catalogs"
              payload:
                version_label: "Standards 2026"
                effective_from: "2026-01-01"
                min_uninterrupted_work_minutes_by_level: { INFANT_TODDLER: 90, EARLY_CHILDHOOD: 180, ELEMENTARY_I: 180, ELEMENTARY_II: 180, SECONDARY: 120 }
                max_students_per_adult_by_level: { INFANT_TODDLER: 5, EARLY_CHILDHOOD: 15, ELEMENTARY_I: 15, ELEMENTARY_II: 16, SECONDARY: 20 }
                materials_pass_threshold: 0.9
                min_multi_age_span_years_by_level: { INFANT_TODDLER: 2, EARLY_CHILDHOOD: 3, ELEMENTARY_I: 3, ELEMENTARY_II: 3, SECONDARY: 2 }
                practicum_min_hours_by_level: { INFANT_TODDLER: 300, EARLY_CHILDHOOD: 540, ELEMENTARY_I: 540, ELEMENTARY_II: 540, SECONDARY: 400 }
                ce_hours_required: 30
                credential_validity_months: 36
                renewal_window_months: 3
                renewal_grace_months: 6
                min_membership_months_before_accreditation: 12
                consultant_travel_buffer_days: 1
                plan_response_days: 30
              as: SocietyAdmin
              captures: { cat_id: $.data.id }
            - &cat_activate
              call: "POST /society/standards-catalogs/${cat_id}/activate"
              payload: {}
              as: SocietyAdmin
            - call: "POST /society/teacher-education-programs"
              payload: { name: "Cascade TEP", age_levels_offered: ["EARLY_CHILDHOOD"], course_contact_hours_by_level: { EARLY_CHILDHOOD: 300 }, practicum_hours_by_level: { EARLY_CHILDHOOD: 540 } }
              as: SocietyAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /society/teacher-education-programs/${prog_id}/status"
              payload: { to_status: "ACCREDITED" }
              as: AccreditationReviewer
            - call: "POST /society/adult-learners"
              payload: { program_id: "${prog_id}", full_name: "Ada Lovelace", age_level: "EARLY_CHILDHOOD" }
              as: ProgramDirector
              as_user_id: "${prog_id}"
              captures: { lrn_id: $.data.id }
            - call: "POST /society/schools"
              payload: { name: "Harbor View", display_name: "Harbor View School", uses_method_name: false, contact_email: "hv@x.org" }
              as: SocietyAdmin
              captures: { host_id: $.data.id }
            - call: "POST /society/schools/${host_id}/dues-payments"
              payload: { period_start: "2026-09-01", period_end: "2027-09-01", amount_cents: 60000 }
              as: SocietyAdmin
              captures: { host_v: $.data.version }
            - call: "POST /society/classrooms"
              payload: { school_id: "${host_id}", name: "Room 1", age_level: "EARLY_CHILDHOOD", declared_age_span_years: 3, enrolled_student_count: 20, assistant_count: 1 }
              as: SchoolAdmin
              as_user_id: "${host_id}"
            - call: "POST /society/school-applications"
              payload: { school_id: "${host_id}", type: "AFFILIATION", expected_school_version: "${host_v}" }
              as: SchoolAdmin
              as_user_id: "${host_id}"
              captures: { happ_id: $.data.id }
            - call: "POST /society/school-applications/${happ_id}/submit"
              payload: {}
              as: SchoolAdmin
              as_user_id: "${host_id}"
            - call: "POST /society/school-applications/${happ_id}/review"
              payload: { outcome: "APPROVED" }
              as: AccreditationReviewer
            - call: "POST /society/practicum-placements"
              payload: { learner_id: "${lrn_id}", host_school_id: "${host_id}", start_date: "2026-09-15", end_date: "2027-03-15" }
              as: ProgramDirector
              as_user_id: "${prog_id}"
              captures: { plc_id: $.data.id }
            - call: "POST /society/practicum-placements/${plc_id}/log-hours"
              payload: { hours: 300, work_date: "2026-10-01" }
              as: AdultLearner
              as_user_id: "${lrn_id}"
            - call: "POST /society/practicum-placements/${plc_id}/log-hours"
              payload: { hours: 240, work_date: "2026-11-01" }
              as: AdultLearner
              as_user_id: "${lrn_id}"
            - call: "POST /society/practicum-placements/${plc_id}/verify"
              payload: {}
              as: ProgramDirector
              as_user_id: "${prog_id}"
            - call: "POST /society/credentials"
              payload: { learner_id: "${lrn_id}", age_level: "EARLY_CHILDHOOD" }
              as: Registrar
              captures: { cred_id: $.data.id }
            - call: "POST /society/pd-events"
              payload: { title: "CE Workshop A", provider_name: "Society", start_at: "2027-01-31T09:00:00Z", end_at: "2027-02-01T17:00:00Z", ce_hours: 18 }
              as: SocietyAdmin
              captures: { e1_id: $.data.id }
            - call: "POST /society/pd-events"
              payload: { title: "CE Workshop B", provider_name: "Society", start_at: "2027-02-27T09:00:00Z", end_at: "2027-03-01T17:00:00Z", ce_hours: 12 }
              as: SocietyAdmin
              captures: { e2_id: $.data.id }
            - call: "POST /society/pd-events"
              payload: { title: "CE Workshop C", provider_name: "Society", start_at: "2030-01-09T09:00:00Z", end_at: "2030-01-10T17:00:00Z", ce_hours: 10 }
              as: SocietyAdmin
              captures: { e3_id: $.data.id }
            - call: "POST /society/_clock/set_current_utc"
              payload: { to_iso8601: "2027-03-02T00:00:00Z" }
              as: SocietyAdmin
            - call: "POST /society/pd-events/${e1_id}/attendance"
              payload: { credential_id: "${cred_id}" }
              as: SocietyAdmin
            - call: "POST /society/pd-events/${e2_id}/attendance"
              payload: { credential_id: "${cred_id}" }
              as: SocietyAdmin
            - call: "POST /society/_clock/set_current_utc"
              payload: { to_iso8601: "2029-06-01T00:00:00Z" }
              as: SocietyAdmin
            - call: "POST /society/credentials/${cred_id}/renew"
              payload: { fee_cents: 8500 }
              as: AdultLearner
              as_user_id: "${lrn_id}"
            - call: "POST /society/_clock/set_current_utc"
              payload: { to_iso8601: "2030-01-11T00:00:00Z" }
              as: SocietyAdmin
            - call: "POST /society/pd-events/${e3_id}/attendance"
              payload: { credential_id: "${cred_id}" }
              as: SocietyAdmin
            - call: "POST /society/_clock/set_current_utc"
              payload: { to_iso8601: "2030-01-15T00:00:00Z" }
              as: SocietyAdmin
          trigger:
            - call: "GET /society/credentials/${cred_id}"
              payload: {}
              as: Registrar
          assert:
            - "Credential.${cred_id}.ce_hours_cycle_credited == 10.0 (only the 2030-01-10 entry is on/after cycle_start 2029-06-01)"
            - "Credential.${cred_id}.ce_hours_rolling_credited == 40.0 (18 + 12 + 10 all earned within trailing 36 months of 2030-01-15)"
            - "Credential.${cred_id}.renewed_count == 1 and status == ACTIVE"
            - "date(Credential.${cred_id}.expires_at) == 2032-06-01"

      - name: school_clearance_latest_vs_no_fail_cycle
        grounds:
          - calculations.school_classroom_clearance
          - endpoints.POST_/society/school-applications/{id}/submit
          - errors.ERR_CLASSROOM_NONCOMPLIANT
        distinguishing_aspect: "School domain: the SAME audit pattern (one NONCOMPLIANT followed by one COMPLIANT inside the trailing 12-month window) lets school X's MEMBERSHIP submit succeed under LATEST_PASS while school Y's ACCREDITATION submit is rejected under NO_FAIL_IN_CYCLE with ERR_CLASSROOM_NONCOMPLIANT — the variants disagree on identical data."
        test_recipe:
          setup:
            - "School X: AFFILIATE, one classroom whose audit history is NONCOMPLIANT (2026-09-01) then COMPLIANT (2026-09-03); a MEMBERSHIP application in DRAFT."
            - "School Y: MEMBER since 2026-09-03 with ACCEPTED self-study and a COMPLIANT filed visit; classroom Y1 audited COMPLIANT 2026-09-03 (out of window), then NONCOMPLIANT 2027-10-15, then COMPLIANT 2027-10-16 (both in the trailing 12-month window of the submit date 2027-10-20); dues paid through 2028-09-02; an ACCREDITATION application in DRAFT."
          setup_api_calls:
            - *clk_start
            - *cat_create
            - *cat_activate
            - call: "POST /society/schools"
              payload: { name: "X School", display_name: "X Schoolhouse", uses_method_name: false, contact_email: "x@x.org" }
              as: SocietyAdmin
              captures: { x_id: $.data.id }
            - call: "POST /society/schools/${x_id}/dues-payments"
