            - "${e2} == ERR_RATE_CARD_SHAPE_INVALID (422) — rate_type PER_CASE requires flat_rate_cents_per_case and forbids percent_bps"
            - "${e3} == ERR_RATE_CARD_SHAPE_INVALID (422) — a single-entry ladder is below the 2-entry minimum"
            - "${e4} == ERR_RATE_CARD_SHAPE_INVALID (422) — the first min_cases must be 0"
            - "${e5} == ERR_RATE_CARD_SHAPE_INVALID (422) — min_cases must be strictly increasing"
            - "${e6} == ERR_RATE_CARD_SHAPE_INVALID (422) — every rate_cents_per_case must be >= 1"
