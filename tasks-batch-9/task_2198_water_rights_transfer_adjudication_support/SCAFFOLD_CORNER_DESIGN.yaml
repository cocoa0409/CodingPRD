            - {call: "POST /hcu-studies/${st}/certify", payload: {expected_water_right_version: "${wr_v1}"}, as: WaterRightsAnalyst}
            - {call: "POST /transfer-applications", payload: {water_right_id: "${wr}", hcu_study_id: "${st}", application_type: CHANGE_OF_USE, requested_af: 100.00, proposed_purpose_of_use: MUNICIPAL}, as: WaterRightsAnalyst, captures: {app: "$.data.id"}}
            - {call: "POST /transfer-applications/${app}/injury-analyses", payload: {method: SEASONAL_AVERAGE, pod_move_miles: 0.00}, as: WaterRightsAnalyst}
            - {call: "GET /water-rights/${wr}", as: WaterRightsAnalyst, captures: {wr_v2: "$.data.version"}}
            - {call: "POST /transfer-applications/${app}/submit", payload: {expected_water_right_version: "${wr_v2}"}, as: WaterRightsAnalyst}
            - {call: "POST /transfer-applications/${app}/publish", as: WaterRightsAnalyst}
            - {call: "POST /protests", payload: {transfer_application_id: "${app}", protestant_claimant_id: "${cl_b}", claimed_injury_af: 12.00, basis: INJURY_TO_SENIOR_RIGHT}, as: Claimant, as_user_id: "${cl_b}", captures: {pr: "$.data.id"}}
          trigger:
            - {call: "POST /protests/${pr}/resolve", payload: {outcome: STIPULATE, resolution_note: "resolving before routing", stipulated_offset_af: 5.00}, as: HearingOfficer, captures: {e1: "$.data.error_id"}}
            - {call: "POST /protests/${pr}/route", payload: {track: NEGOTIATION}, as: HearingOfficer}
            - {call: "POST /protests/${pr}/resolve", payload: {outcome: DISMISS, resolution_note: "dismissal attempted on the negotiation track"}, as: HearingOfficer, captures: {e2: "$.data.error_id"}}
            - {call: "POST /protests/${pr}/route", payload: {track: HEARING}, as: HearingOfficer, captures: {e3: "$.data.error_id"}}
