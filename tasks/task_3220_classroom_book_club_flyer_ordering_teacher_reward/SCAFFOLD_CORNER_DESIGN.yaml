              as: ClubAdmin
            - call: "GET /club/schools/${cc3}"
              payload: {}
              as: ClubAdmin
          assert:
            - "at default clock 2026-09-01: active_fair_id is null"
            - "at 2026-10-05 (inclusive start): active_fair_id == ${cc3f}"

