          assert:
            - "grant == GRANTED (cycle enters GOLD_CARDED)"
            - "st_after_d1 == GOLD_CARDED and rate_after_d1 == 0.9091 (10/11; first denial does not cross the threshold)"
            - "st_after_d2 == SUSPENDED and rate_after_d2 == 0.8333 (10/12 < 0.90 with count >= 10 triggers auto-suspension)"
            - "cat_after_d2 == null (category cleared on suspension) and susp_ev == GOLD_CARD_SUSPENDED"
            - "cnt_after_void == 10 and rate_after_void == 1.0 (voided denials are excluded from stats)"
            - "decision2 == REINSTATED and final_status == GOLD_CARDED and final_cat == IMAGING (cycle closes)"

  # ------------------------------------------------------------- Rule 4 -------
  - rule_id: transitive_cascade
    instances:
      - name: appeal_overturn_cascade_depth3
        grounds:
          - state_machines.Appeal.IN_REVIEW_to_OVERTURNED
          - state_machines.Determination.FINAL_to_OVERTURNED
          - state_machines.PriorAuthRequest.DENIED_to_APPROVED
          - calculations.provider_approval_stats
        distinguishing_aspect: |
          Trigger: appeal decide OVERTURNED. Depth-3 chain where each link is
          caused by the previous one: appeal mutation -> determination flips
          FINAL->OVERTURNED -> request flips DENIED->APPROVED -> provider
          rolling/lifetime approval counters increment (+ event
          APPEAL_OVERTURNED). Not a fan-out: the provider mutation is caused by
          the request/determination mutation, not by the decide call directly.
        test_recipe:
          setup:
            - "Active criteria set; provider P; one request DENIED by reviewer u-rev-1 (determination d1); appeal a1 in IN_REVIEW assigned to u-ar-1"
          setup_api_calls:
            - { call: "POST /um/criteria-sets", payload: { name: "Spine Imaging Criteria", line_of_business: "COMMERCIAL", service_category: "IMAGING" }, as: ClinicalPolicyEditor, captures: { cs_id: $.data.id, cs_v: $.data.version } }
            - { call: "POST /um/criteria-sets/${cs_id}/guideline-versions", payload: { version_label: "1.0", content: "MRI lumbar spine criteria", auto_approve_eligible: false, effective_from: "2026-01-01T00:00:00Z" }, as: ClinicalPolicyEditor, captures: { gv_id: $.data.id } }
            - { call: "POST /um/guideline-versions/${gv_id}/transition", payload: { to_status: "PUBLISHED", expected_criteria_set_version: "${cs_v}" }, as: ClinicalPolicyEditor }
            - { call: "POST /um/criteria-sets/${cs_id}/transition", payload: { to_status: "ACTIVE" }, as: ClinicalPolicyEditor }
            - { call: "POST /um/providers", payload: { npi: "1000000008", name: "Cascade Provider" }, as: UMAdmin, captures: { p_id: $.data.id } }
            - { call: "POST /um/prior-auth-requests", payload: { provider_id: "${p_id}", member_ref: "M-01", criteria_set_id: "${cs_id}", service_code: "72148", urgency: "STANDARD", intake_channel: "FAX", documentation_complete: false }, as: IntakeSpecialist, captures: { req: $.data.id } }
            - { call: "POST /um/prior-auth-requests/${req}/reviewer-decision", payload: { decision: "DENY", reason_code: "EXPERIMENTAL_INVESTIGATIONAL" }, as: ClinicalReviewer, as_user_id: "u-rev-1" }
            - { call: "GET /um/determinations", payload: { request_id: "${req}" }, as: UMAdmin, captures: { d1: "$.data[0].id" } }
            - { call: "POST /um/determinations/${d1}/appeals", payload: { appeal_reason: "New clinical evidence" }, as: AppealsClerk, captures: { a1: $.data.id } }
            - { call: "POST /um/appeals/${a1}/begin-review", payload: {}, as: AppealsReviewer, as_user_id: "u-ar-1" }
          trigger:
            - { call: "POST /um/appeals/${a1}/decide", payload: { outcome: "OVERTURNED" }, as: AppealsReviewer, as_user_id: "u-ar-1", captures: { a_status: $.data.status } }
            - { call: "GET /um/determinations/${d1}", payload: {}, as: UMAdmin, captures: { d_status: $.data.status } }
            - { call: "GET /um/prior-auth-requests/${req}", payload: {}, as: UMAdmin, captures: { r_status: $.data.status } }
            - { call: "GET /um/providers/${p_id}", payload: {}, as: UMAdmin, captures: { p_appr: $.data.rolling_approval_count, p_cnt: $.data.rolling_determination_count, p_life_appr: $.data.lifetime_approval_count } }
            - { call: "GET /um/prior-auth-requests/${req}/compliance-events", payload: { event_type: "APPEAL_OVERTURNED" }, as: UMAdmin, captures: { ev: "$.data[0].event_type" } }
          assert:
            - "a_status == OVERTURNED"
            - "d_status == OVERTURNED (link 1: appeal mutation mutated the determination)"
            - "r_status == APPROVED (link 2: determination mutation mutated the request)"
            - "p_appr == 1 and p_life_appr == 1 and p_cnt == 1 (link 3: request mutation recomputed provider stats; the overturned denial now counts as an approval)"
            - "ev == APPEAL_OVERTURNED"

      - name: audit_finding_suspend_cascade_depth2
        grounds:
          - state_machines.DelegationArrangement.ACTIVE_to_SUSPENDED
          - state_machines.DelegationArrangement.SUSPENDED_to_ACTIVE
          - calculations.delegation_deficiency_threshold
          - errors[ERR_DELEGATION_SUSPENDED]
        distinguishing_aspect: |
          Trigger: audit-finding create (different trigger than the appeal
          cascade). Depth-2 chain: finding insert -> arrangement
          open_deficiency_count recompute -> arrangement flips ACTIVE->
          SUSPENDED at the third deficiency -> DELEGATION_SUSPENDED
          ComplianceEvent is created; the suspension then blocks new intake for
          the criteria set. Close of one finding reverses the chain
          (SUSPENDED -> ACTIVE).
        test_recipe:
          setup:
            - "Active criteria set with a delegation arrangement; provider with 3 denied requests (determinations d1..d3) in scope"
          setup_api_calls:
            - { call: "POST /um/criteria-sets", payload: { name: "Spine Imaging Criteria", line_of_business: "COMMERCIAL", service_category: "IMAGING" }, as: ClinicalPolicyEditor, captures: { cs_id: $.data.id, cs_v: $.data.version } }
            - { call: "POST /um/criteria-sets/${cs_id}/guideline-versions", payload: { version_label: "1.0", content: "MRI lumbar spine criteria", auto_approve_eligible: false, effective_from: "2026-01-01T00:00:00Z" }, as: ClinicalPolicyEditor, captures: { gv_id: $.data.id } }
            - { call: "POST /um/guideline-versions/${gv_id}/transition", payload: { to_status: "PUBLISHED", expected_criteria_set_version: "${cs_v}" }, as: ClinicalPolicyEditor }
            - { call: "POST /um/criteria-sets/${cs_id}/transition", payload: { to_status: "ACTIVE" }, as: ClinicalPolicyEditor }
            - { call: "POST /um/providers", payload: { npi: "1000000009", name: "Delegated Provider" }, as: UMAdmin, captures: { p_id: $.data.id } }
            - { call: "POST /um/delegation-arrangements", payload: { delegating_plan_name: "Plan X", criteria_set_id: "${cs_id}" }, as: UMAdmin, captures: { arr: $.data.id, cnt0: $.data.open_deficiency_count } }
            - { call: "POST /um/prior-auth-requests", payload: { provider_id: "${p_id}", member_ref: "M-01", criteria_set_id: "${cs_id}", service_code: "72148", urgency: "STANDARD", intake_channel: "FAX", documentation_complete: false }, as: IntakeSpecialist, captures: { r1: $.data.id } }
            - { call: "POST /um/prior-auth-requests/${r1}/reviewer-decision", payload: { decision: "DENY", reason_code: "MEDICAL_NECESSITY_NOT_MET" }, as: ClinicalReviewer, as_user_id: "u-rev-1" }
            - { call: "POST /um/prior-auth-requests", payload: { provider_id: "${p_id}", member_ref: "M-02", criteria_set_id: "${cs_id}", service_code: "72148", urgency: "STANDARD", intake_channel: "FAX", documentation_complete: false }, as: IntakeSpecialist, captures: { r2: $.data.id } }
            - { call: "POST /um/prior-auth-requests/${r2}/reviewer-decision", payload: { decision: "DENY", reason_code: "MEDICAL_NECESSITY_NOT_MET" }, as: ClinicalReviewer, as_user_id: "u-rev-1" }
            - { call: "POST /um/prior-auth-requests", payload: { provider_id: "${p_id}", member_ref: "M-03", criteria_set_id: "${cs_id}", service_code: "72148", urgency: "STANDARD", intake_channel: "FAX", documentation_complete: false }, as: IntakeSpecialist, captures: { r3: $.data.id } }
            - { call: "POST /um/prior-auth-requests/${r3}/reviewer-decision", payload: { decision: "DENY", reason_code: "MEDICAL_NECESSITY_NOT_MET" }, as: ClinicalReviewer, as_user_id: "u-rev-1" }
            - { call: "GET /um/determinations", payload: { request_id: "${r1}" }, as: UMAdmin, captures: { d1: "$.data[0].id" } }
            - { call: "GET /um/determinations", payload: { request_id: "${r2}" }, as: UMAdmin, captures: { d2: "$.data[0].id" } }
            - { call: "GET /um/determinations", payload: { request_id: "${r3}" }, as: UMAdmin, captures: { d3: "$.data[0].id" } }
            - { call: "POST /um/delegation-arrangements/${arr}/audit-findings", payload: { determination_id: "${d1}", finding_type: "NOTICE_DEFICIENT" }, as: ComplianceOfficer, captures: { f1: $.data.id } }
            - { call: "GET /um/delegation-arrangements/${arr}", payload: {}, as: ComplianceOfficer, captures: { cnt1: $.data.open_deficiency_count, st1: $.data.status } }
            - { call: "POST /um/delegation-arrangements/${arr}/audit-findings", payload: { determination_id: "${d2}", finding_type: "CRITERIA_MISAPPLIED" }, as: ComplianceOfficer }
            - { call: "GET /um/delegation-arrangements/${arr}", payload: {}, as: ComplianceOfficer, captures: { cnt2: $.data.open_deficiency_count, st2: $.data.status } }
          trigger:
            - { call: "POST /um/delegation-arrangements/${arr}/audit-findings", payload: { determination_id: "${d3}", finding_type: "TAT_VIOLATION" }, as: ComplianceOfficer }
            - { call: "GET /um/delegation-arrangements/${arr}", payload: {}, as: ComplianceOfficer, captures: { cnt3: $.data.open_deficiency_count, st3: $.data.status } }
            - { call: "GET /um/compliance-events", payload: { event_type: "DELEGATION_SUSPENDED" }, as: ComplianceOfficer, captures: { susp_ev: "$.data[0].event_type" } }
            - { call: "POST /um/prior-auth-requests", payload: { provider_id: "${p_id}", member_ref: "M-04", criteria_set_id: "${cs_id}", service_code: "72148", urgency: "STANDARD", intake_channel: "FAX", documentation_complete: false }, as: IntakeSpecialist, captures: { blocked_err: $.data.error_id } }
            - { call: "POST /um/audit-findings/${f1}/transition", payload: { to_status: "CLOSED" }, as: ComplianceOfficer }
            - { call: "GET /um/delegation-arrangements/${arr}", payload: {}, as: ComplianceOfficer, captures: { cnt4: $.data.open_deficiency_count, st4: $.data.status } }
            - { call: "POST /um/prior-auth-requests", payload: { provider_id: "${p_id}", member_ref: "M-05", criteria_set_id: "${cs_id}", service_code: "72148", urgency: "STANDARD", intake_channel: "FAX", documentation_complete: false }, as: IntakeSpecialist, captures: { ok_status: $.data.status } }
          assert:
            - "cnt0 == 0, cnt1 == 1 and st1 == ACTIVE, cnt2 == 2 and st2 == ACTIVE"
            - "cnt3 == 3 and st3 == SUSPENDED (the third deficiency crossing triggers the flip)"
            - "susp_ev == DELEGATION_SUSPENDED (cascade produced the audit event)"
            - "blocked_err == ERR_DELEGATION_SUSPENDED (suspension gates new intake for the set)"
            - "cnt4 == 2 and st4 == ACTIVE (closing below the threshold auto-resumes)"
            - "ok_status == PENDED_REVIEW (intake unblocked after resume)"

  # ------------------------------------------------------------- Rule 5 -------
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: appeal_decide_state_priority_over_reviewer_assignment
        grounds:
          - validations[priority=6]
          - validations[priority=7]
          - errors[ERR_INVALID_APPEAL_STATE]
          - errors[ERR_NOT_ASSIGNED_REVIEWER]
        distinguishing_aspect: |
          Error-category pair: state vs business_safety. The trigger call
          violates both — the appeal is still RECEIVED (state) and the caller
          is not the assigned reviewer (business_safety) — and the state error
          ERR_INVALID_APPEAL_STATE must win because priority 6 < 7.
        test_recipe:
          setup:
            - "Active criteria set; provider; one request DENIED by u-rev-1; appeal a1 filed and still RECEIVED (reviewer_id null)"
          setup_api_calls:
            - { call: "POST /um/criteria-sets", payload: { name: "Spine Imaging Criteria", line_of_business: "COMMERCIAL", service_category: "IMAGING" }, as: ClinicalPolicyEditor, captures: { cs_id: $.data.id, cs_v: $.data.version } }
            - { call: "POST /um/criteria-sets/${cs_id}/guideline-versions", payload: { version_label: "1.0", content: "MRI lumbar spine criteria", auto_approve_eligible: false, effective_from: "2026-01-01T00:00:00Z" }, as: ClinicalPolicyEditor, captures: { gv_id: $.data.id } }
            - { call: "POST /um/guideline-versions/${gv_id}/transition", payload: { to_status: "PUBLISHED", expected_criteria_set_version: "${cs_v}" }, as: ClinicalPolicyEditor }
            - { call: "POST /um/criteria-sets/${cs_id}/transition", payload: { to_status: "ACTIVE" }, as: ClinicalPolicyEditor }
            - { call: "POST /um/providers", payload: { npi: "1000000010", name: "Priority Provider" }, as: UMAdmin, captures: { p_id: $.data.id } }
            - { call: "POST /um/prior-auth-requests", payload: { provider_id: "${p_id}", member_ref: "M-01", criteria_set_id: "${cs_id}", service_code: "72148", urgency: "STANDARD", intake_channel: "FAX", documentation_complete: false }, as: IntakeSpecialist, captures: { req: $.data.id } }
            - { call: "POST /um/prior-auth-requests/${req}/reviewer-decision", payload: { decision: "DENY", reason_code: "INSUFFICIENT_INFO" }, as: ClinicalReviewer, as_user_id: "u-rev-1" }
            - { call: "GET /um/determinations", payload: { request_id: "${req}" }, as: UMAdmin, captures: { d1: "$.data[0].id" } }
            - { call: "POST /um/determinations/${d1}/appeals", payload: { appeal_reason: "Records attached" }, as: AppealsClerk, captures: { a1: $.data.id } }
          trigger:
            - { call: "POST /um/appeals/${a1}/decide", payload: { outcome: "UPHELD" }, as: AppealsReviewer, as_user_id: "u-ar-9", captures: { err: $.data.error_id } }
            - { call: "GET /um/appeals/${a1}", payload: {}, as: AppealsClerk, captures: { a_status: $.data.status } }
          assert:
            - "err == ERR_INVALID_APPEAL_STATE (state category beats the business_safety reviewer-assignment failure)"
            - "a_status == RECEIVED (no side effects fired)"

      - name: guideline_supersedes_referential_beats_window_temporal
        grounds:
          - validations[priority=8]
          - validations[priority=10]
          - errors[ERR_SUPERSEDES_CROSS_SET]
          - errors[ERR_GUIDELINE_WINDOW_OVERLAP]
        distinguishing_aspect: |
          Error-category pair: business_referential vs business_temporal — a
          different pair than state-vs-safety. The publish payload violates
          both (supersedes_version_id points into another criteria set AND the
          window overlaps the set's published v1); ERR_SUPERSEDES_CROSS_SET
          must win because priority 8 < 10.
        test_recipe:
          setup:
            - "Set A (COMMERCIAL/IMAGING) with published vA1 window [2026-01-01, open)"
            - "Set B (MEDICARE/DME) with published vB1"
            - "Draft vD in set A: supersedes_version_id = vB1 (cross-set), effective_from 2026-06-01 (overlaps vA1's open window)"
          setup_api_calls:
            - { call: "POST /um/criteria-sets", payload: { name: "Set A", line_of_business: "COMMERCIAL", service_category: "IMAGING" }, as: ClinicalPolicyEditor, captures: { csa: $.data.id, csa_v: $.data.version } }
            - { call: "POST /um/criteria-sets/${csa}/guideline-versions", payload: { version_label: "1.0", content: "A criteria", auto_approve_eligible: false, effective_from: "2026-01-01T00:00:00Z" }, as: ClinicalPolicyEditor, captures: { gva: $.data.id } }
            - { call: "POST /um/guideline-versions/${gva}/transition", payload: { to_status: "PUBLISHED", expected_criteria_set_version: "${csa_v}" }, as: ClinicalPolicyEditor }
            - { call: "POST /um/criteria-sets", payload: { name: "Set B", line_of_business: "MEDICARE", service_category: "DME" }, as: ClinicalPolicyEditor, captures: { csb: $.data.id, csb_v: $.data.version } }
            - { call: "POST /um/criteria-sets/${csb}/guideline-versions", payload: { version_label: "1.0", content: "B criteria", auto_approve_eligible: false, effective_from: "2026-01-01T00:00:00Z" }, as: ClinicalPolicyEditor, captures: { gvb: $.data.id } }
            - { call: "POST /um/guideline-versions/${gvb}/transition", payload: { to_status: "PUBLISHED", expected_criteria_set_version: "${csb_v}" }, as: ClinicalPolicyEditor }
            - { call: "POST /um/criteria-sets/${csa}/guideline-versions", payload: { version_label: "9.9", content: "cross-set draft", auto_approve_eligible: false, effective_from: "2026-06-01T00:00:00Z", supersedes_version_id: "${gvb}" }, as: ClinicalPolicyEditor, captures: { gvd: $.data.id } }
            - { call: "GET /um/criteria-sets/${csa}", payload: {}, as: ClinicalPolicyEditor, captures: { csa_v2: $.data.version } }
          trigger:
            - { call: "POST /um/guideline-versions/${gvd}/transition", payload: { to_status: "PUBLISHED", expected_criteria_set_version: "${csa_v2}" }, as: ClinicalPolicyEditor, captures: { err: $.data.error_id } }
            - { call: "GET /um/guideline-versions/${gvd}", payload: {}, as: ClinicalPolicyEditor, captures: { d_status: $.data.status } }
          assert:
            - "err == ERR_SUPERSEDES_CROSS_SET (referential check beats the temporal window-overlap check)"
            - "d_status == DRAFT (publish rejected atomically; no supersession or version bump happened)"

  # ------------------------------------------------------------- Rule 6 -------
  - rule_id: boundary_precision_check
    instances:
      - name: gold_card_rate_exactly_at_threshold
        grounds:
          - calculations.gold_card_eligibility
          - errors[ERR_GOLD_CARD_NOT_ELIGIBLE]
        distinguishing_aspect: |
          Metric: rolling approval rate (ratio boundary). Exactly 0.9000
          (9 approvals / 10 determinations) is ELIGIBLE because the comparison
          is >=; the same formula at 0.8000 is rejected. Endpoint:
          POST /um/providers/{id}/gold-card-evaluations.
        test_recipe:
          setup:
            - "Active criteria set; provider with exactly 9 reviewer APPROVED + 1 reviewer DENIED determinations in the rolling window"
          setup_api_calls:
            - { call: "POST /um/criteria-sets", payload: { name: "Spine Imaging Criteria", line_of_business: "COMMERCIAL", service_category: "IMAGING" }, as: ClinicalPolicyEditor, captures: { cs_id: $.data.id, cs_v: $.data.version } }
            - { call: "POST /um/criteria-sets/${cs_id}/guideline-versions", payload: { version_label: "1.0", content: "MRI lumbar spine criteria", auto_approve_eligible: false, effective_from: "2026-01-01T00:00:00Z" }, as: ClinicalPolicyEditor, captures: { gv_id: $.data.id } }
            - { call: "POST /um/guideline-versions/${gv_id}/transition", payload: { to_status: "PUBLISHED", expected_criteria_set_version: "${cs_v}" }, as: ClinicalPolicyEditor }
            - { call: "POST /um/criteria-sets/${cs_id}/transition", payload: { to_status: "ACTIVE" }, as: ClinicalPolicyEditor }
            - { call: "POST /um/providers", payload: { npi: "1000000011", name: "Boundary Provider" }, as: UMAdmin, captures: { p_id: $.data.id } }
            - { call: "POST /um/prior-auth-requests", payload: { provider_id: "${p_id}", member_ref: "B-01", criteria_set_id: "${cs_id}", service_code: "72148", urgency: "STANDARD", intake_channel: "FAX", documentation_complete: false }, as: IntakeSpecialist, captures: { b01: $.data.id } }
            - { call: "POST /um/prior-auth-requests/${b01}/reviewer-decision", payload: { decision: "APPROVE", reason_code: "MEDICAL_NECESSITY_MET" }, as: ClinicalReviewer, as_user_id: "u-rev-1" }
            - { call: "POST /um/prior-auth-requests", payload: { provider_id: "${p_id}", member_ref: "B-02", criteria_set_id: "${cs_id}", service_code: "72148", urgency: "STANDARD", intake_channel: "FAX", documentation_complete: false }, as: IntakeSpecialist, captures: { b02: $.data.id } }
            - { call: "POST /um/prior-auth-requests/${b02}/reviewer-decision", payload: { decision: "APPROVE", reason_code: "MEDICAL_NECESSITY_MET" }, as: ClinicalReviewer, as_user_id: "u-rev-1" }
            - { call: "POST /um/prior-auth-requests", payload: { provider_id: "${p_id}", member_ref: "B-03", criteria_set_id: "${cs_id}", service_code: "72148", urgency: "STANDARD", intake_channel: "FAX", documentation_complete: false }, as: IntakeSpecialist, captures: { b03: $.data.id } }
            - { call: "POST /um/prior-auth-requests/${b03}/reviewer-decision", payload: { decision: "APPROVE", reason_code: "MEDICAL_NECESSITY_MET" }, as: ClinicalReviewer, as_user_id: "u-rev-1" }
            - { call: "POST /um/prior-auth-requests", payload: { provider_id: "${p_id}", member_ref: "B-04", criteria_set_id: "${cs_id}", service_code: "72148", urgency: "STANDARD", intake_channel: "FAX", documentation_complete: false }, as: IntakeSpecialist, captures: { b04: $.data.id } }
            - { call: "POST /um/prior-auth-requests/${b04}/reviewer-decision", payload: { decision: "APPROVE", reason_code: "MEDICAL_NECESSITY_MET" }, as: ClinicalReviewer, as_user_id: "u-rev-1" }
            - { call: "POST /um/prior-auth-requests", payload: { provider_id: "${p_id}", member_ref: "B-05", criteria_set_id: "${cs_id}", service_code: "72148", urgency: "STANDARD", intake_channel: "FAX", documentation_complete: false }, as: IntakeSpecialist, captures: { b05: $.data.id } }
            - { call: "POST /um/prior-auth-requests/${b05}/reviewer-decision", payload: { decision: "APPROVE", reason_code: "MEDICAL_NECESSITY_MET" }, as: ClinicalReviewer, as_user_id: "u-rev-1" }
            - { call: "POST /um/prior-auth-requests", payload: { provider_id: "${p_id}", member_ref: "B-06", criteria_set_id: "${cs_id}", service_code: "72148", urgency: "STANDARD", intake_channel: "FAX", documentation_complete: false }, as: IntakeSpecialist, captures: { b06: $.data.id } }
            - { call: "POST /um/prior-auth-requests/${b06}/reviewer-decision", payload: { decision: "APPROVE", reason_code: "MEDICAL_NECESSITY_MET" }, as: ClinicalReviewer, as_user_id: "u-rev-1" }
            - { call: "POST /um/prior-auth-requests", payload: { provider_id: "${p_id}", member_ref: "B-07", criteria_set_id: "${cs_id}", service_code: "72148", urgency: "STANDARD", intake_channel: "FAX", documentation_complete: false }, as: IntakeSpecialist, captures: { b07: $.data.id } }
            - { call: "POST /um/prior-auth-requests/${b07}/reviewer-decision", payload: { decision: "APPROVE", reason_code: "MEDICAL_NECESSITY_MET" }, as: ClinicalReviewer, as_user_id: "u-rev-1" }
            - { call: "POST /um/prior-auth-requests", payload: { provider_id: "${p_id}", member_ref: "B-08", criteria_set_id: "${cs_id}", service_code: "72148", urgency: "STANDARD", intake_channel: "FAX", documentation_complete: false }, as: IntakeSpecialist, captures: { b08: $.data.id } }
            - { call: "POST /um/prior-auth-requests/${b08}/reviewer-decision", payload: { decision: "APPROVE", reason_code: "MEDICAL_NECESSITY_MET" }, as: ClinicalReviewer, as_user_id: "u-rev-1" }
            - { call: "POST /um/prior-auth-requests", payload: { provider_id: "${p_id}", member_ref: "B-09", criteria_set_id: "${cs_id}", service_code: "72148", urgency: "STANDARD", intake_channel: "FAX", documentation_complete: false }, as: IntakeSpecialist, captures: { b09: $.data.id } }
            - { call: "POST /um/prior-auth-requests/${b09}/reviewer-decision", payload: { decision: "APPROVE", reason_code: "MEDICAL_NECESSITY_MET" }, as: ClinicalReviewer, as_user_id: "u-rev-1" }
            - { call: "POST /um/prior-auth-requests", payload: { provider_id: "${p_id}", member_ref: "B-10", criteria_set_id: "${cs_id}", service_code: "72148", urgency: "STANDARD", intake_channel: "FAX", documentation_complete: false }, as: IntakeSpecialist, captures: { b10: $.data.id } }
            - { call: "POST /um/prior-auth-requests/${b10}/reviewer-decision", payload: { decision: "DENY", reason_code: "MEDICAL_NECESSITY_NOT_MET" }, as: ClinicalReviewer, as_user_id: "u-rev-1" }
          trigger:
            - { call: "POST /um/providers/${p_id}/gold-card-evaluations", payload: { service_category: "IMAGING" }, as: UMAdmin, captures: { win_rate: $.data.window_approval_rate, win_cnt: $.data.window_determination_count, decision: $.data.decision } }
            - { call: "GET /um/providers/${p_id}", payload: {}, as: UMAdmin, captures: { final_status: $.data.gold_card_status } }
          assert:
            - "win_cnt == 10 and win_rate == 0.9 (9/10 at exactly the 0.90 threshold)"
            - "decision == GRANTED (>= is inclusive: exactly 0.9000 is eligible)"
            - "final_status == GOLD_CARDED"

      - name: tat_breach_strictly_greater_boundary
        grounds:
          - calculations.turnaround_due_at
          - entities.PriorAuthRequest.fields.is_tat_breached
        distinguishing_aspect: |
          Metric: turnaround time (temporal boundary, different metric than the
          approval-rate ratio) reached through a different endpoint
          (POST /um/_clock/set_current_utc). At clock == due_at the request is
          still compliant; at due_at + 1 second the sweep flags it.
        test_recipe:
          setup:
            - "Active COMMERCIAL criteria set; one STANDARD request received at the default clock 2026-08-01T00:00:00Z, so due_at == 2026-08-08T00:00:00Z (168h)"
          setup_api_calls:
            - { call: "POST /um/criteria-sets", payload: { name: "Spine Imaging Criteria", line_of_business: "COMMERCIAL", service_category: "IMAGING" }, as: ClinicalPolicyEditor, captures: { cs_id: $.data.id, cs_v: $.data.version } }
            - { call: "POST /um/criteria-sets/${cs_id}/guideline-versions", payload: { version_label: "1.0", content: "MRI lumbar spine criteria", auto_approve_eligible: false, effective_from: "2026-01-01T00:00:00Z" }, as: ClinicalPolicyEditor, captures: { gv_id: $.data.id } }
            - { call: "POST /um/guideline-versions/${gv_id}/transition", payload: { to_status: "PUBLISHED", expected_criteria_set_version: "${cs_v}" }, as: ClinicalPolicyEditor }
            - { call: "POST /um/criteria-sets/${cs_id}/transition", payload: { to_status: "ACTIVE" }, as: ClinicalPolicyEditor }
            - { call: "POST /um/providers", payload: { npi: "1000000012", name: "TAT Provider" }, as: UMAdmin, captures: { p_id: $.data.id } }
            - { call: "POST /um/prior-auth-requests", payload: { provider_id: "${p_id}", member_ref: "M-01", criteria_set_id: "${cs_id}", service_code: "72148", urgency: "STANDARD", intake_channel: "FAX", documentation_complete: false }, as: IntakeSpecialist, captures: { req: $.data.id, due: $.data.due_at } }
          trigger:
            - { call: "POST /um/_clock/set_current_utc", payload: { to_iso8601: "2026-08-08T00:00:00Z" }, as: UMAdmin, captures: { flagged_at_due: $.data.requests_flagged } }
            - { call: "GET /um/prior-auth-requests/${req}", payload: {}, as: UMAdmin, captures: { breach_at_due: $.data.is_tat_breached } }
            - { call: "POST /um/_clock/set_current_utc", payload: { to_iso8601: "2026-08-08T00:00:01Z" }, as: UMAdmin, captures: { flagged_after: $.data.requests_flagged } }
            - { call: "GET /um/prior-auth-requests/${req}", payload: {}, as: UMAdmin, captures: { breach_after: $.data.is_tat_breached } }
            - { call: "GET /um/prior-auth-requests/${req}/compliance-events", payload: { event_type: "TAT_BREACHED" }, as: UMAdmin, captures: { ev: "$.data[0].event_type" } }
          assert:
            - "due == 2026-08-08T00:00:00.000Z (received + 168h, STANDARD x COMMERCIAL)"
            - "flagged_at_due == 0 and breach_at_due == false (clock == due_at is NOT a breach; comparison is strict)"
            - "flagged_after == 1 and breach_after == true (due_at + 1s breaches)"
            - "ev == TAT_BREACHED"

  # ------------------------------------------------------------- Rule 7 -------
  - rule_id: cross_entity_state_dependency
    instances:
      - name: md_deny_blocked_by_scheduled_p2p
        grounds:
          - state_machines.PriorAuthRequest.ESCALATED_MD_to_DENIED
          - errors[ERR_P2P_CONFERENCE_OUTSTANDING]
          - entities.PeerToPeerConference.fields.status
        distinguishing_aspect: |
          Entity pair: PriorAuthRequest <- PeerToPeerConference. The MD's DENY
          transition on the request is gated by the conference entity's state:
          while any conference for the request is SCHEDULED the denial is
          rejected; resolving it to NO_SHOW unblocks the same transition.
        test_recipe:
          setup:
            - "Active criteria set; provider; request escalated by u-rev-1; conference SCHEDULED by u-md-1"
          setup_api_calls:
            - { call: "POST /um/criteria-sets", payload: { name: "Spine Imaging Criteria", line_of_business: "COMMERCIAL", service_category: "IMAGING" }, as: ClinicalPolicyEditor, captures: { cs_id: $.data.id, cs_v: $.data.version } }
            - { call: "POST /um/criteria-sets/${cs_id}/guideline-versions", payload: { version_label: "1.0", content: "MRI lumbar spine criteria", auto_approve_eligible: false, effective_from: "2026-01-01T00:00:00Z" }, as: ClinicalPolicyEditor, captures: { gv_id: $.data.id } }
            - { call: "POST /um/guideline-versions/${gv_id}/transition", payload: { to_status: "PUBLISHED", expected_criteria_set_version: "${cs_v}" }, as: ClinicalPolicyEditor }
            - { call: "POST /um/criteria-sets/${cs_id}/transition", payload: { to_status: "ACTIVE" }, as: ClinicalPolicyEditor }
            - { call: "POST /um/providers", payload: { npi: "1000000013", name: "P2P Provider" }, as: UMAdmin, captures: { p_id: $.data.id } }
            - { call: "POST /um/prior-auth-requests", payload: { provider_id: "${p_id}", member_ref: "M-01", criteria_set_id: "${cs_id}", service_code: "72148", urgency: "STANDARD", intake_channel: "FAX", documentation_complete: false }, as: IntakeSpecialist, captures: { req: $.data.id } }
            - { call: "POST /um/prior-auth-requests/${req}/reviewer-decision", payload: { decision: "ESCALATE" }, as: ClinicalReviewer, as_user_id: "u-rev-1" }
            - { call: "POST /um/prior-auth-requests/${req}/peer-to-peer-conferences", payload: { scheduled_start: "2026-08-10T14:00:00Z", scheduled_end: "2026-08-10T15:00:00Z" }, as: MedicalDirector, as_user_id: "u-md-1", captures: { p2p: $.data.id } }
          trigger:
            - { call: "POST /um/prior-auth-requests/${req}/md-decision", payload: { decision: "DENY", reason_code: "MEDICAL_NECESSITY_NOT_MET" }, as: MedicalDirector, as_user_id: "u-md-1", captures: { blocked_err: $.data.error_id } }
            - { call: "POST /um/peer-to-peer-conferences/${p2p}/resolve", payload: { outcome: "NO_SHOW" }, as: MedicalDirector, as_user_id: "u-md-1", captures: { p2p_status: $.data.status } }
            - { call: "POST /um/prior-auth-requests/${req}/md-decision", payload: { decision: "DENY", reason_code: "MEDICAL_NECESSITY_NOT_MET" }, as: MedicalDirector, as_user_id: "u-md-1", captures: { final_status: $.data.status } }
            - { call: "GET /um/determinations", payload: { request_id: "${req}" }, as: UMAdmin, captures: { det_role: "$.data[0].decided_by_role", det_reason: "$.data[0].reason_code" } }
          assert:
            - "blocked_err == ERR_P2P_CONFERENCE_OUTSTANDING (conference state gates the request transition)"
            - "p2p_status == NO_SHOW"
            - "final_status == DENIED after the conference resolves"
            - "det_role == MEDICAL_DIRECTOR and det_reason == MEDICAL_NECESSITY_NOT_MET"

      - name: guideline_retire_blocked_by_inflight_request
        grounds:
          - state_machines.GuidelineVersion.PUBLISHED_to_RETIRED
          - errors[ERR_GUIDELINE_HAS_INFLIGHT_REQUESTS]
          - entities.PriorAuthRequest.fields.guideline_version_id
        distinguishing_aspect: |
          Entity pair: GuidelineVersion <- PriorAuthRequest (a different pair
          than Request<-P2P). Retiring a PUBLISHED version is gated by the
          state of requests pinned to it: PENDED_REVIEW blocks, and the same
          retire succeeds after the request reaches APPROVED.
        test_recipe:
          setup:
            - "Active criteria set with published v1; one request pinned to v1 in PENDED_REVIEW"
          setup_api_calls:
            - { call: "POST /um/criteria-sets", payload: { name: "Spine Imaging Criteria", line_of_business: "COMMERCIAL", service_category: "IMAGING" }, as: ClinicalPolicyEditor, captures: { cs_id: $.data.id, cs_v: $.data.version } }
            - { call: "POST /um/criteria-sets/${cs_id}/guideline-versions", payload: { version_label: "1.0", content: "MRI lumbar spine criteria", auto_approve_eligible: false, effective_from: "2026-01-01T00:00:00Z" }, as: ClinicalPolicyEditor, captures: { gv_id: $.data.id } }
            - { call: "POST /um/guideline-versions/${gv_id}/transition", payload: { to_status: "PUBLISHED", expected_criteria_set_version: "${cs_v}" }, as: ClinicalPolicyEditor }
            - { call: "POST /um/criteria-sets/${cs_id}/transition", payload: { to_status: "ACTIVE" }, as: ClinicalPolicyEditor }
            - { call: "POST /um/providers", payload: { npi: "1000000014", name: "Inflight Provider" }, as: UMAdmin, captures: { p_id: $.data.id } }
            - { call: "POST /um/prior-auth-requests", payload: { provider_id: "${p_id}", member_ref: "M-01", criteria_set_id: "${cs_id}", service_code: "72148", urgency: "STANDARD", intake_channel: "FAX", documentation_complete: false }, as: IntakeSpecialist, captures: { req: $.data.id, pinned: $.data.guideline_version_id } }
            - { call: "GET /um/criteria-sets/${cs_id}", payload: {}, as: ClinicalPolicyEditor, captures: { cs_v2: $.data.version } }
          trigger:
            - { call: "POST /um/guideline-versions/${gv_id}/transition", payload: { to_status: "RETIRED", expected_criteria_set_version: "${cs_v2}" }, as: ClinicalPolicyEditor, captures: { blocked_err: $.data.error_id } }
            - { call: "POST /um/prior-auth-requests/${req}/reviewer-decision", payload: { decision: "APPROVE", reason_code: "MEDICAL_NECESSITY_MET" }, as: ClinicalReviewer, as_user_id: "u-rev-1" }
            - { call: "POST /um/guideline-versions/${gv_id}/transition", payload: { to_status: "RETIRED", expected_criteria_set_version: "${cs_v2}" }, as: ClinicalPolicyEditor, captures: { gv_status: $.data.status } }
          assert:
            - "pinned == gv_id (the request carries the version pin the retire check reads)"
            - "blocked_err == ERR_GUIDELINE_HAS_INFLIGHT_REQUESTS while the request is PENDED_REVIEW"
            - "gv_status == RETIRED once the request is determined (in-flight set becomes empty)"
            - "the failed retire did not bump the criteria set version (the second attempt reuses the same expected version successfully)"

  # ------------------------------------------------------------- Rule 8 -------
  - rule_id: resource_temporal_overlap
    instances:
      - name: p2p_half_open_adjacency_vs_overlap
        grounds:
          - validations[priority=10]
          - errors[ERR_P2P_SCHEDULE_CONFLICT]
          - entities.PeerToPeerConference.fields.scheduled_start
        distinguishing_aspect: |
          Interval semantics: HALF-OPEN [start, end) on resource = medical
          director (md_user_id). A conference starting exactly when another
          ends (11:00 after 10:00-11:00) is allowed; one starting at 10:30
          intersects and is rejected. Resource entity: PeerToPeerConference.
        test_recipe:
          setup:
            - "Active criteria set; provider; three escalated requests R1, R2, R3 (all by u-rev-1)"
          setup_api_calls:
            - { call: "POST /um/criteria-sets", payload: { name: "Spine Imaging Criteria", line_of_business: "COMMERCIAL", service_category: "IMAGING" }, as: ClinicalPolicyEditor, captures: { cs_id: $.data.id, cs_v: $.data.version } }
            - { call: "POST /um/criteria-sets/${cs_id}/guideline-versions", payload: { version_label: "1.0", content: "MRI lumbar spine criteria", auto_approve_eligible: false, effective_from: "2026-01-01T00:00:00Z" }, as: ClinicalPolicyEditor, captures: { gv_id: $.data.id } }
            - { call: "POST /um/guideline-versions/${gv_id}/transition", payload: { to_status: "PUBLISHED", expected_criteria_set_version: "${cs_v}" }, as: ClinicalPolicyEditor }
            - { call: "POST /um/criteria-sets/${cs_id}/transition", payload: { to_status: "ACTIVE" }, as: ClinicalPolicyEditor }
            - { call: "POST /um/providers", payload: { npi: "1000000015", name: "Schedule Provider" }, as: UMAdmin, captures: { p_id: $.data.id } }
            - { call: "POST /um/prior-auth-requests", payload: { provider_id: "${p_id}", member_ref: "M-01", criteria_set_id: "${cs_id}", service_code: "72148", urgency: "STANDARD", intake_channel: "FAX", documentation_complete: false }, as: IntakeSpecialist, captures: { r1: $.data.id } }
            - { call: "POST /um/prior-auth-requests/${r1}/reviewer-decision", payload: { decision: "ESCALATE" }, as: ClinicalReviewer, as_user_id: "u-rev-1" }
            - { call: "POST /um/prior-auth-requests", payload: { provider_id: "${p_id}", member_ref: "M-02", criteria_set_id: "${cs_id}", service_code: "72148", urgency: "STANDARD", intake_channel: "FAX", documentation_complete: false }, as: IntakeSpecialist, captures: { r2: $.data.id } }
            - { call: "POST /um/prior-auth-requests/${r2}/reviewer-decision", payload: { decision: "ESCALATE" }, as: ClinicalReviewer, as_user_id: "u-rev-1" }
            - { call: "POST /um/prior-auth-requests", payload: { provider_id: "${p_id}", member_ref: "M-03", criteria_set_id: "${cs_id}", service_code: "72148", urgency: "STANDARD", intake_channel: "FAX", documentation_complete: false }, as: IntakeSpecialist, captures: { r3: $.data.id } }
            - { call: "POST /um/prior-auth-requests/${r3}/reviewer-decision", payload: { decision: "ESCALATE" }, as: ClinicalReviewer, as_user_id: "u-rev-1" }
          trigger:
            - { call: "POST /um/prior-auth-requests/${r1}/peer-to-peer-conferences", payload: { scheduled_start: "2026-08-10T10:00:00Z", scheduled_end: "2026-08-10T11:00:00Z" }, as: MedicalDirector, as_user_id: "u-md-9", captures: { c1: $.data.id, c1_status: $.data.status } }
            - { call: "POST /um/prior-auth-requests/${r2}/peer-to-peer-conferences", payload: { scheduled_start: "2026-08-10T11:00:00Z", scheduled_end: "2026-08-10T12:00:00Z" }, as: MedicalDirector, as_user_id: "u-md-9", captures: { c2: $.data.id, c2_status: $.data.status } }
            - { call: "POST /um/prior-auth-requests/${r3}/peer-to-peer-conferences", payload: { scheduled_start: "2026-08-10T10:30:00Z", scheduled_end: "2026-08-10T11:30:00Z" }, as: MedicalDirector, as_user_id: "u-md-9", captures: { err: $.data.error_id } }
          assert:
            - "c1_status == SCHEDULED"
            - "c2_status == SCHEDULED (adjacent start == previous end is allowed under half-open semantics)"
            - "err == ERR_P2P_SCHEDULE_CONFLICT (10:30-11:30 intersects [10:00,11:00) for the same md_user_id)"

      - name: guideline_closed_window_adjacency_rejected
        grounds:
          - validations[priority=10]
          - errors[ERR_GUIDELINE_WINDOW_OVERLAP]
          - state_machines.GuidelineVersion.DRAFT_to_PUBLISHED
        distinguishing_aspect: |
          Interval semantics: CLOSED [effective_from, effective_until] on
          resource = criteria set's published guideline windows — a DIFFERENT
          geometric treatment than the P2P half-open rule and a different
          resource entity. A new window whose start equals the existing
          window's inclusive end (2026-06-30) IS an overlap and is rejected;
          a start the next day (2026-07-01) is disjoint and publishes.
        test_recipe:
          setup:
            - "Criteria set with v1 PUBLISHED on closed window [2026-01-01, 2026-06-30]; draft v2 from 2026-06-30; draft v3 from 2026-07-01"
          setup_api_calls:
            - { call: "POST /um/criteria-sets", payload: { name: "Spine Imaging Criteria", line_of_business: "COMMERCIAL", service_category: "IMAGING" }, as: ClinicalPolicyEditor, captures: { cs_id: $.data.id, cs_v: $.data.version } }
            - { call: "POST /um/criteria-sets/${cs_id}/guideline-versions", payload: { version_label: "1.0", content: "criteria v1", auto_approve_eligible: false, effective_from: "2026-01-01T00:00:00Z", effective_until: "2026-06-30T00:00:00Z" }, as: ClinicalPolicyEditor, captures: { gv1: $.data.id } }
            - { call: "POST /um/guideline-versions/${gv1}/transition", payload: { to_status: "PUBLISHED", expected_criteria_set_version: "${cs_v}" }, as: ClinicalPolicyEditor }
            - { call: "POST /um/criteria-sets/${cs_id}/guideline-versions", payload: { version_label: "2.0", content: "adjacent-touching draft", auto_approve_eligible: false, effective_from: "2026-06-30T00:00:00Z" }, as: ClinicalPolicyEditor, captures: { gv2: $.data.id } }
            - { call: "POST /um/criteria-sets/${cs_id}/guideline-versions", payload: { version_label: "3.0", content: "disjoint draft", auto_approve_eligible: false, effective_from: "2026-07-01T00:00:00Z" }, as: ClinicalPolicyEditor, captures: { gv3: $.data.id } }
            - { call: "GET /um/criteria-sets/${cs_id}", payload: {}, as: ClinicalPolicyEditor, captures: { cs_v2: $.data.version } }
          trigger:
            - { call: "POST /um/guideline-versions/${gv2}/transition", payload: { to_status: "PUBLISHED", expected_criteria_set_version: "${cs_v2}" }, as: ClinicalPolicyEditor, captures: { err: $.data.error_id } }
            - { call: "POST /um/guideline-versions/${gv3}/transition", payload: { to_status: "PUBLISHED", expected_criteria_set_version: "${cs_v2}" }, as: ClinicalPolicyEditor, captures: { v3_status: $.data.status } }
            - { call: "GET /um/guideline-versions/${gv2}", payload: {}, as: ClinicalPolicyEditor, captures: { v2_status: $.data.status } }
          assert:
            - "err == ERR_GUIDELINE_WINDOW_OVERLAP (closed intervals: start == existing inclusive end shares the instant 2026-06-30T00:00:00Z)"
            - "v2_status == DRAFT (rejected publish leaves the version untouched)"
            - "v3_status == PUBLISHED (window [2026-07-01, open) is disjoint from [2026-01-01, 2026-06-30])"
            - "the failed publish did not bump the criteria set version (v3's publish reuses the same expected version successfully)"

  # ------------------------------------------------------------- Rule 9 -------
  - rule_id: compensating_invariant
    instances:
      - name: publish_supersede_published_count_invariant
        grounds:
          - state_machines.GuidelineVersion.DRAFT_to_PUBLISHED
          - entities.GuidelineVersion.fields.supersedes_version_id
        distinguishing_aspect: |
          Conserved quantity: the per-set count of PUBLISHED guideline
          versions. Forward action (publish v2) paired with its compensating
          action (v1 auto-superseded) leaves count(PUBLISHED in set) == 1
          unchanged, and v1's effective_until is clamped to v2.effective_from
          minus one second so the windows never intersect.
        test_recipe:
          setup:
            - "Criteria set with exactly one PUBLISHED version v1 (window [2026-01-01, open)); draft v2 superseding v1 at 2026-09-01"
          setup_api_calls:
            - { call: "POST /um/criteria-sets", payload: { name: "Spine Imaging Criteria", line_of_business: "COMMERCIAL", service_category: "IMAGING" }, as: ClinicalPolicyEditor, captures: { cs_id: $.data.id, cs_v: $.data.version } }
            - { call: "POST /um/criteria-sets/${cs_id}/guideline-versions", payload: { version_label: "1.0", content: "criteria v1", auto_approve_eligible: false, effective_from: "2026-01-01T00:00:00Z" }, as: ClinicalPolicyEditor, captures: { gv1: $.data.id } }
            - { call: "POST /um/guideline-versions/${gv1}/transition", payload: { to_status: "PUBLISHED", expected_criteria_set_version: "${cs_v}" }, as: ClinicalPolicyEditor }
            - { call: "GET /um/guideline-versions", payload: { criteria_set_id: "${cs_id}", status: "PUBLISHED" }, as: ClinicalPolicyEditor, captures: { pub_before: "$.data[0].id" } }
            - { call: "POST /um/criteria-sets/${cs_id}/guideline-versions", payload: { version_label: "2.0", content: "criteria v2", auto_approve_eligible: true, effective_from: "2026-09-01T00:00:00Z", supersedes_version_id: "${gv1}" }, as: ClinicalPolicyEditor, captures: { gv2: $.data.id } }
            - { call: "GET /um/criteria-sets/${cs_id}", payload: {}, as: ClinicalPolicyEditor, captures: { cs_v2: $.data.version } }
          trigger:
            - { call: "POST /um/guideline-versions/${gv2}/transition", payload: { to_status: "PUBLISHED", expected_criteria_set_version: "${cs_v2}" }, as: ClinicalPolicyEditor, captures: { v2_status: $.data.status } }
            - { call: "GET /um/guideline-versions", payload: { criteria_set_id: "${cs_id}", status: "PUBLISHED" }, as: ClinicalPolicyEditor, captures: { pub_after: "$.data[0].id" } }
            - { call: "GET /um/guideline-versions/${gv1}", payload: {}, as: ClinicalPolicyEditor, captures: { v1_status: $.data.status, v1_until: $.data.effective_until } }
          assert:
            - "pub_before == gv1 (exactly one PUBLISHED version before)"
            - "v2_status == PUBLISHED and pub_after == gv2 (exactly one PUBLISHED version after: count invariant holds)"
            - "v1_status == SUPERSEDED"
            - "v1_until == 2026-08-31T23:59:59.000Z (clamped to v2.effective_from - 1 second)"

      - name: determination_void_restores_provider_counters
        grounds:
          - state_machines.Determination.FINAL_to_VOID
          - state_machines.PriorAuthRequest.APPROVED_to_PENDED_REVIEW
          - calculations.provider_approval_stats
          - errors[ERR_DETERMINATION_NOT_VOIDABLE]
        distinguishing_aspect: |
          Conserved quantity: provider rolling/lifetime determination counters
          (a different quantity than the published-version count). The forward
          action (reviewer APPROVE: counts 0->1/1) paired with its compensating
          action (admin void) restores every counter to its pre-issuance value
          (0/0, rate null) and returns the request to PENDED_REVIEW with
          determined_at null — zero drift.
        test_recipe:
          setup:
            - "Active criteria set; provider with zero determinations; one pended request"
          setup_api_calls:
            - { call: "POST /um/criteria-sets", payload: { name: "Spine Imaging Criteria", line_of_business: "COMMERCIAL", service_category: "IMAGING" }, as: ClinicalPolicyEditor, captures: { cs_id: $.data.id, cs_v: $.data.version } }
            - { call: "POST /um/criteria-sets/${cs_id}/guideline-versions", payload: { version_label: "1.0", content: "MRI lumbar spine criteria", auto_approve_eligible: false, effective_from: "2026-01-01T00:00:00Z" }, as: ClinicalPolicyEditor, captures: { gv_id: $.data.id } }
            - { call: "POST /um/guideline-versions/${gv_id}/transition", payload: { to_status: "PUBLISHED", expected_criteria_set_version: "${cs_v}" }, as: ClinicalPolicyEditor }
            - { call: "POST /um/criteria-sets/${cs_id}/transition", payload: { to_status: "ACTIVE" }, as: ClinicalPolicyEditor }
            - { call: "POST /um/providers", payload: { npi: "1000000016", name: "Void Provider" }, as: UMAdmin, captures: { p_id: $.data.id } }
            - { call: "POST /um/prior-auth-requests", payload: { provider_id: "${p_id}", member_ref: "M-01", criteria_set_id: "${cs_id}", service_code: "72148", urgency: "STANDARD", intake_channel: "FAX", documentation_complete: false }, as: IntakeSpecialist, captures: { req: $.data.id } }
          trigger:
            - { call: "POST /um/prior-auth-requests/${req}/reviewer-decision", payload: { decision: "APPROVE", reason_code: "MEDICAL_NECESSITY_MET" }, as: ClinicalReviewer, as_user_id: "u-rev-1", captures: { st_approved: $.data.status } }
            - { call: "GET /um/providers/${p_id}", payload: {}, as: UMAdmin, captures: { cnt_mid: $.data.rolling_determination_count, appr_mid: $.data.rolling_approval_count, rate_mid: $.data.rolling_approval_rate } }
            - { call: "GET /um/determinations", payload: { request_id: "${req}" }, as: UMAdmin, captures: { det: "$.data[0].id" } }
            - { call: "POST /um/determinations/${det}/void", payload: {}, as: UMAdmin, captures: { det_status: $.data.status } }
            - { call: "GET /um/providers/${p_id}", payload: {}, as: UMAdmin, captures: { cnt_after: $.data.rolling_determination_count, appr_after: $.data.rolling_approval_count, rate_after: $.data.rolling_approval_rate, life_cnt_after: $.data.lifetime_determination_count } }
            - { call: "GET /um/prior-auth-requests/${req}", payload: {}, as: UMAdmin, captures: { req_status: $.data.status, req_det_at: $.data.determined_at } }
            - { call: "GET /um/prior-auth-requests/${req}/compliance-events", payload: { event_type: "DETERMINATION_VOIDED" }, as: UMAdmin, captures: { ev: "$.data[0].event_type" } }
          assert:
            - "st_approved == APPROVED and cnt_mid == 1 and appr_mid == 1 and rate_mid == 1.0 (forward action)"
            - "det_status == VOID"
            - "cnt_after == 0 and appr_after == 0 and rate_after == null and life_cnt_after == 0 (compensating action restores the conserved counters exactly)"
            - "req_status == PENDED_REVIEW and req_det_at == null (CLINICAL_REVIEWER decision reverts to the reviewer tier)"
            - "ev == DETERMINATION_VOIDED"
