      - name: derate_snaps_the_declared_value_down_to_the_step_below_the_worst_specimen
        claim_type: correct_result
        grounds:
          - calculations.declared_value_derate
          - state_machines[ProductLine.certification_status].transitions[PENDING_CERTIFICATION->DERATED]
          - calculations.thermal_conformance_verdict
        distinguishing_aspect: "On a PER_SPECIMEN program the derate basis is the WORST specimen (12.40), not the mean (12.73), and the result is floored to the 0.5 step below it: 12.00, not 12.40 and not the 12.50 the same specimens would give under LOT_MEAN."
        test_recipe:
          setup:
            - "SKU PL-A declares R13.0 on program RCERT-PS (PER_SPECIMEN, tolerance 0.30, derate_allowed true)."
            - "run_a is CURING; a ThermalTest on it is IN_LAB."
          setup_api_calls:
            - call: "POST /certification-programs"
              payload: { code: "RCERT-PS", conformance_basis: "PER_SPECIMEN", r_value_tolerance: 0.30, min_specimen_count: 3, max_concurrent_lab_tests: 2, retest_limit: 2, derate_allowed: true }
