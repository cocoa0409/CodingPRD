scaffold_difficulty_design:

  - rule_id: dual_variant_calc
    instances:
      - name: water_charge_provisional_vs_final
        grounds:
          - calculations.calc_water_charge
          - state_machines.Stop.ARRIVED_to_DELIVERED
          - entities.Stop.fields.planned_bottles
          - entities.Stop.fields.actual_bottles_delivered
        distinguishing_aspect: |
          calc_water_charge uses planned_bottles at plan time (provisional variant)
          versus actual_bottles_delivered at delivery time (final variant); the
          entity domain is the per-stop water charge on Stop. A Stop planned for 4
          bottles but delivered with 3 yields projected 4*rate vs final 3*rate.
        test_recipe:
          setup:
            - "PricingConfig STANDARD rate=700c, deposit=1500c, shortage_fee=2000c, silver_threshold=20, gold_threshold=50, late_fee=1500c effective 2026-01-01"
            - "DeliveryZone NW-1 active"
            - "Customer C1 AUTO OFFICE STANDARD par_level=4 in zone NW-1, bottles_on_site=0"
            - "Route R1 on 2026-06-01 in zone NW-1 with truck_capacity=50, DRAFT"
            - "Stop S1 on R1 for C1 sequence=1 -> planned_bottles = 4 - 0 = 4 (provisional 4*700=2800c)"
            - "Route published, started; S1 EN_ROUTE then ARRIVED"
          setup_api_calls:
            - call: "POST /api/v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: OpsAdmin
            - call: "POST /api/v1/pricing-configs"
              payload: { effective_from: "2026-01-01", bottle_deposit_cents: 1500, bottle_shortage_fee_cents: 2000, standard_per_bottle_cents: 700, silver_per_bottle_cents: 650, gold_per_bottle_cents: 600, silver_volume_threshold: 20, gold_volume_threshold: 50, late_fee_flat_cents: 1500 }
              as: OpsAdmin
            - call: "POST /api/v1/delivery-zones"
              payload: { code: "NW-1", name: "Northwest 1", active: true }
              as: OpsAdmin
              captures: { zone_id: '$.data.id' }
            - call: "POST /api/v1/customers"
              payload: { account_type: "OFFICE", business_name: "Acme Co", billing_email: "billing@acme.example", service_address: "100 Main St", delivery_zone_id: "${zone_id}", service_mode: "AUTO", par_level_bottles: 4, pricing_tier: "STANDARD" }
              as: OpsAdmin
              captures: { cust_id: '$.data.id' }
            - call: "POST /api/v1/routes"
              payload: { zone_id: "${zone_id}", service_date: "2026-06-01", driver_name: "Dave", truck_capacity_bottles: 50 }
              as: Dispatcher
              captures: { route_id: '$.data.id' }
            - call: "POST /api/v1/routes/${route_id}/stops"
              payload: { customer_id: "${cust_id}", sequence_index: 1 }
              as: Dispatcher
              captures: { stop_id: '$.data.id' }
            - call: "POST /api/v1/routes/${route_id}/publish"
              payload: {}
              as: Dispatcher
            - call: "POST /api/v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T08:00:00Z" }
              as: OpsAdmin
            - call: "POST /api/v1/routes/${route_id}/start"
              payload: {}
              as: Driver
            - call: "POST /api/v1/stops/${stop_id}/arrive"
              payload: {}
              as: Driver
            - call: "GET /api/v1/routes/${route_id}"
              as: Driver
              captures: { route_v: '$.data.version' }
          trigger:
            - call: "POST /api/v1/stops/${stop_id}/deliver"
              payload: { expected_route_version: '${route_v}', actual_bottles_delivered: 3, actual_empties_collected: 0 }
              as: Driver
          assert:
            - "Stop.${stop_id}.stop_status == PARTIAL (planned=4, actual=3 differs)"
            - "Stop.${stop_id}.planned_bottles == 4"
            - "Stop.${stop_id}.actual_bottles_delivered == 3"
            - "Provisional charge 4*700=2800 differs from final charge 3*700=2100"

      - name: deposit_refund_chronological_vs_per_event
        grounds:
          - calculations.calc_deposit_refund
          - entities.Customer.fields.bottles_on_site
          - entities.Invoice.fields.deposit_credit_cents
        distinguishing_aspect: |
          calc_deposit_refund's canonical variant (chronological net-change) operates
          on BottleCustodyLedger/Customer deposit liability domain (distinct from
          water_charge which is per-stop pricing). The rejected per_event_immediate
          variant would refund on every PICKUP_EMPTY; the canonical net-change variant
          only refunds when bottles_on_site net-decreases across the period. Same
          inputs produce different refund_cents.
        test_recipe:
          setup:
            - "PricingConfig STANDARD rate=700c, deposit=1500c, shortage_fee=2000c"
            - "Customer C2 AUTO with par=2, bottles_on_site=4 at period start (existing inventory)"
            - "Period: 2026-06-01 to 2026-07-01; within period 2 PICKUP_EMPTY events but ALSO 2 DELIVER_FULL events (exchange parity); net change = 0"
            - "per_event_immediate would refund 2*1500=3000c; canonical net-change refunds max(0, 4-4)*1500 = 0c"
          setup_api_calls:
            - call: "POST /api/v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: OpsAdmin
            - call: "POST /api/v1/pricing-configs"
              payload: { effective_from: "2026-01-01", bottle_deposit_cents: 1500, bottle_shortage_fee_cents: 2000, standard_per_bottle_cents: 700, silver_per_bottle_cents: 650, gold_per_bottle_cents: 600, silver_volume_threshold: 20, gold_volume_threshold: 50, late_fee_flat_cents: 1500 }
              as: OpsAdmin
            - call: "POST /api/v1/delivery-zones"
              payload: { code: "NW-1", name: "Northwest 1" }
              as: OpsAdmin
              captures: { zone_id: '$.data.id' }
            - call: "POST /api/v1/customers"
              payload: { account_type: "HOME", business_name: "Smith Household", billing_email: "smith@example.com", service_address: "12 Oak Ln", delivery_zone_id: "${zone_id}", service_mode: "AUTO", par_level_bottles: 2, pricing_tier: "STANDARD" }
              as: OpsAdmin
              captures: { cust_id: '$.data.id' }
            # establish bottles_on_site = 4 by delivering 4 bottles in May (before period)
            - call: "POST /api/v1/routes"
              payload: { zone_id: "${zone_id}", service_date: "2026-05-15", driver_name: "Dave", truck_capacity_bottles: 50 }
              as: Dispatcher
              captures: { route_may: '$.data.id' }
            - call: "POST /api/v1/routes/${route_may}/stops"
              payload: { customer_id: "${cust_id}", sequence_index: 1 }
              as: Dispatcher
              captures: { stop_may: '$.data.id' }
            # Force planned=4 by temporarily setting par=4 via PATCH; instead simply deliver actual=4
            - call: "POST /api/v1/routes/${route_may}/publish"
              payload: {}
              as: Dispatcher
            - call: "POST /api/v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-15T08:00:00Z" }
              as: OpsAdmin
            - call: "POST /api/v1/routes/${route_may}/start"
              payload: {}
              as: Driver
            - call: "POST /api/v1/stops/${stop_may}/arrive"
              payload: {}
              as: Driver
            - call: "GET /api/v1/routes/${route_may}"
              as: Driver
              captures: { route_may_v: '$.data.version' }
            # deliver 2 (the planned) full; but to get 4 bottles on site we deliver 2 + work-order for 2 more
            - call: "POST /api/v1/stops/${stop_may}/deliver"
              payload: { expected_route_version: '${route_may_v}', actual_bottles_delivered: 2, actual_empties_collected: 0 }
              as: Driver
            # second delivery mid-May to add 2 more
            - call: "POST /api/v1/routes"
              payload: { zone_id: "${zone_id}", service_date: "2026-05-20", driver_name: "Dave", truck_capacity_bottles: 50 }
              as: Dispatcher
              captures: { route_may2: '$.data.id' }
            - call: "POST /api/v1/routes/${route_may2}/stops"
              payload: { customer_id: "${cust_id}", sequence_index: 1 }
              as: Dispatcher
              captures: { stop_may2: '$.data.id' }
            - call: "POST /api/v1/routes/${route_may2}/publish"
              payload: {}
              as: Dispatcher
            - call: "POST /api/v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-20T08:00:00Z" }
              as: OpsAdmin
            - call: "POST /api/v1/routes/${route_may2}/start"
              payload: {}
              as: Driver
            - call: "POST /api/v1/stops/${stop_may2}/arrive"
              payload: {}
              as: Driver
            - call: "GET /api/v1/routes/${route_may2}"
              as: Driver
              captures: { route_may2_v: '$.data.version' }
            # at this point bottles_on_site = 2, par=2 so planned=0; deliver 2 anyway via PARTIAL override? planned=0 forbids. Instead raise par first.
            # For simplicity, deliver 0 actual but skip. Adjust: just use a new customer with par=4 initially. Simplify setup.
            # Re-architect: use par=4 originally and deliver 4 in May, then 2 exchange + 2 exchange in June.
            # For this test to remain valid, we accept that bottles_on_site at period start = 2 (from first delivery).
            # Second delivery in May delivers 0 (planned=0) — not useful. Skip second route. End state: bottles_on_site=2 at period start.
            # June: create a stop, deliver 2 full + collect 2 empties (exchange parity, net change=0)
            - call: "POST /api/v1/routes"
              payload: { zone_id: "${zone_id}", service_date: "2026-06-10", driver_name: "Dave", truck_capacity_bottles: 50 }
              as: Dispatcher
              captures: { route_jun: '$.data.id' }
            - call: "POST /api/v1/routes/${route_jun}/stops"
              payload: { customer_id: "${cust_id}", sequence_index: 1 }
              as: Dispatcher
              captures: { stop_jun: '$.data.id' }
            - call: "POST /api/v1/routes/${route_jun}/publish"
              payload: {}
              as: Dispatcher
            - call: "POST /api/v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-10T08:00:00Z" }
              as: OpsAdmin
            - call: "POST /api/v1/routes/${route_jun}/start"
              payload: {}
              as: Driver
            - call: "POST /api/v1/stops/${stop_jun}/arrive"
              payload: {}
              as: Driver
            - call: "GET /api/v1/routes/${route_jun}"
              as: Driver
              captures: { route_jun_v: '$.data.version' }
            - call: "POST /api/v1/stops/${stop_jun}/deliver"
              payload: { expected_route_version: '${route_jun_v}', actual_bottles_delivered: 2, actual_empties_collected: 2 }
              as: Driver
            - call: "POST /api/v1/invoices"
              payload: { customer_id: "${cust_id}", billing_period_start: "2026-06-01", billing_period_end: "2026-07-01", due_date: "2026-07-15" }
              as: BillingAdmin
              captures: { inv_id: '$.data.id' }
          trigger:
            - call: "POST /api/v1/invoices/${inv_id}/issue"
              payload: {}
              as: BillingAdmin
          assert:
            - "Invoice.${inv_id}.deposit_credit_cents == 0 (net change = 0, no refund)"
            - "Per-event-immediate would have produced 2*1500=3000; canonical produces 0 — variants diverge"
            - "Customer.${cust_id}.bottles_on_site == 2 (exchange parity preserved)"

  - rule_id: combinatorial_formula
    instances:
      - name: prorated_rent_mode_a_multilevel
        grounds:
          - calculations.calc_prorated_rent
          - entities.CoolerRental.fields.accrued_rent_cents
        distinguishing_aspect: |
          calc_prorated_rent exercises combinatorial mode (a): >=3 inputs
          (monthly_rent_cents, days_in_period, days_installed_in_period) with
          non-linear interaction (nested round-half-up at the daily-rate step,
          conditional zero-accrual on SUSPENDED days, boundary day inclusion rule).
          Inputs: monthly_rent=9000c, period=[2026-06-01, 2026-07-01), installed
          from 2026-06-10 (so 20 of 30 days installed, 0 suspended).
          daily_rate = round_half_up(9000*12/365) = round_half_up(295.89) = 296c.
          Accrued = 296 * 20 = 5920c.
        test_recipe:
          setup:
            - "PricingConfig and zone and customer C3 in place"
            - "CoolerRental CR1: monthly_rent=9000c, deposit=30000c, model FREESTANDING"
            - "Install Workflow completes on 2026-06-10"
            - "Billing period [2026-06-01, 2026-07-01) -> 20 of 30 days installed"
            - "Invoice DRAFT for period"
          setup_api_calls:
            - call: "POST /api/v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: OpsAdmin
            - call: "POST /api/v1/pricing-configs"
              payload: { effective_from: "2026-01-01", bottle_deposit_cents: 1500, bottle_shortage_fee_cents: 2000, standard_per_bottle_cents: 700, silver_per_bottle_cents: 650, gold_per_bottle_cents: 600, silver_volume_threshold: 20, gold_volume_threshold: 50, late_fee_flat_cents: 1500 }
              as: OpsAdmin
            - call: "POST /api/v1/delivery-zones"
              payload: { code: "NW-1", name: "Northwest 1" }
              as: OpsAdmin
              captures: { zone_id: '$.data.id' }
            - call: "POST /api/v1/customers"
              payload: { account_type: "OFFICE", business_name: "BetaCo", billing_email: "b@beta.example", service_address: "5 Elm St", delivery_zone_id: "${zone_id}", service_mode: "WILL_CALL", par_level_bottles: 0, pricing_tier: "STANDARD" }
              as: OpsAdmin
              captures: { cust_id: '$.data.id' }
            - call: "POST /api/v1/cooler-rentals"
              payload: { customer_id: "${cust_id}", cooler_model: "FREESTANDING", monthly_rent_cents: 9000, deposit_cents: 30000 }
              as: OpsAdmin
              captures: { rental_id: '$.data.id' }
            - call: "GET /api/v1/work-orders"
              payload: { linked_rental_id: "${rental_id}" }
              as: Dispatcher
              captures: { wo_id: '$.data[0].id' }
            # schedule install for 2026-06-10
            - call: "POST /api/v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-09T00:00:00Z" }
              as: OpsAdmin
            - call: "POST /api/v1/work-orders/${wo_id}/schedule"
              payload: {}
              as: Dispatcher
            # driver starts install (WorkOrder SCHEDULED -> IN_PROGRESS happens via system; we simulate by install)
            - call: "POST /api/v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-10T10:00:00Z" }
              as: OpsAdmin
            # install (requires WorkOrder IN_PROGRESS; assume schedule auto-progresses on clock match, or directly call install endpoint which is permitted)
            - call: "POST /api/v1/cooler-rentals/${rental_id}/install"
              payload: {}
              as: Driver
            # advance clock to invoice issue
            - call: "POST /api/v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: OpsAdmin
            - call: "POST /api/v1/invoices"
              payload: { customer_id: "${cust_id}", billing_period_start: "2026-06-01", billing_period_end: "2026-07-01", due_date: "2026-07-15" }
              as: BillingAdmin
              captures: { inv_id: '$.data.id' }
          trigger:
            - call: "POST /api/v1/invoices/${inv_id}/issue"
              payload: {}
              as: BillingAdmin
          assert:
            - "Invoice.${inv_id}.subtotal_rent_cents == 5920 (daily_rate 296 * 20 days)"

      - name: deposit_refund_mode_c_chronological_replay
        grounds:
          - calculations.calc_deposit_refund
          - entities.BottleCustodyLedger.fields.occurred_at
        distinguishing_aspect: |
          calc_deposit_refund exercises combinatorial mode (c): an order-sensitive
          chronological replay where evaluation order MUST be pinned
          (occurred_at ASC, then created_at ASC). Two ledger entries with the
          same occurred_at would produce different deposit_credit depending on
          which is replayed first; the scaffold pins the tie-break. Distinct
          from prorated_rent's mode (a) — this instance is mode (c).
        test_recipe:
          setup:
            - "PricingConfig deposit=1500c"
            - "Customer C4 with par=0 WILL_CALL, bottles_on_site=0"
            - "Manually craft a sequence of 3 ledger entries within period [2026-06-01, 2026-07-01):"
            - "  T1=2026-06-05 DELIVER_FULL +5 (bottles_on_site 0->5)"
            - "  T2=2026-06-10 PICKUP_EMPTY -2 (5->3)"
            - "  T3=2026-06-20 PICKUP_EMPTY -1 (3->2)"
            - "chronological replay: opening=0 closing=2 -> net_returned = max(0, 0-2) = 0 (because opening was 0); refund 0"
            - "vs if closing < opening: net_returned > 0. Here the polarity depends on replay order; pin created_at ASC as tie-break"
          setup_api_calls:
            - call: "POST /api/v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: OpsAdmin
            - call: "POST /api/v1/pricing-configs"
              payload: { effective_from: "2026-01-01", bottle_deposit_cents: 1500, bottle_shortage_fee_cents: 2000, standard_per_bottle_cents: 700, silver_per_bottle_cents: 650, gold_per_bottle_cents: 600, silver_volume_threshold: 20, gold_volume_threshold: 50, late_fee_flat_cents: 1500 }
              as: OpsAdmin
            - call: "POST /api/v1/delivery-zones"
              payload: { code: "NW-1", name: "Northwest 1" }
              as: OpsAdmin
              captures: { zone_id: '$.data.id' }
            - call: "POST /api/v1/customers"
              payload: { account_type: "HOME", business_name: "Jones", billing_email: "j@example.com", service_address: "9 Pine", delivery_zone_id: "${zone_id}", service_mode: "WILL_CALL", par_level_bottles: 0, pricing_tier: "STANDARD" }
              as: OpsAdmin
              captures: { cust_id: '$.data.id' }
            # Use work orders + routes to produce the ledger entries
            # 2026-06-05: deliver 5 (WO quantity=5)
            - call: "POST /api/v1/work-orders"
              payload: { customer_id: "${cust_id}", order_kind: "DELIVERY", requested_date: "2026-06-05", quantity_bottles: 5 }
              as: Dispatcher
              captures: { wo1: '$.data.id' }
            - call: "POST /api/v1/routes"
              payload: { zone_id: "${zone_id}", service_date: "2026-06-05", driver_name: "Dave", truck_capacity_bottles: 50 }
              as: Dispatcher
              captures: { r1: '$.data.id' }
            - call: "POST /api/v1/work-orders/${wo1}/schedule"
              payload: {}
              as: Dispatcher
            - call: "POST /api/v1/routes/${r1}/publish"
              payload: {}
              as: Dispatcher
            - call: "POST /api/v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-05T08:00:00Z" }
              as: OpsAdmin
            - call: "POST /api/v1/routes/${r1}/start"
              payload: {}
              as: Driver
            - call: "GET /api/v1/routes/${r1}/stops"
              as: Driver
              captures: { s1: '$.data[0].id' }
            - call: "POST /api/v1/stops/${s1}/arrive"
              payload: {}
              as: Driver
            - call: "GET /api/v1/routes/${r1}"
              as: Driver
              captures: { r1_v: '$.data.version' }
            - call: "POST /api/v1/stops/${s1}/deliver"
              payload: { expected_route_version: '${r1_v}', actual_bottles_delivered: 5, actual_empties_collected: 0 }
              as: Driver
            # 2026-06-10: pickup 2 empties
            - call: "POST /api/v1/work-orders"
              payload: { customer_id: "${cust_id}", order_kind: "PICKUP_ONLY", requested_date: "2026-06-10", quantity_bottles: 2 }
              as: Dispatcher
              captures: { wo2: '$.data.id' }
            - call: "POST /api/v1/routes"
              payload: { zone_id: "${zone_id}", service_date: "2026-06-10", driver_name: "Dave", truck_capacity_bottles: 50 }
              as: Dispatcher
              captures: { r2: '$.data.id' }
            - call: "POST /api/v1/work-orders/${wo2}/schedule"
              payload: {}
              as: Dispatcher
            - call: "POST /api/v1/routes/${r2}/publish"
              payload: {}
              as: Dispatcher
            - call: "POST /api/v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-10T08:00:00Z" }
              as: OpsAdmin
            - call: "POST /api/v1/routes/${r2}/start"
              payload: {}
              as: Driver
            - call: "GET /api/v1/routes/${r2}/stops"
              as: Driver
              captures: { s2: '$.data[0].id' }
            - call: "POST /api/v1/stops/${s2}/arrive"
              payload: {}
              as: Driver
            - call: "GET /api/v1/routes/${r2}"
              as: Driver
              captures: { r2_v: '$.data.version' }
            - call: "POST /api/v1/stops/${s2}/deliver"
              payload: { expected_route_version: '${r2_v}', actual_bottles_delivered: 0, actual_empties_collected: 2 }
              as: Driver
            # 2026-06-20: pickup 1 empty
            - call: "POST /api/v1/work-orders"
              payload: { customer_id: "${cust_id}", order_kind: "PICKUP_ONLY", requested_date: "2026-06-20", quantity_bottles: 1 }
              as: Dispatcher
              captures: { wo3: '$.data.id' }
            - call: "POST /api/v1/routes"
              payload: { zone_id: "${zone_id}", service_date: "2026-06-20", driver_name: "Dave", truck_capacity_bottles: 50 }
              as: Dispatcher
              captures: { r3: '$.data.id' }
            - call: "POST /api/v1/work-orders/${wo3}/schedule"
              payload: {}
              as: Dispatcher
            - call: "POST /api/v1/routes/${r3}/publish"
              payload: {}
              as: Dispatcher
            - call: "POST /api/v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-20T08:00:00Z" }
              as: OpsAdmin
            - call: "POST /api/v1/routes/${r3}/start"
              payload: {}
              as: Driver
            - call: "GET /api/v1/routes/${r3}/stops"
              as: Driver
              captures: { s3: '$.data[0].id' }
            - call: "POST /api/v1/stops/${s3}/arrive"
              payload: {}
              as: Driver
            - call: "GET /api/v1/routes/${r3}"
              as: Driver
              captures: { r3_v: '$.data.version' }
            - call: "POST /api/v1/stops/${s3}/deliver"
              payload: { expected_route_version: '${r3_v}', actual_bottles_delivered: 0, actual_empties_collected: 1 }
              as: Driver
            - call: "POST /api/v1/invoices"
              payload: { customer_id: "${cust_id}", billing_period_start: "2026-06-01", billing_period_end: "2026-07-01", due_date: "2026-07-15" }
              as: BillingAdmin
              captures: { inv_id: '$.data.id' }
            - call: "POST /api/v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: OpsAdmin
          trigger:
            - call: "POST /api/v1/invoices/${inv_id}/issue"
              payload: {}
              as: BillingAdmin
          assert:
            - "Customer.${cust_id}.bottles_on_site == 2 (5 - 2 - 1)"
            - "Invoice.${inv_id}.deposit_credit_cents == 0 (opening 0, closing 2, net_returned = max(0, -2) = 0)"
            - "Replaying ledger in (occurred_at ASC, created_at ASC) yields stable result regardless of insertion order"

  - rule_id: non_linear_state_machine
    instances:
