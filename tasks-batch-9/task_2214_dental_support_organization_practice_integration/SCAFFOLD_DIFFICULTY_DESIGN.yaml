              captures: { prac_id: "$.data.id" }
            - call: "POST /dso/doctors"
              payload: { full_name: "Ana Reyes", npi: "1710000001", license_number: "IL-DDS-4410", license_state: "IL", specialty: "GENERAL", is_seller_owner: true }
