              as: NationalAccountManager
              captures: { ct_id: $.data.id }
            - call: "POST /nac/contract-tiers"
              payload: { contract_id: "${ct_id}", product_class_code: "PROTEIN", cost_basis: "AVG_COST", markup_type: "DOLLARS_PER_CASE", markup_value: 150, min_case_volume: 0 }
              as: NationalAccountManager
            - call: "POST /nac/dc-coverages"
              payload: { contract_id: "${ct_id}", distribution_center_id: "${dc_id}", coverage_type: "OUT_OF_MARKET", coverage_from: "2026-08-01T00:00:00Z", coverage_to: "2027-07-31T23:59:59Z", service_fee_waived: false }
              as: NationalAccountManager
            - call: "POST /nac/contracts/${ct_id}/submit-for-signature"
              payload: {}
              as: NationalAccountManager
            - call: "POST /nac/contracts/${ct_id}/sign"
              payload: {}
              as: OperatorBuyer
              as_user_id: "${op_id}"
            - call: "POST /nac/rebate-periods"
              payload: { contract_id: "${ct_id}", period_start: "2026-08-01T00:00:00Z", period_end: "2026-09-01T00:00:00Z" }
              as: RebateAccountant
            - call: "POST /nac/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T00:00:00Z" }
              as: SystemAdmin
