  - { id: ERR_INVOICE_EXISTS_FOR_DELIVERY, http: 409, condition: "Delivery already has an invoice" }
  - { id: ERR_INVOICE_ALREADY_CLAIMED, http: 409, condition: "Invoice already appears on a claim line" }
  - { id: ERR_WINDOW_OVERLAP, http: 409, condition: "Half-open overlap with existing window on same kitchen+weekday (adjacency allowed)" }
  - { id: ERR_WINDOW_CAPACITY_FULL, http: 409, condition: "Window already at capacity_deliveries for that date" }
  - { id: ERR_WINDOW_IN_USE, http: 409, condition: "Delete blocked by SCHEDULED/CHECKED_IN deliveries in the window" }
  - { id: ERR_NO_SEASONALITY_GAP, http: 409, condition: "forecast line uncovered_quantity == 0" }
  - { id: ERR_SUBSTITUTION_EXCEEDS_GAP, http: 409, condition: "quantity > forecast line uncovered_quantity" }
  - { id: ERR_SUBSTITUTION_CAP_EXCEEDED, http: 409, condition: "Approval would exceed 20% product-year substitution cap" }
  - { id: ERR_CLAIM_EMPTY, http: 409, condition: "submit requires at least one claim line" }
