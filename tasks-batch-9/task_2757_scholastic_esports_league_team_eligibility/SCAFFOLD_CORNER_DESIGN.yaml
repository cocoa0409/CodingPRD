              captures: { tm_b_id: $.data.id }
            - call: "POST /roster-slots"
              payload: { team_id: "${tm_a_id}", student_id: "${st_id}", slot_role: "STARTER" }
              as: Coach
              as_user_id: "${c_a_id}"
              captures: { rs_a_id: $.data.id }
            - call: "POST /roster-slots"
              payload: { team_id: "${tm_b_id}", student_id: "${st_id}", slot_role: "STARTER" }
              as: Coach
              as_user_id: "${c_b_id}"
              captures: { rs_b_id: $.data.id }
            - call: "POST /roster-slots/${rs_a_id}/verify-enrollment"
              payload: { enrollment_document_ref: "REG-A", verified_birthdate: "2009-05-10" }
              as: EligibilityOfficer
              as_user_id: "officer-a"
            - call: "POST /roster-slots/${rs_a_id}/verify-academics"
              payload: {}
              as: EligibilityOfficer
              as_user_id: "officer-b"
            - call: "GET /students/${st_id}"
              payload: {}
              as: EligibilityOfficer
              as_user_id: "officer-c"
              captures: { st_v1: $.data.version }
          trigger:
            - call: "POST /students/${st_id}/academic-postings"
              payload: { term_label: "2026-FALL", term_gpa: 1.500, term_credits: 6, expected_student_version: "${st_v1}" }
              as: EligibilityOfficer
              as_user_id: "officer-c"
          assert:
            - "the trigger call returns 200 with data.latest_term_gpa == 1.500, data.effective_gpa == 1.500, data.academic_standing == INELIGIBLE and data.standing_basis_applied == TERM_SNAPSHOT"
            - "RosterSlot.${rs_b_id}.academic_status == BLOCKED, ineligibility_reason == ACADEMIC and participation_status == INELIGIBLE"
            - "RosterSlot.${rs_a_id}.academic_status is still CLEARED with standing_at_verification == GOOD, effective_gpa_at_verification == 3.200 and participation_status == ACTIVE"
            - "Team.${tm_a_id}.active_starter_count == 1 and Team.${tm_b_id}.active_starter_count == 0"
            - "Team.${tm_b_id}.starter_slots_used == 1 and starter_slots_available == 2 — a BLOCKED slot still occupies capacity"

      - name: dispute_and_broadcast_dimensions_advance_without_disturbing_play_or_result
        claim_type: independent_state_dimensions
        grounds:
          - state_machines.Match.initial_state
          - state_machines.Match.dispute_status_transitions
          - state_machines.Match.broadcast_status_transitions
          - complexity_profile.state_machine_shape
        distinguishing_aspect: |
          Match carries four orthogonal axes. Starting from a FORFEITED / ADJUDICATED
          match, a broadcast registration moves only the broadcast axis and two dispute
          actions move only the dispute axis: the combined state
          (FORFEITED, ADJUDICATED, UNDER_REVIEW, SCHEDULED) must be reachable, with
          spectator_strikes still 0 and the forfeit's point award untouched. An
          implementation that stores one flat status field cannot represent it.
        test_recipe:
          setup:
            - "District (dispute_window_hours 48), school (concurrent_broadcast_capacity 1), two coaches, title, season, two DRAFT teams"
            - "One match A vs B, forfeited by the away team so result_status is ADJUDICATED and dispute_deadline_at is set"
          setup_api_calls:
            - call: "POST /districts"
              payload: { name: "Metro District", state_code: "CA" }
              as: LeagueAdmin
              captures: { d_id: $.data.id }
            - call: "POST /schools"
              payload: { district_id: "${d_id}", name: "North High", nces_code: "N-001" }
              as: DistrictAdmin
              as_user_id: "${d_id}"
              captures: { s_id: $.data.id }
            - call: "POST /coaches"
              payload: { school_id: "${s_id}", full_name: "Coach Alpha", email: "alpha@example.org" }
              as: AthleticDirector
              as_user_id: "${s_id}"
              captures: { c_a_id: $.data.id }
            - call: "POST /coaches"
              payload: { school_id: "${s_id}", full_name: "Coach Bravo", email: "bravo@example.org" }
              as: AthleticDirector
              as_user_id: "${s_id}"
              captures: { c_b_id: $.data.id }
            - call: "POST /titles"
              payload: { name: "Rocket Arena", publisher: "Nova Interactive" }
              as: LeagueAdmin
              captures: { t_id: $.data.id }
            - call: "POST /seasons"
              payload: { title_id: "${t_id}", name: "Fall 2026 Varsity" }
              as: LeagueAdmin
              captures: { se_id: $.data.id }
            - call: "POST /teams"
              payload: { season_id: "${se_id}", school_id: "${s_id}", title_id: "${t_id}", coach_id: "${c_a_id}", name: "North Alpha" }
              as: Coach
              as_user_id: "${c_a_id}"
              captures: { tm_a_id: $.data.id }
            - call: "POST /teams"
              payload: { season_id: "${se_id}", school_id: "${s_id}", title_id: "${t_id}", coach_id: "${c_b_id}", name: "North Bravo" }
              as: Coach
              as_user_id: "${c_b_id}"
              captures: { tm_b_id: $.data.id }
            - call: "POST /matches"
              payload: { season_id: "${se_id}", home_team_id: "${tm_a_id}", away_team_id: "${tm_b_id}", scheduled_start_at: "2026-10-01T18:00:00.000Z" }
              as: LeagueAdmin
              captures: { m_id: $.data.id }
            - call: "POST /matches/${m_id}/forfeit"
              payload: { forfeiting_team_id: "${tm_b_id}", reason_note: "no show" }
              as: LeagueAdmin
          trigger:
            - call: "POST /matches/${m_id}/broadcast"
              payload: { action: "REGISTER", broadcast_school_id: "${s_id}", broadcast_start_at: "2026-10-01T17:45:00.000Z", broadcast_end_at: "2026-10-01T19:15:00.000Z" }
              as: Coach
              as_user_id: "${c_a_id}"
            - call: "POST /matches/${m_id}/disputes"
              payload: { filing_team_id: "${tm_b_id}", dispute_reason_code: "SCORE_MISMATCH", dispute_note: "we were present" }
              as: Coach
              as_user_id: "${c_b_id}"
            - call: "POST /matches/${m_id}/dispute-actions"
              payload: { action: "ACCEPT_REVIEW" }
              as: LeagueAdmin
          assert:
            - "after the first trigger call Match.${m_id}.broadcast_status == SCHEDULED, play_status == FORFEITED, result_status == ADJUDICATED, dispute_status == NONE"
            - "after the second trigger call data.dispute_status == OPEN with dispute_filed_by_team_id == ${tm_b_id} and dispute_reason_code == SCORE_MISMATCH"
            - "after the third trigger call data.dispute_status == UNDER_REVIEW and the combined state is (FORFEITED, ADJUDICATED, UNDER_REVIEW, SCHEDULED)"
            - "data.spectator_strikes == 0, data.broadcast_school_id == ${s_id}, data.forfeiting_team_id == ${tm_b_id} and data.winner_team_id == ${tm_a_id} throughout"
            - "data.dispute_deadline_at == 2026-08-03T00:00:00.000Z and result_confirmed_at == 2026-08-01T00:00:00.000Z are unchanged by the dispute actions"
            - "Team.${tm_a_id}.match_points == 3 and Season.${se_id}.match_point_pool == 3 after all three calls"

      - name: sustained_case_change_propagates_into_student_slot_team_and_match
        claim_type: cross_entity
        excluded_because:
          difficulty_instance: sustained_severe_case_cascades_five_links_case_student_slot_team_match
          rationale: |
            The §1.8 instance walks the full five-link chain from a SUSTAINED SEVERE case
            through Student.fair_play_status, the student's RosterSlot, the Team
            COMPETING -> SUSPENDED transition and the forfeit of its scheduled matches,
            asserting the state and fields of every entity on the way. A breadth-level
            cross-entity probe would be a strict subset of it.

      - name: overturned_appeal_reverses_every_original_side_effect
        claim_type: compensation
        excluded_because:
          difficulty_instance: season_match_point_pool_returns_to_zero_when_the_suspension_forfeit_is_reversed
          rationale: |
            The §1.8 compensating-invariant instance proves that an OVERTURN on appeal
            reverses the whole suspension chain — forfeited matches restored, the 3-point
            award removed, forfeit_wins and forfeits_charged decremented and
            Season.match_point_pool back to its pre-suspension value with no drift. That
            is exactly the compensation claim.

      - name: registration_and_withdrawal_keep_the_district_subsidy_ledger_in_sync
        claim_type: ledger_sync
        excluded_because:
          difficulty_instance: district_subsidy_pool_restored_exactly_on_team_withdrawal
          rationale: |
            The §1.8 instance reconciles District.subsidy_pool_cents before and after the
            debit and the restoring credit against subsidy_pool_initial_cents, which is
            the ancestor-derived-field reconciliation this row asks for.

      # §1.2 rows deliberately skipped:
      #   * Bubble up — no parent entity auto-transitions when its children reach a
      #     terminal state. The one compound-over-children rule (PLAYOFFS -> COMPLETE
      #     requires every Match in FINALIZED or FORFEITED) is enforced as a guard on an
      #     operator-driven advance, and is exercised by
      #     `season_complete_advance_is_blocked_by_one_unplayed_match` in the
      #     `validations` section below.

  # ===========================================================================
  # SECTION 3 — CALCULATIONS
  # ===========================================================================
  - section: calculations
    instances:

      - name: term_snapshot_standing_at_the_min_gpa_and_probation_floor_boundaries
        claim_type: correct_result
        grounds:
          - calculations.academic_standing_evaluation
          - entities.District.min_gpa
          - entities.District.probation_gpa_floor
          - entities.Student.academic_standing
        distinguishing_aspect: |
          Four postings walk the TERM_SNAPSHOT ladder across both thresholds with a
          one-thousandth step: 2.000 is GOOD (>= min_gpa is inclusive), 1.999 is
          PROBATION, 1.750 is still PROBATION (>= probation_gpa_floor is inclusive) and
          1.749 is INELIGIBLE. Every comparison is on the value rounded to three
          decimals, and no roster slot is involved, so this isolates the calculation
          from the verification guards.
        test_recipe:
          setup:
            - "One district with default academic_standing_basis TERM_SNAPSHOT, min_gpa 2.0 and probation_gpa_floor 1.75"
            - "One school and one student with no postings yet"
          setup_api_calls:
            - call: "POST /districts"
              payload: { name: "Metro District", state_code: "CA" }
              as: LeagueAdmin
              captures: { d_id: $.data.id }
            - call: "POST /schools"
              payload: { district_id: "${d_id}", name: "North High", nces_code: "N-001" }
              as: DistrictAdmin
              as_user_id: "${d_id}"
              captures: { s_id: $.data.id }
            - call: "POST /students"
              payload: { school_id: "${s_id}", full_name: "Rosa Nova", birthdate: "2009-05-10", grade_level: 11 }
              as: AthleticDirector
              as_user_id: "${s_id}"
              captures: { st_id: $.data.id, st_v0: $.data.version }
          trigger:
            - call: "POST /students/${st_id}/academic-postings"
              payload: { term_label: "2025-FALL", term_gpa: 2.000, term_credits: 6, expected_student_version: "${st_v0}" }
              as: EligibilityOfficer
              as_user_id: "officer-c"
              captures: { st_v1: $.data.version }
            - call: "POST /students/${st_id}/academic-postings"
              payload: { term_label: "2026-WINTER", term_gpa: 1.999, term_credits: 6, expected_student_version: "${st_v1}" }
              as: EligibilityOfficer
              as_user_id: "officer-c"
              captures: { st_v2: $.data.version }
            - call: "POST /students/${st_id}/academic-postings"
              payload: { term_label: "2026-SPRING", term_gpa: 1.750, term_credits: 6, expected_student_version: "${st_v2}" }
              as: EligibilityOfficer
              as_user_id: "officer-c"
              captures: { st_v3: $.data.version }
            - call: "POST /students/${st_id}/academic-postings"
              payload: { term_label: "2026-SUMMER", term_gpa: 1.749, term_credits: 6, expected_student_version: "${st_v3}" }
              as: EligibilityOfficer
              as_user_id: "officer-c"
          assert:
            - "the first trigger call returns 200 with data.effective_gpa == 2.000 and data.academic_standing == GOOD"
            - "the second trigger call returns 200 with data.effective_gpa == 1.999 and data.academic_standing == PROBATION"
            - "the third trigger call returns 200 with data.effective_gpa == 1.750 and data.academic_standing == PROBATION"
            - "the fourth trigger call returns 200 with data.effective_gpa == 1.749 and data.academic_standing == INELIGIBLE"
            - "after the fourth call data.latest_term_gpa == 1.749, data.prior_term_gpa == 1.750 and data.standing_basis_applied == TERM_SNAPSHOT"
            - "data.version == 5 after the fourth posting — every posting is one write"

      - name: rolling_cumulative_reads_only_the_two_most_recent_postings
        claim_type: input_set_filtering
        grounds:
          - calculations.academic_standing_evaluation.input_set
          - entities.Student.prior_term_gpa
          - entities.Student.prior_term_credits
        distinguishing_aspect: |
          Depth is exactly two. Three postings of 3.000, 1.000 and 2.000 credit-weighted
          equally must yield (2.000*6 + 1.000*6) / 12 == 1.500 and INELIGIBLE, because
          the 3.000 term has been displaced and can never re-enter. An implementation
          that keeps a full transcript computes (18 + 6 + 12) / 18 == 2.000 and reports
          GOOD — the opposite eligibility verdict from the same three requests.
        test_recipe:
          setup:
            - "One district with academic_standing_basis ROLLING_CUMULATIVE, default min_gpa 2.0 and probation_gpa_floor 1.75"
            - "One school and one student"
          setup_api_calls:
            - call: "POST /districts"
              payload: { name: "Rolling District", state_code: "OR", academic_standing_basis: "ROLLING_CUMULATIVE" }
              as: LeagueAdmin
              captures: { d_id: $.data.id }
            - call: "POST /schools"
              payload: { district_id: "${d_id}", name: "West High", nces_code: "W-001" }
              as: DistrictAdmin
              as_user_id: "${d_id}"
              captures: { s_id: $.data.id }
            - call: "POST /students"
              payload: { school_id: "${s_id}", full_name: "Iris Vale", birthdate: "2009-05-10", grade_level: 11 }
              as: AthleticDirector
              as_user_id: "${s_id}"
              captures: { st_id: $.data.id, st_v0: $.data.version }
          trigger:
            - call: "POST /students/${st_id}/academic-postings"
              payload: { term_label: "2025-FALL", term_gpa: 3.000, term_credits: 6, expected_student_version: "${st_v0}" }
              as: EligibilityOfficer
              as_user_id: "officer-c"
              captures: { st_v1: $.data.version }
            - call: "POST /students/${st_id}/academic-postings"
              payload: { term_label: "2026-WINTER", term_gpa: 1.000, term_credits: 6, expected_student_version: "${st_v1}" }
              as: EligibilityOfficer
              as_user_id: "officer-c"
              captures: { st_v2: $.data.version }
            - call: "POST /students/${st_id}/academic-postings"
              payload: { term_label: "2026-SPRING", term_gpa: 2.000, term_credits: 6, expected_student_version: "${st_v2}" }
              as: EligibilityOfficer
              as_user_id: "officer-c"
          assert:
            - "the first trigger call returns 200 with data.effective_gpa == 3.000 and data.academic_standing == GOOD (prior term absent, denominator 6)"
            - "the second trigger call returns 200 with data.effective_gpa == 2.000 and data.academic_standing == GOOD ((1.000*6 + 3.000*6)/12)"
            - "the third trigger call returns 200 with data.effective_gpa == 1.500 and data.academic_standing == INELIGIBLE"
            - "after the third call data.latest_term_gpa == 2.000, data.latest_term_credits == 6, data.prior_term_gpa == 1.000 and data.prior_term_credits == 6"
            - "data.standing_basis_applied == ROLLING_CUMULATIVE"

      - name: rolling_gpa_rounds_half_up_at_the_third_decimal
        claim_type: precision
        grounds:
          - calculations.academic_standing_evaluation.precision
          - calculations.academic_standing_evaluation.constants.GPA_PRECISION
        distinguishing_aspect: |
          Unequal credit weights produce a non-terminating quotient:
          (2.000*5 + 1.000*6) / 11 == 1.454545..., whose fourth decimal is exactly 5 at
          the rounding position, so round_half_up must yield 1.455 rather than a
          truncated 1.454. Bankers' rounding and truncation both land on 1.454.
        test_recipe:
          setup:
            - "One ROLLING_CUMULATIVE district, one school, one student"
          setup_api_calls:
            - call: "POST /districts"
              payload: { name: "Rounding District", state_code: "WA", academic_standing_basis: "ROLLING_CUMULATIVE" }
              as: LeagueAdmin
              captures: { d_id: $.data.id }
            - call: "POST /schools"
              payload: { district_id: "${d_id}", name: "East High", nces_code: "E-001" }
              as: DistrictAdmin
              as_user_id: "${d_id}"
              captures: { s_id: $.data.id }
            - call: "POST /students"
              payload: { school_id: "${s_id}", full_name: "Otto Pell", birthdate: "2009-05-10", grade_level: 11 }
              as: AthleticDirector
              as_user_id: "${s_id}"
              captures: { st_id: $.data.id, st_v0: $.data.version }
            - call: "POST /students/${st_id}/academic-postings"
              payload: { term_label: "2025-FALL", term_gpa: 1.000, term_credits: 6, expected_student_version: "${st_v0}" }
              as: EligibilityOfficer
              as_user_id: "officer-c"
              captures: { st_v1: $.data.version }
          trigger:
            - call: "POST /students/${st_id}/academic-postings"
              payload: { term_label: "2026-SPRING", term_gpa: 2.000, term_credits: 5, expected_student_version: "${st_v1}" }
              as: EligibilityOfficer
              as_user_id: "officer-c"
          assert:
            - "the trigger call returns 200 with data.effective_gpa == 1.455 (exactly three decimals, round_half_up of 1.454545...)"
            - "data.academic_standing == INELIGIBLE because 1.455 < probation_gpa_floor 1.75"
            - "data.latest_term_credits == 5 and data.prior_term_credits == 6 — the weights are the posted credits, not equal weights"

      - name: participation_ladder_lets_release_outrank_an_academic_block
        claim_type: constraint_propagation
        grounds:
          - calculations.roster_slot_participation
          - state_machines.RosterSlot.academic_PENDING_to_BLOCKED
          - entities.Team.starter_slots_used
          - entities.Team.starter_slots_available
        distinguishing_aspect: |
          The ladder is ordered: released_at beats ineligibility_reason beats the
          two-axis ACTIVE test. A slot that is already INELIGIBLE for ACADEMIC reasons
          must report RELEASED — not INELIGIBLE — once released, and the team roll-ups
          must move from (used 1, available 2, active 0) to (used 0, available 3,
          active 0) in the same write, since RELEASED is the one participation state
          that stops consuming starter capacity.
        test_recipe:
          setup:
            - "TERM_SNAPSHOT district, school, certified coach, title, season, one student with a 3.200 posting"
            - "DRAFT team with one STARTER slot whose enrollment axis is verified and whose academic axis is still PENDING"
            - "A 1.500 posting then blocks the slot"
          setup_api_calls:
            - call: "POST /districts"
              payload: { name: "Metro District", state_code: "CA" }
              as: LeagueAdmin
              captures: { d_id: $.data.id }
            - call: "POST /schools"
              payload: { district_id: "${d_id}", name: "North High", nces_code: "N-001" }
              as: DistrictAdmin
              as_user_id: "${d_id}"
              captures: { s_id: $.data.id }
            - call: "POST /coaches"
              payload: { school_id: "${s_id}", full_name: "Coach Alpha", email: "alpha@example.org" }
              as: AthleticDirector
              as_user_id: "${s_id}"
              captures: { c_a_id: $.data.id }
            - call: "POST /coaches/${c_a_id}/certification"
              payload: { action: "CERTIFY", background_check_expires_on: "2027-06-30" }
              as: AthleticDirector
              as_user_id: "${s_id}"
            - call: "POST /titles"
              payload: { name: "Rocket Arena", publisher: "Nova Interactive" }
              as: LeagueAdmin
              captures: { t_id: $.data.id }
            - call: "POST /seasons"
              payload: { title_id: "${t_id}", name: "Fall 2026 Varsity" }
              as: LeagueAdmin
              captures: { se_id: $.data.id }
            - call: "POST /students"
              payload: { school_id: "${s_id}", full_name: "Rosa Nova", birthdate: "2009-05-10", grade_level: 11 }
              as: AthleticDirector
              as_user_id: "${s_id}"
              captures: { st_id: $.data.id, st_v0: $.data.version }
            - call: "POST /students/${st_id}/academic-postings"
              payload: { term_label: "2026-SPRING", term_gpa: 3.200, term_credits: 6, expected_student_version: "${st_v0}" }
              as: EligibilityOfficer
              as_user_id: "officer-c"
              captures: { st_v1: $.data.version }
            - call: "POST /teams"
              payload: { season_id: "${se_id}", school_id: "${s_id}", title_id: "${t_id}", coach_id: "${c_a_id}", name: "North Alpha" }
              as: Coach
              as_user_id: "${c_a_id}"
              captures: { tm_id: $.data.id }
            - call: "POST /roster-slots"
              payload: { team_id: "${tm_id}", student_id: "${st_id}", slot_role: "STARTER" }
              as: Coach
              as_user_id: "${c_a_id}"
              captures: { rs_id: $.data.id }
            - call: "POST /roster-slots/${rs_id}/verify-enrollment"
              payload: { enrollment_document_ref: "REG-A", verified_birthdate: "2009-05-10" }
              as: EligibilityOfficer
              as_user_id: "officer-a"
            - call: "POST /students/${st_id}/academic-postings"
              payload: { term_label: "2026-SUMMER", term_gpa: 1.500, term_credits: 6, expected_student_version: "${st_v1}" }
              as: EligibilityOfficer
              as_user_id: "officer-c"
          trigger:
            - call: "POST /roster-slots/${rs_id}/release"
              payload: { release_note: "academically ineligible, slot freed" }
              as: Coach
              as_user_id: "${c_a_id}"
          assert:
            - "immediately before the trigger call RosterSlot.${rs_id}.participation_status == INELIGIBLE with academic_status == BLOCKED, ineligibility_reason == ACADEMIC, and Team.${tm_id}.starter_slots_used == 1 with starter_slots_available == 2"
            - "the trigger call returns 200 with data.participation_status == RELEASED and data.released_at == 2026-08-01T00:00:00.000Z"
            - "data.verification_status is still ENROLLMENT_VERIFIED and data.academic_status is still BLOCKED — release does not rewrite the two axes"
            - "Team.${tm_id}.starter_slots_used == 0, starter_slots_available == 3 and active_starter_count == 0"

      - name: two_agreeing_reports_confirm_a_draw_and_award_one_point_to_each_side
        claim_type: projection
        grounds:
          - calculations.match_point_award
          - calculations.match_point_award.constants
          - calculations.dispute_window_deadline
          - state_machines.Match.AWAITING_REPORTS_to_PARTIALLY_REPORTED
          - state_machines.Match.PARTIALLY_REPORTED_to_CONFIRMED
          - concurrency_rules[result-report-stale-match]
        distinguishing_aspect: |
          The draw branch is the one that pays both sides: POINTS_DRAW 1 to each, draws
          incremented on both teams, games_won and games_lost both 1 on both teams, and
          winner_team_id explicitly null rather than defaulted to the home side. The
          season pool must rise by exactly 2 (not 3, not 6), and the confirmation must
          set result_confirmed_at and dispute_deadline_at at +48 hours in the same write.
          Each report also carries expected_match_version, so the second report must use
          the version the first one produced.
