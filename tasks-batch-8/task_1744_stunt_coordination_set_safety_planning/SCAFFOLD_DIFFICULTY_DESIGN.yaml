  # ---------------------------------------------------------------------------
  # Rule 6 — boundary_precision_check (score at lock-design; count at mark-ready; money at agree)
  # ---------------------------------------------------------------------------
  - rule_id: boundary_precision_check
    instances:
      - name: bp_board_score_threshold_26_vs_25
        grounds:
          - calculations.risk_score
          - validations[priority=8]
        distinguishing_aspect: |
          Metric: risk score; endpoint: lock-design. board_score exactly 26 (>= threshold) is rejected while
          25 locks — the >= vs > boundary on the score is the deciding bit.
        test_recipe:
          setup:
            - "Production SETUP; seq1 PYRO/CRITICAL S4L5 (board 26); seq2 FIRE/CRITICAL S4L5 (board 25)"
          setup_api_calls:
            - call: "POST /api/productions"
              payload: { name: "Boundary Score Prod", total_budget_cents: 10000000 }
              as: ProductionExecutive
              captures: { prod_id: $.data.id }
            - call: "POST /api/stunt-sequences"
              payload: { production_id: "${prod_id}", name: "Pyro Seq", hazard_class: "PYRO", risk_category: "CRITICAL", scheduled_execution_start: "2026-08-05T00:00:00Z", scheduled_execution_end: "2026-08-06T00:00:00Z", required_equipment_ids: [] }
              as: StuntCoordinator
              as_user_id: "coord-1"
              captures: { seq1: $.data.id, seq1_v: $.data.version }
            - call: "POST /api/risk-assessments"
              payload: { production_id: "${prod_id}", sequence_id: "${seq1}", severity_rating: 4, likelihood_rating: 5, expected_sequence_version: "${seq1_v}" }
              as: StuntCoordinator
              as_user_id: "coord-1"
              captures: { ra1: $.data.id }
            - call: "POST /api/risk-assessments/${ra1}/submit"
              as: StuntCoordinator
              as_user_id: "coord-1"
            - call: "POST /api/risk-assessments/${ra1}/approve"
              as: SafetyOfficer
              as_user_id: "so-1"
            - call: "POST /api/stunt-sequences"
              payload: { production_id: "${prod_id}", name: "Fire Seq", hazard_class: "FIRE", risk_category: "CRITICAL", scheduled_execution_start: "2026-08-05T00:00:00Z", scheduled_execution_end: "2026-08-06T00:00:00Z", required_equipment_ids: [] }
              as: StuntCoordinator
              as_user_id: "coord-1"
              captures: { seq2: $.data.id, seq2_v: $.data.version }
            - call: "POST /api/risk-assessments"
              payload: { production_id: "${prod_id}", sequence_id: "${seq2}", severity_rating: 4, likelihood_rating: 5, expected_sequence_version: "${seq2_v}" }
              as: StuntCoordinator
              as_user_id: "coord-1"
              captures: { ra2: $.data.id }
            - call: "POST /api/risk-assessments/${ra2}/submit"
              as: StuntCoordinator
              as_user_id: "coord-1"
            - call: "POST /api/risk-assessments/${ra2}/approve"
              as: SafetyOfficer
              as_user_id: "so-1"
          trigger:
            - call: "POST /api/stunt-sequences/${seq1}/lock-design"
              as: StuntCoordinator
              as_user_id: "coord-1"
              captures: { err1: $.data.error_id }
            - call: "POST /api/stunt-sequences/${seq2}/lock-design"
              as: StuntCoordinator
              as_user_id: "coord-1"
              captures: { board2: $.data.board_score, status2: $.data.status }
          assert:
            - "err1 == ERR_RISK_SCORE_ABOVE_THRESHOLD, http 422 — board 26 >= 26 rejects"
            - "board2 == 25 and status2 == DESIGN_LOCKED — one point below the threshold passes"

      - name: bp_rehearsal_quota_exact_equality
        grounds:
          - calculations.required_rehearsal_count
          - validations[priority=9]
          - entities.StuntSequence.fields.completed_rehearsal_count
        distinguishing_aspect: |
          Metric: integer rehearsal count (zero-count edge family); endpoint: mark-ready. A HIGH sequence with
          quota 3 is rejected at count 2 and accepted at exactly 3 — the >= equality boundary on the count.
        test_recipe:
          setup:
            - "ACTIVE production, insurance ACKNOWLEDGED; HIGH/FIGHT sequence DESIGN_LOCKED (quota 3, medic required)"
            - "Two rehearsals COMPLETED, third still scheduled; signed meeting at revision 1 with MEDIC signed"
          setup_api_calls:
            - call: "POST /api/productions"
              payload: { name: "Quota Prod", total_budget_cents: 10000000 }
              as: ProductionExecutive
              captures: { prod_id: $.data.id }
            - call: "POST /api/productions/${prod_id}/file-insurance"
              payload: { declared_exposure_cents: 50000000 }
              as: ProductionExecutive
            - call: "POST /api/productions/${prod_id}/acknowledge-insurance"
              as: ProductionExecutive
            - call: "POST /api/productions/${prod_id}/activate"
              as: ProductionExecutive
            - call: "POST /api/stunt-sequences"
              payload: { production_id: "${prod_id}", name: "High Seq", hazard_class: "FIGHT", risk_category: "HIGH", scheduled_execution_start: "2026-08-05T00:00:00Z", scheduled_execution_end: "2026-08-06T00:00:00Z", required_equipment_ids: [] }
              as: StuntCoordinator
              as_user_id: "coord-1"
              captures: { seq_id: $.data.id, seq_v: $.data.version }
            - call: "POST /api/risk-assessments"
              payload: { production_id: "${prod_id}", sequence_id: "${seq_id}", severity_rating: 3, likelihood_rating: 4, expected_sequence_version: "${seq_v}" }
              as: StuntCoordinator
              as_user_id: "coord-1"
              captures: { ra_id: $.data.id }
            - call: "POST /api/risk-assessments/${ra_id}/submit"
              as: StuntCoordinator
              as_user_id: "coord-1"
            - call: "POST /api/risk-assessments/${ra_id}/approve"
              as: SafetyOfficer
              as_user_id: "so-1"
            - call: "POST /api/stunt-sequences/${seq_id}/lock-design"
              as: StuntCoordinator
              as_user_id: "coord-1"
              captures: { quota: $.data.required_rehearsal_count }
            - call: "POST /api/performers"
              payload: { production_id: "${prod_id}", first_name: "Jay", last_name: "Ten", base_day_rate_cents: 150000, union_status: "NON_UNION" }
              as: StuntCoordinator
              as_user_id: "coord-1"
              captures: { perf_id: $.data.id }
            - call: "POST /api/certifications"
              payload: { performer_id: "${perf_id}", discipline: "FIGHT", level: "MASTER", issued_at: "2026-01-01T00:00:00Z", expires_at: "2027-01-01T00:00:00Z" }
              as: StuntCoordinator
              as_user_id: "coord-1"
            - call: "POST /api/rehearsals"
              payload: { production_id: "${prod_id}", sequence_id: "${seq_id}", performer_id: "${perf_id}", facility: "Stage 1", scheduled_start: "2026-08-02T09:00:00Z", scheduled_end: "2026-08-02T10:00:00Z" }
              as: StuntCoordinator
              as_user_id: "coord-1"
              captures: { r1: $.data.id }
            - call: "POST /api/rehearsals"
              payload: { production_id: "${prod_id}", sequence_id: "${seq_id}", performer_id: "${perf_id}", facility: "Stage 1", scheduled_start: "2026-08-02T10:00:00Z", scheduled_end: "2026-08-02T11:00:00Z" }
              as: StuntCoordinator
              as_user_id: "coord-1"
              captures: { r2: $.data.id }
            - call: "POST /api/rehearsals"
              payload: { production_id: "${prod_id}", sequence_id: "${seq_id}", performer_id: "${perf_id}", facility: "Stage 1", scheduled_start: "2026-08-02T11:00:00Z", scheduled_end: "2026-08-02T12:00:00Z" }
              as: StuntCoordinator
              as_user_id: "coord-1"
              captures: { r3: $.data.id }
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-02T12:30:00Z" }
              as: ProductionExecutive
            - call: "POST /api/rehearsals/${r1}/complete"
              as: StuntCoordinator
              as_user_id: "coord-1"
            - call: "POST /api/rehearsals/${r2}/complete"
              as: StuntCoordinator
              as_user_id: "coord-1"
          trigger:
            - call: "POST /api/stunt-sequences/${seq_id}/mark-ready"
              as: StuntCoordinator
              as_user_id: "coord-1"
              captures: { err_quota: $.data.error_id }
            - call: "POST /api/rehearsals/${r3}/complete"
              as: StuntCoordinator
              as_user_id: "coord-1"
            - call: "POST /api/safety-meetings"
              payload: { production_id: "${prod_id}", sequence_id: "${seq_id}", facility: "Stage 2", scheduled_start: "2026-08-03T10:00:00Z", scheduled_end: "2026-08-03T11:00:00Z" }
              as: StuntCoordinator
              as_user_id: "coord-1"
              captures: { mtg_id: $.data.id }
            - call: "POST /api/safety-meetings/${mtg_id}/start"
              as: SafetyOfficer
              as_user_id: "so-1"
            - call: "GET /api/department-signoffs?meeting_id=${mtg_id}"
              as: SafetyOfficer
              captures: { sg0: "$.data[0].id", sg1: "$.data[1].id", sg2: "$.data[2].id", sg3: "$.data[3].id", sg4: "$.data[4].id" }
            - call: "POST /api/department-signoffs/${sg0}/sign"
              as: DepartmentHead
              as_user_id: "dh-1"
            - call: "POST /api/department-signoffs/${sg1}/sign"
              as: DepartmentHead
              as_user_id: "dh-1"
            - call: "POST /api/department-signoffs/${sg2}/sign"
              as: DepartmentHead
              as_user_id: "dh-1"
            - call: "POST /api/department-signoffs/${sg3}/sign"
              as: DepartmentHead
              as_user_id: "dh-1"
            - call: "POST /api/department-signoffs/${sg4}/sign"
              as: DepartmentHead
              as_user_id: "dh-1"
            - call: "POST /api/safety-meetings/${mtg_id}/complete"
              as: SafetyOfficer
              as_user_id: "so-1"
            - call: "POST /api/stunt-sequences/${seq_id}/mark-ready"
              as: StuntCoordinator
              as_user_id: "coord-1"
              captures: { status_final: $.data.status, count_final: $.data.completed_rehearsal_count }
          assert:
            - "quota == 3 (HIGH base 3, no special equipment adder)"
            - "First mark-ready rejected: err_quota == ERR_REHEARSAL_QUOTA_NOT_MET, http 422 — count 2 < 3"
            - "Second mark-ready at exactly 3: status_final == READY and count_final == 3 — equality passes"

      - name: bp_budget_equality_at_agree
        grounds:
          - calculations.budget_authority_check
          - validations[priority=14]
        distinguishing_aspect: |
          Metric: money (cents); endpoint: pay-adjustment agree. A line equal to available headroom
          (900000 == 900000) commits, proving the <= (not <) boundary.
        test_recipe:
          setup:
            - "Production SETUP budget 1000000; MEDIUM/FIGHT DRAFT sequence; QUALIFIED NON_UNION performer"
          setup_api_calls:
            - call: "POST /api/productions"
              payload: { name: "Eq Budget Prod", total_budget_cents: 1000000 }
              as: ProductionExecutive
              captures: { prod_id: $.data.id }
            - call: "POST /api/stunt-sequences"
              payload: { production_id: "${prod_id}", name: "Eq Seq", hazard_class: "FIGHT", risk_category: "MEDIUM", scheduled_execution_start: "2026-08-05T00:00:00Z", scheduled_execution_end: "2026-08-06T00:00:00Z", required_equipment_ids: [] }
              as: StuntCoordinator
              as_user_id: "coord-1"
              captures: { seq_id: $.data.id }
            - call: "POST /api/performers"
              payload: { production_id: "${prod_id}", first_name: "Kay", last_name: "Ele", base_day_rate_cents: 900000, union_status: "NON_UNION" }
              as: StuntCoordinator
              as_user_id: "coord-1"
              captures: { perf_id: $.data.id }
            - call: "POST /api/certifications"
              payload: { performer_id: "${perf_id}", discipline: "FIGHT", level: "BASIC", issued_at: "2026-01-01T00:00:00Z", expires_at: "2027-01-01T00:00:00Z" }
              as: StuntCoordinator
              as_user_id: "coord-1"
            - call: "POST /api/pay-adjustments"
              payload: { production_id: "${prod_id}", sequence_id: "${seq_id}", performer_id: "${perf_id}", adjustment_type: "HAZARD_BUMP", base_amount_cents: 900000, requested_pct: 0.0 }
              as: Performer
              as_user_id: "${perf_id}"
              captures: { adj_id: $.data.id }
          trigger:
            - call: "POST /api/pay-adjustments/${adj_id}/agree"
              as: StuntCoordinator
              as_user_id: "coord-1"
              captures: { adj_status: $.data.status, adj_final: $.data.final_amount_cents }
            - call: "GET /api/productions/${prod_id}"
              as: ProductionExecutive
              captures: { committed: $.data.committed_pay_cents }
          assert:
            - "adj_status == AGREED and adj_final == 900000 — equality with available (1000000 - 0 - 100000) passes <="
            - "Production.${prod_id}.committed_pay_cents == 900000"

  # ---------------------------------------------------------------------------
  # Rule 7 — cross_entity_state_dependency (Rehearsal->Sequence; Execution->Permit)
  # ---------------------------------------------------------------------------
  - rule_id: cross_entity_state_dependency
    instances:
      - name: xdep_rehearsal_requires_locked_sequence
        grounds:
          - state_machines.StuntSequence.DRAFT_to_DESIGN_LOCKED
          - validations[priority=6]
        distinguishing_aspect: |
          Entity pair Rehearsal -> StuntSequence: rehearsal creation is rejected while the sequence is DRAFT
          and succeeds once the sequence reaches DESIGN_LOCKED — a cross-entity state precondition.
        test_recipe:
          setup:
            - "ACTIVE production; LOW/FIGHT sequence first DRAFT then DESIGN_LOCKED; QUALIFIED FIGHT performer"
          setup_api_calls:
            - call: "POST /api/productions"
              payload: { name: "XDep Prod", total_budget_cents: 10000000 }
              as: ProductionExecutive
              captures: { prod_id: $.data.id }
            - call: "POST /api/productions/${prod_id}/file-insurance"
              payload: { declared_exposure_cents: 50000000 }
              as: ProductionExecutive
            - call: "POST /api/productions/${prod_id}/activate"
              as: ProductionExecutive
            - call: "POST /api/stunt-sequences"
              payload: { production_id: "${prod_id}", name: "XDep Seq", hazard_class: "FIGHT", risk_category: "LOW", scheduled_execution_start: "2026-08-05T00:00:00Z", scheduled_execution_end: "2026-08-06T00:00:00Z", required_equipment_ids: [] }
              as: StuntCoordinator
              as_user_id: "coord-1"
              captures: { seq_id: $.data.id, seq_v: $.data.version }
