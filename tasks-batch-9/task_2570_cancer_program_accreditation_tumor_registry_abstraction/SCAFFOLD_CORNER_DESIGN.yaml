      - name: response_after_the_extended_window_closes_is_rejected
        claim_type: Triggerable Error
        grounds:
          - errors[ERR_DEFICIENCY_RESPONSE_WINDOW_CLOSED]
          - calculations.deficiency_response_window
          - endpoints[POST /_clock/set_current_utc]
        distinguishing_aspect: |
          A RESPONSE_REJECTED deficiency is deliberately exempt from the clock's escalation sweep, so
          passing its extended due date neither escalates it nor puts the program on probation - the
          consequence is deferred to the next response attempt, which is the only place the closed
          window can be observed.
        test_recipe:
          setup:
            - "A MAJOR deficiency cited 2026-08-01 (due 2026-09-15) whose first response is REJECTED, extending the window to 2026-09-30; the clock is then moved to 2026-10-01."
          setup_api_calls:
            - call: "POST /cancer-registry/programs"
              payload: { name: "Northside Cancer Center", coc_program_id: "COC-1456N", annual_analytic_caseload: 300, reference_year: 2018, timeliness_standard_days: 180 }
              as: PlatformAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /cancer-registry/deficiencies"
              payload: { program_id: "${prog_id}", standard_code: "STD-4.5", severity: "MAJOR", cited_on: "2026-08-01" }
              as: CoCSurveyor
              as_user_id: "user-surveyor-1"
              captures: { def_id: $.data.id }
            - call: "POST /cancer-registry/deficiencies/${def_id}/response"
              payload: { response_narrative: "First plan", evidence_reference: "CAP-1" }
              as: AccreditationCoordinator
              as_user_id: "user-coord-1"
            - call: "POST /cancer-registry/deficiencies/${def_id}/response-review"
              payload: { outcome: "REJECTED", reviewer_notes: "Insufficient evidence" }
              as: CoCSurveyor
              as_user_id: "user-surveyor-1"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-10-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /cancer-registry/deficiencies/${def_id}/response"
              payload: { response_narrative: "Second plan, filed late", evidence_reference: "CAP-2" }
              as: AccreditationCoordinator
              as_user_id: "user-coord-1"
              captures: { err: $.data.error_id }
          assert:
            - "before the trigger the deficiency reads deficiency_state == RESPONSE_REJECTED, escalation_count == 1 and response_due_date == 2026-09-30"
            - "the clock advance past 2026-09-30 does NOT sweep it: deficiency_state is still RESPONSE_REJECTED (not ESCALATED) and the program is still ACCREDITED with registry_posture OPEN"
            - "the late response returns HTTP 409 with data.error_id == ERR_DEFICIENCY_RESPONSE_WINDOW_CLOSED"
            - "response_narrative is still 'First plan' and evidence_reference is still 'CAP-1' (the late narrative was not written)"
            - "escalation_count is still 1 and response_due_date is still 2026-09-30"

