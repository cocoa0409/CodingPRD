    description: "List WarrantyClaims for Agreement"
    roles: [PlatformAdmin, ClaimsAdjuster, Customer, InstallCoordinator]
    code: 200
    input: ["limit?", "offset?", "status?"]
    output: "WarrantyClaim[]"
    side_effects: []

  - method: GET
    path: "/stairlift-ops/warranty-claims/{id}"
    description: "Get a WarrantyClaim"
    roles: [PlatformAdmin, ClaimsAdjuster, Customer]
    code: 200
    input: []
