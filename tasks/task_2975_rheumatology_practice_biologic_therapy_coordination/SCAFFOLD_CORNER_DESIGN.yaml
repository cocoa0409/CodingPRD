              as: RegistryAdmin
              captures: { mer_id: $.data.id }
            - call: "POST /patients"
              payload: { mrn: "RH0001", full_name: "Pat One", date_of_birth: "1975-04-12", diagnosis_code: "RA_SEROPOSITIVE", registry_consent: true }
              as: RegistryAdmin
              captures: { pat_id: $.data.id, pat_v: $.data.version }
          trigger:
            - call: "POST /therapy-episodes"
              payload: { patient_id: "00000000-0000-0000-0000-000000000000", drug_id: "${ifx_id}", payer_plan_id: "${mer_id}", therapy_start_at: "not-a-timestamp", expected_patient_version: "${pat_v}" }
              as: Rheumatologist
