  # =====================================================================
  # Rule 8 — resource_temporal_overlap: DIFFERENT interval semantics on
  # different resources (aggregate instantaneous capacity on beds; half-open
  # interval adjacency on screening lanes; aggregate capacity on chairs).
  # =====================================================================
  - rule_id: resource_temporal_overlap
    instances:

      - name: donor_floor_bed_aggregate_capacity_and_reuse
        grounds:
          - calculations.capacity_occupancy
          - calculations.lowest_free_slot_assignment
          - validations[priority=15]
        distinguishing_aspect: |
          Resource = donor-floor bed; semantics = instantaneous AGGREGATE capacity
          (beds_in_use < donor_floor_beds, strict less-than) rather than interval
          arithmetic. With 1 bed occupied by donorA's IN_PROGRESS visit, donorB's
          check-in is rejected ERR_NO_BED_AVAILABLE; the instant donorA's collection
          completes (bed freed, chair taken), the identical request succeeds and the
          freed slot is reused at index 0 per the min-free rule.
        test_recipe:
          setup:
            - "Center with donor_floor_beds=1, observation_chairs=2; donors A and B each with a CLEARED screening and a SCHEDULED donation at 09:30"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /plasma-centers"
              payload: { center_code: "CSL-DAL-014", legal_name: "CSL Plasma Dallas 014", state_code: "TX", screening_lanes: 2, donor_floor_beds: 1, observation_chairs: 2 }
              as: PlatformAdmin
              captures: { c: $.data.id, cv: $.data.version }
            - call: "POST /plasma-centers/${c}/compensation-schedules"
              payload: { effective_from: "2026-08-01T00:00:00Z", effective_to: "2026-12-01T00:00:00Z", base_cents_first_donation: 3000, base_cents_second_donation: 2500, base_cents_subsequent_donation: 2000, expected_center_version: "${cv}" }
