      - name: checkin_duplicate_before_order_rule
        claim_type: violation_to_error
        grounds: ["validations[priority=10]", "errors[ERR_CHECKIN_ALREADY_RECORDED]", "errors[ERR_CHECKIN_OUT_OF_ORDER]"]
        distinguishing_aspect: "Intra-priority pin: a marker that is both already recorded and out of order yields ERR_CHECKIN_ALREADY_RECORDED (uniqueness checked first), while a fresh non-next marker yields ERR_CHECKIN_OUT_OF_ORDER."
        test_recipe:
          setup: ["Physician + case; ACTIVE mentorship with D30 recorded"]
          setup_api_calls:
            - { call: "POST /onboarding/physicians", payload: { full_name: "Dr. Xiu", specialty: "FAMILY_MEDICINE", email: "xiu@x.com", hire_type: "EXPERIENCED" }, as: Recruiter, captures: { phys_id: "$.data.id" } }
