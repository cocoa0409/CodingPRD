  # ---------------------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: order_approve_state_error_precedes_budget_error
        grounds:
          - validations[priority=6]
          - validations[priority=13]
          - errors[ERR_INVALID_ORDER_TRANSITION]
          - errors[ERR_BUDGET_WOULD_EXCEED]
        distinguishing_aspect: |
          Category pair state vs business_fiscal: approving a DRAFT order whose total (4393)
          exceeds the event budget (1000) violates BOTH the from-state precondition (order not
          SUBMITTED) and the fiscal gate; the state-category error ERR_INVALID_ORDER_TRANSITION
          (priority 6) MUST win over ERR_BUDGET_WOULD_EXCEED (priority 13).
        test_recipe:
          setup:
            - "Project MATCHED to event in PLANNING with budget_cents 1000; order (total 4393) created but never submitted (still DRAFT)"
          setup_api_calls:
            - { call: "POST /nonprofit-partners", payload: { name: "River Guild", contact_email: "ops@river.org" }, as: CommunityEngagementManager, captures: { np1: $.data.id } }
            - { call: "POST /service-projects", payload: { nonprofit_id: "${np1}", title: "Park Build", min_volunteers: 1, max_volunteers: 10 }, as: NonprofitCoordinator, as_user_id: "${np1}", captures: { proj1: $.data.id } }
            - { call: "POST /service-events", payload: { name: "Day I", event_start_at: "2026-08-20T09:00:00Z", event_end_at: "2026-08-20T15:00:00Z", budget_cents: 1000 }, as: CommunityEngagementManager, captures: { ev1: $.data.id } }
            - { call: "POST /service-projects/${proj1}/vet", payload: {}, as: CommunityEngagementManager }
            - { call: "POST /service-projects/${proj1}/match", payload: { event_id: "${ev1}" }, as: CommunityEngagementManager }
            - { call: "POST /procurement-orders", payload: { event_id: "${ev1}", project_id: "${proj1}", lines: [ { item_name: "Lumber", quantity: 3, unit_cost_cents: 999 }, { item_name: "Screws", quantity: 7, unit_cost_cents: 149 } ] }, as: CommunityEngagementManager, as_user_id: "cem-1", captures: { ord1: $.data.id } }
          trigger:
            - { call: "POST /procurement-orders/${ord1}/approve", payload: {}, as: ProcurementOfficer, as_user_id: "po-1", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_ORDER_TRANSITION (state priority 6 beats business_fiscal priority 13)"
            - "NOT ERR_BUDGET_WOULD_EXCEED even though 4393 > budget 1000"
            - "ProcurementOrder.${ord1}.status remains DRAFT"

      - name: confirm_waiver_safety_precedes_capacity_constraint
        grounds:
          - validations[priority=7]
          - validations[priority=11]
          - errors[ERR_WAIVER_NOT_SIGNED]
          - errors[ERR_PROJECT_AT_CAPACITY]
        distinguishing_aspect: |
          Category pair business_safety vs business_constraint (different pair from the other
          instance): confirming a registration whose waiver is still WAIVER_PENDING while the
          project is already at max_volunteers violates BOTH rules; the safety error
          ERR_WAIVER_NOT_SIGNED (priority 7) MUST win over ERR_PROJECT_AT_CAPACITY (priority 11).
        test_recipe:
          setup:
            - "Project (min 1, max 1) MATCHED to OPEN event; volunteer A signed + CONFIRMED (capacity now full at 1/1); volunteer B REGISTERED with waiver WAIVER_PENDING"
          setup_api_calls:
