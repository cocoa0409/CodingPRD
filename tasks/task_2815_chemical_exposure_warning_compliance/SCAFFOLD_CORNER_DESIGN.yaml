              as: RegistryAdmin
            - call: "POST /listed-chemicals"
              payload: { chemical_name: "Bisphenol A", cas_number: "80-05-7", endpoint_type: "REPRODUCTIVE_FEMALE", safe_harbor_basis: "MADL", safe_harbor_level_ug_per_day: 0.5 }
              as: RegistryAdmin
              captures: { chem_bpa: $.data.id }
            - call: "POST /listed-chemicals/${chem_bpa}/transitions"
              payload: { action: "LIST", listing_effective_date: "2026-01-01T00:00:00Z" }
              as: RegistryAdmin
            - call: "POST /suppliers"
              payload: { legal_name: "Northgate Polymers", contact_email: "qa@northgate.example", warranty_scope: "ALL_MATERIALS", pass_through_warning_obligation: false, indemnity_cap_cents: 5000000, warranty_effective_from: "2026-01-01T00:00:00Z" }
              as: ComplianceAnalyst
              captures: { sup_1: $.data.id }
            - call: "POST /suppliers/${sup_1}/transitions"
              payload: { action: "EXECUTE_WARRANTY" }
              as: RegulatoryCounsel
              as_user_id: "rc_1"
            - call: "POST /materials"
              payload: { material_code: "RM-100", material_class: "RAW_MATERIAL", supplier_id: "${sup_1}" }
              as: ComplianceAnalyst
              captures: { mat_1: $.data.id }
            - call: "POST /materials/${mat_1}/chemicals"
              payload: { chemical_id: "${chem_bpa}", declared_concentration_ppm: 60.0 }
              as: ComplianceAnalyst
            - call: "POST /materials/${mat_1}/disclosure"
              payload: { action: "REQUEST" }
              as: ComplianceAnalyst
            - call: "POST /materials/${mat_1}/disclosure"
              payload: { action: "RECORD_RESPONSE", response_completeness: "COMPLETE" }
              as: ComplianceAnalyst
            - call: "POST /products"
              payload: { sku: "SKU-SCORE", product_name: "Defense Score Widget", product_category: "CONSUMER_GOOD", distribution_channels: ["RETAIL"], label_area_sq_in: 10.0, annual_units: 1000 }
              as: RegistryAdmin
              captures: { prod_1: $.data.id }
            - call: "POST /products/${prod_1}/components"
              payload: { material_id: "${mat_1}", quantity_grams_per_unit: 0.25, contact_factor: 0.5 }
              as: ComplianceAnalyst
            - call: "POST /products/${prod_1}/exposure-assessments"
              payload: { chemical_id: "${chem_bpa}", method: "MODELED", route: "DERMAL", uses_per_day: 1.0 }
              as: ComplianceAnalyst
              as_user_id: "ca_1"
              captures: { asmt_1: $.data.id }
            - call: "POST /exposure-assessments/${asmt_1}/transitions"
              payload: { action: "SUBMIT" }
              as: ComplianceAnalyst
              as_user_id: "ca_1"
            - call: "POST /exposure-assessments/${asmt_1}/transitions"
              payload: { action: "PEER_REVIEW" }
              as: ToxicologyReviewer
              as_user_id: "tox_1"
            - call: "POST /exposure-assessments/${asmt_1}/transitions"
              payload: { action: "FINALIZE" }
              as: ToxicologyReviewer
              as_user_id: "tox_1"
            - call: "GET /products/${prod_1}"
              payload: {}
              as: LabelingSpecialist
              captures: { pv_1: $.data.version }
            - call: "POST /warning-determinations"
              payload: { product_id: "${prod_1}", assessment_id: "${asmt_1}", decision: "WARNING_REQUIRED", expected_product_version: "${pv_1}" }
              as: LabelingSpecialist
              as_user_id: "ls_1"
              captures: { det_1: $.data.id }
            - call: "POST /warning-determinations/${det_1}/transitions"
              payload: { action: "SUBMIT_FOR_APPROVAL" }
              as: LabelingSpecialist
              as_user_id: "ls_1"
            - call: "POST /warning-determinations/${det_1}/transitions"
              payload: { action: "APPROVE" }
              as: RegulatoryCounsel
              as_user_id: "rc_1"
            - call: "POST /warning-determinations/${det_1}/placements"
              payload: { channel: "LABEL", effective_from: "2026-07-01T00:00:00Z", placement_detail: "Back panel, 6 pt bold, adjacent to net contents" }
              as: LabelingSpecialist
              as_user_id: "ls_1"
              captures: { plc_1: $.data.id }
            - call: "POST /warning-placements/${plc_1}/transitions"
              payload: { action: "IMPLEMENT" }
              as: LabelingSpecialist
              as_user_id: "ls_1"
          trigger:
            - call: "GET /products/${prod_1}/compliance-summary"
              payload: {}
              as: ComplianceAnalyst
          assert:
            - "HTTP 200 with variant == AS_OF_TODAY and as_of == 2026-08-01T00:00:00Z"
            - "warning_evidence == 0.5 (LABEL covered by an IMPLEMENTED placement but not VERIFIED)"
            - "assessment_evidence == 1.0 (one FINAL assessment)"
            - "warranty_evidence == 0.5 (warranty ACTIVE and in-window and scope covers RAW_MATERIAL, but pass_through_warning_obligation is false)"
            - "recordkeeping_evidence == 0.5 (disclosure_status RECEIVED, not VERIFIED)"
            - "defense_strength_score == 63 (40x0.5 + 25x1.0 + 20x0.5 + 15x0.5 = 62.5, round_half_up 0dp), NOT 62"
            - "required_channel_count == 1, covered_channel_count == 1, verified_channel_count == 0"
            - "final_assessment_count == 1, verified_material_count == 0, active_component_count == 1"

      - name: calc_modeled_vs_lab_tested_variant_divergence
        claim_type: variant_divergence
        grounds:
          - calculations.effective_concentration_ppm
          - calculations.daily_exposure_ug
        distinguishing_aspect: |
          the same stored rows must yield different exposures under the two method variants, because MODELED substitutes a worst-case default where LAB_TESTED reads measured data.
        excluded_because:
          difficulty_instance: dual_variant_calc / modeled_vs_lab_tested_diverge_on_incomplete_disclosure
          rationale: "Both variants are run over one identical fixture and the divergent daily_exposure_ug, margin_ratio and result values are asserted side by side there."

      - name: calc_non_detect_half_loq_versus_zero
        claim_type: variant_divergence
        grounds:
          - calculations.effective_concentration_ppm
        distinguishing_aspect: |
          a non-detect result is half the LOQ under MODELED and exactly zero under LAB_TESTED, so the two variants diverge on identical lab fields.
        excluded_because:
          difficulty_instance: dual_variant_calc / modeled_half_loq_vs_lab_tested_zero_on_non_detect
          rationale: "The lab_loq/2 substitution versus the hard 0.0 is the entire subject of that instance."

      - name: calc_defense_score_as_of_variant_selection
        claim_type: variant_selection
        grounds:
          - calculations.defense_strength_score.variants
          - endpoints[GET /products/{product_id}/compliance-summary]
        distinguishing_aspect: |
          the variant is selected by the presence of as_of_notice_id, and the service-date variant must score no higher than the as-of-today variant on the same rows.
        excluded_because:
          difficulty_instance: dual_variant_calc / defense_score_as_of_today_vs_as_of_service_date
          rationale: "Variant selection by presence of as_of_notice_id, and the strictly lower service-date score over identical stored rows, are asserted there."

      - name: calc_settlement_penalty_uses_declared_constants
        claim_type: constants_applied
        grounds:
          - calculations.settlement_money.constants
        distinguishing_aspect: |
          every money step uses the declared constants (per-day ceiling, per-unit rate, mitigation factors, fee-cap tiers) rather than re-derived approximations.
        excluded_because:
          difficulty_instance: combinatorial_formula / settlement_pinned_penalty_then_cap_then_fees
          rationale: "MAX_DAILY_PENALTY_CENTS, PER_UNIT_PENALTY_CENTS, the mitigation factors, the MIN_MITIGATION_FACTOR floor and the fee-cap tiers are all exercised as literals there."

      - name: calc_exposure_intermediate_rounding_order
        claim_type: precision
        grounds:
          - calculations.daily_exposure_ug.precision
        distinguishing_aspect: |
          per-component rounding happens before the sum, so a single round of the raw total produces a different third decimal.
        excluded_because:
          difficulty_instance: combinatorial_formula / exposure_rounding_order_pinned_per_component
          rationale: "The per-component round-then-sum order versus sum-then-round is pinned there with two literals that differ only by the rounding order."

      - name: calc_warning_type_branch_precedence
        claim_type: weighted_scoring
        grounds:
          - calculations.warning_content_selection
        distinguishing_aspect: |
          occupancy format outranks the food-website branch, which in turn outranks the short-form area rule, so the branches must be evaluated in the declared order.
        excluded_because:
          difficulty_instance: combinatorial_formula / warning_content_occupancy_precedence_over_food_and_short_form
          rationale: "OCCUPANCY beating both the FOOD website branch and the short-form area branch is asserted there over one fixture."

      - name: calc_safe_harbor_verdict_at_threshold
        claim_type: threshold
        grounds:
          - calculations.safe_harbor_verdict
        distinguishing_aspect: |
          the comparison is >= rather than >, so an exposure exactly at the safe harbor level is AT_OR_ABOVE_SAFE_HARBOR.
        excluded_because:
          difficulty_instance: boundary_precision_check / exposure_exactly_at_safe_harbor_is_at_or_above
          rationale: "The >= comparison at the exact safe harbor level, and the value one increment below it, are asserted there."

      - name: calc_total_listed_chemical_load_aggregation
        claim_type: aggregation
        grounds:
          - calculations.total_listed_chemical_load_ug
        distinguishing_aspect: |
          the aggregation filters on ACTIVE components and LISTED chemicals only, and pins per-term rounding before the sum.
        excluded_because:
          difficulty_instance: compensating_invariant / component_quantity_roundtrip_conserves_total_chemical_load
          rationale: "The aggregate is asserted before, during and after a quantity round-trip there, which subsumes a single-shot aggregation check."

  # ===========================================================================
  # SECTION 4 - validations
  # ===========================================================================
  - section: validations
    instances:

      - name: val_pagination_limit_above_maximum_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=4]
          - errors[ERR_INVALID_PAGINATION]
        distinguishing_aspect: |
          The declared bound is limit <= 200 inclusive, so limit 201 is a 400 ERR_INVALID_PAGINATION
          while limit 200 succeeds; offset -1 is rejected on the same rule but limit 1 / offset 0 is
          accepted, which pins the boundary on both ends rather than silently clamping.
        test_recipe:
          setup:
            - "One product exists so a successful page is non-empty."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: RegistryAdmin
            - call: "POST /products"
              payload: { sku: "SKU-PAG", product_name: "Pagination Probe", product_category: "CONSUMER_GOOD", distribution_channels: ["RETAIL"], label_area_sq_in: 10.0, annual_units: 1000 }
              as: RegistryAdmin
          trigger:
            - call: "GET /products"
              payload: { limit: 201, offset: 0 }
              as: RegistryAdmin
            - call: "GET /products"
              payload: { limit: 0, offset: 0 }
              as: RegistryAdmin
            - call: "GET /products"
              payload: { limit: 1, offset: -1 }
              as: RegistryAdmin
            - call: "GET /products"
              payload: { limit: 200, offset: 0 }
              as: RegistryAdmin
          assert:
            - "first three trigger calls: HTTP 400 with error_id ERR_INVALID_PAGINATION"
            - "fourth trigger call: HTTP 200 with 1 row, total_count == 1, limit == 200, has_more == false"

      - name: val_computed_field_supplied_in_body_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=43]
          - errors[ERR_FIELD_NOT_WRITABLE]
          - entities.Product.fields.compliance_posture
        distinguishing_aspect: |
          compliance_posture has source computed, so supplying it in a create body is a 400
          ERR_FIELD_NOT_WRITABLE - it is neither silently ignored nor honoured. The same body without
          that key succeeds and the posture is derived as EXPOSURE_UNKNOWN.
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: RegistryAdmin
          trigger:
            - call: "POST /products"
              payload: { sku: "SKU-CFW", product_name: "Computed Field Writer", product_category: "CONSUMER_GOOD", distribution_channels: ["RETAIL"], label_area_sq_in: 10.0, annual_units: 1000, compliance_posture: "CLEAR" }
              as: RegistryAdmin
            - call: "POST /products"
              payload: { sku: "SKU-CFW", product_name: "Computed Field Writer", product_category: "CONSUMER_GOOD", distribution_channels: ["RETAIL"], label_area_sq_in: 10.0, annual_units: 1000 }
              as: RegistryAdmin
              captures: { prod_1: $.data.id }
          assert:
            - "first trigger call: HTTP 400 with error_id ERR_FIELD_NOT_WRITABLE and no Product row created"
            - "second trigger call: HTTP 201 and Product.${prod_1}.compliance_posture == EXPOSURE_UNKNOWN (derived, not the CLEAR that was offered)"

      - name: val_cas_number_pattern_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=7]
          - errors[ERR_INVALID_CAS_NUMBER]
        distinguishing_aspect: |
          The pattern is ^[0-9]{2,7}-[0-9]{2}-[0-9]$: the middle group must be exactly two digits and
          the check digit exactly one, so "8005-7" (no middle group) and "80-5-7" (one-digit middle)
          are both 400 ERR_INVALID_CAS_NUMBER while "80-05-7" is accepted.
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: RegistryAdmin
          trigger:
            - call: "POST /listed-chemicals"
              payload: { chemical_name: "Bad CAS One", cas_number: "8005-7", endpoint_type: "REPRODUCTIVE_FEMALE", safe_harbor_basis: "MADL", safe_harbor_level_ug_per_day: 0.5 }
              as: RegistryAdmin
            - call: "POST /listed-chemicals"
              payload: { chemical_name: "Bad CAS Two", cas_number: "80-5-7", endpoint_type: "REPRODUCTIVE_FEMALE", safe_harbor_basis: "MADL", safe_harbor_level_ug_per_day: 0.5 }
              as: RegistryAdmin
            - call: "POST /listed-chemicals"
              payload: { chemical_name: "Bisphenol A", cas_number: "80-05-7", endpoint_type: "REPRODUCTIVE_FEMALE", safe_harbor_basis: "MADL", safe_harbor_level_ug_per_day: 0.5 }
              as: RegistryAdmin
              captures: { chem_bpa: $.data.id }
          assert:
            - "first two trigger calls: HTTP 400 with error_id ERR_INVALID_CAS_NUMBER"
            - "third trigger call: HTTP 201 and ListedChemical.${chem_bpa}.cas_number == 80-05-7"

      - name: val_safe_harbor_basis_and_level_must_agree
        claim_type: conditional_validation
        grounds:
          - validations[priority=8]
          - errors[ERR_SAFE_HARBOR_BASIS_MISMATCH]
        distinguishing_aspect: |
          The rule is bidirectional: NSRL or MADL with a null level fails, and basis NONE with a
          non-null level fails too. Only the two consistent shapes (finite basis with a level, NONE
          with no level) are accepted, which is what makes NO_SAFE_HARBOR a distinguishable
          assessment result later.
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: RegistryAdmin
          trigger:
            - call: "POST /listed-chemicals"
              payload: { chemical_name: "Missing Level", cas_number: "71-43-2", endpoint_type: "CANCER", safe_harbor_basis: "NSRL" }
              as: RegistryAdmin
            - call: "POST /listed-chemicals"
              payload: { chemical_name: "Spurious Level", cas_number: "7440-43-9", endpoint_type: "CANCER", safe_harbor_basis: "NONE", safe_harbor_level_ug_per_day: 0.05 }
              as: RegistryAdmin
            - call: "POST /listed-chemicals"
              payload: { chemical_name: "Cadmium", cas_number: "7440-43-9", endpoint_type: "CANCER", safe_harbor_basis: "NONE" }
              as: RegistryAdmin
              captures: { chem_cd: $.data.id }
          assert:
            - "first two trigger calls: HTTP 400 with error_id ERR_SAFE_HARBOR_BASIS_MISMATCH"
            - "third trigger call: HTTP 201 and ListedChemical.${chem_cd}.safe_harbor_basis == NONE with safe_harbor_level_ug_per_day null"

      - name: val_harm_class_and_basis_alignment_rejected
        claim_type: cross_entity_validation
        grounds:
          - validations[priority=9]
          - errors[ERR_SAFE_HARBOR_BASIS_MISMATCH]
          - entities.ListedChemical.fields.harm_class
        distinguishing_aspect: |
          A cancer endpoint may only carry an NSRL and a reproductive/developmental endpoint only a
          MADL, so CANCER + MADL and REPRODUCTIVE_MALE + NSRL are both rejected even though each
          basis/level pair is internally consistent under the priority-8 rule.
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: RegistryAdmin
          trigger:
            - call: "POST /listed-chemicals"
              payload: { chemical_name: "Cancer With MADL", cas_number: "71-43-2", endpoint_type: "CANCER", safe_harbor_basis: "MADL", safe_harbor_level_ug_per_day: 6.4 }
              as: RegistryAdmin
            - call: "POST /listed-chemicals"
              payload: { chemical_name: "Repro With NSRL", cas_number: "80-05-7", endpoint_type: "REPRODUCTIVE_MALE", safe_harbor_basis: "NSRL", safe_harbor_level_ug_per_day: 0.5 }
              as: RegistryAdmin
            - call: "POST /listed-chemicals"
              payload: { chemical_name: "Benzene", cas_number: "71-43-2", endpoint_type: "CANCER", safe_harbor_basis: "NSRL", safe_harbor_level_ug_per_day: 6.4 }
              as: RegistryAdmin
              captures: { chem_bz: $.data.id }
          assert:
            - "first two trigger calls: HTTP 400 with error_id ERR_SAFE_HARBOR_BASIS_MISMATCH"
            - "third trigger call: HTTP 201 and ListedChemical.${chem_bz}.harm_class == CANCER"

      - name: val_cas_format_reported_before_basis_alignment
        claim_type: priority_ordering
        grounds:
          - validations[priority=7]
          - validations[priority=9]
          - errors[ERR_INVALID_CAS_NUMBER]
        distinguishing_aspect: |
          One body violates the priority-7 CAS pattern and the priority-9 harm-class/basis alignment
          simultaneously. The response must be ERR_INVALID_CAS_NUMBER, not
          ERR_SAFE_HARBOR_BASIS_MISMATCH, and fixing only the CAS then surfaces the alignment error -
          which proves the ordering rather than a coincidence.
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: RegistryAdmin
          trigger:
            - call: "POST /listed-chemicals"
              payload: { chemical_name: "Double Fault", cas_number: "8005-7", endpoint_type: "CANCER", safe_harbor_basis: "MADL", safe_harbor_level_ug_per_day: 6.4 }
              as: RegistryAdmin
            - call: "POST /listed-chemicals"
              payload: { chemical_name: "Double Fault", cas_number: "80-05-7", endpoint_type: "CANCER", safe_harbor_basis: "MADL", safe_harbor_level_ug_per_day: 6.4 }
              as: RegistryAdmin
          assert:
            - "first trigger call: HTTP 400 with error_id ERR_INVALID_CAS_NUMBER (priority 7 wins over priority 9)"
            - "second trigger call: HTTP 400 with error_id ERR_SAFE_HARBOR_BASIS_MISMATCH (the lower-priority rule is reached only once the CAS is valid)"
            - "no ListedChemical row exists after either call"

      - name: val_supplier_warranty_interval_ordering_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=10]
          - errors[ERR_INVALID_INTERVAL]
        distinguishing_aspect: |
          The warranty window is a strict interval: warranty_effective_to equal to
          warranty_effective_from is rejected (not treated as a zero-length window), and one second
          later is accepted.
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: RegistryAdmin
          trigger:
            - call: "POST /suppliers"
              payload: { legal_name: "Zero Window Chemicals", contact_email: "zero@window.example", warranty_scope: "ALL_MATERIALS", warranty_effective_from: "2026-06-01T00:00:00Z", warranty_effective_to: "2026-06-01T00:00:00Z" }
              as: ComplianceAnalyst
            - call: "POST /suppliers"
              payload: { legal_name: "Backwards Chemicals", contact_email: "back@window.example", warranty_scope: "ALL_MATERIALS", warranty_effective_from: "2026-06-01T00:00:00Z", warranty_effective_to: "2026-05-31T23:59:59Z" }
              as: ComplianceAnalyst
            - call: "POST /suppliers"
              payload: { legal_name: "One Second Chemicals", contact_email: "one@window.example", warranty_scope: "ALL_MATERIALS", warranty_effective_from: "2026-06-01T00:00:00Z", warranty_effective_to: "2026-06-01T00:00:01Z" }
              as: ComplianceAnalyst
              captures: { sup_ok: $.data.id }
          assert:
            - "first two trigger calls: HTTP 400 with error_id ERR_INVALID_INTERVAL"
            - "third trigger call: HTTP 201 and Supplier.${sup_ok}.warranty_status == NONE (a window alone does not execute the warranty)"

      - name: val_empty_distribution_channels_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=12]
          - errors[ERR_INVALID_REQUEST]
          - entities.Product.fields.distribution_channels
        distinguishing_aspect: |
          An empty distribution_channels array is type-valid JSON and therefore survives the
          priority-3 shape check, but the priority-12 rule still rejects it - a product with no
          channel could never have a required warning channel and would silently defeat placement
          coverage.
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: RegistryAdmin
          trigger:
            - call: "POST /products"
              payload: { sku: "SKU-NOCH", product_name: "No Channels", product_category: "CONSUMER_GOOD", distribution_channels: [], label_area_sq_in: 10.0, annual_units: 1000 }
              as: RegistryAdmin
            - call: "POST /products"
              payload: { sku: "SKU-NOCH", product_name: "No Channels", product_category: "CONSUMER_GOOD", distribution_channels: ["WHOLESALE"], label_area_sq_in: 10.0, annual_units: 1000 }
              as: RegistryAdmin
            - call: "POST /products"
              payload: { sku: "SKU-NOCH", product_name: "No Channels", product_category: "CONSUMER_GOOD", distribution_channels: ["RETAIL", "INTERNET"], label_area_sq_in: 10.0, annual_units: 1000 }
              as: RegistryAdmin
              captures: { prod_1: $.data.id }
          assert:
            - "first two trigger calls: HTTP 400 with error_id ERR_INVALID_REQUEST"
            - "third trigger call: HTTP 201 and Product.${prod_1}.distribution_channels == [\"RETAIL\", \"INTERNET\"]"

      - name: val_assessment_submit_requires_active_component
        claim_type: cross_entity_validation
        grounds:
          - validations[priority=50]
          - errors[ERR_NO_ACTIVE_COMPONENTS]
        distinguishing_aspect: |
          Validity depends on a different entity: an assessment may be created on a component-less
          product (so the analyst can stage work) but SUBMIT is refused with
          ERR_NO_ACTIVE_COMPONENTS until at least one ACTIVE ProductComponent exists. Adding a
          component makes the identical SUBMIT succeed, and a component that has been REMOVEd
          re-arms the same refusal.
        test_recipe:
          setup:
            - "Bisphenol A is LISTED with MADL 0.5 ug/day."
            - "Product SKU-NOCOMP exists with no components; material RM-100 (VERIFIED disclosure, 60.0 ppm) is available."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: RegistryAdmin
            - call: "POST /listed-chemicals"
              payload: { chemical_name: "Bisphenol A", cas_number: "80-05-7", endpoint_type: "REPRODUCTIVE_FEMALE", safe_harbor_basis: "MADL", safe_harbor_level_ug_per_day: 0.5 }
              as: RegistryAdmin
              captures: { chem_bpa: $.data.id }
            - call: "POST /listed-chemicals/${chem_bpa}/transitions"
              payload: { action: "LIST", listing_effective_date: "2026-01-01T00:00:00Z" }
              as: RegistryAdmin
            - call: "POST /suppliers"
              payload: { legal_name: "Northgate Polymers", contact_email: "qa@northgate.example" }
              as: ComplianceAnalyst
              captures: { sup_1: $.data.id }
            - call: "POST /materials"
              payload: { material_code: "RM-100", material_class: "RAW_MATERIAL", supplier_id: "${sup_1}" }
              as: ComplianceAnalyst
              captures: { mat_1: $.data.id }
            - call: "POST /materials/${mat_1}/chemicals"
              payload: { chemical_id: "${chem_bpa}", declared_concentration_ppm: 60.0 }
              as: ComplianceAnalyst
            - call: "POST /materials/${mat_1}/disclosure"
              payload: { action: "REQUEST" }
              as: ComplianceAnalyst
            - call: "POST /materials/${mat_1}/disclosure"
              payload: { action: "RECORD_RESPONSE", response_completeness: "COMPLETE" }
              as: ComplianceAnalyst
