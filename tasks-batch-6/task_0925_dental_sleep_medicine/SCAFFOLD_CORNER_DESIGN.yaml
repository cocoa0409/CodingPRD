          - state_machines.SleepStudy.NON_DIAGNOSTIC_to_ORDERED
          - calculations.study_diagnostic_validity
          - entities.SleepStudy.fields.repeat_count
        distinguishing_aspect: |
          239 recorded minutes is one minute short of MIN_HSAT_RECORDING_MINUTES, so the study is
          NON_DIAGNOSTIC; reorder returns the SAME row to ORDERED, increments repeat_count and clears
          every recording field, and 240 minutes on the retry is diagnostic — the A to B to A loop.
        test_recipe:
          setup:
            - "One patient with a single ORDERED HSAT DIAGNOSTIC study."
            - "Logical clock at 2026-05-01."
          setup_api_calls:
            - call: "POST /payers"
