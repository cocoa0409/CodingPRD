  - name: ComplianceOfficer
    identity: opaque
    description: >
      Owns the compliance management system extended over the partner. Decides diligence
      files (PASSED / FAILED / INFO_REQUESTED), approves or rejects marketing material and the disclosures inside it,
      raises transaction monitoring alerts and disposes them including SAR filing, and assigns root causes to
      aggregated complaints and dispositions them. It cannot create the diligence files or marketing filings it
      decides, cannot move money or touch the ledger, and cannot decide program agreements or wind-down plans (that
      authority sits with RiskCommittee).
    exclusive_operations:
      - "POST /oversight/diligence-reviews/{id}/decide"
      - "POST /oversight/marketing-reviews/{id}/decide"
