  - rule_id: non_linear_state_machine
    instances:
      - name: challenge_fourth_info_request_rejected_after_three_rounds
        grounds:
          - state_machines.DataChallenge.UNDER_REVIEW_to_INFO_REQUESTED
          - state_machines.DataChallenge.INFO_REQUESTED_to_SUBMITTED
          - state_machines.DataChallenge.SUBMITTED_to_UNDER_REVIEW
          - validations[priority=26]
          - entities.DataChallenge.fields.info_request_count
        distinguishing_aspect: |
          The UNDER_REVIEW -> INFO_REQUESTED -> SUBMITTED -> UNDER_REVIEW cycle is bounded, not free:
          the loop counter info_request_count reaches 3 after three round trips and the fourth
          REQUEST_INFO is rejected with ERR_CHALLENGE_ROUND_LIMIT_EXCEEDED while the challenge stays
          UNDER_REVIEW, and the three resubmissions consume no additional quota (challenge_quota_used
          stays 1).
