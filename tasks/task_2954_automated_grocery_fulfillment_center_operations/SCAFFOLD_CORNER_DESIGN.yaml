            - "GET /substitution-proposals?order_line_id=${line_1} returns total_count == 2"
            - "OrderLine.${line_1}.line_status == SHORT and substitution_resolution == PENDING"
            - "CustomerOrder.${order_id}.open_substitution_count == 2 (DRAFT ${p2} plus DRAFT ${p3}; DECLINED ${p1} does not count)"
