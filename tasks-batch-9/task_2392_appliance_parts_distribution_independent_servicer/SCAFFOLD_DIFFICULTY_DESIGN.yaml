      - name: overnight_freight_composes_four_buckets_mode_a
        grounds:
          - calculations.freight_assessment
          - calculations.order_totals
          - entities.PartOrder.fields.freight_cents
          - entities.Branch.fields.overnight_surcharge_cents
          - state_machines.PartOrder.DRAFT_to_ALLOCATED
