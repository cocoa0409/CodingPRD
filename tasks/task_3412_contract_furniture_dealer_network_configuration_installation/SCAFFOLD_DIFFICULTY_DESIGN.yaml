            - { call: "POST /end-users", payload: { name: "MegaCorp", industry: "technology" }, as: ManufacturerAdmin, captures: { eu_id: "$.data.id" } }
            - { call: "POST /volume-agreements", payload: { end_user_id: "${eu_id}", effective_start: "2026-01-01", effective_end: "2027-12-31", tier1_discount_pct: 0.10, tier2_discount_pct: 0.15, tier3_discount_pct: 0.20 }, as: ManufacturerAdmin, captures: { agr_id: "$.data.id" } }
            - { call: "POST /volume-agreements/${agr_id}/activate", as: ManufacturerAdmin }
            - { call: "POST /configurations", payload: { name: "Chairs", modules: [{ module_type: "TASK_CHAIR_SET", fabric_grade: "A", qty: 4 }] }, as: DealerRep, as_user_id: "${dlr_id}", captures: { cfg_id: "$.data.id" , cfg_v: "$.data.version" } }
            - { call: "POST /configurations/${cfg_id}/lock", payload: { expected_configuration_version: "${cfg_v}" }, as: DealerRep, as_user_id: "${dlr_id}" }
            - { call: "POST /project-orders", payload: { volume_agreement_id: "${agr_id}", configuration_id: "${cfg_id}", territory_code: "MI", requested_install_date: "2026-12-15" }, as: DealerRep, as_user_id: "${dlr_id}", captures: { oA: "$.data.id", oAv: "$.data.version" } }
            - { call: "POST /project-orders/${oA}/submit", payload: { expected_order_version: "${oAv}" }, as: DealerRep, as_user_id: "${dlr_id}" }
            - { call: "POST /project-orders/${oA}/acknowledge", as: ManufacturerAdmin }
            - { call: "POST /project-orders/${oA}/phases", payload: { floor_number: 1, phase_sequence: 1, building_zone_id: "Z1", planned_units: 120 }, as: DealerRep, as_user_id: "${dlr_id}", captures: { phA: "$.data.id" } }
            - { call: "POST /phases/${phA}/reserve-slot", payload: { plant_code: "PLANT_GR", production_date: "2026-11-02" }, as: DealerRep, as_user_id: "${dlr_id}" }
            - { call: "POST /project-orders", payload: { volume_agreement_id: "${agr_id}", configuration_id: "${cfg_id}", territory_code: "MI", requested_install_date: "2026-12-15" }, as: DealerRep, as_user_id: "${dlr_id}", captures: { oB: "$.data.id", oBv: "$.data.version" } }
            - { call: "POST /project-orders/${oB}/submit", payload: { expected_order_version: "${oBv}" }, as: DealerRep, as_user_id: "${dlr_id}" }
            - { call: "POST /project-orders/${oB}/acknowledge", as: ManufacturerAdmin }
            - { call: "POST /project-orders/${oB}/phases", payload: { floor_number: 1, phase_sequence: 1, building_zone_id: "Z1", planned_units: 1 }, as: DealerRep, as_user_id: "${dlr_id}", captures: { phB: "$.data.id" } }
          trigger:
            - { call: "POST /phases/${phB}/reserve-slot", payload: { plant_code: "PLANT_GR", production_date: "2026-11-02" }, as: DealerRep, as_user_id: "${dlr_id}", captures: { err_full: "$.data.error_id" } }
            - { call: "POST /project-orders/${oA}/cancel", payload: { reason: "project shelved" }, as: ManufacturerAdmin }
            - { call: "POST /phases/${phB}/reserve-slot", payload: { plant_code: "PLANT_GR", production_date: "2026-11-02" }, as: DealerRep, as_user_id: "${dlr_id}", captures: { phB_log: "$.data.logistics_status" } }
          assert:
            - "first B reserve fails ERR_PLANT_CAPACITY_EXCEEDED (reserved 120 + requested 1 > 120)"
            - "after A cancel: B reserve succeeds (logistics_status == SCHEDULED) — released units exactly restore available to 120, no drift"
