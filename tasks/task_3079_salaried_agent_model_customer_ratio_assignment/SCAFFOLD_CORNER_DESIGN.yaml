            - "the listing agent's attempt returns 200 with status == ACTIVE"
            - "GET /listing-agreements/${agreement_id} reports posted_at non-null"

  # ===========================================================================
  - section: cross_cutting_layers
    instances:

      - name: assignment_selector_ranks_by_load_then_creation_order_within_geography
        claim_type: selector_policy
        grounds:
          - complexity_profile.complexity_layers
          - entities.Client.fields.assigned_agent_id
          - entities.LeadCapacity.fields.current_state
        distinguishing_aspect: "The selector's candidate set is every agent in the client's region with an OPEN capacity posture, ranked by ascending OpenClientCount.active_client_count and tie-broken by created_at ascending; with both agents at zero load the earlier-created agent wins, and that ordering is observable in the assignment."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. One region with target_client_ratio 5.0 and two lead agents created in order; one unassigned client."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /regions"
              payload: { name: "Puget Sound", service_area_codes: ["98101", "98102"], traditional_commission_pct: 0.025, target_client_ratio: 5.0 }
              as: PlatformAdmin
              captures: { region_id: $.data.id }
            - call: "POST /agents"
              payload: { region_id: "${region_id}", full_name: "Ada Lead", agent_kind: "LEAD", home_zip: "98101", base_salary_cents: 8000000 }
              as: PlatformAdmin
              captures: { agent_first: $.data.id }
            - call: "POST /agents"
              payload: { region_id: "${region_id}", full_name: "Ben Lead", agent_kind: "LEAD", home_zip: "98102", base_salary_cents: 7000000 }
              as: PlatformAdmin
              captures: { agent_second: $.data.id }
            - call: "POST /clients"
              payload: { full_name: "First Buyer", email: "first@x.com", service_area_code: "98101", need_kind: "BUY" }
              as: OperationsCoordinator
              captures: { client_1: $.data.id }
            - call: "POST /clients"
              payload: { full_name: "Second Buyer", email: "second@x.com", service_area_code: "98102", need_kind: "BUY" }
              as: OperationsCoordinator
              captures: { client_2: $.data.id }
            - call: "POST /clients"
              payload: { full_name: "Third Buyer", email: "third@x.com", service_area_code: "98101", need_kind: "BUY" }
              as: OperationsCoordinator
              captures: { client_3: $.data.id }
          trigger:
            - call: "POST /clients/${client_1}/assign-agent"
              payload: {}
              as: OperationsCoordinator
            - call: "POST /clients/${client_2}/assign-agent"
              payload: {}
              as: OperationsCoordinator
            - call: "POST /clients/${client_3}/assign-agent"
              payload: {}
              as: OperationsCoordinator
          assert:
            - "the first assignment lands on ${agent_first} — both agents sat at zero load, so the created_at ascending tie-break decided it"
            - "the second assignment lands on ${agent_second}, whose load was 0 against ${agent_first}'s 1 — the load ranking beat creation order"
            - "the third assignment lands on ${agent_first}: the loads were tied at 1 each, so created_at ascending decided again"
            - "GET /agents/${agent_first}/open-client-counts returns active_client_count == 2 and ratio_state == UNDER_TARGET"
            - "GET /agents/${agent_second}/open-client-counts returns active_client_count == 1 and ratio_state == UNDER_TARGET"
            - "every assigned_agent_id is in ${agent_first} or ${agent_second} — no third agent exists"

      - name: cascading_side_effects_are_asserted_by_the_two_difficulty_cascades
        claim_type: cascading_side_effects
        grounds:
          - complexity_profile.complexity_layers
          - state_machines.Client.transitions.IN_TRANSACTION_to_CLOSED
        excluded_because:
          difficulty_instance: client_closure_cascade_unwinds_agent_capacity_three_hops
          rationale: "Both required cascade chains are asserted end-to-end by that instance and by tour_completion_cascade_reaches_capacity_posture_five_hops."

      - name: rate_threshold_triggers_are_asserted_by_the_occupancy_band_instance
        claim_type: rate_threshold_triggers
        grounds:
          - complexity_profile.complexity_layers
          - calculations.region_occupancy
        excluded_because:
          difficulty_instance: occupancy_ratio_band_edge_is_inclusive_at_one_point_two_five
          rationale: "Behaviour changing at the 0.75 and 1.00 edges, and the inverted behaviour inside the 1.00 to 1.25 veto band, is asserted there."

      - name: derived_field_reconciliation_is_asserted_by_the_capacity_instances
        claim_type: derived_field_reconciliation
        grounds:
          - complexity_profile.complexity_layers
          - entities.LeadCapacity.fields.current_state
        excluded_because:
          difficulty_instance: lead_capacity_compound_posture_derived_from_open_client_count_children
          rationale: "Denormalised fields staying consistent with their source rows is asserted by that instance and by close_rate_excludes_cancelled_transactions_from_the_denominator."

