      - name: break_even_waiver_flow
        claim_type: violation_to_error
        grounds:
          - "validations[priority=37]"
          - "errors[ERR_BREAK_EVEN_WAIVER_REQUIRED]"
          - "calculations.break_even_review"
        distinguishing_aspect: "A line projecting 5 billable hours yields DEFICIT (62500 < 120000 overhead); approval without a waiver fails, and after reject + waiver edit + resubmit the same numbers approve to WAIVED."
        test_recipe:
          setup: ["instrument i1; FY2027 OPEN; DRAFT rs27 with projected_billable_hours 5 and no waiver"]
          setup_api_calls:
            - { call: "POST /instruments", payload: { name: "NMR-600", model: "Bruker AV600", location: "Lab 1", requires_training: true, booking_buffer_minutes: 30, min_booking_minutes: 30, max_booking_minutes: 480, cancellation_free_notice_hours: 24, late_cancel_penalty_pct: 0.5, no_show_penalty_pct: 1.0 }, as: FacilityAdmin, as_user_id: "admin-1", captures: { i1: $.data.id } }
            - { call: "POST /fiscal-years", payload: { fiscal_year: 2027 }, as: FinanceOfficer, as_user_id: "fin-1" }
            - { call: "POST /rate-sets", payload: { fiscal_year: 2027, effective_from: "2027-01-01T00:00:00Z", lines: [ { instrument_id: "${i1}", internal_rate_cents_per_hour: 12500, external_rate_cents_per_hour: 19000, billing_increment_minutes: 15, min_charge_minutes: 30, projected_billable_hours: 5, break_even_waiver_reason: null } ] }, as: FacilityAdmin, as_user_id: "admin-1", captures: { rs27: $.data.id } }
            - { call: "POST /rate-sets/${rs27}/submit", payload: {}, as: FacilityAdmin, as_user_id: "admin-1" }
          trigger:
            - { call: "POST /rate-sets/${rs27}/approve", payload: {}, as: FinanceOfficer, as_user_id: "fin-1", captures: { err: $.data.error_id } }
            - { call: "POST /rate-sets/${rs27}/reject", payload: { reason: "needs waiver" }, as: FinanceOfficer, as_user_id: "fin-1", captures: { rsv: $.data.version } }
            - { call: "PUT /rate-sets/${rs27}", payload: { expected_rate_set_version: "${rsv}", lines: [ { instrument_id: "${i1}", internal_rate_cents_per_hour: 12500, external_rate_cents_per_hour: 19000, billing_increment_minutes: 15, min_charge_minutes: 30, projected_billable_hours: 5, break_even_waiver_reason: "strategic instrument, deficit accepted" } ] }, as: FacilityAdmin, as_user_id: "admin-1" }
            - { call: "POST /rate-sets/${rs27}/submit", payload: {}, as: FacilityAdmin, as_user_id: "admin-1" }
            - { call: "POST /rate-sets/${rs27}/approve", payload: {}, as: FinanceOfficer, as_user_id: "fin-1", captures: { st: $.data.status } }
          assert:
            - "First approve: error_id == ERR_BREAK_EVEN_WAIVER_REQUIRED (DEFICIT line 12500 x 5 = 62500 < 120000, no waiver)"
            - "After reject -> waiver edit -> resubmit: approve succeeds, status == APPROVED, line verdict WAIVED"

