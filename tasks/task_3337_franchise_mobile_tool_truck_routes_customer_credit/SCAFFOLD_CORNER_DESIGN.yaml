            - { call: "POST /retail/franchisees", payload: { legal_name: "Second Franchisee LLC" }, as: PlatformAdmin, captures: { f2_id: "$.data.id" } }
            - { call: "POST /retail/franchisees/${f1_id}/routes", payload: { route_code: R1, route_tier: A, zip_codes: [75001], visit_weekday: 1, truck_label: T-01, inventory_invested_cents: 100000, mix_plan: DIAGNOSTIC_WEIGHTED, territory_model: FRANCHISEE_ASSUMED }, as: FranchiseOwner, as_user_id: "${f1_id}", captures: { r1_id: "$.data.id" } }
          trigger:
            - { call: "POST /retail/franchisees/${f2_id}/routes", payload: { route_code: R1, route_tier: B, zip_codes: [75002], visit_weekday: 2, truck_label: T-02, inventory_invested_cents: 50000, mix_plan: TOOL_STORAGE, territory_model: FRANCHISEE_ASSUMED }, as: FranchiseOwner, as_user_id: "${f2_id}", captures: { dup_error: "$.data.error_id" } }
