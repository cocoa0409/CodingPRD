  - rule_id: cross_entity_state_dependency
    instances:
      - name: release_promotion_requires_deal_executed
        grounds:
          - state_machines.Release.PLANNED_to_RELEASED
          - state_machines.DistributionDeal.DRAFT_to_EXECUTED
          - errors[ERR_INVALID_DEAL_STATE]
          - endpoints[POST /releases/{id}/release]
        distinguishing_aspect: |
          Entity pair = Release depends on DistributionDeal. The release itself is in a perfectly legal
          from-state (PLANNED) and the payload is valid; only the PARENT deal's DRAFT status blocks the
          transition, and executing the deal makes the very same request succeed.
        test_recipe:
          setup:
            - "one DistributionDeal left in status DRAFT"
            - "one Release on it in status PLANNED"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: LabelAdmin
              as_user_id: "label-admin-01"
            - call: "POST /distributors"
              payload: { name: "Vector Digital", legal_entity: "Vector Digital LLC", default_returns_reserve_pct: 0.1000 }
              as: LabelAdmin
              as_user_id: "label-admin-01"
              captures: { dist_id: $.data.id }
            - call: "POST /artists"
              payload: { legal_name: "Nadia Frost", email: "nadia@example.com" }
              as: LabelAdmin
              as_user_id: "label-admin-01"
              captures: { artist_id: $.data.id }
            - call: "POST /distribution-deals"
              payload: { distributor_id: "${dist_id}", deal_type: "DISTRIBUTION_FEE", distribution_fee_pct: 0.1500, term_start_date: "2026-01-01", term_end_date: "2026-12-31", territory_codes: ["US"], cross_collateralized: true, advance_amount_cents: 0, marketing_budget_cents: 500000, objection_window_days: 30, post_term_collection_days: 90 }
              as: LabelAdmin
              as_user_id: "label-admin-01"
              captures: { deal_id: $.data.id }
            - call: "POST /releases"
              payload: { deal_id: "${deal_id}", primary_artist_id: "${artist_id}", upc: "012345679063", title: "Unsigned Yet", planned_release_date: "2026-02-01", formats: ["DIGITAL"], advance_share_cents: 0 }
              as: LabelAdmin
              as_user_id: "label-admin-01"
              captures: { rel1_id: $.data.id }
          trigger:
            - call: "POST /releases/${rel1_id}/release"
              payload: { actual_release_date: "2026-02-01" }
              as: LabelAdmin
              as_user_id: "label-admin-01"
            - call: "POST /distribution-deals/${deal_id}/execute"
              payload: { advance_payment_reference: "WIRE-2026-0016" }
              as: LabelAdmin
              as_user_id: "label-admin-01"
            - call: "POST /releases/${rel1_id}/release"
              payload: { actual_release_date: "2026-02-01" }
              as: LabelAdmin
              as_user_id: "label-admin-01"
          assert:
            - "the first release attempt returns 409 with error.code == ERR_INVALID_DEAL_STATE, not ERR_INVALID_RELEASE_STATE — the release's own status was valid"
            - "after the failed attempt Release.${rel1_id}.status is still PLANNED and actual_release_date is null"
            - "the execute call succeeds because the deal has at least one PLANNED release: DistributionDeal.${deal_id}.status == EXECUTED"
            - "the identical second release attempt now returns 200 with Release.${rel1_id}.status == RELEASED and actual_release_date == 2026-02-01"

      - name: statement_creation_requires_statementable_agreement
        grounds:
          - state_machines.ArtistAgreement.ACTIVE_to_SUPERSEDED
          - validations[priority 8 state ERR_AGREEMENT_NOT_STATEMENTABLE]
          - entities.ArtistAgreement.fields.supersedes_agreement_id
          - endpoints[POST /artist-statements]
        distinguishing_aspect: |
          Entity pair = ArtistStatement depends on ArtistAgreement — a different pair from
          Release/DistributionDeal. The blocking state is reached indirectly: activating a SUCCESSOR
          agreement pushes the predecessor to SUPERSEDED, after which the predecessor can no longer be
          accounted, while the successor (which inherited the carried-forward balances) can.
        test_recipe:
          setup:
            - "one EXECUTED DISTRIBUTION_FEE deal and one RELEASED release"
            - "agreement A: ACTIVE with advance_amount_cents 30000 and recording_costs_cents 20000 at recording_recoupable_pct 0.5000"
            - "agreement B: created with supersedes_agreement_id == A and then activated, pushing A to SUPERSEDED"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
