scaffold_corner_design:
  - section: entities
    instances:
      - name: brand_create_success_and_get_roundtrip
        claim_type: creation
        grounds: ["endpoints:POST /franchise/brands", "entities.Brand"]
        distinguishing_aspect: "POST with required fields returns 201 and all stored fields readable via GET."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "POST /franchise/brands"
              payload: { brand_code: "BC", display_name: "Corner Brand" }
              as: FranchisorOps
              captures: { bc_id: $.data.id }
            - call: "GET /franchise/brands/${bc_id}"
              as: FranchisorOps
              captures: { bc_status: $.data.status }
          assert:
            - "Brand.${bc_id}.brand_code == 'BC'"
            - "Brand.${bc_id}.status == ACTIVE (default applied)"
            - "Brand.${bc_id}.version == 1"
      - name: brand_get_not_found_returns_404
        claim_type: not_found
        grounds: ["endpoints:GET /franchise/brands/{id}", "errors:ERR_NOT_FOUND"]
        distinguishing_aspect: "Random UUID lookup returns ERR_NOT_FOUND with 404."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "GET /franchise/brands/00000000-0000-0000-0000-000000000000"
              as: FranchisorOps
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_NOT_FOUND"
      - name: agent_count_report_immutable_no_version_field
        claim_type: immutability
        grounds: ["entities.AgentCountReport"]
        distinguishing_aspect: "common_fields:false entity carries id/created_at only; no version and no update endpoint exists."
        test_recipe:
          setup:
            - "Agreement AC ACTIVE (minimal single-milestone plan completed)"
          setup_api_calls:
            - call: "POST /franchise/brands"
              payload: { brand_code: "AC", display_name: "Brand AC" }
              as: FranchisorOps
              captures: { brAC: $.data.id }
            - call: "POST /franchise/markets"
              payload: { market_code: "MAC", name: "Market AC" }
              as: FranchisorOps
              captures: { mkAC: $.data.id }
            - call: "POST /franchise/brokerages"
              payload: { legal_name: "BRA", home_market_id: "${mkAC}", principal_email: "ac@x.example" }
              as: FranchisorOps
              captures: { bkAC: $.data.id }
            - call: "POST /franchise/agreements"
              payload: { brokerage_id: "${bkAC}", brand_id: "${brAC}", market_id: "${mkAC}", term_start: "2027-01-01T00:00:00Z", term_end: "2031-12-31T00:00:00Z", base_royalty_rate_bps: 600, annual_royalty_cap_cents: 900000000, volume_incentive_threshold_cents: 1000000000, volume_incentive_rate_bps: 300, ad_fund_rate_bps: 200 }
              as: FranchisorOps
              captures: { agAC: $.data.id, agAC_v: $.data.version }
            - call: "POST /franchise/agreements/${agAC}/conversion-plans"
              payload: { milestones: [ { name: "m", target_date: "2027-01-01T00:00:00Z", sequence: 1 } ] }
              as: FranchisorOps
              captures: { cpAC: $.data.id }
            - call: "POST /franchise/conversion-plans/${cpAC}/milestones/complete"
              payload: { sequence: 1 }
              as: FranchisorOps
            - call: "POST /franchise/agreements/${agAC}/activate"
              payload: { expected_agreement_version: "${agAC_v}" }
              as: FranchisorOps
          trigger:
            - call: "POST /franchise/agreements/${agAC}/agent-count-reports"
              payload: { period_month: "2027-01", active_agent_count: 7 }
              as: FranchiseeAdmin
              as_user_id: "${bkAC}"
              captures: { acr: $.data.id }
            - call: "GET /franchise/agreements/${agAC}/agent-count-reports"
              as: FranchiseeAdmin
              as_user_id: "${bkAC}"
              captures: { acr0: "$.data[0].id" }
          assert:
            - "AgentCountReport.${acr} has id and created_at but no version or updated_at field"
      - name: agreement_missing_required_field_returns_invalid_request
        claim_type: required_fields
        grounds: ["validations:priority=7", "errors:ERR_INVALID_REQUEST"]
        distinguishing_aspect: "Omitting required base_royalty_rate_bps from agreement create fails with ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["brand, market, brokerage exist"]
          setup_api_calls:
            - call: "POST /franchise/brands"
              payload: { brand_code: "AD", display_name: "Brand AD" }
              as: FranchisorOps
              captures: { brAD: $.data.id }
            - call: "POST /franchise/markets"
              payload: { market_code: "MAD", name: "Market AD" }
              as: FranchisorOps
              captures: { mkAD: $.data.id }
            - call: "POST /franchise/brokerages"
              payload: { legal_name: "BRB", home_market_id: "${mkAD}", principal_email: "ad@x.example" }
              as: FranchisorOps
              captures: { bkAD: $.data.id }
          trigger:
            - call: "POST /franchise/agreements"
              payload: { brokerage_id: "${bkAD}", brand_id: "${brAD}", market_id: "${mkAD}", term_start: "2027-01-01T00:00:00Z", term_end: "2031-12-31T00:00:00Z", annual_royalty_cap_cents: 900000000, volume_incentive_threshold_cents: 1000000000, volume_incentive_rate_bps: 300, ad_fund_rate_bps: 200 }
              as: FranchisorOps
              captures: { errAD: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_REQUEST (400)"
  - section: state_machines
    instances:
      - name: terminated_agreement_rejects_gci_report
        claim_type: invalid_transition
        grounds: ["state_machines.FranchiseAgreement", "validations:priority=24"]
        distinguishing_aspect: "GCI report on a DEIDENTIFYING agreement is rejected with ERR_AGREEMENT_NOT_LIVE."
        test_recipe:
          setup:
            - "Agreement SM1 terminated (DEIDENTIFYING) after escalated default"
          setup_api_calls:
            - call: "POST /franchise/brands"
              payload: { brand_code: "SM", display_name: "Brand SM" }
              as: FranchisorOps
              captures: { brSM: $.data.id }
            - call: "POST /franchise/markets"
              payload: { market_code: "MSM", name: "Market SM" }
              as: FranchisorOps
              captures: { mkSM: $.data.id }
            - call: "POST /franchise/brokerages"
              payload: { legal_name: "BRC", home_market_id: "${mkSM}", principal_email: "sm@x.example" }
              as: FranchisorOps
              captures: { bkSM: $.data.id }
            - call: "POST /franchise/agreements"
              payload: { brokerage_id: "${bkSM}", brand_id: "${brSM}", market_id: "${mkSM}", term_start: "2027-01-01T00:00:00Z", term_end: "2031-12-31T00:00:00Z", base_royalty_rate_bps: 600, annual_royalty_cap_cents: 900000000, volume_incentive_threshold_cents: 1000000000, volume_incentive_rate_bps: 300, ad_fund_rate_bps: 200 }
              as: FranchisorOps
              captures: { agSM: $.data.id, agSM_v: $.data.version }
            - call: "POST /franchise/agreements/${agSM}/conversion-plans"
              payload: { milestones: [ { name: "m", target_date: "2027-01-01T00:00:00Z", sequence: 1 } ] }
              as: FranchisorOps
              captures: { cpSM: $.data.id }
            - call: "POST /franchise/conversion-plans/${cpSM}/milestones/complete"
              payload: { sequence: 1 }
              as: FranchisorOps
            - call: "POST /franchise/agreements/${agSM}/activate"
              payload: { expected_agreement_version: "${agSM_v}" }
              as: FranchisorOps
            - call: "POST /franchise/agreements/${agSM}/default-cases"
              payload: { reason_code: "PAYMENT" }
              as: FranchisorOps
              captures: { dSM: $.data.id }
            - call: "POST /franchise/default-cases/${dSM}/escalate"
              payload: {}
              as: FranchisorOps
            - call: "POST /franchise/agreements/${agSM}/terminate"
              payload: {}
              as: FranchisorOps
          trigger:
            - call: "POST /franchise/agreements/${agSM}/gci-reports"
              payload: { period_month: "2027-02", gci_cents: 100 }
              as: FranchisorOps
              captures: { errSM: $.data.error_id }
          assert:
            - "error_id == ERR_AGREEMENT_NOT_LIVE (409)"
      - name: terminal_proposal_rejected_locks_further_votes
        claim_type: terminal_state_lockdown
        grounds: ["state_machines.AdFundSpendProposal"]
        distinguishing_aspect: "Voting on an already-REJECTED proposal returns ERR_INVALID_STATE."
        test_recipe:
          setup:
            - "Brand SP; three eligible brokerages with agreements; council 3 seats; proposal SUBMITTED then two REJECT votes drive it to REJECTED"
          setup_api_calls:
            - call: "POST /franchise/brands"
              payload: { brand_code: "SP", display_name: "Brand SP" }
              as: FranchisorOps
              captures: { brSP: $.data.id }
            - call: "POST /franchise/markets"
              payload: { market_code: "MSP", name: "Market SP" }
              as: FranchisorOps
              captures: { mkSP: $.data.id }
            - call: "POST /franchise/brokerages"
              payload: { legal_name: "BSP1", home_market_id: "${mkSP}", principal_email: "sp1@x.example" }
              as: FranchisorOps
              captures: { bkSP1: $.data.id }
            - call: "POST /franchise/brokerages"
              payload: { legal_name: "BSP2", home_market_id: "${mkSP}", principal_email: "sp2@x.example" }
              as: FranchisorOps
              captures: { bkSP2: $.data.id }
            - call: "POST /franchise/brokerages"
              payload: { legal_name: "BSP3", home_market_id: "${mkSP}", principal_email: "sp3@x.example" }
              as: FranchisorOps
              captures: { bkSP3: $.data.id }
            - call: "POST /franchise/agreements"
              payload: { brokerage_id: "${bkSP1}", brand_id: "${brSP}", market_id: "${mkSP}", term_start: "2027-01-01T00:00:00Z", term_end: "2031-12-31T00:00:00Z", base_royalty_rate_bps: 600, annual_royalty_cap_cents: 900000000, volume_incentive_threshold_cents: 1000000000, volume_incentive_rate_bps: 300, ad_fund_rate_bps: 200 }
              as: FranchisorOps
              captures: { agSP1: $.data.id, agSP1_v: $.data.version }
            - call: "POST /franchise/agreements/${agSP1}/conversion-plans"
              payload: { milestones: [ { name: "m", target_date: "2027-01-01T00:00:00Z", sequence: 1 } ] }
              as: FranchisorOps
              captures: { cpSP1: $.data.id }
            - call: "POST /franchise/conversion-plans/${cpSP1}/milestones/complete"
              payload: { sequence: 1 }
              as: FranchisorOps
            - call: "POST /franchise/agreements/${agSP1}/activate"
              payload: { expected_agreement_version: "${agSP1_v}" }
              as: FranchisorOps
            - call: "POST /franchise/markets"
              payload: { market_code: "MSP2", name: "Market SP2" }
              as: FranchisorOps
              captures: { mkSP2: $.data.id }
            - call: "POST /franchise/markets"
              payload: { market_code: "MSP3", name: "Market SP3" }
              as: FranchisorOps
              captures: { mkSP3: $.data.id }
            - call: "POST /franchise/agreements"
              payload: { brokerage_id: "${bkSP2}", brand_id: "${brSP}", market_id: "${mkSP2}", term_start: "2027-01-01T00:00:00Z", term_end: "2031-12-31T00:00:00Z", base_royalty_rate_bps: 600, annual_royalty_cap_cents: 900000000, volume_incentive_threshold_cents: 1000000000, volume_incentive_rate_bps: 300, ad_fund_rate_bps: 200 }
              as: FranchisorOps
              captures: { agSP2: $.data.id, agSP2_v: $.data.version }
            - call: "POST /franchise/agreements/${agSP2}/conversion-plans"
              payload: { milestones: [ { name: "m", target_date: "2027-01-01T00:00:00Z", sequence: 1 } ] }
              as: FranchisorOps
              captures: { cpSP2: $.data.id }
            - call: "POST /franchise/conversion-plans/${cpSP2}/milestones/complete"
              payload: { sequence: 1 }
              as: FranchisorOps
            - call: "POST /franchise/agreements/${agSP2}/activate"
              payload: { expected_agreement_version: "${agSP2_v}" }
              as: FranchisorOps
            - call: "POST /franchise/agreements"
              payload: { brokerage_id: "${bkSP3}", brand_id: "${brSP}", market_id: "${mkSP3}", term_start: "2027-01-01T00:00:00Z", term_end: "2031-12-31T00:00:00Z", base_royalty_rate_bps: 600, annual_royalty_cap_cents: 900000000, volume_incentive_threshold_cents: 1000000000, volume_incentive_rate_bps: 300, ad_fund_rate_bps: 200 }
              as: FranchisorOps
              captures: { agSP3: $.data.id, agSP3_v: $.data.version }
            - call: "POST /franchise/agreements/${agSP3}/conversion-plans"
              payload: { milestones: [ { name: "m", target_date: "2027-01-01T00:00:00Z", sequence: 1 } ] }
              as: FranchisorOps
              captures: { cpSP3: $.data.id }
            - call: "POST /franchise/conversion-plans/${cpSP3}/milestones/complete"
              payload: { sequence: 1 }
              as: FranchisorOps
            - call: "POST /franchise/agreements/${agSP3}/activate"
              payload: { expected_agreement_version: "${agSP3_v}" }
              as: FranchisorOps
            - call: "POST /franchise/advisory-councils"
              payload: { brand_id: "${brSP}", seat_count: 3, member_brokerage_ids: ["${bkSP1}", "${bkSP2}", "${bkSP3}"] }
              as: FranchisorOps
              captures: { cSP: $.data.id }
            - call: "POST /franchise/ad-fund-proposals"
              payload: { brand_id: "${brSP}", council_id: "${cSP}", title: "p", amount_cents: 1000 }
              as: FranchisorOps
              captures: { pSP: $.data.id }
            - call: "POST /franchise/ad-fund-proposals/${pSP}/submit"
              payload: {}
              as: FranchisorOps
            - call: "POST /franchise/ad-fund-proposals/${pSP}/votes"
              payload: { vote: "REJECT" }
              as: FranchiseeAdmin
              as_user_id: "${bkSP1}"
            - call: "POST /franchise/ad-fund-proposals/${pSP}/votes"
              payload: { vote: "REJECT" }
              as: FranchiseeAdmin
              as_user_id: "${bkSP2}"
          trigger:
            - call: "POST /franchise/ad-fund-proposals/${pSP}/votes"
              payload: { vote: "APPROVE" }
              as: FranchiseeAdmin
              as_user_id: "${bkSP3}"
              captures: { errSP: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE (409) — proposal already REJECTED (terminal)"
  - section: calculations
    instances:
      - name: brand_fund_balance_computed_read_matches_ledger
        claim_type: computed_read
        grounds: ["calculations.brand_fund_balance"]
        excluded_because:
          difficulty_instance: ad_fund_collect_minus_spend_balance_conserved
          rationale: "Balance arithmetic asserted as the invariant of the named §1.8 instance."
      - name: milestone_complete_recomputes_ready_flag
        claim_type: correct_result
        grounds: ["calculations.conversion_readiness"]
        distinguishing_aspect: "With a 2-milestone plan, completing sequence 1 leaves ready=false; completing sequence 2 flips ready=true."
        test_recipe:
          setup:
            - "Agreement CM DRAFT with 2-milestone conversion plan"
          setup_api_calls:
            - call: "POST /franchise/brands"
              payload: { brand_code: "CM", display_name: "Brand CM" }
              as: FranchisorOps
              captures: { brCM: $.data.id }
            - call: "POST /franchise/markets"
              payload: { market_code: "MCM", name: "Market CM" }
              as: FranchisorOps
              captures: { mkCM: $.data.id }
            - call: "POST /franchise/brokerages"
              payload: { legal_name: "BRD", home_market_id: "${mkCM}", principal_email: "cm@x.example" }
              as: FranchisorOps
              captures: { bkCM: $.data.id }
            - call: "POST /franchise/agreements"
              payload: { brokerage_id: "${bkCM}", brand_id: "${brCM}", market_id: "${mkCM}", term_start: "2027-01-01T00:00:00Z", term_end: "2031-12-31T00:00:00Z", base_royalty_rate_bps: 600, annual_royalty_cap_cents: 900000000, volume_incentive_threshold_cents: 1000000000, volume_incentive_rate_bps: 300, ad_fund_rate_bps: 200 }
              as: FranchisorOps
              captures: { agCM: $.data.id }
            - call: "POST /franchise/agreements/${agCM}/conversion-plans"
              payload: { milestones: [ { name: "m1", target_date: "2027-01-01T00:00:00Z", sequence: 1 }, { name: "m2", target_date: "2027-02-01T00:00:00Z", sequence: 2 } ] }
              as: FranchisorOps
              captures: { cpCM: $.data.id }
          trigger:
            - call: "POST /franchise/conversion-plans/${cpCM}/milestones/complete"
              payload: { sequence: 1 }
              as: FranchisorOps
              captures: { ready1: $.data.ready }
            - call: "POST /franchise/conversion-plans/${cpCM}/milestones/complete"
              payload: { sequence: 2 }
              as: FranchisorOps
              captures: { ready2: $.data.ready, done2: $.data.milestones_done }
          assert:
            - "after first complete: ready == false, milestones_done == 1"
            - "after second complete: ready == true, milestones_done == 2"
  - section: validations
    instances:
      - name: duplicate_gci_report_rejected
        claim_type: violation_to_error
        grounds: ["validations:priority=11", "errors:ERR_DUPLICATE_REPORT"]
        distinguishing_aspect: "Second GCI report for same (agreement, period_month) is rejected with ERR_DUPLICATE_REPORT."
        test_recipe:
          setup:
            - "Agreement VD ACTIVE; GCI report 2027-01 submitted"
          setup_api_calls:
            - call: "POST /franchise/brands"
              payload: { brand_code: "VD", display_name: "Brand VD" }
              as: FranchisorOps
              captures: { brVD: $.data.id }
            - call: "POST /franchise/markets"
              payload: { market_code: "MVD", name: "Market VD" }
              as: FranchisorOps
              captures: { mkVD: $.data.id }
            - call: "POST /franchise/brokerages"
              payload: { legal_name: "BRE", home_market_id: "${mkVD}", principal_email: "vd@x.example" }
              as: FranchisorOps
              captures: { bkVD: $.data.id }
            - call: "POST /franchise/agreements"
              payload: { brokerage_id: "${bkVD}", brand_id: "${brVD}", market_id: "${mkVD}", term_start: "2027-01-01T00:00:00Z", term_end: "2031-12-31T00:00:00Z", base_royalty_rate_bps: 600, annual_royalty_cap_cents: 900000000, volume_incentive_threshold_cents: 1000000000, volume_incentive_rate_bps: 300, ad_fund_rate_bps: 200 }
              as: FranchisorOps
              captures: { agVD: $.data.id, agVD_v: $.data.version }
            - call: "POST /franchise/agreements/${agVD}/conversion-plans"
              payload: { milestones: [ { name: "m", target_date: "2027-01-01T00:00:00Z", sequence: 1 } ] }
              as: FranchisorOps
              captures: { cpVD: $.data.id }
            - call: "POST /franchise/conversion-plans/${cpVD}/milestones/complete"
              payload: { sequence: 1 }
              as: FranchisorOps
            - call: "POST /franchise/agreements/${agVD}/activate"
              payload: { expected_agreement_version: "${agVD_v}" }
              as: FranchisorOps
            - call: "POST /franchise/agreements/${agVD}/gci-reports"
              payload: { period_month: "2027-01", gci_cents: 5000 }
              as: FranchisorOps
          trigger:
            - call: "POST /franchise/agreements/${agVD}/gci-reports"
              payload: { period_month: "2027-01", gci_cents: 6000 }
              as: FranchisorOps
              captures: { errVD: $.data.error_id }
          assert:
            - "error_id == ERR_DUPLICATE_REPORT (409)"
      - name: assessment_without_gci_report_rejected
        claim_type: violation_to_error
        grounds: ["validations:priority=13", "errors:ERR_GCI_REPORT_MISSING"]
        distinguishing_aspect: "Royalty period assessment for a month with no GCI report returns ERR_GCI_REPORT_MISSING."
        test_recipe:
          setup:
            - "Agreement VE ACTIVE; no GCI report for 2027-03"
          setup_api_calls:
            - call: "POST /franchise/brands"
              payload: { brand_code: "VE", display_name: "Brand VE" }
              as: FranchisorOps
              captures: { brVE: $.data.id }
            - call: "POST /franchise/markets"
              payload: { market_code: "MVE", name: "Market VE" }
              as: FranchisorOps
              captures: { mkVE: $.data.id }
            - call: "POST /franchise/brokerages"
              payload: { legal_name: "BRF", home_market_id: "${mkVE}", principal_email: "ve@x.example" }
              as: FranchisorOps
              captures: { bkVE: $.data.id }
            - call: "POST /franchise/agreements"
              payload: { brokerage_id: "${bkVE}", brand_id: "${brVE}", market_id: "${mkVE}", term_start: "2027-01-01T00:00:00Z", term_end: "2031-12-31T00:00:00Z", base_royalty_rate_bps: 600, annual_royalty_cap_cents: 900000000, volume_incentive_threshold_cents: 1000000000, volume_incentive_rate_bps: 300, ad_fund_rate_bps: 200 }
              as: FranchisorOps
              captures: { agVE: $.data.id, agVE_v: $.data.version }
            - call: "POST /franchise/agreements/${agVE}/conversion-plans"
              payload: { milestones: [ { name: "m", target_date: "2027-01-01T00:00:00Z", sequence: 1 } ] }
              as: FranchisorOps
              captures: { cpVE: $.data.id }
            - call: "POST /franchise/conversion-plans/${cpVE}/milestones/complete"
              payload: { sequence: 1 }
              as: FranchisorOps
            - call: "POST /franchise/agreements/${agVE}/activate"
              payload: { expected_agreement_version: "${agVE_v}" }
              as: FranchisorOps
          trigger:
            - call: "POST /franchise/agreements/${agVE}/royalty-periods"
              payload: { period_month: "2027-03" }
              as: FranchisorOps
              captures: { errVE: $.data.error_id }
          assert:
            - "error_id == ERR_GCI_REPORT_MISSING (422)"
      - name: waive_nonzero_period_rejected
        claim_type: violation_to_error
        grounds: ["validations:priority=17", "errors:ERR_WAIVE_REQUIRES_ZERO_DUE"]
        distinguishing_aspect: "Waive on an ASSESSED period with royalty_due_cents > 0 returns ERR_WAIVE_REQUIRES_ZERO_DUE."
        test_recipe:
          setup:
            - "Agreement VF ACTIVE; GCI 2027-01 = 100000000; period assessed (due = 6000000 at 600bps, no cap/rebate binding)"
          setup_api_calls:
            - call: "POST /franchise/brands"
              payload: { brand_code: "VF", display_name: "Brand VF" }
              as: FranchisorOps
              captures: { brVF: $.data.id }
            - call: "POST /franchise/markets"
              payload: { market_code: "MVF", name: "Market VF" }
              as: FranchisorOps
              captures: { mkVF: $.data.id }
            - call: "POST /franchise/brokerages"
              payload: { legal_name: "BRG", home_market_id: "${mkVF}", principal_email: "vf@x.example" }
              as: FranchisorOps
              captures: { bkVF: $.data.id }
            - call: "POST /franchise/agreements"
              payload: { brokerage_id: "${bkVF}", brand_id: "${brVF}", market_id: "${mkVF}", term_start: "2027-01-01T00:00:00Z", term_end: "2031-12-31T00:00:00Z", base_royalty_rate_bps: 600, annual_royalty_cap_cents: 900000000, volume_incentive_threshold_cents: 1000000000, volume_incentive_rate_bps: 300, ad_fund_rate_bps: 200 }
              as: FranchisorOps
