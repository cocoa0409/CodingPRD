        excluded_because:
          difficulty_instance: reserve_corpus_conserved_across_draw_and_reversal
          rationale: "That §1.8 instance asserts the reversal restores reserve_balance_cents to 51000000 and committed_cents to 0 with no drift, plus the offsetting ledger pair."

  # =========================================================================
  # Guide section 3 — From Table 3 (Calculations)
  # =========================================================================
  - section: calculations
    instances:
      - name: category_deadlines_are_measured_from_the_issuance_clock
        claim_type: correct_result
        grounds:
          - calculations.category_deadline_schedule
          - endpoints["POST /pip/plans/{id}/issue"]
          - endpoints["POST /_clock/set_current_utc"]
        distinguishing_aspect: "The three horizons are counted as calendar days from the issuance date, not from plan creation: issuing on 2026-02-15 across a leap February yields 2026-05-16, 2026-11-12 and 2027-05-11."
        test_recipe:
          setup:
            - "One property with a DRAFT plan carrying one item in each of the three categories, all at 100000 cents."
            - "The plan row was created while the clock read 2026-08-01T00:00:00Z; the clock is then rewound to 2026-02-15T00:00:00Z before issuance."
          setup_api_calls:
            - call: "POST /pip/franchisee-accounts"
              payload: { legal_name: "Amberton Hotels LLC", contact_email: "ops@ambertonh.example" }
              as: BrandManager
              as_user_id: "bm-001"
              captures: { fr_id: $.data.id }
            - call: "POST /pip/properties"
              payload: { franchisee_id: "${fr_id}", brand_code: "HRB", name: "Amberton Lakeshore", room_count: 200, adr_baseline_cents: 18000, occupancy_baseline_pct: 0.70, reserve_balance_cents: 50000000, minimum_retention_cents: 5000000 }
              as: BrandManager
              as_user_id: "bm-001"
              captures: { prop_id: $.data.id }
            - call: "POST /pip/plans"
              payload: { property_id: "${prop_id}", trigger_type: "POST_INSPECTION", standards_edition: "2026.1" }
              as: BrandManager
              as_user_id: "bm-001"
              captures: { plan_id: $.data.id }
            - call: "POST /pip/items"
              payload: { plan_id: "${plan_id}", category: "LIFE_SAFETY", standards_reference: "LS-3.1.1", brand_estimated_cost_cents: 100000, room_impacting: false, rooms_affected_count: 0 }
              as: BrandManager
              as_user_id: "bm-001"
              captures: { ls_id: $.data.id }
            - call: "POST /pip/items"
              payload: { plan_id: "${plan_id}", category: "GUEST_FACING", standards_reference: "GF-3.1.1", brand_estimated_cost_cents: 100000, room_impacting: false, rooms_affected_count: 0 }
              as: BrandManager
              as_user_id: "bm-001"
              captures: { gf_id: $.data.id }
            - call: "POST /pip/items"
              payload: { plan_id: "${plan_id}", category: "BACK_OF_HOUSE", standards_reference: "BOH-3.1.1", brand_estimated_cost_cents: 100000, room_impacting: false, rooms_affected_count: 0 }
              as: BrandManager
              as_user_id: "bm-001"
              captures: { boh_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-02-15T00:00:00Z" }
              as: BrandManager
              as_user_id: "bm-001"
          trigger:
            - call: "POST /pip/plans/${plan_id}/issue"
              payload: {}
              as: BrandManager
              as_user_id: "bm-001"
          assert:
            - "PipPlan.${plan_id}.life_safety_deadline_date == \"2026-05-16\" (2026-02-15 plus 90 days)"
            - "PipPlan.${plan_id}.guest_facing_deadline_date == \"2026-11-12\" (plus 270 days)"
            - "PipPlan.${plan_id}.back_of_house_deadline_date == \"2027-05-11\" (plus 450 days)"
            - "PipItem.${ls_id}.deadline_date == \"2026-05-16\", PipItem.${gf_id}.deadline_date == \"2026-11-12\", PipItem.${boh_id}.deadline_date == \"2027-05-11\""
            - "PipItem.${ls_id}.priority_rank == 1, PipItem.${gf_id}.priority_rank == 2, PipItem.${boh_id}.priority_rank == 3"
            - "no item is_overdue at the issuance clock"

      - name: removed_items_leave_the_cost_and_funding_aggregates
        claim_type: input_set_filtering
        grounds:
          - calculations.plan_scope_cost
          - calculations.funding_requirement
          - endpoints["POST /pip/disputes/{id}/resolve"]
        distinguishing_aspect: "The input set is every item whose status is outside {REMOVED_BY_DISPUTE, VOIDED}; the row a dispute removes drops out of scope_item_count, brand_scoped_total_cents and funding_requirement_cents while remaining readable by id, and the surviving item's priority_rank is recomputed."
        test_recipe:
          setup:
            - "One property with an issued, acknowledged plan carrying a GUEST_FACING item of 1000000 cents and a BACK_OF_HOUSE item of 400000 cents."
          setup_api_calls:
            - call: "POST /pip/franchisee-accounts"
              payload: { legal_name: "Bramblehill Hotels LLC", contact_email: "ops@bramblehillh.example" }
              as: BrandManager
              as_user_id: "bm-001"
              captures: { fr_id: $.data.id }
            - call: "POST /pip/properties"
              payload: { franchisee_id: "${fr_id}", brand_code: "HRB", name: "Bramblehill Summit", room_count: 200, adr_baseline_cents: 18000, occupancy_baseline_pct: 0.70, reserve_balance_cents: 50000000, minimum_retention_cents: 5000000 }
              as: BrandManager
              as_user_id: "bm-001"
              captures: { prop_id: $.data.id }
            - call: "POST /pip/plans"
              payload: { property_id: "${prop_id}", trigger_type: "POST_INSPECTION", standards_edition: "2026.1" }
              as: BrandManager
              as_user_id: "bm-001"
              captures: { plan_id: $.data.id }
            - call: "POST /pip/items"
              payload: { plan_id: "${plan_id}", category: "GUEST_FACING", standards_reference: "GF-5.1.1", brand_estimated_cost_cents: 1000000, room_impacting: false, rooms_affected_count: 0 }
              as: BrandManager
              as_user_id: "bm-001"
              captures: { keep_id: $.data.id }
            - call: "POST /pip/items"
              payload: { plan_id: "${plan_id}", category: "BACK_OF_HOUSE", standards_reference: "BOH-5.1.1", brand_estimated_cost_cents: 400000, room_impacting: false, rooms_affected_count: 0 }
              as: BrandManager
              as_user_id: "bm-001"
              captures: { drop_id: $.data.id }
            - call: "POST /pip/plans/${plan_id}/issue"
              payload: {}
              as: BrandManager
              as_user_id: "bm-001"
            - call: "POST /pip/plans/${plan_id}/acknowledge"
              payload: {}
              as: FranchiseeOwner
              as_user_id: "${fr_id}"
          trigger:
            - call: "POST /pip/disputes"
              payload: { plan_id: "${plan_id}", item_id: "${drop_id}", dispute_basis: "SCOPE_REASONABLENESS", claimed_cost_cents: 0 }
              as: FranchiseeOwner
              as_user_id: "${fr_id}"
              captures: { dispute_id: $.data.id }
            - call: "POST /pip/disputes/${dispute_id}/resolve"
              payload: { resolution: "REMOVE", panel_decision_note: "The kitchen hood scope duplicates work accepted under the prior cycle and is struck from the plan." }
              as: BrandManager
              as_user_id: "bm-001"
            - call: "GET /pip/plans/${plan_id}"
              as: BrandManager
              as_user_id: "bm-001"
          assert:
            - "before the removal: PipPlan.${plan_id}.scope_item_count == 2, brand_scoped_total_cents == 1400000, funding_requirement_cents == 1637900 (1182500 + 455400)"
            - "the resolve returns 200 and PipItem.${drop_id}.status == REMOVED_BY_DISPUTE"
            - "PipPlan.${plan_id}.scope_item_count == 1 (down from 2) and dispute_state == DISPUTE_RESOLVED_REMOVED"
            - "PipPlan.${plan_id}.brand_scoped_total_cents == 1000000 (the 400000 row is filtered out)"
            - "PipPlan.${plan_id}.funding_requirement_cents == 1182500 (guest-facing only, not 1637900)"
            - "PipItem.${keep_id}.priority_rank == 1 and the surviving ranks form a contiguous 1..1 sequence"
            - "GET /pip/items/${drop_id} still returns 200 with approved_cost_cents == 400000, so removal is a status change and not a delete"
            - "GET /pip/compliance-ledger-entries?plan_id=${plan_id}&entry_type=ITEM_REMOVED returns total_count == 1 with delta_cents == -400000 and item_id == ${drop_id}"

      - name: funding_gap_tier_boundary_sits_at_exactly_one_tenth
        claim_type: constants_applied
        grounds:
          - calculations.compliance_risk_score
          - calculations.compliance_posture_derivation
          - endpoints["POST /pip/plans/{id}/compliance-sweep"]
        distinguishing_aspect: "FUNDING_GAP_TIER_RATIO 0.10 is inclusive at the boundary: a gap of exactly 10% of the requirement costs 10 points (score 90, still COMPLIANT), while one cent more crosses into the 25-point tier (score 75, AT_RISK) and puts the franchisee on WATCH."
        test_recipe:
          setup:
            - "One property with an acknowledged plan carrying one GUEST_FACING item of 1000000 cents, so funding_requirement_cents is 1182500; the two authorized amounts below are derived from that figure."
            - "Budget A authorizes 1064250 cents, exactly 10% short of 1182500; the sweep is then run."
            - "Budget A is superseded by Budget B authorizing 1064249 cents, one cent further short, and the sweep is re-run."
          setup_api_calls:
            - call: "POST /pip/franchisee-accounts"
              payload: { legal_name: "Coldspring Hotels LLC", contact_email: "ops@coldspringh.example" }
              as: BrandManager
              as_user_id: "bm-001"
              captures: { fr_id: $.data.id }
            - call: "POST /pip/properties"
              payload: { franchisee_id: "${fr_id}", brand_code: "HRB", name: "Coldspring Waterfront", room_count: 200, adr_baseline_cents: 18000, occupancy_baseline_pct: 0.70, reserve_balance_cents: 50000000, minimum_retention_cents: 5000000 }
              as: BrandManager
              as_user_id: "bm-001"
              captures: { prop_id: $.data.id }
            - call: "POST /pip/plans"
              payload: { property_id: "${prop_id}", trigger_type: "POST_INSPECTION", standards_edition: "2026.1" }
              as: BrandManager
              as_user_id: "bm-001"
              captures: { plan_id: $.data.id }
            - call: "POST /pip/items"
              payload: { plan_id: "${plan_id}", category: "GUEST_FACING", standards_reference: "GF-10.1.1", brand_estimated_cost_cents: 1000000, room_impacting: false, rooms_affected_count: 0 }
              as: BrandManager
              as_user_id: "bm-001"
              captures: { item_id: $.data.id }
            - call: "POST /pip/plans/${plan_id}/issue"
              payload: {}
              as: BrandManager
              as_user_id: "bm-001"
            - call: "POST /pip/plans/${plan_id}/acknowledge"
              payload: {}
              as: FranchiseeOwner
              as_user_id: "${fr_id}"
            - call: "GET /pip/plans/${plan_id}"
              as: FranchiseeOwner
              as_user_id: "${fr_id}"
              captures: { plan_v1: $.data.version }
            - call: "POST /pip/capital-budgets"
              payload: { plan_id: "${plan_id}", total_authorized_cents: 1064250, contingency_pct: 0.10, financing_source: "OWNER_EQUITY", expected_plan_version: "${plan_v1}" }
              as: FranchiseeOwner
              as_user_id: "${fr_id}"
              captures: { budget_a_id: $.data.id }
          trigger:
            - call: "POST /pip/plans/${plan_id}/compliance-sweep"
              payload: {}
              as: BrandManager
              as_user_id: "bm-001"
            - call: "GET /pip/plans/${plan_id}"
              as: BrandManager
              as_user_id: "bm-001"
              captures: { plan_v2: $.data.version }
            - call: "POST /pip/capital-budgets"
              payload: { plan_id: "${plan_id}", total_authorized_cents: 1064249, contingency_pct: 0.10, financing_source: "OWNER_EQUITY", expected_plan_version: "${plan_v2}" }
              as: FranchiseeOwner
              as_user_id: "${fr_id}"
              captures: { budget_b_id: $.data.id }
            - call: "POST /pip/plans/${plan_id}/compliance-sweep"
              payload: {}
              as: BrandManager
              as_user_id: "bm-001"
          assert:
            - "PipPlan.${plan_id}.funding_requirement_cents == 1182500 and PipItem.${item_id}.item_funding_cents == 1182500"
            - "with Budget A active: PipPlan.${plan_id}.funding_gap_cents == 118250 and CapitalBudget.${budget_a_id}.status == DRAFT"
            - "after the first sweep: 118250 / 1182500 == 0.10 exactly, so Property.${prop_id}.compliance_risk_score == 90 and compliance_posture == COMPLIANT"
            - "after the first sweep: FranchiseeAccount.${fr_id}.standing == GOOD"
            - "CapitalBudget.${budget_a_id}.status == SUPERSEDED once Budget B is created"
            - "with Budget B active: PipPlan.${plan_id}.funding_gap_cents == 118251 and CapitalBudget.${budget_b_id}.status == DRAFT"
            - "after the second sweep: 118251 / 1182500 > 0.10, so compliance_risk_score == 75 and compliance_posture == AT_RISK"
            - "after the second sweep: FranchiseeAccount.${fr_id}.standing == WATCH"

      - name: cost_variance_percentage_rounds_to_two_decimals
        claim_type: precision
        grounds:
          - calculations.plan_scope_cost
          - endpoints["POST /pip/disputes"]
          - endpoints["GET /pip/plans/{id}/cost-summary"]
        distinguishing_aspect: "variance_pct is a two-decimal half-up figure derived from the two totals, so an owner claim of 1200000 against a brand estimate of 1000000 gives 16.67 (from 16.666...), never 16.66 or 16.7."
        test_recipe:
          setup:
            - "One property with an issued plan carrying a single GUEST_FACING item of 1000000 cents."
            - "The owner disputes the cost estimate and claims 1200000 cents."
          setup_api_calls:
