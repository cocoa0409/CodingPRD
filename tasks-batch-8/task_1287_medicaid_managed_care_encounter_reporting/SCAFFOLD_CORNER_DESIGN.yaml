      - name: penalty_uncapped_when_raw_below_cap
        claim_type: correct_result
        grounds: [calculations.penalty_amount]
        distinguishing_aspect: "The uncapped branch: an accuracy-only shortfall of 1 point yields raw 50000, which is below the cap of 60000 (10% of 600000 provisional), so the assessment equals the raw amount with reason ACCURACY."
        test_recipe:
          setup:
            - "Program (high posture threshold); SSI@120000 schedule; August cycle; 5 SSI members; 3 encounters ACKNOWLEDGED (eligibility completeness 3/ceil(5*0.5)=3 -> 1.0 passes)"
            - "Statement provisional 600000; audit sample 100 with 6 defects (accuracy 0.94)"
          setup_api_calls:
            - { call: "POST /programs", payload: { name: "P-CALC1", state_code: "CA", companion_guide_version: "CG-2026.1", penalty_threshold_cents: 100000000 }, as: StateAgency, captures: { prog_id: $.data.id } }
