      - name: section_report_creation_blocked_by_not_reportable_evaluation
        grounds:
          - validations[10].ERR_EVALUATION_STATE_INVALID
          - state_machines.ReportabilityEvaluation
          - entities.SectionReport.fields.reportability_evaluation_id
          - endpoints["POST /product-safety/section-reports"]
        distinguishing_aspect: |
          Entity pair (SectionReport -> ReportabilityEvaluation). The row being
          written is brand new and internally perfect; what forbids it is the state
          of the PARENT evaluation, which terminated at NOT_REPORTABLE rather than
          REPORTABLE. Both determinations are terminal and both leave the same
          fields populated, so nothing about the payload or the evaluation's shape
          reveals the block — only status does. Filing a defect report on a
          no-action determination would be a false statement to the agency.
        test_recipe:
          setup:
            - "a CONFIRMED HazardPattern on TOAST-X1"
            - "a ReportabilityEvaluation on it, taken IN_REVIEW and then determined NOT_REPORTABLE with defect_score 2 and risk_score 3 (both strictly below the priority-18 support thresholds, as NOT_REPORTABLE requires)"
