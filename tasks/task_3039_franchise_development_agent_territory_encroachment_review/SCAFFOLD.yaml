# =============================================================================
# SCAFFOLD — Franchise Development Agent Territory & Encroachment Review
# Task: task_3039_franchise_development_agent_territory_encroachment_review
# =============================================================================

scenario: |
  Franchise Development Agent Territory & Encroachment Review (Subway): development
  agent model where a third party sells and supports franchises in a territory with
  fee splits, new-store site approval with an impact study on nearby existing stores,
  franchisee protest process for encroachment with mediation, transfer and resale
  approval including training completion by the buyer, remodel mandate scheduling
  with financing options and closure downtime, non-compliant store inspection scoring
  leading to termination, national promotion participation votes and franchisee
  funding disputes, territory reassignment when a development agent underperforms

domain_name: franchise-development-agent-territory
api_prefix: ""

complexity_profile:
  primary_archetype: multi-party negotiation
  secondary_archetype: compliance / audit
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
    - scheduled_actions
    - derived_field_reconciliation
  entity_topology: flat
  state_machine_shape: branching
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Territory
    parent: null
    common_fields: true
    fields:
      - { name: code, type: string, source: input, description: "Unique territory code" }
      - { name: region, type: string, source: input, description: "Human-readable region name" }
      - { name: royalty_rate_pct, type: number, source: input, description: "Royalty rate applied to weekly store sales, e.g. 0.08" }
      - { name: development_quota_stores, type: integer, source: input, description: "Minimum stores the development agent must keep open" }
      - { name: assigned_agent_id, type: string, source: system, description: "FK -> DevelopmentAgent.id; null while UNASSIGNED; set by assign-agent" }
      - { name: status, type: enum, source: system, description: "UNASSIGNED | ASSIGNED | REASSIGNMENT_PENDING" }
      - { name: open_store_count, type: integer, source: computed, description: "Count of stores in this territory with status IN {OPEN, CLOSED_FOR_REMODEL, PROBATION, TERMINATION_PENDING}" }

  - name: DevelopmentAgent
    parent: null
    common_fields: true
    fields:
      - { name: legal_name, type: string, source: input, description: "Legal name of the development agent firm" }
      - { name: contact_email, type: string, source: input, description: "Primary contact email" }
      - { name: agreement_start, type: datetime, source: input, description: "Development agreement start" }
      - { name: agreement_end, type: datetime, source: input, description: "Development agreement end" }
      - { name: status, type: enum, source: system, description: "ACTIVE | UNDER_REVIEW | UNDERPERFORMING | TERMINATED" }
      - { name: underperformance_strikes, type: integer, source: system, description: "Strike count within trailing 24 months; >= 2 flips status to UNDERPERFORMING" }
      - { name: performance_score, type: number, source: computed, description: "Weighted 0-100 score per da_performance_score calculation" }

  - name: Franchisee
    parent: null
    common_fields: true
    fields:
      - { name: legal_name, type: string, source: input, description: "Franchisee legal name" }
      - { name: contact_email, type: string, source: input, description: "Contact email" }
      - { name: status, type: enum, source: system, description: "PROSPECT | ACTIVE | SUSPENDED | TERMINATED" }

  - name: Store
    parent: null
    common_fields: true
    fields:
      - { name: store_number, type: string, source: input, description: "Unique store number" }
      - { name: territory_id, type: string, source: input, description: "FK -> Territory.id" }
      - { name: franchisee_id, type: string, source: input, description: "FK -> Franchisee.id; current owner" }
      - { name: address, type: string, source: input, description: "Street address" }
      - { name: geo_lat, type: number, source: input, description: "Latitude" }
      - { name: geo_lng, type: number, source: input, description: "Longitude" }
      - { name: opened_on, type: datetime, source: input, description: "Opening date; drives store age for transfer fee discount" }
      - { name: estimated_weekly_sales_cents, type: integer, source: input, description: "Pro forma weekly sales estimate used by provisional calculations" }
      - { name: actual_avg_weekly_sales_cents, type: integer, source: input, description: "Trailing 13-week actual average weekly sales used by final calculations" }
      - { name: status, type: enum, source: system, description: "PIPELINE | OPEN | CLOSED_FOR_REMODEL | PROBATION | TERMINATION_PENDING | TERMINATED" }
      - { name: consecutive_failed_inspections, type: integer, source: system, description: "Count of consecutive finalized FAIL/FAIL_CRITICAL inspections; reset on PASS" }
      - { name: source_site_application_id, type: string, source: system, description: "FK -> SiteApplication.id; null for directly registered stores" }

  - name: SiteApplication
    parent: null
    common_fields: true
    fields:
      - { name: territory_id, type: string, source: input, description: "FK -> Territory.id" }
      - { name: applicant_franchisee_id, type: string, source: input, description: "FK -> Franchisee.id; prospective operator" }
      - { name: proposed_address, type: string, source: input, description: "Proposed site address" }
      - { name: proposed_lat, type: number, source: input, description: "Proposed site latitude" }
      - { name: proposed_lng, type: number, source: input, description: "Proposed site longitude" }
      - { name: proposed_open_date, type: datetime, source: input, description: "Target opening date" }
      - { name: store_id, type: string, source: system, description: "FK -> Store.id; PIPELINE store created on approval; null until APPROVED" }
      - { name: status, type: enum, source: system, description: "DRAFT | SUBMITTED | IMPACT_REVIEW | REVISION_REQUESTED | APPROVED | REJECTED | WITHDRAWN | PROTESTED | SUSPENDED" }
      - { name: revision_count, type: integer, source: system, description: "Number of REVISION_REQUESTED -> SUBMITTED cycles" }
      - { name: approved_on, type: datetime, source: system, description: "Timestamp of most recent APPROVED entry; protest window anchor" }

  - name: ImpactStudy
    parent: null
    common_fields: true
    fields:
      - { name: site_application_id, type: string, source: system, description: "FK -> SiteApplication.id" }
      - { name: radius_miles, type: number, source: input, description: "Study radius; stores outside are excluded from the input set" }
      - { name: affected_store_count, type: integer, source: computed, description: "Stores inside radius assigned an impact bucket" }
      - { name: provisional_impact_cents, type: number, source: computed, description: "Projected weekly sales diversion using estimated_weekly_sales_cents" }
      - { name: final_impact_cents, type: number, source: computed, description: "Projected weekly sales diversion using actual_avg_weekly_sales_cents; null until FINAL" }
      - { name: status, type: enum, source: system, description: "PROVISIONAL | FINAL | VOID" }

  - name: Protest
    parent: null
    common_fields: true
    fields:
      - { name: site_application_id, type: string, source: input, description: "FK -> SiteApplication.id" }
      - { name: protesting_store_id, type: string, source: input, description: "FK -> Store.id; must be OPEN and in the same territory" }
      - { name: protesting_franchisee_id, type: string, source: system, description: "FK -> Franchisee.id; derived from protesting store owner, must equal caller" }
      - { name: grounds, type: string, source: input, description: "Free-text encroachment grounds" }
      - { name: filed_on, type: datetime, source: system, description: "Logical-clock timestamp at filing" }
      - { name: mediator_ref, type: string, source: system, description: "Opaque mediator operator id assigned at send-to-mediation" }
      - { name: mediation_deadline, type: datetime, source: system, description: "Deadline for mediation outcome; null until MEDIATION" }
      - { name: resolution, type: enum, source: system, description: "UPHELD | REJECTED; null until terminal" }
      - { name: status, type: enum, source: system, description: "FILED | UNDER_REVIEW | MEDIATION | MEDIATION_FAILED | ESCALATED | RESOLVED_UPHELD | RESOLVED_REJECTED" }

  - name: TransferRequest
    parent: null
    common_fields: true
    fields:
      - { name: store_id, type: string, source: input, description: "FK -> Store.id" }
      - { name: seller_franchisee_id, type: string, source: system, description: "FK -> Franchisee.id; current store owner at creation" }
      - { name: buyer_franchisee_id, type: string, source: input, description: "FK -> Franchisee.id; prospective buyer" }
      - { name: sale_price_cents, type: integer, source: input, description: "Agreed sale price" }
      - { name: transfer_fee_cents, type: integer, source: computed, description: "Per transfer_fee calculation; computed at creation" }
      - { name: status, type: enum, source: system, description: "PENDING | BUYER_TRAINING | PENDING_APPROVAL | APPROVED | REJECTED | COMPLETED | CANCELLED" }

  - name: TrainingEnrollment
    parent: null
    common_fields: true
    fields:
      - { name: franchisee_id, type: string, source: input, description: "FK -> Franchisee.id" }
      - { name: program_code, type: string, source: input, description: "Training program code" }
      - { name: expires_on, type: datetime, source: input, description: "Enrollment expiry; status becomes EXPIRED lazily when the logical clock passes it" }
      - { name: score, type: number, source: system, description: "Recorded result score 0-100; null until record-result" }
      - { name: completed_on, type: datetime, source: system, description: "Completion timestamp; null until COMPLETED" }
      - { name: status, type: enum, source: system, description: "ENROLLED | COMPLETED | FAILED | EXPIRED" }

  - name: RemodelMandate
    parent: null
    common_fields: true
    fields:
      - { name: store_id, type: string, source: input, description: "FK -> Store.id" }
      - { name: due_by, type: datetime, source: input, description: "Deadline to complete the remodel; lazy OVERDUE when passed" }
      - { name: financing_option, type: enum, source: input, description: "SELF_FINANCED | DA_LOAN | FRANCHISOR_DEFERRAL" }
      - { name: estimated_cost_cents, type: integer, source: input, description: "Estimated remodel cost" }
      - { name: closure_start, type: datetime, source: system, description: "Closure window start (inclusive); null until SCHEDULED" }
      - { name: closure_end, type: datetime, source: system, description: "Closure window end (exclusive); null until SCHEDULED" }
      - { name: downtime_days, type: integer, source: computed, description: "Whole days in [closure_start, closure_end)" }
      - { name: downtime_charge_cents, type: integer, source: computed, description: "Overage charge per remodel_downtime_charge; 0 while within allowance" }
      - { name: status, type: enum, source: system, description: "ISSUED | SCHEDULED | IN_PROGRESS | COMPLETED | OVERDUE | WAIVED" }

  - name: Inspection
    parent: null
    common_fields: true
    fields:
      - { name: store_id, type: string, source: input, description: "FK -> Store.id" }
      - { name: inspector_ref, type: string, source: input, description: "Opaque inspector operator id; segregation of duties: cannot finalize" }
      - { name: scheduled_on, type: datetime, source: input, description: "Scheduled date" }
      - { name: food_safety_score, type: number, source: system, description: "0-100, two decimals; null until findings recorded" }
      - { name: cleanliness_score, type: number, source: system, description: "0-100, two decimals; null until findings recorded" }
      - { name: operations_score, type: number, source: system, description: "0-100, two decimals; null until findings recorded" }
      - { name: critical_violations, type: integer, source: system, description: "Critical violation count; null until findings recorded" }
      - { name: final_score, type: number, source: computed, description: "Per inspection_final_score; null until findings recorded" }
      - { name: outcome, type: enum, source: system, description: "PASS | FAIL | FAIL_CRITICAL; null until FINALIZED" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | CONDUCTED | FINALIZED | VOID" }

  - name: Promotion
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Promotion name" }
      - { name: voting_open, type: datetime, source: input, description: "Voting window open (inclusive)" }
      - { name: voting_close, type: datetime, source: input, description: "Voting window close (exclusive)" }
      - { name: active_start, type: datetime, source: input, description: "Campaign window start (inclusive)" }
      - { name: active_end, type: datetime, source: input, description: "Campaign window end (exclusive)" }
      - { name: base_cost_per_store_cents, type: integer, source: input, description: "Base campaign cost per participating store before subsidy" }
      - { name: eligible_voter_count, type: integer, source: computed, description: "Stores with status IN {OPEN, CLOSED_FOR_REMODEL} at close-voting" }
      - { name: votes_for, type: integer, source: computed, description: "Live (non-retracted) FOR ballots" }
      - { name: votes_against, type: integer, source: computed, description: "Live AGAINST ballots" }
      - { name: votes_abstain, type: integer, source: computed, description: "Live ABSTAIN ballots" }
      - { name: participating_store_count, type: integer, source: computed, description: "Stores with a live FOR ballot; set at APPROVED" }
      - { name: store_share_cents, type: integer, source: computed, description: "Per promotion_funding_allocation; null until APPROVED" }
      - { name: total_pool_cents, type: integer, source: computed, description: "participating_store_count x store_share_cents; null until APPROVED" }
      - { name: status, type: enum, source: system, description: "PROPOSED | VOTING | APPROVED | REJECTED | ACTIVE | CLOSED" }

  - name: PromotionVote
    parent: null
    common_fields: true
    fields:
      - { name: promotion_id, type: string, source: system, description: "FK -> Promotion.id" }
      - { name: store_id, type: string, source: input, description: "FK -> Store.id; must be OPEN or CLOSED_FOR_REMODEL" }
      - { name: franchisee_id, type: string, source: system, description: "FK -> Franchisee.id; store owner, must equal caller" }
      - { name: ballot, type: enum, source: input, description: "FOR | AGAINST | ABSTAIN" }
      - { name: retracted, type: boolean, source: system, description: "True after retract; retracted ballots never count" }

  - name: FundingDispute
    parent: null
    common_fields: true
    fields:
      - { name: promotion_id, type: string, source: input, description: "FK -> Promotion.id; must be ACTIVE" }
      - { name: store_id, type: string, source: input, description: "FK -> Store.id; must be a participating (live FOR) store" }
      - { name: disputed_amount_cents, type: integer, source: input, description: "Must equal Promotion.store_share_cents else ERR_DISPUTE_AMOUNT_MISMATCH" }
      - { name: reason, type: string, source: input, description: "Free-text dispute reason" }
      - { name: resolution, type: enum, source: system, description: "DA_ABSORBS | FRANCHISEE_PAYS | FRANCHISOR_ABSORBS; null until resolved" }
      - { name: status, type: enum, source: system, description: "OPEN | RESOLVED_DA_ABSORBS | RESOLVED_FRANCHISEE_PAYS | RESOLVED_FRANCHISOR_ABSORBS" }

  - name: FeeStatement
    parent: null
    common_fields: true
    fields:
      - { name: development_agent_id, type: string, source: input, description: "FK -> DevelopmentAgent.id" }
      - { name: territory_id, type: string, source: input, description: "FK -> Territory.id; must be assigned to that agent" }
      - { name: period_start, type: datetime, source: input, description: "Statement period start (inclusive)" }
      - { name: period_end, type: datetime, source: input, description: "Statement period end (exclusive); must be after start and a whole number of weeks" }
      - { name: gross_fees_cents, type: integer, source: computed, description: "Per fee_split; provisional variant until FINALIZED, final variant after" }
      - { name: da_share_cents, type: integer, source: computed, description: "Development agent share; invariant: da_share + franchisor_share == gross_fees" }
      - { name: franchisor_share_cents, type: integer, source: computed, description: "Franchisor share; receives any rounding remainder" }
      - { name: variant, type: enum, source: computed, description: "PROVISIONAL_ESTIMATE | FINAL_RECONCILIATION" }
      - { name: status, type: enum, source: system, description: "PROVISIONAL | FINALIZED | SETTLED" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: DevelopmentAgent
    initial_state: ACTIVE
    terminal_states: [TERMINATED]
    transitions:
      - from: ACTIVE
        to: UNDER_REVIEW
        trigger: "POST /development-agents/{id}/flag-underperformance"
        actor: FranchisorOps
        preconditions: ["Agent status == ACTIVE"]
        side_effects: ["underperformance_strikes += 1"]
      - from: UNDER_REVIEW
        to: ACTIVE
        trigger: "POST /development-agents/{id}/clear-review"
        actor: FranchisorOps
        preconditions: ["Agent status == UNDER_REVIEW"]
        side_effects: []
      - from: UNDER_REVIEW
        to: UNDERPERFORMING
        trigger: "POST /development-agents/{id}/flag-underperformance (second strike within trailing 24 months)"
        actor: FranchisorOps
        preconditions: ["Agent status == UNDER_REVIEW"]
        side_effects:
          - "underperformance_strikes += 1 (reaches 2)"
          - "Cascade hop 1: every Territory with assigned_agent_id == agent and status == ASSIGNED -> REASSIGNMENT_PENDING"
          - "Cascade hop 2 (from hop 1): every SiteApplication of that territory with status IN {SUBMITTED, IMPACT_REVIEW} -> SUSPENDED"
          - "Cascade hop 3 (from hop 2): every ImpactStudy of a SUSPENDED application with status == PROVISIONAL -> VOID"
      - from: UNDERPERFORMING
        to: TERMINATED
        trigger: "POST /development-agents/{id}/terminate"
        actor: FranchisorOps
        preconditions: ["Agent status == UNDERPERFORMING", "No Territory with assigned_agent_id == agent remains in status ASSIGNED"]
        side_effects: []

  - entity: Territory
    initial_state: UNASSIGNED
    terminal_states: []
    transitions:
      - from: UNASSIGNED
        to: ASSIGNED
        trigger: "POST /territories/{id}/assign-agent"
        actor: FranchisorOps
        preconditions: ["Target DevelopmentAgent status == ACTIVE (ERR_AGENT_NOT_ACTIVE)"]
        side_effects: ["assigned_agent_id set", "increments Territory.version by 1"]
      - from: ASSIGNED
        to: REASSIGNMENT_PENDING
        trigger: "POST /territories/{id}/initiate-reassignment, or cascade from DevelopmentAgent -> UNDERPERFORMING"
        actor: FranchisorOps
        preconditions: ["assigned agent status == UNDERPERFORMING (ERR_AGENT_NOT_ACTIVE)"]
        side_effects:
          - "Every SiteApplication of this territory with status IN {SUBMITTED, IMPACT_REVIEW} -> SUSPENDED"
          - "Each such suspension voids that application's PROVISIONAL ImpactStudies"
          - "increments Territory.version by 1"
      - from: REASSIGNMENT_PENDING
        to: ASSIGNED
        trigger: "POST /territories/{id}/assign-agent (new agent)"
        actor: FranchisorOps
        preconditions: ["New agent status == ACTIVE", "New agent != previously assigned agent"]
        side_effects:
          - "assigned_agent_id replaced"
          - "SUSPENDED SiteApplications of this territory -> SUBMITTED (resume at re-entry point)"
          - "increments Territory.version by 1"

  - entity: Store
    initial_state: OPEN
    terminal_states: [TERMINATED]
    transitions:
      - from: PIPELINE
        to: OPEN
        trigger: "POST /stores/{id}/open"
        actor: FranchisorOps
        preconditions: ["Store status == PIPELINE"]
        side_effects: ["increments Store.version by 1", "Territory.open_store_count recomputed"]
      - from: OPEN
        to: CLOSED_FOR_REMODEL
        trigger: "POST /remodel-mandates/{id}/begin on a SCHEDULED mandate of this store"
        actor: Franchisee
        preconditions: ["Store status == OPEN"]
        side_effects: ["increments Store.version by 1"]
      - from: CLOSED_FOR_REMODEL
        to: OPEN
        trigger: "POST /remodel-mandates/{id}/complete on the IN_PROGRESS mandate of this store"
        actor: Franchisee
        preconditions: ["Store status == CLOSED_FOR_REMODEL"]
        side_effects: ["increments Store.version by 1", "downtime_charge_cents recomputed on the mandate"]
      - from: OPEN
        to: PROBATION
        trigger: "Inspection finalize with outcome FAIL (non-critical) while store OPEN"
        actor: system
        preconditions: []
        side_effects:
          - "consecutive_failed_inspections += 1"
          - "Cascade hop 1 (this transition): store enters PROBATION"
          - "Cascade hop 2: every TransferRequest of this store with status IN {PENDING, BUYER_TRAINING, PENDING_APPROVAL} -> CANCELLED"
          - "increments Store.version by 1"
      - from: PROBATION
        to: OPEN
        trigger: "Inspection finalize with outcome PASS while store PROBATION"
        actor: system
        preconditions: []
        side_effects: ["consecutive_failed_inspections reset to 0", "increments Store.version by 1"]
      - from: [OPEN, PROBATION]
        to: TERMINATION_PENDING
        trigger: "Inspection finalize with outcome FAIL_CRITICAL, or outcome FAIL while consecutive_failed_inspections already >= 1"
        actor: system
        preconditions: []
        side_effects:
          - "consecutive_failed_inspections += 1"
          - "Every TransferRequest of this store with status IN {PENDING, BUYER_TRAINING, PENDING_APPROVAL} -> CANCELLED"
          - "Every Inspection of this store with status == SCHEDULED -> VOID"
          - "increments Store.version by 1"
      - from: TERMINATION_PENDING
        to: TERMINATED
        trigger: "POST /stores/{id}/terminate"
        actor: FranchisorOps
        preconditions: ["Store status == TERMINATION_PENDING"]
        side_effects:
          - "Territory.open_store_count recomputed"
          - "Every RemodelMandate of this store with status IN {ISSUED, SCHEDULED, OVERDUE} -> WAIVED"
          - "increments Store.version by 1"

  - entity: SiteApplication
    initial_state: DRAFT
    terminal_states: [REJECTED, WITHDRAWN]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /site-applications/{id}/submit"
        actor: DevelopmentAgent
        preconditions: ["Caller is the assigned agent of the territory", "Territory status == ASSIGNED (ERR_TERRITORY_UNASSIGNED otherwise)"]
        side_effects: []
      - from: SUBMITTED
        to: IMPACT_REVIEW
        trigger: "POST /site-applications/{id}/impact-studies (creates PROVISIONAL study)"
        actor: FranchisorOps
        preconditions: ["No ImpactStudy with status IN {PROVISIONAL, FINAL} already exists for this application (ERR_INVALID_STATE)"]
        side_effects: ["provisional_impact_cents and affected_store_count computed per projected_sales_impact (provisional variant)"]
      - from: IMPACT_REVIEW
        to: REVISION_REQUESTED
        trigger: "POST /site-applications/{id}/request-revision"
        actor: FranchisorOps
        preconditions: []
        side_effects: []
      - from: REVISION_REQUESTED
        to: SUBMITTED
        trigger: "POST /site-applications/{id}/submit (resubmission)"
        actor: DevelopmentAgent
        preconditions: ["Caller is the assigned agent of the territory"]
        side_effects: ["revision_count += 1", "existing ImpactStudy -> VOID (must be redone)"]
      - from: IMPACT_REVIEW
        to: APPROVED
        trigger: "POST /site-applications/{id}/approve"
        actor: FranchisorOps
        preconditions: ["ImpactStudy for this application has status == FINAL (ERR_IMPACT_STUDY_NOT_FINAL)"]
        side_effects:
          - "approved_on set to logical clock"
          - "A PIPELINE Store is created (territory, applicant franchisee, proposed address/geo, source_site_application_id back-reference)"
          - "Territory.open_store_count recomputed"
      - from: IMPACT_REVIEW
        to: REJECTED
        trigger: "POST /site-applications/{id}/reject"
        actor: FranchisorOps
        preconditions: []
        side_effects: ["ImpactStudy -> VOID"]
      - from: APPROVED
        to: PROTESTED
        trigger: "POST /protests accepted against this application within the 30-day protest window"
        actor: system
        preconditions: []
        side_effects: []
      - from: PROTESTED
        to: APPROVED
        trigger: "Protest resolved REJECTED (resolve or mediation outcome REJECTED)"
        actor: system
        preconditions: ["No other non-terminal Protest remains on this application"]
        side_effects: []
      - from: PROTESTED
        to: REJECTED
        trigger: "Protest resolved UPHELD (resolve, mediation outcome UPHELD, or escalated resolve UPHELD)"
        actor: system
        preconditions: []
        side_effects:
          - "ImpactStudy -> VOID"
          - "PIPELINE store created at approval -> TERMINATED, Territory.open_store_count recomputed"
      - from: [SUBMITTED, IMPACT_REVIEW]
        to: SUSPENDED
        trigger: "Cascade: territory enters REASSIGNMENT_PENDING"
        actor: system
        preconditions: []
        side_effects: ["PROVISIONAL ImpactStudy -> VOID"]
      - from: SUSPENDED
        to: SUBMITTED
        trigger: "Cascade: territory reassigned to a new agent"
        actor: system
        preconditions: []
        side_effects: []
      - from: [DRAFT, SUBMITTED, IMPACT_REVIEW, REVISION_REQUESTED, APPROVED]
        to: WITHDRAWN
        trigger: "POST /site-applications/{id}/withdraw"
        actor: DevelopmentAgent
        preconditions: ["Caller is the assigned agent of the territory"]
        side_effects: ["PROVISIONAL/FINAL ImpactStudy -> VOID", "If APPROVED: PIPELINE store -> TERMINATED, Territory.open_store_count recomputed"]

  - entity: Protest
    initial_state: FILED
    terminal_states: [RESOLVED_UPHELD, RESOLVED_REJECTED]
    transitions:
      - from: FILED
        to: UNDER_REVIEW
        trigger: "POST /protests/{id}/begin-review"
        actor: FranchisorOps
        preconditions: []
        side_effects: []
      - from: UNDER_REVIEW
        to: MEDIATION
        trigger: "POST /protests/{id}/send-to-mediation"
        actor: FranchisorOps
        preconditions: []
        side_effects: ["mediator_ref and mediation_deadline set"]
      - from: UNDER_REVIEW
        to: RESOLVED_UPHELD
        trigger: "POST /protests/{id}/resolve with resolution=UPHELD"
        actor: FranchisorOps
        preconditions: []
        side_effects: ["SiteApplication PROTESTED -> REJECTED branch side effects fire"]
      - from: UNDER_REVIEW
        to: RESOLVED_REJECTED
        trigger: "POST /protests/{id}/resolve with resolution=REJECTED"
        actor: FranchisorOps
        preconditions: []
        side_effects: ["SiteApplication PROTESTED -> APPROVED when no other live protest"]
      - from: MEDIATION
        to: RESOLVED_UPHELD
        trigger: "POST /protests/{id}/record-mediation-outcome with outcome=UPHELD"
        actor: Mediator
        preconditions: ["Logical clock <= mediation_deadline (ERR_MEDIATION_DEADLINE_PASSED)"]
        side_effects: ["Same UPHELD branch side effects as direct resolve"]
      - from: MEDIATION
        to: RESOLVED_REJECTED
        trigger: "POST /protests/{id}/record-mediation-outcome with outcome=REJECTED"
        actor: Mediator
        preconditions: ["Logical clock <= mediation_deadline"]
        side_effects: ["Same REJECTED branch side effects as direct resolve"]
      - from: MEDIATION
        to: MEDIATION_FAILED
        trigger: "POST /protests/{id}/record-mediation-outcome with outcome=FAILED"
        actor: Mediator
        preconditions: ["Logical clock <= mediation_deadline"]
        side_effects: []
      - from: MEDIATION_FAILED
        to: ESCALATED
        trigger: "POST /protests/{id}/escalate"
        actor: Franchisee
        preconditions: ["Caller owns the protesting store"]
        side_effects: []
      - from: ESCALATED
        to: RESOLVED_UPHELD
        trigger: "POST /protests/{id}/resolve with resolution=UPHELD (arbitration)"
        actor: FranchisorOps
        preconditions: []
        side_effects: ["Same UPHELD branch side effects"]
      - from: ESCALATED
        to: RESOLVED_REJECTED
        trigger: "POST /protests/{id}/resolve with resolution=REJECTED (arbitration)"
        actor: FranchisorOps
        preconditions: []
        side_effects: ["Same REJECTED branch side effects"]

  - entity: TransferRequest
    initial_state: PENDING
    terminal_states: [REJECTED, COMPLETED, CANCELLED]
    transitions:
      - from: PENDING
        to: BUYER_TRAINING
        trigger: "POST /transfer-requests/{id}/advance-to-training"
        actor: FranchisorOps
        preconditions: ["Buyer has a TrainingEnrollment with status IN {ENROLLED, COMPLETED} for program_code TRANSFER_BUYER (ERR_BUYER_TRAINING_INCOMPLETE)"]
        side_effects: []
      - from: BUYER_TRAINING
        to: PENDING_APPROVAL
        trigger: "system: buyer TrainingEnrollment flips to COMPLETED"
        actor: system
        preconditions: []
        side_effects: []
      - from: BUYER_TRAINING
        to: PENDING
        trigger: "system: buyer TrainingEnrollment flips to FAILED or EXPIRED"
        actor: system
        preconditions: []
        side_effects: ["Buyer must obtain a fresh enrollment before advancing again (cycle)"]
      - from: PENDING_APPROVAL
        to: APPROVED
        trigger: "POST /transfer-requests/{id}/approve"
        actor: FranchisorOps
        preconditions: ["Buyer has TrainingEnrollment status == COMPLETED (ERR_BUYER_TRAINING_INCOMPLETE)", "Store status NOT IN {TERMINATION_PENDING, TERMINATED} (ERR_STORE_NOT_TRANSFERABLE)"]
        side_effects: []
      - from: APPROVED
        to: COMPLETED
        trigger: "POST /transfer-requests/{id}/complete"
        actor: FranchisorOps
        preconditions: ["Store status NOT IN {TERMINATION_PENDING, TERMINATED}"]
        side_effects: ["Store.franchisee_id := buyer_franchisee_id", "transfer_fee_cents recognized", "increments Store.version by 1"]
      - from: PENDING_APPROVAL
        to: REJECTED
        trigger: "POST /transfer-requests/{id}/reject"
        actor: FranchisorOps
        preconditions: []
        side_effects: []
      - from: [PENDING, BUYER_TRAINING, PENDING_APPROVAL]
        to: CANCELLED
        trigger: "POST /transfer-requests/{id}/cancel, or cascade from Store -> PROBATION / TERMINATION_PENDING"
        actor: Franchisee
        preconditions: ["Manual cancel: caller is seller_franchisee_id"]
        side_effects: []

  - entity: TrainingEnrollment
    initial_state: ENROLLED
    terminal_states: [COMPLETED, FAILED, EXPIRED]
    transitions:
      - from: ENROLLED
        to: COMPLETED
        trigger: "POST /training-enrollments/{id}/record-result with score >= 80"
        actor: FranchisorOps
        preconditions: ["Logical clock <= expires_on"]
        side_effects: ["completed_on set", "Every TransferRequest of this franchisee with status == BUYER_TRAINING -> PENDING_APPROVAL"]
      - from: ENROLLED
        to: FAILED
        trigger: "POST /training-enrollments/{id}/record-result with score < 80"
        actor: FranchisorOps
        preconditions: []
        side_effects: ["Every TransferRequest of this franchisee with status == BUYER_TRAINING -> PENDING"]
      - from: ENROLLED
        to: EXPIRED
        trigger: "system: logical clock passes expires_on (lazy, applied on read)"
        actor: system
        preconditions: []
        side_effects: ["Every TransferRequest of this franchisee with status == BUYER_TRAINING -> PENDING"]

  - entity: RemodelMandate
    initial_state: ISSUED
    terminal_states: [COMPLETED, WAIVED]
    transitions:
      - from: ISSUED
        to: SCHEDULED
        trigger: "POST /remodel-mandates/{id}/schedule"
        actor: DevelopmentAgent
        preconditions:
          - "Caller is the assigned agent of the store's territory"
          - "Store status == OPEN (ERR_STORE_NOT_OPEN)"
          - "Closure window [closure_start, closure_end) does not intersect any other SCHEDULED/IN_PROGRESS mandate window of this store (ERR_CLOSURE_WINDOW_OVERLAP)"
          - "closure_start >= 7 days after every prior closure_end of this store (ERR_CLOSURE_BUFFER_VIOLATION)"
        side_effects: ["closure_start/closure_end set", "downtime_days computed"]
      - from: SCHEDULED
        to: IN_PROGRESS
        trigger: "POST /remodel-mandates/{id}/begin"
        actor: Franchisee
        preconditions: ["Caller owns the store", "Logical clock >= closure_start and < closure_end"]
        side_effects: ["Store OPEN -> CLOSED_FOR_REMODEL"]
      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "POST /remodel-mandates/{id}/complete"
        actor: Franchisee
        preconditions: ["Caller owns the store"]
        side_effects: ["Store CLOSED_FOR_REMODEL -> OPEN", "downtime_charge_cents computed per remodel_downtime_charge"]
      - from: [ISSUED, SCHEDULED]
        to: OVERDUE
        trigger: "system: logical clock passes due_by (lazy, applied on read)"
        actor: system
        preconditions: []
        side_effects: []
      - from: OVERDUE
        to: SCHEDULED
        trigger: "POST /remodel-mandates/{id}/schedule (reschedule)"
        actor: DevelopmentAgent
        preconditions: ["Same window and buffer rules as ISSUED -> SCHEDULED"]
        side_effects: ["closure window replaced"]
      - from: [ISSUED, SCHEDULED, OVERDUE]
        to: WAIVED
        trigger: "POST /remodel-mandates/{id}/waive, or cascade from Store -> TERMINATED"
        actor: FranchisorOps
        preconditions: []
        side_effects: []

  - entity: Inspection
    initial_state: SCHEDULED
    terminal_states: [FINALIZED, VOID]
    transitions:
      - from: SCHEDULED
        to: CONDUCTED
        trigger: "POST /inspections/{id}/record-findings"
        actor: Inspector
        preconditions: ["Caller X-User-ID == inspector_ref (segregation of duties)", "Store status NOT IN {TERMINATED}"]
        side_effects: ["final_score computed per inspection_final_score"]
      - from: CONDUCTED
        to: FINALIZED
        trigger: "POST /inspections/{id}/finalize"
        actor: FranchisorOps
        preconditions: ["Caller is NOT the inspector_ref (segregation of duties)"]
        side_effects:
          - "outcome := FAIL_CRITICAL if critical_violations >= 3 else PASS if final_score >= 60 else FAIL"
          - "Store cascade per outcome (OPEN->PROBATION, ->TERMINATION_PENDING, or PROBATION->OPEN)"
      - from: SCHEDULED
        to: VOID
        trigger: "system cascade: store enters TERMINATION_PENDING"
        actor: system
        preconditions: []
        side_effects: []

  - entity: Promotion
    initial_state: PROPOSED
    terminal_states: [REJECTED, CLOSED]
    transitions:
      - from: PROPOSED
        to: VOTING
        trigger: "POST /promotions/{id}/open-voting"
        actor: FranchisorOps
        preconditions: ["Logical clock >= voting_open and < voting_close"]
        side_effects: []
      - from: VOTING
        to: APPROVED
        trigger: "POST /promotions/{id}/close-voting with quorum met"
        actor: FranchisorOps
        preconditions: ["Logical clock >= voting_close", "votes_for * 3 >= 2 * eligible_voter_count AND (votes_for + votes_against + votes_abstain) * 2 >= eligible_voter_count (ERR_QUORUM_NOT_MET)"]
        side_effects:
          - "eligible_voter_count, participating_store_count computed"
          - "store_share_cents and total_pool_cents computed per promotion_funding_allocation"
      - from: VOTING
        to: REJECTED
        trigger: "POST /promotions/{id}/close-voting with quorum not met (caller passes force_reject=true)"
        actor: FranchisorOps
        preconditions: ["Logical clock >= voting_close"]
        side_effects: []
      - from: APPROVED
        to: ACTIVE
        trigger: "POST /promotions/{id}/activate"
        actor: FranchisorOps
        preconditions: ["Logical clock >= active_start", "For every territory containing a participating store: fewer than 2 other ACTIVE promotions overlap [active_start, active_end) (ERR_PROMOTION_OVERLAP_EXCEEDED)"]
        side_effects: []
      - from: ACTIVE
        to: CLOSED
        trigger: "POST /promotions/{id}/close"
        actor: FranchisorOps
        preconditions: ["Logical clock >= active_end", "No FundingDispute of this promotion with status == OPEN (ERR_INVALID_STATE)"]
        side_effects: []

  - entity: FeeStatement
    initial_state: PROVISIONAL
    terminal_states: [SETTLED]
    transitions:
      - from: PROVISIONAL
        to: FINALIZED
        trigger: "POST /fee-statements/{id}/finalize"
        actor: FranchisorOps
        preconditions: []
        side_effects: ["variant := FINAL_RECONCILIATION", "gross_fees_cents / da_share_cents / franchisor_share_cents recomputed under final variant"]
      - from: FINALIZED
        to: SETTLED
        trigger: "POST /fee-statements/{id}/settle"
        actor: FranchisorOps
        preconditions: []
        side_effects: ["Conservation invariant re-verified: da_share_cents + franchisor_share_cents == gross_fees_cents"]

# =============================================================================
# §1.2.1 Concurrency Rules (OCC on parent version only)
# =============================================================================
concurrency_rules:
  - rule_id: site-application-create-stale-territory
    parent_entity: Territory
    write_endpoint: "POST /site-applications"
    occ_field: "expected_territory_version"
    description: |
      Creating a SiteApplication against a Territory whose version has advanced
      since the client last observed it is rejected. This captures the case where
      another writer has just created an application (which legitimately consumes
      development capacity) or reassigned the territory, and the current writer's
      view of the territory is therefore stale.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: transfer-request-create-stale-store
    parent_entity: Store
    write_endpoint: "POST /transfer-requests"
    occ_field: "expected_store_version"
    description: |
      Creating a TransferRequest against a Store whose version has advanced since
      the client last observed it is rejected. This captures the case where another
      writer has just created a transfer (which legitimately supersedes the prior
      pending sale) or changed the store's state, and the current writer's view of
      the store is therefore stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: projected_sales_impact
    trigger: "ImpactStudy creation (provisional variant); POST /impact-studies/{id}/finalize (final variant); recompute on any VOID"
    algorithm: weighted_scoring
    formula: |
      input_set: all Stores s with s.territory_id == application.territory_id,
        s.status IN {OPEN, CLOSED_FOR_REMODEL, PROBATION}, and
        distance_deg(s) < radius_miles * 0.0145 (degrees-per-mile constant).
      distance_deg(s) = abs(s.geo_lat - app.proposed_lat) + abs(s.geo_lng - app.proposed_lng)   # Manhattan degrees, pinned
      bucket_pct(s): distance_deg < 0.01 -> 0.12 ; < 0.02 -> 0.07 ; < 0.04 -> 0.03 ; else excluded (0)
      provisional_impact_cents = SUM over affected s of round_half_up(s.estimated_weekly_sales_cents * bucket_pct(s), 2)
      final_impact_cents       = SUM over affected s of round_half_up(s.actual_avg_weekly_sales_cents * bucket_pct(s), 2)
      affected_store_count = number of s with bucket_pct > 0
    input_set: "Stores of the application's territory in operating statuses within the radius"
    constants:
      DEGREES_PER_MILE: 0.0145
      BUCKET_NEAR: 0.12
      BUCKET_MID: 0.07
      BUCKET_FAR: 0.03
      BAND_NEAR_DEG: 0.01
      BAND_MID_DEG: 0.02
      BAND_FAR_DEG: 0.04
    precision: "2 decimal places, round_half_up, per-store line rounded then summed"
    variants:
      - name: provisional
        when: "At ImpactStudy creation"
        difference: "Uses Store.estimated_weekly_sales_cents (pro forma)"
      - name: final
        when: "At POST /impact-studies/{id}/finalize"
        difference: "Uses Store.actual_avg_weekly_sales_cents (trailing 13-week actuals); provisional and final differ whenever estimates diverge from actuals"

  - name: fee_split
    trigger: "POST /fee-statements/generate (provisional variant); POST /fee-statements/{id}/finalize (final variant)"
    algorithm: tiered_pricing
    formula: |
      weeks = (period_end - period_start) / 7 days   # period MUST be whole weeks (ERR_INVALID_REQUEST)
      tier_share_pct = 0.45 if territory store count (status IN {PIPELINE, OPEN, CLOSED_FOR_REMODEL, PROBATION}) >= 5 else 0.40
      PROVISIONAL_ESTIMATE variant (forward-looking):
        gross_fees_cents = SUM over territory stores with status IN {OPEN, PIPELINE} of
          round_half_up(store.estimated_weekly_sales_cents * royalty_rate_pct * weeks, 0)
      FINAL_RECONCILIATION variant (chronological):
        gross_fees_cents = SUM over territory stores with status == OPEN of
          round_half_up(store.actual_avg_weekly_sales_cents * royalty_rate_pct * weeks, 0)
      da_share_cents = round_half_up(gross_fees_cents * tier_share_pct, 0)
      franchisor_share_cents = gross_fees_cents - da_share_cents   # rounding remainder always to franchisor
      Invariant: da_share_cents + franchisor_share_cents == gross_fees_cents at every step.
    input_set: "Territory stores; status filter differs per variant (PIPELINE included only in provisional)"
    constants:
      TIER_HIGH_MIN_STORES: 5
      DA_SHARE_LOW: 0.40
      DA_SHARE_HIGH: 0.45
    precision: "0 decimal places (whole cents), round_half_up"
    variants:
      - name: provisional_estimate
        when: "Statement status == PROVISIONAL"
        difference: "Forward-looking: PIPELINE stores included, estimated sales used"
      - name: final_reconciliation
        when: "Statement status IN {FINALIZED, SETTLED}"
        difference: "Chronological actuals: only OPEN stores, actual_avg_weekly_sales_cents used; same period yields a different gross"

  - name: inspection_final_score
    trigger: "POST /inspections/{id}/record-findings"
    algorithm: weighted_scoring
    formula: |
      # Nested rounding pinned: round EACH weighted category to 2 decimals first, then sum, then subtract penalty.
      final_score = round_half_up(
          round_half_up(food_safety_score * 0.40, 2)
        + round_half_up(cleanliness_score * 0.30, 2)
        + round_half_up(operations_score * 0.30, 2)
        - critical_violations * 2.50, 2)
      final_score floored at 0.00.
      outcome at finalize: FAIL_CRITICAL if critical_violations >= 3
                           else PASS if final_score >= 60.00
                           else FAIL
    input_set: "Single inspection's recorded category scores and critical violation count"
    constants:
      W_FOOD_SAFETY: 0.40
      W_CLEANLINESS: 0.30
      W_OPERATIONS: 0.30
      CRITICAL_PENALTY_POINTS: 2.50
      PASS_THRESHOLD: 60.00
      FAIL_CRITICAL_MIN_VIOLATIONS: 3
    precision: "2 decimal places, round_half_up, per-category rounding BEFORE summation (pinned order)"

  - name: promotion_funding_allocation
    trigger: "POST /promotions/{id}/close-voting when quorum met"
    algorithm: waterfall_allocation
    formula: |
      # Circular-looking dependency pinned by evaluation order:
      # (1) participating_store_count N = stores with a live FOR ballot
      # (2) subsidy tier keyed on N: N >= 12 -> 0.15 ; 6 <= N <= 11 -> 0.10 ; else 0.05
      # (3) store_share_cents = round_half_up(base_cost_per_store_cents * (1 - subsidy), 0)
      # (4) total_pool_cents = N * store_share_cents
      # The tier depends on N and the pool depends on the share; evaluating in this
      # pinned order makes the value well-defined.
    input_set: "Live (non-retracted) FOR PromotionVotes of the promotion at close-voting"
    constants:
      SUBSIDY_TIER_HIGH_MIN: 12
      SUBSIDY_TIER_MID_MIN: 6
      SUBSIDY_HIGH: 0.15
      SUBSIDY_MID: 0.10
      SUBSIDY_LOW: 0.05
    precision: "0 decimal places (whole cents), round_half_up"

  - name: vote_quorum_check
    trigger: "POST /promotions/{id}/close-voting"
    algorithm: threshold
    formula: |
      eligible_voter_count = count of Stores with status IN {OPEN, CLOSED_FOR_REMODEL} at close-voting time
      quorum met iff: votes_for * 3 >= 2 * eligible_voter_count
                  AND (votes_for + votes_against + votes_abstain) * 2 >= eligible_voter_count
      Boundary is inclusive (>=): exactly two-thirds FOR passes.
    input_set: "Live ballots of the promotion; stores in votable statuses"
    precision: "integer arithmetic only; no floating point"

  - name: remodel_downtime_charge
    trigger: "POST /remodel-mandates/{id}/schedule (downtime_days) and /complete (charge)"
    algorithm: threshold
    formula: |
      downtime_days = whole days in [closure_start, closure_end)   # end exclusive
      allowance_days by financing_option: SELF_FINANCED -> 21 ; DA_LOAN -> 28 ; FRANCHISOR_DEFERRAL -> 14
      overage_days = max(0, downtime_days - allowance_days)
      downtime_charge_cents = overage_days * 150000
      Boundary: downtime_days == allowance_days exactly -> charge 0 (no overage).
    input_set: "Single mandate's closure window and financing option"
    constants:
      ALLOW_SELF_FINANCED: 21
      ALLOW_DA_LOAN: 28
      ALLOW_FRANCHISOR_DEFERRAL: 14
      OVERAGE_PER_DAY_CENTS: 150000
    precision: "integer days and cents"

  - name: transfer_fee
    trigger: "POST /transfer-requests (computed at creation, frozen thereafter)"
    algorithm: tiered_pricing
    formula: |
      store_age_years = whole years between store.opened_on and logical clock
      base fee by sale_price_cents tier:
        sale < 25_000_000            -> 500_000 (flat)
        25_000_000 <= sale < 75_000_000 -> round_half_up(sale * 0.02, 0)
        sale >= 75_000_000           -> round_half_up(sale * 0.015, 0)
      age discount: if store_age_years >= 10, multiply fee by 0.90 (round_half_up, 0)
      transfer_fee_cents frozen at creation; later edits to sale price are impossible.
    input_set: "Store (opened_on) and request sale_price_cents"
    constants:
      TIER_LOW_CAP_CENTS: 25000000
      TIER_HIGH_CAP_CENTS: 75000000
      FEE_FLAT_CENTS: 500000
      RATE_MID: 0.02
      RATE_HIGH: 0.015
      AGE_DISCOUNT_MIN_YEARS: 10
      AGE_DISCOUNT_FACTOR: 0.90
    precision: "0 decimal places (whole cents), round_half_up"

  - name: da_performance_score
    trigger: "GET /development-agents/{id} (computed on read)"
    algorithm: weighted_scoring
    formula: |
      Over the agent's assigned territories (any status):
        approval_rate   = APPROVED-or-later SiteApplications / all non-DRAFT SiteApplications (0 if none)
        inspection_pass = finalized PASS Inspections / all FINALIZED Inspections (0 if none)
        remodel_on_time = COMPLETED mandates with downtime <= allowance / all COMPLETED mandates (0 if none)
      performance_score = round_half_up(100 * (0.30*approval_rate + 0.40*inspection_pass + 0.30*remodel_on_time), 2)
      score < 60.00 marks the agent eligible for an underperformance strike; score == 60.00 exactly does NOT.
    input_set: "Agent's territories' applications, inspections, mandates"
    constants:
      W_APPROVAL: 0.30
      W_INSPECTION: 0.40
      W_REMODEL: 0.30
      STRIKE_THRESHOLD: 60.00
    precision: "2 decimal places, round_half_up"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and non-empty"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "Caller role is in the endpoint's roles list; entity-backed ownership: DevelopmentAgent caller must be the assigned agent of the territory; Franchisee caller must own the store/application/dispute acted on"
    error_id: ERR_UNAUTHORIZED_ROLE
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: existence
    check: "Path-template ids resolve to existing resources, validated left-to-right"
    error_id: ERR_*_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints with path ids"
  - priority: 4
    category: existence
    check: "Request-body foreign-key ids resolve, in the endpoint's declared input order"
    error_id: ERR_*_NOT_FOUND
    http_status: 404
    applies_to: "creation endpoints with body FKs"
  - priority: 5
    category: state
    check: "Target resource is in a from-state of the requested transition; terminal states reject everything; OCC expected_*_version matches current parent version"
    error_id: ERR_INVALID_STATE | ERR_STALE_VERSION
    http_status: 409 | 412
    applies_to: "all transition and OCC-guarded endpoints"
  - priority: 6
    category: business_safety
    check: "Buyer training gate: advance-to-training requires buyer enrollment ENROLLED/COMPLETED; approve requires buyer enrollment COMPLETED"
    error_id: ERR_BUYER_TRAINING_INCOMPLETE
    http_status: 422
    applies_to: "POST /transfer-requests/{id}/advance-to-training, POST /transfer-requests/{id}/approve"
  - priority: 7
    category: business_referential
    check: "Protesting store is OPEN and in the same territory as the application; transfer store not TERMINATION_PENDING/TERMINATED; remodel schedule requires store OPEN; vote store OPEN or CLOSED_FOR_REMODEL; dispute store participated (live FOR ballot); fee statement territory assigned to the named agent"
    error_id: ERR_STORE_NOT_OPEN | ERR_STORE_NOT_TRANSFERABLE | ERR_TERRITORY_UNASSIGNED
    http_status: 422
    applies_to: "POST /protests, POST /transfer-requests/{id}/approve, POST /remodel-mandates/{id}/schedule, POST /promotions/{id}/votes, POST /funding-disputes, POST /fee-statements/generate"
  - priority: 8
    category: business_temporal
    check: "Protest filed within 30 days of approved_on; mediation outcome on or before mediation_deadline; vote cast within [voting_open, voting_close); promotion activate at/after active_start; mandate begin within closure window"
    error_id: ERR_PROTEST_WINDOW_EXPIRED | ERR_MEDIATION_DEADLINE_PASSED | ERR_VOTING_CLOSED
    http_status: 422
    applies_to: "POST /protests, POST /protests/{id}/record-mediation-outcome, POST /promotions/{id}/votes, POST /promotions/{id}/activate, POST /remodel-mandates/{id}/begin"
  - priority: 9
    category: business_constraint
    check: "Uniqueness: one non-terminal Protest per (store, application); one live PromotionVote per (store, promotion); one non-settled FeeStatement per (agent, overlapping period)"
    error_id: ERR_PROTEST_ALREADY_FILED | ERR_ALREADY_VOTED | ERR_FISCAL_PERIOD_OVERLAP
    http_status: 409
    applies_to: "POST /protests, POST /promotions/{id}/votes, POST /fee-statements/generate"
  - priority: 10
    category: business_constraint
    check: "Interval and capacity: remodel closure half-open overlap; 7-day post-closure buffer; per-territory ACTIVE promotion capacity < 2 overlapping; quorum thresholds"
    error_id: ERR_CLOSURE_WINDOW_OVERLAP | ERR_CLOSURE_BUFFER_VIOLATION | ERR_PROMOTION_OVERLAP_EXCEEDED | ERR_QUORUM_NOT_MET
    http_status: 422
    applies_to: "POST /remodel-mandates/{id}/schedule, POST /promotions/{id}/activate, POST /promotions/{id}/close-voting"
  - priority: 11
    category: business_fiscal
    check: "Disputed amount equals computed Promotion.store_share_cents; promotion must be ACTIVE for disputes; impact study FINAL before site approval"
    error_id: ERR_DISPUTE_AMOUNT_MISMATCH | ERR_PROMOTION_NOT_ACTIVE | ERR_IMPACT_STUDY_NOT_FINAL
    http_status: 422
    applies_to: "POST /funding-disputes, POST /site-applications/{id}/approve"
  - priority: 12
    category: business_fiscal
    check: "Statement period is whole weeks and period_end > period_start; enum values and numeric ranges on all inputs"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Platform / test-driving ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the logical clock. Before any call, the logical clock reads exactly 2026-09-01T00:00:00Z and never falls back to wall-clock time."
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["Lazy transitions re-evaluated on subsequent reads (enrollment EXPIRED, mandate OVERDUE)"]

  # --- Territory ---
  - method: POST
    path: "/territories"
    description: "Create a territory (UNASSIGNED)"
    roles: [FranchisorOps]
    code: 201
    input: [code, region, royalty_rate_pct, development_quota_stores]
    output: Territory
    side_effects: ["status=UNASSIGNED, open_store_count=0"]
  - method: GET
    path: "/territories/{id}"
    description: "Get a territory"
    roles: [FranchisorOps, DevelopmentAgent]
    code: 200
    input: []
    output: Territory
    side_effects: []
  - method: GET
    path: "/territories"
    description: "List territories"
    roles: [FranchisorOps, DevelopmentAgent]
    code: 200
    input: ["status?", "assigned_agent_id?", "limit?", "offset?"]
    output: Territory[]
    side_effects: []
  - method: POST
    path: "/territories/{id}/assign-agent"
    description: "Assign (or reassign) a development agent"
    roles: [FranchisorOps]
    code: 200
    input: [agent_id]
    output: Territory
    side_effects: ["UNASSIGNED->ASSIGNED or REASSIGNMENT_PENDING->ASSIGNED; resume SUSPENDED applications on reassignment; increments Territory.version by 1"]
  - method: POST
    path: "/territories/{id}/initiate-reassignment"
    description: "Begin territory reassignment for an underperforming agent"
    roles: [FranchisorOps]
    code: 200
    input: []
    output: Territory
    side_effects: ["ASSIGNED->REASSIGNMENT_PENDING; suspends live site applications; voids provisional impact studies; increments Territory.version by 1"]
  - method: GET
    path: "/territories/{id}/stores"
    description: "List stores in a territory"
    roles: [FranchisorOps, DevelopmentAgent]
    code: 200
    input: []
    output: Store[]
    side_effects: []
  - method: GET
    path: "/territories/{id}/site-applications"
    description: "List site applications in a territory"
    roles: [FranchisorOps, DevelopmentAgent]
    code: 200
    input: []
    output: SiteApplication[]
    side_effects: []
  - method: GET
    path: "/territories/{id}/fee-statements"
    description: "List fee statements of a territory"
    roles: [FranchisorOps, DevelopmentAgent]
    code: 200
    input: []
    output: FeeStatement[]
    side_effects: []

  # --- DevelopmentAgent ---
  - method: POST
    path: "/development-agents"
    description: "Register a development agent (ACTIVE)"
    roles: [FranchisorOps]
    code: 201
    input: [legal_name, contact_email, agreement_start, agreement_end]
    output: DevelopmentAgent
    side_effects: ["status=ACTIVE, underperformance_strikes=0"]
  - method: GET
    path: "/development-agents/{id}"
    description: "Get a development agent (performance_score computed on read)"
    roles: [FranchisorOps, DevelopmentAgent]
    code: 200
    input: []
    output: DevelopmentAgent
    side_effects: []
  - method: POST
    path: "/development-agents/{id}/flag-underperformance"
    description: "Record an underperformance strike; second strike flips to UNDERPERFORMING with territory cascade"
    roles: [FranchisorOps]
    code: 200
    input: []
    output: DevelopmentAgent
    side_effects: ["strike increment; on UNDERPERFORMING: territories -> REASSIGNMENT_PENDING -> applications SUSPENDED -> studies VOID"]
  - method: POST
    path: "/development-agents/{id}/clear-review"
    description: "Clear UNDER_REVIEW back to ACTIVE"
    roles: [FranchisorOps]
    code: 200
    input: []
    output: DevelopmentAgent
    side_effects: []
  - method: POST
    path: "/development-agents/{id}/terminate"
    description: "Terminate an underperforming agent"
    roles: [FranchisorOps]
    code: 200
    input: []
    output: DevelopmentAgent
    side_effects: ["status=TERMINATED"]
  - method: GET
    path: "/development-agents/{id}/territories"
    description: "List territories assigned to an agent"
    roles: [FranchisorOps, DevelopmentAgent]
    code: 200
    input: []
    output: Territory[]
    side_effects: []
  - method: GET
    path: "/development-agents/{id}/fee-statements"
    description: "List fee statements of an agent"
    roles: [FranchisorOps, DevelopmentAgent]
    code: 200
    input: []
    output: FeeStatement[]
    side_effects: []

  # --- Franchisee ---
  - method: POST
    path: "/franchisees"
    description: "Register a franchisee (PROSPECT)"
    roles: [FranchisorOps]
    code: 201
    input: [legal_name, contact_email]
    output: Franchisee
    side_effects: ["status=PROSPECT; flips to ACTIVE when first store opens or is transferred in"]
  - method: GET
    path: "/franchisees/{id}"
    description: "Get a franchisee"
    roles: [FranchisorOps, Franchisee]
    code: 200
    input: []
    output: Franchisee
    side_effects: []
  - method: GET
    path: "/franchisees/{id}/stores"
    description: "List stores owned by a franchisee"
    roles: [FranchisorOps, Franchisee]
    code: 200
    input: []
