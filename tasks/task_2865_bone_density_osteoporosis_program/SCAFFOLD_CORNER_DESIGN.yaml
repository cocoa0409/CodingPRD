              as: Scheduler
          assert:
            - "Patient.${pat_id}.lifetime_screening_scan_count == 1 and next_eligible_scan_date == 2028-03-10"
            - "the trigger response status is 402 and data.error_id is ERR_LIFETIME_SCAN_CAP_EXCEEDED"
            - "GET /bone-density/scan-orders?patient_id=${pat_id} returns total_count 1, so no DENIED order row was created because appeal_allowed is false"
      - name: vfa_on_an_eligible_patient_is_rejected_when_the_policy_excludes_it
        claim_type: error_triggerable
        grounds:
          - errors[ERR_VFA_NOT_COVERED]
          - validations[priority 65]
          - calculations.vfa_eligibility_and_grading
          - entities.PayerPolicy[vfa_covered]
        distinguishing_aspect: "The fiscal gate is the last one and it is the only 402 on the VFA path: the order requests VFA and the patient clears the height-loss criterion (168.0 - 163.0 = 5.0 cm against a 4.0 cm requirement), so neither ERR_VFA_NOT_ORDERED nor ERR_VFA_NOT_ELIGIBLE applies, and the request fails purely because the policy carries vfa_covered false, leaving vfa_performed false."
        test_recipe:
          setup:
            - "A policy that does not cover VFA, and an in-progress session for a patient who does meet the height-loss criterion on a VFA-requested order."
          setup_api_calls:
            - call: "POST /bone-density/_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-02T08:00:00Z" }
              as: ProgramAdmin
            - call: "POST /bone-density/payer-policies"
              payload: { payer_code: "PAY-NOVFA", name: "No VFA Plan", baseline_screening_min_interval_months: 24, high_risk_min_interval_months: 12, treatment_monitoring_min_interval_months: 12, vfa_covered: false, vfa_requires_height_loss_cm: 4.0, repeat_scan_grace_days: 30, max_lifetime_screening_scans: 6, appeal_allowed: false }
              as: ProgramAdmin
              captures: { policy_id: $.data.id }
            - call: "POST /bone-density/densitometers"
              payload: { serial_number: "HLG-0001", manufacturer: "HOLOGIC", model: "Horizon A", site_code: "MAIN", phantom_baseline_bmd_g_cm2: 1.0000, phantom_baseline_sd_g_cm2: 0.0100, appointment_buffer_minutes: 15, daily_scan_capacity: 12 }
              as: ProgramAdmin
              captures: { dev_a_id: $.data.id, dev_a_version: $.data.version }
            - call: "POST /bone-density/densitometers/${dev_a_id}/precision-assessment"
              payload: { expected_densitometer_version: "${dev_a_version}", technologist_user_id: "tech-001", patient_count: 30, scans_per_patient: 2, rms_sd_g_cm2: 0.0100 }
              as: ProgramAdmin
            - call: "POST /bone-density/patients"
              payload: { mrn: "MRN-7501", primary_payer_policy_id: "${policy_id}", birth_date: "1958-05-12", sex: "FEMALE", postmenopausal: true, baseline_height_cm: 168.0 }
              as: Scheduler
              captures: { pat_id: $.data.id, pat_version: $.data.version }
            - call: "POST /bone-density/patients/${pat_id}/risk-factor-profiles"
              payload: { expected_patient_version: "${pat_version}", height_cm: 163.0, weight_kg: 58.0 }
              as: InterpretingPhysician
              as_user_id: "phys-001"
            - call: "POST /bone-density/scan-orders"
              payload: { patient_id: "${pat_id}", indication: "BASELINE_SCREENING", requested_sites: ["FEMORAL_NECK"], requested_scan_date: "2026-03-10", vfa_requested: true }
              as: Scheduler
              captures: { order1_id: $.data.id }
            - call: "POST /bone-density/scan-appointments"
              payload: { scan_order_id: "${order1_id}", densitometer_id: "${dev_a_id}", start_utc: "2026-03-10T09:00:00Z", end_utc: "2026-03-10T09:30:00Z" }
              as: Scheduler
              captures: { appt1_id: $.data.id }
            - call: "POST /bone-density/_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-10T09:05:00Z" }
              as: ProgramAdmin
            - call: "POST /bone-density/scan-appointments/${appt1_id}/scan-sessions"
              payload: { scan_mode: "ARRAY" }
              as: Technologist
              as_user_id: "tech-001"
              captures: { sess1_id: $.data.id }
          trigger:
            - call: "POST /bone-density/scan-sessions/${sess1_id}/vfa"
              payload: { genant_grades: [0, 1] }
              as: Technologist
              as_user_id: "tech-001"
          assert:
            - "the trigger response status is 402 and data.error_id is ERR_VFA_NOT_COVERED"
            - "data.error_id is neither ERR_VFA_NOT_ORDERED nor ERR_VFA_NOT_ELIGIBLE"
            - "ScanSession.${sess1_id}.vfa_performed == false"
            - "ScanSession.${sess1_id}.vfa_eligibility_code is null and vfa_max_genant_grade is null"
            - "ScanSession.${sess1_id}.acquisition_status == IN_PROGRESS, so the refusal left the session untouched"
      - name: densitometer_not_active_blocks_session_creation
        claim_type: error_triggerable
        excluded_because:
          difficulty_instance: "cross_entity_state_dependency / session_creation_blocked_by_cross_cal_pending_device_returns_409"
          rationale: "ERR_DENSITOMETER_NOT_ACTIVE is triggered and asserted there against a CROSS_CAL_PENDING device, including the untouched appointment state, so a second trigger would be identical."
      - name: order_not_schedulable_on_a_non_requested_order
        claim_type: error_triggerable
        excluded_because:
          difficulty_instance: "priority_pair_validation_conflict / order_state_check_beats_device_slot_conflict_returns_409"
          rationale: "That instance books an order, then re-books it, which is exactly the ERR_ORDER_NOT_SCHEDULABLE trigger, and it additionally proves the error outranks the slot-conflict check."
      - name: device_slot_conflict_inside_the_turnaround_buffer
        claim_type: error_triggerable
        excluded_because:
          difficulty_instance: "resource_temporal_overlap / device_buffer_rejects_slots_inside_the_gap_but_admits_exact_adjacency"
          rationale: "ERR_DEVICE_SLOT_CONFLICT is triggered there at one minute inside the buffer and shown not to fire at exact adjacency, which covers the error and its boundary in one place."
      - name: patient_double_booked_on_the_same_calendar_date
        claim_type: error_triggerable
        excluded_because:
          difficulty_instance: "resource_temporal_overlap / patient_same_day_rule_rejects_second_device_but_admits_next_day"
          rationale: "ERR_PATIENT_DOUBLE_BOOKED is triggered there across two different densitometers on one UTC date, which is the only condition that produces it."
      - name: positioning_not_accepted_blocks_finalize
        claim_type: error_triggerable
        excluded_because:
          difficulty_instance: "cross_entity_state_dependency / report_finalize_blocked_by_unreviewed_positioning_returns_409"
          rationale: "ERR_POSITIONING_NOT_ACCEPTED is triggered there from a NOT_REVIEWED session and the report is shown to stay DRAFT."
      - name: report_not_finalized_blocks_treatment_plan_creation
        claim_type: error_triggerable
        excluded_because:
          difficulty_instance: "cross_entity_state_dependency / treatment_plan_blocked_by_draft_initiating_report_returns_409"
          rationale: "ERR_REPORT_NOT_FINALIZED is triggered there with a DRAFT initiating report and the absence of a plan row is asserted."
      - name: vfa_not_ordered_on_a_session_whose_order_omitted_it
        claim_type: error_triggerable
        excluded_because:
          difficulty_instance: "priority_pair_validation_conflict / vfa_not_ordered_beats_eligibility_and_coverage_returns_409"
          rationale: "ERR_VFA_NOT_ORDERED is triggered there on a patient who is also ineligible and uncovered, which proves both the error and its precedence."
      - name: vfa_not_eligible_when_no_criterion_matches
        claim_type: error_triggerable
        excluded_because:
          difficulty_instance: "priority_pair_validation_conflict / vfa_eligibility_beats_payer_coverage_returns_409"
          rationale: "ERR_VFA_NOT_ELIGIBLE is triggered there for a patient below every criterion on a policy that also excludes VFA, so the error and its precedence over the 402 are both covered."

  - section: rbac
    instances:
      - name: every_role_exclusive_write_is_forbidden_to_the_other_roles
        claim_type: role_enforcement
        grounds:
          - roles.ProgramAdmin[exclusive_operations]
          - roles.Scheduler[exclusive_operations]
          - roles.Technologist[exclusive_operations]
          - roles.InterpretingPhysician[exclusive_operations]
          - roles.PatientPortalUser[forbidden_operations]
          - validations[priority 2]
          - errors[ERR_FORBIDDEN_ROLE]
        distinguishing_aspect: "The role model is segregation of duties, not a hierarchy: ProgramAdmin cannot book a slot, Scheduler cannot register a device or open a treatment plan, Technologist cannot compute FRAX, QualityReviewer cannot acquire or report, and PatientPortalUser cannot read the device inventory, while the genuinely shared writes - patients, scan orders, QC runs and the clock - succeed for each of their listed roles."
        test_recipe:
          setup:
            - "A certified device, a patient, an order and a booked appointment, all created by their legitimate roles."
          setup_api_calls:
            - call: "POST /bone-density/_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-02T08:00:00Z" }
              as: ProgramAdmin
            - call: "POST /bone-density/payer-policies"
              payload: { payer_code: "PAY-STD", name: "Standard Bone Health", baseline_screening_min_interval_months: 24, high_risk_min_interval_months: 12, treatment_monitoring_min_interval_months: 12, vfa_covered: true, vfa_requires_height_loss_cm: 4.0, repeat_scan_grace_days: 30, max_lifetime_screening_scans: 6, appeal_allowed: false }
              as: ProgramAdmin
