      - name: version_advances_on_every_accepted_write_and_never_on_reads_or_refusals
        claim_type: optimistic_concurrency
        grounds:
          - entities.BranchReopening.fields.status
          - endpoints[POST /branch-reopenings/{id}/reschedule]
          - complexity_profile.complexity_layers
        distinguishing_aspect: "version is a write counter, not a read counter: three consecutive reads of the same branch return an identical version, a refused reopen leaves it untouched, and only the two accepted reschedules advance it — which is precisely the invariant every expected_*_version guard depends on."
        test_recipe:
          setup:
            - "Institution 61086 is CLOSED_IN_RECEIVERSHIP with one branch BR-N01 PLANNED for [2026-08-10T09:00:00Z, 2026-08-10T17:00:00Z) and staffing_headcount 3."
            - "the least-cost test has not been run, so the branch cannot legally reach READY."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00Z" }
              as: ClosingManager
            - call: "POST /institutions"
              payload: { cert_number: "61086", legal_name: "Version Counter Bank", charter_state: "ND", book_asset_value_cents: 9000000, estimated_liquidation_recovery_cents: 4000000 }
              as: ClosingManager
              captures: { vc_inst_id: $.data.id }
            - call: "POST /institutions/${vc_inst_id}/depositor-records"
              payload: { tin_hash: "TIN-VC-1", legal_name: "Aaron Vega", depositor_type: "NATURAL_PERSON", contact_email: "aaron@example.com" }
              as: ClaimsAgent
              captures: { vc_dep_id: $.data.id }
            - call: "POST /deposit-accounts"
              payload: { institution_id: "${vc_inst_id}", primary_depositor_id: "${vc_dep_id}", account_number: "VC-0001", ownership_category: "SINGLE", balance_cents: 6000000, accrued_interest_cents: 0, opened_at: "2024-04-01T00:00:00Z" }
              as: ClaimsAgent
            - call: "POST /institutions/${vc_inst_id}/readiness-submissions"
              payload: { file_format: "FDIC_STANDARD_V2", record_count: 1, malformed_record_count: 0, reported_deposit_total_cents: 6000000 }
              as: ClosingManager
              captures: { vc_sub_id: $.data.id }
            - call: "POST /readiness-submissions/${vc_sub_id}/standardize"
              as: ClosingManager
            - call: "POST /institutions/${vc_inst_id}/close"
              as: ClosingManager
            - call: "POST /institutions/${vc_inst_id}/branch-reopenings"
              payload: { branch_code: "BR-N01", reopen_window_start: "2026-08-10T09:00:00Z", reopen_window_end: "2026-08-10T17:00:00Z", staffing_headcount: 3 }
              as: ClosingManager
              captures: { vc_branch_id: $.data.id }
          trigger:
            - call: "GET /branch-reopenings/${vc_branch_id}"
              as: ClosingManager
              captures: { vc_v1: $.data.version }
            - call: "GET /branch-reopenings/${vc_branch_id}"
              as: ClaimsAgent
            - call: "GET /institutions/${vc_inst_id}/branch-reopenings"
              as: ReceivershipTrustee
            - call: "POST /branch-reopenings/${vc_branch_id}/reopen"
              as: ClosingManager
              captures: { vc_err: $.data.error_id }
            - call: "GET /branch-reopenings/${vc_branch_id}"
              as: ClosingManager
            - call: "POST /branch-reopenings/${vc_branch_id}/reschedule"
              payload: { reopen_window_start: "2026-08-11T09:00:00Z", reopen_window_end: "2026-08-11T17:00:00Z" }
              as: ClosingManager
              captures: { vc_v2: $.data.version }
            - call: "POST /branch-reopenings/${vc_branch_id}/reschedule"
              payload: { reopen_window_start: "2026-08-12T09:00:00Z", reopen_window_end: "2026-08-12T17:00:00Z" }
              as: ClosingManager
              captures: { vc_v3: $.data.version }
          assert:
            - "trigger[0]: version == 1 for a freshly created branch"
            - "trigger[1]: version == '${vc_v1}' — a read never advances the counter"
            - "trigger[2]: \"$.data[0].version\" == '${vc_v1}' — the list view reports the same version as the detail view"
            - "trigger[3]: HTTP 409, data.error_id == 'ERR_BRANCH_NOT_READY'"
            - "trigger[4]: version == '${vc_v1}' — a refused write does not advance the counter"
            - "trigger[5]: version == 2, reschedule_count == 1"
            - "trigger[6]: version == 3, reschedule_count == 2 — one increment per accepted write, no gaps"

      - name: readiness_threshold_resets_when_a_further_submission_reopens_collection
        claim_type: rate_threshold_triggers
        grounds:
          - calculations.readiness_standardization_score.constants
          - state_machines.Institution.RESOLUTION_READY_to_READINESS_COLLECTION
