        test_recipe:
          setup: ["ACTIVE enrollment on a plan with back_reporting_included_months=6; VERIFIED lease with 3 RECORDED payments (2026-03/04/05)."]
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/subscription-plans"
              payload: { name: "Plus6", tier: "PLUS", monthly_fee_cents: 1499, back_reporting_included_months: 6 }
              as: PlatformAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /api/tenants"
              payload: { full_name: "Zed Zero", email: "zed@x.com" }
              as: PlatformAdmin
              captures: { t_id: $.data.id }
            - call: "POST /api/landlords"
              payload: { company_name: "Acme PM", email: "pm@x.com" }
              as: PlatformAdmin
              captures: { ll_id: $.data.id }
            - call: "POST /api/enrollments"
              payload: { tenant_id: "${t_id}", plan_id: "${plan_id}" }
              as: Tenant
              as_user_id: "${t_id}"
              captures: { en_id: $.data.id }
            - call: "GET /api/invoices"
              payload: { enrollment_id: "${en_id}", kind: "SUBSCRIPTION" }
              as: Tenant
              as_user_id: "${t_id}"
              captures: { sub_inv_id: "$.data[0].id" }
            - call: "POST /api/invoices/${sub_inv_id}/pay"
              payload: {}
              as: Tenant
              as_user_id: "${t_id}"
            - call: "POST /api/leases"
              payload: { tenant_id: "${t_id}", landlord_id: "${ll_id}", property_address: "35 Zero Ct", rent_amount_cents: 120000, monthly_due_day: 5, lease_start: "2026-01-01T00:00:00Z", lease_end: "2027-01-01T00:00:00Z" }
              as: Tenant
              as_user_id: "${t_id}"
