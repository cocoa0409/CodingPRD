        test_recipe:
          setup:
            - "Posted fixture: JP channel 25@900 [FANCY] and EU channel 10@700 [FANCY], both holding allocated boxes; JUICE present"
            - "JAPAN lot (5 boxes) and EU lot (5 boxes), both sourced from the POLK grove"
            - "ACTIVE COUNTY_ZONE FRUIT_FLY quarantine on POLK (issued by co_ff_a)"
