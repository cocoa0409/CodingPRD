scaffold_corner_design:
  # =========================================================================
  - section: entities
    instances:
      - name: corner_create_property_success_with_computed_fields
        claim_type: creation
        grounds:
          - entities.Property.fields.required_fire_flow_gpm
          - entities.Property.fields.occupant_load
          - entities.Property.fields.design_occupant_load
          - entities.Property.fields.required_exits
        distinguishing_aspect: "POST /api/properties for a BUSINESS/TYPE_II/3000 sqft building returns 201 with occupant_load 17, design_occupant_load 20, required_exits 1, required_fire_flow_gpm 500."
        test_recipe:
          setup:
            - "Empty DB."
          setup_api_calls: []
          trigger:
            - call: "POST /api/properties"
              payload: { address: "20 T St", owner_name: "O", occupancy_classification: "BUSINESS", construction_type: "TYPE_II", total_floor_area_sqft: 3000, stories: 1 }
              as: FireMarshal
              captures: { prop_id: $.data.id }
          assert:
            - "Property.${prop_id}.occupant_load == 17"
            - "Property.${prop_id}.design_occupant_load == 20"
            - "Property.${prop_id}.required_exits == 1"
            - "Property.${prop_id}.required_fire_flow_gpm == 500"
            - "Property.${prop_id}.version == 1"

      - name: corner_get_property_not_found
        claim_type: not_found
        grounds: [entities.Property]
        distinguishing_aspect: "GET /api/properties/{unknown-uuid} returns 404 ERR_PROPERTY_NOT_FOUND."
        test_recipe:
          setup:
            - "Empty DB."
          setup_api_calls: []
          trigger:
            - call: "GET /api/properties/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: FireMarshal
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_PROPERTY_NOT_FOUND"

      - name: corner_create_property_missing_required_returns_400
        claim_type: required_fields
        grounds: [entities.Property.fields.occupancy_classification]
        distinguishing_aspect: "POST /api/properties without occupancy_classification returns 400 ERR_VALIDATION."
        test_recipe:
          setup:
            - "Empty DB."
          setup_api_calls: []
          trigger:
            - call: "POST /api/properties"
              payload: { address: "21 U St", owner_name: "O", construction_type: "TYPE_II", total_floor_area_sqft: 3000, stories: 1 }
              as: FireMarshal
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_VALIDATION"

      - name: corner_create_property_invalid_enum_returns_422
        claim_type: type_constraints
        grounds: [entities.Property.fields.occupancy_classification]
        distinguishing_aspect: "POST /api/properties with occupancy_classification=MALL (not a declared member) returns 422 ERR_INVALID_ENUM."
        test_recipe:
          setup:
            - "Empty DB."
          setup_api_calls: []
          trigger:
            - call: "POST /api/properties"
              payload: { address: "22 V St", owner_name: "O", occupancy_classification: "MALL", construction_type: "TYPE_II", total_floor_area_sqft: 3000, stories: 1 }
              as: FireMarshal
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_ENUM"

  # =========================================================================
  - section: state_machines
    instances:
      - name: corner_discipline_decision_on_approved_axis_returns_409
        claim_type: invalid_transition
        grounds:
          - state_machines.PlanReview.OPEN_to_OPEN
          - validations[priority=10]
        distinguishing_aspect: "A second decision on an already-APPROVED SPRINKLER axis (no longer UNDER_REVIEW) returns 409 ERR_REVIEW_INCOMPLETE."
        test_recipe:
          setup:
            - "A submitted application whose SPRINKLER axis is already APPROVED."
          setup_api_calls:
            - call: "POST /api/properties"
              payload: { address: "23 W St", owner_name: "O", occupancy_classification: "BUSINESS", construction_type: "TYPE_II", total_floor_area_sqft: 5000, stories: 1 }
              as: FireMarshal
              captures: { prop_id: $.data.id }
            - call: "POST /api/permit-applications"
              payload: { property_id: "${prop_id}", applicant_user_id: "app-9", permit_type: "CONSTRUCTION", project_valuation_cents: 100080, scope_area_sqft: 5000 }
              as: Applicant
              as_user_id: "app-9"
              captures: { app_id: $.data.id }
            - call: "POST /api/permit-applications/${app_id}/submit"
              payload: {}
              as: Applicant
              as_user_id: "app-9"
            - call: "GET /api/plan-reviews?application_id=${app_id}"
              payload: {}
              as: PlanReviewer
              captures: { pr_id: "$.data[0].id" }
            - call: "POST /api/plan-reviews/${pr_id}/discipline-decision"
              payload: { discipline: "SPRINKLER", decision: "APPROVED" }
              as: PlanReviewer
          trigger:
            - call: "POST /api/plan-reviews/${pr_id}/discipline-decision"
              payload: { discipline: "SPRINKLER", decision: "APPROVED" }
              as: PlanReviewer
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_REVIEW_INCOMPLETE"

      - name: corner_revoke_revoked_permit_returns_409
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.Permit.ISSUED_to_REVOKED
          - validations[priority=8]
        distinguishing_aspect: "Revoking a Permit already in terminal REVOKED returns 409 ERR_INVALID_STATE; no second refund is applied."
        test_recipe:
          setup:
            - "An issued permit that has already been revoked once."
          setup_api_calls:
            - call: "POST /api/properties"
              payload: { address: "24 X St", owner_name: "O", occupancy_classification: "BUSINESS", construction_type: "TYPE_II", total_floor_area_sqft: 5000, stories: 1 }
              as: FireMarshal
              captures: { prop_id: $.data.id }
            - call: "POST /api/permit-applications"
              payload: { property_id: "${prop_id}", applicant_user_id: "app-10", permit_type: "CONSTRUCTION", project_valuation_cents: 100080, scope_area_sqft: 5000 }
              as: Applicant
              as_user_id: "app-10"
              captures: { app_id: $.data.id }
            - call: "POST /api/permit-applications/${app_id}/submit"
              payload: {}
              as: Applicant
              as_user_id: "app-10"
            - call: "GET /api/plan-reviews?application_id=${app_id}"
              payload: {}
              as: PlanReviewer
              captures: { pr_id: "$.data[0].id" }
            - call: "POST /api/plan-reviews/${pr_id}/discipline-decision"
              payload: { discipline: "SPRINKLER", decision: "APPROVED" }
              as: PlanReviewer
            - call: "POST /api/plan-reviews/${pr_id}/discipline-decision"
              payload: { discipline: "ALARM", decision: "APPROVED" }
              as: PlanReviewer
            - call: "POST /api/plan-reviews/${pr_id}/discipline-decision"
              payload: { discipline: "EGRESS", decision: "APPROVED" }
              as: PlanReviewer
            - call: "POST /api/permit-applications/${app_id}/pay-fee"
              payload: { amount_cents: 20640 }
              as: Applicant
              as_user_id: "app-10"
            - call: "POST /api/permits"
              payload: { application_id: "${app_id}" }
              as: FireMarshal
              captures: { perm_id: $.data.id }
            - call: "POST /api/permits/${perm_id}/revoke"
              payload: {}
              as: FireMarshal
          trigger:
            - call: "POST /api/permits/${perm_id}/revoke"
              payload: {}
              as: FireMarshal
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_STATE"

      - name: corner_record_result_on_passed_inspection_returns_409
        claim_type: idempotency
        grounds:
          - state_machines.Inspection.SCHEDULED_to_PASSED
          - validations[priority=8]
        distinguishing_aspect: "Recording a result on an Inspection already in terminal PASSED returns 409 ERR_INVALID_STATE."
        test_recipe:
          setup:
            - "A property with a periodic inspection already recorded PASSED."
          setup_api_calls:
            - call: "POST /api/properties"
              payload: { address: "25 Y St", owner_name: "O", occupancy_classification: "BUSINESS", construction_type: "TYPE_II", total_floor_area_sqft: 5000, stories: 1 }
              as: FireMarshal
              captures: { prop_id: $.data.id }
            - call: "POST /api/inspections"
              payload: { property_id: "${prop_id}", inspection_type: "PERIODIC", scheduled_date: "2026-03-05T00:00:00Z" }
              as: Inspector
              captures: { insp_id: $.data.id }
            - call: "POST /api/inspections/${insp_id}/record-result"
              payload: { result: "PASSED" }
              as: Inspector
          trigger:
            - call: "POST /api/inspections/${insp_id}/record-result"
              payload: { result: "PASSED" }
              as: Inspector
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_STATE"

  # =========================================================================
  - section: calculations
    instances:
      - name: corner_flow_available_at_20psi_correct
        claim_type: correct_result
        grounds:
          - calculations.flow_available_at_20psi
          - entities.FlowTest.fields.available_flow_at_20psi
        distinguishing_aspect: "For static 70, residual 50, measured 1500, available_flow_at_20psi = round(1500 * (2.5 ** 0.54)) = 2460 gpm."
        test_recipe:
          setup:
            - "A hydrant on a property."
          setup_api_calls:
            - call: "POST /api/properties"
              payload: { address: "26 Z St", owner_name: "O", occupancy_classification: "BUSINESS", construction_type: "TYPE_II", total_floor_area_sqft: 5000, stories: 1 }
              as: FireMarshal
              captures: { prop_id: $.data.id }
            - call: "POST /api/hydrants"
              payload: { property_id: "${prop_id}", location_desc: "gate", main_size_inches: 8 }
              as: Inspector
              captures: { hyd_id: $.data.id }
          trigger:
            - call: "POST /api/flow-tests"
              payload: { hydrant_id: "${hyd_id}", test_date: "2026-03-01T00:00:00Z", static_psi: 70, residual_psi: 50, measured_flow_gpm: 1500 }
              as: Inspector
              captures: { ft_id: $.data.id }
          assert:
            - "FlowTest.${ft_id}.available_flow_at_20psi == 2460"
            - "FlowTest.${ft_id}.valid_until == 2027-03-01T00:00:00Z"

      - name: corner_abatement_deadline_major_30_days
        claim_type: correct_result
        grounds:
          - calculations.abatement_deadline
          - entities.AbatementOrder.fields.deadline
        distinguishing_aspect: "For a MAJOR violation with the clock at its default 2026-03-01, the AbatementOrder deadline is issued_at + 30 days = 2026-03-31T00:00:00Z."
        test_recipe:
          setup:
            - "A property with a FAILED periodic inspection creating a MAJOR violation; logical clock at default 2026-03-01."
          setup_api_calls:
            - call: "POST /api/properties"
              payload: { address: "27 AA St", owner_name: "O", occupancy_classification: "BUSINESS", construction_type: "TYPE_II", total_floor_area_sqft: 5000, stories: 1 }
              as: FireMarshal
              captures: { prop_id: $.data.id }
            - call: "POST /api/inspections"
              payload: { property_id: "${prop_id}", inspection_type: "PERIODIC", scheduled_date: "2026-03-02T00:00:00Z" }
              as: Inspector
              captures: { insp_id: $.data.id }
            - call: "POST /api/inspections/${insp_id}/record-result"
              payload: { result: "FAILED", findings: [ { code_section: "IFC_9001", severity: "MAJOR" } ] }
              as: Inspector
            - call: "GET /api/violations?inspection_id=${insp_id}"
              payload: {}
              as: Inspector
              captures: { v_id: "$.data[0].id", v_ver: "$.data[0].version" }
          trigger:
            - call: "POST /api/violations/${v_id}/abatement-orders"
              payload: { expected_violation_version: "${v_ver}" }
              as: Inspector
              captures: { ao_id: $.data.id }
          assert:
            - "AbatementOrder.${ao_id}.deadline == 2026-03-31T00:00:00Z"
            - "AbatementOrder.${ao_id}.status == ISSUED"

      - name: corner_required_fire_flow_min_clamp_500
        claim_type: constants_applied
        grounds:
          - calculations.required_fire_flow_gpm
          - entities.Property.fields.required_fire_flow_gpm
        distinguishing_aspect: "A small BUSINESS/TYPE_I/1000 sqft building's raw flow (54 gpm) is clamped up to the FLOW_MIN_GPM floor 500."
        test_recipe:
          setup:
            - "Empty DB."
          setup_api_calls: []
          trigger:
            - call: "POST /api/properties"
              payload: { address: "28 BB St", owner_name: "O", occupancy_classification: "BUSINESS", construction_type: "TYPE_I", total_floor_area_sqft: 1000, stories: 1 }
              as: FireMarshal
              captures: { prop_id: $.data.id }
          assert:
            - "Property.${prop_id}.required_fire_flow_gpm == 500"

  # =========================================================================
  - section: validations
    instances:
      - name: corner_issue_permit_fee_unpaid_returns_402
        claim_type: violation_to_error
        grounds:
          - validations[priority=16]
          - errors[ERR_FEE_UNPAID]
        distinguishing_aspect: "An APPROVED application with amount_paid_cents 0 fails permit issuance with 402 ERR_FEE_UNPAID (state check passes, fiscal check fails in isolation)."
        test_recipe:
          setup:
            - "A fully APPROVED CONSTRUCTION application with no fee paid."
          setup_api_calls:
            - call: "POST /api/properties"
              payload: { address: "29 CC St", owner_name: "O", occupancy_classification: "BUSINESS", construction_type: "TYPE_II", total_floor_area_sqft: 5000, stories: 1 }
              as: FireMarshal
              captures: { prop_id: $.data.id }
            - call: "POST /api/permit-applications"
              payload: { property_id: "${prop_id}", applicant_user_id: "app-11", permit_type: "CONSTRUCTION", project_valuation_cents: 100080, scope_area_sqft: 5000 }
              as: Applicant
              as_user_id: "app-11"
              captures: { app_id: $.data.id }
            - call: "POST /api/permit-applications/${app_id}/submit"
              payload: {}
              as: Applicant
              as_user_id: "app-11"
            - call: "GET /api/plan-reviews?application_id=${app_id}"
              payload: {}
              as: PlanReviewer
              captures: { pr_id: "$.data[0].id" }
            - call: "POST /api/plan-reviews/${pr_id}/discipline-decision"
              payload: { discipline: "SPRINKLER", decision: "APPROVED" }
              as: PlanReviewer
            - call: "POST /api/plan-reviews/${pr_id}/discipline-decision"
              payload: { discipline: "ALARM", decision: "APPROVED" }
              as: PlanReviewer
            - call: "POST /api/plan-reviews/${pr_id}/discipline-decision"
              payload: { discipline: "EGRESS", decision: "APPROVED" }
              as: PlanReviewer
          trigger:
            - call: "POST /api/permits"
              payload: { application_id: "${app_id}" }
              as: FireMarshal
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_FEE_UNPAID"

      - name: corner_flow_test_invalid_readings_returns_422
        claim_type: violation_to_error
        grounds:
          - validations[priority=14]
          - errors[ERR_INVALID_FLOW_READINGS]
        distinguishing_aspect: "A flow test with residual_psi 60 >= static_psi 50 on a hydrant with no prior test (no overlap) returns 422 ERR_INVALID_FLOW_READINGS."
        test_recipe:
          setup:
            - "A hydrant with no prior flow test."
          setup_api_calls:
            - call: "POST /api/properties"
              payload: { address: "30 DD St", owner_name: "O", occupancy_classification: "BUSINESS", construction_type: "TYPE_II", total_floor_area_sqft: 5000, stories: 1 }
              as: FireMarshal
              captures: { prop_id: $.data.id }
            - call: "POST /api/hydrants"
              payload: { property_id: "${prop_id}", location_desc: "gate2", main_size_inches: 6 }
              as: Inspector
              captures: { hyd_id: $.data.id }
          trigger:
            - call: "POST /api/flow-tests"
              payload: { hydrant_id: "${hyd_id}", test_date: "2026-03-01T00:00:00Z", static_psi: 50, residual_psi: 60, measured_flow_gpm: 1000 }
              as: Inspector
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_FLOW_READINGS"

      - name: corner_complaint_inspection_missing_description_returns_422
        claim_type: conditional_validation
        grounds:
          - validations[priority=7]
          - errors[ERR_MISSING_CONDITIONAL_FIELD]
        distinguishing_aspect: "Scheduling a COMPLAINT inspection without complaint_description returns 422 ERR_MISSING_CONDITIONAL_FIELD."
        test_recipe:
          setup:
            - "A property with no inspections."
          setup_api_calls:
            - call: "POST /api/properties"
              payload: { address: "31 EE St", owner_name: "O", occupancy_classification: "BUSINESS", construction_type: "TYPE_II", total_floor_area_sqft: 5000, stories: 1 }
              as: FireMarshal
              captures: { prop_id: $.data.id }
          trigger:
            - call: "POST /api/inspections"
              payload: { property_id: "${prop_id}", inspection_type: "COMPLAINT", scheduled_date: "2026-03-05T00:00:00Z" }
              as: Inspector
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_MISSING_CONDITIONAL_FIELD"

      - name: corner_hazmat_submit_insufficient_fire_flow_returns_409
        claim_type: cross_entity_validation
        grounds:
          - validations[priority=15]
          - errors[ERR_INSUFFICIENT_FIRE_FLOW]
        distinguishing_aspect: "Submitting a HAZMAT application whose referenced FlowTest available flow (436 gpm) is below the property required_fire_flow_gpm (3500) returns 409 ERR_INSUFFICIENT_FIRE_FLOW."
        test_recipe:
          setup:
            - "A FACTORY/TYPE_V/20000 property (required 3500 gpm), a hydrant with a valid but weak flow test (available 436), and a HAZMAT application referencing that flow test."
          setup_api_calls:
            - call: "POST /api/properties"
              payload: { address: "32 FF St", owner_name: "O", occupancy_classification: "FACTORY", construction_type: "TYPE_V", total_floor_area_sqft: 20000, stories: 2 }
              as: FireMarshal
              captures: { prop_id: $.data.id }
            - call: "POST /api/hydrants"
              payload: { property_id: "${prop_id}", location_desc: "yard", main_size_inches: 6 }
              as: Inspector
              captures: { hyd_id: $.data.id }
            - call: "POST /api/flow-tests"
              payload: { hydrant_id: "${hyd_id}", test_date: "2026-03-01T00:00:00Z", static_psi: 30, residual_psi: 25, measured_flow_gpm: 300 }
              as: Inspector
              captures: { ft_id: $.data.id }
            - call: "POST /api/permit-applications"
              payload: { property_id: "${prop_id}", applicant_user_id: "app-12", permit_type: "HAZMAT", project_valuation_cents: 500000, scope_area_sqft: 4000, flow_test_id: "${ft_id}" }
              as: Applicant
              as_user_id: "app-12"
              captures: { app_id: $.data.id }
          trigger:
            - call: "POST /api/permit-applications/${app_id}/submit"
              payload: {}
              as: Applicant
              as_user_id: "app-12"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INSUFFICIENT_FIRE_FLOW"

  # =========================================================================
  - section: endpoints
    instances:
      - name: corner_list_inspections_pagination
        claim_type: listing
        grounds: [entities.Inspection]
        distinguishing_aspect: "GET /api/inspections?property_id=&limit=1 returns a paginated array with total_count 2 and has_more true when two inspections exist on the property."
        test_recipe:
          setup:
            - "A property with two SCHEDULED inspections at least 14 days apart."
          setup_api_calls:
            - call: "POST /api/properties"
              payload: { address: "33 GG St", owner_name: "O", occupancy_classification: "BUSINESS", construction_type: "TYPE_II", total_floor_area_sqft: 5000, stories: 1 }
              as: FireMarshal
              captures: { prop_id: $.data.id }
            - call: "POST /api/inspections"
              payload: { property_id: "${prop_id}", inspection_type: "PERIODIC", scheduled_date: "2026-03-05T00:00:00Z" }
              as: Inspector
              captures: { i1: $.data.id }
            - call: "POST /api/inspections"
              payload: { property_id: "${prop_id}", inspection_type: "PERIODIC", scheduled_date: "2026-04-05T00:00:00Z" }
              as: Inspector
              captures: { i2: $.data.id }
          trigger:
            - call: "GET /api/inspections?property_id=${prop_id}&limit=1&offset=0"
              payload: {}
              as: Inspector
          assert:
            - "response data is an array of length 1"
            - "response meta/pagination total_count == 2 and has_more == true"

      - name: corner_reverse_reach_flow_tests_by_hydrant
        claim_type: listing
        grounds: [entities.FlowTest.fields.hydrant_id]
        distinguishing_aspect: "GET /api/flow-tests?hydrant_id= returns the FlowTest[] for that hydrant (FK reverse-reachability)."
        test_recipe:
          setup:
            - "A hydrant with one flow test."
          setup_api_calls:
            - call: "POST /api/properties"
              payload: { address: "34 HH St", owner_name: "O", occupancy_classification: "BUSINESS", construction_type: "TYPE_II", total_floor_area_sqft: 5000, stories: 1 }
              as: FireMarshal
              captures: { prop_id: $.data.id }
            - call: "POST /api/hydrants"
              payload: { property_id: "${prop_id}", location_desc: "curb", main_size_inches: 8 }
              as: Inspector
              captures: { hyd_id: $.data.id }
            - call: "POST /api/flow-tests"
              payload: { hydrant_id: "${hyd_id}", test_date: "2026-03-01T00:00:00Z", static_psi: 70, residual_psi: 50, measured_flow_gpm: 1500 }
              as: Inspector
              captures: { ft_id: $.data.id }
          trigger:
            - call: "GET /api/flow-tests?hydrant_id=${hyd_id}"
              payload: {}
              as: Inspector
          assert:
            - "response data is an array containing FlowTest ${ft_id}"

  # =========================================================================
  - section: rbac
    instances:
      - name: corner_inspector_cannot_issue_permit_returns_403
        claim_type: role_denied
        grounds: [roles.Inspector, roles.FireMarshal]
        distinguishing_aspect: "POST /api/permits attempted as Inspector (a FireMarshal-exclusive operation) returns 403 ERR_UNAUTHORIZED."
        test_recipe:
          setup:
            - "A fully APPROVED, paid application ready to issue."
          setup_api_calls:
            - call: "POST /api/properties"
              payload: { address: "35 II St", owner_name: "O", occupancy_classification: "BUSINESS", construction_type: "TYPE_II", total_floor_area_sqft: 5000, stories: 1 }
              as: FireMarshal
              captures: { prop_id: $.data.id }
            - call: "POST /api/permit-applications"
              payload: { property_id: "${prop_id}", applicant_user_id: "app-13", permit_type: "CONSTRUCTION", project_valuation_cents: 100080, scope_area_sqft: 5000 }
              as: Applicant
              as_user_id: "app-13"
              captures: { app_id: $.data.id }
            - call: "POST /api/permit-applications/${app_id}/submit"
              payload: {}
              as: Applicant
              as_user_id: "app-13"
            - call: "GET /api/plan-reviews?application_id=${app_id}"
              payload: {}
              as: PlanReviewer
              captures: { pr_id: "$.data[0].id" }
            - call: "POST /api/plan-reviews/${pr_id}/discipline-decision"
              payload: { discipline: "SPRINKLER", decision: "APPROVED" }
              as: PlanReviewer
            - call: "POST /api/plan-reviews/${pr_id}/discipline-decision"
              payload: { discipline: "ALARM", decision: "APPROVED" }
              as: PlanReviewer
            - call: "POST /api/plan-reviews/${pr_id}/discipline-decision"
              payload: { discipline: "EGRESS", decision: "APPROVED" }
              as: PlanReviewer
            - call: "POST /api/permit-applications/${app_id}/pay-fee"
              payload: { amount_cents: 20640 }
              as: Applicant
              as_user_id: "app-13"
          trigger:
            - call: "POST /api/permits"
              payload: { application_id: "${app_id}" }
              as: Inspector
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_UNAUTHORIZED"

      - name: corner_applicant_cannot_submit_others_application_returns_403
        claim_type: ownership_denied
        grounds:
          - validations[priority=4]
          - errors[ERR_NOT_OWNER]
        distinguishing_aspect: "Submitting an application whose applicant_user_id is 'owner-x' while acting as X-User-ID 'intruder' returns 403 ERR_NOT_OWNER."
        test_recipe:
          setup:
            - "A DRAFT application owned by opaque user 'owner-x'."
          setup_api_calls:
            - call: "POST /api/properties"
              payload: { address: "36 JJ St", owner_name: "O", occupancy_classification: "BUSINESS", construction_type: "TYPE_II", total_floor_area_sqft: 5000, stories: 1 }
              as: FireMarshal
              captures: { prop_id: $.data.id }
            - call: "POST /api/permit-applications"
              payload: { property_id: "${prop_id}", applicant_user_id: "owner-x", permit_type: "CONSTRUCTION", project_valuation_cents: 100080, scope_area_sqft: 5000 }
              as: Applicant
              as_user_id: "owner-x"
              captures: { app_id: $.data.id }
          trigger:
            - call: "POST /api/permit-applications/${app_id}/submit"
              payload: {}
              as: Applicant
              as_user_id: "intruder"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_NOT_OWNER"

  # =========================================================================
  - section: cross_cutting_complexity_layers
    instances:
      - name: corner_abatement_order_stale_version_returns_412
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[abatement-order-supersede-stale-violation]
          - errors[ERR_STALE_VERSION]
        distinguishing_aspect: "After a first abatement order is issued (Violation.version advances from 1 to 2), a second issuance still carrying expected_violation_version=1 returns 412 ERR_STALE_VERSION."
        test_recipe:
          setup:
            - "A property with a FAILED periodic inspection creating one MAJOR violation (version 1); a first abatement order already issued, advancing the violation version to 2."
          setup_api_calls:
            - call: "POST /api/properties"
              payload: { address: "37 KK St", owner_name: "O", occupancy_classification: "BUSINESS", construction_type: "TYPE_II", total_floor_area_sqft: 5000, stories: 1 }
              as: FireMarshal
              captures: { prop_id: $.data.id }
            - call: "POST /api/inspections"
              payload: { property_id: "${prop_id}", inspection_type: "PERIODIC", scheduled_date: "2026-03-05T00:00:00Z" }
              as: Inspector
              captures: { insp_id: $.data.id }
            - call: "POST /api/inspections/${insp_id}/record-result"
              payload: { result: "FAILED", findings: [ { code_section: "IFC_9001", severity: "MAJOR" } ] }
              as: Inspector
            - call: "GET /api/violations?inspection_id=${insp_id}"
              payload: {}
              as: Inspector
              captures: { v_id: "$.data[0].id", v_ver: "$.data[0].version" }
            - call: "POST /api/violations/${v_id}/abatement-orders"
              payload: { expected_violation_version: "${v_ver}" }
              as: Inspector
              captures: { ao1_id: $.data.id }
          trigger:
            - call: "POST /api/violations/${v_id}/abatement-orders"
              payload: { expected_violation_version: "${v_ver}" }
              as: Inspector
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_STALE_VERSION"

      - name: corner_failed_inspection_major_sets_placard_yellow
        claim_type: derived_field_reconciliation
        grounds:
          - state_machines.Inspection.SCHEDULED_to_FAILED
          - entities.Certificate.fields.placard_status
          - entities.Certificate.fields.occupancy_status
        distinguishing_aspect: "A FAILED inspection whose only finding is MAJOR (no IMMINENT_HAZARD) turns the Certificate placard YELLOW while occupancy_status stays VALID."
        test_recipe:
          setup:
            - "A property with an active Certificate (VALID/GREEN) and a scheduled periodic inspection."
          setup_api_calls:
            - call: "POST /api/properties"
              payload: { address: "38 LL St", owner_name: "O", occupancy_classification: "BUSINESS", construction_type: "TYPE_II", total_floor_area_sqft: 5000, stories: 1 }
              as: FireMarshal
              captures: { prop_id: $.data.id }
            - call: "POST /api/certificates"
              payload: { property_id: "${prop_id}" }
              as: FireMarshal
              captures: { cert_id: $.data.id }
            - call: "POST /api/inspections"
              payload: { property_id: "${prop_id}", inspection_type: "PERIODIC", scheduled_date: "2026-03-05T00:00:00Z" }
              as: Inspector
              captures: { insp_id: $.data.id }
          trigger:
            - call: "POST /api/inspections/${insp_id}/record-result"
              payload: { result: "FAILED", findings: [ { code_section: "IFC_9001", severity: "MAJOR" } ] }
              as: Inspector
          assert:
            - "Certificate.${cert_id}.placard_status == YELLOW"
            - "Certificate.${cert_id}.occupancy_status == VALID"
            - "Property.${prop_id}.open_violation_count == 1"

  # =========================================================================
  - section: consistency_model
    instances:
      - name: corner_permit_issuance_visible_in_same_response
        claim_type: immediate_visibility
        grounds:
          - state_machines.PermitApplication.APPROVED_to_ISSUED
          - entities.PermitApplication.fields.final_fee_cents
        distinguishing_aspect: "Under the immediate consistency model, POST /api/permits returns 201 and the same-request read shows PermitApplication.status ISSUED with final_fee_cents 20640 and Property.fees_paid_cents 20640."
        test_recipe:
          setup:
            - "A fully APPROVED, 20640-paid CONSTRUCTION application."
          setup_api_calls:
            - call: "POST /api/properties"
              payload: { address: "39 MM St", owner_name: "O", occupancy_classification: "BUSINESS", construction_type: "TYPE_II", total_floor_area_sqft: 5000, stories: 1 }
              as: FireMarshal
              captures: { prop_id: $.data.id }
            - call: "POST /api/permit-applications"
              payload: { property_id: "${prop_id}", applicant_user_id: "app-14", permit_type: "CONSTRUCTION", project_valuation_cents: 100080, scope_area_sqft: 5000 }
              as: Applicant
              as_user_id: "app-14"
              captures: { app_id: $.data.id }
            - call: "POST /api/permit-applications/${app_id}/submit"
              payload: {}
              as: Applicant
              as_user_id: "app-14"
            - call: "GET /api/plan-reviews?application_id=${app_id}"
              payload: {}
              as: PlanReviewer
              captures: { pr_id: "$.data[0].id" }
            - call: "POST /api/plan-reviews/${pr_id}/discipline-decision"
              payload: { discipline: "SPRINKLER", decision: "APPROVED" }
              as: PlanReviewer
            - call: "POST /api/plan-reviews/${pr_id}/discipline-decision"
              payload: { discipline: "ALARM", decision: "APPROVED" }
              as: PlanReviewer
            - call: "POST /api/plan-reviews/${pr_id}/discipline-decision"
              payload: { discipline: "EGRESS", decision: "APPROVED" }
              as: PlanReviewer
            - call: "POST /api/permit-applications/${app_id}/pay-fee"
              payload: { amount_cents: 20640 }
              as: Applicant
              as_user_id: "app-14"
          trigger:
            - call: "POST /api/permits"
              payload: { application_id: "${app_id}" }
              as: FireMarshal
              captures: { perm_id: $.data.id }
          assert:
            - "PermitApplication.${app_id}.status == ISSUED"
            - "PermitApplication.${app_id}.final_fee_cents == 20640"
            - "Property.${prop_id}.fees_paid_cents == 20640"

  # =========================================================================
  - section: errors
    instances:
      - name: corner_error_application_not_approved_covered
        claim_type: violation_to_error
        grounds:
          - "errors[ERR_APPLICATION_NOT_APPROVED]"
        excluded_because:
          difficulty_instance: issue_permit_state_beats_fiscal
          rationale: "ERR_APPLICATION_NOT_APPROVED is asserted as the winning error of the named §1.8 priority-conflict instance."
      - name: corner_error_flow_test_window_overlap_covered
        claim_type: violation_to_error
        grounds:
          - "errors[ERR_FLOW_TEST_WINDOW_OVERLAP]"
        excluded_because:
          difficulty_instance: flow_test_window_overlap_halfopen
          rationale: "ERR_FLOW_TEST_WINDOW_OVERLAP is asserted directly by the named §1.8 temporal-overlap instance."
      - name: corner_error_inspection_too_close_covered
        claim_type: violation_to_error
        grounds:
          - "errors[ERR_INSPECTION_TOO_CLOSE]"
        excluded_because:
          difficulty_instance: inspection_buffer_too_close
          rationale: "ERR_INSPECTION_TOO_CLOSE is asserted directly by the named §1.8 buffer instance."
      - name: corner_error_open_violations_covered
        claim_type: violation_to_error
        grounds:
          - "errors[ERR_OPEN_VIOLATIONS]"
        excluded_because:
          difficulty_instance: certificate_reinstate_requires_no_open_violations
          rationale: "ERR_OPEN_VIOLATIONS is asserted directly by the named §1.8 cross-entity instance."
