        claim_type: violation_to_error
        grounds: ["entities.DutyEvent.fields.occurred_at", "errors[ERR_INVALID_REQUEST]", "endpoints[POST /_clock/set_current_utc]"]
        distinguishing_aspect: "With NO clock-set call, the server default is exactly 2026-08-01T00:00:00Z: an event at 2026-08-02 is rejected as future; an event at 2026-07-31T23:59 is accepted. Pins the startup default."
