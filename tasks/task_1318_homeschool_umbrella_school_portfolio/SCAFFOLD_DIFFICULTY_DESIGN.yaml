  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: curriculum_plan_revision_cycle
        grounds:
          - state_machines.CurriculumPlan.REVISION_REQUESTED_to_SUBMITTED
          - state_machines.CurriculumPlan.APPROVED_to_AMENDMENT_REVIEW
          - state_machines.CurriculumPlan.AMENDMENT_REVIEW_to_APPROVED
          - concurrency_rules[curriculum-plan-amend-stale]
        distinguishing_aspect: |
          Cyclic machine on CurriculumPlan: DRAFT->SUBMITTED->REVISION_REQUESTED->
          SUBMITTED->APPROVED->AMENDMENT_REVIEW->APPROVED revisits both SUBMITTED
          and APPROVED; revision_count and version advance monotonically while the
          state cycles. Entity distinct from the Portfolio cycle instance.
        test_recipe:
          setup:
            - "Year OPEN; family; student; enrollment REGISTERED (plan operations do not require activation)"
            - "CurriculumPlan with the 5 core subjects"
          setup_api_calls:
            - { call: "POST /academic-years", payload: { label: "2026-2027", start_date: "2026-08-01", end_date: "2027-05-31", notice_filing_deadline: "2026-09-15T00:00:00Z", portfolio_due_date: "2027-04-30T00:00:00Z", state_report_due_date: "2027-06-15T00:00:00Z", mid_year_date: "2027-01-15" }, as: AcademicDirector, captures: { yr: $.data.id } }
