            - "ServiceZone.${z}.reserved_bay_minutes == 0"
            - "GET /bay-reservations?bay_id=${b}&state=HELD reports total_count == 0 and GET /bay-reservations?bay_id=${b}&state=ACTIVE reports total_count == 0"
