scaffold_corner_design:

  # ===========================================================================
  # Breadth walk of references/claim-extraction-guide.md against §1.1-§1.7.
  # Every failing trigger captures $.data.error_id so the rejected call is
  # explicitly marked as a negative trigger.
  # ===========================================================================
  - section: entities
    instances:

      - name: plan_create_applies_every_declared_field_default
        claim_type: defaults
        grounds:
          - entities.Plan.fields.shipments_per_cycle
          - entities.Plan.fields.shipments_per_term
          - entities.Plan.fields.allowed_frequency_weeks
          - entities.Plan.fields.is_negative_option
          - entities.Plan.fields.renewal_reminder_days_before
          - entities.Plan.fields.max_pause_cycles
          - entities.Plan.fields.addon_catalog
          - entities.Plan.fields.downgrade_target_plan_id
          - entities.Plan.fields.status
          - endpoints["POST /plans"]
        distinguishing_aspect: |
          A Plan created with only the five required fields must come back carrying every declared
          default verbatim - cadence [2, 4, 8], 12 shipments per term, negative-option true, a
          10-day reminder lead, 3 pause cycles, an empty addon catalog, a null downgrade target and
          status ACTIVE - and active_subscription_count initialised to 0, not null.
        test_recipe:
          setup:
            - "Empty database with the logical clock pinned to 2026-01-10T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-10T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /plans"
              payload: { code: "MIN", name: "Minimal Box", monthly_price_cents: 1000, unit_cogs_cents: 400, margin_floor_pct: 0.3000 }
              as: PlatformAdmin
              captures: { min_plan_id: $.data.id }
          assert:
            - "Response status is 201"
            - "Plan.${min_plan_id}.shipments_per_cycle == 1"
            - "Plan.${min_plan_id}.shipments_per_term == 12"
            - "Plan.${min_plan_id}.allowed_frequency_weeks == [2, 4, 8]"
            - "Plan.${min_plan_id}.is_negative_option == true"
            - "Plan.${min_plan_id}.renewal_reminder_days_before == 10"
            - "Plan.${min_plan_id}.max_pause_cycles == 3"
            - "Plan.${min_plan_id}.addon_catalog == []"
            - "Plan.${min_plan_id}.downgrade_target_plan_id == null"
            - "Plan.${min_plan_id}.status == ACTIVE"
            - "Plan.${min_plan_id}.active_subscription_count == 0"
            - "Plan.${min_plan_id}.version == 1"

      - name: subscription_create_returns_201_with_every_declared_output_field
        claim_type: creation
        grounds:
          - endpoints["POST /subscriptions"]
          - entities.Subscription
          - state_machines.Subscription.initial_state
        distinguishing_aspect: |
          One create call must settle both axes of the parallel state machine (lifecycle ACTIVE,
          billing CURRENT), price the cycle at 6298 cents, anchor baseline_price_cents to the same
          value, seed the shipment conservation triple as 1 / 0 / 11 and schedule the first renewal
          exactly 28 days out - all in the 201 body.
        test_recipe:
          setup:
            - "Clock 2026-01-10; plan CORE (4999 / 2100, MUG addon 1299 / 520); subscriber A with an ACTIVE VISA card."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-10T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /plans"
              payload: { code: "CORE", name: "Core Box", monthly_price_cents: 4999, unit_cogs_cents: 2100, margin_floor_pct: 0.4200, addon_catalog: [{ code: "MUG", unit_price_cents: 1299, unit_cogs_cents: 520 }] }
              as: PlatformAdmin
              captures: { core_plan_id: $.data.id }
            - call: "POST /subscribers"
              payload: { email: "a@dtc.test", acquisition_channel: "ORGANIC" }
              as: PlatformAdmin
              captures: { sub_a_id: $.data.id }
            - call: "POST /payment-methods"
              payload: { subscriber_id: "${sub_a_id}", card_last4: "4242", exp_month: 12, exp_year: 2030, network: "VISA" }
              as: PlatformAdmin
              captures: { pm_a_id: $.data.id }
          trigger:
            - call: "POST /subscriptions"
              payload: { subscriber_id: "${sub_a_id}", plan_id: "${core_plan_id}", payment_method_id: "${pm_a_id}", frequency_weeks: 4, disclosure_acknowledged: true, addons: [{ code: "MUG", qty: 1 }] }
              as: PlatformAdmin
              captures: { s_a_id: $.data.id }
          assert:
            - "Response status is 201"
            - "Subscription.${s_a_id}.lifecycle_state == ACTIVE"
            - "Subscription.${s_a_id}.billing_state == CURRENT"
            - "Subscription.${s_a_id}.committed_price_cents == 6298"
            - "Subscription.${s_a_id}.baseline_price_cents == 6298"
            - "Subscription.${s_a_id}.next_renewal_at == 2026-02-07T00:00:00Z"
            - "Subscription.${s_a_id}.next_ship_at == 2026-02-07T00:00:00Z"
            - "Subscription.${s_a_id}.term_shipments_delivered == 1"
            - "Subscription.${s_a_id}.term_shipments_skipped == 0"
            - "Subscription.${s_a_id}.term_shipments_remaining == 11"
            - "Subscription.${s_a_id}.active_discount_pct == 0.0000"
            - "Subscription.${s_a_id}.discount_remaining_cycles == 0"
            - "Subscription.${s_a_id}.paused_until == null"
            - "Subscription.${s_a_id}.cancel_effective_at == null"
            - "Subscription.${s_a_id}.consecutive_failed_attempts == 0"
            - "Subscription.${s_a_id}.version == 1"
            - "Plan.${core_plan_id}.active_subscription_count == 1"

      - name: subscription_read_reflects_stored_state_without_bumping_version
        claim_type: retrieval
        grounds:
          - endpoints["GET /subscriptions/{id}"]
          - entities.Subscription.fields.committed_price_cents
          - entities.Subscriber.fields.tenure_days
        distinguishing_aspect: |
          A read is side-effect free: ten days after signup the GET still reports version 1 and the
          unchanged 6298-cent commitment, while the subscriber's read-time derived tenure_days has
          moved to 10 - proving stored fields are persisted and Subscriber's computed fields are
          re-derived against the clock at read time.
        test_recipe:
          setup:
            - "Clock 2026-01-10; CORE subscription for subscriber A created with one MUG addon; clock then advanced to 2026-01-20."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-10T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /plans"
              payload: { code: "CORE", name: "Core Box", monthly_price_cents: 4999, unit_cogs_cents: 2100, margin_floor_pct: 0.4200, addon_catalog: [{ code: "MUG", unit_price_cents: 1299, unit_cogs_cents: 520 }] }
              as: PlatformAdmin
              captures: { core_plan_id: $.data.id }
            - call: "POST /subscribers"
              payload: { email: "a@dtc.test", acquisition_channel: "ORGANIC" }
              as: PlatformAdmin
              captures: { sub_a_id: $.data.id }
            - call: "POST /payment-methods"
              payload: { subscriber_id: "${sub_a_id}", card_last4: "4242", exp_month: 12, exp_year: 2030, network: "VISA" }
              as: PlatformAdmin
              captures: { pm_a_id: $.data.id }
            - call: "POST /subscriptions"
              payload: { subscriber_id: "${sub_a_id}", plan_id: "${core_plan_id}", payment_method_id: "${pm_a_id}", frequency_weeks: 4, disclosure_acknowledged: true, addons: [{ code: "MUG", qty: 1 }] }
              as: PlatformAdmin
              captures: { s_a_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-20T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "GET /subscriptions/${s_a_id}"
              payload: {}
              as: RetentionSpecialist
            - call: "GET /subscribers/${sub_a_id}"
              payload: {}
              as: RetentionSpecialist
          assert:
            - "Response status is 200"
            - "Subscription.${s_a_id}.committed_price_cents == 6298"
            - "Subscription.${s_a_id}.version == 1"
            - "Subscription.${s_a_id}.plan_id == ${core_plan_id}"
            - "Subscription.${s_a_id}.payment_method_id == ${pm_a_id}"
            - "Subscriber.${sub_a_id}.tenure_days == 10"
            - "Subscriber.${sub_a_id}.tenure_bucket == M0_1"
            - "Subscriber.${sub_a_id}.cohort_month == 2026-01"

      - name: plan_list_paginates_by_created_at_ascending_with_envelope_metadata
        claim_type: listing
        grounds:
          - endpoints["GET /plans"]
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
        distinguishing_aspect: |
          Three plans created in a known order and read with limit 2 / offset 0 must return exactly
          the two oldest rows in created_at ASC order with total_count 3 and has_more true; the
          second page returns the third row with has_more false.
        test_recipe:
          setup:
            - "Clock 2026-01-10; plans LITE, CORE and BOUND created in that order."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-10T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /plans"
              payload: { code: "LITE", name: "Lite Box", monthly_price_cents: 2999, unit_cogs_cents: 1400, margin_floor_pct: 0.4000 }
              as: PlatformAdmin
              captures: { lite_plan_id: $.data.id }
            - call: "POST /plans"
              payload: { code: "CORE", name: "Core Box", monthly_price_cents: 4999, unit_cogs_cents: 2100, margin_floor_pct: 0.4200 }
              as: PlatformAdmin
              captures: { core_plan_id: $.data.id }
            - call: "POST /plans"
              payload: { code: "BOUND", name: "Bounded Box", monthly_price_cents: 5000, unit_cogs_cents: 2500, margin_floor_pct: 0.4048, allowed_frequency_weeks: [4], is_negative_option: false }
              as: PlatformAdmin
              captures: { bound_plan_id: $.data.id }
          trigger:
            - call: "GET /plans"
              payload: { limit: 2, offset: 0 }
              as: PlatformAdmin
            - call: "GET /plans"
              payload: { limit: 2, offset: 2 }
              as: PlatformAdmin
          assert:
            - "First response status is 200 and meta.total_count == 3"
            - "First response meta.has_more == true and meta.limit == 2 and meta.offset == 0"
            - "First response data has length 2 with data[0].id == ${lite_plan_id} and data[1].id == ${core_plan_id}"
            - "Second response meta.has_more == false and meta.offset == 2"
            - "Second response data has length 1 with data[0].id == ${bound_plan_id}"

      - name: subscription_read_with_unknown_id_returns_not_found
        claim_type: not_found
        grounds:
          - errors[ERR_SUBSCRIPTION_NOT_FOUND]
          - validations[priority=3]
          - endpoints["GET /subscriptions/{id}"]
        distinguishing_aspect: |
          A syntactically valid UUID that matches no row must produce ERR_SUBSCRIPTION_NOT_FOUND
          with HTTP 404 - not an empty 200 body and not a 400.
        test_recipe:
          setup:
            - "Empty database with the clock pinned to 2026-01-10T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-10T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "GET /subscriptions/11111111-1111-4111-8111-111111111111"
              payload: {}
              as: PlatformAdmin
              captures: { err_sub: $.data.error_id }
          assert:
            - "Response status is 404"
            - "error_id == ERR_SUBSCRIPTION_NOT_FOUND"

      - name: subscription_create_missing_required_frequency_weeks_returns_invalid_request
        claim_type: required_fields
        grounds:
          - endpoints["POST /subscriptions"].input
          - validations[priority=5]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: |
          frequency_weeks has source input and no default, so omitting it is a 400
          ERR_INVALID_REQUEST from validations[priority=5] - it must not silently fall back to the
          first entry of Plan.allowed_frequency_weeks.
        test_recipe:
          setup:
            - "Clock 2026-01-10; plan CORE, subscriber A and an ACTIVE card exist."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-10T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /plans"
              payload: { code: "CORE", name: "Core Box", monthly_price_cents: 4999, unit_cogs_cents: 2100, margin_floor_pct: 0.4200 }
              as: PlatformAdmin
              captures: { core_plan_id: $.data.id }
            - call: "POST /subscribers"
              payload: { email: "a@dtc.test", acquisition_channel: "ORGANIC" }
              as: PlatformAdmin
              captures: { sub_a_id: $.data.id }
            - call: "POST /payment-methods"
              payload: { subscriber_id: "${sub_a_id}", card_last4: "4242", exp_month: 12, exp_year: 2030, network: "VISA" }
              as: PlatformAdmin
              captures: { pm_a_id: $.data.id }
          trigger:
            - call: "POST /subscriptions"
              payload: { subscriber_id: "${sub_a_id}", plan_id: "${core_plan_id}", payment_method_id: "${pm_a_id}", disclosure_acknowledged: true }
              as: PlatformAdmin
              captures: { err_freq: $.data.error_id }
          assert:
            - "Response status is 400"
            - "error_id == ERR_INVALID_REQUEST"
            - "No Subscription row exists for subscriber_id ${sub_a_id}"
            - "Plan.${core_plan_id}.active_subscription_count == 0"

      - name: enum_and_range_constraints_reject_invalid_enum_and_out_of_range_month
        claim_type: type_constraints
        grounds:
          - entities.Subscriber.fields.acquisition_channel.constraints
          - entities.PaymentMethod.fields.exp_month.constraints
          - validations[priority=5]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: |
          Both declared constraint kinds fail the same way: an acquisition_channel outside the five
          declared members and an exp_month of 13 each yield 400 ERR_INVALID_REQUEST, and no row is
          persisted in either case.
        test_recipe:
          setup:
            - "Clock 2026-01-10; subscriber A exists so the payment-method call has a resolvable parent."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-10T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /subscribers"
              payload: { email: "a@dtc.test", acquisition_channel: "ORGANIC" }
              as: PlatformAdmin
              captures: { sub_a_id: $.data.id }
          trigger:
            - call: "POST /subscribers"
              payload: { email: "b@dtc.test", acquisition_channel: "TIKTOK" }
              as: PlatformAdmin
              captures: { err_channel: $.data.error_id }
            - call: "POST /payment-methods"
              payload: { subscriber_id: "${sub_a_id}", card_last4: "4242", exp_month: 13, exp_year: 2030, network: "VISA" }
              as: PlatformAdmin
              captures: { err_month: $.data.error_id }
          assert:
            - "Both responses have status 400"
            - "Both responses carry error_id == ERR_INVALID_REQUEST"
            - "GET /subscribers list contains exactly one row, id ${sub_a_id}"
            - "No PaymentMethod row exists for subscriber_id ${sub_a_id}"

      - name: committed_price_is_computed_from_plan_and_addons_client_value_input_ignored
        claim_type: computed_fields
        grounds:
          - entities.Subscription.fields.committed_price_cents
          - calculations.committed_price_cents
          - endpoints["POST /subscriptions"].input
        distinguishing_aspect: |
          committed_price_cents has source computed and is absent from the endpoint input, so a
          client-supplied value of 99 is ignored and the server still computes 4999 + 2 * 1299 =
          7597 from the plan and the addon quantities.
        test_recipe:
          setup:
            - "Clock 2026-01-10; plan CORE with the MUG addon; subscriber A with an ACTIVE card."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-10T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /plans"
              payload: { code: "CORE", name: "Core Box", monthly_price_cents: 4999, unit_cogs_cents: 2100, margin_floor_pct: 0.4200, addon_catalog: [{ code: "MUG", unit_price_cents: 1299, unit_cogs_cents: 520 }] }
              as: PlatformAdmin
              captures: { core_plan_id: $.data.id }
            - call: "POST /subscribers"
              payload: { email: "a@dtc.test", acquisition_channel: "ORGANIC" }
              as: PlatformAdmin
              captures: { sub_a_id: $.data.id }
            - call: "POST /payment-methods"
              payload: { subscriber_id: "${sub_a_id}", card_last4: "4242", exp_month: 12, exp_year: 2030, network: "VISA" }
              as: PlatformAdmin
              captures: { pm_a_id: $.data.id }
          trigger:
            - call: "POST /subscriptions"
              payload: { subscriber_id: "${sub_a_id}", plan_id: "${core_plan_id}", payment_method_id: "${pm_a_id}", frequency_weeks: 4, disclosure_acknowledged: true, addons: [{ code: "MUG", qty: 2 }], committed_price_cents: 99 }
              as: PlatformAdmin
              captures: { s_a_id: $.data.id }
          assert:
            - "Response status is 201"
            - "Subscription.${s_a_id}.committed_price_cents == 7597"
            - "Subscription.${s_a_id}.baseline_price_cents == 7597"
            - "Subscription.${s_a_id}.addons == [{ code: MUG, qty: 2, unit_price_cents: 1299, unit_cogs_cents: 520 }]"

      - name: signup_invoice_system_fields_are_server_minted
        claim_type: system_fields
        grounds:
          - entities.Invoice.fields.status
          - entities.Invoice.fields.cycle_index
          - entities.Invoice.fields.is_renewal
          - entities.Invoice.fields.due_at
          - entities.Invoice.fields.proration_factor
          - endpoints["POST /subscriptions"].side_effects
        distinguishing_aspect: |
          The signup invoice has no create endpoint at all - it exists only as a side effect - so
          every one of its fields is server-minted: cycle_index 0, is_renewal false, status OPEN,
          due_at equal to the signup instant, attempt_count 0 and proration_factor exactly 1.0000.
        test_recipe:
          setup:
            - "Clock 2026-01-10; CORE subscription for subscriber A with one MUG addon."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-10T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /plans"
              payload: { code: "CORE", name: "Core Box", monthly_price_cents: 4999, unit_cogs_cents: 2100, margin_floor_pct: 0.4200, addon_catalog: [{ code: "MUG", unit_price_cents: 1299, unit_cogs_cents: 520 }] }
              as: PlatformAdmin
              captures: { core_plan_id: $.data.id }
            - call: "POST /subscribers"
              payload: { email: "a@dtc.test", acquisition_channel: "ORGANIC" }
              as: PlatformAdmin
              captures: { sub_a_id: $.data.id }
            - call: "POST /payment-methods"
              payload: { subscriber_id: "${sub_a_id}", card_last4: "4242", exp_month: 12, exp_year: 2030, network: "VISA" }
              as: PlatformAdmin
              captures: { pm_a_id: $.data.id }
            - call: "POST /subscriptions"
              payload: { subscriber_id: "${sub_a_id}", plan_id: "${core_plan_id}", payment_method_id: "${pm_a_id}", frequency_weeks: 4, disclosure_acknowledged: true, addons: [{ code: "MUG", qty: 1 }] }
              as: PlatformAdmin
              captures: { s_a_id: $.data.id }
          trigger:
            - call: "GET /invoices"
              payload: { subscription_id: "${s_a_id}" }
              as: BillingOperator
              captures: { inv0_id: "$.data[0].id" }
          assert:
            - "Response status is 200 and meta.total_count == 1"
            - "Invoice.${inv0_id}.cycle_index == 0"
            - "Invoice.${inv0_id}.is_renewal == false"
            - "Invoice.${inv0_id}.status == OPEN"
            - "Invoice.${inv0_id}.due_at == 2026-01-10T00:00:00Z"
            - "Invoice.${inv0_id}.paid_at == null"
            - "Invoice.${inv0_id}.attempt_count == 0"
            - "Invoice.${inv0_id}.proration_factor == 1.0000"
            - "Invoice.${inv0_id}.payment_method_id == ${pm_a_id}"

      - name: dunning_attempt_is_immutable_with_no_version_and_no_write_endpoint
        claim_type: immutability
        grounds:
          - entities.DunningAttempt.common_fields
          - endpoints["GET /dunning-attempts/{id}"]
          - endpoints["POST /_payments/simulate"]
        distinguishing_aspect: |
          DunningAttempt declares common_fields false, so the read body carries id and created_at
          but no version and no updated_at, and §1.5 exposes no PATCH or PUT for it - the only way
          its outcome ever changes is the settlement side effect of POST /_payments/simulate.
        test_recipe:
          setup:
            - "Clock 2026-01-10; CORE subscription for subscriber A; the signup invoice has one PENDING attempt."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-10T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /plans"
              payload: { code: "CORE", name: "Core Box", monthly_price_cents: 4999, unit_cogs_cents: 2100, margin_floor_pct: 0.4200 }
              as: PlatformAdmin
              captures: { core_plan_id: $.data.id }
            - call: "POST /subscribers"
              payload: { email: "a@dtc.test", acquisition_channel: "ORGANIC" }
              as: PlatformAdmin
              captures: { sub_a_id: $.data.id }
            - call: "POST /payment-methods"
              payload: { subscriber_id: "${sub_a_id}", card_last4: "4242", exp_month: 12, exp_year: 2030, network: "VISA" }
              as: PlatformAdmin
              captures: { pm_a_id: $.data.id }
            - call: "POST /subscriptions"
              payload: { subscriber_id: "${sub_a_id}", plan_id: "${core_plan_id}", payment_method_id: "${pm_a_id}", frequency_weeks: 4, disclosure_acknowledged: true }
              as: PlatformAdmin
              captures: { s_a_id: $.data.id }
            - call: "GET /invoices"
              payload: { subscription_id: "${s_a_id}" }
              as: BillingOperator
              captures: { inv0_id: "$.data[0].id" }
            - call: "POST /invoices/${inv0_id}/dunning-attempts"
              payload: {}
              as: BillingOperator
              captures: { att1_id: $.data.id }
          trigger:
            - call: "GET /dunning-attempts/${att1_id}"
              payload: {}
              as: BillingOperator
          assert:
            - "Response status is 200"
            - "DunningAttempt.${att1_id} body contains id and created_at and carries no version field and no updated_at field"
            - "DunningAttempt.${att1_id}.attempt_number == 1"
            - "DunningAttempt.${att1_id}.previous_attempt_id == null"
            - "DunningAttempt.${att1_id}.outcome == PENDING"
            - "DunningAttempt.${att1_id}.attempted_at == null"
            - "DunningAttempt.${att1_id}.backoff_days_applied == 0"
            - "DunningAttempt.${att1_id}.grace_clamped == false"
            - "DunningAttempt.${att1_id}.is_final == false"

      - name: cohort_snapshot_of_empty_cohort_is_an_immutable_zero_artifact
        claim_type: immutability
        grounds:
          - entities.RetentionCohortSnapshot.common_fields
          - calculations.cohort_retention_metrics
          - endpoints["POST /retention-cohort-snapshots"]
        distinguishing_aspect: |
          A snapshot over a month with no members is still persisted as an immutable artifact with
          member_count 0, retention_rate exactly 0.0000 and mean_ltv_cents 0 (the divide-by-zero
          guard), carrying no version field and exposing no update or delete endpoint.
        test_recipe:
          setup:
            - "Empty database with the clock pinned to 2026-02-01T00:00:00Z; no subscriber has ever subscribed."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /retention-cohort-snapshots"
              payload: { cohort_month: "2026-01", ltv_variant: "REALIZED" }
              as: RetentionSpecialist
              captures: { snap_empty_id: $.data.id }
          assert:
            - "Response status is 201"
            - "RetentionCohortSnapshot.${snap_empty_id}.member_count == 0"
            - "RetentionCohortSnapshot.${snap_empty_id}.retained_count == 0"
            - "RetentionCohortSnapshot.${snap_empty_id}.churned_voluntary_count == 0"
            - "RetentionCohortSnapshot.${snap_empty_id}.churned_involuntary_count == 0"
            - "RetentionCohortSnapshot.${snap_empty_id}.retention_rate == 0.0000"
            - "RetentionCohortSnapshot.${snap_empty_id}.mean_ltv_cents == 0"
            - "RetentionCohortSnapshot.${snap_empty_id}.computed_at == 2026-02-01T00:00:00Z"
            - "RetentionCohortSnapshot.${snap_empty_id} body carries no version field"

      - name: subscription_create_with_unknown_plan_id_returns_not_found
        claim_type: foreign_key_validated
        grounds:
          - validations[priority=4]
          - errors[ERR_PLAN_NOT_FOUND]
          - complexity_profile.entity_topology
        distinguishing_aspect: |
          The topology is flat, so every body foreign key is validated on its own: a resolvable
          subscriber and card plus an unknown plan_id yields ERR_PLAN_NOT_FOUND (404) at
          validations[priority=4], before any pricing or disclosure rule runs.
        test_recipe:
          setup:
            - "Clock 2026-01-10; subscriber A with an ACTIVE card; no plan carries the cited id."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-10T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /subscribers"
              payload: { email: "a@dtc.test", acquisition_channel: "ORGANIC" }
              as: PlatformAdmin
              captures: { sub_a_id: $.data.id }
            - call: "POST /payment-methods"
              payload: { subscriber_id: "${sub_a_id}", card_last4: "4242", exp_month: 12, exp_year: 2030, network: "VISA" }
              as: PlatformAdmin
              captures: { pm_a_id: $.data.id }
          trigger:
            - call: "POST /subscriptions"
              payload: { subscriber_id: "${sub_a_id}", plan_id: "22222222-2222-4222-8222-222222222222", payment_method_id: "${pm_a_id}", frequency_weeks: 4, disclosure_acknowledged: false }
              as: PlatformAdmin
              captures: { err_plan: $.data.error_id }
          assert:
            - "Response status is 404"
            - "error_id == ERR_PLAN_NOT_FOUND"
            - "The 404 is returned even though disclosure_acknowledged is false, proving priority 4 outranks priority 25"

      - name: payment_method_create_with_unknown_subscriber_returns_not_found
        claim_type: parent_relationships
        grounds:
          - entities.PaymentMethod.fields.subscriber_id
          - validations[priority=4]
          - errors[ERR_SUBSCRIBER_NOT_FOUND]
        distinguishing_aspect: |
          A PaymentMethod is only meaningful under an existing Subscriber, so an unresolvable
          subscriber_id is ERR_SUBSCRIBER_NOT_FOUND (404) and no orphan card row is created.
        test_recipe:
          setup:
            - "Empty database with the clock pinned to 2026-01-10T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-10T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /payment-methods"
              payload: { subscriber_id: "33333333-3333-4333-8333-333333333333", card_last4: "4242", exp_month: 12, exp_year: 2030, network: "VISA" }
              as: PlatformAdmin
              captures: { err_subscriber: $.data.error_id }
          assert:
            - "Response status is 404"
            - "error_id == ERR_SUBSCRIBER_NOT_FOUND"
            - "GET /payment-methods returns meta.total_count == 0"

  # ===========================================================================
  - section: state_machines
    instances:

      - name: cancellation_session_starts_in_started_with_step_count_one
        claim_type: initial_state
        grounds:
          - state_machines.CancellationSession.initial_state
          - entities.CancellationSession.fields.step_count
          - endpoints["POST /cancellation-sessions"].side_effects
        distinguishing_aspect: |
          The create call is itself the first recorded step of the simple-cancellation budget:
          state STARTED, step_count 1 (not 0), offers_presented_count 0, reason_code null and
          presented_by_user_id null.
        test_recipe:
          setup:
            - "Clock 2026-01-10; CORE subscription for subscriber A in lifecycle ACTIVE."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-10T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /plans"
              payload: { code: "CORE", name: "Core Box", monthly_price_cents: 4999, unit_cogs_cents: 2100, margin_floor_pct: 0.4200 }
              as: PlatformAdmin
              captures: { core_plan_id: $.data.id }
            - call: "POST /subscribers"
              payload: { email: "a@dtc.test", acquisition_channel: "ORGANIC" }
              as: PlatformAdmin
              captures: { sub_a_id: $.data.id }
            - call: "POST /payment-methods"
              payload: { subscriber_id: "${sub_a_id}", card_last4: "4242", exp_month: 12, exp_year: 2030, network: "VISA" }
              as: PlatformAdmin
              captures: { pm_a_id: $.data.id }
            - call: "POST /subscriptions"
              payload: { subscriber_id: "${sub_a_id}", plan_id: "${core_plan_id}", payment_method_id: "${pm_a_id}", frequency_weeks: 4, disclosure_acknowledged: true }
              as: PlatformAdmin
              captures: { s_a_id: $.data.id }
          trigger:
            - call: "POST /cancellation-sessions"
              payload: { subscription_id: "${s_a_id}", entry_channel: "WEB_SELF_SERVE" }
              as: Subscriber
              as_user_id: "${sub_a_id}"
              captures: { sess_id: $.data.id }
          assert:
            - "Response status is 201"
            - "CancellationSession.${sess_id}.state == STARTED"
            - "CancellationSession.${sess_id}.step_count == 1"
            - "CancellationSession.${sess_id}.offers_presented_count == 0"
            - "CancellationSession.${sess_id}.reason_code == null"
            - "CancellationSession.${sess_id}.presented_by_user_id == null"
            - "CancellationSession.${sess_id}.started_at == 2026-01-10T00:00:00Z"
            - "CancellationSession.${sess_id}.completed_at == null"
            - "Subscription.${s_a_id}.lifecycle_state == ACTIVE"

      - name: session_complete_before_reason_capture_returns_reason_not_captured
        claim_type: precondition_enforcement
        grounds:
          - validations[priority=14]
          - errors[ERR_REASON_NOT_CAPTURED]
          - state_machines.CancellationSession.transitions.REASON_CAPTURED_to_COMPLETED_CANCELLED
        distinguishing_aspect: |
          Completion is exempt from the step budget but not from the reason gate: with reason_code
          still null the call is 409 ERR_REASON_NOT_CAPTURED, the session stays STARTED with
          step_count 1, and the subscription is not driven to PENDING_CANCEL.
        test_recipe:
          setup:
            - "Clock 2026-01-10; CORE subscription for subscriber A; one STARTED session with no reason captured."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-10T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /plans"
              payload: { code: "CORE", name: "Core Box", monthly_price_cents: 4999, unit_cogs_cents: 2100, margin_floor_pct: 0.4200 }
              as: PlatformAdmin
              captures: { core_plan_id: $.data.id }
            - call: "POST /subscribers"
              payload: { email: "a@dtc.test", acquisition_channel: "ORGANIC" }
              as: PlatformAdmin
              captures: { sub_a_id: $.data.id }
            - call: "POST /payment-methods"
              payload: { subscriber_id: "${sub_a_id}", card_last4: "4242", exp_month: 12, exp_year: 2030, network: "VISA" }
              as: PlatformAdmin
              captures: { pm_a_id: $.data.id }
            - call: "POST /subscriptions"
              payload: { subscriber_id: "${sub_a_id}", plan_id: "${core_plan_id}", payment_method_id: "${pm_a_id}", frequency_weeks: 4, disclosure_acknowledged: true }
              as: PlatformAdmin
              captures: { s_a_id: $.data.id }
            - call: "POST /cancellation-sessions"
              payload: { subscription_id: "${s_a_id}", entry_channel: "WEB_SELF_SERVE" }
              as: Subscriber
              as_user_id: "${sub_a_id}"
              captures: { sess_id: $.data.id }
          trigger:
            - call: "POST /cancellation-sessions/${sess_id}/complete"
              payload: { confirm: true }
              as: Subscriber
              as_user_id: "${sub_a_id}"
              captures: { err_reason: $.data.error_id }
          assert:
            - "Response status is 409"
            - "error_id == ERR_REASON_NOT_CAPTURED"
            - "CancellationSession.${sess_id}.state == STARTED"
            - "CancellationSession.${sess_id}.step_count == 1"
            - "CancellationSession.${sess_id}.completed_at == null"
            - "Subscription.${s_a_id}.lifecycle_state == ACTIVE"
            - "Subscription.${s_a_id}.cancel_effective_at == null"

      - name: reason_revision_after_completion_returns_session_already_terminal
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.CancellationSession.terminal_states
          - validations[priority=13]
          - errors[ERR_SESSION_ALREADY_TERMINAL]
        distinguishing_aspect: |
          COMPLETED_CANCELLED is terminal, so a further reason revision is 409
          ERR_SESSION_ALREADY_TERMINAL and the stored reason_code stays PRICE - the lockdown is
          checked at priority 13, ahead of the step budget at priority 24.
        test_recipe:
          setup:
            - "Clock 2026-01-10; CORE subscription for subscriber A; a session captured reason PRICE and then completed."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-10T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /plans"
              payload: { code: "CORE", name: "Core Box", monthly_price_cents: 4999, unit_cogs_cents: 2100, margin_floor_pct: 0.4200 }
              as: PlatformAdmin
              captures: { core_plan_id: $.data.id }
            - call: "POST /subscribers"
              payload: { email: "a@dtc.test", acquisition_channel: "ORGANIC" }
              as: PlatformAdmin
              captures: { sub_a_id: $.data.id }
            - call: "POST /payment-methods"
              payload: { subscriber_id: "${sub_a_id}", card_last4: "4242", exp_month: 12, exp_year: 2030, network: "VISA" }
              as: PlatformAdmin
              captures: { pm_a_id: $.data.id }
            - call: "POST /subscriptions"
              payload: { subscriber_id: "${sub_a_id}", plan_id: "${core_plan_id}", payment_method_id: "${pm_a_id}", frequency_weeks: 4, disclosure_acknowledged: true }
              as: PlatformAdmin
              captures: { s_a_id: $.data.id }
            - call: "POST /cancellation-sessions"
              payload: { subscription_id: "${s_a_id}", entry_channel: "WEB_SELF_SERVE" }
              as: Subscriber
              as_user_id: "${sub_a_id}"
              captures: { sess_id: $.data.id }
            - call: "POST /cancellation-sessions/${sess_id}/reason"
              payload: { reason_code: "PRICE" }
              as: Subscriber
              as_user_id: "${sub_a_id}"
            - call: "POST /cancellation-sessions/${sess_id}/complete"
              payload: { confirm: true }
              as: Subscriber
              as_user_id: "${sub_a_id}"
          trigger:
            - call: "POST /cancellation-sessions/${sess_id}/reason"
              payload: { reason_code: "OTHER", reason_detail: "changed my mind" }
