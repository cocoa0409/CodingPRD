            - call: "POST /night-audit/outlet-tickets"
              payload: { outlet_id: "${grill_id}", business_date_id: "${bd1_id}", ticket_number: "T-0500", gross_amount: 500.00, settlement_type: "CASH", opened_at: "2026-08-01T19:00:00.000Z" }
              as: OutletManager
