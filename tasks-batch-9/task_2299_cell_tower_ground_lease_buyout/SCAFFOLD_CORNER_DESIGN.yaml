  - section: endpoints
    instances:
      - name: computed_read_settlement_projection_matches_the_closed_deal_ledger
        claim_type: computed_read
        grounds:
          - endpoints[GET /lease-buyouts/deals/{id}/settlement]
          - calculations.deal_settlement_statement
          - entities.Deal.fields.escrow_funded_cents
        distinguishing_aspect: |
          The settlement endpoint is a pure projection with no state of its own: every one of its eleven
          fields equals the corresponding stored Deal field on a closed deal — gross 36000000, 150 bps,
          fee 540000, holdback 0, net 36000000, total 36540000 — and the escrow triple reconciles as
          36540000 funded == 36540000 disbursed + 0 held back + 0 refunded, so the read cannot be satisfied
          by recomputing from stale inputs.
        test_recipe:
          setup:
            - "A deal closed at gross 36000000 cents with no disputes, so holdback_cents is 0."
            - "Escrow was funded at the full 36540000 commitment and fully disbursed at close."
          setup_api_calls:
            - { call: "POST /lease-buyouts/portfolios", payload: { name: "Northeast Tower Aggregation", program_code: "NE-AGG-01", total_capital_cents: 50000000 }, as: PlatformAdmin, captures: { pf_id: $.data.id } }
