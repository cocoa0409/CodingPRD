              as: OfficeClerk
              captures: { mem: "$.data.id" }
            - { call: "POST /api/members/${mem}/payments", payload: { amount_cents: 1000 }, as: Member, as_user_id: "${mem}" }
            - call: "GET /api/members/${mem}"
              as: SecretaryTreasurer
              captures: { c_before: "$.data.credit_balance_cents", a_before: "$.data.arrears_cents" }
          trigger:
            - { call: "POST /api/assessment-runs", payload: { local_id: "${loc}", period: "2026-08" }, as: SecretaryTreasurer }
            - call: "GET /api/members/${mem}"
              as: SecretaryTreasurer
              captures: { c_after: "$.data.credit_balance_cents", a_after: "$.data.arrears_cents" }
          assert:
            - "before: ${c_before} == 1000 and ${a_before} == 0 (overpayment parked as credit)"
            - "after the 5000 charge: ${c_after} == 0 and ${a_after} == 4000 (credit drained before arrears grow)"

      - name: expulsion_at_suspension_cap
        claim_type: rate_threshold_triggers
        grounds: [state_machines.Member.DELINQUENT_to_EXPELLED, entities.Local.fields.max_suspensions]
        distinguishing_aspect: "With max_suspensions 1, the FIRST notice expiry expels instead of suspending — the count threshold redirects the transition target."
        test_recipe:
          setup: ["FLAT local with max_suspensions 1; member M DELINQUENT with SENT notice (runs 2026-05/06, sweep 08-01, sent 08-01); clock 2026-08-12"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: ParentBodyAdmin }
            - call: "POST /api/locals"
              payload: { name: "Local 200", dues_method: "FLAT_RATE", default_dues_percent_bp: 200, default_flat_dues_cents: 5000, per_capita_rate_cents: 1500, delinquency_threshold_cents: 10000, grace_periods: 2, notice_cure_days: 10, reinstatement_base_fee_cents: 2500, max_suspensions: 1, expel_after_months: 12 }
              as: ParentBodyAdmin
              captures: { loc: "$.data.id" }
            - call: "POST /api/locals/${loc}/classifications"
              payload: { code: "JOURNEYMAN", min_monthly_dues_cents: 0 }
              as: LocalAdmin
              captures: { cls: "$.data.id" }
            - call: "POST /api/members"
              payload: { local_id: "${loc}", classification_id: "${cls}", full_name: "Cap Colin", member_number: "M-001", joined_at: "2026-01-15" }
              as: OfficeClerk
              captures: { mem: "$.data.id" }
            - { call: "POST /api/assessment-runs", payload: { local_id: "${loc}", period: "2026-05" }, as: SecretaryTreasurer }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: ParentBodyAdmin }
            - { call: "POST /api/assessment-runs", payload: { local_id: "${loc}", period: "2026-06" }, as: SecretaryTreasurer }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: ParentBodyAdmin }
            - { call: "POST /api/system/sweeps/delinquency", payload: { local_id: "${loc}" }, as: LocalAdmin }
            - call: "GET /api/members/${mem}/notices"
              as: OfficeClerk
              captures: { nid: "$.data[0].id" }
            - { call: "POST /api/members/${mem}/notices/${nid}/send", payload: {}, as: OfficeClerk }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-12T00:00:00Z" }, as: ParentBodyAdmin }
          trigger:
            - { call: "POST /api/system/sweeps/delinquency", payload: { local_id: "${loc}" }, as: LocalAdmin }
            - call: "GET /api/members/${mem}"
              as: SecretaryTreasurer
              captures: { m_status: "$.data.status", m_susp: "$.data.suspension_count" }
          assert:
            - "${m_status} == EXPELLED — suspension_count 0 + 1 >= max_suspensions 1 redirects DELINQUENT -> EXPELLED"
            - "${m_susp} == 0 (the member was never actually SUSPENDED)"

      - name: expulsion_after_expel_months_boundary
        claim_type: rate_threshold_triggers
        grounds: [state_machines.Member.SUSPENDED_to_EXPELLED, entities.Local.fields.expel_after_months]
        distinguishing_aspect: "A member suspended 2026-08-12 with expel_after_months 12: at 2027-08-11 a sweep leaves them SUSPENDED; at exactly 2027-08-12 (inclusive month boundary) the sweep expels."
        test_recipe:
          setup: ["FLAT local (cure 10, expel_after_months 12); member M SUSPENDED at 2026-08-12 (suspension_count 1)"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: ParentBodyAdmin }
            - call: "POST /api/locals"
              payload: { name: "Local 200", dues_method: "FLAT_RATE", default_dues_percent_bp: 200, default_flat_dues_cents: 5000, per_capita_rate_cents: 1500, delinquency_threshold_cents: 10000, grace_periods: 2, notice_cure_days: 10, reinstatement_base_fee_cents: 2500, max_suspensions: 3, expel_after_months: 12 }
              as: ParentBodyAdmin
              captures: { loc: "$.data.id" }
            - call: "POST /api/locals/${loc}/classifications"
              payload: { code: "JOURNEYMAN", min_monthly_dues_cents: 0 }
              as: LocalAdmin
              captures: { cls: "$.data.id" }
            - call: "POST /api/members"
              payload: { local_id: "${loc}", classification_id: "${cls}", full_name: "Long Larry", member_number: "M-001", joined_at: "2026-01-15" }
              as: OfficeClerk
              captures: { mem: "$.data.id" }
            - { call: "POST /api/assessment-runs", payload: { local_id: "${loc}", period: "2026-05" }, as: SecretaryTreasurer }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: ParentBodyAdmin }
            - { call: "POST /api/assessment-runs", payload: { local_id: "${loc}", period: "2026-06" }, as: SecretaryTreasurer }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: ParentBodyAdmin }
            - { call: "POST /api/system/sweeps/delinquency", payload: { local_id: "${loc}" }, as: LocalAdmin }
            - call: "GET /api/members/${mem}/notices"
              as: OfficeClerk
              captures: { nid: "$.data[0].id" }
            - { call: "POST /api/members/${mem}/notices/${nid}/send", payload: {}, as: OfficeClerk }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-12T00:00:00Z" }, as: ParentBodyAdmin }
            - { call: "POST /api/system/sweeps/delinquency", payload: { local_id: "${loc}" }, as: LocalAdmin }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2027-08-11T00:00:00Z" }, as: ParentBodyAdmin }
            - { call: "POST /api/system/sweeps/delinquency", payload: { local_id: "${loc}" }, as: LocalAdmin }
            - call: "GET /api/members/${mem}"
              as: SecretaryTreasurer
              captures: { st_early: "$.data.status" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2027-08-12T00:00:00Z" }, as: ParentBodyAdmin }
          trigger:
            - { call: "POST /api/system/sweeps/delinquency", payload: { local_id: "${loc}" }, as: LocalAdmin }
            - call: "GET /api/members/${mem}"
              as: SecretaryTreasurer
              captures: { st_final: "$.data.status" }
          assert:
            - "one day before the boundary (2027-08-11): ${st_early} == SUSPENDED"
            - "at exactly suspended_since + 12 months (2027-08-12, inclusive): ${st_final} == EXPELLED"

  # ===========================================================================
  # Section: consistency model (immediate)
  # ===========================================================================
  - section: consistency_model
    instances:
      - name: immediate_read_after_write_consistency
        claim_type: immediate_consistency
        grounds: [complexity_profile.consistency_model, entities.Member.fields.arrears_cents]
        distinguishing_aspect: "Immediate consistency: the payment's effect on arrears is visible in the very next GET within the same logical instant — no lag, no stale reads."
        test_recipe:
          setup: ["FLAT local; member M with one charge (run 2026-08 -> arrears 5000)"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: ParentBodyAdmin }
            - call: "POST /api/locals"
              payload: { name: "Local 200", dues_method: "FLAT_RATE", default_dues_percent_bp: 200, default_flat_dues_cents: 5000, per_capita_rate_cents: 1500, delinquency_threshold_cents: 10000, grace_periods: 2, notice_cure_days: 10, reinstatement_base_fee_cents: 2500, max_suspensions: 3, expel_after_months: 12 }
              as: ParentBodyAdmin
              captures: { loc: "$.data.id" }
            - call: "POST /api/locals/${loc}/classifications"
              payload: { code: "JOURNEYMAN", min_monthly_dues_cents: 0 }
              as: LocalAdmin
              captures: { cls: "$.data.id" }
            - call: "POST /api/members"
              payload: { local_id: "${loc}", classification_id: "${cls}", full_name: "Sync Sandy", member_number: "M-001", joined_at: "2026-01-15" }
              as: OfficeClerk
              captures: { mem: "$.data.id" }
            - { call: "POST /api/assessment-runs", payload: { local_id: "${loc}", period: "2026-08" }, as: SecretaryTreasurer }
          trigger:
            - { call: "POST /api/members/${mem}/payments", payload: { amount_cents: 2000 }, as: Member, as_user_id: "${mem}" }
            - call: "GET /api/members/${mem}"
              as: SecretaryTreasurer
              captures: { arrears: "$.data.arrears_cents" }
          assert:
            - "${arrears} == 3000 immediately (5000 - 2000) in the read that follows the write"

  # ===========================================================================
  # Corners already covered by §1.8 difficulty instances (stubs)
  # ===========================================================================
  - section: state_machines
    instances:
      - name: remittance_reconcile_dispute_outcome
        claim_type: side_effect_execution
        grounds: [state_machines.CheckoffRemittance.RECEIVED_to_RECEIVED]
        excluded_because:
          difficulty_instance: remittance_parallel_dims_dispute
          rationale: "Variance-driven DISPUTED flip, line_status, and expected_total_cents are asserted there."
      - name: notice_auto_cure_on_payment
        claim_type: side_effect_execution
        grounds: [state_machines.DelinquencyNotice.SENT_to_CURED]
        excluded_because:
          difficulty_instance: remittance_post_cure_cascade
          rationale: "The SENT -> CURED cascade is asserted end-to-end as hop 4 of the remittance-post cascade."
      - name: delinquency_threshold_boundary_sweep
        claim_type: precondition_enforcement
        grounds: [calculations.delinquency_evaluation]
        excluded_because:
          difficulty_instance: delinquency_threshold_inclusive_boundary
          rationale: "The >= boundary at exactly 10000 vs 9999 is asserted there."
      - name: reinstatement_amount_exact_match
        claim_type: precondition_enforcement
        grounds: [calculations.reinstatement_due]
        excluded_because:
          difficulty_instance: reinstatement_exact_amount_boundary
          rationale: "17499 rejected / 17500 accepted is asserted there."
      - name: occ_stale_version_negative_paths
        claim_type: occ_stale_version
        grounds: ["concurrency_rules[transfer-create-stale-member]", "concurrency_rules[percapita-report-create-stale-local]"]
        excluded_because:
          difficulty_instance: transfer_initiate_requires_good_standing
          rationale: "That instance proves the fresh-version path passes priority 5; the explicit 412 stale paths for both OCC rules live as first-class corner instances occ_transfer_stale_member_version_rejected and occ_percapita_stale_local_version_rejected in this file."
      - name: election_window_overlap_rejection
        claim_type: temporal_validation
        grounds: ["errors[ERR_ELECTION_WINDOW_OVERLAP]"]
        excluded_because:
          difficulty_instance: election_closed_interval_touch_overlap
          rationale: "Touching-window rejection plus the one-second-gap acceptance are asserted there."
