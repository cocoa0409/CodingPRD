  - rule_id: compensating_invariant
    instances:
      - name: cancel_refund_money_conservation
        grounds:
          - calculations.order_amount_paid
          - state_machines.MonumentOrder.production_status
          - entities.MonumentOrder.fields.amount_paid_cents
          - entities.Payment.fields.signed_amount_cents
        distinguishing_aspect: |
          Conserved quantity = money. Cancelling an order with a paid deposit creates a compensating
          REFUND of -33880 that exactly offsets the +33880 deposit, so amount_paid_cents returns to 0
          and equals the signed payment-ledger sum with no drift.
        test_recipe:
          setup:
            - "A DRAFTING order with a paid deposit (amount_paid 33880, payment_status DEPOSIT_PAID)."
          setup_api_calls:
            - call: "POST /memorials/cemeteries"
              payload: { name: "Restful Pines", allowed_materials: ["GRANITE"], max_height_cm: 90, max_width_cm: 75, max_base_width_cm: 80, requires_permit: true, permit_fee_cents: 12000 }
              as: Admin
              captures: { cem: $.data.id }
            - call: "POST /memorials/customers"
              payload: { full_name: "Jane Doe", email: "jane@example.com" }
              as: Admin
              captures: { cust: $.data.id }
            - call: "POST /memorials/orders"
              payload: { customer_id: "${cust}", cemetery_id: "${cem}", subject_type: "HUMAN", material: "GRANITE", height_cm: 60, width_cm: 40, base_width_cm: 50, estimated_line_char_counts: [20, 20] }
              as: Customer
              as_user_id: "${cust}"
              captures: { ord: $.data.id }
            - call: "POST /memorials/payments"
              payload: { order_id: "${ord}", payment_type: "DEPOSIT", amount_cents: 33880 }
              as: Customer
              as_user_id: "${cust}"
          trigger:
            - call: "POST /memorials/orders/${ord}/cancel"
              payload: {}
              as: Customer
              as_user_id: "${cust}"
          assert:
            - "MonumentOrder.${ord}.amount_paid_cents == 0"
            - "MonumentOrder.${ord}.payment_status == REFUNDED"
            - "MonumentOrder.${ord}.production_status == CANCELLED"
            - "Sum of signed_amount_cents over the order's Payments == 0 (deposit +33880 and REFUND -33880)"

      - name: cancel_release_workshop_capacity_conservation
        grounds:
          - calculations.workshop_booked_minutes
          - state_machines.FabricationJob.SCHEDULED_to_CANCELLED
          - entities.Workshop.fields.booked_minutes
          - entities.FabricationJob.fields.duration_minutes
        distinguishing_aspect: |
          Conserved quantity = workshop time/capacity (different from money). Cancelling the order
          cascades to CANCEL the SCHEDULED FabricationJob, which releases exactly its 180 booked
          minutes, returning Workshop.booked_minutes to 0 with no drift.
        test_recipe:
          setup:
            - "An order at IN_FABRICATION with a SCHEDULED FabricationJob booking the workshop for [2026-03-05T09:00, 12:00) (180 min)."
          setup_api_calls:
            - call: "POST /memorials/cemeteries"
              payload: { name: "Restful Pines", allowed_materials: ["GRANITE"], max_height_cm: 90, max_width_cm: 75, max_base_width_cm: 80, requires_permit: false, permit_fee_cents: 0 }
              as: Admin
              captures: { cem: $.data.id }
            - call: "POST /memorials/customers"
              payload: { full_name: "Jane Doe", email: "jane@example.com" }
              as: Admin
              captures: { cust: $.data.id }
            - call: "POST /memorials/workshops"
              payload: { name: "Shop A" }
              as: Admin
              captures: { ws: $.data.id }
            - call: "POST /memorials/orders"
              payload: { customer_id: "${cust}", cemetery_id: "${cem}", subject_type: "HUMAN", material: "GRANITE", height_cm: 60, width_cm: 40, base_width_cm: 50, estimated_line_char_counts: [20, 20] }
              as: Customer
              as_user_id: "${cust}"
              captures: { ord: $.data.id, ov: $.data.version }
            - call: "POST /memorials/design-proofs"
              payload: { order_id: "${ord}", expected_order_version: "${ov}", engraving_text: "In Loving Memory", line_char_counts: [21, 31] }
              as: Designer
              captures: { proof: $.data.id }
            - call: "POST /memorials/design-proofs/${proof}/submit"
              payload: {}
              as: Designer
            - call: "POST /memorials/payments"
              payload: { order_id: "${ord}", payment_type: "DEPOSIT", amount_cents: 33880 }
              as: Customer
              as_user_id: "${cust}"
            - call: "POST /memorials/design-proofs/${proof}/approve"
              payload: {}
              as: Customer
              as_user_id: "${cust}"
            - call: "POST /memorials/fabrication-jobs"
              payload: { order_id: "${ord}", workshop_id: "${ws}", scheduled_start: "2026-03-05T09:00:00Z", scheduled_end: "2026-03-05T12:00:00Z" }
              as: ShopManager
              captures: { fab: $.data.id }
          trigger:
            - call: "POST /memorials/orders/${ord}/cancel"
              payload: {}
              as: Customer
              as_user_id: "${cust}"
          assert:
            - "Workshop.${ws}.booked_minutes == 0"
            - "FabricationJob.${fab}.status == CANCELLED"
            - "MonumentOrder.${ord}.production_status == CANCELLED"
