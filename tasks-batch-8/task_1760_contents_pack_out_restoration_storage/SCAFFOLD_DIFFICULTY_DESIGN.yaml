            - "PackBackSchedule.${sch}.status remains REQUESTED"
      - name: placement_gated_on_item_triage
        grounds:
          - validations[priority=7]
          - entities.Item.fields.condition_triage
          - errors[ERR_ITEM_NOT_SALVAGEABLE]
        distinguishing_aspect: |
          Entity pair StoragePlacement -> Item (different pair than schedule->job):
          placement activation requires the ITEM's condition_triage == SALVAGEABLE;
          a PENDING-triage item in a valid vault fails with ERR_ITEM_NOT_SALVAGEABLE.
        test_recipe:
          setup:
            - "Item REGISTERED with condition_triage PENDING (never triaged); valid CLIMATE_CONTROLLED vault with capacity"
          setup_api_calls:
            - { call: "POST /api/pack-out-jobs", payload: { claim_number: "CLM-CE2", property_address: "26 Magnolia Dr", carrier_name: "Acme Mutual", policy_coverage_type: "ACV" }, as: ProjectManager, captures: { job: $.data.id } }
