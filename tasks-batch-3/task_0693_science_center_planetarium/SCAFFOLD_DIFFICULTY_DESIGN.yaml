scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: group_invoice_deposit_vs_final_diverges
        grounds:
          - calculations.group_invoice_total
          - state_machines.GroupBooking.REQUESTED_to_DEPOSIT_PAID
          - state_machines.GroupBooking.DEPOSIT_PAID_to_CONFIRMED
          - entities.GroupBooking.fields.balance_cents
        distinguishing_aspect: "On a GroupBooking, the DEPOSIT variant (estimate from student_count=20/chaperone_count=3) and the FINAL variant (actuals 25/2) yield different cents: deposit_cents=9250 but balance_cents=34500, so 4*deposit (37000) != grand_total(actuals) (43750)."
        test_recipe:
          setup:
            - "A DOME venue capacity 60; an OPEN show with base_price_cents=2000, feature_surcharge_cents=500."
            - "A group booking requested with student_count=20, chaperone_count=3 (deposit computed), deposit paid (seats reserved), then confirmed with actual_student_count=25, actual_chaperone_count=2."
          setup_api_calls:
            - call: "POST /venues"
              payload: { name: "Dome A", venue_type: "DOME", seated_capacity: 60, accessible_seats: 4 }
              as: FacilityAdmin
              captures: { dome_id: $.data.id }
            - call: "POST /shows"
              payload: { venue_id: "${dome_id}", title: "Stars", starts_at: "2026-04-01T10:00:00Z", ends_at: "2026-04-01T11:00:00Z", base_price_cents: 2000, feature_surcharge_cents: 500 }
              as: BoxOfficeOperator
              captures: { show_id: $.data.id }
            - call: "POST /shows/${show_id}/open"
              payload: {}
              as: BoxOfficeOperator
            - call: "POST /group-bookings"
              payload: { show_event_id: "${show_id}", organization_name: "PS 42", student_count: 20, chaperone_count: 3 }
              as: GroupSalesAgent
              captures: { gb_id: $.data.id, gb_deposit: $.data.deposit_cents }
            - call: "POST /group-bookings/${gb_id}/pay-deposit"
              payload: {}
              as: GroupSalesAgent
          trigger:
            - call: "POST /group-bookings/${gb_id}/confirm"
              payload: { actual_student_count: 25, actual_chaperone_count: 2 }
              as: GroupSalesAgent
              captures: { gb_balance: $.data.balance_cents }
          assert:
            - "GroupBooking.${gb_id}.deposit_cents == 9250"
            - "GroupBooking.${gb_id}.balance_cents == 34500"
            - "GroupBooking.${gb_id}.deposit_cents * 4 != GroupBooking.${gb_id}.balance_cents + GroupBooking.${gb_id}.deposit_cents"

      - name: rental_deposit_vs_final_diverges
        grounds:
          - calculations.rental_quote
          - state_machines.RentalEvent.INQUIRY_to_HELD
          - state_machines.RentalEvent.HELD_to_CONFIRMED
          - entities.RentalEvent.fields.total_cents
        distinguishing_aspect: "On a RentalEvent (different entity domain than GroupBooking), DEPOSIT (estimate guest_count=15) gives deposit_cents=14375 while FINAL (actual_guest_count=30) gives total_cents=63000, so 4*deposit (57500) != total_cents (63000)."
        test_recipe:
          setup:
            - "A RENTAL_HALL venue; a rental inquiry with guest_count=15, base_rental_cents=50000 (deposit computed), held, then confirmed with actual_guest_count=30."
          setup_api_calls:
            - call: "POST /venues"
              payload: { name: "Party Hall", venue_type: "RENTAL_HALL", seated_capacity: 80 }
              as: FacilityAdmin
              captures: { hall_id: $.data.id }
            - call: "POST /rentals"
              payload: { venue_id: "${hall_id}", host_name: "Mia", starts_at: "2026-05-02T14:00:00Z", ends_at: "2026-05-02T17:00:00Z", guest_count: 15, base_rental_cents: 50000 }
              as: EventsManager
              captures: { rental_id: $.data.id, rental_deposit: $.data.deposit_cents }
            - call: "POST /rentals/${rental_id}/hold"
              payload: {}
              as: EventsManager
          trigger:
            - call: "POST /rentals/${rental_id}/confirm"
              payload: { actual_guest_count: 30 }
              as: EventsManager
              captures: { rental_total: $.data.total_cents }
          assert:
            - "RentalEvent.${rental_id}.deposit_cents == 14375"
            - "RentalEvent.${rental_id}.total_cents == 63000"
            - "RentalEvent.${rental_id}.deposit_cents * 4 != RentalEvent.${rental_id}.total_cents"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: show_pricing_per_seat_round_then_sum
        grounds:
          - calculations.show_admission_pricing
          - entities.ShowBooking.fields.member_discount_cents
          - state_machines.ShowBooking.HELD_to_CONFIRMED
        distinguishing_aspect: "Mode (b) nested-rounding-order: FAMILY 50% discount is round_half_up PER SEAT (round(2500*0.5)=1250) then *party_size — round-then-sum is pinned, distinct from sum-then-round."
        test_recipe:
          setup:
            - "An ACTIVE FAMILY membership; a DOME show base=2000 surcharge=500 (per_seat=2500); a 3-seat member hold."
          setup_api_calls:
            - call: "POST /memberships"
              payload: { primary_member_name: "Fam", tier: "FAMILY", home_zip: "90210", party_size: 4 }
              as: MembershipClerk
              captures: { fam_id: $.data.id }
            - call: "POST /memberships/${fam_id}/activate"
              payload: { dues_cents: 12000 }
              as: MembershipClerk
            - call: "POST /venues"
              payload: { name: "Dome B", venue_type: "DOME", seated_capacity: 60 }
              as: FacilityAdmin
              captures: { dome_id: $.data.id }
            - call: "POST /shows"
              payload: { venue_id: "${dome_id}", title: "Laser", starts_at: "2026-04-03T10:00:00Z", ends_at: "2026-04-03T11:00:00Z", base_price_cents: 2000, feature_surcharge_cents: 500 }
              as: BoxOfficeOperator
              captures: { show_id: $.data.id, show_v: $.data.version }
            - call: "POST /shows/${show_id}/open"
              payload: {}
              as: BoxOfficeOperator
              captures: { show_v2: $.data.version }
          trigger:
            - call: "POST /show-bookings"
              payload: { show_event_id: "${show_id}", membership_id: "${fam_id}", party_size: 3, expected_show_version: "${show_v2}" }
              as: BoxOfficeOperator
              captures: { booking_id: $.data.id }
          assert:
            - "ShowBooking.${booking_id}.gross_price_cents == 7500"
            - "ShowBooking.${booking_id}.member_discount_cents == 3750"
            - "ShowBooking.${booking_id}.net_price_cents == 3750"

      - name: rental_marginal_tier_three_inputs
        grounds:
          - calculations.rental_quote
          - entities.RentalEvent.fields.deposit_cents
          - state_machines.RentalEvent.INQUIRY_to_HELD
        distinguishing_aspect: "Mode (a) non-linear formula with >=3 inputs (base_rental_cents, guest_count, two tier rates): marginal tiering splits 30 guests into min(30,20)=20 at 500 and 10 at 300, a different combinatorial axis than the round-order pin."
        test_recipe:
          setup:
            - "A RENTAL_HALL venue; a rental inquiry with base_rental_cents=50000, guest_count=30."
          setup_api_calls:
            - call: "POST /venues"
              payload: { name: "Hall C", venue_type: "RENTAL_HALL", seated_capacity: 100 }
              as: FacilityAdmin
              captures: { hall_id: $.data.id }
          trigger:
            - call: "POST /rentals"
              payload: { venue_id: "${hall_id}", host_name: "Sam", starts_at: "2026-06-01T12:00:00Z", ends_at: "2026-06-01T15:00:00Z", guest_count: 30, base_rental_cents: 50000 }
              as: EventsManager
              captures: { rental_id: $.data.id }
          assert:
            - "RentalEvent.${rental_id}.deposit_cents == 15750"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: show_sold_out_open_cycle
        grounds:
          - state_machines.ShowEvent.OPEN_to_SOLD_OUT
          - state_machines.ShowEvent.SOLD_OUT_to_OPEN
          - state_machines.ShowBooking.HELD_to_CANCELLED
        distinguishing_aspect: "ShowEvent cycles OPEN->SOLD_OUT (capacity 2 reached by two party-1 holds) then SOLD_OUT->OPEN when one booking cancels — a cyclic shape on ShowEvent, not a linear pipeline."
        test_recipe:
          setup:
            - "A DOME venue with seated_capacity=2; an OPEN show; two party-1 holds making it SOLD_OUT."
          setup_api_calls:
            - call: "POST /venues"
              payload: { name: "Tiny Dome", venue_type: "DOME", seated_capacity: 2 }
              as: FacilityAdmin
              captures: { dome_id: $.data.id }
            - call: "POST /shows"
              payload: { venue_id: "${dome_id}", title: "Mini", starts_at: "2026-04-05T10:00:00Z", ends_at: "2026-04-05T11:00:00Z", base_price_cents: 1000 }
              as: BoxOfficeOperator
              captures: { show_id: $.data.id }
            - call: "POST /shows/${show_id}/open"
              payload: {}
              as: BoxOfficeOperator
              captures: { show_v1: $.data.version }
            - call: "POST /show-bookings"
              payload: { show_event_id: "${show_id}", party_size: 1, expected_show_version: "${show_v1}" }
              as: BoxOfficeOperator
              captures: { b1_id: $.data.id }
            - call: "GET /shows/${show_id}"
              payload: {}
              as: BoxOfficeOperator
              captures: { show_v2: $.data.version }
            - call: "POST /show-bookings"
              payload: { show_event_id: "${show_id}", party_size: 1, expected_show_version: "${show_v2}" }
              as: BoxOfficeOperator
              captures: { b2_id: $.data.id }
          trigger:
            - call: "POST /show-bookings/${b1_id}/cancel"
              payload: {}
              as: BoxOfficeOperator
            - call: "GET /shows/${show_id}"
              payload: {}
              as: BoxOfficeOperator
              captures: { final_status: $.data.status, final_seats: $.data.seats_sold }
          assert:
            - "ShowEvent.${show_id}.status == OPEN"
            - "ShowEvent.${show_id}.seats_sold == 1"

      - name: membership_active_expired_renewal_cycle
        grounds:
          - state_machines.Membership.ACTIVE_to_EXPIRED
          - state_machines.Membership.EXPIRED_to_ACTIVE
          - entities.Membership.fields.expires_at
        distinguishing_aspect: "Membership cycles ACTIVE->EXPIRED (clock past expires_at + sweep) then EXPIRED->ACTIVE (renewal) on a different entity than ShowEvent — a cyclic renewal loop."
        test_recipe:
          setup:
            - "A FAMILY membership activated at 2026-03-01 (expires 2027-03-01); clock advanced past expiry and swept to EXPIRED."
          setup_api_calls:
            - call: "POST /memberships"
              payload: { primary_member_name: "Renew Me", tier: "FAMILY", home_zip: "90210", party_size: 2 }
              as: MembershipClerk
              captures: { mem_id: $.data.id }
            - call: "POST /memberships/${mem_id}/activate"
              payload: { dues_cents: 12000 }
              as: MembershipClerk
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-03-02T00:00:00Z" }
              as: FacilityAdmin
            - call: "POST /_sweeps/run"
              payload: {}
              as: FacilityAdmin
          trigger:
            - call: "POST /memberships/${mem_id}/activate"
              payload: { dues_cents: 12000 }
              as: MembershipClerk
              captures: { renewed_status: $.data.status, renewed_dues: $.data.dues_paid_cents }
          assert:
            - "Membership.${mem_id}.status == ACTIVE"
            - "Membership.${mem_id}.dues_paid_cents == 24000"

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: show_cancel_cascade_booking_cascade_accommodation
        grounds:
          - state_machines.ShowEvent.OPEN_to_CANCELLED
          - state_machines.ShowBooking.HELD_to_CANCELLED
          - state_machines.AccommodationRequest.APPROVED_to_DENIED
        distinguishing_aspect: "Depth-3 cascade: POST /shows/{id}/cancel -> each HELD/CONFIRMED ShowBooking->CANCELLED -> each booking's APPROVED AccommodationRequest->DENIED; each hop is caused by the prior hop, not by the original cancel directly."
        test_recipe:
          setup:
            - "An OPEN show with one confirmed booking that has an APPROVED wheelchair accommodation."
          setup_api_calls:
            - call: "POST /venues"
              payload: { name: "Dome D", venue_type: "DOME", seated_capacity: 50, accessible_seats: 4 }
              as: FacilityAdmin
              captures: { dome_id: $.data.id }
            - call: "POST /shows"
              payload: { venue_id: "${dome_id}", title: "Sky", starts_at: "2026-04-10T10:00:00Z", ends_at: "2026-04-10T11:00:00Z", base_price_cents: 1500 }
              as: BoxOfficeOperator
              captures: { show_id: $.data.id }
            - call: "POST /shows/${show_id}/open"
              payload: {}
              as: BoxOfficeOperator
              captures: { show_v1: $.data.version }
            - call: "POST /show-bookings"
              payload: { show_event_id: "${show_id}", party_size: 2, accessible_seats_requested: 1, expected_show_version: "${show_v1}" }
              as: BoxOfficeOperator
              captures: { booking_id: $.data.id }
            - call: "POST /show-bookings/${booking_id}/confirm"
              payload: {}
              as: BoxOfficeOperator
            - call: "POST /accommodations"
              payload: { subject_type: "SHOW_BOOKING", accommodation_kind: "WHEELCHAIR", show_booking_id: "${booking_id}" }
              as: AccessibilityCoordinator
              captures: { acc_id: $.data.id }
            - call: "POST /accommodations/${acc_id}/approve"
              payload: {}
              as: AccessibilityCoordinator
          trigger:
            - call: "POST /shows/${show_id}/cancel"
              payload: {}
              as: BoxOfficeOperator
          assert:
            - "ShowEvent.${show_id}.status == CANCELLED"
            - "ShowBooking.${booking_id}.status == CANCELLED"
            - "AccommodationRequest.${acc_id}.status == DENIED"

      - name: registration_cancel_cascade_promote_reopen
        grounds:
          - state_machines.Registration.ENROLLED_to_CANCELLED
          - state_machines.Registration.WAITLISTED_to_ENROLLED
          - state_machines.ProgramSession.FULL_to_ENROLLING
        distinguishing_aspect: "Depth-3 cascade from a different trigger (POST /registrations/{id}/cancel): cancel an ENROLLED reg -> promote earliest WAITLISTED reg -> ENROLLED; the freed-then-filled session stays FULL, distinct from the show-cancel chain."
        test_recipe:
          setup:
            - "A CLASSROOM session capacity=1; one ENROLLED registration and one WAITLISTED registration (created later)."
          setup_api_calls:
            - call: "POST /venues"
              payload: { name: "Room 1", venue_type: "CLASSROOM", seated_capacity: 30 }
              as: FacilityAdmin
              captures: { room_id: $.data.id }
            - call: "POST /programs"
              payload: { venue_id: "${room_id}", title: "Astro Camp", program_kind: "CAMP", min_age: 6, max_age: 12, starts_at: "2026-07-01T09:00:00Z", capacity: 1, tuition_cents: 10000 }
              as: ProgramCoordinator
              captures: { prog_id: $.data.id, prog_v1: $.data.version }
            - call: "POST /registrations"
              payload: { program_session_id: "${prog_id}", participant_name: "Ann", participant_age: 8, expected_session_version: "${prog_v1}" }
              as: ProgramCoordinator
              captures: { reg1_id: $.data.id }
            - call: "GET /programs/${prog_id}"
              payload: {}
              as: ProgramCoordinator
              captures: { prog_v2: $.data.version }
            - call: "POST /registrations"
              payload: { program_session_id: "${prog_id}", participant_name: "Ben", participant_age: 9, expected_session_version: "${prog_v2}" }
              as: ProgramCoordinator
              captures: { reg2_id: $.data.id }
          trigger:
            - call: "POST /registrations/${reg1_id}/cancel"
              payload: {}
              as: ProgramCoordinator
            - call: "GET /registrations/${reg2_id}"
              payload: {}
              as: ProgramCoordinator
              captures: { reg2_status: $.data.status }
          assert:
            - "Registration.${reg1_id}.status == CANCELLED"
            - "Registration.${reg2_id}.status == ENROLLED"
            - "ProgramSession.${prog_id}.status == FULL"

  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_vs_fiscal_on_group_pay_deposit
        grounds:
          - validations[priority=5]
          - validations[priority=15]
        distinguishing_aspect: "A SCHEDULED (not OPEN) show with a deposit that would also exceed capacity: state check (priority 5, ERR_INVALID_STATE) wins over the fiscal capacity check (priority 15, ERR_SHOW_CAPACITY_EXCEEDED) — error-category pair state vs business_fiscal."
        test_recipe:
          setup:
            - "A DOME show capacity=2 still SCHEDULED (never opened); a group booking requesting 5 seats."
          setup_api_calls:
            - call: "POST /venues"
              payload: { name: "Dome E", venue_type: "DOME", seated_capacity: 2 }
              as: FacilityAdmin
              captures: { dome_id: $.data.id }
            - call: "POST /shows"
              payload: { venue_id: "${dome_id}", title: "Closed", starts_at: "2026-04-12T10:00:00Z", ends_at: "2026-04-12T11:00:00Z", base_price_cents: 1000 }
              as: BoxOfficeOperator
              captures: { show_id: $.data.id }
            - call: "POST /group-bookings"
              payload: { show_event_id: "${show_id}", organization_name: "Big Group", student_count: 4, chaperone_count: 1 }
              as: GroupSalesAgent
              captures: { gb_id: $.data.id }
          trigger:
            - call: "POST /group-bookings/${gb_id}/pay-deposit"
              payload: {}
              as: GroupSalesAgent
              captures: { err: $.data.error_id }
          assert:
            - "response.error_id == ERR_INVALID_STATE"
            - "response.http_status == 409"

      - name: safety_age_vs_fiscal_overfulfillment_categories
        grounds:
          - validations[priority=8]
          - validations[priority=17]
        distinguishing_aspect: "Two distinct business categories: an age-ineligible registration triggers ERR_AGE_INELIGIBLE (business_safety, priority 8) while an over-pledge contribution triggers ERR_OVERFULFILLMENT (business_fiscal, priority 17) — a different error-category pair (business_safety vs business_fiscal) than the state-vs-fiscal instance."
        test_recipe:
          setup:
            - "A CLASSROOM session for ages 6-12; a participant aged 4. Separately a sponsor pledged 5000 already FULFILLED, then a further contribution attempted."
          setup_api_calls:
            - call: "POST /venues"
              payload: { name: "Room 2", venue_type: "CLASSROOM", seated_capacity: 20 }
              as: FacilityAdmin
              captures: { room_id: $.data.id }
            - call: "POST /programs"
              payload: { venue_id: "${room_id}", title: "Kids Lab", program_kind: "CLASS", min_age: 6, max_age: 12, starts_at: "2026-07-05T09:00:00Z", capacity: 10, tuition_cents: 8000 }
              as: ProgramCoordinator
              captures: { prog_id: $.data.id, prog_v1: $.data.version }
            - call: "POST /sponsors"
              payload: { org_name: "Acme", sponsor_kind: "SPONSOR", pledged_cents: 5000 }
              as: DevelopmentOfficer
              captures: { sp_id: $.data.id, sp_v1: $.data.version }
            - call: "POST /sponsors/${sp_id}/contributions"
              payload: { amount_cents: 5000, expected_sponsor_version: "${sp_v1}" }
              as: DevelopmentOfficer
            - call: "GET /sponsors/${sp_id}"
              payload: {}
              as: DevelopmentOfficer
              captures: { sp_v2: $.data.version }
          trigger:
            - call: "POST /registrations"
              payload: { program_session_id: "${prog_id}", participant_name: "Tot", participant_age: 4, expected_session_version: "${prog_v1}" }
              as: ProgramCoordinator
              captures: { age_err: $.data.error_id }
            - call: "POST /sponsors/${sp_id}/contributions"
              payload: { amount_cents: 100, expected_sponsor_version: "${sp_v2}" }
              as: DevelopmentOfficer
              captures: { over_err: $.data.error_id }
          assert:
            - "first trigger response.error_id == ERR_AGE_INELIGIBLE"
            - "second trigger response.error_id == ERR_OVERFULFILLMENT"

  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: show_capacity_exact_boundary
        grounds:
          - validations[priority=15]
          - calculations.show_admission_pricing
          - state_machines.ShowEvent.OPEN_to_SOLD_OUT
        distinguishing_aspect: "Numeric threshold on seats: with capacity=3 and 2 seats sold, a party_size=1 hold (sum==3, == capacity) succeeds and flips SOLD_OUT, while party_size=2 (sum==4 > 3) is rejected — boundary at >= capacity vs > capacity."
        test_recipe:
          setup:
            - "A DOME show capacity=3, OPEN, with 2 seats already held."
          setup_api_calls:
            - call: "POST /venues"
              payload: { name: "Dome F", venue_type: "DOME", seated_capacity: 3 }
              as: FacilityAdmin
              captures: { dome_id: $.data.id }
            - call: "POST /shows"
              payload: { venue_id: "${dome_id}", title: "Edge", starts_at: "2026-04-14T10:00:00Z", ends_at: "2026-04-14T11:00:00Z", base_price_cents: 1000 }
              as: BoxOfficeOperator
              captures: { show_id: $.data.id }
            - call: "POST /shows/${show_id}/open"
              payload: {}
              as: BoxOfficeOperator
              captures: { show_v1: $.data.version }
            - call: "POST /show-bookings"
              payload: { show_event_id: "${show_id}", party_size: 2, expected_show_version: "${show_v1}" }
              as: BoxOfficeOperator
              captures: { b1_id: $.data.id }
            - call: "GET /shows/${show_id}"
              payload: {}
              as: BoxOfficeOperator
              captures: { show_v2: $.data.version }
          trigger:
            - call: "POST /show-bookings"
              payload: { show_event_id: "${show_id}", party_size: 1, expected_show_version: "${show_v2}" }
              as: BoxOfficeOperator
              captures: { b2_id: $.data.id }
          assert:
            - "ShowBooking.${b2_id}.status == HELD"
            - "ShowEvent.${show_id}.seats_sold == 3"
            - "ShowEvent.${show_id}.status == SOLD_OUT"

      - name: program_waitlist_zero_seat_empty_set
        grounds:
          - validations[priority=16]
          - state_machines.Registration.WAITLISTED_to_ENROLLED
          - entities.Registration.fields.waitlist_position
        distinguishing_aspect: "Empty-seat / zero-remaining boundary on a different metric and endpoint: enrolling into a capacity=1 session that is already at enrolled_count==1 yields WAITLISTED (not rejected) with waitlist_position==1 — the zero-remaining-seats edge, distinct from the numeric capacity-crossing edge."
        test_recipe:
          setup:
            - "A CLASSROOM session capacity=1 with one ENROLLED registration (enrolled_count==1, 0 remaining)."
          setup_api_calls:
            - call: "POST /venues"
              payload: { name: "Room 3", venue_type: "CLASSROOM", seated_capacity: 20 }
              as: FacilityAdmin
              captures: { room_id: $.data.id }
            - call: "POST /programs"
              payload: { venue_id: "${room_id}", title: "Solo Class", program_kind: "CLASS", min_age: 5, max_age: 99, starts_at: "2026-07-10T09:00:00Z", capacity: 1, tuition_cents: 5000 }
              as: ProgramCoordinator
              captures: { prog_id: $.data.id, prog_v1: $.data.version }
            - call: "POST /registrations"
              payload: { program_session_id: "${prog_id}", participant_name: "First", participant_age: 10, expected_session_version: "${prog_v1}" }
              as: ProgramCoordinator
              captures: { reg1_id: $.data.id }
            - call: "GET /programs/${prog_id}"
              payload: {}
              as: ProgramCoordinator
              captures: { prog_v2: $.data.version }
          trigger:
            - call: "POST /registrations"
              payload: { program_session_id: "${prog_id}", participant_name: "Second", participant_age: 11, expected_session_version: "${prog_v2}" }
              as: ProgramCoordinator
              captures: { reg2_id: $.data.id }
          assert:
            - "Registration.${reg2_id}.status == WAITLISTED"
            - "Registration.${reg2_id}.waitlist_position == 1"

  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: show_booking_confirm_requires_show_open
        grounds:
          - state_machines.ShowBooking.HELD_to_CONFIRMED
          - state_machines.ShowEvent.OPEN_to_CANCELLED
        distinguishing_aspect: "ShowBooking HELD->CONFIRMED is gated on the linked ShowEvent.status IN {OPEN, SOLD_OUT}; once the show is CANCELLED the booking is already CANCELLED so confirm fails with ERR_INVALID_STATE — entity pair ShowBooking->ShowEvent."
        test_recipe:
          setup:
            - "An OPEN show with one HELD booking; the show is then cancelled (which cascades the booking to CANCELLED)."
          setup_api_calls:
            - call: "POST /venues"
              payload: { name: "Dome G", venue_type: "DOME", seated_capacity: 40 }
              as: FacilityAdmin
              captures: { dome_id: $.data.id }
            - call: "POST /shows"
              payload: { venue_id: "${dome_id}", title: "GateA", starts_at: "2026-04-16T10:00:00Z", ends_at: "2026-04-16T11:00:00Z", base_price_cents: 1000 }
              as: BoxOfficeOperator
              captures: { show_id: $.data.id }
            - call: "POST /shows/${show_id}/open"
              payload: {}
              as: BoxOfficeOperator
              captures: { show_v1: $.data.version }
            - call: "POST /show-bookings"
              payload: { show_event_id: "${show_id}", party_size: 1, expected_show_version: "${show_v1}" }
              as: BoxOfficeOperator
              captures: { booking_id: $.data.id }
            - call: "POST /shows/${show_id}/cancel"
              payload: {}
              as: BoxOfficeOperator
          trigger:
            - call: "POST /show-bookings/${booking_id}/confirm"
              payload: {}
              as: BoxOfficeOperator
              captures: { err: $.data.error_id }
          assert:
            - "ShowBooking.${booking_id}.status == CANCELLED"
            - "response.error_id == ERR_INVALID_STATE"

      - name: group_pay_deposit_requires_show_open
        grounds:
          - state_machines.GroupBooking.REQUESTED_to_DEPOSIT_PAID
          - state_machines.ShowEvent.SCHEDULED_to_OPEN
        distinguishing_aspect: "GroupBooking REQUESTED->DEPOSIT_PAID is gated on the linked ShowEvent.status==OPEN (a different entity pair GroupBooking->ShowEvent than ShowBooking->ShowEvent); a SCHEDULED show blocks pay-deposit with ERR_INVALID_STATE."
        test_recipe:
          setup:
            - "A DOME show still SCHEDULED (never opened); a group booking requested against it."
          setup_api_calls:
            - call: "POST /venues"
              payload: { name: "Dome H", venue_type: "DOME", seated_capacity: 60 }
              as: FacilityAdmin
              captures: { dome_id: $.data.id }
            - call: "POST /shows"
              payload: { venue_id: "${dome_id}", title: "GateB", starts_at: "2026-04-18T10:00:00Z", ends_at: "2026-04-18T11:00:00Z", base_price_cents: 1000 }
              as: BoxOfficeOperator
              captures: { show_id: $.data.id }
            - call: "POST /group-bookings"
              payload: { show_event_id: "${show_id}", organization_name: "Grp", student_count: 10, chaperone_count: 1 }
              as: GroupSalesAgent
              captures: { gb_id: $.data.id }
          trigger:
            - call: "POST /group-bookings/${gb_id}/pay-deposit"
              payload: {}
              as: GroupSalesAgent
              captures: { err: $.data.error_id }
          assert:
            - "GroupBooking.${gb_id}.status == REQUESTED"
            - "response.error_id == ERR_INVALID_STATE"

  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: show_overlap_with_turnover_buffer
        grounds:
          - validations[priority=9]
          - entities.Venue.fields.turnover_buffer_minutes
          - errors[ERR_SHOW_TIME_CONFLICT]
        distinguishing_aspect: "ShowEvent overlap uses [starts_at, ends_at) PLUS the venue's turnover_buffer_minutes: a second show starting 10 min after the first ends (buffer=15) conflicts even though the raw windows do not overlap — buffer-aware interval semantics."
        test_recipe:
          setup:
            - "A DOME venue turnover_buffer_minutes=15 with a show 10:00-11:00; a second show 11:10-12:00 is within the 15-min buffer."
          setup_api_calls:
            - call: "POST /venues"
              payload: { name: "Dome I", venue_type: "DOME", seated_capacity: 50, turnover_buffer_minutes: 15 }
              as: FacilityAdmin
              captures: { dome_id: $.data.id }
            - call: "POST /shows"
              payload: { venue_id: "${dome_id}", title: "First", starts_at: "2026-04-20T10:00:00Z", ends_at: "2026-04-20T11:00:00Z", base_price_cents: 1000 }
              as: BoxOfficeOperator
              captures: { show1_id: $.data.id }
          trigger:
            - call: "POST /shows"
              payload: { venue_id: "${dome_id}", title: "Second", starts_at: "2026-04-20T11:10:00Z", ends_at: "2026-04-20T12:00:00Z", base_price_cents: 1000 }
              as: BoxOfficeOperator
              captures: { err: $.data.error_id }
          assert:
            - "response.error_id == ERR_SHOW_TIME_CONFLICT"
            - "response.http_status == 409"

      - name: rental_overlap_no_buffer_adjacency_ok
        grounds:
          - validations[priority=10]
          - errors[ERR_RENTAL_TIME_CONFLICT]
          - state_machines.RentalEvent.INQUIRY_to_HELD
        distinguishing_aspect: "RentalEvent overlap on a different resource entity uses bare closed-open [starts_at, ends_at) with NO buffer: a back-to-back rental starting exactly when the first ends (adjacency, gap=0) is ALLOWED, unlike the buffered show rule — different interval geometry."
        test_recipe:
          setup:
            - "A RENTAL_HALL with a HELD rental 14:00-16:00; a second rental 16:00-18:00 (adjacent, gap=0)."
          setup_api_calls:
            - call: "POST /venues"
              payload: { name: "Hall J", venue_type: "RENTAL_HALL", seated_capacity: 80 }
              as: FacilityAdmin
              captures: { hall_id: $.data.id }
            - call: "POST /rentals"
              payload: { venue_id: "${hall_id}", host_name: "A", starts_at: "2026-05-10T14:00:00Z", ends_at: "2026-05-10T16:00:00Z", guest_count: 10, base_rental_cents: 30000 }
              as: EventsManager
              captures: { r1_id: $.data.id }
            - call: "POST /rentals/${r1_id}/hold"
              payload: {}
              as: EventsManager
            - call: "POST /rentals"
              payload: { venue_id: "${hall_id}", host_name: "B", starts_at: "2026-05-10T16:00:00Z", ends_at: "2026-05-10T18:00:00Z", guest_count: 10, base_rental_cents: 30000 }
              as: EventsManager
              captures: { r2_id: $.data.id }
          trigger:
            - call: "POST /rentals/${r2_id}/hold"
              payload: {}
              as: EventsManager
              captures: { r2_status: $.data.status }
          assert:
            - "RentalEvent.${r2_id}.status == HELD"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: show_refund_conserves_seats_and_cents
        grounds:
          - state_machines.ShowBooking.CONFIRMED_to_REFUNDED
          - entities.ShowEvent.fields.seats_sold
          - entities.ShowBooking.fields.net_price_cents
        distinguishing_aspect: "Conserved quantity = ShowEvent.seats_sold: after a CONFIRMED 2-seat booking is refunded, seats_sold returns to its pre-booking value (0), and the refunded net_price_cents equals the originally charged net_price_cents (no cents drift)."
        test_recipe:
          setup:
            - "An OPEN show (capacity 40, seats_sold 0); one CONFIRMED 2-seat booking (seats_sold 2), clock before show start."
          setup_api_calls:
            - call: "POST /venues"
              payload: { name: "Dome K", venue_type: "DOME", seated_capacity: 40 }
              as: FacilityAdmin
              captures: { dome_id: $.data.id }
            - call: "POST /shows"
              payload: { venue_id: "${dome_id}", title: "Refundable", starts_at: "2026-04-25T10:00:00Z", ends_at: "2026-04-25T11:00:00Z", base_price_cents: 1500 }
              as: BoxOfficeOperator
              captures: { show_id: $.data.id }
            - call: "POST /shows/${show_id}/open"
              payload: {}
              as: BoxOfficeOperator
              captures: { show_v1: $.data.version }
            - call: "POST /show-bookings"
              payload: { show_event_id: "${show_id}", party_size: 2, expected_show_version: "${show_v1}" }
              as: BoxOfficeOperator
              captures: { booking_id: $.data.id, booking_net: $.data.net_price_cents }
            - call: "POST /show-bookings/${booking_id}/confirm"
              payload: {}
              as: BoxOfficeOperator
          trigger:
            - call: "POST /show-bookings/${booking_id}/refund"
              payload: {}
              as: BoxOfficeOperator
              captures: { refunded_net: $.data.net_price_cents }
          assert:
            - "ShowBooking.${booking_id}.status == REFUNDED"
            - "ShowBooking.${booking_id}.net_price_cents == 3000"
            - "ShowEvent.${show_id}.seats_sold == 0"

      - name: group_cancel_conserves_show_seats
        grounds:
          - state_machines.GroupBooking.DEPOSIT_PAID_to_CANCELLED
          - entities.ShowEvent.fields.seats_sold
          - entities.GroupBooking.fields.total_seats
        distinguishing_aspect: "Conserved quantity = ShowEvent.seats_sold under a different forward/compensating pair: paying a deposit reserves total_seats (11) then cancelling releases exactly total_seats, returning seats_sold to the pre-deposit value (0) with no seat drift."
        test_recipe:
          setup:
            - "An OPEN show capacity 60, seats_sold 0; a group booking (10 students + 1 chaperone = 11 seats) with deposit paid (seats_sold 11)."
          setup_api_calls:
            - call: "POST /venues"
              payload: { name: "Dome L", venue_type: "DOME", seated_capacity: 60 }
              as: FacilityAdmin
              captures: { dome_id: $.data.id }
            - call: "POST /shows"
              payload: { venue_id: "${dome_id}", title: "GroupShow", starts_at: "2026-04-27T10:00:00Z", ends_at: "2026-04-27T11:00:00Z", base_price_cents: 1000 }
              as: BoxOfficeOperator
              captures: { show_id: $.data.id }
            - call: "POST /shows/${show_id}/open"
              payload: {}
              as: BoxOfficeOperator
            - call: "POST /group-bookings"
              payload: { show_event_id: "${show_id}", organization_name: "Field Trip", student_count: 10, chaperone_count: 1 }
              as: GroupSalesAgent
              captures: { gb_id: $.data.id }
            - call: "POST /group-bookings/${gb_id}/pay-deposit"
              payload: {}
              as: GroupSalesAgent
          trigger:
            - call: "POST /group-bookings/${gb_id}/cancel"
              payload: {}
              as: GroupSalesAgent
          assert:
            - "GroupBooking.${gb_id}.status == CANCELLED"
            - "GroupBooking.${gb_id}.total_seats == 11"
            - "ShowEvent.${show_id}.seats_sold == 0"
