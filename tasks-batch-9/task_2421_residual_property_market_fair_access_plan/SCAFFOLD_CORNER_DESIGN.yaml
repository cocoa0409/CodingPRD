            - call: "POST /fair-plan/assessment-events"
              payload: { cat_zone_id: "${zone_id}", trigger_loss_cents: 200000000, reserve_balance_cents_at_trigger: 100000000, allocation_basis: "MARKET_SHARE" }
              as: PlanAdmin
              captures: { ev_id: $.data.id, ev_v: $.data.version }
            - call: "POST /fair-plan/assessment-events/${ev_id}/allocation-run"
              payload: { expected_assessment_event_version: "${ev_v}" }
              as: PlanAdmin
            - call: "GET /fair-plan/assessment-events/${ev_id}/allocations"
              payload: {}
              as: PlanAdmin
              captures: { alloc_id: "$.data[0].id" }
          trigger:
            - call: "POST /fair-plan/assessment-allocations/${alloc_id}/payment"
              payload: { amount_cents: 100000000 }
              as: MemberInsurerUser
              as_user_id: "${m1_id}"
              captures: { err_id: $.data.error_id }
          assert:
            - "response status == 409"
            - "response.error_id == ERR_ALLOCATION_NOT_PAYABLE"
            - "AssessmentAllocation.${alloc_id}.status == PENDING"
            - "AssessmentAllocation.${alloc_id}.net_due_cents == 100000000"
            - "AssessmentAllocation.${alloc_id}.paid_at == null"
            - "AssessmentEvent.${ev_id}.status == ALLOCATED"

      - name: application_reinspection_cycle_reaches_improvements_required_again
        claim_type: valid_transition
        grounds:
          - state_machines.Application.IMPROVEMENTS_REQUIRED_to_INSPECTION_PENDING
        excluded_because:
          difficulty_instance: application_reinspection_cycle_returns_to_improvements_required
          rationale: "The cyclic shape of the Application machine is walked end-to-end by the named §1.8 instance, which asserts the second entry into IMPROVEMENTS_REQUIRED and the per-inspection requirement bookkeeping."

      - name: policy_coverage_and_depopulation_dimensions_advance_independently
        claim_type: valid_transition
        grounds:
          - state_machines.Policy.depopulation_status
          - complexity_profile.state_machine_shape
        excluded_because:
          difficulty_instance: policy_depopulation_dimension_cycles_while_coverage_stays_in_force
          rationale: "The parallel-dimension claim (depopulation_status cycling NOT_OFFERED -> OFFER_OUTSTANDING -> ELECTED_RETAIN -> OFFER_OUTSTANDING while coverage_status stays IN_FORCE) is the whole point of the named §1.8 instance."

      - name: assessment_event_settles_when_its_last_allocation_is_paid
        claim_type: side_effect_execution
        grounds:
          - state_machines.AssessmentEvent.INVOICED_to_SETTLED
        excluded_because:
          difficulty_instance: final_allocation_payment_cascades_three_hops_to_credit_release
          rationale: "The compound bubble-up (parent SETTLED derived from child allocation states) plus the credit-release hop is asserted by the named §1.8 instance."

      - name: inspection_completion_fork_drives_three_distinct_application_states
        claim_type: side_effect_execution
        grounds:
          - state_machines.Inspection.PENDING_to_PASS
          - state_machines.Inspection.PENDING_to_PASS_WITH_CONDITIONS
          - state_machines.Inspection.PENDING_to_FAIL
        excluded_because:
          difficulty_instance: inspection_three_way_fork_drives_three_different_application_states
          rationale: "All three branches of the completion fork and their divergent cascades are asserted by the named §1.8 instance."

      - name: zone_posture_transitions_open_restricted_closed_on_exposure_change
        claim_type: side_effect_execution
        grounds:
          - state_machines.CatastropheZone.transitions
        excluded_because:
          difficulty_instance: zone_exposure_aggregate_returns_to_zero_and_status_reverts_to_open
          rationale: "The OPEN -> RESTRICTED transition on bind and the RESTRICTED -> OPEN reversion on cancellation are both asserted by the named §1.8 instance; the CLOSED threshold is asserted by closed_zone_error_precedes_exposure_cap_error."

      - name: takeout_acceptance_cascade_reaches_zone_and_member_ledgers
        claim_type: side_effect_execution
        grounds:
          - state_machines.TakeoutOffer.OUTSTANDING_to_ACCEPTED
        excluded_because:
          difficulty_instance: takeout_acceptance_cascades_four_hops_to_zone_reopening
          rationale: "The four-hop acceptance cascade (offer -> policy -> member credits -> zone posture) is asserted end-to-end by the named §1.8 instance."

      - name: completion_with_conditions_raises_requirement_and_holds_the_application
        claim_type: side_effect_execution
        grounds:
          - state_machines.Inspection.PENDING_to_PASS_WITH_CONDITIONS
          - state_machines.Application.INSPECTION_PENDING_to_IMPROVEMENTS_REQUIRED
          - entities.ImprovementRequirement.fields.due_at
