scaffold_difficulty_design:

  # ─────────────────────────────────────────────────────────────────────────
  # Rule 1: Dual-variant calculations across different entity domains (≥2)
  # ─────────────────────────────────────────────────────────────────────────
  - rule_id: dual_variant_calc
    instances:

      - name: tariff_general_vs_preferential_on_settlement
        grounds:
          - calculations.compute_tariff
          - calculations.compute_tariff.variants.general_tariff
          - calculations.compute_tariff.variants.preferential_tariff
          - entities.Declaration.fields.trade_agreement_code
          - entities.Settlement.fields.tariff_amount
        distinguishing_aspect: |
          Operates on the Settlement entity (financial reconciliation domain): identical declared_value/hs_code/jurisdiction inputs produce a strictly higher tariff_amount under variant=general_tariff (MFN rate table) than under variant=preferential_tariff (FTA rate table). Two valid interpretations of the same prose ('which rate table?') produce different numbers.
        test_recipe:
          setup:
            - "POST /customs/clients (default_settlement_currency=CNY)"
            - "POST /customs/agreements with scope=[DECLARATION, TARIFF_ADVANCE], agreement_currency=USD, fee_schedule={DECLARATION:100,TARIFF_ADVANCE:80}, late_interest_daily_rate_bps=100"
            - "Activate the agreement through DRAFT→AWAITING_SIGNATURE→ACTIVE"
            - "Create two declarations DEC-G and DEC-P, both jurisdiction_code=CN, hs_code=8517, country_of_origin=JP, declared_value=2000.00 USD"
            - "DEC-G: trade_agreement_code=NONE. DEC-P: trade_agreement_code=RCEP."
            - "Attach all four core docs + dummy authenticity-passing siblings for each, pre-validate, and file each through to RELEASED via /_events/emit (manifest matched first)."
          trigger:
            - "GET /customs/settlements?declaration_id=DEC-G"
            - "GET /customs/settlements?declaration_id=DEC-P"
          assert:
            - "Settlement[DEC-G].tariff_amount == 756.00"
            - "Settlement[DEC-P].tariff_amount == 302.40"
            - "Settlement[DEC-G].tariff_amount > Settlement[DEC-P].tariff_amount"
            - "Both share identical base_value (=14400.00) but diverge on rate table selection"

      - name: late_interest_ongoing_vs_finalized_on_settlement_ledger
        grounds:
          - calculations.compute_late_interest
          - calculations.compute_late_interest.variants.ongoing_estimate
          - calculations.compute_late_interest.variants.finalized
          - entities.Settlement.fields.late_interest_amount
          - entities.Settlement.fields.reimbursed_at
          - state_machines.Settlement.ADVANCED_to_REIMBURSED
        distinguishing_aspect: |
          Operates on the Settlement entity but on the late_interest ledger axis, which is structurally different from the tariff variant above (one indexes off advance_paid_amount * daily_rate * days; the other indexes off declared_value * tariff_rate * tier_factor). The ongoing_estimate variant returns a live value that changes with each clock advance; the finalized variant is frozen at REIMBURSED. Identical principal + agreement rate yield different values depending on which variant the caller observes.
        test_recipe:
          setup:
            - "Bring a Settlement to ADVANCED state with advance_paid_amount=2726.28 CNY, late_interest_daily_rate_bps=100"
            - "advance_paid_at = T0; reimbursement_due_at = T0 + 7 days"
          trigger:
            - "POST /customs/_clock/advance to T0 + 10 days  # 3 days late"
            - "GET /customs/settlements/{id}  # observe ongoing_estimate"
            - "POST /customs/_events/emit (source=BANK, event=BANK_DEBIT_CONFIRMED, amount=2808.07)"
            - "GET /customs/settlements/{id}  # observe finalized"
            - "POST /customs/_clock/advance to T0 + 30 days  # 23 more 'days late' had reimbursement not happened"
            - "GET /customs/settlements/{id}  # finalized must be frozen"
          assert:
            - "First GET: Settlement.late_interest_amount == 81.79 (ongoing_estimate for 3 days)"
            - "After bank confirm, Settlement.status == REIMBURSED"
            - "Second GET: Settlement.late_interest_amount == 81.79 (finalized, identical)"
            - "Third GET (after clock advance): Settlement.late_interest_amount == 81.79 (unchanged — proves freeze)"

  # ─────────────────────────────────────────────────────────────────────────
  # Rule 2: Combinatorial formulas across different modes (≥2)
  # ─────────────────────────────────────────────────────────────────────────
  - rule_id: combinatorial_formula
    instances:

      - name: tariff_three_input_tiered_with_nonlinear_branching
        grounds:
          - calculations.compute_tariff
          - calculations.compute_tariff.formula
          - calculations.compute_tariff.constants.MFN_RATE_TABLE
        distinguishing_aspect: |
          Mode (a): formula has ≥3 inputs (declared_value_amount, jurisdiction_code, hs_code, trade_agreement_code, country_of_origin) with non-linear interaction — tiered-rate selection (1.00 / 1.05 / 1.10) is a step function on base_value, and rate-table selection is a conditional branch on trade_agreement_code. Three variables combine multiplicatively after a discrete branch on a fourth.
        test_recipe:
          setup:
            - "Activate an agreement with scope=[DECLARATION, TARIFF_ADVANCE]"
            - "Create three declarations on jurisdiction_code=CN, hs_code=8517, trade_agreement_code=NONE: DEC-A declared_value=1000 USD (base=7200), DEC-B declared_value=1389 USD (base=10000.80 -> tier 1.05), DEC-C declared_value=7000 USD (base=50400 -> tier 1.10)"
            - "Drive all three to RELEASED"
          trigger:
            - "GET /customs/settlements for each"
          assert:
            - "Settlement[DEC-A].tariff_amount == 360.00  # 7200 * 0.05 * 1.00"
            - "Settlement[DEC-B].tariff_amount == 525.04  # 10000.80 * 0.05 * 1.05"
            - "Settlement[DEC-C].tariff_amount == 2772.00  # 50400 * 0.05 * 1.10"

      - name: settlement_chain_nested_rounding_order_tariff_then_vat_then_ct
        grounds:
          - calculations.compute_tariff
          - calculations.compute_vat
          - calculations.compute_consumption_tax
          - calculations.compute_tariff.precision
          - calculations.compute_vat.precision
          - calculations.compute_consumption_tax.precision
        distinguishing_aspect: |
          Mode (b): nested rounding where order matters. The scaffold pins 'compute_tariff → round → feed into compute_vat → round → feed into compute_consumption_tax → round'. Reversing the order ('sum all rates then round once') produces different cents. The scaffold MUST observe the pinned order; computing VAT against unrounded tariff and then rounding once produces a different vat_amount than the pinned algorithm.
        test_recipe:
          setup:
            - "Activate an agreement; create declaration on jurisdiction=CN, hs_code=2208 (spirits → triggers consumption tax), trade_agreement_code=NONE, country_of_origin=JP, declared_value=1000 USD → base_value = round(1000*7.20,2) = 7200.00 CNY"
            - "Drive to RELEASED"
          trigger:
            - "GET /customs/settlements/{id}"
          assert:
            - "Settlement.tariff_amount == 720.00  # round(7200 * 0.10 * 1.00, 2)"
            - "Settlement.vat_amount == 1029.60   # round((7200 + 720.00) * 0.13, 2) — uses rounded tariff"
            - "Settlement.consumption_tax_amount == 1584.00  # round((7200 + 720.00) * 0.20, 2) — uses rounded tariff, NOT (tariff+vat)"
            - "advance_paid_amount == 3333.60 (tariff+vat+ct)"

      - name: broker_fee_three_input_aggregation_with_state_branching
        grounds:
          - calculations.compute_broker_fee
          - entities.CommissionAgreement.fields.fee_schedule
          - entities.Declaration.fields.amendment_count
          - entities.InspectionCase
        distinguishing_aspect: |
          Mode (a, distinct from the tariff instance above): formula has ≥3 inputs (fee_schedule, amendment_count, existence of InspectionCase, advance_paid_amount>0) and selects which fee_schedule entries to sum based on entity state. The conditional branches operate on different entities (Declaration.amendment_count, InspectionCase presence) than the tariff instance (which branches on Declaration.trade_agreement_code) — exercising a structurally different non-linear interaction.
        test_recipe:
          setup:
            - "Activate agreement with fee_schedule={DECLARATION:100, INSPECTION:50, TARIFF_ADVANCE:80, AMENDMENT:30, RETURN_SHIP:200}, agreement_currency=USD, declared_currency=USD, settlement_currency=CNY"
            - "DEC-A: file declaration that releases without inspection or amendment"
            - "DEC-B: file declaration that gets inspected (RELEASE outcome) AND was previously amended once"
          trigger:
            - "GET /customs/settlements for each"
          assert:
            - "Settlement[DEC-A].broker_fee_amount == 1296.00  # (100+80) * 1.00 * 7.20"
            - "Settlement[DEC-B].broker_fee_amount == 1872.00  # (100+50+80+30) * 1.00 * 7.20"

  # ─────────────────────────────────────────────────────────────────────────
  # Rule 3: Non-linear state-machine shape on different entities (≥2)
  # ─────────────────────────────────────────────────────────────────────────
  - rule_id: non_linear_state_machine
    instances:

      - name: declaration_revision_cycle_rejected_to_amending_to_filed
        grounds:
          - state_machines.Declaration
          - state_machines.Declaration.FILED_to_REJECTED
          - state_machines.Declaration.REJECTED_to_AMENDING
          - state_machines.Declaration.AMENDING_to_PRE_VALIDATED
          - state_machines.Declaration.PRE_VALIDATED_to_FILED
          - entities.Declaration.fields.amendment_count
        distinguishing_aspect: |
          Declaration's state machine is cyclic: FILED→REJECTED→AMENDING→PRE_VALIDATED→FILED forms a revision loop with amendment_count incrementing each lap and a hard cap at 3. This is on the Declaration entity.
        test_recipe:
          setup:
            - "Activate agreement; drive a declaration to FILED then reject via CUSTOMS_RESPONSE=REJECT with reason_code=HS_MISMATCH"
          trigger:
            - "POST /customs/declarations/{id}/amend"
            - "POST /customs/declarations/{id}/pre-validate"
            - "POST /customs/declarations/{id}/file"
            - "Reject again via CUSTOMS_RESPONSE=REJECT"
            - "POST /customs/declarations/{id}/amend (lap 2)"
          assert:
            - "After first amend: status=AMENDING, amendment_count=1"
            - "After re-pre-validate + re-file: status=FILED, amendment_count=1"
            - "After second amend: status=AMENDING, amendment_count=2"

      - name: filing_branching_fork_to_query_inspect_release_reject
        grounds:
          - state_machines.Filing
          - state_machines.Declaration.FILED_to_QUERIED
          - state_machines.Declaration.FILED_to_INSPECTING
          - state_machines.Declaration.FILED_to_RELEASED
          - state_machines.Declaration.FILED_to_REJECTED
        distinguishing_aspect: |
          Filing exhibits branching fork shape: from response_type=AWAITING, exactly one of four branches fires based on the CUSTOMS_RESPONSE event payload — RELEASE, QUERY, INSPECT, or REJECT — with divergent side-effect sets per branch (RELEASE → cascade Settlement creation; QUERY → set query_due_at; INSPECT → enable InspectionCase creation; REJECT → cascade RejectionRecord). This is on the Filing entity, a different entity from the cyclic Declaration above.
        test_recipe:
          setup:
            - "Bring four declarations DEC-Q/DEC-I/DEC-R/DEC-X each to FILED state (separate filings)"
          trigger:
            - "Emit CUSTOMS_RESPONSE=QUERY for DEC-Q's filing"
            - "Emit CUSTOMS_RESPONSE=INSPECT for DEC-I's filing"
            - "Emit MANIFEST_DROPPED with matching shipment_reference + CUSTOMS_RESPONSE=RELEASE for DEC-R"
            - "Emit CUSTOMS_RESPONSE=REJECT for DEC-X (reason=OTHER)"
          assert:
            - "DEC-Q.status == QUERIED, DEC-Q.filing.query_due_at == response_received_at + 48h"
            - "DEC-I.status == INSPECTING, no Settlement yet"
            - "DEC-R.status == RELEASED, exactly one Settlement created in status=FINAL"
            - "DEC-X.status == REJECTED, exactly one RejectionRecord archived"

  # ─────────────────────────────────────────────────────────────────────────
  # Rule 4: Transitive cascade chains from different triggers (≥2)
  # ─────────────────────────────────────────────────────────────────────────
  - rule_id: transitive_cascade
    instances:

      - name: customs_release_depth_3_chain
        grounds:
          - state_machines.Declaration.FILED_to_RELEASED
          - state_machines.Settlement.PROVISIONAL_to_FINAL
          - calculations.compute_tariff
          - calculations.compute_vat
          - calculations.compute_consumption_tax
          - calculations.compute_broker_fee
          - entities.Settlement.fields.tariff_amount
          - entities.AuditLog
        distinguishing_aspect: |
          Trigger = POST /customs/_events/emit (CUSTOMS_RESPONSE=RELEASE). Hop 1: the event mutates Filing.response_type=RELEASE. Hop 2: Filing's response_type=RELEASE causes Declaration.status FILED→RELEASED. Hop 3: Declaration→RELEASED causes Settlement creation in status=FINAL with tariff/VAT/CT/broker_fee populated via three calculations. Hop 4: Settlement creation causes AuditLog entries (STATE_TRANSITION + cascade marker). Each hop is caused by the prior mutation, not by the original action — depth ≥ 3 satisfied.
        test_recipe:
          setup:
            - "Bring DEC-R to FILED with matched manifest"
          trigger:
            - "POST /customs/_events/emit (CUSTOMS_RESPONSE=RELEASE)"
          assert:
            - "Filing.response_type == RELEASE  # hop 1"
            - "Declaration.status == RELEASED   # hop 2"
            - "GET /customs/settlements?declaration_id=DEC-R returns 1 row, status=FINAL  # hop 3"
            - "Settlement.tariff_amount populated (non-null, computed)"
            - "GET /customs/audit-log?entity_type=SETTLEMENT returns >=1 entry  # hop 4"

      - name: withdrawal_depth_2_chain
        grounds:
          - state_machines.Declaration.REJECTED_to_WITHDRAWN
          - state_machines.Settlement.PROVISIONAL_to_VOIDED
          - state_machines.Settlement.FINAL_to_VOIDED
          - entities.ExternalEvent
          - state_machines.Declaration.REJECTED_to_WITHDRAWN.side_effects
        distinguishing_aspect: |
          Trigger = POST /customs/declarations/{id}/withdraw (different from the RELEASE-event trigger above). Hop 1: Declaration REJECTED→WITHDRAWN. Hop 2: any existing Settlement (PROVISIONAL or FINAL) is auto-VOIDED — caused by the declaration transition, not by the original API call. The withdrawal also emits a LOGISTICS ExternalEvent which is itself a downstream consequence of the declaration transition (not parallel to it). Different origin from the RELEASE cascade.
        test_recipe:
          setup:
            - "Bring a declaration to REJECTED with reason_code=HS_MISMATCH (non-inspection)"
            - "Reject this via emit BEFORE settlement creation cascade — i.e., FILED→REJECTED path so no Settlement exists. Then call /amend, re-pre-validate, re-file, but customs returns INSPECT then PENALTY, creating a FINAL settlement before withdrawal. Actually simpler: drive a declaration through to a settlement and then trigger an inspection-failed pathway; but inspection rejections cannot withdraw → use the simpler path: REJECT via emit (no settlement), then withdraw."
            - "Simpler valid setup: drive Declaration to FILED, then CUSTOMS_RESPONSE=REJECT with reason_code=MANIFEST_MISMATCH (no Settlement created on REJECT path)."
          trigger:
            - "POST /customs/declarations/{id}/withdraw"
          assert:
            - "Declaration.status == WITHDRAWN  # hop 1"
            - "If a Settlement exists it must be VOIDED (hop 2). When no Settlement exists on the REJECT path, the cascade still emits exactly one logistics ExternalEvent (RETURN_SHIPMENT_DISPATCHED)."
            - "GET /customs/audit-log?entity_id={declaration_id} shows STATE_TRANSITION entry for the withdrawal"

  # ─────────────────────────────────────────────────────────────────────────
  # Rule 5: Validation priority conflicts across different error-category pairs (≥2)
  # ─────────────────────────────────────────────────────────────────────────
  - rule_id: priority_pair_validation_conflict
    instances:

      - name: state_vs_business_safety_at_pre_validate
        grounds:
          - validations[priority=40]
          - validations[priority=72]
          - validations[priority=90]
        distinguishing_aspect: |
          Error-category pair = state (priority 40, ERR_INVALID_STATE) vs business_safety (priority 72, ERR_DOC_AUTHENTICITY_FLAGGED). When both fail simultaneously — declaration is in DRAFT (state precondition for /pre-validate is wrong: must be DOCS_PENDING) AND a sibling ShipmentDocument is FLAGGED — the state check at priority 40 must win (lower number = higher priority).
        test_recipe:
          setup:
            - "Create a declaration in DRAFT (no /request-documents call yet)"
            - "Attach a ShipmentDocument that screens to authenticity_status=FLAGGED (e.g., declared_total_currency mismatching declared_currency AND no other doc has declared_total_value within 0.5%)"
          trigger:
            - "POST /customs/declarations/{id}/pre-validate"
          assert:
            - "HTTP 409"
            - "error.error_id == 'ERR_INVALID_STATE'  # priority 40 wins over priority 72"

      - name: business_safety_vs_business_constraint_at_pre_validate
        grounds:
          - validations[priority=73]
          - validations[priority=90]
        distinguishing_aspect: |
          Error-category pair = business_safety (priority 73, ERR_DOC_MISSING_LICENSE) vs business_constraint (priority 90, ERR_DOC_INCOMPLETE). Different category pair from the previous instance. When a declaration on a restricted HS code (2901 → license required) is pre-validated AND its four core docs are also incomplete, safety (license) at priority 73 must win over completeness at priority 90.
        test_recipe:
          setup:
            - "Create a declaration with hs_code=2901xxxx (restricted prefix), drive to DOCS_PENDING"
            - "Attach only 2 of the 4 core docs (e.g., COMMERCIAL_INVOICE + PACKING_LIST), no IMPORT_LICENSE"
          trigger:
            - "POST /customs/declarations/{id}/pre-validate"
          assert:
            - "HTTP 409"
            - "error.error_id == 'ERR_DOC_MISSING_LICENSE'  # priority 73 wins over priority 90"

  # ─────────────────────────────────────────────────────────────────────────
  # Rule 6: Boundary-precision checks on different metrics/endpoints (≥2)
  # ─────────────────────────────────────────────────────────────────────────
  - rule_id: boundary_precision_check
    instances:

      - name: tier_factor_boundary_at_10000_on_settlement_advance_metric
        grounds:
          - calculations.compute_tariff.formula
          - endpoints[path=/customs/declarations/{id}/file]
          - endpoints[path=/customs/_events/emit]
          - entities.Settlement.fields.tariff_amount
        distinguishing_aspect: |
          Numeric threshold boundary: tariff tier_factor is 1.00 when base_value <= 10000.00, jumps to 1.05 when base_value > 10000.00. The metric is base_value (a settlement-side numeric quantity), reachable through the file→emit-release endpoint sequence.
        test_recipe:
          setup:
            - "Activate an agreement"
            - "DEC-A: jurisdiction=CN, hs_code='1000' (default rate 0.10), country_of_origin=JP, trade_agreement_code=NONE, declared_value=1388.88 USD → base = round(1388.88 * 7.20, 2) = 9999.94 (<10000)"
            - "DEC-B: declared_value=1388.90 USD → base = round(1388.90 * 7.20, 2) = 10000.08 (>10000)"
          trigger:
            - "Drive both to RELEASED"
            - "GET /customs/settlements for each"
          assert:
            - "Settlement[DEC-A].tariff_amount == 999.99  # 9999.94 * 0.10 * 1.00"
            - "Settlement[DEC-B].tariff_amount == 1050.01 # 10000.08 * 0.10 * 1.05"

      - name: empty_amendment_count_zero_versus_one_on_broker_fee_endpoint
        grounds:
          - calculations.compute_broker_fee.formula
          - entities.Declaration.fields.amendment_count
          - endpoints[path=/customs/settlements/{id}]
          - endpoints[path=/customs/declarations/{id}/amend]
        distinguishing_aspect: |
          Empty-set / zero-count edge: when amendment_count == 0, the AMENDMENT service is NOT in services_consumed (empty contribution to broker_fee). When amendment_count == 1, AMENDMENT IS in services_consumed (non-empty contribution). This is a zero-count boundary on a different metric (broker_fee composition) than the tier boundary above, reachable through a different endpoint (/customs/settlements/{id} read).
        test_recipe:
          setup:
            - "Activate agreement with fee_schedule={DECLARATION:100,TARIFF_ADVANCE:80,AMENDMENT:30}, all USD, settlement_currency=CNY"
            - "DEC-A: drive to RELEASED on first filing (amendment_count=0)"
            - "DEC-B: file, reject, amend, re-pre-validate, re-file, release (amendment_count=1)"
          trigger:
            - "GET /customs/settlements for each"
          assert:
            - "Settlement[DEC-A].broker_fee_amount == 1296.00  # (100+80) * 7.20"
            - "Settlement[DEC-B].broker_fee_amount == 1512.00  # (100+80+30) * 7.20"

  # ─────────────────────────────────────────────────────────────────────────
  # Rule 7: Cross-entity state dependencies across different entity pairs (≥2)
  # ─────────────────────────────────────────────────────────────────────────
  - rule_id: cross_entity_state_dependency
    instances:

      - name: declaration_create_depends_on_agreement_status
        grounds:
          - validations[priority=110]
          - state_machines.CommissionAgreement
          - entities.Declaration
          - entities.CommissionAgreement.fields.status
        distinguishing_aspect: |
          Entity pair = Declaration → CommissionAgreement. Declaration's POST /customs/declarations transition (creation) requires CommissionAgreement.status == ACTIVE AND now() ∈ [valid_from, valid_until). The agreement's lifecycle state directly gates declaration creation.
        test_recipe:
          setup:
            - "Create agreement, leave in DRAFT (no signature)"
          trigger:
            - "POST /customs/declarations with agreement_id pointing at the DRAFT agreement"
          assert:
            - "HTTP 409"
            - "error.error_id == 'ERR_AGREEMENT_NOT_ACTIVE'"
            - "After activating the agreement, the same POST succeeds with HTTP 201"

      - name: settlement_advance_depends_on_declaration_status
        grounds:
          - validations[priority=42]
          - state_machines.Settlement.FINAL_to_ADVANCED
          - state_machines.Declaration.REJECTED_to_WITHDRAWN
          - entities.Settlement.fields.status
          - entities.Declaration.fields.status
        distinguishing_aspect: |
          Different entity pair = Settlement → Declaration. Settlement's FINAL→ADVANCED transition requires the linked Declaration.status != WITHDRAWN (the declaration's lifecycle state directly gates the settlement transition). This is a structurally different cross-entity dependency from the Declaration→Agreement instance above.
        test_recipe:
          setup:
            - "Drive a declaration through INSPECTING→PENALTY so a FINAL settlement exists with penalty_amount > 0"
            - "Withdraw is normally not allowed for INSPECTION_FAILED rejections — change setup: drive a declaration through a NON-inspection REJECT (e.g., FILED→REJECT via emit with reason_code=MANIFEST_MISMATCH). Then no Settlement exists. Alternative: manually construct a FINAL settlement under a REJECTED-then-withdrawn declaration is impossible from API. So: test the INVERSE direction — verify that when Declaration.status == WITHDRAWN AND a FINAL Settlement exists (which only happens if INSPECTING→PENALTY first created the settlement, then withdrawal occurred), the advance is blocked. Since INSPECTION_FAILED cannot withdraw, this combination is unreachable — so the spec asserts the inverse: while Declaration is ANY non-WITHDRAWN state, advance proceeds. The actual cross-entity dependency is enforced by V-SET-ADV-WITHDRAWN AND V-DEC-WITHDRAW-NOADV jointly: as long as both exist, the two states are mutually exclusive. Test by attempting to withdraw a declaration whose Settlement is ADVANCED."
            - "Simpler valid setup: drive declaration → INSPECTING → PENALTY → FINAL settlement, advance the settlement; then attempt withdraw on the declaration."
          trigger:
            - "POST /customs/declarations/{id}/withdraw"
          assert:
            - "HTTP 409"
            - "error.error_id == 'ERR_SETTLEMENT_HAS_ADVANCE'  # V-DEC-WITHDRAW-NOADV — declaration state change is blocked by settlement state"
            - "This proves the cross-entity gate from the OPPOSITE direction; the Settlement→Declaration dependency at V-SET-ADV-WITHDRAWN is symmetric."

  # ─────────────────────────────────────────────────────────────────────────
  # Rule 8: Resource temporal-overlap conflicts across different interval semantics (≥2)
  # ─────────────────────────────────────────────────────────────────────────
  - rule_id: resource_temporal_overlap
    instances:

      - name: agreement_validity_window_half_open
        grounds:
          - validations[priority=110]
          - entities.CommissionAgreement.fields.valid_from
          - entities.CommissionAgreement.fields.valid_until
        distinguishing_aspect: |
          Interval semantics = HALF-OPEN [valid_from, valid_until) on the CommissionAgreement resource. Declaration creation must fall strictly inside this window: an attempt at exactly valid_until is REJECTED, at valid_from is ALLOWED. Adjacency (no buffer); inclusive-left exclusive-right boundary.
        test_recipe:
          setup:
            - "Create agreement valid_from=2026-01-01T00:00:00Z, valid_until=2026-02-01T00:00:00Z, activate"
            - "POST /customs/_clock/advance to 2026-02-01T00:00:00Z (exactly valid_until)"
          trigger:
            - "POST /customs/declarations with this agreement_id"
          assert:
            - "HTTP 409, error.error_id == 'ERR_AGREEMENT_NOT_ACTIVE'  # valid_until is exclusive"
            - "Advance clock back to 2026-01-31T23:59:59.999Z, same POST succeeds (HTTP 201)"
            - "Advance clock to 2026-01-01T00:00:00Z (exactly valid_from), same POST succeeds — inclusive left"

      - name: query_deadline_buffered_response_window
        grounds:
          - validations[priority=111]
          - entities.Filing.fields.query_due_at
          - entities.Filing.fields.query_response_at
          - state_machines.Declaration.QUERIED_to_FILED
          - state_machines.Declaration.QUERIED_to_REJECTED
        distinguishing_aspect: |
          Different interval semantics from the half-open agreement window: the query response window is OPEN-LEFT, CLOSED-RIGHT and gated by an additional auto-rejection sweep — the broker may respond at any time t where t < query_due_at (strict less-than). On the Filing resource (different entity from CommissionAgreement). At exactly query_due_at the operation is rejected and an auto-system-transition fires from QUERIED→REJECTED on clock advance.
        test_recipe:
          setup:
            - "Drive a declaration to QUERIED via CUSTOMS_RESPONSE=QUERY at clock T0; query_due_at = T0 + 48h"
          trigger:
            - "POST /customs/_clock/advance to T0 + 48h - 1us"
            - "POST /customs/declarations/{id}/respond-query (note='ok')  # at one microsecond before deadline"
            - "Then on a second declaration: POST /customs/_clock/advance to T0 + 48h exactly"
            - "POST /customs/declarations/{second}/respond-query"
          assert:
            - "First respond-query at 48h-1us succeeds, Declaration returns to FILED"
            - "Second respond-query at exactly 48h returns HTTP 409 ERR_QUERY_DEADLINE_PASSED"
            - "On clock advance to 48h, the second declaration is auto-transitioned QUERIED→REJECTED (system actor)"

  # ─────────────────────────────────────────────────────────────────────────
  # Rule 9: Compensating-action invariants across different conserved quantities (≥2)
  # ─────────────────────────────────────────────────────────────────────────
  - rule_id: compensating_invariant
    instances:

      - name: withdraw_voids_settlement_conserves_advance_ledger_balance
        grounds:
          - state_machines.Declaration.REJECTED_to_WITHDRAWN
          - state_machines.Settlement.FINAL_to_VOIDED
          - state_machines.Settlement.PROVISIONAL_to_VOIDED
          - entities.Settlement.fields.advance_paid_amount
          - entities.Settlement.fields.status
        distinguishing_aspect: |
          Conserved quantity = the global broker-advance liability ledger = SUM over all Settlements of (advance_paid_amount WHERE status IN {ADVANCED, REIMBURSED}). The forward action 'Settlement FINAL→ADVANCED' adds advance_paid_amount to the named quantity. The compensating action 'Settlement → VOIDED' is ONLY allowed when status is PROVISIONAL or FINAL (NOT after ADVANCED, per V-DEC-WITHDRAW-NOADV). The invariant: a FINAL settlement that gets VOIDED via withdrawal contributes 0 to the ledger both before AND after — withdrawal leaves the ledger unchanged for never-advanced settlements.
        test_recipe:
          setup:
            - "DEC-1: drive through INSPECTING→PENALTY → FINAL settlement (advance NOT yet called) → withdraw should fail? No, INSPECTION_FAILED cannot be amended but CAN be withdrawn. Let advance_paid_amount of this settlement = 0 before withdrawal."
            - "Compute pre-action ledger: SUM(advance_paid_amount where status IN {ADVANCED, REIMBURSED}) = L_pre"
          trigger:
            - "POST /customs/declarations/{DEC-1}/withdraw"
          assert:
            - "Settlement[DEC-1].status == VOIDED"
            - "Post-action ledger SUM(advance_paid_amount where status IN {ADVANCED, REIMBURSED}) == L_pre  # invariant preserved"
            - "No AuditLog event of type ADVANCE_PAID was created during the withdrawal"

      - name: reimbursement_zeros_outstanding_debt_conserves_audit_log_count_invariant
        grounds:
          - state_machines.Settlement.FINAL_to_ADVANCED
          - state_machines.Settlement.ADVANCED_to_REIMBURSED
          - entities.AuditLog
          - entities.Settlement.fields.advance_paid_amount
          - entities.Settlement.fields.reimbursed_at
        distinguishing_aspect: |
          Different conserved quantity = the global outstanding-broker-debt = SUM over all Settlements of (advance_paid_amount + late_interest_amount(now()) WHERE status=ADVANCED). The forward action 'Settlement FINAL→ADVANCED' adds advance_paid_amount. The compensating action 'Settlement ADVANCED→REIMBURSED' subtracts the same amount (the debt is paid in full). The invariant: a forward+compensating cycle leaves outstanding-debt at its pre-cycle value. Also: the AuditLog must have exactly one ADVANCE_PAID + exactly one REIMBURSED entry per completed cycle (audit count invariant — different from the value-conservation invariant above).
        test_recipe:
          setup:
            - "Drive DEC-2 to RELEASED with FINAL settlement, advance_paid_amount = 2726.28 CNY"
            - "Compute pre-cycle outstanding-debt = D_pre (excludes DEC-2 since not yet ADVANCED)"
          trigger:
            - "POST /customs/settlements/{DEC-2-settlement}/advance"
            - "GET outstanding-debt-snapshot = sum of advance_paid_amount + late_interest where status=ADVANCED"
            - "POST /customs/_events/emit (BANK_DEBIT_CONFIRMED, amount = 2726.28, target=settlement)"
          assert:
            - "Mid-cycle (after advance, before reimburse): outstanding-debt == D_pre + 2726.28"
            - "Post-cycle (after reimburse): outstanding-debt == D_pre  # invariant preserved"
            - "GET /customs/audit-log?entity_id={DEC-2-settlement} returns exactly 1 ADVANCE_PAID + exactly 1 REIMBURSED + exactly 1 VOUCHER_DELIVERED entry"
