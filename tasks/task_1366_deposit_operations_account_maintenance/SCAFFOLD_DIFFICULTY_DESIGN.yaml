  - rule_id: priority_pair_validation_conflict
    instances:
      - name: resolve_terminal_order_state_beats_segregation
        grounds:
          - validations[priority=5]
          - validations[priority=6]
          - state_machines.GarnishmentOrder.FUNDS_HELD_to_REMITTED
        distinguishing_aspect: |
          Category pair state vs business_safety: a second resolve on an already
          REMITTED order by the SAME user who received it violates both the
          state precondition and segregation of duties; the state error
          ERR_INVALID_STATE (priority 5) must win over ERR_SEGREGATION_OF_DUTIES
          (priority 6).
        test_recipe:
          setup:
            - "Account 100000; garnishment claim 50000 served 2026-08-01 received by user u-off-1 (as OpsOfficer); clock 2026-08-22 (past answer deadline 2026-08-21)"
            - "First resolve attempt by u-off-1 acting as OpsManager is rejected for segregation; u-mgr-2 then remits successfully"
          setup_api_calls:
            - call: "POST /bank/accounts"
              payload: { primary_owner_name: "Prio P", owner_tax_id: "T12", ownership_type: INDIVIDUAL, product_code: SAVINGS, rate_bps: 0, opening_deposit_cents: 100000 }
              as: OpsOfficer
              captures: { acct: $.data.id }
            - call: "POST /bank/accounts/${acct}/garnishments"
              payload: { order_type: GARNISHMENT, creditor_name: "CredCo", amount_cents: 50000, served_date: "2026-08-01", exemption_method: FEDERAL_LOOKBACK }
              as: OpsOfficer
              as_user_id: "u-off-1"
              captures: { ord: $.data.id }
            - call: "POST /bank/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-22T00:00:00Z" }
              as: OpsManager
            - call: "POST /bank/garnishments/${ord}/resolve"
              payload: { resolution: REMITTED }
              as: OpsManager
              as_user_id: "u-off-1"
              captures: { err_sod: $.data.error_id }
            - call: "POST /bank/garnishments/${ord}/resolve"
              payload: { resolution: REMITTED }
              as: OpsManager
              as_user_id: "u-mgr-2"
              captures: { st_ok: $.data.status }
          trigger:
            - call: "POST /bank/garnishments/${ord}/resolve"
              payload: { resolution: RELEASED }
              as: OpsManager
              as_user_id: "u-off-1"
              captures: { err_final: $.data.error_id }
          assert:
            - "${err_sod} == ERR_SEGREGATION_OF_DUTIES"
            - "${st_ok} == REMITTED"
            - "${err_final} == ERR_INVALID_STATE"

      - name: withdrawal_legal_hold_beats_insufficient_funds
        grounds:
          - validations[priority=6]
          - validations[priority=9]
          - calculations.available_balance_reconciliation
        distinguishing_aspect: |
          Category pair business_safety vs business_fiscal (different pair from
          the sibling instance): a WITHDRAWAL on a LEGAL_HOLD account whose
          amount also exceeds available_balance violates both; the safety error
          ERR_ACCOUNT_RESTRICTED (priority 6) must win over
          ERR_INSUFFICIENT_AVAILABLE_FUNDS (priority 9).
        test_recipe:
          setup:
            - "Account balance 1000; garnishment claim 5000 holds the full balance (held 1000, available 0), restriction LEGAL_HOLD"
          setup_api_calls:
            - call: "POST /bank/accounts"
              payload: { primary_owner_name: "Hold H", owner_tax_id: "T13", ownership_type: INDIVIDUAL, product_code: SAVINGS, rate_bps: 0, opening_deposit_cents: 1000 }
              as: OpsOfficer
              captures: { acct: $.data.id }
            - call: "POST /bank/accounts/${acct}/garnishments"
              payload: { order_type: TAX_LEVY, creditor_name: "RevAuth", amount_cents: 5000, served_date: "2026-08-01", exemption_method: FEDERAL_LOOKBACK }
              as: OpsOfficer
              captures: { ord: $.data.id, held: $.data.held_amount_cents }
          trigger:
            - call: "POST /bank/accounts/${acct}/transactions"
              payload: { txn_type: WITHDRAWAL, amount_cents: 500, customer_initiated: true }
              as: OpsOfficer
              captures: { err: $.data.error_id }
          assert:
            - "${held} == 1000"
            - "DepositAccount.${acct}.available_balance_cents == 0"
            - "${err} == ERR_ACCOUNT_RESTRICTED"

  - rule_id: boundary_precision_check
    instances:
      - name: dormancy_threshold_day_364_vs_365
        grounds:
          - calculations.dormancy_evaluation
          - state_machines.DepositAccount
        distinguishing_aspect: |
          Metric: whole days inactive; endpoint: POST /bank/ops/daily-sweep.
          Inclusive boundary: at exactly 364 days the account stays OPEN; at
          exactly 365 days it flips to DORMANT and the entry fee posts.
        test_recipe:
          setup:
            - "Account balance 100000 rate 0, last customer activity 2026-08-01"
          setup_api_calls:
            - call: "POST /bank/accounts"
              payload: { primary_owner_name: "Bnd B", owner_tax_id: "T14", ownership_type: INDIVIDUAL, product_code: SAVINGS, rate_bps: 0, opening_deposit_cents: 100000 }
              as: OpsOfficer
              captures: { acct: $.data.id }
            - call: "POST /bank/_clock/set_current_utc"
              payload: { to_iso8601: "2027-07-31T00:00:00Z" }
              as: OpsManager
            - call: "POST /bank/ops/daily-sweep"
              payload: {}
              as: OpsManager
              captures: { dormant_364: $.data.newly_dormant }
            - call: "GET /bank/accounts/${acct}"
              payload: {}
              as: OpsManager
              captures: { lc_364: $.data.lifecycle_status }
          trigger:
            - call: "POST /bank/_clock/set_current_utc"
              payload: { to_iso8601: "2027-08-01T00:00:00Z" }
              as: OpsManager
            - call: "POST /bank/ops/daily-sweep"
              payload: {}
              as: OpsManager
              captures: { dormant_365: $.data.newly_dormant }
            - call: "GET /bank/accounts/${acct}"
              payload: {}
              as: OpsManager
              captures: { lc_365: $.data.lifecycle_status, bal_365: $.data.balance_cents }
          assert:
            - "${dormant_364} == 0"
            - "${lc_364} == OPEN"
            - "${dormant_365} == 1"
            - "${lc_365} == DORMANT"
            - "${bal_365} == 99500"

      - name: garnishment_remit_deadline_strictly_after
        grounds:
          - state_machines.GarnishmentOrder.FUNDS_HELD_to_REMITTED
          - entities.GarnishmentOrder.fields.answer_deadline_date
        distinguishing_aspect: |
          Metric: deadline date (different metric from days-inactive above);
          endpoint: POST /bank/garnishments/{orderId}/resolve (different
          endpoint from daily-sweep). Strict inequality: remit ON the
          answer_deadline_date is rejected; remit one day later succeeds.
        test_recipe:
          setup:
            - "Account 100000; garnishment claim 50000 served 2026-08-01 (answer_deadline_date 2026-08-21), no benefit deposits -> collectible 50000"
          setup_api_calls:
            - call: "POST /bank/accounts"
              payload: { primary_owner_name: "Dead D", owner_tax_id: "T15", ownership_type: INDIVIDUAL, product_code: SAVINGS, rate_bps: 0, opening_deposit_cents: 100000 }
              as: OpsOfficer
              captures: { acct: $.data.id }
            - call: "POST /bank/accounts/${acct}/garnishments"
              payload: { order_type: GARNISHMENT, creditor_name: "CredCo", amount_cents: 50000, served_date: "2026-08-01", exemption_method: FEDERAL_LOOKBACK }
              as: OpsOfficer
              as_user_id: "u-off-1"
              captures: { ord: $.data.id, deadline: $.data.answer_deadline_date }
            - call: "POST /bank/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-21T00:00:00Z" }
              as: OpsManager
            - call: "POST /bank/garnishments/${ord}/resolve"
              payload: { resolution: REMITTED }
              as: OpsManager
              as_user_id: "u-mgr-2"
              captures: { err_on: $.data.error_id }
          trigger:
            - call: "POST /bank/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-22T00:00:00Z" }
              as: OpsManager
            - call: "POST /bank/garnishments/${ord}/resolve"
              payload: { resolution: REMITTED }
              as: OpsManager
              as_user_id: "u-mgr-2"
              captures: { st: $.data.status, remitted: $.data.remitted_amount_cents, released: $.data.released_amount_cents }
            - call: "GET /bank/accounts/${acct}"
              payload: {}
              as: OpsManager
              captures: { bal: $.data.balance_cents, restr: $.data.restriction_status }
          assert:
            - "${deadline} == 2026-08-21"
            - "${err_on} == ERR_ANSWER_PERIOD_NOT_ELAPSED"
            - "${st} == REMITTED"
            - "${remitted} == 50000"
            - "${released} == 0"
            - "${bal} == 50000"
            - "${restr} == NONE"

  - rule_id: cross_entity_state_dependency
    instances:
      - name: title_approval_gated_on_document_verification
        grounds:
          - state_machines.TitleChangeRequest.SUBMITTED_to_APPROVED
          - entities.TitleChangeRequest.fields.required_doc_types
          - state_machines.AccountDocument.SUBMITTED_to_VERIFIED
        distinguishing_aspect: |
          Entity pair TitleChangeRequest x AccountDocument: APPROVE is gated on
          a VERIFIED AccountDocument of every computed required_doc_type on the
          account; before verification it fails ERR_DOCUMENTS_INCOMPLETE, after
          verification it succeeds and mutates the account.
        test_recipe:
          setup:
            - "Account INDIVIDUAL balance 50000; title change to TRUST (required_doc_types [TRUST_AGREEMENT]) SUBMITTED"
          setup_api_calls:
            - call: "POST /bank/accounts"
              payload: { primary_owner_name: "Tru T", owner_tax_id: "T16", ownership_type: INDIVIDUAL, product_code: SAVINGS, rate_bps: 0, opening_deposit_cents: 50000 }
              as: OpsOfficer
              captures: { acct: $.data.id, v0: $.data.version }
            - call: "POST /bank/accounts/${acct}/title-changes"
              payload: { requested_ownership_type: TRUST, expected_account_version: "${v0}" }
              as: OpsOfficer
              as_user_id: "u-off-1"
              captures: { req: $.data.id, req_docs: $.data.required_doc_types }
            - call: "POST /bank/title-changes/${req}/approve"
              payload: {}
              as: OpsManager
              as_user_id: "u-mgr-2"
              captures: { err_docs: $.data.error_id }
            - call: "POST /bank/accounts/${acct}/documents"
              payload: { doc_type: TRUST_AGREEMENT, reference_number: "TA-1" }
              as: OpsOfficer
              captures: { doc: $.data.id }
            - call: "POST /bank/documents/${doc}/review"
              payload: { decision: VERIFIED }
              as: OpsManager
          trigger:
            - call: "POST /bank/title-changes/${req}/approve"
              payload: {}
              as: OpsManager
              as_user_id: "u-mgr-2"
              captures: { st: $.data.status }
            - call: "GET /bank/accounts/${acct}"
              payload: {}
              as: OpsManager
              captures: { own: $.data.ownership_type }
          assert:
            - "${req_docs} == [TRUST_AGREEMENT]"
            - "${err_docs} == ERR_DOCUMENTS_INCOMPLETE"
            - "${st} == APPROVED"
            - "${own} == TRUST"

      - name: account_closure_gated_on_garnishment_state
        grounds:
          - state_machines.DepositAccount
          - state_machines.GarnishmentOrder.FUNDS_HELD_to_RELEASED
          - validations[priority=6]
        distinguishing_aspect: |
          Entity pair DepositAccount x GarnishmentOrder (different pair from the
          sibling instance): close is rejected ERR_CLOSURE_BLOCKED while any
          order is FUNDS_HELD; once the order resolves RELEASED, closure with a
          freshly observed version succeeds and pays out the full residual.
        test_recipe:
          setup:
            - "Account 80000 rate 0; garnishment claim 30000 served 2026-08-01 in FUNDS_HELD (held 30000, available 50000)"
          setup_api_calls:
            - call: "POST /bank/accounts"
              payload: { primary_owner_name: "Cls C", owner_tax_id: "T17", ownership_type: INDIVIDUAL, product_code: SAVINGS, rate_bps: 0, opening_deposit_cents: 80000 }
              as: OpsOfficer
              captures: { acct: $.data.id }
            - call: "POST /bank/accounts/${acct}/garnishments"
              payload: { order_type: GARNISHMENT, creditor_name: "CredCo", amount_cents: 30000, served_date: "2026-08-01", exemption_method: FEDERAL_LOOKBACK }
              as: OpsOfficer
              as_user_id: "u-off-1"
              captures: { ord: $.data.id }
            - call: "GET /bank/accounts/${acct}"
              payload: {}
              as: OpsManager
              captures: { v_blocked: $.data.version }
            - call: "POST /bank/accounts/${acct}/close"
              payload: { expected_account_version: "${v_blocked}" }
              as: OpsOfficer
              captures: { err_close: $.data.error_id }
            - call: "POST /bank/garnishments/${ord}/resolve"
              payload: { resolution: RELEASED }
              as: OpsManager
              as_user_id: "u-mgr-2"
          trigger:
            - call: "GET /bank/accounts/${acct}"
              payload: {}
              as: OpsManager
              captures: { v_free: $.data.version, restr_free: $.data.restriction_status }
            - call: "POST /bank/accounts/${acct}/close"
              payload: { expected_account_version: "${v_free}" }
              as: OpsOfficer
              captures: { lc: $.data.lifecycle_status, payout: $.data.closure_payout_cents, dest: $.data.closure_payout_destination }
          assert:
            - "${err_close} == ERR_CLOSURE_BLOCKED"
            - "${restr_free} == NONE"
            - "${v_free} != ${v_blocked}"
            - "${lc} == CLOSED"
            - "${payout} == 80000"
            - "${dest} == OWNER"
            - "DepositAccount.${acct}.balance_cents == 0"

  - rule_id: resource_temporal_overlap
    instances:
      - name: statement_cycle_half_open_adjacency
        grounds:
          - entities.StatementCycle.fields.cycle_start
          - validations[priority=7]
        distinguishing_aspect: |
          Interval semantics: HALF-OPEN [cycle_start, cycle_end) on the account's
          statement calendar — a cycle starting exactly at the predecessor's
          cycle_end is adjacency (allowed), while a cycle straddling the
          predecessor's interior is rejected ERR_STATEMENT_PERIOD_OVERLAP.
        test_recipe:
          setup:
            - "Account with statement cycle [2026-08-01, 2026-09-01) already scheduled"
          setup_api_calls:
            - call: "POST /bank/accounts"
              payload: { primary_owner_name: "Stmt S", owner_tax_id: "T18", ownership_type: INDIVIDUAL, product_code: SAVINGS, rate_bps: 0, opening_deposit_cents: 50000 }
              as: OpsOfficer
              captures: { acct: $.data.id }
            - call: "POST /bank/accounts/${acct}/statement-cycles"
              payload: { cycle_start: "2026-08-01", cycle_end: "2026-09-01" }
              as: OpsOfficer
              captures: { cyc1: $.data.id }
          trigger:
            - call: "POST /bank/accounts/${acct}/statement-cycles"
              payload: { cycle_start: "2026-09-01", cycle_end: "2026-10-01" }
              as: OpsOfficer
              captures: { cyc2: $.data.id, st2: $.data.status }
            - call: "POST /bank/accounts/${acct}/statement-cycles"
              payload: { cycle_start: "2026-08-15", cycle_end: "2026-09-15" }
              as: OpsOfficer
              captures: { err_overlap: $.data.error_id }
          assert:
            - "${st2} == SCHEDULED"
            - "StatementCycle.${cyc2}.cycle_start == 2026-09-01"
            - "${err_overlap} == ERR_STATEMENT_PERIOD_OVERLAP"

      - name: garnishment_service_window_closed_interval
        grounds:
          - entities.GarnishmentOrder.fields.served_date
          - entities.GarnishmentOrder.fields.answer_deadline_date
          - validations[priority=7]
        distinguishing_aspect: |
          Interval semantics: CLOSED [served_date, answer_deadline_date] on the
          account's legal-order resource — different geometry from the
          half-open statement cycle: a new order served exactly ON the prior
          order's deadline date still collides (adjacency is NOT an escape
          hatch), and only a serve date strictly after the deadline clears.
        test_recipe:
          setup:
            - "Account 500000 with garnishment order1 served 2026-08-01 (window [2026-08-01, 2026-08-21]) in FUNDS_HELD"
          setup_api_calls:
            - call: "POST /bank/accounts"
              payload: { primary_owner_name: "Garn G", owner_tax_id: "T19", ownership_type: INDIVIDUAL, product_code: SAVINGS, rate_bps: 0, opening_deposit_cents: 500000 }
              as: OpsOfficer
              captures: { acct: $.data.id }
            - call: "POST /bank/accounts/${acct}/garnishments"
              payload: { order_type: GARNISHMENT, creditor_name: "CredCo", amount_cents: 100000, served_date: "2026-08-01", exemption_method: FEDERAL_LOOKBACK }
              as: OpsOfficer
              captures: { ord1: $.data.id }
            - call: "POST /bank/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-22T00:00:00Z" }
              as: OpsManager
          trigger:
            - call: "POST /bank/accounts/${acct}/garnishments"
              payload: { order_type: TAX_LEVY, creditor_name: "RevAuth", amount_cents: 150000, served_date: "2026-08-21", exemption_method: STATE_MINIMUM }
              as: OpsOfficer
              captures: { err_conflict: $.data.error_id }
            - call: "POST /bank/accounts/${acct}/garnishments"
              payload: { order_type: TAX_LEVY, creditor_name: "RevAuth", amount_cents: 150000, served_date: "2026-08-22", exemption_method: STATE_MINIMUM }
              as: OpsOfficer
              captures: { ord2: $.data.id, held2: $.data.held_amount_cents }
            - call: "GET /bank/accounts/${acct}"
              payload: {}
              as: OpsManager
              captures: { held_total: $.data.total_held_cents, avail: $.data.available_balance_cents }
          assert:
            - "${err_conflict} == ERR_LEGAL_ORDER_WINDOW_CONFLICT"
            - "${held2} == 150000"
            - "${held_total} == 250000"
            - "${avail} == 250000"

  - rule_id: compensating_invariant
    instances:
      - name: garnishment_hold_conservation_invariant
        grounds:
          - state_machines.GarnishmentOrder.FUNDS_HELD_to_REMITTED
          - calculations.available_balance_reconciliation
          - calculations.exempt_funds_analysis
        distinguishing_aspect: |
          Conserved quantity: legal-hold funds. The hold placed at receipt is
          fully accounted at resolve — held_amount(50000) == remitted(20000) +
          released(30000) — and the account balance delta equals exactly the
          remittance: 100000 before hold == 80000 after resolve + 20000 sent.
        test_recipe:
          setup:
            - "Account 100000 with one FEDERAL_BENEFIT_DEPOSIT 30000 in lookback; garnishment claim 50000 served 2026-08-10 (held 50000, exempt 30000, collectible 20000); clock past deadline"
          setup_api_calls:
            - call: "POST /bank/accounts"
              payload: { primary_owner_name: "Inv I", owner_tax_id: "T20", ownership_type: INDIVIDUAL, product_code: SAVINGS, rate_bps: 0, opening_deposit_cents: 100000 }
              as: OpsOfficer
              captures: { acct: $.data.id }
            - call: "POST /bank/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: OpsManager
            - call: "POST /bank/accounts/${acct}/transactions"
              payload: { txn_type: FEDERAL_BENEFIT_DEPOSIT, amount_cents: 30000, customer_initiated: false, posted_date: "2026-08-05" }
              as: OpsOfficer
            - call: "POST /bank/accounts/${acct}/garnishments"
              payload: { order_type: GARNISHMENT, creditor_name: "CredCo", amount_cents: 50000, served_date: "2026-08-10", exemption_method: FEDERAL_LOOKBACK }
              as: OpsOfficer
              as_user_id: "u-off-1"
              captures: { ord: $.data.id, held: $.data.held_amount_cents, exempt: $.data.exempt_amount_cents, collect: $.data.collectible_cents }
            - call: "POST /bank/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: OpsManager
          trigger:
            - call: "POST /bank/garnishments/${ord}/resolve"
              payload: { resolution: REMITTED }
              as: OpsManager
              as_user_id: "u-mgr-2"
              captures: { remitted: $.data.remitted_amount_cents, released: $.data.released_amount_cents }
            - call: "GET /bank/accounts/${acct}"
              payload: {}
              as: OpsManager
              captures: { bal: $.data.balance_cents, held_total: $.data.total_held_cents }
          assert:
            - "${held} == 50000"
            - "${exempt} == 30000"
            - "${collect} == 20000"
            - "${remitted} == 20000"
            - "${released} == 30000"
            - "${held} == ${remitted} + ${released}"
            - "${bal} == 80000"
            - "${held_total} == 0"

      - name: estate_release_conservation_invariant
        grounds:
          - state_machines.DeceasedCase.RELEASE_PENDING_to_RELEASED
          - calculations.estate_release_amount
        distinguishing_aspect: |
          Conserved quantity: estate funds (different quantity from legal-hold
          funds). At approve-release, balance before (150000) ==
          release_amount (100000) + residual sweep (50000); closure_payout
          (150000) == balance before; final balance == 0 — every cent reaches
          the estate exactly once across the ESTATE_RELEASE + CLOSURE_PAYOUT
          transaction pair.
        test_recipe:
          setup:
            - "Account 100000 rate 0; death verified (snapshot 100000 + 0); post-death FEDERAL_BENEFIT_DEPOSIT 50000 on 2026-08-05; release initiated DATE_OF_DEATH (release_amount 100000); VERIFIED LETTERS_TESTAMENTARY present"
          setup_api_calls:
            - call: "POST /bank/accounts"
              payload: { primary_owner_name: "Est E", owner_tax_id: "T21", ownership_type: INDIVIDUAL, product_code: SAVINGS, rate_bps: 0, opening_deposit_cents: 100000 }
              as: OpsOfficer
              captures: { acct: $.data.id }
            - call: "POST /bank/accounts/${acct}/documents"
              payload: { doc_type: DEATH_CERTIFICATE, reference_number: "DC-E" }
              as: OpsOfficer
              captures: { doc_dc: $.data.id }
            - call: "POST /bank/accounts/${acct}/documents"
              payload: { doc_type: LETTERS_TESTAMENTARY, reference_number: "LT-E" }
              as: OpsOfficer
              captures: { doc_lt: $.data.id }
            - call: "POST /bank/documents/${doc_dc}/review"
              payload: { decision: VERIFIED }
              as: OpsManager
            - call: "POST /bank/documents/${doc_lt}/review"
              payload: { decision: VERIFIED }
              as: OpsManager
            - call: "POST /bank/accounts/${acct}/deceased-cases"
              payload: { decedent_name: "Est E", date_of_death: "2026-08-01", reported_by: "Kin E" }
              as: OpsOfficer
              captures: { case: $.data.id }
            - call: "POST /bank/deceased-cases/${case}/verify"
              payload: {}
              as: OpsManager
            - call: "POST /bank/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: OpsManager
            - call: "POST /bank/accounts/${acct}/transactions"
              payload: { txn_type: FEDERAL_BENEFIT_DEPOSIT, amount_cents: 50000, customer_initiated: false, posted_date: "2026-08-05" }
              as: OpsOfficer
            - call: "POST /bank/deceased-cases/${case}/initiate-release"
              payload: { release_variant: DATE_OF_DEATH, estate_representative_name: "Exec E" }
              as: OpsOfficer
              as_user_id: "u-off-1"
              captures: { rel: $.data.release_amount_cents }
          trigger:
            - call: "POST /bank/deceased-cases/${case}/approve-release"
              payload: {}
              as: OpsManager
              as_user_id: "u-mgr-2"
              captures: { case_st: $.data.status }
            - call: "GET /bank/accounts/${acct}"
              payload: {}
              as: OpsManager
              captures: { lc: $.data.lifecycle_status, bal: $.data.balance_cents, payout: $.data.closure_payout_cents, dest: $.data.closure_payout_destination }
            - call: "GET /bank/accounts/${acct}/transactions"
              payload: {}
              as: OpsManager
              captures: { txn2_type: "$.data[2].txn_type", txn2_amt: "$.data[2].amount_cents", txn3_type: "$.data[3].txn_type", txn3_amt: "$.data[3].amount_cents"}
          assert:
            - "${rel} == 100000"
            - "${case_st} == RELEASED"
            - "${lc} == CLOSED"
            - "${bal} == 0"
            - "${payout} == 150000"
            - "${dest} == ESTATE"
            - "${txn2_type} == ESTATE_RELEASE"
            - "${txn2_amt} == 100000"
            - "${txn3_type} == CLOSURE_PAYOUT"
            - "${txn3_amt} == 50000"
            - "100000 + 50000 == ${payout}"
