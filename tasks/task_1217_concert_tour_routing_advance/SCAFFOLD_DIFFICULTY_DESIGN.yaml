            - call: "POST /tours/${tour_id}/shows/${show_id}/confirm"
              payload: { expected_tour_version: "${tv}" }
              as: TourManager
            - call: "GET /tours/${tour_id}/venues/${venue_id}"
              payload: {}
              as: TourManager
              captures: { booked_mid: $.data.booked_dates }
            - call: "POST /tours/${tour_id}/shows/${show_id}/cancel"
              payload: {}
              as: TourManager
            - call: "GET /tours/${tour_id}/venues/${venue_id}"
              payload: {}
              as: TourManager
              captures: { booked_post: $.data.booked_dates }
          assert:
            - "booked_pre == [] (empty before confirm)"
            - "booked_mid == ['2026-08-10'] (added by confirm)"
            - "booked_post == [] (cancel compensates exactly; invariant: confirm+cancel = identity on booked_dates)"

      - name: tour_projected_gross_conserved_across_confirm_cancel
        grounds:
          - entities.Tour.fields.projected_gross_cents
          - state_machines.Show.HOLD_PLACED_to_CONFIRMED
          - state_machines.Show.CONFIRMED_to_CANCELLED
          - calculations.projected_show_pnl
        distinguishing_aspect: |
          Conserved quantity: Tour.projected_gross_cents. Confirm(S) adds S's
          projected contribution; cancel(S) removes it. Net effect of
          confirm+cancel MUST leave projected_gross_cents equal to its
          pre-confirm value (zero drift). Different conserved quantity from
          sibling instance (monetary aggregate, not set membership).
        test_recipe:
          setup:
            - "Tour with no confirmed shows; projected_gross_cents = 0"
            - "Show S at capacity=1000, price=10000 (pre-on-sale variant ⇒ 6500000)"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: TourManager
            - call: "POST /tours"
              payload: { tour_name: "TInv2", artist_name: "A", window_start_date: "2026-07-01", window_end_date: "2026-09-01" }
              as: TourManager
              captures: { tour_id: $.data.id }
            - call: "POST /tours/${tour_id}/markets"
              payload: { market_code: "KC", metro_name: "Kansas City", country_code: "US", radius_miles: 50, exclusivity_window_days: 30, territory_rank: 1 }
              as: TourManager
              captures: { market_id: $.data.id }
            - call: "POST /tours/${tour_id}/venues"
              payload: { market_id: "${market_id}", venue_name: "T-Mobile", capacity: 1000, base_rent_cents: 200000, curfew_local_time: "23:00", available_dates: ["2026-08-12"] }
              as: TourManager
              captures: { venue_id: $.data.id }
            - call: "POST /tours/${tour_id}/start-routing"
              payload: {}
              as: TourManager
            - call: "POST /tours/${tour_id}/shows"
              payload: { market_id: "${market_id}", venue_id: "${venue_id}", show_date: "2026-08-12", on_sale_at: "2026-07-15T00:00:00Z", avg_ticket_price_cents: 10000 }
              as: TourManager
              captures: { show_id: $.data.id }
            - call: "POST /tours/${tour_id}/shows/${show_id}/holds"
              payload: { promoter_name: "P", guarantee_cents: 1000000, versus_pct: 80 }
              as: Promoter
              captures: { hold_id: $.data.id }
            - call: "POST /tours/${tour_id}/shows/${show_id}/holds/${hold_id}/accept"
              payload: {}
              as: Promoter
            - call: "GET /tours/${tour_id}"
              payload: {}
              as: TourManager
              captures: { gross_pre: $.data.projected_gross_cents, tv: $.data.version }
          trigger:
            - call: "POST /tours/${tour_id}/shows/${show_id}/confirm"
              payload: { expected_tour_version: "${tv}" }
              as: TourManager
            - call: "GET /tours/${tour_id}"
              payload: {}
              as: TourManager
              captures: { gross_mid: $.data.projected_gross_cents }
            - call: "POST /tours/${tour_id}/shows/${show_id}/cancel"
              payload: {}
              as: TourManager
            - call: "GET /tours/${tour_id}"
              payload: {}
              as: TourManager
              captures: { gross_post: $.data.projected_gross_cents }
          assert:
            - "gross_pre == 0"
            - "gross_mid == 6500000 (1000*10000*0.65 pre-on-sale)"
            - "gross_post == 0 (cancel compensates; invariant: confirm+cancel = identity on projected_gross_cents)"
