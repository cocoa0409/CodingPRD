      - name: company_closure_cascade_rescinds_offer_and_credits_encumbrance
        grounds:
          - state_machines.DutyShift.HIRING_to_HIRING
          - state_machines.Vacancy.OFFERING_to_CLOSED_BY_COMPANY_CLOSURE
          - state_machines.OvertimeOffer.OFFERED_to_RESCINDED
          - calculations.company_closure_selector
          - calculations.ot_committed_ledger
          - concurrency_rules[company-closure-stale-duty-shift]
          - endpoints["POST /fire-ops/duty-shifts/{duty_shift_id}/company-closure"]
        distinguishing_aspect: |
          A depth-4 cascade from a different trigger — company closure, not leave
          adjudication: the closure removes the company (hop 1); that removal
          closes the company's OFFERING vacancy (hop 2); the vacancy closure
          rescinds the OFFERED offer (hop 3); the rescission credits 164736 cents
          back to Station.ot_committed_cents and decrements the member's
          pending_offer_count (hop 4).
        test_recipe:
          setup:
            - "Station 48 with staffing floor 1, a 9,000,000-cent budget, and two companies: ENGINE-48 (minimum_crew_size 4, requires PARAMEDIC, closure_priority 10, closure_exempt true) and HAZMAT-48 (minimum_crew_size 1, requires HAZMAT_TECH, closure_priority 20, closure_exempt false), giving required_staffing 5."
            - "One ACTIVE member ff48a holding HAZMAT_TECH, platoon C, Kelly 1, hourly rate 4237 cents, and a VOLUNTARY_OT roster scoped NONE."
            - "The 2026-08-11 shift is published with five OPEN vacancies and no assignments at all, so certification_gap_count is 2 and staffing_posture is CRITICAL."
            - "A VOLUNTARY offer of 164736 cents sits OFFERED against the HAZMAT-48 seat, so that vacancy is OFFERING, Station.ot_committed_cents is 164736 and ff48a.pending_offer_count is 1."
          setup_api_calls:
            - call: "POST /fire-ops/stations"
              payload: { name: "Station 48", battalion_code: "B6", minimum_staffing_floor: 1, fiscal_ot_budget_cents: 9000000, fiscal_period_start_date: "2026-08-01", fiscal_period_end_date: "2026-09-30" }
