  # ===========================================================================
  - section: calculations
    instances:

      - name: blend_feasibility_mn_floor_violation
        claim_type: correct_result
        grounds:
          - calculations.blend_feasibility
          - errors.ERR_BLEND_INFEASIBLE
        distinguishing_aspect: "The Mn side of blend feasibility is a FLOOR: a candidate line dragging mn_blend strictly below Grade.mn_min_pct rejects with ERR_BLEND_INFEASIBLE even when Cu is comfortably inside the ceiling — the floor and ceiling are independent checks."
        test_recipe:
          setup: ["Default logical clock. Mill, contract with lot L1 (10t, cu 0.001, mn 0.0021) and lot L2 (10t, cu 0.001, mn 0.0005). Grade mn_min 0.002. Heat charged 2t from L1 (mn_blend 0.0021 >= 0.002, OK)."]
          setup_api_calls:
            - call: "POST /mills"
              payload: { name: "Gallatin Energy Mill", division: "ENERGY", furnace_capacity_tons: 150, caster_rate_tph: 80 }
              as: PlantManager
              captures: { mill_id: $.data.id }
            - call: "POST /mills/${mill_id}/procurement-contracts"
              payload: { supplier_name: "River Metals Recycling", grade_category: "SHREDDED", contract_type: "FIXED", contract_price_cents: 39000, committed_tons: 100 }
              as: ProcurementOfficer
              captures: { contract_id: $.data.id }
            - call: "POST /mills/${mill_id}/procurement-contracts/${contract_id}/scrap-lots"
              payload: { received_on: "2026-09-03", tons_received: 10, moisture_pct: 0.0, cu_pct: 0.001, mn_pct: 0.0021 }
              as: ProcurementOfficer
              captures: { lot_mid_mn: $.data.id }
            - call: "POST /mills/${mill_id}/procurement-contracts/${contract_id}/scrap-lots"
              payload: { received_on: "2026-09-04", tons_received: 10, moisture_pct: 0.0, cu_pct: 0.001, mn_pct: 0.0005 }
              as: ProcurementOfficer
              captures: { lot_low_mn: $.data.id }
            - call: "POST /mills/${mill_id}/grades"
              payload: { grade_code: "GR-MN", product_form: "BILLET", grade_group: "GROUP_A", certification_class: "STANDARD", cu_max_pct: 0.004, mn_min_pct: 0.002, mn_max_pct: 0.012, requires_energy_certified: false }
              as: Metallurgist
              captures: { grade_id: $.data.id }
            - call: "POST /mills/${mill_id}/heats"
              payload: { heat_number: "H-MN", grade_id: "${grade_id}", target_tap_weight_tons: 10, planned_tap_at: "2026-09-15T12:00:00Z" }
              as: MillOperator
              captures: { heat_id: $.data.id }
            - call: "POST /mills/${mill_id}/heats/${heat_id}/charges"
              payload: { scrap_lot_id: "${lot_mid_mn}", tons: 2 }
              as: MillOperator
          trigger:
            - call: "POST /mills/${mill_id}/heats/${heat_id}/charges"
              payload: { scrap_lot_id: "${lot_low_mn}", tons: 8 }
              as: MillOperator
              captures: { err: $.data.error_id }
          assert:
            - "the trigger rejects with err == ERR_BLEND_INFEASIBLE: mn_blend = (2*0.0021 + 8*0.0005)/10 = 0.00082, strictly below mn_min 0.002"
            - "Cu plays no part in the rejection (cu_blend 0.001 < 0.004 throughout) — the floor alone drives the error"
            - "Heat.${heat_id} still has exactly 1 charge line and ScrapLot.${lot_low_mn}.remaining_tons is still 10"

      - name: scrap_surcharge_credit_sign_and_benchmark
        claim_type: correct_result
        grounds:
          - calculations.scrap_surcharge_credit
          - state_machines.Heat.CHARGED_to_MELTDOWN_LOCKED
        distinguishing_aspect: "The credit is signed: a mix priced above the 40000/t benchmark yields +60000 (5t@50000 + 5t@42000 vs 10t@40000); a below-benchmark mix would go negative — the sign convention is asserted, not just the magnitude."
        test_recipe:
          setup: ["Default logical clock. Mill, contract A FIXED 50000 (lot 5t), contract B FIXED 42000 (lot 5t), grade GR40. Heat charged with both lots (5t each)."]
