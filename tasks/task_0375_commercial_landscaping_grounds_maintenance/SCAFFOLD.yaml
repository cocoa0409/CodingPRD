# =============================================================================
# Scaffold: Commercial Landscaping & Grounds Maintenance (Expert)
# =============================================================================

scenario: |
  Commercial Landscaping & Grounds Maintenance: site contract & service plan,
  crew route & schedule, mowing/seasonal (mulch/aeration) services, irrigation &
  enhancement add-on, equipment & crew time, snow/storm add-on, quality
  inspection, recurring billing

domain_name: commercial-landscaping-grounds-maintenance
api_prefix: /v1

complexity_profile:
  primary_archetype: workflow_orchestration
  secondary_archetype: temporal_windowing
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - derived_field_reconciliation

  entity_topology: flat
  # All entities are peer collections under /v1 with foreign-key references in
  # the body (service_account_id, service_contract_id, route_schedule_id, ...).
  # No URL nesting; cross-aggregate links (ServiceVisit -> Crew/RouteSchedule/Plan,
  # EquipmentReservation -> Asset/Visit) are flat FKs. This is the prioritized
  # flat topology, not hierarchical.

  state_machine_shape: parallel
  # ServiceVisit carries two INDEPENDENT dimensions: execution_status (field-work
  # lifecycle SCHEDULED->IN_PROGRESS->COMPLETED/CANCELLED) x billing_status (money
  # lifecycle UNBILLED->INVOICED / ->WRITTEN_OFF) that evolve on different triggers.
  # QualityInspection and SnowStormEvent are CYCLIC (rework / re-dispatch loops).
  # ServiceContract is COMPOUND (SUSPENDED posture cascade-cancels child visits).

  relationship_patterns:
    - one_to_many        # ServiceContract -> ServicePlan -> ServiceVisit
    - cross_aggregate    # ServiceVisit references Crew, RouteSchedule, ServicePlan
    - many_to_many       # EquipmentReservation junctions EquipmentAsset <-> ServiceVisit

  role_model: peer_roles
  # AccountManager owns contracts/plans/billing; CrewLead owns route execution and
  # field work; QualityInspector owns inspections (segregated from the working crew);
  # DispatchOperator owns snow/storm dispatch. GET reads are shared across all roles.

  consistency_model: immediate

# =============================================================================
# 1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: ServiceAccount
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Operating company / region name" }
      - { name: region_code, type: string, source: input, description: "Region code, e.g. NE, SE" }
      - { name: current_utc, type: datetime, source: system, default: "1970-01-01T00:00:00.000Z", description: "Deterministic clock for this account; advanced only via POST /_clock/set_current_utc" }

  - name: Site
    parent: ServiceAccount
    common_fields: true
    fields:
      - { name: service_account_id, type: string, source: input, description: "FK -> ServiceAccount.id" }
      - { name: name, type: string, source: input, description: "Property name" }
      - { name: address, type: string, source: input, description: "Street address" }
      - { name: turf_area_sqft, type: integer, source: input, description: "Mowable turf area in square feet; must be > 0" }
      - { name: snow_zone, type: enum, source: input, default: "STANDARD", description: "PRIORITY | STANDARD | EXEMPT — drives snow dispatch tiering" }

  - name: ServiceContract
    parent: ServiceAccount
    common_fields: true
    fields:
      - { name: service_account_id, type: string, source: input, description: "FK -> ServiceAccount.id" }
      - { name: site_id, type: string, source: input, description: "FK -> Site.id" }
      - { name: annual_budget_cents, type: integer, source: input, description: "Hard ceiling for cumulative billed amount across the contract term; must be > 0" }
      - { name: billing_cycle, type: enum, source: input, description: "MONTHLY | QUARTERLY — recurring invoice cadence" }
      - { name: committed_cents, type: integer, source: computed, default: 0, description: "Sum of estimated_charge_cents (or final_charge_cents when COMPLETED) over all non-CANCELLED ServiceVisits whose plan belongs to this contract" }
      - { name: billed_cents, type: integer, source: computed, default: 0, description: "Sum of total_cents over all Invoices in ISSUED or PAID status for this contract" }
      - { name: budget_remaining_cents, type: integer, source: computed, default: 0, description: "= annual_budget_cents - committed_cents; reconciled on every visit estimate change" }
      - { name: status, type: enum, source: system, default: "DRAFT", description: "DRAFT | ACTIVE | SUSPENDED | TERMINATED — SUSPENDED freezes all child visit scheduling" }

  - name: ServicePlan
    parent: ServiceContract
    common_fields: true
    fields:
      - { name: service_contract_id, type: string, source: input, description: "FK -> ServiceContract.id" }
      - { name: site_id, type: string, source: system, description: "FK -> Site.id (copied from the parent contract)" }
      - { name: service_type, type: enum, source: input, description: "MOWING | MULCH | AERATION — the seasonal service this plan delivers" }
      - { name: frequency, type: enum, source: input, description: "WEEKLY | BIWEEKLY | SEASONAL — recurring cadence within the contract" }
      - { name: base_rate_cents, type: integer, source: input, description: "Per-visit base labor rate before area/equipment/add-on math; must be > 0" }
      - { name: status, type: enum, source: system, default: "ACTIVE", description: "ACTIVE | PAUSED — PAUSED plans reject new visit scheduling" }

  - name: Crew
    parent: ServiceAccount
    common_fields: true
    fields:
      - { name: service_account_id, type: string, source: input, description: "FK -> ServiceAccount.id" }
      - { name: name, type: string, source: input, description: "Crew name" }
      - { name: hourly_rate_cents, type: integer, source: input, description: "Loaded crew labor cost per hour; must be > 0" }
      - { name: certified_for_snow, type: boolean, source: input, default: false, description: "Whether the crew may be dispatched to snow/storm events" }

  - name: RouteSchedule
    parent: Crew
    common_fields: true
    fields:
      - { name: crew_id, type: string, source: input, description: "FK -> Crew.id" }
      - { name: service_account_id, type: string, source: system, description: "FK -> ServiceAccount.id (copied from the crew)" }
      - { name: route_date, type: string, source: input, description: "Calendar date YYYY-MM-DD this route covers" }
      - { name: shift_start_minute, type: integer, source: input, description: "Crew shift start as minute-of-day [0,1440); window is half-open [start,end)" }
      - { name: shift_end_minute, type: integer, source: input, description: "Crew shift end as minute-of-day (start,1440]; must be > shift_start_minute" }
      - { name: booked_minutes, type: integer, source: computed, default: 0, description: "Sum of slot_duration_minute over all ServiceVisits on this route not in CANCELLED execution_status" }
      - { name: status, type: enum, source: system, default: "OPEN", description: "OPEN | LOCKED — LOCKED rejects new visit placement; a visit can only start once its route is LOCKED" }

  - name: ServiceVisit
    parent: ServicePlan
    common_fields: true
    fields:
      - { name: service_plan_id, type: string, source: input, description: "FK -> ServicePlan.id" }
      - { name: service_contract_id, type: string, source: system, description: "FK -> ServiceContract.id (copied from the plan)" }
      - { name: route_schedule_id, type: string, source: input, description: "FK -> RouteSchedule.id" }
      - { name: crew_id, type: string, source: system, description: "FK -> Crew.id (copied from the route's crew at placement)" }
      - { name: slot_start_minute, type: integer, source: input, description: "Visit start as minute-of-day within the route shift; window is half-open [start,end)" }
      - { name: slot_duration_minute, type: integer, source: input, description: "Planned on-site minutes; must be > 0" }
      - { name: actual_labor_minutes, type: integer, source: system, default: 0, description: "Actual minutes recorded at completion; drives final labor cost" }
      - { name: estimated_charge_cents, type: integer, source: computed, default: 0, description: "Provisional visit charge computed at scheduling from planned inputs (see calc visit_estimated_charge)" }
      - { name: final_charge_cents, type: integer, source: computed, default: 0, description: "Final visit charge computed at completion from actuals (see calc visit_final_charge)" }
      - { name: execution_status, type: enum, source: system, default: "SCHEDULED", description: "SCHEDULED | IN_PROGRESS | COMPLETED | CANCELLED — field-work dimension (independent of billing_status)" }
      - { name: billing_status, type: enum, source: system, default: "UNBILLED", description: "UNBILLED | INVOICED | WRITTEN_OFF — money dimension, evolves independently of execution_status" }

  - name: EnhancementAddOn
    parent: ServiceVisit
    common_fields: true
    fields:
      - { name: service_visit_id, type: string, source: input, description: "FK -> ServiceVisit.id" }
      - { name: addon_type, type: enum, source: input, description: "IRRIGATION_TUNEUP | MULCH_INSTALL | AERATION_PASS — enhancement category" }
      - { name: quantity, type: integer, source: input, description: "Units (zones for irrigation, cubic yards for mulch, passes for aeration); must be > 0" }
      - { name: unit_price_cents, type: integer, source: input, description: "Price per unit; must be > 0" }
      - { name: addon_charge_cents, type: integer, source: computed, default: 0, description: "= tiered volume-discounted total over quantity (see calc addon_charge); 0 while REQUESTED/REJECTED" }
      - { name: status, type: enum, source: system, default: "REQUESTED", description: "REQUESTED | APPROVED | REJECTED — only APPROVED enters the parent visit charge" }

  - name: EquipmentAsset
    parent: ServiceAccount
    common_fields: true
    fields:
      - { name: service_account_id, type: string, source: input, description: "FK -> ServiceAccount.id" }
      - { name: name, type: string, source: input, description: "Asset name, e.g. 'Z-Turn Mower #3'" }
      - { name: hourly_usage_cost_cents, type: integer, source: input, description: "Cost charged per usage hour; must be > 0" }
      - { name: service_interval_hours, type: integer, source: input, description: "Cumulative usage hours between mandatory maintenance; must be > 0" }
      - { name: accumulated_usage_minutes, type: integer, source: computed, default: 0, description: "Cumulative reserved minutes across all RESERVED/CONSUMED reservations since last maintenance reset" }
      - { name: status, type: enum, source: system, default: "AVAILABLE", description: "AVAILABLE | OUT_OF_SERVICE — OUT_OF_SERVICE rejects new reservations" }

  - name: EquipmentReservation
    parent: EquipmentAsset
    common_fields: true
    fields:
      - { name: equipment_asset_id, type: string, source: input, description: "FK -> EquipmentAsset.id" }
      - { name: service_visit_id, type: string, source: input, description: "FK -> ServiceVisit.id" }
      - { name: window_start_minute, type: integer, source: input, description: "Reservation start as absolute minute-of-day; window is CLOSED [start,end] (adjacency counts as overlap)" }
      - { name: window_end_minute, type: integer, source: input, description: "Reservation end as minute-of-day; must be > window_start_minute" }
      - { name: reserved_minutes, type: integer, source: computed, default: 0, description: "= window_end_minute - window_start_minute" }
      - { name: usage_cost_cents, type: integer, source: computed, default: 0, description: "ceil(reserved_minutes/60) * asset.hourly_usage_cost_cents, computed at reservation" }
      - { name: status, type: enum, source: system, default: "RESERVED", description: "RESERVED | CONSUMED | RELEASED — RELEASED returns usage minutes to the asset" }

  - name: SnowStormEvent
    parent: Site
    common_fields: true
    fields:
      - { name: site_id, type: string, source: input, description: "FK -> Site.id" }
      - { name: service_account_id, type: string, source: system, description: "FK -> ServiceAccount.id (copied from the site)" }
      - { name: assigned_crew_id, type: string, source: computed, default: null, description: "FK -> Crew.id; crew selected by dispatch policy, null until DISPATCHED" }
      - { name: snowfall_inches, type: integer, source: input, description: "Measured snowfall in whole inches; must be >= 0" }
      - { name: response_deadline_minute, type: integer, source: input, description: "Minute-of-day by which response must begin (SLA)" }
      - { name: dispatch_charge_cents, type: integer, source: computed, default: 0, description: "Storm response charge with snowfall tiering and priority-zone surcharge (see calc storm_dispatch_charge)" }
      - { name: status, type: enum, source: system, default: "REPORTED", description: "REPORTED | DISPATCHED | RESOLVED | STOOD_DOWN — re-dispatch loop returns DISPATCHED->REPORTED" }

  - name: QualityInspection
    parent: ServiceVisit
    common_fields: true
    fields:
      - { name: service_visit_id, type: string, source: input, description: "FK -> ServiceVisit.id" }
      - { name: inspector_user_id, type: string, source: system, description: "Opaque X-User-ID of the QualityInspector who opened the inspection" }
      - { name: score, type: integer, source: system, default: 0, description: "Inspection score 0..100, recorded on the grading transition" }
      - { name: rework_count, type: integer, source: computed, default: 0, description: "Number of times this inspection looped back through REWORK_REQUIRED -> PENDING" }
      - { name: status, type: enum, source: system, default: "PENDING", description: "PENDING | PASSED | REWORK_REQUIRED | FAILED — REWORK_REQUIRED->PENDING is the cyclic rework loop" }

  - name: Invoice
    parent: ServiceContract
    common_fields: true
    fields:
      - { name: service_contract_id, type: string, source: input, description: "FK -> ServiceContract.id" }
      - { name: period_label, type: string, source: input, description: "Billing period label, e.g. '2026-06'; unique per contract" }
      - { name: subtotal_cents, type: integer, source: computed, default: 0, description: "Sum of final_charge_cents over swept ServiceVisits (see calc invoice_subtotal)" }
      - { name: tax_cents, type: integer, source: computed, default: 0, description: "Rounded tax applied to subtotal (see calc invoice_total)" }
      - { name: total_cents, type: integer, source: computed, default: 0, description: "subtotal_cents + tax_cents" }
      - { name: line_item_count, type: integer, source: computed, default: 0, description: "Count of ServiceVisits swept into this invoice" }
      - { name: status, type: enum, source: system, default: "DRAFT", description: "DRAFT | ISSUED | PAID | VOID — DRAFT->ISSUED locks the swept visits to INVOICED billing_status" }

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: ServiceContract
    initial_state: DRAFT
    terminal_states: [TERMINATED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /v1/contracts/{contractId}/activate"
        actor: AccountManager
        preconditions:
          - "Contract must be in DRAFT (ERR_CONTRACT_NOT_DRAFT)"
          - "At least one ServicePlan exists under this contract (ERR_NO_PLAN_DEFINED)"
        side_effects:
          - "status -> ACTIVE"
          - "increments ServiceContract.version by 1"

      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /v1/contracts/{contractId}/suspend"
        actor: AccountManager
        preconditions:
          - "Contract must be in ACTIVE (ERR_CONTRACT_NOT_ACTIVE)"
        side_effects:
          - "status -> SUSPENDED"
          - "Cascade: every SCHEDULED ServiceVisit whose plan belongs to this contract -> CANCELLED; each cancelled visit decrements its RouteSchedule.booked_minutes by slot_duration_minute and its RESERVED EquipmentReservations -> RELEASED (each RELEASED reservation subtracts reserved_minutes from its EquipmentAsset.accumulated_usage_minutes)"
          - "ServiceContract.committed_cents and budget_remaining_cents recomputed via contract_committed_reconcile"
          - "increments ServiceContract.version by 1"

      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /v1/contracts/{contractId}/activate"
        actor: AccountManager
        preconditions:
          - "Contract must be in SUSPENDED (ERR_CONTRACT_NOT_SUSPENDED)"
        side_effects:
          - "status -> ACTIVE"
          - "increments ServiceContract.version by 1"

      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /v1/contracts/{contractId}/terminate"
        actor: AccountManager
        preconditions:
          - "Contract must be in ACTIVE or SUSPENDED (ERR_CONTRACT_NOT_TERMINABLE)"
          - "No ServiceVisit under this contract is in IN_PROGRESS execution_status (ERR_VISIT_IN_PROGRESS)"
        side_effects:
          - "status -> TERMINATED"
          - "Cascade: SCHEDULED visits -> CANCELLED with the same route/equipment release as suspend"
          - "ServiceContract.committed_cents recomputed"
          - "increments ServiceContract.version by 1"

      - from: SUSPENDED
        to: TERMINATED
        trigger: "POST /v1/contracts/{contractId}/terminate"
        actor: AccountManager
        preconditions:
          - "Contract must be in ACTIVE or SUSPENDED (ERR_CONTRACT_NOT_TERMINABLE)"
          - "No ServiceVisit under this contract is in IN_PROGRESS execution_status (ERR_VISIT_IN_PROGRESS)"
        side_effects:
          - "status -> TERMINATED"
          - "increments ServiceContract.version by 1"

  - entity: ServiceVisit
    initial_state: SCHEDULED
    terminal_states: [CANCELLED]
    note: "execution_status dimension. The parallel billing_status dimension (UNBILLED|INVOICED|WRITTEN_OFF) is driven by Invoice.issue (UNBILLED->INVOICED), the write-off action and the FAILED inspection (UNBILLED->WRITTEN_OFF) — never by these execution transitions."
    transitions:
      - from: SCHEDULED
        to: IN_PROGRESS
        trigger: "POST /v1/visits/{visitId}/start"
        actor: CrewLead
        preconditions:
          - "Visit execution_status must be SCHEDULED (ERR_VISIT_NOT_SCHEDULED)"
          - "Parent ServiceContract.status must be ACTIVE (ERR_CONTRACT_NOT_ACTIVE) — cross-entity guard on ServiceContract"
          - "RouteSchedule.status must be LOCKED (ERR_ROUTE_NOT_LOCKED) — cross-entity guard on RouteSchedule; the route must be finalized before work begins"
        side_effects:
          - "execution_status -> IN_PROGRESS"

      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "POST /v1/visits/{visitId}/complete"
        actor: CrewLead
        preconditions:
          - "Visit execution_status must be IN_PROGRESS (ERR_VISIT_NOT_IN_PROGRESS)"
          - "actual_labor_minutes in request body must be > 0 (ERR_INVALID_ACTUAL_MINUTES)"
        side_effects:
          - "actual_labor_minutes set from request"
          - "final_charge_cents computed via calc visit_final_charge"
          - "execution_status -> COMPLETED"
          - "All RESERVED EquipmentReservations for this visit -> CONSUMED (cross-entity); CONSUMED keeps its usage minutes on the asset"
          - "ServiceContract.committed_cents recomputed (final replaces estimate for this visit)"

      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /v1/visits/{visitId}/cancel"
        actor: CrewLead
        preconditions:
          - "Visit execution_status must be SCHEDULED (ERR_VISIT_NOT_CANCELLABLE)"
        side_effects:
          - "execution_status -> CANCELLED"
          - "RouteSchedule.booked_minutes -= slot_duration_minute (cross-entity hop 1)"
          - "All RESERVED EquipmentReservations for this visit -> RELEASED (cross-entity hop 2); each RELEASED reservation returns reserved_minutes to its EquipmentAsset.accumulated_usage_minutes (cross-entity hop 3: visit -> reservation -> asset)"
          - "ServiceContract.committed_cents recomputed"

  - entity: EnhancementAddOn
    initial_state: REQUESTED
    terminal_states: [REJECTED]
    transitions:
      - from: REQUESTED
        to: APPROVED
        trigger: "POST /v1/addons/{addonId}/approve"
        actor: AccountManager
        preconditions:
          - "Add-on must be REQUESTED (ERR_ADDON_NOT_REQUESTED)"
          - "Parent ServiceVisit execution_status must be SCHEDULED or IN_PROGRESS (ERR_VISIT_NOT_OPEN_FOR_ADDON) — cross-entity guard on ServiceVisit"
        side_effects:
          - "status -> APPROVED"
          - "addon_charge_cents computed via calc addon_charge"
          - "Cascade: parent ServiceVisit.estimated_charge_cents recomputed (now includes this add-on) -> ServiceContract.committed_cents recomputed (addon -> visit -> contract)"

      - from: REQUESTED
        to: REJECTED
        trigger: "POST /v1/addons/{addonId}/reject"
        actor: AccountManager
        preconditions:
          - "Add-on must be REQUESTED (ERR_ADDON_NOT_REQUESTED)"
        side_effects:
          - "status -> REJECTED"
          - "addon_charge_cents set to 0"

  - entity: EquipmentReservation
    initial_state: RESERVED
    terminal_states: [CONSUMED, RELEASED]
    transitions:
      - from: RESERVED
        to: CONSUMED
        trigger: "system (automatic when the parent ServiceVisit completes)"
        actor: system
        preconditions:
          - "Reservation must be RESERVED"
        side_effects:
          - "status -> CONSUMED"
          - "usage minutes retained on EquipmentAsset.accumulated_usage_minutes"

      - from: RESERVED
        to: RELEASED
        trigger: "POST /v1/reservations/{reservationId}/release"
        actor: CrewLead
        preconditions:
          - "Reservation must be RESERVED (ERR_RESERVATION_NOT_RESERVED)"
        side_effects:
          - "status -> RELEASED"
          - "EquipmentAsset.accumulated_usage_minutes -= reserved_minutes (compensating: returns the conserved usage pool)"

  - entity: SnowStormEvent
    initial_state: REPORTED
    terminal_states: [RESOLVED, STOOD_DOWN]
    note: "Cyclic: DISPATCHED returns to REPORTED on abandon (re-dispatch loop), which clears assigned_crew_id and allows reselection."
    transitions:
      - from: REPORTED
        to: DISPATCHED
        trigger: "POST /v1/storm-events/{eventId}/dispatch"
        actor: DispatchOperator
        preconditions:
          - "Event must be REPORTED (ERR_EVENT_NOT_REPORTED)"
          - "At least one Crew with certified_for_snow == true exists under the event's account (ERR_NO_CERTIFIED_CREW) — empty-pool fallback"
        side_effects:
          - "assigned_crew_id set by dispatch selector (see calc storm_crew_selector)"
          - "dispatch_charge_cents computed via calc storm_dispatch_charge"
          - "status -> DISPATCHED"

      - from: DISPATCHED
        to: REPORTED
        trigger: "POST /v1/storm-events/{eventId}/abandon"
        actor: DispatchOperator
        preconditions:
          - "Event must be DISPATCHED (ERR_EVENT_NOT_DISPATCHED)"
        side_effects:
          - "assigned_crew_id reset to null"
          - "status -> REPORTED (re-dispatch loop; dispatch_charge_cents retained as last computed)"

      - from: DISPATCHED
        to: RESOLVED
        trigger: "POST /v1/storm-events/{eventId}/resolve"
        actor: DispatchOperator
        preconditions:
          - "Event must be DISPATCHED (ERR_EVENT_NOT_DISPATCHED)"
        side_effects:
          - "status -> RESOLVED"

      - from: REPORTED
        to: STOOD_DOWN
        trigger: "POST /v1/storm-events/{eventId}/stand-down"
        actor: DispatchOperator
        preconditions:
          - "Event must be REPORTED (ERR_EVENT_NOT_REPORTED)"
        side_effects:
          - "status -> STOOD_DOWN"
          - "dispatch_charge_cents set to 0"

  - entity: QualityInspection
    initial_state: PENDING
    terminal_states: [PASSED, FAILED]
    note: "Cyclic rework loop: PENDING -> REWORK_REQUIRED -> PENDING, incrementing rework_count each loop; PASSED/FAILED are terminal. The grade endpoint routes among PASSED, REWORK_REQUIRED, FAILED by score and rework_count."
    transitions:
      - from: PENDING
        to: PASSED
        trigger: "POST /v1/inspections/{inspectionId}/grade"
        actor: QualityInspector
        preconditions:
          - "Inspection must be PENDING (ERR_INSPECTION_NOT_PENDING)"
          - "Parent ServiceVisit execution_status must be COMPLETED (ERR_VISIT_NOT_COMPLETED) — cross-entity guard on ServiceVisit"
          - "Graded score in request must be >= PASS_THRESHOLD (routing condition, not an error)"
        side_effects:
          - "score set from request"
          - "status -> PASSED"

      - from: PENDING
        to: REWORK_REQUIRED
        trigger: "POST /v1/inspections/{inspectionId}/grade"
        actor: QualityInspector
        preconditions:
          - "Inspection must be PENDING (ERR_INSPECTION_NOT_PENDING)"
          - "Parent ServiceVisit execution_status must be COMPLETED (ERR_VISIT_NOT_COMPLETED)"
          - "Graded score is in [REWORK_FLOOR, PASS_THRESHOLD) AND rework_count < MAX_REWORK (else routes to FAILED)"
        side_effects:
          - "score set from request"
          - "status -> REWORK_REQUIRED"

      - from: REWORK_REQUIRED
        to: PENDING
        trigger: "POST /v1/inspections/{inspectionId}/reopen"
        actor: QualityInspector
        preconditions:
          - "Inspection must be REWORK_REQUIRED (ERR_INSPECTION_NOT_REWORK)"
        side_effects:
          - "rework_count += 1"
          - "status -> PENDING (cyclic loop back for re-grading)"

      - from: PENDING
        to: FAILED
        trigger: "POST /v1/inspections/{inspectionId}/grade"
        actor: QualityInspector
        preconditions:
          - "Inspection must be PENDING (ERR_INSPECTION_NOT_PENDING)"
          - "Parent ServiceVisit execution_status must be COMPLETED (ERR_VISIT_NOT_COMPLETED)"
          - "Graded score < REWORK_FLOOR, OR (score in [REWORK_FLOOR, PASS_THRESHOLD) AND rework_count >= MAX_REWORK)"
        side_effects:
          - "score set from request"
          - "status -> FAILED"
          - "Cross-entity: parent ServiceVisit.billing_status -> WRITTEN_OFF if currently UNBILLED (a failed final inspection writes off the visit charge so it cannot be invoiced)"

  - entity: Invoice
    initial_state: DRAFT
    terminal_states: [PAID, VOID]
    transitions:
      - from: DRAFT
        to: ISSUED
        trigger: "POST /v1/invoices/{invoiceId}/issue"
        actor: AccountManager
        preconditions:
          - "Invoice must be DRAFT (ERR_INVOICE_NOT_DRAFT)"
          - "OCC: expected_service_contract_version must equal the contract's current version (ERR_STALE_CONTRACT_VERSION)"
          - "Parent ServiceContract.status must not be TERMINATED (ERR_CONTRACT_TERMINATED)"
          - "line_item_count must be > 0 (ERR_EMPTY_INVOICE) — empty-set boundary"
          - "Resulting ServiceContract.billed_cents must not strictly exceed annual_budget_cents (ERR_BUDGET_EXCEEDED) — fiscal boundary"
        side_effects:
          - "status -> ISSUED"
          - "Cross-entity: every swept ServiceVisit still in UNBILLED billing_status -> INVOICED"
          - "ServiceContract.billed_cents recomputed; increments ServiceContract.version by 1"

      - from: ISSUED
        to: PAID
        trigger: "POST /v1/invoices/{invoiceId}/pay"
        actor: AccountManager
        preconditions:
          - "Invoice must be ISSUED (ERR_INVOICE_NOT_ISSUED)"
        side_effects:
          - "status -> PAID"
          - "ServiceContract.billed_cents recomputed (PAID still counts toward billed)"

      - from: DRAFT
        to: VOID
        trigger: "POST /v1/invoices/{invoiceId}/void"
        actor: AccountManager
        preconditions:
          - "Invoice must be DRAFT (ERR_INVOICE_NOT_VOIDABLE)"
        side_effects:
          - "status -> VOID"

# =============================================================================
# 1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: visit-create-stale-contract
    parent_entity: ServiceContract
    write_endpoint: "POST /v1/visits"
    occ_field: "expected_service_contract_version"
    description: |
      Scheduling a new ServiceVisit against a ServiceContract whose version has
      advanced since the client last observed it is rejected. The contract's
      version advances when it is suspended (which cascade-cancels visits and
      moves committed_cents) or terminated; a client that read the contract
      before such a transition holds a stale committed_cents / budget view, so
      its visit-create carrying the old version is rejected to prevent
      overbooking against a budget that has since shifted.
    error_id: ERR_STALE_CONTRACT_VERSION
    http_status: 412

  - rule_id: invoice-issue-stale-contract
    parent_entity: ServiceContract
    write_endpoint: "POST /v1/invoices/{invoiceId}/issue"
    occ_field: "expected_service_contract_version"
    description: |
      Issuing an Invoice against a ServiceContract whose version has advanced
      since the client last observed it is rejected. Another issue (or a
      suspend/terminate) may have moved billed_cents toward the annual ceiling
      since the client computed its budget headroom, so an issue carrying a
      stale contract version is rejected before the budget check runs on a view
      that no longer holds.
    error_id: ERR_STALE_CONTRACT_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: visit_estimated_charge
    trigger: "ServiceVisit scheduling (POST /v1/visits); recomputed when an EnhancementAddOn on this visit is approved"
    algorithm: aggregation
    formula: |
      area_factor       = ceil(plan.base_rate_cents * site.turf_area_sqft / AREA_DIVISOR_SQFT)
      planned_labor_cost = ceil(crew.hourly_rate_cents * slot_duration_minute / 60)
      approved_addons   = sum of addon_charge_cents over EnhancementAddOns of this
                          visit with status == APPROVED
      estimated_charge_cents = area_factor + planned_labor_cost + approved_addons
    input_set: "Only APPROVED add-ons of THIS visit enter approved_addons; REQUESTED and REJECTED are excluded. Uses PLANNED slot_duration_minute. Omits equipment_cost entirely."
    constants:
      AREA_DIVISOR_SQFT: 1000
    precision: "integer cents; ceil applied per term BEFORE summation (round-per-term, then sum)"
    note: "PROVISIONAL variant of the dual-variant pair with visit_final_charge — same visit, different algorithm."

  - name: visit_final_charge
    trigger: "ServiceVisit completion (POST /v1/visits/{visitId}/complete)"
    algorithm: aggregation
    formula: |
      area_factor      = ceil(plan.base_rate_cents * site.turf_area_sqft / AREA_DIVISOR_SQFT)
      actual_labor_cost = ceil(crew.hourly_rate_cents * actual_labor_minutes / 60)
      equipment_cost   = sum of usage_cost_cents over EquipmentReservations of this
                         visit with status IN {RESERVED, CONSUMED}
      approved_addons  = sum of addon_charge_cents over EnhancementAddOns of this
                         visit with status == APPROVED
      final_charge_cents = area_factor + actual_labor_cost + equipment_cost + approved_addons
    input_set: "Uses ACTUAL labor minutes (not planned) and ADDS equipment_cost, which the estimate omits. RELEASED reservations are excluded from equipment_cost."
    constants:
      AREA_DIVISOR_SQFT: 1000
    precision: "integer cents; ceil applied per term BEFORE summation"
    variants:
      - name: provisional
        when: "at scheduling, before completion"
        difference: "uses planned slot_duration_minute and omits equipment_cost (this is estimated_charge_cents)"
      - name: final
        when: "at completion"
        difference: "uses actual_labor_minutes and adds equipment_cost (this is final_charge_cents); the two diverge for identical visit inputs whenever actual != planned minutes or equipment was reserved"
    note: "Dual-variant calc: same ServiceVisit, two algorithms (estimate vs final) yield different cents."

  - name: addon_charge
    trigger: "EnhancementAddOn approval (POST /v1/addons/{addonId}/approve)"
    algorithm: tiered_pricing
    formula: |
      # Marginal volume tiers on THIS add-on's quantity:
      #   units 1..TIER1_QTY              : full unit_price_cents
      #   units (TIER1_QTY+1)..TIER2_QTY  : DISCOUNT_T2 off the per-unit price
      #   units above TIER2_QTY           : DISCOUNT_T3 off the per-unit price
      t1_units = min(quantity, TIER1_QTY)
      t2_units = max(0, min(quantity, TIER2_QTY) - TIER1_QTY)
      t3_units = max(0, quantity - TIER2_QTY)
      bucket1 = t1_units * unit_price_cents
      bucket2 = round(t2_units * unit_price_cents * (1 - DISCOUNT_T2))
      bucket3 = round(t3_units * unit_price_cents * (1 - DISCOUNT_T3))
      addon_charge_cents = bucket1 + bucket2 + bucket3
    input_set: "Single add-on; tiering is on this add-on's own quantity only, not cumulative across the visit's add-ons."
    constants:
      TIER1_QTY: 10
      TIER2_QTY: 50
      DISCOUNT_T2: 0.10
      DISCOUNT_T3: 0.20
    precision: "integer cents; round_half_up applied PER TIER BUCKET before summation (round-per-bucket, then sum — order pinned)"
    note: "Combinatorial mode (b): per-bucket rounding where order matters; pinned to round-per-bucket-then-sum, deliberately the OPPOSITE order from invoice_total's sum-then-round."

  - name: storm_dispatch_charge
    trigger: "SnowStormEvent dispatch (POST /v1/storm-events/{eventId}/dispatch)"
    algorithm: threshold
    formula: |
      # Snowfall tier selects a flat base; PRIORITY zone adds a multiplicative surcharge.
      if   snowfall_inches < TIER_LIGHT_MAX:  base = BASE_LIGHT_CENTS
      elif snowfall_inches < TIER_HEAVY_MAX:  base = BASE_MODERATE_CENTS
      else:                                   base = BASE_HEAVY_CENTS
      surcharge_mult = (1 + PRIORITY_SURCHARGE) if site.snow_zone == "PRIORITY" else 1
      dispatch_charge_cents = round(base * surcharge_mult)
    input_set: "Per event; uses the event's snowfall_inches and the parent Site.snow_zone (PRIORITY surcharges; STANDARD/EXEMPT do not)."
    constants:
      TIER_LIGHT_MAX: 3
      TIER_HEAVY_MAX: 8
      BASE_LIGHT_CENTS: 15000
      BASE_MODERATE_CENTS: 30000
      BASE_HEAVY_CENTS: 60000
      PRIORITY_SURCHARGE: 0.25
    precision: "integer cents; round_half_up"
    note: "Combinatorial mode (a): >=3 inputs (snowfall tier, zone flag, base table) with conditional branch + multiplicative interaction. Strict-< tier boundaries at snowfall 3 and 8."

  - name: storm_crew_selector
    trigger: "SnowStormEvent dispatch — picks assigned_crew_id from the certified pool"
    algorithm: weighted_scoring
    formula: |
      candidate_set = Crews under the event's service_account_id with certified_for_snow == true
      # Rank ascending by hourly_rate_cents (cheapest certified crew first).
      # Tie-break: earliest created_at ASC. Fallback: empty candidate_set -> ERR_NO_CERTIFIED_CREW.
      assigned_crew_id = id of the first crew after sorting candidate_set by
        (hourly_rate_cents ASC, created_at ASC)
    input_set: "Eligibility filter: certified_for_snow == true AND same service_account_id. Ranking: hourly_rate_cents ASC. Tie-break: created_at ASC (never id). Empty-pool fallback: ERR_NO_CERTIFIED_CREW."
    constants: {}
    precision: "n/a — selector"
    note: "Selector policy: eligibility filter, ranking expression, tie-break (created_at ASC), and empty-pool fallback all pinned. id is never a decision input."

  - name: invoice_subtotal
    trigger: "Invoice draft creation sweep (POST /v1/invoices); the sweep is fixed at draft creation and not re-run on issue"
    algorithm: aggregation
    formula: |
      swept_visits = ServiceVisits whose service_contract_id == this contract with
        execution_status == COMPLETED AND billing_status == UNBILLED
      line_item_count = count(swept_visits)
      subtotal_cents  = sum of final_charge_cents over swept_visits
    input_set: "ONLY COMPLETED + UNBILLED visits. WRITTEN_OFF (failed inspection or write-off) and already-INVOICED visits are excluded. Empty sweep -> line_item_count == 0."
    constants: {}
    precision: "integer cents; no rounding (final_charge_cents already integer)"
    note: "Empty-set boundary: a contract with zero COMPLETED+UNBILLED visits yields line_item_count == 0, which blocks ISSUE with ERR_EMPTY_INVOICE (but the DRAFT still creates)."

  - name: invoice_total
    trigger: "Invoice draft creation (immediately after the subtotal sweep)"
    algorithm: aggregation
    formula: |
      tax_cents   = round(subtotal_cents * TAX_RATE)
      total_cents = subtotal_cents + tax_cents
    input_set: "Tax computed on the swept subtotal as a SINGLE rounding (sum-then-round), in deliberate contrast to addon_charge which rounds per bucket."
    constants:
      TAX_RATE: 0.0825
    precision: "integer cents; round_half_up; SUM-then-ROUND (tax on the whole subtotal, not per line)"
    note: "Combinatorial-mode contrast: invoice_total rounds AFTER aggregation (sum-then-round); addon_charge rounds BEFORE aggregation (round-per-bucket). The two pinned orders differ."

  - name: contract_committed_reconcile
    trigger: "Any visit estimate/final change, add-on approval, visit cancel, contract suspend/terminate"
    algorithm: aggregation
    formula: |
      committed_cents = sum over ServiceVisits whose service_contract_id == this contract
        and execution_status != CANCELLED of:
          (final_charge_cents if execution_status == COMPLETED else estimated_charge_cents)
      budget_remaining_cents = annual_budget_cents - committed_cents
    input_set: "Excludes CANCELLED visits. COMPLETED visits contribute final_charge_cents; all other non-cancelled visits contribute estimated_charge_cents."
    constants: {}
    precision: "integer cents"
    note: "Derived-field reconciliation: committed_cents and budget_remaining_cents stay consistent with the visit set on every mutation (the conserved quantity for compensating cancel/uncancel)."

  - name: equipment_usage_cost
    trigger: "EquipmentReservation creation (POST /v1/reservations)"
    algorithm: threshold
    formula: |
      reserved_minutes = window_end_minute - window_start_minute
      usage_cost_cents = ceil(reserved_minutes / 60) * asset.hourly_usage_cost_cents
    input_set: "Single reservation; whole-hour ceiling billing of the reserved window."
    constants: {}
    precision: "integer cents; ceil on hours"
    note: "Boundary precision on a different metric/endpoint than the others: 60 minutes -> 1 hour, 61 minutes -> 2 hours (ceil)."

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present and X-User-Role is a known role"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "Role is permitted to perform this operation per the RBAC matrix"
    error_id: ERR_INSUFFICIENT_PERMISSIONS
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "All resource ids in the path and required FK fields in the body exist; validated left-to-right (path before body)"
    error_id: "ERR_*_NOT_FOUND"
    http_status: 404
    applies_to: all resource endpoints

  - priority: 4
    category: business_constraint
    check: "Request body required fields present and well-typed; enum members valid; integers in declared ranges (turf_area_sqft > 0, slot_duration_minute > 0, snowfall_inches >= 0, shift_end_minute > shift_start_minute, window_end_minute > window_start_minute)"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all mutation endpoints

  - priority: 5
    category: state
    check: "OCC: when expected_service_contract_version is provided it must equal the parent contract's current version; runs BEFORE state-precondition and business checks on these endpoints"
    error_id: ERR_STALE_CONTRACT_VERSION
    http_status: 412
    applies_to: "POST /v1/visits, POST /v1/invoices/{invoiceId}/issue"

  - priority: 6
    category: state
    check: "Target resource is in the correct state for the requested transition (state-machine from-state)"
    error_id: "ERR_*_NOT_<STATE> (per transition)"
    http_status: 409
    applies_to: all transition endpoints

  - priority: 7
    category: state
    check: "Cross-entity state guards: ServiceContract.status == ACTIVE for visit scheduling and start; ServicePlan.status == ACTIVE for scheduling; RouteSchedule.status == OPEN for visit placement and == LOCKED for visit start; EquipmentAsset.status == AVAILABLE for reservation"
    error_id: "ERR_CONTRACT_NOT_ACTIVE / ERR_PLAN_PAUSED / ERR_ROUTE_NOT_OPEN / ERR_ROUTE_NOT_LOCKED / ERR_EQUIPMENT_OUT_OF_SERVICE"
    http_status: 409
    applies_to: "POST /v1/visits, POST /v1/visits/{visitId}/start, POST /v1/reservations"

  - priority: 8
    category: business_referential
    check: "Cross-account integrity: a ServiceVisit's plan, route and the contract must share one service_account_id; an EquipmentReservation's asset and visit must share one service_account_id"
    error_id: ERR_CROSS_ACCOUNT_REFERENCE
    http_status: 409
    applies_to: "POST /v1/visits, POST /v1/reservations"

  - priority: 9
    category: business_temporal
    check: "ServiceVisit slot [slot_start_minute, slot_start_minute+slot_duration_minute) must lie within the route shift [shift_start_minute, shift_end_minute) and must not overlap (HALF-OPEN) any non-CANCELLED visit already on the same RouteSchedule; adjacency (one ends exactly where the next begins) is ALLOWED"
    error_id: ERR_VISIT_SLOT_CONFLICT
    http_status: 409
    applies_to: "POST /v1/visits"
    note: "Half-open interval semantics on RouteSchedule: a slot ending exactly at another's start does not collide."

  - priority: 10
    category: business_temporal
    check: "EquipmentReservation [window_start_minute, window_end_minute] must not overlap any non-RELEASED reservation on the same EquipmentAsset; intervals are CLOSED so touching endpoints DO collide"
    error_id: ERR_EQUIPMENT_DOUBLE_BOOKED
    http_status: 409
    applies_to: "POST /v1/reservations"
    note: "Closed interval semantics on EquipmentAsset: adjacent reservations sharing an endpoint ARE rejected — the opposite adjacency rule from the half-open visit-slot check."

  - priority: 11
    category: business_safety
    check: "Crew dispatched to a SnowStormEvent must have certified_for_snow == true; the certified pool under the account must be non-empty"
    error_id: ERR_NO_CERTIFIED_CREW
    http_status: 409
    applies_to: "POST /v1/storm-events/{eventId}/dispatch"

  - priority: 12
    category: business_constraint
    check: "EquipmentReservation rejected when asset.accumulated_usage_minutes + reserved_minutes would STRICTLY exceed asset.service_interval_hours*60 (asset due for maintenance)"
    error_id: ERR_SERVICE_INTERVAL_EXCEEDED
    http_status: 409
    applies_to: "POST /v1/reservations"
    note: "Aggregate threshold boundary: rejection only when the sum STRICTLY exceeds the interval ('>' not '>='); exactly equal is allowed."

  - priority: 13
    category: business_fiscal
    check: "Issuing an Invoice must not push ServiceContract.billed_cents STRICTLY above annual_budget_cents"
    error_id: ERR_BUDGET_EXCEEDED
    http_status: 402
    applies_to: "POST /v1/invoices/{invoiceId}/issue"
    note: "Fiscal ceiling boundary: rejection only when resulting billed_cents would strictly exceed annual_budget_cents (exactly equal is allowed)."

  - priority: 14
    category: business_constraint
    check: "Invoice period_label must be unique among non-VOID invoices of the same contract"
    error_id: ERR_DUPLICATE_PERIOD_LABEL
    http_status: 409
    applies_to: "POST /v1/invoices"

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Service Accounts + clock ---
  - method: POST
    path: "/v1/accounts"
    description: "Create a service account (tenant root)"
    roles: [AccountManager]
    code: 201
    input: [name, region_code]
    output: ServiceAccount
    side_effects: ["current_utc initialized to 1970-01-01T00:00:00.000Z"]

  - method: GET
    path: "/v1/accounts/{accountId}"
    description: "Get a service account"
    roles: [AccountManager, CrewLead, QualityInspector, DispatchOperator]
    code: 200
    input: []
    output: ServiceAccount
    side_effects: []

  - method: POST
    path: "/_clock/set_current_utc"
    description: "Test-driving clock: set an account's deterministic current_utc"
    roles: [AccountManager]
    code: 200
    input: [account_id, to_iso8601]
    output: ServiceAccount
    side_effects: ["ServiceAccount.current_utc set to to_iso8601"]

  # --- Sites ---
  - method: POST
    path: "/v1/sites"
    description: "Create a site under an account"
    roles: [AccountManager]
    code: 201
    input: [service_account_id, name, address, turf_area_sqft, "snow_zone?"]
    output: Site
    side_effects: []

  - method: GET
    path: "/v1/sites/{siteId}"
    description: "Get a site"
    roles: [AccountManager, CrewLead, QualityInspector, DispatchOperator]
    code: 200
    input: []
    output: Site
    side_effects: []

  - method: GET
    path: "/v1/sites"
    description: "List sites; filter by service_account_id"
    roles: [AccountManager, CrewLead, QualityInspector, DispatchOperator]
    code: 200
    input: ["service_account_id?"]
    output: "Site[]"
    side_effects: []

  # --- Contracts ---
  - method: POST
    path: "/v1/contracts"
    description: "Create a service contract for a site"
    roles: [AccountManager]
    code: 201
    input: [service_account_id, site_id, annual_budget_cents, billing_cycle]
    output: ServiceContract
    side_effects: ["status = DRAFT", "committed_cents = 0", "budget_remaining_cents = annual_budget_cents"]

  - method: GET
    path: "/v1/contracts/{contractId}"
    description: "Get a contract (reconciled committed/billed/remaining)"
    roles: [AccountManager, CrewLead, QualityInspector, DispatchOperator]
    code: 200
    input: []
    output: ServiceContract
    side_effects: []

  - method: GET
    path: "/v1/contracts"
    description: "List contracts; filter by service_account_id or site_id"
    roles: [AccountManager, CrewLead, QualityInspector, DispatchOperator]
    code: 200
    input: ["service_account_id?", "site_id?"]
    output: "ServiceContract[]"
    side_effects: []

  - method: POST
    path: "/v1/contracts/{contractId}/activate"
    description: "Activate a DRAFT or reactivate a SUSPENDED contract"
    roles: [AccountManager]
    code: 200
    input: []
    output: ServiceContract
    side_effects: ["status -> ACTIVE", "increments ServiceContract.version by 1"]

  - method: POST
    path: "/v1/contracts/{contractId}/suspend"
    description: "Suspend an ACTIVE contract; cascade-cancels SCHEDULED visits"
    roles: [AccountManager]
    code: 200
    input: []
    output: ServiceContract
    side_effects:
      - "status -> SUSPENDED"
      - "cascade: SCHEDULED visits -> CANCELLED; route booked_minutes reduced; RESERVED reservations RELEASED returning usage minutes"
      - "committed_cents recomputed"
      - "increments ServiceContract.version by 1"

  - method: POST
    path: "/v1/contracts/{contractId}/terminate"
    description: "Terminate an ACTIVE or SUSPENDED contract"
    roles: [AccountManager]
    code: 200
    input: []
    output: ServiceContract
    side_effects:
      - "status -> TERMINATED"
      - "cascade-cancel SCHEDULED visits with route/equipment release"
      - "increments ServiceContract.version by 1"

  # --- Plans ---
  - method: POST
    path: "/v1/plans"
    description: "Create a service plan under a contract"
    roles: [AccountManager]
    code: 201
    input: [service_contract_id, service_type, frequency, base_rate_cents]
    output: ServicePlan
    side_effects: ["status = ACTIVE", "site_id copied from the parent contract"]

  - method: GET
    path: "/v1/plans/{planId}"
    description: "Get a service plan"
    roles: [AccountManager, CrewLead, QualityInspector, DispatchOperator]
    code: 200
    input: []
    output: ServicePlan
    side_effects: []

  - method: GET
    path: "/v1/plans"
    description: "List plans; filter by service_contract_id or site_id"
    roles: [AccountManager, CrewLead, QualityInspector, DispatchOperator]
    code: 200
    input: ["service_contract_id?", "site_id?"]
    output: "ServicePlan[]"
    side_effects: []

  - method: POST
    path: "/v1/plans/{planId}/pause"
    description: "Pause a plan (rejects new visit scheduling)"
    roles: [AccountManager]
    code: 200
    input: []
    output: ServicePlan
    side_effects: ["status -> PAUSED"]

  # --- Crews ---
  - method: POST
    path: "/v1/crews"
    description: "Create a crew"
    roles: [AccountManager]
    code: 201
    input: [service_account_id, name, hourly_rate_cents, "certified_for_snow?"]
    output: Crew
    side_effects: []

  - method: GET
    path: "/v1/crews/{crewId}"
    description: "Get a crew"
    roles: [AccountManager, CrewLead, QualityInspector, DispatchOperator]
    code: 200
    input: []
    output: Crew
    side_effects: []

  - method: GET
    path: "/v1/crews"
    description: "List crews; filter by service_account_id"
    roles: [AccountManager, CrewLead, QualityInspector, DispatchOperator]
    code: 200
    input: ["service_account_id?"]
    output: "Crew[]"
    side_effects: []

  # --- Routes ---
  - method: POST
    path: "/v1/routes"
    description: "Create a route schedule (day's shift) for a crew"
    roles: [AccountManager, CrewLead]
    code: 201
    input: [crew_id, route_date, shift_start_minute, shift_end_minute]
    output: RouteSchedule
    side_effects: ["status = OPEN", "booked_minutes = 0", "service_account_id copied from the crew"]

  - method: GET
    path: "/v1/routes/{routeId}"
    description: "Get a route schedule"
    roles: [AccountManager, CrewLead, QualityInspector, DispatchOperator]
    code: 200
    input: []
    output: RouteSchedule
    side_effects: []

  - method: GET
    path: "/v1/routes"
    description: "List routes; filter by crew_id or service_account_id"
    roles: [AccountManager, CrewLead, QualityInspector, DispatchOperator]
    code: 200
    input: ["crew_id?", "service_account_id?"]
    output: "RouteSchedule[]"
    side_effects: []

  - method: POST
    path: "/v1/routes/{routeId}/lock"
    description: "Lock a route (finalize before field work begins)"
    roles: [CrewLead]
    code: 200
    input: []
    output: RouteSchedule
    side_effects: ["status -> LOCKED"]

  # --- Visits ---
  - method: POST
    path: "/v1/visits"
    description: "Schedule a service visit on a route; OCC-guarded against the parent contract"
    roles: [AccountManager, CrewLead]
    code: 201
    input: [service_plan_id, route_schedule_id, slot_start_minute, slot_duration_minute, expected_service_contract_version]
    output: ServiceVisit
    side_effects:
      - "status = SCHEDULED, billing_status = UNBILLED"
      - "service_contract_id and crew_id copied from plan/route"
      - "estimated_charge_cents computed via visit_estimated_charge"
      - "RouteSchedule.booked_minutes += slot_duration_minute"
      - "ServiceContract.committed_cents recomputed; increments ServiceContract.version by 1"

  - method: GET
    path: "/v1/visits/{visitId}"
    description: "Get a service visit (both execution_status and billing_status)"
    roles: [AccountManager, CrewLead, QualityInspector, DispatchOperator]
    code: 200
    input: []
    output: ServiceVisit
    side_effects: []

  - method: GET
    path: "/v1/visits"
    description: "List visits; filter by service_plan_id, service_contract_id, route_schedule_id, or crew_id"
    roles: [AccountManager, CrewLead, QualityInspector, DispatchOperator]
    code: 200
    input: ["service_plan_id?", "service_contract_id?", "route_schedule_id?", "crew_id?"]
    output: "ServiceVisit[]"
    side_effects: []

  - method: POST
    path: "/v1/visits/{visitId}/start"
    description: "Begin field work on a visit"
    roles: [CrewLead]
    code: 200
    input: []
    output: ServiceVisit
    side_effects: ["execution_status -> IN_PROGRESS"]

  - method: POST
    path: "/v1/visits/{visitId}/complete"
    description: "Complete a visit, recording actual labor; computes final charge and consumes equipment"
    roles: [CrewLead]
    code: 200
    input: [actual_labor_minutes]
    output: ServiceVisit
    side_effects:
      - "actual_labor_minutes set; execution_status -> COMPLETED"
      - "final_charge_cents computed via visit_final_charge"
      - "RESERVED reservations for this visit -> CONSUMED"
      - "ServiceContract.committed_cents recomputed"

  - method: POST
    path: "/v1/visits/{visitId}/cancel"
    description: "Cancel a SCHEDULED visit; releases route minutes and equipment"
    roles: [CrewLead, AccountManager]
    code: 200
    input: []
    output: ServiceVisit
    side_effects:
      - "execution_status -> CANCELLED"
      - "RouteSchedule.booked_minutes -= slot_duration_minute"
      - "RESERVED reservations -> RELEASED returning usage minutes to asset"
      - "ServiceContract.committed_cents recomputed"

  - method: POST
    path: "/v1/visits/{visitId}/write-off"
    description: "Write off a visit's charge (billing dimension), preventing it from being invoiced"
    roles: [AccountManager]
    code: 200
    input: []
    output: ServiceVisit
    side_effects: ["billing_status -> WRITTEN_OFF"]

  # --- Add-ons ---
  - method: POST
    path: "/v1/addons"
    description: "Request an enhancement add-on on a visit"
    roles: [AccountManager, CrewLead]
    code: 201
    input: [service_visit_id, addon_type, quantity, unit_price_cents]
    output: EnhancementAddOn
    side_effects: ["status = REQUESTED", "addon_charge_cents = 0"]

  - method: GET
    path: "/v1/addons/{addonId}"
    description: "Get an add-on"
    roles: [AccountManager, CrewLead, QualityInspector, DispatchOperator]
    code: 200
    input: []
    output: EnhancementAddOn
    side_effects: []

  - method: GET
    path: "/v1/addons"
    description: "List add-ons; filter by service_visit_id"
    roles: [AccountManager, CrewLead, QualityInspector, DispatchOperator]
    code: 200
    input: ["service_visit_id?"]
    output: "EnhancementAddOn[]"
    side_effects: []

  - method: POST
    path: "/v1/addons/{addonId}/approve"
    description: "Approve an add-on; recomputes visit estimate and contract commitment"
    roles: [AccountManager]
    code: 200
    input: []
    output: EnhancementAddOn
    side_effects:
      - "status -> APPROVED; addon_charge_cents computed via addon_charge"
      - "parent visit estimated_charge_cents recomputed; contract committed_cents recomputed"

  - method: POST
    path: "/v1/addons/{addonId}/reject"
    description: "Reject an add-on"
    roles: [AccountManager]
    code: 200
    input: []
    output: EnhancementAddOn
    side_effects: ["status -> REJECTED; addon_charge_cents = 0"]

  # --- Equipment ---
  - method: POST
    path: "/v1/equipment"
    description: "Create an equipment asset"
    roles: [AccountManager]
    code: 201
    input: [service_account_id, name, hourly_usage_cost_cents, service_interval_hours]
    output: EquipmentAsset
    side_effects: ["status = AVAILABLE", "accumulated_usage_minutes = 0"]

  - method: GET
    path: "/v1/equipment/{assetId}"
    description: "Get an equipment asset"
    roles: [AccountManager, CrewLead, QualityInspector, DispatchOperator]
    code: 200
    input: []
    output: EquipmentAsset
    side_effects: []

  - method: GET
    path: "/v1/equipment"
    description: "List equipment; filter by service_account_id"
    roles: [AccountManager, CrewLead, QualityInspector, DispatchOperator]
    code: 200
    input: ["service_account_id?"]
    output: "EquipmentAsset[]"
    side_effects: []

  - method: POST
    path: "/v1/equipment/{assetId}/maintenance-reset"
    description: "Reset an asset's accumulated usage after maintenance"
    roles: [AccountManager]
    code: 200
    input: []
    output: EquipmentAsset
    side_effects: ["accumulated_usage_minutes -> 0", "status -> AVAILABLE"]

  - method: POST
    path: "/v1/equipment/{assetId}/decommission"
    description: "Mark an asset OUT_OF_SERVICE"
    roles: [AccountManager]
    code: 200
    input: []
    output: EquipmentAsset
    side_effects: ["status -> OUT_OF_SERVICE"]

  # --- Reservations ---
  - method: POST
    path: "/v1/reservations"
    description: "Reserve equipment for a visit over a time window"
    roles: [CrewLead, AccountManager]
    code: 201
    input: [equipment_asset_id, service_visit_id, window_start_minute, window_end_minute]
    output: EquipmentReservation
    side_effects:
      - "status = RESERVED; reserved_minutes and usage_cost_cents computed via equipment_usage_cost"
      - "EquipmentAsset.accumulated_usage_minutes += reserved_minutes"

  - method: GET
    path: "/v1/reservations/{reservationId}"
    description: "Get an equipment reservation"
    roles: [AccountManager, CrewLead, QualityInspector, DispatchOperator]
    code: 200
    input: []
    output: EquipmentReservation
    side_effects: []

  - method: GET
    path: "/v1/reservations"
    description: "List reservations; filter by equipment_asset_id or service_visit_id"
    roles: [AccountManager, CrewLead, QualityInspector, DispatchOperator]
    code: 200
    input: ["equipment_asset_id?", "service_visit_id?"]
    output: "EquipmentReservation[]"
    side_effects: []

  - method: POST
    path: "/v1/reservations/{reservationId}/release"
    description: "Release a RESERVED reservation, returning usage minutes to the asset"
    roles: [CrewLead, AccountManager]
    code: 200
    input: []
    output: EquipmentReservation
    side_effects: ["status -> RELEASED", "EquipmentAsset.accumulated_usage_minutes -= reserved_minutes"]

  # --- Storm events ---
  - method: POST
    path: "/v1/storm-events"
    description: "Report a snow/storm event at a site"
    roles: [DispatchOperator, AccountManager]
    code: 201
    input: [site_id, snowfall_inches, response_deadline_minute]
    output: SnowStormEvent
    side_effects: ["status = REPORTED", "service_account_id copied from the site"]

  - method: GET
    path: "/v1/storm-events/{eventId}"
    description: "Get a storm event"
    roles: [AccountManager, CrewLead, QualityInspector, DispatchOperator]
    code: 200
    input: []
    output: SnowStormEvent
    side_effects: []

  - method: GET
    path: "/v1/storm-events"
    description: "List storm events; filter by site_id, service_account_id, or assigned_crew_id"
    roles: [AccountManager, CrewLead, QualityInspector, DispatchOperator]
    code: 200
    input: ["site_id?", "service_account_id?", "assigned_crew_id?"]
    output: "SnowStormEvent[]"
    side_effects: []

  - method: POST
    path: "/v1/storm-events/{eventId}/dispatch"
    description: "Dispatch a certified crew to a storm event; selects crew and computes charge"
    roles: [DispatchOperator]
    code: 200
    input: []
    output: SnowStormEvent
    side_effects:
      - "assigned_crew_id selected via storm_crew_selector"
      - "dispatch_charge_cents computed via storm_dispatch_charge"
      - "status -> DISPATCHED"

  - method: POST
    path: "/v1/storm-events/{eventId}/abandon"
    description: "Abandon a dispatch, returning the event to REPORTED for re-dispatch"
    roles: [DispatchOperator]
    code: 200
    input: []
    output: SnowStormEvent
    side_effects: ["assigned_crew_id -> null", "status -> REPORTED"]

  - method: POST
    path: "/v1/storm-events/{eventId}/resolve"
    description: "Resolve a dispatched storm event"
    roles: [DispatchOperator]
    code: 200
    input: []
    output: SnowStormEvent
    side_effects: ["status -> RESOLVED"]

  - method: POST
    path: "/v1/storm-events/{eventId}/stand-down"
    description: "Stand down a reported storm event (no dispatch needed)"
    roles: [DispatchOperator]
    code: 200
    input: []
    output: SnowStormEvent
    side_effects: ["status -> STOOD_DOWN", "dispatch_charge_cents -> 0"]

  # --- Inspections ---
  - method: POST
    path: "/v1/inspections"
    description: "Open a quality inspection on a completed visit"
    roles: [QualityInspector]
    code: 201
    input: [service_visit_id]
    output: QualityInspection
    side_effects: ["status = PENDING", "inspector_user_id set from X-User-ID", "rework_count = 0"]

  - method: GET
    path: "/v1/inspections/{inspectionId}"
    description: "Get a quality inspection"
    roles: [AccountManager, CrewLead, QualityInspector, DispatchOperator]
    code: 200
    input: []
    output: QualityInspection
    side_effects: []

  - method: GET
    path: "/v1/inspections"
    description: "List inspections; filter by service_visit_id"
    roles: [AccountManager, CrewLead, QualityInspector, DispatchOperator]
    code: 200
    input: ["service_visit_id?"]
    output: "QualityInspection[]"
    side_effects: []

  - method: POST
    path: "/v1/inspections/{inspectionId}/grade"
    description: "Grade a pending inspection; routes to PASSED, REWORK_REQUIRED, or FAILED by score and rework_count"
    roles: [QualityInspector]
    code: 200
    input: [score]
    output: QualityInspection
    side_effects:
      - "score set; status routed per grade thresholds"
      - "on FAILED: parent visit billing_status -> WRITTEN_OFF if still UNBILLED"

  - method: POST
    path: "/v1/inspections/{inspectionId}/reopen"
    description: "Reopen a rework-required inspection for re-grading"
    roles: [QualityInspector]
    code: 200
    input: []
    output: QualityInspection
    side_effects: ["rework_count += 1", "status -> PENDING"]

  # --- Invoices (recurring billing) ---
  - method: POST
    path: "/v1/invoices"
    description: "Create a draft invoice; sweeps COMPLETED+UNBILLED visits into subtotal/tax/total"
    roles: [AccountManager]
    code: 201
    input: [service_contract_id, period_label]
    output: Invoice
    side_effects:
      - "status = DRAFT"
      - "subtotal/line_item_count via invoice_subtotal; tax/total via invoice_total"

  - method: GET
    path: "/v1/invoices/{invoiceId}"
    description: "Get an invoice"
    roles: [AccountManager, CrewLead, QualityInspector, DispatchOperator]
    code: 200
    input: []
    output: Invoice
    side_effects: []

  - method: GET
    path: "/v1/invoices"
    description: "List invoices; filter by service_contract_id"
    roles: [AccountManager, CrewLead, QualityInspector, DispatchOperator]
    code: 200
    input: ["service_contract_id?"]
    output: "Invoice[]"
    side_effects: []

  - method: POST
    path: "/v1/invoices/{invoiceId}/issue"
    description: "Issue a draft invoice; OCC-guarded; flips swept visits to INVOICED and checks budget"
    roles: [AccountManager]
    code: 200
    input: [expected_service_contract_version]
    output: Invoice
    side_effects:
      - "status -> ISSUED"
      - "swept UNBILLED visits -> INVOICED"
      - "ServiceContract.billed_cents recomputed; increments ServiceContract.version by 1"

  - method: POST
    path: "/v1/invoices/{invoiceId}/pay"
    description: "Mark an issued invoice paid"
    roles: [AccountManager]
    code: 200
    input: []
    output: Invoice
    side_effects: ["status -> PAID"]

  - method: POST
    path: "/v1/invoices/{invoiceId}/void"
    description: "Void a draft invoice"
    roles: [AccountManager]
    code: 200
    input: []
    output: Invoice
    side_effects: ["status -> VOID"]

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  # --- Auth ---
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 401, condition: "X-User-ID or X-User-Role header missing or role unknown" }
  - { id: ERR_INSUFFICIENT_PERMISSIONS, http: 403, condition: "Role not permitted for this operation per the RBAC matrix" }

  # --- Not found ---
  - { id: ERR_ACCOUNT_NOT_FOUND, http: 404, condition: "Service account not found" }
  - { id: ERR_SITE_NOT_FOUND, http: 404, condition: "Site not found" }
  - { id: ERR_CONTRACT_NOT_FOUND, http: 404, condition: "Service contract not found" }
  - { id: ERR_PLAN_NOT_FOUND, http: 404, condition: "Service plan not found" }
  - { id: ERR_CREW_NOT_FOUND, http: 404, condition: "Crew not found" }
  - { id: ERR_ROUTE_NOT_FOUND, http: 404, condition: "Route schedule not found" }
  - { id: ERR_VISIT_NOT_FOUND, http: 404, condition: "Service visit not found" }
  - { id: ERR_ADDON_NOT_FOUND, http: 404, condition: "Enhancement add-on not found" }
  - { id: ERR_EQUIPMENT_NOT_FOUND, http: 404, condition: "Equipment asset not found" }
  - { id: ERR_RESERVATION_NOT_FOUND, http: 404, condition: "Equipment reservation not found" }
  - { id: ERR_EVENT_NOT_FOUND, http: 404, condition: "Snow/storm event not found" }
  - { id: ERR_INSPECTION_NOT_FOUND, http: 404, condition: "Quality inspection not found" }
  - { id: ERR_INVOICE_NOT_FOUND, http: 404, condition: "Invoice not found" }

  # --- Input ---
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field, bad type, invalid enum, or out-of-range integer (e.g. turf_area_sqft <= 0, slot_duration_minute <= 0, shift_end_minute <= shift_start_minute)" }
  - { id: ERR_INVALID_ACTUAL_MINUTES, http: 400, condition: "actual_labor_minutes at completion is not > 0" }

  # --- OCC ---
  - { id: ERR_STALE_CONTRACT_VERSION, http: 412, condition: "expected_service_contract_version does not match the contract's current version" }

  # --- Contract state ---
  - { id: ERR_CONTRACT_NOT_DRAFT, http: 409, condition: "Contract must be DRAFT for this transition" }
  - { id: ERR_CONTRACT_NOT_ACTIVE, http: 409, condition: "Contract must be ACTIVE for this operation" }
  - { id: ERR_CONTRACT_NOT_SUSPENDED, http: 409, condition: "Contract must be SUSPENDED to reactivate" }
  - { id: ERR_CONTRACT_NOT_TERMINABLE, http: 409, condition: "Contract must be ACTIVE or SUSPENDED to terminate" }
  - { id: ERR_CONTRACT_TERMINATED, http: 409, condition: "Operation not allowed on a TERMINATED contract" }
  - { id: ERR_NO_PLAN_DEFINED, http: 409, condition: "Contract has no service plan when activating from DRAFT" }

  # --- Plan / route / visit state ---
  - { id: ERR_PLAN_PAUSED, http: 409, condition: "Service plan is PAUSED and cannot schedule new visits" }
  - { id: ERR_ROUTE_NOT_OPEN, http: 409, condition: "Route schedule must be OPEN to place a visit" }
  - { id: ERR_ROUTE_NOT_LOCKED, http: 409, condition: "Route schedule must be LOCKED before a visit can start" }
  - { id: ERR_VISIT_NOT_SCHEDULED, http: 409, condition: "Visit must be SCHEDULED for this transition" }
  - { id: ERR_VISIT_NOT_IN_PROGRESS, http: 409, condition: "Visit must be IN_PROGRESS to complete" }
  - { id: ERR_VISIT_NOT_CANCELLABLE, http: 409, condition: "Visit must be SCHEDULED to cancel" }
  - { id: ERR_VISIT_NOT_COMPLETED, http: 409, condition: "Visit must be COMPLETED to grade its inspection" }
  - { id: ERR_VISIT_IN_PROGRESS, http: 409, condition: "Contract cannot be terminated while a visit is IN_PROGRESS" }

  # --- Temporal / capacity ---
  - { id: ERR_VISIT_SLOT_CONFLICT, http: 409, condition: "Visit slot falls outside the shift or overlaps (half-open) another visit on the route" }
  - { id: ERR_EQUIPMENT_DOUBLE_BOOKED, http: 409, condition: "Equipment reservation overlaps (closed interval) a non-RELEASED reservation on the asset" }
  - { id: ERR_SERVICE_INTERVAL_EXCEEDED, http: 409, condition: "Reservation would push asset usage strictly past service_interval_hours" }
  - { id: ERR_EQUIPMENT_OUT_OF_SERVICE, http: 409, condition: "Asset is OUT_OF_SERVICE and cannot be reserved" }
  - { id: ERR_RESERVATION_NOT_RESERVED, http: 409, condition: "Reservation must be RESERVED to release" }

  # --- Add-on ---
  - { id: ERR_ADDON_NOT_REQUESTED, http: 409, condition: "Add-on must be REQUESTED to approve or reject" }
  - { id: ERR_VISIT_NOT_OPEN_FOR_ADDON, http: 409, condition: "Parent visit must be SCHEDULED or IN_PROGRESS to approve an add-on" }

  # --- Storm ---
  - { id: ERR_EVENT_NOT_REPORTED, http: 409, condition: "Storm event must be REPORTED for this transition" }
  - { id: ERR_EVENT_NOT_DISPATCHED, http: 409, condition: "Storm event must be DISPATCHED for this transition" }
  - { id: ERR_NO_CERTIFIED_CREW, http: 409, condition: "No certified_for_snow crew exists under the account to dispatch (empty pool)" }

  # --- Inspection ---
  - { id: ERR_INSPECTION_NOT_PENDING, http: 409, condition: "Inspection must be PENDING to grade" }
  - { id: ERR_INSPECTION_NOT_REWORK, http: 409, condition: "Inspection must be REWORK_REQUIRED to reopen" }

  # --- Invoice ---
  - { id: ERR_INVOICE_NOT_DRAFT, http: 409, condition: "Invoice must be DRAFT to issue" }
  - { id: ERR_INVOICE_NOT_ISSUED, http: 409, condition: "Invoice must be ISSUED to pay" }
  - { id: ERR_INVOICE_NOT_VOIDABLE, http: 409, condition: "Invoice must be DRAFT to void" }
  - { id: ERR_EMPTY_INVOICE, http: 409, condition: "Invoice has zero line items (no COMPLETED+UNBILLED visits) and cannot be issued" }
  - { id: ERR_DUPLICATE_PERIOD_LABEL, http: 409, condition: "A non-VOID invoice with this period_label already exists for the contract" }
  - { id: ERR_BUDGET_EXCEEDED, http: 402, condition: "Issuing would push billed_cents strictly above annual_budget_cents" }

  # --- Referential ---
  - { id: ERR_CROSS_ACCOUNT_REFERENCE, http: 409, condition: "Referenced entity belongs to a different service account" }

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: AccountManager
    description: "Owns accounts, sites, contracts, plans, equipment, add-on approval, and recurring billing (invoices)."
    identity: opaque
    exclusive_operations:
      - "POST /v1/accounts — create account"
      - "POST /v1/sites — create site"
      - "POST /v1/contracts — create contract"
      - "POST /v1/contracts/{id}/activate|suspend|terminate — contract lifecycle"
      - "POST /v1/plans — create plan"
      - "POST /v1/plans/{id}/pause — pause plan"
      - "POST /v1/crews — create crew"
      - "POST /v1/equipment — create equipment"
      - "POST /v1/equipment/{id}/maintenance-reset — reset usage"
      - "POST /v1/equipment/{id}/decommission — decommission asset"
      - "POST /v1/addons/{id}/approve|reject — add-on decisions"
      - "POST /v1/visits/{id}/write-off — write off a visit charge"
      - "POST /v1/invoices — create draft invoice"
      - "POST /v1/invoices/{id}/issue|pay|void — invoice lifecycle"
      - "POST /_clock/set_current_utc — set clock"
    shared_operations:
      - "POST /v1/routes — create route (shared with CrewLead)"
      - "POST /v1/visits — schedule visit (shared with CrewLead)"
      - "POST /v1/visits/{id}/cancel — cancel visit (shared with CrewLead)"
      - "POST /v1/reservations — reserve equipment (shared with CrewLead)"
      - "POST /v1/reservations/{id}/release — release (shared with CrewLead)"
      - "POST /v1/addons — request add-on (shared with CrewLead)"
      - "POST /v1/storm-events — report storm event (shared with DispatchOperator)"
      - "GET endpoints — shared read across all roles"

  - name: CrewLead
    description: "Owns route execution and field work: routes, visit start/complete/cancel, equipment reservations, add-on requests."
    identity: opaque
    exclusive_operations:
      - "POST /v1/routes/{id}/lock — lock route"
      - "POST /v1/visits/{id}/start — start visit"
      - "POST /v1/visits/{id}/complete — complete visit"
    shared_operations:
      - "POST /v1/routes — create route (shared with AccountManager)"
      - "POST /v1/visits — schedule visit (shared with AccountManager)"
      - "POST /v1/visits/{id}/cancel — cancel visit (shared with AccountManager)"
      - "POST /v1/reservations — reserve (shared with AccountManager)"
      - "POST /v1/reservations/{id}/release — release (shared with AccountManager)"
      - "POST /v1/addons — request add-on (shared with AccountManager)"
      - "GET endpoints — shared read"

  - name: QualityInspector
    description: "Owns quality inspections; segregated from the crew that performed the work."
    identity: opaque
    exclusive_operations:
      - "POST /v1/inspections — open inspection"
      - "POST /v1/inspections/{id}/grade — grade inspection"
      - "POST /v1/inspections/{id}/reopen — reopen for rework"
    shared_operations:
      - "GET endpoints — shared read"

  - name: DispatchOperator
    description: "Owns snow/storm dispatch lifecycle."
    identity: opaque
    exclusive_operations:
      - "POST /v1/storm-events/{id}/dispatch — dispatch crew"
      - "POST /v1/storm-events/{id}/abandon — abandon dispatch"
      - "POST /v1/storm-events/{id}/resolve — resolve event"
      - "POST /v1/storm-events/{id}/stand-down — stand down event"
    shared_operations:
      - "POST /v1/storm-events — report storm event (shared with AccountManager)"
      - "GET endpoints — shared read"
