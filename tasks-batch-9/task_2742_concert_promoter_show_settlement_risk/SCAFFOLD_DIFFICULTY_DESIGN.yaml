      - name: tier_inventory_conserved_across_hold_release_convert_and_expiry
        grounds:
          - "calculations.tier_inventory_conservation"
          - "state_machines.TicketHold.HELD_to_RELEASED"
          - "state_machines.TicketHold.HELD_to_CONVERTED"
          - "state_machines.TicketHold.HELD_to_EXPIRED"
          - "validations[priority=32]"
          - "entities.TicketTier.fields.available_qty"
        distinguishing_aspect: |
          CONSERVED QUANTITY: whole-ticket inventory on a TicketTier —
          allocation_qty == sold_qty + comp_qty + held_qty + available_qty — a COUNT invariant with
          no rounding, entirely different from the sibling's money ledger. Three distinct
          compensating movements are exercised against the same tier: release (held -> available,
          exact inverse of create), expiry via POST /_ops/run (the same inverse reached by a
          different actor and trigger), and convert-to-comp, which is the one movement that
          reclassifies a ticket WITHOUT touching available_qty. The invariant is asserted at all
          nine intermediate states, and the comp allowance is pinned at exactly 30 on an allocation
          of 1000 so that a converted ARTIST_HOLD provably counts as a comp forever: the very next
          single COMP ticket is refused. An implementation that leaves a converted hold in held_qty
          as well as comp_qty breaks the sum by 5 at step 5; one that credits available_qty on
          conversion breaks it by 5 in the other direction.
        test_recipe:
          setup:
            - "One Market, Artist, Venue (capacity 1200) and a RENTAL show with an ACCEPTED FLAT_GUARANTEE offer of 1000000."
            - "One TicketTier GA with allocation_qty 1000 at price_cents 2000; comp_allowance_qty for the show is therefore ROUND_HALF_UP(1000 * 3.00 / 100) == 30."
            - "The show is ON_SALE (sales_status SELLING) and 400 GA tickets have been sold, so the tier reads sold 400 / comp 0 / held 0 / available 600."
            - "The clock sits at 2026-08-05T15:00:00Z, before every hold's expires_at."
