scenario: "desgin task harder than expert level.!!!! 2162. Workplace Accommodation & Interactive Process (ADA): request intake & medical documentation request limits, essential-function analysis with manager, accommodation option exploration & undue-hardship assessment, trial period & effectiveness review, denial documentation & appeal, recurring/renewal review cadence, confidentiality of medical information, cross-reference with leave & workers' compensation"
domain_name: ada-workplace-accommodation
api_prefix: "/"

complexity_profile:
  primary_archetype: multi_party_negotiation
  secondary_archetype: compliance_audit
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - scheduled_deferred_actions

  entity_topology: graph
  # AccommodationOption <-> EssentialFunction is many-to-many through
  # `coverage_function_ids`; FunctionAnalysis is an explicit junction between
  # AccommodationRequest and EssentialFunction; AccommodationRequest is
  # self-referential through `renewal_of_request_id`; AbsenceRecord crosses the
  # aggregate boundary into both AccommodationRequest and TrialPeriod.

  state_machine_shape: cyclic
  # AccommodationRequest.stage loops through OPTION_EXPLORATION from four
  # distinct re-entry points (hardship exhaustion, ineffective trial, appeal
  # remand, renewal modification); Appeal.status loops UNDER_REVIEW ->
  # SUPPLEMENT_REQUESTED -> UNDER_REVIEW; TrialPeriod.status loops
  # ACTIVE -> UNDER_REVIEW -> ACTIVE on extension; AccommodationOption.status
  # loops HARDSHIP_BLOCKED -> PROPOSED -> CLEARED on cost revision.
  # AccommodationRequest additionally carries a parallel state dimension
  # (`confidentiality_posture`) that evolves independently of `stage`.

  relationship_patterns:
    - one_to_many
    - many_to_many
    - self_referential
    - polymorphic
    - cross_aggregate

  role_model: segregation_of_duties
  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# ---------------------------------------------------------------------------
# §1.1 Entity-Relationship Table
# ---------------------------------------------------------------------------
entities:

  - name: Employee
    parent: null
    common_fields: true
    fields:
      - name: employee_number
        type: string
        source: input
        description: Payroll identifier, unique across all Employee rows.
        constraints: "unique; 1..32 chars"
      - name: full_name
        type: string
        source: input
        description: Employee display name.
      - name: department_code
        type: string
        source: input
        description: Organizational unit code; Manager-role scope checks compare this value.
      - name: job_title
        type: string
        source: input
        description: Free-text job title.
      - name: hire_date
        type: string
        source: input
        description: ISO 8601 calendar date (YYYY-MM-DD) of hire.
      - name: job_profile_id
        type: string
        source: input
        description: "FK -> JobProfile.id; the job profile whose essential functions govern this employee's analyses."
      - name: is_people_manager
        type: boolean
        source: input
        default: false
        description: True when this Employee may act under the Manager role.
      - name: annual_salary_cents
        type: integer
        source: input
        description: Annual base salary in whole cents.
        constraints: ">= 0"
      - name: employment_status
        type: enum
        source: computed
        default: ACTIVE
        description: Derived from the employee's AbsenceRecord rows.
        constraints: "one of {ACTIVE, ON_LEAVE, RESTRICTED_DUTY}"
      - name: open_case_count
        type: integer
        source: computed
        default: 0
        description: Count of AccommodationRequest rows for this employee whose stage is not in {CLOSED, WITHDRAWN, DENIED_FINAL}.
      - name: lifetime_denial_count
        type: integer
        source: computed
        default: 0
        description: Count of DenialRecord rows on this employee's requests whose status is in {ISSUED, APPEALED, FINAL}; VACATED denials are excluded.

  - name: JobProfile
    parent: null
    common_fields: true
    fields:
      - name: job_code
        type: string
        source: input
        description: Business key for the profile, unique across all JobProfile rows.
        constraints: "unique"
      - name: title
        type: string
        source: input
        description: Profile title.
      - name: department_code
        type: string
        source: input
        description: Owning department code.
      - name: department_annual_budget_cents
        type: integer
        source: input
        description: Annual accommodation budget of the owning department, in whole cents; denominator of the SITE_LOCAL hardship variant.
        constraints: "> 0"
      - name: employer_annual_budget_cents
        type: integer
        source: input
        description: Annual employer-wide accommodation budget in whole cents; denominator of the EMPLOYER_WIDE hardship variant.
        constraints: "> 0"
      - name: status
        type: enum
        source: computed
        default: DRAFT
        description: DRAFT while essential functions are being authored; PUBLISHED once frozen. A published profile is never reopened; a successor profile is created with a new job_code instead.
        constraints: "one of {DRAFT, PUBLISHED}"
      - name: profile_version_label
        type: string
        source: computed
        default: null
        description: Label stamped at publish time; copied onto every AccommodationRequest that pins this profile.
      - name: essential_function_count
        type: integer
        source: computed
        default: 0
        description: Count of EssentialFunction rows on this profile whose status is ACTIVE.
      - name: total_essential_weight
        type: integer
        source: computed
        default: 0
        description: Sum of criticality_weight over EssentialFunction rows on this profile with is_essential == true AND status == ACTIVE.
      - name: committed_accommodation_cost_cents
        type: integer
        source: computed
        default: 0
        description: Ledger of accommodation spend committed against this profile's department budget; see calculation committed_cost_ledger.

  - name: EssentialFunction
    parent: JobProfile
    common_fields: true
    fields:
      - name: job_profile_id
        type: string
        source: system
        description: "FK -> JobProfile.id; owning profile, taken from the path."
      - name: function_code
        type: string
        source: input
        description: Business key for the function, unique within its JobProfile.
        constraints: "unique per job_profile_id"
      - name: description
        type: string
        source: input
        description: Narrative description of the job duty.
      - name: criticality_weight
        type: integer
        source: input
        description: Relative importance weight used by coverage and disruption math.
        constraints: "1..10"
      - name: frequency_per_week
        type: integer
        source: input
        description: Times per week the duty is performed.
        constraints: "0..40"
      - name: is_essential
        type: boolean
        source: input
        default: true
        description: False marks the duty as marginal; marginal duties never enter coverage numerator or denominator.
      - name: marginal_reassignable
        type: boolean
        source: input
        default: false
        description: True when a marginal duty may be reassigned to a coworker.
      - name: status
        type: enum
        source: computed
        default: ACTIVE
        description: RETIRED removes the function from all coverage and weight math from that moment forward.
        constraints: "one of {ACTIVE, RETIRED}"

  - name: AccommodationRequest
    parent: null
    common_fields: true
    fields:
      - name: employee_id
        type: string
        source: input
        description: "FK -> Employee.id; the requesting employee."
      - name: job_profile_id
        type: string
        source: computed
        description: "FK -> JobProfile.id; pinned at intake to the requesting employee's job_profile_id, which must be PUBLISHED at that moment."
      - name: pinned_profile_version_label
        type: string
        source: computed
        description: Copy of JobProfile.profile_version_label taken at intake; never refreshed afterwards.
      - name: request_channel
        type: enum
        source: input
        description: How the accommodation request reached the employer.
        constraints: "one of {WRITTEN, VERBAL, MANAGER_OBSERVED, HR_INITIATED}"
      - name: requested_accommodation_text
        type: string
        source: input
        description: The accommodation the employee asked for, in the employee's own words.
      - name: disability_obvious
        type: boolean
        source: input
        default: false
        description: True when the limitation is obvious or already known, which forbids any medical documentation request on this case.
      - name: absence_record_id
        type: string
        source: input
        default: null
        description: "FK -> AbsenceRecord.id; linked leave or workers'-compensation record, null when the case is not cross-referenced."
      - name: renewal_of_request_id
        type: string
        source: computed
        default: null
        description: "FK -> AccommodationRequest.id; predecessor case when this request was opened by a renewal review, null otherwise."
      - name: selected_option_id
        type: string
        source: computed
        default: null
        description: "FK -> AccommodationOption.id; the option chosen by the decision, null until a GRANT decision is recorded."
      - name: stage
        type: enum
        source: computed
        default: INTAKE
        description: Primary lifecycle dimension; see the AccommodationRequest.stage state machine.
        constraints: "one of {INTAKE, DOC_PENDING, FUNCTION_ANALYSIS, OPTION_EXPLORATION, HARDSHIP_REVIEW, DECISION_PENDING, TRIAL_SETUP, TRIAL_ACTIVE, GRANTED_PERMANENT, DENIED, UNDER_APPEAL, RENEWAL_DUE, CLOSED, WITHDRAWN, DENIED_FINAL}"
      - name: confidentiality_posture
        type: enum
        source: computed
        default: STANDARD
        description: Parallel state dimension governing medical-information handling; evolves independently of stage.
        constraints: "one of {STANDARD, RESTRICTED, SEALED}"
      - name: interactive_round_count
        type: integer
        source: computed
        default: 0
        description: Number of times the case has re-entered OPTION_EXPLORATION after leaving it; capped by MAX_INTERACTIVE_ROUNDS.
      - name: medical_doc_request_count
        type: integer
        source: computed
        default: 0
        description: Count of MedicalDocumentationRequest rows on this case whose status is not WITHDRAWN.
      - name: medical_doc_request_limit
        type: integer
        source: computed
        default: 2
        description: Ceiling on medical_doc_request_count; see calculation documentation_budget.
      - name: documentation_budget_remaining
        type: integer
        source: computed
        default: 2
        description: medical_doc_request_limit minus medical_doc_request_count; never negative.
      - name: cleared_option_count
        type: integer
        source: computed
        default: 0
        description: Count of AccommodationOption rows on this case currently in status CLEARED.
      - name: blocked_option_count
        type: integer
        source: computed
        default: 0
        description: Count of AccommodationOption rows on this case currently in status HARDSHIP_BLOCKED.
      - name: interactive_process_integrity_score
        type: integer
        source: computed
        default: 100
        description: Compliance score for the interactive process; see calculation interactive_process_integrity.
      - name: review_cadence_days
        type: integer
        source: computed
        default: null
        description: Days between recurring renewal reviews, fixed at the decision that granted the accommodation.
      - name: review_due_date
        type: string
        source: computed
        default: null
        description: ISO 8601 calendar date on which the next renewal review falls due.
      - name: review_cycle_index
        type: integer
        source: computed
        default: 0
        description: Number of completed renewal reviews on this case.
      - name: decision
        type: enum
        source: computed
        default: PENDING
        description: The recorded decision outcome of the interactive process.
        constraints: "one of {PENDING, GRANT_WITH_TRIAL, GRANT_PERMANENT, DENY}"

  - name: MedicalDocumentationRequest
    parent: AccommodationRequest
    common_fields: true
    fields:
      - name: request_id
        type: string
        source: system
        description: "FK -> AccommodationRequest.id; parent accommodation case, taken from the path."
      - name: round_index
        type: integer
        source: computed
        description: 1-based ordinal of this documentation round within its case, assigned in issuance order.
      - name: scope_fields_requested
        type: array
        source: input
        description: Medical information categories requested from the provider.
        constraints: "non-empty; members of {functional_limitations, work_restrictions, restriction_duration, prognosis, accommodation_needed, diagnosis, treatment_plan}"
      - name: issued_at
        type: datetime
        source: computed
        description: Logical-clock instant at which the round was issued; opens the half-open response window.
      - name: due_date
        type: datetime
        source: input
        description: Logical-clock instant at which the response window closes (exclusive endpoint).
        constraints: "must be strictly after issued_at"
      - name: responded_at
        type: datetime
        source: computed
        default: null
        description: Logical-clock instant at which the employee submitted the response.
      - name: response_summary
        type: string
        source: computed
        default: null
        description: Free-text summary supplied by the employee at response time.
      - name: is_second_opinion
        type: boolean
        source: input
        default: false
        description: True when the employer is seeking a second opinion at its own expense.
      - name: adjudication_note
        type: string
        source: computed
        default: null
        description: Note recorded by the MedicalReviewOfficer when adjudicating sufficiency.
      - name: status
        type: enum
        source: computed
        default: ISSUED
        description: Documentation round lifecycle.
        constraints: "one of {ISSUED, RESPONDED, ACCEPTED_SUFFICIENT, REJECTED_INSUFFICIENT, EXPIRED, WITHDRAWN}"

  - name: FunctionAnalysis
    parent: null
    common_fields: true
    fields:
      - name: request_id
        type: string
        source: system
        description: "FK -> AccommodationRequest.id; the case this analysis belongs to, taken from the path."
      - name: essential_function_id
        type: string
        source: input
        description: "FK -> EssentialFunction.id; the job duty analyzed."
      - name: manager_id
        type: string
        source: system
        description: "FK -> Employee.id; the people manager who performed the analysis, taken from X-User-ID."
      - name: can_perform_unaided
        type: boolean
        source: input
        description: Whether the employee can perform this duty with no accommodation.
      - name: limitation_severity
        type: integer
        source: input
        description: Manager's severity rating of the limitation on this duty.
        constraints: "0..5"
      - name: proposed_treatment
        type: enum
        source: input
        description: How the manager proposes to handle the duty.
        constraints: "one of {NOT_LIMITED, PERFORM_WITH_AID, RESTRUCTURE, REASSIGN_MARGINAL, CANNOT_PERFORM}"
      - name: employee_dispute_note
        type: string
        source: computed
        default: null
        description: Note recorded when the employee disputes the manager's analysis.
      - name: status
        type: enum
        source: computed
        default: RECORDED
        description: RECORDED counts toward analysis completeness; DISPUTED does not; SUPERSEDED is set by the cascade that fires when the analyzed EssentialFunction is retired.
        constraints: "one of {RECORDED, DISPUTED, SUPERSEDED}"

  - name: AccommodationOption
    parent: AccommodationRequest
    common_fields: true
    fields:
      - name: request_id
        type: string
        source: system
        description: "FK -> AccommodationRequest.id; case under which this option is explored, taken from the path."
      - name: option_code
        type: string
        source: input
        description: Business key for the option, unique within its case.
        constraints: "unique per request_id"
      - name: category
        type: enum
        source: input
        description: Accommodation family.
        constraints: "one of {EQUIPMENT, SCHEDULE_MODIFICATION, TELEWORK, JOB_RESTRUCTURING, REASSIGNMENT, LEAVE_AS_ACCOMMODATION, POLICY_EXCEPTION}"
      - name: proposed_by_role
        type: string
        source: system
        description: The X-User-Role value that created the option; either Employee or AccommodationCoordinator.
      - name: one_time_cost_cents
        type: integer
        source: input
        default: 0
        description: Non-recurring implementation cost in whole cents, before the ADA tax credit.
        constraints: ">= 0"
      - name: recurring_monthly_cost_cents
        type: integer
        source: input
        default: 0
        description: Recurring monthly cost in whole cents, before the ADA tax credit.
        constraints: ">= 0"
      - name: implementation_days
        type: integer
        source: input
        description: Calendar days from selection to the accommodation being in place.
        constraints: "0..365"
      - name: coverage_function_ids
        type: array
        source: input
        description: Array of EssentialFunction id values this option makes performable; every member must be an ACTIVE, essential function on the case's pinned JobProfile.
        constraints: "may be empty"
      - name: option_net_cost_cents
        type: integer
        source: computed
        description: Tax-credit-adjusted total cost; see calculation option_net_cost.
      - name: coverage_ratio
        type: number
        source: computed
        description: Fraction of pinned essential-function weight this option covers; see calculation essential_function_coverage.
      - name: committed_cost_cents
        type: integer
        source: computed
        default: 0
        description: Amount this option currently holds against JobProfile.committed_accommodation_cost_cents; zero unless the option is SELECTED or IMPLEMENTED.
      - name: status
        type: enum
        source: computed
        default: PROPOSED
        description: Option lifecycle; see the AccommodationOption state machine.
        constraints: "one of {PROPOSED, CLEARED, HARDSHIP_BLOCKED, SELECTED, IMPLEMENTED, TRIAL_FAILED, SHELVED, WITHDRAWN}"

  - name: UndueHardshipAssessment
    parent: AccommodationOption
    common_fields: true
    fields:
      - name: option_id
        type: string
        source: system
        description: "FK -> AccommodationOption.id; the option assessed, taken from the path."
      - name: assessment_basis
        type: enum
        source: input
        description: Which budget denominator the assessment uses; selects the calculation variant.
        constraints: "one of {EMPLOYER_WIDE, SITE_LOCAL}"
      - name: assessor_user_id
        type: string
        source: system
        description: X-User-ID of the FinanceOfficer who ran the assessment.
      - name: assessed_net_cost_cents
        type: integer
        source: computed
        description: Snapshot of AccommodationOption.option_net_cost_cents at assessment time.
      - name: denominator_cents
        type: integer
        source: computed
        description: The budget figure used as the ratio denominator, chosen by assessment_basis.
      - name: budget_ratio
        type: number
        source: computed
        description: assessed_net_cost_cents divided by denominator_cents, rounded to 6 decimal places.
      - name: budget_ratio_norm
        type: number
        source: computed
        description: budget_ratio normalized onto a 0..100 scale and capped at 100.
      - name: disruption_index
        type: number
        source: computed
        description: Uncovered essential-function weight expressed on a 0..100 scale.
      - name: lag_norm
        type: number
        source: computed
        description: implementation_days normalized onto a 0..100 scale and capped at 100.
      - name: raw_hardship_score
        type: number
        source: computed
        description: Weighted pre-credit hardship score; the mitigation tier is selected from THIS value.
      - name: mitigation_credit_rate
        type: number
        source: computed
        description: Credit rate selected from the raw_hardship_score band.
      - name: hardship_score
        type: number
        source: computed
        description: Final post-credit hardship score, two decimal places.
      - name: hardship_verdict
        type: enum
        source: computed
        description: Verdict derived from hardship_score thresholds.
        constraints: "one of {NOT_UNDUE, BORDERLINE, UNDUE}"
      - name: status
        type: enum
        source: computed
        default: CURRENT
        description: SUPERSEDED once a later assessment or an appeal remand invalidates this one.
        constraints: "one of {CURRENT, SUPERSEDED}"

  - name: TrialPeriod
    parent: null
    common_fields: true
    fields:
      - name: request_id
        type: string
        source: input
        description: "FK -> AccommodationRequest.id; case the trial belongs to."
      - name: option_id
        type: string
        source: input
        description: "FK -> AccommodationOption.id; the accommodation being trialed."
      - name: employee_id
        type: string
        source: computed
        description: "FK -> Employee.id; copied from the case at creation; the resource against which trial windows are deconflicted."
      - name: start_date
        type: string
        source: input
        description: ISO 8601 calendar date; inclusive start of the trial occupancy interval.
      - name: end_date
        type: string
        source: input
        description: ISO 8601 calendar date; inclusive end of the trial occupancy interval.
        constraints: "must be >= start_date"
      - name: checkin_cadence_days
        type: integer
        source: input
        default: 14
        description: Nominal days between effectiveness check-ins.
        constraints: "1..90"
      - name: scoring_mode
        type: enum
        source: input
        default: LATEST_WEIGHTED
        description: Selects the effectiveness scoring variant.
        constraints: "one of {CUMULATIVE_MEAN, LATEST_WEIGHTED}"
      - name: review_count
        type: integer
        source: computed
        default: 0
        description: Count of EffectivenessReview rows recorded against this trial.
      - name: effectiveness_score
        type: number
        source: computed
        default: null
        description: Current effectiveness score under scoring_mode; see calculation trial_effectiveness.
      - name: extension_count
        type: integer
        source: computed
        default: 0
        description: Number of extensions granted; capped by MAX_TRIAL_EXTENSIONS.
      - name: outcome
        type: enum
        source: computed
        default: PENDING
        description: Terminal judgement of the trial.
        constraints: "one of {PENDING, EFFECTIVE, INEFFECTIVE, ABORTED}"
      - name: status
        type: enum
        source: computed
        default: SCHEDULED
        description: Trial lifecycle; see the TrialPeriod state machine.
        constraints: "one of {SCHEDULED, ACTIVE, UNDER_REVIEW, CONCLUDED_EFFECTIVE, CONCLUDED_INEFFECTIVE, ABORTED}"

  - name: EffectivenessReview
    parent: TrialPeriod
    common_fields: false
    fields:
      - name: trial_period_id
        type: string
        source: system
        description: "FK -> TrialPeriod.id; the trial being reviewed, taken from the path."
      - name: review_index
        type: integer
        source: computed
        description: 1-based ordinal of this review within its trial, assigned in recording order.
      - name: review_date
        type: string
        source: computed
        description: ISO 8601 calendar date read from the logical clock at recording time.
      - name: employee_rating
        type: integer
        source: input
        description: Employee's subjective effectiveness rating.
        constraints: "0..10"
      - name: manager_rating
        type: integer
        source: input
        description: Manager's subjective effectiveness rating.
        constraints: "0..10"
      - name: objective_metric_pct
        type: integer
        source: input
        description: Objective productivity attainment percentage.
        constraints: "0..100"
      - name: reviewer_user_id
        type: string
        source: system
        description: X-User-ID of the actor who recorded the review.
      - name: review_composite
        type: number
        source: computed
        description: Blended per-review score on a 0..10 scale, four decimal places.

  - name: DenialRecord
    parent: null
    common_fields: true
    fields:
      - name: request_id
        type: string
        source: system
        description: "FK -> AccommodationRequest.id; the denied case."
      - name: denial_basis
        type: enum
        source: input
        description: Statutory basis recorded for the denial.
        constraints: "one of {UNDUE_HARDSHIP, DIRECT_THREAT, NOT_QUALIFIED, NO_DISABILITY_NEXUS, INSUFFICIENT_DOCUMENTATION, FAILURE_TO_COOPERATE}"
      - name: rationale_text
        type: string
        source: input
        description: Narrative rationale required on every denial.
      - name: alternative_option_id
        type: string
        source: input
        default: null
        description: "FK -> AccommodationOption.id; alternative accommodation offered alongside the denial, null when none was offered."
      - name: rejected_option_ids
        type: array
        source: computed
        description: Ids of every AccommodationOption on the case whose status was HARDSHIP_BLOCKED or CLEARED at denial time.
      - name: issued_by_user_id
        type: string
        source: system
        description: X-User-ID of the AccommodationCoordinator who issued the denial; the segregation-of-duties comparand.
      - name: issued_at
        type: datetime
        source: computed
        description: Logical-clock instant of issuance.
      - name: appeal_deadline_date
        type: string
        source: computed
        description: ISO 8601 calendar date, issuance date plus APPEAL_WINDOW_DAYS; appeals must be filed on or before this date.
      - name: appeal_count
        type: integer
        source: computed
        default: 0
        description: Number of Appeal rows filed against this denial.
      - name: status
        type: enum
        source: computed
        default: ISSUED
        description: Denial lifecycle.
        constraints: "one of {ISSUED, APPEALED, FINAL, VACATED}"

  - name: Appeal
    parent: DenialRecord
    common_fields: true
    fields:
      - name: denial_record_id
        type: string
        source: system
        description: "FK -> DenialRecord.id; the denial under appeal, taken from the path."
      - name: grounds_text
        type: string
        source: input
        description: The employee's stated grounds for appeal.
      - name: filed_by_user_id
        type: string
        source: system
        description: X-User-ID of the employee who filed.
      - name: filed_at
        type: datetime
        source: computed
        description: Logical-clock instant of filing.
      - name: appeal_officer_user_id
        type: string
        source: computed
        default: null
        description: X-User-ID of the AppealOfficer who took the appeal under review.
      - name: supplement_count
        type: integer
        source: computed
        default: 0
        description: Number of supplemental submissions the employee has made; capped by MAX_APPEAL_SUPPLEMENTS.
      - name: stay_count
        type: integer
        source: computed
        default: 0
        description: Number of times review was stayed by a confidentiality seal.
      - name: outcome
        type: enum
        source: computed
        default: PENDING
        description: Terminal judgement of the appeal.
        constraints: "one of {PENDING, UPHELD, REVERSED, REMANDED, DISMISSED}"
      - name: status
        type: enum
        source: computed
        default: FILED
        description: Appeal lifecycle; see the Appeal state machine.
        constraints: "one of {FILED, UNDER_REVIEW, SUPPLEMENT_REQUESTED, UPHELD, REVERSED, REMANDED, DISMISSED}"

  - name: AbsenceRecord
    parent: null
    common_fields: true
    fields:
      - name: employee_id
        type: string
        source: input
        description: "FK -> Employee.id; the employee on leave or under restriction."
      - name: record_type
        type: enum
        source: input
        description: Polymorphic discriminator across leave and workers'-compensation records.
        constraints: "one of {FMLA_CONTINUOUS, FMLA_INTERMITTENT, STATE_LEAVE, WC_RESTRICTION}"
      - name: start_date
        type: string
        source: input
        description: ISO 8601 calendar date; inclusive start of the occupancy interval.
      - name: end_date
        type: string
        source: input
        description: ISO 8601 calendar date; exclusive end of the occupancy interval.
        constraints: "must be strictly after start_date"
      - name: weekly_intermittent_days
        type: integer
        source: input
        default: 0
        description: Days per week consumed, meaningful only for FMLA_INTERMITTENT records.
        constraints: "0..7"
      - name: restriction_severity
        type: integer
        source: input
        default: 0
        description: Physician-assigned restriction severity, meaningful only for WC_RESTRICTION records.
        constraints: "0..5"
      - name: modified_duty_available
        type: boolean
        source: input
        default: false
        description: True when the employer has modified duty available for this restriction.
      - name: claim_reference
        type: string
        source: input
        default: null
        description: External carrier claim number for WC_RESTRICTION records.
      - name: status
        type: enum
        source: computed
        default: SCHEDULED
        description: Absence lifecycle; see the AbsenceRecord state machine.
        constraints: "one of {SCHEDULED, ACTIVE, MODIFIED_DUTY, EXHAUSTED, CLOSED}"

  - name: MedicalDisclosure
    parent: AccommodationRequest
    common_fields: false
    fields:
      - name: request_id
        type: string
        source: system
        description: "FK -> AccommodationRequest.id; the case whose medical information was disclosed."
      - name: disclosed_to_role
        type: enum
        source: input
        description: Role that received the medical information.
        constraints: "one of {Manager, AccommodationCoordinator, MedicalReviewOfficer, FinanceOfficer, AppealOfficer, ComplianceAuditor, EXTERNAL}"
      - name: disclosed_to_user_id
        type: string
        source: input
        description: Identifier of the recipient.
      - name: disclosure_purpose
        type: enum
        source: input
        description: Stated purpose of the disclosure.
        constraints: "one of {FUNCTION_ANALYSIS, HARDSHIP_ASSESSMENT, APPEAL_REVIEW, AUDIT, SAFETY_EMERGENCY, OTHER}"
      - name: fields_disclosed
        type: array
        source: input
        description: Medical information categories actually disclosed.
        constraints: "non-empty; members of {functional_limitations, work_restrictions, restriction_duration, prognosis, accommodation_needed, diagnosis, treatment_plan}"
      - name: authorized
        type: boolean
        source: computed
        description: Whether the disclosure was permissible; see calculation disclosure_authorization.
      - name: logged_by_user_id
        type: string
        source: system
        description: X-User-ID of the actor who appended this log row.

# ---------------------------------------------------------------------------
# §1.2 State Machine Table
# ---------------------------------------------------------------------------
state_machines:

  # -- Primary dimension: AccommodationRequest.stage (cyclic) ---------------
  - entity: AccommodationRequest
    dimension: stage
    initial_state: INTAKE
    terminal_states: [CLOSED, WITHDRAWN, DENIED_FINAL]
    transitions:
      - from: INTAKE
        to: DOC_PENDING
        trigger: "POST /accommodation-requests/{id}/medical-doc-requests"
        actor: AccommodationCoordinator
        preconditions:
          - "request.disability_obvious == false"
          - "request.documentation_budget_remaining >= 1"
          - "request.confidentiality_posture != SEALED"
        side_effects:
          - "creates MedicalDocumentationRequest with status ISSUED and round_index = request.medical_doc_request_count + 1"
          - "increments AccommodationRequest.medical_doc_request_count by 1"
          - "recomputes AccommodationRequest.documentation_budget_remaining"
          - "increments AccommodationRequest.version by 1"

      - from: INTAKE
        to: FUNCTION_ANALYSIS
        trigger: "POST /accommodation-requests/{id}/advance with target_stage = FUNCTION_ANALYSIS"
        actor: AccommodationCoordinator
        preconditions:
          - "request.disability_obvious == true"
        side_effects:
          - "sets AccommodationRequest.stage = FUNCTION_ANALYSIS"
        note: "An obvious limitation lets the case skip documentation entirely."

      - from: DOC_PENDING
        to: DOC_PENDING
        trigger: "POST /accommodation-requests/{id}/medical-doc-requests (subsequent round)"
        actor: AccommodationCoordinator
        preconditions:
          - "no MedicalDocumentationRequest on the case is in status ISSUED whose half-open window [issued_at, due_date) strictly contains the new issued_at"
          - "request.documentation_budget_remaining >= 1"
          - "request.confidentiality_posture != SEALED"
        side_effects:
          - "creates MedicalDocumentationRequest with status ISSUED"
          - "increments AccommodationRequest.medical_doc_request_count by 1"
          - "recomputes AccommodationRequest.documentation_budget_remaining"
          - "recomputes AccommodationRequest.interactive_process_integrity_score"
          - "increments AccommodationRequest.version by 1"
        note: "Self-loop: the interactive process may need more than one documentation round."

      - from: DOC_PENDING
        to: FUNCTION_ANALYSIS
        trigger: "POST /accommodation-requests/{id}/advance with target_stage = FUNCTION_ANALYSIS"
        actor: AccommodationCoordinator
        preconditions:
          - "at least one MedicalDocumentationRequest on the case is in status ACCEPTED_SUFFICIENT"
        side_effects:
          - "sets AccommodationRequest.stage = FUNCTION_ANALYSIS"

      - from: DOC_PENDING
        to: DENIED
        trigger: "POST /accommodation-requests/{id}/decide with decision = DENY"
        actor: AccommodationCoordinator
        preconditions:
          - "request.documentation_budget_remaining == 0"
          - "no MedicalDocumentationRequest on the case is in status ACCEPTED_SUFFICIENT"
          - "denial_basis IN {INSUFFICIENT_DOCUMENTATION, FAILURE_TO_COOPERATE}"
        side_effects:
          - "creates DenialRecord with status ISSUED, issued_by_user_id = X-User-ID, appeal_deadline_date = issuance date + APPEAL_WINDOW_DAYS"
          - "sets AccommodationRequest.stage = DENIED and decision = DENY"
          - "increments Employee.lifetime_denial_count by 1"

      - from: FUNCTION_ANALYSIS
        to: OPTION_EXPLORATION
        trigger: "POST /accommodation-requests/{id}/advance with target_stage = OPTION_EXPLORATION"
        actor: AccommodationCoordinator
        preconditions:
          - "every EssentialFunction on the pinned JobProfile with is_essential == true AND status == ACTIVE has exactly one FunctionAnalysis on this case in status RECORDED"
        side_effects:
          - "sets AccommodationRequest.stage = OPTION_EXPLORATION"

      - from: OPTION_EXPLORATION
        to: HARDSHIP_REVIEW
        trigger: "POST /accommodation-requests/{id}/advance with target_stage = HARDSHIP_REVIEW"
        actor: AccommodationCoordinator
        preconditions:
          - "count of AccommodationOption on this case with status IN {PROPOSED, CLEARED} >= 1"
        side_effects:
          - "sets AccommodationRequest.stage = HARDSHIP_REVIEW"

      - from: HARDSHIP_REVIEW
        to: OPTION_EXPLORATION
        trigger: "POST /accommodation-requests/{id}/advance with target_stage = OPTION_EXPLORATION"
        actor: AccommodationCoordinator
        preconditions:
          - "request.cleared_option_count == 0"
          - "count of AccommodationOption on this case with status == PROPOSED == 0"
          - "request.interactive_round_count + 1 <= MAX_INTERACTIVE_ROUNDS"
        side_effects:
          - "sets AccommodationRequest.stage = OPTION_EXPLORATION"
          - "increments AccommodationRequest.interactive_round_count by 1"
        note: "Cycle: every option was ruled undue hardship, so the parties must keep exploring."

      - from: HARDSHIP_REVIEW
        to: DECISION_PENDING
        trigger: "POST /accommodation-requests/{id}/advance with target_stage = DECISION_PENDING"
        actor: AccommodationCoordinator
        preconditions:
          - "count of AccommodationOption on this case with status == PROPOSED == 0"
          - "request.cleared_option_count >= 1"
        side_effects:
          - "sets AccommodationRequest.stage = DECISION_PENDING"

      - from: DECISION_PENDING
        to: TRIAL_SETUP
        trigger: "POST /accommodation-requests/{id}/decide with decision = GRANT_WITH_TRIAL"
        actor: AccommodationCoordinator
        preconditions:
          - "selected_option_id names an AccommodationOption on this case with status == CLEARED"
          - "that option's coverage_ratio >= MIN_COVERAGE_RATIO"
        side_effects:
          - "sets AccommodationOption.status = SELECTED and committed_cost_cents = option_net_cost_cents"
          - "adds that amount to JobProfile.committed_accommodation_cost_cents"
          - "sets every other AccommodationOption on the case with status == CLEARED to SHELVED and recomputes request.cleared_option_count"
          - "sets AccommodationRequest.stage = TRIAL_SETUP, decision = GRANT_WITH_TRIAL, selected_option_id"
          - "computes AccommodationRequest.review_cadence_days and review_due_date per calculation renewal_cadence"

      - from: DECISION_PENDING
        to: GRANTED_PERMANENT
        trigger: "POST /accommodation-requests/{id}/decide with decision = GRANT_PERMANENT"
        actor: AccommodationCoordinator
        preconditions:
          - "selected_option_id names an AccommodationOption on this case with status == CLEARED"
          - "that option's coverage_ratio >= MIN_COVERAGE_RATIO"
        side_effects:
          - "sets AccommodationOption.status = IMPLEMENTED and committed_cost_cents = option_net_cost_cents"
          - "adds that amount to JobProfile.committed_accommodation_cost_cents"
          - "sets every other AccommodationOption on the case with status == CLEARED to SHELVED and recomputes request.cleared_option_count"
          - "sets AccommodationRequest.stage = GRANTED_PERMANENT, decision = GRANT_PERMANENT, selected_option_id"
          - "computes AccommodationRequest.review_cadence_days and review_due_date per calculation renewal_cadence"

      - from: DECISION_PENDING
        to: DENIED
        trigger: "POST /accommodation-requests/{id}/decide with decision = DENY"
        actor: AccommodationCoordinator
        preconditions:
          - "denial_basis is supplied and rationale_text is non-empty"
          - "if alternative_option_id is supplied it names an AccommodationOption on this case with status == CLEARED"
        side_effects:
          - "creates DenialRecord with status ISSUED, rejected_option_ids = ids of every option on the case in status CLEARED or HARDSHIP_BLOCKED, appeal_deadline_date = issuance date + APPEAL_WINDOW_DAYS"
          - "sets AccommodationRequest.stage = DENIED and decision = DENY"
          - "increments Employee.lifetime_denial_count by 1"

      - from: TRIAL_SETUP
        to: TRIAL_ACTIVE
        trigger: "POST /trial-periods"
        actor: AccommodationCoordinator
        preconditions:
          - "option_id == request.selected_option_id and that option's status == SELECTED"
          - "no other TrialPeriod for the same employee_id collides under the closed-interval + washout rule"
          - "no AbsenceRecord for the employee with record_type IN {FMLA_CONTINUOUS, STATE_LEAVE} and status == ACTIVE overlaps the trial interval"
          - "if request.absence_record_id names a WC_RESTRICTION record, that record's status == MODIFIED_DUTY"
        side_effects:
          - "creates TrialPeriod with status SCHEDULED and employee_id copied from the case"
          - "sets AccommodationRequest.stage = TRIAL_ACTIVE"

      - from: TRIAL_ACTIVE
        to: GRANTED_PERMANENT
        trigger: "POST /trial-periods/{id}/resolve with outcome = EFFECTIVE"
        actor: AccommodationCoordinator
        preconditions:
          - "trial.status == UNDER_REVIEW"
          - "trial.review_count >= MIN_TRIAL_REVIEWS"
          - "trial.effectiveness_score >= EFFECTIVE_THRESHOLD"
        side_effects:
          - "sets TrialPeriod.status = CONCLUDED_EFFECTIVE and outcome = EFFECTIVE"
          - "sets the trialed AccommodationOption.status = IMPLEMENTED, leaving committed_cost_cents unchanged"
          - "sets AccommodationRequest.stage = GRANTED_PERMANENT"
          - "recomputes AccommodationRequest.review_cadence_days and review_due_date per calculation renewal_cadence"

      - from: TRIAL_ACTIVE
        to: OPTION_EXPLORATION
        trigger: "POST /trial-periods/{id}/resolve with outcome = INEFFECTIVE"
        actor: AccommodationCoordinator
        preconditions:
          - "trial.status == UNDER_REVIEW"
          - "trial.review_count >= MIN_TRIAL_REVIEWS"
          - "trial.effectiveness_score < EFFECTIVE_THRESHOLD"
          - "request.interactive_round_count + 1 <= MAX_INTERACTIVE_ROUNDS"
        side_effects:
          - "CASCADE HOP 1: sets TrialPeriod.status = CONCLUDED_INEFFECTIVE and outcome = INEFFECTIVE"
          - "CASCADE HOP 2 (caused by hop 1): sets the trialed AccommodationOption.status = TRIAL_FAILED and releases committed_cost_cents to 0"
          - "CASCADE HOP 3 (caused by hop 2): subtracts the released amount from JobProfile.committed_accommodation_cost_cents"
          - "CASCADE HOP 4 (caused by hop 2): sets AccommodationRequest.stage = OPTION_EXPLORATION, increments interactive_round_count by 1, and raises medical_doc_request_limit by INEFFECTIVE_TRIAL_BONUS"
          - "CASCADE HOP 5 (caused by hop 4): recomputes AccommodationRequest.documentation_budget_remaining from the raised limit"
        note: "Depth-5 transitive cascade; each hop is caused by the hop above it, not by the original resolve call."

      - from: TRIAL_ACTIVE
        to: TRIAL_SETUP
        trigger: "POST /trial-periods/{id}/resolve with outcome = ABORT"
        actor: AccommodationCoordinator
        preconditions:
          - "trial.status IN {SCHEDULED, ACTIVE, UNDER_REVIEW}"
        side_effects:
          - "sets TrialPeriod.status = ABORTED and outcome = ABORTED"
          - "sets AccommodationRequest.stage = TRIAL_SETUP, leaving the selected option in status SELECTED and its committed_cost_cents intact"
        note: "An aborted trial still occupies its interval for washout purposes."

      - from: DENIED
        to: UNDER_APPEAL
        trigger: "POST /denial-records/{id}/appeals"
        actor: Employee
        preconditions:
          - "denial.status == ISSUED"
          - "current logical-clock date <= denial.appeal_deadline_date"
          - "request.confidentiality_posture != SEALED"
        side_effects:
          - "creates Appeal with status FILED"
          - "sets DenialRecord.status = APPEALED and increments appeal_count by 1"
          - "sets AccommodationRequest.stage = UNDER_APPEAL"

      - from: UNDER_APPEAL
        to: DENIED_FINAL
        trigger: "POST /appeals/{id}/decide with outcome = UPHOLD"
        actor: AppealOfficer
        preconditions:
          - "appeal.status == UNDER_REVIEW"
          - "request.interactive_process_integrity_score >= APPEAL_MANDATORY_REMAND_THRESHOLD"
        side_effects:
          - "sets Appeal.status = UPHELD and outcome = UPHELD"
          - "sets DenialRecord.status = FINAL"
          - "sets AccommodationRequest.stage = DENIED_FINAL"
          - "decrements Employee.open_case_count by 1"

      - from: UNDER_APPEAL
        to: DENIED
        trigger: "POST /appeals/{id}/decide with outcome = DISMISS"
        actor: AppealOfficer
        preconditions:
          - "appeal.status IN {FILED, UNDER_REVIEW}"
        side_effects:
          - "sets Appeal.status = DISMISSED and outcome = DISMISSED"
          - "sets DenialRecord.status = FINAL"
          - "sets AccommodationRequest.stage = DENIED"

      - from: UNDER_APPEAL
        to: GRANTED_PERMANENT
        trigger: "POST /appeals/{id}/decide with outcome = REVERSE"
        actor: AppealOfficer
        preconditions:
          - "appeal.status == UNDER_REVIEW"
          - "denial.alternative_option_id is non-null and that option's status is CLEARED or SHELVED"
        side_effects:
          - "sets Appeal.status = REVERSED and outcome = REVERSED"
          - "sets DenialRecord.status = VACATED and decrements Employee.lifetime_denial_count by 1"
          - "sets the alternative option status = IMPLEMENTED, committed_cost_cents = option_net_cost_cents, and adds that amount to JobProfile.committed_accommodation_cost_cents"
          - "sets AccommodationRequest.stage = GRANTED_PERMANENT, decision = GRANT_PERMANENT, selected_option_id = alternative_option_id"
          - "computes AccommodationRequest.review_cadence_days and review_due_date per calculation renewal_cadence"

      - from: UNDER_APPEAL
        to: OPTION_EXPLORATION
        trigger: "POST /appeals/{id}/decide with outcome = REMAND"
        actor: AppealOfficer
        preconditions:
          - "appeal.status == UNDER_REVIEW"
          - "request.interactive_round_count + 1 <= MAX_INTERACTIVE_ROUNDS"
        side_effects:
          - "CASCADE HOP 1: sets Appeal.status = REMANDED and outcome = REMANDED"
          - "CASCADE HOP 2 (caused by hop 1): sets DenialRecord.status = VACATED"
          - "CASCADE HOP 3 (caused by hop 2): decrements Employee.lifetime_denial_count by 1 and sets AccommodationRequest.stage = OPTION_EXPLORATION with interactive_round_count incremented by 1"
          - "CASCADE HOP 4 (caused by hop 3): resets every AccommodationOption on the case with status == HARDSHIP_BLOCKED back to PROPOSED, sets request.blocked_option_count = 0"
          - "CASCADE HOP 5 (caused by hop 4): sets every UndueHardshipAssessment whose option was reset and whose status == CURRENT to SUPERSEDED"
        note: "Depth-5 transitive cascade originating from an appeal decision."

      - from: GRANTED_PERMANENT
        to: RENEWAL_DUE
        trigger: "POST /_ops/daily-sweep (system)"
        actor: system
        preconditions:
          - "request.review_due_date is non-null and current logical-clock date >= request.review_due_date"
        side_effects:
          - "sets AccommodationRequest.stage = RENEWAL_DUE"

      - from: RENEWAL_DUE
        to: GRANTED_PERMANENT
        trigger: "POST /accommodation-requests/{id}/renewal-review with outcome = CONTINUE"
        actor: AccommodationCoordinator
        preconditions:
          - "request.confidentiality_posture != SEALED"
        side_effects:
          - "increments AccommodationRequest.review_cycle_index by 1"
          - "sets review_due_date = current logical-clock date + review_cadence_days"
          - "sets AccommodationRequest.stage = GRANTED_PERMANENT"
          - "increments AccommodationRequest.version by 1"
        note: "Cycle: the recurring review cadence re-arms itself."

      - from: RENEWAL_DUE
        to: OPTION_EXPLORATION
        trigger: "POST /accommodation-requests/{id}/renewal-review with outcome = MODIFY"
        actor: AccommodationCoordinator
        preconditions:
          - "request.interactive_round_count + 1 <= MAX_INTERACTIVE_ROUNDS"
        side_effects:
          - "increments AccommodationRequest.review_cycle_index by 1"
          - "sets AccommodationRequest.stage = OPTION_EXPLORATION and increments interactive_round_count by 1"
          - "increments AccommodationRequest.version by 1"

      - from: RENEWAL_DUE
        to: CLOSED
        trigger: "POST /accommodation-requests/{id}/renewal-review with outcome = CLOSE"
        actor: AccommodationCoordinator
        preconditions: []
        side_effects:
          - "increments AccommodationRequest.review_cycle_index by 1"
          - "sets AccommodationRequest.stage = CLOSED"
          - "sets the selected AccommodationOption status = IMPLEMENTED with committed_cost_cents released to 0 and subtracts that amount from JobProfile.committed_accommodation_cost_cents"
          - "decrements Employee.open_case_count by 1"
          - "increments AccommodationRequest.version by 1"

      - from: RENEWAL_DUE
        to: RENEWAL_DUE
        trigger: "POST /accommodation-requests/{id}/renewal-review with outcome = RENEW_SUCCESSOR"
        actor: AccommodationCoordinator
        preconditions:
          - "Employee.open_case_count + 1 <= MAX_OPEN_CASES_PER_EMPLOYEE"
        side_effects:
          - "increments AccommodationRequest.review_cycle_index by 1"
          - "creates a successor AccommodationRequest in stage INTAKE with renewal_of_request_id = this request's id, medical_doc_request_limit = BASE_DOC_REQUEST_LIMIT + RENEWAL_BONUS"
          - "increments Employee.open_case_count by 1"
          - "increments AccommodationRequest.version by 1"

      - from: INTAKE
        to: WITHDRAWN
        trigger: "POST /accommodation-requests/{id}/advance with target_stage = WITHDRAWN"
        actor: Employee
        preconditions:
          - "X-User-ID == request.employee_id"
        side_effects:
          - "sets AccommodationRequest.stage = WITHDRAWN"
          - "sets every AccommodationOption on the case with status IN {PROPOSED, CLEARED, HARDSHIP_BLOCKED} to WITHDRAWN"
          - "sets every MedicalDocumentationRequest on the case with status IN {ISSUED, RESPONDED} to WITHDRAWN and recomputes medical_doc_request_count"
          - "sets every TrialPeriod on the case with status IN {SCHEDULED, ACTIVE, UNDER_REVIEW} to ABORTED"
          - "decrements Employee.open_case_count by 1"
        note: "The same WITHDRAWN transition is available from DOC_PENDING, FUNCTION_ANALYSIS, OPTION_EXPLORATION, HARDSHIP_REVIEW, DECISION_PENDING, TRIAL_SETUP and TRIAL_ACTIVE with identical preconditions and side effects."

      - from: DENIED
        to: DENIED_FINAL
        trigger: "POST /_ops/daily-sweep (system)"
        actor: system
        preconditions:
          - "the case's DenialRecord has status == ISSUED, appeal_count == 0, and current logical-clock date > appeal_deadline_date"
        side_effects:
          - "sets DenialRecord.status = FINAL"
          - "sets AccommodationRequest.stage = DENIED_FINAL"
          - "decrements Employee.open_case_count by 1"

  # -- Parallel dimension: AccommodationRequest.confidentiality_posture -----
  - entity: AccommodationRequest
    dimension: confidentiality_posture
    initial_state: STANDARD
    terminal_states: []
    transitions:
      - from: STANDARD
        to: RESTRICTED
        trigger: "POST /medical-doc-requests/{id}/respond (system side effect)"
        actor: system
        preconditions:
          - "the responding MedicalDocumentationRequest belongs to this case"
        side_effects:
          - "sets AccommodationRequest.confidentiality_posture = RESTRICTED"
        note: "Once real medical content exists on the case, the posture hardens. Independent of stage."

      - from: STANDARD
        to: SEALED
        trigger: "POST /accommodation-requests/{id}/medical-disclosures resulting in authorized == false"
        actor: system
        preconditions: []
        side_effects:
          - "sets AccommodationRequest.confidentiality_posture = SEALED"
          - "recomputes AccommodationRequest.interactive_process_integrity_score"

      - from: RESTRICTED
        to: SEALED
        trigger: "POST /accommodation-requests/{id}/medical-disclosures resulting in authorized == false"
        actor: system
        preconditions: []
        side_effects:
          - "CASCADE HOP 1: appends MedicalDisclosure with authorized == false"
          - "CASCADE HOP 2 (caused by hop 1): sets AccommodationRequest.confidentiality_posture = SEALED and recomputes interactive_process_integrity_score"
          - "CASCADE HOP 3 (caused by hop 2): sets every Appeal on this case with status == UNDER_REVIEW to SUPPLEMENT_REQUESTED and increments that appeal's stay_count by 1"

      - from: SEALED
        to: RESTRICTED
        trigger: "POST /accommodation-requests/{id}/confidentiality with to_posture = RESTRICTED"
        actor: ComplianceAuditor
        preconditions:
          - "request.confidentiality_posture == SEALED"
        side_effects:
          - "sets AccommodationRequest.confidentiality_posture = RESTRICTED"
        note: "Unsealing never restores integrity score; disclosure penalties are permanent."

  # -- MedicalDocumentationRequest -----------------------------------------
  - entity: MedicalDocumentationRequest
    dimension: status
    initial_state: ISSUED
    terminal_states: [ACCEPTED_SUFFICIENT, REJECTED_INSUFFICIENT, EXPIRED, WITHDRAWN]
    transitions:
      - from: ISSUED
        to: RESPONDED
        trigger: "POST /medical-doc-requests/{id}/respond"
        actor: Employee
        preconditions:
          - "X-User-ID == the case's employee_id"
          - "current logical-clock instant < doc_request.due_date"
        side_effects:
          - "sets responded_at from the logical clock and response_summary from the payload"
          - "sets AccommodationRequest.confidentiality_posture = RESTRICTED when it is currently STANDARD"

      - from: ISSUED
        to: EXPIRED
        trigger: "POST /_ops/daily-sweep (system)"
        actor: system
        preconditions:
          - "current logical-clock instant >= doc_request.due_date"
        side_effects:
          - "sets status = EXPIRED"
          - "recomputes AccommodationRequest.interactive_process_integrity_score, applying PENALTY_EXPIRED_DOC_WINDOW"

      - from: ISSUED
        to: WITHDRAWN
        trigger: "POST /medical-doc-requests/{id}/withdraw"
        actor: AccommodationCoordinator
        preconditions: []
        side_effects:
          - "sets status = WITHDRAWN"
          - "decrements AccommodationRequest.medical_doc_request_count by 1 and recomputes documentation_budget_remaining"
          - "recomputes AccommodationRequest.interactive_process_integrity_score"

      - from: RESPONDED
        to: WITHDRAWN
        trigger: "POST /medical-doc-requests/{id}/withdraw"
        actor: AccommodationCoordinator
        preconditions: []
        side_effects:
          - "sets status = WITHDRAWN"
          - "decrements AccommodationRequest.medical_doc_request_count by 1 and recomputes documentation_budget_remaining"
          - "recomputes AccommodationRequest.interactive_process_integrity_score"

      - from: RESPONDED
        to: ACCEPTED_SUFFICIENT
        trigger: "POST /medical-doc-requests/{id}/adjudicate with verdict = SUFFICIENT"
        actor: MedicalReviewOfficer
        preconditions: []
        side_effects:
          - "sets status = ACCEPTED_SUFFICIENT and adjudication_note from the payload"

      - from: RESPONDED
        to: REJECTED_INSUFFICIENT
        trigger: "POST /medical-doc-requests/{id}/adjudicate with verdict = INSUFFICIENT"
        actor: MedicalReviewOfficer
        preconditions: []
        side_effects:
          - "sets status = REJECTED_INSUFFICIENT and adjudication_note from the payload"

  # -- AccommodationOption (branching fork with divergent side effects) -----
  - entity: AccommodationOption
    dimension: status
    initial_state: PROPOSED
    terminal_states: [IMPLEMENTED, TRIAL_FAILED, SHELVED, WITHDRAWN]
    transitions:
      - from: PROPOSED
        to: CLEARED
        trigger: "POST /accommodation-options/{id}/hardship-assessments producing hardship_verdict IN {NOT_UNDUE, BORDERLINE}"
        actor: FinanceOfficer
        preconditions:
          - "the case's stage == HARDSHIP_REVIEW"
          - "every EssentialFunction referenced by coverage_function_ids has status == ACTIVE and belongs to the case's pinned job_profile_id"
          - "expected_option_version matches AccommodationOption.version"
        side_effects:
          - "creates UndueHardshipAssessment with status CURRENT and supersedes any prior CURRENT assessment on this option"
          - "sets AccommodationOption.status = CLEARED"
          - "increments AccommodationRequest.cleared_option_count by 1"
          - "increments AccommodationOption.version by 1"
        note: "Branch A of the fork. The cleared counter moves; the blocked counter does not."

      - from: PROPOSED
        to: HARDSHIP_BLOCKED
        trigger: "POST /accommodation-options/{id}/hardship-assessments producing hardship_verdict == UNDUE"
        actor: FinanceOfficer
        preconditions:
          - "the case's stage == HARDSHIP_REVIEW"
          - "every EssentialFunction referenced by coverage_function_ids has status == ACTIVE and belongs to the case's pinned job_profile_id"
          - "expected_option_version matches AccommodationOption.version"
        side_effects:
          - "creates UndueHardshipAssessment with status CURRENT and supersedes any prior CURRENT assessment on this option"
          - "sets AccommodationOption.status = HARDSHIP_BLOCKED"
          - "increments AccommodationRequest.blocked_option_count by 1"
          - "increments AccommodationOption.version by 1"
        note: "Branch B of the fork. Divergent counter, and the case can no longer reach DECISION_PENDING through this option."

      - from: PROPOSED
        to: PROPOSED
        trigger: "PATCH /accommodation-options/{id}"
        actor: AccommodationCoordinator
        preconditions:
          - "the case's stage == HARDSHIP_REVIEW"
        side_effects:
          - "recomputes AccommodationOption.option_net_cost_cents and coverage_ratio"
          - "increments AccommodationOption.version by 1"
        note: "Self-loop: revising an option that has not been assessed yet leaves its status at PROPOSED but still advances its version, which invalidates any OCC token a FinanceOfficer already holds."

      - from: HARDSHIP_BLOCKED
        to: PROPOSED
        trigger: "PATCH /accommodation-options/{id}"
        actor: AccommodationCoordinator
        preconditions:
          - "the case's stage == HARDSHIP_REVIEW"
        side_effects:
          - "recomputes AccommodationOption.option_net_cost_cents and coverage_ratio"
          - "sets AccommodationOption.status = PROPOSED"
          - "decrements AccommodationRequest.blocked_option_count by 1"
          - "sets the option's CURRENT UndueHardshipAssessment to SUPERSEDED"
        note: "Cycle: a cost revision returns the option to the assessment queue."

      - from: CLEARED
        to: SELECTED
        trigger: "POST /accommodation-requests/{id}/decide with decision = GRANT_WITH_TRIAL"
        actor: AccommodationCoordinator
        preconditions:
          - "option.coverage_ratio >= MIN_COVERAGE_RATIO"
        side_effects:
          - "sets committed_cost_cents = option_net_cost_cents and adds that amount to JobProfile.committed_accommodation_cost_cents"

      - from: CLEARED
        to: IMPLEMENTED
        trigger: "POST /accommodation-requests/{id}/decide with decision = GRANT_PERMANENT"
        actor: AccommodationCoordinator
        preconditions:
          - "option.coverage_ratio >= MIN_COVERAGE_RATIO"
        side_effects:
          - "sets committed_cost_cents = option_net_cost_cents and adds that amount to JobProfile.committed_accommodation_cost_cents"

      - from: CLEARED
        to: SHELVED
        trigger: "POST /accommodation-requests/{id}/decide (system side effect on non-selected siblings)"
        actor: system
        preconditions:
          - "a sibling option on the same case was SELECTED or IMPLEMENTED by this decision"
        side_effects:
          - "sets status = SHELVED and decrements AccommodationRequest.cleared_option_count by 1"

      - from: SELECTED
        to: IMPLEMENTED
        trigger: "POST /trial-periods/{id}/resolve with outcome = EFFECTIVE"
        actor: AccommodationCoordinator
        preconditions: []
        side_effects:
          - "leaves committed_cost_cents unchanged"

      - from: SELECTED
        to: TRIAL_FAILED
        trigger: "POST /trial-periods/{id}/resolve with outcome = INEFFECTIVE"
        actor: AccommodationCoordinator
        preconditions: []
        side_effects:
          - "releases committed_cost_cents to 0 and subtracts the released amount from JobProfile.committed_accommodation_cost_cents"

      - from: PROPOSED
        to: WITHDRAWN
        trigger: "POST /accommodation-requests/{id}/advance with target_stage = WITHDRAWN (system side effect)"
        actor: system
        preconditions: []
        side_effects:
          - "sets status = WITHDRAWN"
        note: "The same cascade sets CLEARED and HARDSHIP_BLOCKED options to WITHDRAWN and adjusts the matching counters."

  # -- TrialPeriod (cyclic through extension) -------------------------------
  - entity: TrialPeriod
    dimension: status
    initial_state: SCHEDULED
    terminal_states: [CONCLUDED_EFFECTIVE, CONCLUDED_INEFFECTIVE, ABORTED]
    transitions:
      - from: SCHEDULED
        to: ACTIVE
        trigger: "POST /_ops/daily-sweep (system)"
        actor: system
        preconditions:
          - "current logical-clock date >= trial.start_date"
        side_effects:
          - "sets status = ACTIVE"

      - from: ACTIVE
        to: UNDER_REVIEW
        trigger: "POST /trial-periods/{id}/effectiveness-reviews reaching MIN_TRIAL_REVIEWS, or POST /_ops/daily-sweep once current date >= trial.end_date"
        actor: system
        preconditions:
          - "trial.review_count >= MIN_TRIAL_REVIEWS OR current logical-clock date >= trial.end_date"
        side_effects:
          - "sets status = UNDER_REVIEW"
          - "recomputes effectiveness_score under trial.scoring_mode"

      - from: UNDER_REVIEW
        to: ACTIVE
        trigger: "POST /trial-periods/{id}/resolve with outcome = EXTEND"
        actor: AccommodationCoordinator
        preconditions:
          - "trial.extension_count + 1 <= MAX_TRIAL_EXTENSIONS"
        side_effects:
          - "increments extension_count by 1"
          - "sets end_date = end_date + TRIAL_EXTENSION_DAYS days"
          - "sets status = ACTIVE"
        note: "Cycle: the trial can loop back into ACTIVE up to MAX_TRIAL_EXTENSIONS times."

      - from: UNDER_REVIEW
        to: CONCLUDED_EFFECTIVE
        trigger: "POST /trial-periods/{id}/resolve with outcome = EFFECTIVE"
        actor: AccommodationCoordinator
        preconditions:
          - "trial.review_count >= MIN_TRIAL_REVIEWS"
          - "trial.effectiveness_score >= EFFECTIVE_THRESHOLD"
        side_effects:
          - "sets outcome = EFFECTIVE and drives the AccommodationRequest TRIAL_ACTIVE -> GRANTED_PERMANENT transition"

      - from: UNDER_REVIEW
        to: CONCLUDED_INEFFECTIVE
        trigger: "POST /trial-periods/{id}/resolve with outcome = INEFFECTIVE"
        actor: AccommodationCoordinator
        preconditions:
          - "trial.review_count >= MIN_TRIAL_REVIEWS"
          - "trial.effectiveness_score < EFFECTIVE_THRESHOLD"
        side_effects:
          - "sets outcome = INEFFECTIVE and drives the depth-5 cascade declared on AccommodationRequest TRIAL_ACTIVE -> OPTION_EXPLORATION"

      - from: SCHEDULED
        to: ABORTED
        trigger: "POST /trial-periods/{id}/resolve with outcome = ABORT"
        actor: AccommodationCoordinator
        preconditions: []
        side_effects:
          - "sets outcome = ABORTED and returns the case to stage TRIAL_SETUP"
        note: "ABORT is also available from ACTIVE and UNDER_REVIEW with identical effects."

      - from: ACTIVE
        to: ABORTED
        trigger: "POST /trial-periods/{id}/resolve with outcome = ABORT"
        actor: AccommodationCoordinator
        preconditions: []
        side_effects:
          - "sets outcome = ABORTED and returns the case to stage TRIAL_SETUP"

  # -- Appeal (cyclic through supplement) -----------------------------------
  - entity: Appeal
    dimension: status
    initial_state: FILED
    terminal_states: [UPHELD, REVERSED, REMANDED, DISMISSED]
    transitions:
      - from: FILED
        to: UNDER_REVIEW
        trigger: "POST /appeals/{id}/transition with action = START_REVIEW"
        actor: AppealOfficer
        preconditions:
          - "the case's confidentiality_posture != SEALED"
          - "X-User-ID != DenialRecord.issued_by_user_id"
        side_effects:
          - "sets status = UNDER_REVIEW and appeal_officer_user_id = X-User-ID"

      - from: UNDER_REVIEW
        to: SUPPLEMENT_REQUESTED
        trigger: "POST /appeals/{id}/transition with action = REQUEST_SUPPLEMENT"
        actor: AppealOfficer
        preconditions:
          - "appeal.supplement_count < MAX_APPEAL_SUPPLEMENTS"
        side_effects:
          - "sets status = SUPPLEMENT_REQUESTED"

      - from: SUPPLEMENT_REQUESTED
        to: UNDER_REVIEW
        trigger: "POST /appeals/{id}/transition with action = SUBMIT_SUPPLEMENT"
        actor: Employee
        preconditions:
          - "X-User-ID == the case's employee_id"
          - "appeal.supplement_count + 1 <= MAX_APPEAL_SUPPLEMENTS"
        side_effects:
          - "increments supplement_count by 1"
          - "sets status = UNDER_REVIEW"
        note: "Cycle: negotiation rounds inside the appeal."

      - from: UNDER_REVIEW
        to: SUPPLEMENT_REQUESTED
        trigger: "POST /accommodation-requests/{id}/medical-disclosures resulting in authorized == false (system)"
        actor: system
        preconditions:
          - "the seal cascade fired on the case this appeal belongs to"
        side_effects:
          - "increments stay_count by 1"
          - "sets status = SUPPLEMENT_REQUESTED"

      - from: UNDER_REVIEW
        to: UPHELD
        trigger: "POST /appeals/{id}/decide with outcome = UPHOLD"
        actor: AppealOfficer
        preconditions:
          - "request.interactive_process_integrity_score >= APPEAL_MANDATORY_REMAND_THRESHOLD"
          - "X-User-ID == appeal.appeal_officer_user_id"
        side_effects:
          - "sets outcome = UPHELD and drives DenialRecord -> FINAL and the case -> DENIED_FINAL"

      - from: UNDER_REVIEW
        to: REVERSED
        trigger: "POST /appeals/{id}/decide with outcome = REVERSE"
        actor: AppealOfficer
        preconditions:
          - "X-User-ID == appeal.appeal_officer_user_id"
          - "denial.alternative_option_id is non-null"
        side_effects:
          - "sets outcome = REVERSED and drives DenialRecord -> VACATED and the case -> GRANTED_PERMANENT"

      - from: UNDER_REVIEW
        to: REMANDED
        trigger: "POST /appeals/{id}/decide with outcome = REMAND"
        actor: AppealOfficer
        preconditions:
          - "X-User-ID == appeal.appeal_officer_user_id"
        side_effects:
          - "sets outcome = REMANDED and drives the depth-5 cascade declared on AccommodationRequest UNDER_APPEAL -> OPTION_EXPLORATION"

      - from: FILED
        to: DISMISSED
        trigger: "POST /appeals/{id}/decide with outcome = DISMISS"
        actor: AppealOfficer
        preconditions:
          - "X-User-ID != DenialRecord.issued_by_user_id"
        side_effects:
          - "sets outcome = DISMISSED and drives DenialRecord -> FINAL and the case back to stage DENIED"

  # -- DenialRecord ---------------------------------------------------------
  - entity: DenialRecord
    dimension: status
    initial_state: ISSUED
    terminal_states: [FINAL, VACATED]
    transitions:
      - from: ISSUED
        to: APPEALED
        trigger: "POST /denial-records/{id}/appeals"
        actor: Employee
        preconditions:
          - "current logical-clock date <= appeal_deadline_date"
        side_effects:
          - "increments appeal_count by 1"

      - from: ISSUED
        to: FINAL
        trigger: "POST /_ops/daily-sweep (system)"
        actor: system
        preconditions:
          - "appeal_count == 0 AND current logical-clock date > appeal_deadline_date"
        side_effects:
          - "sets the case stage = DENIED_FINAL"

      - from: APPEALED
        to: FINAL
        trigger: "POST /appeals/{id}/decide with outcome IN {UPHOLD, DISMISS}"
        actor: AppealOfficer
        preconditions: []
        side_effects:
          - "sets status = FINAL"

      - from: APPEALED
        to: VACATED
        trigger: "POST /appeals/{id}/decide with outcome IN {REVERSE, REMAND}"
        actor: AppealOfficer
        preconditions: []
        side_effects:
          - "sets status = VACATED"
          - "decrements Employee.lifetime_denial_count by 1"

  # -- AbsenceRecord (polymorphic leave / workers' compensation) ------------
  - entity: AbsenceRecord
    dimension: status
    initial_state: SCHEDULED
    terminal_states: [CLOSED]
    transitions:
      - from: SCHEDULED
        to: ACTIVE
        trigger: "POST /absence-records/{id}/transition with to_status = ACTIVE, or POST /_ops/daily-sweep once current date >= start_date"
        actor: AccommodationCoordinator
        preconditions: []
        side_effects:
          - "sets status = ACTIVE"
          - "sets Employee.employment_status = RESTRICTED_DUTY when record_type == WC_RESTRICTION, otherwise ON_LEAVE"

      - from: ACTIVE
        to: MODIFIED_DUTY
        trigger: "POST /absence-records/{id}/transition with to_status = MODIFIED_DUTY"
        actor: AccommodationCoordinator
        preconditions:
          - "record_type == WC_RESTRICTION"
          - "modified_duty_available == true"
        side_effects:
          - "sets status = MODIFIED_DUTY"
          - "sets Employee.employment_status = RESTRICTED_DUTY"

      - from: ACTIVE
        to: EXHAUSTED
        trigger: "POST /_ops/daily-sweep (system)"
        actor: system
        preconditions:
          - "record_type IN {FMLA_CONTINUOUS, FMLA_INTERMITTENT, STATE_LEAVE} AND current logical-clock date >= end_date"
        side_effects:
          - "sets status = EXHAUSTED"
          - "sets Employee.employment_status = ACTIVE when the employee has no other AbsenceRecord in status ACTIVE or MODIFIED_DUTY"

      - from: ACTIVE
        to: CLOSED
        trigger: "POST /absence-records/{id}/transition with to_status = CLOSED"
        actor: AccommodationCoordinator
        preconditions: []
        side_effects:
          - "sets status = CLOSED"
          - "sets Employee.employment_status = ACTIVE when the employee has no other AbsenceRecord in status ACTIVE or MODIFIED_DUTY"

      - from: MODIFIED_DUTY
        to: CLOSED
        trigger: "POST /absence-records/{id}/transition with to_status = CLOSED"
        actor: AccommodationCoordinator
        preconditions: []
        side_effects:
          - "sets status = CLOSED"
          - "sets Employee.employment_status = ACTIVE when the employee has no other AbsenceRecord in status ACTIVE or MODIFIED_DUTY"

      - from: EXHAUSTED
        to: CLOSED
        trigger: "POST /absence-records/{id}/transition with to_status = CLOSED"
        actor: AccommodationCoordinator
        preconditions: []
        side_effects:
          - "sets status = CLOSED"

# ---------------------------------------------------------------------------
# §1.2.1 Concurrency Rules (OCC on parent `version` only)
# ---------------------------------------------------------------------------
concurrency_rules:
  - rule_id: doc-round-create-stale-request
    parent_entity: AccommodationRequest
    write_endpoint: "POST /accommodation-requests/{id}/medical-doc-requests"
    occ_field: "expected_request_version"
    description: |
      Issuing a documentation round against an AccommodationRequest whose
      version has advanced since the client last read it is rejected. A new
      round legitimately supersedes an earlier REJECTED_INSUFFICIENT round and
      consumes one unit of the case's documentation budget, so a writer holding
      a stale view of medical_doc_request_count / medical_doc_request_limit must
      re-read before issuing.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: hardship-assessment-stale-option
    parent_entity: AccommodationOption
    write_endpoint: "POST /accommodation-options/{id}/hardship-assessments"
    occ_field: "expected_option_version"
    description: |
      Recording an undue-hardship assessment against an AccommodationOption
      whose version has advanced since the client last read it is rejected. A
      new assessment legitimately supersedes the prior CURRENT assessment, so a
      writer whose view of the option's costs or coverage is stale would
      supersede a verdict it never saw.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: renewal-review-stale-request
    parent_entity: AccommodationRequest
    write_endpoint: "POST /accommodation-requests/{id}/renewal-review"
    occ_field: "expected_request_version"
    description: |
      Completing a recurring renewal review against an AccommodationRequest
      whose version has advanced since the client last read it is rejected. A
      renewal review legitimately supersedes the standing cadence by writing a
      new review_due_date, so a writer holding a stale cadence would overwrite
      one it never observed.
    error_id: ERR_STALE_VERSION
    http_status: 412

# ---------------------------------------------------------------------------
# §1.3 Calculation Rules Table
# ---------------------------------------------------------------------------
calculations:

  - name: option_net_cost
    trigger: "On POST /accommodation-requests/{id}/options and on PATCH /accommodation-options/{id}; writes AccommodationOption.option_net_cost_cents"
    algorithm: aggregation
    formula: |
      # PINNED EVALUATION ORDER (combinatorial mode (b) — nested rounding):
      # each cost component is rounded to whole cents INDEPENDENTLY with
      # round_half_up, and only THEN are the two rounded components summed.
      # "Sum the two unrounded components, then round once" is the forbidden
      # alternative and produces a different cent value whenever the two
      # fractional parts are each below 0.5 but sum to 0.5 or more.
      one_time_component_cents  = round_half_up(one_time_cost_cents * (1 - ADA_TAX_CREDIT_RATE), 0)
      recurring_component_cents = round_half_up(recurring_monthly_cost_cents * AMORTIZATION_MONTHS * (1 - ADA_TAX_CREDIT_RATE), 0)
      option_net_cost_cents     = one_time_component_cents + recurring_component_cents
    input_set: "Exactly the two cost fields on the single AccommodationOption being written. No sibling options, no historical values."
    constants:
      ADA_TAX_CREDIT_RATE: 0.26
      AMORTIZATION_MONTHS: 24
    precision: "whole cents, round_half_up, applied per component before summation"

  - name: essential_function_coverage
    trigger: "On POST /accommodation-requests/{id}/options, on PATCH /accommodation-options/{id}, and on PATCH /essential-functions/{id}; writes AccommodationOption.coverage_ratio"
    algorithm: aggregation
    formula: |
      pinned = the AccommodationRequest.job_profile_id of the option's case
      denominator_functions = EssentialFunction rows where
          job_profile_id == pinned AND is_essential == true AND status == "ACTIVE"
      numerator_functions   = denominator_functions whose id is a member of
          option.coverage_function_ids
      total_essential_weight = sum(criticality_weight over denominator_functions)
      covered_weight         = sum(criticality_weight over numerator_functions)
      coverage_ratio = (total_essential_weight == 0)
                       ? 1.000000
                       : round_half_up(covered_weight / total_essential_weight, 6)
    input_set: "EssentialFunction rows on the case's pinned JobProfile only, filtered to is_essential == true AND status == ACTIVE. Marginal functions (is_essential == false) and RETIRED functions are excluded from BOTH numerator and denominator. Ids in coverage_function_ids that fall outside that filtered set contribute nothing."
    constants:
      MIN_COVERAGE_RATIO: 0.60
    precision: "6 decimal places, round_half_up; empty denominator yields exactly 1.000000"

  - name: undue_hardship_assessment
    trigger: "On POST /accommodation-options/{id}/hardship-assessments; writes every computed field of the new UndueHardshipAssessment and drives the AccommodationOption PROPOSED -> CLEARED / HARDSHIP_BLOCKED fork"
    algorithm: weighted_scoring
    formula: |
      assessed_net_cost_cents = option.option_net_cost_cents            # snapshot
      denominator_cents = (assessment_basis == "EMPLOYER_WIDE")
                          ? job_profile.employer_annual_budget_cents
                          : job_profile.department_annual_budget_cents
      budget_ratio      = round_half_up(assessed_net_cost_cents / denominator_cents, 6)
      budget_ratio_norm = min(100.0000, round_half_up(budget_ratio / BUDGET_RATIO_CAP * 100, 4))
      disruption_index  = round_half_up((1 - option.coverage_ratio) * 100, 4)
      lag_norm          = min(100.0000, round_half_up(option.implementation_days / LAG_CAP_DAYS * 100, 4))
      raw_hardship_score = round_half_up(
            W_COST       * budget_ratio_norm
          + W_DISRUPTION * disruption_index
          + W_LAG        * lag_norm, 2)

      # PINNED EVALUATION ORDER (combinatorial mode (c) — circular-looking
      # dependency). hardship_score = raw_hardship_score - mitigation credit,
      # and the credit RATE is selected from a tier band. The tier is read from
      # raw_hardship_score, the PRE-credit value. It is NEVER re-selected from
      # the post-credit hardship_score, even when the credit pushes the score
      # into a lower band. The credit is applied exactly once.
      mitigation_credit_rate =
            raw_hardship_score <  MITIGATION_TIER_1_MAX ? 0.00
          : raw_hardship_score <  MITIGATION_TIER_2_MAX ? 0.10
          : raw_hardship_score <  MITIGATION_TIER_3_MAX ? 0.05
          :                                               0.00
      hardship_score = round_half_up(raw_hardship_score * (1 - mitigation_credit_rate), 2)

      hardship_verdict =
            hardship_score >= UNDUE_SCORE_THRESHOLD      ? "UNDUE"
          : hardship_score >= BORDERLINE_SCORE_THRESHOLD ? "BORDERLINE"
          :                                                "NOT_UNDUE"
    input_set: "One AccommodationOption and the JobProfile pinned on its case. Sibling options and other cases never enter the math."
    constants:
      W_COST: 0.65
      W_DISRUPTION: 0.20
      W_LAG: 0.15
      BUDGET_RATIO_CAP: 0.05
      LAG_CAP_DAYS: 60
      MITIGATION_TIER_1_MAX: 40.00
      MITIGATION_TIER_2_MAX: 65.00
      MITIGATION_TIER_3_MAX: 85.00
      UNDUE_SCORE_THRESHOLD: 70.00
      BORDERLINE_SCORE_THRESHOLD: 45.00
    precision: "budget_ratio 6 dp; budget_ratio_norm / disruption_index / lag_norm 4 dp; raw_hardship_score and hardship_score 2 dp; all round_half_up"
    variants:
      - name: SITE_LOCAL
        when: "assessment_basis == SITE_LOCAL — the accommodation is charged against the owning department only"
        difference: "denominator_cents = JobProfile.department_annual_budget_cents, a far smaller denominator, so budget_ratio_norm frequently saturates at the 100.0000 cap and the same option can score UNDUE."
      - name: EMPLOYER_WIDE
        when: "assessment_basis == EMPLOYER_WIDE — the employer's total resources are considered, as the ADA generally requires for a large employer"
        difference: "denominator_cents = JobProfile.employer_annual_budget_cents, so budget_ratio_norm collapses toward zero and the identical option routinely scores NOT_UNDUE. Identical inputs, divergent verdict and divergent AccommodationOption.status."

  - name: trial_effectiveness
    trigger: "On POST /trial-periods/{id}/effectiveness-reviews and on the TrialPeriod ACTIVE -> UNDER_REVIEW transition; writes TrialPeriod.effectiveness_score"
    algorithm: weighted_scoring
    formula: |
      # per-review composite, computed once at review-recording time
      review_composite = round_half_up(
            SUBJECTIVE_WEIGHT * ((employee_rating + manager_rating) / 2)
          + OBJECTIVE_WEIGHT  * (objective_metric_pct / 10), 4)

      ordered = EffectivenessReview rows of this trial sorted by
                review_date ASC, tie-break created_at ASC
      N = count(ordered)
      if N == 0: effectiveness_score = null

      # variant CUMULATIVE_MEAN
      effectiveness_score = round_half_up(sum(review_composite over ordered) / N, 2)

      # variant LATEST_WEIGHTED
      tail  = last min(3, N) elements of `ordered`, re-indexed so that
              tail[0] is the LATEST review, tail[1] the next-latest, tail[2] the third-latest
      raw_w = first min(3, N) elements of RECENCY_WEIGHTS
      w[i]  = raw_w[i] / sum(raw_w)                       # renormalised when N < 3
      effectiveness_score = round_half_up(sum(w[i] * tail[i].review_composite), 2)
    input_set: "Every EffectivenessReview row belonging to this TrialPeriod, including reviews recorded before an extension. No reviews from other trials, and reviews are never dropped by an extension."
    constants:
      SUBJECTIVE_WEIGHT: 0.6
      OBJECTIVE_WEIGHT: 0.4
      RECENCY_WEIGHTS: [0.5, 0.3, 0.2]
      EFFECTIVE_THRESHOLD: 7.00
      MIN_TRIAL_REVIEWS: 3
      MAX_TRIAL_EXTENSIONS: 1
      TRIAL_EXTENSION_DAYS: 30
    precision: "review_composite 4 dp; effectiveness_score 2 dp; both round_half_up"
    variants:
      - name: CUMULATIVE_MEAN
        when: "TrialPeriod.scoring_mode == CUMULATIVE_MEAN"
        difference: "Unweighted mean over every review, so an improving trial is dragged down by its early poor scores and can land below EFFECTIVE_THRESHOLD."
      - name: LATEST_WEIGHTED
        when: "TrialPeriod.scoring_mode == LATEST_WEIGHTED (default)"
        difference: "Recency-weighted mean over the last three reviews only, so the identical review set on an improving trial can land at or above EFFECTIVE_THRESHOLD. Same reviews, divergent score, divergent permitted resolve outcome."

  - name: documentation_budget
    trigger: "On AccommodationRequest creation, on every MedicalDocumentationRequest create/withdraw/expiry, and on the TrialPeriod INEFFECTIVE cascade; writes medical_doc_request_limit, medical_doc_request_count and documentation_budget_remaining"
    algorithm: threshold
    formula: |
      raw_limit = BASE_DOC_REQUEST_LIMIT
                + (count(TrialPeriod where request_id == r.id
                         AND status == "CONCLUDED_INEFFECTIVE") > 0
                   ? INEFFECTIVE_TRIAL_BONUS : 0)
                + (r.renewal_of_request_id != null ? RENEWAL_BONUS : 0)
      medical_doc_request_limit = min(raw_limit, ABSOLUTE_DOC_REQUEST_CEILING)
      medical_doc_request_count = count(MedicalDocumentationRequest
                                        where request_id == r.id
                                        AND status != "WITHDRAWN")
      documentation_budget_remaining = max(0, medical_doc_request_limit - medical_doc_request_count)
    input_set: "MedicalDocumentationRequest rows on this case in any status except WITHDRAWN — EXPIRED and REJECTED_INSUFFICIENT rounds still consume budget. TrialPeriod rows on this case in status CONCLUDED_INEFFECTIVE only."
    constants:
      BASE_DOC_REQUEST_LIMIT: 2
      INEFFECTIVE_TRIAL_BONUS: 1
      RENEWAL_BONUS: 1
      ABSOLUTE_DOC_REQUEST_CEILING: 4
    precision: "integers, exact"

  - name: interactive_process_integrity
    trigger: "On every MedicalDocumentationRequest create/withdraw/expiry, on every MedicalDisclosure append, and on the daily sweep; writes AccommodationRequest.interactive_process_integrity_score"
    algorithm: weighted_scoring
    formula: |
      overreach_rounds = max(0, medical_doc_request_count - BASE_DOC_REQUEST_LIMIT)
      unauthorized     = count(MedicalDisclosure where request_id == r.id
                               AND authorized == false)
      expired_rounds   = count(MedicalDocumentationRequest where request_id == r.id
                               AND status == "EXPIRED")
      missed_renewal   = (r.stage == "RENEWAL_DUE"
                          AND current_clock_date > r.review_due_date + MISSED_RENEWAL_GRACE_DAYS days)
                         ? 1 : 0
      penalties = PENALTY_DOC_OVERREACH            * overreach_rounds
                + PENALTY_UNAUTHORIZED_DISCLOSURE  * unauthorized
                + PENALTY_EXPIRED_DOC_WINDOW       * expired_rounds
                + PENALTY_MISSED_RENEWAL           * missed_renewal
      interactive_process_integrity_score = max(INTEGRITY_FLOOR, INTEGRITY_BASE - penalties)
    input_set: "All MedicalDocumentationRequest and MedicalDisclosure rows on this case, in every status. Penalties are permanent: unsealing the case, withdrawing an expired round, or closing the case never restores points already deducted for an unauthorized disclosure or an expired window."
    constants:
      INTEGRITY_BASE: 100
      INTEGRITY_FLOOR: 0
      PENALTY_DOC_OVERREACH: 25
      PENALTY_UNAUTHORIZED_DISCLOSURE: 30
      PENALTY_EXPIRED_DOC_WINDOW: 10
      PENALTY_MISSED_RENEWAL: 15
      MISSED_RENEWAL_GRACE_DAYS: 30
      APPEAL_MANDATORY_REMAND_THRESHOLD: 60
      APPEAL_WINDOW_DAYS: 30
      MAX_APPEAL_SUPPLEMENTS: 2
    precision: "integers, exact; floored at 0"

  - name: disclosure_authorization
    trigger: "On POST /accommodation-requests/{id}/medical-disclosures; writes MedicalDisclosure.authorized"
    algorithm: constraint_propagation
    formula: |
      authorized =
          disclosed_to_role IN FULL_ACCESS_ROLES                     ? true
        : disclosed_to_role == "AccommodationCoordinator"
              ? (fields_disclosed subset-of COORDINATOR_PERMITTED_FIELDS)
        : disclosed_to_role == "Manager"
              ? (fields_disclosed subset-of MANAGER_PERMITTED_FIELDS)
        : disclosed_to_role == "FinanceOfficer"
              ? (fields_disclosed subset-of FINANCE_PERMITTED_FIELDS)
        : disclosed_to_role == "AppealOfficer"
              ? (fields_disclosed subset-of COORDINATOR_PERMITTED_FIELDS)
        :                                                              false
    input_set: "Only the disclosed_to_role and fields_disclosed of the row being appended. The log is append-only: an unauthorized row is still recorded with HTTP 201 so the breach is auditable, and it immediately drives the confidentiality seal cascade."
    constants:
      FULL_ACCESS_ROLES: ["MedicalReviewOfficer", "ComplianceAuditor"]
      COORDINATOR_PERMITTED_FIELDS: ["functional_limitations", "work_restrictions", "restriction_duration", "prognosis", "accommodation_needed"]
      MANAGER_PERMITTED_FIELDS: ["work_restrictions", "restriction_duration", "accommodation_needed"]
      FINANCE_PERMITTED_FIELDS: ["accommodation_needed"]
    precision: "boolean, exact"

  - name: renewal_cadence
    trigger: "On the AccommodationRequest transitions into TRIAL_SETUP, GRANTED_PERMANENT (from DECISION_PENDING, from TRIAL_ACTIVE, or from UNDER_APPEAL by reversal); writes review_cadence_days and review_due_date"
    algorithm: threshold
    formula: |
      candidates = [BASE_REVIEW_CADENCE_DAYS]
      if the CURRENT UndueHardshipAssessment of the selected AccommodationOption
         has hardship_verdict == "BORDERLINE":
             candidates += [BORDERLINE_CADENCE_DAYS]
      if r.absence_record_id != null
         AND that AbsenceRecord.status != "CLOSED":
             candidates += [ABSENCE_LINKED_CADENCE_DAYS]
      if r.decision == "GRANT_WITH_TRIAL":
             candidates += [TRIAL_GRANT_CADENCE_DAYS]
      review_cadence_days = min(candidates)
      review_due_date     = current_clock_date + review_cadence_days days
    input_set: "The selected option's CURRENT assessment, the case's linked AbsenceRecord if any, and the recorded decision. The shortest applicable cadence always wins."
    constants:
      BASE_REVIEW_CADENCE_DAYS: 365
      BORDERLINE_CADENCE_DAYS: 180
      ABSENCE_LINKED_CADENCE_DAYS: 90
      TRIAL_GRANT_CADENCE_DAYS: 120
      MAX_INTERACTIVE_ROUNDS: 2
      MAX_OPEN_CASES_PER_EMPLOYEE: 2
    precision: "whole days; review_due_date is a calendar date in UTC"

  - name: committed_cost_ledger
    trigger: "On every AccommodationOption transition into or out of {SELECTED, IMPLEMENTED}; writes JobProfile.committed_accommodation_cost_cents"
    algorithm: aggregation
    formula: |
      # INVARIANT (must hold after every request completes):
      JobProfile.committed_accommodation_cost_cents ==
          sum(AccommodationOption.committed_cost_cents
              over options o where o.status IN {SELECTED, IMPLEMENTED}
              AND the AccommodationRequest of o has job_profile_id == jp.id)
      # Forward action:      option -> SELECTED / IMPLEMENTED
      #                      o.committed_cost_cents = o.option_net_cost_cents
      #                      jp.committed_accommodation_cost_cents += that amount
      # Compensating action: option -> TRIAL_FAILED (ineffective trial) or the
      #                      case closing out of RENEWAL_DUE
      #                      jp.committed_accommodation_cost_cents -= o.committed_cost_cents
      #                      o.committed_cost_cents = 0
      # The pair MUST leave jp.committed_accommodation_cost_cents at exactly the
      # value it held before the forward action. Zero drift is required even
      # though option_net_cost_cents may have been recomputed in between: the
      # release always subtracts committed_cost_cents, never a recomputed value.
    input_set: "AccommodationOption rows in status SELECTED or IMPLEMENTED whose case pins this JobProfile. Options in PROPOSED, CLEARED, HARDSHIP_BLOCKED, SHELVED, TRIAL_FAILED and WITHDRAWN contribute zero."
    constants: {}
    precision: "whole cents, exact integer arithmetic"

  - name: trial_window_conflict
    trigger: "On POST /trial-periods, before the TrialPeriod row is created"
    algorithm: interval_merge
    formula: |
      # CLOSED intervals on the Employee resource, with a mandatory washout gap.
      # Both endpoints are INCLUSIVE, and consecutive trials must be separated
      # by at least TRIAL_WASHOUT_DAYS of clear calendar.
      occupied = TrialPeriod rows where employee_id == candidate.employee_id
                 AND status IN {SCHEDULED, ACTIVE, UNDER_REVIEW,
                                CONCLUDED_EFFECTIVE, CONCLUDED_INEFFECTIVE, ABORTED}
      conflict = EXISTS occ IN occupied such that
                 candidate.start_date <= occ.end_date   + TRIAL_WASHOUT_DAYS days
             AND candidate.end_date   >= occ.start_date - TRIAL_WASHOUT_DAYS days
      # Consequence to note: the comparison is <= on BOTH sides, so a candidate
      # starting exactly TRIAL_WASHOUT_DAYS after the prior end_date still
      # COLLIDES. The earliest legal start is occ.end_date + TRIAL_WASHOUT_DAYS
      # + 1 days. An ABORTED trial still occupies its interval.
    input_set: "Every TrialPeriod row for the same employee_id in any status. No status is exempt."
    constants:
      TRIAL_WASHOUT_DAYS: 7
    precision: "whole calendar days, UTC"

  - name: doc_window_conflict
    trigger: "On POST /accommodation-requests/{id}/medical-doc-requests, before the round is created"
    algorithm: interval_merge
    formula: |
      # HALF-OPEN intervals on the AccommodationRequest resource, zero buffer.
      # [issued_at, due_date) — the due_date endpoint is EXCLUSIVE, so a new
      # round issued at exactly the prior round's due_date does NOT collide.
      open_rounds = MedicalDocumentationRequest rows where request_id == r.id
                    AND status == "ISSUED"
      conflict = EXISTS o IN open_rounds such that
                 candidate.issued_at < o.due_date
      # candidate.issued_at is always the current logical-clock instant, so the
      # candidate window can never start before an existing one.
    input_set: "MedicalDocumentationRequest rows on this case with status == ISSUED only. RESPONDED, ACCEPTED_SUFFICIENT, REJECTED_INSUFFICIENT, EXPIRED and WITHDRAWN rounds impose no window."
    constants: {}
    precision: "instants compared at full ISO-8601 precision, UTC"

  - name: intermittent_capacity
    trigger: "On POST /absence-records with record_type == FMLA_INTERMITTENT"
    algorithm: aggregation
    formula: |
      # AGGREGATE-CAPACITY interval semantics on the Employee resource:
      # overlap alone is legal, but the summed weekly draw is capped.
      overlapping = AbsenceRecord rows where employee_id == candidate.employee_id
                    AND record_type == "FMLA_INTERMITTENT"
                    AND status IN {SCHEDULED, ACTIVE}
                    AND candidate.start_date <  o.end_date        # half-open
                    AND candidate.end_date   >  o.start_date
      total_weekly_days = candidate.weekly_intermittent_days
                        + sum(weekly_intermittent_days over overlapping)
      conflict = total_weekly_days > INTERMITTENT_WEEKLY_DAY_CAP
      # A FMLA_CONTINUOUS or STATE_LEAVE record overlapping the same window is
      # NOT counted here; it is rejected by the trial-blocking rule instead.
    input_set: "AbsenceRecord rows for the same employee with record_type == FMLA_INTERMITTENT and status IN {SCHEDULED, ACTIVE}. EXHAUSTED and CLOSED records release their capacity."
    constants:
      INTERMITTENT_WEEKLY_DAY_CAP: 5
    precision: "whole days, exact integer arithmetic"

  - name: daily_sweep_order
    trigger: "On POST /_ops/daily-sweep"
    algorithm: chronological
    formula: |
      # The sweep advances every clock-gated transition in this PINNED phase
      # order. Within each phase, rows are processed in created_at ASC order.
      # No random identifier participates in any ordering decision.
      phase 1: MedicalDocumentationRequest ISSUED with clock >= due_date  -> EXPIRED
      phase 2: AbsenceRecord SCHEDULED with clock_date >= start_date      -> ACTIVE
      phase 3: AbsenceRecord ACTIVE (leave types) with clock_date >= end_date -> EXHAUSTED
      phase 4: TrialPeriod SCHEDULED with clock_date >= start_date        -> ACTIVE
      phase 5: TrialPeriod ACTIVE with clock_date >= end_date             -> UNDER_REVIEW
      phase 6: AccommodationRequest GRANTED_PERMANENT with clock_date >= review_due_date -> RENEWAL_DUE
      phase 7: DenialRecord ISSUED with appeal_count == 0 and clock_date > appeal_deadline_date -> FINAL, case -> DENIED_FINAL
      phase 8: recompute interactive_process_integrity_score for every case
               touched by phases 1 or 6
    input_set: "Every row in the phase-relevant status, regardless of case. Phases never re-run: a row promoted in phase 4 is not eligible for phase 5 in the same sweep."
    constants: {}
    precision: "phase order and created_at ASC ordering are both normative"

# ---------------------------------------------------------------------------
# §1.4 Validation Rules Table (evaluated strictly in ascending priority order;
#      the FIRST rule that fails determines the response error_id)
# ---------------------------------------------------------------------------
validations:

  - priority: 10
    category: auth
    check: "X-User-Role and X-User-ID headers are present and X-User-Role is one of the seven declared roles"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"

  - priority: 12
    category: auth
    check: "When X-User-Role is an entity_backed role (Employee, Manager), X-User-ID resolves to an existing Employee.id"
    error_id: ERR_UNKNOWN_ACTOR
    http_status: 401
    applies_to: "all endpoints whose roles include Employee or Manager"

  - priority: 20
    category: auth
    check: "The acting role appears in the endpoint's declared roles list"
    error_id: ERR_ROLE_NOT_PERMITTED
    http_status: 403
    applies_to: "all"

  - priority: 22
    category: auth
    check: "When acting as Manager, the resolved Employee has is_people_manager == true"
    error_id: ERR_NOT_A_PEOPLE_MANAGER
    http_status: 403
    applies_to: "all endpoints whose roles include Manager"

  - priority: 26
    category: business_constraint
    check: "Request body parses, carries every required field, and every supplied value satisfies its declared type, enum membership and numeric range"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all endpoints with a request body"

  - priority: 30
    category: existence
    check: "Every path-templated id resolves to an existing row, validated left-to-right"
    error_id: "ERR_EMPLOYEE_NOT_FOUND | ERR_JOB_PROFILE_NOT_FOUND | ERR_ESSENTIAL_FUNCTION_NOT_FOUND | ERR_REQUEST_NOT_FOUND | ERR_DOC_REQUEST_NOT_FOUND | ERR_FUNCTION_ANALYSIS_NOT_FOUND | ERR_OPTION_NOT_FOUND | ERR_TRIAL_NOT_FOUND | ERR_DENIAL_NOT_FOUND | ERR_APPEAL_NOT_FOUND | ERR_ABSENCE_RECORD_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with a path parameter"

  - priority: 32
    category: existence
    check: "Every id carried in the request body (employee_id, job_profile_id, essential_function_id, request_id, option_id, absence_record_id, alternative_option_id, selected_option_id, members of coverage_function_ids) resolves to an existing row"
    error_id: "ERR_EMPLOYEE_NOT_FOUND | ERR_JOB_PROFILE_NOT_FOUND | ERR_ESSENTIAL_FUNCTION_NOT_FOUND | ERR_REQUEST_NOT_FOUND | ERR_OPTION_NOT_FOUND | ERR_ABSENCE_RECORD_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints carrying an id in the body"

  - priority: 36
    category: auth
    check: "When acting as Employee on a case-scoped resource, X-User-ID equals the case's employee_id"
    error_id: ERR_NOT_CASE_OWNER
    http_status: 403
    applies_to: "POST /accommodation-requests, POST /accommodation-requests/{id}/advance, POST /accommodation-requests/{id}/options, POST /medical-doc-requests/{id}/respond, POST /denial-records/{id}/appeals, POST /appeals/{id}/transition, POST /trial-periods/{id}/effectiveness-reviews, PATCH /function-analyses/{id}"

  - priority: 38
    category: auth
    check: "When acting as Manager on a case-scoped resource, the acting Employee's department_code equals the case employee's department_code"
    error_id: ERR_MANAGER_SCOPE_VIOLATION
    http_status: 403
    applies_to: "POST /accommodation-requests/{id}/function-analyses, PATCH /function-analyses/{id}, POST /trial-periods/{id}/effectiveness-reviews, POST /job-profiles/{id}/essential-functions, PATCH /essential-functions/{id}"

  - priority: 40
    category: state
    check: "The target resource is in a state from which the requested transition is declared in §1.2"
    error_id: "ERR_INVALID_STAGE_TRANSITION | ERR_DOC_REQUEST_NOT_OPEN | ERR_OPTION_NOT_ASSESSABLE | ERR_TRIAL_NOT_RESOLVABLE | ERR_DENIAL_NOT_APPEALABLE | ERR_APPEAL_NOT_ACTIONABLE | ERR_ABSENCE_TRANSITION_INVALID | ERR_PROFILE_NOT_DRAFT"
    http_status: 409
    applies_to: "every state-changing endpoint"

  - priority: 42
    category: state
    check: "The supplied expected_<parent>_version equals the parent entity's current version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /accommodation-requests/{id}/medical-doc-requests, POST /accommodation-options/{id}/hardship-assessments, POST /accommodation-requests/{id}/renewal-review"

  - priority: 50
    category: business_safety
    check: "The case's confidentiality_posture is not SEALED. Exempt: all GET endpoints, POST /accommodation-requests/{id}/medical-disclosures, and POST /accommodation-requests/{id}/confidentiality"
    error_id: ERR_CASE_SEALED
    http_status: 409
    applies_to: "every mutating case-scoped endpoint except the two named exemptions"

  - priority: 51
    category: business_safety
    check: "The acting AppealOfficer's X-User-ID differs from the DenialRecord.issued_by_user_id of the denial under appeal, and differs from every manager_id that signed a RECORDED FunctionAnalysis on the case"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /appeals/{id}/transition, POST /appeals/{id}/decide"

  - priority: 52
    category: business_safety
    check: "scope_fields_requested contains no member of {diagnosis, treatment_plan} — the employer may request functional information only"
    error_id: ERR_MEDICAL_SCOPE_OVERBROAD
    http_status: 422
    applies_to: "POST /accommodation-requests/{id}/medical-doc-requests"

  - priority: 53
    category: business_safety
    check: "The case's disability_obvious is false — no medical documentation may be requested when the limitation is obvious or already known"
    error_id: ERR_DOCUMENTATION_NOT_PERMITTED
    http_status: 422
    applies_to: "POST /accommodation-requests/{id}/medical-doc-requests"

  - priority: 54
    category: business_safety
    check: "The option named by selected_option_id has coverage_ratio >= MIN_COVERAGE_RATIO — an accommodation that leaves essential functions uncovered may not be granted"
    error_id: ERR_ESSENTIAL_FUNCTION_UNCOVERED
    http_status: 422
    applies_to: "POST /accommodation-requests/{id}/decide with decision IN {GRANT_WITH_TRIAL, GRANT_PERMANENT}"

  - priority: 60
    category: business_referential
    check: "The requesting employee's JobProfile has status == PUBLISHED at intake"
    error_id: ERR_PROFILE_NOT_PUBLISHED
    http_status: 422
    applies_to: "POST /accommodation-requests"

  - priority: 61
    category: business_referential
    check: "Every member of coverage_function_ids names an EssentialFunction with status == ACTIVE, is_essential == true, and job_profile_id equal to the case's pinned job_profile_id; the same holds for essential_function_id on a FunctionAnalysis"
    error_id: ERR_FUNCTION_NOT_IN_PINNED_PROFILE
    http_status: 422
    applies_to: "POST /accommodation-requests/{id}/options, PATCH /accommodation-options/{id}, POST /accommodation-options/{id}/hardship-assessments, POST /accommodation-requests/{id}/function-analyses"

  - priority: 62
    category: business_constraint
    check: "documentation_budget_remaining >= 1 before a new documentation round is issued"
    error_id: ERR_DOC_REQUEST_LIMIT_EXCEEDED
    http_status: 422
    applies_to: "POST /accommodation-requests/{id}/medical-doc-requests"

  - priority: 63
    category: business_constraint
    check: "Every ACTIVE essential function on the pinned profile has exactly one FunctionAnalysis in status RECORDED on this case"
    error_id: ERR_FUNCTION_ANALYSIS_INCOMPLETE
    http_status: 422
    applies_to: "POST /accommodation-requests/{id}/advance with target_stage = OPTION_EXPLORATION from stage FUNCTION_ANALYSIS"

  - priority: 64
    category: business_constraint
    check: "At least one AccommodationOption on the case has status IN {PROPOSED, CLEARED}"
    error_id: ERR_NO_OPTIONS_PROPOSED
    http_status: 422
    applies_to: "POST /accommodation-requests/{id}/advance with target_stage = HARDSHIP_REVIEW"

  - priority: 65
    category: business_constraint
    check: "No AccommodationOption on the case remains in status PROPOSED, and cleared_option_count >= 1"
    error_id: ERR_OPTION_ASSESSMENT_PENDING
    http_status: 422
    applies_to: "POST /accommodation-requests/{id}/advance with target_stage = DECISION_PENDING"

  - priority: 66
    category: business_constraint
    check: "No FunctionAnalysis in status RECORDED or DISPUTED already exists on this case for the same essential_function_id"
    error_id: ERR_DUPLICATE_FUNCTION_ANALYSIS
    http_status: 409
    applies_to: "POST /accommodation-requests/{id}/function-analyses"

  - priority: 67
    category: business_constraint
    check: "employee_number is unique across Employee, job_code is unique across JobProfile, function_code is unique within its JobProfile, and option_code is unique within its case"
    error_id: ERR_DUPLICATE_RESOURCE_KEY
    http_status: 409
    applies_to: "POST /employees, POST /job-profiles, POST /job-profiles/{id}/essential-functions, POST /accommodation-requests/{id}/options"

  - priority: 68
    category: business_temporal
    check: "The current logical-clock date is on or before DenialRecord.appeal_deadline_date"
    error_id: ERR_APPEAL_WINDOW_CLOSED
    http_status: 422
    applies_to: "POST /denial-records/{id}/appeals"

  - priority: 69
    category: business_temporal
    check: "The new documentation round does not collide with an ISSUED round under the half-open [issued_at, due_date) rule of calculation doc_window_conflict"
    error_id: ERR_DOC_WINDOW_OVERLAP
    http_status: 409
    applies_to: "POST /accommodation-requests/{id}/medical-doc-requests"

  - priority: 70
    category: business_temporal
    check: "The candidate trial interval does not collide with any TrialPeriod of the same employee under the closed-interval plus TRIAL_WASHOUT_DAYS rule of calculation trial_window_conflict"
    error_id: ERR_TRIAL_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /trial-periods"

  - priority: 71
    category: business_temporal
    check: "No AbsenceRecord for the employee with record_type IN {FMLA_CONTINUOUS, STATE_LEAVE} and status == ACTIVE overlaps the candidate trial interval"
    error_id: ERR_TRIAL_BLOCKED_BY_ABSENCE
    http_status: 409
    applies_to: "POST /trial-periods"

  - priority: 72
    category: business_temporal
    check: "The summed weekly draw of overlapping FMLA_INTERMITTENT records does not exceed INTERMITTENT_WEEKLY_DAY_CAP, per calculation intermittent_capacity"
    error_id: ERR_INTERMITTENT_CAP_EXCEEDED
    http_status: 422
    applies_to: "POST /absence-records"

  - priority: 73
    category: business_referential
    check: "If the case's absence_record_id names a WC_RESTRICTION record, that record's status is MODIFIED_DUTY before a trial may start"
    error_id: ERR_WC_MODIFIED_DUTY_REQUIRED
    http_status: 409
    applies_to: "POST /trial-periods"

  - priority: 74
    category: business_fiscal
    check: "The option named by selected_option_id is not in status HARDSHIP_BLOCKED"
    error_id: ERR_OPTION_HARDSHIP_BLOCKED
    http_status: 422
    applies_to: "POST /accommodation-requests/{id}/decide with decision IN {GRANT_WITH_TRIAL, GRANT_PERMANENT}"

  - priority: 75
    category: business_constraint
    check: "An appeal may not be UPHELD while interactive_process_integrity_score < APPEAL_MANDATORY_REMAND_THRESHOLD — a process failure must be remanded"
    error_id: ERR_APPEAL_MUST_REMAND
    http_status: 422
    applies_to: "POST /appeals/{id}/decide with outcome = UPHOLD"

  - priority: 76
    category: business_constraint
    check: "supplement_count + 1 <= MAX_APPEAL_SUPPLEMENTS"
    error_id: ERR_APPEAL_SUPPLEMENT_LIMIT
    http_status: 422
    applies_to: "POST /appeals/{id}/transition with action IN {REQUEST_SUPPLEMENT, SUBMIT_SUPPLEMENT}"

  - priority: 77
    category: business_constraint
    check: "interactive_round_count + 1 <= MAX_INTERACTIVE_ROUNDS on any transition that re-enters OPTION_EXPLORATION"
    error_id: ERR_INTERACTIVE_ROUND_LIMIT
    http_status: 422
    applies_to: "POST /accommodation-requests/{id}/advance, POST /trial-periods/{id}/resolve, POST /appeals/{id}/decide, POST /accommodation-requests/{id}/renewal-review"

  - priority: 78
    category: business_constraint
    check: "review_count >= MIN_TRIAL_REVIEWS before a trial may be resolved EFFECTIVE or INEFFECTIVE"
    error_id: ERR_INSUFFICIENT_TRIAL_REVIEWS
    http_status: 422
    applies_to: "POST /trial-periods/{id}/resolve with outcome IN {EFFECTIVE, INEFFECTIVE}"

  - priority: 79
    category: business_constraint
    check: "The requested outcome agrees with the computed score: EFFECTIVE requires effectiveness_score >= EFFECTIVE_THRESHOLD, INEFFECTIVE requires effectiveness_score < EFFECTIVE_THRESHOLD"
    error_id: ERR_TRIAL_OUTCOME_MISMATCH
    http_status: 422
    applies_to: "POST /trial-periods/{id}/resolve with outcome IN {EFFECTIVE, INEFFECTIVE}"

  - priority: 80
    category: business_constraint
    check: "extension_count + 1 <= MAX_TRIAL_EXTENSIONS"
    error_id: ERR_TRIAL_EXTENSION_LIMIT
    http_status: 422
    applies_to: "POST /trial-periods/{id}/resolve with outcome = EXTEND"

  - priority: 81
    category: business_constraint
    check: "Employee.open_case_count + 1 <= MAX_OPEN_CASES_PER_EMPLOYEE"
    error_id: ERR_OPEN_CASE_LIMIT
    http_status: 422
    applies_to: "POST /accommodation-requests, POST /accommodation-requests/{id}/renewal-review with outcome = RENEW_SUCCESSOR"

# ---------------------------------------------------------------------------
# §1.5 API Endpoint Table  (all collections are top-level; api_prefix is "/")
# ---------------------------------------------------------------------------
endpoints:

  # --- Employee ------------------------------------------------------------
  - method: POST
    path: "/employees"
    description: "Register an employee against a job profile."
    roles: [AccommodationCoordinator, ComplianceAuditor]
    code: 201
    input: ["employee_number", "full_name", "department_code", "job_title", "hire_date", "job_profile_id", "is_people_manager?", "annual_salary_cents"]
    output: Employee
    side_effects: ["initializes employment_status = ACTIVE, open_case_count = 0, lifetime_denial_count = 0"]

  - method: GET
    path: "/employees/{id}"
    description: "Read one employee."
    roles: [Employee, Manager, AccommodationCoordinator, MedicalReviewOfficer, FinanceOfficer, AppealOfficer, ComplianceAuditor]
    code: 200
    input: []
    output: Employee
    side_effects: []

  - method: GET
    path: "/employees"
    description: "List employees, optionally filtered by job profile, department or employment status."
    roles: [AccommodationCoordinator, Manager, ComplianceAuditor]
    code: 200
    input: ["job_profile_id?", "department_code?", "employment_status?", "limit?", "offset?"]
    output: Employee[]
    side_effects: []

  # --- JobProfile / EssentialFunction --------------------------------------
  - method: POST
    path: "/job-profiles"
    description: "Create a DRAFT job profile carrying both the department and employer-wide accommodation budgets."
    roles: [AccommodationCoordinator]
    code: 201
    input: ["job_code", "title", "department_code", "department_annual_budget_cents", "employer_annual_budget_cents"]
    output: JobProfile
    side_effects: ["initializes status = DRAFT, essential_function_count = 0, total_essential_weight = 0, committed_accommodation_cost_cents = 0"]

  - method: GET
    path: "/job-profiles/{id}"
    description: "Read one job profile including its committed accommodation ledger."
    roles: [Employee, Manager, AccommodationCoordinator, MedicalReviewOfficer, FinanceOfficer, AppealOfficer, ComplianceAuditor]
    code: 200
    input: []
    output: JobProfile
    side_effects: []

  - method: POST
    path: "/job-profiles/{id}/essential-functions"
    description: "Author an essential (or marginal) job duty on a DRAFT profile."
    roles: [AccommodationCoordinator, Manager]
    code: 201
    input: ["function_code", "description", "criticality_weight", "frequency_per_week", "is_essential?", "marginal_reassignable?"]
    output: EssentialFunction
    side_effects: ["recomputes JobProfile.essential_function_count and JobProfile.total_essential_weight"]

  - method: GET
    path: "/job-profiles/{id}/essential-functions"
    description: "List the duties on a profile (reverse lookup for EssentialFunction.job_profile_id)."
    roles: [Employee, Manager, AccommodationCoordinator, MedicalReviewOfficer, FinanceOfficer, AppealOfficer, ComplianceAuditor]
    code: 200
    input: ["status?", "is_essential?", "limit?", "offset?"]
    output: EssentialFunction[]
    side_effects: []

  - method: PATCH
    path: "/essential-functions/{id}"
    description: "Revise or retire a job duty; retiring one changes coverage math on every open option that referenced it."
    roles: [AccommodationCoordinator, Manager]
    code: 200
    input: ["criticality_weight?", "frequency_per_week?", "is_essential?", "marginal_reassignable?", "status?"]
    output: EssentialFunction
    side_effects:
      - "recomputes JobProfile.essential_function_count and JobProfile.total_essential_weight"
      - "recomputes AccommodationOption.coverage_ratio for every option on a case pinned to this profile whose status is PROPOSED, CLEARED or HARDSHIP_BLOCKED"
      - "when status becomes RETIRED: sets every FunctionAnalysis for this essential_function_id whose status is RECORDED or DISPUTED to SUPERSEDED"

  - method: POST
    path: "/job-profiles/{id}/publish"
    description: "Freeze a DRAFT profile and stamp its version label."
    roles: [AccommodationCoordinator]
    code: 200
    input: ["profile_version_label"]
    output: JobProfile
    side_effects: ["sets JobProfile.status = PUBLISHED and profile_version_label"]

  # --- AccommodationRequest -------------------------------------------------
  - method: POST
    path: "/accommodation-requests"
    description: "Open an accommodation case; pins the employee's PUBLISHED job profile and its version label."
    roles: [Employee, AccommodationCoordinator, Manager]
    code: 201
    input: ["employee_id", "request_channel", "requested_accommodation_text", "disability_obvious?", "absence_record_id?"]
    output: AccommodationRequest
    side_effects:
      - "pins job_profile_id and pinned_profile_version_label from the employee's PUBLISHED profile"
      - "computes medical_doc_request_limit and documentation_budget_remaining per calculation documentation_budget"
      - "increments Employee.open_case_count by 1"

  - method: GET
    path: "/accommodation-requests/{id}"
    description: "Read one accommodation case including stage, confidentiality posture, budgets and integrity score."
    roles: [Employee, Manager, AccommodationCoordinator, MedicalReviewOfficer, FinanceOfficer, AppealOfficer, ComplianceAuditor]
    code: 200
    input: []
    output: AccommodationRequest
    side_effects: []

  - method: GET
    path: "/accommodation-requests"
    description: "List cases with foreign-key filters (reverse lookup for employee_id, job_profile_id, renewal_of_request_id, absence_record_id and selected_option_id)."
    roles: [AccommodationCoordinator, ComplianceAuditor, AppealOfficer, FinanceOfficer, MedicalReviewOfficer]
    code: 200
    input: ["employee_id?", "job_profile_id?", "renewal_of_request_id?", "absence_record_id?", "selected_option_id?", "stage?", "limit?", "offset?"]
    output: AccommodationRequest[]
    side_effects: []

  - method: PATCH
    path: "/accommodation-requests/{id}"
    description: "Amend intake facts on an open case, including cross-referencing a leave or workers'-compensation record."
    roles: [AccommodationCoordinator]
    code: 200
    input: ["requested_accommodation_text?", "disability_obvious?", "absence_record_id?"]
    output: AccommodationRequest
    side_effects: ["links AbsenceRecord.id into absence_record_id, which later shortens the renewal cadence"]

  - method: POST
    path: "/accommodation-requests/{id}/advance"
    description: "Drive the case's stage dimension. target_stage is one of FUNCTION_ANALYSIS, OPTION_EXPLORATION, HARDSHIP_REVIEW, DECISION_PENDING, WITHDRAWN."
    roles: [AccommodationCoordinator, Employee]
    code: 200
    input: ["target_stage"]
    output: AccommodationRequest
    side_effects: ["applies the matching §1.2 AccommodationRequest.stage transition and all of its declared cascades"]

  - method: POST
    path: "/accommodation-requests/{id}/decide"
    description: "Record the interactive-process decision: GRANT_WITH_TRIAL, GRANT_PERMANENT or DENY."
    roles: [AccommodationCoordinator]
    code: 200
    input: ["decision", "selected_option_id?", "denial_basis?", "rationale_text?", "alternative_option_id?"]
    output: AccommodationRequest
    side_effects:
      - "on a grant: SELECTs or IMPLEMENTs the chosen option, commits its cost to JobProfile.committed_accommodation_cost_cents, SHELVEs the remaining CLEARED siblings"
      - "on a grant: computes review_cadence_days and review_due_date per calculation renewal_cadence"
      - "on a denial: creates DenialRecord with issued_by_user_id, appeal_deadline_date and rejected_option_ids, and increments Employee.lifetime_denial_count"

  - method: POST
    path: "/accommodation-requests/{id}/renewal-review"
    description: "Complete a recurring renewal review. outcome is one of CONTINUE, MODIFY, CLOSE, RENEW_SUCCESSOR."
    roles: [AccommodationCoordinator]
    code: 200
    input: ["outcome", "expected_request_version"]
    output: AccommodationRequest
    side_effects:
      - "increments AccommodationRequest.review_cycle_index by 1"
      - "increments AccommodationRequest.version by 1"
      - "applies the matching RENEWAL_DUE transition, including creating a successor case on RENEW_SUCCESSOR"

  - method: POST
    path: "/accommodation-requests/{id}/confidentiality"
    description: "Auditor-only posture override on the parallel confidentiality dimension. to_posture is RESTRICTED."
    roles: [ComplianceAuditor]
    code: 200
    input: ["to_posture"]
    output: AccommodationRequest
    side_effects: ["unseals the case; never restores interactive_process_integrity_score"]

  # --- MedicalDocumentationRequest -----------------------------------------
  - method: POST
    path: "/accommodation-requests/{id}/medical-doc-requests"
    description: "Issue one round of medical documentation. Guarded by OCC on the case's version."
    roles: [AccommodationCoordinator]
    code: 201
    input: ["scope_fields_requested", "due_date", "is_second_opinion?", "expected_request_version"]
    output: MedicalDocumentationRequest
    side_effects:
      - "sets issued_at from the logical clock and round_index from medical_doc_request_count + 1"
      - "increments AccommodationRequest.medical_doc_request_count by 1 and recomputes documentation_budget_remaining"
      - "recomputes AccommodationRequest.interactive_process_integrity_score"
      - "increments AccommodationRequest.version by 1"
      - "moves the case INTAKE -> DOC_PENDING on the first round"

  - method: GET
    path: "/accommodation-requests/{id}/medical-doc-requests"
    description: "List the documentation rounds on a case (reverse lookup for MedicalDocumentationRequest.request_id)."
    roles: [Employee, AccommodationCoordinator, MedicalReviewOfficer, AppealOfficer, ComplianceAuditor]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: MedicalDocumentationRequest[]
    side_effects: []

  - method: POST
    path: "/medical-doc-requests/{id}/respond"
    description: "Employee submits the provider response inside the open window."
    roles: [Employee]
    code: 200
    input: ["response_summary"]
    output: MedicalDocumentationRequest
    side_effects:
      - "sets status = RESPONDED and responded_at from the logical clock"
      - "moves the case's confidentiality_posture STANDARD -> RESTRICTED"

  - method: POST
    path: "/medical-doc-requests/{id}/adjudicate"
    description: "MedicalReviewOfficer rules the response SUFFICIENT or INSUFFICIENT."
    roles: [MedicalReviewOfficer]
    code: 200
    input: ["verdict", "adjudication_note?"]
    output: MedicalDocumentationRequest
    side_effects: ["sets status = ACCEPTED_SUFFICIENT or REJECTED_INSUFFICIENT"]

  - method: POST
    path: "/medical-doc-requests/{id}/withdraw"
    description: "Compensating action: retract an outstanding documentation round and return its budget unit to the case."
    roles: [AccommodationCoordinator]
    code: 200
    input: []
    output: MedicalDocumentationRequest
    side_effects:
      - "sets status = WITHDRAWN"
      - "decrements AccommodationRequest.medical_doc_request_count by 1 and recomputes documentation_budget_remaining"
      - "recomputes AccommodationRequest.interactive_process_integrity_score"

  # --- FunctionAnalysis -----------------------------------------------------
  - method: POST
    path: "/accommodation-requests/{id}/function-analyses"
    description: "The people manager records the essential-function analysis for one job duty."
    roles: [Manager]
    code: 201
    input: ["essential_function_id", "can_perform_unaided", "limitation_severity", "proposed_treatment"]
    output: FunctionAnalysis
    side_effects: ["stamps manager_id from X-User-ID and status = RECORDED"]

  - method: GET
    path: "/function-analyses/{id}"
    description: "Read one essential-function analysis."
    roles: [Employee, Manager, AccommodationCoordinator, MedicalReviewOfficer, FinanceOfficer, AppealOfficer, ComplianceAuditor]
    code: 200
    input: []
    output: FunctionAnalysis
    side_effects: []

  - method: GET
    path: "/function-analyses"
    description: "List analyses with foreign-key filters (reverse lookup for request_id, essential_function_id and manager_id)."
    roles: [Employee, Manager, AccommodationCoordinator, AppealOfficer, ComplianceAuditor]
    code: 200
    input: ["request_id?", "essential_function_id?", "manager_id?", "status?", "limit?", "offset?"]
    output: FunctionAnalysis[]
    side_effects: []

  - method: PATCH
    path: "/function-analyses/{id}"
    description: "Manager revises the analysis, or the employee disputes it by supplying employee_dispute_note."
    roles: [Manager, Employee]
    code: 200
    input: ["can_perform_unaided?", "limitation_severity?", "proposed_treatment?", "employee_dispute_note?"]
    output: FunctionAnalysis
    side_effects: ["setting employee_dispute_note moves status RECORDED -> DISPUTED, which removes the analysis from the completeness count"]

  # --- AccommodationOption / UndueHardshipAssessment ------------------------
  - method: POST
    path: "/accommodation-requests/{id}/options"
    description: "Propose an accommodation option. The case MUST be in stage OPTION_EXPLORATION; any other stage is rejected with ERR_INVALID_STAGE_TRANSITION."
    roles: [AccommodationCoordinator, Employee]
    code: 201
    input: ["option_code", "category", "one_time_cost_cents?", "recurring_monthly_cost_cents?", "implementation_days", "coverage_function_ids"]
    output: AccommodationOption
    side_effects:
      - "computes option_net_cost_cents per calculation option_net_cost"
      - "computes coverage_ratio per calculation essential_function_coverage"
      - "stamps proposed_by_role from X-User-Role and status = PROPOSED"

  - method: GET
    path: "/accommodation-requests/{id}/options"
    description: "List the options explored on a case (reverse lookup for AccommodationOption.request_id)."
    roles: [Employee, Manager, AccommodationCoordinator, FinanceOfficer, AppealOfficer, ComplianceAuditor]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: AccommodationOption[]
    side_effects: []

  - method: GET
    path: "/accommodation-options/{id}"
    description: "Read one accommodation option including its net cost, coverage ratio and committed amount."
    roles: [Employee, Manager, AccommodationCoordinator, FinanceOfficer, AppealOfficer, ComplianceAuditor]
    code: 200
    input: []
    output: AccommodationOption
    side_effects: []

  - method: PATCH
    path: "/accommodation-options/{id}"
    description: "Revise an option's cost, lead time or coverage; a revision returns a HARDSHIP_BLOCKED option to the assessment queue."
    roles: [AccommodationCoordinator]
    code: 200
    input: ["one_time_cost_cents?", "recurring_monthly_cost_cents?", "implementation_days?", "coverage_function_ids?"]
    output: AccommodationOption
    side_effects:
      - "recomputes option_net_cost_cents and coverage_ratio"
      - "moves status HARDSHIP_BLOCKED -> PROPOSED, decrements AccommodationRequest.blocked_option_count, supersedes the CURRENT assessment"
      - "increments AccommodationOption.version by 1"

  - method: POST
    path: "/accommodation-options/{id}/hardship-assessments"
    description: "FinanceOfficer runs the undue-hardship assessment under one of the two budget bases. Guarded by OCC on the option's version."
    roles: [FinanceOfficer]
    code: 201
    input: ["assessment_basis", "expected_option_version"]
    output: UndueHardshipAssessment
    side_effects:
      - "computes every score field per calculation undue_hardship_assessment"
      - "supersedes any prior CURRENT assessment on this option"
      - "forks AccommodationOption.status to CLEARED or HARDSHIP_BLOCKED and moves the matching case counter"
      - "increments AccommodationOption.version by 1"

  - method: GET
    path: "/accommodation-options/{id}/hardship-assessments"
    description: "List the assessments recorded against an option (reverse lookup for UndueHardshipAssessment.option_id)."
    roles: [AccommodationCoordinator, FinanceOfficer, AppealOfficer, ComplianceAuditor]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: UndueHardshipAssessment[]
    side_effects: []

  # --- TrialPeriod / EffectivenessReview ------------------------------------
  - method: POST
    path: "/trial-periods"
    description: "Schedule the trial period for the selected accommodation; moves the case TRIAL_SETUP -> TRIAL_ACTIVE."
    roles: [AccommodationCoordinator]
    code: 201
    input: ["request_id", "option_id", "start_date", "end_date", "checkin_cadence_days?", "scoring_mode?"]
    output: TrialPeriod
    side_effects:
      - "copies employee_id from the case and sets status = SCHEDULED"
      - "sets AccommodationRequest.stage = TRIAL_ACTIVE"

  - method: GET
    path: "/trial-periods/{id}"
    description: "Read one trial period including its current effectiveness score."
    roles: [Employee, Manager, AccommodationCoordinator, FinanceOfficer, AppealOfficer, ComplianceAuditor]
    code: 200
    input: []
    output: TrialPeriod
    side_effects: []

  - method: GET
    path: "/trial-periods"
    description: "List trials with foreign-key filters (reverse lookup for request_id, option_id and employee_id)."
    roles: [Employee, Manager, AccommodationCoordinator, ComplianceAuditor]
    code: 200
    input: ["request_id?", "option_id?", "employee_id?", "status?", "limit?", "offset?"]
    output: TrialPeriod[]
    side_effects: []

  - method: POST
    path: "/trial-periods/{id}/effectiveness-reviews"
    description: "Record one effectiveness check-in. The trial MUST be in status ACTIVE or UNDER_REVIEW; the MIN_TRIAL_REVIEWS-th review moves the trial ACTIVE -> UNDER_REVIEW."
    roles: [Manager, Employee, AccommodationCoordinator]
    code: 201
    input: ["employee_rating", "manager_rating", "objective_metric_pct"]
    output: EffectivenessReview
    side_effects:
      - "computes review_composite and stamps review_date from the logical clock"
      - "increments TrialPeriod.review_count and recomputes TrialPeriod.effectiveness_score under scoring_mode"
      - "moves the trial ACTIVE -> UNDER_REVIEW once review_count reaches MIN_TRIAL_REVIEWS"

  - method: GET
    path: "/trial-periods/{id}/effectiveness-reviews"
    description: "List the check-ins on a trial (reverse lookup for EffectivenessReview.trial_period_id)."
    roles: [Employee, Manager, AccommodationCoordinator, ComplianceAuditor]
    code: 200
    input: ["limit?", "offset?"]
    output: EffectivenessReview[]
    side_effects: []

  - method: POST
    path: "/trial-periods/{id}/resolve"
    description: "Close out or extend a trial. outcome is one of EFFECTIVE, INEFFECTIVE, EXTEND, ABORT."
    roles: [AccommodationCoordinator]
    code: 200
    input: ["outcome"]
    output: TrialPeriod
    side_effects: ["applies the matching §1.2 TrialPeriod transition and its declared cascade into the option, the ledger and the case"]

  # --- DenialRecord / Appeal ------------------------------------------------
  - method: GET
    path: "/denial-records/{id}"
    description: "Read one denial record including its appeal deadline."
    roles: [Employee, Manager, AccommodationCoordinator, AppealOfficer, ComplianceAuditor]
    code: 200
    input: []
    output: DenialRecord
    side_effects: []

  - method: GET
    path: "/denial-records"
    description: "List denials with foreign-key filters (reverse lookup for request_id and alternative_option_id)."
    roles: [Employee, AccommodationCoordinator, AppealOfficer, ComplianceAuditor]
    code: 200
    input: ["request_id?", "alternative_option_id?", "status?", "limit?", "offset?"]
    output: DenialRecord[]
    side_effects: []

  - method: POST
    path: "/denial-records/{id}/appeals"
    description: "Employee files an appeal inside the appeal window."
    roles: [Employee]
    code: 201
    input: ["grounds_text"]
    output: Appeal
    side_effects:
      - "sets DenialRecord.status = APPEALED and increments appeal_count"
      - "sets AccommodationRequest.stage = UNDER_APPEAL"

  - method: GET
    path: "/denial-records/{id}/appeals"
    description: "List the appeals filed against a denial (reverse lookup for Appeal.denial_record_id)."
    roles: [Employee, AccommodationCoordinator, AppealOfficer, ComplianceAuditor]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: Appeal[]
    side_effects: []

  - method: GET
    path: "/appeals/{id}"
    description: "Read one appeal."
    roles: [Employee, AccommodationCoordinator, AppealOfficer, ComplianceAuditor]
    code: 200
    input: []
    output: Appeal
    side_effects: []

  - method: POST
    path: "/appeals/{id}/transition"
    description: "Non-terminal appeal moves. action is one of START_REVIEW (AppealOfficer), REQUEST_SUPPLEMENT (AppealOfficer), SUBMIT_SUPPLEMENT (Employee)."
    roles: [AppealOfficer, Employee]
    code: 200
    input: ["action"]
    output: Appeal
    side_effects: ["applies the matching §1.2 Appeal transition; SUBMIT_SUPPLEMENT increments supplement_count"]

  - method: POST
    path: "/appeals/{id}/decide"
    description: "Terminal appeal decision. outcome is one of UPHOLD, REVERSE, REMAND, DISMISS."
    roles: [AppealOfficer]
    code: 200
    input: ["outcome"]
    output: Appeal
    side_effects: ["applies the matching §1.2 Appeal transition and its declared cascade into the denial, the case, the options and the assessments"]

  # --- MedicalDisclosure ----------------------------------------------------
  - method: POST
    path: "/accommodation-requests/{id}/medical-disclosures"
    description: "Append one row to the case's medical-disclosure log. Always succeeds with 201; an impermissible disclosure is recorded with authorized == false and seals the case."
    roles: [AccommodationCoordinator, MedicalReviewOfficer, ComplianceAuditor]
    code: 201
    input: ["disclosed_to_role", "disclosed_to_user_id", "disclosure_purpose", "fields_disclosed"]
    output: MedicalDisclosure
    side_effects:
      - "computes authorized per calculation disclosure_authorization"
      - "when authorized == false: seals the case, recomputes interactive_process_integrity_score, and stays every UNDER_REVIEW appeal on the case"

  - method: GET
    path: "/accommodation-requests/{id}/medical-disclosures"
    description: "Read the disclosure log for a case (reverse lookup for MedicalDisclosure.request_id)."
    roles: [AccommodationCoordinator, MedicalReviewOfficer, ComplianceAuditor]
    code: 200
    input: ["authorized?", "limit?", "offset?"]
    output: MedicalDisclosure[]
    side_effects: []

  # --- AbsenceRecord --------------------------------------------------------
  - method: POST
    path: "/absence-records"
    description: "Record a leave entitlement or a workers'-compensation restriction for an employee."
    roles: [AccommodationCoordinator]
    code: 201
    input: ["employee_id", "record_type", "start_date", "end_date", "weekly_intermittent_days?", "restriction_severity?", "modified_duty_available?", "claim_reference?"]
    output: AbsenceRecord
    side_effects: ["sets status = SCHEDULED"]

  - method: GET
    path: "/absence-records/{id}"
    description: "Read one leave or workers'-compensation record."
    roles: [Employee, Manager, AccommodationCoordinator, MedicalReviewOfficer, AppealOfficer, ComplianceAuditor]
    code: 200
    input: []
    output: AbsenceRecord
    side_effects: []

  - method: GET
    path: "/absence-records"
    description: "List leave and workers'-compensation records (reverse lookup for AbsenceRecord.employee_id)."
    roles: [AccommodationCoordinator, Manager, ComplianceAuditor]
    code: 200
    input: ["employee_id?", "record_type?", "status?", "limit?", "offset?"]
    output: AbsenceRecord[]
    side_effects: []

  - method: POST
    path: "/absence-records/{id}/transition"
    description: "Move a leave or restriction record. to_status is one of ACTIVE, MODIFIED_DUTY, CLOSED."
    roles: [AccommodationCoordinator]
    code: 200
    input: ["to_status"]
    output: AbsenceRecord
    side_effects: ["recomputes Employee.employment_status from the employee's remaining ACTIVE / MODIFIED_DUTY records"]

  # --- Test-driving endpoints (declared contract, /_ namespace) -------------
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server's logical clock. The startup default is exactly 2026-08-01T00:00:00Z; before any call to this endpoint the logical clock reads that default and never falls back to real wall-clock time."
    roles: [ComplianceAuditor]
    code: 200
    input: ["to_iso8601"]
    output: { current_utc: string }
    side_effects: ["all subsequent issued_at, responded_at, filed_at, review_date and date comparisons read the new value"]

  - method: POST
    path: "/_ops/daily-sweep"
    description: "Run every clock-gated transition in the pinned phase order of calculation daily_sweep_order."
    roles: [ComplianceAuditor]
    code: 200
    input: []
    output: { swept_at: string, doc_requests_expired: integer, absence_records_activated: integer, absence_records_exhausted: integer, trials_activated: integer, trials_moved_to_review: integer, requests_moved_to_renewal_due: integer, denials_finalized: integer }
    side_effects: ["expires documentation windows, activates and exhausts absence records, activates and reviews trials, raises renewal-due cases, finalizes unappealed denials, and recomputes integrity scores"]

# ---------------------------------------------------------------------------
# §1.6 Error Code Catalog
# ---------------------------------------------------------------------------
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header missing, or X-User-Role is not one of the seven declared roles."
  - id: ERR_UNKNOWN_ACTOR
    http: 401
    condition: "X-User-Role is Employee or Manager but X-User-ID does not resolve to an existing Employee.id."
  - id: ERR_ROLE_NOT_PERMITTED
    http: 403
    condition: "The acting role is not listed in the endpoint's §1.5 roles."
  - id: ERR_NOT_A_PEOPLE_MANAGER
    http: 403
    condition: "Acting as Manager while the resolved Employee has is_people_manager == false."
  - id: ERR_NOT_CASE_OWNER
    http: 403
    condition: "Acting as Employee on a case whose employee_id differs from X-User-ID."
  - id: ERR_MANAGER_SCOPE_VIOLATION
    http: 403
    condition: "Acting as Manager on a case whose employee sits in a different department_code."
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "The acting AppealOfficer's X-User-ID equals the denial's issued_by_user_id, or equals a manager_id that signed a RECORDED FunctionAnalysis on the case."
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "Missing required body field, unknown enum member, or a numeric value outside its declared range."
  - id: ERR_EMPLOYEE_NOT_FOUND
    http: 404
    condition: "An employee_id in the path or body does not resolve."
  - id: ERR_JOB_PROFILE_NOT_FOUND
    http: 404
    condition: "A job_profile_id in the path or body does not resolve."
  - id: ERR_ESSENTIAL_FUNCTION_NOT_FOUND
    http: 404
    condition: "An essential_function_id in the path, in the body, or inside coverage_function_ids does not resolve."
  - id: ERR_REQUEST_NOT_FOUND
    http: 404
    condition: "An accommodation request id in the path or body does not resolve."
  - id: ERR_DOC_REQUEST_NOT_FOUND
    http: 404
    condition: "A medical documentation request id in the path does not resolve."
  - id: ERR_FUNCTION_ANALYSIS_NOT_FOUND
    http: 404
    condition: "A function analysis id in the path does not resolve."
  - id: ERR_OPTION_NOT_FOUND
    http: 404
    condition: "An accommodation option id in the path or body does not resolve."
  - id: ERR_TRIAL_NOT_FOUND
    http: 404
    condition: "A trial period id in the path does not resolve."
  - id: ERR_DENIAL_NOT_FOUND
    http: 404
    condition: "A denial record id in the path does not resolve."
  - id: ERR_APPEAL_NOT_FOUND
    http: 404
    condition: "An appeal id in the path does not resolve."
  - id: ERR_ABSENCE_RECORD_NOT_FOUND
    http: 404
    condition: "An absence record id in the path or body does not resolve."
  - id: ERR_DUPLICATE_RESOURCE_KEY
    http: 409
    condition: "employee_number, job_code, function_code within a profile, or option_code within a case is already taken."
  - id: ERR_PROFILE_NOT_DRAFT
    http: 409
    condition: "Authoring an essential function on, or publishing, a JobProfile whose status is not DRAFT."
  - id: ERR_PROFILE_NOT_PUBLISHED
    http: 422
    condition: "Opening an accommodation case for an employee whose JobProfile status is not PUBLISHED."
  - id: ERR_INVALID_STAGE_TRANSITION
    http: 409
    condition: "The requested target_stage or decision is not reachable from the case's current stage."
  - id: ERR_DOC_REQUEST_NOT_OPEN
    http: 409
    condition: "Responding to, adjudicating or withdrawing a documentation round from a status that does not permit it."
  - id: ERR_OPTION_NOT_ASSESSABLE
    http: 409
    condition: "Assessing or revising an AccommodationOption from a status that does not permit it, or while the case is not in HARDSHIP_REVIEW."
  - id: ERR_TRIAL_NOT_RESOLVABLE
    http: 409
    condition: "Resolving a trial from a status that does not permit the requested outcome."
  - id: ERR_DENIAL_NOT_APPEALABLE
    http: 409
    condition: "Filing an appeal against a DenialRecord whose status is not ISSUED."
  - id: ERR_APPEAL_NOT_ACTIONABLE
    http: 409
    condition: "The requested appeal action or decision is not reachable from the appeal's current status."
  - id: ERR_ABSENCE_TRANSITION_INVALID
    http: 409
    condition: "The requested to_status is not reachable from the AbsenceRecord's current status, or MODIFIED_DUTY was requested on a record that is not a WC_RESTRICTION with modified_duty_available == true."
  - id: ERR_STALE_VERSION
    http: 412
    condition: "The supplied expected_request_version or expected_option_version does not equal the parent entity's current version."
  - id: ERR_CASE_SEALED
    http: 409
    condition: "A mutating case-scoped operation was attempted while confidentiality_posture == SEALED, outside the two declared exemptions."
  - id: ERR_MEDICAL_SCOPE_OVERBROAD
    http: 422
    condition: "scope_fields_requested includes diagnosis or treatment_plan."
  - id: ERR_DOCUMENTATION_NOT_PERMITTED
    http: 422
    condition: "A documentation round was requested on a case whose disability_obvious is true."
  - id: ERR_ESSENTIAL_FUNCTION_UNCOVERED
    http: 422
    condition: "The option being granted has coverage_ratio below MIN_COVERAGE_RATIO."
  - id: ERR_FUNCTION_NOT_IN_PINNED_PROFILE
    http: 422
    condition: "A referenced EssentialFunction is RETIRED, is marginal, or belongs to a JobProfile other than the case's pinned one."
  - id: ERR_DOC_REQUEST_LIMIT_EXCEEDED
    http: 422
    condition: "documentation_budget_remaining is 0 when a new round is requested."
  - id: ERR_FUNCTION_ANALYSIS_INCOMPLETE
    http: 422
    condition: "Advancing to OPTION_EXPLORATION while at least one ACTIVE essential function lacks a RECORDED FunctionAnalysis on the case."
  - id: ERR_NO_OPTIONS_PROPOSED
    http: 422
    condition: "Advancing to HARDSHIP_REVIEW with zero AccommodationOption rows in status PROPOSED or CLEARED."
  - id: ERR_OPTION_ASSESSMENT_PENDING
    http: 422
    condition: "Advancing to DECISION_PENDING while an option is still PROPOSED, or with cleared_option_count == 0."
  - id: ERR_DUPLICATE_FUNCTION_ANALYSIS
    http: 409
    condition: "A RECORDED or DISPUTED FunctionAnalysis already exists on this case for the same essential_function_id."
  - id: ERR_APPEAL_WINDOW_CLOSED
    http: 422
    condition: "The current logical-clock date is after DenialRecord.appeal_deadline_date."
  - id: ERR_DOC_WINDOW_OVERLAP
    http: 409
    condition: "A new documentation round would be issued strictly inside the half-open window of a round still in status ISSUED."
  - id: ERR_TRIAL_WINDOW_CONFLICT
    http: 409
    condition: "The candidate trial interval collides with another trial of the same employee under the closed-interval plus washout rule."
  - id: ERR_TRIAL_BLOCKED_BY_ABSENCE
    http: 409
    condition: "An ACTIVE FMLA_CONTINUOUS or STATE_LEAVE record for the employee overlaps the candidate trial interval."
  - id: ERR_INTERMITTENT_CAP_EXCEEDED
    http: 422
    condition: "Overlapping FMLA_INTERMITTENT records would draw more than INTERMITTENT_WEEKLY_DAY_CAP days per week."
  - id: ERR_WC_MODIFIED_DUTY_REQUIRED
    http: 409
    condition: "The case is cross-referenced to a WC_RESTRICTION record whose status is not MODIFIED_DUTY when a trial is scheduled."
  - id: ERR_OPTION_HARDSHIP_BLOCKED
    http: 422
    condition: "The option named by selected_option_id is in status HARDSHIP_BLOCKED."
  - id: ERR_APPEAL_MUST_REMAND
    http: 422
    condition: "UPHOLD was requested while the case's interactive_process_integrity_score is below APPEAL_MANDATORY_REMAND_THRESHOLD."
  - id: ERR_APPEAL_SUPPLEMENT_LIMIT
    http: 422
    condition: "A supplement round would push supplement_count above MAX_APPEAL_SUPPLEMENTS."
  - id: ERR_INTERACTIVE_ROUND_LIMIT
    http: 422
    condition: "A transition re-entering OPTION_EXPLORATION would push interactive_round_count above MAX_INTERACTIVE_ROUNDS."
  - id: ERR_INSUFFICIENT_TRIAL_REVIEWS
    http: 422
    condition: "Resolving a trial EFFECTIVE or INEFFECTIVE with review_count below MIN_TRIAL_REVIEWS."
  - id: ERR_TRIAL_OUTCOME_MISMATCH
    http: 422
    condition: "The requested EFFECTIVE / INEFFECTIVE outcome contradicts the computed effectiveness_score against EFFECTIVE_THRESHOLD."
  - id: ERR_TRIAL_EXTENSION_LIMIT
    http: 422
    condition: "An extension would push extension_count above MAX_TRIAL_EXTENSIONS."
  - id: ERR_OPEN_CASE_LIMIT
    http: 422
    condition: "Opening a case would push Employee.open_case_count above MAX_OPEN_CASES_PER_EMPLOYEE."

# ---------------------------------------------------------------------------
# §1.7 RBAC Matrix (segregation of duties)
# ---------------------------------------------------------------------------
roles:
  - name: Employee
    description: "The worker requesting an accommodation. Acts only on their own case."
    identity: "entity_backed:Employee"
    exclusive_operations:
      - "POST /medical-doc-requests/{id}/respond"
      - "POST /denial-records/{id}/appeals"
    shared_operations:
      - "POST /accommodation-requests"
      - "POST /accommodation-requests/{id}/advance (target_stage = WITHDRAWN only)"
      - "POST /accommodation-requests/{id}/options"
      - "PATCH /function-analyses/{id} (employee_dispute_note only)"
      - "POST /trial-periods/{id}/effectiveness-reviews"
      - "POST /appeals/{id}/transition (action = SUBMIT_SUPPLEMENT only)"
      - "read endpoints scoped to their own case"

  - name: Manager
    description: "The people manager who performs the essential-function analysis. Must be an Employee row with is_people_manager == true and the same department_code as the case employee."
    identity: "entity_backed:Employee"
    exclusive_operations:
      - "POST /accommodation-requests/{id}/function-analyses"
    shared_operations:
      - "POST /job-profiles/{id}/essential-functions"
      - "PATCH /essential-functions/{id}"
      - "PATCH /function-analyses/{id}"
      - "POST /accommodation-requests"
      - "POST /trial-periods/{id}/effectiveness-reviews"

  - name: AccommodationCoordinator
    description: "The ADA coordinator who runs the interactive process end to end."
    identity: "opaque"
    exclusive_operations:
      - "POST /job-profiles"
      - "POST /job-profiles/{id}/publish"
      - "PATCH /accommodation-requests/{id}"
      - "POST /accommodation-requests/{id}/medical-doc-requests"
      - "POST /medical-doc-requests/{id}/withdraw"
      - "PATCH /accommodation-options/{id}"
      - "POST /accommodation-requests/{id}/decide"
      - "POST /trial-periods"
      - "POST /trial-periods/{id}/resolve"
      - "POST /accommodation-requests/{id}/renewal-review"
      - "POST /absence-records"
      - "POST /absence-records/{id}/transition"
    shared_operations:
      - "POST /employees"
      - "POST /job-profiles/{id}/essential-functions"
      - "PATCH /essential-functions/{id}"
      - "POST /accommodation-requests"
      - "POST /accommodation-requests/{id}/advance"
      - "POST /accommodation-requests/{id}/options"
      - "POST /accommodation-requests/{id}/medical-disclosures"
      - "POST /trial-periods/{id}/effectiveness-reviews"
      - "read endpoints across all cases"

  - name: MedicalReviewOfficer
    description: "The only role permitted to rule on the sufficiency of medical documentation; the confidentiality firewall between medical content and the rest of the process."
    identity: "opaque"
    exclusive_operations:
      - "POST /medical-doc-requests/{id}/adjudicate"
    shared_operations:
      - "POST /accommodation-requests/{id}/medical-disclosures"
      - "GET /accommodation-requests/{id}/medical-doc-requests"
      - "GET /accommodation-requests/{id}/medical-disclosures"

  - name: FinanceOfficer
    description: "Runs the undue-hardship assessment against the department or employer-wide budget."
    identity: "opaque"
    exclusive_operations:
      - "POST /accommodation-options/{id}/hardship-assessments"
    shared_operations:
      - "GET /accommodation-options/{id}/hardship-assessments"
      - "GET /accommodation-requests/{id}/options"
      - "GET /job-profiles/{id}"

  - name: AppealOfficer
    description: "Decides appeals. Segregation of duties: may not be the coordinator who issued the denial, nor a manager who signed a function analysis on the case."
    identity: "opaque"
    exclusive_operations:
      - "POST /appeals/{id}/decide"
    shared_operations:
      - "POST /appeals/{id}/transition"
      - "read endpoints across all cases"

  - name: ComplianceAuditor
    description: "Read-everything oversight role that also owns the confidentiality override and the operational clock and sweep."
    identity: "opaque"
    exclusive_operations:
      - "POST /accommodation-requests/{id}/confidentiality"
      - "POST /_clock/set_current_utc"
      - "POST /_ops/daily-sweep"
    shared_operations:
      - "POST /employees"
      - "POST /accommodation-requests/{id}/medical-disclosures"
      - "read endpoints across all cases including the medical disclosure log"
