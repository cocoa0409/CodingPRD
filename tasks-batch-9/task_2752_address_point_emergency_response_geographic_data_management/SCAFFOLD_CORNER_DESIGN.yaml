            - "${err_id} == \"ERR_BOUNDARY_INVALID_STATE\""
            - "EmergencyServiceBoundary.${b_id}.status == \"ACTIVE\""
            - "EmergencyServiceBoundary.${b_id}.assigned_cell_count == 1"
            - "BoundaryCellAssignment.${bca_id}.status == \"ACTIVE\"   # activated exactly once"
            - "CoverageCell.${cell_id}.active_assignment_count == 1   # not 2"
            - "Jurisdiction.${j_id}.gap_pair_count == 2   # FIRE and EMS remain uncovered"
            - "Jurisdiction.${j_id}.covered_cell_count == 0   # a covered cell needs all three service types"

