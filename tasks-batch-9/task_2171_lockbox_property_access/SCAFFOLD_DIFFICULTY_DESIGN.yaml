              as: Member
              as_user_id: "${m1_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: AssociationAdmin
              as_user_id: "admin-1"
            - call: "GET /listings/${lstA_id}"
              payload: {}
              as: Member
              as_user_id: "${m1_id}"
              captures: { lstA_v: $.data.version }
            - call: "POST /listings/${lstA_id}/state"
              payload: { action: "MARK_UNDER_CONTRACT", expected_listing_version: "${lstA_v}" }
              as: Member
