            - "${err_overlap} == ERR_RIGHTS_WINDOW_OVERLAP with HTTP 409 (expanded [17:55:00, 21:05:00] and [21:05:00, 21:39:00] touch at one instant)"
            - "${alloc_ok} == 24 and RightsWindow.${rw_ok}.status == ACTIVE"
            - "Game.${g_id}.allocated_minutes_total == 204 and Game.${g_id}.remaining_allocatable_minutes == 0"
            - "GET /games/${g_id}/rights-windows?status=ACTIVE returns total_count == 2"

      - name: feed_session_half_open_aggregate_venue_capacity
        grounds:
          - validations[priority=66]
          - errors[ERR_VENUE_TRANSPORT_CAPACITY_EXCEEDED]
          - entities.Venue.fields.transport_capacity_mbps
