          trigger:
            - { call: "POST /bit/disclosure-grants/${g1}/revoke", as: PrivacyOfficer, as_user_id: "${po}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_GRANT_NOT_APPROVED (HTTP 409); grant remains REQUESTED"

      - name: escalated_checkin_resets_stable_streak
        claim_type: side_effect_execution
        grounds:
          - "state_machines.FollowUpCheckin.SCHEDULED_to_COMPLETED"
        excluded_because:
          difficulty_instance: care_case_escalation_retriage_cycle
          rationale: "ESCALATED completion resetting consecutive_stable_checkins to 0 and superseding the ACTIVE plan is asserted in the named §1.8 instance."

      - name: plan_approve_case_state_gate
        claim_type: precondition_enforcement
        grounds:
