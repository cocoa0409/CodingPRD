            - call: "POST /line-items"
              payload: { estimate_id: "${est}", service_type: "REMOVAL", quantity: 1, tree_asset_id: "${tree}" }
              as: Arborist
          trigger:
            - call: "POST /work-orders/${wo}/estimates/${est}/issue"
              payload: {}
              as: Arborist
          assert:
            - "Estimate.${est}.line_items_subtotal_cents == 45000"
            - "Estimate.${est}.emergency_multiplier_applied == true"
            - "Estimate.${est}.total_cents == 67500"

  # ===========================================================================
  - section: consistency_model
    instances:
      - name: immediate_assess_visible_in_same_response
        claim_type: immediate
        grounds:
          - state_machines.WorkOrder.DRAFT_to_ASSESSED
          - entities.WorkOrder.fields.hazard_level
        distinguishing_aspect: "POST /assess returns the work order with hazard_level already set in the SAME response (immediate consistency)."
        test_recipe:
          setup:
            - "DRAFT work order with one SEVERE tree (dbh=40, lean=15, decay → 50+30+20=100 SEVERE)."
          setup_api_calls:
            - call: "POST /service-areas"
              payload: { name: "Northwest", region_code: "NW-01", disposal_fee_cents_per_ton: 8000 }
              as: Dispatcher
              captures: { area_id: $.data.id }
            - call: "POST /work-orders"
              payload: { service_area_id: "${area_id}", client_user_id: "client-1", site_address: "X", pricing_mode: "PER_JOB" }
              as: Dispatcher
              captures: { wo: $.data.id }
            - call: "POST /work-orders/${wo}/trees"
              payload: { species: "Oak", dbh_inches: 40, lean_degrees: 15, has_visible_decay: true }
              as: Arborist
              captures: { tree: $.data.id }
          trigger:
            - call: "POST /work-orders/${wo}/assess"
              payload: {}
              as: Arborist
              captures: { hl: $.data.hazard_level }
          assert:
            - "HTTP 200"
            - "WorkOrder.${wo}.hazard_level == SEVERE in the assess response itself"
            - "TreeAsset.${tree}.hazard_score == 100"
