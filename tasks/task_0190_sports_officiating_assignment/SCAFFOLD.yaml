    path: "/assignments/{id}/accept"
    description: "Official accepts an OFFERED assignment; OCC on game version"
    roles: [Official]
    code: 200
    input: [expected_game_version]
    output: Assignment
    side_effects: ["Assignment -> ACCEPTED; CrewSlot -> FILLED; Game.crew_filled_count recompute; may bubble OPEN -> STAFFED", "increments Game.version by 1"]

  - method: POST
    path: "/assignments/{id}/decline"
    description: "Official declines an OFFERED assignment; assess decline penalty"
    roles: [Official]
