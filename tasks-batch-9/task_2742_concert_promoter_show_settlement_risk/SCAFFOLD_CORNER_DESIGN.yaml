              as: TalentBuyer
              captures: { cd_sh_id: $.data.id, cd_sh_v1: $.data.version }
            # O0 -> withdrawn on purpose, so it is terminal before the cascade
            - call: "POST /offers"
              payload: { show_id: "${cd_sh_id}", expected_show_version: "${cd_sh_v1}", deal_structure: "FLAT_GUARANTEE", guarantee_cents: 700000, deposit_cents: 0, expense_cap_cents: 400000 }
              as: TalentBuyer
