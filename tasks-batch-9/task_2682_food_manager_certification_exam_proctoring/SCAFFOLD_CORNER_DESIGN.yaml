      - name: checkin_window_bounds_and_voided_item_count_rejections
        claim_type: violation_to_error
        grounds:
          - validations[priority=40]
          - validations[priority=44]
          - errors.ERR_CHECKIN_WINDOW_CLOSED
          - errors.ERR_VOIDED_ITEM_COUNT_INVALID
          - calculations.scaled_score
        distinguishing_aspect: |
          The check-in window [scheduled_start_at - 30min, scheduled_start_at + 15min] is closed on BOTH ends
          and inclusive at both: 08:29 fails and 08:30 succeeds for an 09:00 sitting, 09:16 fails and 09:15
          succeeds. The two ends are asserted on separate sittings because a successful check-in is not
          repeatable. Independently, finalization's voided-item guard has two arms — voided_item_count must be
          strictly LESS than the form's 80 scored items (80 is refused, 5 is fine) and voided_correct_count
          must not exceed min(voided_item_count, raw_correct_count) — so 6 voided-correct against 5 voided
          items is refused while 4 is accepted.
