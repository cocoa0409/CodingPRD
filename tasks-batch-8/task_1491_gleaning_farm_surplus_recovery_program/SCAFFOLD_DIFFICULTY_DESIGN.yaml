      - name: occ_version_monotonicity_invariant
        grounds:
          - concurrency_rules[distribution-create-stale-event]
          - concurrency_rules[offer-close-stale-version]
          - entities.GleanEvent.fields
        distinguishing_aspect: |
          Conserved quantity: OCC causality on version counters (third distinct
          quantity type — not pounds). Invariant: every successful mutation
          advances version by exactly 1 and a stale expected version is always
          rejected, so create-with-supersede can never double-apply. Sequence:
          event v N observed; distribution created with expected N succeeds
          (v -> N+1); replaying the same create with expected N fails 412; and
          creating with expected N+1 succeeds (v -> N+2). Version arithmetic is
          the conserved causality token.
        test_recipe:
          setup:
            - "Event harvested 500.0; agency capacity 100000"
          setup_api_calls:
            - call: "POST /glean/farms"
              payload: { farm_name: "FOC", contact_email: "foc@x.com", county_code: "OCC", donor_tin: "18-3456789" }
              as: ProgramCoordinator
              captures: { farm_id: $.data.id }
            - call: "POST /glean/vehicles"
              payload: { plate: "POC", payload_capacity_lbs: 5000, refrigerated: false }
              as: ProgramCoordinator
              captures: { veh_id: $.data.id }
            - call: "POST /glean/agencies"
              payload: { agency_name: "AGOC", county_code: "OCC", weekly_capacity_lbs: 100000, refrigeration_capable: false }
              as: ProgramCoordinator
              captures: { ag_id: $.data.id }
            - call: "POST /glean/volunteers"
              payload: { full_name: "Lead OC", email: "leadoc@x.com", crew_leader_certified: true }
              as: ProgramCoordinator
              captures: { lead_id: $.data.id }
            - call: "POST /glean/volunteers"
              payload: { full_name: "Coord OC", email: "coordoc@x.com", crew_leader_certified: false }
              as: ProgramCoordinator
              captures: { coord_id: $.data.id }
            - call: "POST /glean/offers"
              payload: { farm_id: "${farm_id}", crop_code: "ROOT_VEG", estimated_lbs: 600.0, window_start: "2026-08-05T00:00:00Z", window_end: "2026-08-20T00:00:00Z", perishability_class: "LOW", requires_refrigeration: false }
              as: ProgramCoordinator
              captures: { offer_id: $.data.id }
            - call: "POST /glean/events"
              payload: { surplus_offer_id: "${offer_id}", scheduled_start: "2026-08-10T08:00:00Z", scheduled_end: "2026-08-10T12:00:00Z", crew_leader_volunteer_id: "${lead_id}", assigned_vehicle_id: "${veh_id}", crew_capacity: 1 }
              as: ProgramCoordinator
              captures: { event_id: $.data.id }
            - call: "POST /glean/events/${event_id}/publish"
              payload: {}
              as: ProgramCoordinator
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T09:00:00Z" }
              as: ProgramCoordinator
            - call: "POST /glean/events/${event_id}/start"
              payload: {}
              as: CrewLeader
              as_user_id: "${lead_id}"
            - call: "POST /glean/containers"
              payload: { label: "BIN-OC", tare_lbs: 10.0, capacity_lbs: 1000, refrigerated: false }
              as: ProgramCoordinator
              captures: { cont_id: $.data.id }
            - call: "POST /glean/lots"
              payload: { glean_event_id: "${event_id}", container_id: "${cont_id}", gross_lbs: 510.0, cull_lbs: 0.0, recorded_by_volunteer_id: "${lead_id}" }
              as: CrewLeader
              as_user_id: "${lead_id}"
              captures: { lot_id: $.data.id }
            - call: "POST /glean/lots/${lot_id}/verify"
              payload: { verified_by_coordinator_id: "${coord_id}" }
              as: ProgramCoordinator
            - call: "POST /glean/events/${event_id}/finish"
              payload: {}
              as: CrewLeader
              as_user_id: "${lead_id}"
            - call: "GET /glean/events/${event_id}"
              payload: {}
              as: ProgramCoordinator
              captures: { ev_v: $.data.version }
          trigger:
            - call: "POST /glean/distributions"
              payload: { glean_event_id: "${event_id}", agency_id: "${ag_id}", planned_lbs: 100.0, delivery_date: "2026-08-12T10:00:00Z", expected_event_version: "${ev_v}" }
              as: ProgramCoordinator
              captures: { dist1: $.data.id }
            - call: "POST /glean/distributions"
              payload: { glean_event_id: "${event_id}", agency_id: "${ag_id}", planned_lbs: 100.0, delivery_date: "2026-08-12T11:00:00Z", expected_event_version: "${ev_v}" }
              as: ProgramCoordinator
              captures: { err_id: $.data.error_id }
            - call: "GET /glean/events/${event_id}"
              payload: {}
              as: ProgramCoordinator
              captures: { ev_v_after: $.data.version }
          assert:
            - "err_id == ERR_STALE_EVENT_VERSION (replayed create with the pre-mutation version rejected 412)"
