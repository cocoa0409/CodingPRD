# =============================================================================
# Task 1463 — §1.9 Scaffold Corner Design (Coverage Index, non-Difficulty claims)
# Breadth walk of SCAFFOLD.yaml §1.1–§1.7 per claim-extraction-guide.
# Logical clock default at startup: 2026-08-01T00:00:00Z.
# =============================================================================

scaffold_corner_design:
  # ===========================================================================
  - section: entities
    instances:
      - name: show_creation_applies_defaults
        claim_type: defaults
        grounds: [entities.Show]
        distinguishing_aspect: "Omitting blocked_advertiser_categories yields []; tier CLEAR, forecast/reserved/available all 0, version 1 on creation."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls:
            - call: "POST /adnet/shows"
              payload: { title: "Defaults FM", content_category: "NEWS", avg_downloads_30d: 5000 }
              as: AdOps
              captures: { sh: $.data.id }
          trigger:
            - call: "GET /adnet/shows/${sh}"
              as: AdOps
          assert:
            - "Show.${sh}.blocked_advertiser_categories == [] (default applied)"
            - "Show.${sh}.brand_safety_tier == CLEAR (initial state)"
            - "Show.${sh}.forecast_impressions == 0 and reserved_impressions == 0 and available_impressions == 0"
            - "Show.${sh}.version == 1 and created_at is stamped"

      - name: episode_creation_applies_defaults
        claim_type: defaults
        grounds: [entities.Episode]
        distinguishing_aspect: "Omitting measurement_window_days/slot_capacity yields 30/2; status starts SCHEDULED; download counters 0."
        test_recipe:
          setup: ["One show"]
          setup_api_calls:
            - call: "POST /adnet/shows"
              payload: { title: "Defaults 2", content_category: "COMEDY", avg_downloads_30d: 100 }
              as: AdOps
              captures: { sh: $.data.id }
            - call: "POST /adnet/episodes"
              payload: { show_id: "${sh}", title: "E1", publish_at: "2026-08-05T00:00:00Z" }
              as: AdOps
              captures: { ep: $.data.id }
          trigger:
            - call: "GET /adnet/episodes/${ep}"
              as: AdOps
          assert:
            - "Episode.${ep}.measurement_window_days == 30 and slot_capacity == 2 (defaults)"
            - "Episode.${ep}.status == SCHEDULED (initial state)"
            - "Episode.${ep}.provisional_download_count == 0 and measured_download_count == 0 and slots_in_use == 0"
            - "Show.${sh}.forecast_impressions == floor(100 * 1 * 0.95) == 95 (episode inside horizon recomputes forecast on create)"

      - name: get_show_with_unknown_id_not_found
        claim_type: not_found
        grounds: [entities.Show, "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET with a well-formed but unknown UUID yields 404 ERR_NOT_FOUND."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /adnet/shows/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              as: AdOps
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 404 and error_id == ERR_NOT_FOUND"

      - name: campaign_zero_booked_impressions_rejected
        claim_type: type_constraints
        grounds: [entities.Campaign.fields.booked_impressions, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "booked_impressions must be > 0; 0 is rejected with ERR_INVALID_REQUEST (400) before any state/business rule."
        test_recipe:
          setup: ["One ACTIVE advertiser"]
          setup_api_calls:
            - call: "POST /adnet/advertisers"
              payload: { name: "ZeroCo", category: "FINTECH" }
              as: AdOps
              captures: { adv: $.data.id }
          trigger:
            - call: "POST /adnet/campaigns"
              payload: { advertiser_id: "${adv}", name: "Z", flight_start: "2026-08-01T00:00:00Z", flight_end: "2026-09-01T00:00:00Z", booked_impressions: 0, cpm_cents: 1000, billing_model: "ACTUAL_DELIVERY" }
              as: AdOps
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 400 and error_id == ERR_INVALID_REQUEST"

      - name: line_item_dual_target_rejected
        claim_type: type_constraints
        grounds: [entities.LineItem.fields.show_id, entities.LineItem.fields.episode_id, "errors[ERR_TARGET_SCOPE_INVALID]"]
        distinguishing_aspect: "Setting both show_id and episode_id violates the exactly-one-target constraint; neither set is equally invalid."
        test_recipe:
          setup: ["Show with episode; advertiser; DRAFT campaign; copy exists (content of copy irrelevant — referential check fires)" ]
          setup_api_calls:
            - call: "POST /adnet/shows"
              payload: { title: "Scope FM", content_category: "NEWS", avg_downloads_30d: 1000 }
              as: AdOps
              captures: { sh: $.data.id }
            - call: "POST /adnet/episodes"
              payload: { show_id: "${sh}", title: "E1", publish_at: "2026-08-05T00:00:00Z" }
              as: AdOps
              captures: { ep: $.data.id }
            - call: "POST /adnet/advertisers"
              payload: { name: "ScopeCo", category: "FINTECH" }
              as: AdOps
              captures: { adv: $.data.id }
            - call: "POST /adnet/campaigns"
              payload: { advertiser_id: "${adv}", name: "CS", flight_start: "2026-08-01T00:00:00Z", flight_end: "2026-09-01T00:00:00Z", booked_impressions: 10, cpm_cents: 1000, billing_model: "ACTUAL_DELIVERY" }
              as: AdOps
              captures: { cmp: $.data.id }
            - call: "POST /adnet/ad-copies"
              payload: { campaign_id: "${cmp}", kind: "PRODUCED_AUDIO", script_text: "spot" }
              as: Advertiser
              as_user_id: "${adv}"
              captures: { cpy: $.data.id }
          trigger:
            - call: "POST /adnet/line-items"
              payload: { campaign_id: "${cmp}", show_id: "${sh}", episode_id: "${ep}", ad_format: "PRODUCED_SPOT", position: "MID_ROLL", reserved_impressions: 10, priority: 1, ad_copy_id: "${cpy}" }
              as: AdOps
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 400 and error_id == ERR_TARGET_SCOPE_INVALID"

      - name: download_computed_and_system_fields
        claim_type: computed_fields
        grounds: [entities.Download]
        distinguishing_aspect: "Ingest mints listener_key as prefix-i, computes qualified_provisional immediately, and leaves qualified_final null until measurement."
        test_recipe:
          setup: ["Show; PUBLISHED episode"]
          setup_api_calls:
            - call: "POST /adnet/shows"
              payload: { title: "DL FM", content_category: "NEWS", avg_downloads_30d: 1000 }
              as: AdOps
              captures: { sh: $.data.id }
            - call: "POST /adnet/episodes"
              payload: { show_id: "${sh}", title: "E1", publish_at: "2026-08-01T00:00:00Z" }
              as: AdOps
              captures: { ep: $.data.id }
            - call: "POST /adnet/episodes/${ep}/transition"
              payload: { action: "PUBLISH" }
              as: AdOps
          trigger:
            - call: "POST /adnet/downloads"
              payload: { episode_id: "${ep}", listener_key_prefix: "K", count: 2, occurred_at: "2026-08-02T00:00:00Z", user_agent_class: "HUMAN" }
              as: Ingestion
          assert:
            - "GET /adnet/episodes/${ep}/downloads returns 2 rows with listener_key == 'K-0' and 'K-1' (system-minted)"
            - "Both rows have qualified_provisional == true and qualified_final == null"
            - "Neither row carries version or updated_at (common_fields: false)"

      - name: host_read_copy_requires_show_rejected
        claim_type: required_fields
        grounds: [entities.AdCopy.fields.show_id, "errors[ERR_HOST_READ_REQUIRES_SHOW]"]
        distinguishing_aspect: "HOST_READ_SCRIPT without show_id is a conditional required-field violation (400); PRODUCED_AUDIO without show_id is accepted."
        test_recipe:
          setup: ["Advertiser; DRAFT campaign"]
          setup_api_calls:
            - call: "POST /adnet/advertisers"
              payload: { name: "HostCo", category: "CPG_FOOD" }
              as: AdOps
              captures: { adv: $.data.id }
            - call: "POST /adnet/campaigns"
              payload: { advertiser_id: "${adv}", name: "CH", flight_start: "2026-08-01T00:00:00Z", flight_end: "2026-09-01T00:00:00Z", booked_impressions: 10, cpm_cents: 1000, billing_model: "ACTUAL_DELIVERY" }
              as: AdOps
              captures: { cmp: $.data.id }
          trigger:
            - call: "POST /adnet/ad-copies"
              payload: { campaign_id: "${cmp}", kind: "HOST_READ_SCRIPT", script_text: "host script" }
              as: Advertiser
              as_user_id: "${adv}"
              captures: { err: $.data.error_id }
            - call: "POST /adnet/ad-copies"
              payload: { campaign_id: "${cmp}", kind: "PRODUCED_AUDIO", script_text: "produced spot" }
              as: Advertiser
              as_user_id: "${adv}"
          assert:
            - "First create: HTTP 400, error_id == ERR_HOST_READ_REQUIRES_SHOW"
            - "Second create (PRODUCED_AUDIO, no show_id): 201 with status == DRAFT and revision == 1"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: episode_publish_before_due_rejected
        claim_type: precondition_enforcement
        grounds: [state_machines.Episode.SCHEDULED_to_PUBLISHED, "errors[ERR_EPISODE_NOT_DUE]"]
        distinguishing_aspect: "Logical clock 2026-08-01 < publish_at 2026-08-10 blocks PUBLISH; after the clock reaches publish_at the same call succeeds."
        test_recipe:
          setup: ["Show; episode publish_at 2026-08-10T00:00:00Z; clock still at startup default"]
          setup_api_calls:
            - call: "POST /adnet/shows"
              payload: { title: "Due FM", content_category: "NEWS", avg_downloads_30d: 100 }
              as: AdOps
              captures: { sh: $.data.id }
            - call: "POST /adnet/episodes"
              payload: { show_id: "${sh}", title: "E1", publish_at: "2026-08-10T00:00:00Z" }
              as: AdOps
              captures: { ep: $.data.id }
          trigger:
            - call: "POST /adnet/episodes/${ep}/transition"
              payload: { action: "PUBLISH" }
              as: AdOps
              captures: { err: $.data.error_id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: AdOps
            - call: "POST /adnet/episodes/${ep}/transition"
              payload: { action: "PUBLISH" }
              as: AdOps
          assert:
            - "First PUBLISH: HTTP 409, error_id == ERR_EPISODE_NOT_DUE; episode stays SCHEDULED"
            - "At clock == publish_at the retry succeeds (>= gate, inclusive): status == PUBLISHED"

      - name: finalize_at_exact_window_close_rejected
        claim_type: precondition_enforcement
        grounds: [state_machines.Episode.PUBLISHED_to_MEASURED, "errors[ERR_MEASUREMENT_WINDOW_OPEN]"]
        distinguishing_aspect: "The finalize gate is strictly greater-than: at clock == publish_at + 30 days exactly, FINALIZE_MEASUREMENT still fails; one second later it succeeds."
        test_recipe:
          setup: ["Show; episode publish_at 2026-08-01T00:00:00Z window 30, PUBLISHED at startup default clock"]
          setup_api_calls:
            - call: "POST /adnet/shows"
              payload: { title: "Window FM", content_category: "NEWS", avg_downloads_30d: 100 }
              as: AdOps
              captures: { sh: $.data.id }
            - call: "POST /adnet/episodes"
              payload: { show_id: "${sh}", title: "E1", publish_at: "2026-08-01T00:00:00Z", measurement_window_days: 30 }
              as: AdOps
              captures: { ep: $.data.id }
            - call: "POST /adnet/episodes/${ep}/transition"
              payload: { action: "PUBLISH" }
              as: AdOps
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-31T00:00:00Z" }
              as: AdOps
          trigger:
            - call: "POST /adnet/episodes/${ep}/transition"
              payload: { action: "FINALIZE_MEASUREMENT" }
              as: AdOps
              captures: { err: $.data.error_id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-31T00:00:01Z" }
              as: AdOps
            - call: "POST /adnet/episodes/${ep}/transition"
              payload: { action: "FINALIZE_MEASUREMENT" }
              as: AdOps
          assert:
            - "At exactly publish_at + 30d: HTTP 409, error_id == ERR_MEASUREMENT_WINDOW_OPEN"
            - "One second later: succeeds, status == MEASURED, measured_download_count == 0"

      - name: download_ingest_into_scheduled_episode_rejected
        claim_type: precondition_enforcement
        grounds: ["errors[ERR_EPISODE_NOT_PUBLISHED]", "endpoints: POST /adnet/downloads"]
        distinguishing_aspect: "Ingest against a SCHEDULED episode fails with ERR_EPISODE_NOT_PUBLISHED and creates no downloads."
        test_recipe:
          setup: ["Show; SCHEDULED episode (publish_at 2026-08-10, clock at default)"]
          setup_api_calls:
            - call: "POST /adnet/shows"
              payload: { title: "Sched FM", content_category: "NEWS", avg_downloads_30d: 100 }
              as: AdOps
              captures: { sh: $.data.id }
            - call: "POST /adnet/episodes"
              payload: { show_id: "${sh}", title: "E1", publish_at: "2026-08-10T00:00:00Z" }
              as: AdOps
              captures: { ep: $.data.id }
          trigger:
            - call: "POST /adnet/downloads"
              payload: { episode_id: "${ep}", listener_key_prefix: "S", count: 1, occurred_at: "2026-08-02T00:00:00Z", user_agent_class: "HUMAN" }
              as: Ingestion
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409, error_id == ERR_EPISODE_NOT_PUBLISHED"
            - "GET /adnet/episodes/${ep}/downloads returns total_count == 0"

      - name: campaign_cancel_lockdown_from_terminal
        claim_type: terminal_state_lockdown
        grounds: [state_machines.Campaign.DRAFT_to_CANCELLED, "errors[ERR_CAMPAIGN_NOT_ACTIVATABLE]"]
        distinguishing_aspect: "CANCELLED is terminal: after DRAFT->CANCELLED, ACTIVATE/END all fail with ERR_CAMPAIGN_NOT_ACTIVATABLE."
        test_recipe:
          setup: ["Advertiser; DRAFT campaign"]
          setup_api_calls:
            - call: "POST /adnet/advertisers"
              payload: { name: "CancelCo", category: "FINTECH" }
              as: AdOps
              captures: { adv: $.data.id }
            - call: "POST /adnet/campaigns"
              payload: { advertiser_id: "${adv}", name: "CX", flight_start: "2026-08-01T00:00:00Z", flight_end: "2026-09-01T00:00:00Z", booked_impressions: 10, cpm_cents: 1000, billing_model: "ACTUAL_DELIVERY" }
              as: AdOps
              captures: { cmp: $.data.id }
          trigger:
            - call: "POST /adnet/campaigns/${cmp}/transition"
              payload: { action: "CANCEL" }
              as: AdOps
            - call: "POST /adnet/campaigns/${cmp}/transition"
              payload: { action: "ACTIVATE" }
              as: AdOps
              captures: { err: $.data.error_id }
          assert:
            - "CANCEL from DRAFT succeeds (status == CANCELLED)"
            - "ACTIVATE from CANCELLED: HTTP 409, error_id == ERR_CAMPAIGN_NOT_ACTIVATABLE"

      - name: line_item_end_is_terminal
        claim_type: terminal_state_lockdown
        grounds: [state_machines.LineItem, "errors[ERR_LINE_ITEM_STATE]"]
        distinguishing_aspect: "ENDED is terminal for line items: ACTIVATE after END fails with ERR_LINE_ITEM_STATE (the state error surfaces even though every business gate would pass)."
        test_recipe:
          setup: ["Show (avg 10000, episode in horizon); ACTIVE campaign with APPROVED copy; line item taken DRAFT->ACTIVE->ENDED"]
          setup_api_calls:
            - call: "POST /adnet/shows"
              payload: { title: "Term FM", content_category: "NEWS", avg_downloads_30d: 10000 }
              as: AdOps
              captures: { sh: $.data.id }
            - call: "POST /adnet/episodes"
              payload: { show_id: "${sh}", title: "E1", publish_at: "2026-08-05T00:00:00Z" }
              as: AdOps
            - call: "POST /adnet/advertisers"
              payload: { name: "TermCo", category: "FINTECH" }
              as: AdOps
              captures: { adv: $.data.id }
            - call: "POST /adnet/campaigns"
              payload: { advertiser_id: "${adv}", name: "CT", flight_start: "2026-08-01T00:00:00Z", flight_end: "2026-09-01T00:00:00Z", booked_impressions: 10, cpm_cents: 1000, billing_model: "ACTUAL_DELIVERY" }
              as: AdOps
              captures: { cmp: $.data.id }
            - call: "POST /adnet/ad-copies"
              payload: { campaign_id: "${cmp}", kind: "PRODUCED_AUDIO", script_text: "spot" }
              as: Advertiser
              as_user_id: "${adv}"
              captures: { cpy: $.data.id }
            - call: "POST /adnet/ad-copies/${cpy}/submit"
              as: Advertiser
              as_user_id: "${adv}"
            - call: "POST /adnet/ad-copies/${cpy}/review"
              payload: { action: "APPROVE" }
              as: AdOps
            - call: "POST /adnet/campaigns/${cmp}/transition"
              payload: { action: "ACTIVATE" }
              as: AdOps
            - call: "POST /adnet/line-items"
              payload: { campaign_id: "${cmp}", show_id: "${sh}", ad_format: "PRODUCED_SPOT", position: "MID_ROLL", reserved_impressions: 10, priority: 1, ad_copy_id: "${cpy}" }
              as: AdOps
              captures: { li: $.data.id }
            - call: "POST /adnet/line-items/${li}/transition"
              payload: { action: "ACTIVATE" }
              as: AdOps
            - call: "POST /adnet/line-items/${li}/transition"
              payload: { action: "END" }
              as: AdOps
          trigger:
            - call: "POST /adnet/line-items/${li}/transition"
              payload: { action: "ACTIVATE" }
              as: AdOps
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409, error_id == ERR_LINE_ITEM_STATE; LineItem.${li}.status stays ENDED"

      - name: ad_copy_review_from_draft_rejected
        claim_type: invalid_transition
        grounds: [state_machines.AdCopy, "errors[ERR_COPY_STATE]"]
        distinguishing_aspect: "REVIEW actions require SUBMITTED (or APPROVED for REQUEST_CHANGES); reviewing a DRAFT copy fails with ERR_COPY_STATE."
        test_recipe:
          setup: ["Advertiser; campaign; DRAFT PRODUCED_AUDIO copy"]
          setup_api_calls:
            - call: "POST /adnet/advertisers"
              payload: { name: "DraftCo", category: "FINTECH" }
              as: AdOps
              captures: { adv: $.data.id }
            - call: "POST /adnet/campaigns"
              payload: { advertiser_id: "${adv}", name: "CD", flight_start: "2026-08-01T00:00:00Z", flight_end: "2026-09-01T00:00:00Z", booked_impressions: 10, cpm_cents: 1000, billing_model: "ACTUAL_DELIVERY" }
              as: AdOps
              captures: { cmp: $.data.id }
            - call: "POST /adnet/ad-copies"
              payload: { campaign_id: "${cmp}", kind: "PRODUCED_AUDIO", script_text: "spot" }
              as: Advertiser
              as_user_id: "${adv}"
              captures: { cpy: $.data.id }
          trigger:
            - call: "POST /adnet/ad-copies/${cpy}/review"
              payload: { action: "APPROVE" }
              as: AdOps
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409, error_id == ERR_COPY_STATE; AdCopy.${cpy}.status stays DRAFT with revision == 1"

      - name: ad_copy_withdraw_terminal
        claim_type: valid_transition
        grounds: [state_machines.AdCopy.DRAFT_to_WITHDRAWN, "errors[ERR_COPY_STATE]"]
        distinguishing_aspect: "Owner-only WITHDRAW moves DRAFT->WITHDRAWN; WITHDRAWN is terminal so a later submit fails with ERR_COPY_STATE."
        test_recipe:
          setup: ["Advertiser; campaign; DRAFT copy owned by the advertiser"]
          setup_api_calls:
            - call: "POST /adnet/advertisers"
              payload: { name: "WdCo", category: "FINTECH" }
              as: AdOps
              captures: { adv: $.data.id }
            - call: "POST /adnet/campaigns"
              payload: { advertiser_id: "${adv}", name: "CW", flight_start: "2026-08-01T00:00:00Z", flight_end: "2026-09-01T00:00:00Z", booked_impressions: 10, cpm_cents: 1000, billing_model: "ACTUAL_DELIVERY" }
              as: AdOps
              captures: { cmp: $.data.id }
            - call: "POST /adnet/ad-copies"
              payload: { campaign_id: "${cmp}", kind: "PRODUCED_AUDIO", script_text: "spot" }
              as: Advertiser
              as_user_id: "${adv}"
              captures: { cpy: $.data.id }
          trigger:
            - call: "POST /adnet/ad-copies/${cpy}/review"
              payload: { action: "WITHDRAW" }
              as: Advertiser
              as_user_id: "${adv}"
            - call: "POST /adnet/ad-copies/${cpy}/submit"
              as: Advertiser
              as_user_id: "${adv}"
              captures: { err: $.data.error_id }
          assert:
            - "WITHDRAW succeeds: AdCopy.${cpy}.status == WITHDRAWN"
            - "Submit from WITHDRAWN: HTTP 409, error_id == ERR_COPY_STATE"

      - name: invoice_mark_paid_requires_issued
        claim_type: invalid_transition
        grounds: [state_machines.Invoice, "errors[ERR_INVOICE_STATE]"]
        distinguishing_aspect: "MARK_PAID from DRAFT skips ISSUED and is rejected; the full DRAFT->ISSUED->PAID path succeeds."
        test_recipe:
          setup: ["Full billing chain: show/episode/advertiser/campaign (booked 5, cpm 1000, ACTUAL_DELIVERY, MID_ROLL run-of-show), copy APPROVED, line item ACTIVE, 5 qualified downloads measured, campaign ENDED, invoice DRAFT (no shortfall -> no make-good)"]
          setup_api_calls:
            - call: "POST /adnet/shows"
              payload: { title: "Inv FM", content_category: "NEWS", avg_downloads_30d: 10000 }
              as: AdOps
              captures: { sh: $.data.id }
            - call: "POST /adnet/episodes"
              payload: { show_id: "${sh}", title: "E1", publish_at: "2026-08-01T00:00:00Z" }
              as: AdOps
              captures: { ep: $.data.id }
            - call: "POST /adnet/advertisers"
              payload: { name: "InvCo", category: "FINTECH" }
              as: AdOps
              captures: { adv: $.data.id }
            - call: "POST /adnet/campaigns"
              payload: { advertiser_id: "${adv}", name: "CI", flight_start: "2026-08-01T00:00:00Z", flight_end: "2026-09-01T00:00:00Z", booked_impressions: 5, cpm_cents: 1000, billing_model: "ACTUAL_DELIVERY" }
              as: AdOps
              captures: { cmp: $.data.id }
            - call: "POST /adnet/ad-copies"
              payload: { campaign_id: "${cmp}", kind: "PRODUCED_AUDIO", script_text: "spot" }
              as: Advertiser
              as_user_id: "${adv}"
              captures: { cpy: $.data.id }
            - call: "POST /adnet/ad-copies/${cpy}/submit"
              as: Advertiser
              as_user_id: "${adv}"
            - call: "POST /adnet/ad-copies/${cpy}/review"
              payload: { action: "APPROVE" }
              as: AdOps
            - call: "POST /adnet/campaigns/${cmp}/transition"
              payload: { action: "ACTIVATE" }
              as: AdOps
            - call: "POST /adnet/line-items"
              payload: { campaign_id: "${cmp}", show_id: "${sh}", ad_format: "PRODUCED_SPOT", position: "MID_ROLL", reserved_impressions: 5, priority: 1, ad_copy_id: "${cpy}" }
              as: AdOps
              captures: { li: $.data.id }
            - call: "POST /adnet/line-items/${li}/transition"
              payload: { action: "ACTIVATE" }
              as: AdOps
            - call: "POST /adnet/episodes/${ep}/transition"
              payload: { action: "PUBLISH" }
              as: AdOps
