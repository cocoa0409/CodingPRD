          assert:
            - "first screen (no OPEN/EXISTING stores in program): TradeArea.${tab}.trade_area_score == 59.24 and status == QUALIFIED (standard variant)"

      - name: earnest_money_validation
        claim_type: violation_to_error
        grounds:
