# =============================================================================
# Swim School & Lesson Program — SCAFFOLD.yaml (§1.0–§1.7)
# Difficulty band: Expert (§0.4)
# =============================================================================

scenario: |
  463. Swim School & Lesson Program (SafeSplash style): level/curriculum & skill
  assessment, class scheduling & lane/instructor, perpetual enrollment & monthly
  billing, level-up evaluation & advancement, makeup/skip credit, sibling
  discount, parent portal & progress, age-based ratio/capacity

domain_name: swim-school-lessons
# Flat topology: peer top-level collections (/parents, /students, /class-sessions,
# /levels, /locations, /instructors, /enrollments, /invoices, /makeup-credits,
# /makeup-bookings, /assessments). The root "/" is the shared collection anchor;
# child entities are reachable by filtered list and by sub-resource where nested.
api_prefix: "/"

complexity_profile:
  primary_archetype: temporal_windowing
  secondary_archetype: quota_allocation
  complexity_layers:
    - cascading_side_effects
    - dual_variant_calculation
    - derived_field_reconciliation
    - optimistic_concurrency

  entity_topology: flat
  state_machine_shape: parallel        # cyclic (Enrollment ACTIVE<->PAUSED, MakeupCredit ISSUED<->REDEEMED) + branching (Assessment) across entities
  relationship_patterns:
    - one_to_many                       # Parent->Student, Level->Skill, ClassSession->Enrollment
    - self_referential                  # Level.next_level_id chains the curriculum ladder
    - cross_aggregate                   # Enrollment, MakeupBooking, Assessment span Student/ClassSession/Level
  role_model: peer_roles                # Parent / Instructor own distinct surfaces; SchoolAdmin + BillingAdmin operate
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — EMIT VERBATIM)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Location
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Pool/facility name" }
      - { name: timezone, type: string, source: input, default: "UTC", description: "IANA timezone label (informational only; all clock math is UTC)" }
      - { name: status, type: enum, source: system, default: "OPEN", description: "OPEN | CLOSED" }

  - name: Level
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Curriculum level name (e.g., Tots, Level 1)" }
      - { name: sequence_order, type: integer, source: input, description: "Ascending ladder position; unique across levels", constraints: "integer >= 1, unique" }
      - { name: next_level_id, type: string, source: input, default: null, description: "FK -> Level.id; self-referential pointer to the next rung; null for the top level" }
      - { name: min_age_months, type: integer, source: input, description: "Inclusive lower age bound in months", constraints: ">= 0" }
      - { name: max_age_months, type: integer, source: input, description: "Exclusive upper age bound in months", constraints: "> min_age_months" }
      - { name: max_students_per_instructor, type: integer, source: input, description: "Age-based ratio; becomes each ClassSession capacity", constraints: ">= 1" }
      - { name: monthly_tuition_cents, type: integer, source: input, description: "Base monthly tuition for a session at this level, in cents", constraints: ">= 0" }
      - { name: readiness_threshold, type: number, source: input, default: 0.80, description: "Holistic weighted-average score needed for level-up recommendation", constraints: "0 < x <= 1" }

  - name: Skill
    parent: Level
    common_fields: true
    fields:
      - { name: level_id, type: string, source: system, description: "FK -> Level.id; owning curriculum level" }
      - { name: name, type: string, source: input, description: "Skill name (e.g., Back Float 10s)" }
      - { name: weight, type: number, source: input, default: 1.0, description: "Relative weight in the holistic readiness score", constraints: "> 0" }

  - name: Instructor
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Instructor name" }
      - { name: certified_level_ids, type: array, source: input, default: [], description: "Array of Level.id this instructor may teach" }
      - { name: status, type: enum, source: system, default: "ACTIVE", description: "ACTIVE | INACTIVE" }

  - name: Parent
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Account holder name" }
      - { name: email, type: string, source: input, description: "Login/contact email; unique", constraints: "unique, case-insensitive" }
      - { name: account_standing, type: enum, source: computed, default: "CURRENT", description: "CURRENT | PAST_DUE; PAST_DUE when any ISSUED invoice is past its due date" }
      - { name: outstanding_balance_cents, type: integer, source: computed, description: "Sum of total_cents over the parent's invoices in {ISSUED} status; recomputed on invoice issue/pay/void" }

  - name: Student
    parent: Parent
    common_fields: true
    fields:
      - { name: parent_id, type: string, source: system, description: "FK -> Parent.id; owning account" }
      - { name: full_name, type: string, source: input, description: "Student name" }
      - { name: birthdate, type: datetime, source: input, description: "Date of birth (UTC midnight); age_months derived against the logical clock" }
      - { name: current_level_id, type: string, source: input, description: "FK -> Level.id; the level the student is currently placed in" }
      - { name: age_months, type: integer, source: computed, description: "floor((current_utc - birthdate) in whole months); recomputed on read against the logical clock" }
      - { name: status, type: enum, source: system, default: "ACTIVE", description: "ACTIVE | WITHDRAWN" }

  - name: ClassSession
    parent: null
    common_fields: true
    fields:
      - { name: location_id, type: string, source: input, description: "FK -> Location.id" }
      - { name: level_id, type: string, source: input, description: "FK -> Level.id; fixes capacity and age window" }
      - { name: instructor_id, type: string, source: input, description: "FK -> Instructor.id; assigned teacher" }
      - { name: lane_number, type: integer, source: input, description: "Pool lane; unique per (location_id, day_of_week, time window)", constraints: ">= 1" }
      - { name: day_of_week, type: integer, source: input, description: "Recurring weekday 0=Mon..6=Sun", constraints: "0..6" }
      - { name: start_minute, type: integer, source: input, description: "Minutes from local midnight for class start", constraints: "0..1439" }
      - { name: end_minute, type: integer, source: input, description: "Minutes from local midnight for class end", constraints: "start_minute < end_minute <= 1440" }
      - { name: capacity, type: integer, source: computed, description: "Copied from Level.max_students_per_instructor at creation; the seat quota" }
      - { name: enrolled_count, type: integer, source: computed, description: "Count of Enrollments in {ACTIVE} for this session; reconciled on every enrollment lifecycle change" }
      - { name: waitlist_count, type: integer, source: computed, description: "Count of Enrollments in {WAITLISTED} for this session" }
      - { name: status, type: enum, source: system, default: "DRAFT", description: "DRAFT | OPEN | CLOSED" }

  - name: Enrollment
    parent: null
    common_fields: true
    fields:
      - { name: student_id, type: string, source: input, description: "FK -> Student.id; enrolled child" }
      - { name: class_session_id, type: string, source: input, description: "FK -> ClassSession.id; perpetual seat" }
      - { name: joined_at, type: datetime, source: system, description: "Logical-clock instant the enrollment became ACTIVE or WAITLISTED" }
      - { name: tuition_basis_cents, type: integer, source: computed, description: "Level.monthly_tuition_cents snapshotted at creation; the per-cycle base before discount/proration" }
      - { name: is_prorated_first_cycle, type: boolean, source: computed, default: false, description: "Marker: true when ACTIVE join occurred after a cycle boundary (joined mid-cycle). The authoritative proration is the invoice formula comparing joined_at to that invoice's cycle_start." }
      - { name: status, type: enum, source: system, default: "WAITLISTED", description: "WAITLISTED | ACTIVE | PAUSED | WITHDRAWN; ACTIVE<->PAUSED is a cycle" }

  - name: Invoice
    parent: null
    common_fields: true
    fields:
      - { name: parent_id, type: string, source: input, description: "FK -> Parent.id; billed account" }
      - { name: cycle_start, type: datetime, source: input, description: "First instant (UTC) of the billing cycle this invoice covers" }
      - { name: cycle_end, type: datetime, source: input, description: "Exclusive end instant (UTC) of the billing cycle", constraints: "> cycle_start" }
      - { name: variant, type: enum, source: input, default: "FORWARD_LOOKING", description: "FORWARD_LOOKING | CHRONOLOGICAL; selects the tuition charge algorithm" }
      - { name: line_items, type: array, source: computed, description: "Array of {enrollment_id, student_id, basis_cents, prorated_cents, discount_pct, line_total_cents}; one per billable enrollment" }
      - { name: subtotal_cents, type: integer, source: computed, description: "Sum of line_items[].prorated_cents (pre-discount)" }
      - { name: discount_cents, type: integer, source: computed, description: "Sum of per-line discount amounts" }
      - { name: total_cents, type: integer, source: computed, description: "subtotal_cents - discount_cents; sum of line_items[].line_total_cents" }
      - { name: due_at, type: datetime, source: input, description: "Payment due instant; PAST_DUE when current_utc >= due_at and still ISSUED" }
      - { name: status, type: enum, source: system, default: "DRAFT", description: "DRAFT | ISSUED | PAID | VOID" }

  - name: MakeupCredit
    parent: null
    common_fields: true
    fields:
      - { name: student_id, type: string, source: system, description: "FK -> Student.id; credit owner" }
      - { name: origin_enrollment_id, type: string, source: system, description: "FK -> Enrollment.id; the enrollment whose skip/absence/disruption generated this credit" }
      - { name: reason, type: enum, source: system, description: "SKIP | ABSENCE | LEVEL_TRANSFER_DISRUPTION" }
      - { name: issued_at, type: datetime, source: system, description: "Logical-clock instant of issue" }
      - { name: expires_at, type: datetime, source: system, description: "issued_at + MAKEUP_CREDIT_VALIDITY_DAYS days; EXPIRED when current_utc >= expires_at" }
      - { name: status, type: enum, source: system, default: "ISSUED", description: "ISSUED | REDEEMED | EXPIRED; ISSUED<->REDEEMED is a cycle (cancel restores)" }

  - name: MakeupBooking
    parent: null
    common_fields: true
    fields:
      - { name: makeup_credit_id, type: string, source: input, description: "FK -> MakeupCredit.id; the credit being spent" }
      - { name: student_id, type: string, source: system, description: "FK -> Student.id; copied from the credit" }
      - { name: target_class_session_id, type: string, source: input, description: "FK -> ClassSession.id; the session whose occurrence is attended once" }
      - { name: occurrence_date, type: datetime, source: input, description: "Calendar date (UTC midnight) of the specific occurrence being attended" }
      - { name: occurrence_start_minute, type: integer, source: computed, description: "Copied from target session start_minute; used for same-day overlap math" }
      - { name: occurrence_end_minute, type: integer, source: computed, description: "Copied from target session end_minute" }
      - { name: status, type: enum, source: system, default: "BOOKED", description: "BOOKED | ATTENDED | CANCELLED | NO_SHOW" }

  - name: Assessment
    parent: null
    common_fields: true
    fields:
      - { name: enrollment_id, type: string, source: input, description: "FK -> Enrollment.id; the active enrollment whose progress is graded" }
      - { name: student_id, type: string, source: system, description: "FK -> Student.id; copied from the enrollment" }
      - { name: assessed_level_id, type: string, source: system, description: "FK -> Level.id; the student's current_level_id at submission" }
      - { name: skill_scores, type: array, source: input, description: "Array of {skill_id, score} with score in [0,1]; one entry per Skill of the assessed level" }
      - { name: mastered_count, type: integer, source: computed, description: "Count of skill_scores with score >= MASTERY_SCORE" }
      - { name: weighted_score, type: number, source: computed, description: "Weighted average of scores by Skill.weight; the holistic readiness number" }
      - { name: strict_ready, type: boolean, source: computed, description: "True iff mastered_count == total skills of assessed level (strict variant)" }
      - { name: holistic_ready, type: boolean, source: computed, description: "True iff weighted_score >= Level.readiness_threshold (holistic variant)" }
      - { name: status, type: enum, source: system, default: "DRAFT", description: "DRAFT | SUBMITTED | APPROVED | REJECTED" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: ClassSession
    field: status
    initial_state: DRAFT
    terminal_states: [CLOSED]
    transitions:
      - from: DRAFT
        to: OPEN
        trigger: "POST /class-sessions/{id}/open"
        actor: SchoolAdmin
        preconditions:
          - "instructor_id is ACTIVE and level_id is in instructor.certified_level_ids (ERR_INSTRUCTOR_NOT_CERTIFIED)"
          - "No instructor schedule overlap with another OPEN session of the same instructor on the same day_of_week within TRANSITION_BUFFER_MINUTES (ERR_INSTRUCTOR_SCHEDULE_CONFLICT)"
          - "No other OPEN/DRAFT session shares (location_id, day_of_week, lane_number) with overlapping time (ERR_LANE_CONFLICT)"
        side_effects:
          - "Enrollment creation against this session becomes permitted"
      - from: OPEN
        to: CLOSED
        trigger: "POST /class-sessions/{id}/close"
        actor: SchoolAdmin
        preconditions: []
        side_effects:
          - "All Enrollments in {ACTIVE, PAUSED, WAITLISTED} for this session -> WITHDRAWN (cascade down; each WITHDRAWN runs its own seat/credit side effects)"
          - "enrolled_count and waitlist_count recomputed to 0"

  - entity: Student
    field: status
    initial_state: ACTIVE
    terminal_states: [WITHDRAWN]
    transitions:
      - from: ACTIVE
        to: WITHDRAWN
        trigger: "POST /students/{id}/withdraw"
        actor: Parent
        preconditions:
          - "Acting Parent owns the Student (ERR_NOT_RESOURCE_OWNER)"
        side_effects:
          - "CASCADE L1: every Enrollment of this student in {ACTIVE, PAUSED, WAITLISTED} -> WITHDRAWN"
          - "CASCADE L2 (caused by each ACTIVE->WITHDRAWN): the session's enrolled_count is decremented, freeing a seat"
          - "CASCADE L3 (caused by the freed seat): the earliest-joined WAITLISTED Enrollment in that session (order by joined_at ASC, tie-break created_at ASC) is promoted to ACTIVE, which re-increments enrolled_count and debits the promoted parent's outstanding_balance_cents via a fresh prorated charge basis"

  - entity: Enrollment
    field: status
    initial_state: WAITLISTED
    terminal_states: [WITHDRAWN]
    transitions:
      - from: WAITLISTED
        to: ACTIVE
        trigger: "POST /enrollments (create with a free seat) OR system promotion on a freed seat"
        actor: Parent | system
        preconditions:
          - "Parent.account_standing == CURRENT for client-initiated activation (ERR_ACCOUNT_PAST_DUE)"
          - "Student.age_months in [Level.min_age_months, Level.max_age_months) (ERR_AGE_OUT_OF_RANGE)"
          - "enrolled_count < capacity at activation time (ERR_SESSION_FULL)"
        side_effects:
          - "enrolled_count incremented; ClassSession.version incremented by 1"
          - "joined_at set to current_utc; is_prorated_first_cycle computed"
      - from: ACTIVE
        to: PAUSED
        trigger: "POST /enrollments/{id}/pause"
        actor: Parent
        preconditions:
          - "Acting Parent owns the Student of this enrollment (ERR_NOT_RESOURCE_OWNER)"
        side_effects:
          - "enrolled_count decremented; ClassSession.version incremented by 1"
          - "A MakeupCredit (reason=SKIP) is issued to the student for the paused interval"
          - "Freed seat triggers promotion of the earliest WAITLISTED enrollment to ACTIVE (cascade)"
      - from: PAUSED
        to: ACTIVE
        trigger: "POST /enrollments/{id}/resume"
        actor: Parent
        preconditions:
          - "Acting Parent owns the Student (ERR_NOT_RESOURCE_OWNER)"
          - "Student.age_months in [Level.min_age_months, Level.max_age_months) (ERR_AGE_OUT_OF_RANGE)"
          - "enrolled_count < capacity (ERR_SESSION_FULL)"
        side_effects:
          - "enrolled_count incremented; ClassSession.version incremented by 1"
      - from: [WAITLISTED, ACTIVE, PAUSED]
        to: WITHDRAWN
        trigger: "POST /enrollments/{id}/withdraw OR cascade from Student.withdraw / ClassSession.close / Assessment.approve transfer"
        actor: Parent | system
        preconditions:
          - "Acting Parent owns the Student for client-initiated withdraw (ERR_NOT_RESOURCE_OWNER)"
        side_effects:
          - "If prior status was ACTIVE: enrolled_count decremented and the freed seat promotes the earliest WAITLISTED enrollment (cascade)"
          - "If prior status was WAITLISTED: waitlist_count decremented"
          - "ClassSession.version incremented by 1"

  - entity: Assessment
    field: status
    initial_state: DRAFT
    terminal_states: [APPROVED, REJECTED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /assessments/{id}/submit"
        actor: Instructor
        preconditions:
          - "Acting Instructor is the instructor_id of the enrollment's ClassSession (ERR_NOT_RESOURCE_OWNER)"
          - "The Enrollment is in {ACTIVE} (ERR_ENROLLMENT_NOT_ACTIVE)"
          - "skill_scores covers exactly the Skill set of the assessed level (ERR_SKILL_SET_MISMATCH)"
        side_effects:
          - "mastered_count, weighted_score, strict_ready, holistic_ready computed and frozen"
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /assessments/{id}/approve"
        actor: SchoolAdmin
        preconditions:
          - "strict_ready == true (ERR_NOT_READY_TO_ADVANCE)"
          - "assessed_level_id has a non-null next_level_id (ERR_NO_NEXT_LEVEL)"
        side_effects:
          - "BRANCH-APPROVE / CASCADE L1: Student.current_level_id set to assessed level's next_level_id"
          - "CASCADE L2 (caused by the level change): every ACTIVE/PAUSED Enrollment of the student whose ClassSession.level_id != new current_level_id -> WITHDRAWN, and a MakeupCredit (reason=LEVEL_TRANSFER_DISRUPTION) is issued for each"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /assessments/{id}/reject"
        actor: SchoolAdmin
        preconditions: []
        side_effects:
          - "BRANCH-REJECT: no level change; no enrollment mutation; Student remains at assessed_level_id"

  - entity: MakeupCredit
    field: status
    initial_state: ISSUED
    terminal_states: [EXPIRED]
    transitions:
      - from: ISSUED
        to: REDEEMED
        trigger: "POST /makeup-bookings (create a booking that spends this credit)"
        actor: Parent
        preconditions:
          - "current_utc < expires_at (ERR_CREDIT_EXPIRED)"
          - "credit.status == ISSUED (ERR_CREDIT_NOT_REDEEMABLE)"
        side_effects:
          - "A MakeupBooking (status=BOOKED) is created bound to this credit"
      - from: REDEEMED
        to: ISSUED
        trigger: "POST /makeup-bookings/{id}/cancel"
        actor: Parent
        preconditions:
          - "current_utc < expires_at (ERR_CREDIT_EXPIRED) — an expired credit cannot be restored"
        side_effects:
          - "The bound MakeupBooking -> CANCELLED; credit returns to ISSUED with no balance drift (compensating invariant)"
      - from: ISSUED
        to: EXPIRED
        trigger: "POST /_clock/set_current_utc advancing to/after expires_at (system, evaluated on read/redeem attempt)"
        actor: system
        preconditions:
          - "current_utc >= expires_at"
        side_effects:
          - "Credit becomes non-redeemable"

  - entity: MakeupBooking
    field: status
    initial_state: BOOKED
    terminal_states: [ATTENDED, CANCELLED, NO_SHOW]
    transitions:
      - from: BOOKED
        to: ATTENDED
        trigger: "POST /makeup-bookings/{id}/mark-attended"
        actor: Instructor
        preconditions:
          - "Acting Instructor is the instructor_id of target_class_session_id (ERR_NOT_RESOURCE_OWNER)"
        side_effects:
          - "Bound MakeupCredit -> REDEEMED is final (terminal redemption); no further cancel restores it"
      - from: BOOKED
        to: CANCELLED
        trigger: "POST /makeup-bookings/{id}/cancel"
        actor: Parent
        preconditions:
          - "Acting Parent owns the Student (ERR_NOT_RESOURCE_OWNER)"
        side_effects:
          - "Bound MakeupCredit -> ISSUED (restored); credit conservation holds"
      - from: BOOKED
        to: NO_SHOW
        trigger: "POST /makeup-bookings/{id}/mark-no-show"
        actor: Instructor
        preconditions:
          - "Acting Instructor is the instructor_id of target_class_session_id (ERR_NOT_RESOURCE_OWNER)"
        side_effects:
          - "Bound MakeupCredit -> REDEEMED is final; the makeup chance is consumed"

  - entity: Invoice
    field: status
    initial_state: DRAFT
    terminal_states: [PAID, VOID]
    transitions:
      - from: DRAFT
        to: ISSUED
        trigger: "POST /invoices/{id}/issue"
        actor: BillingAdmin
        preconditions:
          - "line_items is non-empty (ERR_EMPTY_INVOICE)"
        side_effects:
          - "Parent.outstanding_balance_cents incremented by total_cents (ledger sync)"
      - from: ISSUED
        to: PAID
        trigger: "POST /invoices/{id}/pay"
        actor: BillingAdmin
        preconditions:
          - "expected_invoice_version matches (ERR_STALE_VERSION)"
        side_effects:
          - "Parent.outstanding_balance_cents decremented by total_cents; Parent.account_standing recomputed (compensating invariant on balance)"
      - from: ISSUED
        to: VOID
        trigger: "POST /invoices/{id}/void"
        actor: BillingAdmin
        preconditions: []
        side_effects:
          - "Parent.outstanding_balance_cents decremented by total_cents; Parent.account_standing recomputed"

# =============================================================================
# §1.2.1 Concurrency Rules (true CREATE-with-supersede races; OCC on parent.version)
# =============================================================================
concurrency_rules:
  - rule_id: enroll-into-last-seat-stale-session
    parent_entity: ClassSession
    write_endpoint: "POST /enrollments"
    occ_field: "expected_class_session_version"
    description: |
      Creating an Enrollment that activates into a free seat of a ClassSession
      whose version has advanced since the client last observed it is rejected.
      A prior writer's enrollment legitimately took the last seat and bumped the
      session version; the current writer's view of capacity is therefore stale,
      so its activation must not silently overflow the seat quota.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: pay-invoice-stale-version
    parent_entity: Invoice
    write_endpoint: "POST /invoices/{id}/pay"
    occ_field: "expected_invoice_version"
    description: |
      Paying an Invoice whose version has advanced since the client last observed
      it is rejected. This captures the case where another writer has just voided
      or already settled the invoice (legitimately superseding the client's view),
      so the stale-version payment is refused rather than double-applied.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: session_capacity
    trigger: "ClassSession creation"
    algorithm: copy
    formula: |
      capacity = Level.max_students_per_instructor   # snapshotted at creation
    input_set: "the ClassSession's level_id Level row"
    precision: "integer"

  - name: enrolled_count_reconciliation
    trigger: "any Enrollment lifecycle transition touching ACTIVE membership"
    algorithm: aggregation
    formula: |
      enrolled_count = count(Enrollment e where e.class_session_id == session.id and e.status == ACTIVE)
      waitlist_count = count(Enrollment e where e.class_session_id == session.id and e.status == WAITLISTED)
    input_set: "Enrollments of the session filtered by status IN {ACTIVE} and {WAITLISTED}"
    precision: "integer"
    note: "Full recompute (not incremental) after each lifecycle change to avoid drift; ties N/A (count)."

  - name: monthly_tuition_charge
    trigger: "Invoice line-item generation (on POST /invoices for a parent+cycle)"
    algorithm: forward_looking
    formula: |
      An occurrence of an enrollment's ClassSession is a date D in [cycle_start, cycle_end)
      with D.weekday() == session.day_of_week (UTC). Let occurrences_total = count of such D.
      For each billable enrollment e of the parent (status IN {ACTIVE, PAUSED}):
        if e.joined_at > cycle_start:                       # joined mid-cycle -> prorate this cycle
            window_count = count of occurrences D with D >= floor_to_date(e.joined_at)
        elif variant == FORWARD_LOOKING:
            window_count = occurrences_total                # charge whole upcoming cycle
        elif variant == CHRONOLOGICAL:
            window_count = count of occurrences D with D < current_utc   # only delivered so far
        prorated_cents = ROUND_HALF_UP( e.tuition_basis_cents * window_count / occurrences_total )
    input_set: "Enrollments of parent in {ACTIVE, PAUSED}; occurrences computed from session day_of_week within cycle window"
    constants: {}
    precision: "cents, ROUND_HALF_UP, applied PER LINE before any summation (see proration_rounding_order)"
    variants:
      - name: forward_looking
        when: "regular monthly billing run; variant=FORWARD_LOOKING"
        difference: "charges all occurrences_total in the cycle regardless of how many have been delivered"
      - name: chronological
        when: "final true-up invoice on mid-cycle withdrawal; variant=CHRONOLOGICAL"
        difference: "charges only occurrences delivered before current_utc; same inputs yield a strictly smaller total mid-cycle"

  - name: sibling_discount
    trigger: "Invoice line-item generation, after per-line prorated_cents are known"
    algorithm: tiered_pricing
    formula: |
      students = distinct Student.id across the parent's billable enrollments (status IN {ACTIVE, PAUSED})
      n = count(students)
      if n <= 1:        discount_pct = 0.00
      elif n == 2:      discount_pct = DISCOUNT_2_PCT
      else:             discount_pct = DISCOUNT_3_PLUS_PCT
      # Full-price the student carrying the highest single-line prorated_cents; tie-break earliest Student.created_at.
      full_price_student = argmax over students of (max prorated_cents among that student's lines);
                           tie-break: smallest Student.created_at
      For each line L (belonging to student s):
        if s == full_price_student: line_discount_pct = 0.00
        else:                       line_discount_pct = discount_pct
        line_total_cents = ROUND_HALF_UP( L.prorated_cents * (1 - line_discount_pct) )
        line_discount_amount = L.prorated_cents - line_total_cents
    input_set: "all line_items of the invoice; >=3 inputs (student count, per-line prorated_cents, ranking)"
    constants:
      DISCOUNT_2_PCT: 0.10
      DISCOUNT_3_PLUS_PCT: 0.15
    precision: "cents, ROUND_HALF_UP per line"
    note: "Combinatorial mode (a): tiered selection + argmax exclusion + conditional per-line branch; never uses Student.id to break ties (uses created_at)."

  - name: proration_rounding_order
    trigger: "Invoice total assembly"
    algorithm: aggregation
    formula: |
      # PINNED ORDER: round EACH line to the cent first, THEN sum. Never sum raw then round once.
      subtotal_cents = SUM over lines of L.prorated_cents          # prorated_cents already ROUND_HALF_UP per line
      discount_cents = SUM over lines of L.line_discount_amount
      total_cents    = SUM over lines of L.line_total_cents        # each line_total already rounded per line
    input_set: "the invoice's line_items array"
    precision: "cents; round-per-line-then-sum is mandatory and produces results that can differ from sum-then-round by +/- 1 cent"
    note: "Combinatorial mode (b): the rounding order is the well-definedness pin; sum-then-round is explicitly forbidden."

  - name: level_up_readiness
    trigger: "Assessment submission (POST /assessments/{id}/submit)"
    algorithm: weighted_scoring
    formula: |
      total_skills   = count(Skill of assessed_level_id)
      mastered_count = count(skill_scores ss where ss.score >= MASTERY_SCORE)
      weighted_score = SUM(ss.score * skill.weight) / SUM(skill.weight)     # over assessed level's skills
      strict_ready   = (mastered_count == total_skills)                      # STRICT variant
      holistic_ready = (weighted_score >= Level.readiness_threshold)         # HOLISTIC variant
    input_set: "skill_scores entries for the assessed level's Skill set"
    constants:
      MASTERY_SCORE: 0.80
    precision: "weighted_score to 4 decimals, ROUND_HALF_UP; comparisons use the rounded value"
    variants:
      - name: strict
        when: "advancement approval gate (POST /assessments/{id}/approve requires strict_ready)"
        difference: "requires EVERY skill mastered; one sub-mastery skill blocks advancement even if weighted_score clears the threshold"
      - name: holistic
        when: "portal recommendation flag (holistic_ready surfaced to the parent portal)"
        difference: "passes on weighted average alone; can be true while strict_ready is false for the identical skill_scores"

  - name: makeup_credit_expiry
    trigger: "MakeupCredit issuance sets expires_at; redemption attempts evaluate it against the clock"
    algorithm: threshold
    formula: |
      expires_at = issued_at + MAKEUP_CREDIT_VALIDITY_DAYS days
      is_expired = (current_utc >= expires_at)          # boundary: at the exact instant it is EXPIRED
    input_set: "the single MakeupCredit row vs the logical clock"
    constants:
      MAKEUP_CREDIT_VALIDITY_DAYS: 60
    precision: "instant comparison; >= is exact"

  - name: instructor_schedule_overlap
    trigger: "ClassSession open (POST /class-sessions/{id}/open)"
    algorithm: interval_merge
    formula: |
      For each OTHER session s2 (status IN {OPEN}) with s2.instructor_id == s.instructor_id and s2.day_of_week == s.day_of_week:
        conflict if s.start_minute < s2.end_minute + TRANSITION_BUFFER_MINUTES
               and s2.start_minute < s.end_minute + TRANSITION_BUFFER_MINUTES
    input_set: "OPEN sessions sharing instructor and weekday"
    constants:
      TRANSITION_BUFFER_MINUTES: 15
    precision: "closed interval inflated by a symmetric 15-minute buffer on BOTH sides"
    note: "Resource overlap semantics A: closed interval + buffer on the Instructor weekly calendar."

  - name: makeup_same_day_overlap
    trigger: "MakeupBooking creation (POST /makeup-bookings)"
    algorithm: interval_merge
    formula: |
      For each OTHER booking b2 (status IN {BOOKED, ATTENDED}) with b2.student_id == student_id
          and b2.occurrence_date == occurrence_date:
        conflict if occurrence_start_minute < b2.occurrence_end_minute
               and b2.occurrence_start_minute < occurrence_end_minute   # half-open [start,end), NO buffer
      Also: occurrence aggregate capacity — remaining = capacity - enrolled_count - count(BOOKED bookings on that date for the target session);
        reject if remaining <= 0.
    input_set: "the student's BOOKED/ATTENDED bookings on the same occurrence_date; plus target session occupancy on that date"
    constants: {}
    precision: "half-open interval, no buffer"
    note: "Resource overlap semantics B: half-open interval (no buffer) on the Student day calendar PLUS aggregate per-occurrence capacity — distinct geometry from instructor_schedule_overlap."

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present and well-formed"
    error_id: ERR_MISSING_AUTH_CONTEXT
    http_status: 401
    applies_to: "all"

  - priority: 2
    category: auth
    check: "Role is permitted for this operation per §1.7"
    error_id: ERR_INSUFFICIENT_PERMISSIONS
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: existence
    check: "All path/body resource ids exist, validated left-to-right"
    error_id: "ERR_LOCATION_NOT_FOUND / ERR_LEVEL_NOT_FOUND / ERR_SKILL_NOT_FOUND / ERR_INSTRUCTOR_NOT_FOUND / ERR_PARENT_NOT_FOUND / ERR_STUDENT_NOT_FOUND / ERR_CLASS_SESSION_NOT_FOUND / ERR_ENROLLMENT_NOT_FOUND / ERR_INVOICE_NOT_FOUND / ERR_MAKEUP_CREDIT_NOT_FOUND / ERR_MAKEUP_BOOKING_NOT_FOUND / ERR_ASSESSMENT_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with resource ids"

  - priority: 4
    category: business_referential
    check: "Body FKs reference resources of the correct type and (where required) consistent ownership (e.g., Assessment.enrollment's student belongs to the assessment's instructor's session)"
    error_id: ERR_REFERENCE_MISMATCH
    http_status: 422
    applies_to: "POST /enrollments, POST /assessments, POST /makeup-bookings, POST /class-sessions"

  - priority: 5
    category: existence
    check: "Required request fields present and correctly typed; enums valid"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all writes"

  - priority: 6
    category: state
    check: "Resource ownership: an entity_backed Parent/Instructor acts only on resources it owns"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "Parent/Instructor-owned mutations"

  - priority: 7
    category: state
    check: "Target resource is in a state from which the requested transition is legal"
    error_id: "ERR_INVALID_STATE / ERR_ENROLLMENT_NOT_ACTIVE / ERR_CREDIT_NOT_REDEEMABLE / ERR_ASSESSMENT_NOT_SUBMITTED"
    http_status: 409
    applies_to: "all transition endpoints"

  - priority: 8
    category: state
    check: "Cross-entity state precondition: ClassSession.status == OPEN for enrollment creation; Enrollment.status == ACTIVE for assessment submission"
    error_id: "ERR_SESSION_NOT_OPEN / ERR_ENROLLMENT_NOT_ACTIVE"
    http_status: 409
    applies_to: "POST /enrollments, POST /assessments/{id}/submit"

  - priority: 9
    category: business_safety
    check: "Age-based eligibility: Student.age_months in [Level.min_age_months, Level.max_age_months) for enrollment activation/resume; instructor certified for level on session open"
    error_id: "ERR_AGE_OUT_OF_RANGE / ERR_INSTRUCTOR_NOT_CERTIFIED"
    http_status: 422
    applies_to: "POST /enrollments, POST /enrollments/{id}/resume, POST /class-sessions/{id}/open"

  - priority: 10
    category: business_temporal
    check: "Temporal-overlap conflicts: instructor weekly schedule (closed+buffer) on session open; student same-day makeup overlap (half-open) on booking; lane uniqueness"
    error_id: "ERR_INSTRUCTOR_SCHEDULE_CONFLICT / ERR_MAKEUP_TIME_CONFLICT / ERR_LANE_CONFLICT"
    http_status: 409
    applies_to: "POST /class-sessions/{id}/open, POST /makeup-bookings"

  - priority: 11
    category: business_temporal
    check: "Makeup credit validity: current_utc < credit.expires_at and credit ISSUED"
    error_id: "ERR_CREDIT_EXPIRED / ERR_CREDIT_NOT_REDEEMABLE"
    http_status: 409
    applies_to: "POST /makeup-bookings"

  - priority: 12
    category: business_constraint
    check: "Capacity/quota: enrolled_count < capacity for ACTIVE activation; makeup occurrence has a spare seat"
    error_id: "ERR_SESSION_FULL / ERR_MAKEUP_OCCURRENCE_FULL"
    http_status: 409
    applies_to: "POST /enrollments, POST /enrollments/{id}/resume, POST /makeup-bookings"

  - priority: 13
    category: business_constraint
    check: "Advancement gating: strict_ready true and a next_level_id exists for approval"
    error_id: "ERR_NOT_READY_TO_ADVANCE / ERR_NO_NEXT_LEVEL"
    http_status: 409
    applies_to: "POST /assessments/{id}/approve"

  - priority: 14
    category: business_fiscal
    check: "Account standing: Parent.account_standing == CURRENT for client-initiated enrollment activation; invoice non-empty for issue"
    error_id: "ERR_ACCOUNT_PAST_DUE / ERR_EMPTY_INVOICE"
    http_status: 402
    applies_to: "POST /enrollments, POST /invoices/{id}/issue"

  - priority: 15
    category: business_constraint
    check: "OCC: expected_<parent>_version matches current parent version on guarded writes"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /enrollments, POST /invoices/{id}/pay"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---- Test-driving clock ----
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the logical clock. Server startup default is 2026-01-01T00:00:00Z; before any call here the clock reads exactly this default and never falls back to wall-clock. Drives billing cycles, age math, and credit expiry deterministically."
    roles: [SchoolAdmin, BillingAdmin]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: datetime }"
    side_effects: ["Sets logical current_utc; MakeupCredit expiry and account_standing are re-evaluated on next read/redeem"]

  # ---- Location ----
  - method: POST
    path: "/locations"
    description: "Create a Location"
    roles: [SchoolAdmin]
    code: 201
    input: [name, "timezone?"]
    output: Location
    side_effects: ["status=OPEN"]
  - method: GET
    path: "/locations"
    description: "List Locations"
    roles: [SchoolAdmin, BillingAdmin, Instructor, Parent]
    code: 200
    input: ["limit?", "offset?"]
    output: "Location[]"
    side_effects: []
  - method: GET
    path: "/locations/{id}"
    description: "Get a Location"
    roles: [SchoolAdmin, BillingAdmin, Instructor, Parent]
    code: 200
    input: []
    output: Location
    side_effects: []

  # ---- Level + Skill (curriculum) ----
  - method: POST
    path: "/levels"
    description: "Create a curriculum Level"
    roles: [SchoolAdmin]
    code: 201
    input: [name, sequence_order, "next_level_id?", min_age_months, max_age_months, max_students_per_instructor, monthly_tuition_cents, "readiness_threshold?"]
    output: Level
    side_effects: []
  - method: GET
    path: "/levels"
    description: "List Levels (filterable)"
    roles: [SchoolAdmin, BillingAdmin, Instructor, Parent]
    code: 200
    input: ["next_level_id?", "limit?", "offset?"]
    output: "Level[]"
    side_effects: []
  - method: GET
    path: "/levels/{id}"
    description: "Get a Level"
    roles: [SchoolAdmin, BillingAdmin, Instructor, Parent]
    code: 200
    input: []
    output: Level
    side_effects: []
  - method: POST
    path: "/levels/{id}/skills"
    description: "Add a Skill to a Level"
    roles: [SchoolAdmin]
    code: 201
    input: [name, "weight?"]
    output: Skill
    side_effects: []
  - method: GET
    path: "/levels/{id}/skills"
    description: "List Skills of a Level (sub-resource reverse lookup for Skill.level_id)"
    roles: [SchoolAdmin, BillingAdmin, Instructor, Parent]
    code: 200
    input: ["limit?", "offset?"]
    output: "Skill[]"
    side_effects: []

  # ---- Instructor ----
  - method: POST
    path: "/instructors"
    description: "Create an Instructor"
    roles: [SchoolAdmin]
    code: 201
    input: [full_name, "certified_level_ids?"]
    output: Instructor
    side_effects: ["status=ACTIVE"]
  - method: GET
    path: "/instructors"
    description: "List Instructors"
    roles: [SchoolAdmin, BillingAdmin, Instructor, Parent]
    code: 200
    input: ["limit?", "offset?"]
    output: "Instructor[]"
    side_effects: []
  - method: GET
    path: "/instructors/{id}"
    description: "Get an Instructor"
    roles: [SchoolAdmin, BillingAdmin, Instructor, Parent]
    code: 200
    input: []
    output: Instructor
    side_effects: []

  # ---- Parent + Student ----
  - method: POST
    path: "/parents"
    description: "Register a Parent account"
    roles: [SchoolAdmin]
    code: 201
    input: [full_name, email]
    output: Parent
    side_effects: ["account_standing=CURRENT, outstanding_balance_cents=0"]
  - method: GET
    path: "/parents"
    description: "List Parents"
    roles: [SchoolAdmin, BillingAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: "Parent[]"
    side_effects: []
  - method: GET
    path: "/parents/{id}"
    description: "Get a Parent (portal account view; outstanding_balance_cents + account_standing recomputed)"
    roles: [SchoolAdmin, BillingAdmin, Parent]
    code: 200
    input: []
    output: Parent
    side_effects: []
  - method: POST
    path: "/parents/{id}/students"
    description: "Add a Student to a Parent account"
    roles: [SchoolAdmin, Parent]
    code: 201
    input: [full_name, birthdate, current_level_id]
    output: Student
    side_effects: ["status=ACTIVE, age_months computed against clock"]
  - method: GET
    path: "/parents/{id}/students"
    description: "List a Parent's Students (sub-resource reverse lookup for Student.parent_id)"
    roles: [SchoolAdmin, BillingAdmin, Parent]
    code: 200
    input: ["limit?", "offset?"]
    output: "Student[]"
    side_effects: []
  - method: GET
    path: "/students"
    description: "List Students (filterable; reverse lookup for Student.current_level_id)"
    roles: [SchoolAdmin, BillingAdmin]
    code: 200
    input: ["current_level_id?", "limit?", "offset?"]
    output: "Student[]"
    side_effects: []
  - method: GET
    path: "/students/{id}"
    description: "Get a Student (age_months recomputed against clock)"
    roles: [SchoolAdmin, BillingAdmin, Instructor, Parent]
    code: 200
    input: []
    output: Student
    side_effects: []
  - method: POST
    path: "/students/{id}/withdraw"
    description: "Withdraw a Student (cascade L1->L2->L3 across enrollments and waitlist promotion)"
    roles: [SchoolAdmin, Parent]
    code: 200
    input: []
    output: Student
    side_effects: ["Student->WITHDRAWN", "all enrollments->WITHDRAWN", "freed seats promote waitlisted enrollments", "promoted parents' outstanding balance affected"]

  # ---- ClassSession ----
  - method: POST
    path: "/class-sessions"
    description: "Create a ClassSession (capacity copied from level ratio)"
    roles: [SchoolAdmin]
    code: 201
    input: [location_id, level_id, instructor_id, lane_number, day_of_week, start_minute, end_minute]
    output: ClassSession
    side_effects: ["status=DRAFT, capacity=Level.max_students_per_instructor, enrolled_count=0, waitlist_count=0"]
  - method: GET
    path: "/class-sessions"
    description: "List ClassSessions (filterable; reverse lookup for location_id/level_id/instructor_id)"
    roles: [SchoolAdmin, BillingAdmin, Instructor, Parent]
    code: 200
    input: ["location_id?", "level_id?", "instructor_id?", "limit?", "offset?"]
    output: "ClassSession[]"
    side_effects: []
  - method: GET
    path: "/class-sessions/{id}"
    description: "Get a ClassSession (enrolled_count/waitlist_count reconciled)"
    roles: [SchoolAdmin, BillingAdmin, Instructor, Parent]
    code: 200
    input: []
    output: ClassSession
    side_effects: []
  - method: POST
    path: "/class-sessions/{id}/open"
    description: "Open a ClassSession for enrollment (instructor cert + schedule/lane overlap checks)"
    roles: [SchoolAdmin]
    code: 200
    input: []
    output: ClassSession
    side_effects: ["status->OPEN"]
  - method: POST
    path: "/class-sessions/{id}/close"
    description: "Close a ClassSession (cascade-withdraw all enrollments)"
    roles: [SchoolAdmin]
    code: 200
    input: []
    output: ClassSession
    side_effects: ["status->CLOSED", "all enrollments->WITHDRAWN", "counts->0"]

  # ---- Enrollment ----
  - method: POST
    path: "/enrollments"
    description: "Create a perpetual Enrollment; activates into a free seat (ACTIVE) else WAITLISTED. OCC on ClassSession.version."
    roles: [SchoolAdmin, Parent]
    code: 201
    input: [student_id, class_session_id, expected_class_session_version]
    output: Enrollment
    side_effects:
      - "Validation cascade: session OPEN, age range, account standing, capacity"
      - "If free seat and account CURRENT: status=ACTIVE, enrolled_count++ ; else status=WAITLISTED, waitlist_count++"
      - "tuition_basis_cents snapshotted; is_prorated_first_cycle computed"
      - "increments ClassSession.version by 1"
  - method: GET
    path: "/enrollments"
    description: "List Enrollments (filterable; reverse lookup for student_id/class_session_id)"
    roles: [SchoolAdmin, BillingAdmin, Instructor, Parent]
    code: 200
    input: ["student_id?", "class_session_id?", "status?", "limit?", "offset?"]
    output: "Enrollment[]"
    side_effects: []
  - method: GET
    path: "/enrollments/{id}"
    description: "Get an Enrollment"
    roles: [SchoolAdmin, BillingAdmin, Instructor, Parent]
    code: 200
    input: []
    output: Enrollment
    side_effects: []
  - method: POST
    path: "/enrollments/{id}/pause"
    description: "Pause a perpetual Enrollment (ACTIVE->PAUSED); frees seat, issues SKIP credit, promotes waitlist"
    roles: [SchoolAdmin, Parent]
    code: 200
    input: []
    output: Enrollment
    side_effects: ["status->PAUSED", "enrolled_count--", "MakeupCredit(reason=SKIP) issued", "waitlist promotion cascade", "ClassSession.version++"]
  - method: POST
    path: "/enrollments/{id}/resume"
    description: "Resume a paused Enrollment (PAUSED->ACTIVE); re-checks age + capacity"
    roles: [SchoolAdmin, Parent]
    code: 200
    input: []
    output: Enrollment
    side_effects: ["status->ACTIVE", "enrolled_count++", "ClassSession.version++"]
  - method: POST
    path: "/enrollments/{id}/withdraw"
    description: "Withdraw a single Enrollment; if ACTIVE, freed seat promotes waitlist"
    roles: [SchoolAdmin, Parent]
    code: 200
    input: []
    output: Enrollment
    side_effects: ["status->WITHDRAWN", "counts reconciled", "waitlist promotion if seat freed", "ClassSession.version++"]

  # ---- Invoice (monthly billing) ----
  - method: POST
    path: "/invoices"
    description: "Generate a DRAFT Invoice for a parent + billing cycle; computes line_items, proration, sibling discount, totals"
    roles: [BillingAdmin]
    code: 201
    input: [parent_id, cycle_start, cycle_end, due_at, "variant?"]
    output: Invoice
    side_effects: ["status=DRAFT", "line_items + subtotal/discount/total computed via monthly_tuition_charge + sibling_discount + proration_rounding_order"]
  - method: GET
    path: "/invoices"
    description: "List Invoices (filterable; reverse lookup for parent_id)"
    roles: [SchoolAdmin, BillingAdmin, Parent]
    code: 200
    input: ["parent_id?", "status?", "limit?", "offset?"]
    output: "Invoice[]"
    side_effects: []
  - method: GET
    path: "/invoices/{id}"
    description: "Get an Invoice (portal billing detail)"
    roles: [SchoolAdmin, BillingAdmin, Parent]
    code: 200
    input: []
    output: Invoice
    side_effects: []
  - method: POST
    path: "/invoices/{id}/issue"
    description: "Issue a DRAFT invoice (DRAFT->ISSUED); adds total to parent outstanding balance"
    roles: [BillingAdmin]
    code: 200
    input: []
    output: Invoice
    side_effects: ["status->ISSUED", "Parent.outstanding_balance_cents += total_cents"]
  - method: POST
    path: "/invoices/{id}/pay"
    description: "Mark an ISSUED invoice PAID (OCC on Invoice.version)"
    roles: [BillingAdmin]
    code: 200
    input: [expected_invoice_version]
    output: Invoice
    side_effects: ["status->PAID", "Parent.outstanding_balance_cents -= total_cents", "account_standing recomputed", "Invoice.version++"]
  - method: POST
    path: "/invoices/{id}/void"
    description: "Void an ISSUED invoice (ISSUED->VOID); reverses balance"
    roles: [BillingAdmin]
    code: 200
    input: []
    output: Invoice
    side_effects: ["status->VOID", "Parent.outstanding_balance_cents -= total_cents", "account_standing recomputed", "Invoice.version++"]

  # ---- MakeupCredit ----
  - method: GET
    path: "/makeup-credits"
    description: "List MakeupCredits (filterable; reverse lookup for student_id/origin_enrollment_id)"
    roles: [SchoolAdmin, BillingAdmin, Instructor, Parent]
    code: 200
    input: ["student_id?", "origin_enrollment_id?", "status?", "limit?", "offset?"]
    output: "MakeupCredit[]"
    side_effects: []
  - method: GET
    path: "/makeup-credits/{id}"
    description: "Get a MakeupCredit (expiry re-evaluated against clock)"
    roles: [SchoolAdmin, BillingAdmin, Instructor, Parent]
    code: 200
    input: []
    output: MakeupCredit
    side_effects: []

  # ---- MakeupBooking ----
  - method: POST
    path: "/makeup-bookings"
    description: "Redeem a MakeupCredit by booking a specific session occurrence; checks expiry, same-day overlap, occurrence capacity"
    roles: [SchoolAdmin, Parent]
    code: 201
    input: [makeup_credit_id, target_class_session_id, occurrence_date]
    output: MakeupBooking
    side_effects: ["status=BOOKED", "MakeupCredit->REDEEMED", "occurrence_start_minute/end_minute copied from target session"]
  - method: GET
    path: "/makeup-bookings"
    description: "List MakeupBookings (filterable; reverse lookup for makeup_credit_id/student_id/target_class_session_id)"
    roles: [SchoolAdmin, BillingAdmin, Instructor, Parent]
    code: 200
    input: ["makeup_credit_id?", "student_id?", "target_class_session_id?", "status?", "limit?", "offset?"]
    output: "MakeupBooking[]"
    side_effects: []
  - method: GET
    path: "/makeup-bookings/{id}"
    description: "Get a MakeupBooking"
    roles: [SchoolAdmin, BillingAdmin, Instructor, Parent]
    code: 200
    input: []
    output: MakeupBooking
    side_effects: []
  - method: POST
    path: "/makeup-bookings/{id}/cancel"
    description: "Cancel a BOOKED makeup booking; restores its credit to ISSUED (compensating)"
    roles: [SchoolAdmin, Parent]
    code: 200
    input: []
    output: MakeupBooking
    side_effects: ["status->CANCELLED", "MakeupCredit->ISSUED (restored, no drift)"]
  - method: POST
    path: "/makeup-bookings/{id}/mark-attended"
    description: "Instructor marks a booking attended (BOOKED->ATTENDED); redemption becomes final"
    roles: [Instructor]
    code: 200
    input: []
    output: MakeupBooking
    side_effects: ["status->ATTENDED", "MakeupCredit redemption final"]
  - method: POST
    path: "/makeup-bookings/{id}/mark-no-show"
    description: "Instructor marks a booking no-show (BOOKED->NO_SHOW); credit consumed"
    roles: [Instructor]
    code: 200
    input: []
    output: MakeupBooking
    side_effects: ["status->NO_SHOW", "MakeupCredit redemption final"]

  # ---- Assessment ----
  - method: POST
    path: "/assessments"
    description: "Create a DRAFT Assessment against an ACTIVE enrollment"
    roles: [Instructor]
    code: 201
    input: [enrollment_id, skill_scores]
    output: Assessment
    side_effects: ["status=DRAFT", "student_id/assessed_level_id copied from enrollment"]
  - method: GET
    path: "/assessments"
    description: "List Assessments (filterable; reverse lookup for enrollment_id/student_id/assessed_level_id)"
    roles: [SchoolAdmin, BillingAdmin, Instructor, Parent]
    code: 200
    input: ["enrollment_id?", "student_id?", "assessed_level_id?", "status?", "limit?", "offset?"]
    output: "Assessment[]"
    side_effects: []
  - method: GET
    path: "/assessments/{id}"
    description: "Get an Assessment (portal progress view)"
    roles: [SchoolAdmin, BillingAdmin, Instructor, Parent]
    code: 200
    input: []
    output: Assessment
    side_effects: []
  - method: POST
    path: "/assessments/{id}/submit"
    description: "Submit a DRAFT assessment (DRAFT->SUBMITTED); freezes readiness scores"
    roles: [Instructor]
    code: 200
    input: []
    output: Assessment
    side_effects: ["status->SUBMITTED", "mastered_count/weighted_score/strict_ready/holistic_ready computed"]
  - method: POST
    path: "/assessments/{id}/approve"
    description: "Approve advancement (SUBMITTED->APPROVED); advances student level + cascade transfer"
    roles: [SchoolAdmin]
    code: 200
    input: []
    output: Assessment
    side_effects: ["status->APPROVED", "Student.current_level_id->next_level_id", "level-mismatched enrollments WITHDRAWN + LEVEL_TRANSFER_DISRUPTION credits issued"]
  - method: POST
    path: "/assessments/{id}/reject"
    description: "Reject advancement (SUBMITTED->REJECTED); no level change"
    roles: [SchoolAdmin]
    code: 200
    input: []
    output: Assessment
    side_effects: ["status->REJECTED"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  # --- auth ---
  - { id: ERR_MISSING_AUTH_CONTEXT, http: 401, condition: "X-User-ID or X-User-Role header missing or malformed" }
  - { id: ERR_INSUFFICIENT_PERMISSIONS, http: 403, condition: "Role not permitted for this operation" }
  - { id: ERR_NOT_RESOURCE_OWNER, http: 403, condition: "Entity-backed Parent/Instructor acting on a resource it does not own" }
  # --- existence / request ---
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field, bad type, or invalid enum value" }
  - { id: ERR_REFERENCE_MISMATCH, http: 422, condition: "A body FK points to the wrong entity type or an inconsistent owner" }
  - { id: ERR_LOCATION_NOT_FOUND, http: 404, condition: "Location id does not exist" }
  - { id: ERR_LEVEL_NOT_FOUND, http: 404, condition: "Level id does not exist" }
  - { id: ERR_SKILL_NOT_FOUND, http: 404, condition: "Skill id does not exist" }
  - { id: ERR_INSTRUCTOR_NOT_FOUND, http: 404, condition: "Instructor id does not exist" }
  - { id: ERR_PARENT_NOT_FOUND, http: 404, condition: "Parent id does not exist" }
  - { id: ERR_STUDENT_NOT_FOUND, http: 404, condition: "Student id does not exist" }
  - { id: ERR_CLASS_SESSION_NOT_FOUND, http: 404, condition: "ClassSession id does not exist" }
  - { id: ERR_ENROLLMENT_NOT_FOUND, http: 404, condition: "Enrollment id does not exist" }
  - { id: ERR_INVOICE_NOT_FOUND, http: 404, condition: "Invoice id does not exist" }
  - { id: ERR_MAKEUP_CREDIT_NOT_FOUND, http: 404, condition: "MakeupCredit id does not exist" }
  - { id: ERR_MAKEUP_BOOKING_NOT_FOUND, http: 404, condition: "MakeupBooking id does not exist" }
  - { id: ERR_ASSESSMENT_NOT_FOUND, http: 404, condition: "Assessment id does not exist" }
  # --- state ---
  - { id: ERR_INVALID_STATE, http: 409, condition: "Requested transition is not legal from the resource's current state" }
  - { id: ERR_SESSION_NOT_OPEN, http: 409, condition: "Enrollment creation requires ClassSession.status == OPEN" }
  - { id: ERR_ENROLLMENT_NOT_ACTIVE, http: 409, condition: "Assessment submission requires the Enrollment to be ACTIVE" }
  - { id: ERR_ASSESSMENT_NOT_SUBMITTED, http: 409, condition: "Approve/reject requires Assessment.status == SUBMITTED" }
  - { id: ERR_CREDIT_NOT_REDEEMABLE, http: 409, condition: "MakeupCredit is not in ISSUED status" }
  # --- business_safety ---
  - { id: ERR_AGE_OUT_OF_RANGE, http: 422, condition: "Student.age_months not within [Level.min_age_months, Level.max_age_months)" }
  - { id: ERR_INSTRUCTOR_NOT_CERTIFIED, http: 422, condition: "Instructor not certified for the session's level or instructor INACTIVE" }
  - { id: ERR_SKILL_SET_MISMATCH, http: 422, condition: "skill_scores do not exactly cover the assessed level's Skill set" }
  # --- business_temporal ---
  - { id: ERR_INSTRUCTOR_SCHEDULE_CONFLICT, http: 409, condition: "Opening the session collides with another OPEN session of the same instructor within the 15-minute buffer (closed interval)" }
  - { id: ERR_LANE_CONFLICT, http: 409, condition: "Lane already occupied at the same location/day/time window" }
  - { id: ERR_MAKEUP_TIME_CONFLICT, http: 409, condition: "Student already has a same-day makeup booking whose occurrence interval overlaps (half-open)" }
  - { id: ERR_CREDIT_EXPIRED, http: 409, condition: "current_utc >= MakeupCredit.expires_at at redemption/cancel" }
  # --- business_constraint / capacity ---
  - { id: ERR_SESSION_FULL, http: 409, condition: "enrolled_count >= capacity at activation (caller chose to require ACTIVE, not WAITLIST)" }
  - { id: ERR_MAKEUP_OCCURRENCE_FULL, http: 409, condition: "Target session occurrence has no spare seat for a makeup attendee" }
  - { id: ERR_NOT_READY_TO_ADVANCE, http: 409, condition: "Approval attempted while strict_ready == false" }
  - { id: ERR_NO_NEXT_LEVEL, http: 409, condition: "Assessed level has no next_level_id to advance into" }
  # --- business_fiscal ---
  - { id: ERR_ACCOUNT_PAST_DUE, http: 402, condition: "Client-initiated enrollment activation while Parent.account_standing == PAST_DUE" }
  - { id: ERR_EMPTY_INVOICE, http: 402, condition: "Issuing an invoice with no line_items" }
  # --- concurrency ---
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_<parent>_version does not match the current parent version (OCC)" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: SchoolAdmin
    description: "School operations: curriculum, locations, instructors, sessions, parent/student registry, assessment approval, withdrawals."
    identity: "opaque"
    exclusive_operations:
      - "POST /locations — create location"
      - "POST /levels — create level"
      - "POST /levels/{id}/skills — add skill"
      - "POST /instructors — create instructor"
      - "POST /parents — register parent"
      - "POST /class-sessions — create session"
      - "POST /class-sessions/{id}/open — open session"
      - "POST /class-sessions/{id}/close — close session"
      - "POST /assessments/{id}/approve — approve advancement"
      - "POST /assessments/{id}/reject — reject advancement"
      - "POST /_clock/set_current_utc — set clock (shared with BillingAdmin)"
    shared_operations:
      - "POST /parents/{id}/students — add student (shared with Parent)"
      - "POST /students/{id}/withdraw — withdraw student (shared with Parent)"
      - "POST /enrollments — create enrollment (shared with Parent)"
      - "POST /enrollments/{id}/pause|resume|withdraw — manage enrollment (shared with Parent)"
      - "POST /makeup-bookings — redeem credit (shared with Parent)"
      - "POST /makeup-bookings/{id}/cancel — cancel booking (shared with Parent)"
      - "GET endpoints across the system"

  - name: BillingAdmin
    description: "Billing operations: invoice generation, issue, pay, void; clock for billing runs."
    identity: "opaque"
    exclusive_operations:
      - "POST /invoices — generate invoice"
      - "POST /invoices/{id}/issue — issue invoice"
      - "POST /invoices/{id}/pay — pay invoice"
      - "POST /invoices/{id}/void — void invoice"
    shared_operations:
      - "POST /_clock/set_current_utc — set clock (shared with SchoolAdmin)"
      - "GET endpoints across the system"

  - name: Instructor
    description: "Frontline teacher: records assessments, marks makeup attendance."
    identity: "entity_backed:Instructor"
    exclusive_operations:
      - "POST /assessments — create assessment"
      - "POST /assessments/{id}/submit — submit assessment"
      - "POST /makeup-bookings/{id}/mark-attended — mark attended"
      - "POST /makeup-bookings/{id}/mark-no-show — mark no-show"
    shared_operations:
      - "GET endpoints across the system"

  - name: Parent
    description: "Account holder: manages students, perpetual enrollments, makeup bookings; portal reads of progress and billing."
    identity: "entity_backed:Parent"
    exclusive_operations: []
    shared_operations:
      - "POST /parents/{id}/students — add own student (shared with SchoolAdmin)"
      - "POST /students/{id}/withdraw — withdraw own student (shared with SchoolAdmin)"
      - "POST /enrollments — enroll own student (shared with SchoolAdmin)"
      - "POST /enrollments/{id}/pause|resume|withdraw — manage own enrollment (shared with SchoolAdmin)"
      - "POST /makeup-bookings — redeem own credit (shared with SchoolAdmin)"
      - "POST /makeup-bookings/{id}/cancel — cancel own booking (shared with SchoolAdmin)"
      - "GET endpoints (own resources + public catalog)"
