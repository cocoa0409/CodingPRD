# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Task 2979 — Rail Demurrage & Detention Billing Dispute
#
# Breadth probe. The nine `section:` values below are the nine sections of
# references/claim-extraction-guide.md, walked row by row against this
# scaffold's §1.1-§1.7 surface. `claim_type:` values are that guide's table
# rows, snake_cased; no category is invented.
#
# Conventions shared with §1.8:
#   * The logical clock starts at 2026-08-01T00:00:00Z on a cold database and
#     every chain sets it explicitly anyway.
#   * "Cycle A" is the reference INDUSTRY_TRACK chain used throughout:
#     constructive placement 2026-08-03T08:00:00Z (TRACK_FULL), EDI notice
#     2026-08-03T09:00:00Z, actual placement 2026-08-05T10:00:00Z, release
#     2026-08-10T16:00:00Z on a RAILROAD_OWNED car under the default tariff.
#     It resolves to clock_basis ACTUAL, clock_start_at
#     2026-08-05T10:00:00.000Z, free_time_expires_at 2026-08-07T23:59:59.999Z,
#     chargeable_days 3 and gross_amount_cents 47550.
#   * "Cycle B" is the same shape with constructive placement
#     2026-08-05T08:00:00Z, notice 09:00:00Z, actual placement
#     2026-08-07T12:00:00Z, release 2026-08-11T09:00:00Z: 1 chargeable day and
#     gross_amount_cents 12550.
#   * Every numeric and instant literal in an `assert:` was computed by
#     executing the matching §1.3 formula.
#   * Every failing trigger captures `$.data.error_id` so the expected error
#     envelope is part of the recipe rather than prose.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:

      - name: customer_create_returns_201_with_every_declared_field
        claim_type: creation
        grounds:
          - entities.Customer
          - endpoints.POST_/demurrage/customers
        distinguishing_aspect: |
          The create must echo all ten declared Customer fields plus the four
          common fields, not just the five input ones: a response missing
          credit_balance_cents or dispute_posture fails even though every
          input was accepted.
        test_recipe:
          setup:
            - "empty database, logical clock at 2026-08-01T00:00:00Z"
          setup_api_calls:
            - call: "POST /demurrage/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: BillingAdmin
          trigger:
            - call: "POST /demurrage/customers"
              payload: { customer_code: "C9E1-CUST", name: "Corner Creation Coal", serving_station_code: "STN30", notification_method: "EMAIL", normal_daily_placement_capacity: 4 }
              as: BillingAdmin
              captures: { cust_id: $.data.id }
          assert:
            - "201 with an envelope whose data carries id, created_at, updated_at and version"
            - "customer_code C9E1-CUST, name Corner Creation Coal, serving_station_code STN30"
            - "notification_method EMAIL and normal_daily_placement_capacity 4 as supplied"
            - "status ACTIVE, billing_posture CURRENT, credit_hold_reason null"
            - "credit_balance_cents 0, dispute_posture CLEAR, version 1"

      - name: rail_car_get_by_id_returns_the_stored_row
        claim_type: retrieval
        grounds:
          - entities.RailCar
          - endpoints.GET_/demurrage/rail-cars/{id}
        distinguishing_aspect: |
          The read-back must reproduce the create response byte for byte on
          every field including active_cycle_count, and must NOT bump version:
          a GET is not a write.
        test_recipe:
          setup:
            - "one RAILROAD_OWNED RailCar with car_type HOPPER and capacity_tons 110"
          setup_api_calls:
            - call: "POST /demurrage/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: BillingAdmin
            - call: "POST /demurrage/rail-cars"
              payload: { car_mark: "C9E2-HOPX01", ownership: "RAILROAD_OWNED", car_type: "HOPPER", capacity_tons: 110 }
              as: RailroadAgent
              captures: { car_id: $.data.id }
          trigger:
            - call: "GET /demurrage/rail-cars/${car_id}"
              payload: {}
              as: RailroadAgent
          assert:
            - "200 with car_mark C9E2-HOPX01, ownership RAILROAD_OWNED, car_type HOPPER, capacity_tons 110"
            - "active_cycle_count 0"
            - "version is still 1: the GET performed no write"
            - "id equals ${car_id}"

      - name: placement_cycles_list_returns_paginated_envelope_with_total_count
        claim_type: listing
        grounds:
          - endpoints.GET_/demurrage/placement-cycles
          - response_envelope
        distinguishing_aspect: |
          The list envelope must carry total_count 3 and has_more TRUE while
          returning only 2 rows under limit=2, and the filter must compose with
          pagination rather than being applied after the page is cut.
        test_recipe:
          setup:
            - "three ORDERED PlacementCycles for one customer on three different cars at one facility"
          setup_api_calls:
            - call: "POST /demurrage/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: BillingAdmin
            - call: "POST /demurrage/customers"
              payload: { customer_code: "C9E3-CUST", name: "Listing Lignite", serving_station_code: "STN31" }
              as: BillingAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /demurrage/facilities"
              payload: { facility_code: "C9E3-TRK", kind: "INDUSTRY_TRACK", gate_close_hour: 16, car_spot_capacity: 3, switch_buffer_minutes: 0 }
              as: BillingAdmin
              captures: { fac_id: $.data.id }
            - call: "POST /demurrage/tariff-rule-sets"
              payload: { tariff_code: "C9E3-6004", car_ownership_scope: "ANY" }
              as: RegulatoryOfficer
              captures: { tar_id: $.data.id }
            - call: "POST /demurrage/tariff-rule-sets/${tar_id}/publish"
              payload: {}
              as: RegulatoryOfficer
            - call: "POST /demurrage/rail-cars"
              payload: { car_mark: "C9E3-LGX01", ownership: "RAILROAD_OWNED" }
              as: RailroadAgent
              captures: { car1_id: $.data.id, car1_v: $.data.version }
            - call: "POST /demurrage/rail-cars"
              payload: { car_mark: "C9E3-LGX02", ownership: "RAILROAD_OWNED" }
              as: RailroadAgent
              captures: { car2_id: $.data.id, car2_v: $.data.version }
            - call: "POST /demurrage/rail-cars"
              payload: { car_mark: "C9E3-LGX03", ownership: "RAILROAD_OWNED" }
              as: RailroadAgent
              captures: { car3_id: $.data.id, car3_v: $.data.version }
            - call: "POST /demurrage/placement-cycles"
              payload: { customer_id: "${cust_id}", rail_car_id: "${car1_id}", facility_id: "${fac_id}", tariff_rule_set_id: "${tar_id}", waybill_number: "WB-C9E3-1", expected_rail_car_version: "${car1_v}" }
              as: RailroadAgent
            - call: "POST /demurrage/placement-cycles"
              payload: { customer_id: "${cust_id}", rail_car_id: "${car2_id}", facility_id: "${fac_id}", tariff_rule_set_id: "${tar_id}", waybill_number: "WB-C9E3-2", expected_rail_car_version: "${car2_v}" }
              as: RailroadAgent
            - call: "POST /demurrage/placement-cycles"
              payload: { customer_id: "${cust_id}", rail_car_id: "${car3_id}", facility_id: "${fac_id}", tariff_rule_set_id: "${tar_id}", waybill_number: "WB-C9E3-3", expected_rail_car_version: "${car3_v}" }
              as: RailroadAgent
          trigger:
            - call: "GET /demurrage/placement-cycles?customer_id=${cust_id}&movement_status=ORDERED&limit=2&offset=0"
              payload: {}
              as: BillingAdmin
              captures: { first_id: "$.data[0].id" }
            - call: "GET /demurrage/placement-cycles?customer_id=${cust_id}&movement_status=ORDERED&limit=2&offset=2"
              payload: {}
              as: BillingAdmin
              captures: { third_id: "$.data[0].id" }
          assert:
            - "page 1: 200, exactly 2 rows in data, meta.total_count 3, meta.has_more TRUE"
            - "page 2: 200, exactly 1 row in data, meta.total_count 3, meta.has_more FALSE"
            - "the three ids across both pages are distinct and total_count counts the filtered set, not the whole table"
            - "every returned row has movement_status ORDERED and customer_id ${cust_id}"

      - name: get_customer_unknown_id_returns_customer_not_found
        claim_type: not_found
        grounds:
          - validations.priority_30_path_existence
          - errors.ERR_CUSTOMER_NOT_FOUND
        distinguishing_aspect: |
          A well-formed but unknown UUID is 404 ERR_CUSTOMER_NOT_FOUND, not 400:
          existence (priority 30) sits above the schema band, so the id is not
          re-validated as a string first.
        test_recipe:
          setup:
            - "empty database"
          setup_api_calls: []
          trigger:
            - call: "GET /demurrage/customers/00000000-0000-4000-8000-0000000000c1"
              payload: {}
              as: BillingAdmin
              captures: { err: $.data.error_id }
          assert:
            - "404 with error_id ERR_CUSTOMER_NOT_FOUND"
            - "the envelope carries an error_id and a message and no data payload fields"

      - name: customer_create_missing_serving_station_code_returns_invalid_request
        claim_type: required_fields
        grounds:
          - validations.priority_34_schema
          - entities.Customer.fields.serving_station_code
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: |
          serving_station_code has source input and NO default, so omitting it
          is 400 ERR_INVALID_REQUEST — unlike notification_method, whose
          omission is legal and defaults to EDI.
        test_recipe:
          setup:
            - "empty database"
          setup_api_calls: []
          trigger:
            - call: "POST /demurrage/customers"
              payload: { customer_code: "C9E5-CUST", name: "Missing Field Marl" }
              as: BillingAdmin
              captures: { err: $.data.error_id }
          assert:
            - "400 with error_id ERR_INVALID_REQUEST"
            - "no Customer row was created: a follow-up list filtered on customer_code C9E5-CUST is empty"

      - name: tariff_rule_set_create_omitting_optionals_applies_declared_defaults
        claim_type: defaults
        grounds:
          - entities.TariffRuleSet
          - endpoints.POST_/demurrage/tariff-rule-sets
        distinguishing_aspect: |
          Fourteen of fifteen inputs are optional, so a one-field create must
          materialise the whole default rate ladder — 48/24 free hours, the
          2/3 tier day counts and all six cent rates — rather than leaving
          nulls that later crash the rating formula.
        test_recipe:
          setup:
            - "empty database"
          setup_api_calls: []
          trigger:
            - call: "POST /demurrage/tariff-rule-sets"
              payload: { tariff_code: "C9E6-6004" }
              as: RegulatoryOfficer
              captures: { tar_id: $.data.id }
          assert:
            - "201 with car_ownership_scope ANY, free_time_hours_railroad 48, free_time_hours_private 24"
            - "tier1_day_count 2, tier2_day_count 3"
            - "tier1_rate_cents_railroad 12550, tier2_rate_cents_railroad 22450, tier3_rate_cents_railroad 35050"
            - "tier1_rate_cents_private 8150, tier2_rate_cents_private 14950, tier3_rate_cents_private 24050"
            - "weekend_excluded FALSE, notification_grace_hours 4, adjudication_days_base 20"
            - "status DRAFT and challenge_count 0: a fresh rule set cannot yet back a cycle"

      - name: facility_create_omitting_optionals_applies_declared_defaults
        claim_type: defaults
        grounds:
          - entities.Facility
          - endpoints.POST_/demurrage/facilities
        distinguishing_aspect: |
          The facility defaults decide two later gates that have nothing to do
          with each other: gate_close_hour 16 decides whether a release day is
          charged, and switch_buffer_minutes 120 blocks placement for two hours
          after the spot empties. Both must be present on a one-field create.
        test_recipe:
          setup:
            - "empty database"
          setup_api_calls: []
          trigger:
            - call: "POST /demurrage/facilities"
              payload: { facility_code: "C9E7-TRK" }
              as: BillingAdmin
              captures: { fac_id: $.data.id }
          assert:
            - "201 with kind INDUSTRY_TRACK and storage_clock_mode CALENDAR_DAY_MIDNIGHT"
            - "gate_open_hour 7, gate_close_hour 16, car_spot_capacity 3, switch_buffer_minutes 120"
            - "storage_free_hours 48, storage_daily_rate_cents 9000, operates_weekends FALSE"
            - "access_mode OPEN, access_mode_reason null, occupied_spot_count 0, last_switch_at null"

      - name: placement_cycle_create_with_chargeable_days_in_body_input_ignored
        claim_type: computed_fields
        grounds:
          - entities.PlacementCycle.fields.chargeable_days
          - entities.PlacementCycle.fields.clock_basis
        distinguishing_aspect: |
          chargeable_days, clock_basis, free_days and free_time_expires_at are
          all source computed. A create that carries chargeable_days 99 must
          come back with 0 — the value is derived from placement instants that
          do not exist yet, so no supplied number can be honoured.
        test_recipe:
          setup:
            - "one customer, one facility, one PUBLISHED tariff and one RAILROAD_OWNED car"
          setup_api_calls:
            - call: "POST /demurrage/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: BillingAdmin
            - call: "POST /demurrage/customers"
              payload: { customer_code: "C9E8-CUST", name: "Computed Coke", serving_station_code: "STN32" }
              as: BillingAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /demurrage/facilities"
              payload: { facility_code: "C9E8-TRK", kind: "INDUSTRY_TRACK", gate_close_hour: 16, car_spot_capacity: 3, switch_buffer_minutes: 0 }
              as: BillingAdmin
              captures: { fac_id: $.data.id }
            - call: "POST /demurrage/tariff-rule-sets"
              payload: { tariff_code: "C9E8-6004", car_ownership_scope: "ANY" }
              as: RegulatoryOfficer
              captures: { tar_id: $.data.id }
            - call: "POST /demurrage/tariff-rule-sets/${tar_id}/publish"
              payload: {}
              as: RegulatoryOfficer
            - call: "POST /demurrage/rail-cars"
              payload: { car_mark: "C9E8-CKX01", ownership: "RAILROAD_OWNED" }
              as: RailroadAgent
              captures: { car_id: $.data.id, car_v: $.data.version }
          trigger:
            - call: "POST /demurrage/placement-cycles"
              payload: { customer_id: "${cust_id}", rail_car_id: "${car_id}", facility_id: "${fac_id}", tariff_rule_set_id: "${tar_id}", waybill_number: "WB-C9E8-1", expected_rail_car_version: "${car_v}", chargeable_days: 99, clock_basis: "ACTUAL" }
              as: RailroadAgent
              captures: { cyc_id: $.data.id }
          assert:
            - "the supplied computed fields are ignored, not echoed: chargeable_days 0 and clock_basis NONE"
            - "free_days 0, free_time_expires_at null, clock_start_at null, early_release_days 0"
            - "movement_status ORDERED and billing_status UNBILLED"
            - "a follow-up GET /demurrage/placement-cycles/${cyc_id} still reports chargeable_days 0"

      - name: customer_create_with_status_in_body_input_ignored
        claim_type: system_fields
        grounds:
          - entities.Customer.fields.status
          - entities.Customer.fields.billing_posture
        distinguishing_aspect: |
          status and billing_posture are source system, so a create that asks
          for status SUSPENDED and billing_posture CREDIT_HOLD must still land
          ACTIVE and CURRENT — otherwise a caller could self-impose a credit
          hold and dodge its own release gate at priority 70.
        test_recipe:
          setup:
            - "empty database"
          setup_api_calls: []
          trigger:
            - call: "POST /demurrage/customers"
              payload: { customer_code: "C9E9-CUST", name: "System Field Slag", serving_station_code: "STN33", status: "SUSPENDED", billing_posture: "CREDIT_HOLD", credit_balance_cents: 500000 }
              as: BillingAdmin
              captures: { cust_id: $.data.id }
          assert:
            - "201 with status ACTIVE, billing_posture CURRENT and credit_hold_reason null"
            - "credit_balance_cents 0, not 500000"
            - "id, created_at, updated_at and version are server-stamped and version is 1"

      - name: rail_car_create_with_unknown_ownership_enum_returns_invalid_request
        claim_type: type_constraints
        grounds:
          - validations.priority_34_schema
          - entities.RailCar.fields.ownership
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: |
          ownership admits exactly RAILROAD_OWNED, PRIVATE and PRIVATE_ASSIGNED.
          LEASED is rejected at the schema band rather than silently coerced to
          PRIVATE, which would quietly re-rate the car onto the private ladder.
        test_recipe:
          setup:
            - "empty database"
          setup_api_calls: []
          trigger:
            - call: "POST /demurrage/rail-cars"
              payload: { car_mark: "C9E10-LSX01", ownership: "LEASED" }
              as: RailroadAgent
              captures: { err: $.data.error_id }
          assert:
            - "400 with error_id ERR_INVALID_REQUEST"
            - "no RailCar row was created"

      - name: tariff_free_time_hours_not_a_multiple_of_24_returns_invalid_request
        claim_type: type_constraints
        grounds:
          - validations.priority_34_schema
          - entities.TariffRuleSet.fields.free_time_hours_railroad
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: |
          The constraint is not merely a range: 36 is inside 0-240 but is not a
          multiple of 24, and accepting it would make free_days a fraction and
          the expiry date undefined.
        test_recipe:
          setup:
            - "empty database"
          setup_api_calls: []
          trigger:
            - call: "POST /demurrage/tariff-rule-sets"
              payload: { tariff_code: "C9E11-6004", free_time_hours_railroad: 36 }
              as: RegulatoryOfficer
              captures: { err: $.data.error_id }
          assert:
            - "400 with error_id ERR_INVALID_REQUEST"
            - "the same create with free_time_hours_railroad 24 or 48 would be accepted: the divisor is the rule, not the range"

      - name: average_agreement_credit_cap_ratio_above_one_returns_invalid_request
        claim_type: type_constraints
        grounds:
          - validations.priority_34_schema
          - entities.AverageAgreement.fields.credit_cap_ratio
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: |
          credit_cap_ratio is bounded by 0 exclusive and 1 inclusive with at
          most two decimals, so 1.25 is refused. A ratio above 1 would let the
          cap exceed total_gross_cents and produce a negative net.
        test_recipe:
          setup:
            - "one customer"
          setup_api_calls:
            - call: "POST /demurrage/customers"
              payload: { customer_code: "C9E12-CUST", name: "Ratio Rubble", serving_station_code: "STN34" }
              as: BillingAdmin
              captures: { cust_id: $.data.id }
          trigger:
            - call: "POST /demurrage/average-agreements"
              payload: { customer_id: "${cust_id}", agreement_month: "2026-08", credit_cap_ratio: 1.25 }
              as: BillingAdmin
              captures: { err: $.data.error_id }
          assert:
            - "400 with error_id ERR_INVALID_REQUEST"
            - "credit_cap_ratio 1.00 is legal and 0.001 is not: the bound is 0 exclusive to 1 inclusive at two decimals"

      - name: car_notification_is_immutable_with_no_version_and_no_write_endpoint
        claim_type: immutability
        grounds:
          - entities.CarNotification
          - endpoints.GET_/demurrage/placement-cycles/{id}/notifications
        distinguishing_aspect: |
          CarNotification declares common_fields false, so its rows carry no
          version and §1.5 exposes no update or delete for them. The only
          mutation the domain allows is the acknowledge action, which flips
          delivery_status through its own endpoint rather than a generic PATCH.
        test_recipe:
          setup:
            - "Cycle A up to and including the EDI notice at 2026-08-03T09:00:00Z on an EDI customer"
          setup_api_calls:
            - call: "POST /demurrage/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: BillingAdmin
            - call: "POST /demurrage/customers"
              payload: { customer_code: "C9E13-CUST", name: "Immutable Iron", serving_station_code: "STN35", notification_method: "EDI" }
              as: BillingAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /demurrage/facilities"
              payload: { facility_code: "C9E13-TRK", kind: "INDUSTRY_TRACK", gate_close_hour: 16, car_spot_capacity: 3, switch_buffer_minutes: 0 }
              as: BillingAdmin
              captures: { fac_id: $.data.id }
            - call: "POST /demurrage/tariff-rule-sets"
              payload: { tariff_code: "C9E13-6004", car_ownership_scope: "ANY" }
              as: RegulatoryOfficer
              captures: { tar_id: $.data.id }
            - call: "POST /demurrage/tariff-rule-sets/${tar_id}/publish"
              payload: {}
              as: RegulatoryOfficer
            - call: "POST /demurrage/rail-cars"
              payload: { car_mark: "C9E13-IRX01", ownership: "RAILROAD_OWNED" }
              as: RailroadAgent
              captures: { car_id: $.data.id, car_v: $.data.version }
            - call: "POST /demurrage/placement-cycles"
              payload: { customer_id: "${cust_id}", rail_car_id: "${car_id}", facility_id: "${fac_id}", tariff_rule_set_id: "${tar_id}", waybill_number: "WB-C9E13-1", expected_rail_car_version: "${car_v}" }
              as: RailroadAgent
              captures: { cyc_id: $.data.id }
            - call: "POST /demurrage/placement-cycles/${cyc_id}/constructive-placement"
              payload: { constructive_placement_at: "2026-08-03T08:00:00Z", reason_code: "TRACK_FULL" }
              as: RailroadAgent
            - call: "POST /demurrage/placement-cycles/${cyc_id}/notify"
              payload: { channel: "EDI", sent_at: "2026-08-03T09:00:00Z" }
              as: RailroadAgent
              captures: { note_id: $.data.id }
          trigger:
            - call: "GET /demurrage/placement-cycles/${cyc_id}/notifications?limit=10&offset=0"
              payload: {}
              as: RailroadAgent
              captures: { listed_id: "$.data[0].id" }
          assert:
            - "the notification row carries id, placement_cycle_id, channel, sent_at, delivery_status, acknowledged_at and sequence_number and NO version field"
            - "sequence_number 1, delivery_status DELIVERED (channel EDI equals the customer's notification_method EDI)"
            - "acknowledged_at is null"
            - "§1.5 declares no PATCH, PUT or DELETE on /demurrage/placement-cycles/{id}/notifications: the row is append-only"
            - "${listed_id} equals ${note_id}: the create response and the list agree"

      - name: placement_cycle_create_with_unknown_facility_id_returns_facility_not_found
        claim_type: parent_relationships
        grounds:
          - validations.priority_32_body_existence
          - entities.PlacementCycle.fields.facility_id
          - errors.ERR_FACILITY_NOT_FOUND
        distinguishing_aspect: |
          The topology is flat, so every one of the four body foreign keys is
          checked independently at priority 32. An unknown facility_id is 404
          ERR_FACILITY_NOT_FOUND even though customer_id, rail_car_id and
          tariff_rule_set_id all resolve and the OCC token is current.
        test_recipe:
          setup:
            - "one customer, one PUBLISHED tariff and one car; NO facility with the id used in the trigger"
          setup_api_calls:
            - call: "POST /demurrage/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: BillingAdmin
            - call: "POST /demurrage/customers"
              payload: { customer_code: "C9E14-CUST", name: "Ghost Track Gypsum", serving_station_code: "STN36" }
              as: BillingAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /demurrage/tariff-rule-sets"
              payload: { tariff_code: "C9E14-6004", car_ownership_scope: "ANY" }
              as: RegulatoryOfficer
              captures: { tar_id: $.data.id }
            - call: "POST /demurrage/tariff-rule-sets/${tar_id}/publish"
              payload: {}
              as: RegulatoryOfficer
            - call: "POST /demurrage/rail-cars"
              payload: { car_mark: "C9E14-GYX01", ownership: "RAILROAD_OWNED" }
              as: RailroadAgent
              captures: { car_id: $.data.id, car_v: $.data.version }
