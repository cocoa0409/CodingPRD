              payload: {}
              as: OperationsAdmin
          assert:
            - "while FAILED Transformer.${tx_i9a}.committed_load_va == 0"
            - "after approve Fixture.${fx_i9a}.status == INSTALLED"
            - "after approve Transformer.${tx_i9a}.committed_load_va == 80 (restored to pre-claim value)"

      - name: customer_wallet_conserved_under_addon_activate_then_remove
        grounds:
          - state_machines.AddOnModule.PROPOSED_to_ACTIVE
          - state_machines.AddOnModule.ACTIVE_to_REMOVED
          - calculations.transformer_committed_load
          - entities.AddOnModule.fields.power_draw_va
        distinguishing_aspect: |
          Conserved quantity #2 = Transformer.committed_load_va contribution from add-ons (a different
          conserved quantity instance — add-on VA rather than fixture VA, and the forward/compensating
          pair is activate/remove rather than fail/replace). Activating a zone-powered add-on adds its
