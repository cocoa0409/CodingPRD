            - "data.net_contract_value_cents == 4500000."
            - "data.order_number == \"ORD-CORNER-E3\", data.engineering_status == \"ENG_OPEN\", data.fulfillment_status == \"PLANNING\"."

      - name: order_submittal_drawings_subresource_on_fresh_order_returns_empty_array
        claim_type: standard_crud
        grounds:
          - endpoints[list_order_submittal_drawings]
          - entities.SubmittalDrawing.fields.engineered_order_id
        distinguishing_aspect: "The FK reverse-reachability sub-resource must answer with a well-formed empty page for an order that has no drawings yet - 200 with data == [] and total_count == 0, never 404 on the (existing) parent."
        test_recipe:
          setup:
            - "One fresh order with zero SubmittalDrawing rows."
          setup_api_calls:
            - call: POST /_clock/set_current_utc
              payload: { current_utc: "2026-03-02T08:00:00Z" }
              as: PlantAdmin
            - call: POST /engineered-orders
              payload:
                order_number: "ORD-CORNER-E4"
                customer_name: "Riverbend Utility"
                product_family: "MV_SWITCHGEAR"
                rated_kv: 15
                contract_value_cents: 4000000
                sold_at: "2026-01-05T00:00:00Z"
                promised_ship_at: "2026-10-01T00:00:00Z"
                owning_sales_user_id: "u-sales-1"
              as: ContractAdmin
              captures: { order_id: "$.data.id" }
          trigger:
            - call: GET /engineered-orders/${order_id}/submittal-drawings
              payload: {}
              as: DesignEngineer
          assert:
            - "HTTP 200 with response_type == \"array\" and data == []."
            - "total_count == 0, has_more == false, limit == 10, offset == 0."

      - name: submittal_drawing_status_filter_excludes_non_matching_rows
        claim_type: standard_crud
        grounds:
          - endpoints[list_submittal_drawings]
          - entities.SubmittalDrawing.fields.status
        distinguishing_aspect: "Filtering the global drawing list by status must partition the rows: the SUBMITTED filter returns exactly the one submitted drawing while the DRAFT filter returns an empty page for the same order."
        test_recipe:
          setup:
            - "One order whose only drawing has been submitted (status SUBMITTED)."
          setup_api_calls:
            - call: POST /_clock/set_current_utc
              payload: { current_utc: "2026-03-02T08:00:00Z" }
              as: PlantAdmin
            - call: POST /engineered-orders
              payload:
                order_number: "ORD-CORNER-E5"
                customer_name: "Riverbend Utility"
                product_family: "MV_SWITCHGEAR"
                rated_kv: 15
                contract_value_cents: 4000000
                sold_at: "2026-01-05T00:00:00Z"
                promised_ship_at: "2026-10-01T00:00:00Z"
                owning_sales_user_id: "u-sales-1"
              as: ContractAdmin
              captures: { order_id: "$.data.id", order_version: "$.data.version" }
            - call: POST /engineered-orders/${order_id}/submittal-drawings
              payload: { drawing_set_code: "DS-100", authored_by_user_id: "u-design-1", expected_engineered_order_version: "${order_version}" }
              as: DesignEngineer
              captures: { drawing_id: "$.data.id" }
            - call: POST /submittal-drawings/${drawing_id}/submit
              payload: {}
              as: DesignEngineer
            - call: GET /submittal-drawings?engineered_order_id=${order_id}&status=DRAFT
              payload: {}
              as: DesignEngineer
          trigger:
            - call: GET /submittal-drawings?engineered_order_id=${order_id}&status=SUBMITTED
              payload: {}
              as: DesignEngineer
          assert:
            - "The DRAFT-filtered setup call returned HTTP 200 with data == [] and total_count == 0."
            - "The trigger returns HTTP 200 with total_count == 1 and data[0].id == ${drawing_id}."
            - "data[0].status == \"SUBMITTED\" and data[0].revision_round == 1."

      - name: submit_action_on_unknown_drawing_id_returns_drawing_not_found
        claim_type: action_endpoint
        grounds:
          - endpoints[submit_submittal_drawing]
          - validations[P8]
          - errors[ERR_DRAWING_NOT_FOUND]
        distinguishing_aspect: "Action endpoints resolve their path id before evaluating any transition rule, so an unknown drawing id yields ERR_DRAWING_NOT_FOUND (404) rather than a state error - and it must be a 404, not the 409 family."
        test_recipe:
