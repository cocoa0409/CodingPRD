            - "${station_offer_status} == \"SUBMITTED\" — the counter-offer did not disturb the station's offer"
            - "${e_occ} == \"ERR_STALE_NEGOTIATION_VERSION\" with HTTP 412, and no CarriageAgreement row was created by that call"
