          - "entities.DueDiligenceLetter.fields.applicable_due_date"
        distinguishing_aspect: "When the current date is past the computed due date, the applicable report year rolls forward: a letter sent 2026-12-01 for a 2026-03-16 dormancy targets due 2027-11-01 (window [2027-05-05, 2027-09-02]), so sending in 2026-12 fails and sending 2027-06-01 succeeds."
