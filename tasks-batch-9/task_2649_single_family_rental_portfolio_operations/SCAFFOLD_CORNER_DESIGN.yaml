            - "after trigger call 4: Home.${home_id}.leasing_posture == RESTRICTED"
            - "after trigger call 4: ShowingSlot.${slot_id}.status == AVAILABLE"
            - "after trigger call 4: ShowingSlot.${slot_id}.starts_at == 2026-08-20T15:00:00Z"

      - name: posture_cascade_skips_minor_obligations_and_booked_slots
        claim_type: conditional_cascade
