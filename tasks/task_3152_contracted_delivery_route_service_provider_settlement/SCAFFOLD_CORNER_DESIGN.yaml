    - calculations.gross_settlement_calculation
    - calculations.settlement_performance_multiplier
    excluded_because:
      difficulty_instance: settlement_exoneration_late_accrual_divergence
      rationale: Both the provisional reading and the reconcile reading of the same accrual window are asserted by the named §1.8 instance.
  - name: compromise_state_replayed_as_difficulty_instance
    claim_type: saga_compensation
    grounds:
    - state_machines.ChargebackClaim.FILED_to_REJECTED
