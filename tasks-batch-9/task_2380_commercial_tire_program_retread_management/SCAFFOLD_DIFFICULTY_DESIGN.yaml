              as: DealerAdmin
              captures: { fleet_id: $.data.id }
            - call: "POST /national-agreements"
              payload: { fleet_account_id: "${fleet_id}", agreement_code: "IRN-2026", effective_from: "2026-07-01", effective_to: "2026-12-31", tier_discount_pct: 0.125, casing_credit_rate_cents: 15000, emergency_response_minutes: 90, emergency_labor_rate_cents_per_hour: 13000 }
              as: DealerAdmin
              captures: { agr_id: $.data.id }
            - call: "POST /national-agreements/${agr_id}/activate"
              payload: {}
              as: DealerAdmin
            - call: "POST /fleet-accounts/${fleet_id}/tire-policies"
              payload: { position: "DRIVE", target_pressure_psi: 100, pressure_tolerance_pct: 0.10, min_tread_depth_32nds: 4, pull_point_32nds: 6, max_retread_count: 3, approved_brands: ["Bridgestone"], new_tire_tread_depth_32nds: 24, casing_spec_code: "ANY" }
              as: DealerAdmin
            - call: "POST /fleet-accounts/${fleet_id}/vehicles"
              payload: { unit_number: "T-81", vehicle_type: "TRACTOR", current_odometer_miles: 11000 }
              as: DealerAdmin
              captures: { veh1_id: $.data.id }
            - call: "POST /fleet-accounts/${fleet_id}/vehicles"
              payload: { unit_number: "T-82", vehicle_type: "TRACTOR", current_odometer_miles: 21000 }
              as: DealerAdmin
              captures: { veh2_id: $.data.id }
            - call: "POST /service-locations/${loc_id}/technicians"
              payload: { name: "Ada W", certification_level: "LEVEL_2" }
