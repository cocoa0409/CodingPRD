      - name: sweep_skips_not_yet_due_reservations_then_expires_at_the_inclusive_boundary
        claim_type: conditional_action
        grounds:
          - endpoints.POST_/programs/{id}/sweep
          - calculations.reservation_expiry_sweep
          - state_machines.Reservation.RESERVED_to_EXPIRED
        distinguishing_aspect: |
          The sweep is conditional on `expires_at <= clock_now`, and the
          comparison is INCLUSIVE. One minute before expiry the same call is a
          no-op that returns swept_reservation_count 0 with an empty
          expired_project_ids and leaves the reservation RESERVED; at exactly
          the expiry instant it expires the reservation and releases 800000.
