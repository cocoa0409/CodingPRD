      - name: private_event_confirm_requires_show_private_held
        grounds:
          - state_machines.PrivateEvent.HELD_to_CONFIRMED
          - state_machines.Show.PRIVATE_HELD_to_ON_SALE
          - entities.Show.fields.status
        distinguishing_aspect: "Entity pair (PrivateEvent, Show): HELD->CONFIRMED requires the underlying Show.status == PRIVATE_HELD; if the buyout was already cancelled (reverting the show to ON_SALE), confirm is rejected with ERR_INVALID_STATE — a different cross-entity pair from (Reservation, Show)."
        test_recipe:
          setup:
            - "A DRAFT show with a HELD PrivateEvent (show PRIVATE_HELD); the buyout is then CANCELLED (show reverts ON_SALE); confirm is attempted on the now-CANCELLED buyout."
          setup_api_calls:
