              payload: { affiliation_model: "IC", expected_advisor_version: "${a_v2}" }
              as: AdvisorOps
              as_user_id: "${a_id}"
              captures: { a_v3: $.data.version }
            - call: "POST /advisors"
              payload: { advisor_code: "A-1202", crd_number: "3234568", full_name: "Bev Alderman", affiliation_model: "IC", primary_branch_code: "SOLO-1", ingested_book_total_cents: 100000000, book_transferred_cents: 80000000, protocol_eligible: true, eo_coverage_level: "STANDARD" }
