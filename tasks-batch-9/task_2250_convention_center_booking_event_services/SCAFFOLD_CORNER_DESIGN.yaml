  - section: state_machines
    instances:
      - name: booking_initial_state_is_tentative_with_open_posture
        claim_type: initial_state
        grounds:
          - state_machines.EventBooking.initial_state
          - entities.EventBooking.fields.order_posture
          - entities.EventBooking.fields.hold_count
        distinguishing_aspect: |
          Two state dimensions are minted at once on a fresh booking: the lifecycle
          status TENTATIVE and the derived gate order_posture OPEN. A booking that came
          back RESTRICTED or LOCKED would block every child write in §1.5 despite the
          client being in GOOD standing with no holds yet placed.
        test_recipe:
          setup:
            - "the CONSUMER_SHOW window, Meeting Room 301 and Sunbelt Show Promotions exist"
          setup_api_calls:
            - call: "POST /convention-center/policy-windows"
              payload: { event_class: "CONSUMER_SHOW", priority_rank: 3, open_months_before: 18, close_months_before: 2, max_holds_per_booking: 2, challenge_response_hours: 48, rental_discount_pct: 0.0, max_challenge_rounds: 1 }
              as: VenueAdmin
            - call: "POST /convention-center/spaces"
              payload: { name: "Meeting Room 301", space_class: "MEETING_ROOM", rentable_sqft: 2600, daily_base_rate_cents: 90900 }
              as: VenueAdmin
              captures: { sp_mr_id: $.data.id }
            - call: "POST /convention-center/clients"
              payload: { legal_name: "Sunbelt Show Promotions", contact_email: "ssp@example.org", organization_type: "PROMOTER" }
              as: VenueAdmin
              captures: { cl_ssp_id: $.data.id }
          trigger:
            - call: "POST /convention-center/bookings"
              payload: { client_id: "${cl_ssp_id}", space_id: "${sp_mr_id}", event_name: "Regional Gem Show", event_class: "CONSUMER_SHOW", move_in_start_date: "2027-03-01", show_start_date: "2027-03-02", show_end_date: "2027-03-04", move_out_end_date: "2027-03-05" }
              as: SalesManager
              captures: { bk_id: $.data.id }
          assert:
            - "the trigger returns 201"
            - "EventBooking.${bk_id}.status == TENTATIVE"
            - "EventBooking.${bk_id}.order_posture == OPEN"
            - "EventBooking.${bk_id}.hold_count == 0"
            - "EventBooking.${bk_id}.version == 1"

      - name: hold_confirm_first_option_moves_active_to_confirmed
        claim_type: valid_transition
        grounds:
          - state_machines.SpaceHold.ACTIVE_to_CONFIRMED
          - endpoints[POST /convention-center/holds/{id}/confirm-first-option]
        distinguishing_aspect: |
          The single legal edge out of ACTIVE that is not a release. The confirmation
          must not disturb hold_rank, challenge_round or the release deadline stamped at
          insert; it is the narrowest side-effect set in the SpaceHold machine.
        test_recipe:
          setup:
            - "the Ballroom B CONSUMER_SHOW booking carries one ACTIVE hold of hold_rank 1"
            - "the logical clock is the default 2026-08-01T00:00:00Z, well inside the release deadline of 2027-03-10"
          setup_api_calls:
            - call: "POST /convention-center/policy-windows"
              payload: { event_class: "CONSUMER_SHOW", priority_rank: 3, open_months_before: 18, close_months_before: 2, max_holds_per_booking: 2, challenge_response_hours: 48, rental_discount_pct: 0.0, max_challenge_rounds: 1 }
              as: VenueAdmin
            - call: "POST /convention-center/spaces"
              payload: { name: "Ballroom B", space_class: "BALLROOM", rentable_sqft: 40000, daily_base_rate_cents: 1200000 }
              as: VenueAdmin
              captures: { sp_bb_id: $.data.id }
            - call: "POST /convention-center/clients"
              payload: { legal_name: "Sunbelt Show Promotions", contact_email: "ssp@example.org", organization_type: "PROMOTER" }
              as: VenueAdmin
              captures: { cl_ssp_id: $.data.id }
            - call: "POST /convention-center/bookings"
              payload: { client_id: "${cl_ssp_id}", space_id: "${sp_bb_id}", event_name: "Sunbelt Home Show", event_class: "CONSUMER_SHOW", move_in_start_date: "2027-06-08", show_start_date: "2027-06-10", show_end_date: "2027-06-12", move_out_end_date: "2027-06-13" }
              as: SalesManager
              captures: { bk_id: $.data.id, bk_v1: $.data.version }
            - call: "POST /convention-center/bookings/${bk_id}/holds"
              payload: { expected_booking_version: "${bk_v1}" }
              as: SalesManager
              captures: { hold_id: $.data.id }
          trigger:
            - call: "POST /convention-center/holds/${hold_id}/confirm-first-option"
              payload: {}
              as: SalesManager
          assert:
            - "the trigger returns 200"
            - "SpaceHold.${hold_id}.status == CONFIRMED"
            - "SpaceHold.${hold_id}.hold_rank == 1"
            - "SpaceHold.${hold_id}.challenge_round == 0"
            - "SpaceHold.${hold_id}.release_deadline_utc == 2027-03-10T00:00:00Z"
            - "SpaceHold.${hold_id}.interval_start_date == 2027-06-08 and interval_end_date == 2027-06-13"
            - "EventBooking.${bk_id}.hold_count == 1"

      - name: hold_confirm_first_option_on_a_second_rank_hold_rejected
        claim_type: precondition_enforcement
        grounds:
          - validations[priority=90]
          - errors[ERR_HOLD_NOT_FIRST_OPTION]
          - calculations.hold_rank_assignment
        distinguishing_aspect: |
          The source state is the perfectly legal ACTIVE and the clock is inside the
          release deadline, so only the rank precondition can stop the edge. Two
          bookings from different clients hold the same Ballroom B interval; the second
          hold sits at rank 2 and must not be convertible into a confirmation.
        test_recipe:
          setup:
            - "two CONSUMER_SHOW bookings cover the identical Ballroom B interval 2027-06-08 through 2027-06-13"
            - "the Sunbelt hold was placed first and carries hold_rank 1; the Riverbend hold carries hold_rank 2"
          setup_api_calls:
            - call: "POST /convention-center/policy-windows"
              payload: { event_class: "CONSUMER_SHOW", priority_rank: 3, open_months_before: 18, close_months_before: 2, max_holds_per_booking: 2, challenge_response_hours: 48, rental_discount_pct: 0.0, max_challenge_rounds: 1 }
              as: VenueAdmin
            - call: "POST /convention-center/spaces"
              payload: { name: "Ballroom B", space_class: "BALLROOM", rentable_sqft: 40000, daily_base_rate_cents: 1200000 }
              as: VenueAdmin
              captures: { sp_bb_id: $.data.id }
            - call: "POST /convention-center/clients"
              payload: { legal_name: "Sunbelt Show Promotions", contact_email: "ssp@example.org", organization_type: "PROMOTER" }
              as: VenueAdmin
              captures: { cl_ssp_id: $.data.id }
            - call: "POST /convention-center/clients"
              payload: { legal_name: "Riverbend Rotary", contact_email: "rotary@example.org", organization_type: "LOCAL_ORGANIZATION" }
              as: VenueAdmin
              captures: { cl_rr_id: $.data.id }
            - call: "POST /convention-center/bookings"
              payload: { client_id: "${cl_ssp_id}", space_id: "${sp_bb_id}", event_name: "Sunbelt Home Show", event_class: "CONSUMER_SHOW", move_in_start_date: "2027-06-08", show_start_date: "2027-06-10", show_end_date: "2027-06-12", move_out_end_date: "2027-06-13" }
              as: SalesManager
              captures: { bk_1_id: $.data.id, bk_1_v1: $.data.version }
            - call: "POST /convention-center/bookings"
              payload: { client_id: "${cl_rr_id}", space_id: "${sp_bb_id}", event_name: "Rotary Antiques Fair", event_class: "CONSUMER_SHOW", move_in_start_date: "2027-06-08", show_start_date: "2027-06-10", show_end_date: "2027-06-12", move_out_end_date: "2027-06-13" }
              as: SalesManager
              captures: { bk_2_id: $.data.id, bk_2_v1: $.data.version }
            - call: "POST /convention-center/bookings/${bk_1_id}/holds"
              payload: { expected_booking_version: "${bk_1_v1}" }
              as: SalesManager
              captures: { hold_1_id: $.data.id }
            - call: "POST /convention-center/bookings/${bk_2_id}/holds"
              payload: { expected_booking_version: "${bk_2_v1}" }
              as: SalesManager
              captures: { hold_2_id: $.data.id }
          trigger:
            - call: "POST /convention-center/holds/${hold_2_id}/confirm-first-option"
              payload: {}
              as: SalesManager
          assert:
            - "the trigger returns 409 with data.error_id == ERR_HOLD_NOT_FIRST_OPTION"
            - "SpaceHold.${hold_1_id}.hold_rank == 1 and status == ACTIVE"
            - "SpaceHold.${hold_2_id}.hold_rank == 2 and status == ACTIVE"

      - name: license_issue_escrows_the_deposit_and_stamps_issued_at
        claim_type: side_effect_execution
        grounds:
          - state_machines.LicenseAgreement.DRAFT_to_ISSUED
          - endpoints[POST /convention-center/licenses/{id}/issue]
          - entities.LicenseAgreement.fields.deposit_held_cents
          - entities.Client.fields.credit_balance_cents
        distinguishing_aspect: |
          The escrow is a two-sided money move on a single edge: 90900 leaves
          Client.credit_balance_cents and appears in LicenseAgreement.deposit_held_cents
          while total_deposits_paid_cents stays at the full 200000 received. An
          implementation that only writes the license side leaves the credit overstated.
        test_recipe:
          setup:
            - "Sunbelt Show Promotions has paid 200000 of deposits, so credit_balance_cents is 200000"
            - "the Meeting Room 301 booking has deposit_required_cents 90900 and a CONFIRMED hold"
            - "the LicenseAgreement is DRAFT"
          setup_api_calls:
            - call: "POST /convention-center/policy-windows"
              payload: { event_class: "CONSUMER_SHOW", priority_rank: 3, open_months_before: 18, close_months_before: 2, max_holds_per_booking: 2, challenge_response_hours: 48, rental_discount_pct: 0.0, max_challenge_rounds: 1 }
              as: VenueAdmin
            - call: "POST /convention-center/spaces"
              payload: { name: "Meeting Room 301", space_class: "MEETING_ROOM", rentable_sqft: 2600, daily_base_rate_cents: 90900 }
              as: VenueAdmin
              captures: { sp_mr_id: $.data.id }
            - call: "POST /convention-center/clients"
              payload: { legal_name: "Sunbelt Show Promotions", contact_email: "ssp@example.org", organization_type: "PROMOTER" }
              as: VenueAdmin
              captures: { cl_ssp_id: $.data.id }
            - call: "POST /convention-center/clients/${cl_ssp_id}/deposits"
              payload: { amount_cents: 200000 }
              as: VenueAdmin
            - call: "POST /convention-center/bookings"
              payload: { client_id: "${cl_ssp_id}", space_id: "${sp_mr_id}", event_name: "Regional Gem Show", event_class: "CONSUMER_SHOW", move_in_start_date: "2027-03-01", show_start_date: "2027-03-02", show_end_date: "2027-03-04", move_out_end_date: "2027-03-05" }
              as: SalesManager
              captures: { bk_id: $.data.id, bk_v1: $.data.version }
            - call: "POST /convention-center/bookings/${bk_id}/holds"
              payload: { expected_booking_version: "${bk_v1}" }
              as: SalesManager
              captures: { hold_id: $.data.id }
            - call: "POST /convention-center/holds/${hold_id}/confirm-first-option"
              payload: {}
              as: SalesManager
            - call: "POST /convention-center/bookings/${bk_id}/license"
              payload: {}
              as: SalesManager
              captures: { lic_id: $.data.id }
          trigger:
            - call: "POST /convention-center/licenses/${lic_id}/issue"
              payload: {}
              as: SalesManager
          assert:
            - "the trigger returns 200"
            - "LicenseAgreement.${lic_id}.status == ISSUED"
            - "LicenseAgreement.${lic_id}.deposit_held_cents == 90900"
            - "LicenseAgreement.${lic_id}.issued_at_utc == 2026-08-01T00:00:00Z"
            - "LicenseAgreement.${lic_id}.executed_at_utc == null"
            - "Client.${cl_ssp_id}.credit_balance_cents == 109100"
            - "Client.${cl_ssp_id}.total_deposits_paid_cents == 200000"

      - name: booking_open_show_directly_from_tentative_rejected
        claim_type: invalid_transitions
        grounds:
          - state_machines.EventBooking.transitions
          - errors[ERR_BOOKING_STATE_INVALID]
          - validations[priority=40]
        distinguishing_aspect: |
          TENTATIVE to IN_HOUSE is not an edge in the machine even though every other
          gate is satisfied: the clock has reached move-in, so the temporal guard at
          priority 79 would pass. The state check at 40 must win and no status change
          may be visible afterwards.
        test_recipe:
          setup:
            - "the Meeting Room 301 booking is TENTATIVE with no hold and no license"
            - "the logical clock has been advanced to 2027-03-01T08:00:00Z, which is the move-in date"
          setup_api_calls:
            - call: "POST /convention-center/policy-windows"
              payload: { event_class: "CONSUMER_SHOW", priority_rank: 3, open_months_before: 18, close_months_before: 2, max_holds_per_booking: 2, challenge_response_hours: 48, rental_discount_pct: 0.0, max_challenge_rounds: 1 }
              as: VenueAdmin
            - call: "POST /convention-center/spaces"
              payload: { name: "Meeting Room 301", space_class: "MEETING_ROOM", rentable_sqft: 2600, daily_base_rate_cents: 90900 }
              as: VenueAdmin
              captures: { sp_mr_id: $.data.id }
            - call: "POST /convention-center/clients"
              payload: { legal_name: "Sunbelt Show Promotions", contact_email: "ssp@example.org", organization_type: "PROMOTER" }
              as: VenueAdmin
              captures: { cl_ssp_id: $.data.id }
            - call: "POST /convention-center/bookings"
              payload: { client_id: "${cl_ssp_id}", space_id: "${sp_mr_id}", event_name: "Regional Gem Show", event_class: "CONSUMER_SHOW", move_in_start_date: "2027-03-01", show_start_date: "2027-03-02", show_end_date: "2027-03-04", move_out_end_date: "2027-03-05" }
              as: SalesManager
              captures: { bk_id: $.data.id }
            - call: "POST /convention-center/_clock/set_current_utc"
              payload: { to_iso8601: "2027-03-01T08:00:00Z" }
              as: VenueAdmin
          trigger:
            - call: "POST /convention-center/bookings/${bk_id}/open-show"
              payload: {}
              as: EventServicesManager
          assert:
            - "the trigger returns 409 with data.error_id == ERR_BOOKING_STATE_INVALID"
            - "the trigger does not return 409 with data.error_id == ERR_MOVE_IN_NOT_REACHED"
            - "EventBooking.${bk_id}.status == TENTATIVE"
            - "EventBooking.${bk_id}.order_posture == OPEN"

      - name: release_of_a_settled_booking_rejected
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.EventBooking.terminal_states
          - endpoints[POST /convention-center/bookings/{id}/release]
          - errors[ERR_BOOKING_STATE_INVALID]
        distinguishing_aspect: |
          SETTLED is terminal and was reached by a system cascade from the settlement,
          not by a direct call, so an implementation that only guards the states it
          writes itself can leave the release edge open. A successful release here would
          reverse SpaceUnit.committed_space_days on a booking that has already been paid.
        test_recipe:
          setup:
            - "the Ballroom C CONSUMER_SHOW booking has contracted_rental_cents 5000000 and deposit_required_cents 1250000"
            - "the client paid 1300000, the license is EXECUTED with deposit_held_cents 1250000"
            - "the CONTRACTED settlement carrying one RENTAL line of 5000000 was issued by analyst-1 at 2027-06-14T09:00:00Z and finalized by analyst-2 after the dispute deadline of 2027-06-24T09:00:00Z"
            - "the booking is therefore SETTLED with grand_total_cents 4100000"
          setup_api_calls:
            - call: "POST /convention-center/policy-windows"
              payload: { event_class: "CONSUMER_SHOW", priority_rank: 3, open_months_before: 18, close_months_before: 2, max_holds_per_booking: 2, challenge_response_hours: 48, rental_discount_pct: 0.0, max_challenge_rounds: 1 }
