          - constants[MIN_POST_TEST_HOURS]
          - constants[TIER_BREAKPOINT_HOURS]
        distinguishing_aspect: |
          Two unrelated consumers read the same cumulative hour ledger at the same breakpoint: 40.00 hours
          is simultaneously the post-test hour gate and the third fee-discount tier. A single 0.25-hour
          entry therefore has to move both, and the instance measures them on either side of that entry -
          39.75 hours gives a 25% discount and post_test_eligible false, 40.00 hours gives 50% and true.
