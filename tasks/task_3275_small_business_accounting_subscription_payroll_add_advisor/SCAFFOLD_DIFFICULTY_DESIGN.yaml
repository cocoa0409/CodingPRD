              as_user_id: "${company_q_admin_id}"
              captures: { err_q: $.data.error_id }
          assert:
            - "sub_q_status == SUSPENDED (prerequisite achieved)"
            - "the response status is 400"
            - "err_q == ERR_SUBSCRIPTION_NOT_WRITABLE (cross-entity state gate)"
