            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-03-03T09:00:00Z" }, as: IntegratorAdmin }
            - { call: "POST /barn-washes", payload: { barn_id: "${barn_id}", wash_type: "FULL_DISINFECT", completed_at: "2026-03-03T09:00:00Z" }, as: Grower, as_user_id: "${grower_id}", captures: { bw2: $.data.id } }
            - { call: "GET /barns/${barn_id}", payload: {}, as: IntegratorAdmin, captures: { b_status2: $.data.barn_status } }
          assert:
            - "After reject: barn_status == WASH_REQUIRED (${b_status}); wash ${bw1} is REJECTED"
            - "Re-wash loop works: second wash ${bw2} RECORDED and barn WASHING again (${b_status2})"

  # ============================================================ calculations
  - section: calculations
    instances:
      - name: feed_deliver_variance_branch_80pct
        claim_type: threshold_boundary
        grounds: [state_machines.FeedOrder]
        distinguishing_aspect: "Variance branch pinned at >= 80%: exactly 8000 of 10000 lbs -> DELIVERED; 7999 -> SHORTED. Both terminal, both credit delivered lbs to cumulative_feed_lbs."
        test_recipe:
          setup: ["group PLACED 1000 head; two SCHEDULED STARTER orders of 10000 lbs each"]
          setup_api_calls:
            - { call: "POST /sites", payload: { name: "S", state_code: "IA", county: "Sioux" }, as: IntegratorAdmin, captures: { site_id: $.data.id } }
            - { call: "POST /growers", payload: { legal_name: "G", grower_code: "G-1", email: "g@x.com" }, as: IntegratorAdmin, captures: { grower_id: $.data.id } }
            - { call: "POST /contracts", payload: { grower_id: "${grower_id}", site_id: "${site_id}", base_pay_cents_per_head: 4000, bonus_cap_cents_per_head: 1200, fcr_target: 2.60, adg_target_lbs: 1.90, mortality_threshold_pct: 5.00, feed_budget_lbs_per_head: 650, structural_owner_pct: 100, equipment_owner_pct: 50, routine_owner_pct: 0, effective_date: "2026-01-01", expiry_date: "2026-12-31" }, as: IntegratorAdmin, captures: { contract_id: $.data.id } }
            - { call: "POST /contracts/${contract_id}/activate", payload: {}, as: IntegratorAdmin }
            - { call: "POST /barns", payload: { site_id: "${site_id}", barn_code: "B1", capacity_head: 1200, floor_space_sqft: 9600 }, as: IntegratorAdmin, captures: { barn_id: $.data.id, barn_v: $.data.version } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-02-15T00:00:00Z" }, as: IntegratorAdmin }
            - { call: "POST /pig-groups", payload: { barn_id: "${barn_id}", contract_id: "${contract_id}", placement_date: "2026-03-02", target_market_date: "2026-07-13", head_placed: 1000, avg_start_weight_lbs: 50.0, expected_barn_version: "${barn_v}" }, as: FieldTech, captures: { group_id: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-03-02T00:00:00Z" }, as: IntegratorAdmin }
            - { call: "POST /pig-groups/${group_id}/confirm-placement", payload: {}, as: FieldTech }
            - { call: "POST /feed-orders", payload: { group_id: "${group_id}", phase: "STARTER", diet_code: "ST-1", quantity_lbs: 10000, requested_delivery_date: "2026-03-05" }, as: FieldTech, captures: { o1: $.data.id } }
            - { call: "POST /feed-orders/${o1}/schedule", payload: { scheduled_delivery_date: "2026-03-05" }, as: FeedMill }
            - { call: "POST /feed-orders", payload: { group_id: "${group_id}", phase: "STARTER", diet_code: "ST-1", quantity_lbs: 10000, requested_delivery_date: "2026-03-06" }, as: FieldTech, captures: { o2: $.data.id } }
            - { call: "POST /feed-orders/${o2}/schedule", payload: { scheduled_delivery_date: "2026-03-06" }, as: FeedMill }
          trigger:
            - { call: "POST /feed-orders/${o1}/deliver", payload: { delivered_lbs: 8000 }, as: FeedMill, captures: { o1s: $.data.order_status } }
            - { call: "POST /feed-orders/${o2}/deliver", payload: { delivered_lbs: 7999 }, as: FeedMill, captures: { o2s: $.data.order_status } }
            - { call: "GET /pig-groups/${group_id}", payload: {}, as: FieldTech, captures: { cum: $.data.cumulative_feed_lbs } }
          assert:
            - "8000/10000 (exactly 80%) -> DELIVERED (${o1s}); 7999/10000 (< 80%) -> SHORTED (${o2s})"
            - "cumulative_feed_lbs == 15999 (${cum}) — both branches credit actual delivered lbs"

      - name: projected_weight_window_edges
        claim_type: correct_result
        grounds: [ calculations.projected_market_weight, "errors[ERR_WEIGHT_WINDOW_PROJECTED]"]
        distinguishing_aspect: "Projection 50.0 + 1.85*133 = 296.05 lbs at slot 2026-07-13: slot max 300 accepts the booking; slot max 296 rejects with ERR_WEIGHT_WINDOW_PROJECTED. Tests the forward-looking formula and its inclusive bounds."
        test_recipe:
          setup: ["group PLACED 1000 head (placement 2026-03-02); two slots 2026-07-13 AM (max 300) and PM (max 296), cap 500, min 240"]
