        distinguishing_aspect: "The window test is inclusive at its lower bound: with window_start exactly equal to the logical clock 2026-08-01T00:00:00Z the check-out succeeds (a strict > implementation would return ERR_LOAN_WINDOW_NOT_OPEN), checked_out_at is stamped from the clock rather than from wall time, and 2 units move from units_on_shelf to units_on_loan in the same request."
