  # ==========================================================================
  # Section: complexity_layers
  # ==========================================================================
  - section: complexity_layers
    instances:
      - name: occ_correct_version_succeeds
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[plan-create-stale-loan-version]"]
        distinguishing_aspect: "First plan create with the correct expected_loan_version succeeds (positive OCC path); response.data.version > requested expected_loan_version because the create itself bumps Loan.version."
        test_recipe:
          setup: ["Loan in REPAYMENT just after start-repayment"]
          setup_api_calls:
            - call: "POST /loan-servicing/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: LoanServicer
            - call: "POST /loan-servicing/borrowers"
              payload: { full_name: "Occ B", ssn_last4: "0033", is_veteran: false }
              as: LoanServicer
              captures: { b_id: $.data.id }
            - call: "POST /loan-servicing/loans"
              payload: { borrower_id: "${b_id}", loan_type: "DIRECT_UNSUB", principal_cents: 100000, interest_rate_bps: 500, disbursement_date: "2026-06-01T00:00:00Z" }
              as: LoanServicer
              captures: { ln_id: $.data.id }
            - call: "POST /loan-servicing/loans/${ln_id}/enter-school"
              payload: {}
              as: LoanServicer
            - call: "POST /loan-servicing/loans/${ln_id}/graduate"
              payload: {}
              as: LoanServicer
            - call: "POST /loan-servicing/loans/${ln_id}/start-repayment"
              payload: {}
              as: LoanServicer
              captures: { ln_v: $.data.version }
          trigger:
            - call: "POST /loan-servicing/repayment-plans"
              payload: { loan_id: "${ln_id}", plan_type: "STANDARD", effective_date: "2026-06-01T00:00:00Z", expected_loan_version: "${ln_v}" }
              as: LoanServicer
              captures: { rp_status: $.data.status }
          assert:
            - "${rp_status} == PENDING"

      - name: scheduled_clock_set_recomputes_delinquency_days
        claim_type: scheduled_actions
        grounds: ["endpoints", "calculations.interest_accrual", "entities.Loan.fields.delinquency_days"]
        distinguishing_aspect: "Setting clock forward triggers a flat interest_accrual; delinquency_days reflects the new clock instant."
        excluded_because:
          difficulty_instance: boundary_precision_check / boundary_default_threshold_exactly_270_passes
          rationale: "Clock-driven delinquency advance is the mechanism behind the §1.8 boundary test."

      - name: cascade_supersede_on_default_plan_status_only
        claim_type: cascading_side_effects
        grounds: ["state_machines.RepaymentPlan.transitions.ACTIVE_to_SUPERSEDED"]
        excluded_because:
          difficulty_instance: transitive_cascade / default_declare_depth2_loan_plan
          rationale: "Cascade plan-supersede on declare-default is the §1.8 depth-2 cascade itself."

  # ==========================================================================
  # Section: consistency_model
  # ==========================================================================
  - section: consistency_model
    instances:
      - name: immediate_consistency_payment_apply_balance_visible_in_response
        claim_type: immediate
        grounds: ["endpoints"]
        distinguishing_aspect: "POST /payments/{id}/apply response shows updated balances within the same request (no eventual lag)."
        test_recipe:
          setup: ["Loan in REPAYMENT principal=1_000_000 cents accrued=0; PENDING Payment 50000 cents"]
          setup_api_calls:
            - call: "POST /loan-servicing/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: LoanServicer
            - call: "POST /loan-servicing/borrowers"
              payload: { full_name: "Imm B", ssn_last4: "0034", is_veteran: false }
              as: LoanServicer
              captures: { b_id: $.data.id }
            - call: "POST /loan-servicing/loans"
              payload: { borrower_id: "${b_id}", loan_type: "DIRECT_UNSUB", principal_cents: 1000000, interest_rate_bps: 500, disbursement_date: "2026-06-01T00:00:00Z" }
              as: LoanServicer
              captures: { ln_id: $.data.id }
            - call: "POST /loan-servicing/loans/${ln_id}/enter-school"
              payload: {}
              as: LoanServicer
            - call: "POST /loan-servicing/loans/${ln_id}/graduate"
              payload: {}
              as: LoanServicer
            - call: "POST /loan-servicing/loans/${ln_id}/start-repayment"
              payload: {}
              as: LoanServicer
            - call: "POST /loan-servicing/payments"
              payload: { loan_id: "${ln_id}", amount_cents: 50000, payment_date: "2026-06-01T00:00:00Z" }
              as: Borrower
              as_user_id: "${b_id}"
              captures: { pay_id: $.data.id }
          trigger:
            - call: "POST /loan-servicing/payments/${pay_id}/apply"
              payload: {}
              as: LoanServicer
              captures: { pay_status: $.data.status, p_appl: $.data.principal_applied_cents }
            - call: "GET /loan-servicing/loans/${ln_id}"
              payload: {}
              as: LoanServicer
              captures: { ln_bal: $.data.principal_balance_cents }
          assert:
            - "${pay_status} == APPLIED"
            - "${p_appl} == 50000"
            - "${ln_bal} == 950000"
