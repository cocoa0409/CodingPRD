      - name: line_window_conflict_on_buffer_expanded_overlap
        claim_type: temporal_validation
        grounds:
          - validations[priority=32]
          - errors[ERR_LINE_WINDOW_CONFLICT]
          - entities.PlantLine.fields.changeover_buffer_minutes
        excluded_because:
          difficulty_instance: resource_temporal_overlap / line_run_closed_interval_with_changeover_buffer
          rationale: "That §1.8 instance asserts the closed-interval, both-ends-buffer-expanded overlap rule at the touching endpoint, which is the only way this error is reachable."

      - name: audit_concurrent_capacity_aggregate_violation
        claim_type: aggregate_validation
        grounds:
          - validations[priority=33]
          - errors[ERR_AUDIT_CAPACITY_EXCEEDED]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / supplier_audit_half_open_aggregate_capacity_two
          rationale: "That §1.8 instance admits two half-open audit windows that individually pass and asserts the third is refused, which is exactly the aggregate claim."

      - name: negotiation_round_limit_terminates_the_loop
        claim_type: violation_to_error
        grounds:
          - validations[priority=41]
          - errors[ERR_NEGOTIATION_ROUND_LIMIT]
          - entities.CostChangeRequest.fields.round_number
        excluded_because:
          difficulty_instance: non_linear_state_machine / cost_change_negotiation_round_cycle
          rationale: "That §1.8 instance runs the counter/revise loop to round_number 3 and asserts the fourth revision returns 409 ERR_NEGOTIATION_ROUND_LIMIT with the row left COUNTERED."

