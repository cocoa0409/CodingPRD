            - "Reusing donor_reference P-001 across two different campaigns is legal (uniqueness is per campaign)"

      - name: finalize_review_empty_then_sub_quorum_eligible_set_errors_in_priority_order
        claim_type: Cascading validation
        grounds:
          - validations.priority_36
          - validations.priority_37
          - validations.priority_20
          - errors.ERR_NO_ELIGIBLE_SCORES
          - errors.ERR_PANEL_QUORUM_NOT_MET
        distinguishing_aspect: |
          The quorum check is downstream of the emptiness check and both are reachable on the same
          request: finalize-review on a still-SUBMITTED request with zero scores returns
          ERR_NO_ELIGIBLE_SCORES (priority 36, the only reason priority 20 admits SUBMITTED),
          and after two conflict-free scores land - moving the request to UNDER_PANEL_REVIEW with
          eligible_score_count 2 - the same call returns ERR_PANEL_QUORUM_NOT_MET (priority 37).
          An implementation that folds "empty" into "below quorum" returns the wrong error_id on
          the first leg.
