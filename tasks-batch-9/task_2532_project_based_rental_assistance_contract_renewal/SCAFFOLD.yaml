scenario: |
  Generate task harder than expert level!

  2532. Project-Based Rental Assistance Contract Renewal (assisted housing owner-agent): contract
  expiration calendar with renewal option selection by contract type, rent comparability study
  preparation and reviewer challenge process, budget-based rent adjustment versus operating cost
  adjustment factor election, tenant notification requirements and opt-out or termination
  procedures, utility allowance analysis and adjustment with tenant rent recalculation,
  mark-up-to-market and mark-to-market restructuring eligibility, voucher enhancement for tenants
  in opting-out properties, monthly voucher submission, subsidy reconciliation and special claims

domain_name: project-based-rental-assistance-renewal
api_prefix: /pbra

complexity_profile:
  primary_archetype: Compliance / audit
  secondary_archetype: Multi-party negotiation
  complexity_layers:
    - dual_variant_calculation
    - cascading_side_effects
    - optimistic_concurrency
    - rate_threshold_triggers

  entity_topology: flat
  # Every entity is addressed at its own top-level collection under /pbra and linked by explicit
  # foreign keys (Property.owner_id, HapContract.property_id, RenewalCase.contract_id, ...).
  # No entity id is nested in another entity's URL path for creation; sub-resource GETs exist only
  # as reverse-reachability read channels.

  state_machine_shape: cyclic
  # RentComparabilityStudy cycles SUBMITTED -> CHALLENGED -> SUBMITTED for up to
  # MAX_CHALLENGE_ROUNDS negotiation rounds; UtilityAllowanceAnalysis cycles
  # SUBMITTED -> REJECTED -> SUBMITTED; RenewalCase's notice track cycles
  # OPT_OUT_NOTICED -> NOTICES_PENDING. RenewalCase additionally carries two independent
  # parallel state dimensions (rent_track_status x notice_track_status) and
  # RestructuringDetermination is a branching fork-join.

  relationship_patterns:
    - one_to_many          # Property -> HapContract -> RenewalCase -> RentComparabilityStudy -> Comparable
    - self_referential     # RentComparabilityStudy.supersedes_study_id -> RentComparabilityStudy.id
    - cross_aggregate      # TenantCertification (tenant aggregate) feeds VoucherSubmission (contract aggregate)

  role_model: segregation_of_duties
  # The ContractAdministrator user (X-User-ID) who challenged a RentComparabilityStudy on a
  # RenewalCase MUST NOT be the ContractAdministrator user who later approves that case's renewal
  # rents; utility-allowance changes above UA_FIELD_OFFICE_THRESHOLD_PCT move approval authority
  # from ContractAdministrator to HudFieldOffice.

  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

entities:
  - name: Owner
    parent: null
    common_fields: true
    fields:
      - name: legal_name
        type: string
        source: input
        description: Legal name of the assisted-housing owner entity.
      - name: tin
        type: string
        source: input
        description: Taxpayer identification number, unique across Owner rows.
        constraints: unique; 9 digits
      - name: contact_email
        type: string
        source: input
        description: Owner-agent contact mailbox.
      - name: portfolio_property_count
        type: integer
        source: computed
        description: Count of Property rows whose owner_id equals this Owner.id (no status filter; all Property rows count).
        default: 0
      - name: compliance_flag
        type: enum
        source: system
        description: Set to REVIEW_REQUIRED when any RentComparabilityStudy under this Owner's properties transitions to REJECTED; never auto-cleared.
        default: OK
        constraints: "OK | REVIEW_REQUIRED"

  - name: Property
    parent: null
    common_fields: true
    fields:
      - name: owner_id
        type: string
        source: input
        description: FK -> Owner.id; the Owner the acting OwnerAgent must match on every write touching this Property.
      - name: project_name
        type: string
        source: input
        description: HUD project name.
      - name: state_code
        type: enum
        source: input
        description: Two-letter state code selecting the OCAF factor in calculations.ocaf_adjusted_rent.
        constraints: "IL | TX"
      - name: total_units
        type: integer
        source: input
        description: Total residential units at the property.
        constraints: ">= 1"
      - name: assisted_unit_count
        type: integer
        source: input
        description: Units covered by project-based assistance; the conserved total of calculations.assisted_unit_conservation.
        constraints: ">= 1 and <= total_units"
      - name: published_fmr_cents
        type: integer
        source: input
        description: Published Fair Market Rent for the assisted unit type, in cents.
        constraints: ">= 1"
      - name: baseline_utility_allowance_cents
        type: integer
        source: input
        description: Utility allowance in cents in force before any UtilityAllowanceAnalysis is applied.
        constraints: ">= 0"
      - name: current_utility_allowance_cents
        type: integer
        source: computed
        description: proposed_allowance_cents of the UtilityAllowanceAnalysis for this Property with state == APPLIED and the greatest effective_date (tie-break created_at ASC, last wins); baseline_utility_allowance_cents when no APPLIED analysis exists.
      - name: has_fha_insured_mortgage
        type: boolean
        source: input
        description: True when the project carries an FHA-insured mortgage, a precondition of mark-to-market referral.
        default: false
      - name: units_under_hap_count
        type: integer
        source: computed
        description: Assisted units still receiving project-based HAP; initialized to assisted_unit_count at creation, decremented by enhanced-voucher issuance and by move-out.
      - name: enhanced_voucher_unit_count
        type: integer
        source: computed
        description: Assisted units converted to tenant-based enhanced vouchers (count of EnhancedVoucher rows with state == ISSUED for tenants of this Property).
        default: 0
      - name: released_unit_count
        type: integer
        source: computed
        description: Assisted units released from assistance without an enhanced voucher (count of TenantHousehold rows with status == MOVED_OUT that never held an ISSUED EnhancedVoucher).
        default: 0
      - name: last_applied_ua_effective_date
        type: string
        source: system
        description: effective_date of the most recently APPLIED UtilityAllowanceAnalysis; null until the first apply.
        default: null

  - name: HapContract
    parent: null
    common_fields: true
    fields:
      - name: property_id
        type: string
        source: input
        description: FK -> Property.id; the assisted project this Housing Assistance Payments contract covers.
      - name: contract_type
        type: enum
        source: input
        description: Statutory contract family; gates which renewal options RenewalCase.select-option accepts.
        constraints: "NEW_CONSTRUCTION | STATE_AGENCY_FINANCED | LOAN_MANAGEMENT_SET_ASIDE | PROPERTY_DISPOSITION"
      - name: expiration_date
        type: string
        source: input
        description: ISO date (YYYY-MM-DD) on which the current contract term expires; anchor of the expiration calendar.
      - name: term_months
        type: integer
        source: input
        description: Length of the current term in months; copied forward on renewal execution.
        constraints: ">= 12"
      - name: contract_rent_per_unit_cents
        type: integer
        source: input
        description: Monthly contract rent per assisted unit in cents, in force for the current term.
        constraints: ">= 1"
      - name: monthly_debt_service_per_unit_cents
        type: integer
        source: input
        description: Monthly per-unit debt service in cents; excluded from the OCAF-adjusted portion.
        constraints: ">= 0"
      - name: operating_expense_per_unit_cents
        type: integer
        source: input
        description: Monthly per-unit operating expense in cents used by calculations.budget_based_rent.
        constraints: ">= 0"
      - name: reserve_deposit_per_unit_cents
        type: integer
        source: input
        description: Monthly per-unit replacement-reserve deposit in cents used by calculations.budget_based_rent.
        constraints: ">= 0"
      - name: authorized_hap_budget_cents
        type: integer
        source: input
        description: Total HAP authorization in cents available to pay vouchers and special claims on this contract.
        constraints: ">= 0"
      - name: paid_hap_total_cents
        type: integer
        source: computed
        description: Sum of VoucherSubmission.paid_amount_cents for this contract over rows with state == PAID (REVERSED rows excluded).
        default: 0
      - name: paid_claims_total_cents
        type: integer
        source: computed
        description: Sum of SpecialClaim.paid_amount_cents for this contract over rows with state == PAID.
        default: 0
      - name: hap_ledger_balance_cents
        type: integer
        source: computed
        description: authorized_hap_budget_cents - paid_hap_total_cents - paid_claims_total_cents; the conserved quantity of calculations.hap_budget_conservation.
      - name: lifecycle_status
        type: enum
        source: system
        description: Contract lifecycle dimension driven by state_machines.HapContract.
        default: ACTIVE
        constraints: "ACTIVE | RENEWAL_PENDING | RENEWED | OPT_OUT_PENDING | EXPIRED_OPT_OUT"
      - name: renewed_rent_per_unit_cents
        type: integer
        source: system
        description: Approved renewal rent copied from RenewalCase.approved_rent_per_unit_cents on execute-renewal; null before execution.
        default: null
      - name: renewed_expiration_date
        type: string
        source: system
        description: expiration_date + term_months, stamped on execute-renewal; null before execution.
        default: null
      - name: renewed_option
        type: enum
        source: system
        description: RenewalCase.renewal_option copied on execute-renewal; null before execution.
        default: null
        constraints: "OPTION_1_MARK_UP_TO_MARKET | OPTION_2_OCAF | OPTION_3_MARK_TO_MARKET | OPTION_4_PORTFOLIO_REENGINEERING"

  - name: RenewalCase
    parent: null
    common_fields: true
    fields:
      - name: contract_id
        type: string
        source: input
        description: FK -> HapContract.id; the expiring contract being renewed or opted out of.
      - name: rent_track_status
        type: enum
        source: system
        description: First parallel state dimension (rent determination), driven by state_machines.RenewalCase-rent-track.
        default: TERMS_PENDING
        constraints: "TERMS_PENDING | OPTION_SELECTED | RCS_IN_PROGRESS | RENTS_APPROVED | EXECUTED"
      - name: notice_track_status
        type: enum
        source: system
        description: Second parallel state dimension (tenant notification), driven by state_machines.RenewalCase-notice-track; evolves independently of rent_track_status.
        default: NOTICES_PENDING
        constraints: "NOTICES_PENDING | RENEWAL_NOTICED | OPT_OUT_NOTICED | OPT_OUT_FINALIZED"
      - name: renewal_option
        type: enum
        source: input
        description: Renewal option elected by the owner; null until POST select-option.
        default: null
        constraints: "OPTION_1_MARK_UP_TO_MARKET | OPTION_2_OCAF | OPTION_3_MARK_TO_MARKET | OPTION_4_PORTFOLIO_REENGINEERING"
      - name: adjustment_method
        type: enum
        source: input
        description: Rent adjustment election; null until POST elect-adjustment. Selects which variant of calculations.renewal_rent_determination applies.
        default: null
        constraints: "OCAF | BUDGET_BASED"
      - name: opened_on_date
        type: string
        source: system
        description: Logical-clock date (YYYY-MM-DD) at case creation.
      - name: days_to_expiration_at_open
        type: integer
        source: computed
        description: Whole days from opened_on_date to HapContract.expiration_date (expiration counted, open day excluded).
      - name: rcs_required
        type: boolean
        source: computed
        description: True when renewal_option == OPTION_1_MARK_UP_TO_MARKET or adjustment_method == BUDGET_BASED; when true a RentComparabilityStudy in state ACCEPTED is required before rents can be approved and the comparable rent cap applies.
        default: false
      - name: comparable_market_rent_cents
        type: integer
        source: computed
        description: estimated_market_rent_cents of the most recently submitted or challenged RentComparabilityStudy on this case, which becomes the final market rent once that study reaches state ACCEPTED; null before the first submission.
        default: null
      - name: ocaf_rent_per_unit_cents
        type: integer
        source: computed
        description: Output of calculations.ocaf_adjusted_rent, recomputed on select-option and elect-adjustment, and overwritten by an approved RestructuringDetermination.
        default: null
      - name: budget_rent_per_unit_cents
        type: integer
        source: computed
        description: Output of calculations.budget_based_rent, recomputed on select-option and elect-adjustment.
        default: null
      - name: approved_rent_per_unit_cents
        type: integer
        source: computed
        description: Output of calculations.renewal_rent_determination stamped by POST approve-rents; null before approval.
        default: null
      - name: challenge_reviewer_user_id
        type: string
        source: system
        description: X-User-ID of the ContractAdministrator who issued the most recent RentComparabilityStudy challenge on this case; null when no challenge was issued.
        default: null
      - name: rents_approver_user_id
        type: string
        source: system
        description: X-User-ID of the ContractAdministrator who approved the renewal rents; null before approval.
        default: null
      - name: opt_out_notice_id
        type: string
        source: system
        description: id of the TenantNotice with notice_type == OPT_OUT_ONE_YEAR and status == ISSUED that moved notice_track_status to OPT_OUT_NOTICED; null otherwise.
        default: null

  - name: RentComparabilityStudy
    parent: null
    common_fields: true
    fields:
      - name: renewal_case_id
        type: string
        source: input
        description: FK -> RenewalCase.id; the case this study supports.
      - name: supersedes_study_id
        type: string
        source: input
        description: FK -> RentComparabilityStudy.id; the REJECTED study this filing replaces. Null for a first filing.
        default: null
      - name: state
        type: enum
        source: system
        description: Study lifecycle driven by state_machines.RentComparabilityStudy (cyclic challenge rounds).
        default: DRAFT
        constraints: "DRAFT | SUBMITTED | CHALLENGED | ACCEPTED | REJECTED | SUPERSEDED"
      - name: appraiser_name
        type: string
        source: input
        description: State-certified appraiser who prepared the study.
      - name: challenge_round
        type: integer
        source: system
        description: Number of reviewer challenges issued against this study; incremented on each challenge, never reset.
        default: 0
      - name: estimated_market_rent_cents
        type: integer
        source: computed
        description: Output of calculations.comparable_market_rent over this study's Comparable rows with status == ACCEPTED; null while no ACCEPTED comparable exists.
        default: null
      - name: accepted_comparable_count
        type: integer
        source: computed
        description: Count of Comparable rows for this study with status == ACCEPTED.
        default: 0
      - name: last_challenge_reason
        type: string
        source: system
        description: Free-text reason recorded by the most recent challenge; null before the first challenge.
        default: null
      - name: submitted_on_date
        type: string
        source: system
        description: Logical-clock date of the most recent submit; null while never submitted.
        default: null

  - name: Comparable
    parent: null
    common_fields: true
    fields:
      - name: study_id
        type: string
        source: input
        description: FK -> RentComparabilityStudy.id; the study this comparable belongs to.
      - name: address_label
        type: string
        source: input
        description: Label of the comparable property.
      - name: raw_rent_cents
        type: integer
        source: input
        description: Unadjusted asking rent of the comparable unit in cents.
        constraints: ">= 1"
      - name: adjustment_total_cents
        type: integer
        source: input
        description: Net appraisal adjustment in cents; may be negative.
      - name: utility_adjustment_cents
        type: integer
        source: input
        description: Utility-configuration adjustment in cents; may be negative.
      - name: weight
        type: integer
        source: input
        description: Appraiser weight of this comparable in the weighted mean.
        constraints: "integer 1..5"
      - name: adjusted_rent_cents
        type: integer
        source: computed
        description: round_half_up_to_whole_dollar(raw_rent_cents + adjustment_total_cents + utility_adjustment_cents); the per-comparable rounding step of calculations.comparable_market_rent.
      - name: status
        type: enum
        source: system
        description: ACCEPTED at creation; set to STRUCK when a reviewer challenge names this comparable id.
        default: ACCEPTED
        constraints: "ACCEPTED | STRUCK"

  - name: UtilityAllowanceAnalysis
    parent: null
    common_fields: true
    fields:
      - name: property_id
        type: string
        source: input
        description: FK -> Property.id; the project whose allowance is being analysed.
      - name: method
        type: enum
        source: input
        description: Analysis method; FACTOR_BASED requires utility_rate_change_pct, ENGINEERING_BASED requires engineering_estimate_cents.
        constraints: "FACTOR_BASED | ENGINEERING_BASED"
      - name: baseline_allowance_cents
        type: integer
        source: system
        description: Snapshot of Property.current_utility_allowance_cents taken at analysis creation.
      - name: utility_rate_change_pct
        type: number
        source: input
        description: Signed rate-change factor for FACTOR_BASED analyses (e.g. 0.09 = +9 percent); null for ENGINEERING_BASED.
        default: null
        constraints: ">= -0.5 and <= 0.5"
      - name: engineering_estimate_cents
        type: integer
        source: input
        description: Engineer-modelled allowance in cents for ENGINEERING_BASED analyses; null for FACTOR_BASED.
        default: null
        constraints: ">= 0"
      - name: proposed_allowance_cents
        type: integer
        source: computed
        description: Output of calculations.utility_allowance_adjustment.
      - name: change_pct
        type: number
        source: computed
        description: (proposed_allowance_cents - baseline_allowance_cents) / baseline_allowance_cents, rounded half-up to 4 decimal places.
      - name: requires_field_office_approval
        type: boolean
        source: computed
        description: True when abs(change_pct) > UA_FIELD_OFFICE_THRESHOLD_PCT (strict); shifts approval authority from ContractAdministrator to HudFieldOffice.
      - name: effective_date
        type: string
        source: input
        description: ISO date the adjusted allowance takes effect; anchors the 12-month coverage interval of the overlap rule.
      - name: state
        type: enum
        source: system
        description: Analysis lifecycle driven by state_machines.UtilityAllowanceAnalysis (rejection loops back to DRAFT).
        default: DRAFT
        constraints: "DRAFT | SUBMITTED | APPROVED | REJECTED | APPLIED"
      - name: approver_user_id
        type: string
        source: system
        description: X-User-ID of the role that approved this analysis; null before approval.
        default: null
      - name: applied_on_date
        type: string
        source: system
        description: Logical-clock date on which the analysis was applied; null before apply.
        default: null
      - name: recertified_tenant_count
        type: integer
        source: computed
        description: Count of TenantCertification rows with cert_type == UA_ADJUSTMENT created by this analysis's apply cascade.
        default: 0

  - name: TenantHousehold
    parent: null
    common_fields: true
    fields:
      - name: property_id
        type: string
        source: input
        description: FK -> Property.id; the project the household occupies.
      - name: unit_number
        type: string
        source: input
        description: Unit identifier, unique per Property over rows with status != MOVED_OUT.
      - name: household_name
        type: string
        source: input
        description: Head-of-household name.
      - name: annual_adjusted_income_cents
        type: integer
        source: input
        description: Annual adjusted income in cents, the 30-percent basis of calculations.tenant_rent_recalculation.
        constraints: ">= 0"
      - name: annual_gross_income_cents
        type: integer
        source: input
        description: Annual gross income in cents, the 10-percent basis of calculations.tenant_rent_recalculation.
        constraints: ">= annual_adjusted_income_cents"
      - name: family_size
        type: integer
        source: input
        description: Number of household members.
        constraints: ">= 1"
      - name: status
        type: enum
        source: system
        description: Household lifecycle driven by state_machines.TenantHousehold.
        default: ACTIVE
        constraints: "ACTIVE | OPT_OUT_NOTICED | EV_ISSUED | MOVED_OUT"
      - name: move_out_date
        type: string
        source: system
        description: Logical-clock date recorded when the household moved out; null while occupying.
        default: null
      - name: current_ttp_cents
        type: integer
        source: computed
        description: ttp_cents of this household's TenantCertification with status == ACTIVE; null before the first certification.
        default: null
      - name: current_hap_cents
        type: integer
        source: computed
        description: hap_cents of this household's TenantCertification with status == ACTIVE; null before the first certification.
        default: null
      - name: ev_eligible
        type: boolean
        source: computed
        description: True once the household's RenewalCase notice track reached OPT_OUT_NOTICED, marking the household entitled to enhanced-voucher enhancement.
        default: false

  - name: TenantCertification
    parent: null
    common_fields: true
    fields:
      - name: tenant_id
        type: string
        source: input
        description: FK -> TenantHousehold.id; the certified household.
      - name: cert_type
        type: enum
        source: input
        description: Certification kind. Client writes may use INITIAL, ANNUAL or INTERIM only; UA_ADJUSTMENT is written exclusively by the utility-allowance apply cascade.
        constraints: "INITIAL | ANNUAL | INTERIM | UA_ADJUSTMENT"
      - name: effective_date
        type: string
        source: input
        description: ISO date the certification takes effect; subject to the CERT_BUFFER_DAYS spacing rule against the current ACTIVE certification.
      - name: utility_allowance_cents
        type: integer
        source: system
        description: Snapshot of Property.current_utility_allowance_cents at certification creation.
      - name: contract_rent_per_unit_cents
        type: integer
        source: system
        description: Snapshot of the household's HapContract contract_rent_per_unit_cents (renewed_rent_per_unit_cents when non-null) at certification creation.
      - name: gross_rent_cents
        type: integer
        source: computed
        description: contract_rent_per_unit_cents + utility_allowance_cents.
      - name: ttp_cents
        type: integer
        source: computed
        description: Total tenant payment from calculations.tenant_rent_recalculation.
      - name: tenant_rent_cents
        type: integer
        source: computed
        description: max(0, ttp_cents - utility_allowance_cents).
      - name: utility_reimbursement_cents
        type: integer
        source: computed
        description: max(0, utility_allowance_cents - ttp_cents).
      - name: hap_cents
        type: integer
        source: computed
        description: max(0, gross_rent_cents - ttp_cents); the per-household term summed by calculations.monthly_voucher_hap_request.
      - name: status
        type: enum
        source: system
        description: ACTIVE on creation; flipped to SUPERSEDED when a later certification for the same household is created.
        default: ACTIVE
        constraints: "ACTIVE | SUPERSEDED"

  - name: TenantNotice
    parent: null
    common_fields: true
    fields:
      - name: renewal_case_id
        type: string
        source: input
        description: FK -> RenewalCase.id; the case whose notification requirement this notice discharges.
      - name: tenant_id
        type: string
        source: input
        description: FK -> TenantHousehold.id; the single addressed household, or null for a project-wide notice.
        default: null
      - name: notice_type
        type: enum
        source: input
        description: Statutory notice kind; selects required_lead_days.
        constraints: "RENEWAL_INTENT | OPT_OUT_ONE_YEAR | TERMINATION_120_DAY | RENT_CHANGE"
      - name: issued_date
        type: string
        source: system
        description: Logical-clock date at which the notice was issued.
      - name: effective_date
        type: string
        source: input
        description: ISO date the noticed action takes effect.
      - name: lead_days
        type: integer
        source: computed
        description: Whole days from issued_date to effective_date (issue day excluded, effective day counted).
      - name: required_lead_days
        type: integer
        source: computed
        description: NOTICE_LEAD_DAYS[notice_type] from calculations.notice_window_compliance.
      - name: status
        type: enum
        source: system
        description: ISSUED at creation; RESCINDED after POST rescind.
        default: ISSUED
        constraints: "ISSUED | RESCINDED"
      - name: rescind_reason
        type: string
        source: system
        description: Reason captured at rescission; null while ISSUED.
        default: null

  - name: RestructuringDetermination
    parent: null
    common_fields: true
    fields:
      - name: renewal_case_id
        type: string
        source: input
        description: FK -> RenewalCase.id; the case whose restructuring eligibility was evaluated.
      - name: determination_state
        type: enum
        source: system
        description: Branching determination lifecycle driven by state_machines.RestructuringDetermination.
        default: DRAFT
        constraints: "DRAFT | MUTM_ELIGIBLE | M2M_REFERRED | INELIGIBLE | APPROVED"
      - name: market_rent_per_unit_cents
        type: integer
        source: system
        description: Snapshot of RenewalCase.comparable_market_rent_cents at evaluation.
      - name: current_rent_per_unit_cents
        type: integer
        source: system
        description: Snapshot of HapContract.contract_rent_per_unit_cents at evaluation.
      - name: fmr_per_unit_cents
        type: integer
        source: system
        description: Snapshot of Property.published_fmr_cents at evaluation.
      - name: eligibility_reason_code
        type: enum
        source: computed
        description: Deterministic reason emitted by calculations.restructuring_eligibility.
        constraints: "MARKET_ABOVE_CONTRACT_AND_FMR | CONTRACT_ABOVE_MARKET_FHA_INSURED | MARKET_NOT_ABOVE_CONTRACT | MARKET_BELOW_FMR_FLOOR | CONTRACT_TYPE_EXCLUDED"
      - name: post_restructure_rent_per_unit_cents
        type: integer
        source: computed
        description: Rent stamped on approval; equals market_rent_per_unit_cents for a MUTM_ELIGIBLE determination and round_half_up(M2M_RENT_PCT_OF_MARKET * market_rent_per_unit_cents) for an M2M_REFERRED determination. Null while not APPROVED.
        default: null
      - name: approved_by_user_id
        type: string
        source: system
        description: X-User-ID of the HudFieldOffice user who approved the determination; null before approval.
        default: null

  - name: EnhancedVoucher
    parent: null
    common_fields: true
    fields:
      - name: tenant_id
        type: string
        source: input
        description: FK -> TenantHousehold.id; the household receiving voucher enhancement.
      - name: renewal_case_id
        type: string
        source: input
        description: FK -> RenewalCase.id; the opting-out case that generated the entitlement.
      - name: state
        type: enum
        source: system
        description: Voucher lifecycle driven by state_machines.EnhancedVoucher.
        default: PENDING
        constraints: "PENDING | ISSUED | RESCINDED"
      - name: payment_standard_cents
        type: integer
        source: computed
        description: max(RenewalCase.comparable_market_rent_cents, Property.published_fmr_cents) + Property.current_utility_allowance_cents at record creation.
      - name: ttp_snapshot_cents
        type: integer
        source: computed
        description: ttp_cents of the household's ACTIVE TenantCertification at record creation.
      - name: entitlement_cents
        type: integer
        source: computed
        description: Output of calculations.enhanced_voucher_entitlement.
      - name: issuing_pha_user_id
        type: string
        source: system
        description: Opaque X-User-ID of the PhaAdministrator who issued the voucher; null while PENDING.
        default: null
      - name: issued_on_date
        type: string
        source: system
        description: Logical-clock date of issuance; null while PENDING.
        default: null

  - name: VoucherSubmission
    parent: null
    common_fields: true
    fields:
      - name: contract_id
        type: string
        source: input
        description: FK -> HapContract.id; the contract billed by this monthly voucher.
      - name: period_month
        type: string
        source: input
        description: Billing month in YYYY-MM form; unique per contract over rows with state != REVERSED.
      - name: state
        type: enum
        source: system
        description: Voucher lifecycle driven by state_machines.VoucherSubmission.
        default: DRAFT
        constraints: "DRAFT | SUBMITTED | PAID | REVERSED"
      - name: requested_hap_cents
        type: integer
        source: computed
        description: Output of calculations.monthly_voucher_hap_request, recomputed on create and on submit.
      - name: included_certification_count
        type: integer
        source: computed
        description: Number of TenantCertification rows entering the request for this period.
        default: 0
      - name: paid_amount_cents
        type: integer
        source: system
        description: Amount disbursed on payment; null while not PAID; retained after reversal for audit.
        default: null
      - name: paid_on_date
        type: string
        source: system
        description: Logical-clock date of payment; null while not PAID.
        default: null
      - name: reversal_reason
        type: string
        source: system
        description: Reason recorded when a paid voucher is reversed; null otherwise.
        default: null

  - name: SpecialClaim
    parent: null
    common_fields: true
    fields:
      - name: contract_id
        type: string
        source: input
        description: FK -> HapContract.id; the contract against which the claim is filed.
      - name: claim_type
        type: enum
        source: input
        description: Claim family; selects the branch of calculations.special_claim_amount.
        constraints: "VACANCY | UNPAID_RENT | TENANT_DAMAGES"
      - name: unit_number
        type: string
        source: input
        description: Unit the claim concerns; the aggregate 60-day vacancy cap is scoped to this unit.
      - name: claim_period_month
        type: string
        source: input
        description: YYYY-MM month whose VoucherSubmission must be PAID before this claim can be paid.
      - name: vacancy_start_date
        type: string
        source: input
        description: First vacant day (inclusive) for VACANCY claims; null otherwise.
        default: null
      - name: vacancy_end_date
        type: string
        source: input
        description: First re-rented day (exclusive) for a settled VACANCY claim; null when the unit is still vacant, which selects the PROJECTED_ESTIMATE variant.
        default: null
      - name: estimated_vacancy_days
        type: integer
        source: input
        description: Owner-estimated vacancy length used by the PROJECTED_ESTIMATE variant; null for settled claims.
        default: null
        constraints: ">= 1"
      - name: claimed_amount_cents
        type: integer
        source: input
        description: Owner-claimed amount in cents for UNPAID_RENT and TENANT_DAMAGES claims; null for VACANCY.
        default: null
        constraints: ">= 0"
      - name: security_deposit_balance_cents
        type: integer
        source: input
        description: Deposit funds still held, deducted from UNPAID_RENT and TENANT_DAMAGES claims.
        default: 0
        constraints: ">= 0"
      - name: vacancy_days_claimed
        type: integer
        source: computed
        description: Vacant day count entering the claim after the VACANCY_DAY_CAP truncation; 0 for non-vacancy claims.
        default: 0
      - name: valuation_variant
        type: enum
        source: computed
        description: ACTUAL_CHRONOLOGICAL when vacancy_end_date is non-null, PROJECTED_ESTIMATE when it is null; DIRECT_LEDGER for UNPAID_RENT and TENANT_DAMAGES.
        constraints: "ACTUAL_CHRONOLOGICAL | PROJECTED_ESTIMATE | DIRECT_LEDGER"
      - name: computed_amount_cents
        type: integer
        source: computed
        description: Output of calculations.special_claim_amount.
      - name: state
        type: enum
        source: system
        description: Claim lifecycle driven by state_machines.SpecialClaim (branching approve/deny).
        default: DRAFT
        constraints: "DRAFT | SUBMITTED | APPROVED | DENIED | PAID"
      - name: decision_reason
        type: string
        source: system
        description: Reviewer reason captured at decision; null before decision.
        default: null
      - name: paid_amount_cents
        type: integer
        source: system
        description: Amount disbursed on claim payment; null while not PAID.
        default: null

state_machines:
  - entity: HapContract
    initial_state: ACTIVE
    terminal_states: [RENEWED, EXPIRED_OPT_OUT]
    transitions:
      - from: ACTIVE
        to: RENEWAL_PENDING
        trigger: "POST /pbra/renewal-cases (RenewalCase created for this contract)"
        actor: OwnerAgent
        preconditions:
          - "HapContract.lifecycle_status == ACTIVE"
          - "0 < days from clock date to HapContract.expiration_date <= RENEWAL_WINDOW_DAYS"
          - "no RenewalCase exists for this contract_id with rent_track_status != EXECUTED"
        side_effects:
          - "HapContract.lifecycle_status := RENEWAL_PENDING"
          - "increments HapContract.version by 1"
      - from: RENEWAL_PENDING
        to: RENEWED
        trigger: "POST /pbra/renewal-cases/{id}/execute-renewal"
        actor: ContractAdministrator
        preconditions:
          - "RenewalCase.rent_track_status == RENTS_APPROVED"
          - "RenewalCase.notice_track_status == RENEWAL_NOTICED"
          - "expected_contract_version equals HapContract.version"
        side_effects:
          - "HapContract.renewed_rent_per_unit_cents := RenewalCase.approved_rent_per_unit_cents"
          - "HapContract.renewed_option := RenewalCase.renewal_option"
          - "HapContract.renewed_expiration_date := expiration_date advanced by term_months whole months"
          - "HapContract.lifecycle_status := RENEWED"
          - "RenewalCase.rent_track_status := EXECUTED"
          - "increments HapContract.version by 1"
      - from: RENEWAL_PENDING
        to: OPT_OUT_PENDING
        trigger: "POST /pbra/renewal-cases/{id}/record-opt-out"
        actor: OwnerAgent
        preconditions:
          - "RenewalCase.notice_track_status == NOTICES_PENDING"
          - "a TenantNotice exists on the case with notice_type == OPT_OUT_ONE_YEAR and status == ISSUED"
        side_effects:
          - "HapContract.lifecycle_status := OPT_OUT_PENDING (cascade hop 1 of transitive_cascade opt_out_enhancement_chain)"
          - "increments HapContract.version by 1"
      - from: OPT_OUT_PENDING
        to: RENEWAL_PENDING
        trigger: "POST /pbra/tenant-notices/{id}/rescind (rescinding the notice referenced by RenewalCase.opt_out_notice_id)"
        actor: OwnerAgent
        preconditions:
          - "RenewalCase.notice_track_status == OPT_OUT_NOTICED"
          - "no EnhancedVoucher on the case has state == ISSUED"
        side_effects:
          - "HapContract.lifecycle_status := RENEWAL_PENDING (compensation for the opt-out cascade)"
          - "increments HapContract.version by 1"
        note: "Cyclic return; the contract re-enters the renewal path with all opt-out side effects reversed."
      - from: OPT_OUT_PENDING
        to: EXPIRED_OPT_OUT
        trigger: "POST /pbra/renewal-cases/{id}/finalize-opt-out"
        actor: ContractAdministrator
        preconditions:
          - "RenewalCase.notice_track_status == OPT_OUT_NOTICED"
          - "clock date >= TenantNotice(RenewalCase.opt_out_notice_id).effective_date"
          - "every TenantHousehold of the property with status IN {OPT_OUT_NOTICED} has an EnhancedVoucher with state == ISSUED"
        side_effects:
          - "HapContract.lifecycle_status := EXPIRED_OPT_OUT"
          - "RenewalCase.notice_track_status := OPT_OUT_FINALIZED"
          - "increments HapContract.version by 1"

  - entity: RenewalCase
    initial_state: TERMS_PENDING
    terminal_states: [EXECUTED]
    note: "Parallel dimension 1 of 2 — rent_track_status. Evolves independently of notice_track_status; the only coupling point is execute-renewal, which reads both."
    transitions:
      - from: TERMS_PENDING
        to: OPTION_SELECTED
        trigger: "POST /pbra/renewal-cases/{id}/select-option"
        actor: OwnerAgent
        preconditions:
          - "RenewalCase.rent_track_status == TERMS_PENDING"
          - "renewal_option is permitted for HapContract.contract_type per OPTION_TYPE_MATRIX"
        side_effects:
          - "RenewalCase.renewal_option := body.renewal_option"
          - "RenewalCase.rcs_required := true when renewal_option == OPTION_1_MARK_UP_TO_MARKET else unchanged"
          - "recompute RenewalCase.ocaf_rent_per_unit_cents via calculations.ocaf_adjusted_rent"
          - "recompute RenewalCase.budget_rent_per_unit_cents via calculations.budget_based_rent"
      - from: OPTION_SELECTED
        to: OPTION_SELECTED
        trigger: "POST /pbra/renewal-cases/{id}/elect-adjustment"
        actor: OwnerAgent
        preconditions:
          - "RenewalCase.rent_track_status == OPTION_SELECTED"
          - "RenewalCase.adjustment_method is null (the election is one-shot)"
          - "body.adjustment_method == OCAF when RenewalCase.renewal_option == OPTION_1_MARK_UP_TO_MARKET"
        side_effects:
          - "RenewalCase.adjustment_method := body.adjustment_method"
          - "RenewalCase.rcs_required := true when body.adjustment_method == BUDGET_BASED or renewal_option == OPTION_1_MARK_UP_TO_MARKET"
          - "recompute RenewalCase.ocaf_rent_per_unit_cents and RenewalCase.budget_rent_per_unit_cents"
        note: "Self-transition on the rent-track dimension; the status label is unchanged but the election and both candidate rents are written."
      - from: OPTION_SELECTED
        to: RCS_IN_PROGRESS
        trigger: "POST /pbra/rent-comparability-studies (first study filed on this case)"
        actor: OwnerAgent
        preconditions:
          - "RenewalCase.rent_track_status == OPTION_SELECTED"
          - "RenewalCase.adjustment_method is not null"
        side_effects:
          - "RenewalCase.rent_track_status := RCS_IN_PROGRESS"
      - from: RCS_IN_PROGRESS
        to: RENTS_APPROVED
        trigger: "POST /pbra/renewal-cases/{id}/approve-rents"
        actor: ContractAdministrator
        preconditions:
          - "RenewalCase.rent_track_status == RCS_IN_PROGRESS"
          - "the RentComparabilityStudy on this case with state == ACCEPTED exists (cross-entity guard)"
          - "X-User-ID != RenewalCase.challenge_reviewer_user_id (segregation of duties)"
          - "calculations.renewal_rent_determination output <= RenewalCase.comparable_market_rent_cents when rcs_required is true and adjustment_method == OCAF"
          - "calculations.renewal_rent_determination output <= round_half_up(BUDGET_RENT_CAP_PCT * comparable_market_rent_cents) when adjustment_method == BUDGET_BASED"
        side_effects:
          - "RenewalCase.approved_rent_per_unit_cents := calculations.renewal_rent_determination output"
          - "RenewalCase.rents_approver_user_id := X-User-ID"
          - "RenewalCase.rent_track_status := RENTS_APPROVED"
      - from: OPTION_SELECTED
        to: RENTS_APPROVED
        trigger: "POST /pbra/renewal-cases/{id}/approve-rents"
        actor: ContractAdministrator
        preconditions:
          - "RenewalCase.rcs_required == false"
          - "RenewalCase.adjustment_method == OCAF"
          - "X-User-ID != RenewalCase.challenge_reviewer_user_id"
        side_effects:
          - "RenewalCase.approved_rent_per_unit_cents := RenewalCase.ocaf_rent_per_unit_cents (uncapped: no ACCEPTED study exists)"
          - "RenewalCase.rents_approver_user_id := X-User-ID"
          - "RenewalCase.rent_track_status := RENTS_APPROVED"
        note: "Fork alternative to the RCS_IN_PROGRESS path — an OCAF renewal at or below comparable rents needs no study."
      - from: RENTS_APPROVED
        to: EXECUTED
        trigger: "POST /pbra/renewal-cases/{id}/execute-renewal"
        actor: ContractAdministrator
        preconditions:
          - "RenewalCase.notice_track_status == RENEWAL_NOTICED"
          - "expected_contract_version equals HapContract.version"
        side_effects:
          - "RenewalCase.rent_track_status := EXECUTED"
          - "HapContract transitions RENEWAL_PENDING -> RENEWED (see state_machines.HapContract)"

  - entity: RenewalCase
    initial_state: NOTICES_PENDING
    terminal_states: [OPT_OUT_FINALIZED]
    note: "Parallel dimension 2 of 2 — notice_track_status. Cyclic: OPT_OUT_NOTICED returns to NOTICES_PENDING on notice rescission."
    transitions:
      - from: NOTICES_PENDING
        to: RENEWAL_NOTICED
        trigger: "POST /pbra/tenant-notices with notice_type == RENEWAL_INTENT"
        actor: OwnerAgent
        preconditions:
          - "RenewalCase.notice_track_status == NOTICES_PENDING"
          - "TenantNotice.lead_days >= NOTICE_LEAD_DAYS.RENEWAL_INTENT"
        side_effects:
          - "RenewalCase.notice_track_status := RENEWAL_NOTICED"
      - from: NOTICES_PENDING
        to: OPT_OUT_NOTICED
        trigger: "POST /pbra/renewal-cases/{id}/record-opt-out"
        actor: OwnerAgent
        preconditions:
          - "RenewalCase.notice_track_status == NOTICES_PENDING"
          - "a TenantNotice on the case has notice_type == OPT_OUT_ONE_YEAR and status == ISSUED"
        side_effects:
          - "RenewalCase.notice_track_status := OPT_OUT_NOTICED; RenewalCase.opt_out_notice_id := that notice id"
          - "HapContract.lifecycle_status := OPT_OUT_PENDING (cascade hop 1)"
          - "hop 2, caused by hop 1: every TenantHousehold of the property with status == ACTIVE transitions to OPT_OUT_NOTICED and gets ev_eligible := true"
          - "hop 3, caused by hop 2: one EnhancedVoucher row in state PENDING is created per household that became ev_eligible, with payment_standard_cents, ttp_snapshot_cents and entitlement_cents computed via calculations.enhanced_voucher_entitlement (household processing order created_at ASC)"
      - from: OPT_OUT_NOTICED
        to: NOTICES_PENDING
        trigger: "POST /pbra/tenant-notices/{id}/rescind (notice referenced by RenewalCase.opt_out_notice_id)"
        actor: OwnerAgent
        preconditions:
          - "RenewalCase.notice_track_status == OPT_OUT_NOTICED"
          - "no EnhancedVoucher on this case has state == ISSUED"
        side_effects:
          - "TenantNotice.status := RESCINDED"
          - "RenewalCase.notice_track_status := NOTICES_PENDING; RenewalCase.opt_out_notice_id := null"
          - "HapContract.lifecycle_status := RENEWAL_PENDING"
          - "every EnhancedVoucher on this case with state == PENDING transitions to RESCINDED"
          - "every TenantHousehold with status == OPT_OUT_NOTICED returns to ACTIVE with ev_eligible := false"
      - from: OPT_OUT_NOTICED
        to: OPT_OUT_FINALIZED
        trigger: "POST /pbra/renewal-cases/{id}/finalize-opt-out"
        actor: ContractAdministrator
        preconditions:
          - "clock date >= TenantNotice(opt_out_notice_id).effective_date"
          - "every TenantHousehold with status == OPT_OUT_NOTICED has an EnhancedVoucher with state == ISSUED"
        side_effects:
          - "RenewalCase.notice_track_status := OPT_OUT_FINALIZED"
          - "HapContract.lifecycle_status := EXPIRED_OPT_OUT"

  - entity: RentComparabilityStudy
    initial_state: DRAFT
    terminal_states: [ACCEPTED, SUPERSEDED]
    note: "Cyclic negotiation: SUBMITTED -> CHALLENGED -> SUBMITTED, bounded by MAX_CHALLENGE_ROUNDS."
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /pbra/rent-comparability-studies/{id}/submit"
        actor: OwnerAgent
        preconditions:
          - "RentComparabilityStudy.state == DRAFT"
          - "accepted_comparable_count >= 1"
        side_effects:
          - "recompute estimated_market_rent_cents via calculations.comparable_market_rent"
          - "submitted_on_date := clock date"
          - "state := SUBMITTED"
      - from: SUBMITTED
        to: CHALLENGED
        trigger: "POST /pbra/rent-comparability-studies/{id}/challenge"
        actor: ContractAdministrator
        preconditions:
          - "RentComparabilityStudy.state == SUBMITTED"
          - "challenge_round < MAX_CHALLENGE_ROUNDS"
          - "every id in body.struck_comparable_ids is a Comparable of this study with status == ACCEPTED"
        side_effects:
          - "each named Comparable.status := STRUCK"
          - "challenge_round := challenge_round + 1; last_challenge_reason := body.reason"
          - "recompute accepted_comparable_count and estimated_market_rent_cents over the remaining ACCEPTED comparables"
          - "RenewalCase.challenge_reviewer_user_id := X-User-ID (locks this reviewer out of approve-rents)"
          - "RenewalCase.comparable_market_rent_cents stays null (no ACCEPTED study yet)"
          - "state := CHALLENGED"
      - from: CHALLENGED
        to: SUBMITTED
        trigger: "POST /pbra/rent-comparability-studies/{id}/submit"
        actor: OwnerAgent
        preconditions:
          - "RentComparabilityStudy.state == CHALLENGED"
          - "accepted_comparable_count >= 1"
        side_effects:
          - "recompute estimated_market_rent_cents over the surviving ACCEPTED comparables (including any added after the challenge)"
          - "submitted_on_date := clock date"
          - "state := SUBMITTED"
        note: "Closes the negotiation cycle; challenge_round is not reset."
      - from: SUBMITTED
        to: ACCEPTED
        trigger: "POST /pbra/rent-comparability-studies/{id}/decide with decision == ACCEPT"
        actor: ContractAdministrator
        preconditions:
          - "RentComparabilityStudy.state == SUBMITTED"
          - "accepted_comparable_count >= 1"
        side_effects:
          - "state := ACCEPTED"
          - "RenewalCase.comparable_market_rent_cents := estimated_market_rent_cents"
          - "recompute RenewalCase.ocaf_rent_per_unit_cents (comparable cap now applies when rcs_required) and RenewalCase.budget_rent_per_unit_cents"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /pbra/rent-comparability-studies/{id}/decide with decision == REJECT"
        actor: ContractAdministrator
        preconditions:
          - "RentComparabilityStudy.state == SUBMITTED"
        side_effects:
          - "state := REJECTED; last_challenge_reason := body.reason"
          - "Owner.compliance_flag := REVIEW_REQUIRED for the Owner of the case's Property (cross-aggregate cascade)"
      - from: REJECTED
        to: SUPERSEDED
        trigger: "POST /pbra/rent-comparability-studies with supersedes_study_id == this id"
        actor: OwnerAgent
        preconditions:
          - "RentComparabilityStudy.state == REJECTED"
          - "the superseding study's renewal_case_id equals this study's renewal_case_id"
        side_effects:
          - "state := SUPERSEDED"
          - "the new study is created in DRAFT with challenge_round 0"

  - entity: UtilityAllowanceAnalysis
    initial_state: DRAFT
    terminal_states: [APPLIED]
    note: "Rejection cycles back to SUBMITTED without re-entering DRAFT."
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /pbra/utility-allowance-analyses/{id}/submit"
        actor: OwnerAgent
        preconditions:
          - "UtilityAllowanceAnalysis.state == DRAFT"
          - "no other UtilityAllowanceAnalysis on the same property_id has state IN {SUBMITTED, APPROVED}"
        side_effects:
          - "state := SUBMITTED"
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /pbra/utility-allowance-analyses/{id}/decide with decision == ACCEPT"
        actor: ContractAdministrator | HudFieldOffice
        preconditions:
          - "UtilityAllowanceAnalysis.state == SUBMITTED"
          - "X-User-Role == HudFieldOffice when requires_field_office_approval is true"
        side_effects:
          - "state := APPROVED; approver_user_id := X-User-ID"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /pbra/utility-allowance-analyses/{id}/decide with decision == REJECT"
        actor: ContractAdministrator | HudFieldOffice
        preconditions:
          - "UtilityAllowanceAnalysis.state == SUBMITTED"
        side_effects:
          - "state := REJECTED; approver_user_id := X-User-ID"
      - from: REJECTED
        to: SUBMITTED
        trigger: "POST /pbra/utility-allowance-analyses/{id}/submit"
        actor: OwnerAgent
        preconditions:
          - "UtilityAllowanceAnalysis.state == REJECTED"
          - "no other UtilityAllowanceAnalysis on the same property_id has state IN {SUBMITTED, APPROVED}"
        side_effects:
          - "state := SUBMITTED"
      - from: APPROVED
        to: APPLIED
        trigger: "POST /pbra/utility-allowance-analyses/{id}/apply"
        actor: ContractAdministrator
        preconditions:
          - "UtilityAllowanceAnalysis.state == APPROVED"
          - "effective_date >= Property.last_applied_ua_effective_date + UA_COVERAGE_MONTHS whole months, or last_applied_ua_effective_date is null"
          - "expected_property_version equals Property.version"
        side_effects:
          - "state := APPLIED; applied_on_date := clock date (cascade hop 1 of transitive_cascade ua_apply_recert_chain)"
          - "hop 2, caused by hop 1: Property.current_utility_allowance_cents := proposed_allowance_cents and Property.last_applied_ua_effective_date := effective_date; increments Property.version by 1"
          - "hop 3, caused by hop 2: for every TenantHousehold of the property with status IN {ACTIVE, OPT_OUT_NOTICED, EV_ISSUED}, in created_at ASC order, the ACTIVE TenantCertification is flipped to SUPERSEDED and a replacement TenantCertification with cert_type == UA_ADJUSTMENT and effective_date == this analysis effective_date is created, recomputing ttp_cents, tenant_rent_cents, utility_reimbursement_cents and hap_cents via calculations.tenant_rent_recalculation; recertified_tenant_count is set to the number created"
          - "hop 4, caused by hop 3: every VoucherSubmission of the property's HapContract with state == DRAFT has requested_hap_cents and included_certification_count recomputed via calculations.monthly_voucher_hap_request against the new certifications"

  - entity: TenantHousehold
    initial_state: ACTIVE
    terminal_states: [MOVED_OUT]
    transitions:
      - from: ACTIVE
        to: OPT_OUT_NOTICED
        trigger: "system event: RenewalCase notice track NOTICES_PENDING -> OPT_OUT_NOTICED"
        actor: system
        preconditions:
          - "TenantHousehold.status == ACTIVE"
          - "TenantHousehold.property_id equals the case's contract's property_id"
        side_effects:
          - "status := OPT_OUT_NOTICED; ev_eligible := true"
          - "an EnhancedVoucher row in state PENDING is created for this household"
      - from: OPT_OUT_NOTICED
        to: ACTIVE
        trigger: "system event: RenewalCase notice track OPT_OUT_NOTICED -> NOTICES_PENDING (opt-out notice rescinded)"
        actor: system
        preconditions:
          - "TenantHousehold.status == OPT_OUT_NOTICED"
        side_effects:
          - "status := ACTIVE; ev_eligible := false"
      - from: OPT_OUT_NOTICED
        to: EV_ISSUED
        trigger: "POST /pbra/enhanced-vouchers/{id}/issue"
        actor: PhaAdministrator
        preconditions:
          - "TenantHousehold.status == OPT_OUT_NOTICED"
          - "EnhancedVoucher.state == PENDING and entitlement_cents > 0"
        side_effects:
          - "status := EV_ISSUED"
          - "Property.units_under_hap_count decremented by 1 and Property.enhanced_voucher_unit_count incremented by 1 (assisted_unit_count conserved)"
      - from: EV_ISSUED
        to: OPT_OUT_NOTICED
        trigger: "POST /pbra/enhanced-vouchers/{id}/rescind"
        actor: PhaAdministrator
        preconditions:
          - "TenantHousehold.status == EV_ISSUED"
          - "EnhancedVoucher.state == ISSUED"
        side_effects:
          - "status := OPT_OUT_NOTICED"
          - "Property.enhanced_voucher_unit_count decremented by 1 and Property.units_under_hap_count incremented by 1 (compensation; assisted_unit_count conserved)"
      - from: ACTIVE
        to: MOVED_OUT
        trigger: "POST /pbra/tenant-households/{id}/move-out"
        actor: OwnerAgent
        preconditions:
          - "TenantHousehold.status == ACTIVE"
          - "body.move_out_date >= the household's ACTIVE TenantCertification effective_date"
        side_effects:
          - "status := MOVED_OUT; move_out_date := body.move_out_date"
          - "Property.units_under_hap_count decremented by 1 and Property.released_unit_count incremented by 1"
          - "the ACTIVE TenantCertification remains ACTIVE so calculations.monthly_voucher_hap_request can prorate the departure month"
      - from: EV_ISSUED
        to: MOVED_OUT
        trigger: "POST /pbra/tenant-households/{id}/move-out"
        actor: OwnerAgent
        preconditions:
          - "TenantHousehold.status == EV_ISSUED"
        side_effects:
          - "status := MOVED_OUT; move_out_date := body.move_out_date"
          - "Property.enhanced_voucher_unit_count and Property.units_under_hap_count are unchanged (the unit already left project-based assistance at issuance)"

  - entity: EnhancedVoucher
    initial_state: PENDING
    terminal_states: [RESCINDED]
    transitions:
      - from: PENDING
        to: ISSUED
        trigger: "POST /pbra/enhanced-vouchers/{id}/issue"
        actor: PhaAdministrator
        preconditions:
          - "EnhancedVoucher.state == PENDING"
          - "entitlement_cents > 0"
          - "the case's HapContract.lifecycle_status == OPT_OUT_PENDING"
        side_effects:
          - "state := ISSUED; issuing_pha_user_id := X-User-ID; issued_on_date := clock date"
          - "TenantHousehold transitions OPT_OUT_NOTICED -> EV_ISSUED with the paired Property unit-count moves"
      - from: ISSUED
        to: RESCINDED
        trigger: "POST /pbra/enhanced-vouchers/{id}/rescind"
        actor: PhaAdministrator
        preconditions:
          - "EnhancedVoucher.state == ISSUED"
          - "the household has status == EV_ISSUED (not MOVED_OUT)"
        side_effects:
          - "state := RESCINDED"
          - "TenantHousehold transitions EV_ISSUED -> OPT_OUT_NOTICED with the paired Property unit-count reversal"
      - from: PENDING
        to: RESCINDED
        trigger: "system event: RenewalCase notice track OPT_OUT_NOTICED -> NOTICES_PENDING"
        actor: system
        preconditions:
          - "EnhancedVoucher.state == PENDING"
        side_effects:
          - "state := RESCINDED (no Property unit-count change; a PENDING voucher never moved a unit)"

  - entity: RestructuringDetermination
    initial_state: DRAFT
    terminal_states: [INELIGIBLE, APPROVED]
    note: "Branching fork-join: DRAFT forks to one of three states; two of them join at APPROVED with divergent side-effect sets."
    transitions:
      - from: DRAFT
        to: MUTM_ELIGIBLE
        trigger: "POST /pbra/restructuring-determinations/{id}/evaluate"
        actor: ContractAdministrator
        preconditions:
          - "RestructuringDetermination.determination_state == DRAFT"
          - "calculations.restructuring_eligibility returns MUTM_ELIGIBLE"
        side_effects:
          - "determination_state := MUTM_ELIGIBLE; eligibility_reason_code := MARKET_ABOVE_CONTRACT_AND_FMR"
      - from: DRAFT
        to: M2M_REFERRED
        trigger: "POST /pbra/restructuring-determinations/{id}/evaluate"
        actor: ContractAdministrator
        preconditions:
          - "RestructuringDetermination.determination_state == DRAFT"
          - "calculations.restructuring_eligibility returns M2M_REFERRED"
        side_effects:
          - "determination_state := M2M_REFERRED; eligibility_reason_code := CONTRACT_ABOVE_MARKET_FHA_INSURED"
      - from: DRAFT
        to: INELIGIBLE
        trigger: "POST /pbra/restructuring-determinations/{id}/evaluate"
        actor: ContractAdministrator
        preconditions:
          - "RestructuringDetermination.determination_state == DRAFT"
          - "calculations.restructuring_eligibility returns INELIGIBLE"
        side_effects:
          - "determination_state := INELIGIBLE; eligibility_reason_code := the returned reason code"
      - from: MUTM_ELIGIBLE
        to: APPROVED
        trigger: "POST /pbra/restructuring-determinations/{id}/approve"
        actor: HudFieldOffice
        preconditions:
          - "determination_state == MUTM_ELIGIBLE"
          - "RenewalCase.renewal_option == OPTION_1_MARK_UP_TO_MARKET"
        side_effects:
          - "determination_state := APPROVED; approved_by_user_id := X-User-ID"
          - "post_restructure_rent_per_unit_cents := market_rent_per_unit_cents (mark-up-to-market branch)"
          - "RenewalCase.ocaf_rent_per_unit_cents := market_rent_per_unit_cents so approve-rents settles at the market rent"
      - from: M2M_REFERRED
        to: APPROVED
        trigger: "POST /pbra/restructuring-determinations/{id}/approve"
        actor: HudFieldOffice
        preconditions:
          - "determination_state == M2M_REFERRED"
          - "RenewalCase.renewal_option == OPTION_3_MARK_TO_MARKET"
        side_effects:
          - "determination_state := APPROVED; approved_by_user_id := X-User-ID"
          - "post_restructure_rent_per_unit_cents := round_half_up(M2M_RENT_PCT_OF_MARKET * market_rent_per_unit_cents) (mark-to-market debt-restructuring branch)"
          - "RenewalCase.ocaf_rent_per_unit_cents := post_restructure_rent_per_unit_cents"

  - entity: VoucherSubmission
    initial_state: DRAFT
    terminal_states: [REVERSED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /pbra/voucher-submissions/{id}/submit"
        actor: OwnerAgent
        preconditions:
          - "VoucherSubmission.state == DRAFT"
          - "clock date >= first day of the month after period_month"
          - "requested_hap_cents > 0"
        side_effects:
          - "recompute requested_hap_cents and included_certification_count via calculations.monthly_voucher_hap_request"
          - "state := SUBMITTED"
      - from: SUBMITTED
        to: PAID
        trigger: "POST /pbra/voucher-submissions/{id}/pay"
        actor: ContractAdministrator
        preconditions:
          - "VoucherSubmission.state == SUBMITTED"
          - "requested_hap_cents <= HapContract.hap_ledger_balance_cents"
        side_effects:
          - "state := PAID; paid_amount_cents := requested_hap_cents; paid_on_date := clock date"
          - "HapContract.paid_hap_total_cents increased by paid_amount_cents and hap_ledger_balance_cents recomputed; increments HapContract.version by 1"
      - from: PAID
        to: REVERSED
        trigger: "POST /pbra/voucher-submissions/{id}/reverse"
        actor: ContractAdministrator
        preconditions:
          - "VoucherSubmission.state == PAID"
          - "no SpecialClaim with claim_period_month == this period_month has state == PAID"
        side_effects:
          - "state := REVERSED; reversal_reason := body.reason; paid_amount_cents retained for audit"
          - "HapContract.paid_hap_total_cents decreased by paid_amount_cents and hap_ledger_balance_cents recomputed (compensation restoring calculations.hap_budget_conservation); increments HapContract.version by 1"

  - entity: SpecialClaim
    initial_state: DRAFT
    terminal_states: [DENIED, PAID]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /pbra/special-claims/{id}/submit"
        actor: OwnerAgent
        preconditions:
          - "SpecialClaim.state == DRAFT"
          - "computed_amount_cents > 0"
          - "aggregate vacancy_days_claimed for this contract_id and unit_number over claims with state IN {SUBMITTED, APPROVED, PAID} plus this claim <= VACANCY_DAY_CAP"
        side_effects:
          - "recompute computed_amount_cents via calculations.special_claim_amount"
          - "state := SUBMITTED"
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /pbra/special-claims/{id}/decide with decision == APPROVE"
        actor: ContractAdministrator
        preconditions:
          - "SpecialClaim.state == SUBMITTED"
        side_effects:
          - "state := APPROVED; decision_reason := body.reason"
      - from: SUBMITTED
        to: DENIED
        trigger: "POST /pbra/special-claims/{id}/decide with decision == DENY"
        actor: ContractAdministrator
        preconditions:
          - "SpecialClaim.state == SUBMITTED"
        side_effects:
          - "state := DENIED; decision_reason := body.reason"
      - from: APPROVED
        to: PAID
        trigger: "POST /pbra/special-claims/{id}/pay"
        actor: ContractAdministrator
        preconditions:
          - "SpecialClaim.state == APPROVED"
          - "the VoucherSubmission with contract_id == SpecialClaim.contract_id and period_month == SpecialClaim.claim_period_month has state == PAID (cross-entity guard)"
          - "computed_amount_cents <= HapContract.hap_ledger_balance_cents"
        side_effects:
          - "state := PAID; paid_amount_cents := computed_amount_cents"
          - "HapContract.paid_claims_total_cents increased by paid_amount_cents and hap_ledger_balance_cents recomputed; increments HapContract.version by 1"

  - entity: TenantCertification
    initial_state: ACTIVE
    terminal_states: [SUPERSEDED]
    transitions:
      - from: ACTIVE
        to: SUPERSEDED
        trigger: "system event: a later TenantCertification is created for the same tenant_id (client write or utility-allowance apply cascade)"
        actor: system
        preconditions:
          - "TenantCertification.status == ACTIVE"
          - "the new certification's effective_date >= this certification's effective_date"
        side_effects:
          - "status := SUPERSEDED"
          - "TenantHousehold.current_ttp_cents and current_hap_cents are re-pointed at the new ACTIVE certification"

  - entity: TenantNotice
    initial_state: ISSUED
    terminal_states: [RESCINDED]
    transitions:
      - from: ISSUED
        to: RESCINDED
        trigger: "POST /pbra/tenant-notices/{id}/rescind"
        actor: OwnerAgent
        preconditions:
          - "TenantNotice.status == ISSUED"
          - "no EnhancedVoucher on the notice's RenewalCase has state == ISSUED when notice_type == OPT_OUT_ONE_YEAR"
        side_effects:
          - "status := RESCINDED; rescind_reason := body.reason"
          - "when this notice is RenewalCase.opt_out_notice_id, the notice track returns OPT_OUT_NOTICED -> NOTICES_PENDING with the full opt-out compensation chain"
          - "when notice_type == RENEWAL_INTENT and notice_track_status == RENEWAL_NOTICED, notice_track_status := NOTICES_PENDING"

concurrency_rules:
  - rule_id: cert-create-stale-tenant
    parent_entity: TenantHousehold
    write_endpoint: "POST /pbra/tenant-certifications"
    occ_field: "expected_tenant_version"
    description: |
      Creating a TenantCertification against a TenantHousehold whose version has advanced since the
      client last observed it is rejected. Chained recertifications are legitimate — a second
      certification with a later effective_date supersedes the first under state_machines
      TenantCertification — so the write cannot be refused on state grounds; the stale
      expected_tenant_version is what identifies a client whose view of the household (income,
      status, current certification) predates an intervening recertification or apply cascade.
    error_id: ERR_STALE_TENANT_VERSION
    http_status: 412

  - rule_id: voucher-create-stale-contract
    parent_entity: HapContract
    write_endpoint: "POST /pbra/voucher-submissions"
    occ_field: "expected_contract_version"
    description: |
      Creating a VoucherSubmission against a HapContract whose version has advanced since the client
      last observed it is rejected. Monthly vouchers for distinct period_month values legitimately
      coexist on one contract, so a later create is never refused on state grounds; the stale
      expected_contract_version identifies a client whose rent basis and ledger balance predate an
      intervening payment, reversal, paid claim or renewal execution.
    error_id: ERR_STALE_CONTRACT_VERSION
    http_status: 412

  - rule_id: ua-apply-stale-property
    parent_entity: Property
    write_endpoint: "POST /pbra/utility-allowance-analyses/{id}/apply"
    occ_field: "expected_property_version"
    description: |
      Applying a UtilityAllowanceAnalysis against a Property whose version has advanced since the
      client last observed it is rejected. Successive allowance applications are legitimate once
      UA_COVERAGE_MONTHS have elapsed, so the apply cannot be refused on state grounds; the stale
      expected_property_version identifies an applier whose baseline allowance and unit counts
      predate an intervening apply or enhanced-voucher issuance.
    error_id: ERR_STALE_PROPERTY_VERSION
    http_status: 412

calculations:
  - name: comparable_market_rent
    trigger: "POST /pbra/comparables; POST /pbra/rent-comparability-studies/{id}/submit; POST /pbra/rent-comparability-studies/{id}/challenge — writes RentComparabilityStudy.estimated_market_rent_cents"
    algorithm: weighted_scoring
    formula: |
      # STEP 1 (per comparable, rounding happens HERE first — this order is pinned)
      for each c in comparables(study_id) where c.status == ACCEPTED, iterated created_at ASC:
          gross_c = c.raw_rent_cents + c.adjustment_total_cents + c.utility_adjustment_cents
          c.adjusted_rent_cents = round_half_up_to_whole_dollar(gross_c)   # nearest 100 cents
      # STEP 2 (weighted mean over the already-rounded values)
      weighted_sum = SUM over accepted c of (c.adjusted_rent_cents * c.weight)
      total_weight = SUM over accepted c of c.weight
      # STEP 3 (single final rounding to whole cents)
      estimated_market_rent_cents = round_half_up(weighted_sum / total_weight)   # 0 decimal places, cents
      # REJECTED ALTERNATIVE (must NOT be implemented): computing the weighted mean over the
      # unrounded gross_c values and rounding once at the end. With the reference fixture
      # (131150/w3, 123600/w2, 140425/w1) the pinned order yields 130200 while the rejected
      # order yields 130179.
      if total_weight == 0 (no ACCEPTED comparable): estimated_market_rent_cents = null
    input_set: "Comparable rows with study_id == this study and status == ACCEPTED. STRUCK comparables are excluded from both the weighted sum and total_weight."
    constants: {}
    precision: "Per-comparable rounding to whole dollars (100 cents) half-up; final weighted mean rounded half-up to whole cents. Both rounding steps are mandatory and ordered."
    variants: []

  - name: ocaf_adjusted_rent
    trigger: "POST /pbra/renewal-cases/{id}/select-option; POST /pbra/renewal-cases/{id}/elect-adjustment; POST /pbra/restructuring-determinations/{id}/approve — writes RenewalCase.ocaf_rent_per_unit_cents"
    algorithm: threshold
    formula: |
      factor = OCAF_FACTORS[Property.state_code]
      non_debt_portion = max(0, HapContract.contract_rent_per_unit_cents
                                - HapContract.monthly_debt_service_per_unit_cents)
      raw = round_half_up(non_debt_portion * factor) + HapContract.monthly_debt_service_per_unit_cents
      ocaf_rent_per_unit_cents = raw
      # NOT capped here: the comparable-market ceiling is enforced at approval by
      # validations[priority=70]. Silently capping raw at RenewalCase.comparable_market_rent_cents
      # is a REJECTED ALTERNATIVE - it would make ERR_RENT_EXCEEDS_COMPARABLE unreachable and
      # would hide an over-market OCAF escalation from the contract administrator.
    input_set: "The RenewalCase's HapContract rent components and the Property state_code; the cap term reads RenewalCase.comparable_market_rent_cents, which is non-null only while a study with state == ACCEPTED exists."
    constants:
      OCAF_FACTORS: { IL: 1.032, TX: 1.028 }
    precision: "The OCAF product is rounded half-up to whole cents BEFORE the debt-service add-back; adding first and rounding once is a different number and is not permitted. The factor also applies to the non-debt portion ONLY: for the reference contract (rent 118000, debt 32000, IL) the pinned formula yields 120752, while escalating the whole rent (round_half_up(118000 * 1.032) = 121776) is a REJECTED ALTERNATIVE."
    variants: []

  - name: budget_based_rent
    trigger: "POST /pbra/renewal-cases/{id}/select-option; POST /pbra/renewal-cases/{id}/elect-adjustment — writes RenewalCase.budget_rent_per_unit_cents"
    algorithm: constraint_propagation
    formula: |
      # The management fee is defined as a percentage of the total budget-based rent, and the total
      # budget-based rent includes the management fee. The evaluation order below is PINNED to a
      # single forward pass; the algebraic fixed point is explicitly NOT the rule.
      # STEP 1
      base_before_fee = HapContract.operating_expense_per_unit_cents
                      + HapContract.monthly_debt_service_per_unit_cents
                      + HapContract.reserve_deposit_per_unit_cents
      # STEP 2 — the fee is levied on the STEP 1 subtotal, not on the final total
      management_fee_cents = round_half_up(MANAGEMENT_FEE_PCT * base_before_fee)
      # STEP 3 — single pass, no re-iteration of STEP 2 against the new total
      budget_rent_per_unit_cents = base_before_fee + management_fee_cents
      # REJECTED ALTERNATIVES (must NOT be implemented):
      #   fixed point           base_before_fee / (1 - MANAGEMENT_FEE_PCT)  -> 105978 for the
      #                         reference fixture where the pinned order yields 105300
      #   second iteration      base_before_fee + round(pct * (base_before_fee + fee_1)) -> 105924
    input_set: "The three per-unit budget components on the RenewalCase's HapContract. No Property or tenant data enters."
    constants:
      MANAGEMENT_FEE_PCT: 0.08
    precision: "One rounding, half-up to whole cents, applied to the fee term only; the subtotal and total are exact integer sums."
    variants: []

  - name: renewal_rent_determination
    trigger: "POST /pbra/renewal-cases/{id}/approve-rents — writes RenewalCase.approved_rent_per_unit_cents"
    algorithm: threshold
    formula: |
      if RenewalCase.adjustment_method == OCAF:
          candidate = RenewalCase.ocaf_rent_per_unit_cents
          ceiling   = RenewalCase.comparable_market_rent_cents when rcs_required else null
      else:  # BUDGET_BASED
          candidate = RenewalCase.budget_rent_per_unit_cents
          ceiling   = round_half_up(BUDGET_RENT_CAP_PCT * RenewalCase.comparable_market_rent_cents)
      if ceiling is not null AND candidate > ceiling:
          reject the approval (see validations for the applicable error_id)
      approved_rent_per_unit_cents = candidate
    input_set: "Only the two candidate rents already stored on the RenewalCase plus comparable_market_rent_cents. Neither candidate is recomputed at approval time."
    constants:
      BUDGET_RENT_CAP_PCT: 1.10
    precision: "Whole cents; the BUDGET_BASED ceiling is rounded half-up before comparison."
    variants:
      - name: ocaf_track
        when: "RenewalCase.adjustment_method == OCAF"
        difference: "Takes the OCAF-escalated rent (operating-cost adjustment factor applied to the non-debt portion only), which is refused outright by validations[priority=70] when it exceeds 100 percent of the comparable market rent rather than being trimmed to it."
      - name: budget_based_track
        when: "RenewalCase.adjustment_method == BUDGET_BASED"
        difference: "Takes the owner's line-item budget rent (opex + debt service + reserves + management fee), refused by validations[priority=71] when it exceeds 110 percent of the comparable market rent. For the reference contract (rent 118000, debt 32000, opex 61000, reserve 4500, IL) the ocaf_track yields 120752 and the budget_based_track yields 105300 from identical stored data."

  - name: utility_allowance_adjustment
    trigger: "POST /pbra/utility-allowance-analyses — writes proposed_allowance_cents, change_pct, requires_field_office_approval"
    algorithm: threshold
    formula: |
      baseline = UtilityAllowanceAnalysis.baseline_allowance_cents   # snapshot of Property.current_utility_allowance_cents
      if method == FACTOR_BASED:
          proposed_allowance_cents = round_half_up(baseline * (1 + utility_rate_change_pct))
      else:  # ENGINEERING_BASED
          proposed_allowance_cents = engineering_estimate_cents
      change_pct = round_half_up_4dp((proposed_allowance_cents - baseline) / baseline)
      requires_field_office_approval = (abs(change_pct) > UA_FIELD_OFFICE_THRESHOLD_PCT)   # STRICT >
      # abs(change_pct) exactly equal to 0.10 stays with the ContractAdministrator.
    input_set: "The analysis row alone plus its baseline snapshot; no tenant data. baseline == 0 is rejected upstream by validations (ERR_INVALID_REQUEST) so change_pct is always defined."
    constants:
      UA_FIELD_OFFICE_THRESHOLD_PCT: 0.10
    precision: "proposed_allowance_cents rounded half-up to whole cents; change_pct rounded half-up to 4 decimal places before the threshold comparison."
    variants: []

  - name: tenant_rent_recalculation
    trigger: "POST /pbra/tenant-certifications; UtilityAllowanceAnalysis APPROVED -> APPLIED cascade hop 3 — writes TenantCertification.ttp_cents, tenant_rent_cents, utility_reimbursement_cents, hap_cents, gross_rent_cents"
    algorithm: threshold
    formula: |
      monthly_adjusted = round_half_up(TenantHousehold.annual_adjusted_income_cents / 12)
      monthly_gross    = round_half_up(TenantHousehold.annual_gross_income_cents / 12)
      ttp_cents = max( round_half_up(TTP_ADJUSTED_INCOME_PCT * monthly_adjusted),
                       round_half_up(TTP_GROSS_INCOME_PCT * monthly_gross),
                       MINIMUM_RENT_CENTS )
      gross_rent_cents            = certification.contract_rent_per_unit_cents + certification.utility_allowance_cents
      tenant_rent_cents           = max(0, ttp_cents - certification.utility_allowance_cents)
      utility_reimbursement_cents = max(0, certification.utility_allowance_cents - ttp_cents)
      hap_cents                   = max(0, gross_rent_cents - ttp_cents)
    input_set: "The household's two income fields plus the certification's own utility_allowance_cents and contract_rent_per_unit_cents snapshots. Income is never re-read from the household after the certification is written."
    constants:
      TTP_ADJUSTED_INCOME_PCT: 0.30
      TTP_GROSS_INCOME_PCT: 0.10
      MINIMUM_RENT_CENTS: 2500
    precision: "Each monthly income is rounded half-up to whole cents BEFORE the percentage is applied, and each percentage product is rounded half-up to whole cents BEFORE the three-way max. Applying the percentage to the annual figure and dividing afterwards is not permitted."
    variants: []

  - name: monthly_voucher_hap_request
    trigger: "POST /pbra/voucher-submissions; POST /pbra/voucher-submissions/{id}/submit; UtilityAllowanceAnalysis apply cascade hop 4 — writes VoucherSubmission.requested_hap_cents and included_certification_count"
    algorithm: aggregation
    formula: |
      period_first = first calendar day of period_month;  period_last = last calendar day of period_month
      days_in_month = number of days in period_month
      candidate households = TenantHousehold rows with property_id == HapContract.property_id
                             and status IN {ACTIVE, OPT_OUT_NOTICED, MOVED_OUT}
                             and (status != MOVED_OUT or move_out_date > period_first)
      # households with status EV_ISSUED are excluded entirely — their assistance is tenant-based
      total = 0; included = 0
      for each household h in candidate households, iterated created_at ASC:
          cert = the TenantCertification of h with effective_date <= period_last having the greatest
                 effective_date; tie-break created_at ASC with the LAST row winning; skip h when none
          if cert is null: continue
          if h.status == MOVED_OUT and h.move_out_date <= period_last:
              days_occupied = whole days from period_first to h.move_out_date (move-out day NOT counted)
              term = round_half_up(cert.hap_cents * days_occupied / days_in_month)   # per-household rounding
          else:
              term = cert.hap_cents
          total = total + term; included = included + 1
      requested_hap_cents = total          # exact integer sum of already-rounded per-household terms
      included_certification_count = included
    input_set: "One certification per candidate household — the latest with effective_date <= period_last, regardless of status (a SUPERSEDED certification still governs a month that closed before its successor took effect). EV_ISSUED households and households whose move_out_date <= period_first contribute nothing."
    constants: {}
    precision: "Proration is rounded half-up to whole cents PER HOUSEHOLD and then summed exactly; summing unrounded prorated terms and rounding once is not permitted."
    variants: []

  - name: special_claim_amount
    trigger: "POST /pbra/special-claims; POST /pbra/special-claims/{id}/submit — writes computed_amount_cents, vacancy_days_claimed, valuation_variant"
    algorithm: chronological
    formula: |
      unit_rent = HapContract.renewed_rent_per_unit_cents when non-null else
                  HapContract.contract_rent_per_unit_cents
      if claim_type == VACANCY and vacancy_end_date is not null:      # ACTUAL_CHRONOLOGICAL
          vacancy_days_claimed = min(VACANCY_DAY_CAP,
                                     whole days from vacancy_start_date to vacancy_end_date)
          walk the calendar months of [vacancy_start_date, vacancy_start_date + vacancy_days_claimed)
          in ascending month order:
              days_m    = vacant days falling inside month m
              daily_m   = round_half_up(unit_rent / days_in_month(m))   # per-month daily rate
              subtotal_m= daily_m * days_m
          computed_amount_cents = SUM of subtotal_m                     # exact sum of month subtotals
      elif claim_type == VACANCY:                                       # PROJECTED_ESTIMATE
          vacancy_days_claimed = min(VACANCY_DAY_CAP, estimated_vacancy_days)
          computed_amount_cents = round_half_up(VACANCY_ESTIMATE_PCT * unit_rent
                                                * vacancy_days_claimed / VACANCY_ESTIMATE_MONTH_DAYS)
      elif claim_type == UNPAID_RENT:                                   # DIRECT_LEDGER
          vacancy_days_claimed = 0
          computed_amount_cents = max(0, min(claimed_amount_cents,
                                             UNPAID_RENT_MONTH_CAP * unit_rent)
                                         - security_deposit_balance_cents)
      else:  # TENANT_DAMAGES                                           # DIRECT_LEDGER
          vacancy_days_claimed = 0
          computed_amount_cents = max(0, min(claimed_amount_cents,
                                             DAMAGES_MONTH_CAP * unit_rent)
                                         - security_deposit_balance_cents)
    input_set: "The claim row plus the contract's in-force per-unit rent. Vacancy day counting is half-open [start, end): the start day is vacant, the end day (re-rental day) is not."
    constants:
      VACANCY_DAY_CAP: 60
      VACANCY_ESTIMATE_PCT: 0.80
      VACANCY_ESTIMATE_MONTH_DAYS: 30
      UNPAID_RENT_MONTH_CAP: 1
      DAMAGES_MONTH_CAP: 2
    precision: "Vacancy: the daily rate is rounded half-up to whole cents per calendar month and multiplied by that month's vacant days; month subtotals are summed exactly. Projected: a single half-up rounding at the end."
    variants:
      - name: actual_chronological
        when: "claim_type == VACANCY and vacancy_end_date is not null (unit already re-rented)"
        difference: "Walks the real calendar month by month, so February's 28-day divisor produces a higher daily rate than January's 31-day divisor. For unit_rent 118000 and vacancy 2027-01-20 -> 2027-03-05 (44 days) it yields 178888."
      - name: projected_estimate
        when: "claim_type == VACANCY and vacancy_end_date is null (unit still vacant)"
        difference: "Ignores the calendar entirely, applies VACANCY_ESTIMATE_PCT and a flat 30-day month. For the same 44 vacant days and the same unit_rent it yields 138453 — a 40435-cent divergence on identical vacancy length."

  - name: enhanced_voucher_entitlement
    trigger: "RenewalCase notice track NOTICES_PENDING -> OPT_OUT_NOTICED cascade hop 3 — writes EnhancedVoucher.payment_standard_cents, ttp_snapshot_cents, entitlement_cents"
    algorithm: threshold
    formula: |
      gross_market = max(RenewalCase.comparable_market_rent_cents, Property.published_fmr_cents)
                     + Property.current_utility_allowance_cents
      payment_standard_cents = gross_market
      ttp_snapshot_cents     = ttp_cents of the household's TenantCertification with status == ACTIVE
                               (0 when the household has no certification)
      entitlement_cents      = max(0, payment_standard_cents - max(ttp_snapshot_cents, MINIMUM_RENT_CENTS))
    input_set: "The opting-out RenewalCase, its Property, and one ACTIVE certification per household. Households whose entitlement_cents computes to 0 still get a PENDING row, but issuance is refused."
    constants:
      MINIMUM_RENT_CENTS: 2500
    precision: "Whole cents; no intermediate rounding is required because every term is already an integer."
    variants: []

  - name: restructuring_eligibility
    trigger: "POST /pbra/restructuring-determinations/{id}/evaluate — selects the branch and writes eligibility_reason_code"
    algorithm: threshold
    formula: |
      market = RestructuringDetermination.market_rent_per_unit_cents
      rent   = RestructuringDetermination.current_rent_per_unit_cents
      fmr    = RestructuringDetermination.fmr_per_unit_cents
      if HapContract.contract_type == LOAN_MANAGEMENT_SET_ASIDE:
          return (INELIGIBLE, CONTRACT_TYPE_EXCLUDED)
      if market > rent:                                  # STRICT >: market == rent is NOT eligible
          if market >= round_half_up(MUTM_FMR_FLOOR_PCT * fmr):     # INCLUSIVE >=
              return (MUTM_ELIGIBLE, MARKET_ABOVE_CONTRACT_AND_FMR)
          return (INELIGIBLE, MARKET_BELOW_FMR_FLOOR)
      if rent > market and Property.has_fha_insured_mortgage == true:
          return (M2M_REFERRED, CONTRACT_ABOVE_MARKET_FHA_INSURED)
      return (INELIGIBLE, MARKET_NOT_ABOVE_CONTRACT)
    input_set: "The three snapshots taken at determination creation plus contract_type and has_fha_insured_mortgage. Later changes to the study or the property do not retro-alter an evaluated determination."
    constants:
      MUTM_FMR_FLOOR_PCT: 1.00
      M2M_RENT_PCT_OF_MARKET: 0.90
    precision: "Integer cent comparisons. The market-versus-contract test is strict (>) and the market-versus-FMR floor test is inclusive (>=); both boundaries are load-bearing."
    variants: []

  - name: notice_window_compliance
    trigger: "POST /pbra/tenant-notices — writes lead_days and required_lead_days, gates the notice"
    algorithm: interval_merge
    formula: |
      lead_days          = whole days from TenantNotice.issued_date to effective_date
                           (issue day excluded, effective day counted)
      required_lead_days = NOTICE_LEAD_DAYS[notice_type]
      compliant          = (lead_days >= required_lead_days)          # INCLUSIVE >=
    input_set: "The logical clock date at issuance and the requested effective_date. Calendar days only; weekends and holidays are not excluded."
    constants:
      NOTICE_LEAD_DAYS: { RENEWAL_INTENT: 120, OPT_OUT_ONE_YEAR: 365, TERMINATION_120_DAY: 120, RENT_CHANGE: 30 }
    precision: "Whole days; exactly meeting the requirement is compliant."
    variants: []

  - name: subsidy_reconciliation
    trigger: "GET /pbra/hap-contracts/{id}/reconciliation — read-only projection, persists nothing"
    algorithm: chronological
    formula: |
      periods = VoucherSubmission rows for this contract, ordered by period_month ASC
                (tie-break created_at ASC — one row per period is enforced by validations)
      requested_total = SUM of requested_hap_cents over rows with state IN {SUBMITTED, PAID}
      paid_total      = SUM of paid_amount_cents over rows with state == PAID
      reversed_total  = SUM of paid_amount_cents over rows with state == REVERSED
      claims_paid_total = SUM of paid_amount_cents over SpecialClaim rows with state == PAID
      variance_cents  = requested_total - paid_total
      ledger_balance_cents = HapContract.authorized_hap_budget_cents - paid_total - claims_paid_total
      # ledger_balance_cents MUST equal HapContract.hap_ledger_balance_cents on every read.
    input_set: "All VoucherSubmission rows of the contract (DRAFT rows are excluded from requested_total; REVERSED rows are excluded from paid_total and reported separately) and all PAID SpecialClaim rows."
    constants: {}
    precision: "Exact integer cent sums; no rounding."
    variants: []

  - name: hap_budget_conservation
    trigger: "Audited after VoucherSubmission SUBMITTED -> PAID, PAID -> REVERSED and SpecialClaim APPROVED -> PAID"
    algorithm: aggregation
    formula: |
      # Conserved quantity Q_money, invariant across any forward/compensating pair:
      Q_money = HapContract.hap_ledger_balance_cents
              + SUM(VoucherSubmission.paid_amount_cents where state == PAID)
              + SUM(SpecialClaim.paid_amount_cents where state == PAID)
      Q_money MUST equal HapContract.authorized_hap_budget_cents at all times, and in particular
      pay(v) followed by reverse(v) MUST restore hap_ledger_balance_cents to its pre-pay value with
      paid_hap_total_cents back to its pre-pay value.
    input_set: "One HapContract and all of its VoucherSubmission and SpecialClaim rows; REVERSED vouchers contribute 0 to the sum even though paid_amount_cents is retained."
    constants: {}
    precision: "Exact integer cents; zero drift tolerated."
    variants: []

  - name: assisted_unit_conservation
    trigger: "Audited after EnhancedVoucher PENDING -> ISSUED, ISSUED -> RESCINDED and TenantHousehold * -> MOVED_OUT"
    algorithm: aggregation
    formula: |
      # Conserved quantity Q_units, a unit count rather than a money amount:
      Q_units = Property.units_under_hap_count
              + Property.enhanced_voucher_unit_count
              + Property.released_unit_count
      Q_units MUST equal Property.assisted_unit_count at all times, and in particular
      issue(ev) followed by rescind(ev) MUST restore all three counters to their pre-issue values.
    input_set: "One Property and its three unit counters; PENDING and RESCINDED enhanced vouchers move no units."
    constants: {}
    precision: "Exact integer counts; zero drift tolerated."
    variants: []

validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are present and X-User-Role is one of the four declared roles"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all
  - priority: 2
    category: auth
    check: "The acting role appears in the endpoint's roles list in the API endpoint table"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: all
  - priority: 3
    category: auth
    check: "When the acting role is OwnerAgent, X-User-ID equals the Owner.id reachable from the target resource (Property.owner_id, or Property.owner_id of the resource's Property/HapContract chain)"
    error_id: ERR_NOT_PROPERTY_OWNER
    http_status: 403
    applies_to: "all OwnerAgent write endpoints"
  - priority: 10
    category: existence
    check: "Path-addressed resources exist, validated left to right"
    error_id: "ERR_OWNER_NOT_FOUND | ERR_PROPERTY_NOT_FOUND | ERR_CONTRACT_NOT_FOUND | ERR_RENEWAL_CASE_NOT_FOUND | ERR_STUDY_NOT_FOUND | ERR_UA_ANALYSIS_NOT_FOUND | ERR_TENANT_NOT_FOUND | ERR_CERTIFICATION_NOT_FOUND | ERR_NOTICE_NOT_FOUND | ERR_DETERMINATION_NOT_FOUND | ERR_ENHANCED_VOUCHER_NOT_FOUND | ERR_VOUCHER_SUBMISSION_NOT_FOUND | ERR_CLAIM_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with a path id"
  - priority: 11
    category: existence
    check: "Body foreign keys resolve: owner_id, property_id, contract_id, renewal_case_id, study_id, tenant_id, supersedes_study_id, and every id in struck_comparable_ids"
    error_id: "ERR_OWNER_NOT_FOUND | ERR_PROPERTY_NOT_FOUND | ERR_CONTRACT_NOT_FOUND | ERR_RENEWAL_CASE_NOT_FOUND | ERR_STUDY_NOT_FOUND | ERR_TENANT_NOT_FOUND | ERR_COMPARABLE_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints carrying a foreign key in the body"
  - priority: 15
    category: business_constraint
    check: "Required body fields are present, types match, enum members are legal, integers are non-negative where constrained, dates are ISO YYYY-MM-DD, period_month is YYYY-MM, cert_type is not UA_ADJUSTMENT on a client write, utility_rate_change_pct is present exactly for FACTOR_BASED and engineering_estimate_cents exactly for ENGINEERING_BASED, move_out_date is not earlier than the household's ACTIVE certification effective_date"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all
  - priority: 16
    category: business_constraint
    check: "limit is within 1..100 and offset >= 0 on list endpoints"
    error_id: ERR_INVALID_PAGINATION
    http_status: 400
    applies_to: "all list endpoints"
  - priority: 18
    category: business_constraint
    check: "Owner.tin is unique across Owner rows"
    error_id: ERR_DUPLICATE_TIN
    http_status: 409
    applies_to: "POST /pbra/owners"
  - priority: 19
    category: business_constraint
    check: "TenantHousehold.unit_number is unique per property_id over rows with status != MOVED_OUT"
    error_id: ERR_DUPLICATE_UNIT_NUMBER
    http_status: 409
    applies_to: "POST /pbra/tenant-households"
  - priority: 20
    category: state
    check: "expected_tenant_version equals TenantHousehold.version"
    error_id: ERR_STALE_TENANT_VERSION
    http_status: 412
    applies_to: "POST /pbra/tenant-certifications"
  - priority: 21
    category: state
    check: "expected_contract_version equals HapContract.version"
    error_id: ERR_STALE_CONTRACT_VERSION
    http_status: 412
    applies_to: "POST /pbra/voucher-submissions; POST /pbra/renewal-cases/{id}/execute-renewal"
  - priority: 22
    category: state
    check: "expected_property_version equals Property.version"
    error_id: ERR_STALE_PROPERTY_VERSION
    http_status: 412
    applies_to: "POST /pbra/utility-allowance-analyses/{id}/apply"
  - priority: 30
    category: state
    check: "The target resource is in a state from which the requested transition is declared in the state machine table (including terminal-state lockdown and repeat-trigger idempotency rejection)"
    error_id: ERR_TRANSITION_NOT_ALLOWED
    http_status: 409
    applies_to: "all action endpoints"
  - priority: 31
    category: state
    check: "No RenewalCase with rent_track_status != EXECUTED already exists for the contract"
    error_id: ERR_OPEN_RENEWAL_CASE_EXISTS
    http_status: 409
    applies_to: "POST /pbra/renewal-cases"
  - priority: 32
    category: state
    check: "supersedes_study_id, when present, names a study in state REJECTED belonging to the same renewal_case_id"
    error_id: ERR_TRANSITION_NOT_ALLOWED
    http_status: 409
    applies_to: "POST /pbra/rent-comparability-studies"
  - priority: 33
    category: state
    check: "RentComparabilityStudy.challenge_round < MAX_CHALLENGE_ROUNDS (MAX_CHALLENGE_ROUNDS = 3)"
    error_id: ERR_MAX_CHALLENGE_ROUNDS
    http_status: 409
    applies_to: "POST /pbra/rent-comparability-studies/{id}/challenge"
    note: "Checked after the state precondition (state == SUBMITTED) and before any comparable is struck."
  - priority: 34
    category: state
    check: "No other UtilityAllowanceAnalysis on the same property_id is in state SUBMITTED or APPROVED"
    error_id: ERR_UA_ANALYSIS_IN_FLIGHT
    http_status: 409
    applies_to: "POST /pbra/utility-allowance-analyses/{id}/submit"
  - priority: 35
    category: state
    check: "No VoucherSubmission with state != REVERSED already exists for this contract_id and period_month"
    error_id: ERR_DUPLICATE_VOUCHER_PERIOD
    http_status: 409
    applies_to: "POST /pbra/voucher-submissions"
  - priority: 40
    category: state
    check: "A RentComparabilityStudy with state == ACCEPTED exists on the case whenever RenewalCase.rcs_required is true"
    error_id: ERR_RCS_NOT_ACCEPTED
    http_status: 409
    applies_to: "POST /pbra/renewal-cases/{id}/approve-rents"
    note: "Cross-entity state guard; outranks every business rule below, so a case that both lacks an accepted study and would breach the rent ceiling reports this error."
  - priority: 41
    category: state
    check: "The VoucherSubmission with the claim's contract_id and period_month == claim_period_month exists and has state == PAID"
    error_id: ERR_COVERING_VOUCHER_NOT_PAID
    http_status: 409
    applies_to: "POST /pbra/special-claims/{id}/pay"
  - priority: 42
    category: state
    check: "No SpecialClaim with claim_period_month equal to this voucher's period_month has state == PAID"
    error_id: ERR_CLAIM_PAID_BLOCKS_REVERSAL
    http_status: 409
    applies_to: "POST /pbra/voucher-submissions/{id}/reverse"
  - priority: 43
    category: state
    check: "No EnhancedVoucher on the RenewalCase has state == ISSUED when rescinding an OPT_OUT_ONE_YEAR notice"
    error_id: ERR_ENHANCED_VOUCHER_ISSUED_BLOCKS_RESCIND
    http_status: 409
    applies_to: "POST /pbra/tenant-notices/{id}/rescind"
  - priority: 45
    category: auth
    check: "X-User-ID differs from RenewalCase.challenge_reviewer_user_id (the reviewer who challenged the study cannot approve the rents it supports)"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /pbra/renewal-cases/{id}/approve-rents"
    note: "Deliberately ordered AFTER the state guards at 30-43 so that a wrong-state request reports the state error even when the same user also breaches separation of duties."
  - priority: 46
    category: auth
    check: "X-User-Role == HudFieldOffice when UtilityAllowanceAnalysis.requires_field_office_approval is true"
    error_id: ERR_UA_CHANGE_REQUIRES_FIELD_OFFICE
    http_status: 403
    applies_to: "POST /pbra/utility-allowance-analyses/{id}/decide"
  - priority: 50
    category: business_safety
    check: "renewal_option is permitted for HapContract.contract_type per OPTION_TYPE_MATRIX"
    error_id: ERR_OPTION_NOT_PERMITTED_FOR_TYPE
    http_status: 422
    applies_to: "POST /pbra/renewal-cases/{id}/select-option"
    note: |
      OPTION_TYPE_MATRIX (the complete, closed table):
        NEW_CONSTRUCTION:          [OPTION_1_MARK_UP_TO_MARKET, OPTION_2_OCAF, OPTION_3_MARK_TO_MARKET]
        STATE_AGENCY_FINANCED:     [OPTION_2_OCAF, OPTION_4_PORTFOLIO_REENGINEERING]
        LOAN_MANAGEMENT_SET_ASIDE: [OPTION_2_OCAF]
        PROPERTY_DISPOSITION:      [OPTION_2_OCAF, OPTION_4_PORTFOLIO_REENGINEERING]
  - priority: 51
    category: business_safety
    check: "adjustment_method == OCAF when RenewalCase.renewal_option == OPTION_1_MARK_UP_TO_MARKET"
    error_id: ERR_ADJUSTMENT_METHOD_CONFLICT
    http_status: 422
    applies_to: "POST /pbra/renewal-cases/{id}/elect-adjustment"
  - priority: 52
    category: business_safety
    check: "RenewalCase.renewal_option matches the determination branch being approved (OPTION_1_MARK_UP_TO_MARKET for MUTM_ELIGIBLE, OPTION_3_MARK_TO_MARKET for M2M_REFERRED)"
    error_id: ERR_MUTM_OPTION_MISMATCH
    http_status: 422
    applies_to: "POST /pbra/restructuring-determinations/{id}/approve"
  - priority: 55
    category: business_temporal
    check: "0 < whole days from the clock date to HapContract.expiration_date <= RENEWAL_WINDOW_DAYS (RENEWAL_WINDOW_DAYS = 420)"
    error_id: ERR_OUTSIDE_RENEWAL_WINDOW
    http_status: 422
    applies_to: "POST /pbra/renewal-cases"
  - priority: 56
    category: business_temporal
    check: "TenantNotice.lead_days >= NOTICE_LEAD_DAYS[notice_type]"
    error_id: ERR_NOTICE_WINDOW_NOT_MET
    http_status: 422
    applies_to: "POST /pbra/tenant-notices"
  - priority: 57
    category: business_temporal
    check: "clock date >= effective_date of the TenantNotice referenced by RenewalCase.opt_out_notice_id (the one-year notice period has fully elapsed)"
    error_id: ERR_OPT_OUT_NOTICE_PERIOD_INCOMPLETE
    http_status: 422
    applies_to: "POST /pbra/renewal-cases/{id}/finalize-opt-out"
    note: "Outranks the referential voucher check at 65; a premature finalize on a property with unissued vouchers reports the temporal error."
  - priority: 58
    category: business_temporal
    check: "UtilityAllowanceAnalysis.effective_date >= Property.last_applied_ua_effective_date advanced by UA_COVERAGE_MONTHS whole months (UA_COVERAGE_MONTHS = 12) (inclusive: an effective_date exactly on the boundary is accepted); always satisfied when no analysis was ever applied"
    error_id: ERR_UA_INTERVAL_OVERLAP
    http_status: 409
    applies_to: "POST /pbra/utility-allowance-analyses/{id}/apply"
  - priority: 59
    category: business_temporal
    check: "New TenantCertification.effective_date > the household's ACTIVE certification effective_date advanced by CERT_BUFFER_DAYS days (CERT_BUFFER_DAYS = 30; STRICT: a certification exactly CERT_BUFFER_DAYS later is rejected)"
    error_id: ERR_CERT_INTERVAL_CONFLICT
    http_status: 409
    applies_to: "POST /pbra/tenant-certifications"
  - priority: 60
    category: business_temporal
    check: "clock date >= the first day of the month following period_month"
    error_id: ERR_PERIOD_NOT_ELAPSED
    http_status: 422
    applies_to: "POST /pbra/voucher-submissions/{id}/submit"
  - priority: 62
    category: business_referential
    check: "A TenantNotice with notice_type == OPT_OUT_ONE_YEAR and status == ISSUED exists on the case"
    error_id: ERR_OPT_OUT_NOTICE_MISSING
    http_status: 422
    applies_to: "POST /pbra/renewal-cases/{id}/record-opt-out"
  - priority: 63
    category: business_referential
    check: "RentComparabilityStudy.accepted_comparable_count >= 1 (a study whose every comparable was struck cannot be submitted)"
    error_id: ERR_NO_ELIGIBLE_COMPARABLES
    http_status: 422
    applies_to: "POST /pbra/rent-comparability-studies/{id}/submit"
  - priority: 65
    category: business_referential
    check: "Every TenantHousehold of the property with status == OPT_OUT_NOTICED has an EnhancedVoucher with state == ISSUED"
    error_id: ERR_TENANT_VOUCHER_UNRESOLVED
    http_status: 422
    applies_to: "POST /pbra/renewal-cases/{id}/finalize-opt-out"
  - priority: 68
    category: business_constraint
    check: "vacancy_days_claimed of this claim plus the sum of vacancy_days_claimed over SpecialClaim rows with the same contract_id and unit_number in state SUBMITTED, APPROVED or PAID is <= VACANCY_DAY_CAP"
    error_id: ERR_VACANCY_DAYS_CAP_EXCEEDED
    http_status: 422
    applies_to: "POST /pbra/special-claims/{id}/submit"
  - priority: 70
    category: business_fiscal
    check: "calculations.renewal_rent_determination output <= RenewalCase.comparable_market_rent_cents when adjustment_method == OCAF and rcs_required is true"
    error_id: ERR_RENT_EXCEEDS_COMPARABLE
    http_status: 422
    applies_to: "POST /pbra/renewal-cases/{id}/approve-rents"
  - priority: 71
    category: business_fiscal
    check: "calculations.renewal_rent_determination output <= round_half_up(BUDGET_RENT_CAP_PCT * comparable_market_rent_cents) when adjustment_method == BUDGET_BASED"
    error_id: ERR_BUDGET_RENT_EXCEEDS_CAP
    http_status: 422
    applies_to: "POST /pbra/renewal-cases/{id}/approve-rents"
  - priority: 72
    category: business_fiscal
    check: "EnhancedVoucher.entitlement_cents > 0"
    error_id: ERR_NO_ENHANCEMENT_ENTITLEMENT
    http_status: 422
    applies_to: "POST /pbra/enhanced-vouchers/{id}/issue"
  - priority: 73
    category: business_fiscal
    check: "VoucherSubmission.requested_hap_cents > 0"
    error_id: ERR_ZERO_VOUCHER_REQUEST
    http_status: 422
    applies_to: "POST /pbra/voucher-submissions/{id}/submit"
  - priority: 74
    category: business_fiscal
    check: "SpecialClaim.computed_amount_cents > 0"
    error_id: ERR_ZERO_CLAIM_AMOUNT
    http_status: 422
    applies_to: "POST /pbra/special-claims/{id}/submit"
  - priority: 80
    category: business_fiscal
    check: "The amount being disbursed (VoucherSubmission.requested_hap_cents or SpecialClaim.computed_amount_cents) is <= HapContract.hap_ledger_balance_cents"
    error_id: ERR_HAP_BUDGET_EXCEEDED
    http_status: 402
    applies_to: "POST /pbra/voucher-submissions/{id}/pay; POST /pbra/special-claims/{id}/pay"

endpoints:
  # ---- clock ------------------------------------------------------------
  - method: POST
    path: /pbra/_clock/set_current_utc
    purpose: "Set the logical clock used by every date/time computation in this API. The clock starts at 2026-08-01T00:00:00Z and only this endpoint moves it."
    input: [to_iso8601]
    output: { current_utc: string }
    roles: [OwnerAgent, ContractAdministrator, HudFieldOffice, PhaAdministrator]
    side_effects:
      - "Replaces the logical clock value; no entity is mutated and no state machine advances as a result."

  # ---- owners and properties -------------------------------------------
  - method: POST
    path: /pbra/owners
    purpose: "Register an assisted-housing owner-agent. The returned id is the X-User-ID an OwnerAgent presents on later calls."
    input: [legal_name, tin, contact_email]
    output: Owner
    roles: [ContractAdministrator, HudFieldOffice]
    side_effects:
      - "Creates Owner with portfolio_property_count = 0 and compliance_flag = OK."
  - method: GET
    path: /pbra/owners/{id}
    purpose: "Read one owner."
    input: []
    output: Owner
    roles: [OwnerAgent, ContractAdministrator, HudFieldOffice, PhaAdministrator]
    side_effects: []
  - method: GET
    path: /pbra/owners/{id}/properties
    purpose: "List the properties of one owner, ordered by created_at ASC."
    input: ["limit?", "offset?"]
    output: Property[]
    roles: [OwnerAgent, ContractAdministrator, HudFieldOffice, PhaAdministrator]
    side_effects: []
  - method: POST
    path: /pbra/properties
    purpose: "Register an assisted property under the acting owner-agent."
    input: [owner_id, project_name, state_code, total_units, assisted_unit_count, published_fmr_cents, baseline_utility_allowance_cents, "has_fha_insured_mortgage?"]
    output: Property
    roles: [OwnerAgent]
