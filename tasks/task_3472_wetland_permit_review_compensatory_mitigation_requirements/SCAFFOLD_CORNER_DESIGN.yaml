          assert:
            - "st_ok == SUBMITTED (0.50 exactly is eligible)"
            - "err_over == ERR_GENERAL_PERMIT_INELIGIBLE (422) at 0.51"

      - name: corner_gp_disallowed_resource_type
        claim_type: violation_to_error
        grounds: ["validations[priority=15]", "errors[ERR_GENERAL_PERMIT_INELIGIBLE]"]
        distinguishing_aspect: "FORESTED_WETLAND is outside the general-permit allowed set {EMERGENT_MARSH, STREAM}; a 0.30-acre FORESTED_WETLAND GENERAL application is ineligible despite passing the acreage cap."
