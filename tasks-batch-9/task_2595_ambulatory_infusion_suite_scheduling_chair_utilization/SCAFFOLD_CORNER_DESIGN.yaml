            - "Appointment.${ap1}.schedule_status == 'COMPLETED' and cancellation_charge_cents == 0 and late_cancellation == false"
            - "Appointment.${ap1}.actual_start_minute == 540 and actual_end_minute == 795 and billable_chair_units == 17"
