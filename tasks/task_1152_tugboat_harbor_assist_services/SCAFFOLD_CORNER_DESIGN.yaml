  - section: validations
    instances:
      - name: missing_role_header_unauthenticated
        claim_type: violation_to_error
        grounds: ["validations[priority=1]", "errors[ERR_UNAUTHENTICATED]"]
        distinguishing_aspect: "A request without X-User-Role/X-User-ID headers is rejected 401 before any other check."
        test_recipe:
          setup: ["Empty database"]
          setup_api_calls: []
          trigger:
            - call: "GET /api/tugs"
              payload: {}
          assert:
            - "Request sent with auth headers omitted is rejected with error_id == ERR_UNAUTHENTICATED (HTTP 401)"

      - name: create_tug_as_vessel_agent_returns_forbidden
        claim_type: violation_to_error
        grounds: ["validations[priority=2]", "errors[ERR_FORBIDDEN]", "roles[PortAdmin]"]
        distinguishing_aspect: "VesselAgent calling a PortAdmin-only endpoint is rejected 403."
        test_recipe:
          setup: ["A vessel exists to back the VesselAgent identity"]
          setup_api_calls:
            - call: "POST /api/vessels"
              payload: { name: "MV Aurora", imo_number: "IMO9074729", deadweight_tonnage: 40000, loa_meters: 180.0 }
              as: PortAdmin
              captures: { v1: $.data.id }
          trigger:
            - call: "POST /api/tugs"
              payload: { name: "Tug Rogue", bollard_pull_tons: 50.0, horsepower: 4000, hourly_rate_cents: 100000, insured_value_cents: 15000000 }
              as: VesselAgent
              as_user_id: "${v1}"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_FORBIDDEN (HTTP 403)"

      - name: agent_cannot_order_for_other_vessel
        claim_type: violation_to_error
        grounds: ["validations[priority=3]", "errors[ERR_JOB_NOT_OWNED]", "roles[VesselAgent]"]
        distinguishing_aspect: "VesselAgent whose X-User-ID equals vessel V1 placing an order naming vessel V2 is rejected ERR_JOB_NOT_OWNED (ownership check, priority 3, before any business rule)."
        test_recipe:
          setup: ["Vessels V1 and V2 exist; tariff exists"]
          setup_api_calls:
