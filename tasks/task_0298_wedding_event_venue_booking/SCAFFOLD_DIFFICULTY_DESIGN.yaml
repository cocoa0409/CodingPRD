  # =================================================================
  # Rule 8 — Resource temporal-overlap conflicts across different interval semantics
  # =================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: space_hold_overlap_includes_turnover_buffer
        grounds:
          - validations[priority=12]
          - state_machines.SpaceHold.HELD_to_COMMITTED
          - entities.Space.fields.turnover_buffer_minutes
          - entities.SpaceHold.fields.occupy_start
        distinguishing_aspect: |
          Space-hold interval semantics PAD the occupation by turnover_buffer_minutes: a second
          booking's hold that begins 30 minutes after a committed hold ends on the same space is
          rejected ERR_SPACE_DOUBLE_BOOKED when the space's turnover_buffer_minutes is 60, even though
          the raw intervals do not overlap.
