# §1.9 Scaffold Corner Design — breadth coverage of every testable claim in
# §1.1–§1.7 not already covered by §1.8. Sections per claim-extraction-guide.
scaffold_corner_design:

  # =========================================================================
  - section: entities
    instances:
      - name: create_applicant_success_returns_201_and_initial_state
        claim_type: creation
        grounds: [entities.Applicant, state_machines.Applicant]
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls:
            - { call: "POST /pilot-training/applicants", payload: { full_name: "Ini Tial", email: "init@x.com", license_number: "L400", total_flight_hours: 1800 }, as: Recruiter, captures: { ap: $.data.id } }
          trigger:
            - { call: "GET /pilot-training/applicants/${ap}", payload: {}, as: Recruiter }
          assert:
            - "create returned 201 with data.status == SCREENING (initial state)"
            - "data.version == 1 and data.ledger_balance_cents == 0"
            - "data.seniority_number is null and data.current_equipment_id is null"
      - name: create_applicant_missing_required_field_returns_400
        claim_type: required_fields
        grounds: [entities.Applicant.fields.total_flight_hours, "errors[ERR_INVALID_REQUEST]"]
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /pilot-training/applicants", payload: { full_name: "No Hours", email: "noh@x.com", license_number: "L401" }, as: Recruiter, captures: { err: $.data.error_id } }
          assert:
            - "trigger returns 400 error_id == ERR_INVALID_REQUEST"
      - name: equipment_landings_required_defaults_to_3
        claim_type: defaults
        grounds: [entities.Equipment.fields.landings_required_90d]
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls:
            - { call: "POST /pilot-training/equipment", payload: { code: "B735", name: "Boeing 737-500", simulator_cost_per_hour_cents: 40000, ioe_hours_required: 8 }, as: TrainingCoordinator, captures: { eq: $.data.id } }
          trigger:
            - { call: "GET /pilot-training/equipment/${eq}", payload: {}, as: TrainingCoordinator }
          assert:
            - "Equipment.${eq}.landings_required_90d == 3 (default applied when omitted)"
      - name: applicant_computed_fields_ignore_client_input
        claim_type: computed_fields
        grounds: [entities.Applicant.fields.seniority_number, entities.Applicant.fields.ledger_balance_cents]
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /pilot-training/applicants", payload: { full_name: "Sneaky Pete", email: "snek@x.com", license_number: "L402", total_flight_hours: 2000 }, as: Recruiter, captures: { ap: $.data.id, sn: $.data.seniority_number, lb: $.data.ledger_balance_cents } }
          assert:
            - "response data.seniority_number is null (computed field; any client-supplied value would be ignored)"
            - "response data.ledger_balance_cents == 0"
            - "response data.id is a UUID with no type prefix"
      - name: get_nonexistent_entities_return_per_entity_404
        claim_type: not_found
        grounds: ["errors[ERR_APPLICANT_NOT_FOUND]", "errors[ERR_TRAINING_CLASS_NOT_FOUND]", "errors[ERR_ENROLLMENT_NOT_FOUND]"]
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "GET /pilot-training/applicants/00000000-0000-0000-0000-000000000000", payload: {}, as: Recruiter, captures: { e1: $.data.error_id } }
          assert:
            - "GET applicant returns 404 error_id == ERR_APPLICANT_NOT_FOUND"
      - name: invalid_enum_value_rejected
        claim_type: type_constraints
        grounds: [entities.RecordsRequest.fields.request_type, "errors[ERR_INVALID_REQUEST]"]
        test_recipe:
          setup: ["one applicant exists"]
          setup_api_calls:
            - { call: "POST /pilot-training/applicants", payload: { full_name: "Enum Test", email: "enum@x.com", license_number: "L403", total_flight_hours: 2000 }, as: Recruiter, captures: { ap: $.data.id } }
          trigger:
            - { call: "POST /pilot-training/records-requests", payload: { applicant_id: "${ap}", request_type: "NOT_A_TYPE" }, as: Recruiter, captures: { err: $.data.error_id } }
          assert:
            - "trigger returns 400 error_id == ERR_INVALID_REQUEST"
      - name: duplicate_email_rejected
        claim_type: type_constraints
        grounds: [entities.Applicant.fields.email, "errors[ERR_DUPLICATE_EMAIL]", "validations[priority=16]"]
        test_recipe:
          setup: ["one applicant with email dup@x.com"]
          setup_api_calls:
            - { call: "POST /pilot-training/applicants", payload: { full_name: "First Dup", email: "dup@x.com", license_number: "L404", total_flight_hours: 2000 }, as: Recruiter }
          trigger:
            - { call: "POST /pilot-training/applicants", payload: { full_name: "Second Dup", email: "dup@x.com", license_number: "L405", total_flight_hours: 2500 }, as: Recruiter, captures: { err: $.data.error_id } }
          assert:
            - "trigger returns 409 error_id == ERR_DUPLICATE_EMAIL"
      - name: cost_ledger_entry_is_append_only
        claim_type: immutability
        grounds: [entities.CostLedgerEntry]
        test_recipe:
          setup: ["one enrollment with one completed event, producing one ledger entry"]
          setup_api_calls:
            - { call: "POST /pilot-training/equipment", payload: { code: "IM01", name: "Immutable Fleet", simulator_cost_per_hour_cents: 38000, ioe_hours_required: 8, landings_required_90d: 3 }, as: TrainingCoordinator, captures: { eq: $.data.id } }
            - { call: "POST /pilot-training/applicants", payload: { full_name: "Imm Ledger", email: "iml@x.com", license_number: "L490", total_flight_hours: 2000 }, as: Recruiter, captures: { ap: $.data.id } }
            - { call: "POST /pilot-training/applicants/${ap}/advance-screening", payload: {}, as: Recruiter }
            - { call: "POST /pilot-training/records-requests", payload: { applicant_id: "${ap}", request_type: "PRIA" }, as: Recruiter, captures: { rr: $.data.id } }
            - { call: "POST /pilot-training/records-requests/${rr}/send", payload: {}, as: Recruiter }
            - { call: "POST /pilot-training/records-requests/${rr}/receive", payload: { outcome: "RECEIVED" }, as: Recruiter }
            - { call: "POST /pilot-training/records-requests/${rr}/verify", payload: {}, as: Recruiter }
            - { call: "POST /pilot-training/medical-certificates", payload: { applicant_id: "${ap}", cert_class: "FIRST", issued_at: "2026-07-01T00:00:00Z", pilot_age_at_issue: 30 }, as: CrewScheduler }
            - { call: "POST /pilot-training/applicants/${ap}/clear", payload: {}, as: Recruiter }
            - { call: "POST /pilot-training/training-classes", payload: { equipment_id: "${eq}", class_date: "2026-08-10T00:00:00Z", seat_capacity: 10, base_attrition_rate: 0.20 }, as: TrainingCoordinator, captures: { cls: $.data.id } }
            - { call: "POST /pilot-training/training-classes/${cls}/open", payload: {}, as: TrainingCoordinator }
            - { call: "GET /pilot-training/training-classes/${cls}", payload: {}, as: TrainingCoordinator, captures: { cv: $.data.version } }
            - { call: "POST /pilot-training/enrollments", payload: { applicant_id: "${ap}", training_class_id: "${cls}", expected_training_class_version: "${cv}" }, as: TrainingCoordinator, captures: { en: $.data.id } }
            - { call: "POST /pilot-training/enrollments/${en}/confirm", payload: {}, as: TrainingCoordinator }
            - { call: "POST /pilot-training/_clock/set-current-utc", payload: { to_iso8601: "2026-08-10T09:00:00Z" }, as: SystemAdmin }
            - { call: "POST /pilot-training/training-classes/${cls}/start", payload: {}, as: TrainingCoordinator }
            - { call: "POST /pilot-training/enrollments/${en}/start", payload: {}, as: TrainingCoordinator }
            - { call: "POST /pilot-training/instructors", payload: { full_name: "Led Ger", instructor_type: "GROUND", daily_max_sessions: 8 }, as: TrainingCoordinator, captures: { ins: $.data.id } }
            - { call: "POST /pilot-training/training-events", payload: { enrollment_id: "${en}", instructor_id: "${ins}", phase: "GROUND_SCHOOL", event_type: "SESSION", scheduled_start: "2026-08-10T10:00:00Z", scheduled_end: "2026-08-10T12:00:00Z" }, as: TrainingCoordinator, captures: { ev: $.data.id } }
            - { call: "POST /pilot-training/_clock/set-current-utc", payload: { to_iso8601: "2026-08-10T10:00:00Z" }, as: SystemAdmin }
            - { call: "POST /pilot-training/training-events/${ev}/complete", payload: { score: 90 }, as: TrainingCoordinator }
          trigger:
            - { call: "GET /pilot-training/cost-ledger", payload: {}, as: CrewScheduler }
          assert:
            - "GET /pilot-training/cost-ledger?enrollment_id=${en} returns exactly 1 row with amount_cents == 150000 and provisional == true"
            - "the row exposes id and created_at but NO version and NO updated_at (common_fields: false — append-only event entity); no POST/PUT/PATCH/DELETE exists for /pilot-training/cost-ledger in §1.5, so entries arise only from cascades"

  # =========================================================================
  - section: state_machines
    instances:
      - name: applicant_terminal_withdrawn_lockdown
        claim_type: terminal_state_lockdown
        grounds: [state_machines.Applicant]
        test_recipe:
          setup: ["applicant withdrawn from SCREENING"]
          setup_api_calls:
            - { call: "POST /pilot-training/applicants", payload: { full_name: "Wil Tara", email: "wil@x.com", license_number: "L410", total_flight_hours: 2000 }, as: Recruiter, captures: { ap: $.data.id } }
            - { call: "POST /pilot-training/applicants/${ap}/withdraw", payload: {}, as: Recruiter }
          trigger:
            - { call: "POST /pilot-training/applicants/${ap}/advance-screening", payload: {}, as: Recruiter, captures: { err: $.data.error_id } }
          assert:
            - "trigger returns 409 error_id == ERR_APPLICANT_INVALID_STATE (WITHDRAWN is terminal)"
      - name: applicant_appeal_loop_rejected_to_screening
        claim_type: valid_transition
        grounds: [state_machines.Applicant.REJECTED_to_SCREENING]
        test_recipe:
          setup: ["applicant rejected from SCREENING"]
          setup_api_calls:
            - { call: "POST /pilot-training/applicants", payload: { full_name: "App Eal", email: "app@x.com", license_number: "L411", total_flight_hours: 2000 }, as: Recruiter, captures: { ap: $.data.id } }
            - { call: "POST /pilot-training/applicants/${ap}/reject", payload: { reason: "docs" }, as: Recruiter }
          trigger:
            - { call: "POST /pilot-training/applicants/${ap}/appeal", payload: {}, as: Recruiter, captures: { st: $.data.status } }
          assert:
            - "Applicant.${ap}.status == SCREENING (cyclic appeal loop closes)"
      - name: records_request_verify_before_receive_rejected
        claim_type: invalid_transition
        grounds: [state_machines.RecordsRequest, "errors[ERR_RECORDS_REQUEST_INVALID_STATE]"]
        test_recipe:
          setup: ["records request SENT but never received"]
          setup_api_calls:
            - { call: "POST /pilot-training/applicants", payload: { full_name: "Rec Ord", email: "rec@x.com", license_number: "L412", total_flight_hours: 2000 }, as: Recruiter, captures: { ap: $.data.id } }
            - { call: "POST /pilot-training/records-requests", payload: { applicant_id: "${ap}", request_type: "PRIA" }, as: Recruiter, captures: { rr: $.data.id } }
            - { call: "POST /pilot-training/records-requests/${rr}/send", payload: {}, as: Recruiter }
          trigger:
            - { call: "POST /pilot-training/records-requests/${rr}/verify", payload: {}, as: Recruiter, captures: { err: $.data.error_id } }
          assert:
            - "trigger returns 409 error_id == ERR_RECORDS_REQUEST_INVALID_STATE"
      - name: records_request_send_stamps_due_at_plus_30_days
        claim_type: side_effect_execution
        grounds: [state_machines.RecordsRequest.DRAFT_to_SENT, entities.RecordsRequest.fields.due_at]
        test_recipe:
          setup: ["records request in DRAFT; logical clock at default 2026-08-01T00:00:00Z"]
          setup_api_calls:
            - { call: "POST /pilot-training/applicants", payload: { full_name: "Due At", email: "due@x.com", license_number: "L413", total_flight_hours: 2000 }, as: Recruiter, captures: { ap: $.data.id } }
            - { call: "POST /pilot-training/records-requests", payload: { applicant_id: "${ap}", request_type: "DRUG_TEST" }, as: Recruiter, captures: { rr: $.data.id } }
          trigger:
            - { call: "POST /pilot-training/records-requests/${rr}/send", payload: {}, as: Recruiter, captures: { sent: $.data.sent_at, due: $.data.due_at } }
          assert:
            - "RecordsRequest.${rr}.sent_at == 2026-08-01T00:00:00Z (logical clock default)"
            - "RecordsRequest.${rr}.due_at == 2026-08-31T00:00:00Z (sent_at + 30 days)"
      - name: records_request_expires_via_daily_scan
        claim_type: side_effect_execution
        grounds: [state_machines.RecordsRequest.SENT_to_EXPIRED]
        test_recipe:
          setup: ["records request SENT at default clock; clock advanced 31 days"]
          setup_api_calls:
            - { call: "POST /pilot-training/applicants", payload: { full_name: "Exp Ire", email: "exp@x.com", license_number: "L414", total_flight_hours: 2000 }, as: Recruiter, captures: { ap: $.data.id } }
            - { call: "POST /pilot-training/records-requests", payload: { applicant_id: "${ap}", request_type: "PRIA" }, as: Recruiter, captures: { rr: $.data.id } }
            - { call: "POST /pilot-training/records-requests/${rr}/send", payload: {}, as: Recruiter }
            - { call: "POST /pilot-training/_clock/set-current-utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: SystemAdmin }
          trigger:
            - { call: "POST /pilot-training/_ops/run-daily-scan", payload: {}, as: SystemAdmin }
            - { call: "GET /pilot-training/records-requests/${rr}", payload: {}, as: Recruiter, captures: { st: $.data.status } }
          assert:
            - "RecordsRequest.${rr}.status == EXPIRED (now 2026-09-01 > due_at 2026-08-31)"
      - name: enrollment_idempotent_second_confirm_rejected
        claim_type: idempotency
        grounds: [state_machines.Enrollment.TENTATIVE_to_CONFIRMED, "errors[ERR_ENROLLMENT_INVALID_STATE]"]
        test_recipe:
          setup: ["OPEN class with one TENTATIVE enrollment"]
          setup_api_calls:
            - { call: "POST /pilot-training/equipment", payload: { code: "MD88", name: "MD-88", simulator_cost_per_hour_cents: 40000, ioe_hours_required: 8, landings_required_90d: 3 }, as: TrainingCoordinator, captures: { eq: $.data.id } }
            - { call: "POST /pilot-training/applicants", payload: { full_name: "Ide Mpo", email: "ide@x.com", license_number: "L415", total_flight_hours: 2000 }, as: Recruiter, captures: { ap: $.data.id } }
            - { call: "POST /pilot-training/applicants/${ap}/advance-screening", payload: {}, as: Recruiter }
            - { call: "POST /pilot-training/records-requests", payload: { applicant_id: "${ap}", request_type: "PRIA" }, as: Recruiter, captures: { rr: $.data.id } }
            - { call: "POST /pilot-training/records-requests/${rr}/send", payload: {}, as: Recruiter }
            - { call: "POST /pilot-training/records-requests/${rr}/receive", payload: { outcome: "RECEIVED" }, as: Recruiter }
            - { call: "POST /pilot-training/records-requests/${rr}/verify", payload: {}, as: Recruiter }
            - { call: "POST /pilot-training/medical-certificates", payload: { applicant_id: "${ap}", cert_class: "FIRST", issued_at: "2026-07-01T00:00:00Z", pilot_age_at_issue: 30 }, as: CrewScheduler }
            - { call: "POST /pilot-training/applicants/${ap}/clear", payload: {}, as: Recruiter }
            - { call: "POST /pilot-training/training-classes", payload: { equipment_id: "${eq}", class_date: "2026-08-10T00:00:00Z", seat_capacity: 10, base_attrition_rate: 0.20 }, as: TrainingCoordinator, captures: { cls: $.data.id } }
            - { call: "POST /pilot-training/training-classes/${cls}/open", payload: {}, as: TrainingCoordinator }
            - { call: "GET /pilot-training/training-classes/${cls}", payload: {}, as: TrainingCoordinator, captures: { cv: $.data.version } }
            - { call: "POST /pilot-training/enrollments", payload: { applicant_id: "${ap}", training_class_id: "${cls}", expected_training_class_version: "${cv}" }, as: TrainingCoordinator, captures: { en: $.data.id } }
            - { call: "POST /pilot-training/enrollments/${en}/confirm", payload: {}, as: TrainingCoordinator }
          trigger:
            - { call: "POST /pilot-training/enrollments/${en}/confirm", payload: {}, as: TrainingCoordinator, captures: { err: $.data.error_id } }
          assert:
            - "second confirm returns 409 error_id == ERR_ENROLLMENT_INVALID_STATE (same trigger twice -> rejected, not silently re-applied)"
      - name: checkride_double_outcome_rejected
        claim_type: invalid_transition
        grounds: [state_machines.Checkride, "errors[ERR_CHECKRIDE_INVALID_STATE]"]
        test_recipe:
          setup: ["checkride already COMPLETED_PASS"]
          setup_api_calls:
            - { call: "POST /pilot-training/equipment", payload: { code: "MD90", name: "MD-90", simulator_cost_per_hour_cents: 40000, ioe_hours_required: 8, landings_required_90d: 3 }, as: TrainingCoordinator, captures: { eq: $.data.id } }
            - { call: "POST /pilot-training/applicants", payload: { full_name: "Dbl Out", email: "dbl@x.com", license_number: "L416", total_flight_hours: 3000 }, as: Recruiter, captures: { ap: $.data.id } }
            - { call: "POST /pilot-training/applicants/${ap}/advance-screening", payload: {}, as: Recruiter }
            - { call: "POST /pilot-training/records-requests", payload: { applicant_id: "${ap}", request_type: "PRIA" }, as: Recruiter, captures: { rr: $.data.id } }
            - { call: "POST /pilot-training/records-requests/${rr}/send", payload: {}, as: Recruiter }
            - { call: "POST /pilot-training/records-requests/${rr}/receive", payload: { outcome: "RECEIVED" }, as: Recruiter }
            - { call: "POST /pilot-training/records-requests/${rr}/verify", payload: {}, as: Recruiter }
            - { call: "POST /pilot-training/medical-certificates", payload: { applicant_id: "${ap}", cert_class: "FIRST", issued_at: "2026-07-01T00:00:00Z", pilot_age_at_issue: 30 }, as: CrewScheduler }
            - { call: "POST /pilot-training/applicants/${ap}/clear", payload: {}, as: Recruiter }
            - { call: "POST /pilot-training/training-classes", payload: { equipment_id: "${eq}", class_date: "2026-08-10T00:00:00Z", seat_capacity: 10, base_attrition_rate: 0.20 }, as: TrainingCoordinator, captures: { cls: $.data.id } }
            - { call: "POST /pilot-training/training-classes/${cls}/open", payload: {}, as: TrainingCoordinator }
            - { call: "GET /pilot-training/training-classes/${cls}", payload: {}, as: TrainingCoordinator, captures: { cv: $.data.version } }
            - { call: "POST /pilot-training/enrollments", payload: { applicant_id: "${ap}", training_class_id: "${cls}", expected_training_class_version: "${cv}" }, as: TrainingCoordinator, captures: { en: $.data.id } }
            - { call: "POST /pilot-training/enrollments/${en}/confirm", payload: {}, as: TrainingCoordinator }
            - { call: "POST /pilot-training/_clock/set-current-utc", payload: { to_iso8601: "2026-08-10T09:00:00Z" }, as: SystemAdmin }
            - { call: "POST /pilot-training/training-classes/${cls}/start", payload: {}, as: TrainingCoordinator }
            - { call: "POST /pilot-training/enrollments/${en}/start", payload: {}, as: TrainingCoordinator }
            - { call: "POST /pilot-training/instructors", payload: { full_name: "Air One", instructor_type: "CHECK_AIRMAN", daily_max_sessions: 8 }, as: TrainingCoordinator, captures: { ca1: $.data.id } }
            - { call: "POST /pilot-training/training-events", payload: { enrollment_id: "${en}", instructor_id: "${ca1}", phase: "GROUND_SCHOOL", event_type: "MILESTONE", scheduled_start: "2026-08-10T10:00:00Z", scheduled_end: "2026-08-10T12:00:00Z" }, as: TrainingCoordinator, captures: { evg: $.data.id } }
            - { call: "POST /pilot-training/_clock/set-current-utc", payload: { to_iso8601: "2026-08-10T10:00:00Z" }, as: SystemAdmin }
            - { call: "POST /pilot-training/training-events/${evg}/complete", payload: { score: 90 }, as: TrainingCoordinator }
            - { call: "POST /pilot-training/simulator-slots", payload: { equipment_id: "${eq}", start_at: "2026-08-11T08:00:00Z", end_at: "2026-08-11T18:00:00Z" }, as: TrainingCoordinator, captures: { slot: $.data.id } }
            - { call: "POST /pilot-training/training-events", payload: { enrollment_id: "${en}", instructor_id: "${ca1}", simulator_slot_id: "${slot}", phase: "SIMULATOR", event_type: "MILESTONE", scheduled_start: "2026-08-11T09:00:00Z", scheduled_end: "2026-08-11T11:00:00Z" }, as: TrainingCoordinator, captures: { evs: $.data.id } }
            - { call: "POST /pilot-training/_clock/set-current-utc", payload: { to_iso8601: "2026-08-11T09:00:00Z" }, as: SystemAdmin }
            - { call: "POST /pilot-training/training-events/${evs}/complete", payload: { score: 90 }, as: TrainingCoordinator }
            - { call: "POST /pilot-training/instructors", payload: { full_name: "Air Two", instructor_type: "CHECK_AIRMAN", daily_max_sessions: 8 }, as: TrainingCoordinator, captures: { ca2: $.data.id } }
            - { call: "POST /pilot-training/checkrides", payload: { enrollment_id: "${en}", check_airman_id: "${ca2}", ride_type: "PRACTICAL", scheduled_at: "2026-08-12T09:00:00Z" }, as: TrainingCoordinator, captures: { ck: $.data.id } }
            - { call: "POST /pilot-training/_clock/set-current-utc", payload: { to_iso8601: "2026-08-12T09:00:00Z" }, as: SystemAdmin }
            - { call: "POST /pilot-training/checkrides/${ck}/record-outcome", payload: { outcome: "PASS" }, as: CheckAirman, as_user_id: "${ca2}" }
          trigger:
            - { call: "POST /pilot-training/checkrides/${ck}/record-outcome", payload: { outcome: "FAIL" }, as: CheckAirman, as_user_id: "${ca2}", captures: { err: $.data.error_id } }
          assert:
            - "second record-outcome returns 409 error_id == ERR_CHECKRIDE_INVALID_STATE (COMPLETED_PASS is terminal)"
      - name: milestone_score_boundary_79_vs_80
        claim_type: side_effect_execution
        grounds: [state_machines.TrainingEvent.SCHEDULED_to_COMPLETED, calculations.training_footprint_cost]
        test_recipe:
          setup: ["enrollment IN_PROGRESS at GROUND_SCHOOL; two MILESTONE events completed with scores 79 and 80 respectively (two separate enrollments to isolate)"]
          setup_api_calls:
            - { call: "POST /pilot-training/equipment", payload: { code: "CRJ9", name: "CRJ-900", simulator_cost_per_hour_cents: 40000, ioe_hours_required: 8, landings_required_90d: 3 }, as: TrainingCoordinator, captures: { eq: $.data.id } }
            - { call: "POST /pilot-training/applicants", payload: { full_name: "Sco One", email: "sco1@x.com", license_number: "L417", total_flight_hours: 2000 }, as: Recruiter, captures: { ap1: $.data.id } }
            - { call: "POST /pilot-training/applicants/${ap1}/advance-screening", payload: {}, as: Recruiter }
            - { call: "POST /pilot-training/records-requests", payload: { applicant_id: "${ap1}", request_type: "PRIA" }, as: Recruiter, captures: { rr1: $.data.id } }
            - { call: "POST /pilot-training/records-requests/${rr1}/send", payload: {}, as: Recruiter }
            - { call: "POST /pilot-training/records-requests/${rr1}/receive", payload: { outcome: "RECEIVED" }, as: Recruiter }
            - { call: "POST /pilot-training/records-requests/${rr1}/verify", payload: {}, as: Recruiter }
            - { call: "POST /pilot-training/medical-certificates", payload: { applicant_id: "${ap1}", cert_class: "FIRST", issued_at: "2026-07-01T00:00:00Z", pilot_age_at_issue: 30 }, as: CrewScheduler }
            - { call: "POST /pilot-training/applicants/${ap1}/clear", payload: {}, as: Recruiter }
