              payload: { name: "Forecast Court", rent_cap_policy_id: "${pol}", min_term_months: 6, max_term_months: 24 }
              as: PlatformAdmin
              captures: { prop: $.data.id }
            - call: "POST /units"
              payload: { property_id: "${prop}", unit_number: "F1", bedrooms: 1, current_market_rent_cents: 210000 }
              as: PlatformAdmin
              captures: { u1: $.data.id }
            - call: "POST /units"
              payload: { property_id: "${prop}", unit_number: "F2", bedrooms: 1, current_market_rent_cents: 210000 }
