  # Section: endpoints
  # =================================================================
  - section: endpoints
    instances:
      - name: applications_list_pagination_and_filters
        claim_type: listing
        grounds: [endpoints, response_envelope]
        distinguishing_aspect: "GET /applications honors limit/offset with envelope pagination fields total_count and has_more; patient_id filter narrows results to that patient."
        test_recipe:
          setup: ["three applications across two patients"]
          setup_api_calls:
            - call: "POST /charity-care/patients"
              payload: { full_name: "List A", date_of_birth: "1990-01-01", ssn_last4: "0043", mrn: "MRN-LIST-A" }
              as: FinancialCounselor
              captures: { pat_a: $.data.id }
            - call: "POST /charity-care/patients"
              payload: { full_name: "List B", date_of_birth: "1990-01-01", ssn_last4: "0044", mrn: "MRN-LIST-B" }
              as: FinancialCounselor
              captures: { pat_b: $.data.id }
            - call: "POST /charity-care/applications"
              payload: { patient_id: "${pat_a}", screening_source: "STANDARD", reported_annual_income_cents: 1000000, reported_liquid_assets_cents: 0 }
              as: FinancialCounselor
            - call: "POST /charity-care/applications"
              payload: { patient_id: "${pat_a}", screening_source: "STANDARD", reported_annual_income_cents: 1000000, reported_liquid_assets_cents: 0 }
              as: FinancialCounselor
              captures: { err_dup: $.data.error_id }
          trigger:
            - call: "POST /charity-care/applications"
              payload: { patient_id: "${pat_b}", screening_source: "PRESUMPTIVE", reported_annual_income_cents: 2000000, reported_liquid_assets_cents: 0 }
              as: FinancialCounselor
            - call: "GET /charity-care/applications"
              as: FinancialCounselor
            - call: "GET /charity-care/applications"
              as: FinancialCounselor
          assert:
            - "setup sanity: second application for patient A failed with ERR_DUPLICATE_OPEN_APPLICATION (one-open rule) leaving 2 total applications"
            - "unfiltered list: total_count == 2, has_more == false with default limit 10"
            - "filter patient_id=${pat_a}: total_count == 1"
      - name: notices_reverse_reachability_on_both_parents
        claim_type: cross_reference
        grounds: [entities.NotificationRecord]
        distinguishing_aspect: "NotificationRecord is reachable from both parents: account notices via GET /accounts/{id}/notices and application letters via GET /applications/{id}/notices."
