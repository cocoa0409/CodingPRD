              as: Brewer
              as_user_id: "${b4_id}"
              captures: { lc2_id: $.data.id }
            - call: "POST /sales-orders/${oc_id}/confirm"
              payload: {}
              as: Brewer
              as_user_id: "${b4_id}"
            - call: "POST /sales-orders/${oc_id}/credit-decision"
              payload: { decision: "APPROVE" }
              as: CreditManager
            - call: "POST /sales-orders/${oc_id}/pick"
              payload: {}
