          assert:
            - "the scan starting exactly at 2026-07-15T00:00:00Z returns status 409 with error_id == \"ERR_SCAN_WINDOW_OVERLAP\" — closed endpoints that touch overlap"
            - "the scan starting at 2026-07-15T12:00:00Z returns status 409 with error_id == \"ERR_SCAN_WINDOW_OVERLAP\" — a 12-hour gap is inside the 24-hour cooldown"
            - "the scan starting at 2026-07-16T00:00:00Z returns status 201 — a gap of exactly SCAN_COOLDOWN_HOURS is outside the cooldown"
