              as: AttractionHost
              captures: { s1_id: $.data.id }
            - call: "POST /stores/${st_id}/ops-run"
              payload: {}
              as: PlatformAdmin
            - call: "POST /stores/${st_id}/ops-run"
              payload: {}
              as: PlatformAdmin
            - call: "GET /stores/sessions/${s1_id}"
              as: AttractionHost
            - call: "POST /stores/${st_id}/attraction-sessions"
              payload: { attraction_id: "${at_id}", member_id: "${m_id}", session_kind: "GENERAL_ADMISSION", party_size: 1, slot_start_utc: "2026-09-02T10:00:00Z", slot_end_utc: "2026-09-02T11:00:00Z" }
              as: AttractionHost
              captures: { s2_id: $.data.id }
            - call: "POST /stores/attraction-sessions/${s2_id}/check-in"
