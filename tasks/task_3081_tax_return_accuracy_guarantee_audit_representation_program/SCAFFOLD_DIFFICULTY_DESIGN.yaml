  - rule_id: cross_entity_state_dependency
    instances:
      - name: filing_requires_active_preparer
        grounds:
          - state_machines.TaxReturn.PREPARING_to_FILED
          - state_machines.Preparer
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: |
          TaxReturn PREPARING -> FILED depends on the Preparer entity's
          credential_status: while the preparer is SUSPENDED (by a probation close with
          an overdue remediation), filing the return fails; a fresh ACTIVE preparer
          files immediately. Pair: TaxReturn -> Preparer.
        test_recipe:
          setup:
            - "Office O1; preparers P1 (with overdue OPEN remediation due 2026-09-05) and P2 (clean)"
            - "Clients C1, C2; returns R1 (preparer P1) and R2 (preparer P2), both PREPARING, components [1040_SIMPLE]"
            - "Clock 2026-09-10; quality close 2026-09 at defect_rate 0.25 -> PROBATION -> P1 SUSPENDED"
          setup_api_calls:
            - call: "POST /tax/offices"
              payload: { name: "Office One", region_code: "CA" }
              as: ProgramAdmin
              captures: { off1: $.data.id }
            - call: "POST /tax/preparers"
              payload: { office_id: "${off1}", full_name: "P One", tier: "ASSOCIATE" }
              as: OfficeManager
              captures: { prep1: $.data.id }
            - call: "POST /tax/preparers"
              payload: { office_id: "${off1}", full_name: "P Two", tier: "ASSOCIATE" }
              as: OfficeManager
              captures: { prep2: $.data.id }
            - call: "POST /tax/clients"
              payload: { full_name: "Client One", email: "c1@example.com" }
              as: OfficeManager
              captures: { cli1: $.data.id }
            - call: "POST /tax/clients"
              payload: { full_name: "Client Two", email: "c2@example.com" }
              as: OfficeManager
              captures: { cli2: $.data.id }
            - call: "POST /tax/returns"
              payload: { client_id: "${cli1}", office_id: "${off1}", preparer_id: "${prep1}", tax_year: 2025, components: ["1040_SIMPLE"] }
              as: OfficeManager
              captures: { ret1: $.data.id }
            - call: "POST /tax/returns"
              payload: { client_id: "${cli2}", office_id: "${off1}", preparer_id: "${prep2}", tax_year: 2025, components: ["1040_SIMPLE"] }
              as: OfficeManager
              captures: { ret2: $.data.id }
            - call: "POST /tax/remediations"
              payload: { preparer_id: "${prep1}", due_at: "2026-09-05T00:00:00Z" }
              as: OfficeManager
            - call: "POST /tax/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-10T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /tax/offices/${off1}/quality-close"
              payload: { period_month: "2026-09", returns_examined: 100, returns_with_defects: 25 }
              as: OfficeManager
          trigger:
            - call: "POST /tax/returns/${ret1}/file"
              payload: {}
              as: OfficeManager
              captures: { err: $.data.error_id }
            - call: "POST /tax/returns/${ret2}/file"
              payload: {}
              as: OfficeManager
          assert:
            - "err == ERR_INVALID_STATE (P1 suspended)"
            - "TaxReturn.${ret1}.status == PREPARING"
            - "TaxReturn.${ret2}.status == FILED"
      - name: resolve_requires_notices_terminal
        grounds:
          - state_machines.Claim.REPRESENTING_to_RESOLVED
          - state_machines.AuthorityNotice
          - errors[ERR_NOTICE_NOT_TERMINAL]
        distinguishing_aspect: |
          Claim REPRESENTING -> RESOLVED depends on the AuthorityNotice entity's state:
          with the linked notice OPEN, resolve fails with ERR_NOTICE_NOT_TERMINAL;
          after the notice is PAID, the same resolve succeeds. Pair: Claim ->
          AuthorityNotice (different pair from TaxReturn -> Preparer).
        test_recipe:
          setup:
