      - name: cancelling_a_pending_order_returns_the_held_seats_to_the_window
        claim_type: compensation
        grounds:
          - state_machines[TicketOrder].transitions[PENDING -> CANCELLED]
          - endpoints[POST /ticket-orders/{orderId}/cancel]
          - entities.TimedEntrySlot.fields.held_capacity
        distinguishing_aspect: |
          The PENDING branch of cancel is the pure compensation: it must undo exactly the hold that
          the create placed — held_capacity down, available_capacity up — and must NOT run the
          refund ladder that the CONFIRMED branch runs. So refund_pct stays 0.00 with
          refunded_cents, credit_issued_cents and the guest's experience_credit_cents all still 0,
          even though the order carries a non-zero net_amount_cents. The slot must land byte-for-byte
          back on its pre-order ledger.
