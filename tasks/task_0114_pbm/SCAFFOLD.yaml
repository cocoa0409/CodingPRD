scenario: |
  Pharmacy Benefit Management (PBM): formulary tiering, Step Therapy, prior authorization,
  Copay Card, 90-day mail order, Specialty Pharmacy, rebate clawback.

domain_name: pbm
api_prefix: /pbm

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: pricing_engine
  complexity_layers:
    - dual_variant_calculation
    - cascading_side_effects
    - rate_threshold_triggers
    - derived_field_reconciliation
    - conditional_feature_flags
  entity_topology: flat
  state_machine_shape: cyclic
  relationship_patterns:
    - one_to_many
    - many_to_many
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Member
    parent: null
    common_fields: true
    fields:
      - name: plan_id
        type: string
        source: input
        description: "FK to Plan.id — the benefit plan the member is enrolled in"
      - name: full_name
        type: string
        source: input
        description: "Member full legal name (required for adjudication)"
      - name: date_of_birth
        type: datetime
        source: input
        description: "DOB date (ISO 8601 calendar date)"
      - name: enrollment_status
        type: enum
        source: system
        description: "ACTIVE | SUSPENDED | TERMINATED"
        default: ACTIVE
        constraints: "values: ACTIVE, SUSPENDED, TERMINATED"
      - name: ytd_deductible_paid_cents
        type: integer
        source: computed
        description: "Cumulative member-paid deductible dollars (in cents) for the current benefit year; reset by clock-year rollover"
        default: 0
      - name: ytd_oop_paid_cents
        type: integer
        source: computed
        description: "Cumulative member out-of-pocket (in cents) for the current benefit year, includes deductible + coinsurance + copay; resets yearly"
        default: 0
      - name: benefit_year_start
        type: datetime
        source: system
        description: "ISO 8601 UTC datetime — start of the member's current benefit year (advanced by clock rollover)"

  - name: Plan
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: "Human-readable plan name"
      - name: deductible_cents
        type: integer
        source: input
        description: "Annual deductible per member, in cents; non-negative"
        constraints: ">= 0"
      - name: oop_max_cents
        type: integer
        source: input
        description: "Annual out-of-pocket maximum per member, in cents; must be >= deductible_cents"
        constraints: ">= deductible_cents"
      - name: coinsurance_rate
        type: number
        source: input
        description: "Member coinsurance rate after deductible, e.g., 0.20 = member pays 20%. 0 <= rate <= 1"
        constraints: "0 <= rate <= 1"
      - name: mail_order_discount_rate
        type: number
        source: input
        description: "Multiplier applied to retail allowed charge when channel == MAIL_ORDER (e.g., 0.90 = 10% off). 0 < rate <= 1"
        default: 0.90
        constraints: "0 < rate <= 1"
      - name: status
        type: enum
        source: system
        description: "ACTIVE | ARCHIVED"
        default: ACTIVE

  - name: Drug
    parent: null
    common_fields: true
    fields:
      - name: ndc
        type: string
        source: input
        description: "11-digit National Drug Code, globally unique across active drugs"
        constraints: "unique among Drug.status=ACTIVE; format /^[0-9]{11}$/"
      - name: generic_name
        type: string
        source: input
        description: "Generic/INN drug name"
      - name: brand_name
        type: string
        source: input
        description: "Brand or trade name (may equal generic_name for generics)"
      - name: is_specialty
        type: boolean
        source: input
        description: "True if the drug must be dispensed via SpecialtyPharmacy channel"
        default: false
      - name: requires_prior_auth
        type: boolean
        source: input
        description: "True if all claims for this drug require an APPROVED PriorAuthorization"
        default: false
      - name: step_therapy_predecessor_ndc
        type: string
        source: input
        description: "NDC of a step-therapy predecessor drug; nullable. If set, member must have a prior PAID Claim for this predecessor in the current benefit year before this drug may be dispensed without an APPROVED PA"
        default: null
      - name: unit_allowed_cents
        type: integer
        source: input
        description: "PBM allowed charge per dispensed unit (per pill/mL/etc.), in cents; non-negative"
        constraints: ">= 0"
      - name: status
        type: enum
        source: system
        description: "ACTIVE | ARCHIVED"
        default: ACTIVE

  - name: FormularyEntry
    parent: null
    common_fields: true
    fields:
      - name: plan_id
        type: string
        source: input
        description: "FK to Plan.id"
      - name: drug_id
        type: string
        source: input
        description: "FK to Drug.id"
      - name: tier
        type: integer
        source: input
        description: "Formulary tier 1..5; 1 = preferred generic, 5 = specialty/non-preferred"
        constraints: "1 <= tier <= 5"
      - name: copay_cents
        type: integer
        source: input
        description: "Flat retail copay for this drug on this plan when retail channel and after deductible; in cents; non-negative"
        constraints: ">= 0"
      - name: status
        type: enum
        source: system
        description: "ACTIVE | ARCHIVED"
        default: ACTIVE

  - name: PriorAuthorization
    parent: null
    common_fields: true
    fields:
      - name: member_id
        type: string
        source: input
        description: "FK to Member.id"
      - name: drug_id
        type: string
        source: input
        description: "FK to Drug.id"
      - name: prescriber_npi
        type: string
        source: input
        description: "10-digit prescriber NPI"
        constraints: "/^[0-9]{10}$/"
      - name: clinical_rationale
        type: string
        source: input
        description: "Free-text justification provided by prescriber; non-empty"
      - name: status
        type: enum
        source: system
        description: "DRAFT | SUBMITTED | INFO_REQUESTED | APPROVED | DENIED | REVOKED | EXPIRED"
        default: DRAFT
        constraints: "values: DRAFT, SUBMITTED, INFO_REQUESTED, APPROVED, DENIED, REVOKED, EXPIRED"
      - name: effective_start
        type: datetime
        source: computed
        description: "ISO 8601 UTC — set on APPROVE transition to the current clock time; null otherwise"
        default: null
      - name: effective_end
        type: datetime
        source: computed
        description: "ISO 8601 UTC — set on APPROVE transition to effective_start + 180 days; null otherwise"
        default: null
      - name: revision_count
        type: integer
        source: computed
        description: "Number of times this PA has been pushed back to INFO_REQUESTED then resubmitted"
        default: 0
      - name: denial_reason
        type: string
        source: computed
        description: "Reason set on DENY transition; nullable"
        default: null

  - name: Claim
    parent: null
    common_fields: true
    fields:
      - name: member_id
        type: string
        source: input
        description: "FK to Member.id"
      - name: drug_id
        type: string
        source: input
        description: "FK to Drug.id"
      - name: channel
        type: enum
        source: input
        description: "RETAIL_30 | MAIL_ORDER_90 | SPECIALTY"
        constraints: "values: RETAIL_30, MAIL_ORDER_90, SPECIALTY"
      - name: days_supply
        type: integer
        source: input
        description: "Days supplied. RETAIL_30 -> 1..34; MAIL_ORDER_90 -> 60..100; SPECIALTY -> 1..30"
        constraints: ">= 1"
      - name: quantity
        type: integer
        source: input
        description: "Number of dispensed units (pills/mL); strictly positive"
        constraints: ">= 1"
      - name: prior_auth_id
        type: string
        source: input
        description: "Optional FK to PriorAuthorization.id; required when drug.requires_prior_auth"
        default: null
      - name: copay_card_id
        type: string
        source: input
        description: "Optional FK to CopayCard.id; applied to member responsibility after plan adjudication"
        default: null
      - name: estimated_member_cost_cents
        type: integer
        source: computed
        description: "Estimated member responsibility, computed on SUBMIT before adjudication; uses pre-claim YTD balances"
        default: 0
      - name: adjudicated_allowed_cents
        type: integer
        source: computed
        description: "Total allowed charge after channel discount: unit_allowed * quantity * channel_multiplier; set on ADJUDICATE"
        default: 0
      - name: adjudicated_member_cost_cents
        type: integer
        source: computed
        description: "Final member responsibility after adjudication and copay-card application; set on ADJUDICATE"
        default: 0
      - name: adjudicated_plan_paid_cents
        type: integer
        source: computed
        description: "Plan-paid portion = adjudicated_allowed_cents - adjudicated_member_cost_cents_before_card; set on ADJUDICATE"
        default: 0
      - name: copay_card_paid_cents
        type: integer
        source: computed
        description: "Amount funded by the copay card on this claim; set on ADJUDICATE"
        default: 0
      - name: status
        type: enum
        source: system
        description: "SUBMITTED | ADJUDICATED | PAID | REVERSED | REJECTED"
        default: SUBMITTED
        constraints: "values: SUBMITTED, ADJUDICATED, PAID, REVERSED, REJECTED"
      - name: payment_status
        type: enum
        source: system
        description: "Parallel axis to status. UNPAID | PAID | REFUNDED. Evolves independently of adjudication axis"
        default: UNPAID
        constraints: "values: UNPAID, PAID, REFUNDED"
      - name: reject_reason
        type: string
        source: computed
        description: "Set when status transitions to REJECTED"
        default: null

  - name: CopayCard
    parent: null
    common_fields: true
    fields:
      - name: member_id
        type: string
        source: input
        description: "FK to Member.id"
      - name: drug_id
        type: string
        source: input
        description: "FK to Drug.id — card is drug-specific"
      - name: max_benefit_cents
        type: integer
        source: input
        description: "Lifetime cap of card assistance, in cents; non-negative"
        constraints: ">= 0"
      - name: per_claim_cap_cents
        type: integer
        source: input
        description: "Maximum dollars the card will pay on a single claim; non-negative; <= max_benefit_cents"
        constraints: "0 <= per_claim_cap_cents <= max_benefit_cents"
      - name: used_cents
        type: integer
        source: computed
        description: "Cumulative dollars consumed by PAID claims; resets only on card EXHAUST"
        default: 0
      - name: status
        type: enum
        source: system
        description: "ACTIVE | EXHAUSTED | TERMINATED"
        default: ACTIVE
        constraints: "values: ACTIVE, EXHAUSTED, TERMINATED"

  - name: RebateAgreement
    parent: null
    common_fields: true
    fields:
      - name: drug_id
        type: string
        source: input
        description: "FK to Drug.id — agreement is drug-specific"
      - name: manufacturer_name
        type: string
        source: input
        description: "Manufacturer party to the agreement"
      - name: rebate_rate
        type: number
        source: input
        description: "Fraction of plan_paid amount returned to PBM, e.g., 0.15 = 15%. 0 <= rate <= 1"
        constraints: "0 <= rate <= 1"
      - name: clawback_window_days
        type: integer
        source: input
        description: "Days after a claim is PAID during which the rebate may be clawed back (e.g., on REVERSE). Integer >= 0"
        default: 90
        constraints: ">= 0"
      - name: status
        type: enum
        source: system
        description: "ACTIVE | TERMINATED"
        default: ACTIVE

  - name: LedgerEntry
    parent: null
    common_fields: false
    fields:
      - name: claim_id
        type: string
        source: input
        description: "FK to Claim.id triggering the entry"
      - name: rebate_agreement_id
        type: string
        source: input
        description: "FK to RebateAgreement.id"
      - name: entry_type
        type: enum
        source: system
        description: "REBATE_ACCRUED | REBATE_CLAWBACK"
        constraints: "values: REBATE_ACCRUED, REBATE_CLAWBACK"
      - name: amount_cents
        type: integer
        source: system
        description: "Signed integer cents — positive for REBATE_ACCRUED (incoming to PBM), negative for REBATE_CLAWBACK (outgoing)"
      - name: posted_at
        type: datetime
        source: system
        description: "ISO 8601 UTC timestamp from the simulated clock at posting time"

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: PriorAuthorization
    initial_state: DRAFT
    terminal_states: [DENIED, REVOKED, EXPIRED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /pbm/prior-authorizations/{id}/submit"
        actor: Prescriber
        preconditions:
          - "PriorAuthorization.status == DRAFT"
          - "clinical_rationale is non-empty"
        side_effects:
          - "no field changes other than status, updated_at, version"
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /pbm/prior-authorizations/{id}/approve"
        actor: ClinicalReviewer
        preconditions:
          - "PriorAuthorization.status == SUBMITTED"
          - "Member.enrollment_status == ACTIVE"
        side_effects:
          - "effective_start = clock_now()"
          - "effective_end = clock_now() + 180 days"
      - from: SUBMITTED
        to: INFO_REQUESTED
        trigger: "POST /pbm/prior-authorizations/{id}/request-info"
        actor: ClinicalReviewer
        preconditions:
          - "PriorAuthorization.status == SUBMITTED"
        side_effects:
          - "revision_count is unchanged on this hop"
      - from: INFO_REQUESTED
        to: SUBMITTED
        trigger: "POST /pbm/prior-authorizations/{id}/resubmit"
        actor: Prescriber
        preconditions:
          - "PriorAuthorization.status == INFO_REQUESTED"
          - "revision_count < 3"
        side_effects:
          - "revision_count += 1"
        note: "Cyclic SUBMITTED <-> INFO_REQUESTED loop is bounded by revision_count < 3; the 3rd revision must reach a terminal state"
      - from: SUBMITTED
        to: DENIED
        trigger: "POST /pbm/prior-authorizations/{id}/deny"
        actor: ClinicalReviewer
        preconditions:
          - "PriorAuthorization.status == SUBMITTED"
        side_effects:
          - "denial_reason set from request body"
          - "cascade: all subsequent SUBMITTED Claims referencing this PA are rejected on adjudication (ERR_PA_DENIED) — see Claim ADJUDICATE preconditions"
      - from: APPROVED
        to: REVOKED
        trigger: "POST /pbm/prior-authorizations/{id}/revoke"
        actor: ClinicalReviewer
        preconditions:
          - "PriorAuthorization.status == APPROVED"
        side_effects:
          - "cascade depth 3: revoking a PA invalidates the PA for future claims; any Claim currently in SUBMITTED that references this PA will fail ADJUDICATE with ERR_PA_REVOKED; that REJECTED claim leaves Member YTD unchanged (no further hop) — claims already PAID are NOT auto-reversed by revoke; operator must call POST /pbm/claims/{id}/reverse explicitly"
      - from: APPROVED
        to: EXPIRED
        trigger: "POST /_clock/advance (when clock_now() >= effective_end)"
        actor: system
        preconditions:
          - "PriorAuthorization.status == APPROVED"
          - "clock_now() >= effective_end"
        side_effects:
          - "transition is auto-applied on every clock advance"

  - entity: Claim
    initial_state: SUBMITTED
    terminal_states: [REJECTED]
    transitions:
      - from: SUBMITTED
        to: ADJUDICATED
        trigger: "POST /pbm/claims/{id}/adjudicate"
        actor: ClaimsAdjudicator
        preconditions:
          - "Claim.status == SUBMITTED"
          - "Member.enrollment_status == ACTIVE  # cross-entity: claim status depends on member state"
          - "if Drug.requires_prior_auth: PriorAuthorization.status == APPROVED AND PA effective_start <= clock_now() < effective_end AND PA.member_id == Claim.member_id AND PA.drug_id == Claim.drug_id"
          - "if Drug.step_therapy_predecessor_ndc IS NOT NULL AND no APPROVED PA: there exists a Claim with status == PAID, member_id == Claim.member_id, drug_id == Drug(ndc=step_therapy_predecessor_ndc).id, adjudicated_at within current benefit year"
          - "if Drug.is_specialty: channel == SPECIALTY"
          - "if channel == MAIL_ORDER_90: 60 <= days_supply <= 100"
          - "if channel == RETAIL_30: 1 <= days_supply <= 34"
          - "if channel == SPECIALTY: 1 <= days_supply <= 30"
          - "no other Claim for (member_id, drug_id) with status IN {ADJUDICATED, PAID} overlaps the projected [start_of_supply, start_of_supply + days_supply) interval (refill-too-soon, half-open)"
        side_effects:
          - "compute adjudicated_allowed_cents via calc rule adjudicated_allowed"
          - "compute adjudicated_member_cost_cents via calc rule adjudicated_member_cost (consumes deductible, applies coinsurance, applies copay card)"
          - "compute adjudicated_plan_paid_cents = adjudicated_allowed_cents - (adjudicated_member_cost_cents + copay_card_paid_cents)"
          - "Member.ytd_deductible_paid_cents and Member.ytd_oop_paid_cents incremented per calc adjudicated_member_cost"
          - "if copay_card_id IS NOT NULL: CopayCard.used_cents += copay_card_paid_cents; if used_cents == max_benefit_cents -> CopayCard.status = EXHAUSTED"
      - from: ADJUDICATED
        to: PAID
        trigger: "POST /pbm/claims/{id}/pay"
        actor: ClaimsAdjudicator
        preconditions:
          - "Claim.status == ADJUDICATED"
        side_effects:
          - "Claim.payment_status = PAID  # parallel axis"
          - "if RebateAgreement(drug_id=Claim.drug_id, status=ACTIVE) exists: post LedgerEntry(entry_type=REBATE_ACCRUED, amount_cents = round_half_up(Claim.adjudicated_plan_paid_cents * RebateAgreement.rebate_rate))"
      - from: PAID
        to: REVERSED
        trigger: "POST /pbm/claims/{id}/reverse"
        actor: ClaimsAdjudicator
        preconditions:
          - "Claim.status == PAID"
          - "clock_now() < (the timestamp of the LedgerEntry for this Claim with entry_type=REBATE_ACCRUED).posted_at + RebateAgreement.clawback_window_days days  # if a rebate was accrued"
        side_effects:
          - "Claim.payment_status = REFUNDED  # parallel axis"
          - "Member.ytd_deductible_paid_cents -= (deductible portion of this claim)"
          - "Member.ytd_oop_paid_cents -= adjudicated_member_cost_cents"
          - "if copay_card_paid_cents > 0: CopayCard.used_cents -= copay_card_paid_cents; CopayCard.status reverts to ACTIVE if previously EXHAUSTED"
          - "if a LedgerEntry(entry_type=REBATE_ACCRUED) exists for this Claim: post LedgerEntry(entry_type=REBATE_CLAWBACK, amount_cents = -accrued_amount). Invariant: sum(LedgerEntry.amount_cents WHERE claim_id == Claim.id) == 0 after the clawback"
        note: "cascade depth 3: REVERSE on Claim -> mutate Member YTD -> the changed YTD then changes the deductible-attribution outcome for the NEXT adjudicated claim of the same member"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /pbm/claims/{id}/adjudicate (precondition failure)"
        actor: ClaimsAdjudicator
        preconditions:
          - "Claim.status == SUBMITTED"
          - "any ADJUDICATE precondition fails"
        side_effects:
          - "reject_reason set from the failing precondition; no Member.ytd_* changes"

  - entity: CopayCard
    initial_state: ACTIVE
    terminal_states: [TERMINATED]
    transitions:
      - from: ACTIVE
        to: EXHAUSTED
        trigger: "automatic on Claim ADJUDICATE when used_cents reaches max_benefit_cents"
        actor: system
        preconditions:
          - "CopayCard.status == ACTIVE"
          - "CopayCard.used_cents + this_claim_card_share >= CopayCard.max_benefit_cents"
        side_effects:
          - "used_cents set to max_benefit_cents (any overflow above the cap is NOT funded; member pays the remainder)"
      - from: EXHAUSTED
        to: ACTIVE
        trigger: "automatic on Claim REVERSE when used_cents drops below max_benefit_cents"
        actor: system
        preconditions:
          - "CopayCard.status == EXHAUSTED"
          - "after refund: used_cents < max_benefit_cents"
        side_effects:
          - "no further fields change beyond used_cents and status"
      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /pbm/copay-cards/{id}/terminate"
        actor: PBMAdmin
        preconditions:
          - "CopayCard.status == ACTIVE"
        side_effects:
          - "subsequent Claim ADJUDICATE will ignore this card (treat as if copay_card_id == null)"
      - from: EXHAUSTED
        to: TERMINATED
        trigger: "POST /pbm/copay-cards/{id}/terminate"
        actor: PBMAdmin
        preconditions:
          - "CopayCard.status == EXHAUSTED"
        side_effects: []

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - scenario: "Two simultaneous /adjudicate calls on different Claim ids for the same (member_id, drug_id) overlapping the same supply window"
    guarantee: "At most one claim transitions to ADJUDICATED; the loser is REJECTED with refill-too-soon"
    error_id: ERR_REFILL_TOO_SOON
    http_status: 409
    serialization: "First-writer-wins on Claim.adjudicated_allowed_cents being set; loser observes the existing ADJUDICATED row and fails its refill-window precondition"

  - scenario: "Two simultaneous /approve calls on the same PriorAuthorization id"
    guarantee: "Exactly one succeeds; the loser observes the new status and is rejected"
    error_id: ERR_INVALID_STATE
    http_status: 409
    serialization: "First-writer-wins on PriorAuthorization.status"

  - scenario: "Two simultaneous /adjudicate calls on different Claim ids both consuming the same CopayCard's last remaining dollars"
    guarantee: "Card pays at most max_benefit_cents total across both claims; whichever request arrives second sees lower (or zero) remaining card balance"
    error_id: ERR_COPAY_CARD_EXHAUSTED
    http_status: 409
    serialization: "First-writer-wins on CopayCard.used_cents reaching max_benefit_cents; the loser of the cap race observes EXHAUSTED status and the card contributes 0 to its claim"

  - scenario: "Reverse and a downstream adjudicate race on the same Member (the reverse refunds YTD while the new adjudicate consumes YTD)"
    guarantee: "Member YTD counters are linearized; the second operation reads the first operation's committed YTD values"
    error_id: ERR_INVALID_STATE
    http_status: 409
    serialization: "First-writer-wins on Member.version; loser must retry with refreshed version"

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: estimated_member_cost
    trigger: "POST /pbm/claims on Claim creation (status SUBMITTED), BEFORE adjudication"
    algorithm: forward_looking
    formula: |
      # FORWARD-LOOKING variant: use member's CURRENT YTD balances at submission time
      # and assume no prior in-flight claims will consume deductible before this one.
      # All arithmetic in integer cents.
      allowed = Drug.unit_allowed_cents * Claim.quantity
      if Claim.channel == "MAIL_ORDER_90":
          allowed = round_half_up(allowed * Plan.mail_order_discount_rate)
      # No channel discount for RETAIL_30 or SPECIALTY.

      ytd_ded_before = Member.ytd_deductible_paid_cents
      ytd_oop_before = Member.ytd_oop_paid_cents

      deductible_remaining = max(Plan.deductible_cents - ytd_ded_before, 0)
      deductible_portion   = min(allowed, deductible_remaining)
      post_ded             = allowed - deductible_portion

      # After deductible: tier-1 and tier-2 use flat formulary copay; tier 3,4,5 use coinsurance
      tier = FormularyEntry.tier
      if tier <= 2:
          plan_share_cost = FormularyEntry.copay_cents  # member-share is flat copay
          member_share_after_ded = min(FormularyEntry.copay_cents, post_ded)
      else:
          member_share_after_ded = round_half_up(post_ded * Plan.coinsurance_rate)

      member_pre_card = deductible_portion + member_share_after_ded

      # Apply OOP cap: member never pays beyond oop_max within the year.
      oop_remaining = max(Plan.oop_max_cents - ytd_oop_before, 0)
      member_pre_card = min(member_pre_card, oop_remaining)

      # Copay card application (only if card ACTIVE and same drug):
      card_payable = 0
      if Claim.copay_card_id is not None:
          card = CopayCard(Claim.copay_card_id)
          if card.status == "ACTIVE" and card.drug_id == Claim.drug_id and card.member_id == Claim.member_id:
              card_payable = min(card.per_claim_cap_cents,
                                 card.max_benefit_cents - card.used_cents,
                                 member_pre_card)

      estimated_member_cost_cents = member_pre_card - card_payable
    input_set: "Member at submission time (pre-claim YTD), Plan, Drug, FormularyEntry(plan_id, drug_id) WHERE status=ACTIVE, CopayCard (if any) WHERE status=ACTIVE"
    constants:
      ROUNDING: "round_half_up to integer cents on each multiplication step"
    precision: "integer cents; round_half_up at each multiplication step"
    variants:
      - name: provisional
        when: "POST /pbm/claims creation only"
        difference: "Uses Member YTD as of submission. Does NOT re-read YTD on ADJUDICATE."

  - name: adjudicated_member_cost
    trigger: "POST /pbm/claims/{id}/adjudicate"
    algorithm: chronological
    formula: |
      # CHRONOLOGICAL variant: re-read Member YTD AT ADJUDICATION TIME, which may
      # differ from submission-time YTD if other claims were adjudicated in between
      # (or REVERSED). Same per-step rounding as estimated_member_cost.
      allowed = Drug.unit_allowed_cents * Claim.quantity
      if Claim.channel == "MAIL_ORDER_90":
          allowed = round_half_up(allowed * Plan.mail_order_discount_rate)

      ytd_ded_before = Member.ytd_deductible_paid_cents   # CURRENT value, not submission-time value
      ytd_oop_before = Member.ytd_oop_paid_cents

      deductible_remaining = max(Plan.deductible_cents - ytd_ded_before, 0)
      deductible_portion   = min(allowed, deductible_remaining)
      post_ded             = allowed - deductible_portion

      tier = FormularyEntry.tier
      if tier <= 2:
          member_share_after_ded = min(FormularyEntry.copay_cents, post_ded)
      else:
          member_share_after_ded = round_half_up(post_ded * Plan.coinsurance_rate)

      member_pre_card = deductible_portion + member_share_after_ded

      oop_remaining = max(Plan.oop_max_cents - ytd_oop_before, 0)
      member_pre_card = min(member_pre_card, oop_remaining)

      card_payable = 0
      if Claim.copay_card_id is not None:
          card = CopayCard(Claim.copay_card_id)
          if card.status == "ACTIVE" and card.drug_id == Claim.drug_id and card.member_id == Claim.member_id:
              card_payable = min(card.per_claim_cap_cents,
                                 card.max_benefit_cents - card.used_cents,
                                 member_pre_card)

      adjudicated_member_cost_cents = member_pre_card - card_payable
      adjudicated_allowed_cents     = allowed
      copay_card_paid_cents         = card_payable
      adjudicated_plan_paid_cents   = allowed - (member_pre_card)   # NOTE: plan_paid is computed BEFORE the card offset (the card pays the member's share, not the plan's)

      # Side-effect writes (pinned ORDER):
      #   1. Increment Member.ytd_deductible_paid_cents by deductible_portion
      #   2. Increment Member.ytd_oop_paid_cents       by member_pre_card     # OOP counts pre-card member share
      #   3. Increment CopayCard.used_cents            by card_payable
    input_set: "Member at adjudication time (current YTD), Plan, Drug, FormularyEntry(plan_id, drug_id) WHERE status=ACTIVE, CopayCard (if any) WHERE status=ACTIVE; PriorAuthorization must satisfy preconditions per Claim ADJUDICATE"
    constants:
      ROUNDING: "round_half_up to integer cents on each multiplication step"
      SIDE_EFFECT_ORDER: "deductible -> oop -> card"
    precision: "integer cents; round_half_up at each multiplication step; per-claim copay-card cap applied AFTER member_pre_card is finalized; OOP counts member_pre_card not adjudicated_member_cost_cents"
    variants:
      - name: final
        when: "POST /pbm/claims/{id}/adjudicate"
        difference: "Uses Member YTD AT ADJUDICATION TIME. Will diverge from estimated_member_cost when another claim for the same member adjudicated between submission and this adjudication."

  - name: rebate_accrual
    trigger: "POST /pbm/claims/{id}/pay (after Claim.adjudicated_plan_paid_cents is set)"
    algorithm: aggregation
    formula: |
      # PROVISIONAL accrual: posted at PAY time
      agreement = RebateAgreement WHERE drug_id == Claim.drug_id AND status == ACTIVE
      if agreement is None:
          # no LedgerEntry posted
          accrued = 0
      else:
          accrued = round_half_up(Claim.adjudicated_plan_paid_cents * agreement.rebate_rate)
          # Post LedgerEntry(claim_id, rebate_agreement_id=agreement.id, entry_type=REBATE_ACCRUED, amount_cents=+accrued)
    input_set: "Claim WHERE status transitions ADJUDICATED -> PAID; RebateAgreement WHERE drug_id == Claim.drug_id AND status == ACTIVE"
    constants:
      ROUNDING: "round_half_up to integer cents"
    precision: "integer cents"
    variants:
      - name: provisional
        when: "Claim PAY"
        difference: "Counts the accrual as if final. Subject to clawback if Claim reverses within clawback_window_days."

  - name: rebate_final_after_clawback
    trigger: "POST /pbm/claims/{id}/reverse (when an accrual exists)"
    algorithm: chronological
    formula: |
      # FINAL net rebate position: provisional accrual MINUS clawback if reversed
      # within clawback_window_days; otherwise final == provisional.
      accrued_entry = LedgerEntry WHERE claim_id == Claim.id AND entry_type == REBATE_ACCRUED
      if accrued_entry is None:
          # Nothing to claw back
          final_rebate_cents = 0
      else:
          agreement = RebateAgreement(accrued_entry.rebate_agreement_id)
          if clock_now() < accrued_entry.posted_at + agreement.clawback_window_days days:
              # Claw back the full accrued amount
              clawback_amount = -accrued_entry.amount_cents
              # Post LedgerEntry(claim_id, rebate_agreement_id, entry_type=REBATE_CLAWBACK, amount_cents=clawback_amount)
              final_rebate_cents = accrued_entry.amount_cents + clawback_amount  # == 0
          else:
              # Outside clawback window — no clawback; claim is still REVERSED but
              # the rebate is retained.
              final_rebate_cents = accrued_entry.amount_cents

      # INVARIANT (compensating action): if reversal happens within window,
      # sum(LedgerEntry.amount_cents WHERE claim_id == Claim.id) == 0
    input_set: "LedgerEntry WHERE claim_id == Claim.id, RebateAgreement (via accrued_entry.rebate_agreement_id), simulated clock"
    constants:
      ROUNDING: "no rounding — uses already-rounded provisional accrual"
    precision: "integer cents"
    variants:
      - name: within_window
        when: "REVERSE occurs within clawback_window_days of the accrual posting"
        difference: "Net rebate to PBM is 0 (full clawback)."
      - name: outside_window
        when: "REVERSE occurs at or after clawback_window_days from the accrual posting"
        difference: "Net rebate retained (no clawback ledger entry)."

  - name: refill_too_soon_check
    trigger: "POST /pbm/claims/{id}/adjudicate (precondition evaluation)"
    algorithm: interval_merge
    formula: |
      # Half-open interval semantics: a claim is refill-too-soon if its projected
      # supply window [start_of_supply, start_of_supply + days_supply) overlaps
      # any existing Claim for the same (member_id, drug_id) with status IN
      # {ADJUDICATED, PAID}.
      #
      # start_of_supply := for the candidate claim being adjudicated, equals the
      # adjudication clock_now(). For an existing Claim X, start_of_supply equals
      # the clock_now() at the moment X transitioned to ADJUDICATED (stored as
      # X.updated_at on that transition, since X.adjudicated_allowed_cents was
      # written there).
      #
      # Two half-open intervals [a, a+da) and [b, b+db) overlap iff a < b+db AND b < a+da.
      # Adjacency does NOT count as overlap (a == b+db is allowed).
      for X in Claims WHERE member_id == candidate.member_id
                       AND drug_id   == candidate.drug_id
                       AND status   IN {ADJUDICATED, PAID}
                       AND id       != candidate.id:
          start_x = X.updated_at_at_ADJUDICATED_transition
          end_x   = start_x + X.days_supply days
          start_c = clock_now()
          end_c   = start_c + candidate.days_supply days
          if start_c < end_x AND start_x < end_c:
              return REFILL_TOO_SOON
      return OK
    input_set: "Claims for the same (member_id, drug_id) excluding REJECTED and REVERSED; the candidate's days_supply"
    constants:
      INTERVAL_SEMANTICS: "half-open [start, start+days_supply)"
    precision: "no rounding — date arithmetic at day granularity"
    variants:
      - name: half_open
        when: "always (PBM refill-too-soon)"
        difference: "Adjacency at exact day boundary is allowed (start_c == end_x is OK)"

  - name: pa_effective_window_check
    trigger: "POST /pbm/claims/{id}/adjudicate (precondition evaluation when Drug.requires_prior_auth)"
    algorithm: interval_merge
    formula: |
      # CLOSED-ON-LEFT, OPEN-ON-RIGHT interval semantics:
      # The claim's adjudication clock_now() must satisfy:
      #     PA.effective_start <= clock_now() < PA.effective_end
      #
      # If clock_now() == effective_end exactly, the PA has just EXPIRED (the
      # auto-transition runs at the same instant), and the claim is REJECTED.
      pa = PriorAuthorization(Claim.prior_auth_id)
      if pa.status != "APPROVED":      return ERR_PA_NOT_APPROVED
      if pa.member_id != Claim.member_id or pa.drug_id != Claim.drug_id:
          return ERR_PA_MISMATCH
      if not (pa.effective_start <= clock_now() < pa.effective_end):
          return ERR_PA_EXPIRED
      return OK
    input_set: "PriorAuthorization referenced by Claim.prior_auth_id"
    constants:
      INTERVAL_SEMANTICS: "closed-left, open-right [effective_start, effective_end)"
    precision: "second-granularity timestamps"
    variants:
      - name: closed_open
        when: "all PA checks on Claim ADJUDICATE"
        difference: "Differs from refill_too_soon_check, which is a day-granularity overlap. Here we check point-in-interval, NOT interval-vs-interval."

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers are present"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"

  - priority: 2
    category: auth
    check: "X-User-Role is permitted for this endpoint per §1.7 RBAC"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: existence
    check: "All path/body resource references resolve (left-to-right): Member.id, Plan.id, Drug.id, FormularyEntry.id, PriorAuthorization.id, Claim.id, CopayCard.id, RebateAgreement.id"
    error_id: ERR_RESOURCE_NOT_FOUND
    http_status: 404
    applies_to: "all"

  - priority: 4
    category: state
    check: "Target resource is in a state legal for the requested transition (e.g., PA must be SUBMITTED for /approve; Claim must be SUBMITTED for /adjudicate; Claim must be PAID for /reverse)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints"

  - priority: 5
    category: state
    check: "Member.enrollment_status == ACTIVE (cross-entity precondition for Claim adjudicate and PA approve)"
    error_id: ERR_MEMBER_NOT_ACTIVE
    http_status: 409
    applies_to: ["POST /pbm/claims/{id}/adjudicate", "POST /pbm/prior-authorizations/{id}/approve"]

  - priority: 6
    category: business_safety
    check: "If Drug.is_specialty: Claim.channel == SPECIALTY"
    error_id: ERR_SPECIALTY_CHANNEL_REQUIRED
    http_status: 422
    applies_to: ["POST /pbm/claims/{id}/adjudicate"]

  - priority: 7
    category: business_safety
    check: "If Drug.requires_prior_auth: a valid APPROVED PA for (member, drug) is referenced and clock_now() is within [effective_start, effective_end)"
    error_id: ERR_PA_REQUIRED
    http_status: 422
    applies_to: ["POST /pbm/claims/{id}/adjudicate"]

  - priority: 8
    category: business_safety
    check: "If Drug.step_therapy_predecessor_ndc IS NOT NULL AND no APPROVED PA: member has at least one PAID Claim for the predecessor drug within the current benefit year"
    error_id: ERR_STEP_THERAPY_NOT_SATISFIED
    http_status: 422
    applies_to: ["POST /pbm/claims/{id}/adjudicate"]

  - priority: 9
    category: business_temporal
    check: "Refill-too-soon: candidate Claim's projected supply window does not overlap any existing Claim for same (member_id, drug_id) in status {ADJUDICATED, PAID} per calc refill_too_soon_check"
    error_id: ERR_REFILL_TOO_SOON
    http_status: 409
    applies_to: ["POST /pbm/claims/{id}/adjudicate"]

  - priority: 10
    category: business_constraint
    check: "Channel/days_supply match: RETAIL_30 -> 1..34; MAIL_ORDER_90 -> 60..100; SPECIALTY -> 1..30; quantity >= 1"
    error_id: ERR_CHANNEL_DAYS_SUPPLY_MISMATCH
    http_status: 422
    applies_to: ["POST /pbm/claims", "POST /pbm/claims/{id}/adjudicate"]

  - priority: 11
    category: business_referential
    check: "FormularyEntry exists for (Claim.plan_id-derived-from-Member.plan_id, Claim.drug_id) with status==ACTIVE"
    error_id: ERR_DRUG_NOT_ON_FORMULARY
    http_status: 422
    applies_to: ["POST /pbm/claims/{id}/adjudicate"]

  - priority: 12
    category: business_referential
    check: "If Claim.copay_card_id IS NOT NULL: card.member_id == Claim.member_id AND card.drug_id == Claim.drug_id AND card.status == ACTIVE"
    error_id: ERR_COPAY_CARD_MISMATCH
    http_status: 422
    applies_to: ["POST /pbm/claims/{id}/adjudicate"]

  - priority: 13
    category: business_constraint
    check: "PA revision_count < 3 on resubmit"
    error_id: ERR_PA_REVISION_LIMIT
    http_status: 422
    applies_to: ["POST /pbm/prior-authorizations/{id}/resubmit"]

  - priority: 14
    category: business_constraint
    check: "Clawback window not elapsed: REVERSE requires clock_now() < accrual.posted_at + agreement.clawback_window_days days (only if an accrual exists)"
    error_id: ERR_CLAWBACK_WINDOW_EXPIRED
    http_status: 422
    applies_to: ["POST /pbm/claims/{id}/reverse"]

  - priority: 15
    category: business_fiscal
    check: "Plan.oop_max_cents >= Plan.deductible_cents on Plan create/update"
    error_id: ERR_OOP_BELOW_DEDUCTIBLE
    http_status: 422
    applies_to: ["POST /pbm/plans", "PATCH /pbm/plans/{id}"]

  - priority: 16
    category: business_constraint
    check: "FormularyEntry.tier in 1..5 and rates 0<=x<=1 on Plan/FormularyEntry create/update"
    error_id: ERR_VALIDATION
    http_status: 422
    applies_to: ["POST /pbm/plans", "PATCH /pbm/plans/{id}", "POST /pbm/formulary-entries", "PATCH /pbm/formulary-entries/{id}"]

  - priority: 17
    category: business_constraint
    check: "Pagination: 1 <= limit <= 100 and offset >= 0; version (if supplied) must equal current entity version"
    error_id: ERR_VERSION_CONFLICT
    http_status: 409
    applies_to: ["all PATCH endpoints, all list endpoints"]

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---------- Plan ----------
  - method: POST
    path: "/pbm/plans"
    description: "Create a benefit plan"
    roles: [PBMAdmin]
    code: 201
    input: ["name", "deductible_cents", "oop_max_cents", "coinsurance_rate", "mail_order_discount_rate?"]
    output: Plan
    side_effects: []
  - method: GET
    path: "/pbm/plans"
    description: "List plans (paginated)"
    roles: [PBMAdmin, ClinicalReviewer, ClaimsAdjudicator, Prescriber]
    code: 200
    input: ["limit?", "offset?", "status?"]
    output: Plan[]
    side_effects: []
  - method: GET
    path: "/pbm/plans/{id}"
    description: "Read a plan"
    roles: [PBMAdmin, ClinicalReviewer, ClaimsAdjudicator, Prescriber]
    code: 200
    input: []
    output: Plan
    side_effects: []
  - method: PATCH
    path: "/pbm/plans/{id}"
    description: "Update plan terms (deductible, oop_max, coinsurance, mail-order discount)"
    roles: [PBMAdmin]
    code: 200
    input: ["deductible_cents?", "oop_max_cents?", "coinsurance_rate?", "mail_order_discount_rate?", "version"]
    output: Plan
    side_effects: []

  # ---------- Drug ----------
  - method: POST
    path: "/pbm/drugs"
    description: "Create a drug entry"
    roles: [PBMAdmin]
    code: 201
    input: ["ndc", "generic_name", "brand_name", "is_specialty?", "requires_prior_auth?", "step_therapy_predecessor_ndc?", "unit_allowed_cents"]
    output: Drug
    side_effects: []
  - method: GET
    path: "/pbm/drugs"
    description: "List drugs (paginated, filter by ndc, is_specialty, status)"
    roles: [PBMAdmin, ClinicalReviewer, ClaimsAdjudicator, Prescriber]
    code: 200
    input: ["limit?", "offset?", "ndc?", "is_specialty?", "status?"]
    output: Drug[]
    side_effects: []
  - method: GET
    path: "/pbm/drugs/{id}"
    description: "Read a drug"
    roles: [PBMAdmin, ClinicalReviewer, ClaimsAdjudicator, Prescriber]
    code: 200
    input: []
    output: Drug
    side_effects: []

  # ---------- Member ----------
  - method: POST
    path: "/pbm/members"
    description: "Enroll a member"
    roles: [PBMAdmin]
    code: 201
    input: ["plan_id", "full_name", "date_of_birth"]
    output: Member
    side_effects: []
  - method: GET
    path: "/pbm/members"
    description: "List members (paginated)"
    roles: [PBMAdmin, ClinicalReviewer, ClaimsAdjudicator]
    code: 200
    input: ["limit?", "offset?", "plan_id?", "enrollment_status?"]
    output: Member[]
    side_effects: []
  - method: GET
    path: "/pbm/members/{id}"
    description: "Read a member (includes YTD counters)"
    roles: [PBMAdmin, ClinicalReviewer, ClaimsAdjudicator]
    code: 200
    input: []
    output: Member
    side_effects: []
  - method: POST
    path: "/pbm/members/{id}/suspend"
    description: "Suspend a member (enrollment_status -> SUSPENDED)"
    roles: [PBMAdmin]
    code: 200
    input: ["version"]
    output: Member
    side_effects: []

  # ---------- FormularyEntry ----------
  - method: POST
    path: "/pbm/formulary-entries"
    description: "Add a drug to a plan's formulary with tier + copay"
    roles: [PBMAdmin]
    code: 201
    input: ["plan_id", "drug_id", "tier", "copay_cents"]
    output: FormularyEntry
    side_effects: []
  - method: GET
    path: "/pbm/formulary-entries"
    description: "List formulary entries (filter by plan_id, drug_id, tier, status)"
    roles: [PBMAdmin, ClinicalReviewer, ClaimsAdjudicator, Prescriber]
    code: 200
    input: ["limit?", "offset?", "plan_id?", "drug_id?", "tier?", "status?"]
    output: FormularyEntry[]
    side_effects: []
  - method: PATCH
    path: "/pbm/formulary-entries/{id}"
    description: "Update tier or copay for a formulary entry"
    roles: [PBMAdmin]
    code: 200
    input: ["tier?", "copay_cents?", "version"]
    output: FormularyEntry
    side_effects: []

  # ---------- PriorAuthorization ----------
  - method: POST
    path: "/pbm/prior-authorizations"
    description: "Create a PA in DRAFT"
    roles: [Prescriber]
    code: 201
    input: ["member_id", "drug_id", "prescriber_npi", "clinical_rationale"]
    output: PriorAuthorization
    side_effects: ["status = DRAFT"]
  - method: GET
    path: "/pbm/prior-authorizations"
    description: "List PAs (filter by member_id, drug_id, status)"
    roles: [PBMAdmin, ClinicalReviewer, ClaimsAdjudicator, Prescriber]
    code: 200
    input: ["limit?", "offset?", "member_id?", "drug_id?", "status?"]
    output: PriorAuthorization[]
    side_effects: []
  - method: GET
    path: "/pbm/prior-authorizations/{id}"
    description: "Read a PA"
    roles: [PBMAdmin, ClinicalReviewer, ClaimsAdjudicator, Prescriber]
    code: 200
    input: []
    output: PriorAuthorization
    side_effects: []
  - method: POST
    path: "/pbm/prior-authorizations/{id}/submit"
    description: "Prescriber submits a DRAFT PA"
    roles: [Prescriber]
    code: 200
    input: ["version"]
    output: PriorAuthorization
    side_effects: ["status DRAFT->SUBMITTED"]
  - method: POST
    path: "/pbm/prior-authorizations/{id}/approve"
    description: "Reviewer approves a SUBMITTED PA"
    roles: [ClinicalReviewer]
    code: 200
    input: ["version"]
    output: PriorAuthorization
    side_effects: ["status SUBMITTED->APPROVED", "effective_start=now, effective_end=now+180d"]
  - method: POST
    path: "/pbm/prior-authorizations/{id}/deny"
    description: "Reviewer denies a SUBMITTED PA"
    roles: [ClinicalReviewer]
    code: 200
    input: ["denial_reason", "version"]
    output: PriorAuthorization
    side_effects: ["status SUBMITTED->DENIED"]
  - method: POST
    path: "/pbm/prior-authorizations/{id}/request-info"
    description: "Reviewer asks the prescriber for more info; PA goes to INFO_REQUESTED"
    roles: [ClinicalReviewer]
    code: 200
    input: ["version"]
    output: PriorAuthorization
    side_effects: ["status SUBMITTED->INFO_REQUESTED"]
  - method: POST
    path: "/pbm/prior-authorizations/{id}/resubmit"
    description: "Prescriber resubmits after INFO_REQUESTED"
    roles: [Prescriber]
    code: 200
    input: ["clinical_rationale", "version"]
    output: PriorAuthorization
    side_effects: ["status INFO_REQUESTED->SUBMITTED; revision_count += 1"]
  - method: POST
    path: "/pbm/prior-authorizations/{id}/revoke"
    description: "Reviewer revokes an APPROVED PA"
    roles: [ClinicalReviewer]
    code: 200
    input: ["version"]
    output: PriorAuthorization
    side_effects: ["status APPROVED->REVOKED"]

  # ---------- Claim ----------
  - method: POST
    path: "/pbm/claims"
    description: "Submit a claim. Computes estimated_member_cost. Defaults status to SUBMITTED."
    roles: [Prescriber, ClaimsAdjudicator]
    code: 201
    input: ["member_id", "drug_id", "channel", "days_supply", "quantity", "prior_auth_id?", "copay_card_id?"]
    output: Claim
    side_effects: ["compute estimated_member_cost_cents"]
  - method: GET
    path: "/pbm/claims"
    description: "List claims (filter by member_id, drug_id, status, channel)"
    roles: [PBMAdmin, ClinicalReviewer, ClaimsAdjudicator, Prescriber]
    code: 200
    input: ["limit?", "offset?", "member_id?", "drug_id?", "status?", "channel?"]
    output: Claim[]
    side_effects: []
  - method: GET
    path: "/pbm/claims/{id}"
    description: "Read a claim"
    roles: [PBMAdmin, ClinicalReviewer, ClaimsAdjudicator, Prescriber]
    code: 200
    input: []
    output: Claim
    side_effects: []
  - method: POST
    path: "/pbm/claims/{id}/adjudicate"
    description: "Adjudicate a SUBMITTED claim. Runs adjudicated_member_cost. May REJECT if preconditions fail."
    roles: [ClaimsAdjudicator]
    code: 200
    input: ["version"]
    output: Claim
    side_effects: ["compute adjudicated_*_cents", "increment Member.ytd_deductible_paid_cents", "increment Member.ytd_oop_paid_cents", "CopayCard.used_cents += copay_card_paid_cents", "CopayCard.status ACTIVE->EXHAUSTED if cap reached"]
  - method: POST
    path: "/pbm/claims/{id}/pay"
    description: "Move an ADJUDICATED claim to PAID; posts rebate_accrual ledger entry if applicable."
    roles: [ClaimsAdjudicator]
    code: 200
    input: ["version"]
    output: Claim
    side_effects: ["payment_status UNPAID->PAID", "post LedgerEntry(REBATE_ACCRUED) when RebateAgreement exists"]
  - method: POST
    path: "/pbm/claims/{id}/reverse"
    description: "Reverse a PAID claim. Refunds Member YTD, refunds CopayCard, posts REBATE_CLAWBACK ledger entry if within window."
    roles: [ClaimsAdjudicator]
    code: 200
    input: ["version"]
    output: Claim
    side_effects: ["status PAID->REVERSED", "payment_status PAID->REFUNDED", "decrement Member.ytd_*", "CopayCard.used_cents -= ...", "post LedgerEntry(REBATE_CLAWBACK)"]

  # ---------- CopayCard ----------
  - method: POST
    path: "/pbm/copay-cards"
    description: "Issue a copay card for a member+drug"
    roles: [PBMAdmin]
    code: 201
    input: ["member_id", "drug_id", "max_benefit_cents", "per_claim_cap_cents"]
    output: CopayCard
    side_effects: []
  - method: GET
    path: "/pbm/copay-cards/{id}"
    description: "Read a copay card"
    roles: [PBMAdmin, ClaimsAdjudicator]
    code: 200
    input: []
    output: CopayCard
    side_effects: []
  - method: POST
    path: "/pbm/copay-cards/{id}/terminate"
    description: "Terminate a copay card"
    roles: [PBMAdmin]
    code: 200
    input: ["version"]
    output: CopayCard
    side_effects: ["status ACTIVE|EXHAUSTED -> TERMINATED"]

  # ---------- RebateAgreement ----------
  - method: POST
    path: "/pbm/rebate-agreements"
    description: "Create a manufacturer rebate agreement for a drug"
    roles: [PBMAdmin]
    code: 201
    input: ["drug_id", "manufacturer_name", "rebate_rate", "clawback_window_days?"]
    output: RebateAgreement
    side_effects: []
  - method: GET
    path: "/pbm/rebate-agreements"
    description: "List rebate agreements (filter by drug_id, status)"
    roles: [PBMAdmin]
    code: 200
    input: ["limit?", "offset?", "drug_id?", "status?"]
    output: RebateAgreement[]
    side_effects: []

  # ---------- LedgerEntry (read-only) ----------
  - method: GET
    path: "/pbm/ledger-entries"
    description: "List ledger entries (filter by claim_id, rebate_agreement_id, entry_type)"
    roles: [PBMAdmin]
    code: 200
    input: ["limit?", "offset?", "claim_id?", "rebate_agreement_id?", "entry_type?"]
    output: LedgerEntry[]
    side_effects: []

  # ---------- Test-driving endpoints (testability completeness) ----------
  - method: POST
    path: "/_clock/advance"
    description: "Advance the simulated clock by N seconds. Triggers auto-transitions: PA APPROVED->EXPIRED when clock_now() >= PA.effective_end; Member.benefit_year_start rollover when crossing year boundary (resets ytd_*_paid_cents)."
    roles: [PBMAdmin]
    code: 200
    input: ["seconds"]
    output: object
    side_effects: ["auto: PA APPROVED->EXPIRED", "auto: Member.ytd_* reset on benefit-year rollover"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "Missing or empty X-User-ID or X-User-Role header"
  - id: ERR_FORBIDDEN
    http: 403
    condition: "Role not authorized for this endpoint"
  - id: ERR_RESOURCE_NOT_FOUND
    http: 404
    condition: "Referenced resource id does not exist (404 wins over state and business)"
  - id: ERR_INVALID_STATE
    http: 409
    condition: "Target resource not in a state legal for this operation"
  - id: ERR_VERSION_CONFLICT
    http: 409
    condition: "Supplied version != current entity version (OCC)"
  - id: ERR_MEMBER_NOT_ACTIVE
    http: 409
    condition: "Member.enrollment_status != ACTIVE on adjudicate/approve"
  - id: ERR_PA_REQUIRED
    http: 422
    condition: "Drug requires PA but no valid APPROVED PA in effective window for (member, drug)"
  - id: ERR_PA_DENIED
    http: 422
    condition: "Referenced PA is in DENIED state at adjudicate time"
  - id: ERR_PA_REVOKED
    http: 422
    condition: "Referenced PA is in REVOKED state at adjudicate time"
  - id: ERR_PA_EXPIRED
    http: 422
    condition: "Referenced PA is in EXPIRED state OR clock_now() outside [effective_start, effective_end) at adjudicate time"
  - id: ERR_PA_MISMATCH
    http: 422
    condition: "Referenced PA member_id or drug_id does not match the claim"
  - id: ERR_PA_REVISION_LIMIT
    http: 422
    condition: "PA resubmit attempted when revision_count would reach 3 (only 0,1,2 are legal source values)"
  - id: ERR_STEP_THERAPY_NOT_SATISFIED
    http: 422
    condition: "Drug.step_therapy_predecessor_ndc is set, no APPROVED PA, and member has no PAID claim for the predecessor drug in the current benefit year"
  - id: ERR_SPECIALTY_CHANNEL_REQUIRED
    http: 422
    condition: "Drug.is_specialty == true but Claim.channel != SPECIALTY"
  - id: ERR_CHANNEL_DAYS_SUPPLY_MISMATCH
    http: 422
    condition: "days_supply outside the band for the chosen channel, or quantity < 1"
  - id: ERR_REFILL_TOO_SOON
    http: 409
    condition: "Candidate claim's projected supply window overlaps another ADJUDICATED/PAID claim for the same (member_id, drug_id) per half-open interval semantics"
  - id: ERR_DRUG_NOT_ON_FORMULARY
    http: 422
    condition: "No ACTIVE FormularyEntry for (Member.plan_id, Claim.drug_id)"
  - id: ERR_COPAY_CARD_MISMATCH
    http: 422
    condition: "Copay card present but member_id/drug_id do not match, or card not ACTIVE"
  - id: ERR_COPAY_CARD_EXHAUSTED
    http: 409
    condition: "Concurrent race observed CopayCard.status == EXHAUSTED at adjudicate time and card contributes 0"
  - id: ERR_CLAWBACK_WINDOW_EXPIRED
    http: 422
    condition: "REVERSE attempted after accrual.posted_at + clawback_window_days"
  - id: ERR_OOP_BELOW_DEDUCTIBLE
    http: 422
    condition: "Plan.oop_max_cents < Plan.deductible_cents on create/update"
  - id: ERR_VALIDATION
    http: 422
    condition: "Generic field validation failure (tier out of 1..5, rate out of [0,1], invalid NDC format, etc.)"

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: PBMAdmin
    description: "PBM operational administrator. Manages plans, drugs, members, formulary entries, copay cards, rebate agreements. Cannot clinically review PAs nor adjudicate claims (segregation of duties)."
    identity: "opaque"
    exclusive_operations:
      - "POST /pbm/plans"
      - "PATCH /pbm/plans/{id}"
      - "POST /pbm/drugs"
      - "POST /pbm/members"
      - "POST /pbm/members/{id}/suspend"
      - "POST /pbm/formulary-entries"
      - "PATCH /pbm/formulary-entries/{id}"
      - "POST /pbm/copay-cards"
      - "POST /pbm/copay-cards/{id}/terminate"
      - "POST /pbm/rebate-agreements"
      - "GET /pbm/rebate-agreements"
      - "GET /pbm/ledger-entries"
      - "POST /_clock/advance"
    shared_operations:
      - "GET /pbm/plans"
      - "GET /pbm/plans/{id}"
      - "GET /pbm/drugs"
      - "GET /pbm/drugs/{id}"
      - "GET /pbm/members"
      - "GET /pbm/members/{id}"
      - "GET /pbm/formulary-entries"
      - "GET /pbm/prior-authorizations"
      - "GET /pbm/prior-authorizations/{id}"
      - "GET /pbm/claims"
      - "GET /pbm/claims/{id}"
      - "GET /pbm/copay-cards/{id}"
  - name: Prescriber
    description: "Healthcare prescriber. Creates and submits PAs and submits claims. Cannot approve their own PAs nor adjudicate claims (segregation of duties)."
    identity: "opaque"
    exclusive_operations:
      - "POST /pbm/prior-authorizations"
      - "POST /pbm/prior-authorizations/{id}/submit"
      - "POST /pbm/prior-authorizations/{id}/resubmit"
    shared_operations:
      - "POST /pbm/claims"
      - "GET /pbm/plans"
      - "GET /pbm/plans/{id}"
      - "GET /pbm/drugs"
      - "GET /pbm/drugs/{id}"
      - "GET /pbm/formulary-entries"
      - "GET /pbm/prior-authorizations"
      - "GET /pbm/prior-authorizations/{id}"
      - "GET /pbm/claims"
      - "GET /pbm/claims/{id}"
  - name: ClinicalReviewer
    description: "Reviews PAs clinically. Approves, denies, requests info, or revokes PAs. Cannot create or submit PAs (must remain independent of the prescriber) and cannot adjudicate claims (segregation of duties)."
    identity: "opaque"
    exclusive_operations:
      - "POST /pbm/prior-authorizations/{id}/approve"
      - "POST /pbm/prior-authorizations/{id}/deny"
      - "POST /pbm/prior-authorizations/{id}/request-info"
      - "POST /pbm/prior-authorizations/{id}/revoke"
    shared_operations:
      - "GET /pbm/plans"
      - "GET /pbm/plans/{id}"
      - "GET /pbm/drugs"
      - "GET /pbm/drugs/{id}"
      - "GET /pbm/members"
      - "GET /pbm/members/{id}"
      - "GET /pbm/formulary-entries"
      - "GET /pbm/prior-authorizations"
      - "GET /pbm/prior-authorizations/{id}"
      - "GET /pbm/claims"
      - "GET /pbm/claims/{id}"
  - name: ClaimsAdjudicator
    description: "Adjudicates and pays/reverses claims. Cannot review PAs and cannot create members/plans/drugs (segregation of duties)."
    identity: "opaque"
    exclusive_operations:
      - "POST /pbm/claims/{id}/adjudicate"
      - "POST /pbm/claims/{id}/pay"
      - "POST /pbm/claims/{id}/reverse"
    shared_operations:
      - "POST /pbm/claims"
      - "GET /pbm/plans"
      - "GET /pbm/plans/{id}"
      - "GET /pbm/drugs"
      - "GET /pbm/drugs/{id}"
      - "GET /pbm/members"
      - "GET /pbm/members/{id}"
      - "GET /pbm/formulary-entries"
      - "GET /pbm/prior-authorizations"
      - "GET /pbm/prior-authorizations/{id}"
      - "GET /pbm/claims"
      - "GET /pbm/claims/{id}"
      - "GET /pbm/copay-cards/{id}"
