          assert:
            - "response status == 409"
            - "data.error_id == ERR_CHAMBER_HAS_EQUIPMENT"
            - "DryingChamber.${ch1}.status == OPEN"

      - name: reopen_mitigation_when_all_dry_returns_nothing_to_reopen
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.LossJob.MONITORING_to_MITIGATION
          - errors[ERR_NOTHING_TO_REOPEN]
        distinguishing_aspect: "reopen-mitigation on a MONITORING job whose only chamber is already DRIED fails ERR_NOTHING_TO_REOPEN (409)."
        test_recipe:
          setup: ["A WATER job in MONITORING with chamber R1 DRIED (is_dry true)."]
          setup_api_calls:
            - call: "POST /restoration/claims"
              payload: { carrier_name: "Acme", policy_number: "PC10", peril: "WATER", coverage_limit_cents: 9000000 }
              as: Adjuster
              as_user_id: "adj-1"
              captures: { claim_id: $.data.id }
            - call: "POST /restoration/technicians"
              payload: { full_name: "T", certification: "ASD" }
              as: PlatformAdmin
              captures: { tech_id: $.data.id }
            - call: "POST /restoration/equipment-units"
              payload: { asset_tag: "AM-C10", kind: "AIR_MOVER" }
              as: PlatformAdmin
              captures: { am: $.data.id }
            - call: "POST /restoration/equipment-units"
              payload: { asset_tag: "DH-C10", kind: "DEHUMIDIFIER" }
              as: PlatformAdmin
              captures: { dh: $.data.id }
            - call: "POST /restoration/jobs"
              payload: { claim_id: "${claim_id}", property_address: "X", loss_type: "WATER", water_category: 1, water_class: 1 }
              as: Dispatcher
