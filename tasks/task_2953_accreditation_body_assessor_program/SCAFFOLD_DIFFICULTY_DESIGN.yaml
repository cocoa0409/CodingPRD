            - "hop 1 - Assessor.${lead_id}.impartiality_status is still SCREENED, because the two dimensions are independent"
            - "hop 2 - TeamAssignment.${ta_lead_id}.status == RECUSED and recusal_reason == 'assessor suspended'"
            - "hop 3 - AccreditationApplication.${app_id}.status == SUBMITTED"
            - "ApplicantOrganization.${org_id}.status == UNDER_ASSESSMENT - hop 3 does not roll the organization back to APPLIED"
            - "Assessor.${lead_id}.granted_qualification_count == 1 and AssessorQualification.${lead_q_id}.status == GRANTED - suspension does not revoke qualifications"
