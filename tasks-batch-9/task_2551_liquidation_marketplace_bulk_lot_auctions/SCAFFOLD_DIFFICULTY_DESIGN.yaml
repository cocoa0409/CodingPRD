              as_user_id: "admin-1"
              captures: { s1: "$.data.id" }
            - call: "POST /liquidation/warehouses"
              payload: { name: "Columbus DC", state_code: "OH", dock_door_count: 2, turnaround_buffer_minutes: 15 }
              as: PlatformAdmin
              as_user_id: "admin-1"
