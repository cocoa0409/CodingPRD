          - entities.DealerAgreement.fields.certified_technician_count
          - entities.Dealer.fields.trusted_commitment_count
          - endpoints.GET_/dealer-network/dealer-agreements/{id}
        distinguishing_aspect: "The agreement's denormalized fields stay consistent with their source rows: certified_technician_count reads 1 then 2 as credentials arrive, tooling_compliance_status reads PARTIAL then COMPLIANT, and version advances by exactly one per mutating call."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. One dealer T-410 with a DRAFT agreement and no credentials."
          setup_api_calls:
            - *n_clock
            - *n_dealer
            - *n_agree
            - *n_read_dealer
          trigger:
            - call: "POST /dealer-network/certification-records"
              payload: { dealer_id: "${d_id}", technician_name: "T-01", product_family: "EXCAVATION", credential_code: "DEALER_MASTER", certified_at: "2026-08-01T00:00:00Z" }
              as: PartsManager
            - call: "GET /dealer-network/dealer-agreements/${ag_id}"
              payload: {}
              as: DealerNetworkManager
            - call: "POST /dealer-network/certification-records"
              payload: { dealer_id: "${d_id}", technician_name: "T-02", product_family: "EXCAVATION", credential_code: "DEALER_MASTER", certified_at: "2026-08-01T00:00:00Z" }
              as: PartsManager
            - call: "GET /dealer-network/dealer-agreements/${ag_id}"
              payload: {}
              as: DealerNetworkManager
          assert:
            - "after the first credential the agreement reads certified_technician_count == 1 and tooling_compliance_status == PARTIAL"
            - "after the second credential the agreement reads certified_technician_count == 2 and tooling_compliance_status == COMPLIANT"
            - "Dealer.${d_id}.certified_family_count == 1 after both credentials"
            - "the agreement version after the last mutating call exceeds the version on the create response"

      - name: support_agreement_enrollment_recomputes_the_coverage_in_the_same_request
        claim_type: Immediate consistency
        grounds:
          - complexity_profile.consistency_model
          - calculations.coverage_multiplier
          - entities.MachinePopulationRecord.fields.coverage_multiplier
        distinguishing_aspect: "Consistency is immediate inside the request that enrolls a machine: the enrollment response itself already carries the raised coverage_multiplier 1.5, and the dealer forecast read in the same request's aftermath reports 60 rather than the bare 40, with no deferred reconciliation."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. The T-410 commitment is SUBMITTED with one bare 50000 lb EXCAVATION machine and no coverage."
          setup_api_calls:
            - *n_clock
            - *n_dealer
            - *n_agree
            - *n_cert1
            - *n_cert2
            - *n_read_dealer
            - *n_commit
            - call: "POST /dealer-network/machine-population-records"
              payload: { dealer_id: "${d_id}", product_family: "EXCAVATION", machine_serial: "SN-3401", machine_operating_weight_lb: 50000, meter_hours: 1000 }
              as: PartsManager
              captures: { pop_bare: $.data.id }
            - call: "POST /dealer-network/parts-commitments/${cm_id}/submit"
              payload: {}
              as: PartsManager
          trigger:
            - call: "POST /dealer-network/support-agreements"
              payload: { dealer_id: "${d_id}", machine_serial: "SN-3401", plan_tier: "PREMIUM", enrolled_at: "2026-08-15T00:00:00Z" }
              as: PartsManager
              captures: { sup_id: $.data.id }
          assert:
            - "the enrollment response reports SupportAgreement.${sup_id}.coverage_multiplier == 1.5"
            - "GET /dealer-network/machine-population-records/${pop_bare} reports coverage_multiplier == 1.5"
            - "GET /dealer-network/machine-population-records/forecast?dealer_id=${d_id} reports forecast_parts_demand_units == 60"
            - "the same forecast read reports forecast_parts_demand_units != 40, the value the bare-rate arithmetic would give"
