        grounds:
          - "errors[ERR_SANITATION_FAILED]"
          - "validations[priority=5]"
        distinguishing_aspect: "Harvest with a SanitationLog whose wash_water_ppm is outside [50,200] fails with ERR_SANITATION_FAILED."
