              as_user_id: "${owner_id}"
              captures: { ua_id: $.data.id, ua_baseline: $.data.baseline_allowance_cents, ua_proposed: $.data.proposed_allowance_cents }
            - call: "POST /pbra/utility-allowance-analyses/${ua_id}/submit"
              payload: {}
              as: OwnerAgent
              as_user_id: "${owner_id}"
            - call: "POST /pbra/utility-allowance-analyses/${ua_id}/decide"
              payload: { decision: "APPROVE" }
              as: ContractAdministrator
              as_user_id: "ca-reviewer-1"
            - call: "GET /pbra/properties/${property_id}"
              payload: {}
              as: ContractAdministrator
              as_user_id: "ca-reviewer-1"
              captures: { pv_now: $.data.version, ua_before: $.data.current_utility_allowance_cents }
          trigger:
            - call: "POST /pbra/utility-allowance-analyses/${ua_id}/apply"
              payload: { expected_property_version: "${pv_now}" }
              as: ContractAdministrator
              as_user_id: "ca-reviewer-1"
              captures: { apply_state: $.data.state, apply_date: $.data.applied_on_date, apply_count: $.data.recertified_tenant_count }
            - call: "GET /pbra/properties/${property_id}"
              payload: {}
              as: ContractAdministrator
              as_user_id: "ca-reviewer-1"
              captures: { ua_after: $.data.current_utility_allowance_cents }
            - call: "GET /pbra/tenant-households/${t1_id}/certifications"
              payload: { cert_type: "UA_ADJUSTMENT" }
              as: OwnerAgent
              as_user_id: "${owner_id}"
              captures: { adj_id: "$.data[0].id", adj_ua: "$.data[0].utility_allowance_cents", adj_ttp: "$.data[0].ttp_cents", adj_rent: "$.data[0].tenant_rent_cents", adj_hap: "$.data[0].hap_cents", adj_effective: "$.data[0].effective_date", adj_status: "$.data[0].status" }
            - call: "GET /pbra/tenant-certifications/${cert1_id}"
              payload: {}
              as: OwnerAgent
              as_user_id: "${owner_id}"
              captures: { cert1_status_after: $.data.status }
            - call: "GET /pbra/hap-contracts/${contract_id}"
              payload: {}
              as: OwnerAgent
              as_user_id: "${owner_id}"
              captures: { cv_now: $.data.version }
            - call: "POST /pbra/voucher-submissions"
              payload: { contract_id: "${contract_id}", period_month: "2026-09", expected_contract_version: "${cv_now}" }
              as: OwnerAgent
              as_user_id: "${owner_id}"
              captures: { v_requested: $.data.requested_hap_cents, v_included: $.data.included_certification_count }
          assert:
            - "${cert1_ua} == 11500 and ${cert1_hap} == 84500 before the apply; ${ua_baseline} == 11500, ${ua_proposed} == 12535 and ${ua_before} == 11500"
            - "${apply_state} == APPLIED, ${apply_date} == 2026-08-01 (the clock date) and ${apply_count} == 1 — the cascade result is in the apply response itself"
            - "${ua_after} == 12535 on the very next read, with no retry"
            - "The UA_ADJUSTMENT listing envelope reports total_count 1, with ${adj_effective} == 2026-09-01 and ${adj_status} == ACTIVE"
            - "${adj_ua} == 12535, ${adj_ttp} == 45000, ${adj_rent} == 32465 (45000 - 12535) and ${adj_hap} == 85535 (118000 + 12535 - 45000)"
            - "${cert1_status_after} == SUPERSEDED — the predecessor is already demoted in the same window"
            - "${v_requested} == 85535 and ${v_included} == 1 — a voucher created immediately afterwards for 2026-09 already uses the recomputed certification"
