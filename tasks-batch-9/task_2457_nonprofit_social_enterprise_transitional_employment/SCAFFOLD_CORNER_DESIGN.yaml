              as: IntakeSpecialist
          trigger:
            - call: "POST /business-lines"
              payload: { name: "Cafe & Catering", market_viability_score: 90, training_relevance_score: 80, mission_alignment_score: 75, training_slots_total: 3, supervisor_capacity: 2, target_gross_margin_pct: 0.2000, subsidy_cap_cents: 5000000 }
              as: ProgramDirector
              captures: { bl_id: $.data.id, v_create: $.data.version }
            - call: "POST /business-lines/${bl_id}/review"
              payload: { decision: "APPROVED" }
              as: ProgramDirector
              captures: { v_review: $.data.version }
            - call: "POST /business-lines/${bl_id}/launch"
              payload: {}
              as: ProgramDirector
              captures: { v_launch: $.data.version }
            - call: "POST /participants"
              payload: { referral_id: "${ref1_id}", business_line_id: "${bl_id}", wage_cents_per_hour: 1650, expected_business_line_version: "${v_launch}" }
              as: IntakeSpecialist
              captures: { p1_id: $.data.id }
            - call: "GET /business-lines/${bl_id}"
              payload: {}
              as: ProgramDirector
              captures: { v_after_p1: $.data.version }
            - call: "POST /participants"
              payload: { referral_id: "${ref2_id}", business_line_id: "${bl_id}", wage_cents_per_hour: 1650, expected_business_line_version: "${v_after_p1}" }
              as: IntakeSpecialist
              captures: { p2_id: $.data.id }
            - call: "GET /business-lines/${bl_id}"
              payload: {}
              as: ProgramDirector
              captures: { v_after_p2: $.data.version }
          assert:
            - "the version series is 1 (create), 2 (review), 3 (launch), 4 (after p1) and 5 (after p2) -- one increment per accepted write, no gaps and no double bumps"
            - "each enrollment supplies the version observed immediately before it and is accepted"
            - "GET /business-lines/${bl_id} reports training_slots_filled == 2 alongside version 5, so the counter and the derived field move together in one transaction"
            - "a third enrollment replaying ${v_launch} would return 412 ERR_STALE_BUSINESS_LINE_VERSION even though a free slot remains"

