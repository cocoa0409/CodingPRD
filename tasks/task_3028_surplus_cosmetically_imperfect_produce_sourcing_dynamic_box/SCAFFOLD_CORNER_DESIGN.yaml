- section: cross_cutting_layers
  instances:
  - name: stale_subscription_skip_is_refused
    claim_type: optimistic_concurrency
    grounds:
    - concurrency_rules[subscription-skip-stale-version]
    - errors.ERR_STALE_VERSION
    - validations[priority=5]
    - endpoints.POST_/produce/subscriptions/{id}/skip
    distinguishing_aspect: A skip carrying the version the client read before a pause advanced it is refused with 412 ERR_STALE_VERSION rather than re-planning the cycle a second time.
    test_recipe:
      setup: One center, supplier, lot and customer with a WEEKLY subscription, paused once so the subscription's version has advanced since it was read.
      setup_api_calls:
      - call: POST /produce/fulfillment-centers
        payload:
          code: DEMO-NE
          name: Demo Center
          region: NE
          insulation_profile: LIGHT
          max_concurrent_building_cycles: 5
        as: PlatformAdmin
        captures:
          oc_c: $.data.id
      - call: POST /produce/suppliers
        payload:
          name: Supply Co OC
          region: NE
        as: PlatformAdmin
        captures:
          oc_s: $.data.id
      - call: POST /produce/suppliers/${oc_s}/lots
        payload:
          fulfillment_center_id: ${oc_c}
          product_name: OC1
          category: FRUIT
          procurement_grade: SURPLUS
          unit_weight_grams: 100
          quantity_available: 300
          unit_cost_cents: 100
          harvest_date: '2026-09-01T00:00:00Z'
          expiry_date: '2026-09-20T00:00:00Z'
          ready_date: '2026-09-05T00:00:00Z'
        as: PlatformAdmin
        captures:
          oc_l: $.data.id
          oc_lv: $.data.version
      - call: POST /produce/sourcing-bids
        payload:
          supply_lot_id: ${oc_l}
          supplier_id: ${oc_s}
          bid_unit_cost_cents: 100
          quantity_offered: 300
        as: Supplier
        as_user_id: ${oc_s}
      - call: POST /produce/supply-lots/${oc_l}/award
        payload:
          bidder_quota: 1
          expected_supply_lot_version: ${oc_lv}
        as: PlatformAdmin
        captures:
          oc_lv2: $.data.version
      - call: POST /produce/supply-lots/${oc_l}/make-ready
        payload:
          quality_outcome: PASS
          expected_supply_lot_version: ${oc_lv2}
        as: PlatformAdmin
      - call: POST /produce/customers/register
        payload:
          email: oc@example.com
          full_name: Sub Oc
          service_region: NE
        as: Anonymous
        captures:
          oc_cu: $.data.id
      - call: POST /produce/subscriptions
        payload:
          customer_id: ${oc_cu}
          cadence: WEEKLY
        as: PlatformAdmin
        captures:
          oc_sub: $.data.id
          oc_subv: $.data.version
      - call: POST /produce/subscriptions/${oc_sub}/pause
        payload: {}
        as: PlatformAdmin
      - call: POST /produce/subscriptions/${oc_sub}/resume
        payload: {}
        as: PlatformAdmin
      trigger:
      - call: POST /produce/subscriptions/${oc_sub}/skip
        payload:
          expected_subscription_version: ${oc_subv}
        as: PlatformAdmin
        captures:
          oc_err: $.data.error_id
      assert:
      - the skip returns 412 and oc_err == ERR_STALE_VERSION
      - Subscription.${oc_sub}.status == ACTIVE
      - Subscription.${oc_sub}.skipped_cycle_index is null
      - Subscription.${oc_sub}.pause_count == 1
  - name: stale_box_order_version_finalize_is_refused
    claim_type: optimistic_concurrency
    grounds:
    - concurrency_rules[box-order-finalize-stale-version]
    - errors.ERR_STALE_VERSION
    - validations[priority=5]
    distinguishing_aspect: The finalize guard rejects a version older than the one the client observed, so the same request succeeds with the current version and fails with the stale one.
    test_recipe:
      setup: One center, supplier, lot and customer with a WEEKLY subscription and one DRAFT order whose version is read once.
      setup_api_calls:
      - call: POST /produce/fulfillment-centers
        payload:
