            - "HOP 2 - RecordsRequest.${req_id}.status == \"LITIGATION_AUTHORIZED\""
            - "HOP 3 - Desk.${desk_id}.litigation_exposure_count == 1"
            - "HOP 3 - Desk.${desk_id}.security_posture == \"RESTRICTED\""
            - "HOP 3 - Desk.${desk_id}.open_request_count == 0 and Desk.${desk_id}.open_appeal_count == 0"
            - "HOP 4 - Investigation.${inv_id}.status == \"HOLD_LEGAL_REVIEW\" and hold_reason_code == \"LITIGATION_AUTHORIZED\""
            - "HOP 5 - EnclaveSession.${session_id}.status == \"CANCELLED\" and cancellation_reason_code == \"INVESTIGATION_LEGAL_HOLD\""
            - "HOP 5 - SecureEnclave.${enclave_id}.booked_session_count == 0"
            - "LEDGER - Desk.${desk_id}.fee_budget_spent_cents == 9750 (5250 settled at partial release plus the 4500 filing fee)"
            - "LEDGER - Desk.${desk_id}.fee_budget_committed_cents == 0 and fee_budget_available_cents == 490250"
            - "LEDGER - Desk.${desk_id}.fee_budget_total_cents == 500000 == available + committed + spent (no drift)"
            - "Dataset.${ds_id}.status == \"CLEAN_LOCKED\" (the cascade does not touch dataset state) and AnalysisRun.${run_id}.code_review_status == \"PENDING_REVIEW\""

      - name: dataset_quarantine_three_hop_analysis_invalidation
        grounds:
          - state_machines.Dataset.CLEAN_LOCKED_to_QUARANTINED
          - state_machines.AnalysisRun.code_review_APPROVED_to_CHANGES_REQUESTED
          - state_machines.AnalysisRun.cost_allocation_ALLOCATED_to_NOT_ALLOCATED
