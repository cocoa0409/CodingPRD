            - call: "POST /buildings/${b_id}/floors"
              payload: { floor_number: 2, floor_to_floor_ft: 14.0, live_load_psf: 95, vibration_class: "VC_C", sprinklered: true }
              as: BaseBuildingEngineer
              captures: { f2_id: "$.data.id" }
            - call: "POST /buildings/${b_id}/suitability-assessments"
              payload: { assessment_basis: "SCREENING", required_vibration_class: "VC_C", required_exhaust_cfm: 50000, required_power_kw: 700, measured_live_load_psf: 88 }
              as: BaseBuildingEngineer
              captures: { a1_id: "$.data.id", a1_status: "$.data.status" }
          trigger:
            - call: "POST /suitability-assessments/${a1_id}/submit"
