  # ===========================================================================
  - section: validations
    instances:
      - name: household_get_missing_headers_unauthenticated
        claim_type: violation_to_error
        grounds:
          - "validations[priority=1]"
          - "errors[ERR_UNAUTHENTICATED]"
        distinguishing_aspect: "Missing X-User-Role/X-User-ID headers -> 401 ERR_UNAUTHENTICATED before any other check."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "GET /households/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", captures: { err: $.data.error_id } }
          assert:
            - "capture ${err} == ERR_UNAUTHENTICATED"
            - "http status == 401 (not 404 — auth precedes existence even for unknown ids)"

      - name: resident_cannot_pay_others_subscription
        claim_type: violation_to_error
        grounds:
          - "validations[priority=3]"
          - "errors[ERR_RESIDENT_NOT_OWNER]"
        distinguishing_aspect: "Resident B paying household A's subscription -> 403 ERR_RESIDENT_NOT_OWNER (ownership precedes state checks)."
        test_recipe:
          setup: ["clock 2026-04-15; opt-in zone; households A and B; A's PENDING_PAYMENT subscription"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-04-15T00:00:00Z" }, as: ProgramAdmin }
            - { call: "POST /service-zones", payload: { name: "North", service_model: "OPT_IN", season_start_date: "2026-05-01", season_end_date: "2026-10-31", base_seasonal_fee_cents: 12000, universal_flat_credit_cents: 500 }, as: ProgramAdmin, captures: { zone_o: $.data.id } }
            - { call: "POST /households", payload: { address_line: "1 Oak St", zone_id: "${zone_o}" }, as: Anonymous, captures: { hh_a: $.data.id, hh_a_v: $.data.version } }
            - { call: "POST /households", payload: { address_line: "9 Birch Ave", zone_id: "${zone_o}" }, as: Anonymous, captures: { hh_b: $.data.id } }
            - { call: "POST /subscriptions", payload: { household_id: "${hh_a}", season_year: 2026, expected_household_version: "${hh_a_v}" }, as: Resident, as_user_id: "${hh_a}", captures: { sub_a: $.data.id } }
          trigger:
            - { call: "POST /subscriptions/${sub_a}/pay", payload: { use_credit_balance: false }, as: Resident, as_user_id: "${hh_b}", captures: { err: $.data.error_id } }
          assert:
            - "capture ${err} == ERR_RESIDENT_NOT_OWNER"
            - "Subscription.${sub_a}.status == PENDING_PAYMENT"

      - name: enrollment_window_closed_off_season
        claim_type: violation_to_error
        grounds:
          - "validations[priority=10]"
          - "errors[ERR_ENROLLMENT_WINDOW_CLOSED]"
        distinguishing_aspect: "Signup while the zone is OFF_SEASON (clock 2026-11-05) -> 422 ERR_ENROLLMENT_WINDOW_CLOSED."
        test_recipe:
          setup: ["opt-in zone season 2026; household; clock advanced to 2026-11-05"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-04-15T00:00:00Z" }, as: ProgramAdmin }
            - { call: "POST /service-zones", payload: { name: "North", service_model: "OPT_IN", season_start_date: "2026-05-01", season_end_date: "2026-10-31", base_seasonal_fee_cents: 12000, universal_flat_credit_cents: 500 }, as: ProgramAdmin, captures: { zone_o: $.data.id } }
            - { call: "POST /households", payload: { address_line: "1 Oak St", zone_id: "${zone_o}" }, as: Anonymous, captures: { hh_a: $.data.id, hh_a_v: $.data.version } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-11-05T00:00:00Z" }, as: ProgramAdmin }
          trigger:
            - { call: "POST /subscriptions", payload: { household_id: "${hh_a}", season_year: 2026, expected_household_version: "${hh_a_v}" }, as: Resident, as_user_id: "${hh_a}", captures: { err: $.data.error_id } }
          assert:
            - "capture ${err} == ERR_ENROLLMENT_WINDOW_CLOSED"

      - name: ticket_date_out_of_season
        claim_type: violation_to_error
        grounds:
          - "validations[priority=10]"
          - "errors[ERR_TICKET_DATE_OUT_OF_SEASON]"
        distinguishing_aspect: "Ticket service_date 2026-11-30 (a Monday after season end) -> 422 ERR_TICKET_DATE_OUT_OF_SEASON."
        test_recipe:
          setup: ["universal household ACTIVE; published MONDAY route; clock 2026-05-05"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-04-15T00:00:00Z" }, as: ProgramAdmin }
