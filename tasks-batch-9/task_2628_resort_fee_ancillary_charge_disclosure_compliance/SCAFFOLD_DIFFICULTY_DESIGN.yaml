        grounds:
          - state_machines.RegulatorInquiry.RESPONSE_SUBMITTED_to_REMEDIATION_REQUIRED
          - state_machines.ChannelDisclosureProfile.DEPLOYED_to_FLAGGED
          - calculations.property_disclosure_posture
          - state_machines.Booking.PENDING_AUDIT_to_DISPUTED
          - calculations.inquiry_exposure
          - calculations.disclosure_obligation_conservation
        distinguishing_aspect: |
          One PlatformAdmin call produces a five-deep chain in which every link is
          caused strictly by the previous one: (1) the inquiry enters
          REMEDIATION_REQUIRED, (2) which flags the in-scope DEPLOYED profile,
          (3) which drops Property.min_channel_disclosure_score to 0 because a
          FLAGGED profile contributes 0, (4) which makes the posture
          NON_COMPLIANT and only therefore disputes the property's QUOTED
          PENDING_AUDIT bookings, (5) which is the only reason
          aggregate_disclosure_gap_cents and exposure_cents become non-zero.
          Remove any link and the next cannot fire: with a second live profile
          scoring 100 the minimum would be 100, the posture would stay COMPLIANT,
          and no booking would be disputed. Two filters are crossed at depth 4
          and 5: the dispute filter is stay_status == QUOTED (property-wide,
          channel-blind) while the exposure filter is channel_scope
