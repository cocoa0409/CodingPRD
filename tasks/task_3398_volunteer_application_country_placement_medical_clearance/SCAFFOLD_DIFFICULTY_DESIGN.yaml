      - name: allowance_paid_plus_forfeited_conserves_gross_accrual
        grounds:
          - calculations.readjustment_allowance
          - entities.CompletionRecord.fields.allowance_forfeited_cents
        distinguishing_aspect: |
          Conserved quantity = fiscal accrual cents: the early-termination forward action splits
          the gross accrual into paid + forfeited, and the invariant
          allowance_paid_cents + allowance_forfeited_cents == gross_accrued_cents
          == months_served * 47500 MUST hold exactly (190002 + 94998 == 285000) — a different
