scenario: |
  Commercial Appraisal & Narrative Report Production (CBRE Valuation style practice): engagement letter with intended use/user & scope of work, approach selection (income/sales/cost) & data gathering, rent roll & operating statement analysis, capitalization rate support & DCF assumptions, review process & MAI signature requirements, client revision vs appraiser independence, turnaround & fee by complexity, file retention & litigation support

domain_name: commercial-appraisal-reports
api_prefix: /

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: workflow_orchestration
  complexity_layers:
    - dual_variant_calculation      # fee TIERED vs PER_SF; NOI TRAILING vs STABILIZED
    - cascading_side_effects        # litigation-hold and report-delivery depth-3 chains
    - optimistic_concurrency        # OCC on Engagement.version (report create) and Report.version (revision accept)
    - rate_threshold_triggers       # complexity tiers, expedited bands, volume-discount tiers
  entity_topology: flat             # peer entities joined by FK references; no nested URL ownership
  state_machine_shape: cyclic       # Report revision loops; ValuationApproach COMPLETE<->EXCLUDED; Engagement hold cycle
  relationship_patterns:
    - one_to_many                   # Engagement -> DataSubmission / ValuationApproach / ComparableSale / Report / RetentionRecord
    - self_referential              # Report.supersedes_report_id
    - cross_aggregate               # Report -> Appraiser (signer); Engagement -> Client + Appraiser x2
  role_model: segregation_of_duties # author != reviewer; signer MAI + != author; client cannot edit, only request
  consistency_model: immediate

# =============================================================================
# 1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Client
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Client organization name" }
      - { name: client_type, type: enum, source: input, description: "LENDER | LAW_FIRM | INVESTOR | GOVERNMENT_AGENCY" }
      - { name: total_billed_cents, type: integer, source: computed, default: 0, description: "Net billed final fees: +final_fee_cents on engagement completion, -final_fee_cents on fee write-off" }
      - { name: volume_discount_tier, type: enum, source: computed, default: "NONE", description: "NONE | TIER_1 | TIER_2 — derived from total_billed_cents thresholds" }

  - name: Appraiser
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Appraiser full name" }
      - { name: designation, type: enum, source: input, description: "TRAINEE | CERTIFIED_GENERAL | MAI — MAI required to sign" }
      - { name: license_status, type: enum, source: system, default: "ACTIVE", description: "ACTIVE | SUSPENDED | EXPIRED" }

  - name: Engagement
    parent: null
    common_fields: true
    fields:
      - { name: client_id, type: string, source: input, description: "FK -> Client.id; ordering party" }
      - { name: author_appraiser_id, type: string, source: input, description: "FK -> Appraiser.id; staff appraiser who produces the report" }
      - { name: reviewer_appraiser_id, type: string, source: input, description: "FK -> Appraiser.id; internal review appraiser; must differ from author at submit" }
      - { name: property_address, type: string, source: input, description: "Subject property address" }
      - { name: property_type, type: enum, source: input, description: "OFFICE | RETAIL | INDUSTRIAL | MULTIFAMILY | SPECIAL_PURPOSE" }
      - { name: building_sf, type: integer, source: input, description: "Building area in square feet, > 0" }
      - { name: intended_use, type: enum, source: input, description: "FINANCING | LITIGATION | FINANCIAL_REPORTING | TAX_APPEAL" }
      - { name: intended_users, type: array, source: input, description: "Array of intended-user names (engagement letter)" }
      - { name: requested_turnaround_days, type: integer, source: input, description: "Client-requested turnaround in calendar days, > 0" }
      - { name: planned_approach_count, type: integer, source: input, description: "Number of valuation approaches planned, 1..3" }
      - { name: fee_schedule, type: enum, source: input, default: "TIERED", description: "TIERED | PER_SF — selects the fee_quote variant" }
      - { name: is_contingent_fee, type: boolean, source: input, default: false, description: "True if fee is contingent on value conclusion — prohibited, blocks acceptance" }
      - { name: complexity_tier, type: enum, source: computed, description: "LOW | STANDARD | HIGH — from property_type/building_sf/intended_use" }
      - { name: minimum_turnaround_days, type: integer, source: computed, description: "Minimum feasible turnaround for the complexity tier" }
      - { name: quoted_fee_cents, type: integer, source: computed, description: "Fee quoted at submit; null until then" }
      - { name: final_fee_cents, type: integer, source: computed, description: "Fee locked at acceptance; null until then" }
      - { name: fee_written_off, type: boolean, source: system, default: false, description: "True once the final fee has been written off" }
      - { name: submitted_at, type: datetime, source: system, description: "Logical-clock timestamp of submit; null until submitted" }
      - { name: accepted_at, type: datetime, source: system, description: "Logical-clock timestamp of acceptance; null until accepted" }
      - { name: due_date, type: datetime, source: computed, description: "accepted_at + requested_turnaround_days" }
      - { name: litigation_matter_reference, type: string, source: system, description: "Matter caption recorded when a litigation hold is placed; null otherwise" }
      - { name: status, type: enum, source: system, description: "DRAFT | PENDING_ACCEPTANCE | IN_PROGRESS | LITIGATION_HOLD | COMPLETED | CANCELLED | DECLINED | EXPIRED" }

  - name: DataSubmission
    parent: null
    common_fields: true
    fields:
      - { name: engagement_id, type: string, source: system, description: "FK -> Engagement.id; engagement the data belongs to" }
      - { name: submission_type, type: enum, source: input, description: "RENT_ROLL | OPERATING_STATEMENT | TAX_BILL" }
      - { name: period_start, type: datetime, source: input, description: "Period start date (ISO date at 00:00:00Z)" }
      - { name: period_end, type: datetime, source: input, description: "Period end date, INCLUSIVE; must be >= period_start" }
      - { name: scheduled_gross_rent_cents, type: integer, source: input, description: "Scheduled gross rent over the period, >= 0" }
      - { name: vacancy_loss_cents, type: integer, source: input, description: "Vacancy/collection loss over the period, >= 0" }
      - { name: expense_reimbursements_cents, type: integer, source: input, description: "Tenant expense reimbursements, >= 0" }
      - { name: operating_expenses_cents, type: integer, source: input, description: "Total operating expenses, >= 0" }
      - { name: noi_trailing_cents, type: integer, source: computed, description: "Trailing-actual NOI; computed on accept for OPERATING_STATEMENT only; null otherwise" }
      - { name: noi_stabilized_cents, type: integer, source: computed, description: "Stabilized NOI; computed on accept for OPERATING_STATEMENT only; null otherwise" }
      - { name: review_note, type: string, source: system, description: "Reviewer note recorded on reject; null otherwise" }
      - { name: status, type: enum, source: system, description: "SUBMITTED | ACCEPTED | REJECTED | LOCKED (LOCKED on engagement completion)" }

  - name: ValuationApproach
    parent: null
    common_fields: true
    fields:
      - { name: engagement_id, type: string, source: system, description: "FK -> Engagement.id" }
      - { name: approach_type, type: enum, source: input, description: "INCOME | SALES_COMPARISON | COST — unique per engagement" }
      - { name: cap_rate_bps, type: integer, source: input, description: "Direct-capitalization rate in basis points; required for INCOME" }
      - { name: dcf_holding_period_years, type: integer, source: input, description: "DCF holding period; part of the all-or-none DCF set" }
      - { name: dcf_discount_rate_bps, type: integer, source: input, description: "DCF discount rate in bps; part of the all-or-none DCF set" }
      - { name: dcf_exit_cap_bps, type: integer, source: input, description: "DCF exit capitalization rate in bps; part of the all-or-none DCF set" }
      - { name: revenue_growth_bps_annual, type: integer, source: input, description: "Annual NOI growth in bps; part of the all-or-none DCF set" }
      - { name: land_value_cents, type: integer, source: input, description: "Land value; required for COST" }
      - { name: replacement_cost_cents, type: integer, source: input, description: "Replacement cost new; required for COST" }
      - { name: depreciation_pct, type: number, source: input, description: "Total depreciation percent 0..100; required for COST" }
      - { name: indicated_value_cents, type: integer, source: computed, description: "Approach indicated value; computed at complete; null until then" }
      - { name: weight_pct, type: number, source: input, description: "Reconciliation weight, 2 decimals, 0..100" }
      - { name: status, type: enum, source: system, description: "SELECTED | COMPLETE | EXCLUDED" }

  - name: ComparableSale
    parent: null
    common_fields: true
    fields:
      - { name: engagement_id, type: string, source: system, description: "FK -> Engagement.id" }
      - { name: address, type: string, source: input, description: "Comparable property address" }
      - { name: sale_date, type: datetime, source: input, description: "Sale date; must be within 24 months before engagement.accepted_at and not in the future" }
      - { name: sale_price_cents, type: integer, source: input, description: "Sale price, > 0" }
      - { name: noi_at_sale_cents, type: integer, source: input, description: "NOI at time of sale, > 0" }
      - { name: size_sf, type: integer, source: input, description: "Comparable size, > 0" }
      - { name: adjustment_pct, type: number, source: input, default: 0, description: "Net adjustment percent applied to the comparable" }
      - { name: selected_for_support, type: boolean, source: input, default: true, description: "Whether this comp supports the cap rate / sales value" }
      - { name: implied_cap_rate_bps, type: integer, source: computed, description: "round_half_up(noi_at_sale_cents * 10000 / sale_price_cents)" }
      - { name: adjusted_cap_rate_bps, type: integer, source: computed, description: "round_half_up(implied_cap_rate_bps * (1 + adjustment_pct/100))" }

  - name: Report
    parent: null
    common_fields: true
    fields:
      - { name: engagement_id, type: string, source: system, description: "FK -> Engagement.id" }
      - { name: report_version_no, type: integer, source: system, description: "1-based version counter per engagement" }
      - { name: supersedes_report_id, type: string, source: system, description: "FK -> Report.id; prior non-terminal report superseded by this version; null for version 1" }
      - { name: value_conclusion_cents, type: integer, source: computed, description: "Reconciled value; computed at submit_review and adjusted on revision accept; null until first submit_review" }
      - { name: review_cycle_count, type: integer, source: system, default: 0, description: "Number of times the report has been returned from INTERNAL_REVIEW to DRAFTING" }
      - { name: signer_appraiser_id, type: string, source: system, description: "FK -> Appraiser.id; MAI signatory; set at sign; null until then" }
      - { name: pre_hold_status, type: enum, source: system, description: "Status saved when SUSPENDED by a litigation hold; restored on release; null unless SUSPENDED" }
      - { name: issued_to_client_at, type: datetime, source: system, description: "Timestamp of (re)issue to client; anchors the 30-day revision window" }
      - { name: signed_at, type: datetime, source: system, description: "Timestamp of MAI signature; null until signed" }
      - { name: delivered_at, type: datetime, source: system, description: "Timestamp of delivery; null until delivered" }
      - { name: status, type: enum, source: system, description: "DRAFTING | INTERNAL_REVIEW | REVIEWED | CLIENT_REVIEW | REVISION_REQUESTED | FINAL | SIGNED | DELIVERED | SUPERSEDED | SUSPENDED" }

  - name: RevisionRequest
    parent: null
    common_fields: true
    fields:
      - { name: report_id, type: string, source: system, description: "FK -> Report.id" }
      - { name: category, type: enum, source: input, description: "FACTUAL_CORRECTION | CLARIFICATION | METHODOLOGY_QUESTION | VALUE_PRESSURE" }
      - { name: requested_change, type: string, source: input, description: "Free-text description of the requested change" }
      - { name: proposed_value_cents, type: integer, source: input, description: "Client-proposed value; meaningful for VALUE_PRESSURE; optional" }
      - { name: value_adjustment_cents, type: integer, source: system, description: "Signed adjustment applied to Report.value_conclusion_cents on accept; null if none" }
      - { name: resolution_note, type: string, source: system, description: "Note recorded on accept or decline" }
      - { name: submitted_at, type: datetime, source: system, description: "Timestamp of submission" }
      - { name: status, type: enum, source: system, description: "OPEN | ACCEPTED | DECLINED | ESCALATED | WITHDRAWN" }

  - name: RetentionRecord
    parent: null
    common_fields: true
    fields:
      - { name: engagement_id, type: string, source: system, description: "FK -> Engagement.id; 1:1, created on engagement completion" }
      - { name: completed_date, type: datetime, source: system, description: "Date (00:00:00Z) the engagement completed" }
      - { name: base_retain_until_date, type: datetime, source: computed, description: "completed_date + 5 years (USPAP floor)" }
      - { name: litigation_hold_placed_at, type: datetime, source: system, description: "Timestamp the hold was placed; null unless held" }
      - { name: litigation_released_at, type: datetime, source: system, description: "Timestamp the hold was released; null unless released" }
      - { name: litigation_matter_reference, type: string, source: system, description: "Matter caption recorded when the hold was placed; null otherwise" }
      - { name: retain_until_date, type: datetime, source: computed, description: "null while LITIGATION_HOLD; otherwise max(base_retain_until_date, date(litigation_released_at) + 2 years) when released, else base_retain_until_date" }
      - { name: status, type: enum, source: system, description: "ACTIVE | LITIGATION_HOLD | RELEASED_PENDING_DESTRUCTION | DESTROYED" }

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Appraiser
    initial_state: ACTIVE          # on license_status dimension
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /appraisers/{appraiserId}/license_status {status: SUSPENDED}"
        actor: EngagementManager
        preconditions: ["current license_status != SUSPENDED"]
        side_effects: ["license_status = SUSPENDED", "version += 1"]
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /appraisers/{appraiserId}/license_status {status: ACTIVE}"
        actor: EngagementManager
        preconditions: []
        side_effects: ["license_status = ACTIVE", "version += 1"]
      - from: ACTIVE
        to: EXPIRED
        trigger: "POST /appraisers/{appraiserId}/license_status {status: EXPIRED}"
        actor: EngagementManager
        preconditions: []
        side_effects: ["license_status = EXPIRED", "version += 1"]
      - from: SUSPENDED
        to: EXPIRED
        trigger: "POST /appraisers/{appraiserId}/license_status {status: EXPIRED}"
        actor: EngagementManager
        preconditions: []
        side_effects: ["license_status = EXPIRED", "version += 1"]
      - from: EXPIRED
        to: ACTIVE
        trigger: "POST /appraisers/{appraiserId}/license_status {status: ACTIVE} (renewal)"
        actor: EngagementManager
        preconditions: []
        side_effects: ["license_status = ACTIVE", "version += 1"]

  - entity: Engagement
    initial_state: DRAFT
    terminal_states: [COMPLETED, CANCELLED, DECLINED, EXPIRED]
    transitions:
      - from: DRAFT
        to: PENDING_ACCEPTANCE
        trigger: "POST /engagements/{engagementId}/submit"
        actor: EngagementManager
        preconditions:
          - "author_appraiser_id != reviewer_appraiser_id (ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "quoted_fee_cents = fee_quote(...)"
          - "submitted_at = current logical clock"
      - from: PENDING_ACCEPTANCE
        to: IN_PROGRESS
        trigger: "POST /engagements/{engagementId}/accept"
        actor: Client
        preconditions:
          - "caller is the engagement's client (ERR_NOT_ENGAGEMENT_CLIENT)"
          - "engagement letter not expired: clock <= submitted_at + 14 days"
          - "is_contingent_fee == false (ERR_CONTINGENT_FEE_PROHIBITED)"
          - "requested_turnaround_days >= minimum_turnaround_days (ERR_TURNAROUND_INFEASIBLE)"
          - "author has no overlapping active assignment window (ERR_APPRAISER_OVERCOMMITTED)"
        side_effects:
          - "accepted_at = current logical clock"
          - "due_date = accepted_at + requested_turnaround_days"
          - "final_fee_cents = fee_quote(...) (locked)"
      - from: PENDING_ACCEPTANCE
        to: DECLINED
        trigger: "POST /engagements/{engagementId}/decline"
        actor: Client
        preconditions:
          - "caller is the engagement's client (ERR_NOT_ENGAGEMENT_CLIENT)"
        side_effects: []
      - from: PENDING_ACCEPTANCE
        to: EXPIRED
        trigger: "system — sweep during POST /_clock/set_current_utc"
        actor: system
        preconditions:
          - "new clock value > submitted_at + 14 days (strictly greater; exactly +14 days remains PENDING_ACCEPTANCE)"
        side_effects: []
      - from: DRAFT
        to: CANCELLED
        trigger: "POST /engagements/{engagementId}/cancel"
        actor: EngagementManager
        preconditions: []
        side_effects: []
      - from: PENDING_ACCEPTANCE
        to: CANCELLED
        trigger: "POST /engagements/{engagementId}/cancel"
        actor: EngagementManager
        preconditions: []
        side_effects: []
      - from: IN_PROGRESS
        to: CANCELLED
        trigger: "POST /engagements/{engagementId}/cancel"
        actor: EngagementManager
        preconditions: []
        side_effects:
          - "every Report of this engagement in a non-terminal state (DRAFTING, INTERNAL_REVIEW, REVIEWED, CLIENT_REVIEW, REVISION_REQUESTED, FINAL, SIGNED, SUSPENDED) -> SUPERSEDED"
      - from: IN_PROGRESS
        to: LITIGATION_HOLD
        trigger: "POST /engagements/{engagementId}/litigation-hold"
        actor: LegalCounsel
        preconditions: []
        side_effects:
          - "litigation_matter_reference = matter_reference from request"
          - "LINK 1 -> every Report of this engagement in non-terminal, non-SUPERSEDED state -> SUSPENDED with pre_hold_status saved"
          - "LINK 2 -> every RevisionRequest in OPEN on each suspended Report -> ESCALATED (caused by the report suspension)"
      - from: LITIGATION_HOLD
        to: IN_PROGRESS
        trigger: "DELETE /engagements/{engagementId}/litigation-hold"
        actor: LegalCounsel
        preconditions: []
        side_effects:
          - "every Report in SUSPENDED -> its saved pre_hold_status; pre_hold_status cleared to null"
          - "litigation_matter_reference cleared to null"
      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "system — automatic when the engagement's Report transitions SIGNED -> DELIVERED"
        actor: system
        preconditions: []
        side_effects:
          - "LINK 1 -> Client.total_billed_cents += final_fee_cents; Client.volume_discount_tier recomputed"
          - "LINK 1 -> RetentionRecord created (status ACTIVE, completed_date = date(clock), base_retain_until_date = completed_date + 5 years, retain_until_date = base_retain_until_date)"
          - "LINK 2 -> every DataSubmission of this engagement in SUBMITTED or ACCEPTED -> LOCKED (caused by the RetentionRecord creation / workfile freeze)"
    note: "COMPLETED also reachable only via delivery; fee write-off is a field mutation on COMPLETED, not a state change."

  - entity: DataSubmission
    initial_state: SUBMITTED
    terminal_states: [REJECTED, LOCKED]
    transitions:
      - from: SUBMITTED
        to: ACCEPTED
        trigger: "POST /data-submissions/{submissionId}/accept"
        actor: StaffAppraiser
        preconditions:
          - "caller is the engagement's author appraiser (ERR_NOT_ASSIGNED_APPRAISER)"
          - "engagement.status == IN_PROGRESS"
        side_effects:
          - "if submission_type == OPERATING_STATEMENT: compute noi_trailing_cents and noi_stabilized_cents per noi_variants"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /data-submissions/{submissionId}/reject"
        actor: StaffAppraiser
        preconditions:
          - "caller is the engagement's author appraiser (ERR_NOT_ASSIGNED_APPRAISER)"
          - "engagement.status == IN_PROGRESS"
        side_effects: ["review_note = request note"]
      - from: SUBMITTED
        to: LOCKED
        trigger: "system — engagement completion workfile freeze"
        actor: system
        preconditions: []
        side_effects: []
      - from: ACCEPTED
        to: LOCKED
        trigger: "system — engagement completion workfile freeze"
        actor: system
        preconditions: []
        side_effects: []

  - entity: ValuationApproach
    initial_state: SELECTED
    terminal_states: []
    transitions:
      - from: SELECTED
        to: COMPLETE
        trigger: "POST /approaches/{approachId}/complete"
        actor: StaffAppraiser
        preconditions:
          - "caller is the engagement's author appraiser (ERR_NOT_ASSIGNED_APPRAISER)"
          - "engagement.status == IN_PROGRESS"
          - "INCOME: >= 1 ACCEPTED OPERATING_STATEMENT on the engagement (ERR_INCOME_DATA_MISSING)"
          - "INCOME: >= 1 ComparableSale with selected_for_support == true (ERR_COMPARABLES_INSUFFICIENT)"
          - "INCOME: DCF set all-or-none — exactly some of the 4 dcf fields present -> ERR_DCF_ASSUMPTIONS_INCOMPLETE"
          - "INCOME: |cap_rate_bps - supported_cap_rate_bps| <= 25 (ERR_CAP_RATE_UNSUPPORTED)"
          - "SALES_COMPARISON: >= 1 ComparableSale with selected_for_support == true (ERR_COMPARABLES_INSUFFICIENT)"
          - "COST: land_value_cents, replacement_cost_cents, depreciation_pct all present (ERR_COST_INPUTS_INCOMPLETE)"
        side_effects:
          - "indicated_value_cents computed per approach rule (dcf_value if full DCF set, else direct_capitalization_value for INCOME; sales_comparison_value; cost_approach_value)"
      - from: COMPLETE
        to: EXCLUDED
        trigger: "POST /approaches/{approachId}/exclude"
        actor: StaffAppraiser
        preconditions:
          - "caller is the engagement's author appraiser"
          - "engagement.status == IN_PROGRESS"
        side_effects: []
      - from: EXCLUDED
        to: COMPLETE
        trigger: "POST /approaches/{approachId}/include"
        actor: StaffAppraiser
        preconditions:
          - "caller is the engagement's author appraiser"
          - "engagement.status == IN_PROGRESS"
        side_effects: []
    note: "EXCLUDED approaches are omitted from reconciliation; the COMPLETE<->EXCLUDED cycle is unrestricted while the engagement is IN_PROGRESS."

  - entity: Report
    initial_state: DRAFTING
    terminal_states: [DELIVERED, SUPERSEDED]
    transitions:
      - from: "(creation)"
        to: DRAFTING
        trigger: "POST /engagements/{engagementId}/reports"
        actor: StaffAppraiser
        preconditions:
          - "caller is the engagement's author appraiser (ERR_NOT_ASSIGNED_APPRAISER)"
          - "engagement.status == IN_PROGRESS (ERR_INVALID_STATE_TRANSITION)"
          - "OCC: expected_engagement_version == engagement.version (ERR_STALE_ENGAGEMENT_VERSION)"
        side_effects:
          - "report_version_no = max(existing versions) + 1"
          - "every existing Report of this engagement in a non-terminal, non-DELIVERED state -> SUPERSEDED; supersedes_report_id set to the superseded report with the greatest report_version_no (null if none)"
          - "engagement.version += 1"
      - from: DRAFTING
        to: INTERNAL_REVIEW
        trigger: "POST /reports/{reportId}/submit_review"
        actor: StaffAppraiser
        preconditions:
          - "caller is the engagement's author appraiser"
          - "engagement.status == IN_PROGRESS"
          - ">= 1 approach in COMPLETE and not EXCLUDED (ERR_NO_COMPLETED_APPROACH)"
          - "sum of weight_pct over approaches in COMPLETE and not EXCLUDED == 100.00 exactly (ERR_WEIGHT_SUM_INVALID)"
        side_effects:
          - "value_conclusion_cents = reconciled_value(...) — snapshot"
      - from: INTERNAL_REVIEW
        to: REVIEWED
        trigger: "POST /reports/{reportId}/review_approve"
        actor: ReviewAppraiser
        preconditions:
          - "caller is the engagement's reviewer appraiser (ERR_NOT_ASSIGNED_REVIEWER)"
          - "engagement.status == IN_PROGRESS"
        side_effects: []
      - from: INTERNAL_REVIEW
        to: DRAFTING
        trigger: "POST /reports/{reportId}/review_return"
        actor: ReviewAppraiser
        preconditions:
          - "caller is the engagement's reviewer appraiser (ERR_NOT_ASSIGNED_REVIEWER)"
        side_effects:
          - "review_cycle_count += 1"
      - from: REVIEWED
        to: CLIENT_REVIEW
        trigger: "POST /reports/{reportId}/issue_to_client"
        actor: StaffAppraiser
        preconditions:
          - "caller is the engagement's author appraiser"
          - "engagement.status == IN_PROGRESS"
        side_effects:
          - "issued_to_client_at = current logical clock"
      - from: CLIENT_REVIEW
        to: REVISION_REQUESTED
        trigger: "system — automatic when a RevisionRequest is created OPEN on this report"
        actor: system
        preconditions: []
        side_effects: []
      - from: REVISION_REQUESTED
        to: CLIENT_REVIEW
        trigger: "POST /reports/{reportId}/reissue"
        actor: StaffAppraiser
        preconditions:
          - "caller is the engagement's author appraiser"
          - "no RevisionRequest of this report in OPEN (ERR_REVISION_REQUESTS_OPEN)"
        side_effects:
          - "issued_to_client_at = current logical clock (revision window restarts)"
      - from: CLIENT_REVIEW
        to: FINAL
        trigger: "POST /reports/{reportId}/finalize"
        actor: StaffAppraiser
        preconditions:
          - "caller is the engagement's author appraiser"
          - "no RevisionRequest of this report in OPEN or ESCALATED (ERR_REVISION_REQUESTS_OPEN)"
        side_effects: []
      - from: FINAL
        to: SIGNED
        trigger: "POST /reports/{reportId}/sign"
        actor: MAISigner
        preconditions:
          - "signer appraiser designation == MAI (ERR_SIGNER_NOT_MAI_DESIGNATED)"
          - "signer appraiser license_status == ACTIVE (ERR_SIGNER_LICENSE_INACTIVE)"
          - "signer appraiser id != engagement.author_appraiser_id (ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "signer_appraiser_id = X-User-ID"
          - "signed_at = current logical clock"
      - from: SIGNED
        to: DELIVERED
        trigger: "POST /reports/{reportId}/deliver"
        actor: StaffAppraiser | EngagementManager
        preconditions: []
        side_effects:
          - "delivered_at = current logical clock"
          - "LINK 1 -> Engagement.status -> COMPLETED"
          - "LINK 2 -> (from engagement completion) Client.total_billed_cents += final_fee_cents; volume_discount_tier recomputed; RetentionRecord created"
          - "LINK 3 -> (from RetentionRecord creation) DataSubmissions in SUBMITTED or ACCEPTED -> LOCKED"
      - from: "DRAFTING|INTERNAL_REVIEW|REVIEWED|CLIENT_REVIEW|REVISION_REQUESTED|FINAL|SIGNED"
        to: SUPERSEDED
        trigger: "system — a new Report version is created on the same engagement, or the engagement is cancelled"
        actor: system
        preconditions: []
        side_effects: []
      - from: "DRAFTING|INTERNAL_REVIEW|REVIEWED|CLIENT_REVIEW|REVISION_REQUESTED|FINAL|SIGNED"
        to: SUSPENDED
        trigger: "system — engagement enters LITIGATION_HOLD"
        actor: system
        preconditions: []
        side_effects:
          - "pre_hold_status = current status"
          - "LINK -> every RevisionRequest in OPEN on this report -> ESCALATED"
      - from: SUSPENDED
        to: "(saved pre_hold_status)"
        trigger: "system — litigation hold released"
        actor: system
        preconditions: []
        side_effects: ["status = pre_hold_status; pre_hold_status = null"]

  - entity: RevisionRequest
    initial_state: OPEN
    terminal_states: [ACCEPTED, DECLINED, WITHDRAWN]
    transitions:
      - from: "(creation)"
        to: OPEN
        trigger: "POST /reports/{reportId}/revision-requests"
        actor: Client
        preconditions:
          - "caller is the engagement's client (ERR_NOT_ENGAGEMENT_CLIENT)"
          - "report.status == CLIENT_REVIEW (ERR_INVALID_STATE_TRANSITION)"
          - "clock <= report.issued_to_client_at + 30 days (ERR_REVISION_WINDOW_CLOSED)"
        side_effects:
          - "submitted_at = current logical clock"
          - "report.status -> REVISION_REQUESTED"
      - from: OPEN
        to: ACCEPTED
        trigger: "POST /revision-requests/{requestId}/accept"
        actor: StaffAppraiser
        preconditions:
          - "caller is the engagement's author appraiser (ERR_NOT_ASSIGNED_APPRAISER)"
          - "category != VALUE_PRESSURE — a value-pressure request may never be accepted (ERR_INDEPENDENCE_COMPROMISE)"
          - "OCC: expected_report_version == report.version (ERR_STALE_REPORT_VERSION)"
          - "report.status == REVISION_REQUESTED (ERR_INVALID_STATE_TRANSITION)"
        side_effects:
          - "resolution_note recorded"
          - "if value_adjustment_cents provided: report.value_conclusion_cents += value_adjustment_cents"
          - "report.version += 1"
      - from: OPEN
        to: DECLINED
        trigger: "POST /revision-requests/{requestId}/decline"
        actor: StaffAppraiser
        preconditions:
          - "caller is the engagement's author appraiser"
          - "resolution_note present (ERR_INVALID_REQUEST)"
        side_effects: ["resolution_note recorded"]
      - from: ESCALATED
        to: DECLINED
        trigger: "POST /revision-requests/{requestId}/decline"
        actor: ReviewAppraiser
        preconditions:
          - "caller is the engagement's reviewer appraiser (ERR_NOT_ASSIGNED_REVIEWER)"
          - "resolution_note present (ERR_INVALID_REQUEST)"
        side_effects: ["resolution_note recorded"]
      - from: OPEN
        to: ESCALATED
        trigger: "POST /revision-requests/{requestId}/escalate"
        actor: StaffAppraiser
        preconditions:
          - "caller is the engagement's author appraiser"
        side_effects: []
      - from: OPEN
        to: ESCALATED
        trigger: "system — report SUSPENDED by litigation hold"
        actor: system
        preconditions: []
        side_effects: []
      - from: OPEN
        to: WITHDRAWN
        trigger: "POST /revision-requests/{requestId}/withdraw"
        actor: Client
        preconditions:
          - "caller is the engagement's client"
        side_effects: []

  - entity: RetentionRecord
    initial_state: ACTIVE
    terminal_states: [DESTROYED]
    transitions:
      - from: ACTIVE
        to: LITIGATION_HOLD
        trigger: "POST /engagements/{engagementId}/litigation-hold (engagement COMPLETED)"
        actor: LegalCounsel
        preconditions: ["engagement.status == COMPLETED"]
        side_effects:
          - "litigation_hold_placed_at = current logical clock"
          - "litigation_matter_reference = matter_reference from request"
          - "retain_until_date = null (indefinite while held)"
      - from: LITIGATION_HOLD
        to: ACTIVE
        trigger: "DELETE /engagements/{engagementId}/litigation-hold"
        actor: LegalCounsel
        preconditions: []
        side_effects:
          - "litigation_released_at = current logical clock"
          - "retain_until_date = max(base_retain_until_date, date(litigation_released_at) + 2 years)"
      - from: ACTIVE
        to: RELEASED_PENDING_DESTRUCTION
        trigger: "POST /retention-records/{recordId}/authorize_destruction"
        actor: RecordsManager
        preconditions:
          - "date(clock) >= retain_until_date (ERR_RETENTION_PERIOD_NOT_ELAPSED) — exactly on the date is allowed"
        side_effects: []
      - from: RELEASED_PENDING_DESTRUCTION
        to: DESTROYED
        trigger: "POST /retention-records/{recordId}/confirm_destruction"
        actor: RecordsManager
        preconditions: []
        side_effects: ["destroyed implicitly by terminal state"]

# =============================================================================
# 1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: report-create-stale-engagement
    parent_entity: Engagement
    write_endpoint: "POST /engagements/{engagementId}/reports"
    occ_field: expected_engagement_version
    description: |
      Creating a new Report version against an Engagement whose version has
      advanced since the client last observed it is rejected. A prior report
      creation legitimately supersedes earlier non-terminal reports, so a
      writer holding a pre-supersede view of the engagement is acting on
      stale state and must re-read before creating another version.
    error_id: ERR_STALE_ENGAGEMENT_VERSION
    http_status: 412
  - rule_id: revision-accept-stale-report
    parent_entity: Report
    write_endpoint: "POST /revision-requests/{requestId}/accept"
    occ_field: expected_report_version
    description: |
      Accepting a RevisionRequest against a Report whose version has advanced
      since the client last observed it is rejected. Each accepted revision
      legitimately mutates the report (value adjustment + version bump), so a
      second accept carrying the pre-mutation version is acting on a stale
      report and must re-read.
    error_id: ERR_STALE_REPORT_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: complexity_tier_assignment
    trigger: "Engagement creation"
    algorithm: threshold
    formula: |
      if property_type == SPECIAL_PURPOSE or intended_use == LITIGATION or building_sf >= HIGH_TIER_SF:
        tier = HIGH
      elif building_sf < LOW_TIER_SF and property_type in {RETAIL, INDUSTRIAL} and intended_use == FINANCING:
        tier = LOW
      else:
        tier = STANDARD
    input_set: "the Engagement being created"
    constants:
      HIGH_TIER_SF: 100000   # >= 100000 sf -> HIGH
      LOW_TIER_SF: 10000     # < 10000 sf (with type/use match) -> LOW
    precision: "enum; boundary: building_sf == 100000 -> HIGH; building_sf == 9999 with RETAIL|INDUSTRIAL + FINANCING -> LOW"

  - name: minimum_turnaround_days
    trigger: "Engagement creation"
    algorithm: threshold
    formula: |
      minimum_turnaround_days = MIN_TURNAROUND_DAYS[complexity_tier]
    input_set: "the Engagement's complexity_tier"
    constants:
      MIN_TURNAROUND_DAYS: { LOW: 10, STANDARD: 15, HIGH: 25 }
    precision: "whole days"

  - name: fee_quote
    trigger: "Engagement submit (writes quoted_fee_cents) and accept (recomputes and locks final_fee_cents)"
    algorithm: tiered_pricing
    formula: |
      # Evaluation order is PINNED (circular-looking dependency resolved):
      #   (1) compute pre_discount subtotal from the engagement's own fields;
      #   (2) look up discount_pct from client.total_billed_cents AS IT STANDS NOW —
      #       this engagement's fee is NEVER part of its own discount base,
      #       because fees only bill at delivery;
      #   (3) final = round_half_up(pre_discount * (1 - discount_pct)).
      if fee_schedule == TIERED:
        base = FEE_BASE_CENTS[complexity_tier]
        size_surcharge = building_sf > SIZE_SURCHARGE_THRESHOLD_SF
                         ? ceil((building_sf - SIZE_SURCHARGE_THRESHOLD_SF) / SIZE_SURCHARGE_BLOCK_SF) * SIZE_SURCHARGE_PER_BLOCK_CENTS
                         : 0
        approach_addon = max(0, planned_approach_count - 1) * APPROACH_ADDON_CENTS
        expedited = requested_turnaround_days < EXPEDITED_THRESHOLD_DAYS[complexity_tier]
        pre_discount = round_half_up((base + size_surcharge + approach_addon) * (expedited ? EXPEDITED_MULTIPLIER : 1.00))
      else:  # PER_SF
        expedited = requested_turnaround_days < EXPEDITED_THRESHOLD_DAYS[complexity_tier]
        pre_discount = PER_SF_RATE_CENTS[complexity_tier] * building_sf + (expedited ? EXPEDITED_FLAT_CENTS : 0)
      discount_pct = client.total_billed_cents >= VOLUME_TIER_2_THRESHOLD_CENTS ? 0.10
                     : (client.total_billed_cents >= VOLUME_TIER_1_THRESHOLD_CENTS ? 0.05 : 0.00)
      fee_cents = round_half_up(pre_discount * (1 - discount_pct))
    input_set: "the Engagement's tier/sf/turnaround/planned_approach_count/fee_schedule + the Client's current total_billed_cents"
    constants:
      FEE_BASE_CENTS: { LOW: 250000, STANDARD: 450000, HIGH: 900000 }
      SIZE_SURCHARGE_THRESHOLD_SF: 50000
      SIZE_SURCHARGE_BLOCK_SF: 10000
      SIZE_SURCHARGE_PER_BLOCK_CENTS: 15000
      APPROACH_ADDON_CENTS: 75000
      EXPEDITED_THRESHOLD_DAYS: { LOW: 20, STANDARD: 30, HIGH: 45 }
      EXPEDITED_MULTIPLIER: 1.25
      EXPEDITED_FLAT_CENTS: 100000
      PER_SF_RATE_CENTS: { LOW: 12, STANDARD: 18, HIGH: 30 }
      VOLUME_TIER_1_THRESHOLD_CENTS: 5000000
      VOLUME_TIER_2_THRESHOLD_CENTS: 15000000
    precision: "whole cents, round_half_up; TIERED rounds after the multiplier, then again after the discount"
    variants:
      - name: TIERED
        when: "fee_schedule == TIERED (default)"
        difference: "tier base + ceil size surcharge + per-approach addon, expedited multiplier 1.25"
      - name: PER_SF
        when: "fee_schedule == PER_SF"
        difference: "flat cents-per-SF rate by tier with flat expedited addon; identical inputs yield a different fee than TIERED"

  - name: volume_discount_tier
    trigger: "Client.total_billed_cents mutation (delivery billing, fee write-off)"
    algorithm: threshold
    formula: |
      volume_discount_tier = total_billed_cents >= VOLUME_TIER_2_THRESHOLD_CENTS ? TIER_2
                             : (total_billed_cents >= VOLUME_TIER_1_THRESHOLD_CENTS ? TIER_1 : NONE)
    input_set: "the Client's total_billed_cents"
    constants:
      VOLUME_TIER_1_THRESHOLD_CENTS: 5000000
      VOLUME_TIER_2_THRESHOLD_CENTS: 15000000
    precision: "boundary: exactly 5000000 -> TIER_1 (>=); exactly 14999999 -> TIER_1"

  - name: noi_variants
    trigger: "DataSubmission accept (OPERATING_STATEMENT only)"
    algorithm: aggregation
    formula: |
      # TRAILING_ACTUAL (as-reported):
      noi_trailing_cents = scheduled_gross_rent_cents - vacancy_loss_cents
                           + expense_reimbursements_cents - operating_expenses_cents
      # STABILIZED (market-normalized), step order pinned, each step round_half_up to cents:
      effective_gross      = round_half_up(scheduled_gross_rent_cents * (1 - MARKET_VACANCY_RATE))
      stabilized_expenses  = max(operating_expenses_cents,
                                 round_half_up(scheduled_gross_rent_cents * MIN_EXPENSE_RATIO))
      reserves             = round_half_up(scheduled_gross_rent_cents * RESERVE_RATE)
      noi_stabilized_cents = effective_gross + expense_reimbursements_cents - stabilized_expenses - reserves
    input_set: "the DataSubmission being accepted"
    constants:
      MARKET_VACANCY_RATE: 0.05
      MIN_EXPENSE_RATIO: 0.30
      RESERVE_RATE: 0.02
    precision: "whole cents, round_half_up at each pinned step"
    variants:
      - name: TRAILING_ACTUAL
        when: "always computed into noi_trailing_cents"
        difference: "uses as-reported vacancy and expenses, no reserves"
      - name: STABILIZED
        when: "always computed into noi_stabilized_cents"
        difference: "5% market vacancy, expenses floored at 30% of gross rent, 2% reserves deducted — identical inputs yield a different NOI"

  - name: direct_capitalization_value
    trigger: "ValuationApproach complete (INCOME, when the DCF set is absent)"
    algorithm: aggregation
    formula: |
      stmt = the engagement's ACCEPTED OPERATING_STATEMENT with the greatest period_end;
             tie-break: greatest DataSubmission.created_at
      indicated_value_cents = round_half_up(stmt.noi_stabilized_cents * 10000 / cap_rate_bps)
    input_set: "ACCEPTED OPERATING_STATEMENTs on the engagement + the approach's cap_rate_bps"
    precision: "whole cents, round_half_up"

  - name: dcf_value
    trigger: "ValuationApproach complete (INCOME, when all 4 DCF fields are present — DCF supersedes direct cap)"
    algorithm: forward_looking
    formula: |
      stmt = the engagement's ACCEPTED OPERATING_STATEMENT with the greatest period_end;
             tie-break: greatest DataSubmission.created_at
      y1 = stmt.noi_trailing_cents            # DCF projects from TRAILING actuals
      g  = revenue_growth_bps_annual / 10000
      r  = dcf_discount_rate_bps / 10000
      n  = dcf_holding_period_years
      xc = dcf_exit_cap_bps / 10000
      # rounding order PINNED: each annual PV rounded to cents first, then summed
      pv_sum = sum over t = 1..n of round_half_up( y1 * (1+g)^(t-1) / (1+r)^t )
      terminal = round_half_up( (y1 * (1+g)^n / xc) / (1+r)^n )   # NOI_{n+1} = year-n NOI grown once more
      indicated_value_cents = pv_sum + terminal
    input_set: "ACCEPTED OPERATING_STATEMENTs on the engagement + the approach's 4 DCF fields"
    precision: "whole cents, round_half_up per annual PV and per terminal value, then sum"

  - name: cap_rate_support
    trigger: "ComparableSale creation (per-comp fields) and ValuationApproach complete (INCOME support check)"
    algorithm: weighted_scoring
    formula: |
      per comp: implied_cap_rate_bps  = round_half_up(noi_at_sale_cents * 10000 / sale_price_cents)
                adjusted_cap_rate_bps = round_half_up(implied_cap_rate_bps * (1 + adjustment_pct/100))
      supported_cap_rate_bps = round_half_up( mean(adjusted_cap_rate_bps over comps with selected_for_support == true) )
      completion gate: |approach.cap_rate_bps - supported_cap_rate_bps| <= SUPPORT_TOLERANCE_BPS
    input_set: "ComparableSales on the engagement with selected_for_support == true"
    constants:
      SUPPORT_TOLERANCE_BPS: 25
    precision: "bps as integers; boundary: exactly 25 bps away -> allowed (<=)"

  - name: sales_comparison_value
    trigger: "ValuationApproach complete (SALES_COMPARISON)"
    algorithm: aggregation
    formula: |
      per selected comp: adjusted_unit_value_cents = round_half_up( sale_price_cents * (1 + adjustment_pct/100) / size_sf )
      indicated_value_cents = round_half_up( mean(adjusted_unit_value_cents over selected comps) * engagement.building_sf )
    input_set: "ComparableSales on the engagement with selected_for_support == true + engagement.building_sf"
    precision: "whole cents, round_half_up per comp unit value, then mean, then multiply and round"

  - name: cost_approach_value
    trigger: "ValuationApproach complete (COST)"
    algorithm: aggregation
    formula: |
      indicated_value_cents = land_value_cents + round_half_up( replacement_cost_cents * (1 - depreciation_pct/100) )
    input_set: "the approach's land_value_cents, replacement_cost_cents, depreciation_pct"
    precision: "whole cents, round_half_up"

  - name: reconciled_value
    trigger: "Report submit_review"
    algorithm: aggregation
    formula: |
      # rounding order PINNED: round each approach's weighted contribution to
      # whole cents FIRST (round_half_up), THEN sum. Summing exact products and
      # rounding once yields a different cent total and is NON-CONFORMING.
      included = approaches on the report's engagement with status COMPLETE (EXCLUDED omitted)
      value_conclusion_cents = sum over a in included of round_half_up( a.indicated_value_cents * a.weight_pct / 100 )
    input_set: "the engagement's COMPLETE, non-EXCLUDED approaches (weight sum must equal 100.00 — validated separately)"
    precision: "whole cents, round_half_up per contribution, then integer sum"

  - name: retention_schedule
    trigger: "RetentionRecord creation (engagement completion) and litigation-hold release"
    algorithm: chronological
    formula: |
      on creation:  completed_date = date(clock); base_retain_until_date = completed_date + RETENTION_YEARS years;
                    retain_until_date = base_retain_until_date
      on hold place: retain_until_date = null
      on hold release: retain_until_date = max(base_retain_until_date, date(litigation_released_at) + LITIGATION_EXTENSION_YEARS years)
    input_set: "the RetentionRecord"
    constants:
      RETENTION_YEARS: 5
      LITIGATION_EXTENSION_YEARS: 2
    precision: "date granularity (00:00:00Z)"

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present and well-formed"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: "all"
  - priority: 2
    category: auth
    check: "caller role is in the endpoint's roles list"
    error_id: ERR_FORBIDDEN_FOR_ROLE
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: existence
    check: "path ids and body FK references exist, validated left-to-right"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all"
  - priority: 4
    category: request_schema
    check: "required fields present; enum members valid; integers positive where required; period_end >= period_start; weight_pct within 0..100"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all"
  - priority: 5
    category: ownership
    check: "Client caller is the engagement's client"
    error_id: ERR_NOT_ENGAGEMENT_CLIENT
    http_status: 403
    applies_to: "POST /engagements/{id}/accept, POST /engagements/{id}/decline, POST /engagements/{id}/data-submissions, POST /reports/{id}/revision-requests, POST /revision-requests/{id}/withdraw"
  - priority: 6
    category: ownership
    check: "StaffAppraiser caller is the engagement's author appraiser"
    error_id: ERR_NOT_ASSIGNED_APPRAISER
    http_status: 403
    applies_to: "data-submission accept/reject, approach create/complete/exclude/include, comparable create, report create/submit_review/issue_to_client/reissue/finalize, revision-request accept/escalate/decline-from-OPEN"
  - priority: 7
    category: ownership
    check: "ReviewAppraiser caller is the engagement's reviewer appraiser"
    error_id: ERR_NOT_ASSIGNED_REVIEWER
    http_status: 403
    applies_to: "POST /reports/{id}/review_approve, POST /reports/{id}/review_return, POST /revision-requests/{id}/decline-from-ESCALATED"
  - priority: 8
    category: state
    check: "target resource is in a valid from-state for the transition"
    error_id: ERR_INVALID_STATE_TRANSITION
    http_status: 409
    applies_to: "all state-transition endpoints"
  - priority: 9
    category: concurrency
    check: "expected_<parent>_version matches the parent's current version"
    error_id: "ERR_STALE_ENGAGEMENT_VERSION | ERR_STALE_REPORT_VERSION"
    http_status: 412
    applies_to: "POST /engagements/{id}/reports, POST /revision-requests/{id}/accept"
  - priority: 10
    category: business_safety
    check: "USPAP/compliance gates: contingent fee prohibited; VALUE_PRESSURE requests never acceptable; signer designation MAI; signer license ACTIVE; author != reviewer at submit; signer != author at sign"
    error_id: "ERR_CONTINGENT_FEE_PROHIBITED | ERR_INDEPENDENCE_COMPROMISE | ERR_SIGNER_NOT_MAI_DESIGNATED | ERR_SIGNER_LICENSE_INACTIVE | ERR_SEGREGATION_OF_DUTIES"
    http_status: 409
    applies_to: "engagement submit/accept, revision accept, report sign"
  - priority: 11
    category: business_constraint
    check: "turnaround feasibility; reconciliation weight sum == 100.00; >= 1 included COMPLETE approach; per-type approach completion gates; unique approach_type per engagement; fee not already written off"
    error_id: "ERR_TURNAROUND_INFEASIBLE | ERR_WEIGHT_SUM_INVALID | ERR_NO_COMPLETED_APPROACH | ERR_INCOME_DATA_MISSING | ERR_COMPARABLES_INSUFFICIENT | ERR_DCF_ASSUMPTIONS_INCOMPLETE | ERR_CAP_RATE_UNSUPPORTED | ERR_COST_INPUTS_INCOMPLETE | ERR_DUPLICATE_APPROACH_TYPE | ERR_FEE_ALREADY_WRITTEN_OFF"
    http_status: 409
    applies_to: "engagement accept, report submit_review, approach create/complete, write_off_fee"
  - priority: 12
    category: business_temporal
    check: "OPERATING_STATEMENT inclusive period overlap; appraiser assignment half-open window overlap; revision window; retention period elapsed; comparable sale within lookback; engagement letter validity sweep"
    error_id: "ERR_STATEMENT_PERIOD_OVERLAP | ERR_APPRAISER_OVERCOMMITTED | ERR_REVISION_WINDOW_CLOSED | ERR_RETENTION_PERIOD_NOT_ELAPSED | ERR_COMPARABLE_TOO_OLD"
    http_status: 409
    applies_to: "data-submission create, engagement accept, revision-request create, authorize_destruction, comparable create, _clock/set_current_utc"

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Logical clock (test-driving; default time contract) ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the logical clock. Before any call, the logical clock reads exactly 2026-08-01T00:00:00Z and never falls back to wall-clock time. Side effect: sweeps PENDING_ACCEPTANCE engagements past submitted_at + 14 days into EXPIRED."
    roles: [EngagementManager, RecordsManager, LegalCounsel]
    code: 200
    input: [to_iso8601]
    output: { current_utc: datetime }
    side_effects: ["engagement-letter expiry sweep"]

  # --- Clients ---
  - method: POST
    path: "/clients"
    description: "Register a client"
    roles: [EngagementManager]
    code: 201
    input: [name, client_type]
    output: Client
    side_effects: ["total_billed_cents = 0, volume_discount_tier = NONE"]
  - method: GET
    path: "/clients/{clientId}"
    description: "Get a client"
    roles: &all_roles [Client, EngagementManager, StaffAppraiser, ReviewAppraiser, MAISigner, RecordsManager, LegalCounsel]
    code: 200
    input: []
    output: Client
    side_effects: []

  # --- Appraisers ---
  - method: POST
    path: "/appraisers"
    description: "Register an appraiser"
    roles: [EngagementManager]
    code: 201
    input: [full_name, designation]
    output: Appraiser
    side_effects: ["license_status = ACTIVE"]
  - method: GET
    path: "/appraisers/{appraiserId}"
    description: "Get an appraiser"
    roles: *all_roles
    code: 200
    input: []
    output: Appraiser
    side_effects: []
  - method: POST
    path: "/appraisers/{appraiserId}/license_status"
    description: "Set license status (ACTIVE | SUSPENDED | EXPIRED); setting the current value is a no-op state error"
    roles: [EngagementManager]
    code: 200
    input: [status]
    output: Appraiser
    side_effects: ["license_status updated; version += 1"]

  # --- Engagements ---
  - method: POST
    path: "/engagements"
    description: "Create an engagement letter in DRAFT"
    roles: [EngagementManager]
    code: 201
    input: [client_id, author_appraiser_id, reviewer_appraiser_id, property_address, property_type, building_sf, intended_use, intended_users, requested_turnaround_days, planned_approach_count, "fee_schedule?", "is_contingent_fee?"]
    output: Engagement
    side_effects: ["complexity_tier and minimum_turnaround_days computed", "status = DRAFT"]
  - method: GET
    path: "/engagements/{engagementId}"
    description: "Get an engagement"
    roles: *all_roles
    code: 200
    input: []
    output: Engagement
    side_effects: []
  - method: GET
    path: "/engagements"
    description: "List engagements with filters"
    roles: *all_roles
    code: 200
    input: ["client_id?", "author_appraiser_id?", "reviewer_appraiser_id?", "status?", "limit?", "offset?"]
    output: "Engagement[]"
    side_effects: []
  - method: POST
    path: "/engagements/{engagementId}/submit"
    description: "Submit the engagement letter to the client (DRAFT -> PENDING_ACCEPTANCE)"
    roles: [EngagementManager]
    code: 200
    input: []
    output: Engagement
    side_effects: ["quoted_fee_cents computed", "submitted_at set"]
  - method: POST
    path: "/engagements/{engagementId}/accept"
    description: "Client accepts the engagement letter (PENDING_ACCEPTANCE -> IN_PROGRESS)"
    roles: [Client]
    code: 200
    input: []
    output: Engagement
    side_effects: ["final_fee_cents locked", "accepted_at and due_date set", "version += 1"]
  - method: POST
    path: "/engagements/{engagementId}/decline"
    description: "Client declines the engagement letter (PENDING_ACCEPTANCE -> DECLINED)"
    roles: [Client]
    code: 200
    input: ["reason?"]
    output: Engagement
    side_effects: []
  - method: POST
    path: "/engagements/{engagementId}/cancel"
    description: "Cancel an engagement (DRAFT | PENDING_ACCEPTANCE | IN_PROGRESS -> CANCELLED)"
    roles: [EngagementManager]
    code: 200
    input: ["reason?"]
    output: Engagement
    side_effects: ["non-terminal reports -> SUPERSEDED"]
  - method: POST
    path: "/engagements/{engagementId}/write_off_fee"
    description: "Write off the final fee of a COMPLETED engagement (compensating billing reversal)"
    roles: [EngagementManager]
    code: 200
    input: []
    output: Engagement
    side_effects: ["Client.total_billed_cents -= final_fee_cents", "volume_discount_tier recomputed", "fee_written_off = true", "version += 1"]
  - method: POST
    path: "/engagements/{engagementId}/litigation-hold"
    description: "Place a litigation hold. IN_PROGRESS engagement -> LITIGATION_HOLD (suspends reports, escalates open revision requests); COMPLETED engagement -> its RetentionRecord enters LITIGATION_HOLD."
    roles: [LegalCounsel]
    code: 200
    input: [matter_reference]
    output: Engagement
    side_effects: ["conditional cascade per state machine"]
  - method: DELETE
    path: "/engagements/{engagementId}/litigation-hold"
    description: "Release the litigation hold; restores reports to pre_hold_status or recomputes the retention deadline"
    roles: [LegalCounsel]
    code: 200
    input: []
    output: Engagement
    side_effects: ["hold release cascade per state machine"]

  # --- Data submissions ---
  - method: POST
    path: "/engagements/{engagementId}/data-submissions"
    description: "Client submits a rent roll / operating statement / tax bill"
    roles: [Client]
    code: 201
    input: [submission_type, period_start, period_end, scheduled_gross_rent_cents, vacancy_loss_cents, expense_reimbursements_cents, operating_expenses_cents]
    output: DataSubmission
    side_effects: ["status = SUBMITTED"]
  - method: GET
    path: "/data-submissions/{submissionId}"
    description: "Get a data submission"
    roles: *all_roles
    code: 200
    input: []
    output: DataSubmission
    side_effects: []
  - method: GET
    path: "/data-submissions"
    description: "List data submissions with filters"
    roles: *all_roles
    code: 200
    input: ["engagement_id?", "submission_type?", "status?", "limit?", "offset?"]
    output: "DataSubmission[]"
    side_effects: []
  - method: POST
    path: "/data-submissions/{submissionId}/accept"
    description: "Author appraiser accepts a submission; NOI variants computed for OPERATING_STATEMENT"
    roles: [StaffAppraiser]
    code: 200
    input: []
    output: DataSubmission
    side_effects: ["noi_trailing_cents / noi_stabilized_cents computed when OPERATING_STATEMENT", "version += 1"]
  - method: POST
    path: "/data-submissions/{submissionId}/reject"
    description: "Author appraiser rejects a submission"
    roles: [StaffAppraiser]
    code: 200
    input: [review_note]
    output: DataSubmission
    side_effects: ["status = REJECTED; review_note recorded", "version += 1"]

  # --- Valuation approaches ---
  - method: POST
    path: "/engagements/{engagementId}/approaches"
    description: "Select a valuation approach (unique approach_type per engagement)"
    roles: [StaffAppraiser]
    code: 201
    input: [approach_type, weight_pct, "cap_rate_bps?", "dcf_holding_period_years?", "dcf_discount_rate_bps?", "dcf_exit_cap_bps?", "revenue_growth_bps_annual?", "land_value_cents?", "replacement_cost_cents?", "depreciation_pct?"]
    output: ValuationApproach
    side_effects: ["status = SELECTED"]
  - method: GET
    path: "/approaches/{approachId}"
    description: "Get a valuation approach"
    roles: *all_roles
    code: 200
    input: []
    output: ValuationApproach
    side_effects: []
  - method: GET
    path: "/approaches"
    description: "List valuation approaches with filters"
    roles: *all_roles
    code: 200
    input: ["engagement_id?", "status?", "limit?", "offset?"]
    output: "ValuationApproach[]"
    side_effects: []
  - method: POST
    path: "/approaches/{approachId}/complete"
    description: "Complete an approach (per-type data gates; computes indicated_value_cents)"
    roles: [StaffAppraiser]
    code: 200
    input: []
    output: ValuationApproach
    side_effects: ["indicated_value_cents computed", "version += 1"]
  - method: POST
    path: "/approaches/{approachId}/exclude"
    description: "Exclude a COMPLETE approach from reconciliation"
    roles: [StaffAppraiser]
    code: 200
    input: []
    output: ValuationApproach
    side_effects: ["status = EXCLUDED", "version += 1"]
  - method: POST
    path: "/approaches/{approachId}/include"
    description: "Re-include an EXCLUDED approach (returns to COMPLETE)"
    roles: [StaffAppraiser]
    code: 200
    input: []
    output: ValuationApproach
    side_effects: ["status = COMPLETE", "version += 1"]

  # --- Comparable sales ---
  - method: POST
    path: "/engagements/{engagementId}/comparables"
    description: "Add a comparable sale (cap-rate / sales-comparison support)"
    roles: [StaffAppraiser]
    code: 201
    input: [address, sale_date, sale_price_cents, noi_at_sale_cents, size_sf, "adjustment_pct?", "selected_for_support?"]
    output: ComparableSale
    side_effects: ["implied_cap_rate_bps and adjusted_cap_rate_bps computed"]
  - method: GET
    path: "/comparables/{comparableId}"
    description: "Get a comparable sale"
    roles: *all_roles
    code: 200
    input: []
    output: ComparableSale
    side_effects: []
  - method: GET
    path: "/comparables"
    description: "List comparable sales with filters"
    roles: *all_roles
    code: 200
    input: ["engagement_id?", "limit?", "offset?"]
    output: "ComparableSale[]"
    side_effects: []

  # --- Reports ---
  - method: POST
    path: "/engagements/{engagementId}/reports"
    description: "Create a new narrative report version (OCC on engagement.version; supersedes prior non-terminal versions)"
    roles: [StaffAppraiser]
    code: 201
    input: [expected_engagement_version]
    output: Report
    side_effects: ["prior non-terminal reports -> SUPERSEDED", "report_version_no assigned", "engagement.version += 1"]
  - method: GET
    path: "/reports/{reportId}"
    description: "Get a report"
    roles: *all_roles
    code: 200
    input: []
    output: Report
    side_effects: []
  - method: GET
    path: "/reports"
    description: "List reports with filters"
    roles: *all_roles
    code: 200
    input: ["engagement_id?", "signer_appraiser_id?", "supersedes_report_id?", "status?", "limit?", "offset?"]
    output: "Report[]"
    side_effects: []
  - method: POST
    path: "/reports/{reportId}/submit_review"
    description: "Submit draft to internal review; computes the reconciled value snapshot"
    roles: [StaffAppraiser]
    code: 200
    input: []
    output: Report
    side_effects: ["value_conclusion_cents computed per reconciled_value", "version += 1"]
  - method: POST
    path: "/reports/{reportId}/review_approve"
    description: "Reviewer approves (INTERNAL_REVIEW -> REVIEWED)"
    roles: [ReviewAppraiser]
    code: 200
    input: []
    output: Report
    side_effects: ["version += 1"]
  - method: POST
    path: "/reports/{reportId}/review_return"
    description: "Reviewer returns the draft for revision (INTERNAL_REVIEW -> DRAFTING)"
    roles: [ReviewAppraiser]
    code: 200
    input: [review_note]
    output: Report
    side_effects: ["review_cycle_count += 1", "version += 1"]
  - method: POST
    path: "/reports/{reportId}/issue_to_client"
    description: "Issue the reviewed draft to the client (REVIEWED -> CLIENT_REVIEW); starts the 30-day revision window"
    roles: [StaffAppraiser]
    code: 200
    input: []
    output: Report
    side_effects: ["issued_to_client_at set", "version += 1"]
  - method: POST
    path: "/reports/{reportId}/reissue"
    description: "Re-issue after addressing revisions (REVISION_REQUESTED -> CLIENT_REVIEW); requires no OPEN requests; restarts the window"
    roles: [StaffAppraiser]
    code: 200
    input: []
    output: Report
    side_effects: ["issued_to_client_at refreshed", "version += 1"]
  - method: POST
    path: "/reports/{reportId}/finalize"
    description: "Finalize the report (CLIENT_REVIEW -> FINAL); requires no OPEN or ESCALATED revision requests"
    roles: [StaffAppraiser]
    code: 200
    input: []
    output: Report
    side_effects: ["version += 1"]
  - method: POST
    path: "/reports/{reportId}/sign"
    description: "MAI-designated appraiser signs (FINAL -> SIGNED); signer must hold MAI designation, ACTIVE license, and not be the author"
    roles: [MAISigner]
    code: 200
    input: []
    output: Report
    side_effects: ["signer_appraiser_id = X-User-ID", "signed_at set", "version += 1"]
  - method: POST
    path: "/reports/{reportId}/deliver"
    description: "Deliver the signed report (SIGNED -> DELIVERED); completes the engagement, bills the client, creates the retention record, locks the workfile"
    roles: [StaffAppraiser, EngagementManager]
    code: 200
    input: []
    output: Report
    side_effects: ["delivered_at set", "engagement -> COMPLETED cascade", "version += 1"]

  # --- Revision requests ---
  - method: POST
    path: "/reports/{reportId}/revision-requests"
    description: "Client submits a revision request on a report in CLIENT_REVIEW (30-day window)"
    roles: [Client]
    code: 201
    input: [category, requested_change, "proposed_value_cents?"]
    output: RevisionRequest
    side_effects: ["status = OPEN", "report -> REVISION_REQUESTED"]
  - method: GET
    path: "/revision-requests/{requestId}"
    description: "Get a revision request"
    roles: *all_roles
    code: 200
    input: []
    output: RevisionRequest
    side_effects: []
  - method: GET
    path: "/revision-requests"
    description: "List revision requests with filters"
    roles: *all_roles
    code: 200
    input: ["report_id?", "status?", "limit?", "offset?"]
    output: "RevisionRequest[]"
    side_effects: []
  - method: POST
    path: "/revision-requests/{requestId}/accept"
    description: "Author accepts an OPEN request (never VALUE_PRESSURE); optional value adjustment; OCC on report.version"
    roles: [StaffAppraiser]
    code: 200
    input: [expected_report_version, resolution_note, "value_adjustment_cents?"]
    output: RevisionRequest
    side_effects: ["status = ACCEPTED", "report.value_conclusion_cents += value_adjustment_cents when provided", "report.version += 1"]
  - method: POST
    path: "/revision-requests/{requestId}/decline"
    description: "Decline a request — author from OPEN, assigned reviewer from ESCALATED"
    roles: [StaffAppraiser, ReviewAppraiser]
    code: 200
    input: [resolution_note]
    output: RevisionRequest
    side_effects: ["status = DECLINED"]
  - method: POST
    path: "/revision-requests/{requestId}/escalate"
    description: "Author escalates an OPEN request to the reviewer"
    roles: [StaffAppraiser]
    code: 200
    input: []
    output: RevisionRequest
    side_effects: ["status = ESCALATED"]
  - method: POST
    path: "/revision-requests/{requestId}/withdraw"
    description: "Client withdraws an OPEN request"
    roles: [Client]
    code: 200
    input: []
    output: RevisionRequest
    side_effects: ["status = WITHDRAWN"]

  # --- Retention records ---
  - method: GET
    path: "/retention-records/{recordId}"
    description: "Get a retention record"
    roles: *all_roles
    code: 200
    input: []
    output: RetentionRecord
    side_effects: []
  - method: GET
    path: "/retention-records"
    description: "List retention records with filters (1:1 with engagement -> array of 0 or 1)"
    roles: *all_roles
    code: 200
    input: ["engagement_id?", "limit?", "offset?"]
    output: "RetentionRecord[]"
    side_effects: []
  - method: POST
    path: "/retention-records/{recordId}/authorize_destruction"
    description: "Authorize destruction once the retention period has elapsed (date(clock) >= retain_until_date)"
    roles: [RecordsManager]
    code: 200
    input: []
    output: RetentionRecord
    side_effects: ["status = RELEASED_PENDING_DESTRUCTION", "version += 1"]
  - method: POST
    path: "/retention-records/{recordId}/confirm_destruction"
    description: "Confirm destruction (RELEASED_PENDING_DESTRUCTION -> DESTROYED)"
    roles: [RecordsManager]
    code: 200
    input: []
    output: RetentionRecord
    side_effects: ["status = DESTROYED", "version += 1"]

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role header missing or malformed" }
  - { id: ERR_FORBIDDEN_FOR_ROLE, http: 403, condition: "Caller role not in the endpoint's roles list" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path id or referenced body FK does not exist" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field, invalid enum member, non-positive amount, period_end < period_start, weight_pct out of 0..100, missing resolution_note" }
  - { id: ERR_NOT_ENGAGEMENT_CLIENT, http: 403, condition: "Client caller is not the engagement's client" }
  - { id: ERR_NOT_ASSIGNED_APPRAISER, http: 403, condition: "StaffAppraiser caller is not the engagement's author appraiser" }
  - { id: ERR_NOT_ASSIGNED_REVIEWER, http: 403, condition: "ReviewAppraiser caller is not the engagement's reviewer appraiser" }
  - { id: ERR_INVALID_STATE_TRANSITION, http: 409, condition: "Target resource is in a state where the transition is not allowed (including accept of an EXPIRED engagement letter)" }
  - { id: ERR_STALE_ENGAGEMENT_VERSION, http: 412, condition: "expected_engagement_version does not match the engagement's current version on report create" }
  - { id: ERR_STALE_REPORT_VERSION, http: 412, condition: "expected_report_version does not match the report's current version on revision accept" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 409, condition: "author_appraiser_id == reviewer_appraiser_id at submit, or signer is the report author at sign" }
  - { id: ERR_CONTINGENT_FEE_PROHIBITED, http: 409, condition: "is_contingent_fee == true at engagement acceptance" }
  - { id: ERR_INDEPENDENCE_COMPROMISE, http: 409, condition: "Accept attempted on a VALUE_PRESSURE revision request" }
  - { id: ERR_SIGNER_NOT_MAI_DESIGNATED, http: 409, condition: "Signer appraiser's designation is not MAI" }
  - { id: ERR_SIGNER_LICENSE_INACTIVE, http: 409, condition: "Signer appraiser's license_status is not ACTIVE" }
  - { id: ERR_TURNAROUND_INFEASIBLE, http: 409, condition: "requested_turnaround_days < minimum_turnaround_days at acceptance" }
  - { id: ERR_WEIGHT_SUM_INVALID, http: 409, condition: "Sum of weight_pct over included COMPLETE approaches != 100.00 at submit_review" }
  - { id: ERR_NO_COMPLETED_APPROACH, http: 409, condition: "No approach in COMPLETE and not EXCLUDED at submit_review" }
  - { id: ERR_DUPLICATE_APPROACH_TYPE, http: 409, condition: "An approach with the same approach_type already exists on the engagement" }
  - { id: ERR_INCOME_DATA_MISSING, http: 409, condition: "INCOME approach completion without any ACCEPTED OPERATING_STATEMENT" }
  - { id: ERR_COMPARABLES_INSUFFICIENT, http: 409, condition: "Approach completion without any selected_for_support comparable" }
  - { id: ERR_CAP_RATE_UNSUPPORTED, http: 409, condition: "|cap_rate_bps - supported_cap_rate_bps| > 25 at INCOME completion" }
  - { id: ERR_DCF_ASSUMPTIONS_INCOMPLETE, http: 409, condition: "Some but not all of the 4 DCF fields present at INCOME completion" }
  - { id: ERR_COST_INPUTS_INCOMPLETE, http: 409, condition: "COST completion without land_value_cents / replacement_cost_cents / depreciation_pct" }
  - { id: ERR_FEE_ALREADY_WRITTEN_OFF, http: 409, condition: "write_off_fee on an engagement whose fee is already written off" }
  - { id: ERR_STATEMENT_PERIOD_OVERLAP, http: 409, condition: "OPERATING_STATEMENT [period_start, period_end] (inclusive) overlaps another non-REJECTED statement on the same engagement" }
  - { id: ERR_APPRAISER_OVERCOMMITTED, http: 409, condition: "Author's half-open [accepted_at, due_date) window overlaps another active engagement's window" }
  - { id: ERR_REVISION_WINDOW_CLOSED, http: 409, condition: "Revision request submitted after issued_to_client_at + 30 days" }
  - { id: ERR_REVISION_REQUESTS_OPEN, http: 409, condition: "reissue with OPEN requests, or finalize with OPEN or ESCALATED requests" }
  - { id: ERR_COMPARABLE_TOO_OLD, http: 409, condition: "sale_date earlier than accepted_at - 24 months" }
  - { id: ERR_RETENTION_PERIOD_NOT_ELAPSED, http: 409, condition: "authorize_destruction before retain_until_date" }

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Client
    description: "Ordering party (e.g., lender). Accepts/declines engagement letters, submits property data, submits and withdraws revision requests. May never edit valuation content directly."
    identity: "entity_backed:Client"
    exclusive_operations:
      - "POST /engagements/{id}/accept"
      - "POST /engagements/{id}/decline"
      - "POST /engagements/{id}/data-submissions"
      - "POST /reports/{id}/revision-requests"
      - "POST /revision-requests/{id}/withdraw"
    shared_operations:
      - "all GET endpoints"
  - name: EngagementManager
    description: "Firm operations manager. Registers clients/appraisers, drafts and submits engagement letters, cancels engagements, writes off fees, manages license status."
    identity: "opaque"
    exclusive_operations:
      - "POST /clients"
      - "POST /appraisers"
      - "POST /appraisers/{id}/license_status"
      - "POST /engagements"
      - "POST /engagements/{id}/submit"
      - "POST /engagements/{id}/cancel"
      - "POST /engagements/{id}/write_off_fee"
    shared_operations:
      - "POST /reports/{id}/deliver (shared with StaffAppraiser)"
      - "POST /_clock/set_current_utc (shared with RecordsManager, LegalCounsel)"
      - "all GET endpoints"
  - name: StaffAppraiser
    description: "Production appraiser (the engagement author). Gathers/verifies data, develops approaches and comparables, drafts reports, resolves client revision requests within independence limits."
    identity: "entity_backed:Appraiser"
    exclusive_operations:
      - "POST /data-submissions/{id}/accept"
      - "POST /data-submissions/{id}/reject"
      - "POST /engagements/{id}/approaches and approach complete/exclude/include"
      - "POST /engagements/{id}/comparables"
      - "POST /engagements/{id}/reports"
      - "POST /reports/{id}/submit_review, issue_to_client, reissue, finalize"
      - "POST /revision-requests/{id}/accept, escalate"
    shared_operations:
      - "POST /reports/{id}/deliver (shared with EngagementManager)"
      - "POST /revision-requests/{id}/decline (from OPEN; shared with ReviewAppraiser from ESCALATED)"
      - "all GET endpoints"
  - name: ReviewAppraiser
    description: "Internal review appraiser (the engagement reviewer). Approves or returns drafts; resolves escalated revision requests. Segregation: reviewer != author enforced at submit."
    identity: "entity_backed:Appraiser"
    exclusive_operations:
      - "POST /reports/{id}/review_approve"
      - "POST /reports/{id}/review_return"
    shared_operations:
      - "POST /revision-requests/{id}/decline (from ESCALATED)"
      - "all GET endpoints"
  - name: MAISigner
    description: "MAI-designated signatory. Only role allowed to sign reports; designation == MAI, ACTIVE license, and != author enforced at sign."
    identity: "entity_backed:Appraiser"
    exclusive_operations:
      - "POST /reports/{id}/sign"
    shared_operations:
      - "all GET endpoints"
  - name: RecordsManager
    description: "Workfile custodian. Authorizes and confirms destruction of retention records."
    identity: "opaque"
    exclusive_operations:
      - "POST /retention-records/{id}/authorize_destruction"
      - "POST /retention-records/{id}/confirm_destruction"
    shared_operations:
      - "POST /_clock/set_current_utc (shared)"
      - "all GET endpoints"
  - name: LegalCounsel
    description: "Firm legal counsel. Places and releases litigation holds on engagements / retention records."
    identity: "opaque"
    exclusive_operations:
      - "POST /engagements/{id}/litigation-hold"
      - "DELETE /engagements/{id}/litigation-hold"
    shared_operations:
      - "POST /_clock/set_current_utc (shared)"
      - "all GET endpoints"
