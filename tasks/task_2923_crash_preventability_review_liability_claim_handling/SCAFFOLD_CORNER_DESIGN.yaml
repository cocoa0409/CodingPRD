              captures: { cv4: $.data.version, rev2: $.data.revised_reserve_cents }
          assert:
            - "${rv1} > ${rc_v_created} — open-deliberation is itself a write and bumps ReviewCase.version, so the ballot version is taken from the transition response and not from creation"
            - "${rv2} == ${rv1} + 1 and ${seq2} == ${seq1} + 1 — an accepted ballot increments both the version and next_vote_sequence"
            - "${e_rc_stale} == ERR_REVIEW_CASE_VERSION_STALE with HTTP 412 — cm-002 quoted ${rv1}, which cm-001's ballot had already superseded"
            - "${rv_after_conflict} == ${rv2} and ${seq_after_conflict} == ${seq2}, and ${vote_page} has exactly 1 row — the refused ballot minted no sequence number and created no CommitteeVote"
            - "${rv3} == ${rv2} + 1 — the same body succeeds once cm-002 re-reads the version"
            - "${prov} == 500000 with ${rstat1} == PROVISIONAL — MINOR base 500,000 at multiplier 1.00, above the 250,000 floor"
            - "${rev1} == ${out1} == 500000 with ${rstat2} == REVISED and ${cv2} == ${cv1} + 1"
            - "${e_cl_stale} == ERR_CLAIM_VERSION_STALE with HTTP 412 on the replayed ${cv1}"
            - "${cv_after_conflict} == ${cv2}, ${rev_after_conflict} == 500000, ${out_after_conflict} == 500000 and ${rstat_after_conflict} == REVISED — the conflict left revised_reserve_cents, outstanding_reserve_cents, reserve_status and version all untouched, which is what makes an absolute overwrite safe to retry"
            - "${e_cascade_stale} == ERR_CLAIM_VERSION_STALE — recording ${dm_id} moved handling_status and bumped Claim.version, so a revision prepared against ${cv_after_conflict} is stale even though no other revision ran; the guard is a version guard, not a same-endpoint guard"
            - "${hs_after_demand} == NEGOTIATION with ${cv3} == ${cv2} + 1, and ${cv4} == ${cv3} + 1 with ${rev2} == 500000 — the unrepresented property demand adds no litigation-risk points, so the refreshed figure is unchanged and only the version moved"

      - name: preventable_determination_cascades_four_levels_in_one_call
        claim_type: cascading_side_effects
        grounds:
          - endpoints[POST /review-cases/{id}/decide]
          - complexity_profile.complexity_layers
        distinguishing_aspect: "One decide call must walk ReviewCase to Crash to Driver to Terminal and leave every derived counter on that chain consistent."
        excluded_because:
          difficulty_instance: decide_preventable_cascade_depth4_terminal_risk_tier
          rationale: "That §1.8 instance verifies the full four-level chain end to end from a single decide call, including the Terminal risk_tier that only moves at the deepest level, which is the entire cascading_side_effects claim for this scaffold."

      - name: the_two_reserve_variants_disagree_on_the_same_claim
        claim_type: dual_variant_calculation
        grounds:
          - calculations.claim_reserve.variants
          - complexity_profile.complexity_layers
        distinguishing_aspect: "PROVISIONAL_REFRESH and DEMAND_BASED must produce different reserves from identical stored data, and the switch must move the ledger by exactly the delta."
        excluded_because:
          difficulty_instance: claim_reserve_provisional_refresh_vs_demand_based
          rationale: "That §1.8 instance runs both variants against one claim, checks the delta on outstanding_reserve_cents and pins the ERR_NO_DEMANDS_TO_WEIGHT boundary of the demand-based variant."

      - name: the_terminal_risk_tier_flips_only_at_its_rate_boundary
        claim_type: rate_threshold_triggers
        grounds:
          - calculations.terminal_crash_rate.constants
          - complexity_profile.complexity_layers
        distinguishing_aspect: "The ELEVATED and CRITICAL tiers must trigger at exactly 1.500 and 3.000 crashes per million miles and not one thousandth earlier."
        excluded_because:
          difficulty_instance: decide_preventable_cascade_depth4_terminal_risk_tier
          rationale: "That §1.8 instance sits the terminal one preventable crash below the tier boundary and crosses it with the decide call under test, which is the boundary half of the rate_threshold_triggers claim; the staffing-posture ratio boundary is covered by staffing_posture_threshold_at_exactly_one_fifth in this file."

  # =========================================================================
  - section: consistency_model
    instances:

      - name: every_derived_field_is_already_current_in_the_writing_response
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - response_envelope
        distinguishing_aspect: "No derived value in this API is ever backfilled: the response body of the write that causes a change already carries the recomputed field, and an immediately following read agrees with it."
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z. Empty database."
          setup_api_calls:
            - call: "POST /terminals"
              payload: { name: "Ravenna Terminal", terminal_code: "RAV03", region_code: "OH", annual_miles_millions: 2.0 }
              as: SafetyAdmin
              as_user_id: "sa-001"
              captures: { t_id: $.data.id, act0: $.data.active_driver_count, post0: $.data.staffing_posture }
          trigger:
            - call: "POST /drivers"
              payload: { terminal_id: "${t_id}", employee_code: "D-6601", full_name: "Pelle Ostergaard", cdl_number: "OH-CDL-6601", hire_date: "2013-05-05" }
              as: SafetyAdmin
              as_user_id: "sa-001"
              captures: { d_id: $.data.id, band: $.data.tenure_band, pts0: $.data.preventable_points, tier0: $.data.required_action_tier }
            - call: "GET /terminals/${t_id}"
              payload: {}
              as: SafetyAdmin
              as_user_id: "sa-001"
              captures: { act1: $.data.active_driver_count, post1: $.data.staffing_posture }
            - call: "POST /crashes"
              payload: { driver_id: "${d_id}", terminal_id: "${t_id}", occurred_at: "2026-07-31T20:00:00Z", notified_at: "2026-07-31T20:30:00Z", location_text: "SR-14 at the quarry", severity: "MINOR", route_class: "REGIONAL", tow_away: true, tow_reason: "DISABLING_DAMAGE", injury_transported_count: 0, fatality_count: 0, hazmat_release: false, mechanical_factor: false, third_party_at_fault: false }
              as: Dispatcher
              as_user_id: "disp-001"
              captures: { c_id: $.data.id, rec_now: $.data.dot_recordable, codes_now: $.data.recordability_codes, due_now: $.data.report_due_at, posture_now: $.data.evidence_posture, prev_now: $.data.preventability_status, rs_now: $.data.reporting_status }
            - call: "GET /crashes/${c_id}"
              payload: {}
              as: Auditor
              as_user_id: "aud-001"
              captures: { rec_read: $.data.dot_recordable, due_read: $.data.report_due_at, posture_read: $.data.evidence_posture }
            - call: "POST /crashes/${c_id}/evidence-items"
              payload: { kind: "TELEMATICS_SNAPSHOT", source_device_id: "ECM-6601", window_start_at: "2026-07-31T19:00:00Z", window_end_at: "2026-07-31T21:00:00Z", retention_deadline_at: "2027-06-30T00:00:00Z" }
              as: Dispatcher
              as_user_id: "disp-001"
              captures: { ev_id: $.data.id, ev_state: $.data.preservation_state }
            - call: "GET /crashes/${c_id}"
              payload: {}
              as: Auditor
              as_user_id: "aud-001"
              captures: { posture_requested: $.data.evidence_posture }
            - call: "POST /evidence-items/${ev_id}/preserve"
              payload: { preserved_copy_uri: "s3://evidence/2923rav/ecm-6601.json", evidence_hash: "9a9a0b0b1c1c2d2d3e3e4f4f5a5a6b6b" }
              as: Dispatcher
              as_user_id: "disp-001"
              captures: { ev_state2: $.data.preservation_state }
            - call: "GET /crashes/${c_id}"
              payload: {}
              as: Auditor
              as_user_id: "aud-001"
              captures: { posture_preserved: $.data.evidence_posture }
            - call: "POST /claims"
              payload: { crash_id: "${c_id}", claimant_notice_date: "2026-08-01" }
              as: ClaimsAdjuster
              as_user_id: "adj-001"
              captures: { cl_id: $.data.id, score_now: $.data.litigation_risk_score, counsel_now: $.data.counsel_required, prov_now: $.data.provisional_reserve_cents, out_now: $.data.outstanding_reserve_cents, inc_now: $.data.total_incurred_cents, exp_now: $.data.claim_exposure_cents }
            - call: "GET /claims/${cl_id}"
              payload: {}
              as: Auditor
              as_user_id: "aud-001"
              captures: { score_read: $.data.litigation_risk_score, prov_read: $.data.provisional_reserve_cents, inc_read: $.data.total_incurred_cents }
          assert:
            - "${act0} == 0 and ${post0} == OK on a terminal with no drivers, then ${act1} == 1 and ${post1} == OK immediately after ${d_id} is created — the headcount is not eventually consistent"
            - "${band} == OVER_36_MONTHS, ${pts0} == 0.0 and ${tier0} == NONE in the driver's own create response — the derived fields are computed in the same request, not on first read"
            - "${rec_now} == true with ${codes_now} == [DISABLING_TOW], ${due_now} == 2026-08-03T20:00:00Z, ${rs_now} == PENDING_FILING, ${posture_now} == PARTIAL and ${prev_now} == REPORTED, all in the POST /crashes response body"
            - "${rec_read} == ${rec_now}, ${due_read} == ${due_now} and ${posture_read} == ${posture_now} — the immediately following read repeats the create response exactly"
            - "${ev_state} == REQUESTED and ${posture_requested} == PARTIAL — merely requesting evidence does not satisfy the MINOR requirement of a PRESERVED telematics snapshot"
            - "${ev_state2} == PRESERVED and ${posture_preserved} == COMPLETE on the very next read — the crash's derived posture moves within the same request that preserved the item, with no reconciliation pass in between"
            - "${score_now} == 10 (UNDER_REVIEW is not yet in play, so REPORTED 5 plus COMPLETE posture 0 plus nothing else), ${counsel_now} == false, ${prov_now} == ${out_now} == 500000, ${inc_now} == 500000 and ${exp_now} == 500000 — every computed money field is populated in the creating response"
            - "${score_read} == ${score_now}, ${prov_read} == ${prov_now} and ${inc_read} == ${inc_now} — reads never disagree with the write that produced them, and the envelope of every one of these responses carries meta, response_type and data with no pending or stale marker anywhere"
