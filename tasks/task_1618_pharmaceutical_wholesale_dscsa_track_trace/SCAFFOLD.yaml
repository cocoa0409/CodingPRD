scenario: |
  Pharmaceutical Wholesale & DSCSA Track-and-Trace (Cencora/Cardinal wholesale): transaction information/history exchange & EPCIS event capture, serialized case & unit aggregation, suspect-product investigation & quarantine, licensing verification per state & shipping restriction, cold-chain & controlled-item segregation, chargeback & 340B contract price handling, returns processing & credit, shortage allocation fairness

domain_name: pharma-wholesale-dscsa
api_prefix: /wholesale

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: quota_allocation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
  entity_topology: flat
  state_machine_shape: cyclic
  relationship_patterns:
    - one_to_many
    - cross_aggregate
    - self_referential
  role_model: segregation_of_duties
  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: TradingPartner
    parent: null
    common_fields: true
    fields:
      - { name: partner_name, type: string, source: input, description: "Legal name of pharmacy, hospital, or upstream supplier" }
      - { name: partner_kind, type: enum, source: input, description: "CUSTOMER | SUPPLIER", constraints: "One of CUSTOMER, SUPPLIER" }
      - { name: dea_number, type: string, source: input, description: "DEA registration number; required when partner orders controlled substances" }
      - { name: credit_limit_cents, type: integer, source: input, description: "Maximum open receivable balance in cents; non-negative" }
      - { name: open_receivable_cents, type: integer, source: computed, default: 0, description: "Sum over PurchaseOrder of invoice_balance_cents where financial_status IN {INVOICED, PARTIALLY_PAID}" }
      - { name: allocation_watermark_units, type: integer, source: computed, default: 0, description: "Rolling historical-usage watermark used for shortage allocation fairness; maintained per Product via AllocationPolicy" }

  - name: PartnerStateLicense
    parent: null
    common_fields: true
    fields:
      - { name: partner_id, type: string, source: input, description: "FK -> TradingPartner.id; the licensed partner" }
      - { name: state_code, type: string, source: input, description: "Two-letter US state code of licensure" }
      - { name: license_number, type: string, source: input, description: "State-issued license number" }
      - { name: license_scope, type: enum, source: input, description: "RX_ONLY | RX_AND_CONTROLLED | RX_AND_COLD_CHAIN | FULL", constraints: "One of RX_ONLY, RX_AND_CONTROLLED, RX_AND_COLD_CHAIN, FULL" }
      - { name: valid_from, type: datetime, source: input, description: "License validity start (ISO 8601, inclusive)" }
      - { name: valid_to, type: datetime, source: input, description: "License validity end (ISO 8601, inclusive); must be strictly after valid_from" }
      - { name: license_status, type: enum, source: system, description: "ACTIVE | SUSPENDED | REVOKED", constraints: "ACTIVE on creation; SUSPENDED/REVOKED via licensing actions", default: "ACTIVE" }

  - name: Product
    parent: null
    common_fields: true
    fields:
      - { name: ndc, type: string, source: input, description: "National Drug Code (11-digit canonical form); unique across Products" }
      - { name: product_name, type: string, source: input, description: "Label name" }
      - { name: is_controlled, type: boolean, source: input, description: "True when DEA schedule II-V; requires controlled-license scope and segregation" }
      - { name: is_cold_chain, type: boolean, source: input, description: "True when 2-8C storage required; requires cold-chain segregation and cold-capable license scope" }
      - { name: wholesale_acquisition_cost_cents, type: integer, source: input, description: "WAC list price per unit in cents; non-negative" }
      - { name: is_340b_contracted, type: boolean, source: input, description: "True when a 340B contract price exists for covered entities", default: false }
      - { name: contract_340b_price_cents, type: integer, source: input, description: "340B contract price per unit in cents; required when is_340b_contracted, else null" }
      - { name: shortage_status, type: enum, source: system, description: "NORMAL | SHORTAGE", constraints: "NORMAL on creation; SHORTAGE via shortage actions", default: "NORMAL" }

  - name: AllocationPolicy
    parent: null
    common_fields: true
    fields:
      - { name: product_id, type: string, source: input, description: "FK -> Product.id; the shortage-managed product" }
      - { name: pool_units, type: integer, source: input, description: "Total allocatable units in the current shortage epoch; non-negative" }
      - { name: remaining_units, type: integer, source: computed, description: "pool_units minus units already allocated under this policy; never negative" }
      - { name: policy_mode, type: enum, source: input, description: "PRO_RATA | EQUAL_SHARE", constraints: "One of PRO_RATA, EQUAL_SHARE" }
      - { name: min_guarantee_units, type: integer, source: input, description: "Per-customer floor granted before pro-rata division; non-negative", default: 0 }
      - { name: policy_status, type: enum, source: system, description: "OPEN | EXHAUSTED | CLOSED", constraints: "OPEN on creation", default: "OPEN" }

  - name: SerializedCase
    parent: null
    common_fields: true
    fields:
      - { name: sscc, type: string, source: input, description: "Serialized Shipping Container Code; unique" }
      - { name: product_id, type: string, source: input, description: "FK -> Product.id; product contained (single-NDC cases only)" }
      - { name: lot_number, type: string, source: input, description: "Manufacturer lot/batch number" }
      - { name: expiry_date, type: datetime, source: input, description: "Lot expiry (ISO 8601 date-time); shipping past current logical time is forbidden" }
      - { name: case_status, type: enum, source: system, description: "COMMISSIONED | SHIPPED | RECEIVED | QUARANTINED | DECOMMISSIONED", constraints: "COMMISSIONED on creation", default: "COMMISSIONED" }
      - { name: quarantine_link_id, type: string, source: computed, description: "id of the SuspectInvestigation that quarantined this case; null when not quarantined" }

  - name: SerializedUnit
    parent: null
    common_fields: true
    fields:
      - { name: sni, type: string, source: input, description: "Serialized Numeric Identifier (GTIN+serial); unique" }
      - { name: case_id, type: string, source: input, description: "FK -> SerializedCase.id; aggregating parent case (self-consistent aggregation tree)" }
      - { name: unit_status, type: enum, source: system, description: "COMMISSIONED | SHIPPED | RECEIVED | QUARANTINED | DECOMMISSIONED", constraints: "COMMISSIONED on creation", default: "COMMISSIONED" }

  - name: PurchaseOrder
    parent: null
    common_fields: true
    fields:
      - { name: customer_id, type: string, source: input, description: "FK -> TradingPartner.id; must reference a partner whose partner_kind == CUSTOMER" }
      - { name: ship_to_state, type: string, source: input, description: "Destination state code driving licensing verification" }
      - { name: fulfillment_status, type: enum, source: system, description: "DRAFT | CONFIRMED | ALLOCATED | SHIPPED | DELIVERED | CANCELLED", constraints: "DRAFT on creation", default: "DRAFT" }
      - { name: financial_status, type: enum, source: system, description: "UNBILLED | INVOICED | PARTIALLY_PAID | PAID | CREDITED", constraints: "UNBILLED on creation; parallel dimension independent of fulfillment_status", default: "UNBILLED" }
      - { name: invoice_total_cents, type: integer, source: computed, default: 0, description: "Sum of OrderLine.extended_price_cents, computed at CONFIRMED and refreshed on allocation" }
      - { name: invoice_balance_cents, type: integer, source: computed, default: 0, description: "invoice_total_cents minus posted payments and credits" }
      - { name: is_340b_order, type: boolean, source: input, description: "True when the customer buys against a 340B contract price", default: false }

  - name: OrderLine
    parent: null
    common_fields: true
    fields:
      - { name: order_id, type: string, source: system, description: "FK -> PurchaseOrder.id; owning order, bound from the creation path" }
      - { name: product_id, type: string, source: input, description: "FK -> Product.id; ordered product" }
      - { name: quantity_requested, type: integer, source: input, description: "Units requested; strictly positive" }
      - { name: quantity_allocated, type: integer, source: computed, default: 0, description: "Units allocated under shortage policy or full allocation; 0..quantity_requested" }
      - { name: unit_price_cents, type: integer, source: computed, description: "WAC or 340B contract price chosen by pricing calculation at CONFIRMED" }
      - { name: extended_price_cents, type: integer, source: computed, description: "= quantity_allocated * unit_price_cents, recomputed on allocation" }
      - { name: line_status, type: enum, source: system, description: "PENDING | ALLOCATED | PARTIALLY_ALLOCATED | UNFULFILLABLE", constraints: "PENDING on creation", default: "PENDING" }

  - name: EpcisEvent
    parent: null
    common_fields: false
    fields:
      - { name: event_type, type: enum, source: input, description: "COMMISSION | AGGREGATE | SHIP | RECEIVE | QUARANTINE | RELEASE | DECOMMISSION", constraints: "One of the seven enumerated EPCIS event types" }
      - { name: subject_case_id, type: string, source: input, description: "FK -> SerializedCase.id; case the event applies to" }
      - { name: order_id, type: string, source: input, description: "FK -> PurchaseOrder.id; required for SHIP events, optional otherwise" }
      - { name: event_time, type: datetime, source: input, description: "Business timestamp of the physical event; must be <= current logical clock" }
      - { name: recorded_at, type: datetime, source: system, description: "Server-stamped capture time (current logical clock)" }
      - { name: sender_partner_id, type: string, source: input, description: "FK -> TradingPartner.id; sender in the transaction information exchange" }
      - { name: recipient_partner_id, type: string, source: input, description: "FK -> TradingPartner.id; recipient in the transaction information exchange" }
      - { name: txn_history_hash, type: string, source: computed, description: "SHA-256-style digest string chaining prior events for the same case; empty string for the first event" }

  - name: SuspectInvestigation
    parent: null
    common_fields: true
    fields:
      - { name: case_id, type: string, source: input, description: "FK -> SerializedCase.id; suspect case under investigation" }
      - { name: opened_reason, type: string, source: input, description: "Reason the product was flagged suspect" }
      - { name: investigation_status, type: enum, source: system, description: "OPEN | QUARANTINED | CLEARED | CONFIRMED_ILLEGITIMATE", constraints: "OPEN on creation", default: "OPEN" }
      - { name: reopen_count, type: integer, source: system, default: 0, description: "Number of times the investigation has been reopened from CLEARED" }
      - { name: quarantined_by_user_id, type: string, source: system, description: "X-User-ID of the QualityAssuranceLead who performed the quarantine; segregation-of-duties checks compare against it on clear/confirm" }

  - name: ChargebackClaim
    parent: null
    common_fields: true
    fields:
      - { name: order_id, type: string, source: input, description: "FK -> PurchaseOrder.id; the 340B order being reconciled" }
      - { name: claimed_amount_cents, type: integer, source: input, description: "Distributor's chargeback amount claimed from the manufacturer; strictly positive" }
      - { name: computed_amount_cents, type: integer, source: computed, description: "Server-computed chargeback per calculation rule chargeback_amount" }
      - { name: claim_status, type: enum, source: system, description: "SUBMITTED | VALIDATED | SETTLED | DENIED", constraints: "SUBMITTED on creation", default: "SUBMITTED" }

  - name: ReturnAuthorization
    parent: null
    common_fields: true
    fields:
      - { name: order_id, type: string, source: input, description: "FK -> PurchaseOrder.id; original sale being returned against" }
      - { name: product_id, type: string, source: input, description: "FK -> Product.id; returned product" }
      - { name: quantity_returned, type: integer, source: input, description: "Units returned; strictly positive" }
      - { name: return_status, type: enum, source: system, description: "REQUESTED | RECEIVED | CREDITED | REJECTED", constraints: "REQUESTED on creation", default: "REQUESTED" }
      - { name: credit_amount_cents, type: integer, source: computed, default: 0, description: "Credit issued per return_credit calculation once CREDITED" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: PartnerStateLicense
    initial_state: ACTIVE
    terminal_states: [REVOKED]
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /wholesale/partner-state-licenses/{licenseId}/suspend"
        actor: ComplianceOfficer
        preconditions:
          - "License must be ACTIVE (ERR_LICENSE_NOT_ACTIVE)"
        side_effects:
          - "license_status -> SUSPENDED"
          - "increments PartnerStateLicense.version by 1"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /wholesale/partner-state-licenses/{licenseId}/reinstate"
        actor: ComplianceOfficer
        preconditions:
          - "License must be SUSPENDED (ERR_LICENSE_NOT_SUSPENDED)"
          - "Current logical clock must be <= valid_to (ERR_LICENSE_EXPIRED)"
        side_effects:
          - "license_status -> ACTIVE"
          - "increments PartnerStateLicense.version by 1"
      - from: ACTIVE
        to: REVOKED
        trigger: "POST /wholesale/partner-state-licenses/{licenseId}/revoke"
        actor: ComplianceOfficer
        preconditions:
          - "License must be ACTIVE or SUSPENDED (ERR_LICENSE_ALREADY_REVOKED)"
        side_effects:
          - "license_status -> REVOKED"
          - "increments PartnerStateLicense.version by 1"
      - from: SUSPENDED
        to: REVOKED
        trigger: "POST /wholesale/partner-state-licenses/{licenseId}/revoke"
        actor: ComplianceOfficer
        preconditions:
          - "License must be ACTIVE or SUSPENDED (ERR_LICENSE_ALREADY_REVOKED)"
        side_effects:
          - "license_status -> REVOKED"
          - "increments PartnerStateLicense.version by 1"

  - entity: SerializedCase
    initial_state: COMMISSIONED
    terminal_states: [DECOMMISSIONED]
    transitions:
      - from: COMMISSIONED
        to: SHIPPED
        trigger: "POST /wholesale/epcis-events with event_type=SHIP"
        actor: WarehouseOperator
        preconditions:
          - "Case must be COMMISSIONED (ERR_CASE_NOT_SHIPPABLE)"
          - "Case expiry_date must be strictly after current logical clock (ERR_PRODUCT_EXPIRED)"
        side_effects:
          - "case_status -> SHIPPED"
          - "Every SerializedUnit with case_id == this case moves COMMISSIONED -> SHIPPED"
          - "increments SerializedCase.version by 1"
      - from: SHIPPED
        to: RECEIVED
        trigger: "POST /wholesale/epcis-events with event_type=RECEIVE"
        actor: WarehouseOperator
        preconditions:
          - "Case must be SHIPPED (ERR_CASE_NOT_IN_TRANSIT)"
        side_effects:
          - "case_status -> RECEIVED"
          - "Every SerializedUnit with case_id == this case moves SHIPPED -> RECEIVED"
          - "increments SerializedCase.version by 1"
      - from: COMMISSIONED
        to: QUARANTINED
        trigger: "system (cascade from SuspectInvestigation OPEN -> QUARANTINED)"
        actor: system
        preconditions:
          - "Case must be COMMISSIONED, SHIPPED, or RECEIVED (ERR_CASE_NOT_QUARANTINABLE)"
        side_effects:
          - "case_status -> QUARANTINED"
          - "quarantine_link_id set to the investigation id"
          - "Every SerializedUnit with case_id == this case and unit_status != DECOMMISSIONED moves to QUARANTINED"
          - "increments SerializedCase.version by 1"
      - from: SHIPPED
        to: QUARANTINED
        trigger: "system (cascade from SuspectInvestigation OPEN -> QUARANTINED)"
        actor: system
        preconditions:
          - "Case must be COMMISSIONED, SHIPPED, or RECEIVED (ERR_CASE_NOT_QUARANTINABLE)"
        side_effects:
          - "case_status -> QUARANTINED"
          - "quarantine_link_id set to the investigation id"
          - "Every SerializedUnit with case_id == this case and unit_status != DECOMMISSIONED moves to QUARANTINED"
          - "increments SerializedCase.version by 1"
      - from: RECEIVED
        to: QUARANTINED
        trigger: "system (cascade from SuspectInvestigation OPEN -> QUARANTINED)"
        actor: system
        preconditions:
          - "Case must be COMMISSIONED, SHIPPED, or RECEIVED (ERR_CASE_NOT_QUARANTINABLE)"
        side_effects:
          - "case_status -> QUARANTINED"
          - "quarantine_link_id set to the investigation id"
          - "Every SerializedUnit with case_id == this case and unit_status != DECOMMISSIONED moves to QUARANTINED"
          - "increments SerializedCase.version by 1"
      - from: QUARANTINED
        to: RECEIVED
        trigger: "system (cascade from SuspectInvestigation QUARANTINED -> CLEARED; release restores pre-quarantine state RECEIVED when the case was quarantined from RECEIVED, else COMMISSIONED)"
        actor: system
        preconditions:
          - "Case must be QUARANTINED (ERR_CASE_NOT_QUARANTINED)"
        side_effects:
          - "case_status restored per release rule"
          - "quarantine_link_id cleared to null"
          - "Every SerializedUnit with case_id == this case and unit_status == QUARANTINED moves to the same restored status"
          - "increments SerializedCase.version by 1"
      - from: QUARANTINED
        to: DECOMMISSIONED
        trigger: "system (cascade from SuspectInvestigation QUARANTINED -> CONFIRMED_ILLEGITIMATE)"
        actor: system
        preconditions:
          - "Case must be QUARANTINED (ERR_CASE_NOT_QUARANTINED)"
        side_effects:
          - "case_status -> DECOMMISSIONED"
          - "Every SerializedUnit with case_id == this case and unit_status == QUARANTINED moves to DECOMMISSIONED"
          - "increments SerializedCase.version by 1"
      - from: COMMISSIONED
        to: DECOMMISSIONED
        trigger: "POST /wholesale/epcis-events with event_type=DECOMMISSION"
        actor: WarehouseOperator
        preconditions:
          - "Case must be COMMISSIONED (ERR_CASE_NOT_SHIPPABLE)"
        side_effects:
          - "case_status -> DECOMMISSIONED"
          - "Every SerializedUnit with case_id == this case moves COMMISSIONED -> DECOMMISSIONED"
          - "increments SerializedCase.version by 1"

  - entity: PurchaseOrder
    initial_state: DRAFT
    terminal_states: [CANCELLED, DELIVERED]
    transitions:
      - from: DRAFT
        to: CONFIRMED
        trigger: "POST /wholesale/purchase-orders/{orderId}/confirm"
        actor: OrderManager
        preconditions:
          - "Order must be DRAFT (ERR_ORDER_NOT_DRAFT)"
          - "At least one OrderLine exists for the order (ERR_ORDER_EMPTY)"
          - "Customer TradingPartner must hold a PartnerStateLicense for ship_to_state with license_status == ACTIVE and valid_to >= current logical clock (ERR_LICENSE_VERIFICATION_FAILED)"
          - "If any OrderLine product is_controlled: the license license_scope must be in {RX_AND_CONTROLLED, FULL} (ERR_CONTROLLED_LICENSE_REQUIRED)"
          - "If any OrderLine product is_cold_chain: the license license_scope must be in {RX_AND_COLD_CHAIN, FULL} (ERR_COLD_CHAIN_LICENSE_REQUIRED)"
          - "Projected open_receivable_cents after this invoice must be <= customer credit_limit_cents (ERR_CREDIT_LIMIT_EXCEEDED)"
        side_effects:
          - "fulfillment_status -> CONFIRMED"
          - "unit_price_cents computed per order_line_pricing for every OrderLine"
          - "invoice_total_cents and invoice_balance_cents recomputed"
          - "financial_status -> INVOICED"
          - "customer.open_receivable_cents += invoice_total_cents"
          - "increments PurchaseOrder.version by 1"
      - from: CONFIRMED
        to: ALLOCATED
        trigger: "system (automatic when allocation runs and every OrderLine has quantity_allocated == quantity_requested)"
        actor: system
        preconditions:
          - "Order must be CONFIRMED"
        side_effects:
          - "fulfillment_status -> ALLOCATED"
          - "increments PurchaseOrder.version by 1"
      - from: CONFIRMED
        to: SHIPPED
        trigger: "POST /wholesale/purchase-orders/{orderId}/ship"
        actor: WarehouseOperator
        preconditions:
          - "Order must be CONFIRMED or ALLOCATED (ERR_ORDER_NOT_SHIPPABLE)"
          - "Every OrderLine must have quantity_allocated > 0 (ERR_LINES_UNALLOCATED)"
          - "case_ids must be non-empty and every listed case must be COMMISSIONED with a product matching some line's product_id (ERR_CASE_NOT_SHIPPABLE)"
          - "The ship request's segregation_mode must cover every line's segregation class (ERR_SEGREGATION_REQUIRED)"
          - "No case in case_ids is QUARANTINED or under an OPEN/QUARANTINED SuspectInvestigation (ERR_PRODUCT_UNDER_INVESTIGATION)"
        side_effects:
          - "fulfillment_status -> SHIPPED"
          - "Each case in case_ids transitions COMMISSIONED -> SHIPPED (units follow) and is bound to the order"
          - "A SHIP EpcisEvent is appended for each shipped case bound to the order"
          - "increments PurchaseOrder.version by 1"
      - from: ALLOCATED
        to: SHIPPED
        trigger: "POST /wholesale/purchase-orders/{orderId}/ship"
        actor: WarehouseOperator
        preconditions:
          - "Order must be CONFIRMED or ALLOCATED (ERR_ORDER_NOT_SHIPPABLE)"
          - "Every OrderLine must have quantity_allocated > 0 (ERR_LINES_UNALLOCATED)"
          - "case_ids must be non-empty and every listed case must be COMMISSIONED with a product matching some line's product_id (ERR_CASE_NOT_SHIPPABLE)"
          - "segregation_mode must cover every line's segregation class (ERR_SEGREGATION_REQUIRED)"
          - "No case in case_ids is QUARANTINED or under an OPEN/QUARANTINED SuspectInvestigation (ERR_PRODUCT_UNDER_INVESTIGATION)"
        side_effects:
          - "fulfillment_status -> SHIPPED"
          - "Each case in case_ids transitions COMMISSIONED -> SHIPPED (units follow) and is bound to the order"
          - "A SHIP EpcisEvent is appended for each shipped case bound to the order"
          - "increments PurchaseOrder.version by 1"
      - from: SHIPPED
        to: DELIVERED
        trigger: "POST /wholesale/purchase-orders/{orderId}/deliver"
        actor: WarehouseOperator
        preconditions:
          - "Order must be SHIPPED (ERR_ORDER_NOT_SHIPPED)"
        side_effects:
          - "fulfillment_status -> DELIVERED"
          - "increments PurchaseOrder.version by 1"
      - from: DRAFT
        to: CANCELLED
        trigger: "POST /wholesale/purchase-orders/{orderId}/cancel"
        actor: OrderManager
        preconditions:
          - "Order must be DRAFT or CONFIRMED (ERR_ORDER_NOT_CANCELLABLE)"
        side_effects:
          - "fulfillment_status -> CANCELLED"
          - "increments PurchaseOrder.version by 1"
      - from: CONFIRMED
        to: CANCELLED
        trigger: "POST /wholesale/purchase-orders/{orderId}/cancel"
        actor: OrderManager
        preconditions:
          - "Order must be DRAFT or CONFIRMED (ERR_ORDER_NOT_CANCELLABLE)"
        side_effects:
          - "fulfillment_status -> CANCELLED"
          - "If financial_status == INVOICED: financial_status -> CREDITED, customer.open_receivable_cents -= invoice_balance_cents, invoice_balance_cents -> 0"
          - "Release allocated units back to the AllocationPolicy that granted them (OPEN or EXHAUSTED; EXHAUSTED flips back to OPEN when remaining_units rises above 0)"
          - "increments PurchaseOrder.version by 1"
      - from: CONFIRMED
        to: CONFIRMED
        trigger: "POST /wholesale/purchase-orders/{orderId}/allocate"
        actor: OrderManager
        preconditions:
          - "Order must be CONFIRMED (ERR_ORDER_NOT_CONFIRMED)"
          - "expected_order_version must equal current PurchaseOrder.version (ERR_STALE_VERSION)"
        side_effects:
          - "Per OrderLine, allocation per shortage_allocation calculation"
          - "OrderLine.line_status -> ALLOCATED | PARTIALLY_ALLOCATED | UNFULFILLABLE"
          - "invoice_total_cents and invoice_balance_cents recomputed; customer.open_receivable_cents adjusted by the delta"
          - "When all lines fully allocated: fulfillment_status -> ALLOCATED"
          - "increments PurchaseOrder.version by 1"

  - entity: PurchaseOrder
    dimension: financial_status
    note: "Parallel state dimension — financial_status evolves independently of fulfillment_status on the same entity"
    initial_state: UNBILLED
    terminal_states: [PAID, CREDITED]
    transitions:
      - from: UNBILLED
        to: INVOICED
        trigger: "system (cascade of DRAFT -> CONFIRMED)"
        actor: system
        preconditions: []
        side_effects:
          - "financial_status -> INVOICED"
      - from: INVOICED
        to: PARTIALLY_PAID
        trigger: "POST /wholesale/purchase-orders/{orderId}/payments"
        actor: BillingClerk
        preconditions:
          - "financial_status must be INVOICED or PARTIALLY_PAID (ERR_INVOICE_NOT_OPEN)"
          - "0 < amount_cents < invoice_balance_cents (ERR_PAYMENT_AMOUNT_INVALID)"
        side_effects:
          - "invoice_balance_cents -= amount_cents"
          - "customer.open_receivable_cents -= amount_cents"
          - "financial_status -> PARTIALLY_PAID"
      - from: INVOICED
        to: PAID
        trigger: "POST /wholesale/purchase-orders/{orderId}/payments"
        actor: BillingClerk
        preconditions:
          - "financial_status must be INVOICED or PARTIALLY_PAID (ERR_INVOICE_NOT_OPEN)"
          - "amount_cents == invoice_balance_cents (exact payoff) (ERR_PAYMENT_AMOUNT_INVALID)"
        side_effects:
          - "invoice_balance_cents -> 0"
          - "customer.open_receivable_cents -= amount_cents"
          - "financial_status -> PAID"
      - from: PARTIALLY_PAID
        to: PAID
        trigger: "POST /wholesale/purchase-orders/{orderId}/payments"
        actor: BillingClerk
        preconditions:
          - "financial_status must be INVOICED or PARTIALLY_PAID (ERR_INVOICE_NOT_OPEN)"
          - "amount_cents == invoice_balance_cents (ERR_PAYMENT_AMOUNT_INVALID)"
        side_effects:
          - "invoice_balance_cents -> 0"
          - "customer.open_receivable_cents -= amount_cents"
          - "financial_status -> PAID"
      - from: INVOICED
        to: CREDITED
        trigger: "system (cascade of order CANCELLED or ReturnAuthorization -> CREDITED covering full balance)"
        actor: system
        preconditions: []
        side_effects:
          - "financial_status -> CREDITED"
          - "customer.open_receivable_cents -= credit applied"

  - entity: SuspectInvestigation
    initial_state: OPEN
    terminal_states: [CONFIRMED_ILLEGITIMATE]
    transitions:
      - from: OPEN
        to: QUARANTINED
        trigger: "POST /wholesale/suspect-investigations/{investigationId}/quarantine"
        actor: QualityAssuranceLead
        preconditions:
          - "Investigation must be OPEN (ERR_INVESTIGATION_NOT_OPEN)"
        side_effects:
          - "investigation_status -> QUARANTINED"
          - "quarantined_by_user_id := X-User-ID of the caller"
          - "Cascade: linked SerializedCase -> QUARANTINED (and its units)"
          - "A QUARANTINE EpcisEvent is appended for the case"
          - "increments SuspectInvestigation.version by 1"
      - from: QUARANTINED
        to: CLEARED
        trigger: "POST /wholesale/suspect-investigations/{investigationId}/clear"
        actor: QualityAssuranceLead
        preconditions:
          - "Investigation must be QUARANTINED (ERR_INVESTIGATION_NOT_QUARANTINED)"
          - "The acting QualityAssuranceLead's X-User-ID must differ from the user who performed the quarantine action (segregation of duties) (ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "investigation_status -> CLEARED"
          - "Cascade: linked SerializedCase released from QUARANTINED per release rule; units follow"
          - "A RELEASE EpcisEvent is appended for the case"
          - "increments SuspectInvestigation.version by 1"
      - from: QUARANTINED
        to: CONFIRMED_ILLEGITIMATE
        trigger: "POST /wholesale/suspect-investigations/{investigationId}/confirm-illegitimate"
        actor: QualityAssuranceLead
        preconditions:
          - "Investigation must be QUARANTINED (ERR_INVESTIGATION_NOT_QUARANTINED)"
          - "The acting QualityAssuranceLead's X-User-ID must differ from the user who performed the quarantine action (segregation of duties) (ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "investigation_status -> CONFIRMED_ILLEGITIMATE"
          - "Cascade: linked SerializedCase -> DECOMMISSIONED; QUARANTINED units -> DECOMMISSIONED"
          - "A DECOMMISSION EpcisEvent is appended for the case"
          - "increments SuspectInvestigation.version by 1"
      - from: CLEARED
        to: OPEN
        trigger: "POST /wholesale/suspect-investigations/{investigationId}/reopen"
        actor: QualityAssuranceLead
        preconditions:
          - "Investigation must be CLEARED (ERR_INVESTIGATION_NOT_CLEARED)"
          - "reopen_count must be < 3 (ERR_REOPEN_LIMIT_REACHED)"
        side_effects:
          - "investigation_status -> OPEN"
          - "reopen_count += 1"
          - "increments SuspectInvestigation.version by 1"

  - entity: ChargebackClaim
    initial_state: SUBMITTED
    terminal_states: [SETTLED, DENIED]
    transitions:
      - from: SUBMITTED
        to: VALIDATED
        trigger: "POST /wholesale/chargeback-claims/{claimId}/validate"
        actor: ContractAdministrator
        preconditions:
          - "Claim must be SUBMITTED (ERR_CLAIM_NOT_SUBMITTED)"
          - "Referenced order must have is_340b_order == true (ERR_NOT_340B_ORDER)"
          - "computed_amount_cents recomputed and compared: claimed_amount_cents must equal computed_amount_cents (ERR_CHARGEBACK_AMOUNT_MISMATCH)"
        side_effects:
          - "claim_status -> VALIDATED"
          - "increments ChargebackClaim.version by 1"
      - from: VALIDATED
        to: SETTLED
        trigger: "POST /wholesale/chargeback-claims/{claimId}/settle"
        actor: ContractAdministrator
        preconditions:
          - "Claim must be VALIDATED (ERR_CLAIM_NOT_VALIDATED)"
        side_effects:
          - "claim_status -> SETTLED"
          - "increments ChargebackClaim.version by 1"
      - from: SUBMITTED
        to: DENIED
        trigger: "POST /wholesale/chargeback-claims/{claimId}/deny"
        actor: ContractAdministrator
        preconditions:
          - "Claim must be SUBMITTED or VALIDATED (ERR_CLAIM_NOT_DENIABLE)"
        side_effects:
          - "claim_status -> DENIED"
          - "increments ChargebackClaim.version by 1"
      - from: VALIDATED
        to: DENIED
        trigger: "POST /wholesale/chargeback-claims/{claimId}/deny"
        actor: ContractAdministrator
        preconditions:
          - "Claim must be SUBMITTED or VALIDATED (ERR_CLAIM_NOT_DENIABLE)"
        side_effects:
          - "claim_status -> DENIED"
          - "increments ChargebackClaim.version by 1"

  - entity: ReturnAuthorization
    initial_state: REQUESTED
    terminal_states: [CREDITED, REJECTED]
    transitions:
      - from: REQUESTED
        to: RECEIVED
        trigger: "POST /wholesale/return-authorizations/{returnId}/receive"
        actor: WarehouseOperator
        preconditions:
          - "Return must be REQUESTED (ERR_RETURN_NOT_REQUESTED)"
          - "Referenced order must be SHIPPED or DELIVERED (ERR_ORDER_NOT_RETURNABLE)"
          - "quantity_returned must be <= quantity_allocated of the order's line for product_id (ERR_RETURN_QTY_EXCEEDS_ALLOCATED)"
          - "If the product is_cold_chain, the return must be lodged within 48 hours of order delivery per logical clock (ERR_COLD_RETURN_WINDOW_EXPIRED)"
        side_effects:
          - "return_status -> RECEIVED"
          - "increments ReturnAuthorization.version by 1"
      - from: RECEIVED
        to: CREDITED
        trigger: "POST /wholesale/return-authorizations/{returnId}/credit"
        actor: BillingClerk
        preconditions:
          - "Return must be RECEIVED (ERR_RETURN_NOT_RECEIVED)"
          - "Referenced order financial_status must be INVOICED, PARTIALLY_PAID, or PAID (ERR_INVOICE_NOT_CREDITABLE)"
        side_effects:
          - "return_status -> CREDITED"
          - "credit_amount_cents computed per return_credit calculation"
          - "order.invoice_balance_cents = max(0, invoice_balance_cents - credit_amount_cents); customer.open_receivable_cents -= credit_amount_cents clamped at 0"
          - "If order.invoice_balance_cents reaches 0 and financial_status != PAID: financial_status -> CREDITED"
          - "increments ReturnAuthorization.version by 1"
      - from: REQUESTED
        to: REJECTED
        trigger: "POST /wholesale/return-authorizations/{returnId}/reject"
        actor: OrderManager
        preconditions:
          - "Return must be REQUESTED or RECEIVED (ERR_RETURN_NOT_REJECTABLE)"
        side_effects:
          - "return_status -> REJECTED"
          - "increments ReturnAuthorization.version by 1"
      - from: RECEIVED
        to: REJECTED
        trigger: "POST /wholesale/return-authorizations/{returnId}/reject"
        actor: OrderManager
        preconditions:
          - "Return must be REQUESTED or RECEIVED (ERR_RETURN_NOT_REJECTABLE)"
        side_effects:
          - "return_status -> REJECTED"
          - "increments ReturnAuthorization.version by 1"

  - entity: AllocationPolicy
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: EXHAUSTED
        trigger: "system (automatic when remaining_units reaches 0 after an allocation run)"
        actor: system
        preconditions: []
        side_effects:
          - "policy_status -> EXHAUSTED"
      - from: EXHAUSTED
        to: OPEN
        trigger: "system (automatic when a CONFIRMED-order cancel releases allocated units back to this policy, raising remaining_units above 0)"
        actor: system
        preconditions:
          - "Policy must be EXHAUSTED and a released allocation credits units back"
        side_effects:
          - "policy_status -> OPEN"
          - "remaining_units increased by the released quantity"
          - "increments AllocationPolicy.version by 1"
      - from: OPEN
        to: CLOSED
        trigger: "POST /wholesale/allocation-policies/{policyId}/close"
        actor: OrderManager
        preconditions:
          - "Policy must be OPEN or EXHAUSTED (ERR_POLICY_NOT_CLOSABLE)"
        side_effects:
          - "policy_status -> CLOSED"
          - "increments AllocationPolicy.version by 1"
      - from: EXHAUSTED
        to: CLOSED
        trigger: "POST /wholesale/allocation-policies/{policyId}/close"
        actor: OrderManager
        preconditions:
          - "Policy must be OPEN or EXHAUSTED (ERR_POLICY_NOT_CLOSABLE)"
        side_effects:
          - "policy_status -> CLOSED"
          - "increments AllocationPolicy.version by 1"

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: order-allocate-stale-version
    parent_entity: PurchaseOrder
    write_endpoint: "POST /wholesale/purchase-orders/{orderId}/allocate"
    occ_field: "expected_order_version"
    description: |
      Allocating an order whose version has advanced since the client last
      observed it is rejected. This captures the case where another writer has
      just run an allocation (which legitimately re-prices and re-allocates the
      same lines under a shortage epoch) and the current writer's view of the
      order is therefore stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: order_line_pricing
    trigger: "PurchaseOrder DRAFT -> CONFIRMED"
    algorithm: tiered_pricing
    formula: |
      For each OrderLine:
        base = product.wholesale_acquisition_cost_cents
        if order.is_340b_order AND product.is_340b_contracted:
          unit_price_cents = product.contract_340b_price_cents
        else:
          unit_price_cents = base
        extended_price_cents = quantity_allocated * unit_price_cents
      invoice_total_cents = sum of extended_price_cents over all lines
    input_set: "All OrderLine rows of the order regardless of line_status"
    precision: "integer cents; no rounding"
    variants:
      - name: provisional
        when: "At CONFIRMED, before any allocation run: quantity_allocated is 0, so invoice uses quantity_requested in place of quantity_allocated"
        difference: "Provisional invoice uses quantity_requested * unit_price_cents per line; final invoice after allocation uses quantity_allocated, producing a smaller total under shortage"
      - name: final
        when: "After POST .../allocate completes"
        difference: "Uses quantity_allocated; under shortage the final total is strictly less than the provisional total"

  - name: chargeback_amount
    trigger: "ChargebackClaim validation (SUBMITTED -> VALIDATED)"
    algorithm: aggregation
    formula: |
      computed_amount_cents =
        sum over OrderLine of (wholesale_acquisition_cost_cents - contract_340b_price_cents) * quantity_allocated
        restricted to lines whose product is_340b_contracted == true
    input_set: "OrderLine rows of the referenced order with line_status IN {ALLOCATED, PARTIALLY_ALLOCATED} and product.is_340b_contracted == true"
    precision: "integer cents; no rounding"
    variants:
      - name: gross_basis
        when: "Order was confirmed and fully allocated (all lines ALLOCATED)"
        difference: "quantity_allocated == quantity_requested; chargeback equals the full WAC-to-contract delta"
      - name: net_basis
        when: "Order shipped under shortage (some lines PARTIALLY_ALLOCATED)"
        difference: "Uses quantity_allocated, so chargeback shrinks proportionally to shortage allocation; the same claimed amount can match under one basis and mismatch under the other"

  - name: shortage_allocation
    trigger: "POST /wholesale/purchase-orders/{orderId}/allocate"
    algorithm: waterfall_allocation
    formula: |
      Let C = the set of PurchaseOrders with fulfillment_status IN {CONFIRMED, ALLOCATED}
      that contain an OrderLine for the shortage product (any line_status).
      Competing demand D = sum of quantity_requested over all such OrderLines in C.
      Competing order count N = |C|. C is evaluated at the start of each allocate call.
      For each OrderLine of the order being allocated whose product.shortage_status == SHORTAGE:
        policy = the AllocationPolicy for that product with policy_status == OPEN
        if none exists: quantity_allocated = 0, line_status -> UNFULFILLABLE
        if policy_mode == PRO_RATA:
          distributable = policy.pool_units - N * policy.min_guarantee_units
          grant = policy.min_guarantee_units + floor(distributable * quantity_requested / D)
        if policy_mode == EQUAL_SHARE:
          grant = floor(policy.pool_units / N)
        quantity_allocated = min(grant, quantity_requested, policy.remaining_units)
        policy.remaining_units -= quantity_allocated (first add back any quantity this line already held from a prior allocate, so re-runs are idempotent given unchanged C)
        line_status = ALLOCATED if quantity_allocated == quantity_requested
                      else PARTIALLY_ALLOCATED if quantity_allocated > 0
                      else UNFULFILLABLE
      Processing order across lines: ascending OrderLine.created_at, ties broken by ascending quantity_requested.
      For lines whose product.shortage_status == NORMAL: quantity_allocated = quantity_requested, line_status -> ALLOCATED.
    input_set: "OrderLine rows of the order with line_status IN {PENDING, PARTIALLY_ALLOCATED, UNFULFILLABLE}"
    constants:
      MIN_GRANT_FLOOR: 0
    precision: "integer units; floor division"

  - name: return_credit
    trigger: "ReturnAuthorization RECEIVED -> CREDITED"
    algorithm: threshold
    formula: |
      per_unit = unit_price_cents on the order's line for product_id
      days_since_delivery = (current_logical_clock - order delivery timestamp) in whole days (floor)
      if product.is_cold_chain: restock_rate = 0.50 when days_since_delivery <= 2 else 0.0
      else: restock_rate = 1.00 when days_since_delivery <= 30, 0.80 when 31..90, else 0.0
      credit_amount_cents = floor(quantity_returned * per_unit * restock_rate)
    input_set: "The single ReturnAuthorization being credited"
    constants:
      COLD_CHAIN_WINDOW_DAYS: 2
      FULL_CREDIT_WINDOW_DAYS: 30
      PARTIAL_CREDIT_WINDOW_DAYS: 90
      PARTIAL_CREDIT_RATE: 0.80
      COLD_CHAIN_RATE: 0.50
    precision: "integer cents, floor"

  - name: txn_history_chain
    trigger: "EpcisEvent creation"
    algorithm: chronological
    formula: |
      prev = the EpcisEvent for the same subject_case_id with the greatest event_time;
             ties broken by greatest recorded_at; further ties impossible (server rejects
             duplicate event_time+recorded_at for the same case)
      if none: txn_history_hash = ""
      else: txn_history_hash = hex_sha256(prev.txn_history_hash || event_type || event_time ISO string)
    input_set: "All prior EpcisEvent rows for the same subject_case_id"
    precision: "hex string; deterministic"

  - name: open_receivable_balance
    trigger: "order confirm, payment, cancel-with-credit, return credit"
    algorithm: aggregation
    formula: |
      TradingPartner.open_receivable_cents =
        sum of PurchaseOrder.invoice_balance_cents
        where customer_id == this partner
        and financial_status IN {INVOICED, PARTIALLY_PAID}
    input_set: "PurchaseOrder rows of the customer with financial_status IN {INVOICED, PARTIALLY_PAID}"
    precision: "integer cents"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers must be present and well-formed"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: "all endpoints"

  - priority: 2
    category: auth
    check: "Role must be permitted for the endpoint per RBAC matrix"
    error_id: ERR_UNAUTHORIZED_ROLE
    http_status: 403
    applies_to: "all endpoints"

  - priority: 3
    category: existence
    check: "Path-template resource ids must exist (validated left-to-right)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all resource endpoints"

  - priority: 4
    category: existence
    check: "Body-referenced FK ids (customer_id, product_id, case_id, order_id, partner ids) must exist"
    error_id: ERR_REFERENCE_NOT_FOUND
    http_status: 404
    applies_to: "creation endpoints with FK fields"

  - priority: 4.5
    category: state
    check: "OCC version check: when a request carries expected_<parent>_version, it must equal the parent's current version; evaluated BEFORE state preconditions and all business rules"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /wholesale/purchase-orders/{orderId}/allocate"

  - priority: 5
    category: state
    check: "Target resource must be in a state from which the requested transition exists"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints"

  - priority: 6
    category: business_safety
    check: "License verification: customer must hold an ACTIVE PartnerStateLicense for ship_to_state with valid_to >= current logical clock; controlled lines require scope in {RX_AND_CONTROLLED, FULL}; cold-chain lines require scope in {RX_AND_COLD_CHAIN, FULL}"
    error_id: "ERR_LICENSE_VERIFICATION_FAILED / ERR_CONTROLLED_LICENSE_REQUIRED / ERR_COLD_CHAIN_LICENSE_REQUIRED"
    http_status: 403
    applies_to: "POST /wholesale/purchase-orders/{orderId}/confirm"

  - priority: 7
    category: business_safety
    check: "Suspect/quarantined stock may not ship: no case listed in the ship request's case_ids may have case_status == QUARANTINED, and no OPEN or QUARANTINED SuspectInvestigation may exist whose case_id is in the request's case_ids"
    error_id: ERR_PRODUCT_UNDER_INVESTIGATION
    http_status: 403
    applies_to: "POST /wholesale/purchase-orders/{orderId}/ship"

  - priority: 8
    category: business_safety
    check: "Segregation of duties: the user clearing or confirming a suspect investigation must differ from the user who quarantined it"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /wholesale/suspect-investigations/{investigationId}/clear, POST /wholesale/suspect-investigations/{investigationId}/confirm-illegitimate"

  - priority: 9
    category: business_temporal
    check: "Serialized case must not be expired at ship time (expiry_date > current logical clock); EPCIS event_time must be <= current logical clock"
    error_id: "ERR_PRODUCT_EXPIRED / ERR_EVENT_TIME_IN_FUTURE"
    http_status: 422
    applies_to: "POST /wholesale/epcis-events, POST /wholesale/purchase-orders/{orderId}/ship"

  - priority: 10
    category: business_constraint
    check: "EPCIS event sequence per case must follow the state machine (e.g. RECEIVE only after SHIP; AGGREGATE only on COMMISSIONED case)"
    error_id: ERR_INVALID_EVENT_SEQUENCE
    http_status: 409
    applies_to: "POST /wholesale/epcis-events"

  - priority: 11
    category: business_constraint
    check: "Segregation: ship request segregation_mode must cover every line's class (controlled requires CONTROLLED, cold-chain requires COLD_CHAIN; MIXED shipments forbidden when both classes present unless segregation_mode == SEGREGATED_COMBINED)"
    error_id: ERR_SEGREGATION_REQUIRED
    http_status: 422
    applies_to: "POST /wholesale/purchase-orders/{orderId}/ship"

  - priority: 12
    category: business_constraint
    check: "Uniqueness: ndc unique across Products; sscc unique across SerializedCase; sni unique across SerializedUnit; one OPEN AllocationPolicy per product"
    error_id: ERR_DUPLICATE_UNIQUE_FIELD
    http_status: 409
    applies_to: "creation endpoints"

  - priority: 13
    category: business_referential
    check: "Chargeback claim must reference an order with is_340b_order == true; claimed_amount_cents must equal computed_amount_cents at validation time"
    error_id: "ERR_NOT_340B_ORDER / ERR_CHARGEBACK_AMOUNT_MISMATCH"
    http_status: 422
    applies_to: "POST /wholesale/chargeback-claims, POST /wholesale/chargeback-claims/{claimId}/validate"

  - priority: 14
    category: business_referential
    check: "Return quantity must not exceed the order line's quantity_allocated for the returned product"
    error_id: ERR_RETURN_QTY_EXCEEDS_ALLOCATED
    http_status: 422
    applies_to: "POST /wholesale/return-authorizations"

  - priority: 15
    category: business_temporal
    check: "Cold-chain returns must be lodged within 48 hours of delivery"
    error_id: ERR_COLD_RETURN_WINDOW_EXPIRED
    http_status: 422
    applies_to: "POST /wholesale/return-authorizations/{returnId}/receive"

  - priority: 16
    category: business_fiscal
    check: "Projected open receivable after confirm must be <= customer credit_limit_cents"
    error_id: ERR_CREDIT_LIMIT_EXCEEDED
    http_status: 402
    applies_to: "POST /wholesale/purchase-orders/{orderId}/confirm"

  - priority: 17
    category: business_fiscal
    check: "Payment amount must be > 0 and <= invoice_balance_cents; exact payoff transitions to PAID"
    error_id: ERR_PAYMENT_AMOUNT_INVALID
    http_status: 422
    applies_to: "POST /wholesale/purchase-orders/{orderId}/payments"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Trading partners ---
  - method: POST
    path: "/wholesale/trading-partners"
    description: "Register a trading partner (customer or supplier)"
    roles: [OrderManager]
    code: 201
    input: [partner_name, partner_kind, dea_number, credit_limit_cents]
    output: TradingPartner
    side_effects: ["open_receivable_cents initialized to 0", "allocation_watermark_units initialized to 0"]

  - method: GET
    path: "/wholesale/trading-partners"
    description: "List trading partners"
    roles: [OrderManager, ComplianceOfficer, QualityAssuranceLead, WarehouseOperator, BillingClerk, ContractAdministrator]
    code: 200
    input: ["limit?", "offset?", "partner_kind?"]
    output: "TradingPartner[]"
    side_effects: []

  - method: GET
    path: "/wholesale/trading-partners/{partnerId}"
    description: "Get one trading partner"
    roles: [OrderManager, ComplianceOfficer, QualityAssuranceLead, WarehouseOperator, BillingClerk, ContractAdministrator]
    code: 200
    input: []
    output: TradingPartner
    side_effects: []

  # --- State licenses ---
  - method: POST
    path: "/wholesale/partner-state-licenses"
    description: "Register a state license for a partner"
    roles: [ComplianceOfficer]
    code: 201
    input: [partner_id, state_code, license_number, license_scope, valid_from, valid_to]
    output: PartnerStateLicense
    side_effects: ["license_status initialized ACTIVE"]

  - method: GET
    path: "/wholesale/partner-state-licenses"
    description: "List state licenses (filterable by partner)"
    roles: [OrderManager, ComplianceOfficer, QualityAssuranceLead, WarehouseOperator, BillingClerk, ContractAdministrator]
    code: 200
    input: ["limit?", "offset?", "partner_id?", "state_code?"]
    output: "PartnerStateLicense[]"
    side_effects: []

  - method: GET
    path: "/wholesale/partner-state-licenses/{licenseId}"
    description: "Get one state license"
    roles: [OrderManager, ComplianceOfficer, QualityAssuranceLead, WarehouseOperator, BillingClerk, ContractAdministrator]
    code: 200
    input: []
    output: PartnerStateLicense
    side_effects: []

  - method: POST
    path: "/wholesale/partner-state-licenses/{licenseId}/suspend"
    description: "Suspend a license"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: PartnerStateLicense
    side_effects: ["license_status -> SUSPENDED", "increments PartnerStateLicense.version by 1"]

  - method: POST
    path: "/wholesale/partner-state-licenses/{licenseId}/reinstate"
    description: "Reinstate a suspended license"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: PartnerStateLicense
    side_effects: ["license_status -> ACTIVE", "increments PartnerStateLicense.version by 1"]

  - method: POST
    path: "/wholesale/partner-state-licenses/{licenseId}/revoke"
    description: "Revoke a license (terminal)"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: PartnerStateLicense
    side_effects: ["license_status -> REVOKED", "increments PartnerStateLicense.version by 1"]

  # --- Products ---
  - method: POST
    path: "/wholesale/products"
    description: "Register a product (NDC master data)"
    roles: [OrderManager]
    code: 201
    input: [ndc, product_name, is_controlled, is_cold_chain, wholesale_acquisition_cost_cents, "is_340b_contracted?", "contract_340b_price_cents?"]
    output: Product
    side_effects: ["shortage_status initialized NORMAL"]

  - method: GET
    path: "/wholesale/products"
    description: "List products"
    roles: [OrderManager, ComplianceOfficer, QualityAssuranceLead, WarehouseOperator, BillingClerk, ContractAdministrator]
    code: 200
    input: ["limit?", "offset?", "shortage_status?"]
    output: "Product[]"
    side_effects: []

  - method: GET
    path: "/wholesale/products/{productId}"
    description: "Get one product"
    roles: [OrderManager, ComplianceOfficer, QualityAssuranceLead, WarehouseOperator, BillingClerk, ContractAdministrator]
    code: 200
    input: []
    output: Product
    side_effects: []

  - method: POST
    path: "/wholesale/products/{productId}/declare-shortage"
    description: "Declare a product in shortage, enabling allocation policies"
    roles: [OrderManager]
    code: 200
    input: []
    output: Product
    side_effects: ["shortage_status -> SHORTAGE", "increments Product.version by 1"]

  # --- Allocation policies ---
  - method: POST
    path: "/wholesale/allocation-policies"
    description: "Open a shortage allocation policy for a product"
    roles: [OrderManager]
    code: 201
    input: [product_id, pool_units, policy_mode, "min_guarantee_units?"]
    output: AllocationPolicy
    side_effects: ["remaining_units initialized to pool_units", "policy_status OPEN"]

  - method: GET
    path: "/wholesale/allocation-policies"
    description: "List allocation policies"
    roles: [OrderManager, ComplianceOfficer, QualityAssuranceLead, WarehouseOperator, BillingClerk, ContractAdministrator]
    code: 200
    input: ["limit?", "offset?", "product_id?", "policy_status?"]
    output: "AllocationPolicy[]"
    side_effects: []

  - method: GET
    path: "/wholesale/allocation-policies/{policyId}"
    description: "Get one allocation policy"
    roles: [OrderManager, ComplianceOfficer, QualityAssuranceLead, WarehouseOperator, BillingClerk, ContractAdministrator]
    code: 200
    input: []
    output: AllocationPolicy
    side_effects: []

  - method: POST
    path: "/wholesale/allocation-policies/{policyId}/close"
    description: "Close an allocation policy"
    roles: [OrderManager]
    code: 200
    input: []
    output: AllocationPolicy
    side_effects: ["policy_status -> CLOSED", "increments AllocationPolicy.version by 1"]

  # --- Serialized cases & units ---
  - method: POST
    path: "/wholesale/serialized-cases"
    description: "Commission a serialized case"
    roles: [WarehouseOperator]
    code: 201
    input: [sscc, product_id, lot_number, expiry_date]
    output: SerializedCase
    side_effects: ["case_status COMMISSIONED"]

  - method: GET
    path: "/wholesale/serialized-cases"
    description: "List serialized cases"
    roles: [OrderManager, ComplianceOfficer, QualityAssuranceLead, WarehouseOperator, BillingClerk, ContractAdministrator]
    code: 200
    input: ["limit?", "offset?", "product_id?", "case_status?"]
    output: "SerializedCase[]"
    side_effects: []

  - method: GET
    path: "/wholesale/serialized-cases/{caseId}"
    description: "Get one serialized case"
    roles: [OrderManager, ComplianceOfficer, QualityAssuranceLead, WarehouseOperator, BillingClerk, ContractAdministrator]
    code: 200
    input: []
    output: SerializedCase
    side_effects: []

  - method: GET
    path: "/wholesale/serialized-cases/{caseId}/units"
    description: "List units aggregated under a case"
    roles: [OrderManager, ComplianceOfficer, QualityAssuranceLead, WarehouseOperator, BillingClerk, ContractAdministrator]
    code: 200
    input: ["limit?", "offset?"]
    output: "SerializedUnit[]"
    side_effects: []

  - method: POST
    path: "/wholesale/serialized-units"
    description: "Commission a serialized unit into a case (aggregation)"
    roles: [WarehouseOperator]
    code: 201
    input: [sni, case_id]
    output: SerializedUnit
    side_effects: ["unit_status COMMISSIONED"]

  - method: GET
    path: "/wholesale/serialized-units"
    description: "List serialized units"
    roles: [OrderManager, ComplianceOfficer, QualityAssuranceLead, WarehouseOperator, BillingClerk, ContractAdministrator]
    code: 200
    input: ["limit?", "offset?", "case_id?", "unit_status?"]
    output: "SerializedUnit[]"
    side_effects: []

  - method: GET
    path: "/wholesale/serialized-units/{unitId}"
    description: "Get one serialized unit"
    roles: [OrderManager, ComplianceOfficer, QualityAssuranceLead, WarehouseOperator, BillingClerk, ContractAdministrator]
    code: 200
    input: []
    output: SerializedUnit
    side_effects: []

  # --- EPCIS events ---
  - method: POST
    path: "/wholesale/epcis-events"
    description: "Capture an EPCIS event (commission/aggregate/ship/receive/quarantine/release/decommission)"
    roles: [WarehouseOperator, QualityAssuranceLead]
    code: 201
    input: [event_type, subject_case_id, "order_id?", event_time, sender_partner_id, recipient_partner_id]
    output: EpcisEvent
    side_effects:
      - "txn_history_hash chained per txn_history_chain calculation"
      - "SHIP transitions case COMMISSIONED -> SHIPPED (and units); RECEIVE transitions SHIPPED -> RECEIVED; DECOMMISSION transitions COMMISSIONED -> DECOMMISSIONED"

  - method: GET
    path: "/wholesale/epcis-events"
    description: "List EPCIS events (transaction history)"
    roles: [OrderManager, ComplianceOfficer, QualityAssuranceLead, WarehouseOperator, BillingClerk, ContractAdministrator]
    code: 200
    input: ["limit?", "offset?", "subject_case_id?", "event_type?", "order_id?", "sender_partner_id?", "recipient_partner_id?"]
    output: "EpcisEvent[]"
    side_effects: []

  - method: GET
    path: "/wholesale/epcis-events/{eventId}"
    description: "Get one EPCIS event"
    roles: [OrderManager, ComplianceOfficer, QualityAssuranceLead, WarehouseOperator, BillingClerk, ContractAdministrator]
    code: 200
    input: []
    output: EpcisEvent
    side_effects: []

  # --- Purchase orders ---
  - method: POST
    path: "/wholesale/purchase-orders"
    description: "Create a purchase order (DRAFT)"
    roles: [OrderManager]
    code: 201
    input: [customer_id, ship_to_state, "is_340b_order?"]
    output: PurchaseOrder
    side_effects: ["fulfillment_status DRAFT", "financial_status UNBILLED"]

  - method: GET
    path: "/wholesale/purchase-orders"
    description: "List purchase orders"
    roles: [OrderManager, ComplianceOfficer, QualityAssuranceLead, WarehouseOperator, BillingClerk, ContractAdministrator]
    code: 200
    input: ["limit?", "offset?", "customer_id?", "fulfillment_status?", "financial_status?"]
    output: "PurchaseOrder[]"
    side_effects: []

  - method: GET
    path: "/wholesale/purchase-orders/{orderId}"
    description: "Get one purchase order"
    roles: [OrderManager, ComplianceOfficer, QualityAssuranceLead, WarehouseOperator, BillingClerk, ContractAdministrator]
    code: 200
    input: []
    output: PurchaseOrder
    side_effects: []

  - method: GET
    path: "/wholesale/purchase-orders/{orderId}/lines"
    description: "List order lines"
    roles: [OrderManager, ComplianceOfficer, QualityAssuranceLead, WarehouseOperator, BillingClerk, ContractAdministrator]
    code: 200
    input: ["limit?", "offset?"]
    output: "OrderLine[]"
    side_effects: []

  - method: GET
    path: "/wholesale/order-lines/{lineId}"
    description: "Get one order line"
    roles: [OrderManager, ComplianceOfficer, QualityAssuranceLead, WarehouseOperator, BillingClerk, ContractAdministrator]
    code: 200
    input: []
    output: OrderLine
    side_effects: []

  - method: GET
    path: "/wholesale/order-lines"
    description: "List order lines across orders (filterable)"
    roles: [OrderManager, ComplianceOfficer, QualityAssuranceLead, WarehouseOperator, BillingClerk, ContractAdministrator]
    code: 200
    input: ["limit?", "offset?", "order_id?", "product_id?"]
    output: "OrderLine[]"
    side_effects: []

  - method: POST
    path: "/wholesale/purchase-orders/{orderId}/lines"
    description: "Add an order line (DRAFT orders only); path orderId binds the parent"
    roles: [OrderManager]
    code: 201
    input: [product_id, quantity_requested]
    output: OrderLine
    side_effects: ["line_status PENDING", "order_id set from path"]

  - method: POST
    path: "/wholesale/purchase-orders/{orderId}/confirm"
    description: "Confirm an order: license verification, pricing, invoicing"
    roles: [OrderManager]
    code: 200
    input: []
    output: PurchaseOrder
    side_effects:
      - "fulfillment_status -> CONFIRMED, financial_status -> INVOICED"
      - "order_line_pricing computes unit_price_cents and provisional invoice totals"
      - "customer.open_receivable_cents += invoice_total_cents"
      - "increments PurchaseOrder.version by 1"

  - method: POST
    path: "/wholesale/purchase-orders/{orderId}/allocate"
    description: "Run shortage allocation over the order's lines (OCC-guarded)"
    roles: [OrderManager]
    code: 200
    input: [expected_order_version]
    output: PurchaseOrder
    side_effects:
      - "shortage_allocation calculation per line; line_status updated"
      - "final invoice totals recomputed; customer.open_receivable_cents adjusted by delta"
      - "increments PurchaseOrder.version by 1"

  - method: POST
    path: "/wholesale/purchase-orders/{orderId}/ship"
    description: "Ship an order, binding the listed serialized cases, with segregation-mode declaration"
    roles: [WarehouseOperator]
    code: 200
    input: [segregation_mode, case_ids]
    output: PurchaseOrder
    side_effects:
      - "fulfillment_status -> SHIPPED"
      - "Each case in case_ids transitions COMMISSIONED -> SHIPPED and is bound to the order"
      - "SHIP EpcisEvent appended per shipped case"
      - "increments PurchaseOrder.version by 1"

  - method: POST
    path: "/wholesale/purchase-orders/{orderId}/deliver"
    description: "Mark a shipped order delivered"
    roles: [WarehouseOperator]
    code: 200
    input: []
    output: PurchaseOrder
    side_effects: ["fulfillment_status -> DELIVERED", "increments PurchaseOrder.version by 1"]

  - method: POST
    path: "/wholesale/purchase-orders/{orderId}/cancel"
    description: "Cancel a DRAFT or CONFIRMED order"
    roles: [OrderManager]
    code: 200
    input: []
    output: PurchaseOrder
    side_effects:
      - "fulfillment_status -> CANCELLED"
      - "If INVOICED: financial_status -> CREDITED, open receivable reduced, allocated units released to OPEN policies"
      - "increments PurchaseOrder.version by 1"

  - method: POST
    path: "/wholesale/purchase-orders/{orderId}/payments"
    description: "Post a payment against an open invoice"
    roles: [BillingClerk]
    code: 201
    input: [amount_cents]
    output: PurchaseOrder
    side_effects:
      - "invoice_balance_cents -= amount_cents"
      - "customer.open_receivable_cents -= amount_cents"
      - "financial_status -> PARTIALLY_PAID or PAID"

  # --- Suspect investigations ---
  - method: POST
    path: "/wholesale/suspect-investigations"
    description: "Open a suspect-product investigation on a serialized case"
    roles: [QualityAssuranceLead]
    code: 201
    input: [case_id, opened_reason]
    output: SuspectInvestigation
    side_effects: ["investigation_status OPEN"]

  - method: GET
    path: "/wholesale/suspect-investigations"
    description: "List suspect investigations"
    roles: [OrderManager, ComplianceOfficer, QualityAssuranceLead, WarehouseOperator, BillingClerk, ContractAdministrator]
    code: 200
    input: ["limit?", "offset?", "case_id?", "investigation_status?"]
    output: "SuspectInvestigation[]"
    side_effects: []

  - method: GET
    path: "/wholesale/suspect-investigations/{investigationId}"
    description: "Get one suspect investigation"
    roles: [OrderManager, ComplianceOfficer, QualityAssuranceLead, WarehouseOperator, BillingClerk, ContractAdministrator]
    code: 200
    input: []
    output: SuspectInvestigation
    side_effects: []

  - method: POST
    path: "/wholesale/suspect-investigations/{investigationId}/quarantine"
    description: "Quarantine the suspect case"
    roles: [QualityAssuranceLead]
    code: 200
    input: []
    output: SuspectInvestigation
    side_effects:
      - "investigation_status -> QUARANTINED"
      - "Cascade: case and units -> QUARANTINED; QUARANTINE EpcisEvent appended"
      - "increments SuspectInvestigation.version by 1"

  - method: POST
    path: "/wholesale/suspect-investigations/{investigationId}/clear"
    description: "Clear a quarantined investigation (segregation of duties applies)"
    roles: [QualityAssuranceLead]
    code: 200
    input: []
    output: SuspectInvestigation
    side_effects:
      - "investigation_status -> CLEARED"
      - "Cascade: case and units released per release rule; RELEASE EpcisEvent appended"
      - "increments SuspectInvestigation.version by 1"

  - method: POST
    path: "/wholesale/suspect-investigations/{investigationId}/confirm-illegitimate"
    description: "Confirm product illegitimate (terminal; decommissions case)"
    roles: [QualityAssuranceLead]
    code: 200
    input: []
    output: SuspectInvestigation
    side_effects:
      - "investigation_status -> CONFIRMED_ILLEGITIMATE"
      - "Cascade: case and QUARANTINED units -> DECOMMISSIONED; DECOMMISSION EpcisEvent appended"
      - "increments SuspectInvestigation.version by 1"

  - method: POST
    path: "/wholesale/suspect-investigations/{investigationId}/reopen"
    description: "Reopen a cleared investigation (max 3 reopens)"
    roles: [QualityAssuranceLead]
    code: 200
    input: []
    output: SuspectInvestigation
    side_effects: ["investigation_status -> OPEN", "reopen_count += 1", "increments SuspectInvestigation.version by 1"]

  # --- Chargeback claims ---
  - method: POST
    path: "/wholesale/chargeback-claims"
    description: "Submit a 340B chargeback claim against an order"
    roles: [ContractAdministrator]
    code: 201
    input: [order_id, claimed_amount_cents]
    output: ChargebackClaim
    side_effects: ["claim_status SUBMITTED", "computed_amount_cents computed at submission"]

  - method: GET
    path: "/wholesale/chargeback-claims"
    description: "List chargeback claims"
    roles: [OrderManager, ComplianceOfficer, QualityAssuranceLead, WarehouseOperator, BillingClerk, ContractAdministrator]
    code: 200
    input: ["limit?", "offset?", "order_id?", "claim_status?"]
    output: "ChargebackClaim[]"
    side_effects: []

  - method: GET
    path: "/wholesale/chargeback-claims/{claimId}"
    description: "Get one chargeback claim"
    roles: [OrderManager, ComplianceOfficer, QualityAssuranceLead, WarehouseOperator, BillingClerk, ContractAdministrator]
    code: 200
    input: []
    output: ChargebackClaim
    side_effects: []

  - method: POST
    path: "/wholesale/chargeback-claims/{claimId}/validate"
    description: "Validate a submitted claim against the computed amount"
    roles: [ContractAdministrator]
    code: 200
    input: []
    output: ChargebackClaim
    side_effects: ["claim_status -> VALIDATED", "increments ChargebackClaim.version by 1"]

  - method: POST
    path: "/wholesale/chargeback-claims/{claimId}/settle"
    description: "Settle a validated claim"
    roles: [ContractAdministrator]
    code: 200
    input: []
    output: ChargebackClaim
    side_effects: ["claim_status -> SETTLED", "increments ChargebackClaim.version by 1"]

  - method: POST
    path: "/wholesale/chargeback-claims/{claimId}/deny"
    description: "Deny a claim"
    roles: [ContractAdministrator]
    code: 200
    input: []
    output: ChargebackClaim
    side_effects: ["claim_status -> DENIED", "increments ChargebackClaim.version by 1"]

  # --- Return authorizations ---
  - method: POST
    path: "/wholesale/return-authorizations"
    description: "Request a return against a shipped/delivered order"
    roles: [OrderManager]
    code: 201
    input: [order_id, product_id, quantity_returned]
    output: ReturnAuthorization
    side_effects: ["return_status REQUESTED"]

  - method: GET
    path: "/wholesale/return-authorizations"
    description: "List return authorizations"
    roles: [OrderManager, ComplianceOfficer, QualityAssuranceLead, WarehouseOperator, BillingClerk, ContractAdministrator]
    code: 200
    input: ["limit?", "offset?", "order_id?", "product_id?", "return_status?"]
    output: "ReturnAuthorization[]"
    side_effects: []

  - method: GET
    path: "/wholesale/return-authorizations/{returnId}"
    description: "Get one return authorization"
    roles: [OrderManager, ComplianceOfficer, QualityAssuranceLead, WarehouseOperator, BillingClerk, ContractAdministrator]
    code: 200
    input: []
    output: ReturnAuthorization
    side_effects: []

  - method: POST
    path: "/wholesale/return-authorizations/{returnId}/receive"
    description: "Receive returned goods (cold-chain window enforced)"
    roles: [WarehouseOperator]
    code: 200
    input: []
    output: ReturnAuthorization
    side_effects: ["return_status -> RECEIVED", "increments ReturnAuthorization.version by 1"]

  - method: POST
    path: "/wholesale/return-authorizations/{returnId}/credit"
    description: "Issue credit for a received return"
    roles: [BillingClerk]
    code: 200
    input: []
    output: ReturnAuthorization
    side_effects:
      - "return_status -> CREDITED"
      - "return_credit calculation; order balance and customer receivable reduced"
      - "increments ReturnAuthorization.version by 1"

  - method: POST
    path: "/wholesale/return-authorizations/{returnId}/reject"
    description: "Reject a return"
    roles: [OrderManager]
    code: 200
    input: []
    output: ReturnAuthorization
    side_effects: ["return_status -> REJECTED", "increments ReturnAuthorization.version by 1"]

  # --- Test-driving logical clock ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the logical clock (test-driving endpoint). Server default before any call is exactly 2026-08-01T00:00:00Z; the clock MUST NOT fall back to real wall-clock time."
    roles: [OrderManager, ComplianceOfficer, QualityAssuranceLead, WarehouseOperator, BillingClerk, ContractAdministrator]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string }"
    side_effects: ["logical clock advanced to to_iso8601"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role header missing or malformed" }
  - { id: ERR_UNAUTHORIZED_ROLE, http: 403, condition: "Role not permitted for this endpoint per RBAC matrix" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path-template resource id does not exist" }
  - { id: ERR_REFERENCE_NOT_FOUND, http: 404, condition: "Body-referenced FK id does not exist" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Target resource not in a state permitting the requested transition" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_order_version does not match current PurchaseOrder.version" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Malformed request, missing required field, or type mismatch" }
  - { id: ERR_DUPLICATE_UNIQUE_FIELD, http: 409, condition: "Uniqueness violation on ndc, sscc, sni, or one OPEN AllocationPolicy per product" }
  - { id: ERR_ORDER_NOT_DRAFT, http: 409, condition: "Order must be DRAFT for this operation" }
  - { id: ERR_ORDER_EMPTY, http: 409, condition: "Order has no lines at confirm time" }
  - { id: ERR_ORDER_NOT_CONFIRMED, http: 409, condition: "Order must be CONFIRMED for allocation" }
  - { id: ERR_ORDER_NOT_SHIPPABLE, http: 409, condition: "Order must be CONFIRMED or ALLOCATED to ship" }
  - { id: ERR_ORDER_NOT_SHIPPED, http: 409, condition: "Order must be SHIPPED to deliver" }
  - { id: ERR_ORDER_NOT_CANCELLABLE, http: 409, condition: "Order must be DRAFT or CONFIRMED to cancel" }
  - { id: ERR_LINES_UNALLOCATED, http: 409, condition: "Every order line must have quantity_allocated > 0 before shipping" }
  - { id: ERR_LICENSE_VERIFICATION_FAILED, http: 403, condition: "No ACTIVE license for ship_to_state or license expired at confirm time" }
  - { id: ERR_CONTROLLED_LICENSE_REQUIRED, http: 403, condition: "Order contains controlled product but license scope lacks controlled authority" }
  - { id: ERR_COLD_CHAIN_LICENSE_REQUIRED, http: 403, condition: "Order contains cold-chain product but license scope lacks cold-chain authority" }
  - { id: ERR_LICENSE_NOT_ACTIVE, http: 409, condition: "License must be ACTIVE to suspend" }
  - { id: ERR_LICENSE_NOT_SUSPENDED, http: 409, condition: "License must be SUSPENDED to reinstate" }
  - { id: ERR_LICENSE_ALREADY_REVOKED, http: 409, condition: "License already REVOKED (terminal)" }
  - { id: ERR_LICENSE_EXPIRED, http: 403, condition: "Current logical clock is past license valid_to; reinstatement forbidden" }
  - { id: ERR_CREDIT_LIMIT_EXCEEDED, http: 402, condition: "Projected open receivable would exceed customer credit_limit_cents" }
  - { id: ERR_PAYMENT_AMOUNT_INVALID, http: 422, condition: "Payment must be > 0 and <= invoice_balance_cents" }
  - { id: ERR_INVOICE_NOT_OPEN, http: 409, condition: "Payments only against INVOICED or PARTIALLY_PAID orders" }
  - { id: ERR_INVOICE_NOT_CREDITABLE, http: 409, condition: "Return credit only against INVOICED, PARTIALLY_PAID, or PAID orders" }
  - { id: ERR_PRODUCT_UNDER_INVESTIGATION, http: 403, condition: "Order references a case with an OPEN or QUARANTINED suspect investigation" }
  - { id: ERR_SEGREGATION_REQUIRED, http: 422, condition: "segregation_mode does not cover every line's segregation class" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "The same user may not quarantine and clear/confirm the same investigation" }
  - { id: ERR_INVESTIGATION_NOT_OPEN, http: 409, condition: "Investigation must be OPEN to quarantine" }
  - { id: ERR_INVESTIGATION_NOT_QUARANTINED, http: 409, condition: "Investigation must be QUARANTINED to clear or confirm" }
  - { id: ERR_INVESTIGATION_NOT_CLEARED, http: 409, condition: "Investigation must be CLEARED to reopen" }
  - { id: ERR_REOPEN_LIMIT_REACHED, http: 409, condition: "reopen_count has reached 3; investigation may not be reopened again" }
  - { id: ERR_CASE_NOT_SHIPPABLE, http: 409, condition: "Case must be COMMISSIONED to ship or decommission" }
  - { id: ERR_CASE_NOT_IN_TRANSIT, http: 409, condition: "Case must be SHIPPED to receive" }
  - { id: ERR_CASE_NOT_QUARANTINABLE, http: 409, condition: "Case must be COMMISSIONED, SHIPPED, or RECEIVED to quarantine" }
  - { id: ERR_CASE_NOT_QUARANTINED, http: 409, condition: "Case must be QUARANTINED for release or decommission cascade" }
  - { id: ERR_PRODUCT_EXPIRED, http: 422, condition: "Case expiry_date is not strictly after current logical clock at ship time" }
  - { id: ERR_EVENT_TIME_IN_FUTURE, http: 422, condition: "EPCIS event_time is after the current logical clock" }
  - { id: ERR_INVALID_EVENT_SEQUENCE, http: 409, condition: "EPCIS event type not permitted given the case's current state" }
  - { id: ERR_NOT_340B_ORDER, http: 422, condition: "Chargeback claim references an order with is_340b_order == false" }
  - { id: ERR_CHARGEBACK_AMOUNT_MISMATCH, http: 422, condition: "claimed_amount_cents differs from computed_amount_cents at validation" }
  - { id: ERR_CLAIM_NOT_SUBMITTED, http: 409, condition: "Claim must be SUBMITTED to validate" }
  - { id: ERR_CLAIM_NOT_VALIDATED, http: 409, condition: "Claim must be VALIDATED to settle" }
  - { id: ERR_CLAIM_NOT_DENIABLE, http: 409, condition: "Claim must be SUBMITTED or VALIDATED to deny" }
  - { id: ERR_RETURN_NOT_REQUESTED, http: 409, condition: "Return must be REQUESTED to receive" }
  - { id: ERR_ORDER_NOT_RETURNABLE, http: 409, condition: "Order must be SHIPPED or DELIVERED to return against" }
  - { id: ERR_RETURN_QTY_EXCEEDS_ALLOCATED, http: 422, condition: "quantity_returned exceeds the order line's quantity_allocated for the product" }
  - { id: ERR_COLD_RETURN_WINDOW_EXPIRED, http: 422, condition: "Cold-chain return lodged more than 48 hours after delivery" }
  - { id: ERR_RETURN_NOT_RECEIVED, http: 409, condition: "Return must be RECEIVED to credit" }
  - { id: ERR_RETURN_NOT_REJECTABLE, http: 409, condition: "Return must be REQUESTED or RECEIVED to reject" }
  - { id: ERR_POLICY_NOT_CLOSABLE, http: 409, condition: "Allocation policy must be OPEN or EXHAUSTED to close" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: OrderManager
    description: "Customer-service/order desk: partners, products, orders, allocation policies, return requests/rejection"
    identity: opaque
    exclusive_operations:
      - "POST /wholesale/trading-partners"
      - "POST /wholesale/products"
      - "POST /wholesale/products/{productId}/declare-shortage"
      - "POST /wholesale/allocation-policies"
      - "POST /wholesale/allocation-policies/{policyId}/close"
      - "POST /wholesale/purchase-orders"
      - "POST /wholesale/purchase-orders/{orderId}/lines"
      - "POST /wholesale/purchase-orders/{orderId}/confirm"
      - "POST /wholesale/purchase-orders/{orderId}/allocate"
      - "POST /wholesale/purchase-orders/{orderId}/cancel"
      - "POST /wholesale/return-authorizations"
      - "POST /wholesale/return-authorizations/{returnId}/reject"
    shared_operations:
      - "All GET endpoints"
      - "POST /_clock/set_current_utc"

  - name: ComplianceOfficer
    description: "Licensing & regulatory compliance: state license lifecycle"
    identity: opaque
