# =============================================================================
# task_1027_video_game_retro_store — §1.8 Scaffold Difficulty Design
# Test Targeting Index: 9 Difficulty Rules x 2 instances = 18 instances.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: trade_in_provisional_vs_final_diverges_on_regrade
        grounds:
          - calculations.trade_in_value
          - entities.TradeIn.fields.provisional_value_cents
          - entities.TradeIn.fields.final_value_cents
          - state_machines.TradeIn.SUBMITTED_to_OFFERED
        distinguishing_aspect: "On a TradeIn (base_trade_value_cents=10000, payout STORE_CREDIT), the provisional variant uses stated_grade=B (8250) while the final variant uses clerk final_grade=C (5500); the two values differ on the same trade-in — this is the cost-domain dual variant, distinct from the Rental time-domain variant."
        test_recipe:
          setup:
            - "A member and a product with base_trade_value_cents=10000 exist."
            - "A trade-in submitted with stated_grade=B, payout STORE_CREDIT (provisional_value_cents pinned)."
          setup_api_calls:
            - call: "POST /members"
              payload: { full_name: "Trina", email: "trina@x.com" }
              as: Clerk
              captures: { m_id: $.data.id }
            - call: "POST /products"
              payload: { title: "Retro RPG", kind: "GAME", base_price_cents: 6000, base_trade_value_cents: 10000 }
              as: Clerk
              captures: { p_id: $.data.id }
            - call: "POST /trade-ins"
              payload: { member_id: "${m_id}", product_id: "${p_id}", stated_grade: "B", payout_method: "STORE_CREDIT" }
              as: Clerk
              captures: { ti_id: $.data.id, prov: $.data.provisional_value_cents }
          trigger:
            - call: "POST /trade-ins/${ti_id}/grade"
              payload: { final_grade: "C" }
              as: Clerk
              captures: { fin: $.data.final_value_cents }
          assert:
            - "TradeIn.${ti_id}.provisional_value_cents == 8250"
            - "TradeIn.${ti_id}.final_value_cents == 5500"
            - "TradeIn.${ti_id}.provisional_value_cents != TradeIn.${ti_id}.final_value_cents"
            - "TradeIn.${ti_id}.status == OFFERED"

      - name: rental_estimated_vs_final_diverges_on_late_return
        grounds:
          - calculations.rental_charge
          - calculations.rental_late_fee
          - entities.Rental.fields.estimated_charge_cents
          - entities.Rental.fields.final_charge_cents
          - state_machines.Rental.CHECKED_OUT_to_RETURNED
        distinguishing_aspect: "On a Rental (daily_rate 500, 3 planned days), the estimated variant pins 1500 at checkout while the final variant pins 2000 at a 1-day-late return — the time-domain dual variant on a different entity than TradeIn's cost-domain variant."
        test_recipe:
          setup:
            - "A member, a CONSOLE product with daily_rental_rate_cents=500, and one AVAILABLE inventory unit exist."
            - "A rental reserved for [2026-07-02T00:00:00Z, 2026-07-05T00:00:00Z) and checked out (estimated pinned)."
          setup_api_calls:
            - call: "POST /members"
              payload: { full_name: "Rory", email: "rory@x.com" }
              as: Clerk
              captures: { m_id: $.data.id }
            - call: "POST /products"
              payload: { title: "Console X", kind: "CONSOLE", base_price_cents: 20000, base_trade_value_cents: 8000, daily_rental_rate_cents: 500 }
              as: Clerk
              captures: { p_id: $.data.id }
            - call: "POST /products/${p_id}/inventory-items"
              payload: { condition_grade: "A" }
              as: Clerk
              captures: { it_id: $.data.id }
            - call: "POST /rentals"
              payload: { member_id: "${m_id}", inventory_item_id: "${it_id}", start_at: "2026-07-02T00:00:00Z", due_at: "2026-07-05T00:00:00Z" }
              as: Clerk
              captures: { r_id: $.data.id, est: $.data.estimated_charge_cents }
            - call: "POST /rentals/${r_id}/checkout"
              payload: {}
              as: Clerk
              captures: { est2: $.data.estimated_charge_cents }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-06T00:00:00Z" }
              as: Manager
          trigger:
            - call: "POST /rentals/${r_id}/return"
              payload: {}
              as: Clerk
              captures: { fin: $.data.final_charge_cents, lf: $.data.late_fee_cents }
          assert:
            - "Rental.${r_id}.estimated_charge_cents == 1500"
            - "Rental.${r_id}.late_fee_cents == 500"
            - "Rental.${r_id}.final_charge_cents == 2000"
            - "Rental.${r_id}.estimated_charge_cents != Rental.${r_id}.final_charge_cents"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: sale_tax_rounded_per_line_then_summed
        grounds:
          - calculations.sale_totals
          - entities.Sale.fields.tax_total_cents
          - entities.Sale.fields.total_cents
        distinguishing_aspect: "Mode (b) nested-rounding-order: two lines of 1000 each yield per-line tax round_half_up(72.5)=73 summed to 146, whereas sum-then-round would give round_half_up(145.0)=145; the scaffold pins round-per-line-then-sum, so tax_total_cents==146."
        test_recipe:
          setup:
            - "A member and two AVAILABLE inventory units each to be sold at 1000 cents exist."
          setup_api_calls:
            - call: "POST /members"
              payload: { full_name: "Sam", email: "sam@x.com" }
              as: Clerk
              captures: { m_id: $.data.id }
            - call: "POST /products"
              payload: { title: "Used Cart", kind: "GAME", base_price_cents: 1000, base_trade_value_cents: 500 }
              as: Clerk
              captures: { p_id: $.data.id }
            - call: "POST /products/${p_id}/inventory-items"
              payload: { condition_grade: "B" }
              as: Clerk
              captures: { it1: $.data.id }
            - call: "POST /products/${p_id}/inventory-items"
              payload: { condition_grade: "B" }
              as: Clerk
              captures: { it2: $.data.id }
          trigger:
            - call: "POST /sales"
              payload: { member_id: "${m_id}", lines: [ { inventory_item_id: "${it1}", unit_price_cents: 1000, qty: 1 }, { inventory_item_id: "${it2}", unit_price_cents: 1000, qty: 1 } ] }
              as: Clerk
              captures: { s_id: $.data.id, tax: $.data.tax_total_cents }
          assert:
            - "Sale.${s_id}.subtotal_cents == 2000"
            - "Sale.${s_id}.tax_total_cents == 146"
            - "Sale.${s_id}.total_cents == 2146"

      - name: loyalty_points_tiered_with_cap_and_credit_exclusion
        grounds:
          - calculations.loyalty_points_earned
          - entities.Member.fields.tier
          - entities.Member.fields.loyalty_points
          - entities.Sale.fields.redeem_store_credit_cents
        distinguishing_aspect: "Mode (a) >=3-input non-linear formula: GOLD tier rate 2.0, a redeemed store-credit portion that earns nothing, and the 5000-point cap interact so a 300000-cash-portion sale yields raw 6000 clamped to 5000 — a different combinatorial mode than the sale_tax rounding-order instance."
        test_recipe:
          setup:
            - "A GOLD member granted 21750 store credit exists; one AVAILABLE unit priced 300000."
          setup_api_calls:
            - call: "POST /members"
              payload: { full_name: "Gina", email: "gina@x.com", tier: "GOLD" }
              as: Clerk
              captures: { m_id: $.data.id }
            - call: "POST /members/${m_id}/store-credit/adjustments"
              payload: { amount_cents: 21750 }
              as: Manager
            - call: "POST /products"
              payload: { title: "Rare Console", kind: "CONSOLE", base_price_cents: 300000, base_trade_value_cents: 100000 }
              as: Clerk
              captures: { p_id: $.data.id }
            - call: "POST /products/${p_id}/inventory-items"
              payload: { condition_grade: "A" }
              as: Clerk
              captures: { it1: $.data.id }
          trigger:
            - call: "POST /sales"
              payload: { member_id: "${m_id}", lines: [ { inventory_item_id: "${it1}", unit_price_cents: 300000, qty: 1 } ], redeem_store_credit_cents: 21750 }
              as: Clerk
              captures: { s_id: $.data.id, pts: $.data.loyalty_points_earned }
          assert:
            - "Sale.${s_id}.total_cents == 321750"
            - "Sale.${s_id}.amount_due_cents == 300000"
            - "Sale.${s_id}.loyalty_points_earned == 5000"
            - "Member.${m_id}.loyalty_points == 5000"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: preorder_payment_and_allocation_dimensions_evolve_independently
        grounds:
          - state_machines.PreOrder.payment_status
          - state_machines.PreOrder.allocation_status
          - entities.PreOrder.fields.payment_status
          - entities.PreOrder.fields.allocation_status
        distinguishing_aspect: "PreOrder has two parallel dimensions: a WAITLISTED (allocation) pre-order can advance payment to DEPOSIT_PAID independently, so the pair (allocation_status=WAITLISTED, payment_status=DEPOSIT_PAID) is reachable — a non-linear parallel machine on PreOrder, distinct from TradeIn's cycle."
        test_recipe:
          setup:
            - "An EMBARGOED pool (deposit 2000, unit_price 6000, total 2) exists so a new pre-order is WAITLISTED."
          setup_api_calls:
            - call: "POST /members"
              payload: { full_name: "Pat", email: "pat@x.com" }
              as: Clerk
              captures: { m_id: $.data.id }
            - call: "POST /products"
              payload: { title: "New Release", kind: "GAME", base_price_cents: 6000, base_trade_value_cents: 3000 }
              as: Clerk
              captures: { p_id: $.data.id }
            - call: "POST /products/${p_id}/stocks"
              payload: { unit_price_cents: 6000, deposit_cents: 2000, total_count: 2 }
              as: Manager
              captures: { st_id: $.data.id, st_v: $.data.version }
            - call: "POST /pre-orders"
              payload: { member_id: "${m_id}", product_stock_id: "${st_id}", expected_product_stock_version: "${st_v}" }
              as: Clerk
              captures: { po_id: $.data.id, alloc0: $.data.allocation_status }
          trigger:
            - call: "POST /pre-orders/${po_id}/payments"
              payload: { amount_cents: 2000 }
              as: Clerk
              captures: { pay: $.data.payment_status, alloc1: $.data.allocation_status }
          assert:
            - "PreOrder.${po_id}.allocation_status == WAITLISTED"
            - "PreOrder.${po_id}.payment_status == DEPOSIT_PAID"
            - "PreOrder.${po_id}.amount_paid_cents == 2000"

      - name: tradein_offered_disputed_regrade_cycle
        grounds:
          - state_machines.TradeIn.OFFERED_to_DISPUTED
          - state_machines.TradeIn.DISPUTED_to_OFFERED
          - entities.TradeIn.fields.status
          - entities.TradeIn.fields.final_grade
        distinguishing_aspect: "TradeIn cycles OFFERED -> DISPUTED -> OFFERED via dispute then re-grade, returning to OFFERED with an overwritten final_grade (B on re-grade); a genuine cyclic machine on a different entity than PreOrder's parallel machine."
        test_recipe:
          setup:
            - "A submitted trade-in (base 10000, stated D, STORE_CREDIT) graded to C then disputed."
          setup_api_calls:
            - call: "POST /members"
              payload: { full_name: "Cy", email: "cy@x.com" }
              as: Clerk
              captures: { m_id: $.data.id }
            - call: "POST /products"
              payload: { title: "Disc Game", kind: "GAME", base_price_cents: 5000, base_trade_value_cents: 10000 }
              as: Clerk
              captures: { p_id: $.data.id }
            - call: "POST /trade-ins"
              payload: { member_id: "${m_id}", product_id: "${p_id}", stated_grade: "D", payout_method: "STORE_CREDIT" }
              as: Clerk
              captures: { ti_id: $.data.id }
            - call: "POST /trade-ins/${ti_id}/grade"
              payload: { final_grade: "C" }
              as: Clerk
            - call: "POST /trade-ins/${ti_id}/dispute"
              payload: {}
              as: Clerk
          trigger:
            - call: "POST /trade-ins/${ti_id}/grade"
              payload: { final_grade: "B" }
              as: Clerk
              captures: { st: $.data.status, fg: $.data.final_grade, fv: $.data.final_value_cents }
          assert:
            - "TradeIn.${ti_id}.status == OFFERED"
            - "TradeIn.${ti_id}.final_grade == B"
            - "TradeIn.${ti_id}.final_value_cents == 8250"

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: cancel_allocated_preorder_promotes_waitlisted
        grounds:
          - state_machines.PreOrder.ALLOCATED_to_RELEASED
          - state_machines.PreOrder.WAITLISTED_to_ALLOCATED
          - calculations.allocation_promotion
          - calculations.stock_unit_conservation
          - entities.ProductStock.fields.available_count
        distinguishing_aspect: "Depth-3 cascade from POST /pre-orders/{id}/cancel: (1) holder A's Allocation is RELEASED and the pool's counts shift, (2) the promotion selector picks waitlisted B and creates a new Allocation, (3) B's allocation_status flips WAITLISTED->ALLOCATED — each hop caused by the prior; trigger differs from the void cascade."
        test_recipe:
          setup:
            - "A RELEASED pool with total_count=1; member A holds the single ALLOCATED unit; member B is WAITLISTED on the same pool."
          setup_api_calls:
            - call: "POST /members"
              payload: { full_name: "Alice", email: "alice@x.com" }
              as: Clerk
              captures: { a_id: $.data.id }
            - call: "POST /members"
              payload: { full_name: "Bob", email: "bob@x.com" }
              as: Clerk
              captures: { b_id: $.data.id }
            - call: "POST /products"
              payload: { title: "Hot Title", kind: "GAME", base_price_cents: 7000, base_trade_value_cents: 3000 }
              as: Clerk
              captures: { p_id: $.data.id }
            - call: "POST /products/${p_id}/stocks"
              payload: { unit_price_cents: 7000, deposit_cents: 2000, total_count: 1 }
              as: Manager
              captures: { st_id: $.data.id }
            - call: "POST /product-stocks/${st_id}/release"
              payload: {}
              as: Manager
              captures: { st_v1: $.data.version }
            - call: "POST /pre-orders"
              payload: { member_id: "${a_id}", product_stock_id: "${st_id}", expected_product_stock_version: "${st_v1}" }
              as: Clerk
              captures: { po_a: $.data.id }
            - call: "GET /product-stocks/${st_id}"
              payload: {}
              as: Clerk
              captures: { st_v2: $.data.version }
            - call: "POST /pre-orders"
              payload: { member_id: "${b_id}", product_stock_id: "${st_id}", expected_product_stock_version: "${st_v2}" }
              as: Clerk
              captures: { po_b: $.data.id, b_alloc0: $.data.allocation_status }
          trigger:
            - call: "POST /pre-orders/${po_a}/cancel"
              payload: {}
              as: Clerk
              captures: { a_alloc: $.data.allocation_status }
          assert:
            - "PreOrder.${po_a}.allocation_status == RELEASED"
            - "PreOrder.${po_b}.allocation_status == ALLOCATED"
            - "ProductStock.${st_id}.available_count == 0"
            - "ProductStock.${st_id}.allocated_count == 1"
            - "ProductStock.${st_id}.fulfilled_count == 0"

      - name: void_settled_tradein_reverses_store_credit
        grounds:
          - state_machines.TradeIn.SETTLED_to_VOIDED
          - calculations.store_credit_balance
          - entities.StoreCreditEntry.fields.reason
          - entities.Member.fields.store_credit_balance_cents
        distinguishing_aspect: "Depth-2 cascade from POST /trade-ins/{id}/void: (1) a TRADE_IN_VOID_REVERSAL StoreCreditEntry of -final_value_cents is appended, (2) the member's store_credit_balance_cents is recomputed downward — hops caused in sequence; a different trigger and conserved quantity than the allocation cascade."
        test_recipe:
          setup:
            - "A settled STORE_CREDIT trade-in (final grade A, base 10000 -> 11000 credit) leaving the member balance at 11000."
          setup_api_calls:
            - call: "POST /members"
              payload: { full_name: "Vic", email: "vic@x.com" }
              as: Clerk
              captures: { m_id: $.data.id }
            - call: "POST /products"
              payload: { title: "Collector Game", kind: "GAME", base_price_cents: 9000, base_trade_value_cents: 10000 }
              as: Clerk
              captures: { p_id: $.data.id }
            - call: "POST /trade-ins"
              payload: { member_id: "${m_id}", product_id: "${p_id}", stated_grade: "A", payout_method: "STORE_CREDIT" }
              as: Clerk
              captures: { ti_id: $.data.id }
            - call: "POST /trade-ins/${ti_id}/grade"
              payload: { final_grade: "A" }
              as: Clerk
              captures: { fv: $.data.final_value_cents }
            - call: "POST /trade-ins/${ti_id}/accept"
              payload: {}
              as: Clerk
          trigger:
            - call: "POST /trade-ins/${ti_id}/void"
              payload: {}
              as: Manager
              captures: { st: $.data.status }
          assert:
            - "TradeIn.${ti_id}.final_value_cents == 11000"
            - "TradeIn.${ti_id}.status == VOIDED"
            - "Member.${m_id}.store_credit_balance_cents == 0"

  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: sale_item_not_available_beats_insufficient_credit
        grounds:
          - validations[priority=7]
          - validations[priority=16]
          - errors[ERR_ITEM_NOT_AVAILABLE]
          - errors[ERR_INSUFFICIENT_STORE_CREDIT]
        distinguishing_aspect: "A sale that both targets a SOLD item (state, priority 7) and redeems more credit than the zero balance (business_fiscal, priority 16) returns ERR_ITEM_NOT_AVAILABLE — the state/fiscal category pair, distinct from the temporal/constraint pair."
        test_recipe:
          setup:
            - "A member with 0 store credit; one inventory unit already SOLD via a prior sale."
          setup_api_calls:
            - call: "POST /members"
              payload: { full_name: "Dana", email: "dana@x.com" }
              as: Clerk
              captures: { m_id: $.data.id }
            - call: "POST /products"
              payload: { title: "Single Copy", kind: "GAME", base_price_cents: 1000, base_trade_value_cents: 400 }
              as: Clerk
              captures: { p_id: $.data.id }
            - call: "POST /products/${p_id}/inventory-items"
              payload: { condition_grade: "C" }
              as: Clerk
              captures: { it1: $.data.id }
            - call: "POST /sales"
              payload: { member_id: "${m_id}", lines: [ { inventory_item_id: "${it1}", unit_price_cents: 1000, qty: 1 } ] }
              as: Clerk
          trigger:
            - call: "POST /sales"
              payload: { member_id: "${m_id}", lines: [ { inventory_item_id: "${it1}", unit_price_cents: 1000, qty: 1 } ], redeem_store_credit_cents: 500 }
              as: Clerk
              captures: { err: $.data.error_id }
          assert:
            - "response_type == error"
            - "data.error_id == ERR_ITEM_NOT_AVAILABLE"

      - name: registration_closed_beats_tournament_full
        grounds:
          - validations[priority=12]
          - validations[priority=13]
          - errors[ERR_REGISTRATION_CLOSED]
          - errors[ERR_TOURNAMENT_FULL]
        distinguishing_aspect: "A register call that is both outside the registration window (business_temporal, priority 12) and against a full tournament (business_constraint, priority 13) returns ERR_REGISTRATION_CLOSED — the temporal/constraint category pair, distinct from the state/fiscal pair."
        test_recipe:
          setup:
            - "A tournament with max_participants=1, registration window [2026-07-01T00:00:00Z, 2026-07-02T00:00:00Z); its single slot filled while the window is open; clock advanced past the window close."
          setup_api_calls:
            - call: "POST /stations"
              payload: { name: "Main Stage", seat_capacity: 8 }
              as: Manager
              captures: { stn_id: $.data.id }
            - call: "POST /tournaments"
              payload: { station_id: "${stn_id}", title: "Cup", starts_at: "2026-07-03T10:00:00Z", ends_at: "2026-07-03T12:00:00Z", registration_opens_at: "2026-07-01T00:00:00Z", registration_closes_at: "2026-07-02T00:00:00Z", max_participants: 1 }
              as: Clerk
              captures: { t_id: $.data.id }
            - call: "POST /members"
              payload: { full_name: "First", email: "first@x.com" }
              as: Clerk
              captures: { m1: $.data.id }
            - call: "POST /members"
              payload: { full_name: "Second", email: "second@x.com" }
              as: Clerk
              captures: { m2: $.data.id }
            - call: "POST /tournaments/${t_id}/register"
              payload: { member_id: "${m1}" }
              as: Clerk
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-02T06:00:00Z" }
              as: Manager
          trigger:
            - call: "POST /tournaments/${t_id}/register"
              payload: { member_id: "${m2}" }
              as: Clerk
              captures: { err: $.data.error_id }
          assert:
            - "response_type == error"
            - "data.error_id == ERR_REGISTRATION_CLOSED"

  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: rental_returned_exactly_at_due_has_zero_late_fee
        grounds:
          - calculations.rental_late_fee
          - entities.Rental.fields.late_fee_cents
          - state_machines.Rental.CHECKED_OUT_to_RETURNED
        distinguishing_aspect: "Time boundary on the return endpoint: returned_at == due_at is inclusive-on-time, so late_fee_cents == 0 and final_charge_cents == estimated_charge_cents; the metric is a datetime crossing, reachable only through POST /rentals/{id}/return."
        test_recipe:
          setup:
            - "A rental for [2026-07-02T00:00:00Z, 2026-07-05T00:00:00Z) checked out (estimated 1500); clock set exactly to due 2026-07-05T00:00:00Z."
          setup_api_calls:
            - call: "POST /members"
              payload: { full_name: "Ora", email: "ora@x.com" }
              as: Clerk
              captures: { m_id: $.data.id }
            - call: "POST /products"
              payload: { title: "Console Y", kind: "CONSOLE", base_price_cents: 15000, base_trade_value_cents: 6000, daily_rental_rate_cents: 500 }
              as: Clerk
              captures: { p_id: $.data.id }
            - call: "POST /products/${p_id}/inventory-items"
              payload: { condition_grade: "A" }
              as: Clerk
              captures: { it_id: $.data.id }
            - call: "POST /rentals"
              payload: { member_id: "${m_id}", inventory_item_id: "${it_id}", start_at: "2026-07-02T00:00:00Z", due_at: "2026-07-05T00:00:00Z" }
              as: Clerk
              captures: { r_id: $.data.id }
            - call: "POST /rentals/${r_id}/checkout"
              payload: {}
              as: Clerk
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-05T00:00:00Z" }
              as: Manager
          trigger:
            - call: "POST /rentals/${r_id}/return"
              payload: {}
              as: Clerk
              captures: { lf: $.data.late_fee_cents, fin: $.data.final_charge_cents }
          assert:
            - "Rental.${r_id}.late_fee_cents == 0"
            - "Rental.${r_id}.final_charge_cents == 1500"
            - "Rental.${r_id}.status == RETURNED"

      - name: preorder_on_empty_pool_is_waitlisted
        grounds:
          - state_machines.PreOrder.PENDING_to_WAITLISTED
          - state_machines.PreOrder.PENDING_to_ALLOCATED
          - entities.ProductStock.fields.available_count
        distinguishing_aspect: "Count boundary on the create endpoint: with available_count==0 (single unit already allocated) a new pre-order resolves to WAITLISTED rather than ALLOCATED; the metric is an empty-pool zero-count edge reachable through POST /pre-orders, distinct from the rental time boundary."
        test_recipe:
          setup:
            - "A RELEASED pool total_count=1 whose one unit is already ALLOCATED to member A, so available_count==0."
          setup_api_calls:
            - call: "POST /members"
              payload: { full_name: "Ann", email: "ann2@x.com" }
              as: Clerk
              captures: { a_id: $.data.id }
            - call: "POST /members"
              payload: { full_name: "Cam", email: "cam@x.com" }
              as: Clerk
              captures: { c_id: $.data.id }
            - call: "POST /products"
              payload: { title: "Limited", kind: "GAME", base_price_cents: 8000, base_trade_value_cents: 3000 }
              as: Clerk
              captures: { p_id: $.data.id }
            - call: "POST /products/${p_id}/stocks"
              payload: { unit_price_cents: 8000, deposit_cents: 2000, total_count: 1 }
              as: Manager
              captures: { st_id: $.data.id }
            - call: "POST /product-stocks/${st_id}/release"
              payload: {}
              as: Manager
              captures: { st_v1: $.data.version }
            - call: "POST /pre-orders"
              payload: { member_id: "${a_id}", product_stock_id: "${st_id}", expected_product_stock_version: "${st_v1}" }
              as: Clerk
              captures: { po_a: $.data.id, a_alloc: $.data.allocation_status }
            - call: "GET /product-stocks/${st_id}"
              payload: {}
              as: Clerk
              captures: { st_v2: $.data.version }
          trigger:
            - call: "POST /pre-orders"
              payload: { member_id: "${c_id}", product_stock_id: "${st_id}", expected_product_stock_version: "${st_v2}" }
              as: Clerk
              captures: { po_c: $.data.id, c_alloc: $.data.allocation_status }
          assert:
            - "PreOrder.${po_a}.allocation_status == ALLOCATED"
            - "PreOrder.${po_c}.allocation_status == WAITLISTED"
            - "ProductStock.${st_id}.available_count == 0"

  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: preorder_allocation_gated_by_stock_release_state
        grounds:
          - state_machines.PreOrder.PENDING_to_ALLOCATED
          - state_machines.PreOrder.PENDING_to_WAITLISTED
          - entities.ProductStock.fields.release_state
        distinguishing_aspect: "PreOrder's create-time resolution depends on ProductStock.release_state: on an EMBARGOED pool with units available the pre-order is WAITLISTED, not ALLOCATED — the PreOrder->ProductStock pair, distinct from the Rental->InventoryItem pair."
        test_recipe:
          setup:
            - "An EMBARGOED pool total_count=2 (units available but embargoed)."
          setup_api_calls:
            - call: "POST /members"
              payload: { full_name: "Emb", email: "emb@x.com" }
              as: Clerk
              captures: { m_id: $.data.id }
            - call: "POST /products"
              payload: { title: "Prelaunch", kind: "GAME", base_price_cents: 6000, base_trade_value_cents: 2000 }
              as: Clerk
              captures: { p_id: $.data.id }
            - call: "POST /products/${p_id}/stocks"
              payload: { unit_price_cents: 6000, deposit_cents: 1500, total_count: 2 }
              as: Manager
              captures: { st_id: $.data.id, st_v: $.data.version }
          trigger:
            - call: "POST /pre-orders"
              payload: { member_id: "${m_id}", product_stock_id: "${st_id}", expected_product_stock_version: "${st_v}" }
              as: Clerk
              captures: { po_id: $.data.id, alloc: $.data.allocation_status }
          assert:
            - "PreOrder.${po_id}.allocation_status == WAITLISTED"
            - "ProductStock.${st_id}.available_count == 2"
            - "ProductStock.${st_id}.release_state == EMBARGOED"

      - name: rental_checkout_gated_by_inventory_item_status
        grounds:
          - state_machines.Rental.RESERVED_to_CHECKED_OUT
          - state_machines.InventoryItem.AVAILABLE_to_SOLD
          - validations[priority=7]
          - errors[ERR_ITEM_NOT_AVAILABLE]
        distinguishing_aspect: "A rental checkout depends on InventoryItem.status: after the reserved unit is SOLD, checkout is rejected with ERR_ITEM_NOT_AVAILABLE — the Rental->InventoryItem pair, distinct from the PreOrder->ProductStock pair."
        test_recipe:
          setup:
            - "A rental reserved on an AVAILABLE unit; the same unit is then SOLD via a sale before checkout."
          setup_api_calls:
            - call: "POST /members"
              payload: { full_name: "Ren", email: "ren@x.com" }
              as: Clerk
              captures: { m_id: $.data.id }
            - call: "POST /products"
              payload: { title: "Console Z", kind: "CONSOLE", base_price_cents: 12000, base_trade_value_cents: 5000, daily_rental_rate_cents: 400 }
              as: Clerk
              captures: { p_id: $.data.id }
            - call: "POST /products/${p_id}/inventory-items"
              payload: { condition_grade: "A" }
              as: Clerk
              captures: { it_id: $.data.id }
            - call: "POST /rentals"
              payload: { member_id: "${m_id}", inventory_item_id: "${it_id}", start_at: "2026-07-10T00:00:00Z", due_at: "2026-07-12T00:00:00Z" }
              as: Clerk
              captures: { r_id: $.data.id }
            - call: "POST /sales"
              payload: { member_id: "${m_id}", lines: [ { inventory_item_id: "${it_id}", unit_price_cents: 12000, qty: 1 } ] }
              as: Clerk
          trigger:
            - call: "POST /rentals/${r_id}/checkout"
              payload: {}
              as: Clerk
              captures: { err: $.data.error_id }
          assert:
            - "response_type == error"
            - "data.error_id == ERR_ITEM_NOT_AVAILABLE"
            - "InventoryItem.${it_id}.status == SOLD"

  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: rental_interval_with_buffer_rejects_overlap
        grounds:
          - validations[priority=10]
          - errors[ERR_RENTAL_OVERLAP]
          - entities.Rental.fields.start_at
          - entities.Rental.fields.due_at
        distinguishing_aspect: "Rental overlap on an InventoryItem applies a 24h buffer: a second reservation starting 2026-07-05T12:00Z (< first due 2026-07-05T00:00Z + 24h) is rejected with ERR_RENTAL_OVERLAP even though the raw intervals do not touch — buffered interval semantics, distinct from the tournament's no-buffer adjacency."
        test_recipe:
          setup:
            - "An AVAILABLE unit with an active rental reserved for [2026-07-02T00:00:00Z, 2026-07-05T00:00:00Z)."
          setup_api_calls:
            - call: "POST /members"
              payload: { full_name: "Bea", email: "bea@x.com" }
              as: Clerk
              captures: { m_id: $.data.id }
            - call: "POST /products"
              payload: { title: "Console B", kind: "CONSOLE", base_price_cents: 10000, base_trade_value_cents: 4000, daily_rental_rate_cents: 300 }
              as: Clerk
              captures: { p_id: $.data.id }
            - call: "POST /products/${p_id}/inventory-items"
              payload: { condition_grade: "B" }
              as: Clerk
              captures: { it_id: $.data.id }
            - call: "POST /rentals"
              payload: { member_id: "${m_id}", inventory_item_id: "${it_id}", start_at: "2026-07-02T00:00:00Z", due_at: "2026-07-05T00:00:00Z" }
              as: Clerk
              captures: { r1: $.data.id }
          trigger:
            - call: "POST /rentals"
              payload: { member_id: "${m_id}", inventory_item_id: "${it_id}", start_at: "2026-07-05T12:00:00Z", due_at: "2026-07-08T00:00:00Z" }
              as: Clerk
              captures: { err: $.data.error_id }
          assert:
            - "response_type == error"
            - "data.error_id == ERR_RENTAL_OVERLAP"

      - name: tournament_adjacent_allowed_but_overlap_rejected
        grounds:
          - validations[priority=11]
          - errors[ERR_STATION_DOUBLE_BOOKED]
          - entities.Tournament.fields.starts_at
          - entities.Tournament.fields.ends_at
        distinguishing_aspect: "Tournament overlap on a Station uses half-open no-buffer semantics: an adjacent booking starting exactly at the prior end (12:00) succeeds, while a straddling [11:00,13:00) booking is rejected with ERR_STATION_DOUBLE_BOOKED — adjacency-allowed interval semantics on a different resource than Rental."
        test_recipe:
          setup:
            - "A station with an existing tournament [2026-07-03T10:00:00Z, 2026-07-03T12:00:00Z); an adjacent tournament [12:00,14:00) already accepted."
          setup_api_calls:
            - call: "POST /stations"
              payload: { name: "Arena", seat_capacity: 16 }
              as: Manager
              captures: { stn_id: $.data.id }
            - call: "POST /tournaments"
              payload: { station_id: "${stn_id}", title: "T1", starts_at: "2026-07-03T10:00:00Z", ends_at: "2026-07-03T12:00:00Z", registration_opens_at: "2026-07-01T00:00:00Z", registration_closes_at: "2026-07-03T09:00:00Z", max_participants: 8 }
              as: Clerk
              captures: { t1: $.data.id }
            - call: "POST /tournaments"
              payload: { station_id: "${stn_id}", title: "T2 adjacent", starts_at: "2026-07-03T12:00:00Z", ends_at: "2026-07-03T14:00:00Z", registration_opens_at: "2026-07-01T00:00:00Z", registration_closes_at: "2026-07-03T11:00:00Z", max_participants: 8 }
              as: Clerk
              captures: { t2: $.data.id }
          trigger:
            - call: "POST /tournaments"
              payload: { station_id: "${stn_id}", title: "T3 overlap", starts_at: "2026-07-03T11:00:00Z", ends_at: "2026-07-03T13:00:00Z", registration_opens_at: "2026-07-01T00:00:00Z", registration_closes_at: "2026-07-03T10:30:00Z", max_participants: 8 }
              as: Clerk
              captures: { err: $.data.error_id }
          assert:
            - "Tournament.${t2}.starts_at == 2026-07-03T12:00:00Z"
            - "response_type == error"
            - "data.error_id == ERR_STATION_DOUBLE_BOOKED"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: store_credit_conserved_across_tradein_accept_then_void
        grounds:
          - calculations.store_credit_balance
          - state_machines.TradeIn.OFFERED_to_SETTLED
          - state_machines.TradeIn.SETTLED_to_VOIDED
          - entities.Member.fields.store_credit_balance_cents
        distinguishing_aspect: "Named conserved quantity = total store credit cents (Member.store_credit_balance_cents == sum of StoreCreditEntry.amount_cents): accepting a STORE_CREDIT trade-in (+11000) then voiding it (-11000) returns the balance to its pre-settlement value 0 with the ledger summing to 0 — a monetary invariant distinct from unit-count conservation."
        test_recipe:
          setup:
            - "A member with 0 store credit; a STORE_CREDIT trade-in graded A (final 11000) and accepted (balance 11000)."
          setup_api_calls:
            - call: "POST /members"
              payload: { full_name: "Cons", email: "cons@x.com" }
              as: Clerk
              captures: { m_id: $.data.id }
            - call: "POST /products"
              payload: { title: "Grail", kind: "GAME", base_price_cents: 9000, base_trade_value_cents: 10000 }
              as: Clerk
              captures: { p_id: $.data.id }
            - call: "POST /trade-ins"
              payload: { member_id: "${m_id}", product_id: "${p_id}", stated_grade: "A", payout_method: "STORE_CREDIT" }
              as: Clerk
              captures: { ti_id: $.data.id }
            - call: "POST /trade-ins/${ti_id}/grade"
              payload: { final_grade: "A" }
              as: Clerk
            - call: "POST /trade-ins/${ti_id}/accept"
              payload: {}
              as: Clerk
          trigger:
            - call: "POST /trade-ins/${ti_id}/void"
              payload: {}
              as: Manager
          assert:
            - "Member.${m_id}.store_credit_balance_cents == 0"
            - "TradeIn.${ti_id}.status == VOIDED"

      - name: stock_units_conserved_across_allocate_then_cancel
        grounds:
          - calculations.stock_unit_conservation
          - state_machines.PreOrder.PENDING_to_ALLOCATED
          - state_machines.PreOrder.ALLOCATED_to_RELEASED
          - entities.ProductStock.fields.total_count
        distinguishing_aspect: "Named conserved quantity = physical unit count (available_count + allocated_count + fulfilled_count == total_count): allocating the single unit then cancelling restores available_count to 1 with allocated_count 0, leaving total_count invariant at 1 — a count invariant distinct from the store-credit money invariant."
        test_recipe:
          setup:
            - "A RELEASED pool total_count=1; member A holds the ALLOCATED unit (available 0, allocated 1); no waitlisted members."
          setup_api_calls:
            - call: "POST /members"
              payload: { full_name: "Uno", email: "uno@x.com" }
              as: Clerk
              captures: { a_id: $.data.id }
            - call: "POST /products"
              payload: { title: "Solo Unit", kind: "GAME", base_price_cents: 5000, base_trade_value_cents: 2000 }
              as: Clerk
              captures: { p_id: $.data.id }
            - call: "POST /products/${p_id}/stocks"
              payload: { unit_price_cents: 5000, deposit_cents: 1000, total_count: 1 }
              as: Manager
              captures: { st_id: $.data.id }
            - call: "POST /product-stocks/${st_id}/release"
              payload: {}
              as: Manager
              captures: { st_v: $.data.version }
            - call: "POST /pre-orders"
              payload: { member_id: "${a_id}", product_stock_id: "${st_id}", expected_product_stock_version: "${st_v}" }
              as: Clerk
              captures: { po_a: $.data.id }
          trigger:
            - call: "POST /pre-orders/${po_a}/cancel"
              payload: {}
              as: Clerk
          assert:
            - "ProductStock.${st_id}.available_count == 1"
            - "ProductStock.${st_id}.allocated_count == 0"
            - "ProductStock.${st_id}.fulfilled_count == 0"
            - "PreOrder.${po_a}.allocation_status == RELEASED"
