              as: Designer
              as_user_id: "${d1}"
              captures: { c1: $.data.id }
            - call: "POST /blinds/openings"
              payload: { consultation_id: "${c1}", label: "Nook", room_type: "OFFICE", mount_type: "INSIDE", width_top_in: 24.000, width_middle_in: 24.000, width_bottom_in: 24.000, height_left_in: 48.000, height_center_in: 48.000, height_right_in: 48.000, depth_in: 3.000 }
              as: Designer
              as_user_id: "${d1}"
              captures: { o1: $.data.id }
            - call: "PATCH /blinds/openings/${o1}/configuration"
              payload: { fabric_code: "LT-SHEER", lift_system: "CORDED" }
              as: Designer
              as_user_id: "${d1}"
            - call: "GET /blinds/consultations/${c1}"
              as: Designer
              as_user_id: "${d1}"
              captures: { cv1: $.data.version }
            - call: "POST /blinds/quotes"
              payload: { consultation_id: "${c1}", expected_consultation_version: "${cv1}" }
              as: Designer
              as_user_id: "${d1}"
              captures: { q1: $.data.id }
            - call: "POST /blinds/quotes/${q1}/present"
              as: Designer
              as_user_id: "${d1}"
          trigger:
            - call: "PATCH /blinds/openings/${o1}/configuration"
              payload: { fabric_code: "CL-LINEN", lift_system: "CORDLESS" }
              as: Designer
              as_user_id: "${d1}"
              captures: { err_locked: $.data.error_id }
            - call: "GET /blinds/consultations/${c1}"
              as: Designer
              as_user_id: "${d1}"
              captures: { cv2: $.data.version }
            - call: "POST /blinds/quotes"
              payload: { consultation_id: "${c1}", expected_consultation_version: "${cv2}" }
              as: Designer
              as_user_id: "${d1}"
              captures: { q2: $.data.id }
            - call: "PATCH /blinds/openings/${o1}/configuration"
              payload: { fabric_code: "CL-LINEN", lift_system: "CORDLESS" }
              as: Designer
              as_user_id: "${d1}"
              captures: { err_locked_again: $.data.error_id }
          assert:
            - "while the first quote holds it, re-configuring the opening fails 409 with error_id == ERR_OPENING_NOT_MEASURED (measure_status QUOTED)"
            - "creating the second quote returns 201 and Quote.${q1}.status == SUPERSEDED - a terminal state reached with no explicit endpoint of its own"
            - "the opening was released and re-attached inside that one request: Opening.${o1}.quote_id == ${q2} with measure_status QUOTED again, and Quote.${q2}.opening_count == 1 while Quote.${q1}.opening_count == 1 records what it once carried"
