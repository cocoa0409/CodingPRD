      - name: entry_site_mismatch_outranks_allocation_exceeds_unrouted
        grounds: "§1.4 validations[priority=80] ERR_ENTRY_SITE_MISMATCH (business_referential) versus validations[priority=95] ERR_ALLOCATION_EXCEEDS_UNROUTED (business_constraint); §1.3 calculations.routed_weight_allocation."
        distinguishing_aspect: "Pair (business_referential, business_constraint) — a third, disjoint category pairing, and the only instance of the three whose loser is an arithmetic guard on a field of the referenced row rather than a rule about the request. Both calls are made as ShiftLead so the priority-50 site-scope rule is out of scope and cannot pre-empt the pair; a COMPOST channel keeps priority 75 and 85 out of scope too."
