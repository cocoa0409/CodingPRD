              payload: { start_hour_index: 0, end_hour_index: 1080, invalidation_code: "QC_FAILURE", expected_data_batch_version: "${b_v}" }
              as: QaOfficer
              as_user_id: "qa-1"
              captures: { inv_id: "$.data.id" }
            - call: "GET /data-batches/${b25q1_id}"
