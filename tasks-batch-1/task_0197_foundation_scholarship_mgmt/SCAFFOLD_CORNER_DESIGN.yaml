        claim_type: Precondition Enforcement
        grounds: ["state_machines.Award.COMMITTED_to_REVOKED", "errors[ERR_AWARD_ALREADY_DISBURSED]"]
        distinguishing_aspect: "Revoke is only legal from COMMITTED; once an award is ACTIVE with a SETTLED disbursement it is no longer COMMITTED, so revoke returns ERR_AWARD_STATE_INVALID. To exercise ERR_AWARD_ALREADY_DISBURSED specifically, the guard fires when status is still COMMITTED but a SETTLED disbursement exists, which cannot occur here; this corner asserts the state guard instead."
        excluded_because:
          difficulty_instance: transitive_cascade / settled_disbursement_return_cascade_depth3
          rationale: "The SETTLED-disbursement-blocks-teardown path is exercised by the depth-3 cascade instance; a standalone COMMITTED+SETTLED state is unreachable because disburse moves the award out of COMMITTED, so ERR_AWARD_ALREADY_DISBURSED has no reachable trigger and the only observable here is the state guard already tested in §1.8."

