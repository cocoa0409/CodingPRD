# =============================================================================
# §1.9 Scaffold Corner Design — task_2275_gypsum_wallboard_plant_operations
# Breadth probe over SCAFFOLD.yaml §1.1-§1.7, walked section-by-section against
# references/claim-extraction-guide.md. Corners already asserted by a §1.8
# instance are emitted as `excluded_because:` stubs naming that instance.
# Every one of the 46 error codes in §1.6 is triggered by an instance here or
# by the cited §1.8 instance.
# =============================================================================

scaffold_corner_design:

  - section: entities
    instances:

      - name: plant_create_returns_all_fields_and_computed_defaults
        claim_type: creation
        grounds:
          - entities.Plant
          - endpoints[POST /plant-ops/plants]
          - calculations.plant_production_posture
        distinguishing_aspect: |
          A plant created with every optional threshold supplied returns 201 with the inputs echoed,
          all computed silo fields at 0.000, held_run_count 0, version 1 and production_posture
          RESTRICTED (an empty silo is below the 40.0 t availability floor, so posture is not OPEN).
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "POST /plant-ops/plants"
              payload: { code: "GYP-2", name: "Platte Valley Wallboard", calciner_capacity_tph: 45, stucco_silo_capacity_tons: 900, natural_gypsum_purity_floor_pct: 90.0, synthetic_free_moisture_ceiling_pct: 11.0, energy_price_per_mmbtu: 3.80, contribution_margin_per_msf: 41.25 }
              as: PlantAdmin
              captures: { plant_id: $.data.id }
          assert:
            - "response status == 201 and response_type == 'object'"
            - "Plant.${plant_id}.code == 'GYP-2' and name == 'Platte Valley Wallboard'"
            - "Plant.${plant_id}.calciner_capacity_tph == 45 and stucco_silo_capacity_tons == 900"
            - "Plant.${plant_id}.natural_gypsum_purity_floor_pct == 90.0 and synthetic_free_moisture_ceiling_pct == 11.0"
            - "Plant.${plant_id}.energy_price_per_mmbtu == 3.80 and contribution_margin_per_msf == 41.25"
            - "Plant.${plant_id}.stucco_on_hand_tons == 0.000, stucco_committed_tons == 0.000, stucco_available_tons == 0.000"
            - "Plant.${plant_id}.held_run_count == 0 and production_posture == RESTRICTED"
            - "Plant.${plant_id}.version == 1 and id, created_at, updated_at are server-minted"

      - name: gypsum_lot_get_returns_stored_assay_values
        claim_type: retrieval
        grounds:
          - entities.GypsumLot
          - endpoints[GET /plant-ops/gypsum-lots/{lotId}]
        distinguishing_aspect: |
          GET on a lot that has been assayed once returns the assay snapshot (free_moisture_pct,
          purity_pct, chloride_ppm), the disposition, assay_count 1, remaining_tons equal to
          received_tons and version 2 — the read never recomputes the disposition.
        test_recipe:
          setup:
            - "Plant GYP-1 with a 300.000 t synthetic lot assayed once at 9.40 % moisture and 94.0 % purity."
          setup_api_calls:
            - call: "POST /plant-ops/plants"
              payload: { code: "GYP-1", name: "Front Range Wallboard", calciner_capacity_tph: 60, stucco_silo_capacity_tons: 1200, energy_price_per_mmbtu: 4.20, contribution_margin_per_msf: 38.50 }
              as: PlantAdmin
              captures: { plant_id: $.data.id }
            - call: "POST /plant-ops/gypsum-lots"
              payload: { plant_id: "${plant_id}", source_type: "SYNTHETIC", supplier_name: "Comanche FGD", received_tons: 300.000, declared_free_moisture_pct: 9.50, declared_purity_pct: 94.0 }
              as: MaterialsController
              captures: { lot_id: $.data.id }
            - call: "POST /plant-ops/gypsum-lots/${lot_id}/assay"
              payload: { free_moisture_pct: 9.40, purity_pct: 94.0, chloride_ppm: 120 }
              as: MaterialsController
          trigger:
            - call: "GET /plant-ops/gypsum-lots/${lot_id}"
              payload: {}
              as: ProductionScheduler
          assert:
            - "response status == 200"
            - "GypsumLot.${lot_id}.source_type == SYNTHETIC and supplier_name == 'Comanche FGD'"
            - "GypsumLot.${lot_id}.free_moisture_pct == 9.40 and purity_pct == 94.0 and chloride_ppm == 120"
            - "GypsumLot.${lot_id}.declared_free_moisture_pct == 9.50 and declared_purity_pct == 94.0"
            - "GypsumLot.${lot_id}.status == APPROVED and quarantine_reason == null and assay_count == 1"
            - "GypsumLot.${lot_id}.received_tons == 300.000, consumed_tons == 0.000, remaining_tons == 300.000"
            - "GypsumLot.${lot_id}.assayed_at == '2026-08-01T00:00:00.000Z' and version == 2"

      - name: production_run_list_paginates_with_total_count_and_has_more
        claim_type: listing
        grounds:
          - endpoints[GET /plant-ops/production-runs]
          - response_envelope.pagination_fields
        distinguishing_aspect: |
          Three DRAFT runs on one line, listed with limit 2 / offset 0, return exactly 2 rows with
          total_count 3 and has_more true; offset 2 returns the last row with has_more false; the
          plant_id filter and the status filter both narrow the same collection.
        test_recipe:
          setup:
            - "Plant GYP-1, LINE-1, REGULAR SKU and a PLANNED batch (a run only needs its batch to exist at draft time)."
            - "Three runs drafted on non-overlapping windows; none scheduled."
          setup_api_calls:
            - call: "POST /plant-ops/plants"
              payload: { code: "GYP-1", name: "Front Range Wallboard", calciner_capacity_tph: 60, stucco_silo_capacity_tons: 1200, energy_price_per_mmbtu: 4.20, contribution_margin_per_msf: 38.50 }
              as: PlantAdmin
              captures: { plant_id: $.data.id }
            - call: "POST /plant-ops/plants/${plant_id}/board-lines"
              payload: { designation: "LINE-1", max_speed_fpm: 500, web_width_in: 54.0 }
              as: PlantAdmin
              captures: { line_id: $.data.id }
            - call: "POST /plant-ops/plants/${plant_id}/product-specs"
              payload: { sku_code: "REG-050-4X12", thickness_in: 0.5, board_type: "REGULAR", fire_rated: false, board_width_in: 48.0, board_length_ft: 12.0, target_board_weight_lb_per_msf: 1600.0, stucco_lb_per_msf: 1350.0, slurry_water_stucco_ratio: 0.75, line_speed_max_fpm: 480, paper_tension_min_lb: 28.0, paper_tension_max_lb: 46.0, core_hardness_min_lbf: 15.0, nail_pull_min_lbf: 77.0, flexural_cross_min_lbf: 36.0, max_boards_per_bundle: 48, changeover_family: "STANDARD" }
              as: PlantAdmin
              captures: { spec_reg_id: $.data.id }
            - call: "POST /plant-ops/calciner-batches"
              payload: { plant_id: "${plant_id}", target_stucco_tons: 100.000, calcination_temp_f: 320.0, feed_rate_tph: 20.0, feed_window_start: "2026-08-02T08:00:00Z", feed_window_end: "2026-08-02T13:00:00Z" }
              as: MaterialsController
              captures: { b_id: $.data.id }
            - call: "POST /plant-ops/production-runs"
              payload: { plant_id: "${plant_id}", line_id: "${line_id}", product_spec_id: "${spec_reg_id}", calciner_batch_id: "${b_id}", window_start: "2026-08-03T06:00:00Z", window_end: "2026-08-03T10:00:00Z", requested_planned_msf: 100.000, line_speed_fpm: 400, paper_tension_lb: 38.0, kiln_dwell_minutes: 40, kiln_exit_moisture_target_pct: 0.50 }
              as: ProductionScheduler
              captures: { r1_id: $.data.id }
            - call: "POST /plant-ops/production-runs"
              payload: { plant_id: "${plant_id}", line_id: "${line_id}", product_spec_id: "${spec_reg_id}", calciner_batch_id: "${b_id}", window_start: "2026-08-04T06:00:00Z", window_end: "2026-08-04T10:00:00Z", requested_planned_msf: 100.000, line_speed_fpm: 400, paper_tension_lb: 38.0, kiln_dwell_minutes: 40, kiln_exit_moisture_target_pct: 0.50 }
              as: ProductionScheduler
              captures: { r2_id: $.data.id }
            - call: "POST /plant-ops/production-runs"
              payload: { plant_id: "${plant_id}", line_id: "${line_id}", product_spec_id: "${spec_reg_id}", calciner_batch_id: "${b_id}", window_start: "2026-08-05T06:00:00Z", window_end: "2026-08-05T10:00:00Z", requested_planned_msf: 100.000, line_speed_fpm: 400, paper_tension_lb: 38.0, kiln_dwell_minutes: 40, kiln_exit_moisture_target_pct: 0.50 }
              as: ProductionScheduler
              captures: { r3_id: $.data.id }
          trigger:
            - call: "GET /plant-ops/production-runs"
              payload: { plant_id: "${plant_id}", limit: 2, offset: 0 }
              as: ProductionScheduler
            - call: "GET /plant-ops/production-runs"
              payload: { plant_id: "${plant_id}", limit: 2, offset: 2 }
              as: ProductionScheduler
            - call: "GET /plant-ops/production-runs"
              payload: { status: "SCHEDULED" }
              as: ProductionScheduler
          assert:
            - "the first list returns exactly 2 items with total_count == 3 and has_more == true"
            - "the second list returns exactly 1 item with total_count == 3 and has_more == false"
            - "the status == SCHEDULED list returns 0 items with total_count == 0 and has_more == false"
            - "every returned run has status == DRAFT, quality_state == UNTESTED and saleable_grade == UNGRADED"
            - "response_type == 'array' on all three reads"

      - name: unknown_ids_return_entity_specific_not_found_codes
        claim_type: not_found
        grounds:
          - errors[ERR_PLANT_NOT_FOUND]
          - errors[ERR_LOT_NOT_FOUND]
          - errors[ERR_BATCH_NOT_FOUND]
          - errors[ERR_RUN_NOT_FOUND]
          - errors[ERR_OUTAGE_NOT_FOUND]
          - errors[ERR_LOAD_ORDER_NOT_FOUND]
        distinguishing_aspect: |
          Each path-parameter family maps to its own 404 code rather than a generic not-found: the same
          syntactically valid but unknown UUID returns ERR_PLANT_NOT_FOUND, ERR_LOT_NOT_FOUND,
          ERR_BATCH_NOT_FOUND, ERR_RUN_NOT_FOUND, ERR_OUTAGE_NOT_FOUND and ERR_LOAD_ORDER_NOT_FOUND
          depending on which collection the id was addressed in.
        test_recipe:
          setup:
            - "Empty database; no entity carries the probe UUID 8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2."
          setup_api_calls: []
          trigger:
            - call: "GET /plant-ops/plants/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              payload: {}
              as: PlantAdmin
              captures: { err_plant: $.data.error_id }
            - call: "GET /plant-ops/gypsum-lots/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              payload: {}
              as: MaterialsController
              captures: { err_lot: $.data.error_id }
            - call: "GET /plant-ops/calciner-batches/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              payload: {}
              as: MaterialsController
              captures: { err_batch: $.data.error_id }
            - call: "GET /plant-ops/production-runs/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              payload: {}
              as: ProductionScheduler
              captures: { err_run: $.data.error_id }
            - call: "GET /plant-ops/maintenance-outages/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              payload: {}
              as: MaintenancePlanner
              captures: { err_outage: $.data.error_id }
            - call: "GET /plant-ops/load-orders/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              payload: {}
              as: ProductionScheduler
              captures: { err_load: $.data.error_id }
          assert:
            - "every call returned status 404 with response_type == 'error'"
            - "${err_plant} == ERR_PLANT_NOT_FOUND"
            - "${err_lot} == ERR_LOT_NOT_FOUND"
            - "${err_batch} == ERR_BATCH_NOT_FOUND"
            - "${err_run} == ERR_RUN_NOT_FOUND"
            - "${err_outage} == ERR_OUTAGE_NOT_FOUND"
            - "${err_load} == ERR_LOAD_ORDER_NOT_FOUND"
            - "each error body carries data.error_id and data.message and no data.id"

      - name: create_production_run_missing_kiln_dwell_returns_invalid_request
        claim_type: required_fields
        grounds:
          - endpoints[POST /plant-ops/production-runs]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: |
          kiln_dwell_minutes is a required input with no default, so omitting it returns
          ERR_INVALID_REQUEST (400) before any capacity, tension or kiln feasibility work runs and no
          ProductionRun row is created.
        test_recipe:
          setup:
            - "Plant GYP-1, LINE-1, REGULAR SKU and a PLANNED batch."
          setup_api_calls:
            - call: "POST /plant-ops/plants"
              payload: { code: "GYP-1", name: "Front Range Wallboard", calciner_capacity_tph: 60, stucco_silo_capacity_tons: 1200, energy_price_per_mmbtu: 4.20, contribution_margin_per_msf: 38.50 }
              as: PlantAdmin
              captures: { plant_id: $.data.id }
            - call: "POST /plant-ops/plants/${plant_id}/board-lines"
              payload: { designation: "LINE-1", max_speed_fpm: 500, web_width_in: 54.0 }
              as: PlantAdmin
              captures: { line_id: $.data.id }
            - call: "POST /plant-ops/plants/${plant_id}/product-specs"
              payload: { sku_code: "REG-050-4X12", thickness_in: 0.5, board_type: "REGULAR", fire_rated: false, board_width_in: 48.0, board_length_ft: 12.0, target_board_weight_lb_per_msf: 1600.0, stucco_lb_per_msf: 1350.0, slurry_water_stucco_ratio: 0.75, line_speed_max_fpm: 480, paper_tension_min_lb: 28.0, paper_tension_max_lb: 46.0, core_hardness_min_lbf: 15.0, nail_pull_min_lbf: 77.0, flexural_cross_min_lbf: 36.0, max_boards_per_bundle: 48, changeover_family: "STANDARD" }
              as: PlantAdmin
              captures: { spec_reg_id: $.data.id }
            - call: "POST /plant-ops/calciner-batches"
              payload: { plant_id: "${plant_id}", target_stucco_tons: 100.000, calcination_temp_f: 320.0, feed_rate_tph: 20.0, feed_window_start: "2026-08-02T08:00:00Z", feed_window_end: "2026-08-02T13:00:00Z" }
              as: MaterialsController
              captures: { b_id: $.data.id }
          trigger:
            - call: "POST /plant-ops/production-runs"
              payload: { plant_id: "${plant_id}", line_id: "${line_id}", product_spec_id: "${spec_reg_id}", calciner_batch_id: "${b_id}", window_start: "2026-08-03T06:00:00Z", window_end: "2026-08-03T10:00:00Z", requested_planned_msf: 100.000, line_speed_fpm: 400, paper_tension_lb: 38.0, kiln_exit_moisture_target_pct: 0.50 }
              as: ProductionScheduler
              captures: { err_id: $.data.error_id }
          assert:
            - "response status == 400 and ${err_id} == ERR_INVALID_REQUEST"
            - "GET /plant-ops/production-runs?plant_id=${plant_id} returns total_count == 0"

      - name: market_backhaul_credit_defaults_to_zero
        claim_type: defaults
        grounds:
          - entities.Market.fields.backhaul_credit_usd
          - endpoints[POST /plant-ops/markets]
        distinguishing_aspect: |
          backhaul_credit_usd is the only optional Market input; omitting it stores 0.00 (not null),
          so a settled load that ships with backhaul true against this market receives no credit.
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "POST /plant-ops/markets"
              payload: { name: "Cheyenne", distance_miles: 100, fuel_surcharge_pct: 12.0, min_charge_usd: 250.00 }
              as: PlantAdmin
              captures: { market_id: $.data.id }
          assert:
            - "response status == 201"
            - "Market.${market_id}.backhaul_credit_usd == 0.00"
            - "Market.${market_id}.rate_zone == ZONE_1 and base_rate_per_msf == 8.50"
            - "Market.${market_id}.version == 1"

      - name: plant_assay_threshold_defaults_applied_when_omitted
        claim_type: defaults
        grounds:
          - entities.Plant.fields.synthetic_free_moisture_ceiling_pct
          - entities.Plant.fields.natural_gypsum_purity_floor_pct
        excluded_because:
          difficulty_instance: boundary_precision_check / synthetic_moisture_ceiling_exact_vs_one_hundredth_over
          rationale: "That instance creates the plant without either threshold and asserts the 12.0 default is the value the assay disposition compares against."

      - name: market_rate_zone_and_base_rate_are_computed_from_distance
        claim_type: computed_fields
        grounds:
          - entities.Market.fields.rate_zone
          - entities.Market.fields.base_rate_per_msf
          - calculations.freight_charge
        distinguishing_aspect: |
          rate_zone and base_rate_per_msf are computed from distance_miles alone at creation, so four
          markets at 100, 200, 500 and 640 miles land in ZONE_1 8.50, ZONE_2 12.75, ZONE_3 17.40 and
          ZONE_4 23.10 without the client supplying either field.
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "POST /plant-ops/markets"
              payload: { name: "Local", distance_miles: 100, fuel_surcharge_pct: 12.0, min_charge_usd: 250.00, backhaul_credit_usd: 40.00 }
              as: PlantAdmin
              captures: { m1: $.data.id }
            - call: "POST /plant-ops/markets"
              payload: { name: "Regional", distance_miles: 200, fuel_surcharge_pct: 14.0, min_charge_usd: 300.00, backhaul_credit_usd: 40.00 }
              as: PlantAdmin
              captures: { m2: $.data.id }
            - call: "POST /plant-ops/markets"
              payload: { name: "Interstate", distance_miles: 500, fuel_surcharge_pct: 16.0, min_charge_usd: 380.00, backhaul_credit_usd: 50.00 }
              as: PlantAdmin
              captures: { m3: $.data.id }
            - call: "POST /plant-ops/markets"
              payload: { name: "Denver Metro", distance_miles: 640, fuel_surcharge_pct: 18.5, min_charge_usd: 425.00, backhaul_credit_usd: 60.00 }
              as: PlantAdmin
              captures: { m4: $.data.id }
          assert:
            - "Market.${m1}.rate_zone == ZONE_1 and base_rate_per_msf == 8.50"
            - "Market.${m2}.rate_zone == ZONE_2 and base_rate_per_msf == 12.75"
            - "Market.${m3}.rate_zone == ZONE_3 and base_rate_per_msf == 17.40"
            - "Market.${m4}.rate_zone == ZONE_4 and base_rate_per_msf == 23.10"

      - name: stucco_test_stamps_recording_user_and_logical_clock
        claim_type: system_fields
        grounds:
          - entities.StuccoTest.fields.recorded_by_user_id
          - entities.StuccoTest.fields.tested_at
          - endpoints[POST /plant-ops/_clock/set_current_utc]
        distinguishing_aspect: |
          recorded_by_user_id comes from the X-User-ID header and tested_at from the logical clock,
          never from wall-clock time: with the clock moved to 2026-08-02T09:30:00Z the sample records
          exactly that instant, and the client cannot supply either field.
        test_recipe:
          setup:
            - "Plant GYP-1 with one 100.000 t lot assayed at the default clock; batch BM fed and closed, so it is CALCINING."
            - "The logical clock is then set to 2026-08-02T09:30:00Z."
          setup_api_calls:
            - call: "POST /plant-ops/plants"
              payload: { code: "GYP-1", name: "Front Range Wallboard", calciner_capacity_tph: 60, stucco_silo_capacity_tons: 1200, energy_price_per_mmbtu: 4.20, contribution_margin_per_msf: 38.50 }
              as: PlantAdmin
              captures: { plant_id: $.data.id }
            - call: "POST /plant-ops/gypsum-lots"
              payload: { plant_id: "${plant_id}", source_type: "SYNTHETIC", supplier_name: "Pawnee FGD", received_tons: 100.000, declared_free_moisture_pct: 10.00, declared_purity_pct: 90.0 }
              as: MaterialsController
              captures: { lot_m_id: $.data.id }
            - call: "POST /plant-ops/gypsum-lots/${lot_m_id}/assay"
              payload: { free_moisture_pct: 10.00, purity_pct: 90.0, chloride_ppm: 100 }
              as: MaterialsController
              captures: { lot_m_v: $.data.version }
            - call: "POST /plant-ops/calciner-batches"
              payload: { plant_id: "${plant_id}", target_stucco_tons: 80.000, calcination_temp_f: 320.0, feed_rate_tph: 25.0, feed_window_start: "2026-08-02T08:00:00Z", feed_window_end: "2026-08-02T12:00:00Z" }
              as: MaterialsController
              captures: { bm_id: $.data.id }
            - call: "POST /plant-ops/calciner-batches/${bm_id}/feeds"
              payload: { lot_id: "${lot_m_id}", tons_fed: 100.000, measured_free_moisture_pct: 10.00, expected_lot_version: "${lot_m_v}" }
              as: MaterialsController
            - call: "POST /plant-ops/calciner-batches/${bm_id}/close-feed"
              payload: {}
              as: MaterialsController
            - call: "POST /plant-ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-02T09:30:00Z" }
              as: PlantAdmin
          trigger:
            - call: "POST /plant-ops/calciner-batches/${bm_id}/stucco-tests"
              payload: { sample_seq: 1, combined_water_pct: 5.60, free_water_pct: 0.18, set_time_minutes: 7.50, normal_consistency_cc: 78.0 }
              as: QualityInspector
              as_user_id: "u_qi_1"
              captures: { st_id: $.data.id }
          assert:
            - "response status == 201"
            - "StuccoTest.${st_id}.recorded_by_user_id == 'u_qi_1'"
            - "StuccoTest.${st_id}.tested_at == '2026-08-02T09:30:00.000Z'"
            - "StuccoTest.${st_id}.result == PASS and batch_id == ${bm_id}"
            - "CalcinerBatch.${bm_id}.status == COMPLETED and stucco_yield_actual_tons == 77.340"
            - "Plant.${plant_id}.stucco_on_hand_tons == 77.340"

      - name: stucco_test_is_append_only_without_version_field
        claim_type: immutability
        grounds:
          - entities.StuccoTest
          - endpoints[GET /plant-ops/stucco-tests/{stuccoTestId}]
          - endpoints[GET /plant-ops/stucco-tests]
        distinguishing_aspect: |
          StuccoTest declares common_fields false, so the row carries only id and created_at — no
          version, no updated_at — and §1.5 exposes no update or delete endpoint for it; a second
          sample is a new row rather than an edit of the first.
        test_recipe:
          setup:
            - "Plant GYP-1, lot and batch BM as in the compact chain; batch CALCINING."
          setup_api_calls:
            - call: "POST /plant-ops/plants"
              payload: { code: "GYP-1", name: "Front Range Wallboard", calciner_capacity_tph: 60, stucco_silo_capacity_tons: 1200, energy_price_per_mmbtu: 4.20, contribution_margin_per_msf: 38.50 }
              as: PlantAdmin
              captures: { plant_id: $.data.id }
            - call: "POST /plant-ops/gypsum-lots"
              payload: { plant_id: "${plant_id}", source_type: "SYNTHETIC", supplier_name: "Pawnee FGD", received_tons: 100.000, declared_free_moisture_pct: 10.00, declared_purity_pct: 90.0 }
              as: MaterialsController
              captures: { lot_m_id: $.data.id }
            - call: "POST /plant-ops/gypsum-lots/${lot_m_id}/assay"
