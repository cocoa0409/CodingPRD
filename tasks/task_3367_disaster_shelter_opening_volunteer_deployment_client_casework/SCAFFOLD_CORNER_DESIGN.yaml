              as: RegionalCoordinator
          trigger:
            - call: "POST /api/v1/shelter-operations"
              payload: { shelter_site_id: "${site_gl}", disaster_relief_operation_id: "${op_nw}" }
              as: RegionalCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "the response is 409 with error_id == ERR_REGION_MISMATCH"

      - name: blood_collection_over_target_rejected
        claim_type: violation_to_error
        grounds:
          - "errors[ERR_COLLECTION_TARGET_EXCEEDED]"
          - "entities.BloodDrive.fields.target_units"
        distinguishing_aspect: "Recording 60 units against a 100-unit target drive already holding 50 collected units is rejected, while a 50-unit collection exactly reaching the target is accepted."
        test_recipe:
          setup: ["region GL with an active drive at VFW Hall, target_units 100, 50 units already collected, clock inside the window"]
          setup_api_calls:
            - call: "POST /api/v1/regions"
              payload: { code: "GL", name: "Great Lakes", state_codes: ["MI", "OH"], coordinator_user_id: "rc_gl", volunteer_pool_target: 40, authorized_agency_codes: ["SALVATION_ARMY"] }
              as: NationalHQAdmin
              captures: { reg_gl: $.data.id }
            - call: "POST /api/v1/blood-drives"
              payload: { region_id: "${reg_gl}", site_name: "VFW Hall", scheduled_start_at: "2026-09-01T08:00:00Z", scheduled_end_at: "2026-09-01T18:00:00Z", target_units: 100 }
              as: BloodServicesCoordinator
              captures: { d1: $.data.id }
            - call: "POST /api/v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T12:00:00Z" }
              as: NationalHQAdmin
            - call: "POST /api/v1/blood-drives/${d1}/collections"
              payload: { units: 50 }
              as: BloodServicesCoordinator
              captures: { collected: $.data.collected_units }
          trigger:
            - call: "POST /api/v1/blood-drives/${d1}/collections"
              payload: { units: 60 }
              as: BloodServicesCoordinator
              captures: { err: $.data.error_id }
            - call: "POST /api/v1/blood-drives/${d1}/collections"
              payload: { units: 50 }
              as: BloodServicesCoordinator
              captures: { collected_final: $.data.collected_units, usable_final: $.data.usable_units }
          assert:
            - "BloodDrive.${d1}.collected_units == 50 before the trigger"
            - "the 60-unit collection returns 409 with error_id ERR_COLLECTION_TARGET_EXCEEDED"
            - "the 50-unit collection is accepted with collected_units == 100, exactly the target"
            - "usable_units == 93 (100 - floor(100 * 700 / 10000))"

