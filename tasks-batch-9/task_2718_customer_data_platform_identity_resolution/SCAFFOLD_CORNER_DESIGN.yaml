            - "Activation.${act_id}.status == DRAFT"
            - "Activation.${act_id}.candidate_count == 0 and audience_size == 0 and suppressed_count == 0 and dispatched_hash_count == 0"
            - "Activation.${act_id}.vendor_matched_count == 0 and unusable_hash_count == 0"
            - "Activation.${act_id}.gross_match_rate == null and net_match_rate == null and effective_match_rate == null"
            - "Activation.${act_id}.dispatched_at == null and paused_reason == null and terminated_at == null"
            - "Activation.${act_id}.attributed_conversions == [] and attributed_conversion_count == 0"
            - "Destination.${dest_id}.remaining_daily_hash_quota == 300 — creating a DRAFT consumes no quota"
            - "Segment.${seg_id}.active_activation_count == 0"

