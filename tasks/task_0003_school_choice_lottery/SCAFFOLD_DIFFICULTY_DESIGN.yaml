              captures: { w19_v: $.data.version }
          trigger:
            - call: "POST /lottery/windows/${w19_id}/run-lottery"
              payload: { expected_window_version: "${w19_v}" }
              as: DistrictAdmin
            - call: "GET /lottery/applications"
