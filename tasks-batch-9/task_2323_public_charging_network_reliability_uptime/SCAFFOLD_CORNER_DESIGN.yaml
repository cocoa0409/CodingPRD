              captures: { st_id: $.data.id }
            - call: "POST /charging-ports"
              payload: { station_id: "${st_id}", connector_type: "CCS1", rated_power_kw: 150.00, dispenser_serial: "DS-1", terminal_model: "PT-9", contactless_enabled: true, plug_and_charge_enabled: true, price_display_verified: true, roaming_ocpi_version: "V2_2_1" }
              as: NetworkOperator
              captures: { p_id: $.data.id }
            - call: "POST /charging-ports/${p_id}/terminal-certification"
              payload: { certification_status: "CERTIFIED" }
              as: ComplianceAuditor
            - call: "POST /stations/${st_id}/status-transitions"
              payload: { target_status: "COMMISSIONING" }
              as: NetworkOperator
            - call: "POST /stations/${st_id}/commission"
              payload: {}
              as: NetworkOperator
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-06-10T00:00:00Z" }
              as: NetworkOperator
            - call: "POST /outage-events"
              payload: { port_id: "${p_id}", fault_code: "OCPP-MIN-01", fault_class: "MINOR", detected_at: "2026-06-10T00:00:00Z" }
              as: NetworkOperator
              captures: { o_id: $.data.id }
            - call: "POST /outage-events/${o_id}/classify"
              payload: { fault_class: "MINOR" }
              as: NetworkOperator
            - call: "POST /outage-events/${o_id}/exclusion-actions"
              payload: { action: "REQUEST", excluded_cause_claim: "UTILITY_OUTAGE" }
              as: NetworkOperator
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-07-15T00:00:00Z" }
              as: NetworkOperator
            - call: "POST /uptime-reports"
              payload: { station_id: "${st_id}", period_start: "2026-06-01T00:00:00Z", period_end: "2026-07-01T00:00:00Z" }
              as: NetworkOperator
              captures: { rp_id: $.data.id }
            - call: "POST /uptime-reports/${rp_id}/compute-provisional"
              payload: {}
              as: NetworkOperator
          trigger:
            - call: "POST /uptime-reports/${rp_id}/finalize"
              payload: {}
              as: ComplianceAuditor
              as_user_id: "auditor-1"
              captures: { err: $.data.error_id }
            - call: "POST /outage-events/${o_id}/exclusion-actions"
              payload: { action: "APPROVE" }
              as: ComplianceAuditor
              as_user_id: "auditor-1"
            - call: "POST /uptime-reports/${rp_id}/compute-provisional"
              payload: {}
              as: NetworkOperator
            - call: "POST /uptime-reports/${rp_id}/finalize"
              payload: {}
              as: ComplianceAuditor
              as_user_id: "auditor-1"
          assert:
            - "before the trigger: UptimeReport.${rp_id}.state == PROVISIONAL, total_port_minutes == 43200, excluded_minutes == 0, billable_downtime_minutes == 30240, uptime_pct == 30.00"
            - "call 1: HTTP status == 409 and data.error_id == \"ERR_EXCLUSION_REVIEW_PENDING\"; the report is still PROVISIONAL with methodology PROVISIONAL"
            - "call 2: HTTP status == 200, OutageEvent.${o_id}.state == EXCLUDED with cleared_at == \"2026-07-15T00:00:00Z\"; UptimeReport.${rp_id}.state == DRAFT with methodology, eligible_port_count, total_port_minutes, excluded_minutes, billable_downtime_minutes and uptime_pct all reset to null"
            - "call 3: HTTP status == 200, excluded_minutes == 30240, billable_downtime_minutes == 0, uptime_pct == 30.00 (PROVISIONAL keeps E in the denominator)"
            - "call 4: HTTP status == 200, uptime_pct == 100.00 and methodology == FINAL (FINAL removes E from both sides: 12960 / 12960)"
            - "Station.${st_id}.gross_downtime_minutes_lifetime == 50400, excluded_downtime_minutes_lifetime == 50400, billable_downtime_minutes_lifetime == 0 — the lifetime ledger uses the outage's full unclipped 35-day span, unlike the period-clipped 30240"

      - name: complaint_cannot_be_closed_while_a_refund_request_is_in_flight
        claim_type: violation_to_error
        grounds:
