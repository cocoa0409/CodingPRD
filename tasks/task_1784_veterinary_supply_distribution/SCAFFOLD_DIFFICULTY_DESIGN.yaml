          valid_from: '2026-01-01'
          valid_until: '2026-12-31'
          approved_ship_to_address: 16 Saddle St
          quarterly_quantity_cap: 100
        as: ComplianceOfficer
      - call: POST /vet/orders
        payload:
          clinic_id: ${c_id}
          ship_to_address: 16 Saddle St
          delivery_window_start: '2026-08-03T13:00:00Z'
          delivery_window_end: '2026-08-03T15:00:00Z'
          lines:
          - product_id: ${p_id}
            qty_requested: 1
        as: ClinicBuyer
        as_user_id: ${c_id}
        captures:
          o_id: $.data.id
      - call: POST /vet/orders/${o_id}/submit
        as: ClinicBuyer
