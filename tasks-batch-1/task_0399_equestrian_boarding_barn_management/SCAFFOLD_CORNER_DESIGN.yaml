  # ===========================================================================
  - section: rbac
    instances:
      - name: owner_cannot_create_stall
        claim_type: rbac_denial
        grounds:
          - roles.Owner
          - roles.BarnManager
          - endpoints.POST_/stalls
          - errors[ERR_FORBIDDEN_ROLE]
        distinguishing_aspect: "POST /stalls is BarnManager-exclusive; an Owner attempting it gets ERR_FORBIDDEN_ROLE (403)."
        test_recipe:
          setup: ["an owner exists to act as"]
          setup_api_calls:
            - call: "POST /owners"
              payload: { full_name: "Xan Rider", email: "xan@x.com" }
              as: BarnManager
              captures: { own_id: $.data.id }
          trigger:
            - call: "POST /stalls"
              payload: { label: "Z-1", kind: "STALL", capacity: 1, daily_rate_cents: 4500 }
              as: Owner
              as_user_id: "${own_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 403"
            - "response.data.error_id == ERR_FORBIDDEN_ROLE"

      - name: barnmanager_cannot_complete_lesson
        claim_type: rbac_denial
        grounds:
          - roles.Instructor
          - roles.BarnManager
          - state_machines.Lesson.SCHEDULED_to_COMPLETED
          - errors[ERR_FORBIDDEN_ROLE]
        distinguishing_aspect: "Lesson COMPLETED is Instructor-exclusive; a BarnManager requesting target_status=COMPLETED gets ERR_FORBIDDEN_ROLE (403) (per-target_status role gating)."
        test_recipe:
          setup: ["owner+horse with ACTIVE boarding; one SCHEDULED lesson"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00.000Z" }
              as: BarnManager
            - call: "POST /owners"
              payload: { full_name: "Yan Rider", email: "yan@x.com" }
              as: BarnManager
              captures: { own_id: $.data.id }
            - call: "POST /owners/${own_id}/waivers"
              payload: {}
              as: Owner
              as_user_id: "${own_id}"
              captures: { wv_id: $.data.id }
            - call: "POST /owners/${own_id}/waivers/${wv_id}/sign"
              payload: {}
              as: Owner
              as_user_id: "${own_id}"
            - call: "POST /stalls"
              payload: { label: "Y-1", kind: "STALL", capacity: 1, daily_rate_cents: 4500 }
              as: BarnManager
              captures: { stall_id: $.data.id }
            - call: "POST /horses"
              payload: { owner_id: "${own_id}", name: "Yuki" }
              as: BarnManager
              captures: { horse_id: $.data.id }
            - call: "POST /boarding-agreements"
              payload: { horse_id: "${horse_id}", stall_id: "${stall_id}", start_date: "2026-06-01T00:00:00.000Z" }
              as: BarnManager
              captures: { ba_id: $.data.id }
            - call: "POST /boarding-agreements/${ba_id}/transition"
              payload: { target_status: "ACTIVE" }
              as: BarnManager
            - call: "POST /lessons"
              payload: { horse_id: "${horse_id}", instructor_name: "Pat", lesson_fee_cents: 8000, starts_at: "2026-06-02T10:00:00.000Z", ends_at: "2026-06-02T11:00:00.000Z" }
              as: BarnManager
              captures: { les_id: $.data.id }
          trigger:
            - call: "POST /lessons/${les_id}/transition"
              payload: { target_status: "COMPLETED" }
              as: BarnManager
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 403"
            - "response.data.error_id == ERR_FORBIDDEN_ROLE"
            - "Lesson.${les_id}.status == SCHEDULED"

      - name: missing_user_context_returns_401
        claim_type: rbac_denial
        grounds:
          - validations[priority=1]
          - errors[ERR_MISSING_USER_CONTEXT]
        distinguishing_aspect: "A request with no X-User-Role/X-User-ID context is rejected with ERR_MISSING_USER_CONTEXT (401) before any other check."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /owners"
              payload: { full_name: "No Context", email: "noctx@x.com" }
              as: Anonymous
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 401"
            - "response.data.error_id == ERR_MISSING_USER_CONTEXT"

      - name: owner_cannot_act_on_other_owners_horse
        claim_type: rbac_denial
        grounds:
          - validations[priority=3]
          - roles.Owner
          - errors[ERR_NOT_RESOURCE_OWNER]
        distinguishing_aspect: "An Owner creating a lesson for a horse owned by a DIFFERENT owner is rejected with ERR_NOT_RESOURCE_OWNER (403)."
        test_recipe:
          setup: ["owner A owns a horse; owner B acts"]
          setup_api_calls:
            - call: "POST /owners"
              payload: { full_name: "Owner A", email: "oa@x.com" }
              as: BarnManager
              captures: { oa_id: $.data.id }
            - call: "POST /owners"
              payload: { full_name: "Owner B", email: "ob@x.com" }
              as: BarnManager
              captures: { ob_id: $.data.id }
            - call: "POST /horses"
              payload: { owner_id: "${oa_id}", name: "Atlas" }
              as: BarnManager
              captures: { horse_id: $.data.id }
          trigger:
            - call: "POST /lessons"
              payload: { horse_id: "${horse_id}", instructor_name: "Pat", lesson_fee_cents: 8000, starts_at: "2026-06-02T10:00:00.000Z", ends_at: "2026-06-02T11:00:00.000Z" }
              as: Owner
              as_user_id: "${ob_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 403"
            - "response.data.error_id == ERR_NOT_RESOURCE_OWNER"

