# =============================================================================
# 1.9 Scaffold Corner Design - breadth coverage of every testable claim in
# SCAFFOLD.yaml Tables 1-7 that SCAFFOLD_DIFFICULTY_DESIGN.yaml does not cover.
# Sections and claim_type values come from references/claim-extraction-guide.md.
# =============================================================================
scaffold_corner_design:

  - section: entities
    instances:
      - name: create_program_returns_all_declared_fields
        claim_type: creation
        grounds:
          - entities.Program
          - endpoints.POST /programs
        distinguishing_aspect: |
          Creation claim for the aggregate root: a POST with all four required inputs returns 201 and every declared Program field, with the three computed counters initialised to 0.
        test_recipe:
          setup:
            - "Empty database; logical clock pinned to its 2026-08-01T00:00:00Z startup default"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: ProgramCoordinator, as_user_id: "coord-admin-0" }
          trigger:
            - { call: "POST /programs", payload: { name: "Riverside CERT", sponsor_agency: "Riverside OES", jurisdiction_code: "CA-RIV-01", equipment_budget_cents: 5000000 }, as: ProgramCoordinator, as_user_id: "coord-admin-0", captures: { prog_id: $.data.id } }
          assert:
            - "Response code is 201 and response_type is object"
            - "Program.${prog_id}.name == Riverside CERT and sponsor_agency == Riverside OES and jurisdiction_code == CA-RIV-01"
            - "Program.${prog_id}.equipment_budget_cents == 5000000"
            - "Program.${prog_id}.equipment_committed_cents == 0"
            - "Program.${prog_id}.active_member_count == 0"
            - "Program.${prog_id}.pending_graduation_count == 0"
            - "Program.${prog_id}.version == 1"

      - name: get_cohort_by_id_returns_the_stored_entity
        claim_type: retrieval
        grounds:
          - entities.Cohort
          - endpoints.GET /cohorts/{cohortId}
        distinguishing_aspect: |
          Retrieval claim: GET /cohorts/{cohortId} echoes exactly the values stored at creation plus the server-managed seat ledger.
        test_recipe:
          setup:
            - "One program and one cohort C-2026A with seat_capacity 2"
          setup_api_calls:
            - { call: "POST /programs", payload: { name: "Riverside CERT", sponsor_agency: "Riverside OES", jurisdiction_code: "CA-RIV-01", equipment_budget_cents: 5000000 }, as: ProgramCoordinator, as_user_id: "coord-admin-0", captures: { prog_id: $.data.id } }
            - { call: "POST /curriculum-modules", payload: { module_code: "CERT-101", title: "Disaster Preparedness", contact_hours: 2.5, sequence_index: 1, is_core: true, requires_skills_demo: false, refresher_eligible: false }, as: ProgramCoordinator, as_user_id: "coord-admin-0", captures: { m101_id: $.data.id } }
            - { call: "POST /curriculum-modules", payload: { module_code: "CERT-102", title: "Fire Safety", contact_hours: 2.5, sequence_index: 2, is_core: true, requires_skills_demo: true, refresher_eligible: false, prerequisite_module_id: "${m101_id}" }, as: ProgramCoordinator, as_user_id: "coord-admin-0", captures: { m102_id: $.data.id } }
            - { call: "POST /curriculum-modules", payload: { module_code: "CERT-103", title: "Disaster Medical", contact_hours: 5.0, sequence_index: 3, is_core: true, requires_skills_demo: true, refresher_eligible: true, prerequisite_module_id: "${m102_id}" }, as: ProgramCoordinator, as_user_id: "coord-admin-0", captures: { m103_id: $.data.id } }
            - { call: "POST /facilities", payload: { name: "Riverside EOC", room_code: "EOC-A", capacity_seats: 40, status: "ACTIVE" }, as: ProgramCoordinator, as_user_id: "coord-admin-0", captures: { fac_a_id: $.data.id } }
            - { call: "POST /instructors", payload: { full_name: "Ines Ruiz", certification_expires_on: "2028-01-01T00:00:00Z", max_daily_contact_hours: 8.0, status: "ACTIVE" }, as: ProgramCoordinator, as_user_id: "coord-admin-0", captures: { ins_1_id: $.data.id } }
            - { call: "POST /instructors", payload: { full_name: "Evan Ko", certification_expires_on: "2028-01-01T00:00:00Z", max_daily_contact_hours: 8.0, status: "ACTIVE" }, as: ProgramCoordinator, as_user_id: "coord-admin-0", captures: { ins_2_id: $.data.id } }
            - { call: "POST /cohorts", payload: { program_id: "${prog_id}", cohort_code: "C-2026A", seat_capacity: 2, session_window_start: "2026-08-01T00:00:00Z", session_window_end: "2026-12-31T23:00:00Z" }, as: ProgramCoordinator, as_user_id: "coord-admin-0", captures: { coh_id: $.data.id } }
          trigger:
            - { call: "GET /cohorts/${coh_id}", payload: {}, as: Auditor, as_user_id: "aud-user-1" }
          assert:
            - "Response code is 200"
            - "Cohort.${coh_id}.cohort_code == C-2026A and seat_capacity == 2"
            - "Cohort.${coh_id}.session_window_start == 2026-08-01T00:00:00Z and session_window_end == 2026-12-31T23:00:00Z"
            - "Cohort.${coh_id}.status == RECRUITING"
            - "Cohort.${coh_id}.graduation_reviewer_user_id == null"

      - name: list_cohorts_filtered_by_program_paginates_with_total_count
        claim_type: listing
        grounds:
          - entities.Cohort
          - endpoints.GET /cohorts
          - response_envelope.pagination_fields
        distinguishing_aspect: |
          Listing claim: the filtered list returns Cohort[] with the four pagination fields, honours limit and offset, and total_count reflects the filtered set rather than the page.
        test_recipe:
          setup:
            - "One program with three cohorts C-2026A, C-2026B and C-2026C created in that order"
          setup_api_calls:
            - { call: "POST /programs", payload: { name: "Riverside CERT", sponsor_agency: "Riverside OES", jurisdiction_code: "CA-RIV-01", equipment_budget_cents: 5000000 }, as: ProgramCoordinator, as_user_id: "coord-admin-0", captures: { prog_id: $.data.id } }
            - { call: "POST /curriculum-modules", payload: { module_code: "CERT-101", title: "Disaster Preparedness", contact_hours: 2.5, sequence_index: 1, is_core: true, requires_skills_demo: false, refresher_eligible: false }, as: ProgramCoordinator, as_user_id: "coord-admin-0", captures: { m101_id: $.data.id } }
            - { call: "POST /curriculum-modules", payload: { module_code: "CERT-102", title: "Fire Safety", contact_hours: 2.5, sequence_index: 2, is_core: true, requires_skills_demo: true, refresher_eligible: false, prerequisite_module_id: "${m101_id}" }, as: ProgramCoordinator, as_user_id: "coord-admin-0", captures: { m102_id: $.data.id } }
            - { call: "POST /curriculum-modules", payload: { module_code: "CERT-103", title: "Disaster Medical", contact_hours: 5.0, sequence_index: 3, is_core: true, requires_skills_demo: true, refresher_eligible: true, prerequisite_module_id: "${m102_id}" }, as: ProgramCoordinator, as_user_id: "coord-admin-0", captures: { m103_id: $.data.id } }
            - { call: "POST /facilities", payload: { name: "Riverside EOC", room_code: "EOC-A", capacity_seats: 40, status: "ACTIVE" }, as: ProgramCoordinator, as_user_id: "coord-admin-0", captures: { fac_a_id: $.data.id } }
            - { call: "POST /instructors", payload: { full_name: "Ines Ruiz", certification_expires_on: "2028-01-01T00:00:00Z", max_daily_contact_hours: 8.0, status: "ACTIVE" }, as: ProgramCoordinator, as_user_id: "coord-admin-0", captures: { ins_1_id: $.data.id } }
            - { call: "POST /instructors", payload: { full_name: "Evan Ko", certification_expires_on: "2028-01-01T00:00:00Z", max_daily_contact_hours: 8.0, status: "ACTIVE" }, as: ProgramCoordinator, as_user_id: "coord-admin-0", captures: { ins_2_id: $.data.id } }
            - { call: "POST /cohorts", payload: { program_id: "${prog_id}", cohort_code: "C-2026A", seat_capacity: 2, session_window_start: "2026-08-01T00:00:00Z", session_window_end: "2026-12-31T23:00:00Z" }, as: ProgramCoordinator, as_user_id: "coord-admin-0", captures: { coh_id: $.data.id } }
            - { call: "POST /cohorts", payload: { program_id: "${prog_id}", cohort_code: "C-2026B", seat_capacity: 5, session_window_start: "2026-09-01T00:00:00Z", session_window_end: "2026-12-31T23:00:00Z" }, as: ProgramCoordinator, as_user_id: "coord-admin-0", captures: { coh2_id: $.data.id } }
            - { call: "POST /cohorts", payload: { program_id: "${prog_id}", cohort_code: "C-2026C", seat_capacity: 5, session_window_start: "2026-10-01T00:00:00Z", session_window_end: "2026-12-31T23:00:00Z" }, as: ProgramCoordinator, as_user_id: "coord-admin-0", captures: { coh3_id: $.data.id } }
          trigger:
            - { call: "GET /cohorts", payload: { program_id: "${prog_id}", limit: 2, offset: 1 }, as: Auditor, as_user_id: "aud-user-1" }
          assert:
            - "Response code is 200 and response_type is array"
            - "meta pagination reports total_count == 3, limit == 2, offset == 1, has_more == false"
            - "Exactly 2 Cohort rows are returned"
            - "A request with no limit or offset returns all 3 rows with limit == 10 and offset == 0"

      - name: get_trainee_with_unknown_id_returns_not_found
        claim_type: not_found
        grounds:
          - errors[ERR_TRAINEE_NOT_FOUND]
          - validations[priority=3]
          - endpoints.GET /trainees/{traineeId}
        distinguishing_aspect: |
          Not-found claim: a syntactically valid UUID that matches no Trainee row yields 404 ERR_TRAINEE_NOT_FOUND rather than an empty 200.
        test_recipe:
          setup:
            - "One program and cohort exist but no trainees have been created"
          setup_api_calls:
            - { call: "POST /programs", payload: { name: "Riverside CERT", sponsor_agency: "Riverside OES", jurisdiction_code: "CA-RIV-01", equipment_budget_cents: 5000000 }, as: ProgramCoordinator, as_user_id: "coord-admin-0", captures: { prog_id: $.data.id } }
            - { call: "POST /curriculum-modules", payload: { module_code: "CERT-101", title: "Disaster Preparedness", contact_hours: 2.5, sequence_index: 1, is_core: true, requires_skills_demo: false, refresher_eligible: false }, as: ProgramCoordinator, as_user_id: "coord-admin-0", captures: { m101_id: $.data.id } }
            - { call: "POST /curriculum-modules", payload: { module_code: "CERT-102", title: "Fire Safety", contact_hours: 2.5, sequence_index: 2, is_core: true, requires_skills_demo: true, refresher_eligible: false, prerequisite_module_id: "${m101_id}" }, as: ProgramCoordinator, as_user_id: "coord-admin-0", captures: { m102_id: $.data.id } }
            - { call: "POST /curriculum-modules", payload: { module_code: "CERT-103", title: "Disaster Medical", contact_hours: 5.0, sequence_index: 3, is_core: true, requires_skills_demo: true, refresher_eligible: true, prerequisite_module_id: "${m102_id}" }, as: ProgramCoordinator, as_user_id: "coord-admin-0", captures: { m103_id: $.data.id } }
            - { call: "POST /facilities", payload: { name: "Riverside EOC", room_code: "EOC-A", capacity_seats: 40, status: "ACTIVE" }, as: ProgramCoordinator, as_user_id: "coord-admin-0", captures: { fac_a_id: $.data.id } }
            - { call: "POST /instructors", payload: { full_name: "Ines Ruiz", certification_expires_on: "2028-01-01T00:00:00Z", max_daily_contact_hours: 8.0, status: "ACTIVE" }, as: ProgramCoordinator, as_user_id: "coord-admin-0", captures: { ins_1_id: $.data.id } }
            - { call: "POST /instructors", payload: { full_name: "Evan Ko", certification_expires_on: "2028-01-01T00:00:00Z", max_daily_contact_hours: 8.0, status: "ACTIVE" }, as: ProgramCoordinator, as_user_id: "coord-admin-0", captures: { ins_2_id: $.data.id } }
            - { call: "POST /cohorts", payload: { program_id: "${prog_id}", cohort_code: "C-2026A", seat_capacity: 2, session_window_start: "2026-08-01T00:00:00Z", session_window_end: "2026-12-31T23:00:00Z" }, as: ProgramCoordinator, as_user_id: "coord-admin-0", captures: { coh_id: $.data.id } }
          trigger:
            - { call: "GET /trainees/11111111-2222-4333-8444-555555555555", payload: {}, as: Auditor, as_user_id: "aud-user-1", captures: { err1: $.data.error_id } }
          assert:
            - "Response code is 404 and data.error_id == ERR_TRAINEE_NOT_FOUND"
            - "response_type is error"

      - name: create_cohort_missing_seat_capacity_returns_invalid_request
        claim_type: required_fields
        grounds:
          - validations[priority=4]
          - errors[ERR_INVALID_REQUEST]
          - endpoints.POST /cohorts
        distinguishing_aspect: |
          Required-field claim: omitting seat_capacity, an input field with no declared default, yields 400 ERR_INVALID_REQUEST and creates no row.
        test_recipe:
          setup:
            - "One program exists"
          setup_api_calls:
            - { call: "POST /programs", payload: { name: "Riverside CERT", sponsor_agency: "Riverside OES", jurisdiction_code: "CA-RIV-01", equipment_budget_cents: 5000000 }, as: ProgramCoordinator, as_user_id: "coord-admin-0", captures: { prog_id: $.data.id } }
            - { call: "POST /curriculum-modules", payload: { module_code: "CERT-101", title: "Disaster Preparedness", contact_hours: 2.5, sequence_index: 1, is_core: true, requires_skills_demo: false, refresher_eligible: false }, as: ProgramCoordinator, as_user_id: "coord-admin-0", captures: { m101_id: $.data.id } }
            - { call: "POST /curriculum-modules", payload: { module_code: "CERT-102", title: "Fire Safety", contact_hours: 2.5, sequence_index: 2, is_core: true, requires_skills_demo: true, refresher_eligible: false, prerequisite_module_id: "${m101_id}" }, as: ProgramCoordinator, as_user_id: "coord-admin-0", captures: { m102_id: $.data.id } }
            - { call: "POST /curriculum-modules", payload: { module_code: "CERT-103", title: "Disaster Medical", contact_hours: 5.0, sequence_index: 3, is_core: true, requires_skills_demo: true, refresher_eligible: true, prerequisite_module_id: "${m102_id}" }, as: ProgramCoordinator, as_user_id: "coord-admin-0", captures: { m103_id: $.data.id } }
            - { call: "POST /facilities", payload: { name: "Riverside EOC", room_code: "EOC-A", capacity_seats: 40, status: "ACTIVE" }, as: ProgramCoordinator, as_user_id: "coord-admin-0", captures: { fac_a_id: $.data.id } }
            - { call: "POST /instructors", payload: { full_name: "Ines Ruiz", certification_expires_on: "2028-01-01T00:00:00Z", max_daily_contact_hours: 8.0, status: "ACTIVE" }, as: ProgramCoordinator, as_user_id: "coord-admin-0", captures: { ins_1_id: $.data.id } }
            - { call: "POST /instructors", payload: { full_name: "Evan Ko", certification_expires_on: "2028-01-01T00:00:00Z", max_daily_contact_hours: 8.0, status: "ACTIVE" }, as: ProgramCoordinator, as_user_id: "coord-admin-0", captures: { ins_2_id: $.data.id } }
            - { call: "POST /cohorts", payload: { program_id: "${prog_id}", cohort_code: "C-2026A", seat_capacity: 2, session_window_start: "2026-08-01T00:00:00Z", session_window_end: "2026-12-31T23:00:00Z" }, as: ProgramCoordinator, as_user_id: "coord-admin-0", captures: { coh_id: $.data.id } }
          trigger:
            - { call: "POST /cohorts", payload: { program_id: "${prog_id}", cohort_code: "C-2026Z", session_window_start: "2026-08-01T00:00:00Z", session_window_end: "2026-12-31T23:00:00Z" }, as: ProgramCoordinator, as_user_id: "coord-admin-0", captures: { err1: $.data.error_id } }
          assert:
            - "Response code is 400 and data.error_id == ERR_INVALID_REQUEST"
            - "GET /cohorts with program_id ${prog_id} still returns total_count 1"

      - name: curriculum_module_optional_flags_take_declared_defaults
        claim_type: defaults
        grounds:
          - entities.CurriculumModule.fields.is_core
          - entities.CurriculumModule.fields.requires_skills_demo
          - entities.CurriculumModule.fields.refresher_eligible
          - entities.CurriculumModule.fields.status
        distinguishing_aspect: |
          Defaults claim: omitting is_core, requires_skills_demo, refresher_eligible, status and prerequisite_module_id yields true, false, false, ACTIVE and null respectively.
        test_recipe:
          setup:
            - "Empty database with the logical clock at its startup default"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: ProgramCoordinator, as_user_id: "coord-admin-0" }
          trigger:
            - { call: "POST /curriculum-modules", payload: { module_code: "CERT-900", title: "Standalone Module", contact_hours: 1.5, sequence_index: 9 }, as: ProgramCoordinator, as_user_id: "coord-admin-0", captures: { m900_id: $.data.id } }
          assert:
            - "Response code is 201"
            - "CurriculumModule.${m900_id}.is_core == true"
            - "CurriculumModule.${m900_id}.requires_skills_demo == false"
            - "CurriculumModule.${m900_id}.refresher_eligible == false"
            - "CurriculumModule.${m900_id}.status == ACTIVE"
            - "CurriculumModule.${m900_id}.prerequisite_module_id == null"

      - name: program_system_fields_are_server_minted
        claim_type: system_fields
        grounds:
          - entities.Program
          - response_envelope.success
        distinguishing_aspect: |
          System-field claim: id is a bare UUID with no type prefix, created_at and updated_at are ISO 8601 UTC with three fractional digits, and version starts at 1 and increments on the next mutation.
        test_recipe:
          setup:
            - "One program created at the 2026-08-01T00:00:00Z startup default clock"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: ProgramCoordinator, as_user_id: "coord-admin-0" }
          trigger:
            - { call: "POST /programs", payload: { name: "Riverside CERT", sponsor_agency: "Riverside OES", jurisdiction_code: "CA-RIV-01", equipment_budget_cents: 5000000 }, as: ProgramCoordinator, as_user_id: "coord-admin-0", captures: { prog_id: $.data.id, v1: $.data.version } }
            - { call: "PATCH /programs/${prog_id}", payload: { equipment_budget_cents: 6000000 }, as: ProgramCoordinator, as_user_id: "coord-admin-0", captures: { v2: $.data.version } }
          assert:
            - "Program.${prog_id}.id matches the bare UUID form with no prefix such as prog_"
            - "Program.${prog_id}.created_at and updated_at are ISO 8601 UTC strings with three fractional digits"
            - "Program.${prog_id}.version == 1 immediately after creation"
            - "Program.${prog_id}.version == 2 after the PATCH and equipment_budget_cents == 6000000"
            - "Program.${prog_id}.created_at is unchanged by the PATCH while updated_at advances"

      - name: class_session_ends_at_is_computed_from_module_contact_hours
        claim_type: computed_fields
        grounds:
          - entities.ClassSession.fields.ends_at
          - endpoints.POST /class-sessions
        distinguishing_aspect: |
          Computed-field claim: ends_at is derived as starts_at plus contact_hours times 60 minutes and is never accepted from the client - CERT-103 at 5.0 hours from 09:00 must end at 14:00.
        test_recipe:
          setup:
            - "Program with CERT-101 (2.5h) and CERT-103 (5.0h); facility EOC-A and instructor Ines Ruiz registered"
          setup_api_calls:
            - { call: "POST /programs", payload: { name: "Riverside CERT", sponsor_agency: "Riverside OES", jurisdiction_code: "CA-RIV-01", equipment_budget_cents: 5000000 }, as: ProgramCoordinator, as_user_id: "coord-admin-0", captures: { prog_id: $.data.id } }
            - { call: "POST /curriculum-modules", payload: { module_code: "CERT-101", title: "Disaster Preparedness", contact_hours: 2.5, sequence_index: 1, is_core: true, requires_skills_demo: false, refresher_eligible: false }, as: ProgramCoordinator, as_user_id: "coord-admin-0", captures: { m101_id: $.data.id } }
            - { call: "POST /curriculum-modules", payload: { module_code: "CERT-102", title: "Fire Safety", contact_hours: 2.5, sequence_index: 2, is_core: true, requires_skills_demo: true, refresher_eligible: false, prerequisite_module_id: "${m101_id}" }, as: ProgramCoordinator, as_user_id: "coord-admin-0", captures: { m102_id: $.data.id } }
            - { call: "POST /curriculum-modules", payload: { module_code: "CERT-103", title: "Disaster Medical", contact_hours: 5.0, sequence_index: 3, is_core: true, requires_skills_demo: true, refresher_eligible: true, prerequisite_module_id: "${m102_id}" }, as: ProgramCoordinator, as_user_id: "coord-admin-0", captures: { m103_id: $.data.id } }
            - { call: "POST /facilities", payload: { name: "Riverside EOC", room_code: "EOC-A", capacity_seats: 40, status: "ACTIVE" }, as: ProgramCoordinator, as_user_id: "coord-admin-0", captures: { fac_a_id: $.data.id } }
            - { call: "POST /instructors", payload: { full_name: "Ines Ruiz", certification_expires_on: "2028-01-01T00:00:00Z", max_daily_contact_hours: 8.0, status: "ACTIVE" }, as: ProgramCoordinator, as_user_id: "coord-admin-0", captures: { ins_1_id: $.data.id } }
            - { call: "POST /instructors", payload: { full_name: "Evan Ko", certification_expires_on: "2028-01-01T00:00:00Z", max_daily_contact_hours: 8.0, status: "ACTIVE" }, as: ProgramCoordinator, as_user_id: "coord-admin-0", captures: { ins_2_id: $.data.id } }
            - { call: "POST /cohorts", payload: { program_id: "${prog_id}", cohort_code: "C-2026A", seat_capacity: 2, session_window_start: "2026-08-01T00:00:00Z", session_window_end: "2026-12-31T23:00:00Z" }, as: ProgramCoordinator, as_user_id: "coord-admin-0", captures: { coh_id: $.data.id } }
            - { call: "POST /class-sessions", payload: { cohort_id: "${coh_id}", module_id: "${m101_id}", facility_id: "${fac_a_id}", instructor_id: "${ins_1_id}", starts_at: "2026-08-03T09:00:00Z" }, as: ProgramCoordinator, as_user_id: "coord-admin-0", captures: { ses_a_id: $.data.id } }
            - { call: "POST /class-sessions", payload: { cohort_id: "${coh_id}", module_id: "${m102_id}", facility_id: "${fac_a_id}", instructor_id: "${ins_1_id}", starts_at: "2026-08-04T09:00:00Z" }, as: ProgramCoordinator, as_user_id: "coord-admin-0", captures: { ses_b_id: $.data.id } }
          trigger:
            - { call: "POST /class-sessions", payload: { cohort_id: "${coh_id}", module_id: "${m103_id}", facility_id: "${fac_a_id}", instructor_id: "${ins_1_id}", starts_at: "2026-08-05T09:00:00Z" }, as: ProgramCoordinator, as_user_id: "coord-admin-0", captures: { ses_c_id: $.data.id } }
          assert:
            - "ClassSession.${ses_a_id}.ends_at == 2026-08-03T11:30:00Z"
            - "ClassSession.${ses_c_id}.ends_at == 2026-08-05T14:00:00Z"
            - "ClassSession.${ses_c_id}.status == SCHEDULED and delivered_at == null"
            - "ClassSession.${ses_c_id}.recorded_completion_count == 0"

      - name: create_activation_with_invalid_severity_returns_invalid_request
        claim_type: type_constraints
        grounds:
          - entities.Activation.fields.severity
          - validations[priority=4]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: |
          Type-constraint claim: severity outside {ROUTINE, URGENT, CRITICAL} is rejected with 400 ERR_INVALID_REQUEST, as is requested_responders below 1.
        test_recipe:
          setup:
            - "One program exists"
          setup_api_calls:
