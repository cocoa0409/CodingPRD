scenario: |
  Shared storage locker system: locker management with locker-cabinet profile
  (location/size-classes/online-status), compartment-level status tracking
  (idle/rented/overdue/fault), firmware-version control, offline-degraded
  operation rules, and cabinet capacity statistics; user rental
  (hourly/daily/monthly) with rental-mode pricing configuration,
  compartment-size selection, rental-deposit handling, multi-channel unlock
  (QR/Bluetooth/password), and rental-record archiving; expiration renewal and
  forced clearance with expiration-approaching reminder rules, online-renewal
  payment, grace-period configuration, overdue-fee accrual, long-overdue
  forced-clearance workflow, item-removal to designated storage, and
  item-claim window for the user; item insurance with insurance-tier options
  at rental time, declared-value declaration, premium calculation,
  claim-event reporting workflow, evidence collection, insurance-company
  coordination, and payout execution; fault reporting with user-reported
  fault categorization, automatic anomaly detection
  (door-not-closed/sensor-fault/communication-loss), fault-compartment
  lock-out from new rentals, repair-ticket dispatch, repair record, and
  post-repair acceptance; capacity warning with occupancy-rate threshold per
  size class, peak-period warning, redistribution suggestion across nearby
  cabinets, and operations-side dashboard alert push; revenue reconciliation
  with rental-fee revenue, overdue-fee revenue, deposit-forfeiture handling,
  location-partner revenue sharing, refund-induced reversal, and periodic
  settlement; event-driven synchronization with payment, IM, insurance-company,
  and mapping systems; audit logging for compartment-opening events and
  forced-clearance records.

domain_name: shared-storage-locker
api_prefix: /cabinets

# =============================================================================
# Complexity Profile
# =============================================================================
complexity_profile:
  primary_archetype: posture_driven_gating
  secondary_archetype: pricing_engine
  complexity_layers:
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
    - scheduled_deferred_actions
    - derived_field_reconciliation
    - optimistic_concurrency

  entity_topology: hybrid
  # Cabinet → Compartment (hierarchy); Rental, InsurancePolicy, InsuranceClaim,
  # RepairTicket, RevenueRecord, AuditEvent cross-cut via FK.

  state_machine_shape: parallel
  # Compartment has parallel operational_status × occupancy_status.
  # Rental is branching (renewal loop, forced-clearance branch).
  # InsuranceClaim is cyclic (re-submission allowed after EVIDENCE_REJECTED).
  # RepairTicket is linear with branching at ACCEPTANCE.

  relationship_patterns:
    - one_to_many        # Cabinet → Compartment
    - cross_aggregate    # Rental references Compartment; RevenueRecord references Rental
    - polymorphic        # AuditEvent.subject_type ∈ {Compartment, Rental}

  role_model: peer_roles
  # Renter, Operator, RepairTechnician, InsuranceAgent — non-overlapping ownership.

  consistency_model: immediate
  # All cascades execute atomically inside the triggering request; derived
  # cabinet capacity stats reconcile on the same request.

# =============================================================================
# Response Envelope (FIXED — DO NOT MODIFY)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Cabinet
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Cabinet UUID" }
      - { name: location_code, type: string, source: input, description: "Human-readable location code, e.g., 'BJ-CHAOYANG-001'" }
      - { name: latitude, type: number, source: input, description: "Decimal degrees" }
      - { name: longitude, type: number, source: input, description: "Decimal degrees" }
      - { name: partner_id, type: string, source: input, description: "Location-partner UUID for revenue sharing" }
      - { name: partner_share_pct, type: number, source: input, description: "Partner's share percentage, integer 0..100", constraints: "0 <= partner_share_pct <= 100" }
      - { name: firmware_version, type: string, source: input, description: "Semver, e.g., '1.4.2'" }
      - { name: online_status, type: enum, source: system, description: "ONLINE | OFFLINE | DEGRADED", default: ONLINE, constraints: "ONLINE | OFFLINE | DEGRADED" }
      - { name: last_heartbeat_at, type: datetime, source: system, description: "ISO 8601 UTC; null until first heartbeat" }
      - { name: total_compartments, type: integer, source: computed, description: "Count of compartments belonging to this cabinet" }
      - { name: small_capacity_total, type: integer, source: computed, description: "Count of SMALL compartments" }
      - { name: medium_capacity_total, type: integer, source: computed, description: "Count of MEDIUM compartments" }
      - { name: large_capacity_total, type: integer, source: computed, description: "Count of LARGE compartments" }
      - { name: small_occupancy_pct, type: number, source: computed, description: "Percent of SMALL compartments in RENTED or OVERDUE" }
      - { name: medium_occupancy_pct, type: number, source: computed, description: "Percent of MEDIUM compartments in RENTED or OVERDUE" }
      - { name: large_occupancy_pct, type: number, source: computed, description: "Percent of LARGE compartments in RENTED or OVERDUE" }
      - { name: capacity_alert_level, type: enum, source: computed, description: "NONE | WARNING | CRITICAL — derived from occupancy thresholds", constraints: "NONE | WARNING | CRITICAL" }
      - { name: created_at, type: datetime, source: system, description: "Creation timestamp" }
      - { name: updated_at, type: datetime, source: system, description: "Last mutation timestamp" }
      - { name: version, type: integer, source: system, description: "OCC version" }

  - name: Compartment
    parent: Cabinet
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Compartment UUID" }
      - { name: cabinet_id, type: string, source: system, description: "Parent cabinet" }
      - { name: slot_number, type: integer, source: input, description: "1-based slot index within cabinet; unique per cabinet" }
      - { name: size_class, type: enum, source: input, description: "SMALL | MEDIUM | LARGE", constraints: "SMALL | MEDIUM | LARGE" }
      - { name: operational_status, type: enum, source: system, description: "OK | FAULT — independent dimension from occupancy_status", default: OK, constraints: "OK | FAULT" }
      - { name: occupancy_status, type: enum, source: system, description: "IDLE | RENTED | OVERDUE | HOLDING — independent dimension from operational_status", default: IDLE, constraints: "IDLE | RENTED | OVERDUE | HOLDING" }
      - { name: fault_category, type: enum, source: system, description: "DOOR_NOT_CLOSED | SENSOR_FAULT | COMMUNICATION_LOSS | USER_REPORTED | null", constraints: "DOOR_NOT_CLOSED | SENSOR_FAULT | COMMUNICATION_LOSS | USER_REPORTED | null" }
      - { name: active_rental_id, type: string, source: system, description: "Current rental UUID; null when IDLE/HOLDING" }
      - { name: holding_item_description, type: string, source: system, description: "Free-text description of item moved to designated storage; null unless HOLDING" }
      - { name: holding_claim_deadline, type: datetime, source: system, description: "ISO 8601 UTC; user must claim before this; null unless HOLDING" }
      - { name: created_at, type: datetime, source: system, description: "Creation timestamp" }
      - { name: updated_at, type: datetime, source: system, description: "Last mutation timestamp" }
      - { name: version, type: integer, source: system, description: "OCC version" }

  - name: PricingProfile
    parent: null
    common_fields: false
    fields:
      - { name: id, type: string, source: system, description: "PricingProfile UUID" }
      - { name: size_class, type: enum, source: input, description: "SMALL | MEDIUM | LARGE", constraints: "SMALL | MEDIUM | LARGE; unique per (size_class, rental_mode)" }
      - { name: rental_mode, type: enum, source: input, description: "HOURLY | DAILY | MONTHLY", constraints: "HOURLY | DAILY | MONTHLY" }
      - { name: unit_price_cents, type: integer, source: input, description: "Price per billing unit (per hour, per day, per month) in cents", constraints: "unit_price_cents > 0" }
      - { name: deposit_cents, type: integer, source: input, description: "Refundable deposit in cents", constraints: "deposit_cents >= 0" }
      - { name: grace_minutes, type: integer, source: input, description: "Grace period after expiry before overdue fee starts accruing", constraints: "grace_minutes >= 0" }
      - { name: overdue_rate_cents_per_hour, type: integer, source: input, description: "Overdue fee accrual rate in cents per started hour", constraints: "overdue_rate_cents_per_hour >= 0" }
      - { name: forced_clearance_hours, type: integer, source: input, description: "Hours past expiry at which forced clearance triggers", constraints: "forced_clearance_hours > grace_minutes / 60" }
      - { name: created_at, type: datetime, source: system, description: "Creation timestamp" }

  - name: Rental
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Rental UUID" }
      - { name: renter_id, type: string, source: input, description: "UUID of the Renter user" }
      - { name: compartment_id, type: string, source: input, description: "Target compartment" }
      - { name: cabinet_id, type: string, source: system, description: "Denormalized parent cabinet for revenue partner lookup" }
      - { name: size_class, type: enum, source: system, description: "Copied from compartment at rental creation", constraints: "SMALL | MEDIUM | LARGE" }
      - { name: rental_mode, type: enum, source: input, description: "HOURLY | DAILY | MONTHLY", constraints: "HOURLY | DAILY | MONTHLY" }
      - { name: billing_units, type: integer, source: input, description: "Number of hours/days/months purchased upfront", constraints: "billing_units >= 1" }
      - { name: unit_price_cents_snapshot, type: integer, source: system, description: "Snapshot of unit_price_cents from PricingProfile at creation" }
      - { name: deposit_cents_snapshot, type: integer, source: system, description: "Snapshot of deposit_cents at creation" }
      - { name: grace_minutes_snapshot, type: integer, source: system, description: "Snapshot of grace_minutes at creation" }
      - { name: overdue_rate_snapshot, type: integer, source: system, description: "Snapshot of overdue_rate_cents_per_hour at creation" }
      - { name: forced_clearance_hours_snapshot, type: integer, source: system, description: "Snapshot of forced_clearance_hours at creation" }
      - { name: insurance_tier, type: enum, source: input, description: "NONE | BASIC | PREMIUM", default: NONE, constraints: "NONE | BASIC | PREMIUM" }
      - { name: declared_value_cents, type: integer, source: input, description: "User-declared item value in cents; required when insurance_tier != NONE", constraints: "0 <= declared_value_cents <= DECLARED_VALUE_CAP_CENTS" }
      - { name: insurance_premium_cents, type: integer, source: computed, description: "Computed by insurance_premium calculation" }
      - { name: rental_fee_cents, type: integer, source: computed, description: "billing_units * unit_price_cents_snapshot" }
      - { name: total_charged_cents, type: integer, source: computed, description: "rental_fee_cents + insurance_premium_cents + deposit_cents_snapshot" }
      - { name: started_at, type: datetime, source: system, description: "Rental start ISO 8601 UTC" }
      - { name: original_expires_at, type: datetime, source: system, description: "Initial expiry, never mutated" }
      - { name: current_expires_at, type: datetime, source: system, description: "Updated by renewals" }
      - { name: ended_at, type: datetime, source: system, description: "ISO 8601 UTC when rental terminated; null while active" }
      - { name: status, type: enum, source: system, description: "ACTIVE | EXPIRING_SOON | OVERDUE | RETURNED | FORCE_CLEARED | REFUNDED", default: ACTIVE, constraints: "ACTIVE | EXPIRING_SOON | OVERDUE | RETURNED | FORCE_CLEARED | REFUNDED" }
      - { name: overdue_fee_cents, type: integer, source: computed, description: "Accrued overdue fee at present" }
      - { name: deposit_forfeited_cents, type: integer, source: computed, description: "Portion of deposit forfeited; non-zero only after force-clearance" }
      - { name: deposit_refunded_cents, type: integer, source: computed, description: "Portion of deposit refunded on return" }
      - { name: renewal_count, type: integer, source: system, description: "Number of successful renewals", default: 0 }
      - { name: reminder_sent_at, type: datetime, source: system, description: "ISO 8601 UTC of expiring-soon reminder; null if not sent" }
      - { name: created_at, type: datetime, source: system, description: "Creation timestamp" }
      - { name: updated_at, type: datetime, source: system, description: "Last mutation timestamp" }
      - { name: version, type: integer, source: system, description: "OCC version" }

  - name: InsuranceClaim
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "InsuranceClaim UUID" }
      - { name: rental_id, type: string, source: input, description: "Associated rental" }
      - { name: renter_id, type: string, source: system, description: "Snapshot of Rental.renter_id" }
      - { name: claim_type, type: enum, source: input, description: "DAMAGE | LOSS | THEFT", constraints: "DAMAGE | LOSS | THEFT" }
      - { name: claimed_amount_cents, type: integer, source: input, description: "User-claimed payout in cents", constraints: "claimed_amount_cents > 0" }
      - { name: evidence_count, type: integer, source: system, description: "Number of evidence submissions" }
      - { name: status, type: enum, source: system, description: "REPORTED | EVIDENCE_PENDING | UNDER_REVIEW | EVIDENCE_REJECTED | APPROVED | DENIED | PAID", default: REPORTED, constraints: "REPORTED | EVIDENCE_PENDING | UNDER_REVIEW | EVIDENCE_REJECTED | APPROVED | DENIED | PAID" }
      - { name: payout_cents, type: integer, source: system, description: "Final approved payout; null until APPROVED" }
      - { name: insurer_reference, type: string, source: system, description: "External insurance-company reference id; set when SUBMITTED to insurer" }
      - { name: rejection_reason, type: string, source: system, description: "Reason text when EVIDENCE_REJECTED or DENIED" }
      - { name: created_at, type: datetime, source: system, description: "Creation timestamp" }
      - { name: updated_at, type: datetime, source: system, description: "Last mutation timestamp" }
      - { name: version, type: integer, source: system, description: "OCC version" }

  - name: RepairTicket
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "RepairTicket UUID" }
      - { name: compartment_id, type: string, source: input, description: "Target compartment" }
      - { name: cabinet_id, type: string, source: system, description: "Denormalized parent cabinet" }
      - { name: fault_category, type: enum, source: input, description: "DOOR_NOT_CLOSED | SENSOR_FAULT | COMMUNICATION_LOSS | USER_REPORTED", constraints: "DOOR_NOT_CLOSED | SENSOR_FAULT | COMMUNICATION_LOSS | USER_REPORTED" }
      - { name: reporter_role, type: enum, source: system, description: "RENTER | SYSTEM | OPERATOR", constraints: "RENTER | SYSTEM | OPERATOR" }
      - { name: assigned_technician_id, type: string, source: system, description: "Opaque technician id; null until dispatched" }
      - { name: status, type: enum, source: system, description: "OPEN | DISPATCHED | REPAIRED | ACCEPTED | REJECTED", default: OPEN, constraints: "OPEN | DISPATCHED | REPAIRED | ACCEPTED | REJECTED" }
      - { name: repair_notes, type: string, source: system, description: "Technician notes; null until REPAIRED" }
      - { name: accepted_at, type: datetime, source: system, description: "ISO 8601 UTC when operator accepted the repair; null otherwise" }
      - { name: created_at, type: datetime, source: system, description: "Creation timestamp" }
      - { name: updated_at, type: datetime, source: system, description: "Last mutation timestamp" }
      - { name: version, type: integer, source: system, description: "OCC version" }

  - name: RevenueRecord
    parent: null
    common_fields: false
    fields:
      - { name: id, type: string, source: system, description: "RevenueRecord UUID" }
      - { name: rental_id, type: string, source: system, description: "Source rental" }
      - { name: cabinet_id, type: string, source: system, description: "Denormalized for partner share lookup" }
      - { name: revenue_kind, type: enum, source: system, description: "RENTAL_FEE | OVERDUE_FEE | DEPOSIT_FORFEIT | REFUND_REVERSAL", constraints: "RENTAL_FEE | OVERDUE_FEE | DEPOSIT_FORFEIT | REFUND_REVERSAL" }
      - { name: gross_cents, type: integer, source: system, description: "Signed cents: positive for revenue, negative for refund reversal" }
      - { name: partner_share_cents, type: integer, source: system, description: "Amount owed to location partner" }
      - { name: platform_share_cents, type: integer, source: system, description: "Amount retained by platform = gross_cents - partner_share_cents" }
      - { name: occurred_at, type: datetime, source: system, description: "ISO 8601 UTC of the source event" }
      - { name: created_at, type: datetime, source: system, description: "Creation timestamp" }

  - name: AuditEvent
    parent: null
    common_fields: false
    fields:
      - { name: id, type: string, source: system, description: "AuditEvent UUID" }
      - { name: event_kind, type: enum, source: system, description: "COMPARTMENT_OPENED | FORCE_CLEARANCE", constraints: "COMPARTMENT_OPENED | FORCE_CLEARANCE" }
      - { name: subject_type, type: enum, source: system, description: "Compartment | Rental — polymorphic subject", constraints: "Compartment | Rental" }
      - { name: subject_id, type: string, source: system, description: "Id of the subject entity" }
      - { name: actor_role, type: enum, source: system, description: "Renter | Operator | System | RepairTechnician", constraints: "Renter | Operator | System | RepairTechnician" }
      - { name: actor_id, type: string, source: system, description: "X-User-ID of the actor (or 'system')" }
      - { name: unlock_channel, type: enum, source: system, description: "QR | BLUETOOTH | PASSWORD | OPERATOR_OVERRIDE | null", constraints: "QR | BLUETOOTH | PASSWORD | OPERATOR_OVERRIDE | null" }
      - { name: detail, type: object, source: system, description: "Free-form JSON payload (e.g., {removed_to: locker_id, deposit_forfeited_cents: 1500})" }
      - { name: occurred_at, type: datetime, source: system, description: "ISO 8601 UTC of the event" }
      - { name: created_at, type: datetime, source: system, description: "Creation timestamp" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Cabinet
    field: online_status
    initial_state: ONLINE
    terminal_states: []
    note: "Online status drives offline-degraded rules; transitions are system-driven via heartbeat and ops sweep."
    transitions:
      - from: ONLINE
        to: DEGRADED
        trigger: "POST /_sweep/run when now() - last_heartbeat_at >= DEGRADED_THRESHOLD_MINUTES and < OFFLINE_THRESHOLD_MINUTES"
        actor: system
        preconditions:
          - "now() - last_heartbeat_at >= 5 minutes AND < 15 minutes"
        side_effects:
          - "Cabinet.capacity_alert_level recomputed (degraded cabinets count toward redistribution suggestion)"
          - "Cabinet.updated_at refreshed"
          - "Outbound mapping-system sync event emitted with cabinet status"

      - from: [ONLINE, DEGRADED]
        to: OFFLINE
        trigger: "POST /_sweep/run when now() - last_heartbeat_at >= 15 minutes"
        actor: system
        preconditions:
          - "now() - last_heartbeat_at >= 15 minutes"
        side_effects:
          - "All compartments in this cabinet with occupancy_status=IDLE remain rentable only via PASSWORD unlock (offline-degraded operation)"
          - "POST /cabinets/{cabinet_id}/compartments/{compartment_id}/rentals returns ERR_CABINET_OFFLINE for QR and BLUETOOTH channels"
          - "Cabinet.updated_at refreshed"

      - from: [DEGRADED, OFFLINE]
        to: ONLINE
        trigger: "POST /cabinets/{cabinet_id}/heartbeat"
        actor: system
        preconditions:
          - "last_heartbeat_at refreshed to now()"
        side_effects:
          - "Cabinet.updated_at refreshed"

  - entity: Compartment
    field: operational_status
    initial_state: OK
    terminal_states: []
    note: "Parallel dimension #1. Operational status is independent of occupancy_status — a compartment can be RENTED+OK, RENTED+FAULT, IDLE+OK, IDLE+FAULT, or HOLDING+OK. FAULT blocks NEW rentals but does not auto-terminate an existing rental."
    transitions:
      - from: OK
        to: FAULT
        trigger: "POST /repair-tickets (user or system reports fault)"
        actor: "user or system"
        preconditions:
          - "fault_category is one of DOOR_NOT_CLOSED, SENSOR_FAULT, COMMUNICATION_LOSS, USER_REPORTED"
        side_effects:
          - "Compartment.fault_category set"
          - "Compartment locked out from new rentals (validation ERR_COMPARTMENT_FAULT on POST rentals)"
          - "If active_rental_id is set, that rental is NOT auto-terminated (renter may still retrieve item)"

      - from: FAULT
        to: OK
        trigger: "POST /repair-tickets/{ticket_id}/accept"
        actor: Operator
        preconditions:
          - "Associated RepairTicket.status = REPAIRED"
        side_effects:
          - "Compartment.fault_category set to null"
          - "Compartment is again rentable when occupancy_status = IDLE"

  - entity: Compartment
    field: occupancy_status
    initial_state: IDLE
    terminal_states: []
    note: "Parallel dimension #2. Occupancy reflects rental lifecycle; transitions to HOLDING occur ONLY from forced clearance."
    transitions:
      - from: IDLE
        to: RENTED
        trigger: "POST /cabinets/{cabinet_id}/compartments/{compartment_id}/rentals"
        actor: Renter
        preconditions:
          - "Compartment.operational_status = OK"
          - "Compartment.occupancy_status = IDLE"
          - "Cabinet.online_status in {ONLINE, DEGRADED} for QR/BLUETOOTH channels; OFFLINE allowed only for PASSWORD channel"
        side_effects:
          - "Compartment.active_rental_id set"
          - "Cabinet capacity stats recomputed (occupancy_pct, capacity_alert_level)"
          - "AuditEvent COMPARTMENT_OPENED emitted with unlock_channel"

      - from: RENTED
        to: OVERDUE
        trigger: "POST /_sweep/run OR POST /_clock/advance when now() >= Rental.current_expires_at + grace_minutes"
        actor: system
        preconditions:
          - "Associated Rental.status = ACTIVE or EXPIRING_SOON"
          - "now() >= Rental.current_expires_at + grace_minutes_snapshot * 60s"
        side_effects:
          - "Compartment.occupancy_status → OVERDUE"
          - "Rental.status → OVERDUE"
          - "Rental.overdue_fee_cents begins accruing per overdue_fee_accrual calculation"

      - from: [RENTED, OVERDUE]
        to: IDLE
        trigger: "POST /rentals/{rental_id}/return"
        actor: Renter
        preconditions:
          - "Compartment.operational_status = OK (renter may retrieve item; but if OK)"
          - "X-User-ID = Rental.renter_id"
          - "Rental.status in {ACTIVE, EXPIRING_SOON, OVERDUE}"
        side_effects:
          - "Rental.status → RETURNED"
          - "Rental.ended_at set"
          - "Compartment.active_rental_id cleared"
          - "Deposit refund calculation runs (deposit_settlement)"
          - "RevenueRecord rows emitted: RENTAL_FEE and (if overdue_fee > 0) OVERDUE_FEE"
          - "Cabinet capacity stats recomputed"
          - "AuditEvent COMPARTMENT_OPENED emitted (unlock_channel = the channel passed in the return request)"

      - from: OVERDUE
        to: HOLDING
        trigger: "POST /_sweep/run OR POST /_clock/advance when now() >= Rental.current_expires_at + forced_clearance_hours_snapshot hours"
        actor: system
        preconditions:
          - "now() >= Rental.current_expires_at + forced_clearance_hours_snapshot * 3600s"
          - "Rental.status = OVERDUE"
        side_effects:
          - "Compartment.occupancy_status → HOLDING"
          - "Compartment.holding_item_description and holding_claim_deadline set (deadline = now() + CLAIM_WINDOW_HOURS)"
          - "Compartment.active_rental_id cleared (rental no longer occupies the compartment)"
          - "Rental.status → FORCE_CLEARED"
          - "Rental.ended_at set"
          - "Deposit forfeiture: deposit_forfeited_cents = deposit_cents_snapshot (per deposit_settlement variant)"
          - "RevenueRecord rows emitted: RENTAL_FEE, OVERDUE_FEE, DEPOSIT_FORFEIT"
          - "AuditEvent FORCE_CLEARANCE emitted"
          - "Cabinet capacity stats recomputed"

      - from: HOLDING
        to: IDLE
        trigger: "POST /compartments/{compartment_id}/claim-holding (renter retrieves item)"
        actor: Renter
        preconditions:
          - "X-User-ID = Rental.renter_id of the most-recent force-cleared rental on this compartment"
          - "now() <= Compartment.holding_claim_deadline"
        side_effects:
          - "Compartment.occupancy_status → IDLE"
          - "Compartment.holding_item_description and holding_claim_deadline cleared"
          - "AuditEvent COMPARTMENT_OPENED emitted (unlock_channel = OPERATOR_OVERRIDE)"

  - entity: Rental
    field: status
    initial_state: ACTIVE
    terminal_states: [RETURNED, FORCE_CLEARED, REFUNDED]
    note: "Branching with renewal loop (EXPIRING_SOON → ACTIVE via renewal) and divergent force-clearance branch."
    transitions:
      - from: ACTIVE
        to: EXPIRING_SOON
        trigger: "POST /_sweep/run OR POST /_clock/advance when now() >= current_expires_at - REMINDER_LEAD_MINUTES and < current_expires_at"
        actor: system
        preconditions:
          - "now() >= current_expires_at - 30 minutes AND now() < current_expires_at"
          - "Rental.status = ACTIVE"
        side_effects:
          - "Rental.reminder_sent_at = now() (idempotent — only set if currently null)"
          - "Outbound IM-system reminder event emitted"

      - from: EXPIRING_SOON
        to: ACTIVE
        trigger: "POST /rentals/{rental_id}/renew"
        actor: Renter
        preconditions:
          - "X-User-ID = Rental.renter_id"
          - "Rental.status in {ACTIVE, EXPIRING_SOON} (renewal allowed before overdue)"
          - "Compartment.operational_status = OK"
        side_effects:
          - "current_expires_at += renewal billing_units * unit_duration"
          - "rental_fee_cents += renewal_billing_units * unit_price_cents_snapshot"
          - "renewal_count += 1"
          - "reminder_sent_at cleared"
          - "RevenueRecord RENTAL_FEE row emitted for the renewal increment"

      - from: ACTIVE
        to: ACTIVE
        trigger: "POST /rentals/{rental_id}/renew (renewal while not yet near expiry)"
        actor: Renter
        preconditions:
          - "X-User-ID = Rental.renter_id"
          - "Rental.status = ACTIVE"
          - "Compartment.operational_status = OK"
        side_effects:
          - "current_expires_at += renewal billing_units * unit_duration"
          - "rental_fee_cents += renewal_billing_units * unit_price_cents_snapshot"
          - "renewal_count += 1"
          - "RevenueRecord RENTAL_FEE row emitted for the renewal increment"

      - from: [ACTIVE, EXPIRING_SOON]
        to: OVERDUE
        trigger: "POST /_sweep/run OR POST /_clock/advance when now() >= current_expires_at + grace_minutes_snapshot * 60s"
        actor: system
        preconditions:
          - "now() crosses grace boundary"
        side_effects:
          - "Compartment.occupancy_status → OVERDUE (cascade)"
          - "Rental.overdue_fee_cents accrual begins"

      - from: OVERDUE
        to: FORCE_CLEARED
        trigger: "POST /_sweep/run OR POST /_clock/advance when now() >= current_expires_at + forced_clearance_hours_snapshot hours"
        actor: system
        preconditions:
          - "Rental.status = OVERDUE"
        side_effects:
          - "Compartment.occupancy_status → HOLDING (cascade)"
          - "Rental.deposit_forfeited_cents = deposit_cents_snapshot"
          - "Rental.ended_at = now()"
          - "RevenueRecord rows emitted: RENTAL_FEE (if not yet recorded), OVERDUE_FEE (final), DEPOSIT_FORFEIT"
          - "AuditEvent FORCE_CLEARANCE emitted"

      - from: [ACTIVE, EXPIRING_SOON, OVERDUE]
        to: RETURNED
        trigger: "POST /rentals/{rental_id}/return"
        actor: Renter
        preconditions:
          - "X-User-ID = Rental.renter_id"
        side_effects:
          - "Compartment.occupancy_status → IDLE (cascade)"
          - "Rental.ended_at = now()"
          - "Deposit refund per deposit_settlement"
          - "RevenueRecord RENTAL_FEE + (optional OVERDUE_FEE) emitted"

      - from: RETURNED
        to: REFUNDED
        trigger: "POST /rentals/{rental_id}/refund"
        actor: Operator
        preconditions:
          - "Rental.status = RETURNED"
          - "No InsuranceClaim on this rental in status REPORTED, EVIDENCE_PENDING, UNDER_REVIEW, APPROVED, or PAID"
        side_effects:
          - "RevenueRecord REFUND_REVERSAL row emitted (negative gross_cents equal to sum of prior RENTAL_FEE + OVERDUE_FEE for this rental)"
          - "Partner share reversal computed against original partner_share_pct"
          - "Rental.deposit_refunded_cents += any deposit still held"

  - entity: InsuranceClaim
    field: status
    initial_state: REPORTED
    terminal_states: [DENIED, PAID]
    note: "Cyclic — EVIDENCE_REJECTED returns to EVIDENCE_PENDING for re-submission; cycle is the key non-linear shape on this entity."
    transitions:
      - from: REPORTED
        to: EVIDENCE_PENDING
        trigger: "POST /insurance-claims/{claim_id}/request-evidence"
        actor: InsuranceAgent
        preconditions:
          - "Rental.insurance_tier in {BASIC, PREMIUM}"
        side_effects: []

      - from: EVIDENCE_PENDING
        to: UNDER_REVIEW
        trigger: "POST /insurance-claims/{claim_id}/evidence (evidence_count moves from N to N+1, and at least 1 piece of evidence is submitted)"
        actor: Renter
        preconditions:
          - "X-User-ID = InsuranceClaim.renter_id"
          - "evidence_count after submission >= 1"
        side_effects:
          - "Outbound insurance-company sync event emitted; insurer_reference set"

      - from: UNDER_REVIEW
        to: EVIDENCE_REJECTED
        trigger: "POST /insurance-claims/{claim_id}/reject-evidence"
        actor: InsuranceAgent
        preconditions:
          - "rejection_reason provided"
        side_effects: []

      - from: EVIDENCE_REJECTED
        to: EVIDENCE_PENDING
        trigger: "POST /insurance-claims/{claim_id}/request-evidence (re-request)"
        actor: InsuranceAgent
        preconditions: []
        side_effects:
          - "Cycle: claim returns to EVIDENCE_PENDING for renter re-submission"

      - from: UNDER_REVIEW
        to: APPROVED
        trigger: "POST /insurance-claims/{claim_id}/approve"
        actor: InsuranceAgent
        preconditions:
          - "payout_cents provided in request body"
          - "payout_cents <= min(claimed_amount_cents, declared_value_cents, TIER_PAYOUT_CAP)"
        side_effects:
          - "InsuranceClaim.payout_cents set"

      - from: UNDER_REVIEW
        to: DENIED
        trigger: "POST /insurance-claims/{claim_id}/deny"
        actor: InsuranceAgent
        preconditions:
          - "rejection_reason provided"
        side_effects: []

      - from: APPROVED
        to: PAID
        trigger: "POST /insurance-claims/{claim_id}/pay"
        actor: InsuranceAgent
        preconditions: []
        side_effects:
          - "Outbound payment-system sync event emitted (insurer pays renter)"

  - entity: RepairTicket
    field: status
    initial_state: OPEN
    terminal_states: [ACCEPTED, REJECTED]
    note: "Linear with branching at acceptance; ACCEPTED clears Compartment.operational_status, REJECTED keeps it FAULT and re-opens ticket flow."
    transitions:
      - from: OPEN
        to: DISPATCHED
        trigger: "POST /repair-tickets/{ticket_id}/dispatch"
        actor: Operator
        preconditions:
          - "assigned_technician_id provided"
        side_effects: []

      - from: DISPATCHED
        to: REPAIRED
        trigger: "POST /repair-tickets/{ticket_id}/repair"
        actor: RepairTechnician
        preconditions:
          - "X-User-ID = RepairTicket.assigned_technician_id"
          - "repair_notes provided"
        side_effects: []

      - from: REPAIRED
        to: ACCEPTED
        trigger: "POST /repair-tickets/{ticket_id}/accept"
        actor: Operator
        preconditions: []
        side_effects:
          - "Compartment.operational_status → OK (cascade)"
          - "Compartment.fault_category cleared"
          - "RepairTicket.accepted_at = now()"

      - from: REPAIRED
        to: REJECTED
        trigger: "POST /repair-tickets/{ticket_id}/reject"
        actor: Operator
        preconditions:
          - "rejection reason in request body"
        side_effects:
          - "Compartment.operational_status remains FAULT"
          - "A new RepairTicket may be opened for the same compartment"

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - scenario: "Two renters POST a rental on the same IDLE compartment simultaneously"
    guarantee: "At most one rental per compartment in {RENTED, OVERDUE}; loser is rejected. Compartment occupancy is the serializing resource."
    error_id: ERR_COMPARTMENT_UNAVAILABLE
    http_status: 409
    serialization: "First-writer-wins on Compartment.occupancy_status transition IDLE → RENTED"

  - scenario: "Renter posts /return while system sweep posts force-clearance for the same overdue rental"
    guarantee: "Exactly one terminal Rental.status is reached — RETURNED or FORCE_CLEARED — never both. The losing transition is rejected."
    error_id: ERR_INVALID_STATE
    http_status: 409
    serialization: "First-writer-wins on Rental.status transition out of OVERDUE"

  - scenario: "Renter posts /renew while sweep crosses the grace boundary into OVERDUE"
    guarantee: "If sweep wins, renewal is rejected because rental is already OVERDUE. If renew wins, sweep observes ACTIVE and does nothing."
    error_id: ERR_RENEWAL_NOT_PERMITTED
    http_status: 409
    serialization: "First-writer-wins on Rental.status; renewal only valid when status ∈ {ACTIVE, EXPIRING_SOON}"

  - scenario: "PATCH on Rental with stale version while another mutation already committed"
    guarantee: "Stale-version writer is rejected; resource version monotonically increases"
    error_id: ERR_VERSION_CONFLICT
    http_status: 409
    serialization: "If-Match version equality check"

  - scenario: "Two insurance claims POSTed for the same rental simultaneously"
    guarantee: "At most one open InsuranceClaim per rental (status NOT IN {DENIED, PAID}); second is rejected"
    error_id: ERR_CLAIM_ALREADY_OPEN
    http_status: 409
    serialization: "First-writer-wins on InsuranceClaim creation per rental_id"

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: rental_fee
    trigger: "POST /cabinets/{cabinet_id}/compartments/{compartment_id}/rentals AND POST /rentals/{rental_id}/renew side_effects refresh rental_fee_cents"
    algorithm: tiered_pricing
    formula: |
      unit_duration_seconds = {
        HOURLY: 3600,
        DAILY: 86400,
        MONTHLY: 30 * 86400,        # fixed 30-day month per spec
      }[rental_mode]
      rental_fee_cents = billing_units * unit_price_cents_snapshot
      (renewal adds renewal_billing_units * unit_price_cents_snapshot)
    input_set: "Rental.billing_units, Rental.unit_price_cents_snapshot, Rental.rental_mode"
    constants:
      HOUR_SECONDS: 3600
      DAY_SECONDS: 86400
      MONTH_DAYS: 30
    precision: "integer cents, no rounding (inputs are integer cents)"
    variants: []

  - name: insurance_premium
    trigger: "POST /cabinets/{cabinet_id}/compartments/{compartment_id}/rentals refreshes insurance_premium_cents"
    algorithm: tiered_pricing
    formula: |
      # Tier-based premium with declared-value loading; ROUND ORDER PINNED.
      # Step 1: per-day base rate by tier:
      #   BASIC:   base_rate_cents_per_day = 50
      #   PREMIUM: base_rate_cents_per_day = 150
      # Step 2: compute rental_days = ceil(billing_units * unit_duration_seconds / 86400)
      # Step 3: tier_base_cents = base_rate_cents_per_day * rental_days
      # Step 4: value_loading_cents = ceil(declared_value_cents * tier_loading_rate)
      #   BASIC tier_loading_rate   = 0.002  (0.2% of declared value, capped at LOADING_CAP_BASIC=2000)
      #   PREMIUM tier_loading_rate = 0.005  (0.5%, capped at LOADING_CAP_PREMIUM=10000)
      # Step 5: value_loading_cents = min(value_loading_cents, tier_cap)
      # Step 6: insurance_premium_cents = tier_base_cents + value_loading_cents
      # NONE tier: insurance_premium_cents = 0; declared_value_cents must be 0 (else ERR_INVALID_INSURANCE)
      # ROUND ORDER: ceil is applied AFTER multiplication in step 4 (not before).
      # Then summation is done at step 6 (no further rounding because both inputs are integer cents).
    input_set: "Rental.insurance_tier, Rental.declared_value_cents, Rental.billing_units, Rental.rental_mode"
    constants:
      BASIC_BASE_RATE_CENTS_PER_DAY: 50
      PREMIUM_BASE_RATE_CENTS_PER_DAY: 150
      BASIC_LOADING_RATE: 0.002
      PREMIUM_LOADING_RATE: 0.005
      LOADING_CAP_BASIC: 2000
      LOADING_CAP_PREMIUM: 10000
      DECLARED_VALUE_CAP_CENTS: 10000000
    precision: "integer cents; ceil within step 4, no other rounding"
    variants: []

  - name: overdue_fee_accrual
    trigger: "POST /_sweep/run, POST /_clock/advance, GET /rentals/{rental_id} (live recompute), and rental terminating transitions (return, force-clearance)"
    algorithm: chronological
    formula: |
      # Compute overdue_fee_cents at "as_of" time.
      grace_end = current_expires_at + grace_minutes_snapshot * 60s
      if as_of <= grace_end:
          overdue_fee_cents = 0
      else:
          overdue_seconds = (as_of - grace_end).total_seconds()
          # CEIL on started hours — partial hour counts as full hour.
          overdue_hours = ceil(overdue_seconds / 3600)
          overdue_fee_cents = overdue_hours * overdue_rate_snapshot
    input_set: "Rental.current_expires_at, Rental.grace_minutes_snapshot, Rental.overdue_rate_snapshot, server clock"
    constants:
      HOUR_SECONDS: 3600
    precision: "integer cents; CEIL on hours BEFORE multiply by rate (Mode 2: nested rounding — round-then-sum, not sum-then-round)"
    variants:
      - name: live_estimate
        when: "Read of Rental while status = OVERDUE (forward-looking projection)"
        difference: "Computed against now() at request time; not persisted unless a sweep or terminal transition fires"
      - name: final_settled
        when: "On RETURN or FORCE_CLEARED transition (chronological closing)"
        difference: "Computed against ended_at (the transition timestamp) and persisted as Rental.overdue_fee_cents; later GETs return this snapshot, not a recomputed value"

  - name: deposit_settlement
    trigger: "Rental RETURN transition AND Rental FORCE_CLEARED transition refresh deposit_forfeited_cents and deposit_refunded_cents"
    algorithm: waterfall_allocation
    formula: |
      # Variant A (return): deposit funds first cover overdue_fee_cents, remainder refunded.
      # Variant B (force-clearance): deposit fully forfeited regardless of overdue_fee_cents.
      total_deposit = deposit_cents_snapshot
      if transition == RETURN:
          if overdue_fee_cents <= total_deposit:
              deposit_refunded_cents = total_deposit - overdue_fee_cents
              deposit_forfeited_cents = 0
              # Remaining overdue_fee charged separately (RevenueRecord OVERDUE_FEE = overdue_fee_cents);
              # i.e., deposit reimburses overdue, then the OVERDUE_FEE record reflects the full overdue_fee_cents
              # and the deposit_refunded_cents is reduced accordingly. Net: renter loses (overdue_fee_cents) of deposit.
          else:
              deposit_refunded_cents = 0
              deposit_forfeited_cents = 0  # full deposit applied to overdue, none forfeited as penalty
              # outstanding_balance_cents = overdue_fee_cents - total_deposit (NOT collected in this benchmark; tracked only via RevenueRecord OVERDUE_FEE which still equals overdue_fee_cents)
      elif transition == FORCE_CLEARED:
          deposit_refunded_cents = 0
          deposit_forfeited_cents = total_deposit   # full forfeit; independent of overdue_fee magnitude
    input_set: "Rental.deposit_cents_snapshot, Rental.overdue_fee_cents (already computed), transition kind"
    constants: {}
    precision: "integer cents"
    variants:
      - name: return_path
        when: "Renter POST /rentals/{rental_id}/return"
        difference: "Deposit reimburses overdue_fee first; remainder refunded. Renter loss = min(overdue_fee_cents, total_deposit)."
      - name: force_clearance_path
        when: "System POST /_sweep/run beyond forced_clearance_hours"
        difference: "Full deposit forfeited as penalty regardless of overdue_fee_cents. Renter loss = total_deposit + overdue_fee_cents."

  - name: cabinet_capacity_stats
    trigger: "Compartment occupancy_status change (RENTED/OVERDUE/IDLE/HOLDING), Compartment creation/deletion"
    algorithm: aggregation
    formula: |
      For each size_class S in {SMALL, MEDIUM, LARGE}:
          total_S = count(Compartment c WHERE c.cabinet_id = cabinet.id AND c.size_class = S)
          occupied_S = count(Compartment c WHERE c.cabinet_id = cabinet.id AND c.size_class = S AND c.occupancy_status IN {RENTED, OVERDUE})
          occupancy_pct_S = 0 if total_S = 0 else round(100.0 * occupied_S / total_S, 2)   # HALF_UP, 2dp

      # capacity_alert_level derived per cabinet_capacity_alert calculation (separate rule).
    input_set: "All Compartment rows for this Cabinet"
    constants: {}
    precision: "occupancy_pct: 2 decimal places, round_half_up; counts are integer"
    variants: []

  - name: cabinet_capacity_alert
    trigger: "After cabinet_capacity_stats updates"
    algorithm: threshold
    formula: |
      # Tier each size class' occupancy_pct against thresholds; combine via MAX over classes.
      level_for(pct) =
        "CRITICAL" if pct >= CRITICAL_PCT (95.0)
        else "WARNING" if pct >= WARNING_PCT (80.0)
        else "NONE"
      capacity_alert_level = max_severity(level_for(small_occupancy_pct),
                                          level_for(medium_occupancy_pct),
                                          level_for(large_occupancy_pct))
      # Boundary: pct >= 80.00 → WARNING; pct >= 95.00 → CRITICAL (>=, not >).
    input_set: "Cabinet.small_occupancy_pct, medium_occupancy_pct, large_occupancy_pct"
    constants:
      WARNING_PCT: 80.0
      CRITICAL_PCT: 95.0
    precision: "comparison on 2dp percentages with >= semantics"
    variants: []

  - name: revenue_share_split
    trigger: "Per-row at creation time AND per-period via GET /cabinets/{cabinet_id}/revenue-summary"
    algorithm: tiered_pricing
    formula: |
      # ROUND ORDER PINNED: partner share is computed per RevenueRecord row, then the
      # platform share is the residual (gross - partner). This is round-then-residual,
      # NOT round both then sum (which would not balance).
      partner_share_cents = round_half_up(gross_cents * partner_share_pct / 100.0)
      platform_share_cents = gross_cents - partner_share_cents
      # Invariant: partner_share_cents + platform_share_cents == gross_cents for EVERY row,
      # including REFUND_REVERSAL rows where gross_cents is negative.
    input_set: "RevenueRecord.gross_cents, Cabinet.partner_share_pct"
    constants: {}
    precision: "integer cents; round_half_up on partner_share; residual to platform"
    variants:
      - name: per_row
        when: "Each RevenueRecord row creation (on RETURN, FORCE_CLEARED, REFUND transitions). Persisted onto the row."
        difference: |
          partner_share_cents and platform_share_cents are stored on each RevenueRecord row,
          computed independently from that row's gross_cents.
          SUM over rows: partner_total = SUM(partner_share_cents over rows in period).
      - name: per_period_aggregate
        when: "GET /cabinets/{cabinet_id}/revenue-summary — sum gross_cents over the period first, then split."
        difference: |
          aggregate_partner_cents = round_half_up(SUM(gross_cents over period) * partner_share_pct / 100.0)
          aggregate_platform_cents = SUM(gross_cents over period) - aggregate_partner_cents
          Because round_half_up is applied AFTER summation in this variant but BEFORE in the per_row
          variant, the two can diverge by up to 1 cent per row in the period.
          Example: partner_share_pct=30, three RevenueRecord rows with gross=15, gross=15, gross=15:
            per_row:    partner = round(15*0.3)*3 = 5*3 = 15 (round_half_up: 4.5→5)
            per_period: partner = round(45*0.3)   = round(13.5) = 14
          The /revenue-summary endpoint MUST report the per_period_aggregate variant.

  - name: redistribution_suggestion
    trigger: "GET /cabinets/{cabinet_id}/redistribution-suggestion"
    algorithm: weighted_scoring
    formula: |
      # For a source cabinet C in {WARNING, CRITICAL}, find the single best target cabinet T
      # within REDISTRIBUTION_RADIUS_KM (haversine) such that:
      #   - T.online_status = ONLINE
      #   - T.capacity_alert_level = NONE
      #   - T has at least 1 IDLE+OK compartment in the offending size class
      # Eligibility filter: (above three predicates)
      # Ranking expression (LOWER score wins):
      #   score = (distance_km * DISTANCE_WEIGHT) + (T.small_occupancy_pct + T.medium_occupancy_pct + T.large_occupancy_pct) * OCC_WEIGHT
      # Tie-break (lowest score ties): smaller T.id (lexicographic ascending) wins.
      # Fallback: if eligibility filter yields empty set, return {suggestion: null, reason: "NO_TARGET_AVAILABLE"}.
    input_set: "Source cabinet, all other cabinets, haversine distance"
    constants:
      REDISTRIBUTION_RADIUS_KM: 5.0
      DISTANCE_WEIGHT: 10.0
      OCC_WEIGHT: 1.0
      EARTH_RADIUS_KM: 6371.0
    precision: "haversine distance in km, 4dp; score float; comparison on float"
    variants: []

# =============================================================================
# §1.4 Validation Rules Table (priority-ordered)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and well-formed"
    error_id: ERR_UNAUTHORIZED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "X-User-Role is permitted for this endpoint per §1.7 RBAC matrix"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "Referenced cabinet/compartment/rental/claim/ticket/pricing-profile exists. Validate left-to-right in URL path."
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all resource endpoints

  - priority: 4
    category: auth
    check: "Ownership: when role = Renter, X-User-ID must equal Rental.renter_id (or InsuranceClaim.renter_id for claim endpoints)"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "Renter-actor endpoints (renew, return, claim-holding, evidence submission)"

  - priority: 5
    category: state
    check: "If-Match version equals current resource version on PATCH/PUT/cancel/approve/etc."
    error_id: ERR_VERSION_CONFLICT
    http_status: 409
    applies_to: mutation endpoints on existing resources

  - priority: 6
    category: state
    check: "Resource is in a state that permits the requested transition (e.g., Rental must be ACTIVE/EXPIRING_SOON to renew; cannot return a FORCE_CLEARED rental)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: state transition endpoints

  - priority: 7
    category: business_safety
    check: "Compartment.operational_status must be OK to start a new rental"
    error_id: ERR_COMPARTMENT_FAULT
    http_status: 409
    applies_to: "POST /cabinets/{cabinet_id}/compartments/{compartment_id}/rentals"

  - priority: 8
    category: business_safety
    check: "Cabinet.online_status: OFFLINE cabinets accept rentals only via unlock_channel = PASSWORD; QR or BLUETOOTH rejected"
    error_id: ERR_CABINET_OFFLINE
    http_status: 409
    applies_to: "POST /cabinets/{cabinet_id}/compartments/{compartment_id}/rentals"

  - priority: 9
    category: business_referential
    check: "Compartment.occupancy_status must be IDLE for new rental creation"
    error_id: ERR_COMPARTMENT_UNAVAILABLE
    http_status: 409
    applies_to: "POST /cabinets/{cabinet_id}/compartments/{compartment_id}/rentals"

  - priority: 10
    category: business_referential
    check: "PricingProfile must exist for (compartment.size_class, request.rental_mode) at rental creation time"
    error_id: ERR_PRICING_PROFILE_NOT_FOUND
    http_status: 404
    applies_to: "POST /cabinets/{cabinet_id}/compartments/{compartment_id}/rentals"

  - priority: 11
    category: business_constraint
    check: "insurance_tier vs declared_value coherence: NONE requires declared_value_cents == 0; BASIC/PREMIUM require declared_value_cents > 0 and <= DECLARED_VALUE_CAP_CENTS"
    error_id: ERR_INVALID_INSURANCE
    http_status: 422
    applies_to: "POST /cabinets/{cabinet_id}/compartments/{compartment_id}/rentals"

  - priority: 12
    category: business_constraint
    check: "billing_units >= 1, partner_share_pct between 0 and 100, payout_cents not exceeding declared_value_cents at approval"
    error_id: ERR_BAD_REQUEST
    http_status: 422
    applies_to: "POST rentals, POST cabinets, POST insurance-claims/{id}/approve"

  - priority: 13
    category: business_temporal
    check: "HOLDING claim window: claim-holding endpoint rejects when now() > Compartment.holding_claim_deadline"
    error_id: ERR_CLAIM_WINDOW_EXPIRED
    http_status: 409
    applies_to: "POST /compartments/{compartment_id}/claim-holding"

  - priority: 14
    category: business_constraint
    check: "InsuranceClaim uniqueness: only one InsuranceClaim per rental in status NOT IN {DENIED, PAID}"
    error_id: ERR_CLAIM_ALREADY_OPEN
    http_status: 409
    applies_to: "POST /insurance-claims"

  - priority: 15
    category: business_constraint
    check: "Renewal only valid when Rental.status IN {ACTIVE, EXPIRING_SOON}; OVERDUE rental cannot be renewed (only returned or force-cleared)"
    error_id: ERR_RENEWAL_NOT_PERMITTED
    http_status: 409
    applies_to: "POST /rentals/{rental_id}/renew"

  - priority: 16
    category: business_fiscal
    check: "Refund: cannot refund a rental that has an open or paid InsuranceClaim (claim must be in DENIED or no claim exists)"
    error_id: ERR_REFUND_BLOCKED_BY_CLAIM
    http_status: 409
    applies_to: "POST /rentals/{rental_id}/refund"

  - priority: 17
    category: business_fiscal
    check: "payout_cents <= min(claimed_amount_cents, declared_value_cents, TIER_PAYOUT_CAP) at approval"
    error_id: ERR_PAYOUT_EXCEEDS_CAP
    http_status: 422
    applies_to: "POST /insurance-claims/{claim_id}/approve"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Pricing Profiles ---
  - method: POST
    path: "/pricing-profiles"
    description: "Create a pricing profile for (size_class, rental_mode)"
    roles: [Operator]
    code: 201
    input: [size_class, rental_mode, unit_price_cents, deposit_cents, grace_minutes, overdue_rate_cents_per_hour, forced_clearance_hours]
    output: PricingProfile
    side_effects: ["Uniqueness check on (size_class, rental_mode)"]

  - method: GET
    path: "/pricing-profiles"
    description: "List pricing profiles with filters"
    roles: [Operator, Renter]
    code: 200
    input: ["size_class?", "rental_mode?", "limit?", "offset?"]
    output: "PricingProfile[]"
    side_effects: []

  # --- Cabinets ---
  - method: POST
    path: "/cabinets"
    description: "Register a new cabinet"
    roles: [Operator]
    code: 201
    input: [location_code, latitude, longitude, partner_id, partner_share_pct, firmware_version]
    output: Cabinet
    side_effects: ["online_status=ONLINE, capacity_alert_level=NONE, all counters=0"]

  - method: GET
    path: "/cabinets/{cabinet_id}"
    description: "Get cabinet details with derived stats"
    roles: [Operator, Renter]
    code: 200
    input: []
    output: Cabinet
    side_effects: []

  - method: GET
    path: "/cabinets"
    description: "List cabinets (paginated; filterable by online_status, capacity_alert_level)"
    roles: [Operator, Renter]
    code: 200
    input: ["online_status?", "capacity_alert_level?", "limit?", "offset?"]
    output: "Cabinet[]"
    side_effects: []

  - method: PATCH
    path: "/cabinets/{cabinet_id}"
    description: "Update cabinet firmware_version or partner config"
    roles: [Operator]
    code: 200
    input: ["firmware_version?", "partner_id?", "partner_share_pct?", "version"]
    output: Cabinet
    side_effects: ["version increments"]

  - method: POST
    path: "/cabinets/{cabinet_id}/heartbeat"
    description: "Cabinet sends heartbeat; if previously DEGRADED/OFFLINE, transition to ONLINE"
    roles: [Operator]
    code: 200
    input: []
    output: Cabinet
    side_effects: ["last_heartbeat_at = now(); online_status → ONLINE"]

  - method: GET
    path: "/cabinets/{cabinet_id}/redistribution-suggestion"
    description: "Return suggested target cabinet when this cabinet is in WARNING/CRITICAL"
    roles: [Operator]
    code: 200
    input: []
    output: "object {suggestion: Cabinet|null, reason: string|null}"
    side_effects: ["Runs redistribution_suggestion calculation"]

  # --- Compartments ---
  - method: POST
    path: "/cabinets/{cabinet_id}/compartments"
    description: "Add a compartment to a cabinet"
    roles: [Operator]
    code: 201
    input: [slot_number, size_class]
    output: Compartment
    side_effects: ["operational_status=OK, occupancy_status=IDLE; cabinet stats recompute"]

  - method: GET
    path: "/cabinets/{cabinet_id}/compartments/{compartment_id}"
    description: "Get compartment details"
    roles: [Operator, Renter]
    code: 200
    input: []
    output: Compartment
    side_effects: []

  - method: GET
    path: "/cabinets/{cabinet_id}/compartments"
    description: "List compartments under a cabinet"
    roles: [Operator, Renter]
    code: 200
    input: ["size_class?", "operational_status?", "occupancy_status?", "limit?", "offset?"]
    output: "Compartment[]"
    side_effects: []

  - method: POST
    path: "/cabinets/{cabinet_id}/compartments/{compartment_id}/rentals"
    description: "Create a rental (start occupying the compartment)"
    roles: [Renter]
    code: 201
    input: [rental_mode, billing_units, unit_price_cents, deposit_cents, grace_minutes, overdue_rate_cents_per_hour, forced_clearance_hours, insurance_tier, declared_value_cents, unlock_channel]
    output: Rental
    side_effects:
      - "PricingProfile lookup (validated to exist)"
      - "Snapshots pricing into Rental"
      - "Compartment.occupancy_status → RENTED"
      - "rental_fee_cents and insurance_premium_cents computed"
      - "RevenueRecord RENTAL_FEE row emitted with revenue_share_split applied"
      - "Cabinet capacity stats recomputed"
      - "AuditEvent COMPARTMENT_OPENED emitted with unlock_channel"

  - method: POST
    path: "/compartments/{compartment_id}/claim-holding"
    description: "Renter claims an item left in HOLDING after force-clearance"
    roles: [Renter]
    code: 200
    input: []
    output: Compartment
    side_effects:
      - "Compartment.occupancy_status → IDLE"
      - "holding_item_description and holding_claim_deadline cleared"
      - "AuditEvent COMPARTMENT_OPENED emitted (channel=OPERATOR_OVERRIDE)"

  # --- Rentals ---
  - method: GET
    path: "/rentals/{rental_id}"
    description: "Get rental detail with live-estimate overdue_fee_cents (if status = OVERDUE)"
    roles: [Renter, Operator]
    code: 200
    input: []
    output: Rental
    side_effects: ["overdue_fee_accrual variant=live_estimate when status=OVERDUE"]

  - method: GET
    path: "/rentals"
    description: "List rentals (filter by renter_id, cabinet_id, status)"
    roles: [Renter, Operator]
    code: 200
    input: ["renter_id?", "cabinet_id?", "status?", "limit?", "offset?"]
    output: "Rental[]"
    side_effects: []

  - method: POST
    path: "/rentals/{rental_id}/renew"
    description: "Renew an active or expiring-soon rental"
    roles: [Renter]
    code: 200
    input: [renewal_billing_units, version]
    output: Rental
    side_effects:
      - "current_expires_at extends; rental_fee_cents grows; renewal_count++"
      - "RevenueRecord RENTAL_FEE emitted for renewal increment"
      - "reminder_sent_at cleared"

  - method: POST
    path: "/rentals/{rental_id}/return"
    description: "Renter returns the item (terminates rental)"
    roles: [Renter]
    code: 200
    input: [unlock_channel, version]
    output: Rental
    side_effects:
      - "Rental.status → RETURNED"
      - "deposit_settlement (return_path) computed"
      - "Compartment.occupancy_status → IDLE"
      - "RevenueRecord rows: RENTAL_FEE final, OVERDUE_FEE (if any)"
      - "AuditEvent COMPARTMENT_OPENED emitted"
      - "Cabinet capacity stats recomputed"

  - method: POST
    path: "/rentals/{rental_id}/refund"
    description: "Operator issues a full refund (post-return)"
    roles: [Operator]
    code: 200
    input: [version]
    output: Rental
    side_effects:
      - "Rental.status → REFUNDED"
      - "RevenueRecord REFUND_REVERSAL row emitted (negative gross_cents)"

  # --- Insurance Claims ---
  - method: POST
    path: "/insurance-claims"
    description: "Renter reports an insurance claim against a rental"
    roles: [Renter]
    code: 201
    input: [rental_id, claim_type, claimed_amount_cents]
    output: InsuranceClaim
    side_effects: ["status=REPORTED"]

  - method: GET
    path: "/insurance-claims/{claim_id}"
    description: "Get insurance claim detail"
    roles: [Renter, InsuranceAgent, Operator]
    code: 200
    input: []
    output: InsuranceClaim
    side_effects: []

  - method: POST
    path: "/insurance-claims/{claim_id}/request-evidence"
    description: "Insurance agent requests evidence (initial or re-request after rejection)"
    roles: [InsuranceAgent]
    code: 200
    input: [version]
    output: InsuranceClaim
    side_effects: ["status → EVIDENCE_PENDING"]

  - method: POST
    path: "/insurance-claims/{claim_id}/evidence"
    description: "Renter submits evidence (increments evidence_count)"
    roles: [Renter]
    code: 200
    input: [evidence_description, version]
    output: InsuranceClaim
    side_effects: ["evidence_count++; status → UNDER_REVIEW; insurer_reference set"]

  - method: POST
    path: "/insurance-claims/{claim_id}/reject-evidence"
    description: "Insurance agent rejects current evidence batch"
    roles: [InsuranceAgent]
    code: 200
    input: [rejection_reason, version]
    output: InsuranceClaim
    side_effects: ["status → EVIDENCE_REJECTED"]

  - method: POST
    path: "/insurance-claims/{claim_id}/approve"
    description: "Insurance agent approves payout"
    roles: [InsuranceAgent]
    code: 200
    input: [payout_cents, version]
    output: InsuranceClaim
    side_effects: ["status → APPROVED; payout_cents stored"]

  - method: POST
    path: "/insurance-claims/{claim_id}/deny"
    description: "Insurance agent denies claim"
    roles: [InsuranceAgent]
    code: 200
    input: [rejection_reason, version]
    output: InsuranceClaim
    side_effects: ["status → DENIED"]

  - method: POST
    path: "/insurance-claims/{claim_id}/pay"
    description: "Insurance agent records payout"
    roles: [InsuranceAgent]
    code: 200
    input: [version]
    output: InsuranceClaim
    side_effects: ["status → PAID; outbound payment-system sync"]

  # --- Repair Tickets ---
  - method: POST
    path: "/repair-tickets"
    description: "Open a repair ticket against a compartment (renter or system reports fault)"
    roles: [Renter, Operator]
    code: 201
    input: [compartment_id, fault_category]
    output: RepairTicket
    side_effects:
      - "Compartment.operational_status → FAULT"
      - "Compartment.fault_category set"
      - "Compartment locked out from new rentals"

  - method: GET
    path: "/repair-tickets/{ticket_id}"
    description: "Get repair ticket detail"
    roles: [Operator, RepairTechnician]
    code: 200
    input: []
    output: RepairTicket
    side_effects: []

  - method: POST
    path: "/repair-tickets/{ticket_id}/dispatch"
    description: "Operator dispatches the ticket to a technician"
    roles: [Operator]
    code: 200
    input: [assigned_technician_id, version]
    output: RepairTicket
    side_effects: ["status → DISPATCHED"]

  - method: POST
    path: "/repair-tickets/{ticket_id}/repair"
    description: "Technician marks the work as repaired"
    roles: [RepairTechnician]
    code: 200
    input: [repair_notes, version]
    output: RepairTicket
    side_effects: ["status → REPAIRED"]

  - method: POST
    path: "/repair-tickets/{ticket_id}/accept"
    description: "Operator accepts the repair; compartment returns to OK"
    roles: [Operator]
    code: 200
    input: [version]
    output: RepairTicket
    side_effects:
      - "status → ACCEPTED"
      - "Compartment.operational_status → OK"
      - "Compartment.fault_category → null"

  - method: POST
    path: "/repair-tickets/{ticket_id}/reject"
    description: "Operator rejects the repair; ticket terminal, compartment stays FAULT"
    roles: [Operator]
    code: 200
    input: [rejection_reason, version]
    output: RepairTicket
    side_effects:
      - "status → REJECTED"
      - "Compartment remains FAULT (new RepairTicket required)"

  # --- Revenue ---
  - method: GET
    path: "/revenue-records"
    description: "List revenue records (filter by cabinet_id, revenue_kind, date range) for reconciliation"
    roles: [Operator]
    code: 200
    input: ["cabinet_id?", "revenue_kind?", "occurred_at_from?", "occurred_at_to?", "limit?", "offset?"]
    output: "RevenueRecord[]"
    side_effects: []

  - method: GET
    path: "/cabinets/{cabinet_id}/revenue-summary"
    description: "Periodic settlement summary for a cabinet (total platform, total partner, gross)"
    roles: [Operator]
    code: 200
    input: ["occurred_at_from?", "occurred_at_to?"]
    output: "object {total_gross_cents, total_partner_cents, total_platform_cents}"
    side_effects: []

  # --- Audit ---
  - method: GET
    path: "/audit-events"
    description: "List audit events (filter by event_kind, subject_id, occurred_at range)"
    roles: [Operator]
    code: 200
    input: ["event_kind?", "subject_id?", "subject_type?", "actor_id?", "occurred_at_from?", "occurred_at_to?", "limit?", "offset?"]
    output: "AuditEvent[]"
    side_effects: []

  # --- Test/Operations endpoints (required to make time-gated transitions reachable) ---
  - method: POST
    path: "/_clock/advance"
    description: "Advance the server clock to a given ISO 8601 timestamp (test/ops driver). Triggers no sweep on its own; use /_sweep/run for that."
    roles: [Operator]
    code: 200
    input: [to_timestamp]
    output: "object {server_time: ISO8601}"
    side_effects: []

  - method: POST
    path: "/_sweep/run"
    description: "Run the periodic sweep that fires time-gated state transitions (EXPIRING_SOON, OVERDUE, FORCE_CLEARED; cabinet DEGRADED/OFFLINE based on last_heartbeat_at)"
    roles: [Operator]
    code: 200
    input: []
    output: "object {transitions_count: integer}"
    side_effects:
      - "Rentals: ACTIVE → EXPIRING_SOON if within reminder window"
      - "Rentals: ACTIVE/EXPIRING_SOON → OVERDUE if grace boundary crossed"
      - "Rentals: OVERDUE → FORCE_CLEARED if forced_clearance_hours boundary crossed"
      - "Compartments cascade per Rental transitions"
      - "Cabinets: ONLINE → DEGRADED or DEGRADED → OFFLINE based on last_heartbeat_at age"
      - "RevenueRecord rows emitted on terminal Rental transitions"
      - "AuditEvent FORCE_CLEARANCE emitted on force-clearance transitions"


# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_UNAUTHORIZED
    http: 401
    condition: "Missing or malformed X-User-Role/X-User-ID headers"

  - id: ERR_FORBIDDEN
    http: 403
    condition: "Role not permitted for endpoint, or ownership check failed (Renter X-User-ID != resource.renter_id)"

  - id: ERR_NOT_FOUND
    http: 404
    condition: "Referenced resource does not exist"

  - id: ERR_PRICING_PROFILE_NOT_FOUND
    http: 404
    condition: "No PricingProfile for (size_class, rental_mode) at rental creation"

  - id: ERR_BAD_REQUEST
    http: 422
    condition: "Malformed body, missing required field, out-of-range numeric input"

  - id: ERR_VERSION_CONFLICT
    http: 409
    condition: "If-Match version does not equal current resource version"

  - id: ERR_INVALID_STATE
    http: 409
    condition: "Resource not in valid state for requested transition"

  - id: ERR_COMPARTMENT_FAULT
    http: 409
    condition: "Compartment.operational_status = FAULT; new rentals blocked"

  - id: ERR_COMPARTMENT_UNAVAILABLE
    http: 409
    condition: "Compartment.occupancy_status != IDLE; cannot start new rental"

  - id: ERR_CABINET_OFFLINE
    http: 409
    condition: "Cabinet.online_status = OFFLINE; only PASSWORD unlock_channel accepted for new rentals"

  - id: ERR_INVALID_INSURANCE
    http: 422
    condition: "insurance_tier and declared_value_cents incoherent (e.g., NONE with declared > 0, BASIC/PREMIUM with declared = 0, or declared > DECLARED_VALUE_CAP_CENTS)"

  - id: ERR_RENEWAL_NOT_PERMITTED
    http: 409
    condition: "Rental.status not in {ACTIVE, EXPIRING_SOON} (e.g., OVERDUE or RETURNED rentals cannot be renewed)"

  - id: ERR_CLAIM_ALREADY_OPEN
    http: 409
    condition: "An InsuranceClaim already exists for this rental in status NOT IN {DENIED, PAID}"

  - id: ERR_CLAIM_WINDOW_EXPIRED
    http: 409
    condition: "now() > Compartment.holding_claim_deadline; renter can no longer claim the held item"

  - id: ERR_REFUND_BLOCKED_BY_CLAIM
    http: 409
    condition: "Cannot refund a rental that has an InsuranceClaim in status REPORTED, EVIDENCE_PENDING, UNDER_REVIEW, EVIDENCE_REJECTED, APPROVED, or PAID"

  - id: ERR_PAYOUT_EXCEEDS_CAP
    http: 422
    condition: "payout_cents > min(claimed_amount_cents, declared_value_cents, TIER_PAYOUT_CAP) at claim approval"

  - id: ERR_DUPLICATE_PROFILE
    http: 409
    condition: "PricingProfile with same (size_class, rental_mode) already exists"

  - id: ERR_DUPLICATE_SLOT
    http: 409
    condition: "Compartment with same slot_number already exists under this cabinet"

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Renter
    description: "End-user who rents compartments, renews, returns, files insurance claims, reports faults. X-User-ID identifies the Renter."
    identity: "opaque"
    # NOTE: There is no Renter entity in §1.1; renter_id is an opaque string FK stored on Rental.
    # Ownership checks (e.g., return must be by same renter) compare X-User-ID to Rental.renter_id directly.
    exclusive_operations:
      - "POST /cabinets/{cabinet_id}/compartments/{compartment_id}/rentals"
      - "POST /rentals/{rental_id}/renew"
      - "POST /rentals/{rental_id}/return"
      - "POST /compartments/{compartment_id}/claim-holding"
      - "POST /insurance-claims"
      - "POST /insurance-claims/{claim_id}/evidence"
    shared_operations:
      - "GET /cabinets, GET /cabinets/{id}, GET /cabinets/{id}/compartments, GET /cabinets/{id}/compartments/{id}"
      - "GET /pricing-profiles"
      - "GET /rentals/{rental_id} (when owner)"
      - "GET /rentals (filtered to own)"
      - "GET /insurance-claims/{claim_id} (when owner)"
      - "POST /repair-tickets (user-reported fault)"

  - name: Operator
    description: "Platform operations staff: manages cabinets, compartments, pricing, dispatches repairs, issues refunds, reads revenue and audit logs. X-User-ID is an opaque operator id."
    identity: "opaque"
    exclusive_operations:
      - "POST /pricing-profiles"
      - "POST /cabinets, PATCH /cabinets/{id}, POST /cabinets/{id}/heartbeat, GET /cabinets/{id}/redistribution-suggestion"
      - "POST /cabinets/{cabinet_id}/compartments"
      - "POST /rentals/{rental_id}/refund"
      - "POST /repair-tickets/{ticket_id}/dispatch"
      - "POST /repair-tickets/{ticket_id}/accept"
      - "POST /repair-tickets/{ticket_id}/reject"
      - "GET /revenue-records, GET /cabinets/{id}/revenue-summary"
      - "GET /audit-events"
      - "POST /_clock/advance, POST /_sweep/run, POST /_events/emit"
    shared_operations:
      - "GET /cabinets, GET /cabinets/{id}, GET /pricing-profiles, GET /repair-tickets/{id}"
      - "GET /rentals/{rental_id} (any), GET /rentals (any filter)"
      - "POST /repair-tickets (operator-reported)"

  - name: RepairTechnician
    description: "Field technician dispatched to compartments. X-User-ID is the technician_id stored on RepairTicket.assigned_technician_id."
    identity: "opaque"
    exclusive_operations:
      - "POST /repair-tickets/{ticket_id}/repair (must be assigned technician)"
    shared_operations:
      - "GET /repair-tickets/{id} (when assigned)"

  - name: InsuranceAgent
    description: "Insurance company representative who reviews claims. X-User-ID is an opaque insurer id."
    identity: "opaque"
    exclusive_operations:
      - "POST /insurance-claims/{claim_id}/request-evidence"
      - "POST /insurance-claims/{claim_id}/reject-evidence"
      - "POST /insurance-claims/{claim_id}/approve"
      - "POST /insurance-claims/{claim_id}/deny"
      - "POST /insurance-claims/{claim_id}/pay"
    shared_operations:
      - "GET /insurance-claims/{claim_id}"
