    roles: [Server]
    code: 200
    input: []
    output: ServiceRequest
    side_effects: ["IN_PROGRESS->NON_EST; bubble Assignment->COMPLETED; update Server counters & reliability"]

  - method: POST
    path: "/service-requests/{id}/cancel"
    description: "Cancel a request (cascade root)"
    roles: [Dispatcher]
    code: 200
    input: []
