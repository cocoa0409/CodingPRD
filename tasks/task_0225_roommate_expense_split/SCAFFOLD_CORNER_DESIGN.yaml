scaffold_corner_design:

  # =========================================================================
  # Section: entities
  # =========================================================================
  - section: entities
    instances:
      - name: create_roommate_profile_returns_201_with_fields
        claim_type: Creation
        grounds:
          - entities.RoommateProfile
          - endpoints.POST_/roommate-profiles
        distinguishing_aspect: "POST /roommate-profiles with all required fields returns 201 and the response data carries the input fields plus system-minted id, created_at, version=1, net_balance_cents=0."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /roommate-profiles"
              payload: { email: "create@x.com", full_name: "Creator", monthly_income_cents: 500000, cleanliness: 4, sleep_schedule: "EARLY_BIRD", smoker: false, pets: false }
              as: Roommate
              captures: { p_id: "$.data.id" }
          assert:
            - "response status == 201"
            - "RoommateProfile.${p_id}.full_name == Creator"
            - "RoommateProfile.${p_id}.version == 1"
            - "RoommateProfile.${p_id}.net_balance_cents == 0"

      - name: get_roommate_profile_not_found_404
        claim_type: Not Found
        grounds:
          - entities.RoommateProfile
          - errors[ERR_NOT_FOUND]
          - endpoints.GET_/roommate-profiles/{id}
        distinguishing_aspect: "GET /roommate-profiles/{id} for a non-existent UUID returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB; a registered actor exists to pass auth."]
          setup_api_calls:
            - call: "POST /roommate-profiles"
              payload: { email: "actor@x.com", full_name: "Actor", monthly_income_cents: 500000, cleanliness: 4, sleep_schedule: "FLEXIBLE", smoker: false, pets: false }
              as: Roommate
              captures: { a_id: "$.data.id" }
          trigger:
            - call: "GET /roommate-profiles/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: Roommate
              as_user_id: "${a_id}"
          assert:
            - "response status == 404"
            - "error_id == ERR_NOT_FOUND"

      - name: create_profile_missing_required_field_422
        claim_type: Required Fields
        grounds:
          - entities.RoommateProfile.fields.cleanliness
          - errors[ERR_VALIDATION]
          - endpoints.POST_/roommate-profiles
        distinguishing_aspect: "Omitting the required cleanliness field on POST /roommate-profiles returns ERR_VALIDATION (422)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /roommate-profiles"
              payload: { email: "missing@x.com", full_name: "Missing", monthly_income_cents: 500000, sleep_schedule: "FLEXIBLE" }
              as: Roommate
          assert:
            - "response status == 422"
            - "error_id == ERR_VALIDATION"

      - name: create_profile_invalid_enum_cleanliness_422
        claim_type: Type Constraints
        grounds:
          - entities.RoommateProfile.fields.cleanliness
          - errors[ERR_VALIDATION]
        distinguishing_aspect: "cleanliness outside 1..5 (here 7) on POST /roommate-profiles returns ERR_VALIDATION (422)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /roommate-profiles"
              payload: { email: "bad@x.com", full_name: "Bad", monthly_income_cents: 500000, cleanliness: 7, sleep_schedule: "FLEXIBLE", smoker: false, pets: false }
              as: Roommate
          assert:
            - "response status == 422"
            - "error_id == ERR_VALIDATION"

      - name: smoker_default_false_applied
        claim_type: Defaults
        grounds:
          - entities.RoommateProfile.fields.smoker
        distinguishing_aspect: "Omitting smoker on POST /roommate-profiles applies the default false."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /roommate-profiles"
              payload: { email: "def@x.com", full_name: "Def", monthly_income_cents: 500000, cleanliness: 4, sleep_schedule: "FLEXIBLE" }
              as: Roommate
              captures: { p_id: "$.data.id" }
          assert:
            - "response status == 201"
            - "RoommateProfile.${p_id}.smoker == false"
            - "RoommateProfile.${p_id}.pets == false"

      - name: email_uniqueness_conflict_409
        claim_type: Type Constraints
        grounds:
          - entities.RoommateProfile.fields.email
          - validations[priority=19]
          - errors[ERR_EMAIL_TAKEN]
        distinguishing_aspect: "A second POST /roommate-profiles with an already-registered email returns ERR_EMAIL_TAKEN (409)."
        test_recipe:
          setup: ["A profile with email dup@x.com already exists."]
          setup_api_calls:
            - call: "POST /roommate-profiles"
              payload: { email: "dup@x.com", full_name: "First", monthly_income_cents: 500000, cleanliness: 4, sleep_schedule: "FLEXIBLE", smoker: false, pets: false }
              as: Roommate
          trigger:
            - call: "POST /roommate-profiles"
              payload: { email: "dup@x.com", full_name: "Second", monthly_income_cents: 400000, cleanliness: 3, sleep_schedule: "FLEXIBLE", smoker: false, pets: false }
              as: Roommate
          assert:
            - "response status == 409"
            - "error_id == ERR_EMAIL_TAKEN"

      - name: billsplit_immutable_no_version_field
        claim_type: Immutability
        grounds:
          - entities.BillSplit
        distinguishing_aspect: "BillSplit has common_fields:false — it exposes id and created_at but no version field and no direct update endpoint; share_cents changes only via bill_split recompute."
        test_recipe:
          setup: ["A household with 1 ACTIVE member M1 and an issued RENT bill, so a BillSplit row exists."]
          setup_api_calls:
            - call: "POST /roommate-profiles"
              payload: { email: "lim_l@x.com", full_name: "LimL", monthly_income_cents: 500000, cleanliness: 5, sleep_schedule: "FLEXIBLE", smoker: false, pets: false }
              as: Roommate
              captures: { l_id: "$.data.id" }
            - call: "POST /roommate-profiles"
              payload: { email: "lim_m@x.com", full_name: "LimM", monthly_income_cents: 500000, cleanliness: 5, sleep_schedule: "FLEXIBLE", smoker: false, pets: false }
              as: Roommate
              captures: { m1_id: "$.data.id" }
            - call: "POST /room-listings"
              payload: { lister_id: "${l_id}", title: "LimRoom", monthly_rent_cents: 200000, capacity: 3, room_size_sqft: 200, wants_cleanliness: 1, wants_sleep_schedule: "FLEXIBLE", no_smokers: false, no_pets: false }
              as: Roommate
              as_user_id: "${l_id}"
              captures: { listing_id: "$.data.id" }
            - call: "POST /match-requests"
              payload: { listing_id: "${listing_id}", applicant_id: "${m1_id}", scoring_mode: "STRICT" }
              as: Roommate
              as_user_id: "${m1_id}"
              captures: { mr1: "$.data.id" }
            - call: "POST /match-requests/${mr1}/accept"
              payload: {}
              as: Roommate
              as_user_id: "${l_id}"
            - call: "GET /households?manager_id=${l_id}"
              payload: {}
              as: Roommate
              as_user_id: "${l_id}"
              captures: { hid: "$.data[0].id" }
            - call: "GET /memberships?profile_id=${m1_id}&household_id=${hid}"
              payload: {}
              as: Roommate
              as_user_id: "${l_id}"
              captures: { mem1: "$.data[0].id" }
            - call: "POST /memberships/${mem1}/activate"
              payload: {}
              as: Roommate
              as_user_id: "${l_id}"
            - call: "POST /bills"
              payload: { household_id: "${hid}", bill_type: "RENT", total_amount_cents: 200000, period_start: "2026-06-01T00:00:00.000Z", period_end: "2026-06-30T00:00:00.000Z" }
              as: Roommate
              as_user_id: "${l_id}"
              captures: { bill_id: "$.data.id" }
          trigger:
            - call: "GET /bills/${bill_id}/splits"
              payload: {}
              as: Roommate
              as_user_id: "${l_id}"
          assert:
            - "BillSplit for M1 (profile_id == ${m1_id}).share_cents == 200000"
            - "the returned BillSplit object exposes no version field"

  # =========================================================================
  # Section: state_machines
  # =========================================================================
  - section: state_machines
    instances:
      - name: match_request_initial_state_pending
        claim_type: Initial State
        grounds:
          - state_machines.MatchRequest
          - entities.MatchRequest.fields.status
        distinguishing_aspect: "A newly created MatchRequest starts in status PENDING."
        test_recipe:
          setup: ["Lister L and applicant M exist; M applies."]
          setup_api_calls:
            - call: "POST /roommate-profiles"
              payload: { email: "ini_l@x.com", full_name: "IniL", monthly_income_cents: 500000, cleanliness: 5, sleep_schedule: "FLEXIBLE", smoker: false, pets: false }
              as: Roommate
              captures: { l_id: "$.data.id" }
            - call: "POST /roommate-profiles"
              payload: { email: "ini_m@x.com", full_name: "IniM", monthly_income_cents: 500000, cleanliness: 5, sleep_schedule: "FLEXIBLE", smoker: false, pets: false }
              as: Roommate
              captures: { m_id: "$.data.id" }
            - call: "POST /room-listings"
              payload: { lister_id: "${l_id}", title: "IniRoom", monthly_rent_cents: 150000, capacity: 2, room_size_sqft: 180, wants_cleanliness: 1, wants_sleep_schedule: "FLEXIBLE", no_smokers: false, no_pets: false }
              as: Roommate
              as_user_id: "${l_id}"
              captures: { listing_id: "$.data.id" }
          trigger:
            - call: "POST /match-requests"
              payload: { listing_id: "${listing_id}", applicant_id: "${m_id}", scoring_mode: "STRICT" }
              as: Roommate
              as_user_id: "${m_id}"
              captures: { mr: "$.data.id" }
          assert:
            - "response status == 201"
            - "MatchRequest.${mr}.status == PENDING"

      - name: accept_already_accepted_match_request_invalid_state
        claim_type: Invalid Transitions
        grounds:
          - state_machines.MatchRequest.PENDING_to_ACCEPTED
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "Accepting a MatchRequest already in ACCEPTED returns ERR_INVALID_STATE (409); PENDING is the only valid from-state for accept."
        test_recipe:
          setup: ["Lister L accepted applicant M's request once (now ACCEPTED)."]
          setup_api_calls:
            - call: "POST /roommate-profiles"
              payload: { email: "acc_l@x.com", full_name: "AccL", monthly_income_cents: 500000, cleanliness: 5, sleep_schedule: "FLEXIBLE", smoker: false, pets: false }
              as: Roommate
              captures: { l_id: "$.data.id" }
            - call: "POST /roommate-profiles"
              payload: { email: "acc_m@x.com", full_name: "AccM", monthly_income_cents: 500000, cleanliness: 5, sleep_schedule: "FLEXIBLE", smoker: false, pets: false }
              as: Roommate
              captures: { m_id: "$.data.id" }
            - call: "POST /room-listings"
              payload: { lister_id: "${l_id}", title: "AccRoom", monthly_rent_cents: 150000, capacity: 2, room_size_sqft: 180, wants_cleanliness: 1, wants_sleep_schedule: "FLEXIBLE", no_smokers: false, no_pets: false }
              as: Roommate
              as_user_id: "${l_id}"
              captures: { listing_id: "$.data.id" }
            - call: "POST /match-requests"
              payload: { listing_id: "${listing_id}", applicant_id: "${m_id}", scoring_mode: "STRICT" }
              as: Roommate
              as_user_id: "${m_id}"
              captures: { mr: "$.data.id" }
            - call: "POST /match-requests/${mr}/accept"
              payload: {}
              as: Roommate
              as_user_id: "${l_id}"
          trigger:
            - call: "POST /match-requests/${mr}/accept"
              payload: {}
              as: Roommate
              as_user_id: "${l_id}"
          assert:
            - "response status == 409"
            - "error_id == ERR_INVALID_STATE"

      - name: move_out_already_moved_out_terminal_lockdown
        claim_type: Terminal State Lockdown
        grounds:
          - state_machines.Membership.ACTIVE_to_MOVED_OUT
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "MOVED_OUT is terminal for Membership: a second move-out on an already MOVED_OUT membership returns ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["Household managed by L with M1 who has already MOVED_OUT; clock 2026-06-01 then 2026-06-15."]
          setup_api_calls:
            - call: "POST /roommate-profiles"
              payload: { email: "term_l@x.com", full_name: "TermL", monthly_income_cents: 500000, cleanliness: 5, sleep_schedule: "FLEXIBLE", smoker: false, pets: false }
              as: Roommate
              captures: { l_id: "$.data.id" }
            - call: "POST /roommate-profiles"
              payload: { email: "term_m@x.com", full_name: "TermM", monthly_income_cents: 500000, cleanliness: 5, sleep_schedule: "FLEXIBLE", smoker: false, pets: false }
              as: Roommate
              captures: { m1_id: "$.data.id" }
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-06-01T00:00:00.000Z" }
              as: PlatformOperator
            - call: "POST /room-listings"
              payload: { lister_id: "${l_id}", title: "TermRoom", monthly_rent_cents: 200000, capacity: 3, room_size_sqft: 200, wants_cleanliness: 1, wants_sleep_schedule: "FLEXIBLE", no_smokers: false, no_pets: false }
              as: Roommate
              as_user_id: "${l_id}"
              captures: { listing_id: "$.data.id" }
            - call: "POST /match-requests"
              payload: { listing_id: "${listing_id}", applicant_id: "${m1_id}", scoring_mode: "STRICT" }
              as: Roommate
              as_user_id: "${m1_id}"
              captures: { mr1: "$.data.id" }
            - call: "POST /match-requests/${mr1}/accept"
              payload: {}
              as: Roommate
              as_user_id: "${l_id}"
            - call: "GET /households?manager_id=${l_id}"
              payload: {}
              as: Roommate
              as_user_id: "${l_id}"
              captures: { hid: "$.data[0].id" }
            - call: "GET /memberships?profile_id=${m1_id}&household_id=${hid}"
              payload: {}
              as: Roommate
              as_user_id: "${l_id}"
              captures: { mem1: "$.data[0].id" }
            - call: "POST /memberships/${mem1}/activate"
              payload: {}
              as: Roommate
              as_user_id: "${l_id}"
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-06-15T00:00:00.000Z" }
              as: PlatformOperator
            - call: "POST /memberships/${mem1}/move-out"
              payload: {}
              as: Roommate
              as_user_id: "${m1_id}"
          trigger:
            - call: "POST /memberships/${mem1}/move-out"
              payload: {}
              as: Roommate
              as_user_id: "${m1_id}"
          assert:
            - "response status == 409"
            - "error_id == ERR_INVALID_STATE"

      - name: settlement_cancel_then_confirm_invalid_state
        claim_type: Invalid Transitions
        grounds:
          - state_machines.Settlement.PROPOSED_to_CANCELLED
          - state_machines.Settlement.PROPOSED_to_CONFIRMED
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "Confirming a CANCELLED (terminal) Settlement returns ERR_INVALID_STATE (409); confirm is only valid from PROPOSED."
        test_recipe:
          setup: ["Household managed by L with ACTIVE M1,M2; M1 posted 9000 expense; a 4500 settlement M2->M1 was PROPOSED then CANCELLED."]
          setup_api_calls:
            - call: "POST /roommate-profiles"
              payload: { email: "scan_l@x.com", full_name: "ScanL", monthly_income_cents: 500000, cleanliness: 5, sleep_schedule: "FLEXIBLE", smoker: false, pets: false }
              as: Roommate
              captures: { l_id: "$.data.id" }
            - call: "POST /roommate-profiles"
              payload: { email: "scan_m1@x.com", full_name: "ScanM1", monthly_income_cents: 500000, cleanliness: 5, sleep_schedule: "FLEXIBLE", smoker: false, pets: false }
              as: Roommate
              captures: { m1_id: "$.data.id" }
            - call: "POST /roommate-profiles"
              payload: { email: "scan_m2@x.com", full_name: "ScanM2", monthly_income_cents: 500000, cleanliness: 5, sleep_schedule: "FLEXIBLE", smoker: false, pets: false }
              as: Roommate
              captures: { m2_id: "$.data.id" }
            - call: "POST /room-listings"
              payload: { lister_id: "${l_id}", title: "ScanRoom", monthly_rent_cents: 200000, capacity: 3, room_size_sqft: 200, wants_cleanliness: 1, wants_sleep_schedule: "FLEXIBLE", no_smokers: false, no_pets: false }
              as: Roommate
              as_user_id: "${l_id}"
              captures: { listing_id: "$.data.id" }
            - call: "POST /match-requests"
              payload: { listing_id: "${listing_id}", applicant_id: "${m1_id}", scoring_mode: "STRICT" }
              as: Roommate
              as_user_id: "${m1_id}"
              captures: { mr1: "$.data.id" }
            - call: "POST /match-requests/${mr1}/accept"
              payload: {}
              as: Roommate
              as_user_id: "${l_id}"
            - call: "GET /households?manager_id=${l_id}"
              payload: {}
              as: Roommate
              as_user_id: "${l_id}"
              captures: { hid: "$.data[0].id" }
            - call: "GET /memberships?profile_id=${m1_id}&household_id=${hid}"
              payload: {}
              as: Roommate
              as_user_id: "${l_id}"
              captures: { mem1: "$.data[0].id" }
            - call: "POST /memberships/${mem1}/activate"
              payload: {}
              as: Roommate
              as_user_id: "${l_id}"
            - call: "POST /match-requests"
              payload: { listing_id: "${listing_id}", applicant_id: "${m2_id}", scoring_mode: "STRICT" }
              as: Roommate
              as_user_id: "${m2_id}"
              captures: { mr2: "$.data.id" }
            - call: "POST /match-requests/${mr2}/accept"
              payload: {}
              as: Roommate
              as_user_id: "${l_id}"
            - call: "GET /memberships?profile_id=${m2_id}&household_id=${hid}"
              payload: {}
              as: Roommate
              as_user_id: "${l_id}"
              captures: { mem2: "$.data[0].id" }
            - call: "POST /memberships/${mem2}/activate"
              payload: {}
              as: Roommate
              as_user_id: "${l_id}"
            - call: "POST /expenses"
              payload: { household_id: "${hid}", payer_id: "${m1_id}", description: "scan", total_amount_cents: 9000, split_mode: "EQUAL", participant_ids: ["${m1_id}", "${m2_id}"] }
              as: Roommate
              as_user_id: "${m1_id}"
            - call: "POST /settlements"
              payload: { household_id: "${hid}", from_profile_id: "${m2_id}", to_profile_id: "${m1_id}", amount_cents: 4500 }
              as: Roommate
              as_user_id: "${m2_id}"
              captures: { settle_id: "$.data.id" }
            - call: "POST /settlements/${settle_id}/cancel"
              payload: {}
              as: Roommate
              as_user_id: "${m2_id}"
            - call: "GET /households/${hid}"
              payload: {}
              as: Roommate
              as_user_id: "${l_id}"
              captures: { hv: "$.data.version" }
          trigger:
            - call: "POST /settlements/${settle_id}/confirm"
              payload: { expected_household_version: "${hv}" }
              as: Roommate
              as_user_id: "${m1_id}"
          assert:
            - "response status == 409"
            - "error_id == ERR_INVALID_STATE"

      - name: dispute_reject_unfreezes_household_back_to_active
        claim_type: Side Effect Execution
        grounds:
          - state_machines.Dispute.UNDER_REVIEW_to_REJECTED
          - entities.Household.fields.status
        distinguishing_aspect: "Rejecting the only UNDER_REVIEW dispute unfreezes its household: Household.status returns to ACTIVE."
        test_recipe:
          setup: ["Household managed by L with ACTIVE M1,M2; M1 posted 9000 expense; M1 filed a dispute on it; mediator claimed it (FROZEN)."]
          setup_api_calls:
            - call: "POST /roommate-profiles"
              payload: { email: "unf_l@x.com", full_name: "UnfL", monthly_income_cents: 500000, cleanliness: 5, sleep_schedule: "FLEXIBLE", smoker: false, pets: false }
              as: Roommate
              captures: { l_id: "$.data.id" }
            - call: "POST /roommate-profiles"
              payload: { email: "unf_m1@x.com", full_name: "UnfM1", monthly_income_cents: 500000, cleanliness: 5, sleep_schedule: "FLEXIBLE", smoker: false, pets: false }
              as: Roommate
              captures: { m1_id: "$.data.id" }
            - call: "POST /roommate-profiles"
              payload: { email: "unf_m2@x.com", full_name: "UnfM2", monthly_income_cents: 500000, cleanliness: 5, sleep_schedule: "FLEXIBLE", smoker: false, pets: false }
              as: Roommate
              captures: { m2_id: "$.data.id" }
            - call: "POST /room-listings"
              payload: { lister_id: "${l_id}", title: "UnfRoom", monthly_rent_cents: 200000, capacity: 3, room_size_sqft: 200, wants_cleanliness: 1, wants_sleep_schedule: "FLEXIBLE", no_smokers: false, no_pets: false }
              as: Roommate
              as_user_id: "${l_id}"
              captures: { listing_id: "$.data.id" }
            - call: "POST /match-requests"
              payload: { listing_id: "${listing_id}", applicant_id: "${m1_id}", scoring_mode: "STRICT" }
              as: Roommate
              as_user_id: "${m1_id}"
              captures: { mr1: "$.data.id" }
            - call: "POST /match-requests/${mr1}/accept"
              payload: {}
              as: Roommate
              as_user_id: "${l_id}"
            - call: "GET /households?manager_id=${l_id}"
              payload: {}
              as: Roommate
              as_user_id: "${l_id}"
              captures: { hid: "$.data[0].id" }
            - call: "GET /memberships?profile_id=${m1_id}&household_id=${hid}"
              payload: {}
              as: Roommate
              as_user_id: "${l_id}"
              captures: { mem1: "$.data[0].id" }
            - call: "POST /memberships/${mem1}/activate"
              payload: {}
              as: Roommate
              as_user_id: "${l_id}"
            - call: "POST /match-requests"
              payload: { listing_id: "${listing_id}", applicant_id: "${m2_id}", scoring_mode: "STRICT" }
              as: Roommate
              as_user_id: "${m2_id}"
              captures: { mr2: "$.data.id" }
            - call: "POST /match-requests/${mr2}/accept"
              payload: {}
              as: Roommate
              as_user_id: "${l_id}"
            - call: "GET /memberships?profile_id=${m2_id}&household_id=${hid}"
              payload: {}
              as: Roommate
              as_user_id: "${l_id}"
              captures: { mem2: "$.data[0].id" }
            - call: "POST /memberships/${mem2}/activate"
              payload: {}
              as: Roommate
              as_user_id: "${l_id}"
            - call: "POST /expenses"
              payload: { household_id: "${hid}", payer_id: "${m1_id}", description: "unf", total_amount_cents: 9000, split_mode: "EQUAL", participant_ids: ["${m1_id}", "${m2_id}"] }
              as: Roommate
              as_user_id: "${m1_id}"
              captures: { exp_id: "$.data.id" }
            - call: "POST /disputes"
              payload: { household_id: "${hid}", expense_id: "${exp_id}", filed_by_id: "${m1_id}", reason: "unf" }
              as: Roommate
              as_user_id: "${m1_id}"
              captures: { disp_id: "$.data.id" }
            - call: "POST /disputes/${disp_id}/claim"
              payload: {}
              as: DisputeMediator
              as_user_id: "med-c1"
          trigger:
            - call: "POST /disputes/${disp_id}/reject"
              payload: {}
              as: DisputeMediator
              as_user_id: "med-c1"
          assert:
            - "Dispute.${disp_id}.status == REJECTED"
            - "Household.${hid}.status == ACTIVE"

