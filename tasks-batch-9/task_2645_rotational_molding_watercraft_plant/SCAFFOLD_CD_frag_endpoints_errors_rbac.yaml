            - "the second cycle on PO-CD-5 returns status 409 with data.error_id 'ERR_ORDER_OVERBUILD' because the one already-scheduled unit plus at least one further cavity exceeds floor(1 * 1.20) = 1"
            - "ProductionOrder.${po5}.version == ${po5_v2} and GET /molding-cycles?production_order_id=${po5} returns total_count 1 after the refusal"

      # SCAFFOLD GAP (reported, not silently dropped): ERR_SIZE_CLASS_NOT_SUPPORTED
      # (422, §1.4 priority 59, applies_to POST /molding-cycles only) is
      # STRUCTURALLY UNREACHABLE. The size-class ceiling is a clause of the
      # mold_selection ELIGIBILITY FILTER (§1.3 mold_selection step 1), and the
      # server — not the client — picks the mould, so a selected mould can never
      # exceed station.max_size_class; an over-class-only pool empties the
      # candidate set and step 3 answers with ERR_NO_ELIGIBLE_MOLD (409,
      # priority 70) instead. This instance therefore asserts the maximal
      # reachable near-miss plus the registration-time size-class code, which IS
      # reachable. No excluded_because: is used, because no §1.8 instance covers
      # either code.
      - name: err_size_class_family_registration_mismatch_and_the_station_ceiling_near_miss
        claim_type: violation_to_error
        grounds:
          - errors.ERR_MOLD_SIZE_CLASS_MISMATCH
          - errors.ERR_NO_ELIGIBLE_MOLD
          - errors.ERR_SIZE_CLASS_NOT_SUPPORTED
          - entities.Mold.fields.size_class
          - calculations.mold_selection
          - validations.priority_59
          - validations.priority_70
        distinguishing_aspect: |
          Size class fails in two different places with two different codes: at
          mould REGISTRATION a TANDEM tool for a MID hull model is 422
          ERR_MOLD_SIZE_CLASS_MISMATCH, while at CYCLE CREATION a station whose
          max_size_class is COMPACT does not raise 422
          ERR_SIZE_CLASS_NOT_SUPPORTED but 409 ERR_NO_ELIGIBLE_MOLD, because the
          ceiling is an eligibility clause and the empty-pool fallback owns the
          refusal — the identical request on the OVERSIZE station then succeeds.
        test_recipe:
          setup:
            - "ProductModel PM-CD-KM (size_class MID) with exactly one mould MLD-CD-1 (size_class MID, AVAILABLE, cycles_since_service 0)."
            - "OvenStation OVN-CD-1 (max_size_class OVERSIZE) and CoolingBay BAY-CD-1 (FORCED_AIR, 2 slots), both OPERATIONAL."
            - "ResinLot LOT-CD-1 qualified and AVAILABLE, Warehouse WH-CD NORMAL, ProductionOrder PO-CD-1 (ordered_qty 2) READY_TO_SCHEDULE with no cycles yet."
            - "Logical clock at 2026-08-01T00:00:00Z, so a 09:00 oven start is in the future."
          setup_api_calls:
            - *cd2_clock0
            - *cd2_pm
            - *cd2_mold
            - *cd2_ov
            - *cd2_cb
            - *cd2_top
            - *cd2_wh
            - *cd2_lot
            - *cd2_po
            - *cd2_porel
          trigger:
            - call: "POST /molds"
              payload: { mold_code: "MLD-CD-X", product_model_id: "${pm}", size_class: "TANDEM", cavity_count: 2, nominal_charge_kg: 24.000, service_interval_cycles: 10 }
              as: PlantAdmin
              as_user_id: "admin-1"
            - call: "POST /oven-stations"
              payload: { station_code: "OVN-CD-S", arm_count: 1, max_size_class: "COMPACT", changeover_buffer_min: 15, energy_cents_per_min: 100 }
              as: PlantAdmin
              as_user_id: "admin-1"
              captures: { station_s: $.data.id }
            - call: "POST /molding-cycles"
              payload: { production_order_id: "${po}", oven_station_id: "${station_s}", arm_index: 1, cooling_bay_id: "${bay}", oven_start_at: "2026-08-01T09:00:00Z", scheduled_oven_minutes: 60, scheduled_cooling_minutes: 30, oven_temp_c: 288.0, arm_rpm_major: 8.00, arm_rpm_minor: 2.00, cooling_mode: "FORCED_AIR", expected_production_order_version: "${po_v}" }
              as: MoldingOperator
              as_user_id: "${t_op}"
            - call: "POST /molding-cycles"
              payload: { production_order_id: "${po}", oven_station_id: "${station}", arm_index: 1, cooling_bay_id: "${bay}", oven_start_at: "2026-08-01T09:00:00Z", scheduled_oven_minutes: 60, scheduled_cooling_minutes: 30, oven_temp_c: 288.0, arm_rpm_major: 8.00, arm_rpm_minor: 2.00, cooling_mode: "FORCED_AIR", expected_production_order_version: "${po_v}" }
              as: MoldingOperator
              as_user_id: "${t_op}"
          assert:
            - "the MLD-CD-X registration returns status 422 with data.error_id 'ERR_MOLD_SIZE_CLASS_MISMATCH' because TANDEM differs from ProductModel.${pm}.size_class MID"
            - "GET /molds?product_model_id=${pm} returns total_count 1 after that refusal — no mould row was created"
            - "the OVN-CD-S registration returns status 201 with max_size_class 'COMPACT'"
            - "the cycle create on OVN-CD-S returns status 409 with data.error_id 'ERR_NO_ELIGIBLE_MOLD', NOT 422 'ERR_SIZE_CLASS_NOT_SUPPORTED' and NOT 'ERR_MOLD_WINDOW_CONFLICT': SIZE_CLASS_ORDER[MID]=2 exceeds SIZE_CLASS_ORDER[COMPACT]=1 so MLD-CD-1 leaves the candidate set on capability, not on occupancy"
            - "ProductionOrder.${po}.version == ${po_v} and ProductionOrder.${po}.status == 'READY_TO_SCHEDULE' after that refusal"
            - "the identical cycle create on OVN-CD-1 returns status 201 with mold_id equal to MLD-CD-1's id, proving the station ceiling was the only difference"

      # ---- errors already asserted by §1.8 (difficulty design) ----
      - name: err_regrind_limit_exceeded_at_the_30_00_pct_ceiling
        claim_type: violation_to_error
        grounds:
          - errors.ERR_REGRIND_LIMIT_EXCEEDED
          - validations.priority_50
        excluded_because:
          difficulty_instance: "boundary_precision_check / regrind_ceiling_exact_30_00_pct_accepted_vs_30_01_rejected"
          rationale: "That instance already drives POST /resin-charges to exactly 30.00 pct blended regrind (accepted) and to 30.01 pct (409 ERR_REGRIND_LIMIT_EXCEEDED) on the same lot and model, so the condition-to-code mapping and its inclusive boundary are both already asserted."

      - name: err_resin_insufficient_when_the_regrind_ceiling_also_fails
        claim_type: violation_to_error
        grounds:
          - errors.ERR_RESIN_INSUFFICIENT
          - errors.ERR_REGRIND_LIMIT_EXCEEDED
          - validations.priority_72
        excluded_because:
          difficulty_instance: "priority_pair_validation_conflict / pair2_regrind_limit_beats_resin_insufficient"
          rationale: "That instance stages a charge that violates the regrind ceiling AND leaves the lot short, asserts the regrind code wins, and then clears the regrind violation to show the same request falling through to ERR_RESIN_INSUFFICIENT — both codes are already bound to their conditions there."

      - name: err_order_not_schedulable_precedence_over_the_oven_window
        claim_type: violation_to_error
        grounds:
          - errors.ERR_ORDER_NOT_SCHEDULABLE
          - errors.ERR_OVEN_WINDOW_CONFLICT
          - validations.priority_34
        excluded_because:
          difficulty_instance: "priority_pair_validation_conflict / pair1_order_not_schedulable_beats_oven_window_conflict"
          rationale: "That instance already builds a request that trips both PAIR-1 members at once and asserts 409 ERR_ORDER_NOT_SCHEDULABLE, then repairs the order state to show the same request yielding ERR_OVEN_WINDOW_CONFLICT."

      - name: err_warranty_term_expired_on_a_pro_rata_age_claim
        claim_type: violation_to_error
        grounds:
          - errors.ERR_WARRANTY_TERM_EXPIRED
          - errors.ERR_STORAGE_REVIEW_INCOMPLETE
        excluded_because:
          difficulty_instance: "priority_pair_validation_conflict / pair5_storage_review_incomplete_beats_warranty_term_expired"
          rationale: "That instance approves a claim whose months_in_service is past the model's warranty term while the storage-review axis is still open, asserts ERR_STORAGE_REVIEW_INCOMPLETE, then verifies the review to expose ERR_WARRANTY_TERM_EXPIRED — the expiry condition is already tied to its code."

      - name: err_insufficient_measurements_below_the_six_point_floor
        claim_type: violation_to_error
        grounds:
          - errors.ERR_INSUFFICIENT_MEASUREMENTS
          - validations.priority_25
        excluded_because:
          difficulty_instance: "boundary_precision_check / inspection_measurement_count_six_accepted_vs_five_rejected"
          rationale: "That instance posts an inspection with exactly six wall_thickness_points (accepted) and with five (422 ERR_INSUFFICIENT_MEASUREMENTS) on the same hull, so the count floor and its code are already asserted."

      - name: err_warehouse_frozen_refuses_the_store_action
        claim_type: violation_to_error
        grounds:
          - errors.ERR_WAREHOUSE_FROZEN
          - validations.priority_40
        excluded_because:
          difficulty_instance: "cross_entity_state_dependency / finished_unit_store_gated_by_warehouse_frozen_posture"
          rationale: "That instance stores hulls until the site posture recomputes to FROZEN, asserts the next store returns 409 ERR_WAREHOUSE_FROZEN (and explicitly not ERR_WAREHOUSE_CUBE_EXCEEDED), and then releases storage to show the same store succeeding."

      - name: err_oven_window_conflict_on_the_same_station_arm
        claim_type: violation_to_error
        grounds:
          - errors.ERR_OVEN_WINDOW_CONFLICT
          - validations.priority_62
        excluded_because:
          difficulty_instance: "resource_temporal_overlap / oven_arm_half_open_span_with_symmetric_changeover_buffer"
          rationale: "That instance already drives the half-open arm span with the symmetric changeover buffer to 409 ERR_OVEN_WINDOW_CONFLICT one second inside the buffer and to acceptance exactly at its edge."

      - name: err_cooling_bay_capacity_exceeded_on_the_aggregate_slot_count
        claim_type: violation_to_error
        grounds:
          - errors.ERR_COOLING_BAY_CAPACITY_EXCEEDED
          - validations.priority_71
        excluded_because:
          difficulty_instance: "resource_temporal_overlap / cooling_bay_closed_interval_aggregate_slot_capacity"
          rationale: "That instance fills a bay to its concurrent_slot_capacity over the CLOSED cooling interval and asserts the next overlapping cycle returns 409 ERR_COOLING_BAY_CAPACITY_EXCEEDED, including the touching-endpoint case that still counts."

      - name: err_mold_window_conflict_distinguished_from_the_empty_pool
        claim_type: violation_to_error
        grounds:
          - errors.ERR_MOLD_WINDOW_CONFLICT
          - calculations.mold_selection
        excluded_because:
          difficulty_instance: "resource_temporal_overlap / mold_half_open_oven_plus_cooling_span_occupancy_vs_capability"
          rationale: "That instance occupies the only eligible tool across the half-open oven-plus-cooling span and asserts ERR_MOLD_WINDOW_CONFLICT for the occupancy failure against ERR_NO_ELIGIBLE_MOLD for the capability failure, which is exactly this corner."

      - name: err_warranty_reserve_exhausted_at_the_model_reserve_floor
        claim_type: violation_to_error
        grounds:
          - errors.ERR_WARRANTY_RESERVE_EXHAUSTED
        excluded_because:
          difficulty_instance: "compensating_invariant / warranty_reserve_ledger_conserved_across_approve_and_void"
          rationale: "That instance approves payouts until the next net payout would exceed ProductModel.warranty_reserve_cents, asserts 409 ERR_WARRANTY_RESERVE_EXHAUSTED, and then voids a claim to show the refused approval succeeding once the reserve is restored."

  # ===========================================================================
  # SECTION: rbac
  # Claim rows from claim-extraction-guide.md "From Table 7 (RBAC)". This
  # scaffold's role_model is segregation_of_duties, so only that role-model row
  # applies. Header conventions used below, mirroring §1.8:
  #   * `as:` is the X-Role header value and `as_user_id:` the X-User-ID header.
  #   * `as: null` means the X-Role header is ABSENT; `as_user_id: ""` means the
  #     X-User-ID header is present but blank.
  #   * Opaque roles use the fixed audit ids admin-1 / planner-1 / agent-1.
  #   * Denials live ONLY in `trigger:` — every `setup_api_calls` entry uses a
  #     role §1.5 permits for that endpoint.
  # ===========================================================================
  - section: rbac
    instances:
      - name: rbac_shop_floor_and_planner_roles_denied_on_each_others_exclusive_actions
        claim_type: "Cannot perform other roles' exclusive_operations"
        grounds:
          - roles.ResinTechnician.exclusive_operations
          - roles.MoldingOperator.exclusive_operations
          - roles.AssemblyTechnician.exclusive_operations
          - roles.QualityInspector.exclusive_operations
          - roles.LogisticsPlanner.exclusive_operations
          - roles.PlantAdmin.exclusive_operations
          - errors.ERR_ROLE_NOT_PERMITTED
          - validations.priority_3
        distinguishing_aspect: |
          Every one of the eight refusals is 403 ERR_ROLE_NOT_PERMITTED on an
          endpoint the caller's own role list omits — including PlantAdmin on
          POST /shipments and LogisticsPlanner on POST /molds, which proves
          neither role is a superuser — and the mould-retire denial on a
          nonexistent mould id still answers 403, not 404, because priority 3
          precedes priority 10.
        test_recipe:
          setup:
            - "Base plant of the discovery instance: PM-CD-KM, MLD-CD-1, OVN-CD-1, BAY-CD-1, four distinct ACTIVE Technicians, WH-CD, LOT-CD-1, PO-CD-1 run to two SELLABLE hulls both STORED in Z-A."
