      - name: shared_operations_admin_and_analyst_both_patch_the_landowner_the_servicing_agent_reads
        claim_type: shared_operations
        grounds:
          - rbac.roles[PlatformAdmin].shared_operations
          - rbac.roles[AcquisitionAnalyst].shared_operations
          - rbac.roles[ServicingAgent].shared_operations
          - endpoints[PATCH /lease-buyouts/landowners/{id}]
          - endpoints[GET /lease-buyouts/landowners/{id}]
        distinguishing_aspect: |
          Suppression is a shared write with an asymmetric consequence: whoever sets it stops all
          outreach. The instance proves the shared grant is symmetric in both directions - the admin
          sets DO_NOT_CONTACT and the *analyst* clears it on the same row (not merely a second admin),
          and a third role that only holds the shared read observes the final value. An implementation
          that scopes the patch to the creating role, or that treats suppression as write-once, fails
          on the second call rather than the first.
        test_recipe:
          setup:
            - "one landowner in the default ELIGIBLE outreach status"
          setup_api_calls:
            - { call: "POST /lease-buyouts/landowners", payload: { legal_name: "Hollis Farm LLC", entity_type: "LLC", contact_email: "owner@hollis.example" }, as: AcquisitionAnalyst, captures: { lo_id: $.data.id } }
          trigger:
            - { call: "PATCH /lease-buyouts/landowners/${lo_id}", payload: { suppress_outreach: true }, as: PlatformAdmin, captures: { s1: $.data.outreach_status } }
            - { call: "PATCH /lease-buyouts/landowners/${lo_id}", payload: { suppress_outreach: false, contact_email: "trustee@hollis.example" }, as: AcquisitionAnalyst, captures: { s2: $.data.outreach_status } }
            - { call: "GET /lease-buyouts/landowners/${lo_id}", payload: {}, as: ServicingAgent, captures: { s3: $.data.outreach_status, email3: $.data.contact_email } }
          assert:
            - "both PATCH calls return status 200"
            - "${s1} == DO_NOT_CONTACT"
            - "${s2} == ELIGIBLE"
            - "${s3} == ELIGIBLE"
            - "${email3} == trustee@hollis.example"
            - "the ServicingAgent read returns 200 with no write permission implied: PATCH as ServicingAgent would be 403 ERR_UNAUTHORIZED"
      - name: segregation_of_duties_the_closing_manager_may_not_be_the_valuation_approver
        claim_type: segregation_of_duties
        grounds:
          - rbac.role_model
          - validations[priority=9]
          - errors[ERR_SEGREGATION_OF_DUTIES]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / segregation_of_duties_precedes_open_dispute_close_block
          rationale: "That §1.8 instance already drives the duty split to its hardest point: the same PortfolioManager user who approved the pinned valuation attempts the close on a deal that also has an open dispute, and priority 9 must win over the later close-block check. A plain same-user close would be a strict subset of that call sequence."
      - name: peer_roles_a_landowner_cannot_accept_the_offer_addressed_to_another_landowner
        claim_type: peer_roles
        grounds:
          - rbac.roles[Landowner]
          - rbac.user_header_semantics
          - errors[ERR_NOT_DEAL_LANDOWNER]
          - validations[priority=6]
          - endpoints[POST /lease-buyouts/offers/{id}/transitions]
        distinguishing_aspect: |
          Two landowners exist and both are valid Landowner principals, so the endpoint role check at
          priority 2 passes for either; only one of them owns the lease stream the offer is written
          against. Acceptance is the irreversible commitment point - it reserves portfolio capital and
          drives the deal to DILIGENCE - so an implementation that trusts the role and ignores X-User-ID
          lets a stranger sell someone else's rent stream. The impostor must get 403
          ERR_NOT_DEAL_LANDOWNER (not ERR_UNAUTHORIZED, which would mean the role list was consulted
          instead of ownership) with the offer still SENT and the deal still at NEGOTIATION, and the real
          landowner's identical ACCEPT must then work.
        test_recipe:
          setup:
            - "a deal at NEGOTIATION with one SENT lump-sum offer to the stream's landowner"
            - "an unrelated second landowner who will attempt the acceptance"
          setup_api_calls:
            - { call: "POST /lease-buyouts/portfolios", payload: { name: "Northeast Tower Aggregation", program_code: "NE-AGG-01", total_capital_cents: 50000000 }, as: PlatformAdmin, captures: { pf_id: $.data.id } }
