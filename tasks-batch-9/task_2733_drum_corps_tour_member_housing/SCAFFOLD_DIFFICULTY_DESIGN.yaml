      - name: transport_plan_four_dimension_truck_requirement
        grounds:
          - calculations.transport_plan
          - calculations.travel_feasibility
          - entities.TourStop.fields.trucks_required
          - entities.TourStop.fields.total_load_cuft
          - entities.TourStop.fields.total_load_lbs
        distinguishing_aspect: |
          Mode (a) multi-input combination rather than a rounding order: the same
          40 trunks / 95 cases load needs 4 trucks at 25 prop units over 352 miles
          (volume ceiling 2, weight ceiling 1, max 2, +1 oversize because 25 > 24,
          +1 long haul because 352 >= 350) but only 2 trucks at 24 prop units over
          349 miles — one prop unit and three miles flip two independent surcharges.
        test_recipe:
          setup:
            - "A 2027 season with a first REHEARSAL_ONLY stop that has no predecessor."
          setup_api_calls:
            - call: "POST /seasons"
              payload: { name: "2027 Tour", year: 2027, tuition_base_cents: 399900, spring_training_start_date: "2027-05-10", spring_training_end_date: "2027-06-05", tour_departure_date: "2027-06-12" }
              as: CorpsDirector
              captures: { season_id: "$.data.id" }
