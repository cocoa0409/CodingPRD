              captures: { cancelled: $.data.status }
          assert:
            - "CourierRun.${r1}.cutoff_utc == 2026-09-01T15:45:00Z, i.e. 15 minutes before dispatch"
            - "${err_dup_run} == ERR_SLOT_ALREADY_TAKEN"
            - "${cancelled} == CANCELLED, so the instant is now free"
            - "GET /psc/courier-runs?service_center_id=${c1}&status=PLANNED returns exactly 0 rows"

