  - rule_id: transitive_cascade
    instances:
      - name: discharge_releases_bed_then_promotes_waitlist_then_creates_notification
        grounds:
          - state_machines.Admission.ACTIVE_to_DISCHARGED
          - state_machines.Admission.WAITLISTED_to_ACTIVE
          - calculations.program_posture
          - calculations.admission_priority_score
          - entities.ShelterProgram.fields.occupied_beds
          - entities.ShelterProgram.fields.waitlisted_count
          - entities.GuardianNotification.fields.due_at
          - calculations.youth_risk_posture
        distinguishing_aspect: |
          Depth-5 chain fired by the DISCHARGE transition, and every hop is strictly caused by the
          previous one: (1) the discharge freezes final_billable_nights 4 and terminates the
          admission, which (2) drops program.occupied_beds from 1 to 0, which (3) recomputes
          program.posture from FROZEN back to OPEN, which (4) is the only reason the waitlist
          selector can promote a row at all - it picks Bo at priority_score 41 over Cy at 39 - and
          that promotion (5) mints Bo's PENDING GuardianNotification with due_at = promotion instant
          + 24h and flips Bo's risk_posture to RESTRICTED. Remove hop 3 and hops 4 and 5 never
          happen.
        test_recipe:
          setup:
            - "one EMERGENCY_SHELTER program 'Riverside Emergency Shelter' with licensed_bed_capacity 1, band 12..17, max_stay_nights 21, so a single occupant makes posture FROZEN"
