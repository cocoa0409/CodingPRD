      - name: portfolio_mean_at_advance_threshold_versus_one_cent_below
        grounds:
          - calculations.portfolio_composite
          - validations[priority=18]
          - errors[ERR_PORTFOLIO_THRESHOLD_NOT_MET]
          - entities.TeachingArtist.fields.portfolio_mean_composite
        distinguishing_aspect: |
          Metric: the 2-decimal portfolio mean against PORTFOLIO_ADVANCE_THRESHOLD
          3.50 at POST /teaching-artists/{id}/vetting. Artist Nia's reviews score
          3.40 and 3.60 for a mean of exactly 3.50 and MUST advance (the
          comparison is inclusive on the ROUNDED mean); artist Owen's reviews
          score 3.40 and 3.58 (from 3.575 rounded half-up) for a mean of 3.49 and
          MUST be refused. One hundredth of a rubric point separates the two.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; no school or residency is needed."
            - "Artist Nia Cole in vetting_status PORTFOLIO_REVIEW with two panel reviews composing to 3.40 and 3.60 (mean exactly 3.50)."
            - "Artist Owen Frye in vetting_status PORTFOLIO_REVIEW with two panel reviews composing to 3.40 and 3.58 (mean 3.49)."
            - "Both artists have PORTFOLIO_MIN_REVIEWS = 2 distinct reviewers, so only the threshold distinguishes them."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramDirector
            - call: "POST /teaching-artists"
              payload: { full_name: "Nia Cole", email: "nia.cole@arts.org", primary_discipline: "VISUAL_ARTS", secondary_disciplines: [], grade_bands: ["G3_5"], languages: ["en"], roster_tier_assigned: "APPRENTICE" }
