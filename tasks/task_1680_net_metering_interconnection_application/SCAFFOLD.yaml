    roles: [ProgramAdministrator]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string }
    side_effects: ["Logical clock advanced; no automatic sweep (sweep is explicit)"]
  - method: GET
    path: "/_clock"
    description: "Read the logical clock"
    roles: [Applicant, InterconnectionCoordinator, DistributionEngineer, MeterTechnician, Inspector, ProgramAdministrator]
    code: 200
    input: []
    output: { current_utc: string }
    side_effects: []

  # --- Programs ---
