  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: substantiate_state_beats_temporal
        grounds:
          - validations[priority=5]
          - validations[priority=8]
          - errors[ERR_COMPLAINT_NOT_UNDER_REVIEW]
          - errors[ERR_VARIANCE_COVERS_COMPLAINT]
        distinguishing_aspect: "Category pair {state(5), business_temporal(8)}: complaint is RECEIVED (not reviewed) AND an ISSUED variance covers it — priority-5 state wins, returning ERR_COMPLAINT_NOT_UNDER_REVIEW (not ERR_VARIANCE_COVERS_COMPLAINT)."
        test_recipe:
          setup:
            - "COMMERCIAL property with an ISSUED variance covering 2026-06-05T12:00 at 90 dB; a complaint for that instant exists but is left in RECEIVED (never reviewed)."
          setup_api_calls:
            - { call: "POST /noise-policies", payload: { zoning_type: "COMMERCIAL", day_limit_db: 65, night_limit_db: 55, day_start_hour: 7, night_start_hour: 22 }, as: SystemAdmin }
            - { call: "POST /properties", payload: { address: "9 Fest Sq", zoning_type: "COMMERCIAL" }, as: CodeOfficer, captures: { prop_id: "$.data.id" } }
            - { call: "POST /variance-permits", payload: { property_id: "${prop_id}", permit_type: "EVENT", requested_start: "2026-06-05T08:00:00Z", requested_end: "2026-06-05T23:00:00Z", permitted_max_db: 92, expected_attendees: 100 }, as: PermitClerk, captures: { var_id: "$.data.id" } }
            - { call: "POST /variance-permits/${var_id}/issue", payload: {}, as: PermitClerk }
            - { call: "POST /complaints", payload: { property_id: "${prop_id}", reported_at: "2026-06-05T12:00:00Z", noise_type: "AMPLIFIED_MUSIC", reported_decibel: 90 }, as: CodeOfficer, captures: { c1: "$.data.id" } }
          trigger:
            - { call: "POST /complaints/${c1}/substantiate", payload: {}, as: CodeOfficer, as_user_id: "officer-1", captures: { err: "$.data.error_id" } }
          assert:
            - "response HTTP status == 409"
            - "data.error_id == ERR_COMPLAINT_NOT_UNDER_REVIEW"

      - name: decide_safety_beats_constraint
        grounds:
          - validations[priority=9]
          - validations[priority=10]
          - errors[ERR_SEGREGATION_OF_DUTIES]
          - errors[ERR_REDUCTION_PCT_INVALID]
        distinguishing_aspect: "Category pair {business_safety(9), business_constraint(10)}: decider == issuer AND reduction_pct == 1.5 (out of range) — priority-9 SoD wins, returning ERR_SEGREGATION_OF_DUTIES (not ERR_REDUCTION_PCT_INVALID)."
        test_recipe:
          setup:
            - "COMMERCIAL level-1 CITATION issued by officer-1, contested, hearing scheduled; the decide is attempted by the same officer-1 with an invalid reduction_pct."
          setup_api_calls:
            - { call: "POST /noise-policies", payload: { zoning_type: "COMMERCIAL", day_limit_db: 65, night_limit_db: 55, day_start_hour: 7, night_start_hour: 22 }, as: SystemAdmin }
            - { call: "POST /properties", payload: { address: "10 Din Rd", zoning_type: "COMMERCIAL" }, as: CodeOfficer, captures: { prop_id: "$.data.id" } }
            - { call: "POST /complaints", payload: { property_id: "${prop_id}", reported_at: "2026-05-10T12:00:00Z", noise_type: "AMPLIFIED_MUSIC" }, as: CodeOfficer, captures: { c1: "$.data.id" } }
            - { call: "POST /complaints/${c1}/review", payload: {}, as: CodeOfficer }
            - { call: "POST /complaints/${c1}/inspections", payload: { measured_decibel: 80, measured_at: "2026-05-10T12:00:00Z" }, as: CodeOfficer }
            - { call: "POST /complaints/${c1}/substantiate", payload: {}, as: CodeOfficer, as_user_id: "officer-1" }
            - { call: "POST /complaints", payload: { property_id: "${prop_id}", reported_at: "2026-05-11T12:00:00Z", noise_type: "AMPLIFIED_MUSIC" }, as: CodeOfficer, captures: { c2: "$.data.id" } }
            - { call: "POST /complaints/${c2}/review", payload: {}, as: CodeOfficer }
            - { call: "POST /complaints/${c2}/inspections", payload: { measured_decibel: 80, measured_at: "2026-05-11T12:00:00Z" }, as: CodeOfficer }
            - { call: "POST /complaints/${c2}/substantiate", payload: {}, as: CodeOfficer, as_user_id: "officer-1", captures: { enf_id: "$.data.id" } }
            - { call: "POST /enforcements/${enf_id}/contest", payload: {}, as: Resident }
            - { call: "POST /enforcements/${enf_id}/hearings", payload: { scheduled_at: "2026-05-20T10:00:00Z", hearing_officer_id: "hof-9" }, as: HearingOfficer, captures: { hear_id: "$.data.id" } }
          trigger:
            - { call: "POST /hearings/${hear_id}/decide", payload: { outcome: "REDUCED", reduction_pct: 1.5 }, as: HearingOfficer, as_user_id: "officer-1", captures: { err: "$.data.error_id" } }
          assert:
            - "response HTTP status == 403"
            - "data.error_id == ERR_SEGREGATION_OF_DUTIES"

  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: decibel_strict_exceeds_boundary
        grounds:
          - calculations.inspection_exceeds_limit
          - entities.Inspection.fields.exceeds_limit
          - entities.Inspection.fields.effective_limit_db
        distinguishing_aspect: "Metric = decibel on POST /complaints/{id}/inspections: measured 65 == day limit 65 -> exceeds_limit false (equality is NOT a violation); measured 66 -> exceeds_limit true (strict >)."
        test_recipe:
          setup:
            - "COMMERCIAL policy (day limit 65) + property + a reviewed complaint; two readings recorded at the day-window instant, one at the limit and one a decibel above."
          setup_api_calls:
            - { call: "POST /noise-policies", payload: { zoning_type: "COMMERCIAL", day_limit_db: 65, night_limit_db: 55, day_start_hour: 7, night_start_hour: 22 }, as: SystemAdmin }
            - { call: "POST /properties", payload: { address: "11 Edge Ave", zoning_type: "COMMERCIAL" }, as: CodeOfficer, captures: { prop_id: "$.data.id" } }
            - { call: "POST /complaints", payload: { property_id: "${prop_id}", reported_at: "2026-06-01T12:00:00Z", noise_type: "MACHINERY" }, as: CodeOfficer, captures: { c1: "$.data.id" } }
            - { call: "POST /complaints/${c1}/review", payload: {}, as: CodeOfficer }
          trigger:
            - { call: "POST /complaints/${c1}/inspections", payload: { measured_decibel: 65, measured_at: "2026-06-01T12:00:00Z" }, as: CodeOfficer, captures: { insp_at_limit: "$.data.exceeds_limit", limit_val: "$.data.effective_limit_db" } }
            - { call: "POST /complaints/${c1}/inspections", payload: { measured_decibel: 66, measured_at: "2026-06-01T12:00:00Z" }, as: CodeOfficer, captures: { insp_above: "$.data.exceeds_limit" } }
          assert:
            - "Inspection(measured 65).effective_limit_db == 65"
            - "Inspection(measured 65).exceeds_limit == false"
            - "Inspection(measured 66).exceeds_limit == true"

      - name: chronic_designated_count_boundary
        grounds:
          - calculations.property_chronic_status
          - entities.Property.fields.substantiated_violation_count
          - entities.Property.fields.chronic_status
        distinguishing_aspect: "Metric = violation count on POST /complaints/{id}/substantiate: at count 2 chronic_status is WATCH (< CHRONIC_DESIGNATED_THRESHOLD 3), so no AbatementOrder is created — the designation boundary is >= 3, not reached at 2."
        test_recipe:
          setup:
            - "RESIDENTIAL property with one prior substantiation; a second complaint reviewed and inspected over the limit."
          setup_api_calls:
            - { call: "POST /noise-policies", payload: { zoning_type: "RESIDENTIAL", day_limit_db: 55, night_limit_db: 45, day_start_hour: 7, night_start_hour: 22 }, as: SystemAdmin }
            - { call: "POST /properties", payload: { address: "12 Two Ct", zoning_type: "RESIDENTIAL" }, as: CodeOfficer, captures: { prop_id: "$.data.id" } }
            - { call: "POST /complaints", payload: { property_id: "${prop_id}", reported_at: "2026-05-10T12:00:00Z", noise_type: "ANIMAL" }, as: CodeOfficer, captures: { c1: "$.data.id" } }
            - { call: "POST /complaints/${c1}/review", payload: {}, as: CodeOfficer }
            - { call: "POST /complaints/${c1}/inspections", payload: { measured_decibel: 70, measured_at: "2026-05-10T12:00:00Z" }, as: CodeOfficer }
            - { call: "POST /complaints/${c1}/substantiate", payload: {}, as: CodeOfficer, as_user_id: "officer-1" }
            - { call: "POST /complaints", payload: { property_id: "${prop_id}", reported_at: "2026-05-11T12:00:00Z", noise_type: "ANIMAL" }, as: CodeOfficer, captures: { c2: "$.data.id" } }
            - { call: "POST /complaints/${c2}/review", payload: {}, as: CodeOfficer }
            - { call: "POST /complaints/${c2}/inspections", payload: { measured_decibel: 70, measured_at: "2026-05-11T12:00:00Z" }, as: CodeOfficer }
          trigger:
            - { call: "POST /complaints/${c2}/substantiate", payload: {}, as: CodeOfficer, as_user_id: "officer-1" }
          assert:
            - "Property.${prop_id}.substantiated_violation_count == 2"
            - "Property.${prop_id}.chronic_status == WATCH"
            - "Property.${prop_id}.abatement_status == NONE"
            - "GET /abatement-orders?property_id=${prop_id} returns 0 orders"

  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: substantiate_blocked_by_issued_variance
        grounds:
          - state_machines.Complaint.UNDER_REVIEW_to_SUBSTANTIATED
