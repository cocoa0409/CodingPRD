  # =====================================================================
  # Section: calculations
  # =====================================================================
  - section: calculations
    instances:
      - name: provisional_fee_constants_applied_for_standard_order
        claim_type: constants_applied
        grounds:
          - calculations.order_fee_provisional
        distinguishing_aspect: "The provisional estimate uses exactly BASE_FEE_CENTS=40000, ESTIMATED_DOCUMENT_COUNT=8, PER_DOCUMENT_FEE_CENTS=2500: 40000 + 8*2500 = 60000 for STANDARD."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "POST /api/abstract-orders"
              payload: { client_ref: "client_821", property_address: "30 Fir St", county: "Travis", state_code: "TX", legal_description_text: "LOT 1 BLK C", search_period_years: 30, effective_date: "2026-01-15", sla_tier: "STANDARD" }
              as: Client
              as_user_id: client_821
              captures: { prov: $.data.provisional_fee_cents, acc: $.data.accrued_fees_cents }
          assert:
            - "captured prov == 60000"
            - "captured acc == 40000 (no retrieval allowance in the actuals variant)"

      - name: document_scope_effective_date_upper_bound
        claim_type: input_set_filtering
        grounds:
          - calculations.document_scope
        distinguishing_aspect: "The scope window's UPPER bound is inclusive too: recording_date == effective_date is in scope, one day after is out — complementing the lower-bound difficulty instance."
        test_recipe:
          setup: ["order (effective_date 2026-01-15) with one IN_PROGRESS assignment"]
          setup_api_calls:
            - call: "POST /api/abstract-orders"
              payload: { client_ref: "client_822", property_address: "31 Fir St", county: "Travis", state_code: "TX", legal_description_text: "LOT 2 BLK C", search_period_years: 30, effective_date: "2026-01-15" }
              as: Client
              as_user_id: client_822
              captures: { ord: $.data.id }
            - call: "POST /api/search-assignments"
              payload: { order_id: "${ord}", abstracter_ref: "abs_822", search_type: "CHAIN_OF_TITLE", window_start: "2026-08-01T09:00:00Z", window_end: "2026-08-01T17:00:00Z" }
              as: OperationsManager
              captures: { asg: $.data.id }
          trigger:
            - call: "POST /api/record-documents"
              payload: { order_id: "${ord}", assignment_id: "${asg}", instrument_type: "DEED", grantor_name: "A", grantee_name: "B", instrument_number: "INST-822-A", recording_date: "2026-01-15" }
              as: Abstracter
              as_user_id: abs_822
              captures: { at_eff: $.data.in_scope }
            - call: "POST /api/record-documents"
              payload: { order_id: "${ord}", assignment_id: "${asg}", instrument_type: "DEED", grantor_name: "A", grantee_name: "B", instrument_number: "INST-822-B", recording_date: "2026-01-16" }
              as: Abstracter
              as_user_id: abs_822
              captures: { past_eff: $.data.in_scope }
          assert:
            - "captured at_eff == true (recording exactly on effective_date is in scope)"
            - "captured past_eff == false (one day after effective_date is out of scope)"

      - name: chain_break_not_computed_for_non_deed_subject
        claim_type: conditional_validation
        grounds:
          - calculations.chain_break_detection
        distinguishing_aspect: "chain_break_flag is only computed when the SUBJECT instrument is a DEED; a MORTGAGE linked to a prior deed carries false even with mismatched names."
        test_recipe:
          setup: ["order with assignment and one DEED recorded"]
          setup_api_calls:
            - call: "POST /api/abstract-orders"
              payload: { client_ref: "client_823", property_address: "32 Fir St", county: "Travis", state_code: "TX", legal_description_text: "LOT 3 BLK C", search_period_years: 30, effective_date: "2026-01-15" }
              as: Client
              as_user_id: client_823
              captures: { ord: $.data.id }
            - call: "POST /api/search-assignments"
              payload: { order_id: "${ord}", abstracter_ref: "abs_823", search_type: "CHAIN_OF_TITLE", window_start: "2026-08-01T09:00:00Z", window_end: "2026-08-01T17:00:00Z" }
              as: OperationsManager
              captures: { asg: $.data.id }
            - call: "POST /api/record-documents"
              payload: { order_id: "${ord}", assignment_id: "${asg}", instrument_type: "DEED", grantor_name: "A", grantee_name: "B Jones", instrument_number: "INST-823-A", recording_date: "2001-01-01" }
              as: Abstracter
              as_user_id: abs_823
              captures: { d1: $.data.id }
          trigger:
            - call: "POST /api/record-documents"
              payload: { order_id: "${ord}", assignment_id: "${asg}", instrument_type: "MORTGAGE", grantor_name: "Totally Different", grantee_name: "Bank", instrument_number: "INST-823-B", recording_date: "2002-01-01", prior_document_id: "${d1}" }
              as: Abstracter
              as_user_id: abs_823
              captures: { brk: $.data.chain_break_flag }
          assert:
            - "captured brk == false (chain continuity is only evaluated for DEED subjects)"

      - name: retrieval_fee_variant_selection_at_post_fee
        claim_type: variant_selection
        grounds:
          - calculations.retrieval_fee
        distinguishing_aspect: "Covered by the difficulty instance comparing both variants."
        excluded_because:
          difficulty_instance: retrieval_fee_per_page_vs_per_document
          rationale: "Variant selection (fee_mode at post-fee) and divergence are both asserted there."

      - name: late_credit_exact_result
        claim_type: correct_result
        grounds:
          - calculations.sla_due_and_late_credit
        distinguishing_aspect: "Covered by the SLA boundary difficulty instance."
        excluded_because:
          difficulty_instance: sla_delivery_exactly_at_due_at_vs_one_second_late
          rationale: "The 5000-cent late credit and the zero-credit boundary case are asserted there."

      - name: accrued_excludes_reversed_and_requested_retrievals
        claim_type: input_set_filtering
        grounds:
