      - name: activate_command_center_before_lead_window_rejected
        claim_type: temporal_validation
        grounds:
          - validations[priority=31]
          - errors[ERR_COMMAND_CENTER_WINDOW_NOT_OPEN]
          - calculations.survey_window_prediction.constants.COMMAND_CENTER_LEAD_DAYS
        distinguishing_aspect: "At clock 2026-08-01, one day before command_center_activation_allowed_from 2026-08-16, ACTIVATE_COMMAND_CENTER returns ERR_COMMAND_CENTER_WINDOW_NOT_OPEN; the same call at 2026-08-16 succeeds because equality is inside the window."
        test_recipe:
          setup:
            - "Survey CYCLE-2026 from prior_survey_end_date 2025-03-15 -> predicted_open_date 2026-09-15 and command_center_activation_allowed_from 2026-08-16."
            - "Clock at the default 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /accreditation/survey-windows"
              payload: { cycle_label: "CYCLE-2026", prior_survey_end_date: "2025-03-15T00:00:00Z" }
              as: AccreditationDirector
              captures: { v10_sw: $.data.id, v10_open: $.data.predicted_open_date, v10_cc_from: $.data.command_center_activation_allowed_from }
          trigger:
            - call: "POST /accreditation/survey-windows/${v10_sw}/transition"
              payload: { action: "ACTIVATE_COMMAND_CENTER" }
              as: AccreditationDirector
              captures: { v10_err: $.data.error_id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-16T00:00:00Z" }
              as: AccreditationDirector
              captures: { v10_eligible: $.data.eligible_window_count }
            - call: "POST /accreditation/survey-windows/${v10_sw}/transition"
              payload: { action: "ACTIVATE_COMMAND_CENTER" }
              as: AccreditationDirector
              captures: { v10_cc: $.data.command_center_state, v10_ws: $.data.window_state }
          assert:
            - "${v10_open} == 2026-09-15T00:00:00.000Z and ${v10_cc_from} == 2026-08-16T00:00:00.000Z"
            - "${v10_err} == ERR_COMMAND_CENTER_WINDOW_NOT_OPEN with HTTP 409"
            - "${v10_eligible} == 0 (2026-08-16 is still before predicted_open_date)"
            - "${v10_cc} == ACTIVATED and ${v10_ws} == PROJECTED, confirming the dimensions are independent and equality passes the lead check"

      - name: open_survey_on_projected_window_returns_not_eligible
        claim_type: violation_error
