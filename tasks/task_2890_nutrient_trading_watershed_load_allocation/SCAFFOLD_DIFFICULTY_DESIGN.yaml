              payload: { watershed_id: "${w_id}", reach_code: "R_OUT", trading_zone_code: "Z2", reach_class: "COMPLIANCE_POINT", delivery_factor: 1.0000 }
              as: TmdlAnalyst
              captures: { r_out_id: $.data.id }
            - call: "POST /reaches"
              payload: { watershed_id: "${w_id}", reach_code: "R_MID", trading_zone_code: "Z2", reach_class: "MAINSTEM", delivery_factor: 0.9000, downstream_reach_id: "${r_out_id}" }
              as: TmdlAnalyst
              captures: { r_mid_id: $.data.id }
            - call: "POST /reaches"
              payload: { watershed_id: "${w_id}", reach_code: "R_UP", trading_zone_code: "Z1", reach_class: "HEADWATER", delivery_factor: 0.8000, downstream_reach_id: "${r_mid_id}" }
              as: TmdlAnalyst
              captures: { r_up_id: $.data.id }
            - call: "POST /tmdl-assessments"
              payload: { watershed_id: "${w_id}", assessment_code: "TMDL-P-2026", loading_capacity_lbs_yr: 60000.00, margin_of_safety_pct: 0.1000, background_load_lbs_yr: 6000.00, period_start_date: "2026-01-01", period_end_date: "2035-12-31" }
              as: TmdlAnalyst
              captures: { t_id: $.data.id, t_ver1: $.data.version }
            - call: "POST /source-assessments"
              payload: { tmdl_assessment_id: "${t_id}", reach_id: "${r_mid_id}", source_name: "City WWTP", source_type: "POINT", existing_load_lbs_yr: 20000.00, controllability_index: 0.8000, status: "INVENTORIED" }
              as: TmdlAnalyst
            - call: "POST /source-assessments"
              payload: { tmdl_assessment_id: "${t_id}", reach_id: "${r_up_id}", source_name: "Upper Cropland", source_type: "NONPOINT", existing_load_lbs_yr: 30000.00, controllability_index: 0.4000, status: "INVENTORIED" }
