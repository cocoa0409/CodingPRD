      - name: extension_info_requested_cycle_caps_resubmit_count_at_two
        grounds:
          - state_machines.ExtensionRequest.UNDER_REVIEW_to_INFO_REQUESTED
          - state_machines.ExtensionRequest.INFO_REQUESTED_to_UNDER_REVIEW
          - entities.ExtensionRequest.fields.resubmit_count
          - validations[priority=8]
          - errors[ERR_EXTENSION_RESUBMIT_LIMIT]
        distinguishing_aspect: |
          UNDER_REVIEW and INFO_REQUESTED form a loop that the same entity traverses twice, and the loop
          has a termination condition rather than an unbounded revert: resubmit_count reaches 2 and the
          third resubmit is rejected with ERR_EXTENSION_RESUBMIT_LIMIT while the request stays in
          INFO_REQUESTED — a different state machine and a different loop bound than the case-level cycle.
        test_recipe:
          setup:
