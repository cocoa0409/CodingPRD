# =============================================================================
# Task 1228 — §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Nine §0.5 rules x >=2 instances; every recipe replays empty-DB -> precondition
# using only SCAFFOLD.yaml §1.5 endpoints.
#
# Shared literals (canonical policy P1 used across instances):
#   weights 50/30/20; tiers MEDIUM>=40 HIGH>=70 CRITICAL>=90; caps base 15 / hard 25
#   industry_score: TECHNOLOGY 20, LOGISTICS 40, CONSULTING 60, CONSTRUCTION 70, GOVERNMENT_RELATIONS 90
#   touchpoint_score: NONE 0, INDIRECT 50, DIRECT 100 ; country_norm = 100 - cpi_score
# =============================================================================
scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: risk_score_provisional_vs_final_on_third_party
        grounds:
          - calculations.third_party_risk_score
          - entities.ThirdParty.fields.risk_score_provisional
          - entities.ThirdParty.fields.risk_score_final
        distinguishing_aspect: |
          Entity domain = ThirdParty risk scoring. Two valid algorithms over identical base
          inputs: provisional (base-only weighted formula) yields 73 / HIGH, while final
          (base + questionnaire modifier +10 for government_ownership_pct=25 and screening
          modifier +20 for a confirmed PEP hit, clamped at 100) yields 100 / CRITICAL.
        test_recipe:
          setup:
            - "Clock at 2026-05-01; policy P1 ACTIVE; country BR with cpi_score=30 (country_norm 70)"
            - "ThirdParty BR-CO: CONSULTING (60), DIRECT (100) -> provisional (50*70+30*60+20*100)/100 = 73"
            - "PEP check POTENTIAL_HIT -> HIT_CONFIRMED (+20); ADVERSE_MEDIA and SANCTIONS CLEAR; auto-advance to DD_REVIEW"
            - "Questionnaire accepted with government_ownership_pct=25 (+10), other answers clean"
          setup_api_calls:
            - { call: "POST /compliance/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: ComplianceAdmin }
            - { call: "POST /compliance/country-risk-profiles", payload: { country_code: "BR", cpi_score: 30 }, as: ComplianceAdmin }
            - { call: "POST /compliance/risk-scoring-policies", payload: { w_country: 50, w_industry: 30, w_touchpoint: 20, tier_medium_min: 40, tier_high_min: 70, tier_critical_min: 90, commission_base_cap_pct: 15, commission_hard_cap_pct: 25 }, as: ComplianceAdmin, captures: { pol_id: $.data.id, pol_v: $.data.version } }
            - { call: "POST /compliance/risk-scoring-policies/${pol_id}/activate", payload: { expected_policy_version: "${pol_v}" }, as: ComplianceAdmin }
            - { call: "POST /compliance/third-parties", payload: { legal_name: "BR Consulting Ltd", country_code: "BR", industry: "CONSULTING", government_touchpoint: "DIRECT" }, as: BusinessSponsor, as_user_id: "u_sp1", captures: { tp_id: $.data.id } }
            - { call: "POST /compliance/third-parties/${tp_id}/submit", payload: {}, as: BusinessSponsor, as_user_id: "u_sp1", captures: { tp_prov_score: $.data.risk_score_provisional, tp_prov_tier: $.data.risk_tier } }
            - { call: "GET /compliance/third-parties/${tp_id}/screening-checks", as: ComplianceOfficer, captures: { chk_pep: "$.data[0].id", chk_am: "$.data[1].id", chk_san: "$.data[2].id" } }
            - { call: "POST /compliance/screening-checks/${chk_pep}/disposition", payload: { outcome: "POTENTIAL_HIT", match_detail: "beneficial owner is a sitting mayor" }, as: ScreeningAnalyst }
            - { call: "POST /compliance/screening-checks/${chk_pep}/disposition", payload: { outcome: "HIT_CONFIRMED" }, as: ScreeningAnalyst }
            - { call: "POST /compliance/screening-checks/${chk_am}/disposition", payload: { outcome: "CLEAR" }, as: ScreeningAnalyst }
            - { call: "POST /compliance/screening-checks/${chk_san}/disposition", payload: { outcome: "CLEAR" }, as: ScreeningAnalyst }
            - { call: "GET /compliance/third-parties/${tp_id}", as: ComplianceOfficer, captures: { tp_v: $.data.version } }
            - { call: "POST /compliance/third-parties/${tp_id}/questionnaires", payload: { expected_third_party_version: "${tp_v}" }, as: ComplianceOfficer, captures: { q_id: $.data.id } }
            - { call: "POST /compliance/questionnaires/${q_id}/submit", payload: { government_ownership_pct: 25, has_facilitation_payments: false, uses_sub_agents: false }, as: BusinessSponsor, as_user_id: "u_sp1" }
          trigger:
            - { call: "POST /compliance/questionnaires/${q_id}/accept", as: ComplianceOfficer, payload: {} }
            - { call: "GET /compliance/third-parties/${tp_id}", as: ComplianceOfficer, captures: { tp_final: $.data.risk_score_final, tp_tier: $.data.risk_tier } }
          assert:
            - "captured tp_prov_score == 73 and tp_prov_tier == HIGH (provisional variant, base-only)"
            - "captured tp_final == 100 (73 + 10 + 20 = 103 clamped to 100) and tp_tier == CRITICAL (final variant)"
            - "ThirdParty.risk_score_provisional remains 73 after acceptance (provisional field is not overwritten by the final variant)"

      - name: commission_flat_vs_blended_benchmark_on_payment
        grounds:
          - calculations.commission_reasonableness
          - entities.PaymentRequest.fields.ratio_pct
        distinguishing_aspect: |
          Entity domain = PaymentRequest reasonableness (distinct from ThirdParty scoring).
          The naive flat benchmark (cap = 15.00 for every country) would straight-approve a
          12.00% commission, while the pinned country_blended rule (15.00 x 0.60 = 9.00 for
          country_norm >= 70) forces ERR_ENHANCED_REVIEW_REQUIRED for the identical request.
        test_recipe:
          setup:
            - "Clock 2026-05-01; policy P1 ACTIVE; country NG cpi_score=25 (country_norm 75 -> multiplier 0.60 -> effective cap 9.00)"
            - "ThirdParty NG-TECH (TECHNOLOGY/NONE) fully APPROVED: provisional = (50*75+30*20+0)/100 = 43.5 -> round_half_up 44 -> MEDIUM; required clause set {ABAC}"
            - "Contract value 1000000 cents with clause_codes [ABAC], VERIFIED certification, contract ACTIVE"
            - "PaymentRequest COMMISSION amount 120000 cents -> ratio_pct = round_half_up(120000*10000/1000000)/100 = 12.00; 9.00 < 12.00 <= 25.00 -> EVIDENCE_REQUIRED"
          setup_api_calls:
            - { call: "POST /compliance/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: ComplianceAdmin }
            - { call: "POST /compliance/country-risk-profiles", payload: { country_code: "NG", cpi_score: 25 }, as: ComplianceAdmin }
            - { call: "POST /compliance/risk-scoring-policies", payload: { w_country: 50, w_industry: 30, w_touchpoint: 20, tier_medium_min: 40, tier_high_min: 70, tier_critical_min: 90, commission_base_cap_pct: 15, commission_hard_cap_pct: 25 }, as: ComplianceAdmin, captures: { pol_id: $.data.id, pol_v: $.data.version } }
            - { call: "POST /compliance/risk-scoring-policies/${pol_id}/activate", payload: { expected_policy_version: "${pol_v}" }, as: ComplianceAdmin }
            - { call: "POST /compliance/third-parties", payload: { legal_name: "NG Tech Partners", country_code: "NG", industry: "TECHNOLOGY", government_touchpoint: "NONE" }, as: BusinessSponsor, as_user_id: "u_sp1", captures: { tp_id: $.data.id } }
            - { call: "POST /compliance/third-parties/${tp_id}/submit", payload: {}, as: BusinessSponsor, as_user_id: "u_sp1" }
            - { call: "GET /compliance/third-parties/${tp_id}/screening-checks", as: ComplianceOfficer, captures: { chk_pep: "$.data[0].id", chk_am: "$.data[1].id", chk_san: "$.data[2].id" } }
            - { call: "POST /compliance/screening-checks/${chk_pep}/disposition", payload: { outcome: "CLEAR" }, as: ScreeningAnalyst }
            - { call: "POST /compliance/screening-checks/${chk_am}/disposition", payload: { outcome: "CLEAR" }, as: ScreeningAnalyst }
            - { call: "POST /compliance/screening-checks/${chk_san}/disposition", payload: { outcome: "CLEAR" }, as: ScreeningAnalyst }
            - { call: "GET /compliance/third-parties/${tp_id}", as: ComplianceOfficer, captures: { tp_v: $.data.version } }
            - { call: "POST /compliance/third-parties/${tp_id}/questionnaires", payload: { expected_third_party_version: "${tp_v}" }, as: ComplianceOfficer, captures: { q_id: $.data.id } }
            - { call: "POST /compliance/questionnaires/${q_id}/submit", payload: { government_ownership_pct: 0, has_facilitation_payments: false, uses_sub_agents: false }, as: BusinessSponsor, as_user_id: "u_sp1" }
            - { call: "POST /compliance/questionnaires/${q_id}/accept", payload: {}, as: ComplianceOfficer }
            - { call: "POST /compliance/third-parties/${tp_id}/approve", payload: {}, as: ComplianceOfficer }
            - { call: "POST /compliance/third-parties/${tp_id}/contracts", payload: { contract_value_cents: 1000000, start_date: "2026-05-02", end_date: "2027-05-01" }, as: BusinessSponsor, as_user_id: "u_sp1", captures: { ct_id: $.data.id } }
            - { call: "POST /compliance/contracts/${ct_id}/attach-clauses", payload: { clause_codes: ["ABAC"] }, as: BusinessSponsor, as_user_id: "u_sp1" }
            - { call: "POST /compliance/third-parties/${tp_id}/certifications", payload: { cert_type: "ANNUAL_ABAC" }, as: ComplianceOfficer, captures: { cert_id: $.data.id } }
            - { call: "POST /compliance/certifications/${cert_id}/submit", payload: { document_ref: "s3://certs/ng-tech-2026.pdf" }, as: BusinessSponsor, as_user_id: "u_sp1" }
            - { call: "POST /compliance/certifications/${cert_id}/verify", payload: {}, as: ComplianceOfficer }
            - { call: "POST /compliance/contracts/${ct_id}/activate", payload: {}, as: ComplianceOfficer }
            - { call: "POST /compliance/contracts/${ct_id}/payment-requests", payload: { payment_type: "COMMISSION", amount_cents: 120000 }, as: BusinessSponsor, as_user_id: "u_sp1", captures: { pay_id: $.data.id, pay_ratio: $.data.ratio_pct } }
          trigger:
            - { call: "POST /compliance/payment-requests/${pay_id}/approve", payload: {}, as: FinanceReviewer, as_user_id: "u_fin1", captures: { err: $.data.error_id } }
          assert:
            - "captured pay_ratio == 12.0 (round_half_up(120000*10000/1000000)/100)"
            - "captured err == ERR_ENHANCED_REVIEW_REQUIRED — country_blended effective cap 9.00 (15.00 x 0.60) makes 12.00 evidence-required"
            - "under the rejected flat_benchmark reading the cap would be 15.00 and the same approve would succeed; the pinned rule forbids it"
            - "PaymentRequest.payment_status remains SUBMITTED"

  - rule_id: combinatorial_formula
    instances:
      - name: gift_rolling_total_per_entry_rounding
        grounds:
          - calculations.gift_rolling_window_total
          - entities.ThirdParty.fields.gov_gift_rolling_12m_cents
        distinguishing_aspect: |
          Mode (b) nested rounding: per-entry round_half_up(3333 x 1.005) = 3350 summed over
          two entries yields 6700; the alternative sum-then-round order would yield
          round_half_up(6666 x 1.005) = 6699. The scaffold pins round-per-entry-then-sum.
        test_recipe:
          setup:
            - "Clock 2026-05-01; policy P1 ACTIVE; country CH cpi_score=80; ThirdParty in DD_REVIEW (screenings CLEAR) — gifts are registrable from DD_REVIEW"
            - "Two government-official gift entries, each value_cents=3333, fx_rate_to_usd=1.005, event_date 2026-05-10"
          setup_api_calls:
            - { call: "POST /compliance/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: ComplianceAdmin }
            - { call: "POST /compliance/country-risk-profiles", payload: { country_code: "CH", cpi_score: 80 }, as: ComplianceAdmin }
            - { call: "POST /compliance/risk-scoring-policies", payload: { w_country: 50, w_industry: 30, w_touchpoint: 20, tier_medium_min: 40, tier_high_min: 70, tier_critical_min: 90, commission_base_cap_pct: 15, commission_hard_cap_pct: 25 }, as: ComplianceAdmin, captures: { pol_id: $.data.id, pol_v: $.data.version } }
            - { call: "POST /compliance/risk-scoring-policies/${pol_id}/activate", payload: { expected_policy_version: "${pol_v}" }, as: ComplianceAdmin }
            - { call: "POST /compliance/third-parties", payload: { legal_name: "CH Logistics SA", country_code: "CH", industry: "LOGISTICS", government_touchpoint: "INDIRECT" }, as: BusinessSponsor, as_user_id: "u_sp1", captures: { tp_id: $.data.id } }
            - { call: "POST /compliance/third-parties/${tp_id}/submit", payload: {}, as: BusinessSponsor, as_user_id: "u_sp1" }
            - { call: "GET /compliance/third-parties/${tp_id}/screening-checks", as: ComplianceOfficer, captures: { chk_pep: "$.data[0].id", chk_am: "$.data[1].id", chk_san: "$.data[2].id" } }
            - { call: "POST /compliance/screening-checks/${chk_pep}/disposition", payload: { outcome: "CLEAR" }, as: ScreeningAnalyst }
            - { call: "POST /compliance/screening-checks/${chk_am}/disposition", payload: { outcome: "CLEAR" }, as: ScreeningAnalyst }
            - { call: "POST /compliance/screening-checks/${chk_san}/disposition", payload: { outcome: "CLEAR" }, as: ScreeningAnalyst }
          trigger:
            - { call: "POST /compliance/third-parties/${tp_id}/gift-hospitality-entries", payload: { entry_type: "GIFT", recipient_is_government_official: true, value_cents: 3333, fx_rate_to_usd: 1.005, event_date: "2026-05-10" }, as: BusinessSponsor, as_user_id: "u_sp1", captures: { g1_id: $.data.id, g1_usd: $.data.value_usd_cents } }
            - { call: "POST /compliance/third-parties/${tp_id}/gift-hospitality-entries", payload: { entry_type: "HOSPITALITY", recipient_is_government_official: true, value_cents: 3333, fx_rate_to_usd: 1.005, event_date: "2026-05-10" }, as: BusinessSponsor, as_user_id: "u_sp1", captures: { g2_id: $.data.id, g2_usd: $.data.value_usd_cents } }
            - { call: "POST /compliance/gift-hospitality-entries/${g1_id}/approve", payload: {}, as: ComplianceOfficer }
            - { call: "POST /compliance/gift-hospitality-entries/${g2_id}/approve", payload: {}, as: ComplianceOfficer }
            - { call: "GET /compliance/third-parties/${tp_id}", as: ComplianceOfficer, captures: { tp_roll: $.data.gov_gift_rolling_12m_cents } }
          assert:
            - "captured g1_usd == 3350 and g2_usd == 3350 (per-entry round_half_up(3349.665))"
            - "captured tp_roll == 6700 — round-per-entry-then-sum; sum-then-round would produce 6699"

      - name: commission_ratio_bracket_evaluation_order
        grounds:
          - calculations.commission_reasonableness
          - entities.PaymentRequest.fields.ratio_pct
        distinguishing_aspect: |
          Mode (c) circular-looking dependency: the verdict bracket is keyed on the very ratio
          being tested, so evaluation order is pinned ratio -> country multiplier -> bracket.
          Three requests on one contract (ratios 9.00 / 12.00 / 26.00 against effective cap
          9.00 and hard cap 25.00) land in three different brackets.
        test_recipe:
          setup:
            - "Clock 2026-05-01; policy P1 ACTIVE; country NG cpi_score=25 (norm 75 -> multiplier 0.60 -> effective cap 9.00, hard cap 25.00)"
            - "ThirdParty APPROVED (MEDIUM), contract 1000000 cents ACTIVE with VERIFIED certification"
            - "Three SUBMITTED COMMISSION payments: 90000 (9.00), 120000 (12.00), 260000 (26.00)"
          setup_api_calls:
            - { call: "POST /compliance/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: ComplianceAdmin }
            - { call: "POST /compliance/country-risk-profiles", payload: { country_code: "NG", cpi_score: 25 }, as: ComplianceAdmin }
            - { call: "POST /compliance/risk-scoring-policies", payload: { w_country: 50, w_industry: 30, w_touchpoint: 20, tier_medium_min: 40, tier_high_min: 70, tier_critical_min: 90, commission_base_cap_pct: 15, commission_hard_cap_pct: 25 }, as: ComplianceAdmin, captures: { pol_id: $.data.id, pol_v: $.data.version } }
            - { call: "POST /compliance/risk-scoring-policies/${pol_id}/activate", payload: { expected_policy_version: "${pol_v}" }, as: ComplianceAdmin }
            - { call: "POST /compliance/third-parties", payload: { legal_name: "NG Tech Partners", country_code: "NG", industry: "TECHNOLOGY", government_touchpoint: "NONE" }, as: BusinessSponsor, as_user_id: "u_sp1", captures: { tp_id: $.data.id } }
            - { call: "POST /compliance/third-parties/${tp_id}/submit", payload: {}, as: BusinessSponsor, as_user_id: "u_sp1" }
            - { call: "GET /compliance/third-parties/${tp_id}/screening-checks", as: ComplianceOfficer, captures: { chk_pep: "$.data[0].id", chk_am: "$.data[1].id", chk_san: "$.data[2].id" } }
            - { call: "POST /compliance/screening-checks/${chk_pep}/disposition", payload: { outcome: "CLEAR" }, as: ScreeningAnalyst }
            - { call: "POST /compliance/screening-checks/${chk_am}/disposition", payload: { outcome: "CLEAR" }, as: ScreeningAnalyst }
            - { call: "POST /compliance/screening-checks/${chk_san}/disposition", payload: { outcome: "CLEAR" }, as: ScreeningAnalyst }
            - { call: "GET /compliance/third-parties/${tp_id}", as: ComplianceOfficer, captures: { tp_v: $.data.version } }
            - { call: "POST /compliance/third-parties/${tp_id}/questionnaires", payload: { expected_third_party_version: "${tp_v}" }, as: ComplianceOfficer, captures: { q_id: $.data.id } }
            - { call: "POST /compliance/questionnaires/${q_id}/submit", payload: { government_ownership_pct: 0, has_facilitation_payments: false, uses_sub_agents: false }, as: BusinessSponsor, as_user_id: "u_sp1" }
            - { call: "POST /compliance/questionnaires/${q_id}/accept", payload: {}, as: ComplianceOfficer }
            - { call: "POST /compliance/third-parties/${tp_id}/approve", payload: {}, as: ComplianceOfficer }
            - { call: "POST /compliance/third-parties/${tp_id}/contracts", payload: { contract_value_cents: 1000000, start_date: "2026-05-02", end_date: "2027-05-01" }, as: BusinessSponsor, as_user_id: "u_sp1", captures: { ct_id: $.data.id } }
            - { call: "POST /compliance/contracts/${ct_id}/attach-clauses", payload: { clause_codes: ["ABAC"] }, as: BusinessSponsor, as_user_id: "u_sp1" }
            - { call: "POST /compliance/third-parties/${tp_id}/certifications", payload: { cert_type: "ANNUAL_ABAC" }, as: ComplianceOfficer, captures: { cert_id: $.data.id } }
            - { call: "POST /compliance/certifications/${cert_id}/submit", payload: { document_ref: "s3://certs/ng.pdf" }, as: BusinessSponsor, as_user_id: "u_sp1" }
            - { call: "POST /compliance/certifications/${cert_id}/verify", payload: {}, as: ComplianceOfficer }
            - { call: "POST /compliance/contracts/${ct_id}/activate", payload: {}, as: ComplianceOfficer }
            - { call: "POST /compliance/contracts/${ct_id}/payment-requests", payload: { payment_type: "COMMISSION", amount_cents: 90000 }, as: BusinessSponsor, as_user_id: "u_sp1", captures: { pay_a: $.data.id } }
            - { call: "POST /compliance/contracts/${ct_id}/payment-requests", payload: { payment_type: "COMMISSION", amount_cents: 120000 }, as: BusinessSponsor, as_user_id: "u_sp1", captures: { pay_b: $.data.id } }
            - { call: "POST /compliance/contracts/${ct_id}/payment-requests", payload: { payment_type: "COMMISSION", amount_cents: 260000, enhanced_review_evidence: true }, as: BusinessSponsor, as_user_id: "u_sp1", captures: { pay_c: $.data.id } }
          trigger:
            - { call: "POST /compliance/payment-requests/${pay_a}/approve", payload: {}, as: FinanceReviewer, as_user_id: "u_fin1", captures: { a_status: $.data.payment_status } }
            - { call: "POST /compliance/payment-requests/${pay_b}/approve", payload: {}, as: FinanceReviewer, as_user_id: "u_fin1", captures: { b_err: $.data.error_id } }
            - { call: "POST /compliance/payment-requests/${pay_c}/approve", payload: {}, as: FinanceReviewer, as_user_id: "u_fin1", captures: { c_err: $.data.error_id } }
          assert:
            - "captured a_status == APPROVED — ratio 9.00 <= effective cap 9.00 (inclusive boundary) is straight APPROVABLE"
            - "captured b_err == ERR_ENHANCED_REVIEW_REQUIRED — 9.00 < 12.00 <= 25.00 falls in the evidence-required bracket"
            - "captured c_err == ERR_COMMISSION_CAP_EXCEEDED — 26.00 > 25.00 is BLOCKED_ONLY even though the request carried enhanced_review_evidence=true at creation"
            - "Contract.approved_payments_total_cents == 90000 (only pay_a posted)"

      - name: risk_score_weighted_override_branch
        grounds:
          - calculations.third_party_risk_score
          - state_machines.RedFlag.OPEN_to_UNDER_ENHANCED_REVIEW
        distinguishing_aspect: |
          Mode (a) formula with >=3 inputs and non-linear interaction: the weighted sum of
          country/industry/touchpoint (70.00 exactly at CPI 36 / CONSULTING / DIRECT) is
          overridden by the conditional sanctioned branch, which forces score 100 / CRITICAL
          regardless of the arithmetic, and fires the SYSTEM red-flag escalation chain.
        test_recipe:
          setup:
            - "Clock 2026-05-01; policy P1 ACTIVE; country IR cpi_score=36 sanctioned=false (norm 64 -> provisional (50*64+30*60+20*100)/100 = 70 -> HIGH)"
            - "ThirdParty IR-CO submitted, sitting in SCREENING"
          setup_api_calls:
            - { call: "POST /compliance/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: ComplianceAdmin }
            - { call: "POST /compliance/country-risk-profiles", payload: { country_code: "IR", cpi_score: 36, sanctioned: false }, as: ComplianceAdmin, captures: { prof_id: $.data.id } }
            - { call: "POST /compliance/risk-scoring-policies", payload: { w_country: 50, w_industry: 30, w_touchpoint: 20, tier_medium_min: 40, tier_high_min: 70, tier_critical_min: 90, commission_base_cap_pct: 15, commission_hard_cap_pct: 25 }, as: ComplianceAdmin, captures: { pol_id: $.data.id, pol_v: $.data.version } }
            - { call: "POST /compliance/risk-scoring-policies/${pol_id}/activate", payload: { expected_policy_version: "${pol_v}" }, as: ComplianceAdmin }
            - { call: "POST /compliance/third-parties", payload: { legal_name: "IR Consulting", country_code: "IR", industry: "CONSULTING", government_touchpoint: "DIRECT" }, as: BusinessSponsor, as_user_id: "u_sp1", captures: { tp_id: $.data.id } }
            - { call: "POST /compliance/third-parties/${tp_id}/submit", payload: {}, as: BusinessSponsor, as_user_id: "u_sp1", captures: { pre_score: $.data.risk_score_provisional, pre_tier: $.data.risk_tier } }
          trigger:
            - { call: "PATCH /compliance/country-risk-profiles/${prof_id}", payload: { sanctioned: true }, as: ComplianceAdmin }
            - { call: "GET /compliance/third-parties/${tp_id}", as: ComplianceOfficer, captures: { post_score: $.data.risk_score_provisional, post_tier: $.data.risk_tier, post_status: $.data.onboarding_status } }
            - { call: "GET /compliance/third-parties/${tp_id}/red-flags", as: ComplianceOfficer, captures: { rf0_src: "$.data[0].source_type", rf0_sev: "$.data[0].severity", rf0_status: "$.data[0].flag_status" } }
          assert:
            - "captured pre_score == 70 and pre_tier == HIGH (weighted formula before override)"
            - "captured post_score == 100 and post_tier == CRITICAL (sanctioned override ignores the arithmetic)"
            - "captured post_status == ENHANCED_REVIEW (SYSTEM CRITICAL flag auto-escalated from SCREENING)"
            - "captured rf0_src == SYSTEM, rf0_sev == CRITICAL, rf0_status == UNDER_ENHANCED_REVIEW"

  - rule_id: non_linear_state_machine
    instances:
      - name: questionnaire_return_resubmit_cycle
        grounds:
          - state_machines.Questionnaire.RETURNED_to_SUBMITTED
          - state_machines.Questionnaire.SUBMITTED_to_RETURNED
        distinguishing_aspect: |
          Questionnaire machine is cyclic: ISSUED -> SUBMITTED -> RETURNED -> SUBMITTED ->
          ACCEPTED loops the review cycle; a linear pipeline could not re-enter SUBMITTED.
        test_recipe:
          setup:
