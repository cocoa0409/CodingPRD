            - "A resident pothole complaint on the same segment is triaged DEFER_TO_CAPITAL against that project, leaving the segment's open_service_request_count at 1."
            - "The single line passes its acceptance test (density 96.0, IRI 60.0, thickness 2.00 -> pay factor 1.0200) and the project reaches SUBSTANTIALLY_COMPLETE with days_late 0."
