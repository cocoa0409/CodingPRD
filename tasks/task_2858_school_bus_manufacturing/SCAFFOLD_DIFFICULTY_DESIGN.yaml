            - "after the line returns to RUNNING the identical commit succeeds: BuildSlot.${slot_id}.status == COMMITTED, committed_slot_days == 7, BusUnit.${unit_tx_id}.production_status == SLOTTED"
            - "planning the slot on a DOWN_FOR_MAINTENANCE line was itself legal — only commit is gated"

