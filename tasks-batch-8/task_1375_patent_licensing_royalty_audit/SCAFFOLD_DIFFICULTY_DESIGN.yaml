scaffold_difficulty_design:
  # ===========================================================================
  # Rule 1 — dual_variant_calc (different entity domains)
  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: royalty_provisional_vs_final_minimum_floor
        grounds:
          - calculations.royalty_due_calculation
          - state_machines.RoyaltyReport.VALIDATED_to_ACCEPTED
          - entities.RoyaltyReport.fields.provisional_royalty_cents
          - entities.RoyaltyReport.fields.final_royalty_cents
        distinguishing_aspect: |
          Entity domain = RoyaltyReport. For identical line data the PROVISIONAL
          variant (no floor) yields 5000 while the FINAL variant (max with
          minimum_period_royalty_cents=10000) yields 10000 — the two variants
          of the same calculation produce different money on the same inputs.
        test_recipe:
          setup:
            - "Licensee L1 ACTIVE; agreement AG ACTIVE: NET_SALES, base_rate_bp 500, minimum_period_royalty_cents 10000, underreport_tolerance_bp 1000"
            - "One report net sales 100000 -> provisional 5000 (5%), floor binds at acceptance"
          setup_api_calls:
            - call: "POST /licensing/licensees"
              payload: { legal_name: "Alpha Widgets Inc", tax_id: "TAX-ALPHA-1", contact_email: "ops@alpha.test" }
              as: LicensingAnalyst
              captures: { l1_id: $.data.id }
            - call: "POST /licensing/license-agreements"
              payload:
                licensee_id: "${l1_id}"
                patent_reference: "US-10123456-B2"
                title: "Widget Patent License"
                royalty_base_definition: NET_SALES
                base_rate_bp: 500
                minimum_period_royalty_cents: 10000
                sublicense_allowed: false
                underreport_tolerance_bp: 1000
                audit_window_months: 24
                inventor_shares: [ { inventor_name: "Ada", share_bp: 6000 }, { inventor_name: "Alan", share_bp: 4000 } ]
                effective_date: "2026-01-01T00:00:00Z"
                expiration_date: "2028-01-01T00:00:00Z"
              as: LicensingAnalyst
              captures: { ag1_id: $.data.id }
            - call: "POST /licensing/license-agreements/${ag1_id}/lifecycle"
              payload: { action: ACTIVATE }
              as: LicensingAnalyst
            - call: "POST /licensing/royalty-reports"
              payload:
                agreement_id: "${ag1_id}"
                licensee_id: "${l1_id}"
                period_start: "2026-03-01T00:00:00Z"
                period_end: "2026-03-31T00:00:00Z"
                lines: [ { product_label: "W1", units_sold: 10, gross_sales_cents: 100000, deductions_cents: 0, is_sublicense_revenue: false } ]
              as: Licensee
              as_user_id: "${l1_id}"
              captures: { r1_id: $.data.id, r1_prov: $.data.provisional_royalty_cents }
            - call: "POST /licensing/royalty-reports/${r1_id}/validate"
              payload: { benchmark_net_sales_cents: 0 }
              as: LicensingAnalyst
          trigger:
            - call: "POST /licensing/royalty-reports/${r1_id}/accept"
              payload: {}
              as: LicensingAnalyst
              captures: { r1_final: $.data.final_royalty_cents, r1_status: $.data.status }
            - call: "GET /licensing/licensees/${l1_id}"
              as: LicensingAnalyst
              captures: { l1_bal: $.data.outstanding_balance_cents }
          assert:
            - "captured r1_prov == 5000 (PROVISIONAL: 5% of 100000, no floor)"
            - "captured r1_final == 10000 (FINAL: max(5000, minimum 10000))"
            - "captured r1_status == ACCEPTED"
            - "captured l1_bal == 10000 (final royalty accrued, not provisional)"
      - name: mfl_retroactive_vs_prospective_credit
        grounds:
          - calculations.mfl_adjustment_calculation
          - state_machines.LicenseAgreement.DRAFT_to_ACTIVE
          - entities.LicenseAgreement.fields.mfl_adjusted_rate_bp
          - entities.Licensee.fields.credit_balance_cents
        distinguishing_aspect: |
          Entity domain = LicenseAgreement/Licensee credit (distinct from the
          RoyaltyReport domain of royalty_provisional_vs_final_minimum_floor).
          Same sales history and same rate cut (500->400 bp): RETROACTIVE mode
          grants a 10000-cent lookback credit while PROSPECTIVE mode grants 0.
        test_recipe:
          setup:
            - "L1 with M1 (patent US-20200-A1, 500 bp, MFL RETROACTIVE, lookback 4) and one ACCEPTED report final 50000"
            - "L2 with M2 (same patent, 500 bp, MFL PROSPECTIVE) and one ACCEPTED report final 50000"
            - "L3 with new agreement N on same patent at 400 bp, DRAFT"
          setup_api_calls:
            - call: "POST /licensing/licensees"
              payload: { legal_name: "Retro Co", tax_id: "TAX-RETRO-1", contact_email: "r@x.test" }
              as: LicensingAnalyst
              captures: { l1_id: $.data.id }
            - call: "POST /licensing/licensees"
              payload: { legal_name: "Pro Co", tax_id: "TAX-PRO-1", contact_email: "p@x.test" }
              as: LicensingAnalyst
              captures: { l2_id: $.data.id }
            - call: "POST /licensing/licensees"
              payload: { legal_name: "New Co", tax_id: "TAX-NEW-1", contact_email: "n@x.test" }
              as: LicensingAnalyst
              captures: { l3_id: $.data.id }
            - call: "POST /licensing/license-agreements"
              payload:
                licensee_id: "${l1_id}"
                patent_reference: "US-20200-A1"
                title: "M1 retro"
                royalty_base_definition: NET_SALES
                base_rate_bp: 500
                minimum_period_royalty_cents: 0
                mfl_clause: true
                mfl_mode: RETROACTIVE
                mfl_lookback_quarters: 4
                underreport_tolerance_bp: 1000
                inventor_shares: [ { inventor_name: "Ada", share_bp: 10000 } ]
                effective_date: "2026-01-01T00:00:00Z"
                expiration_date: "2028-01-01T00:00:00Z"
              as: LicensingAnalyst
              captures: { m1_id: $.data.id }
            - call: "POST /licensing/license-agreements/${m1_id}/lifecycle"
              payload: { action: ACTIVATE }
              as: LicensingAnalyst
            - call: "POST /licensing/royalty-reports"
              payload:
                agreement_id: "${m1_id}"
                licensee_id: "${l1_id}"
                period_start: "2026-03-01T00:00:00Z"
                period_end: "2026-03-31T00:00:00Z"
                lines: [ { product_label: "A", units_sold: 100, gross_sales_cents: 1000000, deductions_cents: 0, is_sublicense_revenue: false } ]
              as: Licensee
              as_user_id: "${l1_id}"
              captures: { m1_r: $.data.id }
            - call: "POST /licensing/royalty-reports/${m1_r}/validate"
              payload: { benchmark_net_sales_cents: 0 }
              as: LicensingAnalyst
            - call: "POST /licensing/royalty-reports/${m1_r}/accept"
              payload: {}
              as: LicensingAnalyst
            - call: "POST /licensing/license-agreements"
              payload:
                licensee_id: "${l2_id}"
                patent_reference: "US-20200-A1"
                title: "M2 pro"
                royalty_base_definition: NET_SALES
                base_rate_bp: 500
                minimum_period_royalty_cents: 0
                mfl_clause: true
                mfl_mode: PROSPECTIVE
                mfl_lookback_quarters: 4
                underreport_tolerance_bp: 1000
                inventor_shares: [ { inventor_name: "Bob", share_bp: 10000 } ]
                effective_date: "2026-01-01T00:00:00Z"
                expiration_date: "2028-01-01T00:00:00Z"
              as: LicensingAnalyst
              captures: { m2_id: $.data.id }
            - call: "POST /licensing/license-agreements/${m2_id}/lifecycle"
              payload: { action: ACTIVATE }
              as: LicensingAnalyst
            - call: "POST /licensing/royalty-reports"
              payload:
                agreement_id: "${m2_id}"
                licensee_id: "${l2_id}"
                period_start: "2026-03-01T00:00:00Z"
                period_end: "2026-03-31T00:00:00Z"
                lines: [ { product_label: "B", units_sold: 100, gross_sales_cents: 1000000, deductions_cents: 0, is_sublicense_revenue: false } ]
              as: Licensee
              as_user_id: "${l2_id}"
              captures: { m2_r: $.data.id }
            - call: "POST /licensing/royalty-reports/${m2_r}/validate"
              payload: { benchmark_net_sales_cents: 0 }
              as: LicensingAnalyst
            - call: "POST /licensing/royalty-reports/${m2_r}/accept"
              payload: {}
              as: LicensingAnalyst
            - call: "POST /licensing/license-agreements"
              payload:
                licensee_id: "${l3_id}"
                patent_reference: "US-20200-A1"
                title: "N cheap"
                royalty_base_definition: NET_SALES
                base_rate_bp: 400
                minimum_period_royalty_cents: 0
                mfl_clause: false
                underreport_tolerance_bp: 1000
                inventor_shares: [ { inventor_name: "Cid", share_bp: 10000 } ]
                effective_date: "2026-06-01T00:00:00Z"
                expiration_date: "2028-01-01T00:00:00Z"
              as: LicensingAnalyst
              captures: { n_id: $.data.id }
          trigger:
            - call: "POST /licensing/license-agreements/${n_id}/lifecycle"
              payload: { action: ACTIVATE }
              as: LicensingAnalyst
            - call: "GET /licensing/licensees/${l1_id}"
              as: LicensingAnalyst
              captures: { l1_credit: $.data.credit_balance_cents }
            - call: "GET /licensing/licensees/${l2_id}"
              as: LicensingAnalyst
              captures: { l2_credit: $.data.credit_balance_cents }
            - call: "GET /licensing/license-agreements/${m1_id}"
              as: LicensingAnalyst
              captures: { m1_rate: $.data.mfl_adjusted_rate_bp, m1_credit: $.data.last_mfl_credit_cents }
            - call: "GET /licensing/license-agreements/${m2_id}"
              as: LicensingAnalyst
              captures: { m2_rate: $.data.mfl_adjusted_rate_bp, m2_credit: $.data.last_mfl_credit_cents }
          assert:
            - "captured l1_credit == 10000 (RETROACTIVE: 50000 - recomputed 40000 over the 12-month lookback)"
            - "captured l2_credit == 0 (PROSPECTIVE: no credit)"
            - "captured m1_rate == 400 and captured m2_rate == 400 (both re-rated point-forward)"
            - "captured m1_credit == 10000 and captured m2_credit == 0"

  # ===========================================================================
  # Rule 2 — combinatorial_formula (different modes: (a) then (b))
  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: royalty_due_multi_input_branch
        grounds:
          - calculations.royalty_due_calculation
          - calculations.royalty_base_derivation
          - entities.LicenseAgreement.fields.sublicense_passthrough_rate_bp
        distinguishing_aspect: |
          Mode (a): >=3 inputs with non-linear interaction — conditional branch
          excluding sublicense lines from the base, a separate passthrough rate
          on those lines, and a nested max() against minimum_period_royalty_cents.
          Inputs pinned so floor binds: max(10000 + 8000, 20000) = 20000.
        test_recipe:
          setup:
            - "AG ACTIVE: NET_SALES, 500 bp, min 20000, sublicense_allowed, passthrough 800 bp; one APPROVED sublicense grant"
            - "Report lines: product line gross 250000 ded 50000 (net 200000) + sublicense line net 100000"
          setup_api_calls:
            - call: "POST /licensing/licensees"
              payload: { legal_name: "Branch Co", tax_id: "TAX-BR-1", contact_email: "b@x.test" }
              as: LicensingAnalyst
              captures: { l1_id: $.data.id }
            - call: "POST /licensing/license-agreements"
              payload:
                licensee_id: "${l1_id}"
                patent_reference: "US-30300-B1"
                title: "Branch"
                royalty_base_definition: NET_SALES
                base_rate_bp: 500
                minimum_period_royalty_cents: 20000
                sublicense_allowed: true
                sublicense_passthrough_rate_bp: 800
                underreport_tolerance_bp: 1000
                inventor_shares: [ { inventor_name: "Ada", share_bp: 6000 }, { inventor_name: "Alan", share_bp: 4000 } ]
                effective_date: "2026-01-01T00:00:00Z"
                expiration_date: "2028-01-01T00:00:00Z"
              as: LicensingAnalyst
              captures: { ag_id: $.data.id }
            - call: "POST /licensing/license-agreements/${ag_id}/lifecycle"
              payload: { action: ACTIVATE }
              as: LicensingAnalyst
            - call: "POST /licensing/sublicense-grants"
              payload: { agreement_id: "${ag_id}", sublicensee_name: "SubCo", territory: "EU" }
              as: Licensee
              as_user_id: "${l1_id}"
              captures: { sg_id: $.data.id }
            - call: "POST /licensing/sublicense-grants/${sg_id}/decision"
              payload: { decision: APPROVED }
              as: LicensingAnalyst
          trigger:
            - call: "POST /licensing/royalty-reports"
              payload:
                agreement_id: "${ag_id}"
                licensee_id: "${l1_id}"
                period_start: "2026-03-01T00:00:00Z"
                period_end: "2026-03-31T00:00:00Z"
                lines:
                  - { product_label: "P1", units_sold: 100, gross_sales_cents: 250000, deductions_cents: 50000, is_sublicense_revenue: false }
                  - { product_label: "S1", units_sold: 50, gross_sales_cents: 100000, deductions_cents: 0, is_sublicense_revenue: true }
              as: Licensee
              as_user_id: "${l1_id}"
              captures: { r_id: $.data.id, r_base: $.data.royalty_base_cents, r_sub: $.data.sublicense_net_sales_cents, r_prov: $.data.provisional_royalty_cents }
            - call: "POST /licensing/royalty-reports/${r_id}/validate"
              payload: { benchmark_net_sales_cents: 0 }
              as: LicensingAnalyst
            - call: "POST /licensing/royalty-reports/${r_id}/accept"
              payload: {}
              as: LicensingAnalyst
              captures: { r_final: $.data.final_royalty_cents }
          assert:
            - "captured r_base == 200000 (sublicense line excluded from NET_SALES base)"
            - "captured r_sub == 100000"
            - "captured r_prov == 18000 (round(200000*0.05)=10000 + round(100000*0.08)=8000)"
            - "captured r_final == 20000 (max(18000, minimum 20000) — floor binds)"
      - name: inventor_share_rounding_remainder
        grounds:
          - calculations.inventor_share_distribution
          - state_machines.DistributionRun.DRAFT_to_POSTED
          - entities.DistributionRun.fields.lines
        distinguishing_aspect: |
          Mode (b): nested rounding where order matters — per-line round_half_up
          THEN remainder fix-up (pinned order), unlike sum-then-round. Pool
          10001 with shares 3333/3333/3334 leaves remainder +1 assigned to the
          largest share_bp (Cid), giving 3333/3333/3335.
        test_recipe:
          setup:
            - "AG ACTIVE: 500 bp, min 0, inventor_shares Ann 3333 / Ben 3333 / Cid 3334"
            - "One accepted report net 200020 -> final 10001 -> undistributed pool 10001"
            - "Run created by FinanceOfficer fin-1 (SoD: approve by fin-2)"
          setup_api_calls:
            - call: "POST /licensing/licensees"
              payload: { legal_name: "Share Co", tax_id: "TAX-SH-1", contact_email: "s@x.test" }
              as: LicensingAnalyst
              captures: { l1_id: $.data.id }
            - call: "POST /licensing/license-agreements"
              payload:
                licensee_id: "${l1_id}"
                patent_reference: "US-40400-C1"
                title: "Shares"
                royalty_base_definition: NET_SALES
                base_rate_bp: 500
                minimum_period_royalty_cents: 0
                underreport_tolerance_bp: 1000
                inventor_shares: [ { inventor_name: "Ann", share_bp: 3333 }, { inventor_name: "Ben", share_bp: 3333 }, { inventor_name: "Cid", share_bp: 3334 } ]
                effective_date: "2026-01-01T00:00:00Z"
                expiration_date: "2028-01-01T00:00:00Z"
              as: LicensingAnalyst
              captures: { ag_id: $.data.id }
            - call: "POST /licensing/license-agreements/${ag_id}/lifecycle"
              payload: { action: ACTIVATE }
              as: LicensingAnalyst
            - call: "POST /licensing/royalty-reports"
              payload:
                agreement_id: "${ag_id}"
                licensee_id: "${l1_id}"
                period_start: "2026-03-01T00:00:00Z"
                period_end: "2026-03-31T00:00:00Z"
                lines: [ { product_label: "X", units_sold: 1, gross_sales_cents: 200020, deductions_cents: 0, is_sublicense_revenue: false } ]
              as: Licensee
              as_user_id: "${l1_id}"
              captures: { r_id: $.data.id }
            - call: "POST /licensing/royalty-reports/${r_id}/validate"
              payload: { benchmark_net_sales_cents: 0 }
              as: LicensingAnalyst
            - call: "POST /licensing/royalty-reports/${r_id}/accept"
              payload: {}
              as: LicensingAnalyst
            - call: "POST /licensing/distribution-runs"
              payload: { agreement_id: "${ag_id}", period_start: "2026-03-01T00:00:00Z", period_end: "2026-03-31T00:00:00Z", pool_cents: 10001 }
              as: FinanceOfficer
              as_user_id: "fin-1"
              captures: { run_id: $.data.id }
          trigger:
            - call: "POST /licensing/distribution-runs/${run_id}/approve"
              payload: {}
              as: FinanceOfficer
              as_user_id: "fin-2"
              captures: { run_status: $.data.status }
            - call: "GET /licensing/distribution-runs/${run_id}"
              as: FinanceOfficer
              captures: { run_lines: $.data.lines }
            - call: "GET /licensing/license-agreements/${ag_id}"
              as: FinanceOfficer
              captures: { ag_pool: $.data.undistributed_pool_cents }
          assert:
            - "captured run_status == POSTED"
            - "run lines == [Ann 3333, Ben 3333, Cid 3335] (per-line round_half_up 3333/3333/3334 sums to 10000; remainder +1 to largest share_bp = Cid)"
            - "sum(run.lines.amount_cents) == 10001 == run.pool_cents exactly"
            - "captured ag_pool == 0 (pool fully consumed)"

  # ===========================================================================
  # Rule 3 — non_linear_state_machine (different entities)
  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: dispute_negotiation_counter_cycle
        grounds:
          - state_machines.Dispute.NEGOTIATION_to_COUNTERED
          - state_machines.Dispute.COUNTERED_to_NEGOTIATION
          - concurrency_rules[dispute-offer-stale-version]
        distinguishing_aspect: |
          Entity = Dispute (cyclic): NEGOTIATION -> COUNTERED -> NEGOTIATION
          loops via counter-offers, superseding the PENDING offer each round;
          OCC version advances 1 -> 2 -> 3 -> 4 across the cycle.
        test_recipe:
          setup:
            - "Report FLAGGED (benchmark 200000, tolerance 1000 -> threshold 180000 > net 100000), referred to audit, finding shortfall 9000, disputed -> Dispute OPEN version 1"
          setup_api_calls:
            - call: "POST /licensing/licensees"
              payload: { legal_name: "Cycle Co", tax_id: "TAX-CY-1", contact_email: "c@x.test" }
              as: LicensingAnalyst
              captures: { l1_id: $.data.id }
            - call: "POST /licensing/license-agreements"
              payload:
                licensee_id: "${l1_id}"
                patent_reference: "US-50500-D1"
                title: "Cycle"
                royalty_base_definition: NET_SALES
                base_rate_bp: 500
                minimum_period_royalty_cents: 0
                underreport_tolerance_bp: 1000
                audit_window_months: 24
                inventor_shares: [ { inventor_name: "Ada", share_bp: 10000 } ]
                effective_date: "2026-01-01T00:00:00Z"
                expiration_date: "2028-01-01T00:00:00Z"
              as: LicensingAnalyst
              captures: { ag_id: $.data.id }
            - call: "POST /licensing/license-agreements/${ag_id}/lifecycle"
              payload: { action: ACTIVATE }
              as: LicensingAnalyst
            - call: "POST /licensing/royalty-reports"
              payload:
                agreement_id: "${ag_id}"
                licensee_id: "${l1_id}"
                period_start: "2026-03-01T00:00:00Z"
                period_end: "2026-03-31T00:00:00Z"
                lines: [ { product_label: "W", units_sold: 10, gross_sales_cents: 100000, deductions_cents: 0, is_sublicense_revenue: false } ]
              as: Licensee
              as_user_id: "${l1_id}"
              captures: { r_id: $.data.id }
            - call: "POST /licensing/royalty-reports/${r_id}/validate"
              payload: { benchmark_net_sales_cents: 200000 }
              as: LicensingAnalyst
              captures: { r_flag: $.data.status }
            - call: "POST /licensing/audits"
              payload: { agreement_id: "${ag_id}", scope_period_start: "2026-03-01T00:00:00Z", scope_period_end: "2026-03-31T00:00:00Z" }
              as: LicensingAnalyst
              as_user_id: "ana-1"
              captures: { au_id: $.data.id }
            - call: "POST /licensing/audits/${au_id}/advance"
              payload: { to_state: FIELDWORK }
              as: LicensingAnalyst
            - call: "POST /licensing/audit-findings"
              payload: { audit_id: "${au_id}", report_id: "${r_id}", finding_type: UNDERREPORTED_BASE, audited_base_cents: 180000 }
              as: LicensingAnalyst
              captures: { f_id: $.data.id, f_short: $.data.shortfall_cents }
            - call: "POST /licensing/audit-findings/${f_id}/dispute"
              payload: {}
              as: Licensee
              as_user_id: "${l1_id}"
              captures: { d_id: $.data.id, d_v: $.data.version }
          trigger:
            - call: "POST /licensing/disputes/${d_id}/offers"
              payload: { amount_cents: 40000, expected_dispute_version: "${d_v}" }
              as: LegalCounsel
              as_user_id: "counsel-1"
              captures: { d_v2: $.data.version, d_s1: $.data.status }
            - call: "POST /licensing/disputes/${d_id}/offers"
              payload: { amount_cents: 25000, expected_dispute_version: "${d_v2}" }
              as: Licensee
              as_user_id: "${l1_id}"
              captures: { d_v3: $.data.version, d_s2: $.data.status }
            - call: "POST /licensing/disputes/${d_id}/offers"
              payload: { amount_cents: 30000, expected_dispute_version: "${d_v3}" }
              as: LegalCounsel
              as_user_id: "counsel-1"
              captures: { d_v4: $.data.version, d_s3: $.data.status }
            - call: "GET /licensing/disputes/${d_id}"
              as: LegalCounsel
              captures: { d_offers: $.data.offers }
          assert:
            - "captured r_flag == FLAGGED and captured f_short == 9000"
            - "captured d_s1 == NEGOTIATION, d_s2 == COUNTERED, d_s3 == NEGOTIATION (cycle NEGOTIATION -> COUNTERED -> NEGOTIATION)"
            - "captured d_v4 == 4 (each offer bumps Dispute.version by 1)"
            - "dispute offers: offers[0].status == SUPERSEDED, offers[1].status == SUPERSEDED, offers[2].status == PENDING with amount_cents == 30000"
      - name: report_validation_fork
        grounds:
          - state_machines.RoyaltyReport.SUBMITTED_to_VALIDATED
          - state_machines.RoyaltyReport.SUBMITTED_to_FLAGGED
          - state_machines.RoyaltyReport.FLAGGED_to_ACCEPTED_WITH_ADJUSTMENT
        distinguishing_aspect: |
          Entity = RoyaltyReport (branching fork, distinct from Dispute cycle):
          validate forks SUBMITTED -> {VALIDATED, FLAGGED}; each branch accepts
          with a divergent side-effect set — VALIDATED prices off
          royalty_base_cents, FLAGGED requires and prices off adjusted_base_cents.
        test_recipe:
          setup:
            - "AG ACTIVE 500 bp min 0 tolerance 1000; R1 net 100000 -> VALIDATED; R2 net 50000 with benchmark 200000 -> FLAGGED"
          setup_api_calls:
            - call: "POST /licensing/licensees"
              payload: { legal_name: "Fork Co", tax_id: "TAX-FK-1", contact_email: "f@x.test" }
              as: LicensingAnalyst
              captures: { l1_id: $.data.id }
            - call: "POST /licensing/license-agreements"
              payload:
                licensee_id: "${l1_id}"
                patent_reference: "US-60600-E1"
                title: "Fork"
