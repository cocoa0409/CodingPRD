            - "Installment 1 still reads status \"PAID\" with hold_reason_code == null, gross_cents == 600000, withholding_cents == 0, net_cents == 600000"
            - "Installments 2 and 3 read status \"HELD\" with hold_reason_code \"ARTIST_DEBARRED\", gross_cents 525000 and 375000"
            - "The award still reads status \"ACTIVE\", payment_status \"PARTIALLY_PAID\", disbursed_gross_cents == 600000, undisbursed_gross_cents == 900000"

      - name: parallel_dimensions_of_one_application_move_independently
        claim_type: parallel
        grounds:
          - complexity_profile.state_machine_shape
          - state_machines.Application.anonymity_status
        excluded_because:
          difficulty_instance: non_linear_state_machine / application_review_and_anonymity_dimensions_move_independently
          rationale: "That §1.8 instance drives the review dimension and the anonymity dimension apart on one row and asserts both combined states."

      - name: redaction_bubbles_the_application_anonymity_dimension_back_up
        claim_type: bubble_up
        grounds:
          - state_machines.WorkSample.FLAGGED_to_REDACTED
          - state_machines.Application.anonymity_status.BREACHED_to_REDACTED
        excluded_because:
          difficulty_instance: transitive_cascade / anonymity_breach_freezes_cycle_and_blocks_disbursement_until_redaction
          rationale: "The named §1.8 instance asserts the BREACHED -> REDACTED bubble-up and the cycle unfreeze it releases."

      - name: waived_conflict_reverses_every_original_side_effect
        claim_type: compensation
        grounds:
          - state_machines.ConflictDeclaration.BLOCKING_to_WAIVED
          - state_machines.Review.INVALIDATED_to_SUBMITTED
        excluded_because:
          difficulty_instance: compensating_invariant / waived_conflict_restores_review_count_score_and_readiness
          rationale: "The named §1.8 instance asserts the full undo (review, counters, readiness) with pre-block literals."

      - name: installment_release_is_guarded_by_the_owning_cycle_state
        claim_type: guarded_transitions
        grounds:
          - state_machines.PaymentInstallment.SCHEDULED_to_RELEASED
          - validations[error_id=ERR_CYCLE_STATE_INVALID]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / installment_release_gated_on_the_cycle_reaching_awarded
          rationale: "That §1.8 instance is exactly the cross-entity guard: same installment, refused before the cycle reaches AWARDED and accepted after."

      - name: rescission_syncs_the_cycle_and_discipline_ledgers
        claim_type: ledger_sync
        grounds:
          - state_machines.Award.ACCEPTED_to_RESCINDED
          - entities.DisciplineCategory.fields.committed_cents
        excluded_because:
          difficulty_instance: transitive_cascade / award_rescission_unwinds_installments_slot_ledger_and_artist_counters
          rationale: "The named §1.8 instance reconciles the cycle and discipline ledgers before and after the rescission."

      - name: blocking_conflict_adjusts_every_downstream_entity
        claim_type: cross_entity
        grounds:
          - state_machines.ConflictDeclaration.DECLARED_to_BLOCKING
          - state_machines.Panelist.SEATED_to_RECUSED
        excluded_because:
          difficulty_instance: transitive_cascade / blocking_conflict_cascades_six_levels_to_slot_and_cycle_posture
          rationale: "That §1.8 instance walks all six affected entities from one screen call."

  # ===========================================================================
  # SECTION: calculations
  # ===========================================================================
  - section: calculations
    instances:

      - name: review_weighted_score_uses_the_declared_criterion_weights
        claim_type: correct_result
        grounds:
          - calculations.review_weighted_score
          - entities.Review.fields.weighted_score
        distinguishing_aspect: |
          (9,8,7,6) must yield 8.00, (7,7,6,5) 6.60 and (8,6,8,7) 7.30 under the
          0.40/0.30/0.20/0.10 weights. A plain four-criterion average yields
          7.50 / 6.25 / 7.25 — every one of the three literals separates it, and
          the aggregate 7.30 rules out a weight vector applied in the wrong
          field order.
        test_recipe:
          setup:
            - "CornerMain panel with all three reviews submitted and the round closed"
          setup_api_calls:
            - *n_clock
            - *n_cycle
            - *n_disc
            - *n_open
            - *n_art
            - *n_app
            - *n_ws1
            - *n_ws2
            - *n_sub
            - *n_clock16
            - *n_close
            - *n_elig
            - *n_pr
            - *n_panel
            - *n_pl1
            - *n_pl2
            - *n_pl3
            - *n_seat1
            - *n_seat2
            - *n_seat3
            - *n_charter
            - *n_round
            - *n_rev1
            - *n_srev1
            - *n_rev2
            - *n_srev2
            - *n_rev3
            - *n_srev3
            - *n_closeround
          trigger:
            - { call: "GET /grants/reviews/${rv1}", payload: {}, as: ProgramOfficer, as_user_id: "officer-1" }
            - { call: "GET /grants/reviews/${rv2}", payload: {}, as: ProgramOfficer, as_user_id: "officer-1" }
            - { call: "GET /grants/reviews/${rv3}", payload: {}, as: ProgramOfficer, as_user_id: "officer-1" }
            - { call: "GET /grants/applications/${app}", payload: {}, as: ProgramOfficer, as_user_id: "officer-1" }
          assert:
            - "weighted_score == 8.00 for (9,8,7,6)"
            - "weighted_score == 6.60 for (7,7,6,5)"
            - "weighted_score == 7.30 for (8,6,8,7)"
            - "All three reviews read status \"SUBMITTED\" with round_number == 1 and invalidation_reason == null"
            - "The application reads valid_review_count == 3, provisional_composite_score == 7.30, final_composite_score == 7.30 and score_spread == 1.40"

      - name: diversity_pool_excludes_draft_and_ineligible_applications
        claim_type: input_set_filtering
        grounds:
          - calculations.cycle_diversity_evaluation
          - endpoints[GET /grants/cycles/{cycle_id}/evaluation]
        distinguishing_aspect: |
          Four applications exist but only two enter the pool: the DRAFT one and
          the INELIGIBLE one are filtered out. That gives eligible_pool_size 2,
          region_hhi 0.5000 and geographic_distribution_score 62.50. Counting all
          four (2 NORTH + 2 SOUTH) also gives hhi 0.5000 but pool 4, and counting
          the DRAFT row only gives 3 rows with hhi 0.5556 -> 55.55, so the pool
          size and the score together pin the filter.
        test_recipe:
          setup:
            - "CornerTwoSlot cycle: allocation 1_800_000, four applications"
            - "appA (Dara Holt, NORTH) and appB (Emil Roux, SOUTH) are SCORED after a closed round"
            - "appC (Fay Ling, NORTH) never left DRAFT; appD (Gus Pran, SOUTH, 23 months of residency) is INELIGIBLE"
          setup_api_calls:
            - &t_clock { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: ProgramOfficer, as_user_id: "officer-1" }
            - &t_cycle
              call: "POST /grants/cycles"
              payload:
                name: "FY2027 Fellowships (two-slot fixture)"
                fiscal_year: 2027
                application_open_at: "2026-08-15T00:00:00Z"
                application_deadline_at: "2026-10-15T23:59:59Z"
                grant_period_start: "2027-01-01T00:00:00Z"
                grant_period_end: "2027-12-31T00:00:00Z"
                total_budget_cents: 6000000
                base_award_cents: 1500000
