  - rule_id: priority_pair_validation_conflict
    instances:
      - name: self_study_state_check_beats_closed_deadline_window
        grounds:
          - validations[priority=12]
          - validations[priority=19]
        distinguishing_aspect: |
          One SUBMIT request violates two rules at once: the self-study is no
          longer DRAFT (state, priority 12) and the logical clock has passed the
          cycle's self_study_due_at (business_temporal, priority 19). Only the
          higher-priority state error may surface. An implementation that
          evaluates the deadline first returns ERR_SELF_STUDY_WINDOW_CLOSED and
          fails this instance.
        test_recipe:
          setup:
            - "Program HIST-BA with an open ReviewCycle whose self_study_due_at is 2026-09-01T00:00:00Z."
            - "A SelfStudy covering the single required section, submitted at 2026-08-01T00:00:00Z so it is now in state SUBMITTED with revision_round 0."
            - "The logical clock is then moved to 2026-09-02T00:00:00Z, one day past the deadline, so a fresh SUBMIT violates the deadline rule as well."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ReviewCoordinator
            - call: "POST /provost/academic-programs"
              payload: { code: "HIST-BA", name: "History BA", degree_level: "UNDERGRADUATE", department_code: "HIST" }
              as: ReviewCoordinator
              captures: { prog_id: $.data.id }
            - call: "POST /provost/academic-programs/${prog_id}/review-cycles"
              payload: { cycle_year: 2026, self_study_due_at: "2026-09-01T00:00:00Z", required_section_codes: ["S1"] }
              as: ReviewCoordinator
              captures: { cycle_id: $.data.id }
            - call: "POST /provost/review-cycles/${cycle_id}/self-studies"
              payload: { narrative: "Self-study narrative", section_codes: ["S1"] }
              as: ProgramChair
              as_user_id: "${prog_id}"
              captures: { ss_id: $.data.id }
            - call: "POST /provost/self-studies/${ss_id}/transitions"
              payload: { action: "SUBMIT" }
              as: ProgramChair
              as_user_id: "${prog_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-02T00:00:00Z" }
              as: ReviewCoordinator
          trigger:
            - call: "POST /provost/self-studies/${ss_id}/transitions"
              payload: { action: "SUBMIT" }
              as: ProgramChair
              as_user_id: "${prog_id}"
          assert:
            - "the trigger returns 409 with error_id ERR_SELF_STUDY_NOT_DRAFT"
            - "the response error_id is NOT ERR_SELF_STUDY_WINDOW_CLOSED even though the deadline has also passed"
            - "SelfStudy.${ss_id}.state == SUBMITTED and revision_round == 0 and submitted_at == 2026-08-01T00:00:00Z"
            - "ReviewCycle.${cycle_id}.state == SELF_STUDY_OPEN"

      - name: agency_compliance_check_beats_severance_budget_check
        grounds:
          - validations[priority=31]
          - validations[priority=33]
          - calculations.staffing_reduction_waterfall
        distinguishing_aspect: |
          One EFFECTUATE request violates the compliance rule at priority 31
          (both AUTO_MINTED notices are still PENDING, so
          unacknowledged_notification_count is 2) and the fiscal rule at
          priority 33 (the severance cap breaks the waterfall, leaving
          deferred_fte at 0.67). The declared order says the compliance failure
