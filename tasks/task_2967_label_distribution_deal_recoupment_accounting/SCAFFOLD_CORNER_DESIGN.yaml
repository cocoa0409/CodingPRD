      - name: per_line_rounding_order_is_pinned_round_then_sum
        claim_type: precision
        grounds:
          - calculations.dsp_line_revenue.precision
          - calculations.dsp_line_revenue.combinatorial_mode
        distinguishing_aspect: |
          The nested-rounding claim: round_half_up per line and never on the sum, worth exactly one
          cent on the pinned three-line fixture (800001 versus 800002).
        excluded_because:
          difficulty_instance: per_line_rounding_order_beats_sum_then_round
          rationale: |
            §1.8 combinatorial_formula.per_line_rounding_order_beats_sum_then_round already submits the
            1000001 / 2500003 / 333338 fixture and asserts 800001 against the 800002 sum-then-round
            answer, line by line. The corner instance
            leftover_allocation_cents_follow_the_largest_fractional_parts above reuses the same three
            line values for a DIFFERENT claim (STEP 3's leftover assignment on accept), so the
            rounding-order claim itself needs no second recipe.

      - name: returns_tier_threshold_uses_greater_or_equal
        claim_type: threshold
        grounds:
          - calculations.returns_reserve_obligation.formula
          - calculations.returns_reserve_obligation.constants
          - calculations.returns_reserve_obligation.precision
        distinguishing_aspect: |
          The per-algorithm boundary claim for `threshold`: a returns_rate landing exactly on
          RETURNS_TIER_2_RATE takes the higher tier, and one unit fewer takes the lower one.
        excluded_because:
          difficulty_instance: returns_rate_exactly_at_tier_2_threshold
          rationale: |
            §1.8 boundary_precision_check.returns_rate_exactly_at_tier_2_threshold drives the pinned
            250-of-1000 versus 249-of-1000 pair at base 0.2000 and asserts effective_reserve_pct
            0.3500 / 0.2500 with reserves 315000 / 225000, which is exactly the >= claim. The tier-1
            edge (100 of 1000 -> 0.1000 -> 0.1500 -> 135000) is additionally exercised as a
            by-product by physical_run_two_dimensions_move_independently in the state_machines
            section above.

      - name: marketing_cap_cycle_is_broken_by_a_pinned_evaluation_order
        claim_type: constraint_propagation
        grounds:
          - calculations.recoupable_marketing_cap.combinatorial_mode
          - calculations.recoupable_marketing_cap.formula
        distinguishing_aspect: |
          The circular-looking dependency marketing -> distributor share -> net receipts ->
          marketing cap is cut by excluding in-period settled marketing from the PROFIT_SHARE
          distributor share; no fixed-point iteration may appear.
        excluded_because:
          difficulty_instance: marketing_cap_cycle_broken_by_pinned_evaluation_order
          rationale: |
            §1.8 combinatorial_formula.marketing_cap_cycle_broken_by_pinned_evaluation_order builds the
            PROFIT_SHARE fixture with one spend approved before the period and one inside it, and
            asserts that only the earlier spend moves the distributor share while both feed the cap —
            the whole content of the constraint_propagation claim. The corner instance
            marketing_cap_binds_and_non_recoupable_category_contributes_zero above covers the
            orthogonal part §1.8 leaves open: the cap actually BINDING, and the per-category
            recoupability factors.

      - name: cross_versus_siloed_arms_diverge_on_identical_state
        claim_type: variant_divergence
        grounds:
          - calculations.advance_recoupment_waterfall.variants
          - calculations.advance_recoupment_waterfall.divergence_proof
        distinguishing_aspect: |
          The two arms of advance_recoupment_waterfall must produce different advance_applied_cents,
          unrecouped_advance_cents and recoupment_status from the same receipts.
        excluded_because:
          difficulty_instance: cross_collateralized_vs_siloed_advance_recoupment
          rationale: |
            §1.8 dual_variant_calc.cross_collateralized_vs_siloed_advance_recoupment runs the pinned
            650000 / 600000 / 50000 fixture through both arms and asserts the 650000-versus-645000
            divergence together with the downstream royalty-rate flip. The corner instance
            recoupment_summary_variant_parameter_selects_the_arm_read_only above adds only what §1.8
            cannot: that the ?variant query parameter, and nothing else, chooses the arm, and that the
            read persists nothing.

      - name: provisional_and_final_bases_reconcile_after_a_liquidation
        claim_type: reconciliation
        grounds:
          - calculations.artist_statement_net_payable.variants
          - calculations.artist_statement_net_payable.divergence_proof
        distinguishing_aspect: |
          The reconciliation claim: switching the basis variant over the same period must move the
          net payable by exactly the marketing-basis plus reserve-basis delta, with no double count.
        excluded_because:
          difficulty_instance: provisional_vs_final_statement_net_payable
          rationale: |
            §1.8 dual_variant_calc.provisional_vs_final_statement_net_payable prepares both variants on
            one 1105000-cent period after a 40% liquidation and asserts 34600 versus 61820 with the
            27220 delta decomposed into its marketing (40000 -> 22500) and reserve (24300 -> 14580)
            components — the reconciliation identity itself. Repeating it here would need the same
            heavyweight fixture for no new observation.

  - section: validations
    instances:
      - name: every_priority_satisfied_lets_the_write_through
        claim_type: satisfaction_to_pass
        grounds:
          - validations[priority 1]
          - validations[priority 2]
          - validations[priority 8 ERR_RELEASE_NOT_PROMOTABLE]
          - validations[priority 9 ERR_SEGREGATION_OF_DUTIES]
          - validations[priority 12 ERR_MARKETING_BUDGET_EXCEEDED]
        distinguishing_aspect: |
          The positive control for the whole ladder: POST /marketing-spends/{id}/decide is the one
          endpoint governed by rules 1, 2, 3, 5, 8 (own status), 8 (ERR_RELEASE_NOT_PROMOTABLE), 9
          and 12 at once. With every one of them satisfied — and rule 12 satisfied at its inclusive
          ceiling, committed 0 + 100000 == budget 100000 — the call must return 200 and actually
          mutate, not merely avoid an error. An implementation with an off-by-one budget test or a
          segregation test that compares roles instead of user ids fails here rather than on a
          negative case.
        test_recipe:
          setup:
            - "one Distributor, one Artist, one EXECUTED DISTRIBUTION_FEE deal with marketing_budget_cents 100000, one RELEASED release"
            - "one SUBMITTED MarketingSpend of 100000 DIGITAL_ADS requested by label-admin-01"
          setup_api_calls:
            - call: "POST /distributors"
              payload: { name: "Vector Digital", legal_entity: "Vector Digital LLC", default_returns_reserve_pct: 0.1000 }
              as: LabelAdmin
              as_user_id: "label-admin-01"
              captures: { dist_id: $.data.id }
            - call: "POST /artists"
              payload: { legal_name: "Nadia Frost", email: "nadia@example.com" }
              as: LabelAdmin
              as_user_id: "label-admin-01"
              captures: { artist_id: $.data.id }
            - call: "POST /distribution-deals"
              payload: { distributor_id: "${dist_id}", deal_type: "DISTRIBUTION_FEE", distribution_fee_pct: 0.1500, term_start_date: "2026-01-01", term_end_date: "2026-12-31", territory_codes: ["US"], cross_collateralized: true, advance_amount_cents: 0, marketing_budget_cents: 100000, objection_window_days: 30, post_term_collection_days: 90 }
              as: LabelAdmin
              as_user_id: "label-admin-01"
              captures: { deal_id: $.data.id }
            - call: "POST /releases"
              payload: { deal_id: "${deal_id}", primary_artist_id: "${artist_id}", upc: "099000000221", title: "Green Path", planned_release_date: "2026-02-01", formats: ["DIGITAL"], advance_share_cents: 0 }
              as: LabelAdmin
              as_user_id: "label-admin-01"
              captures: { rel1_id: $.data.id }
            - call: "POST /distribution-deals/${deal_id}/execute"
              payload: { advance_payment_reference: "WIRE-V1-0001" }
              as: LabelAdmin
              as_user_id: "label-admin-01"
            - call: "POST /releases/${rel1_id}/release"
              payload: { actual_release_date: "2026-02-01" }
              as: LabelAdmin
              as_user_id: "label-admin-01"
            - call: "POST /marketing-spends"
              payload: { release_id: "${rel1_id}", category: "DIGITAL_ADS", amount_cents: 100000, vendor: "Northlight Media" }
              as: LabelAdmin
              as_user_id: "label-admin-01"
              captures: { spend_id: $.data.id, spend_v0: $.data.version }
            - call: "POST /marketing-spends/${spend_id}/submit"
              payload: {}
              as: LabelAdmin
              as_user_id: "label-admin-01"
              captures: { spend_v1: $.data.version }
          trigger:
            - call: "POST /marketing-spends/${spend_id}/decide"
