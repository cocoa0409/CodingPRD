              payload: { expected_build_spec_version: "${spec_a_v}" }
              as: FittingSpecialist
              as_user_id: "${fs_id}"
            - call: "POST /golf-shop/build-specs/${spec_b}/quote"
              payload: { expected_build_spec_version: "${spec_b_v}" }
              as: FittingSpecialist
              as_user_id: "${fs_id}"
          trigger:
            - call: "POST /golf-shop/build-specs/${spec_a}/approve"
              payload: { payment_method: "EXTERNAL" }
              as: Customer
              as_user_id: "${c_id}"
            - call: "GET /golf-shop/component-items/${head_id}"
              as: ShopManager
              captures: { h1_on: $.data.stock_on_hand, h1_res: $.data.stock_reserved, h1_con: $.data.consumed_total }
