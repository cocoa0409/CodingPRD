        distinguishing_aspect: "Accessory bundles use ACCESSORY_COVERAGE_FEET_PER_BUNDLE=33 and ACCESSORY_PRICE_CENTS=4200; 66 lf -> 2 accessory bundles at 8400 cents."
        test_recipe:
          setup: ["product price 4800/bundle, bps 4.0"]
          setup_api_calls:
            - call: "POST /roofing/branches"
              payload: { branch_code: "BR-CA1", name: "Calc1", rooftop_delivery_capacity_per_day: 4, conveyor_fleet_size: 2, crane_available: true }
              as: PlatformAdmin
              captures: { br_ca1: $.data.id }
            - call: "POST /roofing/products"
              payload: { sku: "SH-CA1", manufacturer_name: "Acme", color_code: "RED", bundles_per_square: 4.0, base_price_per_bundle_cents: 4800 }
              as: PlatformAdmin
              captures: { prod_ca1: $.data.id }
            - call: "POST /roofing/contractor-accounts"
              payload: { company_name: "Calc Co", credit_limit_cents: 10000000, pricing_tier: "STANDARD" }
              as: CreditAnalyst
              captures: { ca_ca1: $.data.id }
            - call: "POST /roofing/contractor-accounts/${ca_ca1}/job-accounts"
              payload: { job_name: "Job CA1", site_address: "28 Oak St" }
              as: CreditAnalyst
              captures: { ja_ca1: $.data.id }
          trigger:
            - call: "POST /roofing/job-accounts/${ja_ca1}/takeoffs"
              payload: { product_id: "${prod_ca1}", roof_squares: 12.5, waste_factor_pct: 15, valley_ridge_linear_feet: 66  }
              as: SalesRep
              captures: { tk_ca1_est: $.data.estimated_bundles, tk_ca1_amt: $.data.estimated_amount_cents }
          assert:
            - "estimated_bundles == 60 (ceil(14.375*4.0)=58 shingles + ceil(66/33)=2 accessories)"
            - "estimated_amount_cents == 286800 (58*4800 + 2*4200)"

      - name: takeoff_quote_locks_estimate_against_price_change
