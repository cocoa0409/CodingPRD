            - call: "POST /bank/accounts/${acct_id}/freezes"
              payload: { start_at: "2026-05-04T00:00:00Z", end_at: "2026-05-10T00:00:00Z", reason: "court order" }
              as: ComplianceOfficer
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-06T00:00:00Z" }
              as: OperationsAdmin
          trigger:
            - call: "POST /bank/check-items"
              payload: { depositor_account_id: "${acct_id}", clearing_bank_id: "${cb_id}", item_reference: "ITM-FB", amount_cents: 5000, encoded_amount_cents: 5000, image_quality_score: 90, capture_channel: "ATM" }
              as: ItemProcessor
              captures: { err: $.data.error_id }
          assert:
            - "err == 'ERR_ACCOUNT_FROZEN'"

  - section: endpoints
    instances:
      - name: list_pagination_envelope
        claim_type: listing
        grounds: [response_envelope]
        distinguishing_aspect: "GET /bank/check-items with limit=2 over 3 items returns exactly 2 rows with total_count 3 and has_more true; offset=2 returns 1 row with has_more false."
        test_recipe:
          setup: ["one account with three deposited items"]
          setup_api_calls:
            - call: "POST /bank/clearing-banks"
              payload: { name: "CB PG", routing_number: "222000037" }
              as: OperationsAdmin
              captures: { cb_id: $.data.id }
            - call: "POST /bank/accounts"
              payload: { customer_name: "Yale", account_number: "A-2029" }
              as: OperationsAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /bank/check-items"
              payload: { depositor_account_id: "${acct_id}", clearing_bank_id: "${cb_id}", item_reference: "ITM-P1", amount_cents: 100, encoded_amount_cents: 100, image_quality_score: 90, capture_channel: "ATM" }
              as: ItemProcessor
            - call: "POST /bank/check-items"
              payload: { depositor_account_id: "${acct_id}", clearing_bank_id: "${cb_id}", item_reference: "ITM-P2", amount_cents: 200, encoded_amount_cents: 200, image_quality_score: 90, capture_channel: "ATM" }
              as: ItemProcessor
            - call: "POST /bank/check-items"
              payload: { depositor_account_id: "${acct_id}", clearing_bank_id: "${cb_id}", item_reference: "ITM-P3", amount_cents: 300, encoded_amount_cents: 300, image_quality_score: 90, capture_channel: "ATM" }
              as: ItemProcessor
          trigger:
            - call: "GET /bank/check-items"
              payload: { depositor_account_id: "${acct_id}", limit: 2, offset: 0 }
              as: OperationsAdmin
            - call: "GET /bank/check-items"
              payload: { depositor_account_id: "${acct_id}", limit: 2, offset: 2 }
              as: OperationsAdmin
          assert:
            - "first page data length == 2, total_count == 3, has_more == true"
            - "second page data length == 1, total_count == 3, has_more == false"
      - name: image_quality_case_created_at_present
        claim_type: side_effect_execution
        grounds: [state_machines.CheckItem.RECEIVED_to_PRESENTED, entities.AdjustmentCase.fields.case_type]
        distinguishing_aspect: "Present with image_quality_score 50 (< 60) auto-creates an IMAGE_WARRANTY case in OPEN; a clean item (score 90) creates no case at all."
        test_recipe:
          setup: ["two RECEIVED items, one with score 50 and one with score 90"]
          setup_api_calls:
            - call: "POST /bank/clearing-banks"
              payload: { name: "CB IQ", routing_number: "222000038" }
              as: OperationsAdmin
              captures: { cb_id: $.data.id }
            - call: "POST /bank/accounts"
              payload: { customer_name: "Zoe", account_number: "A-2030" }
              as: OperationsAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /bank/check-items"
              payload: { depositor_account_id: "${acct_id}", clearing_bank_id: "${cb_id}", item_reference: "ITM-IQ1", amount_cents: 5000, encoded_amount_cents: 5000, image_quality_score: 50, capture_channel: "MOBILE" }
              as: ItemProcessor
              captures: { it_bad: $.data.id }
            - call: "POST /bank/check-items"
              payload: { depositor_account_id: "${acct_id}", clearing_bank_id: "${cb_id}", item_reference: "ITM-IQ2", amount_cents: 5000, encoded_amount_cents: 5000, image_quality_score: 90, capture_channel: "MOBILE" }
              as: ItemProcessor
              captures: { it_good: $.data.id }
          trigger:
            - call: "POST /bank/check-items/${it_bad}/present"
              as: ItemProcessor
            - call: "POST /bank/check-items/${it_good}/present"
              as: ItemProcessor
            - call: "GET /bank/check-items/${it_bad}/adjustment-cases"
              as: OperationsAdmin
              captures: { bad_type: "$.data[0].case_type", bad_status: "$.data[0].status" }
            - call: "GET /bank/check-items/${it_good}/adjustment-cases"
              as: OperationsAdmin
          assert:
            - "bad_type == 'IMAGE_WARRANTY'"
            - "bad_status == 'OPEN'"
            - "the clean item's adjustment-cases list is empty"

