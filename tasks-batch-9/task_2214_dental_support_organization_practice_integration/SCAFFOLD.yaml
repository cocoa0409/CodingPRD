# =============================================================================
# PRD Benchmark Seed Tables — Dental Support Organization Practice Integration
# Difficulty band: beyond Expert (§0.4) — 15 entities, 67 endpoints, 10 state
# machines (cyclic + parallel-dimension + branching), 8 calculations with
# dual variants, 38 ordered validations, 2 OCC races.
# =============================================================================

scenario: |
  2214. Dental Support Organization Practice Integration (Heartland Dental support organization): affiliation transaction with earn-out and post-close doctor employment terms, non-clinical service agreement scope respecting corporate practice restrictions, practice management system conversion and chart migration with data validation, fee schedule and payer contract transition including credentialing lead times, supply and lab vendor consolidation with clinician preference exceptions, staffing model standardization and compensation harmonization, clinical quality review and treatment-planning oversight boundaries, doctor departure, patient records custody and non-compete enforcement

domain_name: dso-practice-integration
api_prefix: /dso

complexity_profile:
  primary_archetype: workflow_orchestration
  secondary_archetype: compliance_audit
  complexity_layers:
    - cascading_side_effects
    - dual_variant_calculation
    - optimistic_concurrency
    - derived_field_reconciliation
  entity_topology: flat
  # flat: every entity is addressed at its own top-level collection under
  # /dso/<collection>; parent linkage is expressed exclusively through FK body
  # fields (`FK -> <Parent>.id`), never through nested URL paths. Reverse
  # navigation is provided by filtered list endpoints and five sub-resource
  # readers. No endpoint nests two entity ids in its path.
  state_machine_shape: parallel
  # Affiliation is cyclic (DILIGENCE -> DRAFT repricing loop); DoctorEmployment
  # carries three independent state dimensions on one row (employment_status x
  # credentialing_status x records_custody_state); MigrationBatch is branching
  # (SCHEDULED -> {VALIDATED | QUARANTINED}) with a remediation cycle; Practice
  # posture is compound (derived from children) and gates all child operations.
  relationship_patterns:
    - one_to_many
    - cross_aggregate
    - polymorphic_free   # no polymorphic FKs: every FK names exactly one parent entity
  role_model: segregation_of_duties
  # DsoFinanceController reserves and settles earn-out tranches, but the settling
  # X-User-ID must differ from the reserving X-User-ID. Clinical determinations
  # (quality-review outcome, clinician preference exception) are reserved to
  # ClinicalDirector (a licensed Doctor) and are unavailable to every DSO
  # non-clinical role — the corporate-practice-of-dentistry boundary.
  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:

  - name: Affiliation
    parent: null
    common_fields: true
    fields:
      - { name: seller_group_name, type: string, source: input, description: "Legal name of the selling dental group" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "Deal lifecycle", constraints: "DRAFT | DILIGENCE | SIGNED | CLOSED" }
      - { name: purchase_price_cents, type: integer, source: input, description: "Cash-at-close consideration in cents", constraints: ">= 1" }
      - { name: earnout_pool_cents, type: integer, source: input, description: "Maximum aggregate earn-out consideration in cents", constraints: ">= 0" }
      - { name: earnout_reserved_cents, type: integer, source: computed, default: 0, description: "Sum of EarnoutTranche.reserved_cents over tranches of this affiliation whose status == RESERVED" }
      - { name: earnout_settled_cents, type: integer, source: computed, default: 0, description: "Sum of EarnoutTranche.awarded_cents over tranches of this affiliation whose status == SETTLED" }
      - { name: earnout_unallocated_cents, type: integer, source: computed, description: "= earnout_pool_cents - earnout_reserved_cents - earnout_settled_cents (conserved-quantity ledger, see calculations.earnout_pool_ledger)" }
      - { name: baseline_ebitda_cents, type: integer, source: input, description: "Pre-affiliation trailing-twelve-month adjusted EBITDA baseline in cents", constraints: ">= 1" }
      - { name: baseline_net_collections_cents, type: integer, source: input, description: "Pre-affiliation trailing-twelve-month net collections baseline in cents", constraints: ">= 1" }
      - { name: earnout_measurement_state, type: enum, source: system, default: NOT_OPEN, description: "NOT_OPEN until close; OPEN after close; SUSPENDED while any linked Practice.integration_posture == FROZEN", constraints: "NOT_OPEN | OPEN | SUSPENDED" }
      - { name: repricing_round, type: integer, source: system, default: 0, description: "Count of DILIGENCE -> DRAFT repricing loops consumed", constraints: "<= MAX_REPRICING_ROUNDS (2)" }
      - { name: post_close_doctor_term_months, type: integer, source: input, default: 36, description: "Deal-level default post-close employment term used when DoctorEmployment omits post_close_term_months" }
      - { name: practice_count, type: integer, source: computed, default: 0, description: "Count of Practice rows whose affiliation_id == this affiliation id" }
      - { name: diligence_opened_at, type: datetime, source: system, description: "Logical clock at DRAFT -> DILIGENCE; null before" }
      - { name: signed_date, type: datetime, source: system, description: "Logical clock at DILIGENCE -> SIGNED; null before" }
      - { name: close_date, type: datetime, source: system, description: "Logical clock at SIGNED -> CLOSED; null before" }

  - name: ConversionVendor
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Practice-management-system conversion vendor name" }
      - { name: max_concurrent_windows, type: integer, source: input, description: "Maximum MigrationBatch cutover windows this vendor may occupy at overlapping times", constraints: ">= 1" }
      - { name: active_window_count, type: integer, source: computed, default: 0, description: "Count of MigrationBatch rows with status == SCHEDULED whose practice's conversion_vendor_id == this vendor id" }

  - name: Practice
    parent: Affiliation
    common_fields: true
    fields:
      - { name: affiliation_id, type: string, source: input, description: "FK -> Affiliation.id; the deal that acquires this practice" }
      - { name: conversion_vendor_id, type: string, source: input, description: "FK -> ConversionVendor.id; vendor performing the PMS conversion" }
      - { name: name, type: string, source: input, description: "Practice trade name" }
      - { name: state_code, type: string, source: input, description: "Two-letter licensing jurisdiction of the practice", constraints: "exactly 2 uppercase letters" }
      - { name: charts_total_expected, type: integer, source: input, description: "Total patient charts expected to migrate from the legacy PMS", constraints: ">= 1" }
      - { name: affiliation_status, type: enum, source: system, default: PENDING, description: "PENDING until the affiliation closes, then AFFILIATED", constraints: "PENDING | AFFILIATED" }
      - { name: integration_posture, type: enum, source: computed, default: PRE_CLOSE, description: "Derived gate over all child operations; see calculations.practice_posture", constraints: "PRE_CLOSE | STABILIZING | RESTRICTED | INTEGRATED | FROZEN" }
      - { name: staffing_model_state, type: enum, source: system, default: LEGACY, description: "LEGACY until POST /dso/practices/{id}/standardize-staffing succeeds, then STANDARDIZED", constraints: "LEGACY | STANDARDIZED" }
      - { name: fte_hygiene_ratio_bps, type: integer, source: system, description: "Standardized hygienist-to-doctor FTE ratio in basis points; null until staffing standardization" }
      - { name: active_doctor_count, type: integer, source: computed, default: 0, description: "Count of DoctorEmployment rows of this practice whose employment_status == ACTIVE" }
      - { name: charts_migrated_count, type: integer, source: computed, default: 0, description: "Sum of MigrationBatch.records_validated over batches of this practice whose status IN {VALIDATED, RECONCILED} (conserved-quantity ledger, see calculations.chart_records_ledger)" }
      - { name: pending_credentialing_count, type: integer, source: computed, default: 0, description: "Count of PayerEnrollment rows reachable from this practice whose status == SUBMITTED" }
      - { name: denied_enrollment_count, type: integer, source: computed, default: 0, description: "Count of PayerEnrollment rows reachable from this practice whose status == DENIED" }
      - { name: quarantined_batch_count, type: integer, source: computed, default: 0, description: "Count of MigrationBatch rows of this practice whose status == QUARANTINED" }
      - { name: clinical_coverage_gap, type: boolean, source: computed, default: false, description: "= (active_doctor_count == 0 AND affiliation_status == AFFILIATED)" }

  - name: Doctor
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Licensed dentist full name" }
      - { name: npi, type: string, source: input, description: "National Provider Identifier, 10 digits" }
      - { name: license_number, type: string, source: input, description: "State dental license number" }
      - { name: license_state, type: string, source: input, description: "Two-letter jurisdiction of the dental license", constraints: "exactly 2 uppercase letters" }
      - { name: is_seller_owner, type: boolean, source: input, default: false, description: "True when this doctor is a selling owner of the target group" }
      - { name: specialty, type: enum, source: input, default: GENERAL, description: "Clinical specialty", constraints: "GENERAL | ENDODONTICS | ORTHODONTICS | ORAL_SURGERY | PERIODONTICS" }

  - name: DoctorEmployment
    parent: Practice
    common_fields: true
    fields:
      - { name: practice_id, type: string, source: input, description: "FK -> Practice.id; practice at which the doctor is employed post-close" }
      - { name: doctor_id, type: string, source: input, description: "FK -> Doctor.id; the licensed dentist" }
      - { name: employment_status, type: enum, source: system, default: OFFERED, description: "Dimension A of three independent state dimensions", constraints: "OFFERED | ACTIVE | LAPSED | SEPARATED" }
      - { name: credentialing_status, type: enum, source: computed, default: PENDING, description: "Dimension B, derived from this employment's PayerEnrollment rows; see calculations.credentialing_rollup", constraints: "PENDING | SUBMITTED | APPROVED | DENIED" }
      - { name: records_custody_state, type: enum, source: system, default: HELD_BY_PRACTICE, description: "Dimension C, patient-records custody of the charts this doctor authored", constraints: "HELD_BY_PRACTICE | TRANSFER_PENDING | TRANSFERRED" }
      - { name: non_compete_enforcement_state, type: enum, source: system, default: NOT_APPLICABLE, description: "NOT_APPLICABLE until separation, PENDING at separation, ENFORCED after POST enforce-non-compete", constraints: "NOT_APPLICABLE | PENDING | ENFORCED" }
      - { name: base_salary_monthly_cents, type: integer, source: input, description: "Guaranteed monthly base salary in cents", constraints: ">= 0" }
      - { name: collections_pct_bps, type: integer, source: input, description: "Doctor share of own net collections in basis points", constraints: "0 <= value <= 5000" }
      - { name: comp_model, type: enum, source: input, default: MONTHLY_MIN_GUARANTEE, description: "Contractual compensation variant chosen in the employment offer; selects the calculations.doctor_compensation variant at harmonization", constraints: "MONTHLY_MIN_GUARANTEE | ANNUAL_TRUE_UP" }
      - { name: legacy_annual_comp_cents, type: integer, source: input, description: "Pre-affiliation annual compensation in cents, used for the harmonization delta" }
      - { name: harmonized_annual_comp_cents, type: integer, source: computed, description: "Output of calculations.doctor_compensation; null until harmonized" }
      - { name: harmonization_delta_cents, type: integer, source: computed, description: "= harmonized_annual_comp_cents - legacy_annual_comp_cents; null until harmonized" }
      - { name: is_harmonized, type: boolean, source: system, default: false, description: "True once compensation harmonization has been applied" }
      - { name: post_close_term_months, type: integer, source: input, description: "Post-close employment term in months; defaults to the affiliation's post_close_doctor_term_months" }
      - { name: non_compete_months, type: integer, source: input, description: "Restrictive-covenant duration in months", constraints: "0 <= value <= MAX_NON_COMPETE_MONTHS (24)" }
      - { name: non_compete_radius_miles, type: integer, source: input, description: "Restrictive-covenant radius in miles", constraints: "0 <= value <= MAX_NON_COMPETE_RADIUS_MILES (15)" }
      - { name: non_compete_end_date, type: datetime, source: computed, description: "= separation_date + non_compete_months calendar months; null before separation" }
      - { name: offer_accepted, type: boolean, source: system, default: false, description: "True once the doctor accepts the post-close employment offer" }
      - { name: comp_effective_date, type: datetime, source: system, description: "Date the post-close compensation terms take effect; null until ACTIVE" }
      - { name: separation_date, type: datetime, source: system, description: "Logical clock at ACTIVE -> SEPARATED; null before" }
      - { name: separation_reason, type: enum, source: system, description: "Reason recorded at separation; null before", constraints: "VOLUNTARY | TERMINATED_FOR_CAUSE | NON_RENEWAL" }

  - name: ServiceAgreement
    parent: Practice
    common_fields: true
    fields:
      - { name: practice_id, type: string, source: input, description: "FK -> Practice.id; practice receiving non-clinical support services" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "DRAFT -> LEGAL_REVIEW -> EFFECTIVE with a LEGAL_REVIEW -> DRAFT scope-rejection loop", constraints: "DRAFT | LEGAL_REVIEW | EFFECTIVE" }
      - { name: fee_model, type: enum, source: input, description: "Management fee structure", constraints: "PCT_OF_COLLECTIONS | FIXED_MONTHLY" }
      - { name: mgmt_fee_bps, type: integer, source: input, description: "Management fee in basis points of net collections", constraints: "0 <= value; capped at MAX_MGMT_FEE_BPS (2000) when made effective" }
      - { name: scope_findings_count, type: integer, source: system, default: 0, description: "Cumulative count of clinical-scope findings raised by legal review rejections" }
      - { name: review_round, type: integer, source: system, default: 0, description: "Count of DRAFT -> LEGAL_REVIEW submissions" }
      - { name: line_item_count, type: integer, source: computed, default: 0, description: "Count of ServiceLineItem rows whose service_agreement_id == this agreement id" }
      - { name: effective_date, type: datetime, source: system, description: "Logical clock at LEGAL_REVIEW -> EFFECTIVE; null before" }

  - name: ServiceLineItem
    parent: ServiceAgreement
    common_fields: false
    fields:
      - { name: service_agreement_id, type: string, source: input, description: "FK -> ServiceAgreement.id; agreement this scope line belongs to" }
      - { name: service_code, type: string, source: input, description: "Support-service catalogue code" }
      - { name: service_domain, type: enum, source: input, description: "Functional domain of the service", constraints: "BILLING | HR | PROCUREMENT | IT | MARKETING | FACILITIES | CREDENTIALING | TREATMENT_PLANNING | CLINICAL_SUPERVISION | DIAGNOSIS" }
      - { name: is_clinical, type: boolean, source: computed, description: "= service_domain IN CLINICAL_DOMAINS {TREATMENT_PLANNING, CLINICAL_SUPERVISION, DIAGNOSIS}" }
      - { name: monthly_fee_cents, type: integer, source: input, description: "Monthly fee attributed to this scope line in cents", constraints: ">= 0" }

  - name: MigrationBatch
    parent: Practice
    common_fields: true
    fields:
      - { name: practice_id, type: string, source: input, description: "FK -> Practice.id; practice whose charts this batch migrates" }
      - { name: batch_label, type: string, source: input, description: "Human label for the chart batch" }
      - { name: records_total, type: integer, source: input, description: "Chart records staged in this batch", constraints: ">= 1" }
      - { name: records_validated, type: integer, source: computed, default: 0, description: "Records that passed validation; see calculations.chart_migration_validation" }
      - { name: records_quarantined, type: integer, source: computed, default: 0, description: "Records held back by validation" }
      - { name: records_pending, type: integer, source: computed, description: "= records_total - records_validated - records_quarantined" }
      - { name: status, type: enum, source: system, default: STAGED, description: "STAGED -> SCHEDULED -> {VALIDATED | QUARANTINED}; VALIDATED -> RECONCILED; QUARANTINED -> SCHEDULED (remediate); SCHEDULED -> HELD (posture freeze); STAGED -> SUPERSEDED (OCC supersede)", constraints: "STAGED | SCHEDULED | VALIDATED | QUARANTINED | RECONCILED | HELD | SUPERSEDED" }
      - { name: cutover_start_at, type: datetime, source: system, description: "Start of the reserved conversion cutover window; null until scheduled" }
      - { name: cutover_end_at, type: datetime, source: system, description: "End of the reserved conversion cutover window; null until scheduled" }
      - { name: validation_error_rate_bps, type: integer, source: computed, description: "= round_half_up(records_quarantined * 10000 / records_total) at the last validation; null before" }
      - { name: remediation_round, type: integer, source: system, default: 0, description: "Count of QUARANTINED -> SCHEDULED remediation loops consumed" }

  - name: PayerContract
    parent: Practice
    common_fields: true
    fields:
      - { name: practice_id, type: string, source: input, description: "FK -> Practice.id; practice party to the payer contract" }
      - { name: payer_name, type: string, source: input, description: "Dental plan / payer name" }
      - { name: transition_state, type: enum, source: system, default: LEGACY, description: "LEGACY -> PENDING_CREDENTIALING (first enrollment opened) -> DSO_SCHEDULE_ACTIVE", constraints: "LEGACY | PENDING_CREDENTIALING | DSO_SCHEDULE_ACTIVE" }
      - { name: dso_schedule_effective_date, type: datetime, source: input, description: "Date the DSO fee schedule is contracted to take effect" }
      - { name: blended_impact_cents, type: integer, source: computed, description: "Output of calculations.fee_schedule_blended_impact; null until at least one fee schedule item exists" }
      - { name: fee_schedule_item_count, type: integer, source: computed, default: 0, description: "Count of FeeScheduleItem rows whose payer_contract_id == this contract id" }
      - { name: enrollment_open_count, type: integer, source: computed, default: 0, description: "Count of PayerEnrollment rows of this contract whose status IN {NOT_STARTED, SUBMITTED}" }
      - { name: erosion_override_ack, type: boolean, source: system, default: false, description: "True once a material fee-erosion acknowledgement was accepted at fee-schedule activation" }

  - name: FeeScheduleItem
    parent: PayerContract
    common_fields: false
    fields:
      - { name: payer_contract_id, type: string, source: input, description: "FK -> PayerContract.id; contract whose schedule this line belongs to" }
      - { name: procedure_code, type: string, source: input, description: "CDT procedure code" }
      - { name: legacy_allowed_cents, type: integer, source: input, description: "Allowed amount under the seller's legacy schedule", constraints: ">= 0" }
      - { name: dso_allowed_cents, type: integer, source: input, description: "Allowed amount under the DSO master schedule", constraints: ">= 0" }
      - { name: annual_volume, type: integer, source: input, description: "Annualized procedure volume for this code at the practice", constraints: ">= 0" }
      - { name: line_impact_cents, type: integer, source: computed, description: "= round_half_up((dso_allowed_cents - legacy_allowed_cents) * annual_volume * BLEND_FACTOR_BPS / 10000), rounded per line before summation" }

  - name: PayerEnrollment
    parent: PayerContract
    common_fields: true
    fields:
      - { name: payer_contract_id, type: string, source: input, description: "FK -> PayerContract.id; contract the provider is being credentialed under" }
      - { name: doctor_employment_id, type: string, source: input, description: "FK -> DoctorEmployment.id; employment whose provider is credentialed" }
      - { name: status, type: enum, source: system, default: NOT_STARTED, description: "NOT_STARTED -> SUBMITTED -> {APPROVED | DENIED}; DENIED -> SUBMITTED (resubmit); SUBMITTED -> SUSPENDED (posture freeze)", constraints: "NOT_STARTED | SUBMITTED | APPROVED | DENIED | SUSPENDED" }
      - { name: effective_date, type: datetime, source: input, description: "Requested participation start date (half-open interval start)" }
      - { name: term_date, type: datetime, source: input, description: "Participation end date, exclusive; null means open-ended and is compared as 9999-12-31T00:00:00Z" }
      - { name: submitted_at, type: datetime, source: system, description: "Logical clock at the most recent submission; null before" }
      - { name: decided_at, type: datetime, source: system, description: "Logical clock at APPROVED or DENIED; null before" }
      - { name: lead_days, type: integer, source: computed, description: "= whole days from submitted_at date to effective_date date; null before submission" }
      - { name: denial_reason, type: string, source: system, description: "Free-text reason recorded at DENIED; null otherwise" }
      - { name: submission_round, type: integer, source: system, default: 0, description: "Count of submissions including resubmissions after denial" }

  - name: EarnoutTranche
    parent: Affiliation
    common_fields: true
    fields:
      - { name: affiliation_id, type: string, source: input, description: "FK -> Affiliation.id; deal whose earn-out pool funds this tranche" }
      - { name: period_label, type: string, source: input, description: "Measurement period label, e.g. EY1" }
      - { name: measurement_start, type: datetime, source: input, description: "Inclusive first instant of the measurement period" }
      - { name: measurement_end, type: datetime, source: input, description: "Inclusive last instant of the measurement period" }
      - { name: status, type: enum, source: system, default: PROJECTED, description: "PROJECTED -> RESERVED -> SETTLED -> CLAWED_BACK", constraints: "PROJECTED | RESERVED | SETTLED | CLAWED_BACK" }
      - { name: variant_applied, type: enum, source: computed, description: "PROVISIONAL at reserve, FINAL at settle; null while PROJECTED", constraints: "PROVISIONAL | FINAL" }
      - { name: reported_net_collections_cents, type: integer, source: system, description: "Partial-period net collections supplied at reserve; null before" }
      - { name: reported_expenses_cents, type: integer, source: system, description: "Partial-period operating expenses supplied at reserve; null before" }
      - { name: annualized_net_collections_cents, type: integer, source: computed, description: "PROVISIONAL step 0 output; null before reserve" }
      - { name: annualized_expenses_cents, type: integer, source: computed, description: "PROVISIONAL step 0 output; null before reserve" }
      - { name: final_net_collections_cents, type: integer, source: system, description: "Full-period net collections supplied at settle; null before" }
      - { name: final_expenses_cents, type: integer, source: system, description: "Full-period operating expenses supplied at settle; null before" }
      - { name: lag_holdback_cents, type: integer, source: computed, description: "FINAL-only collections-lag holdback; null before settle" }
      - { name: management_fee_cents, type: integer, source: computed, description: "Step 3 output of calculations.earnout_payout for the most recent evaluation" }
      - { name: adjusted_ebitda_cents, type: integer, source: computed, description: "Step 4 output of calculations.earnout_payout for the most recent evaluation" }
      - { name: growth_bps, type: integer, source: computed, description: "Step 5 output: EBITDA growth over the affiliation baseline in basis points" }
      - { name: multiple_bps, type: integer, source: computed, description: "Step 6 output: earn-out multiple in basis points selected by the growth tier" }
      - { name: reserved_cents, type: integer, source: computed, default: 0, description: "Pool amount held for this tranche while status == RESERVED; 0 otherwise" }
      - { name: awarded_cents, type: integer, source: computed, default: 0, description: "Pool amount awarded while status == SETTLED; 0 otherwise" }
      - { name: clawed_back_cents, type: integer, source: computed, default: 0, description: "Amount returned to the pool when status == CLAWED_BACK; 0 otherwise" }
      - { name: reserved_by_user_id, type: string, source: system, description: "X-User-ID that reserved the tranche; null before" }
      - { name: settled_by_user_id, type: string, source: system, description: "X-User-ID that settled the tranche; null before" }

  - name: SupplyPreferenceException
    parent: DoctorEmployment
    common_fields: true
    fields:
      - { name: doctor_employment_id, type: string, source: input, description: "FK -> DoctorEmployment.id; employment of the requesting clinician" }
      - { name: vendor_category, type: enum, source: input, description: "Consolidation programme the exception applies to", constraints: "SUPPLY | LAB" }
      - { name: item_code, type: string, source: input, description: "Formulary item or lab service code" }
      - { name: annual_qty, type: integer, source: input, description: "Annual quantity of the preferred item", constraints: ">= 1" }
      - { name: formulary_unit_cents, type: integer, source: input, description: "Consolidated-vendor unit price in cents", constraints: ">= 0" }
      - { name: preferred_unit_cents, type: integer, source: input, description: "Clinician-preferred item unit price in cents", constraints: ">= 0" }
      - { name: clinical_rationale, type: string, source: input, description: "Clinician justification for departing from the formulary" }
      - { name: status, type: enum, source: system, default: REQUESTED, description: "REQUESTED -> {APPROVED | DENIED}", constraints: "REQUESTED | APPROVED | DENIED" }
      - { name: incremental_cost_cents, type: integer, source: computed, description: "= round_half_up((preferred_unit_cents - formulary_unit_cents) * annual_qty), stamped at APPROVED; null otherwise" }
      - { name: decided_by_doctor_id, type: string, source: system, description: "Doctor id of the ClinicalDirector who decided the request; null before" }

  - name: VendorConsolidation
    parent: Practice
    common_fields: true
    fields:
      - { name: practice_id, type: string, source: input, description: "FK -> Practice.id; practice being converted to the DSO formulary" }
      - { name: vendor_category, type: enum, source: input, description: "Programme scope", constraints: "SUPPLY | LAB" }
      - { name: baseline_annual_spend_cents, type: integer, source: input, description: "Legacy annual spend with incumbent vendors in cents", constraints: ">= 0" }
      - { name: formulary_annual_spend_cents, type: integer, source: input, description: "Modelled annual spend on the DSO formulary in cents", constraints: ">= 0" }
      - { name: status, type: enum, source: system, default: PLANNED, description: "PLANNED -> FINALIZED", constraints: "PLANNED | FINALIZED" }
      - { name: gross_savings_cents, type: integer, source: computed, description: "Realization-adjusted gross savings; null until finalized" }
      - { name: exception_leakage_cents, type: integer, source: computed, description: "Approved clinician-preference leakage; null until finalized" }
      - { name: projected_savings_cents, type: integer, source: computed, description: "= max(0, gross_savings_cents - exception_leakage_cents); null until finalized" }
      - { name: exception_count_applied, type: integer, source: computed, description: "Count of APPROVED SupplyPreferenceException rows folded into leakage; null until finalized" }

  - name: ClinicalQualityReview
    parent: DoctorEmployment
    common_fields: true
    fields:
      - { name: doctor_employment_id, type: string, source: input, description: "FK -> DoctorEmployment.id; employment under clinical review" }
      - { name: period_label, type: string, source: input, description: "Review period label, e.g. 2027Q1" }
      - { name: charts_sampled, type: integer, source: input, description: "Charts pulled for the retrospective sample", constraints: ">= MIN_CHARTS_SAMPLED (20)" }
      - { name: charts_with_findings, type: integer, source: input, description: "Sampled charts with documentation or diagnostic findings", constraints: "0 <= value <= charts_sampled" }
      - { name: treatment_plan_overrides, type: integer, source: input, description: "Sampled charts where the treatment plan was altered outside the treating clinician's judgement", constraints: "0 <= value <= charts_sampled" }
      - { name: status, type: enum, source: system, default: OPEN, description: "OPEN -> {CLOSED_NO_FINDINGS | CLOSED_WITH_PLAN | ESCALATED}", constraints: "OPEN | CLOSED_NO_FINDINGS | CLOSED_WITH_PLAN | ESCALATED" }
      - { name: finding_rate_bps, type: integer, source: computed, description: "= round_half_up(charts_with_findings * 10000 / charts_sampled)" }
      - { name: override_rate_bps, type: integer, source: computed, description: "= round_half_up(treatment_plan_overrides * 10000 / charts_sampled)" }
      - { name: score_bps, type: integer, source: computed, description: "Weighted quality score; see calculations.clinical_quality_score" }
      - { name: closed_by_doctor_id, type: string, source: system, description: "Doctor id of the ClinicalDirector who closed the review; null while OPEN" }
      - { name: outcome_note, type: string, source: system, description: "Clinical narrative recorded at close; null while OPEN" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:

  # --- Affiliation: cyclic (DILIGENCE -> DRAFT repricing loop) ----------------
  - entity: Affiliation
    initial_state: DRAFT
    terminal_states: [CLOSED]
    transitions:
      - from: DRAFT
        to: DILIGENCE
        trigger: "POST /dso/affiliations/{id}/advance-diligence"
        actor: DsoDealCounsel
        preconditions:
          - "affiliation.status == DRAFT"
          - "affiliation.practice_count >= 1 else ERR_NO_TARGET_PRACTICE"
        side_effects:
          - "sets diligence_opened_at = logical clock"
          - "increments Affiliation.version by 1"
      - from: DILIGENCE
        to: DRAFT
        trigger: "POST /dso/affiliations/{id}/reprice"
        actor: DsoDealCounsel
        preconditions:
          - "affiliation.status == DILIGENCE"
          - "affiliation.repricing_round < MAX_REPRICING_ROUNDS (2) else ERR_REPRICING_LIMIT_REACHED"
          - "count(EarnoutTranche where affiliation_id == affiliation.id) == 0 else ERR_EARNOUT_POOL_LOCKED"
        side_effects:
          - "sets purchase_price_cents and earnout_pool_cents from the request body"
          - "recomputes earnout_unallocated_cents via calculations.earnout_pool_ledger"
          - "increments repricing_round by 1"
          - "increments Affiliation.version by 1"
        note: "Repricing round is the cycle edge; it is the only path back from DILIGENCE to DRAFT."
      - from: DILIGENCE
        to: SIGNED
        trigger: "POST /dso/affiliations/{id}/sign"
        actor: DsoDealCounsel
        preconditions:
          - "affiliation.status == DILIGENCE"
          - "every Practice with affiliation_id == affiliation.id has count(DoctorEmployment where practice_id == practice.id AND employment_status == OFFERED) >= 1 else ERR_NO_POST_CLOSE_EMPLOYMENT"
        side_effects:
          - "sets signed_date = logical clock"
          - "increments Affiliation.version by 1"
      - from: SIGNED
        to: CLOSED
        trigger: "POST /dso/affiliations/{id}/close"
        actor: DsoIntegrationLead
        preconditions:
          - "affiliation.status == SIGNED"
          - "every Practice with affiliation_id == affiliation.id has >= 1 ServiceAgreement with status == EFFECTIVE else ERR_SERVICE_AGREEMENT_NOT_EFFECTIVE"
        side_effects:
          - "CASCADE HOP 1: sets close_date = logical clock, earnout_measurement_state = OPEN, increments Affiliation.version by 1"
          - "CASCADE HOP 2 (caused by hop 1): every Practice with affiliation_id == affiliation.id gets affiliation_status = AFFILIATED, integration_posture recomputed by calculations.practice_posture (PRE_CLOSE -> STABILIZING), Practice.version incremented by 1"
          - "CASCADE HOP 3 (caused by hop 2's posture change leaving PRE_CLOSE): for each such Practice, every DoctorEmployment with employment_status == OFFERED AND offer_accepted == true moves to ACTIVE, comp_effective_date = affiliation.close_date, and Practice.active_doctor_count increases by 1; every DoctorEmployment with employment_status == OFFERED AND offer_accepted == false moves to LAPSED"
          - "CASCADE HOP 4 (caused by hop 3's OFFERED -> ACTIVE): for each newly ACTIVE DoctorEmployment, one PayerEnrollment row is created with status NOT_STARTED, effective_date = affiliation.close_date + CREDENTIALING_LEAD_DAYS (90) days and term_date = null, for every PayerContract of that employment's practice whose transition_state == LEGACY, processed in PayerContract.created_at ASC order"
          - "CASCADE HOP 5 (caused by hop 4's enrollment creation): every PayerContract whose enrollment_open_count moves from 0 to a positive value transitions transition_state LEGACY -> PENDING_CREDENTIALING and increments PayerContract.version by 1"
        note: "Five-hop transitive cascade; each hop is caused by the state change written by the previous hop, not by the close call itself."

  # --- Practice: compound / posture-driven gate ------------------------------
  - entity: Practice
    initial_state: PRE_CLOSE
    terminal_states: []
    transitions:
      - from: PRE_CLOSE
        to: STABILIZING
        trigger: "system recompute of calculations.practice_posture after Affiliation SIGNED -> CLOSED sets affiliation_status = AFFILIATED"
        actor: system
        preconditions:
          - "practice.affiliation_status == AFFILIATED"
          - "practice.active_doctor_count >= 1 after the close cascade activates accepted offers"
          - "practice.quarantined_batch_count == 0 AND practice.denied_enrollment_count == 0"
        side_effects:
          - "unblocks child operations gated on integration_posture IN {STABILIZING, INTEGRATED}"
          - "increments Practice.version by 1"
      - from: STABILIZING
        to: RESTRICTED
        trigger: "system recompute after MigrationBatch -> QUARANTINED or PayerEnrollment -> DENIED"
        actor: system
        preconditions:
          - "practice.quarantined_batch_count > 0 OR practice.denied_enrollment_count > 0"
          - "practice.active_doctor_count >= 1"
        side_effects:
          - "blocks POST schedule-cutover, activate-fee-schedule, harmonize-compensation and standardize-staffing with ERR_PRACTICE_POSTURE_BLOCKED"
          - "increments Practice.version by 1"
      - from: RESTRICTED
        to: STABILIZING
        trigger: "system recompute after MigrationBatch QUARANTINED -> SCHEDULED (remediation) or PayerEnrollment DENIED -> SUBMITTED (resubmission) clears the last blocker"
        actor: system
        preconditions:
          - "practice.quarantined_batch_count == 0 AND practice.denied_enrollment_count == 0"
          - "practice.active_doctor_count >= 1"
          - "practice.charts_migrated_count < practice.charts_total_expected"
        side_effects:
          - "re-enables the blocked child operations"
          - "increments Practice.version by 1"
      - from: STABILIZING
        to: INTEGRATED
        trigger: "system recompute after MigrationBatch validation raises charts_migrated_count to charts_total_expected with no open credentialing"
        actor: system
        preconditions:
          - "practice.charts_migrated_count >= practice.charts_total_expected"
          - "practice.pending_credentialing_count == 0 AND practice.denied_enrollment_count == 0 AND practice.quarantined_batch_count == 0"
          - "practice.active_doctor_count >= 1"
        side_effects:
          - "increments Practice.version by 1"
      - from: STABILIZING
        to: FROZEN
        trigger: "system recompute after DoctorEmployment ACTIVE -> SEPARATED drops active_doctor_count to 0"
        actor: system
        preconditions:
          - "practice.affiliation_status == AFFILIATED"
          - "practice.active_doctor_count == 0"
        side_effects:
          - "sets clinical_coverage_gap = true"
          - "CASCADE: every MigrationBatch of this practice with status == SCHEDULED moves to HELD; every PayerEnrollment of this practice with status == SUBMITTED moves to SUSPENDED"
          - "sets Affiliation.earnout_measurement_state = SUSPENDED for the parent affiliation"
          - "increments Practice.version by 1"
        note: "FROZEN also reachable from RESTRICTED and INTEGRATED under the same predicate; active_doctor_count == 0 dominates every other posture predicate."
      - from: FROZEN
        to: STABILIZING
        trigger: "system recompute after POST /dso/doctor-employments/{id}/accept-offer activates a replacement doctor post-close"
        actor: system
        preconditions:
          - "practice.active_doctor_count >= 1"
          - "practice.quarantined_batch_count == 0 AND practice.denied_enrollment_count == 0"
        side_effects:
          - "sets clinical_coverage_gap = false"
          - "CASCADE: every MigrationBatch of this practice with status == HELD returns to SCHEDULED; every PayerEnrollment of this practice with status == SUSPENDED returns to SUBMITTED"
          - "sets Affiliation.earnout_measurement_state = OPEN when no other Practice of the affiliation is FROZEN"
          - "increments Practice.version by 1"

  # --- DoctorEmployment: three independent state dimensions on one row -------
  - entity: DoctorEmployment
    initial_state: OFFERED
    terminal_states: [LAPSED, SEPARATED]
    transitions:
      - from: OFFERED
        to: OFFERED
        trigger: "POST /dso/doctor-employments/{id}/accept-offer while affiliation.status == SIGNED"
        actor: Dentist
        preconditions:
          - "employment.employment_status == OFFERED"
          - "employment.offer_accepted == false else ERR_INVALID_EMPLOYMENT_STATE"
          - "Affiliation[Practice[employment.practice_id].affiliation_id].status == SIGNED"
        side_effects:
          - "sets offer_accepted = true (dimension A unchanged; activation is deferred to the close cascade)"
          - "increments DoctorEmployment.version by 1"
        note: "Pre-close acceptance branch of the accept-offer fork."
      - from: OFFERED
        to: ACTIVE
        trigger: "POST /dso/doctor-employments/{id}/accept-offer while affiliation.status == CLOSED"
        actor: Dentist
        preconditions:
          - "employment.employment_status == OFFERED"
          - "employment.offer_accepted == false else ERR_INVALID_EMPLOYMENT_STATE"
          - "Affiliation[Practice[employment.practice_id].affiliation_id].status == CLOSED"
        side_effects:
          - "sets offer_accepted = true, comp_effective_date = logical clock"
          - "increments Practice.active_doctor_count by 1 and recomputes calculations.practice_posture (may release FROZEN)"
          - "increments DoctorEmployment.version by 1 and Practice.version by 1"
        note: "Post-close hire branch of the same endpoint, with a divergent side-effect set from the pre-close branch."
      - from: OFFERED
        to: ACTIVE
        trigger: "system, CASCADE HOP 3 of Affiliation SIGNED -> CLOSED"
        actor: system
        preconditions:
          - "employment.offer_accepted == true"
          - "Practice.integration_posture left PRE_CLOSE in the same cascade"
        side_effects:
          - "sets comp_effective_date = affiliation.close_date"
          - "increments Practice.active_doctor_count by 1"
          - "increments DoctorEmployment.version by 1"
      - from: OFFERED
        to: LAPSED
        trigger: "system, CASCADE HOP 3 of Affiliation SIGNED -> CLOSED"
        actor: system
        preconditions:
          - "employment.offer_accepted == false at the moment the close cascade runs"
        side_effects:
          - "no change to Practice.active_doctor_count"
          - "increments DoctorEmployment.version by 1"
      - from: ACTIVE
        to: SEPARATED
        trigger: "POST /dso/doctor-employments/{id}/separate"
        actor: DsoIntegrationLead | Dentist
        preconditions:
          - "employment.employment_status == ACTIVE else ERR_INVALID_EMPLOYMENT_STATE"
        side_effects:
          - "CASCADE HOP 1: sets separation_date = logical clock, separation_reason from body, non_compete_end_date = separation_date + non_compete_months calendar months, records_custody_state = TRANSFER_PENDING (dimension C), non_compete_enforcement_state = PENDING, and decreases Practice.active_doctor_count by 1"
          - "CASCADE HOP 2 (caused by hop 1's counter change): when Practice.active_doctor_count reaches 0, calculations.practice_posture returns FROZEN, Practice.clinical_coverage_gap = true and Practice.version increments by 1"
          - "CASCADE HOP 3 (caused by hop 2's posture change): every MigrationBatch of the practice with status == SCHEDULED moves to HELD and every PayerEnrollment of the practice with status == SUBMITTED moves to SUSPENDED"
          - "CASCADE HOP 4 (caused by hop 3): each HELD batch leaves ConversionVendor.active_window_count (vendor of the practice) reduced by 1; each SUSPENDED enrollment reduces Practice.pending_credentialing_count by 1 and PayerContract.enrollment_open_count by 1"
          - "CASCADE HOP 5 (caused by hop 4): every PayerContract whose enrollment_open_count reaches 0 while transition_state == PENDING_CREDENTIALING reverts transition_state to LEGACY"
          - "sets Affiliation.earnout_measurement_state = SUSPENDED"
        note: "Second five-hop transitive cascade, originating from a different transition than the close cascade."
      - from: SEPARATED
        to: SEPARATED
        trigger: "POST /dso/doctor-employments/{id}/records-custody-transfer (dimension C only)"
        actor: ClinicalDirector
        preconditions:
          - "employment.employment_status == SEPARATED else ERR_INVALID_EMPLOYMENT_STATE"
          - "employment.records_custody_state == TRANSFER_PENDING else ERR_INVALID_EMPLOYMENT_STATE"
        side_effects:
          - "sets records_custody_state = TRANSFERRED (dimension C advances while dimension A stays SEPARATED)"
          - "increments DoctorEmployment.version by 1"
      - from: SEPARATED
        to: SEPARATED
        trigger: "POST /dso/doctor-employments/{id}/enforce-non-compete (restrictive-covenant dimension only)"
        actor: DsoDealCounsel
        preconditions:
          - "employment.employment_status == SEPARATED else ERR_INVALID_EMPLOYMENT_STATE"
          - "employment.non_compete_enforcement_state == PENDING else ERR_INVALID_EMPLOYMENT_STATE"
          - "logical clock < employment.non_compete_end_date else ERR_NON_COMPETE_EXPIRED"
        side_effects:
          - "sets non_compete_enforcement_state = ENFORCED"
          - "increments DoctorEmployment.version by 1"
      - from: ANY
        to: SAME
        trigger: "system recompute of calculations.credentialing_rollup after any PayerEnrollment of this employment changes status (dimension B only)"
        actor: system
        preconditions:
          - "at least one PayerEnrollment references this employment"
        side_effects:
          - "sets credentialing_status to PENDING | SUBMITTED | APPROVED | DENIED per calculations.credentialing_rollup, independently of employment_status and records_custody_state"
          - "increments DoctorEmployment.version by 1"

  # --- ServiceAgreement: revision loop through LEGAL_REVIEW -----------------
  - entity: ServiceAgreement
    initial_state: DRAFT
    terminal_states: [EFFECTIVE]
    transitions:
      - from: DRAFT
        to: LEGAL_REVIEW
        trigger: "POST /dso/service-agreements/{id}/submit-legal-review"
        actor: DsoDealCounsel
        preconditions:
          - "agreement.status == DRAFT else ERR_INVALID_AGREEMENT_STATE"
          - "agreement.line_item_count >= 1 else ERR_SERVICE_SCOPE_EMPTY"
        side_effects:
          - "increments review_round by 1"
          - "increments ServiceAgreement.version by 1"
      - from: LEGAL_REVIEW
        to: DRAFT
        trigger: "POST /dso/service-agreements/{id}/reject-scope"
        actor: DsoDealCounsel
        preconditions:
          - "agreement.status == LEGAL_REVIEW else ERR_INVALID_AGREEMENT_STATE"
        side_effects:
          - "increments scope_findings_count by the request body finding_count"
          - "increments ServiceAgreement.version by 1"
        note: "Revision loop edge; the agreement may be resubmitted any number of times."
      - from: LEGAL_REVIEW
        to: EFFECTIVE
        trigger: "POST /dso/service-agreements/{id}/make-effective"
        actor: DsoDealCounsel
        preconditions:
          - "agreement.status == LEGAL_REVIEW else ERR_INVALID_AGREEMENT_STATE"
          - "agreement.mgmt_fee_bps <= MAX_MGMT_FEE_BPS (2000) else ERR_MGMT_FEE_CAP_EXCEEDED"
          - "Affiliation[Practice[agreement.practice_id].affiliation_id].status IN {SIGNED, CLOSED} else ERR_INVALID_AFFILIATION_STATE"
        side_effects:
          - "sets effective_date = logical clock"
          - "unblocks Affiliation SIGNED -> CLOSED for this practice and MigrationBatch cutover scheduling"
          - "increments ServiceAgreement.version by 1"

  # --- MigrationBatch: branching validation with remediation cycle ----------
  - entity: MigrationBatch
    initial_state: STAGED
    terminal_states: [RECONCILED, SUPERSEDED]
    transitions:
      - from: STAGED
        to: SUPERSEDED
        trigger: "system, on a successful POST /dso/migration-batches for the same practice"
        actor: system
        preconditions:
          - "an earlier MigrationBatch of the same practice is in status STAGED"
        side_effects:
          - "sets status = SUPERSEDED on every earlier STAGED batch of that practice, in created_at ASC order"
          - "increments MigrationBatch.version by 1 on each superseded batch"
      - from: STAGED
        to: SCHEDULED
        trigger: "POST /dso/migration-batches/{id}/schedule-cutover"
        actor: DsoIntegrationLead
        preconditions:
          - "batch.status IN {STAGED, QUARANTINED} else ERR_INVALID_BATCH_STATE"
          - "Practice[batch.practice_id].affiliation_status == AFFILIATED else ERR_PRACTICE_NOT_AFFILIATED"
          - "Practice[batch.practice_id].integration_posture IN {STABILIZING, INTEGRATED} else ERR_PRACTICE_POSTURE_BLOCKED"
          - "the practice has >= 1 ServiceAgreement with status == EFFECTIVE else ERR_SERVICE_AGREEMENT_NOT_EFFECTIVE"
          - "no other MigrationBatch of the SAME practice with status IN {SCHEDULED, HELD} violates the 48-hour buffer rule of validations[priority=31] else ERR_CUTOVER_WINDOW_CONFLICT"
          - "count of MigrationBatch rows with status IN {SCHEDULED, HELD} on the same ConversionVendor whose closed window intersects the requested closed window < ConversionVendor.max_concurrent_windows else ERR_VENDOR_WINDOW_CAPACITY"
        side_effects:
          - "sets cutover_start_at and cutover_end_at from the request body"
          - "increments ConversionVendor.active_window_count by 1"
          - "increments MigrationBatch.version by 1"
      - from: QUARANTINED
        to: SCHEDULED
        trigger: "POST /dso/migration-batches/{id}/remediate"
        actor: DsoIntegrationLead
        preconditions:
          - "batch.status == QUARANTINED else ERR_INVALID_BATCH_STATE"
        side_effects:
          - "increments remediation_round by 1, resets records_quarantined to 0 and records_validated to 0, clears validation_error_rate_bps"
          - "decrements Practice.quarantined_batch_count by 1, then recomputes calculations.practice_posture (RESTRICTED -> STABILIZING when it was the last blocker)"
          - "keeps the previously reserved cutover window and increments ConversionVendor.active_window_count by 1"
          - "increments MigrationBatch.version by 1 and Practice.version by 1"
        note: "Remediation cycle edge; a quarantined batch re-enters the SCHEDULED state without a new batch row."
      - from: SCHEDULED
        to: VALIDATED
        trigger: "POST /dso/migration-batches/{id}/validate with validation_error_rate_bps <= MAX_VALIDATION_ERROR_RATE_BPS"
        actor: DsoIntegrationLead
        preconditions:
          - "batch.status == SCHEDULED else ERR_INVALID_BATCH_STATE"
          - "logical clock >= batch.cutover_start_at else ERR_CUTOVER_WINDOW_NOT_STARTED"
          - "Practice[batch.practice_id].integration_posture IN {STABILIZING, INTEGRATED, RESTRICTED} else ERR_PRACTICE_POSTURE_BLOCKED"
        side_effects:
          - "sets records_quarantined = body quarantined_count, records_validated = records_total - quarantined_count, validation_error_rate_bps per calculations.chart_migration_validation"
          - "increases Practice.charts_migrated_count by records_validated"
          - "decrements ConversionVendor.active_window_count by 1"
          - "recomputes calculations.practice_posture (STABILIZING -> INTEGRATED when charts_migrated_count reaches charts_total_expected and no other blocker remains)"
          - "increments MigrationBatch.version by 1 and Practice.version by 1"
      - from: SCHEDULED
        to: QUARANTINED
        trigger: "POST /dso/migration-batches/{id}/validate with validation_error_rate_bps > MAX_VALIDATION_ERROR_RATE_BPS"
        actor: DsoIntegrationLead
        preconditions:
          - "batch.status == SCHEDULED else ERR_INVALID_BATCH_STATE"
          - "logical clock >= batch.cutover_start_at else ERR_CUTOVER_WINDOW_NOT_STARTED"
        side_effects:
          - "sets records_quarantined = records_total, records_validated = 0 (whole-batch quarantine), validation_error_rate_bps per calculations.chart_migration_validation"
          - "leaves Practice.charts_migrated_count unchanged"
          - "decrements ConversionVendor.active_window_count by 1"
          - "increments Practice.quarantined_batch_count by 1, then recomputes calculations.practice_posture (STABILIZING -> RESTRICTED)"
          - "increments MigrationBatch.version by 1 and Practice.version by 1"
        note: "Divergent branch of the same trigger: no chart credit, a quarantine counter increment and a posture demotion, none of which the VALIDATED branch performs."
      - from: VALIDATED
        to: QUARANTINED
        trigger: "POST /dso/migration-batches/{id}/rollback"
        actor: DsoIntegrationLead
        preconditions:
          - "batch.status == VALIDATED else ERR_INVALID_BATCH_STATE"
        side_effects:
          - "COMPENSATION: decreases Practice.charts_migrated_count by the batch's records_validated, then sets records_quarantined = records_total and records_validated = 0"
          - "increments Practice.quarantined_batch_count by 1 and recomputes calculations.practice_posture"
          - "restores the chart-records conservation identity of calculations.chart_records_ledger exactly"
          - "increments MigrationBatch.version by 1 and Practice.version by 1"
      - from: VALIDATED
        to: RECONCILED
        trigger: "POST /dso/migration-batches/{id}/reconcile"
        actor: DsoIntegrationLead
        preconditions:
          - "batch.status == VALIDATED else ERR_INVALID_BATCH_STATE"
          - "batch.records_pending == 0 else ERR_INVALID_BATCH_STATE"
        side_effects:
          - "freezes the batch; Practice.charts_migrated_count keeps counting this batch's records_validated"
          - "increments MigrationBatch.version by 1"
      - from: SCHEDULED
        to: HELD
        trigger: "system, CASCADE HOP 3 of DoctorEmployment ACTIVE -> SEPARATED (practice posture FROZEN)"
        actor: system
        preconditions:
          - "Practice.integration_posture became FROZEN in the same cascade"
        side_effects:
          - "decrements ConversionVendor.active_window_count by 1 while keeping cutover_start_at and cutover_end_at reserved"
          - "increments MigrationBatch.version by 1"
      - from: HELD
        to: SCHEDULED
        trigger: "system recompute when Practice.integration_posture leaves FROZEN"
        actor: system
        preconditions:
          - "Practice.integration_posture != FROZEN"
        side_effects:
          - "increments ConversionVendor.active_window_count by 1"
          - "increments MigrationBatch.version by 1"

  # --- PayerContract: fee-schedule transition -------------------------------
  - entity: PayerContract
    initial_state: LEGACY
    terminal_states: [DSO_SCHEDULE_ACTIVE]
    transitions:
      - from: LEGACY
        to: PENDING_CREDENTIALING
        trigger: "system, when enrollment_open_count moves from 0 to a positive value (cascade hop 5 of close, or POST /dso/payer-enrollments)"
        actor: system
        preconditions:
          - "contract.transition_state == LEGACY"
        side_effects:
          - "increments PayerContract.version by 1"
      - from: PENDING_CREDENTIALING
        to: LEGACY
        trigger: "system, when enrollment_open_count returns to 0 because every open enrollment was suspended by a posture freeze"
        actor: system
        preconditions:
          - "contract.transition_state == PENDING_CREDENTIALING"
          - "contract.enrollment_open_count == 0"
          - "no PayerEnrollment of this contract has status APPROVED"
        side_effects:
          - "increments PayerContract.version by 1"
      - from: PENDING_CREDENTIALING
        to: DSO_SCHEDULE_ACTIVE
        trigger: "POST /dso/payer-contracts/{id}/activate-fee-schedule"
        actor: DsoFinanceController
        preconditions:
          - "contract.transition_state == PENDING_CREDENTIALING else ERR_INVALID_CONTRACT_STATE"
          - "Practice[contract.practice_id].affiliation_status == AFFILIATED else ERR_PRACTICE_NOT_AFFILIATED"
          - "Practice[contract.practice_id].integration_posture IN {STABILIZING, INTEGRATED} else ERR_PRACTICE_POSTURE_BLOCKED"
          - "contract.fee_schedule_item_count >= 1 else ERR_FEE_SCHEDULE_EMPTY"
          - "count(PayerEnrollment of this contract) >= 1 AND every PayerEnrollment of this contract has status == APPROVED else ERR_ENROLLMENTS_NOT_APPROVED"
          - "every PayerEnrollment of this contract has lead_days >= CREDENTIALING_LEAD_DAYS (90) else ERR_CREDENTIALING_LEAD_TIME_SHORT"
          - "blended_impact_cents > MATERIAL_EROSION_THRESHOLD_CENTS (-500000) OR body erosion_override_ack == true else ERR_FEE_EROSION_MATERIAL"
        side_effects:
          - "recomputes calculations.fee_schedule_blended_impact and stores blended_impact_cents"
          - "sets erosion_override_ack from the request body"
          - "increments PayerContract.version by 1"

  # --- PayerEnrollment: denial/resubmission cycle + freeze suspension -------
  - entity: PayerEnrollment
    initial_state: NOT_STARTED
    terminal_states: [APPROVED]
    transitions:
      - from: NOT_STARTED
        to: SUBMITTED
        trigger: "POST /dso/payer-enrollments/{id}/submit"
        actor: DsoIntegrationLead
        preconditions:
          - "enrollment.status IN {NOT_STARTED, DENIED} else ERR_INVALID_ENROLLMENT_STATE"
          - "DoctorEmployment[enrollment.doctor_employment_id].employment_status == ACTIVE else ERR_INVALID_EMPLOYMENT_STATE"
          - "Practice of the enrollment's contract has affiliation_status == AFFILIATED else ERR_PRACTICE_NOT_AFFILIATED"
          - "Practice of the enrollment's contract has integration_posture != FROZEN else ERR_PRACTICE_POSTURE_BLOCKED"
        side_effects:
          - "sets submitted_at = logical clock, increments submission_round by 1, recomputes lead_days per calculations.credentialing_lead_time"
          - "increments Practice.pending_credentialing_count by 1"
          - "recomputes DoctorEmployment.credentialing_status per calculations.credentialing_rollup (dimension B)"
          - "increments PayerEnrollment.version by 1"
      - from: DENIED
        to: SUBMITTED
        trigger: "POST /dso/payer-enrollments/{id}/submit (resubmission after denial)"
        actor: DsoIntegrationLead
        preconditions:
          - "enrollment.status == DENIED"
        side_effects:
          - "clears denial_reason, sets submitted_at = logical clock, increments submission_round by 1"
          - "decrements Practice.denied_enrollment_count by 1 and increments Practice.pending_credentialing_count by 1, then recomputes calculations.practice_posture (RESTRICTED -> STABILIZING when it was the last blocker)"
          - "recomputes DoctorEmployment.credentialing_status (dimension B)"
          - "increments PayerEnrollment.version by 1 and Practice.version by 1"
        note: "Cycle edge; submission_round distinguishes the rounds."
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /dso/payer-enrollments/{id}/decide with decision == APPROVE"
        actor: DsoIntegrationLead
        preconditions:
          - "enrollment.status == SUBMITTED else ERR_INVALID_ENROLLMENT_STATE"
        side_effects:
          - "sets decided_at = logical clock"
          - "decrements Practice.pending_credentialing_count by 1 and PayerContract.enrollment_open_count by 1"
          - "recomputes DoctorEmployment.credentialing_status (dimension B) and calculations.practice_posture"
          - "increments PayerEnrollment.version by 1"
      - from: SUBMITTED
        to: DENIED
        trigger: "POST /dso/payer-enrollments/{id}/decide with decision == DENY"
        actor: DsoIntegrationLead
        preconditions:
          - "enrollment.status == SUBMITTED else ERR_INVALID_ENROLLMENT_STATE"
          - "body denial_reason is a non-empty string else ERR_INVALID_REQUEST"
        side_effects:
          - "sets decided_at = logical clock and denial_reason from the body"
          - "decrements Practice.pending_credentialing_count by 1, increments Practice.denied_enrollment_count by 1, keeps PayerContract.enrollment_open_count unchanged"
          - "recomputes DoctorEmployment.credentialing_status to DENIED (dimension B) and calculations.practice_posture (STABILIZING -> RESTRICTED)"
          - "increments PayerEnrollment.version by 1 and Practice.version by 1"
        note: "Divergent branch of the same trigger: the DENY side-effect set demotes practice posture and blocks fee-schedule activation, which APPROVE does not."
      - from: SUBMITTED
        to: SUSPENDED
        trigger: "system, CASCADE HOP 3 of DoctorEmployment ACTIVE -> SEPARATED (practice posture FROZEN)"
        actor: system
        preconditions:
          - "Practice.integration_posture became FROZEN in the same cascade"
        side_effects:
          - "decrements Practice.pending_credentialing_count by 1 and PayerContract.enrollment_open_count by 1"
          - "increments PayerEnrollment.version by 1"
      - from: SUSPENDED
        to: SUBMITTED
        trigger: "system recompute when Practice.integration_posture leaves FROZEN"
        actor: system
        preconditions:
          - "Practice.integration_posture != FROZEN"
        side_effects:
          - "increments Practice.pending_credentialing_count by 1 and PayerContract.enrollment_open_count by 1"
          - "increments PayerEnrollment.version by 1"

  # --- EarnoutTranche: reserve / settle / compensating claw-back ------------
  - entity: EarnoutTranche
    initial_state: PROJECTED
    terminal_states: [CLAWED_BACK]
    transitions:
      - from: PROJECTED
        to: RESERVED
        trigger: "POST /dso/earnout-tranches/{id}/reserve"
        actor: DsoFinanceController
        preconditions:
          - "tranche.status == PROJECTED else ERR_INVALID_TRANCHE_STATE"
          - "Affiliation[tranche.affiliation_id].status == CLOSED else ERR_INVALID_AFFILIATION_STATE"
          - "Affiliation.earnout_measurement_state == OPEN else ERR_INVALID_AFFILIATION_STATE"
          - "raw_payout of the PROVISIONAL variant <= Affiliation.earnout_unallocated_cents else ERR_EARNOUT_POOL_EXCEEDED"
        side_effects:
          - "stamps reported_*, annualized_*, management_fee_cents, adjusted_ebitda_cents, growth_bps, multiple_bps and variant_applied = PROVISIONAL"
          - "sets reserved_cents = raw_payout, reserved_by_user_id = X-User-ID"
          - "increases Affiliation.earnout_reserved_cents by reserved_cents and decreases Affiliation.earnout_unallocated_cents by the same amount (calculations.earnout_pool_ledger identity preserved)"
          - "increments EarnoutTranche.version by 1 and Affiliation.version by 1"
      - from: RESERVED
        to: SETTLED
        trigger: "POST /dso/earnout-tranches/{id}/settle"
        actor: DsoFinanceController
        preconditions:
          - "tranche.status == RESERVED else ERR_INVALID_TRANCHE_STATE"
          - "X-User-ID != tranche.reserved_by_user_id else ERR_SEGREGATION_OF_DUTIES"
          - "raw_payout of the FINAL variant <= Affiliation.earnout_unallocated_cents + tranche.reserved_cents else ERR_EARNOUT_POOL_EXCEEDED"
        side_effects:
          - "stamps final_*, lag_holdback_cents, management_fee_cents, adjusted_ebitda_cents, growth_bps, multiple_bps and variant_applied = FINAL"
          - "sets awarded_cents = FINAL raw_payout, reserved_cents = 0, settled_by_user_id = X-User-ID"
          - "moves Affiliation.earnout_reserved_cents down by the released reservation, Affiliation.earnout_settled_cents up by awarded_cents, and recomputes earnout_unallocated_cents so the ledger identity still holds"
          - "increments EarnoutTranche.version by 1 and Affiliation.version by 1"
      - from: SETTLED
        to: CLAWED_BACK
        trigger: "POST /dso/earnout-tranches/{id}/claw-back"
        actor: DsoFinanceController
        preconditions:
          - "tranche.status == SETTLED else ERR_INVALID_TRANCHE_STATE"
          - "Affiliation[tranche.affiliation_id].status == CLOSED"
        side_effects:
          - "COMPENSATION: sets clawed_back_cents = awarded_cents, then awarded_cents = 0"
          - "decreases Affiliation.earnout_settled_cents by clawed_back_cents and increases Affiliation.earnout_unallocated_cents by exactly the same amount, restoring earnout_pool_cents == unallocated + reserved + settled with zero drift"
          - "increments EarnoutTranche.version by 1 and Affiliation.version by 1"

  # --- SupplyPreferenceException: clinician-preference fork ----------------
  - entity: SupplyPreferenceException
    initial_state: REQUESTED
    terminal_states: [APPROVED, DENIED]
    transitions:
      - from: REQUESTED
        to: APPROVED
        trigger: "POST /dso/supply-preference-exceptions/{id}/decide with decision == APPROVE"
        actor: ClinicalDirector
        preconditions:
          - "exception.status == REQUESTED else ERR_INVALID_WORKFLOW_STATE"
          - "DoctorEmployment[exception.doctor_employment_id].employment_status == ACTIVE else ERR_INVALID_EMPLOYMENT_STATE"
        side_effects:
          - "stamps incremental_cost_cents per calculations.vendor_consolidation_savings step 2 and decided_by_doctor_id = X-User-ID"
          - "makes the exception eligible for exception_leakage_cents at the next VendorConsolidation finalization"
          - "increments SupplyPreferenceException.version by 1"
      - from: REQUESTED
        to: DENIED
        trigger: "POST /dso/supply-preference-exceptions/{id}/decide with decision == DENY"
        actor: ClinicalDirector
        preconditions:
          - "exception.status == REQUESTED else ERR_INVALID_WORKFLOW_STATE"
        side_effects:
          - "leaves incremental_cost_cents null so the exception never enters exception_leakage_cents"
          - "sets decided_by_doctor_id = X-User-ID"
          - "increments SupplyPreferenceException.version by 1"

  # --- VendorConsolidation ------------------------------------------------
  - entity: VendorConsolidation
    initial_state: PLANNED
    terminal_states: [FINALIZED]
    transitions:
      - from: PLANNED
        to: FINALIZED
        trigger: "POST /dso/vendor-consolidations/{id}/finalize"
        actor: DsoIntegrationLead
        preconditions:
          - "consolidation.status == PLANNED else ERR_INVALID_WORKFLOW_STATE"
          - "Practice[consolidation.practice_id].affiliation_status == AFFILIATED else ERR_PRACTICE_NOT_AFFILIATED"
          - "Practice[consolidation.practice_id].integration_posture IN {STABILIZING, INTEGRATED} else ERR_PRACTICE_POSTURE_BLOCKED"
        side_effects:
          - "stamps gross_savings_cents, exception_leakage_cents, exception_count_applied and projected_savings_cents per calculations.vendor_consolidation_savings"
          - "increments VendorConsolidation.version by 1"

  # --- ClinicalQualityReview: three-way outcome fork -----------------------
  - entity: ClinicalQualityReview
    initial_state: OPEN
    terminal_states: [CLOSED_NO_FINDINGS, CLOSED_WITH_PLAN, ESCALATED]
    transitions:
      - from: OPEN
        to: CLOSED_NO_FINDINGS
        trigger: "POST /dso/clinical-quality-reviews/{id}/close with outcome == CLOSED_NO_FINDINGS"
        actor: ClinicalDirector
        preconditions:
          - "review.status == OPEN else ERR_INVALID_WORKFLOW_STATE"
          - "Doctor[X-User-ID].license_state == Practice[DoctorEmployment[review.doctor_employment_id].practice_id].state_code else ERR_CORPORATE_PRACTICE_VIOLATION"
          - "review.score_bps == 10000 else ERR_QUALITY_OUTCOME_MISMATCH"
        side_effects:
          - "sets closed_by_doctor_id = X-User-ID and outcome_note from the body"
          - "increments ClinicalQualityReview.version by 1"
      - from: OPEN
        to: CLOSED_WITH_PLAN
        trigger: "POST /dso/clinical-quality-reviews/{id}/close with outcome == CLOSED_WITH_PLAN"
        actor: ClinicalDirector
        preconditions:
          - "review.status == OPEN else ERR_INVALID_WORKFLOW_STATE"
          - "Doctor[X-User-ID].license_state == Practice[DoctorEmployment[review.doctor_employment_id].practice_id].state_code else ERR_CORPORATE_PRACTICE_VIOLATION"
          - "review.score_bps >= QUALITY_ESCALATION_THRESHOLD_BPS (8000) else ERR_QUALITY_OUTCOME_MISMATCH"
        side_effects:
          - "sets closed_by_doctor_id = X-User-ID and outcome_note from the body"
          - "increments ClinicalQualityReview.version by 1"
      - from: OPEN
        to: ESCALATED
        trigger: "POST /dso/clinical-quality-reviews/{id}/close with outcome == ESCALATED"
        actor: ClinicalDirector
        preconditions:
          - "review.status == OPEN else ERR_INVALID_WORKFLOW_STATE"
          - "Doctor[X-User-ID].license_state == Practice[DoctorEmployment[review.doctor_employment_id].practice_id].state_code else ERR_CORPORATE_PRACTICE_VIOLATION"
        side_effects:
          - "sets closed_by_doctor_id = X-User-ID and outcome_note from the body"
          - "increments ClinicalQualityReview.version by 1"
        note: "ESCALATED is always permitted; it is mandatory when score_bps < QUALITY_ESCALATION_THRESHOLD_BPS."

# =============================================================================
# §1.2.1 Concurrency Rules — OCC on the parent's version only
# =============================================================================
concurrency_rules:
  - rule_id: tranche-create-stale-affiliation
    parent_entity: Affiliation
    write_endpoint: "POST /dso/earnout-tranches"
    occ_field: "expected_affiliation_version"
    description: |
      Creating an EarnoutTranche against an Affiliation whose version has
      advanced since the client last observed it is rejected. A newly created
      tranche legitimately supersedes the prior projection for the same pool,
      so a writer holding a stale view of earnout_unallocated_cents would
      otherwise project against a pool balance that no longer exists.
    error_id: ERR_STALE_AFFILIATION_VERSION
    http_status: 412
  - rule_id: batch-create-stale-practice
    parent_entity: Practice
    write_endpoint: "POST /dso/migration-batches"
    occ_field: "expected_practice_version"
    description: |
      Creating a MigrationBatch against a Practice whose version has advanced
      since the client last observed it is rejected. A successful create
      supersedes every earlier STAGED batch of that practice, so a writer whose
      view of the practice's chart counters is stale would silently discard a
      batch mapping produced from newer counters.
    error_id: ERR_STALE_PRACTICE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules
#
# All money is integer cents. All rates are integer basis points (bps).
# round_half_up means "half away from zero": round(x) = floor(x + 0.5) for
# x >= 0 and ceil(x - 0.5) for x < 0. Every division below is exact rational
# division followed by exactly one round_half_up at the step where a rounding
# instruction is written; no other step rounds.
# =============================================================================
calculations:

  - name: earnout_payout
    description: |
      Earn-out payout for one EarnoutTranche. Runs in two variants against the
      same tranche row: PROVISIONAL at reservation time (period still running,
      so partial-period collections and expenses are annualized) and FINAL at
      settlement (full period reported, so a lag holdback is withheld from
      collections instead of annualizing). The management fee rate is itself
      tiered on the net-collections figure produced earlier in the same chain,
      and the payout multiple is tiered on the growth figure produced two steps
      later, so the eight steps must run in the pinned order.
    trigger: "POST /dso/earnout-tranches/{id}/reserve (PROVISIONAL) and POST /dso/earnout-tranches/{id}/settle (FINAL)"
    inputs:
      - "EarnoutTranche.reported_net_collections_cents, EarnoutTranche.reported_expenses_cents (PROVISIONAL variant)"
      - "EarnoutTranche.final_net_collections_cents, EarnoutTranche.final_expenses_cents (FINAL variant)"
      - "EarnoutTranche.measurement_start, EarnoutTranche.measurement_end"
      - "logical clock (PROVISIONAL variant, to derive days_elapsed)"
      - "Affiliation.baseline_ebitda_cents, Affiliation.earnout_pool_cents, Affiliation.earnout_unallocated_cents"
    algorithm: tiered_pricing
    formula: |
      Step 0 (variant inputs):
        PROVISIONAL: nc_in = reported_net_collections_cents
                     ex_in = reported_expenses_cents
                     days_elapsed = whole days from measurement_start to the
                                    logical clock (floor of the UTC difference)
                     if days_elapsed <= 0 -> ERR_MEASUREMENT_PERIOD_NOT_STARTED
        FINAL:       nc_in = final_net_collections_cents
                     ex_in = final_expenses_cents

      Step 1 (net collections, the only variant-divergent arithmetic):
        PROVISIONAL: net_collections = round_half_up(nc_in * 365 / days_elapsed)
                     lag_holdback_cents = 0
        FINAL:       lag_holdback_cents = round_half_up(nc_in * LAG_HOLDBACK_BPS / 10000)
                     net_collections = nc_in - lag_holdback_cents

      Step 2 (expenses):
        PROVISIONAL: expenses = round_half_up(ex_in * 365 / days_elapsed)
        FINAL:       expenses = ex_in

      Step 3 (management fee rate, tiered on the Step 1 output):
        if net_collections < FEE_TIER_1_CEILING_CENTS      -> fee_bps = FEE_TIER_1_BPS
        elif net_collections < FEE_TIER_2_CEILING_CENTS    -> fee_bps = FEE_TIER_2_BPS
        else                                               -> fee_bps = FEE_TIER_3_BPS

      Step 4 (management fee):
        management_fee_cents = round_half_up(net_collections * fee_bps / 10000)

      Step 5 (adjusted EBITDA):
        adjusted_ebitda_cents = net_collections - expenses - management_fee_cents

      Step 6 (growth against the closing baseline):
        growth_bps = round_half_up(
            (adjusted_ebitda_cents - baseline_ebitda_cents) * 10000
            / baseline_ebitda_cents )

      Step 7 (payout multiple, tiered on the Step 6 output):
        if growth_bps < 0                          -> multiple_bps = MULTIPLE_TIER_0_BPS
        elif growth_bps < GROWTH_TIER_1_BPS        -> multiple_bps = MULTIPLE_TIER_1_BPS
        elif growth_bps < GROWTH_TIER_2_BPS        -> multiple_bps = MULTIPLE_TIER_2_BPS
        else                                       -> multiple_bps = MULTIPLE_TIER_3_BPS

      Step 8 (raw payout, floored at zero):
        raw = round_half_up(
            (adjusted_ebitda_cents - baseline_ebitda_cents) * multiple_bps / 10000 )
        payout_cents = max(0, raw)

      The reserve endpoint stores payout_cents in reserved_cents; the settle
      endpoint stores payout_cents in awarded_cents.
    constants:
      LAG_HOLDBACK_BPS: 250
      FEE_TIER_1_CEILING_CENTS: 150000000
      FEE_TIER_2_CEILING_CENTS: 300000000
      FEE_TIER_1_BPS: 700
      FEE_TIER_2_BPS: 600
      FEE_TIER_3_BPS: 550
      GROWTH_TIER_1_BPS: 800
      GROWTH_TIER_2_BPS: 1500
      MULTIPLE_TIER_0_BPS: 0
      MULTIPLE_TIER_1_BPS: 25000
      MULTIPLE_TIER_2_BPS: 35000
      MULTIPLE_TIER_3_BPS: 45000
      DAYS_PER_YEAR: 365
    precision: "integer cents and integer bps; round_half_up (half away from zero) at Steps 1, 2, 4, 6 and 8 only"
    variants:
      - name: PROVISIONAL
        when: "POST /dso/earnout-tranches/{id}/reserve, while the measurement period is still open (logical clock < measurement_end)"
        difference: |
          Annualizes both reported collections and reported expenses by
          365 / days_elapsed before any tier lookup, and withholds nothing.
          Because the annualized collections figure feeds the Step 3 tier
          lookup, a partial period can land in a *different* management-fee
          tier than the same practice's full-year figures, which then shifts
          adjusted EBITDA, growth and the Step 7 multiple.
      - name: FINAL
        when: "POST /dso/earnout-tranches/{id}/settle, after the measurement period closed"
        difference: |
          Does not annualize. Instead withholds LAG_HOLDBACK_BPS of reported
          collections as a claims-lag holdback and subtracts it from net
          collections before the Step 3 tier lookup, and uses reported
          expenses unscaled.

  - name: doctor_compensation
    description: |
      Post-close doctor compensation for one DoctorEmployment over the first
      12 months of the employment term, under one of two contractual comp
      models. The two models consume the identical monthly collections series
      and the identical base salary and percentage but aggregate them at
      different granularities, so they generally disagree.
    trigger: "POST /dso/doctor-employments/{id}/harmonize-compensation"
    inputs:
      - "DoctorEmployment.base_salary_monthly_cents"
      - "DoctorEmployment.collections_pct_bps"
      - "DoctorEmployment.comp_model"
      - "DoctorEmployment.legacy_annual_comp_cents"
      - "request body monthly_collections_cents (array of exactly 12 integer cents, month 1 first)"
    algorithm: aggregation
    formula: |
      Shared preparation:
        annual_collections = sum(monthly_collections_cents)   # exact, no rounding

      Variant MONTHLY_MIN_GUARANTEE (per-month floor):
        for each month m in 1..12:
            pct_m = round_half_up(monthly_collections_cents[m]
                                  * collections_pct_bps / 10000)
            month_pay[m] = max(base_salary_monthly_cents, pct_m)
        harmonized_annual_comp_cents = sum(month_pay[1..12])

      Variant ANNUAL_TRUE_UP (annual floor):
        pct_annual = round_half_up(annual_collections
                                   * collections_pct_bps / 10000)
        harmonized_annual_comp_cents = max(base_salary_monthly_cents * 12,
                                           pct_annual)

      Both variants then:
        harmonization_delta_cents = harmonized_annual_comp_cents
                                    - legacy_annual_comp_cents
        is_harmonized = true

      A month whose collections fall below the guarantee is topped up to the
      base salary under MONTHLY_MIN_GUARANTEE and that top-up is never clawed
      back by a strong month, whereas ANNUAL_TRUE_UP lets strong months absorb
      weak ones. MONTHLY_MIN_GUARANTEE is therefore always >= ANNUAL_TRUE_UP
      for the same inputs, and strictly greater whenever any month is below
      the guarantee while the annual percentage clears 12x the base.
    constants:
      COMP_MONTHS: 12
      BPS_DENOMINATOR: 10000
    precision: "integer cents; round_half_up per month under MONTHLY_MIN_GUARANTEE and exactly once on the annual total under ANNUAL_TRUE_UP"
    variants:
      - name: MONTHLY_MIN_GUARANTEE
        when: "DoctorEmployment.comp_model == MONTHLY_MIN_GUARANTEE"
        difference: "Takes max(base, percentage) inside each of the 12 months and sums the 12 maxima; rounds 12 times."
      - name: ANNUAL_TRUE_UP
        when: "DoctorEmployment.comp_model == ANNUAL_TRUE_UP"
        difference: "Sums collections first, takes the percentage once, and compares that single figure against 12x the base; rounds once."

  - name: fee_schedule_blended_impact
    description: |
      Annualized collections impact of moving one PayerContract from the legacy
      practice fee schedule to the DSO fee schedule. Every FeeScheduleItem is
      first converted to a per-line annual impact, blended by the utilization
      blend factor and rounded to whole cents at the line, and only then are
      the line impacts summed. The rounding boundary is at the line, not the
      contract, so the contract total is the sum of rounded lines and not the
      rounding of a summed raw total.
    trigger: "POST /dso/payer-contracts/{id}/activate-fee-schedule, and recomputed on POST /dso/payer-contracts/{id}/fee-schedule-items"
    inputs:
      - "every FeeScheduleItem with payer_contract_id == contract.id (processed in created_at ASC order)"
      - "FeeScheduleItem.legacy_allowed_cents, dso_allowed_cents, annual_volume"
    algorithm: aggregation
    formula: |
      for each FeeScheduleItem i of the contract, in created_at ASC order:
          raw_i  = (i.dso_allowed_cents - i.legacy_allowed_cents)
                   * i.annual_volume * BLEND_FACTOR_BPS / 10000
          line_i = round_half_up(raw_i)          # rounded AT THE LINE
          store line_i in FeeScheduleItem.line_impact_cents

      blended_impact_cents = sum(line_i over all items)

      The order of operations is pinned: round each line, then sum. Summing the
      raw values and rounding once at the end is a different number whenever
      two or more lines carry a fractional half of the same sign, and the
      contract-level value must equal the sum of the stored line values so that
      the persisted line_impact_cents figures reconcile with the contract
      figure exactly.

      A negative blended_impact_cents means fee erosion. When
      blended_impact_cents <= MATERIAL_EROSION_THRESHOLD_CENTS the activation
      requires an explicit erosion_override_ack.
    constants:
      BLEND_FACTOR_BPS: 6500
      MATERIAL_EROSION_THRESHOLD_CENTS: -500000
    precision: "integer cents; exactly one round_half_up per FeeScheduleItem, none at the contract level"

  - name: practice_posture
    description: |
      Derives Practice.integration_posture from the practice's own counters and
      its affiliation status. Recomputed on every write that changes any input
      counter, in the pinned precedence order below; the first matching clause
      wins and later clauses are not evaluated.
    trigger: "any write that changes Practice.affiliation_status, active_doctor_count, quarantined_batch_count, denied_enrollment_count, pending_credentialing_count or charts_migrated_count"
    inputs:
      - "Practice.affiliation_status"
      - "Practice.active_doctor_count"
      - "Practice.quarantined_batch_count"
      - "Practice.denied_enrollment_count"
      - "Practice.pending_credentialing_count"
      - "Practice.charts_migrated_count, Practice.charts_total_expected"
    algorithm: constraint_propagation
    formula: |
      1. if affiliation_status != AFFILIATED                     -> PRE_CLOSE
      2. elif active_doctor_count == 0                           -> FROZEN
      3. elif quarantined_batch_count > 0
              or denied_enrollment_count > 0                     -> RESTRICTED
      4. elif pending_credentialing_count > 0
              or charts_migrated_count < charts_total_expected    -> STABILIZING
      5. else                                                     -> INTEGRATED

      clinical_coverage_gap = (result == FROZEN)

      Clause 2 dominates clauses 3 and 4: a practice with no active doctor is
      FROZEN even when it also has quarantined batches and denied enrollments.
      Clause 3 dominates clause 4: a practice with a quarantined batch is
      RESTRICTED even when every chart has migrated and no credentialing is
      pending.
    constants: {}
    precision: "exact enum evaluation; no arithmetic"

  - name: credentialing_rollup
    description: |
      Derives DoctorEmployment.credentialing_status from the statuses of the
      PayerEnrollment rows that reference the employment. This is the second of
      the employment row's three independent state dimensions and never reads
      employment_status or records_custody_state.
    trigger: "any write that changes a PayerEnrollment.status whose doctor_employment_id references the employment, and the Affiliation close cascade that creates enrollment rows"
    inputs:
      - "every PayerEnrollment with doctor_employment_id == employment.id"
    algorithm: aggregation
    formula: |
      let E = { PayerEnrollment rows with doctor_employment_id == employment.id }
      1. if E is empty                                    -> PENDING
      2. elif any e in E has status == DENIED             -> DENIED
      3. elif every e in E has status == APPROVED         -> APPROVED
      4. elif any e in E has status == SUBMITTED          -> SUBMITTED
      5. else                                             -> PENDING

      A single denial dominates any number of approvals (clause 2 precedes
      clause 3), and a SUSPENDED enrollment counts as neither approved nor
      submitted, so freezing a practice pulls the rollup back to PENDING.
    constants: {}
    precision: "exact enum evaluation; no arithmetic"

  - name: credentialing_lead_time
    description: |
      Whole-day lead time between an enrollment submission and the date the DSO
      fee schedule is allowed to take effect for that enrollment.
    trigger: "POST /dso/payer-enrollments/{id}/submit, and re-read by POST /dso/payer-contracts/{id}/activate-fee-schedule"
    inputs:
      - "PayerEnrollment.submitted_at (set from the logical clock at submission)"
      - "PayerEnrollment.effective_date"
    algorithm: threshold
    formula: |
      lead_days = floor( (effective_date - submitted_at) / 86400 seconds )

      A contract may activate its DSO schedule only when every one of its
      enrollments satisfies lead_days >= CREDENTIALING_LEAD_DAYS. lead_days
      exactly equal to CREDENTIALING_LEAD_DAYS passes; one day short fails
      with ERR_CREDENTIALING_LEAD_TIME_SHORT.
    constants:
      CREDENTIALING_LEAD_DAYS: 90
      SECONDS_PER_DAY: 86400
    precision: "integer days, floor of the UTC difference"

  - name: chart_migration_validation
    description: |
      Validation outcome of one chart-migration batch cutover. The error rate
      is computed against the batch's declared record count; when it exceeds
      the tolerance the WHOLE batch is quarantined rather than only the failing
      records, so no chart credit at all flows to the practice.
    trigger: "POST /dso/migration-batches/{id}/validate"
    inputs:
      - "MigrationBatch.records_total"
      - "request body quarantined_count"
    algorithm: threshold
    formula: |
      if quarantined_count > records_total -> ERR_QUARANTINE_COUNT_EXCEEDS_TOTAL

      validation_error_rate_bps = round_half_up(
          quarantined_count * 10000 / records_total )

      if validation_error_rate_bps <= MAX_VALIDATION_ERROR_RATE_BPS:
          status            = VALIDATED
          records_quarantined = quarantined_count
          records_validated   = records_total - quarantined_count
          records_pending     = 0
          Practice.charts_migrated_count += records_validated
      else:
          status            = QUARANTINED
          records_quarantined = records_total      # whole-batch quarantine
          records_validated   = 0
          records_pending     = 0
          Practice.charts_migrated_count unchanged
          Practice.quarantined_batch_count += 1

      A rate exactly equal to MAX_VALIDATION_ERROR_RATE_BPS validates; one
      basis point above quarantines the entire batch.
    constants:
      MAX_VALIDATION_ERROR_RATE_BPS: 200
      BPS_DENOMINATOR: 10000
    precision: "integer bps, one round_half_up; integer record counts"

  - name: vendor_consolidation_savings
    description: |
      Projected annual savings from consolidating a practice onto the DSO
      supply or lab formulary, net of the leakage caused by APPROVED clinician
      preference exceptions. Gross savings are discounted by a realization
      factor; leakage is not, because an approved exception is paid at full
      price from day one.
    trigger: "POST /dso/vendor-consolidations/{id}/finalize"
    inputs:
      - "VendorConsolidation.baseline_annual_spend_cents, formulary_annual_spend_cents, vendor_category"
      - "every SupplyPreferenceException with status == APPROVED whose DoctorEmployment.practice_id == consolidation.practice_id and whose vendor_category == consolidation.vendor_category"
    algorithm: aggregation
    formula: |
      Step 1 (gross, realization-discounted):
        delta = baseline_annual_spend_cents - formulary_annual_spend_cents
        gross_savings_cents = round_half_up(delta * REALIZATION_BPS / 10000)

      Step 2 (leakage, per exception, undiscounted):
        for each qualifying APPROVED SupplyPreferenceException e,
        in created_at ASC order:
            e.incremental_cost_cents =
                (e.preferred_unit_cents - e.formulary_unit_cents) * e.annual_qty
        exception_leakage_cents = sum(e.incremental_cost_cents)
        exception_count_applied = count of qualifying exceptions

      Step 3 (net, floored):
        projected_savings_cents = max(0, gross_savings_cents
                                         - exception_leakage_cents)

      Only APPROVED exceptions count. REQUESTED and DENIED exceptions
      contribute nothing, and exceptions belonging to a different
      vendor_category or to a doctor at a different practice are excluded even
      when they are APPROVED.
    constants:
      REALIZATION_BPS: 8500
      BPS_DENOMINATOR: 10000
    precision: "integer cents; exactly one round_half_up in Step 1, no rounding in Steps 2 and 3"

  - name: clinical_quality_score
    description: |
      Weighted quality score for one ClinicalQualityReview, combining the chart
      finding rate with the treatment-plan override rate. The two component
      penalties are each rounded before being subtracted, so the score is not
      the rounding of a single combined expression.
    trigger: "POST /dso/clinical-quality-reviews (score stamped at creation) and re-stamped on POST /dso/clinical-quality-reviews/{id}/close"
    inputs:
      - "ClinicalQualityReview.charts_sampled, charts_with_findings, treatment_plan_overrides"
    algorithm: weighted_scoring
    formula: |
      if charts_sampled < MIN_CHARTS_SAMPLED -> ERR_SAMPLE_SIZE_TOO_SMALL
      if charts_with_findings > charts_sampled
         or treatment_plan_overrides > charts_sampled -> ERR_INVALID_REQUEST

      finding_rate_bps  = round_half_up(charts_with_findings   * 10000 / charts_sampled)
      override_rate_bps = round_half_up(treatment_plan_overrides * 10000 / charts_sampled)

      finding_penalty  = round_half_up(finding_rate_bps  * W_FINDING_BPS  / 10000)
      override_penalty = round_half_up(override_rate_bps * W_OVERRIDE_BPS / 10000)

      score_bps = max(0, 10000 - finding_penalty - override_penalty)

      Outcome coupling on close:
        score_bps == 10000                               -> CLOSED_NO_FINDINGS allowed
        score_bps >= QUALITY_ESCALATION_THRESHOLD_BPS    -> CLOSED_WITH_PLAN allowed
        score_bps <  QUALITY_ESCALATION_THRESHOLD_BPS    -> only ESCALATED allowed
      A score exactly equal to QUALITY_ESCALATION_THRESHOLD_BPS may still be
      closed with a plan; one basis point below must escalate.
    constants:
      W_FINDING_BPS: 6000
      W_OVERRIDE_BPS: 4000
      QUALITY_ESCALATION_THRESHOLD_BPS: 8000
      MIN_CHARTS_SAMPLED: 20
      BPS_DENOMINATOR: 10000
    precision: "integer bps; four independent round_half_up applications, then a floor at zero"

  - name: earnout_pool_ledger
    description: |
      Conservation identity over the earn-out pool of one Affiliation. Every
      tranche reservation, settlement and claw-back moves cents between the
      three buckets without creating or destroying any, so the identity below
      holds after every single write, including a claw-back that undoes a
      settlement.
    trigger: "POST /dso/affiliations/{id}/reprice, POST /dso/earnout-tranches/{id}/reserve, POST /dso/earnout-tranches/{id}/settle, POST /dso/earnout-tranches/{id}/claw-back"
    inputs:
      - "Affiliation.earnout_pool_cents"
      - "every EarnoutTranche with affiliation_id == affiliation.id"
    algorithm: aggregation
    formula: |
      earnout_reserved_cents  = sum(t.reserved_cents  for t where status == RESERVED)
      earnout_settled_cents   = sum(t.awarded_cents   for t where status == SETTLED)
      earnout_unallocated_cents = earnout_pool_cents
                                  - earnout_reserved_cents
                                  - earnout_settled_cents

      INVARIANT (must hold after every write):
        earnout_pool_cents == earnout_unallocated_cents
                              + earnout_reserved_cents
                              + earnout_settled_cents

      A claw-back sets clawed_back_cents = awarded_cents and awarded_cents = 0,
      which returns exactly the settled amount to earnout_unallocated_cents.
      earnout_unallocated_cents must never be negative; a reservation or
      settlement that would drive it negative is rejected with
      ERR_EARNOUT_POOL_EXCEEDED and leaves all four figures untouched.
    constants: {}
    precision: "integer cents; exact, no rounding anywhere in the identity"

  - name: chart_records_ledger
    description: |
      Conservation identity over migrated chart records for one Practice.
      Practice.charts_migrated_count is a derived roll-up of the batches, and a
      rollback must return it to exactly its pre-validation value.
    trigger: "POST /dso/migration-batches/{id}/validate, /remediate, /rollback, /reconcile"
    inputs:
      - "every MigrationBatch with practice_id == practice.id"
    algorithm: aggregation
    formula: |
      INVARIANT (must hold after every write):
        Practice.charts_migrated_count ==
            sum(b.records_validated for every MigrationBatch b of the practice
                with status IN {VALIDATED, RECONCILED})

      Per-batch identity (must hold for every batch after every write):
        b.records_total == b.records_validated
                           + b.records_quarantined
                           + b.records_pending

      A rollback of a VALIDATED batch subtracts exactly that batch's
      records_validated from Practice.charts_migrated_count and then zeroes
      records_validated, so both identities are restored with zero drift and
      the practice's chart count returns to its pre-validation value even after
      several batches validated in between.
    constants: {}
    precision: "integer record counts; exact, no rounding"

# =============================================================================
# §1.4 Validation Rules — evaluated in ascending priority order.
# The FIRST rule whose condition is violated determines the response; no later
# rule is evaluated, and no state change is written when any rule fires.
# =============================================================================
validations:

  # --- auth -----------------------------------------------------------------
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers are present and non-empty on every endpoint"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all
    description: "Missing or empty identity headers are rejected before any resource lookup."
  - priority: 2
    category: auth
    check: "X-User-Role is one of the five declared roles AND is listed in the target endpoint's roles"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: all
    description: "Role gate. Evaluated before existence so that an unauthorized caller cannot probe which IDs exist."
  - priority: 3
    category: auth
    check: "when X-User-Role is an entity_backed role (ClinicalDirector, Dentist), X-User-ID resolves to an existing Doctor row"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to:
      - "POST /dso/doctor-employments/{doctor_employment_id}/accept-offer"
      - "POST /dso/doctor-employments/{doctor_employment_id}/separate"
      - "POST /dso/doctor-employments/{doctor_employment_id}/records-custody-transfer"
      - "POST /dso/supply-preference-exceptions"
      - "POST /dso/supply-preference-exceptions/{supply_preference_exception_id}/decide"
      - "POST /dso/clinical-quality-reviews"
      - "POST /dso/clinical-quality-reviews/{clinical_quality_review_id}/close"
    description: "An entity-backed identity that does not correspond to a Doctor row cannot act as a clinician."

  # --- existence ------------------------------------------------------------
  - priority: 4
    category: existence
    check: "every templated path segment resolves to an existing row of the endpoint's target entity"
    error_id: "ERR_AFFILIATION_NOT_FOUND | ERR_PRACTICE_NOT_FOUND | ERR_DOCTOR_NOT_FOUND | ERR_CONVERSION_VENDOR_NOT_FOUND | ERR_DOCTOR_EMPLOYMENT_NOT_FOUND | ERR_SERVICE_AGREEMENT_NOT_FOUND | ERR_MIGRATION_BATCH_NOT_FOUND | ERR_PAYER_CONTRACT_NOT_FOUND | ERR_PAYER_ENROLLMENT_NOT_FOUND | ERR_EARNOUT_TRANCHE_NOT_FOUND | ERR_SUPPLY_EXCEPTION_NOT_FOUND | ERR_VENDOR_CONSOLIDATION_NOT_FOUND | ERR_QUALITY_REVIEW_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with a templated path segment"
    description: "Path-resource existence, keyed to the entity named by the collection segment."
  - priority: 5
    category: existence
    check: "every foreign-key field supplied in the request body resolves to an existing row of the referenced entity"
    error_id: "ERR_AFFILIATION_NOT_FOUND | ERR_PRACTICE_NOT_FOUND | ERR_DOCTOR_NOT_FOUND | ERR_CONVERSION_VENDOR_NOT_FOUND | ERR_DOCTOR_EMPLOYMENT_NOT_FOUND | ERR_SERVICE_AGREEMENT_NOT_FOUND | ERR_PAYER_CONTRACT_NOT_FOUND"
    http_status: 404
    applies_to: "all POST endpoints that accept a foreign-key body field"
    description: "Body-level referential existence, evaluated after path existence and before payload shape."

  # --- payload shape --------------------------------------------------------
  - priority: 6
    category: validation
    check: "every required body field is present with the declared type; enum fields carry a declared value; integer money and count fields are integers within their declared range; date-time fields are ISO-8601 UTC; monthly_collections_cents has exactly 12 entries; measurement_end > measurement_start; cutover_end_at > cutover_start_at; term_date, when present, is strictly after effective_date; pagination limit is 1..100 and offset >= 0"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all
    description: "Single payload-shape gate. Unknown body fields are ignored rather than rejected."

  # --- optimistic concurrency ----------------------------------------------
  - priority: 7
    category: concurrency
    check: "expected_affiliation_version equals the current Affiliation.version"
    error_id: ERR_STALE_AFFILIATION_VERSION
    http_status: 412
    applies_to:
      - "POST /dso/earnout-tranches"
    description: "OCC guard of §1.2.1 rule tranche-create-stale-affiliation."
  - priority: 8
    category: concurrency
    check: "expected_practice_version equals the current Practice.version"
    error_id: ERR_STALE_PRACTICE_VERSION
    http_status: 412
    applies_to:
      - "POST /dso/migration-batches"
    description: "OCC guard of §1.2.1 rule batch-create-stale-practice."

  # --- state ----------------------------------------------------------------
  - priority: 9
    category: state
    check: "the Affiliation is in a status that permits the operation (advance-diligence requires DRAFT; reprice and sign require DILIGENCE; close requires SIGNED; make-effective requires SIGNED or CLOSED; reserve requires CLOSED with earnout_measurement_state == OPEN)"
    error_id: ERR_INVALID_AFFILIATION_STATE
    http_status: 409
    applies_to:
      - "POST /dso/affiliations/{affiliation_id}/advance-diligence"
      - "POST /dso/affiliations/{affiliation_id}/reprice"
      - "POST /dso/affiliations/{affiliation_id}/sign"
      - "POST /dso/affiliations/{affiliation_id}/close"
      - "POST /dso/service-agreements/{service_agreement_id}/make-effective"
      - "POST /dso/earnout-tranches/{earnout_tranche_id}/reserve"
    description: "Affiliation-level gate, including the suspended-measurement case where a frozen practice blocks reservations."
  - priority: 10
    category: state
    check: "the EarnoutTranche is in the status the operation requires (reserve requires PROJECTED; settle requires RESERVED; claw-back requires SETTLED)"
    error_id: ERR_INVALID_TRANCHE_STATE
    http_status: 409
    applies_to:
      - "POST /dso/earnout-tranches/{earnout_tranche_id}/reserve"
      - "POST /dso/earnout-tranches/{earnout_tranche_id}/settle"
      - "POST /dso/earnout-tranches/{earnout_tranche_id}/claw-back"
    description: "Tranche lifecycle gate. Deliberately far above the fiscal pool check at priority 49 so that a doubly-invalid settle reports the state error."
  - priority: 11
    category: state
    check: "the DoctorEmployment dimension the operation touches is in the required state (accept-offer requires employment_status OFFERED and offer_accepted false; separate requires ACTIVE; records-custody-transfer requires SEPARATED with records_custody_state TRANSFER_PENDING; enforce-non-compete requires SEPARATED with non_compete_enforcement_state PENDING; harmonize-compensation, supply exceptions and quality reviews require ACTIVE; enrollment submit requires the employment ACTIVE)"
    error_id: ERR_INVALID_EMPLOYMENT_STATE
    http_status: 409
    applies_to:
      - "POST /dso/doctor-employments/{doctor_employment_id}/accept-offer"
      - "POST /dso/doctor-employments/{doctor_employment_id}/harmonize-compensation"
      - "POST /dso/doctor-employments/{doctor_employment_id}/separate"
      - "POST /dso/doctor-employments/{doctor_employment_id}/records-custody-transfer"
      - "POST /dso/doctor-employments/{doctor_employment_id}/enforce-non-compete"
      - "POST /dso/supply-preference-exceptions"
      - "POST /dso/supply-preference-exceptions/{supply_preference_exception_id}/decide"
      - "POST /dso/clinical-quality-reviews"
      - "POST /dso/payer-enrollments"
      - "POST /dso/payer-enrollments/{payer_enrollment_id}/submit"
    description: "Covers all three parallel dimensions of the employment row independently."
  - priority: 12
    category: state
    check: "the MigrationBatch is in the required status (schedule-cutover requires STAGED or QUARANTINED; validate requires SCHEDULED; rollback and reconcile require VALIDATED; remediate requires QUARANTINED); reconcile additionally requires records_pending == 0"
    error_id: ERR_INVALID_BATCH_STATE
    http_status: 409
    applies_to:
      - "POST /dso/migration-batches/{migration_batch_id}/schedule-cutover"
      - "POST /dso/migration-batches/{migration_batch_id}/validate"
      - "POST /dso/migration-batches/{migration_batch_id}/remediate"
      - "POST /dso/migration-batches/{migration_batch_id}/rollback"
      - "POST /dso/migration-batches/{migration_batch_id}/reconcile"
    description: "Batch lifecycle gate; HELD and SUPERSEDED batches accept no client-driven transition at all."
  - priority: 13
    category: state
    check: "the PayerEnrollment is in the required status (submit requires NOT_STARTED or DENIED; decide requires SUBMITTED)"
    error_id: ERR_INVALID_ENROLLMENT_STATE
    http_status: 409
    applies_to:
      - "POST /dso/payer-enrollments/{payer_enrollment_id}/submit"
      - "POST /dso/payer-enrollments/{payer_enrollment_id}/decide"
    description: "Enrollment lifecycle gate; a SUSPENDED enrollment is resumable only by the posture recompute, never by a client call."
  - priority: 14
    category: state
    check: "the ServiceAgreement is in the required status (line-items and submit-legal-review require DRAFT; reject-scope and make-effective require LEGAL_REVIEW)"
    error_id: ERR_INVALID_AGREEMENT_STATE
    http_status: 409
    applies_to:
      - "POST /dso/service-agreements/{id}/line-items"
      - "POST /dso/service-agreements/{service_agreement_id}/submit-legal-review"
      - "POST /dso/service-agreements/{service_agreement_id}/reject-scope"
      - "POST /dso/service-agreements/{service_agreement_id}/make-effective"
    description: "EFFECTIVE is terminal: scope can no longer be edited once the agreement is live."
  - priority: 15
    category: state
    check: "the PayerContract is in the required transition_state (fee-schedule-items require LEGACY or PENDING_CREDENTIALING; activate-fee-schedule requires PENDING_CREDENTIALING)"
    error_id: ERR_INVALID_CONTRACT_STATE
    http_status: 409
    applies_to:
      - "POST /dso/payer-contracts/{id}/fee-schedule-items"
      - "POST /dso/payer-contracts/{payer_contract_id}/activate-fee-schedule"
    description: "A contract already on the DSO schedule cannot be activated again or have its schedule extended."
  - priority: 16
    category: state
    check: "the SupplyPreferenceException is REQUESTED when decided, the VendorConsolidation is PLANNED when finalized, and the ClinicalQualityReview is OPEN when closed"
    error_id: ERR_INVALID_WORKFLOW_STATE
    http_status: 409
    applies_to:
      - "POST /dso/supply-preference-exceptions/{supply_preference_exception_id}/decide"
      - "POST /dso/vendor-consolidations/{vendor_consolidation_id}/finalize"
      - "POST /dso/clinical-quality-reviews/{clinical_quality_review_id}/close"
    description: "Shared terminal-state gate for the three single-decision workflows."
  - priority: 17
    category: state
    check: "the Practice reached by the operation has affiliation_status == AFFILIATED"
    error_id: ERR_PRACTICE_NOT_AFFILIATED
    http_status: 409
    applies_to:
      - "POST /dso/migration-batches/{migration_batch_id}/schedule-cutover"
      - "POST /dso/payer-contracts/{payer_contract_id}/activate-fee-schedule"
      - "POST /dso/payer-enrollments/{payer_enrollment_id}/submit"
      - "POST /dso/vendor-consolidations/{vendor_consolidation_id}/finalize"
      - "POST /dso/practices/{practice_id}/standardize-staffing"
      - "POST /dso/doctor-employments/{doctor_employment_id}/harmonize-compensation"
    description: "Pre-close practices accept setup writes only; integration operations require the affiliation to have closed."
  - priority: 18
    category: state
    check: "the Practice's derived integration_posture permits the operation (schedule-cutover, activate-fee-schedule, finalize, standardize-staffing and harmonize-compensation require STABILIZING or INTEGRATED; enrollment submit requires any posture other than FROZEN; validate additionally accepts RESTRICTED)"
    error_id: ERR_PRACTICE_POSTURE_BLOCKED
    http_status: 409
    applies_to:
      - "POST /dso/migration-batches/{migration_batch_id}/schedule-cutover"
      - "POST /dso/migration-batches/{migration_batch_id}/validate"
      - "POST /dso/payer-contracts/{payer_contract_id}/activate-fee-schedule"
      - "POST /dso/payer-enrollments/{payer_enrollment_id}/submit"
      - "POST /dso/vendor-consolidations/{vendor_consolidation_id}/finalize"
      - "POST /dso/practices/{practice_id}/standardize-staffing"
      - "POST /dso/doctor-employments/{doctor_employment_id}/harmonize-compensation"
    description: "Cross-entity gate on a field the client never writes: the posture is derived by calculations.practice_posture from counters maintained by unrelated child entities."

  # --- business_safety ------------------------------------------------------
  - priority: 19
    category: business_safety
    check: "on POST /dso/doctor-employments, Doctor.license_state equals Practice.state_code"
    error_id: ERR_LICENSE_STATE_MISMATCH
    http_status: 422
    applies_to:
      - "POST /dso/doctor-employments"
    description: "A doctor may only be employed at a practice in the state that issued the license on file."
  - priority: 20
    category: business_safety
    check: "no ServiceLineItem whose service_domain is in CLINICAL_DOMAINS {TREATMENT_PLANNING, CLINICAL_SUPERVISION, DIAGNOSIS} may be added to a ServiceAgreement; and a ClinicalQualityReview may only be closed by a ClinicalDirector whose Doctor.license_state equals the reviewed practice's state_code"
    error_id: ERR_CORPORATE_PRACTICE_VIOLATION
    http_status: 422
    applies_to:
      - "POST /dso/service-agreements/{id}/line-items"
      - "POST /dso/clinical-quality-reviews/{clinical_quality_review_id}/close"
    description: "Corporate-practice-of-dentistry boundary: the non-clinical service agreement may never buy clinical judgement, and clinical oversight may only be exercised by a locally licensed clinician."
  - priority: 21
    category: business_safety
    check: "the ClinicalDirector closing a ClinicalQualityReview is not the same Doctor as the reviewed DoctorEmployment.doctor_id"
    error_id: ERR_SELF_REVIEW_PROHIBITED
    http_status: 422
    applies_to:
      - "POST /dso/clinical-quality-reviews/{clinical_quality_review_id}/close"
    description: "A clinician cannot sign off on the quality review of their own charts."
  - priority: 22
    category: business_safety
    check: "the X-User-ID settling an EarnoutTranche differs from EarnoutTranche.reserved_by_user_id"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to:
      - "POST /dso/earnout-tranches/{earnout_tranche_id}/settle"
    description: "Segregation of duties inside the single DsoFinanceController role: reserving and settling the same tranche require two distinct users."
  - priority: 23
    category: business_safety
    check: "the logical clock is strictly before DoctorEmployment.non_compete_end_date"
    error_id: ERR_NON_COMPETE_EXPIRED
    http_status: 422
    applies_to:
      - "POST /dso/doctor-employments/{doctor_employment_id}/enforce-non-compete"
    description: "A restrictive covenant cannot be enforced after its own term has run."

  # --- business_referential -------------------------------------------------
  - priority: 24
    category: business_referential
    check: "the Affiliation has at least one Practice"
    error_id: ERR_NO_TARGET_PRACTICE
    http_status: 422
    applies_to:
      - "POST /dso/affiliations/{affiliation_id}/advance-diligence"
    description: "Diligence cannot open on an affiliation with no target practice."
  - priority: 25
    category: business_referential
    check: "every Practice of the Affiliation has at least one DoctorEmployment in employment_status OFFERED"
    error_id: ERR_NO_POST_CLOSE_EMPLOYMENT
    http_status: 422
    applies_to:
      - "POST /dso/affiliations/{affiliation_id}/sign"
    description: "Signing requires post-close employment terms on the table at every target practice."
  - priority: 26
    category: business_referential
    check: "every Practice of the Affiliation has at least one ServiceAgreement in status EFFECTIVE (close); the batch's Practice has at least one EFFECTIVE ServiceAgreement (schedule-cutover)"
    error_id: ERR_SERVICE_AGREEMENT_NOT_EFFECTIVE
    http_status: 422
    applies_to:
      - "POST /dso/affiliations/{affiliation_id}/close"
      - "POST /dso/migration-batches/{migration_batch_id}/schedule-cutover"
    description: "No non-clinical services may be rendered, and no system conversion started, before the management services agreement is effective."
  - priority: 27
    category: business_referential
    check: "ServiceAgreement.line_item_count >= 1"
    error_id: ERR_SERVICE_SCOPE_EMPTY
    http_status: 422
    applies_to:
      - "POST /dso/service-agreements/{service_agreement_id}/submit-legal-review"
    description: "An agreement with no scope lines cannot enter legal review."
  - priority: 28
    category: business_referential
    check: "PayerContract.fee_schedule_item_count >= 1"
    error_id: ERR_FEE_SCHEDULE_EMPTY
    http_status: 422
    applies_to:
      - "POST /dso/payer-contracts/{payer_contract_id}/activate-fee-schedule"
    description: "A DSO fee schedule with no priced procedures cannot be activated."
  - priority: 29
    category: business_referential
    check: "the PayerContract has at least one PayerEnrollment and every one of them is in status APPROVED"
    error_id: ERR_ENROLLMENTS_NOT_APPROVED
    http_status: 422
    applies_to:
      - "POST /dso/payer-contracts/{payer_contract_id}/activate-fee-schedule"
    description: "Deliberately ordered above the lead-time check at priority 34 so that a contract that is both un-credentialed and short on lead time reports the referential failure."

  # --- business_temporal ----------------------------------------------------
  - priority: 30
    category: business_temporal
    check: "the requested [effective_date, term_date) interval does not overlap the interval of any existing PayerEnrollment for the same (payer_contract_id, doctor_employment_id) pair whose status is SUBMITTED or APPROVED; a null term_date is treated as 9999-12-31T00:00:00Z; adjacency (new.effective_date == existing.term_date) is allowed"
    error_id: ERR_ENROLLMENT_PERIOD_OVERLAP
    http_status: 409
    applies_to:
      - "POST /dso/payer-enrollments"
    description: "Half-open interval semantics on a payer/doctor pair. NOT_STARTED, DENIED and SUSPENDED rows are excluded from the occupancy set."
  - priority: 31
    category: business_temporal
    check: "the requested closed cutover window [cutover_start_at, cutover_end_at] is separated from every existing SCHEDULED or HELD MigrationBatch window of the SAME Practice by at least CUTOVER_BUFFER_HOURS (48): new.cutover_start_at >= existing.cutover_end_at + 48h OR new.cutover_end_at + 48h <= existing.cutover_start_at"
    error_id: ERR_CUTOVER_WINDOW_CONFLICT
    http_status: 409
    applies_to:
      - "POST /dso/migration-batches/{migration_batch_id}/schedule-cutover"
    description: "Closed-interval semantics with a mandatory 48-hour buffer: a gap of exactly 48 hours is allowed, 47 hours 59 minutes is not. Ordered above the vendor capacity check at priority 37."
  - priority: 32
    category: business_temporal
    check: "the requested [measurement_start, measurement_end) interval does not overlap the interval of any existing EarnoutTranche of the same Affiliation whose status is not CLAWED_BACK; adjacency is allowed"
    error_id: ERR_MEASUREMENT_PERIOD_OVERLAP
    http_status: 409
    applies_to:
      - "POST /dso/earnout-tranches"
    description: "Earn-out measurement periods may abut but never overlap; a clawed-back tranche releases its period."
  - priority: 33
    category: business_temporal
    check: "the logical clock is greater than or equal to MigrationBatch.cutover_start_at"
    error_id: ERR_CUTOVER_WINDOW_NOT_STARTED
    http_status: 409
    applies_to:
      - "POST /dso/migration-batches/{migration_batch_id}/validate"
    description: "Chart validation cannot report results before its own cutover window opens."
  - priority: 34
    category: business_temporal
    check: "every PayerEnrollment of the contract has lead_days >= CREDENTIALING_LEAD_DAYS (90) per calculations.credentialing_lead_time"
    error_id: ERR_CREDENTIALING_LEAD_TIME_SHORT
    http_status: 422
    applies_to:
      - "POST /dso/payer-contracts/{payer_contract_id}/activate-fee-schedule"
    description: "Boundary rule: exactly 90 days passes, 89 fails. Deliberately ordered below the approval check at priority 29."
  - priority: 35
    category: business_temporal
    check: "for the PROVISIONAL variant, the logical clock is strictly after EarnoutTranche.measurement_start so that days_elapsed >= 1"
    error_id: ERR_MEASUREMENT_PERIOD_NOT_STARTED
    http_status: 422
    applies_to:
      - "POST /dso/earnout-tranches/{earnout_tranche_id}/reserve"
    description: "Annualization requires at least one elapsed day; a zero denominator is rejected rather than defaulted."
  - priority: 36
    category: business_temporal
    check: "the requested clock value is greater than or equal to the current logical clock"
    error_id: ERR_CLOCK_NOT_MONOTONIC
    http_status: 422
    applies_to:
      - "POST /dso/_clock/set_current_utc"
    description: "The logical clock never moves backwards; equal values are accepted as no-ops."

  # --- business_constraint --------------------------------------------------
  - priority: 37
    category: business_constraint
    check: "the number of MigrationBatch rows in status SCHEDULED or HELD on the same ConversionVendor whose closed window intersects the requested closed window is strictly less than ConversionVendor.max_concurrent_windows"
    error_id: ERR_VENDOR_WINDOW_CAPACITY
    http_status: 409
    applies_to:
      - "POST /dso/migration-batches/{migration_batch_id}/schedule-cutover"
    description: "Aggregate capacity across practices sharing a conversion vendor. Each individual window may be legal while the collective exceeds the vendor's crew count."
  - priority: 38
    category: business_constraint
    check: "quarantined_count <= MigrationBatch.records_total"
    error_id: ERR_QUARANTINE_COUNT_EXCEEDS_TOTAL
    http_status: 422
    applies_to:
      - "POST /dso/migration-batches/{migration_batch_id}/validate"
    description: "A batch cannot quarantine more records than it staged."
  - priority: 39
    category: business_constraint
    check: "charts_sampled >= MIN_CHARTS_SAMPLED (20)"
    error_id: ERR_SAMPLE_SIZE_TOO_SMALL
    http_status: 422
    applies_to:
      - "POST /dso/clinical-quality-reviews"
    description: "A quality score is not computed on a sample below the statistical floor. Exactly 20 charts is acceptable."
  - priority: 40
    category: business_constraint
    check: "Doctor.npi is unique across all Doctor rows"
    error_id: ERR_DUPLICATE_NPI
    http_status: 409
    applies_to:
      - "POST /dso/doctors"
    description: "One NPI, one doctor record."
  - priority: 41
    category: business_constraint
    check: "FeeScheduleItem.procedure_code is unique within its PayerContract"
    error_id: ERR_DUPLICATE_PROCEDURE_CODE
    http_status: 409
    applies_to:
      - "POST /dso/payer-contracts/{id}/fee-schedule-items"
    description: "Scoped uniqueness; the same procedure code may appear once per contract."
  - priority: 42
    category: business_constraint
    check: "ServiceLineItem.service_code is unique within its ServiceAgreement"
    error_id: ERR_DUPLICATE_SERVICE_CODE
    http_status: 409
    applies_to:
      - "POST /dso/service-agreements/{id}/line-items"
    description: "Scoped uniqueness; the same service code may appear once per agreement."
  - priority: 43
    category: business_constraint
    check: "Affiliation.repricing_round < MAX_REPRICING_ROUNDS (2)"
    error_id: ERR_REPRICING_LIMIT_REACHED
    http_status: 422
    applies_to:
      - "POST /dso/affiliations/{affiliation_id}/reprice"
    description: "Termination condition of the DILIGENCE -> DRAFT cycle: at most two repricing rounds."
  - priority: 44
    category: business_constraint
    check: "no EarnoutTranche exists for the Affiliation"
    error_id: ERR_EARNOUT_POOL_LOCKED
    http_status: 409
    applies_to:
      - "POST /dso/affiliations/{affiliation_id}/reprice"
    description: "Once a tranche has been projected against the pool, the pool size can no longer be repriced."
  - priority: 45
    category: business_constraint
    check: "the requested close outcome is consistent with the stored score: CLOSED_NO_FINDINGS requires score_bps == 10000; CLOSED_WITH_PLAN requires score_bps >= QUALITY_ESCALATION_THRESHOLD_BPS (8000); ESCALATED is always permitted"
    error_id: ERR_QUALITY_OUTCOME_MISMATCH
    http_status: 422
    applies_to:
      - "POST /dso/clinical-quality-reviews/{clinical_quality_review_id}/close"
    description: "Boundary rule: a score of exactly 8000 may close with a plan, 7999 must escalate."
  - priority: 46
    category: business_constraint
    check: "fte_hygiene_ratio_bps is within [MIN_HYGIENE_RATIO_BPS (8000), MAX_HYGIENE_RATIO_BPS (25000)]"
    error_id: ERR_STAFFING_RATIO_OUT_OF_RANGE
    http_status: 422
    applies_to:
      - "POST /dso/practices/{practice_id}/standardize-staffing"
    description: "Both bounds are inclusive; 8000 and 25000 are accepted."

  # --- business_fiscal ------------------------------------------------------
  - priority: 47
    category: business_fiscal
    check: "ServiceAgreement.mgmt_fee_bps <= MAX_MGMT_FEE_BPS (2000)"
    error_id: ERR_MGMT_FEE_CAP_EXCEEDED
    http_status: 422
    applies_to:
      - "POST /dso/service-agreements/{service_agreement_id}/make-effective"
    description: "The management fee is capped at 20% of collections; exactly 2000 bps is allowed."
  - priority: 48
    category: business_fiscal
    check: "calculations.fee_schedule_blended_impact returns blended_impact_cents > MATERIAL_EROSION_THRESHOLD_CENTS (-500000), or the request carries erosion_override_ack == true"
    error_id: ERR_FEE_EROSION_MATERIAL
    http_status: 422
    applies_to:
      - "POST /dso/payer-contracts/{payer_contract_id}/activate-fee-schedule"
    description: "Material fee erosion requires an explicit acknowledgement; an impact of exactly -500000 cents is material."
  - priority: 49
    category: business_fiscal
    check: "the payout produced by calculations.earnout_payout does not exceed the available pool (reserve: raw <= Affiliation.earnout_unallocated_cents; settle: raw <= Affiliation.earnout_unallocated_cents + tranche.reserved_cents)"
    error_id: ERR_EARNOUT_POOL_EXCEEDED
    http_status: 422
    applies_to:
      - "POST /dso/earnout-tranches/{earnout_tranche_id}/reserve"
      - "POST /dso/earnout-tranches/{earnout_tranche_id}/settle"
    description: "Pool conservation guard of calculations.earnout_pool_ledger. Deliberately the lowest-priority fiscal check so a stale or wrongly-staged tranche reports its state error first."
  - priority: 50
    category: business_fiscal
    check: "the harmonized annual compensation does not exceed legacy_annual_comp_cents * (10000 + MAX_COMP_UPLIFT_BPS) / 10000 with MAX_COMP_UPLIFT_BPS = 2500"
    error_id: ERR_COMP_HARMONIZATION_CAP_EXCEEDED
    http_status: 422
    applies_to:
      - "POST /dso/doctor-employments/{doctor_employment_id}/harmonize-compensation"
    description: "Compensation harmonization may not raise a legacy package by more than 25%; the calculation runs first and its result is then bounded."

# =============================================================================
# §1.5 API Endpoint Table
# Every path is rooted at api_prefix /dso. `input:` lists request-body fields for
# writes and query parameters for reads; a trailing `?` marks an optional field.
# =============================================================================
endpoints:

  # --- Affiliation ----------------------------------------------------------
  - method: POST
    path: "/dso/affiliations"
    description: "Open an affiliation transaction file for a target dental group."
    roles: [DsoDealCounsel]
    code: 201
    input: [seller_group_name, purchase_price_cents, earnout_pool_cents, baseline_ebitda_cents, baseline_net_collections_cents, post_close_doctor_term_months]
    output: Affiliation
    side_effects:
      - "status = DRAFT, repricing_round = 0, practice_count = 0"
      - "earnout_reserved_cents = 0, earnout_settled_cents = 0, earnout_unallocated_cents = earnout_pool_cents"
      - "earnout_measurement_state = NOT_OPEN"
  - method: GET
    path: "/dso/affiliations/{affiliation_id}"
    description: "Read one affiliation, including the three earn-out pool buckets."
    roles: [DsoDealCounsel, DsoIntegrationLead, DsoFinanceController, ClinicalDirector, Dentist]
    code: 200
    input: []
    output: Affiliation
    side_effects: []
  - method: GET
    path: "/dso/affiliations"
    description: "List affiliations with optional status filter and pagination."
    roles: [DsoDealCounsel, DsoIntegrationLead, DsoFinanceController]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: Affiliation[]
    side_effects: []
  - method: POST
    path: "/dso/affiliations/{affiliation_id}/advance-diligence"
    description: "Move a DRAFT affiliation into DILIGENCE."
    roles: [DsoDealCounsel]
    code: 200
    input: []
    output: Affiliation
    side_effects:
      - "status DRAFT -> DILIGENCE, diligence_opened_at = logical clock"
      - "increments Affiliation.version by 1"
  - method: POST
    path: "/dso/affiliations/{affiliation_id}/reprice"
    description: "Reprice a deal in diligence, returning it to DRAFT for re-execution."
    roles: [DsoDealCounsel]
    code: 200
    input: [purchase_price_cents, earnout_pool_cents, "reprice_note?"]
    output: Affiliation
    side_effects:
      - "status DILIGENCE -> DRAFT, repricing_round += 1"
      - "recomputes earnout_unallocated_cents via calculations.earnout_pool_ledger"
      - "increments Affiliation.version by 1"
  - method: POST
    path: "/dso/affiliations/{affiliation_id}/sign"
    description: "Sign the affiliation agreement."
    roles: [DsoDealCounsel]
    code: 200
    input: ["signature_note?"]
    output: Affiliation
    side_effects:
      - "status DILIGENCE -> SIGNED, signed_date = logical clock"
      - "increments Affiliation.version by 1"
  - method: POST
    path: "/dso/affiliations/{affiliation_id}/close"
    description: "Close the transaction and run the five-hop post-close integration cascade."
    roles: [DsoIntegrationLead]
    code: 200
    input: ["close_note?"]
    output: Affiliation
    side_effects:
      - "status SIGNED -> CLOSED, close_date = logical clock, earnout_measurement_state = OPEN"
      - "every Practice of the affiliation: affiliation_status = AFFILIATED, integration_posture recomputed"
      - "accepted OFFERED DoctorEmployments -> ACTIVE and Practice.active_doctor_count increased; unaccepted -> LAPSED"
      - "one PayerEnrollment per newly ACTIVE employment per LEGACY PayerContract of its practice, status NOT_STARTED"
      - "PayerContracts whose enrollment_open_count leaves 0 -> PENDING_CREDENTIALING"
      - "increments Affiliation.version by 1 and the version of every touched Practice, DoctorEmployment and PayerContract"

  # --- ConversionVendor -----------------------------------------------------
  - method: POST
    path: "/dso/conversion-vendors"
    description: "Register a practice-management-system conversion vendor and its crew capacity."
    roles: [DsoIntegrationLead]
    code: 201
    input: [name, max_concurrent_windows]
    output: ConversionVendor
    side_effects:
      - "active_window_count = 0"
  - method: GET
    path: "/dso/conversion-vendors/{conversion_vendor_id}"
    description: "Read one conversion vendor, including its live window count."
    roles: [DsoIntegrationLead, DsoDealCounsel, DsoFinanceController]
    code: 200
    input: []
    output: ConversionVendor
    side_effects: []

  # --- Practice -------------------------------------------------------------
  - method: POST
    path: "/dso/practices"
    description: "Add a target practice to an affiliation and bind it to a conversion vendor."
    roles: [DsoDealCounsel, DsoIntegrationLead]
    code: 201
    input: [affiliation_id, conversion_vendor_id, name, state_code, charts_total_expected]
    output: Practice
    side_effects:
      - "affiliation_status = PENDING, integration_posture = PRE_CLOSE, staffing_model_state = LEGACY"
      - "all six integration counters = 0, clinical_coverage_gap = false"
      - "increments Affiliation.practice_count by 1 and Affiliation.version by 1"
  - method: GET
    path: "/dso/practices/{practice_id}"
    description: "Read one practice, including the derived integration_posture and all integration counters."
    roles: [DsoDealCounsel, DsoIntegrationLead, DsoFinanceController, ClinicalDirector, Dentist]
    code: 200
    input: []
    output: Practice
    side_effects: []
  - method: GET
    path: "/dso/practices"
    description: "List practices, filterable by owning affiliation, conversion vendor or derived posture."
    roles: [DsoDealCounsel, DsoIntegrationLead, DsoFinanceController]
    code: 200
    input: ["affiliation_id?", "conversion_vendor_id?", "integration_posture?", "limit?", "offset?"]
    output: Practice[]
    side_effects: []
  - method: POST
    path: "/dso/practices/{practice_id}/standardize-staffing"
    description: "Adopt the DSO standard staffing model and hygiene FTE ratio at an integrated practice."
    roles: [DsoIntegrationLead]
    code: 200
    input: [fte_hygiene_ratio_bps]
    output: Practice
    side_effects:
      - "staffing_model_state LEGACY -> STANDARDIZED, fte_hygiene_ratio_bps stored"
      - "increments Practice.version by 1"
  - method: GET
    path: "/dso/practices/{id}/vendor-consolidations"
    description: "List the supply and lab consolidation plans of one practice."
    roles: [DsoIntegrationLead, DsoFinanceController, ClinicalDirector]
    code: 200
    input: ["limit?", "offset?"]
    output: VendorConsolidation[]
    side_effects: []

  # --- Doctor ---------------------------------------------------------------
  - method: POST
    path: "/dso/doctors"
    description: "Register a doctor with NPI and state licensure."
    roles: [DsoDealCounsel, DsoIntegrationLead]
    code: 201
    input: [full_name, npi, license_number, license_state, "specialty?", "is_seller_owner?"]
    output: Doctor
    side_effects: []
  - method: GET
    path: "/dso/doctors/{doctor_id}"
    description: "Read one doctor record."
    roles: [DsoDealCounsel, DsoIntegrationLead, DsoFinanceController, ClinicalDirector, Dentist]
    code: 200
    input: []
    output: Doctor
    side_effects: []

  # --- DoctorEmployment ----------------------------------------------------
  - method: POST
    path: "/dso/doctor-employments"
    description: "Offer post-close employment terms, including the restrictive covenant, to a doctor at a practice."
    roles: [DsoIntegrationLead]
    code: 201
    input: [practice_id, doctor_id, base_salary_monthly_cents, collections_pct_bps, "comp_model?", legacy_annual_comp_cents, post_close_term_months, non_compete_months, non_compete_radius_miles]
    output: DoctorEmployment
    side_effects:
      - "employment_status = OFFERED, offer_accepted = false"
      - "credentialing_status = PENDING, records_custody_state = HELD_BY_PRACTICE, non_compete_enforcement_state = NOT_APPLICABLE"
      - "is_harmonized = false"
  - method: GET
    path: "/dso/doctor-employments/{doctor_employment_id}"
    description: "Read one employment row, including all three parallel state dimensions."
    roles: [DsoDealCounsel, DsoIntegrationLead, DsoFinanceController, ClinicalDirector, Dentist]
    code: 200
    input: []
    output: DoctorEmployment
    side_effects: []
  - method: GET
    path: "/dso/doctor-employments"
    description: "List employment rows, filterable by practice, doctor or employment status."
    roles: [DsoDealCounsel, DsoIntegrationLead, DsoFinanceController, ClinicalDirector]
    code: 200
    input: ["practice_id?", "doctor_id?", "employment_status?", "limit?", "offset?"]
    output: DoctorEmployment[]
    side_effects: []
  - method: POST
    path: "/dso/doctor-employments/{doctor_employment_id}/accept-offer"
    description: "Doctor accepts the post-close employment offer. Pre-close this only records acceptance; post-close it activates the employment immediately."
    roles: [Dentist]
    code: 200
    input: []
    output: DoctorEmployment
    side_effects:
      - "sets offer_accepted = true"
      - "when the affiliation is already CLOSED: employment_status OFFERED -> ACTIVE, comp_effective_date = logical clock, Practice.active_doctor_count += 1, posture recomputed, HELD batches and SUSPENDED enrollments released"
      - "increments DoctorEmployment.version by 1"
  - method: POST
    path: "/dso/doctor-employments/{doctor_employment_id}/harmonize-compensation"
    description: "Harmonize a legacy compensation package onto the DSO model using the employment's comp_model variant."
    roles: [DsoFinanceController]
    code: 200
    input: [monthly_collections_cents]
    output: DoctorEmployment
    side_effects:
      - "runs calculations.doctor_compensation and stores harmonized_annual_comp_cents and harmonization_delta_cents"
      - "sets is_harmonized = true"
      - "increments DoctorEmployment.version by 1"
  - method: POST
    path: "/dso/doctor-employments/{doctor_employment_id}/separate"
    description: "Record a doctor departure and run the five-hop departure cascade."
    roles: [DsoIntegrationLead, Dentist]
    code: 200
    input: [separation_reason]
    output: DoctorEmployment
    side_effects:
      - "employment_status ACTIVE -> SEPARATED, separation_date = logical clock, non_compete_end_date = separation_date + non_compete_months months"
      - "records_custody_state HELD_BY_PRACTICE -> TRANSFER_PENDING, non_compete_enforcement_state NOT_APPLICABLE -> PENDING"
      - "Practice.active_doctor_count -= 1 and posture recomputed (possibly FROZEN with clinical_coverage_gap = true)"
      - "on FROZEN: SCHEDULED batches -> HELD (vendor.active_window_count -= 1), SUBMITTED enrollments -> SUSPENDED, contract enrollment_open_count -= 1, contracts falling to 0 revert to LEGACY, Affiliation.earnout_measurement_state = SUSPENDED"
      - "increments DoctorEmployment.version by 1 and the version of every touched row"
  - method: POST
    path: "/dso/doctor-employments/{doctor_employment_id}/records-custody-transfer"
    description: "Transfer patient-records custody for a departed doctor."
    roles: [ClinicalDirector]
    code: 200
    input: ["custodian_note?"]
    output: DoctorEmployment
    side_effects:
      - "records_custody_state TRANSFER_PENDING -> TRANSFERRED, leaving employment_status and credentialing_status untouched"
      - "increments DoctorEmployment.version by 1"
  - method: POST
    path: "/dso/doctor-employments/{doctor_employment_id}/enforce-non-compete"
    description: "Assert the restrictive covenant against a departed doctor."
    roles: [DsoDealCounsel]
    code: 200
    input: ["enforcement_note?"]
    output: DoctorEmployment
    side_effects:
      - "non_compete_enforcement_state PENDING -> ENFORCED"
      - "increments DoctorEmployment.version by 1"
  - method: GET
    path: "/dso/doctor-employments/{id}/supply-preference-exceptions"
    description: "List the clinician preference exceptions requested by one employed doctor."
    roles: [DsoIntegrationLead, DsoFinanceController, ClinicalDirector, Dentist]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: SupplyPreferenceException[]
    side_effects: []
  - method: GET
    path: "/dso/doctor-employments/{id}/clinical-quality-reviews"
    description: "List the clinical quality reviews of one employed doctor."
    roles: [DsoIntegrationLead, ClinicalDirector, Dentist]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: ClinicalQualityReview[]
    side_effects: []

  # --- ServiceAgreement ----------------------------------------------------
  - method: POST
    path: "/dso/service-agreements"
    description: "Draft the non-clinical management services agreement for a practice."
    roles: [DsoDealCounsel]
    code: 201
    input: [practice_id, fee_model, mgmt_fee_bps]
    output: ServiceAgreement
    side_effects:
      - "status = DRAFT, review_round = 0, scope_findings_count = 0, line_item_count = 0"
  - method: GET
    path: "/dso/service-agreements/{service_agreement_id}"
    description: "Read one management services agreement."
    roles: [DsoDealCounsel, DsoIntegrationLead, DsoFinanceController]
    code: 200
    input: []
    output: ServiceAgreement
    side_effects: []
  - method: GET
    path: "/dso/service-agreements"
    description: "List management services agreements, filterable by practice and status."
    roles: [DsoDealCounsel, DsoIntegrationLead, DsoFinanceController]
    code: 200
    input: ["practice_id?", "status?", "limit?", "offset?"]
    output: ServiceAgreement[]
    side_effects: []
  - method: POST
    path: "/dso/service-agreements/{id}/line-items"
    description: "Add a non-clinical scope line to a draft agreement. Clinical service domains are refused."
    roles: [DsoDealCounsel]
    code: 201
    input: [service_code, service_domain, monthly_fee_cents]
    output: ServiceLineItem
    side_effects:
      - "sets is_clinical = false (a clinical domain never persists)"
      - "increments ServiceAgreement.line_item_count by 1 and ServiceAgreement.version by 1"
  - method: GET
    path: "/dso/service-agreements/{id}/line-items"
    description: "List the scope lines of one agreement."
    roles: [DsoDealCounsel, DsoIntegrationLead, DsoFinanceController, ClinicalDirector]
    code: 200
    input: ["limit?", "offset?"]
    output: ServiceLineItem[]
    side_effects: []
  - method: POST
    path: "/dso/service-agreements/{service_agreement_id}/submit-legal-review"
    description: "Submit the drafted scope for corporate-practice legal review."
    roles: [DsoDealCounsel]
    code: 200
    input: []
    output: ServiceAgreement
    side_effects:
      - "status DRAFT -> LEGAL_REVIEW, review_round += 1"
      - "increments ServiceAgreement.version by 1"
  - method: POST
    path: "/dso/service-agreements/{service_agreement_id}/reject-scope"
    description: "Return an agreement to drafting with scope findings."
    roles: [DsoDealCounsel]
    code: 200
    input: [finding_count, "finding_note?"]
    output: ServiceAgreement
    side_effects:
      - "status LEGAL_REVIEW -> DRAFT, scope_findings_count += finding_count"
      - "increments ServiceAgreement.version by 1"
  - method: POST
    path: "/dso/service-agreements/{service_agreement_id}/make-effective"
    description: "Make the management services agreement effective."
    roles: [DsoDealCounsel]
    code: 200
    input: []
    output: ServiceAgreement
    side_effects:
      - "status LEGAL_REVIEW -> EFFECTIVE, effective_date = logical clock"
      - "increments ServiceAgreement.version by 1"

  # --- MigrationBatch ------------------------------------------------------
  - method: POST
    path: "/dso/migration-batches"
    description: "Stage a chart-migration batch for a practice, superseding any earlier STAGED batch."
    roles: [DsoIntegrationLead]
    code: 201
    input: [practice_id, batch_label, records_total, expected_practice_version]
    output: MigrationBatch
    side_effects:
      - "status = STAGED, records_validated = 0, records_quarantined = 0, records_pending = records_total, remediation_round = 0"
      - "every earlier STAGED batch of the practice, in created_at ASC order, -> SUPERSEDED"
      - "increments Practice.version by 1"
  - method: GET
    path: "/dso/migration-batches/{migration_batch_id}"
    description: "Read one migration batch, including its cutover window and record ledger."
    roles: [DsoIntegrationLead, DsoDealCounsel, DsoFinanceController]
    code: 200
    input: []
    output: MigrationBatch
    side_effects: []
  - method: GET
    path: "/dso/migration-batches"
    description: "List migration batches, filterable by practice and status."
    roles: [DsoIntegrationLead, DsoDealCounsel, DsoFinanceController]
    code: 200
    input: ["practice_id?", "status?", "limit?", "offset?"]
    output: MigrationBatch[]
    side_effects: []
  - method: POST
    path: "/dso/migration-batches/{migration_batch_id}/schedule-cutover"
    description: "Reserve a conversion cutover window for a staged or remediated batch."
    roles: [DsoIntegrationLead]
    code: 200
    input: [cutover_start_at, cutover_end_at]
    output: MigrationBatch
    side_effects:
      - "status -> SCHEDULED with cutover_start_at and cutover_end_at stored"
      - "increments ConversionVendor.active_window_count by 1 and ConversionVendor.version by 1"
      - "increments MigrationBatch.version by 1"
  - method: POST
    path: "/dso/migration-batches/{migration_batch_id}/validate"
    description: "Report chart-validation results for a batch inside its cutover window."
    roles: [DsoIntegrationLead]
    code: 200
    input: [quarantined_count]
    output: MigrationBatch
    side_effects:
      - "runs calculations.chart_migration_validation and stores validation_error_rate_bps"
      - "within tolerance: status -> VALIDATED, records_validated = records_total - quarantined_count, Practice.charts_migrated_count increased"
      - "above tolerance: status -> QUARANTINED with whole-batch quarantine, Practice.quarantined_batch_count += 1, no chart credit"
      - "decrements ConversionVendor.active_window_count by 1"
      - "recomputes calculations.practice_posture and increments Practice.version by 1"
  - method: POST
    path: "/dso/migration-batches/{migration_batch_id}/remediate"
    description: "Return a quarantined batch to its reserved cutover window for another validation round."
    roles: [DsoIntegrationLead]
    code: 200
    input: ["remediation_note?"]
    output: MigrationBatch
    side_effects:
      - "status QUARANTINED -> SCHEDULED, remediation_round += 1, record counters reset"
      - "decrements Practice.quarantined_batch_count by 1 and recomputes posture"
      - "increments ConversionVendor.active_window_count by 1"
      - "increments MigrationBatch.version by 1 and Practice.version by 1"
  - method: POST
    path: "/dso/migration-batches/{migration_batch_id}/rollback"
    description: "Roll back a validated batch, reversing its chart credit with zero drift."
    roles: [DsoIntegrationLead]
    code: 200
    input: [rollback_reason]
    output: MigrationBatch
    side_effects:
      - "status VALIDATED -> QUARANTINED, records_validated zeroed and records_quarantined = records_total"
      - "Practice.charts_migrated_count reduced by exactly the rolled-back records_validated"
      - "Practice.quarantined_batch_count += 1, posture recomputed"
      - "increments MigrationBatch.version by 1 and Practice.version by 1"
  - method: POST
    path: "/dso/migration-batches/{migration_batch_id}/reconcile"
    description: "Freeze a validated batch after final reconciliation."
    roles: [DsoIntegrationLead]
    code: 200
    input: []
    output: MigrationBatch
    side_effects:
      - "status VALIDATED -> RECONCILED"
      - "increments MigrationBatch.version by 1"

  # --- PayerContract -------------------------------------------------------
  - method: POST
    path: "/dso/payer-contracts"
    description: "Register a payer contract held by a practice."
    roles: [DsoFinanceController]
    code: 201
    input: [practice_id, payer_name]
    output: PayerContract
    side_effects:
      - "transition_state = LEGACY, fee_schedule_item_count = 0, enrollment_open_count = 0, erosion_override_ack = false"
  - method: GET
    path: "/dso/payer-contracts/{payer_contract_id}"
    description: "Read one payer contract, including its blended fee-schedule impact."
    roles: [DsoFinanceController, DsoIntegrationLead, DsoDealCounsel]
    code: 200
    input: []
    output: PayerContract
    side_effects: []
  - method: GET
    path: "/dso/payer-contracts"
    description: "List payer contracts, filterable by practice and transition state."
    roles: [DsoFinanceController, DsoIntegrationLead, DsoDealCounsel]
    code: 200
    input: ["practice_id?", "transition_state?", "limit?", "offset?"]
    output: PayerContract[]
    side_effects: []
  - method: POST
    path: "/dso/payer-contracts/{id}/fee-schedule-items"
    description: "Price one procedure on both the legacy and the DSO schedule."
    roles: [DsoFinanceController]
    code: 201
    input: [procedure_code, legacy_allowed_cents, dso_allowed_cents, annual_volume]
    output: FeeScheduleItem
    side_effects:
      - "stores line_impact_cents per calculations.fee_schedule_blended_impact (rounded at the line)"
      - "increments PayerContract.fee_schedule_item_count by 1, recomputes PayerContract.blended_impact_cents and increments PayerContract.version by 1"
  - method: GET
    path: "/dso/payer-contracts/{id}/fee-schedule-items"
    description: "List the priced procedures of one payer contract with their stored line impacts."
    roles: [DsoFinanceController, DsoIntegrationLead, DsoDealCounsel]
    code: 200
    input: ["limit?", "offset?"]
    output: FeeScheduleItem[]
    side_effects: []
  - method: POST
    path: "/dso/payer-contracts/{payer_contract_id}/activate-fee-schedule"
    description: "Move a credentialed contract onto the DSO fee schedule."
    roles: [DsoFinanceController]
    code: 200
    input: [dso_schedule_effective_date, "erosion_override_ack?"]
    output: PayerContract
    side_effects:
      - "transition_state PENDING_CREDENTIALING -> DSO_SCHEDULE_ACTIVE, dso_schedule_effective_date stored"
      - "recomputes and stores blended_impact_cents, stores erosion_override_ack"
      - "increments PayerContract.version by 1"

  # --- PayerEnrollment -----------------------------------------------------
  - method: POST
    path: "/dso/payer-enrollments"
    description: "Open a credentialing enrollment for one doctor on one payer contract."
    roles: [DsoIntegrationLead]
    code: 201
    input: [payer_contract_id, doctor_employment_id, effective_date, "term_date?"]
    output: PayerEnrollment
    side_effects:
      - "status = NOT_STARTED, submission_round = 0, lead_days = null"
      - "increments PayerContract.enrollment_open_count by 1; a LEGACY contract moves to PENDING_CREDENTIALING"
      - "increments PayerContract.version by 1"
  - method: GET
    path: "/dso/payer-enrollments/{payer_enrollment_id}"
    description: "Read one credentialing enrollment, including its computed lead_days."
    roles: [DsoIntegrationLead, DsoFinanceController, DsoDealCounsel, ClinicalDirector]
    code: 200
    input: []
    output: PayerEnrollment
    side_effects: []
  - method: GET
    path: "/dso/payer-enrollments"
    description: "List credentialing enrollments, filterable by payer contract, employment or status."
    roles: [DsoIntegrationLead, DsoFinanceController, DsoDealCounsel, ClinicalDirector]
    code: 200
    input: ["payer_contract_id?", "doctor_employment_id?", "status?", "limit?", "offset?"]
    output: PayerEnrollment[]
    side_effects: []
  - method: POST
    path: "/dso/payer-enrollments/{payer_enrollment_id}/submit"
    description: "Submit or resubmit an enrollment to the payer."
    roles: [DsoIntegrationLead]
    code: 200
    input: []
    output: PayerEnrollment
    side_effects:
      - "status -> SUBMITTED, submitted_at = logical clock, submission_round += 1, lead_days per calculations.credentialing_lead_time"
      - "Practice.pending_credentialing_count += 1; a resubmission also decrements Practice.denied_enrollment_count by 1"
      - "recomputes DoctorEmployment.credentialing_status and calculations.practice_posture"
      - "increments PayerEnrollment.version by 1 and Practice.version by 1"
  - method: POST
    path: "/dso/payer-enrollments/{payer_enrollment_id}/decide"
    description: "Record the payer's credentialing decision."
    roles: [DsoIntegrationLead]
    code: 200
    input: [decision, "denial_reason?"]
    output: PayerEnrollment
    side_effects:
      - "APPROVE: status -> APPROVED, Practice.pending_credentialing_count -= 1, PayerContract.enrollment_open_count -= 1"
      - "DENY: status -> DENIED with denial_reason, Practice.pending_credentialing_count -= 1, Practice.denied_enrollment_count += 1, enrollment_open_count unchanged"
      - "recomputes DoctorEmployment.credentialing_status and calculations.practice_posture"
      - "increments PayerEnrollment.version by 1 and Practice.version by 1"

  # --- EarnoutTranche ------------------------------------------------------
  - method: POST
    path: "/dso/earnout-tranches"
    description: "Project an earn-out measurement period against the affiliation's pool."
    roles: [DsoFinanceController]
    code: 201
    input: [affiliation_id, period_label, measurement_start, measurement_end, expected_affiliation_version]
    output: EarnoutTranche
    side_effects:
      - "status = PROJECTED, variant_applied = null, reserved_cents = 0, awarded_cents = 0, clawed_back_cents = 0"
      - "increments Affiliation.version by 1"
  - method: GET
    path: "/dso/earnout-tranches/{earnout_tranche_id}"
    description: "Read one earn-out tranche, including which calculation variant was applied."
    roles: [DsoFinanceController, DsoDealCounsel, DsoIntegrationLead]
    code: 200
    input: []
    output: EarnoutTranche
    side_effects: []
  - method: GET
    path: "/dso/earnout-tranches"
    description: "List earn-out tranches, filterable by affiliation and status."
    roles: [DsoFinanceController, DsoDealCounsel, DsoIntegrationLead]
    code: 200
    input: ["affiliation_id?", "status?", "limit?", "offset?"]
    output: EarnoutTranche[]
    side_effects: []
  - method: POST
    path: "/dso/earnout-tranches/{earnout_tranche_id}/reserve"
    description: "Reserve the PROVISIONAL earn-out payout from partial-period figures."
    roles: [DsoFinanceController]
    code: 200
    input: [reported_net_collections_cents, reported_expenses_cents]
    output: EarnoutTranche
    side_effects:
      - "runs calculations.earnout_payout in the PROVISIONAL variant and stamps every intermediate figure"
      - "status PROJECTED -> RESERVED, reserved_cents = payout, reserved_by_user_id = X-User-ID, variant_applied = PROVISIONAL"
      - "moves cents from Affiliation.earnout_unallocated_cents to Affiliation.earnout_reserved_cents"
      - "increments EarnoutTranche.version by 1 and Affiliation.version by 1"
  - method: POST
    path: "/dso/earnout-tranches/{earnout_tranche_id}/settle"
    description: "Settle the tranche on FINAL full-period figures. Must be performed by a different user than the reservation."
    roles: [DsoFinanceController]
    code: 200
    input: [final_net_collections_cents, final_expenses_cents]
    output: EarnoutTranche
    side_effects:
      - "runs calculations.earnout_payout in the FINAL variant and stamps lag_holdback_cents and every intermediate figure"
      - "status RESERVED -> SETTLED, awarded_cents = payout, reserved_cents = 0, settled_by_user_id = X-User-ID, variant_applied = FINAL"
      - "releases the reservation and moves cents into Affiliation.earnout_settled_cents, keeping the pool identity exact"
      - "increments EarnoutTranche.version by 1 and Affiliation.version by 1"
  - method: POST
    path: "/dso/earnout-tranches/{earnout_tranche_id}/claw-back"
    description: "Claw back a settled tranche, returning the awarded cents to the unallocated pool."
    roles: [DsoFinanceController]
    code: 200
    input: [clawback_reason]
    output: EarnoutTranche
    side_effects:
      - "status SETTLED -> CLAWED_BACK, clawed_back_cents = awarded_cents, awarded_cents = 0"
      - "Affiliation.earnout_settled_cents reduced and earnout_unallocated_cents increased by exactly the same amount"
      - "increments EarnoutTranche.version by 1 and Affiliation.version by 1"

  # --- SupplyPreferenceException -------------------------------------------
  - method: POST
    path: "/dso/supply-preference-exceptions"
    description: "A doctor requests a clinician-preference exception to the DSO supply or lab formulary."
    roles: [Dentist]
    code: 201
    input: [doctor_employment_id, vendor_category, item_code, annual_qty, formulary_unit_cents, preferred_unit_cents, clinical_rationale]
    output: SupplyPreferenceException
    side_effects:
      - "status = REQUESTED, incremental_cost_cents = null"
  - method: GET
    path: "/dso/supply-preference-exceptions/{supply_preference_exception_id}"
    description: "Read one clinician-preference exception."
    roles: [DsoIntegrationLead, DsoFinanceController, ClinicalDirector, Dentist]
    code: 200
    input: []
    output: SupplyPreferenceException
    side_effects: []
  - method: POST
    path: "/dso/supply-preference-exceptions/{supply_preference_exception_id}/decide"
    description: "Clinical leadership approves or denies a preference exception."
    roles: [ClinicalDirector]
    code: 200
    input: [decision, "decision_note?"]
    output: SupplyPreferenceException
    side_effects:
      - "APPROVE: status -> APPROVED and incremental_cost_cents stamped, making the exception eligible for consolidation leakage"
      - "DENY: status -> DENIED and incremental_cost_cents stays null"
      - "sets decided_by_doctor_id = X-User-ID and increments SupplyPreferenceException.version by 1"

  # --- VendorConsolidation -------------------------------------------------
  - method: POST
    path: "/dso/vendor-consolidations"
    description: "Plan a supply or lab vendor consolidation for a practice."
    roles: [DsoIntegrationLead]
    code: 201
    input: [practice_id, vendor_category, baseline_annual_spend_cents, formulary_annual_spend_cents]
    output: VendorConsolidation
    side_effects:
      - "status = PLANNED, all savings figures null, exception_count_applied = 0"
  - method: GET
    path: "/dso/vendor-consolidations/{vendor_consolidation_id}"
    description: "Read one consolidation plan, including gross savings, leakage and projected savings."
    roles: [DsoIntegrationLead, DsoFinanceController, ClinicalDirector]
    code: 200
    input: []
    output: VendorConsolidation
    side_effects: []
  - method: POST
    path: "/dso/vendor-consolidations/{vendor_consolidation_id}/finalize"
    description: "Finalize the consolidation and book projected savings net of approved preference exceptions."
    roles: [DsoIntegrationLead]
    code: 200
    input: []
    output: VendorConsolidation
    side_effects:
      - "runs calculations.vendor_consolidation_savings and stores gross_savings_cents, exception_leakage_cents, exception_count_applied and projected_savings_cents"
      - "status PLANNED -> FINALIZED"
      - "increments VendorConsolidation.version by 1"

  # --- ClinicalQualityReview -----------------------------------------------
  - method: POST
    path: "/dso/clinical-quality-reviews"
    description: "Open a clinical quality and treatment-planning review over a sample of one doctor's charts."
    roles: [ClinicalDirector]
    code: 201
    input: [doctor_employment_id, period_label, charts_sampled, charts_with_findings, treatment_plan_overrides]
    output: ClinicalQualityReview
    side_effects:
      - "status = OPEN"
      - "runs calculations.clinical_quality_score and stores finding_rate_bps, override_rate_bps and score_bps"
  - method: GET
    path: "/dso/clinical-quality-reviews/{clinical_quality_review_id}"
    description: "Read one clinical quality review, including its weighted score."
    roles: [DsoIntegrationLead, ClinicalDirector, Dentist]
    code: 200
    input: []
    output: ClinicalQualityReview
    side_effects: []
  - method: POST
    path: "/dso/clinical-quality-reviews/{clinical_quality_review_id}/close"
    description: "Close a quality review with an outcome consistent with its score, or escalate it."
    roles: [ClinicalDirector]
    code: 200
    input: [outcome, "outcome_note?"]
    output: ClinicalQualityReview
    side_effects:
      - "status OPEN -> CLOSED_NO_FINDINGS | CLOSED_WITH_PLAN | ESCALATED per the requested outcome"
      - "sets closed_by_doctor_id = X-User-ID and outcome_note"
      - "increments ClinicalQualityReview.version by 1"

  # --- test-driving endpoint -----------------------------------------------
  - method: POST
    path: "/dso/_clock/set_current_utc"
    description: "Set the server's logical UTC clock. Before any call, the logical clock reads exactly 2026-08-01T00:00:00Z and never falls back to real wall-clock time. The clock may only move forward or stay equal."
    roles: [DsoDealCounsel, DsoIntegrationLead, DsoFinanceController, ClinicalDirector, Dentist]
    code: 200
    input: [current_utc]
    output: null
    side_effects:
      - "every subsequent timestamp field, lead-time computation, annualization denominator and window check reads the new value"

# =============================================================================
# §1.6 Error Code Catalog — 60 codes, every one triggerable from §1.5
# =============================================================================
errors:

  # --- auth ---
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-ID or X-User-Role header missing or empty"
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "X-User-Role is unknown, is not listed in the endpoint's roles, or is an entity-backed role whose X-User-ID does not resolve to a Doctor row"

  # --- not found ---
  - id: ERR_AFFILIATION_NOT_FOUND
    http: 404
    condition: "affiliation_id in the path or body does not exist"
  - id: ERR_PRACTICE_NOT_FOUND
    http: 404
    condition: "practice_id in the path or body does not exist"
  - id: ERR_DOCTOR_NOT_FOUND
    http: 404
    condition: "doctor_id in the path or body does not exist"
  - id: ERR_CONVERSION_VENDOR_NOT_FOUND
    http: 404
    condition: "conversion_vendor_id in the path or body does not exist"
  - id: ERR_DOCTOR_EMPLOYMENT_NOT_FOUND
    http: 404
    condition: "doctor_employment_id in the path or body does not exist"
  - id: ERR_SERVICE_AGREEMENT_NOT_FOUND
    http: 404
    condition: "service_agreement_id in the path does not exist"
  - id: ERR_MIGRATION_BATCH_NOT_FOUND
    http: 404
    condition: "migration_batch_id in the path does not exist"
  - id: ERR_PAYER_CONTRACT_NOT_FOUND
    http: 404
    condition: "payer_contract_id in the path or body does not exist"
  - id: ERR_PAYER_ENROLLMENT_NOT_FOUND
    http: 404
    condition: "payer_enrollment_id in the path does not exist"
  - id: ERR_EARNOUT_TRANCHE_NOT_FOUND
    http: 404
    condition: "earnout_tranche_id in the path does not exist"
  - id: ERR_SUPPLY_EXCEPTION_NOT_FOUND
    http: 404
    condition: "supply_preference_exception_id in the path does not exist"
  - id: ERR_VENDOR_CONSOLIDATION_NOT_FOUND
    http: 404
    condition: "vendor_consolidation_id in the path does not exist"
  - id: ERR_QUALITY_REVIEW_NOT_FOUND
    http: 404
    condition: "clinical_quality_review_id in the path does not exist"

  # --- payload ---
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "missing required body field, wrong type, undeclared enum value, out-of-range integer, malformed timestamp, monthly_collections_cents not exactly 12 entries, non-positive interval, DENY without denial_reason, or pagination limit outside 1..100"

  # --- optimistic concurrency ---
  - id: ERR_STALE_AFFILIATION_VERSION
    http: 412
    condition: "expected_affiliation_version on POST /dso/earnout-tranches does not equal the current Affiliation.version"
  - id: ERR_STALE_PRACTICE_VERSION
    http: 412
    condition: "expected_practice_version on POST /dso/migration-batches does not equal the current Practice.version"

  # --- state ---
  - id: ERR_INVALID_AFFILIATION_STATE
    http: 409
    condition: "the Affiliation status (or its earnout_measurement_state) does not permit the requested operation"
  - id: ERR_INVALID_TRANCHE_STATE
    http: 409
    condition: "the EarnoutTranche is not in the status the reserve, settle or claw-back operation requires"
  - id: ERR_INVALID_EMPLOYMENT_STATE
    http: 409
    condition: "the DoctorEmployment dimension addressed by the operation is not in the required state, including an already-accepted offer, a non-ACTIVE employment, or a custody state other than TRANSFER_PENDING"
  - id: ERR_INVALID_BATCH_STATE
    http: 409
    condition: "the MigrationBatch is not in the status the schedule, validate, remediate, rollback or reconcile operation requires, or reconcile was attempted with records_pending > 0"
  - id: ERR_INVALID_ENROLLMENT_STATE
    http: 409
    condition: "the PayerEnrollment is not in the status the submit or decide operation requires, including an attempt to act on a SUSPENDED enrollment"
  - id: ERR_INVALID_AGREEMENT_STATE
    http: 409
    condition: "the ServiceAgreement is not in the status the operation requires, including any scope edit after it became EFFECTIVE"
  - id: ERR_INVALID_CONTRACT_STATE
    http: 409
    condition: "the PayerContract transition_state does not permit pricing or activation"
  - id: ERR_INVALID_WORKFLOW_STATE
    http: 409
    condition: "the SupplyPreferenceException is not REQUESTED, the VendorConsolidation is not PLANNED, or the ClinicalQualityReview is not OPEN"
  - id: ERR_PRACTICE_NOT_AFFILIATED
    http: 409
    condition: "the practice reached by the operation still has affiliation_status PENDING because its affiliation has not closed"
  - id: ERR_PRACTICE_POSTURE_BLOCKED
    http: 409
    condition: "the practice's derived integration_posture (PRE_CLOSE, RESTRICTED or FROZEN) blocks the requested integration operation"

  # --- safety / compliance ---
  - id: ERR_LICENSE_STATE_MISMATCH
    http: 422
    condition: "the doctor's license_state does not equal the employing practice's state_code"
  - id: ERR_CORPORATE_PRACTICE_VIOLATION
    http: 422
    condition: "a clinical service_domain was requested on a non-clinical management services agreement, or a quality review was closed by a director not licensed in the practice's state"
  - id: ERR_SELF_REVIEW_PROHIBITED
    http: 422
    condition: "the ClinicalDirector closing a quality review is the same Doctor as the reviewed employment's doctor"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "the user settling an earn-out tranche is the same user who reserved it"
  - id: ERR_NON_COMPETE_EXPIRED
    http: 422
    condition: "non-compete enforcement was requested at or after non_compete_end_date"

  # --- referential business rules ---
  - id: ERR_NO_TARGET_PRACTICE
    http: 422
    condition: "diligence was opened on an affiliation with no practice"
  - id: ERR_NO_POST_CLOSE_EMPLOYMENT
    http: 422
    condition: "a practice of the affiliation has no OFFERED doctor employment at signing"
  - id: ERR_SERVICE_AGREEMENT_NOT_EFFECTIVE
    http: 422
    condition: "closing or scheduling a cutover while the practice has no EFFECTIVE management services agreement"
  - id: ERR_SERVICE_SCOPE_EMPTY
    http: 422
    condition: "legal review was requested on an agreement with no scope lines"
  - id: ERR_FEE_SCHEDULE_EMPTY
    http: 422
    condition: "activation was requested on a payer contract with no priced procedures"
  - id: ERR_ENROLLMENTS_NOT_APPROVED
    http: 422
    condition: "the payer contract has no enrollments, or at least one enrollment is not APPROVED"

  # --- temporal business rules ---
  - id: ERR_ENROLLMENT_PERIOD_OVERLAP
    http: 409
    condition: "the requested half-open enrollment interval overlaps an existing SUBMITTED or APPROVED enrollment for the same payer contract and employment"
  - id: ERR_CUTOVER_WINDOW_CONFLICT
    http: 409
    condition: "the requested closed cutover window is within 48 hours of another SCHEDULED or HELD window of the same practice"
  - id: ERR_MEASUREMENT_PERIOD_OVERLAP
    http: 409
    condition: "the requested earn-out measurement period overlaps an existing non-clawed-back tranche of the same affiliation"
  - id: ERR_CUTOVER_WINDOW_NOT_STARTED
    http: 409
    condition: "validation was reported before the batch's cutover window opened"
  - id: ERR_CREDENTIALING_LEAD_TIME_SHORT
    http: 422
    condition: "an enrollment of the contract has fewer than 90 whole days between submission and the requested effective date"
  - id: ERR_MEASUREMENT_PERIOD_NOT_STARTED
    http: 422
    condition: "a PROVISIONAL reservation was requested with zero or negative elapsed days since measurement_start"
  - id: ERR_CLOCK_NOT_MONOTONIC
    http: 422
    condition: "the requested logical clock value is earlier than the current logical clock"

  # --- constraint business rules ---
  - id: ERR_VENDOR_WINDOW_CAPACITY
    http: 409
    condition: "the conversion vendor already has max_concurrent_windows intersecting windows across the practices it serves"
  - id: ERR_QUARANTINE_COUNT_EXCEEDS_TOTAL
    http: 422
    condition: "quarantined_count exceeds the batch's records_total"
  - id: ERR_SAMPLE_SIZE_TOO_SMALL
    http: 422
    condition: "charts_sampled is below the statistical floor of 20"
  - id: ERR_DUPLICATE_NPI
    http: 409
    condition: "another Doctor already holds the submitted NPI"
  - id: ERR_DUPLICATE_PROCEDURE_CODE
    http: 409
    condition: "the payer contract already prices the submitted procedure_code"
  - id: ERR_DUPLICATE_SERVICE_CODE
    http: 409
    condition: "the service agreement already contains the submitted service_code"
  - id: ERR_REPRICING_LIMIT_REACHED
    http: 422
    condition: "a third repricing round was requested on the same affiliation"
  - id: ERR_EARNOUT_POOL_LOCKED
    http: 409
    condition: "repricing was requested after at least one earn-out tranche was projected against the pool"
  - id: ERR_QUALITY_OUTCOME_MISMATCH
    http: 422
    condition: "the requested close outcome is inconsistent with the review's computed score_bps"
  - id: ERR_STAFFING_RATIO_OUT_OF_RANGE
    http: 422
    condition: "fte_hygiene_ratio_bps is outside the inclusive range 8000..25000"

  # --- fiscal business rules ---
  - id: ERR_MGMT_FEE_CAP_EXCEEDED
    http: 422
    condition: "the agreement's mgmt_fee_bps exceeds the 2000 bps cap at the moment it would become effective"
  - id: ERR_FEE_EROSION_MATERIAL
    http: 422
    condition: "the blended fee-schedule impact is at or below -500000 cents and the request carries no erosion_override_ack"
  - id: ERR_EARNOUT_POOL_EXCEEDED
    http: 422
    condition: "the computed earn-out payout exceeds the available unallocated pool"
  - id: ERR_COMP_HARMONIZATION_CAP_EXCEEDED
    http: 422
    condition: "the harmonized annual compensation exceeds the legacy package by more than 2500 bps"

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: DsoDealCounsel
    description: "Transaction counsel for the support organization. Owns the affiliation file, the repricing and signing decisions, the non-clinical service agreement scope, and restrictive-covenant enforcement."
    identity: opaque
    exclusive_operations:
      - "POST /dso/affiliations"
      - "POST /dso/affiliations/{affiliation_id}/advance-diligence"
      - "POST /dso/affiliations/{affiliation_id}/reprice"
      - "POST /dso/affiliations/{affiliation_id}/sign"
      - "POST /dso/service-agreements"
      - "POST /dso/service-agreements/{id}/line-items"
      - "POST /dso/service-agreements/{service_agreement_id}/submit-legal-review"
      - "POST /dso/service-agreements/{service_agreement_id}/reject-scope"
      - "POST /dso/service-agreements/{service_agreement_id}/make-effective"
      - "POST /dso/doctor-employments/{doctor_employment_id}/enforce-non-compete"
    shared_operations:
      - "POST /dso/practices (with DsoIntegrationLead)"
      - "POST /dso/doctors (with DsoIntegrationLead)"
      - "POST /dso/_clock/set_current_utc (with every role)"
      - "all GET endpoints except the practice vendor-consolidation and supply-exception lists"
  - name: DsoIntegrationLead
    description: "Post-close integration owner. Closes the transaction, runs the practice-management-system conversion and chart migration, drives credentialing enrollments, standardizes staffing and consolidates supply and lab vendors."
    identity: opaque
    exclusive_operations:
      - "POST /dso/affiliations/{affiliation_id}/close"
      - "POST /dso/conversion-vendors"
      - "POST /dso/practices/{practice_id}/standardize-staffing"
      - "POST /dso/doctor-employments"
      - "POST /dso/migration-batches"
      - "POST /dso/migration-batches/{migration_batch_id}/schedule-cutover"
      - "POST /dso/migration-batches/{migration_batch_id}/validate"
      - "POST /dso/migration-batches/{migration_batch_id}/remediate"
      - "POST /dso/migration-batches/{migration_batch_id}/rollback"
      - "POST /dso/migration-batches/{migration_batch_id}/reconcile"
      - "POST /dso/payer-enrollments"
      - "POST /dso/payer-enrollments/{payer_enrollment_id}/submit"
      - "POST /dso/payer-enrollments/{payer_enrollment_id}/decide"
      - "POST /dso/vendor-consolidations"
      - "POST /dso/vendor-consolidations/{vendor_consolidation_id}/finalize"
    shared_operations:
      - "POST /dso/practices (with DsoDealCounsel)"
      - "POST /dso/doctors (with DsoDealCounsel)"
      - "POST /dso/doctor-employments/{doctor_employment_id}/separate (with Dentist)"
      - "POST /dso/_clock/set_current_utc (with every role)"
      - "all GET endpoints"
  - name: DsoFinanceController
    description: "Support-organization finance controller. Owns payer contracts and fee schedules, compensation harmonization, and the earn-out tranche lifecycle. Two distinct controller users are required to reserve and settle the same tranche."
    identity: opaque
    exclusive_operations:
      - "POST /dso/doctor-employments/{doctor_employment_id}/harmonize-compensation"
      - "POST /dso/payer-contracts"
      - "POST /dso/payer-contracts/{id}/fee-schedule-items"
      - "POST /dso/payer-contracts/{payer_contract_id}/activate-fee-schedule"
      - "POST /dso/earnout-tranches"
      - "POST /dso/earnout-tranches/{earnout_tranche_id}/reserve"
      - "POST /dso/earnout-tranches/{earnout_tranche_id}/settle"
      - "POST /dso/earnout-tranches/{earnout_tranche_id}/claw-back"
    shared_operations:
      - "POST /dso/_clock/set_current_utc (with every role)"
      - "all GET endpoints except the clinical-quality-review lists"
  - name: ClinicalDirector
    description: "Licensed clinical director exercising the clinical-quality and treatment-planning oversight that the support organization may not perform. Also custodian of patient records after a departure and the approver of clinician preference exceptions."
    identity: "entity_backed:Doctor"
    exclusive_operations:
      - "POST /dso/doctor-employments/{doctor_employment_id}/records-custody-transfer"
      - "POST /dso/supply-preference-exceptions/{supply_preference_exception_id}/decide"
      - "POST /dso/clinical-quality-reviews"
      - "POST /dso/clinical-quality-reviews/{clinical_quality_review_id}/close"
    shared_operations:
      - "POST /dso/_clock/set_current_utc (with every role)"
      - "read access to practices, doctors, employments, enrollments, service line items, quality reviews, preference exceptions and vendor consolidations"
  - name: Dentist
    description: "Practising doctor at a target practice. Accepts or declines post-close employment terms, may resign, and requests clinician preference exceptions to the formulary."
    identity: "entity_backed:Doctor"
    exclusive_operations:
      - "POST /dso/doctor-employments/{doctor_employment_id}/accept-offer"
      - "POST /dso/supply-preference-exceptions"
    shared_operations:
      - "POST /dso/doctor-employments/{doctor_employment_id}/separate (with DsoIntegrationLead)"
      - "POST /dso/_clock/set_current_utc (with every role)"
      - "read access to affiliations, practices, doctors, employments, quality reviews and preference exceptions"





