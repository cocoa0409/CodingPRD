        claim_type: violation_to_error
        grounds:
          - validations[priority=13]
          - errors[ERR_INVALID_PAGINATION]
        distinguishing_aspect: "limit must sit inside 1..100, so limit=0 returns 400 ERR_INVALID_PAGINATION rather than an empty page."
        test_recipe:
          setup:
