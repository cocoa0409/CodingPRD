            - call: "POST /crayon-works/colors/${c_id}/vote-campaigns"
              payload: { kind: INTRODUCTION, opens_on: "2026-09-10T00:00:00Z", closes_on: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 422 and err == ERR_DATE_ORDER"
            - "Color.${c_id}.status remains PROPOSED and no campaign was persisted"

      - name: allocation_ship_date_outside_season_returns_season_window
        claim_type: Violation → Error
        grounds:
          - errors.ERR_SEASON_WINDOW
          - validations[priority=8]
          - entities.RetailAllocation.fields.requested_ship_date
        distinguishing_aspect: "The seasonal concentration window is hard: 2027-09-10 is past SEASON_END 2027-08-31T23:59:59Z, so the allocation is rejected 422 ERR_SEASON_WINDOW before any pool math runs."
        test_recipe:
          setup:
            - "Production-capable setup; spec ACTIVE."
          setup_api_calls:
            - *k_clock0
            - *k_color
            - *k_camp
            - *k_open
            - *k_epoch
            - *k_pass
            - *k_close
            - *k_epoch
            - *k_spec
            - call: "GET /crayon-works/assortment-specs/${spec_id}"
              payload: {}
              as: AllocationPlanner
              as_user_id: "ap-1"
              captures: { spec_v: $.data.version }
          trigger:
            - call: "POST /crayon-works/retail-allocations"
              payload: { assortment_spec_id: "${spec_id}", retailer_name: "MegaMart", priority_tier: GOLD, requested_boxes: 10, requested_ship_date: "2027-09-10T00:00:00Z", expected_assortment_spec_version: "${spec_v}" }
              as: AllocationPlanner
              as_user_id: "ap-1"
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 422 and err == ERR_SEASON_WINDOW"
            - "GET /crayon-works/assortment-specs/${spec_id}/retail-allocations returns 0 rows"

      - name: run_planned_start_within_lead_time_returns_too_soon
        claim_type: Violation → Error
        grounds:
          - errors.ERR_PLANNED_START_TOO_SOON
          - validations[priority=8]
          - entities.ProductionRun.fields.planned_start_date
        distinguishing_aspect: "The 60-day lead-time rule is measured from the logical clock: at 2026-09-21 the earliest legal start is 2026-11-20; a run starting 2026-10-15 is rejected even with every referential check passing."
        test_recipe:
          setup:
            - "Production-capable setup (color ACTIVE, spec ACTIVE, batch CERTIFIED, formula APPROVED); clock at 2026-09-21T00:00:00Z."
          setup_api_calls:
            - *k_clock0
            - *k_color
            - *k_camp
            - *k_open
            - *k_epoch
            - *k_pass
            - *k_close
            - *k_epoch
            - *k_spec
            - *k_batch
            - *k_cert
            - *k_formula
            - *k_submit
            - *k_tests
            - *k_tpass
            - *k_approve
          trigger:
            - call: "POST /crayon-works/production-runs"
              payload: { assortment_spec_id: "${spec_id}", pigment_batch_id: "${bat_id}", planned_boxes: 10, planned_start_date: "2026-10-15T00:00:00Z", planned_end_date: "2026-11-15T00:00:00Z" }
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 422 and err == ERR_PLANNED_START_TOO_SOON"
            - "GET /crayon-works/production-runs returns 0 rows"

  # ===========================================================================
  - section: endpoints
    instances:

      - name: error_response_envelope_shape_is_fixed
        claim_type: Standard CRUD
        grounds:
          - response_envelope
          - errors.ERR_NOT_FOUND
        distinguishing_aspect: "Every error uses the fixed envelope: response_type error, data.error_id, data.message, and meta.api_request_id/api_request_timestamp — verified on a 404."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Empty database."
          setup_api_calls:
            - *k_clock0
          trigger:
            - call: "GET /crayon-works/colors/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 404 and response_type == \"error\""
            - "data carries error_id == ERR_NOT_FOUND and a non-empty message string"
            - "meta carries non-null api_request_id and api_request_timestamp"

      - name: success_envelope_includes_meta_request_id
        claim_type: Standard CRUD
        grounds:
          - response_envelope
        distinguishing_aspect: "Every success uses the fixed envelope: response_type object for single-resource writes, with meta.api_request_id and meta.api_request_timestamp populated on a 201."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Empty database."
          setup_api_calls:
            - *k_clock0
          trigger:
            - call: "POST /crayon-works/colors"
              payload: { name: "Cerulean", hex_code: "#02A4D3" }
              as: PlatformAdmin
              captures: { c_id: $.data.id }
          assert:
            - "the response status is 201 and response_type == \"object\""
            - "meta.api_request_id and meta.api_request_timestamp are present and non-null"
            - "data is the Color object (id ${c_id})"

      - name: list_endpoints_apply_pagination_defaults
        claim_type: Standard CRUD
        grounds:
          - response_envelope.pagination_defaults
          - endpoints.GET_/crayon-works/production-runs
        distinguishing_aspect: "Omitting limit and offset yields the declared defaults (limit 10, offset 0) with has_more false when the filtered set is smaller than a page."
        test_recipe:
          setup:
            - "Production-capable setup with exactly 1 run (PLANNED)."
          setup_api_calls:
            - *k_clock0
            - *k_color
            - *k_camp
            - *k_open
            - *k_epoch
            - *k_pass
            - *k_close
            - *k_epoch
            - *k_spec
            - *k_batch
            - *k_cert
            - *k_formula
            - *k_submit
            - *k_tests
            - *k_tpass
            - *k_approve
            - *k_run
          trigger:
            - call: "GET /crayon-works/production-runs"
              payload: {}
              as: PlatformAdmin
          assert:
            - "the response status is 200 with response_type array and exactly 1 row"
            - "total_count == 1 and has_more == false"
            - "the effective pagination is limit 10, offset 0 (the declared defaults)"

      - name: run_epoch_returns_counts_object
        claim_type: Computed read
        grounds:
          - endpoints.POST_/crayon-works/ops/run-epoch
          - state_machines.VoteCampaign.SCHEDULED_to_OPEN
        distinguishing_aspect: "The epoch checkpoint reports its work: with one due campaign the first call returns epoch_index 1 and campaigns_opened 1; the immediate second call opens nothing and returns epoch_index 2 with all-zero counts."
        test_recipe:
          setup:
            - "Color Cerulean with a SCHEDULED campaign opening 2026-09-05; clock advanced to 2026-09-06."
          setup_api_calls:
            - *k_clock0
            - *k_color
            - *k_camp
            - *k_open
          trigger:
            - call: "POST /crayon-works/ops/run-epoch"
              payload: {}
              as: PlatformAdmin
              captures: { opened: $.data.campaigns_opened, idx1: $.data.epoch_index }
            - call: "POST /crayon-works/ops/run-epoch"
              payload: {}
              as: PlatformAdmin
              captures: { opened2: $.data.campaigns_opened, idx2: $.data.epoch_index }
          assert:
            - "first epoch: epoch_index == 1 and campaigns_opened == 1 (${idx1}, ${opened})"
            - "second epoch: epoch_index == 2 and campaigns_opened == 0 (${idx2}, ${opened2})"
            - "GET /crayon-works/colors/${c_id}/vote-campaigns shows data[0].status == OPEN"

      - name: formulas_subresource_filters_by_status
        claim_type: Standard CRUD
        grounds:
          - endpoints.GET_/crayon-works/colors/{id}/formulas
        distinguishing_aspect: "The reverse-reachability list supports the declared status filter: two formulas (one DRAFT, one SUBMITTED) list as 2 unfiltered and exactly 1 with status=DRAFT."
        test_recipe:
          setup:
            - "Color Cerulean PROPOSED with two formulas; the second was submitted."
          setup_api_calls:
            - *k_clock0
            - *k_color
            - *k_formula
            - call: "POST /crayon-works/formulas"
              payload: { color_id: "${c_id}", intended_use: MARKER, pigment_recipe: [{ pigment_name: "Quinacridone", parts: 1 }] }
              as: Formulator
              as_user_id: "f-1"
              captures: { frm2_id: $.data.id }
            - call: "POST /crayon-works/formulas/${frm2_id}/transition"
              payload: { action: SUBMIT }
              as: Formulator
              as_user_id: "f-1"
          trigger:
            - call: "GET /crayon-works/colors/${c_id}/formulas"
              payload: { status: DRAFT }
              as: Formulator
              as_user_id: "f-1"
          assert:
            - "the filtered call returns exactly 1 row: Formula.${frm_id} (DRAFT)"
            - "GET /crayon-works/colors/${c_id}/formulas without the filter returns 2 rows"

      - name: tickets_subresource_filters_by_kind_and_session
        claim_type: Standard CRUD
        grounds:
          - endpoints.GET_/crayon-works/attraction-sessions/{id}/tickets
        distinguishing_aspect: "The ticket list is scoped to the path session and supports the kind filter: two sessions interleave bookings, and each session's view shows only its own tickets, filterable to GROUP."
        test_recipe:
          setup:
            - "Sessions Hall A (2026-10-17) and Hall B (2026-10-19). Tickets: individual on A, group 10 on A, individual on B."
          setup_api_calls:
            - *k_clock0
            - *k_session
            - call: "POST /crayon-works/attraction-sessions"
              payload: { venue_name: "Hall B", session_date: "2026-10-19T00:00:00Z", start_minute: 600, duration_minutes: 120, capacity_units: 100, base_price_cents: 2000 }
              as: PlatformAdmin
              captures: { ses_b: $.data.id }
            - call: "POST /crayon-works/tickets"
              payload: { session_id: "${ses_id}", kind: INDIVIDUAL }
              as: BoxOffice
              as_user_id: "bo-1"
            - call: "POST /crayon-works/tickets"
              payload: { session_id: "${ses_id}", kind: GROUP, group_size: 10, school_name: "Lincoln Elementary" }
              as: BoxOffice
              as_user_id: "bo-1"
            - call: "POST /crayon-works/tickets"
              payload: { session_id: "${ses_b}", kind: INDIVIDUAL }
              as: BoxOffice
              as_user_id: "bo-1"
          trigger:
            - call: "GET /crayon-works/attraction-sessions/${ses_id}/tickets"
              payload: { kind: GROUP }
              as: BoxOffice
              as_user_id: "bo-1"
          assert:
            - "the filtered call returns exactly 1 row (the Lincoln Elementary group)"
            - "GET /crayon-works/attraction-sessions/${ses_id}/tickets unfiltered returns 2 rows"
            - "GET /crayon-works/attraction-sessions/${ses_b}/tickets returns 1 row — no cross-session leakage"

  # ===========================================================================
  - section: errors
    instances:

      - name: insufficient_inventory_on_commit_returns_error
        claim_type: violation_to_error
        grounds:
          - errors.ERR_INSUFFICIENT_INVENTORY
          - state_machines.RetailAllocation.REQUESTED_to_COMMITTED
        distinguishing_aspect: "A COMMIT whose FINAL share computes to 0 (spec has no boxes at all) fails with 409 ERR_INSUFFICIENT_INVENTORY; the REQUESTED allocation itself was legal to create with provisional 0."
        test_recipe:
          setup:
            - "Production-capable setup but no run was ever completed — spec boxes_available == 0. Allocation A1 REQUESTED with allocated_boxes_provisional == 0."
          setup_api_calls:
            - *k_clock0
            - *k_color
            - *k_camp
            - *k_open
            - *k_epoch
            - *k_pass
            - *k_close
            - *k_epoch
            - *k_spec
            - call: "GET /crayon-works/assortment-specs/${spec_id}"
              payload: {}
              as: AllocationPlanner
              as_user_id: "ap-1"
              captures: { spec_v: $.data.version }
            - call: "POST /crayon-works/retail-allocations"
              payload: { assortment_spec_id: "${spec_id}", retailer_name: "MegaMart", priority_tier: PLATINUM, requested_boxes: 10, requested_ship_date: "2027-07-15T00:00:00Z", expected_assortment_spec_version: "${spec_v}" }
              as: AllocationPlanner
              as_user_id: "ap-1"
              captures: { a1_id: $.data.id }
          trigger:
            - call: "POST /crayon-works/retail-allocations/${a1_id}/decision"
              payload: { action: COMMIT }
              as: AllocationPlanner
              as_user_id: "ap-1"
              captures: { err: $.data.error_id }
          assert:
            - "creation returned 201 with allocated_boxes_provisional == 0 (empty pool is not an error at request time)"
            - "the COMMIT returns 409 and err == ERR_INSUFFICIENT_INVENTORY"
            - "RetailAllocation.${a1_id}.status remains REQUESTED"

      - name: run_create_with_recalled_batch_returns_recall_active
        claim_type: violation_to_error
        grounds:
          - errors.ERR_RECALL_ACTIVE
          - validations[priority=7]
          - state_machines.PigmentBatch.CERTIFIED_to_REJECTED
        distinguishing_aspect: "The safety gate outranks the referential one: a run referencing a batch under an OPEN recall fails ERR_RECALL_ACTIVE (priority 7) — not ERR_BATCH_NOT_CERTIFIED (priority 10), even though the batch is also REJECTED."
        test_recipe:
          setup:
            - "Production-capable setup; run R1 completed with the batch; the batch was then retro-rejected by qa-2, opening a recall."
          setup_api_calls:
            - *k_clock0
            - *k_color
            - *k_camp
            - *k_open
            - *k_epoch
            - *k_pass
            - *k_close
            - *k_epoch
            - *k_spec
            - *k_batch
            - *k_cert
            - *k_formula
            - *k_submit
            - *k_tests
            - *k_tpass
            - *k_approve
            - *k_run
            - call: "POST /crayon-works/production-runs/${r1_id}/transition"
              payload: { action: ADVANCE }
              as: PlatformAdmin
            - call: "POST /crayon-works/production-runs/${r1_id}/transition"
              payload: { action: ADVANCE }
              as: PlatformAdmin
            - call: "POST /crayon-works/production-runs/${r1_id}/transition"
              payload: { action: ADVANCE }
              as: PlatformAdmin
            - call: "POST /crayon-works/production-runs/${r1_id}/transition"
              payload: { action: ADVANCE, packed_counts: [{ color_id: "${c_id}", count: 1000 }] }
              as: PlatformAdmin
            - call: "POST /crayon-works/pigment-batches/${bat_id}/certification-decision"
              payload: { decision: REJECT, reason: "trace cadmium" }
              as: QualityAssurance
              as_user_id: "qa-2"
          trigger:
            - call: "POST /crayon-works/production-runs"
              payload: { assortment_spec_id: "${spec_id}", pigment_batch_id: "${bat_id}", planned_boxes: 10, planned_start_date: "2027-04-15T00:00:00Z", planned_end_date: "2027-05-20T00:00:00Z" }
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 409 and err == ERR_RECALL_ACTIVE"
            - "err != ERR_BATCH_NOT_CERTIFIED — the safety category (7) is evaluated before the referential category (10)"

      - name: certification_mark_required_for_sensitive_batch
        claim_type: violation_to_error
        grounds:
          - errors.ERR_CERTIFICATION_MARK_REQUIRED
          - entities.PigmentBatch.fields.certification_mark
          - entities.PigmentBatch.fields.hazard_class
        distinguishing_aspect: "The certification-mark rule applies only to non-STANDARD hazard classes: a SENSITIVE batch carrying ACMI_CL cannot be certified (409), while a STANDARD batch with the same ACMI_CL mark certifies fine."
        test_recipe:
          setup:
            - "Two batches registered by sm-1: B1 SENSITIVE with ACMI_CL, B2 STANDARD with ACMI_CL."
          setup_api_calls:
            - *k_clock0
            - call: "POST /crayon-works/pigment-batches"
              payload: { pigment_name: "Cobalt Blue", supplier_name: "PigmentCo", hazard_class: SENSITIVE, received_quantity_kg: 120, certification_mark: ACMI_CL }
              as: SourcingManager
              as_user_id: "sm-1"
              captures: { b1_id: $.data.id }
            - call: "POST /crayon-works/pigment-batches"
              payload: { pigment_name: "Phthalo Blue", supplier_name: "PigmentCo", hazard_class: STANDARD, received_quantity_kg: 500, certification_mark: ACMI_CL }
              as: SourcingManager
              as_user_id: "sm-1"
              captures: { b2_id: $.data.id }
          trigger:
            - call: "POST /crayon-works/pigment-batches/${b1_id}/certification-decision"
              payload: { decision: CERTIFY }
              as: QualityAssurance
              as_user_id: "qa-1"
              captures: { err: $.data.error_id }
            - call: "POST /crayon-works/pigment-batches/${b2_id}/certification-decision"
              payload: { decision: CERTIFY }
              as: QualityAssurance
              as_user_id: "qa-1"
          assert:
            - "the SENSITIVE/ACMI_CL decision returns 409 and err == ERR_CERTIFICATION_MARK_REQUIRED; B1 stays QUARANTINE"
            - "the STANDARD/ACMI_CL decision returns 200 and B2 is CERTIFIED"

      - name: vote_before_open_or_after_tally_returns_campaign_not_open
        claim_type: violation_to_error
        grounds:
          - errors.ERR_CAMPAIGN_NOT_OPEN
          - state_machines.VoteCampaign
        distinguishing_aspect: "The OPEN window is enforced on both sides: a ballot cast while SCHEDULED (clock before opens_on) and a ballot cast after tallying both fail with the same ERR_CAMPAIGN_NOT_OPEN."
        test_recipe:
          setup:
            - "Color Cerulean with campaign k1 [2026-09-05, 2026-09-20]; the campaign is later OPEN, passed, and TALLYED."
          setup_api_calls:
            - *k_clock0
            - *k_color
            - *k_camp
          trigger:
            - call: "POST /crayon-works/votes"
              payload: { campaign_id: "${camp_id}", voter_segment: KIDS, choice: "YES" }
              as: Consumer
              captures: { err1: $.data.error_id }
            - *k_open
            - *k_epoch
            - *k_pass
            - *k_close
            - *k_epoch
            - call: "POST /crayon-works/votes"
              payload: { campaign_id: "${camp_id}", voter_segment: KIDS, choice: "YES" }
              as: Consumer
              captures: { err2: $.data.error_id }
          assert:
            - "the pre-open vote returns 409 with err1 == ERR_CAMPAIGN_NOT_OPEN"
            - "the post-tally vote returns 409 with err2 == ERR_CAMPAIGN_NOT_OPEN"
            - "GET /crayon-works/colors/${c_id}/vote-campaigns shows data[0].turnout_count == 20 (only the mid-window ballots counted)"

      - name: group_over_max_returns_group_too_large
        claim_type: violation_to_error
        grounds:
          - errors.ERR_GROUP_TOO_LARGE
          - entities.Ticket.fields.group_size
        distinguishing_aspect: "The group-size ceiling is inclusive at 100: a group of 101 is rejected 422 ERR_GROUP_TOO_LARGE while a group of exactly 100 books successfully."
        test_recipe:
          setup:
            - "Session Hall A 2026-10-17 with capacity 150."
          setup_api_calls:
            - *k_clock0
            - call: "POST /crayon-works/attraction-sessions"
              payload: { venue_name: "Hall A", session_date: "2026-10-17T00:00:00Z", start_minute: 600, duration_minutes: 120, capacity_units: 150, base_price_cents: 2000 }
              as: PlatformAdmin
              captures: { ses_id: $.data.id }
          trigger:
            - call: "POST /crayon-works/tickets"
              payload: { session_id: "${ses_id}", kind: GROUP, group_size: 101, school_name: "Jefferson High" }
              as: BoxOffice
              as_user_id: "bo-1"
              captures: { err: $.data.error_id }
            - call: "POST /crayon-works/tickets"
              payload: { session_id: "${ses_id}", kind: GROUP, group_size: 100, school_name: "Lincoln Elementary" }
              as: BoxOffice
              as_user_id: "bo-1"
              captures: { g_id: $.data.id }
          assert:
            - "the 101-visitor attempt returns 422 and err == ERR_GROUP_TOO_LARGE"
            - "the 100-visitor attempt returns 201 and Ticket.${g_id}.status == CONFIRMED"
            - "AttractionSession.${ses_id}.booked_units == 100"

      - name: licensed_spec_without_approved_line_returns_license_required
        claim_type: violation_to_error
        grounds:
          - errors.ERR_LICENSE_REQUIRED
          - validations[priority=10]
        distinguishing_aspect: "A LICENSED-kind spec cannot run without an APPROVED licensed line covering one of its colors — the referential gate fires even with formula approved, batch certified, and dates legal."
        test_recipe:
          setup:
            - "Color Cerulean ACTIVE; formula APPROVED; batch CERTIFIED; LICENSED spec {Cerulean:8} created. No licensed line exists."
          setup_api_calls:
            - *k_clock0
            - *k_color
            - *k_camp
            - *k_open
            - *k_epoch
            - *k_pass
            - *k_close
            - *k_epoch
            - *k_batch
            - *k_cert
            - *k_formula
            - *k_submit
            - *k_tests
            - *k_tpass
            - *k_approve
            - call: "POST /crayon-works/assortment-specs"
              payload: { name: "SpaceMovie 8-box", kind: LICENSED, entries: [{ color_id: "${c_id}", count: 8 }], wholesale_price_cents: 2000 }
              as: PlatformAdmin
              captures: { spec_l: $.data.id }
          trigger:
            - call: "POST /crayon-works/production-runs"
              payload: { assortment_spec_id: "${spec_l}", pigment_batch_id: "${bat_id}", planned_boxes: 40, planned_start_date: "2027-04-15T00:00:00Z", planned_end_date: "2027-05-20T00:00:00Z" }
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 409 and err == ERR_LICENSE_REQUIRED"
            - "GET /crayon-works/production-runs returns 0 rows"

      - name: campaign_on_in_vote_color_returns_color_not_active
        claim_type: violation_to_error
        grounds:
          - errors.ERR_COLOR_NOT_ACTIVE
          - state_machines.Color.PROPOSED_to_IN_VOTE
        distinguishing_aspect: "The color-state gate is kind-aware and mutual-exclusionary: a color already IN_VOTE rejects a second campaign with ERR_COLOR_NOT_ACTIVE, keeping one live campaign per color."
        test_recipe:
          setup:
            - "Color Cerulean PROPOSED -> IN_VOTE via a first (still SCHEDULED) introduction campaign."
          setup_api_calls:
            - *k_clock0
            - *k_color
            - *k_camp
          trigger:
            - call: "POST /crayon-works/colors/${c_id}/vote-campaigns"
              payload: { kind: INTRODUCTION, opens_on: "2026-10-01T00:00:00Z", closes_on: "2026-10-15T23:59:59Z" }
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 409 and err == ERR_COLOR_NOT_ACTIVE"
            - "err != ERR_CAMPAIGN_WINDOW_CONFLICT — the new window did not overlap; only the color state blocked it"
            - "GET /crayon-works/colors/${c_id}/vote-campaigns returns exactly 1 row"

      - name: line_transition_from_wrong_state_returns_license_state
        claim_type: violation_to_error
        grounds:
          - errors.ERR_LICENSE_STATE
          - state_machines.LicensedLine
        distinguishing_aspect: "With a fresh formula version (OCC satisfied) and the matching licensor identity, a LICENSOR_APPROVE on a DRAFT line still fails purely on state: 409 ERR_LICENSE_STATE."
        test_recipe:
          setup:
            - "Color Cerulean ACTIVE; formula APPROVED (version 3, captured); line created DRAFT, never submitted."
          setup_api_calls:
            - *k_clock0
            - *k_color
            - *k_camp
            - *k_open
            - *k_epoch
            - *k_pass
            - *k_close
            - *k_epoch
            - *k_formula
