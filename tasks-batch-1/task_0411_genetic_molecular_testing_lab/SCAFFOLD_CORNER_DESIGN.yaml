          assert:
            - "response status code == 201"
            - "Report.${report_id}.status == AMENDED"
            - "Report.${successor_id}.amends_report_id == ${report_id}"
            - "TestOrder.${order_id}.version == ${ord_v} + 1"

      - name: occ_stale_order_version_on_amend
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[report-amend-stale-order]
          - validations[priority=4]
          - errors[ERR_STALE_ORDER_VERSION]
        distinguishing_aspect: "A second amend carrying the pre-first-amend order version (${ord_v}) is rejected with ERR_STALE_ORDER_VERSION (412) because the first amend already incremented TestOrder.version."
        test_recipe:
          setup:
            - "SIGNED_OUT SELF_PAY order; order version captured before first amend; first amend already applied (version advanced)."
