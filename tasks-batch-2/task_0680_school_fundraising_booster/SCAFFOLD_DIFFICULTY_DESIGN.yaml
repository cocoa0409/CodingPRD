      # --- #2: stock headroom equality (empty headroom edge, different metric/endpoint) ---
      - name: order_create_exactly_at_stock_headroom_succeeds
        grounds:
          - validations[priority=10]
          - calculations.product_reserved_qty
          - entities.Product.fields.stock_qty
          - entities.Product.fields.reserved_qty
        distinguishing_aspect: |
          Different metric (units headroom, not money) reached via the ORDER
          CREATE endpoint: requesting exactly stock_qty - reserved_qty (10 == 10)
          SUCCEEDS (boundary inclusive); one more unit (11) would fail
          ERR_INSUFFICIENT_STOCK. Distinct from the prize-tier numeric crossing.
        test_recipe:
          setup:
            - "ACTIVE CATALOG campaign, 1 seller, 1 product stock_qty 10 reserved 0, 1 prize tier."
          setup_api_calls:
