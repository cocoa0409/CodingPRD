        excluded_because:
          difficulty_instance: non_linear_state_machine / certificate_appeal_loop_reenters_issued_without_deadline_extension
          rationale: "The full ISSUED to UNDER_APPEAL to ISSUED cycle, including the unchanged deadlines, is asserted there."

