        distinguishing_aspect: "The key is the triple (site_id, shift_date, shift_code), so a second AM shift on the same date collides while a PM shift on that date is accepted."
        test_recipe:
          setup: ["Site HK-01 with an AM shift on 2026-08-01 already open."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
