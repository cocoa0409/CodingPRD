              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /clients"
              payload: { name: "Quartz Estates", margin_floor_pct: 20.0 }
              as: AccountManager
              captures: { client_id: $.data.id }
            - call: "POST /sites"
              payload: { client_id: "${client_id}", name: "Quartz Grounds" }
              as: AccountManager
              captures: { site_id: $.data.id }
            - call: "POST /posts"
              payload: { site_id: "${site_id}", name: "Perimeter", bill_rate_cents_per_hour: 4500, max_concurrent_guards: 1, required_cert_codes: [], checkpoint_tag_uids: [], tour_compliance_floor_pct: 80.0 }
              as: AccountManager
              captures: { post_id: $.data.id }
            - call: "POST /guards"
              payload: { full_name: "Enzo Marr", employee_code: "G-150", pay_rate_cents_per_hour: 2200 }
              as: ComplianceOfficer
              captures: { guard_id: $.data.id }
            - call: "POST /credentials"
              payload: { guard_id: "${guard_id}", kind: "LICENSE", code: "GUARD_CARD", credential_number: "L-150", expires_at: "2027-01-01T00:00:00Z" }
              as: ComplianceOfficer
              captures: { lic_id: $.data.id }
            - call: "POST /credentials/${lic_id}/verify"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /guards/${guard_id}/status"
              payload: { action: "ACTIVATE" }
              as: ComplianceOfficer
            - call: "POST /shifts"
              payload: { post_id: "${post_id}", scheduled_start_at: "2026-05-04T08:00:00Z", scheduled_end_at: "2026-05-04T16:00:00Z", planned_break_minutes: 30 }
              as: Scheduler
              captures: { shift_id: $.data.id, shift_v: $.data.version }
          trigger:
            - call: "GET /guards/${guard_id}"
              payload: {}
              as: Scheduler
            - call: "POST /shifts/${shift_id}/assignments"
              payload: { guard_id: "${guard_id}", expected_shift_version: "${shift_v}" }
              as: Scheduler
            - call: "GET /guards/${guard_id}"
              payload: {}
              as: Scheduler
            - call: "POST /shifts/${shift_id}/actions"
              payload: { action: "UNASSIGN" }
              as: Scheduler
            - call: "GET /guards/${guard_id}"
              payload: {}
              as: Scheduler
          assert:
            - "Before assignment: Guard.${guard_id}.committed_hours == 0.0"
            - "After assignment: Guard.${guard_id}.committed_hours == 7.5"
            - "After assignment: CoverageShift.${shift_id}.status == SCHEDULED and CoverageShift.${shift_id}.pay_rate_cents_per_hour == 2200"
            - "After UNASSIGN: Guard.${guard_id}.committed_hours == 0.0"
            - "After UNASSIGN: CoverageShift.${shift_id}.status == OPEN_UNFILLED"
            - "After UNASSIGN: CoverageShift.${shift_id}.guard_id == null"
            - "After UNASSIGN: CoverageShift.${shift_id}.pay_rate_cents_per_hour == null"
            - "After UNASSIGN: CoverageShift.${shift_id}.provisional_billable_cents == 33750 (the bill-side estimate is untouched by the guard round-trip)"
