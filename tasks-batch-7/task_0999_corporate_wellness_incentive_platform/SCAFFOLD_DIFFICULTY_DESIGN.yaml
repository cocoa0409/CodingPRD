              captures: { enr_id: $.data.id }
            - call: "POST /wellness/challenges"
              payload: { program_id: "${prog_id}", name: "Spring Steps", activity_type: "STEPS", goal_quantity: 100000, points_reward: 250, starts_at: "2026-04-01T00:00:00Z", ends_at: "2026-06-01T00:00:00Z" }
              as: BenefitsAdmin
              captures: { ch_id: $.data.id }
            - call: "POST /wellness/challenges/${ch_id}/publish"
              payload: {}
              as: BenefitsAdmin
          trigger:
            - call: "POST /wellness/challenge-participations"
              payload: { challenge_id: "${ch_id}", enrollment_id: "${enr_id}" }
              as: Employee
              as_user_id: "${e1_id}"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_ENROLLMENT_NOT_ACTIVE (enrollment is INVITED)"

      - name: confirm_requires_closed_program
        grounds:
          - state_machines.IncentiveAward.PROJECTED_to_CONFIRMED
          - "errors[ERR_PROGRAM_NOT_CLOSED]"
        distinguishing_aspect: |
          Entity pair IncentiveAward -> WellnessProgram — different pair from
          instance 1: confirming a PROJECTED award while its program is still
          ACTIVE is rejected with ERR_PROGRAM_NOT_CLOSED.
        test_recipe:
          setup:
            - "Employer/program ACTIVE (standard fixtures); employee; enrollment ACTIVE; awards computed (PROJECTED) while program ACTIVE"
          setup_api_calls:
            - call: "POST /wellness/employers"
              payload: { name: "Acme", annual_self_only_premium_cents: 120000, tobacco_surcharge_cents: 50000, pmpm_fee_cents: 10000, coaching_session_fee_cents: 7500, k_anonymity_threshold: 5, kiosk_capacity: 2, invoice_approval_limit_cents: 5000 }
              as: PlatformAdmin
              captures: { emp_id: $.data.id }
            - call: "POST /wellness/programs"
              payload: { employer_id: "${emp_id}", name: "PY2026", plan_year_start: "2026-01-01", plan_year_end: "2027-01-01", bronze_threshold: 500, silver_threshold: 1500, gold_threshold: 3000, bronze_award_cents: 10000, silver_award_cents: 30000, gold_award_cents: 60000, premium_cap_pct: 0.30, coaching_required_sessions: 4 }
              as: BenefitsAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /wellness/programs/${prog_id}/activate"
              payload: {}
              as: BenefitsAdmin
            - call: "POST /wellness/employees"
              payload: { employer_id: "${emp_id}", email: "e1@acme.com", full_name: "E One", department: "ENG", hire_date: "2024-03-01" }
              as: BenefitsAdmin
              captures: { e1_id: $.data.id }
            - call: "POST /wellness/enrollments"
              payload: { program_id: "${prog_id}", employee_id: "${e1_id}" }
              as: BenefitsAdmin
              captures: { enr_id: $.data.id }
            - call: "POST /wellness/enrollments/${enr_id}/accept"
              payload: {}
              as: Employee
              as_user_id: "${e1_id}"
            - call: "POST /wellness/incentive-awards/compute"
              payload: { program_id: "${prog_id}" }
              as: BenefitsAdmin
            - call: "GET /wellness/enrollments/${enr_id}/incentive-awards"
              payload: {}
              as: BenefitsAdmin
              captures: { aw_id: "$.data[0].id" }
          trigger:
            - call: "POST /wellness/incentive-awards/${aw_id}/confirm"
              payload: {}
              as: BenefitsAdmin
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_PROGRAM_NOT_CLOSED (program is ACTIVE, not CLOSED)"
            - "IncentiveAward.${aw_id}.status == PROJECTED (unchanged)"

  # ---------------------------------------------------------------- Rule 8
  - rule_id: resource_temporal_overlap
    instances:
      - name: program_window_halfopen_overlap
        grounds:
          - state_machines.WellnessProgram.DRAFT_to_ACTIVE
          - "errors[ERR_PROGRAM_WINDOW_OVERLAP]"
        distinguishing_aspect: |
          Interval semantics: strict half-open exclusion on the WellnessProgram
          resource — a second program whose [start, end) intersects an ACTIVE
          program's window is rejected at activation; resource is the
          employer's program calendar.
        test_recipe:
          setup:
            - "Employer; program P1 ACTIVE with window [2026-01-01, 2027-01-01); program P2 DRAFT with window [2026-06-01, 2027-06-01)"
          setup_api_calls:
            - call: "POST /wellness/employers"
              payload: { name: "Acme", annual_self_only_premium_cents: 120000, tobacco_surcharge_cents: 50000, pmpm_fee_cents: 10000, coaching_session_fee_cents: 7500, k_anonymity_threshold: 5, kiosk_capacity: 2, invoice_approval_limit_cents: 5000 }
              as: PlatformAdmin
              captures: { emp_id: $.data.id }
            - call: "POST /wellness/programs"
              payload: { employer_id: "${emp_id}", name: "PY2026", plan_year_start: "2026-01-01", plan_year_end: "2027-01-01", bronze_threshold: 500, silver_threshold: 1500, gold_threshold: 3000, bronze_award_cents: 10000, silver_award_cents: 30000, gold_award_cents: 60000, premium_cap_pct: 0.30, coaching_required_sessions: 4 }
              as: BenefitsAdmin
              captures: { prog1_id: $.data.id }
            - call: "POST /wellness/programs/${prog1_id}/activate"
              payload: {}
              as: BenefitsAdmin
            - call: "POST /wellness/programs"
              payload: { employer_id: "${emp_id}", name: "PY2026H2", plan_year_start: "2026-06-01", plan_year_end: "2027-06-01", bronze_threshold: 500, silver_threshold: 1500, gold_threshold: 3000, bronze_award_cents: 10000, silver_award_cents: 30000, gold_award_cents: 60000, premium_cap_pct: 0.30, coaching_required_sessions: 4 }
              as: BenefitsAdmin
              captures: { prog2_id: $.data.id }
          trigger:
            - call: "POST /wellness/programs/${prog2_id}/activate"
              payload: {}
              as: BenefitsAdmin
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_PROGRAM_WINDOW_OVERLAP ([2026-06-01, 2027-06-01) intersects [2026-01-01, 2027-01-01))"
            - "WellnessProgram.${prog2_id}.status == DRAFT (unchanged)"

      - name: kiosk_slot_aggregate_capacity
        grounds:
          - state_machines.BiometricScreening.create_to_SCHEDULED
          - "errors[ERR_KIOSK_CAPACITY_EXCEEDED]"
        distinguishing_aspect: |
          Interval semantics: aggregate capacity on the BiometricScreening
          resource — overlaps are ALLOWED up to kiosk_capacity=2 per
          clinic_location and only the third overlapping appointment is
          rejected. Different semantics (capacity pool, not strict exclusion)
          and different resource from instance 1.
        test_recipe:
          setup:
            - "Employer kiosk_capacity=2; program ACTIVE (standard fixture); three employees each with an ACTIVE enrollment"
          setup_api_calls:
            - call: "POST /wellness/employers"
              payload: { name: "Acme", annual_self_only_premium_cents: 120000, tobacco_surcharge_cents: 50000, pmpm_fee_cents: 10000, coaching_session_fee_cents: 7500, k_anonymity_threshold: 5, kiosk_capacity: 2, invoice_approval_limit_cents: 5000 }
              as: PlatformAdmin
              captures: { emp_id: $.data.id }
            - call: "POST /wellness/programs"
              payload: { employer_id: "${emp_id}", name: "PY2026", plan_year_start: "2026-01-01", plan_year_end: "2027-01-01", bronze_threshold: 500, silver_threshold: 1500, gold_threshold: 3000, bronze_award_cents: 10000, silver_award_cents: 30000, gold_award_cents: 60000, premium_cap_pct: 0.30, coaching_required_sessions: 4 }
              as: BenefitsAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /wellness/programs/${prog_id}/activate"
              payload: {}
              as: BenefitsAdmin
            - call: "POST /wellness/employees"
              payload: { employer_id: "${emp_id}", email: "e1@acme.com", full_name: "E One", department: "ENG", hire_date: "2024-03-01" }
              as: BenefitsAdmin
              captures: { e1_id: $.data.id }
            - call: "POST /wellness/enrollments"
              payload: { program_id: "${prog_id}", employee_id: "${e1_id}" }
              as: BenefitsAdmin
              captures: { enr1_id: $.data.id }
            - call: "POST /wellness/enrollments/${enr1_id}/accept"
              payload: {}
              as: Employee
              as_user_id: "${e1_id}"
            - call: "POST /wellness/employees"
              payload: { employer_id: "${emp_id}", email: "e2@acme.com", full_name: "E Two", department: "ENG", hire_date: "2024-03-01" }
              as: BenefitsAdmin
              captures: { e2_id: $.data.id }
            - call: "POST /wellness/enrollments"
              payload: { program_id: "${prog_id}", employee_id: "${e2_id}" }
              as: BenefitsAdmin
              captures: { enr2_id: $.data.id }
            - call: "POST /wellness/enrollments/${enr2_id}/accept"
              payload: {}
              as: Employee
              as_user_id: "${e2_id}"
            - call: "POST /wellness/employees"
              payload: { employer_id: "${emp_id}", email: "e3@acme.com", full_name: "E Three", department: "ENG", hire_date: "2024-03-01" }
              as: BenefitsAdmin
              captures: { e3_id: $.data.id }
            - call: "POST /wellness/enrollments"
              payload: { program_id: "${prog_id}", employee_id: "${e3_id}" }
              as: BenefitsAdmin
              captures: { enr3_id: $.data.id }
            - call: "POST /wellness/enrollments/${enr3_id}/accept"
              payload: {}
              as: Employee
              as_user_id: "${e3_id}"
          trigger:
            - call: "POST /wellness/biometric-screenings"
              payload: { enrollment_id: "${enr1_id}", clinic_location: "HQ", slot_start: "2026-04-20T10:00:00Z", slot_end: "2026-04-20T10:30:00Z" }
              as: Employee
              as_user_id: "${e1_id}"
              captures: { scr1_id: $.data.id }
            - call: "POST /wellness/biometric-screenings"
              payload: { enrollment_id: "${enr2_id}", clinic_location: "HQ", slot_start: "2026-04-20T10:15:00Z", slot_end: "2026-04-20T10:45:00Z" }
              as: Employee
              as_user_id: "${e2_id}"
              captures: { scr2_id: $.data.id }
            - call: "POST /wellness/biometric-screenings"
              payload: { enrollment_id: "${enr3_id}", clinic_location: "HQ", slot_start: "2026-04-20T10:20:00Z", slot_end: "2026-04-20T10:50:00Z" }
              as: Employee
              as_user_id: "${e3_id}"
              captures: { err: $.data.error_id }
          assert:
            - "BiometricScreening.${scr1_id}.status == SCHEDULED (first overlap allowed: count 0 < 2)"
            - "BiometricScreening.${scr2_id}.status == SCHEDULED (second overlap allowed: count 1 < 2)"
            - "Third create -> error_id == ERR_KIOSK_CAPACITY_EXCEEDED (overlapping count 2 >= kiosk_capacity 2)"

  # ---------------------------------------------------------------- Rule 9
  - rule_id: compensating_invariant
    instances:
      - name: points_adjustment_compensation_invariant
        grounds:
          - calculations.points_balance
          - state_machines.PointsLedgerEntry
          - "concurrency_rules[enrollment-adjustment-stale-version]"
        distinguishing_aspect: |
          Conserved quantity: Enrollment points balances are a pure function of
          the ledger — a +500 ADJUSTED entry composed with its compensating
          -500 ADJUSTED entry leaves both balances at their pre-pair value (0),
          with exactly two POSTED ADJUSTED entries recorded.
        test_recipe:
          setup:
            - "Employer/program ACTIVE (standard fixtures); employee; enrollment ACTIVE with zero balances"
          setup_api_calls:
            - call: "POST /wellness/employers"
              payload: { name: "Acme", annual_self_only_premium_cents: 120000, tobacco_surcharge_cents: 50000, pmpm_fee_cents: 10000, coaching_session_fee_cents: 7500, k_anonymity_threshold: 5, kiosk_capacity: 2, invoice_approval_limit_cents: 5000 }
              as: PlatformAdmin
              captures: { emp_id: $.data.id }
            - call: "POST /wellness/programs"
              payload: { employer_id: "${emp_id}", name: "PY2026", plan_year_start: "2026-01-01", plan_year_end: "2027-01-01", bronze_threshold: 500, silver_threshold: 1500, gold_threshold: 3000, bronze_award_cents: 10000, silver_award_cents: 30000, gold_award_cents: 60000, premium_cap_pct: 0.30, coaching_required_sessions: 4 }
              as: BenefitsAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /wellness/programs/${prog_id}/activate"
              payload: {}
              as: BenefitsAdmin
            - call: "POST /wellness/employees"
              payload: { employer_id: "${emp_id}", email: "e1@acme.com", full_name: "E One", department: "ENG", hire_date: "2024-03-01" }
              as: BenefitsAdmin
              captures: { e1_id: $.data.id }
            - call: "POST /wellness/enrollments"
              payload: { program_id: "${prog_id}", employee_id: "${e1_id}" }
              as: BenefitsAdmin
              captures: { enr_id: $.data.id }
            - call: "POST /wellness/enrollments/${enr_id}/accept"
              payload: {}
              as: Employee
              as_user_id: "${e1_id}"
          trigger:
            - call: "GET /wellness/enrollments/${enr_id}"
              payload: {}
              as: BenefitsAdmin
              captures: { enr_v1: $.data.version }
            - call: "POST /wellness/enrollments/${enr_id}/adjustments"
              payload: { points_delta: 500, reason: "goodwill credit", expected_enrollment_version: "${enr_v1}" }
              as: BenefitsAdmin
            - call: "GET /wellness/enrollments/${enr_id}"
              payload: {}
              as: BenefitsAdmin
              captures: { enr_v2: $.data.version }
            - call: "POST /wellness/enrollments/${enr_id}/adjustments"
              payload: { points_delta: -500, reason: "reversal of goodwill credit", expected_enrollment_version: "${enr_v2}" }
              as: BenefitsAdmin
            - call: "GET /wellness/enrollments/${enr_id}"
              payload: {}
              as: BenefitsAdmin
            - call: "GET /wellness/enrollments/${enr_id}/points-ledger-entries"
              payload: {}
              as: BenefitsAdmin
          assert:
            - "Enrollment.${enr_id}.points_balance_provisional == 0 (== pre-pair value)"
            - "Enrollment.${enr_id}.points_balance_settled == 0 (== pre-pair value)"
            - "points-ledger-entries list has exactly 2 ADJUSTED entries with points_delta +500 and -500, both POSTED"

      - name: invoice_adjustment_compensation_invariant
        grounds:
          - calculations.vendor_invoice_total
          - state_machines.VendorInvoice
        distinguishing_aspect: |
          Conserved quantity: money — VendorInvoice.total_cents is the exact
          sum of line_items; a +1200 ADJUSTMENT line composed with its
          compensating -1200 ADJUSTMENT line leaves total_cents at the pre-pair
          value 10000 (different conserved quantity from instance 1's points).
        test_recipe:
          setup:
            - "Employer/program ACTIVE (standard fixtures); one employee enrolled and accepted at default clock 2026-05-01 (full-month MEMBER_MONTH line 10000); invoice DRAFT for period 2026-05-01..2026-05-31"
          setup_api_calls:
            - call: "POST /wellness/employers"
              payload: { name: "Acme", annual_self_only_premium_cents: 120000, tobacco_surcharge_cents: 50000, pmpm_fee_cents: 10000, coaching_session_fee_cents: 7500, k_anonymity_threshold: 5, kiosk_capacity: 2, invoice_approval_limit_cents: 5000 }
              as: PlatformAdmin
              captures: { emp_id: $.data.id }
            - call: "POST /wellness/programs"
              payload: { employer_id: "${emp_id}", name: "PY2026", plan_year_start: "2026-01-01", plan_year_end: "2027-01-01", bronze_threshold: 500, silver_threshold: 1500, gold_threshold: 3000, bronze_award_cents: 10000, silver_award_cents: 30000, gold_award_cents: 60000, premium_cap_pct: 0.30, coaching_required_sessions: 4 }
              as: BenefitsAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /wellness/programs/${prog_id}/activate"
              payload: {}
              as: BenefitsAdmin
            - call: "POST /wellness/employees"
              payload: { employer_id: "${emp_id}", email: "e1@acme.com", full_name: "E One", department: "ENG", hire_date: "2024-03-01" }
              as: BenefitsAdmin
              captures: { e1_id: $.data.id }
            - call: "POST /wellness/enrollments"
              payload: { program_id: "${prog_id}", employee_id: "${e1_id}" }
              as: BenefitsAdmin
              captures: { enr_id: $.data.id }
            - call: "POST /wellness/enrollments/${enr_id}/accept"
              payload: {}
              as: Employee
              as_user_id: "${e1_id}"
            - call: "POST /wellness/vendor-invoices"
              payload: { program_id: "${prog_id}", vendor_name: "WellCo", period_start: "2026-05-01", period_end: "2026-05-31" }
              as: VendorManager
              captures: { inv_id: $.data.id }
          trigger:
            - call: "POST /wellness/vendor-invoices/${inv_id}/adjustments"
              payload: { amount_cents: 1200, note: "setup fee" }
              as: VendorManager
            - call: "POST /wellness/vendor-invoices/${inv_id}/adjustments"
              payload: { amount_cents: -1200, note: "reversal of setup fee" }
              as: VendorManager
          assert:
            - "VendorInvoice.${inv_id}.total_cents == 10000 (== pre-pair value)"
            - "VendorInvoice.${inv_id}.line_items has exactly 3 lines: 1 MEMBER_MONTH (10000) + 2 ADJUSTMENT (+1200, -1200)"
            - "VendorInvoice.${inv_id}.status == DRAFT (adjustments do not change state)"
