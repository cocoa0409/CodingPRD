# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing or invalid X-User-Role / X-User-ID headers" }
  - { id: ERR_UNAUTHORIZED_ROLE, http: 403, condition: "Role not permitted for this endpoint" }
  - { id: ERR_FORBIDDEN_OWNERSHIP, http: 403, condition: "Entity-backed role acting on a resource it does not own (SupplierOperator vs another supplier's agreement; ManufacturerClient vs another client)" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path id or body FK references a non-existent entity" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field, invalid type, unknown enum value, or out-of-range numeric" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_<parent>_version does not match the parent's current version (OCC)" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Generic state-precondition failure for transitions without a domain-specific error" }
  - { id: ERR_AGREEMENT_NOT_ACTIVE, http: 409, condition: "Agreement (or its supplier, on activate/resume) not in the required ACTIVE state" }
  - { id: ERR_BATCH_INVALID_STATE, http: 409, condition: "Batch status does not permit the requested transition" }
  - { id: ERR_OPT_OUT_INVALID_STATE, http: 409, condition: "Opt-out status does not permit the requested transition" }
  - { id: ERR_DELIVERY_INVALID_STATE, http: 409, condition: "Delivery status (or must_recompile flag) does not permit the requested transition" }
  - { id: ERR_PRESCRIBER_NOT_ACTIVE, http: 409, condition: "Prescriber must be ACTIVE for opt-out create/verify/activate" }
  - { id: ERR_CLIENT_SUSPENDED, http: 409, condition: "Client (or its product) is SUSPENDED" }
  - { id: ERR_REIDENTIFICATION_PROHIBITED, http: 403, condition: "Audit request with purpose REIDENTIFICATION — re-identification of de-identified data is prohibited" }
  - { id: ERR_PRESCRIBER_OPT_OUT_VIOLATION, http: 422, condition: "Forced inclusion of a prescriber with an ACTIVE opt-out in a provider-level delivery" }
  - { id: ERR_JURISDICTION_RESTRICTED, http: 422, condition: "Forced inclusion of a prescriber whose state has an effective restrictive jurisdiction rule" }
  - { id: ERR_DEID_QA_BELOW_THRESHOLD, http: 422, condition: "deid_qa_score < 0.90 on batch accept" }
  - { id: ERR_AGREEMENT_WINDOW_OVERLAP, http: 409, condition: "Exclusivity window overlaps a non-TERMINATED agreement of the same supplier and data_domain (half-open)" }
  - { id: ERR_DELIVERY_WINDOW_MISSED, http: 422, condition: "Compile/reissue before the parent period's period_end_date" }
  - { id: ERR_AUDIT_COOLDOWN_ACTIVE, http: 422, condition: "New audit window inside the 30-day post-audit cooldown or overlapping an open audit" }
  - { id: ERR_PRODUCT_VERSION_STALE, http: 409, condition: "product.pinned_methodology_version != methodology.version at compile/reissue" }
  - { id: ERR_NO_DELIVERABLE_CELLS, http: 422, condition: "No CURRENT projection cells of the product's methodology match the delivery period (empty set)" }
  - { id: ERR_DUPLICATE_OPT_OUT, http: 409, condition: "An opt-out for the same prescriber already exists in SUBMITTED, VERIFIED or ACTIVE status" }
  - { id: ERR_ROYALTY_BUDGET_EXHAUSTED, http: 402, condition: "Accepting the batch would push royalty_spent_cents above royalty_budget_cents" }
  - { id: ERR_INSUFFICIENT_ENTITLEMENT, http: 402, condition: "Client entitlement balance below the number of cells to be compiled" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: PlatformAdmin
    description: "Platform operator; owns prescriber registry, projection methodology, products, deliveries, audits, and the logical clock"
    identity: opaque
    exclusive_operations:
      - "POST /_clock/set_current_utc"
      - "POST /clients, POST /clients/{id}/reinstate"
      - "POST /prescribers, /prescribers/{id}/deactivate, /prescribers/{id}/reactivate"
      - "POST /projection-methodologies, /projection-methodologies/{id}/restate"
      - "POST /projection-cells, /projection-cells/{id}/recompute"
      - "POST /report-products, /report-products/{id}/sync-methodology, /report-products/{id}/delivery-periods"
      - "POST /report-delivery-periods/{id}/close, /report-delivery-periods/{id}/deliveries"
      - "POST /report-deliveries/{id}/compile, /release, /recall, /reissue"
      - "POST /audit-events/{id}/schedule, /complete"
    shared_operations:
      - "GET endpoints (all roles)"
      - "POST /report-products/{id}/invoice-preview (with ManufacturerClient)"
      - "POST /audit-events/{id}/cancel (with ManufacturerClient)"
  - name: DataAcquisitionManager
    description: "Owns supplier onboarding and data acquisition agreements; validates feed batches. Segregated from privacy operations."
    identity: opaque
    exclusive_operations:
      - "POST /suppliers, /suppliers/{id}/suspend, /suppliers/{id}/resume, /suppliers/{id}/agreements"
      - "POST /data-acquisition-agreements/{id}/activate, /suspend, /resume, /terminate, /amendments"
      - "POST /data-feed-batches/{id}/validate"
    shared_operations:
      - "GET endpoints (all roles)"
  - name: PrivacyOfficer
    description: "Owns de-identification, batch accept/reject, prescriber opt-outs, and jurisdiction rules. Segregated from acquisition operations."
    identity: opaque
    exclusive_operations:
      - "POST /deidentification-profiles"
      - "POST /data-feed-batches/{id}/deidentify, /accept, /reject"
      - "POST /prescribers/{id}/opt-outs"
      - "POST /prescriber-opt-outs/{id}/verify, /activate, /reject, /lift"
      - "POST /jurisdiction-rules"
    shared_operations:
      - "GET endpoints (all roles)"
  - name: SupplierOperator
    description: "External supplier operator; submits and reprocesses feed batches only for own supplier's agreements"
    identity: "entity_backed:DataSupplier"
    exclusive_operations:
      - "POST /data-feed-batches (own supplier's ACTIVE agreements only)"
      - "POST /data-feed-batches/{id}/reprocess (own supplier's batches only)"
    shared_operations:
      - "GET endpoints (all roles)"
  - name: ManufacturerClient
    description: "External licensee; exercises audit rights and reads own licensed products and deliveries"
    identity: "entity_backed:ManufacturerClient"
    exclusive_operations:
      - "POST /clients/{id}/audit-requests (own client id only)"
    shared_operations:
      - "GET endpoints (all roles; own record only for GET /clients/{id})"
      - "POST /report-products/{id}/invoice-preview (with PlatformAdmin)"
      - "POST /audit-events/{id}/cancel (with PlatformAdmin)"
