  # ---------------------------------------------------------------- Rule 3
  - rule_id: non_linear_state_machine
    instances:
      - name: return_order_inspecting_exception_pending_cycle
        grounds:
          - state_machines.ReturnOrder.INSPECTING_to_EXCEPTION_PENDING
          - state_machines.ReturnOrder.EXCEPTION_PENDING_to_INSPECTING
        distinguishing_aspect: |
          ReturnOrder exhibits a true cycle: INSPECTING -> EXCEPTION_PENDING ->
          INSPECTING, and the order reaches REFUND_POSTED only after the loop
          exits; status history visits INSPECTING twice.
        test_recipe:
          setup:
            - "Plan free_returns=false, pickup true; merchant; cycle; shopper; zone"
            - "Order with items A (4000, declared NEW) and B (2500, declared NEW); fulfilled to INSPECTING; item A inspected DAMAGED first (order stays INSPECTING since B pending)"
          setup_api_calls:
            - { call: "POST /v1/subscription-plans", payload: { tier: CUSTOM, monthly_fee_cents: 1000, included_returns: 100, overage_fee_cents: 10, pickup_enabled: true, boxless_enabled: true, oversize_enabled: true, free_returns: false, oversize_surcharge_cents: 0, pickup_fee_cents: 0 }, as: PlatformAdmin, captures: { plan_id: $.data.id } }
            - { call: "POST /v1/subscription-plans/${plan_id}/publish", payload: {}, as: PlatformAdmin }
            - { call: "POST /v1/merchant-accounts", payload: { legal_name: "M-Cyc", plan_id: "${plan_id}" }, as: PlatformAdmin, captures: { m_id: $.data.id } }
            - { call: "POST /v1/merchant-accounts/${m_id}/billing-cycles", payload: { period_start: "2026-04-01T00:00:00Z", period_end: "2026-07-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /v1/shoppers", payload: { email: "sc@x.com", full_name: "S Cyc", postal_code: "10007" }, as: Shopper, captures: { sh_id: $.data.id } }
            - { call: "POST /v1/courier-zones", payload: { zone_code: "ZC2", window_capacity: 10 }, as: PlatformAdmin, captures: { zone_id: $.data.id } }
            - { call: "POST /v1/return-orders", payload: { shopper_id: "${sh_id}", merchant_id: "${m_id}", method: HOME_PICKUP, boxless: true, items: [ { sku: "CA", quantity: 1, unit_price_cents: 4000, declared_condition: NEW, longest_side_cm: 20, weight_grams: 200 }, { sku: "CB", quantity: 1, unit_price_cents: 2500, declared_condition: NEW, longest_side_cm: 20, weight_grams: 200 } ] }, as: Shopper, as_user_id: "${sh_id}", captures: { ro_id: $.data.id } }
            - { call: "POST /v1/pickup-appointments", payload: { return_order_id: "${ro_id}", zone_id: "${zone_id}", window_start: "2026-05-01T00:30:00Z", window_end: "2026-05-01T02:30:00Z" }, as: Shopper, as_user_id: "${sh_id}", captures: { ap: $.data.id } }
            - { call: "POST /v1/pickup-appointments/${ap}/start", payload: {}, as: PlatformAdmin }
            - { call: "POST /v1/pickup-appointments/${ap}/collect", payload: {}, as: PlatformAdmin }
            - { call: "POST /v1/return-orders/${ro_id}/receive", payload: {}, as: PlatformAdmin }
            - { call: "GET /v1/return-orders/${ro_id}/items", payload: {}, as: PlatformAdmin, captures: { it_a: "$.data[0].id", it_b: "$.data[1].id" } }
            - { call: "POST /v1/return-items/${it_a}/inspect", payload: { condition: DAMAGED }, as: PlatformAdmin }
          trigger:
            - { call: "POST /v1/exception-cases", payload: { return_order_id: "${ro_id}", kind: DAMAGED_ITEM, note: "dispute damage", return_item_id: "${it_a}" }, as: SupportAgent, as_user_id: "agent-a", captures: { ex_id: $.data.id, ex_v: $.data.version } }
            - { call: "GET /v1/return-orders/${ro_id}", payload: {}, as: SupportAgent, captures: { st_mid: $.data.status } }
            - { call: "POST /v1/exception-cases/${ex_id}/start-investigation", payload: {}, as: SupportAgent, as_user_id: "agent-a" }
            - { call: "POST /v1/exception-cases/${ex_id}/resolve", payload: { resolution: REJECTED, note: "damage confirmed", expected_exception_case_version: "${ex_v}" }, as: SupportAgent, as_user_id: "agent-b", captures: { ex_after: $.data.status } }
            - { call: "GET /v1/return-orders/${ro_id}", payload: {}, as: SupportAgent, captures: { st_back: $.data.status } }
            - { call: "POST /v1/return-items/${it_b}/inspect", payload: { condition: NEW }, as: PlatformAdmin }
            - { call: "GET /v1/return-orders/${ro_id}", payload: {}, as: SupportAgent, captures: { st_end: $.data.status, fin: $.data.refund_final_cents } }
          assert:
            - "st_mid == EXCEPTION_PENDING (cycle entry)"
            - "ex_after == RESOLVED_REJECTED and st_back == INSPECTING (cycle exit back to INSPECTING because item B still PENDING)"
            - "st_end == REFUND_POSTED and fin == 4500 (A DAMAGED 2000 refund + B NEW 2500)"

      - name: exception_case_appeal_reopen_cycle
        grounds:
          - state_machines.ExceptionCase.RESOLVED_REJECTED_to_REOPENED
          - state_machines.ExceptionCase.REOPENED_to_INVESTIGATING
        distinguishing_aspect: |
          ExceptionCase cycles RESOLVED_* -> REOPENED -> INVESTIGATING ->
          RESOLVED_* twice; the third appeal is rejected with
          ERR_APPEAL_LIMIT_REACHED (appeal_count == 2 boundary).
        test_recipe:
          setup:
            - "Plan pickup true; merchant; cycle; shopper; zone; order IN_TRANSIT via pickup collect; DAMAGED_ITEM exception opened by agent-a on the (single) item while order IN_TRANSIT -> EXCEPTION_PENDING"
          setup_api_calls:
            - { call: "POST /v1/subscription-plans", payload: { tier: CUSTOM, monthly_fee_cents: 1000, included_returns: 100, overage_fee_cents: 10, pickup_enabled: true, boxless_enabled: true, oversize_enabled: true, free_returns: false, oversize_surcharge_cents: 0, pickup_fee_cents: 0 }, as: PlatformAdmin, captures: { plan_id: $.data.id } }
            - { call: "POST /v1/subscription-plans/${plan_id}/publish", payload: {}, as: PlatformAdmin }
            - { call: "POST /v1/merchant-accounts", payload: { legal_name: "M-App", plan_id: "${plan_id}" }, as: PlatformAdmin, captures: { m_id: $.data.id } }
            - { call: "POST /v1/merchant-accounts/${m_id}/billing-cycles", payload: { period_start: "2026-04-01T00:00:00Z", period_end: "2026-07-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /v1/shoppers", payload: { email: "sa@x.com", full_name: "S App", postal_code: "10008" }, as: Shopper, captures: { sh_id: $.data.id } }
            - { call: "POST /v1/courier-zones", payload: { zone_code: "ZA", window_capacity: 10 }, as: PlatformAdmin, captures: { zone_id: $.data.id } }
            - { call: "POST /v1/return-orders", payload: { shopper_id: "${sh_id}", merchant_id: "${m_id}", method: HOME_PICKUP, boxless: true, items: [ { sku: "AP", quantity: 1, unit_price_cents: 4000, declared_condition: NEW, longest_side_cm: 20, weight_grams: 200 } ] }, as: Shopper, as_user_id: "${sh_id}", captures: { ro_id: $.data.id } }
            - { call: "POST /v1/pickup-appointments", payload: { return_order_id: "${ro_id}", zone_id: "${zone_id}", window_start: "2026-05-01T00:30:00Z", window_end: "2026-05-01T02:30:00Z" }, as: Shopper, as_user_id: "${sh_id}", captures: { ap: $.data.id } }
            - { call: "POST /v1/pickup-appointments/${ap}/start", payload: {}, as: PlatformAdmin }
            - { call: "POST /v1/pickup-appointments/${ap}/collect", payload: {}, as: PlatformAdmin }
            - { call: "GET /v1/return-orders/${ro_id}/items", payload: {}, as: PlatformAdmin, captures: { it_a: "$.data[0].id" } }
            - { call: "POST /v1/exception-cases", payload: { return_order_id: "${ro_id}", kind: DAMAGED_ITEM, note: "opened", return_item_id: "${it_a}" }, as: SupportAgent, as_user_id: "agent-a", captures: { ex_id: $.data.id, ex_v1: $.data.version } }
            - { call: "POST /v1/exception-cases/${ex_id}/start-investigation", payload: {}, as: SupportAgent, as_user_id: "agent-a", captures: { ex_v2: $.data.version } }
            - { call: "POST /v1/exception-cases/${ex_id}/resolve", payload: { resolution: REJECTED, expected_exception_case_version: "${ex_v2}" }, as: SupportAgent, as_user_id: "agent-b", captures: { ex_v3: $.data.version, ex_st1: $.data.status } }
          trigger:
            - { call: "POST /v1/exception-cases/${ex_id}/appeal", payload: { appeal_note: "please recheck" }, as: Shopper, as_user_id: "${sh_id}", captures: { ex_v4: $.data.version, ex_st2: $.data.status } }
            - { call: "POST /v1/exception-cases/${ex_id}/start-investigation", payload: {}, as: SupportAgent, as_user_id: "agent-a", captures: { ex_v5: $.data.version } }
            - { call: "POST /v1/exception-cases/${ex_id}/resolve", payload: { resolution: APPROVED, note: "upheld", expected_exception_case_version: "${ex_v5}" }, as: SupportAgent, as_user_id: "agent-b", captures: { ex_v6: $.data.version, ex_st3: $.data.status } }
            - { call: "POST /v1/exception-cases/${ex_id}/appeal", payload: { appeal_note: "second appeal" }, as: Shopper, as_user_id: "${sh_id}", captures: { ex_v7: $.data.version, ex_ac: $.data.appeal_count } }
            - { call: "POST /v1/exception-cases/${ex_id}/start-investigation", payload: {}, as: SupportAgent, as_user_id: "agent-a", captures: { ex_v8: $.data.version } }
            - { call: "POST /v1/exception-cases/${ex_id}/resolve", payload: { resolution: APPROVED, expected_exception_case_version: "${ex_v8}" }, as: SupportAgent, as_user_id: "agent-b", captures: { ex_st4: $.data.status } }
            - { call: "POST /v1/exception-cases/${ex_id}/appeal", payload: { appeal_note: "third appeal must fail" }, as: Shopper, as_user_id: "${sh_id}", captures: { err: $.data.error_id } }
          assert:
            - "ex_st1 == RESOLVED_REJECTED then ex_st2 == REOPENED then ex_st3 == RESOLVED_APPROVED (first full loop)"
            - "ex_ac == 2 after second appeal; ex_st4 == RESOLVED_APPROVED (second full loop)"
            - "err == ERR_APPEAL_LIMIT_REACHED on the third appeal (appeal_count >= 2)"

      - name: tote_seal_unseal_discrepancy_cycles
        grounds:
          - state_machines.ConsolidationTote.SEALED_to_FILLING
          - state_machines.ConsolidationTote.ARRIVED_to_DISCREPANCY
          - state_machines.ConsolidationTote.DISCREPANCY_to_RECONCILED
        distinguishing_aspect: |
          ConsolidationTote (third non-linear entity): SEALED -> FILLING unseal
          revert permits further membership change and a second seal; after
          dispatch/arrive the ARRIVED -> DISCREPANCY -> RECONCILED audit loop runs.
        test_recipe:
          setup:
            - "Counter location L (OPERATIONAL), route R (origin L, capacity 100000), tote T on R; two counter orders O1/O2 dropped off at L"
          setup_api_calls:
            - { call: "POST /v1/subscription-plans", payload: { tier: CUSTOM, monthly_fee_cents: 1000, included_returns: 100, overage_fee_cents: 10, pickup_enabled: false, boxless_enabled: true, oversize_enabled: true, free_returns: false, oversize_surcharge_cents: 0, pickup_fee_cents: 0 }, as: PlatformAdmin, captures: { plan_id: $.data.id } }
            - { call: "POST /v1/subscription-plans/${plan_id}/publish", payload: {}, as: PlatformAdmin }
            - { call: "POST /v1/merchant-accounts", payload: { legal_name: "M-Tote", plan_id: "${plan_id}" }, as: PlatformAdmin, captures: { m_id: $.data.id } }
            - { call: "POST /v1/merchant-accounts/${m_id}/billing-cycles", payload: { period_start: "2026-04-01T00:00:00Z", period_end: "2026-07-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /v1/shoppers", payload: { email: "so@x.com", full_name: "S Tote", postal_code: "10009" }, as: Shopper, captures: { sh_id: $.data.id } }
            - { call: "POST /v1/dropoff-locations", payload: { name: "L-Tote", kind: COUNTER, postal_code: "20001" }, as: PlatformAdmin, captures: { loc_id: $.data.id } }
            - { call: "POST /v1/dropoff-locations/${loc_id}/activate", payload: {}, as: PlatformAdmin }
            - { call: "POST /v1/carrier-routes", payload: { origin_location_id: "${loc_id}", destination_facility: "FAC-1", weight_capacity_grams: 100000 }, as: CarrierDispatcher, captures: { route_id: $.data.id } }
            - { call: "POST /v1/consolidation-totes", payload: { route_id: "${route_id}", location_id: "${loc_id}" }, as: LocationOperator, as_user_id: "${loc_id}", captures: { tote_id: $.data.id, tote_v: $.data.version } }
            - { call: "POST /v1/return-orders", payload: { shopper_id: "${sh_id}", merchant_id: "${m_id}", method: COUNTER_DROP, boxless: false, items: [ { sku: "T1", quantity: 1, unit_price_cents: 900, declared_condition: NEW, longest_side_cm: 30, weight_grams: 500 } ] }, as: Shopper, as_user_id: "${sh_id}", captures: { ro1: $.data.id, ro1_v: $.data.version } }
            - { call: "POST /v1/return-orders/${ro1}/labels", payload: { label_type: CARRIER_LABEL, expected_return_order_version: "${ro1_v}" }, as: Shopper, as_user_id: "${sh_id}" }
            - { call: "POST /v1/return-orders/${ro1}/confirm-dropoff", payload: { location_id: "${loc_id}" }, as: LocationOperator, as_user_id: "${loc_id}" }
            - { call: "POST /v1/return-orders", payload: { shopper_id: "${sh_id}", merchant_id: "${m_id}", method: COUNTER_DROP, boxless: false, items: [ { sku: "T2", quantity: 2, unit_price_cents: 700, declared_condition: NEW, longest_side_cm: 30, weight_grams: 400 } ] }, as: Shopper, as_user_id: "${sh_id}", captures: { ro2: $.data.id, ro2_v: $.data.version } }
            - { call: "POST /v1/return-orders/${ro2}/labels", payload: { label_type: CARRIER_LABEL, expected_return_order_version: "${ro2_v}" }, as: Shopper, as_user_id: "${sh_id}" }
            - { call: "POST /v1/return-orders/${ro2}/confirm-dropoff", payload: { location_id: "${loc_id}" }, as: LocationOperator, as_user_id: "${loc_id}" }
          trigger:
            - { call: "POST /v1/consolidation-totes/${tote_id}/return-orders", payload: { return_order_id: "${ro1}", expected_tote_version: "${tote_v}" }, as: LocationOperator, as_user_id: "${loc_id}", captures: { tote_v2: $.data.version } }
            - { call: "POST /v1/consolidation-totes/${tote_id}/seal", payload: {}, as: LocationOperator, as_user_id: "${loc_id}", captures: { sealed_by: $.data.sealed_by_user_id } }
            - { call: "POST /v1/consolidation-totes/${tote_id}/unseal", payload: {}, as: LocationOperator, as_user_id: "${loc_id}", captures: { st_unseal: $.data.status, cleared_by: $.data.sealed_by_user_id, tote_v4: $.data.version } }
            - { call: "POST /v1/consolidation-totes/${tote_id}/return-orders", payload: { return_order_id: "${ro2}", expected_tote_version: "${tote_v4}" }, as: LocationOperator, as_user_id: "${loc_id}", captures: { tote_v5: $.data.version, tote_units: $.data.manifest_units } }
            - { call: "POST /v1/consolidation-totes/${tote_id}/seal", payload: {}, as: LocationOperator, as_user_id: "${loc_id}" }
            - { call: "POST /v1/carrier-routes/${route_id}/dispatch", payload: {}, as: CarrierDispatcher }
            - { call: "POST /v1/consolidation-totes/${tote_id}/dispatch", payload: {}, as: LocationOperator, as_user_id: "${loc_id}" }
            - { call: "POST /v1/consolidation-totes/${tote_id}/arrive", payload: {}, as: CarrierDispatcher }
