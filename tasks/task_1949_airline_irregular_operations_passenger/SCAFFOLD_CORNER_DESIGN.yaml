            - { call: "POST /irops/passengers", payload: { full_name: "Bob Own", contact_email: "b@x.com" }, as: ReaccommodationAgent, captures: { pb: "$.data.id" } }
            - { call: "POST /irops/flights", payload: { flight_number: "OC71", origin: "HUB", destination: "DST", sched_dep_utc: "2026-08-10T09:00:00Z", sched_arr_utc: "2026-08-10T10:00:00Z", distance_km: 900, operating_carrier: "OC", cabins: [{ cabin: "ECONOMY", capacity: 50 }] }, as: OpsController, captures: { f: "$.data.id" } }
