# =============================================================================
# §1.9 Scaffold Corner Design — Coverage Index for Non-Difficulty Tests
# Task: task_1609_coffee_roasting_plant_green_coffee
# =============================================================================

scaffold_corner_design:

  # ===========================================================================
  # Section: entities — creation, defaults, computed, system fields
  # ===========================================================================
  - section: entities
    instances:
      - name: create_counterparty_with_all_required_fields_returns_201
        claim_type: creation
        grounds:
          - 'endpoints."POST /roastery/counterparties'
          - "entities.Counterparty"
        distinguishing_aspect: "POST /roastery/counterparties with all required inputs returns 201 and the response carries system-minted id, created_at, updated_at, version=1, counterparty_status=ACTIVE, open_exposure_usd=0."
        test_recipe:
          setup: ["Empty DB; clock at default."]
          setup_api_calls:
            - call: "POST /roastery/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /roastery/counterparties"
              payload: { counterparty_ref: "SUP-NEW", legal_name: "New Supplier", counterparty_kind: "SUPPLIER", credit_limit_usd: 100000 }
              as: Trader
              captures: { new_id: $.data.id, new_status: $.data.counterparty_status, new_expo: $.data.open_exposure_usd, new_version: $.data.version }
          assert:
            - "HTTP 201"
            - "new_id is a UUID with no type prefix"
            - "new_status == ACTIVE"
            - "new_expo == 0"
            - "new_version == 1"

      - name: create_counterparty_missing_credit_limit_returns_invalid_request
        claim_type: required_field
        grounds:
          - 'endpoints."POST /roastery/counterparties'
          - "validations[priority=23"
        distinguishing_aspect: "Omitting required credit_limit_usd on counterparty create yields ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls:
            - call: "POST /roastery/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /roastery/counterparties"
              payload: { counterparty_ref: "SUP-MISS", legal_name: "Missing Field", counterparty_kind: "SUPPLIER" }
              as: Trader
              captures: { miss_err: $.data.error_id }
          assert:
            - "miss_err == ERR_INVALID_REQUEST"
            - "HTTP status == 400"

      - name: contract_fixed_outright_initializes_pricing_fields
        claim_type: computed_field
        grounds:
          - "entities.Contract.fields.pricing_status"
          - "state_machines.Contract"
        distinguishing_aspect: "FIXED_OUTRIGHT contract creation sets pricing_status = NOT_APPLICABLE, fixed_lbs_accum = total_lbs, unpriced_lbs = 0, weighted_avg_fixed_futures_usd = null, priced_notional_usd = total_lbs * fixed_price."
        test_recipe:
          setup: ["Supplier exists."]
          setup_api_calls:
            - call: "POST /roastery/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /roastery/counterparties"
              payload: { counterparty_ref: "SUP-FO", legal_name: "FixedOut Co", counterparty_kind: "SUPPLIER", credit_limit_usd: 1000000 }
              as: Trader
              captures: { sup_fo: $.data.id }
          trigger:
            - call: "POST /roastery/counterparties/${sup_fo}/contracts"
              payload: { contract_ref: "C-FO", pricing_mode: "FIXED_OUTRIGHT", coffee_grade: "SHB", total_lbs: 5000, fixed_price_usd_per_lb: 2.50, delivery_window_start: "2026-08-01T00:00:00Z", delivery_window_end: "2026-12-31T23:59:59Z" }
              as: Trader
              captures: { c_fo: $.data.id, c_fo_ps: $.data.pricing_status, c_fo_fl: $.data.fixed_lbs_accum, c_fo_un: $.data.unpriced_lbs, c_fo_wavg: $.data.weighted_avg_fixed_futures_usd, c_fo_not: $.data.priced_notional_usd }
          assert:
            - "c_fo_ps == NOT_APPLICABLE"
            - "c_fo_fl == 5000"
            - "c_fo_un == 0"
            - "c_fo_wavg == null"
            - "c_fo_not == 12500.00 (5000 * 2.50)"

      - name: entity_system_fields_id_created_at_updated_at_present
        claim_type: system_fields
        grounds:
          - "entities.Counterparty"
        distinguishing_aspect: "Server mints id, created_at, updated_at, version on creation; client-supplied values for these fields are ignored."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls:
            - call: "POST /roastery/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /roastery/counterparties"
              payload: { counterparty_ref: "SUP-SYS", legal_name: "Sys Fields", counterparty_kind: "SUPPLIER", credit_limit_usd: 1000 }
              as: Trader
              captures: { sys_id: $.data.id, sys_ca: $.data.created_at, sys_ua: $.data.updated_at, sys_v: $.data.version }
          assert:
            - "sys_id matches UUID format"
            - "sys_ca == sys_ua == 2026-08-01T00:00:00Z (the server logical clock)"
            - "sys_v == 1"

      - name: green_lot_available_lbs_computed_not_input
        claim_type: computed_field
        grounds:
          - "entities.GreenLot.fields.available_lbs"
        distinguishing_aspect: "available_lbs is system-computed; a client-submitted available_lbs value on receive is ignored."
        test_recipe:
          setup: ["ARRIVED shipment ready to receive."]
          setup_api_calls:
            - call: "POST /roastery/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /roastery/counterparties"
              payload: { counterparty_ref: "SUP-CMP", legal_name: "Computed Co", counterparty_kind: "SUPPLIER", credit_limit_usd: 1000000 }
              as: Trader
              captures: { sup_cmp: $.data.id }
            - call: "POST /roastery/counterparties/${sup_cmp}/contracts"
              payload: { contract_ref: "C-CMP", pricing_mode: "FIXED_OUTRIGHT", coffee_grade: "SHB", total_lbs: 1000, fixed_price_usd_per_lb: 2.00, delivery_window_start: "2026-08-01T00:00:00Z", delivery_window_end: "2026-12-31T23:59:59Z" }
              as: Trader
              captures: { c_cmp: $.data.id }
            - call: "POST /roastery/contracts/${c_cmp}/shipments"
              payload: { shipment_ref: "SH-CMP", planned_lbs: 1000, scheduled_arrival: "2026-09-01T00:00:00Z" }
              as: LogisticsCoordinator
              captures: { sh_cmp: $.data.id }
            - call: "POST /roastery/shipments/${sh_cmp}/depart"
              as: LogisticsCoordinator
            - call: "POST /roastery/shipments/${sh_cmp}/arrive"
              as: LogisticsCoordinator
          trigger:
            - call: "POST /roastery/shipments/${sh_cmp}/receive"
              payload: { received_lbs: 1000, lot_code: "L-CMP", moisture_pct: 11, warehouse_location: "WH-A" }
              as: WarehouseClerk
            - call: "GET /roastery/green-lots"
              payload: { shipment_id: "${sh_cmp}" }
              as: WarehouseClerk
              captures: { cmp_avail: "$.data[0].available_lbs", cmp_recv: "$.data[0].received_lbs" }
          assert:
            - "cmp_recv == 1000"
            - "cmp_avail == 1000 (computed = received_lbs initially; no client override possible)"

      - name: enum_out_of_set_rejected
        claim_type: type_constraint
        grounds:
          - "validations[priority=22"
        distinguishing_aspect: "Submitting counterparty_kind = 'BROKER' (not in {SUPPLIER, IMPORTER, CUSTOMER}) is rejected with ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls:
            - call: "POST /roastery/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /roastery/counterparties"
              payload: { counterparty_ref: "SUP-ENUM", legal_name: "Enum Violator", counterparty_kind: "BROKER", credit_limit_usd: 1000 }
              as: Trader
              captures: { enum_err: $.data.error_id }
          assert:
            - "enum_err == ERR_INVALID_REQUEST"
            - "HTTP status == 400"

      - name: not_found_on_bogus_id
        claim_type: not_found
        grounds:
          - "validations[priority=4"
        distinguishing_aspect: "GET on a non-existent UUID returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls:
            - call: "POST /roastery/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "GET /roastery/counterparties/00000000-0000-0000-0000-000000000000"
              as: Trader
              captures: { nf_err: $.data.error_id }
          assert:
            - "nf_err == ERR_NOT_FOUND"
            - "HTTP status == 404"

      - name: price_fix_event_is_append_only
        claim_type: immutability
        grounds:
          - "entities.PriceFixEvent"
        distinguishing_aspect: "PriceFixEvent has common_fields: false — no update endpoint, no version field; only id and created_at are present. Attempting PUT/PATCH on a price-fix returns 404 or 405."
        test_recipe:
          setup: ["One contract with one price-fix event recorded."]
          setup_api_calls:
            - call: "POST /roastery/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /roastery/counterparties"
              payload: { counterparty_ref: "SUP-IMM", legal_name: "Immutable Co", counterparty_kind: "SUPPLIER", credit_limit_usd: 1000000 }
              as: Trader
              captures: { sup_imm: $.data.id }
            - call: "POST /roastery/counterparties/${sup_imm}/contracts"
              payload: { contract_ref: "C-IMM", pricing_mode: "DIFFERENTIAL_PTBF", coffee_grade: "SHB", total_lbs: 5000, differential_usd_per_lb: 0.25, delivery_window_start: "2026-08-01T00:00:00Z", delivery_window_end: "2026-12-31T23:59:59Z" }
              as: Trader
              captures: { c_imm: $.data.id, c_imm_v0: $.data.version }
            - call: "POST /roastery/contracts/${c_imm}/price-fixes"
              payload: { fix_lbs: 1000, futures_price_usd_per_lb: 1.80, expected_contract_version: "${c_imm_v0}" }
              as: Trader
              captures: { imm_fix_id: $.data.id }
          trigger:
            - call: "GET /roastery/contracts/${c_imm}/price-fixes"
              as: Trader
              captures: { imm_list: "$.data[0].id", imm_version_present: "$.data[0].version" }
          assert:
            - "imm_list == imm_fix_id"
            - "PriceFixEvent has no `version` field in response (common_fields: false)"
            - "PriceFixEvent has `id` and `created_at` only as system fields"

  # ===========================================================================
  # Section: state_machines — valid/invalid transitions, terminal lockdown, initial state
  # ===========================================================================
  - section: state_machines
    instances:
      - name: contract_initial_state
        claim_type: initial_state
        grounds:
          - "state_machines.Contract"
        distinguishing_aspect: "Newly created PTBF Contract has pricing_status = UNFIXED and fulfillment_status = OPEN."
        test_recipe:
          setup: ["Supplier exists."]
          setup_api_calls:
            - call: "POST /roastery/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /roastery/counterparties"
              payload: { counterparty_ref: "SUP-INIT", legal_name: "Init Co", counterparty_kind: "SUPPLIER", credit_limit_usd: 1000000 }
              as: Trader
              captures: { sup_init: $.data.id }
          trigger:
            - call: "POST /roastery/counterparties/${sup_init}/contracts"
              payload: { contract_ref: "C-INIT", pricing_mode: "DIFFERENTIAL_PTBF", coffee_grade: "SHB", total_lbs: 1000, differential_usd_per_lb: 0.25, delivery_window_start: "2026-08-01T00:00:00Z", delivery_window_end: "2026-12-31T23:59:59Z" }
              as: Trader
              captures: { init_ps: $.data.pricing_status, init_fs: $.data.fulfillment_status }
          assert:
            - "init_ps == UNFIXED"
            - "init_fs == OPEN"

      - name: shipment_cancel_from_received_returns_invalid_state
        claim_type: invalid_transition
        grounds:
          - "state_machines.Shipment.transitions"
        distinguishing_aspect: "Shipment cancel is only permitted from BOOKED; attempting to cancel a RECEIVED shipment returns ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["Shipment fully received."]
          setup_api_calls:
            - call: "POST /roastery/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /roastery/counterparties"
              payload: { counterparty_ref: "SUP-INV2", legal_name: "InvTrans Co", counterparty_kind: "SUPPLIER", credit_limit_usd: 1000000 }
              as: Trader
              captures: { sup_inv2: $.data.id }
            - call: "POST /roastery/counterparties/${sup_inv2}/contracts"
              payload: { contract_ref: "C-INV2", pricing_mode: "FIXED_OUTRIGHT", coffee_grade: "SHB", total_lbs: 1000, fixed_price_usd_per_lb: 2.00, delivery_window_start: "2026-08-01T00:00:00Z", delivery_window_end: "2026-12-31T23:59:59Z" }
              as: Trader
              captures: { c_inv2: $.data.id }
            - call: "POST /roastery/contracts/${c_inv2}/shipments"
              payload: { shipment_ref: "SH-INV2", planned_lbs: 1000, scheduled_arrival: "2026-09-01T00:00:00Z" }
              as: LogisticsCoordinator
              captures: { sh_inv2: $.data.id }
            - call: "POST /roastery/shipments/${sh_inv2}/depart"
              as: LogisticsCoordinator
            - call: "POST /roastery/shipments/${sh_inv2}/arrive"
              as: LogisticsCoordinator
            - call: "POST /roastery/shipments/${sh_inv2}/receive"
              payload: { received_lbs: 1000, lot_code: "L-INV2", moisture_pct: 11, warehouse_location: "WH-A" }
              as: WarehouseClerk
          trigger:
            - call: "POST /roastery/shipments/${sh_inv2}/cancel"
              as: LogisticsCoordinator
              captures: { inv2_err: $.data.error_id }
          assert:
            - "inv2_err == ERR_INVALID_STATE"
            - "HTTP status == 409"

      - name: terminal_state_lockdown_shipment
        claim_type: terminal_lockdown
        grounds:
          - "state_machines.Shipment"
        distinguishing_aspect: "Once Shipment.transit_status = CANCELLED (terminal), all further action endpoints (depart, arrive, receive, cancel, resolve-dispute) return ERR_INVALID_STATE."
        test_recipe:
          setup: ["BOOKED shipment cancelled."]
          setup_api_calls:
            - call: "POST /roastery/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /roastery/counterparties"
              payload: { counterparty_ref: "SUP-TERM", legal_name: "Terminal Co", counterparty_kind: "SUPPLIER", credit_limit_usd: 1000000 }
              as: Trader
              captures: { sup_term: $.data.id }
            - call: "POST /roastery/counterparties/${sup_term}/contracts"
              payload: { contract_ref: "C-TERM", pricing_mode: "FIXED_OUTRIGHT", coffee_grade: "SHB", total_lbs: 1000, fixed_price_usd_per_lb: 2.00, delivery_window_start: "2026-08-01T00:00:00Z", delivery_window_end: "2026-12-31T23:59:59Z" }
              as: Trader
              captures: { c_term: $.data.id }
            - call: "POST /roastery/contracts/${c_term}/shipments"
              payload: { shipment_ref: "SH-TERM", planned_lbs: 1000, scheduled_arrival: "2026-09-01T00:00:00Z" }
              as: LogisticsCoordinator
              captures: { sh_term: $.data.id }
            - call: "POST /roastery/shipments/${sh_term}/cancel"
              as: LogisticsCoordinator
          trigger:
            - call: "POST /roastery/shipments/${sh_term}/depart"
              as: LogisticsCoordinator
              captures: { term_err: $.data.error_id }
          assert:
            - "term_err == ERR_INVALID_STATE"
            - "HTTP status == 409"

      - name: terminal_state_lockdown_futures_hedge
        claim_type: terminal_lockdown
        grounds:
          - "state_machines.FuturesHedge"
        distinguishing_aspect: "Once FuturesHedge.hedge_status = LIFTED (terminal), approve and cancel both return ERR_INVALID_STATE."
        test_recipe:
          setup: ["APPROVED hedge manually lifted."]
          setup_api_calls:
            - call: "POST /roastery/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /roastery/counterparties"
              payload: { counterparty_ref: "SUP-HTL", legal_name: "HedgeTL Co", counterparty_kind: "SUPPLIER", credit_limit_usd: 10000000 }
              as: Trader
              captures: { sup_htl: $.data.id }
            - call: "POST /roastery/counterparties/${sup_htl}/contracts"
              payload: { contract_ref: "C-HTL", pricing_mode: "DIFFERENTIAL_PTBF", coffee_grade: "SHB", total_lbs: 5000, differential_usd_per_lb: 0.25, delivery_window_start: "2026-08-01T00:00:00Z", delivery_window_end: "2026-12-31T23:59:59Z" }
              as: Trader
              captures: { c_htl: $.data.id }
            - call: "POST /roastery/contracts/${c_htl}/futures-hedges"
              payload: { hedge_side: "BUY_FUTURES", hedge_lbs: 1000, entry_price_usd_per_lb: 1.80 }
              as: Trader
              as_user_id: "trader-htl"
              captures: { htl_id: $.data.id }
            - call: "POST /roastery/futures-hedges/${htl_id}/approve"
              as: RiskManager
              as_user_id: "risk-htl"
            - call: "POST /roastery/futures-hedges/${htl_id}/lift"
              payload: { exit_price_usd_per_lb: 1.90 }
              as: Trader
          trigger:
            - call: "POST /roastery/futures-hedges/${htl_id}/approve"
              as: RiskManager
              as_user_id: "risk-htl"
              captures: { htl_err: $.data.error_id }
          assert:
            - "htl_err == ERR_INVALID_STATE"
            - "HTTP status == 409"

      - name: roast_batch_void_from_packed_returns_invalid_state
        claim_type: invalid_transition
        grounds:
          - "state_machines.RoastBatch"
        distinguishing_aspect: "RoastBatch void is only valid from SCHEDULED; from PACKED it returns ERR_INVALID_STATE."
        test_recipe:
          setup: ["RoastBatch fully packed (PACKED state)."]
          setup_api_calls:
            - call: "POST /roastery/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /roastery/counterparties"
              payload: { counterparty_ref: "SUP-VO", legal_name: "Void Co", counterparty_kind: "SUPPLIER", credit_limit_usd: 1000000 }
              as: Trader
              captures: { sup_vo: $.data.id }
            - call: "POST /roastery/counterparties/${sup_vo}/contracts"
              payload: { contract_ref: "C-VO", pricing_mode: "FIXED_OUTRIGHT", coffee_grade: "SHB", total_lbs: 5000, fixed_price_usd_per_lb: 2.00, delivery_window_start: "2026-08-01T00:00:00Z", delivery_window_end: "2026-12-31T23:59:59Z" }
              as: Trader
              captures: { c_vo: $.data.id }
            - call: "POST /roastery/contracts/${c_vo}/shipments"
              payload: { shipment_ref: "SH-VO", planned_lbs: 5000, scheduled_arrival: "2026-09-01T00:00:00Z" }
              as: LogisticsCoordinator
              captures: { sh_vo: $.data.id }
            - call: "POST /roastery/shipments/${sh_vo}/depart"
              as: LogisticsCoordinator
            - call: "POST /roastery/shipments/${sh_vo}/arrive"
              as: LogisticsCoordinator
            - call: "POST /roastery/shipments/${sh_vo}/receive"
              payload: { received_lbs: 5000, lot_code: "L-VO", moisture_pct: 11, warehouse_location: "WH-A" }
              as: WarehouseClerk
            - call: "POST /roastery/cupping-sessions"
              payload: { subject_kind: "GREEN_LOT", subject_id: "${sh_vo}", panelist_count: 3, score_aroma: 8.5, score_flavor: 8.5, score_aftertaste: 8.5, score_acidity: 8.5, score_body: 8.5, score_balance: 8.5, score_uniformity: 10, score_clean_cup: 10, score_sweetness: 10, score_overall: 8.5, defects_subtracted: 0 }
              as: QAGrader
              captures: { cup_vo: $.data.id }
            - call: "POST /roastery/cupping-sessions/${cup_vo}/finalize"
              as: QAGrader
              as_user_id: "qa-001"
            - call: "POST /roastery/roast-profiles"
              payload: { profile_code: "RP-VO", charge_temp_c: 200, target_drop_temp_c: 210, expected_yield_loss_pct: 0.16, shrinkage_alert_band_pct: 0.02 }
              as: HeadRoaster
              captures: { rp_vo: $.data.id }
            - call: "POST /roastery/products"
              payload: { sku: "P-VO", display_name: "Void Product", channel: "WHOLESALE", target_roast_profile_id: "${rp_vo}", freshness_days: 30 }
              as: HeadRoaster
              captures: { prod_vo: $.data.id, prod_vo_v0: $.data.version }
            - call: "POST /roastery/products/${prod_vo}/recipes"
              as: HeadRoaster
              captures: { r_vo: $.data.id }
            - call: "POST /roastery/recipes/${r_vo}/components"
              payload: { required_grade: "SHB", component_pct: 1.0 }
              as: HeadRoaster
            - call: "POST /roastery/recipes/${r_vo}/approve"
              payload: { expected_product_version: "${prod_vo_v0}" }
              as: HeadRoaster
            - call: "POST /roastery/roast-batches"
              payload: { product_id: "${prod_vo}", recipe_id: "${r_vo}", scheduled_green_lbs: 100 }
              as: RoastOperator
              captures: { b_vo: $.data.id }
            - call: "POST /roastery/roast-batches/${b_vo}/start"
              as: RoastOperator
              as_user_id: "ro-001"
            - call: "POST /roastery/roast-batches/${b_vo}/finish"
              payload: { actual_roasted_lbs: 84 }
              as: RoastOperator
              as_user_id: "ro-001"
            - call: "POST /roastery/cupping-sessions"
              payload: { subject_kind: "ROAST_BATCH", subject_id: "${b_vo}", panelist_count: 3, score_aroma: 8.0, score_flavor: 8.0, score_aftertaste: 8.0, score_acidity: 8.0, score_body: 8.0, score_balance: 8.0, score_uniformity: 10, score_clean_cup: 10, score_sweetness: 10, score_overall: 8.0, defects_subtracted: 0 }
              as: QAGrader
              captures: { cup_vo_b: $.data.id }
            - call: "POST /roastery/cupping-sessions/${cup_vo_b}/finalize"
              as: QAGrader
              as_user_id: "qa-002"
            - call: "POST /roastery/roast-batches/${b_vo}/pack"
              payload: { packed_lbs: 84 }
              as: RoastOperator
              as_user_id: "ro-001"
          trigger:
            - call: "POST /roastery/roast-batches/${b_vo}/void"
              as: RoastOperator
              captures: { vo_err: $.data.error_id }
          assert:
            - "vo_err == ERR_INVALID_STATE"
            - "HTTP status == 409"

  # ===========================================================================
  # Section: calculations
  # ===========================================================================
  - section: calculations
    instances:
      - name: cupping_score_at_79_99_fails
        claim_type: correct_result
