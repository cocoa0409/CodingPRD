              payload: { annual_committed_volume_kg: 5000, index_base_value: 100, index_pass_through_pct: 0.5, window_start: "2026-01-01T00:00:00Z", window_end: "2027-01-01T00:00:00Z", expected_approved_source_version: "${src_v}" }
              as: ProcurementManager
              captures: { ctr_id: $.data.id }
            - call: "POST /sourcing/approved-sources/${src_id}/contracts/${ctr_id}/activate"
              payload: {}
