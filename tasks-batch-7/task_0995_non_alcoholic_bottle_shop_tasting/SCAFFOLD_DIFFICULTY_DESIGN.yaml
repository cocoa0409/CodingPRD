              as: PlatformAdmin
              captures:
                sku10_id: "$.data.id"
            - call: "POST /nabs/members"
              payload: { email: "m10@x.com", full_name: "M Ten", date_of_birth: "1990-01-01", home_state_code: "CA" }
              as: PlatformAdmin
              captures:
                member10_id: "$.data.id"
            - call: "POST /nabs/shipping-state-rules"
              payload: { state_code: "UT", allows_dtc: false, min_age_years: 21, abv_cap_basis_points: 500, surcharge_cents_per_order: 0, tax_rate_bps: 0 }
              as: PlatformAdmin
            - call: "POST /nabs/orders"
              payload: { member_id: "${member10_id}", channel: "DTC", ship_to_state_code: "UT" }
              as: Member
              as_user_id: "${member10_id}"
              captures:
                order10_id: "$.data.id"
            - call: "POST /nabs/orders/${order10_id}/lines"
              payload: { sku_id: "${sku10_id}", qty: 5 }
              as: Member
              as_user_id: "${member10_id}"
            - call: "GET /nabs/orders/${order10_id}"
              as: Member
              as_user_id: "${member10_id}"
              captures:
                order10_v: "$.data.version"
          trigger:
            - call: "POST /nabs/orders/${order10_id}/submit"
              payload: { expected_order_version: "${order10_v}" }
              as: Member
              as_user_id: "${member10_id}"
              captures:
                err10: "$.data.error_id"
          assert:
            - "captured err10 == 'ERR_DTC_STATE_PROHIBITED' (referential priority 13 beats fiscal priority 17)"

