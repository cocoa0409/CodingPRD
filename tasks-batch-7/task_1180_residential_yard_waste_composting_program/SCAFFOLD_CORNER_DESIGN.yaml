          - "state_machines.ProcessingFacility.CLOSED_to_OPEN"
        distinguishing_aspect: "Facility toggles OPEN -> CLOSED -> OPEN via PATCH; each write increments version."
        test_recipe:
          setup: ["facility created (OPEN, version 1)"]
          setup_api_calls:
            - { call: "POST /facilities", payload: { name: "Compost Central", daily_receiving_capacity_lbs: 50000, safety_contamination_item_limit: 5 }, as: ProgramAdmin, captures: { fac: $.data.id, fv0: $.data.version } }
