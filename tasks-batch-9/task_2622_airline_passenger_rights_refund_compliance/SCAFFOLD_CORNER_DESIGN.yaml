          rationale: "The §1.8 combinatorial_formula instance already walks every tier boundary of the statutory ladder plus the nested min() cap, which subsumes the per-tier boundary claims."

      - name: headroom_constraint_propagates_through_cascade
        claim_type: constraint_propagation
        excluded_because:
          difficulty_instance: headroom_evaluation_order_clamps_cascade_in_pinned_sequence
          rationale: "The §1.8 instance drives the headroom constraint through the LINK 3a -> LINK 3b chain and asserts the fixed point after each clamp."

