              captures: { d3_lot: $.data.id }
            - call: "POST /api/lots/${d3_lot}/reserve"
              as: SalesConsultant
            - call: "POST /api/customers"
              payload: { full_name: "Alicia Buyer", email: "alicia@x.com", phone: "555-0100", credit_tier: "TIER_A" }
              as: SalesConsultant
              captures: { d3_cust: $.data.id }
            - call: "POST /api/home-units"
              payload: { model_id: "${d3_mdl}", serial_number: "SN-D3-1", unit_kind: "STOCK", condition_grade: "NEW" }
              as: DealershipAdmin
              captures: { d3_unit: $.data.id }
            - call: "POST /api/sales-orders"
              payload: { customer_id: "${d3_cust}", home_unit_id: "${d3_unit}", placement_type: "COMMUNITY_LOT", lot_id: "${d3_lot}", financing_type: "CHATTEL", agreed_home_price_cents: 9200000 }
              as: SalesConsultant
              captures: { d3_ord: $.data.id }
            - call: "POST /api/sales-orders/${d3_ord}/options"
              payload: { option_code: "OPT-APP", description: "Appliance package", unit_price_cents: 125050, quantity: 2 }
              as: SalesConsultant
            - call: "POST /api/sales-orders/${d3_ord}/options"
              payload: { option_code: "OPT-EXT", description: "Exterior package", unit_price_cents: 89999, quantity: 1 }
              as: SalesConsultant
            - call: "POST /api/sales-orders/${d3_ord}/confirm"
              payload: { deposit_cents: 473600 }
              as: SalesConsultant
              captures: { d3_ord_v: $.data.version }
            - call: "POST /api/sales-orders/${d3_ord}/site-evaluations"
