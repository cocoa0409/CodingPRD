        grounds:
          - "concurrency_rules[form-assemble-stale-form]"
        distinguishing_aspect: "Stale expected_form_version on assemble returns 412"
        test_recipe:
          setup: ["Form F with current version=2"]
          setup_api_calls:
            - call: "POST /api/assessment-programs"
              payload: { program_code: "P-OCC", subject: "MATH", grade_level: 3, admin_year: 2026 }
              as: ProgramDirector
              captures: { prog: $.data.id }
            - call: "POST /api/test-blueprints"
              payload: { program_id: "${prog}", blueprint_code: "BP-OCC", sections: [{ strand: "S", item_count: 1, dok_min: 1, dok_max: 4 }] }
              as: TestAssembler
              captures: { bp: $.data.id }
            - call: "POST /api/test-blueprints/${bp}/lock"
              payload: {}
              as: ProgramDirector
            - call: "POST /api/test-forms"
              payload: { blueprint_id: "${bp}", form_code: "F-OCC", intended_admin_date: "2026-09-01T00:00:00Z" }
              as: TestAssembler
              captures: { f: $.data.id, f_v0: $.data.version }
          trigger:
            - call: "POST /api/test-forms/${f}/assemble"
              payload: { expected_form_version: "${f_v0} - 1" }
              as: TestAssembler
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_STALE_VERSION (HTTP 412)"

      - name: version_increments_on_every_mutation
        claim_type: optimistic_concurrency
        grounds:
          - entities.Item.fields.version
        distinguishing_aspect: "Each successful PUT / submit / etc. increments version by exactly 1"
        test_recipe:
          setup: ["Item just created (version=1)"]
          setup_api_calls:
            - call: "POST /api/assessment-programs"
              payload: { program_code: "P-VI", subject: "MATH", grade_level: 3, admin_year: 2026 }
              as: ProgramDirector
              captures: { prog: $.data.id }
            - call: "POST /api/content-standards"
              payload: { program_id: "${prog}", standard_code: "CS", strand: "S", description: "D", depth_of_knowledge: 1 }
              as: ProgramDirector
              captures: { cs: $.data.id }
            - call: "POST /api/items"
              payload: { program_id: "${prog}", item_code: "I-VI", primary_standard_id: "${cs}", item_type: "MC", stimulus_html: "<p>x</p>", options_json: {}, max_score_points: 1 }
              as: ItemWriter
              captures: { item: $.data.id, v1: $.data.version }
          trigger:
            - call: "PUT /api/items/${item}"
              payload: { stimulus_html: "<p>updated</p>" }
              as: ItemWriter
              captures: { v2: $.data.version }
          assert:
            - "v1 == 1"
            - "v2 == 2 (incremented by exactly 1)"

      - name: pagination_limit_offset_consistent
        claim_type: pagination_with_filtering
        grounds:
          - response_envelope
        distinguishing_aspect: "List endpoints respect limit/offset; total_count reflects filtered count; has_more indicates more pages"
        test_recipe:
          setup: ["3 programs exist"]
          setup_api_calls:
            - call: "POST /api/assessment-programs"
              payload: { program_code: "P-P1", subject: "MATH", grade_level: 3, admin_year: 2026 }
              as: ProgramDirector
            - call: "POST /api/assessment-programs"
              payload: { program_code: "P-P2", subject: "ELA", grade_level: 4, admin_year: 2026 }
              as: ProgramDirector
            - call: "POST /api/assessment-programs"
              payload: { program_code: "P-P3", subject: "SCIENCE", grade_level: 5, admin_year: 2026 }
              as: ProgramDirector
          trigger:
            - call: "GET /api/assessment-programs"
              payload: { limit: 2, offset: 0 }
              as: ProgramDirector
          assert:
            - "data array length == 2"
            - "total_count == 3"
            - "has_more == true"

  # =====================================================================
  # Section: consistency_model — immediate consistency
  # =====================================================================
  - section: consistency_model
    instances:
      - name: read_after_write_returns_updated_data
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
        distinguishing_aspect: "After POST/PUT, a subsequent GET returns the updated data within the same request cycle (no eventual consistency lag)"
        test_recipe:
          setup: ["Program exists"]
          setup_api_calls:
            - call: "POST /api/assessment-programs"
              payload: { program_code: "P-IMM", subject: "MATH", grade_level: 3, admin_year: 2026 }
              as: ProgramDirector
              captures: { prog: $.data.id }
          trigger:
            - call: "POST /api/assessment-programs/${prog}/clock/advance"
              payload: { by_seconds: 7200 }
              as: ProgramDirector
            - call: "GET /api/assessment-programs/${prog}"
              payload: {}
              as: ProgramDirector
              captures: { clock_now: $.data.current_period_utc }
          assert:
            - "clock_now == '2026-08-01T02:00:00Z' — read reflects write immediately"
