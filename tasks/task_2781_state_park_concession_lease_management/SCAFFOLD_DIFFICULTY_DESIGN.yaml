  - rule_id: non_linear_state_machine
    instances:

      - name: proposal_revision_cycle_reenters_submitted_then_blocks_third_round
        grounds:
          - state_machines.Proposal.UNDER_REVIEW_to_REVISION_REQUESTED
          - state_machines.Proposal.REVISION_REQUESTED_to_SUBMITTED
          - state_machines.Proposal.SUBMITTED_to_UNDER_REVIEW
          - entities.Proposal.fields.revision_round
          - validations[priority=40]
        distinguishing_aspect: |
          Proposal is cyclic, not a DAG: SUBMITTED -> UNDER_REVIEW -> REVISION_REQUESTED ->
          SUBMITTED re-enters a state it already occupied, and the loop is bounded by a
          counter rather than by the state graph, so the third request-revision is refused
          with ERR_REVISION_LIMIT_REACHED while the proposal remains UNDER_REVIEW at
          revision_round 2.
        test_recipe:
          setup:
            - "A park, an eligible offeror, an approved opportunity and an ISSUED prospectus with submission_deadline 2027-02-01T00:00:00Z; the clock is at 2027-01-05 so the submission window is open."
            - "One proposal has already been round-tripped twice: begin-review, request-revision, resubmit at 5.25%, begin-review, request-revision, resubmit at 5.50%, begin-review."
            - "The proposal is therefore UNDER_REVIEW with revision_round 2 and evaluation_count 0."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2027-01-05T00:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /parks"
