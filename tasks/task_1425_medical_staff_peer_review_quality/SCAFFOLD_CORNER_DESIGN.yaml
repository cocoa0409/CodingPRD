      - name: declared_conflict_blocks_assignment
        claim_type: violation_to_error
        grounds: ["validations[priority=7]", "errors[ERR_REVIEWER_CONFLICT_DECLARED]"]
        distinguishing_aspect: "A reviewer with a SELF_DECLARED conflict against the subject cannot be assigned while the declaration stands; after rescission the identical request succeeds."
        test_recipe:
          setup: ["provider; member B with a self-declared PRIOR_TREATING conflict against the subject; case screened in"]
          setup_api_calls:
            - { call: "POST /peer-review/providers", payload: { full_name: "Subj Conf", specialty: "SURGERY" }, as: QualityDirector, captures: { p_sub: $.data.id } }
            - { call: "POST /peer-review/providers", payload: { full_name: "Rev B", specialty: "SURGERY" }, as: QualityDirector, captures: { p_b: $.data.id } }
