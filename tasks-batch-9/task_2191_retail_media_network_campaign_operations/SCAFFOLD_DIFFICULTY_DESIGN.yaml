              captures: { study_user_id: $.data.id }
            - call: "POST /rmn/incrementality-studies/${study_geo_id}/start"
              payload: { exposed_group_size: 50000, control_group_size: 20000 }
              as: MeasurementAnalyst
              as_user_id: "ma-5"
            - call: "POST /rmn/incrementality-studies/${study_user_id}/start"
              payload: { exposed_group_size: 50000, control_group_size: 20000 }
              as: MeasurementAnalyst
              as_user_id: "ma-5"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-11T00:00:00Z" }
              as: NetworkAdmin
              as_user_id: "adm-1"
          trigger:
            - call: "POST /rmn/incrementality-studies/${study_geo_id}/measure"
              payload: { exposed_conversions: 2500, control_conversions: 600, exposed_sales_cents: 40000000, control_sales_cents: 11000000 }
              as: MeasurementAnalyst
              as_user_id: "ma-5"
            - call: "POST /rmn/incrementality-studies/${study_user_id}/measure"
              payload: { exposed_conversions: 2500, control_conversions: 600, exposed_sales_cents: 40000000, control_sales_cents: 11000000 }
              as: MeasurementAnalyst
              as_user_id: "ma-5"
          assert:
            - "IncrementalityStudy.${study_geo_id}.study_status == MEASURING"
            - "IncrementalityStudy.${study_geo_id}.lift_pct == 0.6667"
            - "IncrementalityStudy.${study_geo_id}.incremental_sales_cents == 16000480"
            - "IncrementalityStudy.${study_user_id}.study_status == MEASURING"
            - "IncrementalityStudy.${study_user_id}.lift_pct == 0.4545"
            - "IncrementalityStudy.${study_user_id}.incremental_sales_cents == 12500000"
            - "IncrementalityStudy.${study_geo_id}.incremental_sales_cents != IncrementalityStudy.${study_user_id}.incremental_sales_cents"
            - "IncrementalityStudy.${study_geo_id}.significance_score == 2.8284"
            - "IncrementalityStudy.${study_user_id}.significance_score == 2.8284"
            - "IncrementalityStudy.${study_geo_id}.significance_flag == true"
            - "IncrementalityStudy.${study_geo_id}.incremental_sales_cents != 16000000 (the GEO figure computed from an UNROUNDED lift_pct instead of the pinned 4-decimal lift_pct of 0.6667)"
            - "Campaign.${camp_geo_id}.incremental_revenue_cents == 0 (a MEASURING study never feeds the campaign; only PUBLISHED does)"

      - name: dvc_offsite_logged_vs_reported_billing_basis
        grounds:
