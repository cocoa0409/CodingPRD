            - "CancellationCredit.${credit_id}.credit_reason == DEMONSTRATOR_NO_SHOW"
            - "CancellationCredit.${credit_id}.credit_amount_cents == 33810"
            - "CancellationCredit.${credit_id}.credit_status == PENDING_APPROVAL"

      - name: invoice_void_redraft_reissue_cycle_recomputes_from_current_rates
        grounds:
          - state_machines.EventInvoice.transitions.DRAFT_to_ISSUED
          - state_machines.EventInvoice.transitions.ISSUED_to_VOID
          - state_machines.EventInvoice.transitions.VOID_to_DRAFT
          - calculations.event_invoice_total
          - entities.EventInvoice.fields.issued_by_user_id
          - entities.DemoEvent.fields.settlement_status
        distinguishing_aspect: |
          EventInvoice re-enters DRAFT after VOID, so the same row is ISSUED
          twice with two different totals. The first ISSUE bills a 2400-cent
          LEAD rate for subtotal 78960, GOLD discount 2369, total 76591; after
          VOID the demonstrator's hourly_rate_cents is patched to 3000 and
          REDRAFT re-runs the whole calculation, moving the LEAD line from
          12960 to 16200 for subtotal 82200, discount 2466, total 79734. The
          loop is therefore not idempotent on money, and settlement_status
          walks INVOICED -> UNBILLED -> INVOICED with
          Manufacturer.outstanding_balance_cents following exactly.
        test_recipe:
          setup:
            - "Manufacturer M program_tier GOLD (TIER_BASE_DISCOUNT 0.03) with credit_limit_cents 5000000, well above either total, so no HOLD ever fires and only the money arithmetic is under test."
