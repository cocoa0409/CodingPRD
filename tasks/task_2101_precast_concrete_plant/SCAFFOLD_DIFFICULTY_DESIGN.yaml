      - name: overhead_tier_keyed_on_direct_subtotal_not_total
        grounds:
          - calculations.bed_run_cost_allocation
          - entities.BedRun.fields.direct_subtotal_cents
          - entities.BedRun.fields.overhead_rate_pct
          - entities.BedRun.fields.total_cost_cents
          - entities.Piece.fields.allocated_cost_cents
          - entities.Project.fields.committed_cost_cents
          - state_machines.BedRun.RELEASED_to_STRIPPED
        distinguishing_aspect: |
          Mode (c): the overhead tier looks circular because total_cost_cents = direct_subtotal +
          overhead while overhead depends on a tier. The scaffold pins the tier to
          direct_subtotal_cents. With a subtotal of 848636 cents the rate is 18.0 percent, giving
          overhead 152754 and a total of 1001390 - a total that sits ABOVE the 1000000 cent tier
