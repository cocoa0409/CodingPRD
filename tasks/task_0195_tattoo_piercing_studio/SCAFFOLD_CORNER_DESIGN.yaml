scaffold_corner_design:

  # =========================================================================
  # Entities
  # =========================================================================
  - section: entities
    instances:
      - name: create_artist_returns_201_with_defaults
        claim_type: Creation
        grounds: [entities.Artist, endpoints]
        distinguishing_aspect: "POST /studio/artists with required fields returns 201; commission_pct defaults to 0.70, accepting_custom to true, reliability_score to 100, counters to 0."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /studio/artists"
              payload: { display_name: "Solo Artist", discipline: "BOTH", hourly_rate_cents: 15000 }
              as: StudioManager
              captures: { aid: $.data.id, cp: $.data.commission_pct, ac: $.data.accepting_custom, rs: $.data.reliability_score }
          assert:
            - "response HTTP status == 201"
            - "Artist.${aid}.commission_pct == 0.70"
            - "Artist.${aid}.accepting_custom == true"
            - "Artist.${aid}.reliability_score == 100"
            - "Artist.${aid}.completed_session_count == 0"

      - name: get_artist_not_found_returns_404
        claim_type: Not Found
        grounds: [entities.Artist, "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET /studio/artists/{id} for a random non-existent UUID returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /studio/artists/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: StudioManager
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_NOT_FOUND"
            - "response HTTP status == 404"

      - name: create_client_missing_required_field_rejected
        claim_type: Required Fields
        grounds: [entities.Client, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /studio/clients omitting date_of_birth (source:input, no default) returns ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /studio/clients"
              payload: { full_name: "No DOB", email: "nodob@x.com" }
              as: Anonymous
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_REQUEST"
            - "response HTTP status == 400"

      - name: client_id_status_system_default_unverified
        claim_type: Computed Fields
        grounds: [entities.Client.fields.id_status]
        distinguishing_aspect: "A freshly created Client has id_status == UNVERIFIED and verified_age_years == null regardless of input; client cannot set these."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /studio/clients"
              payload: { full_name: "Fresh", email: "fresh@x.com", date_of_birth: "1990-01-01" }
              as: Anonymous
              captures: { cid: $.data.id, st: $.data.id_status }
          assert:
            - "Client.${cid}.id_status == UNVERIFIED"
            - "Client.${cid}.verified_age_years == null"

      - name: create_artist_invalid_discipline_enum_rejected
        claim_type: Type Constraints
        grounds: [entities.Artist.fields.discipline, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /studio/artists with discipline not in {TATTOO,PIERCING,BOTH} returns ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /studio/artists"
              payload: { display_name: "Bad Disc", discipline: "AIRBRUSH", hourly_rate_cents: 15000 }
              as: StudioManager
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_REQUEST"
            - "response HTTP status == 400"

      - name: consent_waiver_immutable_no_version_field
        claim_type: Immutability
        grounds: [entities.ConsentWaiver]
        distinguishing_aspect: "ConsentWaiver has common_fields:false — it exposes id and created_at, has no version field, and no update endpoint exists."
        test_recipe:
          setup: ["One COMPLETED-path setup is unnecessary; just create an appointment HELD and record a waiver."]
          setup_api_calls:
            - call: "POST /studio/artists"
              payload: { display_name: "WV Artist", discipline: "TATTOO", hourly_rate_cents: 18000 }
              as: StudioManager
              captures: { aid: $.data.id }
            - call: "POST /studio/chairs"
              payload: { label: "WV Chair" }
              as: StudioManager
              captures: { chid: $.data.id, chv: $.data.version }
            - call: "POST /studio/clients"
              payload: { full_name: "WV Client", email: "wv@x.com", date_of_birth: "1990-01-01" }
              as: Anonymous
              captures: { cid: $.data.id }
            - call: "POST /studio/appointments"
              payload: { artist_id: "${aid}", client_id: "${cid}", chair_id: "${chid}", expected_chair_version: "${chv}", pricing_mode: "HOURLY", hourly_rate_cents: 18000, estimated_minutes: 60, start_at: "2026-07-01T10:00:00Z", end_at: "2026-07-01T11:00:00Z" }
              as: Client
              as_user_id: "${cid}"
              captures: { apid: $.data.id }
          trigger:
            - call: "POST /studio/appointments/${apid}/waiver"
              payload: { client_id: "${cid}", medical_flags: ["DIABETES"], aftercare_acknowledged: true }
              as: Client
              as_user_id: "${cid}"
              captures: { wid: $.data.id, sa: $.data.signed_at }
          assert:
            - "response HTTP status == 201"
            - "ConsentWaiver.${wid}.signed_at equals ConsentWaiver.${wid}.created_at"

      - name: flash_design_requires_existing_artist_fk
        claim_type: Parent Relationships
        grounds: [entities.FlashDesign.fields.artist_id, "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "POST /studio/flash-designs with a non-existent artist_id FK returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB; acting as an artist whose id is supplied as a non-existent FK body value."]
          setup_api_calls: []
          trigger:
            - call: "POST /studio/flash-designs"
              payload: { artist_id: "00000000-0000-4000-8000-000000000001", title: "Ghost", piece_price_cents: 30000, estimated_minutes: 60 }
              as: Artist
              as_user_id: "00000000-0000-4000-8000-000000000001"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_NOT_FOUND"
            - "response HTTP status == 404"

  # =========================================================================
  # State Machines
  # =========================================================================
  - section: state_machines
    instances:
      - name: complete_from_held_invalid_state
        claim_type: Invalid Transition
        grounds: [state_machines.Appointment.CONFIRMED_to_COMPLETED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Completing a HELD (not CONFIRMED) appointment returns ERR_INVALID_STATE (409); no gross/balance computed."
        test_recipe:
          setup: ["One HELD appointment (deposit not yet met)."]
          setup_api_calls:
            - call: "POST /studio/artists"
              payload: { display_name: "IS Artist", discipline: "TATTOO", hourly_rate_cents: 18000 }
              as: StudioManager
              captures: { aid: $.data.id }
            - call: "POST /studio/chairs"
              payload: { label: "IS Chair" }
              as: StudioManager
              captures: { chid: $.data.id, chv: $.data.version }
            - call: "POST /studio/clients"
              payload: { full_name: "IS Client", email: "is@x.com", date_of_birth: "1990-01-01" }
              as: Anonymous
              captures: { cid: $.data.id }
            - call: "POST /studio/appointments"
              payload: { artist_id: "${aid}", client_id: "${cid}", chair_id: "${chid}", expected_chair_version: "${chv}", pricing_mode: "HOURLY", hourly_rate_cents: 18000, estimated_minutes: 60, start_at: "2026-07-01T10:00:00Z", end_at: "2026-07-01T11:00:00Z" }
              as: Client
              as_user_id: "${cid}"
              captures: { apid: $.data.id }
          trigger:
            - call: "POST /studio/appointments/${apid}/complete"
              payload: { actual_minutes: 60 }
              as: Artist
              as_user_id: "${aid}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_STATE"
            - "Appointment.${apid}.status == HELD"

      - name: cancel_already_cancelled_invalid_state
        claim_type: Idempotency
        grounds: [state_machines.Appointment.HELD_to_CANCELLED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Cancelling a terminal CANCELLED appointment a second time returns ERR_INVALID_STATE (409); no further side effects fire."
        test_recipe:
          setup: ["One CANCELLED appointment (cancelled while HELD)."]
          setup_api_calls:
            - call: "POST /studio/artists"
              payload: { display_name: "Idem Artist", discipline: "TATTOO", hourly_rate_cents: 18000 }
              as: StudioManager
              captures: { aid: $.data.id }
            - call: "POST /studio/chairs"
              payload: { label: "Idem Chair" }
              as: StudioManager
              captures: { chid: $.data.id, chv: $.data.version }
            - call: "POST /studio/clients"
              payload: { full_name: "Idem Client", email: "idem@x.com", date_of_birth: "1990-01-01" }
              as: Anonymous
              captures: { cid: $.data.id }
            - call: "POST /studio/appointments"
              payload: { artist_id: "${aid}", client_id: "${cid}", chair_id: "${chid}", expected_chair_version: "${chv}", pricing_mode: "HOURLY", hourly_rate_cents: 18000, estimated_minutes: 60, start_at: "2026-07-01T10:00:00Z", end_at: "2026-07-01T11:00:00Z" }
              as: Client
              as_user_id: "${cid}"
              captures: { apid: $.data.id }
            - call: "POST /studio/appointments/${apid}/cancel"
              payload: {}
              as: Client
              as_user_id: "${cid}"
          trigger:
            - call: "POST /studio/appointments/${apid}/cancel"
              payload: {}
              as: Client
              as_user_id: "${cid}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_STATE"
            - "Appointment.${apid}.status == CANCELLED"

      - name: no_show_before_start_time_invalid_state
        claim_type: Precondition Enforcement
        grounds: [state_machines.Appointment.CONFIRMED_to_NO_SHOW, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Marking NO_SHOW before current clock reaches start_at violates the 'clock >= start_at' precondition and returns ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["Clock 2026-06-01T12:00; one CONFIRMED appointment starting 2026-07-01T10:00 (future)."]
          setup_api_calls:
            - call: "POST /studio/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T12:00:00Z" }
              as: StudioManager
            - call: "POST /studio/artists"
              payload: { display_name: "NS Artist", discipline: "TATTOO", hourly_rate_cents: 18000 }
              as: StudioManager
              captures: { aid: $.data.id }
            - call: "POST /studio/chairs"
              payload: { label: "NS Chair" }
              as: StudioManager
              captures: { chid: $.data.id, chv: $.data.version }
            - call: "POST /studio/clients"
              payload: { full_name: "NS Client", email: "ns@x.com", date_of_birth: "1990-01-01" }
              as: Anonymous
              captures: { cid: $.data.id }
            - call: "POST /studio/clients/${cid}/id-verification"
              payload: { id_document_type: "PASSPORT" }
              as: Client
              as_user_id: "${cid}"
            - call: "POST /studio/clients/${cid}/id-verification/approve"
              payload: {}
              as: StudioManager
            - call: "POST /studio/appointments"
              payload: { artist_id: "${aid}", client_id: "${cid}", chair_id: "${chid}", expected_chair_version: "${chv}", pricing_mode: "HOURLY", hourly_rate_cents: 18000, estimated_minutes: 180, start_at: "2026-07-01T10:00:00Z", end_at: "2026-07-01T13:00:00Z" }
              as: Client
              as_user_id: "${cid}"
              captures: { apid: $.data.id, apv: $.data.version }
            - call: "POST /studio/appointments/${apid}/deposits"
              payload: { amount_cents: 10800, expected_appointment_version: "${apv}" }
              as: Client
              as_user_id: "${cid}"
            - call: "POST /studio/appointments/${apid}/waiver"
              payload: { client_id: "${cid}", medical_flags: [], aftercare_acknowledged: true }
              as: Client
              as_user_id: "${cid}"
            - call: "POST /studio/appointments/${apid}/confirm"
              payload: {}
              as: Client
              as_user_id: "${cid}"
          trigger:
            - call: "POST /studio/appointments/${apid}/no-show"
              payload: {}
              as: Artist
              as_user_id: "${aid}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_STATE"
            - "Appointment.${apid}.status == CONFIRMED"

      - name: verification_reject_branch_sets_rejected
        claim_type: Valid Transition
        grounds: [state_machines.Client.PENDING_REVIEW_to_REJECTED, entities.Client.fields.id_status]
        distinguishing_aspect: "Manager reject moves PENDING_REVIEW -> REJECTED and leaves verified_age_years null (the divergent branch vs approve)."
        test_recipe:
          setup: ["One client in PENDING_REVIEW."]
          setup_api_calls:
            - call: "POST /studio/clients"
              payload: { full_name: "Rej Client", email: "rej@x.com", date_of_birth: "1990-01-01" }
              as: Anonymous
              captures: { cid: $.data.id }
            - call: "POST /studio/clients/${cid}/id-verification"
              payload: { id_document_type: "PASSPORT" }
              as: Client
              as_user_id: "${cid}"
          trigger:
            - call: "POST /studio/clients/${cid}/id-verification/reject"
              payload: { reason: "blurry scan" }
              as: StudioManager
              captures: { st: $.data.id_status }
          assert:
            - "Client.${cid}.id_status == REJECTED"
            - "Client.${cid}.verified_age_years == null"

      - name: touchup_schedule_from_denied_invalid_state
        claim_type: Terminal State Lockdown
        grounds: [state_machines.TouchUp.REQUESTED_to_SCHEDULED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Scheduling a DENIED (terminal) touch-up returns ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["One COMPLETED appointment with a DENIED touch-up."]
          setup_api_calls:
            - call: "POST /studio/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T12:00:00Z" }
              as: StudioManager
            - call: "POST /studio/artists"
              payload: { display_name: "TUL Artist", discipline: "TATTOO", hourly_rate_cents: 18000 }
              as: StudioManager
              captures: { aid: $.data.id }
            - call: "POST /studio/chairs"
              payload: { label: "TUL Chair" }
              as: StudioManager
              captures: { chid: $.data.id, chv: $.data.version }
            - call: "POST /studio/clients"
              payload: { full_name: "TUL Client", email: "tul@x.com", date_of_birth: "1990-01-01" }
              as: Anonymous
              captures: { cid: $.data.id }
            - call: "POST /studio/clients/${cid}/id-verification"
              payload: { id_document_type: "PASSPORT" }
              as: Client
              as_user_id: "${cid}"
            - call: "POST /studio/clients/${cid}/id-verification/approve"
              payload: {}
              as: StudioManager
            - call: "POST /studio/appointments"
              payload: { artist_id: "${aid}", client_id: "${cid}", chair_id: "${chid}", expected_chair_version: "${chv}", pricing_mode: "HOURLY", hourly_rate_cents: 18000, estimated_minutes: 180, start_at: "2026-06-10T10:00:00Z", end_at: "2026-06-10T13:00:00Z" }
              as: Client
              as_user_id: "${cid}"
              captures: { apid: $.data.id, apv: $.data.version }
            - call: "POST /studio/appointments/${apid}/deposits"
              payload: { amount_cents: 10800, expected_appointment_version: "${apv}" }
              as: Client
              as_user_id: "${cid}"
            - call: "POST /studio/appointments/${apid}/waiver"
              payload: { client_id: "${cid}", medical_flags: [], aftercare_acknowledged: true }
              as: Client
              as_user_id: "${cid}"
            - call: "POST /studio/appointments/${apid}/confirm"
              payload: {}
              as: Client
              as_user_id: "${cid}"
            - call: "POST /studio/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-10T14:00:00Z" }
              as: StudioManager
            - call: "POST /studio/appointments/${apid}/complete"
              payload: { actual_minutes: 200 }
              as: Artist
              as_user_id: "${aid}"
            - call: "POST /studio/appointments/${apid}/touchups"
              payload: {}
              as: Client
              as_user_id: "${cid}"
              captures: { tuid: $.data.id }
            - call: "POST /studio/touchups/${tuid}/deny"
              payload: {}
              as: StudioManager
          trigger:
            - call: "POST /studio/touchups/${tuid}/schedule"
              payload: {}
              as: StudioManager
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_STATE"
            - "TouchUp.${tuid}.status == DENIED"

      - name: flash_retire_while_reserved_invalid_state
        claim_type: Precondition Enforcement
        grounds: [endpoints, state_machines.Appointment.HELD_to_CONFIRMED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Retiring a flash design that is RESERVED (because a CONFIRMED appointment holds it) returns ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["One CONFIRMED PIECE appointment on a flash -> flash RESERVED."]
          setup_api_calls:
            - call: "POST /studio/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T12:00:00Z" }
              as: StudioManager
            - call: "POST /studio/artists"
              payload: { display_name: "FR Artist", discipline: "TATTOO", hourly_rate_cents: 18000 }
              as: StudioManager
              captures: { aid: $.data.id }
            - call: "POST /studio/flash-designs"
              payload: { artist_id: "${aid}", title: "Wave", piece_price_cents: 55000, estimated_minutes: 120 }
              as: Artist
              as_user_id: "${aid}"
              captures: { fid: $.data.id }
            - call: "POST /studio/chairs"
              payload: { label: "FR Chair" }
              as: StudioManager
              captures: { chid: $.data.id, chv: $.data.version }
            - call: "POST /studio/clients"
              payload: { full_name: "FR Client", email: "fr@x.com", date_of_birth: "1990-01-01" }
              as: Anonymous
              captures: { cid: $.data.id }
            - call: "POST /studio/clients/${cid}/id-verification"
              payload: { id_document_type: "PASSPORT" }
              as: Client
              as_user_id: "${cid}"
            - call: "POST /studio/clients/${cid}/id-verification/approve"
              payload: {}
              as: StudioManager
            - call: "POST /studio/appointments"
              payload: { artist_id: "${aid}", client_id: "${cid}", chair_id: "${chid}", expected_chair_version: "${chv}", pricing_mode: "PIECE", flash_design_id: "${fid}", piece_price_cents: 55000, estimated_minutes: 120, start_at: "2026-06-15T10:00:00Z", end_at: "2026-06-15T12:00:00Z" }
              as: Client
              as_user_id: "${cid}"
              captures: { apid: $.data.id, apv: $.data.version }
            - call: "POST /studio/appointments/${apid}/deposits"
              payload: { amount_cents: 11000, expected_appointment_version: "${apv}" }
              as: Client
              as_user_id: "${cid}"
            - call: "POST /studio/appointments/${apid}/waiver"
              payload: { client_id: "${cid}", medical_flags: [], aftercare_acknowledged: true }
              as: Client
              as_user_id: "${cid}"
            - call: "POST /studio/appointments/${apid}/confirm"
              payload: {}
              as: Client
              as_user_id: "${cid}"
          trigger:
            - call: "POST /studio/flash-designs/${fid}/retire"
              payload: {}
              as: Artist
              as_user_id: "${aid}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_STATE"
            - "FlashDesign.${fid}.status == RESERVED"

      - name: portfolio_publish_from_completed_parent_succeeds
        claim_type: Valid Transition
        grounds: [state_machines.PortfolioItem.DRAFT_to_PUBLISHED, entities.PortfolioItem.fields.visibility]
        distinguishing_aspect: "An artist publishing a DRAFT portfolio item whose linked Appointment is COMPLETED moves it to PUBLISHED."
        test_recipe:
          setup: ["One COMPLETED HOURLY appointment for an artist; one DRAFT portfolio item on it."]
          setup_api_calls:
            - call: "POST /studio/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T12:00:00Z" }
              as: StudioManager
            - call: "POST /studio/artists"
              payload: { display_name: "PF Artist", discipline: "TATTOO", hourly_rate_cents: 18000 }
              as: StudioManager
              captures: { aid: $.data.id }
            - call: "POST /studio/chairs"
              payload: { label: "PF Chair" }
              as: StudioManager
              captures: { chid: $.data.id, chv: $.data.version }
            - call: "POST /studio/clients"
              payload: { full_name: "PF Client", email: "pf@x.com", date_of_birth: "1990-01-01" }
              as: Anonymous
              captures: { cid: $.data.id }
            - call: "POST /studio/clients/${cid}/id-verification"
              payload: { id_document_type: "PASSPORT" }
              as: Client
              as_user_id: "${cid}"
            - call: "POST /studio/clients/${cid}/id-verification/approve"
              payload: {}
              as: StudioManager
            - call: "POST /studio/appointments"
              payload: { artist_id: "${aid}", client_id: "${cid}", chair_id: "${chid}", expected_chair_version: "${chv}", pricing_mode: "HOURLY", hourly_rate_cents: 18000, estimated_minutes: 180, start_at: "2026-06-10T10:00:00Z", end_at: "2026-06-10T13:00:00Z" }
              as: Client
              as_user_id: "${cid}"
              captures: { apid: $.data.id, apv: $.data.version }
            - call: "POST /studio/appointments/${apid}/deposits"
              payload: { amount_cents: 10800, expected_appointment_version: "${apv}" }
              as: Client
              as_user_id: "${cid}"
            - call: "POST /studio/appointments/${apid}/waiver"
              payload: { client_id: "${cid}", medical_flags: [], aftercare_acknowledged: true }
              as: Client
              as_user_id: "${cid}"
            - call: "POST /studio/appointments/${apid}/confirm"
              payload: {}
              as: Client
              as_user_id: "${cid}"
            - call: "POST /studio/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-10T14:00:00Z" }
              as: StudioManager
            - call: "POST /studio/appointments/${apid}/complete"
              payload: { actual_minutes: 200 }
              as: Artist
              as_user_id: "${aid}"
            - call: "POST /studio/portfolio-items"
              payload: { artist_id: "${aid}", appointment_id: "${apid}", caption: "Healed sleeve" }
              as: Artist
              as_user_id: "${aid}"
              captures: { pid: $.data.id }
          trigger:
            - call: "POST /studio/portfolio-items/${pid}/publish"
              payload: {}
              as: Artist
              as_user_id: "${aid}"
              captures: { vis: $.data.visibility }
          assert:
            - "PortfolioItem.${pid}.visibility == PUBLISHED"

      - name: portfolio_publish_parent_not_completed_invalid_state
        claim_type: Precondition Enforcement
        grounds: [state_machines.PortfolioItem.DRAFT_to_PUBLISHED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Publishing a DRAFT portfolio item whose linked Appointment is only CONFIRMED (not COMPLETED) violates the cross-entity precondition and returns ERR_INVALID_STATE (409)."
        test_recipe:
