            - "Deal.${deal_id}.stage == CLEAR_TO_CLOSE"
            - "Deal.${deal_id}.easement_status == DRAFTED"
      - name: parallel_deal_stage_and_capital_state_are_independent_dimensions
        claim_type: parallel
        grounds:
          - complexity_profile.state_machine_shape
          - state_machines.Deal.stage
          - state_machines.Deal.capital_state
        excluded_because:
          difficulty_instance: non_linear_state_machine / deal_stage_and_capital_state_dimensions_advance_independently
          rationale: "The named §1.8 instance already drives each dimension separately and captures the mid-chain cross-product state."
      - name: cyclic_offer_counter_revise_loop_terminates_on_the_round_cap
        claim_type: cyclic
        grounds:
          - state_machines.Offer.transitions.SENT_to_COUNTERED
          - state_machines.Offer.transitions.COUNTERED_to_SENT
        excluded_because:
          difficulty_instance: non_linear_state_machine / offer_counter_revise_cycle_bounded_by_negotiation_round_cap
          rationale: "The named §1.8 instance walks the full SENT/COUNTERED cycle to its termination condition."
      - name: precondition_enforcement_close_requires_a_distinct_closing_user
        claim_type: precondition_enforcement
        grounds:
          - state_machines.Deal.stage.transitions.CLEAR_TO_CLOSE_to_CLOSED
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / segregation_of_duties_precedes_open_dispute_close_block
          rationale: "The named §1.8 instance violates exactly this close precondition and asserts the resulting 403."
  - section: calculations
    instances:
      - name: correct_result_crossover_anchor_plus_speculative_colocation_values_at_the_below_forty_tier
        claim_type: correct_result
        grounds:
          - calculations.tenancy_quality_score
          - calculations.stream_valuation_value
          - calculations.valuation_max_bid_ceiling
          - entities.StreamValuation.fields.value_cents
        distinguishing_aspect: |
          A mix that lands strictly below every named tier boundary exercises the ladder's else branch:
          CROSSOVER ANCHOR contributes 25.00 and SPECULATIVE COLOCATION contributes 10 x 0.60 = 6.00, so the
          score is 31, the discount rate is the below-40 tier of 1250 bps and the 40-year LUMP_SUM_PERPETUAL
          NPV is 34987613 cents with a max bid of 36736994 — not the 44627011 of the score-40 reference
          stream.
        test_recipe:
          setup:
            - "A lease stream with current_annual_rent_cents 3600000, FIXED_PCT 300 bps and 180 remaining months."
            - "One ACTIVE CROSSOVER ANCHOR tenancy and one ACTIVE SPECULATIVE COLOCATION tenancy."
            - "The valuation uses method LUMP_SUM_PERPETUAL so the renewal haircut applies to years 16..40."
          setup_api_calls:
            - { call: "POST /lease-buyouts/tower-companies", payload: { legal_name: "Summit Towers LLC", notice_email: "rofr@summit.example", rofr_required: false, rofr_window_days: 30 }, as: PlatformAdmin, captures: { tc_id: $.data.id } }
