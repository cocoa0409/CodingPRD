          - calculations.run_labor_minutes
          - calculations.run_ingredient_cost
        distinguishing_aspect: "A single GET must expose the whole derived bundle for a 2-rack PAR-CROIS run started 04:00Z: bake_end 04:20, ready 04:35, expires 14:35, planned_units 80, planned_labor_minutes 27.00 and ingredient_cost_cents 600 — and the same numbers must appear in the parent BakeDay's rollups."
