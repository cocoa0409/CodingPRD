            - { call: "POST /enrollments/${enr}/certificate", as: Registrar, captures: { cert: $.data.id } }
            - { call: "POST /credit-reports", payload: { school_id: "${sch}", period_start: "2026-09-01", period_end: "2026-09-30" }, as: ComplianceOfficer, captures: { rep: $.data.id, tot: $.data.total_credit_hours } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-15T09:00:00Z" }, as: ComplianceOfficer }
            - { call: "POST /credit-reports/${rep}/submit", as: ComplianceOfficer, captures: { fee1: $.data.late_fee_cents, cnt1: $.data.submission_count } }
