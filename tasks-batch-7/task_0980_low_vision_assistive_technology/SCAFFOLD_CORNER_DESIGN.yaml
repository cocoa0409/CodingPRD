            - { call: "POST /api/ops/run_daily", payload: {}, as: ClinicAdmin }
            - { call: "GET /api/subscriptions/${sub_id}", as: BillingSpecialist, captures: { st2: $.data.status } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-06-15T00:00:00Z" }, as: ClinicAdmin }
            - { call: "POST /api/ops/run_daily", payload: {}, as: ClinicAdmin }
