  - rule_id: compensating_invariant
    instances:

      - name: partial_reissue_conserves_every_billed_cent
        grounds:
          - calculations.partial_reissue_credit_cents
          - entities.FillCycle.fields.total_copay_cents
          - entities.FillCycle.fields.reissue_fee_cents
          - entities.CreditMemo.fields.amount_cents
          - entities.Patient.fields.credit_balance_cents
          - endpoints.POST_/pharmacy/fill-cycles/{id}/reissue
        distinguishing_aspect: |
          Conserved quantity: MONEY — the cents the patient was originally billed for the
          cycle. After the mid-cycle reissue the original total must fall by exactly the
          gross credit, and that gross credit must reappear split into exactly two places:
          the CreditMemo the patient receives and the reissue fee the pharmacy keeps. The
          invariant is a three-way identity (retained + net credit + fee == original total)
          that only holds if the per-line rounding, the retained-basis fee tier and the
          recomputed cycle total are all consistent with one another.
        test_recipe:
          setup:
            - "logical clock at 2026-08-10T00:00:00Z"
            - "the four-prescription canonical patient: Rx1 Metformin ER GENERIC [MORNING, BEDTIME] last dispensed 2026-07-25 for 28 days, Rx2 Rivaroxaban PREFERRED_BRAND [MORNING] last dispensed 2026-07-20 for 30 days, Rx3 Sitagliptin SPECIALTY [EVENING] last dispensed 2026-07-18 for 30 days, Rx4 Insulin glargine SPECIALTY refrigerated [BEDTIME] last dispensed 2026-07-18 for 28 days"
            - "synchronized BRIDGE_TO_START on anchor day 15; cycle C1 [2026-08-15, 2026-09-12) adjudicated (all four lines ADJUDICATED, 28 days each) and rolled"
            - "a prescriber regimen change on Rx3 supersedes it, leaving C1 at ROLL_GENERATED with reissue_required true"
          setup_api_calls:
            - call: "POST /pharmacy/_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /pharmacy/insurance-plans"
              payload: { payer_name: "Northwind PBM", bin_number: "610502", generic_copay_cents_per_day: 34, brand_copay_cents_per_day: 74, specialty_copay_cents_per_day: 44, refill_too_soon_threshold_pct: 75, max_day_supply_days: 90, vacation_overrides_per_year: 1, coinsurance_pct: 20, allows_payer_vacation_override: true }
              as: PlatformAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /pharmacy/patients"
