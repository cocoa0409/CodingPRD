# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Task: task_3191_bottler_territory_franchise_concentrate_pricing
#
# Two instances per Difficulty Rule (§0.5), each grounded in SCAFFOLD.yaml
# §1.1–§1.7. All numeric asserts pre-computed from §1.3 formulas.
#
# Canonical seed block (repeated per instance as &anchors within the file):
#   clock -> 2026-09-01T00:00:00Z (explicit; equals startup default)
#   BrandOwner "ColaCo" (home_country US)
#   ConcentratePriceIndex 2026-Q2 = 110.00
#   ProductLine COLA-12OZ-CAN, base $12.0000/gal, is_mandatory true
#   Territory SO-ATL-07
#   BottlerAgreement bottler "Dixie Bottling", base_index 100.00,
#     basis CASE_VOLUME, service_budget 1000000 (unless noted), then activate
#     -> capture ag_id and ag_v1 (version after activate == 2)
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: concentrate_provisional_vs_final_diverge_on_same_order
        grounds:
          - calculations.concentrate_unit_price
          - state_machines.ConcentratePurchaseOrder.PROVISIONAL_to_FINALIZED
        distinguishing_aspect: "Same CPO priced twice: provisional (latest index at placement, 110.00) vs final (mean over all recorded quarters, (110+120)/2=115.00) yield different amounts on identical order data — the dual-variant lives on the ConcentratePurchaseOrder pricing domain."
        test_recipe:
          setup:
            - "Seeded brand with index 110.00 (2026-Q2), line base $12.0000, ACTIVE agreement (version 2)."
            - "CPO of 10000 gallons for delivery_quarter 2026-Q3 placed (provisional index 110 -> unit $13.2000)."
            - "Index 120.00 recorded for 2026-Q3; CPO received."
          setup_api_calls:
            - call: "POST /bottler/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /bottler/brand-owners"
              payload: { name: "ColaCo", home_country: "US" }
              as: PlatformAdmin
              captures: { bo_id: $.data.id }
            - call: "POST /bottler/concentrate-price-indices"
              payload: { brand_owner_id: "${bo_id}", quarter: "2026-Q2", index_value: 110.00 }
              as: BrandOwnerAdmin
            - call: "POST /bottler/product-lines"
              payload: { brand_owner_id: "${bo_id}", line_code: "COLA-12OZ-CAN", concentrate_base_price_per_gallon: 12.0, is_mandatory: true }
              as: BrandOwnerAdmin
              captures: { pl_id: $.data.id }
            - call: "POST /bottler/territories"
              payload: { brand_owner_id: "${bo_id}", code: "SO-ATL-07", region_label: "South Atlanta 07" }
              as: PlatformAdmin
              captures: { ter_id: $.data.id }
            - call: "POST /bottler/territories/${ter_id}/agreements"
              payload: { bottler_name: "Dixie Bottling", concentrate_base_index: 100.0, marketing_accrual_basis: "CASE_VOLUME", service_budget_cents: 1000000 }
              as: PlatformAdmin
              captures: { ag_id: $.data.id }
            - call: "POST /bottler/bottler-agreements/${ag_id}/activate"
              payload: {}
              as: PlatformAdmin
              captures: { ag_v1: $.data.version }
            - call: "POST /bottler/concentrate-purchase-orders"
              payload: { agreement_id: "${ag_id}", product_line_id: "${pl_id}", quantity_gallons: 10000, delivery_quarter: "2026-Q3", expected_agreement_version: "${ag_v1}" }
              as: BottlerOps
              as_user_id: "${ag_id}"
              captures: { cpo_id: $.data.id }
            - call: "POST /bottler/concentrate-price-indices"
              payload: { brand_owner_id: "${bo_id}", quarter: "2026-Q3", index_value: 120.00 }
              as: BrandOwnerAdmin
            - call: "POST /bottler/concentrate-purchase-orders/${cpo_id}/receive"
              payload: {}
              as: BottlerOps
              as_user_id: "${ag_id}"
          trigger:
            - call: "POST /bottler/concentrate-purchase-orders/${cpo_id}/finalize"
              payload: {}
              as: BottlerOps
              as_user_id: "${ag_id}"
          assert:
            - "ConcentratePurchaseOrder.${cpo_id}.provisional_unit_price == 13.2"
            - "ConcentratePurchaseOrder.${cpo_id}.provisional_amount_cents == 13200000"
            - "ConcentratePurchaseOrder.${cpo_id}.final_unit_price == 13.8"
            - "ConcentratePurchaseOrder.${cpo_id}.final_amount_cents == 13800000"
            - "ConcentratePurchaseOrder.${cpo_id}.price_delta_cents == 600000"
            - "ConcentratePurchaseOrder.${cpo_id}.pricing_status == FINALIZED"

      - name: marketing_accrual_case_volume_vs_net_revenue_diverge
        grounds:
          - calculations.marketing_fund_accrual
          - entities.BottlerAgreement.fields.marketing_accrual_basis
        distinguishing_aspect: "Marketing-fund accrual (BottlerAgreement ledger domain — a different entity domain than CPO pricing): identical period data (50000 cases, $100000.00 net revenue) accrues $20000.00 under CASE_VOLUME vs $2500.00 under NET_REVENUE."
        test_recipe:
          setup:
            - "Seeded brand/line/territory with TWO ACTIVE agreements in two territories: ag_cv with marketing_accrual_basis CASE_VOLUME, ag_nr with NET_REVENUE."
          setup_api_calls:
            - call: "POST /bottler/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /bottler/brand-owners"
              payload: { name: "ColaCo", home_country: "US" }
              as: PlatformAdmin
              captures: { bo_id: $.data.id }
            - call: "POST /bottler/concentrate-price-indices"
              payload: { brand_owner_id: "${bo_id}", quarter: "2026-Q2", index_value: 110.00 }
              as: BrandOwnerAdmin
            - call: "POST /bottler/product-lines"
              payload: { brand_owner_id: "${bo_id}", line_code: "COLA-12OZ-CAN", concentrate_base_price_per_gallon: 12.0, is_mandatory: true }
              as: BrandOwnerAdmin
            - call: "POST /bottler/territories"
              payload: { brand_owner_id: "${bo_id}", code: "SO-ATL-07", region_label: "South Atlanta 07" }
              as: PlatformAdmin
              captures: { ter1_id: $.data.id }
            - call: "POST /bottler/territories/${ter1_id}/agreements"
              payload: { bottler_name: "Dixie Bottling", concentrate_base_index: 100.0, marketing_accrual_basis: "CASE_VOLUME", service_budget_cents: 1000000 }
              as: PlatformAdmin
              captures: { ag_cv: $.data.id }
            - call: "POST /bottler/bottler-agreements/${ag_cv}/activate"
              payload: {}
              as: PlatformAdmin
            - call: "POST /bottler/territories"
              payload: { brand_owner_id: "${bo_id}", code: "NO-ATL-09", region_label: "North Atlanta 09" }
              as: PlatformAdmin
              captures: { ter2_id: $.data.id }
            - call: "POST /bottler/territories/${ter2_id}/agreements"
              payload: { bottler_name: "Peachtree Bottling", concentrate_base_index: 100.0, marketing_accrual_basis: "NET_REVENUE", service_budget_cents: 1000000 }
              as: PlatformAdmin
              captures: { ag_nr: $.data.id }
            - call: "POST /bottler/bottler-agreements/${ag_nr}/activate"
              payload: {}
              as: PlatformAdmin
          trigger:
            - call: "POST /bottler/marketing-fund-ledger"
              payload: { agreement_id: "${ag_cv}", entry_type: "ACCRUAL", period: "2026-09", cases_sold: 50000, net_revenue_cents: 10000000 }
              as: BottlerOps
              as_user_id: "${ag_cv}"
              captures: { entry_cv: $.data.amount_cents }
            - call: "POST /bottler/marketing-fund-ledger"
              payload: { agreement_id: "${ag_nr}", entry_type: "ACCRUAL", period: "2026-09", cases_sold: 50000, net_revenue_cents: 10000000 }
              as: BottlerOps
              as_user_id: "${ag_nr}"
              captures: { entry_nr: $.data.amount_cents }
          assert:
            - "MarketingFundEntry for ${ag_cv} period 2026-09 has amount_cents == 2000000"
            - "MarketingFundEntry for ${ag_nr} period 2026-09 has amount_cents == 250000"
            - "BottlerAgreement.${ag_cv}.marketing_fund_balance_cents == 2000000"
            - "BottlerAgreement.${ag_nr}.marketing_fund_balance_cents == 250000"
            - "the two amounts differ by 1750000 cents on identical period inputs"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:

      - name: concentrate_tiered_discount_capped_at_max
        grounds:
          - calculations.concentrate_unit_price
        distinguishing_aspect: "Combinatorial mode (a): 3+ inputs (base price, index ratio, quantity tier) with non-linear interaction — the 3.5% tier for qty >= 50000 is clamped by min() against MAX_DISCOUNT 3.0%, so 60000 gallons at index 110 yields unit $12.8040, not $12.7380."
        test_recipe:
          setup:
            - "Seeded ACTIVE agreement (version 2), index 110.00, line base $12.0000."
          setup_api_calls:
            - call: "POST /bottler/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /bottler/brand-owners"
              payload: { name: "ColaCo", home_country: "US" }
              as: PlatformAdmin
              captures: { bo_id: $.data.id }
            - call: "POST /bottler/concentrate-price-indices"
              payload: { brand_owner_id: "${bo_id}", quarter: "2026-Q2", index_value: 110.00 }
              as: BrandOwnerAdmin
            - call: "POST /bottler/product-lines"
              payload: { brand_owner_id: "${bo_id}", line_code: "COLA-12OZ-CAN", concentrate_base_price_per_gallon: 12.0, is_mandatory: true }
              as: BrandOwnerAdmin
              captures: { pl_id: $.data.id }
            - call: "POST /bottler/territories"
              payload: { brand_owner_id: "${bo_id}", code: "SO-ATL-07", region_label: "South Atlanta 07" }
              as: PlatformAdmin
              captures: { ter_id: $.data.id }
            - call: "POST /bottler/territories/${ter_id}/agreements"
              payload: { bottler_name: "Dixie Bottling", concentrate_base_index: 100.0, marketing_accrual_basis: "CASE_VOLUME", service_budget_cents: 1000000 }
              as: PlatformAdmin
              captures: { ag_id: $.data.id }
            - call: "POST /bottler/bottler-agreements/${ag_id}/activate"
              payload: {}
              as: PlatformAdmin
              captures: { ag_v1: $.data.version }
          trigger:
            - call: "POST /bottler/concentrate-purchase-orders"
              payload: { agreement_id: "${ag_id}", product_line_id: "${pl_id}", quantity_gallons: 60000, delivery_quarter: "2026-Q3", expected_agreement_version: "${ag_v1}" }
              as: BottlerOps
              as_user_id: "${ag_id}"
              captures: { cpo_id: $.data.id }
          assert:
            - "ConcentratePurchaseOrder.${cpo_id}.provisional_unit_price == 12.804"
            - "ConcentratePurchaseOrder.${cpo_id}.provisional_amount_cents == 76824000"
            - "the applied discount is 3.0% (cap), not the 3.5% raw tier rate"

      - name: dsd_invoice_per_line_rounding_beats_sum_then_round
        grounds:
          - calculations.dsd_invoice_total
        distinguishing_aspect: "Combinatorial mode (b): nested rounding order pinned per-line-then-sum — two lines of raw 100.7 cents each total 202 cents per-line-first, while the forbidden sum-then-round would yield 201."
        test_recipe:
          setup:
            - "Seeded ACTIVE agreement with a RETAIL customer at local_price_cents 106 (no NCA binding)."
          setup_api_calls:
            - call: "POST /bottler/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /bottler/brand-owners"
              payload: { name: "ColaCo", home_country: "US" }
              as: PlatformAdmin
              captures: { bo_id: $.data.id }
            - call: "POST /bottler/concentrate-price-indices"
              payload: { brand_owner_id: "${bo_id}", quarter: "2026-Q2", index_value: 110.00 }
              as: BrandOwnerAdmin
            - call: "POST /bottler/product-lines"
              payload: { brand_owner_id: "${bo_id}", line_code: "COLA-12OZ-CAN", concentrate_base_price_per_gallon: 12.0, is_mandatory: true }
              as: BrandOwnerAdmin
              captures: { pl_id: $.data.id }
            - call: "POST /bottler/territories"
              payload: { brand_owner_id: "${bo_id}", code: "SO-ATL-07", region_label: "South Atlanta 07" }
              as: PlatformAdmin
              captures: { ter_id: $.data.id }
            - call: "POST /bottler/territories/${ter_id}/agreements"
              payload: { bottler_name: "Dixie Bottling", concentrate_base_index: 100.0, marketing_accrual_basis: "CASE_VOLUME", service_budget_cents: 1000000 }
              as: PlatformAdmin
              captures: { ag_id: $.data.id }
            - call: "POST /bottler/bottler-agreements/${ag_id}/activate"
              payload: {}
              as: PlatformAdmin
            - call: "POST /bottler/customers"
              payload: { agreement_id: "${ag_id}", name: "QuickMart 12", channel: "RETAIL", local_price_cents: 106 }
              as: BottlerOps
              as_user_id: "${ag_id}"
              captures: { cust_id: $.data.id }
          trigger:
            - call: "POST /bottler/dsd-orders"
              payload: { customer_id: "${cust_id}", lines: [ { product_line_id: "${pl_id}", quantity_cases: 1, discount_pct: 0.05 }, { product_line_id: "${pl_id}", quantity_cases: 1, discount_pct: 0.05 } ] }
              as: CustomerManager
              as_user_id: "${cust_id}"
              captures: { order_id: $.data.id }
          assert:
            - "DsdOrder.${order_id}.invoice_total_cents == 202"
            - "invoice_total_cents is NOT 201 (the sum-then-round result), proving per-line-first rounding"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:

      - name: territory_transfer_negotiation_cycle_revaluation
        grounds:
          - state_machines.TerritoryTransfer.VALUED_to_NEGOTIATING
          - state_machines.TerritoryTransfer.NEGOTIATING_to_VALUED
        distinguishing_aspect: "Cyclic machine on TerritoryTransfer: PROPOSED->VALUED->NEGOTIATING->VALUED loops with valuation_round incrementing per pass — a linear pipeline could never re-enter VALUED."
        test_recipe:
          setup:
            - "Seeded ACTIVE agreement; TerritoryTransfer proposed with reported_ebitda_cents 600000000."
          setup_api_calls:
            - call: "POST /bottler/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /bottler/brand-owners"
              payload: { name: "ColaCo", home_country: "US" }
              as: PlatformAdmin
              captures: { bo_id: $.data.id }
            - call: "POST /bottler/concentrate-price-indices"
              payload: { brand_owner_id: "${bo_id}", quarter: "2026-Q2", index_value: 110.00 }
              as: BrandOwnerAdmin
            - call: "POST /bottler/product-lines"
              payload: { brand_owner_id: "${bo_id}", line_code: "COLA-12OZ-CAN", concentrate_base_price_per_gallon: 12.0, is_mandatory: true }
              as: BrandOwnerAdmin
            - call: "POST /bottler/territories"
              payload: { brand_owner_id: "${bo_id}", code: "SO-ATL-07", region_label: "South Atlanta 07" }
              as: PlatformAdmin
              captures: { ter_id: $.data.id }
            - call: "POST /bottler/territories/${ter_id}/agreements"
              payload: { bottler_name: "Dixie Bottling", concentrate_base_index: 100.0, marketing_accrual_basis: "CASE_VOLUME", service_budget_cents: 1000000 }
              as: PlatformAdmin
              captures: { ag_id: $.data.id }
            - call: "POST /bottler/bottler-agreements/${ag_id}/activate"
              payload: {}
              as: PlatformAdmin
            - call: "POST /bottler/territory-transfers"
              payload: { territory_id: "${ter_id}", buyer_name: "Peachtree Consolidated", reported_ebitda_cents: 600000000 }
              as: PlatformAdmin
              captures: { tt_id: $.data.id, tt_v0: $.data.version }
            - call: "POST /bottler/territory-transfers/${tt_id}/valuate"
              payload: { expected_transfer_version: "${tt_v0}" }
              as: BrandOwnerAdmin
              captures: { tt_v1: $.data.version }
          trigger:
            - call: "POST /bottler/territory-transfers/${tt_id}/counter"
              payload: {}
              as: PlatformAdmin
              captures: { tt_v2: $.data.version }
            - call: "POST /bottler/territory-transfers/${tt_id}/valuate"
              payload: { expected_transfer_version: "${tt_v2}" }
              as: BrandOwnerAdmin
          assert:
            - "TerritoryTransfer.${tt_id}.status == VALUED after the counter+re-valuate loop"
            - "TerritoryTransfer.${tt_id}.valuation_round == 2"
            - "TerritoryTransfer.${tt_id}.valuation_cents == 3948000000 (reserve 6% of 600000000 = 36000000; normalized 564000000; x7)"

      - name: bottler_agreement_suspend_reinstate_cycle_and_cpo_parallel_dims
        grounds:
          - state_machines.BottlerAgreement.ACTIVE_to_SUSPENDED
          - state_machines.BottlerAgreement.SUSPENDED_to_ACTIVE
          - state_machines.ConcentratePurchaseOrder
        distinguishing_aspect: "Different entity than TerritoryTransfer: BottlerAgreement loops ACTIVE->SUSPENDED->ACTIVE, and ConcentratePurchaseOrder carries parallel state dimensions (fulfillment_status x pricing_status) that advance independently — receive does not touch pricing_status."
        test_recipe:
          setup:
            - "Seeded ACTIVE agreement; a 10000-gallon CPO placed."
          setup_api_calls:
            - call: "POST /bottler/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /bottler/brand-owners"
              payload: { name: "ColaCo", home_country: "US" }
              as: PlatformAdmin
              captures: { bo_id: $.data.id }
            - call: "POST /bottler/concentrate-price-indices"
              payload: { brand_owner_id: "${bo_id}", quarter: "2026-Q2", index_value: 110.00 }
              as: BrandOwnerAdmin
            - call: "POST /bottler/product-lines"
              payload: { brand_owner_id: "${bo_id}", line_code: "COLA-12OZ-CAN", concentrate_base_price_per_gallon: 12.0, is_mandatory: true }
              as: BrandOwnerAdmin
              captures: { pl_id: $.data.id }
            - call: "POST /bottler/territories"
              payload: { brand_owner_id: "${bo_id}", code: "SO-ATL-07", region_label: "South Atlanta 07" }
              as: PlatformAdmin
              captures: { ter_id: $.data.id }
            - call: "POST /bottler/territories/${ter_id}/agreements"
              payload: { bottler_name: "Dixie Bottling", concentrate_base_index: 100.0, marketing_accrual_basis: "CASE_VOLUME", service_budget_cents: 1000000 }
              as: PlatformAdmin
              captures: { ag_id: $.data.id }
            - call: "POST /bottler/bottler-agreements/${ag_id}/activate"
              payload: {}
              as: PlatformAdmin
              captures: { ag_v1: $.data.version }
            - call: "POST /bottler/concentrate-purchase-orders"
              payload: { agreement_id: "${ag_id}", product_line_id: "${pl_id}", quantity_gallons: 10000, delivery_quarter: "2026-Q3", expected_agreement_version: "${ag_v1}" }
              as: BottlerOps
              as_user_id: "${ag_id}"
              captures: { cpo_id: $.data.id }
          trigger:
            - call: "POST /bottler/bottler-agreements/${ag_id}/suspend"
              payload: {}
              as: BrandOwnerAdmin
            - call: "POST /bottler/bottler-agreements/${ag_id}/reinstate"
              payload: {}
              as: BrandOwnerAdmin
            - call: "POST /bottler/concentrate-purchase-orders/${cpo_id}/receive"
              payload: {}
              as: BottlerOps
              as_user_id: "${ag_id}"
          assert:
            - "BottlerAgreement.${ag_id}.status == ACTIVE after the suspend->reinstate loop"
            - "ConcentratePurchaseOrder.${cpo_id}.fulfillment_status == RECEIVED"
            - "ConcentratePurchaseOrder.${cpo_id}.pricing_status == PROVISIONAL (receive leaves the pricing dimension untouched)"

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:

      - name: enroll_nca_reprices_booked_order_and_margin_ledger
        grounds:
          - endpoints.POST_/bottler/customers/{id}/enroll-nca
          - entities.Customer.fields.bound_price_cents
          - entities.DsdOrder.fields.invoice_total_cents
          - entities.BottlerAgreement.fields.margin_ledger_cents
        distinguishing_aspect: "Depth-3 cascade triggered by enroll-nca: Customer.bound_price_cents mutation (1) triggers BOOKED DsdOrder invoice recompute (2), whose delta triggers BottlerAgreement.margin_ledger_cents adjustment (3) — each hop is caused by the previous hop, not by the original call."
        test_recipe:
          setup:
            - "Seeded ACTIVE agreement; RETAIL customer at local_price_cents 190 with a BOOKED order of 2 cases at 0% discount (invoice 380)."
            - "NCA published with national_price_cents 200 (enroll band check on 190 vs 200: deviation == 0.05 exactly, allowed)."
          setup_api_calls:
            - call: "POST /bottler/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /bottler/brand-owners"
              payload: { name: "ColaCo", home_country: "US" }
              as: PlatformAdmin
              captures: { bo_id: $.data.id }
            - call: "POST /bottler/concentrate-price-indices"
              payload: { brand_owner_id: "${bo_id}", quarter: "2026-Q2", index_value: 110.00 }
              as: BrandOwnerAdmin
            - call: "POST /bottler/product-lines"
              payload: { brand_owner_id: "${bo_id}", line_code: "COLA-12OZ-CAN", concentrate_base_price_per_gallon: 12.0, is_mandatory: true }
              as: BrandOwnerAdmin
              captures: { pl_id: $.data.id }
            - call: "POST /bottler/territories"
              payload: { brand_owner_id: "${bo_id}", code: "SO-ATL-07", region_label: "South Atlanta 07" }
              as: PlatformAdmin
              captures: { ter_id: $.data.id }
            - call: "POST /bottler/territories/${ter_id}/agreements"
              payload: { bottler_name: "Dixie Bottling", concentrate_base_index: 100.0, marketing_accrual_basis: "CASE_VOLUME", service_budget_cents: 1000000 }
              as: PlatformAdmin
              captures: { ag_id: $.data.id }
            - call: "POST /bottler/bottler-agreements/${ag_id}/activate"
              payload: {}
              as: PlatformAdmin
            - call: "POST /bottler/customers"
              payload: { agreement_id: "${ag_id}", name: "QuickMart 12", channel: "RETAIL", local_price_cents: 190 }
              as: BottlerOps
              as_user_id: "${ag_id}"
              captures: { cust_id: $.data.id }
            - call: "POST /bottler/dsd-orders"
              payload: { customer_id: "${cust_id}", lines: [ { product_line_id: "${pl_id}", quantity_cases: 2, discount_pct: 0 } ] }
              as: CustomerManager
              as_user_id: "${cust_id}"
              captures: { order_id: $.data.id }
            - call: "POST /bottler/national-customer-agreements"
              payload: { brand_owner_id: "${bo_id}", nca_code: "NCA-2026-01", national_price_cents: 200, effective_start: "2026-09-01", effective_end: "2026-12-31" }
              as: BrandOwnerAdmin
              captures: { nca_id: $.data.id }
            - call: "POST /bottler/national-customer-agreements/${nca_id}/publish"
              payload: {}
              as: BrandOwnerAdmin
          trigger:
            - call: "POST /bottler/customers/${cust_id}/enroll-nca"
              payload: { nca_id: "${nca_id}" }
              as: BrandOwnerAdmin
          assert:
            - "Customer.${cust_id}.bound_price_cents == 200"
            - "DsdOrder.${order_id}.invoice_total_cents == 400 (recomputed from 380)"
            - "BottlerAgreement.${ag_id}.margin_ledger_cents == 20 (delta +400-380)"

      - name: transfer_execute_refranchises_agreement_and_moves_assets
        grounds:
          - state_machines.TerritoryTransfer.APPROVED_to_EXECUTED
