  - rule_id: boundary_precision_check
    instances:
      - name: ph_equality_is_compliant_at_complete
        grounds:
          - calculations.hold_deviation_metrics
          - state_machines.ProductionRun.CONFIRMED_to_COMPLETED
        distinguishing_aspect: |
          Metric pH at POST complete: the deviation predicate is strictly-greater
          (measured_ph > max_ph), so measured_ph exactly equal to max_ph 4.2 is
          compliant — no auto-hold, run lands COMPLETED. Boundary on pH.
        test_recipe:
          setup:
            - "Chain A (letter max_ph 4.2, max_aw 0.9); run r1 planned 2000 confirmed"
          setup_api_calls:
            - { call: "POST /copack/customers", payload: { brand_name: "Acme Foods", contact_email: "ops@acme.example", credit_limit_cents: 100000000, default_disposition_owner: "CUSTOMER" }, as: OpsAdmin, captures: { c1: "$.data.id"} }
