            - "effective_from 2026-10-31 returns 409 ERR_ALLOCATION_WINDOW_OVERLAP because a closed interval touching the incumbent's effective_to on one day is an overlap"
            - "the NON_FIDUCIARY_MINISTERIAL allocation with the incumbent's exact window returns 201, so the guarded resource is (plan_document_id, fiduciary_role) and not the plan or the provider"
