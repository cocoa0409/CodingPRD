  # ==========================================================================
  - section: rbac
    instances:

      - name: request_missing_x_user_id_header_returns_unauthenticated
        claim_type: exclusive_operations
        grounds:
          - validations[priority=1]
          - errors[ERR_UNAUTHENTICATED]
        distinguishing_aspect: "Sending POST /aftermarket/parts with X-User-Role but no X-User-ID header answers HTTP 401 ERR_UNAUTHENTICATED, ahead of every other check including the missing-field check."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "POST /aftermarket/parts"
              payload: { part_number: "AUTH-1", description: "Auth probe" }
              as: AftermarketPlanner
              captures: { err: $.data.error_id }
          assert:
            - "the X-User-ID header is omitted entirely from this request"
            - "response HTTP status == 401 and data.error_id == ERR_UNAUTHENTICATED"
            - "the response is NOT ERR_INVALID_REQUEST even though unit_cost_cents, lead_time_days and weight_kg are all missing"
            - "GET /aftermarket/parts returns total_count == 0"

      - name: dealer_user_cannot_approve_a_campaign
        claim_type: other_role_denied
        grounds:
          - roles.DealerUser
          - roles.InventoryController
          - validations[priority=2]
          - errors[ERR_UNAUTHORIZED]
        distinguishing_aspect: "approve is an InventoryController exclusive operation, so a DealerUser calling it answers HTTP 403 ERR_UNAUTHORIZED and the campaign stays SUBMITTED."
        test_recipe:
          setup:
            - "part RB-1 in PHASE_OUT with a CURRENT 12-month INSTALLED_BASE_RATE forecast of 0 units"
            - "a GOLD dealer and one SUBMITTED campaign"
          setup_api_calls:
            - call: "POST /aftermarket/dealers"
              payload: { dealer_code: "D-RB", tier: "GOLD", region: "NA", credit_limit_cents: 100000000 }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { d_id: $.data.id }
            - call: "POST /aftermarket/parts"
              payload: { part_number: "RB-1", description: "RBAC probe", unit_cost_cents: 100, lead_time_days: 5, weight_kg: 0.1 }
              as: AftermarketPlanner
              as_user_id: "planner-1"
              captures: { p_id: $.data.id }
            - call: "POST /aftermarket/parts/${p_id}/forecasts"
              payload: { horizon_months: 12, method: "INSTALLED_BASE_RATE" }
              as: AftermarketPlanner
              as_user_id: "planner-1"
            - call: "POST /aftermarket/parts/${p_id}/phase-out"
              payload: {}
              as: AftermarketPlanner
              as_user_id: "planner-1"
            - call: "GET /aftermarket/parts/${p_id}"
              payload: {}
              as: AftermarketPlanner
              as_user_id: "planner-1"
              captures: { p_v: $.data.version }
            - call: "POST /aftermarket/last-time-buy-campaigns"
              payload: { part_id: "${p_id}", method: "FLAT_RATE", coverage_years: 3, ltb_window_start: "2026-09-01T00:00:00Z", ltb_window_end: "2026-10-01T00:00:00Z", expected_part_version: "${p_v}" }
              as: AftermarketPlanner
              as_user_id: "planner-1"
              captures: { c_id: $.data.id }
            - call: "POST /aftermarket/last-time-buy-campaigns/${c_id}/submit"
              payload: {}
              as: AftermarketPlanner
              as_user_id: "planner-1"
          trigger:
            - call: "POST /aftermarket/last-time-buy-campaigns/${c_id}/approve"
              payload: { approved_qty: 10 }
              as: DealerUser
              as_user_id: "${d_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response HTTP status == 403 and data.error_id == ERR_UNAUTHORIZED"
            - "LastTimeBuyCampaign.${c_id}.status == SUBMITTED, approved_qty == 0, approved_by_user_id == null"
            - "Part.${p_id}.lifecycle_state == PHASE_OUT"

      - name: submitting_controller_cannot_approve_the_same_campaign
        claim_type: Segregation of duties
        grounds:
          - validations[priority=4]
          - errors[ERR_SEGREGATION_OF_DUTIES]
          - roles.InventoryController
        distinguishing_aspect: "submit is shared with InventoryController; the controller ctrl-9 who used it is then barred from approving that campaign with HTTP 403 ERR_SEGREGATION_OF_DUTIES, while a different controller ctrl-8 approves it successfully."
        test_recipe:
