scenario: |
  Generate task harder than expert level!

  2479. Youth Tournament Housing & Stay-to-Play Administration (amateur sports event housing manager):
  host hotel contracting with negotiated rates, room block sizes and rebate structures, stay-to-play
  policy enforcement requiring team booking through the official housing program, team registration
  with roster-based room requirements and booking deadlines, exception requests for local teams and
  family circumstances with approval criteria, rooming list collection, changes and cancellation
  penalties by deadline tier, rebate collection from hotels with reconciliation to actualized room
  nights, event organizer, rights holder and destination revenue sharing, complaint handling over
  pricing and policy fairness, room block release and attrition management

domain_name: youth-tournament-housing
api_prefix: /housing

complexity_profile:
  primary_archetype: quota_allocation
  secondary_archetype: ledger_reconciliation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers

  entity_topology: graph
  # RoomBlock inventory is shared across Teams via Booking (many-to-many join of
  # TeamRegistration x RoomBlock); Booking is self-referential through
  # supersedes_booking_id; Complaint points polymorphically-by-nullable-FK at both
  # TeamRegistration and ExceptionRequest; RevenueDistribution joins Tournament x
  # RebateInvoice. No single ownership tree governs the graph.

  state_machine_shape: parallel
  # Booking carries two independent state axes (booking_status x rebate_status).
  # ExceptionRequest is cyclic (UNDER_REVIEW -> INFO_REQUESTED -> UNDER_REVIEW,
  # DENIED -> UNDER_REVIEW on appeal). HotelContract is cyclic
  # (DRAFT -> NEGOTIATING -> DRAFT). RoomBlock is cyclic (OPEN <-> RESTRICTED).
  # Complaint is branching fork-join (FILED -> {INVESTIGATING, ESCALATED} ->
  # {UPHELD, DISMISSED}). Tournament.posture and TeamRegistration.status are compound
  # (derived from children).

  relationship_patterns:
    - one_to_many
    - many_to_many
    - self_referential
    - cross_aggregate

  role_model: segregation_of_duties
  # The ExceptionReviewer operator id that decided an ExceptionRequest may not review
  # its appeal; the RightsHolder operator id adjudicating a Complaint may not equal the
  # decided_by_user_id of the ExceptionRequest that Complaint cites.

  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Tournament
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: Event name.
      - name: rights_holder_org
        type: string
        source: input
        description: Name of the sanctioning rights holder that shares rebate revenue.
      - name: destination_org
        type: string
        source: input
        description: Name of the destination marketing organization that shares rebate revenue.
      - name: start_date
        type: string
        source: input
        description: First competition date, ISO 8601 calendar date (YYYY-MM-DD).
      - name: end_date
        type: string
        source: input
        description: Last competition date, ISO 8601 calendar date (YYYY-MM-DD).
        constraints: must be strictly after start_date
      - name: booking_deadline
        type: datetime
        source: input
        description: Instant after which POST /housing/bookings is refused for this tournament.
      - name: stay_to_play_required
        type: boolean
        source: input
        description: When true, every TeamRegistration must reach status HOUSING_COMPLIANT or EXCEPTION_GRANTED.
        default: true
      - name: share_pct_organizer
        type: number
        source: input
        description: Organizer share of distributable rebate, decimal fraction with 2 decimal places.
      - name: share_pct_rights_holder
        type: number
        source: input
        description: Rights-holder share of distributable rebate, decimal fraction with 2 decimal places.
      - name: share_pct_destination
        type: number
        source: input
        description: Destination share of distributable rebate, decimal fraction with 2 decimal places.
        constraints: share_pct_organizer + share_pct_rights_holder + share_pct_destination == 1.00
      - name: posture
        type: enum
        source: computed
        description: Aggregate gate over all child operations, per calculations.tournament_posture.
        default: OPEN
        constraints: one of {OPEN, BOOKING_CLOSED, RECONCILING, SETTLED}
      - name: housing_pressure
        type: enum
        source: computed
        description: CONSTRAINED when every HotelContract with status == EXECUTED has block_posture == SOLD_OUT and at least one such contract exists; otherwise NORMAL. Per calculations.tournament_housing_pressure.
        default: NORMAL
        constraints: one of {NORMAL, CONSTRAINED}
      - name: executed_contract_count
        type: integer
        source: computed
        description: Count of HotelContract rows with tournament_id == this.id and status IN {EXECUTED, CLOSED}.
        default: 0
      - name: sold_out_contract_count
        type: integer
        source: computed
        description: Count of HotelContract rows with tournament_id == this.id, status IN {EXECUTED, CLOSED} and block_posture == SOLD_OUT.
        default: 0
      - name: night_count
        type: integer
        source: computed
        description: Number of nights in the event window, computed as (end_date - start_date) in whole days.

  - name: Hotel
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: Hotel property name.
      - name: city
        type: string
        source: input
        description: Hotel city.
      - name: total_rooms
        type: integer
        source: input
        description: Physical room inventory of the property; ceiling for aggregate per-night block capacity.
        constraints: ">= 1"
      - name: distance_miles_from_venue
        type: number
        source: input
        description: Driving distance from the competition venue, used to order candidate host hotels.
        constraints: ">= 0"

  - name: HotelContract
    parent: Tournament
    common_fields: true
    fields:
      - name: tournament_id
        type: string
        source: input
        description: FK -> Tournament.id; the event this contract supplies rooms for.
      - name: hotel_id
        type: string
        source: input
        description: FK -> Hotel.id; the contracted property.
      - name: status
        type: enum
        source: computed
        description: Contract lifecycle, per state_machines.HotelContract.
        default: DRAFT
        constraints: one of {DRAFT, NEGOTIATING, EXECUTED, CLOSED}
      - name: negotiated_nightly_rate_cents
        type: integer
        source: input
        description: Negotiated per-room per-night rate in cents; the basis for cancellation penalties and percent-of-revenue rebates.
        constraints: ">= 1"
      - name: rebate_model
        type: enum
        source: input
        description: Which rebate structure applies to this contract's bookings.
        constraints: one of {PER_ROOM_NIGHT_FLAT, PERCENT_OF_ROOM_REVENUE, TIERED_PER_ROOM_NIGHT}
      - name: rebate_flat_cents_per_room_night
        type: integer
        source: input
        description: Flat rebate per actualized room night in cents; required when rebate_model == PER_ROOM_NIGHT_FLAT, must be omitted otherwise.
        default: 0
      - name: rebate_percent
        type: number
        source: input
        description: Rebate as a decimal fraction of gross room revenue, 4 decimal places; required when rebate_model == PERCENT_OF_ROOM_REVENUE, must be omitted otherwise.
        default: 0
      - name: attrition_threshold_pct
        type: number
        source: input
        description: Fraction of contracted room nights the event must actualize before attrition damages apply, 2 decimal places.
        constraints: 0.00 < attrition_threshold_pct <= 1.00
      - name: attrition_penalty_rate_cents_per_room_night
        type: integer
        source: input
        description: Damages in cents charged per shortfall room night, deducted from the rebate claim.
        constraints: ">= 0"
      - name: cutoff_date
        type: datetime
        source: input
        description: Instant after which unsold rooms in this contract's blocks may be released back to the hotel.
      - name: countersigned_by_hotel_id
        type: string
        source: system
        description: X-User-ID of the HotelRepresentative that countersigned; null until status reaches EXECUTED.
      - name: revision_round
        type: integer
        source: computed
        description: Number of times this contract has cycled NEGOTIATING -> DRAFT.
        default: 0
      - name: contracted_room_nights
        type: integer
        source: computed
        description: Sum over RoomBlock rows with contract_id == this.id and status IN {OPEN, RESTRICTED, RELEASED, SETTLED} of block_size_rooms * (departure_date - arrival_date in whole days).
        default: 0
      - name: block_posture
        type: enum
        source: computed
        description: Derived block availability, per calculations.contract_block_posture.
        default: AVAILABLE
        constraints: one of {AVAILABLE, TIGHT, SOLD_OUT}

  - name: RoomBlock
    parent: HotelContract
    common_fields: true
    fields:
      - name: contract_id
        type: string
        source: input
        description: FK -> HotelContract.id; the contract this block belongs to.
      - name: room_type
        type: enum
        source: input
        description: Room product held in this block.
        constraints: one of {DOUBLE_QUEEN, KING, SUITE}
      - name: block_size_rooms
        type: integer
        source: input
        description: Number of rooms held per night for the whole block window.
        constraints: ">= 1"
      - name: arrival_date
        type: string
        source: input
        description: First night held, ISO 8601 calendar date; interval is half-open [arrival_date, departure_date).
      - name: departure_date
        type: string
        source: input
        description: Check-out date, ISO 8601 calendar date; the night beginning on departure_date is NOT held.
        constraints: must be strictly after arrival_date
      - name: release_deadline
        type: datetime
        source: input
        description: Instant at or after which unsold rooms are released; must be at or after HotelContract.cutoff_date.
      - name: status
        type: enum
        source: computed
        description: Block lifecycle and utilization posture, per state_machines.RoomBlock.
        default: OPEN
        constraints: one of {OPEN, RESTRICTED, RELEASED, SETTLED}
      - name: rooms_committed
        type: integer
        source: computed
        description: Peak-night committed rooms, per calculations.block_rooms_committed.
        default: 0
      - name: rooms_available
        type: integer
        source: computed
        description: block_size_rooms - rooms_committed while status IN {OPEN, RESTRICTED}; exactly 0 while status IN {RELEASED, SETTLED}.
        default: 0
      - name: rooms_released_unsold
        type: integer
        source: computed
        description: Frozen at the OPEN|RESTRICTED -> RELEASED transition as block_size_rooms - rooms_committed; 0 while status IN {OPEN, RESTRICTED}.
        default: 0
      - name: utilization_pct
        type: number
        source: computed
        description: rooms_committed / block_size_rooms as a decimal fraction rounded to 4 decimal places; drives the OPEN <-> RESTRICTED auto-transition.
        default: 0
      - name: threshold_room_nights
        type: integer
        source: computed
        description: ceil(block_size_rooms * (departure_date - arrival_date in whole days) * HotelContract.attrition_threshold_pct); the per-block attrition floor.
        default: 0
      - name: actualized_room_nights
        type: integer
        source: computed
        description: Sum over Booking rows with room_block_id == this.id and booking_status == CHECKED_OUT of Booking.actualized_room_nights.
        default: 0

  - name: Team
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: Team name.
      - name: home_city
        type: string
        source: input
        description: Team home city.
      - name: home_state
        type: string
        source: input
        description: Two-letter state code of the team's home city.
      - name: org_contact_email
        type: string
        source: input
        description: Team manager contact email.
      - name: distance_miles_from_venue
        type: number
        source: input
        description: Driving distance from the team's home city to the competition venue.
        constraints: ">= 0"

  - name: TeamRegistration
    parent: Tournament
    common_fields: true
    fields:
      - name: tournament_id
        type: string
        source: input
        description: FK -> Tournament.id; the event entered.
      - name: team_id
        type: string
        source: input
        description: FK -> Team.id; the entering team.
      - name: roster_player_count
        type: integer
        source: input
        description: Number of players on the submitted roster.
        constraints: ">= 1"
      - name: roster_staff_count
        type: integer
        source: input
        description: Number of coaches and staff on the submitted roster.
        constraints: ">= 0"
      - name: local_team_flag
        type: boolean
        source: computed
        description: True when the referenced Team.distance_miles_from_venue <= LOCAL_TEAM_RADIUS_MILES (30); derives from a different entity than the one it is stored on.
        default: false
      - name: required_rooms_registered
        type: integer
        source: computed
        description: Segregated-occupancy room requirement, per calculations.roster_room_requirement variant segregated_occupancy; also the ceiling on Booking.rooms_requested.
        default: 0
      - name: required_room_nights
        type: integer
        source: computed
        description: required_rooms_registered * Tournament.night_count.
        default: 0
      - name: minimum_rooms_for_compliance
        type: integer
        source: computed
        description: Pooled-occupancy room requirement, per calculations.roster_room_requirement variant pooled_occupancy; the number stay-to-play compliance is judged against.
        default: 0
      - name: exempt_rooms_granted
        type: integer
        source: computed
        description: Sum of ExceptionRequest.approved_rooms_exempt over rows with registration_id == this.id and status == APPROVED.
        default: 0
      - name: effective_required_rooms
        type: integer
        source: computed
        description: max(0, minimum_rooms_for_compliance - exempt_rooms_granted).
        default: 0
      - name: committed_rooms
        type: integer
        source: computed
        description: Sum of Booking.rooms_requested over rows with registration_id == this.id and booking_status IN {CONFIRMED, CHECKED_OUT}.
        default: 0
      - name: status
        type: enum
        source: computed
        description: Stay-to-play compliance posture, per calculations.registration_compliance_status.
        default: PENDING_HOUSING
        constraints: one of {PENDING_HOUSING, HOUSING_COMPLIANT, EXCEPTION_GRANTED, NON_COMPLIANT}
      - name: compliance_evaluated_at
        type: datetime
        source: system
        description: Logical-clock instant of the most recent status recomputation.

  - name: Booking
    parent: TeamRegistration
    common_fields: true
    fields:
      - name: registration_id
        type: string
        source: input
        description: FK -> TeamRegistration.id; the registration this booking houses.
      - name: room_block_id
        type: string
        source: input
        description: FK -> RoomBlock.id; the block rooms are drawn from.
      - name: supersedes_booking_id
        type: string
        source: input
        description: FK -> Booking.id; optional self-reference to the booking this one replaces, which is cancelled as a side effect. Null when this is an original booking.
      - name: rooms_requested
        type: integer
        source: input
        description: Rooms held for this team on every night of the stay.
        constraints: ">= 1"
      - name: check_in_date
        type: string
        source: input
        description: Arrival date, ISO 8601 calendar date; stay interval is half-open [check_in_date, check_out_date) for block capacity, closed [check_in_date, check_out_date] for team exclusivity.
      - name: check_out_date
        type: string
        source: input
        description: Departure date, ISO 8601 calendar date.
        constraints: must be strictly after check_in_date
      - name: booking_status
        type: enum
        source: computed
        description: Reservation axis of the parallel state machine, per state_machines.Booking.
        default: DRAFT
        constraints: one of {DRAFT, ROOMING_LIST_SUBMITTED, CONFIRMED, CHECKED_OUT, CANCELLED}
      - name: rebate_status
        type: enum
        source: computed
        description: Money axis of the parallel state machine, evolving independently of booking_status.
        default: NOT_DUE
        constraints: one of {NOT_DUE, ACCRUED, INVOICED, COLLECTED, SHORT_PAID, WRITTEN_OFF}
      - name: nights
        type: integer
        source: computed
        description: (check_out_date - check_in_date) in whole days.
        default: 0
      - name: projected_room_nights
        type: integer
        source: computed
        description: rooms_requested * nights; the pre-stay estimate used for cancellation penalties.
        default: 0
      - name: actualized_room_nights
        type: integer
        source: computed
        description: reported_room_nights of the ActualizationReport for this booking with the greatest sequence_no; 0 when no report exists.
        default: 0
      - name: rebate_accrued_cents
        type: integer
        source: computed
        description: Per-booking rebate line in cents, per calculations.booking_rebate_line.
        default: 0
      - name: penalty_cents
        type: integer
        source: computed
        description: Cancellation penalty in cents, per calculations.cancellation_penalty; 0 unless booking_status == CANCELLED.
        default: 0
      - name: penalty_room_nights
        type: integer
        source: computed
        description: Chargeable room nights selected by the deadline tier at cancellation time.
        default: 0
      - name: penalty_credit_cents
        type: integer
        source: computed
        description: Cents of penalty relieved by an UPHELD Complaint remedy, per calculations.complaint_remedy_credit.
        default: 0
      - name: cancellation_reason
        type: string
        source: input
        description: Free-text reason captured at cancellation; null while booking_status != CANCELLED.
      - name: cancelled_at
        type: datetime
        source: system
        description: Logical-clock instant of the cancellation; null while booking_status != CANCELLED.

  - name: RoomingListEntry
    parent: Booking
    common_fields: false
    fields:
      - name: booking_id
        type: string
        source: input
        description: FK -> Booking.id; the booking this room belongs to.
      - name: room_index
        type: integer
        source: input
        description: 1-based room ordinal within the booking; must be a contiguous 1..rooms_requested sequence with no duplicates.
        constraints: ">= 1"
      - name: occupant_count
        type: integer
        source: input
        description: Total occupants assigned to this room.
        constraints: 1 <= occupant_count <= MAX_OCCUPANTS_PER_ROOM (4)
      - name: minor_occupant_count
        type: integer
        source: input
        description: How many occupants are under 18.
        constraints: 0 <= minor_occupant_count <= occupant_count
      - name: chaperone_name
        type: string
        source: input
        description: Named adult responsible for the room; required when minor_occupant_count > 0.

  - name: ExceptionRequest
    parent: TeamRegistration
    common_fields: true
    fields:
      - name: registration_id
        type: string
        source: input
        description: FK -> TeamRegistration.id; the registration seeking relief from stay-to-play.
      - name: reason_code
        type: enum
        source: input
        description: Statutory ground for the exemption.
        constraints: one of {LOCAL_TEAM, FAMILY_MEDICAL, ADA_ACCOMMODATION, FINANCIAL_HARDSHIP, RELATIVE_HOSTING}
      - name: requested_rooms_exempt
        type: integer
        source: input
        description: Rooms the team asks to be excused from booking through the housing program.
        constraints: ">= 1"
      - name: justification
        type: string
        source: input
        description: Narrative supporting the exemption.
      - name: status
        type: enum
        source: computed
        description: Review lifecycle, per state_machines.ExceptionRequest.
        default: SUBMITTED
        constraints: one of {SUBMITTED, UNDER_REVIEW, INFO_REQUESTED, APPROVED, DENIED}
      - name: approved_rooms_exempt
        type: integer
        source: computed
        description: Rooms actually excused; 0 unless status == APPROVED.
        default: 0
      - name: review_round
        type: integer
        source: computed
        description: Number of times this request has entered UNDER_REVIEW.
        default: 0
      - name: appeal_count
        type: integer
        source: computed
        description: Number of DENIED -> UNDER_REVIEW appeal cycles consumed.
        default: 0
      - name: decided_by_user_id
        type: string
        source: system
        description: X-User-ID of the ExceptionReviewer that last moved this request to APPROVED or DENIED, or the literal "SYSTEM_AUTO" for pressure-driven auto-approval; null before any decision.
      - name: decision_note
        type: string
        source: input
        description: Reviewer note recorded with the latest review action.

  - name: Complaint
    parent: Tournament
    common_fields: true
    fields:
      - name: tournament_id
        type: string
        source: input
        description: FK -> Tournament.id; the event complained about.
      - name: registration_id
        type: string
        source: input
        description: FK -> TeamRegistration.id; optional complaining registration, null for hotel-side complaints.
      - name: cited_exception_request_id
        type: string
        source: input
        description: FK -> ExceptionRequest.id; optional exception decision the complaint disputes.
      - name: affected_booking_id
        type: string
        source: input
        description: FK -> Booking.id; optional booking whose penalty a granted remedy credits.
      - name: category
        type: enum
        source: input
        description: Complaint subject.
        constraints: one of {PRICING_FAIRNESS, POLICY_FAIRNESS, BLOCK_AVAILABILITY, REBATE_TRANSPARENCY}
      - name: narrative
        type: string
        source: input
        description: Complainant statement.
      - name: status
        type: enum
        source: computed
        description: Fork-join handling lifecycle, per state_machines.Complaint.
        default: FILED
        constraints: one of {FILED, INVESTIGATING, ESCALATED, UPHELD, DISMISSED}
      - name: route
        type: enum
        source: computed
        description: Branch chosen at triage; null until status leaves FILED.
        constraints: one of {INVESTIGATE, ESCALATE}
      - name: remedy_type
        type: enum
        source: computed
        description: Remedy granted at adjudication.
        default: NONE
        constraints: one of {NONE, FEE_WAIVER, RATE_ADJUSTMENT, POLICY_EXEMPTION}
      - name: remedy_amount_cents
        type: integer
        source: input
        description: Requested waiver amount in cents; required when remedy_type == FEE_WAIVER, must be omitted otherwise.
        default: 0
      - name: remedy_credit_cents
        type: integer
        source: computed
        description: Cents of relief actually applied, per calculations.complaint_remedy_credit.
        default: 0
      - name: triaged_by_user_id
        type: string
        source: system
        description: X-User-ID of the HousingManager that triaged; null while status == FILED.
      - name: adjudicated_by_user_id
        type: string
        source: system
        description: X-User-ID of the RightsHolder that adjudicated; null until status IN {UPHELD, DISMISSED}.

  - name: RebateInvoice
    parent: HotelContract
    common_fields: true
    fields:
      - name: contract_id
        type: string
        source: input
        description: FK -> HotelContract.id; the contract billed.
      - name: period_label
        type: string
        source: input
        description: Human label for the billing period; unique per contract_id.
      - name: status
        type: enum
        source: computed
        description: Collection lifecycle, per state_machines.RebateInvoice.
        default: DRAFT
        constraints: one of {DRAFT, ISSUED, PARTIALLY_PAID, PAID, DISPUTED, WRITTEN_OFF}
      - name: invoiced_room_nights
        type: integer
        source: computed
        description: Sum of Booking.actualized_room_nights over the invoice scope defined in calculations.rebate_invoice_amount.
        default: 0
      - name: invoiced_rebate_cents
        type: integer
        source: computed
        description: Rebate claim in cents, rounded per line then summed, per calculations.rebate_invoice_amount.
        default: 0
      - name: attrition_shortfall_room_nights_per_block
        type: integer
        source: computed
        description: Per-block attrition shortfall, per calculations.attrition_shortfall variant per_block_attrition; the billed variant.
        default: 0
      - name: attrition_shortfall_room_nights_aggregate
        type: integer
        source: computed
        description: Contract-aggregate attrition shortfall, per calculations.attrition_shortfall variant contract_aggregate_attrition; reported for dispute review only.
        default: 0
      - name: attrition_penalty_cents
        type: integer
        source: computed
        description: attrition_shortfall_room_nights_per_block * HotelContract.attrition_penalty_rate_cents_per_room_night.
        default: 0
      - name: total_due_cents
        type: integer
        source: computed
        description: max(0, invoiced_rebate_cents - attrition_penalty_cents); the amount the hotel must remit.
        default: 0
      - name: collected_cents
        type: integer
        source: computed
        description: Running sum of accepted remittances in cents.
        default: 0
      - name: written_off_cents
        type: integer
        source: computed
        description: Cents abandoned by the WRITE_OFF lifecycle action.
        default: 0
      - name: outstanding_cents
        type: integer
        source: computed
        description: total_due_cents - collected_cents - written_off_cents.
        default: 0
      - name: distributed_cents
        type: integer
        source: computed
        description: Sum of RevenueDistribution.gross_collected_cents over rows with source_invoice_id == this.id.
        default: 0
      - name: dispute_note
        type: string
        source: input
        description: Hotel statement recorded by the DISPUTE lifecycle action.

  - name: RevenueDistribution
    parent: Tournament
    common_fields: true
    fields:
      - name: tournament_id
        type: string
        source: input
        description: FK -> Tournament.id; the event whose share percentages apply.
      - name: source_invoice_id
        type: string
        source: input
        description: FK -> RebateInvoice.id; the collected invoice being split.
      - name: status
        type: enum
        source: computed
        description: Distribution lifecycle, per state_machines.RevenueDistribution.
        default: CALCULATED
        constraints: one of {CALCULATED, APPROVED, PAID}
      - name: gross_collected_cents
        type: integer
        source: computed
        description: Snapshot of RebateInvoice.collected_cents at creation; the tier key for the admin fee.
        default: 0
      - name: admin_fee_pct
        type: number
        source: computed
        description: Tiered administration fee fraction selected from ADMIN_FEE_TIERS by gross_collected_cents.
        default: 0
      - name: admin_fee_cents
        type: integer
        source: computed
        description: round_half_up(gross_collected_cents * admin_fee_pct).
        default: 0
      - name: distributable_cents
        type: integer
        source: computed
        description: gross_collected_cents - admin_fee_cents.
        default: 0
      - name: organizer_cents
        type: integer
        source: computed
        description: Organizer bucket including the rounding remainder, per calculations.revenue_share_split.
        default: 0
      - name: rights_holder_cents
        type: integer
        source: computed
        description: Rights-holder bucket, floor-allocated.
        default: 0
      - name: destination_cents
        type: integer
        source: computed
        description: Destination bucket, floor-allocated.
        default: 0
      - name: rounding_remainder_cents
        type: integer
        source: computed
        description: distributable_cents minus the three floor allocations; assigned in full to organizer_cents.
        default: 0
      - name: approved_by_user_id
        type: string
        source: system
        description: X-User-ID of the RightsHolder that approved; null while status == CALCULATED.

  - name: ActualizationReport
    parent: Booking
    common_fields: false
    fields:
      - name: booking_id
        type: string
        source: input
        description: FK -> Booking.id; the stay being actualized.
      - name: sequence_no
        type: integer
        source: system
        description: Per-booking monotonically increasing ordinal starting at 1; the greatest sequence_no wins when deriving Booking.actualized_room_nights.
      - name: reported_room_nights
        type: integer
        source: input
        description: Room nights the hotel says were consumed for this booking.
        constraints: ">= 0"
      - name: report_note
        type: string
        source: input
        description: Hotel narrative for the report.

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Tournament
    initial_state: OPEN
    terminal_states: [SETTLED]
    note: |
      posture is a compound gate: OPEN admits registration/booking/exception traffic,
      BOOKING_CLOSED admits actualization, RECONCILING admits collection, SETTLED admits nothing.
    transitions:
      - from: OPEN
        to: BOOKING_CLOSED
        trigger: "POST /housing/tournaments/{id}/close-booking"
        actor: HousingManager
        preconditions:
          - "posture == OPEN"
          - "at least one HotelContract with tournament_id == this.id has status IN {EXECUTED, CLOSED}"
        side_effects:
          - "CASCADE-CLOSE link 1: every TeamRegistration with tournament_id == this.id and status == PENDING_HOUSING is re-evaluated by calculations.registration_compliance_status; those with committed_rooms < effective_required_rooms become NON_COMPLIANT"
          - "CASCADE-CLOSE link 2 (caused by link 1): for every registration that just became NON_COMPLIANT, its ExceptionRequest rows with status IN {SUBMITTED, UNDER_REVIEW, INFO_REQUESTED} become DENIED with decided_by_user_id := 'SYSTEM_AUTO' and decision_note := 'closed without decision'"
          - "CASCADE-CLOSE link 3 (caused by link 2): each such registration's exempt_rooms_granted and effective_required_rooms are recomputed and compliance_evaluated_at is refreshed"
          - "every RoomBlock whose contract_id belongs to a HotelContract of this tournament with status == EXECUTED, whose status IN {OPEN, RESTRICTED} and whose release_deadline <= logical now, transitions to RELEASED (see state_machines.RoomBlock)"
          - "updated_at refreshed and version incremented by 1"
      - from: BOOKING_CLOSED
        to: RECONCILING
        trigger: "system: first RebateInvoice of any HotelContract of this tournament reaches status ISSUED"
        actor: system
        preconditions:
          - "posture == BOOKING_CLOSED"
        side_effects:
          - "updated_at refreshed and version incremented by 1"
      - from: RECONCILING
        to: SETTLED
        trigger: "system: re-evaluated after every RebateInvoice status change and every RevenueDistribution status change"
        actor: system
        preconditions:
          - "posture == RECONCILING"
          - "every RebateInvoice whose contract_id belongs to a HotelContract of this tournament has status IN {PAID, WRITTEN_OFF}"
          - "at least one RevenueDistribution has tournament_id == this.id, and every such row has status == PAID"
        side_effects:
          - "updated_at refreshed and version incremented by 1"

  - entity: HotelContract
    initial_state: DRAFT
    terminal_states: [CLOSED]
    note: "Cyclic: DRAFT -> NEGOTIATING -> DRAFT on hotel-side revision."
    transitions:
      - from: DRAFT
        to: NEGOTIATING
        trigger: "POST /housing/hotel-contracts/{id}/negotiation with action == SUBMIT"
        actor: HousingManager
        preconditions:
          - "status == DRAFT"
          - "Tournament.posture == OPEN for tournament_id"
          - "at least one RoomBlock has contract_id == this.id"
        side_effects:
          - "updated_at refreshed and version incremented by 1"
      - from: NEGOTIATING
        to: DRAFT
        trigger: "POST /housing/hotel-contracts/{id}/negotiation with action == REVISE"
        actor: HotelRepresentative
        preconditions:
          - "status == NEGOTIATING"
          - "X-User-ID == this.hotel_id"
        side_effects:
          - "revision_round incremented by 1"
          - "updated_at refreshed and version incremented by 1"
        note: "The revision cycle; a contract may loop DRAFT -> NEGOTIATING -> DRAFT without bound."
      - from: NEGOTIATING
        to: EXECUTED
        trigger: "POST /housing/hotel-contracts/{id}/negotiation with action == COUNTERSIGN"
        actor: HotelRepresentative
        preconditions:
          - "status == NEGOTIATING"
          - "X-User-ID == this.hotel_id"
          - "Tournament.posture == OPEN for tournament_id"
        side_effects:
          - "countersigned_by_hotel_id := X-User-ID"
          - "Tournament.executed_contract_count and Tournament.sold_out_contract_count recomputed, then Tournament.housing_pressure recomputed per calculations.tournament_housing_pressure"
          - "updated_at refreshed and version incremented by 1"
      - from: EXECUTED
        to: CLOSED
        trigger: "system: re-evaluated whenever a RoomBlock of this contract changes status"
        actor: system
        preconditions:
          - "status == EXECUTED"
          - "at least one RoomBlock has contract_id == this.id, and every such row has status == SETTLED"
        side_effects:
          - "Tournament.executed_contract_count and Tournament.sold_out_contract_count recomputed"
          - "updated_at refreshed and version incremented by 1"

  - entity: RoomBlock
    initial_state: OPEN
    terminal_states: [SETTLED]
    note: "Cyclic on the utilization axis: OPEN <-> RESTRICTED driven by utilization_pct crossing BLOCK_RESTRICT_UTILIZATION in either direction."
    transitions:
      - from: OPEN
        to: RESTRICTED
        trigger: "system: recompute of rooms_committed after POST /housing/bookings/{id}/confirm or POST /housing/bookings/{id}/cancel"
        actor: system
        preconditions:
          - "status == OPEN"
          - "utilization_pct >= BLOCK_RESTRICT_UTILIZATION (0.90)"
        side_effects:
          - "CASCADE-CONFIRM link 3 (caused by link 2): HotelContract.block_posture recomputed per calculations.contract_block_posture, which may flip it to SOLD_OUT"
          - "updated_at refreshed and version incremented by 1"
      - from: RESTRICTED
        to: OPEN
        trigger: "system: recompute of rooms_committed after POST /housing/bookings/{id}/cancel"
        actor: system
        preconditions:
          - "status == RESTRICTED"
          - "utilization_pct < BLOCK_RESTRICT_UTILIZATION (0.90)"
        side_effects:
          - "HotelContract.block_posture recomputed, which may flip it away from SOLD_OUT, which in turn recomputes Tournament.housing_pressure"
          - "updated_at refreshed and version incremented by 1"
      - from: OPEN
        to: RELEASED
        trigger: "POST /housing/room-blocks/{id}/release, or system during the CASCADE-CLOSE chain of Tournament OPEN -> BOOKING_CLOSED"
        actor: HousingManager
        preconditions:
          - "status == OPEN"
          - "HotelContract.status == EXECUTED for contract_id"
          - "logical now >= release_deadline"
        side_effects:
          - "rooms_released_unsold := block_size_rooms - rooms_committed (frozen)"
          - "rooms_available := 0"
          - "HotelContract.block_posture recomputed, then Tournament.housing_pressure recomputed"
          - "updated_at refreshed and version incremented by 1"
      - from: RESTRICTED
        to: RELEASED
        trigger: "POST /housing/room-blocks/{id}/release, or system during the CASCADE-CLOSE chain of Tournament OPEN -> BOOKING_CLOSED"
        actor: HousingManager
        preconditions:
          - "status == RESTRICTED"
          - "HotelContract.status == EXECUTED for contract_id"
          - "logical now >= release_deadline"
        side_effects:
          - "rooms_released_unsold := block_size_rooms - rooms_committed (frozen)"
          - "rooms_available := 0"
          - "HotelContract.block_posture recomputed, then Tournament.housing_pressure recomputed"
          - "updated_at refreshed and version incremented by 1"
      - from: RELEASED
        to: SETTLED
        trigger: "system: re-evaluated whenever a Booking on this block changes rebate_status"
        actor: system
        preconditions:
          - "status == RELEASED"
          - "at least one Booking has room_block_id == this.id and booking_status != CANCELLED"
          - "every Booking with room_block_id == this.id and booking_status != CANCELLED has rebate_status IN {COLLECTED, SHORT_PAID, WRITTEN_OFF}"
        side_effects:
          - "CASCADE-REMIT link 4 (caused by link 3): HotelContract EXECUTED -> CLOSED is re-evaluated"
          - "updated_at refreshed and version incremented by 1"

  - entity: Booking
    initial_state: DRAFT
    terminal_states: [CHECKED_OUT, CANCELLED]
    note: |
      Parallel state dimensions on one row. Axis A is booking_status
      (DRAFT -> ROOMING_LIST_SUBMITTED -> CONFIRMED -> CHECKED_OUT, with CANCELLED as an
      alternate terminal). Axis B is rebate_status (NOT_DUE -> ACCRUED -> INVOICED ->
      COLLECTED | SHORT_PAID | WRITTEN_OFF). After the first ActualizationReport pushes
      axis A to CHECKED_OUT, axis A never moves again while axis B advances through three
      further transitions driven entirely by RebateInvoice lifecycle events.
    transitions:
      - from: DRAFT
        to: ROOMING_LIST_SUBMITTED
        trigger: "POST /housing/bookings/{id}/rooming-list"
        actor: TeamManager
        preconditions:
          - "booking_status == DRAFT"
          - "Tournament.posture == OPEN for the registration's tournament_id"
          - "X-User-ID == TeamRegistration.team_id for registration_id"
        side_effects:
          - "one RoomingListEntry row created per submitted entry"
          - "updated_at refreshed and version incremented by 1"
      - from: ROOMING_LIST_SUBMITTED
        to: ROOMING_LIST_SUBMITTED
        trigger: "POST /housing/bookings/{id}/rooming-list (replacement submission)"
        actor: TeamManager
        preconditions:
          - "booking_status == ROOMING_LIST_SUBMITTED"
          - "Tournament.posture == OPEN for the registration's tournament_id"
          - "X-User-ID == TeamRegistration.team_id for registration_id"
        side_effects:
          - "every existing RoomingListEntry with booking_id == this.id is deleted, then one row created per submitted entry"
          - "updated_at refreshed and version incremented by 1"
        note: "Self-loop: rooming lists may be re-collected any number of times before confirmation."
      - from: ROOMING_LIST_SUBMITTED
        to: CONFIRMED
        trigger: "POST /housing/bookings/{id}/confirm"
        actor: HousingManager
        preconditions:
          - "booking_status == ROOMING_LIST_SUBMITTED"
          - "Tournament.posture == OPEN for the registration's tournament_id"
          - "RoomBlock.status IN {OPEN, RESTRICTED} for room_block_id"
        side_effects:
          - "CASCADE-CONFIRM link 1: TeamRegistration.committed_rooms recomputed, then TeamRegistration.status re-derived per calculations.registration_compliance_status and compliance_evaluated_at refreshed"
          - "CASCADE-CONFIRM link 2 (caused by link 1 sharing the same recompute epoch): RoomBlock.rooms_committed, rooms_available and utilization_pct recomputed, which may fire RoomBlock OPEN -> RESTRICTED"
          - "CASCADE-CONFIRM link 3 (caused by link 2): HotelContract.block_posture recomputed, which may flip to SOLD_OUT"
          - "CASCADE-CONFIRM link 4 (caused by link 3): Tournament.sold_out_contract_count and Tournament.housing_pressure recomputed, which may flip housing_pressure NORMAL -> CONSTRAINED"
          - "TeamRegistration.updated_at refreshed and TeamRegistration.version incremented by 1"
          - "updated_at refreshed and version incremented by 1"
      - from: CONFIRMED
        to: CHECKED_OUT
        trigger: "system: first ActualizationReport created by POST /housing/bookings/{id}/actualizations"
        actor: system
        preconditions:
          - "booking_status == CONFIRMED"
          - "no ActualizationReport exists with booking_id == this.id"
        side_effects:
          - "actualized_room_nights recomputed; rebate_status NOT_DUE -> ACCRUED when reported_room_nights > 0"
          - "RoomBlock.actualized_room_nights recomputed"
          - "updated_at refreshed and version incremented by 1"
      - from: DRAFT
        to: CANCELLED
        trigger: "POST /housing/bookings/{id}/cancel"
        actor: TeamManager
        preconditions:
          - "booking_status == DRAFT"
          - "Tournament.posture IN {OPEN, BOOKING_CLOSED} for the registration's tournament_id"
        side_effects:
          - "penalty_room_nights and penalty_cents computed per calculations.cancellation_penalty; cancelled_at := logical now"
          - "RoomBlock.rooms_committed, rooms_available and utilization_pct recomputed, which may fire RoomBlock RESTRICTED -> OPEN"
          - "TeamRegistration.committed_rooms and status recomputed"
          - "updated_at refreshed and version incremented by 1"
      - from: ROOMING_LIST_SUBMITTED
        to: CANCELLED
        trigger: "POST /housing/bookings/{id}/cancel"
        actor: TeamManager
        preconditions:
          - "booking_status == ROOMING_LIST_SUBMITTED"
          - "Tournament.posture IN {OPEN, BOOKING_CLOSED} for the registration's tournament_id"
        side_effects:
          - "penalty_room_nights and penalty_cents computed per calculations.cancellation_penalty; cancelled_at := logical now"
          - "every RoomingListEntry with booking_id == this.id is deleted"
          - "RoomBlock.rooms_committed, rooms_available and utilization_pct recomputed, which may fire RoomBlock RESTRICTED -> OPEN"
          - "TeamRegistration.committed_rooms and status recomputed"
          - "updated_at refreshed and version incremented by 1"
      - from: CONFIRMED
        to: CANCELLED
        trigger: "POST /housing/bookings/{id}/cancel, or system when a later Booking is created with supersedes_booking_id == this.id"
        actor: TeamManager
        preconditions:
          - "booking_status == CONFIRMED"
          - "Tournament.posture IN {OPEN, BOOKING_CLOSED} for the registration's tournament_id"
        side_effects:
          - "penalty_room_nights and penalty_cents computed per calculations.cancellation_penalty; cancelled_at := logical now"
          - "every RoomingListEntry with booking_id == this.id is deleted"
          - "RoomBlock.rooms_committed, rooms_available and utilization_pct recomputed, which may fire RoomBlock RESTRICTED -> OPEN"
          - "TeamRegistration.committed_rooms and status recomputed; a registration may fall back from HOUSING_COMPLIANT to PENDING_HOUSING"
          - "updated_at refreshed and version incremented by 1"

  - entity: Booking
    initial_state: NOT_DUE
    terminal_states: [COLLECTED, SHORT_PAID, WRITTEN_OFF]
    note: "Axis B of Booking's parallel state machine: rebate_status. Every transition here is system-driven and leaves booking_status untouched."
    transitions:
      - from: NOT_DUE
        to: ACCRUED
        trigger: "system: first ActualizationReport with reported_room_nights > 0"
        actor: system
        preconditions:
          - "rebate_status == NOT_DUE"
          - "booking_status IN {CONFIRMED, CHECKED_OUT}"
        side_effects:
          - "rebate_accrued_cents computed per calculations.booking_rebate_line"
      - from: ACCRUED
        to: ACCRUED
        trigger: "system: each subsequent ActualizationReport for the same booking"
        actor: system
        preconditions:
          - "rebate_status == ACCRUED"
        side_effects:
          - "actualized_room_nights re-derived from the greatest sequence_no, then rebate_accrued_cents recomputed; booking_status remains CHECKED_OUT"
        note: "Self-loop proving axis independence: axis B recomputes while axis A is frozen at CHECKED_OUT."
      - from: ACCRUED
        to: INVOICED
        trigger: "system: POST /housing/rebate-invoices freezes this booking into the invoice scope"
        actor: system
        preconditions:
          - "rebate_status == ACCRUED"
          - "booking_status == CHECKED_OUT"
        side_effects:
          - "no change to booking_status"
      - from: INVOICED
        to: COLLECTED
        trigger: "system: the invoice covering this booking reaches status PAID"
        actor: system
        preconditions:
          - "rebate_status == INVOICED"
        side_effects:
          - "CASCADE-REMIT link 3 (caused by link 2): RoomBlock RELEASED -> SETTLED is re-evaluated for room_block_id"
      - from: INVOICED
        to: SHORT_PAID
        trigger: "system: the invoice covering this booking reaches status WRITTEN_OFF with collected_cents > 0"
        actor: system
        preconditions:
          - "rebate_status == INVOICED"
        side_effects:
          - "RoomBlock RELEASED -> SETTLED is re-evaluated for room_block_id"
      - from: INVOICED
        to: WRITTEN_OFF
        trigger: "system: the invoice covering this booking reaches status WRITTEN_OFF with collected_cents == 0"
        actor: system
        preconditions:
          - "rebate_status == INVOICED"
        side_effects:
          - "RoomBlock RELEASED -> SETTLED is re-evaluated for room_block_id"

  - entity: ExceptionRequest
    initial_state: SUBMITTED
    terminal_states: [APPROVED]
    note: "Cyclic twice over: UNDER_REVIEW -> INFO_REQUESTED -> UNDER_REVIEW (information loop) and DENIED -> UNDER_REVIEW (appeal loop, capped at MAX_EXCEPTION_APPEALS)."
    transitions:
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /housing/exception-requests when reason_code == LOCAL_TEAM, TeamRegistration.local_team_flag == true and Tournament.housing_pressure == CONSTRAINED"
        actor: system
        preconditions:
          - "reason_code == LOCAL_TEAM"
          - "TeamRegistration.local_team_flag == true for registration_id"
          - "Tournament.housing_pressure == CONSTRAINED for the registration's tournament_id"
        side_effects:
          - "approved_rooms_exempt := requested_rooms_exempt; decided_by_user_id := 'SYSTEM_AUTO'; review_round stays 0"
          - "TeamRegistration.exempt_rooms_granted, effective_required_rooms and status recomputed"
        note: "Auto-approval short-circuits the review cycle entirely when the tournament is sold out."
      - from: SUBMITTED
        to: UNDER_REVIEW
        trigger: "POST /housing/exception-requests/{id}/review with action == START_REVIEW"
        actor: ExceptionReviewer
        preconditions:
          - "status == SUBMITTED"
          - "Tournament.posture == OPEN for the registration's tournament_id"
        side_effects:
          - "review_round incremented by 1"
          - "updated_at refreshed and version incremented by 1"
      - from: UNDER_REVIEW
        to: INFO_REQUESTED
        trigger: "POST /housing/exception-requests/{id}/review with action == REQUEST_INFO"
        actor: ExceptionReviewer
        preconditions:
          - "status == UNDER_REVIEW"
        side_effects:
          - "decision_note := payload decision_note"
          - "updated_at refreshed and version incremented by 1"
      - from: INFO_REQUESTED
        to: UNDER_REVIEW
        trigger: "POST /housing/exception-requests/{id}/team-action with action == RESUBMIT"
        actor: TeamManager
        preconditions:
          - "status == INFO_REQUESTED"
          - "X-User-ID == TeamRegistration.team_id for registration_id"
          - "Tournament.posture == OPEN for the registration's tournament_id"
        side_effects:
          - "justification replaced with the payload justification; review_round incremented by 1"
          - "updated_at refreshed and version incremented by 1"
        note: "Information loop; unbounded."
      - from: UNDER_REVIEW
        to: APPROVED
        trigger: "POST /housing/exception-requests/{id}/review with action == APPROVE"
        actor: ExceptionReviewer
        preconditions:
          - "status == UNDER_REVIEW"
          - "Tournament.posture == OPEN for the registration's tournament_id"
          - "when appeal_count >= 1, X-User-ID != decided_by_user_id"
        side_effects:
          - "approved_rooms_exempt := payload approved_rooms_exempt; decided_by_user_id := X-User-ID"
          - "TeamRegistration.exempt_rooms_granted, effective_required_rooms and status recomputed; status may become EXCEPTION_GRANTED or HOUSING_COMPLIANT"
          - "TeamRegistration.updated_at refreshed and TeamRegistration.version incremented by 1"
          - "updated_at refreshed and version incremented by 1"
      - from: UNDER_REVIEW
        to: DENIED
        trigger: "POST /housing/exception-requests/{id}/review with action == DENY"
        actor: ExceptionReviewer
        preconditions:
          - "status == UNDER_REVIEW"
          - "when appeal_count >= 1, X-User-ID != decided_by_user_id"
        side_effects:
          - "approved_rooms_exempt := 0; decided_by_user_id := X-User-ID; decision_note := payload decision_note"
          - "TeamRegistration.exempt_rooms_granted, effective_required_rooms and status recomputed"
          - "updated_at refreshed and version incremented by 1"
      - from: DENIED
        to: UNDER_REVIEW
        trigger: "POST /housing/exception-requests/{id}/team-action with action == APPEAL"
        actor: TeamManager
        preconditions:
          - "status == DENIED"
          - "appeal_count < MAX_EXCEPTION_APPEALS (1)"
          - "X-User-ID == TeamRegistration.team_id for registration_id"
          - "Tournament.posture == OPEN for the registration's tournament_id"
        side_effects:
          - "appeal_count incremented by 1; review_round incremented by 1"
          - "updated_at refreshed and version incremented by 1"
        note: "Appeal loop; capped so the cycle terminates."

  - entity: Complaint
    initial_state: FILED
    terminal_states: [UPHELD, DISMISSED]
    note: "Branching fork-join: FILED forks into INVESTIGATING or ESCALATED with divergent side-effect sets, then both branches join at UPHELD or DISMISSED with branch-dependent remedy vocabularies."
    transitions:
      - from: FILED
        to: INVESTIGATING
        trigger: "POST /housing/complaints/{id}/triage with route == INVESTIGATE"
        actor: HousingManager
        preconditions:
          - "status == FILED"
          - "Tournament.posture != SETTLED for tournament_id"
        side_effects:
          - "route := INVESTIGATE; triaged_by_user_id := X-User-ID"
          - "updated_at refreshed and version incremented by 1"
        note: "Fork branch 1 — no cross-entity effect."
      - from: FILED
        to: ESCALATED
        trigger: "POST /housing/complaints/{id}/triage with route == ESCALATE"
        actor: HousingManager
        preconditions:
          - "status == FILED"
          - "Tournament.posture != SETTLED for tournament_id"
        side_effects:
          - "route := ESCALATE; triaged_by_user_id := X-User-ID"
          - "divergent branch effect: when cited_exception_request_id is non-null and that ExceptionRequest.status == DENIED, its appeal_count is reset to 0 and its version incremented by 1, restoring one appeal cycle to the team"
          - "updated_at refreshed and version incremented by 1"
        note: "Fork branch 2 — carries a cross-entity effect that branch 1 does not."
      - from: INVESTIGATING
        to: UPHELD
        trigger: "POST /housing/complaints/{id}/adjudicate with outcome == UPHOLD"
        actor: RightsHolder
        preconditions:
          - "status == INVESTIGATING"
          - "remedy_type IN {NONE, FEE_WAIVER} (the INVESTIGATE branch's remedy vocabulary)"
          - "when cited_exception_request_id is non-null, X-User-ID != that ExceptionRequest.decided_by_user_id"
        side_effects:
          - "remedy_type := payload remedy_type; remedy_credit_cents computed per calculations.complaint_remedy_credit; adjudicated_by_user_id := X-User-ID"
          - "when remedy_type == FEE_WAIVER and affected_booking_id is non-null: Booking.penalty_credit_cents incremented by remedy_credit_cents and that Booking's version incremented by 1"
          - "updated_at refreshed and version incremented by 1"
      - from: ESCALATED
        to: UPHELD
        trigger: "POST /housing/complaints/{id}/adjudicate with outcome == UPHOLD"
        actor: RightsHolder
        preconditions:
          - "status == ESCALATED"
          - "remedy_type IN {NONE, FEE_WAIVER, RATE_ADJUSTMENT, POLICY_EXEMPTION} (the ESCALATE branch's wider remedy vocabulary)"
          - "when cited_exception_request_id is non-null, X-User-ID != that ExceptionRequest.decided_by_user_id"
        side_effects:
          - "remedy_type := payload remedy_type; remedy_credit_cents computed per calculations.complaint_remedy_credit; adjudicated_by_user_id := X-User-ID"
          - "when remedy_type IN {FEE_WAIVER, RATE_ADJUSTMENT} and affected_booking_id is non-null: Booking.penalty_credit_cents incremented by remedy_credit_cents and that Booking's version incremented by 1"
          - "CASCADE-REMEDY link 1: when remedy_type == POLICY_EXEMPTION and cited_exception_request_id is non-null and that ExceptionRequest.status == DENIED, that request becomes APPROVED with approved_rooms_exempt := requested_rooms_exempt and decided_by_user_id := 'SYSTEM_AUTO'"
          - "CASCADE-REMEDY link 2 (caused by link 1): the request's TeamRegistration.exempt_rooms_granted and effective_required_rooms are recomputed"
          - "CASCADE-REMEDY link 3 (caused by link 2): that TeamRegistration.status is re-derived and may move NON_COMPLIANT -> EXCEPTION_GRANTED"
          - "updated_at refreshed and version incremented by 1"
      - from: INVESTIGATING
        to: DISMISSED
        trigger: "POST /housing/complaints/{id}/adjudicate with outcome == DISMISS"
        actor: RightsHolder
        preconditions:
          - "status == INVESTIGATING"
          - "when cited_exception_request_id is non-null, X-User-ID != that ExceptionRequest.decided_by_user_id"
        side_effects:
          - "remedy_type := NONE; remedy_credit_cents := 0; adjudicated_by_user_id := X-User-ID"
          - "updated_at refreshed and version incremented by 1"
      - from: ESCALATED
        to: DISMISSED
        trigger: "POST /housing/complaints/{id}/adjudicate with outcome == DISMISS"
        actor: RightsHolder
        preconditions:
          - "status == ESCALATED"
          - "when cited_exception_request_id is non-null, X-User-ID != that ExceptionRequest.decided_by_user_id"
        side_effects:
          - "remedy_type := NONE; remedy_credit_cents := 0; adjudicated_by_user_id := X-User-ID"
          - "updated_at refreshed and version incremented by 1"

  - entity: RebateInvoice
    initial_state: DRAFT
    terminal_states: [PAID, WRITTEN_OFF]
    transitions:
      - from: DRAFT
        to: ISSUED
        trigger: "POST /housing/rebate-invoices/{id}/lifecycle with action == ISSUE"
        actor: HousingManager
        preconditions:
          - "status == DRAFT"
          - "total_due_cents >= 1"
        side_effects:
          - "Tournament BOOKING_CLOSED -> RECONCILING is re-evaluated for the contract's tournament_id"
          - "updated_at refreshed and version incremented by 1"
      - from: ISSUED
        to: PARTIALLY_PAID
        trigger: "POST /housing/rebate-invoices/{id}/remit with amount_cents < outstanding_cents"
        actor: HotelRepresentative
        preconditions:
          - "status == ISSUED"
          - "X-User-ID == HotelContract.hotel_id for contract_id"
          - "1 <= amount_cents < outstanding_cents"
        side_effects:
          - "collected_cents incremented by amount_cents; outstanding_cents recomputed"
          - "updated_at refreshed and version incremented by 1"
      - from: PARTIALLY_PAID
        to: PARTIALLY_PAID
        trigger: "POST /housing/rebate-invoices/{id}/remit with amount_cents < outstanding_cents"
        actor: HotelRepresentative
        preconditions:
          - "status == PARTIALLY_PAID"
          - "X-User-ID == HotelContract.hotel_id for contract_id"
          - "1 <= amount_cents < outstanding_cents"
        side_effects:
          - "collected_cents incremented by amount_cents; outstanding_cents recomputed"
          - "updated_at refreshed and version incremented by 1"
        note: "Self-loop for instalment remittance."
      - from: ISSUED
        to: PAID
        trigger: "POST /housing/rebate-invoices/{id}/remit with amount_cents == outstanding_cents"
        actor: HotelRepresentative
        preconditions:
          - "status == ISSUED"
          - "X-User-ID == HotelContract.hotel_id for contract_id"
          - "amount_cents == outstanding_cents"
        side_effects:
          - "CASCADE-REMIT link 1: collected_cents := total_due_cents; outstanding_cents := 0"
          - "CASCADE-REMIT link 2 (caused by link 1): every Booking whose room_block_id belongs to a RoomBlock of this contract and whose rebate_status == INVOICED moves INVOICED -> COLLECTED"
          - "Tournament RECONCILING -> SETTLED is re-evaluated"
          - "updated_at refreshed and version incremented by 1"
      - from: PARTIALLY_PAID
        to: PAID
        trigger: "POST /housing/rebate-invoices/{id}/remit with amount_cents == outstanding_cents"
        actor: HotelRepresentative
        preconditions:
          - "status == PARTIALLY_PAID"
          - "X-User-ID == HotelContract.hotel_id for contract_id"
          - "amount_cents == outstanding_cents"
        side_effects:
          - "CASCADE-REMIT link 1: collected_cents := total_due_cents; outstanding_cents := 0"
          - "CASCADE-REMIT link 2 (caused by link 1): every Booking whose room_block_id belongs to a RoomBlock of this contract and whose rebate_status == INVOICED moves INVOICED -> COLLECTED"
          - "Tournament RECONCILING -> SETTLED is re-evaluated"
          - "updated_at refreshed and version incremented by 1"
      - from: DISPUTED
        to: PAID
        trigger: "POST /housing/rebate-invoices/{id}/remit with amount_cents == outstanding_cents"
        actor: HotelRepresentative
        preconditions:
          - "status == DISPUTED"
          - "X-User-ID == HotelContract.hotel_id for contract_id"
          - "amount_cents == outstanding_cents"
        side_effects:
          - "CASCADE-REMIT link 1: collected_cents := total_due_cents; outstanding_cents := 0"
          - "CASCADE-REMIT link 2 (caused by link 1): every Booking whose room_block_id belongs to a RoomBlock of this contract and whose rebate_status == INVOICED moves INVOICED -> COLLECTED"
          - "Tournament RECONCILING -> SETTLED is re-evaluated"
          - "updated_at refreshed and version incremented by 1"
        note: "A dispute does not bar payment; remitting in full closes the dispute."
      - from: ISSUED
        to: DISPUTED
        trigger: "POST /housing/rebate-invoices/{id}/lifecycle with action == DISPUTE"
        actor: HotelRepresentative
        preconditions:
          - "status == ISSUED"
          - "X-User-ID == HotelContract.hotel_id for contract_id"
        side_effects:
          - "dispute_note := payload dispute_note"
          - "updated_at refreshed and version incremented by 1"
      - from: PARTIALLY_PAID
        to: DISPUTED
        trigger: "POST /housing/rebate-invoices/{id}/lifecycle with action == DISPUTE"
        actor: HotelRepresentative
        preconditions:
          - "status == PARTIALLY_PAID"
          - "X-User-ID == HotelContract.hotel_id for contract_id"
        side_effects:
          - "dispute_note := payload dispute_note"
          - "updated_at refreshed and version incremented by 1"
      - from: ISSUED
        to: WRITTEN_OFF
        trigger: "POST /housing/rebate-invoices/{id}/lifecycle with action == WRITE_OFF"
        actor: HousingManager
        preconditions:
          - "status == ISSUED"
        side_effects:
          - "written_off_cents := outstanding_cents; outstanding_cents := 0"
          - "every Booking whose room_block_id belongs to a RoomBlock of this contract and whose rebate_status == INVOICED moves INVOICED -> WRITTEN_OFF because collected_cents == 0"
          - "RoomBlock RELEASED -> SETTLED and Tournament RECONCILING -> SETTLED are re-evaluated"
          - "updated_at refreshed and version incremented by 1"
      - from: PARTIALLY_PAID
        to: WRITTEN_OFF
        trigger: "POST /housing/rebate-invoices/{id}/lifecycle with action == WRITE_OFF"
        actor: HousingManager
        preconditions:
          - "status == PARTIALLY_PAID"
        side_effects:
          - "written_off_cents := outstanding_cents; outstanding_cents := 0"
          - "every Booking whose room_block_id belongs to a RoomBlock of this contract and whose rebate_status == INVOICED moves INVOICED -> SHORT_PAID because collected_cents > 0"
          - "RoomBlock RELEASED -> SETTLED and Tournament RECONCILING -> SETTLED are re-evaluated"
          - "updated_at refreshed and version incremented by 1"
      - from: DISPUTED
        to: WRITTEN_OFF
        trigger: "POST /housing/rebate-invoices/{id}/lifecycle with action == WRITE_OFF"
        actor: HousingManager
        preconditions:
          - "status == DISPUTED"
        side_effects:
          - "written_off_cents := outstanding_cents; outstanding_cents := 0"
          - "every Booking whose room_block_id belongs to a RoomBlock of this contract and whose rebate_status == INVOICED moves INVOICED -> SHORT_PAID when collected_cents > 0, otherwise INVOICED -> WRITTEN_OFF"
          - "RoomBlock RELEASED -> SETTLED and Tournament RECONCILING -> SETTLED are re-evaluated"
          - "updated_at refreshed and version incremented by 1"

  - entity: RevenueDistribution
    initial_state: CALCULATED
    terminal_states: [PAID]
    transitions:
      - from: CALCULATED
        to: APPROVED
        trigger: "POST /housing/revenue-distributions/{id}/advance with action == APPROVE"
        actor: RightsHolder
        preconditions:
          - "status == CALCULATED"
          - "no Complaint with tournament_id == this.tournament_id, category == REBATE_TRANSPARENCY and status == UPHELD has adjudicated_by_user_id == X-User-ID"
        side_effects:
          - "approved_by_user_id := X-User-ID"
          - "updated_at refreshed and version incremented by 1"
      - from: APPROVED
        to: PAID
        trigger: "POST /housing/revenue-distributions/{id}/advance with action == PAY"
        actor: HousingManager
        preconditions:
          - "status == APPROVED"
        side_effects:
          - "Tournament RECONCILING -> SETTLED is re-evaluated for tournament_id"
          - "updated_at refreshed and version incremented by 1"

# =============================================================================
# 1.2.1 Concurrency Rules (OCC on the parent's version — the only sanctioned mechanism)
# =============================================================================
concurrency_rules:
  - rule_id: booking-create-stale-registration
    parent_entity: TeamRegistration
    write_endpoint: "POST /housing/bookings"
    occ_field: "expected_registration_version"
    description: |
      Creating a Booking against a TeamRegistration whose version has advanced since the
      client last observed it is rejected. Booking creation legitimately supersedes an
      earlier booking through supersedes_booking_id, so a writer whose view of the
      registration predates another writer's supersede would otherwise re-house a roster
      that has already been re-housed; the stale-version check makes that rejection
      deterministic.
    error_id: ERR_STALE_REGISTRATION_VERSION
    http_status: 412

  - rule_id: distribution-create-stale-invoice
    parent_entity: RebateInvoice
    write_endpoint: "POST /housing/revenue-distributions"
    occ_field: "expected_invoice_version"
    description: |
      Creating a RevenueDistribution against a RebateInvoice whose version has advanced
      since the client last observed it is rejected. A second distribution against the
      same invoice is legitimate once further remittance has raised collected_cents, so
      the operation cannot be barred by a state precondition; the stale-version check
      instead pins the snapshot of collected_cents the split was computed from.
    error_id: ERR_STALE_INVOICE_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: tournament_night_count
    trigger: "POST /housing/tournaments (at creation); the value is immutable thereafter"
    algorithm: interval_merge
    formula: |
      night_count = (date(end_date) - date(start_date)) in whole days
      # Half-open [start_date, end_date): the night beginning on end_date is not part of the event.
    input_set: "The tournament's own start_date and end_date only."
    constants: {}
    precision: "integer days, exact"

  - name: roster_room_requirement
    trigger: "POST /housing/team-registrations (both variants stamped at creation); re-evaluated on every TeamRegistration recompute"
    algorithm: threshold
    formula: |
      # VARIANT A — segregated_occupancy, stored as required_rooms_registered:
      player_rooms = ceil(roster_player_count / MAX_PLAYERS_PER_ROOM)
      staff_rooms  = ceil(roster_staff_count  / MAX_STAFF_PER_ROOM)
      required_rooms_registered = player_rooms + staff_rooms
      required_room_nights      = required_rooms_registered * Tournament.night_count

      # VARIANT B — pooled_occupancy, stored as minimum_rooms_for_compliance:
      minimum_rooms_for_compliance = ceil((roster_player_count + roster_staff_count) / MAX_PLAYERS_PER_ROOM)
    input_set: "The registration's own roster_player_count and roster_staff_count, plus Tournament.night_count of the referenced tournament."
    constants:
      MAX_PLAYERS_PER_ROOM: 4
      MAX_STAFF_PER_ROOM: 2
    precision: "integer rooms; ceil applied per bucket in variant A and once over the pooled total in variant B"
    variants:
      - name: segregated_occupancy
        when: "Applied to required_rooms_registered, which is the CEILING enforced on Booking.rooms_requested (validations priority 84)."
        difference: "Players and staff are ceil-ed in separate buckets with different per-room capacities, so the ceil remainder is paid twice."
      - name: pooled_occupancy
        when: "Applied to minimum_rooms_for_compliance, which is the FLOOR stay-to-play compliance is judged against (calculations.registration_compliance_status)."
        difference: "Players and staff share rooms at MAX_PLAYERS_PER_ROOM, so the ceil remainder is paid once. For roster_player_count=13, roster_staff_count=3 variant A yields 6 rooms and variant B yields 4 rooms from identical inputs."

  - name: registration_compliance_status
    trigger: "system: after POST /housing/team-registrations, POST /housing/bookings/{id}/confirm, POST /housing/bookings/{id}/cancel, ExceptionRequest UNDER_REVIEW->APPROVED, ExceptionRequest UNDER_REVIEW->DENIED, ExceptionRequest SUBMITTED->APPROVED, and Tournament OPEN->BOOKING_CLOSED"
    algorithm: aggregation
    formula: |
      exempt_rooms_granted = sum of ExceptionRequest.approved_rooms_exempt
                             over rows with registration_id == this.id AND status == APPROVED
      effective_required_rooms = max(0, minimum_rooms_for_compliance - exempt_rooms_granted)
      committed_rooms = sum of Booking.rooms_requested
                        over rows with registration_id == this.id
                        AND booking_status IN {CONFIRMED, CHECKED_OUT}
      if Tournament.stay_to_play_required == false:
          status = HOUSING_COMPLIANT
      elif effective_required_rooms == 0 and exempt_rooms_granted >= 1:
          status = EXCEPTION_GRANTED
      elif committed_rooms >= effective_required_rooms:
          status = HOUSING_COMPLIANT
      elif Tournament.posture == OPEN:
          status = PENDING_HOUSING
      else:
          status = NON_COMPLIANT
      compliance_evaluated_at = logical now
    input_set: |
      ExceptionRequest rows filtered to status == APPROVED (SUBMITTED, UNDER_REVIEW, INFO_REQUESTED and
      DENIED rows contribute nothing). Booking rows filtered to booking_status IN {CONFIRMED, CHECKED_OUT}
      (DRAFT, ROOMING_LIST_SUBMITTED and CANCELLED rows contribute nothing). Both sums are order-insensitive.
    constants: {}
    precision: "integer rooms; the compliance comparison is inclusive (>=), so committed_rooms exactly equal to effective_required_rooms is compliant"

  - name: block_rooms_committed
    trigger: "occupancy_held is evaluated during POST /housing/bookings for validations priority 86; rooms_committed, rooms_available and utilization_pct are recomputed only after POST /housing/bookings/{id}/confirm and POST /housing/bookings/{id}/cancel"
    algorithm: interval_merge
    formula: |
      # Peak-night occupancy over the block's own half-open window. TWO DISTINCT SETS:
      #   held_bookings      — inventory a booking is holding but has not yet locked in.
      #                        Used ONLY by validations priority 86 (oversell guard).
      #   committed_bookings — inventory locked in against the hotel. Drives the three
      #                        persisted counters and therefore the RESTRICTED posture.
      held_bookings      = Booking rows with room_block_id == this.id
                           AND booking_status IN {DRAFT, ROOMING_LIST_SUBMITTED, CONFIRMED, CHECKED_OUT}
      committed_bookings = Booking rows with room_block_id == this.id
                           AND booking_status IN {CONFIRMED, CHECKED_OUT}
      for each night n in the half-open range [arrival_date, departure_date):
          occupancy_held(n)      = sum of b.rooms_requested for b in held_bookings
                                   where n is in the half-open range [b.check_in_date, b.check_out_date)
          occupancy_committed(n) = sum of b.rooms_requested for b in committed_bookings
                                   where n is in the half-open range [b.check_in_date, b.check_out_date)
      rooms_committed  = max over all n of occupancy_committed(n)   # 0 when committed_bookings is empty
      rooms_available  = block_size_rooms - rooms_committed   when status IN {OPEN, RESTRICTED}
                       = 0                                   when status IN {RELEASED, SETTLED}
      utilization_pct  = round_half_up(rooms_committed / block_size_rooms, 4)
      # Consequence pinned for the test layer: creating a booking leaves rooms_committed,
      # rooms_available and utilization_pct untouched; POST /housing/bookings/{id}/confirm
      # is the single trigger that moves them, which is what makes CASCADE-CONFIRM fire.
    input_set: "Two filtered sets over Booking rows on this block. occupancy_held(n) uses booking_status IN {DRAFT, ROOMING_LIST_SUBMITTED, CONFIRMED, CHECKED_OUT} and feeds only validations priority 86. occupancy_committed(n) uses booking_status IN {CONFIRMED, CHECKED_OUT} and feeds rooms_committed, rooms_available and utilization_pct. CANCELLED bookings are excluded from both sets and free their rooms immediately."
    constants: {}
    precision: "integer rooms for the counts; utilization_pct to 4 decimal places, round_half_up"

  - name: block_utilization_posture
    trigger: "system: immediately after every calculations.block_rooms_committed recompute"
    algorithm: threshold
    formula: |
      if status IN {OPEN, RESTRICTED}:
          status = RESTRICTED  if utilization_pct >= BLOCK_RESTRICT_UTILIZATION
                 = OPEN        otherwise
      # status IN {RELEASED, SETTLED} is never revisited by this rule.
    input_set: "The block's own utilization_pct and status."
    constants:
      BLOCK_RESTRICT_UTILIZATION: 0.90
    precision: "comparison is inclusive: utilization_pct exactly 0.9000 restricts the block; 0.8999 does not"

  - name: contract_block_posture
    trigger: "system: after any RoomBlock status change or block creation under this contract"
    algorithm: aggregation
    formula: |
      live_blocks      = RoomBlock rows with contract_id == this.id AND status IN {OPEN, RESTRICTED}
      restricted_count = count of live_blocks with status == RESTRICTED
      if count(live_blocks) == 0:                     block_posture = AVAILABLE
      elif restricted_count == count(live_blocks):    block_posture = SOLD_OUT
      elif restricted_count >= 1:                     block_posture = TIGHT
      else:                                           block_posture = AVAILABLE
    input_set: "RoomBlock rows filtered to status IN {OPEN, RESTRICTED}; RELEASED and SETTLED blocks are excluded from both numerator and denominator."
    constants: {}
    precision: "integer counts, exact"

  - name: tournament_housing_pressure
    trigger: "system: after any HotelContract status change, any HotelContract.block_posture recompute, and any RoomBlock status change"
    algorithm: aggregation
    formula: |
      executed_contract_count = count of HotelContract with tournament_id == this.id
                                AND status IN {EXECUTED, CLOSED}
      sold_out_contract_count = count of the same rows with block_posture == SOLD_OUT
      housing_pressure = CONSTRAINED  if executed_contract_count >= 1
                                      AND sold_out_contract_count == executed_contract_count
                       = NORMAL       otherwise
    input_set: "HotelContract rows filtered to status IN {EXECUTED, CLOSED}; DRAFT and NEGOTIATING contracts are excluded."
    constants: {}
    precision: "integer counts, exact"

  - name: tournament_posture
    trigger: "system: OPEN->BOOKING_CLOSED on POST /housing/tournaments/{id}/close-booking; BOOKING_CLOSED->RECONCILING on the first RebateInvoice reaching ISSUED; RECONCILING->SETTLED after every RebateInvoice status change and every RevenueDistribution status change"
    algorithm: projection
    formula: |
      posture advances monotonically OPEN -> BOOKING_CLOSED -> RECONCILING -> SETTLED and never regresses.
      SETTLED requires, evaluated only while posture == RECONCILING:
        (a) every RebateInvoice whose contract_id belongs to a HotelContract with
            tournament_id == this.id has status IN {PAID, WRITTEN_OFF}, AND
        (b) count of RevenueDistribution with tournament_id == this.id is >= 1, AND
        (c) every such RevenueDistribution has status == PAID.
    input_set: "All RebateInvoice rows reachable through the tournament's contracts regardless of status, and all RevenueDistribution rows of the tournament regardless of status."
    constants: {}
    precision: "enum, exact"

  - name: cancellation_penalty
    trigger: "POST /housing/bookings/{id}/cancel"
    algorithm: threshold
    formula: |
      days_out = floor((instant(check_in_date at 00:00:00Z) - logical_now) / 86400 seconds)
                 # may be negative when the stay has already begun
      if   days_out >= CANCEL_FREE_TIER_DAYS:     penalty_room_nights = 0
      elif days_out >= CANCEL_QUARTER_TIER_DAYS:  penalty_room_nights = ceil(projected_room_nights * CANCEL_QUARTER_PCT)
      elif days_out >= CANCEL_HALF_TIER_DAYS:     penalty_room_nights = ceil(projected_room_nights * CANCEL_HALF_PCT)
      else:                                       penalty_room_nights = projected_room_nights
      penalty_cents = penalty_room_nights * HotelContract.negotiated_nightly_rate_cents
                      # contract reached via RoomBlock.contract_id of this booking's room_block_id
    input_set: "The booking's own projected_room_nights and check_in_date, the logical clock, and the negotiated_nightly_rate_cents of the contract owning the booking's room block. penalty_credit_cents from UPHELD complaints is applied separately and never reduces penalty_cents itself."
    constants:
      CANCEL_FREE_TIER_DAYS: 45
      CANCEL_QUARTER_TIER_DAYS: 21
      CANCEL_HALF_TIER_DAYS: 7
      CANCEL_QUARTER_PCT: 0.25
      CANCEL_HALF_PCT: 0.50
    precision: "integer room nights via ceil; all tier comparisons are inclusive (>=), so days_out exactly 45 yields a zero penalty and 44 yields the quarter tier"

  - name: booking_rebate_line
    trigger: "system: on Booking rebate_status NOT_DUE->ACCRUED and on each ACCRUED->ACCRUED self-loop (stored as Booking.rebate_accrued_cents); recomputed independently at POST /housing/rebate-invoices"
    algorithm: tiered_pricing
    formula: |
      c = HotelContract owning this booking's RoomBlock
      n = Booking.actualized_room_nights
      if c.rebate_model == PER_ROOM_NIGHT_FLAT:
          line_cents = n * c.rebate_flat_cents_per_room_night
      elif c.rebate_model == PERCENT_OF_ROOM_REVENUE:
          line_cents = round_half_up(n * c.negotiated_nightly_rate_cents * c.rebate_percent)
      else:  # TIERED_PER_ROOM_NIGHT
          contract_total_nights = sum of Booking.actualized_room_nights over Booking rows whose
                                  room_block_id belongs to a RoomBlock with contract_id == c.id
                                  AND booking_status == CHECKED_OUT
          # AVERAGE-RATE selection (pinned): the single tier that contract_total_nights lands in
          # is applied to ALL of this booking's nights. Marginal per-tier allocation is NOT used.
          rate = 500  if contract_total_nights <  30
               = 750  if 30 <= contract_total_nights < 90
               = 1000 if contract_total_nights >= 90
          line_cents = n * rate
    input_set: "Only Booking rows with booking_status == CHECKED_OUT feed contract_total_nights; CONFIRMED and CANCELLED bookings are excluded. The sum is order-insensitive."
    constants:
      REBATE_TIER_1_MAX_NIGHTS: 30
      REBATE_TIER_2_MAX_NIGHTS: 90
      REBATE_TIER_1_RATE_CENTS: 500
      REBATE_TIER_2_RATE_CENTS: 750
      REBATE_TIER_3_RATE_CENTS: 1000
    precision: "whole cents, round_half_up; tier boundaries inclusive at the lower edge, so contract_total_nights of exactly 30 selects REBATE_TIER_2_RATE_CENTS"

  - name: rebate_invoice_amount
    trigger: "POST /housing/rebate-invoices"
    algorithm: aggregation
    formula: |
      scope = Booking rows whose room_block_id belongs to a RoomBlock with contract_id == this.contract_id
              AND booking_status == CHECKED_OUT
              AND rebate_status == ACCRUED
              ordered by Booking.created_at ASC   # order pinned for reproducible line emission
      invoiced_room_nights = sum over scope of b.actualized_room_nights
      # ROUNDING ORDER IS PINNED: round EACH line to whole cents first, THEN sum the
      # rounded lines. Summing the unrounded products and rounding once at the end is
      # WRONG and can differ by one or more cents.
      invoiced_rebate_cents = sum over scope of calculations.booking_rebate_line(b)
      attrition_penalty_cents = attrition_shortfall_room_nights_per_block
                                * HotelContract.attrition_penalty_rate_cents_per_room_night
      total_due_cents   = max(0, invoiced_rebate_cents - attrition_penalty_cents)
      collected_cents   = 0
      written_off_cents = 0
      outstanding_cents = total_due_cents - collected_cents - written_off_cents
    input_set: "Bookings of the contract filtered to booking_status == CHECKED_OUT AND rebate_status == ACCRUED; already-INVOICED, COLLECTED, SHORT_PAID and WRITTEN_OFF bookings are excluded, which makes a second invoice on the same contract scope-empty until new actualizations arrive."
    constants: {}
    precision: "whole cents; round_half_up applied PER LINE, then integer summation; total_due_cents floored at 0"

  - name: attrition_shortfall
    trigger: "POST /housing/rebate-invoices (both variants stamped on the invoice)"
    algorithm: aggregation
    formula: |
      blocks = RoomBlock rows with contract_id == this.contract_id
               AND status IN {OPEN, RESTRICTED, RELEASED, SETTLED}
      for each b in blocks:
          contracted_nights(b) = b.block_size_rooms * ((departure_date - arrival_date) in whole days)
          threshold_nights(b)  = ceil(contracted_nights(b) * HotelContract.attrition_threshold_pct)
          actual_nights(b)     = b.actualized_room_nights

      # VARIANT A — per_block_attrition (BILLED):
      attrition_shortfall_room_nights_per_block =
          sum over b in blocks of max(0, threshold_nights(b) - actual_nights(b))

      # VARIANT B — contract_aggregate_attrition (REPORTED ONLY):
      attrition_shortfall_room_nights_aggregate =
          max(0, sum over b of threshold_nights(b) - sum over b of actual_nights(b))
    input_set: "Every RoomBlock of the contract in any of the four statuses; blocks with zero actualized nights still carry their full threshold."
    constants: {}
    precision: "integer room nights; ceil applied to each block's threshold before any comparison or summation"
    variants:
      - name: per_block_attrition
        when: "Drives attrition_penalty_cents and therefore total_due_cents on every RebateInvoice."
        difference: "Clamps each block at zero independently, so a block that over-performs cannot offset a block that under-performs."
      - name: contract_aggregate_attrition
        when: "Stored on the invoice as attrition_shortfall_room_nights_aggregate for dispute review; never billed."
        difference: "Clamps once over the contract totals, letting over-performance offset under-performance. Two blocks with thresholds 10 and 10 and actuals 12 and 3 give variant A = 7 and variant B = 5 from identical inputs."

  - name: revenue_share_split
    trigger: "POST /housing/revenue-distributions"
    algorithm: waterfall_allocation
    formula: |
      # STEP ORDER IS PINNED. The dependency looks circular — the admin fee tier is a
      # function of an amount, and distributable_cents is that amount minus the fee — so
      # the tier key is fixed to gross_collected_cents, NOT to distributable_cents.
      # Keying the tier on distributable_cents is WRONG.
      step 1: gross_collected_cents = RebateInvoice.collected_cents at this instant
      step 2: admin_fee_pct = 0.08   if gross_collected_cents <  ADMIN_TIER_1_MAX_CENTS
                            = 0.06   if ADMIN_TIER_1_MAX_CENTS <= gross_collected_cents < ADMIN_TIER_2_MAX_CENTS
                            = 0.045  if gross_collected_cents >= ADMIN_TIER_2_MAX_CENTS
      step 3: admin_fee_cents = round_half_up(gross_collected_cents * admin_fee_pct)
      step 4: distributable_cents = gross_collected_cents - admin_fee_cents
      step 5: waterfall in the pinned bucket order organizer -> rights_holder -> destination,
              each bucket floor-allocated from distributable_cents:
                organizer_base     = floor(distributable_cents * Tournament.share_pct_organizer)
                rights_holder_cents = floor(distributable_cents * Tournament.share_pct_rights_holder)
                destination_cents   = floor(distributable_cents * Tournament.share_pct_destination)
      step 6: rounding_remainder_cents = distributable_cents
                                         - organizer_base - rights_holder_cents - destination_cents
              organizer_cents = organizer_base + rounding_remainder_cents
              # The entire remainder goes to the organizer bucket. It is never split,
              # never assigned by bucket size, and never assigned by any random field.
      invariant: organizer_cents + rights_holder_cents + destination_cents == distributable_cents
    input_set: "The single source RebateInvoice's collected_cents snapshot plus the three share percentages of the referenced Tournament."
    constants:
      ADMIN_TIER_1_MAX_CENTS: 50000
      ADMIN_TIER_2_MAX_CENTS: 200000
      ADMIN_TIER_1_PCT: 0.08
      ADMIN_TIER_2_PCT: 0.06
      ADMIN_TIER_3_PCT: 0.045
    precision: "whole cents; round_half_up for the admin fee, floor for each share bucket, remainder to organizer"

  - name: complaint_remedy_credit
    trigger: "POST /housing/complaints/{id}/adjudicate with outcome == UPHOLD"
    algorithm: weighted_scoring
    formula: |
      b = the Booking referenced by affected_booking_id, or null
      uncredited_penalty = 0 if b is null else max(0, b.penalty_cents - b.penalty_credit_cents)
      if remedy_type == NONE:
          remedy_credit_cents = 0
      elif remedy_type == FEE_WAIVER:
          # nested clamp over three inputs: the requested amount, the penalty already
          # charged, and the credit already granted on the same booking
          remedy_credit_cents = min(remedy_amount_cents, uncredited_penalty)
      elif remedy_type == RATE_ADJUSTMENT:
          remedy_credit_cents = min(
              round_half_up(b.projected_room_nights
                            * HotelContract.negotiated_nightly_rate_cents
                            * RATE_ADJUSTMENT_PCT),
              uncredited_penalty)
      else:  # POLICY_EXEMPTION
          remedy_credit_cents = 0
    input_set: "The complaint's own remedy_type and remedy_amount_cents; the affected Booking's penalty_cents, penalty_credit_cents and projected_room_nights; and negotiated_nightly_rate_cents of the contract owning that booking's room block. A complaint with affected_booking_id null always credits 0."
    constants:
      RATE_ADJUSTMENT_PCT: 0.10
    precision: "whole cents, round_half_up before the clamp; the clamp floor is 0 so a fully credited booking yields 0"

  - name: invariant_room_inventory_conservation
    trigger: "system: asserted after every RoomBlock recompute (booking create, confirm, cancel, release)"
    algorithm: constraint_propagation
    formula: |
      # CONSERVED QUANTITY 1: physical room count held in a block.
      while status IN {OPEN, RESTRICTED}:
          rooms_committed + rooms_available == block_size_rooms
          and rooms_released_unsold == 0
      while status IN {RELEASED, SETTLED}:
          rooms_committed + rooms_released_unsold == block_size_rooms
          and rooms_available == 0
      # A confirm (forward) followed by its compensating cancel MUST restore
      # rooms_committed, rooms_available and utilization_pct to their pre-confirm values.
    input_set: "The block's own four room counters plus the Booking rows feeding calculations.block_rooms_committed."
    constants: {}
    precision: "integer rooms, exact — no drift permitted across a forward/compensating pair"

  - name: invariant_rebate_ledger_conservation
    trigger: "system: asserted after every RebateInvoice remit and lifecycle action"
    algorithm: constraint_propagation
    formula: |
      # CONSERVED QUANTITY 2: cents claimed on a rebate invoice.
      collected_cents + written_off_cents + outstanding_cents == total_due_cents
      and collected_cents >= 0 and written_off_cents >= 0 and outstanding_cents >= 0
      # A partial remit (forward) followed by its compensating WRITE_OFF MUST leave
      # total_due_cents unchanged and drive outstanding_cents to exactly 0 with the
      # abandoned cents parked in written_off_cents.
    input_set: "The invoice's own four money counters; total_due_cents is frozen at creation and never re-derived by remit or lifecycle actions."
    constants: {}
    precision: "whole cents, exact — no drift permitted across a forward/compensating pair"

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority; lowest number wins)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID request headers are both present and non-empty"
    error_id: ERR_MISSING_AUTH_HEADERS
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "X-User-Role is one of {HousingManager, ExceptionReviewer, TeamManager, HotelRepresentative, RightsHolder}"
    error_id: ERR_UNKNOWN_ROLE
    http_status: 401
    applies_to: all

  - priority: 3
    category: auth
    check: "the acting role appears in the endpoint's roles list in section 1.5"
    error_id: ERR_ROLE_NOT_PERMITTED
    http_status: 403
    applies_to: all

  - priority: 4
    category: auth
    check: "for entity_backed roles, X-User-ID equals the id of an existing row of the backing entity (TeamManager -> Team, HotelRepresentative -> Hotel)"
    error_id: ERR_ACTOR_IDENTITY_UNKNOWN
    http_status: 403
    applies_to: "every endpoint whose roles include TeamManager or HotelRepresentative"

  - priority: 5
    category: existence
    check: "each path-templated resource exists, validated left to right; the error_id is chosen by resource type from {ERR_TOURNAMENT_NOT_FOUND, ERR_CONTRACT_NOT_FOUND, ERR_ROOM_BLOCK_NOT_FOUND, ERR_REGISTRATION_NOT_FOUND, ERR_BOOKING_NOT_FOUND, ERR_EXCEPTION_REQUEST_NOT_FOUND, ERR_COMPLAINT_NOT_FOUND, ERR_INVOICE_NOT_FOUND, ERR_DISTRIBUTION_NOT_FOUND}"
    error_id: ERR_BOOKING_NOT_FOUND
    http_status: 404
    applies_to: "every endpoint with a path-templated id"

  - priority: 6
    category: existence
    check: "each foreign key supplied in the request body resolves to an existing row; the error_id is chosen by referenced type from {ERR_TOURNAMENT_NOT_FOUND, ERR_HOTEL_NOT_FOUND, ERR_TEAM_NOT_FOUND, ERR_CONTRACT_NOT_FOUND, ERR_ROOM_BLOCK_NOT_FOUND, ERR_REGISTRATION_NOT_FOUND, ERR_BOOKING_NOT_FOUND, ERR_EXCEPTION_REQUEST_NOT_FOUND, ERR_INVOICE_NOT_FOUND}"
    error_id: ERR_ROOM_BLOCK_NOT_FOUND
    http_status: 404
    applies_to: "POST /housing/hotel-contracts, POST /housing/room-blocks, POST /housing/team-registrations, POST /housing/bookings, POST /housing/exception-requests, POST /housing/complaints, POST /housing/rebate-invoices, POST /housing/revenue-distributions"

  - priority: 7
    category: business_referential
    check: "when the actor is TeamManager, X-User-ID equals TeamRegistration.team_id of the registration the target resource belongs to"
    error_id: ERR_TEAM_SCOPE_VIOLATION
    http_status: 403
    applies_to: "POST /housing/team-registrations, POST /housing/bookings, POST /housing/bookings/{id}/rooming-list, POST /housing/bookings/{id}/cancel, POST /housing/exception-requests, POST /housing/exception-requests/{id}/team-action, POST /housing/complaints"

  - priority: 8
    category: business_referential
    check: "when the actor is HotelRepresentative, X-User-ID equals HotelContract.hotel_id of the contract the target resource belongs to"
    error_id: ERR_HOTEL_SCOPE_VIOLATION
    http_status: 403
    applies_to: "POST /housing/hotel-contracts/{id}/negotiation, POST /housing/bookings/{id}/actualizations, POST /housing/rebate-invoices/{id}/lifecycle, POST /housing/rebate-invoices/{id}/remit"

  - priority: 10
    category: business_constraint
    check: "request body conforms to the endpoint's input schema: required fields present, no unknown fields, enum members valid, integers non-negative where declared, dates ISO 8601, limit in [1,100], offset >= 0"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all

  - priority: 12
    category: business_constraint
    check: "on multi-action endpoints the requested action is permitted for the acting role: action == SUBMIT requires HousingManager and action IN {COUNTERSIGN, REVISE} requires HotelRepresentative on /negotiation; action == ISSUE and action == WRITE_OFF require HousingManager and action == DISPUTE requires HotelRepresentative on /lifecycle; action == APPROVE requires RightsHolder and action == PAY requires HousingManager on /advance"
    error_id: ERR_ACTION_ROLE_MISMATCH
    http_status: 403
    applies_to: "POST /housing/hotel-contracts/{id}/negotiation, POST /housing/rebate-invoices/{id}/lifecycle, POST /housing/revenue-distributions/{id}/advance"

  - priority: 15
    category: business_constraint
    check: "expected_registration_version equals the current TeamRegistration.version of registration_id (concurrency_rules.booking-create-stale-registration)"
    error_id: ERR_STALE_REGISTRATION_VERSION
    http_status: 412
    applies_to: "POST /housing/bookings"

  - priority: 16
    category: business_constraint
    check: "expected_invoice_version equals the current RebateInvoice.version of source_invoice_id (concurrency_rules.distribution-create-stale-invoice)"
    error_id: ERR_STALE_INVOICE_VERSION
    http_status: 412
    applies_to: "POST /housing/revenue-distributions"

  - priority: 20
    category: state
    check: "the target entity's current state appears as a from: state of the requested transition in section 1.2"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "every state-changing endpoint"

  - priority: 21
    category: state
    check: "Tournament.posture == OPEN"
    error_id: ERR_TOURNAMENT_NOT_OPEN
    http_status: 409
    applies_to: "POST /housing/hotel-contracts, POST /housing/hotel-contracts/{id}/negotiation, POST /housing/room-blocks, POST /housing/team-registrations, POST /housing/bookings, POST /housing/bookings/{id}/rooming-list, POST /housing/bookings/{id}/confirm, POST /housing/exception-requests, POST /housing/exception-requests/{id}/review with action IN {START_REVIEW, APPROVE}, POST /housing/exception-requests/{id}/team-action"

  - priority: 22
    category: state
    check: "Tournament.posture IN {BOOKING_CLOSED, RECONCILING}"
    error_id: ERR_TOURNAMENT_NOT_RECONCILING
    http_status: 409
    applies_to: "POST /housing/bookings/{id}/actualizations, POST /housing/rebate-invoices"

  - priority: 23
    category: state
    check: "HotelContract.status == EXECUTED"
    error_id: ERR_CONTRACT_NOT_EXECUTED
    http_status: 409
    applies_to: "POST /housing/room-blocks/{id}/release, POST /housing/rebate-invoices, POST /housing/bookings, POST /housing/bookings/{id}/confirm"

  - priority: 24
    category: state
    check: "RoomBlock.status IN {OPEN, RESTRICTED}"
    error_id: ERR_BLOCK_NOT_BOOKABLE
    http_status: 409
    applies_to: "POST /housing/bookings, POST /housing/bookings/{id}/confirm"

  - priority: 25
    category: state
    check: "Booking.booking_status == CONFIRMED for the first report, or == CHECKED_OUT for a subsequent report"
    error_id: ERR_BOOKING_NOT_CONFIRMED
    http_status: 409
    applies_to: "POST /housing/bookings/{id}/actualizations"

  - priority: 26
    category: state
    check: "RebateInvoice.status IN {PARTIALLY_PAID, PAID}"
    error_id: ERR_INVOICE_NOT_COLLECTED
    http_status: 409
    applies_to: "POST /housing/revenue-distributions"

  - priority: 27
    category: state
    check: "ExceptionRequest.appeal_count < MAX_EXCEPTION_APPEALS (1) when action == APPEAL"
    error_id: ERR_APPEAL_LIMIT_REACHED
    http_status: 409
    applies_to: "POST /housing/exception-requests/{id}/team-action"

  - priority: 30
    category: business_safety
    check: "every rooming list entry with minor_occupant_count >= 1 supplies a non-empty chaperone_name"
    error_id: ERR_CHAPERONE_REQUIRED
    http_status: 422
    applies_to: "POST /housing/bookings/{id}/rooming-list"

  - priority: 32
    category: business_safety
    check: "every rooming list entry has occupant_count <= MAX_OCCUPANTS_PER_ROOM (4) and minor_occupant_count <= occupant_count"
    error_id: ERR_ROOM_OCCUPANCY_EXCEEDED
    http_status: 422
    applies_to: "POST /housing/bookings/{id}/rooming-list"

  - priority: 34
    category: business_safety
    check: "segregation of duties: when ExceptionRequest.appeal_count >= 1, X-User-ID differs from ExceptionRequest.decided_by_user_id"
    error_id: ERR_SOD_SAME_REVIEWER
    http_status: 403
    applies_to: "POST /housing/exception-requests/{id}/review with action IN {APPROVE, DENY}"

  - priority: 35
    category: business_safety
    check: "segregation of duties: when Complaint.cited_exception_request_id is non-null, X-User-ID differs from that ExceptionRequest.decided_by_user_id"
    error_id: ERR_SOD_ADJUDICATOR_CONFLICT
    http_status: 403
    applies_to: "POST /housing/complaints/{id}/adjudicate"

  - priority: 36
    category: business_safety
    check: "segregation of duties: no Complaint with the same tournament_id, category == REBATE_TRANSPARENCY and status == UPHELD has adjudicated_by_user_id == X-User-ID"
    error_id: ERR_SOD_DISTRIBUTION_APPROVER_CONFLICT
    http_status: 403
    applies_to: "POST /housing/revenue-distributions/{id}/advance with action == APPROVE"

  - priority: 40
    category: business_temporal
    check: "logical now <= Tournament.booking_deadline"
    error_id: ERR_BOOKING_DEADLINE_PASSED
    http_status: 422
    applies_to: "POST /housing/bookings"

  - priority: 42
    category: business_temporal
    check: "the later date of a supplied pair is strictly after the earlier one: end_date > start_date, departure_date > arrival_date, check_out_date > check_in_date"
    error_id: ERR_INVALID_DATE_RANGE
    http_status: 422
    applies_to: "POST /housing/tournaments, POST /housing/room-blocks, POST /housing/bookings"

  - priority: 44
    category: business_temporal
    check: "check_in_date >= RoomBlock.arrival_date and check_out_date <= RoomBlock.departure_date"
    error_id: ERR_STAY_OUTSIDE_BLOCK_WINDOW
    http_status: 422
    applies_to: "POST /housing/bookings"

  - priority: 46
    category: business_temporal
    check: "arrival_date >= (Tournament.start_date - BLOCK_WINDOW_PAD_DAYS days) and departure_date <= (Tournament.end_date + BLOCK_WINDOW_PAD_DAYS days), with BLOCK_WINDOW_PAD_DAYS = 2"
    error_id: ERR_BLOCK_OUTSIDE_EVENT_WINDOW
    http_status: 422
    applies_to: "POST /housing/room-blocks"

  - priority: 48
    category: business_temporal
    check: "logical now >= RoomBlock.release_deadline"
    error_id: ERR_RELEASE_BEFORE_DEADLINE
    http_status: 422
    applies_to: "POST /housing/room-blocks/{id}/release"

  - priority: 49
    category: business_temporal
    check: "release_deadline >= HotelContract.cutoff_date"
    error_id: ERR_RELEASE_DEADLINE_BEFORE_CUTOFF
    http_status: 422
    applies_to: "POST /housing/room-blocks"

  - priority: 55
    category: business_constraint
    check: |
      TEAM EXCLUSIVITY OVERLAP — CLOSED interval semantics, adjacency FORBIDDEN.
      No other Booking exists whose registration's team_id equals this registration's team_id,
      whose room_block_id differs from this room_block_id, whose booking_status IN
      {DRAFT, ROOMING_LIST_SUBMITTED, CONFIRMED, CHECKED_OUT}, and whose CLOSED interval
      [check_in_date, check_out_date] intersects the new booking's CLOSED interval
      [check_in_date, check_out_date]. Because both endpoints are inclusive, a stay ending
      2026-09-12 collides with a stay starting 2026-09-12 — a team cannot be checked in at
      two properties on the same calendar day.
    error_id: ERR_TEAM_STAY_OVERLAP
    http_status: 409
    applies_to: "POST /housing/bookings"

  - priority: 58
    category: business_constraint
    check: |
      HOTEL AGGREGATE NIGHT CAPACITY — HALF-OPEN interval semantics, adjacency ALLOWED,
      capacity checked as a per-night SUM rather than as exclusive occupation.
      For every night n in the half-open range [arrival_date, departure_date) of the new
      block: (sum of block_size_rooms over RoomBlock rows whose contract's hotel_id equals
      this contract's hotel_id, with status IN {OPEN, RESTRICTED}, and whose half-open range
      [arrival_date, departure_date) contains n) + the new block_size_rooms <= Hotel.total_rooms.
      A block departing 2026-09-13 and a block arriving 2026-09-13 share no night and never collide.
    error_id: ERR_HOTEL_NIGHT_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /housing/room-blocks"

  - priority: 60
    category: business_constraint
    check: "the submitted entries' room_index values form the contiguous sequence 1..Booking.rooms_requested with no duplicates and no gaps"
    error_id: ERR_ROOMING_LIST_INDEX_INVALID
    http_status: 422
    applies_to: "POST /housing/bookings/{id}/rooming-list"

  - priority: 62
    category: business_referential
    check: "the number of submitted entries equals Booking.rooms_requested"
    error_id: ERR_ROOMING_LIST_ROOM_COUNT_MISMATCH
    http_status: 422
    applies_to: "POST /housing/bookings/{id}/rooming-list"

  - priority: 64
    category: business_referential
    check: "sum of occupant_count across the submitted entries is >= 1 and <= (TeamRegistration.roster_player_count + TeamRegistration.roster_staff_count)"
    error_id: ERR_ROOMING_LIST_OCCUPANT_MISMATCH
    http_status: 422
    applies_to: "POST /housing/bookings/{id}/rooming-list"

  - priority: 68
    category: business_constraint
    check: "when RoomBlock.status == RESTRICTED, the referenced TeamRegistration.status == PENDING_HOUSING; a restricted block admits only teams that are not yet housed"
    error_id: ERR_BLOCK_RESTRICTED_TO_UNHOUSED_TEAMS
    http_status: 409
    applies_to: "POST /housing/bookings"

  - priority: 70
    category: business_constraint
    check: "when supersedes_booking_id is supplied, the referenced Booking has the same registration_id and booking_status IN {DRAFT, ROOMING_LIST_SUBMITTED, CONFIRMED}"
    error_id: ERR_SUPERSEDE_TARGET_INVALID
    http_status: 422
    applies_to: "POST /housing/bookings"

  - priority: 72
    category: business_constraint
    check: "rebate model field coherence: rebate_model == PER_ROOM_NIGHT_FLAT requires rebate_flat_cents_per_room_night >= 1 and forbids rebate_percent; rebate_model == PERCENT_OF_ROOM_REVENUE requires 0 < rebate_percent <= 1 and forbids rebate_flat_cents_per_room_night; rebate_model == TIERED_PER_ROOM_NIGHT forbids both"
    error_id: ERR_REBATE_MODEL_FIELDS_INVALID
    http_status: 422
    applies_to: "POST /housing/hotel-contracts"

  - priority: 74
    category: business_constraint
    check: "share_pct_organizer + share_pct_rights_holder + share_pct_destination == 1.00 exactly"
    error_id: ERR_REVENUE_SHARE_NOT_UNITY
    http_status: 422
    applies_to: "POST /housing/tournaments"

  - priority: 76
    category: business_constraint
    check: "period_label is unique among RebateInvoice rows with the same contract_id"
    error_id: ERR_DUPLICATE_INVOICE_PERIOD
    http_status: 409
    applies_to: "POST /housing/rebate-invoices"

  - priority: 78
    category: business_constraint
    check: "reason_code == LOCAL_TEAM requires TeamRegistration.local_team_flag == true"
    error_id: ERR_LOCAL_EXEMPTION_NOT_ELIGIBLE
    http_status: 422
    applies_to: "POST /housing/exception-requests"

  - priority: 79
    category: business_constraint
    check: "reason_code == FAMILY_MEDICAL requires requested_rooms_exempt <= 1"
    error_id: ERR_EXEMPTION_SCOPE_TOO_BROAD
    http_status: 422
    applies_to: "POST /housing/exception-requests"

  - priority: 80
    category: business_constraint
    check: "requested_rooms_exempt <= TeamRegistration.minimum_rooms_for_compliance"
    error_id: ERR_EXEMPTION_EXCEEDS_REQUIREMENT
    http_status: 422
    applies_to: "POST /housing/exception-requests"

  - priority: 81
    category: business_constraint
    check: "no other ExceptionRequest with the same registration_id has status IN {SUBMITTED, UNDER_REVIEW, INFO_REQUESTED, APPROVED}"
    error_id: ERR_DUPLICATE_OPEN_EXCEPTION
    http_status: 409
    applies_to: "POST /housing/exception-requests"

  - priority: 82
    category: business_constraint
    check: "when action == APPROVE, approved_rooms_exempt is supplied and 1 <= approved_rooms_exempt <= requested_rooms_exempt"
    error_id: ERR_APPROVED_EXEMPTION_OUT_OF_RANGE
    http_status: 422
    applies_to: "POST /housing/exception-requests/{id}/review"

  - priority: 83
    category: business_constraint
    check: "when action == APPROVE and reason_code == LOCAL_TEAM, approved_rooms_exempt == requested_rooms_exempt (local exemptions are all-or-nothing)"
    error_id: ERR_PARTIAL_LOCAL_EXEMPTION_FORBIDDEN
    http_status: 422
    applies_to: "POST /housing/exception-requests/{id}/review"

  - priority: 84
    category: business_fiscal
    check: "rooms_requested <= TeamRegistration.required_rooms_registered (the segregated-occupancy variant, NOT minimum_rooms_for_compliance)"
    error_id: ERR_ROOMS_EXCEED_ROSTER_REQUIREMENT
    http_status: 422
    applies_to: "POST /housing/bookings"

  - priority: 86
    category: business_fiscal
    check: "for every night n in the half-open range [check_in_date, check_out_date), the block's existing occupancy_held(n) per calculations.block_rooms_committed plus rooms_requested <= RoomBlock.block_size_rooms. occupancy_held counts DRAFT and ROOMING_LIST_SUBMITTED bookings as well as CONFIRMED and CHECKED_OUT ones, so a block cannot be oversold at creation time even though rooms_committed only moves at confirm"
    error_id: ERR_BLOCK_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /housing/bookings"

  - priority: 88
    category: business_fiscal
    check: "1 <= amount_cents <= RebateInvoice.outstanding_cents"
    error_id: ERR_REMITTANCE_EXCEEDS_OUTSTANDING
    http_status: 422
    applies_to: "POST /housing/rebate-invoices/{id}/remit"

  - priority: 90
    category: business_fiscal
    check: "the invoice scope per calculations.rebate_invoice_amount contains at least one Booking and invoiced_room_nights >= 1"
    error_id: ERR_NO_BILLABLE_ROOM_NIGHTS
    http_status: 422
    applies_to: "POST /housing/rebate-invoices"

  - priority: 92
    category: business_fiscal
    check: "total_due_cents >= 1 when action == ISSUE"
    error_id: ERR_INVOICE_TOTAL_NOT_POSITIVE
    http_status: 422
    applies_to: "POST /housing/rebate-invoices/{id}/lifecycle"

  - priority: 94
    category: business_fiscal
    check: "remedy_type == FEE_WAIVER requires remedy_amount_cents >= 1 and a non-null affected_booking_id on the complaint; remedy_type IN {NONE, RATE_ADJUSTMENT, POLICY_EXEMPTION} forbids remedy_amount_cents"
    error_id: ERR_REMEDY_FIELDS_INVALID
    http_status: 422
    applies_to: "POST /housing/complaints/{id}/adjudicate"

  - priority: 95
    category: business_constraint
    check: "remedy_type belongs to the branch's remedy vocabulary: route == INVESTIGATE allows {NONE, FEE_WAIVER}; route == ESCALATE allows {NONE, FEE_WAIVER, RATE_ADJUSTMENT, POLICY_EXEMPTION}"
    error_id: ERR_REMEDY_NOT_AVAILABLE_ON_ROUTE
    http_status: 422
    applies_to: "POST /housing/complaints/{id}/adjudicate"

  - priority: 96
    category: business_constraint
    check: "at least one of registration_id, cited_exception_request_id, affected_booking_id is supplied"
    error_id: ERR_COMPLAINT_SUBJECT_MISSING
    http_status: 422
    applies_to: "POST /housing/complaints"

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Tournament ------------------------------------------------------------
  - method: POST
    path: /housing/tournaments
    description: "Create a tournament with its revenue-share split, event window and booking deadline. posture starts at OPEN and housing_pressure at NORMAL."
    roles: [HousingManager]
    code: 201
    input: ["name", "rights_holder_org", "destination_org", "start_date", "end_date", "booking_deadline", "share_pct_organizer", "share_pct_rights_holder", "share_pct_destination", "stay_to_play_required?"]
    output: Tournament
    side_effects:
      - "computes night_count per calculations.tournament_night_count"
      - "initializes executed_contract_count = 0 and sold_out_contract_count = 0"

  - method: GET
    path: /housing/tournaments/{id}
    description: "Read one tournament, including posture, housing_pressure and the derived contract counters."
    roles: [HousingManager, ExceptionReviewer, TeamManager, HotelRepresentative, RightsHolder]
    code: 200
    output: Tournament

  - method: POST
    path: /housing/tournaments/{id}/close-booking
    description: "Close the housing window (OPEN -> BOOKING_CLOSED). Fires CASCADE-CLOSE."
    roles: [HousingManager]
    code: 200
    output: Tournament
    side_effects:
      - "CASCADE-CLOSE depth 3: every TeamRegistration with status == PENDING_HOUSING becomes NON_COMPLIANT; every ExceptionRequest of those registrations with status IN {SUBMITTED, UNDER_REVIEW, INFO_REQUESTED} becomes DENIED; each touched registration is then re-evaluated per calculations.registration_compliance_status"
      - "increments the version of every TeamRegistration and ExceptionRequest it mutates by 1"

  # --- Hotel -----------------------------------------------------------------
  - method: POST
    path: /housing/hotels
    description: "Register a property in the official housing program with its physical room inventory."
    roles: [HousingManager]
    code: 201
    input: ["name", "city", "total_rooms", "distance_miles_from_venue"]
    output: Hotel

  # --- Team ------------------------------------------------------------------
  - method: POST
    path: /housing/teams
    description: "Register a participating team and its home geography (used to derive local_team_flag at registration time)."
    roles: [HousingManager]
    code: 201
    input: ["name", "home_city", "home_state", "org_contact_email", "distance_miles_from_venue"]
    output: Team

  # --- HotelContract ---------------------------------------------------------
  - method: POST
    path: /housing/hotel-contracts
    description: "Draft a host-hotel contract with negotiated nightly rate, rebate structure and attrition terms. status starts at DRAFT, block_posture at AVAILABLE."
    roles: [HousingManager]
    code: 201
    input: ["tournament_id", "hotel_id", "negotiated_nightly_rate_cents", "rebate_model", "attrition_threshold_pct", "attrition_penalty_rate_cents_per_room_night", "cutoff_date", "rebate_flat_cents_per_room_night?", "rebate_percent?"]
    output: HotelContract
    side_effects:
      - "initializes revision_round = 0, contracted_room_nights = 0, countersigned_by_hotel_id = null"

  - method: POST
    path: /housing/hotel-contracts/{id}/negotiation
    description: "Advance the contract negotiation. action == SUBMIT (HousingManager) moves DRAFT -> NEGOTIATING; action == COUNTERSIGN (HotelRepresentative) moves NEGOTIATING -> EXECUTED; action == REVISE (HotelRepresentative) moves NEGOTIATING -> DRAFT and increments revision_round."
    roles: [HousingManager, HotelRepresentative]
    code: 200
    input: ["action"]
    output: HotelContract
    side_effects:
      - "on COUNTERSIGN sets countersigned_by_hotel_id = X-User-ID and increments Tournament.executed_contract_count by 1"
      - "on REVISE increments revision_round by 1 (cycle back to DRAFT)"

  - method: GET
    path: /housing/hotel-contracts/{id}
    description: "Read one hotel contract with its rebate terms, revision_round and block_posture."
    roles: [HousingManager, HotelRepresentative, RightsHolder, TeamManager]
    code: 200
    output: HotelContract

  - method: GET
    path: /housing/hotel-contracts
    description: "List hotel contracts, filterable by tournament_id, hotel_id and status."
    roles: [HousingManager, HotelRepresentative, RightsHolder, TeamManager]
    code: 200
    input: ["tournament_id?", "hotel_id?", "status?", "limit?", "offset?"]
    output: HotelContract[]

  - method: GET
    path: /housing/hotel-contracts/{id}/room-blocks
    description: "List the room blocks held under one contract (reverse lookup for RoomBlock.contract_id)."
    roles: [HousingManager, HotelRepresentative, RightsHolder, TeamManager]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: RoomBlock[]

  # --- RoomBlock -------------------------------------------------------------
  - method: POST
    path: /housing/room-blocks
    description: "Hold a room block of one room_type under an executed or negotiating contract. status starts at OPEN."
    roles: [HousingManager]
    code: 201
    input: ["contract_id", "room_type", "block_size_rooms", "arrival_date", "departure_date", "release_deadline"]
    output: RoomBlock
    side_effects:
      - "initializes rooms_committed = 0, rooms_available = block_size_rooms, rooms_released_unsold = 0, utilization_pct = 0, actualized_room_nights = 0"
      - "computes threshold_room_nights per calculations.attrition_shortfall constants and adds block_size_rooms * nights to HotelContract.contracted_room_nights"

  - method: POST
    path: /housing/room-blocks/{id}/release
    description: "Release the unsold remainder of a block back to the hotel at or after release_deadline (OPEN|RESTRICTED -> RELEASED)."
    roles: [HousingManager]
    code: 200
    output: RoomBlock
    side_effects:
      - "sets rooms_released_unsold = block_size_rooms - rooms_committed and rooms_available = 0"
      - "recomputes HotelContract.block_posture per calculations.contract_block_posture and Tournament.housing_pressure per calculations.tournament_housing_pressure"
      - "preserves invariants.room_inventory_conservation"

  # --- TeamRegistration ------------------------------------------------------
  - method: POST
    path: /housing/team-registrations
    description: "Register a team for a tournament and derive its roster-based room requirement under both occupancy variants. status starts at PENDING_HOUSING."
    roles: [HousingManager, TeamManager]
    code: 201
    input: ["tournament_id", "team_id", "roster_player_count", "roster_staff_count"]
    output: TeamRegistration
    side_effects:
      - "computes required_rooms_registered and minimum_rooms_for_compliance per calculations.roster_room_requirement (both variants)"
      - "computes required_room_nights = required_rooms_registered * Tournament.night_count"
      - "derives local_team_flag = (Team.distance_miles_from_venue <= LOCAL_TEAM_RADIUS_MILES)"
      - "initializes exempt_rooms_granted = 0, effective_required_rooms = minimum_rooms_for_compliance, committed_rooms = 0"

  - method: GET
    path: /housing/team-registrations/{id}
    description: "Read one registration with its dual room requirements, exemptions and compliance status."
    roles: [HousingManager, TeamManager, ExceptionReviewer]
    code: 200
    output: TeamRegistration

  - method: GET
    path: /housing/team-registrations
    description: "List registrations, filterable by tournament_id, team_id and status."
    roles: [HousingManager, TeamManager, ExceptionReviewer]
    code: 200
    input: ["tournament_id?", "team_id?", "status?", "limit?", "offset?"]
    output: TeamRegistration[]

  - method: GET
    path: /housing/team-registrations/{id}/exception-requests
    description: "List the stay-to-play exception requests filed against one registration (reverse lookup for ExceptionRequest.registration_id)."
    roles: [HousingManager, ExceptionReviewer, TeamManager]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: ExceptionRequest[]

  # --- Booking ---------------------------------------------------------------
  - method: POST
    path: /housing/bookings
    description: "Book rooms inside a block for a registration. Requires expected_registration_version, which must equal the registration's current version (optimistic concurrency). booking_status starts at DRAFT and rebate_status at NOT_DUE."
    roles: [HousingManager, TeamManager]
    code: 201
    input: ["registration_id", "room_block_id", "rooms_requested", "check_in_date", "check_out_date", "expected_registration_version", "supersedes_booking_id?"]
    output: Booking
    side_effects:
      - "increments TeamRegistration.version by 1"
      - "computes nights = check_out_date - check_in_date and projected_room_nights = rooms_requested * nights"
      - "initializes actualized_room_nights = 0, rebate_accrued_cents = 0, penalty_cents = 0, penalty_room_nights = 0, penalty_credit_cents = 0"
      - "when supersedes_booking_id is supplied, moves the superseded Booking to CANCELLED with cancellation_reason = SUPERSEDED and applies calculations.cancellation_penalty to it"

  - method: GET
    path: /housing/bookings/{id}
    description: "Read one booking with its projected and actualized room nights, rebate accrual and penalties."
    roles: [HousingManager, TeamManager, HotelRepresentative]
    code: 200
    output: Booking

  - method: GET
    path: /housing/bookings
    description: "List bookings, filterable by registration_id, room_block_id, supersedes_booking_id, booking_status and rebate_status."
    roles: [HousingManager, TeamManager, HotelRepresentative]
    code: 200
    input: ["registration_id?", "room_block_id?", "supersedes_booking_id?", "booking_status?", "rebate_status?", "limit?", "offset?"]
    output: Booking[]

  - method: POST
    path: /housing/bookings/{id}/rooming-list
    description: "Submit the rooming list for a booking (DRAFT -> ROOMING_LIST_SUBMITTED). entries is an array of { room_index, occupant_count, minor_occupant_count, chaperone_name? } objects; a re-submission from ROOMING_LIST_SUBMITTED replaces the prior entries and stays in ROOMING_LIST_SUBMITTED."
    roles: [HousingManager, TeamManager]
    code: 200
    input: ["entries"]
    output: Booking
    side_effects:
      - "replaces all RoomingListEntry rows for the booking"

  - method: GET
    path: /housing/bookings/{id}/rooming-list
    description: "List the rooming list entries of one booking (reverse lookup for RoomingListEntry.booking_id)."
    roles: [HousingManager, TeamManager, HotelRepresentative]
    code: 200
    input: ["limit?", "offset?"]
    output: RoomingListEntry[]

  - method: POST
    path: /housing/bookings/{id}/confirm
    description: "Confirm a booking against the hotel (ROOMING_LIST_SUBMITTED -> CONFIRMED). Fires CASCADE-CONFIRM."
    roles: [HousingManager]
    code: 200
    output: Booking
    side_effects:
      - "CASCADE-CONFIRM depth 4: recomputes TeamRegistration.committed_rooms and status per calculations.registration_compliance_status; recomputes RoomBlock.rooms_committed / rooms_available / utilization_pct and its OPEN -> RESTRICTED posture per calculations.block_utilization_posture; recomputes HotelContract.block_posture per calculations.contract_block_posture; recomputes Tournament.housing_pressure per calculations.tournament_housing_pressure"
      - "increments the version of TeamRegistration, RoomBlock, HotelContract and Tournament when their fields change"

  - method: POST
    path: /housing/bookings/{id}/cancel
    description: "Cancel a booking before check-out and assess the deadline-tier penalty (DRAFT|ROOMING_LIST_SUBMITTED|CONFIRMED -> CANCELLED)."
    roles: [HousingManager, TeamManager]
    code: 200
    input: ["cancellation_reason"]
    output: Booking
    side_effects:
      - "computes penalty_room_nights and penalty_cents per calculations.cancellation_penalty and sets cancelled_at = logical now"
      - "releases the held rooms back to the block and recomputes the CASCADE-CONFIRM chain downward from RoomBlock"

  - method: POST
    path: /housing/bookings/{id}/actualizations
    description: "Hotel reports the room nights actually consumed by a booking. The first accepted report moves the booking CONFIRMED -> CHECKED_OUT; later reports restate the figure."
    roles: [HotelRepresentative]
    code: 201
    input: ["reported_room_nights", "report_note?"]
    output: ActualizationReport
    side_effects:
      - "assigns sequence_no = 1 + count of prior ActualizationReport rows for the booking"
      - "sets Booking.actualized_room_nights = reported_room_nights and rebate_status NOT_DUE -> ACCRUED with rebate_accrued_cents per calculations.booking_rebate_line"
      - "adds the delta to RoomBlock.actualized_room_nights"

  - method: GET
    path: /housing/bookings/{id}/actualization-reports
    description: "List the actualization reports filed against one booking in sequence_no order (reverse lookup for ActualizationReport.booking_id)."
    roles: [HousingManager, HotelRepresentative, RightsHolder]
    code: 200
    input: ["limit?", "offset?"]
    output: ActualizationReport[]

  # --- ExceptionRequest ------------------------------------------------------
  - method: POST
    path: /housing/exception-requests
    description: "File a stay-to-play exception request against a registration. status starts at SUBMITTED."
    roles: [HousingManager, TeamManager]
    code: 201
    input: ["registration_id", "reason_code", "requested_rooms_exempt", "justification"]
    output: ExceptionRequest
    side_effects:
      - "initializes review_round = 0, appeal_count = 0, approved_rooms_exempt = 0, decided_by_user_id = null"

  - method: GET
    path: /housing/exception-requests/{id}
    description: "Read one exception request with its review round, appeal count and decision."
    roles: [HousingManager, ExceptionReviewer, TeamManager]
    code: 200
    output: ExceptionRequest

  - method: POST
    path: /housing/exception-requests/{id}/review
    description: "Reviewer action on an exception request. action == START_REVIEW moves SUBMITTED -> UNDER_REVIEW; action == REQUEST_INFO moves UNDER_REVIEW -> INFO_REQUESTED and increments review_round; action == APPROVE moves UNDER_REVIEW -> APPROVED; action == DENY moves UNDER_REVIEW -> DENIED."
    roles: [ExceptionReviewer]
    code: 200
    input: ["action", "approved_rooms_exempt?", "decision_note?"]
    output: ExceptionRequest
    side_effects:
      - "on APPROVE or DENY sets decided_by_user_id = X-User-ID"
      - "on APPROVE adds approved_rooms_exempt to TeamRegistration.exempt_rooms_granted, recomputes effective_required_rooms and re-evaluates status per calculations.registration_compliance_status"
      - "increments TeamRegistration.version by 1 when it mutates the registration"

  - method: POST
    path: /housing/exception-requests/{id}/team-action
    description: "Team-side action on its own exception request. action == RESUBMIT moves INFO_REQUESTED -> UNDER_REVIEW; action == APPEAL moves DENIED -> UNDER_REVIEW and increments appeal_count (capped at MAX_EXCEPTION_APPEALS = 1)."
    roles: [TeamManager]
    code: 200
    input: ["action", "justification?"]
    output: ExceptionRequest
    side_effects:
      - "on APPEAL increments appeal_count by 1, arming the segregation-of-duties check at validations priority 34"

  # --- Complaint -------------------------------------------------------------
  - method: POST
    path: /housing/complaints
    description: "File a complaint about housing pricing or policy fairness. status starts at FILED."
    roles: [HousingManager, TeamManager]
    code: 201
    input: ["tournament_id", "category", "narrative", "registration_id?", "cited_exception_request_id?", "affected_booking_id?"]
    output: Complaint
    side_effects:
      - "initializes route = null, remedy_type = NONE, remedy_amount_cents = 0, remedy_credit_cents = 0"

  - method: GET
    path: /housing/complaints/{id}
    description: "Read one complaint with its route, remedy and adjudication trail."
    roles: [HousingManager, RightsHolder, TeamManager]
    code: 200
    output: Complaint

  - method: GET
    path: /housing/complaints
    description: "List complaints, filterable by tournament_id, registration_id, cited_exception_request_id, affected_booking_id, category and status."
    roles: [HousingManager, RightsHolder, TeamManager]
    code: 200
    input: ["tournament_id?", "registration_id?", "cited_exception_request_id?", "affected_booking_id?", "category?", "status?", "limit?", "offset?"]
    output: Complaint[]

  - method: POST
    path: /housing/complaints/{id}/triage
    description: "Triage a filed complaint onto one of two branches (FILED -> INVESTIGATING when route == INVESTIGATE, FILED -> ESCALATED when route == ESCALATE). The branch chosen narrows the remedy vocabulary available at adjudication."
    roles: [HousingManager]
    code: 200
    input: ["route"]
    output: Complaint
    side_effects:
      - "sets route and triaged_by_user_id = X-User-ID"

  - method: POST
    path: /housing/complaints/{id}/adjudicate
    description: "Adjudicate a triaged complaint (INVESTIGATING|ESCALATED -> UPHELD when outcome == UPHOLD, -> DISMISSED when outcome == DISMISS). Fires CASCADE-REMEDY when remedy_type == POLICY_EXEMPTION."
    roles: [RightsHolder]
    code: 200
    input: ["outcome", "remedy_type", "remedy_amount_cents?"]
    output: Complaint
    side_effects:
      - "sets adjudicated_by_user_id = X-User-ID and computes remedy_credit_cents per calculations.complaint_remedy_credit"
      - "on UPHELD with remedy_type == FEE_WAIVER credits the affected Booking's penalty_credit_cents"
      - "CASCADE-REMEDY depth 3: on UPHELD with remedy_type == POLICY_EXEMPTION, the cited ExceptionRequest moves DENIED -> APPROVED with approved_rooms_exempt = requested_rooms_exempt, the registration's exempt_rooms_granted and effective_required_rooms are recomputed, and its status moves NON_COMPLIANT -> EXCEPTION_GRANTED per calculations.registration_compliance_status"

  # --- RebateInvoice ---------------------------------------------------------
  - method: POST
    path: /housing/rebate-invoices
    description: "Raise the rebate invoice for one contract period against actualized room nights, netting the attrition penalty. status starts at DRAFT."
    roles: [HousingManager]
    code: 201
    input: ["contract_id", "period_label"]
    output: RebateInvoice
    side_effects:
      - "computes invoiced_room_nights and invoiced_rebate_cents per calculations.rebate_invoice_amount (round per line then sum)"
      - "computes attrition_shortfall_room_nights_per_block and attrition_shortfall_room_nights_aggregate per calculations.attrition_shortfall (both variants) and bills the per-block variant as attrition_penalty_cents"
      - "sets total_due_cents, outstanding_cents = total_due_cents, collected_cents = 0, written_off_cents = 0, distributed_cents = 0"
      - "moves in-scope Bookings' rebate_status ACCRUED -> INVOICED"

  - method: GET
    path: /housing/rebate-invoices/{id}
    description: "Read one rebate invoice with both attrition shortfall variants, the amount due and the collection ledger."
    roles: [HousingManager, HotelRepresentative, RightsHolder]
    code: 200
    output: RebateInvoice

  - method: GET
    path: /housing/rebate-invoices
    description: "List rebate invoices, filterable by contract_id and status."
    roles: [HousingManager, HotelRepresentative, RightsHolder]
    code: 200
    input: ["contract_id?", "status?", "limit?", "offset?"]
    output: RebateInvoice[]

  - method: POST
    path: /housing/rebate-invoices/{id}/lifecycle
    description: "Non-payment lifecycle moves. action == ISSUE (HousingManager) moves DRAFT -> ISSUED; action == DISPUTE (HotelRepresentative) moves ISSUED|PARTIALLY_PAID -> DISPUTED; action == WRITE_OFF (HousingManager) moves DISPUTED -> WRITTEN_OFF."
    roles: [HousingManager, HotelRepresentative]
    code: 200
    input: ["action", "dispute_note?"]
    output: RebateInvoice
    side_effects:
      - "on WRITE_OFF sets written_off_cents = outstanding_cents, outstanding_cents = 0 and moves in-scope Bookings' rebate_status to WRITTEN_OFF, preserving invariants.rebate_ledger_conservation"

  - method: POST
    path: /housing/rebate-invoices/{id}/remit
    description: "Hotel remits against the invoice (ISSUED|PARTIALLY_PAID|DISPUTED -> PARTIALLY_PAID when a balance remains, -> PAID when it clears). Fires CASCADE-REMIT on full payment."
    roles: [HotelRepresentative]
    code: 200
    input: ["amount_cents"]
    output: RebateInvoice
    side_effects:
      - "adds amount_cents to collected_cents and subtracts it from outstanding_cents, preserving invariants.rebate_ledger_conservation"
      - "CASCADE-REMIT depth 4 on reaching PAID: in-scope Bookings' rebate_status INVOICED -> COLLECTED (or SHORT_PAID when the line was under-collected); every RELEASED RoomBlock of the contract -> SETTLED; the HotelContract EXECUTED -> CLOSED; the Tournament RECONCILING -> SETTLED once every contract is CLOSED"

  # --- RevenueDistribution ---------------------------------------------------
  - method: POST
    path: /housing/revenue-distributions
    description: "Split collected rebate revenue between event organizer, rights holder and destination. Requires expected_invoice_version, which must equal the source invoice's current version (optimistic concurrency). status starts at CALCULATED."
    roles: [HousingManager]
    code: 201
    input: ["tournament_id", "source_invoice_id", "expected_invoice_version"]
    output: RevenueDistribution
    side_effects:
      - "increments RebateInvoice.version by 1"
      - "computes admin_fee_pct, admin_fee_cents, distributable_cents, organizer_cents, rights_holder_cents, destination_cents and rounding_remainder_cents per calculations.revenue_share_split"
      - "adds distributable_cents to RebateInvoice.distributed_cents"

  - method: GET
    path: /housing/revenue-distributions/{id}
    description: "Read one revenue distribution with the admin fee, the three party shares and the rounding remainder."
    roles: [HousingManager, RightsHolder]
    code: 200
    output: RevenueDistribution

  - method: GET
    path: /housing/revenue-distributions
    description: "List revenue distributions, filterable by tournament_id, source_invoice_id and status."
    roles: [HousingManager, RightsHolder]
    code: 200
    input: ["tournament_id?", "source_invoice_id?", "status?", "limit?", "offset?"]
    output: RevenueDistribution[]

  - method: POST
    path: /housing/revenue-distributions/{id}/advance
    description: "Advance a distribution. action == APPROVE (RightsHolder) moves CALCULATED -> APPROVED; action == PAY (HousingManager) moves APPROVED -> PAID."
    roles: [HousingManager, RightsHolder]
    code: 200
    input: ["action"]
    output: RevenueDistribution
    side_effects:
      - "on APPROVE sets approved_by_user_id = X-User-ID after the segregation-of-duties check at validations priority 36"

  # --- Test-driving endpoint -------------------------------------------------
  - method: POST
    path: /_clock/set_current_utc
    description: "Set the server's logical UTC clock, which every deadline, cutoff and penalty-tier rule reads as 'now'. The startup default is exactly 2026-08-01T00:00:00Z; before any call to this endpoint the logical clock reads that default and never falls back to real wall-clock time."
    roles: [HousingManager]
    code: 200
    input: ["to_iso8601"]
    output: { current_utc: string }

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  # --- auth ------------------------------------------------------------------
  - id: ERR_MISSING_AUTH_HEADERS
    http: 401
    condition: "X-User-Role or X-User-ID header absent or empty (validations priority 1)"
  - id: ERR_UNKNOWN_ROLE
    http: 401
    condition: "X-User-Role is not one of the five roles declared in section 1.7 (validations priority 2)"
  - id: ERR_ROLE_NOT_PERMITTED
    http: 403
    condition: "the acting role is not in the endpoint's roles list (validations priority 3)"
  - id: ERR_ACTOR_IDENTITY_UNKNOWN
    http: 403
    condition: "an entity_backed role presents an X-User-ID that matches no row of its backing entity (validations priority 4)"
  - id: ERR_TEAM_SCOPE_VIOLATION
    http: 403
    condition: "a TeamManager acts on a resource belonging to a registration whose team_id differs from X-User-ID (validations priority 7)"
  - id: ERR_HOTEL_SCOPE_VIOLATION
    http: 403
    condition: "a HotelRepresentative acts on a resource belonging to a contract whose hotel_id differs from X-User-ID (validations priority 8)"
  - id: ERR_ACTION_ROLE_MISMATCH
    http: 403
    condition: "the requested action on a multi-action endpoint is not the acting role's action (validations priority 12)"

  # --- existence -------------------------------------------------------------
  - id: ERR_TOURNAMENT_NOT_FOUND
    http: 404
    condition: "no Tournament matches the supplied path or body id"
  - id: ERR_HOTEL_NOT_FOUND
    http: 404
    condition: "no Hotel matches the supplied hotel_id"
  - id: ERR_TEAM_NOT_FOUND
    http: 404
    condition: "no Team matches the supplied team_id"
  - id: ERR_CONTRACT_NOT_FOUND
    http: 404
    condition: "no HotelContract matches the supplied path or body id"
  - id: ERR_ROOM_BLOCK_NOT_FOUND
    http: 404
    condition: "no RoomBlock matches the supplied path or body id"
  - id: ERR_REGISTRATION_NOT_FOUND
    http: 404
    condition: "no TeamRegistration matches the supplied path or body id"
  - id: ERR_BOOKING_NOT_FOUND
    http: 404
    condition: "no Booking matches the supplied path or body id"
  - id: ERR_EXCEPTION_REQUEST_NOT_FOUND
    http: 404
    condition: "no ExceptionRequest matches the supplied path or body id"
  - id: ERR_COMPLAINT_NOT_FOUND
    http: 404
    condition: "no Complaint matches the supplied path id"
  - id: ERR_INVOICE_NOT_FOUND
    http: 404
    condition: "no RebateInvoice matches the supplied path or body id"
  - id: ERR_DISTRIBUTION_NOT_FOUND
    http: 404
    condition: "no RevenueDistribution matches the supplied path id"

  # --- schema ----------------------------------------------------------------
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "missing required field, unknown field, bad type, invalid enum member, negative count, malformed date, or limit/offset out of range (validations priority 10)"

  # --- concurrency -----------------------------------------------------------
  - id: ERR_STALE_REGISTRATION_VERSION
    http: 412
    condition: "expected_registration_version does not equal TeamRegistration.version (validations priority 15)"
  - id: ERR_STALE_INVOICE_VERSION
    http: 412
    condition: "expected_invoice_version does not equal RebateInvoice.version (validations priority 16)"

  # --- state -----------------------------------------------------------------
  - id: ERR_INVALID_STATE
    http: 409
    condition: "the requested transition is not declared from the entity's current state, including a repeat of an already-applied trigger (validations priority 20)"
  - id: ERR_TOURNAMENT_NOT_OPEN
    http: 409
    condition: "the operation requires Tournament.posture == OPEN (validations priority 21)"
  - id: ERR_TOURNAMENT_NOT_RECONCILING
    http: 409
    condition: "the operation requires Tournament.posture IN {BOOKING_CLOSED, RECONCILING} (validations priority 22)"
  - id: ERR_CONTRACT_NOT_EXECUTED
    http: 409
    condition: "the operation requires HotelContract.status == EXECUTED (validations priority 23)"
  - id: ERR_BLOCK_NOT_BOOKABLE
    http: 409
    condition: "the RoomBlock is RELEASED or SETTLED and no longer accepts bookings (validations priority 24)"
  - id: ERR_BOOKING_NOT_CONFIRMED
    http: 409
    condition: "an actualization report was filed against a booking that is neither CONFIRMED nor CHECKED_OUT (validations priority 25)"
  - id: ERR_INVOICE_NOT_COLLECTED
    http: 409
    condition: "a revenue distribution was requested from an invoice that is not PARTIALLY_PAID or PAID (validations priority 26)"
  - id: ERR_APPEAL_LIMIT_REACHED
    http: 409
    condition: "a second appeal was filed against an exception request whose appeal_count already equals MAX_EXCEPTION_APPEALS (validations priority 27)"

  # --- safety / segregation of duties ---------------------------------------
  - id: ERR_CHAPERONE_REQUIRED
    http: 422
    condition: "a rooming list entry lodges at least one minor without naming a chaperone (validations priority 30)"
  - id: ERR_ROOM_OCCUPANCY_EXCEEDED
    http: 422
    condition: "a rooming list entry exceeds MAX_OCCUPANTS_PER_ROOM or reports more minors than occupants (validations priority 32)"
  - id: ERR_SOD_SAME_REVIEWER
    http: 403
    condition: "the reviewer who decided an exception request attempted to decide its appeal (validations priority 34)"
  - id: ERR_SOD_ADJUDICATOR_CONFLICT
    http: 403
    condition: "the adjudicator of a complaint is the same user who decided the exception request the complaint cites (validations priority 35)"
  - id: ERR_SOD_DISTRIBUTION_APPROVER_CONFLICT
    http: 403
    condition: "the approver of a revenue distribution previously upheld a REBATE_TRANSPARENCY complaint on the same tournament (validations priority 36)"

  # --- temporal --------------------------------------------------------------
  - id: ERR_BOOKING_DEADLINE_PASSED
    http: 422
    condition: "logical now is after Tournament.booking_deadline (validations priority 40)"
  - id: ERR_INVALID_DATE_RANGE
    http: 422
    condition: "the end of a supplied date pair is not strictly after its start (validations priority 42)"
  - id: ERR_STAY_OUTSIDE_BLOCK_WINDOW
    http: 422
    condition: "the requested stay falls outside the block's arrival/departure window (validations priority 44)"
  - id: ERR_BLOCK_OUTSIDE_EVENT_WINDOW
    http: 422
    condition: "the block window falls outside the event window padded by BLOCK_WINDOW_PAD_DAYS (validations priority 46)"
  - id: ERR_RELEASE_BEFORE_DEADLINE
    http: 422
    condition: "a block release was attempted before its release_deadline (validations priority 48)"
  - id: ERR_RELEASE_DEADLINE_BEFORE_CUTOFF
    http: 422
    condition: "release_deadline precedes the contract's cutoff_date (validations priority 49)"

  # --- overlap ---------------------------------------------------------------
  - id: ERR_TEAM_STAY_OVERLAP
    http: 409
    condition: "the team already has a live booking at another block whose CLOSED stay interval touches the requested one (validations priority 55)"
  - id: ERR_HOTEL_NIGHT_CAPACITY_EXCEEDED
    http: 409
    condition: "the property's held blocks would exceed Hotel.total_rooms on at least one night of the new block's HALF-OPEN window (validations priority 58)"

  # --- rooming list ----------------------------------------------------------
  - id: ERR_ROOMING_LIST_INDEX_INVALID
    http: 422
    condition: "room_index values are not the contiguous sequence 1..rooms_requested (validations priority 60)"
  - id: ERR_ROOMING_LIST_ROOM_COUNT_MISMATCH
    http: 422
    condition: "the entry count does not equal Booking.rooms_requested (validations priority 62)"
  - id: ERR_ROOMING_LIST_OCCUPANT_MISMATCH
    http: 422
    condition: "total occupants is zero or exceeds the registered roster head count (validations priority 64)"

  # --- housing policy --------------------------------------------------------
  - id: ERR_BLOCK_RESTRICTED_TO_UNHOUSED_TEAMS
    http: 409
    condition: "a RESTRICTED block was booked by a team that is already housed (validations priority 68)"
  - id: ERR_SUPERSEDE_TARGET_INVALID
    http: 422
    condition: "supersedes_booking_id points at a booking of another registration or one that is already terminal (validations priority 70)"
  - id: ERR_REBATE_MODEL_FIELDS_INVALID
    http: 422
    condition: "the rebate parameter fields do not match the declared rebate_model (validations priority 72)"
  - id: ERR_REVENUE_SHARE_NOT_UNITY
    http: 422
    condition: "the three revenue-share percentages do not sum to 1.00 (validations priority 74)"
  - id: ERR_DUPLICATE_INVOICE_PERIOD
    http: 409
    condition: "an invoice already exists for that contract and period_label (validations priority 76)"
  - id: ERR_LOCAL_EXEMPTION_NOT_ELIGIBLE
    http: 422
    condition: "a LOCAL_TEAM exemption was requested by a team that is not local (validations priority 78)"
  - id: ERR_EXEMPTION_SCOPE_TOO_BROAD
    http: 422
    condition: "a FAMILY_MEDICAL exemption asked for more than one room (validations priority 79)"
  - id: ERR_EXEMPTION_EXCEEDS_REQUIREMENT
    http: 422
    condition: "requested_rooms_exempt exceeds the registration's minimum_rooms_for_compliance (validations priority 80)"
  - id: ERR_DUPLICATE_OPEN_EXCEPTION
    http: 409
    condition: "the registration already has an open or approved exception request (validations priority 81)"
  - id: ERR_APPROVED_EXEMPTION_OUT_OF_RANGE
    http: 422
    condition: "approved_rooms_exempt is missing, zero, or larger than requested_rooms_exempt (validations priority 82)"
  - id: ERR_PARTIAL_LOCAL_EXEMPTION_FORBIDDEN
    http: 422
    condition: "a LOCAL_TEAM exemption was partially approved (validations priority 83)"
  - id: ERR_ROOMS_EXCEED_ROSTER_REQUIREMENT
    http: 422
    condition: "rooms_requested exceeds required_rooms_registered (validations priority 84)"
  - id: ERR_BLOCK_CAPACITY_EXCEEDED
    http: 409
    condition: "the booking would push the block past block_size_rooms on at least one night (validations priority 86)"

  # --- fiscal ----------------------------------------------------------------
  - id: ERR_REMITTANCE_EXCEEDS_OUTSTANDING
    http: 422
    condition: "the remitted amount is zero or larger than outstanding_cents (validations priority 88)"
  - id: ERR_NO_BILLABLE_ROOM_NIGHTS
    http: 422
    condition: "the invoice scope contains no actualized room nights (validations priority 90)"
  - id: ERR_INVOICE_TOTAL_NOT_POSITIVE
    http: 422
    condition: "an invoice whose attrition penalty fully offsets the rebate was issued (validations priority 92)"
  - id: ERR_REMEDY_FIELDS_INVALID
    http: 422
    condition: "the remedy amount and the complaint's affected booking do not match the chosen remedy_type (validations priority 94)"
  - id: ERR_REMEDY_NOT_AVAILABLE_ON_ROUTE
    http: 422
    condition: "the remedy_type is outside the triage branch's remedy vocabulary (validations priority 95)"
  - id: ERR_COMPLAINT_SUBJECT_MISSING
    http: 422
    condition: "the complaint cites no registration, exception request or booking (validations priority 96)"

# =============================================================================
# 1.7 RBAC Matrix  (role_model: segregation_of_duties)
# =============================================================================
roles:
  - name: HousingManager
    description: "The amateur sports event housing manager who runs the official housing program: contracts hotels, holds and releases blocks, triages complaints, invoices rebates and pays out the revenue split."
    identity: "opaque"
    exclusive_operations:
      - "POST /housing/tournaments"
      - "POST /housing/tournaments/{id}/close-booking"
      - "POST /housing/hotels"
      - "POST /housing/teams"
      - "POST /housing/hotel-contracts"
      - "POST /housing/hotel-contracts/{id}/negotiation with action == SUBMIT"
      - "POST /housing/room-blocks"
      - "POST /housing/room-blocks/{id}/release"
      - "POST /housing/bookings/{id}/confirm"
      - "POST /housing/complaints/{id}/triage"
      - "POST /housing/rebate-invoices"
      - "POST /housing/rebate-invoices/{id}/lifecycle with action IN {ISSUE, WRITE_OFF}"
      - "POST /housing/revenue-distributions"
      - "POST /housing/revenue-distributions/{id}/advance with action == PAY"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "POST /housing/team-registrations (with TeamManager)"
      - "POST /housing/bookings (with TeamManager)"
      - "POST /housing/bookings/{id}/rooming-list (with TeamManager)"
      - "POST /housing/bookings/{id}/cancel (with TeamManager)"
      - "POST /housing/exception-requests (with TeamManager)"
      - "all GET endpoints"

  - name: ExceptionReviewer
    description: "Independent reviewer of stay-to-play exception requests. Holds the only decision authority over exemptions, and under segregation_of_duties may not decide an appeal of a request it already decided."
    identity: "opaque"
    exclusive_operations:
      - "POST /housing/exception-requests/{id}/review"
    shared_operations:
      - "GET /housing/tournaments/{id}"
      - "GET /housing/team-registrations/{id}"
      - "GET /housing/team-registrations"
      - "GET /housing/team-registrations/{id}/exception-requests"
      - "GET /housing/exception-requests/{id}"

  - name: RightsHolder
    description: "The event rights holder, who adjudicates fairness complaints and approves the organizer / rights-holder / destination revenue split. Under segregation_of_duties it may not approve a distribution on a tournament where it upheld a REBATE_TRANSPARENCY complaint."
    identity: "opaque"
    exclusive_operations:
      - "POST /housing/complaints/{id}/adjudicate"
      - "POST /housing/revenue-distributions/{id}/advance with action == APPROVE"
    shared_operations:
      - "GET /housing/tournaments/{id}"
      - "GET /housing/hotel-contracts/{id}"
      - "GET /housing/hotel-contracts"
      - "GET /housing/hotel-contracts/{id}/room-blocks"
      - "GET /housing/bookings/{id}/actualization-reports"
      - "GET /housing/complaints/{id}"
      - "GET /housing/complaints"
      - "GET /housing/rebate-invoices/{id}"
      - "GET /housing/rebate-invoices"
      - "GET /housing/revenue-distributions/{id}"
      - "GET /housing/revenue-distributions"

  - name: TeamManager
    description: "Manager of a participating team. X-User-ID is the Team.id, and every write is scoped to registrations whose team_id equals it."
    identity: "entity_backed:Team"
    exclusive_operations:
      - "POST /housing/exception-requests/{id}/team-action"
    shared_operations:
      - "POST /housing/team-registrations (with HousingManager)"
      - "POST /housing/bookings (with HousingManager)"
      - "POST /housing/bookings/{id}/rooming-list (with HousingManager)"
      - "POST /housing/bookings/{id}/cancel (with HousingManager)"
      - "POST /housing/exception-requests (with HousingManager)"
      - "POST /housing/complaints (with HousingManager)"
      - "GET /housing/tournaments/{id}"
      - "GET /housing/hotel-contracts/{id}"
      - "GET /housing/hotel-contracts"
      - "GET /housing/hotel-contracts/{id}/room-blocks"
      - "GET /housing/team-registrations/{id}"
      - "GET /housing/team-registrations"
      - "GET /housing/team-registrations/{id}/exception-requests"
      - "GET /housing/exception-requests/{id}"
      - "GET /housing/bookings/{id}"
      - "GET /housing/bookings"
      - "GET /housing/bookings/{id}/rooming-list"
      - "GET /housing/complaints/{id}"
      - "GET /housing/complaints"

  - name: HotelRepresentative
    description: "Representative of a host hotel. X-User-ID is the Hotel.id; it countersigns or revises its own contracts, reports actualized room nights and remits or disputes rebate invoices."
    identity: "entity_backed:Hotel"
    exclusive_operations:
      - "POST /housing/hotel-contracts/{id}/negotiation with action IN {COUNTERSIGN, REVISE}"
      - "POST /housing/bookings/{id}/actualizations"
      - "POST /housing/rebate-invoices/{id}/lifecycle with action == DISPUTE"
      - "POST /housing/rebate-invoices/{id}/remit"
    shared_operations:
      - "GET /housing/tournaments/{id}"
      - "GET /housing/hotel-contracts/{id}"
      - "GET /housing/hotel-contracts"
      - "GET /housing/hotel-contracts/{id}/room-blocks"
      - "GET /housing/bookings/{id}"
      - "GET /housing/bookings"
      - "GET /housing/bookings/{id}/rooming-list"
      - "GET /housing/bookings/{id}/actualization-reports"
      - "GET /housing/rebate-invoices/{id}"
      - "GET /housing/rebate-invoices"
