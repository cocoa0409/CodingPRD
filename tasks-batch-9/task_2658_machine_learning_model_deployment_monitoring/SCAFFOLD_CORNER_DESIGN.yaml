          difficulty_instance: transitive_cascade / dataset_revoke_cascade_depth_four
          rationale: "The named §1.8 instance walks the four-level revocation chain end-to-end and asserts every hop plus the no-op tail, and its sibling drift_report_critical_cascade_depth_five covers the five-level drift chain including ordering sensitivity."

      - name: cascading_side_effects_are_order_sensitive_and_partial_failure_safe
        claim_type: cascading_side_effects
        grounds:
          - complexity_profile.complexity_layers
          - state_machines.DriftReport.COMPUTED_to_BREACHED
          - calculations.retraining_urgency
        excluded_because:
          difficulty_instance: transitive_cascade / drift_report_critical_cascade_depth_five
          rationale: "Ordering sensitivity is exactly what the named §1.8 instance pins: the urgency it asserts is only reachable if the drift severity is written before the trigger is minted and the model's open-trigger counter is recomputed after it."

      - name: dual_variant_calculation_delta_on_switch_is_correct
        claim_type: dual_variant_calculation
        grounds:
          - complexity_profile.complexity_layers
