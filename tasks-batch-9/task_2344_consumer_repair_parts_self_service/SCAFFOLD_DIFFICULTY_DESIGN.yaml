        distinguishing_aspect: |
          PAIR B pits category business_state (priority 62) against category
          resource_capacity (priority 140) on POST /training-certifications — a different
          error-category pair and a different endpoint from PAIR A — and the response must be
          ERR_PROVIDER_NOT_ACCEPTING_CERTS with HTTP 409.
        test_recipe:
          setup:
            - "Region profile US-CA exists."
            - "RepairProvider Cascade Devices has technician_count 4 (required_cert_count 1) and was granted exactly 2 training credits."
            - "One certification for u_tech_1 consumed both credits, so training_credit_balance is 0 and validation 140's condition holds."
