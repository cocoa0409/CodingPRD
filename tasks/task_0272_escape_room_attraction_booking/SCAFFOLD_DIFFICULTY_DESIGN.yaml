              captures: { slotB: $.data.id, slotB_v: $.data.version }
            - call: "POST /customers"
              payload: { email: "c15@x.com", full_name: "C Fifteen" }
              as: Customer
              captures: { cust: $.data.id }
            - call: "POST /bookings"
              payload: { time_slot_id: "${slotA}", customer_id: "${cust}", group_size: 2, expected_time_slot_version: "${slotA_v}", is_private: false }
              as: Customer
              as_user_id: "${cust}"
              captures: { bkA: $.data.id, bkA_v: $.data.version }
            - call: "POST /bookings/${bkA}/confirm"
              payload: { expected_booking_version: "${bkA_v}" }
              as: Customer
              as_user_id: "${cust}"
          trigger:
            - call: "POST /bookings"
              payload: { time_slot_id: "${slotB}", customer_id: "${cust}", group_size: 2, expected_time_slot_version: "${slotB_v}", is_private: false }
              as: Customer
              as_user_id: "${cust}"
              captures: { err: $.data.error_id }
          assert:
            - "response_type == error"
            - "data.error_id == ERR_SLOT_OVERLAP"

      - name: gamemaster_window_overlap_excludes_buffer
        grounds:
          - validations[priority=12]
          - calculations.gamemaster_load
          - entities.TimeSlot.fields.game_end_utc
          - errors[ERR_NO_GAMEMASTER_AVAILABLE]
        distinguishing_aspect: |
          Game-master interval semantics differ from same-room: staff occupation is the GAME window
          [start,game_end) only (buffer EXCLUDED) and crosses rooms. With one GM busy on Room1 [14:00,15:00),
          a Room2 grab at 14:30 (overlaps the game window) with no other GM yields ERR_NO_GAMEMASTER_AVAILABLE.
        test_recipe:
          setup:
            - "Venue open all day; ONE GM. Room1 and Room2 (game=60 buffer=30)."
            - "Room1 slot 14:00 BOOKED (GM busy game window [14:00,15:00)). Room2 slot 14:30 OPEN (overlaps GM game window, different room so same-room rule not triggered)."
          setup_api_calls:
            - call: "POST /venues"
              payload: { name: "ER Ov2", timezone: "UTC", open_minute_of_day: 0, close_minute_of_day: 1440, no_show_fee_pct: 0.5, no_show_strike_limit: 3 }
              as: PlatformAdmin
              captures: { ven: $.data.id }
            - call: "POST /rooms"
              payload: { venue_id: "${ven}", name: "Room1", min_group_size: 1, max_group_size: 8, base_price_cents: 2000, game_minutes: 60, min_age: 0, waiver_required: false, private_surcharge_cents: 0, reset_buffer_minutes: 30 }
              as: VenueManager
              captures: { room1: $.data.id }
            - call: "POST /rooms"
              payload: { venue_id: "${ven}", name: "Room2", min_group_size: 1, max_group_size: 8, base_price_cents: 2000, game_minutes: 60, min_age: 0, waiver_required: false, private_surcharge_cents: 0, reset_buffer_minutes: 30 }
              as: VenueManager
              captures: { room2: $.data.id }
            - call: "POST /game-masters"
              payload: { venue_id: "${ven}", full_name: "GM A" }
              as: VenueManager
              captures: { gm: $.data.id }
            - call: "POST /time-slots"
              payload: { room_id: "${room1}", start_utc: "2026-07-01T14:00:00Z" }
              as: VenueManager
              captures: { slot1: $.data.id, slot1_v: $.data.version }
            - call: "POST /time-slots"
              payload: { room_id: "${room2}", start_utc: "2026-07-01T14:30:00Z" }
              as: VenueManager
              captures: { slot2: $.data.id, slot2_v: $.data.version }
            - call: "POST /customers"
              payload: { email: "c16@x.com", full_name: "C Sixteen" }
              as: Customer
              captures: { cust: $.data.id }
            - call: "POST /bookings"
              payload: { time_slot_id: "${slot1}", customer_id: "${cust}", group_size: 2, expected_time_slot_version: "${slot1_v}", is_private: false }
              as: Customer
              as_user_id: "${cust}"
              captures: { bk1: $.data.id, bk1_v: $.data.version }
            - call: "POST /bookings/${bk1}/confirm"
              payload: { expected_booking_version: "${bk1_v}" }
              as: Customer
              as_user_id: "${cust}"
          trigger:
            - call: "POST /bookings"
              payload: { time_slot_id: "${slot2}", customer_id: "${cust}", group_size: 2, expected_time_slot_version: "${slot2_v}", is_private: false }
              as: Customer
              as_user_id: "${cust}"
              captures: { err: $.data.error_id }
          assert:
            - "response_type == error"
            - "data.error_id == ERR_NO_GAMEMASTER_AVAILABLE"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: cancel_restores_gift_card_balance_exactly
        grounds:
          - state_machines.Booking.lifecycle_status.DRAFT_to_CONFIRMED
          - state_machines.Booking.lifecycle_status.CONFIRMED_to_CANCELLED
          - calculations.gift_card_balance
          - entities.GiftCard.fields.balance_cents
        distinguishing_aspect: |
          Conserved quantity = GiftCard.balance_cents (= initial + sum(entries)). confirm appends SPEND -9600;
          cancel appends REFUND +9600; after the pair balance returns EXACTLY to the pre-confirm 50000 (no drift).
        test_recipe:
          setup:
            - "Venue open all day. Room base=2000, threshold=4, large_bps=12000 (off-peak so quote 4 * 2400 = 9600). GiftCard balance 50000 ACTIVE. CONFIRMED booking that spent 9600 from the card (balance 40400)."
          setup_api_calls:
            - call: "POST /venues"
              payload: { name: "ER Inv1", timezone: "UTC", open_minute_of_day: 0, close_minute_of_day: 1440, no_show_fee_pct: 0.5, no_show_strike_limit: 3 }
              as: PlatformAdmin
              captures: { ven: $.data.id }
            - call: "POST /rooms"
              payload: { venue_id: "${ven}", name: "Vault", min_group_size: 1, max_group_size: 8, base_price_cents: 2000, game_minutes: 60, min_age: 0, waiver_required: false, private_surcharge_cents: 0, reset_buffer_minutes: 30 }
              as: VenueManager
              captures: { room: $.data.id }
            - call: "POST /pricing-rules"
              payload: { venue_id: "${ven}", room_id: "${room}", peak_dow_mask: 0, peak_start_minute_of_day: 720, peak_end_minute_of_day: 1080, large_group_threshold: 4, peak_multiplier_bps: 10000, large_group_multiplier_bps: 12000 }
              as: VenueManager
            - call: "POST /game-masters"
              payload: { venue_id: "${ven}", full_name: "GM A" }
              as: VenueManager
              captures: { gm: $.data.id }
            - call: "POST /time-slots"
              payload: { room_id: "${room}", start_utc: "2026-07-01T09:00:00Z" }
              as: VenueManager
              captures: { slot: $.data.id, slot_v: $.data.version }
            - call: "POST /gift-cards"
              payload: { venue_id: "${ven}", code: "GC-INV", initial_balance_cents: 50000 }
              as: VenueManager
              captures: { gc: $.data.id }
            - call: "POST /customers"
              payload: { email: "c17@x.com", full_name: "C Seventeen" }
              as: Customer
              captures: { cust: $.data.id }
            - call: "POST /bookings"
              payload: { time_slot_id: "${slot}", customer_id: "${cust}", group_size: 4, expected_time_slot_version: "${slot_v}", is_private: false }
              as: Customer
              as_user_id: "${cust}"
              captures: { bk: $.data.id, bk_v: $.data.version }
            - call: "POST /bookings/${bk}/confirm"
              payload: { gift_card_id: "${gc}", expected_booking_version: "${bk_v}" }
              as: Customer
              as_user_id: "${cust}"
              captures: { bk_v2: $.data.version }
          trigger:
            - call: "POST /bookings/${bk}/cancel"
              payload: { expected_booking_version: "${bk_v2}" }
              as: Customer
              as_user_id: "${cust}"
            - call: "GET /gift-cards/${gc}"
              as: Customer
              as_user_id: "${cust}"
              captures: { gc_bal: $.data.balance_cents }
          assert:
            - "Booking.${bk}.gift_card_applied_cents == 0"
            - "Booking.${bk}.lifecycle_status == CANCELLED"
            - "Booking.${bk}.payment_status == REFUNDED"
            - "GiftCard.${gc}.balance_cents == 50000"
            - "GiftCard.${gc}.status == ACTIVE"

      - name: reschedule_conserves_gamemaster_assignment_count
        grounds:
          - state_machines.Booking.lifecycle_status.CONFIRMED_to_CONFIRMED
          - state_machines.TimeSlot.status.HELD_to_OPEN
          - calculations.gamemaster_load
          - entities.GameMaster.fields.active_assignment_count
        distinguishing_aspect: |
          Conserved quantity = total active_assignment_count across game masters. Reschedule frees the old slot
          (-1 on its GM) and grabs the new (+1 on the selected GM); with one GM the net stays 1 (no drift,
          no double-count). Distinct conserved quantity from the gift-card-cents invariant.
        test_recipe:
          setup:
            - "Venue open all day; Room canonical buffer=30 game=60; ONE GM; two non-overlapping OPEN slots (09:00, 12:00)."
            - "Booking CONFIRMED on the 09:00 slot; GM active_assignment_count == 1."
          setup_api_calls:
            - call: "POST /venues"
              payload: { name: "ER Inv2", timezone: "UTC", open_minute_of_day: 0, close_minute_of_day: 1440, no_show_fee_pct: 0.5, no_show_strike_limit: 3 }
              as: PlatformAdmin
              captures: { ven: $.data.id }
            - call: "POST /rooms"
              payload: { venue_id: "${ven}", name: "Vault", min_group_size: 1, max_group_size: 8, base_price_cents: 2000, game_minutes: 60, min_age: 0, waiver_required: false, private_surcharge_cents: 0, reset_buffer_minutes: 30 }
              as: VenueManager
              captures: { room: $.data.id }
            - call: "POST /game-masters"
              payload: { venue_id: "${ven}", full_name: "GM A" }
              as: VenueManager
              captures: { gm: $.data.id }
            - call: "POST /time-slots"
              payload: { room_id: "${room}", start_utc: "2026-07-01T09:00:00Z" }
              as: VenueManager
              captures: { slot1: $.data.id, slot1_v: $.data.version }
            - call: "POST /time-slots"
              payload: { room_id: "${room}", start_utc: "2026-07-01T12:00:00Z" }
              as: VenueManager
              captures: { slot2: $.data.id, slot2_v: $.data.version }
            - call: "POST /customers"
              payload: { email: "c18@x.com", full_name: "C Eighteen" }
              as: Customer
              captures: { cust: $.data.id }
            - call: "POST /bookings"
              payload: { time_slot_id: "${slot1}", customer_id: "${cust}", group_size: 2, expected_time_slot_version: "${slot1_v}", is_private: false }
              as: Customer
              as_user_id: "${cust}"
              captures: { bk: $.data.id, bk_v: $.data.version }
            - call: "POST /bookings/${bk}/confirm"
              payload: { expected_booking_version: "${bk_v}" }
              as: Customer
              as_user_id: "${cust}"
              captures: { bk_v2: $.data.version }
            - call: "GET /time-slots/${slot1}"
              as: Customer
              as_user_id: "${cust}"
              captures: { slot1_v_now: $.data.version }
          trigger:
            - call: "POST /bookings/${bk}/reschedule"
              payload: { new_time_slot_id: "${slot2}", expected_time_slot_version: "${slot1_v_now}", expected_booking_version: "${bk_v2}" }
              as: Customer
              as_user_id: "${cust}"
            - call: "GET /game-masters/${gm}"
              as: VenueManager
              captures: { gm_load: $.data.active_assignment_count }
          assert:
            - "GameMaster.${gm}.active_assignment_count == 1"
            - "TimeSlot.${slot1}.status == OPEN"
            - "TimeSlot.${slot2}.status == BOOKED"
