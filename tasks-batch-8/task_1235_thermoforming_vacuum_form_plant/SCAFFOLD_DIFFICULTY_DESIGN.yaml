          assert:
            - "hop1: ProductionOrder.${order_id}.schedule_status == COMPLETED (captured ${sched})"
            - "hop2: MaterialAllocation.${alloc_id}.status == CONSUMED (captured ${alloc_st})"
            - "hop3: MaterialLot.${lot_id}.status == DEPLETED with available_kg == 0.000 and consumed_kg == 5.900 (captured ${lot_st} / ${lot_av} / ${lot_con})"
            - "final_cost == 439.00 (captured ${fin}): 250.00 setup + 2 x 1.0h x 60.00 machine + 5.900 x 10.00 material + 10.00 tooling"
      - name: tool_revise_depth2_hold_review_cascade
        grounds:
          - state_machines.Tool.PRODUCTION_to_UNDER_REVISION
          - state_machines.ProductionOrder(schedule_status).RUNNING_to_ON_HOLD
          - state_machines.MaterialAllocation.RESERVED_to_REVIEW
        distinguishing_aspect: |
          Depth-2 cascade from a different trigger (POST /tools/{id}/revise):
          tool revision holds every STAGED/RUNNING order on that tool (hop 1:
          order -> ON_HOLD), and each held order's RESERVED allocations are
          pushed to REVIEW (hop 2) — a distinct propagation pattern from the
          run-completion cascade.
        test_recipe:
          setup:
            - "PRODUCTION tool TV; order O-V STAGED with one 5.900kg RESERVED virgin allocation"
          setup_api_calls:
            - { call: "POST /material-lots", payload: { lot_code: "LV", resin_type: PP, gauge_mm: 2.000, cleanliness_grade_required: INDUSTRIAL, quantity_kg: 10.000, unit_cost_per_kg: 7.00 }, as: MaterialsPlanner, captures: { lot_id: $.data.id } }
