  - section: calculations
    instances:
      - name: fee_tier_straddle_uncapped
        claim_type: correct_result
        grounds: [calculations.fiduciary_fee]

        distinguishing_aspect: "Tier arithmetic without the cap: v=90000, amount=20000 splits 10000 at 5% + 10000 at 3% = 800 exactly; cap headroom (20000-4500) does not bind."
        test_recipe:
          setup: ["ACTIVE client, account funded 200000, ACTIVE bond, APPROVED 2026-06 budget basis 500000 HOUSING; first disbursement 90000 released (fee 4500)"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-10T00:00:00Z" }, as: FiduciaryAdmin }
