          - validations[priority=9]
          - errors.ERR_INVALID_STATE_TRANSITION
        distinguishing_aspect: "activate is legal only from APPROVED: calling it on a program still in its initial MODELING state returns ERR_INVALID_STATE_TRANSITION (409), leaves the program MODELING with pinned_tariff_version_id null and Customer.active_program_type null, and does not consume the customer version."
        test_recipe:
          setup:
            - "Logical clock 2026-01-10T08:00:00Z; customer ACME; rate program RP1 created but never approved (status MODELING)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-10T08:00:00Z" }
              as: PricingAnalyst
            - call: "POST /ltl/customers"
              payload: { account_code: "ACME", name: "Acme Mfg" }
              as: PricingAnalyst
              captures: { cust1: "$.data.id", cust1_v: "$.data.version" }
            - call: "POST /ltl/rate-programs"
              payload: { customer_id: "${cust1}", program_type: "CLASS_BASED", base_rate_per_cwt_cents: 4200, discount_pct: 0.35, min_charge_cents: 12500 }
              as: PricingAnalyst
              captures: { rp1: "$.data.id" }
          trigger:
            - call: "POST /ltl/rate-programs/${rp1}/activate"
              payload: { expected_customer_version: "${cust1_v}" }
              as: PricingAnalyst
              captures: { err_state: "$.data.error_id" }
          assert:
            - "trigger returns 409 ERR_INVALID_STATE_TRANSITION"
            - "RateProgram.${rp1}.status == MODELING"
            - "RateProgram.${rp1}.pinned_tariff_version_id == null"
            - "RateProgram.${rp1}.effective_from == null"
            - "Customer.${cust1}.active_program_type == null"
            - "Customer.${cust1}.version == ${cust1_v}"

      - name: activating_second_program_retires_the_incumbent
