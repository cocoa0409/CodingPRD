    output: Retainer[]
    side_effects: []
  - method: POST
    path: "/retainers/{id}/activate"
    description: "DRAFT/SUSPENDED -> ACTIVE; grants cycle-0 credits, sets billing price; may bubble Client AUDITED -> ACTIVE"
    roles: [AgencyAdmin, AccountManager]
    code: 200
    input: []
    output: Retainer
    side_effects: ["credits_granted=monthly_credits; billing_price_cents computed; Client bubble-up"]
  - method: POST
    path: "/retainers/{id}/suspend"
    description: "ACTIVE -> SUSPENDED"
    roles: [AgencyAdmin, AccountManager]
    code: 200
    input: []
    output: Retainer
    side_effects: []
  - method: POST
    path: "/retainers/{id}/close"
    description: "ACTIVE/SUSPENDED/DRAFT -> CLOSED; cancels non-terminal deliverables"
    roles: [AgencyAdmin, AccountManager]
    code: 200
    input: []
    output: Retainer
    side_effects: ["non-terminal Deliverables -> CANCELLED releasing committed credits"]
  - method: POST
    path: "/retainers/{id}/rollover"
    description: "Advance billing cycle (OCC on Retainer.version); recomputes credits_granted with capped rollover"
    roles: [AgencyAdmin, AccountManager]
    code: 200
    input: [expected_retainer_version]
    output: Retainer
    side_effects: ["cycle_index+=1; credits_granted=monthly+capped_rollover; committed/consumed reset; increments Retainer.version by 1; Contract.cycles_elapsed bubble-up"]

