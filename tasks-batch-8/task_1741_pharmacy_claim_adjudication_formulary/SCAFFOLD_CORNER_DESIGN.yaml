scaffold_corner_design:
- section: entities
  instances:
  - name: plan_creation_defaults_and_missing_field_rejected
    claim_type: creation_defaults
    grounds:
    - entities.Plan
    - errors[ERR_INVALID_REQUEST]
    distinguishing_aspect: A fully-specified POST /plans returns 201 with status DRAFT and version 1; omitting required oop_max_cents
      returns 400 ERR_INVALID_REQUEST.
    test_recipe:
      setup:
      - Empty DB
      setup_api_calls: []
      trigger:
      - call: POST /plans
        payload:
          name: P-NEW
          deductible_cents: 15000
          oop_max_cents: 100000
          assistance_model: ACCUMULATOR
          member_min_pay_cents: 500
          card_fill_cap_cents: 0
          dispensing_fee_cents: 200
        as: PbmAdmin
        captures:
          p_new: $.data.id
          p_new_v: $.data.version
      - call: POST /plans
        payload:
          name: P-BAD
          deductible_cents: 15000
          assistance_model: ACCUMULATOR
          member_min_pay_cents: 500
          card_fill_cap_cents: 0
          dispensing_fee_cents: 200
        as: PbmAdmin
        captures:
          err_new: $.data.error_id
      assert:
      - 'Plan.${p_new}: status == DRAFT, version == 1, deductible_cents == 15000'
      - 'Missing oop_max_cents: 400 ERR_INVALID_REQUEST'
  - name: drug_creation_defaults
    claim_type: creation_defaults
    grounds:
    - entities.Drug.fields.is_specialty
    distinguishing_aspect: Omitting optional is_specialty on POST /drugs persists the documented default false.
    test_recipe:
      setup:
      - Empty DB
      setup_api_calls: []
      trigger:
      - call: POST /drugs
        payload:
          ndc: 00000-9001
          name: Plainex
          therapeutic_class: EMOLLIENT
          unit_cost_cents: 250
          max_daily_dose_units: 6
        as: PbmAdmin
        captures:
          d_new: $.data.id
      assert:
      - 'Drug.${d_new}: is_specialty == false (default applied), version == 1'
  - name: member_creation_defaults
    claim_type: creation_defaults
    grounds:
    - entities.Member.fields.card_balance_cents
    - entities.Member.fields.status
    distinguishing_aspect: A member created without card fields starts ACTIVE with zeroed accumulators, oop_max_reached false,
      card_balance_cents 0 and card_drug_id null.
    test_recipe:
      setup:
      - Plan exists (DRAFT is sufficient for enrollment)
      setup_api_calls:
      - call: POST /plans
        payload:
          name: P-MDF
          deductible_cents: 1000
          oop_max_cents: 5000
          assistance_model: MAXIMIZER
          member_min_pay_cents: 0
          card_fill_cap_cents: 1000
          dispensing_fee_cents: 100
        as: PbmAdmin
        captures:
          p_mdf: $.data.id
      trigger:
      - call: POST /members
        payload:
          plan_id: ${p_mdf}
          external_ref: M-NEW
          full_name: New Pat
          eligibility_start_date: '2026-01-01'
          eligibility_end_date: '2026-12-31'
        as: PbmAdmin
        captures:
          m_new: $.data.id
      assert:
      - 'Member.${m_new}: status == ACTIVE, deductible_paid_cents == 0, oop_paid_cents == 0, oop_max_reached == false, card_balance_cents
        == 0, card_drug_id is null'
  - name: claim_get_not_found_returns_404
    claim_type: not_found
    grounds:
    - errors[ERR_CLAIM_NOT_FOUND]
    - endpoints.GET /claims/{id}
    distinguishing_aspect: GET /claims/{id} with a well-formed but unknown UUID returns 404 ERR_CLAIM_NOT_FOUND.
    test_recipe:
      setup:
      - Empty DB
      setup_api_calls: []
      trigger:
      - call: GET /claims/00000000-0000-0000-0000-000000000000
        payload: {}
        as: PbmAdmin
        captures:
          err_nf: $.data.error_id
      assert:
      - 404 with error_id ERR_CLAIM_NOT_FOUND
  - name: formulary_entry_duplicate_plan_drug_rejected
    claim_type: type_constraint
    grounds:
    - validations[priority=8]
    - errors[ERR_DUPLICATE_FORMULARY_ENTRY]
    distinguishing_aspect: A second FormularyEntry for an already-covered (plan_id, drug_id) pair returns 409 ERR_DUPLICATE_FORMULARY_ENTRY
      regardless of the first entry's status.
    test_recipe:
      setup:
      - Plan (DRAFT) and drug exist; one entry for the pair already created
      setup_api_calls:
      - call: POST /plans
        payload:
          name: P-DUP
          deductible_cents: 0
          oop_max_cents: 100000
          assistance_model: ACCUMULATOR
          member_min_pay_cents: 0
          card_fill_cap_cents: 0
          dispensing_fee_cents: 0
        as: PbmAdmin
        captures:
          p_dup: $.data.id
      - call: POST /drugs
        payload:
          ndc: 00000-9002
          name: Duplix
          therapeutic_class: ANTACID
          unit_cost_cents: 100
          max_daily_dose_units: 10
          is_specialty: false
        as: PbmAdmin
        captures:
          d_dup: $.data.id
      - call: POST /formulary-entries
        payload:
          plan_id: ${p_dup}
          drug_id: ${d_dup}
          tier: 1
          quantity_limit_per_fill: 30
          max_days_supply: 30
          copay_type: FLAT
          copay_flat_cents: 100
        as: PbmAdmin
      trigger:
      - call: POST /formulary-entries
        payload:
          plan_id: ${p_dup}
          drug_id: ${d_dup}
          tier: 2
          quantity_limit_per_fill: 60
          max_days_supply: 60
          copay_type: FLAT
          copay_flat_cents: 200
        as: PbmAdmin
        captures:
          err_dup: $.data.error_id
      assert:
      - 409 ERR_DUPLICATE_FORMULARY_ENTRY; the first entry is unchanged
  - name: member_with_unknown_plan_rejected
    claim_type: parent_relationship
    grounds:
    - entities.Member.fields.plan_id
    - errors[ERR_PLAN_NOT_FOUND]
    distinguishing_aspect: POST /members with a plan_id that resolves to no Plan returns 404 ERR_PLAN_NOT_FOUND (flat-topology
      FK integrity).
    test_recipe:
      setup:
      - Empty DB
      setup_api_calls: []
      trigger:
      - call: POST /members
        payload:
          plan_id: 00000000-0000-0000-0000-000000000000
          external_ref: M-ORPHAN
          full_name: Orphan Pat
          eligibility_start_date: '2026-01-01'
          eligibility_end_date: '2026-12-31'
        as: PbmAdmin
        captures:
          err_orph: $.data.error_id
      assert:
      - 404 ERR_PLAN_NOT_FOUND; no member persisted
  - name: claim_computed_amounts_on_creation
    claim_type: computed_fields
    grounds:
    - entities.Claim.fields.allowed_cents
    - entities.Claim.fields.plan_paid_cents
    - calculations.claim_pricing
    distinguishing_aspect: 'On a clean PAID creation the server-computed fields are exact: allowed = unit 10000 x qty 3 +
      fee 200 = 30200; FLAT copay 200 -> member_pays 200; plan_paid 30000; bookkeeping fields initialized (resubmit_count
      0, audit_status UNAUDITED, reject_reasons empty).'
    test_recipe:
      setup:
      - Standard ACTIVE plan (deductible 0, fee 200), FLAT-200 entry for drug (unit 10000), ACTIVE retail pharmacy, eligible
        member
      setup_api_calls:
      - call: POST /plans
        payload:
          name: P-CMP
          deductible_cents: 0
          oop_max_cents: 100000
          assistance_model: ACCUMULATOR
          member_min_pay_cents: 0
          card_fill_cap_cents: 0
          dispensing_fee_cents: 200
        as: PbmAdmin
        captures:
          p_cmp: $.data.id
      - call: POST /drugs
        payload:
          ndc: 00000-9003
          name: Computin
          therapeutic_class: ANTIHISTAMINE
          unit_cost_cents: 10000
          max_daily_dose_units: 10
          is_specialty: false
        as: PbmAdmin
        captures:
          d_cmp: $.data.id
      - call: POST /formulary-entries
        payload:
          plan_id: ${p_cmp}
          drug_id: ${d_cmp}
          tier: 1
          quantity_limit_per_fill: 90
          max_days_supply: 90
          copay_type: FLAT
          copay_flat_cents: 200
          rebate_eligible: false
        as: PbmAdmin
      - call: POST /plans/${p_cmp}/activate
        payload: {}
        as: PbmAdmin
      - call: POST /pharmacies
        payload:
          ncpdp_id: NCPDP-CMP
          name: Rx Compute
          channel: RETAIL
          auto_suspend_threshold_cents: 5000
        as: PbmAdmin
        captures:
          ph_cmp: $.data.id
      - call: POST /members
        payload:
          plan_id: ${p_cmp}
          external_ref: M-CMP
          full_name: Pat Compute
          eligibility_start_date: '2026-01-01'
          eligibility_end_date: '2026-12-31'
        as: PbmAdmin
        captures:
          m_cmp: $.data.id
      trigger:
      - call: POST /claims
        payload:
          member_id: ${m_cmp}
          drug_id: ${d_cmp}
          prescription_number: RX-CMP
          fill_date: '2026-03-01'
          quantity: 3
          days_supply: 3
        as: Pharmacist
        as_user_id: ${ph_cmp}
        captures:
          c_cmp: $.data.id
      assert:
      - 'Claim.${c_cmp}: allowed_cents == 30200, copay_base_cents == 200, deductible_applied_cents == 0, card_applied_cents
        == 0, member_pays_cents == 200, plan_paid_cents == 30000'
      - 'Claim.${c_cmp}: status == PAID, reject_reasons == [], resubmit_count == 0, audit_status == UNAUDITED, rebate_tag
        == REBATE_INELIGIBLE, pa_id is null, version == 1'
  - name: claims_list_pagination
    claim_type: listing
    grounds:
    - endpoints.GET /claims
    - response_envelope
    distinguishing_aspect: GET /claims?member_id with limit 2 over 3 claims returns 2 items with total_count 3 and has_more
      true; offset 2 returns 1 item with has_more false.
    test_recipe:
      setup:
      - Standard ACTIVE plan fixture; 3 PAID claims for one member at non-overlapping fills 2026-03-01 / 2026-04-01 / 2026-05-01
        (days_supply 10)
      setup_api_calls:
      - call: POST /plans
        payload:
          name: P-PAG
          deductible_cents: 0
          oop_max_cents: 100000
          assistance_model: ACCUMULATOR
          member_min_pay_cents: 0
          card_fill_cap_cents: 0
          dispensing_fee_cents: 0
        as: PbmAdmin
        captures:
          p_pag: $.data.id
      - call: POST /drugs
        payload:
          ndc: 00000-9004
          name: Pageol
          therapeutic_class: ANTITUSSIVE
          unit_cost_cents: 100
          max_daily_dose_units: 100
          is_specialty: false
        as: PbmAdmin
        captures:
          d_pag: $.data.id
      - call: POST /formulary-entries
        payload:
          plan_id: ${p_pag}
          drug_id: ${d_pag}
          tier: 1
          quantity_limit_per_fill: 90
          max_days_supply: 90
          copay_type: FLAT
          copay_flat_cents: 100
        as: PbmAdmin
      - call: POST /plans/${p_pag}/activate
        payload: {}
        as: PbmAdmin
      - call: POST /pharmacies
        payload:
          ncpdp_id: NCPDP-PAG
          name: Rx Page
          channel: RETAIL
          auto_suspend_threshold_cents: 5000
        as: PbmAdmin
        captures:
          ph_pag: $.data.id
      - call: POST /members
        payload:
          plan_id: ${p_pag}
          external_ref: M-PAG
          full_name: Pat Page
          eligibility_start_date: '2026-01-01'
          eligibility_end_date: '2026-12-31'
        as: PbmAdmin
        captures:
          m_pag: $.data.id
      - call: POST /claims
        payload:
          member_id: ${m_pag}
          drug_id: ${d_pag}
          prescription_number: RX-PG1
          fill_date: '2026-03-01'
          quantity: 10
          days_supply: 10
        as: Pharmacist
        as_user_id: ${ph_pag}
      - call: POST /claims
        payload:
          member_id: ${m_pag}
          drug_id: ${d_pag}
          prescription_number: RX-PG2
          fill_date: '2026-04-01'
          quantity: 10
          days_supply: 10
        as: Pharmacist
        as_user_id: ${ph_pag}
      - call: POST /claims
        payload:
          member_id: ${m_pag}
          drug_id: ${d_pag}
          prescription_number: RX-PG3
          fill_date: '2026-05-01'
          quantity: 10
          days_supply: 10
        as: Pharmacist
        as_user_id: ${ph_pag}
      trigger:
      - call: GET /claims
        payload:
          member_id: ${m_pag}
          limit: 2
          offset: 0
        as: PbmAdmin
      - call: GET /claims
        payload:
          member_id: ${m_pag}
          limit: 2
          offset: 2
        as: PbmAdmin
      assert:
      - 'Page 1: 2 items, total_count == 3, has_more == true'
      - 'Page 2 (offset 2): 1 item, total_count == 3, has_more == false'
- section: state_machines
  instances:
  - name: claim_reverse_from_rejected_rejected
    claim_type: invalid_transition
    grounds:
    - state_machines.Claim.PAID_to_REVERSED
    - errors[ERR_CLAIM_NOT_PAID]
    distinguishing_aspect: Reverse on a REJECTED claim fails with 409 ERR_CLAIM_NOT_PAID and leaves the claim REJECTED with
      its reject_reasons intact.
    test_recipe:
      setup:
      - Standard ACTIVE plan fixture; one claim REJECTED by quantity edit (qty 91 > limit 90)
      setup_api_calls:
      - call: POST /plans
        payload:
          name: P-RVR
          deductible_cents: 0
          oop_max_cents: 100000
          assistance_model: ACCUMULATOR
          member_min_pay_cents: 0
          card_fill_cap_cents: 0
          dispensing_fee_cents: 0
        as: PbmAdmin
        captures:
          p_rvr: $.data.id
      - call: POST /drugs
        payload:
          ndc: 00000-9005
          name: Reverso
          therapeutic_class: ANTIVERTIGO
          unit_cost_cents: 100
          max_daily_dose_units: 100
          is_specialty: false
        as: PbmAdmin
        captures:
          d_rvr: $.data.id
      - call: POST /formulary-entries
        payload:
          plan_id: ${p_rvr}
          drug_id: ${d_rvr}
          tier: 1
          quantity_limit_per_fill: 90
          max_days_supply: 90
          copay_type: FLAT
          copay_flat_cents: 100
        as: PbmAdmin
      - call: POST /plans/${p_rvr}/activate
        payload: {}
        as: PbmAdmin
      - call: POST /pharmacies
        payload:
          ncpdp_id: NCPDP-RVR
          name: Rx Reverse
          channel: RETAIL
          auto_suspend_threshold_cents: 5000
        as: PbmAdmin
        captures:
          ph_rvr: $.data.id
      - call: POST /members
        payload:
          plan_id: ${p_rvr}
          external_ref: M-RVR
          full_name: Pat Reverse
          eligibility_start_date: '2026-01-01'
          eligibility_end_date: '2026-12-31'
        as: PbmAdmin
        captures:
          m_rvr: $.data.id
      - call: POST /claims
        payload:
          member_id: ${m_rvr}
          drug_id: ${d_rvr}
          prescription_number: RX-RVR
          fill_date: '2026-03-01'
          quantity: 91
          days_supply: 30
        as: Pharmacist
        as_user_id: ${ph_rvr}
      - call: GET /claims
        payload:
          member_id: ${m_rvr}
          status: REJECTED
        as: PbmAdmin
        captures:
          c_rvr: $.data[0].id
      trigger:
      - call: POST /claims/${c_rvr}/reverse
        payload:
          reversal_reason: premature
        as: Pharmacist
        as_user_id: ${ph_rvr}
        captures:
          err_rvr: $.data.error_id
      assert:
      - 409 ERR_CLAIM_NOT_PAID; Claim.${c_rvr} remains REJECTED with reject_reasons ["ERR_QUANTITY_LIMIT_EXCEEDED"]
  - name: claim_resubmit_from_paid_rejected
    claim_type: invalid_transition
    grounds:
    - state_machines.Claim.REJECTED_to_PAID
    - errors[ERR_CLAIM_NOT_REJECTED]
    distinguishing_aspect: Resubmit on a PAID claim fails with 409 ERR_CLAIM_NOT_REJECTED; the paid claim's financials are
      untouched.
    test_recipe:
      setup:
      - 'Standard ACTIVE plan fixture; one PAID claim (plan_paid 9900: unit 100 qty 100 fee 0 FLAT 100)'
      setup_api_calls:
      - call: POST /plans
        payload:
          name: P-RSB
          deductible_cents: 0
          oop_max_cents: 100000
          assistance_model: ACCUMULATOR
          member_min_pay_cents: 0
          card_fill_cap_cents: 0
          dispensing_fee_cents: 0
        as: PbmAdmin
        captures:
          p_rsb: $.data.id
      - call: POST /drugs
        payload:
          ndc: 00000-9006
          name: Submitra
          therapeutic_class: ANTISPASMODIC
          unit_cost_cents: 100
          max_daily_dose_units: 100
          is_specialty: false
        as: PbmAdmin
        captures:
          d_rsb: $.data.id
      - call: POST /formulary-entries
        payload:
          plan_id: ${p_rsb}
          drug_id: ${d_rsb}
          tier: 1
          quantity_limit_per_fill: 120
          max_days_supply: 90
          copay_type: FLAT
          copay_flat_cents: 100
        as: PbmAdmin
      - call: POST /plans/${p_rsb}/activate
        payload: {}
        as: PbmAdmin
      - call: POST /pharmacies
        payload:
          ncpdp_id: NCPDP-RSB
          name: Rx Resub
          channel: RETAIL
          auto_suspend_threshold_cents: 5000
        as: PbmAdmin
        captures:
          ph_rsb: $.data.id
      - call: POST /members
        payload:
          plan_id: ${p_rsb}
          external_ref: M-RSB
          full_name: Pat Resub
          eligibility_start_date: '2026-01-01'
          eligibility_end_date: '2026-12-31'
        as: PbmAdmin
        captures:
          m_rsb: $.data.id
      - call: POST /claims
        payload:
          member_id: ${m_rsb}
          drug_id: ${d_rsb}
          prescription_number: RX-RSB
          fill_date: '2026-03-01'
          quantity: 100
          days_supply: 30
        as: Pharmacist
        as_user_id: ${ph_rsb}
        captures:
          c_rsb: $.data.id
      trigger:
      - call: POST /claims/${c_rsb}/resubmit
        payload: {}
        as: Pharmacist
        as_user_id: ${ph_rsb}
        captures:
          err_rsb: $.data.error_id
      assert:
      - 409 ERR_CLAIM_NOT_REJECTED; Claim.${c_rsb} remains PAID with plan_paid_cents == 9900 and resubmit_count == 0
  - name: claim_reprocess_from_paid_rejected
    claim_type: invalid_transition
    grounds:
    - state_machines.Claim.REVERSED_to_PAID
    - errors[ERR_CLAIM_NOT_REVERSED]
    distinguishing_aspect: Reprocess on a PAID (never reversed) claim fails with 409 ERR_CLAIM_NOT_REVERSED.
    test_recipe:
      setup:
      - Standard ACTIVE plan fixture; one PAID claim
      setup_api_calls:
      - call: POST /plans
        payload:
          name: P-RPR
          deductible_cents: 0
          oop_max_cents: 100000
          assistance_model: ACCUMULATOR
          member_min_pay_cents: 0
          card_fill_cap_cents: 0
          dispensing_fee_cents: 0
        as: PbmAdmin
        captures:
          p_rpr: $.data.id
      - call: POST /drugs
        payload:
          ndc: 00000-9007
          name: Reproses
          therapeutic_class: ANTIPYRETIC
          unit_cost_cents: 100
          max_daily_dose_units: 100
          is_specialty: false
        as: PbmAdmin
        captures:
          d_rpr: $.data.id
      - call: POST /formulary-entries
        payload:
          plan_id: ${p_rpr}
          drug_id: ${d_rpr}
          tier: 1
          quantity_limit_per_fill: 120
          max_days_supply: 90
          copay_type: FLAT
          copay_flat_cents: 100
        as: PbmAdmin
      - call: POST /plans/${p_rpr}/activate
        payload: {}
        as: PbmAdmin
      - call: POST /pharmacies
        payload:
          ncpdp_id: NCPDP-RPR
          name: Rx Repro
          channel: RETAIL
          auto_suspend_threshold_cents: 5000
        as: PbmAdmin
        captures:
          ph_rpr: $.data.id
      - call: POST /members
        payload:
          plan_id: ${p_rpr}
          external_ref: M-RPR
          full_name: Pat Repro
          eligibility_start_date: '2026-01-01'
          eligibility_end_date: '2026-12-31'
        as: PbmAdmin
        captures:
          m_rpr: $.data.id
      - call: POST /claims
        payload:
          member_id: ${m_rpr}
          drug_id: ${d_rpr}
          prescription_number: RX-RPR
          fill_date: '2026-03-01'
          quantity: 10
          days_supply: 10
        as: Pharmacist
        as_user_id: ${ph_rpr}
        captures:
          c_rpr: $.data.id
      trigger:
      - call: POST /claims/${c_rpr}/reprocess
        payload:
          quantity: 5
        as: Pharmacist
        as_user_id: ${ph_rpr}
        captures:
          err_rpr: $.data.error_id
      assert:
      - 409 ERR_CLAIM_NOT_REVERSED; Claim.${c_rpr} remains PAID with quantity == 10
  - name: pa_approve_from_denied_rejected
    claim_type: terminal_state_lockdown
    grounds:
    - state_machines.PriorAuthorization.PENDING_to_DENIED
    - errors[ERR_PA_NOT_PENDING]
    distinguishing_aspect: 'A DENIED (terminal) PA cannot be approved: approve returns 409 ERR_PA_NOT_PENDING and the PA stays
      DENIED with its denial_reason.'
    test_recipe:
      setup:
      - Plan + drug exist; member with a PA that a reviewer has already DENIED
      setup_api_calls:
      - call: POST /plans
        payload:
          name: P-DNY
          deductible_cents: 0
          oop_max_cents: 100000
          assistance_model: ACCUMULATOR
          member_min_pay_cents: 0
          card_fill_cap_cents: 0
          dispensing_fee_cents: 0
        as: PbmAdmin
        captures:
          p_dny: $.data.id
      - call: POST /drugs
        payload:
          ndc: 00000-9008
          name: Denyon
          therapeutic_class: ANTICOAGULANT
          unit_cost_cents: 500
          max_daily_dose_units: 10
          is_specialty: false
        as: PbmAdmin
        captures:
          d_dny: $.data.id
      - call: POST /members
        payload:
          plan_id: ${p_dny}
          external_ref: M-DNY
          full_name: Pat Deny
          eligibility_start_date: '2026-01-01'
          eligibility_end_date: '2026-12-31'
        as: PbmAdmin
        captures:
          m_dny: $.data.id
      - call: POST /prior-authorizations
        payload:
          member_id: ${m_dny}
          drug_id: ${d_dny}
          requested_quantity: 30
        as: Member
        as_user_id: ${m_dny}
        captures:
          pa_dny: $.data.id
      - call: POST /prior-authorizations/${pa_dny}/deny
        payload:
          denial_reason: insufficient documentation
        as: ClinicalReviewer
      trigger:
      - call: POST /prior-authorizations/${pa_dny}/approve
        payload:
          approved_quantity: 30
          expires_at: '2026-12-31'
        as: ClinicalReviewer
        captures:
          err_dny: $.data.error_id
      assert:
      - 409 ERR_PA_NOT_PENDING; PriorAuthorization.${pa_dny} remains DENIED with denial_reason 'insufficient documentation'
        and approved_quantity null
  - name: audit_close_from_disputed_rejected
    claim_type: invalid_transition
    grounds:
    - state_machines.PharmacyAudit.FINDINGS_RECORDED_to_DISPUTED
    - errors[ERR_AUDIT_INVALID_STATE]
