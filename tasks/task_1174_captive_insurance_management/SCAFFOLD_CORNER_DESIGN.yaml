# =============================================================================
# SCAFFOLD_CORNER_DESIGN.yaml — Captive Insurance Management (task_1174)
# Breadth coverage: every testable claim not already covered by §1.8
# =============================================================================

scaffold_corner_design:
  # =========================================================================
  # Section: entities — creation, retrieval, listing, defaults, computed fields
  # =========================================================================
  - section: entities
    instances:
      - name: captive_creation_with_defaults
        claim_type: creation
        grounds:
          - entities.CaptiveEntity
          - endpoints[POST /captives]
        distinguishing_aspect: |
          POST /captives with all required fields returns 201 with system-generated
          id, created_at, updated_at, version=1, status=FORMATION_PENDING,
          governance_score=100, tax_classification defaults to MICRO_CAPTIVE_831B.
        test_recipe:
          setup:
            - "Empty database"
          setup_api_calls:
            - call: "POST /api/captives"
              payload: { captive_name: "New Captive", domicile_jurisdiction: "VERMONT", formation_date: "2026-01-15T00:00:00Z", capitalization_amount: 500000 }
              as: CaptiveManager
              captures: { captive_id: $.data.id }
          trigger:
            - call: "GET /api/captives/${captive_id}"
              as: CaptiveManager
          assert:
            - "CaptiveEntity.${captive_id}.status == FORMATION_PENDING"
            - "CaptiveEntity.${captive_id}.governance_score == 100"
            - "CaptiveEntity.${captive_id}.tax_classification == MICRO_CAPTIVE_831B"
            - "CaptiveEntity.${captive_id}.version == 1"
            - "CaptiveEntity.${captive_id}.id is not null"

      - name: captive_creation_missing_required_field
        claim_type: required_fields
        grounds:
          - entities.CaptiveEntity
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: |
          POST /captives missing captive_name returns 400 ERR_INVALID_REQUEST.
        test_recipe:
          setup:
            - "Empty database"
          setup_api_calls: []
          trigger:
            - call: "POST /api/captives"
              payload: { domicile_jurisdiction: "VERMONT", formation_date: "2026-01-15T00:00:00Z", capitalization_amount: 500000 }
              as: CaptiveManager
          assert:
            - "Response status == 400"
            - "Response error_id == ERR_INVALID_REQUEST"

      - name: captive_list_pagination
        claim_type: listing
        grounds:
          - endpoints[GET /captives]
        distinguishing_aspect: |
          GET /captives with limit=2 and offset=0 returns paginated list with
          total_count and has_more fields in response envelope.
        test_recipe:
          setup:
            - "Three captives created"
          setup_api_calls:
            - call: "POST /api/captives"
              payload: { captive_name: "Captive 1", domicile_jurisdiction: "VERMONT", formation_date: "2026-01-15T00:00:00Z", capitalization_amount: 500000 }
              as: CaptiveManager
            - call: "POST /api/captives"
              payload: { captive_name: "Captive 2", domicile_jurisdiction: "BERMUDA", formation_date: "2026-01-16T00:00:00Z", capitalization_amount: 600000 }
              as: CaptiveManager
            - call: "POST /api/captives"
              payload: { captive_name: "Captive 3", domicile_jurisdiction: "CAYMAN", formation_date: "2026-01-17T00:00:00Z", capitalization_amount: 700000 }
              as: CaptiveManager
          trigger:
            - call: "GET /api/captives"
              payload: { limit: 2, offset: 0 }
              as: CaptiveManager
          assert:
            - "Response data is array of length 2"
            - "Response has_more == true"
            - "Response total_count >= 3"

      - name: captive_not_found
        claim_type: not_found
        grounds:
          - errors[ERR_CAPTIVE_NOT_FOUND]
        distinguishing_aspect: |
          GET /api/captives/{non-existent-uuid} returns 404 ERR_CAPTIVE_NOT_FOUND.
        test_recipe:
          setup:
            - "Empty database"
          setup_api_calls: []
          trigger:
            - call: "GET /api/captives/00000000-0000-0000-0000-000000000000"
              as: CaptiveManager
          assert:
            - "Response status == 404"
            - "Response error_id == ERR_CAPTIVE_NOT_FOUND"

      - name: operating_unit_creation_and_retrieval
        claim_type: creation
        grounds:
          - entities.OperatingUnit
          - endpoints[POST /api/captives/{captiveId}/operating-units]
        distinguishing_aspect: |
          POST operating unit returns 201 with status=ACTIVE and computed fields initialized.
        test_recipe:
          setup:
            - "CaptiveEntity created"
          setup_api_calls:
            - call: "POST /api/captives"
              payload: { captive_name: "Test Captive OU", domicile_jurisdiction: "VERMONT", formation_date: "2026-01-15T00:00:00Z", capitalization_amount: 500000 }
              as: CaptiveManager
              captures: { captive_id: $.data.id }
          trigger:
            - call: "POST /api/captives/${captive_id}/operating-units"
              payload: { unit_name: "Sales Division", unit_code: "SD", exposure_basis: "REVENUE", exposure_amount: 5000 }
              as: CaptiveManager
              captures: { unit_id: $.data.id }
          assert:
            - "OperatingUnit.${unit_id}.status == ACTIVE"
            - "OperatingUnit.${unit_id}.total_premium_allocated_cents == 0"
            - "OperatingUnit.${unit_id}.total_claims_incurred_cents == 0"

      - name: claim_computed_fields_on_creation
        claim_type: computed_fields
        grounds:
          - entities.Claim.fields.claim_number
          - entities.Claim.fields.coverage_confirmed
          - entities.Claim.fields.net_incurred_cents
        distinguishing_aspect: |
          Claim created with system-generated claim_number, computed coverage_confirmed,
          and net_incurred_cents initialized. Input values for computed fields are ignored.
        test_recipe:
          setup:
            - "CaptiveEntity ACTIVE, program IN_FORCE, operating unit exists"
          setup_api_calls:
            - call: "POST /api/captives"
              payload: { captive_name: "Test Captive CF", domicile_jurisdiction: "VERMONT", formation_date: "2026-01-15T00:00:00Z", capitalization_amount: 500000 }
              as: CaptiveManager
              captures: { captive_id: $.data.id, captive_ver: $.data.version }
            - call: "POST /api/captives/${captive_id}/domicile-filings"
              payload: { filing_type: "INITIAL_FORMATION", jurisdiction: "VERMONT", supporting_documents: [{document_type: "ARTICLES", document_url: "https://docs.example.com/a.pdf", uploaded_at: "2026-01-15T00:00:00Z"}] }
              as: CaptiveManager
              captures: { filing_id: $.data.id }
            - call: "POST /api/captives/${captive_id}/domicile-filings/${filing_id}/submit"
              payload: {}
              as: CaptiveManager
            - call: "POST /api/captives/${captive_id}/domicile-filings/${filing_id}/acknowledge"
              payload: {}
              as: DomicileRegulator
            - call: "POST /api/captives/${captive_id}/domicile-filings/${filing_id}/approve"
              payload: {}
              as: DomicileRegulator
            - call: "POST /api/captives/${captive_id}/operating-units"
              payload: { unit_name: "Unit CF", unit_code: "UCF", exposure_basis: "REVENUE", exposure_amount: 1000 }
              as: CaptiveManager
              captures: { unit_id: $.data.id }
            - call: "POST /api/captives/${captive_id}/programs"
              payload: { program_name: "GL Prog CF", line_of_business: "GENERAL_LIABILITY", policy_period_start: "2026-06-01T00:00:00Z", policy_period_end: "2027-05-31T23:59:59Z", aggregate_limit_cents: 1000000, per_occurrence_limit_cents: 250000, attachment_point_cents: 10000, premium_budget_cents: 200000, expected_captive_version: "${captive_ver}" }
              as: Underwriter
              captures: { program_id: $.data.id }
            - call: "POST /api/captives/${captive_id}/programs/${program_id}/quote"
              payload: {}
              as: Underwriter
            - call: "POST /api/captives/${captive_id}/programs/${program_id}/bind"
              payload: {}
              as: Underwriter
            - call: "POST /api/captives/${captive_id}/activate"
              payload: {}
              as: CaptiveManager
            - call: "POST /api/captives/${captive_id}/programs/${program_id}/activate"
              payload: {}
              as: Underwriter
          trigger:
            - call: "POST /api/captives/${captive_id}/programs/${program_id}/claims"
              payload: { operating_unit_id: "${unit_id}", claimant_name: "Test Claimant", loss_date: "2026-07-15T00:00:00Z", claimed_amount_cents: 50000 }
              as: ClaimsAdjuster
              captures: { claim_id: $.data.id }
          assert:
            - "Claim.${claim_id}.claim_number is not null (system-generated)"
            - "Claim.${claim_id}.claim_status == REPORTED"
            - "Claim.${claim_id}.payment_status == UNPAID"
            - "Claim.${claim_id}.litigation_status == NOT_LITIGATED"
            - "Claim.${claim_id}.paid_amount_cents == 0"

  # =========================================================================
  # Section: state_machines — valid transitions, invalid transitions, terminal lockdown
  # =========================================================================
  - section: state_machines
    instances:
      - name: filing_invalid_transition_draft_to_approve
        claim_type: invalid_transition
        grounds:
          - state_machines.DomicileFiling
          - errors[ERR_FILING_NOT_UNDER_REVIEW]
        distinguishing_aspect: |
          Attempting to approve a DRAFT filing (skipping SUBMITTED and UNDER_REVIEW)
          returns ERR_FILING_NOT_UNDER_REVIEW.
        test_recipe:
          setup:
            - "CaptiveEntity with DRAFT filing"
          setup_api_calls:
            - call: "POST /api/captives"
              payload: { captive_name: "Test Captive IT", domicile_jurisdiction: "VERMONT", formation_date: "2026-01-15T00:00:00Z", capitalization_amount: 500000 }
              as: CaptiveManager
              captures: { captive_id: $.data.id }
            - call: "POST /api/captives/${captive_id}/domicile-filings"
              payload: { filing_type: "INITIAL_FORMATION", jurisdiction: "VERMONT", supporting_documents: [{document_type: "ARTICLES", document_url: "https://docs.example.com/a.pdf", uploaded_at: "2026-01-15T00:00:00Z"}] }
              as: CaptiveManager
              captures: { filing_id: $.data.id }
          trigger:
            - call: "POST /api/captives/${captive_id}/domicile-filings/${filing_id}/approve"
              payload: {}
              as: DomicileRegulator
          assert:
            - "Response status == 409"
            - "Response error_id == ERR_FILING_NOT_UNDER_REVIEW"

      - name: captive_terminal_dissolved_no_transitions
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.CaptiveEntity
        distinguishing_aspect: |
          Once CaptiveEntity is DISSOLVED, no further state transitions are possible.
          Attempting to activate a dissolved captive returns ERR_CAPTIVE_NOT_ACTIVE.
        test_recipe:
          setup:
            - "CaptiveEntity DISSOLVED (via full lifecycle)"
          setup_api_calls:
            - call: "POST /api/captives"
              payload: { captive_name: "Test Captive TD", domicile_jurisdiction: "VERMONT", formation_date: "2026-01-15T00:00:00Z", capitalization_amount: 500000 }
              as: CaptiveManager
              captures: { captive_id: $.data.id, captive_ver: $.data.version }
            - call: "POST /api/captives/${captive_id}/domicile-filings"
              payload: { filing_type: "INITIAL_FORMATION", jurisdiction: "VERMONT", supporting_documents: [{document_type: "ARTICLES", document_url: "https://docs.example.com/a.pdf", uploaded_at: "2026-01-15T00:00:00Z"}] }
              as: CaptiveManager
              captures: { filing_id: $.data.id }
            - call: "POST /api/captives/${captive_id}/domicile-filings/${filing_id}/submit"
              payload: {}
              as: CaptiveManager
            - call: "POST /api/captives/${captive_id}/domicile-filings/${filing_id}/acknowledge"
              payload: {}
              as: DomicileRegulator
            - call: "POST /api/captives/${captive_id}/domicile-filings/${filing_id}/approve"
              payload: {}
              as: DomicileRegulator
            - call: "POST /api/captives/${captive_id}/operating-units"
              payload: { unit_name: "Unit TD", unit_code: "UTD", exposure_basis: "REVENUE", exposure_amount: 1000 }
              as: CaptiveManager
              captures: { unit_id: $.data.id }
            - call: "POST /api/captives/${captive_id}/programs"
              payload: { program_name: "GL Prog TD", line_of_business: "GENERAL_LIABILITY", policy_period_start: "2026-06-01T00:00:00Z", policy_period_end: "2027-05-31T23:59:59Z", aggregate_limit_cents: 1000000, per_occurrence_limit_cents: 250000, attachment_point_cents: 10000, premium_budget_cents: 200000, expected_captive_version: "${captive_ver}" }
              as: Underwriter
              captures: { program_id: $.data.id }
            - call: "POST /api/captives/${captive_id}/programs/${program_id}/quote"
              payload: {}
              as: Underwriter
            - call: "POST /api/captives/${captive_id}/programs/${program_id}/bind"
              payload: {}
              as: Underwriter
            - call: "POST /api/captives/${captive_id}/activate"
              payload: {}
              as: CaptiveManager
            - call: "POST /api/captives/${captive_id}/programs/${program_id}/activate"
              payload: {}
              as: Underwriter
            - call: "POST /api/captives/${captive_id}/programs/${program_id}/enter-runoff"
              payload: {}
              as: Underwriter
            - call: "POST /api/captives/${captive_id}/programs/${program_id}/close"
              payload: {}
              as: Underwriter
            - call: "POST /api/captives/${captive_id}/dissolve"
              payload: {}
              as: CaptiveManager
          trigger:
            - call: "POST /api/captives/${captive_id}/activate"
              payload: {}
              as: CaptiveManager
          assert:
            - "Response status == 409"
            - "Response error_id == ERR_CAPTIVE_NOT_ACTIVE"

      - name: premium_allocation_dispute_resolve_cycle
        claim_type: valid_transition
        grounds:
          - state_machines.PremiumAllocation
        distinguishing_aspect: |
          PremiumAllocation can cycle: PROVISIONAL -> DISPUTED -> PROVISIONAL (resolve-dispute).
          This is a valid cyclic transition path.
        test_recipe:
          setup:
            - "CaptiveEntity ACTIVE, program IN_FORCE, allocation PROVISIONAL"
          setup_api_calls:
            - call: "POST /api/captives"
              payload: { captive_name: "Test Captive CY", domicile_jurisdiction: "VERMONT", formation_date: "2026-01-15T00:00:00Z", capitalization_amount: 500000 }
              as: CaptiveManager
              captures: { captive_id: $.data.id, captive_ver: $.data.version }
            - call: "POST /api/captives/${captive_id}/domicile-filings"
              payload: { filing_type: "INITIAL_FORMATION", jurisdiction: "VERMONT", supporting_documents: [{document_type: "ARTICLES", document_url: "https://docs.example.com/a.pdf", uploaded_at: "2026-01-15T00:00:00Z"}] }
              as: CaptiveManager
              captures: { filing_id: $.data.id }
            - call: "POST /api/captives/${captive_id}/domicile-filings/${filing_id}/submit"
              payload: {}
              as: CaptiveManager
            - call: "POST /api/captives/${captive_id}/domicile-filings/${filing_id}/acknowledge"
              payload: {}
              as: DomicileRegulator
            - call: "POST /api/captives/${captive_id}/domicile-filings/${filing_id}/approve"
              payload: {}
              as: DomicileRegulator
            - call: "POST /api/captives/${captive_id}/operating-units"
              payload: { unit_name: "Unit CY", unit_code: "UCY", exposure_basis: "REVENUE", exposure_amount: 1000 }
              as: CaptiveManager
              captures: { unit_id: $.data.id }
            - call: "POST /api/captives/${captive_id}/programs"
              payload: { program_name: "GL Prog CY", line_of_business: "GENERAL_LIABILITY", policy_period_start: "2026-06-01T00:00:00Z", policy_period_end: "2027-05-31T23:59:59Z", aggregate_limit_cents: 1000000, per_occurrence_limit_cents: 250000, attachment_point_cents: 10000, premium_budget_cents: 200000, expected_captive_version: "${captive_ver}" }
              as: Underwriter
              captures: { program_id: $.data.id }
            - call: "POST /api/captives/${captive_id}/programs/${program_id}/quote"
              payload: {}
              as: Underwriter
            - call: "POST /api/captives/${captive_id}/programs/${program_id}/bind"
              payload: {}
              as: Underwriter
            - call: "POST /api/captives/${captive_id}/activate"
              payload: {}
              as: CaptiveManager
            - call: "POST /api/captives/${captive_id}/programs/${program_id}/activate"
              payload: {}
              as: Underwriter
            - call: "POST /api/captives/${captive_id}/programs/${program_id}/allocations"
              payload: { operating_unit_id: "${unit_id}", allocation_method: "EQUAL_SHARE", allocation_period_start: "2026-06-01T00:00:00Z", allocation_period_end: "2027-05-31T23:59:59Z" }
              as: Underwriter
              captures: { alloc_id: $.data.id }
          trigger:
            - call: "POST /api/captives/${captive_id}/programs/${program_id}/allocations/${alloc_id}/dispute"
              as: CaptiveManager
            - call: "POST /api/captives/${captive_id}/programs/${program_id}/allocations/${alloc_id}/resolve-dispute"
              as: CaptiveManager
          assert:
            - "PremiumAllocation.${alloc_id}.status == PROVISIONAL"

      - name: reserve_lifecycle_preliminary_to_filed
        claim_type: valid_transition
        grounds:
          - state_machines.ActuarialReserve
        distinguishing_aspect: |
          ActuarialReserve follows linear path PRELIMINARY -> REVIEWED -> CERTIFIED -> FILED.
          Each transition requires the correct role and preconditions.
        test_recipe:
          setup:
            - "CaptiveEntity ACTIVE, program IN_FORCE"
          setup_api_calls:
            - call: "POST /api/captives"
              payload: { captive_name: "Test Captive RL", domicile_jurisdiction: "VERMONT", formation_date: "2026-01-15T00:00:00Z", capitalization_amount: 500000 }
              as: CaptiveManager
              captures: { captive_id: $.data.id, captive_ver: $.data.version }
            - call: "POST /api/captives/${captive_id}/domicile-filings"
              payload: { filing_type: "INITIAL_FORMATION", jurisdiction: "VERMONT", supporting_documents: [{document_type: "ARTICLES", document_url: "https://docs.example.com/a.pdf", uploaded_at: "2026-01-15T00:00:00Z"}] }
              as: CaptiveManager
              captures: { filing_id: $.data.id }
            - call: "POST /api/captives/${captive_id}/domicile-filings/${filing_id}/submit"
              payload: {}
              as: CaptiveManager
            - call: "POST /api/captives/${captive_id}/domicile-filings/${filing_id}/acknowledge"
              payload: {}
              as: DomicileRegulator
            - call: "POST /api/captives/${captive_id}/domicile-filings/${filing_id}/approve"
              payload: {}
              as: DomicileRegulator
            - call: "POST /api/captives/${captive_id}/operating-units"
              payload: { unit_name: "Unit RL", unit_code: "URL", exposure_basis: "REVENUE", exposure_amount: 1000 }
              as: CaptiveManager
              captures: { unit_id: $.data.id }
            - call: "POST /api/captives/${captive_id}/programs"
              payload: { program_name: "GL Prog RL", line_of_business: "GENERAL_LIABILITY", policy_period_start: "2026-06-01T00:00:00Z", policy_period_end: "2027-05-31T23:59:59Z", aggregate_limit_cents: 1000000, per_occurrence_limit_cents: 250000, attachment_point_cents: 10000, premium_budget_cents: 200000, expected_captive_version: "${captive_ver}" }
              as: Underwriter
              captures: { program_id: $.data.id }
            - call: "POST /api/captives/${captive_id}/programs/${program_id}/quote"
              payload: {}
              as: Underwriter
            - call: "POST /api/captives/${captive_id}/programs/${program_id}/bind"
              payload: {}
              as: Underwriter
            - call: "POST /api/captives/${captive_id}/activate"
              payload: {}
              as: CaptiveManager
            - call: "POST /api/captives/${captive_id}/programs/${program_id}/activate"
              payload: {}
              as: Underwriter
            - call: "POST /api/captives/${captive_id}/programs/${program_id}/reserves"
              payload: { reserve_type: "CASE_RESERVE", actuarial_method: "CHAIN_LADDER", valuation_date: "2026-12-31T00:00:00Z" }
              as: Actuary
              captures: { reserve_id: $.data.id }
          trigger:
            - call: "POST /api/captives/${captive_id}/programs/${program_id}/reserves/${reserve_id}/review"
              as: Actuary
            - call: "POST /api/captives/${captive_id}/programs/${program_id}/reserves/${reserve_id}/certify"
              payload: { carried_reserve_cents: 100000 }
              as: Actuary
            - call: "POST /api/captives/${captive_id}/programs/${program_id}/reserves/${reserve_id}/file"
              as: CaptiveManager
          assert:
            - "ActuarialReserve.${reserve_id}.status == FILED"

  # =========================================================================
  # Section: calculations — correctness, input set filtering, constants, precision
  # =========================================================================
  - section: calculations
    instances:
      - name: loss_ratio_zero_when_no_claims
        claim_type: correct_result
        grounds:
          - calculations.loss_ratio_calculation
          - entities.InsuranceProgram.fields.loss_ratio
        distinguishing_aspect: |
          When no claims exist and premium_allocated_cents == 0, loss_ratio == 0.
          Edge case: division by zero is handled by returning 0.
        test_recipe:
          setup:
            - "CaptiveEntity ACTIVE, program IN_FORCE with no claims"
          setup_api_calls:
            - call: "POST /api/captives"
              payload: { captive_name: "Test Captive LR", domicile_jurisdiction: "VERMONT", formation_date: "2026-01-15T00:00:00Z", capitalization_amount: 500000 }
              as: CaptiveManager
              captures: { captive_id: $.data.id, captive_ver: $.data.version }
            - call: "POST /api/captives/${captive_id}/domicile-filings"
              payload: { filing_type: "INITIAL_FORMATION", jurisdiction: "VERMONT", supporting_documents: [{document_type: "ARTICLES", document_url: "https://docs.example.com/a.pdf", uploaded_at: "2026-01-15T00:00:00Z"}] }
              as: CaptiveManager
              captures: { filing_id: $.data.id }
            - call: "POST /api/captives/${captive_id}/domicile-filings/${filing_id}/submit"
              payload: {}
              as: CaptiveManager
            - call: "POST /api/captives/${captive_id}/domicile-filings/${filing_id}/acknowledge"
              payload: {}
              as: DomicileRegulator
            - call: "POST /api/captives/${captive_id}/domicile-filings/${filing_id}/approve"
              payload: {}
              as: DomicileRegulator
            - call: "POST /api/captives/${captive_id}/programs"
              payload: { program_name: "GL Prog LR", line_of_business: "GENERAL_LIABILITY", policy_period_start: "2026-06-01T00:00:00Z", policy_period_end: "2027-05-31T23:59:59Z", aggregate_limit_cents: 1000000, per_occurrence_limit_cents: 250000, attachment_point_cents: 10000, premium_budget_cents: 200000, expected_captive_version: "${captive_ver}" }
              as: Underwriter
              captures: { program_id: $.data.id }
            - call: "POST /api/captives/${captive_id}/programs/${program_id}/quote"
              payload: {}
              as: Underwriter
            - call: "POST /api/captives/${captive_id}/programs/${program_id}/bind"
              payload: {}
              as: Underwriter
            - call: "POST /api/captives/${captive_id}/activate"
              payload: {}
              as: CaptiveManager
            - call: "POST /api/captives/${captive_id}/programs/${program_id}/activate"
              payload: {}
              as: Underwriter
          trigger:
            - call: "GET /api/captives/${captive_id}/programs/${program_id}"
              as: Underwriter
          assert:
            - "InsuranceProgram.${program_id}.loss_ratio == 0"
            - "InsuranceProgram.${program_id}.claims_incurred_cents == 0"
            - "InsuranceProgram.${program_id}.premium_allocated_cents == 0"

      - name: fronting_fee_calculation_correctness
        claim_type: correct_result
        grounds:
          - calculations.fronting_fee_calculation
          - entities.FrontingArrangement.fields.fronting_fee_amount_cents
        distinguishing_aspect: |
          fronting_fee_amount_cents = premium_allocated_cents * fronting_fee_pct,
          rounded to integer cents with round_half_up.
        test_recipe:
          setup:
            - "CaptiveEntity ACTIVE, program with fronting activated, premium allocated"
          setup_api_calls:
            - call: "POST /api/captives"
