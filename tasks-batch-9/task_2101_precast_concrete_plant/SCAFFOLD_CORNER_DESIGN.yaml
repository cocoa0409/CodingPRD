  # =========================================================================
  - section: validations
    instances:

      - name: missing_auth_headers_returns_unauthenticated
        claim_type: Violation → Error
        grounds:
          - validations[priority=1]
          - errors[ERR_UNAUTHENTICATED]
        distinguishing_aspect: "A request with no X-User-Role or no X-User-ID is rejected with ERR_UNAUTHENTICATED (401) before any role, existence or schema rule runs."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T06:00:00Z" }
              as: PlantAdmin
              as_user_id: "admin-1"
          trigger:
            - call: "POST /projects"
              payload: { name: "Ghost", jobsite_city: "Nashville", erection_start_date: "2026-09-15" }
              as: ""
              captures: { err_id: $.data.error_id }
          assert:
            - "${err_id} == ERR_UNAUTHENTICATED with HTTP 401"
            - "the same call with an X-User-Role but a blank X-User-ID also returns ERR_UNAUTHENTICATED"
            - "no Project row is created"

      - name: role_check_precedes_path_existence
        claim_type: Priority Ordering
        grounds:
          - validations[priority=2]
          - validations[priority=3]
          - errors[ERR_UNAUTHORIZED]
        distinguishing_aspect: "A PermitCoordinator calling POST /mix-designs/{id}/qualify with an id that does not exist gets ERR_UNAUTHORIZED (priority 2), never ERR_MIX_DESIGN_NOT_FOUND (priority 3)."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T06:00:00Z" }
              as: PlantAdmin
              as_user_id: "admin-1"
          trigger:
