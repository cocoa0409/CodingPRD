            - call: "POST /harbor/bookings/${bk_id}/confirm"
              payload: { expected_trip_version: "${trip1_v}" }
              as: Rider
              as_user_id: "rider-ann"
            - call: "POST /harbor/trips/${trip1_id}/board"
              payload: { boarded_booking_ids: ["${bk_id}"] }
              as: VesselMaster
              as_user_id: "${crew_id}"
            - call: "POST /harbor/trips/${trip2_id}/board"
              payload: { boarded_booking_ids: [] }
              as: VesselMaster
              as_user_id: "${crew_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-12T14:35:00Z" }
              as: HarborAdmin
              as_user_id: "admin-1"
            - call: "POST /harbor/trips/${trip1_id}/depart"
              payload: {}
              as: VesselMaster
              as_user_id: "${crew_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-12T16:35:00Z" }
              as: HarborAdmin
              as_user_id: "admin-1"
            - call: "POST /harbor/trips/${trip2_id}/depart"
              payload: {}
              as: VesselMaster
              as_user_id: "${crew_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-12T16:40:00Z" }
              as: HarborAdmin
              as_user_id: "admin-1"
          trigger:
            - call: "POST /harbor/trips/${trip1_id}/complete"
              payload: {}
              as: VesselMaster
              as_user_id: "${crew_id}"
          assert:
            - "DockSlot.${slot1_id}.status == CONSUMED"
            - "DockSlot.${slot1_id}.landing_fee_cents == 1760"
            - "DockSlot.${slot1_id}.projected_fee_cents == 0"
            - "DockSlot.${slot2_id}.status == RESERVED"
            - "DockSlot.${slot2_id}.projected_fee_cents == 1200"
            - "DockSlot.${slot2_id}.landing_fee_cents == 0"
            - "Dock.${dock_a_id}.accrued_fee_cents == 2960"
            - "Dock.${dock_a_id}.accrued_fee_cents == DockSlot.${slot1_id}.landing_fee_cents + DockSlot.${slot2_id}.projected_fee_cents"
            - "Dock.${dock_a_id}.fee_status == ACCRUING"
            - "Trip.${trip1_id}.provisional_fee_cents == 1160"
            - "Trip.${trip1_id}.final_fee_cents == 1760"
            - "Trip.${trip2_id}.settlement_status == PROVISIONAL"
