  - name: Scheduler
    description: "Registers crews, proposes/books/reschedules/cancels install jobs, starts/completes installs"
    identity: opaque
    exclusive_operations:
      - "POST /install-jobs"
      - "POST /install-jobs/{id}/book"
      - "POST /install-jobs/{id}/rebook"
      - "POST /install-jobs/{id}/cancel"
      - "POST /install-jobs/{id}/start"
      - "POST /install-jobs/{id}/complete"
    shared_operations:
      - "POST /crews (with PlatformAdmin)"
      - "GET reads on crews/install-jobs/manufacture-orders"

  - name: ManufacturingOps
    description: "Runs the plant: starts/completes manufacture orders; adjudicates warranty claims"
    identity: opaque
    exclusive_operations:
