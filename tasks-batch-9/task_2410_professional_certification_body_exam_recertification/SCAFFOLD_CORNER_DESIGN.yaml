        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules.schedule-seat-stale-session
          - validations[priority=11]
          - errors.ERR_STALE_VERSION
          - endpoints.POST_/exam-registrations/{id}/schedule
          - calculations.session_seat_occupancy
          - entities.ExamSession.computed_fields.seats_reserved
