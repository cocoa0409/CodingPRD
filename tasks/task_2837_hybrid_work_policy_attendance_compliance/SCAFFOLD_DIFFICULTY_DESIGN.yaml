              payload: { seat_allocation_id: "${alloc_a}", employee_id: "${e1_id}", desk_index: 12, start_date: "2026-10-05", end_date: "2026-10-09" }
              as: WorkplaceProgramOffice
          assert:
            - "Call 1 returns HTTP 409 with error id ERR_NO_ELIGIBLE_DESK - the only allocation is RESERVED, so the eligibility filter yields an empty pool"
            - "Call 2 returns HTTP 200 with SeatAllocation.${alloc_a}.status == COMMITTED"
            - "Call 3 is byte-identical to call 1 and now returns HTTP 201 with seat_allocation_id == ${alloc_a}, desk_index == 1 (the lowest index of the anchor-matching neighborhood) and status == ASSIGNED"
            - "Call 4 returns HTTP 409 with error id ERR_NO_ELIGIBLE_DESK: T2-SIDE has no COMMITTED allocation, and N-A1's desks are not reachable from another team"
            - "Call 5 returns HTTP 409 with error id ERR_TEAM_ALLOCATION_MISMATCH - naming the allocation explicitly does not bypass the team check"
            - "Call 6 returns HTTP 409 with error id ERR_ASSIGNMENT_OUTSIDE_WINDOW because 2026-10-05..2026-10-09 falls in 2026-W41, which the half-open window [2026-W37, 2026-W41) excludes"
            - "GET /desk-assignments?employee_id=${e2_id} returns 0 rows and GET /desk-assignments?seat_allocation_id=${alloc_a} returns exactly 1 row"

  - rule_id: resource_temporal_overlap
    instances:

      - name: seat_allocation_half_open_week_aggregate_overlap_matrix
        grounds:
          - calculations.neighborhood_peak_load
          - validations[priority=70, ERR_NEIGHBORHOOD_CAPACITY_EXCEEDED]
          - entities.SeatAllocation.fields.window_start_week
          - entities.SeatAllocation.fields.window_end_week
        interval_semantics: half_open_iso_week_aggregate
        distinguishing_aspect: |
          The capacity rule is per-ISO-week AGGREGATE over a HALF-OPEN window, so all
          three interval relations must be distinguished with the same capacity:
          [W37,W40) and [W40,W43) merely touch and never sum, a straddling
          [W39,W41) sums against BOTH of them in different weeks, and only the
          worst single week decides. A closed-interval reading of the same rows
          would report a peak of 20 in W40 for the first two allocations alone.
        test_recipe:
          setup:
            - "One OPEN cycle 2026-09-01..2026-12-31 and team T3-BIG with headcount_planned 250 and expected_days_in_office_per_week 1, so entitled_seats is 53 and the band-70 entitlement rule never binds."
            - "Neighborhood N-C1 with seat_count 30 and buffer_seats 4, usable capacity 26."
            - "Five RESERVED SeatAllocations on N-C1, each created against the neighborhood version observed immediately before it: A 10 seats [2026-W37, 2026-W40), B 10 seats [2026-W40, 2026-W43), C 10 seats [2026-W39, 2026-W41), D 7 seats [2026-W39, 2026-W40), E 5 seats [2026-W39, 2026-W40)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T09:00:00Z" }
              as: WorkplaceProgramOffice
            - call: "POST /policy-cycles"
              payload: { cycle_label: "FY27-RT1", effective_from: "2026-09-01", effective_to: "2026-12-31", days_in_office_floor: 1, badge_weight: 0.60, network_weight: 0.40, collaboration_target_score: 70.00, equity_variance_threshold_pct: 20.00 }
              as: WorkplaceProgramOffice
              captures: { cyc_id: $.data.id }
            - call: "POST /teams"
              payload: { policy_cycle_id: "${cyc_id}", team_code: "T3-BIG", expected_days_in_office_per_week: 1, core_collaboration_days: ["WED"], headcount_planned: 250, signal_corroboration_required: false }
              as: WorkplaceProgramOffice
              captures: { t3_id: $.data.id }
            - call: "POST /neighborhoods"
              payload: { policy_cycle_id: "${cyc_id}", anchor_team_id: "${t3_id}", neighborhood_code: "N-C1", site_code: "NYC-01", seat_count: 30, buffer_seats: 4, desk_index_from: 1, desk_index_to: 30 }
              as: WorkplaceProgramOffice
              captures: { n1_id: $.data.id, nv1: $.data.version }
            - call: "POST /seat-allocations"
              payload: { neighborhood_id: "${n1_id}", team_id: "${t3_id}", allocated_seats: 10, window_start_week: "2026-W37", window_end_week: "2026-W40", expected_neighborhood_version: "${nv1}" }
              as: WorkplaceProgramOffice
              captures: { alloc_a: $.data.id }
            - call: "GET /neighborhoods/${n1_id}"
              payload: {}
              as: WorkplaceProgramOffice
              captures: { nv2: $.data.version }
            - call: "POST /seat-allocations"
              payload: { neighborhood_id: "${n1_id}", team_id: "${t3_id}", allocated_seats: 10, window_start_week: "2026-W40", window_end_week: "2026-W43", expected_neighborhood_version: "${nv2}" }
              as: WorkplaceProgramOffice
              captures: { alloc_b: $.data.id }
            - call: "GET /neighborhoods/${n1_id}"
              payload: {}
              as: WorkplaceProgramOffice
              captures: { nv3: $.data.version }
            - call: "POST /seat-allocations"
              payload: { neighborhood_id: "${n1_id}", team_id: "${t3_id}", allocated_seats: 10, window_start_week: "2026-W39", window_end_week: "2026-W41", expected_neighborhood_version: "${nv3}" }
              as: WorkplaceProgramOffice
              captures: { alloc_c: $.data.id }
            - call: "GET /neighborhoods/${n1_id}"
              payload: {}
              as: WorkplaceProgramOffice
              captures: { nv4: $.data.version }
            - call: "POST /seat-allocations"
              payload: { neighborhood_id: "${n1_id}", team_id: "${t3_id}", allocated_seats: 7, window_start_week: "2026-W39", window_end_week: "2026-W40", expected_neighborhood_version: "${nv4}" }
              as: WorkplaceProgramOffice
              captures: { alloc_d: $.data.id }
            - call: "GET /neighborhoods/${n1_id}"
              payload: {}
              as: WorkplaceProgramOffice
              captures: { nv5: $.data.version }
            - call: "POST /seat-allocations"
              payload: { neighborhood_id: "${n1_id}", team_id: "${t3_id}", allocated_seats: 5, window_start_week: "2026-W39", window_end_week: "2026-W40", expected_neighborhood_version: "${nv5}" }
              as: WorkplaceProgramOffice
              captures: { alloc_e: $.data.id }
          trigger:
            - call: "POST /seat-allocations/${alloc_a}/commit"
              payload: {}
              as: WorkplaceProgramOffice
            - call: "POST /seat-allocations/${alloc_b}/commit"
              payload: {}
              as: WorkplaceProgramOffice
            - call: "POST /seat-allocations/${alloc_c}/commit"
              payload: {}
              as: WorkplaceProgramOffice
            - call: "POST /seat-allocations/${alloc_d}/commit"
              payload: {}
              as: WorkplaceProgramOffice
            - call: "POST /seat-allocations/${alloc_e}/commit"
              payload: {}
              as: WorkplaceProgramOffice
          assert:
            - "DISJOINT/TOUCHING: after commits A and B, Neighborhood.${n1_id}.peak_committed_seats == 10 and utilization_pct == 38.46 - [2026-W37, 2026-W40) and [2026-W40, 2026-W43) never sum, because W40 belongs only to B"
            - "OVERLAPPING: after commit C, peak_committed_seats == 20 (W39 carries A + C and W40 carries B + C) and utilization_pct == 76.92"
            - "Commit D returns HTTP 409 with error id ERR_NEIGHBORHOOD_CAPACITY_EXCEEDED because 2026-W39 would carry 10 + 10 + 7 == 27 seats against usable capacity 26; SeatAllocation.${alloc_d}.status stays RESERVED and line_chargeback_cents stays 0"
            - "Commit E returns HTTP 200 because the same week carries 10 + 10 + 5 == 25 seats, one below capacity; peak_committed_seats == 25 and utilization_pct == 96.15, so allocation_state == TIGHT"
            - "The failed commit D did not consume capacity: E's commit was evaluated against 25, not 32"
            - "SeatAllocation.${alloc_a}.weeks_in_window == 3, ${alloc_b} == 3, ${alloc_c} == 2, ${alloc_d} == 1, ${alloc_e} == 1"
            - "Neighborhood.${n1_id}.committed_seats == 0 throughout, because the logical clock's week 2026-W36 precedes every window; only peak_committed_seats moves"
            - "GET /seat-allocations?neighborhood_id=${n1_id}&status=COMMITTED returns exactly 4 rows (A, B, C, E)"

      - name: desk_assignment_closed_interval_changeover_buffer
        grounds:
          - validations[priority=74, ERR_DESK_CHANGEOVER_CONFLICT]
          - calculations.desk_selector.constants.CHANGEOVER_BUFFER_DAYS
          - state_machines.DeskAssignment.ASSIGNED_to_VACATED
        interval_semantics: closed_date_interval_with_changeover_buffer
        distinguishing_aspect: |
          Desks use the OPPOSITE interval convention to seat windows: a CLOSED date
          interval plus a one-day changeover buffer, so two assignments that merely
          touch DO conflict and one clear day between them is enough. The
          predicate is per (neighborhood, desk_index) and only against ASSIGNED
          rows, so vacating the incumbent makes the previously refused request legal
          without changing a single date.
        test_recipe:
          setup:
            - "One OPEN cycle, team T1-CORE (headcount 12, 3 expected days, entitled_seats 10), five ACTIVE employees E-3001..E-3005, Neighborhood N-D1 (30 seats, 4 buffer, desks 1..30) and one COMMITTED SeatAllocation of 5 seats over [2026-W37, 2026-W41)."
