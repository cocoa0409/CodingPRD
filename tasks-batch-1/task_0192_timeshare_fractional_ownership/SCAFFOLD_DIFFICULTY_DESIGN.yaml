  - rule_id: priority_pair_validation_conflict
    instances:
      - name: rescind_state_vs_rescission_window_priority
        grounds:
          - validations[priority=7]
          - validations[priority=8]
          - state_machines.Contract.PENDING_RESCISSION_to_RESCINDED
        distinguishing_aspect: |
          Dual failure where category `state` (priority 7, ERR_INVALID_STATE) outranks
          category `business_safety` (priority 8, ERR_RESCISSION_WINDOW_CLOSED): an ACTIVE contract
          (not PENDING_RESCISSION) rescinded after the window closed returns ERR_INVALID_STATE.
        test_recipe:
          setup:
            - "Resort R; DEEDED POINTS contract C activated (ACTIVE) at clock 2026-01-08; clock advanced to 2026-02-01 (window long closed)."
          setup_api_calls:
            - call: "POST /resorts"
