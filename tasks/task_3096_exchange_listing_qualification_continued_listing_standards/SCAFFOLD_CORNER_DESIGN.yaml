  # ===========================================================================
  - section: cross_cutting_complexity_layers
    instances:

      - name: approve_with_stale_issuer_version_returns_412
        claim_type: OCC stale-version
        grounds:
          - concurrency_rules[application-approve-stale-issuer]
          - errors.ERR_STALE_VERSION
          - validations[priority=20]
        distinguishing_aspect: "The OCC rule on application approval: after a first successful approval bumped Issuer.version, a second approve carrying the pre-approval version fails 412 ERR_STALE_VERSION (with the state check on the second application also satisfiable — OCC is asserted at priority 20 against a still-SUBMITTED second application whose submit is blocked, so the stale call is replayed on the approved application only for the version check ordering: ERR_INVALID_STATE at priority 4 wins over OCC — therefore the deterministic stale-version probe is run-annual-fees)."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Issuer LISTED on CAPITAL; the 2026 annual fee already assessed at version V."
          setup_api_calls:
            - *c_clock
            - *c_issuer
            - *c_app_capital
            - *c_submit
            - *c_gv
            - *c_approve
            - call: "GET /issuers/${issuer_id}"
              payload: {}
              as: ListingAnalyst
              captures: { issuer_v2: $.data.version }
            - call: "POST /issuers/${issuer_id}/fee-assessments/run-annual-fees"
              payload: { shares_outstanding: 3000000, expected_issuer_version: "${issuer_v2}" }
              as: FinanceOfficer
          trigger:
            - call: "POST /issuers/${issuer_id}/fee-assessments/run-annual-fees"
              payload: { shares_outstanding: 3000000, expected_issuer_version: "${issuer_v2}" }
              as: FinanceOfficer
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 412 and error_id == ERR_STALE_VERSION — the first run bumped Issuer.version so the replayed expected version is stale"
            - "error_id != ERR_FEE_ALREADY_ASSESSED (priority 20 OCC is evaluated on the stale-version surface declared for this endpoint)"
            - "GET /issuers/${issuer_id}/fee-assessments with fee_kind ANNUAL returns exactly 1 row"

