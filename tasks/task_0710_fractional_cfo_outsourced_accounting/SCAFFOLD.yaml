scenario: |
  710. Fractional CFO & Outsourced Accounting (Pilot/Bench style): client onboarding & ledger setup,
  monthly bookkeeping & close checklist, financial-statement & KPI dashboard, AP/AR & payroll
  coordination, tax-prep handoff & advisory, tier/retainer billing, cash-flow forecast,
  catch-up/cleanup project

domain_name: fractional-cfo-accounting
api_prefix: ""

complexity_profile:
  primary_archetype: workflow_orchestration
  secondary_archetype: ledger_reconciliation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - derived_field_reconciliation
    - rate_threshold_triggers

  entity_topology: hybrid
  # A Client root owns onboarding, retainer, ledger accounts and catch-up projects (hierarchy),
  # but MonthlyClose periods, AP/AR items, payroll runs, forecasts and tax handoffs are flat
  # peer entities linked back to the Client and to each other by FK (cross-aggregate references).

  state_machine_shape: parallel
  # Client carries two independent state dimensions (onboarding_status × engagement_status).
  # MonthlyClose is compound (status derived from CloseTask children + posts a parallel
  # review_status). CatchupProject is cyclic (revision loops). TaxHandoff is branching fork-join.

  relationship_patterns:
    - one_to_many        # Client -> MonthlyClose, Client -> LedgerAccount, MonthlyClose -> CloseTask
    - cross_aggregate    # ARInvoice/APBill/PayrollRun reference both Client and MonthlyClose
    - self_referential   # LedgerAccount.parent_account_id forms the chart-of-accounts tree

  role_model: peer_roles
  # CFO, Bookkeeper, ClientContact own different resource types; PlatformAdmin is operational.

  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — EMIT VERBATIM)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Client
    parent: null
    common_fields: true
    fields:
      - name: legal_name
        type: string
        source: input
        description: Registered business name of the client.
      - name: state_code
        type: string
        source: input
        description: Two-letter US state of incorporation, e.g. "CA".
        constraints: 2 uppercase letters
      - name: retainer_tier
        type: enum
        source: input
        description: Subscription tier governing base fee and included transaction volume.
        constraints: one of {ESSENTIALS, GROWTH, CFO}
      - name: onboarding_status
        type: enum
        source: system
        description: Onboarding dimension of the client lifecycle (see Client onboarding state machine).
        default: LEAD
        constraints: one of {LEAD, KICKOFF_SCHEDULED, LEDGER_SETUP, ONBOARDED}
      - name: engagement_status
        type: enum
        source: system
        description: Billing/engagement dimension of the client lifecycle, independent of onboarding_status.
        default: PROSPECT
        constraints: one of {PROSPECT, ACTIVE, PAUSED, OFFBOARDED}
      - name: included_txn_count
        type: integer
        source: computed
        description: Included monthly transaction volume implied by retainer_tier (200/500/1200), copied on tier set.
      - name: catchup_active
        type: boolean
        source: computed
        description: True when this client has a CatchupProject in {SCOPED, IN_PROGRESS}; drives the retainer catch-up surcharge.
        default: false
      - name: covenant_floor_cents
        type: integer
        source: input
        description: Minimum projected cash balance (in cents) the client's bank covenant requires; gates cash-flow forecast approval.
        default: 0
      - name: open_close_count
        type: integer
        source: computed
        description: Number of MonthlyClose rows for this client whose status is not in {FINALIZED}; reconciled on every MonthlyClose mutation.
        default: 0

  - name: LedgerAccount
    parent: Client
    common_fields: true
    fields:
      - name: client_id
        type: string
        source: input
        description: "FK -> Client.id; the client whose chart of accounts this row belongs to."
      - name: parent_account_id
        type: string
        source: input
        description: "FK -> LedgerAccount.id; self-referential parent in the chart-of-accounts tree; null for top-level accounts."
        default: null
      - name: account_code
        type: string
        source: input
        description: Numeric account code, unique per client, e.g. "4000".
      - name: account_type
        type: enum
        source: input
        description: Statement classification of the account.
        constraints: one of {ASSET, LIABILITY, EQUITY, REVENUE, EXPENSE}
      - name: name
        type: string
        source: input
        description: Human-readable account name, e.g. "Sales Revenue".
      - name: status
        type: enum
        source: system
        description: Whether the account is usable for postings.
        default: ACTIVE
        constraints: one of {ACTIVE, ARCHIVED}

  - name: CatchupProject
    parent: Client
    common_fields: true
    fields:
      - name: client_id
        type: string
        source: input
        description: "FK -> Client.id; the client whose historical books this catch-up/cleanup project covers."
      - name: months_behind
        type: integer
        source: input
        description: Number of historical months requiring cleanup; drives scope sizing.
        constraints: integer >= 1
      - name: status
        type: enum
        source: system
        description: Cyclic project lifecycle with revision loops (see CatchupProject state machine).
        default: DRAFT
        constraints: one of {DRAFT, SCOPED, IN_PROGRESS, CLIENT_REVIEW, REVISION, COMPLETED, CANCELLED}
      - name: revision_rounds
        type: integer
        source: computed
        description: Count of times the project has cycled back from CLIENT_REVIEW to REVISION; increments on each rejection.
        default: 0
      - name: quoted_fee_cents
        type: integer
        source: input
        description: One-time cleanup fee quoted to the client, in cents.

  - name: MonthlyClose
    parent: null
    common_fields: true
    fields:
      - name: client_id
        type: string
        source: input
        description: "FK -> Client.id; the client this monthly bookkeeping close belongs to."
      - name: period_year
        type: integer
        source: input
        description: Fiscal year of the accounting period being closed, e.g. 2026.
      - name: period_month
        type: integer
        source: input
        description: Fiscal month (1-12) of the accounting period being closed.
        constraints: integer in 1..12
      - name: status
        type: enum
        source: system
        description: Compound close status derived from CloseTask children (see MonthlyClose state machine).
        default: OPEN
        constraints: one of {OPEN, IN_PROGRESS, READY_FOR_REVIEW, FINALIZED, REOPENED}
      - name: review_status
        type: enum
        source: system
        description: Independent review dimension that advances on its own axis alongside status once tasks are complete.
        default: NOT_STARTED
        constraints: one of {NOT_STARTED, UNDER_REVIEW, APPROVED, CHANGES_REQUESTED}
      - name: txn_count
        type: integer
        source: input
        description: Number of bookkeeping transactions processed in this period; feeds the retainer overage calculation.
        default: 0
      - name: completion_pct
        type: number
        source: computed
        description: Weighted completion percentage of CloseTask children (FINAL variant; DONE+WAIVED weight over total weight), recomputed on every CloseTask mutation.
        default: 0
      - name: provisional_completion_pct
        type: number
        source: computed
        description: Weighted completion percentage counting IN_REVIEW tasks as complete (PROVISIONAL variant), recomputed on every CloseTask mutation.
        default: 0

  - name: CloseTask
    parent: MonthlyClose
    common_fields: true
    fields:
      - name: monthly_close_id
        type: string
        source: input
        description: "FK -> MonthlyClose.id; the close checklist this task belongs to."
      - name: name
        type: string
        source: input
        description: Checklist item label, e.g. "Reconcile bank account".
      - name: weight
        type: integer
        source: input
        description: Relative weight of this task in the close completion percentage.
        constraints: integer >= 1
      - name: status
        type: enum
        source: system
        description: Task lifecycle within the checklist.
        default: PENDING
        constraints: one of {PENDING, IN_REVIEW, DONE, WAIVED, BLOCKED}
      - name: blocking_reason
        type: string
        source: input
        description: Free-text reason supplied when moving a task to BLOCKED.
        default: null

  - name: ARInvoice
    parent: null
    common_fields: true
    fields:
      - name: client_id
        type: string
        source: input
        description: "FK -> Client.id; the client whose accounts-receivable this invoice belongs to."
      - name: counterparty_name
        type: string
        source: input
        description: Name of the customer who owes the invoice.
      - name: amount_cents
        type: integer
        source: input
        description: Invoiced amount in cents.
        constraints: integer >= 1
      - name: issue_date
        type: datetime
        source: input
        description: Date the invoice was issued (ISO 8601 UTC).
      - name: due_date
        type: datetime
        source: input
        description: Date payment is due; aging buckets are measured against the logical clock.
      - name: status
        type: enum
        source: system
        description: AR collection lifecycle.
        default: OPEN
        constraints: one of {OPEN, DISPUTED, PAID, WRITTEN_OFF}
      - name: paid_amount_cents
        type: integer
        source: system
        description: Cumulative amount collected against this invoice, in cents.
        default: 0

  - name: APBill
    parent: null
    common_fields: true
    fields:
      - name: client_id
        type: string
        source: input
        description: "FK -> Client.id; the client whose accounts-payable this bill belongs to."
      - name: vendor_name
        type: string
        source: input
        description: Name of the vendor to be paid.
      - name: amount_cents
        type: integer
        source: input
        description: Bill amount in cents.
        constraints: integer >= 1
      - name: due_date
        type: datetime
        source: input
        description: Date the bill is due to the vendor.
      - name: status
        type: enum
        source: system
        description: AP approval and payment lifecycle.
        default: ENTERED
        constraints: one of {ENTERED, APPROVED, SCHEDULED, PAID, VOID}
      - name: scheduled_pay_date
        type: datetime
        source: input
        description: Date the approved bill is scheduled to be paid; required to move to SCHEDULED.
        default: null

  - name: PayrollRun
    parent: null
    common_fields: true
    fields:
      - name: client_id
        type: string
        source: input
        description: "FK -> Client.id; the client whose payroll this run coordinates."
      - name: monthly_close_id
        type: string
        source: input
        description: "FK -> MonthlyClose.id; the close period this payroll run posts into."
      - name: pay_date
        type: datetime
        source: input
        description: Date employees are paid.
      - name: pay_period_start
        type: datetime
        source: input
        description: Inclusive start of the pay period this run covers; the period is the half-open interval [pay_period_start, pay_period_end).
      - name: pay_period_end
        type: datetime
        source: input
        description: Exclusive end of the pay period; two non-REVERSED runs for the same client may not have overlapping half-open [start, end) intervals.
      - name: total_employer_cost_cents
        type: integer
        source: input
        description: Total employer payroll cost (wages + taxes) to be allocated across departments, in cents.
        constraints: integer >= 1
      - name: status
        type: enum
        source: system
        description: Payroll coordination lifecycle.
        default: DRAFT
        constraints: one of {DRAFT, ALLOCATED, POSTED, REVERSED}

  - name: PayrollAllocation
    parent: PayrollRun
    common_fields: true
    fields:
      - name: payroll_run_id
        type: string
        source: input
        description: "FK -> PayrollRun.id; the run this department allocation belongs to."
      - name: department_name
        type: string
        source: input
        description: Department receiving a share of employer cost.
      - name: dept_gross_cents
        type: integer
        source: input
        description: Department gross wages, the weight used to allocate total employer cost.
        constraints: integer >= 1
      - name: allocated_cents
        type: integer
        source: computed
        description: Cents allocated to this department after the pinned round-per-line-then-remainder rule (see payroll_cost_allocation calculation).
        default: 0

  - name: CashFlowForecast
    parent: null
    common_fields: true
    fields:
      - name: client_id
        type: string
        source: input
        description: "FK -> Client.id; the client this 13-week-style forecast belongs to."
      - name: opening_balance_cents
        type: integer
        source: input
        description: Cash balance at the start of the forecast horizon, in cents.
      - name: status
        type: enum
        source: system
        description: Forecast lifecycle; APPROVED requires the covenant floor to hold.
        default: DRAFT
        constraints: one of {DRAFT, APPROVED, SUPERSEDED}
      - name: ending_balance_cents
        type: integer
        source: computed
        description: Opening balance plus the net of all ForecastLine rows, recomputed on every line mutation.
        default: 0
      - name: min_projected_balance_cents
        type: integer
        source: computed
        description: Minimum running cash balance over the chronologically ordered ForecastLine rows, recomputed on every line mutation.
        default: 0

  - name: ForecastLine
    parent: CashFlowForecast
    common_fields: true
    fields:
      - name: forecast_id
        type: string
        source: input
        description: "FK -> CashFlowForecast.id; the forecast this projected cash movement belongs to."
      - name: effective_date
        type: datetime
        source: input
        description: Date the projected cash movement lands; running balance is processed in effective_date order.
      - name: direction
        type: enum
        source: input
        description: Whether this line adds to or subtracts from cash.
        constraints: one of {INFLOW, OUTFLOW}
      - name: amount_cents
        type: integer
        source: input
        description: Absolute magnitude of the projected movement, in cents.
        constraints: integer >= 1

  - name: TaxHandoff
    parent: null
    common_fields: true
    fields:
      - name: client_id
        type: string
        source: input
        description: "FK -> Client.id; the client whose tax-prep package is being handed off to the external preparer."
      - name: tax_year
        type: integer
        source: input
        description: Tax year being prepared, e.g. 2025.
      - name: status
        type: enum
        source: system
        description: Branching fork-join handoff lifecycle (see TaxHandoff state machine).
        default: PREPARING
        constraints: one of {PREPARING, BOOKS_REVIEW, ADVISORY_REVIEW, READY, DELIVERED, RETURNED}
      - name: books_signoff
        type: boolean
        source: system
        description: Whether the books-review branch has signed off; both branches must sign off to reach READY.
        default: false
      - name: advisory_signoff
        type: boolean
        source: system
        description: Whether the advisory-review branch has signed off; both branches must sign off to reach READY.
        default: false

  - name: RetainerInvoice
    parent: Client
    common_fields: true
    fields:
      - name: client_id
        type: string
        source: input
        description: "FK -> Client.id; the client being billed for this retainer period."
      - name: monthly_close_id
        type: string
        source: input
        description: "FK -> MonthlyClose.id; the close period whose txn_count drives the overage portion of this invoice."
      - name: base_fee_cents
        type: integer
        source: computed
        description: Tier base fee in cents at issuance.
        default: 0
      - name: overage_cents
        type: integer
        source: computed
        description: Metered overage above the tier's included transaction volume, in cents.
        default: 0
      - name: surcharge_cents
        type: integer
        source: computed
        description: Catch-up surcharge (20% of base) applied when the client had an active CatchupProject at issuance, in cents.
        default: 0
      - name: total_cents
        type: integer
        source: computed
        description: base_fee_cents + overage_cents + surcharge_cents.
        default: 0
      - name: status
        type: enum
        source: system
        description: Retainer invoice lifecycle.
        default: ISSUED
        constraints: one of {ISSUED, PAID, VOID}

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  # --- Client: PARALLEL state dimensions (onboarding_status × engagement_status) ---
  - entity: Client
    initial_state: LEAD                       # onboarding dimension initial
    terminal_states: [OFFBOARDED]             # engagement-dimension terminal
    transitions:
      # onboarding dimension
      - from: LEAD
        to: KICKOFF_SCHEDULED
        trigger: "POST /clients/{id}/schedule-kickoff"
        actor: CFO
        preconditions:
          - "Client.onboarding_status == LEAD"
        side_effects:
          - "set onboarding_status = KICKOFF_SCHEDULED"
          - "increments Client.version by 1"
        note: onboarding dimension only; engagement_status untouched
      - from: KICKOFF_SCHEDULED
        to: LEDGER_SETUP
        trigger: "POST /clients/{id}/start-ledger-setup"
        actor: Bookkeeper
        preconditions:
          - "Client.onboarding_status == KICKOFF_SCHEDULED"
        side_effects:
          - "set onboarding_status = LEDGER_SETUP"
          - "increments Client.version by 1"
      - from: LEDGER_SETUP
        to: ONBOARDED
        trigger: "POST /clients/{id}/complete-onboarding"
        actor: CFO
        preconditions:
          - "Client.onboarding_status == LEDGER_SETUP"
          - "at least one LedgerAccount with status ACTIVE exists for this client"
        side_effects:
          - "set onboarding_status = ONBOARDED"
          - "increments Client.version by 1"
      # engagement dimension (independent axis)
      - from: PROSPECT
        to: ACTIVE
        trigger: "POST /clients/{id}/activate-engagement"
        actor: CFO
        preconditions:
          - "Client.engagement_status == PROSPECT"
          - "Client.onboarding_status == ONBOARDED"
        side_effects:
          - "set engagement_status = ACTIVE"
          - "increments Client.version by 1"
        note: cross-dimension guard — engagement may only activate once the onboarding axis reaches ONBOARDED
      - from: ACTIVE
        to: PAUSED
        trigger: "POST /clients/{id}/pause-engagement"
        actor: CFO
        preconditions:
          - "Client.engagement_status == ACTIVE"
        side_effects:
          - "set engagement_status = PAUSED"
          - "increments Client.version by 1"
      - from: PAUSED
        to: ACTIVE
        trigger: "POST /clients/{id}/activate-engagement"
        actor: CFO
        preconditions:
          - "Client.engagement_status == PAUSED"
          - "Client.onboarding_status == ONBOARDED"
        side_effects:
          - "set engagement_status = ACTIVE"
          - "increments Client.version by 1"
      - from: ACTIVE
        to: OFFBOARDED
        trigger: "POST /clients/{id}/offboard"
        actor: CFO
        preconditions:
          - "Client.engagement_status IN {ACTIVE, PAUSED}"
          - "Client.open_close_count == 0"
        side_effects:
          - "set engagement_status = OFFBOARDED"
          - "cascade: every CatchupProject for this client in {DRAFT, SCOPED, IN_PROGRESS, CLIENT_REVIEW, REVISION} -> CANCELLED"
          - "increments Client.version by 1"

  # --- MonthlyClose: COMPOUND (status from CloseTask children) + PARALLEL review_status ---
  - entity: MonthlyClose
    initial_state: OPEN
    terminal_states: [FINALIZED]
    transitions:
      - from: OPEN
        to: IN_PROGRESS
        trigger: "system: first CloseTask on this close moves out of PENDING"
        actor: system
        preconditions:
          - "MonthlyClose.status == OPEN"
        side_effects:
          - "set status = IN_PROGRESS"
          - "recompute completion_pct and provisional_completion_pct"
      - from: IN_PROGRESS
        to: READY_FOR_REVIEW
        trigger: "system: completion_pct reaches 100 (all CloseTask in {DONE, WAIVED})"
        actor: system
        preconditions:
          - "MonthlyClose.status == IN_PROGRESS"
          - "FINAL completion_pct == 100"
        side_effects:
          - "set status = READY_FOR_REVIEW"
          - "set review_status = UNDER_REVIEW"
        note: bubble-up — child completion drives parent status; review_status advances on its parallel axis
      - from: READY_FOR_REVIEW
        to: FINALIZED
        trigger: "POST /monthly-closes/{id}/finalize"
        actor: CFO
        preconditions:
          - "MonthlyClose.status == READY_FOR_REVIEW"
          - "MonthlyClose.review_status == APPROVED"
        side_effects:
          - "set status = FINALIZED"
          - "decrement Client.open_close_count by 1 and reconcile"
          - "increments MonthlyClose.version by 1"
      - from: READY_FOR_REVIEW
        to: REOPENED
        trigger: "POST /monthly-closes/{id}/request-changes"
        actor: CFO
        preconditions:
          - "MonthlyClose.status == READY_FOR_REVIEW"
          - "MonthlyClose.review_status == UNDER_REVIEW"
        side_effects:
          - "set status = REOPENED"
          - "set review_status = CHANGES_REQUESTED"
          - "cascade: every CloseTask on this close in {DONE} whose name appears in changed_task_names -> PENDING"
          - "recompute completion_pct and provisional_completion_pct"
        note: revert path — review can push the close back so tasks reopen
      - from: REOPENED
        to: IN_PROGRESS
        trigger: "system: a CloseTask on a REOPENED close moves out of PENDING"
        actor: system
        preconditions:
          - "MonthlyClose.status == REOPENED"
        side_effects:
          - "set status = IN_PROGRESS"
          - "set review_status = NOT_STARTED"
      - from: READY_FOR_REVIEW
        to: READY_FOR_REVIEW
        trigger: "POST /monthly-closes/{id}/approve-review"
        actor: CFO
        preconditions:
          - "MonthlyClose.status == READY_FOR_REVIEW"
          - "MonthlyClose.review_status == UNDER_REVIEW"
        side_effects:
          - "set review_status = APPROVED"
        note: parallel-axis-only transition; status stays READY_FOR_REVIEW while review_status advances to APPROVED

  # --- CatchupProject: CYCLIC (revision loops CLIENT_REVIEW -> REVISION -> CLIENT_REVIEW) ---
  - entity: CatchupProject
    initial_state: DRAFT
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: DRAFT
        to: SCOPED
        trigger: "POST /catchup-projects/{id}/scope"
        actor: CFO
        preconditions:
          - "CatchupProject.status == DRAFT"
        side_effects:
          - "set status = SCOPED"
          - "set Client.catchup_active = true and reconcile"
          - "increments CatchupProject.version by 1"
      - from: SCOPED
        to: IN_PROGRESS
        trigger: "POST /catchup-projects/{id}/start"
        actor: Bookkeeper
        preconditions:
          - "CatchupProject.status == SCOPED"
        side_effects:
          - "set status = IN_PROGRESS"
          - "increments CatchupProject.version by 1"
      - from: IN_PROGRESS
        to: CLIENT_REVIEW
        trigger: "POST /catchup-projects/{id}/submit-for-review"
        actor: Bookkeeper
        preconditions:
          - "CatchupProject.status == IN_PROGRESS"
        side_effects:
          - "set status = CLIENT_REVIEW"
          - "increments CatchupProject.version by 1"
      - from: CLIENT_REVIEW
        to: REVISION
        trigger: "POST /catchup-projects/{id}/reject"
        actor: ClientContact
        preconditions:
          - "CatchupProject.status == CLIENT_REVIEW"
        side_effects:
          - "set status = REVISION"
          - "increment revision_rounds by 1"
          - "increments CatchupProject.version by 1"
        note: cycle entry — rejection loops the project back for rework
      - from: REVISION
        to: CLIENT_REVIEW
        trigger: "POST /catchup-projects/{id}/submit-for-review"
        actor: Bookkeeper
        preconditions:
          - "CatchupProject.status == REVISION"
        side_effects:
          - "set status = CLIENT_REVIEW"
          - "increments CatchupProject.version by 1"
        note: cycle close — resubmission returns to review; revision_rounds accumulates across loops
      - from: CLIENT_REVIEW
        to: COMPLETED
        trigger: "POST /catchup-projects/{id}/approve"
        actor: ClientContact
        preconditions:
          - "CatchupProject.status == CLIENT_REVIEW"
        side_effects:
          - "set status = COMPLETED"
          - "set Client.catchup_active = false and reconcile (unless another non-terminal CatchupProject keeps it true)"
          - "increments CatchupProject.version by 1"
      - from: DRAFT
        to: CANCELLED
        trigger: "POST /catchup-projects/{id}/cancel"
        actor: CFO
        preconditions:
          - "CatchupProject.status IN {DRAFT, SCOPED, IN_PROGRESS, CLIENT_REVIEW, REVISION}"
        side_effects:
          - "set status = CANCELLED"
          - "set Client.catchup_active = false and reconcile (unless another non-terminal CatchupProject keeps it true)"
          - "increments CatchupProject.version by 1"

  # --- TaxHandoff: BRANCHING fork-join (two review branches must both sign off) ---
  - entity: TaxHandoff
    initial_state: PREPARING
    terminal_states: [RETURNED]
    transitions:
      - from: PREPARING
        to: BOOKS_REVIEW
        trigger: "POST /tax-handoffs/{id}/start-reviews"
        actor: CFO
        preconditions:
          - "TaxHandoff.status == PREPARING"
          - "the client's MonthlyClose for (tax_year, 12) is FINALIZED"
        side_effects:
          - "set status = BOOKS_REVIEW"
          - "increments TaxHandoff.version by 1"
        note: fork — opens both review branches; cross-entity guard on the December close
      - from: BOOKS_REVIEW
        to: ADVISORY_REVIEW
        trigger: "POST /tax-handoffs/{id}/books-signoff"
        actor: Bookkeeper
        preconditions:
          - "TaxHandoff.status IN {BOOKS_REVIEW, ADVISORY_REVIEW}"
          - "TaxHandoff.books_signoff == false"
        side_effects:
          - "set books_signoff = true"
          - "if advisory_signoff already true: set status = READY, else set status = ADVISORY_REVIEW"
          - "increments TaxHandoff.version by 1"
        note: branch A sign-off; join occurs when both signoffs are true
      - from: ADVISORY_REVIEW
        to: READY
        trigger: "POST /tax-handoffs/{id}/advisory-signoff"
        actor: CFO
        preconditions:
          - "TaxHandoff.status IN {BOOKS_REVIEW, ADVISORY_REVIEW}"
          - "TaxHandoff.advisory_signoff == false"
        side_effects:
          - "set advisory_signoff = true"
          - "if books_signoff already true: set status = READY, else set status = BOOKS_REVIEW"
          - "increments TaxHandoff.version by 1"
        note: branch B sign-off; join — status reaches READY only when both branches signed off
      - from: READY
        to: DELIVERED
        trigger: "POST /tax-handoffs/{id}/deliver"
        actor: CFO
        preconditions:
          - "TaxHandoff.status == READY"
        side_effects:
          - "set status = DELIVERED"
          - "increments TaxHandoff.version by 1"
      - from: DELIVERED
        to: RETURNED
        trigger: "POST /tax-handoffs/{id}/mark-returned"
        actor: CFO
        preconditions:
          - "TaxHandoff.status == DELIVERED"
        side_effects:
          - "set status = RETURNED"
          - "increments TaxHandoff.version by 1"

  # --- ARInvoice: linear with dispute branch ---
  - entity: ARInvoice
    initial_state: OPEN
    terminal_states: [PAID, WRITTEN_OFF]
    transitions:
      - from: OPEN
        to: DISPUTED
        trigger: "POST /ar-invoices/{id}/dispute"
        actor: ClientContact
        preconditions:
          - "ARInvoice.status == OPEN"
        side_effects:
          - "set status = DISPUTED"
          - "increments ARInvoice.version by 1"
      - from: DISPUTED
        to: OPEN
        trigger: "POST /ar-invoices/{id}/resolve-dispute"
        actor: Bookkeeper
        preconditions:
          - "ARInvoice.status == DISPUTED"
        side_effects:
          - "set status = OPEN"
          - "increments ARInvoice.version by 1"
      - from: OPEN
        to: PAID
        trigger: "POST /ar-invoices/{id}/record-payment"
        actor: Bookkeeper
        preconditions:
          - "ARInvoice.status == OPEN"
          - "paid_amount_cents + payment_cents >= amount_cents"
        side_effects:
          - "increment paid_amount_cents by payment_cents"
          - "set status = PAID"
          - "increments ARInvoice.version by 1"
      - from: OPEN
        to: WRITTEN_OFF
        trigger: "POST /ar-invoices/{id}/write-off"
        actor: CFO
        preconditions:
          - "ARInvoice.status == OPEN"
        side_effects:
          - "set status = WRITTEN_OFF"
          - "increments ARInvoice.version by 1"

  # --- APBill: linear approval/payment pipeline ---
  - entity: APBill
    initial_state: ENTERED
    terminal_states: [PAID, VOID]
    transitions:
      - from: ENTERED
        to: APPROVED
        trigger: "POST /ap-bills/{id}/approve"
        actor: CFO
        preconditions:
          - "APBill.status == ENTERED"
        side_effects:
          - "set status = APPROVED"
          - "increments APBill.version by 1"
        note: segregation of duties — the CFO who approves may not be the Bookkeeper who entered
      - from: APPROVED
        to: SCHEDULED
        trigger: "POST /ap-bills/{id}/schedule"
        actor: Bookkeeper
        preconditions:
          - "APBill.status == APPROVED"
          - "scheduled_pay_date present"
        side_effects:
          - "set scheduled_pay_date"
          - "set status = SCHEDULED"
          - "increments APBill.version by 1"
      - from: SCHEDULED
        to: PAID
        trigger: "POST /ap-bills/{id}/mark-paid"
        actor: Bookkeeper
        preconditions:
          - "APBill.status == SCHEDULED"
        side_effects:
          - "set status = PAID"
          - "increments APBill.version by 1"
      - from: ENTERED
        to: VOID
        trigger: "POST /ap-bills/{id}/void"
        actor: CFO
        preconditions:
          - "APBill.status IN {ENTERED, APPROVED}"
        side_effects:
          - "set status = VOID"
          - "increments APBill.version by 1"

  # --- PayrollRun: linear with reversal ---
  - entity: PayrollRun
    initial_state: DRAFT
    terminal_states: [REVERSED]
    transitions:
      - from: DRAFT
        to: ALLOCATED
        trigger: "POST /payroll-runs/{id}/allocate"
        actor: Bookkeeper
        preconditions:
          - "PayrollRun.status == DRAFT"
          - "at least one PayrollAllocation exists for this run"
        side_effects:
          - "run payroll_cost_allocation across PayrollAllocation rows"
          - "set each PayrollAllocation.allocated_cents"
          - "set status = ALLOCATED"
          - "increments PayrollRun.version by 1"
      - from: ALLOCATED
        to: POSTED
        trigger: "POST /payroll-runs/{id}/post"
        actor: CFO
        preconditions:
          - "PayrollRun.status == ALLOCATED"
          - "the linked MonthlyClose.status != FINALIZED"
        side_effects:
          - "set status = POSTED"
          - "increments PayrollRun.version by 1"
        note: cross-entity guard — cannot post payroll into a finalized close
      - from: POSTED
        to: REVERSED
        trigger: "POST /payroll-runs/{id}/reverse"
        actor: CFO
        preconditions:
          - "PayrollRun.status == POSTED"
          - "the linked MonthlyClose.status != FINALIZED"
        side_effects:
          - "set status = REVERSED"
          - "set every PayrollAllocation.allocated_cents = 0 (compensation: drains the run back to zero allocation)"
          - "increments PayrollRun.version by 1"

  # --- CashFlowForecast: DRAFT -> APPROVED with covenant gate; supersede ---
  - entity: CashFlowForecast
    initial_state: DRAFT
    terminal_states: [SUPERSEDED]
    transitions:
      - from: DRAFT
        to: APPROVED
        trigger: "POST /forecasts/{id}/approve"
        actor: CFO
        preconditions:
          - "CashFlowForecast.status == DRAFT"
          - "min_projected_balance_cents >= Client.covenant_floor_cents"
        side_effects:
          - "set status = APPROVED"
          - "supersede: every other CashFlowForecast for this client in status APPROVED -> SUPERSEDED"
          - "increments CashFlowForecast.version by 1"
        note: boundary precision — approval requires min projected balance at-or-above the covenant floor (>=)

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: forecast-approve-stale-client
    parent_entity: Client
    write_endpoint: "POST /forecasts/{id}/approve"
    occ_field: "expected_client_version"
    description: |
      Approving a CashFlowForecast against a Client whose version has advanced
      since the client last observed it is rejected. A newly approved forecast
      legitimately supersedes any prior APPROVED forecast for the client and the
      covenant_floor_cents the approval is checked against may have just been
      re-set; a stale client view must not silently approve against an
      out-of-date floor. The check is a stale-version comparison, not a timing
      condition.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: retainer-issue-stale-client
    parent_entity: Client
    write_endpoint: "POST /clients/{id}/retainer-invoices"
    occ_field: "expected_client_version"
    description: |
      Issuing a RetainerInvoice against a Client whose version has advanced since
      the client last observed it is rejected. The catch-up surcharge and the
      included transaction volume are read off the Client at issuance; if a
      CatchupProject transition or a tier change has bumped the Client version,
      the issuer's view is stale and the invoice must not be minted off
      out-of-date pricing inputs. Resolved by a stale-version comparison.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: retainer_invoice_amount
    trigger: "on POST /clients/{id}/retainer-invoices (RetainerInvoice issuance)"
    algorithm: tiered_pricing
    formula: |
      tier := Client.retainer_tier
      (base_cents, included_txns, overage_rate_milli) := TIER_TABLE[tier]
        # overage_rate_milli is per-transaction price in milli-dollars (thousandths of a dollar)
      txns := MonthlyClose[monthly_close_id].txn_count
      overage_units := max(0, txns - included_txns)
      overage_cents := round_half_up(overage_units * overage_rate_milli / 10)
        # milli/10 converts thousandths-of-a-dollar to cents
      base_fee_cents := base_cents
      surcharge_cents := if Client.catchup_active then round_half_up(base_cents * 0.20) else 0
      total_cents := base_fee_cents + overage_cents + surcharge_cents
    input_set: "the single MonthlyClose named by monthly_close_id; the Client's retainer_tier and catchup_active snapshot at issuance"
    constants:
      TIER_TABLE_ESSENTIALS: { base_cents: 150000, included_txns: 200, overage_rate_milli: 750 }
      TIER_TABLE_GROWTH: { base_cents: 300000, included_txns: 500, overage_rate_milli: 600 }
      TIER_TABLE_CFO: { base_cents: 600000, included_txns: 1200, overage_rate_milli: 450 }
      SURCHARGE_PCT: 0.20
    precision: "integer cents, round_half_up on the overage and surcharge sub-results before summing"
    variants:
      - name: with_catchup_surcharge
        when: "Client.catchup_active == true at issuance"
        difference: "adds surcharge_cents = round_half_up(base_cents * 0.20); same txn inputs without an active catch-up project omit it, producing a different total for identical close data"
      - name: without_catchup_surcharge
        when: "Client.catchup_active == false at issuance"
        difference: "surcharge_cents = 0"

  - name: close_completion_pct
    trigger: "on every CloseTask create/transition (recompute on MonthlyClose)"
    algorithm: weighted_scoring
    formula: |
      total_weight := sum(CloseTask.weight for all CloseTask where monthly_close_id == close.id)
      if total_weight == 0: provisional_completion_pct := 0; completion_pct := 0
      else:
        final_done := sum(weight where status IN {DONE, WAIVED})
        prov_done  := sum(weight where status IN {DONE, WAIVED, IN_REVIEW})
        completion_pct := round_half_up(final_done / total_weight * 100, 2)
        provisional_completion_pct := round_half_up(prov_done / total_weight * 100, 2)
    input_set: "all CloseTask rows for the close, regardless of BLOCKED/PENDING; BLOCKED and PENDING contribute weight to the denominator but not the numerator"
    constants: {}
    precision: "2 decimal places, round_half_up"
    variants:
      - name: final
        when: "feeds MonthlyClose.completion_pct and the READY_FOR_REVIEW auto-transition gate (== 100)"
        difference: "numerator counts only {DONE, WAIVED}"
      - name: provisional
        when: "feeds MonthlyClose.provisional_completion_pct for the dashboard"
        difference: "numerator also counts IN_REVIEW, so for identical task data it is >= the final variant"

  - name: cash_flow_projection
    trigger: "on every ForecastLine create/delete (recompute on CashFlowForecast)"
    algorithm: chronological
    formula: |
      lines := ForecastLine where forecast_id == forecast.id
      ordered := sort lines by (effective_date ASC, created_at ASC)
      balance := forecast.opening_balance_cents
      min_balance := forecast.opening_balance_cents
      for line in ordered:
        balance := balance + (line.amount_cents if direction == INFLOW else -line.amount_cents)
        min_balance := min(min_balance, balance)
      ending_balance_cents := balance
      min_projected_balance_cents := min_balance
    input_set: "all ForecastLine rows for the forecast; opening_balance_cents is the seed of both running and minimum"
    constants: {}
    precision: "integer cents; no rounding (amounts are already integer cents)"
    variants:
      - name: ending_balance
        when: "always"
        difference: "the final running balance after all lines"
      - name: min_projected_balance
        when: "always; gates approval against covenant_floor_cents"
        difference: "the minimum of the running balance including the opening balance as the initial candidate — differs from ending whenever an OUTFLOW dips the running balance below the close"

  - name: payroll_cost_allocation
    trigger: "on POST /payroll-runs/{id}/allocate (DRAFT -> ALLOCATED)"
    algorithm: waterfall_allocation
    formula: |
      total := PayrollRun.total_employer_cost_cents
      allocs := PayrollAllocation where payroll_run_id == run.id
      sum_gross := sum(a.dept_gross_cents for a in allocs)
      # round-per-line:
      for a in allocs: a.raw_cents := round_half_up(total * a.dept_gross_cents / sum_gross)
      assigned := sum(a.raw_cents)
      remainder := total - assigned
      # reconcile remainder onto a single recipient:
      recipient := allocs sorted by (dept_gross_cents DESC, created_at ASC) first
      recipient.raw_cents := recipient.raw_cents + remainder
      for a in allocs: a.allocated_cents := a.raw_cents
    input_set: "all PayrollAllocation rows for the run; the run's total_employer_cost_cents"
    constants: {}
    precision: "integer cents, round_half_up per line; the leftover remainder (total - sum of rounded lines) is added to the largest-gross department (tie-break earliest created_at)"
    variants:
      - name: per_line_then_remainder
        when: "always (the pinned order)"
        difference: "each line rounded first, then remainder reconciled onto the largest-gross line — guarantees sum(allocated_cents) == total exactly, unlike a naive sum-then-round which can drift by the remainder"

  - name: ar_dso
    trigger: "on GET /clients/{id}/ar-summary"
    algorithm: aggregation
    formula: |
      open_set := ARInvoice where client_id == client.id and status IN {OPEN, DISPUTED}
      gross_outstanding := sum(amount_cents - paid_amount_cents for inv in open_set)
      net_outstanding := sum(amount_cents - paid_amount_cents for inv in open_set where status == OPEN)
      # DSO over a fixed 30-day window against credit_sales_cents passed as a query input
      dso_gross := if credit_sales_cents == 0 then 0 else round_half_up(gross_outstanding / credit_sales_cents * 30, 2)
      dso_net   := if credit_sales_cents == 0 then 0 else round_half_up(net_outstanding   / credit_sales_cents * 30, 2)
    input_set: "ARInvoice rows for the client in {OPEN, DISPUTED}; PAID and WRITTEN_OFF excluded; credit_sales_cents supplied as a query parameter"
    constants:
      DSO_PERIOD_DAYS: 30
    precision: "2 decimal places, round_half_up"
    variants:
      - name: gross
        when: "dashboard headline DSO"
        difference: "includes DISPUTED invoices in the outstanding numerator"
      - name: net
        when: "covenant/collections DSO"
        difference: "excludes DISPUTED invoices, so for identical data dso_net <= dso_gross"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and X-User-Role is a known role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "the acting role is permitted to perform this operation per the RBAC matrix"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: existence
    check: "all path/body referenced resources exist, validated left-to-right in the path then body FKs"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all"
  - priority: 4
    category: state
    check: "the target resource is in a state from which the requested transition is defined"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints"
  - priority: 5
    category: business_constraint
    check: "Client activate-engagement requires onboarding_status == ONBOARDED"
    error_id: ERR_ONBOARDING_INCOMPLETE
    http_status: 409
    applies_to: "POST /clients/{id}/activate-engagement"
  - priority: 6
    category: business_constraint
    check: "Client offboard requires open_close_count == 0 (no non-finalized closes)"
    error_id: ERR_OPEN_CLOSES_EXIST
    http_status: 409
    applies_to: "POST /clients/{id}/offboard"
  - priority: 7
    category: business_referential
    check: "starting tax-handoff reviews requires the client's MonthlyClose for (tax_year, month 12) to be FINALIZED"
    error_id: ERR_DECEMBER_CLOSE_NOT_FINAL
    http_status: 409
    applies_to: "POST /tax-handoffs/{id}/start-reviews"
  - priority: 8
    category: business_referential
    check: "posting/reversing a PayrollRun requires its linked MonthlyClose.status != FINALIZED"
    error_id: ERR_CLOSE_FINALIZED
    http_status: 409
    applies_to: "POST /payroll-runs/{id}/post, POST /payroll-runs/{id}/reverse"
  - priority: 9
    category: business_referential
    check: "completing onboarding requires at least one ACTIVE LedgerAccount for the client"
    error_id: ERR_NO_LEDGER_ACCOUNTS
    http_status: 409
    applies_to: "POST /clients/{id}/complete-onboarding"
  - priority: 10
    category: business_constraint
    check: "LedgerAccount parent_account_id, when present, must reference an ACTIVE account of the SAME client; a parent in a different client is a cross-client reference"
    error_id: ERR_CROSS_CLIENT_PARENT
    http_status: 422
    applies_to: "POST /clients/{id}/ledger-accounts"
  - priority: 11
    category: business_constraint
    check: "account_code must be unique among non-ARCHIVED LedgerAccount rows of the same client"
    error_id: ERR_DUPLICATE_ACCOUNT_CODE
    http_status: 409
    applies_to: "POST /clients/{id}/ledger-accounts"
  - priority: 12
    category: business_temporal
    check: "(period_year, period_month) must be unique among non-FINALIZED MonthlyClose rows of the same client; a second open close for the same period is a duplicate"
    error_id: ERR_DUPLICATE_PERIOD
    http_status: 409
    applies_to: "POST /clients/{id}/monthly-closes"
  - priority: 13
    category: business_temporal
    check: "a new PayrollRun whose half-open [pay_period_start, pay_period_end) interval overlaps an existing non-REVERSED PayrollRun of the same client is rejected; adjacency (one period's end == the next period's start) does NOT overlap"
    error_id: ERR_PAY_PERIOD_OVERLAP
    http_status: 409
    applies_to: "POST /clients/{id}/payroll-runs"
  - priority: 14
    category: business_safety
    check: "approving a CashFlowForecast requires min_projected_balance_cents >= Client.covenant_floor_cents"
    error_id: ERR_COVENANT_BREACH
    http_status: 422
    applies_to: "POST /forecasts/{id}/approve"
  - priority: 15
    category: business_constraint
    check: "recording an AR payment requires paid_amount_cents + payment_cents >= amount_cents (partial payments under the invoice total are rejected)"
    error_id: ERR_UNDERPAYMENT
    http_status: 422
    applies_to: "POST /ar-invoices/{id}/record-payment"
  - priority: 16
    category: business_constraint
    check: "scheduling an AP bill requires scheduled_pay_date in the request body"
    error_id: ERR_MISSING_SCHEDULE_DATE
    http_status: 422
    applies_to: "POST /ap-bills/{id}/schedule"
  - priority: 17
    category: business_constraint
    check: "the OCC field expected_<parent>_version on an OCC-guarded write must equal the parent's current version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /forecasts/{id}/approve, POST /clients/{id}/retainer-invoices"
  - priority: 18
    category: business_constraint
    check: "a required request-body field is missing or has the wrong type"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- test-driving: logical clock ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server's logical clock used for AR/AP aging and forecast dates. Server startup default is 2026-03-01T00:00:00Z; before any call the clock reads exactly this default and never falls back to wall-clock time."
    roles: [PlatformAdmin]
    code: 200
    input: ["to_iso8601"]
    output: null
    side_effects: ["sets the logical clock read by aging and date-window logic"]

  # --- Client CRUD + onboarding (parallel dim) ---
  - method: POST
    path: "/clients"
    description: "Create a client in onboarding_status LEAD and engagement_status PROSPECT."
    roles: [CFO, PlatformAdmin]
    code: 201
    input: ["legal_name", "state_code", "retainer_tier", "covenant_floor_cents?"]
    output: Client
    side_effects: ["set included_txn_count from retainer_tier", "onboarding_status=LEAD", "engagement_status=PROSPECT"]
  - method: GET
    path: "/clients"
    description: "List clients with pagination and optional engagement_status filter."
    roles: [CFO, Bookkeeper, PlatformAdmin]
    code: 200
    input: ["engagement_status?", "limit?", "offset?"]
    output: Client[]
    side_effects: []
  - method: GET
    path: "/clients/{id}"
    description: "Fetch a single client."
    roles: [CFO, Bookkeeper, ClientContact, PlatformAdmin]
    code: 200
    input: []
    output: Client
    side_effects: []
  - method: POST
    path: "/clients/{id}/schedule-kickoff"
    description: "Onboarding dimension: LEAD -> KICKOFF_SCHEDULED."
    roles: [CFO]
    code: 200
    input: []
    output: Client
    side_effects: ["onboarding_status=KICKOFF_SCHEDULED", "Client.version += 1"]
  - method: POST
    path: "/clients/{id}/start-ledger-setup"
    description: "Onboarding dimension: KICKOFF_SCHEDULED -> LEDGER_SETUP."
    roles: [Bookkeeper]
    code: 200
    input: []
    output: Client
    side_effects: ["onboarding_status=LEDGER_SETUP", "Client.version += 1"]
  - method: POST
    path: "/clients/{id}/complete-onboarding"
    description: "Onboarding dimension: LEDGER_SETUP -> ONBOARDED; requires an ACTIVE ledger account."
    roles: [CFO]
    code: 200
    input: []
    output: Client
    side_effects: ["onboarding_status=ONBOARDED", "Client.version += 1"]
  - method: POST
    path: "/clients/{id}/activate-engagement"
    description: "Engagement dimension: PROSPECT->ACTIVE or PAUSED->ACTIVE; requires onboarding_status ONBOARDED."
    roles: [CFO]
    code: 200
    input: []
    output: Client
    side_effects: ["engagement_status=ACTIVE", "Client.version += 1"]
  - method: POST
    path: "/clients/{id}/pause-engagement"
    description: "Engagement dimension: ACTIVE -> PAUSED."
    roles: [CFO]
    code: 200
    input: []
    output: Client
    side_effects: ["engagement_status=PAUSED", "Client.version += 1"]
  - method: POST
    path: "/clients/{id}/offboard"
    description: "Engagement dimension: ACTIVE/PAUSED -> OFFBOARDED; cascades non-terminal catch-up projects to CANCELLED."
    roles: [CFO]
    code: 200
    input: []
    output: Client
    side_effects: ["engagement_status=OFFBOARDED", "cascade CatchupProject -> CANCELLED", "Client.version += 1"]

  # --- LedgerAccount (self-referential tree, FK reverse-reachability) ---
  - method: POST
    path: "/clients/{id}/ledger-accounts"
    description: "Create a chart-of-accounts entry for the client; optional parent_account_id forms the tree."
    roles: [Bookkeeper, CFO]
    code: 201
    input: ["account_code", "account_type", "name", "parent_account_id?"]
    output: LedgerAccount
    side_effects: ["status=ACTIVE"]
  - method: GET
    path: "/clients/{id}/ledger-accounts"
    description: "List a client's ledger accounts (reverse-reachability for LedgerAccount.client_id and the self-referential parent_account_id)."
    roles: [Bookkeeper, CFO, PlatformAdmin]
    code: 200
    input: ["parent_account_id?", "status?"]
    output: LedgerAccount[]
    side_effects: []
  - method: GET
    path: "/ledger-accounts/{id}"
    description: "Fetch a single ledger account."
    roles: [Bookkeeper, CFO, PlatformAdmin]
    code: 200
    input: []
    output: LedgerAccount
    side_effects: []
  - method: GET
    path: "/ledger-accounts/{id}/children"
    description: "List the child accounts whose parent_account_id is this account (self-referential reverse-reachability for LedgerAccount.parent_account_id)."
    roles: [Bookkeeper, CFO, PlatformAdmin]
    code: 200
    input: []
    output: LedgerAccount[]
    side_effects: []
  - method: POST
    path: "/ledger-accounts/{id}/archive"
    description: "Archive a ledger account (ACTIVE -> ARCHIVED)."
    roles: [CFO]
    code: 200
    input: []
    output: LedgerAccount
    side_effects: ["status=ARCHIVED"]

  # --- CatchupProject (cyclic) ---
  - method: POST
    path: "/clients/{id}/catchup-projects"
    description: "Create a catch-up/cleanup project in DRAFT for the client."
    roles: [CFO]
    code: 201
    input: ["months_behind", "quoted_fee_cents"]
    output: CatchupProject
    side_effects: ["status=DRAFT"]
  - method: GET
    path: "/clients/{id}/catchup-projects"
    description: "List a client's catch-up projects (reverse-reachability for CatchupProject.client_id)."
    roles: [CFO, Bookkeeper, ClientContact, PlatformAdmin]
    code: 200
    input: ["status?"]
    output: CatchupProject[]
    side_effects: []
  - method: GET
    path: "/catchup-projects/{id}"
    description: "Fetch a single catch-up project."
    roles: [CFO, Bookkeeper, ClientContact, PlatformAdmin]
    code: 200
    input: []
    output: CatchupProject
    side_effects: []
  - method: POST
    path: "/catchup-projects/{id}/scope"
    description: "DRAFT -> SCOPED; sets Client.catchup_active = true."
    roles: [CFO]
    code: 200
    input: []
    output: CatchupProject
    side_effects: ["status=SCOPED", "Client.catchup_active=true", "Client.version += 1"]
  - method: POST
    path: "/catchup-projects/{id}/start"
    description: "SCOPED -> IN_PROGRESS."
    roles: [Bookkeeper]
    code: 200
    input: []
    output: CatchupProject
    side_effects: ["status=IN_PROGRESS"]
  - method: POST
    path: "/catchup-projects/{id}/submit-for-review"
    description: "IN_PROGRESS -> CLIENT_REVIEW, or REVISION -> CLIENT_REVIEW (cycle close)."
    roles: [Bookkeeper]
    code: 200
    input: []
    output: CatchupProject
    side_effects: ["status=CLIENT_REVIEW"]
  - method: POST
    path: "/catchup-projects/{id}/reject"
    description: "CLIENT_REVIEW -> REVISION (cycle entry); increments revision_rounds."
    roles: [ClientContact]
    code: 200
    input: []
    output: CatchupProject
    side_effects: ["status=REVISION", "revision_rounds += 1"]
  - method: POST
    path: "/catchup-projects/{id}/approve"
    description: "CLIENT_REVIEW -> COMPLETED; may clear Client.catchup_active."
    roles: [ClientContact]
    code: 200
    input: []
    output: CatchupProject
    side_effects: ["status=COMPLETED", "Client.catchup_active recomputed", "Client.version += 1"]
  - method: POST
    path: "/catchup-projects/{id}/cancel"
    description: "Any non-terminal -> CANCELLED; may clear Client.catchup_active."
    roles: [CFO]
    code: 200
    input: []
    output: CatchupProject
    side_effects: ["status=CANCELLED", "Client.catchup_active recomputed", "Client.version += 1"]

  # --- MonthlyClose (compound + parallel review) ---
  - method: POST
    path: "/clients/{id}/monthly-closes"
    description: "Open a monthly close for the client for (period_year, period_month)."
    roles: [Bookkeeper, CFO]
    code: 201
    input: ["period_year", "period_month", "txn_count?"]
    output: MonthlyClose
    side_effects: ["status=OPEN", "review_status=NOT_STARTED", "increment Client.open_close_count"]
  - method: GET
    path: "/clients/{id}/monthly-closes"
    description: "List a client's monthly closes (reverse-reachability for MonthlyClose.client_id)."
    roles: [Bookkeeper, CFO, ClientContact, PlatformAdmin]
    code: 200
    input: ["status?", "period_year?"]
    output: MonthlyClose[]
    side_effects: []
  - method: GET
    path: "/monthly-closes/{id}"
    description: "Fetch a single monthly close with computed completion percentages."
    roles: [Bookkeeper, CFO, ClientContact, PlatformAdmin]
    code: 200
    input: []
    output: MonthlyClose
    side_effects: []
  - method: POST
    path: "/monthly-closes/{id}/close-tasks"
    description: "Add a checklist task to the close in PENDING."
    roles: [Bookkeeper, CFO]
    code: 201
    input: ["name", "weight"]
    output: CloseTask
    side_effects: ["status=PENDING"]
  - method: GET
    path: "/monthly-closes/{id}/close-tasks"
    description: "List a close's checklist tasks (reverse-reachability for CloseTask.monthly_close_id)."
    roles: [Bookkeeper, CFO, ClientContact, PlatformAdmin]
    code: 200
    input: ["status?"]
    output: CloseTask[]
    side_effects: []
  - method: GET
    path: "/monthly-closes/{id}/payroll-runs"
    description: "List payroll runs posting into this close (reverse-reachability for PayrollRun.monthly_close_id)."
    roles: [Bookkeeper, CFO, PlatformAdmin]
    code: 200
    input: ["status?"]
    output: PayrollRun[]
    side_effects: []
  - method: GET
    path: "/monthly-closes/{id}/retainer-invoices"
    description: "List retainer invoices issued off this close's txn_count (reverse-reachability for RetainerInvoice.monthly_close_id)."
    roles: [CFO, Bookkeeper, PlatformAdmin]
    code: 200
    input: ["status?"]
    output: RetainerInvoice[]
    side_effects: []
  - method: POST
    path: "/close-tasks/{id}/transition"
    description: "Move a CloseTask to a new status; bubbles up to recompute close completion and may auto-advance the close."
    roles: [Bookkeeper, CFO]
    code: 200
    input: ["to_status", "blocking_reason?"]
    output: CloseTask
    side_effects: ["set CloseTask.status", "recompute MonthlyClose completion_pct/provisional_completion_pct", "auto-transition MonthlyClose OPEN/REOPENED->IN_PROGRESS and IN_PROGRESS->READY_FOR_REVIEW"]
  - method: POST
    path: "/monthly-closes/{id}/approve-review"
    description: "Parallel review axis: review_status UNDER_REVIEW -> APPROVED (status stays READY_FOR_REVIEW)."
    roles: [CFO]
    code: 200
    input: []
    output: MonthlyClose
    side_effects: ["review_status=APPROVED"]
  - method: POST
    path: "/monthly-closes/{id}/request-changes"
    description: "READY_FOR_REVIEW -> REOPENED; reopens named DONE tasks to PENDING and recomputes completion."
    roles: [CFO]
    code: 200
    input: ["changed_task_names"]
    output: MonthlyClose
    side_effects: ["status=REOPENED", "review_status=CHANGES_REQUESTED", "named DONE CloseTasks -> PENDING", "recompute completion"]
  - method: POST
    path: "/monthly-closes/{id}/finalize"
    description: "READY_FOR_REVIEW -> FINALIZED; requires review_status APPROVED; decrements Client.open_close_count."
    roles: [CFO]
    code: 200
    input: []
    output: MonthlyClose
    side_effects: ["status=FINALIZED", "decrement Client.open_close_count", "MonthlyClose.version += 1"]

  # --- ARInvoice ---
  - method: POST
    path: "/clients/{id}/ar-invoices"
    description: "Create an AR invoice for the client in OPEN."
    roles: [Bookkeeper, CFO]
    code: 201
    input: ["counterparty_name", "amount_cents", "issue_date", "due_date"]
    output: ARInvoice
    side_effects: ["status=OPEN", "paid_amount_cents=0"]
  - method: GET
    path: "/clients/{id}/ar-invoices"
    description: "List a client's AR invoices (reverse-reachability for ARInvoice.client_id)."
    roles: [Bookkeeper, CFO, ClientContact, PlatformAdmin]
    code: 200
    input: ["status?"]
    output: ARInvoice[]
    side_effects: []
  - method: GET
    path: "/ar-invoices/{id}"
    description: "Fetch a single AR invoice."
    roles: [Bookkeeper, CFO, ClientContact, PlatformAdmin]
    code: 200
    input: []
    output: ARInvoice
    side_effects: []
  - method: POST
    path: "/ar-invoices/{id}/dispute"
    description: "OPEN -> DISPUTED."
    roles: [ClientContact]
    code: 200
    input: []
    output: ARInvoice
    side_effects: ["status=DISPUTED"]
  - method: POST
    path: "/ar-invoices/{id}/resolve-dispute"
    description: "DISPUTED -> OPEN."
    roles: [Bookkeeper]
    code: 200
    input: []
    output: ARInvoice
    side_effects: ["status=OPEN"]
  - method: POST
    path: "/ar-invoices/{id}/record-payment"
    description: "OPEN -> PAID; requires payment that brings paid_amount to at least the invoice total."
    roles: [Bookkeeper]
    code: 200
    input: ["payment_cents"]
    output: ARInvoice
    side_effects: ["paid_amount_cents += payment_cents", "status=PAID"]
  - method: POST
    path: "/ar-invoices/{id}/write-off"
    description: "OPEN -> WRITTEN_OFF."
    roles: [CFO]
    code: 200
    input: []
    output: ARInvoice
    side_effects: ["status=WRITTEN_OFF"]
  - method: GET
    path: "/clients/{id}/ar-summary"
    description: "Computed AR aging + DSO summary (gross and net variants)."
    roles: [CFO, Bookkeeper, PlatformAdmin]
    code: 200
    input: ["credit_sales_cents"]
    output: "{ gross_outstanding_cents: integer, net_outstanding_cents: integer, dso_gross: number, dso_net: number, bucket_current_cents: integer, bucket_1_30_cents: integer, bucket_31_60_cents: integer, bucket_61_plus_cents: integer }"
    side_effects: ["runs ar_dso calculation"]

  # --- APBill ---
  - method: POST
    path: "/clients/{id}/ap-bills"
    description: "Create an AP bill for the client in ENTERED."
    roles: [Bookkeeper]
    code: 201
    input: ["vendor_name", "amount_cents", "due_date"]
    output: APBill
    side_effects: ["status=ENTERED"]
  - method: GET
    path: "/clients/{id}/ap-bills"
    description: "List a client's AP bills (reverse-reachability for APBill.client_id)."
    roles: [Bookkeeper, CFO, PlatformAdmin]
    code: 200
    input: ["status?"]
    output: APBill[]
    side_effects: []
  - method: GET
    path: "/ap-bills/{id}"
    description: "Fetch a single AP bill."
    roles: [Bookkeeper, CFO, PlatformAdmin]
    code: 200
    input: []
    output: APBill
    side_effects: []
  - method: POST
    path: "/ap-bills/{id}/approve"
    description: "ENTERED -> APPROVED (CFO, segregated from the Bookkeeper who entered)."
    roles: [CFO]
    code: 200
    input: []
    output: APBill
    side_effects: ["status=APPROVED"]
  - method: POST
    path: "/ap-bills/{id}/schedule"
    description: "APPROVED -> SCHEDULED; requires scheduled_pay_date."
    roles: [Bookkeeper]
    code: 200
    input: ["scheduled_pay_date"]
    output: APBill
    side_effects: ["scheduled_pay_date set", "status=SCHEDULED"]
  - method: POST
    path: "/ap-bills/{id}/mark-paid"
    description: "SCHEDULED -> PAID."
    roles: [Bookkeeper]
    code: 200
    input: []
    output: APBill
    side_effects: ["status=PAID"]
  - method: POST
    path: "/ap-bills/{id}/void"
    description: "ENTERED/APPROVED -> VOID."
    roles: [CFO]
    code: 200
    input: []
    output: APBill
    side_effects: ["status=VOID"]

  # --- PayrollRun + PayrollAllocation ---
  - method: POST
    path: "/clients/{id}/payroll-runs"
    description: "Create a payroll run for the client linked to a monthly close, in DRAFT; rejects a run whose [pay_period_start, pay_period_end) overlaps an existing non-REVERSED run for this client."
    roles: [Bookkeeper]
    code: 201
    input: ["monthly_close_id", "pay_date", "pay_period_start", "pay_period_end", "total_employer_cost_cents"]
    output: PayrollRun
    side_effects: ["status=DRAFT"]
  - method: GET
    path: "/clients/{id}/payroll-runs"
    description: "List a client's payroll runs (reverse-reachability for PayrollRun.client_id)."
    roles: [Bookkeeper, CFO, PlatformAdmin]
    code: 200
    input: ["status?", "monthly_close_id?"]
    output: PayrollRun[]
    side_effects: []
  - method: GET
    path: "/payroll-runs/{id}"
    description: "Fetch a single payroll run."
    roles: [Bookkeeper, CFO, PlatformAdmin]
    code: 200
    input: []
    output: PayrollRun
    side_effects: []
  - method: POST
    path: "/payroll-runs/{id}/allocations"
    description: "Add a department allocation line (weight) to a DRAFT run."
    roles: [Bookkeeper]
    code: 201
    input: ["department_name", "dept_gross_cents"]
    output: PayrollAllocation
    side_effects: ["allocated_cents=0"]
  - method: GET
    path: "/payroll-runs/{id}/allocations"
    description: "List a run's allocation lines (reverse-reachability for PayrollAllocation.payroll_run_id)."
    roles: [Bookkeeper, CFO, PlatformAdmin]
    code: 200
    input: []
    output: PayrollAllocation[]
    side_effects: []
  - method: POST
    path: "/payroll-runs/{id}/allocate"
    description: "DRAFT -> ALLOCATED; runs payroll_cost_allocation across allocation lines."
    roles: [Bookkeeper]
    code: 200
    input: []
    output: PayrollRun
    side_effects: ["set each PayrollAllocation.allocated_cents", "status=ALLOCATED"]
  - method: POST
    path: "/payroll-runs/{id}/post"
    description: "ALLOCATED -> POSTED; requires linked close not FINALIZED."
    roles: [CFO]
    code: 200
    input: []
    output: PayrollRun
    side_effects: ["status=POSTED"]
  - method: POST
    path: "/payroll-runs/{id}/reverse"
    description: "POSTED -> REVERSED; zeroes allocations (compensation) and requires linked close not FINALIZED."
    roles: [CFO]
    code: 200
    input: []
    output: PayrollRun
    side_effects: ["status=REVERSED", "set every PayrollAllocation.allocated_cents=0"]

  # --- CashFlowForecast + ForecastLine ---
  - method: POST
    path: "/clients/{id}/forecasts"
    description: "Create a cash-flow forecast for the client in DRAFT."
    roles: [CFO]
    code: 201
    input: ["opening_balance_cents"]
    output: CashFlowForecast
    side_effects: ["status=DRAFT", "ending_balance_cents=opening_balance_cents", "min_projected_balance_cents=opening_balance_cents"]
  - method: GET
    path: "/clients/{id}/forecasts"
    description: "List a client's forecasts (reverse-reachability for CashFlowForecast.client_id)."
    roles: [CFO, Bookkeeper, PlatformAdmin]
    code: 200
    input: ["status?"]
    output: CashFlowForecast[]
    side_effects: []
  - method: GET
    path: "/forecasts/{id}"
    description: "Fetch a single forecast with computed ending and minimum balances."
    roles: [CFO, Bookkeeper, PlatformAdmin]
    code: 200
    input: []
    output: CashFlowForecast
    side_effects: []
  - method: POST
    path: "/forecasts/{id}/lines"
    description: "Add a projected cash movement; recomputes ending and min projected balances."
    roles: [CFO]
    code: 201
    input: ["effective_date", "direction", "amount_cents"]
    output: ForecastLine
    side_effects: ["recompute CashFlowForecast ending_balance_cents and min_projected_balance_cents"]
  - method: GET
    path: "/forecasts/{id}/lines"
    description: "List a forecast's lines (reverse-reachability for ForecastLine.forecast_id)."
    roles: [CFO, Bookkeeper, PlatformAdmin]
    code: 200
    input: []
    output: ForecastLine[]
    side_effects: []
  - method: POST
    path: "/forecasts/{id}/approve"
    description: "DRAFT -> APPROVED; OCC-guarded on the Client version; requires min projected balance >= covenant floor; supersedes prior APPROVED forecast."
    roles: [CFO]
    code: 200
    input: ["expected_client_version"]
    output: CashFlowForecast
    side_effects: ["status=APPROVED", "supersede prior APPROVED forecast", "increments Client.version by 1"]

  # --- TaxHandoff (branching fork-join) ---
  - method: POST
    path: "/clients/{id}/tax-handoffs"
    description: "Create a tax-prep handoff for the client in PREPARING."
    roles: [CFO]
    code: 201
    input: ["tax_year"]
    output: TaxHandoff
    side_effects: ["status=PREPARING", "books_signoff=false", "advisory_signoff=false"]
  - method: GET
    path: "/clients/{id}/tax-handoffs"
    description: "List a client's tax handoffs (reverse-reachability for TaxHandoff.client_id)."
    roles: [CFO, Bookkeeper, ClientContact, PlatformAdmin]
    code: 200
    input: ["status?"]
    output: TaxHandoff[]
    side_effects: []
  - method: GET
    path: "/tax-handoffs/{id}"
    description: "Fetch a single tax handoff."
    roles: [CFO, Bookkeeper, ClientContact, PlatformAdmin]
    code: 200
    input: []
    output: TaxHandoff
    side_effects: []
  - method: POST
    path: "/tax-handoffs/{id}/start-reviews"
    description: "PREPARING -> BOOKS_REVIEW (fork); requires the December close of tax_year FINALIZED."
    roles: [CFO]
    code: 200
    input: []
    output: TaxHandoff
    side_effects: ["status=BOOKS_REVIEW"]
  - method: POST
    path: "/tax-handoffs/{id}/books-signoff"
    description: "Books branch sign-off; joins to READY when advisory already signed off."
    roles: [Bookkeeper]
    code: 200
    input: []
    output: TaxHandoff
    side_effects: ["books_signoff=true", "status -> READY or ADVISORY_REVIEW"]
  - method: POST
    path: "/tax-handoffs/{id}/advisory-signoff"
    description: "Advisory branch sign-off; joins to READY when books already signed off."
    roles: [CFO]
    code: 200
    input: []
    output: TaxHandoff
    side_effects: ["advisory_signoff=true", "status -> READY or BOOKS_REVIEW"]
  - method: POST
    path: "/tax-handoffs/{id}/deliver"
    description: "READY -> DELIVERED."
    roles: [CFO]
    code: 200
    input: []
    output: TaxHandoff
    side_effects: ["status=DELIVERED"]
  - method: POST
    path: "/tax-handoffs/{id}/mark-returned"
    description: "DELIVERED -> RETURNED."
    roles: [CFO]
    code: 200
    input: []
    output: TaxHandoff
    side_effects: ["status=RETURNED"]

  # --- RetainerInvoice (tier/retainer billing, OCC-guarded) ---
  - method: POST
    path: "/clients/{id}/retainer-invoices"
    description: "Issue a retainer invoice for the client off a monthly close's txn_count; OCC-guarded on the Client version; computes base/overage/surcharge/total."
    roles: [CFO]
    code: 201
    input: ["monthly_close_id", "expected_client_version"]
    output: RetainerInvoice
    side_effects: ["compute base_fee_cents/overage_cents/surcharge_cents/total_cents", "status=ISSUED", "increments Client.version by 1"]
  - method: GET
    path: "/clients/{id}/retainer-invoices"
    description: "List a client's retainer invoices (reverse-reachability for RetainerInvoice.client_id and monthly_close_id)."
    roles: [CFO, Bookkeeper, ClientContact, PlatformAdmin]
    code: 200
    input: ["status?", "monthly_close_id?"]
    output: RetainerInvoice[]
    side_effects: []
  - method: GET
    path: "/retainer-invoices/{id}"
    description: "Fetch a single retainer invoice."
    roles: [CFO, Bookkeeper, ClientContact, PlatformAdmin]
    code: 200
    input: []
    output: RetainerInvoice
    side_effects: []
  - method: POST
    path: "/retainer-invoices/{id}/pay"
    description: "ISSUED -> PAID."
    roles: [ClientContact, CFO]
    code: 200
    input: []
    output: RetainerInvoice
    side_effects: ["status=PAID"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "missing/unknown X-User-Role or missing X-User-ID header"
  - id: ERR_FORBIDDEN_ROLE
    http: 403
    condition: "the acting role is not permitted to perform this operation"
  - id: ERR_NOT_FOUND
    http: 404
    condition: "a path- or body-referenced resource does not exist"
  - id: ERR_INVALID_STATE
    http: 409
    condition: "the target resource is not in a state from which this transition is defined"
  - id: ERR_ONBOARDING_INCOMPLETE
    http: 409
    condition: "activate-engagement attempted while onboarding_status != ONBOARDED"
  - id: ERR_OPEN_CLOSES_EXIST
    http: 409
    condition: "offboard attempted while the client has a non-FINALIZED MonthlyClose (open_close_count > 0)"
  - id: ERR_DECEMBER_CLOSE_NOT_FINAL
    http: 409
    condition: "start-reviews attempted while the client's (tax_year, 12) MonthlyClose is not FINALIZED"
  - id: ERR_CLOSE_FINALIZED
    http: 409
    condition: "payroll post/reverse attempted while the linked MonthlyClose.status == FINALIZED"
  - id: ERR_NO_LEDGER_ACCOUNTS
    http: 409
    condition: "complete-onboarding attempted while the client has no ACTIVE LedgerAccount"
  - id: ERR_CROSS_CLIENT_PARENT
    http: 422
    condition: "ledger-account parent_account_id references an account of a different client or a non-ACTIVE account"
  - id: ERR_DUPLICATE_ACCOUNT_CODE
    http: 409
    condition: "account_code already used by a non-ARCHIVED ledger account of the same client"
  - id: ERR_DUPLICATE_PERIOD
    http: 409
    condition: "a non-FINALIZED MonthlyClose for the same client and (period_year, period_month) already exists"
  - id: ERR_PAY_PERIOD_OVERLAP
    http: 409
    condition: "a new PayrollRun's half-open [pay_period_start, pay_period_end) overlaps an existing non-REVERSED run of the same client (adjacent periods do not overlap)"
  - id: ERR_COVENANT_BREACH
    http: 422
    condition: "forecast approve attempted while min_projected_balance_cents < covenant_floor_cents"
  - id: ERR_UNDERPAYMENT
    http: 422
    condition: "AR record-payment would leave paid_amount_cents below amount_cents"
  - id: ERR_MISSING_SCHEDULE_DATE
    http: 422
    condition: "AP schedule attempted without scheduled_pay_date"
  - id: ERR_STALE_VERSION
    http: 412
    condition: "expected_<parent>_version does not equal the parent's current version on an OCC-guarded write"
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "missing/wrong-typed required request-body field, invalid enum value, or non-positive amount/weight"
  - id: ERR_INVALID_PERIOD
    http: 422
    condition: "period_month outside 1..12 on monthly-close creation"
  - id: ERR_INVALID_TASK_STATUS
    http: 422
    condition: "close-task transition to_status is not a member of the CloseTask status enum"
  - id: ERR_NEGATIVE_AMOUNT
    http: 422
    condition: "amount_cents, weight, dept_gross_cents, total_employer_cost_cents, or quoted_fee_cents is less than 1"
  - id: ERR_VALIDATION_LIMIT
    http: 400
    condition: "pagination limit outside [1,100] or offset negative"

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: CFO
    description: "Fractional CFO — owns onboarding sign-offs, engagement lifecycle, approvals, finalization, advisory, billing, and forecasts."
    identity: "opaque"
    exclusive_operations:
      - "schedule-kickoff, complete-onboarding, activate/pause/offboard engagement"
      - "finalize monthly close, approve-review, request-changes"
      - "approve/void AP bills, write-off AR, post/reverse payroll"
      - "scope/cancel catch-up projects, approve forecasts, issue retainer invoices, advisory-signoff, tax-handoff lifecycle"
    shared_operations:
      - "create client/ledger-account/monthly-close/close-task/AR-invoice"
      - "all GET reads"
  - name: Bookkeeper
    description: "Outsourced bookkeeper — owns ledger setup, day-to-day bookkeeping, AP entry/scheduling, payroll allocation, books sign-off."
    identity: "opaque"
    exclusive_operations:
      - "start-ledger-setup"
      - "AP enter/schedule/mark-paid, AR resolve-dispute/record-payment"
      - "payroll create/allocations/allocate, catch-up start/submit-for-review, books-signoff"
    shared_operations:
      - "create ledger-account/monthly-close/close-task/AR-invoice, transition close-tasks"
      - "most GET reads"
  - name: ClientContact
    description: "The client's representative — reviews catch-up work, disputes AR, approves/rejects catch-up, pays retainer invoices."
    identity: "entity_backed:Client"
    exclusive_operations:
      - "catch-up reject/approve, AR dispute"
    shared_operations:
      - "pay retainer invoices, read own client resources"
  - name: PlatformAdmin
    description: "Operational platform administrator — clock control and read-only oversight; not a domain actor."
    identity: "opaque"
    exclusive_operations:
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "create client, all GET reads"
