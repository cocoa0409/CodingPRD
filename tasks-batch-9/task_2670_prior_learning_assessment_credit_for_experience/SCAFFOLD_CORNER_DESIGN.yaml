            - "Program BSCS, Course CS150 (6 credits, LOWER, dept CS) with OC1 8000 bp and OC2 2000 bp."
            - "Student S-1001 MATRICULATED and FacultyAssessor E-9001 (dept CS, credential_rank 2, max_concurrent_assignments 3)."
            - "A PORTFOLIO claim with a 2-artifact portfolio submitted and its 27000-cent invoice waived, so an assignment can be created."
            - "A DRAFT CredentialRecommendation AWS-SAA and a DRAFT ArticulationRule pointing at CS150."
