      - name: corner_rbac_sod_offer_author_cannot_review_own_offer
        claim_type: Segregation of duties
        grounds:
          - validations[priority=10]
          - errors[ERR_SEGREGATION_OF_DUTIES]
          - entities.Offer.fields.created_by_user_id
        distinguishing_aspect: |
          Review is blocked by user identity, not only by role: a ComplianceOfficer request whose
          X-User-ID equals the offer's created_by_user_id returns ERR_SEGREGATION_OF_DUTIES (409)
          and leaves the offer IN_REVIEW, while a different compliance user approves it.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; season S7 LIVE."
            - "Offer SOD_PACK was created by u_designer_1 and is IN_REVIEW."
