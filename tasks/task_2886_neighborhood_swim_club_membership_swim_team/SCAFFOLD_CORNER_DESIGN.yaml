              payload: { membership_id: "${m_a_id}", sponsor_name: "Saturday Trio", guest_count: 3, visit_start_iso: "2027-07-10T14:00:00Z", expected_household_version: "${h_a_v0}" }
              as: PoolManager
              captures: { v_a_id: $.data.id, v_a_weekend: $.data.is_weekend, v_a_passes: $.data.passes_used, v_a_fee: $.data.fee_charged_cents, v_a_variant: $.data.settlement_variant }
            - call: "POST /swim-club/guest-visits"
              payload: { membership_id: "${m_b_id}", sponsor_name: "Thursday Trio", guest_count: 3, visit_start_iso: "2027-07-08T14:00:00Z", expected_household_version: "${h_b_v0}" }
              as: PoolManager
              captures: { v_b_id: $.data.id, v_b_weekend: $.data.is_weekend, v_b_passes: $.data.passes_used, v_b_fee: $.data.fee_charged_cents }
