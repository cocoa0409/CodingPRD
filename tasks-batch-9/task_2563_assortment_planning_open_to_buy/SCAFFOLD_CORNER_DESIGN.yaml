            - "${pstatus} == APPROVED and ${rounds} == 0: because the verdict is WATCH rather than BREACH, no system-triggered reforecast cycle opened"
            - "${sum_vbps} == -667 and ${sum_vstatus} == WATCH: the summary read reports the same verdict fields as the plan row rather than recomputing them from a different month set"
            - "${sum_months} == 2: the summary's month_count still counts both months of the plan, proving the variance exclusion is specific to calculations.variance_verdict and is not a general filter applied to every read"

      - name: variance_prorates_two_mid_flight_months_before_summing
        claim_type: aggregation
        grounds:
          - calculations.variance_verdict
          - calculations.variance_verdict.constants
          - endpoints[POST /otb/actuals-posts]
        distinguishing_aspect: "Two months are mid-flight at once with different week counts - three of four weeks on M1 and one of four on M2 - so the plan side must be prorated per month by weeks_posted and only then summed. The four posts are also asserted individually, which pins weeks_posted as a running count rather than something read at the end, and the sequence deliberately crosses from WATCH to ON_PLAN and back to WATCH so a frozen or cumulative-only implementation cannot pass."
        test_recipe:
