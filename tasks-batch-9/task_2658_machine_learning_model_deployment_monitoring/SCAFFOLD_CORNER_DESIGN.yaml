  # ===========================================================================
  # 4. From Table 4 (Validations)
  # ===========================================================================
  - section: validations
    instances:

      - name: ramp_and_resume_are_blocked_once_the_serve_window_has_expired
        claim_type: Temporal validation
        grounds:
          - validations.priority_63
          - errors.ERR_SERVE_WINDOW_EXPIRED
          - endpoints.POST_deployments_rollout_action
          - entities.Deployment.fields.serve_until
        distinguishing_aspect: |
          The same deployment is legal at one clock value and illegal at a later one with no write in
          between — the gate is `serve_until > clock_now`, evaluated per request. It also separates the
          two rollout actions: HOLD is always allowed (it only reduces exposure) while RESUME re-runs
          every priority-19..63 gate and therefore fails on an expired window, leaving the deployment
          stuck in HELD with its traffic still allocated.
        test_recipe:
          setup:
            - "clock at its 2026-08-01T00:00:00Z startup default"
            - "one REALTIME Deployment with serve_from 2026-08-01T00:00:00Z and serve_until 2026-08-05T00:00:00Z"
          setup_api_calls:
            - call: "POST /models"
              payload: { name: "fraud-scorer", task_type: "CLASSIFICATION", owner_team: "risk-ml" }
              as: MLEngineer
              as_user_id: "u_mle_1"
