scaffold_difficulty_design:
  # =====================================================================
  # Rule 1 — dual_variant_calc (two variants, DIFFERENT entity domains)
  # =====================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: incident_rate_provisional_vs_final
        grounds:
          - calculations.osha_incident_rates
          - entities.Incident.fields.is_osha_recordable
          - endpoints."GET /safety/projects/{projectId}/osha-summary"
        distinguishing_aspect: |
          Dual-variant rates live in the Incident/Project domain: with 1 CLOSED recordable incident and
          1 incident still UNDER_INVESTIGATION against 200000 annual hours, the final variant yields
          trir_final == 1.0 while the provisional worst-case variant yields trir_provisional == 2.0 on
          identical data — a different entity domain than the Subcontractor score instance.
        test_recipe:
          setup:
            - "Project with annual_hours_worked = 200000; worker w (DIRECT); incident I1 CLOSED as recordable+DART (days_away_from_work 3) with compliant negative post-incident drug test; incident I2 UNDER_INVESTIGATION only"
            - "Logical clock at 2026-08-01T08:00:00Z; both incidents occurred in calendar year 2026"
          setup_api_calls:
            - { call: "POST /safety/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T08:00:00Z" }, as: SafetyManager }
            - { call: "POST /safety/projects", payload: { name: "North Tower", location: "Seattle", annual_hours_worked: 200000 }, as: SafetyManager, captures: { p: "$.data.id" } }
            - { call: "POST /safety/workers", payload: { project_id: "${p}", full_name: "A Reyes", employer_type: "DIRECT" }, as: SiteSuperintendent, captures: { w: "$.data.id" } }
            - { call: "POST /safety/incidents", payload: { project_id: "${p}", worker_id: "${w}", incident_type: "INJURY", severity: "SERIOUS", occurred_at: "2026-08-02T08:00:00Z", work_related: true, description: "hand laceration" }, as: SiteSuperintendent, captures: { inc1: "$.data.id" } }
            - { call: "POST /safety/incidents/${inc1}/investigate", payload: { investigation_notes: "statements taken" }, as: SafetyInspector, as_user_id: "insp-1" }
            - { call: "POST /safety/incidents/${inc1}/determination", payload: { medical_treatment_beyond_first_aid: true, days_away_from_work: 3, restricted_duty: false, loss_of_consciousness: false, significant_diagnosis: false }, as: SafetyManager, as_user_id: "sm-1" }
            - { call: "POST /safety/drug-tests", payload: { worker_id: "${w}", test_type: "POST_INCIDENT", incident_id: "${inc1}", collected_at: "2026-08-02T20:00:00Z" }, as: SafetyManager, captures: { dt1: "$.data.id" } }
            - { call: "POST /safety/drug-tests/${dt1}/record-result", payload: { result: "NEGATIVE" }, as: SafetyManager }
            - { call: "POST /safety/incidents/${inc1}/close", payload: {}, as: SafetyManager }
            - { call: "POST /safety/incidents", payload: { project_id: "${p}", worker_id: "${w}", incident_type: "INJURY", severity: "SERIOUS", occurred_at: "2026-08-04T09:00:00Z", work_related: true, description: "suspected fracture" }, as: SiteSuperintendent, captures: { inc2: "$.data.id" } }
            - { call: "POST /safety/incidents/${inc2}/investigate", payload: { investigation_notes: "pending x-ray" }, as: SafetyInspector, as_user_id: "insp-1" }
          trigger:
            - { call: "GET /safety/projects/${p}/osha-summary", payload: { year: 2026 }, as: SafetyManager, captures: { trir_f: "$.data.trir_final", trir_p: "$.data.trir_provisional", dart_f: "$.data.dart_rate_final", dart_p: "$.data.dart_rate_provisional", rc_f: "$.data.recordable_count_final", rc_p: "$.data.recordable_count_provisional" } }
          assert:
            - "osha-summary.recordable_count_final == 1"
            - "osha-summary.recordable_count_provisional == 2"
            - "osha-summary.dart_count_final == 1"
            - "osha-summary.dart_count_provisional == 2"
            - "osha-summary.trir_final == 1.0"
            - "osha-summary.trir_provisional == 2.0"
            - "osha-summary.dart_rate_final == 1.0"
            - "osha-summary.dart_rate_provisional == 2.0"

      - name: subcontractor_score_realtime_vs_period
        grounds:
          - calculations.subcontractor_compliance_score
          - entities.Subcontractor.fields.compliance_score_realtime
          - entities.Subcontractor.fields.compliance_score_period_90d
        distinguishing_aspect: |
          Dual-variant scoring lives in the Subcontractor domain: a MAJOR deficiency created 30 days ago
          and verified closed with disposition CONFIRMED contributes 0 to the realtime variant (closed
          deficiencies drop out) but still deducts 15 in the period_90d variant, so realtime == 100 while
          period_90d == 85 on identical data — a different entity domain than the incident-rate instance.
        test_recipe:
          setup:
            - "Project + Subcontractor; WEEKLY inspection completed by inspector insp-1"
            - "One MAJOR deficiency (created 2026-08-01, by insp-1) assigned to the sub, correction submitted, verified CLOSED with disposition CONFIRMED by insp-2"
            - "Clock then advanced to 2026-08-31T08:00:00Z (30 days after creation — still inside the trailing-90-day window)"
          setup_api_calls:
            - { call: "POST /safety/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T08:00:00Z" }, as: SafetyManager }
            - { call: "POST /safety/projects", payload: { name: "Riverside Garage", location: "Tacoma", annual_hours_worked: 100000 }, as: SafetyManager, captures: { p: "$.data.id" } }
            - { call: "POST /safety/subcontractors", payload: { project_id: "${p}", company_name: "Amp Electric", trade: "electrical" }, as: SafetyManager, captures: { s: "$.data.id" } }
            - { call: "POST /safety/inspections", payload: { project_id: "${p}", inspection_type: "WEEKLY", due_date: "2026-08-10T17:00:00Z" }, as: SafetyInspector, captures: { insp: "$.data.id" } }
            - { call: "POST /safety/inspections/${insp}/complete", payload: { findings_summary: "panel covers missing" }, as: SafetyInspector, as_user_id: "insp-1" }
            - { call: "POST /safety/deficiencies", payload: { inspection_id: "${insp}", description: "missing panel covers", severity: "MAJOR", assigned_subcontractor_id: "${s}" }, as: SafetyInspector, as_user_id: "insp-1", captures: { df: "$.data.id" } }
            - { call: "POST /safety/deficiencies/${df}/submit-correction", payload: { correction_notes: "covers installed" }, as: SubcontractorRep, as_user_id: "${s}" }
            - { call: "POST /safety/deficiencies/${df}/verify", payload: { outcome: "CLOSED", disposition: "CONFIRMED" }, as: SafetyInspector, as_user_id: "insp-2" }
            - { call: "POST /safety/_clock/set_current_utc", payload: { to_iso8601: "2026-08-31T08:00:00Z" }, as: SafetyManager }
          trigger:
            - { call: "GET /safety/subcontractors/${s}", payload: {}, as: SafetyManager, captures: { rt: "$.data.compliance_score_realtime", p90: "$.data.compliance_score_period_90d" } }
          assert:
            - "Subcontractor.${s}.compliance_score_realtime == 100"
            - "Subcontractor.${s}.compliance_score_period_90d == 85"
            - "realtime minus period_90d == 15 (the MAJOR deduction retained only in the period variant)"

  # =====================================================================
  # Rule 2 — combinatorial_formula (instances in DIFFERENT modes)
  # =====================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: score_tiered_overdue_doubling
        grounds:
          - calculations.subcontractor_compliance_score
          - entities.Deficiency.fields.status
        distinguishing_aspect: |
          Mode (a) — >=3 inputs with non-linear interaction: severity-tiered deduction (MAJOR=15),
          conditional doubling when status flips OVERDUE (15 -> 30), plus a flat 25 recordable-incident
          deduction, floored at 0: 100 - 30 - 25 == 45 realtime (and 100 - 15 - 25 == 60 period, no doubling).
        test_recipe:
          setup:
            - "Project; Subcontractor with one linked worker (employer_type SUBCONTRACTOR)"
            - "MAJOR deficiency assigned to the sub created 2026-08-01 (due 2026-08-08T08:00:00Z); clock advanced to 2026-08-10T08:00:00Z so it is OVERDUE"
            - "One recordable incident (medical_treatment_beyond_first_aid=true, days_away 0) on the sub's worker, status DETERMINATION_MADE (no close, so no drug test needed)"
          setup_api_calls:
            - { call: "POST /safety/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T08:00:00Z" }, as: SafetyManager }
            - { call: "POST /safety/projects", payload: { name: "Pier 62", location: "Seattle", annual_hours_worked: 80000 }, as: SafetyManager, captures: { p: "$.data.id" } }
            - { call: "POST /safety/subcontractors", payload: { project_id: "${p}", company_name: "Deep Foundations", trade: "excavation" }, as: SafetyManager, captures: { s: "$.data.id" } }
            - { call: "POST /safety/workers", payload: { project_id: "${p}", full_name: "T Okafor", employer_type: "SUBCONTRACTOR", subcontractor_id: "${s}" }, as: SiteSuperintendent, captures: { sw: "$.data.id" } }
            - { call: "POST /safety/inspections", payload: { project_id: "${p}", inspection_type: "WEEKLY", due_date: "2026-08-05T17:00:00Z" }, as: SafetyInspector, captures: { insp: "$.data.id" } }
            - { call: "POST /safety/inspections/${insp}/complete", payload: { findings_summary: "shoring gap" }, as: SafetyInspector, as_user_id: "insp-1" }
            - { call: "POST /safety/deficiencies", payload: { inspection_id: "${insp}", description: "shoring not per plan", severity: "MAJOR", assigned_subcontractor_id: "${s}" }, as: SafetyInspector, as_user_id: "insp-1", captures: { df: "$.data.id" } }
            - { call: "POST /safety/_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T08:00:00Z" }, as: SafetyManager }
            - { call: "POST /safety/incidents", payload: { project_id: "${p}", worker_id: "${sw}", incident_type: "INJURY", severity: "SERIOUS", occurred_at: "2026-08-09T10:00:00Z", work_related: true, description: "struck-by" }, as: SiteSuperintendent, captures: { inc: "$.data.id" } }
            - { call: "POST /safety/incidents/${inc}/investigate", payload: { investigation_notes: "spotter absent" }, as: SafetyInspector, as_user_id: "insp-1" }
            - { call: "POST /safety/incidents/${inc}/determination", payload: { medical_treatment_beyond_first_aid: true, days_away_from_work: 0, restricted_duty: false, loss_of_consciousness: false, significant_diagnosis: false }, as: SafetyManager, as_user_id: "sm-1" }
          trigger:
            - { call: "GET /safety/subcontractors/${s}", payload: {}, as: SafetyManager, captures: { rt: "$.data.compliance_score_realtime", p90: "$.data.compliance_score_period_90d" } }
          assert:
            - "Subcontractor.${s}.compliance_score_realtime == 45   # 100 - 15(MAJOR) - 15(overdue double) - 25(recordable)"
            - "Subcontractor.${s}.compliance_score_period_90d == 60  # 100 - 15 - 25, no doubling in the period variant"
            - "Deficiency.${df}.status == OVERDUE"

      - name: osha_rate_rounding_order_spread
        grounds:
          - calculations.osha_incident_rates
        distinguishing_aspect: |
          Mode (b) — nested rounding order pinned: each rate is rounded to 1 decimal FIRST and the spread
          is computed FROM THE ROUNDED components. With 150000 hours, 2 final recordables, 1 final DART:
          trir_final = round(2.666...,1) = 2.7, dart_rate_final = round(1.333...,1) = 1.3, and
          rate_spread_final = 2.7 - 1.3 = 1.4 — whereas rounding the unrounded difference would give 1.3.
        test_recipe:
          setup:
            - "Project with annual_hours_worked = 150000; worker w"
            - "Two CLOSED recordable incidents in 2026: I1 with days_away_from_work = 5 (DART), I2 with medical treatment only (non-DART); each with a compliant NEGATIVE post-incident drug test"
          setup_api_calls:
            - { call: "POST /safety/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T08:00:00Z" }, as: SafetyManager }
            - { call: "POST /safety/projects", payload: { name: "Cedar Ridge", location: "Bellevue", annual_hours_worked: 150000 }, as: SafetyManager, captures: { p: "$.data.id" } }
            - { call: "POST /safety/workers", payload: { project_id: "${p}", full_name: "B Sato", employer_type: "DIRECT" }, as: SiteSuperintendent, captures: { w: "$.data.id" } }
            - { call: "POST /safety/incidents", payload: { project_id: "${p}", worker_id: "${w}", incident_type: "INJURY", severity: "SERIOUS", occurred_at: "2026-08-02T08:00:00Z", work_related: true, description: "fall from ladder" }, as: SiteSuperintendent, captures: { inc1: "$.data.id" } }
            - { call: "POST /safety/incidents/${inc1}/investigate", payload: { investigation_notes: "ladder inspection" }, as: SafetyInspector, as_user_id: "insp-1" }
            - { call: "POST /safety/incidents/${inc1}/determination", payload: { medical_treatment_beyond_first_aid: true, days_away_from_work: 5, restricted_duty: false, loss_of_consciousness: false, significant_diagnosis: false }, as: SafetyManager, as_user_id: "sm-1" }
            - { call: "POST /safety/drug-tests", payload: { worker_id: "${w}", test_type: "POST_INCIDENT", incident_id: "${inc1}", collected_at: "2026-08-02T20:00:00Z" }, as: SafetyManager, captures: { dt1: "$.data.id" } }
            - { call: "POST /safety/drug-tests/${dt1}/record-result", payload: { result: "NEGATIVE" }, as: SafetyManager }
            - { call: "POST /safety/incidents/${inc1}/close", payload: {}, as: SafetyManager }
            - { call: "POST /safety/incidents", payload: { project_id: "${p}", worker_id: "${w}", incident_type: "INJURY", severity: "SERIOUS", occurred_at: "2026-08-03T09:00:00Z", work_related: true, description: "stitches" }, as: SiteSuperintendent, captures: { inc2: "$.data.id" } }
            - { call: "POST /safety/incidents/${inc2}/investigate", payload: { investigation_notes: "tool guard missing" }, as: SafetyInspector, as_user_id: "insp-1" }
            - { call: "POST /safety/incidents/${inc2}/determination", payload: { medical_treatment_beyond_first_aid: true, days_away_from_work: 0, restricted_duty: false, loss_of_consciousness: false, significant_diagnosis: false }, as: SafetyManager, as_user_id: "sm-1" }
            - { call: "POST /safety/drug-tests", payload: { worker_id: "${w}", test_type: "POST_INCIDENT", incident_id: "${inc2}", collected_at: "2026-08-04T09:00:00Z" }, as: SafetyManager, captures: { dt2: "$.data.id" } }
            - { call: "POST /safety/drug-tests/${dt2}/record-result", payload: { result: "NEGATIVE" }, as: SafetyManager }
            - { call: "POST /safety/incidents/${inc2}/close", payload: {}, as: SafetyManager }
          trigger:
            - { call: "GET /safety/projects/${p}/osha-summary", payload: { year: 2026 }, as: ComplianceAuditor, captures: { trir: "$.data.trir_final", dart: "$.data.dart_rate_final", spread: "$.data.rate_spread_final" } }
          assert:
            - "osha-summary.trir_final == 2.7          # round_half_up(400000/150000, 1)"
            - "osha-summary.dart_rate_final == 1.3     # round_half_up(200000/150000, 1)"
            - "osha-summary.rate_spread_final == 1.4   # 2.7 - 1.3 from ROUNDED components, NOT round(1.333...,1) == 1.3"

  # =====================================================================
  # Rule 3 — non_linear_state_machine (non-linear shapes, DIFFERENT entities)
  # =====================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: deficiency_correction_reject_reopen_cycle
        grounds:
          - state_machines.Deficiency.CORRECTION_SUBMITTED_to_OPEN
          - state_machines.Deficiency.CORRECTION_SUBMITTED_to_VERIFIED_CLOSED
        distinguishing_aspect: |
          Cyclic machine on Deficiency: OPEN -> CORRECTION_SUBMITTED -> OPEN (verify REJECTED) ->
          CORRECTION_SUBMITTED -> VERIFIED_CLOSED — the reopen loop must be traversable twice;
          paired with the branching-fork instance on the DIFFERENT entity DrugTestRecord.
        test_recipe:
          setup:
            - "Project; WEEKLY inspection COMPLETED by insp-1; MINOR deficiency (no subcontractor) created by insp-1, status OPEN"
          setup_api_calls:
            - { call: "POST /safety/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T08:00:00Z" }, as: SafetyManager }
            - { call: "POST /safety/projects", payload: { name: "Lincoln Square", location: "Bellevue", annual_hours_worked: 120000 }, as: SafetyManager, captures: { p: "$.data.id" } }
            - { call: "POST /safety/inspections", payload: { project_id: "${p}", inspection_type: "WEEKLY", due_date: "2026-08-05T17:00:00Z" }, as: SafetyInspector, captures: { insp: "$.data.id" } }
            - { call: "POST /safety/inspections/${insp}/complete", payload: { findings_summary: "housekeeping" }, as: SafetyInspector, as_user_id: "insp-1" }
            - { call: "POST /safety/deficiencies", payload: { inspection_id: "${insp}", description: "debris in egress path", severity: "MINOR" }, as: SafetyInspector, as_user_id: "insp-1", captures: { df: "$.data.id" } }
          trigger:
            - { call: "POST /safety/deficiencies/${df}/submit-correction", payload: { correction_notes: "cleared" }, as: SiteSuperintendent, captures: { st1: "$.data.status" } }
            - { call: "POST /safety/deficiencies/${df}/verify", payload: { outcome: "REJECTED" }, as: SafetyInspector, as_user_id: "insp-2", captures: { st2: "$.data.status" } }
            - { call: "POST /safety/deficiencies/${df}/submit-correction", payload: { correction_notes: "rework with photo" }, as: SiteSuperintendent, captures: { st3: "$.data.status" } }
            - { call: "POST /safety/deficiencies/${df}/verify", payload: { outcome: "CLOSED", disposition: "CONFIRMED" }, as: SafetyInspector, as_user_id: "insp-2", captures: { st4: "$.data.status" } }
            - { call: "GET /safety/projects/${p}", payload: {}, as: SafetyManager, captures: { odc: "$.data.open_deficiency_count" } }
          assert:
            - "first submit: Deficiency.${df}.status == CORRECTION_SUBMITTED"
            - "verify REJECTED: Deficiency.${df}.status == OPEN   # cycle back, not terminal"
            - "second submit: Deficiency.${df}.status == CORRECTION_SUBMITTED"
            - "verify CLOSED: Deficiency.${df}.status == VERIFIED_CLOSED"
            - "Project.${p}.open_deficiency_count == 0"

      - name: drug_test_branching_fork_divergent_effects
        grounds:
          - state_machines.DrugTestRecord.PENDING_RESULT_to_POSITIVE
          - state_machines.DrugTestRecord.PENDING_RESULT_to_NEGATIVE
        distinguishing_aspect: |
          Branching fork on DrugTestRecord: PENDING_RESULT -> POSITIVE cascades the worker to SUSPENDED,
          while PENDING_RESULT -> NEGATIVE leaves the worker CLEARED — two branches with divergent side
          effects, on a DIFFERENT entity than the Deficiency cycle instance.
        test_recipe:
          setup:
            - "Project with ACTIVE plan; workers w1 and w2 both fully CLEARED (oriented + VERIFIED OSHA_10)"
          setup_api_calls:
            - { call: "POST /safety/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T08:00:00Z" }, as: SafetyManager }
            - { call: "POST /safety/projects", payload: { name: "Harbor Steps", location: "Seattle", annual_hours_worked: 90000 }, as: SafetyManager, captures: { p: "$.data.id", p_v: "$.data.version" } }
            - { call: "POST /safety/safety-plans", payload: { project_id: "${p}", effective_date: "2026-08-01" }, as: SafetyManager, captures: { pl: "$.data.id" } }
            - { call: "POST /safety/safety-plans/${pl}/activate", payload: { expected_project_version: "${p_v}" }, as: SafetyManager }
            - { call: "POST /safety/workers", payload: { project_id: "${p}", full_name: "C Diaz", employer_type: "DIRECT" }, as: SiteSuperintendent, captures: { w1: "$.data.id" } }
            - { call: "POST /safety/training-certificates", payload: { worker_id: "${w1}", cert_type: "OSHA_10", issued_date: "2026-07-01", expires_date: "2027-07-01" }, as: SiteSuperintendent, captures: { c1: "$.data.id" } }
            - { call: "POST /safety/training-certificates/${c1}/verify", payload: {}, as: SafetyInspector, as_user_id: "insp-1" }
            - { call: "POST /safety/workers/${w1}/complete-orientation", payload: {}, as: SiteSuperintendent }
            - { call: "POST /safety/workers/${w1}/clear", payload: {}, as: SiteSuperintendent }
            - { call: "POST /safety/workers", payload: { project_id: "${p}", full_name: "D Novak", employer_type: "DIRECT" }, as: SiteSuperintendent, captures: { w2: "$.data.id" } }
            - { call: "POST /safety/training-certificates", payload: { worker_id: "${w2}", cert_type: "OSHA_10", issued_date: "2026-07-01", expires_date: "2027-07-01" }, as: SiteSuperintendent, captures: { c2: "$.data.id" } }
            - { call: "POST /safety/training-certificates/${c2}/verify", payload: {}, as: SafetyInspector, as_user_id: "insp-1" }
            - { call: "POST /safety/workers/${w2}/complete-orientation", payload: {}, as: SiteSuperintendent }
            - { call: "POST /safety/workers/${w2}/clear", payload: {}, as: SiteSuperintendent }
          trigger:
            - { call: "POST /safety/drug-tests", payload: { worker_id: "${w1}", test_type: "RANDOM", collected_at: "2026-08-05T09:00:00Z" }, as: SafetyManager, captures: { dt1: "$.data.id" } }
            - { call: "POST /safety/drug-tests/${dt1}/record-result", payload: { result: "POSITIVE" }, as: SafetyManager }
            - { call: "POST /safety/drug-tests", payload: { worker_id: "${w2}", test_type: "RANDOM", collected_at: "2026-08-05T09:30:00Z" }, as: SafetyManager, captures: { dt2: "$.data.id" } }
            - { call: "POST /safety/drug-tests/${dt2}/record-result", payload: { result: "NEGATIVE" }, as: SafetyManager }
            - { call: "GET /safety/workers/${w1}", payload: {}, as: SafetyManager, captures: { w1s: "$.data.status", w1r: "$.data.suspension_reason" } }
            - { call: "GET /safety/workers/${w2}", payload: {}, as: SafetyManager, captures: { w2s: "$.data.status" } }
          assert:
            - "DrugTestRecord.${dt1}.status == POSITIVE"
            - "Worker.${w1}.status == SUSPENDED and suspension_reason == 'POSITIVE_DRUG_TEST'   # POSITIVE branch fires the cascade"
            - "DrugTestRecord.${dt2}.status == NEGATIVE"
            - "Worker.${w2}.status == CLEARED   # NEGATIVE branch has no worker side effect"

  # =====================================================================
  # Rule 4 — transitive_cascade (depth >= 3 and >= 2, DIFFERENT triggers)
  # =====================================================================
  - rule_id: transitive_cascade
    instances:
      - name: critical_incident_freeze_cascade
        grounds:
          - state_machines.Incident.transitions (creation side effects)
          - calculations.project_posture
          - state_machines.Permit.ISSUED_to_SUSPENDED
          - state_machines.JobHazardAnalysis.APPROVED_to_RE_REVIEW_REQUIRED
        distinguishing_aspect: |
          Depth-3 cascade triggered by INCIDENT CREATION (severity CRITICAL): incident -> Project posture
          FROZEN (link 1) -> all ISSUED permits SUSPENDED with reason POSTURE_FROZEN (link 2, caused by the
          posture flip) -> each suspended permit's JHA RE_REVIEW_REQUIRED (link 3, caused by the suspension).
        test_recipe:
          setup:
            - "Project with ACTIVE plan; worker w CLEARED; huddle CONDUCTED; JHA APPROVED; EXCAVATION permit ISSUED with crew [w]; posture NORMAL, issued_permit_count == 1"
          setup_api_calls:
            - { call: "POST /safety/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T08:00:00Z" }, as: SafetyManager }
            - { call: "POST /safety/projects", payload: { name: "Tower 12", location: "Renton", annual_hours_worked: 200000 }, as: SafetyManager, captures: { p: "$.data.id", p_v: "$.data.version" } }
            - { call: "POST /safety/safety-plans", payload: { project_id: "${p}", effective_date: "2026-08-01" }, as: SafetyManager, captures: { pl: "$.data.id" } }
            - { call: "POST /safety/safety-plans/${pl}/activate", payload: { expected_project_version: "${p_v}" }, as: SafetyManager }
