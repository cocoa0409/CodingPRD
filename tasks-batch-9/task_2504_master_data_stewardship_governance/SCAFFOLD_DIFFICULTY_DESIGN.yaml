# ===========================================================================
# 1.8 Scaffold Difficulty Design - Test Targeting Index
# Task 2504 - Master Data Stewardship & Governance
# 9 rule_ids x 2 instances = 18 instances
# Every logical-clock-dependent chain pins the clock explicitly; the server
# default is 2026-08-01T00:00:00Z.
# ===========================================================================
scaffold_difficulty_design:

  # =========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: scorecard_provisional_vs_certified_denominator_divergence
        grounds:
          - calculations.domain_quality_scorecard
          - entities.Domain.fields.quality_score_provisional
          - entities.Domain.fields.quality_score_certified
          - entities.ScorecardRun.fields.rules_evaluated_count
          - endpoints[POST /mdm/domains/{domain_id}/scorecard-runs]
        distinguishing_aspect: |
          PROVISIONAL scores only the ACTIVE rules that the payload measured (QR1+QR2,
          denominator 70) while CERTIFIED keeps every ACTIVE rule in the denominator and
          treats the unmeasured QR3 as measured_pct 0.00 (denominator 90) - identical
          measurement payloads therefore yield 89.29 vs 69.44 on the same domain.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-05T00:00:00Z."
            - "Domain CUSTOMER, classification_level INTERNAL, expected_attribute_count 5, status ACTIVE, governance_posture OPEN."
            - "Steward Olivia (PRINCIPAL) holds DATA_OWNER; steward Sam (SENIOR) holds DATA_STEWARD, both from 2026-08-01 open-ended."
            - "SourceSystem ERP (trust_tier 4) is CERTIFIED and holds the ACTIVE AUTHORITATIVE registration."
            - "Three ACTIVE quality rules: QR1 weight 40 threshold 90.00 CRITICAL, QR2 weight 30 threshold 80.00 HIGH, QR3 weight 20 threshold 95.00 MEDIUM (weight budget 90 <= 100)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T00:00:00Z" }
              as: GovernanceAdmin
            - call: "POST /mdm/domains"
              payload: { code: "CUSTOMER", name: "Customer Master", classification_level: "INTERNAL", notification_lead_days_floor: 5, expected_attribute_count: 5 }
              as: GovernanceAdmin
              captures: { dom_id: $.data.id, dom_v1: $.data.version }
            - call: "POST /mdm/stewards"
              payload: { full_name: "Olivia Owner", email: "olivia@mdm.test", certification_level: "PRINCIPAL" }
              as: GovernanceAdmin
              captures: { own_id: $.data.id }
            - call: "POST /mdm/stewards"
              payload: { full_name: "Sam Steward", email: "sam@mdm.test", certification_level: "SENIOR" }
              as: GovernanceAdmin
              captures: { std_id: $.data.id }
            - call: "POST /mdm/steward-assignments"
              payload: { domain_id: "${dom_id}", steward_id: "${own_id}", steward_role: "DATA_OWNER", effective_from: "2026-08-01T00:00:00Z", expected_domain_version: "${dom_v1}" }
              as: GovernanceAdmin
            - call: "GET /mdm/domains/${dom_id}"
              as: GovernanceAdmin
              captures: { dom_v2: $.data.version }
            - call: "POST /mdm/steward-assignments"
              payload: { domain_id: "${dom_id}", steward_id: "${std_id}", steward_role: "DATA_STEWARD", effective_from: "2026-08-01T00:00:00Z", expected_domain_version: "${dom_v2}" }
              as: GovernanceAdmin
            - call: "POST /mdm/source-systems"
              payload: { code: "ERP", name: "ERP Core", trust_tier: 4 }
              as: GovernanceAdmin
              captures: { erp_id: $.data.id }
            - call: "POST /mdm/source-systems/${erp_id}/certify"
              payload: {}
              as: GovernanceAdmin
            - call: "GET /mdm/domains/${dom_id}"
              as: GovernanceAdmin
              captures: { dom_v3: $.data.version }
            - call: "POST /mdm/source-registrations"
              payload: { domain_id: "${dom_id}", source_system_id: "${erp_id}", role: "AUTHORITATIVE", trust_rank: 1, effective_from: "2026-08-01T00:00:00Z", expected_domain_version: "${dom_v3}" }
              as: GovernanceAdmin
            - call: "POST /mdm/quality-rules"
              payload: { domain_id: "${dom_id}", owner_steward_id: "${own_id}", rule_code: "QR1", dimension: "COMPLETENESS", weight_points: 40, threshold_pct: 90.00, severity: "CRITICAL" }
              as: DataSteward
              as_user_id: "${std_id}"
              captures: { qr1_id: $.data.id }
            - call: "POST /mdm/quality-rules"
              payload: { domain_id: "${dom_id}", owner_steward_id: "${std_id}", rule_code: "QR2", dimension: "VALIDITY", weight_points: 30, threshold_pct: 80.00, severity: "HIGH" }
              as: DataSteward
              as_user_id: "${std_id}"
              captures: { qr2_id: $.data.id }
            - call: "POST /mdm/quality-rules"
              payload: { domain_id: "${dom_id}", owner_steward_id: "${std_id}", rule_code: "QR3", dimension: "TIMELINESS", weight_points: 20, threshold_pct: 95.00, severity: "MEDIUM" }
              as: DataSteward
              as_user_id: "${std_id}"
              captures: { qr3_id: $.data.id }
            - call: "POST /mdm/domains/${dom_id}/activate"
              payload: {}
              as: GovernanceAdmin
          trigger:
            - call: "POST /mdm/domains/${dom_id}/scorecard-runs"
              payload: { basis: "PROVISIONAL", measurements: [ { rule_code: "QR1", measured_pct: 90.00 }, { rule_code: "QR2", measured_pct: 60.00 } ] }
              as: DataSteward
              as_user_id: "${std_id}"
              captures: { run1_id: $.data.id, run1_score: $.data.weighted_score, run1_evaluated: $.data.rules_evaluated_count }
            - call: "POST /mdm/domains/${dom_id}/scorecard-runs"
              payload: { basis: "CERTIFIED", measurements: [ { rule_code: "QR1", measured_pct: 90.00 }, { rule_code: "QR2", measured_pct: 60.00 } ] }
              as: DataSteward
              as_user_id: "${std_id}"
              captures: { run2_id: $.data.id, run2_score: $.data.weighted_score, run2_evaluated: $.data.rules_evaluated_count, run2_failed: $.data.rules_failed_count, run2_created: $.data.findings_created_count }
            - call: "GET /mdm/domains/${dom_id}"
              as: GovernanceAdmin
              captures: { prov_score: $.data.quality_score_provisional, cert_score: $.data.quality_score_certified, posture_after: $.data.governance_posture, weight_after: $.data.open_finding_weight }
          assert:
            - "${run1_score} == 89.29"
            - "${run1_evaluated} == 2"
            - "${run2_score} == 69.44"
            - "${run2_evaluated} == 3"
            - "${run2_failed} == 2"
            - "${run2_created} == 1"
            - "${prov_score} == 89.29"
            - "${cert_score} == 69.44"
            - "ScorecardRun.${run1_id}.basis == PROVISIONAL and ScorecardRun.${run1_id}.run_seq == 1"
            - "ScorecardRun.${run2_id}.basis == CERTIFIED and ScorecardRun.${run2_id}.run_seq == 2"
            - "QualityFinding on quality_rule_id ${qr1_id} does not exist (measured_pct 90.00 == threshold_pct 90.00 earns full 40 weight_points)"
            - "QualityFinding on quality_rule_id ${qr3_id} has status OPEN, measured_pct 0.00 and gap_pct 95.00 (created only by the CERTIFIED run)"
            - "${weight_after} == 11.00"
            - "${posture_after} == OPEN"

      - name: survivorship_source_priority_vs_score_priority_survivor_swap
        grounds:
          - calculations.master_record_survivorship_score
          - entities.MergeProposal.fields.survivorship_variant
          - entities.MergeProposal.fields.effective_survivor_master_record_id
          - entities.MergeProposal.fields.survivor_swapped
          - state_machines.MergeProposal.UNDER_REVIEW_to_MERGED
        distinguishing_aspect: |
          On two structurally identical record pairs (ERP record scoring 88.00, CRM record
          scoring 78.00) SOURCE_PRIORITY elects the LOWER-scoring CRM record because CRM
          carries the ACTIVE AUTHORITATIVE registration, while after the authoritative
          designation is superseded onto WMS the same pair resolves under SCORE_PRIORITY to
          the higher-scoring ERP record - survivor_swapped flips true then false.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-05T00:00:00Z."
            - "Domain CUSTOMER (DRAFT is sufficient; posture is OPEN because an ACTIVE AUTHORITATIVE registration exists), expected_attribute_count 5."
            - "SourceSystems ERP (trust_tier 4), CRM (trust_tier 5) and WMS (trust_tier 3) all CERTIFIED; CRM holds the ACTIVE AUTHORITATIVE registration, ERP a CONTRIBUTING one."
            - "Records A (ERP, 4 of 5 attributes, last_verified_at 2026-07-01) and B (CRM, 2 of 5 attributes, last_verified_at 2026-06-01) are CURATED; A2/B2 are their exact clones under different natural keys."
            - "Two proposals, each declaring the ERP record as survivor, are UNDER_REVIEW with match_score 74.00 (MEDIUM)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T00:00:00Z" }
              as: GovernanceAdmin
            - call: "POST /mdm/domains"
              payload: { code: "CUSTOMER", name: "Customer Master", classification_level: "INTERNAL", notification_lead_days_floor: 5, expected_attribute_count: 5 }
              as: GovernanceAdmin
              captures: { dom_id: $.data.id, dom_v1: $.data.version }
            - call: "POST /mdm/stewards"
              payload: { full_name: "Olivia Owner", email: "olivia@mdm.test", certification_level: "PRINCIPAL" }
              as: GovernanceAdmin
              captures: { own_id: $.data.id }
            - call: "POST /mdm/stewards"
              payload: { full_name: "Sam Steward", email: "sam@mdm.test", certification_level: "SENIOR" }
              as: GovernanceAdmin
              captures: { std_id: $.data.id }
            - call: "POST /mdm/steward-assignments"
              payload: { domain_id: "${dom_id}", steward_id: "${own_id}", steward_role: "DATA_OWNER", effective_from: "2026-08-01T00:00:00Z", expected_domain_version: "${dom_v1}" }
              as: GovernanceAdmin
            - call: "GET /mdm/domains/${dom_id}"
              as: GovernanceAdmin
              captures: { dom_v2: $.data.version }
            - call: "POST /mdm/steward-assignments"
              payload: { domain_id: "${dom_id}", steward_id: "${std_id}", steward_role: "DATA_STEWARD", effective_from: "2026-08-01T00:00:00Z", expected_domain_version: "${dom_v2}" }
              as: GovernanceAdmin
            - call: "POST /mdm/source-systems"
              payload: { code: "ERP", name: "ERP Core", trust_tier: 4 }
              as: GovernanceAdmin
              captures: { erp_id: $.data.id }
            - call: "POST /mdm/source-systems/${erp_id}/certify"
              payload: {}
              as: GovernanceAdmin
            - call: "POST /mdm/source-systems"
              payload: { code: "CRM", name: "CRM Cloud", trust_tier: 5 }
              as: GovernanceAdmin
              captures: { crm_id: $.data.id }
            - call: "POST /mdm/source-systems/${crm_id}/certify"
              payload: {}
              as: GovernanceAdmin
            - call: "POST /mdm/source-systems"
              payload: { code: "WMS", name: "Warehouse Master", trust_tier: 3 }
              as: GovernanceAdmin
              captures: { wms_id: $.data.id }
            - call: "POST /mdm/source-systems/${wms_id}/certify"
              payload: {}
              as: GovernanceAdmin
            - call: "GET /mdm/domains/${dom_id}"
              as: GovernanceAdmin
              captures: { dom_v3: $.data.version }
            - call: "POST /mdm/source-registrations"
              payload: { domain_id: "${dom_id}", source_system_id: "${crm_id}", role: "AUTHORITATIVE", trust_rank: 1, effective_from: "2026-08-01T00:00:00Z", expected_domain_version: "${dom_v3}" }
              as: GovernanceAdmin
              captures: { reg_crm_id: $.data.id }
            - call: "GET /mdm/domains/${dom_id}"
              as: GovernanceAdmin
              captures: { dom_v4: $.data.version }
            - call: "POST /mdm/source-registrations"
              payload: { domain_id: "${dom_id}", source_system_id: "${erp_id}", role: "CONTRIBUTING", trust_rank: 2, effective_from: "2026-08-01T00:00:00Z", expected_domain_version: "${dom_v4}" }
              as: GovernanceAdmin
            - call: "POST /mdm/master-records"
              payload: { domain_id: "${dom_id}", source_system_id: "${erp_id}", natural_key: "ERP-CUST-1001", attributes: { legal_name: "Acme Industrial", tax_id: "TX-77", billing_city: "Austin", contact_email: "ops@acme.test" }, last_verified_at: "2026-07-01T00:00:00Z" }
              as: DataSteward
              as_user_id: "${std_id}"
              captures: { rec_a_id: $.data.id, rec_a_completeness: $.data.completeness_pct, rec_a_score: $.data.survivorship_score }
            - call: "POST /mdm/master-records/${rec_a_id}/curate"
              payload: {}
              as: DataSteward
              as_user_id: "${std_id}"
            - call: "POST /mdm/master-records"
              payload: { domain_id: "${dom_id}", source_system_id: "${crm_id}", natural_key: "CRM-CUST-1001", attributes: { legal_name: "Acme Ind.", duns: "D-4410" }, last_verified_at: "2026-06-01T00:00:00Z" }
              as: DataSteward
              as_user_id: "${std_id}"
              captures: { rec_b_id: $.data.id, rec_b_completeness: $.data.completeness_pct, rec_b_score: $.data.survivorship_score }
            - call: "POST /mdm/master-records/${rec_b_id}/curate"
              payload: {}
              as: DataSteward
              as_user_id: "${std_id}"
            - call: "POST /mdm/master-records"
              payload: { domain_id: "${dom_id}", source_system_id: "${erp_id}", natural_key: "ERP-CUST-2002", attributes: { legal_name: "Acme Industrial", tax_id: "TX-77", billing_city: "Austin", contact_email: "ops@acme.test" }, last_verified_at: "2026-07-01T00:00:00Z" }
              as: DataSteward
              as_user_id: "${std_id}"
              captures: { rec_a2_id: $.data.id }
            - call: "POST /mdm/master-records/${rec_a2_id}/curate"
              payload: {}
              as: DataSteward
              as_user_id: "${std_id}"
            - call: "POST /mdm/master-records"
              payload: { domain_id: "${dom_id}", source_system_id: "${crm_id}", natural_key: "CRM-CUST-2002", attributes: { legal_name: "Acme Ind.", duns: "D-4410" }, last_verified_at: "2026-06-01T00:00:00Z" }
              as: DataSteward
              as_user_id: "${std_id}"
              captures: { rec_b2_id: $.data.id }
            - call: "POST /mdm/master-records/${rec_b2_id}/curate"
              payload: {}
              as: DataSteward
              as_user_id: "${std_id}"
            - call: "POST /mdm/merge-proposals"
              payload: { survivor_master_record_id: "${rec_a_id}", duplicate_master_record_id: "${rec_b_id}", name_similarity_pct: 90.00, key_overlap_pct: 70.00 }
              as: DataSteward
              as_user_id: "${std_id}"
              captures: { mp1_id: $.data.id, mp1_score: $.data.match_score, mp1_conf: $.data.match_confidence }
            - call: "POST /mdm/merge-proposals/${mp1_id}/review"
              payload: {}
              as: DataSteward
              as_user_id: "${std_id}"
            - call: "POST /mdm/merge-proposals"
              payload: { survivor_master_record_id: "${rec_a2_id}", duplicate_master_record_id: "${rec_b2_id}", name_similarity_pct: 90.00, key_overlap_pct: 70.00 }
              as: DataSteward
              as_user_id: "${std_id}"
              captures: { mp2_id: $.data.id }
            - call: "POST /mdm/merge-proposals/${mp2_id}/review"
              payload: {}
              as: DataSteward
              as_user_id: "${std_id}"
          trigger:
            - call: "POST /mdm/merge-proposals/${mp1_id}/decide"
              payload: { decision: "MERGE", override_justification: "Duplicate confirmed via tax id and DUNS cross-check" }
              as: DataOwner
              as_user_id: "${own_id}"
              captures: { mp1_variant: $.data.survivorship_variant, mp1_effective: $.data.effective_survivor_master_record_id, mp1_swapped: $.data.survivor_swapped }
            - call: "GET /mdm/domains/${dom_id}"
              as: GovernanceAdmin
              captures: { dom_v5: $.data.version }
            - call: "POST /mdm/source-registrations"
              payload: { domain_id: "${dom_id}", source_system_id: "${wms_id}", role: "AUTHORITATIVE", trust_rank: 1, effective_from: "2026-08-05T00:00:00Z", expected_domain_version: "${dom_v5}" }
              as: GovernanceAdmin
            - call: "POST /mdm/merge-proposals/${mp2_id}/decide"
              payload: { decision: "MERGE", override_justification: "Duplicate confirmed via tax id and DUNS cross-check" }
              as: DataOwner
              as_user_id: "${own_id}"
              captures: { mp2_variant: $.data.survivorship_variant, mp2_effective: $.data.effective_survivor_master_record_id, mp2_swapped: $.data.survivor_swapped }
            - call: "GET /mdm/master-records/${rec_b_id}"
              as: GovernanceAdmin
              captures: { b_completeness: $.data.completeness_pct, b_score: $.data.survivorship_score, b_verified: $.data.last_verified_at }
            - call: "GET /mdm/master-records/${rec_a2_id}"
              as: GovernanceAdmin
              captures: { a2_completeness: $.data.completeness_pct, a2_score: $.data.survivorship_score }
          assert:
            - "${rec_a_completeness} == 80.00 and ${rec_a_score} == 88.00"
            - "${rec_b_completeness} == 40.00 and ${rec_b_score} == 78.00"
            - "${mp1_score} == 74.00 and ${mp1_conf} == MEDIUM"
            - "${mp1_variant} == SOURCE_PRIORITY"
            - "${mp1_effective} == ${rec_b_id}"
            - "${mp1_swapped} == true"
            - "MasterRecord.${rec_a_id}.curation_status == MERGED_AWAY and MasterRecord.${rec_a_id}.superseded_by_master_record_id == ${rec_b_id}"
            - "${b_completeness} == 100.00"
            - "${b_score} == 106.00"
            - "${b_verified} == 2026-07-01T00:00:00Z"
            - "MergeProposal.${mp1_id}.survivorship_field_map == { legal_name: CRM-CUST-1001, duns: CRM-CUST-1001, tax_id: ERP-CUST-1001, billing_city: ERP-CUST-1001, contact_email: ERP-CUST-1001 }"
            - "SourceRegistration.${reg_crm_id}.status == SUPERSEDED and SourceRegistration.${reg_crm_id}.effective_to == 2026-08-05T00:00:00Z"
            - "${mp2_variant} == SCORE_PRIORITY"
            - "${mp2_effective} == ${rec_a2_id}"
            - "${mp2_swapped} == false"
            - "${a2_completeness} == 100.00 and ${a2_score} == 96.00"
            - "MasterRecord.${rec_b2_id}.curation_status == MERGED_AWAY and MasterRecord.${rec_b2_id}.superseded_by_master_record_id == ${rec_a2_id}"

  # =========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: scorecard_rounds_per_rule_before_summation
        grounds:
          - calculations.domain_quality_scorecard
          - entities.ScorecardRun.fields.weighted_score
          - entities.QualityRule.fields.weight_points
          - entities.QualityRule.fields.threshold_pct
        distinguishing_aspect: |
          Three failing rules (40@90.00 measured 10.00 -> 4.44, 30@80.00 measured 10.00 ->
          3.75, 10@99.00 measured 50.00 -> 5.05) over a denominator of 80 weight_points give
          16.55 only when each rule's earned points are rounded to 2dp BEFORE summation;
          summing the unrounded 13.24494949... and rounding once yields 16.56, so the pinned
          rounding order is the sole discriminator.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-05T00:00:00Z."
            - "Domain CUSTOMER, expected_attribute_count 5, ERP CERTIFIED and ACTIVE AUTHORITATIVE so governance_posture is OPEN and the pinned multiplier is 1.00."
            - "Olivia (PRINCIPAL) is DATA_OWNER, Sam (SENIOR) is DATA_STEWARD from 2026-08-01."
            - "Three ACTIVE rules: QR1 40 pts @ 90.00 CRITICAL, QR2 30 pts @ 80.00 HIGH, QR4 10 pts @ 99.00 LOW (budget 80 <= 100)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T00:00:00Z" }
              as: GovernanceAdmin
            - call: "POST /mdm/domains"
              payload: { code: "CUSTOMER", name: "Customer Master", classification_level: "INTERNAL", notification_lead_days_floor: 5, expected_attribute_count: 5 }
              as: GovernanceAdmin
              captures: { dom_id: $.data.id, dom_v1: $.data.version }
            - call: "POST /mdm/stewards"
              payload: { full_name: "Olivia Owner", email: "olivia@mdm.test", certification_level: "PRINCIPAL" }
              as: GovernanceAdmin
              captures: { own_id: $.data.id }
            - call: "POST /mdm/stewards"
              payload: { full_name: "Sam Steward", email: "sam@mdm.test", certification_level: "SENIOR" }
              as: GovernanceAdmin
              captures: { std_id: $.data.id }
            - call: "POST /mdm/steward-assignments"
              payload: { domain_id: "${dom_id}", steward_id: "${own_id}", steward_role: "DATA_OWNER", effective_from: "2026-08-01T00:00:00Z", expected_domain_version: "${dom_v1}" }
              as: GovernanceAdmin
            - call: "GET /mdm/domains/${dom_id}"
              as: GovernanceAdmin
              captures: { dom_v2: $.data.version }
            - call: "POST /mdm/steward-assignments"
              payload: { domain_id: "${dom_id}", steward_id: "${std_id}", steward_role: "DATA_STEWARD", effective_from: "2026-08-01T00:00:00Z", expected_domain_version: "${dom_v2}" }
              as: GovernanceAdmin
            - call: "POST /mdm/source-systems"
              payload: { code: "ERP", name: "ERP Core", trust_tier: 4 }
              as: GovernanceAdmin
              captures: { erp_id: $.data.id }
            - call: "POST /mdm/source-systems/${erp_id}/certify"
              payload: {}
              as: GovernanceAdmin
            - call: "GET /mdm/domains/${dom_id}"
              as: GovernanceAdmin
              captures: { dom_v3: $.data.version }
            - call: "POST /mdm/source-registrations"
              payload: { domain_id: "${dom_id}", source_system_id: "${erp_id}", role: "AUTHORITATIVE", trust_rank: 1, effective_from: "2026-08-01T00:00:00Z", expected_domain_version: "${dom_v3}" }
              as: GovernanceAdmin
            - call: "POST /mdm/quality-rules"
              payload: { domain_id: "${dom_id}", owner_steward_id: "${own_id}", rule_code: "QR1", dimension: "COMPLETENESS", weight_points: 40, threshold_pct: 90.00, severity: "CRITICAL" }
              as: DataSteward
              as_user_id: "${std_id}"
              captures: { qr1_id: $.data.id }
            - call: "POST /mdm/quality-rules"
              payload: { domain_id: "${dom_id}", owner_steward_id: "${std_id}", rule_code: "QR2", dimension: "VALIDITY", weight_points: 30, threshold_pct: 80.00, severity: "HIGH" }
              as: DataSteward
              as_user_id: "${std_id}"
              captures: { qr2_id: $.data.id }
            - call: "POST /mdm/quality-rules"
              payload: { domain_id: "${dom_id}", owner_steward_id: "${std_id}", rule_code: "QR4", dimension: "CONSISTENCY", weight_points: 10, threshold_pct: 99.00, severity: "LOW" }
              as: DataSteward
              as_user_id: "${std_id}"
              captures: { qr4_id: $.data.id }
          trigger:
            - call: "POST /mdm/domains/${dom_id}/scorecard-runs"
              payload: { basis: "PROVISIONAL", measurements: [ { rule_code: "QR1", measured_pct: 10.00 }, { rule_code: "QR2", measured_pct: 10.00 }, { rule_code: "QR4", measured_pct: 50.00 } ] }
              as: DataSteward
              as_user_id: "${std_id}"
