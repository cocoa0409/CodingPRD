      - name: loss_incident_without_segment_zeroes_transit_and_welfare_components
        claim_type: weighted_scoring
        grounds:
          - calculations.incident_severity_score
          - calculations.regulator_disclosure_deadline
          - entities.AnimalIncident.fields.preliminary_severity_score
        distinguishing_aspect: "With segment_assignment_id omitted, both segment-derived terms vanish: the PRELIMINARY score is the bare LOSS type weight 70 with no IN_TRANSIT_ADDER and no welfare component, and because the animal has no non-RELEASED segment the itinerary is not international, so the LOSS deadline stays at the full 48 hours rather than 24."
        test_recipe:
          setup:
            - "The logical clock is moved to 2026-08-02T00:00:00Z"
            - "A CHECKED reservation with one screened animal that holds NO segment assignment at all"
          setup_api_calls:
            - { call: "POST /species-profiles", payload: { species_code: "DOG", common_name: "Dog", acceptance_class: "ACCEPTED_ALL_ROUTINGS", max_cabin_weight_kg: 12, min_age_weeks: 16 }, as: ProgramAdmin, as_user_id: "admin-01", captures: { sp_dog: $.data.id } }
            - { call: "POST /container-models", payload: { model_code: "K9-L", interior_length_cm: 60, interior_width_cm: 40, interior_height_cm: 45, tare_weight_kg: 7, ventilation_area_pct: 15, ventilated_side_count: 3, wheels_removable: true, cabin_eligible: false }, as: ProgramAdmin, as_user_id: "admin-01", captures: { cm_k9l: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T00:00:00Z" }, as: ProgramAdmin, as_user_id: "admin-01" }
            - { call: "POST /reservations", payload: { passenger_name: "Wu", contact_email: "wu@example.com", routing_type: "CHECKED" }, as: ReservationsAgent, as_user_id: "agent-01", captures: { res1: $.data.id } }
            - { call: "POST /animal-records", payload: { reservation_id: "${res1}", species_profile_id: "${sp_dog}", container_model_id: "${cm_k9l}", animal_name: "Mochi", breed_name: "Labrador", declared_weight_kg: 20, height_at_shoulder_cm: 35, length_nose_to_tail_cm: 50, age_weeks: 52 }, as: ReservationsAgent, as_user_id: "agent-01", captures: { an1: $.data.id } }
            - { call: "POST /animal-records/${an1}/screen", payload: {}, as: AcceptanceAgent, as_user_id: "accept-01" }
          trigger:
            - { call: "POST /animal-incidents", payload: { animal_record_id: "${an1}", incident_type: "LOSS", discovered_at_utc: "2026-08-02T00:00:00Z" }, as: AcceptanceAgent, as_user_id: "accept-01", captures: { inc1: $.data.id } }
          assert:
            - "response status is 201"
            - "AnimalIncident.${inc1}.preliminary_severity_score == 70"
            - "AnimalIncident.${inc1}.disclosure_required == true"
            - "AnimalIncident.${inc1}.disclosure_deadline_utc == 2026-08-04T00:00:00Z"
            - "AnimalIncident.${inc1}.segment_assignment_id is null"
            - "AnimalIncident.${inc1}.adjudicated_severity_score is null and AnimalIncident.${inc1}.status == REPORTED"
            - "AnimalRecord.${an1}.status == DENIED"

      - name: tiered_pricing_tier_boundary_on_the_reservation_subtotal
        claim_type: tiered_pricing
        grounds:
          - calculations.reservation_charge_assembly
        excluded_because:
          difficulty_instance: combinatorial_formula / loyalty_tier_keyed_on_subtotal_including_irops_fees
          rationale: "The named §1.8 instance drives the subtotal across LOYALTY_TIER1_THRESHOLD with the irregular-operations fees included and pins the resulting tier, discount and net."

      - name: threshold_algorithm_boundary_on_the_forecast_limit
        claim_type: threshold
        grounds:
          - calculations.embargo_determination
        excluded_because:
          difficulty_instance: boundary_precision_check / embargo_fires_at_forecast_exactly_equal_to_high_limit
          rationale: "Threshold-minus-one-tenth and exactly-at-threshold are both asserted by the named §1.8 instance."

      - name: aggregation_running_total_of_reserved_bays
        claim_type: aggregation
        grounds:
          - calculations.kennel_bay_occupancy_projection
        excluded_because:
          difficulty_instance: resource_temporal_overlap / kennel_bays_aggregate_across_sanitation_buffer_window_rejected
          rationale: "The aggregate projection at, and one bay beyond, kennel_bay_count is asserted by the named §1.8 instance."

      - name: waterfall_allocation_of_refund_discount_and_net
        claim_type: waterfall_allocation
        grounds:
          - calculations.reservation_charge_assembly
        excluded_because:
          difficulty_instance: compensating_invariant / reservation_money_identity_survives_cancellation_refund
          rationale: "The pinned step order (subtotal, tier, discount on the post-refund base, net) and the closing identity are asserted by the named §1.8 instance."

      - name: variant_divergence_between_provisional_and_final_fee
        claim_type: variant_divergence
        grounds:
          - calculations.animal_travel_fee.variants
        excluded_because:
          difficulty_instance: dual_variant_calc / travel_fee_provisional_vs_final_diverges_on_same_segment
          rationale: "Same segment, both variants, with the delta pinned as a literal in the named §1.8 instance."

      - name: variant_selection_and_reconciliation_at_acceptance
        claim_type: reconciliation
        grounds:
          - calculations.animal_travel_fee.variants
          - calculations.reservation_charge_assembly
        excluded_because:
          difficulty_instance: dual_variant_calc / mixed_variant_subtotal_crosses_loyalty_tier_on_acceptance
          rationale: "The variant switch on one segment of a two-segment itinerary and its ledger consequence are asserted by the named §1.8 instance."

      - name: constraint_propagation_orders_the_deficiency_codes
        claim_type: constraint_propagation
        grounds:
          - calculations.container_compliance_evaluation
        excluded_because:
          difficulty_instance: combinatorial_formula / container_requirement_matrix_emits_ordered_deficiency_codes
          rationale: "The named §1.8 instance pins the full ordered deficiency_codes array from a multi-way container failure."

