              payload: { decision: "VERIFIED" }
              as: PrivacyReviewer
              as_user_id: "reviewer-alpha"
          trigger:
            - call: "POST /deletion-requests/${req_id}/execute"
              payload: {}
              as: PrivacyReviewer
              as_user_id: "reviewer-beta"
            - call: "GET /propagation-tasks"
              payload: { deletion_request_id: "${req_id}" }
              as: PrivacyReviewer
              as_user_id: "reviewer-beta"
