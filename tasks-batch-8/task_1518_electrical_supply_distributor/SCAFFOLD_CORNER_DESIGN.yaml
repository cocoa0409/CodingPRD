  - section: cross_cutting
    instances:
      - name: quote_revise_stale_version_rejected
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[quote-revise-stale-quote]", "errors[ERR_STALE_QUOTE_VERSION]"]
        distinguishing_aspect: "OCC on Quote.version: after a successful revise advanced the version, a second revise carrying the pre-revise version is rejected with 412."
        test_recipe:
          setup: ["quote created (v1), one line, submitted (v2), revised once (v3, DRAFT), re-submitted (v4)"]
          setup_api_calls:
            - call: "POST /distributor/contractors"
              payload: { name: "Whiskey Electric", credit_limit_cents: 100000 }
              as: CreditManager
              captures: { c_id: $.data.id }
            - call: "POST /distributor/catalog-items"
              payload: { sku: "BRK-20A", manufacturer_name: "SquareD", sell_uom: "EA", list_price_cents: 5000 }
              as: WarehouseManager
              captures: { item_id: $.data.id }
            - call: "POST /distributor/job-accounts"
              payload: { contractor_id: "${c_id}", job_name: "OCC Job", jobsite_address: "54 Site Rd", pricing_mode: "FIRM_PRICE" }
              as: SalesRep
              captures: { j_id: $.data.id }
            - call: "POST /distributor/quotes"
              payload: { job_account_id: "${j_id}", valid_until: "2027-01-01" }
              as: SalesRep
              captures: { q_id: $.data.id }
            - call: "POST /distributor/quote-lines"
              payload: { quote_id: "${q_id}", catalog_item_id: "${item_id}", qty: 1, unit_price_cents: 5000 }
              as: SalesRep
            - call: "POST /distributor/quotes/${q_id}/submit"
              payload: {}
              as: SalesRep
              captures: { q_v_sub: $.data.version }
            - call: "POST /distributor/quotes/${q_id}/revise"
              payload: { expected_quote_version: "${q_v_sub}" }
              as: SalesRep
            - call: "POST /distributor/quotes/${q_id}/submit"
              payload: {}
              as: SalesRep
          trigger:
            - call: "POST /distributor/quotes/${q_id}/revise"
              payload: { expected_quote_version: "${q_v_sub}" }
              as: SalesRep
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_STALE_QUOTE_VERSION and http status == 412"
            - "Quote.${q_id}.status remains SUBMITTED and revision_no == 2"

