              as: SchoolAdmin
              captures: { ia_id: $.data.id }
            - call: "POST /instructors"
              payload: { full_name: "Vic B", email: "vicb@x.com", certified_road: true, hourly_rate_cents: 5000, active: true }
              as: SchoolAdmin
              captures: { ib_id: $.data.id }
            - call: "POST /vehicles"
              payload: { plate: "VB-1", dual_control: true, prep_buffer_minutes: 15, out_of_service: false }
              as: SchoolAdmin
              captures: { veh_id: $.data.id }
            - call: "POST /students"
              payload: { full_name: "Van A", email: "vana@x.com", date_of_birth: "1990-01-01" }
              as: SchoolAdmin
              captures: { sa_id: $.data.id }
            - call: "POST /enrollments"
              payload: { student_id: "${sa_id}", package_id: "${pkg_id}" }
              as: SchoolAdmin
              captures: { ea_id: $.data.id }
            - call: "POST /enrollments/${ea_id}/activate"
              payload: {}
              as: SchoolAdmin
            - call: "POST /students/${sa_id}/record-permit"
              payload: { permit_number: "P-VA" }
              as: SchoolAdmin
              captures: { sav: $.data.version }
            - call: "POST /lessons"
              payload: { student_id: "${sa_id}", enrollment_id: "${ea_id}", lesson_type: "ROAD", start_at: "2026-06-10T09:00:00.000Z", end_at: "2026-06-10T10:00:00.000Z", instructor_id: "${ia_id}", vehicle_id: "${veh_id}", expected_student_version: "${sav}" }
              as: SchoolAdmin
            - call: "POST /students"
              payload: { full_name: "Van B", email: "vanb@x.com", date_of_birth: "1990-01-01" }
              as: SchoolAdmin
              captures: { sb_id: $.data.id }
            - call: "POST /enrollments"
              payload: { student_id: "${sb_id}", package_id: "${pkg_id}" }
              as: SchoolAdmin
              captures: { eb_id: $.data.id }
            - call: "POST /enrollments/${eb_id}/activate"
              payload: {}
              as: SchoolAdmin
            - call: "POST /students/${sb_id}/record-permit"
              payload: { permit_number: "P-VB" }
              as: SchoolAdmin
              captures: { sbv: $.data.version }
          trigger:
            - call: "POST /lessons"
              payload: { student_id: "${sb_id}", enrollment_id: "${eb_id}", lesson_type: "ROAD", start_at: "2026-06-10T10:00:00.000Z", end_at: "2026-06-10T11:00:00.000Z", instructor_id: "${ib_id}", vehicle_id: "${veh_id}", expected_student_version: "${sbv}" }
              as: SchoolAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_VEHICLE_DOUBLE_BOOKED (10:00 start falls inside the [09:00,10:15) buffer-padded vehicle occupancy)"
            - "A control booking at 10:15-11:15 on the same vehicle/instructor B is created successfully (201)"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: refund_to_wallet_conserves_money
        grounds:
          - state_machines.Enrollment.ACTIVE_to_REFUNDED
          - entities.WalletEntry.fields.amount_cents
          - entities.Enrollment.fields.refunded_cents
          - calculations.enrollment_refund_amount
        distinguishing_aspect: |
          Conserved quantity = money: school_recognized_revenue + student_wallet_balance ==
          amount_paid_cents must hold before and after refund. With amount_paid 85000,
          PRO_RATA refund 53333 -> revenue 31667 + wallet 53333 == 85000 (no drift).
        test_recipe:
          setup:
            - "ACTIVE enrollment amount_paid 85000, fee 5000, 2 COMPLETED of 6 road hours, clock arbitrary; refund PRO_RATA."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00.000Z" }
              as: SchoolAdmin
            - call: "POST /course-packages"
              payload: { code: "CI_PKG", name: "Ci Pkg", price_cents: 90000, enrollment_fee_cents: 5000, included_classroom_hours: 30, included_online_hours: 8, included_road_hours: 6, bundle_discount_cents: 5000, active: true }
              as: SchoolAdmin
              captures: { pkg_id: $.data.id }
            - call: "POST /instructors"
              payload: { full_name: "Ivo Inv", email: "ivo@x.com", certified_road: true, hourly_rate_cents: 5000, active: true }
              as: SchoolAdmin
              captures: { inst_id: $.data.id }
            - call: "POST /vehicles"
              payload: { plate: "CI-1", dual_control: true, prep_buffer_minutes: 0, out_of_service: false }
              as: SchoolAdmin
              captures: { veh_id: $.data.id }
            - call: "POST /students"
              payload: { full_name: "Ivy Inv", email: "ivyi@x.com", date_of_birth: "1990-01-01" }
              as: SchoolAdmin
              captures: { stu_id: $.data.id }
            - call: "POST /enrollments"
              payload: { student_id: "${stu_id}", package_id: "${pkg_id}" }
              as: SchoolAdmin
              captures: { enr_id: $.data.id }
            - call: "POST /enrollments/${enr_id}/activate"
              payload: {}
              as: SchoolAdmin
            - call: "POST /students/${stu_id}/record-permit"
              payload: { permit_number: "P-CI" }
              as: SchoolAdmin
              captures: { sv1: $.data.version }
            - call: "POST /lessons"
              payload: { student_id: "${stu_id}", enrollment_id: "${enr_id}", lesson_type: "ROAD", start_at: "2026-06-02T09:00:00.000Z", end_at: "2026-06-02T11:00:00.000Z", instructor_id: "${inst_id}", vehicle_id: "${veh_id}", expected_student_version: "${sv1}" }
              as: SchoolAdmin
              captures: { lr: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-02T11:00:00.000Z" }
              as: SchoolAdmin
            - call: "POST /lessons/${lr}/complete"
              payload: {}
              as: Instructor
              as_user_id: "${inst_id}"
          trigger:
            - call: "POST /enrollments/${enr_id}/refund"
              payload: { refund_method: "PRO_RATA", refund_destination: "WALLET" }
              as: SchoolAdmin
              captures: { refunded: $.data.refunded_cents }
          assert:
            - "Enrollment.${enr_id}.refunded_cents == 53333"
            - "Student.${stu_id}.wallet_balance_cents == 53333"
            - "Invariant: (amount_paid 85000 - refunded 53333) + wallet 53333 == 85000 (money conserved, zero drift)"

      - name: road_hour_ledger_conserved_on_lesson_cancel
        grounds:
          - state_machines.Lesson.SCHEDULED_to_CANCELLED
          - entities.Student.fields.scheduled_road_hours
          - entities.Student.fields.completed_road_hours
        distinguishing_aspect: |
          Different conserved quantity = road-hour ledger: completed_road_hours +
          scheduled_road_hours + available_road_hours == included_road_hours invariant
          must hold; cancelling a SCHEDULED 2h ROAD lesson moves 2h from scheduled back
          to available with completed unchanged (no hour drift). Distinct from money invariant.
        test_recipe:
          setup:
            - "PERMITTED student, included_road_hours 6, one SCHEDULED 2h road lesson (scheduled 2, completed 0, available 4); clock before cutoff."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00.000Z" }
              as: SchoolAdmin
            - call: "POST /course-packages"
              payload: { code: "HL_PKG", name: "Hl Pkg", price_cents: 60000, enrollment_fee_cents: 0, included_classroom_hours: 0, included_online_hours: 0, included_road_hours: 6, bundle_discount_cents: 0, active: true }
              as: SchoolAdmin
              captures: { pkg_id: $.data.id }
            - call: "POST /instructors"
              payload: { full_name: "Hal Hour", email: "hal@x.com", certified_road: true, hourly_rate_cents: 5000, active: true }
              as: SchoolAdmin
              captures: { inst_id: $.data.id }
            - call: "POST /vehicles"
              payload: { plate: "HL-1", dual_control: true, prep_buffer_minutes: 0, out_of_service: false }
              as: SchoolAdmin
              captures: { veh_id: $.data.id }
            - call: "POST /students"
              payload: { full_name: "Hank Hour", email: "hank@x.com", date_of_birth: "1990-01-01" }
              as: SchoolAdmin
              captures: { stu_id: $.data.id }
            - call: "POST /enrollments"
              payload: { student_id: "${stu_id}", package_id: "${pkg_id}" }
              as: SchoolAdmin
              captures: { enr_id: $.data.id }
            - call: "POST /enrollments/${enr_id}/activate"
              payload: {}
              as: SchoolAdmin
            - call: "POST /students/${stu_id}/record-permit"
              payload: { permit_number: "P-HL" }
              as: SchoolAdmin
              captures: { sv1: $.data.version }
            - call: "POST /lessons"
              payload: { student_id: "${stu_id}", enrollment_id: "${enr_id}", lesson_type: "ROAD", start_at: "2026-06-20T09:00:00.000Z", end_at: "2026-06-20T11:00:00.000Z", instructor_id: "${inst_id}", vehicle_id: "${veh_id}", expected_student_version: "${sv1}" }
              as: SchoolAdmin
              captures: { lr: $.data.id }
          trigger:
            - call: "POST /lessons/${lr}/cancel"
              payload: {}
              as: Student
              as_user_id: "${stu_id}"
          assert:
            - "Lesson.${lr}.status == CANCELLED"
            - "Student.${stu_id}.scheduled_road_hours == 0 (2h released)"
            - "Student.${stu_id}.completed_road_hours == 0 (unchanged)"
            - "Invariant: completed 0 + scheduled 0 + available 6 == included 6 (hour ledger conserved)"
