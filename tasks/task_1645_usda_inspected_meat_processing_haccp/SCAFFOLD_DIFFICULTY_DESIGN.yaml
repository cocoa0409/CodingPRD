            - { call: "POST /plants/${plant_id}/haccp-plans", payload: { process_type: "RAW_GROUND" }, as: QAManager, captures: { plan_id: $.data.id } }
            - { call: "POST /haccp-plans/${plan_id}/ccps", payload: { ccp_code: "CCP-1B", hazard_category: "BIOLOGICAL", description: "Chill cooler", critical_limit_max_f: 40.0, monitoring_frequency_minutes: 60 }, as: QAManager }
            - { call: "POST /haccp-plans/${plan_id}/submit", payload: {}, as: QAManager }
            - { call: "POST /haccp-plans/${plan_id}/approve", payload: {}, as: Inspector, as_user_id: "insp-01" }
            - { call: "POST /haccp-plans/${plan_id}/activate", payload: {}, as: QAManager }
            - { call: "POST /plants/${plant_id}/inspector-shifts", payload: { inspector_user_id: "insp-01", scheduled_start: "2026-08-01T06:00:00Z", scheduled_end: "2026-08-01T18:00:00Z" }, as: PlantAdmin, captures: { shift_id: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T07:00:00Z" }, as: PlantAdmin }
            - { call: "POST /inspector-shifts/${shift_id}/check-in", payload: {}, as: Inspector, as_user_id: "insp-01" }
            - { call: "POST /plants/${plant_id}/production-days", payload: { production_date: "2026-08-01", process_type: "RAW_GROUND" }, as: ProductionManager, captures: { day_id: $.data.id } }
            - { call: "POST /production-days/${day_id}/open", payload: {}, as: ProductionManager }
            - { call: "POST /production-days/${day_id}/lots", payload: { species: "BOVINE", supplier_name: "Verde Farms", head_count: 10, live_weight_lbs: 12500 }, as: ProductionManager, captures: { lot_id: $.data.id } }
            - { call: "POST /lots/${lot_id}/pass-ante-mortem", payload: {}, as: Inspector, as_user_id: "insp-01" }
            - { call: "POST /lots/${lot_id}/harvest", payload: { hot_carcass_weight_lbs: 1030.0 }, as: ProductionManager }
            - { call: "POST /lots/${lot_id}/chill-complete", payload: { cold_carcass_weight_lbs: 1000.0 }, as: ProductionManager }
            - { call: "POST /production-days/${day_id}/suspend", payload: {}, as: ProductionManager }
          trigger:
            - { call: "POST /lots/${lot_id}/fabricate", payload: {}, as: ProductionManager, captures: { err: $.data.error_id } }
            - { call: "POST /production-days/${day_id}/open", payload: {}, as: ProductionManager }
            - { call: "POST /lots/${lot_id}/fabricate", payload: {}, as: ProductionManager, captures: { lot_status: $.data.status } }
          assert:
            - "fabricate while day SUSPENDED rejected with error_id == ERR_DAY_NOT_OPEN; lot stays CHILLED"
            - "after resume, fabricate succeeds and CarcassLot.${lot_id}.status == FABRICATING"

  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: inspector_shift_half_open_overlap_adjacency
        grounds:
          - validations[priority=20]
          - errors[ERR_SHIFT_WINDOW_CONFLICT]
          - entities.InspectorShift.fields.scheduled_start
        distinguishing_aspect: |
          Resource InspectorShift with half-open interval semantics
          [scheduled_start, scheduled_end): a shift starting exactly at another's end
          is allowed, while a 1-minute-early overlap is rejected, and the check is
          scoped per inspector_user_id. The second rule-8 instance uses aggregate
          capacity semantics on a different resource (cooler via FinishedLot).
        test_recipe:
          setup:
            - "Plant registered; shift A for insp-01 occupies [2026-08-01T06:00:00Z, 2026-08-01T14:00:00Z)"
          setup_api_calls:
            - { call: "POST /plants", payload: { establishment_number: "EST-1645-O", name: "Prairie Packing", district_code: "D25", cooler_capacity_lbs: 10000 }, as: PlantAdmin, captures: { plant_id: $.data.id } }
            - { call: "POST /plants/${plant_id}/inspector-shifts", payload: { inspector_user_id: "insp-01", scheduled_start: "2026-08-01T06:00:00Z", scheduled_end: "2026-08-01T14:00:00Z" }, as: PlantAdmin, captures: { shift_a: $.data.id } }
          trigger:
            - { call: "POST /plants/${plant_id}/inspector-shifts", payload: { inspector_user_id: "insp-01", scheduled_start: "2026-08-01T14:00:00Z", scheduled_end: "2026-08-01T20:00:00Z" }, as: PlantAdmin, captures: { shift_b: $.data.id } }
            - { call: "POST /plants/${plant_id}/inspector-shifts", payload: { inspector_user_id: "insp-01", scheduled_start: "2026-08-01T13:00:00Z", scheduled_end: "2026-08-01T15:00:00Z" }, as: PlantAdmin, captures: { err: $.data.error_id } }
            - { call: "POST /plants/${plant_id}/inspector-shifts", payload: { inspector_user_id: "insp-02", scheduled_start: "2026-08-01T13:00:00Z", scheduled_end: "2026-08-01T15:00:00Z" }, as: PlantAdmin, captures: { shift_d: $.data.id } }
          assert:
            - "shift B (starts exactly at A's scheduled_end) is created — half-open adjacency allowed"
            - "shift C (13:00-15:00 for insp-01) rejected with error_id == ERR_SHIFT_WINDOW_CONFLICT"
            - "shift D (same window as C but insp-02) is created — overlap is scoped per inspector"

      - name: cooler_aggregate_capacity_boundary
        grounds:
          - calculations.cooler_occupancy
          - validations[priority=33]
          - errors[ERR_COOLER_CAPACITY_EXCEEDED]
          - entities.Plant.fields.cooler_occupied_lbs
        distinguishing_aspect: |
          Aggregate-capacity interval semantics (sum of concurrent occupants vs a fixed
          ceiling), not pairwise half-open intervals: occupancy exactly equal to
          capacity (1000.0 == 1000.0) is allowed while 0.5 lbs over is rejected. Sits on
          a different resource (Plant cooler via FinishedLot) than the shift instance.
        test_recipe:
          setup:
            - "Plant with cooler_capacity_lbs 1000.0, EFFECTIVE plan, inspector ON_PREMISE, OPEN day, FABRICATED lot, APPROVED label; finished lot F1 of 600.0 lbs already stored (occupied 600.0)"
          setup_api_calls:
            - { call: "POST /plants", payload: { establishment_number: "EST-1645-P", name: "Prairie Packing", district_code: "D25", cooler_capacity_lbs: 1000.0 }, as: PlantAdmin, captures: { plant_id: $.data.id } }
            - { call: "POST /plants/${plant_id}/haccp-plans", payload: { process_type: "RAW_GROUND" }, as: QAManager, captures: { plan_id: $.data.id } }
            - { call: "POST /haccp-plans/${plan_id}/ccps", payload: { ccp_code: "CCP-1B", hazard_category: "BIOLOGICAL", description: "Chill cooler", critical_limit_max_f: 40.0, monitoring_frequency_minutes: 60 }, as: QAManager }
            - { call: "POST /haccp-plans/${plan_id}/submit", payload: {}, as: QAManager }
            - { call: "POST /haccp-plans/${plan_id}/approve", payload: {}, as: Inspector, as_user_id: "insp-01" }
            - { call: "POST /haccp-plans/${plan_id}/activate", payload: {}, as: QAManager }
            - { call: "POST /plants/${plant_id}/inspector-shifts", payload: { inspector_user_id: "insp-01", scheduled_start: "2026-08-01T06:00:00Z", scheduled_end: "2026-08-01T18:00:00Z" }, as: PlantAdmin, captures: { shift_id: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T07:00:00Z" }, as: PlantAdmin }
            - { call: "POST /inspector-shifts/${shift_id}/check-in", payload: {}, as: Inspector, as_user_id: "insp-01" }
            - { call: "POST /plants/${plant_id}/production-days", payload: { production_date: "2026-08-01", process_type: "RAW_GROUND" }, as: ProductionManager, captures: { day_id: $.data.id } }
            - { call: "POST /production-days/${day_id}/open", payload: {}, as: ProductionManager }
            - { call: "POST /production-days/${day_id}/lots", payload: { species: "BOVINE", supplier_name: "Verde Farms", head_count: 10, live_weight_lbs: 12500 }, as: ProductionManager, captures: { lot_id: $.data.id } }
            - { call: "POST /lots/${lot_id}/pass-ante-mortem", payload: {}, as: Inspector, as_user_id: "insp-01" }
            - { call: "POST /lots/${lot_id}/harvest", payload: { hot_carcass_weight_lbs: 1030.0 }, as: ProductionManager }
            - { call: "POST /lots/${lot_id}/chill-complete", payload: { cold_carcass_weight_lbs: 1000.0 }, as: ProductionManager }
