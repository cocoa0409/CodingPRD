# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Breadth probe across the claim-extraction guide's nine sections.
# Every active instance has an executable setup_api_calls/trigger chain;
# corners already covered by a §1.8 instance are emitted as excluded_because stubs.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: create_test_center_returns_201_with_fields
        claim_type: Creation
        grounds: [entities.TestCenter, "endpoints[POST /test-centers]"]
        distinguishing_aspect: "POST /test-centers with all required fields -> 201; response carries name, state_code, capacities, net_revenue_cents == 0."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /test-centers"
              payload: { name: "Bay Center", state_code: "CA", room_capacity_standard: 50, room_capacity_accommodated: 5 }
              as: TestCenterAdmin
              captures: { center_id: $.data.id }
          assert:
            - "HTTP status == 201"
            - "TestCenter.${center_id}.net_revenue_cents == 0"
            - "TestCenter.${center_id}.state_code == CA"

      - name: create_registration_missing_required_field_invalid_request
        claim_type: Required Fields
        grounds: [entities.Registration, "validations[priority=4]", "endpoints[POST /registrations]"]
        distinguishing_aspect: "POST /registrations omitting candidate_id -> ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["A session exists at version 1."]
          setup_api_calls:
            - call: "POST /test-centers"
              payload: { name: "Bay Center", state_code: "CA", room_capacity_standard: 50, room_capacity_accommodated: 5 }
              as: TestCenterAdmin
              captures: { center_id: $.data.id }
            - call: "POST /test-sessions"
              payload: { test_center_id: "${center_id}", exam_type: "SAT", exam_subject: "GENERAL", test_date: "2026-09-01", window_start_utc: "2026-09-01T13:00:00.000Z", window_end_utc: "2026-09-01T17:00:00.000Z", base_fee_cents: 6000 }
              as: TestCenterAdmin
              captures: { sess_id: $.data.id, sess_v: $.data.version }
          trigger:
            - call: "POST /registrations"
              payload: { test_session_id: "${sess_id}", expected_test_session_version: "${sess_v}" }
              as: Candidate
              as_user_id: "missing-candidate-id"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 400"
            - "error_id == ERR_INVALID_REQUEST"

      - name: get_registration_nonexistent_id_not_found
        claim_type: Not Found
        grounds: [entities.Registration, "validations[priority=3]", "endpoints[GET /registrations/{id}]"]
        distinguishing_aspect: "GET /registrations/{random uuid} -> ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /registrations/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: Candidate
              as_user_id: "any"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 404"
            - "error_id == ERR_NOT_FOUND"

      - name: candidate_default_504_flag_false_when_omitted
        claim_type: Defaults
        grounds: [entities.Candidate.fields.has_active_504_iep, "endpoints[POST /candidates]"]
        distinguishing_aspect: "Omitting has_active_504_iep on candidate create -> stored false; begin-review later rejected ERR_NOT_504_IEP_ELIGIBLE."
        test_recipe:
          setup: ["A candidate created without has_active_504_iep, a RESERVED registration, and a SUBMITTED accommodation request."]
          setup_api_calls:
            - call: "POST /test-centers"
              payload: { name: "Bay Center", state_code: "CA", room_capacity_standard: 50, room_capacity_accommodated: 5 }
              as: TestCenterAdmin
              captures: { center_id: $.data.id }
            - call: "POST /candidates"
              payload: { legal_first_name: "Noa", legal_last_name: "Plan", date_of_birth: "2008-06-06", home_state_code: "CA", id_document_state_code: "CA" }
              as: Candidate
              captures: { cand_id: $.data.id }
            - call: "POST /test-sessions"
              payload: { test_center_id: "${center_id}", exam_type: "SAT", exam_subject: "GENERAL", test_date: "2026-09-01", window_start_utc: "2026-09-01T13:00:00.000Z", window_end_utc: "2026-09-01T17:00:00.000Z", base_fee_cents: 6000 }
              as: TestCenterAdmin
              captures: { sess_id: $.data.id, sess_v: $.data.version }
            - call: "POST /registrations"
              payload: { test_session_id: "${sess_id}", candidate_id: "${cand_id}", expected_test_session_version: "${sess_v}" }
              as: Candidate
              as_user_id: "${cand_id}"
              captures: { reg_id: $.data.id }
            - call: "POST /accommodation-requests"
              payload: { candidate_id: "${cand_id}", target_registration_id: "${reg_id}", accommodation_type: "EXTENDED_TIME_50", basis: "PLAN_504" }
              as: Candidate
              as_user_id: "${cand_id}"
              captures: { acc_id: $.data.id }
          trigger:
            - call: "POST /accommodation-requests/${acc_id}/begin-review"
              payload: {}
              as: AccommodationReviewer
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 422"
            - "error_id == ERR_NOT_504_IEP_ELIGIBLE  (has_active_504_iep defaulted false)"

      - name: id_verification_outcome_is_computed_not_input
        claim_type: Computed Fields
        grounds: [entities.IDVerification.fields.outcome, calculations.id_verification, "endpoints[POST /registrations/{id}/id-verifications]"]
        distinguishing_aspect: "outcome and cross_state are server-computed; same-state exact name -> MATCH, cross_state false."
        test_recipe:
          setup: ["A CONFIRMED registration for a CA candidate at a CA center."]
          setup_api_calls:
            - call: "POST /test-centers"
              payload: { name: "Bay Center", state_code: "CA", room_capacity_standard: 50, room_capacity_accommodated: 5 }
              as: TestCenterAdmin
              captures: { center_id: $.data.id }
            - call: "POST /candidates"
              payload: { legal_first_name: "Ada", legal_last_name: "Lovelace", date_of_birth: "2008-12-10", home_state_code: "CA", id_document_state_code: "CA" }
              as: Candidate
              captures: { cand_id: $.data.id }
            - call: "POST /test-sessions"
              payload: { test_center_id: "${center_id}", exam_type: "SAT", exam_subject: "GENERAL", test_date: "2026-09-01", window_start_utc: "2026-09-01T13:00:00.000Z", window_end_utc: "2026-09-01T17:00:00.000Z", base_fee_cents: 6000 }
              as: TestCenterAdmin
              captures: { sess_id: $.data.id, sess_v: $.data.version }
            - call: "POST /registrations"
              payload: { test_session_id: "${sess_id}", candidate_id: "${cand_id}", expected_test_session_version: "${sess_v}" }
              as: Candidate
              as_user_id: "${cand_id}"
              captures: { reg_id: $.data.id }
          trigger:
            - call: "POST /registrations/${reg_id}/id-verifications"
              payload: { presented_first_name: "ada", presented_last_name: "lovelace", presented_id_state_code: "CA" }
              as: TestCenterAdmin
              captures: { idv_id: $.data.id }
          assert:
            - "IDVerification.${idv_id}.cross_state == false"
            - "IDVerification.${idv_id}.outcome == MATCH  (same-state case-insensitive match)"

      - name: registration_system_fields_generated
        claim_type: System Fields
        grounds: [entities.Registration.fields.lifecycle_status, entities.Registration.fields.score_status, "endpoints[POST /registrations]"]
        distinguishing_aspect: "On create, lifecycle_status=RESERVED, score_status=PENDING, version=1, seat_kind=STANDARD are system-set regardless of body."
        test_recipe:
          setup: ["A session at version 1."]
          setup_api_calls:
            - call: "POST /test-centers"
              payload: { name: "Bay Center", state_code: "CA", room_capacity_standard: 50, room_capacity_accommodated: 5 }
              as: TestCenterAdmin
              captures: { center_id: $.data.id }
            - call: "POST /candidates"
              payload: { legal_first_name: "Ada", legal_last_name: "Lovelace", date_of_birth: "2008-12-10", home_state_code: "CA", id_document_state_code: "CA" }
              as: Candidate
              captures: { cand_id: $.data.id }
            - call: "POST /test-sessions"
              payload: { test_center_id: "${center_id}", exam_type: "SAT", exam_subject: "GENERAL", test_date: "2026-09-01", window_start_utc: "2026-09-01T13:00:00.000Z", window_end_utc: "2026-09-01T17:00:00.000Z", base_fee_cents: 6000 }
              as: TestCenterAdmin
              captures: { sess_id: $.data.id, sess_v: $.data.version }
          trigger:
            - call: "POST /registrations"
              payload: { test_session_id: "${sess_id}", candidate_id: "${cand_id}", expected_test_session_version: "${sess_v}" }
              as: Candidate
              as_user_id: "${cand_id}"
              captures: { reg_id: $.data.id }
          assert:
            - "Registration.${reg_id}.lifecycle_status == RESERVED"
            - "Registration.${reg_id}.score_status == PENDING"
            - "Registration.${reg_id}.seat_kind == STANDARD"
            - "Registration.${reg_id}.version == 1"

      - name: invalid_enum_exam_type_rejected
        claim_type: Type Constraints
        grounds: [entities.TestSession.fields.exam_type, "validations[priority=4]", "endpoints[POST /test-sessions]"]
        distinguishing_aspect: "exam_type='GRE' (not SAT|ACT|AP) -> ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["A center exists."]
          setup_api_calls:
            - call: "POST /test-centers"
              payload: { name: "Bay Center", state_code: "CA", room_capacity_standard: 50, room_capacity_accommodated: 5 }
              as: TestCenterAdmin
              captures: { center_id: $.data.id }
          trigger:
            - call: "POST /test-sessions"
              payload: { test_center_id: "${center_id}", exam_type: "GRE", exam_subject: "GENERAL", test_date: "2026-09-01", window_start_utc: "2026-09-01T13:00:00.000Z", window_end_utc: "2026-09-01T17:00:00.000Z", base_fee_cents: 6000 }
              as: TestCenterAdmin
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 400"
            - "error_id == ERR_INVALID_REQUEST"

      - name: registration_wrong_parent_session_not_found
        claim_type: Parent Relationships
        grounds: [entities.Registration.fields.test_session_id, "validations[priority=3]", "endpoints[POST /registrations]"]
        distinguishing_aspect: "POST /registrations with a non-existent test_session_id -> ERR_NOT_FOUND (404); existence (priority 3) fires before OCC (priority 5)."
        test_recipe:
          setup: ["A candidate and a real session exist; the trigger points test_session_id at a non-existent id while carrying the real session's version (existence is checked first)."]
          setup_api_calls:
            - call: "POST /test-centers"
              payload: { name: "Bay Center", state_code: "CA", room_capacity_standard: 5, room_capacity_accommodated: 5 }
              as: TestCenterAdmin
              captures: { center_id: $.data.id }
            - call: "POST /candidates"
              payload: { legal_first_name: "Ada", legal_last_name: "Lovelace", date_of_birth: "2008-12-10", home_state_code: "CA", id_document_state_code: "CA" }
              as: Candidate
              captures: { cand_id: $.data.id }
            - call: "POST /test-sessions"
              payload: { test_center_id: "${center_id}", exam_type: "SAT", exam_subject: "GENERAL", test_date: "2026-09-01", window_start_utc: "2026-09-01T13:00:00.000Z", window_end_utc: "2026-09-01T17:00:00.000Z", base_fee_cents: 6000 }
              as: TestCenterAdmin
              captures: { real_sess_id: $.data.id, real_sess_v: $.data.version }
          trigger:
            - call: "POST /registrations"
              payload: { test_session_id: "00000000-0000-4000-8000-000000000001", candidate_id: "${cand_id}", expected_test_session_version: "${real_sess_v}" }
              as: Candidate
              as_user_id: "${cand_id}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 404"
            - "error_id == ERR_NOT_FOUND"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: confirm_from_already_cancelled_invalid_state
        claim_type: Invalid Transitions
        grounds: [state_machines.Registration.RESERVED_to_CONFIRMED, "validations[priority=6]"]
        distinguishing_aspect: "Confirm on a CANCELLED registration -> ERR_INVALID_STATE (409); no side effects."
        test_recipe:
          setup: ["A registration that has been CANCELLED."]
          setup_api_calls:
            - call: "POST /test-centers"
              payload: { name: "Bay Center", state_code: "CA", room_capacity_standard: 50, room_capacity_accommodated: 5 }
              as: TestCenterAdmin
              captures: { center_id: $.data.id }
            - call: "POST /candidates"
              payload: { legal_first_name: "Ada", legal_last_name: "Lovelace", date_of_birth: "2008-12-10", home_state_code: "CA", id_document_state_code: "CA" }
              as: Candidate
              captures: { cand_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00.000Z" }
              as: TestCenterAdmin
            - call: "POST /test-sessions"
              payload: { test_center_id: "${center_id}", exam_type: "SAT", exam_subject: "GENERAL", test_date: "2026-09-01", window_start_utc: "2026-09-01T13:00:00.000Z", window_end_utc: "2026-09-01T17:00:00.000Z", base_fee_cents: 6000 }
              as: TestCenterAdmin
              captures: { sess_id: $.data.id, sess_v: $.data.version }
            - call: "POST /registrations"
              payload: { test_session_id: "${sess_id}", candidate_id: "${cand_id}", expected_test_session_version: "${sess_v}" }
              as: Candidate
              as_user_id: "${cand_id}"
              captures: { reg_id: $.data.id }
            - call: "POST /registrations/${reg_id}/cancel"
              payload: {}
              as: Candidate
              as_user_id: "${cand_id}"
          trigger:
            - call: "POST /registrations/${reg_id}/confirm"
              payload: {}
              as: Candidate
              as_user_id: "${cand_id}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "error_id == ERR_INVALID_STATE"

      - name: clep_adjudicate_twice_idempotency_invalid_state
        claim_type: Idempotency
        grounds: [state_machines.CLEPClaim.PENDING_to_RECOGNIZED, "validations[priority=6]"]
        distinguishing_aspect: "Re-adjudicating an already-RECOGNIZED CLEP claim -> ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["A RECOGNIZED CLEP claim (score 70)."]
          setup_api_calls:
            - call: "POST /candidates"
              payload: { legal_first_name: "Cle", legal_last_name: "Pper", date_of_birth: "2007-07-07", home_state_code: "CA", id_document_state_code: "CA" }
              as: Candidate
              captures: { cand_id: $.data.id }
            - call: "POST /clep-claims"
              payload: { candidate_id: "${cand_id}", clep_subject: "COLLEGE_ALGEBRA", clep_scaled_score: 70 }
              as: Candidate
              as_user_id: "${cand_id}"
              captures: { clep_id: $.data.id }
            - call: "POST /clep-claims/${clep_id}/adjudicate"
              payload: {}
              as: ScoreOps
          trigger:
            - call: "POST /clep-claims/${clep_id}/adjudicate"
              payload: {}
              as: ScoreOps
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "error_id == ERR_INVALID_STATE"

      - name: deny_from_terminal_approved_locked
        claim_type: Terminal State Lockdown
        grounds: [state_machines.AccommodationRequest.UNDER_REVIEW_to_DENIED, "validations[priority=6]"]
        distinguishing_aspect: "Deny on an APPROVED (terminal) accommodation request -> ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["An APPROVED accommodation request bound to a RESERVED registration."]
          setup_api_calls:
            - call: "POST /test-centers"
              payload: { name: "Bay Center", state_code: "CA", room_capacity_standard: 50, room_capacity_accommodated: 5 }
              as: TestCenterAdmin
              captures: { center_id: $.data.id }
            - call: "POST /candidates"
              payload: { legal_first_name: "Ivy", legal_last_name: "Stone", date_of_birth: "2008-04-04", home_state_code: "CA", id_document_state_code: "CA", has_active_504_iep: true }
              as: Candidate
              captures: { cand_id: $.data.id }
            - call: "POST /test-sessions"
              payload: { test_center_id: "${center_id}", exam_type: "SAT", exam_subject: "GENERAL", test_date: "2026-09-01", window_start_utc: "2026-09-01T13:00:00.000Z", window_end_utc: "2026-09-01T17:00:00.000Z", base_fee_cents: 6000 }
              as: TestCenterAdmin
              captures: { sess_id: $.data.id, sess_v: $.data.version }
            - call: "POST /registrations"
              payload: { test_session_id: "${sess_id}", candidate_id: "${cand_id}", expected_test_session_version: "${sess_v}" }
              as: Candidate
              as_user_id: "${cand_id}"
              captures: { reg_id: $.data.id }
            - call: "POST /accommodation-requests"
              payload: { candidate_id: "${cand_id}", target_registration_id: "${reg_id}", accommodation_type: "EXTENDED_TIME_50", basis: "PLAN_504" }
              as: Candidate
              as_user_id: "${cand_id}"
              captures: { acc_id: $.data.id }
            - call: "POST /accommodation-requests/${acc_id}/begin-review"
              payload: {}
              as: AccommodationReviewer
            - call: "POST /accommodation-requests/${acc_id}/approve"
              payload: {}
              as: AccommodationReviewer
          trigger:
            - call: "POST /accommodation-requests/${acc_id}/deny"
              payload: { reviewer_note: "too late" }
              as: AccommodationReviewer
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "error_id == ERR_INVALID_STATE"

      - name: score_report_requires_checked_in_invalid_state
        claim_type: Precondition Enforcement
        grounds: [state_machines.Registration.PENDING_to_SCORED, "validations[priority=6]"]
        distinguishing_aspect: "Recording a score on a CONFIRMED-but-not-CHECKED_IN registration -> ERR_INVALID_STATE (409) (axis-2 cross-axis precondition)."
        test_recipe:
          setup: ["A CONFIRMED (never checked in) registration."]
          setup_api_calls:
            - call: "POST /test-centers"
              payload: { name: "Bay Center", state_code: "CA", room_capacity_standard: 50, room_capacity_accommodated: 5 }
              as: TestCenterAdmin
              captures: { center_id: $.data.id }
            - call: "POST /candidates"
              payload: { legal_first_name: "Ada", legal_last_name: "Lovelace", date_of_birth: "2008-12-10", home_state_code: "CA", id_document_state_code: "CA" }
              as: Candidate
              captures: { cand_id: $.data.id }
            - call: "POST /test-sessions"
              payload: { test_center_id: "${center_id}", exam_type: "SAT", exam_subject: "GENERAL", test_date: "2026-09-01", window_start_utc: "2026-09-01T13:00:00.000Z", window_end_utc: "2026-09-01T17:00:00.000Z", base_fee_cents: 6000 }
              as: TestCenterAdmin
              captures: { sess_id: $.data.id, sess_v: $.data.version }
            - call: "POST /registrations"
              payload: { test_session_id: "${sess_id}", candidate_id: "${cand_id}", expected_test_session_version: "${sess_v}" }
              as: Candidate
              as_user_id: "${cand_id}"
              captures: { reg_id: $.data.id }
            - call: "POST /registrations/${reg_id}/confirm"
              payload: {}
              as: Candidate
              as_user_id: "${cand_id}"
          trigger:
            - call: "POST /registrations/${reg_id}/score-reports"
              payload: { exam_type: "SAT", section_scores: { READING_WRITING: 600, MATH: 600 } }
              as: ScoreOps
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "error_id == ERR_INVALID_STATE"

      - name: standby_decline_then_promote_next_alternate_cascade
        claim_type: Compensation
        grounds: [state_machines.StandbyEntry.OFFERED_to_DECLINED, entities.StandbyEntry.fields.promoted_from_entry_id]
        distinguishing_aspect: "Declining an OFFERED standby cancels its hold and promotes the next WAITING entry, setting the new entry's promoted_from_entry_id to the decliner; seat conserved."
        test_recipe:
          setup: ["Capacity-1 session full; two WAITING standby entries (both GENERAL, first joined earlier). Cancel offers the first; decline must promote the second."]
          setup_api_calls:
            - call: "POST /test-centers"
              payload: { name: "Tiny Center", state_code: "NY", room_capacity_standard: 1, room_capacity_accommodated: 1 }
              as: TestCenterAdmin
              captures: { center_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00.000Z" }
              as: TestCenterAdmin
            - call: "POST /candidates"
              payload: { legal_first_name: "Holder", legal_last_name: "One", date_of_birth: "2008-01-01", home_state_code: "NY", id_document_state_code: "NY" }
              as: Candidate
              captures: { cand_hold: $.data.id }
            - call: "POST /candidates"
              payload: { legal_first_name: "Alt", legal_last_name: "First", date_of_birth: "2008-02-02", home_state_code: "NY", id_document_state_code: "NY" }
              as: Candidate
              captures: { cand_a1: $.data.id }
            - call: "POST /candidates"
              payload: { legal_first_name: "Alt", legal_last_name: "Second", date_of_birth: "2008-03-03", home_state_code: "NY", id_document_state_code: "NY" }
              as: Candidate
              captures: { cand_a2: $.data.id }
            - call: "POST /test-sessions"
              payload: { test_center_id: "${center_id}", exam_type: "SAT", exam_subject: "GENERAL", test_date: "2026-09-01", window_start_utc: "2026-09-01T13:00:00.000Z", window_end_utc: "2026-09-01T17:00:00.000Z", base_fee_cents: 6000 }
              as: TestCenterAdmin
              captures: { sess_id: $.data.id, sess_v0: $.data.version }
            - call: "POST /registrations"
              payload: { test_session_id: "${sess_id}", candidate_id: "${cand_hold}", expected_test_session_version: "${sess_v0}" }
              as: Candidate
              as_user_id: "${cand_hold}"
              captures: { reg_hold: $.data.id }
            - call: "POST /registrations/${reg_hold}/confirm"
              payload: {}
              as: Candidate
              as_user_id: "${cand_hold}"
            - call: "POST /standby-entries"
              payload: { test_session_id: "${sess_id}", candidate_id: "${cand_a1}", priority_tier: "GENERAL" }
              as: Candidate
              as_user_id: "${cand_a1}"
              captures: { sb1: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T01:00:00.000Z" }
              as: TestCenterAdmin
            - call: "POST /standby-entries"
              payload: { test_session_id: "${sess_id}", candidate_id: "${cand_a2}", priority_tier: "GENERAL" }
              as: Candidate
              as_user_id: "${cand_a2}"
              captures: { sb2: $.data.id }
            - call: "POST /registrations/${reg_hold}/cancel"
              payload: {}
              as: Candidate
