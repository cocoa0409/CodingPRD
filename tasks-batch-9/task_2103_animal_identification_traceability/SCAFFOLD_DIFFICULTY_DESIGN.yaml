            - "Six defect reports leave the score at 82.00, so issuance_cap is 2000."
            - "The new lot asks for 100000003000-100000006000: quantity 3001 and an intersection with lot 1."
          setup_api_calls:
            - call: "POST /producers"
              payload: { legal_name: "Palouse Cattle", contact_email: "ops@palouse.example", state_code: "ID" }
              as: ProgramAdmin
              as_user_id: "admin-reg"
              captures: { prod_s: $.data.id }
            - call: "POST /premises"
              payload: { producer_id: "${prod_s}", pin: "IDS0001", operation_type: "FEEDLOT", state_code: "ID", capacity: 500 }
              as: Producer
              as_user_id: "${prod_s}"
              captures: { ps: $.data.id }
            - call: "POST /premises/${ps}/approve"
              payload: {}
