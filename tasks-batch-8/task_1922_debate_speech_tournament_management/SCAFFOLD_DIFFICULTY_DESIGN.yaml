            - { call: "POST /tournaments", payload: { name: "Districts BK", registration_opens_at: "2026-08-01T00:00:00Z", registration_locks_at: "2026-08-10T00:00:00Z", prelim_round_count: 2, entry_fee_cents: 2500 }, as: TournamentDirector, captures: { t: $.data.id } }
