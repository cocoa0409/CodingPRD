scenario: "Cap Table & Equity Management: shareholder/security class, option grant/vesting (cliff/graded), 409A valuation, exercise/early-exercise (83b), pool/refresh, SAFE/note conversion, liquidation-preference waterfall, Form 3921"
domain_name: "cap-table-equity"
api_prefix: ""

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: waterfall_allocation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers

  entity_topology: flat
  # Peer entities (Shareholder, SecurityClass, OptionGrant, SafeNote, Valuation,
  # OptionPool, ...) all hang off a single CapTable by foreign key — no nested
  # URL ownership chain beyond the CapTable container; cross-references resolve
  # through FK fields in request bodies, not nested paths.

  state_machine_shape: branching
  # OptionGrant has a fork-join lifecycle (DRAFT -> ACTIVE -> {EXERCISED,
  # CANCELLED, EXPIRED}) with divergent side-effect sets; SafeNote has a
  # revision cycle (DRAFT <-> NEGOTIATING) before CONVERTED. Not a linear
  # pipeline.

  relationship_patterns:
    - one_to_many        # CapTable -> Shareholders, SecurityClasses, OptionGrants
    - cross_aggregate    # OptionGrant references SecurityClass + OptionPool + Shareholder
    - self_referential   # SecurityClass.seniority_below_class_id references another SecurityClass (preference stack)

  role_model: segregation_of_duties
  # Administrator drafts & cancels; BoardApprover approves grants/valuations &
  # triggers conversions; the same user id may not both draft a grant and
  # approve it. Stakeholder (entity_backed:Shareholder) sees and exercises only
  # its own grants. Auditor is read-only.

  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =====================================================================
# §1.1 Entity-Relationship Table
# =====================================================================
entities:
  - name: CapTable
    parent: null
    common_fields: true
    fields:
      - name: company_name
        type: string
        source: input
        description: legal company name
        constraints: non-empty, max 200 chars
      - name: authorized_shares
        type: integer
        source: input
        description: total shares the charter authorizes to be issued
        constraints: "> 0"
      - name: status
        type: enum
        source: system
        description: lifecycle state; see §1.2
        default: OPEN
        constraints: "one of {OPEN, LOCKED, DISSOLVED}"
      - name: issued_shares
        type: integer
        source: computed
        description: |
          sum of SecurityClass.shares_outstanding across all classes on this
          cap table plus all VESTED-and-EXERCISED option shares; recomputed on
          every issuance, exercise, conversion. See §1.3 issued_share_count.
      - name: fully_diluted_shares
        type: integer
        source: computed
        description: |
          issued_shares + all granted-but-unexercised option shares (ACTIVE
          grants) + unallocated OptionPool shares + as-converted SAFE/note
          shares at the latest Valuation price. See §1.3 fully_diluted_count.
      - name: locked_at
        type: datetime
        source: system
        description: timestamp the table moved to LOCKED; null while OPEN
        default: null

  - name: SecurityClass
    parent: null
    common_fields: true
    fields:
      - name: cap_table_id
        type: string
        source: input
        description: "FK -> CapTable.id; owning cap table"
      - name: name
        type: string
        source: input
        description: class label e.g. "Series A Preferred", "Common"
        constraints: non-empty, unique within cap_table_id
      - name: class_type
        type: enum
        source: input
        description: common or preferred
        constraints: "one of {COMMON, PREFERRED}"
      - name: shares_outstanding
        type: integer
        source: computed
        description: |
          shares actually issued in this class; incremented by issuance and by
          option exercises that mint shares into this class. Starts at 0.
        default: 0
      - name: original_issue_price_cents
        type: integer
        source: input
        description: per-share price paid at issuance, in cents
        constraints: ">= 0"
      - name: liquidation_pref_multiple
        type: number
        source: input
        description: liquidation preference multiple (e.g. 1.0, 2.0); COMMON must be 0
        default: 1.0
        constraints: ">= 0"
      - name: participating
        type: boolean
        source: input
        description: true = participating preferred (double-dips after pref); false = non-participating
        default: false
      - name: participation_cap_multiple
        type: number
        source: input
        description: cap on total participating return as a multiple of invested capital; 0 = uncapped
        default: 0
        constraints: ">= 0"
      - name: seniority_below_class_id
        type: string
        source: input
        description: |
          FK -> SecurityClass.id; the class that sits ABOVE this one in the
          liquidation stack (this class is paid AFTER that class). null = most
          senior. Forms a self-referential preference chain; cycles rejected.
        default: null

  - name: Shareholder
    parent: null
    common_fields: true
    fields:
      - name: cap_table_id
        type: string
        source: input
        description: "FK -> CapTable.id; owning cap table"
      - name: legal_name
        type: string
        source: input
        description: holder legal name
        constraints: non-empty
      - name: holder_type
        type: enum
        source: input
        description: founder, employee, investor, or entity
        constraints: "one of {FOUNDER, EMPLOYEE, INVESTOR, ENTITY}"
      - name: email
        type: string
        source: input
        description: contact email, unique within cap_table_id
        constraints: non-empty, unique within cap_table_id
      - name: is_us_taxpayer
        type: boolean
        source: input
        description: true if subject to IRS reporting (drives Form 3921 eligibility)
        default: true

  - name: ShareIssuance
    parent: null
    common_fields: false
    fields:
      - name: cap_table_id
        type: string
        source: input
        description: "FK -> CapTable.id; owning cap table"
      - name: security_class_id
        type: string
        source: input
        description: "FK -> SecurityClass.id; class into which shares are issued"
      - name: shareholder_id
        type: string
        source: input
        description: "FK -> Shareholder.id; recipient of the issued shares"
      - name: share_count
        type: integer
        source: input
        description: number of shares issued in this transaction
        constraints: "> 0"
      - name: price_paid_cents
        type: integer
        source: input
        description: total consideration paid in cents
        constraints: ">= 0"
      - name: issued_at
        type: datetime
        source: system
        description: server timestamp of issuance; immutable append-only record

  - name: Valuation
    parent: null
    common_fields: true
    fields:
      - name: cap_table_id
        type: string
        source: input
        description: "FK -> CapTable.id; owning cap table"
      - name: fmv_per_share_cents
        type: integer
        source: input
        description: 409A fair-market-value per common share in cents
        constraints: "> 0"
      - name: valuation_date
        type: datetime
        source: input
        description: effective date of this 409A appraisal; safe-harbor window start
      - name: expires_at
        type: datetime
        source: input
        description: |
          date the safe-harbor period ends (typically valuation_date + 12mo).
          A grant priced under an EXPIRED valuation is non-compliant; see §1.4.
          The safe-harbor window [valuation_date, expires_at] is CLOSED: a new
          valuation whose window touches or overlaps an existing non-superseded
          valuation's window on the same cap table is rejected (adjacency at a
          shared endpoint counts as a conflict). Contrast with BlackoutWindow's
          half-open semantics.
      - name: status
        type: enum
        source: system
        description: lifecycle state; see §1.2
        default: DRAFT
        constraints: "one of {DRAFT, EFFECTIVE, SUPERSEDED}"
      - name: superseded_by_id
        type: string
        source: system
        description: |
          FK -> Valuation.id; the later EFFECTIVE valuation that displaced this
          one. null while EFFECTIVE or DRAFT.
        default: null

  - name: OptionPool
    parent: null
    common_fields: true
    fields:
      - name: cap_table_id
        type: string
        source: input
        description: "FK -> CapTable.id; owning cap table"
      - name: authorized_shares
        type: integer
        source: input
        description: shares reserved into this pool for option grants
        constraints: "> 0"
      - name: allocated_shares
        type: integer
        source: computed
        description: |
          sum of OptionGrant.share_count for grants drawing on this pool in
          states {ACTIVE, EXERCISED} (CANCELLED/EXPIRED return their shares).
          See §1.3 pool_allocation.
        default: 0
      - name: available_shares
        type: integer
        source: computed
        description: authorized_shares - allocated_shares; floor 0
        default: 0
      - name: status
        type: enum
        source: system
        description: pool lifecycle; see §1.2
        default: ACTIVE
        constraints: "one of {ACTIVE, EXHAUSTED, CLOSED}"

  - name: OptionGrant
    parent: null
    common_fields: true
    fields:
      - name: cap_table_id
        type: string
        source: input
        description: "FK -> CapTable.id; owning cap table"
      - name: option_pool_id
        type: string
        source: input
        description: "FK -> OptionPool.id; pool the grant draws shares from"
      - name: shareholder_id
        type: string
        source: input
        description: "FK -> Shareholder.id; grantee"
      - name: security_class_id
        type: string
        source: input
        description: "FK -> SecurityClass.id; class minted on exercise (must be COMMON)"
      - name: valuation_id
        type: string
        source: input
        description: "FK -> Valuation.id; the 409A under which strike price was set"
      - name: share_count
        type: integer
        source: input
        description: total options granted
        constraints: "> 0"
      - name: strike_price_cents
        type: integer
        source: input
        description: per-share exercise price in cents; must be >= valuation.fmv_per_share_cents at grant
        constraints: "> 0"
      - name: grant_date
        type: datetime
        source: input
        description: vesting start (commencement) date
      - name: vesting_months
        type: integer
        source: input
        description: total vesting duration in months
        constraints: "> 0"
      - name: cliff_months
        type: integer
        source: input
        description: cliff length in months; 0 = no cliff
        default: 0
        constraints: ">= 0, <= vesting_months"
      - name: vesting_style
        type: enum
        source: input
        description: graded (monthly after cliff) or cliff-only (all at cliff)
        default: GRADED
        constraints: "one of {GRADED, CLIFF_ONLY}"
      - name: early_exercise_allowed
        type: boolean
        source: input
        description: if true, unvested shares may be exercised early (83(b) territory)
        default: false
      - name: vested_shares
        type: integer
        source: computed
        description: |
          shares vested as of the current clock; depends on grant_date,
          cliff_months, vesting_months, vesting_style. See §1.3 vested_share_count.
        default: 0
      - name: exercised_shares
        type: integer
        source: computed
        description: cumulative shares exercised across all Exercise records on this grant
        default: 0
      - name: status
        type: enum
        source: system
        description: grant lifecycle; see §1.2
        default: DRAFT
        constraints: "one of {DRAFT, ACTIVE, EXERCISED, CANCELLED, EXPIRED}"
      - name: approved_by_user_id
        type: string
        source: system
        description: |
          X-User-ID of the BoardApprover who approved this grant; must differ
          from the Administrator who drafted it (segregation of duties).
        default: null

  - name: Exercise
    parent: null
    common_fields: true
    fields:
      - name: cap_table_id
        type: string
        source: input
        description: "FK -> CapTable.id; owning cap table"
      - name: option_grant_id
        type: string
        source: input
        description: "FK -> OptionGrant.id; the grant being exercised"
      - name: share_count
        type: integer
        source: input
        description: number of options exercised in this transaction
        constraints: "> 0"
      - name: is_early_exercise
        type: boolean
        source: computed
        description: true if share_count exceeded vested_shares at exercise time (drew on unvested)
        default: false
      - name: spread_cents
        type: integer
        source: computed
        description: |
          (valuation.fmv_per_share_cents - grant.strike_price_cents) * share_count,
          floor 0; the taxable bargain element. See §1.3 exercise_spread.
        default: 0
      - name: filing_3921_id
        type: string
        source: system
        description: |
          FK -> Form3921.id; the IRS Form 3921 generated for this exercise.
          null until generated. See §1.2 Exercise machine.
        default: null
      - name: status
        type: enum
        source: system
        description: exercise lifecycle; see §1.2
        default: PENDING
        constraints: "one of {PENDING, SETTLED, REVERSED}"

  - name: Section83bElection
    parent: null
    common_fields: true
    fields:
      - name: cap_table_id
        type: string
        source: input
        description: "FK -> CapTable.id; owning cap table"
      - name: exercise_id
        type: string
        source: input
        description: "FK -> Exercise.id; the early-exercise this election covers"
      - name: filed_date
        type: datetime
        source: input
        description: date the election was postmarked to the IRS
      - name: exercise_date
        type: datetime
        source: computed
        description: copied from the Exercise.issued/settled date; the 30-day window anchor
      - name: status
        type: enum
        source: system
        description: election lifecycle; see §1.2
        default: PENDING
        constraints: "one of {PENDING, ACCEPTED, REJECTED_LATE}"

  - name: SafeNote
    parent: null
    common_fields: true
    fields:
      - name: cap_table_id
        type: string
        source: input
        description: "FK -> CapTable.id; owning cap table"
      - name: shareholder_id
        type: string
        source: input
        description: "FK -> Shareholder.id; the investor"
      - name: instrument_type
        type: enum
        source: input
        description: SAFE or convertible NOTE
        constraints: "one of {SAFE, NOTE}"
      - name: principal_cents
        type: integer
        source: input
        description: invested principal in cents
        constraints: "> 0"
      - name: valuation_cap_cents
        type: integer
        source: input
        description: post-money valuation cap in cents; 0 = no cap
        default: 0
        constraints: ">= 0"
      - name: discount_pct
        type: number
        source: input
        description: discount on next-round price, 0..1 (e.g. 0.20 = 20% off)
        default: 0
        constraints: ">= 0, < 1"
      - name: interest_rate_pct
        type: number
        source: input
        description: simple annual interest, NOTE only; SAFE must be 0
        default: 0
        constraints: ">= 0"
      - name: issue_date
        type: datetime
        source: input
        description: date the instrument was funded (interest accrues from here)
      - name: converted_share_count
        type: integer
        source: computed
        description: shares minted on conversion; 0 until CONVERTED. See §1.3 conversion_shares.
        default: 0
      - name: converted_into_class_id
        type: string
        source: system
        description: "FK -> SecurityClass.id; preferred class the note converted into; null until CONVERTED"
        default: null
      - name: status
        type: enum
        source: system
        description: instrument lifecycle; see §1.2
        default: DRAFT
        constraints: "one of {DRAFT, NEGOTIATING, OUTSTANDING, CONVERTED, REPAID}"

  - name: Form3921
    parent: null
    common_fields: false
    fields:
      - name: cap_table_id
        type: string
        source: input
        description: "FK -> CapTable.id; owning cap table"
      - name: exercise_id
        type: string
        source: input
        description: "FK -> Exercise.id; the ISO exercise this form reports"
      - name: shareholder_id
        type: string
        source: input
        description: "FK -> Shareholder.id; the employee/holder reported to the IRS"
      - name: tax_year
        type: integer
        source: system
        description: calendar year of the exercise (from exercise settle date)
      - name: exercise_fmv_cents
        type: integer
        source: system
        description: per-share FMV at exercise (from the grant's valuation)
      - name: strike_price_cents
        type: integer
        source: system
        description: per-share strike (copied from the grant)
      - name: shares_transferred
        type: integer
        source: system
        description: number of shares the exercise minted

  - name: LiquidationEvent
    parent: null
    common_fields: true
    fields:
      - name: cap_table_id
        type: string
        source: input
        description: "FK -> CapTable.id; owning cap table"
      - name: total_proceeds_cents
        type: integer
        source: input
        description: total exit consideration to distribute, in cents
        constraints: ">= 0"
      - name: status
        type: enum
        source: system
        description: event lifecycle; see §1.2
        default: DRAFT
        constraints: "one of {DRAFT, COMPUTED, FINALIZED}"

  - name: WaterfallDistribution
    parent: null
    common_fields: false
    fields:
      - name: cap_table_id
        type: string
        source: input
        description: "FK -> CapTable.id; owning cap table"
      - name: liquidation_event_id
        type: string
        source: input
        description: "FK -> LiquidationEvent.id; the event this allocation belongs to"
      - name: security_class_id
        type: string
        source: input
        description: "FK -> SecurityClass.id; the class receiving this allocation"
      - name: preference_paid_cents
        type: integer
        source: system
        description: liquidation-preference dollars allocated to this class
      - name: participation_paid_cents
        type: integer
        source: system
        description: participation/common dollars allocated to this class after preferences
      - name: total_paid_cents
        type: integer
        source: system
        description: preference_paid_cents + participation_paid_cents

  - name: BlackoutWindow
    parent: null
    common_fields: true
    fields:
      - name: cap_table_id
        type: string
        source: input
        description: "FK -> CapTable.id; owning cap table"
      - name: reason
        type: string
        source: input
        description: blackout reason label e.g. "PRE_EARNINGS", "ACQUISITION"
        constraints: non-empty
      - name: starts_at
        type: datetime
        source: input
        description: blackout window start (insider-trading lockout begins)
      - name: ends_at
        type: datetime
        source: input
        description: |
          blackout window end. The window is treated as HALF-OPEN [starts_at,
          ends_at): two blackout windows on the same cap table conflict only
          when they strictly overlap; one ending exactly when another starts
          does NOT conflict (adjacency allowed). Contrast with Valuation
          safe-harbor windows which use CLOSED semantics (adjacency conflicts).
        constraints: "ends_at > starts_at"
      - name: status
        type: enum
        source: system
        description: window lifecycle; see §1.2
        default: SCHEDULED
        constraints: "one of {SCHEDULED, LIFTED}"

# =====================================================================
# §1.2 State Machine Table
# =====================================================================
state_machines:
  - entity: CapTable
    initial_state: OPEN
    terminal_states: [DISSOLVED]
    transitions:
      - from: OPEN
        to: LOCKED
        trigger: "POST /cap-tables/{id}/lock"
        actor: BoardApprover
        preconditions:
          - "cap_table.status == OPEN"
          - "expected_cap_table_version matches cap_table.version (OCC)"
        side_effects:
          - "set status = LOCKED, locked_at = now"
          - "increments CapTable.version by 1"
        note: "LOCKED freezes new issuances/grants; exercises and liquidation still allowed."
      - from: LOCKED
        to: OPEN
        trigger: "POST /cap-tables/{id}/unlock"
        actor: BoardApprover
        preconditions:
          - "cap_table.status == LOCKED"
          - "expected_cap_table_version matches cap_table.version (OCC)"
        side_effects:
          - "set status = OPEN, locked_at = null"
          - "increments CapTable.version by 1"
      - from: OPEN
        to: DISSOLVED
        trigger: "POST /cap-tables/{id}/dissolve"
        actor: BoardApprover
        preconditions:
          - "cap_table.status == OPEN"
          - "no OptionGrant in state ACTIVE on this table"
        side_effects:
          - "set status = DISSOLVED"
          - "increments CapTable.version by 1"

  - entity: Valuation
    initial_state: DRAFT
    terminal_states: [SUPERSEDED]
    transitions:
      - from: DRAFT
        to: EFFECTIVE
        trigger: "POST /valuations/{id}/approve"
        actor: BoardApprover
        preconditions:
          - "valuation.status == DRAFT"
          - "cap_table.status != DISSOLVED"
        side_effects:
          - "set status = EFFECTIVE"
          - "CASCADE: the prior EFFECTIVE Valuation on the same cap table (if any) transitions EFFECTIVE -> SUPERSEDED, its superseded_by_id set to this valuation.id"
          - "recompute CapTable.fully_diluted_shares (as-converted SAFE/note shares re-price at the new FMV)"
        note: "Only one EFFECTIVE valuation per cap table at a time."
      - from: EFFECTIVE
        to: SUPERSEDED
        trigger: "system: a newer Valuation is approved"
        actor: system
        preconditions:
          - "a different Valuation on the same cap table just became EFFECTIVE"
        side_effects:
          - "set superseded_by_id = the newer valuation.id"

  - entity: OptionGrant
    initial_state: DRAFT
    terminal_states: [EXERCISED, CANCELLED, EXPIRED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /option-grants/{id}/approve"
        actor: BoardApprover
        preconditions:
          - "grant.status == DRAFT"
          - "cap_table.status == OPEN"
          - "X-User-ID != the Administrator who created the grant (segregation of duties)"
          - "grant's Valuation is EFFECTIVE and not expired at grant_date"
          - "pool.available_shares >= grant.share_count"
        side_effects:
          - "set status = ACTIVE, approved_by_user_id = X-User-ID"
          - "CASCADE: pool.allocated_shares += share_count; pool.available_shares recomputed; if pool.available_shares == 0 then pool.status = ACTIVE -> EXHAUSTED"
          - "recompute CapTable.fully_diluted_shares"
      - from: DRAFT
        to: CANCELLED
        trigger: "POST /option-grants/{id}/cancel"
        actor: Administrator
        preconditions:
          - "grant.status == DRAFT"
        side_effects:
          - "set status = CANCELLED"
        note: "DRAFT grants never touched the pool, so no return."
      - from: ACTIVE
        to: CANCELLED
        trigger: "POST /option-grants/{id}/cancel"
        actor: Administrator
        preconditions:
          - "grant.status == ACTIVE"
          - "grant.exercised_shares == 0"
        side_effects:
          - "set status = CANCELLED"
          - "CASCADE: pool.allocated_shares -= share_count; pool.available_shares recomputed; if pool was EXHAUSTED and now available_shares > 0 then pool.status = EXHAUSTED -> ACTIVE"
          - "recompute CapTable.fully_diluted_shares"
        note: "Compensating action — returns the full grant to the pool, restoring pool conservation."
      - from: ACTIVE
        to: EXERCISED
        trigger: "system: cumulative exercised_shares reaches share_count"
        actor: system
        preconditions:
          - "grant.exercised_shares == grant.share_count after an Exercise settles"
        side_effects:
          - "set status = EXERCISED"
      - from: ACTIVE
        to: EXPIRED
        trigger: "POST /option-grants/{id}/expire"
        actor: Administrator
        preconditions:
          - "grant.status == ACTIVE"
          - "clock is past grant_date + vesting_months + post-termination window (PTE_MONTHS)"
        side_effects:
          - "set status = EXPIRED"
          - "CASCADE: unexercised portion (share_count - exercised_shares) returned to pool: pool.allocated_shares -= (share_count - exercised_shares); pool.available_shares recomputed; pool EXHAUSTED -> ACTIVE if freed"
          - "recompute CapTable.fully_diluted_shares"

  - entity: Exercise
    initial_state: PENDING
    terminal_states: [SETTLED, REVERSED]
    transitions:
      - from: PENDING
        to: SETTLED
        trigger: "POST /exercises/{id}/settle"
        actor: Administrator
        preconditions:
          - "exercise.status == PENDING"
          - "grant.status == ACTIVE"
          - "payment recorded (price_paid implied) — modeled as settle action"
        side_effects:
          - "CASCADE depth-3: (1) grant.exercised_shares += share_count; (2) the target SecurityClass.shares_outstanding += share_count, which (3) recomputes CapTable.issued_shares and CapTable.fully_diluted_shares"
          - "compute Exercise.spread_cents from the grant's Valuation FMV (§1.3 exercise_spread)"
          - "if shareholder.is_us_taxpayer and grant is ISO-style: generate Form3921 (set filing_3921_id) — see §1.2 Form3921 machine via the generate endpoint"
          - "if grant.exercised_shares reaches grant.share_count: grant ACTIVE -> EXERCISED"
      - from: PENDING
        to: REVERSED
        trigger: "POST /exercises/{id}/reverse"
        actor: Administrator
        preconditions:
          - "exercise.status == PENDING"
        side_effects:
          - "set status = REVERSED"
        note: "A never-settled exercise is simply voided; no share movement to undo."
      - from: SETTLED
        to: REVERSED
        trigger: "POST /exercises/{id}/reverse"
        actor: Administrator
        preconditions:
          - "exercise.status == SETTLED"
          - "no accepted Section83bElection references this exercise"
        side_effects:
          - "COMPENSATION depth-3: (1) grant.exercised_shares -= share_count; (2) SecurityClass.shares_outstanding -= share_count; (3) recompute CapTable.issued_shares and fully_diluted_shares — net effect on issued_shares is zero relative to pre-exercise"
          - "if grant was EXERCISED revert grant EXERCISED -> ACTIVE"
          - "if a Form3921 was generated for this exercise it is voided (delete linkage)"

  - entity: Section83bElection
    initial_state: PENDING
    terminal_states: [ACCEPTED, REJECTED_LATE]
    transitions:
      - from: PENDING
        to: ACCEPTED
        trigger: "POST /section-83b-elections/{id}/process"
        actor: Administrator
        preconditions:
          - "election.status == PENDING"
          - "filed_date <= exercise_date + 30 days (inclusive)"
        side_effects:
          - "set status = ACCEPTED"
      - from: PENDING
        to: REJECTED_LATE
        trigger: "POST /section-83b-elections/{id}/process"
        actor: Administrator
        preconditions:
          - "election.status == PENDING"
          - "filed_date > exercise_date + 30 days"
        side_effects:
          - "set status = REJECTED_LATE"
        note: "Branch on the 30-day boundary — the same process trigger forks to ACCEPTED or REJECTED_LATE."

  - entity: SafeNote
    initial_state: DRAFT
    terminal_states: [CONVERTED, REPAID]
    transitions:
      - from: DRAFT
        to: NEGOTIATING
        trigger: "POST /safe-notes/{id}/submit-terms"
        actor: Administrator
        preconditions:
          - "note.status == DRAFT"
        side_effects:
          - "set status = NEGOTIATING"
      - from: NEGOTIATING
        to: DRAFT
        trigger: "POST /safe-notes/{id}/revise"
        actor: Administrator
        preconditions:
          - "note.status == NEGOTIATING"
        side_effects:
          - "set status = DRAFT"
        note: "Revision cycle DRAFT <-> NEGOTIATING before the note is bound."
      - from: NEGOTIATING
        to: OUTSTANDING
        trigger: "POST /safe-notes/{id}/execute"
        actor: BoardApprover
        preconditions:
          - "note.status == NEGOTIATING"
          - "cap_table.status == OPEN"
        side_effects:
          - "set status = OUTSTANDING"
          - "recompute CapTable.fully_diluted_shares (note now counts as-converted)"
      - from: OUTSTANDING
        to: CONVERTED
        trigger: "POST /safe-notes/{id}/convert"
        actor: BoardApprover
        preconditions:
          - "note.status == OUTSTANDING"
          - "a target priced-round SecurityClass (PREFERRED) is supplied and exists on this cap table"
          - "expected_note_version matches note.version (OCC)"
        side_effects:
          - "compute converted_share_count (§1.3 conversion_shares) using the better of cap-price vs discount-price"
          - "CASCADE: set converted_into_class_id; SecurityClass.shares_outstanding += converted_share_count; recompute CapTable.issued_shares and fully_diluted_shares"
          - "set status = CONVERTED"
          - "increments SafeNote.version by 1"
      - from: OUTSTANDING
        to: REPAID
        trigger: "POST /safe-notes/{id}/repay"
        actor: BoardApprover
        preconditions:
          - "note.status == OUTSTANDING"
        side_effects:
          - "set status = REPAID"
        note: "NOTE only path — principal + accrued interest returned, no shares minted."

  - entity: OptionPool
    initial_state: ACTIVE
    terminal_states: [CLOSED]
    transitions:
      - from: ACTIVE
        to: EXHAUSTED
        trigger: "system: available_shares reaches 0 after a grant approval"
        actor: system
        preconditions:
          - "pool.available_shares == 0"
        side_effects: ["set status = EXHAUSTED"]
      - from: EXHAUSTED
        to: ACTIVE
        trigger: "system: available_shares rises above 0 after grant cancel/expire"
        actor: system
        preconditions:
          - "pool.available_shares > 0"
        side_effects: ["set status = ACTIVE"]
      - from: ACTIVE
        to: CLOSED
        trigger: "POST /option-pools/{id}/refresh"
        actor: BoardApprover
        preconditions:
          - "pool.status == ACTIVE"
          - "expected_pool_version matches pool.version (OCC)"
          - "replacement pool authorized_shares supplied"
        side_effects:
          - "set status = CLOSED on the old pool"
          - "CASCADE: create a new OptionPool (status ACTIVE) with authorized_shares = old.available_shares + refresh_increment_shares; new pool inherits no grants"
          - "increments OptionPool.version by 1 on the old pool"
        note: "Pool refresh — top-up flow that retires the old pool and opens a fresh one."

  - entity: LiquidationEvent
    initial_state: DRAFT
    terminal_states: [FINALIZED]
    transitions:
      - from: DRAFT
        to: COMPUTED
        trigger: "POST /liquidation-events/{id}/compute"
        actor: BoardApprover
        preconditions:
          - "event.status == DRAFT"
          - "cap_table has at least one SecurityClass"
        side_effects:
          - "run §1.3 liquidation_waterfall across all SecurityClasses ordered by the seniority chain"
          - "create one WaterfallDistribution per class with preference_paid_cents / participation_paid_cents / total_paid_cents"
          - "set status = COMPUTED"
      - from: COMPUTED
        to: DRAFT
        trigger: "POST /liquidation-events/{id}/recompute"
        actor: BoardApprover
        preconditions:
          - "event.status == COMPUTED"
        side_effects:
          - "delete all WaterfallDistribution rows for this event"
          - "set status = DRAFT"
        note: "Revision loop — recompute clears prior allocations so the waterfall can re-run."
      - from: COMPUTED
        to: FINALIZED
        trigger: "POST /liquidation-events/{id}/finalize"
        actor: BoardApprover
        preconditions:
          - "event.status == COMPUTED"
        side_effects:
          - "set status = FINALIZED (allocations immutable)"

  - entity: BlackoutWindow
    initial_state: SCHEDULED
    terminal_states: [LIFTED]
    transitions:
      - from: SCHEDULED
        to: LIFTED
        trigger: "POST /blackout-windows/{id}/lift"
        actor: Administrator
        preconditions:
          - "window.status == SCHEDULED"
        side_effects:
          - "set status = LIFTED"
        note: "Lifting a window frees its interval; a lifted window no longer participates in overlap checks."

# =====================================================================
# §1.2.1 Concurrency Rules
# =====================================================================
concurrency_rules:
  - rule_id: note-convert-stale-table
    parent_entity: SafeNote
    write_endpoint: "POST /safe-notes/{id}/convert"
    occ_field: "expected_note_version"
    description: |
      Converting a SafeNote whose version has advanced since the client last
      observed it is rejected. A revise/execute on the same note legitimately
      bumps its version; a converter carrying a stale version is operating on an
      outdated view of the conversion terms and is rejected.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: pool-refresh-stale
    parent_entity: OptionPool
    write_endpoint: "POST /option-pools/{id}/refresh"
    occ_field: "expected_pool_version"
    description: |
      Refreshing an OptionPool whose version has advanced since the client last
      observed it is rejected. A grant approval that exhausts the pool bumps its
      version; a refresh carrying a stale version would top up against an
      outdated available_shares figure and is rejected.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: captable-lock-stale
    parent_entity: CapTable
    write_endpoint: "POST /cap-tables/{id}/lock"
    occ_field: "expected_cap_table_version"
    description: |
      Locking a CapTable whose version has advanced since the client last
      observed it is rejected. Any issuance, grant approval, or valuation
      approval bumps the table version; a lock carrying a stale version is
      acting on an outdated snapshot of the table and is rejected.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =====================================================================
# §1.3 Calculation Rules Table
# =====================================================================
calculations:
  - name: vested_share_count
    trigger: "read of OptionGrant.vested_shares; recomputed against current clock"
    algorithm: threshold
    formula: |
      months_elapsed = whole_months_between(grant_date, now)   # floor to integer months
      if months_elapsed < cliff_months:
          vested = 0
      elif vesting_style == CLIFF_ONLY:
          vested = share_count                                  # all vests at the cliff
      else:  # GRADED
          # cliff portion vests at cliff, remainder accrues monthly
          capped_months = min(months_elapsed, vesting_months)
          vested = floor(share_count * capped_months / vesting_months)
      vested = min(vested, share_count)
    input_set: "single grant; clock supplied by /_clock"
    constants:
      PTE_MONTHS: 3        # post-termination exercise window used by EXPIRE
    precision: "integer shares, floor (round_down)"
    variants:
      - name: graded_monthly
        when: "vesting_style == GRADED and months_elapsed >= cliff_months"
        difference: "linear monthly accrual floored to whole shares"
      - name: cliff_only_step
        when: "vesting_style == CLIFF_ONLY"
        difference: "step function — 0 before cliff, full share_count at/after cliff"

  - name: exercise_spread
    trigger: "POST /exercises/{id}/settle side-effect"
    algorithm: aggregation
    formula: |
      fmv = grant.valuation.fmv_per_share_cents
      spread_per_share = max(0, fmv - grant.strike_price_cents)
      spread_cents = spread_per_share * exercise.share_count
    input_set: "single exercise + its grant's pinned Valuation"
    constants: {}
    precision: "integer cents, no rounding (exact)"
    variants:
      - name: in_the_money
        when: "fmv > strike"
        difference: "positive taxable spread; Form3921 reports it"
      - name: at_or_under_water
        when: "fmv <= strike"
        difference: "spread floored to 0; Form3921 still issued but bargain element is 0"

  - name: conversion_shares
    trigger: "POST /safe-notes/{id}/convert side-effect"
    algorithm: tiered_pricing
    formula: |
      # accrued amount
      if instrument_type == NOTE:
          years = days_between(issue_date, now) / 365
          accrued = round_half_up(principal_cents * interest_rate_pct * years)
      else:  # SAFE
          accrued = 0
      invested = principal_cents + accrued
      round_price_cents = target_class.original_issue_price_cents   # the new priced round PPS

      # two candidate conversion prices; investor takes the MORE FAVORABLE (lower) price
      discount_price = round_price_cents * (1 - discount_pct)        # may be fractional cents
      if valuation_cap_cents > 0:
          cap_price = valuation_cap_cents / cap_table.fully_diluted_shares   # cap PPS
          effective_price = min(discount_price, cap_price)
      else:
          effective_price = discount_price
      converted_share_count = floor(invested / effective_price)
    input_set: "single note + target priced-round SecurityClass + current fully_diluted_shares"
    constants:
      DAYS_PER_YEAR: 365
    precision: "price arithmetic in float cents; final share count floor (round_down); accrued interest round_half_up to whole cents"
    variants:
      - name: cap_binds
        when: "cap_price < discount_price"
        difference: "valuation cap is the better deal → more shares per dollar"
      - name: discount_binds
        when: "discount_price <= cap_price or no cap"
        difference: "discount price governs; cap either absent or worse"

  - name: liquidation_waterfall
    trigger: "POST /liquidation-events/{id}/compute side-effect"
    algorithm: waterfall_allocation
    formula: |
      remaining = total_proceeds_cents
      # Pass 1 — pay liquidation preferences in seniority order (most senior first).
      # Seniority chain: a class with seniority_below_class_id == null is most
      # senior; each class is paid AFTER the class it points to. Order classes by
      # walking the chain top-down; tie-break ties (two classes naming the same
      # parent) by created_at ASC.
      for class in seniority_order(PREFERRED classes):
          invested = class.original_issue_price_cents * class.shares_outstanding
          pref = round_half_up(class.liquidation_pref_multiple * invested)
          pay = min(pref, remaining)
          class.preference_paid_cents = pay
          remaining -= pay
      # Pass 2 — distribute the residual pro-rata.
      # Non-participating preferred has ALREADY taken its pref and does NOT share here.
      # Participating preferred AND common share pro-rata by shares_outstanding,
      # subject to participation_cap_multiple for participating preferred.
      participating_shares = sum(shares_outstanding of COMMON
                                 + PARTICIPATING PREFERRED classes)
      for class in (COMMON + PARTICIPATING PREFERRED):
          raw = round_half_up(remaining * class.shares_outstanding / participating_shares)
          if class is PARTICIPATING PREFERRED and class.participation_cap_multiple > 0:
              invested = class.original_issue_price_cents * class.shares_outstanding
              cap_total = round_half_up(class.participation_cap_multiple * invested)
              allowed = max(0, cap_total - class.preference_paid_cents)
              class.participation_paid_cents = min(raw, allowed)
          else:
              class.participation_paid_cents = raw
          class.total_paid_cents = class.preference_paid_cents + class.participation_paid_cents
    input_set: "all SecurityClasses on the cap table at compute time; shares_outstanding pinned at compute"
    constants: {}
    precision: "integer cents; round_half_up at each per-class allocation; remainder cents assigned to the most-senior class in seniority_order to conserve the total"
    variants:
      - name: non_participating
        when: "preferred.participating == false"
        difference: "class takes the GREATER of its preference OR its as-converted pro-rata, never both; does not join Pass 2"
      - name: participating_capped
        when: "preferred.participating == true and participation_cap_multiple > 0"
        difference: "takes preference AND pro-rata, but total capped at cap_multiple * invested"

  - name: issued_share_count
    trigger: "recompute on issuance, exercise settle/reverse, conversion"
    algorithm: aggregation
    formula: |
      issued_shares = sum(SecurityClass.shares_outstanding for all classes on this cap_table)
    input_set: "all SecurityClasses on the cap table"
    constants: {}
    precision: "integer shares, exact"
    variants: []

  - name: fully_diluted_count
    trigger: "recompute on grant approval/cancel/expire, valuation approval, note execute/convert, exercise settle/reverse"
    algorithm: aggregation
    formula: |
      fd = issued_share_count
      fd += sum(grant.share_count - grant.exercised_shares for ACTIVE OptionGrants)
      fd += sum(pool.available_shares for ACTIVE OptionPools)
      for note in OUTSTANDING SafeNotes:
          # as-converted at the latest EFFECTIVE Valuation's implied price
          fd += as_converted_shares(note, latest_effective_valuation)
      fully_diluted_shares = fd
    input_set: "ACTIVE grants, ACTIVE pools, OUTSTANDING notes, latest EFFECTIVE valuation"
    constants: {}
    precision: "integer shares; per-note as-converted floored before summing (round per-item then sum)"
    variants:
      - name: with_outstanding_notes
        when: "at least one OUTSTANDING SafeNote exists"
        difference: "as-converted note shares re-price whenever a new Valuation becomes EFFECTIVE"
      - name: no_notes
        when: "no OUTSTANDING notes"
        difference: "purely issued + granted-unexercised + pool reserve"

# =====================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =====================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and X-User-Role is a known role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "the role is permitted to perform this operation per §1.7"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: existence
    check: "every path/body id (cap_table_id, security_class_id, shareholder_id, option_pool_id, option_grant_id, valuation_id, exercise_id, liquidation_event_id) resolves to an existing entity, validated left-to-right"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints taking ids"
  - priority: 4
    category: state
    check: "target entity is in a state from which the requested transition is legal (see §1.2 from-states)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all transition endpoints"
  - priority: 5
    category: business_safety
    check: "segregation of duties: the BoardApprover approving a grant (X-User-ID) is not the Administrator who created it"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /option-grants/{id}/approve"
  - priority: 6
    category: business_safety
    check: "grant priced under an EFFECTIVE, non-expired Valuation; strike_price_cents >= valuation.fmv_per_share_cents at grant time (409A safe harbor)"
    error_id: ERR_409A_NONCOMPLIANT
    http_status: 422
    applies_to: "POST /option-grants, POST /option-grants/{id}/approve"
  - priority: 7
    category: business_temporal
    check: "Section83bElection.filed_date must be within 30 days of the exercise_date to be ACCEPTED; otherwise REJECTED_LATE (boundary inclusive at 30)"
    error_id: ERR_83B_WINDOW_MISSED
    http_status: 422
    applies_to: "POST /section-83b-elections (rejects pre-filing past 30d only when filed before exercise)"
  - priority: 8
    category: business_temporal
    check: "Valuation used for a grant must not be expired (valuation.expires_at >= grant_date)"
    error_id: ERR_VALUATION_EXPIRED
    http_status: 422
    applies_to: "POST /option-grants"
  - priority: 9
    category: business_referential
    check: "OptionGrant.security_class_id must reference a COMMON class; SafeNote conversion target must be PREFERRED"
    error_id: ERR_WRONG_CLASS_TYPE
    http_status: 422
    applies_to: "POST /option-grants, POST /safe-notes/{id}/convert"
  - priority: 10
    category: business_referential
    check: "SecurityClass.seniority_below_class_id must not introduce a cycle in the preference stack"
    error_id: ERR_SENIORITY_CYCLE
    http_status: 422
    applies_to: "POST /security-classes"
  - priority: 11
    category: business_constraint
    check: "Exercise.share_count must not exceed grant's exercisable shares (vested_shares unless early_exercise_allowed, in which case up to share_count - exercised_shares)"
    error_id: ERR_EXCEEDS_EXERCISABLE
    http_status: 422
    applies_to: "POST /exercises"
  - priority: 12
    category: business_constraint
    check: "issuing/granting on a LOCKED or DISSOLVED cap table is forbidden"
    error_id: ERR_TABLE_NOT_OPEN
    http_status: 409
    applies_to: "POST /share-issuances, POST /option-grants, POST /safe-notes/{id}/execute"
  - priority: 13
    category: business_fiscal
    check: "OptionPool.available_shares >= grant.share_count when approving a grant (pool not over-allocated)"
    error_id: ERR_POOL_INSUFFICIENT
    http_status: 422
    applies_to: "POST /option-grants/{id}/approve"
  - priority: 14
    category: business_fiscal
    check: "ShareIssuance share_count + current issued_shares must not exceed CapTable.authorized_shares"
    error_id: ERR_AUTHORIZED_EXCEEDED
    http_status: 422
    applies_to: "POST /share-issuances"
  - priority: 15
    category: business_temporal
    check: "new Valuation safe-harbor window [valuation_date, expires_at] must not CLOSED-overlap any non-SUPERSEDED valuation on the same cap table (touching endpoints conflict)"
    error_id: ERR_VALUATION_WINDOW_OVERLAP
    http_status: 409
    applies_to: "POST /valuations"
  - priority: 16
    category: business_temporal
    check: "new BlackoutWindow interval [starts_at, ends_at) must not HALF-OPEN-overlap any SCHEDULED window on the same cap table (touching endpoints do NOT conflict)"
    error_id: ERR_BLACKOUT_OVERLAP
    http_status: 409
    applies_to: "POST /blackout-windows"

# =====================================================================
# §1.5 API Endpoint Table
# =====================================================================
endpoints:
  # ---- CapTable ----
  - method: POST
    path: "/cap-tables"
    description: "create a cap table"
    roles: [Administrator]
    code: 201
    input: [company_name, authorized_shares]
    output: CapTable
    side_effects: ["status = OPEN, issued_shares = 0, fully_diluted_shares = 0"]
  - method: GET
    path: "/cap-tables/{id}"
    description: "fetch a cap table with computed totals"
    roles: [Administrator, BoardApprover, Auditor, Stakeholder]
    code: 200
    input: []
    output: CapTable
    side_effects: ["recompute issued_shares + fully_diluted_shares before responding"]
  - method: GET
    path: "/cap-tables"
    description: "list cap tables (paginated)"
    roles: [Administrator, BoardApprover, Auditor]
    code: 200
    input: ["limit?", "offset?"]
    output: CapTable[]
    side_effects: []
  - method: POST
    path: "/cap-tables/{id}/lock"
    description: "freeze new issuances/grants"
    roles: [BoardApprover]
    code: 200
    input: [expected_cap_table_version]
    output: CapTable
    side_effects: ["OPEN -> LOCKED", "increments CapTable.version by 1"]
  - method: POST
    path: "/cap-tables/{id}/unlock"
    description: "re-open a locked table"
    roles: [BoardApprover]
    code: 200
    input: [expected_cap_table_version]
    output: CapTable
    side_effects: ["LOCKED -> OPEN", "increments CapTable.version by 1"]
  - method: POST
    path: "/cap-tables/{id}/dissolve"
    description: "dissolve the company cap table"
    roles: [BoardApprover]
    code: 200
    input: []
    output: CapTable
    side_effects: ["OPEN -> DISSOLVED", "increments CapTable.version by 1"]

  # ---- SecurityClass ----
  - method: POST
    path: "/security-classes"
    description: "create a security class (common or preferred)"
    roles: [Administrator]
    code: 201
    input: [cap_table_id, name, class_type, original_issue_price_cents, "liquidation_pref_multiple?", "participating?", "participation_cap_multiple?", "seniority_below_class_id?"]
    output: SecurityClass
    side_effects: ["shares_outstanding = 0", "reject if seniority_below_class_id forms a cycle"]
  - method: GET
    path: "/security-classes/{id}"
    description: "fetch a security class"
    roles: [Administrator, BoardApprover, Auditor, Stakeholder]
    code: 200
    input: []
    output: SecurityClass
    side_effects: []
  - method: GET
    path: "/security-classes"
    description: "list/filter security classes"
    roles: [Administrator, BoardApprover, Auditor, Stakeholder]
    code: 200
    input: ["cap_table_id?", "seniority_below_class_id?", "limit?", "offset?"]
    output: SecurityClass[]
    side_effects: []

  # ---- Shareholder ----
  - method: POST
    path: "/shareholders"
    description: "register a shareholder"
    roles: [Administrator]
    code: 201
    input: [cap_table_id, legal_name, holder_type, email, "is_us_taxpayer?"]
    output: Shareholder
    side_effects: []
  - method: GET
    path: "/shareholders/{id}"
    description: "fetch a shareholder"
    roles: [Administrator, BoardApprover, Auditor, Stakeholder]
    code: 200
    input: []
    output: Shareholder
    side_effects: []
  - method: GET
    path: "/shareholders"
    description: "list/filter shareholders"
    roles: [Administrator, BoardApprover, Auditor]
    code: 200
    input: ["cap_table_id?", "limit?", "offset?"]
    output: Shareholder[]
    side_effects: []

  # ---- ShareIssuance ----
  - method: POST
    path: "/share-issuances"
    description: "issue shares of a class to a shareholder"
    roles: [Administrator]
    code: 201
    input: [cap_table_id, security_class_id, shareholder_id, share_count, price_paid_cents]
    output: ShareIssuance
    side_effects:
      - "SecurityClass.shares_outstanding += share_count"
      - "recompute CapTable.issued_shares + fully_diluted_shares"
      - "increments CapTable.version by 1"
      - "reject if table not OPEN (ERR_TABLE_NOT_OPEN) or authorized exceeded (ERR_AUTHORIZED_EXCEEDED)"
  - method: GET
    path: "/share-issuances/{id}"
    description: "fetch an issuance record"
    roles: [Administrator, BoardApprover, Auditor]
    code: 200
    input: []
    output: ShareIssuance
    side_effects: []
  - method: GET
    path: "/share-issuances"
    description: "list/filter issuances"
    roles: [Administrator, BoardApprover, Auditor]
    code: 200
    input: ["cap_table_id?", "security_class_id?", "shareholder_id?", "limit?", "offset?"]
    output: ShareIssuance[]
    side_effects: []

  # ---- Valuation ----
  - method: POST
    path: "/valuations"
    description: "create a 409A valuation (DRAFT)"
    roles: [Administrator]
    code: 201
    input: [cap_table_id, fmv_per_share_cents, valuation_date, expires_at]
    output: Valuation
    side_effects:
      - "status = DRAFT"
      - "reject (ERR_VALUATION_WINDOW_OVERLAP) if [valuation_date, expires_at] CLOSED-overlaps any non-SUPERSEDED valuation on the same cap table (adjacency at a shared endpoint conflicts)"
  - method: GET
    path: "/valuations/{id}"
    description: "fetch a valuation"
    roles: [Administrator, BoardApprover, Auditor]
    code: 200
    input: []
    output: Valuation
    side_effects: []
  - method: GET
    path: "/valuations"
    description: "list/filter valuations"
    roles: [Administrator, BoardApprover, Auditor]
    code: 200
    input: ["cap_table_id?", "superseded_by_id?", "limit?", "offset?"]
    output: Valuation[]
    side_effects: []
  - method: POST
    path: "/valuations/{id}/approve"
    description: "make a valuation EFFECTIVE; supersede the prior one"
    roles: [BoardApprover]
    code: 200
    input: []
    output: Valuation
    side_effects:
      - "DRAFT -> EFFECTIVE"
      - "prior EFFECTIVE valuation -> SUPERSEDED (cascade)"
      - "recompute CapTable.fully_diluted_shares"
      - "increments CapTable.version by 1"

  # ---- OptionPool ----
  - method: POST
    path: "/option-pools"
    description: "create an option pool"
    roles: [Administrator]
    code: 201
    input: [cap_table_id, authorized_shares]
    output: OptionPool
    side_effects: ["status = ACTIVE, allocated_shares = 0, available_shares = authorized_shares"]
  - method: GET
    path: "/option-pools/{id}"
    description: "fetch a pool with allocation totals"
    roles: [Administrator, BoardApprover, Auditor]
    code: 200
    input: []
    output: OptionPool
    side_effects: ["recompute allocated_shares + available_shares"]
  - method: GET
    path: "/option-pools"
    description: "list/filter pools"
    roles: [Administrator, BoardApprover, Auditor]
    code: 200
    input: ["cap_table_id?", "limit?", "offset?"]
    output: OptionPool[]
    side_effects: []
  - method: POST
    path: "/option-pools/{id}/refresh"
    description: "retire a pool and open a topped-up replacement"
    roles: [BoardApprover]
    code: 201
    input: [expected_pool_version, refresh_increment_shares]
    output: OptionPool
    side_effects:
      - "old pool ACTIVE -> CLOSED"
      - "create new pool (ACTIVE) authorized = old.available_shares + refresh_increment_shares"
      - "increments OptionPool.version by 1 on old pool"

  # ---- OptionGrant ----
  - method: POST
    path: "/option-grants"
    description: "draft an option grant"
    roles: [Administrator]
    code: 201
    input: [cap_table_id, option_pool_id, shareholder_id, security_class_id, valuation_id, share_count, strike_price_cents, grant_date, vesting_months, "cliff_months?", "vesting_style?", "early_exercise_allowed?"]
    output: OptionGrant
    side_effects:
      - "status = DRAFT"
      - "reject if 409A non-compliant / valuation expired / wrong class type / table not OPEN"
  - method: GET
    path: "/option-grants/{id}"
    description: "fetch a grant with live vested_shares"
    roles: [Administrator, BoardApprover, Auditor, Stakeholder]
    code: 200
    input: []
    output: OptionGrant
    side_effects: ["recompute vested_shares against current clock"]
  - method: GET
    path: "/option-grants"
    description: "list/filter grants"
    roles: [Administrator, BoardApprover, Auditor, Stakeholder]
    code: 200
    input: ["cap_table_id?", "option_pool_id?", "shareholder_id?", "security_class_id?", "valuation_id?", "limit?", "offset?"]
    output: OptionGrant[]
    side_effects: []
  - method: POST
    path: "/option-grants/{id}/approve"
    description: "approve a grant (BoardApprover, segregation of duties)"
    roles: [BoardApprover]
    code: 200
    input: []
    output: OptionGrant
    side_effects:
      - "DRAFT -> ACTIVE, approved_by_user_id set"
      - "pool.allocated_shares += share_count; pool may go EXHAUSTED (cascade)"
      - "recompute CapTable.fully_diluted_shares"
  - method: POST
    path: "/option-grants/{id}/cancel"
    description: "cancel a grant; return shares to pool if it was ACTIVE"
    roles: [Administrator]
    code: 200
    input: []
    output: OptionGrant
    side_effects:
      - "DRAFT|ACTIVE -> CANCELLED"
      - "if was ACTIVE: pool.allocated_shares -= share_count; pool EXHAUSTED -> ACTIVE if freed (cascade)"
      - "recompute CapTable.fully_diluted_shares"
  - method: POST
    path: "/option-grants/{id}/expire"
    description: "expire a grant past its window; return unexercised shares"
    roles: [Administrator]
    code: 200
    input: []
    output: OptionGrant
    side_effects:
      - "ACTIVE -> EXPIRED"
      - "return (share_count - exercised_shares) to pool (cascade)"
      - "recompute CapTable.fully_diluted_shares"

  # ---- Exercise ----
  - method: POST
    path: "/exercises"
    description: "exercise options on an ACTIVE grant (PENDING)"
    roles: [Stakeholder, Administrator]
    code: 201
    input: [cap_table_id, option_grant_id, share_count]
    output: Exercise
    side_effects:
      - "status = PENDING"
      - "set is_early_exercise if share_count exceeds vested_shares (only when early_exercise_allowed)"
      - "reject if share_count exceeds exercisable shares (ERR_EXCEEDS_EXERCISABLE)"
  - method: GET
    path: "/exercises/{id}"
    description: "fetch an exercise with computed spread"
    roles: [Administrator, BoardApprover, Auditor, Stakeholder]
    code: 200
    input: []
    output: Exercise
    side_effects: []
  - method: GET
    path: "/exercises"
    description: "list/filter exercises"
    roles: [Administrator, BoardApprover, Auditor, Stakeholder]
    code: 200
    input: ["cap_table_id?", "option_grant_id?", "filing_3921_id?", "limit?", "offset?"]
    output: Exercise[]
    side_effects: []
  - method: POST
    path: "/exercises/{id}/settle"
    description: "settle a pending exercise; mint shares, compute spread, file 3921"
    roles: [Administrator]
    code: 200
    input: []
    output: Exercise
    side_effects:
      - "PENDING -> SETTLED (cascade depth-3: grant.exercised_shares, class.shares_outstanding, table totals)"
      - "compute spread_cents"
      - "grant ACTIVE -> EXERCISED if fully exercised"
  - method: POST
    path: "/exercises/{id}/reverse"
    description: "reverse an exercise; unwind share movement (compensation)"
    roles: [Administrator]
    code: 200
    input: []
    output: Exercise
    side_effects:
      - "PENDING|SETTLED -> REVERSED"
      - "if was SETTLED: unwind grant.exercised_shares, class.shares_outstanding, table totals (compensation depth-3)"
      - "void any linked Form3921; reject if an ACCEPTED 83b election references it"

  # ---- Form3921 (test-driving + read) ----
  - method: POST
    path: "/exercises/{id}/form-3921"
    description: "generate the Form 3921 for a settled ISO exercise"
    roles: [Administrator]
    code: 201
    input: []
    output: Form3921
    side_effects:
      - "create Form3921 from the exercise's grant/valuation; set exercise.filing_3921_id"
      - "reject if exercise not SETTLED or shareholder is not a US taxpayer"
  - method: GET
    path: "/forms-3921/{id}"
    description: "fetch a generated Form 3921"
    roles: [Administrator, Auditor, Stakeholder]
    code: 200
    input: []
    output: Form3921
    side_effects: []
  - method: GET
    path: "/forms-3921"
    description: "list/filter Form 3921 records"
    roles: [Administrator, Auditor]
    code: 200
    input: ["cap_table_id?", "exercise_id?", "shareholder_id?", "limit?", "offset?"]
    output: Form3921[]
    side_effects: []

  # ---- Section83bElection ----
  - method: POST
    path: "/section-83b-elections"
    description: "file an 83(b) election against an early exercise"
    roles: [Stakeholder, Administrator]
    code: 201
    input: [cap_table_id, exercise_id, filed_date]
    output: Section83bElection
    side_effects: ["status = PENDING; copy exercise_date from the exercise"]
  - method: GET
    path: "/section-83b-elections/{id}"
    description: "fetch an 83(b) election"
    roles: [Administrator, Auditor, Stakeholder]
    code: 200
    input: []
    output: Section83bElection
    side_effects: []
  - method: GET
    path: "/section-83b-elections"
    description: "list/filter 83(b) elections"
    roles: [Administrator, Auditor, Stakeholder]
    code: 200
    input: ["cap_table_id?", "exercise_id?", "limit?", "offset?"]
    output: Section83bElection[]
    side_effects: []
  - method: POST
    path: "/section-83b-elections/{id}/process"
    description: "adjudicate the 30-day window; ACCEPT or REJECT_LATE"
    roles: [Administrator]
    code: 200
    input: []
    output: Section83bElection
    side_effects: ["PENDING -> ACCEPTED if within 30d else PENDING -> REJECTED_LATE"]

  # ---- SafeNote ----
  - method: POST
    path: "/safe-notes"
    description: "draft a SAFE or convertible note"
    roles: [Administrator]
    code: 201
    input: [cap_table_id, shareholder_id, instrument_type, principal_cents, "valuation_cap_cents?", "discount_pct?", "interest_rate_pct?", issue_date]
    output: SafeNote
    side_effects: ["status = DRAFT"]
  - method: GET
    path: "/safe-notes/{id}"
    description: "fetch a note"
    roles: [Administrator, BoardApprover, Auditor, Stakeholder]
    code: 200
    input: []
    output: SafeNote
    side_effects: []
  - method: GET
    path: "/safe-notes"
    description: "list/filter notes"
    roles: [Administrator, BoardApprover, Auditor, Stakeholder]
    code: 200
    input: ["cap_table_id?", "shareholder_id?", "converted_into_class_id?", "limit?", "offset?"]
    output: SafeNote[]
    side_effects: []
  - method: POST
    path: "/safe-notes/{id}/submit-terms"
    description: "move note DRAFT -> NEGOTIATING"
    roles: [Administrator]
    code: 200
    input: []
    output: SafeNote
    side_effects: ["DRAFT -> NEGOTIATING"]
  - method: POST
    path: "/safe-notes/{id}/revise"
    description: "send note back NEGOTIATING -> DRAFT"
    roles: [Administrator]
    code: 200
    input: []
    output: SafeNote
    side_effects: ["NEGOTIATING -> DRAFT", "increments SafeNote.version by 1"]
  - method: POST
    path: "/safe-notes/{id}/execute"
    description: "bind the note NEGOTIATING -> OUTSTANDING"
    roles: [BoardApprover]
    code: 200
    input: []
    output: SafeNote
    side_effects: ["NEGOTIATING -> OUTSTANDING", "recompute CapTable.fully_diluted_shares", "reject if table not OPEN"]
  - method: POST
    path: "/safe-notes/{id}/convert"
    description: "convert an outstanding note into a priced-round class"
    roles: [BoardApprover]
    code: 200
    input: [target_class_id, expected_note_version]
    output: SafeNote
    side_effects:
      - "compute converted_share_count (better of cap vs discount price)"
      - "OUTSTANDING -> CONVERTED; class.shares_outstanding += converted_share_count; recompute table totals"
      - "increments SafeNote.version by 1"
  - method: POST
    path: "/safe-notes/{id}/repay"
    description: "repay an outstanding note (NOTE path)"
    roles: [BoardApprover]
    code: 200
    input: []
    output: SafeNote
    side_effects: ["OUTSTANDING -> REPAID"]

  # ---- LiquidationEvent / Waterfall ----
  - method: POST
    path: "/liquidation-events"
    description: "create a liquidation/exit event (DRAFT)"
    roles: [Administrator]
    code: 201
    input: [cap_table_id, total_proceeds_cents]
    output: LiquidationEvent
    side_effects: ["status = DRAFT"]
  - method: GET
    path: "/liquidation-events/{id}"
    description: "fetch a liquidation event"
    roles: [Administrator, BoardApprover, Auditor]
    code: 200
    input: []
    output: LiquidationEvent
    side_effects: []
  - method: GET
    path: "/liquidation-events"
    description: "list/filter liquidation events"
    roles: [Administrator, BoardApprover, Auditor]
    code: 200
    input: ["cap_table_id?", "limit?", "offset?"]
    output: LiquidationEvent[]
    side_effects: []
  - method: POST
    path: "/liquidation-events/{id}/compute"
    description: "run the liquidation-preference waterfall"
    roles: [BoardApprover]
    code: 200
    input: []
    output: LiquidationEvent
    side_effects: ["DRAFT -> COMPUTED", "create one WaterfallDistribution per class (cascade)"]
  - method: POST
    path: "/liquidation-events/{id}/recompute"
    description: "clear allocations and revert to DRAFT"
    roles: [BoardApprover]
    code: 200
    input: []
    output: LiquidationEvent
    side_effects: ["COMPUTED -> DRAFT", "delete all WaterfallDistribution rows"]
  - method: POST
    path: "/liquidation-events/{id}/finalize"
    description: "lock the computed allocations"
    roles: [BoardApprover]
    code: 200
    input: []
    output: LiquidationEvent
    side_effects: ["COMPUTED -> FINALIZED"]
  - method: GET
    path: "/liquidation-events/{id}/distributions"
    description: "list the per-class waterfall allocations for an event"
    roles: [Administrator, BoardApprover, Auditor, Stakeholder]
    code: 200
    input: []
    output: WaterfallDistribution[]
    side_effects: []
  - method: GET
    path: "/waterfall-distributions/{id}"
    description: "fetch a single waterfall distribution row"
    roles: [Administrator, BoardApprover, Auditor, Stakeholder]
    code: 200
    input: []
    output: WaterfallDistribution
    side_effects: []
  - method: GET
    path: "/waterfall-distributions"
    description: "list/filter waterfall distributions"
    roles: [Administrator, BoardApprover, Auditor, Stakeholder]
    code: 200
    input: ["cap_table_id?", "liquidation_event_id?", "security_class_id?", "limit?", "offset?"]
    output: WaterfallDistribution[]
    side_effects: []

  # ---- BlackoutWindow ----
  - method: POST
    path: "/blackout-windows"
    description: "schedule an insider-trading blackout window"
    roles: [Administrator]
    code: 201
    input: [cap_table_id, reason, starts_at, ends_at]
    output: BlackoutWindow
    side_effects:
      - "status = SCHEDULED"
      - "reject (ERR_BLACKOUT_OVERLAP) if [starts_at, ends_at) HALF-OPEN-overlaps any SCHEDULED window on the same cap table (adjacency at a shared endpoint does NOT conflict)"
  - method: GET
    path: "/blackout-windows/{id}"
    description: "fetch a blackout window"
    roles: [Administrator, BoardApprover, Auditor, Stakeholder]
    code: 200
    input: []
    output: BlackoutWindow
    side_effects: []
  - method: GET
    path: "/blackout-windows"
    description: "list/filter blackout windows"
    roles: [Administrator, BoardApprover, Auditor, Stakeholder]
    code: 200
    input: ["cap_table_id?", "limit?", "offset?"]
    output: BlackoutWindow[]
    side_effects: []
  - method: POST
    path: "/blackout-windows/{id}/lift"
    description: "lift (cancel) a scheduled blackout window"
    roles: [Administrator]
    code: 200
    input: []
    output: BlackoutWindow
    side_effects: ["SCHEDULED -> LIFTED"]

  # ---- Test-driving clock ----
  - method: POST
    path: "/_clock/set_current_utc"
    description: "set the server's notion of 'now' for vesting/temporal tests"
    roles: [Administrator]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["all vested_share / temporal computations use this clock"]

# =====================================================================
# §1.6 Error Code Catalog
# =====================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "missing/unknown X-User-Role or X-User-ID header"
  - id: ERR_FORBIDDEN
    http: 403
    condition: "role not permitted for this operation per §1.7"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "grant approver is the same user that drafted the grant"
  - id: ERR_NOT_FOUND
    http: 404
    condition: "a referenced id does not resolve to an existing entity"
  - id: ERR_INVALID_STATE
    http: 409
    condition: "entity is not in a state from which the requested transition is legal"
  - id: ERR_TABLE_NOT_OPEN
    http: 409
    condition: "issuance/grant/note-execute attempted on a LOCKED or DISSOLVED cap table"
  - id: ERR_STALE_VERSION
    http: 412
    condition: "expected_<parent>_version does not match the entity's current version (OCC)"
  - id: ERR_VALIDATION
    http: 400
    condition: "malformed body, missing required field, or type/enum violation"
  - id: ERR_409A_NONCOMPLIANT
    http: 422
    condition: "strike_price_cents below the FMV of the EFFECTIVE valuation, or valuation not EFFECTIVE"
  - id: ERR_VALUATION_EXPIRED
    http: 422
    condition: "the valuation backing a grant is past expires_at relative to grant_date"
  - id: ERR_WRONG_CLASS_TYPE
    http: 422
    condition: "grant target class is not COMMON, or note conversion target is not PREFERRED"
  - id: ERR_SENIORITY_CYCLE
    http: 422
    condition: "seniority_below_class_id chain would form a cycle"
  - id: ERR_83B_WINDOW_MISSED
    http: 422
    condition: "83(b) election filed more than 30 days after the exercise (results in REJECTED_LATE)"
  - id: ERR_EXCEEDS_EXERCISABLE
    http: 422
    condition: "exercise share_count exceeds vested (or grantable for early-exercise) shares"
  - id: ERR_POOL_INSUFFICIENT
    http: 422
    condition: "pool available_shares less than grant share_count at approval"
  - id: ERR_AUTHORIZED_EXCEEDED
    http: 422
    condition: "issuance would push issued_shares past CapTable.authorized_shares"
  - id: ERR_GRANT_HAS_EXERCISES
    http: 409
    condition: "cancel attempted on an ACTIVE grant that already has settled exercises"
  - id: ERR_ELECTION_BLOCKS_REVERSE
    http: 409
    condition: "reverse attempted on a SETTLED exercise that an ACCEPTED 83(b) election references"
  - id: ERR_VALUATION_WINDOW_OVERLAP
    http: 409
    condition: "new valuation safe-harbor window CLOSED-overlaps an existing non-superseded valuation window on the same cap table"
  - id: ERR_BLACKOUT_OVERLAP
    http: 409
    condition: "new blackout window HALF-OPEN-overlaps an existing SCHEDULED window on the same cap table"

# =====================================================================
# §1.7 RBAC Matrix
# =====================================================================
roles:
  - name: Administrator
    description: "operations team — creates tables, classes, pools, grants (draft), issuances, notes, processes exercises/elections"
    identity: "opaque"
    exclusive_operations:
      - "POST /cap-tables"
      - "POST /security-classes"
      - "POST /shareholders"
      - "POST /share-issuances"
      - "POST /valuations"
      - "POST /option-pools"
      - "POST /option-grants (draft)"
      - "POST /option-grants/{id}/cancel"
      - "POST /option-grants/{id}/expire"
      - "POST /exercises/{id}/settle"
      - "POST /exercises/{id}/reverse"
      - "POST /exercises/{id}/form-3921"
      - "POST /section-83b-elections/{id}/process"
      - "POST /safe-notes (draft)"
      - "POST /safe-notes/{id}/submit-terms"
      - "POST /safe-notes/{id}/revise"
      - "POST /liquidation-events"
      - "POST /blackout-windows"
      - "POST /blackout-windows/{id}/lift"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "POST /exercises (with Stakeholder)"
      - "POST /section-83b-elections (with Stakeholder)"
      - "all GET reads"
  - name: BoardApprover
    description: "board/legal — approves grants & valuations, locks/unlocks/dissolves table, executes/converts notes, refreshes pools, runs the waterfall"
    identity: "opaque"
    exclusive_operations:
      - "POST /cap-tables/{id}/lock"
      - "POST /cap-tables/{id}/unlock"
      - "POST /cap-tables/{id}/dissolve"
      - "POST /valuations/{id}/approve"
      - "POST /option-grants/{id}/approve"
      - "POST /option-pools/{id}/refresh"
      - "POST /safe-notes/{id}/execute"
      - "POST /safe-notes/{id}/convert"
      - "POST /safe-notes/{id}/repay"
      - "POST /liquidation-events/{id}/compute"
      - "POST /liquidation-events/{id}/recompute"
      - "POST /liquidation-events/{id}/finalize"
    shared_operations:
      - "all GET reads"
  - name: Stakeholder
    description: "a shareholder acting on their own grants — exercises options, files 83(b), reads own holdings"
    identity: "entity_backed:Shareholder"
    exclusive_operations: []
    shared_operations:
      - "POST /exercises (own grants, with Administrator)"
      - "POST /section-83b-elections (own exercises, with Administrator)"
      - "GET reads scoped to own holdings"
  - name: Auditor
    description: "read-only compliance reviewer"
    identity: "opaque"
    exclusive_operations: []
    shared_operations:
      - "all GET reads"
