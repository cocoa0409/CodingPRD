            - "Case.${case_id}.status == FILED in the creation response, the declared initial_state"
            - "DomainName.${dom_id}.lock_status == UNLOCKED in the creation response, the declared initial_state"
            - "DeficiencyNotice.${notice_id}.status == OPEN in the creation response, the declared initial_state"
            - "Case.${case_id}.status == DEFICIENT after the notice lands, so FILED really was the state before the transition and not a coincidence"
            - "Case.${case_id}.closed_at and refiling_bar_until are both null on the freshly filed row"

      - name: verification_cycles_requested_overdue_requested_and_accumulates_escalations
        claim_type: valid_transition
        grounds:
          - state_machines.RegistrarVerification.REQUESTED_to_OVERDUE
          - state_machines.RegistrarVerification.OVERDUE_to_REQUESTED
          - state_machines.RegistrarVerification.OVERDUE_to_RESPONDED
          - endpoints.POST_/udrp/_ops/deadline-sweep
        distinguishing_aspect: "The verification row laps the REQUESTED -> OVERDUE -> REQUESTED cycle twice: escalation_count accumulates to 2 across laps while Registrar.overdue_verification_count oscillates 0 -> 1 -> 0 -> 1 -> 0, and the second lap's due_at is re-anchored on the re-request instant rather than on the original request."
