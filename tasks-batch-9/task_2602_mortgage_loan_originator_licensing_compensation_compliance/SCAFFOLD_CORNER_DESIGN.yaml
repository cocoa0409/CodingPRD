          assert:
            - "${s_st} == SUBMITTED"
            - "HTTP status is 409 on the DRAFT withdrawal"
            - "${err1} == ERR_INVALID_STATE_TRANSITION"
            - "HTTP status is 200 on the SUBMITTED withdrawal"
            - "${s_st2} == WITHDRAWN, ${s_rev} == null, ${s_pub} == null"
            - "HTTP status is 409 on the repeat withdrawal"
            - "${err2} == ERR_ALREADY_TERMINAL"
