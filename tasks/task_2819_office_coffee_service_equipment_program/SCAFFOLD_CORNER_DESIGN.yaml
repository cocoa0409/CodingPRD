        grounds:
          - validations[priority=51]
          - errors[ERR_MISSING_TRANSITION_FIELD]
          - endpoints[POST /ocs/maintenance-work-orders/{work_order_id}/advance]
          - endpoints[POST /ocs/price-adjustments/{adjustment_id}/respond]
        distinguishing_aspect: "parts_eta, resolution_note and dispute_reason are required only for their own target state - AWAITING_PARTS, RESOLVED and DISPUTE respectively - so each is rejected with ERR_MISSING_TRANSITION_FIELD when omitted and the identical call succeeds once supplied, while an ACCEPT disposition needs no extra field at all."
        test_recipe:
          setup:
            - "clock at 2026-08-03T08:00:00Z; MON route; one COFFEE product; model URN-30; one PLACEMENT asset"
            - "one account (program_posture ACTIVE after its placement) with a planned site; one REPAIR work order advanced to IN_PROGRESS; the market index is 2400000 and one PriceAdjustment is PROPOSED"
          setup_api_calls:
            - call: "POST /ocs/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T08:00:00Z" }
              as: ProgramAdmin
            - call: "POST /ocs/routes"
              payload: { name: "Metro MON", service_day: "MON", capacity_minutes: 480, travel_buffer_minutes: 30 }
              as: ProgramAdmin
              captures: { route_id: "$.data.id" }
            - call: "POST /ocs/product-items"
              payload: { sku: "COF-HOUSE-12OZ", category: "COFFEE", base_unit_price_micros: 4500000, pack_units: 6, green_coffee_linked: true }
              as: ProgramAdmin
              captures: { p_cof_id: "$.data.id" }
            - call: "POST /ocs/equipment-models"
              payload: { model_code: "URN-30", brewer_class: "THERMAL", cups_per_hour_capacity: 30, min_headcount: 1, max_headcount: 250, monthly_rent_cents: 4500, descale_interval_days: 90, list_value_cents: 120000 }
              as: ProgramAdmin
              captures: { model_id: "$.data.id" }
            - call: "POST /ocs/equipment-assets"
              payload: { model_id: "${model_id}", serial_number: "URN30-0001", asset_role: "PLACEMENT" }
              as: ProgramAdmin
              captures: { asset_id: "$.data.id" }
            - call: "POST /ocs/accounts"
              payload: { legal_name: "Northgate Holdings LLC", billing_mode: "CONSOLIDATED", green_index_baseline_micros: 2000000, price_protection_days: 90 }
              as: AccountManager
              captures: { acct_id: "$.data.id" }
            - call: "POST /ocs/sites"
              payload: { account_id: "${acct_id}", route_id: "${route_id}", site_name: "HQ Floor 3", headcount: 40, days_per_week: 5, consumption_model: "HEADCOUNT_MODEL", service_minutes_estimate: 45 }
              as: AccountManager
              captures: { site_id: "$.data.id" }
            - call: "POST /ocs/sites/${site_id}/size-and-plan"
              payload: { brew_style: "DRIP" }
              as: AccountManager
              captures: { site_v: "$.data.version" }
            - call: "POST /ocs/equipment-placements"
              payload: { site_id: "${site_id}", asset_id: "${asset_id}", terms_type: "RENTAL", minimum_purchase_cents: 60000, min_term_months: 12, expected_site_version: "${site_v}" }
              as: AccountManager
              captures: { plc_id: "$.data.id" }
            - call: "POST /ocs/maintenance-work-orders"
              payload: { asset_id: "${asset_id}", wo_type: "REPAIR" }
              as: RouteTechnician
              as_user_id: "${route_id}"
              captures: { wo_id: "$.data.id" }
            - call: "POST /ocs/maintenance-work-orders/${wo_id}/advance"
              payload: { to_status: "IN_PROGRESS" }
              as: RouteTechnician
              as_user_id: "${route_id}"
            - call: "POST /ocs/_market/set_green_index"
              payload: { index_micros: 2400000 }
              as: BillingSpecialist
            - call: "POST /ocs/price-adjustments"
              payload: { account_id: "${acct_id}", effective_at: "2026-08-15T00:00:00Z" }
              as: BillingSpecialist
              captures: { adj_id: "$.data.id" }
          trigger:
            - call: "POST /ocs/maintenance-work-orders/${wo_id}/advance"
              payload: { to_status: "AWAITING_PARTS" }
              as: RouteTechnician
              as_user_id: "${route_id}"
              captures: { err_eta: "$.data.error_id" }
            - call: "POST /ocs/maintenance-work-orders/${wo_id}/advance"
              payload: { to_status: "AWAITING_PARTS", parts_eta: "2026-08-06T00:00:00Z" }
              as: RouteTechnician
              as_user_id: "${route_id}"
            - call: "POST /ocs/maintenance-work-orders/${wo_id}/advance"
              payload: { to_status: "IN_PROGRESS" }
              as: RouteTechnician
              as_user_id: "${route_id}"
            - call: "POST /ocs/maintenance-work-orders/${wo_id}/advance"
              payload: { to_status: "RESOLVED" }
              as: RouteTechnician
              as_user_id: "${route_id}"
              captures: { err_note: "$.data.error_id" }
