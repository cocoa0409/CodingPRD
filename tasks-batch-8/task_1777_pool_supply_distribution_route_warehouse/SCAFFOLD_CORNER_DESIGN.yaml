              captures: { o1: $.data.id }
            - call: "POST /pool-supply/orders/${o1}/confirm"
              payload: { expected_branch_version: "${br_v}" }
              as: CounterRep
            - call: "GET /pool-supply/stock-lots/${lot_id}"
              as: WarehouseLead
              captures: { lot_v_stale: $.data.version }
            - call: "POST /pool-supply/stock-lots/${lot_id}/replenish"
              payload: { add_qty: 6 }
              as: WarehouseLead
            - call: "POST /pool-supply/orders"
              payload: { branch_id: "${br_id}", account_id: "${acct_id}", channel: "WILL_CALL", requested_pickup_slot: "2026-08-01T14:00:00Z", lines: [ { product_id: "${prod_id}", qty: 3 } ] }
