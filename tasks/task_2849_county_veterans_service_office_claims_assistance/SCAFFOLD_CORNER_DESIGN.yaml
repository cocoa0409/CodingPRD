              payload: { full_name: "Alex Rivera", date_of_birth: "1979-03-04", service_start_date: "2001-09-11", service_end_date: "2005-09-10", household_income_cents: 1500000, net_worth_cents: 2000000, dependent_count: 2, homeless_status: "NOT_HOMELESS", referral_source: "WALK_IN" }
              as: IntakeClerk
              captures: { vet: $.data.id }
            - call: "POST /cvso/veterans/${vet}/discharge-documents"
              payload: { document_type: "DD214", source: "VETERAN_PROVIDED", claimed_service_start: "2001-09-11", claimed_service_end: "2005-09-10", claimed_character_of_service: "HONORABLE" }
              as: IntakeClerk
              captures: { doc: $.data.id }
            - call: "POST /cvso/discharge-documents/${doc}/review"
              payload: { action: "VERIFY" }
              as: CountyOfficer
              as_user_id: "${rep_a}"
            - call: "POST /cvso/powers-of-attorney"
              payload: { veteran_id: "${vet}", representative_id: "${rep_b}", form_type: "VA_21_22", scope: "ALL_BENEFITS", executed_on: "2026-08-01" }
              as: IntakeClerk
              captures: { poa: $.data.id }
            - call: "GET /cvso/veterans/${vet}"
              payload: {}
              as: IntakeClerk
              captures: { vet_v: $.data.version }
            - call: "POST /cvso/powers-of-attorney/${poa}/accept"
              payload: { expected_veteran_version: "${vet_v}" }
              as: VeteranClient
              as_user_id: "${vet}"
            - call: "POST /cvso/claims"
              payload: { veteran_id: "${vet}", poa_id: "${poa}", claim_type: "DISABILITY_COMPENSATION", claimed_conditions: ["tinnitus"] }
              as: CountyOfficer
              as_user_id: "${rep_a}"
              captures: { claim: $.data.id, preparer: $.data.prepared_by_representative_id }
            - call: "POST /cvso/claims/${claim}/transitions"
              payload: { action: "OPEN_EVIDENCE_DEVELOPMENT" }
              as: CountyOfficer
              as_user_id: "${rep_a}"
          trigger:
            - call: "POST /cvso/claims/${claim}/transitions"
              payload: { action: "SUBMIT_FOR_REVIEW", reviewer_representative_id: "${rep_b}" }
              as: CountyOfficer
              as_user_id: "${rep_a}"
              captures: { err: $.data.error_id }
            - call: "POST /cvso/claims/${claim}/transitions"
              payload: { action: "SUBMIT_FOR_REVIEW", reviewer_representative_id: "${rep_c}" }
              as: CountyOfficer
              as_user_id: "${rep_a}"
              captures: { cstatus: $.data.status, reviewer: $.data.peer_reviewed_by_representative_id }
          assert:
            - "${preparer} == ${rep_a}"
            - "PowerOfAttorney.${poa}.representative_id == ${rep_b}"
            - "${err} == ERR_REVIEWER_IS_DESIGNATED_REPRESENTATIVE"
            - "HTTP status of the first trigger call == 409"
            - "Claim.${claim}.status == EVIDENCE_DEVELOPMENT immediately after the refusal and peer_reviewed_by_representative_id is null"
            - "${cstatus} == PEER_REVIEW"
            - "${reviewer} == ${rep_c}"

      - name: corner_segregation_of_duties_on_a_peer_review_nomination
        claim_type: error_triggerable
        grounds:
          - validations[priority=50]
          - errors[ERR_SEGREGATION_OF_DUTIES]
        distinguishing_aspect: "Nominating the claim's own preparer as its peer reviewer must return ERR_SEGREGATION_OF_DUTIES (409) and not the designee code at priority 62."
        excluded_because:
          difficulty_instance: submit_for_review_naming_preparer_who_is_also_designee_returns_segregation_of_duties
          rationale: "That instance constructs the case where the preparer is also the designated representative, so both priority 50 and priority 62 are violated by one request, and asserts that the returned code is ERR_SEGREGATION_OF_DUTIES and not ERR_REVIEWER_IS_DESIGNATED_REPRESENTATIVE - a strictly stronger check than triggering priority 50 alone."

      - name: corner_appointment_may_not_be_booked_into_the_past
        claim_type: error_triggerable
        grounds:
          - validations[priority=56]
          - errors[ERR_APPOINTMENT_IN_PAST]
        distinguishing_aspect: "A booking whose starts_at is earlier than the logical-clock instant must return ERR_APPOINTMENT_IN_PAST (409)."
        excluded_because:
          difficulty_instance: booking_past_appointment_into_full_site_returns_appointment_in_past
          rationale: "That instance sends one request that violates both the temporal rule at priority 56 and the capacity rule at priority 66 and asserts the temporal code wins, which triggers ERR_APPOINTMENT_IN_PAST while additionally pinning its precedence."

      - name: corner_mark_ready_requires_the_completeness_threshold
        claim_type: error_triggerable
        grounds:
          - validations[priority=65]
          - errors[ERR_EVIDENCE_INCOMPLETE]
        distinguishing_aspect: "MARK_READY on a claim whose evidence_completeness_pct is below EVIDENCE_READY_THRESHOLD_PCT must return ERR_EVIDENCE_INCOMPLETE (409)."
        excluded_because:
          difficulty_instance: evidence_completeness_exactly_at_threshold_marks_ready_while_one_late_item_is_rejected
          rationale: "That instance pairs an evidence set scoring exactly 80.00, which is admitted, with the same set whose second item arrives late and scores 78.71, which is refused with ERR_EVIDENCE_INCOMPLETE, so the error is triggered at the tightest possible boundary."

      - name: corner_exam_site_capacity_ceiling_is_enforced
        claim_type: error_triggerable
        grounds:
          - validations[priority=66]
          - errors[ERR_EXAM_SITE_CAPACITY_EXCEEDED]
        distinguishing_aspect: "A booking that would raise the number of overlapping blocks at a site to its concurrent_capacity must return ERR_EXAM_SITE_CAPACITY_EXCEEDED (409)."
        excluded_because:
          difficulty_instance: exam_site_admits_touching_block_then_rejects_the_one_that_makes_three_concurrent
          rationale: "That instance admits the block that merely touches the buffered boundary and then refuses the block that makes three concurrent examinations at a capacity-2 site, so the error is triggered exactly one minute inside the boundary rather than deep inside the conflict region."

      - name: corner_representative_travel_conflict_is_enforced
        claim_type: error_triggerable
        grounds:
          - validations[priority=67]
          - errors[ERR_REPRESENTATIVE_TRAVEL_CONFLICT]
        distinguishing_aspect: "A second outreach event for the same representative inside the travel buffer must return ERR_REPRESENTATIVE_TRAVEL_CONFLICT (409)."
        excluded_because:
          difficulty_instance: outreach_accepts_exactly_sixty_minute_gap_and_rejects_fifty_nine_minute_gap
          rationale: "That instance accepts the event separated by exactly the symmetric 60-minute travel allowance and refuses the one separated by 59 minutes, which triggers the error at the boundary and additionally pins the buffer arithmetic."

      - name: corner_program_rating_floor_is_enforced_at_approval
        claim_type: error_triggerable
        grounds:
          - validations[priority=74]
          - errors[ERR_PROGRAM_MIN_RATING_NOT_MET]
        distinguishing_aspect: "APPROVE on an application whose veteran's combined_rating_pct is below the program's min_rating_pct must return ERR_PROGRAM_MIN_RATING_NOT_MET (409)."
        excluded_because:
          difficulty_instance: benefit_approval_unblocked_only_after_a_second_decision_lifts_the_veteran_combined_rating
          rationale: "That instance triggers the refusal, then adds a second granted decision that lifts the combined rating across the floor and shows the identical APPROVE succeeding, so it covers the error plus the cross-entity dependency that clears it."

      - name: corner_program_pool_ceiling_is_enforced_at_approval
        claim_type: error_triggerable
        grounds:
          - validations[priority=76]
          - errors[ERR_PROGRAM_POOL_EXHAUSTED]
        distinguishing_aspect: "An approval whose award would push StateProgram.allocated_cents past annual_pool_cents must return ERR_PROGRAM_POOL_EXHAUSTED (409)."
        excluded_because:
          difficulty_instance: approval_filling_program_pool_to_the_cent_succeeds_while_one_cent_short_is_rejected
          rationale: "That instance approves the application that fills the pool to the exact cent and then refuses the next one by a single cent, triggering the error at the inclusive boundary of the <= comparison."

  # ===================================================================
  # RBAC - per-role exclusive operations, cross-role denial and the
  # segregation-of-duties role model.
  # ===================================================================
  - section: rbac
    instances:
      - name: corner_system_admin_exclusive_configuration_is_denied_to_every_other_role
        claim_type: role_permission
        grounds:
          - roles.SystemAdmin
          - validations[priority=3]
          - errors[ERR_UNAUTHORIZED]
          - endpoints[POST /cvso/representatives]
          - endpoints[POST /cvso/exam-sites]
          - endpoints[POST /cvso/state-programs]
        distinguishing_aspect: "Three registry-owning operations reserved to SystemAdmin - creating a representative, an examination site and a state program - each return ERR_UNAUTHORIZED (403) for IntakeClerk, CountyOfficer and StateAuditor respectively, and all three succeed for SystemAdmin against the same payloads."
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z and an otherwise empty database."
          setup_api_calls:
            - call: "POST /cvso/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
          trigger:
            - call: "POST /cvso/representatives"
              payload: { full_name: "Dana Reyes", accreditation_number: "ACC-2849-771", accreditation_type: "COUNTY_CVSO", accreditation_expires_on: "2029-12-31" }
              as: IntakeClerk
              captures: { e_rep: $.data.error_id }
            - call: "POST /cvso/exam-sites"
              payload: { name: "County Contract Clinic", county_code: "CTY-01", concurrent_capacity: 2, buffer_minutes: 15 }
              as: StateAuditor
              captures: { e_site: $.data.error_id }
            - call: "POST /cvso/state-programs"
              payload: { program_code: "PTX-2026-E", program_name: "County Property Tax Exemption", program_type: "PROPERTY_TAX_EXEMPTION", fiscal_year: 2026, annual_pool_cents: 100000000, min_rating_pct: 0, requires_wartime: false, max_award_cents: 10000000 }
              as: StateAuditor
              captures: { e_prog: $.data.error_id }
            - call: "POST /cvso/representatives"
              payload: { full_name: "Dana Reyes", accreditation_number: "ACC-2849-771", accreditation_type: "COUNTY_CVSO", accreditation_expires_on: "2029-12-31" }
              as: SystemAdmin
              captures: { rep_a: $.data.id }
            - call: "POST /cvso/exam-sites"
              payload: { name: "County Contract Clinic", county_code: "CTY-01", concurrent_capacity: 2, buffer_minutes: 15 }
              as: SystemAdmin
              captures: { site: $.data.id }
            - call: "POST /cvso/state-programs"
              payload: { program_code: "PTX-2026-E", program_name: "County Property Tax Exemption", program_type: "PROPERTY_TAX_EXEMPTION", fiscal_year: 2026, annual_pool_cents: 100000000, min_rating_pct: 0, requires_wartime: false, max_award_cents: 10000000 }
              as: SystemAdmin
              captures: { prog: $.data.id }
          assert:
            - "${e_rep} == ERR_UNAUTHORIZED"
            - "${e_site} == ERR_UNAUTHORIZED"
            - "${e_prog} == ERR_UNAUTHORIZED"
            - "HTTP status of all three refusals == 403"
