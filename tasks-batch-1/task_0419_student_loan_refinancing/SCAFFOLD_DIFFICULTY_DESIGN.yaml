  # =========================================================================
  # Rule 5 — Validation priority conflicts across different error-category pairs
  # =========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_before_segregation_on_disbursement_send
        grounds:
          - validations[priority=4]
          - validations[priority=6]
          - state_machines.Disbursement.SCHEDULED_to_SENT
        distinguishing_aspect: |
          Pair (state priority 4, ERR_INVALID_STATE) vs (business_safety priority 6, ERR_SEGREGATION_OF_DUTIES):
          a CONFIRMED disbursement sent by the approving underwriter's officer id fails the state check FIRST
          (returns ERR_INVALID_STATE, not ERR_SEGREGATION_OF_DUTIES), proving state precedence over safety.
        test_recipe:
          setup:
            - "A Disbursement already CONFIRMED on a funded loan; the officer's id equals the approving underwriter id."
          setup_api_calls:
            - call: "POST /rate-grid-entries"
              payload: { rate_type: "FIXED", term_months: 120, min_fico_band: "NEAR_PRIME", base_apr_bps: 650, index_apr_bps: 0 }
              as: PlatformAdmin
            - call: "POST /abs-pools"
              payload: { pool_code: "POOL-P5", max_principal_cents: 20000000, min_fico_band: "SUBPRIME", allowed_rate_type: "ANY" }
              as: PlatformAdmin
            - call: "POST /borrowers"
              payload: { email: "b9@x.com", full_name: "B Nine", annual_income_cents: 12000000, fico_band: "PRIME" }
              as: Borrower
              captures: { b9_id: $.data.id }
            - call: "POST /applications"
              payload: { borrower_id: "${b9_id}", requested_principal_cents: 5000000, requested_term_months: 120, requested_rate_type: "FIXED" }
              as: Borrower
              as_user_id: "${b9_id}"
              captures: { app9_id: $.data.id, app9_ver: $.data.version }
            - call: "POST /applications/${app9_id}/prequalify"
              payload: {}
              as: Borrower
              as_user_id: "${b9_id}"
            - call: "GET /offers"
              payload: { application_id: "${app9_id}" }
              as: Borrower
              as_user_id: "${b9_id}"
              captures: { offer9_id: "$.data[0].id"}
            - call: "POST /offers/${offer9_id}/lock"
              payload: { expected_application_version: "${app9_ver}", autopay_elected: true }
              as: Borrower
              as_user_id: "${b9_id}"
            - call: "POST /applications/${app9_id}/approve"
              payload: {}
              as: Underwriter
              as_user_id: "uw-shared"
            - call: "POST /applications/${app9_id}/fund"
              payload: {}
              as: DisbursementOfficer
              as_user_id: "do-5"
              captures: { loan9_id: $.data.id }
            - call: "POST /disbursements"
              payload: { loan_id: "${loan9_id}", prior_servicer_name: "Old Servicer", payoff_amount_cents: 3000000 }
              as: DisbursementOfficer
              as_user_id: "do-5"
              captures: { disb9_id: $.data.id }
            - call: "POST /disbursements/${disb9_id}/send"
              payload: {}
              as: DisbursementOfficer
              as_user_id: "do-5"
            - call: "POST /disbursements/${disb9_id}/confirm"
              payload: {}
              as: DisbursementOfficer
              as_user_id: "do-5"
          trigger:
            - call: "POST /disbursements/${disb9_id}/send"
              payload: {}
              as: DisbursementOfficer
              as_user_id: "uw-shared"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_STATE (state priority 4 wins over segregation priority 6)"
            - "HTTP status == 409"

      - name: not_found_before_dti_on_approve
        grounds:
          - validations[priority=3]
          - validations[priority=12]
          - state_machines.Application.UNDER_REVIEW_to_APPROVED
        distinguishing_aspect: |
          Pair (existence priority 3, ERR_NOT_FOUND) vs (business_fiscal priority 12, ERR_DTI_EXCEEDED):
          approving a non-existent application id returns ERR_NOT_FOUND, never ERR_DTI_EXCEEDED, proving
          existence precedence over fiscal — a different category pair than instance 1.
        test_recipe:
          setup:
            - "No application with the queried id exists (empty DB except an underwriter actor)."
          setup_api_calls: []
          trigger:
            - call: "POST /applications/00000000-0000-4000-8000-000000000000/approve"
              payload: {}
              as: Underwriter
              as_user_id: "uw-9"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_NOT_FOUND (existence priority 3 wins over fiscal priority 12)"
            - "HTTP status == 404"

