      - name: commitment_breach_cascade_fails_the_save_play_and_debits_health
        grounds:
          - state_machines.RemediationCommitment.ACCEPTED_to_BREACHED
          - state_machines.EscalationCase.COMMITTED_to_DISPUTED
          - state_machines.SavePlay.ACTIVE_to_FAILED
          - calculations.account_health_score
          - calculations.coverage_posture_derivation
