  # =========================================================================
  # Guide section 5 — From Table 5 (Endpoints)
  # =========================================================================
  - section: endpoints
    instances:
      - name: property_patch_rewrites_baselines_and_bumps_version
        claim_type: standard_crud
        grounds:
          - endpoints["PATCH /pip/properties/{id}"]
          - calculations.displacement_revenue_impact
          - concurrency_rules["draw-create-stale-property"]
        distinguishing_aspect: "The partial update rewrites only the supplied baselines, increments Property.version, and is read by later displacement projections: the same ten-key, ten-night phase that would have projected 882000 under the old baselines projects 1120000 under the new ones."
        test_recipe:
          setup:
            - "One 200-key property at ADR 18000 / occupancy 0.70 with an acknowledged plan carrying one GUEST_FACING item of 700000 cents."
          setup_api_calls:
            - call: "POST /pip/franchisee-accounts"
              payload: { legal_name: "Ashcombe Hotels LLC", contact_email: "ops@ashcombeh.example" }
              as: BrandManager
              as_user_id: "bm-001"
              captures: { fr_id: $.data.id }
            - call: "POST /pip/properties"
              payload: { franchisee_id: "${fr_id}", brand_code: "HRB", name: "Ashcombe Kings Wharf", room_count: 200, adr_baseline_cents: 18000, occupancy_baseline_pct: 0.70, reserve_balance_cents: 50000000, minimum_retention_cents: 5000000 }
              as: BrandManager
              as_user_id: "bm-001"
              captures: { prop_id: $.data.id, prop_v0: $.data.version }
            - call: "POST /pip/plans"
              payload: { property_id: "${prop_id}", trigger_type: "POST_INSPECTION", standards_edition: "2026.1" }
              as: BrandManager
              as_user_id: "bm-001"
              captures: { plan_id: $.data.id }
            - call: "POST /pip/items"
              payload: { plan_id: "${plan_id}", category: "GUEST_FACING", standards_reference: "GF-24.1.1", brand_estimated_cost_cents: 700000, room_impacting: false, rooms_affected_count: 0 }
              as: BrandManager
              as_user_id: "bm-001"
            - call: "POST /pip/plans/${plan_id}/issue"
              payload: {}
              as: BrandManager
              as_user_id: "bm-001"
            - call: "POST /pip/plans/${plan_id}/acknowledge"
              payload: {}
              as: FranchiseeOwner
              as_user_id: "${fr_id}"
          trigger:
            - call: "PATCH /pip/properties/${prop_id}"
              payload: { adr_baseline_cents: 20000, occupancy_baseline_pct: 0.80, room_count: 250 }
              as: BrandManager
              as_user_id: "bm-001"
              captures: { prop_v1: $.data.version }
            - call: "GET /pip/properties/${prop_id}"
              as: FranchiseeOwner
              as_user_id: "${fr_id}"
            - call: "POST /pip/renovation-phases"
              payload: { plan_id: "${plan_id}", phase_number: 1, start_date: "2026-09-01", end_date: "2026-09-10", rooms_out_of_service: 10 }
              as: FranchiseeOwner
              as_user_id: "${fr_id}"
              captures: { phase_id: $.data.id }
          assert:
            - "the PATCH returns 200 with adr_baseline_cents == 20000, occupancy_baseline_pct == 0.80, room_count == 250"
            - "Property.${prop_id}.minimum_retention_cents == 5000000 (an omitted field is left alone, not nulled)"
            - "Property.${prop_id}.reserve_balance_cents == 50000000 and initial_reserve_balance_cents == 50000000"
            - "${prop_v1} == ${prop_v0} + 1"
            - "the GET returns exactly the PATCHed values, so the write is durable"
            - "RenovationPhase.${phase_id}.displacement_revenue_impact_cents == 1120000 (100 room-nights x 20000 x 0.80 = 1600000 gross, then the 0.30 recapture at ratio 10/250)"

