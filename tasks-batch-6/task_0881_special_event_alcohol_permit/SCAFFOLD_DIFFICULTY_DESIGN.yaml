            - { call: "POST /permits/inspections", payload: { application_id: "${a}", inspector_id: "${insp}", scheduled_start: "2026-06-14T10:00:00Z", scheduled_end: "2026-06-14T11:00:00Z" }, as: PermitClerk, captures: { inspn: $.data.id } }
          trigger:
            - { call: "POST /permits/violations", payload: { inspection_id: "${inspn}", severity: "MINOR", description: "Signage missing" }, as: Inspector, as_user_id: "${insp}", captures: { vio: $.data.id } }
            - { call: "POST /permits/violations/${vio}/contest", payload: {}, as: Applicant }
            - { call: "POST /permits/violations/${vio}/resolve", payload: { decision: "DISMISSED" }, as: PermitClerk }
          assert:
