          setup:
            - "A PUBLISHED rule set RS-C59 {ascription 60, invalid_tuning_max_minutes 900, outlier_household_minutes_cap 1200, outlier_weight_ratio_cap 2.5, fault_missing_minutes_threshold 1440}."
