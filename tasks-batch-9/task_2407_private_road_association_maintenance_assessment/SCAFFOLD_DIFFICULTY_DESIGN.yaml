              captures: { standing_error: "$.data.error_id" }
          assert:
            - "the tally at 2026-10-06 returned the proposal with status DRAFT, failed_tally_count 1, counted_weight_total 0 and balloting_closes_at null"
            - "the NOTICE initiation left the charge DELINQUENT and the member standing_status DELINQUENT with access_status UNRESTRICTED (no effectuation yet)"
            - "the first cast returns HTTP 409 with error_id ERR_PROPOSAL_NOT_BALLOTING, the priority-19 error, not ERR_MEMBER_NOT_IN_GOOD_STANDING"
            - "no Ballot row is created by the rejected cast: the proposal still reads counted_weight_total 0"
            - "after re-opening balloting the proposal reads status BALLOTING with eligible_weight_total 1, because a DELINQUENT member is still in the eligible set snapshot"
            - "the second cast returns HTTP 409 with error_id ERR_MEMBER_NOT_IN_GOOD_STANDING, the priority-51 error, proving priority 19 masked it on the first call"
            - "counted_weight_total is still 0 and quorum_met is false after both rejected casts"

      - name: access_safety_error_outranks_restriction_balance_minimum_error
        grounds:
          - "validations[priority=28]"
          - "validations[priority=54]"
          - "endpoints[POST /delinquency-actions/{action_id}/effectuate]"
          - "calculations.emergency_access_grade_evaluation"
        distinguishing_aspect: >
          One effectuation of an ACCESS_RESTRICTION violates priority 28
          (segment must be COMPLIANT, ERR_EMERGENCY_ACCESS_DEFICIENT) and
          priority 54 (charge.balance_cents >= 50000,
          ERR_BALANCE_BELOW_RESTRICTION_MINIMUM) simultaneously, and must answer
          the safety error. The trap is that the balance test is a one-line
          numeric comparison on the charge already loaded from the action, while
          the grade test requires walking action -> charge -> parcel -> segment,
          so a cheap-checks-first implementation returns
          ERR_BALANCE_BELOW_RESTRICTION_MINIMUM. A follow-up COMPLIANT
          re-inspection clears only the priority-28 violation, after which the
          identical call must return ERR_BALANCE_BELOW_RESTRICTION_MINIMUM,
          pinning the order rather than the mere existence of one rule.
        test_recipe:
          setup: |
            Build SINGLE_4M with the charge at 1600000. Advance the clock to
            2026-12-15 and initiate an ACCESS_RESTRICTION for
            [2027-01-05, 2027-01-10) as bt-user-1, which computes restriction_days
            5 and drives the charge to DELINQUENT. Take a 1560000 payment from
            the clerk, leaving balance_cents 40000 — below the 50000 restriction
            minimum but still greater than zero, so priority 47's collectibility
            check passes. Then post an inspection measuring max_grade_pct 14
            against MAX_GRADE_PCT 12, which makes the segment DEFICIENT. The
            still-INITIATED action now trips both rules.
