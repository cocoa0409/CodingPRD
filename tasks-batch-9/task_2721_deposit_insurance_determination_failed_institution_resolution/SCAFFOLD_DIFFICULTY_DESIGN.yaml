              as_user_id: "agent-001"
          trigger:
            - call: "POST /insurance-determinations/${ivan_det_id}/certify"
              payload: {}
              as: ClaimsCertifier
              as_user_id: "certifier-001"
            - call: "POST /insurance-determinations/${jia_det_id}/certify"
              payload: {}
              as: ClaimsCertifier
              as_user_id: "certifier-001"
            - call: "POST /insurance-determinations/${kian_det_id}/certify"
              payload: {}
              as: ClaimsCertifier
              as_user_id: "certifier-001"
          assert:
            - "below the cap: trigger[0] response data.insured_amount_cents == 24999999 and data.uninsured_amount_cents == 0"
            - "AT the cap: trigger[1] response data.insured_amount_cents == 25000000 and data.uninsured_amount_cents == 0 — equality is fully insured, not one cent uninsured"
            - "above the cap: trigger[2] response data.insured_amount_cents == 25000000 and data.uninsured_amount_cents == 1"
            - "DepositAccount.${i1_id}.hold_status == NONE and held_amount_cents == 0; DepositAccount.${j1_id}.hold_status == NONE and held_amount_cents == 0; DepositAccount.${k1_id}.hold_status == HELD and held_amount_cents == 1"
            - "GET /receivership-certificates with depositor_record_id == ${ivan_id} returns total_count == 0 and with depositor_record_id == ${jia_id} returns total_count == 0 — the conditional cascade skipped L3/L4 for both"
            - "GET /receivership-certificates with depositor_record_id == ${kian_id} returns total_count == 1 with face_amount_cents == 1 and status == ISSUED"
            - "DepositorRecord.${ivan_id}.notice_template_code == FULLY_INSURED, DepositorRecord.${jia_id}.notice_template_code == FULLY_INSURED, DepositorRecord.${kian_id}.notice_template_code == PARTIALLY_UNINSURED; all three notice_status == SENT (L5 always runs)"
            - "Institution.${inst9_id}.aggregate_insured_cents == 74999999, aggregate_certificate_face_cents == 1, uninsured_claim_count == 1, total_deposit_balance_cents == 75000000"
            - "GET /institutions/${inst9_id}/insurance-summary returns data.conservation_delta_cents == 0"

      - name: award_rejects_bid_whose_cost_equals_liquidation_baseline
        grounds:
          - endpoints[POST /institutions/{id}/least-cost-test/award]
          - calculations.liquidation_baseline_cost
          - state_machines.Institution.EVALUATED_to_FAILED_ALL_BIDS
          - state_machines.Bid.CONFORMING_to_REJECTED
        distinguishing_aspect: |
          A DIFFERENT metric (evaluated_cost_cents versus liquidation_baseline_cents) on a DIFFERENT
          endpoint (least-cost-test/award, not certify). The comparison is strict: at exact equality
          (15150000 == 15150000) the bid is NOT least-costly, so the award must fall through to
          FAILED_ALL_BIDS / DEPOSIT_PAYOFF and write PAID_OUT on the accounts. An implementation using
          <= would award the bid, name it WINNER, set resolution_method WHOLE_BANK_PA and write
          TRANSFERRED — every one of those is asserted absent.
        test_recipe:
          setup:
            - "Institution 34577 has book_asset_value_cents 10000000 and estimated_liquidation_recovery_cents 10000000; depositor Jonas owns one SINGLE account of exactly 25000000 cents, so total_deposit_balance_cents == 25000000."
