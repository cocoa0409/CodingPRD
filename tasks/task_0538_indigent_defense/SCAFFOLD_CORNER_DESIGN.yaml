# =============================================================================
# 1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Breadth probe across the claim-extraction taxonomy; §1.8 depth is stubbed out.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: create_case_returns_201_with_system_fields
        claim_type: Creation
        grounds: [entities.Case.fields.status, entities.Case.fields.eligibility_status]
        distinguishing_aspect: "POST /cases returns 201 with server-minted id (bare UUID, no prefix), created_at, version==1, status REFERRED, eligibility_status PENDING, case_weight 0."
        test_recipe:
          setup: ["An office exists."]
          setup_api_calls:
            - { call: "POST /defender-offices", payload: { name: "PD-E1", annual_voucher_budget_cents: 100000000, recoupment_basis: "SCHEDULE" }, as: SupervisingAttorney, captures: { off: $.data.id } }
          trigger:
            - { call: "POST /cases", payload: { office_id: "${off}", defendant_name: "New", charge_class: "FELONY_B" }, as: IntakeClerk, captures: { c: $.data.id, ver: $.data.version } }
          assert:
            - "HTTP 201; Case.${c}.status == REFERRED, eligibility_status == PENDING, case_weight == 0, version == 1"

      - name: get_case_not_found_returns_404
        claim_type: Not Found
        grounds: ["errors[ERR_CASE_NOT_FOUND]"]
        distinguishing_aspect: "GET /cases/{unknown-uuid} returns 404 ERR_CASE_NOT_FOUND."
        test_recipe:
          setup: ["Empty DB acceptable."]
          setup_api_calls: []
          trigger:
            - { call: "GET /cases/00000000-0000-0000-0000-000000000000", payload: {}, as: IntakeClerk, captures: { err: $.data.error_id } }
          assert:
            - "HTTP 404 and data.error_id == ERR_CASE_NOT_FOUND"

      - name: list_cases_by_office_paginated
        claim_type: Listing
        grounds: [entities.Case.fields.office_id]
        distinguishing_aspect: "GET /cases?office_id=... returns an array envelope with pagination fields total_count and has_more."
        test_recipe:
          setup: ["Office with two cases."]
          setup_api_calls:
            - { call: "POST /defender-offices", payload: { name: "PD-E2", annual_voucher_budget_cents: 100000000, recoupment_basis: "SCHEDULE" }, as: SupervisingAttorney, captures: { off: $.data.id } }
            - { call: "POST /cases", payload: { office_id: "${off}", defendant_name: "L1", charge_class: "MISDEMEANOR" }, as: IntakeClerk }
            - { call: "POST /cases", payload: { office_id: "${off}", defendant_name: "L2", charge_class: "MISDEMEANOR" }, as: IntakeClerk }
          trigger:
            - { call: "GET /cases?office_id=${off}&limit=1&offset=0", payload: {}, as: IntakeClerk, captures: { first: "$.data[0].id" } }
          assert:
            - "response_type == array; meta.total_count == 2; has_more == true; data length == 1"

      - name: create_case_missing_charge_class_returns_invalid_request
        claim_type: Required Fields
        grounds: ["errors[ERR_VALIDATION]", entities.Case.fields.charge_class]
        distinguishing_aspect: "POST /cases without charge_class returns 400 ERR_VALIDATION."
        test_recipe:
          setup: ["Office exists."]
          setup_api_calls:
            - { call: "POST /defender-offices", payload: { name: "PD-E3", annual_voucher_budget_cents: 100000000, recoupment_basis: "SCHEDULE" }, as: SupervisingAttorney, captures: { off: $.data.id } }
          trigger:
            - { call: "POST /cases", payload: { office_id: "${off}", defendant_name: "NoClass" }, as: IntakeClerk, captures: { err: $.data.error_id } }
          assert:
            - "HTTP 400 and data.error_id == ERR_VALIDATION"

      - name: office_recoupment_basis_default_applied
        claim_type: Defaults
        grounds: [entities.DefenderOffice.fields.recoupment_basis]
        distinguishing_aspect: "POST /defender-offices omitting recoupment_basis applies default SCHEDULE."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - { call: "POST /defender-offices", payload: { name: "PD-Def", annual_voucher_budget_cents: 100000000 }, as: SupervisingAttorney, captures: { off: $.data.id, rb: $.data.recoupment_basis } }
          assert:
            - "DefenderOffice.${off}.recoupment_basis == SCHEDULE"

      - name: attorney_computed_defaults_on_create
        claim_type: Computed Fields
        grounds: [entities.Attorney.fields.current_weighted_load, entities.Attorney.fields.status]
        distinguishing_aspect: "POST /attorneys returns current_weighted_load == 0 and status == ACTIVE regardless of any client-supplied values for those fields."
        test_recipe:
          setup: ["Office exists."]
          setup_api_calls:
            - { call: "POST /defender-offices", payload: { name: "PD-E4", annual_voucher_budget_cents: 100000000, recoupment_basis: "SCHEDULE" }, as: SupervisingAttorney, captures: { off: $.data.id } }
          trigger:
            - { call: "POST /attorneys", payload: { office_id: "${off}", name: "Zed", attorney_type: "STAFF", bar_number: "Z1", hourly_rate_cents: 15000, max_weighted_caseload: 8.0 }, as: SupervisingAttorney, captures: { att: $.data.id, load: $.data.current_weighted_load, st: $.data.status } }
          assert:
            - "Attorney.${att}.current_weighted_load == 0 and status == ACTIVE"

      - name: courtroom_immutable_has_no_version
        claim_type: Immutability
        grounds: [entities.Courtroom.fields.name]
        distinguishing_aspect: "Courtroom is common_fields:false — its create response carries id and created_at but no version and no update endpoint exists."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - { call: "POST /courtrooms", payload: { name: "Dept 4", courthouse: "Main" }, as: SupervisingAttorney, captures: { room: $.data.id } }
          assert:
            - "HTTP 201; Courtroom.${room} response includes id and created_at and has no version field"

      - name: create_attorney_unknown_office_returns_not_found
        claim_type: Parent Relationships
        grounds: [entities.Attorney.fields.office_id, "errors[ERR_OFFICE_NOT_FOUND]"]
        distinguishing_aspect: "POST /attorneys with a non-existent office_id returns 404 ERR_OFFICE_NOT_FOUND (FK integrity)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - { call: "POST /attorneys", payload: { office_id: "00000000-0000-0000-0000-000000000000", name: "Nul", attorney_type: "PANEL", bar_number: "N1", hourly_rate_cents: 15000, max_weighted_caseload: 5.0 }, as: SupervisingAttorney, captures: { err: $.data.error_id } }
          assert:
            - "HTTP 404 and data.error_id == ERR_OFFICE_NOT_FOUND"

      - name: create_case_invalid_charge_class_enum_rejected
        claim_type: Type Constraints
        grounds: [entities.Case.fields.charge_class, "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "POST /cases with charge_class not in the declared enum returns 400 ERR_VALIDATION."
        test_recipe:
          setup: ["Office exists."]
          setup_api_calls:
            - { call: "POST /defender-offices", payload: { name: "PD-E5", annual_voucher_budget_cents: 100000000, recoupment_basis: "SCHEDULE" }, as: SupervisingAttorney, captures: { off: $.data.id } }
          trigger:
            - { call: "POST /cases", payload: { office_id: "${off}", defendant_name: "Bad", charge_class: "TRAFFIC" }, as: IntakeClerk, captures: { err: $.data.error_id } }
          assert:
            - "HTTP 400 and data.error_id == ERR_VALIDATION"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: vacate_court_event_twice_invalid_transition
        claim_type: Invalid Transitions
        grounds: [state_machines.CourtEvent.SCHEDULED_to_VACATED, "errors[ERR_COURT_EVENT_NOT_SCHEDULED]"]
        distinguishing_aspect: "Vacating an already-VACATED court event returns 409 ERR_COURT_EVENT_NOT_SCHEDULED (terminal-state lockdown)."
        test_recipe:
          setup: ["Assigned case with a scheduled event, already vacated once."]
          setup_api_calls:
            - { call: "POST /defender-offices", payload: { name: "PD-S1", annual_voucher_budget_cents: 100000000, recoupment_basis: "SCHEDULE" }, as: SupervisingAttorney, captures: { off: $.data.id } }
            - { call: "POST /attorneys", payload: { office_id: "${off}", name: "Sa", attorney_type: "STAFF", bar_number: "S1", hourly_rate_cents: 15000, max_weighted_caseload: 10.0 }, as: SupervisingAttorney, captures: { att: $.data.id } }
            - { call: "POST /courtrooms", payload: { name: "Dept 2", courthouse: "Main" }, as: SupervisingAttorney, captures: { room: $.data.id } }
            - { call: "POST /cases", payload: { office_id: "${off}", defendant_name: "Sv", charge_class: "MISDEMEANOR" }, as: IntakeClerk, captures: { c: $.data.id } }
            - { call: "POST /financial-screenings", payload: { case_id: "${c}", household_income_cents: 800000, household_size: 2, asset_value_cents: 0 }, as: IntakeClerk, captures: { scr: $.data.id } }
            - { call: "POST /financial-screenings/${scr}/decide", payload: {}, as: ScreeningOfficer, as_user_id: "officer-1" }
            - { call: "POST /conflict-checks", payload: { case_id: "${c}", attorney_id: "${att}", co_defendant_names: [] }, as: AssignmentCoordinator }
            - { call: "POST /assignments", payload: { case_id: "${c}", attorney_id: "${att}" }, as: AssignmentCoordinator }
            - { call: "POST /court-events", payload: { case_id: "${c}", courtroom_id: "${room}", event_type: "TRIAL", scheduled_start: "2026-06-11T09:00:00Z", scheduled_end: "2026-06-11T10:00:00Z" }, as: AssignmentCoordinator, captures: { ev: $.data.id } }
            - { call: "POST /court-events/${ev}/vacate", payload: {}, as: AssignmentCoordinator }
          trigger:
            - { call: "POST /court-events/${ev}/vacate", payload: {}, as: AssignmentCoordinator, captures: { err: $.data.error_id } }
          assert:
            - "HTTP 409 and data.error_id == ERR_COURT_EVENT_NOT_SCHEDULED"

      - name: decide_screening_twice_returns_already_decided
        claim_type: Idempotency
        grounds: [state_machines.FinancialScreening.SUBMITTED_to_DECIDED, "errors[ERR_SCREENING_ALREADY_DECIDED]"]
        distinguishing_aspect: "A second decide on the same screening returns 409 ERR_SCREENING_ALREADY_DECIDED."
        test_recipe:
          setup: ["A decided screening."]
          setup_api_calls:
            - { call: "POST /defender-offices", payload: { name: "PD-S2", annual_voucher_budget_cents: 100000000, recoupment_basis: "SCHEDULE" }, as: SupervisingAttorney, captures: { off: $.data.id } }
            - { call: "POST /cases", payload: { office_id: "${off}", defendant_name: "Dd", charge_class: "MISDEMEANOR" }, as: IntakeClerk, captures: { c: $.data.id } }
            - { call: "POST /financial-screenings", payload: { case_id: "${c}", household_income_cents: 800000, household_size: 2, asset_value_cents: 0 }, as: IntakeClerk, captures: { scr: $.data.id } }
            - { call: "POST /financial-screenings/${scr}/decide", payload: {}, as: ScreeningOfficer, as_user_id: "officer-1" }
          trigger:
            - { call: "POST /financial-screenings/${scr}/decide", payload: {}, as: ScreeningOfficer, as_user_id: "officer-1", captures: { err: $.data.error_id } }
          assert:
            - "HTTP 409 and data.error_id == ERR_SCREENING_ALREADY_DECIDED"

      - name: suspend_then_reactivate_valid_transition
        claim_type: Valid Transition
        grounds: [state_machines.Attorney.ACTIVE_to_SUSPENDED, state_machines.Attorney.SUSPENDED_to_ACTIVE]
        distinguishing_aspect: "suspend moves an attorney ACTIVE -> SUSPENDED and reactivate returns it (load < max) to ACTIVE."
        test_recipe:
          setup: ["An active attorney."]
          setup_api_calls:
            - { call: "POST /defender-offices", payload: { name: "PD-S3", annual_voucher_budget_cents: 100000000, recoupment_basis: "SCHEDULE" }, as: SupervisingAttorney, captures: { off: $.data.id } }
            - { call: "POST /attorneys", payload: { office_id: "${off}", name: "Sy", attorney_type: "STAFF", bar_number: "S3", hourly_rate_cents: 15000, max_weighted_caseload: 10.0 }, as: SupervisingAttorney, captures: { att: $.data.id } }
            - { call: "POST /attorneys/${att}/suspend", payload: {}, as: SupervisingAttorney }
          trigger:
            - { call: "POST /attorneys/${att}/reactivate", payload: {}, as: SupervisingAttorney, captures: { st: $.data.status } }
          assert:
            - "After suspend the attorney was SUSPENDED; after reactivate Attorney.${att}.status == ACTIVE"

      - name: complete_service_request_without_approval_invalid
        claim_type: Invalid Transitions
        grounds: [state_machines.ServiceRequest.APPROVED_to_COMPLETED, "errors[ERR_SERVICE_REQUEST_NOT_APPROVED]"]
        distinguishing_aspect: "Completing a REQUESTED (not yet APPROVED) service request returns 409 ERR_SERVICE_REQUEST_NOT_APPROVED."
        test_recipe:
          setup: ["Assigned case with a REQUESTED service request."]
          setup_api_calls:
            - { call: "POST /defender-offices", payload: { name: "PD-S4", annual_voucher_budget_cents: 100000000, recoupment_basis: "SCHEDULE" }, as: SupervisingAttorney, captures: { off: $.data.id } }
            - { call: "POST /attorneys", payload: { office_id: "${off}", name: "Sr", attorney_type: "STAFF", bar_number: "S4", hourly_rate_cents: 15000, max_weighted_caseload: 10.0 }, as: SupervisingAttorney, captures: { att: $.data.id } }
            - { call: "POST /cases", payload: { office_id: "${off}", defendant_name: "Sq", charge_class: "MISDEMEANOR" }, as: IntakeClerk, captures: { c: $.data.id } }
            - { call: "POST /financial-screenings", payload: { case_id: "${c}", household_income_cents: 800000, household_size: 2, asset_value_cents: 0 }, as: IntakeClerk, captures: { scr: $.data.id } }
            - { call: "POST /financial-screenings/${scr}/decide", payload: {}, as: ScreeningOfficer, as_user_id: "officer-1" }
            - { call: "POST /conflict-checks", payload: { case_id: "${c}", attorney_id: "${att}", co_defendant_names: [] }, as: AssignmentCoordinator }
            - { call: "POST /assignments", payload: { case_id: "${c}", attorney_id: "${att}" }, as: AssignmentCoordinator }
            - { call: "POST /service-requests", payload: { case_id: "${c}", service_type: "INVESTIGATOR", estimated_hours: 10, estimated_rate_cents: 8000 }, as: AssignmentCoordinator, captures: { sr: $.data.id } }
          trigger:
            - { call: "POST /service-requests/${sr}/complete", payload: {}, as: AssignmentCoordinator, captures: { err: $.data.error_id } }
          assert:
            - "HTTP 409 and data.error_id == ERR_SERVICE_REQUEST_NOT_APPROVED"

      - name: assign_from_referred_case_invalid_state
        claim_type: Invalid Transitions
        grounds: [state_machines.Case.SCREENED_to_ASSIGNED, "errors[ERR_CASE_NOT_SCREENED]"]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / assign_state_beats_safety
          rationale: "The state-category rejection ERR_CASE_NOT_SCREENED for assigning a non-SCREENED case is asserted as the winning error in the named §1.8 instance."

  # ===========================================================================
  - section: calculations
    instances:
      - name: service_authorized_amount_capped_by_service_cap
        claim_type: Constants Applied
        grounds: [calculations.service_authorized_amount, entities.ServiceRequest.fields.authorized_amount_cents]
        distinguishing_aspect: "Approving an INVESTIGATOR request estimated 40h @ 8000 (gross 320000) authorizes 250000, capped at SERVICE_CAP[INVESTIGATOR]."
        test_recipe:
          setup: ["Assigned case; OPEN office; REQUESTED investigator service request."]
          setup_api_calls:
            - { call: "POST /defender-offices", payload: { name: "PD-C1", annual_voucher_budget_cents: 100000000, recoupment_basis: "SCHEDULE" }, as: SupervisingAttorney, captures: { off: $.data.id } }
            - { call: "POST /attorneys", payload: { office_id: "${off}", name: "Cc", attorney_type: "STAFF", bar_number: "C1", hourly_rate_cents: 15000, max_weighted_caseload: 10.0 }, as: SupervisingAttorney, captures: { att: $.data.id } }
            - { call: "POST /cases", payload: { office_id: "${off}", defendant_name: "Cw", charge_class: "FELONY_A" }, as: IntakeClerk, captures: { c: $.data.id } }
            - { call: "POST /financial-screenings", payload: { case_id: "${c}", household_income_cents: 500000, household_size: 2, asset_value_cents: 0 }, as: IntakeClerk, captures: { scr: $.data.id } }
            - { call: "POST /financial-screenings/${scr}/decide", payload: {}, as: ScreeningOfficer, as_user_id: "officer-1" }
            - { call: "POST /conflict-checks", payload: { case_id: "${c}", attorney_id: "${att}", co_defendant_names: [] }, as: AssignmentCoordinator }
            - { call: "POST /assignments", payload: { case_id: "${c}", attorney_id: "${att}" }, as: AssignmentCoordinator }
            - { call: "POST /service-requests", payload: { case_id: "${c}", service_type: "INVESTIGATOR", estimated_hours: 40, estimated_rate_cents: 8000 }, as: AssignmentCoordinator, captures: { sr: $.data.id } }
          trigger:
            - { call: "POST /service-requests/${sr}/approve", payload: {}, as: SupervisingAttorney, captures: { auth: $.data.authorized_amount_cents } }
          assert:
            - "ServiceRequest.${sr}.authorized_amount_cents == 250000 (min(320000, cap 250000)) and status == APPROVED"

      - name: provisional_case_weight_felony_b_value
        claim_type: Correct Result
        grounds: [calculations.case_weight, entities.Case.fields.case_weight]
        distinguishing_aspect: "Assigning a FELONY_B case sets provisional case_weight == 2.5 == BASE_WEIGHT[FELONY_B] and Assignment.assigned_weight == 2.5."
        test_recipe:
          setup: ["Screened FELONY_B case with CLEAR conflict check; active attorney max 10."]
          setup_api_calls:
            - { call: "POST /defender-offices", payload: { name: "PD-C2", annual_voucher_budget_cents: 100000000, recoupment_basis: "SCHEDULE" }, as: SupervisingAttorney, captures: { off: $.data.id } }
            - { call: "POST /attorneys", payload: { office_id: "${off}", name: "Cb", attorney_type: "STAFF", bar_number: "C2", hourly_rate_cents: 15000, max_weighted_caseload: 10.0 }, as: SupervisingAttorney, captures: { att: $.data.id } }
            - { call: "POST /cases", payload: { office_id: "${off}", defendant_name: "Fb", charge_class: "FELONY_B" }, as: IntakeClerk, captures: { c: $.data.id } }
            - { call: "POST /financial-screenings", payload: { case_id: "${c}", household_income_cents: 500000, household_size: 2, asset_value_cents: 0 }, as: IntakeClerk, captures: { scr: $.data.id } }
            - { call: "POST /financial-screenings/${scr}/decide", payload: {}, as: ScreeningOfficer, as_user_id: "officer-1" }
            - { call: "POST /conflict-checks", payload: { case_id: "${c}", attorney_id: "${att}", co_defendant_names: [] }, as: AssignmentCoordinator }
          trigger:
            - { call: "POST /assignments", payload: { case_id: "${c}", attorney_id: "${att}" }, as: AssignmentCoordinator, captures: { w: $.data.assigned_weight } }
          assert:
            - "Assignment assigned_weight == 2.5; Case.${c}.case_weight == 2.5, weight_basis == PROVISIONAL; Attorney.${att}.current_weighted_load == 2.5"

      - name: financial_contribution_per_component_rounding_calc
        claim_type: Precision
        grounds: [calculations.financial_contribution]
        excluded_because:
          difficulty_instance: combinatorial_formula / financial_contribution_per_component_rounding
          rationale: "Per-component rounding precision (108333 not 108334) is asserted in the named §1.8 instance."

  # ===========================================================================
  - section: validations
    instances:
      - name: court_event_in_past_rejected
        claim_type: Violation to Error
        grounds: ["validations[priority=9]", "errors[ERR_EVENT_IN_PAST]"]
        distinguishing_aspect: "With the logical clock advanced to 2026-07-01, scheduling an event starting 2026-06-01 returns 409 ERR_EVENT_IN_PAST."
        test_recipe:
          setup: ["Assigned case, courtroom, clock set to 2026-07-01T00:00:00Z."]
          setup_api_calls:
            - { call: "POST /defender-offices", payload: { name: "PD-V1", annual_voucher_budget_cents: 100000000, recoupment_basis: "SCHEDULE" }, as: SupervisingAttorney, captures: { off: $.data.id } }
            - { call: "POST /attorneys", payload: { office_id: "${off}", name: "Va", attorney_type: "STAFF", bar_number: "V1", hourly_rate_cents: 15000, max_weighted_caseload: 10.0 }, as: SupervisingAttorney, captures: { att: $.data.id } }
            - { call: "POST /courtrooms", payload: { name: "Dept 7", courthouse: "Main" }, as: SupervisingAttorney, captures: { room: $.data.id } }
            - { call: "POST /cases", payload: { office_id: "${off}", defendant_name: "Vp", charge_class: "MISDEMEANOR" }, as: IntakeClerk, captures: { c: $.data.id } }
            - { call: "POST /financial-screenings", payload: { case_id: "${c}", household_income_cents: 800000, household_size: 2, asset_value_cents: 0 }, as: IntakeClerk, captures: { scr: $.data.id } }
            - { call: "POST /financial-screenings/${scr}/decide", payload: {}, as: ScreeningOfficer, as_user_id: "officer-1" }
            - { call: "POST /conflict-checks", payload: { case_id: "${c}", attorney_id: "${att}", co_defendant_names: [] }, as: AssignmentCoordinator }
            - { call: "POST /assignments", payload: { case_id: "${c}", attorney_id: "${att}" }, as: AssignmentCoordinator }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-07-01T00:00:00Z" }, as: SupervisingAttorney }
          trigger:
            - { call: "POST /court-events", payload: { case_id: "${c}", courtroom_id: "${room}", event_type: "ARRAIGNMENT", scheduled_start: "2026-06-01T09:00:00Z", scheduled_end: "2026-06-01T10:00:00Z" }, as: AssignmentCoordinator, captures: { err: $.data.error_id } }
          assert:
            - "HTTP 409 and data.error_id == ERR_EVENT_IN_PAST"

      - name: duplicate_financial_screening_rejected
        claim_type: Violation to Error
        grounds: ["validations[priority=8]", "errors[ERR_SCREENING_ALREADY_EXISTS]"]
        distinguishing_aspect: "A second POST /financial-screenings for the same case returns 409 ERR_SCREENING_ALREADY_EXISTS (uniqueness)."
        test_recipe:
          setup: ["Case with one screening already submitted."]
          setup_api_calls:
            - { call: "POST /defender-offices", payload: { name: "PD-V2", annual_voucher_budget_cents: 100000000, recoupment_basis: "SCHEDULE" }, as: SupervisingAttorney, captures: { off: $.data.id } }
            - { call: "POST /cases", payload: { office_id: "${off}", defendant_name: "Du", charge_class: "MISDEMEANOR" }, as: IntakeClerk, captures: { c: $.data.id } }
            - { call: "POST /financial-screenings", payload: { case_id: "${c}", household_income_cents: 800000, household_size: 2, asset_value_cents: 0 }, as: IntakeClerk }
          trigger:
            - { call: "POST /financial-screenings", payload: { case_id: "${c}", household_income_cents: 900000, household_size: 2, asset_value_cents: 0 }, as: IntakeClerk, captures: { err: $.data.error_id } }
          assert:
            - "HTTP 409 and data.error_id == ERR_SCREENING_ALREADY_EXISTS"

      - name: court_event_end_not_after_start_rejected
        claim_type: Violation to Error
        grounds: ["validations[priority=4]", "errors[ERR_VALIDATION]", entities.CourtEvent.fields.scheduled_end]
        distinguishing_aspect: "POST /court-events with scheduled_end == scheduled_start returns 400 ERR_VALIDATION."
        test_recipe:
          setup: ["Assigned case and courtroom."]
          setup_api_calls:
            - { call: "POST /defender-offices", payload: { name: "PD-V3", annual_voucher_budget_cents: 100000000, recoupment_basis: "SCHEDULE" }, as: SupervisingAttorney, captures: { off: $.data.id } }
            - { call: "POST /attorneys", payload: { office_id: "${off}", name: "Vc", attorney_type: "STAFF", bar_number: "V3", hourly_rate_cents: 15000, max_weighted_caseload: 10.0 }, as: SupervisingAttorney, captures: { att: $.data.id } }
            - { call: "POST /courtrooms", payload: { name: "Dept 8", courthouse: "Main" }, as: SupervisingAttorney, captures: { room: $.data.id } }
