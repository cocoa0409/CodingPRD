# =============================================================================
# §1.9 Scaffold Corner Design — Coverage Index for Non-Difficulty Tests
# Corporate Flight Department Scheduling
#
# Breadth probe: enumerates every testable claim §1.1–§1.7 declares that §1.8
# does not already cover. Sections and claim_types follow
# references/claim-extraction-guide.md exactly.
# =============================================================================

scaffold_corner_design:
  # ===========================================================================
  # Section: entities — creation, defaults, required fields, enum closure,
  # computed fields, FK integrity, parent relationship, retrieval, listing
  # ===========================================================================
  - section: entities
    instances:
      - name: aircraft_creation_returns_201_and_defaults
        claim_type: creation
        grounds:
          - "entities.Aircraft"
          - "endpoints[POST /flight-ops/aircraft]"
        distinguishing_aspect: "Aircraft created with status=ACTIVE default, posture=AVAILABLE computed, version=1."
        test_recipe:
          setup: ["No aircraft yet"]
          setup_api_calls:
            - call: "POST /flight-ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: FlightDeptManager
          trigger:
            - call: "POST /flight-ops/aircraft"
              payload: { tail_number: "N2001CF", aircraft_type: "TURBOPROP", passenger_capacity: 8, home_base_icao: "KTEB" }
              as: FlightDeptManager
              captures: { ac_id: $.data.id, ac_status: $.data.status, ac_posture: $.data.posture, ac_version: $.data.version }
          assert:
            - "ac_status == ACTIVE (default applied)"
            - "ac_posture == AVAILABLE (computed at creation)"
            - "ac_version == 1"

      - name: aircraft_get_by_id_returns_matching_entity
        claim_type: retrieval
        grounds:
          - "entities.Aircraft"
          - "endpoints[GET /flight-ops/aircraft/{id}]"
        distinguishing_aspect: "GET returns the same aircraft that was created."
        test_recipe:
          setup: ["Aircraft created"]
          setup_api_calls:
            - call: "POST /flight-ops/aircraft"
              payload: { tail_number: "N2002CF", aircraft_type: "LIGHT_JET", passenger_capacity: 6, home_base_icao: "KTEB" }
              as: FlightDeptManager
              captures: { ac_id: $.data.id }
          trigger:
            - call: "GET /flight-ops/aircraft/${ac_id}"
              as: Dispatcher
              captures: { tail: $.data.tail_number, cap: $.data.passenger_capacity }
          assert:
            - "tail == N2002CF"
            - "cap == 6"

      - name: aircraft_get_nonexistent_returns_404
        claim_type: not_found
        grounds:
          - "entities.Aircraft"
          - "errors[ERR_NOT_FOUND]"
        distinguishing_aspect: "GET with a non-existent UUID returns ERR_NOT_FOUND."
        test_recipe:
          setup: []
          setup_api_calls:
            - call: "POST /flight-ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: FlightDeptManager
          trigger:
            - call: "GET /flight-ops/aircraft/00000000-0000-0000-0000-000000000000"
              as: Dispatcher
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_NOT_FOUND"

      - name: aircraft_invalid_enum_returns_400
        claim_type: type_constraints
        grounds:
          - "entities.Aircraft.fields.aircraft_type"
          - "errors[ERR_VALIDATION]"
        distinguishing_aspect: "Invalid enum value for aircraft_type is rejected at creation."
        test_recipe:
          setup: []
          setup_api_calls:
            - call: "POST /flight-ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: FlightDeptManager
          trigger:
            - call: "POST /flight-ops/aircraft"
              payload: { tail_number: "N2003CF", aircraft_type: "SPACESHIP", passenger_capacity: 6, home_base_icao: "KTEB" }
              as: FlightDeptManager
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_VALIDATION"

      - name: aircraft_list_pagination_envelope
        claim_type: listing
        grounds:
          - "entities.Aircraft"
          - "endpoints[GET /flight-ops/aircraft]"
          - "response_envelope"
        distinguishing_aspect: "List returns pagination fields limit/offset/total_count/has_more with default limit=10."
        test_recipe:
          setup: ["12 aircraft created"]
          setup_api_calls:
            - call: "POST /flight-ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: FlightDeptManager
            - call: "POST /flight-ops/aircraft"
              payload: { tail_number: "N2101CF", aircraft_type: "LIGHT_JET", passenger_capacity: 6, home_base_icao: "KTEB" }
              as: FlightDeptManager
            - call: "POST /flight-ops/aircraft"
              payload: { tail_number: "N2102CF", aircraft_type: "LIGHT_JET", passenger_capacity: 6, home_base_icao: "KTEB" }
              as: FlightDeptManager
            - call: "POST /flight-ops/aircraft"
              payload: { tail_number: "N2103CF", aircraft_type: "LIGHT_JET", passenger_capacity: 6, home_base_icao: "KTEB" }
              as: FlightDeptManager
            - call: "POST /flight-ops/aircraft"
              payload: { tail_number: "N2104CF", aircraft_type: "LIGHT_JET", passenger_capacity: 6, home_base_icao: "KTEB" }
              as: FlightDeptManager
            - call: "POST /flight-ops/aircraft"
              payload: { tail_number: "N2105CF", aircraft_type: "LIGHT_JET", passenger_capacity: 6, home_base_icao: "KTEB" }
              as: FlightDeptManager
            - call: "POST /flight-ops/aircraft"
              payload: { tail_number: "N2106CF", aircraft_type: "LIGHT_JET", passenger_capacity: 6, home_base_icao: "KTEB" }
              as: FlightDeptManager
            - call: "POST /flight-ops/aircraft"
              payload: { tail_number: "N2107CF", aircraft_type: "LIGHT_JET", passenger_capacity: 6, home_base_icao: "KTEB" }
              as: FlightDeptManager
            - call: "POST /flight-ops/aircraft"
              payload: { tail_number: "N2108CF", aircraft_type: "LIGHT_JET", passenger_capacity: 6, home_base_icao: "KTEB" }
              as: FlightDeptManager
            - call: "POST /flight-ops/aircraft"
              payload: { tail_number: "N2109CF", aircraft_type: "LIGHT_JET", passenger_capacity: 6, home_base_icao: "KTEB" }
              as: FlightDeptManager
            - call: "POST /flight-ops/aircraft"
              payload: { tail_number: "N2110CF", aircraft_type: "LIGHT_JET", passenger_capacity: 6, home_base_icao: "KTEB" }
              as: FlightDeptManager
            - call: "POST /flight-ops/aircraft"
              payload: { tail_number: "N2111CF", aircraft_type: "LIGHT_JET", passenger_capacity: 6, home_base_icao: "KTEB" }
              as: FlightDeptManager
            - call: "POST /flight-ops/aircraft"
              payload: { tail_number: "N2112CF", aircraft_type: "LIGHT_JET", passenger_capacity: 6, home_base_icao: "KTEB" }
              as: FlightDeptManager
          trigger:
            - call: "GET /flight-ops/aircraft"
              as: Dispatcher
          assert:
            - "response.meta.api_request_id is present (response envelope shape)"
            - "response.response_type == array"
            - "len(response.data) == 10 (default limit=10)"
            - "response pagination fields limit=10, offset=0, total_count=12, has_more=true are exposed per §1.0 pagination_fields"

      - name: trip_request_computed_max_priority_tier
        claim_type: computed_fields
        grounds:
          - "entities.TripRequest.fields.max_priority_tier"
          - "endpoints[POST /flight-ops/trip-requests/{id}/submit]"
        distinguishing_aspect: "max_priority_tier is system-computed at submit from passenger_ids; input value ignored."
        test_recipe:
          setup: ["BU, two passengers TIER_2 and TIER_1 exist; trip with both passengers in DRAFT"]
          setup_api_calls:
            - call: "POST /flight-ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: FlightDeptManager
            - call: "POST /flight-ops/business-units"
              payload: { bu_code: "BU-E1", name: "E1", annual_flight_budget_cents: 100000000 }
              as: FinanceAdmin
              captures: { bu_id: $.data.id }
            - call: "POST /flight-ops/passenger-profiles"
              payload: { employee_number: "E2001", full_name: "T1 Pax", priority_tier: "TIER_1", home_bu_id: "${bu_id}", sifl_control_employee: false }
              as: FlightDeptManager
              captures: { pax1: $.data.id }
            - call: "POST /flight-ops/passenger-profiles"
              payload: { employee_number: "E2002", full_name: "T2 Pax", priority_tier: "TIER_2", home_bu_id: "${bu_id}", sifl_control_employee: false }
              as: FlightDeptManager
              captures: { pax2: $.data.id }
            - call: "POST /flight-ops/trip-requests"
              payload: { requester_id: "${pax2}", charge_bu_id: "${bu_id}", trip_kind: "BUSINESS", purpose: "X", requested_departure_utc: "2026-08-10T12:00:00Z", requested_return_utc: "2026-08-10T14:00:00Z", passenger_ids: ["${pax2}", "${pax1}"] }
              as: ExecutiveRequester
              as_user_id: "${pax2}"
              captures: { trip_id: $.data.id }
            - call: "POST /flight-ops/trip-requests/${trip_id}/flight-legs"
              payload: { leg_sequence: 1, origin_icao: "KTEB", destination_icao: "KDCA", scheduled_departure_utc: "2026-08-10T12:00:00Z", scheduled_arrival_utc: "2026-08-10T14:00:00Z", distance_statute_miles: 200 }
              as: ExecutiveRequester
              as_user_id: "${pax2}"
          trigger:
            - call: "POST /flight-ops/trip-requests/${trip_id}/submit"
              payload: {}
              as: ExecutiveRequester
              as_user_id: "${pax2}"
              captures: { tier: $.data.max_priority_tier }
          assert:
            - "tier == TIER_1 (highest among passengers, not the requester's own TIER_2)"

      - name: flight_leg_block_minutes_computed
        claim_type: computed_fields
        grounds:
          - "entities.FlightLeg.fields.block_minutes"
          - "endpoints[POST /flight-ops/trip-requests/{id}/flight-legs]"
        distinguishing_aspect: "block_minutes = (scheduled_arrival_utc - scheduled_departure_utc) in whole minutes; input value ignored."
        test_recipe:
          setup: ["BU, pax, trip in DRAFT"]
          setup_api_calls:
            - call: "POST /flight-ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: FlightDeptManager
            - call: "POST /flight-ops/business-units"
              payload: { bu_code: "BU-E2", name: "E2", annual_flight_budget_cents: 100000000 }
              as: FinanceAdmin
              captures: { bu_id: $.data.id }
            - call: "POST /flight-ops/passenger-profiles"
              payload: { employee_number: "E2003", full_name: "Pax E2", priority_tier: "TIER_1", home_bu_id: "${bu_id}", sifl_control_employee: false }
              as: FlightDeptManager
              captures: { pax: $.data.id }
            - call: "POST /flight-ops/trip-requests"
              payload: { requester_id: "${pax}", charge_bu_id: "${bu_id}", trip_kind: "BUSINESS", purpose: "X", requested_departure_utc: "2026-08-10T12:00:00Z", requested_return_utc: "2026-08-10T14:00:00Z", passenger_ids: ["${pax}"] }
              as: ExecutiveRequester
              as_user_id: "${pax}"
              captures: { trip_id: $.data.id }
          trigger:
            - call: "POST /flight-ops/trip-requests/${trip_id}/flight-legs"
              payload: { leg_sequence: 1, origin_icao: "KTEB", destination_icao: "KDCA", scheduled_departure_utc: "2026-08-10T12:00:00Z", scheduled_arrival_utc: "2026-08-10T14:37:00Z", distance_statute_miles: 200 }
              as: ExecutiveRequester
              as_user_id: "${pax}"
              captures: { bm: $.data.block_minutes }
          assert:
            - "bm == 157 (2h37m in whole minutes)"

      - name: fk_integrity_passenger_home_bu_must_exist
        claim_type: parent_relationships
        grounds:
          - "entities.PassengerProfile.fields.home_bu_id"
          - "errors[ERR_FK_NOT_FOUND]"
        distinguishing_aspect: "PassengerProfile creation with a non-existent home_bu_id fails with ERR_FK_NOT_FOUND."
        test_recipe:
          setup: []
          setup_api_calls:
            - call: "POST /flight-ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: FlightDeptManager
          trigger:
            - call: "POST /flight-ops/passenger-profiles"
              payload: { employee_number: "E2004", full_name: "Orphan", priority_tier: "TIER_1", home_bu_id: "00000000-0000-0000-0000-000000000000", sifl_control_employee: false }
              as: FlightDeptManager
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_FK_NOT_FOUND"

      - name: system_fields_id_created_at_updated_at_version
        claim_type: system_fields
        grounds:
          - "entities.Aircraft"
          - "response_envelope"
        distinguishing_aspect: "id is server-minted UUID, created_at is ISO8601 with three fractional digits, version starts at 1; client-supplied id in input is ignored."
        test_recipe:
          setup: []
          setup_api_calls:
            - call: "POST /flight-ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: FlightDeptManager
          trigger:
            - call: "POST /flight-ops/aircraft"
              payload: { tail_number: "N2005CF", aircraft_type: "LIGHT_JET", passenger_capacity: 6, home_base_icao: "KTEB" }
              as: FlightDeptManager
              captures: { id_val: $.data.id, ca: $.data.created_at, v: $.data.version }
          assert:
            - "id_val matches UUID shape and was not supplied by the client"
            - "ca is in ISO8601 UTC form"
            - "v == 1"

  # ===========================================================================
  # Section: state_machines — valid, invalid-from, terminal lockdown, idempotency
  # ===========================================================================
  - section: state_machines
    instances:
      - name: trip_submit_from_draft_succeeds
        claim_type: valid_transition
        grounds:
          - "state_machines.TripRequest.transitions.DRAFT_to_SUBMITTED"
        distinguishing_aspect: "DRAFT→SUBMITTED via /submit transitions approval_status while assignment_status stays UNASSIGNED."
        test_recipe:
          setup: ["Trip in DRAFT with one leg"]
          setup_api_calls:
            - call: "POST /flight-ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: FlightDeptManager
            - call: "POST /flight-ops/business-units"
              payload: { bu_code: "BU-S1", name: "S1", annual_flight_budget_cents: 100000000 }
              as: FinanceAdmin
              captures: { bu_id: $.data.id }
            - call: "POST /flight-ops/passenger-profiles"
              payload: { employee_number: "E3001", full_name: "Pax S1", priority_tier: "TIER_1", home_bu_id: "${bu_id}", sifl_control_employee: false }
              as: FlightDeptManager
              captures: { pax: $.data.id }
            - call: "POST /flight-ops/trip-requests"
              payload: { requester_id: "${pax}", charge_bu_id: "${bu_id}", trip_kind: "BUSINESS", purpose: "X", requested_departure_utc: "2026-08-10T12:00:00Z", requested_return_utc: "2026-08-10T14:00:00Z", passenger_ids: ["${pax}"] }
              as: ExecutiveRequester
              as_user_id: "${pax}"
              captures: { trip_id: $.data.id }
            - call: "POST /flight-ops/trip-requests/${trip_id}/flight-legs"
              payload: { leg_sequence: 1, origin_icao: "KTEB", destination_icao: "KDCA", scheduled_departure_utc: "2026-08-10T12:00:00Z", scheduled_arrival_utc: "2026-08-10T14:00:00Z", distance_statute_miles: 200 }
              as: ExecutiveRequester
              as_user_id: "${pax}"
          trigger:
            - call: "POST /flight-ops/trip-requests/${trip_id}/submit"
              payload: {}
              as: ExecutiveRequester
              as_user_id: "${pax}"
              captures: { a: $.data.approval_status, s: $.data.assignment_status }
          assert:
            - "a == SUBMITTED"
            - "s == UNASSIGNED"

      - name: trip_approve_from_draft_rejected_invalid_state
        claim_type: invalid_transition
        grounds:
          - "state_machines.TripRequest.transitions"
          - "errors[ERR_INVALID_STATE]"
        distinguishing_aspect: "Approve is only defined from SUBMITTED; calling it on DRAFT returns ERR_INVALID_STATE."
        test_recipe:
          setup: ["Trip in DRAFT"]
          setup_api_calls:
            - call: "POST /flight-ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: FlightDeptManager
            - call: "POST /flight-ops/business-units"
              payload: { bu_code: "BU-S2", name: "S2", annual_flight_budget_cents: 100000000 }
              as: FinanceAdmin
              captures: { bu_id: $.data.id }
            - call: "POST /flight-ops/passenger-profiles"
              payload: { employee_number: "E3002", full_name: "Pax S2", priority_tier: "TIER_1", home_bu_id: "${bu_id}", sifl_control_employee: false }
              as: FlightDeptManager
              captures: { pax: $.data.id }
            - call: "POST /flight-ops/trip-requests"
              payload: { requester_id: "${pax}", charge_bu_id: "${bu_id}", trip_kind: "BUSINESS", purpose: "X", requested_departure_utc: "2026-08-10T12:00:00Z", requested_return_utc: "2026-08-10T14:00:00Z", passenger_ids: ["${pax}"] }
              as: ExecutiveRequester
              as_user_id: "${pax}"
              captures: { trip_id: $.data.id }
            - call: "POST /flight-ops/trip-requests/${trip_id}/flight-legs"
              payload: { leg_sequence: 1, origin_icao: "KTEB", destination_icao: "KDCA", scheduled_departure_utc: "2026-08-10T12:00:00Z", scheduled_arrival_utc: "2026-08-10T14:00:00Z", distance_statute_miles: 200 }
              as: ExecutiveRequester
              as_user_id: "${pax}"
          trigger:
            - call: "POST /flight-ops/trip-requests/${trip_id}/approve"
              payload: {}
              as: FlightDeptManager
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_STATE"

      - name: terminal_trip_rejected_lockdown_no_further_transitions
        claim_type: terminal_state_lockdown
        grounds:
          - "state_machines.TripRequest.terminal_states"
        distinguishing_aspect: "Once approval_status=REJECTED, no further transitions succeed (submit, approve, cancel all ERR_INVALID_STATE)."
        test_recipe:
          setup: ["Trip REJECTED"]
          setup_api_calls:
            - call: "POST /flight-ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: FlightDeptManager
            - call: "POST /flight-ops/business-units"
              payload: { bu_code: "BU-S3", name: "S3", annual_flight_budget_cents: 100000000 }
              as: FinanceAdmin
              captures: { bu_id: $.data.id }
            - call: "POST /flight-ops/passenger-profiles"
              payload: { employee_number: "E3003", full_name: "Pax S3", priority_tier: "TIER_1", home_bu_id: "${bu_id}", sifl_control_employee: false }
              as: FlightDeptManager
              captures: { pax: $.data.id }
            - call: "POST /flight-ops/trip-requests"
              payload: { requester_id: "${pax}", charge_bu_id: "${bu_id}", trip_kind: "BUSINESS", purpose: "X", requested_departure_utc: "2026-08-10T12:00:00Z", requested_return_utc: "2026-08-10T14:00:00Z", passenger_ids: ["${pax}"] }
              as: ExecutiveRequester
              as_user_id: "${pax}"
              captures: { trip_id: $.data.id }
            - call: "POST /flight-ops/trip-requests/${trip_id}/flight-legs"
              payload: { leg_sequence: 1, origin_icao: "KTEB", destination_icao: "KDCA", scheduled_departure_utc: "2026-08-10T12:00:00Z", scheduled_arrival_utc: "2026-08-10T14:00:00Z", distance_statute_miles: 200 }
              as: ExecutiveRequester
              as_user_id: "${pax}"
            - call: "POST /flight-ops/trip-requests/${trip_id}/submit"
              payload: {}
              as: ExecutiveRequester
              as_user_id: "${pax}"
            - call: "POST /flight-ops/trip-requests/${trip_id}/reject"
              payload: {}
              as: FlightDeptManager
          trigger:
            - call: "POST /flight-ops/trip-requests/${trip_id}/submit"
              payload: {}
              as: ExecutiveRequester
              as_user_id: "${pax}"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_STATE"

      - name: cancel_already_cancelled_trip_idempotency_returns_invalid_state
        claim_type: idempotency
        grounds:
          - "state_machines.TripRequest.transitions"
          - "errors[ERR_INVALID_STATE]"
        distinguishing_aspect: "Repeating cancel on a CANCELLED trip fails with ERR_INVALID_STATE — no double-side-effect."
        test_recipe:
          setup: ["Trip CANCELLED once"]
          setup_api_calls:
            - call: "POST /flight-ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: FlightDeptManager
            - call: "POST /flight-ops/business-units"
              payload: { bu_code: "BU-S4", name: "S4", annual_flight_budget_cents: 100000000 }
              as: FinanceAdmin
              captures: { bu_id: $.data.id }
            - call: "POST /flight-ops/passenger-profiles"
              payload: { employee_number: "E3004", full_name: "Pax S4", priority_tier: "TIER_1", home_bu_id: "${bu_id}", sifl_control_employee: false }
              as: FlightDeptManager
              captures: { pax: $.data.id }
            - call: "POST /flight-ops/trip-requests"
              payload: { requester_id: "${pax}", charge_bu_id: "${bu_id}", trip_kind: "BUSINESS", purpose: "X", requested_departure_utc: "2026-08-10T12:00:00Z", requested_return_utc: "2026-08-10T14:00:00Z", passenger_ids: ["${pax}"] }
              as: ExecutiveRequester
              as_user_id: "${pax}"
              captures: { trip_id: $.data.id }
            - call: "POST /flight-ops/trip-requests/${trip_id}/flight-legs"
              payload: { leg_sequence: 1, origin_icao: "KTEB", destination_icao: "KDCA", scheduled_departure_utc: "2026-08-10T12:00:00Z", scheduled_arrival_utc: "2026-08-10T14:00:00Z", distance_statute_miles: 200 }
              as: ExecutiveRequester
              as_user_id: "${pax}"
            - call: "POST /flight-ops/trip-requests/${trip_id}/submit"
              payload: {}
              as: ExecutiveRequester
              as_user_id: "${pax}"
            - call: "POST /flight-ops/trip-requests/${trip_id}/approve"
              payload: {}
              as: FlightDeptManager
            - call: "POST /flight-ops/trip-requests/${trip_id}/cancel"
              payload: {}
              as: Dispatcher
              as_user_id: "disp-1"
          trigger:
            - call: "POST /flight-ops/trip-requests/${trip_id}/cancel"
              payload: {}
              as: Dispatcher
              as_user_id: "disp-1"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_STATE"

      - name: flight_leg_complete_before_arrival_rejected
        claim_type: precondition_enforcement
        grounds:
          - "state_machines.FlightLeg.transitions"
          - "errors[ERR_INVALID_STATE]"
        distinguishing_aspect: "Complete requires current clock >= scheduled_arrival_utc; attempting before returns ERR_INVALID_STATE."
        test_recipe:
          setup: ["Leg RELEASED, clock still before arrival"]
          setup_api_calls:
            - call: "POST /flight-ops/_clock/set_current_utc"
