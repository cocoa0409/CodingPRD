          assert:
            - "err == ERR_WASH_CHECK_STALE and PackOrder.${o_id}.status remains ALLOCATED"

  - section: errors
    instances:
      - name: c_err_commitment_exceeded
        claim_type: violation_to_error
        grounds:
          - "errors[ERR_COMMITMENT_EXCEEDED]"
        distinguishing_aspect: "CONTRACT allocation beyond remaining commitment."
        excluded_because:
          difficulty_instance: commitment_equality_allowed_overage_rejected
          rationale: "Asserted as the failure path (0.01 over a 0.00 remainder) of the named §1.8 instance."
      - name: c_err_open_market_cap_exceeded
        claim_type: violation_to_error
        grounds:
          - "errors[ERR_OPEN_MARKET_CAP_EXCEEDED]"
        distinguishing_aspect: "Open-market request above the contract-reserved cap."
        excluded_because:
          difficulty_instance: open_market_cap_net_of_contract_commitments
          rationale: "Asserted as the second trigger of the named §1.8 instance."
      - name: c_err_retreat_window_violation
        claim_type: violation_to_error
        grounds:
          - "errors[ERR_RETREAT_WINDOW_VIOLATION]"
        distinguishing_aspect: "Sprout-inhibitor reapplication inside the 21-day window."
        excluded_because:
          difficulty_instance: retreat_window_exactly_21_days
          rationale: "Asserted on lot B (20 days) in the named §1.8 instance; interval-membership framing exercised by inhibitor_effective_window_overlap."
      - name: c_err_contract_invalid_state
        claim_type: violation_to_error
        grounds:
          - "errors[ERR_CONTRACT_INVALID_STATE]"
        distinguishing_aspect: "Allocation against a SHORTFALLED contract."
        excluded_because:
          difficulty_instance: allocate_requires_contract_active
          rationale: "Asserted as the trigger outcome of the named §1.8 instance."
      - name: c_err_settlement_lots_not_closed
        claim_type: violation_to_error
        grounds:
          - "errors[ERR_SETTLEMENT_LOTS_NOT_CLOSED]"
        distinguishing_aspect: "Finalize with a BINNED lot outstanding."
        excluded_because:
          difficulty_instance: settlement_finalize_requires_all_lots_closed
          rationale: "Asserted as the first trigger of the named §1.8 instance."
      - name: c_err_line_schedule_conflict
        claim_type: violation_to_error
        grounds:
          - "errors[ERR_LINE_SCHEDULE_CONFLICT]"
        distinguishing_aspect: "Pack-line overlap with sanitation buffer."
        excluded_because:
          difficulty_instance: pack_line_variety_buffer_overlap
          rationale: "Asserted on the 10:30 different-variety trigger of the named §1.8 instance."
      - name: c_err_order_invalid_state_allocate_cancelled
        claim_type: violation_to_error
        grounds:
          - "errors[ERR_ORDER_INVALID_STATE]"
        distinguishing_aspect: "Allocate on a CANCELLED order."
        excluded_because:
          difficulty_instance: state_outranks_fiscal_on_allocate
          rationale: "Asserted as the priority-conflict winner in the named §1.8 instance; terminal-lockdown cancel-after-ship covered by c_order_cancel_shipped_returns_order_invalid_state."
      - name: c_err_quarantine_cascade_side_effects
        claim_type: side_effect_execution
        grounds:
          - "state_machines.StorageShed.NORMAL_to_QUARANTINED"
        distinguishing_aspect: "Severe wash FAIL aborts SCHEDULED runs, holds lots, de-allocates orders, restores contracts."
        excluded_because:
          difficulty_instance: wash_fail_quarantine_cascade
          rationale: "All four cascade hops asserted hop-by-hop in the named §1.8 instance."

  - section: rbac
    instances:
      - name: c_rbac_grower_cannot_create_contract_returns_403
        claim_type: rbac_denial
        grounds:
          - "roles[ShedAdmin, SalesManager]"
          - "errors[ERR_INSUFFICIENT_PERMISSIONS]"
        distinguishing_aspect: "Grower role calling POST /contracts is denied 403 even though the payload is valid."
        test_recipe:
          setup: ["a grower exists to authenticate as"]
          setup_api_calls:
            - { call: "POST /potato-shed/growers", payload: { name: "Grower AO", grower_code: "G-AO" }, as: ShedAdmin, captures: { g_id: "$.data.id" } }
          trigger:
            - { call: "POST /potato-shed/contracts", payload: { buyer_name: "Buyer AB", variety: "RUSSET_BURBANK", committed_volume_cwt: 10.00, price_cents_per_cwt: 2000, grade_min_us1_pct: 50.0, delivery_window_start: "2026-08-01T00:00:00Z", delivery_window_end: "2026-12-01T00:00:00Z", priority_rank: 1 }, as: Grower, as_user_id: "${g_id}", captures: { err: "$.data.error_id" } }
          assert:
            - "err == ERR_INSUFFICIENT_PERMISSIONS (http 403); no contract is created (GET /pack-orders?contract_id=... has nothing to find)"

      - name: c_rbac_supervisor_cannot_record_wash_check_returns_403
        claim_type: rbac_denial
        grounds:
          - "roles[QualityAssuranceManager, PackLineSupervisor]"
          - "errors[ERR_INSUFFICIENT_PERMISSIONS]"
        distinguishing_aspect: "Segregation of duties: the PackLineSupervisor who starts runs may not record the wash-water check that authorizes them — QA only."
        test_recipe:
          setup: ["one shed"]
          setup_api_calls:
            - { call: "POST /potato-shed/sheds", payload: { name: "Shed DX" }, as: ShedAdmin, captures: { s_id: "$.data.id" } }
          trigger:
            - { call: "POST /potato-shed/sheds/${s_id}/wash-water-checks", payload: { measured_at: "2026-08-01T01:00:00Z", turbidity_ntu: 2.0, chlorine_ppm: 100, water_temp_f: 50 }, as: PackLineSupervisor, captures: { err: "$.data.error_id" } }
          assert:
            - "err == ERR_INSUFFICIENT_PERMISSIONS; GET /sheds/${s_id}/wash-water-checks is empty"

      - name: c_rbac_intake_clerk_cannot_allocate_returns_403
        claim_type: rbac_denial
        grounds:
          - "roles[IntakeClerk, SalesManager]"
          - "errors[ERR_INSUFFICIENT_PERMISSIONS]"
        distinguishing_aspect: "IntakeClerk (storage-side role) is denied on the sales-side allocate action."
        test_recipe:
          setup: ["an allocated-ready order exists (setup minimal: only the order id is needed since authz fires before existence)" ]
          setup_api_calls:
            - { call: "POST /potato-shed/sheds", payload: { name: "Shed DY" }, as: ShedAdmin }
          trigger:
            - { call: "POST /potato-shed/pack-orders/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2/allocate", payload: {}, as: IntakeClerk, captures: { err: "$.data.error_id" } }
          assert:
            - "err == ERR_INSUFFICIENT_PERMISSIONS (p2 fires before the 404 existence check)"

      - name: c_rbac_missing_auth_header_returns_400
        claim_type: rbac_denial
        grounds:
          - "validations[priority=1]"
          - "errors[ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER]"
        distinguishing_aspect: "A request without X-User-ID/X-User-Role headers returns 400 ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER before any role check."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "GET /potato-shed/sheds/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", payload: {}, as: Anonymous, captures: { err: "$.data.error_id" } }
          assert:
