# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Barbershop & Booth Rental — Expert tier.
# 9 rule_id blocks, >= 2 instances each (>= 18 total). Grounds resolve into
# SCAFFOLD.yaml §1.1–§1.7. All formula-derived asserts are pre-computed literals.
# Clock default = 2026-01-01T00:00:00Z (set explicitly in chains for determinism).
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      # --- Instance 1: settlement payout diverges by comp_model (different entity domains) ---
      - name: settlement_payout_booth_rent_vs_commission
        grounds:
          - calculations.daily_settlement_payout_cents
          - state_machines.Ticket.OPEN_to_PAID
          - entities.Barber.fields.comp_model
          - entities.DailySettlement.fields.barber_payout_cents
        distinguishing_aspect: "Identical (svc=4500, prod=1200, tips=500) yields barber_payout_cents=1200 for a BOOTH_RENT barber (booth_rent_cents=5000) but 3320 for a COMMISSION barber (commission_pct=40, product_commission_pct=10) — the dual variant lives on Barber/DailySettlement, a different entity domain than the Ticket pricing calc."
        test_recipe:
          setup:
            - "Clock at 2026-06-10T08:00:00Z."
            - "Shop OPEN with tax_rate_pct=8.5, default_booth_rent_cents=5000, default_commission_pct=40, product_commission_pct=10, punch_reward_threshold=10."
            - "Chair1 and Chair2 AVAILABLE; ServiceMenuItem Haircut(3000,30m); AddOn Beard(1500,15m); ProductSku Pomade(1200, stock 5, commission_eligible)."
            - "Barber B1 BOOTH_RENT booth_rent_cents=5000 ACTIVE on Chair1; Barber B2 COMMISSION commission_pct=40 ACTIVE on Chair2."
            - "Two customers each book + check in + check out an identical ticket (Haircut + Beard addon + Pomade x1 + tip 500) — one served by B1, one by B2 — both PAID on 2026-06-10."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-10T08:00:00Z" }
              as: ShopOwner
            - call: "POST /shops"
              payload: { name: "Fade House", tax_rate_pct: 8.5, default_booth_rent_cents: 5000, default_commission_pct: 40, product_commission_pct: 10, punch_reward_threshold: 10 }
              as: ShopOwner
              captures: { shop_id: $.data.id }
            - call: "POST /chairs"
              payload: { shop_id: "${shop_id}", label: "Chair 1" }
              as: ShopOwner
              captures: { chair1_id: $.data.id }
            - call: "POST /chairs"
              payload: { shop_id: "${shop_id}", label: "Chair 2" }
              as: ShopOwner
              captures: { chair2_id: $.data.id }
            - call: "POST /services"
              payload: { shop_id: "${shop_id}", name: "Haircut", price_cents: 3000, duration_minutes: 30 }
              as: ShopOwner
              captures: { svc_id: $.data.id }
            - call: "POST /addons"
              payload: { shop_id: "${shop_id}", name: "Beard", price_cents: 1500, extra_minutes: 15 }
              as: ShopOwner
              captures: { addon_id: $.data.id }
            - call: "POST /products"
              payload: { shop_id: "${shop_id}", name: "Pomade", price_cents: 1200, stock_qty: 5, commission_eligible: true }
              as: ShopOwner
              captures: { prod_id: $.data.id }
            - call: "POST /barbers"
              payload: { shop_id: "${shop_id}", full_name: "Bo", license_number: "L1", license_expires_on: "2027-01-01", comp_model: "BOOTH_RENT", booth_rent_cents: 5000 }
              as: ShopOwner
              captures: { b1_id: $.data.id }
            - call: "POST /barbers/${b1_id}/license/activate"
              payload: {}
              as: ShopOwner
            - call: "POST /barbers"
              payload: { shop_id: "${shop_id}", full_name: "Cy", license_number: "L2", license_expires_on: "2027-01-01", comp_model: "COMMISSION", commission_pct: 40 }
              as: ShopOwner
              captures: { b2_id: $.data.id }
            - call: "POST /barbers/${b2_id}/license/activate"
              payload: {}
              as: ShopOwner
            - call: "GET /shops/${shop_id}"
              payload: {}
              as: ShopOwner
              captures: { shop_v1: $.data.version }
            - call: "POST /shifts"
              payload: { shop_id: "${shop_id}", barber_id: "${b1_id}", chair_id: "${chair1_id}", start_utc: "2026-06-10T09:00:00Z", end_utc: "2026-06-10T18:00:00Z", expected_shop_version: "${shop_v1}" }
              as: ShopOwner
            - call: "GET /shops/${shop_id}"
              payload: {}
              as: ShopOwner
              captures: { shop_v2: $.data.version }
            - call: "POST /shifts"
              payload: { shop_id: "${shop_id}", barber_id: "${b2_id}", chair_id: "${chair2_id}", start_utc: "2026-06-10T09:00:00Z", end_utc: "2026-06-10T18:00:00Z", expected_shop_version: "${shop_v2}" }
              as: ShopOwner
            - call: "POST /customers"
              payload: { shop_id: "${shop_id}", full_name: "Cara", email: "cara@x.com" }
              as: ShopOwner
              captures: { cust1_id: $.data.id }
            - call: "POST /customers"
              payload: { shop_id: "${shop_id}", full_name: "Dan", email: "dan@x.com" }
              as: ShopOwner
              captures: { cust2_id: $.data.id }
            - call: "POST /appointments"
              payload: { shop_id: "${shop_id}", customer_id: "${cust1_id}", barber_id: "${b1_id}", chair_id: "${chair1_id}", service_item_id: "${svc_id}", addon_ids: ["${addon_id}"], start_utc: "2026-06-10T10:00:00Z" }
              as: Receptionist
              captures: { appt1_id: $.data.id }
            - call: "POST /appointments/${appt1_id}/check-in"
              payload: {}
              as: Receptionist
              captures: { tk1_id: $.data.ticket_id }
            - call: "PUT /tickets/${tk1_id}/lines"
              payload: { service_line_ids: ["${svc_id}"], addon_line_ids: ["${addon_id}"], product_lines: [{ product_sku_id: "${prod_id}", qty: 1 }], tip_cents: 500 }
              as: Receptionist
            - call: "POST /tickets/${tk1_id}/checkout"
              payload: {}
              as: Receptionist
            - call: "POST /appointments"
              payload: { shop_id: "${shop_id}", customer_id: "${cust2_id}", barber_id: "${b2_id}", chair_id: "${chair2_id}", service_item_id: "${svc_id}", addon_ids: ["${addon_id}"], start_utc: "2026-06-10T10:00:00Z" }
              as: Receptionist
              captures: { appt2_id: $.data.id }
            - call: "POST /appointments/${appt2_id}/check-in"
              payload: {}
              as: Receptionist
              captures: { tk2_id: $.data.ticket_id }
            - call: "PUT /tickets/${tk2_id}/lines"
              payload: { service_line_ids: ["${svc_id}"], addon_line_ids: ["${addon_id}"], product_lines: [{ product_sku_id: "${prod_id}", qty: 1 }], tip_cents: 500 }
              as: Receptionist
            - call: "POST /tickets/${tk2_id}/checkout"
              payload: {}
              as: Receptionist
          trigger:
            - call: "GET /barbers/${b1_id}"
              payload: {}
              as: ShopOwner
              captures: { b1_v: $.data.version }
            - call: "POST /barbers/${b1_id}/settlements"
              payload: { business_date: "2026-06-10", expected_barber_version: "${b1_v}" }
              as: ShopOwner
              captures: { st1_booth_payout: $.data.barber_payout_cents }
            - call: "GET /barbers/${b2_id}"
              payload: {}
              as: ShopOwner
              captures: { b2_v: $.data.version }
            - call: "POST /barbers/${b2_id}/settlements"
              payload: { business_date: "2026-06-10", expected_barber_version: "${b2_v}" }
              as: ShopOwner
              captures: { st2_comm_payout: $.data.barber_payout_cents }
          assert:
            - "DailySettlement(B1).barber_payout_cents == 1200"
            - "DailySettlement(B1).booth_rent_charged_cents == 5000"
            - "DailySettlement(B1).shop_commission_cents == 0"
            - "DailySettlement(B2).barber_payout_cents == 3320"
            - "DailySettlement(B2).booth_rent_charged_cents == 0"
            - "DailySettlement(B2).shop_commission_cents == 2880"

      # --- Instance 2: punch reward accrual vs no-show strike (Customer counters, different domain) ---
      - name: customer_punch_reward_vs_no_show_strike_divergent_counters
        grounds:
          - calculations.punch_reward_accrual
          - calculations.no_show_fee_and_strike
          - entities.Customer.fields.reward_credits
          - entities.Customer.fields.no_show_strikes
        distinguishing_aspect: "Two distinct conserved counters on Customer evolve under two different algorithms: a paid checkout drives punch_count/reward_credits upward (reward at threshold), while a no-show drives no_show_strikes upward (suspension at limit) — neither calc touches Barber/DailySettlement, so this dual-variant subject differs from instance 1's settlement domain."
        test_recipe:
          setup:
            - "Clock at 2026-06-10T08:00:00Z."
            - "Shop OPEN punch_reward_threshold=1, no_show_strike_limit=2, no_show_fee_cents=2500, late_grace_minutes=10."
            - "Barber ACTIVE; Chair; Shift covering 09:00–18:00; Service Haircut(3000,30m)."
            - "Customer C ACTIVE; one PAID checkout already accrued => reward_credits=1, punch_count=0."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-10T08:00:00Z" }
              as: ShopOwner
            - call: "POST /shops"
              payload: { name: "Punch Shop", tax_rate_pct: 0, default_booth_rent_cents: 0, default_commission_pct: 0, punch_reward_threshold: 1, no_show_strike_limit: 2, no_show_fee_cents: 2500, late_grace_minutes: 10 }
              as: ShopOwner
              captures: { shop_id: $.data.id }
            - call: "POST /chairs"
              payload: { shop_id: "${shop_id}", label: "C1" }
              as: ShopOwner
              captures: { chair_id: $.data.id }
            - call: "POST /services"
              payload: { shop_id: "${shop_id}", name: "Haircut", price_cents: 3000, duration_minutes: 30 }
              as: ShopOwner
              captures: { svc_id: $.data.id }
            - call: "POST /barbers"
              payload: { shop_id: "${shop_id}", full_name: "Bo", license_number: "L1", license_expires_on: "2027-01-01", comp_model: "COMMISSION" }
              as: ShopOwner
              captures: { b_id: $.data.id }
            - call: "POST /barbers/${b_id}/license/activate"
              payload: {}
              as: ShopOwner
            - call: "GET /shops/${shop_id}"
              payload: {}
              as: ShopOwner
              captures: { shop_v: $.data.version }
            - call: "POST /shifts"
              payload: { shop_id: "${shop_id}", barber_id: "${b_id}", chair_id: "${chair_id}", start_utc: "2026-06-10T09:00:00Z", end_utc: "2026-06-10T18:00:00Z", expected_shop_version: "${shop_v}" }
              as: ShopOwner
            - call: "POST /customers"
              payload: { shop_id: "${shop_id}", full_name: "Cara", email: "cara@x.com" }
              as: ShopOwner
              captures: { cust_id: $.data.id }
            - call: "POST /appointments"
              payload: { shop_id: "${shop_id}", customer_id: "${cust_id}", barber_id: "${b_id}", chair_id: "${chair_id}", service_item_id: "${svc_id}", start_utc: "2026-06-10T10:00:00Z" }
              as: Receptionist
              captures: { appt1_id: $.data.id }
            - call: "POST /appointments/${appt1_id}/check-in"
              payload: {}
              as: Receptionist
              captures: { tk1_id: $.data.ticket_id }
            - call: "POST /tickets/${tk1_id}/checkout"
              payload: {}
              as: Receptionist
          trigger:
            - call: "POST /appointments"
              payload: { shop_id: "${shop_id}", customer_id: "${cust_id}", barber_id: "${b_id}", chair_id: "${chair_id}", service_item_id: "${svc_id}", start_utc: "2026-06-10T11:00:00Z" }
              as: Receptionist
              captures: { appt2_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-10T11:30:00Z" }
              as: ShopOwner
            - call: "POST /appointments/${appt2_id}/no-show"
              payload: {}
              as: Receptionist
            - call: "GET /customers/${cust_id}"
              payload: {}
              as: ShopOwner
              captures: { strikes: $.data.no_show_strikes, rewards: $.data.reward_credits }
          assert:
            - "Customer.reward_credits == 1 (earned on the prior checkout; unchanged by the no-show)"
            - "Customer.punch_count == 0"
            - "Customer.no_show_strikes == 1"
            - "Customer.status == ACTIVE (1 < no_show_strike_limit 2)"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      # --- Instance 1: MODE (a) — non-linear membership add-on pricing, per-line rounding ---
      - name: member_addon_pricing_per_line_rounding_mode_a
        grounds:
          - calculations.ticket_service_net_cents
          - entities.AddOn.fields.membership_discount_pct
          - entities.Membership.fields.addon_discount_pct
          - entities.ServiceMenuItem.fields.membership_included
        distinguishing_aspect: "Mode (a): service_net_cents=3718 with an ACTIVE member where the included Haircut is waived to 0, a non-included Shave stays 2000, and two 1010-cent add-ons each discounted 15% round per-line to 859 (sum 1718) — round-after-sum would give 1717, so per-line rounding is pinned and decided by >=3 interacting inputs (membership_status, membership_included, discount pct)."
        test_recipe:
          setup:
            - "Clock at 2026-06-10T08:00:00Z."
            - "Shop OPEN tax_rate_pct=8.5."
            - "Membership Gold addon_discount_pct=15 OFFERED; Customer subscribed (membership_status ACTIVE)."
            - "Service Haircut(3000, membership_included true); Service Shave(2000, not included); AddOn A(1010, discount 0); AddOn B(1010, discount 0)."
            - "Barber ACTIVE; Chair; Shift 09:00–18:00; appointment checked in => OPEN ticket; lines set to Haircut+Shave+A+B."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-10T08:00:00Z" }
              as: ShopOwner
            - call: "POST /shops"
              payload: { name: "Member Shop", tax_rate_pct: 8.5, default_booth_rent_cents: 0, default_commission_pct: 0 }
              as: ShopOwner
              captures: { shop_id: $.data.id }
            - call: "POST /memberships"
              payload: { shop_id: "${shop_id}", name: "Gold", monthly_fee_cents: 4000, addon_discount_pct: 15 }
              as: ShopOwner
              captures: { plan_id: $.data.id }
            - call: "POST /chairs"
              payload: { shop_id: "${shop_id}", label: "C1" }
              as: ShopOwner
              captures: { chair_id: $.data.id }
            - call: "POST /services"
              payload: { shop_id: "${shop_id}", name: "Haircut", price_cents: 3000, duration_minutes: 30, membership_included: true }
              as: ShopOwner
              captures: { hair_id: $.data.id }
            - call: "POST /services"
              payload: { shop_id: "${shop_id}", name: "Shave", price_cents: 2000, duration_minutes: 20 }
              as: ShopOwner
              captures: { shave_id: $.data.id }
            - call: "POST /addons"
              payload: { shop_id: "${shop_id}", name: "AddA", price_cents: 1010, extra_minutes: 5 }
              as: ShopOwner
              captures: { addon_a: $.data.id }
            - call: "POST /addons"
              payload: { shop_id: "${shop_id}", name: "AddB", price_cents: 1010, extra_minutes: 5 }
              as: ShopOwner
              captures: { addon_b: $.data.id }
            - call: "POST /barbers"
              payload: { shop_id: "${shop_id}", full_name: "Bo", license_number: "L1", license_expires_on: "2027-01-01", comp_model: "COMMISSION" }
              as: ShopOwner
              captures: { b_id: $.data.id }
            - call: "POST /barbers/${b_id}/license/activate"
              payload: {}
              as: ShopOwner
            - call: "GET /shops/${shop_id}"
              payload: {}
              as: ShopOwner
              captures: { shop_v: $.data.version }
            - call: "POST /shifts"
              payload: { shop_id: "${shop_id}", barber_id: "${b_id}", chair_id: "${chair_id}", start_utc: "2026-06-10T09:00:00Z", end_utc: "2026-06-10T18:00:00Z", expected_shop_version: "${shop_v}" }
              as: ShopOwner
            - call: "POST /customers"
              payload: { shop_id: "${shop_id}", full_name: "Cara", email: "cara@x.com" }
              as: ShopOwner
              captures: { cust_id: $.data.id }
            - call: "POST /customers/${cust_id}/subscribe"
              payload: { membership_id: "${plan_id}" }
              as: Receptionist
            - call: "POST /appointments"
              payload: { shop_id: "${shop_id}", customer_id: "${cust_id}", barber_id: "${b_id}", chair_id: "${chair_id}", service_item_id: "${hair_id}", start_utc: "2026-06-10T10:00:00Z" }
              as: Receptionist
              captures: { appt_id: $.data.id }
            - call: "POST /appointments/${appt_id}/check-in"
              payload: {}
              as: Receptionist
              captures: { tk_id: $.data.ticket_id }
            - call: "PUT /tickets/${tk_id}/lines"
              payload: { service_line_ids: ["${hair_id}", "${shave_id}"], addon_line_ids: ["${addon_a}", "${addon_b}"] }
              as: Receptionist
          trigger:
            - call: "POST /tickets/${tk_id}/checkout"
              payload: {}
              as: Receptionist
              captures: { svc_net: $.data.service_net_cents, tax: $.data.tax_cents, total: $.data.total_due_cents }
          assert:
            - "Ticket.service_net_cents == 3718"
            - "Ticket.tax_cents == 316"
            - "Ticket.total_due_cents == 4034"

      # --- Instance 2: MODE (b) — tax sum-then-round rounding order ---
      - name: ticket_tax_sum_then_round_mode_b
        grounds:
          - calculations.ticket_tax_and_total_cents
          - entities.Shop.fields.tax_rate_pct
          - entities.Ticket.fields.tax_cents
        distinguishing_aspect: "Mode (b): with service_net=850 and product_net=850 at 8.5% tax, sum-then-round gives tax_cents=145 (1700*0.085=144.5 -> 145) whereas tax-per-line then sum gives 144 (72+72); the scaffold pins sum-then-round, a different combinatorial axis than instance 1's per-line add-on rounding."
        test_recipe:
          setup:
            - "Clock at 2026-06-10T08:00:00Z."
            - "Shop OPEN tax_rate_pct=8.5."
            - "Service Trim(850,20m); Product Comb(850, stock 5); Barber ACTIVE; Chair; Shift 09:00–18:00; Customer no membership; checked-in OPEN ticket; lines Trim + Comb x1."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-10T08:00:00Z" }
              as: ShopOwner
            - call: "POST /shops"
              payload: { name: "Tax Shop", tax_rate_pct: 8.5, default_booth_rent_cents: 0, default_commission_pct: 0 }
              as: ShopOwner
              captures: { shop_id: $.data.id }
            - call: "POST /chairs"
              payload: { shop_id: "${shop_id}", label: "C1" }
              as: ShopOwner
              captures: { chair_id: $.data.id }
            - call: "POST /services"
              payload: { shop_id: "${shop_id}", name: "Trim", price_cents: 850, duration_minutes: 20 }
              as: ShopOwner
              captures: { trim_id: $.data.id }
            - call: "POST /products"
              payload: { shop_id: "${shop_id}", name: "Comb", price_cents: 850, stock_qty: 5 }
              as: ShopOwner
              captures: { comb_id: $.data.id }
            - call: "POST /barbers"
              payload: { shop_id: "${shop_id}", full_name: "Bo", license_number: "L1", license_expires_on: "2027-01-01", comp_model: "COMMISSION" }
              as: ShopOwner
              captures: { b_id: $.data.id }
            - call: "POST /barbers/${b_id}/license/activate"
              payload: {}
              as: ShopOwner
            - call: "GET /shops/${shop_id}"
              payload: {}
              as: ShopOwner
              captures: { shop_v: $.data.version }
            - call: "POST /shifts"
              payload: { shop_id: "${shop_id}", barber_id: "${b_id}", chair_id: "${chair_id}", start_utc: "2026-06-10T09:00:00Z", end_utc: "2026-06-10T18:00:00Z", expected_shop_version: "${shop_v}" }
              as: ShopOwner
            - call: "POST /customers"
              payload: { shop_id: "${shop_id}", full_name: "Cara", email: "cara@x.com" }
              as: ShopOwner
              captures: { cust_id: $.data.id }
            - call: "POST /appointments"
              payload: { shop_id: "${shop_id}", customer_id: "${cust_id}", barber_id: "${b_id}", chair_id: "${chair_id}", service_item_id: "${trim_id}", start_utc: "2026-06-10T10:00:00Z" }
              as: Receptionist
              captures: { appt_id: $.data.id }
            - call: "POST /appointments/${appt_id}/check-in"
              payload: {}
              as: Receptionist
              captures: { tk_id: $.data.ticket_id }
            - call: "PUT /tickets/${tk_id}/lines"
              payload: { service_line_ids: ["${trim_id}"], product_lines: [{ product_sku_id: "${comb_id}", qty: 1 }] }
              as: Receptionist
          trigger:
            - call: "POST /tickets/${tk_id}/checkout"
              payload: {}
              as: Receptionist
              captures: { tax: $.data.tax_cents, total: $.data.total_due_cents }
          assert:
            - "Ticket.service_net_cents == 850"
            - "Ticket.product_net_cents == 850"
            - "Ticket.tax_cents == 145"
            - "Ticket.total_due_cents == 1845"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      # --- Instance 1: license cycle ACTIVE<->SUSPENDED on Barber ---
      - name: barber_license_active_suspended_cycle
        grounds:
          - state_machines.Barber.ACTIVE_to_SUSPENDED
          - state_machines.Barber.SUSPENDED_to_ACTIVE
          - entities.Barber.fields.license_status
        distinguishing_aspect: "Barber.license_status forms a true cycle ACTIVE -> SUSPENDED -> ACTIVE (re-activation allowed), a non-linear shape on the Barber entity; suspend cascades cancellation of future BOOKED appointments while re-activation does not."
        test_recipe:
          setup:
            - "Clock at 2026-06-10T08:00:00Z; Shop OPEN; Barber ACTIVE with license_expires_on 2027-01-01."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-10T08:00:00Z" }
              as: ShopOwner
            - call: "POST /shops"
              payload: { name: "Cycle Shop", tax_rate_pct: 0, default_booth_rent_cents: 0, default_commission_pct: 0 }
              as: ShopOwner
              captures: { shop_id: $.data.id }
            - call: "POST /barbers"
              payload: { shop_id: "${shop_id}", full_name: "Bo", license_number: "L1", license_expires_on: "2027-01-01", comp_model: "COMMISSION" }
              as: ShopOwner
              captures: { b_id: $.data.id }
            - call: "POST /barbers/${b_id}/license/activate"
              payload: {}
              as: ShopOwner
            - call: "POST /barbers/${b_id}/license/suspend"
              payload: {}
              as: ShopOwner
              captures: { st_suspended: $.data.license_status }
          trigger:
            - call: "POST /barbers/${b_id}/license/activate"
              payload: {}
              as: ShopOwner
              captures: { st_reactivated: $.data.license_status }
          assert:
