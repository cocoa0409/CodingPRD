  # ===========================================================================
  - section: rbac
    instances:
      - name: corner_technician_cannot_register_instrument
        claim_type: peer_roles
        grounds:
          - roles.Technician
          - roles.QualityEngineer
          - errors[ERR_FORBIDDEN_ROLE]
        distinguishing_aspect: "Technician POSTing /instruments (a QualityEngineer-exclusive op) → 403 ERR_FORBIDDEN_ROLE."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /instruments"
              payload: { asset_tag: "INST-RB", description: "RB gauge", nominal_value: 10.0, tolerance_plus: 0.1, tolerance_minus: 0.1, measurement_unit: "mm", calibration_interval_epochs: 30, criticality: "MAJOR" }
              as: Technician
              captures: { err: $.data.error_id }
          assert:
            - "create response status code == 403"
            - "create response data.error_id == ERR_FORBIDDEN_ROLE"

      - name: corner_quality_engineer_cannot_register_standard
        claim_type: peer_roles
        grounds:
          - roles.QualityEngineer
          - roles.Metrologist
          - errors[ERR_FORBIDDEN_ROLE]
        distinguishing_aspect: "QualityEngineer POSTing /calibration-standards (a Metrologist-exclusive op) → 403 ERR_FORBIDDEN_ROLE."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /calibration-standards"
              payload: { name: "S-RB", nist_test_number: "NIST-RB", nominal_value: 1.0, standard_unit: "mm", uncertainty: 0.001, certified_through_epoch: 9999 }
              as: QualityEngineer
              captures: { err: $.data.error_id }
          assert:
            - "create response status code == 403"
            - "create response data.error_id == ERR_FORBIDDEN_ROLE"

      - name: corner_missing_user_context_header
        claim_type: peer_roles
        grounds:
          - validations[priority=1]
          - errors[ERR_MISSING_USER_CONTEXT]
        distinguishing_aspect: "A request with no X-User-Role/X-User-ID → 401 ERR_MISSING_USER_CONTEXT (auth precedes everything)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /instruments"
              payload: {}
              as: Anonymous
              captures: { err: $.data.error_id }
          assert:
            - "GET response status code == 401"
            - "GET response data.error_id == ERR_MISSING_USER_CONTEXT"

      - name: corner_segregation_of_duties_denial
        claim_type: Segregation of duties
        grounds:
          - validations[priority=14]
          - errors[ERR_SEGREGATION_OF_DUTIES]
        distinguishing_aspect: "A QualityEngineer whose X-User-ID equals the triggering event's performed_by_user_id investigating the impact → 403 ERR_SEGREGATION_OF_DUTIES."
        test_recipe:
          setup: ["FAILED event performed by user 'shared-1'; the same user id acts as QualityEngineer on investigate."]
          setup_api_calls:
            - call: "POST /calibration-standards"
              payload: { name: "S-SOD", nist_test_number: "NIST-SOD", nominal_value: 25.0, standard_unit: "mm", uncertainty: 0.001, certified_through_epoch: 9999 }
              as: Metrologist
              captures: { std_id: $.data.id }
            - call: "POST /instruments"
              payload: { asset_tag: "INST-SOD", description: "SOD gauge", nominal_value: 25.0, tolerance_plus: 0.05, tolerance_minus: 0.05, measurement_unit: "mm", calibration_interval_epochs: 100, criticality: "CRITICAL" }
              as: QualityEngineer
              as_user_id: "qe-0"
              captures: { inst_id: $.data.id, inst_v: $.data.version }
            - call: "POST /instruments/${inst_id}/calibration-events"
              payload: { standard_id: "${std_id}", scheduled_epoch: 5, expected_instrument_version: "${inst_v}" }
              as: Technician
              as_user_id: "shared-1"
              captures: { ev: $.data.id }
            - call: "POST /calibration-events/${ev}/measurement-points"
              payload: { point_label: "P1", nominal: 25.0, tol_plus: 0.05, tol_minus: 0.05, as_found_value: 25.40, as_left_value: 25.40 }
              as: Technician
              as_user_id: "shared-1"
            - call: "POST /calibration-events/${ev}/start"
              payload: {}
              as: Technician
              as_user_id: "shared-1"
            - call: "POST /calibration-events/${ev}/finalize"
              payload: {}
              as: Technician
              as_user_id: "shared-1"
            - call: "GET /instruments/${inst_id}/impacts"
              payload: {}
              as: QualityEngineer
              as_user_id: "qe-0"
              captures: { impact_id: "$.data[0].id" }
          trigger:
            - call: "POST /impacts/${impact_id}/investigate"
              payload: {}
              as: QualityEngineer
              as_user_id: "shared-1"
              captures: { err: $.data.error_id }
          assert:
            - "investigate response status code == 403"
            - "investigate response data.error_id == ERR_SEGREGATION_OF_DUTIES"

  # ===========================================================================
  - section: cross_cutting_complexity_layers
    instances:
      - name: corner_occ_stale_instrument_version_on_event_create
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[cal-event-create-stale-instrument]
          - errors[ERR_STALE_INSTRUMENT_VERSION]
        distinguishing_aspect: "Creating a second calibration event with a stale expected_instrument_version (one less than current, after a finalize bumped it) → 412 ERR_STALE_INSTRUMENT_VERSION."
        test_recipe:
          setup: ["Instrument created (version captured); first event PASSED (finalize bumps instrument version); second create uses the pre-finalize version."]
          setup_api_calls:
            - call: "POST /calibration-standards"
              payload: { name: "S-OCC", nist_test_number: "NIST-OCC", nominal_value: 25.0, standard_unit: "mm", uncertainty: 0.001, certified_through_epoch: 9999 }
              as: Metrologist
              captures: { std_id: $.data.id }
            - call: "POST /instruments"
              payload: { asset_tag: "INST-OCC", description: "OCC gauge", nominal_value: 25.0, tolerance_plus: 0.05, tolerance_minus: 0.05, measurement_unit: "mm", calibration_interval_epochs: 100, criticality: "MAJOR" }
              as: QualityEngineer
              captures: { inst_id: $.data.id, inst_v0: $.data.version }
            - call: "POST /instruments/${inst_id}/calibration-events"
              payload: { standard_id: "${std_id}", scheduled_epoch: 5, expected_instrument_version: "${inst_v0}" }
              as: Technician
              captures: { ev: $.data.id }
            - call: "POST /calibration-events/${ev}/measurement-points"
              payload: { point_label: "P1", nominal: 25.0, tol_plus: 0.05, tol_minus: 0.05, as_found_value: 25.00 }
              as: Technician
            - call: "POST /calibration-events/${ev}/start"
              payload: {}
              as: Technician
            - call: "POST /calibration-events/${ev}/finalize"
              payload: {}
              as: Technician
            - call: "GET /instruments/${inst_id}"
              payload: {}
              as: QualityEngineer
              captures: { inst_v_now: $.data.version }
          trigger:
            - call: "POST /instruments/${inst_id}/calibration-events"
              payload: { standard_id: "${std_id}", scheduled_epoch: 6, expected_instrument_version: "${inst_v0}" }
              as: Technician
              captures: { err: $.data.error_id }
          assert:
            - "second create response status code == 412"
            - "second create response data.error_id == ERR_STALE_INSTRUMENT_VERSION"

      - name: corner_occ_correct_version_on_gage_rr_create_succeeds
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[gage-rr-open-stale-instrument]
          - endpoints["POST /instruments/{id}/gage-rr-studies"]
        distinguishing_aspect: "Creating a gage R&R study with the CURRENT expected_instrument_version → 201 success; instrument.version unchanged by the create (study create does not bump instrument)."
        test_recipe:
          setup: ["A freshly registered ACTIVE instrument; version read."]
          setup_api_calls:
            - call: "POST /instruments"
              payload: { asset_tag: "INST-OCC2", description: "OCC2 gauge", nominal_value: 5.0, tolerance_plus: 1.0, tolerance_minus: 1.0, measurement_unit: "mm", calibration_interval_epochs: 100, criticality: "MAJOR" }
              as: QualityEngineer
              captures: { inst_id: $.data.id, inst_v: $.data.version }
          trigger:
            - call: "POST /instruments/${inst_id}/gage-rr-studies"
              payload: { operator_count: 2, part_count: 2, trial_count: 2, process_tolerance: 10.0, expected_instrument_version: "${inst_v}" }
              as: QualityEngineer
              captures: { study_id: $.data.id, st: $.data.status }
          assert:
            - "create response status code == 201"
            - "GageRRStudy.${study_id}.status == DRAFT"

      - name: corner_derived_next_due_recompute_on_recalibration
        claim_type: derived_field_reconciliation
        grounds:
          - calculations.next_due_epoch
          - entities.Instrument.fields.next_due_epoch
        distinguishing_aspect: "A second PASSED calibration at a later epoch moves next_due_epoch forward: cal at epoch 5 then epoch 40 (interval 10) → next_due_epoch 50 (recomputed, not stale 15)."
        test_recipe:
          setup: ["Instrument interval 10; first PASS at epoch 5 (next_due 15); second PASS at epoch 40."]
          setup_api_calls:
            - call: "POST /calibration-standards"
              payload: { name: "S-DR", nist_test_number: "NIST-DR", nominal_value: 25.0, standard_unit: "mm", uncertainty: 0.001, certified_through_epoch: 9999 }
              as: Metrologist
              captures: { std_id: $.data.id }
            - call: "POST /instruments"
              payload: { asset_tag: "INST-DR", description: "DR gauge", nominal_value: 25.0, tolerance_plus: 0.05, tolerance_minus: 0.05, measurement_unit: "mm", calibration_interval_epochs: 10, criticality: "MAJOR" }
              as: QualityEngineer
              captures: { inst_id: $.data.id, inst_v: $.data.version }
            - call: "POST /instruments/${inst_id}/calibration-events"
              payload: { standard_id: "${std_id}", scheduled_epoch: 5, expected_instrument_version: "${inst_v}" }
              as: Technician
              captures: { ev1: $.data.id }
            - call: "POST /calibration-events/${ev1}/measurement-points"
              payload: { point_label: "P1", nominal: 25.0, tol_plus: 0.05, tol_minus: 0.05, as_found_value: 25.00 }
              as: Technician
            - call: "POST /calibration-events/${ev1}/start"
              payload: {}
              as: Technician
            - call: "POST /calibration-events/${ev1}/finalize"
              payload: {}
              as: Technician
            - call: "GET /instruments/${inst_id}"
              payload: {}
              as: QualityEngineer
              captures: { inst_v2: $.data.version }
            - call: "POST /instruments/${inst_id}/calibration-events"
              payload: { standard_id: "${std_id}", scheduled_epoch: 40, expected_instrument_version: "${inst_v2}" }
              as: Technician
              captures: { ev2: $.data.id }
            - call: "POST /calibration-events/${ev2}/measurement-points"
              payload: { point_label: "P1", nominal: 25.0, tol_plus: 0.05, tol_minus: 0.05, as_found_value: 25.00 }
              as: Technician
            - call: "POST /calibration-events/${ev2}/start"
              payload: {}
              as: Technician
          trigger:
            - call: "POST /calibration-events/${ev2}/finalize"
              payload: {}
              as: Technician
            - call: "GET /instruments/${inst_id}"
              payload: {}
              as: QualityEngineer
              captures: { ndue: $.data.next_due_epoch, lce: $.data.last_calibration_epoch }
          assert:
            - "Instrument.${inst_id}.last_calibration_epoch == 40"
            - "Instrument.${inst_id}.next_due_epoch == 50"

  # ===========================================================================
  - section: consistency_model
    instances:
      - name: corner_immediate_consistency_cascade_visible_in_same_flow
        claim_type: immediate
        grounds:
          - state_machines.CalibrationEvent.IN_PROGRESS_to_FAILED
          - entities.Instrument.fields.calibration_status
        distinguishing_aspect: "The finalize-FAIL response and an immediately following GET reflect the cascaded instrument QUARANTINED / OUT_OF_TOLERANCE state in the same request flow (immediate consistency)."
        test_recipe:
          setup: ["ACTIVE instrument with an IN_PROGRESS event whose point fails."]
          setup_api_calls:
            - call: "POST /calibration-standards"
              payload: { name: "S-IM", nist_test_number: "NIST-IM", nominal_value: 25.0, standard_unit: "mm", uncertainty: 0.001, certified_through_epoch: 9999 }
              as: Metrologist
              captures: { std_id: $.data.id }
            - call: "POST /instruments"
              payload: { asset_tag: "INST-IM", description: "IM gauge", nominal_value: 25.0, tolerance_plus: 0.05, tolerance_minus: 0.05, measurement_unit: "mm", calibration_interval_epochs: 100, criticality: "CRITICAL" }
              as: QualityEngineer
              captures: { inst_id: $.data.id, inst_v: $.data.version }
            - call: "POST /instruments/${inst_id}/calibration-events"
              payload: { standard_id: "${std_id}", scheduled_epoch: 5, expected_instrument_version: "${inst_v}" }
              as: Technician
              captures: { ev: $.data.id }
            - call: "POST /calibration-events/${ev}/measurement-points"
              payload: { point_label: "P1", nominal: 25.0, tol_plus: 0.05, tol_minus: 0.05, as_found_value: 25.40, as_left_value: 25.40 }
              as: Technician
            - call: "POST /calibration-events/${ev}/start"
              payload: {}
              as: Technician
          trigger:
            - call: "POST /calibration-events/${ev}/finalize"
              payload: {}
              as: Technician
            - call: "GET /instruments/${inst_id}"
              payload: {}
              as: QualityEngineer
              captures: { lc: $.data.lifecycle_status, cs: $.data.calibration_status }
          assert:
            - "immediately after finalize, Instrument.${inst_id}.lifecycle_status == QUARANTINED"
            - "immediately after finalize, Instrument.${inst_id}.calibration_status == OUT_OF_TOLERANCE"
