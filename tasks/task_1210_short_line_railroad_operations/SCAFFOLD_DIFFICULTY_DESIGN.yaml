scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: car_hire_provisional_vs_final
        grounds:
          - calculations.car_hire_accrual
          - entities.CarHireStatement.fields.provisional_amount_cents
          - entities.CarHireStatement.fields.final_amount_cents
          - state_machines.InterchangeEvent.REPORTED_to_CONFIRMED
        distinguishing_aspect: |
          Dual-variant logic on the CAR HIRE domain (Railcar/CarHireStatement): the same accrual window
          yields a provisional estimate of 28800 cents (time-only) but a final amount of 39000 cents
          (time + mileage + minimum floor) once the car is delivered — same entity, same hours, two
          sanctioned algorithms, different money.
        test_recipe:
          setup:
            - "FOREIGN railcar GNWR 9001 with hire rates 120 cents/hour and 85 cents/mile"
            - "RECEIVED interchange confirmed at the default clock 2026-05-01T00:00:00Z, opening a CarHireStatement"
            - "clock advanced to 2026-05-11T00:00:00Z (240 accrued hours)"
          setup_api_calls:
            - call: "POST /rail/railcars"
              payload: { reporting_mark: "GNWR 9001", car_type: HOPPER, ownership: FOREIGN, hire_rate_per_hour_cents: 120, hire_rate_per_mile_cents: 85, home_road_mark: "CSX" }
              as: SystemAdmin
              captures: { rc_id: $.data.id }
            - call: "POST /rail/interchange-events"
              payload: { class_i_partner: "CSX", direction: RECEIVED, railcar_id: "${rc_id}" }
              as: Dispatcher
              captures: { ev_id: $.data.id }
            - call: "POST /rail/interchange-events/${ev_id}/confirm"
              payload: {}
              as: SettlementClerk
            - call: "POST /rail/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-11T00:00:00Z" }
              as: SystemAdmin
          trigger:
            - call: "GET /rail/car-hire-statements"
              payload: { railcar_id: "${rc_id}" }
              as: SettlementClerk
              captures: { stmt_id: "$.data[0].id", prov_amount: "$.data[0].provisional_amount_cents" }
            - call: "POST /rail/interchange-events"
              payload: { class_i_partner: "CSX", direction: DELIVERED, railcar_id: "${rc_id}", miles_traveled_on_line: 120 }
              as: Dispatcher
              captures: { ev2_id: $.data.id }
            - call: "POST /rail/interchange-events/${ev2_id}/confirm"
              payload: {}
              as: SettlementClerk
            - call: "GET /rail/car-hire-statements/${stmt_id}"
              payload: {}
              as: SettlementClerk
              captures: { final_amount: $.data.final_amount_cents, stmt_status: $.data.status }
          assert:
            - "captured prov_amount == 28800 (240 hours * 120 cents, mileage excluded)"
            - "captured final_amount == 39000 (240*120 + 120*85 = 28800 + 10200, above the 3600 floor)"
            - "prov_amount != final_amount"
            - "captured stmt_status == CLOSED"
            - "CarHireStatement.${stmt_id}.accrued_hours == 240"
            - "CarHireStatement.${stmt_id}.accrued_miles == 120"

      - name: revenue_division_prorate_vs_agreed
        grounds:
          - calculations.revenue_division_share
          - entities.RevenueDivision.fields.our_share_cents
          - state_machines.RevenueDivision
        distinguishing_aspect: |
          Dual-variant logic on the REVENUE domain (Waybill/RevenueDivision), a different entity domain
          than car hire: two identical 100-ton GRAIN through waybills (our 87 of 241 miles) split
          3850000 cents differently — mileage prorate yields our_share 1389834 while an agreed 0.35
          percentage yields 1347500, a divergence of 42334 cents on identical inputs.
        test_recipe:
          setup:
            - "customer and two HOME railcars"
            - "two identical GRAIN 100-ton through waybills (our_miles 87, total_miles 241), both RATED at 3850000 cents"
          setup_api_calls:
            - call: "POST /rail/customers"
              payload: { name: "Lake Grain Coop", billing_email: "ap@lakegrain.example" }
              as: SystemAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /rail/railcars"
              payload: { reporting_mark: "GNWR 6001", car_type: HOPPER, ownership: HOME, hire_rate_per_hour_cents: 0, hire_rate_per_mile_cents: 0 }
              as: SystemAdmin
              captures: { rc1_id: $.data.id }
            - call: "POST /rail/railcars"
              payload: { reporting_mark: "GNWR 6002", car_type: HOPPER, ownership: HOME, hire_rate_per_hour_cents: 0, hire_rate_per_mile_cents: 0 }
              as: SystemAdmin
              captures: { rc2_id: $.data.id }
            - call: "POST /rail/waybills"
              payload: { railcar_id: "${rc1_id}", origin_customer_id: "${cust_id}", destination: "CSX Buffalo Frontier Yard", commodity: GRAIN, weight_tons: 100, through_route: true, our_miles: 87, total_miles: 241 }
              as: Dispatcher
              captures: { wb1_id: $.data.id }
            - call: "POST /rail/waybills/${wb1_id}/rate"
              payload: {}
              as: SettlementClerk
            - call: "POST /rail/waybills"
              payload: { railcar_id: "${rc2_id}", origin_customer_id: "${cust_id}", destination: "CSX Buffalo Frontier Yard", commodity: GRAIN, weight_tons: 100, through_route: true, our_miles: 87, total_miles: 241 }
              as: Dispatcher
              captures: { wb2_id: $.data.id }
            - call: "POST /rail/waybills/${wb2_id}/rate"
              payload: {}
              as: SettlementClerk
          trigger:
            - call: "POST /rail/revenue-divisions"
              payload: { waybill_id: "${wb1_id}", basis: MILEAGE_PRORATE }
              as: SettlementClerk
              captures: { div1_id: $.data.id, div1_our: $.data.our_share_cents, div1_conn: $.data.connecting_share_cents }
            - call: "POST /rail/revenue-divisions"
              payload: { waybill_id: "${wb2_id}", basis: AGREED_PERCENTAGE, agreed_pct: 0.35 }
              as: SettlementClerk
              captures: { div2_id: $.data.id, div2_our: $.data.our_share_cents, div2_conn: $.data.connecting_share_cents }
          assert:
            - "captured div1_our == 1389834 (round_half_up(3850000 * 87 / 241))"
            - "captured div1_conn == 2460166 (3850000 - 1389834)"
            - "captured div2_our == 1347500 (round_half_up(3850000 * 0.35))"
            - "captured div2_conn == 2502500"
            - "div1_our != div2_our (delta 42334 on identical waybill economics)"
            - "div1_our + div1_conn == 3850000 and div2_our + div2_conn == 3850000"

  - rule_id: combinatorial_formula
    instances:
      - name: hos_availability_nested_min_mode_a
        grounds:
          - calculations.hos_availability
          - entities.CrewMember.fields.hos_available_minutes
        distinguishing_aspect: |
          Mode (a) combinatorial formula: hos_available_minutes = min(720 - rolling_24h, 16560 - month)
          with three inputs and nested min/max — with rolling=700 and month=16500 the daily term governs
          (20); raising month to 16559 makes the monthly term govern (1), proving both branches of the min.
        test_recipe:
          setup:
            - "crew member exists with version captured; accumulators corrected via adjust-hos"
          setup_api_calls:
            - call: "POST /rail/crew-members"
              payload: { name: "A. Engineer", craft: ENGINEER }
              as: SystemAdmin
              captures: { mem_id: $.data.id, mem_v: $.data.version }
            - call: "POST /rail/crew-members/${mem_id}/adjust-hos"
              payload: { rolling_24h_minutes: 700, month_minutes: 16500, expected_crew_member_version: "${mem_v}" }
              as: CrewCaller
              captures: { mem_v2: $.data.version }
            - call: "GET /rail/crew-members/${mem_id}"
              payload: {}
              as: CrewCaller
              captures: { avail_first: $.data.hos_available_minutes }
            - call: "POST /rail/crew-members/${mem_id}/adjust-hos"
              payload: { month_minutes: 16559, expected_crew_member_version: "${mem_v2}" }
              as: CrewCaller
          trigger:
            - call: "GET /rail/crew-members/${mem_id}"
              payload: {}
              as: CrewCaller
              captures: { avail_second: $.data.hos_available_minutes }
          assert:
            - "captured avail_first == 20 (min(720-700, 16560-16500) = min(20, 60))"
            - "captured avail_second == 1 (min(720-700, 16560-16559) = min(20, 1))"
            - "the monthly term, not the daily term, governs the second reading"

      - name: revenue_division_rounding_order_mode_b
        grounds:
          - calculations.revenue_division_share
          - entities.RevenueDivision.fields.connecting_share_cents
        distinguishing_aspect: |
          Mode (b) nested rounding: with total 115500 cents over 1 of 8 miles, rounding our share first
          (14437.5 -> 14438) and giving the connector the remainder (101062) sums exactly to the total;
          independently rounding both shares would give 101063 and break conservation — the scaffold pins
          the round-ours-first order.
        test_recipe:
          setup:
            - "customer, railcar, and a GRAIN 3-ton through waybill (our_miles 1, total_miles 8) RATED at 115500 cents"
          setup_api_calls:
            - call: "POST /rail/customers"
              payload: { name: "Short Line Shipper", billing_email: "billing@sls.example" }
              as: SystemAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /rail/railcars"
              payload: { reporting_mark: "GNWR 6010", car_type: BOX, ownership: HOME, hire_rate_per_hour_cents: 0, hire_rate_per_mile_cents: 0 }
              as: SystemAdmin
              captures: { rc_id: $.data.id }
            - call: "POST /rail/waybills"
              payload: { railcar_id: "${rc_id}", origin_customer_id: "${cust_id}", destination: "NS Erie", commodity: GRAIN, weight_tons: 3, through_route: true, our_miles: 1, total_miles: 8 }
              as: Dispatcher
              captures: { wb_id: $.data.id }
            - call: "POST /rail/waybills/${wb_id}/rate"
              payload: {}
              as: SettlementClerk
          trigger:
            - call: "POST /rail/revenue-divisions"
              payload: { waybill_id: "${wb_id}", basis: MILEAGE_PRORATE }
              as: SettlementClerk
              captures: { div_our: $.data.our_share_cents, div_conn: $.data.connecting_share_cents }
          assert:
            - "captured div_our == 14438 (round_half_up(115500 / 8) = round_half_up(14437.5))"
            - "captured div_conn == 101062 (total minus rounded our share, NOT round_half_up(101062.5) = 101063)"
            - "div_our + div_conn == 115500 (conservation holds by construction of the pinned order)"

      - name: grant_drawdown_pinned_evaluation_order_mode_c
        grounds:
          - calculations.grant_drawdown
          - calculations.project_percent_complete
          - entities.GrantProject.fields.remaining_cents
        distinguishing_aspect: |
          Mode (c) circular-looking dependency: milestone 2's drawdown caps against award remaining, which
          itself is award minus committed minus drawn — the scaffold pins evaluation order (read project
          aggregates BEFORE adding this milestone's drawdown), so milestone 2 (value 400000, cost 200000,
          match 20 pct) draws exactly 160000 against a remaining of 600000, leaving 440000.
        test_recipe:
          setup:
            - "ACTIVE grant project: award 1000000 cents, match 20 pct"
            - "milestone 1 (value 400000, actual cost 500000) APPROVED with drawdown 400000"
            - "milestone 2 (value 400000) SUBMITTED with actual cost 200000"
          setup_api_calls:
            - call: "POST /rail/grant-projects"
              payload: { title: "Bridge 42.1 Rehabilitation", grantor: "FRA CRISI", award_amount_cents: 1000000, required_match_pct: 20 }
              as: GrantManager
              captures: { proj_id: $.data.id }
            - call: "POST /rail/grant-projects/${proj_id}/activate"
              payload: {}
              as: GrantManager
            - call: "POST /rail/grant-projects/${proj_id}/milestones"
              payload: { name: "Timber replacement", milestone_value_cents: 400000 }
              as: GrantManager
              captures: { m1_id: $.data.id }
            - call: "POST /rail/grant-milestones/${m1_id}/submit"
              payload: { actual_cost_cents: 500000 }
              as: GrantManager
            - call: "POST /rail/grant-milestones/${m1_id}/approve"
              payload: {}
              as: RegulatorOfficer
              captures: { m1_dd: $.data.drawdown_cents }
            - call: "POST /rail/grant-projects/${proj_id}/milestones"
              payload: { name: "Steel repairs", milestone_value_cents: 400000 }
              as: GrantManager
              captures: { m2_id: $.data.id }
            - call: "POST /rail/grant-milestones/${m2_id}/submit"
              payload: { actual_cost_cents: 200000 }
              as: GrantManager
          trigger:
            - call: "POST /rail/grant-milestones/${m2_id}/approve"
              payload: {}
              as: RegulatorOfficer
              captures: { m2_dd: $.data.drawdown_cents }
            - call: "GET /rail/grant-projects/${proj_id}"
              payload: {}
              as: GrantManager
              captures: { p_committed: $.data.committed_cents, p_remaining: $.data.remaining_cents, p_pct: $.data.percent_complete }
          assert:
            - "captured m1_dd == 400000 (min(400000, round(500000*0.8)=400000, 1000000))"
            - "captured m2_dd == 160000 (min(400000, round(200000*0.8)=160000, 600000))"
            - "captured p_committed == 560000 (both milestones APPROVED, none PAID)"
            - "captured p_remaining == 440000 (1000000 - 560000 - 0)"
            - "captured p_pct == 80.00 (800000 of 1000000 approved value)"

  - rule_id: non_linear_state_machine
    instances:
      - name: crew_member_duty_rest_cycle
        grounds:
          - state_machines.CrewMember
          - state_machines.CrewCall.ACCEPTED_to_ON_DUTY
          - state_machines.CrewCall.ON_DUTY_to_RELIEVED
          - calculations.hos_availability
        distinguishing_aspect: |
          Cyclic machine on CrewMember: AVAILABLE -> ON_DUTY -> RESTING -> AVAILABLE, where the final
          loop-closing hop is executed by the logical-clock sweep once 600 rest minutes have elapsed;
          after a 600-minute duty the member's hos_available_minutes is 120.
        test_recipe:
          setup:
            - "crew member with an ACCEPTED crew call whose window starts 2026-05-01T06:00:00Z"
            - "clock at 2026-05-01T06:00:00Z"
          setup_api_calls:
            - call: "POST /rail/crew-members"
              payload: { name: "C. Conductor", craft: CONDUCTOR }
              as: SystemAdmin
              captures: { mem_id: $.data.id }
            - call: "POST /rail/track-segments"
              payload: { name: "Main MP 10-14", milepost_start: 10, milepost_end: 14, fra_class: CLASS_3 }
              as: SystemAdmin
              captures: { seg_id: $.data.id }
            - call: "POST /rail/train-movements"
              payload: { symbol: "GW-201", route_segment_ids: ["${seg_id}"] }
              as: Dispatcher
              captures: { mov_id: $.data.id }
            - call: "POST /rail/crew-calls"
              payload: { crew_member_id: "${mem_id}", movement_id: "${mov_id}", scheduled_start_at: "2026-05-01T06:00:00Z", scheduled_end_at: "2026-05-01T16:00:00Z" }
              as: CrewCaller
              captures: { call_id: $.data.id }
            - call: "POST /rail/crew-calls/${call_id}/respond"
              payload: { response: "ACCEPTED" }
              as: Conductor
              as_user_id: "${mem_id}"
            - call: "POST /rail/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T06:00:00Z" }
              as: SystemAdmin
          trigger:
            - call: "POST /rail/crew-calls/${call_id}/report-on-duty"
              payload: {}
              as: Conductor
              as_user_id: "${mem_id}"
            - call: "POST /rail/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T16:00:00Z" }
              as: SystemAdmin
            - call: "POST /rail/crew-calls/${call_id}/relieve"
              payload: {}
              as: CrewCaller
              captures: { call_minutes: $.data.actual_on_duty_minutes }
            - call: "GET /rail/crew-members/${mem_id}"
              payload: {}
              as: CrewCaller
              captures: { mem_status_resting: $.data.status }
            - call: "POST /rail/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-02T02:00:00Z" }
              as: SystemAdmin
            - call: "GET /rail/crew-members/${mem_id}"
              payload: {}
              as: CrewCaller
              captures: { mem_status_final: $.data.status, mem_avail: $.data.hos_available_minutes }
          assert:
            - "captured call_minutes == 600"
            - "captured mem_status_resting == RESTING"
            - "captured mem_status_final == AVAILABLE (sweep closed the cycle after exactly 600 rest minutes)"
            - "captured mem_avail == 120 (min(720-600, 16560-600))"
            - "CrewMember.${mem_id}.rest_minutes_completed == null after the sweep"

      - name: incident_close_reopen_cycle
        grounds:
          - state_machines.Incident
          - entities.Incident.fields.fra_reportable
        distinguishing_aspect: |
          Cyclic machine on Incident (different entity than CrewMember): a reportable DERAILMENT runs
          REPORTED -> INVESTIGATING -> FRA_FILED -> CLOSED -> REOPENED -> INVESTIGATING -> FRA_FILED ->
          CLOSED, proving CLOSED is not absorbing and the loop can be traversed twice.
        test_recipe:
          setup:
            - "track segment exists; derailment incident with damage 2000000 cents (fra_reportable true)"
          setup_api_calls:
            - call: "POST /rail/track-segments"
              payload: { name: "Yard Lead 1", milepost_start: 0, milepost_end: 1.5, fra_class: CLASS_1 }
              as: SystemAdmin
              captures: { seg_id: $.data.id }
            - call: "POST /rail/incidents"
              payload: { incident_type: DERAILMENT, segment_id: "${seg_id}", occurred_at: "2026-05-01T08:00:00Z", estimated_damage_cents: 2000000, injuries_count: 0 }
              as: Dispatcher
              captures: { inc_id: $.data.id, inc_reportable: $.data.fra_reportable }
            - call: "POST /rail/incidents/${inc_id}/investigate"
              payload: {}
              as: Dispatcher
            - call: "POST /rail/incidents/${inc_id}/file-fra-report"
              payload: {}
              as: RegulatorOfficer
              captures: { inc_fra_num: $.data.fra_report_number }
            - call: "POST /rail/incidents/${inc_id}/close"
              payload: {}
              as: RegulatorOfficer
          trigger:
            - call: "POST /rail/incidents/${inc_id}/reopen"
              payload: {}
              as: RegulatorOfficer
              captures: { st_reopened: $.data.status }
            - call: "POST /rail/incidents/${inc_id}/investigate"
              payload: {}
              as: Dispatcher
              captures: { st_investigating: $.data.status }
            - call: "POST /rail/incidents/${inc_id}/file-fra-report"
              payload: {}
              as: RegulatorOfficer
            - call: "POST /rail/incidents/${inc_id}/close"
              payload: {}
              as: RegulatorOfficer
              captures: { st_closed: $.data.status }
          assert:
            - "captured inc_reportable == true (DERAILMENT is always reportable)"
            - "captured inc_fra_num is non-null after first filing"
            - "captured st_reopened == REOPENED"
            - "captured st_investigating == INVESTIGATING"
            - "captured st_closed == CLOSED (second loop traversal completed)"

  - rule_id: transitive_cascade
    instances:
      - name: critical_defect_cascade_depth4
        grounds:
          - state_machines.TrackInspection.SCHEDULED_to_DEFECT_FILED
          - state_machines.TrackSegment.IN_SERVICE_to_RESTRICTED
          - state_machines.TrainMovement.PLANNED_to_ANNULLED
          - state_machines.CrewCall.CALLED_to_EXPIRED
          - calculations.effective_speed_limit
        distinguishing_aspect: |
          Depth-4 cascade from a single trigger (inspection filing): DEFECT_FILED mutates TrackSegment
          (RESTRICTED, speed 40 -> 10); that segment mutation annuls the PLANNED TrainMovement; the
          movement annulment expires its CALLED CrewCall — each hop caused by the previous mutation,
          not by the original POST.
        test_recipe:
          setup:
            - "CLASS_3 segment (speed 40), a PLANNED movement routed over it, and a CALLED crew call on that movement"
          setup_api_calls:
            - call: "POST /rail/track-segments"
              payload: { name: "Main MP 20-26", milepost_start: 20, milepost_end: 26, fra_class: CLASS_3 }
              as: SystemAdmin
              captures: { seg_id: $.data.id }
            - call: "POST /rail/train-movements"
              payload: { symbol: "GW-301", route_segment_ids: ["${seg_id}"] }
              as: Dispatcher
              captures: { mov_id: $.data.id }
            - call: "POST /rail/crew-members"
              payload: { name: "D. Engineer", craft: ENGINEER }
              as: SystemAdmin
              captures: { mem_id: $.data.id }
            - call: "POST /rail/crew-calls"
              payload: { crew_member_id: "${mem_id}", movement_id: "${mov_id}", scheduled_start_at: "2026-05-02T06:00:00Z", scheduled_end_at: "2026-05-02T18:00:00Z" }
              as: CrewCaller
              captures: { call_id: $.data.id }
            - call: "POST /rail/track-inspections"
              payload: { segment_id: "${seg_id}", scheduled_date: "2026-05-01" }
              as: TrackInspector
              captures: { insp_id: $.data.id }
          trigger:
            - call: "POST /rail/track-inspections/${insp_id}/file"
              payload: { defect_found: true, defect_severity: CRITICAL, findings: "crushed rail head at MP 23.2" }
              as: TrackInspector
          assert:
            - "TrackInspection.${insp_id}.status == DEFECT_FILED"
            - "TrackSegment.${seg_id}.status == RESTRICTED"
            - "TrackSegment.${seg_id}.defect_open == true"
            - "TrackSegment.${seg_id}.effective_speed_mph == 10 (min(40, DEFECT_CAP_MPH[CRITICAL]))"
            - "TrainMovement.${mov_id}.status == ANNULLED (hop 2 caused by the segment mutation)"
            - "CrewCall.${call_id}.status == EXPIRED (hop 3 caused by the movement annulment)"

      - name: movement_settle_billing_cascade_depth2
        grounds:
          - state_machines.TrainMovement.ARRIVED_to_SETTLED
          - state_machines.Waybill.RATED_to_BILLED
          - state_machines.RevenueDivision
          - state_machines.CarOrder.RELEASED_to_COMPLETED
        distinguishing_aspect: |
          Depth-2+ cascade from a different trigger (movement settle): SETTLED bills the RATED waybill;
          the billing itself spawns a DRAFT RevenueDivision (1389834 cents our share) and completes the
          supplying CarOrder — a propagation pattern distinct from the defect cascade.
        test_recipe:
          setup:
            - "customer with siding on a CLASS_3 segment; order for 1 BOX car furnished and released"
            - "movement GW-101 with an ACCEPTED crew call, DEPARTED then ARRIVED"
            - "through waybill (GRAIN 100 tons, our 87 of 241 miles) linked to the movement and RATED"
          setup_api_calls:
            - call: "POST /rail/customers"
              payload: { name: "Genesee Feeds", billing_email: "traffic@geneseefeeds.example" }
              as: SystemAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /rail/track-segments"
              payload: { name: "Main MP 10-14", milepost_start: 10, milepost_end: 14, fra_class: CLASS_3 }
              as: SystemAdmin
              captures: { seg_id: $.data.id }
            - call: "POST /rail/industry-sidings"
              payload: { customer_id: "${cust_id}", name: "Genesee Feeds Siding", capacity_cars: 10, serving_track_segment_id: "${seg_id}", agreement_expires_on: "2027-01-01T00:00:00Z" }
              as: SystemAdmin
              captures: { sid_id: $.data.id }
            - call: "POST /rail/railcars"
              payload: { reporting_mark: "GNWR 5001", car_type: BOX, ownership: HOME, hire_rate_per_hour_cents: 0, hire_rate_per_mile_cents: 0 }
              as: SystemAdmin
              captures: { rc_id: $.data.id }
            - call: "POST /rail/car-orders"
              payload: { customer_id: "${cust_id}", siding_id: "${sid_id}", car_type: BOX, quantity: 1, needed_by_date: "2026-06-01T00:00:00Z" }
              as: CustomerRep
              as_user_id: "${cust_id}"
              captures: { ord_id: $.data.id }
            - call: "POST /rail/car-orders/${ord_id}/accept"
              payload: {}
              as: Dispatcher
            - call: "POST /rail/car-orders/${ord_id}/furnish"
              payload: { count: 1 }
              as: Dispatcher
            - call: "POST /rail/car-orders/${ord_id}/release"
              payload: {}
