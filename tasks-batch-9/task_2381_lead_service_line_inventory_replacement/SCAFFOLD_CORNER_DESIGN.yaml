            - "SamplingBatch.${batch}.classification_confidence == 0.8333"
            - "SamplingBatch.${batch}.state == VALIDATED and SamplingBatch.${batch}.rejection_reason == null"
            - "WaterSystem.${ws}.cct_optimization_status == PENDING_REOPTIMIZATION"

      - name: invalidated_samples_leave_the_statistical_population
        claim_type: input_set_filtering
        grounds:
          - calculations.sampling_statistical_validation.input_set
          - endpoints.POST_lsl_sampling_batches_id_invalidate_sample
        distinguishing_aspect: "The same six-sample ladder as the precision case, but sample_seq 6 (16.0 ppb) is invalidated first: n drops to 5, rank becomes ceil(0.90*5) == 5, percentile_90_ppb becomes 5.0, exceedance_count 0, classification_confidence 1.0000 — and because exceedance is false the corrosion-control posture is left at NOT_REQUIRED."
