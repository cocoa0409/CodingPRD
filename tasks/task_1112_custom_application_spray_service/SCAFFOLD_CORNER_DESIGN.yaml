            - { call: "POST /api/work-orders/${wo}/close", as: Dispatcher, captures: { st: $.data.status } }
          assert:
            - "trigger[0] error == ERR_RECORD_NOT_CERTIFIED"
            - "trigger[2] error == ERR_RINSATE_BALANCE_OPEN (balance still 24.0)"
            - "trigger[4] error == ERR_INVOICE_UNSETTLED (invoice DRAFT, balance now 0)"
            - "trigger[7] succeeds: WorkOrder.${wo}.status == CLOSED"

