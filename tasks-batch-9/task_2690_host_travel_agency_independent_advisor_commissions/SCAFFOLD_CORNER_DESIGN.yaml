            - call: "POST /host-agency/settlement-runs/${run_id}/post"
              payload: {}
              as: HostController
              as_user_id: "ctrl-2"
              captures: { post_status: $.data.status }
            - call: "POST /host-agency/advisor-statements/${stmt_a_id}/pay"
              payload: { payment_reference: "ACH-0001" }
              as: HostController
              as_user_id: "ctrl-2"
              captures: { pay_status: $.data.status }
            - call: "POST /host-agency/advisor-statements/${stmt_a_id}/pay"
              payload: { payment_reference: "ACH-0001-DUP" }
              as: HostController
              as_user_id: "ctrl-2"
              captures: { err_statement_state: $.data.error_id }
          assert:
            - "CALCULATED: calc_count == 2 and calc_share == 210000 (70000 + 140000)"
            - "PAY BEFORE POST: HTTP 409 and err_run_not_posted == ERR_RUN_NOT_POSTED — priority 38 outranks the statement's own DRAFT state at priority 40"
            - "SELF-POST: HTTP 409 and err_sod == ERR_SEGREGATION_OF_DUTIES because ctrl-1 also calculated the run; SettlementRun.${run_id}.status is still CALCULATED"
            - "POSTED BY A SECOND USER: post_status == POSTED, posted_by_user_id == ctrl-2 and both statements are POSTED"
            - "Advisor.${adv_a_id}.lifetime_settled_share_cents == 70000 and Advisor.${adv_b_id}.lifetime_settled_share_cents == 140000"
            - "FIRST PAY: pay_status == PAID and AdvisorStatement.${stmt_a_id}.net_payout_cents == 66500"
            - "the run is still POSTED, not CLOSED, because ${stmt_b_id} is unpaid"
            - "SECOND PAY: HTTP 409 and err_statement_state == ERR_INVALID_STATEMENT_STATE, reached only because the run is POSTED so priority 38 passes"
            - "AdvisorStatement.${stmt_a_id}.paid_at is unchanged by the duplicate call"

      - name: corner_split_schedule_with_no_zero_tier_is_a_configuration_error
