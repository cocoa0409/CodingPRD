            - "the OwnerRep decision returns HTTP 200 with status == APPROVED and decided_by_user_id == u-owner-2"
            - "an ASSET_MANAGER-level variance is decidable by either AssetManager or OwnerRep, so the ceiling is one-directional"

      - name: every_read_endpoint_admits_all_four_roles
        claim_type: standard_crud
        grounds:
