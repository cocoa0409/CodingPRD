              as: PlatformAdmin
              captures: { cm002_h_id: $.data.id }
            - call: "POST /benefits/holdings/${cm002_h_id}/adopt"
              payload: {}
              as: Member
              as_user_id: "${cm002_id}"
            - call: "POST /benefits/loan-accounts"
              payload: { member_id: "${cm002_id}", holding_id: "${cm002_h_id}", loan_type: "STUDENT", principal_cents: 250000, base_apr_bps: 1080 }
              as: Underwriter
              captures: { cm002_la_id: $.data.id }
            - call: "POST /benefits/members/${cm002_id}/rewards/adjust"
              payload: { points_delta: 4000, source_event_code: "SAGA_SEED" }
              as: BenefitsAdmin
          trigger:
            - call: "POST /benefits/members/${cm002_id}/rewards/redeem-principal"
              payload: { loan_account_id: "${cm002_la_id}", points: 3000, source_event_code: "SAGA_LEG_1" }
              as: Member
              as_user_id: "${cm002_id}"
              captures: { cm002_e_id: $.data.id }
            - call: "POST /benefits/rewards-ledger-entries/${cm002_e_id}/reverse"
              payload: {}
              as: BenefitsAdmin
          assert:
            - "leg 1: LoanAccount.${cm002_la_id}.principal_cents drops by 30 (3000 // 100) to 249970 and the member's points balance drops by 3000 to 1000"
            - "the failure to complete the redemption cleanly is compensated by leg 2, an explicit REVERSE row rather than a rollback of leg 1"
            - "after leg 2: LoanAccount.${cm002_la_id}.principal_cents == 250000 and Member.${cm002_id}.rewards_points_balance == 4000"
            - "the compensation is complete with zero drift on both the cent principal and the point balance"
            - "RewardsLedgerEntry.${cm002_e_id}.entry_status == REVERSED with a non-null reversed_by_entry_id"

