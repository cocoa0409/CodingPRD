            - call: "POST /conference-groups/${g_id}/rooming-list-revisions"
              payload:
                expected_conference_group_version: "${g_ver}"
                assignments:
                  - { participant_id: "${p1_id}", room_id: "${r1_id}", checkin_at: "2026-06-15T15:00:00Z", checkout_at: "2026-06-17T11:00:00Z" }
              as: ClientCoordinator
              as_user_id: "${g_id}"
              captures: { rev1_id: $.data.id }
            - call: "POST /conference-groups/${g_id}/rooming-list-revisions"
              payload:
                expected_conference_group_version: "${g_ver}"
                assignments:
                  - { participant_id: "${p2_id}", room_id: "${r1_id}", checkin_at: "2026-06-15T15:00:00Z", checkout_at: "2026-06-17T11:00:00Z" }
              as: ClientCoordinator
              as_user_id: "${g_id}"
              captures: { err: $.data.error_id }
          assert:
            - "First revision: 201 (version matched)"
            - "Second revision with the SAME expected version: 412 ERR_STALE_VERSION (first create advanced ConferenceGroup.version)"
            - "Revision ${rev1_id} remains ACTIVE; no SUPERSEDED revision exists"

      - name: occ_stale_building_version_on_window
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[maintenance-window-stale-building]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "Window creation carrying the building version observed BEFORE begin-turn-season is rejected 412 ERR_STALE_VERSION; re-reading and resubmitting with the fresh version succeeds."
        test_recipe:
          setup: ["building RELEASED (release confirmed), version captured; then begin-turn-season advances the version"]
          setup_api_calls:
            - call: "POST /buildings"
              payload: { name: "Victor Hall", fall_opening_date: "2026-08-20", key_pool_size: 5 }
              as: ConferenceServicesAdmin
              captures: { b_id: $.data.id }
            - call: "POST /buildings/${b_id}/rooms"
              payload: { room_number: "R1", bed_count: 1 }
              as: FacilitiesManager
            - call: "POST /buildings/${b_id}/initiate-release"
              payload: {  }
              as: FacilitiesManager
            - call: "POST /buildings/${b_id}/confirm-release"
              payload: {  }
              as: FacilitiesManager
              captures: { b_ver_stale: $.data.version }
            - call: "POST /buildings/${b_id}/begin-turn-season"
              payload: {  }
              as: FacilitiesManager
          trigger:
            - call: "POST /buildings/${b_id}/maintenance-windows"
              payload: { start_date: "2026-08-10", end_date: "2026-08-12", buffer_days: 1, expected_building_version: "${b_ver_stale}" }
              as: FacilitiesManager
              captures: { err: $.data.error_id }
            - call: "GET /buildings/${b_id}"
              as: FacilitiesManager
              captures: { b_ver_fresh: $.data.version }
            - call: "POST /buildings/${b_id}/maintenance-windows"
              payload: { start_date: "2026-08-10", end_date: "2026-08-12", buffer_days: 1, expected_building_version: "${b_ver_fresh}" }
              as: FacilitiesManager
              captures: { w_id: $.data.id }
          assert:
            - "Stale create: 412 ERR_STALE_VERSION; no window persisted"
            - "Fresh create: 201, MaintenanceWindow.${w_id}.status == PLANNED, blocked_start_date == '2026-08-09', blocked_end_date == '2026-08-13'"

      - name: cascading_provisional_recompute_on_supersede
        claim_type: cascading_side_effects
        grounds: [calculations.bed_night_billing, entities.Invoice.fields.provisional_total_cents]
        distinguishing_aspect: "While CONFIRMED, superseding the revision with a shorter stay recomputes the PROVISIONAL invoice: 4 nights -> 2 nights drops provisional_total from 9000 to 4500 with no finalize call."
