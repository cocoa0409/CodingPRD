            - "GuildAgreement.${ag2}.mba_year == 2027 and version == 1; GET /guild-agreements returns exactly 2 rows"

      - name: omitting_optional_writer_room_seat_and_episode_fields_applies_their_defaults
        claim_type: defaults
        grounds:
