            - "error_id != ERR_INVALID_CASE_STATE"
            - "HomeboundCase.${case_id}.service_status == ELIGIBLE and HomeboundCase.${case_id}.extension_count == 0"
            - "No ExtensionRequest row exists for ${case_id}"
            - "A control request that is identical except expected_case_version equals the case's current version is rejected with 409 ERR_INVALID_CASE_STATE, proving the losing rule really was violated"

  - rule_id: boundary_precision_check
    instances:
      - name: mid_duration_bonus_applies_at_exactly_thirty_expected_absence_days_not_at_twenty_nine
        grounds:
          - calculations.weekly_entitlement_minutes
          - calculations.weekly_entitlement_minutes.constants.MID_DURATION_DAYS
          - calculations.weekly_entitlement_minutes.constants.MID_DURATION_BONUS_MINUTES
        distinguishing_aspect: |
          MID_DURATION_DAYS is an inclusive lower bound, so 29 expected absence days yields 360 weekly
          minutes and 30 yields 390. The two cases are otherwise byte-identical (same grade band, same
          IN_HOME rule, same MEDICAL_ACUTE dx_factor 1.0), so the only possible cause of a 30-minute
          delta is the >= versus > choice on the duration threshold.
        test_recipe:
          setup:
            - "MIDDLE/IN_HOME rule PUBLISHED (base 360, cap 480)."
            - "Two ENROLLED grade-7 students, each with a fresh HomeboundCase in PENDING_CERT_REVIEW."
            - "Case A certification: expected_absence_days 29, window 2026-09-07..2026-10-05. Case B certification: expected_absence_days 30, window 2026-09-07..2026-10-06."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /hhi/entitlement-rules"
              payload: { grade_band: "MIDDLE", delivery_mode: "IN_HOME", base_weekly_minutes: 360, cap_weekly_minutes: 480, min_session_minutes: 30, max_session_minutes: 120, max_daily_minutes: 240, min_gap_minutes: 15, travel_buffer_minutes: 30, status: "PUBLISHED" }
              as: ProgramAdministrator
              captures: { rule_home_id: $.data.id }
            - call: "POST /hhi/students"
              payload: { student_number: "S-0001", full_name: "Ada Lin", grade_level: 7, campus_code: "MS-01", special_ed_status: "NONE", iep_service_minutes_weekly: 0, enrollment_status: "ENROLLED" }
              as: ProgramAdministrator
              captures: { stu_a_id: $.data.id }
            - call: "POST /hhi/students"
              payload: { student_number: "S-0002", full_name: "Ben Ortiz", grade_level: 7, campus_code: "MS-01", special_ed_status: "NONE", iep_service_minutes_weekly: 0, enrollment_status: "ENROLLED" }
              as: ProgramAdministrator
              captures: { stu_b_id: $.data.id }
            - call: "POST /hhi/cases"
              payload: { student_id: "${stu_a_id}", referral_date: "2026-09-01", delivery_mode: "IN_HOME", referral_note: "Twenty-nine day absence" }
              as: CaseManager
              as_user_id: "cm-001"
              captures: { case_a_id: $.data.id, case_a_v0: $.data.version }
            - call: "POST /hhi/cases"
              payload: { student_id: "${stu_b_id}", referral_date: "2026-09-01", delivery_mode: "IN_HOME", referral_note: "Thirty day absence" }
              as: CaseManager
              as_user_id: "cm-001"
              captures: { case_b_id: $.data.id, case_b_v0: $.data.version }
            - call: "POST /hhi/certifications"
              payload: { case_id: "${case_a_id}", physician_npi: "1234567890", diagnosis_category: "MEDICAL_ACUTE", certified_start_date: "2026-09-07", certified_end_date: "2026-10-05", expected_absence_days: 29, signature_date: "2026-09-01", expected_case_version: "${case_a_v0}", clinical_note: "Twenty-nine days" }
              as: CaseManager
              as_user_id: "cm-001"
              captures: { cert_a_id: $.data.id }
            - call: "POST /hhi/certifications"
              payload: { case_id: "${case_b_id}", physician_npi: "1234567890", diagnosis_category: "MEDICAL_ACUTE", certified_start_date: "2026-09-07", certified_end_date: "2026-10-06", expected_absence_days: 30, signature_date: "2026-09-01", expected_case_version: "${case_b_v0}", clinical_note: "Thirty days" }
              as: CaseManager
              as_user_id: "cm-001"
              captures: { cert_b_id: $.data.id }
          trigger:
            - call: "POST /hhi/certifications/${cert_a_id}/review"
              payload: { decision: "ACCEPT", review_note: "Twenty-nine days accepted" }
              as: NurseReviewer
              as_user_id: "nr-001"
            - call: "POST /hhi/certifications/${cert_b_id}/review"
              payload: { decision: "ACCEPT", review_note: "Thirty days accepted" }
              as: NurseReviewer
              as_user_id: "nr-001"
          assert:
            - "HomeboundCase.${case_a_id}.weekly_entitled_minutes == 360"
            - "HomeboundCase.${case_b_id}.weekly_entitled_minutes == 390"
            - "HomeboundCase.${case_b_id}.weekly_entitled_minutes - HomeboundCase.${case_a_id}.weekly_entitled_minutes == 30"
            - "HomeboundCase.${case_a_id}.service_status == ELIGIBLE and HomeboundCase.${case_b_id}.service_status == ELIGIBLE"
            - "HomeboundCase.${case_a_id}.entitlement_rule_id == ${rule_home_id} and HomeboundCase.${case_b_id}.entitlement_rule_id == ${rule_home_id}"

      - name: delivery_ratio_of_exactly_zero_point_five_zero_reconciles_while_zero_point_four_six_forfeits
        grounds:
          - calculations.funding_reconciliation_net.constants.FORFEIT_RATIO
          - calculations.funding_reconciliation_net.precision
          - state_machines.HomeboundCase.funding_status.ACCRUING_to_RECONCILED
          - state_machines.HomeboundCase.funding_status.ACCRUING_to_FORFEITED
        distinguishing_aspect: |
          FORFEIT_RATIO 0.50 is an inclusive lower bound evaluated on the 2-decimal ratio, so 390/780 =
          0.50 lands in the 0.25 recapture band (RECONCILED, recapture 98, net 292) while 360/780 = 0.46
          forfeits everything (net 0, recapture 360). Neither case's FINAL_VERIFIED total is clamped by
          the weekly cap, so the delta is attributable purely to the band boundary; the 30-minute session
          that separates them is the smallest schedulable unit under min_session_minutes.
        test_recipe:
          setup:
            - "MIDDLE/IN_HOME rule PUBLISHED (base 360, cap 480, min_session 30, max_session 120, max_daily 240, min_gap 15, travel_buffer 30)."
            - "Two ACTIVE cases, each weekly_entitled_minutes 390, each with service_start_date 2026-09-07, each served by its own teacher so no slot conflicts arise."
            - "Case A verified sessions: 120 on 2026-09-07, 120 on 2026-09-08 (ISO week 37), 120 on 2026-09-14, 30 on 2026-09-15 (ISO week 38) - 390 total, both weeks under the 390 weekly cap."
            - "Case B verified sessions: the same first three sessions only - 360 total."
            - "Reconciliation happens at 2026-09-20T00:00:00Z: elapsed_weeks 2, window_weeks 5, service_weeks 2, entitled_total 780; completed_service_weeks is 1 so neither case is in funding HELD."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: ProgramAdministrator
