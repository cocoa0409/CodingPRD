        distinguishing_aspect: "40 points observed 2026-09-01 (1 full week old at the 2026-09-10 read, decayed to 34.0) plus 16 points observed 2026-09-08 (0 weeks, full value) yields momentum exactly 50.0 — recency weighting, not a raw sum (raw would be 56)."
        test_recipe:
          setup: ["Concept with the two insights; clock at 2026-09-10."]
          setup_api_calls:
            - *c_clock0
            - *c_season
            - *c_cat
            - *c_concept
            - *c_ins_a
            - *c_ins_b
            - *c_clock0910
          trigger:
            - call: "GET /concepts/${concept_id}"
              payload: {}
              as: ProductLead
              captures: { momentum: $.data.research_momentum }
          assert:
            - "momentum == 50.0 (40 * 0.85^1 + 16 * 0.85^0)"

      - name: research_momentum_below_gate_blocks_lock
        claim_type: Constants Applied
        grounds:
          - calculations.research_momentum_score
          - state_machines.ProductConcept.RESEARCHING_to_CONCEPT_LOCKED
          - errors[ERR_RESEARCH_SCORE_TOO_LOW]
        distinguishing_aspect: "A single 30-point insight observed 2026-09-01 decays to 15.66 by 2026-09-29 (4 full weeks, 30 * 0.85^4) — below RESEARCH_SCORE_MIN 40.0, so the lock advance fails while the IDENTIFIED -> RESEARCHING advance still succeeds."
        test_recipe:
          setup: ["Concept with one 30-point insight; clock advanced to 2026-09-29."]
          setup_api_calls:
            - *c_clock0
            - *c_season
            - *c_cat
            - *c_concept
            - call: "POST /concepts/${concept_id}/insights"
              payload: { points: 30, observed_at: "2026-09-01T00:00:00Z" }
              as: ProductLead
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-29T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - *c_advance
            - call: "POST /concepts/${concept_id}/advance"
              payload: {}
              as: ProductLead
              captures: { err: $.data.error_id }
            - call: "GET /concepts/${concept_id}"
              payload: {}
              as: ProductLead
              captures: { momentum: $.data.research_momentum, c_status: $.data.status }
          assert:
            - "err == ERR_RESEARCH_SCORE_TOO_LOW"
            - "momentum == 15.66 and c_status == RESEARCHING (first advance succeeded, lock blocked)"

      - name: sample_size_floor_enforced_at_complete
        claim_type: Constants Applied
        grounds:
          - calculations.claim_margin
          - errors[ERR_SAMPLE_SIZE_TOO_SMALL]
        distinguishing_aspect: "sample_size 29 fails ERR_SAMPLE_SIZE_TOO_SMALL and leaves the study RUNNING; the identical call at exactly 30 (CLAIM_MIN_SAMPLES, inclusive) succeeds."
        test_recipe:
          setup: ["Variant TOOLED with study RUNNING."]
