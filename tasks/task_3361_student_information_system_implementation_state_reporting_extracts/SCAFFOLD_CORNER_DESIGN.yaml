# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Task: task_3361_student_information_system_implementation_state_reporting_extracts
# Breadth probe over §1.1-§1.7 claims not already exercised by §1.8. Anchors are
# file-local. Standard fixtures: district TX LIVE; spec PUBLISHED (adds GT weight
# 1.25 program code); year [2026-08-01, 2027-06-01) instructional_days 180,
# count_date 2026-10-01. Logical clock default 2026-09-01T00:00:00Z.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:

      - name: district_create_returns_defaults_and_common_fields
        claim_type: Creation
        grounds: ["entities.District", "endpoints.POST_/sis/districts"]
        distinguishing_aspect: "A district created with only name and state_code returns 201 with status IMPLEMENTATION, version 1, and server-minted id/created_at/updated_at — status is never client-supplied."
        test_recipe:
          setup: ["Logical clock at 2026-09-01T00:00:00Z. Empty database."]
          setup_api_calls:
            - &k_clock
              call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - &k_d1
              call: "POST /sis/districts"
              payload: { name: "Lone Star ISD", state_code: "TX" }
              as: PlatformAdmin
              captures: { d1: $.data.id, d1_status: $.data.status, d1_v: $.data.version }
          assert:
            - "response status 201 and response_type object"
            - "${d1_status} == IMPLEMENTATION and ${d1_v} == 1"
            - "response data carries non-null id, created_at, updated_at; meta.api_request_id present"

      - name: school_year_create_missing_instructional_days_returns_invalid_request
        claim_type: Required Fields
        grounds: ["entities.SchoolYear.fields.instructional_days", "errors.ERR_INVALID_REQUEST", "validations[priority=2]"]
        distinguishing_aspect: "instructional_days is a required input with no default; omitting it is a 400 ERR_INVALID_REQUEST from the request-shape check before any state or temporal rule runs."
        test_recipe:
          setup: ["Clock default. District created (still IMPLEMENTATION — the shape check fires before any district-state gate)."]
          setup_api_calls:
            - *k_clock
            - *k_d1
          trigger:
            - call: "POST /sis/school-years"
              payload: { district_id: "${d1}", label: "2026-2027", start_date: "2026-08-01T00:00:00Z", end_date: "2027-06-01T00:00:00Z", count_date: "2026-10-01T00:00:00Z" }
              as: DistrictAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response status 400 with error_id == ERR_INVALID_REQUEST"
            - "GET /sis/school-years?district_id=${d1} returns total_count == 0"

      - name: section_create_roster_count_input_ignored
        claim_type: Computed Fields
        grounds: ["entities.Section.fields.roster_count"]
        distinguishing_aspect: "roster_count is source: computed — a client-supplied roster_count of 99 on create is ignored and the stored value is 0."
        test_recipe:
          setup: ["Clock default. TX district LIVE; year OPEN; course created."]
          setup_api_calls:
            - *k_clock
            - *k_d1
            - &k_d1_act
              call: "POST /sis/districts/${d1}/activate"
              payload: {}
              as: PlatformAdmin
              captures: { d1_v: $.data.version }
            - &k_y1
              call: "POST /sis/school-years"
              payload: { district_id: "${d1}", label: "2026-2027", start_date: "2026-08-01T00:00:00Z", end_date: "2027-06-01T00:00:00Z", instructional_days: 180, count_date: "2026-10-01T00:00:00Z" }
              as: DistrictAdmin
              captures: { y1: $.data.id }
            - &k_y1_open
              call: "POST /sis/school-years/${y1}/open"
              payload: {}
              as: DistrictAdmin
            - &k_co1
              call: "POST /sis/courses"
              payload: { district_id: "${d1}", course_code: "ALG1", title: "Algebra I", credit_hours: 1.0, grade_band: "HIGH", state_course_code: "TX-02001" }
              as: Registrar
              captures: { co1: $.data.id }
          trigger:
            - call: "POST /sis/sections"
              payload: { course_id: "${co1}", school_year_id: "${y1}", teacher_ref: "T1", term_label: "SEM_1", room: "R1", period_start_min: 480, period_end_min: 540, capacity: 30, roster_count: 99 }
              as: Registrar
              captures: { sec1: $.data.id, sec_rc: $.data.roster_count }
          assert:
            - "response status 201 and ${sec_rc} == 0 — the client-supplied roster_count 99 was ignored"
            - "Section.${sec1}.status == DRAFT"

      - name: attendance_event_response_has_no_version_or_update_surface
        claim_type: Immutability
        grounds: ["entities.AttendanceEvent"]
        distinguishing_aspect: "AttendanceEvent declares common_fields: false — its response carries id and created_at but no version or updated_at, and no update endpoint exists for it."
        test_recipe:
          setup: ["Clock default. TX district LIVE; spec PUBLISHED; year OPEN; one ACTIVE enrollment."]
          setup_api_calls:
            - *k_clock
            - *k_d1
            - *k_d1_act
            - &k_sp1
              call: "POST /sis/collection-specs"
              payload: { state_code: "TX", funding_method: "ADM", attendance_code_map: { "U": { state_code: "S_ABS_U", absence_weight: 1.0, is_excused: false }, "E": { state_code: "S_ABS_E", absence_weight: 1.0, is_excused: true }, "H": { state_code: "S_ABS_H", absence_weight: 0.5, is_excused: false }, "P": { state_code: "S_ABS_P", absence_weight: 0.0, is_excused: false } }, discipline_code_map: { "FIGHT": { state_offense_code: "S_OFF_29", severity_base: 25 }, "TARDY": { state_offense_code: "S_OFF_51", severity_base: 5 } }, program_code_map: { "EL": { state_program_code: "S_PRG_EL", weight_factor: 1.2 }, "HDK": { state_program_code: "S_PRG_HDK", weight_factor: 0.5 }, "GT": { state_program_code: "S_PRG_GT", weight_factor: 1.25 } }, submission_window_opens_at: "2027-06-15T00:00:00Z", submission_window_closes_at: "2027-07-15T00:00:00Z", chronic_absence_threshold: 0.10, auto_withdraw_streak: 3, min_membership_days: 10 }
              as: PlatformAdmin
              captures: { sp1: $.data.id }
            - &k_sp1_pub
              call: "POST /sis/collection-specs/${sp1}/publish"
              payload: {}
              as: PlatformAdmin
            - *k_y1
            - *k_y1_open
            - &k_st1
              call: "POST /sis/students"
              payload: { district_id: "${d1}", student_number: "S001", first_name: "Ada", last_name: "Lopez", birth_date: "2011-03-04T00:00:00Z", entry_grade_level: "09" }
              as: Registrar
              captures: { st1: $.data.id }
            - &k_en1
              call: "POST /sis/enrollments"
              payload: { student_id: "${st1}", school_year_id: "${y1}", grade_level: "09", entry_date: "2026-08-01T00:00:00Z" }
              as: Registrar
              captures: { en1: $.data.id }
          trigger:
            - call: "POST /sis/enrollments/${en1}/attendance-events"
              payload: { attendance_date: "2026-09-02T00:00:00Z", raw_code: "U" }
              as: Registrar
              captures: { ev1: $.data.id }
          assert:
            - "response status 201; data carries id and created_at"
            - "data carries NO version field and NO updated_at field"
            - "AttendanceEvent.${ev1}.state_attendance_code == S_ABS_U and absence_weight == 1.0 and is_excused == false"

      - name: students_list_paginates_with_total_count_and_has_more
        claim_type: Listing
        grounds: ["endpoints.GET_/sis/students", "response_envelope.pagination_fields", "response_envelope.pagination_defaults"]
        distinguishing_aspect: "With three students, limit=2 returns 2 rows with total_count 3 and has_more true; offset=2 returns the final row with has_more false — total_count spans the full filtered set."
        test_recipe:
          setup: ["Clock default. TX district created; three students registered."]
          setup_api_calls:
            - *k_clock
            - *k_d1
            - *k_st1
            - call: "POST /sis/students"
              payload: { district_id: "${d1}", student_number: "S002", first_name: "Bo", last_name: "Reyes", birth_date: "2013-09-09T00:00:00Z", entry_grade_level: "KG" }
              as: Registrar
            - call: "POST /sis/students"
              payload: { district_id: "${d1}", student_number: "S003", first_name: "Cid", last_name: "Mira", birth_date: "2012-01-15T00:00:00Z", entry_grade_level: "10" }
              as: Registrar
          trigger:
            - call: "GET /sis/students"
              payload: { district_id: "${d1}", limit: 2, offset: 0 }
              as: Registrar
          assert:
            - "response_type array; exactly 2 rows with total_count == 3 and has_more == true"
            - "GET /sis/students?district_id=${d1}&limit=2&offset=2 returns exactly 1 row with total_count == 3 and has_more == false"
            - "GET /sis/students?district_id=${d1} with no params returns 3 rows (limit default 10)"

      - name: section_get_with_unknown_id_returns_not_found
        claim_type: Not Found
        grounds: ["endpoints.GET_/sis/sections/{id}", "errors.ERR_SECTION_NOT_FOUND", "validations[priority=4]"]
        distinguishing_aspect: "A syntactically valid but unallocated section id yields the entity-specific 404 ERR_SECTION_NOT_FOUND, not a generic 400."
        test_recipe:
          setup: ["Clock default. Empty database."]
          setup_api_calls:
            - *k_clock
          trigger:
            - call: "GET /sis/sections/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: Registrar
              captures: { err: $.data.error_id }
          assert:
            - "response status 404 with error_id == ERR_SECTION_NOT_FOUND"
            - "response_type is error and data carries error_id and message"

      - name: portal_account_create_defaults_grade_visibility
        claim_type: Defaults
        grounds: ["entities.PortalAccount.fields.grade_visibility"]
        distinguishing_aspect: "Omitting grade_visibility stores the declared default CURRENT_TERM_ONLY rather than null."
        test_recipe:
          setup: ["Clock default. TX district LIVE; one student."]
          setup_api_calls:
            - *k_clock
            - *k_d1
            - *k_d1_act
            - *k_st1
          trigger:
            - call: "POST /sis/portal-accounts"
              payload: { student_id: "${st1}", account_type: "PARENT", access_level: "GRADES_ONLY" }
              as: DistrictAdmin
              captures: { pa1: $.data.id, pa_gv: $.data.grade_visibility }
          assert:
            - "response status 201 and ${pa_gv} == CURRENT_TERM_ONLY"
            - "PortalAccount.${pa1}.status == INVITED"

      - name: enrollment_create_with_invalid_grade_enum_returns_invalid_request
        claim_type: Type Constraints
        grounds: ["entities.Enrollment.fields.grade_level", "errors.ERR_INVALID_REQUEST"]
        distinguishing_aspect: "grade_level 13 is outside the declared enum set and fails the request-shape check with 400 before any state, referential, or temporal rule is consulted."
        test_recipe:
          setup: ["Clock default. TX district LIVE; year OPEN; one student."]
          setup_api_calls:
            - *k_clock
            - *k_d1
            - *k_d1_act
            - *k_y1
            - *k_y1_open
            - *k_st1
          trigger:
            - call: "POST /sis/enrollments"
              payload: { student_id: "${st1}", school_year_id: "${y1}", grade_level: "13", entry_date: "2026-08-01T00:00:00Z" }
              as: Registrar
              captures: { err: $.data.error_id }
          assert:
            - "response status 400 with error_id == ERR_INVALID_REQUEST"
            - "GET /sis/enrollments?student_id=${st1} returns total_count == 0"

      - name: enrollment_create_with_unknown_school_year_returns_referential_error
        claim_type: Parent Relationships
        grounds: ["entities.Enrollment.fields.school_year_id", "errors.ERR_REFERENCED_ENTITY_NOT_FOUND", "validations[priority=6]"]
        distinguishing_aspect: "A non-existent body FK (school_year_id) is a 422 ERR_REFERENCED_ENTITY_NOT_FOUND — distinct from a 404 path-id miss and from a temporal error."
        test_recipe:
          setup: ["Clock default. TX district LIVE; one student."]
          setup_api_calls:
            - *k_clock
            - *k_d1
            - *k_d1_act
            - *k_st1
          trigger:
            - call: "POST /sis/enrollments"
              payload: { student_id: "${st1}", school_year_id: "00000000-0000-4000-8000-000000000000", grade_level: "09", entry_date: "2026-08-01T00:00:00Z" }
              as: Registrar
              captures: { err: $.data.error_id }
          assert:
            - "response status 422 with error_id == ERR_REFERENCED_ENTITY_NOT_FOUND"

      - name: enrollment_create_cross_district_reference_returns_mismatch
        claim_type: Parent Relationships
        grounds: ["entities.Enrollment.fields.student_id", "errors.ERR_DISTRICT_MISMATCH", "validations[priority=6]"]
        distinguishing_aspect: "Both FK targets exist but live in DIFFERENT districts — a cross-aggregate integrity violation returning 422 ERR_DISTRICT_MISMATCH."
        test_recipe:
          setup: ["Clock default. District A (TX) LIVE with OPEN year; district B (NM) LIVE with student S200."]
          setup_api_calls:
            - *k_clock
            - *k_d1
            - *k_d1_act
            - *k_y1
            - *k_y1_open
            - call: "POST /sis/districts"
              payload: { name: "Desert Vista USD", state_code: "NM" }
              as: PlatformAdmin
              captures: { d2: $.data.id }
            - call: "POST /sis/districts/${d2}/activate"
              payload: {}
              as: PlatformAdmin
            - call: "POST /sis/students"
              payload: { district_id: "${d2}", student_number: "S200", first_name: "Dee", last_name: "Tsosie", birth_date: "2011-07-07T00:00:00Z", entry_grade_level: "09" }
              as: Registrar
              captures: { st_nm: $.data.id }
          trigger:
            - call: "POST /sis/enrollments"
              payload: { student_id: "${st_nm}", school_year_id: "${y1}", grade_level: "09", entry_date: "2026-08-01T00:00:00Z" }
              as: Registrar
              captures: { err: $.data.error_id }
          assert:
            - "response status 422 with error_id == ERR_DISTRICT_MISMATCH"
            - "GET /sis/enrollments?student_id=${st_nm} returns total_count == 0"

  # ===========================================================================
  - section: state_machines
    instances:

      - name: withdraw_already_withdrawn_enrollment_returns_not_active
        claim_type: invalid_transition
        grounds: ["state_machines.Enrollment.ACTIVE_to_WITHDRAWN", "errors.ERR_ENROLLMENT_NOT_ACTIVE"]
        distinguishing_aspect: "WITHDRAWN is not in the withdraw transition's from-set; the second withdraw is a 409 with no side effects — exit_date and membership_days stay frozen."
        test_recipe:
          setup: ["Clock default. TX district LIVE; year OPEN; enrollment withdrawn with exit 2026-11-09."]
          setup_api_calls:
            - *k_clock
            - *k_d1
            - *k_d1_act
            - *k_sp1
            - *k_sp1_pub
            - *k_y1
            - *k_y1_open
            - *k_st1
            - *k_en1
            - call: "POST /sis/enrollments/${en1}/withdraw"
              payload: { exit_date: "2026-11-09T00:00:00Z" }
              as: Registrar
          trigger:
            - call: "POST /sis/enrollments/${en1}/withdraw"
              payload: { exit_date: "2026-12-01T00:00:00Z" }
              as: Registrar
              captures: { err: $.data.error_id }
          assert:
            - "response status 409 with error_id == ERR_ENROLLMENT_NOT_ACTIVE"
            - "Enrollment.${en1}.exit_date remains 2026-11-09T00:00:00Z and membership_days remains 100"

      - name: approve_voided_incident_returns_not_reported
        claim_type: terminal_lockdown
        grounds: ["state_machines.DisciplineIncident", "errors.ERR_INCIDENT_NOT_REPORTED"]
        distinguishing_aspect: "VOIDED is terminal: an approve against a VOIDED incident fails with ERR_INCIDENT_NOT_REPORTED and applies no absence cascade."
        test_recipe:
          setup: ["Clock default. TX district LIVE; spec PUBLISHED; year OPEN; one ACTIVE enrollment; one incident voided from REPORTED."]
          setup_api_calls:
            - *k_clock
            - *k_d1
            - *k_d1_act
            - *k_sp1
            - *k_sp1_pub
            - *k_y1
            - *k_y1_open
            - *k_st1
            - *k_en1
            - call: "POST /sis/discipline-incidents"
              payload: { student_id: "${st1}", enrollment_id: "${en1}", incident_date: "2026-10-05T00:00:00Z", raw_offense_code: "TARDY", action_type: "NONE", action_days: 0 }
              as: Registrar
              captures: { inc1: $.data.id }
            - call: "POST /sis/discipline-incidents/${inc1}/void"
              payload: {}
              as: Registrar
          trigger:
            - call: "POST /sis/discipline-incidents/${inc1}/approve"
              payload: {}
              as: Registrar
              captures: { err: $.data.error_id }
          assert:
            - "response status 409 with error_id == ERR_INCIDENT_NOT_REPORTED"
            - "DisciplineIncident.${inc1}.status remains VOIDED"
            - "Enrollment.${en1}.absence_weight_sum == 0.0"

      - name: superseded_extract_rejects_validate_and_records_lineage
        claim_type: side_effect_execution
        grounds: ["state_machines.ReportingExtract.DRAFT_to_SUPERSEDED", "errors.ERR_EXTRACT_NOT_DRAFT", "entities.ReportingExtract.fields.supersedes_extract_id"]
        distinguishing_aspect: "Creating a second extract for the same (year, spec) supersedes the first: the old extract locks to SUPERSEDED (validate now fails 409), and the new one records generation 2 and supersedes_extract_id pointing at the old."
        test_recipe:
          setup: ["Clock default. TX district LIVE; spec PUBLISHED; year CLOSED_FOR_REPORTING with one full-year ACTIVE enrollment; first extract created."]
          setup_api_calls:
            - *k_clock
            - *k_d1
            - *k_d1_act
            - *k_sp1
            - *k_sp1_pub
            - *k_y1
            - *k_y1_open
            - *k_st1
            - *k_en1
            - &k_y1_close
              call: "POST /sis/school-years/${y1}/close-for-reporting"
              payload: {}
              as: DistrictAdmin
              captures: { y1_v: $.data.version }
            - call: "POST /sis/reporting-extracts"
              payload: { school_year_id: "${y1}", collection_spec_id: "${sp1}", expected_school_year_version: "${y1_v}" }
              as: StateReporter
              captures: { ex1: $.data.id }
            - call: "GET /sis/school-years/${y1}"
              payload: {}
              as: StateReporter
              captures: { y1_v2: $.data.version }
          trigger:
            - call: "POST /sis/reporting-extracts"
              payload: { school_year_id: "${y1}", collection_spec_id: "${sp1}", expected_school_year_version: "${y1_v2}" }
              as: StateReporter
              captures: { ex2: $.data.id, ex2_gen: $.data.generation, ex2_sup: $.data.supersedes_extract_id }
            - call: "POST /sis/reporting-extracts/${ex1}/validate"
              payload: {}
              as: StateReporter
              captures: { err: $.data.error_id }
          assert:
            - "ReportingExtract.${ex1}.status == SUPERSEDED"
            - "${ex2_gen} == 2 and ${ex2_sup} == ${ex1}"
            - "validate on the superseded extract: 409 error_id == ERR_EXTRACT_NOT_DRAFT"
            - "GET /sis/reporting-extracts?supersedes_extract_id=${ex1} returns exactly [${ex2}]"

      - name: enrollment_create_initializes_parallel_dimensions
        claim_type: initial_state
        grounds: ["state_machines.Enrollment"]
        distinguishing_aspect: "A fresh enrollment starts lifecycle ACTIVE with absence_posture CLEAR, absence_weight_sum 0.0, and both FTE variants computed — the two state dimensions are initialized independently."
        test_recipe:
          setup: ["Clock default. TX district LIVE; spec PUBLISHED; year OPEN; one student."]
          setup_api_calls:
            - *k_clock
            - *k_d1
            - *k_d1_act
            - *k_sp1
            - *k_sp1_pub
            - *k_y1
            - *k_y1_open
            - *k_st1
          trigger:
            - call: "POST /sis/enrollments"
              payload: { student_id: "${st1}", school_year_id: "${y1}", grade_level: "09", entry_date: "2026-08-01T00:00:00Z" }
              as: Registrar
              captures: { en1: $.data.id }
          assert:
            - "Enrollment.${en1}.lifecycle == ACTIVE and absence_posture == CLEAR"
            - "Enrollment.${en1}.absence_weight_sum == 0.0 and absence_rate == 0.0"
            - "Enrollment.${en1}.membership_days == 304 and fte_adm == 1.0 and fte_count_date == 1.0"
            - "Student.${st1}.status == ENROLLED (was PRE_REGISTERED)"

      - name: withdraw_sets_exit_freezes_membership_and_inactivates_student
        claim_type: side_effect_execution
        grounds: ["state_machines.Enrollment.ACTIVE_to_WITHDRAWN", "state_machines.Student.ENROLLED_to_INACTIVE"]
        distinguishing_aspect: "The withdraw transition's full side-effect set fires: exit_date stored, prior_segment_days accumulated, FTE recomputed, and the student bubbles to INACTIVE because no other ACTIVE enrollment exists."
        test_recipe:
          setup: ["Clock default. TX district LIVE; year OPEN; single ACTIVE enrollment from 2026-08-01."]
          setup_api_calls:
            - *k_clock
            - *k_d1
            - *k_d1_act
            - *k_y1
            - *k_y1_open
            - *k_st1
            - *k_en1
          trigger:
            - call: "POST /sis/enrollments/${en1}/withdraw"
              payload: { exit_date: "2026-11-09T00:00:00Z" }
              as: Registrar
          assert:
            - "Enrollment.${en1}.exit_date == 2026-11-09T00:00:00Z and lifecycle == WITHDRAWN"
            - "Enrollment.${en1}.prior_segment_days == 100 and membership_days == 100"
            - "Enrollment.${en1}.fte_adm == 0.556"
            - "Student.${st1}.status == INACTIVE"

      - name: student_reenroll_on_reenter_bubble_up
        claim_type: bubble_up
        grounds: ["state_machines.Student.INACTIVE_to_ENROLLED"]
        excluded_because:
          difficulty_instance: enrollment_parallel_lifecycle_and_absence_dimensions
          rationale: "The INACTIVE -> ENROLLED bubble-up is asserted there ('Student.${st1}.status == ENROLLED after reenter')."

      - name: spec_publish_auto_retires_prior_published_spec
        claim_type: side_effect_execution
        grounds: ["state_machines.StateCollectionSpec.DRAFT_to_PUBLISHED"]
        distinguishing_aspect: "Publishing a second spec for the same state auto-retires the previously PUBLISHED one — the one-PUBLISHED-per-state invariant is enforced by cascade, not by rejecting the publish."
        test_recipe:
          setup: ["Clock default. Two TX specs exist; the first is PUBLISHED, the second DRAFT."]
          setup_api_calls:
            - *k_clock
            - *k_sp1
            - *k_sp1_pub
            - call: "POST /sis/collection-specs"
              payload: { state_code: "TX", funding_method: "COUNT_DATE", attendance_code_map: { "U": { state_code: "S_ABS_U", absence_weight: 1.0, is_excused: false } }, discipline_code_map: { "FIGHT": { state_offense_code: "S_OFF_29", severity_base: 25 } }, program_code_map: { "EL": { state_program_code: "S_PRG_EL", weight_factor: 1.2 } }, submission_window_opens_at: "2027-06-15T00:00:00Z", submission_window_closes_at: "2027-08-15T00:00:00Z" }
              as: PlatformAdmin
              captures: { sp2: $.data.id }
          trigger:
            - call: "POST /sis/collection-specs/${sp2}/publish"
              payload: {}
              as: PlatformAdmin
          assert:
            - "StateCollectionSpec.${sp2}.status == PUBLISHED"
            - "StateCollectionSpec.${sp1}.status == RETIRED (auto-retired by the publish cascade)"
            - "GET /sis/collection-specs?state_code=TX&status=PUBLISHED returns exactly [${sp2}]"

      - name: section_cancel_clears_roster_and_blocks_further_adds
        claim_type: side_effect_execution
        grounds: ["state_machines.Section.DRAFT_to_CANCELLED", "errors.ERR_SECTION_NOT_ROSTERABLE"]
        distinguishing_aspect: "Cancelling a rostered section clears its roster links (roster_count -> 0) and the terminal CANCELLED state then rejects further roster-adds with ERR_SECTION_NOT_ROSTERABLE."
        test_recipe:
          setup: ["Clock default. TX district LIVE; year OPEN; section SEC-A with one rostered ACTIVE enrollment."]
          setup_api_calls:
            - *k_clock
            - *k_d1
            - *k_d1_act
            - *k_y1
            - *k_y1_open
            - *k_co1
            - call: "POST /sis/sections"
              payload: { course_id: "${co1}", school_year_id: "${y1}", teacher_ref: "T1", term_label: "SEM_1", room: "R1", period_start_min: 480, period_end_min: 540, capacity: 30 }
              as: Registrar
              captures: { sec1: $.data.id }
            - *k_st1
            - *k_en1
            - call: "POST /sis/sections/${sec1}/roster-adds"
              payload: { enrollment_id: "${en1}" }
              as: Registrar
          trigger:
            - call: "POST /sis/sections/${sec1}/cancel"
              payload: {}
              as: Registrar
              captures: { sec_status: $.data.status, sec_rc: $.data.roster_count }
            - call: "POST /sis/sections/${sec1}/roster-adds"
              payload: { enrollment_id: "${en1}" }
              as: Registrar
              captures: { err: $.data.error_id }
          assert:
            - "${sec_status} == CANCELLED and ${sec_rc} == 0"
            - "GET /sis/sections/${sec1}/roster returns an empty array"
            - "roster-add on the cancelled section: 409 error_id == ERR_SECTION_NOT_ROSTERABLE"

      - name: portal_account_revoked_rejects_update_access
        claim_type: terminal_lockdown
        grounds: ["state_machines.PortalAccount", "errors.ERR_PORTAL_ACCOUNT_REVOKED"]
        distinguishing_aspect: "REVOKED is terminal: update-access against a REVOKED account fails with ERR_PORTAL_ACCOUNT_REVOKED and changes nothing."
        test_recipe:
          setup: ["Clock default. TX district LIVE; one student with a REVOKED portal account."]
          setup_api_calls:
            - *k_clock
            - *k_d1
            - *k_d1_act
            - *k_st1
            - call: "POST /sis/portal-accounts"
              payload: { student_id: "${st1}", account_type: "PARENT", access_level: "FULL" }
              as: DistrictAdmin
              captures: { pa1: $.data.id }
            - call: "POST /sis/portal-accounts/${pa1}/revoke"
              payload: {}
              as: DistrictAdmin
          trigger:
            - call: "POST /sis/portal-accounts/${pa1}/update-access"
              payload: { grade_visibility: "ALL_GRADES" }
              as: DistrictAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response status 409 with error_id == ERR_PORTAL_ACCOUNT_REVOKED"
            - "PortalAccount.${pa1}.grade_visibility remains CURRENT_TERM_ONLY and status remains REVOKED"

  # ===========================================================================
  - section: calculations
    instances:

      - name: membership_days_full_year_and_mid_year_entry
        claim_type: correct_result
        grounds: ["calculations.membership_days_calc"]
        distinguishing_aspect: "Half-open interval arithmetic: entry exactly at year start yields the full 304 days; entry 2026-11-01 yields 212 days (31+30+31+31+28+31+30+31 minus the pre-entry portion) — boundary at the year edge plus a mid-year segment."
        test_recipe:
          setup: ["Clock default. TX district LIVE; year OPEN; two students enrolled 2026-08-01 and 2026-11-01 respectively."]
          setup_api_calls:
            - *k_clock
            - *k_d1
            - *k_d1_act
            - *k_y1
            - *k_y1_open
            - *k_st1
            - *k_en1
            - call: "POST /sis/students"
              payload: { district_id: "${d1}", student_number: "S002", first_name: "Bo", last_name: "Reyes", birth_date: "2013-09-09T00:00:00Z", entry_grade_level: "KG" }
              as: Registrar
              captures: { st2: $.data.id }
            - call: "POST /sis/enrollments"
              payload: { student_id: "${st2}", school_year_id: "${y1}", grade_level: "KG", entry_date: "2026-11-01T00:00:00Z" }
              as: Registrar
              captures: { en2: $.data.id }
          trigger:
            - call: "GET /sis/enrollments/${en1}"
              payload: {}
              as: Registrar
            - call: "GET /sis/enrollments/${en2}"
              payload: {}
              as: Registrar
          assert:
            - "Enrollment.${en1}.membership_days == 304 (full half-open [2026-08-01, 2027-06-01))"
            - "Enrollment.${en2}.membership_days == 212"

      - name: fte_count_date_exit_exactly_on_count_date_is_ineligible
        claim_type: boundary_edge
        grounds: ["calculations.fte_calculation", "entities.Enrollment.fields.fte_count_date"]
        distinguishing_aspect: "The COUNT_DATE eligibility rule requires exit_date > count_date strictly: a withdrawal whose exit equals the count date (2026-10-01) yields fte_count_date 0.0, while an exit one day later yields 1.0."
        test_recipe:
          setup: ["Clock default. TX district LIVE; year OPEN; two enrollments from 2026-08-01, withdrawn with exits 2026-10-01 and 2026-10-02."]
          setup_api_calls:
            - *k_clock
            - *k_d1
            - *k_d1_act
            - *k_y1
            - *k_y1_open
            - *k_st1
            - *k_en1
            - call: "POST /sis/students"
              payload: { district_id: "${d1}", student_number: "S002", first_name: "Bo", last_name: "Reyes", birth_date: "2013-09-09T00:00:00Z", entry_grade_level: "KG" }
              as: Registrar
              captures: { st2: $.data.id }
            - call: "POST /sis/enrollments"
              payload: { student_id: "${st2}", school_year_id: "${y1}", grade_level: "KG", entry_date: "2026-08-01T00:00:00Z" }
              as: Registrar
              captures: { en2: $.data.id }
            - call: "POST /sis/enrollments/${en1}/withdraw"
              payload: { exit_date: "2026-10-01T00:00:00Z" }
              as: Registrar
          trigger:
            - call: "POST /sis/enrollments/${en2}/withdraw"
              payload: { exit_date: "2026-10-02T00:00:00Z" }
              as: Registrar
          assert:
            - "Enrollment.${en1}.fte_count_date == 0.0 (exit_date == count_date is NOT > count_date)"
            - "Enrollment.${en2}.fte_count_date == 1.0 (exit_date 2026-10-02 > count_date)"

      - name: extract_snapshot_includes_withdrawn_enrollments
        claim_type: input_set_filtering
        grounds: ["calculations.extract_snapshot_totals", "entities.ReportingExtract.fields.record_count"]
        distinguishing_aspect: "The extract record set includes enrollments in ALL lifecycle states: one ACTIVE and one WITHDRAWN enrollment produce record_count 2 — withdrawn students are not filtered out of the state submission."
        test_recipe:
          setup: ["Clock default. TX district LIVE; ADM spec PUBLISHED; year OPEN with two enrollments, one withdrawn 2026-11-09; year then CLOSED_FOR_REPORTING."]
          setup_api_calls:
            - *k_clock
            - *k_d1
            - *k_d1_act
            - *k_sp1
            - *k_sp1_pub
            - *k_y1
            - *k_y1_open
            - *k_st1
            - *k_en1
            - call: "POST /sis/students"
              payload: { district_id: "${d1}", student_number: "S002", first_name: "Bo", last_name: "Reyes", birth_date: "2013-09-09T00:00:00Z", entry_grade_level: "KG" }
              as: Registrar
              captures: { st2: $.data.id }
            - call: "POST /sis/enrollments"
              payload: { student_id: "${st2}", school_year_id: "${y1}", grade_level: "KG", entry_date: "2026-08-01T00:00:00Z" }
              as: Registrar
              captures: { en2: $.data.id }
            - call: "POST /sis/enrollments/${en2}/withdraw"
              payload: { exit_date: "2026-11-09T00:00:00Z" }
              as: Registrar
            - *k_y1_close
          trigger:
            - call: "POST /sis/reporting-extracts"
              payload: { school_year_id: "${y1}", collection_spec_id: "${sp1}", expected_school_year_version: "${y1_v}" }
              as: StateReporter
              captures: { ex1: $.data.id }
          assert:
            - "ReportingExtract.${ex1}.record_count == 2 (ACTIVE and WITHDRAWN both counted)"
            - "ReportingExtract.${ex1}.total_fte_millis == 1556 (1000 for the full-year ACTIVE record + 556 for the 100-day WITHDRAWN record)"

      - name: escalation_priority_urgent_at_exactly_48_hours
        claim_type: constants_applied
        grounds: ["calculations.escalation_priority_calc", "entities.ReportingExtract.fields.escalation_priority"]
        distinguishing_aspect: "The urgency comparison is <= : a rejection landing with exactly 48 hours left before the window closes (2027-07-13T00:00:00Z against a 2027-07-15T00:00:00Z close) is URGENT, not STANDARD."
        test_recipe:
          setup: ["TX district LIVE; ADM spec PUBLISHED; year CLOSED_FOR_REPORTING with one full-year ACTIVE enrollment; extract created and VALIDATED; clock moved to 2027-07-13T00:00:00Z (exactly 48 hours before close)."]
          setup_api_calls:
            - *k_clock
            - *k_d1
            - *k_d1_act
            - *k_sp1
            - *k_sp1_pub
            - *k_y1
            - *k_y1_open
            - *k_st1
            - *k_en1
            - *k_y1_close
            - call: "POST /sis/reporting-extracts"
              payload: { school_year_id: "${y1}", collection_spec_id: "${sp1}", expected_school_year_version: "${y1_v}" }
              as: StateReporter
              captures: { ex1: $.data.id }
            - call: "POST /sis/reporting-extracts/${ex1}/validate"
              payload: {}
              as: StateReporter
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2027-07-13T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /sis/reporting-extracts/${ex1}/submit"
              payload: {}
              as: StateReporter
          trigger:
            - call: "POST /sis/reporting-extracts/${ex1}/resolve"
              payload: { outcome: "REJECTED" }
              as: StateReporter
              captures: { esc: $.data.escalation_priority }
          assert:
            - "${esc} == URGENT (hours_to_close == 48 satisfies the <= 48 rule)"
            - "ReportingExtract.${ex1}.status == REJECTED"

      - name: submit_blocked_while_invalid_records
        claim_type: violation_to_error
        grounds: ["calculations.extract_snapshot_totals", "errors.ERR_EXTRACT_HAS_ERRORS", "entities.StateCollectionSpec.fields.min_membership_days"]
        distinguishing_aspect: "A 5-day membership (exit 2026-08-06) is below min_membership_days 10, so the snapshot flags invalid_record_count 1 and submit is blocked with 409 ERR_EXTRACT_HAS_ERRORS even inside the window."
        test_recipe:
          setup: ["TX district LIVE; ADM spec PUBLISHED; year OPEN with one enrollment withdrawn after 5 days; year CLOSED_FOR_REPORTING; extract created and VALIDATED; clock inside the window at 2027-07-01."]
          setup_api_calls:
            - *k_clock
            - *k_d1
            - *k_d1_act
            - *k_sp1
            - *k_sp1_pub
            - *k_y1
            - *k_y1_open
            - *k_st1
            - *k_en1
            - call: "POST /sis/enrollments/${en1}/withdraw"
              payload: { exit_date: "2026-08-06T00:00:00Z" }
              as: Registrar
            - *k_y1_close
            - call: "POST /sis/reporting-extracts"
              payload: { school_year_id: "${y1}", collection_spec_id: "${sp1}", expected_school_year_version: "${y1_v}" }
              as: StateReporter
              captures: { ex1: $.data.id, ex_inv: $.data.invalid_record_count }
            - call: "POST /sis/reporting-extracts/${ex1}/validate"
              payload: {}
              as: StateReporter
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2027-07-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /sis/reporting-extracts/${ex1}/submit"
              payload: {}
              as: StateReporter
              captures: { err: $.data.error_id }
          assert:
            - "${ex_inv} == 1 (5 days < min_membership_days 10) and validate leaves it at 1"
            - "submit rejected 409 with error_id == ERR_EXTRACT_HAS_ERRORS despite the open window"
            - "ReportingExtract.${ex1}.status remains VALIDATED"

      - name: fte_precision_round_half_up_three_decimals
        claim_type: precision
        grounds: ["calculations.fte_calculation"]
        distinguishing_aspect: "45/180 * 1.25 lands exactly on 0.3125 (exactly representable in binary), so the pinned round_half_up yields 0.313 where round_half_even would yield 0.312 — the rounding mode is observable."
        test_recipe:
          setup: ["Clock default. TX district LIVE; spec PUBLISHED (program GT weight 1.25); year OPEN; one GT enrollment from 2026-08-01 withdrawn 2026-09-15 (membership 45)."]
          setup_api_calls:
            - *k_clock
            - *k_d1
            - *k_d1_act
            - *k_sp1
            - *k_sp1_pub
            - *k_y1
            - *k_y1_open
            - *k_st1
            - call: "POST /sis/enrollments"
              payload: { student_id: "${st1}", school_year_id: "${y1}", grade_level: "09", entry_date: "2026-08-01T00:00:00Z", program_code: "GT" }
              as: Registrar
              captures: { en_gt: $.data.id }
            - call: "POST /sis/enrollments/${en_gt}/withdraw"
              payload: { exit_date: "2026-09-15T00:00:00Z" }
              as: Registrar
          trigger:
            - call: "GET /sis/enrollments/${en_gt}"
              payload: {}
              as: Registrar
          assert:
            - "Enrollment.${en_gt}.membership_days == 45 and program_weight == 1.25"
            - "Enrollment.${en_gt}.fte_adm == 0.313 (round_half_up(0.3125, 3))"

  # ===========================================================================
  - section: validations
    instances:

      - name: missing_auth_headers_on_student_create_returns_unauthenticated
        claim_type: violation_to_error
        grounds: ["validations[priority=1]", "errors.ERR_MISSING_OR_INVALID_USER_CONTEXT"]
        distinguishing_aspect: "Priority 1: with no X-User-ID / X-User-Role headers the request fails 400 ERR_MISSING_OR_INVALID_USER_CONTEXT before any role, existence, or business check."
        test_recipe:
          setup: ["Clock default. Empty database."]
          setup_api_calls:
            - *k_clock
          trigger:
            - call: "POST /sis/students"
              payload: { district_id: "00000000-0000-4000-8000-000000000000", student_number: "S900", first_name: "No", last_name: "Auth", birth_date: "2011-01-01T00:00:00Z", entry_grade_level: "09" }
              captures: { err: $.data.error_id }
          assert:
            - "issued without X-User-ID and X-User-Role headers: response 400 with error_id == ERR_MISSING_OR_INVALID_USER_CONTEXT"

      - name: registrar_cannot_publish_spec_returns_forbidden
        claim_type: violation_to_error
        grounds: ["validations[priority=3]", "errors.ERR_FORBIDDEN", "roles.PlatformAdmin"]
        distinguishing_aspect: "Spec publish is PlatformAdmin-exclusive; a Registrar caller gets 403 ERR_FORBIDDEN and the spec stays DRAFT."
        test_recipe:
          setup: ["Clock default. TX spec created, still DRAFT."]
          setup_api_calls:
            - *k_clock
            - *k_sp1
          trigger:
            - call: "POST /sis/collection-specs/${sp1}/publish"
              payload: {}
              as: Registrar
              captures: { err: $.data.error_id }
          assert:
            - "response status 403 with error_id == ERR_FORBIDDEN"
            - "StateCollectionSpec.${sp1}.status remains DRAFT"

      - name: portal_role_beats_existence_on_unknown_section_returns_forbidden
        claim_type: priority_ordering
        grounds: ["validations[priority=3]", "validations[priority=4]", "errors.ERR_FORBIDDEN"]
        distinguishing_aspect: "Authorization (priority 3) precedes existence (priority 4): a PortalUser reading a non-existent section id gets 403 ERR_FORBIDDEN, never a 404 — the role check fires first."
        test_recipe:
          setup: ["Clock default. Empty database."]
          setup_api_calls:
            - *k_clock
          trigger:
            - call: "GET /sis/sections/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: PortalUser
              as_user_id: "00000000-0000-4000-8000-000000000001"
              captures: { err: $.data.error_id }
          assert:
            - "response status 403 with error_id == ERR_FORBIDDEN (not 404)"

      - name: school_year_end_before_start_returns_date_range
        claim_type: violation_to_error
        grounds: ["validations[priority=7]", "errors.ERR_INVALID_DATE_RANGE"]
        distinguishing_aspect: "A year whose end_date precedes its start_date violates the temporal date-range rule with 422 ERR_INVALID_DATE_RANGE — checked before any overlap analysis."
        test_recipe:
          setup: ["Clock default. TX district created."]
          setup_api_calls:
            - *k_clock
            - *k_d1
          trigger:
            - call: "POST /sis/school-years"
              payload: { district_id: "${d1}", label: "bad", start_date: "2027-06-01T00:00:00Z", end_date: "2026-08-01T00:00:00Z", instructional_days: 180, count_date: "2026-10-01T00:00:00Z" }
              as: DistrictAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response status 422 with error_id == ERR_INVALID_DATE_RANGE"
            - "GET /sis/school-years?district_id=${d1} returns total_count == 0"

