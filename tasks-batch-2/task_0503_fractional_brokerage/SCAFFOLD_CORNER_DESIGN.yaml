        distinguishing_aspect: "Cancelling an ACCEPTED BUY restores the reserved buying power to the account (buying_power returns to pre-order value)."
        test_recipe:
          setup: ["CASH account funded $1000.00 (bp 100000); an ACCEPTED BUY notional 50000 reserves 50000 (bp now 50000)."]
          setup_api_calls:
            - call: "POST /securities"
