          - errors[ERR_STALE_ORDER_VERSION]
          - validations[priority=16]
        distinguishing_aspect: "After placement (version 1), adding a line-item bumps Order.version to 2; dispatching with the stale expected_order_version (1) is rejected 412 ERR_STALE_ORDER_VERSION while the order is still PLACED."
        test_recipe:
          setup: ["Zone DT, open restaurant, $20 item, online dasher; order placed (version 1), then a line item added (version 2, still PLACED)."]
          setup_api_calls:
            - call: "POST /zones"
              payload: { name: "DT", base_delivery_fee_cents: 300, per_km_fee_cents: 120, small_order_threshold_cents: 1500, small_order_fee_cents: 200, delivery_fee_cap_cents: 2000, dasher_min_guarantee_cents: 700, dasher_per_km_pay_cents: 100, dasher_base_pay_cents: 250, service_fee_bps: 850 }
              as: PlatformAdmin
              captures: { zone_id: $.data.id }
            - call: "POST /restaurants"
              payload: { zone_id: "${zone_id}", name: "Burgers", route_distance_km: 4, is_open: true }
              as: PlatformAdmin
              captures: { rest_id: $.data.id }
            - call: "POST /restaurants/${rest_id}/menu-items"
              payload: { name: "Combo", price_cents: 2000, available: true }
              as: Restaurant
              as_user_id: "${rest_id}"
              captures: { item_id: $.data.id }
            - call: "POST /dashers"
              payload: { name: "Dan", home_zone_id: "${zone_id}", availability: "ONLINE" }
              as: PlatformAdmin
              captures: { dasher_id: $.data.id }
            - call: "POST /customers"
              payload: { name: "Cara" }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /orders"
              payload: { customer_id: "${cust_id}", restaurant_id: "${rest_id}", line_items: [ { menu_item_id: "${item_id}", quantity: 1 } ], tip_cents: 0 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { order_id: $.data.id, ver_stale: $.data.version }
            - call: "POST /orders/${order_id}/line-items"
              payload: { menu_item_id: "${item_id}", quantity: 1 }
              as: Customer
              as_user_id: "${cust_id}"
          trigger:
            - call: "POST /orders/${order_id}/dispatch"
              payload: { expected_order_version: "${ver_stale}" }
              as: Restaurant
              as_user_id: "${rest_id}"
              captures: { err: $.data.error_id }
          assert:
