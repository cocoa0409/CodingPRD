      - name: score_out_of_range_rejected
        claim_type: violation_to_error
        grounds: ["errors[ERR_SCORE_OUT_OF_RANGE]"]
        distinguishing_aspect: "Rubric component 101 → ERR_SCORE_OUT_OF_RANGE 422."
        test_recipe:
          setup: ["program; audition with entry"]
          setup_api_calls:
