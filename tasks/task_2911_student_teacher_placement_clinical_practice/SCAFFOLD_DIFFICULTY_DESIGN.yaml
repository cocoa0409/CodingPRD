  - rule_id: boundary_precision_check
    instances:
      - name: readiness_score_exactly_at_the_ready_threshold_is_ready
        grounds:
          - "calculations.candidate_readiness_score"
          - "calculations.candidate_readiness_score.constants"
          - "endpoints.POST /epp/candidates/{candidate_id}/readiness-evaluate"
          - "entities.Candidate.readiness_status"
        distinguishing_aspect: |
          Metric: THE READINESS POINT THRESHOLD, probed on POST /epp/candidates/{candidate_id}/readiness-evaluate.
          The coursework term is a step function of credits, so the reachable scores bracket the READY
          cut exactly: 18 credits yield 40 + 25 + 25 = 90, which is the cut itself and must read READY,
          while 12 credits yield 40 + 25 + 20 = 85, one step below, and must read NOT_READY. The
          comparison is therefore pinned as >= and not >. The sibling boundary instance measures a
          completely different quantity - the integer week count credited at completion - on a different
          endpoint (POST /epp/placements/{placement_id}/complete).
        test_recipe:
          setup:
            - "Build the base fixture at clock 2026-08-01T00:00:00Z; candidate C-1001 holds an 18-credit coursework block."
            - "Add candidate C-1002 with the identical exam and clearance items but a 12-credit coursework block."
            - "Verify every item for both candidates so only the credit count differs."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: {"current_utc": "2026-08-01T00:00:00Z"}
              as: ProgramAdmin
            - call: "POST /epp/districts"
