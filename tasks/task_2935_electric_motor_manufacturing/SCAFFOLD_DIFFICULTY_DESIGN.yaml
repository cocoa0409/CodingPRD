              as: DesignReviewer
              as_user_id: "u_rev_1"
              captures: { d1_v: $.data.version }
            - call: "POST /customer-orders"
              payload: { distributor_id: "${dist_id}", design_id: "${d1_id}", order_type: "MADE_TO_ORDER", quantity: 12, requested_ship_date: "2026-12-01", jurisdiction: "EU" }
              as: ProductionPlanner
