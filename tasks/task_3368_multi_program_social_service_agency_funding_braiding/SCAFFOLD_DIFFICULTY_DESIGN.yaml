          The Enrollment -> Grant pair: a SUSPENDED enrollment may only be reinstated while the
          grant named by Enrollment.grant_id is OPEN or THROTTLED, so after the freeze cascade
          suspends it the enrollment's own reactivation is refused with 409 ERR_GRANT_FROZEN
          even though the enrollment's own status field is a legal from-state.
