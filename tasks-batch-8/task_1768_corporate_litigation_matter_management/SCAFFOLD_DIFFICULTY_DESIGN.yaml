  # =====================================================================
  # Rule 7 — cross_entity_state_dependency (different entity pairs)
  # =====================================================================
- rule_id: cross_entity_state_dependency
  instances:
    - name: engagement_approve_requires_firm_panel_approved
      grounds:
        - state_machines.Engagement.PROPOSED_to_APPROVED
        - state_machines.CounselFirm.PENDING_to_APPROVED
        - validations[priority=16]
      distinguishing_aspect: |
        Engagement->CounselFirm pair: an engagement cannot leave PROPOSED while its firm's
        panel_status is PENDING (conflict cleared but panel not approved); only after the
        CounselFirm transitions to APPROVED does the same approve call succeed — the
        engagement's valid transition is gated by a different entity's state.
