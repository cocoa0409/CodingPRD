  - rule_id: compensating_invariant
    instances:

      - name: trip_denial_restores_the_money_ledger_to_its_pre_submit_identity
        grounds:
          - calculations.commitment_ledgers
          - state_machines.Trip.PENDING_REVIEW_to_DENIED
          - state_machines.ProtectiveDetailAssignment.CONFIRMED_to_CANCELLED
          - entities.Executive.committed_budget_cents
          - entities.Executive.remaining_budget_cents
          - validations[priority=32]
          - endpoints.POST_/exec-protection/trips/{id}/decision
        distinguishing_aspect: |
          Conserved quantity type: MONEY. The invariant is the Q_BUDGET identity
          committed_budget_cents + spent_budget_cents + remaining_budget_cents ==
          annual_security_budget_cents, which must hold before the commitment, while the
          commitment is outstanding, and after the compensation. submit-for-approval is the
          forward operation (+112500 committed) and the DENY decision is its compensator via
          cascade CH-D hop 3 (-112500 committed), returning the ledger to the exact identity
          it started from with no cent of drift and without ever passing through
          spent_budget_cents. The trip's own provisional_security_cost_cents is deliberately
          NOT rewritten to 0 by the compensation — the DENIED approval_state is what removes
          the trip from the committed sum — so an implementation that "compensates" by
          zeroing the trip's stored figure looks identical on the executive and wrong on the
          trip. The DENY hop also proves that validations[priority=32] does not apply to a
          denial: no briefing-ack is ever recorded in this instance.
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T00:00:00Z; TIER_3 executive with annual_security_budget_cents 100000000, residential_component 10.00; PT rated LOW; VERIFIED MEDICAL_EVAC policy 500000000; one APPROVED assessment"
            - "one trip 2026-09-10T00:00:00Z..2026-09-12T00:00:00Z, one leg 2026-09-10T08:00:00Z..2026-09-10T18:00:00Z, one LEAD_AGENT assignment over exactly that window at 9000 (planned 10h, cost 112500), ROUTE_SURVEY recorded COMPLETE"
            - "the trip is submitted for approval so approval_state == PENDING_REVIEW and the commitment is outstanding; briefing_ack_at is left null on purpose"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: SystemOperator
              as_user_id: "ops-1"
            - call: "POST /exec-protection/security-staff"
              payload: { full_name: "Ana Analyst", staff_role: "ANALYST", certification_expires_at: "2027-01-01T00:00:00Z", hourly_rate_cents: 9000 }
              as: SystemOperator
              as_user_id: "ops-1"
              captures: { analyst_id: $.data.id }
            - call: "POST /exec-protection/security-staff"
              payload: { full_name: "Mia Manager", staff_role: "MANAGER", certification_expires_at: "2027-01-01T00:00:00Z", hourly_rate_cents: 11000 }
              as: SystemOperator
              as_user_id: "ops-1"
              captures: { mgr_id: $.data.id }
            - call: "POST /exec-protection/security-staff"
              payload: { full_name: "Dan Director", staff_role: "DIRECTOR", certification_expires_at: "2027-01-01T00:00:00Z", hourly_rate_cents: 15000 }
              as: SystemOperator
              as_user_id: "ops-1"
              captures: { dir_id: $.data.id }
            - call: "POST /exec-protection/security-staff"
              payload: { full_name: "Lee Lead", staff_role: "ANALYST", certification_expires_at: "2027-01-01T00:00:00Z", hourly_rate_cents: 9000 }
              as: SystemOperator
              as_user_id: "ops-1"
              captures: { lead_id: $.data.id }
            - call: "POST /exec-protection/executives"
              payload: { full_name: "Eve Exec", tier: "TIER_3", role_title: "CEO", base_country_code: "US", annual_security_budget_cents: 100000000 }
              as: ProtectionManager
              as_user_id: "${mgr_id}"
