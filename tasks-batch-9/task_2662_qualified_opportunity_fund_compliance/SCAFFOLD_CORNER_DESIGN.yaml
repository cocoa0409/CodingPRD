          - entities.QOZBusiness.fields.wcsh_protected_amount
        distinguishing_aspect: "The declared DRAFT -> ACTIVE trigger fires and its cascade lands in one request: the plan's covered dollars become sheltered working capital, so QOZBusiness.wcsh_protected_amount rises to 300000.00 and nqfp_amount is recomputed downward to 0.00."
        test_recipe:
          setup:
            - "One SELF_CERTIFIED Fund and one UNTESTED QOZBusiness reporting declared_nqfp_amount 300000.00 against total_asset_value 1000000.00."
            - "One DRAFT WorkingCapitalPlan covering 300000.00 over three monthly buckets of 100000.00 each, window_start 2026-01-01, with a non-blank written plan reference."
          setup_api_calls:
            - call: "POST /qof/funds"
