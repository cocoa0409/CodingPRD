  # ===========================================================================
  # excluded_because stubs — corners already exercised by a §1.8 instance
  # ===========================================================================
  - section: errors
    instances:
      - name: error_equipment_mismatch_on_dispatch
        claim_type: violation_to_error
        grounds: ["errors[ERR_EQUIPMENT_MISMATCH]"]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / safety_beats_fiscal_on_dispatch_returns_equipment_mismatch
          rationale: "ERR_EQUIPMENT_MISMATCH is asserted as the winning error of the named §1.8 priority-conflict instance."

      - name: error_carrier_suspended_on_dispatch
        claim_type: violation_to_error
        grounds: ["errors[ERR_CARRIER_SUSPENDED]"]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / dispatch_blocked_by_suspended_carrier
          rationale: "ERR_CARRIER_SUSPENDED is the asserted failure path of the named §1.8 instance."

      - name: error_terminal_slot_conflict_on_create
        claim_type: violation_to_error
        grounds: ["errors[ERR_TERMINAL_SLOT_CONFLICT]"]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / terminal_dock_buffered_closed_interval_overlap
          rationale: "ERR_TERMINAL_SLOT_CONFLICT is the asserted failure path of the named §1.8 instance."

      - name: error_carrier_schedule_conflict_on_dispatch
        claim_type: violation_to_error
        grounds: ["errors[ERR_CARRIER_SCHEDULE_CONFLICT]"]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / carrier_schedule_halfopen_pickup_window_overlap
          rationale: "ERR_CARRIER_SCHEDULE_CONFLICT is the asserted failure path of the named §1.8 instance."

      - name: error_quote_expired_on_accept
        claim_type: violation_to_error
        grounds: ["errors[ERR_QUOTE_EXPIRED]"]
        excluded_because:
