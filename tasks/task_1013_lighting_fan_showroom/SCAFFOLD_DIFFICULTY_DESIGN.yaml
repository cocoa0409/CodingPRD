# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Lighting & Fan Showroom — 9 rule_ids × 2 instances = 18 instances.
# All setup uses StoreManager (authorized on every endpoint). All
# expected_order_version values come from a captured $.data.version.
# =============================================================================
scaffold_difficulty_design:

  - rule_id: dual_variant_calc
    instances:
      - name: order_estimate_vs_final_tier_upgrade
        grounds:
          - calculations.order_pricing
          - entities.Order.fields.total_estimate_cents
          - entities.Order.fields.total_final_cents
          - state_machines.Order.QUOTED_to_CONFIRMED
        distinguishing_aspect: "order_pricing (on Order): estimate uses the tier at quote time (STANDARD -> 1000000) while final uses the tier at settlement (GOLD -> 850000); same lines, two tier snapshots, divergent totals."
        test_recipe:
          setup:
            - "Trade account (credit_limit 100000000) starts STANDARD."
            - "OrderX (1 line, subtotal 1000000) quoted while account is STANDARD (estimate 1000000)."
            - "A separate OrderY (subtotal 5000000) is confirmed and SETTLED, pushing the account's annual_spend to 5000000 -> tier GOLD."
            - "OrderX is then confirmed (committed = STANDARD estimate 1000000)."
          setup_api_calls:
            - { call: "POST /trade-accounts", payload: { business_name: "DV Co", contact_email: "dv@x.com", credit_limit_cents: 100000000 }, as: StoreManager, captures: { acct: "$.data.id" } }
            - { call: "POST /fixture-models", payload: { sku_base: "F-DV", category: "CHANDELIER", base_price_cents: 1000000, base_wattage: 100 }, as: StoreManager, captures: { fx: "$.data.id" } }
            - { call: "POST /orders", payload: { customer_name: "X", trade_account_id: "${acct}" }, as: StoreManager, captures: { ox: "$.data.id" } }
            - { call: "POST /orders/${ox}/lines", payload: { fixture_model_id: "${fx}", quantity: 1 }, as: StoreManager }
            - { call: "GET /orders/${ox}", payload: {}, as: StoreManager, captures: { oxv: "$.data.version" } }
            - { call: "POST /orders/${ox}/quote", payload: { expected_order_version: "${oxv}" }, as: StoreManager }
            - { call: "POST /orders", payload: { customer_name: "Y", trade_account_id: "${acct}" }, as: StoreManager, captures: { oy: "$.data.id" } }
            - { call: "POST /orders/${oy}/lines", payload: { fixture_model_id: "${fx}", quantity: 5 }, as: StoreManager }
            - { call: "GET /orders/${oy}", payload: {}, as: StoreManager, captures: { oyv: "$.data.version" } }
            - { call: "POST /orders/${oy}/quote", payload: { expected_order_version: "${oyv}" }, as: StoreManager }
            - { call: "POST /orders/${oy}/confirm", payload: {}, as: StoreManager }
            - { call: "POST /orders/${oy}/payments", payload: { kind: "SETTLEMENT", amount_cents: 5000000 }, as: StoreManager }
            - { call: "POST /orders/${ox}/confirm", payload: {}, as: StoreManager }
          trigger:
            - { call: "POST /orders/${ox}/payments", payload: { kind: "SETTLEMENT", amount_cents: 1000000 }, as: StoreManager }
          assert:
            - "Order.${ox}.total_estimate_cents == 1000000"
            - "Order.${ox}.discount_final_cents == 150000"
            - "Order.${ox}.total_final_cents == 850000"

      - name: special_order_estimated_vs_actual_ready
        grounds:
          - calculations.special_order_lead_time
          - entities.SpecialOrder.fields.estimated_ready_date
          - entities.SpecialOrder.fields.actual_ready_date
          - entities.SpecialOrder.fields.variance_days
          - state_machines.SpecialOrder.CONFIRMED_to_READY
        distinguishing_aspect: "special_order_lead_time (on SpecialOrder, a different entity domain than order_pricing): estimated_ready_date is the forward projection confirmed_at+30d (2026-07-31) while actual_ready_date is the real clock at READY (2026-08-05), yielding variance_days == 5."
        test_recipe:
          setup:
            - "Clock at server default 2026-07-01T00:00:00Z."
            - "Retail order confirmed; a SpecialOrder (supplier_lead_days 30) confirmed at 2026-07-01 -> estimated_ready 2026-07-31."
            - "Clock advanced to 2026-08-05 before completion."
          setup_api_calls:
            - { call: "POST /fixture-models", payload: { sku_base: "F-SO", category: "PENDANT", base_price_cents: 50000, base_wattage: 40, special_order_only: true }, as: StoreManager, captures: { fx: "$.data.id" } }
            - { call: "POST /orders", payload: { customer_name: "S" }, as: StoreManager, captures: { o: "$.data.id" } }
            - { call: "POST /orders/${o}/lines", payload: { fixture_model_id: "${fx}", quantity: 1 }, as: StoreManager, captures: { line: "$.data.id" } }
            - { call: "GET /orders/${o}", payload: {}, as: StoreManager, captures: { ov: "$.data.version" } }
            - { call: "POST /orders/${o}/quote", payload: { expected_order_version: "${ov}" }, as: StoreManager }
            - { call: "POST /orders/${o}/confirm", payload: {}, as: StoreManager }
            - { call: "POST /special-orders", payload: { order_id: "${o}", order_line_id: "${line}", supplier_lead_days: 30 }, as: StoreManager, captures: { so: "$.data.id" } }
            - { call: "POST /special-orders/${so}/confirm", payload: {}, as: StoreManager }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-05T00:00:00Z" }, as: StoreManager }
          trigger:
            - { call: "POST /special-orders/${so}/complete", payload: {}, as: StoreManager }
          assert:
            - "SpecialOrder.${so}.estimated_ready_date == \"2026-07-31T00:00:00.000Z\""
            - "SpecialOrder.${so}.actual_ready_date == \"2026-08-05T00:00:00.000Z\""
            - "SpecialOrder.${so}.variance_days == 5"

  - rule_id: combinatorial_formula
    instances:
      - name: order_discount_cap_min_nonlinear
        grounds:
          - calculations.order_pricing
          - entities.Order.fields.discount_estimate_cents
          - calculations.trade_tier_and_credit
        distinguishing_aspect: "Mode (a): discount_cents = min(round_half_up(subtotal*pct), DISCOUNT_CAP_CENTS) has 3 inputs (subtotal 2000000, GOLD pct 0.15, cap 200000) with a non-linear min; raw 300000 is clamped to the 200000 cap."
        test_recipe:
          setup:
            - "Account pushed to GOLD by a settled 5000000 order."
            - "A second order on the account has subtotal 2000000 (2 x 1000000)."
          setup_api_calls:
            - { call: "POST /trade-accounts", payload: { business_name: "Cap Co", contact_email: "cap@x.com", credit_limit_cents: 100000000 }, as: StoreManager, captures: { acct: "$.data.id" } }
            - { call: "POST /fixture-models", payload: { sku_base: "F-CAP", category: "CHANDELIER", base_price_cents: 1000000, base_wattage: 100 }, as: StoreManager, captures: { fx: "$.data.id" } }
            - { call: "POST /orders", payload: { customer_name: "spend", trade_account_id: "${acct}" }, as: StoreManager, captures: { os: "$.data.id" } }
            - { call: "POST /orders/${os}/lines", payload: { fixture_model_id: "${fx}", quantity: 5 }, as: StoreManager }
            - { call: "GET /orders/${os}", payload: {}, as: StoreManager, captures: { osv: "$.data.version" } }
            - { call: "POST /orders/${os}/quote", payload: { expected_order_version: "${osv}" }, as: StoreManager }
            - { call: "POST /orders/${os}/confirm", payload: {}, as: StoreManager }
            - { call: "POST /orders/${os}/payments", payload: { kind: "SETTLEMENT", amount_cents: 5000000 }, as: StoreManager }
            - { call: "POST /orders", payload: { customer_name: "cap", trade_account_id: "${acct}" }, as: StoreManager, captures: { oc: "$.data.id" } }
            - { call: "POST /orders/${oc}/lines", payload: { fixture_model_id: "${fx}", quantity: 2 }, as: StoreManager }
            - { call: "GET /orders/${oc}", payload: {}, as: StoreManager, captures: { ocv: "$.data.version" } }
          trigger:
            - { call: "POST /orders/${oc}/quote", payload: { expected_order_version: "${ocv}" }, as: StoreManager }
          assert:
            - "Order.${oc}.subtotal_estimate_cents == 2000000"
            - "Order.${oc}.discount_estimate_cents == 200000"
            - "Order.${oc}.total_estimate_cents == 1800000"

      - name: rebate_round_per_line_then_sum
        grounds:
          - calculations.rebate_amount
          - entities.RebateClaim.fields.claimed_cents
        distinguishing_aspect: "Mode (b): claimed_cents rounds each eligible line THEN sums — 3 lines of round_half_up(2010*0.075)=151 give 453, whereas sum-then-round of 2010*3*0.075=452.25 would give 452; the pinned order changes the cent."
        test_recipe:
          setup:
            - "ENERGY STAR fixture (base_wattage 60 <= ceiling 100), unit_price 2010."
            - "Order has THREE separate ACTIVE lines of that fixture (quantity 1 each)."
          setup_api_calls:
            - { call: "POST /rebate-programs", payload: { name: "Rounding", rebate_rate: 0.075, wattage_ceiling: 100, budget_total_cents: 100000000 }, as: StoreManager, captures: { prog: "$.data.id" } }
            - { call: "POST /fixture-models", payload: { sku_base: "F-RB", category: "RECESSED", base_price_cents: 2010, base_wattage: 60, energy_star: true }, as: StoreManager, captures: { fx: "$.data.id" } }
            - { call: "POST /orders", payload: { customer_name: "RB" }, as: StoreManager, captures: { o: "$.data.id" } }
            - { call: "POST /orders/${o}/lines", payload: { fixture_model_id: "${fx}", quantity: 1 }, as: StoreManager }
            - { call: "POST /orders/${o}/lines", payload: { fixture_model_id: "${fx}", quantity: 1 }, as: StoreManager }
            - { call: "POST /orders/${o}/lines", payload: { fixture_model_id: "${fx}", quantity: 1 }, as: StoreManager }
          trigger:
            - { call: "POST /rebate-claims", payload: { order_id: "${o}", rebate_program_id: "${prog}" }, as: StoreManager, captures: { claim: "$.data.id" } }
          assert:
            - "RebateClaim.${claim}.claimed_cents == 453"

  - rule_id: non_linear_state_machine
    instances:
      - name: order_parallel_payment_fulfillment_axes
        grounds:
          - state_machines.Order.UNPAID_to_DEPOSIT_PAID
          - state_machines.Order.QUOTED_to_CONFIRMED
          - entities.Order.fields.fulfillment_status
          - entities.Order.fields.payment_status
        distinguishing_aspect: "Order has two independent state axes: a DEPOSIT payment moves payment_status UNPAID->DEPOSIT_PAID while fulfillment_status stays QUOTED; a later confirm moves fulfillment QUOTED->CONFIRMED while payment_status stays DEPOSIT_PAID."
        test_recipe:
          setup:
            - "Retail order with one line, quoted (fulfillment QUOTED, payment UNPAID)."
          setup_api_calls:
            - { call: "POST /fixture-models", payload: { sku_base: "F-PAR", category: "SCONCE", base_price_cents: 5000, base_wattage: 40 }, as: StoreManager, captures: { fx: "$.data.id" } }
            - { call: "POST /orders", payload: { customer_name: "P" }, as: StoreManager, captures: { o: "$.data.id" } }
            - { call: "POST /orders/${o}/lines", payload: { fixture_model_id: "${fx}", quantity: 1 }, as: StoreManager }
            - { call: "GET /orders/${o}", payload: {}, as: StoreManager, captures: { ov: "$.data.version" } }
            - { call: "POST /orders/${o}/quote", payload: { expected_order_version: "${ov}" }, as: StoreManager }
          trigger:
            - { call: "POST /orders/${o}/payments", payload: { kind: "DEPOSIT", amount_cents: 1000 }, as: StoreManager }
            - { call: "POST /orders/${o}/confirm", payload: {}, as: StoreManager }
          assert:
            - "Order.${o}.payment_status == \"DEPOSIT_PAID\""
            - "Order.${o}.fulfillment_status == \"CONFIRMED\""

      - name: design_consult_revision_cycle
        grounds:
          - state_machines.DesignConsult.IN_REVIEW_to_REVISION
          - state_machines.DesignConsult.REVISION_to_IN_REVIEW
          - entities.DesignConsult.fields.revision_count
        distinguishing_aspect: "DesignConsult (different entity than Order) is cyclic: IN_REVIEW->REVISION->IN_REVIEW is traversed twice (revision_count reaches 2) before APPROVED, a loop no linear pipeline can express."
        test_recipe:
          setup:
            - "Design consult created for a trade account (status REQUESTED)."
          setup_api_calls:
            - { call: "POST /trade-accounts", payload: { business_name: "DesignerCo", contact_email: "d@x.com" }, as: StoreManager, captures: { acct: "$.data.id" } }
            - { call: "POST /design-consults", payload: { trade_account_id: "${acct}", room_type: "KITCHEN", fee_cents: 15000 }, as: StoreManager, captures: { dc: "$.data.id" } }
            - { call: "POST /design-consults/${dc}/submit-review", payload: {}, as: StoreManager }
            - { call: "POST /design-consults/${dc}/request-revision", payload: {}, as: StoreManager }
            - { call: "POST /design-consults/${dc}/submit-review", payload: {}, as: StoreManager }
            - { call: "POST /design-consults/${dc}/request-revision", payload: {}, as: StoreManager }
            - { call: "POST /design-consults/${dc}/submit-review", payload: {}, as: StoreManager }
          trigger:
            - { call: "POST /design-consults/${dc}/approve", payload: {}, as: StoreManager }
          assert:
            - "DesignConsult.${dc}.status == \"APPROVED\""
            - "DesignConsult.${dc}.revision_count == 2"

  - rule_id: transitive_cascade
    instances:
      - name: order_cancel_voids_delivery_withdraws_install_frees_installer
        grounds:
          - state_machines.Order.CONFIRMED_to_CANCELLED
          - state_machines.DeliveryJob.SCHEDULED_to_VOIDED
          - state_machines.InstallReferral.SCHEDULED_to_WITHDRAWN
          - entities.Installer.fields.active_referral_count
        distinguishing_aspect: "Depth-3 chain from order cancel: Order->CANCELLED voids its SCHEDULED DeliveryJob (link1); the job's VOIDED withdraws the linked InstallReferral (link2); the referral's WITHDRAWN decrements Installer.active_referral_count from 1 to 0 (link3) — each hop caused by the prior."
        test_recipe:
          setup:
            - "Retail order confirmed; a SCHEDULED (not delivered) DeliveryJob on it; a REFERRED InstallReferral linked to that job and to an Installer (active_referral_count == 1)."
          setup_api_calls:
            - { call: "POST /installers", payload: { name: "Ivan", service_area: "NORTH" }, as: StoreManager, captures: { inst: "$.data.id" } }
            - { call: "POST /delivery-trucks", payload: { name: "T1" }, as: StoreManager, captures: { truck: "$.data.id" } }
            - { call: "POST /fixture-models", payload: { sku_base: "F-CA", category: "SCONCE", base_price_cents: 8000, base_wattage: 40 }, as: StoreManager, captures: { fx: "$.data.id" } }
            - { call: "POST /orders", payload: { customer_name: "CA" }, as: StoreManager, captures: { o: "$.data.id" } }
            - { call: "POST /orders/${o}/lines", payload: { fixture_model_id: "${fx}", quantity: 1 }, as: StoreManager }
            - { call: "GET /orders/${o}", payload: {}, as: StoreManager, captures: { ov: "$.data.version" } }
            - { call: "POST /orders/${o}/quote", payload: { expected_order_version: "${ov}" }, as: StoreManager }
            - { call: "POST /orders/${o}/confirm", payload: {}, as: StoreManager }
            - { call: "POST /delivery-jobs", payload: { order_id: "${o}", delivery_truck_id: "${truck}", window_start: "2026-07-10T10:00:00Z", window_end: "2026-07-10T12:00:00Z" }, as: StoreManager, captures: { dj: "$.data.id" } }
            - { call: "POST /install-referrals", payload: { order_id: "${o}", installer_id: "${inst}", delivery_job_id: "${dj}" }, as: StoreManager, captures: { ref: "$.data.id" } }
          trigger:
            - { call: "POST /orders/${o}/cancel", payload: {}, as: StoreManager }
          assert:
            - "Order.${o}.fulfillment_status == \"CANCELLED\""
            - "DeliveryJob.${dj}.status == \"VOIDED\""
            - "InstallReferral.${ref}.status == \"WITHDRAWN\""
            - "Installer.${inst}.active_referral_count == 0"

      - name: return_approve_returns_line_recomputes_order_final
        grounds:
          - state_machines.ReturnRequest.REQUESTED_to_APPROVED
          - entities.OrderLine.fields.line_status
          - entities.Order.fields.subtotal_final_cents
        distinguishing_aspect: "Depth-2 chain from a different trigger (return approve): approve flips the target OrderLine ACTIVE->RETURNED (link1); that line change forces Order.subtotal_final_cents/total_final_cents to recompute over the remaining ACTIVE line, dropping 10000 -> 5000 (link2)."
        test_recipe:
          setup:
            - "Retail order, 2 lines of 5000 each (subtotal 10000), confirmed and SETTLED (total_final 10000)."
            - "A ReturnRequest (reason DAMAGE) filed against line 1."
          setup_api_calls:
            - { call: "POST /fixture-models", payload: { sku_base: "F-RT", category: "PENDANT", base_price_cents: 5000, base_wattage: 40 }, as: StoreManager, captures: { fx: "$.data.id" } }
            - { call: "POST /orders", payload: { customer_name: "RT" }, as: StoreManager, captures: { o: "$.data.id" } }
            - { call: "POST /orders/${o}/lines", payload: { fixture_model_id: "${fx}", quantity: 1 }, as: StoreManager, captures: { l1: "$.data.id" } }
            - { call: "POST /orders/${o}/lines", payload: { fixture_model_id: "${fx}", quantity: 1 }, as: StoreManager, captures: { l2: "$.data.id" } }
            - { call: "GET /orders/${o}", payload: {}, as: StoreManager, captures: { ov: "$.data.version" } }
            - { call: "POST /orders/${o}/quote", payload: { expected_order_version: "${ov}" }, as: StoreManager }
            - { call: "POST /orders/${o}/confirm", payload: {}, as: StoreManager }
            - { call: "POST /orders/${o}/payments", payload: { kind: "SETTLEMENT", amount_cents: 10000 }, as: StoreManager }
            - { call: "POST /return-requests", payload: { order_id: "${o}", order_line_id: "${l1}", reason: "DAMAGE" }, as: StoreManager, captures: { rr: "$.data.id" } }
          trigger:
            - { call: "POST /return-requests/${rr}/approve", payload: {}, as: StoreManager }
          assert:
            - "ReturnRequest.${rr}.status == \"APPROVED\""
            - "OrderLine.${l1}.line_status == \"RETURNED\""
            - "Order.${o}.subtotal_final_cents == 5000"
            - "Order.${o}.total_final_cents == 5000"

  - rule_id: priority_pair_validation_conflict
    instances:
      - name: confirm_state_beats_fiscal
        grounds:
          - validations[priority=10]
          - validations[priority=40]
          - errors[ERR_INVALID_STATE]
          - errors[ERR_INSUFFICIENT_CREDIT]
        distinguishing_aspect: "On confirm of a CANCELLED trade order with credit_limit 0: the state check (priority 10, category state) and the fiscal check (priority 40, business_fiscal, available 0 < estimate 300000) both fail; the server returns ERR_INVALID_STATE, not ERR_INSUFFICIENT_CREDIT."
        test_recipe:
          setup:
            - "Trade account credit_limit 0."
            - "Order (subtotal 300000) quoted (estimate 300000) then CANCELLED (estimate retained)."
          setup_api_calls:
            - { call: "POST /trade-accounts", payload: { business_name: "Zero", contact_email: "z@x.com", credit_limit_cents: 0 }, as: StoreManager, captures: { acct: "$.data.id" } }
            - { call: "POST /fixture-models", payload: { sku_base: "F-SF", category: "CHANDELIER", base_price_cents: 300000, base_wattage: 100 }, as: StoreManager, captures: { fx: "$.data.id" } }
            - { call: "POST /orders", payload: { customer_name: "SF", trade_account_id: "${acct}" }, as: StoreManager, captures: { o: "$.data.id" } }
            - { call: "POST /orders/${o}/lines", payload: { fixture_model_id: "${fx}", quantity: 1 }, as: StoreManager }
            - { call: "GET /orders/${o}", payload: {}, as: StoreManager, captures: { ov: "$.data.version" } }
            - { call: "POST /orders/${o}/quote", payload: { expected_order_version: "${ov}" }, as: StoreManager }
            - { call: "POST /orders/${o}/cancel", payload: {}, as: StoreManager }
          trigger:
            - { call: "POST /orders/${o}/confirm", payload: {}, as: StoreManager, captures: { err: "$.data.error_id" } }
          assert:
            - "response.data.error_id == \"ERR_INVALID_STATE\""
            - "http_status == 409"

      - name: schedule_referential_beats_temporal
        grounds:
          - validations[priority=20]
          - validations[priority=25]
          - errors[ERR_DELIVERY_NOT_READY]
          - errors[ERR_INSTALLER_UNAVAILABLE]
        distinguishing_aspect: "On scheduling an install whose DeliveryJob is only SCHEDULED (not DELIVERED) AND whose appointment overlaps an existing SCHEDULED referral for the same installer: referential (priority 20) and temporal (priority 25) both fail; the server returns ERR_DELIVERY_NOT_READY, not ERR_INSTALLER_UNAVAILABLE."
        test_recipe:
          setup:
            - "Installer I; Order1 with a DELIVERED job J1; referral R1 scheduled [10:00,12:00) on I."
            - "Order2 with a SCHEDULED (undelivered) job J2 on a second truck; referral R2 linked to J2."
          setup_api_calls:
            - { call: "POST /installers", payload: { name: "I", service_area: "S" }, as: StoreManager, captures: { inst: "$.data.id" } }
            - { call: "POST /delivery-trucks", payload: { name: "TA" }, as: StoreManager, captures: { tA: "$.data.id" } }
            - { call: "POST /delivery-trucks", payload: { name: "TB" }, as: StoreManager, captures: { tB: "$.data.id" } }
            - { call: "POST /fixture-models", payload: { sku_base: "F-CB", category: "SCONCE", base_price_cents: 5000, base_wattage: 40 }, as: StoreManager, captures: { fx: "$.data.id" } }
            - { call: "POST /orders", payload: { customer_name: "O1" }, as: StoreManager, captures: { o1: "$.data.id" } }
            - { call: "POST /orders/${o1}/lines", payload: { fixture_model_id: "${fx}", quantity: 1 }, as: StoreManager }
            - { call: "GET /orders/${o1}", payload: {}, as: StoreManager, captures: { o1v: "$.data.version" } }
            - { call: "POST /orders/${o1}/quote", payload: { expected_order_version: "${o1v}" }, as: StoreManager }
            - { call: "POST /orders/${o1}/confirm", payload: {}, as: StoreManager }
            - { call: "POST /delivery-jobs", payload: { order_id: "${o1}", delivery_truck_id: "${tA}", window_start: "2026-07-10T08:00:00Z", window_end: "2026-07-10T09:00:00Z" }, as: StoreManager, captures: { j1: "$.data.id" } }
            - { call: "POST /delivery-jobs/${j1}/deliver", payload: {}, as: StoreManager }
            - { call: "POST /install-referrals", payload: { order_id: "${o1}", installer_id: "${inst}", delivery_job_id: "${j1}" }, as: StoreManager, captures: { r1: "$.data.id" } }
            - { call: "POST /install-referrals/${r1}/schedule", payload: { appointment_start: "2026-07-10T10:00:00Z", appointment_end: "2026-07-10T12:00:00Z" }, as: StoreManager }
            - { call: "POST /orders", payload: { customer_name: "O2" }, as: StoreManager, captures: { o2: "$.data.id" } }
            - { call: "POST /orders/${o2}/lines", payload: { fixture_model_id: "${fx}", quantity: 1 }, as: StoreManager }
            - { call: "GET /orders/${o2}", payload: {}, as: StoreManager, captures: { o2v: "$.data.version" } }
            - { call: "POST /orders/${o2}/quote", payload: { expected_order_version: "${o2v}" }, as: StoreManager }
            - { call: "POST /orders/${o2}/confirm", payload: {}, as: StoreManager }
            - { call: "POST /delivery-jobs", payload: { order_id: "${o2}", delivery_truck_id: "${tB}", window_start: "2026-07-10T08:00:00Z", window_end: "2026-07-10T09:00:00Z" }, as: StoreManager, captures: { j2: "$.data.id" } }
            - { call: "POST /install-referrals", payload: { order_id: "${o2}", installer_id: "${inst}", delivery_job_id: "${j2}" }, as: StoreManager, captures: { r2: "$.data.id" } }
          trigger:
            - { call: "POST /install-referrals/${r2}/schedule", payload: { appointment_start: "2026-07-10T11:00:00Z", appointment_end: "2026-07-10T13:00:00Z" }, as: StoreManager, captures: { err: "$.data.error_id" } }
          assert:
            - "response.data.error_id == \"ERR_DELIVERY_NOT_READY\""
            - "http_status == 409"

  - rule_id: boundary_precision_check
    instances:
      - name: trade_tier_silver_inclusive_boundary
        grounds:
          - calculations.trade_tier_and_credit
          - entities.TradeAccount.fields.tier
          - entities.TradeAccount.fields.annual_spend_cents
        distinguishing_aspect: "annual_spend_cents lands exactly on SILVER_THRESHOLD_CENTS (2000000): a settlement of exactly 2000000 yields tier SILVER (inclusive >=), not STANDARD; the boundary metric is a money threshold reached via settlement."
        test_recipe:
          setup:
            - "Trade account (credit_limit 100000000) with one order of subtotal exactly 2000000, confirmed."
          setup_api_calls:
            - { call: "POST /trade-accounts", payload: { business_name: "Boundary", contact_email: "b@x.com", credit_limit_cents: 100000000 }, as: StoreManager, captures: { acct: "$.data.id" } }
            - { call: "POST /fixture-models", payload: { sku_base: "F-TB", category: "CHANDELIER", base_price_cents: 2000000, base_wattage: 100 }, as: StoreManager, captures: { fx: "$.data.id" } }
            - { call: "POST /orders", payload: { customer_name: "TB", trade_account_id: "${acct}" }, as: StoreManager, captures: { o: "$.data.id" } }
            - { call: "POST /orders/${o}/lines", payload: { fixture_model_id: "${fx}", quantity: 1 }, as: StoreManager }
            - { call: "GET /orders/${o}", payload: {}, as: StoreManager, captures: { ov: "$.data.version" } }
            - { call: "POST /orders/${o}/quote", payload: { expected_order_version: "${ov}" }, as: StoreManager }
            - { call: "POST /orders/${o}/confirm", payload: {}, as: StoreManager }
          trigger:
            - { call: "POST /orders/${o}/payments", payload: { kind: "SETTLEMENT", amount_cents: 2000000 }, as: StoreManager }
            - { call: "GET /trade-accounts/${acct}", payload: {}, as: StoreManager }
          assert:
            - "TradeAccount.${acct}.annual_spend_cents == 2000000"
            - "TradeAccount.${acct}.tier == \"SILVER\""
            - "TradeAccount.${acct}.discount_pct == 0.08"

      - name: rebate_zero_eligible_empty_set
        grounds:
          - calculations.rebate_amount
          - validations[priority=30]
          - errors[ERR_NO_ELIGIBLE_ITEMS]
        distinguishing_aspect: "Empty-collection edge on a different endpoint (POST /rebate-claims): an order whose only line is non-ENERGY-STAR has zero eligible lines, so claim submission is rejected with ERR_NO_ELIGIBLE_ITEMS (distinct from the tier money-threshold boundary)."
        test_recipe:
          setup:
            - "Rebate program (rate 0.075, ceiling 100). Order with a single line whose fixture is NOT energy_star."
          setup_api_calls:
            - { call: "POST /rebate-programs", payload: { name: "NoElig", rebate_rate: 0.075, wattage_ceiling: 100, budget_total_cents: 100000 }, as: StoreManager, captures: { prog: "$.data.id" } }
            - { call: "POST /fixture-models", payload: { sku_base: "F-NE", category: "RECESSED", base_price_cents: 3000, base_wattage: 40, energy_star: false }, as: StoreManager, captures: { fx: "$.data.id" } }
            - { call: "POST /orders", payload: { customer_name: "NE" }, as: StoreManager, captures: { o: "$.data.id" } }
            - { call: "POST /orders/${o}/lines", payload: { fixture_model_id: "${fx}", quantity: 2 }, as: StoreManager }
          trigger:
            - { call: "POST /rebate-claims", payload: { order_id: "${o}", rebate_program_id: "${prog}" }, as: StoreManager, captures: { err: "$.data.error_id" } }
          assert:
            - "response.data.error_id == \"ERR_NO_ELIGIBLE_ITEMS\""
            - "http_status == 422"

  - rule_id: cross_entity_state_dependency
    instances:
      - name: special_order_confirm_requires_order_confirmed
        grounds:
          - state_machines.SpecialOrder.REQUESTED_to_CONFIRMED
          - validations[priority=12]
          - errors[ERR_ORDER_NOT_CONFIRMED]
        distinguishing_aspect: "SpecialOrder confirm depends on the parent Order (pair SpecialOrder<-Order): with Order only QUOTED (not CONFIRMED), the confirm is rejected with ERR_ORDER_NOT_CONFIRMED."
        test_recipe:
          setup:
            - "Order QUOTED (not confirmed) with a special-order-only line; a SpecialOrder created against it (REQUESTED)."
          setup_api_calls:
            - { call: "POST /fixture-models", payload: { sku_base: "F-CE", category: "PENDANT", base_price_cents: 9000, base_wattage: 40, special_order_only: true }, as: StoreManager, captures: { fx: "$.data.id" } }
            - { call: "POST /orders", payload: { customer_name: "CE" }, as: StoreManager, captures: { o: "$.data.id" } }
            - { call: "POST /orders/${o}/lines", payload: { fixture_model_id: "${fx}", quantity: 1 }, as: StoreManager, captures: { line: "$.data.id" } }
            - { call: "GET /orders/${o}", payload: {}, as: StoreManager, captures: { ov: "$.data.version" } }
            - { call: "POST /orders/${o}/quote", payload: { expected_order_version: "${ov}" }, as: StoreManager }
            - { call: "POST /special-orders", payload: { order_id: "${o}", order_line_id: "${line}", supplier_lead_days: 20 }, as: StoreManager, captures: { so: "$.data.id" } }
          trigger:
            - { call: "POST /special-orders/${so}/confirm", payload: {}, as: StoreManager, captures: { err: "$.data.error_id" } }
          assert:
            - "response.data.error_id == \"ERR_ORDER_NOT_CONFIRMED\""
            - "http_status == 409"

      - name: install_schedule_requires_delivery_delivered
        grounds:
          - state_machines.InstallReferral.REFERRED_to_SCHEDULED
          - validations[priority=20]
          - errors[ERR_DELIVERY_NOT_READY]
        distinguishing_aspect: "InstallReferral schedule depends on the linked DeliveryJob (pair InstallReferral<-DeliveryJob, different from SpecialOrder<-Order): with the job only SCHEDULED (not DELIVERED), schedule is rejected with ERR_DELIVERY_NOT_READY."
        test_recipe:
          setup:
            - "Order confirmed; a SCHEDULED (undelivered) DeliveryJob; a REFERRED InstallReferral linked to it."
          setup_api_calls:
            - { call: "POST /installers", payload: { name: "I7", service_area: "S" }, as: StoreManager, captures: { inst: "$.data.id" } }
            - { call: "POST /delivery-trucks", payload: { name: "T7" }, as: StoreManager, captures: { truck: "$.data.id" } }
            - { call: "POST /fixture-models", payload: { sku_base: "F-7B", category: "SCONCE", base_price_cents: 5000, base_wattage: 40 }, as: StoreManager, captures: { fx: "$.data.id" } }
            - { call: "POST /orders", payload: { customer_name: "7B" }, as: StoreManager, captures: { o: "$.data.id" } }
            - { call: "POST /orders/${o}/lines", payload: { fixture_model_id: "${fx}", quantity: 1 }, as: StoreManager }
            - { call: "GET /orders/${o}", payload: {}, as: StoreManager, captures: { ov: "$.data.version" } }
            - { call: "POST /orders/${o}/quote", payload: { expected_order_version: "${ov}" }, as: StoreManager }
            - { call: "POST /orders/${o}/confirm", payload: {}, as: StoreManager }
            - { call: "POST /delivery-jobs", payload: { order_id: "${o}", delivery_truck_id: "${truck}", window_start: "2026-07-11T08:00:00Z", window_end: "2026-07-11T09:00:00Z" }, as: StoreManager, captures: { dj: "$.data.id" } }
            - { call: "POST /install-referrals", payload: { order_id: "${o}", installer_id: "${inst}", delivery_job_id: "${dj}" }, as: StoreManager, captures: { ref: "$.data.id" } }
          trigger:
            - { call: "POST /install-referrals/${ref}/schedule", payload: { appointment_start: "2026-07-11T10:00:00Z", appointment_end: "2026-07-11T11:00:00Z" }, as: StoreManager, captures: { err: "$.data.error_id" } }
          assert:
            - "response.data.error_id == \"ERR_DELIVERY_NOT_READY\""
            - "http_status == 409"

  - rule_id: resource_temporal_overlap
    instances:
      - name: installer_appointment_half_open_overlap
        grounds:
          - validations[priority=25]
          - errors[ERR_INSTALLER_UNAVAILABLE]
          - state_machines.InstallReferral.REFERRED_to_SCHEDULED
        distinguishing_aspect: "Installer overlap uses half-open [start,end): R2 [11:00,13:00) overlapping R1 [10:00,12:00) is rejected (ERR_INSTALLER_UNAVAILABLE), while R3 [12:00,14:00) whose start equals R1's end is accepted (adjacency allowed)."
        test_recipe:
          setup:
            - "Installer I8; one order confirmed with three DELIVERED jobs (on three trucks); referral R1 scheduled [10:00,12:00); R2 and R3 created (REFERRED)."
          setup_api_calls:
            - { call: "POST /installers", payload: { name: "I8", service_area: "S", daily_capacity: 10 }, as: StoreManager, captures: { inst: "$.data.id" } }
            - { call: "POST /delivery-trucks", payload: { name: "T8a" }, as: StoreManager, captures: { ta: "$.data.id" } }
            - { call: "POST /delivery-trucks", payload: { name: "T8b" }, as: StoreManager, captures: { tb: "$.data.id" } }
            - { call: "POST /delivery-trucks", payload: { name: "T8c" }, as: StoreManager, captures: { tc: "$.data.id" } }
            - { call: "POST /fixture-models", payload: { sku_base: "F-8A", category: "SCONCE", base_price_cents: 5000, base_wattage: 40 }, as: StoreManager, captures: { fx: "$.data.id" } }
            - { call: "POST /orders", payload: { customer_name: "8A" }, as: StoreManager, captures: { o: "$.data.id" } }
            - { call: "POST /orders/${o}/lines", payload: { fixture_model_id: "${fx}", quantity: 1 }, as: StoreManager }
            - { call: "GET /orders/${o}", payload: {}, as: StoreManager, captures: { ov: "$.data.version" } }
            - { call: "POST /orders/${o}/quote", payload: { expected_order_version: "${ov}" }, as: StoreManager }
            - { call: "POST /orders/${o}/confirm", payload: {}, as: StoreManager }
            - { call: "POST /delivery-jobs", payload: { order_id: "${o}", delivery_truck_id: "${ta}", window_start: "2026-07-12T06:00:00Z", window_end: "2026-07-12T07:00:00Z" }, as: StoreManager, captures: { j1: "$.data.id" } }
            - { call: "POST /delivery-jobs/${j1}/deliver", payload: {}, as: StoreManager }
            - { call: "POST /delivery-jobs", payload: { order_id: "${o}", delivery_truck_id: "${tb}", window_start: "2026-07-12T06:00:00Z", window_end: "2026-07-12T07:00:00Z" }, as: StoreManager, captures: { j2: "$.data.id" } }
            - { call: "POST /delivery-jobs/${j2}/deliver", payload: {}, as: StoreManager }
            - { call: "POST /delivery-jobs", payload: { order_id: "${o}", delivery_truck_id: "${tc}", window_start: "2026-07-12T06:00:00Z", window_end: "2026-07-12T07:00:00Z" }, as: StoreManager, captures: { j3: "$.data.id" } }
            - { call: "POST /delivery-jobs/${j3}/deliver", payload: {}, as: StoreManager }
            - { call: "POST /install-referrals", payload: { order_id: "${o}", installer_id: "${inst}", delivery_job_id: "${j1}" }, as: StoreManager, captures: { r1: "$.data.id" } }
            - { call: "POST /install-referrals/${r1}/schedule", payload: { appointment_start: "2026-07-12T10:00:00Z", appointment_end: "2026-07-12T12:00:00Z" }, as: StoreManager }
            - { call: "POST /install-referrals", payload: { order_id: "${o}", installer_id: "${inst}", delivery_job_id: "${j2}" }, as: StoreManager, captures: { r2: "$.data.id" } }
            - { call: "POST /install-referrals", payload: { order_id: "${o}", installer_id: "${inst}", delivery_job_id: "${j3}" }, as: StoreManager, captures: { r3: "$.data.id" } }
          trigger:
            - { call: "POST /install-referrals/${r2}/schedule", payload: { appointment_start: "2026-07-12T11:00:00Z", appointment_end: "2026-07-12T13:00:00Z" }, as: StoreManager, captures: { err: "$.data.error_id" } }
            - { call: "POST /install-referrals/${r3}/schedule", payload: { appointment_start: "2026-07-12T12:00:00Z", appointment_end: "2026-07-12T14:00:00Z" }, as: StoreManager }
          assert:
            - "trigger[0] response.data.error_id == \"ERR_INSTALLER_UNAVAILABLE\" (http 409)"
            - "InstallReferral.${r3}.status == \"SCHEDULED\""

      - name: delivery_truck_buffer_gap_conflict
        grounds:
          - validations[priority=26]
          - errors[ERR_TRUCK_WINDOW_CONFLICT]
          - entities.DeliveryJob.fields.window_start
        distinguishing_aspect: "DeliveryTruck uses buffer semantics (BUFFER_MINUTES=30): a second window [12:15,13:00) starting only 15 min after the first [10:00,12:00) ends is rejected with ERR_TRUCK_WINDOW_CONFLICT even though the windows do NOT overlap (distinct from Installer half-open adjacency)."
        test_recipe:
          setup:
            - "One truck; order confirmed; a SCHEDULED DeliveryJob window [10:00,12:00)."
          setup_api_calls:
            - { call: "POST /delivery-trucks", payload: { name: "T8B" }, as: StoreManager, captures: { truck: "$.data.id" } }
            - { call: "POST /fixture-models", payload: { sku_base: "F-8B", category: "SCONCE", base_price_cents: 5000, base_wattage: 40 }, as: StoreManager, captures: { fx: "$.data.id" } }
            - { call: "POST /orders", payload: { customer_name: "8B" }, as: StoreManager, captures: { o: "$.data.id" } }
            - { call: "POST /orders/${o}/lines", payload: { fixture_model_id: "${fx}", quantity: 1 }, as: StoreManager }
            - { call: "GET /orders/${o}", payload: {}, as: StoreManager, captures: { ov: "$.data.version" } }
            - { call: "POST /orders/${o}/quote", payload: { expected_order_version: "${ov}" }, as: StoreManager }
            - { call: "POST /orders/${o}/confirm", payload: {}, as: StoreManager }
            - { call: "POST /delivery-jobs", payload: { order_id: "${o}", delivery_truck_id: "${truck}", window_start: "2026-07-13T10:00:00Z", window_end: "2026-07-13T12:00:00Z" }, as: StoreManager, captures: { j1: "$.data.id" } }
          trigger:
            - { call: "POST /delivery-jobs", payload: { order_id: "${o}", delivery_truck_id: "${truck}", window_start: "2026-07-13T12:15:00Z", window_end: "2026-07-13T13:00:00Z" }, as: StoreManager, captures: { err: "$.data.error_id" } }
          assert:
            - "response.data.error_id == \"ERR_TRUCK_WINDOW_CONFLICT\""
            - "http_status == 409"

  - rule_id: compensating_invariant
    instances:
      - name: trade_credit_confirm_cancel_conserved
        grounds:
          - calculations.trade_tier_and_credit
          - state_machines.Order.QUOTED_to_CONFIRMED
          - state_machines.Order.CONFIRMED_to_CANCELLED
          - entities.TradeAccount.fields.available_credit_cents
        distinguishing_aspect: "Conserved quantity = trade credit: confirm debits available_credit_cents 1000000->700000 (committed 300000); the compensating cancel restores it to 1000000, holding credit_limit_cents == available_credit_cents + sum(committed over CONFIRMED) with zero drift."
        test_recipe:
          setup:
            - "Trade account credit_limit 1000000; order subtotal 300000 quoted then CONFIRMED (available 700000, committed 300000)."
          setup_api_calls:
            - { call: "POST /trade-accounts", payload: { business_name: "Credit", contact_email: "c9@x.com", credit_limit_cents: 1000000 }, as: StoreManager, captures: { acct: "$.data.id" } }
            - { call: "POST /fixture-models", payload: { sku_base: "F-9A", category: "CHANDELIER", base_price_cents: 300000, base_wattage: 100 }, as: StoreManager, captures: { fx: "$.data.id" } }
            - { call: "POST /orders", payload: { customer_name: "9A", trade_account_id: "${acct}" }, as: StoreManager, captures: { o: "$.data.id" } }
            - { call: "POST /orders/${o}/lines", payload: { fixture_model_id: "${fx}", quantity: 1 }, as: StoreManager }
            - { call: "GET /orders/${o}", payload: {}, as: StoreManager, captures: { ov: "$.data.version" } }
            - { call: "POST /orders/${o}/quote", payload: { expected_order_version: "${ov}" }, as: StoreManager }
            - { call: "POST /orders/${o}/confirm", payload: {}, as: StoreManager }
          trigger:
            - { call: "POST /orders/${o}/cancel", payload: {}, as: StoreManager }
            - { call: "GET /trade-accounts/${acct}", payload: {}, as: StoreManager }
          assert:
            - "Order.${o}.committed_credit_cents == 0"
            - "TradeAccount.${acct}.available_credit_cents == 1000000"

      - name: rebate_budget_approve_void_conserved
        grounds:
          - calculations.rebate_amount
          - state_machines.RebateClaim.SUBMITTED_to_APPROVED
          - state_machines.RebateClaim.APPROVED_to_VOID
          - entities.RebateProgram.fields.budget_remaining_cents
        distinguishing_aspect: "Conserved quantity = rebate budget pool (distinct from trade credit): approve debits budget_remaining_cents 1000000->999850 (claimed 150); the compensating void restores it to 1000000, holding budget_total_cents == budget_remaining_cents + sum(claimed over APPROVED claims)."
        test_recipe:
          setup:
            - "Program budget_total 1000000. Order with one eligible ENERGY STAR line (unit_price 2000 -> claimed 150). Claim submitted and APPROVED (budget 999850)."
          setup_api_calls:
            - { call: "POST /rebate-programs", payload: { name: "Budget", rebate_rate: 0.075, wattage_ceiling: 100, budget_total_cents: 1000000 }, as: StoreManager, captures: { prog: "$.data.id" } }
            - { call: "POST /fixture-models", payload: { sku_base: "F-9B", category: "RECESSED", base_price_cents: 2000, base_wattage: 50, energy_star: true }, as: StoreManager, captures: { fx: "$.data.id" } }
            - { call: "POST /orders", payload: { customer_name: "9B" }, as: StoreManager, captures: { o: "$.data.id" } }
            - { call: "POST /orders/${o}/lines", payload: { fixture_model_id: "${fx}", quantity: 1 }, as: StoreManager }
            - { call: "POST /rebate-claims", payload: { order_id: "${o}", rebate_program_id: "${prog}" }, as: StoreManager, captures: { claim: "$.data.id" } }
            - { call: "POST /rebate-claims/${claim}/approve", payload: {}, as: StoreManager }
          trigger:
            - { call: "POST /rebate-claims/${claim}/void", payload: {}, as: StoreManager }
            - { call: "GET /rebate-programs/${prog}", payload: {}, as: StoreManager }
          assert:
            - "RebateClaim.${claim}.status == \"VOID\""
            - "RebateProgram.${prog}.budget_remaining_cents == 1000000"
