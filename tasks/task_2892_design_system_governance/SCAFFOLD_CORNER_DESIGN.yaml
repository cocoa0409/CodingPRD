      - name: resolved_tokens_read_walks_all_four_layers_of_the_precedence_list
        claim_type: Computed read
        grounds:
          - endpoints["GET /design-system/token-sets/{id}/resolved-tokens"]
          - calculations.token_alias_resolution
          - entities.DesignToken.fields.brand
          - entities.DesignToken.fields.mode
        distinguishing_aspect: |
          One token name backed by four rows must resolve differently per read coordinate:
          (BRAND_A, DARK) hits layer 1, (BRAND_A, LIGHT) falls to layer 2 (BRAND_A, ANY),
          (BRAND_B, DARK) falls to layer 3 (BASE, DARK), (BRAND_B, LIGHT) falls to layer 4
          (BASE, ANY), and omitting both query params must fall back to the set's own
          default_brand / default_mode. The layer-1 row is an alias onto the (BASE, ANY) leaf, so
          it must resolve to #FFFFFF - proving the alias target is followed by explicit id and
          never re-enters layer selection.
        test_recipe:
          setup:
            - "logical clock pinned at 2026-08-01T00:00:00.000Z"
            - "TokenSet `core` with default_brand BASE and default_mode LIGHT"
            - "four rows named color.surface: (BASE,ANY)=#FFFFFF, (BASE,DARK)=#101010, (BRAND_A,ANY)=#FAF7F0, (BRAND_A,DARK) aliasing the (BASE,ANY) row"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00.000Z" }
              as: SystemAdmin
            - call: "POST /design-system/token-sets"
              payload: { name: "Core", slug: "core", default_brand: "BASE", default_mode: "LIGHT" }
              as: DesignSystemLead
              captures: { ts_id: $.data.id, v0: $.data.version }
            - call: "POST /design-system/tokens"
              payload: { token_set_id: "${ts_id}", name: "color.surface", category: "COLOR", expected_token_set_version: "${v0}", brand: "BASE", mode: "ANY", raw_value: "#FFFFFF" }
              as: DesignSystemLead
              captures: { base_any: $.data.id }
            - call: "GET /design-system/token-sets/${ts_id}"
              payload: {}
              as: DesignSystemLead
              captures: { v1: $.data.version }
            - call: "POST /design-system/tokens"
              payload: { token_set_id: "${ts_id}", name: "color.surface", category: "COLOR", expected_token_set_version: "${v1}", brand: "BASE", mode: "DARK", raw_value: "#101010" }
              as: DesignSystemLead
              captures: { base_dark: $.data.id }
            - call: "GET /design-system/token-sets/${ts_id}"
              payload: {}
              as: DesignSystemLead
              captures: { v2: $.data.version }
            - call: "POST /design-system/tokens"
              payload: { token_set_id: "${ts_id}", name: "color.surface", category: "COLOR", expected_token_set_version: "${v2}", brand: "BRAND_A", mode: "ANY", raw_value: "#FAF7F0" }
              as: DesignSystemLead
              captures: { a_any: $.data.id }
            - call: "GET /design-system/token-sets/${ts_id}"
              payload: {}
              as: DesignSystemLead
              captures: { v3: $.data.version }
            - call: "POST /design-system/tokens"
              payload: { token_set_id: "${ts_id}", name: "color.surface", category: "COLOR", expected_token_set_version: "${v3}", brand: "BRAND_A", mode: "DARK", alias_of_token_id: "${base_any}" }
              as: DesignSystemLead
              captures: { a_dark: $.data.id, a_dark_depth: $.data.alias_depth, a_dark_value: $.data.resolved_value }
          trigger:
            - call: "GET /design-system/token-sets/${ts_id}/resolved-tokens"
              payload: { brand: "BRAND_A", mode: "DARK" }
              as: EngineeringReviewer
              captures: { r1_brand: $.data.brand, r1_mode: $.data.mode, r1_count: $.data.resolved_count, r1_depth: $.data.max_alias_depth }
            - call: "GET /design-system/token-sets/${ts_id}/resolved-tokens"
              payload: { brand: "BRAND_A", mode: "LIGHT" }
              as: EngineeringReviewer
              captures: { r2_count: $.data.resolved_count }
            - call: "GET /design-system/token-sets/${ts_id}/resolved-tokens"
              payload: { brand: "BRAND_B", mode: "DARK" }
              as: EngineeringReviewer
              captures: { r3_count: $.data.resolved_count }
            - call: "GET /design-system/token-sets/${ts_id}/resolved-tokens"
              payload: { brand: "BRAND_B", mode: "LIGHT" }
              as: EngineeringReviewer
              captures: { r4_count: $.data.resolved_count }
            - call: "GET /design-system/token-sets/${ts_id}/resolved-tokens"
              payload: {}
              as: EngineeringReviewer
              captures: { r5_brand: $.data.brand, r5_mode: $.data.mode }
          assert:
            - "${a_dark_depth} == 1 and ${a_dark_value} == #FFFFFF"
            - "${r1_brand} == BRAND_A and ${r1_mode} == DARK and ${r1_count} == 1 and ${r1_depth} == 1"
            - "the read at (BRAND_A, DARK) resolves color.surface from token ${a_dark} (layer 1) to value #FFFFFF"
            - "${r2_count} == 1 and the read at (BRAND_A, LIGHT) resolves color.surface from token ${a_any} (layer 2) to value #FAF7F0"
            - "${r3_count} == 1 and the read at (BRAND_B, DARK) resolves color.surface from token ${base_dark} (layer 3) to value #101010"
            - "${r4_count} == 1 and the read at (BRAND_B, LIGHT) resolves color.surface from token ${base_any} (layer 4) to value #FFFFFF"
            - "${r5_brand} == BASE and ${r5_mode} == LIGHT (the token set's declared defaults) and that read resolves to #FFFFFF"

