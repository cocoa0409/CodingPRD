          difficulty_instance: "combinatorial_formula / disposition_fee_band_keyed_on_gross_not_net"
          rationale: "The named §1.8 instance pins a 25000-cent gross into MID_LOT and contrasts it with the SMALL_LOT figures a net-keyed band would produce."

      - name: corner_calc_liquidation_floor_threshold_boundary
        claim_type: Correct Result
        grounds:
          - calculations.disposition_decision
        excluded_because:
          difficulty_instance: "boundary_precision_check / liquidation_floor_exact_tie_liquidates_one_cent_more_donates"
          rationale: "D6's threshold behaviour at the exact cross-multiplied tie and one scaled point below it is asserted by the named §1.8 instance."

      - name: corner_calc_empty_box_threshold_boundary
        claim_type: Correct Result
        grounds:
          - calculations.receipt_expected_weight.constants.EMPTY_BOX_THRESHOLD_PCT_SCALED
        excluded_because:
          difficulty_instance: "boundary_precision_check / empty_box_weight_threshold_exact_sixty_percent_not_suspected"
          rationale: "The strict `<` at exactly 60% of the expected weight, and the one-gram-lighter carton that trips it, are asserted by the named §1.8 instance."

      - name: corner_calc_unit_conservation_aggregation_after_reversal
        claim_type: Input Set Filtering
        grounds:
          - calculations.client_unit_conservation.input_set
        excluded_because:
          difficulty_instance: "compensating_invariant / unit_conservation_survives_disposition_order_cancel"
          rationale: "The named §1.8 instance asserts the reserved-bucket filter (PROPOSED and APPROVED only) both before and after a cancellation, which is this aggregation claim."

  # =================================================================== #
  # SECTION 4 — validations                                             #
  # =================================================================== #
  - section: validations
    instances:
      - name: corner_val_rma_expires_at_in_the_past_is_rejected
        claim_type: Violation → Error
        grounds:
          - validations[priority 41 ERR_RMA_EXPIRES_IN_PAST]
          - errors.ERR_RMA_EXPIRES_IN_PAST
        distinguishing_aspect: "Creating an authorization with expires_at 2026-07-31T00:00:00Z while the logical clock reads 2026-08-01T00:00:00Z returns 422 ERR_RMA_EXPIRES_IN_PAST and stores nothing."
        test_recipe:
          setup:
            - "Client VA1 and the clock at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: CenterAdmin
              as_user_id: "u_admin"
            - call: "POST /clients"
              payload: { name: "Val One", client_code: "VA1", service_level: "SL_STANDARD", inventory_ownership: "CLIENT_OWNED" }
              as: CenterAdmin
              as_user_id: "u_admin"
              captures: { c_id: $.data.id }
          trigger:
            - call: "POST /return-authorizations"
              payload: { client_id: "${c_id}", order_reference: "ORD-VA1", customer_reference: "CUST-VA1", order_placed_at: "2026-07-25T00:00:00Z", expires_at: "2026-07-31T00:00:00Z" }
              as: CenterAdmin
              as_user_id: "u_admin"
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP 422 with data.error_id == ERR_RMA_EXPIRES_IN_PAST"
            - "GET /return-authorizations?client_id=${c_id} returns total_count == 0"
            - "The same request with expires_at 2026-09-01T00:00:00Z succeeds with HTTP 201"

      - name: corner_val_serialized_item_authorization_line_requires_declared_serial
        claim_type: Violation → Error
        grounds:
          - validations[priority 42 ERR_SERIAL_REQUIRED]
          - entities.CatalogItem.fields.serialized
          - errors.ERR_SERIAL_REQUIRED
        distinguishing_aspect: "Adding an authorization line for a serialized SKU without declared_serial returns 422 ERR_SERIAL_REQUIRED, while the same request carrying declared_serial SN-0001 is accepted."
        test_recipe:
          setup:
            - "Client VA2 with a serialized 20000-cent SKU and one DRAFT RMA."
          setup_api_calls:
            - call: "POST /clients"
              payload: { name: "Val Two", client_code: "VA2", service_level: "SL_STANDARD", inventory_ownership: "CLIENT_OWNED" }
              as: CenterAdmin
              as_user_id: "u_admin"
              captures: { c_id: $.data.id }
            - call: "POST /catalog-items"
              payload: { client_id: "${c_id}", sku: "SER-1", description: "Serialized widget", declared_value_cents: 20000, unit_weight_grams: 1200, serialized: true, refurb_eligible: false, secondary_market_floor_cents: 1000 }
              as: CenterAdmin
              as_user_id: "u_admin"
              captures: { item_id: $.data.id }
            - call: "POST /return-authorizations"
              payload: { client_id: "${c_id}", order_reference: "ORD-VA2", customer_reference: "CUST-VA2", order_placed_at: "2026-07-25T00:00:00Z", expires_at: "2026-09-01T00:00:00Z" }
              as: CenterAdmin
              as_user_id: "u_admin"
              captures: { rma_id: $.data.id }
          trigger:
            - call: "POST /return-authorizations/${rma_id}/lines"
              payload: { catalog_item_id: "${item_id}", authorized_quantity: 1, reason_code: "DEFECTIVE" }
              as: CenterAdmin
              as_user_id: "u_admin"
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP 422 with data.error_id == ERR_SERIAL_REQUIRED"
            - "GET /return-authorization-lines?rma_id=${rma_id} returns total_count == 0"
            - "GET /return-authorizations/${rma_id} shows authorized_unit_total == 0 and status == DRAFT"
            - "Re-sending the same payload plus declared_serial SN-0001 returns HTTP 201"

      - name: corner_val_cumulative_scan_exceeding_authorized_quantity_rejected
        claim_type: Violation → Error
        grounds:
          - validations[priority 43 ERR_AUTHORIZED_QUANTITY_EXCEEDED]
          - errors.ERR_AUTHORIZED_QUANTITY_EXCEEDED
        distinguishing_aspect: "Each scan is individually within the authorized 2 units, but their aggregate 1 + 2 == 3 is not, so the second scan returns 409 ERR_AUTHORIZED_QUANTITY_EXCEEDED and received_unit_total stays 1."
        test_recipe:
          setup:
            - "Client VA3 with one ISSUED RMA authorizing 2 units of a 1200-gram SKU, one 2600-gram receipt, and 1 unit already scanned."
          setup_api_calls:
            - call: "POST /clients"
              payload: { name: "Val Three", client_code: "VA3", service_level: "SL_STANDARD", inventory_ownership: "CLIENT_OWNED" }
              as: CenterAdmin
              as_user_id: "u_admin"
              captures: { c_id: $.data.id }
            - call: "POST /catalog-items"
              payload: { client_id: "${c_id}", sku: "WIDGET-1", description: "Standard widget", declared_value_cents: 20000, unit_weight_grams: 1200, serialized: false, refurb_eligible: false, secondary_market_floor_cents: 1000 }
              as: CenterAdmin
              as_user_id: "u_admin"
              captures: { item_id: $.data.id }
            - call: "POST /return-authorizations"
              payload: { client_id: "${c_id}", order_reference: "ORD-VA3", customer_reference: "CUST-VA3", order_placed_at: "2026-07-25T00:00:00Z", expires_at: "2026-09-01T00:00:00Z" }
              as: CenterAdmin
              as_user_id: "u_admin"
              captures: { rma_id: $.data.id }
            - call: "POST /return-authorizations/${rma_id}/lines"
              payload: { catalog_item_id: "${item_id}", authorized_quantity: 2, reason_code: "DEFECTIVE" }
              as: CenterAdmin
              as_user_id: "u_admin"
              captures: { rma_line_id: $.data.id }
            - call: "POST /return-authorizations/${rma_id}/issue"
              payload: {}
              as: CenterAdmin
              as_user_id: "u_admin"
            - call: "POST /receipts"
              payload: { rma_id: "${rma_id}", tracking_reference: "TRK-VA3", gross_weight_grams: 2600 }
              as: ReceivingClerk
              as_user_id: "u_clerk"
              captures: { rcpt_id: $.data.id }
            - call: "POST /receipts/${rcpt_id}/lines"
              payload: { rma_line_id: "${rma_line_id}", quantity: 1, reason_code: "DEFECTIVE" }
              as: ReceivingClerk
              as_user_id: "u_clerk"
          trigger:
            - call: "POST /receipts/${rcpt_id}/lines"
              payload: { rma_line_id: "${rma_line_id}", quantity: 2, reason_code: "DEFECTIVE" }
              as: ReceivingClerk
              as_user_id: "u_clerk"
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP 409 with data.error_id == ERR_AUTHORIZED_QUANTITY_EXCEEDED"
            - "GET /return-lines?receipt_id=${rcpt_id} returns total_count == 1 with quantity == 1"
            - "GET /return-authorizations/${rma_id} shows received_unit_total == 1 and status == PARTIALLY_RECEIVED"
            - "A scan of exactly 1 more unit succeeds, proving the aggregate ceiling and not the per-scan value is what was enforced"

      - name: corner_val_reissue_after_a_receipt_exists_is_rejected
        claim_type: Violation → Error
        grounds:
          - validations[priority 22 ERR_RMA_ALREADY_RECEIVING]
          - errors.ERR_RMA_ALREADY_RECEIVING
        distinguishing_aspect: "An ISSUED authorization that already has a Receipt row — even one with no scanned lines, so its status is still ISSUED and priority 20 is satisfied — rejects reissue with 409 ERR_RMA_ALREADY_RECEIVING rather than minting a replacement."
        test_recipe:
          setup:
            - "Client VA4 with one ISSUED RMA (version captured) and one receipt created against it that has no scanned lines yet."
          setup_api_calls:
            - call: "POST /clients"
              payload: { name: "Val Four", client_code: "VA4", service_level: "SL_STANDARD", inventory_ownership: "CLIENT_OWNED" }
              as: CenterAdmin
              as_user_id: "u_admin"
              captures: { c_id: $.data.id }
            - call: "POST /catalog-items"
              payload: { client_id: "${c_id}", sku: "WIDGET-1", description: "Standard widget", declared_value_cents: 20000, unit_weight_grams: 1200, serialized: false, refurb_eligible: false, secondary_market_floor_cents: 1000 }
              as: CenterAdmin
              as_user_id: "u_admin"
              captures: { item_id: $.data.id }
            - call: "POST /return-authorizations"
              payload: { client_id: "${c_id}", order_reference: "ORD-VA4", customer_reference: "CUST-VA4", order_placed_at: "2026-07-25T00:00:00Z", expires_at: "2026-09-01T00:00:00Z" }
              as: CenterAdmin
              as_user_id: "u_admin"
              captures: { rma_id: $.data.id }
            - call: "POST /return-authorizations/${rma_id}/lines"
              payload: { catalog_item_id: "${item_id}", authorized_quantity: 1, reason_code: "DEFECTIVE" }
              as: CenterAdmin
              as_user_id: "u_admin"
            - call: "POST /return-authorizations/${rma_id}/issue"
              payload: {}
              as: CenterAdmin
              as_user_id: "u_admin"
              captures: { rma_ver: $.data.version }
            - call: "POST /receipts"
              payload: { rma_id: "${rma_id}", tracking_reference: "TRK-VA4", gross_weight_grams: 1400 }
              as: ReceivingClerk
              as_user_id: "u_clerk"
          trigger:
            - call: "POST /return-authorizations/${rma_id}/reissue"
              payload: { expected_rma_version: "${rma_ver}", expires_at: "2026-10-01T00:00:00Z" }
              as: CenterAdmin
              as_user_id: "u_admin"
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP 409 with data.error_id == ERR_RMA_ALREADY_RECEIVING — not ERR_RMA_INVALID_STATE, because the RMA is still ISSUED, and not ERR_STALE_RMA_VERSION, because ${rma_ver} is current"
            - "GET /return-authorizations?supersedes_rma_id=${rma_id} returns total_count == 0"
            - "GET /return-authorizations/${rma_id} still shows status == ISSUED with version == ${rma_ver}"

      - name: corner_val_receipt_at_exactly_expires_at_is_rejected_as_expired
        claim_type: Violation → Error
        grounds:
          - validations[priority 21 ERR_RMA_EXPIRED]
          - errors.ERR_RMA_EXPIRED
        distinguishing_aspect: "With the clock advanced to exactly the RMA's expires_at 2026-08-05T00:00:00Z, creating a receipt returns 409 ERR_RMA_EXPIRED, because the rule reads expires_at strictly after now."
        test_recipe:
