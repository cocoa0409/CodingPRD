        grounds: ["concurrency_rules[ce-audit-determination-stale-audit]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "OCC on CEAudit.version: a determination carrying the version observed before the previous determination fails 412 ERR_STALE_VERSION."
