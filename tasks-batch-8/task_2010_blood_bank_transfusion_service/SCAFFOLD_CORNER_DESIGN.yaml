        grounds:
          - "state_machines.TransfusionReaction"
        excluded_because:
          difficulty_instance: reaction_investigation_fork_divergent_side_effects
          rationale: "CONFIRMED-severe vs RULED_OUT divergent side effects asserted there."
      - name: order_hold_reactivate_corner
        claim_type: side_effect_execution
        grounds:
