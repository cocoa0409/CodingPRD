          - complexity_profile.state_machine_shape
        distinguishing_aspect: "Both parallel dimensions are seeded independently by the create call - play_status DRAFT and finance_status COLLECTING - and neither is derived from the other."
        test_recipe:
          setup: ["Empty database apart from the clock call."]
