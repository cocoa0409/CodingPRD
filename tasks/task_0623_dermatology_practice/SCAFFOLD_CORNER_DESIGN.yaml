              payload: { room_id: "${room_id}", provider_id: "${prov_id}", encounter_id: "${enc_id}", procedure_kind: "EXCISION", start_at: "2026-02-02T10:00:00Z", end_at: "2026-02-02T11:00:00Z", expected_room_version: "${room_v0}" }
