  # ---------------------------------------------------------------- Rule 4
  - rule_id: transitive_cascade
    instances:
      - name: spot_check_failure_revocation_cascade
        grounds:
          - state_machines.PaymentRequest.DISBURSED_to_REVOKED
          - state_machines.ContractPracticeItem.CERTIFIED_to_CERTIFICATION_REVOKED
          - state_machines.MaintenanceObligation.ACTIVE_to_VOID
          - calculations.recoupment_amount
        distinguishing_aspect: |
          Depth-3 chain (plus demand branch) triggered by record-result=FAIL:
          SpotCheck FAILED -> PaymentRequest REVOKED (hop 1) -> item
          CERTIFICATION_REVOKED + RECOUPMENT_PENDING (hop 2, caused by hop 1)
          -> MaintenanceObligation VOID (hop 3, caused by hop 2) ->
          RecoupmentDemand DEMANDED (branch off hop 1's item effects).
          Funds stay out of the pool until the demand is paid.
        test_recipe:
          setup:
            - "Standard applicant; FENCE 1000 item CERTIFIED at quantity 1000; payment request (sequence 1, modulus 5 -> NOT sampled) DISBURSED for computed 300000; clock at 2026-10-05"
          setup_api_calls:
            - { call: "POST /eqip/programs", payload: { program_name: "P", fiscal_year: 2026, state_code: "IA", window_start: "2026-08-01T00:00:00Z", window_end: "2026-09-01T00:00:00Z", spot_check_modulus: 5 }, as: ProgramAdmin, captures: { prog: $.data.id } }
            - { call: "POST /eqip/programs/${prog}/pools", payload: { pool_type: "GENERAL", allocated_cents: 1000000 }, as: ProgramAdmin, captures: { pool: $.data.id } }
            - { call: "POST /eqip/programs/${prog}/rates", payload: { practice_code: "FENCE", unit: "FOOT", standard_rate_cents: 300, hu_rate_cents: 360, lifespan_years: 10 }, as: ProgramAdmin }
            - { call: "POST /eqip/programs/${prog}/ranking-criteria", payload: { criterion_code: "SOIL_HEALTH", weight: 1.0, max_points: 40 }, as: ProgramAdmin }
            - { call: "POST /eqip/programs/${prog}/open", payload: {}, as: ProgramAdmin }
            - { call: "POST /eqip/applicants", payload: { legal_name: "A One", hu_category: "NONE", parcel_ids: ["P-100"] }, as: ProgramAdmin, captures: { a1: $.data.id } }
            - { call: "POST /eqip/applications", payload: { program_id: "${prog}", applicant_id: "${a1}", parcel_id: "P-100", planned_practices: [ { practice_code: "FENCE", quantity: 1000 } ], self_reported_answers: { SOIL_HEALTH: 10 } }, as: Applicant, as_user_id: "${a1}", captures: { app: $.data.id } }
            - { call: "POST /eqip/applications/${app}/submit", payload: {}, as: Applicant, as_user_id: "${a1}" }
            - { call: "POST /eqip/applications/${app}/screen", payload: { decision: "SCREENED_IN", verified_answers: { SOIL_HEALTH: 10 } }, as: ConservationPlanner }
            - { call: "POST /eqip/programs/${prog}/close", payload: {}, as: ProgramAdmin }
            - { call: "POST /eqip/programs/${prog}/run-ranking", payload: {}, as: ProgramAdmin }
            - { call: "POST /eqip/contracts", payload: { application_id: "${app}" }, as: ConservationPlanner, captures: { con: $.data.id } }
            - { call: "POST /eqip/contracts/${con}/practice-items", payload: { practice_code: "FENCE", planned_quantity: 1000, implementation_deadline: "2027-03-01T00:00:00Z" }, as: ConservationPlanner, captures: { item: $.data.id } }
            - { call: "POST /eqip/contracts/${con}/obligate", payload: {}, as: ProgramAdmin }
            - { call: "POST /eqip/practice-items/${item}/report-installed", payload: {}, as: Applicant, as_user_id: "${a1}" }
            - { call: "POST /eqip/practice-items/${item}/certify", payload: { certified_quantity: 1000 }, as: ConservationPlanner, as_user_id: "planner-1" }
            - { call: "POST /eqip/payment-requests", payload: { contract_id: "${con}", practice_item_id: "${item}", documented_cost_cents: 350000, documentation_refs: ["r1"] }, as: Applicant, as_user_id: "${a1}", captures: { req: $.data.id, seq: $.data.sequence_number, samp: $.data.sampled } }
            - { call: "POST /eqip/payment-requests/${req}/review", payload: {}, as: PaymentOfficer, as_user_id: "po-1" }
            - { call: "POST /eqip/payment-requests/${req}/approve", payload: {}, as: PaymentOfficer, as_user_id: "po-1" }
            - { call: "POST /eqip/payment-requests/${req}/disburse", payload: {}, as: PaymentOfficer, as_user_id: "po-1" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-10-05T00:00:00Z" }, as: ProgramAdmin }
            - { call: "POST /eqip/spot-checks", payload: { contract_id: "${con}", practice_item_id: "${item}", payment_request_id: "${req}" }, as: QualityAssuranceOfficer, as_user_id: "qa-1", captures: { sc: $.data.id } }
          trigger:
            - { call: "POST /eqip/spot-checks/${sc}/record-result", payload: { result: "FAIL", failure_reason: "practice not to spec" }, as: QualityAssuranceOfficer, as_user_id: "qa-1" }
            - { call: "GET /eqip/payment-requests/${req}", payload: {}, as: ProgramAdmin, captures: { req_st: $.data.status } }
            - { call: "GET /eqip/practice-items/${item}", payload: {}, as: ProgramAdmin, captures: { item_cs: $.data.certification_status, item_ps: $.data.payment_status } }
            - { call: "GET /eqip/maintenance-obligations", payload: { practice_item_id: "${item}" }, as: ProgramAdmin, captures: { obl_st: "$.data[0].status" } }
            - { call: "GET /eqip/recoupment-demands", payload: { payment_request_id: "${req}" }, as: ProgramAdmin, captures: { dem: "$.data[0].id", dem_amt: "$.data[0].amount_cents", dem_due: "$.data[0].due_date", dem_st: "$.data[0].status" } }
            - { call: "GET /eqip/pools/${pool}", payload: {}, as: ProgramAdmin, captures: { pool_paid: $.data.paid_cents, pool_avail: $.data.available_cents, pool_oblig: $.data.obligated_cents } }
            - { call: "POST /eqip/recoupment-demands/${dem}/pay", payload: { amount_cents: 300000 }, as: Applicant, as_user_id: "${a1}" }
            - { call: "GET /eqip/pools/${pool}", payload: {}, as: ProgramAdmin, captures: { pool_paid2: $.data.paid_cents, pool_avail2: $.data.available_cents } }
            - { call: "GET /eqip/practice-items/${item}", payload: {}, as: ProgramAdmin, captures: { item_ps2: $.data.payment_status } }
          assert:
            - "req_st == REVOKED (hop 1)"
            - "item_cs == CERTIFICATION_REVOKED and item_ps == RECOUPMENT_PENDING (hop 2)"
            - "obl_st == VOID (hop 3)"
            - "demand created: dem_amt == 300000 (request.computed_amount_cents), dem_due == 2026-11-04T00:00:00Z (fail clock 2026-10-05 + 30d), dem_st == DEMANDED"
            - "before pay: pool_paid == 300000 (funds NOT restored by the cascade itself), pool_oblig == 0, pool_avail == 700000"
            - "after pay: pool_paid2 == 0 and pool_avail2 == 1000000; item_ps2 == RECOUPED"
            - "sampling sanity: seq == 1, samp == false (first request not sampled with modulus 5)"

      - name: drop_practice_modification_cascade
        grounds:
          - state_machines.Contract.MODIFICATION_PENDING_to_OBLIGATED
          - state_machines.ContractPracticeItem.PLANNED_to_CANCELLED
          - calculations.pool_available
        distinguishing_aspect: |
          Depth-2 chain from a DIFFERENT trigger (modification approve, not spot
          check): approve DROP_PRACTICE -> item CANCELLED (hop 1) -> item
          cancellation releases its scheduled funds into pool.obligated_cents /
          available_cents (hop 2, caused by hop 1).
        test_recipe:
          setup:
            - "Contract OBLIGATED 450000 (FENCE 1000 = 300000 + COVER_CROP 10 = 150000) against pool 1000000; modification DROP_PRACTICE on the COVER_CROP item REQUESTED"
          setup_api_calls:
