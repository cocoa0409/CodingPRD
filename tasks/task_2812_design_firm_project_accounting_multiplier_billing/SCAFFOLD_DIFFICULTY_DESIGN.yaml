            - "Invoice.${inv_1}: labor_billed == 3307.36, expense_billed == 82.49, consultant_billed == 0.00, gross_billed == 3389.85, volume_discount_pct == 0.0000, discount_amount == 0.00, retainage_amount == 169.49, net_due == 3220.36, swept_labor_count == 2, swept_expense_count == 1"
            - "after invoicing: unbilled_wip == 0.00, billed_open == 3389.85, total_charge_value == 3389.85 (unchanged)"
