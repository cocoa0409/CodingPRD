    input: []
    output: Reseller
    side_effects: []
  - method: GET
    path: "/resellers"
    description: "List resellers (paginated)"
    roles: [AgencyAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: Reseller[]
    side_effects: []

  # ---- Client ----
  - method: POST
    path: "/clients"
