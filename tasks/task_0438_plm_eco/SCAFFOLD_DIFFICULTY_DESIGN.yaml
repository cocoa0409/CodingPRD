  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: eco_effective_release_obsolete_nonconforming_depth3
        grounds:
          - state_machines.EngineeringChangeOrder.APPROVED_to_EFFECTIVE
          - state_machines.PartRevision.IN_REVIEW_to_RELEASED
          - state_machines.PartRevision.RELEASED_to_OBSOLETE
          - state_machines.SerializedUnit.CONFORMING_to_NONCONFORMING
        distinguishing_aspect: |
          Depth-3+ chain from make-effective: ECO->EFFECTIVE (A) causes new rev B
          IN_REVIEW->RELEASED (B); that release causes prior rev A RELEASED->OBSOLETE (C);
          that obsolete causes the unit pinned to rev A CONFORMING->NONCONFORMING (D). Each
          link is caused by the previous, not by make-effective directly.
        test_recipe:
          setup:
            - "Part D has rev A RELEASED with one CONFORMING BUILT SerializedUnit pinned to rev A."
            - "Part D rev B WORKING->IN_REVIEW attached to an APPROVED ECO whose effectivity has passed."
          setup_api_calls:
            - call: "POST /plm/suppliers"
              payload: { name: "Sup", supplier_code: "SUP-D3" }
              as: SupplierManager
              captures: { sup_id: $.data.id }
            - call: "POST /plm/parts"
              payload: { part_number: "LEAF-D3", name: "BuyLeaf", part_type: "BUY", base_cost_cents: 10, default_supplier_id: "${sup_id}" }
              as: Designer
              captures: { buy_leaf_id: $.data.id }
