              as: ContractAdmin
              captures: { ctr_x_id: $.data.id }
            - call: "POST /contracts/${ctr_x_id}/lines"
              payload: { item_id: "${item_id}", tier_price_cents: 4000, floor_price_cents: 3000 }
              as: ContractAdmin
            - call: "POST /contracts/${ctr_x_id}/transition"
              payload: { to_status: "PENDING_ACTIVATION" }
              as: ContractAdmin
            - call: "POST /contracts/${ctr_x_id}/transition"
              payload: { to_status: "ACTIVE" }
              as: ContractAdmin
            - call: "POST /contracts"
              payload: { manufacturer_code: "MFR-ACME", contract_code: "CTR-Y", tier: "TIER_1", member_class_scope: "ACUTE", effective_from: "2026-08-31T23:59:59Z", effective_to: "2026-12-31T23:59:59Z" }
              as: ContractAdmin
              captures: { ctr_y_id: $.data.id }
            - call: "POST /contracts/${ctr_y_id}/lines"
              payload: { item_id: "${item_id}", tier_price_cents: 4100, floor_price_cents: 3000 }
              as: ContractAdmin
            - call: "POST /contracts/${ctr_y_id}/transition"
              payload: { to_status: "PENDING_ACTIVATION" }
              as: ContractAdmin
            - call: "POST /contracts"
              payload: { manufacturer_code: "MFR-ACME", contract_code: "CTR-Z", tier: "TIER_1", member_class_scope: "ACUTE", effective_from: "2026-09-01T00:00:00Z", effective_to: "2026-12-31T23:59:59Z" }
              as: ContractAdmin
              captures: { ctr_z_id: $.data.id }
            - call: "POST /contracts/${ctr_z_id}/lines"
              payload: { item_id: "${item_id}", tier_price_cents: 4200, floor_price_cents: 3000 }
              as: ContractAdmin
              captures: { cl_z_id: $.data.id }
            - call: "POST /contracts/${ctr_z_id}/transition"
