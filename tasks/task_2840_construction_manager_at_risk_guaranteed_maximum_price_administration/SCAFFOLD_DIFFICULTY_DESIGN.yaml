# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Task 2840 - Construction Manager at Risk & Guaranteed Maximum Price Administration
# Nine §0.5 rule_ids, two instances each, 18 instances total.
# Every asserted numeric literal below was computed by executing the referenced
# §1.3 formula in code against the pinned setup inputs.
scaffold_difficulty_design:

  # ===================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: shared_savings_pre_audit_provisional_vs_post_audit_final_divergence
        grounds:
          - calculations.shared_savings_split
          - calculations.gmp_establishment_pricing
          - entities.CmarProject.fields.provisional_savings_pool
          - entities.CmarProject.fields.final_savings_pool
          - entities.CmarProject.fields.audit_adjustment_total
          - entities.CostReport.fields.undisputed_cost_total
          - state_machines.CmarProject.NOT_STARTED_to_PROVISIONAL_COMPUTED
        distinguishing_aspect: |
          This instance lives in the CmarProject closeout domain and its two variants diverge
          on the COST BASE (reported vs undisputed dollars plus the auditor's signed
          adjustment), which moves the pool from 24900.00 to 45000.00, flips the tier rate
          from 0.25 to 0.35, and makes the fee cap bind on the final variant only.
        test_recipe:
          setup:
            - "one CmarProject 'Harborview Clinic' with cm_fee_pct 0.04 and insurance_rate 0.01, gmp_status EXECUTED at gmp_amount 1245897.60, cm_fee_amount 44457.60, insurance_amount 11440.00"
            - "two CostReport rows, both RECONCILED: the first with reported_cost_total 1000000.00 and undisputed_cost_total 1000000.00, the second with reported_cost_total 165100.00, undisputed_cost_total 140000.00 and disputed_cost_total 25100.00"
            - "audit_status CLOSED with audit_adjustment_total 5000.00"
            - "closeout_status NOT_STARTED, logical clock at its 2026-08-01T00:00:00Z default"
          setup_api_calls:
            - call: "POST /projects"
              payload: { name: "Harborview Clinic", owner_org: "Harborview Health", cm_fee_pct: 0.04, insurance_rate: 0.01, precon_fee_amount: 25000.00 }
              as: ProgramAdmin
              captures: { proj: $.data.id, projv1: $.data.version }
            - call: "POST /estimates"
              payload: { project_id: "${proj}", milestone_code: "CD_100", submitted_cost_of_work: 1000000.00, expected_project_version: "${projv1}" }
              as: ConstructionManager
              captures: { est: $.data.id }
            - call: "POST /estimates/${est}/submit"
              payload: {}
              as: ConstructionManager
            - call: "POST /estimates/${est}/reconcile"
              payload: { decision: "ACCEPT", reconciliation_note: "SD basis accepted" }
              as: OwnerRepresentative
            - call: "GET /projects/${proj}"
              payload: {}
              as: ConstructionManager
              captures: { projv2: $.data.version }
            - call: "POST /gmp-proposals"
              payload: { project_id: "${proj}", based_on_estimate_id: "${est}", cost_of_work_total: 1000000.00, general_conditions_total: 100000.00, owner_contingency_amount: 50000.00, construction_contingency_amount: 40000.00, expected_project_version: "${projv2}" }
              as: ConstructionManager
              captures: { prop: $.data.id }
            - call: "POST /gmp-proposals/${prop}/submit"
              payload: {}
              as: ConstructionManager
            - call: "POST /gmp-proposals/${prop}/decide"
              payload: { decision: "EXECUTE", owner_decision_note: "GMP executed" }
              as: OwnerRepresentative
            - call: "POST /cost-reports"
              payload: { project_id: "${proj}", period_start: "2026-08-01T00:00:00Z", period_end: "2026-09-01T00:00:00Z" }
              as: ConstructionManager
              captures: { cr1: $.data.id }
            - call: "POST /cost-reports/${cr1}/lines"
              payload: { cost_code: "03-300", quantity: 1000, unit_rate: 1000.00, markup_pct: 0.000, disputed: false }
              as: ConstructionManager
            - call: "POST /cost-reports/${cr1}/reconcile"
              payload: { decision: "RECONCILE", reconciliation_note: "August reconciled" }
              as: OwnerRepresentative
            - call: "POST /cost-reports"
              payload: { project_id: "${proj}", period_start: "2026-09-01T00:00:00Z", period_end: "2026-10-01T00:00:00Z" }
              as: ConstructionManager
              captures: { cr2: $.data.id }
            - call: "POST /cost-reports/${cr2}/lines"
              payload: { cost_code: "09-100", quantity: 100, unit_rate: 1400.00, markup_pct: 0.000, disputed: false }
              as: ConstructionManager
            - call: "POST /cost-reports/${cr2}/lines"
              payload: { cost_code: "09-200", quantity: 100, unit_rate: 251.00, markup_pct: 0.000, disputed: true }
              as: ConstructionManager
            - call: "POST /cost-reports/${cr2}/reconcile"
              payload: { decision: "RECONCILE", reconciliation_note: "September reconciled with one disputed line" }
              as: OwnerRepresentative
            - call: "POST /projects/${proj}/audit-request"
              payload: { audit_scope_note: "full open-book audit" }
              as: OwnerRepresentative
            - call: "POST /projects/${proj}/audit-actions"
              payload: { action: "POST_ADJUSTMENT", adjustment_amount: 5000.00, adjustment_note: "unallocated equipment rental added back" }
              as: IndependentAuditor
            - call: "POST /projects/${proj}/audit-actions"
              payload: { action: "CLOSE" }
              as: IndependentAuditor
          trigger:
            - call: "POST /projects/${proj}/shared-savings"
              payload: { basis: "PRE_AUDIT_PROVISIONAL", execute: false }
              as: OwnerRepresentative
            - call: "POST /projects/${proj}/shared-savings"
              payload: { basis: "POST_AUDIT_FINAL", execute: false }
              as: OwnerRepresentative
          assert:
            - "CmarProject.${proj}.gmp_amount == 1245897.60"
            - "CmarProject.${proj}.cm_fee_amount == 44457.60"
            - "CmarProject.${proj}.insurance_amount == 11440.00"
            - "CmarProject.${proj}.provisional_savings_pool == 24900.00"
            - "CmarProject.${proj}.provisional_cm_savings_share == 6225.00"
            - "CmarProject.${proj}.provisional_owner_savings_share == 18675.00"
            - "CmarProject.${proj}.final_savings_pool == 45000.00"
            - "CmarProject.${proj}.final_cm_savings_share == 11114.40"
            - "CmarProject.${proj}.final_owner_savings_share == 33885.60"
            - "CmarProject.${proj}.final_savings_pool != CmarProject.${proj}.provisional_savings_pool"
            - "CmarProject.${proj}.closeout_status == FINAL_COMPUTED"
            - "CmarProject.${proj}.contingency_posture == OPEN"

      - name: buyout_savings_trade_level_vs_project_net_divergence
        grounds:
          - calculations.buyout_savings_tracking
          - entities.CmarProject.fields.buyout_savings_trade_level
          - entities.CmarProject.fields.buyout_savings_project_net
          - entities.WorkPackage.fields.awarded_amount
          - state_machines.WorkPackage.SOLICITING_to_AWARDED
        distinguishing_aspect: |
          This instance lives in the WorkPackage procurement domain and its two variants
          diverge on the INCLUSION SIGN, not the cost base: TRADE_LEVEL floors each package
          delta at zero and reports 400000.00 while PROJECT_NET sums signed deltas and
          reports 150000.00 from the same two awarded packages.
        test_recipe:
          setup:
            - "one CmarProject 'Riverside Data Hall' with cm_fee_pct 0.0375 and insurance_rate 0.0125, gmp_status EXECUTED at gmp_amount 46105590.83"
            - "WorkPackage 03-CONCRETE with budget_amount 5000000.00 already AWARDED at 4600000.00 (underrun 400000.00)"
            - "WorkPackage 09-FINISHES with budget_amount 3000000.00, SOLICITING, one OPENED third-party bid at 3250000.00 (overrun 250000.00 once awarded)"
            - "logical clock advanced to 2026-08-20T00:00:00Z so both solicitations have closed"
          setup_api_calls:
            - call: "POST /projects"
              payload: { name: "Riverside Data Hall", owner_org: "Riverside Utilities", cm_fee_pct: 0.0375, insurance_rate: 0.0125, precon_fee_amount: 250000.00 }
              as: ProgramAdmin
              captures: { proj: $.data.id, projv1: $.data.version }
            - call: "POST /estimates"
              payload: { project_id: "${proj}", milestone_code: "CD_100", submitted_cost_of_work: 40000000.00, expected_project_version: "${projv1}" }
              as: ConstructionManager
              captures: { est: $.data.id }
            - call: "POST /estimates/${est}/submit"
              payload: {}
              as: ConstructionManager
            - call: "POST /estimates/${est}/reconcile"
              payload: { decision: "ACCEPT" }
              as: OwnerRepresentative
            - call: "GET /projects/${proj}"
              payload: {}
              as: ConstructionManager
              captures: { projv2: $.data.version }
            - call: "POST /gmp-proposals"
              payload: { project_id: "${proj}", based_on_estimate_id: "${est}", cost_of_work_total: 40000000.00, general_conditions_total: 2500000.00, owner_contingency_amount: 1200000.00, construction_contingency_amount: 240000.00, expected_project_version: "${projv2}" }
              as: ConstructionManager
              captures: { prop: $.data.id }
            - call: "POST /gmp-proposals/${prop}/submit"
              payload: {}
              as: ConstructionManager
            - call: "POST /gmp-proposals/${prop}/decide"
              payload: { decision: "EXECUTE" }
              as: OwnerRepresentative
            - call: "POST /work-packages"
              payload: { project_id: "${proj}", trade_division: "03-CONCRETE", budget_amount: 5000000.00, self_perform_intent: false }
              as: ConstructionManager
              captures: { wpa: $.data.id }
            - call: "POST /work-packages/${wpa}/solicit"
              payload: { solicitation_opens_at: "2026-08-01T00:00:00Z", solicitation_closes_at: "2026-08-15T00:00:00Z" }
              as: ConstructionManager
            - call: "POST /self-perform-bids"
              payload: { work_package_id: "${wpa}", bidder_type: "THIRD_PARTY", bidder_name: "Cascade Concrete", base_bid_amount: 4600000.00, open_book_cost_breakdown: { labor: 2000000.00, material: 1800000.00, equipment: 400000.00, overhead: 250000.00, profit: 150000.00 } }
              as: ConstructionManager
              as_user_id: "cm-estimator-1"
              captures: { bida: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-15T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /self-perform-bids/${bida}/open"
              payload: { open_note: "single responsive bid" }
              as: ProcurementOfficer
              as_user_id: "po-1"
            - call: "POST /work-packages/${wpa}/award"
              payload: { bid_id: "${bida}", award_note: "concrete awarded under budget" }
              as: ProcurementOfficer
              as_user_id: "po-1"
            - call: "POST /work-packages"
              payload: { project_id: "${proj}", trade_division: "09-FINISHES", budget_amount: 3000000.00, self_perform_intent: false }
              as: ConstructionManager
              captures: { wpb: $.data.id }
            - call: "POST /work-packages/${wpb}/solicit"
              payload: { solicitation_opens_at: "2026-08-15T00:00:00Z", solicitation_closes_at: "2026-08-20T00:00:00Z" }
              as: ConstructionManager
            - call: "POST /self-perform-bids"
              payload: { work_package_id: "${wpb}", bidder_type: "THIRD_PARTY", bidder_name: "Summit Interiors", base_bid_amount: 3250000.00, open_book_cost_breakdown: { labor: 1500000.00, material: 1200000.00, equipment: 200000.00, overhead: 250000.00, profit: 100000.00 } }
              as: ConstructionManager
              as_user_id: "cm-estimator-1"
              captures: { bidb: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-20T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /self-perform-bids/${bidb}/open"
              payload: {}
              as: ProcurementOfficer
              as_user_id: "po-1"
          trigger:
            - call: "POST /work-packages/${wpb}/award"
              payload: { bid_id: "${bidb}", award_note: "finishes awarded over budget" }
              as: ProcurementOfficer
              as_user_id: "po-1"
          assert:
            - "WorkPackage.${wpa}.awarded_amount == 4600000.00"
            - "WorkPackage.${wpb}.awarded_amount == 3250000.00"
            - "CmarProject.${proj}.buyout_savings_trade_level == 400000.00"
            - "CmarProject.${proj}.buyout_savings_project_net == 150000.00"
            - "CmarProject.${proj}.buyout_savings_trade_level != CmarProject.${proj}.buyout_savings_project_net"
            - "CmarProject.${proj}.gmp_amount == 46105590.83"

  # ===================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: gmp_pricing_pinned_circular_fee_and_insurance_evaluation_order
        grounds:
          - calculations.gmp_establishment_pricing
          - entities.GmpProposal.fields.provisional_fee_amount
          - entities.GmpProposal.fields.insurance_amount
          - entities.GmpProposal.fields.cm_fee_amount
          - entities.GmpProposal.fields.gmp_amount
          - entities.CmarProject.fields.cm_fee_pct
          - state_machines.GmpProposal.OWNER_REVIEW_to_EXECUTED
        distinguishing_aspect: |
          The interdependency here is CIRCULAR-DEFINITION order: the fee's base includes
          insurance and insurance's base includes a fee, so the contract pins a four-step
          order in which the step-1 provisional fee (1593750.00) is used only to gross up
          the insurance base and is then discarded, and the binding fee (1614418.95) is
          recomputed on base+insurance - producing 46105590.83 rather than the 46084921.88
          a single-pass reading yields.
        test_recipe:
          setup:
            - "one CmarProject 'Riverside Data Hall' with cm_fee_pct 0.0375, insurance_rate 0.0125, gmp_status PRECONSTRUCTION"
            - "one RECONCILED CD_100 ProgressiveEstimate at submitted_cost_of_work 40000000.00"
            - "no work packages, no change events, no contingency draws"
          setup_api_calls:
            - call: "POST /projects"
              payload: { name: "Riverside Data Hall", owner_org: "Riverside Utilities", cm_fee_pct: 0.0375, insurance_rate: 0.0125, precon_fee_amount: 250000.00 }
              as: ProgramAdmin
              captures: { proj: $.data.id, projv1: $.data.version }
            - call: "POST /estimates"
              payload: { project_id: "${proj}", milestone_code: "CD_100", submitted_cost_of_work: 40000000.00, expected_project_version: "${projv1}" }
              as: ConstructionManager
              captures: { est: $.data.id }
            - call: "POST /estimates/${est}/submit"
              payload: {}
              as: ConstructionManager
            - call: "POST /estimates/${est}/reconcile"
              payload: { decision: "ACCEPT" }
              as: OwnerRepresentative
            - call: "GET /projects/${proj}"
              payload: {}
              as: ConstructionManager
              captures: { projv2: $.data.version }
          trigger:
            - call: "POST /gmp-proposals"
              payload: { project_id: "${proj}", based_on_estimate_id: "${est}", cost_of_work_total: 40000000.00, general_conditions_total: 2500000.00, owner_contingency_amount: 1200000.00, construction_contingency_amount: 240000.00, expected_project_version: "${projv2}" }
              as: ConstructionManager
              captures: { prop: $.data.id }
            - call: "POST /gmp-proposals/${prop}/submit"
              payload: {}
              as: ConstructionManager
            - call: "POST /gmp-proposals/${prop}/decide"
              payload: { decision: "EXECUTE" }
              as: OwnerRepresentative
          assert:
            - "GmpProposal.${prop}.provisional_fee_amount == 1593750.00"
            - "GmpProposal.${prop}.insurance_amount == 551171.88"
            - "GmpProposal.${prop}.cm_fee_amount == 1614418.95"
            - "GmpProposal.${prop}.gmp_amount == 46105590.83"
            - "GmpProposal.${prop}.gmp_amount != 46084921.88"
            - "CmarProject.${proj}.gmp_amount == 46105590.83"
            - "CmarProject.${proj}.insurance_amount == 551171.88"
            - "CmarProject.${proj}.cm_fee_amount == 1614418.95"
            - "CmarProject.${proj}.construction_contingency_remaining == 240000.00"
            - "CmarProject.${proj}.owner_contingency_remaining == 1200000.00"
            - "CmarProject.${proj}.contingency_drawn_to_cost_total == 0.00"
            - "CmarProject.${proj}.gmp_status == EXECUTED"

      - name: cost_report_per_line_rounding_before_subtotal_aggregation
        grounds:
          - calculations.cost_report_line_reconciliation
          - entities.CostReport.fields.lines
          - entities.CostReport.fields.reported_cost_total
          - entities.CostReport.fields.undisputed_cost_total
          - entities.CostReport.fields.disputed_cost_total
        distinguishing_aspect: |
          The interdependency here is ORDER OF ROUNDING across an append-only collection, not
          a circular definition: rounding each of three extended line amounts to 2dp before
          summation yields 1411.07, whereas summing the exact products and rounding once
          yields 1411.06, and the disputed/undisputed split must partition the SAME rounded
          line values (1318.17 + 92.90 == 1411.07).
        test_recipe:
          setup:
            - "one CmarProject 'Harborview Clinic' with gmp_status EXECUTED at gmp_amount 1245897.60"
            - "one OPEN CostReport covering [2026-08-01T00:00:00Z, 2026-09-01T00:00:00Z) with zero lines and all three totals 0.00"
          setup_api_calls:
            - call: "POST /projects"
              payload: { name: "Harborview Clinic", owner_org: "Harborview Health", cm_fee_pct: 0.04, insurance_rate: 0.01, precon_fee_amount: 25000.00 }
              as: ProgramAdmin
              captures: { proj: $.data.id, projv1: $.data.version }
            - call: "POST /estimates"
              payload: { project_id: "${proj}", milestone_code: "CD_100", submitted_cost_of_work: 1000000.00, expected_project_version: "${projv1}" }
              as: ConstructionManager
              captures: { est: $.data.id }
            - call: "POST /estimates/${est}/submit"
              payload: {}
              as: ConstructionManager
            - call: "POST /estimates/${est}/reconcile"
              payload: { decision: "ACCEPT" }
              as: OwnerRepresentative
            - call: "GET /projects/${proj}"
              payload: {}
              as: ConstructionManager
              captures: { projv2: $.data.version }
            - call: "POST /gmp-proposals"
              payload: { project_id: "${proj}", based_on_estimate_id: "${est}", cost_of_work_total: 1000000.00, general_conditions_total: 100000.00, owner_contingency_amount: 50000.00, construction_contingency_amount: 40000.00, expected_project_version: "${projv2}" }
              as: ConstructionManager
              captures: { prop: $.data.id }
            - call: "POST /gmp-proposals/${prop}/submit"
              payload: {}
              as: ConstructionManager
            - call: "POST /gmp-proposals/${prop}/decide"
              payload: { decision: "EXECUTE" }
              as: OwnerRepresentative
            - call: "POST /cost-reports"
              payload: { project_id: "${proj}", period_start: "2026-08-01T00:00:00Z", period_end: "2026-09-01T00:00:00Z" }
              as: ConstructionManager
              captures: { cr: $.data.id }
          trigger:
            - call: "POST /cost-reports/${cr}/lines"
              payload: { cost_code: "03-100", quantity: 3, unit_rate: 101.0050, markup_pct: 0.0500, disputed: false }
              as: ConstructionManager
            - call: "POST /cost-reports/${cr}/lines"
              payload: { cost_code: "05-200", quantity: 7, unit_rate: 12.3450, markup_pct: 0.0750, disputed: true }
              as: ConstructionManager
            - call: "POST /cost-reports/${cr}/lines"
              payload: { cost_code: "09-300", quantity: 1, unit_rate: 1000.0010, markup_pct: 0.0000, disputed: false }
              as: ConstructionManager
          assert:
            - "CostReport.${cr}.lines[0].line_amount == 318.17"
            - "CostReport.${cr}.lines[1].line_amount == 92.90"
            - "CostReport.${cr}.lines[2].line_amount == 1000.00"
            - "CostReport.${cr}.line_count == 3"
            - "CostReport.${cr}.reported_cost_total == 1411.07"
            - "CostReport.${cr}.reported_cost_total != 1411.06"
            - "CostReport.${cr}.undisputed_cost_total == 1318.17"
            - "CostReport.${cr}.disputed_cost_total == 92.90"
            - "CostReport.${cr}.status == OPEN"

  # ===================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: change_event_three_way_classification_fork_with_divergent_side_effect_sets
        grounds:
          - state_machines.ChangeEvent.UNDER_REVIEW_to_CLASSIFIED
          - calculations.proposed_gmp_rollup
          - calculations.draw_approval_requirement
          - entities.ChangeEvent.fields.classification
          - entities.GmpProposal.fields.proposal_type
          - entities.ContingencyDraw.fields.contingency_type
          - entities.CmarProject.fields.pending_amendment_count
          - entities.ProgressiveEstimate.fields.reconciliation_stale
        distinguishing_aspect: |
          Non-linearity here is a BRANCHING fork out of one state: three classify calls leave
          all three events in the identical CLASSIFIED state yet produce mutually exclusive
          side-effect sets - SCOPE_CHANGE mints an AMENDMENT GmpProposal and no draw,
          CONTINGENCY_USE_OWNER mints an OWNER draw and no proposal, and
          CONTINGENCY_USE_CONSTRUCTION mints a CONSTRUCTION draw with a different
          requires_owner_approval verdict.
        test_recipe:
          setup:
            - "one CmarProject 'Riverside Data Hall' with gmp_status EXECUTED at gmp_amount 46105590.83, owner_contingency_remaining 1200000.00, construction_contingency_remaining 240000.00, contingency_posture OPEN, pending_amendment_count 0"
            - "one RECONCILED CD_100 ProgressiveEstimate with reconciliation_stale false"
            - "three ChangeEvent rows, all UNDER_REVIEW, submitted by operator cm-pm-1, with estimated_amount 300000.00, 80000.00 and 30000.00"
          setup_api_calls:
            - call: "POST /projects"
              payload: { name: "Riverside Data Hall", owner_org: "Riverside Utilities", cm_fee_pct: 0.0375, insurance_rate: 0.0125, precon_fee_amount: 250000.00 }
              as: ProgramAdmin
              captures: { proj: $.data.id, projv1: $.data.version }
            - call: "POST /estimates"
              payload: { project_id: "${proj}", milestone_code: "CD_100", submitted_cost_of_work: 40000000.00, expected_project_version: "${projv1}" }
              as: ConstructionManager
              captures: { est: $.data.id }
            - call: "POST /estimates/${est}/submit"
              payload: {}
              as: ConstructionManager
            - call: "POST /estimates/${est}/reconcile"
              payload: { decision: "ACCEPT" }
              as: OwnerRepresentative
            - call: "GET /projects/${proj}"
              payload: {}
              as: ConstructionManager
              captures: { projv2: $.data.version }
            - call: "POST /gmp-proposals"
              payload: { project_id: "${proj}", based_on_estimate_id: "${est}", cost_of_work_total: 40000000.00, general_conditions_total: 2500000.00, owner_contingency_amount: 1200000.00, construction_contingency_amount: 240000.00, expected_project_version: "${projv2}" }
              as: ConstructionManager
              captures: { prop: $.data.id }
            - call: "POST /gmp-proposals/${prop}/submit"
              payload: {}
              as: ConstructionManager
            - call: "POST /gmp-proposals/${prop}/decide"
              payload: { decision: "EXECUTE" }
              as: OwnerRepresentative
            - call: "POST /change-events"
              payload: { project_id: "${proj}", description: "owner directive: add redundant cooling loop", estimated_amount: 300000.00, origin: "OWNER_DIRECTIVE" }
              as: ConstructionManager
              as_user_id: "cm-pm-1"
              captures: { ce_scope: $.data.id }
            - call: "POST /change-events/${ce_scope}/submit"
              payload: {}
              as: ConstructionManager
              as_user_id: "cm-pm-1"
            - call: "POST /change-events/${ce_scope}/review"
              payload: { action: "BEGIN_REVIEW", review_note: "reviewing scope addition" }
              as: OwnerRepresentative
              as_user_id: "owner-rep-1"
            - call: "POST /change-events"
              payload: { project_id: "${proj}", description: "unforeseen rock excavation", estimated_amount: 80000.00, origin: "FIELD_CONDITION" }
              as: ConstructionManager
              as_user_id: "cm-pm-1"
              captures: { ce_owner: $.data.id }
            - call: "POST /change-events/${ce_owner}/submit"
              payload: {}
              as: ConstructionManager
              as_user_id: "cm-pm-1"
            - call: "POST /change-events/${ce_owner}/review"
              payload: { action: "BEGIN_REVIEW" }
              as: OwnerRepresentative
              as_user_id: "owner-rep-1"
            - call: "POST /change-events"
