  - rule_id: transitive_cascade
    instances:

      - name: condemn_determination_cascades_five_hops_to_loaner_recall
        grounds:
          - state_machines.ShellTest.status.COMPLETED_to_DETERMINED
          - state_machines.EquipmentUnit.recon_status.TESTED_to_CONDEMNED
          - state_machines.DestructionRecord.status
          - state_machines.IntakeShipment.status.IN_PROCESS_to_READY_FOR_RETURN
          - entities.CustomerAccount.fields.open_shipment_count
          - entities.CustomerAccount.fields.loaner_recall_due_at
          - calculations.shipment_unit_disposition_ledger
        distinguishing_aspect: |
          Cascade A, depth 5 from one call: determine(CONDEMN) -> (1) ShellTest
          DETERMINED -> (2) unit CONDEMNED / PENDING_DISPOSAL with
          condemn_reason SI_EXCEEDS_LIMIT -> (3) a DestructionRecord auto-created
          in PENDING -> (4) shipment ledger 0 in process and READY_FOR_RETURN ->
          (5) account open_shipment_count 0 and loaner_recall_due_at set to
          2026-08-15T00:00:00Z (clock + LOANER_RECALL_GRACE_DAYS 14). Hop 5 is
          two entities away from the endpoint's own entity, so a one-hop
          implementation passes hops 1-2 and still fails.
        test_recipe:
          setup:
            - "clock at 2026-08-01T00:00:00Z"
            - "CustomerAccount with open_shipment_count 1 and loaner_recall_due_at null"
            - "one STANDARD IntakeShipment IN_PROCESS with counted_unit_count 1, units_in_process 1"
