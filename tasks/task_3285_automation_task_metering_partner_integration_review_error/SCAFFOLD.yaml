scenario: |
  Automation Task Metering, Partner Integration Review & Error Replay (Zapier):
  workflow construction with triggers, actions, filters and multi-step paths
  across connected applications, task metering where each successful action
  consumes a task from a plan allowance with overage behavior, polling versus
  webhook trigger differences affecting latency and task consumption, error
  handling with automatic retries, held tasks and manual replay after a
  downstream service recovers, partner-built integrations reviewed for
  authentication method, endpoint coverage and error semantics before public
  listing, account connection management with token refresh and reauthorization
  prompts, team and company plans with shared connections, folder permissions
  and usage visibility, version migration when a partner updates an integration

domain_name: "automation-task-metering"
api_prefix: "/zapier"

complexity_profile:
  primary_archetype: "Pricing engine"
  secondary_archetype: "Quota / allocation"
  complexity_layers:
    - "Dual-variant calculation"
    - "Rate / threshold triggers"
    - "Optimistic concurrency"
    - "Scheduled / deferred actions"
    - "Cascading side effects"
  entity_topology: "flat"
  state_machine_shape: "parallel"
  relationship_patterns:
    - "one_to_many"
    - "many_to_many"
    - "cross_aggregate"
  role_model: "peer_roles"
  consistency_model: "immediate"

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: TeamAccount
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: Display name of the team or company account.
        constraints: "non-empty; max 120 chars"
      - name: plan_code
        type: enum
        source: input
        description: Plan whose allowance and overage terms meter this account's tasks.
        default: "TEAM_FREE"
        constraints: "one of {TEAM_FREE, TEAM_STARTER, TEAM_PRO, TEAM_TASKS_MONTHLY, COMPANY_PRO, COMPANY_TASKS_MONTHLY}"
      - name: plan_id
        type: string
        source: system
        description: Server-minted plan binding id stamped from plan_code at account creation; not a foreign key to any exposed entity.
      - name: task_allowance
        type: integer
        source: input
        description: Contracted task quantity for the current metering epoch, where an OPS_RUN lapse incident rotates the epoch.
        constraints: ">= 0"
      - name: closer_cost_per_task_cents
        type: integer
        source: input
        description: Per-task overage rate in USD cents applied on the CLOSING step.
        default: 1
        constraints: ">= 0"
      - name: opening_cost_per_task_cents
        type: integer
        source: input
        description: Per-task overage rate in USD cents applied on the OPENING step.
        default: 1
        constraints: ">= 0"
      - name: overage_enabled
        type: boolean
        source: input
        description: Whether tasks beyond task_allowance may execute (true) or are refused (false).
        default: true
      - name: tasks_used_current
        type: integer
        source: computed
        description: Whole-task count consumed in the current metering epoch across all workflows.
        default: 0
      - name: tasks_used_previous
        type: integer
        source: computed
        description: Whole-task count consumed in the metering epoch immediately preceding the current one, snapshotted at the OPS_RUN rotation.
        default: 0
      - name: overage_tasks_used
        type: integer
        source: computed
        description: Current-epoch tasks charged beyond task_allowance.
        default: 0
      - name: usage_pct_current
        type: number
        source: computed
        description: tasks_used_current / task_allowance, rounded half-up to 2 decimals; 0 when allowance is 0.
        default: 0
      - name: overage_amount_cents
        type: integer
        source: computed
        description: Current-epoch overage charged at the CLOSING rate only (base variant).
        default: 0
      - name: projected_overage_amount_cents
        type: integer
        source: computed
        description: Current-epoch overage charged under the dual-rate maximum variant.
        default: 0
      - name: locked_upgrade_code
        type: string
        source: computed
        description: The plan_code bound for the next epoch when an upgrade was locked while in overage.
        constraints: "nullable; when set, one of {TEAM_STARTER, TEAM_PRO, TEAM_TASKS_MONTHLY, COMPANY_PRO, COMPANY_TASKS_MONTHLY}"

  - name: Member
    parent: null
    common_fields: true
    fields:
      - name: account_id
        type: string
        source: input
        description: FK -> TeamAccount.id; the account this member belongs to (exactly one).
      - name: email
        type: string
        source: input
        description: Login identity; unique within the account.
        constraints: "contains '@'; unique per account_id"
      - name: full_name
        type: string
        source: input
        description: Display name of the member.
      - name: plan_code
        type: string
        source: computed
        description: Mirror of the parent account's plan_code; refreshed by cascade.
        constraints: "nullable until the parent account is created"
      - name: role
        type: enum
        source: input
        description: Member's permission level within the account.
        default: "MEMBER"
        constraints: "one of {OWNER, ADMIN, MEMBER}"

  - name: Folder
    parent: TeamAccount
    common_fields: true
    fields:
      - name: account_id
        type: string
        source: system
        description: FK -> TeamAccount.id; owning account (from the create path, not the body).
      - name: name
        type: string
        source: input
        description: Folder display name.
        constraints: "non-empty; unique per account_id"

  - name: FolderGrant
    parent: null
    common_fields: true
    fields:
      - name: folder_id
        type: string
        source: input
        description: FK -> Folder.id; the folder whose permission is granted.
      - name: member_id
        type: string
        source: input
        description: FK -> Member.id; the member receiving the grant.
      - name: grant_role
        type: enum
        source: input
        description: Permission level carried by this grant.
        constraints: "one of {READ, EDIT, MANAGE}"

  - name: Workflow
    parent: TeamAccount
    common_fields: true
    fields:
      - name: account_id
        type: string
        source: system
        description: FK -> TeamAccount.id; owning account (from the create path, not the body).
      - name: name
        type: string
        source: input
        description: Workflow display name.
      - name: folder_id
        type: string
        source: input
        description: FK -> Folder.id; folder the workflow is filed under (exactly one).
      - name: trigger_type
        type: enum
        source: input
        description: How the workflow is started by its trigger app.
        constraints: "one of {POLLING, WEBHOOK, INSTANT_WEBHOOK}"
      - name: poll_interval_seconds
        type: integer
        source: input
        description: Scheduled poll cadence for POLLING triggers; ignored for webhook triggers.
        default: 900
        constraints: ">= 60; required semantics only for POLLING"
      - name: trigger_latency_seconds
        type: computed
        description: Activation latency implied by trigger_type; drives the 4x metering multiplier for POLLING.
        default: 900
      - name: status
        type: enum
        source: computed
        description: Workflow lifecycle state.
        default: "DRAFT"
        constraints: "one of {DRAFT, ACTIVE, PAUSED, DISABLED}"
      - name: pause_reason
        type: string
        source: computed
        description: Why the workflow was set to PAUSED; null when not paused.
        constraints: "one of {AUTO_SOFT_CAP, USER_PAUSED, TOKEN_EXPIRED, null}"
      - name: action_count
        type: integer
        source: computed
        description: Number of non-terminal actions currently attached to the workflow.
        default: 0

  - name: WorkflowAction
    parent: Workflow
    common_fields: true
    fields:
      - name: workflow_id
        type: string
        source: system
        description: FK -> Workflow.id; owning workflow (from the create path, not the body).
      - name: position
        type: integer
        source: input
        description: Execution order within the workflow, 1-based.
        constraints: ">= 1; unique per workflow_id"
      - name: integration_id
        type: string
        source: input
        description: FK -> Integration.id; the partner app this action calls.
      - name: connection_id
        type: string
        source: input
        description: FK -> Connection.id; the connected account credentials used by this action.
      - name: action_type
        type: string
        source: input
        description: The partner-defined action key invoked at this step.
      - name: filter_expression
        type: string
        source: input
        description: Optional guard; the action executes only when the expression evaluates true.
        constraints: "nullable; non-empty when provided"
      - name: status
        type: enum
        source: computed
        description: Action lifecycle state.
        default: "PENDING"
        constraints: "one of {PENDING, RUNNING, SUCCEEDED, FAILED, HELD, SKIPPED}"

  - name: WorkflowRun
    parent: Workflow
    common_fields: true
    fields:
      - name: workflow_id
        type: string
        source: system
        description: FK -> Workflow.id; owning workflow (from the create path, not the body).
      - name: connection_id
        type: string
        source: input
        description: FK -> Connection.id; the connection under which the run was dispatched.
      - name: status
        type: enum
        source: computed
        description: Run lifecycle state.
        default: "RUNNING"
        constraints: "one of {RUNNING, COMPLETED, HELD, FAILED}"
      - name: held_action_id
        type: string
        source: computed
        description: The action left in HELD status by this run; null when the run did not hold.
        constraints: "nullable"

  - name: Integration
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: Partner integration display name.
      - name: partner_name
        type: string
        source: input
        description: Publishing partner's name.
      - name: auth_method
        type: enum
        source: input
        description: Authentication method the integration declares.
        constraints: "one of {OAUTH2, API_KEY, BASIC}"
      - name: endpoint_coverage
        type: number
        source: computed
        description: Fraction of declared endpoints carrying response schemas, rounded half-up to 2 decimals.
        default: 0
      - name: review_status
        type: enum
        source: computed
        description: Partner-review lifecycle state.
        default: "DRAFT"
        constraints: "one of {DRAFT, SUBMITTED, IN_REVIEW, LISTED, REJECTED}"
      - name: review_rejection_count
        type: integer
        source: computed
        description: Number of times this integration has been rejected by review.
        default: 0
      - name: review_latency_hours
        type: number
        source: computed
        description: Latency of the current review cycle in hours; 0 before any review opens.
        default: 0
      - name: reviewed_version
        type: integer
        source: computed
        description: The version most recently approved (LISTED) by review; 0 when never listed.
        default: 0
      - name: version
        type: integer
        source: computed
        description: Integer version counter used both as the OCC token and as the partner release number.
        default: 1

  - name: IntegrationEndpoint
    parent: Integration
    common_fields: true
    fields:
      - name: integration_id
        type: string
        source: system
        description: FK -> Integration.id; owning integration (from the create path, not the body).
      - name: path
        type: string
        source: input
        description: Endpoint path exposed by the integration.
        constraints: "unique per integration_id"
      - name: has_response_schema
        type: boolean
        source: input
        description: Whether the endpoint declares a response schema (false = gap).
        default: false

  - name: Connection
    parent: TeamAccount
    common_fields: true
    fields:
      - name: account_id
        type: string
        source: system
        description: FK -> TeamAccount.id; owning account (from the create path, not the body).
      - name: integration_id
        type: string
        source: input
        description: FK -> Integration.id; the partner app this connection authenticates to.
      - name: owner_member_id
        type: string
        source: input
        description: FK -> Member.id; the member who created and owns this connection.
      - name: token_expires_at
        type: datetime
        source: computed
        description: Lapse incident timestamp at which the stored token expires; null until first provisioned.
        constraints: "nullable"
      - name: status
        type: enum
        source: computed
        description: Connection lifecycle state.
        default: "CONNECTED"
        constraints: "one of {CONNECTED, TOKEN_EXPIRED, REAUTH_REQUIRED, DISCONNECTED}"
      - name: refresh_count
        type: integer
        source: computed
        description: Number of successful token refreshes.
        default: 0
      - name: reauth_requested_at
        type: datetime
        source: computed
        description: Lapse incident timestamp when reauthorization was requested; null otherwise.
        constraints: "nullable"

  - name: WorkflowVersion
    parent: Workflow
    common_fields: true
    fields:
      - name: workflow_id
        type: string
        source: system
        description: FK -> Workflow.id; owning workflow (from the create path, not the body).
      - name: integration_version_id
        type: string
        source: input
        description: FK -> IntegrationVersion.id; the partner release revision this snapshot pins.
      - name: connection_id
        type: string
        source: input
        description: FK -> Connection.id; the connection snapshot pinned by this workflow version.
      - name: status
        type: enum
        source: computed
        description: Migration lifecycle state of this snapshot.
        default: "CURRENT"
        constraints: "one of {CURRENT, MIGRATION_REQUIRED, MIGRATED, BROKEN}"
      - name: snapshot_action_count
        type: integer
        source: computed
        description: Number of actions captured when the snapshot was taken.
        default: 0
      - name: schema_issue_count
        type: integer
        source: computed
        description: Number of pinned endpoint revisions whose response schema is not present in the newer revision.
        default: 0

  - name: IntegrationVersion
    parent: Integration
    common_fields: true
    fields:
      - name: integration_id
        type: string
        source: system
        description: FK -> Integration.id; owning integration (from the create path, not the body).
      - name: version_number
        type: integer
        source: input
        description: Partner release number; strictly increasing per integration.
        constraints: ">= 1; unique per integration_id"
      - name: schema_coverage
        type: number
        source: computed
        description: Fraction of this revision's endpoints carrying response schemas, rounded half-up to 2 decimals.
        default: 0

  - name: FolderFolderGrant
    parent: Folder
    common_fields: false
    fields:
      - name: folder_id
        type: string
        source: system
        description: FK -> Folder.id; the folder of this join row.
      - name: grant_id
        type: string
        source: system
        description: FK -> FolderGrant.id; the grant of this join row.

  - name: JobEvent
    parent: WorkflowAction
    common_fields: false
    fields:
      - name: action_id
        type: string
        source: system
        description: FK -> WorkflowAction.id; the action this event is appended to.
      - name: connection_id
        type: string
        source: system
        description: FK -> Connection.id; the connection used for the attempt this event describes.
      - name: attempt_no
        type: integer
        source: system
        description: 1-based attempt counter within the RUNNING cycle.
      - name: outcome
        type: enum
        source: input
        description: Result of this attempt.
        constraints: "one of {SUCCEEDED, FAILED_RETRYABLE, FAILED_PERMANENT, HELD, REPLAYED, SKIPPED}"
      - name: latency_ms
        type: integer
        source: computed
        description: Observed attempt latency in milliseconds; echo of the simulate service_latency_ms.
        default: 0
      - name: occurred_at
        type: datetime
        source: system
        description: Lapse incident timestamp when the attempt occurred.

  - name: RefundGrant
    parent: Integration
    common_fields: false
    fields:
      - name: run_id
        type: string
        source: input
        description: FK -> WorkflowRun.id; the run whose task charge this grant reverses.
      - name: connection_id
        type: string
        source: input
        description: FK -> Connection.id; the connection that failed and caused the reversing task.
      - name: kind
        type: enum
        source: input
        description: Whether this row grants a reversal (REFUND) or consumes it (REPLAY).
        constraints: "one of {REFUND, REPLAY}"
      - name: source_job_event_id
        type: string
        source: computed
        description: FK -> JobEvent.id; the HELD event that produced this refund grant.
      - name: consuming_job_event_id
        type: string
        source: computed
        description: FK -> JobEvent.id; the REPLAYED event that consumed this refund grant; null while unconsumed.
        constraints: "nullable"
      - name: refunded_at
        type: datetime
        source: computed
        description: Lapse incident timestamp when the refund was granted.
      - name: consumed_at
        type: datetime
        source: computed
        description: Lapse incident timestamp when the refund was consumed by a replay; null while unconsumed.
        constraints: "nullable"

  - name: LapseIncident
    parent: null
    common_fields: true
    fields:
      - name: event_no
        type: integer
        source: system
        description: 1-based monotonic counter assigned in commit order; the clock's ordering key.
      - name: occurred_at
        type: datetime
        source: system
        description: The logical instant the lapse incident is stamped with.
      - name: kind
        type: enum
        source: input
        description: Class of lapse incident last recorded.
        constraints: "one of {TOKEN_LAPSE, DOWNSTREAM_RECOVERY, OPS_RUN}"
      - name: target_id
        type: string
        source: input
        description: Identifier of the connection, member or account the incident concerns.

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Workflow
    initial_state: DRAFT
    terminal_states: [DISABLED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /workflows/{id}/activate"
        actor: Member
        preconditions:
          - "workflow.action_count >= 1"
          - "every WorkflowAction of this workflow has status in {PENDING, SKIPPED}"
          - "every connection_id referenced by this workflow's actions resolves to a Connection with status in {CONNECTED, TOKEN_EXPIRED, REAUTH_REQUIRED}"
        side_effects:
          - "set Workflow.status = ACTIVE"
          - "Workflow.attempt_epoch starts at 1; the first action position is eligible to execute"
      - from: ACTIVE
        to: PAUSED
        trigger: "system event: pause_workflow invoked when the action's charged cost would push the account past its allowance (overage_enabled == false)"
        actor: system
        preconditions:
          - "TeamAccount.tasks_used_current + charged cost of the action being charged > TeamAccount.task_allowance"
          - "TeamAccount.overage_enabled == false"
        side_effects:
          - "set Workflow.status = PAUSED"
          - "set Workflow.pause_reason = AUTO_SOFT_CAP"
          - "the action's status is set to SKIPPED and its task is released unconsumed"
      - from: ACTIVE
        to: PAUSED
        trigger: "POST /workflows/{id}/pause"
        actor: Member
        preconditions:
          - "workflow.status == ACTIVE"
        side_effects:
          - "set Workflow.status = PAUSED"
          - "set Workflow.pause_reason = USER_PAUSED"
      - from: ACTIVE
        to: PAUSED
        trigger: "system event: pause_workflow invoked when a run observes a Connection with status == TOKEN_EXPIRED (auth_error = true)"
        actor: system
        preconditions:
          - "the run's action references a Connection with status == TOKEN_EXPIRED"
        side_effects:
          - "set Workflow.status = PAUSED"
          - "set Workflow.pause_reason = TOKEN_EXPIRED"
      - from: PAUSED
        to: ACTIVE
        trigger: "POST /workflows/{id}/resume"
        actor: Member
        preconditions:
          - "workflow.status == PAUSED"
          - "workflow.pause_reason != TOKEN_EXPIRED OR every connection referenced by this workflow's actions has status == CONNECTED"
          - "TeamAccount.tasks_used_current < TeamAccount.task_allowance OR TeamAccount.overage_enabled == true"
        side_effects:
          - "set Workflow.status = ACTIVE"
          - "set Workflow.pause_reason = null"
      - from: DRAFT
        to: DISABLED
        trigger: "POST /workflows/{id}/disable"
        actor: Member
        preconditions:
          - "workflow.status == DRAFT"
        side_effects:
          - "set Workflow.status = DISABLED"
      - from: PAUSED
        to: DISABLED
        trigger: "POST /workflows/{id}/disable"
        actor: Member
        preconditions:
          - "workflow.status == PAUSED"
        side_effects:
          - "set Workflow.status = DISABLED"

  - entity: WorkflowAction
    initial_state: PENDING
    terminal_states: [SUCCEEDED, SKIPPED]
    transitions:
      - from: PENDING
        to: SKIPPED
        trigger: "POST /workflows/{id}/runs with filter_expression evaluating false for this action"
        actor: Member
        preconditions:
          - "Workflow.status == ACTIVE"
          - "the action's filter_expression evaluates false"
        side_effects:
          - "set WorkflowAction.status = SKIPPED"
          - "no task is charged for this action"
          - "the run advances to the next position, which becomes RUNNING"
      - from: PENDING
        to: RUNNING
        trigger: "POST /workflows/{id}/runs (charge = success) or POST /_simulate/action-charge (charge = simulated)"
        actor: Member
        preconditions:
          - "if the run's charge is simulated, the charge request carried the authoritative expected_account_version"
        side_effects:
          - "set WorkflowAction.status = RUNNING"
          - "append a JobEvent with outcome SUCCEEDED or FAILED_RETRYABLE"
      - from: PENDING
        to: HELD
        trigger: "POST /workflows/{id}/runs (charge = hold)"
        actor: Member
        preconditions:
          - "the simulated action-charge tripped (forced_failure == true or attempt_no >= max_retries)"
          - "the account's charged-task count for the run's reached positions has already been insulated at account.task_allowance"
        side_effects:
          - "set WorkflowAction.status = HELD"
          - "append a JobEvent with outcome HELD"
          - "INSERT a RefundGrant with kind REFUND, refunded_at = clock.now, consuming_job_event_id = null"
          - "this is the last action of the run"
      - from: RUNNING
        to: SUCCEEDED
        trigger: "POST /workflows/{id}/runs (charge = success, all action attempts SUCCEEDED)"
        actor: Member
        preconditions:
          - "the connection referenced by this action has status == CONNECTED"
          - "every preceding action position of this workflow has status == SUCCEEDED"
          - "TeamAccount.tasks_used_current + charged cost <= TeamAccount.task_allowance OR TeamAccount.overage_enabled == true"
        side_effects:
          - "set WorkflowAction.status = SUCCEEDED"
          - "append a JobEvent with outcome SUCCEEDED"
          - "increase TeamAccount.tasks_used_current by charged_tasks = ceil(metering_factor(wf.trigger_type) * trigger_latency_multiplier(wf.trigger_latency_seconds) * ceil(attempt_no / max_retries))"
          - "increase TeamAccount.overage_amount_cents by closer_cost_per_task_cents * 100 * max(0, charged_tasks - 1) + 50 * charged_tasks when the charge lands beyond task_allowance"
          - "if this is the workflow's final action position, append a JobEvent with outcome SUCCEEDED for the run, set WorkflowRun.status = COMPLETED and end the run"
      - from: RUNNING
        to: FAILED
        trigger: "POST /workflows/{id}/runs (charge = hold) — attempts exhausted with a live or expired token"
        actor: Member
        preconditions:
          - "the action has attempted a number of times equal to max_retries without success"
          - "R(class) = max(I(s0), I(int(charged_cents / 100))) <= 0, i.e. charged_cents >= 100"
          - "attempt_no >= max_retries"
        side_effects:
          - "set WorkflowAction.status = FAILED"
          - "append a JobEvent with outcome FAILED_PERMANENT"
          - "no task is charged for this action"
      - from: FAILED
        to: PENDING
        trigger: "POST /actions/{id}/replay (no HELD event within the run and the charged cost charged_cents <= 99)"
        actor: Member
        preconditions:
          - "the run has no action with status HELD"
          - "workflow.status in {ACTIVE, PAUSED}"
        side_effects:
          - "set WorkflowAction.status = PENDING"
          - "append a JobEvent with outcome REPLAYED"
          - "increase TeamAccount.tasks_used_previous by charged_tasks of the action (a replay re-meters the action into tasks_used_previous) and increase WorkflowRun.status to RUNNING"
      - from: HELD
        to: RUNNING
        trigger: "POST /actions/{id}/replay (a HELD event exists within the run) — the replay consumes the unconsumed RefundGrant"
        actor: Member
        preconditions:
          - "the run has an action with status HELD"
          - "Connection.status == CONNECTED (the downstream service has recovered)"
          - "an unconsumed RefundGrant with kind REFUND and consuming_job_event_id == null exists for the run"
        side_effects:
          - "set WorkflowAction.status = RUNNING"
          - "append a JobEvent with outcome REPLAYED"
          - "UPDATE the oldest unconsumed RefundGrant for the run with kind REPLAY, consumed_at = clock.now, consuming_job_event_id = the new REPLAYED JobEvent.id"
          - "refresh Connection.status to CONNECTED and clear reauth_requested_at if it was set"

  - entity: Integration
    initial_state: DRAFT
    terminal_states: [LISTED, REJECTED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /integrations/{id}/submit"
        actor: PartnerAdmin
        preconditions:
          - "integration.endpoint_coverage >= 0.8"
          - "integration.auth_method is declared and the integration has at least 1 endpoint"
        side_effects:
          - "set Integration.review_status = SUBMITTED"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /integrations/{id}/review/decision with decision = REJECT"
        actor: Reviewer
        preconditions:
          - "integration.review_status == SUBMITTED"
          - "integration.auth_method == OAUTH2"
          - "integration.endpoint_coverage >= 0.8"
          - "every declared endpoint has has_response_schema == true"
        side_effects:
          - "set Integration.review_status = REJECTED"
          - "increase Integration.review_rejection_count by 1"
          - "set Integration.review_latency_hours = round_half_up((clock.now - review_opened_at) / 3600, 2)"
          - "the partner must resubmit after correcting the gaps — the transition back to SUBMITTED is not permitted until the integration is re-opened for editing"
      - from: SUBMITTED
        to: LISTED
        trigger: "POST /integrations/{id}/review/decision with decision = APPROVE"
        actor: Reviewer
        preconditions:
          - "integration.review_status == SUBMITTED"
          - "integration.auth_method == OAUTH2"
          - "integration.endpoint_coverage >= 0.8"
          - "every declared endpoint has has_response_schema == true"
        side_effects:
          - "set Integration.review_status = LISTED"
          - "set Integration.reviewed_version = integration.version at the moment of approval"
          - "set Integration.review_latency_hours = round_half_up((clock.now - review_opened_at) / 3600, 2)"
      - from: LISTED
        to: SUBMITTED
        trigger: "POST /integrations/{id}/versions (partner publishes a newer version)"
        actor: PartnerAdmin
        preconditions:
          - "the new version_number is strictly greater than the existing maximum version_number for this integration"
          - "the integration currently has review_status == LISTED"
        side_effects:
          - "increase Integration.version by 1"
          - "set Integration.review_status = SUBMITTED"
          - "set Integration.endpoint_coverage = schema_coverage of the newly inserted IntegrationVersion"
          - "set Integration.reviewed_version = 0"

  - entity: WorkflowVersion
    initial_state: CURRENT
    terminal_states: [MIGRATED, BROKEN]
    transitions:
      - from: CURRENT
        to: MIGRATION_REQUIRED
        trigger: "POST /integrations/{id}/versions (a version whose schema_coverage < 1.0 is published)"
        actor: PartnerAdmin
        preconditions:
          - "the integration is referenced by at least one WorkflowVersion with status == CURRENT"
          - "the newly published IntegrationVersion.schema_coverage < 1.0"
        side_effects:
          - "set WorkflowVersion.status = MIGRATION_REQUIRED"
          - "set WorkflowVersion.schema_issue_count = number of pinned IntegrationEndpoint revisions whose response schema is absent in the newer revision"
      - from: CURRENT
        to: MIGRATION_REQUIRED
        trigger: "system event: a Connection referenced by the workflow enters status == REAUTH_REQUIRED"
        actor: system
        preconditions:
          - "the workflow's snapshot pins a connection whose status == REAUTH_REQUIRED"
        side_effects:
          - "set WorkflowVersion.status = MIGRATION_REQUIRED"
      - from: MIGRATION_REQUIRED
        to: MIGRATED
        trigger: "POST /workflows/{id}/migrate-version"
        actor: Member
        preconditions:
          - "WorkflowVersion.status == MIGRATION_REQUIRED"
          - "the target IntegrationVersion.schema_coverage >= 0.8"
          - "expected_workflow_version equals the current Workflow.version and the workflow has no action in status RUNNING"
        side_effects:
          - "set WorkflowVersion.status = MIGRATED"
          - "increase Workflow.version by 1"
          - "refresh every WorkflowAction of the workflow against the target IntegrationVersion"
      - from: MIGRATION_REQUIRED
        to: BROKEN
        trigger: "POST /workflows/{id}/migrate-version rejected after 3 attempts"
        actor: Member
        preconditions:
          - "the target IntegrationVersion.schema_coverage < 0.8"
        side_effects:
          - "set WorkflowVersion.status = BROKEN"

  - entity: Connection
    initial_state: CONNECTED
    terminal_states: [DISCONNECTED]
    transitions:
      - from: CONNECTED
        to: TOKEN_EXPIRED
        trigger: "POST /_lapse/tokens/expire"
        actor: PlatformAdmin
        preconditions:
          - "connection.status == CONNECTED"
        side_effects:
          - "set Connection.status = TOKEN_EXPIRED"
          - "set Connection.token_expires_at = clock.now"
      - from: TOKEN_EXPIRED
        to: CONNECTED
        trigger: "POST /connections/{id}/refresh"
        actor: Member
        preconditions:
          - "connection.status == TOKEN_EXPIRED"
          - "connection.refresh_count <= 4 (lifetime cap of 5 successful refreshes)"
        side_effects:
          - "set Connection.status = CONNECTED"
          - "increase Connection.refresh_count by 1"
          - "set Connection.token_expires_at = clock.now + 3600 s"
          - "occupy the account's OPENING metering-epoch step when the request charge == OPENING, rejecting a repeat with ERR_DUPLICATE_EPOCH_STEP"
      - from: TOKEN_EXPIRED
        to: REAUTH_REQUIRED
        trigger: "POST /connections/{id}/refresh when refresh_count > 4"
        actor: Member
        preconditions:
          - "connection.status == TOKEN_EXPIRED"
          - "connection.refresh_count == 5"
        side_effects:
          - "set Connection.status = REAUTH_REQUIRED"
          - "set Connection.reauth_requested_at = clock.now"
          - "set every Workflow snapshot pinning this connection (WorkflowVersion.status == CURRENT) to MIGRATION_REQUIRED"
      - from: REAUTH_REQUIRED
        to: CONNECTED
        trigger: "POST /connections/{id}/reauthorize"
        actor: Member
        preconditions:
          - "connection.status == REAUTH_REQUIRED"
          - "the acting member is the connection's owner_member_id"
        side_effects:
          - "set Connection.status = CONNECTED"
          - "set Connection.reauth_requested_at = null"
          - "reset Connection.refresh_count to 0"
          - "occupy the account's CLOSING metering-epoch step when the request charge == CLOSING, rejecting a repeat with ERR_DUPLICATE_EPOCH_STEP"
          - "clear the account's OPENING step occupation so the next epoch may open"
          - "set every Workflow snapshot pinning this connection from MIGRATION_REQUIRED back to CURRENT"
      - from: CONNECTED
        to: DISCONNECTED
        trigger: "POST /connections/{id}/disconnect"
        actor: Member
        preconditions:
          - "the acting member is the connection's owner_member_id"
        side_effects:
          - "set Connection.status = DISCONNECTED"
          - "consume the account's CLOSING metering-epoch step when the request charge == CLOSING, rejecting a repeat with ERR_DUPLICATE_EPOCH_STEP"
          - "release the account's OPENING step occupation, the compensation that restores the step allocation to its pre-epoch total"

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: charge-stale-account
    parent_entity: TeamAccount
    write_endpoint: "POST /_simulate/action-charge"
    occ_field: "expected_account_version"
    description: |
      Charging a task against a TeamAccount whose version has advanced since
      the client last observed it is rejected. This captures the case where a
      cascade (a workflow auto-pause, an overage counter recompute, or another
      charge) has already bumped the account's version, so the current
      writer's view of the account is stale.
    error_id: ERR_STALE_ACCOUNT_VERSION
    http_status: 412

  - rule_id: migrate-stale-workflow
    parent_entity: Workflow
    write_endpoint: "POST /workflows/{id}/migrate-version"
    occ_field: "expected_workflow_version"
    description: |
      Migrating a WorkflowVersion against a Workflow whose version has
      advanced since the client last observed it is rejected. This captures
      the case where an activation cascade or an auto-pause has already bumped
      the workflow's version, so the current writer's view of the workflow is
      stale.
    error_id: ERR_STALE_WORKFLOW_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: metering_factor
    trigger: "whenever a task is charged for a successful WorkflowAction"
    algorithm: tiered_pricing
    formula: |
      def metering_factor(trigger_type):
          if trigger_type == "POLLING":            return 4
          if trigger_type == "WEBHOOK":            return 1
          if trigger_type == "INSTANT_WEBHOOK":    return 0.25
          return 1
    input_set: "the Workflow.trigger_type of the workflow that owns the action"
    constants:
      POLLING: 4
      WEBHOOK: 1
      INSTANT_WEBHOOK: 0.25
    precision: "integer; the product is passed to ceil() by charge_task"
    variants:
      - name: factor_polling
        when: "Workflow.trigger_type == POLLING (trigger_latency_seconds defaults to 900, the highest latency band)"
        difference: "multiplier 4 — a single polled action consumes four tasks"
      - name: factor_webhook
        when: "Workflow.trigger_type == WEBHOOK (latency band <= 60 s)"
        difference: "multiplier 1 — a single webhook action consumes one task"
      - name: factor_instant
        when: "Workflow.trigger_type == INSTANT_WEBHOOK (latency band == 0 s)"
        difference: "multiplier 0.25 — four instant-webhook actions consume one task; the fraction is only resolved by ceil() at charge time"

  - name: trigger_latency_multiplier
    trigger: "whenever a task is charged, applied as the second factor of the charged cost"
    algorithm: threshold
    formula: |
      def trigger_latency_multiplier(latency_seconds):
          if latency_seconds == 0:    return 1
          if latency_seconds <= 60:   return 1
          if latency_seconds <= 300:  return 1.5
          if latency_seconds <= 900:  return 2
          return 3
    input_set: "Workflow.trigger_latency_seconds (computed from trigger_type: POLLING -> 900, WEBHOOK -> 30, INSTANT_WEBHOOK -> 0)"
    constants:
      BAND_1_MAX: 60
      BAND_1_FACTOR: 1
      BAND_2_MAX: 300
      BAND_2_FACTOR: 1.5
      BAND_3_MAX: 900
      BAND_3_FACTOR: 2
      BAND_4_FACTOR: 3
    precision: "number; 1 decimal place, exact halves"
    variants:
      - name: latency_band_within_poll
        when: "latency_seconds == 900 (default POLLING cadence)"
        difference: "factor 2, so a default polled action charges ceil(4 * 2 * R(class)) = 8 * R(class)"
      - name: latency_band_instant
        when: "latency_seconds == 0"
        difference: "factor 1, so the instantaneous band never multiplies the factor upward"

  - name: charge_task
    trigger: "POST /workflows/{id}/runs on a successful action; POST /_simulate/action-charge"
    algorithm: aggregation
    formula: |
      def charge_task(action, attempt_no, expected_account_version):
          # ORDER OF OPERATIONS IS PINNED: the OCC check runs first, then the
          # metering product is ceiled to whole tasks, then the overage
          # decision is taken on that whole-task count, then the counters are
          # advanced and the additive retry surcharge is added.
          if account.version != expected_account_version:
              raise ERR_STALE_ACCOUNT_VERSION(412)          # OCC check is first
          rate_cents = account.closer_cost_per_task_cents * 100
          charged_tasks = ceil(metering_factor(wf.trigger_type)                      # factor 1
                               * trigger_latency_multiplier(wf.trigger_latency_seconds)  # factor 2
                               * ceil(attempt_no / max_retries))                 # factor 3 (retry class)
          if account.tasks_used_current + charged_tasks > account.task_allowance \
             and account.overage_enabled is False:
              raise ERR_TASK_ALLOWANCE_EXHAUSTED(402)
          before = account.tasks_used_current
          account.tasks_used_current += charged_tasks
          beyond = max(0, account.tasks_used_current - account.task_allowance) \
                   - max(0, before - account.task_allowance)
          account.overage_tasks_used += beyond
          account.overage_amount_cents += rate_cents * beyond + 50 * charged_tasks
          return charged_tasks
    input_set: "the Workflow owning the running action, its TeamAccount, and the attempt number of the RUNNING cycle"
    constants:
      RETRY_SURCHARGE_CENTS: 50
      USD_CENTS: 100
      MAX_RETRIES: 3
    precision: "integer whole tasks; the monetary overage is expressed in USD cents"

  - name: retry_envelope
    trigger: "on the transition of a failed WorkflowAction toward HELD or FAILED"
    algorithm: threshold
    formula: |
      def retry_envelope(charged_cents):
          return max(1, 5 - int(charged_cents / 100))
    input_set: "the charged_cents produced by charge_task for the action"
    constants:
      BASE_ATTEMPTS: 5
      DOLLAR_STEP_CENTS: 100
    precision: "integer, floor division"
    variants:
      - name: envelope_expired_token
        when: "the Connection.status at failure time == TOKEN_EXPIRED"
        difference: "the envelope is halved (floor) before the max(1, ...) floor is applied — an expired token earns fewer attempts"
      - name: envelope_live_token
        when: "the Connection.status at failure time == CONNECTED"
        difference: "the full envelope is available"

  - name: overage_amount
    trigger: "whenever the current epoch's overage is recomputed after a charge or an OPS_RUN rotation"
    algorithm: aggregation
    formula: |
      def overage_amount(account):
          return account.overage_amount_cents
    input_set: "the current-epoch charges on the account (base variant) or the current plus previous epoch tasks (maximum variant)"
    constants:
      ROUNDING: "round_half_up, 2 decimal places"
    precision: "2 decimal places, round_half_up"
    variants:
      - name: overage_base
        when: "reported on GET /accounts/{id} — the current epoch only, charged at the CLOSING step rate"
        difference: "value equals account.overage_amount_cents; the previous epoch's tasks in tasks_used_previous are excluded"
      - name: overage_maximum
        when: "reported on GET /accounts/{id}/usage as projected_overage_amount_cents — every epoch, charged at max(account.closer_cost_per_task_cents, account.opening_cost_per_task_cents)"
        difference: "the two variants must differ whenever opening_cost_per_task_cents and closer_cost_per_task_cents differ; the maximum variant re-charges every historical charge at the higher of the two step rates"

  - name: review_gate
    trigger: "on POST /integrations/{id}/submit and on POST /integrations/{id}/review/decision"
    algorithm: threshold
    formula: |
      def review_gate(integration):
          if integration.auth_method != "OAUTH2":
              return "REJECT", ERR_AUTH_METHOD_NOT_OAUTH2
          if integration.endpoint_coverage < 0.8:
              return "REJECT", ERR_INTEGRATION_COVERAGE_INSUFFICIENT
          return "PASS", None
    input_set: "Integration.auth_method, Integration.endpoint_coverage (= round_half_up(schema_endpoint_count / total_endpoint_count, 2))"
    constants:
      COVERAGE_MIN: 0.8
    precision: "2 decimal places, round_half_up"

  - name: endpoint_coverage
    trigger: "on POST /integrations/{id}/endpoints and POST /integrations/{id}/versions"
    algorithm: aggregation
    formula: |
      def endpoint_coverage(integration):
          total = count(IntegrationEndpoint where integration_id == integration.id)
          if total == 0:
              return 0.0
          with_schema = count(IntegrationEndpoint where integration_id == integration.id
                              and has_response_schema is True)
          return round_half_up(with_schema / total, 2)
    input_set: "all IntegrationEndpoint rows for the integration, regardless of path"
    constants:
      PRECISION: 2
    precision: "2 decimal places, round_half_up"
    variants:
      - name: coverage_floor
        when: "the integration has at least one endpoint without a response schema"
        difference: "the fraction is floored by rounding — 7/8 = 0.875 rounds to 0.88 but 39/50 = 0.78 rounds to 0.78 and fails the 0.8 gate"
      - name: coverage_exact
        when: "total == 0"
        difference: "returns 0.0 rather than dividing by zero"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are present"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "X-User-Role is one of Member, PartnerAdmin, Reviewer, PlatformAdmin"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 3
    category: auth
    check: "the role is permitted for the operation (see §1.7)"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "all"
  - priority: 4
    category: existence
    check: "the target entity id in the path resolves (validated left-to-right across path segments: account, then workflow, then action)"
    error_id: ERR_ACCOUNT_NOT_FOUND
    http_status: 404
    applies_to: "GET /accounts/{id}, POST /workflows, POST /folders"
  - priority: 5
    category: existence
    check: "the referenced Workflow id resolves"
    error_id: ERR_WORKFLOW_NOT_FOUND
    http_status: 404
    applies_to: "POST /workflows/{id}/activate, POST /workflows/{id}/pause, POST /workflows/{id}/resume, POST /workflows/{id}/disable, POST /workflows/{id}/runs, POST /workflows/{id}/migrate-version, GET /workflows/{id}/versions"
  - priority: 6
    category: existence
    check: "the referenced Member id resolves"
    error_id: ERR_MEMBER_NOT_FOUND
    http_status: 404
    applies_to: "POST /folders/{id}/grants"
  - priority: 7
    category: existence
    check: "the referenced Connection id resolves"
    error_id: ERR_CONNECTION_NOT_FOUND
    http_status: 404
    applies_to: "POST /connections/{id}/refresh, POST /connections/{id}/reauthorize, POST /connections/{id}/disconnect"
  - priority: 8
    category: existence
    check: "the referenced Integration id resolves"
    error_id: ERR_INTEGRATION_NOT_FOUND
    http_status: 404
    applies_to: "POST /integrations/{id}/submit, POST /integrations/{id}/review/decision, POST /integrations/{id}/versions"
  - priority: 9
    category: existence
    check: "the referenced IntegrationVersion id resolves"
    error_id: ERR_INTEGRATION_VERSION_NOT_FOUND
    http_status: 404
    applies_to: "POST /workflows/{id}/migrate-version"
  - priority: 10
    category: state
    check: "the workflow is in a state that permits the requested operation (activate requires DRAFT, pause/resume/disable per §1.2)"
    error_id: ERR_WORKFLOW_INVALID_STATE
    http_status: 409
    applies_to: "POST /workflows/{id}/activate, POST /workflows/{id}/pause, POST /workflows/{id}/resume, POST /workflows/{id}/disable"
  - priority: 11
    category: state
    check: "the action is in a state that permits replay (FAILED with no HELD sibling, or HELD with a live connection and an unconsumed refund)"
    error_id: ERR_ACTION_NOT_REPLAYABLE
    http_status: 409
    applies_to: "POST /actions/{id}/replay"
  - priority: 12
    category: state
    check: "the connection is in a state that permits the requested operation (refresh requires TOKEN_EXPIRED, reauthorize requires REAUTH_REQUIRED)"
    error_id: ERR_CONNECTION_INVALID_STATE
    http_status: 409
    applies_to: "POST /connections/{id}/refresh, POST /connections/{id}/reauthorize, POST /connections/{id}/disconnect"
  - priority: 13
    category: state
    check: "the integration is in a state that permits the decision (IN_REVIEW, or SUBMITTED which auto-sets IN_REVIEW)"
    error_id: ERR_INTEGRATION_NOT_IN_REVIEW
    http_status: 409
    applies_to: "POST /integrations/{id}/review/decision"
  - priority: 14
    category: state
    check: "the integration has no earlier review-cycle rejection in its current cycle, so resubmission requires a version bump first"
    error_id: ERR_INTEGRATION_ALREADY_REJECTED
    http_status: 409
    applies_to: "POST /integrations/{id}/submit"
  - priority: 15
    category: state
    check: "the workflow snapshot is currently MIGRATION_REQUIRED and no action of its workflow is RUNNING"
    error_id: ERR_WORKFLOW_VERSION_NOT_MIGRATABLE
    http_status: 409
    applies_to: "POST /workflows/{id}/migrate-version"
  - priority: 16
    category: business_safety
    check: "the integration's auth_method is OAUTH2 (reviewers refuse non-OAUTH2 integrations)"
    error_id: ERR_AUTH_METHOD_NOT_OAUTH2
    http_status: 422
    applies_to: "POST /integrations/{id}/submit, POST /integrations/{id}/review/decision"
  - priority: 17
    category: business_safety
    check: "the Connection.status is CONNECTED at the moment a run charge is evaluated"
    error_id: ERR_CONNECTION_TOKEN_EXPIRED
    http_status: 422
    applies_to: "POST /workflows/{id}/runs"
  - priority: 18
    category: business_fiscal
    check: "the team account's allowance is not exceeded, or the account permits overage (TeamAccount.overage_enabled == true)"
    error_id: ERR_TASK_ALLOWANCE_EXHAUSTED
    http_status: 402
    applies_to: "POST /workflows/{id}/runs, POST /_simulate/action-charge"
  - priority: 19
    category: business_constraint
    check: "folder name is unique within the account"
    error_id: ERR_DUPLICATE_FOLDER_NAME
    http_status: 409
    applies_to: "POST /folders"
  - priority: 20
    category: business_constraint
    check: "action position is unique within the workflow"
    error_id: ERR_DUPLICATE_ACTION_POSITION
    http_status: 409
    applies_to: "POST /workflows/{id}/actions"
  - priority: 21
    category: business_constraint
    check: "the integration version_number is strictly greater than the existing maximum for the integration"
    error_id: ERR_VERSION_NOT_MONOTONIC
    http_status: 409
    applies_to: "POST /integrations/{id}/versions"
  - priority: 22
    category: business_constraint
    check: "a member holds exactly one FolderGrant per folder"
    error_id: ERR_DUPLICATE_GRANT
    http_status: 409
    applies_to: "POST /folders/{id}/grants"
  - priority: 23
    category: business_temporal
    check: "the expected_account_version equals TeamAccount.version (a TeamAccount may hold at most one OPENING charge and at most one CLOSING charge per metering epoch)"
    error_id: ERR_STALE_ACCOUNT_VERSION
    http_status: 412
    applies_to: "POST /_simulate/action-charge"
  - priority: 24
    category: business_temporal
    check: "the expected_workflow_version equals Workflow.version"
    error_id: ERR_STALE_WORKFLOW_VERSION
    http_status: 412
    applies_to: "POST /workflows/{id}/migrate-version"
  - priority: 25
    category: business_referential
    check: "the referenced folder is visible to the acting member (the member holds a FolderGrant with grant_role MANAGE on the folder, or is the account OWNER)"
    error_id: ERR_FOLDER_NOT_PERMITTED
    http_status: 403
    applies_to: "POST /workflows"
  - priority: 26
    category: business_referential
    check: "every action's connection belongs to the same account as the workflow"
    error_id: ERR_CONNECTION_ACCOUNT_MISMATCH
    http_status: 422
    applies_to: "POST /workflows/{id}/actions"
  - priority: 27
    category: business_temporal
    check: "the metering epoch step named by the charge is still open (an account holds at most one OPENING and at most one CLOSING step per epoch; a repeated step collides with the earlier occupation)"
    error_id: ERR_DUPLICATE_EPOCH_STEP
    http_status: 409
    applies_to: "POST /_simulate/action-charge, POST /connections/{id}/refresh, POST /connections/{id}/reauthorize, POST /connections/{id}/disconnect"
  - priority: 28
    category: business_constraint
    check: "the connection's lifetime refresh cap is unspent (at most 5 successful refreshes across its life; the sixth refresh instead forces reauthorization)"
    error_id: ERR_TOKEN_REFRESH_CAP_EXHAUSTED
    http_status: 409
    applies_to: "POST /connections/{id}/refresh"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  - method: POST
    path: "/zapier/_clock/set_current_utc"
    description: "Set the logical lapse-incident clock. The server's startup default is exactly 2026-09-01T00:00:00Z; before any call the clock reads this default and never falls back to wall-clock time."
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: { now: datetime, event_no: integer }
    side_effects: ["appends a LapseIncident row with kind TOKEN_LAPSE and the assigned event_no; subsequent calls must be >= the current clock (never monotonic decreasing)"]

  - method: POST
    path: "/zapier/accounts"
    description: "Create a team or company account bound to a plan's allowance and overage terms."
    roles: [PlatformAdmin]
    code: 201
    input: [name, plan_code, task_allowance, "closer_cost_per_task_cents?", "opening_cost_per_task_cents?", "overage_enabled?"]
    output: TeamAccount
    side_effects: ["computes usage_pct_current = 0", "sets tasks_used_current = 0, tasks_used_previous = 0, overage_tasks_used = 0, overage_amount_cents = 0, projected_overage_amount_cents = 0"]

  - method: GET
    path: "/zapier/accounts"
    description: "List team accounts with pagination."
    roles: [PlatformAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: "TeamAccount[]"
    side_effects: []

  - method: GET
    path: "/zapier/accounts/{id}"
    description: "Read a team account's current-epoch metering state."
    roles: [Member, PlatformAdmin]
    code: 200
    input: []
    output: TeamAccount
    side_effects: ["overage_amount_cents is recomputed per the overage_base variant"]

  - method: GET
    path: "/zapier/accounts/{id}/usage"
    description: "Read the dual-variant usage report for the account's current and previous metering epochs."
    roles: [Member, PlatformAdmin]
    code: 200
    input: []
