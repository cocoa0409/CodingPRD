              payload: { amount_cents: 4297500 }
              as: AccountsPayableClerk
            - call: "GET /grower-relations/grape-contracts/${contract_id}/settlement-summary"
              as: Grower
          assert:
            - "Read 1 (graded, open): contract_cap_tons == 40.000, hard_cap_tons == 44.000 (the default 10.0 pct tolerance), cap_scope == PER_CONTRACT, delivered_contract_tons == 20.000, delivered_over_tons == 0.000, rejected_tons == 0.000, tonnage_status == OPEN, settlement_basis == LOAD_BY_LOAD"
