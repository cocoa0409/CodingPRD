      - name: biometric_asset_rejects_unknown_consent_grant_foreign_key
        claim_type: flat
        grounds: [complexity_profile.entity_topology, validations.priority_12, errors.ERR_CONSENT_GRANT_NOT_FOUND]
        distinguishing_aspect: >-
          The topology is flat, so children carry foreign keys rather than nested routes: a
          BiometricAsset naming a consent_grant_id that resolves to nothing must fail with 404
          ERR_CONSENT_GRANT_NOT_FOUND from the existence rung, even though its talent_id is valid.
        test_recipe:
