# =============================================================================
# Task 0125 — HSA/FSA Health Accounts
# Scaffold Difficulty Design (Test Targeting Index, §1.8)
#
# Cross-references §1.1–§1.7 of SCAFFOLD.yaml against the nine Difficulty Rules
# from the scaffold-generator skill §0.5. Every instance grounds in declared
# scaffold elements and includes a self-contained test_recipe reproducible
# from empty-DB state using only endpoints in §1.5.
# =============================================================================

scaffold_difficulty_design:

  # ===========================================================================
  # Rule 1 — Dual-variant calculations across different entity domains
  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: forfeiture_grace_vs_carryover_health_fsa
        grounds:
          - calculations.forfeiture_final
          - state_machines.PlanYear.ACTIVE_to_GRACE_PERIOD
          - state_machines.PlanYear.ACTIVE_to_CARRYOVER_PENDING
          - state_machines.PlanYear.GRACE_PERIOD_to_CLOSED
          - entities.PlanYear.fields.forfeited_cents
          - entities.PlanYear.fields.carryover_in_cents
          - entities.Account.fields.year_end_policy
        distinguishing_aspect: |
          Same inputs ($3,000 contributions, $2,200 claims paid, $800 leftover) produce
          different forfeitures on the HEALTH_FSA entity (PlanYear): GRACE_PERIOD variant
          forfeits all $800 after Mar 15 close, CARRYOVER variant rolls $640 forward and
          forfeits $160. Operates on the PlanYear/Account entity domain.
        test_recipe:
          setup:
            - "POST /_clock/advance to=2025-06-01T00:00:00Z"
            - "POST /account-holders -> hA (birth_date=1980-01-01, filing=SINGLE)"
            - "POST /accounts {account_holder_id=hA.id, account_type=HEALTH_FSA, year_end_policy=GRACE_PERIOD, account_holder_birth_date=1980-01-01} -> A1"
            - "POST /accounts {account_holder_id=hA.id, account_type=HEALTH_FSA, year_end_policy=CARRYOVER, account_holder_birth_date=1980-01-01} -> A2"
            - "POST /accounts/A1/plan-years {calendar_year=2025} -> Y1 (cap=320000, catch_up=0)"
            - "POST /accounts/A2/plan-years {calendar_year=2025} -> Y2 (cap=320000, catch_up=0)"
            - "POST /plan-years/Y1/contributions {amount_cents=300000, source=PAYROLL}"
            - "POST /plan-years/Y2/contributions {amount_cents=300000, source=PAYROLL}"
            - "POST /qualified-expenses {code=MED_VISIT, category=MEDICAL, eligible_account_types=[HEALTH_FSA], requires_dependent=false}"
            - "POST /accounts/A1/claims {service_date=2025-04-01, expense_code=MED_VISIT, amount_cents=220000} -> c1; POST /claims/c1/submit; POST /claims/c1/approve (different adjudicator); POST /claims/c1/pay"
            - "POST /accounts/A2/claims {service_date=2025-04-01, expense_code=MED_VISIT, amount_cents=220000} -> c2; POST /claims/c2/submit; POST /claims/c2/approve; POST /claims/c2/pay"
          trigger:
            - "POST /_clock/advance to=2026-01-02T00:00:00Z"
            - "POST /ops-runs {kind=YEAR_END_CLOSE, as_of_date=2026-01-02T00:00:00Z}"
            - "POST /_clock/advance to=2026-03-16T00:00:00Z"
            - "POST /ops-runs {kind=GRACE_PERIOD_EXPIRY, as_of_date=2026-03-16T00:00:00Z}"
          assert:
            - "GET /accounts/A1/plan-years/Y1 -> PlanYear.status == CLOSED and PlanYear.forfeited_cents == 80000"
            - "GET /accounts/A2/plan-years/Y2 -> PlanYear.status == CLOSED and PlanYear.forfeited_cents == 16000"
            - "After A2 close, if a successor PlanYear exists for 2026, successor.carryover_in_cents == 64000; otherwise Y2 was held in CARRYOVER_PENDING until expired"

      - name: tax_basis_chronological_vs_forward_looking_hsa
        grounds:
          - calculations.deduction_recapture
          - entities.Account.fields.account_type
          - entities.QualifiedExpense.fields.category
          - entities.AuditEvent.fields.occurred_at
          - endpoints[GET /accounts/{accountId}/plan-years/{planYearId}/tax-form]
        distinguishing_aspect: |
          The deduction_recapture calc operates on a different entity domain — the AuditEvent
          stream of a single Account, replayed in chronological order — and produces different
          numbers under chronological vs forward_looking modes. With inputs: $1,500 contrib at
          t1, $2,000 non-qualified paid claim at t2 (with 20% HSA penalty), $2,000 contrib at
          t3, against an HSA SELF_ONLY cap of $4,125: chronological tax_basis = $2,000.00,
          forward_looking tax_basis = $1,100.00.
        test_recipe:
          setup:
            - "POST /_clock/advance to=2025-01-01T00:00:00Z"
            - "POST /qualified-expenses {code=NON_QUAL_DISTRIB, category=NON_QUALIFIED, eligible_account_types=[HSA], requires_dependent=false}"
            - "POST /account-holders -> hA (birth_date=1980-01-01)"
            - "POST /accounts {account_holder_id=hA.id, account_type=HSA, coverage_tier=SELF_ONLY, year_end_policy=NONE, account_holder_birth_date=1980-01-01} -> A3"
            - "POST /accounts/A3/plan-years {calendar_year=2025} -> Y3 (cap=412500, catch_up=0)"
            - "POST /_clock/advance to=2025-02-01T00:00:00Z; POST /plan-years/Y3/contributions {amount_cents=150000, source=PAYROLL}"
            - "POST /_clock/advance to=2025-03-01T00:00:00Z; POST /accounts/A3/claims {service_date=2025-03-01, expense_code=NON_QUAL_DISTRIB, amount_cents=200000} -> c3; POST /claims/c3/submit; POST /claims/c3/approve (different adjudicator user_id); POST /claims/c3/pay"
            - "POST /_clock/advance to=2025-04-01T00:00:00Z; POST /plan-years/Y3/contributions {amount_cents=200000, source=PAYROLL}"
          trigger:
            - "GET /accounts/A3/plan-years/Y3/tax-form?basis=chronological -> R1"
            - "GET /accounts/A3/plan-years/Y3/tax-form?basis=forward_looking -> R2"
          assert:
            - "R1.data.tax_basis_cents == 200000 and R1.data.recapture_cents == 150000"
            - "R2.data.tax_basis_cents == 110000 and R2.data.recapture_cents == 240000"
            - "R1.data.tax_basis_cents != R2.data.tax_basis_cents"

  # ===========================================================================
  # Rule 2 — Combinatorial formulas across different modes (a/b/c)
  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:

      - name: plan_year_cap_three_input_nonlinear   # mode (a)
        grounds:
          - calculations.plan_year_cap
          - entities.Account.fields.account_type
          - entities.Account.fields.coverage_tier
          - entities.AccountHolder.fields.birth_date
          - entities.AccountHolder.fields.tax_filing_status
        distinguishing_aspect: |
          Mode (a): formula has ≥3 inputs (account_type, coverage_tier, birth_date,
          tax_filing_status, calendar_year) with non-linear branches: account_type selects
          between HSA / HEALTH_FSA / DCFSA cap tables; HSA additionally branches on
          coverage_tier and adds catch_up via age-at-Dec-31 boolean; DCFSA branches on
          tax_filing_status. Different combinations select among five distinct cap totals.
        test_recipe:
          setup:
            - "POST /_clock/advance to=2025-06-01T00:00:00Z"
            - "POST /account-holders {full_name=A, ssn_last4=0001, tax_filing_status=MARRIED_SEPARATE, birth_date=1969-06-01} -> hOld (age 56 at 2025-12-31)"
            - "POST /account-holders {full_name=B, ssn_last4=0002, tax_filing_status=SINGLE, birth_date=1980-06-01} -> hYoung"
          trigger:
            - "POST /accounts {account_holder_id=hOld.id, account_type=HSA, coverage_tier=FAMILY, year_end_policy=NONE, account_holder_birth_date=1969-06-01} -> Acc1; POST /accounts/Acc1/plan-years {calendar_year=2025} -> Y_HSA_FAM_55"
            - "POST /accounts {account_holder_id=hYoung.id, account_type=HSA, coverage_tier=SELF_ONLY, year_end_policy=NONE, account_holder_birth_date=1980-06-01} -> Acc2; POST /accounts/Acc2/plan-years {calendar_year=2025} -> Y_HSA_SELF_YOUNG"
            - "POST /accounts {account_holder_id=hOld.id, account_type=DEPENDENT_CARE_FSA, year_end_policy=NONE, account_holder_birth_date=1969-06-01} -> Acc3; POST /accounts/Acc3/plan-years {calendar_year=2025} -> Y_DCFSA_MS"
            - "POST /accounts {account_holder_id=hYoung.id, account_type=DEPENDENT_CARE_FSA, year_end_policy=NONE, account_holder_birth_date=1980-06-01} -> Acc4; POST /accounts/Acc4/plan-years {calendar_year=2025} -> Y_DCFSA_SINGLE"
          assert:
            - "Y_HSA_FAM_55.contribution_cap_cents == 830000 and Y_HSA_FAM_55.catch_up_cap_cents == 100000"
            - "Y_HSA_SELF_YOUNG.contribution_cap_cents == 412500 and Y_HSA_SELF_YOUNG.catch_up_cap_cents == 0"
            - "Y_DCFSA_MS.contribution_cap_cents == 250000 and Y_DCFSA_MS.catch_up_cap_cents == 0"
            - "Y_DCFSA_SINGLE.contribution_cap_cents == 500000 and Y_DCFSA_SINGLE.catch_up_cap_cents == 0"

      - name: chronological_tax_basis_rounding_then_clamp_order   # mode (b)
        grounds:
          - calculations.deduction_recapture
          - calculations.deduction_recapture.constants.HSA_PENALTY_RATE_BPS
        distinguishing_aspect: |
          Mode (b): nested rounding/order. Chronological replay computes
          penalty_cents = round_half_up(claim_cents * 2000 / 10000), THEN
          gross = abs(claim_cents) + penalty_cents, THEN
          applied = min(gross, available_deductible). The scaffold pins this order:
          ROUND-THEN-ADD-THEN-CLAMP. A round-after-clamp ordering produces different
          recapture for inputs that approach the deductible ceiling. Specifically, with
          claim=$333 (33300 cents) penalty = round_half_up(33300 * 0.20) = 6660;
          if instead the implementation clamped first to available_deductible=$30 (3000 cents)
          and applied 20% afterwards it would obtain 600 penalty + 3000 capped = wrong.
        test_recipe:
          setup:
            - "POST /_clock/advance to=2025-01-01T00:00:00Z"
            - "POST /qualified-expenses {code=NON_QUAL_TINY, category=NON_QUALIFIED, eligible_account_types=[HSA], requires_dependent=false}"
            - "POST /account-holders {full_name=T, ssn_last4=0003, tax_filing_status=SINGLE, birth_date=1980-01-01} -> hT"
            - "POST /accounts {account_holder_id=hT.id, account_type=HSA, coverage_tier=SELF_ONLY, year_end_policy=NONE, account_holder_birth_date=1980-01-01} -> Acc5"
            - "POST /accounts/Acc5/plan-years {calendar_year=2025} -> Y5"
            - "POST /_clock/advance to=2025-02-01T00:00:00Z; POST /plan-years/Y5/contributions {amount_cents=3000, source=PAYROLL}"
            - "POST /_clock/advance to=2025-03-01T00:00:00Z; POST /accounts/Acc5/claims {service_date=2025-03-01, expense_code=NON_QUAL_TINY, amount_cents=33300} -> cT; POST /claims/cT/submit; POST /claims/cT/approve (different adjudicator); POST /claims/cT/pay"
          trigger:
            - "GET /accounts/Acc5/plan-years/Y5/tax-form?basis=chronological -> Rt"
          assert:
            - "Rt.data.recapture_cents == 3000   # gross=33300+6660=39960 clamped to available_deductible 3000; round-then-clamp pins penalty=6660 first, then min(39960,3000)=3000"
            - "Rt.data.tax_basis_cents == 0     # all of the 3000 deductible was recaptured"

      - name: plan_year_resolution_circular_year_routing   # mode (c)
        grounds:
          - calculations.plan_year_resolution
          - state_machines.PlanYear.ACTIVE_to_GRACE_PERIOD
          - entities.PlanYear.fields.status
          - entities.Account.fields.year_end_policy
        distinguishing_aspect: |
          Mode (c): the resolution has a circular-looking dependency — a Mar 10 service_date
          can legitimately route to two PlanYears (prior-year Y in GRACE_PERIOD, or current-
          year Y+1 in ACTIVE). Naive code might consult the year of service_date directly
          (Y+1) and miss that Y is still claimable. The scaffold pins the evaluation order:
          "prior-year-in-GRACE_PERIOD wins for service_date <= Mar 15 of Y+1; otherwise
          current-year wins." The result depends on which PlanYear is consulted first,
          but the scaffold pins it.
        test_recipe:
          setup:
            - "POST /_clock/advance to=2025-06-01T00:00:00Z"
            - "POST /account-holders {full_name=R, ssn_last4=0004, tax_filing_status=SINGLE, birth_date=1980-01-01} -> hR"
            - "POST /accounts {account_holder_id=hR.id, account_type=HEALTH_FSA, year_end_policy=GRACE_PERIOD, account_holder_birth_date=1980-01-01} -> AccR"
            - "POST /accounts/AccR/plan-years {calendar_year=2025} -> Y2025 (cap=320000)"
            - "POST /plan-years/Y2025/contributions {amount_cents=100000, source=PAYROLL}"
            - "POST /qualified-expenses {code=MED_VISIT_R, category=MEDICAL, eligible_account_types=[HEALTH_FSA], requires_dependent=false}"
            - "POST /_clock/advance to=2026-01-02T00:00:00Z; POST /ops-runs {kind=YEAR_END_CLOSE, as_of_date=2026-01-02T00:00:00Z}  # Y2025 enters GRACE_PERIOD"
            - "POST /accounts/AccR/plan-years {calendar_year=2026} -> Y2026 (cap=320000)"
            - "POST /plan-years/Y2026/contributions {amount_cents=50000, source=PAYROLL}"
          trigger:
            - "POST /_clock/advance to=2026-03-10T00:00:00Z"
            - "POST /accounts/AccR/claims {service_date=2026-03-10T00:00:00Z, expense_code=MED_VISIT_R, amount_cents=30000} -> cR"
            - "POST /claims/cR/submit"
          assert:
            - "GET /claims/cR -> Claim.plan_year_id == Y2025.id  # prior-year wins for Mar 10 service_date"
            - "After approve + pay: GET /accounts/AccR/plan-years/Y2025 -> claims_paid_ytd_cents == 30000"
            - "GET /accounts/AccR/plan-years/Y2026 -> claims_paid_ytd_cents == 0"

  # ===========================================================================
  # Rule 3 — Non-linear state-machine shape on different entities
  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:

      - name: claim_branching_with_reversal
        grounds:
          - state_machines.Claim
          - state_machines.Claim.SUBMITTED_to_DENIED
          - state_machines.Claim.APPROVED_to_DENIED
          - state_machines.Claim.PAID_to_REVERSED
        distinguishing_aspect: |
          Claim state machine is a fork-join with a reversal branch:
          DRAFT -> SUBMITTED -> {APPROVED, DENIED}; APPROVED -> {PAID, DENIED}; PAID -> REVERSED.
          PAID is not terminal-by-state because REVERSED is reachable, and the reverse
          transition carries different side-effects (balance credit + audit twin) than
          the forward path. Operates on the Claim entity.
        test_recipe:
          setup:
            - "POST /_clock/advance to=2025-06-01T00:00:00Z"
            - "Provision an HSA account A with PlanYear Y, contribute $1,000 (100000 cents); seed QualifiedExpense MED_X for HSA"
            - "POST /accounts/A/claims {service_date=2025-06-01, expense_code=MED_X, amount_cents=20000} -> c"
            - "POST /claims/c/submit (adjudicator userA via headers); POST /claims/c/approve (adjudicator userB); POST /claims/c/pay (adjudicator userB)"
          trigger:
            - "POST /claims/c/reverse (adjudicator userB)"
          assert:
            - "GET /claims/c -> Claim.status == REVERSED"
            - "GET /accounts/A/plan-years/Y -> claims_paid_ytd_cents == 0 (was 20000 before reversal)"
            - "GET /accounts/A/claims includes the twin Claim with reversed_from_id == c.id"

      - name: plan_year_branching_close_paths
        grounds:
          - state_machines.PlanYear
          - state_machines.PlanYear.ACTIVE_to_GRACE_PERIOD
          - state_machines.PlanYear.ACTIVE_to_CARRYOVER_PENDING
          - state_machines.PlanYear.ACTIVE_to_CLOSED
          - state_machines.PlanYear.CARRYOVER_PENDING_to_CLOSED
        distinguishing_aspect: |
          PlanYear has fork-join branching at year-end with divergent side effects per branch:
          ACTIVE -> {GRACE_PERIOD, CARRYOVER_PENDING, CLOSED}; CARRYOVER_PENDING also branches
          on whether a successor PlanYear exists. Each branch has materially different
          side-effects (carryover credit to successor vs full forfeiture). Distinct entity
          from Claim.
        test_recipe:
          setup:
            - "POST /_clock/advance to=2025-06-01T00:00:00Z"
            - "Create three HEALTH_FSA accounts with year_end_policy = NONE, GRACE_PERIOD, CARRYOVER respectively"
            - "Open PlanYear 2025 on each; contribute $1,000; pay $400 of qualified claim on each"
          trigger:
            - "POST /_clock/advance to=2026-01-02T00:00:00Z"
            - "POST /ops-runs {kind=YEAR_END_CLOSE, as_of_date=2026-01-02T00:00:00Z}"
          assert:
            - "NONE-account's Y2025.status == CLOSED, forfeited_cents == 60000"
            - "GRACE_PERIOD-account's Y2025.status == GRACE_PERIOD, forfeited_cents == 0 (not yet computed)"
            - "CARRYOVER-account's Y2025.status == CARRYOVER_PENDING, forfeited_cents == 0 (not yet computed)"

  # ===========================================================================
  # Rule 4 — Transitive cascade chains from different triggers
  # ===========================================================================
  - rule_id: transitive_cascade
    instances:

      - name: year_end_close_to_carryover_to_successor   # depth >= 3
        grounds:
          - state_machines.PlanYear.ACTIVE_to_CARRYOVER_PENDING
          - state_machines.PlanYear.CARRYOVER_PENDING_to_CLOSED
          - entities.PlanYear.fields.carryover_in_cents
          - entities.AuditEvent.fields.event_type
        distinguishing_aspect: |
          Triggered by POST /ops-runs (YEAR_END_CLOSE) on a CARRYOVER-policy HEALTH_FSA:
          Step 1: OpsRun executes → PlanYear Y2025 transitions ACTIVE -> CARRYOVER_PENDING.
          Step 2 (caused by Step 1, not by the OpsRun): A subsequent POST /accounts/A/plan-years
                  for calendar_year=2026 IS the user-initiated trigger BUT the side-effect that
                  moves carryover to the new PlanYear AND closes Y2025 is caused by Step 1's
                  CARRYOVER_PENDING state, not by the OpsRun directly.
          Step 3 (caused by Step 2): The new PlanYear Y2026 starts with carryover_in_cents > 0,
                  which then alters available_balance for future Claim /pay calls — a third-
                  order effect chained through the first two.
          Chain depth = 3, originated by the OpsRun trigger.
        test_recipe:
          setup:
            - "POST /_clock/advance to=2025-06-01T00:00:00Z"
            - "Open HEALTH_FSA account A with year_end_policy=CARRYOVER, PlanYear Y2025, contribute $1,000 (100000 cents), pay $200 (20000 cents) of qualified MED claim. Leftover = 80000."
          trigger:
            - "POST /_clock/advance to=2026-01-02T00:00:00Z"
            - "POST /ops-runs {kind=YEAR_END_CLOSE, as_of_date=2026-01-02T00:00:00Z}  # step 1: Y2025 -> CARRYOVER_PENDING"
            - "POST /accounts/A/plan-years {calendar_year=2026} -> Y2026  # step 2: Y2025 -> CLOSED, Y2026.carryover_in_cents = min(80000, 64000) = 64000"
            - "Pay a $700 (70000 cents) qualified claim against Y2026  # step 3: drawdown order consumes 64000 of carryover + 6000 of current-year contributions"
          assert:
            - "After step 1: Y2025.status == CARRYOVER_PENDING"
            - "After step 2: Y2025.status == CLOSED, Y2025.forfeited_cents == 16000 (80000 - 64000); Y2026.carryover_in_cents == 64000"
            - "After step 3: Y2026.claims_paid_ytd_cents == 70000, Y2026.carryover_consumed_cents == 64000  # the third-order side effect"

      - name: contribution_reversal_to_balance_to_audit_invariant   # depth >= 2
        grounds:
          - state_machines.Contribution.POSTED_to_REVERSED
          - entities.PlanYear.fields.contributions_ytd_cents
          - calculations.audit_trail_completeness
          - entities.AuditEvent.fields.cents_delta
        distinguishing_aspect: |
          Triggered by POST /contributions/{id}/reverse:
          Step 1: Original Contribution.status -> REVERSED; reversing Contribution row appended;
                  PlanYear.contributions_ytd_cents -= original amount (caused by Step 1's state
                  flip + side-effect contract, not directly by the PlanAdministrator's request).
          Step 2 (caused by Step 1): A new AuditEvent CONTRIBUTION_REVERSED is appended with
                  cents_delta = -amount; calc audit_trail_completeness invariant must hold —
                  i.e., sum of all cents_deltas for the PlanYear MUST equal
                  (contributions_ytd_cents - claims_paid_ytd_cents). GET /audit-events
                  enforces this and rejects if the chain broke.
          Chain depth = 2 (state flip → derived counter → audit invariant). Distinct trigger
          from the OpsRun cascade above.
        test_recipe:
          setup:
            - "POST /_clock/advance to=2025-06-01T00:00:00Z"
            - "Open HSA account A (SELF_ONLY), PlanYear Y, contribute $500 (50000 cents). Y.contributions_ytd = 50000."
          trigger:
            - "POST /contributions/<contribId>/reverse"
            - "GET /accounts/A/audit-events"
          assert:
            - "Y.contributions_ytd_cents == 0 after reversal  # Step 1 propagation"
            - "Sum of cents_delta over CONTRIBUTION_POSTED + CONTRIBUTION_REVERSED for Y == 0  # Step 2 invariant"
            - "GET /accounts/A/audit-events returns 200 (audit_trail_completeness invariant holds)"

  # ===========================================================================
  # Rule 5 — Validation priority conflicts across different error-category pairs
  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:

      - name: state_vs_business_fiscal_pay_on_closed_with_insufficient
        grounds:
          - validations[priority=6]   # ERR_PLAN_YEAR_NOT_CLAIMABLE (state)
          - validations[priority=13]  # ERR_INSUFFICIENT_BALANCE (business_fiscal)
          - state_machines.PlanYear.GRACE_PERIOD_to_CLOSED
        distinguishing_aspect: |
          Pair: state (priority 6) vs business_fiscal (priority 13). A /pay request against
          a Claim whose resolved PlanYear is CLOSED AND whose amount exceeds available_balance
          should return ERR_PLAN_YEAR_NOT_CLAIMABLE (state wins because it has lower priority
          number), NOT ERR_INSUFFICIENT_BALANCE. Different error-category pair from instance 2.
        test_recipe:
          setup:
            - "POST /_clock/advance to=2025-06-01T00:00:00Z"
            - "Open HEALTH_FSA account A year_end_policy=NONE, PlanYear Y2025 cap=320000"
            - "Contribute $100 (10000 cents) — small balance to engineer insufficient-balance"
            - "Create a $500 (50000 cents) MED claim c, submit it, approve it (different adjudicator)"
            - "POST /_clock/advance to=2026-01-02T00:00:00Z; POST /ops-runs YEAR_END_CLOSE  # Y2025 -> CLOSED (NONE policy)"
          trigger:
            - "POST /claims/c/pay"
          assert:
            - "Response.status == 409 and Response.data.error_id == ERR_PLAN_YEAR_NOT_CLAIMABLE  # state wins over fiscal"

      - name: business_safety_vs_business_referential_segregation_on_inactive_dep
        grounds:
          - validations[priority=7]    # ERR_SEGREGATION_OF_DUTIES (business_safety)
          - validations[priority=9.5]  # ERR_DEPENDENT_INACTIVE (business_referential)
        distinguishing_aspect: |
          Pair: business_safety (priority 7) vs business_referential (priority 9.5). Submit
          a DCFSA Claim citing an INACTIVE Dependent while ALSO violating SoD (same user_id
          submitted and tries to approve). Priority 7 wins: ERR_SEGREGATION_OF_DUTIES, not
          ERR_DEPENDENT_INACTIVE. Different category pair from the state vs fiscal instance.
        test_recipe:
          setup:
            - "Provision DCFSA account A for AccountHolder hA; PlanYear Y; Dependent d (status=ACTIVE)"
            - "Seed QualifiedExpense DC_CARE with requires_dependent=true, eligible_account_types=[DEPENDENT_CARE_FSA]"
            - "POST /accounts/A/claims {service_date=..., expense_code=DC_CARE, amount_cents=10000, dependent_id=d.id} -> c"
            - "POST /claims/c/submit  (X-User-Role=AccountHolder, X-User-ID=hA.id)"
            - "POST /dependents/d/deactivate  (admin)"
          trigger:
            - "POST /claims/c/approve  (X-User-Role=ClaimAdjudicator, X-User-ID = the same id used at submit)"
          assert:
            - "Response.status == 403 and Response.data.error_id == ERR_SEGREGATION_OF_DUTIES  # priority 7 beats 9.5"

  # ===========================================================================
  # Rule 6 — Boundary-precision checks on different metrics/endpoints
  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:

      - name: contribution_cap_at_exact_limit_endpoint
        grounds:
          - validations[priority=12]  # ERR_CONTRIBUTION_CAP_EXCEEDED
          - calculations.plan_year_cap
          - endpoints[POST /plan-years/{planYearId}/contributions]
        distinguishing_aspect: |
          Numeric threshold boundary on POST /plan-years/{planYearId}/contributions. The cap
          check is `contributions_ytd + amount > cap + catch_up` (strict greater-than). A
          contribution that lands the YTD exactly on the cap MUST succeed; one cent more MUST
          fail. HSA SELF_ONLY cap = 412500. First contribution 412500 succeeds. Second
          contribution of 1 cent fails.
        test_recipe:
          setup:
            - "Provision HSA SELF_ONLY account A (no catch-up), PlanYear Y2025"
          trigger:
            - "POST /plan-years/Y/contributions {amount_cents=412500, source=PAYROLL} -> 201"
            - "POST /plan-years/Y/contributions {amount_cents=1, source=PAYROLL} -> 422"
          assert:
            - "First response code == 201; Y.contributions_ytd_cents == 412500 == cap"
            - "Second response code == 422 and error_id == ERR_CONTRIBUTION_CAP_EXCEEDED"

      - name: grace_period_service_date_inclusive_boundary
        grounds:
          - calculations.plan_year_resolution
          - validations[priority=10]  # ERR_NO_ELIGIBLE_PLAN_YEAR
          - endpoints[POST /claims/{claimId}/submit]
        distinguishing_aspect: |
          Empty-set boundary on a different metric (date interval) and different endpoint
          (POST /claims/{id}/submit). The grace-period window is inclusive at both ends:
          service_date = 2026-03-15T00:00:00Z routes to prior-year Y in GRACE_PERIOD;
          service_date = 2026-03-16T00:00:00Z does NOT. With no successor PlanYear Y+1
          in ACTIVE, the latter resolves to an empty PlanYear set and fails with
          ERR_NO_ELIGIBLE_PLAN_YEAR (a zero-element candidate set, not a numeric overflow).
        test_recipe:
          setup:
            - "Provision HEALTH_FSA account A year_end_policy=GRACE_PERIOD, PlanYear Y2025, contribute $1,000, do NOT open Y2026"
            - "POST /_clock/advance to=2026-01-02T00:00:00Z; POST /ops-runs YEAR_END_CLOSE  # Y2025 -> GRACE_PERIOD"
            - "POST /_clock/advance to=2026-03-20T00:00:00Z"
            - "Seed QualifiedExpense MED_GP for HEALTH_FSA"
          trigger:
            - "POST /accounts/A/claims {service_date=2026-03-15T00:00:00Z, expense_code=MED_GP, amount_cents=5000} -> c1; POST /claims/c1/submit  # boundary inclusive — succeeds"
            - "POST /accounts/A/claims {service_date=2026-03-16T00:00:00Z, expense_code=MED_GP, amount_cents=5000} -> c2; POST /claims/c2/submit  # one day past — fails"
          assert:
            - "c1.submit response code == 200; GET /claims/c1 -> plan_year_id == Y2025.id"
            - "c2.submit response code == 422 and error_id == ERR_NO_ELIGIBLE_PLAN_YEAR"

  # ===========================================================================
  # Rule 7 — Cross-entity state dependencies across different entity pairs
  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:

      - name: claim_submit_blocked_when_dependent_inactive
        grounds:
          - state_machines.Claim.DRAFT_to_SUBMITTED
          - entities.Dependent.fields.status
          - validations[priority=9.5]   # ERR_DEPENDENT_INACTIVE
        distinguishing_aspect: |
          Entity pair: Claim → Dependent. Claim's DRAFT->SUBMITTED transition depends on the
          state of a different entity (the cited Dependent). When Dependent.status == INACTIVE
          the transition fails even though Claim itself is in DRAFT.
        test_recipe:
          setup:
            - "Provision DCFSA account A, PlanYear Y, Dependent d (ACTIVE), seed QualifiedExpense DC_CARE (requires_dependent=true)"
            - "POST /accounts/A/claims {service_date=..., expense_code=DC_CARE, amount_cents=10000, dependent_id=d.id} -> c"
            - "POST /dependents/d/deactivate"
          trigger:
            - "POST /claims/c/submit"
          assert:
            - "Response.status == 409 and Response.data.error_id == ERR_DEPENDENT_INACTIVE"
            - "GET /claims/c -> Claim.status == DRAFT (no transition occurred)"

      - name: account_close_blocked_when_plan_year_active
        grounds:
          - state_machines.Account.OPEN_to_CLOSED
          - entities.PlanYear.fields.status
          - validations[priority=4]  # the state precondition
        distinguishing_aspect: |
          Different entity pair: Account → PlanYear (not Claim → Dependent). Account's
          OPEN/FROZEN -> CLOSED transition depends on every child PlanYear being in CLOSED.
          A single ACTIVE/GRACE_PERIOD/CARRYOVER_PENDING PlanYear blocks the parent close.
        test_recipe:
          setup:
            - "Provision HEALTH_FSA account A with an ACTIVE PlanYear Y2025"
          trigger:
            - "POST /accounts/A/close"
          assert:
            - "Response.status == 409 and Response.data.error_id == ERR_ACCOUNT_HAS_OPEN_PLAN_YEAR"
            - "GET /accounts/A -> Account.status == OPEN (unchanged)"

  # ===========================================================================
  # Rule 8 — Resource temporal-overlap conflicts across different interval semantics
  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:

      - name: plan_year_calendar_year_uniqueness_per_account
        grounds:
          - validations[priority=11]  # ERR_DUPLICATE_PLAN_YEAR
          - entities.PlanYear.fields.calendar_year
        distinguishing_aspect: |
          Interval semantics: integer-keyed disjoint discrete intervals on the Account
          resource. Two PlanYears with the same calendar_year on the same Account would
          have identical 1-year buckets and overlap perfectly — rejected. Adjacency
          (calendar_year=2025 + calendar_year=2026) is FINE — buckets are touching but
          not overlapping. Geometric treatment is "exact discrete equality wins".
        test_recipe:
          setup:
            - "Provision HSA account A"
            - "POST /accounts/A/plan-years {calendar_year=2025} -> 201"
            - "POST /accounts/A/plan-years {calendar_year=2026} -> 201  # adjacency allowed"
          trigger:
            - "POST /accounts/A/plan-years {calendar_year=2025}  # duplicate"
          assert:
            - "Response.status == 409 and Response.data.error_id == ERR_DUPLICATE_PLAN_YEAR"
            - "Adjacency case (2025 + 2026) succeeded — distinct from the overlap case"

      - name: ops_run_monotonic_as_of_date_on_clock_resource
        grounds:
          - validations[priority=15]  # ERR_DUPLICATE_OPS_RUN (exact-equality interval)
          - validations[priority=16]  # ERR_OPS_RUN_NOT_MONOTONIC (strict-greater-than interval)
          - entities.OpsRun.fields.as_of_date
        distinguishing_aspect: |
          Different resource (OpsRun ledger, distinct from PlanYear) and different interval
          semantics: continuous monotonic points on a half-open future ray. The rule is
          stricter than PlanYear's discrete-equality: an OpsRun's as_of_date must be STRICTLY
          GREATER than every prior OpsRun's as_of_date. Exact equality is ALSO disallowed
          (ERR_DUPLICATE_OPS_RUN on (kind, as_of_date)), and any earlier point is rejected
          with ERR_OPS_RUN_NOT_MONOTONIC. Two distinct rejection reasons for two distinct
          orderings — quite unlike the PlanYear case which only rejects equality.
        test_recipe:
          setup:
            - "POST /_clock/advance to=2026-06-01T00:00:00Z"
            - "POST /ops-runs {kind=YEAR_END_CLOSE, as_of_date=2026-01-02T00:00:00Z} -> 201  # first run"
          trigger:
            - "POST /ops-runs {kind=YEAR_END_CLOSE, as_of_date=2026-01-02T00:00:00Z}  # exact duplicate"
            - "POST /ops-runs {kind=YEAR_END_CLOSE, as_of_date=2025-12-31T00:00:00Z}  # earlier"
          assert:
            - "Duplicate case: 409 ERR_DUPLICATE_OPS_RUN"
            - "Earlier case: 409 ERR_OPS_RUN_NOT_MONOTONIC"

  # ===========================================================================
  # Rule 9 — Compensating-action invariants across different conserved quantities
  # ===========================================================================
  - rule_id: compensating_invariant
    instances:

      - name: contribution_post_then_reverse_balances_to_zero
        grounds:
          - state_machines.Contribution.PENDING_to_POSTED
          - state_machines.Contribution.POSTED_to_REVERSED
          - entities.PlanYear.fields.contributions_ytd_cents
          - calculations.audit_trail_completeness
        distinguishing_aspect: |
          Conserved quantity: PlanYear.contributions_ytd_cents (a monetary stock).
          Invariant: for any sequence ending with a /reverse of every POSTED contribution,
          PlanYear.contributions_ytd_cents MUST equal 0, AND
          sum(AuditEvent.cents_delta for event_type in {CONTRIBUTION_POSTED,
              CONTRIBUTION_REVERSED} on this PlanYear) MUST equal 0.
          Pinned as:
            contributions_ytd_cents == sum_over_active_POSTED(amount_cents)
                                     - sum_over_REVERSED(amount_cents)
        test_recipe:
          setup:
            - "Provision HSA SELF_ONLY account A, PlanYear Y"
            - "POST /plan-years/Y/contributions {amount_cents=20000, source=PAYROLL} -> c1"
            - "POST /plan-years/Y/contributions {amount_cents=50000, source=DIRECT} -> c2"
          trigger:
            - "POST /contributions/c1/reverse"
            - "POST /contributions/c2/reverse"
          assert:
            - "Y.contributions_ytd_cents == 0  # named conserved quantity returns to baseline"
            - "Sum of cents_delta over CONTRIBUTION_POSTED + CONTRIBUTION_REVERSED on Y == 0"

      - name: claim_pay_then_reverse_preserves_carryover_consumed_invariant
        grounds:
          - state_machines.Claim.APPROVED_to_PAID
          - state_machines.Claim.PAID_to_REVERSED
          - calculations.carryover_drawdown_order
          - entities.PlanYear.fields.carryover_consumed_cents
          - entities.PlanYear.fields.claims_paid_ytd_cents
        distinguishing_aspect: |
          Different conserved quantity from instance 1 — the JOINT vector
          (claims_paid_ytd_cents, carryover_consumed_cents). Invariant: for any sequence
          of /pay followed by /reverse on the SAME Claim, both fields MUST return to their
          pre-pay values. Pinned as:
            after_pay.claims_paid_ytd - after_reverse.claims_paid_ytd == 0 AND
            after_pay.carryover_consumed - after_reverse.carryover_consumed == 0
          The drawdown undo runs in LIFO order against the forward drawdown, otherwise a
          subsequent reversal of a different claim would leave drift.
        test_recipe:
          setup:
            - "Provision HEALTH_FSA account A with year_end_policy=CARRYOVER. PlanYear Y2026 set up with carryover_in_cents=50000 (by closing Y2025 carryover, $500), and contributions_ytd=100000 ($1,000 current year). Total available = 150000."
            - "Seed MED expense; pay a claim of $1,200 (120000 cents) — drawdown: from current 100000, from carryover 20000. Now claims_paid_ytd=120000, carryover_consumed=20000."
          trigger:
            - "POST /claims/<claim>/reverse"
          assert:
            - "After reverse: Y.claims_paid_ytd_cents == 0"
            - "After reverse: Y.carryover_consumed_cents == 0"
            - "Available balance restored to 150000; carryover_in_cents still 50000"
