scaffold_corner_design:
  # ===================================================================
  # Section: entities
  # ===================================================================
  - section: entities
    instances:
      - name: program_creation_applies_declared_defaults
        claim_type: defaults
        grounds: [entities.Program]
        distinguishing_aspect: "Creating a Program with only `name` yields every threshold/fee field at its declared default (n400_fee_cents 76000, mock_buffer_minutes 15, promotion_offer_hours 72) with version 1."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls:
            - call: "POST /naturalization/programs"
              payload: { name: "Main" }
              as: ProgramAdmin
              captures: { prog_id: $.data.id, prog_v: $.data.version }
          trigger:
            - call: "GET /naturalization/programs/current"
              payload: {}
              as: ProgramAdmin
          assert:
            - "Program.${prog_id}.n400_fee_cents == 76000 AND biometric_fee_cents == 8501 AND translation_stipend_cents == 3001"
            - "poverty_base_cents == 1565000 AND full_waiver_threshold_pct == 150 AND partial_waiver_threshold_pct == 200"
            - "attendance_complete_bp == 8000 AND readiness_certify_threshold == 70 AND rfe_deadline_days == 84 AND mock_max_attempts == 3"
            - "version == 1 and id is a bare UUID (no type prefix)"

      - name: program_second_create_rejected_singleton
        claim_type: violation_to_error
        grounds: ["entities.Program", "errors[ERR_PROGRAM_EXISTS]", "validations[priority=13]"]
        distinguishing_aspect: "The Program is a singleton: a second POST /naturalization/programs fails with ERR_PROGRAM_EXISTS 409."
        test_recipe:
          setup: ["one Program exists"]
          setup_api_calls:
            - { call: "POST /naturalization/programs", payload: { name: "Main" }, as: ProgramAdmin }
          trigger:
            - call: "POST /naturalization/programs"
              payload: { name: "Second" }
              as: ProgramAdmin
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_PROGRAM_EXISTS, http 409"

      - name: applicant_creation_initial_state_and_system_fields
        claim_type: creation
        grounds: [entities.Applicant, state_machines.Applicant]
        distinguishing_aspect: "New applicant starts REGISTERED with voter_registration_referred false and current_screening_id null; server-minted id/created_at; caller cannot set stage."
        test_recipe:
          setup: ["program exists"]
          setup_api_calls:
            - { call: "POST /naturalization/programs", payload: { name: "Main" }, as: ProgramAdmin }
          trigger:
            - call: "POST /naturalization/applicants"
              payload: { full_name: "New Person", email: "np@x.com", date_of_birth: "1990-05-05" }
              as: IntakeCoordinator
              captures: { app_id: $.data.id }
          assert:
            - "Applicant.${app_id}.stage == REGISTERED"
            - "voter_registration_referred == false AND current_screening_id == null"
            - "version == 1; preferred_language defaulted to 'en'"

      - name: applicant_missing_required_email_returns_invalid_request
        claim_type: required_fields
        grounds: ["entities.Applicant.fields.email", "errors[ERR_INVALID_REQUEST]", "validations[priority=1]"]
        distinguishing_aspect: "POST /naturalization/applicants without `email` fails with ERR_INVALID_REQUEST 400 before any state is written."
        test_recipe:
          setup: ["program exists"]
          setup_api_calls:
            - { call: "POST /naturalization/programs", payload: { name: "Main" }, as: ProgramAdmin }
          trigger:
            - call: "POST /naturalization/applicants"
              payload: { full_name: "No Email" }
              as: IntakeCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_REQUEST, http 400"

      - name: get_nonexistent_applicant_returns_not_found
        claim_type: not_found
        grounds: ["errors[ERR_NOT_FOUND]", "validations[priority=4]"]
        distinguishing_aspect: "GET with a well-formed but absent UUID yields ERR_NOT_FOUND 404."
        test_recipe:
          setup: ["program exists"]
          setup_api_calls:
            - { call: "POST /naturalization/programs", payload: { name: "Main" }, as: ProgramAdmin }
          trigger:
            - call: "GET /naturalization/applicants/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              payload: {}
              as: IntakeCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_NOT_FOUND, http 404"

      - name: screening_invalid_request_english_level_out_of_range
        claim_type: type_constraints
        grounds: ["entities.Screening.fields.english_level", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "english_level 5 violates the declared 0..4 range -> ERR_INVALID_REQUEST 400."
        test_recipe:
          setup: ["program + applicant exist"]
          setup_api_calls:
            - { call: "POST /naturalization/programs", payload: { name: "Main" }, as: ProgramAdmin }
            - call: "POST /naturalization/applicants"
              payload: { full_name: "A One", email: "a@x.com", date_of_birth: "1990-01-01" }
              as: IntakeCoordinator
              captures: { app_id: $.data.id, app_v: $.data.version }
          trigger:
            - call: "POST /naturalization/applicants/${app_id}/screenings"
              payload: { expected_applicant_version: "${app_v}", marital_to_citizen: false, lpr_months: 80, continuous_residence_months: 61, physical_presence_days: 1000, age_years: 36, english_level: 5, civics_practice_pct: 50, has_legal_flag: false }
              as: IntakeCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_REQUEST, http 400"

      - name: attendance_record_immutable_event_shape
        claim_type: immutability
        grounds: [entities.AttendanceRecord]
        distinguishing_aspect: "AttendanceRecord has common_fields false: creation response carries id and created_at but no version/updated_at, and no update endpoint exists for it."
        test_recipe:
          setup: ["section cap 2 total_sessions 10; one ENROLLED enrollment"]
          setup_api_calls:
            - { call: "POST /naturalization/programs", payload: { name: "Main" }, as: ProgramAdmin }
            - call: "POST /naturalization/volunteers"
              payload: { full_name: "Inst", email: "i@x.com", background_check_cleared: true }
              as: ProgramAdmin
              captures: { vol_id: $.data.id }
            - { call: "POST /naturalization/volunteers/${vol_id}/training-credits", payload: { topic: "civics", hours: 10, earned_at: "2026-07-01T00:00:00Z" }, as: ProgramAdmin }
            - { call: "POST /naturalization/volunteers/${vol_id}/accredit", payload: { target_level: GENERAL }, as: ProgramAdmin }
            - call: "POST /naturalization/class-sections"
              payload: { title: "T", weekday: "MON", start_minute: 600, end_minute: 660, room_id: "R1", instructor_volunteer_id: "${vol_id}", capacity: 2, total_sessions: 10 }
              as: ProgramAdmin
              captures: { sec_id: $.data.id, sec_v: $.data.version }
            - call: "POST /naturalization/applicants"
              payload: { full_name: "A One", email: "a@x.com", date_of_birth: "1990-01-01" }
              as: IntakeCoordinator
              captures: { app_id: $.data.id, app_v: $.data.version }
            - call: "POST /naturalization/applicants/${app_id}/screenings"
              payload: { expected_applicant_version: "${app_v}", marital_to_citizen: false, lpr_months: 80, continuous_residence_months: 61, physical_presence_days: 1000, age_years: 36, english_level: 2, civics_practice_pct: 50, has_legal_flag: false }
              as: IntakeCoordinator
            - call: "POST /naturalization/enrollments"
              payload: { applicant_id: "${app_id}", class_section_id: "${sec_id}", expected_section_version: "${sec_v}" }
              as: IntakeCoordinator
              captures: { enr_id: $.data.id }
          trigger:
            - call: "POST /naturalization/enrollments/${enr_id}/attendance-records"
              payload: { session_index: 1, outcome: PRESENT }
              as: Volunteer
              as_user_id: "${vol_id}"
              captures: { rec_id: $.data.id }
          assert:
            - "response data contains id and created_at"
            - "response data has no version key and no updated_at key (common_fields: false)"

      - name: enrollment_computed_attendance_bp_input_ignored
        claim_type: computed_fields
        grounds: [entities.Enrollment.fields.attendance_bp]
        distinguishing_aspect: "A caller-supplied attendance_bp in the create payload is ignored; the new enrollment computes attendance_bp 0 and records_count 0."
        test_recipe:
          setup: ["section + eligible applicant ready"]
          setup_api_calls:
            - { call: "POST /naturalization/programs", payload: { name: "Main" }, as: ProgramAdmin }
            - call: "POST /naturalization/volunteers"
              payload: { full_name: "Inst", email: "i@x.com", background_check_cleared: true }
              as: ProgramAdmin
              captures: { vol_id: $.data.id }
            - { call: "POST /naturalization/volunteers/${vol_id}/training-credits", payload: { topic: "civics", hours: 10, earned_at: "2026-07-01T00:00:00Z" }, as: ProgramAdmin }
            - { call: "POST /naturalization/volunteers/${vol_id}/accredit", payload: { target_level: GENERAL }, as: ProgramAdmin }
            - call: "POST /naturalization/class-sections"
              payload: { title: "T", weekday: "MON", start_minute: 600, end_minute: 660, room_id: "R1", instructor_volunteer_id: "${vol_id}", capacity: 2, total_sessions: 10 }
              as: ProgramAdmin
              captures: { sec_id: $.data.id, sec_v: $.data.version }
            - call: "POST /naturalization/applicants"
              payload: { full_name: "A One", email: "a@x.com", date_of_birth: "1990-01-01" }
              as: IntakeCoordinator
              captures: { app_id: $.data.id, app_v: $.data.version }
            - call: "POST /naturalization/applicants/${app_id}/screenings"
              payload: { expected_applicant_version: "${app_v}", marital_to_citizen: false, lpr_months: 80, continuous_residence_months: 61, physical_presence_days: 1000, age_years: 36, english_level: 2, civics_practice_pct: 50, has_legal_flag: false }
              as: IntakeCoordinator
          trigger:
            - call: "POST /naturalization/enrollments"
              payload: { applicant_id: "${app_id}", class_section_id: "${sec_id}", expected_section_version: "${sec_v}", attendance_bp: 9999 }
              as: IntakeCoordinator
              captures: { enr_id: $.data.id }
          assert:
            - "Enrollment.${enr_id}.attendance_bp == 0 (caller input ignored)"
            - "Enrollment.${enr_id}.records_count == 0 AND status == ENROLLED"

  # ===================================================================
  # Section: state_machines
  # ===================================================================
  - section: state_machines
    instances:
      - name: withdraw_completed_enrollment_rejected
        claim_type: invalid_transition
        grounds: ["state_machines.Enrollment", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Terminal lockdown: a COMPLETED enrollment rejects withdraw with ERR_INVALID_STATE and no seat-ledger change."
        test_recipe:
          setup: ["section total_sessions 2 (midterm point 1); enrollment with 2 PRESENT records -> 10000 bp -> COMPLETED"]
          setup_api_calls:
            - { call: "POST /naturalization/programs", payload: { name: "Main" }, as: ProgramAdmin }
            - call: "POST /naturalization/volunteers"
              payload: { full_name: "Inst", email: "i@x.com", background_check_cleared: true }
              as: ProgramAdmin
              captures: { vol_id: $.data.id }
            - { call: "POST /naturalization/volunteers/${vol_id}/training-credits", payload: { topic: "civics", hours: 10, earned_at: "2026-07-01T00:00:00Z" }, as: ProgramAdmin }
            - { call: "POST /naturalization/volunteers/${vol_id}/accredit", payload: { target_level: GENERAL }, as: ProgramAdmin }
            - call: "POST /naturalization/class-sections"
              payload: { title: "Short", weekday: "TUE", start_minute: 600, end_minute: 660, room_id: "R4", instructor_volunteer_id: "${vol_id}", capacity: 2, total_sessions: 2 }
              as: ProgramAdmin
              captures: { sec_id: $.data.id, sec_v: $.data.version }
            - call: "POST /naturalization/applicants"
              payload: { full_name: "A One", email: "a@x.com", date_of_birth: "1990-01-01" }
              as: IntakeCoordinator
              captures: { app_id: $.data.id, app_v: $.data.version }
            - call: "POST /naturalization/applicants/${app_id}/screenings"
              payload: { expected_applicant_version: "${app_v}", marital_to_citizen: false, lpr_months: 80, continuous_residence_months: 61, physical_presence_days: 1000, age_years: 36, english_level: 2, civics_practice_pct: 50, has_legal_flag: false }
              as: IntakeCoordinator
            - call: "POST /naturalization/enrollments"
              payload: { applicant_id: "${app_id}", class_section_id: "${sec_id}", expected_section_version: "${sec_v}" }
              as: IntakeCoordinator
              captures: { enr_id: $.data.id }
            - { call: "POST /naturalization/enrollments/${enr_id}/attendance-records", payload: { session_index: 1, outcome: PRESENT }, as: Volunteer, as_user_id: "${vol_id}" }
            - { call: "POST /naturalization/enrollments/${enr_id}/attendance-records", payload: { session_index: 2, outcome: PRESENT }, as: Volunteer, as_user_id: "${vol_id}" }
            - { call: "POST /naturalization/enrollments/${enr_id}/complete", payload: {}, as: IntakeCoordinator }
          trigger:
            - call: "POST /naturalization/enrollments/${enr_id}/withdraw"
              payload: {}
              as: IntakeCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE, http 409"
            - "ClassSection.${sec_id}.enrolled_count == 0 (COMPLETED is terminal and outside the ENROLLED ledger; the failed withdraw changed nothing)"

      - name: fee_waiver_decide_twice_rejected
        claim_type: invalid_transition
        grounds: ["state_machines.FeeWaiverRequest", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Terminal lockdown: decide on an already APPROVED request fails with ERR_INVALID_STATE."
        test_recipe:
          setup: ["APPROVED fee waiver request exists"]
          setup_api_calls:
            - { call: "POST /naturalization/programs", payload: { name: "Main" }, as: ProgramAdmin }
            - call: "POST /naturalization/applicants"
              payload: { full_name: "A One", email: "a@x.com", date_of_birth: "1990-01-01" }
              as: IntakeCoordinator
              captures: { app_id: $.data.id, app_v: $.data.version }
            - call: "POST /naturalization/applicants/${app_id}/screenings"
              payload: { expected_applicant_version: "${app_v}", marital_to_citizen: false, lpr_months: 80, continuous_residence_months: 61, physical_presence_days: 1000, age_years: 36, english_level: 2, civics_practice_pct: 50, has_legal_flag: false }
              as: IntakeCoordinator
            - call: "POST /naturalization/applicants/${app_id}/fee-waiver-requests"
              payload: { household_size: 1, self_reported_income_cents: 1000000, self_reported_benefit: false }
              as: IntakeCoordinator
              captures: { fwr_id: $.data.id }
            - { call: "POST /naturalization/fee-waiver-requests/${fwr_id}/submit", payload: { attached_document_count: 2 }, as: IntakeCoordinator }
            - { call: "POST /naturalization/fee-waiver-requests/${fwr_id}/decide", payload: { decision: APPROVED, documented_income_cents: 1000000, documented_benefit: false }, as: ProgramAdmin }
          trigger:
            - call: "POST /naturalization/fee-waiver-requests/${fwr_id}/decide"
              payload: { decision: DENIED, documented_income_cents: 1000000, documented_benefit: false }
              as: ProgramAdmin
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE, http 409"
            - "FeeWaiverRequest.${fwr_id}.status remains APPROVED with final_tier FULL"

      - name: promotion_expiry_sweep_auto_withdraws_and_promotes_next
        claim_type: side_effect_execution
        grounds: [state_machines.Enrollment.PENDING_PROMOTION_to_WITHDRAWN, calculations.seat_ledger]
        distinguishing_aspect: "Clock sweep at exactly offer_expires_at keeps the offer alive (strict < expiry); one second later the offer auto-withdraws (terminal) and the NEXT waitlisted enrollment is promoted with a fresh 72h offer."
        test_recipe:
          setup: ["section cap 1; A ENROLLED; B then C WAITLISTED; A withdraws -> B PENDING_PROMOTION with offer_expires_at 2026-08-04T00:00:00Z"]
          setup_api_calls:
            - { call: "POST /naturalization/programs", payload: { name: "Main" }, as: ProgramAdmin }
            - call: "POST /naturalization/volunteers"
              payload: { full_name: "Inst", email: "i@x.com", background_check_cleared: true }
              as: ProgramAdmin
              captures: { vol_id: $.data.id }
            - { call: "POST /naturalization/volunteers/${vol_id}/training-credits", payload: { topic: "civics", hours: 10, earned_at: "2026-07-01T00:00:00Z" }, as: ProgramAdmin }
            - { call: "POST /naturalization/volunteers/${vol_id}/accredit", payload: { target_level: GENERAL }, as: ProgramAdmin }
            - call: "POST /naturalization/class-sections"
              payload: { title: "OneSeat", weekday: "WED", start_minute: 700, end_minute: 760, room_id: "R6", instructor_volunteer_id: "${vol_id}", capacity: 1, total_sessions: 10 }
              as: ProgramAdmin
              captures: { sec_id: $.data.id, sec_v0: $.data.version }
            - call: "POST /naturalization/applicants"
              payload: { full_name: "A One", email: "a@x.com", date_of_birth: "1990-01-01" }
              as: IntakeCoordinator
              captures: { a_id: $.data.id, a_v: $.data.version }
            - call: "POST /naturalization/applicants/${a_id}/screenings"
              payload: { expected_applicant_version: "${a_v}", marital_to_citizen: false, lpr_months: 80, continuous_residence_months: 61, physical_presence_days: 1000, age_years: 36, english_level: 2, civics_practice_pct: 50, has_legal_flag: false }
              as: IntakeCoordinator
            - call: "POST /naturalization/enrollments"
              payload: { applicant_id: "${a_id}", class_section_id: "${sec_id}", expected_section_version: "${sec_v0}" }
              as: IntakeCoordinator
              captures: { enr_a: $.data.id }
            - call: "GET /naturalization/class-sections/${sec_id}"
              payload: {}
              as: IntakeCoordinator
              captures: { sec_v1: $.data.version }
            - call: "POST /naturalization/applicants"
              payload: { full_name: "B Two", email: "b@x.com", date_of_birth: "1991-01-01" }
              as: IntakeCoordinator
              captures: { b_id: $.data.id, b_v: $.data.version }
            - call: "POST /naturalization/applicants/${b_id}/screenings"
              payload: { expected_applicant_version: "${b_v}", marital_to_citizen: false, lpr_months: 80, continuous_residence_months: 61, physical_presence_days: 1000, age_years: 35, english_level: 2, civics_practice_pct: 50, has_legal_flag: false }
              as: IntakeCoordinator
            - call: "POST /naturalization/enrollments"
              payload: { applicant_id: "${b_id}", class_section_id: "${sec_id}", expected_section_version: "${sec_v1}" }
              as: IntakeCoordinator
              captures: { enr_b: $.data.id }
            - call: "GET /naturalization/class-sections/${sec_id}"
              payload: {}
              as: IntakeCoordinator
              captures: { sec_v2: $.data.version }
            - call: "POST /naturalization/applicants"
              payload: { full_name: "C Three", email: "c@x.com", date_of_birth: "1992-01-01" }
              as: IntakeCoordinator
              captures: { c_id: $.data.id, c_v: $.data.version }
            - call: "POST /naturalization/applicants/${c_id}/screenings"
              payload: { expected_applicant_version: "${c_v}", marital_to_citizen: false, lpr_months: 80, continuous_residence_months: 61, physical_presence_days: 1000, age_years: 34, english_level: 2, civics_practice_pct: 50, has_legal_flag: false }
              as: IntakeCoordinator
            - call: "POST /naturalization/enrollments"
              payload: { applicant_id: "${c_id}", class_section_id: "${sec_id}", expected_section_version: "${sec_v2}" }
              as: IntakeCoordinator
              captures: { enr_c: $.data.id }
            - { call: "POST /naturalization/enrollments/${enr_a}/withdraw", payload: {}, as: IntakeCoordinator }
          trigger:
            - { call: "POST /naturalization/_clock/set_current_utc", payload: { to_iso8601: "2026-08-04T00:00:00Z" }, as: ProgramAdmin }
            - { call: "POST /naturalization/_clock/set_current_utc", payload: { to_iso8601: "2026-08-04T00:00:01Z" }, as: ProgramAdmin }
          assert:
            - "after clock == offer_expires_at exactly: Enrollment.${enr_b}.status == PENDING_PROMOTION (strict < sweep keeps it alive)"
            - "after clock == offer_expires_at + 1s: Enrollment.${enr_b}.status == WITHDRAWN (auto-decline is terminal)"
            - "Enrollment.${enr_c}.status == PENDING_PROMOTION AND offer_expires_at == 2026-08-07T00:00:01Z (fresh 72h offer from the sweep time)"

      - name: workshop_cancel_cascades_reserved_seats
        claim_type: cascade_down
        grounds: [state_machines.Workshop.SCHEDULED_to_CANCELLED, state_machines.WorkshopSeat]
        distinguishing_aspect: "Cancelling a SCHEDULED workshop flips all its RESERVED seats to CANCELLED and drops reserved_count to 0."
        test_recipe:
          setup: ["LEGAL supervisor; workshop with one RESERVED seat"]
          setup_api_calls:
            - { call: "POST /naturalization/programs", payload: { name: "Main" }, as: ProgramAdmin }
            - call: "POST /naturalization/applicants"
              payload: { full_name: "A One", email: "a@x.com", date_of_birth: "1990-01-01" }
              as: IntakeCoordinator
              captures: { app_id: $.data.id, app_v: $.data.version }
            - call: "POST /naturalization/applicants/${app_id}/screenings"
              payload: { expected_applicant_version: "${app_v}", marital_to_citizen: false, lpr_months: 80, continuous_residence_months: 61, physical_presence_days: 1000, age_years: 36, english_level: 2, civics_practice_pct: 50, has_legal_flag: false }
              as: IntakeCoordinator
            - call: "POST /naturalization/volunteers"
              payload: { full_name: "Sup Vol", email: "vs@x.com", background_check_cleared: true, bar_number: "BAR111" }
              as: ProgramAdmin
              captures: { vs_id: $.data.id }
            - { call: "POST /naturalization/volunteers/${vs_id}/training-credits", payload: { topic: "ethics", hours: 10, earned_at: "2026-07-01T00:00:00Z" }, as: ProgramAdmin }
            - { call: "POST /naturalization/volunteers/${vs_id}/accredit", payload: { target_level: GENERAL }, as: ProgramAdmin }
            - { call: "POST /naturalization/volunteers/${vs_id}/accredit", payload: { target_level: LEGAL }, as: ProgramAdmin }
            - call: "POST /naturalization/workshops"
              payload: { title: "WS", supervising_volunteer_id: "${vs_id}", scheduled_start: "2026-08-20T10:00:00Z", duration_hours: 2, capacity: 3 }
              as: ProgramAdmin
              captures: { ws_id: $.data.id, ws_v: $.data.version }
            - call: "POST /naturalization/workshops/${ws_id}/seats"
              payload: { applicant_id: "${app_id}", expected_workshop_version: "${ws_v}" }
              as: IntakeCoordinator
              captures: { seat_id: $.data.id }
          trigger:
            - call: "POST /naturalization/workshops/${ws_id}/cancel"
              payload: {}
              as: ProgramAdmin
          assert:
            - "Workshop.${ws_id}.status == CANCELLED AND reserved_count == 0"
            - "WorkshopSeat.${seat_id}.status == CANCELLED"

      - name: screening_second_create_supersedes_first
        claim_type: side_effect_execution
        grounds: [state_machines.Screening, entities.Applicant.fields.current_screening_id]
        distinguishing_aspect: "Creating a second screening supersedes the first: prior row SUPERSEDED, applicant.current_screening_id repointed, applicant version advanced by the write."
        test_recipe:
          setup: ["applicant with one ACTIVE ELIGIBLE screening"]
          setup_api_calls:
            - { call: "POST /naturalization/programs", payload: { name: "Main" }, as: ProgramAdmin }
            - call: "POST /naturalization/applicants"
              payload: { full_name: "A One", email: "a@x.com", date_of_birth: "1990-01-01" }
              as: IntakeCoordinator
              captures: { app_id: $.data.id, app_v: $.data.version }
            - call: "POST /naturalization/applicants/${app_id}/screenings"
              payload: { expected_applicant_version: "${app_v}", marital_to_citizen: false, lpr_months: 80, continuous_residence_months: 61, physical_presence_days: 1000, age_years: 36, english_level: 2, civics_practice_pct: 50, has_legal_flag: false }
              as: IntakeCoordinator
              captures: { scr1_id: $.data.id }
            - call: "GET /naturalization/applicants/${app_id}"
              payload: {}
              as: IntakeCoordinator
              captures: { app_v2: $.data.version }
          trigger:
            - call: "POST /naturalization/applicants/${app_id}/screenings"
              payload: { expected_applicant_version: "${app_v2}", marital_to_citizen: true, lpr_months: 40, continuous_residence_months: 37, physical_presence_days: 600, age_years: 36, english_level: 1, civics_practice_pct: 10, has_legal_flag: false }
              as: IntakeCoordinator
              captures: { scr2_id: $.data.id }
          assert:
            - "Screening.${scr1_id}.status == SUPERSEDED"
            - "Screening.${scr2_id}.status == ACTIVE AND outcome == ELIGIBLE (marital rule: 37 >= 36, 600 >= 548)"
            - "Applicant.${app_id}.current_screening_id == ${scr2_id}"

      - name: attendance_midterm_cascade_waitlist_promotion
        claim_type: conditional_cascade
        grounds: [state_machines.Enrollment.ENROLLED_to_REVOKED]
        excluded_because:
          difficulty_instance: attendance_midterm_revoke_seat_promotion_cascade
          rationale: "Asserted end-to-end as the failure-path cascade of the named §1.8 instance."

      - name: oath_conclude_cascade_to_applicant
        claim_type: bubble_up
        grounds: [state_machines.OathCeremony.SCHEDULED_to_CONCLUDED]
        excluded_because:
          difficulty_instance: oath_conclude_case_applicant_referral_cascade
          rationale: "Asserted end-to-end in the named §1.8 instance."

  # ===================================================================
  # Section: calculations
  # ===================================================================
  - section: calculations
    instances:
      - name: screening_presence_days_913_boundary
        claim_type: correct_result
        grounds: [calculations.screening_outcome]
        distinguishing_aspect: "Standard-rule presence requirement is inclusive at 913 days: 913 -> ELIGIBLE, 912 -> NOT_ELIGIBLE (residence held sufficient)."
        test_recipe:
          setup: ["program; two applicants"]
          setup_api_calls:
            - { call: "POST /naturalization/programs", payload: { name: "Main" }, as: ProgramAdmin }
            - call: "POST /naturalization/applicants"
              payload: { full_name: "P913", email: "p913@x.com", date_of_birth: "1990-01-01" }
              as: IntakeCoordinator
              captures: { p_id: $.data.id, p_v: $.data.version }
            - call: "POST /naturalization/applicants"
              payload: { full_name: "P912", email: "p912@x.com", date_of_birth: "1990-01-01" }
              as: IntakeCoordinator
              captures: { q_id: $.data.id, q_v: $.data.version }
          trigger:
            - call: "POST /naturalization/applicants/${p_id}/screenings"
              payload: { expected_applicant_version: "${p_v}", marital_to_citizen: false, lpr_months: 80, continuous_residence_months: 60, physical_presence_days: 913, age_years: 36, english_level: 1, civics_practice_pct: 0, has_legal_flag: false }
              as: IntakeCoordinator
              captures: { scr_p: $.data.id }
            - call: "POST /naturalization/applicants/${q_id}/screenings"
              payload: { expected_applicant_version: "${q_v}", marital_to_citizen: false, lpr_months: 80, continuous_residence_months: 60, physical_presence_days: 912, age_years: 36, english_level: 1, civics_practice_pct: 0, has_legal_flag: false }
              as: IntakeCoordinator
              captures: { scr_q: $.data.id }
          assert:
            - "Screening.${scr_p}.outcome == ELIGIBLE (913 meets requirement)"
            - "Screening.${scr_q}.outcome == NOT_ELIGIBLE (912 fails)"
            - "Applicant.${p_id}.stage == SCREENED; Applicant.${q_id}.stage == REGISTERED (no stage bump for NOT_ELIGIBLE)"

      - name: screening_english_exemption_age_55
        claim_type: correct_result
        grounds: [calculations.screening_outcome]
        distinguishing_aspect: "english_level 0 normally fails, but age >= 55 AND lpr_months >= 180 routes to ELIGIBLE_WITH_EXEMPTION; age 54 with identical other inputs is NOT_ELIGIBLE."
        test_recipe:
          setup: ["program; two applicants"]
          setup_api_calls:
            - { call: "POST /naturalization/programs", payload: { name: "Main" }, as: ProgramAdmin }
            - call: "POST /naturalization/applicants"
              payload: { full_name: "Old", email: "old@x.com", date_of_birth: "1971-01-01" }
              as: IntakeCoordinator
              captures: { o_id: $.data.id, o_v: $.data.version }
            - call: "POST /naturalization/applicants"
              payload: { full_name: "Young", email: "yng@x.com", date_of_birth: "1972-06-01" }
              as: IntakeCoordinator
              captures: { y_id: $.data.id, y_v: $.data.version }
          trigger:
            - call: "POST /naturalization/applicants/${o_id}/screenings"
              payload: { expected_applicant_version: "${o_v}", marital_to_citizen: false, lpr_months: 180, continuous_residence_months: 70, physical_presence_days: 1000, age_years: 55, english_level: 0, civics_practice_pct: 0, has_legal_flag: false }
              as: IntakeCoordinator
              captures: { scr_o: $.data.id }
            - call: "POST /naturalization/applicants/${y_id}/screenings"
              payload: { expected_applicant_version: "${y_v}", marital_to_citizen: false, lpr_months: 180, continuous_residence_months: 70, physical_presence_days: 1000, age_years: 54, english_level: 0, civics_practice_pct: 0, has_legal_flag: false }
              as: IntakeCoordinator
              captures: { scr_y: $.data.id }
          assert:
            - "Screening.${scr_o}.outcome == ELIGIBLE_WITH_EXEMPTION"
            - "Screening.${scr_y}.outcome == NOT_ELIGIBLE"

      - name: training_window_730_day_inclusive_boundary
        claim_type: correct_result
        grounds: [calculations.training_hours_window]
        distinguishing_aspect: "A credit earned exactly 730 days before the clock (2024-08-01 vs 2026-08-01) still counts; one day older (2024-07-31) is excluded from training_hours_24mo."
        test_recipe:
          setup: ["program; one volunteer with three credits: 6h at 2024-08-01 (boundary), 5h at 2024-07-31 (expired), 4h at 2026-01-01 (recent)"]
          setup_api_calls:
            - { call: "POST /naturalization/programs", payload: { name: "Main" }, as: ProgramAdmin }
            - call: "POST /naturalization/volunteers"
              payload: { full_name: "Win Vol", email: "w@x.com", background_check_cleared: true }
              as: ProgramAdmin
              captures: { vol_id: $.data.id }
            - { call: "POST /naturalization/volunteers/${vol_id}/training-credits", payload: { topic: "boundary", hours: 6, earned_at: "2024-08-01T00:00:00Z" }, as: ProgramAdmin }
            - { call: "POST /naturalization/volunteers/${vol_id}/training-credits", payload: { topic: "expired", hours: 5, earned_at: "2024-07-31T00:00:00Z" }, as: ProgramAdmin }
            - { call: "POST /naturalization/volunteers/${vol_id}/training-credits", payload: { topic: "recent", hours: 4, earned_at: "2026-01-01T00:00:00Z" }, as: ProgramAdmin }
          trigger:
            - call: "GET /naturalization/volunteers/${vol_id}"
              payload: {}
              as: ProgramAdmin
              captures: { hours: $.data.training_hours_24mo }
          assert:
            - "training_hours_24mo == 10 (6 boundary-included + 4 recent; 5 excluded as 731 days old)"

      - name: accredit_general_training_hours_boundary
        claim_type: correct_result
        grounds: [calculations.training_hours_window, state_machines.Volunteer.TRAINEE_to_GENERAL]
        distinguishing_aspect: "GENERAL accreditation at exactly general_training_hours (10) succeeds; at 9 it fails with ERR_ACCREDITATION_INSUFFICIENT."
        test_recipe:
          setup: ["program; volunteer W9 with 9 recent hours; volunteer W10 with 10 recent hours"]
          setup_api_calls:
            - { call: "POST /naturalization/programs", payload: { name: "Main" }, as: ProgramAdmin }
            - call: "POST /naturalization/volunteers"
              payload: { full_name: "W9", email: "w9@x.com", background_check_cleared: true }
              as: ProgramAdmin
              captures: { w9_id: $.data.id }
            - { call: "POST /naturalization/volunteers/${w9_id}/training-credits", payload: { topic: "t", hours: 9, earned_at: "2026-07-01T00:00:00Z" }, as: ProgramAdmin }
            - call: "POST /naturalization/volunteers"
              payload: { full_name: "W10", email: "w10@x.com", background_check_cleared: true }
              as: ProgramAdmin
              captures: { w10_id: $.data.id }
            - { call: "POST /naturalization/volunteers/${w10_id}/training-credits", payload: { topic: "t", hours: 10, earned_at: "2026-07-01T00:00:00Z" }, as: ProgramAdmin }
          trigger:
            - call: "POST /naturalization/volunteers/${w9_id}/accredit"
              payload: { target_level: GENERAL }
              as: ProgramAdmin
              captures: { err9: $.data.error_id }
            - call: "POST /naturalization/volunteers/${w10_id}/accredit"
              payload: { target_level: GENERAL }
              as: ProgramAdmin
          assert:
            - "W9 accredit fails with ERR_ACCREDITATION_INSUFFICIENT (9 < 10)"
            - "Volunteer.${w10_id}.accreditation_level == GENERAL (10 >= 10, inclusive)"

      - name: legal_accreditation_via_supervised_hours_path
        claim_type: correct_result
        grounds: [state_machines.Volunteer.GENERAL_to_LEGAL, calculations.workshop_hours_ledger]
        distinguishing_aspect: "LEGAL has two paths: bar_number OR supervised_hours >= 8. A GENERAL volunteer with no bar number reaches LEGAL only after accumulating 8 supervised hours as a workshop assistant (7 hours is insufficient)."
        test_recipe:
          setup: ["LEGAL supervisor Vs (bar path); GENERAL assistant Va (no bar); workshops of 5h and 3h both completed with Va assisting; intermediate check at 5h fails, at 8h succeeds"]
          setup_api_calls:
            - { call: "POST /naturalization/programs", payload: { name: "Main" }, as: ProgramAdmin }
            - call: "POST /naturalization/volunteers"
              payload: { full_name: "Sup Vol", email: "vs@x.com", background_check_cleared: true, bar_number: "BAR111" }
              as: ProgramAdmin
              captures: { vs_id: $.data.id }
            - { call: "POST /naturalization/volunteers/${vs_id}/training-credits", payload: { topic: "ethics", hours: 10, earned_at: "2026-07-01T00:00:00Z" }, as: ProgramAdmin }
            - { call: "POST /naturalization/volunteers/${vs_id}/accredit", payload: { target_level: GENERAL }, as: ProgramAdmin }
            - { call: "POST /naturalization/volunteers/${vs_id}/accredit", payload: { target_level: LEGAL }, as: ProgramAdmin }
            - call: "POST /naturalization/volunteers"
              payload: { full_name: "Asst Vol", email: "va@x.com", background_check_cleared: true }
              as: ProgramAdmin
              captures: { va_id: $.data.id }
            - { call: "POST /naturalization/volunteers/${va_id}/training-credits", payload: { topic: "forms", hours: 10, earned_at: "2026-07-01T00:00:00Z" }, as: ProgramAdmin }
            - { call: "POST /naturalization/volunteers/${va_id}/accredit", payload: { target_level: GENERAL }, as: ProgramAdmin }
            - call: "POST /naturalization/workshops"
              payload: { title: "WS5", supervising_volunteer_id: "${vs_id}", assisting_volunteer_id: "${va_id}", scheduled_start: "2026-08-05T10:00:00Z", duration_hours: 5, capacity: 3 }
              as: ProgramAdmin
              captures: { ws5_id: $.data.id }
            - call: "POST /naturalization/workshops"
              payload: { title: "WS3", supervising_volunteer_id: "${vs_id}", assisting_volunteer_id: "${va_id}", scheduled_start: "2026-08-06T10:00:00Z", duration_hours: 3, capacity: 3 }
              as: ProgramAdmin
              captures: { ws3_id: $.data.id }
            - { call: "POST /naturalization/_clock/set_current_utc", payload: { to_iso8601: "2026-08-06T11:00:00Z" }, as: ProgramAdmin }
            - { call: "POST /naturalization/workshops/${ws5_id}/complete", payload: {}, as: Volunteer, as_user_id: "${vs_id}" }
          trigger:
            - call: "POST /naturalization/volunteers/${va_id}/accredit"
              payload: { target_level: LEGAL }
              as: ProgramAdmin
              captures: { err5: $.data.error_id }
            - { call: "POST /naturalization/workshops/${ws3_id}/complete", payload: {}, as: Volunteer, as_user_id: "${vs_id}" }
            - call: "POST /naturalization/volunteers/${va_id}/accredit"
              payload: { target_level: LEGAL }
              as: ProgramAdmin
          assert:
            - "first LEGAL accredit fails with ERR_ACCREDITATION_INSUFFICIENT (supervised_hours 5 < 8, no bar_number)"
            - "after second completion supervised_hours == 8; accredit succeeds: accreditation_level == LEGAL (inclusive threshold)"

      - name: mock_score_civics_floor_gate
        claim_type: correct_result
        grounds: [calculations.mock_interview_score]
        distinguishing_aspect: "Compound threshold: overall >= 70 AND civics_pct >= 60. A 74-overall interview with civics 55 is NEEDS_RETRY; a 70-overall with civics 65 is PASS."
        test_recipe:
          setup: ["eligible applicant (attained 80); GENERAL volunteer; two SCHEDULED interviews at non-conflicting times"]
          setup_api_calls:
            - { call: "POST /naturalization/programs", payload: { name: "Main" }, as: ProgramAdmin }
            - call: "POST /naturalization/applicants"
              payload: { full_name: "Ana Paz", email: "ana@x.com", date_of_birth: "1986-04-02" }
              as: IntakeCoordinator
              captures: { app_id: $.data.id, app_v: $.data.version }
            - call: "POST /naturalization/applicants/${app_id}/screenings"
              payload: { expected_applicant_version: "${app_v}", marital_to_citizen: false, lpr_months: 80, continuous_residence_months: 61, physical_presence_days: 1000, age_years: 40, english_level: 3, civics_practice_pct: 25, has_legal_flag: false }
              as: IntakeCoordinator
            - call: "POST /naturalization/volunteers"
              payload: { full_name: "Vic Torres", email: "vic@x.com", background_check_cleared: true }
              as: ProgramAdmin
              captures: { vol_id: $.data.id }
            - { call: "POST /naturalization/volunteers/${vol_id}/training-credits", payload: { topic: "civics", hours: 10, earned_at: "2026-07-01T00:00:00Z" }, as: ProgramAdmin }
            - { call: "POST /naturalization/volunteers/${vol_id}/accredit", payload: { target_level: GENERAL }, as: ProgramAdmin }
            - call: "POST /naturalization/mock-interviews"
              payload: { applicant_id: "${app_id}", volunteer_id: "${vol_id}", scheduled_start: "2026-08-10T10:00:00Z", duration_minutes: 30 }
              as: IntakeCoordinator
              captures: { m1_id: $.data.id }
            - call: "POST /naturalization/mock-interviews"
              payload: { applicant_id: "${app_id}", volunteer_id: "${vol_id}", scheduled_start: "2026-08-10T11:00:00Z", duration_minutes: 30 }
              as: IntakeCoordinator
              captures: { m2_id: $.data.id }
          trigger:
            - call: "POST /naturalization/mock-interviews/${m1_id}/score"
              payload: { english_pct: 90, civics_pct: 55, n400_pct: 80 }
              as: Volunteer
              as_user_id: "${vol_id}"
            - call: "POST /naturalization/mock-interviews/${m2_id}/score"
              payload: { english_pct: 80, civics_pct: 65, n400_pct: 60 }
              as: Volunteer
              as_user_id: "${vol_id}"
          assert:
            - "MockInterview.${m1_id}.overall_score == 74 AND outcome == NEEDS_RETRY (civics floor 60 failed despite overall >= 70)"
            - "MockInterview.${m2_id}.overall_score == 70 AND outcome == PASS (both thresholds inclusive)"

      - name: attendance_truncation_integer_basis_points
        claim_type: precision
        grounds: [calculations.attendance_pct]
        distinguishing_aspect: "7 attended of 9 records truncates to 7777 bp (floor(70000/9)), never rounded to 7778."
        test_recipe:
          setup: ["section total_sessions 10; enrollment with 9 records: 7 attended"]
          setup_api_calls:
            - { call: "POST /naturalization/programs", payload: { name: "Main" }, as: ProgramAdmin }
            - call: "POST /naturalization/volunteers"
              payload: { full_name: "Inst", email: "i@x.com", background_check_cleared: true }
              as: ProgramAdmin
              captures: { vol_id: $.data.id }
            - { call: "POST /naturalization/volunteers/${vol_id}/training-credits", payload: { topic: "civics", hours: 10, earned_at: "2026-07-01T00:00:00Z" }, as: ProgramAdmin }
            - { call: "POST /naturalization/volunteers/${vol_id}/accredit", payload: { target_level: GENERAL }, as: ProgramAdmin }
            - call: "POST /naturalization/class-sections"
              payload: { title: "T", weekday: "MON", start_minute: 600, end_minute: 660, room_id: "R1", instructor_volunteer_id: "${vol_id}", capacity: 2, total_sessions: 10 }
              as: ProgramAdmin
              captures: { sec_id: $.data.id, sec_v: $.data.version }
            - call: "POST /naturalization/applicants"
              payload: { full_name: "A One", email: "a@x.com", date_of_birth: "1990-01-01" }
              as: IntakeCoordinator
              captures: { app_id: $.data.id, app_v: $.data.version }
            - call: "POST /naturalization/applicants/${app_id}/screenings"
              payload: { expected_applicant_version: "${app_v}", marital_to_citizen: false, lpr_months: 80, continuous_residence_months: 61, physical_presence_days: 1000, age_years: 36, english_level: 2, civics_practice_pct: 50, has_legal_flag: false }
              as: IntakeCoordinator
            - call: "POST /naturalization/enrollments"
              payload: { applicant_id: "${app_id}", class_section_id: "${sec_id}", expected_section_version: "${sec_v}" }
              as: IntakeCoordinator
              captures: { enr_id: $.data.id }
            # 9 records, attended = PRESENT + ABSENT_EXCUSED = 7; midterm 5 has 4 attended (8000) -> survives
            - { call: "POST /naturalization/enrollments/${enr_id}/attendance-records", payload: { session_index: 1, outcome: PRESENT }, as: Volunteer, as_user_id: "${vol_id}" }
            - { call: "POST /naturalization/enrollments/${enr_id}/attendance-records", payload: { session_index: 2, outcome: PRESENT }, as: Volunteer, as_user_id: "${vol_id}" }
            - { call: "POST /naturalization/enrollments/${enr_id}/attendance-records", payload: { session_index: 3, outcome: PRESENT }, as: Volunteer, as_user_id: "${vol_id}" }
            - { call: "POST /naturalization/enrollments/${enr_id}/attendance-records", payload: { session_index: 4, outcome: ABSENT_EXCUSED }, as: Volunteer, as_user_id: "${vol_id}" }
            - { call: "POST /naturalization/enrollments/${enr_id}/attendance-records", payload: { session_index: 5, outcome: ABSENT_UNEXCUSED }, as: Volunteer, as_user_id: "${vol_id}" }
            - { call: "POST /naturalization/enrollments/${enr_id}/attendance-records", payload: { session_index: 6, outcome: PRESENT }, as: Volunteer, as_user_id: "${vol_id}" }
            - { call: "POST /naturalization/enrollments/${enr_id}/attendance-records", payload: { session_index: 7, outcome: PRESENT }, as: Volunteer, as_user_id: "${vol_id}" }
            - { call: "POST /naturalization/enrollments/${enr_id}/attendance-records", payload: { session_index: 8, outcome: ABSENT_EXCUSED }, as: Volunteer, as_user_id: "${vol_id}" }
            - { call: "POST /naturalization/enrollments/${enr_id}/attendance-records", payload: { session_index: 9, outcome: ABSENT_UNEXCUSED }, as: Volunteer, as_user_id: "${vol_id}" }
          trigger:
            - call: "GET /naturalization/enrollments/${enr_id}"
              payload: {}
              as: IntakeCoordinator
          assert:
            - "Enrollment.${enr_id}.records_count == 9"
            - "Enrollment.${enr_id}.attendance_bp == 7777 (integer truncation of 70000/9)"
            - "status remains ENROLLED (midterm at 5 records was 8000 bp; no auto-revoke)"

