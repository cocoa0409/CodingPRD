      - name: event_not_travel_approved_error_triggered
        claim_type: violation_to_error
        grounds: ["errors[ERR_EVENT_NOT_TRAVEL_APPROVED]"]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / missed_class_request_requires_travel_approved_event
          rationale: "The named §1.8 instance triggers this error from a SCHEDULED event and then shows the same payload succeeding after APPROVE_TRAVEL."

      - name: missed_class_allowance_exceeded_error_triggered
        claim_type: violation_to_error
        grounds: ["errors[ERR_MISSED_CLASS_ALLOWANCE_EXCEEDED]"]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / state_beats_fiscal_on_missed_class_request_create
          rationale: "The named §1.8 instance pre-charges the student to the allowance so the fiscal rule is violated, then pins the higher-priority state error."

      - name: tutor_not_trained_error_triggered
        claim_type: violation_to_error
        grounds: ["errors[ERR_TUTOR_NOT_TRAINED]"]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / safety_beats_referential_on_tutor_assignment_create
          rationale: "The named §1.8 instance assigns an UNTRAINED tutor and pins ERR_TUTOR_NOT_TRAINED over the subject-mismatch rule."

      - name: student_session_overlap_error_triggered
        claim_type: violation_to_error
        grounds: ["errors[ERR_STUDENT_SESSION_OVERLAP]"]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / student_session_half_open_adjacency_allowed_overlap_rejected
          rationale: "The named §1.8 instance accepts the adjacent session and rejects the one-minute overlap with this error."

      - name: tutor_buffer_violation_error_triggered
        claim_type: violation_to_error
        grounds: ["errors[ERR_TUTOR_BUFFER_VIOLATION]"]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / tutor_twenty_minute_buffer_rejects_ten_minute_gap
          rationale: "The named §1.8 instance accepts a 20-minute gap and rejects a 10-minute gap with this error."

      - name: apr_term_closed_error_triggered
        claim_type: violation_to_error
        grounds: ["errors[ERR_APR_TERM_CLOSED]"]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / appeal_decision_blocked_when_term_apr_closed
          rationale: "The named §1.8 instance denies an appeal whose certification term has been APR-closed and pins this error."

      - name: appeal_rounds_exhausted_error_triggered
        claim_type: violation_to_error
        grounds: ["errors[ERR_APPEAL_ROUNDS_EXHAUSTED]"]
        excluded_because:
          difficulty_instance: non_linear_state_machine / appeal_revision_round_cycle
          rationale: "The named §1.8 instance loops the appeal through MAX_APPEAL_ROUNDS and pins the exhaustion error on the next revision request."

  # ---------------------------------------------------------------------------
  # Guide section 7 - RBAC (role_model: segregation_of_duties)
  # ---------------------------------------------------------------------------
  - section: rbac
    instances:
      - name: registrar_cannot_certify_returns_403
        claim_type: exclusive_operations_denied
        grounds:
          - rbac.Registrar.exclusive_operations
          - rbac.CertificationOfficer.shared_operations
          - errors[ERR_FORBIDDEN_ROLE]
        distinguishing_aspect: "CERTIFY belongs to CertificationOfficer alone, so the Registrar - who owns the whole academic catalogue and may read certifications - is still refused with 403 ERR_FORBIDDEN_ROLE at priority 2, before any state or benchmark check runs."
        test_recipe:
          setup:
            - "Certification C67 for student S67 in 2026FA was requested by co_requester and submitted by adv_1, so it is SUBMITTED."
          setup_api_calls:
            - call: "POST /athletics/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: CertificationOfficer
            - call: "POST /athletics/terms"
              payload: { code: "2026FA", term_index: 1, term_type: "FALL", catalog_year: 2026, start_date: "2026-08-24T00:00:00Z", end_date: "2026-12-18T00:00:00Z" }
              as: Registrar
              captures: { term1_id: $.data.id }
            - call: "POST /athletics/student-athletes"
              payload: { full_name: "Sam Sixtyseven", sport_code: "FB", entry_term_index: 1, entry_catalog_year: 2026 }
              as: Registrar
              captures: { s67_id: $.data.id }
            - call: "GET /athletics/student-athletes/${s67_id}"
              payload: {}
              as: CertificationOfficer
              captures: { s67_v: $.data.version }
            - call: "POST /athletics/certifications"
              payload: { student_athlete_id: "${s67_id}", term_id: "${term1_id}", certification_type: "INITIAL", expected_student_athlete_version: "${s67_v}" }
              as: CertificationOfficer
              as_user_id: "co_requester"
              captures: { cert67_id: $.data.id }
            - call: "POST /athletics/certifications/${cert67_id}/status"
              payload: { action: "SUBMIT" }
              as: AcademicAdvisor
              as_user_id: "adv_1"
          trigger:
            - call: "POST /athletics/certifications/${cert67_id}/status"
              payload: { action: "CERTIFY" }
              as: Registrar
              as_user_id: "reg_1"
          assert:
            - "The response is HTTP 403 with data.error_id == ERR_FORBIDDEN_ROLE"
            - "EligibilityCertification.${cert67_id}.status == SUBMITTED, decided_by_user_id is null and decided_at is null"
            - "GET /athletics/certifications/${cert67_id} as Registrar still returns 200 - the read is a shared operation"

      - name: certification_requester_cannot_certify_own_submission
        claim_type: segregation_of_duties
        grounds:
          - rbac.CertificationOfficer.description
          - errors[ERR_SEGREGATION_OF_DUTIES]
          - validations[priority=11]
        distinguishing_aspect: "The role is correct and the benchmark passes, so only the X-User-ID identity separates the two attempts: co_requester is refused with 409 ERR_SEGREGATION_OF_DUTIES while co_decider certifies the same row successfully."
        test_recipe:
          setup:
            - "Student S68 declared DP68 and completed KINE-200 (12.00 credits, CORE for catalog 2026) with grade B, so benchmark_result is PASS and no state precondition can pre-empt the duty check."
            - "Certification C68 was requested by co_requester and submitted by adv_1."
          setup_api_calls:
            - call: "POST /athletics/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: CertificationOfficer
            - call: "POST /athletics/terms"
              payload: { code: "2026FA", term_index: 1, term_type: "FALL", catalog_year: 2026, start_date: "2026-08-24T00:00:00Z", end_date: "2026-12-18T00:00:00Z" }
              as: Registrar
              captures: { term1_id: $.data.id }
            - call: "POST /athletics/degree-programs"
              payload: { code: "DP68", name: "Kinesiology", catalog_year: 2026, total_required_credits: 60.00 }
              as: Registrar
              captures: { dp68_id: $.data.id }
            - call: "POST /athletics/courses"
              payload: { subject_code: "KINE", course_number: "200", title: "Exercise Physiology", credit_hours: 12.00, instructor_user_id: "instr_kine_1" }
              as: Registrar
              captures: { kine_id: $.data.id }
            - call: "POST /athletics/degree-applicability-rules"
              payload: { degree_program_id: "${dp68_id}", course_id: "${kine_id}", effective_catalog_year: 2026, applicability: "CORE" }
              as: Registrar
            - call: "POST /athletics/student-athletes"
              payload: { full_name: "Sam Sixtyeight", sport_code: "BASE", entry_term_index: 1, entry_catalog_year: 2026 }
              as: Registrar
              captures: { s68_id: $.data.id }
            - call: "POST /athletics/student-athletes/${s68_id}/major-declaration"
              payload: { declared_program_id: "${dp68_id}", term_id: "${term1_id}" }
              as: AcademicAdvisor
            - call: "POST /athletics/enrollments"
              payload: { student_athlete_id: "${s68_id}", course_id: "${kine_id}", term_id: "${term1_id}" }
              as: Registrar
              captures: { e68_id: $.data.id }
            - call: "POST /athletics/enrollments/${e68_id}/outcome"
              payload: { action: "RECORD_GRADE", grade: "B" }
              as: Registrar
            - call: "GET /athletics/student-athletes/${s68_id}"
              payload: {}
              as: CertificationOfficer
              captures: { s68_v: $.data.version }
            - call: "POST /athletics/certifications"
              payload: { student_athlete_id: "${s68_id}", term_id: "${term1_id}", certification_type: "INITIAL", expected_student_athlete_version: "${s68_v}" }
              as: CertificationOfficer
              as_user_id: "co_requester"
              captures: { cert68_id: $.data.id }
            - call: "POST /athletics/certifications/${cert68_id}/status"
              payload: { action: "SUBMIT" }
              as: AcademicAdvisor
              as_user_id: "adv_1"
          trigger:
            - call: "POST /athletics/certifications/${cert68_id}/status"
              payload: { action: "CERTIFY" }
              as: CertificationOfficer
              as_user_id: "co_requester"
            - call: "POST /athletics/certifications/${cert68_id}/status"
              payload: { action: "CERTIFY" }
              as: CertificationOfficer
              as_user_id: "co_decider"
          assert:
            - "The first call is HTTP 409 with data.error_id == ERR_SEGREGATION_OF_DUTIES and leaves status == SUBMITTED"
            - "The second call is HTTP 200 with data.status == CERTIFIED, benchmark_result == PASS and decided_by_user_id == co_decider"
            - "EligibilityCertification.${cert68_id}.requested_by_user_id == co_requester throughout"
            - "StudentAthlete.${s68_id}.eligibility_state == CERTIFIED only after the second call"

      - name: non_course_instructor_cannot_acknowledge_request
        claim_type: peer_roles
        grounds:
          - rbac.Instructor.description
          - errors[ERR_NOT_COURSE_INSTRUCTOR]
          - validations[priority=3]
        distinguishing_aspect: "Both callers use the Instructor role, so the refusal turns purely on X-User-ID: instr_math_1 is not the SOCI-150 instructor and gets 403 ERR_NOT_COURSE_INSTRUCTOR, while instr_soc_1 acknowledges the same request."
        test_recipe:
          setup:
            - "SOCI-150 is taught by instr_soc_1; request R69 for student S69's enrollment is PENDING_ACKNOWLEDGEMENT after a NOTIFY_INSTRUCTOR at 2026-09-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /athletics/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: AcademicAdvisor
            - call: "POST /athletics/terms"
              payload: { code: "2026FA", term_index: 1, term_type: "FALL", catalog_year: 2026, start_date: "2026-08-24T00:00:00Z", end_date: "2026-12-18T00:00:00Z" }
              as: Registrar
              captures: { term1_id: $.data.id }
            - call: "POST /athletics/courses"
              payload: { subject_code: "SOCI", course_number: "150", title: "Introduction to Sociology", credit_hours: 3.00, instructor_user_id: "instr_soc_1", meeting_days: [1, 3, 5], meeting_start_minute_utc: 600, meeting_duration_minutes: 50 }
              as: Registrar
              captures: { soci_id: $.data.id }
            - call: "POST /athletics/student-athletes"
              payload: { full_name: "Sam Sixtynine", sport_code: "WBB", entry_term_index: 1, entry_catalog_year: 2026 }
              as: Registrar
              captures: { s69_id: $.data.id }
            - call: "POST /athletics/enrollments"
              payload: { student_athlete_id: "${s69_id}", course_id: "${soci_id}", term_id: "${term1_id}" }
              as: Registrar
              captures: { e69_id: $.data.id }
            - call: "POST /athletics/competition-events"
              payload: { sport_code: "WBB", term_id: "${term1_id}", event_type: "REGULAR_SEASON", departure_at: "2026-09-14T08:00:00Z", return_at: "2026-09-15T00:00:00Z" }
              as: AthleticsOperations
              captures: { ev69_id: $.data.id }
            - call: "POST /athletics/competition-events/${ev69_id}/status"
              payload: { action: "APPROVE_TRAVEL" }
              as: AthleticsOperations
            - call: "POST /athletics/missed-class-requests"
              payload: { competition_event_id: "${ev69_id}", enrollment_id: "${e69_id}" }
              as: AcademicAdvisor
              captures: { r69_id: $.data.id }
            - call: "POST /athletics/missed-class-requests/${r69_id}/status"
              payload: { action: "NOTIFY_INSTRUCTOR" }
              as: AcademicAdvisor
          trigger:
            - call: "POST /athletics/missed-class-requests/${r69_id}/status"
              payload: { action: "ACKNOWLEDGE" }
              as: Instructor
              as_user_id: "instr_math_1"
            - call: "POST /athletics/missed-class-requests/${r69_id}/status"
              payload: { action: "ACKNOWLEDGE", instructor_response_note: "Noted, the student may make up the quiz." }
              as: Instructor
              as_user_id: "instr_soc_1"
          assert:
            - "The first call is HTTP 403 with data.error_id == ERR_NOT_COURSE_INSTRUCTOR and leaves status == PENDING_ACKNOWLEDGEMENT"
            - "The second call is HTTP 200 with data.status == ACKNOWLEDGED and instructor_response_note == \"Noted, the student may make up the quiz.\""
            - "MissedClassRequest.${r69_id}.instructor_user_id == instr_soc_1 and dispute_count == 0"

      - name: student_cannot_read_another_students_summary
        claim_type: peer_roles
        grounds:
          - rbac.StudentAthlete.identity
          - errors[ERR_NOT_OWN_RECORD]
          - endpoints[GET /athletics/student-athletes/{student_athlete_id}/eligibility-summary]
        distinguishing_aspect: "The StudentAthlete role is entity_backed, so X-User-ID must equal the path id: student S70A reading S70B's summary gets 403 ERR_NOT_OWN_RECORD while the same call against its own id succeeds."
        test_recipe:
          setup:
            - "Students S70A and S70B both exist in 2026FA with no enrollments."
          setup_api_calls:
            - call: "POST /athletics/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: Registrar
            - call: "POST /athletics/terms"
              payload: { code: "2026FA", term_index: 1, term_type: "FALL", catalog_year: 2026, start_date: "2026-08-24T00:00:00Z", end_date: "2026-12-18T00:00:00Z" }
              as: Registrar
              captures: { term1_id: $.data.id }
            - call: "POST /athletics/student-athletes"
              payload: { full_name: "Sam SeventyA", sport_code: "SOC", entry_term_index: 1, entry_catalog_year: 2026 }
              as: Registrar
              captures: { s70a_id: $.data.id }
            - call: "POST /athletics/student-athletes"
              payload: { full_name: "Sam SeventyB", sport_code: "SOC", entry_term_index: 1, entry_catalog_year: 2026 }
              as: Registrar
              captures: { s70b_id: $.data.id }
          trigger:
            - call: "GET /athletics/student-athletes/${s70b_id}/eligibility-summary"
              payload: {}
              as: StudentAthlete
              as_user_id: "${s70a_id}"
            - call: "GET /athletics/student-athletes/${s70a_id}/eligibility-summary"
              payload: {}
              as: StudentAthlete
              as_user_id: "${s70a_id}"
          assert:
            - "The first call is HTTP 403 with data.error_id == ERR_NOT_OWN_RECORD"
            - "The second call is HTTP 200 with data.student_athlete_id == ${s70a_id}"
            - "The second response carries eligibility_state == NOT_CERTIFIED, risk_tier == TIER_1 and degree_applicable_credits == 0.00"

      - name: tutor_cannot_log_session_for_another_tutors_assignment
