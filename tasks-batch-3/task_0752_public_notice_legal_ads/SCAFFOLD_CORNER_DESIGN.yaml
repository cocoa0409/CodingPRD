scaffold_corner_design:
  # =========================================================================
  # SECTION: entities
  # =========================================================================
  - section: entities
    instances:
      - name: create_newspaper_success_returns_201_and_fields
        claim_type: Creation
        grounds: ['entities.Newspaper', 'endpoints.POST_/newspapers']
        distinguishing_aspect: "POST /newspapers with all required fields -> 201 and the response echoes name, county, pricing_basis and all rate fields."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /newspapers"
              payload: { name: "Springfield Times", county: "SPRINGFIELD", circulation_qualified: true, pricing_basis: "PER_LINE", chars_per_line: 40, line_rate_first_cents: 500, line_rate_subsequent_cents: 300, word_rate_cents: 50, affidavit_fee_cents: 2500, edition_line_capacity: 100, publication_weekday: 6 }
              as: PlatformAdmin
              captures: { np_id: "$.data.id"}
          assert:
            - "response.http_status == 201"
            - "Newspaper.${np_id}.pricing_basis == PER_LINE"
            - "Newspaper.${np_id}.edition_line_capacity == 100"

      - name: get_newspaper_not_found
        claim_type: Not Found
        grounds: ['entities.Newspaper', 'errors[ERR_NOT_FOUND]']
        distinguishing_aspect: "GET /newspapers/{id} with a non-existent UUID -> ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /newspapers/00000000-0000-0000-0000-000000000000"
              as: PlatformAdmin
          assert:
            - "response.error_id == ERR_NOT_FOUND"
            - "response.http_status == 404"

      - name: create_notice_missing_body_text_rejected
        claim_type: Required Fields
        grounds: ['entities.Notice.fields.body_text', 'errors[ERR_VALIDATION]']
        distinguishing_aspect: "POST /notices omitting body_text -> ERR_VALIDATION (400)."
        test_recipe:
          setup: ["Newspaper + Account + PROBATE requirement exist"]
          setup_api_calls:
            - call: "POST /newspapers"
              payload: { name: "Springfield Times", county: "SPRINGFIELD", circulation_qualified: true, pricing_basis: "PER_LINE", chars_per_line: 40, line_rate_first_cents: 500, line_rate_subsequent_cents: 300, word_rate_cents: 50, affidavit_fee_cents: 2500, edition_line_capacity: 100, publication_weekday: 6 }
              as: PlatformAdmin
              captures: { np_id: "$.data.id"}
            - call: "POST /accounts"
              payload: { name: "Acme Law", account_type: "LAW_FIRM", credit_limit_cents: 1000000 }
              as: PlatformAdmin
              captures: { acct_id: "$.data.id"}
            - call: "POST /statutory-requirements"
              payload: { notice_type: "PROBATE", county: "SPRINGFIELD", min_insertions: 2, min_days_before_deadline: 5 }
              as: PlatformAdmin
          trigger:
            - call: "POST /notices"
              payload: { account_id: "${acct_id}", newspaper_id: "${np_id}", notice_type: "PROBATE", county: "SPRINGFIELD", title: "No Body", deadline_date: "2026-04-01" }
              as: Advertiser
              as_user_id: "${acct_id}"
          assert:
            - "response.error_id == ERR_VALIDATION"
            - "response.http_status == 400"

      - name: create_notice_invalid_notice_type_enum_rejected
        claim_type: Type Constraints
        grounds: ['entities.Notice.fields.notice_type', 'errors[ERR_VALIDATION]']
        distinguishing_aspect: "POST /notices with notice_type outside {FORECLOSURE,PROBATE,BID} -> ERR_VALIDATION (400)."
        test_recipe:
          setup: ["Newspaper + Account exist"]
          setup_api_calls:
            - call: "POST /newspapers"
              payload: { name: "Springfield Times", county: "SPRINGFIELD", circulation_qualified: true, pricing_basis: "PER_LINE", chars_per_line: 40, line_rate_first_cents: 500, line_rate_subsequent_cents: 300, word_rate_cents: 50, affidavit_fee_cents: 2500, edition_line_capacity: 100, publication_weekday: 6 }
              as: PlatformAdmin
              captures: { np_id: "$.data.id"}
            - call: "POST /accounts"
              payload: { name: "Acme Law", account_type: "LAW_FIRM", credit_limit_cents: 1000000 }
              as: PlatformAdmin
              captures: { acct_id: "$.data.id"}
          trigger:
            - call: "POST /notices"
              payload: { account_id: "${acct_id}", newspaper_id: "${np_id}", notice_type: "OBITUARY", county: "SPRINGFIELD", title: "Bad Type", body_text: "PUBLIC NOTICE: The estate of John Doe is in probate; creditors must file by date", deadline_date: "2026-04-01" }
              as: Advertiser
              as_user_id: "${acct_id}"
          assert:
            - "response.error_id == ERR_VALIDATION"
            - "response.http_status == 400"

      - name: newspaper_system_fields_generated_version_starts_one
        claim_type: System Fields
        grounds: ['entities.Newspaper.common_fields']
        distinguishing_aspect: "id/created_at/updated_at/version are system-minted; version starts at 1 on create."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /newspapers"
              payload: { name: "Springfield Times", county: "SPRINGFIELD", circulation_qualified: true, pricing_basis: "PER_LINE", chars_per_line: 40, line_rate_first_cents: 500, line_rate_subsequent_cents: 300, word_rate_cents: 50, affidavit_fee_cents: 2500, edition_line_capacity: 100, publication_weekday: 6 }
              as: PlatformAdmin
              captures: { np_id: "$.data.id", np_v: "$.data.version"}
          assert:
            - "Newspaper.${np_id}.version == 1"
            - "Newspaper.${np_id}.id is a non-empty UUID with no type prefix"

      - name: notice_word_and_line_count_computed
        claim_type: Computed Fields
        grounds: ['entities.Notice.fields.word_count', 'entities.Notice.fields.line_count', 'calculations.notice_cost']
        distinguishing_aspect: "For an 80-char, 15-word body at chars_per_line=40, word_count==15 and line_count==ceil(80/40)==2 regardless of any client-supplied value."
        test_recipe:
          setup: ["Newspaper (chars_per_line=40) + Account + PROBATE requirement exist"]
          setup_api_calls:
            - call: "POST /newspapers"
              payload: { name: "Springfield Times", county: "SPRINGFIELD", circulation_qualified: true, pricing_basis: "PER_LINE", chars_per_line: 40, line_rate_first_cents: 500, line_rate_subsequent_cents: 300, word_rate_cents: 50, affidavit_fee_cents: 2500, edition_line_capacity: 100, publication_weekday: 6 }
              as: PlatformAdmin
              captures: { np_id: "$.data.id"}
            - call: "POST /accounts"
              payload: { name: "Acme Law", account_type: "LAW_FIRM", credit_limit_cents: 1000000 }
              as: PlatformAdmin
              captures: { acct_id: "$.data.id"}
            - call: "POST /statutory-requirements"
              payload: { notice_type: "PROBATE", county: "SPRINGFIELD", min_insertions: 2, min_days_before_deadline: 5 }
              as: PlatformAdmin
          trigger:
            - call: "POST /notices"
              payload: { account_id: "${acct_id}", newspaper_id: "${np_id}", notice_type: "PROBATE", county: "SPRINGFIELD", title: "Estate of John Doe", body_text: "PUBLIC NOTICE: The estate of John Doe is in probate; creditors must file by date", deadline_date: "2026-04-01" }
              as: Advertiser
              as_user_id: "${acct_id}"
              captures: { notice_id: "$.data.id"}
          assert:
            - "Notice.${notice_id}.word_count == 15"
            - "Notice.${notice_id}.line_count == 2"
            - "Notice.${notice_id}.status == DRAFT"
            - "Notice.${notice_id}.required_insertions == 2"

  # =========================================================================
  # SECTION: state_machines
  # =========================================================================
  - section: state_machines
    instances:
      - name: publish_already_published_insertion_invalid
        claim_type: Invalid Transition
        grounds: ['state_machines.Insertion.SCHEDULED_to_PUBLISHED', 'errors[ERR_INVALID_STATE]']
        distinguishing_aspect: "Publishing an insertion already in PUBLISHED -> ERR_INVALID_STATE (409); no counter change."
        test_recipe:
          setup: ["A PROBATE notice scheduled; ins1 already PUBLISHED"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /newspapers"
              payload: { name: "Springfield Times", county: "SPRINGFIELD", circulation_qualified: true, pricing_basis: "PER_LINE", chars_per_line: 40, line_rate_first_cents: 500, line_rate_subsequent_cents: 300, word_rate_cents: 50, affidavit_fee_cents: 2500, edition_line_capacity: 100, publication_weekday: 6 }
              as: PlatformAdmin
              captures: { np_id: "$.data.id"}
            - call: "POST /accounts"
              payload: { name: "Acme Law", account_type: "LAW_FIRM", credit_limit_cents: 1000000 }
              as: PlatformAdmin
              captures: { acct_id: "$.data.id"}
            - call: "POST /statutory-requirements"
              payload: { notice_type: "PROBATE", county: "SPRINGFIELD", min_insertions: 2, min_days_before_deadline: 5 }
              as: PlatformAdmin
            - call: "POST /notices"
              payload: { account_id: "${acct_id}", newspaper_id: "${np_id}", notice_type: "PROBATE", county: "SPRINGFIELD", title: "Estate of John Doe", body_text: "PUBLIC NOTICE: The estate of John Doe is in probate; creditors must file by date", deadline_date: "2026-04-01" }
              as: Advertiser
              as_user_id: "${acct_id}"
              captures: { notice_id: "$.data.id"}
            - call: "POST /notices/${notice_id}/submit"
              as: Advertiser
              as_user_id: "${acct_id}"
            - call: "GET /notices/${notice_id}/proofs"
              as: Advertiser
              as_user_id: "${acct_id}"
              captures: { proof_id: "$.data[0].id"}
            - call: "POST /proofs/${proof_id}/approve"
              as: Advertiser
              as_user_id: "${acct_id}"
            - call: "GET /notices/${notice_id}"
              as: Advertiser
              as_user_id: "${acct_id}"
              captures: { notice_v: "$.data.version"}
            - call: "POST /notices/${notice_id}/schedule"
              payload: { first_publication_date: "2026-03-01", expected_notice_version: "${notice_v}" }
              as: Advertiser
              as_user_id: "${acct_id}"
            - call: "GET /notices/${notice_id}/insertions"
              as: Advertiser
              as_user_id: "${acct_id}"
              captures: { ins1_id: "$.data[0].id"}
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /insertions/${ins1_id}/publish"
              payload: { line_count_actual: 2 }
              as: Publisher
              as_user_id: "${np_id}"
          trigger:
            - call: "POST /insertions/${ins1_id}/publish"
              payload: { line_count_actual: 2 }
              as: Publisher
              as_user_id: "${np_id}"
          assert:
            - "response.error_id == ERR_INVALID_STATE"
            - "response.http_status == 409"
            - "Notice.${notice_id}.insertions_published == 1"

      - name: skip_make_good_insertion_rejected
        claim_type: Precondition Enforcement
        grounds: ['state_machines.Insertion.SCHEDULED_to_SKIPPED', 'entities.Insertion.fields.is_make_good', 'errors[ERR_MAKE_GOOD_NOT_SKIPPABLE]']
        distinguishing_aspect: "POST /skip on a make-good insertion (is_make_good==true) -> ERR_MAKE_GOOD_NOT_SKIPPABLE (409); no further make-good is created."
        test_recipe:
          setup: ["A PROBATE notice scheduled; ins1 SKIPPED so a make-good mg exists (SCHEDULED, is_make_good=true)"]
          setup_api_calls:
            - call: "POST /newspapers"
              payload: { name: "Springfield Times", county: "SPRINGFIELD", circulation_qualified: true, pricing_basis: "PER_LINE", chars_per_line: 40, line_rate_first_cents: 500, line_rate_subsequent_cents: 300, word_rate_cents: 50, affidavit_fee_cents: 2500, edition_line_capacity: 100, publication_weekday: 6 }
              as: PlatformAdmin
              captures: { np_id: "$.data.id"}
            - call: "POST /accounts"
              payload: { name: "Acme Law", account_type: "LAW_FIRM", credit_limit_cents: 1000000 }
              as: PlatformAdmin
              captures: { acct_id: "$.data.id"}
            - call: "POST /statutory-requirements"
              payload: { notice_type: "PROBATE", county: "SPRINGFIELD", min_insertions: 2, min_days_before_deadline: 5 }
              as: PlatformAdmin
            - call: "POST /notices"
              payload: { account_id: "${acct_id}", newspaper_id: "${np_id}", notice_type: "PROBATE", county: "SPRINGFIELD", title: "Estate of John Doe", body_text: "PUBLIC NOTICE: The estate of John Doe is in probate; creditors must file by date", deadline_date: "2026-04-01" }
              as: Advertiser
              as_user_id: "${acct_id}"
              captures: { notice_id: "$.data.id"}
            - call: "POST /notices/${notice_id}/submit"
              as: Advertiser
              as_user_id: "${acct_id}"
            - call: "GET /notices/${notice_id}/proofs"
              as: Advertiser
              as_user_id: "${acct_id}"
              captures: { proof_id: "$.data[0].id"}
            - call: "POST /proofs/${proof_id}/approve"
              as: Advertiser
              as_user_id: "${acct_id}"
            - call: "GET /notices/${notice_id}"
              as: Advertiser
              as_user_id: "${acct_id}"
              captures: { notice_v: "$.data.version"}
            - call: "POST /notices/${notice_id}/schedule"
              payload: { first_publication_date: "2026-03-01", expected_notice_version: "${notice_v}" }
              as: Advertiser
              as_user_id: "${acct_id}"
            - call: "GET /notices/${notice_id}/insertions"
              as: Advertiser
              as_user_id: "${acct_id}"
              captures: { ins1_id: "$.data[0].id"}
            - call: "POST /insertions/${ins1_id}/skip"
              as: Publisher
              as_user_id: "${np_id}"
            - call: "GET /insertions?makes_good_insertion_id=${ins1_id}"
              as: Publisher
              as_user_id: "${np_id}"
              captures: { mg_id: "$.data[0].id"}
          trigger:
            - call: "POST /insertions/${mg_id}/skip"
              as: Publisher
              as_user_id: "${np_id}"
          assert:
            - "response.error_id == ERR_MAKE_GOOD_NOT_SKIPPABLE"
            - "response.http_status == 409"
            - "Insertion.${mg_id}.status == SCHEDULED"

      - name: fk_reverse_reachability_notice_insertions
        claim_type: Parent Relationships
        grounds: ['entities.Insertion.fields.notice_id', 'endpoints.GET_/notices/{id}/insertions']
        distinguishing_aspect: "GET /notices/{id}/insertions returns the 2 scheduled children ordered by scheduled_date ASC."
        test_recipe:
          setup: ["A PROBATE notice scheduled with 2 insertions (03-01, 03-08)"]
          setup_api_calls:
            - call: "POST /newspapers"
              payload: { name: "Springfield Times", county: "SPRINGFIELD", circulation_qualified: true, pricing_basis: "PER_LINE", chars_per_line: 40, line_rate_first_cents: 500, line_rate_subsequent_cents: 300, word_rate_cents: 50, affidavit_fee_cents: 2500, edition_line_capacity: 100, publication_weekday: 6 }
              as: PlatformAdmin
              captures: { np_id: "$.data.id"}
            - call: "POST /accounts"
              payload: { name: "Acme Law", account_type: "LAW_FIRM", credit_limit_cents: 1000000 }
              as: PlatformAdmin
              captures: { acct_id: "$.data.id"}
            - call: "POST /statutory-requirements"
              payload: { notice_type: "PROBATE", county: "SPRINGFIELD", min_insertions: 2, min_days_before_deadline: 5 }
              as: PlatformAdmin
            - call: "POST /notices"
              payload: { account_id: "${acct_id}", newspaper_id: "${np_id}", notice_type: "PROBATE", county: "SPRINGFIELD", title: "Estate of John Doe", body_text: "PUBLIC NOTICE: The estate of John Doe is in probate; creditors must file by date", deadline_date: "2026-04-01" }
              as: Advertiser
              as_user_id: "${acct_id}"
              captures: { notice_id: "$.data.id"}
            - call: "POST /notices/${notice_id}/submit"
              as: Advertiser
              as_user_id: "${acct_id}"
            - call: "GET /notices/${notice_id}/proofs"
              as: Advertiser
              as_user_id: "${acct_id}"
              captures: { proof_id: "$.data[0].id"}
            - call: "POST /proofs/${proof_id}/approve"
              as: Advertiser
              as_user_id: "${acct_id}"
            - call: "GET /notices/${notice_id}"
              as: Advertiser
              as_user_id: "${acct_id}"
              captures: { notice_v: "$.data.version"}
            - call: "POST /notices/${notice_id}/schedule"
              payload: { first_publication_date: "2026-03-01", expected_notice_version: "${notice_v}" }
              as: Advertiser
              as_user_id: "${acct_id}"
          trigger:
            - call: "GET /notices/${notice_id}/insertions"
              as: Advertiser
              as_user_id: "${acct_id}"
          assert:
            - "response is an array of exactly 2 Insertion rows"
            - "data[0].sequence_number == 1 and data[0].scheduled_date == 2026-03-01"
            - "data[1].sequence_number == 2 and data[1].scheduled_date == 2026-03-08"

  # =========================================================================
  # SECTION: calculations
  # =========================================================================
  - section: calculations
    instances:
      - name: compliance_status_non_compliant_when_makegood_runs_past_cutoff
        claim_type: Correct Result
        grounds: ['calculations.compliance_status', 'entities.Notice.fields.compliance_status']
        distinguishing_aspect: |
          With deadline 2026-03-13 (cutoff 2026-03-08), skipping insertion 2 pushes its make-good to
          2026-03-15; publishing insertion 1 (03-01) and the make-good (03-15) meets the count
          (insertions_published==2) but the last published date 03-15 > cutoff 03-08, so
          compliance_status == NON_COMPLIANT.
        test_recipe:
          setup: ["PROBATE notice, deadline 2026-03-13, scheduled 03-01/03-08; ins2 skipped -> make-good 03-15"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /newspapers"
              payload: { name: "Springfield Times", county: "SPRINGFIELD", circulation_qualified: true, pricing_basis: "PER_LINE", chars_per_line: 40, line_rate_first_cents: 500, line_rate_subsequent_cents: 300, word_rate_cents: 50, affidavit_fee_cents: 2500, edition_line_capacity: 100, publication_weekday: 6 }
              as: PlatformAdmin
              captures: { np_id: "$.data.id"}
            - call: "POST /accounts"
              payload: { name: "Acme Law", account_type: "LAW_FIRM", credit_limit_cents: 1000000 }
              as: PlatformAdmin
              captures: { acct_id: "$.data.id"}
            - call: "POST /statutory-requirements"
              payload: { notice_type: "PROBATE", county: "SPRINGFIELD", min_insertions: 2, min_days_before_deadline: 5 }
              as: PlatformAdmin
            - call: "POST /notices"
              payload: { account_id: "${acct_id}", newspaper_id: "${np_id}", notice_type: "PROBATE", county: "SPRINGFIELD", title: "Estate of John Doe", body_text: "PUBLIC NOTICE: The estate of John Doe is in probate; creditors must file by date", deadline_date: "2026-03-13" }
              as: Advertiser
              as_user_id: "${acct_id}"
              captures: { notice_id: "$.data.id"}
            - call: "POST /notices/${notice_id}/submit"
              as: Advertiser
              as_user_id: "${acct_id}"
            - call: "GET /notices/${notice_id}/proofs"
              as: Advertiser
              as_user_id: "${acct_id}"
              captures: { proof_id: "$.data[0].id"}
            - call: "POST /proofs/${proof_id}/approve"
              as: Advertiser
              as_user_id: "${acct_id}"
            - call: "GET /notices/${notice_id}"
              as: Advertiser
              as_user_id: "${acct_id}"
              captures: { notice_v: "$.data.version"}
            - call: "POST /notices/${notice_id}/schedule"
              payload: { first_publication_date: "2026-03-01", expected_notice_version: "${notice_v}" }
              as: Advertiser
              as_user_id: "${acct_id}"
            - call: "GET /notices/${notice_id}/insertions"
              as: Advertiser
              as_user_id: "${acct_id}"
              captures: { ins1_id: "$.data[0].id", ins2_id: "$.data[1].id"}
            - call: "POST /insertions/${ins2_id}/skip"
              as: Publisher
              as_user_id: "${np_id}"
            - call: "GET /insertions?makes_good_insertion_id=${ins2_id}"
              as: Publisher
              as_user_id: "${np_id}"
              captures: { mg_id: "$.data[0].id"}
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /insertions/${ins1_id}/publish"
              payload: { line_count_actual: 2 }
              as: Publisher
              as_user_id: "${np_id}"
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-15T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /insertions/${mg_id}/publish"
              payload: { line_count_actual: 2 }
              as: Publisher
              as_user_id: "${np_id}"
          assert:
            - "Notice.${notice_id}.insertions_published == 2"
            - "Notice.${notice_id}.compliance_status == NON_COMPLIANT"
            - "Notice.${notice_id}.status == PUBLISHED"

  # =========================================================================
  # SECTION: validations
  # =========================================================================
  - section: validations
    instances:
      - name: missing_auth_headers_rejected
        claim_type: Violation → Error
        grounds: ['validations[priority=1]', 'errors[ERR_UNAUTHENTICATED]']
        distinguishing_aspect: "A request without X-User-Role/X-User-ID headers -> ERR_UNAUTHENTICATED (401)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /notices"
              payload: {}
              as: NONE
          assert:
            - "response.error_id == ERR_UNAUTHENTICATED"
            - "response.http_status == 401"

      - name: schedule_invalid_publication_day_rejected
        claim_type: Violation → Error
        grounds: ['validations[priority=7]', 'calculations.insertion_schedule', 'errors[ERR_INVALID_PUBLICATION_DAY]']
        distinguishing_aspect: "first_publication_date 2026-03-02 (Monday, weekday 0) != publication_weekday 6 -> ERR_INVALID_PUBLICATION_DAY (422)."
        test_recipe:
          setup: ["A PROBATE notice in PROOF_APPROVED"]
          setup_api_calls:
            - call: "POST /newspapers"
              payload: { name: "Springfield Times", county: "SPRINGFIELD", circulation_qualified: true, pricing_basis: "PER_LINE", chars_per_line: 40, line_rate_first_cents: 500, line_rate_subsequent_cents: 300, word_rate_cents: 50, affidavit_fee_cents: 2500, edition_line_capacity: 100, publication_weekday: 6 }
              as: PlatformAdmin
              captures: { np_id: "$.data.id"}
            - call: "POST /accounts"
              payload: { name: "Acme Law", account_type: "LAW_FIRM", credit_limit_cents: 1000000 }
              as: PlatformAdmin
              captures: { acct_id: "$.data.id"}
            - call: "POST /statutory-requirements"
              payload: { notice_type: "PROBATE", county: "SPRINGFIELD", min_insertions: 2, min_days_before_deadline: 5 }
              as: PlatformAdmin
            - call: "POST /notices"
              payload: { account_id: "${acct_id}", newspaper_id: "${np_id}", notice_type: "PROBATE", county: "SPRINGFIELD", title: "Estate of John Doe", body_text: "PUBLIC NOTICE: The estate of John Doe is in probate; creditors must file by date", deadline_date: "2026-04-01" }
              as: Advertiser
              as_user_id: "${acct_id}"
              captures: { notice_id: "$.data.id"}
            - call: "POST /notices/${notice_id}/submit"
              as: Advertiser
              as_user_id: "${acct_id}"
            - call: "GET /notices/${notice_id}/proofs"
              as: Advertiser
              as_user_id: "${acct_id}"
              captures: { proof_id: "$.data[0].id"}
