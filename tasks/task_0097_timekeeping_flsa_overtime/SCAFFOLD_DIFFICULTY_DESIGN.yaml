              as: PayrollAdmin
              captures: { e_b: $.data.id }
            - call: "POST /shifts"
              payload: { employee_id: "${e_a}", worksite_id: "${ws_ca}", scheduled_start: "2026-06-01T08:00:00Z", scheduled_end: "2026-06-01T18:00:00Z" }
              as: Supervisor
              captures: { sh_a: $.data.id }
            - call: "POST /shifts/${sh_a}/punches"
              payload: { clock_in: "2026-06-01T08:00:00Z" }
              as: Employee
              as_user_id: "${e_a}"
              captures: { p_a: $.data.id }
            - call: "POST /punches/${p_a}/close"
              payload: { clock_out: "2026-06-01T18:00:00Z" }
              as: Employee
              as_user_id: "${e_a}"
            - call: "POST /shifts"
              payload: { employee_id: "${e_b}", worksite_id: "${ws_ca}", scheduled_start: "2026-06-01T08:00:00Z", scheduled_end: "2026-06-01T13:00:00Z" }
              as: Supervisor
              captures: { sh_b: $.data.id }
            - call: "POST /shifts/${sh_b}/punches"
              payload: { clock_in: "2026-06-01T08:00:00Z" }
              as: Employee
              as_user_id: "${e_b}"
              captures: { p_b: $.data.id }
            - call: "POST /punches/${p_b}/close"
              payload: { clock_out: "2026-06-01T13:00:00Z" }
              as: Employee
              as_user_id: "${e_b}"
            - call: "POST /tip-pools"
              payload: { worksite_id: "${ws_ca}", workday_date: "2026-06-01" }
              as: Supervisor
              captures: { pool: $.data.id }
            - call: "POST /tip-declarations"
              payload: { employee_id: "${e_a}", workday_date: "2026-06-01", declared_cents: 6000, pool_id: "${pool}" }
              as: Employee
              as_user_id: "${e_a}"
            - call: "POST /tip-declarations"
              payload: { employee_id: "${e_b}", workday_date: "2026-06-01", declared_cents: 4000, pool_id: "${pool}" }
              as: Employee
              as_user_id: "${e_b}"
          trigger:
            - call: "POST /tip-pools/${pool}/distribute"
              payload: {}
              as: Supervisor
              captures: { pooled: $.data.pooled_cents, distributed: $.data.distributed_cents }
          assert:
            - "TipPool.${pool}.pooled_cents == 10000"
            - "TipPool.${pool}.distributed_cents == 10000"
            - "TipPool.${pool}.status == DISTRIBUTED"
