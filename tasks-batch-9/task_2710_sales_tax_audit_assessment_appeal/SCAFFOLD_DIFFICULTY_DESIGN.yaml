              payload: { project_name: "Hardware K2", industry_naics_code: "444140", industry_error_rate_bp: 3000, selection_mode: "THRESHOLD", selection_threshold_score: 0, selection_quota: 2 }
              as: SelectionAnalyst
              captures: { projk_id: "$.data.id" }
            - call: "POST /industry-projects/${projk_id}/selection-runs"
              payload: {}
              as: SelectionAnalyst
            - call: "GET /audit-leads"
              payload: { industry_project_id: "${projk_id}", status: "SELECTED" }
              as: SelectionAnalyst
              captures: { leadk_id: "$.data[0].id" }
            - call: "POST /audit-leads/${leadk_id}/convert"
              payload: { lead_auditor_user_id: "auditor-1", audit_type: "DESK" }
              as: AuditSupervisor
              as_user_id: "supervisor-1"
              captures: { audit_id: "$.data.id" }
            - call: "POST /audits/${audit_id}/scope"
              payload: { audit_type: "DESK", scope_period_start: "2026-01-01", scope_period_end: "2026-06-30" }
              as: FieldAuditor
              as_user_id: "auditor-1"
            - call: "POST /statute-waivers"
              payload: { audit_id: "${audit_id}", covers_period_end: "2026-06-30", extended_to_date: "2030-06-29", signed_by_name: "T. Alvarez" }
              as: AuditSupervisor
              as_user_id: "supervisor-1"
              captures: { wv_id: "$.data.id" }
          trigger:
            - call: "POST /statute-waivers/${wv_id}/execute"
              payload: { signed_date: "2026-07-15" }
              as: Taxpayer
              as_user_id: "${tk_id}"
            - call: "POST /statute-waivers/${wv_id}/void"
              payload: { void_reason: "Signature obtained from an unauthorized officer" }
              as: AuditSupervisor
              as_user_id: "supervisor-1"
          assert:
            - "before the trigger: Audit.${audit_id}.base_statute_expiry_date == 2029-06-29, statute_expiry_date == 2029-06-29, waiver_days_added == 0, statute_status == PROTECTED"
            - "trigger call 1: StatuteWaiver.${wv_id}.status == EXECUTED, prior_expiry_date == 2029-06-29, days_added == 365"
            - "trigger call 1: Audit.${audit_id}.statute_expiry_date == 2030-06-29 and waiver_days_added == 365"
            - "trigger call 2: StatuteWaiver.${wv_id}.status == VOIDED and days_added == 0"
            - "trigger call 2: Audit.${audit_id}.statute_expiry_date == 2029-06-29 and waiver_days_added == 0"
            - "trigger call 2: Audit.${audit_id}.statute_status == PROTECTED and tolled_days == 0"

      - name: lead_decline_promotion_preserves_the_quota_identity
        grounds:
          - endpoints.POST /audit-leads/{id}/decline
          - entities.IndustryProject.fields.selections_used
          - entities.IndustryProject.fields.selections_remaining
          - state_machines.AuditLead
          - calculations.taxpayer_risk_score
        distinguishing_aspect: |
          A HYBRID project with quota 2 over three scored taxpayers selects ranks 1 and 2
          (349 and 314) and waitlists rank 3 (172). Declining the rank-2 lead must free
          the slot AND immediately re-consume it by promoting the waitlisted lead, so the
          identity selection_quota == selections_used + selections_remaining still reads
          2 == 2 + 0. Releasing without promoting leaves 2 == 1 + 1; promoting without
          releasing leaves 2 == 3 + (-1).
        test_recipe:
          setup:
            - "Three taxpayers on NAICS 445110 scored by one HYBRID project with industry_error_rate_bp 4200, selection_threshold_score 172 and selection_quota 2."
            - "Vantage Beverage: reported 200000000 / matched 100000000, delinquent 0, gross 1000000000, prior 6000 -> FULL 349 (rank 1). Harbor Foods: reported 120000000 / matched 90000000, delinquent 2, gross 250000000, prior null -> FULL 314 (rank 2). Summit Market: no information returns, delinquent 1, gross 100000000, prior null -> FULL 172 (rank 3, exactly at the threshold)."
          setup_api_calls:
            - call: "POST /taxpayers"
              payload: { legal_name: "Vantage Beverage Co", permit_number: "P-2710-K3A", industry_naics_code: "445110", filing_frequency: "MONTHLY", gross_receipts_annual_cents: 1000000000, delinquent_period_count: 0, prior_audit_error_rate_bp: 6000 }
              as: SelectionAnalyst
              captures: { t_van: "$.data.id" }
            - call: "POST /information-returns"
              payload: { taxpayer_id: "${t_van}", source_type: "MARKETPLACE_REPORT", period_start: "2026-01-01", period_end: "2026-03-31", reported_amount_cents: 200000000, matched_return_amount_cents: 100000000 }
              as: SelectionAnalyst
            - call: "POST /taxpayers"
              payload: { legal_name: "Harbor Foods LLC", permit_number: "P-2710-K3B", industry_naics_code: "445110", filing_frequency: "MONTHLY", gross_receipts_annual_cents: 250000000, delinquent_period_count: 2 }
              as: SelectionAnalyst
              captures: { t_har: "$.data.id" }
            - call: "POST /information-returns"
              payload: { taxpayer_id: "${t_har}", source_type: "FEDERAL_1099K", period_start: "2026-01-01", period_end: "2026-03-31", reported_amount_cents: 120000000, matched_return_amount_cents: 90000000 }
              as: SelectionAnalyst
            - call: "POST /taxpayers"
              payload: { legal_name: "Summit Market Inc", permit_number: "P-2710-K3C", industry_naics_code: "445110", filing_frequency: "QUARTERLY", gross_receipts_annual_cents: 100000000, delinquent_period_count: 1 }
              as: SelectionAnalyst
              captures: { t_sum: "$.data.id" }
            - call: "POST /industry-projects"
              payload: { project_name: "Grocery quota identity", industry_naics_code: "445110", industry_error_rate_bp: 4200, selection_mode: "HYBRID", selection_threshold_score: 172, selection_quota: 2 }
              as: SelectionAnalyst
              captures: { proj_id: "$.data.id" }
            - call: "POST /industry-projects/${proj_id}/selection-runs"
              payload: {}
              as: SelectionAnalyst
            - call: "GET /audit-leads"
              payload: { industry_project_id: "${proj_id}", taxpayer_id: "${t_har}" }
              as: SelectionAnalyst
              captures: { lead_har: "$.data[0].id" }
            - call: "GET /audit-leads"
              payload: { industry_project_id: "${proj_id}", taxpayer_id: "${t_sum}" }
              as: SelectionAnalyst
              captures: { lead_sum: "$.data[0].id" }
          trigger:
            - call: "POST /audit-leads/${lead_har}/decline"
              payload: { decline_reason: "Taxpayer already under federal examination" }
              as: AuditSupervisor
              as_user_id: "supervisor-1"
          assert:
            - "before the trigger: IndustryProject.${proj_id}.scored_lead_count == 3, selections_used == 2, selections_remaining == 0, last_cutoff_score == 314"
            - "before the trigger: AuditLead.${lead_har}.risk_score == 314 and rank_position == 2 and status == SELECTED; AuditLead.${lead_sum}.risk_score == 172 and rank_position == 3 and status == SCORED"
            - "AuditLead.${lead_har}.status == DECLINED"
            - "AuditLead.${lead_sum}.status == SELECTED and promoted_from_scored == true"
            - "IndustryProject.${proj_id}.selections_used == 2 and selections_remaining == 0"
            - "IndustryProject.${proj_id}.selection_quota == selections_used + selections_remaining"
            - "Taxpayer.${t_van}.open_audit_count == 0 and Taxpayer.${t_sum}.open_audit_count == 0"
