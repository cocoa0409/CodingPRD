  - rule_id: resource_temporal_overlap
    instances:

      - name: sanitation_buffered_slot_interval_touches_legally_at_ten_forty
        grounds:
          - calculations.slot_occupancy_conflict
          - calculations.slot_occupancy_conflict.constants.SANITATION_BUFFER_MINUTES
          - entities.ProductionBatch.fields.occupancy_end_at
          - entities.ProductionBatch.fields.slot_index
          - errors[ERR_UNIT_SLOT_CONFLICT]
          - validations[priority=25]
        distinguishing_aspect: |
          EXCLUSIVE-BUFFERED single-occupant geometry with the sanitation window folded into the right
          bound: pretzel occupancy is bake 25 + hold 240 + buffer 15 = 280 minutes, so batch A starting
          06:00 owns slot 1 until 10:40. A start at 10:39 is rejected and a start at exactly 10:40 is
          accepted, which pins BOTH the half-open comparison and the fact that the 15-minute buffer is
          inside occupancy_end_at rather than added on top of it. An implementation that omits the buffer
          accepts 10:39, and one that compares with <= rejects 10:40.
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T06:00:00Z; store still in its initial BREAKFAST daypart"
            - "one BAKERY_CASE unit BC-1 with 2 slots; all three batch attempts target slot 1"
            - "batch A is left in PLANNED - PLANNED, BAKING and HOLDING all occupy the slot"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T06:00:00Z" }
              as: ChainAdmin
            - call: "POST /stores"
              payload: { store_code: "WAWA-0101", name: "Wawa Route 1", hot_case_slot_capacity: 4, pickup_slot_capacity: 2, is_fuel_site: false }
              as: ChainAdmin
              captures: { store_id: $.data.id }
