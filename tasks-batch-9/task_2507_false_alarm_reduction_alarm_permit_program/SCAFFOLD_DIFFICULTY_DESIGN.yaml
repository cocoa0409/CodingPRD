                effective_from: "2026-01-01T00:00:00Z"
                free_alarm_allowance: 0
                probation_threshold_count: 1
                suspension_threshold_count: 1
                invoice_due_days: 3650
                fee_tiers:
                  - {from_index: 1, to_index: null, base_fee_cents: 10000}
              as: ProgramAdministrator
              captures: {sched_a: $.data.id}
            - {call: "POST /false-alarm-program/fee-schedules/${sched_a}/activate", payload: {}, as: ProgramAdministrator}
            - {call: "POST /false-alarm-program/alarm-companies", payload: {legal_name: "Pair A Monitoring LLC", license_number: "AC-2507-PA", contact_email: "ops@paira2507.example", contact_phone: "+15550102101", score_mode: "PERIOD_EQUAL"}, as: ProgramAdministrator, captures: {company_a: $.data.id}}
            - {call: "POST /false-alarm-program/alarm-sites", payload: {address_key: "2507-PA-9-GATEWAY-CT", street_address: "9 Gateway Ct", city: "Fairview", zip_code: "44011", occupancy_class: "RESIDENTIAL", police_beat: "B02"}, as: PermitClerk, captures: {site_a: $.data.id}}
            - {call: "POST /false-alarm-program/site-contacts", payload: {alarm_site_id: "${site_a}", full_name: "Ana Duval", phone_number: "+15550102102", relationship: "OWNER", contact_priority: 1, is_ecv_callable: true}, as: PermitClerk, captures: {ac1: $.data.id}}
            - {call: "POST /false-alarm-program/site-contacts", payload: {alarm_site_id: "${site_a}", full_name: "Bo Duval", phone_number: "+15550102103", relationship: "SPOUSE", contact_priority: 2, is_ecv_callable: true}, as: PermitClerk, captures: {ac2: $.data.id}}
            - {call: "POST /false-alarm-program/site-contacts", payload: {alarm_site_id: "${site_a}", full_name: "Cy Duval", phone_number: "+15550102104", relationship: "NEIGHBOR", contact_priority: 3, is_ecv_callable: true}, as: PermitClerk, captures: {ac3: $.data.id}}
            - {call: "POST /false-alarm-program/alarm-systems", payload: {alarm_site_id: "${site_a}", monitoring_company_id: "${company_a}", system_type: "BURGLARY", zone_count: 4, ecv_enabled: true, verified_response_mode: "NONE", installed_at: "2025-12-01T00:00:00Z"}, as: ProgramAdministrator, captures: {sys_a: $.data.id}}
            - {call: "POST /false-alarm-program/alarm-systems", payload: {alarm_site_id: "${site_a}", monitoring_company_id: "${company_a}", system_type: "BURGLARY", zone_count: 4, ecv_enabled: true, verified_response_mode: "NONE", installed_at: "2025-12-01T00:00:00Z"}, as: ProgramAdministrator, captures: {sys_b: $.data.id}}
            - {call: "POST /false-alarm-program/alarm-systems", payload: {alarm_site_id: "${site_a}", monitoring_company_id: "${company_a}", system_type: "BURGLARY", zone_count: 4, ecv_enabled: true, verified_response_mode: "NONE", installed_at: "2025-12-01T00:00:00Z"}, as: ProgramAdministrator, captures: {sys_c: $.data.id}}
