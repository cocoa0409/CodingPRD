  - rule_id: non_linear_state_machine
    instances:
      - name: scan_job_retry_loop_capped_then_abandoned
        grounds:
          - state_machines.ScanJob.FAILED_to_QUEUED
          - state_machines.ScanJob.IN_PROGRESS_to_ABANDONED
          - entities.ScanJob.fields.retry_count
          - errors[ERR_SCAN_RETRY_EXHAUSTED]
        distinguishing_aspect: |
          ScanJob is CYCLIC: QUEUED -> IN_PROGRESS -> FAILED -> QUEUED runs exactly MAX_SCAN_RETRIES
          times and the third failure lands in ABANDONED instead of FAILED, so the loop is bounded by
          a counter rather than by an external state.
        test_recipe:
          setup:
            - "An ACTIVE box with a RELEASABLE recipient and one matched LETTER."
            - "One COVER ScanJob of 10 pages, already failed and retried twice so retry_count is 2 and status is IN_PROGRESS."
          setup_api_calls:
            - call: "POST /plan-tiers"
              payload: { tier_code: "PLUS", name: "Plus", rank: 2, monthly_fee_cents: 6000, included_recipients: 3, included_scan_pages: 50, included_forwards: 2, included_storage_days: 60, overage_scan_page_cents: 25, overage_forward_cents: 900, overage_storage_day_cents: 30, overage_recipient_cents: 500, allows_overage: true }
              as: PlatformAdmin
              captures: { plan_id: "$.data.id" }
            - call: "POST /boxes"
              payload: { box_number: "E-501", plan_tier_id: "${plan_id}", holder_name: "Ivy Scan", holder_email: "ivy@example.com", security_deposit_cents: 0, extra_recipient_slots: 0, prepaid_balance_cents: 0 }
              as: CmraOperator
              captures: { box_id: "$.data.id" }
            - call: "POST /boxes/${box_id}/activate"
              payload: {}
              as: CmraOperator
            - call: "POST /boxes/${box_id}/recipients"
              payload: { legal_name: "Ivy Scan", recipient_kind: "INDIVIDUAL", signature_authorization_on_file: false }
              as: CmraOperator
