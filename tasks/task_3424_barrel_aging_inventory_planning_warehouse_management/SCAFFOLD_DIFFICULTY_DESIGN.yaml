  - rule_id: transitive_cascade
    instances:
      - name: commission_cascade_materializes_slots_and_posture
        grounds:
          - "state_machines.CapacityExpansionProject.APPROVED_to_COMMISSIONED"
          - "state_machines.Rickhouse.PLANNED_to_OPERATING"
          - calculations.rickhouse_posture
        distinguishing_aspect: |
          Depth-3 chain from the commission trigger: (1) project APPROVED -> COMMISSIONED
          causes (2) rickhouse PLANNED -> OPERATING, which causes (3) materialization of
          8 WarehouseSlots with per-floor heat factors, which causes (4) the posture
          recompute pinning OPERATING at 0/8 occupancy. Each link is caused by the
          previous link, not by the original call.
        test_recipe:
          setup:
            - "Project approved at 2026-09-01 with construction_lag_months 24; clock advanced exactly 720 days to 2028-08-21."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /barrel-aging/expansion-projects"
              payload: { name: "RH-CC", region_code: "KY", floors: 2, rows_per_floor: 2, positions_per_row: 2, construction_lag_months: 24, planned_annual_distillation_liters: 80000 }
              as: DistilleryPlanner
              captures: { proj_id: $.data.id }
            - call: "POST /barrel-aging/expansion-projects/${proj_id}/approve"
              as: OperationsDirector
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2028-08-21T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /barrel-aging/expansion-projects/${proj_id}/commission"
              as: OperationsDirector
            - call: "GET /barrel-aging/rickhouses?expansion_project_id=${proj_id}"
              as: PlatformAdmin
              captures: { rh_id: "$.data[0].id" }
            - call: "GET /barrel-aging/rickhouses/${rh_id}/slots"
              as: PlatformAdmin
          assert:
            - "CapacityExpansionProject.${proj_id}.state == COMMISSIONED and commissioned_at == 2028-08-21T00:00:00Z"
            - "Rickhouse.${rh_id}.posture == OPERATING (link 2: PLANNED -> OPERATING)"
            - "Rickhouse.${rh_id}.total_slots == 8 and occupied_slots == 0 (link 4: posture recompute)"
            - "exactly 8 WarehouseSlots exist for the rickhouse (link 3: 2 floors x 2 rows x 2 positions)"
            - "the 5th slot in (floor,row,position) order has floor_index == 2 and heat_factor == 1.05"

      - name: dump_cascade_frees_slot_and_flips_posture
        grounds:
          - "state_machines.Barrel(maturation_status).AGING_to_DUMPED"
          - "state_machines.SlotOccupancy.OPEN_to_CLOSED"
          - "state_machines.Rickhouse.FULL_to_OPERATING"
        distinguishing_aspect: |
          Different trigger than the commission chain, depth 3: the dump call causes
          (1) barrel maturation -> DUMPED, which causes (2) its OPEN occupancy to close,
          which frees the slot and causes (3) occupied_slots 4 -> 3 and the rickhouse
          posture to flip FULL -> OPERATING. A single fan-out would not explain the
          posture flip depending on the occupancy close.
        test_recipe:
          setup:
            - "Rickhouse 1x2x2 (4 slots) commissioned; four barrels filled at 2028-09-01 so occupied_slots == 4 and posture == FULL."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /barrel-aging/expansion-projects"
              payload: { name: "RH-DC", region_code: "KY", floors: 1, rows_per_floor: 2, positions_per_row: 2, construction_lag_months: 24, planned_annual_distillation_liters: 50000 }
              as: DistilleryPlanner
              captures: { proj_id: $.data.id }
            - call: "POST /barrel-aging/expansion-projects/${proj_id}/approve"
              as: OperationsDirector
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2028-08-21T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /barrel-aging/expansion-projects/${proj_id}/commission"
              as: OperationsDirector
            - call: "GET /barrel-aging/rickhouses?expansion_project_id=${proj_id}"
              as: PlatformAdmin
              captures: { rh_id: "$.data[0].id" }
            - call: "GET /barrel-aging/rickhouses/${rh_id}/slots"
              as: PlatformAdmin
              captures: { s1: "$.data[0].id", s2: "$.data[1].id", s3: "$.data[2].id", s4: "$.data[3].id" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2028-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /barrel-aging/barrels"
              payload: { slot_id: "${s1}", wood_origin: "AMERICAN_WHITE_OAK", seasoning_months: 12, char_level: 3, spirit_type: "BOURBON", fill_proof: 125.0, fill_volume_liters: 100.0, min_maturation_months: 12 }
              as: WarehouseManager
              captures: { b1: $.data.id }
            - call: "POST /barrel-aging/barrels"
              payload: { slot_id: "${s2}", wood_origin: "AMERICAN_WHITE_OAK", seasoning_months: 12, char_level: 3, spirit_type: "BOURBON", fill_proof: 125.0, fill_volume_liters: 100.0, min_maturation_months: 12 }
              as: WarehouseManager
            - call: "POST /barrel-aging/barrels"
              payload: { slot_id: "${s3}", wood_origin: "AMERICAN_WHITE_OAK", seasoning_months: 12, char_level: 3, spirit_type: "BOURBON", fill_proof: 125.0, fill_volume_liters: 100.0, min_maturation_months: 12 }
              as: WarehouseManager
            - call: "POST /barrel-aging/barrels"
              payload: { slot_id: "${s4}", wood_origin: "AMERICAN_WHITE_OAK", seasoning_months: 12, char_level: 3, spirit_type: "BOURBON", fill_proof: 125.0, fill_volume_liters: 100.0, min_maturation_months: 12 }
              as: WarehouseManager
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2028-10-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /barrel-aging/barrels/${b1}/dump"
              as: WarehouseManager
            - call: "GET /barrel-aging/rickhouses/${rh_id}"
              as: WarehouseManager
            - call: "GET /barrel-aging/barrels/${b1}/occupancies"
              as: WarehouseManager
          assert:
            - "Barrel.${b1}.maturation_status == DUMPED (link 1)"
            - "Barrel.${b1}'s occupancy is CLOSED with end_at == 2028-10-01T00:00:00Z (link 2)"
            - "Rickhouse.${rh_id}.occupied_slots == 3 (link 3)"
            - "Rickhouse.${rh_id}.posture == OPERATING (link 3: FULL -> OPERATING flip)"

