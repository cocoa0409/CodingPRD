              as: Dispatcher
              captures: { reg_zoe_id: $.data.id }
            - call: "POST /hiring-hall/registrations"
              payload: { member_id: "${m_ash_id}", list_id: "${g1_id}" }
              as: Dispatcher
              captures: { reg_ash_id: $.data.id }
            - call: "POST /hiring-hall/contractors"
              payload: { name: "Lakeside Mechanical", agreement_expires_at: "2027-06-30T00:00:00.000Z", signatory_status: "SIGNATORY" }
              as: HallAdmin
              captures: { lake_id: $.data.id }
            - call: "POST /hiring-hall/job-requests"
              payload: { contractor_id: "${lake_id}", job_site: "Boiler House A", journeyworkers_requested: 1, apprentices_requested: 0, expected_duration_days: 30, report_at: "2026-09-25T07:00:00.000Z", hourly_rate_cents: 5300 }
              as: ContractorRep
