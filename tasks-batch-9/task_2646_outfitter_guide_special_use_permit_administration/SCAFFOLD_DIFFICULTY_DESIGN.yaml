            - "ONE UNCOVERED DAY: the trigger returns ERR_INSURANCE_COVERAGE_GAP with HTTP 422, because C1 ends 2027-12-31 and C2 starts 2028-01-02, leaving 2028-01-01 uncovered inside the closed term 2027-01-01 .. 2028-12-31"
            - "Permit.insurance_current is TRUE at that moment — at least one ACTIVE endorsed certificate at or above 100000000 cents exists — which proves the gap check is an interval-union test that insurance_current cannot substitute for"
            - "every other activation precondition is already satisfied: an APPROVED 2027 plan, bond_current true, authorized_client_capacity_total 12 equal to party_size_max, compliance_status COMPLIANT and indemnification_acknowledged true, so the coverage gap is the only obstruction"
            - "CONTIGUOUS BY ONE DAY: filing C3 for 2028-01-01 .. 2028-12-31 makes the union contiguous, since C3 starts exactly the day after C1 expires, and the identical activate call then succeeds with HTTP 200 and the permit reads ACTIVE"
            - "C2 is fully contained in C3's closed interval and therefore moves to SUPERSEDED when C3 is filed, while C1 stays ACTIVE — a superseded certificate contributes nothing to the union"
            - "the permit stayed ISSUED across the refused activation, with no version churn beyond the certificate write itself"
            - "closed-interval semantics are load-bearing in both directions: coverage ending exactly on term_end_date 2028-12-31 is sufficient, and coverage starting exactly on term_start_date 2027-01-01 is sufficient — neither endpoint needs to be strictly beyond the term"

  - rule_id: compensating_invariant
    instances:

      - name: service_day_conservation_across_hold_and_release
        grounds:
          - calculations.service_day_conservation
          - calculations.use_area_service_day_availability
          - endpoints.GET_/osup/use-areas/{id}/allocation-summary
        distinguishing_aspect: |
          CONSERVED QUANTITY: SERVICE DAYS on one UseArea — allocatable_service_days must always equal
          committed + pending + available, across five different writes that each move days between
          the three buckets by three different mechanisms (a screening moves available -> pending, an
          issuance moves pending -> committed, and a withdraw and a deny each move pending ->
          available). No write may create or destroy a day. The compensating pair is the withdraw and
          the deny: each undoes a screening exactly, so the area must land back on the identical
          triple it held before that screening, including demand_ratio and allocation_posture.
        test_recipe:
          setup:
            - "logical clock at 2027-01-05T00:00:00Z"
            - "UseArea BRW-01 with total_allocated_service_days 1000 and reserved_admin_service_days 100, so allocatable_service_days is 900"
            - "PUBLISHED 2027 needs assessment with determined_capacity_service_days 900 and NEED_EXISTS"
            - "three outfitters — Alpine (700 days requested), Beta (150) and Cedar (50) — each with a SUBMITTED 2027 application"
          setup_api_calls:
            - call: "POST /osup/_clock/set_current_utc"
              payload: { to_iso8601: "2027-01-05T00:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /osup/use-areas"
              payload: { area_code: "BRW-01", name: "Bear River Wilderness", total_allocated_service_days: 1000, season_year: 2027, season_open_date: "2027-05-15", season_close_date: "2027-09-30", party_size_max: 12, max_clients_per_guide: 8, reserved_admin_service_days: 100, min_liability_coverage_cents: 100000000 }
