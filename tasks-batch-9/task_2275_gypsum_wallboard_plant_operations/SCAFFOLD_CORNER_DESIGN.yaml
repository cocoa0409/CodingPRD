      - name: stucco_reservation_beyond_the_available_balance
        claim_type: error_triggerable
        grounds:
          - errors[ERR_STUCCO_INSUFFICIENT]
        excluded_because:
          difficulty_instance: combinatorial_formula / run_capacity_reservation_pinned_step_order
          rationale: "That instance requests 400.000 MSF, is clamped to 312.000 by capacity, and shows the resulting 210.600 t reservation exceed the 204.530 t balance."

      - name: fourth_assay_on_one_lot
        claim_type: error_triggerable
        grounds:
          - errors[ERR_MAX_ASSAYS_REACHED]
        excluded_because:
          difficulty_instance: non_linear_state_machine / lot_quarantine_reassay_cycle_bounded_at_three
          rationale: "That instance exhausts the three permitted assays through the quarantine loop and shows the fourth refused."

      - name: outage_approval_in_an_unfavourable_month
        claim_type: error_triggerable
        grounds:
          - errors[ERR_SEASONALITY_WINDOW_UNFAVORABLE]
        excluded_because:
          difficulty_instance: non_linear_state_machine / outage_defer_repropose_cycle_unlocks_seasonality_gate
          rationale: "That instance is refused on an August window at deferral_count 0 and approved on the same window at deferral_count 2."

      - name: fire_rated_run_scheduled_on_a_restricted_plant
        claim_type: error_triggerable
        grounds:
          - errors[ERR_POSTURE_RESTRICTED_FIRE_RATED]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / posture_restricted_precedes_stucco_insufficient
          rationale: "That instance schedules a fire-rated run while the posture is RESTRICTED and asserts this code wins over the balance error."

      - name: fire_rated_run_drawing_on_non_conforming_stucco
        claim_type: error_triggerable
        grounds:
          - errors[ERR_FIRE_RATED_STUCCO_NONCONFORMING]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / fire_rated_stucco_precedes_line_window_conflict
          rationale: "That instance points a fire-rated run at a MARGINAL batch and asserts this code precedes the window conflict."

      - name: run_scheduled_across_an_approved_outage_window
        claim_type: error_triggerable
        grounds:
          - errors[ERR_OUTAGE_WINDOW_CONFLICT]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / outage_closed_interval_touch_blocks_run_schedule
          rationale: "That instance shows outage windows are closed intervals, so a run starting exactly at the outage end still conflicts."

      - name: two_runs_overlapping_on_one_line
        claim_type: error_triggerable
        grounds:
          - errors[ERR_LINE_WINDOW_CONFLICT]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / run_windows_half_open_touch_allowed_overlap_rejected
          rationale: "That instance contrasts a touching window (allowed) with a one-minute overlap (refused)."

      - name: trailer_loaded_past_the_weight_limit
        claim_type: error_triggerable
        grounds:
          - errors[ERR_TRAILER_WEIGHT_EXCEEDED]
        excluded_because:
          difficulty_instance: boundary_precision_check / trailer_weight_thirteen_vs_fourteen_bundles
          rationale: "That instance accepts 13 bundles at 47923.20 lb and refuses 14 at 51609.60 lb against the 48000 lb ceiling."

      - name: evaluation_with_fewer_than_three_specimens
        claim_type: error_triggerable
        grounds:
          - errors[ERR_INSUFFICIENT_SPECIMENS]
        excluded_because:
          difficulty_instance: boundary_precision_check / specimen_count_two_vs_three_at_quality_evaluation
          rationale: "That instance refuses the evaluation at two specimens and passes it at three."

      - name: shipping_a_load_from_a_held_run
        claim_type: error_triggerable
        grounds:
          - errors[ERR_RUN_QUALITY_NOT_RELEASED]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / load_ship_blocked_until_run_quality_released
          rationale: "That instance blocks the ship while the run is HELD and lets it through once the run is DOWNGRADED."

      - name: outage_started_while_a_run_occupies_the_line
        claim_type: error_triggerable
        grounds:
          - errors[ERR_RUN_ACTIVE_ON_LINE]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / outage_start_blocked_while_run_active_on_line
          rationale: "That instance holds a RUNNING run on the line and shows the outage start refused until the run completes."

  - section: rbac
    instances:

      - name: each_exclusive_operation_rejects_every_other_role
        claim_type: exclusive_operations
        grounds:
          - roles.QualityInspector.exclusive_operations
          - roles.QualityManager.exclusive_operations
          - roles.PlantManager.exclusive_operations
          - errors[ERR_UNAUTHORIZED]
        distinguishing_aspect: |
          Authorization is checked at priority 2, ahead of every state and business rule, so four
          cross-role attempts all return ERR_UNAUTHORIZED (403) rather than the state error each call would
          otherwise have hit: a scheduler recording board specimens, an inspector dispositioning a hold, a
          maintenance planner approving an outage and a scheduler shipping freight.
