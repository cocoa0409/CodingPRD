    output: SyncRequest
    status_code: 201
    side_effects: ["creates the request in SUBMITTED with revision_round 0 and every quote field null"]

  - method: GET
    path: /music-library/sync-requests/{sync_request_id}
    roles: [LicensingAgent, CatalogAdmin, RightsManager, Licensee]
    input: []
    output: SyncRequest
    status_code: 200
    side_effects: []

  - method: GET
    path: /music-library/sync-requests
    roles: [LicensingAgent, CatalogAdmin, RightsManager]
    input: ["composition_id?", "licensee_id?", "tier_id?", "license_id?", "status?", "limit?", "offset?"]
    output: SyncRequest[]
    status_code: 200
    description: "Reverse lookup for SyncRequest.composition_id, SyncRequest.licensee_id, SyncRequest.tier_id and SyncRequest.license_id."
    side_effects: []

  - method: POST
    path: /music-library/sync-requests/{sync_request_id}/review
    roles: [LicensingAgent]
    input: []
    output: SyncRequest
    status_code: 200
    side_effects: ["SUBMITTED → UNDER_REVIEW"]

  - method: POST
    path: /music-library/sync-requests/{sync_request_id}/quote
    roles: [LicensingAgent]
    input: ["quote_valid_days?"]
    output: SyncRequest
    status_code: 200
    side_effects:
      - "{UNDER_REVIEW, REVISION_REQUESTED} → QUOTED"
      - "computes quoted_fee_cents with the PROVISIONAL variant, sets quoted_spend_basis_cents, quoted_discount_pct and quote_expires_at (clock + quote_valid_days, default 14)"
      - "raises Licensee.reserved_spend_cents and lowers Licensee.credit_available_cents by quoted_fee_cents, incrementing Licensee.version"

  - method: POST
    path: /music-library/sync-requests/{sync_request_id}/request-revision
    roles: [Licensee]
    input: [revision_note, "revised_term_months?", "revised_distribution_scale?", "revised_exclusive_requested?"]
    output: SyncRequest
    status_code: 200
    side_effects:
      - "QUOTED → REVISION_REQUESTED, increments revision_round, applies the revised terms"
      - "clears the quote fields and releases the Licensee reservation"

  - method: POST
    path: /music-library/sync-requests/{sync_request_id}/accept
    roles: [Licensee]
    input: []
    output: SyncRequest
    status_code: 200
    side_effects: ["QUOTED → ACCEPTED; the reservation stays until a License is issued"]

  - method: POST
    path: /music-library/sync-requests/{sync_request_id}/decline
    roles: [LicensingAgent]
    input: [reason]
    output: SyncRequest
    status_code: 200
    side_effects: ["{SUBMITTED, UNDER_REVIEW, QUOTED, REVISION_REQUESTED} → DECLINED, records decline_reason and releases any reservation"]

  - method: POST
    path: /music-library/sync-requests/{sync_request_id}/start-edit
    roles: [CatalogAdmin]
    input: ["edit_note?"]
    output: SyncRequest
    status_code: 200
    side_effects: ["ACCEPTED → EDIT_IN_PROGRESS"]

  - method: POST
    path: /music-library/sync-requests/{sync_request_id}/deliver
    roles: [CatalogAdmin]
    input: [delivered_asset_count, "delivery_note?"]
    output: SyncRequest
    status_code: 200
    side_effects: ["{ACCEPTED, EDIT_IN_PROGRESS} → DELIVERED and records delivered_asset_count"]

  # ---- License ---------------------------------------------------------------
  - method: POST
    path: /music-library/licenses
    roles: [LicensingAgent]
    input: [license_mode, expected_composition_version, "sync_request_id?", "composition_id?", "blanket_agreement_id?", "tier_id?", "media_type?", "distribution_scale?", "term_start?", "term_months?"]
    output: License
    status_code: 201
    description: "PER_USE requires sync_request_id (an ACCEPTED request) and copies composition, licensee, tier, media, scale, term and exclusivity from it. BLANKET requires composition_id, blanket_agreement_id, tier_id, media_type, distribution_scale, term_start and term_months. expected_composition_version is always required (OCC on Composition)."
    side_effects:
      - "creates the License in ISSUED, computes term_end, exclusive_block_until, and the FINAL variant of license_fee_quote (0 for BLANKET)"
      - "increments Composition.version and recomputes active_license_count and exclusive_block_until"
      - "sets SyncRequest.license_id for PER_USE, which moves the amount from Licensee.reserved_spend_cents to Licensee.committed_spend_cents"
      - "appends one SYNC_FEE RoyaltyLedgerEntry for the composer with amount_cents = composer_sync_share_cents, accrual_recognized_at = clock and cash_recognized_at = null, incrementing Composer.version; no entry is appended when composer_sync_share_cents = 0"

  - method: GET
    path: /music-library/licenses/{license_id}
    roles: [LicensingAgent, RightsManager, CatalogAdmin, RoyaltyAccountant, Licensee]
    input: []
    output: License
    status_code: 200
    side_effects: []

  - method: GET
    path: /music-library/licenses
    roles: [LicensingAgent, RightsManager, CatalogAdmin, RoyaltyAccountant]
    input: ["composition_id?", "licensee_id?", "tier_id?", "sync_request_id?", "blanket_agreement_id?", "status?", "limit?", "offset?"]
    output: License[]
    status_code: 200
    description: "Reverse lookup for License.composition_id, License.licensee_id, License.tier_id, License.sync_request_id and License.blanket_agreement_id."
    side_effects: []

  - method: POST
    path: /music-library/licenses/{license_id}/activate
    roles: [LicensingAgent]
    input: []
    output: License
    status_code: 200
    side_effects: ["ISSUED → ACTIVE once the logical clock has reached term_start"]

  - method: POST
    path: /music-library/licenses/{license_id}/revoke
    roles: [RightsManager]
    input: [reason]
    output: License
    status_code: 200
    side_effects:
      - "{ISSUED, ACTIVE} → REVOKED and records revoke_reason"
      - "appends the compensating SYNC_FEE_REVERSAL ledger entry and returns Licensee.committed_spend_cents and Composer.accrued_unpaid_cents to their pre-issuance values"

  - method: POST
    path: /music-library/licenses/{license_id}/record-payment
    roles: [RoyaltyAccountant]
    input: [amount_cents]
    output: License
    status_code: 200
    side_effects:
      - "raises collected_amount_cents; when it reaches final_fee_cents, sets collected_at and stamps cash_recognized_at = clock on the SYNC_FEE ledger entry of this license, which is what makes the amount visible to a CASH-basis statement"

