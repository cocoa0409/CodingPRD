scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: interest_accrual_chronological_vs_forward_payoff
        grounds:
          - calculations.chronological_interest_accrual
          - calculations.chronological_interest_accrual.variants.forward_projected_payoff
          - entities.Heloc.fields.accrued_interest_cents
          - endpoints
        distinguishing_aspect: |
          The same Heloc ledger yields different interest figures: chronological replay over two
          staggered draws (200000 then 100000) gives 2192 accrued cents, while the forward-projected
          payoff over the next 30 days on the current 300000 principal gives 2466 projected cents —
          divergent because chronological re-walks historical segments while forward assumes one
          flat segment on current principal.
        test_recipe:
          setup:
            - "Borrower CLEARED; Property appraised 100000000, senior 0; PRIME index 850 active."
            - "Heloc origination 2026-01-01, margin 150, ceiling 1800 -> APR 1000bps; credit_limit 50000000; activated -> DRAW."
            - "Draw 200000 at 2026-01-01; clock advanced to 2026-01-11; Draw 100000; clock advanced to 2026-01-31."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: LoanServicer
            - call: "POST /index-rates"
              payload: { index_name: "PRIME", rate_bps: 850, effective_date: "2026-01-01T00:00:00Z" }
              as: LoanServicer
              captures: { idx_id: $.data.id }
            - call: "POST /borrowers"
              payload: { full_name: "B One", annual_income_cents: 12000000, monthly_debt_obligation_cents: 200000, credit_score: 740, kyc_status: "CLEARED" }
              as: LoanOfficer
              captures: { bor_id: $.data.id }
            - call: "POST /properties"
              payload: { street_address: "1 Main", appraised_value_cents: 100000000, senior_lien_balance_cents: 0, county_fips: "06037" }
              as: LoanOfficer
              captures: { prop_id: $.data.id }
            - call: "POST /helocs"
              payload: { borrower_id: "${bor_id}", property_id: "${prop_id}", lien_position: "FIRST", credit_limit_cents: 50000000, margin_bps: 150, rate_ceiling_bps: 1800, annual_fee_cents: 5000, origination_date: "2026-01-01T00:00:00Z", draw_period_years: 10, repayment_period_years: 20 }
              as: LoanOfficer
              captures: { hl_id: $.data.id }
            - call: "POST /helocs/${hl_id}/covenants"
              payload: { covenant_type: "MAX_CLTV", threshold_value: 8500 }
              as: LoanOfficer
            - call: "POST /helocs/${hl_id}/covenants"
              payload: { covenant_type: "MIN_DSCR", threshold_value: 12000 }
              as: LoanOfficer
            - call: "POST /helocs/${hl_id}/covenants"
              payload: { covenant_type: "MAX_DELINQUENCY_DAYS", threshold_value: 60 }
              as: LoanOfficer
            - call: "POST /helocs/${hl_id}/activate"
              payload: {}
              as: LoanOfficer
            - call: "POST /helocs/${hl_id}/draws"
              payload: { amount_cents: 200000 }
              as: LoanServicer
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-11T00:00:00Z" }
              as: LoanServicer
            - call: "POST /helocs/${hl_id}/draws"
              payload: { amount_cents: 100000 }
              as: LoanServicer
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-31T00:00:00Z" }
              as: LoanServicer
          trigger:
            - call: "GET /helocs/${hl_id}/interest-quote"
              payload: {}
              as: LoanServicer
              captures: { chrono: $.data.accrued_interest_cents }
            - call: "GET /helocs/${hl_id}/payoff-quote?as_of=2026-03-02T00:00:00Z"
              payload: {}
              as: LoanServicer
              captures: { fwd: $.data.projected_interest_cents }
          assert:
            - "interest-quote.data.accrued_interest_cents == 2192"
            - "payoff-quote.data.projected_interest_cents == 2466"
            - "interest-quote.data.accrued_interest_cents != payoff-quote.data.projected_interest_cents"

      - name: covenant_cltv_vs_dscr_breach_evaluations
        grounds:
          - calculations.covenant_breach_check
          - state_machines.Covenant.SATISFIED_to_BREACHED
          - entities.Covenant.fields.covenant_type
        distinguishing_aspect: |
          Breach evaluation runs two structurally different metric algorithms on different entity
          domains: MAX_CLTV scores the Property (collateral) producing cltv_bps 9000 (>8500 breach),
          while MIN_DSCR scores the Borrower (income/debt) producing dscr_bps 10526 (<12000 breach) —
          two distinct subjects, not a repeated provisional/final shape on one metric.
        test_recipe:
          setup:
            - "Heloc in DRAW, APR 1000bps, current_balance 90000000 from a 90000000 draw."
            - "Property appraised 100000000 senior 0; Borrower income 12000000 debt 200000/mo."
            - "MAX_CLTV covenant threshold 8500; MIN_DSCR covenant threshold 12000."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: LoanServicer
            - call: "POST /index-rates"
              payload: { index_name: "PRIME", rate_bps: 850, effective_date: "2026-01-01T00:00:00Z" }
              as: LoanServicer
            - call: "POST /borrowers"
              payload: { full_name: "B Two", annual_income_cents: 12000000, monthly_debt_obligation_cents: 200000, credit_score: 720, kyc_status: "CLEARED" }
              as: LoanOfficer
              captures: { bor_id: $.data.id }
            - call: "POST /properties"
              payload: { street_address: "2 Main", appraised_value_cents: 100000000, senior_lien_balance_cents: 0, county_fips: "06037" }
              as: LoanOfficer
              captures: { prop_id: $.data.id }
            - call: "POST /helocs"
              payload: { borrower_id: "${bor_id}", property_id: "${prop_id}", lien_position: "FIRST", credit_limit_cents: 95000000, margin_bps: 150, rate_ceiling_bps: 1800, origination_date: "2026-01-01T00:00:00Z" }
              as: LoanOfficer
              captures: { hl_id: $.data.id }
            - call: "POST /helocs/${hl_id}/covenants"
              payload: { covenant_type: "MAX_CLTV", threshold_value: 8500 }
              as: LoanOfficer
              captures: { cov_cltv: $.data.id }
            - call: "POST /helocs/${hl_id}/covenants"
              payload: { covenant_type: "MIN_DSCR", threshold_value: 12000 }
              as: LoanOfficer
              captures: { cov_dscr: $.data.id }
            - call: "POST /helocs/${hl_id}/covenants"
              payload: { covenant_type: "MAX_DELINQUENCY_DAYS", threshold_value: 60 }
              as: LoanOfficer
            - call: "POST /helocs/${hl_id}/activate"
              payload: {}
              as: LoanOfficer
            - call: "POST /helocs/${hl_id}/draws"
              payload: { amount_cents: 90000000 }
              as: LoanServicer
          trigger:
            - call: "POST /helocs/${hl_id}/covenants/${cov_cltv}/evaluate"
              payload: {}
              as: LoanServicer
              captures: { cltv_status: $.data.status }
            - call: "POST /helocs/${hl_id}/covenants/${cov_dscr}/evaluate"
              payload: {}
              as: LoanServicer
              captures: { dscr_status: $.data.status }
          assert:
            - "Covenant.${cov_cltv}.status == BREACHED  # cltv_bps 9000 > 8500"
            - "Covenant.${cov_dscr}.status == BREACHED  # dscr_bps 10526 < 12000"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: payment_waterfall_rounding_order_pinned
        grounds:
          - calculations.payment_waterfall_allocation
          - calculations.chronological_interest_accrual
          - entities.Payment.fields.interest_applied_cents
          - entities.Payment.fields.principal_applied_cents
        distinguishing_aspect: |
          Mode (b)/(c): interest is accrued per inter-event segment with round-half-up THEN summed
          (2192), and only the summed integer feeds the waterfall buckets in pinned order
          fee->interest->principal; a 10000 payment splits 0 fee / 1644 interest (from a single-draw
          1644 accrual) / 8356 principal, an order-dependent result that would differ if principal
          were filled before interest.
        test_recipe:
          setup:
            - "Heloc DRAW, APR 1000bps; one Draw 200000 at 2026-01-01; clock at 2026-01-31 (30 days)."
            - "No outstanding fees; accrued_interest 1644."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: LoanServicer
            - call: "POST /index-rates"
              payload: { index_name: "PRIME", rate_bps: 850, effective_date: "2026-01-01T00:00:00Z" }
              as: LoanServicer
            - call: "POST /borrowers"
              payload: { full_name: "B Three", annual_income_cents: 12000000, monthly_debt_obligation_cents: 200000, credit_score: 760, kyc_status: "CLEARED" }
              as: LoanOfficer
              captures: { bor_id: $.data.id }
            - call: "POST /properties"
              payload: { street_address: "3 Main", appraised_value_cents: 100000000, senior_lien_balance_cents: 0, county_fips: "06037" }
              as: LoanOfficer
              captures: { prop_id: $.data.id }
            - call: "POST /helocs"
              payload: { borrower_id: "${bor_id}", property_id: "${prop_id}", lien_position: "FIRST", credit_limit_cents: 50000000, margin_bps: 150, rate_ceiling_bps: 1800, origination_date: "2026-01-01T00:00:00Z" }
              as: LoanOfficer
              captures: { hl_id: $.data.id }
            - call: "POST /helocs/${hl_id}/covenants"
              payload: { covenant_type: "MAX_CLTV", threshold_value: 8500 }
              as: LoanOfficer
            - call: "POST /helocs/${hl_id}/covenants"
              payload: { covenant_type: "MIN_DSCR", threshold_value: 12000 }
              as: LoanOfficer
            - call: "POST /helocs/${hl_id}/covenants"
              payload: { covenant_type: "MAX_DELINQUENCY_DAYS", threshold_value: 60 }
              as: LoanOfficer
            - call: "POST /helocs/${hl_id}/activate"
              payload: {}
              as: LoanOfficer
            - call: "POST /helocs/${hl_id}/draws"
              payload: { amount_cents: 200000 }
              as: LoanServicer
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-31T00:00:00Z" }
              as: LoanServicer
          trigger:
            - call: "POST /helocs/${hl_id}/payments"
              payload: { amount_cents: 10000 }
              as: LoanServicer
              captures: { pay_id: $.data.id }
          assert:
            - "Payment.${pay_id}.fee_applied_cents == 0"
            - "Payment.${pay_id}.interest_applied_cents == 1644"
            - "Payment.${pay_id}.principal_applied_cents == 8356"
            - "Payment.${pay_id}.fee_applied_cents + Payment.${pay_id}.interest_applied_cents + Payment.${pay_id}.principal_applied_cents == 10000"

      - name: dscr_nested_formula_three_inputs
        grounds:
          - calculations.covenant_breach_check
          - entities.Borrower.fields.annual_income_cents
          - entities.Borrower.fields.monthly_debt_obligation_cents
          - entities.Heloc.fields.current_apr_bps
        distinguishing_aspect: |
          Mode (a): DSCR combines >=3 inputs in a non-linear nested form — annual_debt_service =
          monthly_debt_obligation*12 + round_half_up(current_balance*current_apr_bps/10000), then
          dscr_bps = round_half_up(annual_income*10000/annual_debt_service); with income 12000000,
          debt 200000/mo, balance 90000000, APR 1000 the result is dscr_bps 10526, distinct from the
          waterfall rounding-order mode.
        test_recipe:
          setup:
            - "Heloc DRAW, APR 1000bps, current_balance 90000000; Borrower income 12000000 debt 200000/mo."
            - "MIN_DSCR covenant threshold 12000."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: LoanServicer
            - call: "POST /index-rates"
              payload: { index_name: "PRIME", rate_bps: 850, effective_date: "2026-01-01T00:00:00Z" }
              as: LoanServicer
            - call: "POST /borrowers"
              payload: { full_name: "B Four", annual_income_cents: 12000000, monthly_debt_obligation_cents: 200000, credit_score: 700, kyc_status: "CLEARED" }
              as: LoanOfficer
              captures: { bor_id: $.data.id }
            - call: "POST /properties"
              payload: { street_address: "4 Main", appraised_value_cents: 100000000, senior_lien_balance_cents: 0, county_fips: "06037" }
              as: LoanOfficer
              captures: { prop_id: $.data.id }
            - call: "POST /helocs"
              payload: { borrower_id: "${bor_id}", property_id: "${prop_id}", lien_position: "FIRST", credit_limit_cents: 95000000, margin_bps: 150, rate_ceiling_bps: 1800, origination_date: "2026-01-01T00:00:00Z" }
              as: LoanOfficer
              captures: { hl_id: $.data.id }
            - call: "POST /helocs/${hl_id}/covenants"
              payload: { covenant_type: "MAX_CLTV", threshold_value: 9900 }
              as: LoanOfficer
            - call: "POST /helocs/${hl_id}/covenants"
              payload: { covenant_type: "MIN_DSCR", threshold_value: 12000 }
              as: LoanOfficer
              captures: { cov_dscr: $.data.id }
            - call: "POST /helocs/${hl_id}/covenants"
              payload: { covenant_type: "MAX_DELINQUENCY_DAYS", threshold_value: 60 }
              as: LoanOfficer
            - call: "POST /helocs/${hl_id}/activate"
              payload: {}
              as: LoanOfficer
            - call: "POST /helocs/${hl_id}/draws"
              payload: { amount_cents: 90000000 }
              as: LoanServicer
          trigger:
            - call: "POST /helocs/${hl_id}/covenants/${cov_dscr}/evaluate"
              payload: {}
              as: LoanServicer
              captures: { st: $.data.status }
          assert:
            - "Covenant.${cov_dscr}.status == BREACHED  # dscr_bps 10526 < 12000"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: covenant_cyclic_satisfied_breached_cured_breached
        grounds:
          - state_machines.Covenant.SATISFIED_to_BREACHED
          - state_machines.Covenant.BREACHED_to_CURED
          - state_machines.Covenant.CURED_to_BREACHED
        distinguishing_aspect: |
          Covenant is a cyclic machine on the Covenant entity: SATISFIED->BREACHED->CURED->BREACHED,
          a true revision loop (re-breach after cure) distinct from any linear pipeline.
        test_recipe:
          setup:
            - "Heloc DRAW, MAX_CLTV covenant threshold 8500; Property appraised 100000000."
            - "current_balance 90000000 -> cltv 9000 breaches; revalue property to 200000000 -> cltv 4500 cures; revert to 100000000 -> re-breach."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: LoanServicer
            - call: "POST /index-rates"
              payload: { index_name: "PRIME", rate_bps: 850, effective_date: "2026-01-01T00:00:00Z" }
              as: LoanServicer
            - call: "POST /borrowers"
              payload: { full_name: "B Five", annual_income_cents: 50000000, monthly_debt_obligation_cents: 100000, credit_score: 780, kyc_status: "CLEARED" }
              as: LoanOfficer
              captures: { bor_id: $.data.id }
            - call: "POST /properties"
              payload: { street_address: "5 Main", appraised_value_cents: 100000000, senior_lien_balance_cents: 0, county_fips: "06037" }
              as: LoanOfficer
              captures: { prop_id: $.data.id }
            - call: "POST /helocs"
              payload: { borrower_id: "${bor_id}", property_id: "${prop_id}", lien_position: "FIRST", credit_limit_cents: 95000000, margin_bps: 150, rate_ceiling_bps: 1800, origination_date: "2026-01-01T00:00:00Z" }
              as: LoanOfficer
              captures: { hl_id: $.data.id }
            - call: "POST /helocs/${hl_id}/covenants"
              payload: { covenant_type: "MAX_CLTV", threshold_value: 8500 }
              as: LoanOfficer
              captures: { cov: $.data.id }
            - call: "POST /helocs/${hl_id}/covenants"
              payload: { covenant_type: "MIN_DSCR", threshold_value: 100 }
              as: LoanOfficer
            - call: "POST /helocs/${hl_id}/covenants"
              payload: { covenant_type: "MAX_DELINQUENCY_DAYS", threshold_value: 60 }
              as: LoanOfficer
            - call: "POST /helocs/${hl_id}/activate"
              payload: {}
              as: LoanOfficer
            - call: "POST /helocs/${hl_id}/draws"
              payload: { amount_cents: 90000000 }
              as: LoanServicer
            - call: "POST /helocs/${hl_id}/covenants/${cov}/evaluate"
              payload: {}
              as: LoanServicer
            - call: "PATCH /properties/${prop_id}"
              payload: { appraised_value_cents: 200000000 }
              as: LoanServicer
            - call: "POST /helocs/${hl_id}/covenants/${cov}/cure"
              payload: {}
              as: LoanServicer
            - call: "PATCH /properties/${prop_id}"
              payload: { appraised_value_cents: 100000000 }
              as: LoanServicer
          trigger:
            - call: "POST /helocs/${hl_id}/covenants/${cov}/evaluate"
              payload: {}
              as: LoanServicer
              captures: { st: $.data.status }
          assert:
            - "Covenant.${cov}.status == BREACHED  # re-breached after cure (cyclic)"

      - name: heloc_branching_frozen_fork_to_draw_or_defaulted
        grounds:
          - state_machines.Heloc.FROZEN_to_DRAW
          - state_machines.Heloc.FROZEN_to_DEFAULTED
          - state_machines.Heloc.DRAW_to_FROZEN
        distinguishing_aspect: |
          Heloc is a branching machine on a different entity: from FROZEN it forks to either DRAW
          (unfreeze cure path, restores credit) or DEFAULTED (declaration path, creates DefaultEvent),
          divergent side-effect sets per branch — not a cycle and on a distinct entity from Covenant.
        test_recipe:
          setup:
            - "Heloc frozen via MAX_CLTV breach; LoanOfficer officer-A activated, LoanServicer servicer-B declares default."
            - "MAX_CLTV covenant BREACHED (cltv 9000 > 8500) so the breach covenant backs the default; default path taken."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: LoanServicer
            - call: "POST /index-rates"
              payload: { index_name: "PRIME", rate_bps: 850, effective_date: "2026-01-01T00:00:00Z" }
              as: LoanServicer
            - call: "POST /borrowers"
              payload: { full_name: "B Six", annual_income_cents: 50000000, monthly_debt_obligation_cents: 100000, credit_score: 690, kyc_status: "CLEARED" }
              as: LoanOfficer
              captures: { bor_id: $.data.id }
            - call: "POST /properties"
              payload: { street_address: "6 Main", appraised_value_cents: 100000000, senior_lien_balance_cents: 0, county_fips: "06037" }
              as: LoanOfficer
              captures: { prop_id: $.data.id }
            - call: "POST /helocs"
              payload: { borrower_id: "${bor_id}", property_id: "${prop_id}", lien_position: "FIRST", credit_limit_cents: 95000000, margin_bps: 150, rate_ceiling_bps: 1800, origination_date: "2026-01-01T00:00:00Z" }
              as: LoanOfficer
              captures: { hl_id: $.data.id }
            - call: "POST /helocs/${hl_id}/covenants"
              payload: { covenant_type: "MAX_CLTV", threshold_value: 8500 }
              as: LoanOfficer
              captures: { cov_cltv: $.data.id }
            - call: "POST /helocs/${hl_id}/covenants"
              payload: { covenant_type: "MIN_DSCR", threshold_value: 100 }
              as: LoanOfficer
            - call: "POST /helocs/${hl_id}/covenants"
              payload: { covenant_type: "MAX_DELINQUENCY_DAYS", threshold_value: 60 }
              as: LoanOfficer
            - call: "POST /helocs/${hl_id}/activate"
              payload: {}
              as: LoanOfficer
              as_user_id: "officer-A"
            - call: "POST /helocs/${hl_id}/draws"
              payload: { amount_cents: 90000000 }
              as: LoanServicer
            - call: "POST /helocs/${hl_id}/covenants/${cov_cltv}/evaluate"
              payload: {}
              as: LoanServicer
          trigger:
            - call: "POST /helocs/${hl_id}/declare-default"
              payload: { covenant_id: "${cov_cltv}" }
              as: LoanServicer
              as_user_id: "servicer-B"
              captures: { st: $.data.status }
          assert:
            - "Heloc.${hl_id}.status == DEFAULTED  # FROZEN forked to DEFAULTED branch"
            - "Heloc.${hl_id}.available_credit_cents == 0"

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: close_cascade_fee_lien_property_release
        grounds:
          - state_machines.Heloc.DRAW_to_CLOSED
          - entities.FeeAssessment.fields.fee_type
          - entities.LienRecord.fields.status
          - entities.Property.fields.status
        distinguishing_aspect: |
          Depth-3 chain from the close trigger: close (clock pre-draw-end) -> assess EARLY_CLOSURE
          FeeAssessment; once that fee is settled the close completes -> LienRecord RELEASED -> and
          because no other RECORDED lien references the property, Property.status RELEASED. Each hop
          is caused by the prior hop, not by close directly.
        test_recipe:
          setup:
            - "Heloc DRAW paid to 0 principal and 0 interest at 2026-06-01 (within draw period)."
            - "credit_limit 50000000 -> EARLY_CLOSURE tier1 fee 1000000; pay fee then close completes."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: LoanServicer
            - call: "POST /index-rates"
              payload: { index_name: "PRIME", rate_bps: 850, effective_date: "2026-01-01T00:00:00Z" }
              as: LoanServicer
            - call: "POST /borrowers"
              payload: { full_name: "B Seven", annual_income_cents: 50000000, monthly_debt_obligation_cents: 100000, credit_score: 800, kyc_status: "CLEARED" }
              as: LoanOfficer
              captures: { bor_id: $.data.id }
            - call: "POST /properties"
              payload: { street_address: "7 Main", appraised_value_cents: 100000000, senior_lien_balance_cents: 0, county_fips: "06037" }
              as: LoanOfficer
              captures: { prop_id: $.data.id }
            - call: "POST /helocs"
              payload: { borrower_id: "${bor_id}", property_id: "${prop_id}", lien_position: "FIRST", credit_limit_cents: 50000000, margin_bps: 150, rate_ceiling_bps: 1800, origination_date: "2026-01-01T00:00:00Z" }
              as: LoanOfficer
              captures: { hl_id: $.data.id }
            - call: "POST /helocs/${hl_id}/covenants"
              payload: { covenant_type: "MAX_CLTV", threshold_value: 9900 }
              as: LoanOfficer
            - call: "POST /helocs/${hl_id}/covenants"
              payload: { covenant_type: "MIN_DSCR", threshold_value: 100 }
              as: LoanOfficer
            - call: "POST /helocs/${hl_id}/covenants"
              payload: { covenant_type: "MAX_DELINQUENCY_DAYS", threshold_value: 60 }
              as: LoanOfficer
            - call: "POST /helocs/${hl_id}/activate"
              payload: {}
              as: LoanOfficer
            - call: "POST /helocs/${hl_id}/close"
              payload: {}
              as: LoanServicer
              captures: { close_fail: $.data.error_id }
            - call: "GET /helocs/${hl_id}/fee-assessments?fee_type=EARLY_CLOSURE"
              payload: {}
              as: LoanServicer
              captures: { fee_amt: "$.data[0].amount_cents"}
            - call: "POST /helocs/${hl_id}/payments"
              payload: { amount_cents: 1000000 }
              as: LoanServicer
          trigger:
            - call: "POST /helocs/${hl_id}/close"
              payload: {}
              as: LoanServicer
              captures: { st: $.data.status }
          assert:
            - "Heloc.${hl_id}.status == CLOSED"
