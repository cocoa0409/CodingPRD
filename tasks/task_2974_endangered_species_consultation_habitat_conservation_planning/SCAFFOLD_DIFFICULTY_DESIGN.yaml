              payload: {mechanism: "CONSERVATION_BANK_CREDIT", units: 14.71, expected_hcp_version: "${hcp_v2}", conservation_bank_id: "${bank_id}"}
              as: Proponent
              as_user_id: "${proponent_id}"
              captures: {c2_id: "$.data.id"}
            - call: "POST /habitat-conservation-plans/${hcp_id}/funding-assurances"
              payload: {contribution_cents: 5026514, instrument_type: "IRREVOCABLE_LETTER_OF_CREDIT"}
              as: Proponent
              as_user_id: "${proponent_id}"
            - call: "POST /habitat-conservation-plans/${hcp_id}/submit"
              payload: {}
              as: Proponent
              as_user_id: "${proponent_id}"
              captures: {final_units: "$.data.final_mitigation_units", secured_units: "$.data.secured_mitigation_units", fs_before: "$.data.funding_status"}
            - call: "GET /conservation-banks/${bank_id}"
              payload: {}
              as: WildlifeAgency
              as_user_id: "fws-user-registrar"
              captures: {avail_before: "$.data.credits_available", reserved_before: "$.data.credits_reserved", transferred_before: "$.data.credits_transferred", minted: "$.data.credits_total_minted"}
          trigger:
            - call: "POST /habitat-conservation-plans/${hcp_id}/decision"
              payload: {decision: "RETURN_FOR_REVISION", decision_note: "Revise the mitigation package before resubmission."}
              as: WildlifeAgency
              as_user_id: "fws-user-approver"
          assert:
            - "the captured ${minted} == 500.00, ${avail_before} == 440.28, ${reserved_before} == 59.72 and ${transferred_before} == 0.00, which already sums to 500.00"
            - "the captured ${final_units} == 59.70, ${secured_units} == 59.72 and ${fs_before} == 'FULLY_ASSURED'"
            - "the trigger returns 200 with plan_status == 'DRAFT'"
            - "GET /conservation-banks/${bank_id} then reports credits_available == 500.00, credits_reserved == 0.00 and credits_transferred == 0.00"
            - "the identity holds in its split, not merely in total: the 59.72 credits went back to credits_available and NOT to credits_transferred, which is the drift a naive undo produces"
            - "GET /habitat-conservation-plans/${hcp_id}/mitigation-commitments shows both commitments with status == 'RELEASED', in created_at ASC order, and RELEASED is terminal"
            - "the plan's aggregates are recomputed over the now-empty contributing set: endowment_base_cents == 0, changed_circumstance_reserve_cents == 0, endowment_required_cents == 0, reserve_remaining_cents == 0 and secured_mitigation_units == 0.00"
            - "funded_ratio == 0.0000 and funding_status == 'UNFUNDED' — pinned by calculations.funding_assurance_status because endowment_required_cents == 0, so an emptied plan can never be approved"
            - "endowment_secured_cents is STILL 5026514: the contribution ledger is a record of money accepted and is not reversed by the revision, which is why funded_ratio has to be pinned rather than divided"
            - "re-booking a 45.01-unit commitment against the then-current plan version succeeds and moves the bank back to credits_available 454.99 / credits_reserved 45.01, so the compensation left no hidden reservation behind"
            - "no second decision is possible: POST /habitat-conservation-plans/${hcp_id}/decision returns ERR_INVALID_STATE_TRANSITION (409) while plan_status is DRAFT"

      - name: permit_take_ledger_identity_restored_by_report_rejection
        grounds:
          - calculations.monitoring_report_lateness_and_take_ledger
          - calculations.monitoring_report_lateness_and_take_ledger.notes
          - state_machines[MonitoringReport].transitions["SUBMITTED -> REJECTED"]
          - state_machines[IncidentalTakePermit].transitions["SUSPENDED -> ACTIVE"]
          - state_machines[HabitatConservationPlan].state_field["plan_status"].transitions["SUSPENDED_IMPLEMENTATION -> IMPLEMENTING"]
          - entities.IncidentalTakePermit.fields.take_consumed_units
          - entities.IncidentalTakePermit.fields.take_remaining_units
          - endpoints["POST /monitoring-reports/{id}/adjudication"]
        distinguishing_aspect: >-
          A DIFFERENT CONSERVED QUANTITY: the permit take identity
          authorized_take_units == take_consumed_units + take_remaining_units,
          in take units rather than credits, on a different entity and driven by
          an adjudication rather than a plan decision. The compensation is also
          deliberately PARTIAL: it unwinds the ledger, the suspension and the
          plan suspension, but it does NOT unwind the reinitiation obligation on
          the action or the consultation, and suspension_count is a monotone
          audit counter that never decreases.
        test_recipe:
          setup:
            - "The full canonical chain to an ACTIVE permit with authorized_take_units 4.00 and reinitiation_trigger_units 3.60; the plan is IMPLEMENTING and the action is PERMITTED."
            - "At clock 2027-02-14 report R1 covers [2026-10-01, 2026-12-31) with take_units_reported 3.60, which lands on the trigger and runs the whole take-exceedance cascade: permit SUSPENDED, plan SUSPENDED_IMPLEMENTATION, action REINITIATION_PENDING, consultation REINITIATION_REQUIRED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: {to_iso8601: "2026-10-01T00:00:00Z"}
              as: WildlifeAgency
              as_user_id: "fws-user-registrar"
            - call: "POST /species"
              payload: {scientific_name: "Gopherus agassizii", common_name: "Desert tortoise", listing_status: "ENDANGERED", take_authorization_unit: "INDIVIDUALS", take_density_per_acre: 0.40, recovery_unit_population: 4000, survey_season_start_month: 4, survey_season_end_month: 7}
              as: WildlifeAgency
              as_user_id: "fws-user-registrar"
              captures: {species_e_id: "$.data.id"}
            - call: "POST /species/${species_e_id}/critical-habitat-units"
              payload: {unit_code: "CHU-1", acres: 500.00, county_code: "06037", designation_status: "FINAL", primary_constituent_elements: ["burrow substrate", "forage cover"]}
              as: WildlifeAgency
              as_user_id: "fws-user-registrar"
              captures: {chu1_id: "$.data.id"}
            - call: "POST /species"
              payload: {scientific_name: "Vireo bellii pusillus", common_name: "Least Bell's vireo", listing_status: "THREATENED", take_authorization_unit: "INDIVIDUALS", take_density_per_acre: 0.25, recovery_unit_population: 9000, survey_season_start_month: 4, survey_season_end_month: 7}
              as: WildlifeAgency
              as_user_id: "fws-user-registrar"
              captures: {species_t_id: "$.data.id"}
            - call: "POST /conservation-banks"
              payload: {bank_name: "Mojave Habitat Bank", covered_species_id: "${species_e_id}", service_area_county_codes: ["06037"], credit_price_cents: 250000, credits_total_minted: 500.00}
              as: WildlifeAgency
              as_user_id: "fws-user-registrar"
              captures: {bank_id: "$.data.id"}
            - call: "POST /proponents"
              payload: {org_name: "Sunrise Logistics Park LLC", contact_email: "permits@sunrise-park.example", is_federal_agency: false}
              as: Anonymous
              captures: {proponent_id: "$.data.id"}
            - call: "POST /project-actions"
              payload: {proponent_id: "${proponent_id}", action_name: "Sunrise Park Phase I", action_type: "NON_FEDERAL", footprint_acres: 200.00, county_code: "06037", construction_start_date: "2027-01-01", construction_end_date: "2027-12-31"}
              as: Proponent
              as_user_id: "${proponent_id}"
              captures: {action_id: "$.data.id"}
            - call: "POST /project-actions/${action_id}/presence-determinations"
              payload: {species_id: "${species_e_id}", method: "FIELD_SURVEY", detection_result: "DETECTED", habitat_overlap_acres: 10.00, critical_habitat_unit_id: "${chu1_id}", survey_window_start: "2026-05-04", survey_window_end: "2026-05-08"}
              as: Proponent
              as_user_id: "${proponent_id}"
            - call: "POST /project-actions/${action_id}/presence-determinations"
              payload: {species_id: "${species_t_id}", method: "DATABASE_QUERY", detection_result: "DETECTED", habitat_overlap_acres: 7.35}
              as: Proponent
              as_user_id: "${proponent_id}"
            - call: "POST /project-actions/${action_id}/effect-determination"
              payload: {}
              as: Proponent
              as_user_id: "${proponent_id}"
              captures: {consultation_id: "$.data.active_consultation_id"}
            - call: "POST /consultations/${consultation_id}/biological-assessment"
              payload: {ba_narrative: "Effects analysis for 17.35 acres of occupied habitat.", ba_effects_analysis_complete: true}
              as: Proponent
              as_user_id: "${proponent_id}"
            - call: "POST /consultations/${consultation_id}/biological-opinion"
              payload: {}
              as: WildlifeAgency
              as_user_id: "fws-user-issuer"
            - call: "POST /project-actions/${action_id}/habitat-conservation-plans"
              payload: {plan_name: "Sunrise Park HCP", covered_acres: 20.00, permit_term_years: 30}
              as: Proponent
              as_user_id: "${proponent_id}"
              captures: {hcp_id: "$.data.id", hcp_v1: "$.data.version"}
            - call: "POST /habitat-conservation-plans/${hcp_id}/mitigation-commitments"
              payload: {mechanism: "CONSERVATION_BANK_CREDIT", units: 45.01, expected_hcp_version: "${hcp_v1}", conservation_bank_id: "${bank_id}"}
              as: Proponent
              as_user_id: "${proponent_id}"
            - call: "GET /habitat-conservation-plans/${hcp_id}"
              payload: {}
              as: Proponent
              as_user_id: "${proponent_id}"
              captures: {hcp_v2: "$.data.version"}
            - call: "POST /habitat-conservation-plans/${hcp_id}/mitigation-commitments"
              payload: {mechanism: "CONSERVATION_BANK_CREDIT", units: 14.71, expected_hcp_version: "${hcp_v2}", conservation_bank_id: "${bank_id}"}
              as: Proponent
              as_user_id: "${proponent_id}"
            - call: "POST /habitat-conservation-plans/${hcp_id}/funding-assurances"
              payload: {contribution_cents: 5026514, instrument_type: "IRREVOCABLE_LETTER_OF_CREDIT"}
              as: Proponent
              as_user_id: "${proponent_id}"
            - call: "POST /habitat-conservation-plans/${hcp_id}/submit"
              payload: {}
              as: Proponent
              as_user_id: "${proponent_id}"
            - call: "POST /habitat-conservation-plans/${hcp_id}/decision"
              payload: {decision: "APPROVE", decision_note: "Plan meets issuance criteria."}
              as: WildlifeAgency
              as_user_id: "fws-user-approver"
            - call: "POST /habitat-conservation-plans/${hcp_id}/incidental-take-permits"
              payload: {term_start: "2026-10-01", implementing_agreement_reference: "IA-2026-0417"}
              as: WildlifeAgency
              as_user_id: "fws-user-issuer"
              captures: {permit_id: "$.data.id", permit_v1: "$.data.version"}
            - call: "POST /_clock/set_current_utc"
              payload: {to_iso8601: "2027-02-14T00:00:00Z"}
              as: WildlifeAgency
              as_user_id: "fws-user-registrar"
            - call: "POST /incidental-take-permits/${permit_id}/monitoring-reports"
              payload: {period_start: "2026-10-01", period_end: "2026-12-31", take_units_reported: 3.60, mitigation_units_verified: 59.72, expected_permit_version: "${permit_v1}"}
              as: Proponent
              as_user_id: "${proponent_id}"
              captures: {r1_id: "$.data.id", r1_late: "$.data.is_late"}
            - call: "GET /incidental-take-permits/${permit_id}"
              payload: {}
              as: Proponent
              as_user_id: "${proponent_id}"
              captures: {consumed_before: "$.data.take_consumed_units", remaining_before: "$.data.take_remaining_units", status_before: "$.data.status", suspensions_before: "$.data.suspension_count"}
          trigger:
            - call: "POST /monitoring-reports/${r1_id}/adjudication"
              payload: {decision: "REJECT", adjudication_note: "Survey methodology does not support the reported take."}
              as: WildlifeAgency
              as_user_id: "fws-user-adjudicator"
          assert:
            - "the captured ${status_before} == 'SUSPENDED', ${consumed_before} == 3.60, ${remaining_before} == 0.40, ${suspensions_before} == 1 and ${r1_late} == false"
            - "the trigger returns 200 with MonitoringReport.status == 'REJECTED', adjudicated_at == '2027-02-14T00:00:00.000Z' and adjudicated_by_user_id == 'fws-user-adjudicator'"
            - "GET /incidental-take-permits/${permit_id} reports take_consumed_units == 0.00 and take_remaining_units == 4.00"
            - "the invariant holds exactly: authorized_take_units 4.00 == take_consumed_units 0.00 + take_remaining_units 4.00, with no 0.01 drift from double rounding"
            - "the permit status returns to 'ACTIVE' because 0.00 < 3.60 after the reversal, and suspension_count is STILL 1 — the audit counter is monotone and is not decremented by the undo"
            - "GET /habitat-conservation-plans/${hcp_id} reports plan_status == 'IMPLEMENTING' and assurance_review_required == false"
            - "the compensation is partial by design: GET /project-actions/${action_id} still reports status == 'REINITIATION_PENDING' with reinitiation_reason == 'TAKE_EXCEEDANCE', and GET /consultations/${consultation_id} still reports status == 'REINITIATION_REQUIRED' with reinitiation_count == 1"
            - "GET /proponents/${proponent_id} reports open_reinitiation_count == 1 and compliance_standing_score == 71.00 — a REJECTED_REPORT event (weight 11) plus an OPEN_REINITIATION event (weight 18), both age 0, with compliance_variant_applied == 'ROLLING_12_MONTH'"
            - "the rejected report's interval is freed: a new report for exactly [2026-10-01, 2026-12-31) with take_units_reported 1.00 succeeds with 201 and takes take_consumed_units to 1.00, again satisfying 4.00 == 1.00 + 3.00"
            - "the rejected report is terminal: a second POST /monitoring-reports/${r1_id}/adjudication returns ERR_INVALID_STATE_TRANSITION (409), so the reversal cannot be applied twice"
