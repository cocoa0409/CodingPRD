            - call: "POST /nqdc-liabilities"
              payload: { nqdc_plan_id: "${plan_filter_id}", employee_id: "${emp_diaz_id}", accrued_to_date_usd: 400000.00, projected_benefit_usd: 500000.00, years_to_payout: 10 }
              as: TreasuryController
              captures: { liab_diaz_id: $.data.id }
          trigger:
            - call: "POST /nqdc-liabilities/${liab_diaz_id}/settle"
              payload: {}
              as: TreasuryController
            - call: "GET /nqdc-plans/${plan_filter_id}/funding-summary"
              payload: {}
              as: TreasuryController
            - call: "GET /nqdc-plans/${plan_filter_id}/funding-summary"
              payload: { basis: "PBO" }
              as: TreasuryController
