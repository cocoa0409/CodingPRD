            - call: "POST /pricing/claims/${cl_id}/honor"
              payload: {}
              as: StoreAssociate
              as_user_id: "${s_id}"
            - call: "POST /pricing/claims/${cl_id}/reverse"
              payload: { reversal_reason: "shopper abandoned the purchase" }
              as: StoreManager
              as_user_id: "${s_id}"
          trigger:
            - call: "GET /pricing/claims/${cl_id}/override-logs"
              payload: {}
              as: ComplianceOfficer
              captures: { all_rows: $.data }
            - call: "GET /pricing/claims/${cl_id}/override-logs?direction=CREDIT"
              payload: {}
              as: ComplianceOfficer
              captures: { credit_rows: $.data }
            - call: "GET /pricing/claims/${cl_id}/override-logs?limit=1"
              payload: {}
              as: ComplianceOfficer
              captures: { first_row: $.data }
          assert:
            - "Unfiltered read: HTTP 200 with total_count == 2, has_more == false, rows in created_at order DEBIT then CREDIT"
            - "Both rows carry approved_discount_cents == 3099, honored_price_cents == 9900 and claim_id == ${cl_id}"
            - "The DEBIT row has approval_tier == ASSOCIATE, approved_by_role == StoreAssociate; the CREDIT row has approved_by_role == StoreManager"
            - "direction=CREDIT returns total_count == 1 with the CREDIT row only"
            - "limit=1 returns exactly one row, has_more == true, and it is the DEBIT row"
            - "Neither OverrideLog row exposes a version field and there is no update or delete route for it"

      - name: corner_batch_cancel_resets_the_orders_it_was_carrying
        claim_type: action_endpoint
        grounds: ["endpoints.POST_/pricing/label-batches/{id}/cancel.side_effects", calculations.label_batch_selection]
        distinguishing_aspect: "Cancelling a batch must un-batch the orders riding on it — signage_status back to NOT_REQUIRED and label_batch_id cleared — while leaving the orders' own status APPROVED, so the two state dimensions are visibly independent."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; store STORE-101 with label_printer_capacity_per_day 5."
            - "Product SKU-CAN-1 own 20000, cost 8000, margin 0.20 -> effective_floor 10000."
            - "Batch B for STORE-101 with window 2026-08-01T02:00:00Z..04:00:00Z and reserved_item_count 2 (item_count 2)."
            - "One MANUAL order at requested_price 19000 with signage_store_id STORE-101, submitted and approved so it queues into B."
          setup_api_calls:
            - call: "POST /pricing/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /pricing/markets"
              payload: { market_code: "US-WEST", name: "US West", strategic_positioning: "AT_PARITY", strategic_index_target_bp: 9800 }
              as: PlatformAdmin
              captures: { m_id: $.data.id }
            - call: "POST /pricing/products"
              payload: { market_id: "${m_id}", sku: "SKU-CAN-1", category_code: "APPLIANCE", brand: "Vitala", own_price_cents: 20000, unit_cost_cents: 8000, margin_floor_pct: 0.20 }
              as: PlatformAdmin
              captures: { p_id: $.data.id, p_ver: $.data.version }
            - call: "POST /pricing/stores"
              payload: { market_id: "${m_id}", store_code: "STORE-101", override_authority_cents: 5000, label_printer_capacity_per_day: 5 }
              as: PlatformAdmin
              captures: { s_id: $.data.id }
            - call: "POST /pricing/label-batches"
              payload: { store_id: "${s_id}", window_start: "2026-08-01T02:00:00Z", window_end: "2026-08-01T04:00:00Z", reserved_item_count: 2 }
              as: StoreManager
              as_user_id: "${s_id}"
              captures: { b_id: $.data.id }
            - call: "POST /pricing/change-orders"
              payload: { product_id: "${p_id}", origin: "MANUAL", requested_price_cents: 19000, effective_from: "2026-08-01T00:00:00Z", expected_product_version: "${p_ver}", signage_store_id: "${s_id}" }
              as: PricingAnalyst
              as_user_id: "analyst-1"
              captures: { ord_id: $.data.id }
            - call: "POST /pricing/change-orders/${ord_id}/submit"
              payload: {}
              as: PricingAnalyst
              as_user_id: "analyst-1"
            - call: "POST /pricing/change-orders/${ord_id}/decide"
              payload: { decision: "APPROVE" }
              as: PricingManager
              as_user_id: "manager-9"
              captures: { sig: $.data.signage_status }
          trigger:
            - call: "POST /pricing/label-batches/${b_id}/cancel"
              payload: { cancel_reason: "printer offline" }
              as: StoreManager
              as_user_id: "${s_id}"
              captures: { b_status: $.data.status }
          assert:
            - "Before the trigger: PriceChangeOrder.${ord_id}.signage_status == QUEUED with label_batch_id == ${b_id}, LabelPrintBatch.${b_id}.queued_order_ids == [${ord_id}] and item_count == 3, Store.${s_id}.label_slots_used_today == 3 with label_slots_remaining_today == 2"
            - "HTTP 200 with LabelPrintBatch.${b_id}.status == CANCELLED"
            - "PriceChangeOrder.${ord_id}.signage_status == NOT_REQUIRED and label_batch_id == null"
            - "PriceChangeOrder.${ord_id}.status is still APPROVED — the signage dimension reset does not disturb the approval dimension"
            - "Store.${s_id}.label_slots_used_today == 0 and label_slots_remaining_today == 5"

      - name: corner_clock_endpoint_moves_time_without_recomputing_state
        claim_type: conditional_action
        grounds: ["endpoints.POST_/pricing/_clock/set_current_utc.side_effects", calculations.effective_competitor_price]
        distinguishing_aspect: "Advancing the clock past the 72-hour observation TTL must not rewrite any stored row, yet the very next business call must evaluate freshness against the new instant — so the link still reads SUFFICIENT while an automated order fails for want of a benchmark."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "Product SKU-CLK-1 own 20000, cost 8000, margin 0.20; CONFIRMED link to ACTIVE PRIMARY C-A with an ACTIVE in-stock observation at 20000 taken 2026-07-31T18:00:00Z."
            - "ACTIVE APPLIANCE rule at target 9700, max_change_pct 0.10, frequency 7 days, so rule selection can never be the blocking step."
          setup_api_calls:
            - call: "POST /pricing/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /pricing/markets"
              payload: { market_code: "US-WEST", name: "US West", strategic_positioning: "AT_PARITY", strategic_index_target_bp: 9800 }
              as: PlatformAdmin
              captures: { m_id: $.data.id }
            - call: "POST /pricing/products"
              payload: { market_id: "${m_id}", sku: "SKU-CLK-1", category_code: "APPLIANCE", brand: "Vitala", own_price_cents: 20000, unit_cost_cents: 8000, margin_floor_pct: 0.20 }
              as: PlatformAdmin
              captures: { p_id: $.data.id, p_ver: $.data.version }
            - call: "POST /pricing/competitors"
              payload: { market_id: "${m_id}", competitor_code: "C-A", name: "Alpha Mart", collection_method: "ONLINE", tier: "PRIMARY" }
              as: PlatformAdmin
              captures: { c1_id: $.data.id }
            - call: "POST /pricing/matches"
              payload: { product_id: "${p_id}", competitor_id: "${c1_id}", match_method: "IDENTIFIER", identifier_score: 95, attribute_score: 95, image_score: 95, competitor_identifier: "00712345678905" }
              as: PricingAnalyst
              captures: { l_id: $.data.id }
            - call: "POST /pricing/matches/${l_id}/review"
              payload: { decision: "CONFIRM" }
              as: PricingManager
              as_user_id: "manager-9"
            - call: "POST /pricing/observations"
              payload: { link_id: "${l_id}", observed_price_cents: 20000, collection_method: "ONLINE", observed_at: "2026-07-31T18:00:00Z", in_stock: true }
              as: DataCollector
              captures: { o_id: $.data.id }
            - call: "POST /pricing/repricing-rules"
              payload: { market_id: "${m_id}", category_code: "APPLIANCE", target_position_bp: 9700, max_change_pct: 0.10, change_frequency_limit_days: 7, priority: 10 }
              as: PricingManager
              as_user_id: "manager-9"
              captures: { r_id: $.data.id }
          trigger:
            - call: "POST /pricing/_clock/set_current_utc"
              payload: { current_utc: "2026-08-05T00:00:00Z" }
              as: PlatformAdmin
              captures: { now: $.data }
            - call: "GET /pricing/matches/${l_id}"
              payload: {}
              as: PricingAnalyst
              captures: { link_after: $.data }
            - call: "POST /pricing/change-orders"
              payload: { product_id: "${p_id}", origin: "AUTOMATED_RULE", effective_from: "2026-08-05T00:00:00Z", expected_product_version: "${p_ver}" }
              as: PricingAnalyst
              as_user_id: "analyst-1"
              captures: { err_stale: $.data.error_id }
          assert:
            - "The clock call returns HTTP 200 with current_utc == 2026-08-05T00:00:00Z"
            - "GET on the link still reads data_status == SUFFICIENT, latest_effective_price_cents == 20000, selected_observation_id == ${o_id}, gap_bp == 10000 — no stored field was recomputed by the clock move"
            - "PriceObservation.${o_id}.status is still ACTIVE and updated_at is unchanged from before the clock move"
            - "The AUTOMATED_RULE order returns HTTP 422 with error_id == ERR_NO_COMPETITOR_BENCHMARK, because the 2026-07-31T18:00:00Z observation is now more than 72 hours old"
            - "Product.${p_id}.version is still 1"

      - name: corner_execute_endpoint_full_side_effect_chain
        claim_type: action_endpoint
        grounds: ["endpoints.POST_/pricing/change-orders/{id}/execute.side_effects"]
        distinguishing_aspect: "One execute call must move the product price, recompute every CONFIRMED link's gap, auto-suspend competitors over the stale-share limit and bump the rule's applied_order_count."
        excluded_because:
          difficulty_instance: transitive_cascade / execute_order_drift_autosuspends_competitor_depth5
          rationale: "The §1.8 transitive_cascade instance already asserts all five levels of this endpoint's side-effect list end to end, including the rule counter and the voided observations."

      - name: corner_honor_endpoint_multi_entity_writes
        claim_type: action_endpoint
        grounds: ["endpoints.POST_/pricing/claims/{id}/honor.side_effects"]
        distinguishing_aspect: "Honoring writes four entities at once: an OverrideLog row, the store budget, a spawned APPROVED PRICE_MATCH order with its label slot, and the policy's honored_claim_count."
        excluded_because:
          difficulty_instance: transitive_cascade / honor_claim_writes_ledger_order_and_label_depth3
          rationale: "The §1.8 transitive_cascade instance already asserts every item in this endpoint's side-effect list on a single honored claim."

      - name: corner_publish_endpoint_supersedes_and_repostures
        claim_type: action_endpoint
        grounds: ["endpoints.POST_/pricing/index-reports/{id}/publish.side_effects"]
        distinguishing_aspect: "Publishing supersedes the prior PUBLISHED report for the same key, recomputes the market posture and, when the posture is FROZEN, suspends live orders and policies and releases their labels."
        excluded_because:
          difficulty_instance: transitive_cascade / publish_frozen_report_suspends_orders_and_releases_labels_depth4
          rationale: "The §1.8 transitive_cascade instance already publishes a FROZEN-posture report and asserts the supersession, the posture write, the suspended orders and policies and the released labels."

      - name: corner_create_order_with_supersedes_releases_the_old_label
        claim_type: cross_reference_link
        grounds: ["endpoints.POST_/pricing/change-orders.side_effects"]
        distinguishing_aspect: "Passing supersedes_order_id links the new order to a live one, moves that one to SUPERSEDED and returns its label slot in the same request."
        excluded_because:
          difficulty_instance: compensating_invariant / label_slot_conserved_after_queue_then_supersede_release
          rationale: "The §1.8 compensating_invariant instance already queues a label, supersedes the order through this input field and reconciles the store slot ledger before and after."

  - section: errors
    instances:
      - name: corner_every_path_id_not_found_code_is_reachable
        claim_type: error_triggerability
        grounds: [validations.priority_20_existence, errors]
        distinguishing_aspect: "Each resource family reports its own 404 code rather than a shared generic one, so a single unknown UUID walked across all twelve GET-by-id routes must produce twelve distinct error_id values."
        test_recipe:
          setup:
            - "Empty database; no rows of any kind are created."
