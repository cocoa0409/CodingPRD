              captures: { client_id: $.data.id }
            - call: "POST /projects"
              payload: { client_id: "${client_id}", site_address: "1 St", region_code: "WEST" }
              as: ProjectManager
              captures: { proj_id: $.data.id }
            - call: "POST /projects/${proj_id}/rack"
              payload: { rack_units_total: 8, subnet_cidr: "10.20.0.0/24" }
              as: ProjectManager
              captures: { rack_id: $.data.id }
          trigger:
            - call: "GET /projects/${proj_id}/rack"
              payload: {}
              as: ProjectManager
          assert:
            - "response_type == array with total_count == 1 containing rack ${rack_id}"

