  # =========================================================================
  # Calculations
  # =========================================================================
  - section: calculations
    instances:
      - name: new_account_hold_exception_outranks_the_large_deposit_exception
        claim_type: Correct Result
        grounds:
          - calculations.check_hold_schedule
          - entities.CheckHold.fields.hold_type
          - entities.CheckHold.fields.hold_release_at
        distinguishing_aspect: "On a zero-day-old account a 600000-cent CHECK is held as EXCEPTION_NEW_ACCOUNT for 9 days (release 2026-08-10T00:00:00Z), not as EXCEPTION_LARGE_DEPOSIT for 7 days, because the ladder tests account age before amount."
        test_recipe:
          setup:
            - "Logical clock at its 2026-08-01T00:00:00Z default; one ACTIVE DepositAccount opened at that instant, so account_age_days is 0."
          setup_api_calls:
            - call: "POST /deposit-fraud/customers"
              payload: { legal_name: "Young Account Depositor", tin_last4: "0018" }
              as: OperationsAdmin
              as_user_id: "ops-1"
