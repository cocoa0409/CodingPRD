  - rule_id: transitive_cascade
    instances:
      - name: permit_lapse_blocks_animal_reverts_booking_releases_trail_capacity
        grounds:
          - state_machines.Permit.ACTIVE_to_LAPSED
          - state_machines.AnimalAmbassador.welfare_posture_BLOCKED
          - state_machines.Booking.CONFIRMED_to_REQUESTED
          - calculations.trail_utilization_and_occupancy
        distinguishing_aspect: |
          Depth-4 chain rooted in the permitting domain: Permit LAPSED (link 1) forces the
          animal's welfare_posture to BLOCKED (link 2), which is what pushes the CONFIRMED
          booking back to REQUESTED with its resources cleared (link 3), which is what releases
          the 23 reserved trail persons and the 120 projected animal minutes (link 4). Each
          link exists only because the previous one fired.
        test_recipe:
