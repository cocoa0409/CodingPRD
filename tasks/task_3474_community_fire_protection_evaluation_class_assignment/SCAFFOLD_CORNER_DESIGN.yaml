          setup: ["community NFF 3000, works 3000, storage 0; three certified tests: A 2026-08-15 (fresh, 2172), B 2021-11-30 (stale, 1629), C 2021-12-01 (exactly at cutoff, fresh, 1267); cycle freeze 2026-12-01, in SCORING"]
