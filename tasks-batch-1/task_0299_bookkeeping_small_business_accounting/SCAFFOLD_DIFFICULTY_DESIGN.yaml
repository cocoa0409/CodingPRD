  # =========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: tax_rate_window_overlap_same_jurisdiction
        grounds:
          - entities.TaxRate.fields.effective_from
          - entities.TaxRate.fields.effective_to
          - validations[priority=9]
          - errors[ERR_TAX_RATE_OVERLAP]
          - endpoints["POST /ledger/tax-rates"]
        distinguishing_aspect: |
          TaxRate intervals on a jurisdiction use half-open [effective_from, effective_to) semantics
          where ANY overlap is forbidden but exact adjacency (new.from == existing.to) is allowed.
          A new CA rate [2026-06-01, 2026-08-01) overlapping an existing CA rate [2026-01-01,
          2026-07-01) is rejected. Resource = TaxRate/jurisdiction.
        test_recipe:
          setup:
            - "Company with an existing CA TaxRate effective [2026-01-01, 2026-07-01)."
          setup_api_calls:
            - call: "POST /ledger/companies"
              payload: { legal_name: "RateCo", base_currency: "USD", accounting_basis: "ACCRUAL" }
              as: Owner
              as_user_id: "u_owner"
              captures: { co: $.data.id }
            - call: "POST /ledger/tax-rates"
              payload: { company_id: "${co}", jurisdiction: "CA", rate_bps: 875, effective_from: "2026-01-01T00:00:00.000Z", effective_to: "2026-07-01T00:00:00.000Z" }
              as: Accountant
              as_user_id: "u_acct"
              captures: { tr1: $.data.id }
          trigger:
            - call: "POST /ledger/tax-rates"
              payload: { company_id: "${co}", jurisdiction: "CA", rate_bps: 900, effective_from: "2026-06-01T00:00:00.000Z", effective_to: "2026-08-01T00:00:00.000Z" }
              as: Accountant
              as_user_id: "u_acct"
              captures: { err: $.data.error_id }
          assert:
            - "trigger response error_id == ERR_TAX_RATE_OVERLAP"
            - "trigger response HTTP status == 409"

      - name: accounting_period_non_contiguous_gap_rejected
        grounds:
          - entities.AccountingPeriod.fields.start_date
          - entities.AccountingPeriod.fields.end_date
          - validations[priority=9]
          - errors[ERR_PERIOD_NOT_CONTIGUOUS]
          - endpoints["POST /ledger/accounting-periods"]
        distinguishing_aspect: |
          AccountingPeriod intervals use a different interval semantics: periods must be exactly
          contiguous (new.start_date == prior.end_date) with NO gap and NO overlap. A second period
          starting 2026-03-01 after a first ending 2026-02-01 leaves a gap and is rejected with
          ERR_PERIOD_NOT_CONTIGUOUS. Resource = Company period calendar (distinct from TaxRate;
          adjacency-required vs overlap-forbidden-gap-allowed).
        test_recipe:
          setup:
            - "Company with retained-earnings account configured and a first period [2026-01-01, 2026-02-01)."
          setup_api_calls:
            - call: "POST /ledger/companies"
              payload: { legal_name: "GapCo", base_currency: "USD", accounting_basis: "ACCRUAL" }
              as: Owner
              as_user_id: "u_owner"
              captures: { co: $.data.id, co_v1: $.data.version }
            - call: "POST /ledger/accounts"
              payload: { company_id: "${co}", code: "3900", name: "Retained Earnings", account_type: "EQUITY" }
              as: Owner
              as_user_id: "u_owner"
              captures: { re: $.data.id }
            - call: "PATCH /ledger/companies/${co}"
              payload: { retained_earnings_account_id: "${re}", expected_company_version: "${co_v1}" }
              as: Owner
              as_user_id: "u_owner"
              captures: { co_v2: $.data.version }
            - call: "POST /ledger/accounting-periods"
              payload: { company_id: "${co}", period_label: "2026-01", start_date: "2026-01-01T00:00:00.000Z", end_date: "2026-02-01T00:00:00.000Z", expected_company_version: "${co_v2}" }
              as: Owner
              as_user_id: "u_owner"
              captures: { per1: $.data.id }
            - call: "GET /ledger/companies/${co}"
              payload: {}
              as: Owner
              as_user_id: "u_owner"
              captures: { co_v3: $.data.version }
          trigger:
            - call: "POST /ledger/accounting-periods"
              payload: { company_id: "${co}", period_label: "2026-03", start_date: "2026-03-01T00:00:00.000Z", end_date: "2026-04-01T00:00:00.000Z", expected_company_version: "${co_v3}" }
              as: Owner
              as_user_id: "u_owner"
              captures: { err: $.data.error_id }
          assert:
            - "trigger response error_id == ERR_PERIOD_NOT_CONTIGUOUS"
            - "trigger response HTTP status == 409"

  # =========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: void_entry_preserves_trial_balance
        grounds:
          - state_machines.JournalEntry.POSTED_to_VOIDED
          - entities.Company.fields.trial_balance_status
          - entities.Account.fields.posted_balance_cents
        distinguishing_aspect: |
          Conserved quantity = global trial balance: sum over all POSTED lines of debit_cents minus
          credit_cents == 0. Posting then voiding (which posts a swapped reversal) leaves
          sum(posted debits) - sum(posted credits) == 0 and trial_balance_status == BALANCED. Quantity
          = system-wide debit/credit equality.
