  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: deal_requote_requires_unit_in_stock_held_elsewhere
        grounds:
          - state_machines.Deal.DECLINED_to_QUOTED
          - state_machines.Unit.IN_STOCK_to_ON_HOLD
          - errors[ERR_UNIT_NOT_AVAILABLE]
          - entities.Unit.fields.held_by_deal_id
        distinguishing_aspect: |
          Entity pair Deal->Unit: a Deal's DECLINED->QUOTED re-quote transition
          requires the referenced Unit to be IN_STOCK. After deal1 is declined
          (Unit released to IN_STOCK) and a second deal quotes the same unit
          (Unit now ON_HOLD held by deal2), deal1's re-quote is rejected with
          ERR_UNIT_NOT_AVAILABLE because the Unit is no longer IN_STOCK.
        test_recipe:
          setup:
            - "Deal1 quoted (Unit ON_HOLD by deal1) then submit-finance then declined (Unit IN_STOCK). A SECOND deal on the same unit is then quoted (Unit ON_HOLD held by deal2). Deal1 is in DECLINED, Unit is held by deal2."
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Cross One", email: "c1@x.com", phone: "555-0111" }
              as: SalesManager
              captures: { cust_id: $.data.id }
            - call: "POST /units"
              payload: { vin: "1HD1KB4197Y000120", category: "MOTORCYCLE", model_year: 2024, msrp_cents: 1500000, dealer_cost_cents: 1100000, acquisition_kind: "CASH_OWNED" }
              as: SalesManager
              captures: { unit_id: $.data.id }
            - call: "POST /units/${unit_id}/receive"
              payload: {}
              as: SalesManager
            - call: "POST /deals"
              payload: { customer_id: "${cust_id}", unit_id: "${unit_id}", sale_price_cents: 1500000, tax_rate_bps: 800, down_payment_cents: 0 }
              as: SalesManager
              captures: { deal1_id: $.data.id }
            - call: "POST /deals/${deal1_id}/quote"
              payload: {}
              as: SalesManager
            - call: "POST /deals/${deal1_id}/submit-finance"
              payload: {}
              as: FinanceManager
            - call: "POST /deals/${deal1_id}/decline"
              payload: {}
              as: FinanceManager
            - call: "POST /deals"
              payload: { customer_id: "${cust_id}", unit_id: "${unit_id}", sale_price_cents: 1500000, tax_rate_bps: 800, down_payment_cents: 0 }
              as: SalesManager
              captures: { deal2_id: $.data.id }
            - call: "POST /deals/${deal2_id}/quote"
              payload: {}
              as: SalesManager
          trigger:
            - call: "POST /deals/${deal1_id}/quote"
              payload: {}
              as: SalesManager
              captures: { err: $.data.error_id }
          assert:
            - "response status == 409"
            - "data.error_id == ERR_UNIT_NOT_AVAILABLE"
            - "Unit.${unit_id}.held_by_deal_id == ${deal2_id}"

      - name: warranty_approve_requires_unit_delivered
        grounds:
          - state_machines.WarrantyClaim.SUBMITTED_to_APPROVED
          - errors[ERR_UNIT_NOT_DELIVERED]
          - entities.Unit.fields.status
        distinguishing_aspect: |
          Entity pair WarrantyClaim->Unit (DIFFERENT pair from Deal->Unit):
          approving a WarrantyClaim requires the referenced Unit.status==DELIVERED.
          On an IN_STOCK unit the approve is rejected with ERR_UNIT_NOT_DELIVERED.
        test_recipe:
          setup:
            - "An IN_STOCK Unit (never sold). A SUBMITTED WarrantyClaim references it."
          setup_api_calls:
            - call: "POST /units"
              payload: { vin: "1HD1KB4197Y000130", category: "SNOWMOBILE", model_year: 2024, msrp_cents: 1700000, dealer_cost_cents: 1300000, acquisition_kind: "CASH_OWNED" }
              as: SalesManager
              captures: { unit_id: $.data.id }
            - call: "POST /units/${unit_id}/receive"
              payload: {}
              as: SalesManager
            - call: "POST /warranty-claims"
              payload: { unit_id: "${unit_id}", kind: "WARRANTY" }
              as: ServiceAdvisor
              captures: { claim_id: $.data.id }
          trigger:
            - call: "POST /warranty-claims/${claim_id}/approve"
              payload: {}
              as: DealerPrincipal
              captures: { err: $.data.error_id }
          assert:
            - "response status == 409"
            - "data.error_id == ERR_UNIT_NOT_DELIVERED"
            - "WarrantyClaim.${claim_id}.status == SUBMITTED"

