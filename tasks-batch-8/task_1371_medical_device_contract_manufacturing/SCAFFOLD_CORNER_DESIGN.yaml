  # ==================================================================
  - section: calculations
    instances:
      - name: audit_due_schedule_tier_intervals
        claim_type: correct_result
        grounds: [calculations.audit_due_schedule, entities.Supplier.fields.next_audit_due_at, entities.Supplier.fields.is_audit_overdue]
        distinguishing_aspect: "Never-audited supplier: due = created_at + 12mo (2027-08-01). After a clean audit at 2026-08-01 with finalized score 100 (tier LOW), due = last_audit + 24mo = 2028-08-01. is_audit_overdue flips true exactly at the due instant (inclusive <=)."
        test_recipe:
          setup: ["supplier SUP-AD QUALIFIED (agreement notice 30d); one audit scheduled [2026-09-10, 2026-09-11)"]
          setup_api_calls:
            - { call: "POST /api/suppliers", payload: { supplier_code: "SUP-AD", name: "AuditDue" }, as: SupplierQualityEngineer, as_user_id: "sqe-1", captures: { sup_id: "$.data.id", sup_v: "$.data.version", due0: "$.data.next_audit_due_at" } }
            - { call: "POST /api/suppliers/${sup_id}/quality-agreements", payload: { agreement_code: "QA-AD", audit_rights_granted: true, audit_notice_days: 30, change_notice_days: 90, effective_from: "2026-07-01T00:00:00Z", effective_to: "2027-07-01T00:00:00Z", expected_supplier_version: "${sup_v}" }, as: SupplierQualityEngineer, as_user_id: "sqe-1", captures: { agr_id: "$.data.id" } }
            - { call: "POST /api/quality-agreements/${agr_id}/activate", payload: {}, as: SupplierQualityEngineer, as_user_id: "sqe-1" }
            - { call: "POST /api/suppliers/${sup_id}/qualify", payload: {}, as: SupplierQualityEngineer, as_user_id: "sqe-1" }
            - { call: "POST /api/suppliers/${sup_id}/audits", payload: { scheduled_start: "2026-09-10T00:00:00Z", scheduled_end: "2026-09-11T00:00:00Z" }, as: SupplierQualityEngineer, as_user_id: "sqe-1", captures: { aud_id: "$.data.id" } }
          trigger:
            - { call: "POST /api/supplier-audits/${aud_id}/complete", payload: { findings_count: 0, major_findings_count: 0 }, as: SupplierQualityEngineer, as_user_id: "sqe-1" }
            - { call: "GET /api/suppliers/${sup_id}", payload: {}, as: SupplierQualityEngineer, as_user_id: "sqe-1", captures: { due1: "$.data.next_audit_due_at", tier1: "$.data.risk_tier", od1: "$.data.is_audit_overdue" } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2028-08-01T00:00:00Z" }, as: QMSAdmin, as_user_id: "admin-1" }
            - { call: "GET /api/suppliers/${sup_id}", payload: {}, as: SupplierQualityEngineer, as_user_id: "sqe-1", captures: { od2: "$.data.is_audit_overdue" } }
          assert:
            - "at creation: next_audit_due_at == 2027-08-01T00:00:00Z (created_at + 12 months)"
            - "after clean audit: risk_tier == LOW, next_audit_due_at == 2028-08-01T00:00:00Z (last_audit_completed_at 2026-08-01 + 24 months), is_audit_overdue == false"
            - "at clock == 2028-08-01T00:00:00Z: is_audit_overdue == true (due boundary is inclusive)"

