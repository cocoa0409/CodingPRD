        distinguishing_aspect: "consolidation_target_crossing_id equal to the subject crossing_id is rejected."
        test_recipe:
          setup: ["Locality; ACTIVE crossing"]
          setup_api_calls:
            - call: "POST /localities"
              payload: { locality_name: "Self City", state_code: "KS", contact_email: "pw@self.gov" }
              as: ProgramAdministrator
              captures: { loc_id: $.data.id }
            - call: "POST /crossings"
              payload: { dot_crossing_number: "DOT-040001", railroad_code: "BNSF", road_authority_locality_id: "${loc_id}", highway_functional_class: "LOCAL", annual_train_count: 365, train_speed_max_mph: 25, aadt: 5000, sight_distance_rating: 3, warning_device_class: "GATES" }
