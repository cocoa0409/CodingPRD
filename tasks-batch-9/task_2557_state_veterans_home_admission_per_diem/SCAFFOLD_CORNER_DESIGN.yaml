      - name: val_empty_census_claim_rejected_on_submit
        claim_type: violation_error
        grounds:
          - validations[priority=92,ERR_CLAIM_CENSUS_EMPTY]
          - errors.ERR_CLAIM_CENSUS_EMPTY
          - endpoints.POST_svh_per_diem_claims_id_submit
        distinguishing_aspect: |
          An empty month is legal to OPEN and illegal to SUBMIT: the DRAFT claim for 2026-07 is
          created with resident_day_count 0, billable_day_count 0, claim_amount_cents 0 and
          census_reported_resident_count 0, and the submit is then rejected with
          ERR_CLAIM_CENSUS_EMPTY - not with ERR_CLAIM_MONTH_NOT_CLOSED, because July is already
          closed relative to the 2026-08-01 clock.
        test_recipe:
          setup:
            - "One RECOGNIZED VeteransHome with one CERTIFIED NURSING unit and NO residents, so no CensusDay row exists for any month."
            - "The logical clock stands at 2026-08-01T00:00:00Z, which makes claim_month 2026-07 a closed month."
          setup_api_calls:
            - call: "POST /svh/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: StateProgramAdmin
            - call: "POST /svh/veterans-homes"
              payload: { name: "Stonebridge State Veterans Home", state_code: "MN", recognition_effective_date: "2026-06-01" }
              as: StateProgramAdmin
              captures: { home_id: "$.data.id", rec: "$.data.recognition_status" }
            - call: "POST /svh/veterans-homes/${home_id}/care-units"
              payload: { unit_name: "Nursing A", care_level: "NURSING", licensed_bed_count: 2, out_of_service_bed_count: 0 }
              as: StateProgramAdmin
              captures: { nu_id: "$.data.id", cert: "$.data.certification_status" }
          trigger:
            - call: "POST /svh/per-diem-claims"
              payload: { veterans_home_id: "${home_id}", care_unit_id: "${nu_id}", claim_month: "2026-07", basis: "AUDITED_BASIS" }
              as: BusinessOfficeManager
              as_user_id: "bom-1"
              captures: { c_id: "$.data.id", c_status: "$.data.status", c_rd: "$.data.resident_day_count", c_bd: "$.data.billable_day_count", c_amt: "$.data.claim_amount_cents", c_heads: "$.data.census_reported_resident_count" }
            - call: "POST /svh/per-diem-claims/${c_id}/submit"
              payload: {}
              as: BusinessOfficeManager
              as_user_id: "bom-1"
              captures: { empty_err: "$.data.error_id" }
            - call: "GET /svh/per-diem-claims/${c_id}"
              payload: {}
              as: BusinessOfficeManager
              captures: { c_status2: "$.data.status", c_submitted_at: "$.data.submitted_at", c_recog: "$.data.recognition_verified" }
          assert:
            - "rec == RECOGNIZED"
            - "cert == CERTIFIED"
            - "c_status == DRAFT"
            - "c_rd == 0"
            - "c_bd == 0"
            - "c_amt == 0"
            - "c_heads == 0"
            - "the submit returns HTTP 409"
            - "empty_err == ERR_CLAIM_CENSUS_EMPTY"
            - "c_status2 == DRAFT"
            - "c_submitted_at == null"
            - "c_recog == false"

