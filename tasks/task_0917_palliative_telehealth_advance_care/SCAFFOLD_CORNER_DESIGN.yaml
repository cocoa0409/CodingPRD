  - section: validations
    instances:
      - name: witness_who_is_an_active_surrogate_returns_witness_conflict
        claim_type: violation_to_error
        grounds:
          - validations[priority=11]
          - errors[ERR_WITNESS_CONFLICT]
          - entities.SurrogateDesignation.fields.person_user_id
        distinguishing_aspect: "A WITNESS signature signed by the person_user_id of a designated surrogate is rejected, while the same document accepts two unrelated witnesses."
        test_recipe:
          setup:
            - "One Patient in program_status ACTIVE with attending_clinician_user_id u_attending_1."
            - "One ACTIVE SurrogateDesignation whose person_user_id is u_spouse_1."
            - "One LIVING_WILL AdvanceCareDocument in status DRAFT with no signatures."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /palliative/patients"
              payload: { mrn: "MRN-2025", full_name: "Zoe Marchand", date_of_birth: "1950-01-01", jurisdiction_code: "JUR_TWO_WITNESS", attending_clinician_user_id: "u_attending_1", opioid_status: "OPIOID_TOLERANT" }
              as: IntakeCoordinator
              as_user_id: "u_intake_1"
              captures: { p_id: $.data.id }
            - call: "POST /palliative/referrals"
              payload: { patient_id: "${p_id}", source: "HOSPITAL_DISCHARGE", prognosis_months: 6, serious_illness_criteria_count: 3 }
              as: IntakeCoordinator
              as_user_id: "u_intake_1"
              captures: { ref_id: $.data.id }
            - call: "POST /palliative/referrals/${ref_id}/decision"
              payload: { decision: "ACCEPT" }
              as: IntakeCoordinator
              as_user_id: "u_intake_1"
            - call: "POST /palliative/surrogates"
              payload: { patient_id: "${p_id}", person_user_id: "u_spouse_1", person_name: "Ruth Marchand", relationship: "SPOUSE", is_beneficiary: true }
              as: SocialWorker
              as_user_id: "u_sw_1"
            - call: "POST /palliative/advance-care-documents"
              payload: { patient_id: "${p_id}", document_type: "LIVING_WILL", stated_code_status: "DNR" }
              as: SocialWorker
              as_user_id: "u_sw_1"
              captures: { doc_id: $.data.id }
          trigger:
            - call: "POST /palliative/advance-care-documents/${doc_id}/signatures"
              payload: { signature_type: "WITNESS", signer_user_id: "u_spouse_1" }
              as: SocialWorker
              as_user_id: "u_sw_1"
              captures: { err_surrogate: $.data.error_id }
            - call: "POST /palliative/advance-care-documents/${doc_id}/signatures"
              payload: { signature_type: "WITNESS", signer_user_id: "u_attending_1" }
              as: SocialWorker
              as_user_id: "u_sw_1"
              captures: { err_attending: $.data.error_id }
            - call: "POST /palliative/advance-care-documents/${doc_id}/signatures"
              payload: { signature_type: "WITNESS", signer_user_id: "u_witness_1" }
              as: SocialWorker
              as_user_id: "u_sw_1"
          assert:
            - "${err_surrogate} == ERR_WITNESS_CONFLICT"
            - "${err_attending} == ERR_WITNESS_CONFLICT"
            - "HTTP status of both rejected signatures == 422"
            - "AdvanceCareDocument.${doc_id}.witness_signature_count == 1"
            - "AdvanceCareDocument.${doc_id}.execution_ready == false"
            - "AdvanceCareDocument.${doc_id}.status == DRAFT"

      - name: jurisdiction_requirement_outranks_the_polst_signature_check
        claim_type: priority_ordering
        grounds:
          - validations[priority=12]
          - validations[priority=13]
          - errors[ERR_EXECUTION_REQUIREMENT_UNMET]
          - errors[ERR_SIGNATURE_INCOMPLETE]
        distinguishing_aspect: "A POLST in a JUR_TWO_WITNESS jurisdiction with only one witness but both POLST signatures fails at rung 12, and a POLST in a JUR_NOTARY jurisdiction with its notary signature but no patient-or-surrogate signature fails at rung 13, proving the two rungs are independently reachable in that order."
        test_recipe:
          setup:
            - "Patient W in program_status ACTIVE with jurisdiction_code JUR_TWO_WITNESS and a POLST carrying one WITNESS, one SIGNING_PHYSICIAN and one PATIENT_OR_SURROGATE signature."
            - "Patient N in program_status ACTIVE with jurisdiction_code JUR_NOTARY and a POLST carrying one NOTARY and one SIGNING_PHYSICIAN signature."
