# =============================================================================
# SCAFFOLD_DIFFICULTY_DESIGN.yaml — §1.8 Test Targeting Index (task 2017)
# 9 Difficulty Rules, 22 instances. Every test_recipe drives empty-DB -> setup
# purely via §1.5 endpoints. Standard ruleset payload used in most instances
# ("RS-STD"): base 10, review 60, decline 100, tiers [0->5, 25000->20,
# 100000->45], channels {CHIP 0, CONTACTLESS 5, CNP 25, ATM 30}, cross 20,
# high-risk x2 on ["RU"], watch 15, compromised 50.
# =============================================================================
scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: shadow_rescore_under_superseding_ruleset
        grounds:
          - calculations.authorization_scoring
          - entities.AuthTransaction.fields.shadow_score
          - entities.AuthTransaction.fields.shadow_decision
          - entities.AuthTransaction.fields.ruleset_id
        distinguishing_aspect: |
          Entity domain = AuthTransaction scoring. Two valid answers for identical transaction
          data: realtime (score 75/decision REVIEW under the ruleset pinned at intake) vs shadow
          (score 85/decision DECLINE under the superseding ruleset active at read time) —
          the pinned ruleset is provably retained while the shadow diverges.
        test_recipe:
          setup:
            - "ACTIVE GLOBAL ruleset RS1 with decline_threshold 100, CNP weight 25"
            - "One transaction scored 75 -> REVIEW under RS1 (10 base + 20 tier + 25 CNP + 20 cross-border MX)"
            - "RS2 activated (CNP weight 35, review 50, decline 80) superseding RS1 -> RS1 RETIRED"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: FraudOpsManager }
            - { call: "POST /fraudops/accounts", payload: { account_number: "ACCT-DV1", cardholder_name: "Dee Vee", home_country: "US" }, as: FraudOpsManager, captures: { acct: "$.data.id" } }
            - { call: "POST /fraudops/cards", payload: { account_id: "${acct}", pan_token: "PT-DV1", product_type: "CREDIT", network: "VISA" }, as: FraudOpsManager, captures: { card: "$.data.id" } }
            - { call: "POST /fraudops/rule-sets", payload: { scope: "GLOBAL", base_score: 10, review_threshold: 60, decline_threshold: 100, amount_tiers: [{min_amount_cents: 0, points: 5}, {min_amount_cents: 25000, points: 20}, {min_amount_cents: 100000, points: 45}], channel_weights: {CHIP: 0, CONTACTLESS: 5, CNP: 25, ATM: 30}, cross_border_weight: 20, high_risk_multiplier: 2, watch_weight: 15, compromised_weight: 50, high_risk_countries: ["RU"] }, as: FraudAnalyst, as_user_id: "analyst-1", captures: { rs1: "$.data.id" } }
            - { call: "POST /fraudops/rule-sets/${rs1}/activate", as: FraudOpsManager, as_user_id: "mgr-1" }
            - { call: "POST /fraudops/auth-transactions", payload: { card_id: "${card}", amount_cents: 99999, merchant_id: "M-1", merchant_category_code: "5411", channel: "CNP", origin_country: "MX" }, as: NetworkGateway, captures: { t1: "$.data.id" } }
            - { call: "POST /fraudops/rule-sets", payload: { scope: "GLOBAL", base_score: 10, review_threshold: 50, decline_threshold: 80, amount_tiers: [{min_amount_cents: 0, points: 5}, {min_amount_cents: 25000, points: 20}, {min_amount_cents: 100000, points: 45}], channel_weights: {CHIP: 0, CONTACTLESS: 5, CNP: 35, ATM: 30}, cross_border_weight: 20, high_risk_multiplier: 2, watch_weight: 15, compromised_weight: 50, high_risk_countries: ["RU"] }, as: FraudAnalyst, as_user_id: "analyst-1", captures: { rs2: "$.data.id" } }
            - { call: "POST /fraudops/rule-sets/${rs2}/activate", as: FraudOpsManager, as_user_id: "mgr-1" }
          trigger:
            - { call: "GET /fraudops/auth-transactions/${t1}", as: FraudOpsManager }
          assert:
            - "AuthTransaction.${t1}.auth_score == 75"
            - "AuthTransaction.${t1}.decision == REVIEW"
            - "AuthTransaction.${t1}.ruleset_id == ${rs1}"
            - "AuthTransaction.${t1}.shadow_score == 85"
            - "AuthTransaction.${t1}.shadow_decision == DECLINE"
            - "AuthTransaction.${t1}.shadow_ruleset_id == ${rs2}"
            - "GET /fraudops/rule-sets/${rs1} shows ruleset_status == RETIRED"

      - name: loss_provision_estimate_vs_final_booked
        grounds:
          - calculations.loss_provision_estimate
          - entities.LossEntry.fields.provisional_amount_cents
          - entities.LossEntry.fields.final_amount_cents
        distinguishing_aspect: |
          Entity domain = LossEntry fiscal booking (distinct from AuthTransaction scoring and
          RuleSet metrics). Provisional variant = forward-looking estimate net of per-network
          recovery rates (11502); final variant = accountant-booked actual (11000): two valid
          numbers for the same two transactions.
        test_recipe:
          setup:
            - "Account with one VISA CREDIT card and one MASTERCARD DEBIT card; GLOBAL ruleset active"
            - "txn T1 VISA 10001 APPROVE (score 40); txn T2 MC 10001 APPROVE; both manually alerted and resolved FRAUD (dispositions CONFIRMED_FRAUD)"
            - "Contacts on the same account are separated by >= 60 minutes via the logical clock"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: FraudOpsManager }
            - { call: "POST /fraudops/accounts", payload: { account_number: "ACCT-LP1", cardholder_name: "Lo Pro", home_country: "US" }, as: FraudOpsManager, captures: { acct: "$.data.id" } }
            - { call: "POST /fraudops/cards", payload: { account_id: "${acct}", pan_token: "PT-LP1", product_type: "CREDIT", network: "VISA" }, as: FraudOpsManager, captures: { card_v: "$.data.id" } }
            - { call: "POST /fraudops/cards", payload: { account_id: "${acct}", pan_token: "PT-LP2", product_type: "DEBIT", network: "MASTERCARD" }, as: FraudOpsManager, captures: { card_m: "$.data.id" } }
            - { call: "POST /fraudops/rule-sets", payload: { scope: "GLOBAL", base_score: 10, review_threshold: 60, decline_threshold: 100, amount_tiers: [{min_amount_cents: 0, points: 5}, {min_amount_cents: 25000, points: 20}, {min_amount_cents: 100000, points: 45}], channel_weights: {CHIP: 0, CONTACTLESS: 5, CNP: 25, ATM: 30}, cross_border_weight: 20, high_risk_multiplier: 2, watch_weight: 15, compromised_weight: 50, high_risk_countries: ["RU"] }, as: FraudAnalyst, as_user_id: "analyst-1", captures: { rs: "$.data.id" } }
            - { call: "POST /fraudops/rule-sets/${rs}/activate", as: FraudOpsManager, as_user_id: "mgr-1" }
            - { call: "POST /fraudops/auth-transactions", payload: { card_id: "${card_v}", amount_cents: 10001, merchant_id: "M-LP", merchant_category_code: "5411", channel: "CNP", origin_country: "US" }, as: NetworkGateway, captures: { t1: "$.data.id" } }
            - { call: "POST /fraudops/auth-transactions", payload: { card_id: "${card_m}", amount_cents: 10001, merchant_id: "M-LP", merchant_category_code: "5411", channel: "CNP", origin_country: "US" }, as: NetworkGateway, captures: { t2: "$.data.id" } }
            - { call: "POST /fraudops/fraud-alerts", payload: { account_id: "${acct}", card_id: "${card_v}", auth_transaction_id: "${t1}" }, as: FraudAnalyst, captures: { a1: "$.data.id" } }
            - { call: "POST /fraudops/fraud-alerts/${a1}/claim", as: FraudAnalyst, as_user_id: "analyst-1" }
            - { call: "POST /fraudops/verification-contacts", payload: { alert_id: "${a1}", channel: "VOICE" }, as: FraudAnalyst, as_user_id: "analyst-1", captures: { c1: "$.data.id" } }
            - { call: "POST /fraudops/verification-contacts/${c1}/complete", payload: { outcome: "CONFIRMED_FRAUD" }, as: FraudAnalyst, as_user_id: "analyst-1" }
            - { call: "POST /fraudops/fraud-alerts/${a1}/resolve", payload: { resolution: "FRAUD" }, as: FraudAnalyst, as_user_id: "analyst-1" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T01:01:00Z" }, as: FraudOpsManager }
            - { call: "POST /fraudops/fraud-alerts", payload: { account_id: "${acct}", card_id: "${card_m}", auth_transaction_id: "${t2}" }, as: FraudAnalyst, captures: { a2: "$.data.id" } }
            - { call: "POST /fraudops/fraud-alerts/${a2}/claim", as: FraudAnalyst, as_user_id: "analyst-1" }
            - { call: "POST /fraudops/verification-contacts", payload: { alert_id: "${a2}", channel: "SMS" }, as: FraudAnalyst, as_user_id: "analyst-1", captures: { c2: "$.data.id" } }
            - { call: "POST /fraudops/verification-contacts/${c2}/complete", payload: { outcome: "CONFIRMED_FRAUD" }, as: FraudAnalyst, as_user_id: "analyst-1" }
            - { call: "POST /fraudops/fraud-alerts/${a2}/resolve", payload: { resolution: "FRAUD" }, as: FraudAnalyst, as_user_id: "analyst-1" }
          trigger:
            - { call: "POST /fraudops/loss-entries", payload: { account_id: "${acct}", transaction_ids: ["${t1}", "${t2}"] }, as: LossAccountant, captures: { loss: "$.data.id", prov: "$.data.provisional_amount_cents", tol: "$.data.tolerance_cents" } }
            - { call: "POST /fraudops/loss-entries/${loss}/book", as: LossAccountant, as_user_id: "acct-1" }
            - { call: "POST /fraudops/loss-entries/${loss}/finalize", payload: { final_amount_cents: 11000 }, as: LossAccountant, as_user_id: "acct-1" }
          assert:
            - "LossEntry.${loss}.provisional_amount_cents == 11502  (round(10001*0.55)=5501 + round(10001*0.60)=6001)"
            - "LossEntry.${loss}.tolerance_cents == 1150  (round_half_up(11502*0.10))"
            - "LossEntry.${loss}.final_amount_cents == 11000"
            - "LossEntry.${loss}.loss_status == FINALIZED"
            - "provisional (11502) != final (11000): estimate net of recovery vs booked actual for identical transactions"

      - name: fp_rate_review_vs_decline_basis
        grounds:
          - calculations.false_positive_monitor
          - entities.AuthTransaction.fields.final_disposition
        distinguishing_aspect: |
          Entity domain = RuleSet trade-off metrics (distinct from AuthTransaction scoring and
          LossEntry booking). Same scored population, two valid false-positive rates: review-basis
          (1 legit of 2 disposed REVIEW = 5000 bp) vs decline-basis (1 legit of 1 disposed
          DECLINE = 10000 bp) — the denominators diverge by decision filter.
        test_recipe:
          setup:
            - "GLOBAL ruleset RS active (decline 100, review 60)"
            - "Two REVIEW transactions R1,R2 (99999 CNP MX -> score 75); one DECLINE transaction D1 (100000 CNP RU -> score 120)"
            - "R1's auto alert resolved LEGIT; R2's auto alert resolved FRAUD; D1 gets a MANUAL alert resolved LEGIT"
            - "Contacts separated by >= 60 minutes on the single account"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: FraudOpsManager }
            - { call: "POST /fraudops/accounts", payload: { account_number: "ACCT-FP1", cardholder_name: "Eff Pee", home_country: "US" }, as: FraudOpsManager, captures: { acct: "$.data.id" } }
            - { call: "POST /fraudops/cards", payload: { account_id: "${acct}", pan_token: "PT-FP1", product_type: "CREDIT", network: "VISA" }, as: FraudOpsManager, captures: { card: "$.data.id" } }
            - { call: "POST /fraudops/rule-sets", payload: { scope: "GLOBAL", base_score: 10, review_threshold: 60, decline_threshold: 100, amount_tiers: [{min_amount_cents: 0, points: 5}, {min_amount_cents: 25000, points: 20}, {min_amount_cents: 100000, points: 45}], channel_weights: {CHIP: 0, CONTACTLESS: 5, CNP: 25, ATM: 30}, cross_border_weight: 20, high_risk_multiplier: 2, watch_weight: 15, compromised_weight: 50, high_risk_countries: ["RU"] }, as: FraudAnalyst, as_user_id: "analyst-1", captures: { rs: "$.data.id" } }
            - { call: "POST /fraudops/rule-sets/${rs}/activate", as: FraudOpsManager, as_user_id: "mgr-1" }
            - { call: "POST /fraudops/auth-transactions", payload: { card_id: "${card}", amount_cents: 99999, merchant_id: "M-FP", merchant_category_code: "5411", channel: "CNP", origin_country: "MX" }, as: NetworkGateway, captures: { r1: "$.data.id" } }
            - { call: "POST /fraudops/auth-transactions", payload: { card_id: "${card}", amount_cents: 99999, merchant_id: "M-FP", merchant_category_code: "5411", channel: "CNP", origin_country: "MX" }, as: NetworkGateway, captures: { r2: "$.data.id" } }
            - { call: "POST /fraudops/auth-transactions", payload: { card_id: "${card}", amount_cents: 100000, merchant_id: "M-FP", merchant_category_code: "5411", channel: "CNP", origin_country: "RU" }, as: NetworkGateway, captures: { d1: "$.data.id" } }
            - { call: "GET /fraudops/fraud-alerts?auth_transaction_id=${r1}", as: FraudOpsManager, captures: { a1: "$.data[0].id" } }
            - { call: "GET /fraudops/fraud-alerts?auth_transaction_id=${r2}", as: FraudOpsManager, captures: { a2: "$.data[0].id" } }
            - { call: "POST /fraudops/fraud-alerts/${a1}/claim", as: FraudAnalyst, as_user_id: "analyst-1" }
            - { call: "POST /fraudops/verification-contacts", payload: { alert_id: "${a1}", channel: "VOICE" }, as: FraudAnalyst, as_user_id: "analyst-1", captures: { c1: "$.data.id" } }
            - { call: "POST /fraudops/verification-contacts/${c1}/complete", payload: { outcome: "CONFIRMED_LEGIT" }, as: FraudAnalyst, as_user_id: "analyst-1" }
            - { call: "POST /fraudops/fraud-alerts/${a1}/resolve", payload: { resolution: "LEGIT" }, as: FraudAnalyst, as_user_id: "analyst-1" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T01:01:00Z" }, as: FraudOpsManager }
            - { call: "POST /fraudops/fraud-alerts/${a2}/claim", as: FraudAnalyst, as_user_id: "analyst-1" }
            - { call: "POST /fraudops/verification-contacts", payload: { alert_id: "${a2}", channel: "SMS" }, as: FraudAnalyst, as_user_id: "analyst-1", captures: { c2: "$.data.id" } }
            - { call: "POST /fraudops/verification-contacts/${c2}/complete", payload: { outcome: "CONFIRMED_FRAUD" }, as: FraudAnalyst, as_user_id: "analyst-1" }
            - { call: "POST /fraudops/fraud-alerts/${a2}/resolve", payload: { resolution: "FRAUD" }, as: FraudAnalyst, as_user_id: "analyst-1" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T02:02:00Z" }, as: FraudOpsManager }
            - { call: "POST /fraudops/fraud-alerts", payload: { account_id: "${acct}", card_id: "${card}", auth_transaction_id: "${d1}" }, as: FraudAnalyst, captures: { a3: "$.data.id" } }
            - { call: "POST /fraudops/fraud-alerts/${a3}/claim", as: FraudAnalyst, as_user_id: "analyst-1" }
            - { call: "POST /fraudops/verification-contacts", payload: { alert_id: "${a3}", channel: "EMAIL" }, as: FraudAnalyst, as_user_id: "analyst-1", captures: { c3: "$.data.id" } }
            - { call: "POST /fraudops/verification-contacts/${c3}/complete", payload: { outcome: "CONFIRMED_LEGIT" }, as: FraudAnalyst, as_user_id: "analyst-1" }
            - { call: "POST /fraudops/fraud-alerts/${a3}/resolve", payload: { resolution: "LEGIT" }, as: FraudAnalyst, as_user_id: "analyst-1" }
          trigger:
            - { call: "GET /fraudops/rule-sets/${rs}/metrics", as: FraudOpsManager }
          assert:
            - "metrics.review_count == 2 and metrics.declined_count == 1"
            - "metrics.fp_rate_review_basis_bp == 5000  (1 legit / 2 disposed REVIEW)"
            - "metrics.fp_rate_decline_basis_bp == 10000  (1 legit / 1 disposed DECLINE)"
            - "metrics.fp_rate_review_basis_bp != metrics.fp_rate_decline_basis_bp — same population, different basis denominators"

  - rule_id: combinatorial_formula
    instances:
      - name: scoring_multifactor_nonlinear
        grounds:
          - calculations.authorization_scoring
          - entities.RuleSet.fields.amount_tiers
          - entities.RuleSet.fields.high_risk_multiplier
        distinguishing_aspect: |
          Mode (a): >= 3 inputs with non-linear interaction — amount tier step (99999 vs 100000
          flips 20->45 points), channel weight, cross-border conditional branch (domestic 0 /
          MX +20 / RU +40 via high_risk_multiplier), all combined in one nested sum; five
          hand-computed scores pin the formula exactly.
        test_recipe:
          setup:
            - "Account/card (VISA CREDIT, home US); GLOBAL ruleset RS-STD active (decline 100, review 60)"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: FraudOpsManager }
            - { call: "POST /fraudops/accounts", payload: { account_number: "ACCT-CF1", cardholder_name: "Cee Eff", home_country: "US" }, as: FraudOpsManager, captures: { acct: "$.data.id" } }
            - { call: "POST /fraudops/cards", payload: { account_id: "${acct}", pan_token: "PT-CF1", product_type: "CREDIT", network: "VISA" }, as: FraudOpsManager, captures: { card: "$.data.id" } }
            - { call: "POST /fraudops/rule-sets", payload: { scope: "GLOBAL", base_score: 10, review_threshold: 60, decline_threshold: 100, amount_tiers: [{min_amount_cents: 0, points: 5}, {min_amount_cents: 25000, points: 20}, {min_amount_cents: 100000, points: 45}], channel_weights: {CHIP: 0, CONTACTLESS: 5, CNP: 25, ATM: 30}, cross_border_weight: 20, high_risk_multiplier: 2, watch_weight: 15, compromised_weight: 50, high_risk_countries: ["RU"] }, as: FraudAnalyst, as_user_id: "analyst-1", captures: { rs: "$.data.id" } }
            - { call: "POST /fraudops/rule-sets/${rs}/activate", as: FraudOpsManager, as_user_id: "mgr-1" }
          trigger:
            - { call: "POST /fraudops/auth-transactions", payload: { card_id: "${card}", amount_cents: 99999, merchant_id: "M-CF", merchant_category_code: "5411", channel: "CNP", origin_country: "MX" }, as: NetworkGateway, captures: { t1: "$.data.id", t1_score: "$.data.auth_score", t1_dec: "$.data.decision" } }
            - { call: "POST /fraudops/auth-transactions", payload: { card_id: "${card}", amount_cents: 100000, merchant_id: "M-CF", merchant_category_code: "5411", channel: "CNP", origin_country: "MX" }, as: NetworkGateway, captures: { t2: "$.data.id" } }
            - { call: "POST /fraudops/auth-transactions", payload: { card_id: "${card}", amount_cents: 100000, merchant_id: "M-CF", merchant_category_code: "5411", channel: "CNP", origin_country: "RU" }, as: NetworkGateway, captures: { t3: "$.data.id" } }
            - { call: "POST /fraudops/auth-transactions", payload: { card_id: "${card}", amount_cents: 1000, merchant_id: "M-CF", merchant_category_code: "5411", channel: "CNP", origin_country: "MX" }, as: NetworkGateway, captures: { t4: "$.data.id" } }
            - { call: "POST /fraudops/auth-transactions", payload: { card_id: "${card}", amount_cents: 1000, merchant_id: "M-CF", merchant_category_code: "5411", channel: "CNP", origin_country: "US" }, as: NetworkGateway, captures: { t5: "$.data.id" } }
          assert:
            - "AuthTransaction.${t1}.auth_score == 75 and decision == REVIEW   (10+20+25+20; amount 99999 stays in the 20-point tier)"
            - "AuthTransaction.${t2}.auth_score == 100 and decision == DECLINE (10+45+25+20; amount 100000 enters the 45-point tier)"
            - "AuthTransaction.${t3}.auth_score == 120 and decision == DECLINE (10+45+25+40; RU doubles cross-border 20->40)"
            - "AuthTransaction.${t4}.auth_score == 60 and decision == REVIEW   (10+5+25+20; exactly the review threshold)"
            - "AuthTransaction.${t5}.auth_score == 40 and decision == APPROVE  (10+5+25+0; domestic)"
      - name: loss_provision_line_rounding_order
        grounds:
          - calculations.loss_provision_estimate
        distinguishing_aspect: |
          Mode (b): nested rounding where order matters — per-line round_half_up then sum gives
          23002 (11001 + 12001); sum-then-round would give 23001. The scaffold pins
          per-line-then-sum, and the assertion fails under the alternative order.
        test_recipe:
          setup:
            - "Account with VISA and MASTERCARD cards; GLOBAL ruleset active"
            - "txn U1 VISA 20001 APPROVE (score 40) and txn U2 MC 20001 APPROVE; both confirmed FRAUD via manual alerts (contacts 60+ minutes apart)"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: FraudOpsManager }
            - { call: "POST /fraudops/accounts", payload: { account_number: "ACCT-CF2", cardholder_name: "Round Order", home_country: "US" }, as: FraudOpsManager, captures: { acct: "$.data.id" } }
            - { call: "POST /fraudops/cards", payload: { account_id: "${acct}", pan_token: "PT-CF2V", product_type: "CREDIT", network: "VISA" }, as: FraudOpsManager, captures: { card_v: "$.data.id" } }
            - { call: "POST /fraudops/cards", payload: { account_id: "${acct}", pan_token: "PT-CF2M", product_type: "DEBIT", network: "MASTERCARD" }, as: FraudOpsManager, captures: { card_m: "$.data.id" } }
            - { call: "POST /fraudops/rule-sets", payload: { scope: "GLOBAL", base_score: 10, review_threshold: 60, decline_threshold: 100, amount_tiers: [{min_amount_cents: 0, points: 5}, {min_amount_cents: 25000, points: 20}, {min_amount_cents: 100000, points: 45}], channel_weights: {CHIP: 0, CONTACTLESS: 5, CNP: 25, ATM: 30}, cross_border_weight: 20, high_risk_multiplier: 2, watch_weight: 15, compromised_weight: 50, high_risk_countries: ["RU"] }, as: FraudAnalyst, as_user_id: "analyst-1", captures: { rs: "$.data.id" } }
            - { call: "POST /fraudops/rule-sets/${rs}/activate", as: FraudOpsManager, as_user_id: "mgr-1" }
            - { call: "POST /fraudops/auth-transactions", payload: { card_id: "${card_v}", amount_cents: 20001, merchant_id: "M-RO", merchant_category_code: "5411", channel: "CNP", origin_country: "US" }, as: NetworkGateway, captures: { u1: "$.data.id" } }
            - { call: "POST /fraudops/auth-transactions", payload: { card_id: "${card_m}", amount_cents: 20001, merchant_id: "M-RO", merchant_category_code: "5411", channel: "CNP", origin_country: "US" }, as: NetworkGateway, captures: { u2: "$.data.id" } }
            - { call: "POST /fraudops/fraud-alerts", payload: { account_id: "${acct}", card_id: "${card_v}", auth_transaction_id: "${u1}" }, as: FraudAnalyst, captures: { a1: "$.data.id" } }
            - { call: "POST /fraudops/fraud-alerts/${a1}/claim", as: FraudAnalyst, as_user_id: "analyst-1" }
            - { call: "POST /fraudops/verification-contacts", payload: { alert_id: "${a1}", channel: "VOICE" }, as: FraudAnalyst, as_user_id: "analyst-1", captures: { c1: "$.data.id" } }
            - { call: "POST /fraudops/verification-contacts/${c1}/complete", payload: { outcome: "CONFIRMED_FRAUD" }, as: FraudAnalyst, as_user_id: "analyst-1" }
            - { call: "POST /fraudops/fraud-alerts/${a1}/resolve", payload: { resolution: "FRAUD" }, as: FraudAnalyst, as_user_id: "analyst-1" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T01:01:00Z" }, as: FraudOpsManager }
            - { call: "POST /fraudops/fraud-alerts", payload: { account_id: "${acct}", card_id: "${card_m}", auth_transaction_id: "${u2}" }, as: FraudAnalyst, captures: { a2: "$.data.id" } }
            - { call: "POST /fraudops/fraud-alerts/${a2}/claim", as: FraudAnalyst, as_user_id: "analyst-1" }
            - { call: "POST /fraudops/verification-contacts", payload: { alert_id: "${a2}", channel: "SMS" }, as: FraudAnalyst, as_user_id: "analyst-1", captures: { c2: "$.data.id" } }
            - { call: "POST /fraudops/verification-contacts/${c2}/complete", payload: { outcome: "CONFIRMED_FRAUD" }, as: FraudAnalyst, as_user_id: "analyst-1" }
            - { call: "POST /fraudops/fraud-alerts/${a2}/resolve", payload: { resolution: "FRAUD" }, as: FraudAnalyst, as_user_id: "analyst-1" }
          trigger:
            - { call: "POST /fraudops/loss-entries", payload: { account_id: "${acct}", transaction_ids: ["${u1}", "${u2}"] }, as: LossAccountant, captures: { loss: "$.data.id" } }
          assert:
            - "LossEntry.${loss}.provisional_amount_cents == 23002  (round(20001*0.55)=11001 + round(20001*0.60)=12001)"
            - "LossEntry.${loss}.provisional_amount_cents != 23001  (sum-then-round would give round(11000.55+12000.60)=23001)"
            - "LossEntry.${loss}.tolerance_cents == 2300  (round_half_up(23002*0.10) = round(2300.2))"
      - name: alert_priority_tier_eval_order
        grounds:
          - calculations.alert_priority
          - calculations.account_risk_tier
          - entities.FraudAlert.fields.priority
          - entities.FraudAlert.fields.band_points
        distinguishing_aspect: |
          Mode (c): circular-looking dependency — alert priority depends on account risk_tier,
          which depends on open alert count, which includes the alert being created. The pinned
          evaluation order (tier computed EXCLUDING the new alert; priority frozen at creation)
          makes M1.priority = 25 (LOW + band 25) and M2.priority = 125 (MEDIUM + 25) even though
          the account lands in HIGH afterwards; the wrong order yields 225 for M2.
        test_recipe:
          setup:
            - "Fresh account (no alerts); no ruleset needed — MANUAL alerts only"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: FraudOpsManager }
            - { call: "POST /fraudops/accounts", payload: { account_number: "ACCT-CF3", cardholder_name: "Prio Order", home_country: "US" }, as: FraudOpsManager, captures: { acct: "$.data.id" } }
            - { call: "POST /fraudops/cards", payload: { account_id: "${acct}", pan_token: "PT-CF3", product_type: "DEBIT", network: "MASTERCARD" }, as: FraudOpsManager, captures: { card: "$.data.id" } }
          trigger:
            - { call: "POST /fraudops/fraud-alerts", payload: { account_id: "${acct}", card_id: "${card}" }, as: FraudAnalyst, captures: { m1: "$.data.id", m1_prio: "$.data.priority" } }
            - { call: "POST /fraudops/fraud-alerts", payload: { account_id: "${acct}", card_id: "${card}" }, as: FraudAnalyst, captures: { m2: "$.data.id", m2_prio: "$.data.priority" } }
            - { call: "GET /fraudops/accounts/${acct}", as: FraudOpsManager }
          assert:
            - "FraudAlert.${m1}.priority == 25   (tier LOW=0 points + manual band 25; 0 open alerts at creation)"
            - "FraudAlert.${m2}.priority == 125  (tier MEDIUM=100 + 25; exactly 1 OTHER open alert at M2's creation — M2 excluded itself)"
            - "FraudAlert.${m1}.priority still == 25 after M2's creation (frozen; alert creation never recomputes older alerts)"
            - "Account.${acct}.risk_tier == HIGH (2 open alerts >= 2) while M2.priority remains 125, proving the snapshot order"

  - rule_id: non_linear_state_machine
    instances:
      - name: card_block_unblock_cycle_with_parallel_flag
        grounds:
          - state_machines.Card.ACTIVE_to_SOFT_BLOCKED
          - state_machines.Card.SOFT_BLOCKED_to_ACTIVE
          - state_machines.Card.CLEAN_to_COMPROMISED
          - entities.Card.fields.fraud_flag
        distinguishing_aspect: |
          Entity = Card. Non-linear on TWO axes of the same row: card_status cycles
          ACTIVE->SOFT_BLOCKED->ACTIVE->SOFT_BLOCKED while the parallel fraud_flag dimension
          independently moves CLEAN->COMPROMISED via a compromise event — the flag flip must not
          disturb card_status, proving the dimensions are independent.
        test_recipe:
          setup:
            - "Account/card; GLOBAL ruleset active; one APPROVE transaction (40000 CNP US -> 55) at merchant M-C1 inside the compromise window [08-01, 08-03)"
            - "Card has already completed one full block/unblock cycle and is SOFT_BLOCKED a second time when the event confirms"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: FraudOpsManager }
            - { call: "POST /fraudops/accounts", payload: { account_number: "ACCT-NL1", cardholder_name: "En Ell", home_country: "US" }, as: FraudOpsManager, captures: { acct: "$.data.id" } }
            - { call: "POST /fraudops/cards", payload: { account_id: "${acct}", pan_token: "PT-NL1", product_type: "CREDIT", network: "VISA" }, as: FraudOpsManager, captures: { card: "$.data.id" } }
            - { call: "POST /fraudops/rule-sets", payload: { scope: "GLOBAL", base_score: 10, review_threshold: 60, decline_threshold: 100, amount_tiers: [{min_amount_cents: 0, points: 5}, {min_amount_cents: 25000, points: 20}, {min_amount_cents: 100000, points: 45}], channel_weights: {CHIP: 0, CONTACTLESS: 5, CNP: 25, ATM: 30}, cross_border_weight: 20, high_risk_multiplier: 2, watch_weight: 15, compromised_weight: 50, high_risk_countries: ["RU"] }, as: FraudAnalyst, as_user_id: "analyst-1", captures: { rs: "$.data.id" } }
            - { call: "POST /fraudops/rule-sets/${rs}/activate", as: FraudOpsManager, as_user_id: "mgr-1" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T00:00:00Z" }, as: FraudOpsManager }
            - { call: "POST /fraudops/auth-transactions", payload: { card_id: "${card}", amount_cents: 40000, merchant_id: "M-C1", merchant_category_code: "5411", channel: "CNP", origin_country: "US" }, as: NetworkGateway }
            - { call: "POST /fraudops/cards/${card}/block", payload: { block_type: "SOFT", reason: "ANALYST_REVIEW" }, as: FraudAnalyst }
            - { call: "POST /fraudops/cards/${card}/unblock", as: FraudAnalyst }
            - { call: "POST /fraudops/cards/${card}/block", payload: { block_type: "SOFT", reason: "CUSTOMER_REQUEST" }, as: FraudAnalyst }
            - { call: "POST /fraudops/compromised-card-events", payload: { network_source: "CAMS", event_reference: "CAMS-NL1", merchant_id: "M-C1", window_start: "2026-08-01T00:00:00Z", window_end: "2026-08-03T00:00:00Z" }, as: FraudOpsManager, captures: { ev: "$.data.id" } }
            - { call: "POST /fraudops/compromised-card-events/${ev}/confirm", as: FraudOpsManager }
          trigger:
            - { call: "GET /fraudops/cards/${card}", as: FraudOpsManager }
          assert:
            - "Card.${card}.card_status == SOFT_BLOCKED (the second block of the cycle held; confirm did not move card_status)"
            - "Card.${card}.fraud_flag == COMPROMISED (parallel dimension moved independently)"
            - "Card.${card}.block_reason == CUSTOMER_REQUEST (second cycle's reason, not overwritten by the flag cascade)"
      - name: alert_reopen_loop_with_counter
        grounds:
          - state_machines.FraudAlert.RESOLVED_FRAUD_to_IN_REVIEW
          - state_machines.FraudAlert.RESOLVED_LEGIT_to_IN_REVIEW
          - entities.FraudAlert.fields.reopen_count
        distinguishing_aspect: |
          Entity = FraudAlert (distinct from Card). Cyclic revision loop IN_REVIEW->RESOLVED_*->
          IN_REVIEW with a loop counter: two reopens succeed, the disposition of the linked
          transaction flips LEGIT->FRAUD across cycles (latest resolution wins), and the third
          reopen hits ERR_REOPEN_LIMIT_EXCEEDED.
        test_recipe:
          setup:
            - "Account/card; GLOBAL ruleset active; one APPROVE transaction (1000 CNP US -> 40) referenced by a manual alert"
            - "Contacts separated by >= 60 minutes (gap rule) at 00:00 / 01:01 / 02:02"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: FraudOpsManager }
            - { call: "POST /fraudops/accounts", payload: { account_number: "ACCT-NL2", cardholder_name: "Re Open", home_country: "US" }, as: FraudOpsManager, captures: { acct: "$.data.id" } }
            - { call: "POST /fraudops/cards", payload: { account_id: "${acct}", pan_token: "PT-NL2", product_type: "CREDIT", network: "VISA" }, as: FraudOpsManager, captures: { card: "$.data.id" } }
            - { call: "POST /fraudops/rule-sets", payload: { scope: "GLOBAL", base_score: 10, review_threshold: 60, decline_threshold: 100, amount_tiers: [{min_amount_cents: 0, points: 5}, {min_amount_cents: 25000, points: 20}, {min_amount_cents: 100000, points: 45}], channel_weights: {CHIP: 0, CONTACTLESS: 5, CNP: 25, ATM: 30}, cross_border_weight: 20, high_risk_multiplier: 2, watch_weight: 15, compromised_weight: 50, high_risk_countries: ["RU"] }, as: FraudAnalyst, as_user_id: "analyst-1", captures: { rs: "$.data.id" } }
            - { call: "POST /fraudops/rule-sets/${rs}/activate", as: FraudOpsManager, as_user_id: "mgr-1" }
            - { call: "POST /fraudops/auth-transactions", payload: { card_id: "${card}", amount_cents: 1000, merchant_id: "M-NL2", merchant_category_code: "5411", channel: "CNP", origin_country: "US" }, as: NetworkGateway, captures: { t: "$.data.id" } }
            - { call: "POST /fraudops/fraud-alerts", payload: { account_id: "${acct}", card_id: "${card}", auth_transaction_id: "${t}" }, as: FraudAnalyst, captures: { al: "$.data.id" } }
            - { call: "POST /fraudops/fraud-alerts/${al}/claim", as: FraudAnalyst, as_user_id: "analyst-1" }
            - { call: "POST /fraudops/verification-contacts", payload: { alert_id: "${al}", channel: "VOICE" }, as: FraudAnalyst, as_user_id: "analyst-1", captures: { c1: "$.data.id" } }
            - { call: "POST /fraudops/verification-contacts/${c1}/complete", payload: { outcome: "CONFIRMED_LEGIT" }, as: FraudAnalyst, as_user_id: "analyst-1" }
            - { call: "POST /fraudops/fraud-alerts/${al}/resolve", payload: { resolution: "LEGIT" }, as: FraudAnalyst, as_user_id: "analyst-1" }
            - { call: "POST /fraudops/fraud-alerts/${al}/reopen", payload: { reason: "cardholder called back" }, as: FraudAnalyst }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T01:01:00Z" }, as: FraudOpsManager }
            - { call: "POST /fraudops/verification-contacts", payload: { alert_id: "${al}", channel: "VOICE" }, as: FraudAnalyst, as_user_id: "analyst-1", captures: { c2: "$.data.id" } }
            - { call: "POST /fraudops/verification-contacts/${c2}/complete", payload: { outcome: "CONFIRMED_FRAUD" }, as: FraudAnalyst, as_user_id: "analyst-1" }
            - { call: "POST /fraudops/fraud-alerts/${al}/resolve", payload: { resolution: "FRAUD" }, as: FraudAnalyst, as_user_id: "analyst-1" }
            - { call: "POST /fraudops/fraud-alerts/${al}/reopen", payload: { reason: "second review" }, as: FraudAnalyst }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T02:02:00Z" }, as: FraudOpsManager }
            - { call: "POST /fraudops/verification-contacts", payload: { alert_id: "${al}", channel: "SMS" }, as: FraudAnalyst, as_user_id: "analyst-1", captures: { c3: "$.data.id" } }
            - { call: "POST /fraudops/verification-contacts/${c3}/complete", payload: { outcome: "CONFIRMED_FRAUD" }, as: FraudAnalyst, as_user_id: "analyst-1" }
            - { call: "POST /fraudops/fraud-alerts/${al}/resolve", payload: { resolution: "FRAUD" }, as: FraudAnalyst, as_user_id: "analyst-1" }
          trigger:
            - { call: "POST /fraudops/fraud-alerts/${al}/reopen", payload: { reason: "third attempt" }, as: FraudAnalyst, captures: { err: "$.data.error_id" } }
            - { call: "GET /fraudops/fraud-alerts/${al}", as: FraudOpsManager }
            - { call: "GET /fraudops/auth-transactions/${t}", as: FraudOpsManager }
          assert:
            - "third reopen rejected: error == ERR_REOPEN_LIMIT_EXCEEDED (reopen_count == 2)"
            - "FraudAlert.${al}.alert_status == RESOLVED_FRAUD and reopen_count == 2"
            - "AuthTransaction.${t}.final_disposition == CONFIRMED_FRAUD (flipped from CONFIRMED_LEGIT by the second cycle — latest resolution wins)"
      - name: chargeback_fork_won_vs_lost_side_effects
        grounds:
          - state_machines.ChargebackCase.REPRESENTMENT_FILED_to_RESOLVED_WON
