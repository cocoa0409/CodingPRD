  - section: endpoints
    instances:
      - name: corner_standard_crud_surface_is_create_and_read_only
        claim_type: standard_crud
        grounds:
          - entities.InvestorOverlay
          - endpoints.POST /investor-overlays
          - endpoints.GET /investor-overlays/{id}
          - endpoints.GET /exception-requests
        distinguishing_aspect: "The catalog entities are create-and-read-only: POST /investor-overlays echoes every declared field including the waivable_flag default, GET /investor-overlays/{id} returns it unchanged, and there is no update or delete verb anywhere in the surface, so the only list channels are the filtered collection endpoints such as GET /exception-requests."
        test_recipe:
          setup:
            - "Two overlays for the same investor, one relying on the waivable_flag default and one setting it explicitly."
          setup_api_calls:
            - call: "POST /investor-overlays"
              as: ProgramAdmin
              as_user_id: "pa-1"
              payload: { investor_code: "INV-ALPHA", overlay_code: "OV-FICO-680", rule_metric: "MIN_FICO", comparator: "GTE", threshold_value: 680.00, required_authority_tier: 1, severity: "MINOR" }
              captures: { ov_a_id: "$.data.id" }
            - call: "POST /investor-overlays"
              as: ProgramAdmin
              as_user_id: "pa-1"
              payload: { investor_code: "INV-ALPHA", overlay_code: "OV-LTV-70", applies_to_program_code: "DSCR", rule_metric: "MAX_LTV_PCT", comparator: "LTE", threshold_value: 70.00, waivable_flag: false, required_authority_tier: 2, severity: "MATERIAL" }
              captures: { ov_b_id: "$.data.id" }
          trigger:
            - call: "GET /investor-overlays/${ov_a_id}"
              as: Underwriter
              as_user_id: "uw-1"
            - call: "GET /investor-overlays/${ov_b_id}"
              as: SecuritizationAnalyst
              as_user_id: "sa-1"
          assert:
            - "First trigger call: HTTP status == 200, id == ${ov_a_id}, investor_code == INV-ALPHA, overlay_code == OV-FICO-680, rule_metric == MIN_FICO, comparator == GTE, threshold_value == 680.00, required_authority_tier == 1, severity == MINOR"
            - "First trigger call: waivable_flag == true (declared default applied) and applies_to_program_code == null (program-agnostic overlay)"
            - "Second trigger call: HTTP status == 200, applies_to_program_code == DSCR, waivable_flag == false, required_authority_tier == 2, severity == MATERIAL and threshold_value == 70.00"
            - "Both reads are role-shared: the Underwriter and the SecuritizationAnalyst see identical bodies for the same overlay id"
            - "No PATCH, PUT or DELETE verb exists for any entity in this API, so create-plus-read is the complete CRUD surface and every mutation after creation happens through a named action endpoint"

      - name: corner_override_escalation_action_is_single_use
        claim_type: action_endpoint
        grounds:
          - state_machines.AppraisalReview
          - endpoints.POST /appraisal-reviews/{id}/override-escalation
          - validations[priority=43]
          - errors.ERR_REVIEW_STATE_INVALID
        distinguishing_aspect: "The override action is the only exit from PRIMARY_ESCALATED and it consumes its own precondition: the first call clears the review and records OVERRIDDEN_BY_REVIEWER while deliberately leaving reconciled_value_cents at the conservative lower value (so ltv_pct stays 85.71), and the second identical call is refused with ERR_REVIEW_STATE_INVALID rather than being treated as a no-op."
        test_recipe:
          setup:
            - "A DSCR loan whose loan amount forces a second valuation, with a primary appraisal of 80000000 and a second of 70000000 - a 14.29 percent variance that escalates the primary dimension."
          setup_api_calls:
            - call: "POST /documentation-programs"
              as: ProgramAdmin
              as_user_id: "pa-1"
              payload:
                program_code: "DSCR"
                name: "Investor DSCR Dual Value"
                min_dscr: 1.1000
                max_ltv_pct: 85.00
                min_fico: 660
                min_reserves_months: 6
                min_residual_income_cents: 0
                second_valuation_ltv_threshold_pct: 90.00
                second_valuation_loan_amount_threshold_cents: 50000000
                atr_exempt_flag: true
                seasoning_matrix: { FORECLOSURE: 36, SHORT_SALE: 24, DEED_IN_LIEU: 24, BK_CH7: 24, BK_CH13: 12, MODIFICATION: 12, MORTGAGE_LATE_60: 12 }
              captures: { prog_dscr_id: "$.data.id" }
            - call: "POST /borrowers"
              as: LoanOfficer
              as_user_id: "lo-1"
              payload: { legal_name: "Oona Override", fico_score: 700, monthly_debt_obligations_cents: 0, verified_liquid_assets_cents: 5000000, age_years: 50 }
              captures: { borr_id: "$.data.id" }
            - call: "POST /loan-files"
              as: LoanOfficer
              as_user_id: "lo-1"
              payload:
                borrower_id: "${borr_id}"
                program_id: "${prog_dscr_id}"
                investor_code: "INV-ALPHA"
                loan_amount_cents: 60000000
                purchase_price_cents: 80000000
                property_value_cents: 80000000
                occupancy: "INVESTMENT"
                purpose: "PURCHASE"
                lien_position: "FIRST"
                note_rate_pct: 8.750
                apor_pct: 6.100
                term_months: 360
                amortization_type: "INTEREST_ONLY"
                monthly_taxes_cents: 60000
                monthly_insurance_cents: 20000
                gross_market_rent_cents: 620000
                lease_rent_cents: 640000
              captures: { lf_id: "$.data.id" }
            - call: "POST /loan-files/${lf_id}/doc-type-selection"
              as: Underwriter
              as_user_id: "uw-1"
              payload: { doc_type: "DSCR" }
            - call: "POST /points-and-fees-items"
              as: LoanOfficer
              as_user_id: "lo-1"
              payload: { loan_file_id: "${lf_id}", fee_code: "F-ORIG", fee_category: "ORIGINATION_POINTS", amount_cents: 600000, prepaid_finance_charge_flag: true }
            - call: "POST /loan-files/${lf_id}/submit-to-underwriting"
              as: LoanOfficer
              as_user_id: "lo-1"
              payload: {}
            - call: "POST /valuation-orders"
              as: AppraisalReviewer
              as_user_id: "ar-1"
              payload: { loan_file_id: "${lf_id}", valuation_type: "PRIMARY_APPRAISAL", vendor_code: "VEND-A", effective_date: "2026-05-01T00:00:00Z" }
              captures: { vo_primary_id: "$.data.id" }
            - call: "POST /valuation-orders/${vo_primary_id}/receive"
              as: AppraisalReviewer
              as_user_id: "ar-1"
              payload: { appraised_value_cents: 80000000 }
            - call: "POST /valuation-orders/${vo_primary_id}/decision"
              as: AppraisalReviewer
              as_user_id: "ar-1"
              payload: { decision: "ACCEPTED" }
            - call: "POST /valuation-orders"
              as: AppraisalReviewer
              as_user_id: "ar-1"
              payload: { loan_file_id: "${lf_id}", valuation_type: "SECOND_APPRAISAL", vendor_code: "VEND-B", effective_date: "2026-05-15T00:00:00Z" }
              captures: { vo_second_id: "$.data.id" }
            - call: "POST /valuation-orders/${vo_second_id}/receive"
              as: AppraisalReviewer
              as_user_id: "ar-1"
              payload: { appraised_value_cents: 70000000 }
            - call: "POST /valuation-orders/${vo_second_id}/decision"
              as: AppraisalReviewer
              as_user_id: "ar-1"
              payload: { decision: "ACCEPTED" }
            - call: "GET /loan-files/${lf_id}/appraisal-reviews"
              as: AppraisalReviewer
              as_user_id: "ar-1"
              captures: { review_id: "$.data[0].id" }
          trigger:
            - call: "POST /appraisal-reviews/${review_id}/override-escalation"
              as: AppraisalReviewer
              as_user_id: "ar-1"
              payload: { override_justification: "Comparable set reviewed; conservative value accepted." }
            - call: "POST /appraisal-reviews/${review_id}/override-escalation"
              as: AppraisalReviewer
              as_user_id: "ar-1"
              payload: { override_justification: "Second attempt at the same override." }
              captures: { err_review: "$.data.error_id" }
          assert:
            - "Setup, the appraisal-reviews list: exactly 1 element with primary_value_cents == 80000000, second_value_cents == 70000000, variance_pct == 14.29 ((80000000 - 70000000) * 100 / 70000000, denominator is the lower value), primary_review_status == PRIMARY_ESCALATED, second_valuation_status == SECOND_RECONCILED, escalation_reason == VARIANCE_ABOVE_TOLERANCE and reconciled_value_cents == 70000000"
            - "First trigger call: HTTP status == 200, primary_review_status == PRIMARY_CLEARED and escalation_reason == OVERRIDDEN_BY_REVIEWER"
            - "First trigger call: reconciled_value_cents is still 70000000, and GET /loan-files/${lf_id} still reports ltv_pct == 85.71 - the override accepts the conservative value, it does not restore 80000000"
            - "First trigger call: second_valuation_status is still SECOND_RECONCILED, so the override touched only the primary dimension"
            - "Second trigger call: HTTP status == 409 and error_id == ERR_REVIEW_STATE_INVALID (the review is no longer PRIMARY_ESCALATED)"
            - "Second trigger call: primary_review_status, escalation_reason and reconciled_value_cents are byte-identical to the first call's result"

