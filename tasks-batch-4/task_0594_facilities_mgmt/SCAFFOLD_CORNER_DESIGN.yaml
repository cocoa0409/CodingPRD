        claim_type: Segregation of duties
        grounds:
          - "validations[priority=42]"
          - "errors[ERR_SEGREGATION_OF_DUTIES]"
          - entities.CapitalProject.fields.proposed_by_user_id
        distinguishing_aspect: "The proposer's X-User-ID is pinned on the project: fc-1 approving the project fc-1 proposed returns 403 ERR_SEGREGATION_OF_DUTIES, while fc-2 approving the same project succeeds."
        test_recipe:
          setup: ["A PROPOSED capital project created by FinanceController fc-1."]
          setup_api_calls:
            - call: "POST /fm/buildings"
              payload: { name: "Tower One", code: "BLD-1", gross_area_sqm: 1000 }
              as: FacilityManager
              captures: { b1: $.data.id }
            - call: "POST /fm/capital-projects"
              payload: { building_id: "${b1}", title: "Lobby refit", base_cost: 1000.00 }
              as: FinanceController
              as_user_id: "fc-1"
              captures: { p1: $.data.id }
          trigger:
            - call: "POST /fm/capital-projects/${p1}/approve"
              payload: { decision: "APPROVE" }
              as: FinanceController
              as_user_id: "fc-1"
              captures: { err_id: $.data.error_id }
            - call: "POST /fm/capital-projects/${p1}/approve"
              payload: { decision: "APPROVE" }
              as: FinanceController
              as_user_id: "fc-2"
          assert:
            - "the fc-1 call returns 403 with ${err_id} == ERR_SEGREGATION_OF_DUTIES and CapitalProject.${p1}.status stays PROPOSED"
            - "the fc-2 call returns 200, CapitalProject.${p1}.status == APPROVED and approved_by_user_id == fc-2"

      - name: approve_already_decided_project_rejected
        claim_type: Invalid Transitions
        grounds:
          - state_machines.CapitalProject.PROPOSED_to_REJECTED
          - "errors[ERR_PROJECT_NOT_PROPOSED]"
        distinguishing_aspect: "The PROPOSED fork is one-shot: after a REJECT decision the project is REJECTED (terminal) and a follow-up APPROVE returns 409 ERR_PROJECT_NOT_PROPOSED."
        test_recipe:
          setup: ["A capital project REJECTED by fc-2."]
          setup_api_calls:
            - call: "POST /fm/buildings"
              payload: { name: "Tower One", code: "BLD-1", gross_area_sqm: 1000 }
              as: FacilityManager
              captures: { b1: $.data.id }
            - call: "POST /fm/capital-projects"
              payload: { building_id: "${b1}", title: "Lobby refit", base_cost: 600000.00 }
              as: FinanceController
              as_user_id: "fc-1"
              captures: { p1: $.data.id }
            - call: "POST /fm/capital-projects/${p1}/approve"
              payload: { decision: "REJECT" }
              as: FinanceController
              as_user_id: "fc-2"
          trigger:
            - call: "POST /fm/capital-projects/${p1}/approve"
              payload: { decision: "APPROVE" }
              as: FinanceController
              as_user_id: "fc-3"
              captures: { err_id: $.data.error_id }
          assert:
            - "CapitalProject.${p1}.contingency_pct == 0.05 and budget_amount == 630000.00 (base_cost 600000.00 is in the top tier)"
            - "HTTP status is 409 and ${err_id} == ERR_PROJECT_NOT_PROPOSED"
            - "CapitalProject.${p1}.status == REJECTED and approved_by_user_id == fc-2"

  # ===========================================================================
  - section: cross_cutting_layers
    instances:
      - name: occ_stale_work_order_version_on_dispatch_create_rejected
        claim_type: optimistic_concurrency
        grounds:
          - "concurrency_rules[dispatch-create-stale-work-order]"
          - "errors[ERR_STALE_VERSION]"
        distinguishing_aspect: "The first dispatch bumps WorkOrder.version from 1 to 2; a second create still carrying expected_work_order_version 1 is rejected with 412 ERR_STALE_VERSION and does not cancel the existing OFFERED dispatch, while re-reading the version and retrying supersedes it correctly."
        test_recipe:
          setup: ["One NEW work order and two HVAC vendors."]
          setup_api_calls:
            - call: "POST /fm/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-04T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /fm/buildings"
              payload: { name: "Tower One", code: "BLD-1", gross_area_sqm: 1000 }
              as: FacilityManager
              captures: { b1: $.data.id }
            - call: "POST /fm/vendors"
              payload: { name: "CoolAir", trade: "HVAC", hourly_rate: 100.00, sla_response_minutes: 60, sla_resolve_minutes: 240 }
              as: FacilityManager
              captures: { v1: $.data.id }
            - call: "POST /fm/vendors"
              payload: { name: "WarmAir", trade: "HVAC", hourly_rate: 120.00, sla_response_minutes: 60, sla_resolve_minutes: 240 }
              as: FacilityManager
              captures: { v2: $.data.id }
            - call: "POST /fm/work-orders"
              payload: { building_id: "${b1}", wo_type: "CORRECTIVE", priority: "P3", estimated_labor_hours: 2, estimated_parts_cost: 0 }
              as: FacilityManager
              captures: { wo1: $.data.id, wo1_v: $.data.version }
            - call: "POST /fm/work-orders/${wo1}/dispatches"
              payload: { vendor_id: "${v1}", expected_work_order_version: "${wo1_v}" }
              as: FacilityManager
              captures: { d1: $.data.id }
          trigger:
            - call: "POST /fm/work-orders/${wo1}/dispatches"
              payload: { vendor_id: "${v2}", expected_work_order_version: "${wo1_v}" }
              as: FacilityManager
              captures: { err_id: $.data.error_id }
            - call: "GET /fm/work-orders/${wo1}"
              payload: {}
              as: FacilityManager
              captures: { wo1_v2: $.data.version }
            - call: "POST /fm/work-orders/${wo1}/dispatches"
              payload: { vendor_id: "${v2}", expected_work_order_version: "${wo1_v2}" }
              as: FacilityManager
              captures: { d2: $.data.id }
          assert:
            - "the stale create returns 412 with ${err_id} == ERR_STALE_VERSION"
            - "after the stale create Dispatch.${d1}.status == OFFERED (not superseded) and WorkOrder.${wo1}.version == ${wo1_v} + 1"
            - "the retry with the fresh version returns 201, Dispatch.${d2}.status == OFFERED and Dispatch.${d1}.status == CANCELLED (legitimate supersede)"
            - "WorkOrder.${wo1}.estimated_amount == 240.00 (2 * 120.00 from the superseding vendor, P3 surcharge 0)"

      - name: occ_stale_lease_version_on_statement_create_rejected
        claim_type: optimistic_concurrency
        grounds:
          - "concurrency_rules[statement-create-stale-lease]"
          - "errors[ERR_STALE_VERSION]"
        distinguishing_aspect: "Statement creation bumps Lease.version; a second create for the following month still carrying the pre-create lease version is rejected with 412 ERR_STALE_VERSION and no second statement row appears."
        test_recipe:
          setup: ["ACTIVE lease with one allocation and one DRAFT statement already created for May 2026."]
          setup_api_calls:
            - call: "POST /fm/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-15T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /fm/buildings"
              payload: { name: "Tower One", code: "BLD-1", gross_area_sqm: 1000 }
              as: FacilityManager
              captures: { b1: $.data.id }
            - call: "POST /fm/buildings/${b1}/spaces"
              payload: { space_code: "S1", floor: 1, area_sqm: 100, space_type: "OFFICE" }
              as: FacilityManager
              captures: { s1: $.data.id }
            - call: "POST /fm/leases"
              payload: { building_id: "${b1}", tenant_name: "Acme", base_rate_per_sqm_month: 10.00, start_date: "2026-05-01T00:00:00Z", end_date: "2027-04-30T23:59:59Z" }
              as: FinanceController
              captures: { l1: $.data.id }
            - call: "POST /fm/leases/${l1}/allocations"
              payload: { space_id: "${s1}", share_pct: 100, effective_from: "2026-05-01T00:00:00Z", effective_to: "2027-04-30T23:59:59Z" }
              as: FinanceController
            - call: "POST /fm/leases/${l1}/activate"
              payload: {}
              as: FinanceController
            - call: "GET /fm/leases/${l1}"
              payload: {}
              as: FinanceController
              captures: { l1_v: $.data.version }
            - call: "POST /fm/leases/${l1}/statements"
              payload: { period_start: "2026-05-01T00:00:00Z", period_end: "2026-05-31T23:59:59Z", expected_lease_version: "${l1_v}" }
              as: FinanceController
              captures: { st1: $.data.id }
          trigger:
            - call: "POST /fm/leases/${l1}/statements"
              payload: { period_start: "2026-06-01T00:00:00Z", period_end: "2026-06-30T23:59:59Z", expected_lease_version: "${l1_v}" }
              as: FinanceController
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP status is 412 and ${err_id} == ERR_STALE_VERSION"
            - "GET /fm/leases/${l1}/statements returns total_count == 1 (only ${st1})"
            - "ChargebackStatement.${st1}.status == DRAFT"

      - name: statement_supersede_voids_draft_and_returns_orders_to_pending
        claim_type: cascading_side_effects
        grounds:
          - state_machines.ChargebackStatement.DRAFT_to_VOID
          - state_machines.WorkOrder_billing.INVOICED_to_PENDING
          - entities.WorkOrder.fields.statement_id
        distinguishing_aspect: "Creating a second statement for the same period VOIDs the DRAFT one, reverts its INVOICED work order to PENDING with statement_id cleared, and immediately re-collects that order onto the new statement — the order ends INVOICED against the NEW statement id, never double-billed."
        test_recipe:
          setup:
            - "ACTIVE lease holding 100% of a 100 sqm space in a 1000 sqm building; one chargeable order closed on 2026-05-10 with billable_amount 200.00; a DRAFT statement for May 2026 that already collected it."
          setup_api_calls:
            - call: "POST /fm/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-10T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /fm/buildings"
              payload: { name: "Tower One", code: "BLD-1", gross_area_sqm: 1000 }
              as: FacilityManager
              captures: { b1: $.data.id }
            - call: "POST /fm/buildings/${b1}/spaces"
              payload: { space_code: "S1", floor: 1, area_sqm: 100, space_type: "OFFICE" }
              as: FacilityManager
              captures: { s1: $.data.id }
            - call: "POST /fm/leases"
              payload: { building_id: "${b1}", tenant_name: "Acme", base_rate_per_sqm_month: 10.00, start_date: "2026-05-01T00:00:00Z", end_date: "2027-04-30T23:59:59Z" }
              as: FinanceController
              captures: { l1: $.data.id }
            - call: "POST /fm/leases/${l1}/allocations"
              payload: { space_id: "${s1}", share_pct: 100, effective_from: "2026-05-01T00:00:00Z", effective_to: "2027-04-30T23:59:59Z" }
              as: FinanceController
            - call: "POST /fm/leases/${l1}/activate"
              payload: {}
              as: FinanceController
            - call: "POST /fm/vendors"
              payload: { name: "CoolAir", trade: "HVAC", hourly_rate: 100.00, sla_response_minutes: 60, sla_resolve_minutes: 240 }
              as: FacilityManager
              captures: { v1: $.data.id }
            - call: "POST /fm/work-orders"
              payload: { building_id: "${b1}", wo_type: "CORRECTIVE", priority: "P3", estimated_labor_hours: 2, estimated_parts_cost: 0, chargeable: true }
              as: FacilityManager
              captures: { wo1: $.data.id, wo1_v: $.data.version }
            - call: "POST /fm/work-orders/${wo1}/dispatches"
              payload: { vendor_id: "${v1}", expected_work_order_version: "${wo1_v}" }
              as: FacilityManager
              captures: { d1: $.data.id }
            - call: "POST /fm/dispatches/${d1}/accept"
              payload: {}
              as: VendorTech
              as_user_id: "${v1}"
            - call: "POST /fm/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-10T11:00:00Z" }
              as: PlatformAdmin
            - call: "POST /fm/dispatches/${d1}/complete"
              payload: { actual_labor_hours: 2, actual_parts_cost: 0 }
              as: VendorTech
              as_user_id: "${v1}"
            - call: "POST /fm/work-orders/${wo1}/qa"
              payload: { outcome: "PASS" }
              as: FacilityManager
            - call: "GET /fm/leases/${l1}"
              payload: {}
              as: FinanceController
              captures: { l1_v: $.data.version }
            - call: "POST /fm/leases/${l1}/statements"
              payload: { period_start: "2026-05-01T00:00:00Z", period_end: "2026-05-31T23:59:59Z", expected_lease_version: "${l1_v}" }
              as: FinanceController
              captures: { st1: $.data.id }
            - call: "GET /fm/leases/${l1}"
              payload: {}
              as: FinanceController
              captures: { l1_v2: $.data.version }
          trigger:
            - call: "POST /fm/leases/${l1}/statements"
              payload: { period_start: "2026-05-01T00:00:00Z", period_end: "2026-05-31T23:59:59Z", expected_lease_version: "${l1_v2}" }
              as: FinanceController
              captures: { st2: $.data.id }
            - call: "GET /fm/work-orders/${wo1}"
              payload: {}
              as: FinanceController
          assert:
            - "ChargebackStatement.${st1}.status == VOID"
            - "ChargebackStatement.${st2}.status == DRAFT, om_share == 20.00, total_amount == 1020.00 (the order was re-collected, not lost)"
            - "WorkOrder.${wo1}.billing_status == INVOICED and statement_id == ${st2}"
            - "GET /fm/work-orders?statement_id=${st1} returns total_count == 0"

      - name: version_increments_on_every_mutation_of_work_order
        claim_type: derived_field_reconciliation
        grounds:
          - entities.WorkOrder.fields.status
          - 'endpoints["POST /fm/work-orders/{work_order_id}/dispatches"]'
        distinguishing_aspect: "WorkOrder.version starts at 1 on create and increments by exactly 1 per mutation, including the cascaded mutation from the vendor's accept — so after create + dispatch + accept the version is 3."
        test_recipe:
          setup: ["One NEW work order and one HVAC vendor."]
          setup_api_calls:
            - call: "POST /fm/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-04T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /fm/buildings"
              payload: { name: "Tower One", code: "BLD-1", gross_area_sqm: 1000 }
              as: FacilityManager
              captures: { b1: $.data.id }
            - call: "POST /fm/vendors"
              payload: { name: "CoolAir", trade: "HVAC", hourly_rate: 100.00, sla_response_minutes: 60, sla_resolve_minutes: 240 }
              as: FacilityManager
              captures: { v1: $.data.id }
            - call: "POST /fm/work-orders"
              payload: { building_id: "${b1}", wo_type: "CORRECTIVE", priority: "P3", estimated_labor_hours: 2, estimated_parts_cost: 0 }
              as: FacilityManager
              captures: { wo1: $.data.id, wo1_v: $.data.version }
            - call: "POST /fm/work-orders/${wo1}/dispatches"
              payload: { vendor_id: "${v1}", expected_work_order_version: "${wo1_v}" }
              as: FacilityManager
              captures: { d1: $.data.id }
          trigger:
            - call: "POST /fm/dispatches/${d1}/accept"
              payload: {}
              as: VendorTech
              as_user_id: "${v1}"
            - call: "GET /fm/work-orders/${wo1}"
              payload: {}
              as: FacilityManager
          assert:
            - "${wo1_v} == 1 (fresh create)"
            - "WorkOrder.${wo1}.version == 3 (one bump for the dispatch, one for the cascaded accept)"
            - "WorkOrder.${wo1}.updated_at is strictly later than created_at"

  # ===========================================================================
  - section: consistency_model
    instances:
      - name: posture_cascade_visible_in_same_request_response
        claim_type: immediate
        grounds:
          - calculations.building_operating_posture
          - state_machines.Building.OPEN_to_FROZEN
          - 'endpoints["POST /fm/assets/{asset_id}/report-failure"]'
        distinguishing_aspect: "consistency_model is immediate: the very response to report-failure already carries status OUT_OF_SERVICE, and a GET issued straight afterwards shows the building FROZEN with its counters updated — no lag, no background job."
        test_recipe:
          setup: ["One CRITICAL asset IN_SERVICE in an OPEN building."]
          setup_api_calls:
            - call: "POST /fm/buildings"
              payload: { name: "Tower One", code: "BLD-1", gross_area_sqm: 1000 }
              as: FacilityManager
              captures: { b1: $.data.id }
            - call: "POST /fm/assets"
              payload: { building_id: "${b1}", asset_tag: "CHILLER-01", category: "HVAC", criticality: "CRITICAL" }
              as: FacilityManager
              captures: { a1: $.data.id }
          trigger:
            - call: "POST /fm/assets/${a1}/report-failure"
              payload: {}
              as: FacilityManager
              captures: { a1_status: $.data.status }
            - call: "GET /fm/buildings/${b1}"
              payload: {}
              as: FacilityManager
          assert:
            - "${a1_status} == OUT_OF_SERVICE (already in the mutating call's own response)"
            - "Building.${b1}.operating_posture == FROZEN and oos_critical_asset_count == 1 on the immediately following read"
