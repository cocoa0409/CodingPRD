scaffold_corner_design:
  - section: entities
    instances:
      - name: design_project_defaults_and_computed_ratio
        claim_type: computed_fields
        grounds:
          - entities.DesignProject.fields.dc_ac_ratio
          - entities.DesignProject.fields.status
          - endpoints.[POST /warranty/design-projects]
        distinguishing_aspect: |
          A freshly created design starts DRAFT and its computed dc_ac_ratio overrides any
          ratio-looking input, returning exactly 1.25 for 20 modules and 10000 input watts.
        test_recipe:
          setup:
            - "installer GOLD ACTIVE with design tool access, no design projects yet"
          setup_api_calls:
            - call: "POST /warranty/installers"
              payload: { installer_code: "INST-C1", company_name: "Victor Solar" }
              as: PlatformAdmin
              captures: { inst_c1: "$.data.id" }
            - call: "POST /warranty/installers/${inst_c1}/activate"
              payload: {}
              as: PlatformAdmin
            - call: "POST /warranty/installer-levels"
              payload: { installer_id: "${inst_c1}", level: "GOLD" }
              as: PlatformAdmin
          trigger:
            - call: "POST /warranty/design-projects"
              payload: { installer_id: "${inst_c1}", site_address: "20 Victor Way", site_postal_code: "94020", module_count: 20, dc_capacity_watts: 10000 }
              as: Installer
              as_user_id: "${inst_c1}"
              captures: { dp_c1: "$.data.id", dp_c1_ratio: "$.data.dc_ac_ratio", dp_c1_status: "$.data.status", dp_c1_created: "$.data.created_at", dp_c1_version: "$.data.version" }
          assert:
            - "DesignProject.${dp_c1}.status == DRAFT"
            - "DesignProject.${dp_c1}.dc_ac_ratio == 1.25"
            - "DesignProject.${dp_c1}.version == 1"
            - "DesignProject.${dp_c1}.rejection_reason is null"

      - name: installer_missing_required_field_returns_invalid_request
        claim_type: required_fields
        grounds:
          - entities.Installer.fields.company_name
          - validations[priority=3]
          - errors[ERR_INVALID_REQUEST_BODY]
        distinguishing_aspect: |
          Omitting the required company_name on installer creation is rejected with
          ERR_INVALID_REQUEST_BODY before any uniqueness check on installer_code runs.
        test_recipe:
          setup:
            - "empty database"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /warranty/installers"
              payload: { installer_code: "INST-C2" }
              as: PlatformAdmin
              captures: { c2_err: "$.data.error_id" }
          assert:
            - "the response error_id is ERR_INVALID_REQUEST_BODY"
            - "no Installer row was created for installer_code INST-C2"

      - name: installer_not_found_on_read
        claim_type: not_found
        grounds:
          - endpoints.[GET /warranty/installers/{id}]
          - errors[ERR_RESOURCE_NOT_FOUND]
        distinguishing_aspect: |
          A read of an unknown installer id returns ERR_RESOURCE_NOT_FOUND rather than an
          empty object or a 500.
        test_recipe:
          setup:
            - "empty database"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "GET /warranty/installers/00000000-0000-0000-0000-000000000001"
              payload: {}
              as: PlatformAdmin
              captures: { c3_err: "$.data.error_id" }
          assert:
            - "the response error_id is ERR_RESOURCE_NOT_FOUND"

      - name: system_registrations_list_pagination_and_filter
        claim_type: listing
        grounds:
          - endpoints.[GET /warranty/system-registrations]
          - entities.SystemRegistration.fields.installer_id
        distinguishing_aspect: |
          The filtered list honors installer_id, offset and limit and reports total_count and
          has_more consistent with the unpaginated filtered set size.
        test_recipe:
          setup:
            - "installer with one approved design and two systems registered at different sites, clock fixed"
          setup_api_calls:
            - call: "POST /warranty/installers"
              payload: { installer_code: "INST-C4", company_name: "Whiskey Solar" }
              as: PlatformAdmin
              captures: { inst_c4: "$.data.id" }
            - call: "POST /warranty/installers/${inst_c4}/activate"
              payload: {}
              as: PlatformAdmin
            - call: "POST /warranty/installer-levels"
              payload: { installer_id: "${inst_c4}", level: "GOLD" }
              as: PlatformAdmin
            - call: "POST /warranty/design-projects"
              payload: { installer_id: "${inst_c4}", site_address: "21 Whiskey Way", site_postal_code: "94021", module_count: 20, dc_capacity_watts: 10000 }
              as: Installer
              as_user_id: "${inst_c4}"
              captures: { dp_c4: "$.data.id" }
            - call: "POST /warranty/design-projects/${dp_c4}/submit"
              payload: {}
              as: Installer
              as_user_id: "${inst_c4}"
            - call: "POST /warranty/design-projects/${dp_c4}/approve"
              payload: {}
              as: PlatformAdmin
            - call: "POST /warranty/production-lots"
              payload: { lot_code: "LOT-C4", manufacture_month: "2026-01", embed_model_code: "IQ8", defect_threshold_pct: 5.0, replacement_model_code: "IQ8" }
              as: PlatformAdmin
              captures: { lot_c4: "$.data.id" }
            - call: "POST /warranty/system-registrations"
              payload: { installer_id: "${inst_c4}", design_project_id: "${dp_c4}", site_address: "21 Whiskey Way", site_postal_code: "94021", homeowner_name: "W. Whiskey", homeowner_email: "w@whiskey.example", commissioned_at: "2026-02-01T00:00:00Z", units: [{ serial_number: "C4-U1", model_code: "IQ8", installed_at: "2026-02-01T00:00:00Z", production_lot_code: "LOT-C4" }] }
              as: Installer
              as_user_id: "${inst_c4}"
              captures: { sys_c4_a: "$.data.id" }
            - call: "POST /warranty/system-registrations"
              payload: { installer_id: "${inst_c4}", design_project_id: "${dp_c4}", site_address: "22 Whiskey Way", site_postal_code: "94022", homeowner_name: "W. Whiskey", homeowner_email: "w@whiskey.example", commissioned_at: "2026-03-01T00:00:00Z", units: [{ serial_number: "C4-U2", model_code: "IQ8", installed_at: "2026-03-01T00:00:00Z", production_lot_code: "LOT-C4" }] }
              as: Installer
              as_user_id: "${inst_c4}"
              captures: { sys_c4_b: "$.data.id" }
          trigger:
            - call: "GET /warranty/system-registrations"
              payload: { installer_id: "${inst_c4}", limit: 1, offset: 0 }
              as: PlatformAdmin
              captures: { c4_total: "$.meta.total_count", c4_has_more: "$.meta.has_more", c4_first: "$.data[0].id" }
            - call: "GET /warranty/system-registrations"
              payload: { installer_id: "${inst_c4}", limit: 1, offset: 1 }
              as: PlatformAdmin
              captures: { c4_second: "$.data[0].id" }
          assert:
            - "envelope meta.total_count == 2 and meta.has_more == true on the first page"
            - "the two pages return different ids: ${c4_first} and ${c4_second}"
            - "no page returns a system belonging to a different installer"

      - name: unit_creation_after_registration_is_commissioned_and_subresources
        claim_type: creation
        grounds:
          - entities.Unit.fields.commissioning_state
          - entities.SystemRegistration.fields.units
          - endpoints.[GET /warranty/system-registrations/{id}/units]
        distinguishing_aspect: |
          Commissioning synthesizes one Unit per payload entry with commissioning_state
          COMMISSIONED, and the gateway serial is storably retrievable on the Unit itself.
        test_recipe:
          setup:
            - "installer with an approved design and a lot registered"
          setup_api_calls:
            - call: "POST /warranty/installers"
              payload: { installer_code: "INST-C5", company_name: "Xray Solar" }
              as: PlatformAdmin
              captures: { inst_c5: "$.data.id" }
            - call: "POST /warranty/installers/${inst_c5}/activate"
              payload: {}
              as: PlatformAdmin
            - call: "POST /warranty/installer-levels"
              payload: { installer_id: "${inst_c5}", level: "GOLD" }
              as: PlatformAdmin
            - call: "POST /warranty/design-projects"
              payload: { installer_id: "${inst_c5}", site_address: "23 Xray Way", site_postal_code: "94023", module_count: 20, dc_capacity_watts: 10000 }
              as: Installer
              as_user_id: "${inst_c5}"
              captures: { dp_c5: "$.data.id" }
            - call: "POST /warranty/design-projects/${dp_c5}/submit"
              payload: {}
              as: Installer
              as_user_id: "${inst_c5}"
            - call: "POST /warranty/design-projects/${dp_c5}/approve"
              payload: {}
              as: PlatformAdmin
            - call: "POST /warranty/production-lots"
              payload: { lot_code: "LOT-C5", manufacture_month: "2026-01", embed_model_code: "IQ8", defect_threshold_pct: 5.0, replacement_model_code: "IQ8" }
              as: PlatformAdmin
              captures: { lot_c5: "$.data.id" }
          trigger:
            - call: "POST /warranty/system-registrations"
              payload: { installer_id: "${inst_c5}", design_project_id: "${dp_c5}", site_address: "23 Xray Way", site_postal_code: "94023", homeowner_name: "X. Xray", homeowner_email: "x@xray.example", commissioned_at: "2026-04-01T00:00:00Z", units: [{ serial_number: "C5-U1", model_code: "IQ8", installed_at: "2026-04-01T00:00:00Z", production_lot_code: "LOT-C5" }] }
              as: Installer
              as_user_id: "${inst_c5}"
              captures: { sys_c5: "$.data.id", sys_c5_units: "$.data.unit_count", sys_c5_status: "$.data.warranty_status" }
            - call: "GET /warranty/system-registrations/${sys_c5}/units"
              payload: {}
              as: PlatformAdmin
              captures: { c5_u1: "$.data[0].id", c5_u1_serial: "$.data[0].serial_number", c5_u1_state: "$.data[0].commissioning_state", c5_u1_status: "$.data[0].monitored_status", c5_u1_lot: "$.data[0].production_lot_id", c5_u1_pos: "$.data[0].replacement_window_position" }
          assert:
            - "SystemRegistration.${sys_c5}.unit_count == 1 and warranty_status == ACTIVE"
            - "Unit.${c5_u1}.serial_number == C5-U1"
            - "Unit.${c5_u1}.commissioning_state == COMMISSIONED"
            - "Unit.${c5_u1}.monitored_status == ONLINE"
            - "Unit.${c5_u1}.production_lot_id == ${lot_c5}"
            - "Unit.${c5_u1}.replacement_window_position == 5"

      - name: serial_already_registered_conflict
        claim_type: type_constraints
        grounds:
          - validations[priority=13]
          - errors[ERR_SERIAL_ALREADY_REGISTERED]
          - entities.Unit.fields.serial_number
        distinguishing_aspect: |
          Reusing an existing serial number on a new commissioning payload is rejected with
          ERR_SERIAL_ALREADY_REGISTERED and no second Unit row appears.
        test_recipe:
          setup:
            - "installer with one registered system holding serial C6-U1; a second approved design is ready"
          setup_api_calls:
            - call: "POST /warranty/installers"
              payload: { installer_code: "INST-C6", company_name: "Yankee Solar" }
              as: PlatformAdmin
              captures: { inst_c6: "$.data.id" }
            - call: "POST /warranty/installers/${inst_c6}/activate"
              payload: {}
              as: PlatformAdmin
            - call: "POST /warranty/installer-levels"
              payload: { installer_id: "${inst_c6}", level: "GOLD" }
              as: PlatformAdmin
            - call: "POST /warranty/design-projects"
              payload: { installer_id: "${inst_c6}", site_address: "24 Yankee Way", site_postal_code: "94024", module_count: 20, dc_capacity_watts: 10000 }
              as: Installer
              as_user_id: "${inst_c6}"
              captures: { dp_c6_a: "$.data.id" }
            - call: "POST /warranty/design-projects/${dp_c6_a}/submit"
              payload: {}
              as: Installer
              as_user_id: "${inst_c6}"
            - call: "POST /warranty/design-projects/${dp_c6_a}/approve"
              payload: {}
              as: PlatformAdmin
            - call: "POST /warranty/design-projects"
              payload: { installer_id: "${inst_c6}", site_address: "25 Yankee Way", site_postal_code: "94025", module_count: 20, dc_capacity_watts: 10000 }
              as: Installer
              as_user_id: "${inst_c6}"
              captures: { dp_c6_b: "$.data.id" }
            - call: "POST /warranty/design-projects/${dp_c6_b}/submit"
              payload: {}
              as: Installer
              as_user_id: "${inst_c6}"
            - call: "POST /warranty/design-projects/${dp_c6_b}/approve"
              payload: {}
              as: PlatformAdmin
            - call: "POST /warranty/production-lots"
              payload: { lot_code: "LOT-C6", manufacture_month: "2026-01", embed_model_code: "IQ8", defect_threshold_pct: 5.0, replacement_model_code: "IQ8" }
              as: PlatformAdmin
              captures: { lot_c6: "$.data.id" }
            - call: "POST /warranty/system-registrations"
              payload: { installer_id: "${inst_c6}", design_project_id: "${dp_c6_a}", site_address: "24 Yankee Way", site_postal_code: "94024", homeowner_name: "Y. Yankee", homeowner_email: "y@yankee.example", commissioned_at: "2026-04-01T00:00:00Z", units: [{ serial_number: "C6-U1", model_code: "IQ8", installed_at: "2026-04-01T00:00:00Z", production_lot_code: "LOT-C6" }] }
              as: Installer
              as_user_id: "${inst_c6}"
              captures: { sys_c6: "$.data.id" }
          trigger:
            - call: "POST /warranty/system-registrations"
              payload: { installer_id: "${inst_c6}", design_project_id: "${dp_c6_b}", site_address: "25 Yankee Way", site_postal_code: "94025", homeowner_name: "Y. Yankee", homeowner_email: "y@yankee.example", commissioned_at: "2026-05-01T00:00:00Z", units: [{ serial_number: "C6-U1", model_code: "IQ8", installed_at: "2026-05-01T00:00:00Z", production_lot_code: "LOT-C6" }] }
              as: Installer
              as_user_id: "${inst_c6}"
              captures: { c6_err: "$.data.error_id" }
          assert:
            - "the response error_id is ERR_SERIAL_ALREADY_REGISTERED"
            - "GET /warranty/units?production_lot_id=${lot_c6} still returns exactly one Unit"
            - "SystemRegistration count for installer ${inst_c6} stays 1"

      - name: production_lot_is_immutable_without_version
        claim_type: immutability
        grounds:
          - entities.ProductionLot.common_fields
          - endpoints.[GET /warranty/production-lots/{id}]
        distinguishing_aspect: |
          ProductionLot is declared with common_fields false, so its read carries id and
          created_at only and no version field exists to drive an OCC update.
        test_recipe:
          setup:
            - "one production lot created directly"
          setup_api_calls:
            - call: "POST /warranty/production-lots"
              payload: { lot_code: "LOT-C7", manufacture_month: "2026-01", embed_model_code: "IQ8", defect_threshold_pct: 6.0, replacement_model_code: "IQ8HC" }
              as: PlatformAdmin
              captures: { lot_c7: "$.data.id" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "GET /warranty/production-lots/${lot_c7}"
              payload: {}
              as: PlatformAdmin
              captures: { c7_created: "$.data.created_at", c7_updated: "$.data.updated_at" }
          assert:
            - "the lot read exposes id ${lot_c7} and created_at ${c7_created}"
            - "the read exposes no version field, and updated_at is absent or null because common_fields is false"
            - "ProductionLot.${lot_c7}.lot_status == NORMAL and defect_threshold_pct == 6.0"

  - section: state_machines
    instances:
      - name: installer_activate_from_active_is_invalid_state
        claim_type: invalid_transition
        grounds:
          - state_machines.Installer.PENDING_to_ACTIVE
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: |
          A second activate on an already ACTIVE installer is rejected with ERR_INVALID_STATE
          and certified_until is not re-issued.
        test_recipe:
          setup:
            - "installer created and activated once"
          setup_api_calls:
            - call: "POST /warranty/installers"
              payload: { installer_code: "INST-SM1", company_name: "Zulu Solar" }
              as: PlatformAdmin
              captures: { inst_sm1: "$.data.id" }
            - call: "POST /warranty/installers/${inst_sm1}/activate"
              payload: {}
              as: PlatformAdmin
              captures: { sm1_until: "$.data.certified_until" }
          trigger:
            - call: "POST /warranty/installers/${inst_sm1}/activate"
              payload: {}
              as: PlatformAdmin
              captures: { sm1_err: "$.data.error_id" }
          assert:
            - "the response error_id is ERR_INVALID_STATE"
            - "GET /warranty/installers/${inst_sm1} still reports certified_until ${sm1_until}"
            - "Installer.${inst_sm1}.certification_status == ACTIVE"

      - name: suspended_installer_cannot_be_reinstated_while_claim_midflight
        claim_type: precondition_enforcement
        grounds:
          - state_machines.Installer.SUSPENDED_to_ACTIVE
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: |
          The SUSPENDED-to-ACTIVE precondition on zero in-flight claims is enforced: with a
          SUBMITTED claim outstanding the reinstate call fails with ERR_INVALID_STATE.
        test_recipe:
          setup:
            - "installer suspended while one of its claims sits in SUBMITTED"
          setup_api_calls:
            - call: "POST /warranty/installers"
              payload: { installer_code: "INST-SM2", company_name: "Alpha Solar" }
              as: PlatformAdmin
              captures: { inst_sm2: "$.data.id" }
            - call: "POST /warranty/installers/${inst_sm2}/activate"
              payload: {}
              as: PlatformAdmin
            - call: "POST /warranty/installer-levels"
              payload: { installer_id: "${inst_sm2}", level: "GOLD" }
              as: PlatformAdmin
            - call: "POST /warranty/design-projects"
              payload: { installer_id: "${inst_sm2}", site_address: "26 Alpha Way", site_postal_code: "94026", module_count: 20, dc_capacity_watts: 10000 }
              as: Installer
              as_user_id: "${inst_sm2}"
              captures: { dp_sm2: "$.data.id" }
            - call: "POST /warranty/design-projects/${dp_sm2}/submit"
              payload: {}
              as: Installer
              as_user_id: "${inst_sm2}"
            - call: "POST /warranty/design-projects/${dp_sm2}/approve"
              payload: {}
              as: PlatformAdmin
            - call: "POST /warranty/production-lots"
              payload: { lot_code: "LOT-SM2", manufacture_month: "2026-01", embed_model_code: "IQ8", defect_threshold_pct: 5.0, replacement_model_code: "IQ8" }
              as: PlatformAdmin
              captures: { lot_sm2: "$.data.id" }
            - call: "POST /warranty/system-registrations"
              payload: { installer_id: "${inst_sm2}", design_project_id: "${dp_sm2}", site_address: "26 Alpha Way", site_postal_code: "94026", homeowner_name: "A. Alpha", homeowner_email: "a@alpha.example", commissioned_at: "2026-04-01T00:00:00Z", units: [{ serial_number: "SM2-U1", model_code: "IQ8", installed_at: "2026-04-01T00:00:00Z", production_lot_code: "LOT-SM2" }] }
              as: Installer
              as_user_id: "${inst_sm2}"
              captures: { sys_sm2: "$.data.id" }
            - call: "GET /warranty/system-registrations/${sys_sm2}/units"
              payload: {}
              as: PlatformAdmin
              captures: { sm2_u1: "$.data[0].id", sm2_u1_v: "$.data[0].version" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /warranty/units/${sm2_u1}/diagnostics"
              payload: { performance_ratio: 0.0, observed_at: "2026-08-01T00:00:00Z" }
              as: MonitoringService
            - call: "POST /warranty/claims"
              payload: { unit_id: "${sm2_u1}", installer_id: "${inst_sm2}", claim_kind: "DEFECT", remote_diagnostic_ref: "DIAG-SM2", expected_unit_version: "${sm2_u1_v}" }
              as: Installer
              as_user_id: "${inst_sm2}"
              captures: { clm_sm2: "$.data.id" }
            - call: "POST /warranty/claims/${clm_sm2}/submit"
              payload: {}
              as: Installer
              as_user_id: "${inst_sm2}"
            - call: "POST /warranty/installers/${inst_sm2}/suspend"
              payload: { reason: "review" }
              as: PlatformAdmin
          trigger:
            - call: "POST /warranty/installers/${inst_sm2}/reinstate"
              payload: {}
              as: PlatformAdmin
              captures: { sm2_err: "$.data.error_id" }
          assert:
            - "the response error_id is ERR_INVALID_STATE"
            - "Installer.${inst_sm2}.certification_status stays SUSPENDED"
            - "WarrantyClaim.${clm_sm2}.status is still SUBMITTED"

      - name: claim_deny_from_approved_is_invalid_state
        claim_type: invalid_transition
        grounds:
          - state_machines.WarrantyClaim.DIAGNOSED_to_DENIED
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: |
          DENIED is reachable only from DIAGNOSED: denying an APPROVED claim fails with
          ERR_INVALID_STATE and the claim keeps its approval.
        test_recipe:
          setup:
            - "one claim advanced through submit, diagnose and approve"
          setup_api_calls:
            - call: "POST /warranty/installers"
              payload: { installer_code: "INST-SM3", company_name: "Bravo Solar" }
              as: PlatformAdmin
              captures: { inst_sm3: "$.data.id" }
            - call: "POST /warranty/installers/${inst_sm3}/activate"
              payload: {}
              as: PlatformAdmin
            - call: "POST /warranty/installer-levels"
              payload: { installer_id: "${inst_sm3}", level: "GOLD" }
              as: PlatformAdmin
            - call: "POST /warranty/design-projects"
              payload: { installer_id: "${inst_sm3}", site_address: "27 Bravo Way", site_postal_code: "94027", module_count: 20, dc_capacity_watts: 10000 }
              as: Installer
              as_user_id: "${inst_sm3}"
              captures: { dp_sm3: "$.data.id" }
            - call: "POST /warranty/design-projects/${dp_sm3}/submit"
              payload: {}
              as: Installer
              as_user_id: "${inst_sm3}"
            - call: "POST /warranty/design-projects/${dp_sm3}/approve"
              payload: {}
              as: PlatformAdmin
            - call: "POST /warranty/production-lots"
              payload: { lot_code: "LOT-SM3", manufacture_month: "2026-01", embed_model_code: "IQ8", defect_threshold_pct: 5.0, replacement_model_code: "IQ8" }
              as: PlatformAdmin
              captures: { lot_sm3: "$.data.id" }
            - call: "POST /warranty/system-registrations"
              payload: { installer_id: "${inst_sm3}", design_project_id: "${dp_sm3}", site_address: "27 Bravo Way", site_postal_code: "94027", homeowner_name: "B. Bravo", homeowner_email: "b@bravo.example", commissioned_at: "2026-04-01T00:00:00Z", units: [{ serial_number: "SM3-U1", model_code: "IQ8", installed_at: "2026-04-01T00:00:00Z", production_lot_code: "LOT-SM3" }] }
              as: Installer
