  # ==========================================================================
  # RULE 3 - non_linear_state_machine
  # ArtworkVersion is cyclic (REVISION_REQUESTED -> DRAFT with a bounded
  # counter); PrinterProof is parallel (three independent dimensions whose
  # product is a derived state).
  # ==========================================================================
  - rule_id: non_linear_state_machine
    instances:

      - name: version_revision_cycle_loops_to_draft_until_cap_blocks_revise
        grounds:
          - state_machines.ArtworkVersion.IN_REVIEW_to_REVISION_REQUESTED
          - state_machines.ArtworkVersion.REVISION_REQUESTED_to_DRAFT
          - state_machines.ArtworkVersion.DRAFT_to_ELEMENTS_VERIFIED
          - state_machines.ArtworkVersion.ELEMENTS_VERIFIED_to_IN_REVIEW
          - state_machines.ReviewRoute.IN_PROGRESS_to_COMPLETE_REJECTED
          - state_machines.ReviewTask.PENDING_to_SKIPPED
          - entities.ArtworkVersion.fields.revision_cycle_count
          - entities.ArtworkVersion.fields.route_count
          - validations[priority=41]
        distinguishing_aspect: |
          This is the CYCLE instance: the version walks
          DRAFT -> ELEMENTS_VERIFIED -> IN_REVIEW -> REVISION_REQUESTED -> DRAFT three
          full times over three distinct ReviewRoutes and is only stopped by the
          revision_cycle_count == REVISION_CYCLE_CAP guard on the fourth revise, so the
          same trigger succeeds three times and then fails on identical input - a
          purely count-gated loop, not a fork or an independent dimension.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "Brief SKU-1001 APPROVED (FDA_FOOD / [US] / [en]) with all seven element codes required."
