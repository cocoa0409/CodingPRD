  - rule_id: priority_pair_validation_conflict
    instances:

      - name: stale_version_beats_fee_cap_violation_on_fee_update
        grounds:
          - validations[priority=5]
          - validations[priority=7]
          - concurrency_rules[fee-config-update-stale-version]
        distinguishing_aspect: |
          Error-category pair business_constraint (OCC, priority 5) vs
          business_safety (filing cap, priority 7): a fee-config update that
          violates the cap (flat_fee_pct 0.40 > 0.25) AND carries a stale
          expected_fee_config_version MUST return ERR_STALE_VERSION (412), not
          ERR_FLAT_FEE_VIOLATES_FILING.
        test_recipe:
          setup:
            - "Clock 2026-09-01T00:00:00Z. State TX filing APPROVED (PCT, cap 0.25)."
            - "FeeConfig DRAFT flat_fee_pct 0.20 created; version captured at creation."
            - "One legitimate update bumps the config version (0.20 → 0.22), so the captured version is now stale."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /rate-filings"
              payload: { state_code: "TX", max_flat_fee_pct: 0.25, max_flat_fee_cap_cents: 90000, filing_mode: "PCT_OF_PREMIUM" }
              as: UnderwritingAdmin
              captures: { filing: $.data.id }
            - call: "POST /rate-filings/${filing}/approve"
              payload: {}
              as: UnderwritingAdmin
            - call: "POST /fee-configs"
              payload: { state_code: "TX", filing_id: "${filing}", flat_fee_pct: 0.20, flat_fee_cents: 90000 }
              as: UnderwritingAdmin
              captures: { fc: $.data.id, fc_v: $.data.version }
            - call: "POST /fee-configs/${fc}/update"
              payload: { flat_fee_pct: 0.22, expected_fee_config_version: "${fc_v}" }
              as: UnderwritingAdmin
          trigger:
            - call: "POST /fee-configs/${fc}/update"
              payload: { flat_fee_pct: 0.40, expected_fee_config_version: "${fc_v}" }
              as: UnderwritingAdmin
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_STALE_VERSION (HTTP 412) — OCC constraint outranks the filing-cap safety check"
            - "FeeConfig.${fc}.flat_fee_pct == 0.22 (neither the stale nor the cap-violating value was applied)"

