        distinguishing_aspect: "A created order starts DRAFT with product_total_cents null and every materialized line PENDING with allocated_quantity 0."
        test_recipe:
          setup: ["warehouse, product, customer exist"]
          setup_api_calls:
            - { call: "POST /lab/warehouses", payload: { name: "WH-NE", region_code: "US-NE", hazmat_certified: true }, as: OpsAdmin, captures: { wh_id: "$.data.id" } }
            - { call: "POST /lab/products", payload: { sku: "CH-1000", name: "Assay Vial", storage_requirement: "AMBIENT", hazard_class: "NON_HAZARDOUS", max_qty_per_shipment: 500, unit_price_cents: 1000, requires_cold_chain: false, shelf_life_days: 365, min_remaining_shelf_life_days: 7 }, as: CatalogManager, captures: { prod_id: "$.data.id" } }
