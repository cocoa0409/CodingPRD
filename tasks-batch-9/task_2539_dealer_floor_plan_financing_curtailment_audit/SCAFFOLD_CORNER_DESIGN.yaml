        claim_type: violation_to_error
        grounds:
          - validations[priority=90]
          - errors.ERR_DUPLICATE_VIN
          - endpoints["POST /floorplan/units"]
        distinguishing_aspect: "The VIN uniqueness scope is the dealer, not the whole lender: registering the same 17-character VIN twice for one dealer returns 409 ERR_DUPLICATE_VIN, while a second dealer may register that identical VIN successfully."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "Two ACTIVE Dealers, each with its own ACTIVE CreditLine."
