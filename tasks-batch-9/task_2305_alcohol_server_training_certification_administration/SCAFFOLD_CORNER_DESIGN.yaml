              payload: { location_name: "Alamo Taproom", state_jurisdiction_id: "${tx_id}", premise_type: "ON_PREMISE", annual_premium_cents: 4821734 }
              as: EmployerAdmin
              as_user_id: "${emp1}"
              captures: { loc1: $.data.id }
            - call: "POST /employer-accounts/${emp2}/locations"
              payload: { location_name: "Galveston Pier Bar", state_jurisdiction_id: "${tx_id}", premise_type: "ON_PREMISE", annual_premium_cents: 1990000 }
              as: EmployerAdmin
              as_user_id: "${emp2}"
              captures: { loc2: $.data.id }
          trigger:
            - call: "GET /employer-locations/${loc1}"
              payload: {}
              as: EmployerAdmin
              as_user_id: "${emp2}"
            - call: "GET /employer-locations/${loc1}/compliance-dashboard"
              payload: {}
              as: EmployerAdmin
              as_user_id: "${emp2}"
            - call: "POST /employer-accounts/${emp1}/locations"
              payload: { location_name: "Squatter Location", state_jurisdiction_id: "${tx_id}", premise_type: "ON_PREMISE", annual_premium_cents: 100000 }
              as: EmployerAdmin
              as_user_id: "${emp2}"
          assert:
            - "all three cross-account calls return 403 with error.code == 'ERR_NOT_RESOURCE_OWNER'"
