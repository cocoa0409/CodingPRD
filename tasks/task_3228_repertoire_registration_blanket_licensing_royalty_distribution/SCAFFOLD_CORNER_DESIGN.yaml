              captures: { rrw_id: $.data.id }
            - call: "POST /pro/works"
              payload: { title: "RR Song", registered_by_affiliate_id: "${rr_id}" }
              as: Publisher
              as_user_id: "${rr_id}"
              captures: { rr_work: $.data.id }
            - call: "POST /pro/works/${rr_work}/share-claims"
              payload: { affiliate_id: "${rr_id}", role: PUBLISHER, collection_share_bps: 5000, interest_share_bps: 5000 }
              as: Publisher
              as_user_id: "${rr_id}"
            - call: "POST /pro/works/${rr_work}/share-claims"
              payload: { affiliate_id: "${rrw_id}", role: WRITER, collection_share_bps: 5000, interest_share_bps: 5000 }
              as: Songwriter
              as_user_id: "${rrw_id}"
          trigger:
            - call: "GET /pro/works/${rr_work}/share-claims"
              payload: {}
              as: ProRegistrar
              captures: { rr_first_role: "$.data[0].role", rr_second_role: "$.data[1].role" }
          assert:
            - "exactly 2 claims listed for the work (envelope total_count == 2); roles are {PUBLISHER, WRITER}"

