            - "the LAUNCH_FEE row has committed_cents == 1000000, performance_deadline == \"2027-01-28T00:00:00Z\", status == \"OPEN\", earned_cents == 0 and remaining_cents == 1000000"
            - "the MARKETING_SUPPORT row has committed_cents == 4000000, performance_deadline == \"2028-12-31T00:00:00Z\" and remaining_cents == 4000000"
