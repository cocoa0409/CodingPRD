              as: WarrantyAdmin
            - call: "POST /coverage-tiers"
              payload: { product_id: "${prod_id}", tier_name: "SILVER", extension_months: 12, price_cents: 6000, coverage_cap_cents: 40000, depreciation_method: "STRAIGHT_LINE" }
              as: WarrantyAdmin
              captures: { silver_id: $.data.id }
            - call: "POST /coverage-tiers"
              payload: { product_id: "${prod_id}", tier_name: "GOLD", extension_months: 12, price_cents: 6000, coverage_cap_cents: 40000, depreciation_method: "STRAIGHT_LINE" }
              as: WarrantyAdmin
              captures: { gold_id: $.data.id }
            - call: "POST /owners"
              payload: { full_name: "Owner One", email: "o1o@x.com" }
              as: WarrantyAdmin
              captures: { o1_id: $.data.id }
            - call: "POST /registrations"
              payload: { product_id: "${prod_id}", serial_number: "SN-OVL", owner_user_id: "${o1_id}", purchase_date: "2024-01-15T00:00:00Z", purchase_price_cents: 50000 }
              as: Owner
              as_user_id: "${o1_id}"
              captures: { reg_id: $.data.id }
            - call: "POST /proofs"
              payload: { registration_id: "${reg_id}", document_type: "RECEIPT", stated_purchase_date: "2024-01-15T00:00:00Z", stated_amount_cents: 50000 }
              as: Owner
              as_user_id: "${o1_id}"
              captures: { proof_id: $.data.id }
            - call: "POST /proofs/${proof_id}/validate"
              payload: {}
              as: WarrantyAdmin
            - call: "POST /extended-warranties"
              payload: { registration_id: "${reg_id}", coverage_tier_id: "${silver_id}", amount_paid_cents: 6000 }
              as: Owner
              as_user_id: "${o1_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2024-07-15T00:00:00Z" }
              as: WarrantyAdmin
          trigger:
            - call: "POST /extended-warranties"
              payload: { registration_id: "${reg_id}", coverage_tier_id: "${gold_id}", amount_paid_cents: 6000 }
              as: Owner
              as_user_id: "${o1_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_COVERAGE_OVERLAP"

      - name: claim_cooldown_buffer_gap_between_claims
        grounds:
          - validations[priority=15]
          - entities.Claim.fields.reported_date
          - state_machines.Claim.INTAKE_to_RMA_ISSUED
        distinguishing_aspect: |
          Closed-buffer interval semantics: a new Claim reported within CLAIM_COOLDOWN_DAYS (=30) of the
          most recent non-CLOSED claim's reported_date is rejected with ERR_CLAIM_COOLDOWN — a buffer-gap
          rule on the Claim timeline (different resource and interval arithmetic than the half-open
          extension overlap).
        test_recipe:
          setup:
            - "Clock 2024-01-15. ELECTRONICS product. BASE tier cap 40000."
            - "Owner O1 ACTIVE validated registration. A MANUFACTURING claim reported 2024-02-01 exists and is INTAKE (non-CLOSED)."
            - "A second claim reported 2024-02-20 sits only 19 days after the first (within the 30-day cooldown)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
