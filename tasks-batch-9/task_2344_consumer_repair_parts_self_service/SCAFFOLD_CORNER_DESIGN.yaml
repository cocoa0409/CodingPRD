      - name: void_on_a_revoked_provider_is_rejected_by_the_credit_conservation_guard
        claim_type: violation_to_error
        grounds:
          - validations[priority=162]
          - calculations.training_credit_conservation
          - state_machines.RepairProvider.transitions[APPLIED | TRAINING_IN_PROGRESS | AUTHORIZED | SUSPENDED -> REVOKED]
        distinguishing_aspect: |
          Voiding normally refunds 2 credits, but once revocation has swept the
          balance into training_credit_forfeited_total the refund would raise the
          identity's left side without a matching grant, so the void is refused
          rather than silently skipped.
        test_recipe:
          setup:
            - "Provider P (technician_count 4, grant 4) with one ACTIVE certification for u_tech_1, AUTHORIZED, then REVOKED — leaving granted 4, balance 0, forfeited 2 and consumed 2."
          setup_api_calls:
            - call: "POST /repair-program/compliance-profiles"
              payload: { region_code: "US-CA", min_parts_availability_years: 7, min_documentation_years: 7, requires_public_manual: false, max_documentation_fee_cents: 2000, allows_pairing_restriction: true, self_service_mandate_tier: "MANDATE_FULL" }
              as: ProgramAdmin
              as_user_id: "u_admin_1"
            - call: "POST /repair-program/repair-providers"
              payload: { legal_name: "Cascade Device Repair", region_code: "US-CA", requested_access_tier: "TIER_2_SAFETY", technician_count: 4 }
              as: ProgramAdmin
              as_user_id: "u_admin_1"
              captures: { provider_id: $.data.id }
            - call: "POST /repair-program/repair-providers/${provider_id}/begin-training"
              payload: { training_credit_grant: 4 }
              as: ProgramAdmin
              as_user_id: "u_admin_1"
            - call: "POST /repair-program/training-certifications"
              payload: { provider_id: "${provider_id}", technician_user_id: "u_tech_1", course_code: "BATTERY_SAFETY_L1", valid_from: "2026-08-01T00:00:00Z", valid_until: "2027-08-01T00:00:00Z", exam_score: 90 }
              as: ProgramAdmin
              as_user_id: "u_admin_1"
              captures: { cert_id: $.data.id }
            - call: "POST /repair-program/repair-providers/${provider_id}/authorization-decision"
              payload: { decision: "AUTHORIZE", decision_reason: "coverage reached", granted_access_tier: "TIER_2_SAFETY" }
              as: ProgramAdmin
              as_user_id: "u_admin_1"
            - call: "POST /repair-program/repair-providers/${provider_id}/authorization-decision"
              payload: { decision: "REVOKE", decision_reason: "falsified service records" }
              as: ProgramAdmin
              as_user_id: "u_admin_1"
              captures: { status: $.data.authorization_status, balance: $.data.training_credit_balance, forfeited: $.data.training_credit_forfeited_total }
          trigger:
            - call: "POST /repair-program/training-certifications/${cert_id}/void"
              payload: { void_reason: "exam integrity review" }
              as: ProgramAdmin
              as_user_id: "u_admin_1"
              captures: { e1: $.data.error_id }
          assert:
            - "${status} == REVOKED, ${balance} == 0 and ${forfeited} == 2"
            - "${e1} == ERR_CREDIT_RESTORE_FORBIDDEN with HTTP 409"
            - "${e1} != ERR_INVALID_STATE_TRANSITION — revocation does not touch certification rows, so the void is blocked by the conservation rule"
            - "certification ${cert_id} is still ACTIVE and no void_reason is recorded"
            - "training_credit_granted_total 4 == balance 0 + forfeited 2 + consumed 2 both before and after the refused void"

