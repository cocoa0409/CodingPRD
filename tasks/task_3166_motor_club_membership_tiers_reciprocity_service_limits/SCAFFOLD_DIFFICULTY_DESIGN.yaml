# =============================================================================
# §1.8 Scaffold Difficulty Design — Test Targeting Index
# Motor Club Membership Tiers, Reciprocity & Service Limits
# 9 Difficulty Rules x 2 instances each = 18 instances
# =============================================================================

scaffold_difficulty_design:
  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: tow_overage_provisional_vs_final_estimate
        grounds:
          - calculations.mileage_overage
          - entities.Dispatch.fields.provisional_mileage_charge_cents
          - state_machines.ServiceCall.REQUESTED_to_DISPATCHED
          - state_machines.Dispatch.ARRIVED_to_COMPLETED
        distinguishing_aspect: |
          Same TOW call produces two different mileage_charge values: the provisional
          variant at dispatch uses requested_tow_miles (30) while the final variant at
          completion uses actual_tow_miles (24); entity domain is member-facing tow
          billing on Dispatch.
        test_recipe:
          setup:
            - "Club NCA ACTIVE, territory [CA], arrival target 45"
            - "Tier CLASSIC: included_tow_miles 5, overage 650 c/mi, cap 4, dues 5000, waiting 3"
            - "Membership M1 (home NCA, CLASSIC) ACTIVE since 2026-09-01 with primary household row"
            - "Provider P1 OWNED under NCA, capabilities [TOW], 24x7"
            - "Call: TOW in CA, requested_tow_miles 30, benefit_eligible"
          setup_api_calls:
            - call: "POST /motor-club/clubs"
              payload: { club_code: "NCA", name: "NorCal Auto", territory_state_codes: ["CA"], default_arrival_target_minutes: 45 }
              as: ClubAdmin
              captures: { club_nca: $.data.id }
            - call: "POST /motor-club/tiers"
              payload: { code: "CLASSIC", annual_dues_cents: 5000, included_tow_miles: 5, annual_call_cap: 4, lockout_benefit_cents: 5500, battery_service_included: false, household_member_price_cents: 2500, overage_rate_cents_per_mile: 650, upgrade_waiting_days: 3, rank: 1 }
              as: ClubAdmin
            - call: "POST /motor-club/memberships"
              payload: { home_club_id: "${club_nca}", primary_member_name: "Pat Primary", primary_member_email: "pat@x.com", tier_code: "CLASSIC" }
              as: MemberServicesRep
              captures: { m1: $.data.id }
            - call: "POST /motor-club/memberships/${m1}/household-members"
              payload: { full_name: "Pat Primary", relationship: "SPOUSE", date_of_birth: "1980-01-01T00:00:00Z", is_primary: true }
              as: MemberServicesRep
              captures: { hm1: $.data.id }
            - call: "POST /motor-club/providers"
              payload: { servicing_club_id: "${club_nca}", name: "NCA Fleet 1", provider_kind: "OWNED", capabilities: ["TOW"], home_base_state_code: "CA", sla_multiplier: 1.0, shift_start_minute: 0, shift_end_minute: 0, max_concurrent_dispatches: 2 }
              as: ClubAdmin
              captures: { p1: $.data.id }
            - call: "POST /motor-club/service-calls"
              payload: { membership_id: "${m1}", requesting_member_id: "${hm1}", service_type: "TOW", breakdown_location_state: "CA", requested_tow_miles: 30 }
              as: Dispatcher
              captures: { c1: $.data.id, c1v: $.data.version }
          trigger:
            - call: "POST /motor-club/service-calls/${c1}/dispatch"
              payload: { expected_service_call_version: "${c1v}" }
              as: Dispatcher
              captures: { d1: $.data.id, d1_prov: $.data.provisional_mileage_charge_cents }
            - call: "POST /motor-club/dispatches/${d1}/accept"
              payload: { en_route: true }
              as: ProviderOps
            - call: "POST /motor-club/dispatches/${d1}/arrive"
              payload: {}
              as: ProviderOps
            - call: "POST /motor-club/dispatches/${d1}/complete"
              payload: { actual_tow_miles: 24 }
              as: ProviderOps
          assert:
            - "Dispatch.${d1}.provisional_mileage_charge_cents == 14300 (requested 30 -> eff 27 -> over 22 x 650)"
            - "Dispatch.${d1}.mileage_charge_cents == 10400 (actual 24 -> eff 21 -> over 16 x 650)"
            - "Dispatch.${d1}.provisional_mileage_charge_cents != Dispatch.${d1}.mileage_charge_cents"
            - "Membership.${m1}.calls_used_current_term == 1"
      - name: interclub_settlement_schedule_vs_actual_basis
        grounds:
          - calculations.interclub_line_amount
          - entities.Club.fields.billing_policy
          - entities.SettlementLine.fields.gross_amount_cents
          - state_machines.ServiceCall.ON_SCENE_to_COMPLETED
        distinguishing_aspect: |
          Same TOW call data (actual 10 miles, no parts) billed to the home club at 8900
          cents under a SCHEDULE-policy servicing club versus 7180 cents under an
          ACTUAL-policy servicing club; entity domain is inter-club settlement on
          SettlementLine, distinct from member-facing tow billing.
        test_recipe:
          setup:
            - "Home club NCA; servicing clubs SCA (SCHEDULE) and SNV (ACTUAL)"
            - "CLASSIC member of NCA breaks down twice: once in CA-south (SCA territory), once in NV (SNV territory)"
            - "Both calls TOW, completed with actual_tow_miles 10 and no parts"
          setup_api_calls:
            - call: "POST /motor-club/clubs"
              payload: { club_code: "NCA", name: "NorCal Auto", territory_state_codes: ["CA"], default_arrival_target_minutes: 45 }
              as: ClubAdmin
              captures: { club_nca: $.data.id }
            - call: "POST /motor-club/clubs"
              payload: { club_code: "SCA", name: "SoCal Auto", territory_state_codes: ["CS"], default_arrival_target_minutes: 45, billing_policy: "SCHEDULE" }
              as: ClubAdmin
              captures: { club_sca: $.data.id }
            - call: "POST /motor-club/clubs"
              payload: { club_code: "SNV", name: "Sierra Nevada", territory_state_codes: ["NV"], default_arrival_target_minutes: 45, billing_policy: "ACTUAL" }
              as: ClubAdmin
              captures: { club_snv: $.data.id }
            - call: "POST /motor-club/tiers"
              payload: { code: "CLASSIC", annual_dues_cents: 5000, included_tow_miles: 5, annual_call_cap: 4, lockout_benefit_cents: 5500, battery_service_included: false, household_member_price_cents: 2500, overage_rate_cents_per_mile: 650, upgrade_waiting_days: 3, rank: 1 }
              as: ClubAdmin
            - call: "POST /motor-club/memberships"
              payload: { home_club_id: "${club_nca}", primary_member_name: "Pat Primary", primary_member_email: "pat@x.com", tier_code: "CLASSIC" }
              as: MemberServicesRep
              captures: { m1: $.data.id }
            - call: "POST /motor-club/memberships/${m1}/household-members"
              payload: { full_name: "Pat Primary", relationship: "SPOUSE", date_of_birth: "1980-01-01T00:00:00Z", is_primary: true }
              as: MemberServicesRep
              captures: { hm1: $.data.id }
            - call: "POST /motor-club/providers"
              payload: { servicing_club_id: "${club_sca}", name: "SCA Fleet", provider_kind: "OWNED", capabilities: ["TOW"], home_base_state_code: "CS", sla_multiplier: 1.0, shift_start_minute: 0, shift_end_minute: 0, max_concurrent_dispatches: 2 }
              as: ClubAdmin
            - call: "POST /motor-club/providers"
              payload: { servicing_club_id: "${club_snv}", name: "SNV Fleet", provider_kind: "OWNED", capabilities: ["TOW"], home_base_state_code: "NV", sla_multiplier: 1.0, shift_start_minute: 0, shift_end_minute: 0, max_concurrent_dispatches: 2 }
              as: ClubAdmin
            - call: "POST /motor-club/service-calls"
              payload: { membership_id: "${m1}", requesting_member_id: "${hm1}", service_type: "TOW", breakdown_location_state: "CS", requested_tow_miles: 10 }
              as: Dispatcher
              captures: { c_south: $.data.id, c_south_v: $.data.version }
            - call: "POST /motor-club/service-calls"
              payload: { membership_id: "${m1}", requesting_member_id: "${hm1}", service_type: "TOW", breakdown_location_state: "NV", requested_tow_miles: 10 }
              as: Dispatcher
              captures: { c_nv: $.data.id, c_nv_v: $.data.version }
            - call: "POST /motor-club/service-calls/${c_south}/dispatch"
              payload: { expected_service_call_version: "${c_south_v}" }
              as: Dispatcher
              captures: { d_south: $.data.id }
            - call: "POST /motor-club/dispatches/${d_south}/accept"
              payload: { en_route: true }
              as: ProviderOps
            - call: "POST /motor-club/dispatches/${d_south}/arrive"
              payload: {}
              as: ProviderOps
            - call: "POST /motor-club/dispatches/${d_south}/complete"
              payload: { actual_tow_miles: 10 }
              as: ProviderOps
            - call: "POST /motor-club/service-calls/${c_nv}/dispatch"
              payload: { expected_service_call_version: "${c_nv_v}" }
              as: Dispatcher
              captures: { d_nv: $.data.id }
            - call: "POST /motor-club/dispatches/${d_nv}/accept"
              payload: { en_route: true }
              as: ProviderOps
            - call: "POST /motor-club/dispatches/${d_nv}/arrive"
              payload: {}
              as: ProviderOps
            - call: "POST /motor-club/dispatches/${d_nv}/complete"
              payload: { actual_tow_miles: 10 }
              as: ProviderOps
          trigger:
            - call: "GET /motor-club/settlement-lines"
              payload: { servicing_club_id: "${club_sca}" }
              as: SettlementClerk
              captures: { line_sched_gross: "$.data[0].gross_amount_cents" }
            - call: "GET /motor-club/settlement-lines"
              payload: { servicing_club_id: "${club_snv}" }
              as: SettlementClerk
              captures: { line_act_gross: "$.data[0].gross_amount_cents" }
          assert:
            - "SCA-serviced line gross_amount_cents == 8900 (CLASSIC TOW schedule) — captured value ${line_sched_gross}"
            - "SNV-serviced line gross_amount_cents == 7180 (5500 + max(0,10-3) x 240 + 0) — captured value ${line_act_gross}"
            - "the two gross amounts differ for identical call data (10 actual miles, no parts)"
            - "both SettlementLine rows have status == PENDING and excluded == false"

  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: upgrade_at_dispatch_tier_mileage_still_bills_overage
        grounds:
          - calculations.mileage_overage
          - calculations.benefit_cap_check
          - state_machines.ServiceCall.REQUESTED_to_DISPATCHED
          - validations[priority=7]
        distinguishing_aspect: |
          Mode (a) combinatorial: the completion charge nests max() twice plus a
          conditional on benefit_tier_code — dispatching 80 miles immediately after an
          upgrade request still bills against the PRE-UPGRADE tier because
          tier_upgrade_effective_at has not passed; inputs (tier, waiting window,
          courtesy bonus, included miles, rate) interact non-linearly.
        test_recipe:
          setup:
            - "NCA club; CLASSIC (incl 5, waiting 3d) and PLUS (incl 100, waiting 3d) tiers"
            - "M1 CLASSIC ACTIVE; upgrade to PLUS requested at 2026-09-01T12:00:00Z (effective 2026-09-04T12:00:00Z)"
            - "Call created AFTER the upgrade request but BEFORE the waiting period ends: is_pre_existing_need true, benefit_tier_code CLASSIC"
          setup_api_calls:
            - call: "POST /motor-club/clubs"
              payload: { club_code: "NCA", name: "NorCal Auto", territory_state_codes: ["CA"], default_arrival_target_minutes: 45 }
              as: ClubAdmin
              captures: { club_nca: $.data.id }
            - call: "POST /motor-club/tiers"
              payload: { code: "CLASSIC", annual_dues_cents: 5000, included_tow_miles: 5, annual_call_cap: 4, lockout_benefit_cents: 5500, battery_service_included: false, household_member_price_cents: 2500, overage_rate_cents_per_mile: 650, upgrade_waiting_days: 3, rank: 1 }
              as: ClubAdmin
            - call: "POST /motor-club/tiers"
              payload: { code: "PLUS", annual_dues_cents: 9000, included_tow_miles: 100, annual_call_cap: 4, lockout_benefit_cents: 6500, battery_service_included: true, household_member_price_cents: 3500, overage_rate_cents_per_mile: 650, upgrade_waiting_days: 3, rank: 2 }
              as: ClubAdmin
            - call: "POST /motor-club/memberships"
              payload: { home_club_id: "${club_nca}", primary_member_name: "Pat Primary", primary_member_email: "pat@x.com", tier_code: "CLASSIC" }
              as: MemberServicesRep
              captures: { m1: $.data.id, m1v: $.data.version }
            - call: "POST /motor-club/memberships/${m1}/household-members"
              payload: { full_name: "Pat Primary", relationship: "SPOUSE", date_of_birth: "1980-01-01T00:00:00Z", is_primary: true }
              as: MemberServicesRep
              captures: { hm1: $.data.id }
            - call: "POST /motor-club/providers"
              payload: { servicing_club_id: "${club_nca}", name: "NCA Fleet 1", provider_kind: "OWNED", capabilities: ["TOW"], home_base_state_code: "CA", sla_multiplier: 1.0, shift_start_minute: 0, shift_end_minute: 0, max_concurrent_dispatches: 2 }
              as: ClubAdmin
            - call: "POST /motor-club/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T12:00:00Z" }
              as: ClubAdmin
            - call: "POST /motor-club/memberships/${m1}/upgrade"
              payload: { target_tier_code: "PLUS", expected_membership_version: "${m1v}" }
              as: MemberServicesRep
            - call: "POST /motor-club/service-calls"
              payload: { membership_id: "${m1}", requesting_member_id: "${hm1}", service_type: "TOW", breakdown_location_state: "CA", requested_tow_miles: 80 }
              as: Dispatcher
              captures: { c1: $.data.id, c1v: $.data.version, c1_tier: $.data.benefit_tier_code, c1_pre: $.data.is_pre_existing_need }
          trigger:
            - call: "POST /motor-club/service-calls/${c1}/dispatch"
              payload: { expected_service_call_version: "${c1v}" }
              as: Dispatcher
              captures: { d1: $.data.id }
            - call: "POST /motor-club/dispatches/${d1}/accept"
              payload: { en_route: true }
              as: ProviderOps
            - call: "POST /motor-club/dispatches/${d1}/arrive"
              payload: {}
              as: ProviderOps
            - call: "POST /motor-club/dispatches/${d1}/complete"
              payload: { actual_tow_miles: 80 }
              as: ProviderOps
          assert:
            - "ServiceCall.${c1}.is_pre_existing_need == true"
            - "ServiceCall.${c1}.benefit_tier_code == CLASSIC (pre-upgrade tier pinned despite membership now PLUS)"
            - "Dispatch.${d1}.mileage_charge_cents == 46800 (eff 77 - incl 5 = 72 x 650, NOT the PLUS 0)"
            - "Membership.${m1}.account_credit_cents decreased by 46800 from the completion debit"
      - name: settlement_assessment_per_line_rounding_beats_sum_first
        grounds:
          - calculations.settlement_assessment
          - state_machines.SettlementPeriod.CLOSED_to_ASSESSED
          - entities.SettlementLine.fields.assessed_fee_cents
        distinguishing_aspect: |
          Mode (b) nested rounding: with gross amounts 8900 and 6200 the pinned
          per-line rounding yields fees 401 + 279 = 680, while the forbidden
          sum-first order would yield round(15100 x 0.045) = 680 — the pinned fixture
          uses 8900 + 6200 + 4100 where per-line gives 401 + 279 + 185 = 865 vs
          sum-first round(19200 x 0.045) = 864, so the orders observably differ by 1 cent.
        test_recipe:
          setup:
            - "Foreign member of NCA completes three benefit-eligible calls serviced by SCA (SCHEDULE): TOW (8900), BATTERY (6200), FUEL (4100)"
            - "Settlement period for SCA covering the completions, closed after period end"
          setup_api_calls:
            - call: "POST /motor-club/clubs"
              payload: { club_code: "NCA", name: "NorCal Auto", territory_state_codes: ["CA"], default_arrival_target_minutes: 45 }
              as: ClubAdmin
              captures: { club_nca: $.data.id }
            - call: "POST /motor-club/clubs"
              payload: { club_code: "SCA", name: "SoCal Auto", territory_state_codes: ["CS"], default_arrival_target_minutes: 45, billing_policy: "SCHEDULE" }
              as: ClubAdmin
              captures: { club_sca: $.data.id }
            - call: "POST /motor-club/tiers"
              payload: { code: "CLASSIC", annual_dues_cents: 5000, included_tow_miles: 5, annual_call_cap: 6, lockout_benefit_cents: 5500, battery_service_included: false, household_member_price_cents: 2500, overage_rate_cents_per_mile: 650, upgrade_waiting_days: 3, rank: 1 }
              as: ClubAdmin
            - call: "POST /motor-club/memberships"
              payload: { home_club_id: "${club_nca}", primary_member_name: "Pat Primary", primary_member_email: "pat@x.com", tier_code: "CLASSIC" }
              as: MemberServicesRep
              captures: { m1: $.data.id }
            - call: "POST /motor-club/memberships/${m1}/household-members"
              payload: { full_name: "Pat Primary", relationship: "SPOUSE", date_of_birth: "1980-01-01T00:00:00Z", is_primary: true }
              as: MemberServicesRep
              captures: { hm1: $.data.id }
            - call: "POST /motor-club/providers"
              payload: { servicing_club_id: "${club_sca}", name: "SCA Fleet", provider_kind: "OWNED", capabilities: ["TOW", "BATTERY", "FUEL"], home_base_state_code: "CS", sla_multiplier: 1.0, shift_start_minute: 0, shift_end_minute: 0, max_concurrent_dispatches: 3 }
              as: ClubAdmin
            - call: "POST /motor-club/service-calls"
              payload: { membership_id: "${m1}", requesting_member_id: "${hm1}", service_type: "TOW", breakdown_location_state: "CS", requested_tow_miles: 10 }
              as: Dispatcher
              captures: { c1: $.data.id, c1v: $.data.version }
            - call: "POST /motor-club/service-calls/${c1}/dispatch"
              payload: { expected_service_call_version: "${c1v}" }
              as: Dispatcher
              captures: { d1: $.data.id }
            - call: "POST /motor-club/dispatches/${d1}/accept"
              payload: { en_route: true }
              as: ProviderOps
            - call: "POST /motor-club/dispatches/${d1}/arrive"
              payload: {}
              as: ProviderOps
            - call: "POST /motor-club/dispatches/${d1}/complete"
              payload: { actual_tow_miles: 10 }
              as: ProviderOps
            - call: "POST /motor-club/service-calls"
              payload: { membership_id: "${m1}", requesting_member_id: "${hm1}", service_type: "BATTERY", breakdown_location_state: "CS" }
              as: Dispatcher
              captures: { c2: $.data.id, c2v: $.data.version }
            - call: "POST /motor-club/service-calls/${c2}/dispatch"
              payload: { expected_service_call_version: "${c2v}" }
              as: Dispatcher
              captures: { d2: $.data.id }
            - call: "POST /motor-club/dispatches/${d2}/accept"
              payload: { en_route: true }
              as: ProviderOps
            - call: "POST /motor-club/dispatches/${d2}/arrive"
              payload: {}
              as: ProviderOps
            - call: "POST /motor-club/dispatches/${d2}/complete"
              payload: {}
              as: ProviderOps
            - call: "POST /motor-club/service-calls"
              payload: { membership_id: "${m1}", requesting_member_id: "${hm1}", service_type: "FUEL", breakdown_location_state: "CS" }
              as: Dispatcher
              captures: { c3: $.data.id, c3v: $.data.version }
            - call: "POST /motor-club/service-calls/${c3}/dispatch"
              payload: { expected_service_call_version: "${c3v}" }
              as: Dispatcher
              captures: { d3: $.data.id }
            - call: "POST /motor-club/dispatches/${d3}/accept"
              payload: { en_route: true }
              as: ProviderOps
            - call: "POST /motor-club/dispatches/${d3}/arrive"
              payload: {}
              as: ProviderOps
            - call: "POST /motor-club/dispatches/${d3}/complete"
              payload: {}
              as: ProviderOps
            - call: "POST /motor-club/settlement-periods"
              payload: { servicing_club_id: "${club_sca}", period_start_date: "2026-09-01T00:00:00Z", period_end_date: "2026-10-01T00:00:00Z" }
              as: SettlementClerk
              captures: { sp1: $.data.id }
            - call: "POST /motor-club/_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-01T00:00:00Z" }
              as: ClubAdmin
            - call: "POST /motor-club/settlement-periods/${sp1}/close"
              payload: {}
              as: SettlementClerk
              as_user_id: "clerk-1"
          trigger:
            - call: "POST /motor-club/settlement-periods/${sp1}/assess"
              payload: {}
              as: FederationFinance
              as_user_id: "fin-9"
            - call: "GET /motor-club/settlement-periods/${sp1}/settlementLines"
              payload: {}
              as: FederationFinance
              captures: { fee0: "$.data[0].assessed_fee_cents", fee1: "$.data[1].assessed_fee_cents", fee2: "$.data[2].assessed_fee_cents" }
          assert:
            - "SettlementPeriod.${sp1}.total_gross_cents == 19200"
            - "per-line assessed fees are 401, 279, 185 (round_half_up of 8900x0.045, 6200x0.045, 4100x0.045)"
            - "sum of per-line fees == 865, which differs from sum-first round(19200 x 0.045) == 864"
            - "each SettlementLine.status == ASSESSED and assessed_net_cents == gross - fee"

  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: service_call_redispatch_cycle
        grounds:
          - state_machines.ServiceCall.DISPATCHED_to_REQUESTED
          - state_machines.Dispatch.ASSIGNED_to_FAILED
          - calculations.dispatch_provider_selection
        distinguishing_aspect: |
          ServiceCall exhibits a cycle DISPATCHED -> REQUESTED -> DISPATCHED driven by
          dispatch failure; on the second pass the failed provider is excluded and the
          next dispatch carries sequence_number 2 — non-linear shape on ServiceCall.
        test_recipe:
          setup:
            - "NCA club with two OWNED TOW providers P1 (created first) and P2"
            - "ACTIVE CLASSIC membership with a TOW call in CA"
          setup_api_calls:
            - call: "POST /motor-club/clubs"
              payload: { club_code: "NCA", name: "NorCal Auto", territory_state_codes: ["CA"], default_arrival_target_minutes: 45 }
              as: ClubAdmin
              captures: { club_nca: $.data.id }
            - call: "POST /motor-club/tiers"
              payload: { code: "CLASSIC", annual_dues_cents: 5000, included_tow_miles: 5, annual_call_cap: 4, lockout_benefit_cents: 5500, battery_service_included: false, household_member_price_cents: 2500, overage_rate_cents_per_mile: 650, upgrade_waiting_days: 3, rank: 1 }
              as: ClubAdmin
            - call: "POST /motor-club/memberships"
              payload: { home_club_id: "${club_nca}", primary_member_name: "Pat Primary", primary_member_email: "pat@x.com", tier_code: "CLASSIC" }
              as: MemberServicesRep
              captures: { m1: $.data.id }
            - call: "POST /motor-club/memberships/${m1}/household-members"
              payload: { full_name: "Pat Primary", relationship: "SPOUSE", date_of_birth: "1980-01-01T00:00:00Z", is_primary: true }
              as: MemberServicesRep
              captures: { hm1: $.data.id }
            - call: "POST /motor-club/providers"
              payload: { servicing_club_id: "${club_nca}", name: "NCA Fleet 1", provider_kind: "OWNED", capabilities: ["TOW"], home_base_state_code: "CA", sla_multiplier: 1.0, shift_start_minute: 0, shift_end_minute: 0, max_concurrent_dispatches: 2 }
              as: ClubAdmin
              captures: { p1: $.data.id }
            - call: "POST /motor-club/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:01:00Z" }
              as: ClubAdmin
            - call: "POST /motor-club/providers"
              payload: { servicing_club_id: "${club_nca}", name: "NCA Fleet 2", provider_kind: "OWNED", capabilities: ["TOW"], home_base_state_code: "CA", sla_multiplier: 1.0, shift_start_minute: 0, shift_end_minute: 0, max_concurrent_dispatches: 2 }
              as: ClubAdmin
              captures: { p2: $.data.id }
            - call: "POST /motor-club/service-calls"
              payload: { membership_id: "${m1}", requesting_member_id: "${hm1}", service_type: "TOW", breakdown_location_state: "CA", requested_tow_miles: 10 }
              as: Dispatcher
              captures: { c1: $.data.id, c1v: $.data.version }
            - call: "POST /motor-club/service-calls/${c1}/dispatch"
              payload: { expected_service_call_version: "${c1v}" }
              as: Dispatcher
              captures: { d1: $.data.id, d1_provider: $.data.provider_id, c1v2: $.data.version }
            - call: "POST /motor-club/dispatches/${d1}/fail"
              payload: { failure_reason: "PROVIDER_DECLINED" }
              as: ProviderOps
          trigger:
            - call: "GET /motor-club/service-calls/${c1}"
              payload: {}
              as: Dispatcher
              captures: { c1v3: $.data.version, c1_status: $.data.status }
            - call: "POST /motor-club/service-calls/${c1}/dispatch"
              payload: { expected_service_call_version: "${c1v3}" }
              as: Dispatcher
              captures: { d2: $.data.id, d2_provider: $.data.provider_id, d2_seq: $.data.sequence_number }
          assert:
            - "ServiceCall.${c1}.status returned to REQUESTED after the fail"
            - "Dispatch.${d2}.sequence_number == 2"
            - "Dispatch.${d2}.provider_id == ${p2} (failed provider ${p1} excluded from the immediate retry pool)"
            - "ServiceCall remains benefit_eligible and calls_used_current_term still 0 (no consumption until completion)"
      - name: membership_lapse_reinstate_cycle
        grounds:
          - state_machines.Membership.LAPSED_to_REINSTATED
          - state_machines.Membership.REINSTATED_to_ACTIVE
          - state_machines.Membership.ACTIVE_to_GRACE
          - calculations.benefit_cap_check
        distinguishing_aspect: |
          Membership cycles ACTIVE -> LAPSED -> REINSTATED -> (renew) -> ACTIVE and can
          loop again through GRACE/LAPSED at the next term end; reinstatement resets the
          term window and the call counter — non-linear cyclic shape on Membership,
          distinct from ServiceCall's redispatch cycle.
        test_recipe:
          setup:
            - "CLASSIC membership M1 created 2026-09-01 (term ends 2027-09-01); administratively lapsed 2026-10-01"
          setup_api_calls:
            - call: "POST /motor-club/clubs"
              payload: { club_code: "NCA", name: "NorCal Auto", territory_state_codes: ["CA"], default_arrival_target_minutes: 45 }
              as: ClubAdmin
              captures: { club_nca: $.data.id }
            - call: "POST /motor-club/tiers"
              payload: { code: "CLASSIC", annual_dues_cents: 5000, included_tow_miles: 5, annual_call_cap: 4, lockout_benefit_cents: 5500, battery_service_included: false, household_member_price_cents: 2500, overage_rate_cents_per_mile: 650, upgrade_waiting_days: 3, rank: 1 }
              as: ClubAdmin
            - call: "POST /motor-club/memberships"
              payload: { home_club_id: "${club_nca}", primary_member_name: "Pat Primary", primary_member_email: "pat@x.com", tier_code: "CLASSIC" }
              as: MemberServicesRep
              captures: { m1: $.data.id }
            - call: "POST /motor-club/_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-01T00:00:00Z" }
              as: ClubAdmin
            - call: "POST /motor-club/memberships/${m1}/lapse"
              payload: {}
              as: MemberServicesRep
          trigger:
            - call: "POST /motor-club/memberships/${m1}/reinstate"
              payload: { dues_paid: true }
              as: MemberServicesRep
              captures: { m1_status: $.data.status, m1_term_start: $.data.term_start_date, m1_rein: $.data.reinstatement_count, m1_calls: $.data.calls_used_current_term }
            - call: "POST /motor-club/memberships/${m1}/renew"
              payload: {}
              as: MemberServicesRep
              captures: { m1_status2: $.data.status }
          assert:
            - "reinstate response status == REINSTATED, reinstatement_count == 1, calls_used_current_term == 0"
            - "reinstate response term_start_date == 2026-10-01T00:00:00Z (new term from reinstatement, not old schedule)"
            - "renew from REINSTATED succeeds and returns status == ACTIVE"
            - "GET /motor-club/memberships/${m1}/membershipEvents contains event_type sequence ENROLLMENT, LAPSE, REINSTATEMENT, RENEWAL in that order"

  # ---------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: foreign_completion_cascades_to_settlement
        grounds:
          - state_machines.ServiceCall.ON_SCENE_to_COMPLETED
          - state_machines.SettlementPeriod.OPEN_to_CLOSED
          - state_machines.SettlementLine.PENDING_to_SWEPT
          - state_machines.SettlementLine.SWEPT_to_ASSESSED
          - calculations.settlement_sweep
          - calculations.settlement_assessment
        distinguishing_aspect: |
          Depth-4 cascade from one trigger (dispatch complete): completion creates a
          SettlementLine (hop 1); the line's PENDING existence feeds the period close
          sweep which mutates line -> SWEPT and period totals (hop 2); the period
          becoming CLOSED enables assess (hop 3) which mutates each swept line to
          ASSESSED with fees (hop 4). Each link is caused by the previous link's state
          change, not by the original completion.
        test_recipe:
          setup:
            - "Home club NCA member completes a foreign TOW call serviced by SCA (SCHEDULE basis)"
            - "Settlement period for SCA is OPEN covering the completion time"
          setup_api_calls:
            - call: "POST /motor-club/clubs"
              payload: { club_code: "NCA", name: "NorCal Auto", territory_state_codes: ["CA"], default_arrival_target_minutes: 45 }
              as: ClubAdmin
              captures: { club_nca: $.data.id }
            - call: "POST /motor-club/clubs"
              payload: { club_code: "SCA", name: "SoCal Auto", territory_state_codes: ["CS"], default_arrival_target_minutes: 45, billing_policy: "SCHEDULE" }
              as: ClubAdmin
              captures: { club_sca: $.data.id }
            - call: "POST /motor-club/tiers"
              payload: { code: "CLASSIC", annual_dues_cents: 5000, included_tow_miles: 5, annual_call_cap: 4, lockout_benefit_cents: 5500, battery_service_included: false, household_member_price_cents: 2500, overage_rate_cents_per_mile: 650, upgrade_waiting_days: 3, rank: 1 }
              as: ClubAdmin
            - call: "POST /motor-club/memberships"
              payload: { home_club_id: "${club_nca}", primary_member_name: "Pat Primary", primary_member_email: "pat@x.com", tier_code: "CLASSIC" }
              as: MemberServicesRep
              captures: { m1: $.data.id }
            - call: "POST /motor-club/memberships/${m1}/household-members"
              payload: { full_name: "Pat Primary", relationship: "SPOUSE", date_of_birth: "1980-01-01T00:00:00Z", is_primary: true }
              as: MemberServicesRep
              captures: { hm1: $.data.id }
            - call: "POST /motor-club/providers"
              payload: { servicing_club_id: "${club_sca}", name: "SCA Fleet", provider_kind: "OWNED", capabilities: ["TOW"], home_base_state_code: "CS", sla_multiplier: 1.0, shift_start_minute: 0, shift_end_minute: 0, max_concurrent_dispatches: 2 }
              as: ClubAdmin
            - call: "POST /motor-club/service-calls"
              payload: { membership_id: "${m1}", requesting_member_id: "${hm1}", service_type: "TOW", breakdown_location_state: "CS", requested_tow_miles: 10 }
              as: Dispatcher
              captures: { c1: $.data.id, c1v: $.data.version }
            - call: "POST /motor-club/service-calls/${c1}/dispatch"
              payload: { expected_service_call_version: "${c1v}" }
              as: Dispatcher
              captures: { d1: $.data.id }
            - call: "POST /motor-club/dispatches/${d1}/accept"
              payload: { en_route: true }
              as: ProviderOps
            - call: "POST /motor-club/dispatches/${d1}/arrive"
              payload: {}
              as: ProviderOps
            - call: "POST /motor-club/settlement-periods"
              payload: { servicing_club_id: "${club_sca}", period_start_date: "2026-09-01T00:00:00Z", period_end_date: "2026-10-01T00:00:00Z" }
              as: SettlementClerk
              captures: { sp1: $.data.id }
          trigger:
            - call: "POST /motor-club/dispatches/${d1}/complete"
              payload: { actual_tow_miles: 10 }
              as: ProviderOps
            - call: "GET /motor-club/settlement-lines"
              payload: {}
              as: SettlementClerk
              captures: { ln1: "$.data[0].id", ln1_status: "$.data[0].status" }
            - call: "POST /motor-club/_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-01T00:00:00Z" }
              as: ClubAdmin
            - call: "POST /motor-club/settlement-periods/${sp1}/close"
              payload: {}
              as: SettlementClerk
              as_user_id: "clerk-1"
              captures: { sp1_count: $.data.total_foreign_call_count, sp1_gross: $.data.total_gross_cents }
            - call: "POST /motor-club/settlement-periods/${sp1}/assess"
              payload: {}
              as: FederationFinance
              as_user_id: "fin-9"
            - call: "GET /motor-club/settlement-lines/${ln1}"
              payload: {}
              as: FederationFinance
              captures: { ln1_final_status: $.data.status, ln1_fee: $.data.assessed_fee_cents }
          assert:
            - "after complete: SettlementLine.${ln1}.status == PENDING with gross_amount_cents == 8900 and servicing_club_id == ${club_sca}"
            - "close response total_foreign_call_count == 1 and total_gross_cents == 8900 (sweep caused by the PENDING line)"
            - "after assess: SettlementLine.${ln1}.status == ASSESSED, assessed_fee_cents == 401, assessed_net_cents == 8499"
            - "SettlementPeriod.${sp1}.status == ASSESSED"
      - name: membership_cancel_cascades_household_and_ancillary
        grounds:
          - state_machines.Membership.ACTIVE_to_CANCELLED
          - state_machines.HouseholdMember.ACTIVE_to_REMOVED
          - state_machines.AncillarySale.ACTIVE_to_REFUNDED
          - calculations.ancillary_refund
          - calculations.household_proration
        distinguishing_aspect: |
          Depth-2 conditional cascade from membership cancel: cancel -> household
          members REMOVED and ancillary sales REFUNDED (hop 1, fan-out), and each
          refund/removal itself posts a credit that mutates Membership
          account_credit_cents (hop 2, caused by the child mutation not the cancel).
          Originating trigger differs from the settlement cascade.
        test_recipe:
          setup:
            - "M1 ACTIVE CLASSIC with one extra household member (added at enrollment day, 365 remaining days -> removal credit 2500) and one ACTIVE ancillary sale priced 12000 (commission 1000 bps)"
            - "Note: cascade removal of the extra member posts household_proration credit computed at cancel time"
          setup_api_calls:
            - call: "POST /motor-club/clubs"
              payload: { club_code: "NCA", name: "NorCal Auto", territory_state_codes: ["CA"], default_arrival_target_minutes: 45 }
              as: ClubAdmin
              captures: { club_nca: $.data.id }
            - call: "POST /motor-club/tiers"
              payload: { code: "CLASSIC", annual_dues_cents: 5000, included_tow_miles: 5, annual_call_cap: 4, lockout_benefit_cents: 5500, battery_service_included: false, household_member_price_cents: 2500, overage_rate_cents_per_mile: 650, upgrade_waiting_days: 3, rank: 1 }
              as: ClubAdmin
            - call: "POST /motor-club/memberships"
              payload: { home_club_id: "${club_nca}", primary_member_name: "Pat Primary", primary_member_email: "pat@x.com", tier_code: "CLASSIC" }
              as: MemberServicesRep
              captures: { m1: $.data.id }
            - call: "POST /motor-club/memberships/${m1}/household-members"
              payload: { full_name: "Pat Primary", relationship: "SPOUSE", date_of_birth: "1980-01-01T00:00:00Z", is_primary: true }
              as: MemberServicesRep
              captures: { hm1: $.data.id }
            - call: "POST /motor-club/memberships/${m1}/household-members"
              payload: { full_name: "Sam Spouse", relationship: "SPOUSE", date_of_birth: "1982-01-01T00:00:00Z" }
              as: MemberServicesRep
              captures: { hm2: $.data.id }
            - call: "POST /motor-club/ancillary-products"
              payload: { product_type: "IDENTITY_PROTECTION", name: "ID Shield", price_cents: 12000, min_tier_code: "CLASSIC", commission_bps: 1000 }
              as: ClubAdmin
              captures: { prod1: $.data.id }
            - call: "POST /motor-club/ancillary-sales"
              payload: { membership_id: "${m1}", product_id: "${prod1}" }
              as: Agent
              as_user_id: "agent-1"
              captures: { sale1: $.data.id }
          trigger:
            - call: "POST /motor-club/memberships/${m1}/cancel"
              payload: {}
              as: MemberServicesRep
              captures: { m1_credit: $.data.account_credit_cents }
            - call: "GET /motor-club/household-members/${hm2}"
              payload: {}
              as: MemberServicesRep
              captures: { hm2_status: $.data.status }
            - call: "GET /motor-club/ancillary-sales/${sale1}"
              payload: {}
              as: MemberServicesRep
              captures: { sale1_status: $.data.status }
          assert:
            - "Membership.${m1}.status == CANCELLED"
            - "HouseholdMember.${hm2}.status == REMOVED (cascade)"
            - "AncillarySale.${sale1}.status == REFUNDED (cascade)"
            - "Membership.${m1}.account_credit_cents == 0: -2500 (extra member add) - 12000 (sale) + 12000 (refund cascade) + 2500 (removal proration at 365 remaining days)"

