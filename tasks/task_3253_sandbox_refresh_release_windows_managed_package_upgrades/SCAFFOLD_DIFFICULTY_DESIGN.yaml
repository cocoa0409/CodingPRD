              as: PlatformAdmin
              captures: { env_fc_id: $.data.id }
            - call: "POST /platform/refresh-jobs"
              payload: { environment_id: "${env_fc_id}", partition: "FULL", masked_field_count: 19 }
              as: EnvironmentAdmin
              captures: { rj_fc19_id: $.data.id }
            - call: "POST /platform/refresh-jobs"
              payload: { environment_id: "${env_fc_id}", partition: "FULL", masked_field_count: 20 }
              as: EnvironmentAdmin
              captures: { rj_fc20_id: $.data.id }
          trigger:
            - call: "POST /platform/refresh-jobs/${rj_fc19_id}/complete-masking"
              payload: {}
              as: EnvironmentAdmin
              captures: { err_masking: $.data.error_id }
            - call: "POST /platform/refresh-jobs/${rj_fc20_id}/complete-masking"
              payload: {}
              as: EnvironmentAdmin
          assert:
            - "the 19-field refresh returns error_id ERR_MASKING_INSUFFICIENT with http 422 and RefreshJob.${rj_fc19_id}.status stays PENDING"
            - "the 20-field refresh returns RefreshJob.${rj_fc20_id}.status == MASKING"
            - "RefreshJob.${rj_fc20_id}.consumed_aperture == false"

  # ---------------------------------------------------------------------------
  - rule_id: cross_entity_state_dependency
    instances:
      - name: schedule_release_requires_target_version_advance
        grounds:
          - state_machines.Environment.CONFIG_to_SCHEDULED
          - entities.Environment.fields.applied_release_version
          - validations[priority=6]
          - endpoints.POST_/platform/environments/{id}/schedule-release
        distinguishing_aspect: "Environment's release axis is gated by its own applied_release_version read back from the release rail: scheduling onto the version already applied is refused, so the CONFIG->SCHEDULED transition depends on a different field's value than the one it writes."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. One DEVELOPER sandbox already released onto SU26 and then reopened to CONFIG."
          setup_api_calls:
            - call: "POST /platform/environments"
              payload: { name: "Gate Env", type: "DEVELOPER", aperture_limit: 5 }
              as: PlatformAdmin
              captures: { env_gate_id: $.data.id }
            - call: "POST /platform/environments/${env_gate_id}/schedule-release"
              payload: { target_release_version: "SU26" }
              as: ReleaseManager
            - call: "POST /platform/environments/${env_gate_id}/apply-release"
              payload: {}
              as: ReleaseManager
            - call: "POST /platform/environments/${env_gate_id}/open-release-window"
              payload: {}
              as: ReleaseManager
          trigger:
            - call: "POST /platform/environments/${env_gate_id}/schedule-release"
              payload: { target_release_version: "SU26" }
              as: ReleaseManager
              captures: { err_gate: $.data.error_id }
          assert:
            - "Environment.${env_gate_id}.release_status == CONFIG and applied_release_version == \"SU26\""
            - "scheduling onto SU26 returns error_id ERR_INVALID_REQUEST with http 400"
            - "Environment.${env_gate_id}.release_status remains CONFIG"

      - name: upgrade_gated_by_sibling_installation_floor
        grounds:
          - state_machines.InstalledPackage.NEEDS_UPGRADE_to_UPGRADED
          - entities.PackageVersion.fields.requires_namespace
          - validations[priority=9]
          - endpoints.POST_/platform/installed-packages/{id}/upgrade
        distinguishing_aspect: "A different entity pair — InstalledPackage's upgrade depends on the sibling InstalledPackage of the required namespace in the same environment: with acme-core absent, promoting acme-ui is refused with ERR_PACKAGE_DEPENDENCY_UNMET, and installing acme-core afterwards makes the identical upgrade succeed."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. One PARTIAL sandbox with acme-core 1 required by acme-ui 2."
          setup_api_calls:
            - call: "POST /platform/package-versions"
              payload: { namespace: "acme", major_version: 1, name: "Acme Core 1" }
              as: PlatformAdmin
              captures: { pv_e1_id: $.data.id }
            - call: "POST /platform/package-versions"
              payload: { namespace: "ui", major_version: 1, name: "Acme UI 1" }
              as: PlatformAdmin
              captures: { pv_e2_id: $.data.id }
            - call: "POST /platform/package-versions"
              payload: { namespace: "ui", major_version: 2, name: "Acme UI 2", supersedes_version_id: "${pv_e2_id}", requires_namespace: "acme", requires_min_version_id: "${pv_e1_id}" }
              as: PlatformAdmin
              captures: { pv_e3_id: $.data.id }
            - call: "POST /platform/environments"
              payload: { name: "Dep Sandbox", type: "PARTIAL", aperture_limit: 5 }
              as: PlatformAdmin
              captures: { env_dep_id: $.data.id, env_dep_v: $.data.version }
            - call: "POST /platform/environments/${env_dep_id}/package-installations"
              payload: { package_version_id: "${pv_e2_id}", expected_environment_version: "${env_dep_v}" }
              as: ReleaseManager
              captures: { pkg_dep_id: $.data.id }
          trigger:
            - call: "POST /platform/installed-packages/${pkg_dep_id}/upgrade"
              payload: { target_package_version_id: "${pv_e3_id}" }
              as: ReleaseManager
              captures: { err_dep: $.data.error_id }
            - call: "POST /platform/environments/${env_dep_id}/package-installations"
              payload: { package_version_id: "${pv_e1_id}", expected_environment_version: "${env_dep_v}" }
              as: ReleaseManager
              captures: { pkg_core_id: $.data.id }
            - call: "POST /platform/installed-packages/${pkg_dep_id}/upgrade"
              payload: { target_package_version_id: "${pv_e3_id}" }
              as: ReleaseManager
          assert:
            - "while acme-core is absent the upgrade returns error_id ERR_PACKAGE_DEPENDENCY_UNMET with http 422"
            - "InstalledPackage.${pkg_dep_id}.status stays NEEDS_UPGRADE after the refusal"
            - "after acme-core 1 is installed the same upgrade returns InstalledPackage.${pkg_dep_id}.status == UPGRADED and package_version_id == \"${pv_e3_id}\""

  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: archive_window_inclusive_boundary
        grounds:
          - validations[priority=13]
          - calculations.storage_breach_evaluation
          - entities.StorageLedger.fields.rank_index
          - endpoints.POST_/platform/environments/{id}/storage/archive
        distinguishing_aspect: "Interval semantics by inclusive rank boundary: the window [1, 3] over three FILE ledgers is admitted while [1, 4] over the same resource is refused, so the test pins that both ends of the window are closed rather than half-open."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. One DEVELOPER sandbox released onto SP26 with four ledgers at rank_index 1 to 4."
          setup_api_calls:
            - call: "POST /platform/environments"
              payload: { name: "Window Env", type: "DEVELOPER", storage_cap_bytes: 104857600, aperture_limit: 5 }
              as: PlatformAdmin
              captures: { env_win_id: $.data.id }
            - call: "POST /platform/environments/${env_win_id}/storage-ledgers"
              payload: { kind: "FILE", bytes: 1048576, rank_index: 1 }
              as: StorageArchivist
              captures: { w1_id: $.data.id }
            - call: "POST /platform/environments/${env_win_id}/storage-ledgers"
              payload: { kind: "FILE", bytes: 1048576, rank_index: 2 }
              as: StorageArchivist
              captures: { w2_id: $.data.id }
            - call: "POST /platform/environments/${env_win_id}/storage-ledgers"
              payload: { kind: "FILE", bytes: 1048576, rank_index: 3 }
              as: StorageArchivist
              captures: { w3_id: $.data.id }
            - call: "POST /platform/environments/${env_win_id}/storage-ledgers"
              payload: { kind: "FILE", bytes: 1048576, rank_index: 4 }
              as: StorageArchivist
              captures: { w4_id: $.data.id }
            - call: "POST /platform/environments/${env_win_id}/schedule-release"
              payload: { target_release_version: "SP26" }
              as: ReleaseManager
            - call: "POST /platform/environments/${env_win_id}/apply-release"
              payload: {}
              as: ReleaseManager
          trigger:
            - call: "POST /platform/environments/${env_win_id}/storage/archive"
              payload: { from_rank: 1, to_rank: 4 }
              as: StorageArchivist
              captures: { err_win: $.data.error_id }
            - call: "POST /platform/environments/${env_win_id}/storage/archive"
              payload: { from_rank: 1, to_rank: 3 }
              as: StorageArchivist
          assert:
            - "the [1,4] window returns error_id ERR_ARCHIVE_BATCH_EXCEEDED with http 422"
            - "StorageLedger.${w4_id}.status remains LIVE after the refusal"
            - "the [1,3] window succeeds and StorageLedger.${w1_id}.status, ${w2_id}.status and ${w3_id}.status are all ARCHIVED"
            - "the [1,3] window moves exactly 3145728 bytes and Environment.${env_win_id}.storage_archived_bytes == 3145728"

      - name: direct_child_refresh_aperture_rollup_no_buffer
        grounds:
          - calculations.aperture_consumption_evaluation
          - state_machines.RefreshJob.COMPLETING_to_COMPLETED
          - entities.Environment.fields.parent_environment_id
          - entities.Environment.fields.aperture_used
        distinguishing_aspect: "A second interval rule with different arithmetic: adjacent refresh admissions on the same environment are counted with no buffer between them, so two completions differ by exactly the declared refresh_interval_days with no cooldown added, and the aperture roll-up treats a blocked parent clone as still consuming its child's slot."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. A level-2 sandbox with refresh_interval_days 10 and aperture_limit 3."
          setup_api_calls:
            - call: "POST /platform/environments"
              payload: { name: "Adjacency Parent", type: "DEVELOPER", aperture_limit: 5 }
              as: PlatformAdmin
              captures: { env_j1_id: $.data.id }
            - call: "POST /platform/environments"
              payload: { name: "Adjacency Sandbox", type: "DEVELOPER", parent_environment_id: "${env_j1_id}", refresh_interval_days: 10, aperture_limit: 3 }
              as: PlatformAdmin
              captures: { env_j2_id: $.data.id }
            - call: "POST /platform/refresh-jobs"
              payload: { environment_id: "${env_j2_id}", partition: "ACCOUNT_PARTIAL", masked_field_count: 2 }
              as: EnvironmentAdmin
              captures: { rj_j1_id: $.data.id }
            - call: "POST /platform/refresh-jobs/${rj_j1_id}/complete-masking"
              payload: {}
              as: EnvironmentAdmin
            - call: "POST /platform/refresh-jobs/${rj_j1_id}/complete-refresh"
              payload: {}
              as: EnvironmentAdmin
            - call: "POST /platform/refresh-jobs"
              payload: { environment_id: "${env_j2_id}", partition: "ACCOUNT_PARTIAL", masked_field_count: 2 }
              as: EnvironmentAdmin
              captures: { rj_j2_id: $.data.id }
            - call: "POST /platform/refresh-jobs/${rj_j2_id}/complete-masking"
              payload: {}
              as: EnvironmentAdmin
          trigger:
            - call: "POST /platform/refresh-jobs/${rj_j2_id}/complete-refresh"
              payload: {}
              as: EnvironmentAdmin
            - call: "GET /platform/environments/${env_j2_id}/refresh-jobs"
              payload: {}
              as: EnvironmentAdmin
          assert:
            - "Environment.${env_j2_id}.aperture_used == 2 and aperture_limit == 3"
            - "Environment.${env_j2_id}.next_refresh_at == 2026-09-21T00:00:00Z, exactly ten days after the second completion with no cooldown added"
            - "both RefreshJob rows are COMPLETED and both carry consumed_aperture == true"
            - "Environment.${env_j1_id}.aperture_used == 0, so the parent clone consumes no child aperture"

  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: storage_total_conserved_across_archive_and_restore
        grounds:
          - state_machines.StorageLedger.LIVE_to_ARCHIVED
          - state_machines.StorageLedger.ARCHIVED_to_LIVE
          - entities.Environment.fields.storage_total_bytes
          - endpoints.POST_/platform/storage-ledgers/{id}/restore
        distinguishing_aspect: "A byte-conservation invariant: archive then restore of the same ledger returns Environment.storage_total_bytes to its pre-archive value exactly, so no byte is created or destroyed by the compensating pair even though storage_used_bytes moves twice."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. One DEVELOPER sandbox released onto SU26 with two FILE ledgers."
          setup_api_calls:
            - call: "POST /platform/environments"
              payload: { name: "Conserve Env", type: "DEVELOPER", storage_cap_bytes: 104857600, aperture_limit: 5 }
              as: PlatformAdmin
              captures: { env_con_id: $.data.id }
            - call: "POST /platform/environments/${env_con_id}/storage-ledgers"
              payload: { kind: "FILE", bytes: 4194304, rank_index: 1 }
              as: StorageArchivist
              captures: { sc_a_id: $.data.id }
            - call: "POST /platform/environments/${env_con_id}/storage-ledgers"
              payload: { kind: "FILE", bytes: 2097152, rank_index: 2 }
              as: StorageArchivist
              captures: { sc_b_id: $.data.id }
            - call: "POST /platform/environments/${env_con_id}/schedule-release"
              payload: { target_release_version: "SU26" }
              as: ReleaseManager
            - call: "POST /platform/environments/${env_con_id}/apply-release"
              payload: {}
              as: ReleaseManager
          trigger:
            - call: "POST /platform/environments/${env_con_id}/storage/archive"
              payload: { from_rank: 1, to_rank: 2 }
              as: StorageArchivist
              captures: { cons_total_after_archive: $.data.storage_total_bytes }
            - call: "POST /platform/storage-ledgers/${sc_a_id}/restore"
              payload: {}
              as: StorageArchivist
              captures: { cons_total_after_restore: $.data.storage_total_bytes }
          assert:
            - "before the archive Environment.${env_con_id}.storage_total_bytes == 6291456 and storage_used_bytes == 6291456"
            - "after the archive storage_used_bytes == 0 and storage_archived_bytes == 6291456"
            - "after the restore storage_used_bytes == 4194304 and storage_archived_bytes == 2097152"
            - "Environment.${env_con_id}.storage_total_bytes == 6291456 at every one of the three points, unchanged"

      - name: change_set_pinned_digests_compensated_by_reopen
        grounds:
          - state_machines.MetadataChangeSet.VALIDATED_to_APPROVED
          - state_machines.MetadataChangeSet.APPROVED_to_VALIDATED
          - entities.MetadataChangeSet.fields.component_digests
          - endpoints.POST_/platform/change-sets/{id}/reopen
        distinguishing_aspect: "A pin/governance-count invariant rather than a byte invariant: the PATCH-deploy-reopen pair leaves MetadataChangeSet.component_digests equal to the component_list version_tags exactly, and the count of non-empty digest entries returns to the pre-reopen count, so no digest entry survives a reopen."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. A DEVELOPER source sandbox and a DEVELOPER target sandbox."
          setup_api_calls:
            - call: "POST /platform/environments"
              payload: { name: "Pin Source", type: "DEVELOPER", aperture_limit: 5 }
              as: PlatformAdmin
              captures: { env_pin_s_id: $.data.id }
            - call: "POST /platform/environments"
              payload: { name: "Pin Target", type: "DEVELOPER", aperture_limit: 5 }
              as: PlatformAdmin
              captures: { env_pin_t_id: $.data.id, env_pin_t_v: $.data.version }
            - call: "POST /platform/change-sets"
              payload: { source_environment_id: "${env_pin_s_id}", target_environment_id: "${env_pin_t_id}", component_list: [{ component: "acme_controller", version_tag: 1 }, { component: "acme_layout", version_tag: 2 }], component_dependencies: [], expected_environment_version: "${env_pin_t_v}" }
              as: ReleaseManager
              captures: { cs_pin_id: $.data.id }
            - call: "POST /platform/change-sets/${cs_pin_id}/validate"
              payload: {}
              as: ReleaseManager
            - call: "POST /platform/change-sets/${cs_pin_id}/approve"
              payload: {}
              as: PlatformAdmin
              captures: { cs_pin_v1: $.data.version }
          trigger:
            - call: "PATCH /platform/change-sets/${cs_pin_id}"
              payload: { component_list: [{ component: "acme_controller", version_tag: 3 }, { component: "acme_layout", version_tag: 2 }] }
              as: ReleaseManager
              captures: { cs_stale_v: $.data.version }
            - call: "POST /platform/change-sets/${cs_pin_id}/reopen"
              payload: {}
              as: ReleaseManager
          assert:
            - "the PATCH sets MetadataChangeSet.${cs_pin_id}.status == STALE while component_digests still holds both pinned entries"
            - "after reopen MetadataChangeSet.${cs_pin_id}.component_digests == {} and approved_at is null and approved_by_user_id is null"
            - "after reopen MetadataChangeSet.${cs_pin_id}.status == VALIDATED"
            - "the number of non-empty component_digests entries is 2 before the reopen and 0 after it"

  # ---------------------------------------------------------------------------
  - rule_id: optimistic_concurrency
    instances:
      - name: package_installation_rejects_stale_environment_version
        grounds:
          - concurrency_rules[env-serialize-package-installations]
          - entities.Environment.fields.version
          - endpoints.POST_/platform/environments/{id}/package-installations
          - errors[ERR_STALE_VERSION]
        distinguishing_aspect: "Two strictly sequential installation requests against the same environment: the second is legitimate product behavior (a different namespace) yet is rejected with 412 because its expected_environment_version predates the first install's version bump — no parallel dispatch is involved."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. One PARTIAL sandbox plus two published package versions in distinct namespaces."
          setup_api_calls:
            - call: "POST /platform/package-versions"
              payload: { namespace: "acme", major_version: 1, name: "Acme Core 1" }
              as: PlatformAdmin
              captures: { pv_occ1_id: $.data.id }
            - call: "POST /platform/package-versions"
              payload: { namespace: "orbit", major_version: 1, name: "Orbit Core 1" }
              as: PlatformAdmin
              captures: { pv_occ2_id: $.data.id }
            - call: "POST /platform/environments"
              payload: { name: "Occ Sandbox", type: "PARTIAL", aperture_limit: 5 }
              as: PlatformAdmin
              captures: { env_occ_id: $.data.id, occ_v_initial: $.data.version }
          trigger:
            - call: "POST /platform/environments/${env_occ_id}/package-installations"
              payload: { package_version_id: "${pv_occ1_id}", expected_environment_version: "${occ_v_initial}" }
              as: ReleaseManager
              captures: { occ_v_after: $.data.version }
            - call: "POST /platform/environments/${env_occ_id}/package-installations"
              payload: { package_version_id: "${pv_occ2_id}", expected_environment_version: "${occ_v_initial}" }
              as: ReleaseManager
              captures: { err_occ: $.data.error_id }
          assert:
            - "the first installation returns http 201 and Environment.${env_occ_id}.version == ${occ_v_after}, strictly greater than ${occ_v_initial}"
            - "the second installation returns error_id ERR_STALE_VERSION with http 412"
            - "the orbit namespace has no InstalledPackage row in Environment.${env_occ_id}"
            - "re-sending the second request with expected_environment_version ${occ_v_after} returns http 201"

      - name: change_set_creation_rejects_stale_target_version
        grounds:
          - concurrency_rules[env-serialize-change-set-creation]
          - entities.Environment.fields.version
          - endpoints.POST_/platform/environments/{id}/change-sets
          - errors[ERR_STALE_VERSION]
        distinguishing_aspect: "Same OCC mechanism on a different write endpoint: opening a second change set onto the same target environment is legitimate supersede behavior, but it is refused with 412 because the caller's expected_environment_version is one behind the version the first change set advanced."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. A DEVELOPER source sandbox and a DEVELOPER target sandbox."
          setup_api_calls:
            - call: "POST /platform/environments"
              payload: { name: "Occ Source", type: "DEVELOPER", aperture_limit: 5 }
              as: PlatformAdmin
              captures: { env_ocs_id: $.data.id }
            - call: "POST /platform/environments"
              payload: { name: "Occ Target", type: "DEVELOPER", aperture_limit: 5 }
              as: PlatformAdmin
              captures: { env_oct_id: $.data.id, oct_v_initial: $.data.version }
            - call: "POST /platform/change-sets"
              payload: { source_environment_id: "${env_ocs_id}", target_environment_id: "${env_oct_id}", component_list: [{ component: "acme_controller", version_tag: 1 }], component_dependencies: [], expected_environment_version: "${oct_v_initial}" }
              as: ReleaseManager
              captures: { oct_v_after: $.data.version }
          trigger:
            - call: "POST /platform/change-sets"
              payload: { source_environment_id: "${env_ocs_id}", target_environment_id: "${env_oct_id}", component_list: [{ component: "acme_layout", version_tag: 4 }], component_dependencies: [], expected_environment_version: "${oct_v_initial}" }
              as: ReleaseManager
              captures: { err_oct: $.data.error_id }
            - call: "POST /platform/change-sets"
              payload: { source_environment_id: "${env_ocs_id}", target_environment_id: "${env_oct_id}", component_list: [{ component: "acme_layout", version_tag: 4 }], component_dependencies: [], expected_environment_version: "${oct_v_after}" }
              as: ReleaseManager
              captures: { cs_second_id: $.data.id }
          assert:
            - "the stale create returns error_id ERR_STALE_VERSION with http 412"
            - "Environment.${env_oct_id}.version == ${oct_v_after} after the stale create, so the refused request did not mutate the environment"
            - "the create carrying ${oct_v_after} returns http 201 and MetadataChangeSet.${cs_second_id}.status == DRAFT"
            - "GET /platform/environments/${env_oct_id}/change-sets returns exactly 2 rows while GET /platform/change-sets/${cs_second_id} resolves"

  # ---------------------------------------------------------------------------
  - rule_id: version_pinning_on_approval
    instances:
      - name: digest_mismatch_blocks_deployment_completion
        grounds:
          - state_machines.DeploymentJob.EXECUTING_to_SUCCEEDED
          - entities.MetadataChangeSet.fields.component_digests
          - validations[priority=17]
          - errors[ERR_APPROVAL_STALE]
        distinguishing_aspect: "A pinned reference version blocks the deployment: after PATCHing the component version_tag the change set's component_digests no longer match its component_list, so the job cannot be completed and the pinned approval is what refuses it."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. An approved change set deployed through a queued deployment job."
          setup_api_calls:
            - call: "POST /platform/environments"
              payload: { name: "Stale Source", type: "DEVELOPER", aperture_limit: 5 }
              as: PlatformAdmin
              captures: { env_ss_id: $.data.id }
            - call: "POST /platform/environments"
              payload: { name: "Stale Target", type: "DEVELOPER", aperture_limit: 5 }
              as: PlatformAdmin
              captures: { env_stt_id: $.data.id, env_stt_v: $.data.version }
            - call: "POST /platform/change-sets"
              payload: { source_environment_id: "${env_ss_id}", target_environment_id: "${env_stt_id}", component_list: [{ component: "acme_controller", version_tag: 1 }], component_dependencies: [], expected_environment_version: "${env_stt_v}" }
              as: ReleaseManager
              captures: { cs_stale_id: $.data.id }
            - call: "POST /platform/change-sets/${cs_stale_id}/validate"
              payload: {}
              as: ReleaseManager
            - call: "POST /platform/change-sets/${cs_stale_id}/approve"
              payload: {}
              as: PlatformAdmin
            - call: "POST /platform/change-sets/${cs_stale_id}/deploy"
              payload: { idempotency_key: "stale-flow-1" }
              as: ReleaseManager
              captures: { dj_stale_id: $.data.id }
            - call: "PATCH /platform/change-sets/${cs_stale_id}"
              payload: { component_list: [{ component: "acme_controller", version_tag: 2 }] }
              as: ReleaseManager
          trigger:
            - call: "POST /platform/deployment-jobs/${dj_stale_id}/complete"
              payload: {}
              as: EnvironmentAdmin
              captures: { err_stale_deploy: $.data.error_id }
          assert:
            - "MetadataChangeSet.${cs_stale_id}.component_digests == {\"acme_controller\": 1} while its component_list version_tag is 2"
            - "the completion returns error_id ERR_APPROVAL_STALE with http 409"
            - "DeploymentJob.${dj_stale_id}.status == EXECUTING and applied_component_count == 0"
            - "MetadataChangeSet.${cs_stale_id}.status == STALE, not DEPLOYED"

      - name: idempotent_deployment_replay_preserves_pinned_digests
        grounds:
          - entities.DeploymentJob.fields.idempotency_key
          - state_machines.DeploymentJob.EXECUTING_to_SUCCEEDED
          - entities.MetadataChangeSet.fields.component_digests
          - endpoints.POST_/platform/change-sets/{id}/deploy
        distinguishing_aspect: "Repeating an identical deployment request replays the pinned job rather than opening a second one, so the change set's pinned digests and the job's validated_digest_match both remain the approval-time values across the replay."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. An approved change set with one component."
          setup_api_calls:
            - call: "POST /platform/environments"
              payload: { name: "Replay Source", type: "DEVELOPER", aperture_limit: 5 }
              as: PlatformAdmin
              captures: { env_rs_id: $.data.id }
            - call: "POST /platform/environments"
              payload: { name: "Replay Target", type: "DEVELOPER", aperture_limit: 5 }
              as: PlatformAdmin
              captures: { env_rt_id: $.data.id, env_rt_v: $.data.version }
            - call: "POST /platform/change-sets"
              payload: { source_environment_id: "${env_rs_id}", target_environment_id: "${env_rt_id}", component_list: [{ component: "acme_controller", version_tag: 7 }], component_dependencies: [], expected_environment_version: "${env_rt_v}" }
              as: ReleaseManager
              captures: { cs_replay_id: $.data.id }
            - call: "POST /platform/change-sets/${cs_replay_id}/validate"
              payload: {}
              as: ReleaseManager
            - call: "POST /platform/change-sets/${cs_replay_id}/approve"
              payload: {}
              as: PlatformAdmin
            - call: "POST /platform/change-sets/${cs_replay_id}/deploy"
              payload: { idempotency_key: "replay-key-1" }
              as: ReleaseManager
              captures: { dj_replay_id: $.data.id }
          trigger:
            - call: "POST /platform/change-sets/${cs_replay_id}/deploy"
              payload: { idempotency_key: "replay-key-1" }
              as: ReleaseManager
              captures: { dj_replay_id2: $.data.id }
            - call: "GET /platform/change-sets/${cs_replay_id}/deployments"
              payload: {}
              as: ReleaseManager
          assert:
            - "the replayed deploy returns the same job: \"${dj_replay_id2}\" == \"${dj_replay_id}\""
            - "GET /platform/change-sets/${cs_replay_id}/deployments returns exactly 1 row"
            - "MetadataChangeSet.${cs_replay_id}.component_digests == {\"acme_controller\": 7}, unchanged by the replay"
            - "DeploymentJob.${dj_replay_id}.status == QUEUED and validated_digest_match == false"

  # ---------------------------------------------------------------------------
  - rule_id: cascading_side_effects
    instances:
      - name: package_publish_refreshes_every_installations_stale_marker
        grounds:
          - state_machines.InstalledPackage.NEEDS_UPGRADE_to_UPGRADED
          - calculations.upgrade_candidate_evaluation
          - entities.PackageVersion.fields.install_count
          - endpoints.POST_/platform/package-versions
        distinguishing_aspect: "One publish fans out across environments and is order-sensitive: the new version's install_count write is what lets the stale marker re-derive on the installations that reference the superseded version, so a publish that skips the count write leaves stale false."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Two environments each carrying acme-core 1."
          setup_api_calls:
            - call: "POST /platform/package-versions"
              payload: { namespace: "acme", major_version: 1, name: "Acme Core 1" }
              as: PlatformAdmin
              captures: { pv_fan1_id: $.data.id }
            - call: "POST /platform/environments"
              payload: { name: "Fanout A", type: "DEVELOPER", aperture_limit: 5 }
              as: PlatformAdmin
              captures: { env_fa_id: $.data.id, env_fa_v: $.data.version }
            - call: "POST /platform/environments"
              payload: { name: "Fanout B", type: "PARTIAL", aperture_limit: 5 }
              as: PlatformAdmin
              captures: { env_fb_id: $.data.id, env_fb_v: $.data.version }
            - call: "POST /platform/environments/${env_fa_id}/package-installations"
              payload: { package_version_id: "${pv_fan1_id}", expected_environment_version: "${env_fa_v}" }
              as: ReleaseManager
              captures: { pkg_fa_id: $.data.id }
            - call: "POST /platform/environments/${env_fb_id}/package-installations"
              payload: { package_version_id: "${pv_fan1_id}", expected_environment_version: "${env_fb_v}" }
              as: ReleaseManager
              captures: { pkg_fb_id: $.data.id }
          trigger:
            - call: "POST /platform/package-versions"
              payload: { namespace: "acme", major_version: 2, name: "Acme Core 2", supersedes_version_id: "${pv_fan1_id}" }
              as: PlatformAdmin
              captures: { pv_fan2_id: $.data.id, fan_install_count: $.data.install_count }
          assert:
            - "PackageVersion.${pv_fan2_id}.install_count == 0"
            - "PackageVersion.${pv_fan1_id}.install_count == 2"
            - "InstalledPackage.${pkg_fa_id}.stale == true and InstalledPackage.${pkg_fb_id}.stale == true"
            - "the publish writes exactly one PackageVersion row and touches both installations, leaving InstalledPackage.${pkg_fa_id}.package_version_id == \"${pv_fan1_id}\""

      - name: permission_grant_derives_scope_from_installed_namespace
        grounds:
          - calculations.permission_overreach_resolution
          - entities.PermissionAssignment.fields.sharing_rule_scope
          - state_machines.Environment.SCHEDULED_to_RELEASED
          - endpoints.POST_/platform/environments/{id}/permissions
        distinguishing_aspect: "The grant's derived sharing_rule_scope is a consequence of the environment's installed-package state rather than of the grant body: the same grant created before an install stays PRIVATE, and the pre-existing grant flips to NAMESPACE_READ once a package of its object_prefix lands."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. One PARTIAL sandbox with an acme-prefixed grant created before acme is installed."
          setup_api_calls:
            - call: "POST /platform/package-versions"
              payload: { namespace: "acme", major_version: 1, name: "Acme Core 1" }
              as: PlatformAdmin
              captures: { pv_scope_id: $.data.id }
            - call: "POST /platform/environments"
              payload: { name: "Scope Sandbox", type: "PARTIAL", aperture_limit: 5 }
              as: PlatformAdmin
              captures: { env_scope_id: $.data.id, env_scope_v: $.data.version }
            - call: "POST /platform/environments/${env_scope_id}/permissions"
              payload: { principal_type: "PERMISSION_SET", principal_name: "AcmeObjectsAccess", user_id: "0050a000030001", object_prefix: "acme" }
              as: SecurityAuditor
              captures: { pa_scope_id: $.data.id }
          trigger:
            - call: "GET /platform/environments/${env_scope_id}/permissions"
              payload: {}
              as: SecurityAuditor
            - call: "POST /platform/environments/${env_scope_id}/package-installations"
              payload: { package_version_id: "${pv_scope_id}", expected_environment_version: "${env_scope_v}" }
              as: ReleaseManager
          assert:
            - "before the install PermissionAssignment.${pa_scope_id}.sharing_rule_scope == PRIVATE"
            - "after the install PermissionAssignment.${pa_scope_id}.sharing_rule_scope == NAMESPACE_READ"
            - "the grant body carried no sharing_rule_scope field, so the value is entirely system-derived"
            - "Environment.${env_scope_id}.installed_version_ids == [\"${pv_scope_id}\"]"
# ---------------------------------------------------------------------------
  - rule_id: derived_field_reconciliation
    instances:
      - name: live_archived_partition_keeps_headroom_stable
        grounds:
          - calculations.storage_breach_evaluation
          - entities.Environment.fields.storage_headroom_bytes
          - entities.StorageLedger.fields.status
          - endpoints.POST_/platform/environments/{id}/storage/archive
        distinguishing_aspect: "A denormalized pair that must stay consistent with its source: storage_used_bytes and storage_archived_bytes re-derive from the LIVE/ARCHIVED partition of the ledgers while storage_total_bytes stays pinned, so a reconciler that recomputed only one side would move headroom."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. One DEVELOPER sandbox released onto SU26 with a 4 MiB DATA ledger and a 2 MiB FILE ledger, cap 100 MiB."
          setup_api_calls:
            - call: "POST /platform/environments"
              payload: { name: "Partition Env", type: "DEVELOPER", storage_cap_bytes: 104857600, aperture_limit: 5 }
              as: PlatformAdmin
              captures: { env_part_id: $.data.id }
            - call: "POST /platform/environments/${env_part_id}/storage-ledgers"
              payload: { kind: "DATA", bytes: 4194304, rank_index: 1 }
              as: StorageArchivist
              captures: { pl_data_id: $.data.id }
            - call: "POST /platform/environments/${env_part_id}/storage-ledgers"
              payload: { kind: "FILE", bytes: 2097152, rank_index: 2 }
              as: StorageArchivist
              captures: { pl_file_id: $.data.id }
            - call: "POST /platform/environments/${env_part_id}/schedule-release"
              payload: { target_release_version: "SU26" }
              as: ReleaseManager
            - call: "POST /platform/environments/${env_part_id}/apply-release"
              payload: {}
              as: ReleaseManager
          trigger:
            - call: "POST /platform/environments/${env_part_id}/storage/archive"
              payload: { from_rank: 2, to_rank: 2 }
              as: StorageArchivist
          assert:
            - "StorageLedger.${pl_file_id}.status == ARCHIVED and StorageLedger.${pl_data_id}.status == LIVE"
            - "Environment.${env_part_id}.storage_used_bytes == 4194304 and storage_archived_bytes == 2097152"
            - "Environment.${env_part_id}.storage_headroom_bytes == -96468992, the same value it held before the archive"
            - "Environment.${env_part_id}.storage_breach == false"

      - name: installation_refresh_invalidation_reconciles_pending_job_pointer
        grounds:
          - state_machines.RefreshJob.COMPLETING_to_COMPLETED
          - entities.InstalledPackage.fields.pending_refresh_job_id
          - entities.InstalledPackage.fields.refreshed_at
          - endpoints.POST_/platform/refresh-jobs/{id}/complete-refresh
        distinguishing_aspect: "A second reconciliation pair on a different entity: the installation's refreshed_at advances to the refresh completion timestamp and pending_refresh_job_id re-points at the completing job, so a reconciler that touched refreshed_at but not the pointer would leave the marker stale."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. A PARTIAL sandbox with acme-core 1 installed and never refreshed."
          setup_api_calls:
            - call: "POST /platform/package-versions"
              payload: { namespace: "acme", major_version: 1, name: "Acme Core 1" }
              as: PlatformAdmin
              captures: { pv_rec_id: $.data.id }
            - call: "POST /platform/environments"
              payload: { name: "Reconcile Sandbox", type: "PARTIAL", aperture_limit: 5 }
              as: PlatformAdmin
              captures: { env_rec_id: $.data.id, env_rec_v: $.data.version }
            - call: "POST /platform/environments/${env_rec_id}/package-installations"
              payload: { package_version_id: "${pv_rec_id}", expected_environment_version: "${env_rec_v}" }
              as: ReleaseManager
              captures: { pkg_rec_id: $.data.id }
            - call: "POST /platform/refresh-jobs"
              payload: { environment_id: "${env_rec_id}", partition: "ACCOUNT_PARTIAL", masked_field_count: 4 }
              as: EnvironmentAdmin
              captures: { rj_rec_id: $.data.id }
            - call: "POST /platform/refresh-jobs/${rj_rec_id}/complete-masking"
              payload: {}
              as: EnvironmentAdmin
          trigger:
            - call: "POST /platform/refresh-jobs/${rj_rec_id}/complete-refresh"
              payload: {}
              as: EnvironmentAdmin
          assert:
            - "before the refresh InstalledPackage.${pkg_rec_id}.refreshed_at is null and pending_refresh_job_id is null"
            - "after the refresh InstalledPackage.${pkg_rec_id}.refreshed_at == 2026-09-01T00:00:00Z"
            - "after the refresh InstalledPackage.${pkg_rec_id}.pending_refresh_job_id == \"${rj_rec_id}\""
            - "InstalledPackage.${pkg_rec_id}.stale == false because acme-core 1 is still the only version in its namespace"

  # ---------------------------------------------------------------------------
  - rule_id: idempotency
    instances:
      - name: identical_deploy_key_replays_without_second_job
        grounds:
          - entities.DeploymentJob.fields.idempotency_key
          - endpoints.POST_/platform/change-sets/{id}/deploy
          - state_machines.DeploymentJob.EXECUTING_to_SUCCEEDED
          - entities.DeploymentJob.fields.status
        distinguishing_aspect: "Two byte-identical deploy requests sharing an idempotency_key yield one persisted job — the second call returns the first job's id and GET /platform/change-sets/{id}/deployments still reports a single row."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. An approved change set whose deploy has not been attempted."
          setup_api_calls:
            - call: "POST /platform/environments"
              payload: { name: "Idem Source", type: "DEVELOPER", aperture_limit: 5 }
              as: PlatformAdmin
              captures: { env_is_id: $.data.id }
            - call: "POST /platform/environments"
              payload: { name: "Idem Target", type: "DEVELOPER", aperture_limit: 5 }
              as: PlatformAdmin
              captures: { env_it_id: $.data.id, env_it_v: $.data.version }
            - call: "POST /platform/change-sets"
              payload: { source_environment_id: "${env_is_id}", target_environment_id: "${env_it_id}", component_list: [{ component: "acme_controller", version_tag: 1 }], component_dependencies: [], expected_environment_version: "${env_it_v}" }
              as: ReleaseManager
              captures: { cs_idem_id: $.data.id }
            - call: "POST /platform/change-sets/${cs_idem_id}/validate"
              payload: {}
              as: ReleaseManager
            - call: "POST /platform/change-sets/${cs_idem_id}/approve"
              payload: {}
              as: PlatformAdmin
          trigger:
            - call: "POST /platform/change-sets/${cs_idem_id}/deploy"
              payload: { idempotency_key: "same-key" }
              as: ReleaseManager
              captures: { dk_first: $.data.id }
            - call: "POST /platform/change-sets/${cs_idem_id}/deploy"
              payload: { idempotency_key: "same-key" }
              as: ReleaseManager
              captures: { dk_second: $.data.id }
          assert:
            - "\"${dk_first}\" == \"${dk_second}\""
            - "GET /platform/change-sets/${cs_idem_id}/deployments returns exactly 1 row"
            - "the single job's status is QUEUED and applied_component_count is 0"
            - "MetadataChangeSet.${cs_idem_id}.component_digests == {\"acme_controller\": 1}, untouched by the replay"

      - name: distinct_deploy_key_opens_a_second_job
        grounds:
          - entities.DeploymentJob.fields.idempotency_key
          - endpoints.POST_/platform/change-sets/{id}/deploy
          - entities.DeploymentJob.fields.version
          - endpoints.GET_/platform/change-sets/{id}/deployments
        distinguishing_aspect: "The negative side of the same mechanism: a different idempotency_key on the same approved change set is not a replay and opens a second job, so the uniqueness scope is (change_set_id, idempotency_key) and not the change set alone."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. An approved change set with no deployments yet."
          setup_api_calls:
            - call: "POST /platform/environments"
              payload: { name: "Distinct Source", type: "DEVELOPER", aperture_limit: 5 }
              as: PlatformAdmin
              captures: { env_ds_id: $.data.id }
            - call: "POST /platform/environments"
              payload: { name: "Distinct Target", type: "DEVELOPER", aperture_limit: 5 }
              as: PlatformAdmin
              captures: { env_dt_id: $.data.id, env_dt_v: $.data.version }
            - call: "POST /platform/change-sets"
              payload: { source_environment_id: "${env_ds_id}", target_environment_id: "${env_dt_id}", component_list: [{ component: "acme_layout", version_tag: 2 }], component_dependencies: [], expected_environment_version: "${env_dt_v}" }
              as: ReleaseManager
              captures: { cs_dist_id: $.data.id }
            - call: "POST /platform/change-sets/${cs_dist_id}/validate"
              payload: {}
              as: ReleaseManager
            - call: "POST /platform/change-sets/${cs_dist_id}/approve"
              payload: {}
              as: PlatformAdmin
          trigger:
            - call: "POST /platform/change-sets/${cs_dist_id}/deploy"
              payload: { idempotency_key: "distinct-1" }
              as: ReleaseManager
              captures: { dj_dist1_id: $.data.id }
            - call: "POST /platform/change-sets/${cs_dist_id}/deploy"
              payload: { idempotency_key: "distinct-2" }
              as: ReleaseManager
              captures: { dj_dist2_id: $.data.id }
          assert:
            - "\"${dj_dist1_id}\" != \"${dj_dist2_id}\""
            - "GET /platform/change-sets/${cs_dist_id}/deployments returns exactly 2 rows"
            - "both jobs are QUEUED with applied_component_count 0"
            - "DeploymentJob.${dj_dist1_id}.idempotency_key == \"distinct-1\" and DeploymentJob.${dj_dist2_id}.idempotency_key == \"distinct-2\""

  # ---------------------------------------------------------------------------
  - rule_id: selector_policy
    instances:
      - name: package_conflict_winner_tie_broken_by_created_at_desc
        grounds:
          - calculations.package_conflict_resolution
          - entities.PackageVersion.fields.created_at
          - entities.InstalledPackage.fields.installed_at
          - endpoints.POST_/platform/installed-packages/{id}/upgrade
        distinguishing_aspect: "A candidate pool resolved by an explicit ranking expression whose tie-break is the recorded creation instant: two non-deprecated versions with identical (requires_chain_depth, major_version) ranks are ordered by created_at DESC, never by the server-minted id."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. One DEVELOPER sandbox with acme-core 1 installed."
          setup_api_calls:
            - call: "POST /platform/package-versions"
              payload: { namespace: "acme", major_version: 1, name: "Acme Core 1" }
              as: PlatformAdmin
              captures: { pv_sel1_id: $.data.id }
            - call: "POST /platform/environments"
              payload: { name: "Selector Env", type: "DEVELOPER", aperture_limit: 5 }
              as: PlatformAdmin
              captures: { env_sel_id: $.data.id, env_sel_v: $.data.version }
            - call: "POST /platform/environments/${env_sel_id}/package-installations"
              payload: { package_version_id: "${pv_sel1_id}", expected_environment_version: "${env_sel_v}" }
              as: ReleaseManager
              captures: { pkg_sel_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-02T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /platform/package-versions"
              payload: { namespace: "acme", major_version: 2, name: "Acme Core 2 branch A", supersedes_version_id: "${pv_sel1_id}" }
              as: PlatformAdmin
              captures: { pv_sel2_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-03T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /platform/package-versions"
              payload: { namespace: "acme", major_version: 2, name: "Acme Core 2 branch B", supersedes_version_id: "${pv_sel1_id}" }
              as: PlatformAdmin
              captures: { pv_sel3_id: $.data.id }
          trigger:
            - call: "POST /platform/installed-packages/${pkg_sel_id}/upgrade"
              payload: { target_package_version_id: "${pv_sel3_id}" }
              as: ReleaseManager
              captures: { pkg_sel_after: $.data.version }
          assert:
            - "PackageVersion.${pv_sel2_id}.created_at == 2026-09-02T00:00:00Z and PackageVersion.${pv_sel3_id}.created_at == 2026-09-03T00:00:00Z, so pv_sel3_id is the newer candidate"
            - "the conflict winner is PackageVersion.${pv_sel3_id}, selected by created_at DESC on a whole-rank tie and not by id"
            - "InstalledPackage.${pkg_sel_id}.package_version_id == \"${pv_sel3_id}\" after the upgrade"
            - "InstalledPackage.${pkg_sel_id}.status == UPGRADED and stale == false"

      - name: package_conflict_winner_prefers_deeper_dependency_chain
        grounds:
          - calculations.package_conflict_resolution
          - entities.PackageVersion.fields.requires_namespace
          - entities.InstalledPackage.fields.status
          - endpoints.POST_/platform/environments/{id}/package-installations
        distinguishing_aspect: "The primary ranking key is exercised before any tie-break: a version requiring a third package outranks a higher major_version with a shorter chain, so the winner is chosen by requires_chain_depth and not by major_version alone."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. One DEVELOPER sandbox, with acme-core, orbit-core and a deep ui chain available."
          setup_api_calls:
            - call: "POST /platform/package-versions"
              payload: { namespace: "acme", major_version: 1, name: "Acme Core 1" }
              as: PlatformAdmin
              captures: { pv_dc_core_id: $.data.id }
            - call: "POST /platform/package-versions"
              payload: { namespace: "orbit", major_version: 1, name: "Orbit Core 1" }
              as: PlatformAdmin
              captures: { pv_dc_orbit_id: $.data.id }
            - call: "POST /platform/package-versions"
              payload: { namespace: "ui", major_version: 1, name: "Acme UI 1", requires_namespace: "orbit", requires_min_version_id: "${pv_dc_orbit_id}" }
              as: PlatformAdmin
              captures: { pv_dc_ui1_id: $.data.id }
            - call: "POST /platform/environments"
              payload: { name: "Depth Env", type: "DEVELOPER", aperture_limit: 5 }
              as: PlatformAdmin
              captures: { env_dc_id: $.data.id, env_dc_v: $.data.version }
            - call: "POST /platform/environments/${env_dc_id}/package-installations"
              payload: { package_version_id: "${pv_dc_orbit_id}", expected_environment_version: "${env_dc_v}" }
              as: ReleaseManager
              captures: { pkg_dc_orbit_id: $.data.id }
            - call: "POST /platform/environments/${env_dc_id}/package-installations"
              payload: { package_version_id: "${pv_dc_ui1_id}", expected_environment_version: "${env_dc_v}" }
              as: ReleaseManager
              captures: { pkg_dc_ui_id: $.data.id }
          trigger:
            - call: "POST /platform/environments/${env_dc_id}/package-installations"
              payload: { package_version_id: "${pv_dc_core_id}", expected_environment_version: "${env_dc_v}" }
              as: ReleaseManager
              captures: { pkg_dc_core_id: $.data.id }
          assert:
            - "InstalledPackage.${pkg_dc_ui_id}.status == INSTALLED with a non-empty requires chain, so its ranking depth is 2"
            - "the conflict winner for PackageVersion.${pv_dc_core_id}'s chain is the orbit package (depth 1) ahead of any depth-0 version, independent of major_version"
            - "Environment.${env_dc_id}.installed_version_ids has exactly 3 entries after the third install"
            - "InstalledPackage.${pkg_dc_core_id}.stale == false because acme-core 1 is the only version in its namespace"

  # ---------------------------------------------------------------------------
  - rule_id: multi_tenancy
    instances:
      - name: grant_scope_isolated_to_owning_environment
        grounds:
          - entities.PermissionAssignment.fields.environment_id
          - calculations.permission_overreach_resolution
          - endpoints.GET_/platform/environments/{id}/permissions
          - errors[ERR_ACCESS_TRACE_INCOMPLETE]
        distinguishing_aspect: "Environment-scoped isolation of the permission model: a grant created under one environment never appears in another environment's permission list, and an access audit cannot review it, so the same operator id yields different layer totals per environment."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Two DEVELOPER sandboxes, each with one grant for the same operator id."
          setup_api_calls:
            - call: "POST /platform/environments"
              payload: { name: "Tenant A", type: "DEVELOPER", aperture_limit: 5 }
              as: PlatformAdmin
              captures: { env_ta_id: $.data.id }
            - call: "POST /platform/environments"
              payload: { name: "Tenant B", type: "DEVELOPER", aperture_limit: 5 }
              as: PlatformAdmin
              captures: { env_tb_id: $.data.id }
            - call: "POST /platform/environments/${env_ta_id}/permissions"
              payload: { principal_type: "PROFILE", principal_name: "TenantAProfile", user_id: "0050a000090001" }
              as: SecurityAuditor
              captures: { pa_ta_id: $.data.id }
            - call: "POST /platform/environments/${env_tb_id}/permissions"
              payload: { principal_type: "PERMISSION_SET", principal_name: "TenantBSet", user_id: "0050a000090002" }
              as: SecurityAuditor
              captures: { pa_tb_id: $.data.id }
          trigger:
            - call: "GET /platform/environments/${env_ta_id}/permissions"
              payload: {}
              as: SecurityAuditor
            - call: "POST /platform/access-audits"
              payload: { environment_id: "${env_tb_id}", reviewed_assignment_ids: ["${pa_ta_id}"] }
              as: SecurityAuditor
              captures: { err_tenant: $.data.error_id }
          assert:
            - "GET /platform/environments/${env_ta_id}/permissions returns exactly 1 row and it is PermissionAssignment.${pa_ta_id}"
            - "the audit over Tenant B returns error_id ERR_ACCESS_TRACE_INCOMPLETE with http 404"
            - "PermissionAssignment.${pa_tb_id}.environment_id == \"${env_tb_id}\" and never appears under Tenant A"
            - "Environment.${env_ta_id}.permission_layer_total counts only Tenant A's single layer"

      - name: ledger_bytes_isolated_per_environment_cap
        grounds:
          - entities.StorageLedger.fields.environment_id
          - calculations.storage_breach_evaluation
          - entities.Environment.fields.storage_used_bytes
          - endpoints.GET_/platform/environments/{id}/storage-ledgers
        distinguishing_aspect: "A second isolation pair on a different resource: identical ledger registrations under two environments breach only the environment whose own cap is crossed, so storage accounting is scoped per environment rather than shared."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Tenant A capped at 1 MiB and Tenant B capped at 8 MiB."
          setup_api_calls:
            - call: "POST /platform/environments"
              payload: { name: "Cap Tenant A", type: "DEVELOPER", storage_cap_bytes: 1048576, aperture_limit: 5 }
              as: PlatformAdmin
              captures: { env_ca_id: $.data.id }
            - call: "POST /platform/environments"
              payload: { name: "Cap Tenant B", type: "DEVELOPER", storage_cap_bytes: 8388608, aperture_limit: 5 }
              as: PlatformAdmin
              captures: { env_cb_id: $.data.id }
          trigger:
            - call: "POST /platform/environments/${env_ca_id}/storage-ledgers"
              payload: { kind: "DATA", bytes: 1048576, rank_index: 1 }
              as: StorageArchivist
              captures: { sl_ca_id: $.data.id }
            - call: "POST /platform/environments/${env_cb_id}/storage-ledgers"
              payload: { kind: "DATA", bytes: 1048576, rank_index: 1 }
              as: StorageArchivist
              captures: { sl_cb_id: $.data.id }
          assert:
            - "Environment.${env_ca_id}.storage_breach == true because 1048576 >= its own cap 1048576"
            - "Environment.${env_cb_id}.storage_breach == false because 1048576 < its own cap 8388608"
            - "Environment.${env_ca_id}.storage_used_bytes == 1048576 and Environment.${env_cb_id}.storage_used_bytes == 1048576, equal totals with different breach verdicts"
            - "GET /platform/environments/${env_cb_id}/storage-ledgers returns exactly 1 row, and it is StorageLedger.${sl_cb_id}"

  # ---------------------------------------------------------------------------
  - rule_id: scheduled_actions
    instances:
      - name: clock_advance_flips_permission_layer_dispatch
        grounds:
          - calculations.permission_layer_diagnostics
          - endpoints.POST_/_clock/set_current_utc
          - entities.Environment.fields.permission_layer_total
          - calculations.release_window_index
        distinguishing_aspect: "A deferred action keyed on the logical clock: the same environment read before and after 2026-10-05T00:00:00Z reports different permission_layer_total values, and the clock endpoint's default of 2026-09-01T00:00:00Z makes the pre-dispatch read deterministic."
        test_recipe:
          setup:
            - "Logical clock never set, so it reads the fixed startup default 2026-09-01T00:00:00Z. One PARTIAL sandbox with one grant."
          setup_api_calls:
            - call: "POST /platform/environments"
              payload: { name: "Deferred Env", type: "PARTIAL", aperture_limit: 5 }
              as: PlatformAdmin
              captures: { env_df_id: $.data.id }
            - call: "POST /platform/environments/${env_df_id}/permissions"
              payload: { principal_type: "PROFILE", principal_name: "DeferredProfile", user_id: "0050a000040001" }
              as: SecurityAuditor
              captures: { pa_df_id: $.data.id }
          trigger:
            - call: "GET /platform/environments/${env_df_id}"
              payload: {}
              as: PlatformAdmin
              captures: { df_before: $.data.permission_layer_total }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-10-04T00:00:00Z" }
              as: PlatformAdmin
            - call: "GET /platform/environments/${env_df_id}"
              payload: {}
              as: PlatformAdmin
              captures: { df_at_eve: $.data.permission_layer_total }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-10-05T00:00:00Z" }
              as: PlatformAdmin
            - call: "GET /platform/environments/${env_df_id}"
              payload: {}
              as: PlatformAdmin
              captures: { df_after: $.data.permission_layer_total }
          assert:
            - "the unset-clock read returns Environment.${env_df_id}.permission_layer_total == 1, so the default clock is 2026-09-01T00:00:00Z and not wall-clock time"
            - "the read at 2026-10-04T00:00:00Z still returns 1, because the instant is one day before the dispatch"
            - "the read at 2026-10-05T00:00:00Z returns 3, because the boundary is inclusive at the dispatch instant"
            - "Environment.${env_df_id}.permission_layer_total changed by exactly 2 across the dispatch instant"

      - name: release_window_reopen_requires_prior_aperture_use
        grounds:
          - state_machines.Environment.SCHEDULED_to_CONFIG
          - validations[priority=6]
          - calculations.release_window_index
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "A cancellation window on a scheduled action: reopening a release window before any refresh has ever consumed aperture is refused with ERR_INVALID_STATE, so the reopen is only available after the scheduled action has been exercised."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. One DEVELOPER sandbox scheduled onto SP26 with aperture_used 0."
          setup_api_calls:
            - call: "POST /platform/environments"
              payload: { name: "Cancel Env", type: "DEVELOPER", aperture_limit: 5 }
              as: PlatformAdmin
              captures: { env_cx_id: $.data.id }
            - call: "POST /platform/environments/${env_cx_id}/schedule-release"
              payload: { target_release_version: "SP26" }
              as: ReleaseManager
          trigger:
            - call: "POST /platform/environments/${env_cx_id}/open-release-window"
              payload: {}
              as: ReleaseManager
              captures: { err_cx: $.data.error_id }
          assert:
            - "Environment.${env_cx_id}.release_status == SCHEDULED and aperture_used == 0"
            - "the reopen returns error_id ERR_INVALID_STATE with http 409"
            - "Environment.${env_cx_id}.release_status remains SCHEDULED and scheduled_release_version remains \"SP26\""
            - "Environment.${env_cx_id}.applied_release_version is still null"

  # ---------------------------------------------------------------------------
  - rule_id: bulk_operations
    instances:
      - name: partial_batch_rejection_leaves_unlisted_children_untouched
        grounds:
          - state_machines.RefreshJob.MASKING_to_FAILED
          - state_machines.RefreshJob.COMPLETING_to_COMPLETED
          - entities.Environment.fields.aperture_used
          - endpoints.POST_/platform/refresh-jobs/{id}/fail
        distinguishing_aspect: "Batch semantics on the aperture counter: of three open refresh jobs on one environment, two complete and one fails, and the aperture roll-up counts exactly the two completed children while the failed child leaves no consumed slot."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. One DEVELOPER sandbox with aperture_limit 5 and three open refresh jobs."
          setup_api_calls:
            - call: "POST /platform/environments"
              payload: { name: "Batch Env", type: "DEVELOPER", aperture_limit: 5 }
              as: PlatformAdmin
              captures: { env_batch_id: $.data.id }
            - call: "POST /platform/refresh-jobs"
              payload: { environment_id: "${env_batch_id}", partition: "ACCOUNT_PARTIAL", masked_field_count: 2 }
              as: EnvironmentAdmin
              captures: { bj1_id: $.data.id }
            - call: "POST /platform/refresh-jobs"
              payload: { environment_id: "${env_batch_id}", partition: "ACCOUNT_PARTIAL", masked_field_count: 2 }
              as: EnvironmentAdmin
              captures: { bj2_id: $.data.id }
            - call: "POST /platform/refresh-jobs"
              payload: { environment_id: "${env_batch_id}", partition: "ACCOUNT_PARTIAL", masked_field_count: 2 }
              as: EnvironmentAdmin
              captures: { bj3_id: $.data.id }
            - call: "POST /platform/refresh-jobs/${bj1_id}/complete-masking"
              payload: {}
              as: EnvironmentAdmin
            - call: "POST /platform/refresh-jobs/${bj1_id}/complete-refresh"
              payload: {}
              as: EnvironmentAdmin
            - call: "POST /platform/refresh-jobs/${bj2_id}/complete-masking"
              payload: {}
              as: EnvironmentAdmin
            - call: "POST /platform/refresh-jobs/${bj2_id}/complete-refresh"
              payload: {}
              as: EnvironmentAdmin
          trigger:
            - call: "POST /platform/refresh-jobs/${bj3_id}/complete-masking"
              payload: {}
              as: EnvironmentAdmin
            - call: "POST /platform/refresh-jobs/${bj3_id}/fail"
              payload: {}
              as: EnvironmentAdmin
          assert:
            - "Environment.${env_batch_id}.aperture_used == 2, counting only the two COMPLETED children"
            - "RefreshJob.${bj1_id}.status == COMPLETED and RefreshJob.${bj2_id}.status == COMPLETED, both with consumed_aperture == true"
            - "RefreshJob.${bj3_id}.status == FAILED with consumed_aperture == false"
            - "Environment.${env_batch_id}.aperture_limit == 5, so no aperture slot was consumed by the failed child"

      - name: batch_install_partial_failure_keeps_successful_rows
        grounds:
          - endpoints.POST_/platform/environments/{id}/package-installations
          - validations[priority=11]
          - errors[ERR_PACKAGE_ALREADY_INSTALLED]
          - entities.Environment.fields.installed_version_ids
        distinguishing_aspect: "Best-effort batch semantics across a multi-package install sweep: the duplicate-namespace member of the batch is rejected while the other two members persist, so the surface behaves as best-effort rather than transactional rollback."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. One DEVELOPER sandbox with acme-core 1 already installed and two further namespaces available."
          setup_api_calls:
            - call: "POST /platform/package-versions"
              payload: { namespace: "acme", major_version: 1, name: "Acme Core 1" }
              as: PlatformAdmin
              captures: { pv_bo1_id: $.data.id }
            - call: "POST /platform/package-versions"
              payload: { namespace: "orbit", major_version: 1, name: "Orbit Core 1" }
              as: PlatformAdmin
              captures: { pv_bo2_id: $.data.id }
            - call: "POST /platform/package-versions"
              payload: { namespace: "nimbus", major_version: 1, name: "Nimbus Core 1" }
              as: PlatformAdmin
              captures: { pv_bo3_id: $.data.id }
            - call: "POST /platform/environments"
              payload: { name: "Best Effort Env", type: "DEVELOPER", aperture_limit: 5 }
              as: PlatformAdmin
              captures: { env_bo_id: $.data.id, env_bo_v: $.data.version }
            - call: "POST /platform/environments/${env_bo_id}/package-installations"
              payload: { package_version_id: "${pv_bo1_id}", expected_environment_version: "${env_bo_v}" }
              as: ReleaseManager
              captures: { pkg_bo1_id: $.data.id, bo_v: $.data.version }
          trigger:
            - call: "POST /platform/environments/${env_bo_id}/package-installations"
              payload: { package_version_id: "${pv_bo2_id}", expected_environment_version: "${bo_v}" }
              as: ReleaseManager
              captures: { pkg_bo2_id: $.data.id, bo_v2: $.data.version }
            - call: "POST /platform/environments/${env_bo_id}/package-installations"
              payload: { package_version_id: "${pv_bo1_id}", expected_environment_version: "${bo_v2}" }
              as: ReleaseManager
              captures: { err_bo: $.data.error_id, bo_v3: $.data.version }
            - call: "POST /platform/environments/${env_bo_id}/package-installations"
              payload: { package_version_id: "${pv_bo3_id}", expected_environment_version: "${bo_v3}" }
              as: ReleaseManager
              captures: { pkg_bo3_id: $.data.id, bo_v4: $.data.version }
          assert:
            - "the duplicate-namespace member returns error_id ERR_PACKAGE_ALREADY_INSTALLED with http 409"
            - "the acme installation is not rolled back: InstalledPackage.${pkg_bo1_id}.status == INSTALLED"
            - "InstalledPackage.${pkg_bo2_id}.status == INSTALLED and InstalledPackage.${pkg_bo3_id}.status == INSTALLED"
            - "Environment.${env_bo_id}.installed_version_ids contains exactly three entries"
            - "the response reports Environment.${env_bo_id}.next_refresh_at as null, because the projection is materialised on the first refresh rather than at creation"
